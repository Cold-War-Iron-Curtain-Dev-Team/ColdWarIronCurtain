l_french:
 FIN_70s_1970_elections:0 "Élections parlementaires de 1970"
 FIN_70s_1970_elections_desc:0 "Les élections parlementaires de mars 1970 se sont révélées être un séisme politique sans précédent dans la Finlande d'après-guerre. Les changements démographiques rapides, l'agriculture mécanisée et l'exode rural vers les villes et la Suède ont généré un intense ressentiment populaire. Le Parti rural populiste finlandais (SMP), qui faisait campagne sous Veikko Vennamo en faveur du « peuple oublié », est passé d'un seul siège à dix-huit. La coalition gouvernementale traditionnelle a été ébranlée, obligeant les principaux partis à réexaminer le développement régional, les subventions agricoles et l'aliénation des électeurs."
 FIN_70s_red_soil_coalition:0 "Renouveler la Coalition Terres Rouges"
 FIN_70s_red_soil_coalition_desc:0 "Le fondement de la stabilité politique finlandaise repose depuis longtemps sur la coopération entre le Parti social-démocrate (SDP) et le Parti du centre (Keskusta), l'alliance historique « Terre rouge » (Punamulta). Malgré des frictions mutuelles et des circonscriptions socio-économiques concurrentes, des hommes d'État comme Ahti Karjalainen et Kalevi Sorsa reconnaissent que seule une large coalition de centre-gauche peut fournir la majorité législative nécessaire pour gérer une gouvernance industrielle moderne et équilibrer la diplomatie Est-Ouest."
 FIN_70s_curb_smp_populism:0 "Répondre aux griefs ruraux"
 FIN_70s_curb_smp_populism_desc:0 "La rhétorique populiste de Veikko Vennamo a touché une corde sensible parmi les petits exploitants et les anciens combattants pauvres du nord et de l'est de la Finlande qui se sentaient abandonnés par les technocrates d'Helsinki. Pour désamorcer la colère populiste, le gouvernement doit étendre les programmes de soutien régionaux ciblés (kehitysaluelainsäädäntö), améliorer les infrastructures de transport locales à Kainuu et Savo et garantir des prix minimums pour la production agricole."
 FIN_70s_manage_leftwing_split:0 "Gérer le schisme de gauche"
 FIN_70s_manage_leftwing_split_desc:0 "La Ligue démocratique du peuple finlandais (SKDL) et le Parti communiste (SKP) sont profondément divisés. La faction réformiste majoritaire dirigée par le syndicaliste Aarne Saarinen prône le parlementarisme démocratique, l'expansion de la protection sociale dans les pays nordiques et l'autonomie par rapport à Moscou. À l'inverse, la minorité marxiste-léniniste orthodoxe - les « taistoïstes » dirigés par Taisto Sinisalo - exige une loyauté totale à l'orthodoxie soviétique et contrôle les syndicats étudiants et les associations culturelles. Une politique prudente est nécessaire pour éviter que ce schisme ne paralyse les relations industrielles."
 FIN_70s_poikkeuslaki:0 "La loi d'exception de 1973"
 FIN_70s_poikkeuslaki_desc:0 "Alors que les délicates négociations de libre-échange de la CEE atteignaient une étape décisive à la fin de 1972, les dirigeants politiques craignaient qu'une campagne électorale meurtrière de 1974 puisse alarmer les dirigeants soviétiques ou mettre en péril les accords de marché occidentaux. En janvier 1973, à une écrasante majorité des cinq sixièmes (170 voix contre 34), le Parlement a adopté la loi d'exception (Poikkeuslaki), prolongeant le mandat du président Urho Kekkonen de quatre années supplémentaires sans élection. Bien que controversé parmi les puristes constitutionnels, il assurait une continuité absolue à la tête de l'État."
 FIN_70s_national_emergency_cabinet:0 "Armoire d'urgence de Miettunen"
 FIN_70s_national_emergency_cabinet_desc:0 "Lorsque la récession mondiale post-choc pétrolier a déclenché une hausse du chômage et une impasse politique à la fin de 1975, le président Kekkonen a pris la mesure extraordinaire de convoquer les dirigeants des partis au palais présidentiel et d'exiger la formation immédiate d'un « gouvernement national d'urgence » multipartite (hätätilahallitus) sous la direction du vétéran agraire Martti Miettunen. Subordonnant les conflits partisans à la volonté présidentielle, le cabinet a adopté des travaux publics d'urgence et des mesures de stabilisation budgétaire."
 FIN_70s_1978_consensus_election:0 "Le consensus multipartite de 1978"
 FIN_70s_1978_consensus_election_desc:0 "En 1978, la ligne Paasikivi-Kekkonen jouissait d'un consensus national pratiquement universel. Les quatre partis politiques dominants - Keskusta, le SDP, Kokoomus et le SKDL - ainsi que les partis libéraux et minoritaires suédois se sont réunis dans un cartel électoral pour soutenir la réélection d'Urho Kekkonen. Kekkonen a obtenu 259 voix sur 300 au collège électoral, démontrant une unité nationale quasi monolithique derrière sa gestion de la politique étrangère."
 FIN_70s_kekkonen_zenith:0 "L'apogée de l'ère Kekkonen"
 FIN_70s_kekkonen_zenith_desc:0 "Au sommet de son influence, le président Urho Kekkonen exerce une autorité inégalée par aucun autre chef d'État démocrate en Europe. Vénérant sa maîtrise diplomatique, les politiciens finlandais de toutes factions entretiennent des liens avec Tamminiemi et rivalisent pour les faveurs présidentielles. Kekkonen joue le rôle d'arbitre ultime en matière de formation du gouvernement, de compromis industriel et de relations avec la superpuissance soviétique."
 FIN_80s_kekkonen_resignation:0 "La démission du président Kekkonen"
 FIN_80s_kekkonen_resignation_desc:0 "Lors d'une visite officielle en Islande à la fin de l'été 1981, le président Kekkonen souffrit de graves pertes de mémoire et d'un épuisement physique causés par l'avancée de l'artériosclérose cérébrale. Le 26 octobre 1981, après vingt-cinq années historiques au pouvoir, Kekkonen présente sa démission officielle. Le Premier ministre Mauno Koivisto a assumé les fonctions présidentielles en tant que chef de l'État par intérim, marquant ainsi la fin digne d'une époque de l'histoire finlandaise."
 FIN_80s_1982_presidential_election:0 "L'élection présidentielle de 1982"
 FIN_80s_1982_presidential_election_desc:0 "L'élection présidentielle de janvier 1982 a galvanisé la société finlandaise, avec le taux de participation le plus élevé depuis des décennies. Le Premier ministre Mauno Koivisto (« Manu »), immensément populaire pour son calme, son origine ouvrière et son esprit d'érudit, a triomphé lors d'un glissement de terrain historique avec 167 voix au collège électoral. Pour la première fois depuis la fondation de la République, un social-démocrate accède à la présidence."
 FIN_80s_koivisto_era:0 "La présidence Koivisto"
 FIN_80s_koivisto_era_desc:0 "Le président Mauno Koivisto apporte un changement délibéré dans la culture présidentielle : un « profil réduit » (madallettu profiili). Rejetant l'interventionnisme personnel dramatique de son prédécesseur, Koivisto met l'accent sur la retenue constitutionnelle, les délibérations calmes et le respect institutionnel du cabinet et du parlement."
 FIN_80s_strengthen_parliamentarism:0 "Renforcer le parlementarisme"
 FIN_80s_strengthen_parliamentarism_desc:0 "Reconnaissant que les vastes prérogatives présidentielles accumulées au cours des décennies d'après-guerre mettaient en danger la responsabilité démocratique, le président Koivisto défend les révisions constitutionnelles. Les pouvoirs du Premier ministre et de l'Eduskunta sont renforcés de manière décisive, stipulant que le président ne peut dissoudre le Parlement que sur demande motivée du Premier ministre et après avoir entendu les groupes parlementaires."
 FIN_80s_presidential_term_limits:0 "Codifier les limites du mandat présidentiel"
 FIN_80s_presidential_term_limits_desc:0 "Afin de garantir qu'aucun individu ne puisse plus jamais détenir le pouvoir exécutif suprême pendant un quart de siècle, la commission de réforme constitutionnelle prépare un amendement fixant une limite stricte à deux mandats de six ans chacun. Cette réforme fait passer définitivement la Finlande d'une présidence semi-monarchique à une démocratie parlementaire européenne moderne et équilibrée."
 FIN_80s_sinipuna_coalition:0 "Le gouvernement historique bleu-rouge"
 FIN_80s_sinipuna_coalition_desc:0 "Après les élections législatives de 1987, le président Koivisto rompt avec des décennies de précédent politique en nommant Harri Holkeri (Kokoomus) au poste de Premier ministre à la tête d'une coalition historique « Bleu-Rouge » (Sinipuna) avec les sociaux-démocrates. Cela met fin à 21 ans d'exclusion du parti conservateur du gouvernement et brise le monopole historique du Parti du Centre sur la formation de la coalition."
 FIN_80s_pluralist_stability:0 "Le consensus démocratique moderne"
 FIN_80s_pluralist_stability_desc:0 "Alors que les années 1980 touchent à leur fin, la Finlande se présente comme une société égalitaire et pluraliste ancrée par des institutions démocratiques fortes, une grande confiance civique et un solide État de droit. Après avoir démantelé les anomalies constitutionnelles de la Guerre froide, la République est prête à affronter la profonde transformation géopolitique du continent européen."
 FIN_70s_active_peace_neutrality:0 "Neutralité active et en quête de paix"
 FIN_70s_active_peace_neutrality_desc:0 "La neutralité finlandaise n'est pas un isolationnisme ou un désengagement passif. Ancrée dans la ligne Paasikivi-Kekkonen, la politique étrangère de la Finlande cherche à établir des relations constructives avec toutes les nations, à désamorcer les tensions idéologiques Est-Ouest et à préserver la souveraineté nationale finlandaise grâce à un engagement international actif."
 FIN_70s_bridge_builder_diplomacy:0 "La doctrine du bâtisseur de ponts"
 FIN_70s_bridge_builder_diplomacy_desc:0 "Le président Kekkonen a qualifié la mission diplomatique finlandaise de « médecin et non de juge ». La Finlande ne cherche pas à faire la leçon ou à condamner les autres nations souveraines ; il offre plutôt de bons offices neutres, une médiation fiable et une construction silencieuse de ponts entre les blocs de puissance opposés de la guerre froide."
 FIN_70s_nordic_council_cooperation:0 "Harmoniser les politiques du Conseil nordique"
 FIN_70s_nordic_council_cooperation_desc:0 "La Finlande entretient une solidarité culturelle, juridique et économique intime avec ses voisins scandinaves à travers le Conseil nordique. La zone de voyage nordique sans passeport, le marché du travail commun et les principes partagés de protection sociale garantissent que la Finlande reste une partie organique de la communauté démocratique nordique."
 FIN_70s_un_peacekeeping_commitment:0 "Élargir les contingents de maintien de la paix de l'ONU"
 FIN_70s_un_peacekeeping_commitment_desc:0 "Les soldats de la paix finlandais ont acquis une renommée mondiale pour leur discipline, leur neutralité et leur excellence opérationnelle. Sous le drapeau des Nations Unies, les casques bleus finlandais servent avec distinction dans le Sinaï (FUNU II), sur le plateau du Golan (FNUOD) et dans le sud du Liban (FINUL), démontrant l'engagement pratique de la Finlande en faveur de la stabilité mondiale."
 FIN_70s_eec_free_trade_agreement:0 "Signez l'accord de libre-échange CEE"
 FIN_70s_eec_free_trade_agreement_desc:0 "Avec l'adhésion de la Grande-Bretagne et du Danemark à la Communauté économique européenne en 1973, la Finlande a été confrontée à la perte catastrophique des préférences tarifaires de l'AELE sur ses marchés d'exportation occidentaux les plus vitaux. Après des négociations tortueuses à Bruxelles, la Finlande a signé un accord de libre-échange avec la CEE, supprimant les droits de douane sur les produits manufacturés industriels tout en préservant sa neutralité politique."
 FIN_70s_comecon_protocol:0 "Protocole parallèle avec le COMECON"
 FIN_70s_comecon_protocol_desc:0 "Afin de préserver un équilibre strict entre l'Est et l'Ouest et de démontrer aux dirigeants soviétiques que l'accord CEE ne représentait aucune menace pour la coopération économique socialiste, la Finlande a négocié un accord de coopération historique avec le COMECON (SEV). La Finlande est devenue la première économie de marché non socialiste à conclure un traité formel avec l'organisation commerciale orientale."
 FIN_70s_convene_csce_summit:0 "Convoquez la CSCE à la salle Finlandia"
 FIN_70s_convene_csce_summit_desc:0 "Grâce à des initiatives diplomatiques inlassables dans les capitales européennes, les diplomates finlandais ont réussi à organiser la Conférence sur la sécurité et la coopération en Europe (CSCE/ETYK). En juillet et août 1975, les chefs d'État et de gouvernement de trente-cinq pays se sont réunis au Finlandia Hall d'Helsinki pour le plus grand sommet multilatéral de l'histoire européenne moderne."
 FIN_70s_helsinki_final_act:0 "L'Acte final d'Helsinki"
 FIN_70s_helsinki_final_act_desc:0 "Le 1er août 1975, trente-cinq dirigeants mondiaux, dont Gerald Ford, Leonid Brejnev, Harold Wilson et Helmut Schmidt, ont signé l'Acte final historique d'Helsinki. Le document équilibre la reconnaissance des frontières européennes d'après-guerre et la non-intervention avec des engagements contraignants en faveur de la coopération économique et des droits de l'homme universels."
 FIN_70s_spirit_of_helsinki:0 "L'esprit d'Helsinki"
 FIN_70s_spirit_of_helsinki_desc:0 "Le sommet a donné naissance à « l'esprit d'Helsinki », devenant le symbole déterminant de la détente de la guerre froide. En facilitant le dialogue entre les superpuissances et en inscrivant les droits de l'homme dans le droit international européen, la Finlande a élevé son prestige international à un sommet sans précédent."
 FIN_70s_rebuff_ustinov_proposal:0 "Rejeter les manoeuvres soviétiques conjointes"
 FIN_70s_rebuff_ustinov_proposal_desc:0 "En juillet 1978, le ministre soviétique de la Défense, le maréchal Dmitri Ustinov, s'est rendu à Helsinki et a proposé d'organiser des exercices militaires conjoints en temps de paix entre l'Armée rouge et les forces de défense finlandaises dans le cadre du traité YYA. Le président Kekkonen et le chef de la Défense Lauri Sutela ont poliment mais sans équivoque refusé, insistant sur le fait que la neutralité finlandaise nécessite une défense nationale indépendante."
 FIN_70s_nordic_nuclear_free_zone:0 "Promouvoir la zone nordique dénucléarisée"
 FIN_70s_nordic_nuclear_free_zone_desc:0 "Le président Kekkonen a toujours plaidé en faveur d'une zone nordique exempte d'armes nucléaires (Pohjolan ydinaseeton vyöhyke) pour protéger l'Europe du Nord de l'escalade nucléaire des superpuissances. La Finlande continue de parrainer des initiatives diplomatiques multilatérales visant à maintenir les armes de destruction massive hors des régions baltes et arctiques."
 FIN_80s_madallettu_profiili:0 "Une diplomatie pragmatique et prudente"
 FIN_80s_madallettu_profiili_desc:0 "Le président Koivisto mène la politique étrangère finlandaise avec la retenue qui le caractérise. En honorant les traités bilatéraux existants tout en évitant les grandes déclarations idéologiques, la Finlande préserve discrètement sa souveraineté et approfondit progressivement son intégration avec les institutions économiques de l'Europe occidentale."
 FIN_80s_perestroika_engagement:0 "Engagez-vous dans la perestroïka soviétique"
 FIN_80s_perestroika_engagement_desc:0 "L'avènement de Mikhaïl Gorbatchev en 1985 et l'avènement de la Glasnost et de la Perestroïka modifient fondamentalement l'atmosphère politique de l'Union soviétique. Le président Koivisto et le ministère finlandais des Affaires étrangères établissent un dialogue personnel chaleureux avec Gorbatchev, soutenant les tendances réformistes tout en gérant soigneusement la stabilité régionale."
 FIN_80s_european_reorientation:0 "Préparez-vous à l'intégration européenne"
 FIN_80s_european_reorientation_desc:0 "Alors que les rigidités de la Guerre froide se dissolvent sur tout le continent, la Finlande rejoint le Conseil de l'Europe en 1989 et entame les négociations sur l'Espace économique européen (EEE). La Finlande se prépare à prendre pleinement sa place au sein de l'architecture européenne émergente en tant que partenaire démocratique souverain et confiant."
 FIN_70s_five_year_clearing_trade:0 "Un échange de compensation soviétique sur cinq ans"
 FIN_70s_five_year_clearing_trade_desc:0 "Les accords commerciaux bilatéraux de compensation (idänkauppa) administrés par l'intermédiaire de la Vneshtorgbank constituent un moteur vital de l'industrie lourde finlandaise. Sans avoir besoin de rares monnaies occidentales convertibles, la Finlande échange des produits manufacturés avancés, des navires et des machines d'ingénierie contre du pétrole brut, du gaz naturel et du bois brut soviétiques."
 FIN_70s_arctic_shipbuilding:0 "Chantiers navals arctiques de Wärtsilä et Rauma"
 FIN_70s_arctic_shipbuilding_desc:0 "Les chantiers navals finlandais, menés par les chantiers Wärtsilä à Helsinki et Turku, ainsi que Rauma-Repola, sont à la pointe du monde en matière de technologie spécialisée en matière de déglaçage. En construisant des brise-glaces polaires nucléaires et diesel-électriques, des transporteurs de fret spécialisés dans l'Arctique et des paquebots de croisière de luxe, les chantiers finlandais maintiennent des milliers d'emplois d'ingénierie bien rémunérés."
 FIN_70s_cross_border_kostamus:0 "Le mégaprojet minier de Kostomuksha"
 FIN_70s_cross_border_kostamus_desc:0 "Dans le cadre d'un accord bilatéral massif, des milliers d'ouvriers du bâtiment, d'ingénieurs et d'entreprises de machinerie lourde finlandaises construisent l'immense usine de pelletisation du minerai de fer et la nouvelle ville de Kostomuksha (Kostamus) en Carélie soviétique. Le projet constitue une bouée de sauvetage économique pour la région frontalière sous-développée de Kainuu."
 FIN_70s_insulate_from_oil_shocks:0 "Isolez-vous contre les chocs pétroliers mondiaux"
 FIN_70s_insulate_from_oil_shocks_desc:0 "Lorsque les crises pétrolières de l'OPEP de 1973 et 1979 ont plongé les économies occidentales dans la stagflation, le système de compensation bilatéral de la Finlande a servi de stabilisateur économique automatique. La hausse des prix du brut soviétique importé a automatiquement augmenté les quotas d'achat soviétiques pour les exportations finlandaises, permettant ainsi aux usines finlandaises de fonctionner à pleine capacité."
 FIN_70s_nuclear_power_program:0 "L'Initiative sur l'énergie nucléaire"
 FIN_70s_nuclear_power_program_desc:0 "Pour réduire sa dépendance à l'égard des importations de combustibles fossiles et fournir une électricité de base bon marché aux industries lourdes forestières et métallurgiques, la Finlande se lance dans un programme d'énergie nucléaire civile, garantissant les normes les plus élevées de sécurité et d'ingénierie."
 FIN_70s_loviisa_eastinghouse:0 "Commission Centrale Nucléaire de Loviisa"
 FIN_70s_loviisa_eastinghouse_desc:0 "Le service public Imatran Voima (IVO) met en service la centrale nucléaire de Loviisa à Uusimaa. Combinant des réacteurs à eau sous pression soviétiques VVER-440 avec un confinement de condenseur à glace occidental et des systèmes de sécurité automatisés Westinghouse-Siemens, cet hybride unique est affectueusement baptisé « Eastinghouse »."
 FIN_70s_olkiluoto_bwr:0 "Commission des réacteurs BWR d'Olkiluoto"
 FIN_70s_olkiluoto_bwr_desc:0 "Le consortium industriel privé Teollisuuden Voima (TVO) engage la société suédoise ASEA-Atom pour construire deux réacteurs à eau bouillante à Olkiluoto, sur la côte sud-ouest, apportant ainsi la technologie nucléaire scandinave moderne pour alimenter l'industrie finlandaise."
 FIN_70s_national_grid_ivo:0 "Développez le réseau national IVO et Neste"
 FIN_70s_national_grid_ivo_desc:0 "Imatran Voima construit l'infrastructure de transport à haute tension de 400 kV à l'échelle nationale, tandis que la compagnie pétrolière nationale Neste agrandit sa raffinerie de pétrole et son complexe pétrochimique de pointe à Sköldvik à Porvoo, établissant ainsi une infrastructure énergétique de classe mondiale."
 FIN_70s_welfare_state_foundation:0 "Le consensus nordique sur le bien-être"
 FIN_70s_welfare_state_foundation_desc:0 "Ayant atteint l'industrialisation d'après-guerre, la Finlande se consacre à achever l'État-providence nordique. Fondé sur des valeurs égalitaires, la sécurité sociale et les droits universels, l'État-providence garantit à chaque citoyen l'accès à l'éducation, aux soins de santé et à la dignité humaine."
 FIN_70s_peruskoulu_reform:0 "Achever la réforme scolaire de Peruskoulu"
 FIN_70s_peruskoulu_reform_desc:0 "Déployée progressivement depuis le nord de la Finlande entre 1972 et 1977, la réforme scolaire globale (Peruskoulu) remplace les anciennes écoles civiques et secondaires divisées par une école polyvalente unique, universelle et financée par l'État, d'une durée de neuf ans, pour tous les enfants, indépendamment de leur richesse ou de leurs antécédents familiaux."
 FIN_70s_kansanterveyslaki:0 "La loi sur la santé publique de 1972"
 FIN_70s_kansanterveyslaki_desc:0 "La loi historique sur la santé publique (Kansanterveyslaki) de 1972 exige que chaque municipalité établisse un centre de santé publique (terveyskeskus) offrant des soins préventifs gratuits, des visites chez le médecin, des services dentaires et des cliniques maternelles (neuvola), établissant ainsi l'un des taux de mortalité infantile les plus bas au monde."
 FIN_70s_paivahoitolaki:0 "Loi universelle sur la garde d'enfants de 1973"
 FIN_70s_paivahoitolaki_desc:0 "La loi sur les garderies d'enfants de 1973 garantit des services de garde d'enfants municipaux publics aux parents qui travaillent. En libérant les mères des contraintes liées à l'éducation de leurs enfants à la maison, la Finlande atteint le taux de participation féminine au marché du travail le plus élevé du monde démocratique."
 FIN_70s_tupo_framework:0 "Politique tripartite des revenus (TUPO)"
 FIN_70s_tupo_framework_desc:0 "Des accords globaux sur la politique des revenus (tulopoliittinen kokonaisratkaisu - TUPO) rassemblent l'Organisation centrale des syndicats finlandais (SAK), les fédérations d'employeurs (STK) et l'État dans des accords salariaux centralisés, freinant l'inflation et garantissant la paix sociale."
 FIN_80s_found_tekes:0 "Création de l'Agence Technologique (TEKES)"
 FIN_80s_found_tekes_desc:0 "Créée en 1983, l'Agence nationale de technologie (TEKES) canalise des financements publics ciblés vers la recherche technologique et l'innovation industrielle appliquée, reliant les universités, les laboratoires de recherche et les entreprises privées dynamiques."
 FIN_80s_nmt_cellular_network:0 "Lancez le téléphone mobile nordique (NMT)"
 FIN_80s_nmt_cellular_network_desc:0 "En 1981, les administrations des télécommunications nordiques lancent le réseau Nordic Mobile Telephone (NMT-450, suivi du NMT-900), le premier réseau de téléphonie mobile commercial entièrement automatisé au monde avec itinérance internationale dans les pays nordiques."
 FIN_80s_nokia_mobira_expansion:0 "Pivot des télécommunications Nokia et Mobira"
 FIN_80s_nokia_mobira_expansion_desc:0 "Sous la direction du charismatique PDG Kari Kairamo, le conglomérat industriel Nokia se transforme d'un producteur traditionnel de bottes en caoutchouc et de papier en un pionnier de l'électronique de haute technologie. Nokia acquiert Salora, développe Mobira et fabrique des téléphones mobiles révolutionnaires comme le Mobira Senator, Talkman et Cityman 900."
 FIN_80s_financial_deregulation:0 "Déréguler les marchés des capitaux"
 FIN_80s_financial_deregulation_desc:0 "Suivant les tendances financières mondiales, la Banque de Finlande et le ministère des Finances démantelent le contrôle des taux d'intérêt, abolissent les quotas de prêt et autorisent les entreprises finlandaises à emprunter directement en devises étrangères."
 FIN_80s_kasinotalous_boom:0 "Le boom de « l'économie des casinos »"
 FIN_80s_kasinotalous_boom_desc:0 "La libéralisation financière rapide déclenche un boom économique sans précédent à la fin des années 1980 : « l'économie du casino » (Kasino-talous). Les cours des actions montent en flèche, l'immobilier commercial est en plein essor, les dépenses de consommation atteignent des sommets records et les raids d'entreprises finlandaises font la une des journaux dans toute l'Europe."
 FIN_70s_territorial_defense_doctrine:0 "La doctrine de la défense territoriale"
 FIN_70s_territorial_defense_doctrine_desc:0 "Le général Lauri Sutela codifie la doctrine de défense territoriale (Alueellinen puolustusjärjestelmä). Reconnaissant que la Finlande ne peut rivaliser avec les blindés des superpuissances dans les affrontements frontaux, la doctrine prépare une défense tactique en profondeur à travers les forêts, les lacs et les archipels, en utilisant un commandement décentralisé dans 27 districts militaires pour épuiser et détruire tout agresseur."
 FIN_70s_paris_treaty_reinterpretation:0 "Maintenir les limites du Traité de Paris"
 FIN_70s_paris_treaty_reinterpretation_desc:0 "Le Traité de paix de Paris de 1947 limite l'armée d'active à 34 400 hommes, la marine à 10 000 tonnes et l'armée de l'air à 60 avions de combat, tout en interdisant les missiles offensifs. La Finlande respecte scrupuleusement les plafonds d'activité tout en formant des cadres de réserve massifs capables d'une mobilisation rapide en cas d'urgence nationale."
 FIN_70s_total_defense_concept:0 "Le concept de défense totale"
 FIN_70s_total_defense_concept_desc:0 "La défense finlandaise englobe l'ensemble du pays : des abris de protection civile obligatoires creusés dans le substrat rocheux, des stocks économiques stratégiques de céréales et de carburant et une formation de recyclage rigoureuse pour 500 000 réservistes militaires."
 FIN_70s_procure_mig21bis:0 "Procurer des intercepteurs soviétiques MiG-21bis"
 FIN_70s_procure_mig21bis_desc:0 "L'armée de l'air finlandaise acquiert des intercepteurs tout temps MiG-21bis modernes équipés de radars et de missiles air-air R-60 pour le Fighter Squadron 31 basé à Kuopio/Rissala, maintenant ainsi un approvisionnement équilibré auprès de l'URSS."
 FIN_70s_valmet_draken_assembly:0 "Assemblez le Saab 35 Draken à Kuorevesi"
 FIN_70s_valmet_draken_assembly_desc:0 "Sous licence du suédois Saab, Valmet Lentokoneteollisuus assemble des intercepteurs supersoniques Saab 35FS et 35XS Draken à Kuorevesi pour équiper le Lapland Fighter Squadron 11 à Rovaniemi, qui garde l'espace aérien du nord de la Finlande."
 FIN_70s_valmet_hawk_trainers:0 "Assembler les entraîneurs BAE Hawk Jet"
 FIN_70s_valmet_hawk_trainers_desc:0 "Pour remplacer les avions d'entraînement français vieillissants Fouga Magister, la Finlande commande des avions d'entraînement britanniques BAE Hawk Mk.51. Quarante-six des cinquante avions sont assemblés localement par Valmet, offrant ainsi à l'aviation militaire finlandaise une infrastructure de formation des pilotes inégalée."
 FIN_70s_valmet_rk62_standardization:0 "Standardiser les Valmet Rk 62 & Rk 76"
 FIN_70s_valmet_rk62_standardization_desc:0 "Considérés comme l'un des meilleurs fusils d'assaut au monde, le Valmet Rk 62 et le récepteur estampillé Rk 76 en calibre 7,62 x 39 mm sont distribués à toutes les unités d'infanterie actives et de réserve, offrant une précision et une fiabilité inégalées dans des conditions arctiques inférieures à zéro."
 FIN_80s_soviet_t72m1_tanks:0 "Acquérir des chars soviétiques T-72M1"
 FIN_80s_soviet_t72m1_tanks_desc:0 "Pour moderniser la brigade blindée (Panssariprikaati) à Parola, la Finlande achète des chars de combat principaux soviétiques modernes T-72M1 équipés de canons à âme lisse de 125 mm, d'un blindage composite et de télémètres laser, remplaçant le blindage obsolète T-54/55."
 FIN_80s_sisu_pasi_apc:0 "Adoptez le Sisu XA-180 'Pasi' 6x6 APC"
 FIN_80s_sisu_pasi_apc_desc:0 "Sisu-Auto produit le véhicule blindé de transport de troupes amphibie Sisu XA-180 'Pasi' 6x6. Très mobile, résistant aux mines et capable d'opérer dans la neige, les marécages et les rivières, le Pasi devient l'épine dorsale des formations jaeger mécanisées et des déploiements de maintien de la paix de l'ONU."
 FIN_80s_tampella_heavy_artillery:0 "Produire de l'artillerie Tampella 155 K 83"
 FIN_80s_tampella_heavy_artillery_desc:0 "Le fabricant d'armes finlandais Tampella développe l'obusier lourd de campagne 155 K 83, de renommée mondiale, capable de tirer des obus explosifs sur une distance de 30 kilomètres avec une précision extrême, améliorant considérablement la puissance de feu des brigades d'artillerie finlandaises."
 FIN_80s_helsinki_class_missile_boats:0 "Commission des bateaux lance-missiles de classe Helsinki"
 FIN_80s_helsinki_class_missile_boats_desc:0 "Les chantiers navals de Wärtsilä construisent quatre engins d'attaque rapide de classe Helsinki pour la marine finlandaise, armés de missiles antinavires suédois RBS-15, de canons Bofors de 57 mm et de suites de guerre électronique modernes pour défendre les approches côtières finlandaises."
 FIN_80s_pohjanmaa_minelayer:0 "Commission poseur de mines Pohjanmaa"
 FIN_80s_pohjanmaa_minelayer_desc:0 "Construit à Helsinki, le poseur de mines Pohjanmaa entre en service en tant que fier vaisseau amiral de la marine finlandaise et navire-école pour les cadets de la marine, capable de poser de vastes champs de mines défensifs dans les passages côtiers peu profonds de la Baltique."
 FIN_80s_coastal_artillery_forts:0 "Moderniser les forts des forteresses côtières"
 FIN_80s_coastal_artillery_forts_desc:0 "Les forteresses d'artillerie côtière lourde, abritant des tourelles de 100 mm et 130 mm profondément ancrées dans les bunkers des îles en granit, sont améliorées grâce à des radars modernes, des télémètres laser et des munitions à guidage laser, transformant le golfe de Finlande en une barrière défensive impénétrable."
 FIN_80s_invulnerable_homeland:0 "La Redoute Inviolable Finlandaise"
 FIN_80s_invulnerable_homeland_desc:0 "Combinant la défense territoriale de l'ensemble de la société avec des équipements modernes, un moral élevé et de profondes réserves stratégiques, les Forces de défense finlandaises constituent un moyen de dissuasion incontestable contre toute agression étrangère potentielle."
 FIN_kekkonen_supremacy:0 "La suprématie exécutive de Kekkonen"
 FIN_kekkonen_supremacy_desc:0 "Le président Urho Kekkonen exerce une autorité totale sur la politique finlandaise, garantissant la discipline de la politique étrangère et la continuité complète de l'exécutif."
 FIN_sinipuna_cooperation_idea:0 "Le consensus bleu-rouge"
 FIN_sinipuna_cooperation_idea_desc:0 "La coopération entre Kokoomus et les sociaux-démocrates apporte de larges majorités législatives et une gouvernance stable et tournée vers l'avenir."
 FIN_eec_free_trade_idea:0 "Accord de libre-échange de la CEE"
 FIN_eec_free_trade_idea_desc:0 "Le commerce industriel en franchise de droits avec les marchés d'Europe occidentale alimente l'expansion des industries finlandaises de la foresterie, de la métallurgie et de l'ingénierie."
 FIN_spirit_of_helsinki:0 "L'esprit d'Helsinki"
 FIN_spirit_of_helsinki_desc:0 "Les accords d'Helsinki de 1975 ont élevé la position mondiale de la Finlande en tant que champion de la détente européenne, du dialogue multilatéral et des droits de l'homme universels."
 FIN_soviet_clearing_trade_idea:0 "Commerce de compensation bilatéral soviétique"
 FIN_soviet_clearing_trade_idea_desc:0 "Des accords commerciaux de cinq ans avec l'URSS garantissent une demande constante de brise-glaces, de machines et de biens de consommation finlandais en échange de pétrole brut."
 FIN_peruskoulu_comprehensive_school:0 "Éducation complète de Peruskoulu"
 FIN_peruskoulu_comprehensive_school_desc:0 "Le système scolaire universel de neuf ans offre une éducation égalitaire de classe mondiale à chaque enfant finlandais, quelle que soit son origine."
 FIN_nmt_telecom_pioneer:0 "Pionnier des télécommunications NMT"
 FIN_nmt_telecom_pioneer_desc:0 "Le réseau cellulaire Nordic Mobile Telephone fait de la Finlande un leader mondial en matière de télécommunications et d'électronique sans fil."
 FIN_alueellinen_puolustus_doctrine:0 "Doctrine de défense territoriale"
 FIN_alueellinen_puolustus_doctrine_desc:0 "Une défense territoriale profonde et décentralisée à travers les forêts, les lacs et les archipels finlandais garantit que tout envahisseur fera face à une résistance prolongée et épuisante."
 FIN_kasinotalous_boom_idea:0 "Boom de l'économie des casinos"
 FIN_kasinotalous_boom_idea_desc:0 "La déréglementation des marchés financiers et la libéralisation des emprunts étrangers ont déclenché un boom massif de la consommation et des investissements."
 fin.204.t2:0 "La question du mandat présidentiel de 1974"
 fin.204.d:0 "Alors que le troisième mandat du président Kekkonen touche à sa fin, la situation internationale délicate et les négociations en cours sur l'accord de libre-échange avec la CEE dominent le débat national. Le Parlement doit décider s'il doit poursuivre les procédures électorales standard ou adopter une législation exceptionnelle."
 fin.204.a2:0 "Adoptez la loi d'exception pour reconduire Kekkonen dans ses fonctions"
 fin.204.b2:0 "Le candidat conservateur Matti Virkkunen remporte les élections"
 fin.204.c2:0 "Le candidat social-démocrate Rafael Paasio remporte les élections"
 fin.205.t2:0 "L'élection présidentielle de 1978"
 fin.205.d:0 "L'élection présidentielle de 1978 approche sous la bannière d'un large consensus national. Le président Kekkonen est soutenu par tous les principaux partis politiques, même si son challenger Raino Westerholm mène une candidature de protestation chrétienne conservatrice."
 fin.205.a2:0 "Réélire Urho Kekkonen avec le soutien de tous les partis"
 fin.205.b2:0 "Surprise surprise pour Raino Westerholm"
 fin.206.t2:0 "L'élection présidentielle de 1982"
 fin.206.d:0 "Suite à la démission du président Kekkonen en raison de problèmes de santé, la Finlande organise sa première élection présidentielle ouverte depuis des décennies. Le Premier ministre Mauno Koivisto mène la liste des sociaux-démocrates avec un immense succès populaire contre Harri Holkeri (Kokoomus) et Johannes Virolainen (Keskusta)."
 fin.206.a2:0 "Mauno Koivisto remporte une victoire écrasante historique"
 fin.206.b2:0 "Harri Holkeri et la coalition nationale triomphent"
 fin.206.c2:0 "Johannes Virolainen assure la présidence du Parti du Centre"
