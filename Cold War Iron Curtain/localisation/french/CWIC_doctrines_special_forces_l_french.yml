l_french:
  cw_sf_mass_airborne: "Forces aéroportées de masse"
  cw_sf_mass_airborne_desc: "De grands établissements aéroportés et des forces spéciales construits pour une mobilité stratégique et un grand nombre, sur le modèle du VDV soviétique et du corps aéroporté américain."
  cw_sf_elite_commandos: "Corps de commandos d'élite"
  cw_sf_elite_commandos_desc: "De petites forces spéciales rigoureusement sélectionnées qui échangent leurs chiffres contre de l'endurance et de l'autosuffisance, sur le modèle des SAS britanniques et de Sayeret Matkal."
  cw_sf_unconventional_warfare: "Corps de guerre non conventionnel"
  cw_sf_unconventional_warfare_desc: "Les forces spéciales qui travaillent par, avec et à travers les forces partenaires et irrégulières, les forces spéciales américaines, les comandos portugais et le modèle de guerre de brousse rhodésien consistant à vivre de la terre loin de l'armée principale."
  cw_sf_deep_reconnaissance: "Reconnaissance profonde et sabotage"
  cw_sf_deep_reconnaissance_desc: "Les forces spéciales comme arme stratégique de reconnaissance et de sabotage, sur le modèle du GRU Spetsnaz soviétique, des compagnies sud-africaines de reconnaissance et des compagnies LRRP : rapides, profondes, peu approvisionnées."
  cw_sf_airborne_assault: "Assaut aéroporté"
  cw_sf_airborne_assault_desc: "Des parachutages massifs qui ont placé des bataillons entiers derrière la ligne ennemie, depuis Arnhem et Varsity jusqu'aux exercices soviétiques VDV des années 1950."
  cw_sf_airborne_assault_reward_1: "Gouttes de réapprovisionnement"
  cw_sf_airborne_assault_reward_2: "Pipeline d'école de saut"
  cw_sf_airborne_assault_reward_3: "Choc d'infanterie légère"
  cw_sf_airborne_assault_reward_4: "Enveloppement vertical"
  cw_sf_airborne_assault_reward_5: "Expansion du Corps aéroporté"
  cw_sf_pathfinder_infiltration: "Infiltration des éclaireurs"
  cw_sf_pathfinder_infiltration_desc: "Petites équipes insérées par parachute en chute libre depuis l'altitude pour marquer les zones de largage et les objectifs de reconnaissance, les méthodes HALO et HAHO se sont développées à partir du début des années 1960."
  cw_sf_pathfinder_infiltration_reward_1: "Chute libre à haute altitude"
  cw_sf_pathfinder_infiltration_reward_2: "Marquage de la zone de dépôt"
  cw_sf_pathfinder_infiltration_reward_3: "Insertion furtive"
  cw_sf_pathfinder_infiltration_reward_4: "Explorateurs de frappe profonde"
  cw_sf_pathfinder_infiltration_reward_5: "Largages de reconnaissance à longue portée"
  cw_sf_strategic_reserve_brigades: "Brigades de réserve stratégiques"
  cw_sf_strategic_reserve_brigades_desc: "Des brigades prêtes étaient maintenues en alerte brève pour un renforcement rapide des crises lointaines, comme avec la 82e division aéroportée américaine, la 16e brigade de parachutistes britannique et la 11e division de parachutistes française."
  cw_sf_strategic_reserve_brigades_reward_1: "Alerte Brigade prête"
  cw_sf_strategic_reserve_brigades_reward_2: "Répétition du transport aérien stratégique"
  cw_sf_strategic_reserve_brigades_reward_3: "Force prête à la division"
  cw_sf_strategic_reserve_brigades_reward_4: "Planification d'urgence"
  cw_sf_strategic_reserve_brigades_reward_5: "Doctrine des pompiers"
  cw_sf_mechanized_airborne: "Aéroporté mécanisé"
  cw_sf_mechanized_airborne_desc: "Des véhicules blindés aérolargables tels que le BMD soviétique qui permettent aux parachutistes de mener une bataille mobile une fois au sol plutôt qu'en tant qu'infanterie légère."
  cw_sf_mechanized_airborne_reward_1: "Armure largable par voie aérienne"
  cw_sf_mechanized_airborne_reward_2: "Formation sur le drop de plateforme"
  cw_sf_mechanized_airborne_reward_3: "Enveloppement vertical blindé"
  cw_sf_mechanized_airborne_reward_4: "Groupements tactiques aéroportés combinés"
  cw_sf_mechanized_airborne_reward_5: "Divisions mécanisées aéroportées"
  cw_sf_air_assault: "Assaut aérien"
  cw_sf_air_assault_desc: "Une infanterie légère héliportée qui s'empare et tient des zones d'atterrissage et des bases de feu, sur le modèle du 11e Air Assault Test américain et de la 101e division aéromobile au Vietnam."
  cw_sf_air_assault_reward_1: "Formation sur les ascenseurs rotatifs"
  cw_sf_air_assault_reward_2: "Points d'armement avancés"
  cw_sf_air_assault_reward_3: "Escorte d'hélicoptères de combat"
  cw_sf_air_assault_reward_4: "Défense de la zone d'atterrissage"
  cw_sf_air_assault_reward_5: "Divisions d'assaut aérien"
  cw_sf_gunship_cavalry: "Cavalerie de canonnière"
  cw_sf_gunship_cavalry_desc: "Les escadrons de cavalerie aérienne qui explorent, filtrent et chassent les blindés depuis des hélicoptères, les équipes de chasseurs-tueurs de la 1re Division de cavalerie du Vietnam et les régiments Mi-24 de l'armée soviétique."
  cw_sf_gunship_cavalry_reward_1: "Équipes de reconnaissance et de combat"
  cw_sf_gunship_cavalry_reward_2: "Paires chasseurs-tueurs"
  cw_sf_gunship_cavalry_reward_3: "Écran des flancs"
  cw_sf_gunship_cavalry_reward_4: "Doctrine des hélicoptères armés"
  cw_sf_gunship_cavalry_reward_5: "Escadrons de cavalerie aérienne"
  cw_sf_mounted_raiders: "Raiders montés"
  cw_sf_mounted_raiders_desc: "Des colonnes de Jeep et de Land Rover qui attaquent les aérodromes et les lignes de ravitaillement en rase campagne, le modèle du Long Range Desert Group repris par le SAS à Oman et dans le Sinaï."
  cw_sf_mounted_raiders_reward_1: "Navigation dans le désert"
  cw_sf_mounted_raiders_reward_2: "Véhicules de patrouille armée"
  cw_sf_mounted_raiders_reward_3: "Caches de carburant et d'eau"
  cw_sf_mounted_raiders_reward_4: "Raids sur les aérodromes"
  cw_sf_mounted_raiders_reward_5: "Colonnes de raid mobiles"
  cw_sf_pseudo_operations: "Pseudo-opérations"
  cw_sf_pseudo_operations_desc: "Des équipes se faisant passer pour des insurgés pour pénétrer dans les réseaux de guérilla et appeler des forces de frappe, comme le pratiquent les Scouts rhodésiens de Selous, les Flechas portugais et les Français en Algérie."
  cw_sf_pseudo_operations_reward_1: "Devenus insurgés"
  cw_sf_pseudo_operations_reward_2: "Identités de couverture"
  cw_sf_pseudo_operations_reward_3: "Repérage des forces de feu"
  cw_sf_pseudo_operations_reward_4: "Grèves transfrontalières"
  cw_sf_pseudo_operations_reward_5: "Régiments de pseudo-gangs"
  cw_sf_marine_amphibious: "Assaut amphibie marin"
  cw_sf_marine_amphibious_desc: "L'infanterie navale s'est organisée pour des débarquements opposés, depuis Inchon jusqu'à l'infanterie navale soviétique et chinoise des années 1950, soutenue par un transport amphibie spécialement construit."
  cw_sf_marine_amphibious_reward_1: "Entraînement d'assaut sur la plage"
  cw_sf_marine_amphibious_reward_2: "États-majors de planification amphibie"
  cw_sf_marine_amphibious_reward_3: "Amphibiens blindés"
  cw_sf_marine_amphibious_reward_4: "Consolidation de la tête de pont"
  cw_sf_marine_amphibious_reward_5: "Expansion du Corps des Marines"
  cw_sf_expeditionary_rapid_reaction: "Réaction rapide expéditionnaire"
  cw_sf_expeditionary_rapid_reaction_desc: "Brigades de commandos légères et marines coloniales qui se déploient à partir de porte-avions et de navires amphibies pour des interventions courtes et autosuffisantes comme Suez, Koweït 1961 et Zaïre."
  cw_sf_expeditionary_rapid_reaction_reward_1: "Escadrons de transport de commandos"
  cw_sf_expeditionary_rapid_reaction_reward_2: "Logistique à échelle légère"
  cw_sf_expeditionary_rapid_reaction_reward_3: "Raid et retrait"
  cw_sf_expeditionary_rapid_reaction_reward_4: "Cohésion du groupe-brigade"
  cw_sf_expeditionary_rapid_reaction_reward_5: "Brigades expéditionnaires"
  cw_sf_naval_infantry_armored: "Infanterie navale blindée"
  cw_sf_naval_infantry_armored_desc: "Infanterie navale dotée d'APC amphibies et de chars légers pour un atterrissage mécanisé rapide, le soviétique Morskaya Pekhota construit autour des BTR-60P et PT-76."
  cw_sf_naval_infantry_armored_reward_1: "Armure de natation"
  cw_sf_naval_infantry_armored_reward_2: "Groupes de chars de navires de débarquement"
  cw_sf_naval_infantry_armored_reward_3: "Exploitation des plages blindées"
  cw_sf_naval_infantry_armored_reward_4: "Coordination des incendies à terre"
  cw_sf_naval_infantry_armored_reward_5: "Régiments d'infanterie navale"
  cw_sf_riverine_littoral: "Guerre fluviale et littorale"
  cw_sf_riverine_littoral_desc: "L'infanterie des eaux brunes combat à partir d'embarcations fluviales dans les deltas et les marais, des Dinassauts français à la Force fluviale mobile américaine dans le Mékong."
  cw_sf_riverine_littoral_reward_1: "Opérations Delta"
  cw_sf_riverine_littoral_reward_2: "Groupes d'assaut fluvial"
  cw_sf_riverine_littoral_reward_3: "Bases flottantes"
  cw_sf_riverine_littoral_reward_4: "Patrouilles de la rivière dans la jungle"
  cw_sf_riverine_littoral_reward_5: "Brigades fluviales mobiles"
  cw_sf_mountain_troops: "Troupes de montagne"
  cw_sf_mountain_troops_desc: "Spécialistes alpins et himalayens qui traitent les crêtes et les cols comme des terrains à posséder, les Alpini, Gebirgsjaeger et les divisions de montagne indiennes créées après 1962."
  cw_sf_mountain_troops_reward_1: "Acclimatation à l'altitude"
  cw_sf_mountain_troops_reward_2: "Écoles de ski et d'escalade"
  cw_sf_mountain_troops_reward_3: "Défense de la ligne de crête"
  cw_sf_mountain_troops_reward_4: "Pack de soutien d'artillerie"
  cw_sf_mountain_troops_reward_5: "Divisions de montagne"
  cw_sf_arctic_winter_warfare: "Guerre arctique et hivernale"
  cw_sf_arctic_winter_warfare_desc: "Troupes de ski et infanterie par temps froid pour le flanc nord, des patrouilles de ski finlandaises aux brigades arctiques norvégiennes en passant par les exercices hivernaux soviétiques de Leningrad."
  cw_sf_arctic_winter_warfare_reward_1: "Patrouilles de ski"
  cw_sf_arctic_winter_warfare_reward_2: "Kit temps froid"
  cw_sf_arctic_winter_warfare_reward_3: "Embuscade dans la forêt et la neige"
  cw_sf_arctic_winter_warfare_reward_4: "Véhicules sur neige de l'Arctique"
  cw_sf_arctic_winter_warfare_reward_5: "Brigades arctiques"
  cw_sf_high_altitude_warfare: "Guerre à haute altitude"
  cw_sf_high_altitude_warfare_desc: "Des garnisons et des groupes d'attaque se sont entraînés pour combattre au-dessus de 4 000 mètres, depuis la guerre de l'Himalaya de 1962 jusqu'aux postes glaciaires de Siachen et à la campagne des montagnes des Malouines."
  cw_sf_high_altitude_warfare_reward_1: "Oxygène et acclimatation"
  cw_sf_high_altitude_warfare_reward_2: "Poteaux de montagne fixes"
  cw_sf_high_altitude_warfare_reward_3: "Trains porteurs et mulets"
  cw_sf_high_altitude_warfare_reward_4: "Réapprovisionnement en hélicoptère"
  cw_sf_high_altitude_warfare_reward_5: "Brigades de haute altitude"
  cw_sf_mountain_strike_raiders: "Raiders de frappe de montagne"
  cw_sf_mountain_strike_raiders_desc: "Troupes d'assaut en montagne qui s'infiltrent par-dessus les lignes de crête pour frapper les positions arrière, à la manière des Royal Marines sur le mont Longdon et de l'assaut israélien sur Hermon."
  cw_sf_mountain_strike_raiders_reward_1: "Infiltration de la crête nocturne"
  cw_sf_mountain_strike_raiders_reward_2: "Escalade d'assaut"
  cw_sf_mountain_strike_raiders_reward_3: "Équipes de mortier léger"
  cw_sf_mountain_strike_raiders_reward_4: "Embuscades dans les collines"
  cw_sf_mountain_strike_raiders_reward_5: "Bataillons d'assaut en montagne"
  cw_sf_ranger_raids: "Raids de rangers"
  cw_sf_ranger_raids_desc: "Bataillons de raid légers pour des frappes éclair sur les lignes de communication, des Darby's Rangers aux compagnies de Rangers de la guerre de Corée."
  cw_sf_ranger_raids_reward_1: "Cours de sélection des Rangers"
  cw_sf_ranger_raids_reward_2: "Tactiques de raid"
  cw_sf_ranger_raids_reward_3: "Endurance de l'infanterie légère"
  cw_sf_ranger_raids_reward_4: "Cadres endurcis"
  cw_sf_ranger_raids_reward_5: "Régiments de Rangers"
  cw_sf_long_range_patrols: "Patrouilles à longue portée"
  cw_sf_long_range_patrols_desc: "Des équipes de six hommes observent profondément derrière les lignes ennemies pendant des jours, les modèles vietnamiens LRRP et Recondo ainsi que les patrouilles de surveillance à longue portée soviétiques et britanniques du front central."
  cw_sf_long_range_patrols_reward_1: "Forets d'insertion de patrouille"
  cw_sf_long_range_patrols_reward_2: "Caches Stay-Behind"
  cw_sf_long_range_patrols_reward_3: "Cibler les équipes d'acquisition"
  cw_sf_long_range_patrols_reward_4: "Évasion et évasion"
  cw_sf_long_range_patrols_reward_5: "Entreprises de surveillance à longue portée"
  cw_sf_jungle_warfare_scouts: "Éclaireurs de guerre dans la jungle"
  cw_sf_jungle_warfare_scouts_desc: "Des traqueurs de petites unités qui patrouillent plus loin que les guérilleros dans la jungle, s'appuyant sur les Scouts malais, la Ferret Force, le SAS australien à Bornéo et les écoles de la jungle des Rangers."
  cw_sf_jungle_warfare_scouts_reward_1: "Suivi de la jungle"
  cw_sf_jungle_warfare_scouts_reward_2: "Exercices d'embuscade dans la jungle"
  cw_sf_jungle_warfare_scouts_reward_3: "Acclimatation tropicale"
  cw_sf_jungle_warfare_scouts_reward_4: "Patrouilles des coeurs et des esprits"
  cw_sf_jungle_warfare_scouts_reward_5: "Aile de guerre de la jungle"
  cw_sf_ranger_airfield_seizure: "Saisie d'un aérodrome"
  cw_sf_ranger_airfield_seizure_desc: "Des bataillons de raid capables de parachutistes qui prennent un aérodrome par coup de main et l'ouvrent aux forces de suivi, d'Entebbe et Kolwezi jusqu'au 75e régiment de Rangers à Grenade."
  cw_sf_ranger_airfield_seizure_reward_1: "Assaut en parachute à basse altitude"
  cw_sf_ranger_airfield_seizure_reward_2: "Équipes de dégagement des pistes"
  cw_sf_ranger_airfield_seizure_reward_3: "Répétition de déploiement rapide"
  cw_sf_ranger_airfield_seizure_reward_4: "Prise en charge des chutes lourdes"
  cw_sf_ranger_airfield_seizure_reward_5: "Régiments de Rangers en réserve"
  cw_sf_army_commandos: "Commandos de l'armée"
  cw_sf_army_commandos_desc: "De petites unités militaires d'élite pour l'action directe et le sabotage, depuis les SAS en Malaisie et à Oman jusqu'à Sayeret Matkal et les raids de la guerre des Six Jours."
  cw_sf_army_commandos_reward_1: "Sélection et évaluation"
  cw_sf_army_commandos_reward_2: "Ailes d'entraînement spécialisées"
  cw_sf_army_commandos_reward_3: "Forets à action directe"
  cw_sf_army_commandos_reward_4: "Bataille rapprochée"
  cw_sf_army_commandos_reward_5: "Commandement des opérations spéciales"
  cw_sf_counter_terror_assault: "Équipes d'assaut antiterroristes"
  cw_sf_counter_terror_assault_desc: "Des escadrons dédiés au sauvetage des otages se sont formés après Munich et Entebbe, du GSG 9 et de l'ambassade de Princes Gate en 1980 à l'assaut du 1er SFOD-Delta américain fondé en 1977."
  cw_sf_counter_terror_assault_reward_1: "Sélection de sauvetage des otages"
  cw_sf_counter_terror_assault_reward_2: "Tuer la formation à la maison"
  cw_sf_counter_terror_assault_reward_3: "Étourdissement et violation"
  cw_sf_counter_terror_assault_reward_4: "Alerte de réponse stratégique"
  cw_sf_counter_terror_assault_reward_5: "Groupe de travail de premier niveau"
  cw_sf_foreign_internal_defense: "Défense intérieure étrangère"
  cw_sf_foreign_internal_defense_desc: "Des détachements de type A-Team qui entraînent, conseillent et combattent aux côtés des forces partenaires locales, le modèle des forces spéciales américaines pour la guerre non conventionnelle et la contre-insurrection lancé à Fort Bragg en 1952."
  cw_sf_foreign_internal_defense_reward_1: "Orientation géographique et linguistique"
  cw_sf_foreign_internal_defense_reward_2: "Détachements de l'équipe A"
  cw_sf_foreign_internal_defense_reward_3: "Renforcement des forces autochtones"
  cw_sf_foreign_internal_defense_reward_4: "Équipes de formation mobiles"
  cw_sf_foreign_internal_defense_reward_5: "Groupes de forces spéciales"
  cw_sf_sapper_infiltration: "Infiltration de sapeurs"
  cw_sf_sapper_infiltration_desc: "Des sapeurs Dac cong qui rampent à travers les barbelés et frappent les bases aériennes et les quartiers généraux avec des charges de sacoche et des roquettes, la tradition d'infiltration vietnamienne et coréenne qui a culminé au Têt 1968."
  cw_sf_sapper_infiltration_reward_1: "Forets rampants à fil"
  cw_sf_sapper_infiltration_reward_2: "Assaut de charge de sacoche"
  cw_sf_sapper_infiltration_reward_3: "Camouflages et tunnels"
  cw_sf_sapper_infiltration_reward_4: "Infiltration en profondeur"
  cw_sf_sapper_infiltration_reward_5: "Régiments de sapeurs"
  cw_sf_spetsnaz_deep_sabotage: "Sabotage profond et décapitation"
  cw_sf_spetsnaz_deep_sabotage_desc: "Les brigades Spetsnaz se sont formées à partir de 1950 pour trouver des vecteurs nucléaires, des quartiers généraux et des aérodromes dans les arrières ennemis et les détruire dès les premières heures d'une guerre."
  cw_sf_spetsnaz_deep_sabotage_reward_1: "Reconnaissance de la zone arrière"
  cw_sf_spetsnaz_deep_sabotage_reward_2: "Chasseurs de livraisons nucléaires"
  cw_sf_spetsnaz_deep_sabotage_reward_3: "Réseaux d'agents et caches"
  cw_sf_spetsnaz_deep_sabotage_reward_4: "Plans de sabotage stratégiques"
  cw_sf_spetsnaz_deep_sabotage_reward_5: "Brigades Spetsnaz"
  cw_sf_stay_behind_networks: "Réseaux Stay-Behind"
  cw_sf_stay_behind_networks_desc: "Des cellules de volontaires locaux avec des armes cachées, des radios et des caches destinées à combattre derrière une armée d'occupation, du modèle des unités auxiliaires britanniques aux plans Gladio et Stay-behin nordiques de l'OTAN."
  cw_sf_stay_behind_networks_reward_1: "Caches d'armes cachées"
  cw_sf_stay_behind_networks_reward_2: "Bases de patrouille opérationnelles"
  cw_sf_stay_behind_networks_reward_3: "Liaison de la Résistance"
  cw_sf_stay_behind_networks_reward_4: "Sabotage sur le terrain"
  cw_sf_stay_behind_networks_reward_5: "Unités spéciales territoriales"
  cw_sf_naval_commandos: "Commandos navals"
  cw_sf_naval_commandos_desc: "Nageurs de combat et raiders de bateaux pour la pénétration du port et la reconnaissance côtière, le SBS, les successeurs italiens du Decima MAS et le Shayetet israélien 13."
  cw_sf_naval_commandos_reward_1: "Formation de plongeur de combat"
  cw_sf_naval_commandos_reward_2: "Reconnaissance de plage"
  cw_sf_naval_commandos_reward_3: "Pénétration du port"
  cw_sf_naval_commandos_reward_4: "Démolition de patelles"
  cw_sf_naval_commandos_reward_5: "Groupe de guerre spéciale navale"
  cw_sf_maritime_counter_terror: "Contre-terrorisme maritime"
  cw_sf_maritime_counter_terror_desc: "Des équipes formées à la reprise des navires et des plates-formes offshore, après l'Achille Lauro et le Munich, comme la SEAL Team Six de 1980 et l'escadron maritime de lutte contre le terrorisme SBS."
  cw_sf_maritime_counter_terror_reward_1: "Assaut à l'abordage d'un navire"
  cw_sf_maritime_counter_terror_reward_2: "Répétition de la plateforme offshore"
  cw_sf_maritime_counter_terror_reward_3: "Alerte de réponse rapide"
  cw_sf_maritime_counter_terror_reward_4: "Corde rapide et coques rigides"
  cw_sf_maritime_counter_terror_reward_5: "Maritime niveau un"
  cw_sf_underwater_demolition: "Équipes de démolition sous-marine"
  cw_sf_underwater_demolition_desc: "Des hommes-grenouilles qui surveillent les plages et éliminent les obstacles avant les débarquements, l'UDT américain de Corée et du Vietnam et les plongeurs démineurs de la Royal Navy."
  cw_sf_underwater_demolition_reward_1: "Nageurs d'enquête sur la plage"
  cw_sf_underwater_demolition_reward_2: "Franchise d'obstacles"
  cw_sf_underwater_demolition_reward_3: "Frais de démolition"
  cw_sf_underwater_demolition_reward_4: "Guides des péniches de débarquement"
  cw_sf_underwater_demolition_reward_5: "Bataillons de démolition sous-marine"
  cw_sf_swimmer_delivery_vehicles: "Véhicules de livraison pour nageurs"
  cw_sf_swimmer_delivery_vehicles_desc: "Des sous-marins miniatures, des sous-marins humides et des engins de propulsion de plongée lancés depuis des sous-marins mères pour attaquer des bases navales, dans la lignée des torpilles humaines italiennes et des Spetsnaz navals soviétiques."
  cw_sf_swimmer_delivery_vehicles_reward_1: "Formation submersible humide"
  cw_sf_swimmer_delivery_vehicles_reward_2: "Lancement du sous-marin mère"
