l_french:
 TUR_1950_ELECTIONS.0.d:0 "La République turque organise ses deuxièmes élections générales multipartites. Le Parti républicain au pouvoir, connu sous le nom de CHP, est dirigé par le confident d'Atatürk, Ismet Inonu. Son parti promet la poursuite d'une économie protectionniste dirigée par l'État. En politique étrangère, les républicains promettent de maintenir la souveraineté turque tout en gérant une situation régionale de plus en plus dangereuse. Le Parti démocrate, dirigé par Adnan Menderes, souhaite privatiser et relancer l'économie turque. Ils recherchent également des liens plus étroits avec l'Occident et certains de leurs membres croient au rétablissement de certaines pratiques islamiques, tout en maintenant la laïcité. De nombreux Turcs ont le sentiment que le moment est peut-être venu de donner une chance à un autre parti après des décennies de régime de parti unique du CHP."
 TUR_1950_ELECTIONS.1.d:0 "Contre de nombreuses prédictions, le Parti républicain (CHP) est sorti vainqueur des élections législatives. Le président Ismet Inonu restera à la tête du pays pour un autre mandat. De nombreux Turcs urbains et libéraux seraient mécontents du résultat et des rumeurs de bourrage des bulletins de vote circulent. Le Parti démocrate a également fait part de ses inquiétudes quant aux résultats. Quoi qu'il en soit, l'armée est satisfaite car de nombreux officiers se méfient du Parti démocrate, malgré leurs prétentions à la laïcité et au kémalisme. Il semble que l'élite dirigeante bureaucratico-militaire traditionnelle reste fermement au pouvoir. Pour la communauté internationale, il semble que le peuple turc souhaite maintenir sa voie politique et économique."
 CHP_1950.1.d:0 "Depuis les élections, des échanges houleux ont eu lieu lors des débats de la Grande Assemblée nationale entre le gouvernement et l'opposition du Parti démocrate. Même si le Parti démocrate ne qualifie pas ouvertement les résultats des élections de frauduleux, il est clair qu'il ne le nie pas, attisant ainsi la suspicion du public, notamment dans les cercles libéraux. Le gouvernement doit remédier à cette tension s'il veut maintenir la stabilité et mener à bien son programme législatif. Les chefs de l'armée et des services de renseignement ont proposé de s'entretenir en privé avec des dirigeants de l'opposition et des militants remettant en question les résultats. Toutefois, certains au sein du CHP estiment qu'il serait préférable de simplement s'entretenir directement avec les hauts dirigeants de l'opposition."
 CHP_1950.2.d:0 "Les opérations militaires et de renseignement visant à mettre l'opposition au pas ont été un succès retentissant. Sous la contrainte, les menaces et les cadeaux, de nombreux dirigeants de l'opposition se montrent désormais beaucoup plus coopératifs et silencieux sur la question de la fraude électorale. Les militants, en particulier sur les campus universitaires, ont été traités de la même manière, le gouvernement peut désormais mener son programme législatif de manière plus fluide. Les hauts dirigeants du CHP ont été délibérément tenus dans l'ignorance de ce qui avait été fait exactement pour obliger l'opposition à se conformer."
 CHP_1950.3.d:0 "Les tentatives de l'armée et de l'opposition pour accroître la coopération et mettre fin aux discussions sur la fraude électorale au sein de l'opposition du Parti démocrate se sont retournées contre elles. Des rumeurs se sont rapidement répandues selon lesquelles des dirigeants de l'opposition seraient emmenés de nuit dans des bases militaires ou rencontreraient de puissants agents des services de renseignement. Cette tentative flagrante de contrôler l'opposition est largement connue et n'a fait qu'enhardir l'opposition au sein de la Grande Assemblée nationale. Ses membres ne craignent plus les représailles, car le CHP ne peut se risquer à agir sans provoquer la ferveur de l'opinion publique, voire des protestations de grande ampleur."
 CHP_1950.4.d:0 "Le CHP a récemment conclu des discussions avec la direction du Parti démocrate sur les tensions et les problèmes actuels au sein de la Grande Assemblée nationale. Un échange de vues franc a eu lieu et nous avons pu offrir à l'opposition certaines assurances sur certaines procédures et législations. En échange, l'opposition a déclaré qu'elle empêcherait ses membres de rencontrer ou d'encourager ceux qui pensent que les élections ont été truquées en faveur du gouvernement."
 CHP_1950.5.d:0 "Le CHP a récemment conclu des discussions avec la direction du Parti démocrate sur les tensions et les problèmes actuels au sein de la Grande Assemblée nationale. Un échange de vues franc a eu lieu, mais il n'a finalement abouti à aucune avancée. L'opposition a considéré les négociations comme un signe de faiblesse de la part du gouvernement et a formulé certaines exigences concernant la législation. Les efforts visant à trouver un compromis en échange d'une aide de l'opposition pour mettre un terme aux rumeurs d'élections truquées ont échoué, l'opposition ayant déclaré qu'aucun de ses membres n'était impliqué dans de telles rumeurs. On peut s'attendre à une opposition plus enhardie à l'Assemblée."
 TUR_1950_ELECTIONS.2.d:0 "Le Parti démocrate a remporté une victoire éclatante aux élections. Le président turc Ismet Inonu a déjà promis une transition pacifique du pouvoir, mettant fin aux rumeurs d'un coup d'État militaire ou d'un soulèvement parrainé par le CHP. Adnan Menderes devrait diriger le parti et le gouvernement en tant que Premier ministre, laissant la présidence à Celal Bayar. Le nouveau gouvernement apporte un afflux de dirigeants commerciaux et d'affaires, étendant le pouvoir politique au-delà de la base bureaucratico-militaire traditionnelle. L'armée considérera probablement le gouvernement avec méfiance car il promet d'accélérer le développement économique turc grâce à la privatisation et à l'apport de capitaux étrangers."
 DP_1950.1.d:0 "Le Premier ministre turc est récemment arrivé aux États-Unis pour s'entretenir avec le gouvernement américain. Les États-Unis ont donné la priorité à leurs relations avec la Turquie et la considèrent comme un État clé en première ligne du capitalisme mondial. Le gouvernement turc a ses propres objectifs, le Parti démocrate au pouvoir a promis d'alimenter la croissance économique grâce à une économie de marché. L'armée nous demande davantage d'aide militaire, tandis que les conseillers politiques souhaitent davantage d'aide économique pour stimuler la croissance économique. Une autre option consiste à demander un paquet militaire et économique, même si l'aide serait alors plus limitée."
 DP_1950.2.d:0 "Le Premier ministre turc est en visite aux États-Unis et a demandé une aide militaire accrue de notre gouvernement. L'armée turque souhaiterait notamment disposer de davantage d'équipements d'infanterie pour moderniser ses forces. Le Pentagone estime pouvoir répondre à cette demande et le Département d'État estime qu'un tel soutien renforcerait le gouvernement turc sur le plan intérieur. Plus important encore, cela démontrerait l'étroitesse de nos liens et montrerait comment notre gouvernement soutient directement ceux qui sont confrontés à la menace communiste. Cependant, certains à la Maison Blanche s'interrogent sur la nécessité de fournir une aide aussi importante à un pays que nous soutenons déjà lourdement."
 DP_1950.3.d:0 "Le Premier ministre turc est en visite aux États-Unis et a demandé davantage d'aide économique à notre gouvernement. Le Premier ministre turc souhaiterait notamment un afflux de liquidités pour stimuler les efforts du gouvernement visant à transformer la Turquie en une économie de marché. Le Département d'État estime qu'un tel soutien renforcerait le gouvernement turc sur le plan intérieur. Plus important encore, cela démontrerait l'étroitesse de nos liens et montrerait comment notre gouvernement soutient directement ceux qui sont confrontés à la menace communiste. Cependant, certains à la Maison Blanche s'interrogent sur un afflux de liquidités, d'autant plus que l'on craint qu'il ne contribue à alimenter une crise inflationniste."
 DP_1950.4.d:0 "Le Premier ministre turc est en visite aux États-Unis et a demandé une aide militaire accrue de notre gouvernement. L'armée turque souhaiterait notamment disposer de davantage d'équipements d'infanterie pour moderniser ses forces. Le Pentagone estime pouvoir répondre à cette demande et le Département d'État estime qu'un tel soutien renforcerait le gouvernement turc sur le plan intérieur. Plus important encore, cela démontrerait l'étroitesse de nos liens et montrerait comment notre gouvernement soutient directement ceux qui sont confrontés à la menace communiste. Cependant, certains à la Maison Blanche s'interrogent sur la nécessité de fournir une aide aussi importante à un pays que nous soutenons déjà lourdement."
 DP_1950.5.d:0 "Le récent voyage aux États-Unis a été un échec pour le Premier ministre turc. Bien que les deux parties soient convenues de poursuivre leurs relations, aucun nouvel accord sur une aide supplémentaire n'a été conclu. Cela sape les affirmations du gouvernement selon lesquelles il pourrait élargir les liens américains au profit de la Turquie. L'armée serait mécontente et le ministre des Finances prévient que l'absence d'accord accroît l'incertitude sur le marché. Les États-Unis sont toujours très intéressés par leurs liens avec la Turquie, mais ils ont clairement une limite à ce qu'ils peuvent offrir."
 DP_1950.6.d:0 "L'afflux de liquidités étrangères, les dépenses publiques et les liquidités provenant des privatisations ont provoqué une augmentation de l'inflation et suscité des inquiétudes quant à une surchauffe de l'économie. Certains conseillers économiques préviennent que le rythme actuel des privatisations et les afflux de liquidités du gouvernement pour stimuler le marché pourraient entraîner d'énormes problèmes à l'avenir. Ils suggèrent de lancer des réformes structurelles et de calmer la situation. Cependant, d'autres économistes soutiennent que ralentir maintenant paralyserait la croissance économique et que nous devrions poursuivre nos dépenses alors que le pays est au bord d'une croissance économique spectaculaire."
 TUR_1950_ELECTIONS.3.d:0 "La République de Turquie organise des élections générales. Le peuple doit choisir entre le Parti républicain (CHP) ou le Parti démocrate (DP). Le CHP promet de poursuivre le développement protectionniste guidé par l'État, ainsi qu'un engagement ferme envers les valeurs républicaines traditionnelles telles que la laïcité et le kémalisme. Le PD promet de faciliter la privatisation et d'utiliser les financements gouvernementaux pour stimuler une économie de marché libre. Il croit également à l'engagement en faveur de la laïcité. Le PD souhaite également élargir la Turquie à l'international et élargir ses liens avec l'Occident. La puissante armée se méfierait du PD, car ses membres sont des islamistes présumés et des élites économiques qui menacent la puissante élite bureaucratico-militaire. Le CHP est au pouvoir depuis des décennies et de nombreux observateurs pensent que le peuple turc pourrait pencher vers le PD, mais cela reste à voir."
 TUR_1950_ELECTIONS.4.d:0 "Contre de nombreuses prédictions pré-électorales, le Parti républicain (CHP) a remporté haut la main les récentes élections. Ses dirigeants voient dans cette victoire la preuve que le peuple turc n'est pas disposé à s'éloigner radicalement de la vision et des politiques économiques de la jeune république. L'armée est particulièrement enthousiaste, car de nombreux dirigeants du CHP sont d'anciens officiers. L'opposition serait furieuse et accuserait en privé le CHP d'avoir truqué les élections, mais elle ne peut pas exprimer ouvertement son mécontentement sans risquer des problèmes juridiques. Cependant, les rumeurs qu'ils propagent vont éveiller les soupçons, notamment dans les milieux libéraux et sur les campus universitaires. Quoi qu'il en soit, le CHP attend avec impatience de mettre en oeuvre sa vision pour la république turque."
 CHP_1954.1.d:0 "Les récentes élections ont suscité le mécontentement d'une partie de l'opinion publique et de l'opposition, affirmant que les élections avaient été truquées ou manipulées soit par le CHP, soit par l'armée. L'opposition utilise des tactiques dilatoires et empoisonne l'atmosphère à la Grande Assemblée nationale, rendant les efforts visant à faire adopter des lois longs ou désagréables. Certains de nos membres ont contacté l'opposition et ont manifesté leur intérêt pour une proposition visant à créer un comité chargé d'explorer les réformes électorales. Ils ne commenteront ni ne discuteront des élections précédentes, mais proposeront simplement des propositions pour garantir plus de transparence à l'avenir. Nous pourrions soutenir un tel comité et réduire les tensions, ou nous pourrions accepter une offre de l'armée visant à instaurer une coopération en privé."
 CHP_1954.2.d:0 "Une commission mixte a présenté son rapport sur la réforme du processus électoral pour une plus grande transparence à la Grande Assemblée nationale. Ses auteurs notent qu'ils ne pensent pas que les élections précédentes aient posé des problèmes, mais notent que ses recommandations apaiseraient les inquiétudes des électeurs et rationaliseraient davantage le processus de vote. Le législateur devrait adopter les recommandations dans les semaines à venir. De nombreux observateurs considèrent cela comme un grand succès pour le gouvernement et contribuera grandement à apaiser les tensions avec l'opposition."
 CHP_1954.3.d:0 "Les tensions et les querelles au sein de la Grande Assemblée nationale ont sensiblement diminué ces dernières semaines. Les dirigeants de l'opposition ont gardé le silence et ceux qui étaient considérés comme des rumeurs enflammées en privé selon lesquelles les dernières élections avaient été truquées déclarent désormais explicitement que les élections étaient équitables. Il semble que l'armée ait fait du bon travail en discutant avec l'opposition et en la calmant. Le gouvernement n'a pas demandé de détails, mais des rumeurs circulent selon lesquelles des pots-de-vin, la coercition et le chantage seraient utilisés contre l'opposition. Espérons que le gouvernement bénéficiera d'un programme législatif plus productif."
 CHP_1954.4.d:0 "Il y a un tollé général et une opposition enhardie à la Grande Assemblée nationale. Certains membres de l'opposition de rang inférieur ont révélé qu'ils avaient été approchés par des responsables militaires pour qu'ils soutiennent davantage le gouvernement. Une fois qu'ils se sont manifestés, d'autres membres de l'opposition sont intervenus, affirmant qu'ils avaient fait l'objet de menaces ou d'offres d'argent pour se conformer davantage. Le gouvernement a nié toute implication et l'armée affirme que certains de ses membres pourraient avoir agi contrairement aux ordres permanents. Quoi qu'il en soit, cette dénonciation affaiblit le gouvernement, renforce l'opposition et donne du crédit à ceux qui accusent le CHP d'avoir truqué les dernières élections avec l'armée."
 CHP_1954.5.d:0 "Depuis 1945, la Turquie a connu un afflux massif de liquidités en provenance de l'étranger, que ce soit par le biais d'investissements ou d'aide internationale. Le gouvernement turc a parfois injecté ses propres liquidités pour soutenir le développement économique et des projets d'infrastructures. Le ministre des Finances estime que l'économie est incapable d'absorber et risque de se noyer. Il propose au gouvernement d'instaurer des réformes budgétaires et de prendre des mesures pour réduire les dépenses, même au prix d'une croissance immédiate. Cependant, certains de nos autres conseillers économiques et politiques estiment qu'un tel changement entraînerait des difficultés excessives pour le peuple turc et que les risques sont probablement surestimés."
 TUR_1950_ELECTIONS.5.d:0 "Le Parti Démocrate a triomphé aux élections de 1954. Le chef du parti Adnan Menderes devrait diriger le gouvernement en tant que Premier ministre, laissant la présidence à Celal Bayar. Le Parti démocrate promet une économie de marché libre et la privatisation pour stimuler la croissance économique. Cependant, il prend le dessus sur une économie déjà confrontée à une forte inflation. En outre, le Parti démocrate doit faire face à une armée méfiante quant à ses intentions et à la menace de la résistance des élites politiques traditionnelles au parti qui amène les élites commerciales, agricoles et industrielles aux postes de pouvoir."
 DP_1954.1.d:0 "Le ministre des Finances rapporte que les réserves de liquidités actuelles sont dangereusement basses. Il cite l'injection continue de liquidités par le gouvernement pour stimuler la croissance et le déclin des capitaux étrangers pour soutenir la situation économique actuelle. Le ministre recommande une réduction des dépenses et des mesures fiscales pour maîtriser l'inflation et assurer une stabilité à long terme. Cependant, certains autres conseillers économiques et politiques préviennent qu'une telle action pourrait paralyser l'économie et nous coûter les prochaines élections."
 TUR_1950_ELECTIONS.6.d:0 "En-cours"
 TUR_1950_ELECTIONS.7.d:0 "Le Parti républicain (CHP) a battu le Parti démocrate (DP) lors des récentes élections générales. Cette victoire confirme la volonté des Turcs de conserver le leadership et la politique qui ont soigneusement guidé la nation dans les premières années de la république. L'élite militaro-bureaucratique se dit très satisfaite du résultat. Toutefois, l'opposition et les cercles libéraux se disent déçus par les résultats. De nombreux Turcs seraient de plus en plus frustrés par ce qu'ils considèrent comme une élite militaire et bureaucratique nombreuse et inefficace. Le CHP promet de maintenir une économie soigneusement contrôlée. L'aile gauche du PD gagne désormais du terrain. Il semble qu'un virage à gauche soit nécessaire pour le parti s'il peut vaincre le CHP à l'avenir."
 CHP_1957.1.d:0 "Le ministre des Finances a proposé d'alléger légèrement les tarifs. Cela représenterait un changement dans la politique gouvernementale qui a maintenu des droits de douane élevés pour encourager la production nationale. Cependant, le ministre suggère que les tarifs pénalisent en réalité l'industrie locale et retardent la croissance potentielle. L'assouplissement des droits de douane stimulerait la croissance de l'économie et maintiendrait l'inflation à un niveau maîtrisé. D'autres conseillers économiques et politiques avertissent le gouvernement de ne pas assouplir les tarifs car cela contredit le programme gouvernemental. Le gouvernement doit décider d'assouplir les tarifs ou de les maintenir."
 CHP_1957.2.d:0 "Il y a un tournant alarmant vers le socialisme et la gauche parmi les partisans du Parti démocrate. Ils sont de plus en plus déçus par le gouvernement et sa dépendance à l'égard des élites traditionnelles et de l'armée. Ils aspirent également à la mise en oeuvre de politiques socialistes et à un élargissement de la classe politique. Il s'agit d'une menace majeure pour l'ordre kémaliste et les principes sur lesquels la république a été fondée. L'armée et les services de renseignement souhaitent mettre en oeuvre des opérations visant à décapiter le mouvement socialiste naissant et à arrêter ses dirigeants. Cependant, de telles actions pourraient finir par exaspérer les socialistes. L'autre option consiste à laisser les socialistes tranquilles et à les défier électoralement, ce qui pourrait ébranler leur conviction selon laquelle le gouvernement est autocratique."
 CHP_1957.3.d:0 "L'opération militaire et de renseignement visant à arrêter les dirigeants et agitateurs socialistes a été un succès majeur. L'activisme socialiste est en déclin, notamment sur les campus universitaires. Le gouvernement applaudit en privé ces actions tout en refusant publiquement de s'exprimer sur les rumeurs de répression. Il semble que la décision de cibler stratégiquement ces agitateurs ait été un succès. La Turquie sera protégée du fléau socialiste, premier pas vers le communisme et le totalitarisme que cela implique."
 CHP_1957.4.d:0 "Les récentes opérations menées par l'armée et les services de renseignement pour arrêter des dirigeants socialistes et freiner leur militantisme se sont retournées contre eux. Il semble que des étudiants universitaires se soient rendu compte de ce qui se passait lors d'une tentative d'arrestation, ce qui a entraîné un incident public impliquant des étudiants et des soldats. Le lendemain, des manifestations ont éclaté et d'autres campus se sont joints à elles, créant ainsi une situation embarrassante pour le gouvernement. De nombreux détenus ont été rapidement relâchés, sans être convaincus de modérer leurs activités. Les rapports indiquent qu'un nombre encore plus grand de partisans du Parti démocrate se tournent désormais vers le socialisme et qu'il y a un désenchantement croissant à l'égard de ce que beaucoup considèrent désormais comme une structure politique composée de deux partis centristes."
 TUR_1950_ELECTIONS.8.d:0 "Le Parti Démocrate a remporté les élections de 1957. Le chef du parti Adnan Menderes devrait diriger le gouvernement en tant que Premier ministre, laissant la présidence à Celal Bayar. Le Parti démocrate promet une économie de marché libre et la privatisation pour stimuler la croissance économique. Cependant, il prend le dessus sur une économie déjà confrontée à une forte inflation. En outre, le Parti démocrate doit faire face à une armée méfiante quant à ses intentions et à la menace de la résistance des élites politiques traditionnelles au parti qui amène les élites commerciales, agricoles et industrielles aux postes de pouvoir. Le Parti démocrate reconnaît également l'élite traditionnelle et son contrôle sur les médias ; des efforts doivent être faits pour réprimer la propagande nationale hostile."
 DP_1957.1.d:0 "L'opposition et ses alliés médiatiques encouragent désormais ouvertement les troubles et l'insurrection contre le gouvernement. Le ministre de l'Intérieur suggère que cet effort vise à susciter des troubles parmi les kémalistes afin de faciliter un coup d'État militaire. Certains de nos ministres estiment que le moment est venu d'appeler l'armée à obéir au gouvernement, à contribuer à imposer l'ordre et à fermer les médias qui violent la loi. Cependant, certains ministres estiment que ce complot semble tiré par les cheveux et qu'appeler l'armée à cibler des groupes qu'elle considère comme des alliés pourrait en fait pousser l'armée à prendre des mesures contre le gouvernement."
 TUR_FOR.1.d:0 "Au lendemain de la guerre israélo-arabe, le Moyen-Orient se trouve dans une position délicate. Nous sommes l'un des rares pays à avoir des contacts diplomatiques avec les Israéliens et cela a apporté des avantages à notre gouvernement. Cependant, cela ne convient pas aux musulmans turcs les plus fervents et des pressions sont exercées pour élargir les liens avec les autres États musulmans. Ceci malgré nos efforts pour minimiser le contact israélien. Le ministère des Affaires étrangères estime que nous pouvons élargir les premiers liens prometteurs avec Israël en établissant une légation tout en recherchant l'amitié avec les principales puissances arabes. L'autre option pourrait être de mettre fin aux liens israéliens naissants et de se tourner complètement vers les Arabes."
 TUR_FOR.2.d:0 "Le gouvernement turc a récemment tendu la main et demandé la normalisation des relations et des échanges culturels. Ils souhaitent apparemment raviver les vieux liens fraternels établis au cours des siècles de règne Ottoman. Cependant, ils entretiennent des relations avec les Israéliens et les rapports indiquent que ces relations ne font que se développer. Beaucoup de nos responsables estiment que nous devrions rejeter la demande turque par solidarité et faire savoir que l'aide à l'ennemi des Arabes ne sera pas appréciée. D'autres responsables estiment que nous devrions ouvrir des relations afin de limiter l'influence israélienne et éventuellement les convaincre."
 TUR_FOR.3.d:0 "Le gouvernement égyptien a rejeté notre demande d'élargir les relations bilatérales et d'encourager les échanges culturels. Les Égyptiens ont clairement indiqué que cela était dû à nos liens avec les Israéliens. Il s'agit d'un revers diplomatique qui entrave nos efforts visant à convaincre le peuple turc que nous pouvons entretenir des relations positives avec les États musulmans tout en entretenant des liens avec Israël. Il est également regrettable que les médias égyptiens condamnent ouvertement nos contacts avec Israël, car ils révèlent au public turc que nous minimisons ces relations."
 TUR_FOR.4.d:0 "Le gouvernement saoudien a rejeté notre demande d'élargir les relations bilatérales et d'encourager les échanges culturels. Les Saoudiens ont clairement indiqué que cela était dû à nos liens avec les Israéliens. Il s'agit d'un revers diplomatique qui entrave nos efforts visant à convaincre le peuple turc que nous pouvons entretenir des relations positives avec les États musulmans tout en entretenant des liens avec Israël. Il est également regrettable que les médias saoudiens condamnent ouvertement nos contacts avec Israël, car ils révèlent au public turc que nous minimisons ces relations."
 TUR_FOR.5.d:0 "Le gouvernement irakien a rejeté notre demande d'élargir les relations bilatérales et d'encourager les échanges culturels. Les Irakiens ont clairement indiqué que cela était dû à nos liens avec les Israéliens. Il s'agit d'un revers diplomatique qui entrave nos efforts visant à convaincre le peuple turc que nous pouvons entretenir des relations positives avec les États musulmans tout en entretenant des liens avec Israël. Il est également regrettable que les médias irakiens condamnent ouvertement nos contacts avec Israël, car ils révèlent au public turc que nous minimisons ces relations."
 TUR_FOR.6.d:0 "Le gouvernement syrien a rejeté notre demande d'élargir les relations bilatérales et d'encourager les échanges culturels. Les Syriens ont clairement indiqué que cela était dû à nos liens avec les Israéliens. Il s'agit d'un revers diplomatique qui entrave nos efforts visant à convaincre le peuple turc que nous pouvons entretenir des relations positives avec les États musulmans tout en entretenant des liens avec Israël. Il est également regrettable que les médias syriens condamnent ouvertement nos contacts avec Israël, car ils révèlent au public turc que nous minimisons ces relations."
 TUR_FOR.7.d:0 "Le gouvernement égyptien a accepté notre demande d'élargir les relations bilatérales et les échanges culturels. Les Égyptiens étaient d'accord avec nous sur l'importance de maintenir le contact historique entre nos peuples. Les Égyptiens ont ajouté leur désapprobation à l'égard de nos liens avec Israël, mais tant que nous continuerons à le minimiser, ils n'en parleront pas. Le peuple turc sera satisfait de cette nouvelle. Le ministère des Affaires étrangères équilibre magistralement nos liens dans la région."
 TUR_FOR.8.d:0 "Le gouvernement saoudien a accepté notre demande d'élargir les relations bilatérales et les échanges culturels. Les Saoudiens étaient d'accord avec nous sur l'importance de maintenir le contact historique entre nos peuples. Les Saoudiens ont ajouté leur désapprobation à l'égard de nos liens avec Israël, mais tant que nous continuerons à le minimiser, ils n'en parleront pas. Le peuple turc sera satisfait de cette nouvelle. Le ministère des Affaires étrangères équilibre magistralement nos liens dans la région."
 TUR_FOR.9.d:0 "Le gouvernement irakien a accepté notre demande d'élargir les relations bilatérales et les échanges culturels. Les Irakiens étaient d'accord avec nous sur l'importance de maintenir le contact historique entre nos peuples. Les Irakiens ont ajouté leur désapprobation à l'égard de nos liens avec Israël, mais tant que nous continuerons à le minimiser, ils n'en parleront pas. Le peuple turc sera satisfait de cette nouvelle. Le ministère des Affaires étrangères équilibre magistralement nos liens dans la région."
 TUR_FOR.10.d:0 "Le gouvernement syrien a accepté notre demande d'élargir les relations bilatérales et les échanges culturels. Les Syriens étaient d'accord avec nous sur l'importance de maintenir le contact historique entre nos peuples. Les Syriens ont ajouté leur désapprobation à l'égard de nos liens avec Israël, mais tant que nous continuerons à le minimiser, ils n'en parleront pas. Le peuple turc sera satisfait de cette nouvelle. Le ministère des Affaires étrangères équilibre magistralement nos liens dans la région."
 TUR_FOR.11.d:0 "Le gouvernement israélien nous a récemment invités à rejoindre un pacte périphérique. Il s'agirait d'une relation stratégique plus profonde entre nos gouvernements. Ils ont affirmé qu'une telle relation resterait secrète afin de ne pas contrarier notre population musulmane et promettait une coopération économique et militaire. Les Israéliens cherchent à élargir leurs liens avec les États musulmans non arabes de la région pour faire contrepoids à leurs opposants arabes. Une telle relation secrète pourrait offrir de nombreux avantages, mais sa découverte provoquerait une réaction négative du public."
 TUR_FOR.12.d:0 "Le gouvernement turc a accepté de rejoindre le Pacte périphérique. Il s'agit d'une victoire majeure en matière de politique étrangère, dans la mesure où la Turquie est probablement l'État musulman non arabe le plus puissant de la région. Les Turcs attendent avec impatience une coopération économique et militaire plus approfondie. Avec le soutien de la Turquie, même secret, nous sommes beaucoup moins isolés qu'avant et, au fil du temps, nous pourrions potentiellement développer nos relations au point de constituer une forte menace du nord pour les États arabes alliés contre nous."
 TUR_FOR.13.d:0 "Le gouvernement turc a décliné la proposition d'adhérer au Pacte périphérique. Bien que secrètes, les Turcs ne sont apparemment pas à l'aise avec les conséquences si cette relation était révélée publiquement. Même s'il est clair que la Turquie ne cherche pas à rompre ses liens, cela constitue un coup dur pour nos projets. Le Pacte périphérique cherche à contrer la coalition arabe en nous alliant aux États musulmans non arabes de la région. Cela briserait leurs tentatives de nous isoler au niveau international."
 TUR_FOR.14.d:0 "Dans le cadre d'une nouvelle politique régionale, la Turquie a annoncé qu'elle reviendrait sur sa reconnaissance d'Israël. L'établissement prévu d'une mission diplomatique permanente dans le pays sera annulé et tous les citoyens turcs en Israël doivent rentrer immédiatement chez eux. Le gouvernement israélien serait assez choqué par ce revirement, certains politiciens israéliens accusant l'influence des antisémites à Ankara. Dans l'ensemble du monde arabe, la nouvelle est largement saluée. Les journaux félicitent la Turquie pour sa nouvelle position aux côtés des Arabes. Certains éditoriaux turcs affirment que cette décision marque le retour des liens fraternels entre Turcs et Arabes."
 TUR_FOR.15.d:0 "Nous avons une histoire longue et troublée avec les Grecs, qui s'étend sur des siècles. Au cours des dernières décennies, ce conflit a failli entraîner la mort de notre nation. Ils se sont attaqués à la carcasse mourante de l'Empire Ottoman et ont ensuite cherché à étrangler notre république au berceau. Nous avons persévéré et surmonté ces défis. Malgré une accalmie dans les hostilités directes, les tensions demeurent et, compte tenu des défis auxquels nous sommes confrontés à l'Est et du chaos au Moyen-Orient, les tensions avec la Grèce pourraient conduire à une future catastrophe. Certains souhaitent dialoguer avec le gouvernement grec et proposer une série de mesures de confiance pour réduire les tensions. Cela renforcerait nos ressources pour mieux gérer la myriade de problèmes de sécurité auxquels notre pays est confronté."
 TUR_FOR.16.d:0 "Le gouvernement turc souhaite engager des négociations de haut niveau. Ils reconnaissent que nous avons tous deux des divergences sur un certain nombre de questions, mais souhaitent conclure une série de mesures de renforcement de la confiance. Cela impliquerait de faciliter les opportunités commerciales, les échanges culturels, les programmes étudiants et les pourparlers entre militaires. C'est une proposition intrigante, la situation dans notre nord reste incertaine, surtout au lendemain de la dernière guerre. La normalisation des relations turques pourrait apporter un soulagement. Cependant, certains s'opposent à la tenue de négociations, estimant que c'est un stratagème pour la Turquie de continuer à prendre en otage le territoire grec tout en récoltant les fruits des relations bilatérales."
 TUR_FOR.17.d:0 "Une série d'accords ont été signés à Athènes entre la Grèce et la Turquie. La délégation turque de haut niveau était arrivée quelques jours plus tôt et a exprimé sa grande satisfaction des résultats. Les deux parties se sont engagées à renforcer leurs relations, leurs échanges commerciaux et leurs contacts. Il y aura une série d'échanges culturels, de missions économiques, de pourparlers militaires et d'opportunités commerciales élargies. Même si certains dans les deux pays seront déçus qu'aucune des deux parties ne semble disposée à insister sur les griefs historiques ou territoriaux, la plupart devraient soutenir cet effort visant à réduire les tensions."
 TUR_CYPRUS.1.d:0 "La situation à Chypre continue de se détériorer. Les extrémistes grecs ciblent ouvertement les Britanniques et attaquent les Turcs innocents sur l'île. Le peuple turc suit la situation avec une inquiétude croissante car il est clair que les Grecs envisagent de s'emparer de l'île et de promouvoir l'unification avec la Grèce. Un tel scénario entraînerait une nouvelle vague de nettoyage ethnique sur l'île, ce qui est inacceptable. La Turquie doit dialoguer avec les Turcs présents sur l'île et déterminer comment les aider."
 TUR_CYPRUS.2.d:0 "Le Traité de Garantie a été récemment signé entre la Turquie, le Royaume-Uni, la Grèce et Chypre. Le traité établit un État chypriote indépendant et démocratique. Il doit maintenir sa constitution et équilibrer les pouvoirs entre les populations grecque et turque de l'île. Si une partie rompt l'accord, n'importe lequel des signataires ne peut intervenir unilatéralement que pour rétablir le traité. Nous sommes autorisés à maintenir une petite garnison sur l'île pour protéger la population turque. Nous devons décider dans quelle mesure la garnison sera proactive. Nous pouvons maintenir une position passive, essentiellement positionnés uniquement pour intervenir si la population turque risque d'être attaquée. Ou nous pouvons être proactifs et recueillir des renseignements de près et être en mesure d'intervenir si la constitution est modifiée."
 TUR_CYPRUS.3.d:0 "Les Chypriotes grecs ont considérablement aggravé la crise en prenant le contrôle de l'île et en proclamant l'enosis (unification) avec la Grèce. Les Chypriotes turcs sont paniqués et exigent une intervention turque rapide. Dans toute la Turquie, les médias et la foule appellent le gouvernement à agir. L'armée a l'intention de déployer rapidement une force pour sécuriser la partie turque de l'île et la protéger du risque de nettoyage ethnique. Une telle action provoquerait probablement une réponse de la Grèce qui pourrait conduire à une guerre. Les États-Unis pourraient également percevoir la situation d'un mauvais oeil. Toutefois, ne pas intervenir risquerait de provoquer la destruction de la population chypriote turque et de susciter la colère du peuple."
 TUR_ARAB.1.d:0 "La formation de la République Arabe Unie (RAU) fait peser la menace du nationalisme arabe à nos frontières. Hatay est depuis longtemps un désir de la Syrie et des Arabes de la région qui y voient la dernière terre arabe occupée par la Turquie. L'état-major a élaboré un plan pour contrer cette menace de manière proactive. Nous pouvons écouter leur proposition et décider d'agir. Cependant, de nombreux membres du gouvernement pensent que la RAU se concentre beaucoup plus sur le conflit israélien et que la seule façon pour Hatay de devenir un problème est d'aggraver la situation."
 TUR_ARAB.2.d:0 "L'armée turque a présenté une proposition au gouvernement concernant la République arabe unie (RAU). L'armée déclare disposer d'informations selon lesquelles la population non arabe du nord de la Syrie est préoccupée par la montée du nationalisme arabe. Il ne serait pas difficile d'orchestrer un affrontement frontalier qui dégénère en conflit. L'armée pense pouvoir rapidement s'emparer du territoire et établir une zone tampon dans le nord de la Syrie. Il s'agit d'une opération risquée, mais elle pourrait assurer la protection de Hatay. Cependant, certains hauts responsables sont plus prudents et estiment que le meilleur moyen de contrer une potentielle menace nationaliste arabe est de normaliser les liens avec la RAU."
 TUR_ARAB.3.d:0 "Dans le cadre d'un accord majeur, la Turquie et la République arabe unie (RAU) ont convenu de normaliser leurs relations et d'instaurer des échanges culturels. Les deux gouvernements ont souligné que toute rumeur de méfiance ou de tension était exagérée. Cette évolution est saluée dans toute la région et donne une plus grande légitimité à la RAU. Les inquiétudes des responsables turcs quant à la pression exercée par la RAU pour obtenir Hatay semblent s'être apaisées."
 TUR_ARAB.4.d:0 "L'armée turque a vaincu la République arabe unie (UAR) le long de sa frontière nord. L'armée turque contrôle en grande partie le nord de la Syrie. Le conflit a commencé après qu'un conflit frontalier ait dégénéré en une guerre frontalière à grande échelle. La RAU ne semblait pas préparée et ne pouvait pas repousser l'incursion turque. Bien que la Turquie affirme avoir réagi à l'agression de la RAU, la RAU affirme qu'elle a lancé une invasion non provoquée. Les forces de la RAU s'efforceraient de se réorganiser car elles craignent de nouvelles attaques alors que la Turquie semble avoir le contrôle."
 TUR_ARAB.5.d:0 "La République Arabe Unie (RAU) a déclaré sa victoire dans le conflit frontalier avec la Turquie. Les combats ont éclaté après qu'un affrontement frontalier se soit transformé en une guerre frontalière plus large. La RAU insiste sur le fait que ses forces ont été attaquées en premier et qu'elles ont répondu avec diligence. Le gouvernement turc affirme que ses forces ont été les victimes. Les craintes selon lesquelles la RAU pourrait chercher à contre-attaquer et arrêter Hatay ne se sont pas produites. Les États-Unis avaient ouvertement averti la RAU d'une telle action. Il s'agit d'un revers majeur pour l'armée turque."
 TUR_ARAB.6.d:0 "Nos militaires ont réussi à établir une zone tampon dans le nord de la Syrie. Les commandants sont confiants et ravis de leur succès. L'état-major propose désormais un assaut à grande échelle contre la RAU. Si nous parvenons à mettre un terme à Damas, nous pourrons briser l'État nationaliste arabe et établir un régime ami en Syrie. Cela garantirait la protection de Hatay. Cependant, l'escalade du conflit pourrait entraîner des conséquences imprévues et de nombreux responsables estiment que nous devrions nous contenter de la zone tampon."
 TUR_ARAB.7.d:0 "La République arabe unie n'étant plus une menace, des pressions croissantes s'exercent, notamment dans la région, pour que nos forces se retirent du nord de la Syrie. Ce serait un soutien bienvenu au nouveau régime et nous pouvons conclure un pacte de non-agression pour garantir la protection de Hatay. L'armée estime cependant que nous devons maintenir le contrôle du nord de la Syrie et commencer à intégrer le territoire. Ils soulignent que si les Syriens reviennent, ils pourraient chercher à se venger des groupes non arabes qui ont accueilli nos forces. Cependant, une occupation continue conduirait probablement à des troubles arabes et même à une résistance armée contre nos forces."
 TUR_ARAB.8.d:0 "Le gouvernement turc a annoncé que ses forces pénétraient en Syrie pour la libérer de l'occupation égyptienne. La République Arabe Unie (RAU) a condamné cette invasion, affirmant que le peuple arabe rejetterait cette agression Ottoman. À Damas, des appels sont lancés pour que la population se joigne à l'effort de guerre et défende cette tentative de détruire un État arabe uni. L'action turque est condamnée dans tout le monde arabe."
 TUR_ARAB.9.d:0 "Après un mois de combats, un cessez-le-feu des Nations Unies a été déclaré pour mettre fin aux combats entre la Turquie et la République arabe unie (RAU). Les deux camps déclarent victoire, mais une fois la poussière retombée, ce qui s'est passé deviendra clair. Les Nations Unies ont travaillé sans relâche une fois le conflit commencé pour y mettre un terme rapide. Le gouvernement turc a déclenché la guerre afin de rétablir le régime syrien et de briser la RAU."
 TUR_ARAB.10.d:0 "Un nouveau régime syrien a été déclaré à Damas. Le nouveau gouvernement a remercié la Turquie d'avoir libéré son peuple du colonialisme égyptien et a promis de restaurer la souveraineté syrienne. Les forces turques entament un retrait rapide des territoires, même si elles conservent le contrôle du nord de la Syrie. Les responsables et militaires égyptiens restants sont rapatriés au Caire et tous les traités antérieurs liés à la République arabe unie (RAU) ont été annulés. Cela confirme la victoire turque et marque la fin de la RAU panarabe."
 TUR_ARAB.11.d:0 "Les combats entre la Turquie et la République arabe unie (RAU) se sont soldés par une impasse. Aucune des deux parties ne semblait en mesure de réaliser une avancée majeure permettant de remporter une victoire décisive. Cependant, comme la Turquie a initié le conflit, elle le considérera comme une défaite. Le gouvernement turc insiste sur le fait qu'il a atteint ses objectifs fondamentaux. Cependant, la RAU déclare sa victoire, affirmant que ses forces ont vaincu avec succès l'agression étrangère et préservé les terres arabes. Les armes et équipements turcs capturés sont défilés autour de Damas."
 TUR_ARAB.12.d:0 "Le récent conflit entre la Turquie et la République Arabe Unie (RAU) s'est soldé par une victoire de la RAU. La Turquie avait cherché à envahir la Syrie et à briser la RAU. Cependant, son offensive a non seulement été repoussée, mais la RAU a réussi à s'emparer du territoire contesté de Hatay. La RAU a organisé un grand défilé à Hatay, affirmant qu'il s'agissait de la libération définitive des terres arabes des Turcs. Le gouvernement et l'armée turcs doivent faire une introspection et se féliciter que les pertes n'aient pas été plus importantes."
 TUR_Kurdish.1.d:0 "Même avant la fondation de la république, la question kurde tourmentait le gouvernement turc. Dans les premières années de la république, les efforts visant à intégrer les Kurdes se sont heurtés à la rébellion et à la résistance. Les efforts visant à diffuser l'éducation et le développement ont également été remis en question. Un groupe de responsables estime que nous devons redoubler d'efforts pour civiliser et intégrer ces Kurdes, qui sont en réalité des Turcs des montagnes. Cependant, un autre groupe de responsables soutient que nous devons dialoguer avec les Kurdes selon leurs conditions, ouvrir des négociations avec leurs dirigeants et rechercher une approche plus coopérative et inclusive. Nous devons décider quelle voie suivre."
 TUR_Kurdish.2.d:0 "Nous avons réussi à instaurer un processus de turquification des peuples des montagnes. Grâce à des investissements économiques, des bourses d'études et des incitations, nous encourageons de nombreuses personnes à quitter leurs villages isolés pour se rendre dans les villes. Dans les villes, ils s'engagent enfin avec leurs compatriotes turcs et sont exposés aux idées modernes et aux valeurs républicaines. L'influence rétrograde de leurs aînés s'affaiblit et, avec le temps, il n'y aura plus de différences entre l'ensemble du peuple turc."
 TUR_Kurdish.3.d:0 "les cas de banditisme dans les montagnes ont fortement diminué. Les dirigeants kurdes sont beaucoup plus à l'aise et ouverts avec les responsables gouvernementaux et la police. Les bandits autrefois considérés comme les défenseurs des opprimés sont désormais reconnus, à juste titre, comme des criminels. Les familles kurdes expriment leur satisfaction quant à la tolérance du gouvernement à l'égard des cours de langue et des pratiques culturelles kurdes, même dans les villes turques. Cela a établi une relation de respect mutuel entre nous et les Kurdes. Cependant, les kémalistes et les nationalistes sont de plus en plus inquiets et frustrés du fait que nous trahissons les principes de la république simplement pour satisfaire l'ego d'un peuple arriéré."




 turkey.1.t:0 "La mort de Mustafa Kemal Atatürk"
 turkey.1.d:0 "\n La république est en deuil. \n\n Héros de guerre, révolutionnaire, président et père des Turcs, Mustafa Kemal Atatürk est décédé.\n\nIl a maintenu jusqu'au bout son devoir envers le peuple turc et la république qu'il a fondée. Des milliers de personnes en deuil ont rendu hommage à Istanbul, avant que son corps ne soit transféré par caisson, bateau et train à Ankara. Là, ses funérailles nationales ont eu lieu en présence de tout le Parlement et de dignitaires du monde entier.\n\nLe père de la nation turque moderne étant désormais disparu, la république doit aller de l'avant. La Grande Assemblée nationale a élu l'ancien Premier ministre Ismet Inönü pour lui succéder."
 turkey.1.a:0 "Atatürk restera dans les mémoires"
 turkey.10.t:0 "[From.GetName] Rejoint le [Root.GetFactionName]!"
 turkey.10.d:0 "Reconnaissant la nécessité d'une unité face aux menaces qui pèsent sur nos pays de toutes parts, [From.GetLeader] a annoncé aujourd'hui au monde que [From.GetName] avait conclu un traité avec [Root.GetName] pour le bien de notre sécurité mutuelle."
 turkey.10.a:0 "[Root.GetName] et [From.GetName] se présente aujourd'hui comme frères."
 turkey.11.t:0 "[From.GetName] Refuse d'adhérer [Root.GetFactionName]"
 turkey.11.d:0 "Dans un acte insensé d'auto-préservation imaginaire, [From.GetLeader] a annoncé aujourd'hui que [From.GetName] s'abstiendrait de toute action diplomatique qui pourrait être considérée comme une menace pour ses puissants voisins. Il a donc décliné notre demande visant à ce qu'ils rejoignent les [Root.GetFactionName]."
 turkey.11.a:0 "La seule sécurité est de rester ensemble."
 turkey.22.t:0 "Hatay - La France est d'accord"
 turkey.22.d:0 "Le gouvernement français a accepté d'organiser un référendum. Les habitants de Hatay voteront sûrement pour rejoindre la Patrie."
 turkey.22.a:0 "Parfait."
 turkey.23.t:0 "Hatay - La France rejette"
 turkey.23.d:0 "Le gouvernement français a rejeté nos demandes ! Ils affirment que la Turquie n'a aucun droit légal sur le territoire de Hatay."
 turkey.23.a:0 "Nous y reviendrons plus tard."
 turkey.4.t:0 "Question du détroit turc"
 turkey.4.d:0 "La zone autour des détroits du Bosphore et des Dardanelles a été démilitarisée par le Traité de Lausanne. Pourtant, dans son état actuel, cette région importante pourrait tomber entre de mauvaises mains. Il vaut mieux laisser aux Turcs la pleine souveraineté là-bas."
 turkey.4.a:0 "Convenu."
 turkey.3.t:0 "La Convention de Montreux"
 turkey.3.d:0 "La communauté internationale a convenu que nous devrions avoir la pleine souveraineté sur le détroit turc. L'ère démilitarisée est révolue. Nous devrions commencer à construire nos défenses immédiatement."
 turkey.3.a:0 "Excellente nouvelle !"
 sadabat.7.t:0 "[From.GetName] Demandes [Root.GetAdjective] Participation au [From.GetFactionName]"
 sadabat.7.d:0 "Avec la signature d'un traité d'amitié entre nos nations, [From.GetName] a demandé que [Root.GetName] les rejoigne dans leur [From.GetFactionName], pour s'unir contre les menaces croissantes qui entourent nos nations. Qu'ils soient communistes ou fascistes, les [From.GetName] promettent de défendre les intérêts des [Root.GetAdjective]."
 sadabat.7.a:0 "[Root.GetName] se tient aux côtés de ses frères."
 sadabat.7.b:0 "[Root.GetName] ne peut survivre que par lui-même."
 sadabat.31.t:0 "La Turquie veut un référendum à Hatay"
 sadabat.31.d:0 "La Turquie a demandé la tenue d'un référendum dans le sandjak syrien autonome d'Alexandrette pour rejoindre la Turquie. Si un tel référendum a lieu, il sera sûrement couronné de succès."
 sadabat.31.a:0 "Ce terrain ne vaut pas grand-chose pour nous. Ils peuvent l'avoir."
 sadabat.31.b:0 "Aucune chance !"
 sovietturkeywar.1.t:0 "La Russie a perdu la guerre de Bakou"
 sovietturkeywar.1.d:0 "Aujourd'hui, les forces turques ont capturé l'Arménie, Bakou, la Géorgie et les montagnes du Caucase, tandis que la guerre entre l'Allemagne et la Russie se poursuit. L'Union soviétique ne peut pas combattre sur deux fronts en même temps et a donc décidé de conclure des accords avec la Turquie."
 sovietturkeywar.1.a:0 "Offrons la paix."
 sovietturkeywar.2.t:0 "L'offre de paix de l'Union soviétique"
 sovietturkeywar.2.d:0 "Aujourd'hui, les forces turques ont capturé l'Arménie, Bakou, la Géorgie et les montagnes du Caucase, tandis que la guerre entre l'Allemagne et la Russie se poursuit. L'Union soviétique ne peut pas combattre sur deux fronts en même temps et a donc décidé de conclure des accords avec la Turquie en proposant Bakou et l'Arménie."
 sovietturkeywar.2.a:0 "Acceptons cette offre."
 englishturkishwar.1.t:0 "Nous avons perdu la guerre !"
 englishturkishwar.1.d:0 "Nos colonies ont été occupées par les Turcs. Peut-être est-il temps de battre en retraite ?"
 englishturkishwar.1.a:0 "Revenons avant que la tension ne monte !"
 englishturkishwar.2.t:0 "La Grande-Bretagne se rend !"
 englishturkishwar.2.d:0 "Le gouvernement britannique a annoncé son retrait de ses colonies du Moyen-Orient. Ils offrent de généreuses concessions, mais peut-être pouvons-nous exiger encore plus. Que devons-nous faire ?"
 englishturkishwar.3.d:0 "Les colonies de Grande-Bretagne ont été occupées par la Turquie, après avoir perdu les batailles du Caire et de Jérusalem. En conséquence, le gouvernement britannique a annoncé son retrait du Moyen-Orient. Le contrôle des Terres Saintes et de l'Égypte appartient à nouveau aux Turcs..."
 staunch_traditionalist:0 "Traditionaliste convaincu"
 TUR_imperialism_focus:0 "L'impérialisme"
 TUR_recovering_from_the_war_for_independence:0 "Se remettre de la guerre d'indépendance"
