 ETH_OILCRISIS_DESC: "S'il a fallu plusieurs décennies de plus à la jeunesse étudiante et à l'intelligentsia éthiopiennes pour s'implanter fermement dans des idéologies internationales spécifiques, ces mouvements ont toujours été inévitables dans leur réalisation en raison du statu quo solide et immuable de la monarchie impériale. La dernière décennie a vu la première formation de partis marxistes et socialistes agraires dans le pays ainsi qu'une tentative de coup d'État réformiste contre la monarchie ; qui, bien qu'impénétrable de l'extérieur, a néanmoins des conséquences lointaines dans l'éthos des généraux et des jeunes officiers soigneusement conspirateurs de la nation. Non, la question n'est pas de savoir si l'Empire éthiopien sombrera dans la révolution, mais plutôt de savoir quand - quelles que soient les mesures de réforme que le Lion de Juda pourra prendre."
 IRE_OILCRISIS_DESC: ""
####

 SUEZCRISIS_DESC: "Le monde est une fois de plus proche d'une guerre totale. Alors que Gamal Abdel Nasser a nationalisé le canal de Suez, certains pays y voient un conflit d'intérêts. Les Britanniques et les Français y voient une menace pour leurs empires. Cependant, Israël pourrait également adhérer au plan compte tenu de ses tensions avec les États arabes. La question est : que se passe-t-il ensuite ?"
 Argentina_1949_desc: "Après la fin de la tristement célèbre décennie, l'approbation du droit de vote des femmes et l'élection de Perón, l'Argentine semble sur la bonne voie vers la démocratie. Perón est à mi-chemin de sa présidence et il semble déjà qu'il va transformer l'économie argentine et sa population et consolider son héritage politique pour les décennies à venir."
 Argentina_1949: "République d'Argentine"
 North_Vietnam_1949_desc: "Le Vietnam a été abandonné par les Français. Toutes les tentatives d'indépendance ont échoué. Bao-Dai, le collaborateur japonais, est à nouveau l'ennemi du Viet Minh. Le sang versé lors de la destruction de Hanoï par les impérialistes chinois sera remboursé par le sang français. La lutte du Vietnam en est désormais une contre l'impérialisme occidental, et Hô Chi Minh se tourne désormais vers le communisme pour gagner ses batailles."
 North_Vietnam_1949: "Viet Nam Dân chu Cong hòa"
 France_1949_desc: "La France est fortement divisée. De la grève Renault en 1947 aux émeutes du pain du Mans et de Verdun en passant par l'occupation des journaux communistes, le pays est prêt à sombrer dans le chaos. Elle doit également faire face aux rébellions à Madagascar et en Indochine, tout en veillant à ce que la Métropole ne sombre pas également dans la rébellion. Le rationnement et les grèves ont caractérisé la France jusqu'à présent, mais il est impossible de supporter éternellement de telles privations. La France et son empire dureront-ils ou tomberont-ils ?"
 France_1949: "République française"
 Spain_1949_desc: "La Seconde Guerre mondiale a été traumatisante pour l'Espagne. Francisco Franco a vu ses camarades fascistes tomber dans la bataille contre les Alliés. La Phalange contrôle toujours la population espagnole et, avec le début de la guerre froide, il est peu probable que quelque chose change en Espagne. L'autoritarisme a maintenu l'Espagne à la fois stable et isolée, et peu de gens veulent du changement, mais il y a toujours une chance de changement."
 Spain_1949: "État espagnol"
 Greece_1949_desc: "Le Royaume de Grèce se trouve dans la ligne de mire de l'Est et de l'Ouest. Les machinations des puissances étrangères ont poussé la Grèce, déjà affaiblie par les cicatrices de l'occupation nazie, à se lancer dans ce qui est devenu une guerre civile qui a duré trois ans. Son existence même étant menacée par les rebelles communistes soutenus par les Soviétiques, le Royaume doit rallier son peuple et ramener la paix dans la nation avant qu'il ne soit trop tard."
 Greece_1949: "Vasíleion tis Elládos"
 ROC_1949_desc: "Pendant huit longues années, le peuple chinois s'est battu bec et ongles pour expulser les impérialistes japonais. Aujourd'hui, notre nation est une fois de plus menacée. Les communistes soutenus par les Soviétiques et dirigés par le traître Mao Zedong ont brisé le Front uni et se sont emparés de vastes pans du pays. La situation est désastreuse et déjà les bandits rouges assiègent Shanghai. Les mois à venir décideront si tout ce pour quoi le Dr Sun s'est battu perdurera."
 ROC_1949: "Zhonghua Mínguó"
 Italy_1949_desc: "La fièvre qui a suivi la mort de Mussolini s'est apaisée. L'abolition de la monarchie en 1948 a redonné à la République italienne un esprit d'espoir et de liberté, mais de nombreuses questions restent sans réponse quant à son avenir. L'Italie est politiquement divisée, les communistes et les restes fascistes menaçant sa jeune démocratie. L'avenir de l'Italie est incertain, mais certainement chaotique."
 Italy_1949: "République italienne"
 Iran_1949_desc: "L'Iran a souffert de l'occupation anglo-soviétique pendant cinq ans. Le Shah, Mohammad Reza Pahlavi, est devenu le remplaçant de son père, soutenu par les Britanniques. Le doux Shah ne fera pas grand-chose au cours de ses premières années au pouvoir, conduisant à la création d'un organe démocratique souple. Le Premier ministre détient désormais un pouvoir considérable, le Shah étant tenu à l'écart de la politique. Alors que l'Iran entre dans la guerre froide, le fera-t-il sous la vision du Majlis, du Shah ou de forces entièrement nouvelles ?"
 Iran_1949: "Kesvar-e Sâhansâhi-ye Irân"
 Finland_1949_desc: "L'indépendance et la position internationale de la Finlande depuis la fin de la Seconde Guerre mondiale ont été décrites comme uniques et déroutantes. Le dur traité de Paris a laissé la Finlande dans la sphère soviétique, contrainte de céder des territoires et de louer des ports à la Marine rouge. Malgré cette pression soviétique extrême, la Finlande a maintenu un gouvernement démocratique. La Finlande doit aborder les années à venir avec prudence et décider si les menaces de Moscou ou ses valeurs démocratiques importent davantage."
 Finland_1949: "Suomen Tasavalta"
 Nicaragua_1949_desc: "Le Nicaragua est une nation avec une histoire riche et troublée. Sous la dictature de Somoza, le Nicaragua est confronté à l'ingérence américaine, aux conflits sociaux et à la guérilla. L'opposition à Somoza, inspirée par le héros anti-impérialiste Sandino, lutte pour la justice sociale et la souveraineté nationale. Le Nicaragua est pris entre deux mondes et les flammes montantes sont inévitables."
 Nicaragua_1949: "République du Nicaragua"
 Cambodia_1949_desc: "Avec la fin de la guerre mondiale, le Cambodge a acquis une certaine autonomie par rapport à ses maîtres français. Alors que la nation fait ses premiers pas vers l'indépendance, l'avenir reste incertain. Le peuple se rassemblera-t-il autour du jeune roi ou choisira-t-il sa propre voie alors que le colonialisme commence à s'effondrer ?"
 Cambodia_1949: "Preah Réachéanachâkr Kâmpuchéa"
 Morocco_1949_desc: "Le Royaume du Maroc est un protectorat tenu en laisse par les Français. Sous le roi charismatique Mohammed V, le peuple marocain a fait ses premiers pas vers l'indépendance, au prix d'une colère croissante de la part de Paris. La nation se trouve à la croisée des chemins, et alors que les tensions montent entre le roi et ses maîtres français, le Maroc pourra-t-il un jour espérer obtenir sa liberté tant désirée ?"
 Morocco_1949: "Protectorat français au Maroc"
 Saudi_Arabia_1949_desc: "Le Royaume d'Arabie Saoudite aurait été méconnaissable il y a seulement vingt ans. L'unification des royaumes arabes sous la bannière de la Maison des Saoud et la découverte ultérieure de pétrole par des prospecteurs américains en 1933 ont apporté au royaume du désert une prospérité sans précédent. Le roi Abdulaziz a gouverné avec sagesse, consacrant ses bénéfices pétroliers au développement de la nation, mais il vieillit de jour en jour. Ses successeurs conserveront-ils sa sagesse ?"
 Saudi_Arabia_1949: "al-Mamlaka al-ʿArabiyya as-Suʿudiyya"
 Rhodesia_1949_desc: "La colonie de Rhodésie du Sud jouit du privilège de l'autonomie gouvernementale, bien entendu limitée à la minorité blanche. Récemment, les discussions sur la formation d'une fédération avec la Rhodésie du Nord et le Nyassaland ont commencé à prendre de l'ampleur, et ce n'est apparemment qu'une question de temps avant que le Parlement autorise le début des négociations."
 Rhodesia_1949: "Colonie de Rhodésie du Sud"
 Ghana_1949_desc: "La colonie riche en ressources de la Gold Coast a joué un rôle important dans l'approvisionnement de la Grande-Bretagne pendant la guerre et a ainsi acquis une certaine autonomie. Avec une administration byzantine et décentralisée et une agitation croissante de la part de la population autochtone, la Gold Coast devra faire preuve de prudence dans les années à venir."
 Ghana_1949: "Colonie de la Gold Coast"
 Red_Malaya_1949_desc: "Depuis le début du XIXe siècle, la péninsule malaise est sous la domination totale de la Grande-Bretagne et des seigneurs féodaux qui paient leur tribut à Londres. Alors que la Grande-Bretagne a promis l'indépendance et les réformes, les communistes de Chin Peng ont décidé d'agir maintenant plutôt que plus tard, et la puissance de leur insurrection grandit chaque jour qui passe. La révolution l'emportera-t-elle ?"
 Red_Malaya_1949: "Tentera Pembebasan Nasional Malaisie"
 Afghanistan_1949_desc: "L'Afghanistan, cimetière des empires, est resté en dehors de la Seconde Guerre mondiale. Ce paisible royaume montagnard est resté figé dans le temps pendant des siècles, mais ces dernières années, il est passé à une monarchie constitutionnelle et a entamé une campagne de modernisation. Pourtant, dans une nation où les tribus sont aussi nombreuses que les montagnes, toutes ne sont pas d'accord avec le roi et son ministère. La dynastie Barakzai est en effet confrontée à un grand défi."
 Afghanistan_1949: "Dǝ Afganistan Sahi Dawlat"
 Qatar_1949_desc: "Le petit royaume du Qatar est un protectorat britannique. Isolé et arriéré, le Qatar a vu un nouvel espoir avec la découverte de pétrole il y a dix ans. Les bénéfices allant en grande partie à Londres, il est peut-être temps pour les Qataris de choisir leur propre destin, que ce soit sous la dynastie Al-Thani ou autrement."
 Qatar_1949: "Dawlat Qatar"
 Sweden_1949_desc: "La Suède est restée neutre alors que le monde était embrasé par la guerre, et elle reste toujours neutre. La division du monde entre l'Ouest et l'Est complique la situation. Même si la Suède souhaite se concentrer sur son développement intérieur, le peuple suédois doit choisir entre réaliser le rêve du « Folkhemmet » ou préparer la nation à la possibilité d'une guerre encore pire que la précédente."
 Sweden_1949: "Konungariket Suède"
 Turkey_1949_desc: "Pendant des centaines d'années, les Turcs ont régné sur le puissant empire Ottoman, mais au lendemain de son effondrement lors de la Grande Guerre, Mustafa Kemal Atatürk a déclaré une nouvelle république turque, fermement laïque, nationaliste et attachée aux valeurs démocratiques et occidentales. La Turquie est restée fidèle au kémalisme au cours des années qui ont suivi sa mort, mais la pression des Alliés occidentaux et de l'Union soviétique s'accentue. Bientôt, la Turquie devra choisir son camp, sous peine de se retrouver laissée pour compte."
 Turkey_1949: "Turquie Cumhuriyeti"
 Burma_1949_desc: "La Birmanie a retrouvé son indépendance après la Seconde Guerre mondiale, mais ses premières années de liberté ont été pour le moins difficiles. Les séparatistes ethniques et les rebelles communistes menacent de mettre le feu au gouvernement fragile de Rangoon. Reste à savoir si la Birmanie elle-même survivra, sans parler du gouvernement."
 Burma_1949: "Pranyhtaungcu Mranma Nuingngamtau"
 PLA_of_Burma_1949_desc: "Le Parti communiste du Drapeau rouge, dirigé par le général rouge Thakin Than Tun, était l'un des dirigeants de la résistance contre l'occupation japonaise. La Birmanie étant désormais indépendante, les communistes de Tan Tun ont pris les armes contre le gouvernement central, qu'ils jugent insuffisamment socialiste. S'ils réussissaient, la Birmanie s'intégrerait fermement au bloc communiste."
 PLA_of_Burma_1949: "Alanni Konmyunit Pahti"
 Lebanon_1949_desc: "Le Liban est devenu indépendant en 1943, mais ses malheurs n'ont pas cessé depuis. Le « Grand Liban » a finalement été créé par les colonialistes français, et la nation est divisée entre sunnites, chiites, maronites, Arméniens et une myriade d'autres groupes religieux et raciaux, tous en lice pour la domination de ce petit et fragile pays. Pour éviter la guerre civile et sauver la démocratie libanaise, il faudrait un miracle."
 Lebanon_1949: "al-Jumhuriyyah al-Lubnaniyyah"
 Yemen_1949_desc: "Au bord de la mer Rouge, le royaume mutawakkilite du Yémen est coincé dans l'époque médiévale. Le règne tyrannique et imprévisible du roi Ahmad bin Yahya s'est fait peu d'amis et de nombreux ennemis, parmi lesquels ses maîtres britanniques qui ne supportent pas ses revendications constantes sur le protectorat d'Aden et ses rêves de « Grand Yémen »."
 Yemen_1949: "al-Mamlakah al-Mutawakkiliyah al-Yamaniyah"
 Libya_1949_desc: "Depuis la fin de la domination italienne sur la Libye, Idris Ier as-Senussi dirige l'Émirat de Cyrénaïque d'une main ferme et avec l'ambition d'unir toute la Libye sous son règne, une proposition que ne partagent pas la France et la Grande-Bretagne. Récemment libérée du colonialisme, la Cyrénaïque est à nouveau confrontée à la menace du colonialisme de la part de ses prétendus alliés, et le rêve de l'émir d'une Libye unie pourrait très bien s'effondrer."
 Libya_1949: "Imarat Cirenaiciya"
 Bahrein_1949_desc: "Le Royaume de Bahreïn est à peine visible sur une carte, mais la découverte du pétrole en 1929 et son importance stratégique dans le golfe Persique l'ont rendu trop important pour ses maîtres britanniques. Même si Bahreïn préfère peut-être l'indépendance, la revendication séculaire et toujours très active de l'Iran sur son territoire signifie que sa relation avec la Grande-Bretagne est un mal nécessaire. Tant que l'Iran n'abandonnera pas ces notions, le statu quo restera."
 Bahrein_1949: "Mamlakat al-Bahrayn"
 Pakistan_1949_desc: "Lorsque la domination britannique sur l'Inde a pris fin en 1947, l'ancien Raj a été divisé en Inde hindoue et Pakistan musulman. Cela a entraîné la mort de milliers de personnes et le déplacement de millions d'autres, mais en fin de compte, les musulmans du sous-continent indien ont désormais une nation à eux. La nouvelle nation, comme sa rivale indienne, souffre de pauvreté, de division et d'un avenir incertain alors que le monde se divise en deux."
 Pakistan_1949: "Mumlikat-e Pakistan"
 Jordan_1949_desc: "La Jordanie a quitté la guerre israélo-arabe de 1948 battue, mais pas vaincue. Le Royaume hachémite de Jordanie est désormais un État indépendant et s'engage à maintenir sa liberté retrouvée. La question de savoir comment aborder Israël demeure. Le roi Abdallah est ouvert à des pourparlers de paix formels, tandis qu'une grande partie de la population, en particulier les Palestiniens de Cisjordanie sous administration jordanienne, n'a aucun désir de compromis."
 Jordan_1949: "Al-Mamlaka al-Urduniyya al-Hashimiyya"
 Iceland_1949: "Île"
 Iceland_1949_desc: "L'Islande est entrée dans la guerre mondiale en tant que partie du royaume danois et en est sortie comme une république indépendante. Bien que la petite nation insulaire espérait un retour à la neutralité pacifiste après la fin de la guerre et l'occupation alliée, la signature du Traité de l'Atlantique Nord par le gouvernement de coalition tripartite a fait de l'Islande une partie intégrante du conflit mondial en gestation. Avec une économie stagnante, une population préoccupée et un besoin de se protéger dans un monde toujours polarisé ; L'Islande doit choisir soigneusement où se situe son allégeance, sous peine de risquer de perdre son indépendance si tant recherchée."
 Sarawak_1949: "Colonie de la Couronne du Sarawak"
 Sarawak_1949_desc: "Autrefois un territoire tranquille sous le règne de la dynastie Brooke, le Sarawak est devenu une colonie de la Couronne après la Seconde Guerre mondiale, marquée par une occupation japonaise dévastatrice. La guerre a détruit l'infrastructure fragile du Sarawak et les années d'après-guerre ont apporté des changements radicaux sous l'administration britannique, visant à moderniser et stabiliser la région. Pourtant, l'héritage du colonialisme et la montée des sentiments anti-impérialistes ont suscité un mécontentement croissant au sein de sa population diversifiée composée de Malais, de Dayaks, de Chinois et d'autres. Alors que le Sarawak entre dans une nouvelle ère, des questions planent sur son avenir. La colonie restera-t-elle fidèle à la Couronne, ou les mouvements nationalistes la pousseront-ils vers l'indépendance et l'autodétermination ?"
 Brunei_1949: "Negeri Brunéi Darussalam"
 Brunei_1949_desc: "Sultanat minuscule mais riche en pétrole, Brunei équilibre depuis longtemps tradition et modernité sous le regard protecteur des autorités coloniales britanniques. Pendant la Seconde Guerre mondiale, l'occupation japonaise a perturbé sa paix relative, laissant des cicatrices qui persistaient même après le rétablissement de la domination britannique. Aujourd'hui, Brunei jouit d'une stabilité économique grâce à ses vastes réserves de pétrole ; mais le Sultanat est confronté à des pressions internes et régionales croissantes. Coincé entre préserver sa monarchie, naviguer dans la modernisation et répondre aux appels croissants à une réforme politique ; Brunei doit décider : va-t-il s'accrocher à la tradition ou s'adapter au vent de changement qui souffle sur l'Asie du Sud-Est ?"
 Paraguay_1949: "République du Paraguay"
 Paraguay_1949_desc: "Le Paraguay entre dans la guerre froide après des décennies de troubles. La deuxième guerre civile paraguayenne, l'épuisante guerre du Chaco et les sympathies pro-nazies de l'ancien président Higinio Morínigo ont profondément fracturé la nation. La chute de Morínigo a conduit à la présidence de courte durée de Juan Natalicio González, qui a été rapidement renversé, ouvrant la voie à une période d'instabilité où les présidents se succèdent en quelques mois seulement. Désormais, c'est Felipe Molas López qui tient les rênes, mais peu croient qu'il tiendra encore longtemps. La question demeure : le Paraguay se stabilisera-t-il sous un régime démocratique, tombera-t-il dans la dictature ou sombrera-t-il dans quelque chose d'encore plus sombre ?"
 Indonesia_1949: "Pemerintahan Darurat République d'Indonésie"
 Indonesia_1949_desc: "L'Indonésie s'est lancée dans une lutte difficile de quatre ans pour son indépendance contre la domination coloniale néerlandaise. La signature de l'accord Roem van Roijen a marqué un tournant important, permettant à la nation d'entrevoir la possibilité d'une souveraineté après des années de lutte. Cet accord visait à ouvrir la voie à une résolution pacifique, mais le chemin à parcourir restait semé d'incertitudes. L'Indonésie réussira-t-elle à obtenir son indépendance durement gagnée, ou les pressions extérieures et les conflits internes menaceront-ils de saper les aspirations à l'autodétermination de cette jeune nation ?"
 Dutch_East_Indies_1949: "Pays-Bas-Inde"
 Dutch_East_Indies_1949_desc: "Les nations vont et viennent, mais certains trésors sont farouchement gardés jusqu'à la fin. Cette métaphore s'applique aux Indes néerlandaises, où les Pays-Bas et l'administration civile néerlando-indienne se sont battus pendant quatre ans pour le contrôle de l'archipel indonésien. Ce qui a commencé comme une guerre coloniale s'est transformé en un conflit international, sous la pression des Nations Unies et des États-Unis exhortant les Pays-Bas à mettre fin à la guerre et à reconnaître l'Indonésie nouvellement indépendante. Malgré cela, les Néerlandais ne cèdent pas et lancent une seconde offensive, mettant l'Indonésie dans une situation précaire. Les Néerlandais parviendront-ils finalement à conserver le contrôle, ou les Pays-Bas lâcheront-ils enfin leur trésor ?"
