l_french:
 BM_HISTORY_TITLE:0 "Bref historique"
 BOOKMARK_1980_NAME:0 "La nouvelle guerre froide"
 BOOKMARK_1980_DESC:0 "En 1980, le monde était plongé dans la Guerre froide, un bras de fer tendu entre les États-Unis et l'Union soviétique. Les tensions étaient vives, les deux camps s'engageant dans une bataille idéologique, sous la menace constante d'une guerre nucléaire. L'invasion soviétique de l'Afghanistan a entraîné un regain d'intérêt pour la préparation militaire. Des mouvements de résistance, comme Solidarność en Pologne, contestaient le pouvoir communiste. La menace d'un conflit nucléaire pesait lourdement sur les relations internationales, tandis que les deux camps rivalisaient pour la suprématie."
 GATHERING_STORM_NAME:0 "Le rideau de fer"
 GATHERING_STORM_DESC:0 "L'optimisme de l'après-guerre quant à la coopération mondiale et à la paix, incarné par la création des Nations Unies, s'est rapidement dissipé. Lors du dernier conflit, les empires européens ont épuisé non seulement leurs propres ressources humaines et financières, mais aussi celles de leurs territoires coloniaux. Aujourd'hui, les peuples colonisés d'Afrique et d'Asie réclament leur indépendance. À l'échelle mondiale, les États-Unis et l'Union soviétique surpassent largement toutes les autres puissances. L'émergence d'une rivalité idéologique entre ces deux États a rapidement refroidi leur amitié de guerre. Déjà, des lignes de fracture se dessinent en Europe, une partition idéologique séparant de plus en plus les régimes capitaliste et communiste."
 UK_1949_desc:0 "La Grande-Bretagne a lutté pour sa survie contre Hitler et en est sortie victorieuse. Mais cette victoire a eu un prix. La moitié de l'Europe sous le rideau de fer, une nation marquée par la guerre et un Empire au bord de l'oubli. Pour la Grande-Bretagne, la paix semble être un combat aussi difficile que la guerre. Les souvenirs du Blitz s'estompent tandis que la peur du communisme s'empare du cœur du Commonwealth."
 UK_1949:0 "Royaume-Uni de Grande-Bretagne et d'Irlande du Nord"
 Canada_1949_desc:0 "Le Canada est sorti de la Première Guerre mondiale en tant que nation et de la dernière guerre en tant que puissance à part entière. De plus en plus indépendant de Londres, le Canada est devenu une nation prospère dotée d'une économie forte et d'une armée moderne. Pour la première fois de son histoire, le Canada a l'occasion de forger son propre destin. Le Grand Nord restera-t-il fort et libre ?"
 Canada_1949:0 "Canada"
 South_Korea_1949_desc:0 "Enfin libérée de l'occupation américaine et japonaise, la jeune République de Corée nourrissait l'espoir d'une réunification pacifique avec ses compatriotes séparés au nord du 38e parallèle. Mais après l'assassinat suspect du seul homme politique de haut rang disposé à négocier avec le Nord et l'accession à la présidence de Syngman Rhee, farouche opposant au communisme, les rêves de paix s'effondrèrent et le destin de la péninsule se forgea dans le sang."
 South_Korea_1949:0 "Daehanminguk"
 WGR_1949_desc:0 "L'Allemagne a entamé la Seconde Guerre mondiale sous l'impulsion des ambitions perverses d'Adolf Hitler, mais l'a terminée en nation vaincue. L'occupation de l'Allemagne après-guerre touche à sa fin ; une division définitive entre un Ouest aligné sur l'Occident et un Est communiste est inévitable. La jeune République fédérale d'Allemagne se trouve dans une situation pour le moins délicate."
 WGR_1949:0 "République fédérale d'Allemagne"
 DDR_1949_desc:0 "Sous le régime militaire soviétique, les Allemands de l'Est se retrouvent sous la coupe de ceux-là mêmes qu'ils ont opprimés. L'occupation est brutale et le moral est au plus bas, mais une lueur d'espoir apparaît avec la transition vers la République démocratique allemande. Enfin, la patrie de Marx aura un gouvernement digne du berceau du communisme."
 DDR_1949:0 "Zone d'occupation soviétique"
 North_Korea_1949_desc:0 "Peu après la proclamation de la République de Corée, l'Union soviétique établit la République populaire démocratique de Corée (RPDC) de son côté du 38e parallèle. Sous la direction de l'ancien résistant Kim Il-sung, la RPDC semble prête à payer le prix fort pour résoudre la question de la réunification. La guerre est imminente et la révolution coréenne fait face à son plus grand défi."
 North_Korea_1949:0 "République populaire démocratique de Corée"
 PRC_1949_desc:0 "Les Japonais ont été vaincus et le cessez-le-feu avec le Kuomintang a été rompu. L'Armée populaire de libération a connu une croissance exponentielle et, grâce au matériel abandonné par les Japonais, les communistes chinois sont prêts à sécuriser le reste de la Chine. Malgré une aide minimale de l'Union soviétique, le leadership de Mao Zedong après la Grande Marche a permis à la révolution de prospérer. Encore quelques villes clés, et la Chine sera enfin unifiée !"
 PRC_1949:0 "Parti communiste chinois"
 USSR_1949_desc:0 "Le peuple soviétique a tout sacrifié lors de la Grande Guerre patriotique, mais au final, le sang versé en valait la peine. Hitler a été vaincu, l'Union sauvée, et sous la direction inflexible de Joseph Staline, l'Union soviétique est devenue une superpuissance capable de rivaliser avec les États-Unis. La guerre contre le fascisme est terminée, mais la longue lutte contre l'impérialisme ne fait que commencer. Le communisme triomphera-t-il, ou la révolution périra-t-elle à jamais ?"
 USSR_1949:0 "Union des républiques socialistes soviétiques"
 Poland_1949_desc:0 "Au lendemain de la Seconde Guerre mondiale, la Pologne est tombée sous le joug soviétique. Bolesław Bierut, considéré comme un proche allié et un disciple idéologique de Staline, règne en maître incontesté sur le pays. L'État polonais a un long chemin à parcourir, mais s'il parvient à apaiser la colère de son peuple et à restaurer sa confiance dans le socialisme, peut-être les horreurs de la Seconde Guerre mondiale pourront-elles être reléguées au passé."
 Poland_1949:0 "République de Pologne"
 Czechoslovakia_1949_desc:0 "Placée sous tutelle soviétique après la guerre, la Tchécoslovaquie a vu son parti, le Parti communiste tchécoslovaque, s'emparer du pouvoir en 1948 lors d'un coup d'État soutenu par l'Union soviétique. Bien que solidement ancrée dans un régime à parti unique sous influence communiste, la Tchécoslovaquie subit une pression croissante de Moscou pour purger les éléments perçus comme déloyaux. Des sacrifices seront nécessaires pour la révolution dans les années à venir."
 Czechoslovakia_1949:0 "République tchécoslovaque"
 Bulgaria_1949_desc:0 "La Bulgarie a combattu aux côtés de l'Axe pendant la Seconde Guerre mondiale, mais lorsque le cours de la guerre s'est retourné contre Hitler, le Front patriotique, dirigé par les communistes, a renversé le gouvernement pro-fasciste et signé la paix avec l'URSS. En 1946, la monarchie a été abolie et, depuis lors, Gueorgui Dimitrov, ancien chef du Komintern et proche de Staline, dirige la Bulgarie socialiste. Il semble qu'à l'heure actuelle, Sofia et Moscou soient indissociables."
 Bulgaria_1949:0 "République populaire de Bulgarie"
 Romania_1949_desc:0 "La Roumanie a combattu aux côtés d'Hitler lors de l'opération Barbarossa, où, de façon peut-être prophétique, l'armée roumaine fut anéantie à Stalingrad. Peu après, Stalingrad, ville qui porte le même nom, instaura le régime communiste en Roumanie, abolissant la monarchie au profit d'une république ouvrière de type soviétique. Le Parti est aujourd'hui déchiré par une scission entre la « faction des prisons », soutenue par les Soviétiques, et la « faction de Moscou », plus modérée, dirigée par Ana Pauker."
 Romania_1949:0 "République populaire roumaine"
 Albania_1949_desc:0 "Le 29 novembre 1944, le Front de libération albanais, sous la direction d'Enver Hoxha, libéra l'Albanie de l'occupation de l'Axe. La monarchie, affaiblie, fut renversée et la République populaire d'Albanie proclamée. Enver Hoxha était un allié indéfectible de Staline et de Mao, et sa loyauté envers la révolution était sans faille. Si la situation venait à changer à Moscou ou à Pékin, Tirana pourrait ne pas être disposée à suivre le mouvement."
 Albania_1949:0 "République populaire d'Albanie"
 Communist_Greece_desc:0 "Depuis trois ans, la Grèce est en proie à une terrible guerre civile, orchestrée par les impérialistes occidentaux. Le peuple grec a le droit de décider de son propre destin, et pour le Parti communiste de Grèce, ce destin est le socialisme. Pour l'instant, le pouvoir est entre les mains d'un dirigeant fantoche de l'Occident, mais la révolution triomphera-t-elle finalement ?"
 Communist_Greece:0 "Armée démocratique grecque"
 Hungary_1949_desc:0 "Pendant quelques années après la fin de la Première Guerre mondiale, la Hongrie fut l'un des premiers États communistes au monde. Incapable de s'allier à ses alliés bolcheviques, la révolution hongroise fut étouffée. Vingt-cinq ans plus tard, elle resurgit triomphalement sous la bannière de l'Armée rouge, plaçant Budapest fermement dans la sphère d'influence soviétique. La position de Moscou tiendra-t-elle ou le changement est-il inévitable ?"
 Hungary_1949:0 "République populaire hongroise"
 USA_1949_desc:0 "La victoire américaine lors de la Seconde Guerre mondiale a consolidé son statut de superpuissance. Plutôt que de retomber dans l'isolationnisme, les États-Unis se sont mobilisés contre l'Union soviétique pour défendre la liberté dans le monde entier, et le sentiment anticommuniste est très répandu dans tout le pays. Mais maintenant que l'arme nucléaire est une possibilité pour les deux camps, les États-Unis pourraient-ils réellement survivre face à un adversaire aussi redoutable ?"
 USA_1949:0 "États-unis d'Amérique"
 Israel_1949_desc:0 "Le peuple juif a été presque anéanti par les armées d'Hitler, et pourtant, grâce à l'indépendance nouvellement acquise d'Israël, il triomphe. Pour la première fois en deux mille ans, la Terre sainte appartient aux Hébreux. Cependant, tout n'est pas rose pour cette nouvelle nation. Sa liberté a été conquise au prix de guerres contre tous ses voisins, et de nombreuses questions politiques restent à résoudre avant que les États arabes ne reviennent se venger."
 Israel_1949:0 "Israël"
 Yugoslavia_1949_desc:0 "La Yougoslavie s'est libérée de l'occupation nazie sous la direction du maréchal Tito et a depuis lors farouchement conservé son indépendance vis-à-vis de l'Est comme de l'Ouest. Jusqu'à présent, le « socialisme de marché » et l'« autogestion » prônés par Tito ont permis un redressement économique, mais l'avenir de la Yougoslavie est loin d'être assuré. Staline nourrit toujours l'ambition de réintégrer Belgrade au sein du pouvoir, et les divisions internes pourraient s'avérer dangereuses. La Yougoslavie peut-elle survivre ?"
 Yugoslavia_1949:0 "République fédérale de Yougoslavie"
 Mongolia_1949_desc:0 "Sous l'impulsion de Khorloogiin Choibalsan, la Mongolie s'engage sur la voie de la modernisation. Grâce à ses liens étroits avec l'Union soviétique, le pays a entrepris son propre programme d'industrialisation, sortant ainsi de son isolement médiéval. Ayant récemment réalisé son rêve de reconnaissance internationale, Choibalsan semble bien parti pour régner sur les steppes pendant de nombreuses années encore."
 Mongolia_1949:0 "République populaire mongole unifiée"
 East_Turkestan_1949_desc:0 "La République du Turkestan oriental est une énigme. Officiellement reconnue comme faisant partie de la Chine, elle est plongée dans un vide politique suite à la guerre civile, et les Ouïghours locaux ont pris le pouvoir sous l'égide soviétique. Face à la victoire probable des communistes de Mao, Moscou soutiendra-t-elle ses anciens alliés, ou le Turkestan oriental est-il condamné à n'être qu'une simple note de bas de page dans l'histoire ?"
 East_Turkestan_1949:0 "République du Turkestan oriental"
 Iraq_1949_desc:0 "Après la guerre israélo-arabe de 1948, l'Irak, malgré sa défaite, est en mesure de jouer un rôle important au Moyen-Orient. Cependant, il doit faire face à la rébellion kurde, récemment inspirée par le soulèvement de Mustafa Barzani. L'Irak dépend des Britanniques, qui ont accès à son pétrole via l'Iraqi Petroleum Company en échange d'une aide. À la cour hachémite, un conflit majeur oppose les nouveaux officiers militaires « libres » aux monarchistes conservateurs ; un conflit qu'il convient de résoudre."
 Iraq_1949:0 "Le Royaume hachémite d'Irak"
 Egypt_1949_desc:0 "Le royaume d'Égypte a officiellement accédé à l'indépendance en 1922, mais rares sont les Égyptiens qui y croient. La Grande-Bretagne conserve le contrôle du canal de Suez et domine le Soudan anglo-égyptien, tandis qu'une petite aristocratie détient la quasi-totalité des richesses et du pouvoir. Si le roi Farouk compte des partisans, nombre de personnalités influentes le perçoivent comme un playboy efféminé qui mène la nation à sa perte. Un seul camp l'emportera."
 Egypt_1949:0 "Le Royaume d'Égypte"
 Syria_1949_desc:0 "Le chemin de la République syrienne vers l'indépendance a été semé d'embûches, et il en va de même aujourd'hui. Outre l'échec des tentatives pour empêcher la création d'Israël, le gouvernement de Shukri al-Quwatli a été renversé par un coup d'État militaire soutenu par les États-Unis. Bien que le général Husni al-Zaim règne confortablement, d'autres généraux convoitent le pouvoir. Lorsque la Syrie parviendra à se libérer du joug des dictatures, pourra-t-elle accéder à la grandeur ?"
 Syria_1949:0 "République syrienne"
 Japan_1949_desc:0 "Les ambitions impériales du Japon ont pris fin avec les bombardements atomiques d'Hiroshima et de Nagasaki. Désormais sous occupation américaine, l'ancien empire du Japon fait face à un avenir incertain et à un long chemin vers la reconstruction. Sous l'égide de Douglas MacArthur, le « Gaijin Shogun », un gouvernement constitutionnel a été rétabli au Japon. Son avenir reste incertain."
 Japan_1949:0 "Japon"
 Philippines_1949_desc:0 "Les Philippines ont accédé à l'indépendance il y a seulement quelques années et entretiennent une alliance étroite avec leur ancien maître face à la menace communiste grandissante, tant à l'intérieur qu'à l'extérieur du pays. Ce jeune pays est instable, les guérillas communistes et les intrigues politiques faisant planer la menace d'un conflit ouvert. Les Philippines sont à la croisée des chemins, et les années à venir détermineront leur avenir pour les décennies à venir."
 Philippines_1949:0 "République des Philippines"
 Hukbalahap_1949_desc:0 "Le mouvement Hukbalahap fut fondé en 1942 comme branche armée du Parti communiste des Philippines afin de mener une résistance armée contre les envahisseurs japonais et le gouvernement collaborationniste. Comptant plus de vingt mille membres à la fin de la guerre, le gouvernement colonial américain, récemment rétabli, refusa néanmoins d'accorder aux unités Huk le statut officiel de guérilla et les avantages liés à leur appartenance à une famille d'anciens combattants. La situation ne fit qu'empirer avec le retour de la corruption et des injustices d'avant-guerre à l'encontre de la population rurale. Finalement, face au refus d'autoriser les députés communistes élus à siéger au Congrès et aux assassinats de figures importantes du mouvement ouvrier, les Huks reprirent refuge dans les montagnes, cette fois-ci avec l'intention de libérer le pays du système corrompu qui l'asservissait."
 Hukbalahap_1949:0 "Armée populaire contre les Japonais"
 Thailand_1949_desc:0 "La Thaïlande est sortie de la Seconde Guerre mondiale quasiment indemne. Malgré son soutien au Japon, les États-Unis ont reconnu le régime du maréchal Plaek Phibunsongkhram après la guerre, en raison de son anticommunisme farouche, à condition que des élections libres soient organisées, ce que Phibun a facilement remporté. La Thaïlande semble prête à poursuivre son occidentalisation rapide sous l'égide du maréchal, mais la menace des communistes et des réactionnaires demeure."
 Thailand_1949:0 "Thailand"
 Cuba_1949_desc:0 "Sous la présidence de Ramón Grau, Cuba abolit l'amendement Platt en 1934 et, pour la première fois de son histoire, devint un État véritablement indépendant. Depuis, Cuba a maintenu des liens étroits avec les États-Unis et les investissements américains ont afflué dans ses ports, même si ce sont les hommes d'affaires étrangers et les élites locales qui en tirent le plus grand profit. Sur le plan intérieur, la démocratie cubaine demeure très fragile."
 Cuba_1949:0 "République de Cuba"
 Dominicana_1949_desc:0 "La République dominicaine vit sous le joug du généralissime Rafael Trujillo depuis 1930. Le peuple souffre de sa tyrannie, et tous ceux qui ont tenté de s'y opposer ont connu une mort atroce aux mains de la police secrète, commandée par son lieutenant d'une loyauté sans faille, Johnny Abbes García. Il semble pour l'instant qu'il n'y ait plus d'espoir pour le peuple dominicain. Mais combien de temps peut-on maintenir un peuple sous le joug ?"
 Dominicana_1949:0 "République dominicaine"
 Belgium_1949_desc:0 "Ayant été envahie, occupée puis libérée pour la seconde fois au XXe siècle, la Belgique traverse une période particulièrement difficile après la Seconde Guerre mondiale. Son industrie et son économie sont ruinées, son armée extrêmement réduite et ses affaires coloniales, stables mais fragiles, sont loin d'être idéales. Sur le plan politique, la Belgique est une démocratie, mais le roi jouit d'une grande influence auprès du peuple, sans compter les rumeurs persistantes émanant des communistes belges."
 Belgium_1949:0 "Royaume de Belgique"
 India_1949_desc:0 "Après des siècles d'oppression étrangère, le Dominion de l'Inde, nouvellement proclamé, a enfin conquis son indépendance de la Grande-Bretagne. Le peuple célèbre sa liberté retrouvée tandis que l'Inde s'apprête à rompre ses derniers liens avec Londres, mais les défis ne font que commencer pour ce nouvel État. La Partition a causé la mort et le déplacement de millions de personnes, la pauvreté est endémique et l'Inde fait face à un conflit renouvelé avec son voisin musulman du Pakistan au sujet du Cachemire."
 India_1949:0 "République de l'Inde"
 Uganda_1949_desc:0 "L'Ouganda bénéficie d'une administration moins interventionniste que les autres colonies britanniques, permettant aux royaumes traditionnels de conserver leur autorité sur les tribus. Cependant, l'économie reste fermement entre les mains des colons blancs et asiatiques, qui ont exclu les Africains autochtones de la lucrative industrie cotonnière. Cette politique, parmi d'autres, a provoqué des troubles au sein du peuple Baganda. L'indépendance de l'Ouganda est-elle inévitable ?"
 Uganda_1949:0 "Protectorat de l'Ouganda"
 South_Vietnam_1949_desc:0 "Sous l'influence française, l'État vietnamien s'oppose au Viet Minh communiste. Malgré ses efforts de modernisation, l'empereur Bao Dai est profondément impopulaire et perçu comme une marionnette corrompue de Paris. Le changement se profile au Vietnam. Sera-t-il instauré par le Viet Minh, ou l'État vietnamien connaîtra-t-il sa propre révolution ?"
 South_Vietnam_1949:0 "Vietnam"
 Nigeria_1949_desc:0 "Le Nigéria constitue une exception parmi les colonies britanniques. Alors que la majeure partie de l'Afrique de l'Ouest demeure fermement sous administration britannique, le Nigéria reste divisé entre de nombreuses tribus et une fracture générale entre un nord musulman et un sud chrétien, ce qui exige une approche moins interventionniste. Face à la montée des tensions entre les différentes tribus et les seigneurs féodaux, des décisions difficiles doivent être prises pour l'avenir de la colonie."
 Nigeria_1949:0 "Colonie et protectorat du Nigéria"
 OTHER_DESC:0 "Les nations du monde, grandes et petites, ne se contentent pas de retenir leur souffle en attendant le déclenchement d'un nouveau conflit mondial. Des grandes puissances au bord de la guerre civile aux nombreuses nations façonnées et transformées par la Seconde Guerre mondiale, toutes devront prendre des décisions difficiles et concilier idéaux et pragmatisme pour infléchir l'avenir du monde."
 Kenya_1949_desc:0 "La colonie et le protectorat du Kenya sont loin d'être un modèle de colonie. Si la plupart des habitants du Royaume-Uni n'évoquent guère cette nation de leur empire, avec ses six millions d'habitants répartis dans quatre grandes villes et de nombreuses bourgades, la majorité africaine du Kenya pense régulièrement à son statut de sujet britannique. Établie au plus fort de la course à l'Afrique, la colonie kenyane est principalement peuplée par l'ethnie kikuyu, et l'on y observe une présence britannique notable, tant au niveau commercial que géographique. Comme dans toute colonie africaine, une petite minorité de jeunes étudiants et d'intellectuels anticolonialistes et panafricanistes gravite autour de la figure de Jomo Kenyatta. Cependant, la véritable menace pour la stabilité coloniale du Kenya réside dans la population rurale, largement analphabète, où des prophètes et des mystiques itinérants forment des milices dans les campagnes des hauts plateaux du centre."
 Kenya_1949:0 "Colonie et protectorat du Kenya"
 Ethiopia_1949_desc:0 "L'Éthiopie, ou Empire éthiopien, est une nation multiethnique et religieusement diverse, abritant environ 18 millions d'habitants. En proie à la sécheresse et à la famine, l'Éthiopie compte une population majoritairement composée de serfs illettrés ne parlant que leur langue régionale. Si la Couronne souhaite moderniser le pays comme elle l'envisage, elle devra s'attaquer à ces problèmes majeurs. Alors que la reconstruction de l'Éthiopie après la Seconde Guerre italo-éthiopienne touche à sa fin, l'Empire éthiopien semble avoir atteint l'apogée de sa stabilité. Seule nation africaine indépendante d'importance, l'Éthiopie bénéficie de nombreuses opportunités en cette période de stabilité, exempte de conflits internes. Grâce à la politique étrangère internationaliste d'Haïlé Sélassié, l'Éthiopie devrait s'ouvrir davantage au monde dans cette nouvelle ère marquée par la rivalité entre superpuissances."
 Ethiopia_1949:0 "Éthiopie"
 SAF_1949_desc:0 "L'Afrique du Sud sortit de la victoire des Alliés avec un prestige et un honneur national accrus, grâce à son engagement indéfectible aux côtés des Alliés occidentaux. Son influence au sein de la communauté internationale s'affirmait, à une époque où la lutte du Tiers-Monde contre le colonialisme n'occupait pas encore une place centrale sur la scène internationale. Comme en 1919, Smuts exhorta les délégués à créer un puissant organisme international pour préserver la paix ; il était déterminé à ce que, contrairement à la Société des Nations, l'ONU soit dotée d'un réel pouvoir de décision. Cependant, les luttes politiques internes au sein de la communauté afrikaner, mécontente et appauvrie, ne tardèrent pas à se manifester, entraînant la défaite de Smuts aux élections de 1948 face à un Parti national renaissant de ses cendres. Aujourd'hui, ce Parti national s'emploie à instaurer une ségrégation institutionnalisée dans le pays avec son système d'apartheid."
 SAF_1949:0 "Union sud-africaine"
 Portugal_1949_desc:0 "Après être resté neutre durant la Seconde Guerre mondiale, le Portugal a pris une position résolument pro-occidentale en devenant l'un des membres fondateurs de l'OTAN. Face à la montée des mouvements communistes, le Portugal doit riposter sous peine de devenir la prochaine victime du communisme.\n\nLa dictature de l'Estado Novo est toujours en place et tente de maintenir son empire colonial. Cependant, un mouvement de décolonisation déferle sur l'Afrique, appelant l'Europe à la décolonisation. Alors que ce processus a déjà commencé, nombreux sont ceux qui se tournent vers le Portugal, l'incitant à suivre le mouvement. Le Portugal doit soit affirmer sa présence en Afrique, soit envisager une autre voie."
 Portugal_1949:0 "République portugaise"
 DECADE_CRISIS_NAME:0 "La décennie de crise"
 DECADE_CRISIS_DESC:0 "Le processus de décolonisation a vu des nations accéder à la liberté pacifiquement ou par la violence en Asie. Aujourd'hui, les peuples africains revendiquent leur liberté avec une ferveur accrue, tandis que les puissances impériales font face à la vague grandissante de la décolonisation. Au Moyen-Orient, le nationalisme arabe promet gloire et destruction de l'ancien ordre. La rivalité entre les États-Unis et l'Union soviétique s'est muée en une lutte acharnée pour l'influence mondiale. De plus en plus désenchantés par les manœuvres soviétiques et américaines, certains États aspirent à maîtriser leur propre destin. L'avenir nous dira si ces États pourront survivre dans ce monde bipolaire."
 ETH_DECADE_CRISIS_DESC:0 "L'Éthiopie est confrontée à une crise de modernité. Cherchant à prouver sa légitimité, Haïlé Sélassié s'est concentré sur la politique étrangère, alors que le panafricanisme et la décolonisation déferlent sur le continent africain, négligeant ainsi sa situation intérieure. Hors de la capitale impériale, l'Éthiopie est une nation engluée dans le Moyen Âge, et tous contestent les ambitions de l'Empereur, tandis que son peuple demeure pauvre et illettré. Le Lion de Juda doit emprunter une nouvelle voie, sous peine d'être anéanti lors des batailles à venir."
 KEN_DECADE_CRISIS_DESC:0 "Bien que le soulèvement Mau Mau soit terminé, les troubles au Kenya persistent. Si beaucoup considèrent la décolonisation de l'Empire britannique comme inévitable, un groupe influent et très actif de colons et d'hommes d'affaires britanniques au sein de l'assemblée coloniale est d'un avis contraire. Le peuple réclame la liberté et voit en Jomo Kenyatta, emprisonné, son véritable leader. La décolonisation n'est peut-être pas inévitable, mais une prise de conscience s'impose."
 OILCRISIS_NAME:0 "La crise pétrolière"
 OILCRISIS_DESC:0 "La détente a permis aux relations entre les États-Unis et l'Union soviétique de passer de l'hostilité à une certaine entente. Si la guerre atomique est pour l'instant écartée, le monde est loin d'être stable. Le Vietnam est devenu un désastre pour l'Amérique, le Moyen-Orient semble au bord de l'embrasement et le mouvement des non-alignés gagne en influence à mesure que les nations du monde postcolonial se lassent des jeux de pouvoir entre l'Ouest et l'Est. Les années 1970 seront la décennie la plus imprévisible de la Guerre froide."
 USA_DECADE_CRISIS_DESC:0 "Les États-Unis d'Amérique ont assumé leur rôle de « leader du monde libre ». Après la chute de Cuba et de la Chine dans le communisme, la stratégie d'endiguement est pleinement mise en œuvre. Les États-Unis feront tout leur possible pour stopper la propagation du communisme, tandis que l'Asie, l'Amérique latine et l'Afrique deviennent de nouveaux champs de bataille pour Washington et Moscou. Khrouchtchev menace d'anéantir l'Amérique, mais il faudra plus que de vaines paroles pour dissuader le peuple américain."
 SOV_DECADE_CRISIS_DESC:0 "L'Union des républiques socialistes soviétiques a déstalinisé son système politique et stabilisé ses problèmes internes. Elle se concentre désormais sur l'exploration spatiale et l'expansion de son influence en Afrique, en Asie et en Amérique latine. L'Union soviétique est en pleine ascension. La croissance économique et la domination politique de l'URSS se maintiendront-elles ou les Américains parviendront-ils à renverser la situation face aux Soviétiques ?"
 DDR_DECADE_CRISIS_DESC:0 "La République démocratique allemande, sous Walter Ulbricht, a continué de suivre l'Union soviétique en matière politique et économique. Le phénomène de la « Republikflucht », c'est-à-dire la défection de personnes souvent instruites vers l'Allemagne de l'Ouest, s'est révélé un problème crucial qui menace le pays d'une fuite des cerveaux. Des mesures drastiques doivent être prises pour préserver le système socialiste."
 PRC_DECADE_CRISIS_DESC:0 "La République populaire de Chine est sortie victorieuse de la guerre civile chinoise. Le Kuomintang ayant été exilé à Taïwan, Mao a entrepris de transformer la Chine en l'expérience socialiste la plus ambitieuse jamais menée. Malgré quelques succès, la première décennie de son règne a été marquée par le désastreux Grand Bond en avant, qui a fait des millions de morts. Désormais écarté de la direction directe du PCC, le Grand Timonier s'emploie à ramener la révolution chinoise à sa vision radicale."
 CUB_DECADE_CRISIS_DESC:0 "La République de Cuba a embrassé la révolution sous l'impulsion du charismatique Fidel Castro. Les troubles et l'instabilité ont conduit à la destitution de Batista en janvier 1959 par le Mouvement du 26 juillet, qui a ensuite instauré un État socialiste à parti unique. Si les États-Unis ont d'abord accueilli favorablement la révolution cubaine, la nationalisation des avoirs américains par Castro et les exécutions politiques qui ont suivi ont rapidement refroidi les relations. La révolution cubaine va bientôt connaître son baptême du feu."
 VIE_DECADE_CRISIS_DESC:0 "La République du Vietnam fut proclamée le 26 octobre 1955, avec Ngô Đình Diệm comme premier président. Opposé au gouvernement d'Hô Chi Minh à Hanoï, Diệm s'est lancé dans un ambitieux programme de réformes visant à transformer le Viêt Nam selon sa vision idéologique, singulière et souvent incohérente. Les échecs de réunification, la corruption et les troubles politiques et religieux ont accru la méfiance des États-Unis et de l'armée vietnamienne à son égard. Une nouvelle erreur pourrait bien embraser le Viêt Nam."
 FRA_DECADE_CRISIS_DESC:0 "La République française vient d'être réformée sous Charles de Gaulle pour devenir la Ve République, succédant à la IVe République et remplaçant l'ancienne république parlementaire par un système semi-présidentiel. De Gaulle, premier président français élu sous la Ve République en décembre 1958, est partisan d'un chef d'État fort, qu'il décrit comme incarnant l'esprit de la nation. Bien que le pays le soutienne, la guerre d'Algérie et les tensions avec Washington doivent être réglées rapidement."
 ENG_DECADE_CRISIS_DESC:0 "Le Royaume-Uni a essuyé défaite sur défaite. La crise de Suez, les tensions coloniales et le déclin général de son influence face à la domination américaine du monde capitaliste ont amené de nombreux Britanniques à s'interroger sur la survie du Commonwealth. Une chose est sûre : l'époque où Sa Majesté régnait sur un empire où le soleil ne se couchait jamais touche à sa fin, redéfinissant ainsi les relations de Londres avec le Commonwealth et l'OTAN."
 ZIM_DECADE_CRISIS_DESC:0 "Depuis 1953, la Rhodésie du Sud, la Rhodésie du Nord et le Nyassaland forment une fédération instable. À l'aube de cette nouvelle décennie, nombreux sont ceux qui s'interrogent sur la pérennité de cette fédération coloniale. L'agitation anticoloniale et la méfiance croissante envers Londres en Rhodésie du Sud pourraient bien sonner le glas de cette fédération et compromettre l'avenir de ses successeurs."
 NGA_DECADE_CRISIS_DESC:0 "Grâce aux efforts concertés des groupes politiques du pays, le Nigéria est sur le point d'accéder à son indépendance, prévue pour octobre. Les politiciens nigérians ont enfin pu former un gouvernement. Abubakar Tafawa Balewa sera le premier Premier ministre de la nation et devra relever le défi de guider un pays naissant vers un avenir incertain, marqué par les conflits ethno-religieux et les manœuvres de la Guerre froide."
 1990_DESC:0 "La Guerre froide est terminée. L'Amérique a consolidé sa place de seule superpuissance, tandis que l'Union soviétique semble vouée à l'effondrement, ou du moins à la perte de son influence internationale. De nombreux pays du bloc de l'Est organisent des élections libres pour la première fois depuis des décennies, suite à la chute du mur de Berlin. Est-ce la fin de l'histoire, ou de nouveaux conflits sont-ils susceptibles d'embraser à nouveau le monde ?"
 YUG_1990_DESC:0 "La Yougoslavie se désagrège. Depuis la mort de Tito, les tensions ethniques n'ont cessé de croître à travers le pays. À l'aube de cette nouvelle décennie, ces tensions risquent de dégénérer en violence. La Yougoslavie peut-elle être sauvée, ou les Slaves du Sud sont-ils condamnés à un destin tragique ?"
 USA_OILCRISIS_DESC:0 "Les États-Unis font face à un avenir incertain alors que les dernières troupes se préparent à se retirer du Vietnam. L'inflation a grimpé jusqu'à près de neuf pour cent, affaiblissant le dollar américain. Les jeunes manifestent dans les rues pour la paix, la justice, et parfois simplement par esprit de contestation. Des changements sociaux se profilent également, avec l'entrée dans le langage courant de la « révolution sexuelle », des « Black Panthers » et du « féminisme ». Bien que la détente ait réchauffé les relations avec Moscou et Pékin, la remise en question culturelle américaine ne fait que commencer."
 PRC_OILCRISIS_DESC:0 "La République populaire de Chine est en pleine Révolution culturelle et connaît d'immenses bouleversements. L'éducation socialiste se poursuit activement, et de jeunes travailleurs urbains chinois sont envoyés à la campagne pour se rééduquer. Le président Mao reste au pouvoir, mais on s'interroge déjà sur sa succession. Les tensions avec les Soviétiques demeurent vives, les deux géants socialistes poursuivant leurs visions respectives d'une société socialiste. L'hostilité persiste envers la République de Chine, les deux États continuant de s'affronter diplomatiquement et par procuration. Nombreux sont ceux qui voient dans la récente avancée dans les relations avec les États-Unis une opportunité de contrer la menace soviétique et d'isoler potentiellement la République de Chine."
 SOV_OILCRISIS_DESC:0 "Depuis la chute de Khrouchtchev en 1964, l'Union soviétique est dirigée par le plus conservateur Léonid Brejnev. Tout en supervisant l'amélioration du niveau de vie et les nouveaux efforts de paix avec les États-Unis, l'Union soviétique reste confrontée à des intrigues politiques internes et à une lutte pour le leadership du mouvement communiste mondial face à la Chine. Bien que l'Union soviétique semble pour l'instant inébranlable, le statu quo pourrait ne pas durer indéfiniment."
 EGY_OILCRISIS_DESC:0 "L'issue incertaine de la guerre du Kippour en Égypte a plongé le pays dans l'incertitude. Le président Anouar el-Sadate a, durant une grande partie de son mandat, tenté de rompre avec le nassérisme, or c'est précisément cette idéologie qui a conduit à la désastreuse guerre des Six Jours. Une paix avec Israël pourrait certes permettre à l'Égypte de récupérer le Sinaï, mais une telle mesure l'isolerait de ses alliés syriens et libyens et porterait un coup fatal au mouvement panarabe."
 ISR_OILCRISIS_DESC:0 "Tandis que les soldats israéliens priaient en ce jour saint, les Égyptiens et les Syriens lançaient leurs armées au combat. En deux semaines et cinq jours, l'ennemi fut repoussé. L'agression manifeste des États arabes, conjuguée à la victoire d'Israël, a renforcé le soutien de l'Occident. Pourtant, la guerre est désormais terminée, et Israël doit s'engager sur la longue voie de la paix avec les nations arabes si le peuple juif veut que son sacrifice porte ses fruits."
 FRA_OILCRISIS_DESC:0 "L'époque où la France était une grande puissance touche à sa fin. L'Empire n'est plus qu'un lointain souvenir. La domination américaine sur l'Occident est également perçue comme une atteinte au sentiment français. Si la France ne peut plus être une puissance impérialiste, elle doit préserver sa culture, sa fierté et sa dignité dans les années tumultueuses à venir, afin que le peuple français conserve toute sa place dans le monde."
 SYR_OILCRISIS_DESC:0 "La défaite humiliante de la Syrie lors de la catastrophique guerre des Six Jours, qui s'est soldée par la prise du plateau du Golan par l'ennemi sioniste, a entraîné la chute de Salah Jadid. Après l'inévitable lutte de pouvoir, le président Hafez al-Assad a accédé au pouvoir pour mettre en œuvre son Mouvement correctif, un ambitieux programme de modernisation. La Syrie renaîtra, et le Lion du Levant prendra sa revanche sur les Israéliens et leurs alliés occidentaux."
 WGR_OILCRISIS_DESC:0 ""
 ENG_OILCRISIS_DESC:0 ""
 DDR_OILCRISIS_DESC:0 ""
 ITA_OILCRISIS_DESC:0 ""
 RAJ_OILCRISIS_DESC:0 ""
 POL_OILCRISIS_DESC:0 ""
 ETH_OILCRISIS_DESC:0 "Bien que la jeunesse étudiante et intellectuelle éthiopienne ait mis plusieurs décennies de plus à s'ancrer fermement dans des idéologies internationales spécifiques, ces mouvements étaient inévitables, compte tenu du statu quo solide et immuable de la monarchie impériale. La dernière décennie a vu l'émergence des premiers partis marxistes et socialistes agraires dans le pays, ainsi qu'une tentative de coup d'État réformateur contre la monarchie. Si cette tentative reste impénétrable de l'extérieur, elle n'en demeure pas moins profondément ancrée dans l'éthique des généraux et jeunes officiers de la nation, qui complotent avec soin. Non, la question n'est pas de savoir si l'Empire éthiopien sombrera dans la révolution, mais quand – quelles que soient les réformes que puisse entreprendre le Lion de Juda."
 IRE_OILCRISIS_DESC:0 ""
 SUEZCRISIS_DESC:0 "Le monde est à nouveau au bord d'une guerre totale. La nationalisation du canal de Suez par Gamal Abdel Nasser est perçue par certains pays comme un conflit d'intérêts. Les Britanniques et les Français y voient une menace pour leurs empires. Israël pourrait également se rallier à ce projet, compte tenu de ses tensions avec les États arabes. La question est : que va-t-il se passer ensuite ?"
 Argentina_1949_desc:0 "Après la fin de la décennie tristement célèbre, l'obtention du droit de vote des femmes et l'élection de Perón, l'Argentine semble s'engager sur la voie de la démocratie. À mi-mandat, Perón paraît déjà en passe de transformer l'économie argentine et sa population, et de consolider son héritage politique pour les décennies à venir."
 Argentina_1949:0 "République d'Argentine"
 North_Vietnam_1949_desc:0 "Le Vietnam a été abandonné par les Français. Toutes les tentatives d'indépendance ont échoué. Bao Dai, le collaborateur japonais, est redevenu l'ennemi du Viet Minh. Le sang versé lors du sac d'Hanoï par les impérialistes chinois sera vengé par le sang français. Le combat du Vietnam est désormais une lutte contre l'impérialisme occidental, et Hô Chi Minh se tourne maintenant vers le communisme pour remporter ses victoires."
 North_Vietnam_1949:0 "République démocratique du Vietnam"
 France_1949_desc:0 "La France est profondément divisée. De la grève Renault de 1947 aux émeutes du pain du Mans et de Verdun, en passant par l'occupation des journaux communistes, le pays est au bord du chaos. Il doit également faire face aux rébellions à Madagascar et en Indochine, tout en veillant à ce que la Métropole ne sombre pas elle aussi dans le chaos. Rationnement et grèves ont marqué l'histoire de la France jusqu'à présent, mais il est impossible de supporter indéfiniment de telles privations. La France et son empire survivront-ils ou s'effondreront-ils ?"
 France_1949:0 "République française"
 Spain_1949_desc:0 "La Seconde Guerre mondiale a été un traumatisme pour l'Espagne. Francisco Franco a vu ses camarades fascistes tomber au combat face aux Alliés. La Phalange contrôle toujours la population espagnole et, avec le début de la Guerre froide, il est peu probable que la situation évolue en Espagne. L'autoritarisme a maintenu l'Espagne stable mais isolée, et peu aspirent au changement, même si l'espoir d'une évolution demeure."
 Spain_1949:0 "État espagnol"
 Greece_1949_desc:0 "Le royaume de Grèce se retrouve pris entre deux feux, à l'Est comme à l'Ouest. Les manœuvres des puissances étrangères ont plongé la Grèce, déjà affaiblie par les séquelles de l'occupation nazie, dans une guerre civile qui dure depuis trois ans. Menacée d'extinction par les rebelles communistes soutenus par les Soviétiques, la Grèce doit rassembler son peuple et ramener la paix avant qu'il ne soit trop tard."
 Greece_1949:0 "Royaume de Grèce"
 ROC_1949_desc:0 "Pendant huit longues années, le peuple chinois a lutté avec acharnement pour chasser les impérialistes japonais. Aujourd'hui, notre nation est de nouveau menacée. Les communistes, soutenus par les Soviétiques et menés par le traître Mao Zedong, ont brisé le Front uni et se sont emparés de vastes régions du pays. La situation est critique, et déjà, les bandits rouges assiègent Shanghai. Les mois à venir seront décisifs pour le sort de tout ce pour quoi le Dr Sun a combattu."
 ROC_1949:0 "République de Chine"
 Italy_1949_desc:0 "L'euphorie qui a suivi la mort de Mussolini s'est apaisée. L'abolition de la monarchie en 1948 a insufflé à la République italienne un esprit d'espoir et de liberté, mais de nombreuses questions demeurent quant à son avenir. L'Italie est politiquement divisée, les communistes comme les vestiges fascistes menaçant sa jeune démocratie. L'avenir de l'Italie est incertain, mais assurément chaotique."
 Italy_1949:0 "République italienne"
 Iran_1949_desc:0 "L'Iran a subi l'occupation anglo-soviétique pendant cinq ans. Le Shah, Mohammad Reza Pahlavi, succéda à son père, avec l'aval des Britanniques. Le Shah, d'un tempérament modéré, entreprit peu de réformes durant ses premières années au pouvoir, ce qui aboutit à la création d'un corps démocratique aux pouvoirs limités. Le Premier ministre détient désormais un pouvoir considérable, le Shah étant marginalisé sur le plan politique. Alors que l'Iran entre dans la Guerre froide, le fera-t-il sous l'égide du Majlis, du Shah, ou sous l'impulsion de forces entièrement nouvelles ?"
 Iran_1949:0 "L'État impérial d'Iran"
 Finland_1949_desc:0 "L'indépendance et la position internationale de la Finlande depuis la fin de la Seconde Guerre mondiale sont qualifiées d'uniques et de déconcertantes. Le traité de Paris, d'une sévérité implacable, a placé la Finlande dans la sphère d'influence soviétique, l'obligeant à céder des territoires et à louer ses ports à la Marine rouge. Malgré cette pression soviétique extrême, la Finlande a conservé un gouvernement démocratique. Elle devra aborder les années à venir avec prudence et choisir entre les menaces de Moscou et ses valeurs démocratiques."
 Finland_1949:0 "République de Finlande"
 Nicaragua_1949_desc:0 "Le Nicaragua est une nation à l'histoire riche et tourmentée. Sous la dictature de Somoza, le pays est confronté à l'ingérence américaine, aux troubles sociaux et à la guérilla. L'opposition à Somoza, inspirée par le héros anti-impérialiste Sandino, lutte pour la justice sociale et la souveraineté nationale. Le Nicaragua est pris entre deux mondes, et l'escalade des tensions est inévitable."
 Nicaragua_1949:0 "République du Nicaragua"
 Cambodia_1949_desc:0 "Avec la fin de la Seconde Guerre mondiale, le Cambodge a acquis une certaine autonomie vis-à-vis de la France. Alors que la nation fait ses premiers pas vers l'indépendance, l'avenir demeure incertain. Le peuple se ralliera-t-il au jeune roi ou choisira-t-il sa propre voie à mesure que le colonialisme s'effrite ?"
 Cambodia_1949:0 "Royaume du Cambodge"
 Morocco_1949_desc:0 "Le royaume du Maroc est un protectorat étroitement surveillé par la France. Sous le règne du charismatique roi Mohammed V, le peuple marocain a fait ses premiers pas vers l'indépendance, au prix d'une colère grandissante de la part de Paris. La nation se trouve à la croisée des chemins, et face à la montée des tensions entre le roi et ses maîtres français, le Maroc peut-il espérer un jour obtenir la liberté tant désirée ?"
 Morocco_1949:0 "Protectorat français au Maroc"
 Saudi_Arabia_1949_desc:0 "Le royaume d'Arabie saoudite aurait été méconnaissable il y a seulement vingt ans. L'unification des royaumes arabes sous la bannière de la maison des Saoud et la découverte subséquente de pétrole par des prospecteurs américains en 1933 ont apporté à ce royaume désertique une prospérité sans précédent. Le roi Abdelaziz a gouverné avec sagesse, investissant les profits pétroliers dans le développement du pays, mais son âge avance. Ses successeurs sauront-ils perpétuer sa sagesse ?"
 Saudi_Arabia_1949:0 "Le Royaume d'Arabie saoudite"
 Rhodesia_1949_desc:0 "La colonie de Rhodésie du Sud bénéficie d'une autonomie, réservée toutefois à la minorité blanche. Récemment, les discussions en vue de la formation d'une fédération avec la Rhodésie du Nord et le Nyassaland ont pris de l'ampleur, et il semble que ce ne soit qu'une question de temps avant que le Parlement n'autorise l'ouverture des négociations."
 Rhodesia_1949:0 "Colonie de Rhodésie du Sud"
 Ghana_1949_desc:0 "La colonie de la Côte-de-l'Or, riche en ressources, a joué un rôle crucial dans l'approvisionnement de la Grande-Bretagne pendant la guerre et a, de ce fait, acquis une certaine autonomie. Avec une administration complexe et décentralisée et une agitation croissante de la population autochtone, la Côte-de-l'Or devra faire preuve de prudence dans les années à venir."
 Ghana_1949:0 "Colonie de la Côte d'Or"
 Red_Malaya_1949_desc:0 "Depuis le début du XIXe siècle, la péninsule malaise est entièrement dominée par la Grande-Bretagne et les seigneurs féodaux qui paient tribut à Londres. Malgré les promesses d'indépendance et de réformes de la Grande-Bretagne, les communistes de Chin Peng ont décidé d'agir sans tarder, et la force de leur insurrection grandit de jour en jour. La révolution triomphera-t-elle ?"
 Red_Malaya_1949:0 "Armée de libération nationale malaisienne"
 Afghanistan_1949_desc:0 "L'Afghanistan, cimetière des empires, est resté à l'écart de la Seconde Guerre mondiale. Ce paisible royaume montagneux est resté figé dans le temps pendant des siècles, mais ces dernières années, il a opéré une transition vers une monarchie constitutionnelle et s'est lancé dans une campagne de modernisation. Pourtant, dans une nation où les tribus sont aussi nombreuses que les montagnes, tous ne partagent pas l'avis du roi et de son gouvernement. La dynastie Barakzaï est confrontée à un défi de taille."
 Afghanistan_1949:0 "L'État d'Afghanistan"
 Qatar_1949_desc:0 "Le petit royaume du Qatar est un protectorat britannique. Isolé et en retard de développement, le Qatar a connu un regain d'espoir avec la découverte du pétrole il y a une dizaine d'années. Les profits étant en grande partie captés par Londres, il est peut-être temps pour les Qataris de choisir leur propre destin, que ce soit sous la dynastie Al-Thani ou autrement."
 Qatar_1949:0 "Qatar"
 Sweden_1949_desc:0 "La Suède est restée neutre alors que le monde était ravagé par la guerre, et elle le reste encore aujourd'hui. La division du monde entre l'Ouest et l'Est complexifie la situation. Malgré sa volonté de se concentrer sur son développement intérieur, le peuple suédois doit choisir entre réaliser le rêve d'une « Folkehemmet » (union nationale) ou préparer la nation à l'éventualité d'une guerre encore plus dévastatrice que la précédente."
 Sweden_1949:0 "Royaume de Suède"
 Turkey_1949_desc:0 "Pendant des siècles, les Turcs ont régné sur le puissant Empire ottoman, mais après son effondrement lors de la Première Guerre mondiale, Mustafa Kemal Atatürk proclama une nouvelle république turque, résolument laïque, nationaliste et attachée aux valeurs démocratiques et occidentales. La Turquie est restée fidèle au kémalisme depuis sa mort, mais la pression des Alliés occidentaux et de l'Union soviétique s'intensifie. Bientôt, la Turquie devra choisir son camp, sous peine d'être laissée pour compte."
 Turkey_1949:0 "République de Turquie"
 Burma_1949_desc:0 "La Birmanie a recouvré son indépendance après la Seconde Guerre mondiale, mais ses premières années de liberté ont été pour le moins difficiles. Des séparatistes ethniques et des rebelles communistes menacent de plonger le fragile gouvernement de Rangoun dans le chaos. L'avenir de la Birmanie elle-même, et a fortiori de son gouvernement, reste incertain."
 Burma_1949:0 "Birmanie"
 PLA_of_Burma_1949_desc:0 "Le Parti communiste du Drapeau rouge, dirigé par le général rouge Thakin Than Tun, fut l'un des chefs de la résistance contre l'occupation japonaise. La Birmanie étant désormais indépendante, les communistes de Tan Tun ont pris les armes contre le gouvernement central, qu'ils jugent insuffisamment socialiste. S'ils parvenaient à leurs fins, la Birmanie basculerait définitivement au sein du bloc communiste."
 PLA_of_Burma_1949:0 "Parti communiste du Drapeau rouge"
 Lebanon_1949_desc:0 "Le Liban a accédé à l'indépendance en 1943, mais ses difficultés persistent. Le « Grand Liban » est une création des colonialistes français, et le pays est profondément divisé entre sunnites, chiites, maronites, Arméniens et une multitude d'autres groupes religieux et ethniques, tous en lice pour la domination de ce petit pays fragile. Éviter la guerre civile et sauver la démocratie libanaise relèverait du miracle."
 Lebanon_1949:0 "La République libanaise"
 Yemen_1949_desc:0 "Sur les rives de la mer Rouge, le royaume mutawakkilite du Yémen est figé dans le Moyen Âge. Le règne tyrannique et imprévisible du roi Ahmad bin Yahya lui a valu peu d'amis et beaucoup d'ennemis, parmi lesquels ses maîtres britanniques, incapables de supporter ses revendications incessantes sur le protectorat d'Aden et ses rêves de « Grand Yémen »."
 Yemen_1949:0 "Le royaume du Yémen"
 Libya_1949_desc:0 "Depuis la fin de la domination italienne sur la Libye, Idris Ier as-Senussi règne sur l'émirat de Cyrénaïque avec fermeté et ambition d'unifier toute la Libye sous son autorité, un projet que ni la France ni la Grande-Bretagne ne partagent. À peine libérée du colonialisme, la Cyrénaïque se retrouve de nouveau menacée par le colonialisme de ses prétendus alliés, et le rêve de l'émir d'une Libye unie risque fort de s'évanouir."
 Libya_1949:0 "Émirat Cirenaïque"
 Bahrein_1949_desc:0 "Le royaume de Bahreïn est à peine visible sur une carte, mais la découverte de pétrole en 1929 et son importance stratégique dans le golfe Persique lui ont conféré une importance capitale pour ses maîtres britanniques. Si Bahreïn aspire à l'indépendance, les revendications iraniennes, anciennes et toujours très actives, sur son territoire font de sa relation avec la Grande-Bretagne un mal nécessaire. Tant que l'Iran n'abandonnera pas ces revendications, le statu quo perdurera."
 Bahrein_1949:0 "Royaume de Bahreïn"
 Pakistan_1949_desc:0 "Lorsque la domination britannique sur l'Inde prit fin en 1947, l'ancien Raj fut divisé entre l'Inde hindoue et le Pakistan musulman. Ce conflit fit des milliers de morts et des millions de déplacés, mais finalement, les musulmans du sous-continent indien disposent désormais d'une nation. Ce nouvel État, à l'instar de son rival indien, souffre de la pauvreté, des divisions et d'un avenir incertain, dans un monde en proie à la fracture sociale."
 Pakistan_1949:0 "État du Pakistan"
 Jordan_1949_desc:0 "La Jordanie est sortie affaiblie, mais non vaincue, de la guerre israélo-arabe de 1948. Le Royaume hachémite de Jordanie est aujourd'hui un État indépendant, résolu à préserver sa liberté nouvellement acquise. La question de la stratégie à adopter vis-à-vis d'Israël demeure. Le roi Abdallah est ouvert à des négociations de paix formelles, tandis qu'une grande partie de la population, et notamment les Palestiniens de Cisjordanie sous administration jordanienne, refuse tout compromis."
 Jordan_1949:0 "Le Royaume hachémite de Jordanie"
 Iceland_1949:0 "Islande"
 Iceland_1949_desc:0 "L'Islande entra en guerre en tant que partie intégrante du Royaume du Danemark et en sortit en tant que république indépendante. Bien que cette petite nation insulaire espérât un retour à la neutralité pacifiste après la fin du conflit et l'occupation alliée, la signature du Traité de l'Atlantique Nord par le gouvernement de coalition tripartite l'impliqua dans un conflit mondial naissant. Face à une économie stagnante, une population inquiète et la nécessité de se protéger dans un monde de plus en plus polarisé, l'Islande doit choisir avec soin son camp, sous peine de perdre son indépendance chèrement acquise."
 Sarawak_1949:0 "Colonie de la Couronne de Sarawak"
 Sarawak_1949_desc:0 "Autrefois paisible sous la dynastie Brooke, le Sarawak devint une colonie de la Couronne après la Seconde Guerre mondiale, marquée par une occupation japonaise dévastatrice. La guerre détruisit les infrastructures fragiles du Sarawak, et les années d'après-guerre furent marquées par des changements radicaux sous l'administration britannique, visant à moderniser et stabiliser la région. Cependant, l'héritage du colonialisme et la montée des sentiments anti-impérialistes ont suscité un mécontentement croissant au sein de sa population diverse, composée de Malais, de Dayaks, de Chinois et d'autres ethnies. Alors que le Sarawak entre dans une nouvelle ère, des questions se posent quant à son avenir. La colonie restera-t-elle fidèle à la Couronne, ou les mouvements nationalistes la pousseront-ils vers l'indépendance et l'autodétermination ?"
 Brunei_1949:0 "L'État de Brunei"
 Brunei_1949_desc:0 "Petit sultanat riche en pétrole, le Brunei a longtemps su concilier tradition et modernité sous la protection des autorités coloniales britanniques. Durant la Seconde Guerre mondiale, l'occupation japonaise a perturbé sa paix relative, laissant des cicatrices qui ont persisté même après le rétablissement du pouvoir britannique. Aujourd'hui, le Brunei jouit d'une stabilité économique grâce à ses vastes réserves de pétrole ; mais le sultanat est confronté à des pressions internes et régionales croissantes. Pris entre la préservation de sa monarchie, la modernisation et la nécessité de répondre aux appels grandissants à la réforme politique, le Brunei doit choisir : s'accrocher à la tradition ou s'adapter aux changements qui bouleversent l'Asie du Sud-Est ?"
 Paraguay_1949:0 "République du Paraguay"
 Paraguay_1949_desc:0 "Le Paraguay entre dans la guerre froide, meurtri par des décennies de troubles. La seconde guerre civile paraguayenne, la terrible guerre du Chaco et les sympathies pro-nazies de l'ancien président Higinio Morínigo ont profondément fracturé le pays. La chute de Morínigo a conduit à la brève présidence de Juan Natalicio González, rapidement renversé, inaugurant une période d'instabilité où les présidents se succèdent à un rythme effréné. Aujourd'hui, Felipe Molas López est au pouvoir, mais rares sont ceux qui croient à sa longévité. La question demeure : le Paraguay se stabilisera-t-il sous la démocratie, sombrera-t-il dans la dictature ou sombrera-t-il dans des ténèbres encore plus profondes ?"