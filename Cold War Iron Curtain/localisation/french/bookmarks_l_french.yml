 CWIC_BOOKMARK_1980_SAF_desc: "$SAF_BOOKMARK_1980_DESC$"
 USA_BOOKMARK_1980_DESC: "Les États-Unis sont entrés dans la guerre froide en 1949, confiants dans leur puissance économique et militaire inégalée. La Corée, le Vietnam, la lutte pour les droits civiques, le Watergate et les chocs pétroliers ont depuis mis cette confiance à l'épreuve. Le président Jimmy Carter est désormais confronté à une stagflation, à des Américains retenus en otage en Iran, à une nouvelle confrontation après l'invasion soviétique de l'Afghanistan et à des élections qui pourraient redéfinir le cap du pays."
 SOV_BOOKMARK_1980_DESC: "L'empire d'après-guerre de Staline a survécu à la succession, à la déstalinisation et à la scission sino-soviétique pour atteindre une parité stratégique approximative avec les États-Unis. Sous Léonid Brejnev, cependant, la portée militaire cache une stagnation économique et des tensions croissantes au sein du bloc socialiste. L'intervention en Afghanistan a mis fin à la promesse de détente et ouvert un nouveau front coûteux."
 PRC_BOOKMARK_1980_DESC: "En 1949, les forces de Mao Zedong étaient sur le point de remporter la victoire dans la guerre civile chinoise. Trois décennies de transformation révolutionnaire, le Grand Bond en avant, la Révolution culturelle et la rupture avec Moscou ont refait la Chine à un coût immense. Mao est mort, Deng Xiaoping ouvre l'économie, les relations avec Washington sont normalisées et la récente guerre avec le Vietnam a révélé les risques de la nouvelle orientation de la Chine."
 ENG_BOOKMARK_1980_DESC: "La victoire britannique lors de la Seconde Guerre mondiale a été suivie par la décolonisation, l'humiliation de Suez et des crises économiques répétées. L'empire a largement reculé, mais le Royaume-Uni reste une puissance nucléaire et un membre central de l'OTAN. Margaret Thatcher entre dans la nouvelle décennie en promettant une rupture nette avec le consensus d'après-guerre sur fond d'inflation, de chômage et de conflit industriel."
 FRA_BOOKMARK_1980_DESC: "L'instable Quatrième République de 1949 a cédé la place à la Cinquième République de Charles de Gaulle au milieu de la crise algérienne. La France s'est débarrassée de la majeure partie de son empire tout en préservant une force nucléaire indépendante, un rôle diplomatique mondial et une voix distincte au sein de l'alliance occidentale. Le président Valéry Giscard d'Estaing est désormais confronté au ralentissement économique et à la résurgence de la gauche dans son pays."
 WGR_BOOKMARK_1980_DESC: "L'État occidental provisoire formé en 1949 est devenu une démocratie prospère, membre de l'OTAN et le point d'ancrage économique de l'Europe occidentale. Le mur de Berlin a rendu la division tangible, tandis que l'Ostpolitik a accepté un engagement pratique avec l'Est sans abandonner la réunification. Le chancelier Helmut Schmidt doit équilibrer la solidarité de l'alliance, la détente, l'insécurité énergétique et la peur intérieure d'une nouvelle confrontation entre superpuissances."
 DDR_BOOKMARK_1980_DESC: "Le régime d'occupation soviétique s'est durci en République démocratique allemande peu après le début de 1949. Le soulèvement de 1953, l'émigration massive et la construction du mur de Berlin ont consolidé un État soutenu par le Parti socialiste unifié et la Stasi. Le gouvernement d'Erich Honecker offre au monde stabilité et protection sociale tandis que la dette, la surveillance et la question allemande non résolue s'accumulent sous la surface."
 POL_BOOKMARK_1980_DESC: "L'ordre stalinien polonais a survécu aux bouleversements de 1956 et de 1970, mais il n'a jamais obtenu le consentement promis par la république populaire. La dette extérieure, les pénuries et l'échec des réformes économiques poussent à nouveau les travailleurs et les intellectuels vers une résistance organisée. La prochaine confrontation entre le parti et les chantiers navals pourrait mettre à l'épreuve Varsovie et Moscou."
 VIN_BOOKMARK_1980_DESC: "Le Vietnam divisé en 1949 a enduré trois décennies de guerre avant que Hanoï n'unifie le pays sous le régime communiste. La paix n'a pas permis de s'isoler du conflit : les forces vietnamiennes ont renversé les Khmers rouges au Cambodge, tandis que la Chine a répondu par une invasion punitive en 1979. La reconstruction, l'occupation et la rivalité au sein du monde socialiste définissent désormais l'avenir de la nouvelle république."
 KOR_BOOKMARK_1980_DESC: "La fragile république de 1949 a survécu à l'invasion et aux ravages de la guerre de Corée, puis s'est industrialisée sous un régime de plus en plus autoritaire. L'assassinat du président Park Chung Hee en octobre 1979 a ouvert une transition brève et incertaine. Une nouvelle faction militaire consolide le pouvoir tandis que l'opposition démocratique, les ambitions économiques et la menace permanente du Nord tirent le pays dans des directions différentes."
 KPA_BOOKMARK_1980_DESC: "La Corée du Nord n'a pas réussi à réunifier la péninsule par la force, mais l'armistice n'a jamais apporté la paix. Kim Il Sung a construit un État hautement militarisé autour du Juche, d'un gouvernement personnel et de manoeuvres prudentes entre Moscou et Pékin. La concurrence économique avec le Sud se retourne contre Pyongyang, rendant le contrôle, la succession et l'influence militaire de plus en plus essentiels à la survie du régime."
 AFG_BOOKMARK_1980_DESC: "La monarchie neutre de 1949 a été renversée d'abord par un coup d'État républicain, puis par la révolution communiste Saur. Les purges factionnelles et la révolte rurale ont brisé le nouveau régime, incitant les forces soviétiques à entrer en Afghanistan en décembre 1979 et à installer Babrak Karmal. Moscou espère une stabilisation ; la résistance se prépare à une longue guerre."
 PER_BOOKMARK_1980_DESC: "L'Iran est passé de la lutte constitutionnelle et du coup d'État de 1953 à la modernisation rapide et inégale du Shah et à une alliance étroite avec l'Occident. La révolution de 1979 a balayé la monarchie et établi une République islamique sous l'ayatollah Khomeini. Avec des otages américains détenus à Téhéran, des forces armées désorganisées et des rivaux contestant le sens de la révolution, l'Iran se trouve au centre d'une rupture régionale."
 IRQ_BOOKMARK_1980_DESC: "Le royaume hachémite de 1949 est tombé sous la révolution militaire, suivie de coups d'État et de la montée du parti Baas. Saddam Hussein contrôle désormais un État centralisé, financé par le pétrole, dont les ambitions dépassent largement les frontières irakiennes. Les troubles révolutionnaires en Iran voisin offrent une opportunité, mais toute tentative de l'exploiter pourrait déclencher une guerre bien plus vaste."
 ISR_BOOKMARK_1980_DESC: "Le nouvel État assiégé de 1949 a survécu à des guerres répétées, étendu son contrôle au-delà des lignes d'armistice et est devenu une puissance militaire régionale majeure. Le gouvernement de Menachem Begin a conclu une paix historique avec l'Égypte grâce au processus de Camp David, alors même que l'occupation, la colonisation, la résistance palestinienne et la confrontation sur d'autres fronts laissent le conflit plus large sans solution."
 EGY_BOOKMARK_1980_DESC: "La monarchie égyptienne tomba en 1952 et Gamal Abdel Nasser fit de la république le porte-drapeau du nationalisme arabe à travers Suez, l'union et la guerre. Après les revers de 1967 et la guerre de 1973, Anouar Sadate s'est détourné de Moscou et s'est tourné vers Washington. Le traité de paix avec Israël a en principe récupéré le Sinaï mais a isolé l'Égypte d'une grande partie du monde arabe."
 JAP_BOOKMARK_1980_DESC: "Le Japon occupé et dévasté de 1949 a retrouvé sa souveraineté grâce à une constitution pacifiste et est devenu un allié clé des États-Unis. La croissance industrielle rapide l'a transformé en l'une des plus grandes économies du monde, sous une direction conservatrice de longue date. La dépendance énergétique, les frictions commerciales et les limites non résolues du rôle sécuritaire du Japon accompagnent désormais cette prospérité."
 ITA_BOOKMARK_1980_DESC: "La jeune république de 1949 s'est ancrée dans l'OTAN et l'intégration européenne tandis que la démocratie chrétienne dominait le gouvernement de coalition. Le miracle économique a cédé la place à l'inflation, à la fragmentation politique et à la violence des Années de Plomb. L'Italie entame la décennie en tant que démocratie occidentale essentielle dont les institutions sont soumises à la pression constante de l'extrémisme et de la méfiance."
 RAJ_BOOKMARK_1980_DESC: "Le dominion récemment divisé en 1949 est devenu une république non alignée, a mené des guerres avec le Pakistan et la Chine et est devenu une puissance nucléaire régionale. L'état d'urgence a porté atteinte au pacte démocratique indien et la coalition qui a remplacé Indira Gandhi s'est effondrée. De nouvelles élections sont dans quelques jours, et Gandhi est sur le point de revenir au pays dans un contexte de pauvreté persistante, de séparatisme et de concurrence entre les grandes puissances."
 CUB_BOOKMARK_1980_DESC: "La république instable alignée sur les Américains de 1949 a été transformée par la révolution de Fidel Castro une décennie plus tard. La Baie des Cochons, la crise des missiles et l'alliance avec Moscou ont placé Cuba au centre de la guerre froide mondiale. La Havane envoie désormais des soldats et des conseillers à l'étranger tandis que la dépendance économique à l'égard du bloc soviétique et la pression des États-Unis réduisent sa marge de manoeuvre."
 YUG_BOOKMARK_1980_DESC: "La rupture de Tito avec Staline a permis à la Yougoslavie de construire un système socialiste indépendant et de diriger le Mouvement des non-alignés entre les blocs des superpuissances. Le fédéralisme et l'autogestion ont maintenu la cohésion des républiques, mais la dette extérieure, le développement inégal et les griefs nationaux se sont approfondis. Tito étant gravement malade, les institutions créées pour lui succéder sont sur le point de faire face à une épreuve décisive."
 SAF_BOOKMARK_1980_DESC: "L'Afrique du Sud a quitté le Commonwealth et a consolidé l'apartheid tandis que la décolonisation a transformé le reste du continent. L'État reste une formidable puissance militaire régionale, menant une guerre frontalière et soutenant les forces amies au-delà de ses frontières. La résistance interne, l'isolement international et la réalité démographique rendent le maintien d'un régime indéfini de la minorité blanche de plus en plus coûteux."
 OTHER_BOOKMARK_1980_DESC: "Le monde de 1980 n'est pas simplement celui de 1949, avec des dirigeants plus âgés. Des empires se sont dissous, des dizaines d'États indépendants sont apparus, des mouvements révolutionnaires sont devenus des gouvernements et les puissances régionales poursuivent désormais leurs propres programmes. Chaque pays entre dans la fin de la Guerre froide avec trois décennies de victoires, de défaites, d'alliances et de crises inachevées."
 GATHERING_STORM_NAME: "Le rideau de fer"
 GATHERING_STORM_DESC: "L'optimisme d'après-guerre quant à la coopération et à la paix mondiales, incarné par la création des Nations Unies, s'est rapidement évaporé. Au cours de la dernière guerre, les empires européens ont épuisé non seulement leur sang et leurs trésors, mais aussi ceux de leurs territoires coloniaux. Aujourd'hui, les peuples colonisés d'Afrique et d'Asie réclament leur indépendance. À l'échelle mondiale, les États-Unis et l'Union soviétique surpassent désormais largement toute autre puissance. Les débuts d'une rivalité idéologique entre les deux États voient rapidement leur amitié de guerre se refroidir. Des lignes sont déjà tracées à travers l'Europe alors qu'une partition idéologique sépare de plus en plus les régimes capitalistes et communistes."
 UK_1949_desc: "La Grande-Bretagne s'est battue pour sa survie contre Hitler et en est sortie victorieuse. Mais cette victoire a eu un prix. La moitié de l'Europe sous le rideau de fer, la nation marquée par la guerre et l'Empire sur le point de disparaître dans l'histoire. Il semble que pour la Grande-Bretagne, la paix sera un combat aussi dur que la guerre. Les souvenirs du Blitz s'effacent alors que la peur du communisme s'empare du coeur du Commonwealth britannique."
 UK_1949: "Royaume-Uni de Grande-Bretagne et d'Irlande du Nord"
 Canada_1949_desc: "Le Canada a quitté la Grande Guerre en tant que nation et a quitté la dernière guerre en tant que puissance à part entière. De plus en plus indépendant de Londres, le Canada est devenu une nation prospère dotée d'une économie forte et d'une armée moderne. Pour la première fois de son histoire, le Canada a la chance d'écrire son propre destin. Le Vrai Nord restera-t-il fort et libre ?"
 Canada_1949: "Canada"
 South_Korea_1949_desc: "Enfin libre de l'occupation américaine et japonaise, la République de Corée nouvellement créée espérait une réunification pacifique avec ses compatriotes séparés au-dessus du 38e parallèle. Mais après l'assassinat suspect du seul homme politique de haut rang disposé à négocier avec le Nord et la victoire du fervent anticommuniste Syngman Rhee à la présidence, les rêves de paix ont été brisés et le sort de la péninsule sera coulé dans le sang."
 South_Korea_1949: "Daehanminguk"
 WGR_1949_desc: "L'Allemagne a commencé la Seconde Guerre mondiale sous les mauvaises ambitions d'Adolf Hitler, mais l'a terminée en tant que nation conquise. L'occupation de l'Allemagne d'après-guerre touche à sa fin ; une division permanente entre un Ouest aligné sur l'Occident et un Est communiste est inévitable. La nouvelle République fédérale d'Allemagne se trouve en effet dans une position peu enviable."
 WGR_1949: "République fédérale d'Allemagne"
 DDR_1949_bookmark_desc: "Sous le gouvernement militaire soviétique, le peuple de l'Allemagne de l'Est se retrouve sous le règne du peuple même qu'il a opprimé. L'occupation a été dure et le moral est bas, mais il y a une lueur d'espoir alors que l'occupation militaire entame sa transition vers la République démocratique allemande planifiée. Enfin, la maison de Marx aura un gouvernement digne du lieu de naissance du communisme."
 DDR_1949_bookmark: "Sovyetskaya Voyennaya Administratsiya contre Germanii"
 North_Korea_1949_desc: "Peu de temps après la déclaration de la République de Corée, l'Union soviétique a établi la République populaire démocratique de Corée de son côté du 38e parallèle. Sous la direction de l'ancien résistant Kim Il-Sung, la RPDC semble prête à payer le prix du fer pour résoudre la question de l'unification. La guerre approche et la révolution coréenne est confrontée à son plus grand défi à ce jour."
 North_Korea_1949: "Choson Minjujuui Inmin Konghwaguk"
 PRC_1949_desc: "Les Japonais ont été vaincus et le cessez-le-feu avec le Kuomintang rompu. L'Armée populaire de libération a connu une croissance exponentielle et, grâce à l'équipement laissé par les Japonais, les communistes chinois sont prêts à assurer la sécurité du reste de la Chine. Malgré une aide minimale de l'Union soviétique, le leadership de Mao Zedong après la Grande Marche a permis à la révolution de prospérer. Encore quelques villes clés et la Chine sera enfin unie !"
 PRC_1949: "Zhongguó Gòngchandang"
 USSR_1949_desc: "Le peuple soviétique a tout sacrifié pendant la Grande Guerre patriotique, mais le sang en a valu la peine. Hitler a été vaincu, l'Union sauvée et, sous la main inébranlable de Joseph Staline, l'Union soviétique est devenue une superpuissance rivalisant avec les États-Unis. La guerre contre le fascisme est terminée, mais la longue lutte contre l'impérialisme ne fait que commencer. Le communisme prévaudra-t-il ou la révolution périra-t-elle pour toujours ?"
 USSR_1949: "Soyouz Sovyetskikh Sotsialisticheskikh Respublik"
 Poland_1949_desc: "Au lendemain de la Seconde Guerre mondiale, la Pologne est tombée sous l'emprise soviétique. Boleslaw Bierut, considéré comme un proche allié et étudiant idéologique de Staline, est le leader incontesté de la Pologne. L'État polonais a un long chemin devant lui, mais s'il parvient à éviter la colère de son peuple et à renforcer sa foi dans le socialisme, peut-être les horreurs de la Seconde Guerre mondiale pourront-elles appartenir au passé."
 Poland_1949: "Rzeczpospolita Polska"
 Czechoslovakia_1949_desc: "Laissé sous tutelle soviétique au lendemain de la guerre, le Parti communiste tchécoslovaque a affirmé son contrôle total sur le pays en 1948 lors d'un coup d'État soutenu par les Soviétiques. Bien qu'elle soit résolument un État à parti unique sous régime communiste, la Tchécoslovaquie fait face à une pression croissante de la part de Moscou pour purger les éléments perçus comme déloyaux. Des sacrifices devront être consentis pour la révolution dans les années à venir."
 Czechoslovakia_1949: "République de Ceskoslovenská"
 Bulgaria_1949_desc: "La Bulgarie s'est battue pour l'Axe pendant la Seconde Guerre mondiale, mais lorsque le vent s'est retourné contre Hitler, le Front de la Patrie dirigé par les communistes a renversé le gouvernement profasciste et a signé la paix avec l'URSS. En 1946, la monarchie a été abolie et depuis lors, ancien chef du Komintern et ami proche de Staline, Georgi Dimitrov dirige la Bulgarie socialiste. Il semble que pour l'instant Sofia et Moscou soient inséparables."
 Bulgaria_1949: "Narodna Republika Bulgariya"
 Romania_1949_desc: "La Roumanie a combattu aux côtés d'Hitler dans l'opération Barbarossa, au cours de laquelle, peut-être prophétiquement, l'armée roumaine a été détruite à Stalingrad. L'homonyme de la ville a imposé le régime communiste en Roumanie peu de temps après, la monarchie étant abolie au profit d'une république ouvrière de style soviétique. Le Parti est désormais confronté à une scission entre la « faction des prisons » soutenue par les Soviétiques et la « faction de Moscou » plus modérée dirigée par Ana Pauker."
 Romania_1949: "République populaire romaine"
 Albania_1949_desc: "Le 29 novembre 1944, le Front de libération albanais dirigé par Enver Hoxha libéra toute l'Albanie de l'occupation de l'Axe. La faible monarchie fut laissée dans la poussière et la République populaire d'Albanie fut déclarée. Enver Hoxha est un fidèle allié de Staline et de Mao, et fidèle à la révolution jusqu'à l'excès. Si les choses changeaient à Moscou ou à Pékin, Tirana ne serait peut-être pas disposée à suivre."
 Albania_1949: "République populaire et Shqipërisë"
 Communist_Greece_desc: "Au cours des trois dernières années, les Grecs ont combattu contre la Grèce dans une terrible guerre civile à la demande des impérialistes occidentaux. Le peuple grec a le droit de décider de son propre destin, et pour le Parti communiste grec, le socialisme est ce destin. Pour l'instant, l'élan est entre les mains du roi fantoche de l'Occident, mais la révolution pourra-t-elle finalement l'emporter ?"
 Communist_Greece: "Dimokratikos Stratos Elládas"
 Hungary_1949_desc: "Quelques années après la fin de la Grande Guerre, la Hongrie fut l'un des premiers États communistes au monde. Incapable de se lier avec ses alliés bolcheviques, la révolution hongroise s'est éteinte. Vingt-cinq ans plus tard, la révolution revient triomphalement sous les bannières de l'armée soviétique, plaçant Budapest fermement dans la sphère soviétique. La ligne de Moscou tiendra-t-elle ou le changement est-il inévitable ?"
 Hungary_1949: "Magyar Népköztársaság"
 USA_1949_desc: "La victoire de l'Amérique lors de la Seconde Guerre mondiale a consolidé son statut de superpuissance. Plutôt que de revenir à l'isolationnisme, les États-Unis se sont mobilisés contre l'Union soviétique pour défendre la cause de la liberté dans le monde entier et les sentiments anticommunistes sévissent dans tout le pays. Mais maintenant que les armes nucléaires sont sur la table pour les deux camps, les États-Unis pourraient-ils vraiment survivre face à un ennemi aussi redoutable ?"
 USA_1949: "États-Unis d'Amérique"
 Israel_1949_desc: "Le peuple juif a été presque anéanti par les légions hitlériennes, et pourtant, avec l'indépendance retrouvée d'Israël, il triomphe. Pour la première fois depuis deux mille ans, la Terre Sainte appartient aux Hébreux. Pourtant, tout ne va pas pour le mieux pour la nouvelle nation. Sa liberté a été conquise grâce à la guerre avec tous ses voisins, et de nombreuses questions politiques doivent trouver une réponse avant que les États arabes ne reviennent pour se venger."
 Israel_1949: "Medinat Yisraʾel"
 Yugoslavia_1949_desc: "La Yougoslavie s'est libérée de l'occupation nazie sous la direction du maréchal Tito et a depuis lors maintenu une farouche indépendance vis-à-vis de l'Est et de l'Ouest. Jusqu'à présent, le « socialisme de marché » et l'« autogestion » de Tito ont conduit à une reprise économique, mais la voie à suivre pour la Yougoslavie n'est en aucun cas claire. Staline a toujours l'ambition de ramener Belgrade dans le giron, et les divisions internes pourraient s'avérer dangereuses à l'avenir. La Yougoslavie peut-elle survivre ?"
 Yugoslavia_1949: "Federativna Narodna Republika Jugoslavija"
 Mongolia_1949_desc: "Sous la main ferme de Khorloogiin Choibalsan, la Mongolie est sur la voie de la modernisation. Grâce à ses relations étroites avec l'Union soviétique, la Mongolie s'est engagée dans son propre programme d'industrialisation alors que la nation sortait de son isolement médiéval. Ayant récemment réalisé son rêve de reconnaissance internationale, Choibalsan semble prêt à régner sur les steppes pendant de nombreuses années encore."
 Mongolia_1949: "Bügd Nairamdakh Mongol Ard Uls"
 East_Turkestan_1949_desc: "La République du Turkestan oriental est une énigme. Formellement reconnue par le monde comme faisant partie de la Chine, la guerre civile a laissé un vide de pouvoir et les Ouïghours locaux ont pris le pouvoir sous la direction soviétique. Avec la victoire probable des communistes de Mao, Moscou se tiendra-t-elle aux côtés de leurs anciens alliés, ou le Turkestan oriental est-il voué à ne plus rester qu'une note de bas de page dans l'histoire ?"
 East_Turkestan_1949: "Sherqiy Türkistan Jumhuriyiti"
 Iraq_1949_desc: "Après la guerre israélo-arabe de 1948, l'Irak est en mesure de faire beaucoup au Moyen-Orient malgré sa défaite dans cette guerre, mais il est confronté à un problème avec les rebelles kurdes, inspirés récemment par la révolte de Mustafa Barzani. L'Irak dépend des Britanniques qui ont accès à leur pétrole par l'intermédiaire de la Iraqi Petroleum Company en échange de leur aide. Au tribunal hachémite, il existe un grand conflit entre les nouveaux officiers militaires « libres » et les monarchistes conservateurs qui doit être résolu."
 Iraq_1949: "al-Mamlakah al-ʿIraqiyyah ʾal-Hashimyyah"
 Egypt_1949_desc: "Le Royaume d'Égypte a officiellement obtenu son indépendance de la Grande-Bretagne en 1922, mais peu d'Égyptiens y croient réellement. La Grande-Bretagne conserve son emprise sur le canal de Suez et domine le Soudan anglo-égyptien, tandis qu'une petite aristocratie détient presque toute la richesse et le pouvoir du pays. Bien que le roi Farouk ait son lot de partisans, de nombreuses personnalités puissantes le considèrent comme un playboy effacé qui mène la nation à la ruine. Un seul camp l'emportera."
 Egypt_1949: "Al-Mamlaka Al-Misreyya"
 Syria_1949_desc: "Le chemin de la République syrienne vers l'indépendance a été semé d'embûches et il en va de même aujourd'hui. Parallèlement à l'incapacité à contrecarrer la formation d'Israël, le gouvernement de Shukri al-Quwatli a été renversé lors d'un coup d'État militaire soutenu par les États-Unis. Bien que le général Husni al-Zaim occupe confortablement le trône, d'autres généraux attendent leur tour pour usurper le leadership. Lorsque la Syrie parvient à briser les chaînes des dictatures, peut-elle atteindre la grandeur ?"
 Syria_1949: "al-Jumhuriyyah as-Suriyyah"
 Japan_1949_desc: "Les ambitions impériales du Japon ont pris fin avec les bombardements atomiques d'Hiroshima et de Nagasaki. Désormais sous occupation américaine, l'ancien Empire du Japon est confronté à un avenir incertain et à un long chemin vers la reconstruction. Sous l'oeil vigilant de Douglas MacArthur, le « Gaijin Shogun », le gouvernement constitutionnel est de retour au Japon. Reste à savoir si cela restera ainsi."
 Japan_1949: "senryo-ka no Nihon"
 Philippines_1949_desc: "Les Philippines ont obtenu leur indépendance des États-Unis il y a seulement quelques années et maintiennent une alliance étroite avec leur ancien suzerain face à la menace communiste croissante dans leur pays et à l'étranger. La jeune nation est instable, avec des guérillas communistes et des intrigues politiques qui menacent de mettre le feu aux îles. Les Philippines sont à la croisée des chemins et les années à venir décideront de leur avenir pour les décennies à venir."
 Philippines_1949: "République des Philippines"
 Hukbalahap_1949_desc: "Le mouvement Hukbalahap a été fondé en 1942 en tant que branche militaire du Parti communiste des Philippines pour mener une résistance armée contre les envahisseurs japonais et le gouvernement collaborationniste. Fort de plus de vingt mille membres à la fin de la guerre, le gouvernement colonial américain rétabli a néanmoins refusé d'accorder aux unités Huk le statut officiel de guérilla et d'accorder des avantages aux anciens combattants. Les choses ne se sont détériorées qu'avec le temps, à mesure que la corruption et l'injustice d'avant-guerre réapparaissaient à l'encontre de la population rurale. Finalement, avec le refus de permettre aux députés communistes élus de siéger et les assassinats d'éminents dirigeants du mouvement syndical, les Huks sont de nouveau retournés dans les montagnes ; cette fois, il envisage de libérer le pays du système corrompu qui l'a asservi."
 Hukbalahap_1949: "Hukbong Bayan Laban à Hapon"
 Thailand_1949_desc: "La Thaïlande est sortie presque indemne de la Seconde Guerre mondiale. Malgré le soutien thaïlandais au Japon, l'Amérique a reconnu après la guerre le régime du maréchal Plaek Phibunsongkhram en raison de son farouche anticommunisme, à condition que des élections libres soient organisées, que Phibun a remportées haut la main. La Thaïlande semble prête à poursuivre son occidentalisation rapide sous la direction du maréchal, mais la menace des rouges et des réactionnaires demeure."
 Thailand_1949: "Ratcha-anachak thaï"
 Cuba_1949_desc: "Sous le président Ramón Grau, Cuba a aboli l'Amendement Platt en 1934 et, pour la première fois de son histoire, Cuba s'est présentée comme un État véritablement indépendant. Depuis lors, Cuba a maintenu des liens étroits avec les États-Unis et les investissements américains ont afflué vers ses ports, même si les hommes d'affaires étrangers et les élites locales obtiennent l'essentiel des bénéfices. Sur le front intérieur, la démocratie cubaine reste en effet fragile."
 Cuba_1949: "République de Cuba"
 Dominicana_1949_desc: "La République dominicaine est sous la poigne de fer du généralissime Rafael Trujillo depuis 1930. Le peuple s'irrite sous sa tyrannie, mais tous ceux qui ont tenté de s'opposer à lui ont connu des morts terribles aux mains de la police secrète, commandée par son lieutenant obstinément loyal, Johnny Abbes García. Il semble que pour l'instant, il n'y ait aucun espoir pour le peuple dominicain. Mais pendant combien de temps peut-on maintenir un peuple à terre ?"
 Dominicana_1949: "République Dominicaine"
 Belgium_1949_desc: "Après avoir été envahie, occupée et libérée pour la deuxième fois au XXe siècle, la Belgique traverse une période particulièrement difficile après la Seconde Guerre mondiale. Son industrie et son économie sont en ruine, son armée est extrêmement réduite et ses affaires coloniales sont stables mais, au mieux, fragiles. Politiquement parlant, la Belgique est une démocratie, mais le roi détient un grand pouvoir dans l'esprit du peuple, ainsi que les grondements des communistes belges."
 Belgium_1949: "Koninkrijk Belgique"
 India_1949_desc: "Après des siècles d'oppression étrangère, le Dominion de l'Inde nouvellement proclamé a enfin gagné sa liberté vis-à-vis de la Grande-Bretagne. Le peuple célèbre sa liberté retrouvée alors que l'Inde se prépare à rompre ses derniers liens avec Londres, mais les défis ne font que commencer pour le nouvel État. La partition a causé la mort et le déplacement de millions de personnes, la pauvreté est endémique et l'Inde est confrontée à un nouveau conflit avec ses voisins musulmans du Pakistan à propos du Cachemire."
 India_1949: "Bharat Ganarajya"
 Uganda_1949_desc: "L'Ouganda maintient une administration plus libérale que les autres colonies britanniques, permettant aux royaumes traditionnels de maintenir leurs mandats sur les tribus. Cependant, l'économie reste fermement entre les mains des colons blancs et asiatiques, qui ont exclu les Africains autochtones des industries rentables du coton. Cette politique, entre autres, a provoqué des troubles chez le peuple Baganda. Peut-être que l'indépendance de l'Ouganda est inévitable ?"
 Uganda_1949: "Protectorat de l'Ouganda"
 South_Vietnam_1949_desc: "Guidé par les Français, l'État du Vietnam s'oppose au Viet Minh communiste. Malgré ses efforts pour moderniser la nation, le quoc-truong, Bao-Dai est profondément impopulaire et considéré comme une marionnette corrompue de Paris. Le changement arrive au Vietnam. Sera-ce sous le Viet Minh, ou l'État du Vietnam connaîtra-t-il sa propre révolution ?"
 South_Vietnam_1949: "Quoc-gia Viet-Nam"
 Nigeria_1949_desc: "Le Nigeria est une bizarrerie parmi les colonies britanniques. Alors que la majeure partie de l'Afrique de l'Ouest reste fermement aux mains des administrateurs britanniques, le Nigeria reste divisé entre de nombreuses tribus et une division générale entre un nord musulman et un sud chrétien, ce qui nécessite une approche plus non interventionniste. Alors que les tensions montent entre les nombreuses tribus et les seigneurs féodaux, des décisions difficiles doivent être prises pour le bien de l'avenir de la colonie."
 Nigeria_1949: "Colonie et protectorat du Nigéria"
 OTHER_DESC: "Les nations du monde, grandes et petites, ne se contentent pas toutes de retenir leur souffle en attendant le déclenchement d'un autre conflit mondial. Des grandes puissances au bord d'une guerre civile aux nombreuses nations formées et transformées par la Seconde Guerre mondiale, tous devront prendre des décisions difficiles et équilibrer idéaux et pragmatisme pour avoir un impact sur l'avenir du monde."
 Kenya_1949_desc: "La colonie et protectorat du Kenya n'est pour le moins pas une colonie modèle. Alors que la plupart des habitants du Royaume-Uni continental ne pensent presque jamais à cette nation de leur empire avec ses 6 millions d'habitants vivant dans un ensemble de quatre grandes villes et pour la plupart de petites villes, la majorité africaine du Kenya pense régulièrement à son statut de sujet britannique. Établi au point culminant de la ruée vers l'Afrique, le Kenya, en tant que colonie, est principalement peuplé de l'ethnie Kikuyu, avec un niveau notable d'entreprises et d'installations britanniques locales. Comme dans toute colonie africaine, il existe au Kenya une petite minorité de jeunes étudiants et d'intelligentsia anticoloniaux et panafricanistes, principalement organisée autour du militant Jomo Kenyatta. Cependant, la population rurale du pays, en grande partie analphabète, constitue la véritable menace à la stabilité coloniale du Kenya, alors que des prophètes et des mystiques itinérants forment des milices dans les campagnes des hauts plateaux du centre."
 Kenya_1949: "Colonie et Protectorat du Kenya"
 Ethiopia_1949_desc: "Mère Éthiopie, l'Empire éthiopien est une nation multiethnique et religieusement diversifiée qui compte environ 18 millions d'habitants. L'Éthiopie est en proie à la sécheresse et à la famine, la plupart de ses citoyens étant des serfs illettrés qui ne parlent que leur langue régionale. Si la couronne souhaite moderniser son pays comme elle l'entend, elle devra s'attaquer à ces problèmes majeurs. Alors que la reconstruction de l'Éthiopie après la Seconde Guerre italo-éthiopienne touche à sa fin, l'Empire éthiopien semble être au sommet de sa stabilité. En tant que seule nation africaine indépendante pertinente, l'Éthiopie dispose de nombreuses opportunités en cette période sans conflit interne. Avec la politique étrangère internationaliste de Hailé Sélassié, l'Éthiopie se retrouvera probablement à s'ouvrir encore plus loin sur le monde dans cette nouvelle ère définie par la rivalité des superpuissances."
 Ethiopia_1949: "Yäʾityppoya Nägusä Nägäst Mängəst"
 SAF_1949_desc: "L'Afrique du Sud est sortie de la victoire alliée avec son prestige et son honneur national renforcés car elle s'est battue sans relâche pour les Alliés occidentaux. La position de l'Afrique du Sud au sein de la communauté internationale s'améliorait, à une époque où la lutte du tiers monde contre le colonialisme n'occupait toujours pas le devant de la scène. Tout comme il l'avait fait en 1919, Smuts exhorta les délégués à créer un organisme international puissant pour préserver la paix ; il était déterminé à ce que, contrairement à la Société des Nations, les Nations Unies aient du pouvoir. Cependant, les luttes politiques internes au sein de la communauté afrikaner mécontente et essentiellement appauvrie allaient bientôt surgir, conduisant à la défaite de Smuts aux élections de 1948 face à un Parti national renaissant après la guerre. Aujourd'hui, le Parti national est en passe de construire une ségrégation institutionnalisée dans le pays avec son système d'apartheid."
 SAF_1949: "Union du Sud-Afrique"
 Portugal_1949_desc: "Après être resté neutre pendant la dévastatrice Seconde Guerre mondiale, le Portugal a décidé d'adopter une position pro-occidentale majeure en devenant l'un des membres fondateurs de l'Organisation du Traité de l'Atlantique Nord. Face à l'ampleur des mouvements communistes, le Portugal doit soit riposter, soit risquer d'être la prochaine victime du communisme. \n\nLa dictature de l'Estado Novo existe toujours et tente de maintenir son empire colonial. Cependant, une vague déferle sur l'Afrique, appelant à la décolonisation de l'Europe. Alors que la décolonisation a déjà commencé, nombreux sont ceux qui commencent également à se tourner vers le Portugal, les incitant à emboîter le pas. Le Portugal doit soit affirmer sa présence en Afrique, soit envisager une approche différente."
 Portugal_1949: "République portugaise"
 DECADE_CRISIS_NAME: "La décennie de crise"
 DECADE_CRISIS_DESC: "Le processus de décolonisation a vu des nations accéder à la liberté de manière pacifique ou par la violence en Asie. Aujourd'hui, les peuples africains militent pour la liberté avec une plus grande ferveur alors que les puissances impériales font face à la vague croissante de décolonisation. Au Moyen-Orient, le nationalisme arabe promet d'apporter la gloire et de détruire l'ordre ancien. La rivalité entre les États-Unis et l'Union soviétique s'est transformée en une lutte acharnée pour l'influence mondiale. Certains États sont de plus en plus désenchantés par les machinations soviétiques et américaines. Ils souhaitent diriger leur propre destin et il reste à voir si ces États pourront survivre dans cet ordre mondial bipolaire."
 ETH_DECADE_CRISIS_DESC: "L'Éthiopie est confrontée à une crise de la modernité. Tentant de prouver sa pertinence, Hailé Sélassié s'est concentré sur la politique étrangère alors que le panafricanisme et la décolonisation prennent d'assaut le continent africain tout en négligeant sa situation intérieure. En dehors de la capitale impériale, l'Éthiopie est une nation coincée dans l'âge des ténèbres et tous ne sont pas satisfaits des ambitions de l'empereur alors que son peuple reste pauvre et analphabète. Le Lion de Juda doit emprunter un nouveau chemin, sinon il sera tué lors des batailles à venir."
 KEN_DECADE_CRISIS_DESC: "Même si le soulèvement Mau Mau est terminé, les troubles du Kenya ne connaissent pas de fin. Alors que beaucoup considèrent la décolonisation de l'Empire britannique comme inévitable, un groupe fort et très bruyant de colons et d'hommes d'affaires britanniques au sein de l'assemblée coloniale pense le contraire. Le peuple crie à la liberté, considérant Jomo Kenyatta, emprisonné, comme son véritable leader. La décolonisation n'est peut-être pas inévitable, mais un bilan l'est."
 OILCRISIS_NAME: "La crise pétrolière"
 OILCRISIS_DESC: "La détente a vu les relations entre les États-Unis et l'Union soviétique passer d'hostiles à au moins quelque peu compréhensives. Même si la guerre atomique est peut-être suspendue pour le moment, le monde est tout sauf stable. Le Vietnam est devenu un désastre pour l'Amérique, le Moyen-Orient semble sur le point de brûler et le mouvement des non-alignés gagne en puissance à mesure que de plus en plus de pays du monde postcolonial se lassent des jeux de l'Ouest et de l'Est. Les années 1970 seront la décennie la plus imprévisible de la guerre froide."
 USA_DECADE_CRISIS_DESC: "Les États-Unis d'Amérique ont accepté leur position de « leader du monde libre ». Après que Cuba et la Chine soient complètement tombées dans le communisme, la « stratégie d'endiguement » est entrée en vigueur. Les États-Unis feront tout ce qui est en leur pouvoir pour arrêter la propagation du communisme alors que l'Asie, l'Amérique latine et l'Afrique deviennent de nouveaux champs de bataille pour Washington et Moscou. Khrouchtchev envisage d'enterrer l'Amérique, mais il faut plus que de vaines paroles pour dissuader le peuple américain."
 SOV_DECADE_CRISIS_DESC: "L'Union des Républiques socialistes soviétiques a déstalinisé sa politique et stabilisé ses problèmes internes. Ils se concentrent désormais sur l'exploration de l'espace et sur l'expansion de leur influence en Afrique, en Asie et en Amérique latine. L'Union soviétique est en pleine expansion. La croissance économique et la domination politique de l'URSS se poursuivront-elles ou les Américains pourront-ils renverser la situation face aux Rouges ?"
 DDR_DECADE_CRISIS_DESC: "La République démocratique allemande de Walter Ulbricht a continué à suivre l'Union soviétique sur les questions politiques et économiques. La question de la Republikflucht, la défection de personnes souvent instruites vers l'Allemagne de l'Ouest, s'est révélée être un problème critique qui menace la nation d'une « fuite des cerveaux ». Des mesures drastiques doivent être prises pour préserver le système socialiste."
 PRC_DECADE_CRISIS_DESC: "La République populaire de Chine est sortie victorieuse de la guerre civile chinoise. Avec le Kuomintang banni à Taiwan, Mao a cherché à transformer la Chine en l'expérience de socialisme la plus ambitieuse à ce jour. Bien que certains succès aient été obtenus, la première décennie au pouvoir de Mao a été marquée par le désastreux Grand Bond en avant qui a tué des millions de personnes. Désormais écarté de la direction directe du PCC, le grand timonier complote pour ramener la révolution chinoise à sa vision radicale."
 CUB_DECADE_CRISIS_DESC: "La République de Cuba a embrassé la révolution sous la direction du charismatique Fidel Castro. Les troubles et l'instabilité ont conduit à l'éviction de Batista en janvier 1959 par le Mouvement du 26 juillet, qui a ensuite établi un État socialiste à parti unique. Alors que les États-Unis ont d'abord réagi favorablement à la révolution cubaine, la nationalisation des actifs américains par Castro et les exécutions politiques qui ont suivi ont très rapidement refroidi les relations. La révolution cubaine sera bientôt confrontée à son baptême du feu."
 VIE_DECADE_CRISIS_DESC: "La République du Vietnam a été proclamée le 26 octobre 1955, avec Ngo Dinh Diem comme premier président. Opposé au gouvernement de Hô Chi Minh à Hanoï, Diem s'est lancé dans un ambitieux programme de réformes destiné à transformer le Vietnam selon sa propre vision idéologiquement unique et souvent incohérente. Les tentatives ratées de réunification, la corruption et les troubles politiques et religieux ont rendu les États-Unis et l'armée vietnamienne de plus en plus méfiants à l'égard de Diem. Une autre erreur pourrait bien enflammer le Vietnam."
 FRA_DECADE_CRISIS_DESC: "La République française vient de se réformer sous Charles de Gaulle pour devenir la Cinquième République, issue de l'effondrement de la Quatrième République, remplaçant l'ancienne république parlementaire par un système semi-présidentiel. De Gaulle, qui fut le premier président français élu sous la Ve République en décembre 1958, croit en un chef d'État fort, qu'il décrit comme incarnant l'esprit de la nation. Même si le pays le soutient, la guerre d'Algérie et les tensions avec Washington doivent être réglées le plus tôt possible."
 ENG_DECADE_CRISIS_DESC: "Le Royaume-Uni a connu défaite après défaite. La crise de Suez, les tensions coloniales et le déclin général de sa pertinence face à la domination américaine sur le monde capitaliste ont amené de nombreux Britanniques à se demander si le Commonwealth peut survivre. Une chose est sûre. L'époque où Sa Majesté Royale dirigeait un empire où le soleil ne se couche jamais touche à sa fin, redéfinissant les relations de Londres avec le Commonwealth et l'OTAN."
 ZIM_DECADE_CRISIS_DESC: "Depuis 1953, la Rhodésie du Sud, la Rhodésie du Nord et le Nyassaland forment une fédération instable. Aujourd'hui, avec la nouvelle décennie, nombreux sont ceux qui se demandent si la fédération coloniale pourra tenir. L'agitation anticoloniale et la méfiance croissante à l'égard de Londres en Rhodésie du Sud pourraient valu à la fédération une tombe précoce et un avenir incertain pour ses successeurs."
 NGA_DECADE_CRISIS_DESC: "Grâce à un effort concerté des groupes politiques du pays, le Nigeria s'approche de son indépendance prévue en octobre. Les politiciens autochtones ont enfin pu former un gouvernement. Abubakar Tafawa Balewa sera le premier Premier ministre du pays, chargé de diriger une nation naissante vers un avenir incertain face aux conflits ethno-religieux et aux machinations de la guerre froide."
 1990_DESC: "La guerre froide est terminée. L'Amérique a assuré sa place de superpuissance unique alors que l'Union soviétique semble vouée à l'effondrement, ou du moins à perdre sa pertinence internationale. De nombreux pays du bloc de l'Est organisent des élections libres pour la première fois depuis des décennies, à la suite de la chute du mur de Berlin. Est-ce la fin de l'histoire ou de nouveaux conflits vont-ils enflammer à nouveau le monde ?"
 YUG_1990_DESC: "La Yougoslavie s'effondre. Depuis la mort de Tito, les tensions ethniques se sont accrues à travers le pays. Aujourd'hui, avec le début d'une nouvelle décennie, ces tensions pourraient dégénérer en violence. La Yougoslavie peut-elle être sauvée ou les Slaves du Sud sont-ils voués à un sort terrible ?"
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$\n$TRAITS_DESC|$"
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 USA_OILCRISIS_DESC: "Les États-Unis sont confrontés à un avenir incertain alors que les dernières troupes se préparent à se retirer du Vietnam. L'inflation a grimpé jusqu'à près de 9 %, nuisant à la force du dollar américain. Les jeunes manifestent dans les rues pour la paix, la justice, et parfois juste pour le plaisir. Des changements sociaux sont également à venir, alors que la « révolution sexuelle », la « Panthère noire » et le « féminisme » entrent dans le langage courant. Même si la Détente a réchauffé les relations avec Moscou et Pékin, le bilan culturel américain ne fait que commencer."
 PRC_OILCRISIS_DESC: "La RPC est au milieu d'une révolution culturelle et d'immenses changements. L'éducation socialiste se poursuit, les jeunes travailleurs chinois urbains étant envoyés à la campagne pour y être rééduqués. Le président Mao reste au pouvoir, mais des discussions sont déjà en cours pour savoir qui pourrait succéder au père du socialisme en Chine. Les tensions avec les Soviétiques restent élevées alors que les deux géants socialistes poursuivent leur vision d'une société socialiste. L'hostilité demeure à l'égard de la République de Chine, les deux États continuant de s'engager diplomatiquement et par le biais de conflits par procuration. Beaucoup voient la récente avancée dans les relations avec les États-Unis comme une opportunité de contrer la menace soviétique et potentiellement d'isoler la République de Chine."
 SOV_OILCRISIS_DESC: "Depuis l'éviction de Khrouchtchev en 1964, l'Union soviétique est dirigée par le plus conservateur Léonid Brejnev. Face à l'augmentation du niveau de vie et aux nouveaux efforts de paix avec les États-Unis, l'Union soviétique est toujours confrontée à des intrigues politiques intérieures et à une lutte pour le leadership du mouvement communiste mondial contre la Chine. Même si, pour l'instant, l'Union soviétique semble incassable, le statu quo pourrait ne pas y mettre un terme pour toujours."
 EGY_OILCRISIS_DESC: "La fin peu concluante de l'Égypte à la guerre du Yom Kippour l'a laissée dans une position incertaine. Le président Anouar Sadate a tenté pendant une grande partie de sa présidence de s'éloigner du nassérisme, et c'est la pensée nassérienne qui a conduit en premier lieu à la désastreuse guerre des Six Jours. Peut-être que la paix avec Israël pourrait ramener le Sinaï, mais une telle démarche isolerait l'Égypte de ses alliés en Syrie et en Libye et mettrait le mouvement panarabiste dans la tombe."
 ISR_OILCRISIS_DESC: "Pendant que les soldats israéliens priaient lors de leur jour le plus saint, les Égyptiens et les Syriens envoyaient leurs armées à la guerre. En deux semaines et cinq jours, l'ennemi fut repoussé. L'agression marquée des États arabes, combinée à la victoire d'Israël, a consolidé le soutien de l'Occident. Pourtant, la guerre est désormais terminée et Israël doit parcourir le long chemin vers la paix avec les nations arabes si le peuple juif veut tirer quelque chose de son sacrifice."
 FRA_OILCRISIS_DESC: "Les jours de la France en tant que grande puissance touchent à leur fin. L'Empire n'est plus qu'un lointain souvenir. La domination américaine sur l'Ouest est également une insulte aux sentiments français. Si la France ne peut plus être une puissance impérialiste, alors elle doit préserver sa culture, sa fierté et sa dignité dans les années tumultueuses à venir afin que le peuple français ait toujours sa place dans le monde."
 SYR_OILCRISIS_DESC: "La défaite humiliante de la Syrie lors de la catastrophique guerre des Six Jours, qui a culminé avec la prise du plateau du Golan par l'ennemi sioniste, a conduit à la chute de Salah Jadid. Après l'inévitable lutte de pouvoir, le président Hafez al-Assad a pris le dessus pour mettre en oeuvre son Mouvement Correctif, un ambitieux programme de modernisation. La Syrie renaîtra et le Lion du Levant prendra sa revanche contre les Israéliens et leurs amis occidentaux."
