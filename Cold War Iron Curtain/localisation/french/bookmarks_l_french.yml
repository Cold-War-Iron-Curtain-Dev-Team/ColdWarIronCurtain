 BM_HISTORY_TITLE: "Bref historique"
 BOOKMARK_1980_NAME: "La nouvelle guerre froide"
 BOOKMARK_1980_DESC: "Trente et un ans après la chute du rideau de fer sur un monde ravagé par la guerre, la guerre froide est entrée dans une nouvelle phase dangereuse. La décolonisation a créé de nombreux nouveaux États, la Chine s'est séparée du camp soviétique et les guerres en Corée, au Vietnam et au Moyen-Orient ont redessiné la carte stratégique. La détente s'effondre à mesure que les forces soviétiques entrent en Afghanistan, que la révolution transforme l'Iran et que la crise économique met à rude épreuve les gouvernements des deux côtés du fossé. L'ordre d'après-guerre construit en 1949 a perduré - mais presque aucune de ses certitudes n'a perduré."
