 PRC_Socialist_System_desc:0 "\"Notre théorie est une combinaison de la vérité universelle du marxisme-léninisme et de la pratique concrète de la révolution chinoise.\"\n--Mao Zedong, Sur les dix relations\nSur la base de la transformation socialiste, les dirigeants du Parti ont commencé à réfléchir à l'étape suivante. Alors que les idéaux et les réalités se compromettaient, la tradition de la ligne de masse, la dictature démocratique populaire et le besoin urgent d'une industrialisation socialiste se sont réunis pour façonner le tout nouveau système chinois.\nLa graine, née de la théorie marxiste-léniniste et cultivée sur le sol des vingt-huit années de révolution chinoise, avait finalement germé à ce moment-là. Dieu seul sait ce que cela deviendra."
