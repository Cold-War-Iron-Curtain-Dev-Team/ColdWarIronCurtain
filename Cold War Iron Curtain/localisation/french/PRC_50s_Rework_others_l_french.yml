 #社会主义之路决议组 Socialist Transformation decisions
 PRC_50s_The_Road_to_Socialism_categories:0 "La route vers le socialisme"
 PRC_50s_The_Road_to_Socialism_categories_desc:0 "[Get_PRC_50s_The_Road_to_Socialism_categories_desc]"
 PRC_Suppress_Counterrevolutionaries_categories_desc:0 "Après la fondation de la Chine nouvelle, les contre-révolutionnaires sont toujours très actifs en raison de notre répression défavorable.\nLes propriétaires terriens et les paysans riches d'origine organisent des corps de restitution des propriétaires fonciers dans les zones reculées pour mener des contre-attaques ; des bandits et des agents secrets attaquent les routes et les voies ferrées, tuent les cadres et détruisent la production industrielle et agricole ; les organisations Huidaomen opèrent dans les zones rurales, propageant leur doctrine religieuse réactionnaire et superstitieuse ; et les forces latentes du Kuomintang sèment également le trouble dans l'ombre, tentant de renverser le pouvoir populaire en collusion avec les impérialistes américains.\nMaintenant que la campagne « Supprimer les contre-révolutionnaires » se déroule comme une violente tempête dans tout le pays, nous devons prendre des mesures énergiques pour démanteler ces contre-révolutionnaires, afin de maintenir la paix et la stabilité sociale du peuple et de consolider le pouvoir du peuple nouveau-né."
 PRC_Land_Reform_categories_desc:0 "Les propriétaires fonciers et les châtelains ont constitué la classe dirigeante locale dans les townships ruraux tout au long de la longue histoire féodale de la Chine et ont été l'une des causes profondes de la décadence et du retard de la Chine moderne, ainsi que de la misère du peuple. Afin de purger le régime réactionnaire des propriétaires terriens et des seigneurs au niveau local et de libérer les paysans réduits en esclavage et exploités par les propriétaires terriens, une réforme agraire est impérative.\n Dès 1947, le Comité central du PCC, sur la base des leçons tirées des précédents travaux agraires dans les campagnes, a lancé un mouvement de réforme agraire dans les zones libérées et a formulé les grandes lignes de la loi foncière chinoise, qui stipulaient : « Abolir le système d'exploitation agraire féodal et semi-féodal et mettre en oeuvre un système agraire dans lequel le laboureur a droit à sa part de la terre ». Plus tard, en janvier 1948, le camarade Mao Zedong avança la ligne générale de la réforme agraire : « En nous appuyant sur les paysans pauvres et en unissant les paysans moyens, nous éliminerons le système d'exploitation féodal et développerons la production agricole de manière systématique et séparée ».\n De nos jours, il y a encore plus de 300 millions de paysans en Chine exploités et opprimés par la classe des propriétaires fonciers. L'armée du Kuomintang s'étant effondrée trop rapidement, un grand nombre de régions nouvellement libérées n'ont pas pu mener à temps des réformes agraires. Parallèlement à la réforme agraire, le régime des propriétaires ruraux serait progressivement démantelé, les paysans disposeraient de leurs propres parcelles de terre et le régime démocratique populaire serait pleinement étendu aux zones rurales."
 PRC_Socialist_Transformation_categories_desc:0 "La transformation socialiste regroupe les trois grands programmes de transformation établis pour amener le pays au stade socialiste, qui cherche à socialiser les trois dimensions économiques que sont l'agriculture, l'artisanat, l'industrie et le commerce capitalistes.\n Le programme de transformation de l'agriculture s'inspire de l'établissement du système coopératif par l'Union soviétique, qui divise la coopérativisation agricole en trois étapes principales, à savoir les sociétés d'entraide, les sociétés primaires et les sociétés avancées, et définit la voie socialiste agricole de la Chine. Le mode de transformation de l'artisanat est également le même que celui de l'agriculture.\n La transformation de l'industrie et du commerce consiste à transformer progressivement les entreprises privées capitalistes en entreprises socialistes appartenant au peuple tout entier au moyen du capitalisme d'État, et à répartir et résoudre le problème des bénéfices privés conformément à « l'impôt sur le revenu de l'État, au fonds de prévoyance des entreprises, aux primes sociales des employés, aux dividendes et aux primes en capital », en s'efforçant de réaliser le « partenariat public-privé suivant dans toutes les industries ».\n Les Trois grandes réformes adapteront notre système économique aux besoins de l'industrialisation socialiste et, après le succès des réformes dans tous les domaines, nous ferons avancer le pays tout entier vers une nouvelle étape du socialisme et apporterons des changements et des innovations tangibles dans la vie des gens. Cela prendra forcément du temps, mais avec la maturité de l'administration, nous pouvons faire confiance à la capacité de nos cadres..."
