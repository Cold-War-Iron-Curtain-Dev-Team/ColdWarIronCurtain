 MONEY_TOOLTIP:0 ""
 rights_for_people:0 "Droits des personnes"
 POWER_TOOLTIP:0 "Vous avez un solde net de [?ROOT.power_rate] Mégawatts"
 COMECON_TECH_TT_1:0 "En érodant les brevets et les droits d'auteur entre les membres du COMECON, nous augmenterons considérablement le bonus de recherche sur les technologies déjà étudiées, mais cela entravera grandement les futurs progrès technologiques"
 COMECON_TECH_TT_2:0 "Une approche plus équilibrée entre les deux autres politiques, une prime de partage technologique augmentée à 15 % mais une pénalité de recherche de 5 %"
 COMECON_TECH_TT_3:0 "Taux de partage de technologie normal"
 
 COMECON_INTEGRATION_1_TT:0 "À ce niveau, 25 % de notre industrie est destinée à l'Union soviétique et nous bénéficions d'un bonus de 50 % sur les volumes commerciaux de ressources soviétiques et d'une augmentation de 25 % pour la production de ressources locales"
 COMECON_INTEGRATION_2_TT:0 "À ce niveau, 12,5 % de notre industrie est destinée à l'Union soviétique et nous bénéficions d'un bonus de 25 % sur les volumes commerciaux de ressources soviétiques et d'une augmentation de 12,5 % pour la production de ressources locales"
 COMECON_INTEGRATION_3_TT:0 "À ce niveau, 5 % de notre industrie est destinée à l'Union soviétique et nous obtenons un bonus de 10 % sur les volumes commerciaux de ressources soviétiques et une augmentation de 5 % pour la production de ressources locales"
 COMECON_INTEGRATION_4_TT:0 "À ce niveau, aucune de nos industries ne va aux Soviétiques, en rejetant la planification du COMECON, l'autonomie nationale augmentera lentement, mais nous n'obtiendrons aucun avantage commercial ni bonus de production de ressources"

 COMECON_MANPOWER_1_TT:0 "Demander de la main-d'oeuvre soviétique"
 COMECON_INDUSTRIAL_1_TT:0 "Demander l'aide industrielle soviétique"
 COMECON_HEAVY_INDUSTRIAL_1_TT:0 "Demander une aide industrielle lourde soviétique"
 COMECON_HOUSING_1_TT:0 "Demander une aide au logement soviétique (augmentera les emplacements de construction)"

 COMECON_AGRI_1_TT:0 "Mettre l'accent sur l'économie de la cible qui doit être axée sur l'agriculture" 
 COMECON_IND_FOCUS_1_TT:0 "Mettre l'accent sur l'économie de la cible pour qu'elle se concentre sur l'industrie civile"
 COMECON_HEAVY_IND_FOCUS_1_TT:0 "Mettre l'accent sur l'économie de la cible qui doit être axée sur l'industrie lourde"
 COMECON_TECH_FOCUS_1_TT:0 "Mettre l'accent sur le fait que l'économie de la cible soit axée sur le développement technologique"
 COMECON_MIL_FOCUS_1_TT:0 "Insister sur le fait que l'économie de la cible doit se concentrer sur le renforcement de son armée"
 COMECON_RESOURCE_FOCUS_1_TT:0 "Mettre l'accent sur l'économie de la cible pour qu'elle se concentre sur la production et l'extraction de ressources"
