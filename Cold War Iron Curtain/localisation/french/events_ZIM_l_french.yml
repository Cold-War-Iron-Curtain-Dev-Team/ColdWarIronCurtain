l_french:
 rho.2.d:0 "Plus tôt dans la journée, Ian Smith a annoncé que la Rhodésie, un territoire britannique d'Afrique australe qui se gouvernait lui-même depuis 1923, se considérait désormais comme un État souverain indépendant. Il s'agit de la première rupture unilatérale d'une de ses colonies avec le Royaume-Uni depuis la déclaration d'indépendance des États-Unis, près de deux siècles auparavant. Le Royaume-Uni, le Commonwealth et les Nations Unies ont tous jugé l'UDI de la Rhodésie illégale, et des sanctions économiques de la part de l'ONU ont déjà été planifiées.\n Une impasse s'est développée entre les premiers ministres britannique et rhodésien entre 1964 et 1965. Le différend a largement entouré la condition britannique selon laquelle les conditions de l'indépendance devaient être acceptables « par la population du pays dans son ensemble » ; Smith a soutenu que cela avait été satisfait, tandis que le Royaume-Uni et les dirigeants rhodésiens noirs en Rhodésie ont soutenu que ce n'était pas le cas.\n Ian Smith a déclaré que malgré cela, ils resteraient fidèles à la reine Elizabeth II."
 rho.3.d:0 "Les conférences de Victoria Falls et de Londres ont conduit à la formation de la Fédération de Rhodésie et du Nyassaland, composée de trois divisions : Nyassaland, Rhodésie du Nord et Rhodésie du Sud. La Fédération a été officiellement créée après que le Parlement britannique a promulgué la loi sur la Fédération de Rhodésie et du Nyassaland. La loi a ensuite été autorisée par la Reine."
 rho.4.d:0 "Le Conseil de sécurité des Nations Unies a franchi la semaine dernière une sorte de mesure historique. Pour la première fois en 21 ans d'existence, il a eu recours à des sanctions économiques obligatoires pour tenter de renverser un gouvernement.\nL'objet des sanctions était le régime suprémaciste blanc de Ian Smith en Rhodésie, qui a été déploré comme un renégat international depuis qu'il a rompu avec la domination britannique il y a 13 mois. Par un vote de onze voix contre zéro, avec quatre abstentions, le conseil a déclaré un embargo international sur 90 % des exportations de la Rhodésie et a interdit aux 122 pays membres de l'ONU de vendre du pétrole, des armes, des véhicules à moteur ou des avions au territoire rebelle ou de lui fournir toute forme d'aide financière ou autre aide économique.\nToutefois, il est prévu que les sanctions n'auront aucun effet réel. Un amendement visant à pénaliser les pays qui ignorent le boycott a été rejeté. Le Conseil de sécurité a laissé à chaque pays membre le soin de contrôler son propre commerce avec la Rhodésie. Peu après le vote de la semaine dernière, l'Afrique du Sud, qui fournit la majeure partie du pétrole de la Rhodésie et est son principal partenaire commercial, a annoncé qu'elle n'avait pas l'intention d'obéir à la résolution. Sans la coopération sud-africaine, les sanctions semblent vouées à l'échec."
 rho.129.d:0 "La Rhodésie a été reconnectée au monde grâce à une nouvelle compagnie aérienne : Air Rhodesia. En raison des sanctions imposées sur tous les vols internationaux vers la Rhodésie en raison de la déclaration d'indépendance du gouvernement rhodésien, Air Rhodesia Corporation ne prévoit que des vols internationaux vers l'État ami du Malawi. Une première route de Salisbury à Blantyre est actuellement proposée sur les Vickers Viscounts, hérités de leur ancienne société mère, Central African Airways."
 ZIM_NYA_independence_war:0 "Guerre d'indépendance du Malawi"
 ZIM_ZAM_independence_war:0 "Guerre d'indépendance de la Zambie"
 bush_war.1.d:0 "La colonie de Rhodésie du Sud a été secouée par l'assassinat du contremaître blanc Andrew Oberholzer par des nationalistes zimbabwéens dans un acte apparemment politique. Les rapports indiquent qu'Oberholzer a été pris dans une embuscade et assassiné alors qu'il voyageait avec sa famille sur une route principale, mais les tueurs ont été chassés par une autre voiture peu de temps après. Même si un communiqué officiel de l'administration affirme que les meurtriers ont depuis été éliminés, l'incident a eu un profond impact sur la communauté minoritaire blanche. Le gouvernement a déjà commencé à arrêter les dirigeants nationalistes noirs et nombreux sont ceux qui prédisent que cela entraînera une augmentation radicale des tensions entre les dirigeants blancs et les majorités noires."
 bush_war.2.d:0 "Depuis des années, nous sommes en proie à des troubles civils et à une insurrection rebelle qui n'a fait que préserver le chaos et l'incertitude sur nos terres. Cependant, il est devenu plus évident que l'insurrection redouble d'efforts, notamment lors de la bataille de Sinoia. Une escarmouche entre les forces de sécurité rhodésiennes et les guérilleros du ZANLA n'a fait aucune victime de notre côté, alors qu'il en a laissé sept du côté des leurs. Même s'il s'agit sans aucun doute d'une victoire pour nous, cela servira de précédent car l'insurrection que nous avons simplement négligée a pris de l'ampleur, signalant les signes d'une guerre civile à l'horizon..."
 bush_war.3.d:0 "En réponse au meurtre du fermier Johannes Viljoen, la police britannique d'Afrique du Sud a lancé une opération militaire en coordination avec l'armée rhodésienne pour tuer ou capturer les terroristes. On pense qu'ils sont affiliés à l'Armée de libération nationale africaine du Zimbabwe, qui a récemment intensifié sa campagne de violence contre notre population blanche et représente une menace considérable pour la stabilité de la nation. Jusqu'à présent, l'opération a été un succès sans équivoque, avec plusieurs terroristes tués et les autres apparemment en fuite. Avec la menace neutralisée au moins temporairement, cela devrait envoyer un message à la population selon lequel notre gouvernement peut les protéger contre les menaces intérieures et renforcer la confiance dans l'administration. Cependant, comme nos forces engagent déjà des nationalistes dans des combats, nous risquons d'être trop étendus si d'autres attaques suivent."
 bush_war.4.d:0 "Récemment, les forces de sécurité rhodésiennes ont découvert que 79 membres de l'Armée révolutionnaire populaire du Zimbabwe ont traversé la frontière avec la Zambie dans le but apparent de rassembler davantage de recrues et potentiellement d'attaquer des fermes appartenant à des Blancs. Nous n'en avons été informés qu'après la capture réussie d'un insurgé solitaire sur la route entre Victoria Falls et Wankie, ce qui signifie que les insurgés étaient déjà profondément présents sur le territoire rhodésien. L'opération Nickel a ensuite été lancée par l'armée rhodésienne, soutenue par l'infanterie légère rhodésienne et les fusils africains rhodésiens, dans le but de traquer et de capturer les insurgés restants. Malgré les revers initiaux, nos forces ont réussi à tuer de nombreuses personnes, à les chasser et à en arrêter plusieurs au cours d'une opération classique. Finalement, après une opération de ratissage menée par des commandos d'élite, les 17 derniers insurgés ont fui vers le pays ami du Botswana, où ils ont ensuite été arrêtés. Au prix de 8 tués et 14 blessés, nos forces ont pu tuer 29 et arrêter 17 insurgés, dont un porté disparu. Vingt-neuf autres ont été arrêtés au Botswana et un autre en Afrique du Sud, un seul des 79 insurgés initiaux ayant réussi à franchir la frontière zambienne. Cette victoire significative, la dernière d'une série d'opérations insurrectionnelles qui s'intensifient, constitue un formidable stimulant pour le moral et peut servir d'exemple futur d'une campagne contre-insurrectionnelle parfaitement exécutée."
 bush_war.5.d:0 "À la suite du dernier d'une longue série de passages d'insurgés à travers la frontière zambienne, les forces de sécurité rhodésiennes ont lancé l'opération Birch, un effort des commandos locaux pour éliminer au moins 20 rebelles du ZIPRA traversant le fleuve Zambèze. Dans ce qui semblait être un assaut hautement organisé et coordonné, les insurgés sont entrés dans le pays avant de se diviser en groupes et d'engager les forces du RLI, les forçant à se retirer. Cependant, le lendemain, ils ont lancé une embuscade, tuant tous les insurgés au prix d'un seul mort. Après seulement quelques arrestations au cours des jours suivants, les forces anti-insurgées ont eu un grand coup de chance lorsqu'un insurgé a fait défection et a guidé une patrouille du RLI vers un camp d'insurgés, permettant ainsi de tuer ou d'arrêter au moins deux autres insurgés. Au cours du mois suivant, les patrouilles s'intensifient et une vaste campagne est lancée pour tenter d'extirper enfin les derniers insurgés sur le territoire rhodésien. Autre coup de chance, le chef des opérations du ZIPRA a été capturé avec un presse-papier contenant des recommandations sur la manière d'accroître l'efficacité des opérations insurgées en Rhodésie. Cela a incité les insurgés restants à se disperser, les forces de sécurité ayant perdu leur trace en cours de route, tandis que plusieurs autres ont été arrêtés après avoir traversé la frontière avec le Mozambique portugais. Finalement, après presque deux mois, l'opération a finalement été annulée - nos forces ayant infligé au moins 23 victimes aux insurgés au prix d'un seul commando mort et de deux autres blessés."