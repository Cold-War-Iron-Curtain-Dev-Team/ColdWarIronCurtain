l_french:
 PolandRel.2.d:0 "Le professeur et cardinal Stefan Wyszynski a récemment été arrêté à la suite d'une répression de plusieurs éléments de la société polonaise et est maintenant emprisonné à Rywald. Le gouvernement polonais cite un comportement de trahison pour la vague d'arrestations en cours, suivie de procès de masse et d'emprisonnements. Il avait récemment été élevé au rang de cardinal par le Pape et était un travailleur social passionné et a aidé plusieurs Juifs pendant l'occupation nazie de la Pologne ; avant de diriger un projet de restauration à Wloclawek après la guerre. Nombreux sont ceux qui considèrent cette arrestation comme une grave injustice contre l'Église et le peuple polonais lui-même."
 POL_The_Sovietization_of_Poland:0 "La soviétisation de la Pologne"
 POL_The_Sovietization_of_Poland_desc:0 "Après la Libération du joug fasciste, nous nous retrouvons maintenant aux commandes de la Pologne. Malheureusement, cela ne signifie pas que nous n'aurons pas du mal à gouverner la nation. Beaucoup ne sont pas heureux qu'un Parti socialiste soit aux commandes, sans parler de devoir répondre aux Soviétiques. La situation est désastreuse, mais nous devons faire de notre mieux pour l'améliorer au mieux de nos capacités."
 POL_Begin_the_6_Year_Plan:0 "Commencer le plan de 6 ans"
 POL_Begin_the_6_Year_Plan_desc:0 "Maintenant que nous avons terminé la reconstruction de l'industrie détruite, nous pouvons commencer le Premier Plan de six ans. À l'instar du Plan quinquennal soviétique, nous nous concentrerons sur l'expansion de l'industrie, la lutte contre l'inflation, la pénurie alimentaire et le logement."
 POL_Continue_the_3_Year_Plan:0 "Continuer le plan triennal"
 POL_Continue_the_3_Year_Plan_desc:0 "Tout comme l'Allemagne de l'Est, nous devons lancer un plan triennal pour d'abord réparer notre industrie détruite avant de nous concentrer sur l'expansion de notre industrie existante. Sans parler de terminer les migrations vers nos nouvelles terres acquises anciennement allemandes."
 POL_Ludowe_Wojsko_Polskie:0 "Ludowe Wojsko Polskie"
 POL_Ludowe_Wojsko_Polskie_desc:0 "L'Armée populaire polonaise est le résultat des efforts de Joseph Staline. Formé en 1943, elle a été fondée dans l'Est de la Pologne pendant l'Occupation soviétique, comme une seule Force avant d'être divisé en deux Armées. Les nombreux anciens combattants de la Seconde Guerre mondiale vont nous aider à réformer nos Forces armées en une force avec laquelle il faut compter!"
 POL_The_Death_of_Stalin:0 "La mort de Staline"
 POL_The_Death_of_Stalin_desc:0 "Avec la mort de l'Homme d'acier, notre avenir est encore inconnu. Une chose est sûre cependant. Avec la mort de Staline, nous pourrons desserrer l'étau sur le Parti des partisans de la ligne dure et commencer à libéraliser le parti!"
 POL_Secretary_Ochab:0 "Secrétaire Ochab"
 POL_Secretary_Ochab_desc:0 "Suite au décès soudain du secrétaire général Bierut, nous nommerons temporairement Ochab à la tête de l'État, jusqu'à ce que nous trouvions un digne successeur à Bierut."
 POL_Create_the_ZSL:0 "Créer le ZSL"
 POL_Create_the_ZSL_desc:0 "Le Parti populaire uni a été créé à la suite de la fusion de deux petits partis communistes. Le parti est fondé sur l'agrarisme et le socialisme agraire. Il n'est pas encore public qu'il n'est pas complètement indépendant. Il s'agit en quelque sorte d'un parti satellite, dont la mission est de représenter les travailleurs ruraux de Pologne."
 POL_Michejda_Support:0 "Soutien de Michejda"
 POL_Michejda_Support_desc:0 "Afin de renforcer la légitimité du ZSL récemment créé, nous avons reçu les éloges et le soutien du célèbre médecin et homme politique polonais Tadeusz Michejda. Il a salué l'attention particulière que porte le parti aux travailleurs ruraux qui, selon ses propres termes, sont souvent négligés dans une Pologne de plus en plus urbanisée."
 POL_PAX_Association:0 "Association PAX"
 POL_PAX_Association_desc:0 "L'association PAX est une organisation catholique procommuniste créée en 1947. Elle publie quotidiennement le journal Slowo Powszechne. Elle a également pour mission secondaire de saper le soutien populaire à l'Église catholique romaine."
 POL_A_Peoples_Democracy:0 "Une démocratie populaire"
 POL_A_Peoples_Democracy_desc:0 "Même si nous sommes socialistes dans l'âme, nous voulons donner la parole aux travailleurs. Avec la création du ZSL, nous donnerons la possibilité de voter régionalement pour le PZPR ou le PZL, laissant les travailleurs décider eux-mêmes qui serait le plus adapté à leur région."
 POL_Imprison_Cardinal_Stefan_Wyszynski:0 "Emprisonner le cardinal Stefan Wyszynski"
 POL_Imprison_Cardinal_Stefan_Wyszynski_desc:0 "Le cardinal Stefan Wyszynski est depuis longtemps une épine dans notre pied. Alors que d'autres branches de l'Église se sont alignées sur notre doctrine socialiste, Stefan est un critique très connu de notre répression, un symbole de l'Église qui lutte contre notre répression. Nous devons l'enfermer et le faire taire."
 POL_Begin_the_Purge:0 "Commencer la purge"
 POL_Begin_the_Purge_desc:0 "Malheureusement, il existe encore de nombreux collaborateurs de guerre, ennemis de la classe ouvrière et de l'État dans les rues, qui complotent chaque jour pour renverser notre régime socialiste. Nous ne pouvons pas laisser les ennemis et les traîtres mettre la nation en danger. C'est pourquoi nous allons lancer une purge sévère afin d'éliminer tous les traîtres et ennemis de la classe ouvrière !"
 POL_Eliminate_the_Nationalists:0 "Éliminer les nationalistes"
 POL_Eliminate_the_Nationalists_desc:0 "La menace la plus grave et la plus urgente à laquelle nous devons faire face est celle des nationalistes. On pourrait penser qu'après les horreurs commises par les nazis en Pologne, personne ne serait assez fou pour adhérer à leur idéologie. Et pourtant, nous en sommes là. Il ne fait aucun doute que nous allons sévir aussi durement que possible contre cette racaille."
 POL_Imprison_Gomulka:0 "Emprisonner Gomulka"
 POL_Imprison_Gomulka_desc:0 "Depuis longtemps déjà, Boleslaw et Gomulka se livrent une lutte de pouvoir. Cette lutte semble désormais terminée, puisque Bierut a emprisonné Gomulka, l'accusant de déviation vers la droite. La durée de la peine de prison n'a pas encore été déterminée."
 POL_Suspend_the_Purges:0 "Suspendre les purges"
 POL_Suspend_the_Purges_desc:0 "Avec Gomulka emprisonné, la plupart des ennemis enfermés ou purgés et les nationalistes réprimés, nous pouvons désormais mettre fin à la purge. Mais nous continuerons à surveiller de près ceux qui ont été épargnés par la purge, au cas où ils tenteraient de se réorganiser ou de recruter de nouveaux membres pour atteindre leurs objectifs traîtres."
 POL_Reform_the_Party_Positions:0 "Réformer les positions du parti"
 POL_Reform_the_Party_Positions_desc:0 "Avec la disparition de Staline, nous pouvons enfin commencer à écarter les staliniens purs et durs de notre gouvernement et les remplacer par des modérés et des réformistes qui ne tenteront pas de faire obstacle à nos futures lois et politiques."
 POL_Patriot_Priests:0 "Prêtres patriotes"
 POL_Patriot_Priests_desc:0 "Contrairement à d'autres États socialistes, le clergé de notre nation est étonnamment très disposé à coopérer avec nous. Nous avons donc lancé un programme qui finance les « prêtres patriotes », qui promeuvent le christianisme avec des valeurs socialistes !"
 POL_Merge_Combatant_Organizations:0 "Fusionner les organisations combattantes"
 POL_Merge_Combatant_Organizations_desc:0 "Il n'est pas surprenant qu'il existe de nombreuses organisations paramilitaires dans notre pays, réparties sur tout le territoire et désorganisées. Afin d'accroître leur efficacité et de former correctement ces combattants, nous allons les regrouper en une seule organisation."
 POL_Merge_the_Trade_Unions:0 "Fusionner les syndicats"
 POL_Merge_the_Trade_Unions_desc:0 "Tout comme les organisations combattantes, les syndicats sont dispersés dans toute la Pologne et communiquent rarement entre eux, voire pas du tout. En prenant le contrôle des syndicats d'État et en les transformant en syndicats d'État, il sera plus facile d'écouter les souhaits et les problèmes des travailleurs !"
 POL_Church_State_Agreement:0 "Accord entre l'Église et l'État"
 POL_Church_State_Agreement_desc:0 "Le gouvernement a pris contact avec les Églises catholiques de Pologne et leur a proposé un accord. Tant qu'elles s'abstiendront de propager des idées antisocialistes, nous assouplirons notre répression à l'égard du clergé."
 POL_Begin_Drafting_the_Constitution:0 "Commencer la rédaction de la Constitution"
 POL_Begin_Drafting_the_Constitution_desc:0 "Les premières étapes de la soviétisation ont été couronnées de succès. Il ne reste plus qu'à rédiger une Constitution socialiste, car nous utilisons toujours celle de l'ancien gouvernement polonais."
 POL_An_Ideological_Judiciary:0 "Un pouvoir judiciaire idéologique"
 POL_An_Ideological_Judiciary_desc:0 "Après de longues discussions, il a été décidé qu'un pouvoir judiciaire idéologique serait mis en place. Non seulement il supervisera la rédaction de la Constitution, mais il fera également office de Cour suprême, traitant les affaires très importantes et garantissant la sécurité de l'État."
 POL_Legislative_Powers:0 "Pouvoirs législatifs"
 POL_Legislative_Powers_desc:0 "L'ancienne Constitution accordait trop de liberté aux provinces. L'ancien gouvernement préférait que le pays soit décentralisé. Avec cette Constitution, cela va changer, car nous allons inclure des pouvoirs législatifs dans la nouvelle Constitution, ce qui donnera plus de pouvoir à l'État et réduira l'indépendance de chaque province, centralisant ainsi le gouvernement."
 POL_Jaworzno_Electric_Plant:0 "Centrale électrique de Jaworzno"
 POL_Jaworzno_Electric_Plant_desc:0 "La centrale électrique à combustible fossile que nous prévoyons de construire à Katowickie est l'une de nos principales priorités. Avec nos projets d'expansion industrielle à grande échelle, nous aurons besoin d'autant d'électricité que possible."
 POL_Chemical_Institutes_in_West:0 "Instituts chimiques dans l'Ouest"
 POL_Chemical_Institutes_in_West_desc:0 "L'un des secteurs industriels les plus importants est l'industrie chimique, qui produit toutes sortes de produits chimiques à usage industriel ou personnel. C'est également un bon point de départ pour la première expansion de l'industrie polonaise."
 POL_Chemical_Institutes_in_Silesia:0 "Instituts chimiques en Silésie"
 POL_Chemical_Institutes_in_Silesia_desc:0 "Tout en développant l'industrie dans l'ouest, nous devons également développer l'industrie chimique dans d'autres régions de Pologne. Cette fois-ci, nous avons choisi la Silésie, la province proche de la frontière tchécoslovaque. Cela nous sera utile si nous parvenons à conclure un accord et à vendre certains de nos produits chimiques à la Tchécoslovaquie."
 POL_Invest_in_Agriculture:0 "Investir dans l'agriculture"
 POL_Invest_in_Agriculture_desc:0 "Nous avons le choix entre investir dans l'agriculture ou dans l'industrie dans le cadre de ce plan sexennal. Nous avons décidé qu'il serait plus avantageux d'investir dans l'agriculture. De cette façon, nous pouvons nous assurer que l'économie continue de se redresser tout en garantissant une alimentation suffisante pour les travailleurs !"
 POL_Invest_in_Industry:0 "Investir dans l'industrie"
 POL_Invest_in_Industry_desc:0 "Au lieu de nous concentrer sur l'agriculture, nous devrions nous concentrer sur le développement de nos parcs industriels afin de garantir des emplois à notre population. Avec davantage d'emplois disponibles, nous ferons en sorte que tout le monde puisse avoir un travail et ne se retrouve pas sans abri ou mendiant dans la rue !"
 POL_Complete_the_Migrations:0 "Terminer les migrations"
 POL_Complete_the_Migrations_desc:0 "Après avoir conquis de nouveaux territoires aux Allemands, nous mettrons en place un programme visant à accroître la migration des Polonais ethniques de cette région qui ont été contraints de fuir le régime nazi et la Seconde Guerre mondiale en général."
 POL_The_Opening_of_W-Z:0 "L'ouverture de W-Z"
 POL_The_Opening_of_W-Z_desc:0 "Le W-Z sera ouvert, sa mission étant la coordination de la planification industrielle et de la production des outils nécessaires dans les usines et sur les chantiers de construction."
 POL_Currency_Reform:0 "Réforme monétaire"
 POL_Currency_Reform_desc:0 "Depuis quelque temps déjà, nous souffrons d'une forte inflation. Ce qui, sans surprise, n'est pas idéal pour notre État et les travailleurs ordinaires. En raison de l'inflation, les travailleurs ne peuvent pas acheter beaucoup de biens, les prix étant trop élevés. Pour remédier à ce problème, nous allons mettre en place une politique de réforme monétaire afin de résoudre le problème de l'inflation."
 POL_Reitroduce_Ration_Stamps:0 "Réintroduire les tickets de rationnement"
 POL_Reitroduce_Ration_Stamps_desc:0 "Après avoir réglé le problème de l'inflation, un autre problème est apparu : la famine. Nous devons agir rapidement avant que la famine ne s'aggrave. Au lieu d'acheter de la nourriture à nos voisins, nous allons réintroduire les coupons alimentaires et construire une ferme supplémentaire pour améliorer la situation alimentaire."
 POL_Increase_Civilian_Production:0 "Augmenter la production civile"
 POL_Increase_Civilian_Production_desc:0 "Pendant la guerre, de nombreuses industries civiles importantes ont produit une grande variété d'articles, tels que des biens de consommation. Afin de garantir une production suffisante de biens de consommation et la poursuite de la croissance économique, nous allons reconstruire ces usines et les remettre en état de fonctionnement."
 POL_Przodownik_Pracy:0 "Leader du travail"
 POL_Przodownik_Pracy_desc:0 "Les « Shock Workers » (travailleurs d'élite) sont des travailleurs très productifs et extrêmement enthousiastes qui consacrent leur vie à la cause socialiste. Ces travailleurs sont régulièrement promus dans tout le bloc de l'Est afin de motiver le reste de la main-d'œuvre et de lui permettre de s'inspirer de ces « Shock Workers », dans l'espoir qu'un jour, elle devienne comme eux !"
 POL_Complete_the_3_Year_Plan:0 "Compléter le plan triennal"
 POL_Complete_the_3_Year_Plan_desc:0 "Nos efforts ont porté leurs fruits ! Les industries détruites sont à nouveau en plein essor, notre économie renoue avec la croissance et nous pouvons enfin achever la reconstruction, ainsi que le troisième plan quinquennal."
 POL_Import_Food:0 "Importer de la Nourriture"
 POL_Import_Food_desc:0 "Nous sommes en pleine famine et, même si nous préférerions rationner la nourriture, cela ne serait pas bien accueilli par les travailleurs. Nous allons donc plutôt importer de la nourriture de l'Union soviétique et d'autres pays du bloc de l'Est."
 POL_Increase_Prices:0 "Augmenter les prix"
 POL_Increase_Prices_desc:0 "La famine commence lentement à s'estomper, nous devons veiller à ce qu'elle ne se reproduise plus. L'augmentation des prix des produits contribuera à augmenter les revenus des agriculteurs et des entreprises, leur permettant ainsi de réaliser davantage de bénéfices et de les investir dans leurs magasins et leurs exploitations agricoles."
 POL_Wistula_Dam:0 "Barrage de la Vistule"
 POL_Wistula_Dam_desc:0 "Varsovie, après avoir été presque entièrement détruite par les Allemands pendant la Seconde Guerre mondiale, se reconstruit lentement. Dans le cadre de la reconstruction et de l'expansion de Varsovie, nous construirons le barrage de la Vistule afin de garantir l'approvisionnement continu de la ville en électricité et de lui fournir une énergie verte et propre !"
 POL_Invest_in_Heavy_Industry:0 "Investir dans l’industrie lourde"
 POL_Invest_in_Heavy_Industry_des:0 "Si nous investissons dans l'industrie légère et les parcs industriels, nous ne pouvons pas oublier notre industrie lourde qui produit, entre autres, une grande partie des armes de notre pays. Investir également dans ce secteur stimulera davantage notre développement industriel !"
 POL_Expand_Bieruts_Mill:0 "Développer le moulin de Bierut"
 POL_Expand_Bieruts_Mill_desc:0 "Le quartier Bierut's Mill, qui porte le nom de notre camarade secrétaire général, est un quartier de fonderies situé à Varsovie. Il a été nommé ainsi en remerciement pour son soutien aux travailleurs et pour avoir apporté la révolution socialiste en Pologne."
 POL_Lenins_Mill:0 "Le moulin de Lénine"
 POL_Lenins_Mill_desc:0 "Tout comme le moulin Bierut, il est tout à fait naturel que nous ayons également un moulin nommé d'après le héros de la révolution socialiste Vladimir Lénine. Même si nous avons connu des conflits par le passé, nous sommes désormais des frères et camarades socialistes. Contrairement au moulin Bierut, le moulin Lénine sera construit à Gdansk !"
 POL_Stalins_Mill:0 "Le moulin de Staline"
 POL_Stalins_Mill_desc:0 "Pour compléter la trilogie, nous avons également donné à une usine le nom de l'homme d'acier lui-même, Joseph Staline. Son usine sera identique à celle de Lénine construite à Gdansk. Les usines Bieruts, Lénine et Staline. Les héros du socialisme qui contribuent chaque jour à l'expansion de la révolution socialiste !"
 POL_Uranium_Mines:0 "Mines d'uranium"
 POL_Uranium_Mines_desc:0 "Alors que nous étendions les limites de la ville de Varsovie et creusions des trous pour préparer les fondations des immeubles, nous avons découvert de l'uranium ! Évidemment, nous ne pouvons pas construire de maisons sur un gisement d'uranium, nous allons donc construire une mine d'uranium à la place. Qui sait quand cela nous sera utile ?"
 POL_Marynarka_Wojenna:0 "Marine nationale"
 POL_Marynarka_Wojenna_desc:0 "Les forces navales de Pologne. Même si notre nation n'est généralement pas connue pour ses nombreuses batailles navales et ses exploits, cela ne signifie pas pour autant qu'elle est obsolète ! Nos forces navales, qui protègent nos côtes et ont livré une lutte acharnée à la flotte allemande pendant la Seconde Guerre mondiale, constituent un élément central de notre armée !"
 POL_Coastal_Defenses:0 "Défenses côtières"
 POL_Coastal_Defenses_desc:0 "Même si nous sommes actuellement protégés par la marine soviétique, cela ne sera pas toujours le cas. Nous allons donc commencer à construire des défenses côtières au cas où de futurs ennemis tenteraient de nous envahir par la mer !"
 POL_Expand_the_Mining_Sector:0 "Développer le secteur minier"
 POL_Expand_the_Mining_Sector_desc:0 "Le secteur minier a toujours été un secteur industriel important. Son expansion ne peut que nous être bénéfique à long terme."
 POL_Nowa_Huta:0 "Nowa Huta"
 POL_Nowa_Huta_desc:0 "Nowa Huta sera un exemple de ce à quoi ressemblera le logement dans l'utopie socialiste qu'est la Pologne. Pour l'instant, cependant, Nowa Huta sera un quartier socréaliste qui sera strictement destiné à des fins de propagande."
 POL_Expand_the_Polish_Marines:0 "Développer la marine polonaise"
 POL_Expand_the_Polish_Marines_desc:0 "Développer les forces maritimes polonaises. Elles ne sont pas très souvent utilisées, car nous n'avons pas vraiment besoin d'opérations spéciales navales, mais nous allons les conserver et investir un peu dans leur développement. Elles pourraient s'avérer utiles à l'avenir. Marines"
 POL_Naval_Modernization:0 "Modernisation navale"
 POL_Naval_Modernization_desc:0 "Un littoral plus étendu nécessite une flotte plus importante, mais notre marine n'est pas suffisamment équipée pour remplir sa mission. La mer Baltique est une petite mer, il convient donc de privilégier les navires de guerre modernes de la taille d'un destroyer."
 POL_Invest_in_Gdansk_Shipyards:0 "Investir dans les chantiers navals de Gdansk"
 POL_Invest_in_Gdansk_Shipyards_desc:0 "Les ambitieux projets d'avant-guerre visant à construire des navires de guerre dans les installations locales ont été brutalement interrompus par l'invasion allemande. Aujourd'hui, cependant, nous disposons de tous les moyens nécessaires pour atteindre cet objectif, et la ville de Gdansk, enfin reconquise, sera le point de départ idéal pour l'industrie navale polonaise."
 POL_Wojska_Ladowe:0 "Armées terrestres"
 POL_Wojska_Ladowe_desc:0 "La Wojska Ladowe est notre armée de terre. Composée de nombreux vétérans de la Seconde Guerre mondiale, des partisans aux anciens soldats et généraux de l'armée, elle constitue l'épine dorsale de notre nation et protège les frontières de notre État désormais socialiste."
 POL_Adopt_the_AK_47:0 "Adopter l'AK-47"
 POL_Adopt_the_AK_47_desc:0 "L'AK-47 développé en Union soviétique est un modèle supérieur à tout ce que l'Occident avait à offrir jusqu'à présent. Il a été recommandé que nous adoptions également cette arme et que nous commencions immédiatement sa production dans nos usines."
 POL_Reform_the_Officer_Corps:0 "Réformer le Corps des Officiers"
 POL_Reform_the_Officer_Corps_desc:0 "Notre corps d'officiers généraux actuel n'est pas aussi organisé que nous le souhaiterions. Il n'y a pas de chef du corps et les différents officiers exécutent leurs plans sans communiquer entre eux. Grâce à notre réforme, nous allons créer un grand état-major militaire."
 POL_Import_the_T55:0 "Importer le T-55"
 POL_Import_the_T55_desc:0 "Nos réserves de chars ne sont pas très réjouissantes. La plupart d'entre eux sont des chars d'avant-guerre et d'après-guerre. Afin de renforcer et de moderniser notre stock, nous allons importer un certain nombre de chars soviétiques T-55 provenant du bloc de l'Est."
 POL_Embrace_Soviet_Doctrine:0 "Adopter la doctrine soviétique"
 POL_Embrace_Soviet_Doctrine_desc:0 "Les offensives menées par l'Armée rouge en 1944 et 1945 ont prouvé la qualité de leurs tactiques. Si nous devons combattre côte à côte, il serait logique d'adopter des philosophies similaires sur le champ de bataille."
 POL_Yak_17s:0 "Excédent d'avions soviétiques"
 POL_Yak_17s_desc:0 "Les Soviétiques ont un tas de chasseurs excédentaires qui traînent dans notre pays. Nous sommes sûrs qu'ils ne verront pas d'inconvénient à ce que nous les prenions pour renforcer notre propre armée de l'air."
 POL_Expand_Anti_Air_Defenses:0 "Développer les défenses antiaériennes"
 POL_Expand_Anti_Air_Defenses_desc:0 "Personne ne souhaite revivre les cauchemars de 1939, lorsque les bombes allemandes ont détruit nos villes. Nous devons investir dans nos défenses antiaériennes fixes, afin que chaque ville devienne à l'avenir un piège mortel pour les bombardiers ennemis."
 POL_Yak_23s:0 "Les Yak-23"
 POL_Yak_23s_desc:0 "Les Yak-23 sont nos premiers avions de chasse à réaction, que nous avons développés pendant l'occupation soviétique. Nous en avons encore plusieurs qui prennent la poussière dans nos hangars. Au lieu de les laisser rouiller, nous allons les remettre en service !"
 POL_MiG_15:0 "Les MiG-15"
 POL_MiG_15_desc:0 "Pour achever le réapprovisionnement et la modernisation de l'armée de l'air polonaise, nous importerons quelques MiG-15 du bloc de l'Est, afin que l'Occident sache qu'il ne faut pas se frotter à notre armée de l'air !"
 POL_Debate_Executive_Powers:0 "Débat sur les pouvoirs exécutifs"
 POL_Debate_Executive_Powers_desc:0 "Les pouvoirs exécutifs sont un sujet brûlant. En général, les gens n'apprécient pas leur mise en œuvre, car cela contourne les aspects démocratiques du socialisme et confère tous les pouvoirs à une seule personne. Nous inclurons une section à ce sujet dans notre constitution, mais les pouvoirs exécutifs ne pourront être mis en œuvre qu'en cas d'urgence extrême."
 POL_Seek_Soviet_Apporval:0 "Obtenir l'approbation soviétique"
 POL_Seek_Soviet_Apporval_desc:0 "Une fois notre projet de Constitution terminé, nous demanderons à l'Union soviétique de s'assurer qu'aucune partie de celui-ci ne risque d'offenser les dirigeants."
 POL_Enact_the_Constitution:0 "Promulguer la Constitution"
 POL_Enact_the_Constitution_desc:0 "N'ayant reçu aucune plainte de la part des Soviétiques, nous pouvons désormais promulguer notre Constitution socialiste et enfin remplacer l'ancienne Constitution, achevant ainsi la soviétisation tant attendue de la Pologne !"
 POL_Dockyards_in_Gdansk:0 "Chantiers navals à Gdansk"
 POL_Dockyards_in_Gdansk_desc:0 "Gdansk nous est revenue détruite après la guerre, et c'est à nous de lui redonner sa gloire d'antan. Il n'y a pas de meilleur moyen pour une ville côtière de se développer que l'industrie navale, dont l'expansion devrait être notre priorité absolue."
 POL_The_Fourth_Congress_of_the_PPR:0 "Le quatrième congrès du PPR"
 POL_The_Fourth_Congress_of_the_PPR_desc:0 "Avec la mort de Staline et la réforme des positions du parti, nous tiendrons le quatrième congrès du PPR, qui décidera de l'orientation future de notre parti."
 POL_The_Death_of_Bierut:0 "La mort de Bierut"
 POL_The_Death_of_Bierut_desc:0 "Malheureusement, après avoir souffert d'une mauvaise santé depuis le 20e congrès du PCUS, le secrétaire général Bierut est décédé dans un hôpital de Moscou. Il s'agit d'une tragédie soudaine et malheureuse. Des funérailles seront organisées dès que possible et un deuil national a été décrété dans tout le pays."
 POL_Embrace_Destalinization:0 "Adopter la déstalinisation"
 POL_Embrace_Destalinization_desc:0 "Avec Ochab comme secrétaire général, il a été annoncé que nous adopterions les politiques de déstalinisation qui se sont répandues dans tout le bloc de l'Est après la mort de Staline."
 POL_Reduce_Press_Censorship:0 "Réduire la censure de la presse"
 POL_Reduce_Press_Censorship_desc:0 "Dans le cadre des efforts de libéralisation d'Ochab, il a été décidé de réduire la censure de la presse afin de donner aux travailleurs une voix plus forte dans les affaires gouvernementales."
 POL_Mass_Amnesty:0 "Amnistie générale"
 POL_Mass_Amnesty_desc:0 "Il y a encore beaucoup d'ennemis politiques emprisonnés qui ont été arrêtés pendant le régime stalinien. Nous allons examiner le cas de ces ennemis politiques. Ceux qui n'ont commis aucun crime grave seront libérés."
 POL_Curtail_the_Secret_Police:0 "Réduire les pouvoirs de la police secrète"
 POL_Curtail_the_Secret_Police_desc:0 "Les services secrets ont eu trop longtemps carte blanche. Ils ont mené des opérations brutales sous le gouvernement Bierut. Nous allons les restreindre et les mettre au pas. Ceux qui refuseront de suivre les nouvelles directives seront suspendus et démis de leurs fonctions."
 POL_Empower_the_Sejm:0 "Renforcer les pouvoirs du Sejm"
 POL_Empower_the_Sejm_desc:0 "Afin de libéraliser davantage le gouvernement, nous renforcerons les pouvoirs de l'assemblée législative, le Sejm. Cela permettra une approche plus démocratique des futures lois et politiques, car celles-ci devront d'abord être débattues au Sejm !"
 POL_The_Poznan_Uprising:0 "Le soulèvement de Poznan"
 POL_The_Poznan_Uprising_desc:0 "Une révolte de grande ampleur a éclaté dans la ville de Poznan. Nous ne connaissons pas tous les détails, mais selon nos renseignements, plus de 100 000 personnes se sont rassemblées et protestent contre notre régime. L'armée et les forces de sécurité ont été informées et ont reçu l'ordre de contenir les manifestants. Si la situation dégénère, l'usage de la force meurtrière est autorisé."
 POL_Polish_October:0 "Octobre polonais"
 POL_Polish_October_desc:0 "Pour la République populaire de Pologne, 1956 fut une année de transition. La situation internationale affaiblit considérablement la faction stalinienne radicale en Pologne, en particulier après la mort du leader communiste polonais Boleslaw Bierut en mars. Trois ans s'étaient écoulés depuis la mort de Joseph Staline. Les manifestations des ouvriers de Poznan en juin avaient mis en évidence le mécontentement de la population face à la situation. En octobre, ces événements ont entraîné une montée en popularité de la faction réformiste, dirigée par Wladyslaw Gomulka."
 POL_The_Gomulka_Thaw:0 "Le dégel de Gomulka"
 POL_The_Gomulka_Thaw_desc:0 "Il a été décidé que Gomulka, désormais libre après avoir été emprisonné par Bierut, deviendrait le nouveau secrétaire général. Considéré comme un modéré, il était le meilleur choix sur lequel les partisans de la ligne dure et les réformateurs pouvaient s'accorder."
 POL_First_Secretary_Zawadzki:0 "Premier secrétaire Zawadzki"
 POL_First_Secretary_Zawadzki_desc:0 "Alexander Zawadzki a réussi à vaincre son ennemi Gomulka et à s'assurer le leadership de la Pologne. Zawadzki est très différent de son adversaire Gomulka. Alors que Gomulka est une personnalité plus modérée, Zawadzki est un communiste pro-soviétique convaincu. Il prévoit d'aligner davantage la nation sur l'Union soviétique tout en adaptant la culture soviétique à la culture polonaise."
 POL_Dismiss_Rokossovsky:0 "Renvoyer Rokossovsky"
 POL_Dismiss_Rokossovsky_desc:0 "Rokossovsky, un général soviétique stationné en Pologne, a violemment réprimé le soulèvement de Poznan. Gomulka a décidé de le démettre de ses fonctions et de le renvoyer en Union soviétique."
 POL_Placate_Soviet_Fears:0 "Apaiser les craintes soviétiques"
 POL_Placate_Soviet_Fears_desc:0 "Les Soviétiques s'inquiètent du fait que, simplement parce que Gomulka est notre secrétaire général, nous allons commencer à nous diviser et laisser les capitalistes prendre le contrôle du pays. Les Soviétiques s'inquiètent trop. Nous allons apaiser leurs craintes et leur garantir que nous n'avons pas l'intention de quitter le Pacte de Varsovie de sitôt."
 POL_Decrease_Church_Persecutions:0 "Réduire les persécutions contre l'Église"
 POL_Decrease_Church_Persecutions_desc:0 "Les persécutions de l'Église menées par le gouvernement précédent étaient brutales et n'avaient d'autre but que de pousser la nation vers l'athéisme. Maintenant que nous sommes au pouvoir, nous allons réduire les persécutions de l'Église."
 POL_Condemn_Nationalist_Rhetoric:0 "Condamner la rhétorique nationaliste"
 POL_Condemn_Nationalist_Rhetoric_desc:0 "Même si le gouvernement Bierut n'a pas fait grand-chose de bien, la répression des nationalistes est l'une des rares exceptions. Les nationalistes, ceux qui, il y a quelques années à peine, ont presque entièrement détruit Varsovie pendant la Seconde Guerre mondiale, sont toujours présents dans notre pays. Nous devons condamner cette idéologie !"
 POL_Allow_Moderate_Electoral_Freedom:0 "Autoriser une liberté électorale modérée"
 POL_Allow_Moderate_Electoral_Freedom_desc:0 "Si nous ne sommes pas sur le point d'instaurer une démocratie totale, nous autoriserons plutôt une liberté électorale modérée, laissant aux travailleurs un choix plus large quant à leurs candidats, tout en conservant notre emprise sur la nation."
 POL_Population_Reperation_Agreement_with_the_Soviets:0 "Accord de réparation démographique avec les Soviétiques"
 POL_Population_Reperation_Agreement_with_the_Soviets_desc:0 "Une grande partie de notre population a beaucoup souffert sous le joug soviétique et allemand. Nous allons donc tenter de conclure un accord de réparation avec les Soviétiques, afin d'inciter la population à retourner dans son ancienne patrie."
 POL_Condemn_Factionalism:0 "Condamner le factionnalisme"
 POL_Condemn_Factionalism_desc:0 "Même si nous avons des divergences avec d'autres membres du Parti, nous devons continuer à coopérer et condamner le sectarisme au sein du Parti. Seule l'unité permettra de véritablement atteindre le paradis socialiste !"
 POL_Cultural_Liberalization:0 "Libéralisation culturelle"
 POL_Cultural_Liberalization_desc:0 "Le gouvernement Bierut a exercé un contrôle assez strict sur la culture polonaise, la restreignant et empêchant les gens de voir tout type de médias occidentaux. Maintenant que les partisans de la ligne dure stalinienne ont disparu, nous pouvons commencer à mettre en œuvre des politiques de libéralisation."
 POL_Expand_Western_Ties:0 "Développer les relations avec l'Occident"
 POL_Expand_Western_Ties_desc:0 "Il ne suffit pas d'avoir des liens avec le bloc de l'Est, nous devons également développer nos relations avec l'Occident, même si cela ne plaît pas forcément aux Soviétiques. En établissant des liens avec l'Occident, nous pourrons également accéder aux marchés occidentaux."
 POL_The_Little_Stabilization:0 "La petite stabilisation"
 POL_The_Little_Stabilization_desc:0 "Nos réformes s'installent lentement chez nos travailleurs, qui les adoptent et profitent de choses qui auraient été impossibles sous Bierut. Notre peuple est satisfait et tout le monde peut constater que le gouvernement est plus libéral, plus ouvert et plus favorable aux souhaits des travailleurs. Cela a permis à la nation de connaître une certaine stabilisation."
 POL_Abandon_Collective_Agriculture:0 "Abandonner l'agriculture collective"
 POL_Abandon_Collective_Agriculture_desc:0 "La politique d'agriculture collective est une politique cruelle envers les travailleurs ruraux et les agriculteurs. Obliger les gens à remplir des quotas et leur retirer les terres qu'ils possèdent depuis des siècles pour que l'État puisse les utiliser n'est pas juste et est tout simplement inacceptable. Nous abandonnerons cette politique et rendrons leurs droits aux agriculteurs."
 POL_Rehabilitate_the_Purged_Members:0 "Réhabiliter les membres purgés"
 POL_Rehabilitate_the_Purged_Members_desc:0 "De nombreux anciens membres, tout comme Gomulka, ont été purgés sur la base d'accusations ridicules, car Bierut craignait qu'il y ait une conspiration contre lui et le reste du Parti communiste. Avec le départ de Bierut, nous allons désormais nous concentrer sur la réhabilitation des membres purgés."
 POL_Reduce_Soviet_Influence:0 "Réduire l'influence soviétique"
 POL_Reduce_Soviet_Influence_desc:0 "Les Soviétiques exercent actuellement un contrôle trop important sur notre nation. Ils influencent tous les aspects de la nation, de la politique à l'armée. Si nous voulons un jour nous libérer de l'emprise soviétique, nous devrons commencer par réduire l'influence des Soviétiques."
 POL_Crush_the_Protests:0 "Écraser les manifestations"
 POL_Crush_the_Protests_desc:0 "Nous ne pouvons pas laisser ces traîtres et ces anti-révolutionnaires semer le chaos dans les rues. Nous écraserons ces traîtres et instaurerons la loi martiale jusqu'à ce que la situation se calme."
 POL_Empower_the_Natolin_Faction:0 "Renforcer la faction Natolin"
 POL_Empower_the_Natolin_Faction_desc:0 "La faction Natolin était une faction au sein de la direction du Parti ouvrier unifié polonais communiste. Formée vers 1956, peu après le 20e congrès du Parti communiste de l'Union soviétique, elle tire son nom du lieu où se tenaient ses réunions, dans une villa gouvernementale à Natolin. La principale opposition aux Natolins était la faction Pulawian, qui réunissait de nombreux membres staliniens du parti d'origine juive. Les Natolins étaient opposés aux programmes de libéralisation post-staliniens (le « dégel ») et proclamaient des slogans nationalistes et antisoviétiques simples dans le cadre d'une stratégie visant à prendre le pouvoir."
 POL_Strengthen_the_State_Security_Apparatus:0 "Renforcer l'appareil sécuritaire de l'État"
 POL_Strengthen_the_State_Security_Apparatus_desc:0 "Il y a encore beaucoup d'ennemis qui rôdent autour de l'État, cachés dans l'ombre, attendant le moment propice pour frapper. Mais nous ne leur en donnerons pas l'occasion ! En renforçant l'appareil de sécurité de l'État, nous les débusquerons tous, sans exception !"
 POL_Reopen_the_Prison_Camps:0 "Réouverture des camps de prisonniers"
 POL_Reopen_the_Prison_Camps_desc:0 "Nos prisons sont remplies d'ennemis de la révolution qui ne font que pourrir en attendant leur sort. Mais ils pourraient plutôt être mis au travail pour racheter leurs fautes. Afin de leur donner cette chance de rédemption, nous rouvrirons les camps pénitentiaires et mettrons en place une politique selon laquelle plus vous travaillerez longtemps, plus votre peine sera raccourcie."
 POL_Launch_Anti_Catholicism_Campaign:0 "Lancer une campagne anti-catholique"
 POL_Launch_Anti_Catholicism_Campaign_desc:0 "Beirut avait dans un premier temps eu la bonne idée de conclure un accord avec l'Église afin de l'empêcher de diffuser sa propagande antisocialiste. Mais cela n'a pas suffi. Au lieu de conclure un nouvel accord avec l'Église, nous allons lancer une campagne anticatoliciste afin de nous débarrasser une fois pour toutes de l'Église et d'instaurer un véritable paradis socialiste athée !"
 POL_Request_Further_Soviet_Economic_Aid:0 "Demander une aide économique supplémentaire à l'Union soviétique"
 POL_Request_Further_Soviet_Economic_Aid_desc:0 "Même si notre industrie est en pleine croissance, cela ne suffit pas. Il nous manque quelque chose. Peut-être que l'une de nos politiques n'est pas correctement appliquée ou que nous utilisons des méthodes obsolètes ? Il existe une solution simple à ce problème. En invitant l'aide économique et les conseillers soviétiques, nous stimulerons notre économie !"
 POL_Expand_the_Ludowe_Wojsko_Polskie:0 "Développer l'Armée populaire polonaise"
 POL_Expand_the_Ludowe_Wojsko_Polskie_desc:0 "Même si nos frontières sont sécurisées, cela ne ferait pas de mal d'agrandir notre Ludowe Wojsko Polskie. Grâce à cet agrandissement, nos frontières seront encore mieux sécurisées. Et si un autre envahisseur tentait de nous envahir, il aurait une mauvaise surprise."
 POL_Deny_the_Katyn_Massacre:0 "Nier le massacre de Katyn"
 POL_Deny_the_Katyn_Massacre_desc:0 "Le massacre de Katyn est une série d'exécutions massives de près de 22 000 officiers militaires et prisonniers de guerre polonais issus de l'intelligentsia, perpétrées par l'Union soviétique, plus précisément par le NKVD (« Commissariat du peuple aux affaires intérieures », la police secrète soviétique) en avril et mai 1940. Bien que des meurtres aient également eu lieu dans les prisons de Kalinine et de Kharkiv et ailleurs, le massacre tire son nom de la forêt de Katyn, où certaines des fosses communes ont été découvertes pour la première fois par les forces allemandes. Le massacre a été initié à la suite d'une proposition du chef du NKVD, Lavrentiy Beria, à Joseph Staline d'exécuter tous les membres captifs du corps des officiers polonais, proposition qui a été approuvée par le Politburo soviétique dirigé par Staline. Sur le nombre total de victimes, environ 8 000 étaient des officiers emprisonnés lors de l'invasion soviétique de la Pologne en 1939, 6 000 autres étaient des policiers et les 8 000 restants étaient des intellectuels polonais que les Soviétiques considéraient comme des agents de renseignement et des gendarmes, des espions et des saboteurs, d'anciens propriétaires terriens, des propriétaires d'usines et des fonctionnaires. La classe des officiers de l'armée polonaise était représentative de l'État polonais multiethnique ; parmi les personnes assassinées figuraient des Polonais, des Ukrainiens, des Biélorusses et des Juifs, dont le grand rabbin de l'armée polonaise, Baruch Steinberg."
 POL_Launch_Anti_Semitic_Campaign:0 "Lancer une campagne antisémite"
 POL_Launch_Anti_Semitic_Campaign_desc:0 "De l'antisémitisme ? En Pologne ? Sous un régime socialiste ? Non. Jamais. Fausses informations."
 POL_Increase_Trade_within_the_East_Bloc:0 "Accroître les échanges commerciaux au sein du bloc de l'Est"
 POL_Increase_Trade_within_the_East_Bloc_desc:0 "Nous n'avons pas besoin des marchés occidentaux répugnants. Nous n'avons besoin que de nos camarades du bloc de l'Est et de l'Union soviétique. Le commerce avec d'autres nations socialistes suffira amplement à obtenir tous les matériaux dont notre nation a besoin !"
 POL_Emulate_Soviet_Culture:0 "Imiter la culture soviétique"
 POL_Emulate_Soviet_Culture_desc:0 "Zawadzki aime depuis longtemps la culture soviétique. Même avant de devenir secrétaire général. Mais maintenant qu'il est à la tête de la nation, il peut réellement mettre ses plans à exécution et commencer à instaurer la culture socialiste et soviétique, en en faisant le cœur de la Pologne socialiste."
 POL_Purge_the_Pulawowanie:0 "Purge des Pulawianie"
 POL_Purge_the_Pulawowanie_desc:0 "Pulawianie était le nom informel donné à l'un des deux groupes de communistes rivaux dans la politique d'après-guerre de la Pologne stalinienne, qui se disputaient le pouvoir au sein de la direction du Parti ouvrier unifié polonais au printemps 1956, après la mort de Bierut. Ils étaient connus sous le nom de réformistes pendant le processus de déstalinisation de la Pologne."
 POL_Arrest_Gomulka_Oncemore:0 "Arrêter Gomulka une fois de plus"
 POL_Arrest_Gomulka_Oncemore_desc:0 "Céder à la pression des manifestants et libérer Gomulka était une erreur. Nous allons l'arrêter une nouvelle fois, cette fois pour de bon. Avec Gomulka hors course, Zawadzki aura assuré sa position de secrétaire général, sans plus de luttes politiques internes."
 POL_Release_Gomulka:0 "Libérer Gomulka"
 POL_Release_Gomulka_desc:0 "Les Demonstarters exigent que nous libérions immédiatement Gomulka, affirmant que nous l'avons accusé à tort et qu'il est innocent. En temps normal, nous ignorerions cette demande. Mais vu la situation actuelle, la moindre étincelle pourrait déclencher une révolution qui nous coûterait le pouvoir."
 POL_Resist_Comecon_Demands:0 "Résister aux exigences du Comecon"
 POL_Resist_Comecon_Demands_desc:0 "Une autre revendication des Demonstarters est de rejeter les exigences du COMECON soviétique. Même si nous ne voulons pas nuire à nos relations avec les Soviétiques, cela devra être accepté. Sinon, les grévistes pourraient formuler des revendications plus sévères."
 POL_Synthetic_Fiber_of_Gorzaw:0 "Fibre synthétique de Gorzow"
 POL_Synthetic_Fiber_of_Gorzaw_desc:0 "Gorzow est l'un des rares endroits en Pologne où l'on produit des fibres synthétiques. Afin de répondre aux demandes des travailleurs, nous allons ouvrir davantage d'usines de fibres synthétiques !"
 POL_Sily_Powietrzne:0 "Forces aériennes"
 POL_Sily_Powietrzne_desc:0 "Notre armée de l'air est un peu à court depuis la Seconde Guerre mondiale. Beaucoup de nos avions ont été envoyés en Roumanie ou capturés par les Allemands. Nous avons obtenu quelques modèles plus récents de la part des Soviétiques, mais cela ne suffira pas. La Pologne a besoin d'une armée de l'air digne de ce nom !"