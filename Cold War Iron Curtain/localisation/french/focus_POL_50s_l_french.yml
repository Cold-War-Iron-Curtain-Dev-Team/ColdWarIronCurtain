l_french:
 PolandRel.2.d:0 "Le professeur et cardinal Stefan Wyszynski a été récemment arrêté à la suite d'une répression contre plusieurs éléments de la société polonaise et est désormais emprisonné à Rywald ; le gouvernement polonais invoque un comportement de trahison pour expliquer la vague d'arrestations en cours, suivie de procès et d'emprisonnements de masse. Il avait récemment été élevé au rang de cardinal prêtre par le pape et était un fervent travailleur social. Il a aidé plusieurs Juifs pendant l'occupation nazie de la Pologne, avant de diriger un projet de restauration à Wloclawek après la guerre. Beaucoup considèrent cette arrestation comme une grave injustice envers l'Église et le peuple polonais lui-même."

 POL_The_Sovietization_of_Poland:0 "La soviétisation de la Pologne"
 POL_The_Sovietization_of_Poland_desc:0 "Après la libération de l'emprise fasciste, nous nous retrouvons désormais aux commandes de la Pologne. Malheureusement, cela ne signifie pas que nous aurons du mal à gouverner la nation. Beaucoup ne sont pas contents qu'un parti socialiste soit aux commandes, sans parler de devoir répondre aux Soviétiques en les considérant comme nos suzerains. La situation est désastreuse mais nous devons faire de notre mieux pour l'améliorer au mieux de nos capacités."
 POL_Begin_the_6_Year_Plan:0 "Commencer le plan de 6 ans"
 POL_Begin_the_6_Year_Plan_desc:0 "Maintenant que nous avons terminé la reconstruction de l'industrie détruite, nous pouvons lancer le premier plan sexennal. Semblable au plan quinquennal soviétique, nous nous concentrerons sur l'expansion de l'industrie, en traitant de l'inflation, de la pénurie alimentaire et du logement."
 POL_Continue_the_3_Year_Plan:0 "Poursuivre le plan de 3 ans"
 POL_Continue_the_3_Year_Plan_desc:0 "Tout comme l'Allemagne de l'Est, nous devons lancer un plan triennal pour réparer d'abord notre industrie détruite avant de nous concentrer sur l'expansion de notre industrie existante. Sans parler de terminer la migration vers nos nouvelles terres conquises par les Allemands."
 POL_Ludowe_Wojsko_Polskie:0 "Ludowe Wojsko Polskie"
 POL_Ludowe_Wojsko_Polskie_desc:0 "L'Armée populaire polonaise est le résultat des efforts de Joseph Staline. Formé en 1943, il a été fondé dans les régions orientales de la Pologne pendant l'occupation soviétique, au sein d'une force unique avant d'être divisé en deux armées. Les nombreux vétérans de la Seconde Guerre mondiale vont nous aider à transformer nos forces armées en une force avec laquelle il faut compter !"
 POL_The_Death_of_Stalin:0 "La mort de Staline"
 POL_The_Death_of_Stalin_desc:0 "Avec la mort de l'Homme d'Acier lui-même, notre avenir est encore inconnu. Une chose est sûre cependant. Avec la mort de Staline, nous serons en mesure de desserrer l'emprise sur le Parti des partisans de la ligne dure et de commencer à libéraliser le parti !"
 POL_Secretary_Ochab:0 "Secrétaire Ochab"
 POL_Secretary_Ochab_desc:0 "Avec le décès soudain du secrétaire général Bierut, nous placerons temporairement Ochab à la tête de l'État, jusqu'à ce que nous puissions déterminer qui serait un digne successeur de Bierut."
 POL_Create_the_ZSL:0 "Créer le ZSL"
 POL_Create_the_ZSL_desc:0 "Le Parti populaire uni est né de la fusion de deux petits partis communistes. Le parti est basé sur l'agrarisme et le socialisme agraire. Il n'est pas encore public qu'ils ne soient pas complètement indépendants. Une sorte de parti satellite, dont la tâche est de représenter les travailleurs ruraux de Pologne."
 POL_Michejda_Support:0 "Assistance Michejda"
 POL_Michejda_Support_desc:0 "Pour donner davantage de légitimité à la ZSL récemment créée, nous avons reçu les éloges et l'approbation du célèbre médecin et homme politique polonais Tadeusz Michejda. Il a salué l'accent mis par le parti sur les travailleurs ruraux, qui, selon ses propres mots, sont souvent négligés dans une Pologne de plus en plus urbaine."
 POL_PAX_Association:0 "Association PAX"
 POL_PAX_Association_desc:0 "L'Association PAX est une organisation catholique pro-communiste créée en 1947. Elle publie quotidiennement le journal Slowo Powszechne. Mais sa tâche secondaire consiste également à saper le soutien populaire à l'Église catholique romaine."
 POL_A_Peoples_Democracy:0 "Une démocratie populaire"
 POL_A_Peoples_Democracy_desc:0 "Même si nous sommes socialistes de base, nous voulons quand même donner la parole aux travailleurs. Avec la création du ZSL, nous donnerons la possibilité de voter au niveau régional soit pour le PZPR, soit pour le PZL, laissant les travailleurs eux-mêmes décider qui serait le plus adapté à la région."
 POL_Imprison_Cardinal_Stefan_Wyszynski:0 "Emprisonner le cardinal Stefan Wyszynski"
 POL_Imprison_Cardinal_Stefan_Wyszynski_desc:0 "Le cardinal Stefan Wyszynski est depuis longtemps une épine dans notre pied. Alors que d'autres parties de l'Église se sont alignées sur notre doctrine socialiste, Stefan est un critique très connu de notre répression, étant un symbole de l'Église qui lutte contre notre répression. Nous devons l'enfermer et le faire taire."
 POL_Begin_the_Purge:0 "Commencer la purge"
 POL_Begin_the_Purge_desc:0 "Malheureusement, il y a encore de nombreux collaborateurs de guerre, ennemis de la classe ouvrière et de l'État dans les rues, qui complotent chaque jour pour renverser notre régime socialiste. Nous ne pouvons pas laisser les ennemis et les traîtres mettre la nation en danger. C'est pourquoi nous allons commencer une dure purge, pour éliminer chaque traître et ennemi de la classe ouvrière !"
 POL_Eliminate_the_Nationalists:0 "Éliminer les nationalistes"
 POL_Eliminate_the_Nationalists_desc:0 "La menace la plus grande et la plus urgente à laquelle nous devons faire face sont les nationalistes. On pourrait penser qu'après les horreurs commises par les nazis en Pologne, personne ne serait assez fou pour suivre leur idéologie. Et pourtant nous y sommes. Sans aucun doute, nous réprimerons aussi durement que possible cette racaille."
 POL_Imprison_Gomulka:0 "Emprisonner Gomulka"
 POL_Imprison_Gomulka_desc:0 "Il y a longtemps que Boleslaw et Gomulka se livrent une lutte de pouvoir. Eh bien, cette lutte pour le pouvoir semble avoir pris fin maintenant, puisque Bierut a emprisonné Gomulka, l'accusant de déviation de droite. La durée de la peine de prison n'est pas encore déterminée."
 POL_Suspend_the_Purges:0 "Suspendre les purges"
 POL_Suspend_the_Purges_desc:0 "Avec Gomulka emprisonné, la plupart des ennemis enfermés ou purgés et les nationalistes réprimés, nous pouvons désormais arrêter la purge. Mais nous continuerons à surveiller de près ceux qui ont été épargnés par la Purge, au cas où ils tenteraient de se réorganiser ou de recruter de nouveaux membres pour atteindre leurs objectifs traîtres."
 POL_Reform_the_Party_Positions:0 "Réformer les positions du parti"
 POL_Reform_the_Party_Positions_desc:0 "Avec le départ de Staline, nous pouvons enfin commencer à éliminer les staliniens radicaux de notre gouvernement et à les remplacer par des modérés et des réformistes qui ne tenteront pas de faire taire nos futures lois et politiques."
 POL_Patriot_Priests:0 "Prêtres patriotes"
 POL_Patriot_Priests_desc:0 "Contrairement à d'autres États socialistes, le clergé de notre pays est étonnamment disposé à coopérer avec nous. Nous avons ainsi lancé un programme qui finance les soi-disant prêtres patriotes, qui promeuvent le christianisme avec des valeurs socialistes !"
 POL_Merge_Combatant_Organizations:0 "Fusionner les organisations combattantes"
 POL_Merge_Combatant_Organizations_desc:0 "Sans surprise, il existe de nombreuses organisations paramilitaires dans notre pays, réparties dans tout le pays et désorganisées. Pour augmenter l'efficacité et entraîner correctement ces combattants, nous les fusionnerons tous en un seul."
 POL_Merge_the_Trade_Unions:0 "Fusionner les syndicats"
 POL_Merge_the_Trade_Unions_desc:0 "Tout comme les organisations combattantes, les syndicats sont répartis dans toute la Pologne et communiquent rarement, voire pas du tout, entre eux. En saisissant les syndicats d'État et en les transformant en syndicats d'État, il sera plus facile d'écouter les souhaits et les problèmes des travailleurs !"
 POL_Church_State_Agreement:0 "Accord Église-État"
 POL_Church_State_Agreement_desc:0 "Le gouvernement a contacté les Églises catholiques de Pologne et a proposé un accord. Tant qu'ils s'abstiennent de propager l'antisocialisme, nous adoucirons notre répression contre le clergé"
 POL_Begin_Drafting_the_Constitution:0 "Commencer à rédiger la Constitution"
 POL_Begin_Drafting_the_Constitution_desc:0 "Les premières étapes de la soviétisation ont été un grand succès. Il ne reste plus qu'à commencer à rédiger une Constitution socialiste, puisque nous utilisons toujours la Constitution de l'ancien gouvernement polonais."
 POL_An_Ideological_Judiciary:0 "Un système judiciaire idéologique"
 POL_An_Ideological_Judiciary_desc:0 "Après de nombreuses discussions, il a été décidé de créer un système judiciaire idéologique. Non seulement il supervisera la rédaction de la Constitution, mais il fera également office de Cour suprême, traitant d'affaires très importantes et assurant la sécurité de l'État."
 POL_Legislative_Powers:0 "Pouvoirs législatifs"
 POL_Legislative_Powers_desc:0 "L'ancienne Constitution donnait trop de liberté aux provinces. L'ancien gouvernement préférait une décantralisation du pays. Avec cette Constitution, cela changera, car nous inclurons les pouvoirs législatifs dans la nouvelle Constitution, ce qui donnera plus de pouvoir à l'État et réduira l'indépendance de chaque province, centralisant ainsi le gouvernement."
 POL_Jaworzno_Electric_Plant:0 "Centrale électrique de Jaworzno"
 POL_Jaworzno_Electric_Plant_desc:0 "La centrale électrique à combustible fossile que nous prévoyons de construire à Katowickie est l'une de nos principales priorités. Avec nos projets visant à développer notre industrie à grande échelle, nous aurons besoin d'autant d'énergie électrique que possible."
 POL_Chemical_Institutes_in_West:0 "Instituts de chimie à Ouest"
 POL_Chemical_Institutes_in_West_desc:0 "L'un des domaines industriels les plus importants est l'industrie chimique, qui crée toutes sortes de produits chimiques à usage industriel ou personnel. C'est aussi une bonne pierre de départ pour la première expansion de l'industrie polonaise."
 POL_Chemical_Institutes_in_Silesia:0 "Instituts de chimie en Silésie"
 POL_Chemical_Institutes_in_Silesia_desc:0 "En développant l'industrie à l'Ouest, nous devrions également développer l'industrie chimique dans d'autres régions de la Pologne. Cette fois nous avons choisi la Silésie, la province proche de la frontière tchécoslovaque. Cela nous sera utile si nous parvenons à conclure un accord et à vendre certains de nos produits chimiques à la Tchécoslovaquie."
 POL_Invest_in_Agriculture:0 "Investir dans l'agriculture"
 POL_Invest_in_Agriculture_desc:0 "Nous avons le choix de choisir si, dans ce plan sexennal, nous devons investir dans l'agriculture ou l'industrie. Nous avons décidé qu'il serait plus avantageux d'investir dans l'agriculture. De cette façon, nous pouvons garantir que l'économie se redresse davantage tout en veillant à ce qu'il y ait suffisamment de nourriture pour les travailleurs !"
 POL_Invest_in_Industry:0 "Investir dans l'industrie"
 POL_Invest_in_Industry_desc:0 "Au lieu de nous concentrer sur l'agriculture, nous devrions nous concentrer sur le développement de nos parcs industriels, en garantissant des emplois à notre population. Avec des emplois plus ouverts, nous veillerons à ce que tout le monde puisse avoir un emploi et ne devienne pas sans abri ou mendiant dans la rue !"
 POL_Complete_the_Migrations:0 "Terminez les migrations"
 POL_Complete_the_Migrations_desc:0 "Après avoir conquis de nouveaux territoires sur les Allemands, nous établirons un programme visant à accroître la migration des Polonais ethniques de cette région qui ont été contraints de fuir le régime nazi et la Seconde Guerre mondiale en général."
 POL_The_Opening_of_W-Z:0 "L'ouverture de W-Z"
 POL_The_Opening_of_W-Z_desc:0 "Le W-Z sera ouvert, sa tâche étant la coordination de la planification industrielle et de la production des outils nécessaires dans les usines et sur les chantiers de construction."
 POL_Currency_Reform:0 "Réforme monétaire"
 POL_Currency_Reform_desc:0 "Depuis un certain temps déjà, nous souffrons d'une inflation élevée. Ce qui, sans surprise, n'est pas le meilleur pour notre État et pour le travailleur ordinaire. En raison de l'inflation, les travailleurs ne peuvent pas acheter beaucoup de biens, tant les prix sont élevés. Pour résoudre ce problème, nous publierons une politique de réforme monétaire pour résoudre le problème de l'inflation."
 POL_Reitroduce_Ration_Stamps:0 "Réintroduire les timbres de rationnement"
 POL_Reitroduce_Ration_Stamps_desc:0 "Face à l'inflation, un autre problème est apparu. Une famine. Nous devons agir rapidement avant que la famine ne s'aggrave. Au lieu d'acheter de la nourriture aux voisins, nous allons réintroduire les bons d'alimentation et construire une ferme supplémentaire pour aider à faire face à la situation alimentaire."
 POL_Increase_Civilian_Production:0 "Augmenter la production civile"
 POL_Increase_Civilian_Production_desc:0 "Pendant la guerre, de nombreuses industries civiles importantes produisaient une grande variété d'articles, tels que des biens de consommation. Pour garantir que suffisamment de biens de consommation soient produits et que notre économie continue de croître, nous reconstruirons ces usines et leur redonnerons leur plein fonctionnement."
 POL_Przodownik_Pracy:0 "Pracy Przodownik"
 POL_Przodownik_Pracy_desc:0 "Les Shock Worker en anglais sont des travailleurs hautement productifs et super enthousiastes qui consacrent leur vie à la cause socialiste. Ces travailleurs sont régulièrement promus dans tout le bloc de l'Est, pour motiver et permettre au reste de la main-d'oeuvre d'apprendre de ces travailleurs de choc, peut-être qu'un jour ils deviendront comme eux !"
 POL_Complete_the_3_Year_Plan:0 "Terminez le plan de 3 ans"
 POL_Complete_the_3_Year_Plan_desc:0 "Notre travail acharné a payé ! Les industries détruites sont à nouveau en plein essor, notre économie croît à nouveau et nous pouvons enfin achever la reconstruction ainsi que le plan de la troisième année."
 POL_Import_Food:0 "Importer des aliments"
 POL_Import_Food_desc:0 "Nous sommes au milieu d'une famine et même si nous préférons rationner la nourriture, cela ne sera pas bien accueilli par les travailleurs. Au lieu de cela, nous importerons de la nourriture de l'Union soviétique et d'autres pays du bloc de l'Est"
 POL_Increase_Prices:0 "Augmenter les prix"
 POL_Increase_Prices_desc:0 "La famine commence lentement à s'atténuer, nous devons faire en sorte que cela ne se reproduise plus. L'augmentation des prix des produits contribuera à augmenter les revenus des agriculteurs et des entreprises, leur permettant de réaliser plus de bénéfices et de les investir dans leurs magasins et leurs fermes."
 POL_Wistula_Dam:0 "Barrage de la Wistule"
 POL_Wistula_Dam_desc:0 "Varsovie, après avoir été presque entièrement détruite par les Allemands pendant la Seconde Guerre mondiale, se reconstruit lentement. Avec la reconstruction et l'agrandissement de Varsovie, nous construirons le barrage de Wistula pour garantir que l'électricité continue d'affluer dans la ville et lui fournir de l'énergie verte et propre !"
 POL_Invest_in_Heavy_Industry:0 "Investir dans l'industrie lourde"
 POL_Invest_in_Heavy_Industry_des:0 "Tandis que nous investissons dans l'industrie légère et les parcs industriels, nous ne pouvons pas oublier notre industrie lourde qui produit, entre autres, de nombreuses armes de notre pays. Investir également dans ce secteur stimulera encore davantage notre développement industriel !"
 POL_Expand_Bieruts_Mill:0 "Agrandissez le moulin de Bierut"
 POL_Expand_Bieruts_Mill_desc:0 "Le Moulin de Bierut, du nom de notre camarade Secrétaire Général, est un quartier de fonderie situé à Varsovie. Il porte son nom en guise de remerciement pour avoir soutenu les travailleurs et amené la révolution socialiste en Pologne."
 POL_Lenins_Mill:0 "Le moulin de Lénine"
 POL_Lenins_Mill_desc:0 "Tout comme le moulin de Bierut, il est tout à fait naturel que nous ayons également un moulin nommé d'après le héros de la révolution socialiste Vladimir Lénine. Même si nous avons eu des conflits dans le passé, nous sommes désormais des frères et camarades socialistes. Mais contrairement au moulin de Bierut, le moulin Lénine sera construit à Gdansk !"
 POL_Stalins_Mill:0 "Moulin de Staline"
 POL_Stalins_Mill_desc:0 "Pour compléter la trilogie, nous avons également nommé un moulin en l'honneur de l'homme d'acier lui-même, Joseph Staline. Son moulin sera à l'image du moulin Lénine construit à Gdansk. Moulins Bieruts, Lénine et Staline. Les héros du socialisme qui contribuent chaque jour à développer la révolution socialiste !"
 POL_Uranium_Mines:0 "Mines d'uranium"
 POL_Uranium_Mines_desc:0 "En élargissant les frontières de la ville de Varsovie et en creusant des trous pour préparer les fondations des immeubles, de l'uranium a été découvert ! Évidemment, nous ne pouvons pas construire de maisons sur un gisement d'uranium, nous allons donc construire une mine d'uranium. Qui sait quand cela sera utile ?"
 POL_Marynarka_Wojenna:0 "Marynarka Wojenna"
 POL_Marynarka_Wojenna_desc:0 "Les forces navales de Pologne. Même si notre nation n'est généralement pas connue pour ses nombreuses batailles et réalisations navales, cela ne veut pas dire qu'elle est obsolète ! Nos forces navales qui protègent nos côtes et ont combattu âprement aux côtés de la flotte allemande pendant la Seconde Guerre mondiale constituent un élément essentiel de notre armée !"
 POL_Coastal_Defenses:0 "Défenses côtières"
 POL_Coastal_Defenses_desc:0 "Même si nous sommes actuellement protégés par la marine soviétique, ce ne sera probablement pas toujours le cas. Ainsi, nous commencerons la construction de défenses côtières au cas où de futurs ennemis tenteraient de nous envahir depuis la mer !"
 POL_Expand_the_Mining_Sector:0 "Développer le secteur minier"
 POL_Expand_the_Mining_Sector_desc:0 "Le secteur minier a toujours été un secteur industriel important. Son expansion ne nous sera bénéfique qu'à long terme."
 POL_Nowa_Huta:0 "Nowa Huta"
 POL_Nowa_Huta_desc:0 "Nowa Huta sera un exemple de ce à quoi ressemblera le logement dans l'utopie socialiste qu'est la Pologne. Mais pour l'instant, Nowa Huta sera un quartier socréaliste créé uniquement à des fins de propagande"
 POL_Expand_the_Polish_Marines:0 "Développez les marines polonaises"
 POL_Expand_the_Polish_Marines_desc:0 "La Marine polonaise. Ils ne sont pas utilisés très souvent, car nous n'avons pas vraiment besoin d'opérations spéciales navales, mais nous les conserverons et y investirons un peu. Ils pourraient être utiles à un moment donné dans le futur."
 POL_Naval_Modernization:0 "Modernisation navale"
 POL_Naval_Modernization_desc:0 "Un littoral plus grand nécessite une flotte plus grande, et pourtant notre marine est sous-équipée pour son travail. La Baltique est une petite mer, la voie à suivre devrait donc être de se concentrer sur des navires de guerre modernes de la taille d'un destroyer"
 POL_Invest_in_Gdansk_Shipyards:0 "Investissez dans les chantiers navals de Gdansk"
 POL_Invest_in_Gdansk_Shipyards_desc:0 "Les projets ambitieux d'avant-guerre visant à construire des navires de guerre dans des installations locales ont été brutalement interrompus par l'invasion allemande. Cependant, nous disposons désormais de tous les moyens nécessaires pour atteindre cet objectif et Gdansk, enfin récupérée, sera le point de départ idéal pour l'industrie navale polonaise."
 POL_Wojska_Ladowe:0 "Wojska Ladowe"
 POL_Wojska_Ladowe_desc:0 "La Wojska Ladowe est notre force terrestre. Composés de nombreux vétérans de la Seconde Guerre mondiale, des partisans aux anciens soldats et généraux de l'armée, ils constituent l'épine dorsale de notre nation, protégeant les frontières de notre État désormais socialiste."
 POL_Adopt_the_AK_47:0 "Adoptez l'AK-47"
 POL_Adopt_the_AK_47_desc:0 "L'AK-47 développé en Union soviétique est une conception supérieure à tout ce que l'Occident avait à offrir jusqu'à présent. Il a été conseillé que nous adoptions également cette arme, en commençant immédiatement la production dans nos usines."
 POL_Reform_the_Officer_Corps:0 "Réformer le corps des officiers"
 POL_Reform_the_Officer_Corps_desc:0 "Notre corps d'officiers généraux actuel n'est pas aussi organisé que nous le souhaiterions. Ils n'ont aucune sorte de chef de corps et les différents officiers exécutent les plans sans communiquer avec les autres. Avec notre réforme, nous créerons un grand état-major militaire."
 POL_Import_the_T55:0 "Importez le T-55"
 POL_Import_the_T55_desc:0 "Nos réserves de chars ne semblent pas brillantes. Beaucoup d'entre eux sont constitués de chars d'avant-guerre et d'après-guerre. Pour renforcer et moderniser le stock, nous importerons un tas de chars soviétiques T-55 du bloc de l'Est"
 POL_Embrace_Soviet_Doctrine:0 "Adoptez la doctrine soviétique"
 POL_Embrace_Soviet_Doctrine_desc:0 "Les offensives de 1944 et 1945 menées par l'Armée rouge ont prouvé la qualité de leur tactique. Si nous devons combattre côte à côte, une étape logique serait d'adopter des philosophies de champ de bataille similaires"
 POL_Yak_17s:0 "Combattants soviétiques excédentaires"
 POL_Yak_17s_desc:0 "Les Soviétiques ont un groupe de combattants excédentaires autour de notre nation. Nous sommes sûrs que cela ne les dérangera pas si nous les prenons et les utilisons pour renforcer notre propre Force aérienne"
 POL_Expand_Anti_Air_Defenses:0 "Développer les défenses anti-aériennes"
 POL_Expand_Anti_Air_Defenses_desc:0 "Personne ne souhaite revivre les cauchemars de 1939, lorsque les bombes allemandes détruisirent nos villes. Nous devons investir dans nos défenses anti-aériennes stationnaires, afin que chaque ville devienne à l'avenir un piège mortel pour les bombardiers ennemis"
 POL_Yak_23s:0 "Yak-23"
 POL_Yak_23s_desc:0 "Les Yak-23 sont nos propres premiers chasseurs à réaction que nous avons développés pendant l'occupation soviétique. Nous en avons encore un certain nombre dans nos hangars qui ramassent la poussière. Au lieu de les laisser rouiller, nous les remettons en service !"
 POL_MiG_15:0 "MiG-15"
 POL_MiG_15_desc:0 "Pour terminer notre réapprovisionnement et la modernisation de l'armée de l'air polonaise, nous importerons des MiG-15 du bloc de l'Est, en veillant à ce que l'Occident sache que notre armée de l'air ne doit pas être gâchée !"
 POL_Debate_Executive_Powers:0 "Débattre des pouvoirs exécutifs"
 POL_Debate_Executive_Powers_desc:0 "Les pouvoirs exécutifs sont un sujet brûlant. Les gens n'aiment généralement pas leur promulgation, car cela contourne les aspects démocratiques du socialisme et donne tout le pouvoir à une seule personne. Nous inclurons une section à ce sujet dans notre constitution, mais les pouvoirs exécutifs ne pourront être promulgués que dans des situations d'urgence très graves."
 POL_Seek_Soviet_Apporval:0 "Rechercher l'approbation soviétique"
 POL_Seek_Soviet_Apporval_desc:0 "Une fois notre projet de Constitution terminé, nous demanderons à l'Union soviétique de s'assurer qu'il n'y a aucune partie de celui-ci qui pourrait offenser les dirigeants"
 POL_Enact_the_Constitution:0 "Adopter la Constitution"
 POL_Enact_the_Constitution_desc:0 "N'ayant reçu aucune plainte des Soviétiques, nous pouvons maintenant promulguer notre Constitution socialiste et enfin remplacer l'ancienne Constitution, mettant ainsi fin à la soviétisation tant attendue de la Pologne !"
 POL_Dockyards_in_Gdansk:0 "Chantiers navals à Gdansk"
 POL_Dockyards_in_Gdansk_desc:0 "Gdansk nous est revenue détruite après la guerre, et c'est à nous de lui redonner sa gloire d'antan. Il n'y a pas de meilleur moyen de développement pour une ville côtière que la construction navale, dont le développement devrait être notre principale priorité"
 POL_The_Fourth_Congress_of_the_PPR:0 "Le IVe Congrès du PPR"
 POL_The_Fourth_Congress_of_the_PPR_desc:0 "Avec la mort de Staline et la réforme des positions du parti, nous organiserons le IVe Congrès du PPR, qui décidera de l'orientation future de notre parti."
 POL_The_Death_of_Bierut:0 "La mort de Bierut"
 POL_The_Death_of_Bierut_desc:0 "Malheureusement, après avoir souffert de mauvaises conditions de santé après le 20e Congrès du PCUS, le secrétaire général Bierut est décédé dans un hôpital de Moscou. C'est une tragédie malheureuse et soudaine. Des funérailles seront planifiées le plus rapidement possible et une heure de deuil a été annoncée dans tout le pays."
 POL_Embrace_Destalinization:0 "Adoptez la déstalinisation"
 POL_Embrace_Destalinization_desc:0 "Avec Ochab comme secrétaire général, il a été annoncé que nous adopterions les politiques de déstalinisation qui se sont propagées à travers le bloc de l'Est après la mort de Staline."
 POL_Reduce_Press_Censorship:0 "Réduire la censure de la presse"
 POL_Reduce_Press_Censorship_desc:0 "Dans le cadre des efforts de libéralisation d'Ochab, il a été décidé de réduire la censure de la presse, afin de donner aux travailleurs une voix plus forte dans les affaires gouvernementales"
 POL_Mass_Amnesty:0 "Amnistie de masse"
 POL_Mass_Amnesty_desc:0 "De nombreux ennemis politiques ont été arrêtés sous le régime stalinien. Nous passerons en revue ces ennemis politiques. Ceux qui n'ont commis aucun crime grave seront libérés."
 POL_Curtail_the_Secret_Police:0 "Réduire la police secrète"
 POL_Curtail_the_Secret_Police_desc:0 "Les services secrets ont eu trop longtemps les mains libres. Ils ont été brutaux dans leurs opérations sous le gouvernement de Bierut. Nous les réduirons et les mettrons en laisse. Ceux qui refusent de suivre les nouvelles directives seront suspendus et démis de leurs fonctions"
 POL_Empower_the_Sejm:0 "Renforcez le Sejm"
 POL_Empower_the_Sejm_desc:0 "Pour libéraliser davantage le gouvernement, nous donnerons plus de pouvoir à l'assemblée dirigeante du Sejm. Grâce à cela, il y aura une approche plus démocratique des futures lois et politiques, car elles devront d'abord être débattues au Sejm !"
 POL_The_Poznan_Uprising:0 "Le soulèvement de Poznan"
 POL_The_Poznan_Uprising_desc:0 "Un soulèvement de masse a eu lieu dans la ville de Poznan. Nous ne connaissons pas tous les détails, mais selon nos renseignements, plus de 100 000 personnes se sont rassemblées et protestent contre notre régime. L'armée et les corps de sécurité ont été informés et ont envoyé des ordres pour retenir les manifestants. Si la situation devient incontrôlable, le recours à la force meurtrière est autorisé."
 POL_Polish_October:0 "Octobre polonais"
 POL_Polish_October_desc:0 "Pour la République populaire de Pologne, 1956 fut une année de transition. La situation internationale a considérablement affaibli la faction stalinienne dure en Pologne, en particulier après la mort du leader communiste polonais Boleslaw Bierut en mars. Trois ans s'étaient écoulés depuis la mort de Joseph Staline. Les protestations des travailleurs de Poznan en juin ont mis en évidence le mécontentement de la population face à sa situation. En octobre, les événements ont entraîné une montée en popularité de la faction réformatrice dirigée par Wladyslaw Gomulka."
 POL_The_Gomulka_Thaw:0 "Le dégel de Gomulka"
 POL_The_Gomulka_Thaw_desc:0 "Il a été décidé que Gomulka, désormais libre et auparavant emprisonné par Bierut, deviendrait le nouveau secrétaire général. Considéré comme un modéré, il était le meilleur sur lequel les partisans de la ligne dure et les réformateurs pouvaient s'entendre."
 POL_First_Secretary_Zawadzki:0 "Premier secrétaire Zawadzki"
 POL_First_Secretary_Zawadzki_desc:0 "Alexandre Zawadzki a réussi à vaincre son ennemi Gomulka et à assurer la direction de la Pologne. Zawadzki est très différent de son adversaire Gomulka. Là où Gomulka est une personnalité plus modérée, Zawadzki est un communiste pro-soviétique dur. Il envisage d'aligner davantage la nation sur l'Union soviétique tout en adaptant la culture soviétique à la culture polonaise."
 POL_Dismiss_Rokossovsky:0 "Licencier Rokossovsky"
 POL_Dismiss_Rokossovsky_desc:0 "Rokossovsky, un général soviétique en poste en Pologne, a violemment réprimé le soulèvement de Poznan. Gomulka a décidé de le licencier et de le renvoyer en Union Soviétique."
 POL_Placate_Soviet_Fears:0 "Apaiser les craintes soviétiques"
 POL_Placate_Soviet_Fears_desc:0 "Les Soviétiques s'en inquiètent simplement parce que nous avons Gomulka comme secrétaire général, craignant que nous commencions à nous diviser et à laisser les capitalistes prendre le contrôle de la nation. Les soviets s'inquiètent trop. Nous apaiserons les craintes soviétiques et leur garantirons que nous n'envisageons pas de quitter le Pacte de Varsovie de si tôt."
 POL_Decrease_Church_Persecutions:0 "Diminuer les persécutions contre l'Église"
 POL_Decrease_Church_Persecutions_desc:0 "Les persécutions contre l'Église perpétrées par le gouvernement précédent étaient brutales et perpétrées sans autre raison que d'essayer de pousser la nation à l'athéisme. Maintenant que nous sommes aux commandes, nous allons diminuer les persécutions contre l'Église."
 POL_Condemn_Nationalist_Rhetoric:0 "Condamner la rhétorique nationaliste"
 POL_Condemn_Nationalist_Rhetoric_desc:0 "Même s'il n'y a pas beaucoup de bonnes choses que le gouvernement Bierut a faites, la répression des nationalistes est l'une des rares. Les nationalistes, ceux qui, il y a seulement quelques années, ont presque complètement détruit Varsovie pendant la Seconde Guerre mondiale, sont toujours dans notre pays. Nous devons condamner cette idéologie !"
 POL_Allow_Moderate_Electoral_Freedom:0 "Autoriser une liberté électorale modérée"
 POL_Allow_Moderate_Electoral_Freedom_desc:0 "Si nous ne sommes pas sur le point d'établir une démocratie complète, nous autoriserons plutôt une liberté électorale modérée, permettant aux travailleurs d'avoir un plus grand choix quant à savoir pour qui voter tout en conservant notre emprise sur la nation"
 POL_Population_Reperation_Agreement_with_the_Soviets:0 "Accord de réparation de la population avec les Soviétiques"
 POL_Population_Reperation_Agreement_with_the_Soviets_desc:0 "Une grande partie de notre population a beaucoup souffert sous la botte soviétique et allemande. Ainsi, nous tenterons de parvenir à un accord de réparation avec les Soviétiques, incitant la population à retourner dans son ancienne patrie."
 POL_Condemn_Factionalism:0 "Condamner le factionnalisme"
 POL_Condemn_Factionalism_desc:0 "Même si nous avons des divergences entre les autres membres du Parti, nous devons quand même coopérer et condamner le factionnalisme du Parti. Seul l'unité pourra réellement réaliser un paradis socialiste !"
 POL_Cultural_Liberalization:0 "Libéralisation culturelle"
 POL_Cultural_Liberalization_desc:0 "Le gouvernement Bierut a exercé une emprise assez stricte sur la culture polonaise, la restreignant et empêchant les gens de voir toute sorte de médias occidentaux. Maintenant que les partisans de la ligne dure stalinienne sont partis, nous pouvons commencer à mettre en oeuvre des politiques de libéralisation."
 POL_Expand_Western_Ties:0 "Élargir les liens avec l'Occident"
 POL_Expand_Western_Ties_desc:0 "Entretenir des liens avec le bloc de l'Est ne suffit tout simplement pas, nous devons élargir nos liens avec l'Occident, même si les Soviétiques n'en sont peut-être pas très heureux. Si nous établissons des liens avec l'Occident, nous pourrons également accéder aux marchés occidentaux."
 POL_The_Little_Stabilization:0 "La petite stabilisation"
 POL_The_Little_Stabilization_desc:0 "Nos réformes s'installent lentement chez nos travailleurs, les accueillent et profitent de choses qui ne pourraient jamais être possibles sous Bierut. Notre peuple est satisfait et tout le monde peut dire que le gouvernement est plus libéral, plus ouvert et plus amical envers les souhaits des travailleurs. Cela a amené la nation à connaître une certaine stabilisation."
 POL_Abandon_Collective_Agriculture:0 "Abandonner l'agriculture collective"
 POL_Abandon_Collective_Agriculture_desc:0 "La politique d'agriculture collective est une politique cruelle envers les travailleurs ruraux et les agriculteurs. Forcer les gens à respecter des quotas et à leur confisquer les terres qu'ils possédaient depuis des siècles juste pour que l'État les utilise n'est pas juste et ne peut tout simplement pas tenir. Nous abandonnerons cette politique et redonnerons aux agriculteurs leurs droits."
 POL_Rehabilitate_the_Purged_Members:0 "Réhabiliter les membres purgés"
 POL_Rehabilitate_the_Purged_Members_desc:0 "De nombreux anciens membres, tout comme Gomulka, ont été purgés à cause d'accusations ridicules, car Bierut craignait qu'il y ait une conspiration contre lui et le reste du Parti communiste. Cependant, Bierut étant parti, nous allons maintenant nous concentrer sur la réhabilitation des membres purgés."
 POL_Reduce_Soviet_Influence:0 "Réduire l'influence soviétique"
 POL_Reduce_Soviet_Influence_desc:0 "Les Soviétiques détiennent actuellement trop de contrôle sur notre nation. Ils influencent tous les pans de la nation, de la politique à son armée. Si jamais nous voulons nous libérer des Soviétiques, nous devrons commencer à réduire l'influence des Soviétiques."
 POL_Crush_the_Protests:0 "Écraser les protestations"
 POL_Crush_the_Protests_desc:0 "Nous ne pouvons pas laisser ces traîtres et anti-révolutionnaires se manifester dans les rues. Nous écraserons ces Traitos et promulguerons la loi martiale jusqu'à ce que la situation se calme."
 POL_Empower_the_Natolin_Faction:0 "Renforcez la faction Natolin"
 POL_Empower_the_Natolin_Faction_desc:0 "La faction Natolin était une faction au sein de la direction du Parti ouvrier unifié communiste polonais. Formé vers 1956, peu après le 20e Congrès du Parti communiste de l'Union soviétique, il doit son nom au lieu où se déroulaient ses réunions, dans une villa gouvernementale à Natolin. La principale opposition aux Natolines était la faction Pulawian, qui regroupait de nombreux membres du parti stalinien d'origine juive. Les Natoliniens étaient contre les programmes de libéralisation post-staliniens (« dégel ») et ils proclamaient de simples slogans nationalistes et antisoviétiques dans le cadre d'une stratégie visant à accéder au pouvoir."
 POL_Strengthen_the_State_Security_Apparatus:0 "Renforcer l'appareil de sécurité de l'État"
 POL_Strengthen_the_State_Security_Apparatus_desc:0 "De nombreux ennemis rôdent encore autour de l'État, se cachant dans l'ombre et attendant de frapper. Mais nous ne leur en laisserons pas la chance ! En renforçant l'appareil de sécurité de l'État, nous éliminerons chacun d'entre eux !"
 POL_Reopen_the_Prison_Camps:0 "Rouvrir les camps de prisonniers"
 POL_Reopen_the_Prison_Camps_desc:0 "Notre prison est remplie d'ennemis de la révolution qui restent assis et pourrissent. Mais ils pourraient plutôt être utilisés pour se racheter. Pour leur donner cette chance de rédemption, nous rouvrirons les camps de prisonniers, en établissant la politique selon laquelle plus vous travaillez longtemps et plus votre peine sera courte."
 POL_Launch_Anti_Catholicism_Campaign:0 "Lancer une campagne anti-catholicisme"
 POL_Launch_Anti_Catholicism_Campaign_desc:0 "Beyrouth a d'abord eu la bonne idée de conclure un accord avec l'Église pour l'empêcher de diffuser une propagande antisocialiste. Mais cela n'est pas allé assez loin. Au lieu de parvenir à un autre accord avec l'Église, nous lancerons une campagne anti-catholicisme pour nous débarrasser une fois pour toutes de l'Église et établir un véritable paradis socialiste athée !"
 POL_Request_Further_Soviet_Economic_Aid:0 "Demander une aide économique soviétique supplémentaire"
 POL_Request_Further_Soviet_Economic_Aid_desc:0 "Même si notre industrie se développe, cela ne suffit pas. Il nous manque quelque chose. Peut-être que l'une de nos politiques n'est pas appliquée correctement ou que nous utilisons des méthodes obsolètes ? Pour résoudre ce problème, il existe une solution simple. En invitant l'aide économique et les conseillers soviétiques, cela stimulera notre économie !"
 POL_Expand_the_Ludowe_Wojsko_Polskie:0 "Agrandir Ludowe Wojsko Polskie"
 POL_Expand_the_Ludowe_Wojsko_Polskie_desc:0 "Même si nos frontières sont sécurisées, cela ne ferait pas de mal d'étendre notre Ludowe Wojsko Polskie. Avec l'Expansion, nos frontières seront encore plus sécurisées. Et si un autre envahisseur tente de nous envahir, il aura une mauvaise surprise."
 POL_Deny_the_Katyn_Massacre:0 "Nier le massacre de Katyn"
 POL_Deny_the_Katyn_Massacre_desc:0 "Le massacre de Katyn était une série d'exécutions massives de près de 22 000 officiers militaires polonais et prisonniers de guerre de l'intelligentsia perpétrées par l'Union soviétique, plus précisément par le NKVD (« Commissariat du peuple aux affaires intérieures », la police secrète soviétique) en avril et mai 1940. Bien que les meurtres aient également eu lieu dans les prisons de Kalinin et de Kharkiv et ailleurs, le massacre porte le nom de la forêt de Katyn, où certaines des fosses communes ont été découvertes pour la première fois par les forces allemandes. Le massacre a été initié par la proposition du chef du NKVD Lavrentiy Beria à Joseph Staline d'exécuter tous les membres captifs du corps des officiers polonais, qui a été approuvée par le Politburo soviétique dirigé par Staline. Sur le total tué, environ 8 000 étaient des officiers emprisonnés lors de l'invasion soviétique de la Pologne en 1939, 6 000 autres étaient des policiers et les 8 000 restants étaient des intelligentsia polonais que les Soviétiques considéraient comme des agents de renseignement et des gendarmes. Espions et saboteurs, anciens propriétaires fonciers, propriétaires d'usines et fonctionnaires. La classe des officiers de l'armée polonaise était représentative de l'État polonais multiethnique ; Parmi les personnes assassinées figuraient des Polonais de souche, des Ukrainiens, des Biélorusses et des Juifs, dont le grand rabbin de l'armée polonaise, Baruch Steinberg."
 POL_Launch_Anti_Semitic_Campaign:0 "Lancez une campagne antisémite"
 POL_Launch_Anti_Semitic_Campaign_desc:0 "Antisémitisme ? En Pologne ? Sous le régime socialiste ? Non. Jamais. Fausses nouvelles."
 POL_Increase_Trade_within_the_East_Bloc:0 "Augmenter le commerce au sein du bloc de l'Est"
 POL_Increase_Trade_within_the_East_Bloc_desc:0 "Nous n'avons pas besoin des sales marchés occidentaux. Nous n'avons besoin que de nos camarades du bloc de l'Est et de l'Union soviétique. Faire du commerce avec d'autres nations socialistes sera plus que suffisant pour obtenir tous les matériaux dont notre nation a besoin !"
 POL_Emulate_Soviet_Culture:0 "Imiter la culture soviétique"
 POL_Emulate_Soviet_Culture_desc:0 "Zawadzki aime depuis longtemps la culture soviétique. Avant même de devenir secrétaire général. Mais maintenant qu'il est à la tête de la Nation, il peut réellement mettre les plans en marche et commencer à mettre en oeuvre la culture socialiste et soviétique, en en faisant un noyau de la Pologne socialiste."
 POL_Purge_the_Pulawowanie:0 "Purger la Pulawianie"
 POL_Purge_the_Pulawowanie_desc:0 "Pulawianie était une désignation informelle de l'un des deux groupes de communistes dans la politique d'après-guerre de la Pologne stalinienne, qui briguaient le pouvoir au sein de la direction du Parti ouvrier unifié polonais au printemps 1956, après la mort de Bierut. Ils étaient connus comme les réformistes lors du processus de déstalinisation de la Pologne."
 POL_Arrest_Gomulka_Oncemore:0 "Arrêter Gomulka une fois de plus"
 POL_Arrest_Gomulka_Oncemore_desc:0 "Céder à la pression des manifestants et libérer Gomulka était une erreur. Nous allons l'arrêter une fois de plus, cette fois pour de bon. Avec Gomulka hors course, Zawadzki aura assuré son poste de secrétaire général, sans plus de luttes politiques internes."
 POL_Release_Gomulka:0 "Libérer Gomulka"
 POL_Release_Gomulka_desc:0 "Les manifestants exigent que nous relâchions Gomulka immédiatement, affirmant que nous l'avons accusé de fausses accusations et qu'il est un homme innocent. Habituellement, nous ignorions cette demande. Mais avec l'état actuel de la situation, la moindre étincelle pourrait provoquer une révolution qui donnerait tout pour nous éloigner du pouvoir."
 POL_Resist_Comecon_Demands:0 "Résistez aux demandes du Comecon"
 POL_Resist_Comecon_Demands_desc:0 "Une autre revendication émanant des Démonstrateurs est de rejeter les demandes soviétiques du COMECON. Même si nous ne voulons pas nuire à nos relations avec les Soviétiques, il faudra l'accepter. Autrement, les grévistes pourraient formuler des exigences plus sévères."
 POL_Synthetic_Fiber_of_Gorzaw:0 "Fibre synthétique de Gorzow"
 POL_Synthetic_Fiber_of_Gorzaw_desc:0 "Gorzow est l'un des rares endroits en Pologne où la fibre synthétique est produite. Pour garantir que les revendications des travailleurs soient satisfaites, nous ouvrirons davantage d'usines de fibres synthétiques !"
 POL_Sily_Powietrzne:0 "Sily Powietrzne"
 POL_Sily_Powietrzne_desc:0 "Notre Force aérienne est un peu sèche depuis la Seconde Guerre mondiale. Beaucoup d'entre eux ont été soit transportés par avion vers la Roumanie, soit capturés par les Allemands. Nous avons acquis quelques modèles plus récents des Soviétiques, mais cela ne suffira pas. La Pologne a besoin d'une véritable force aérienne !"
