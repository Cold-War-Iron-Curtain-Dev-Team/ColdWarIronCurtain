### Country Super Events ######################################
 KOR_BIG_EVENT_QUOTE: "[KOR_Big_Event_Quote_Loc]"
 KOR_Big_Event_Syngman_Rhee_Steps_Down_Quote: "La souveraineté de la République de Corée réside dans le peuple et toute l'autorité de l'État émane du peuple.\n-Constitution de la République de Corée"
 KOR_Big_Event_Assasination_of_Syngman_Rhee_Quote: "Ce fut un moment important qui affecta le destin d'un pays, où la nation tout entière devait lutter avec une ferme volonté contre les ennemis extérieurs et intérieurs.\n-Lee Beom-seok"
 KOR_Big_Event_Operation_Everready_Quote: "Il n'y a pas d'homme indispensable dans une démocratie.\n-Harry S. Truman"
 KOR_Big_Event_KPG_Triumphant_Quote: "Les rouges sont aussi nos compatriotes qui partagent le sang et les os. Nous devrions nous asseoir face à face avec notre propre peuple et prendre une décision finale. Je devrais y aller même si je meurs allongé sur le 38ème parallèle.\n-Kim Koo"
 KOR_Big_Event_Jokcheong_Triumphant_Quote: "Bien que le monde soit vaste et que l'humanité soit nombreuse, aucune nation avec des conditions aussi fortes que la nôtre ne sera jamais trouvée en termes d'histoire et de tradition.\n-Lee Beom-seok"
 KOR_Big_Event_Syngman_Rhee_Triumphant_Quote: "La démocratie permet à tous les droits et au suffrage de tous, mais aucun pays ne permet à des éléments voyous de renverser le gouvernement sous prétexte de liberté civile.\n-Syngman Rhee"
 KOR_Big_Event_Overthrow_of_Kim_Family_Quote: "Il y a des décennies où rien ne se passe, et il y a des semaines où des décennies se produisent.\n-Vladimir Ilitch Lénine"