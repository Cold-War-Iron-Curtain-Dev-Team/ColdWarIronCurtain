 #CV
 MEX_cv_CAS_equipment_1:0 "Canard Grumman J2F"
 MEX_cv_CAS_equipment_1_short:0 "Canard J2F"
 MEX_cv_CAS_equipment_1_desc:0 "Le Grumman J2F Duck (désignation de la société G-15) est un biplan amphibie monomoteur américain. Il a été utilisé par chaque branche majeure des forces armées américaines du milieu des années 1930 jusqu'à juste après la Seconde Guerre mondiale, principalement à des fins utilitaires et de sauvetage aéro-maritime. Il a également été utilisé par la marine argentine, qui a pris livraison de son premier exemplaire en 1937. Après la guerre, les J2F Ducks ont servi auprès d'opérateurs civils indépendants, ainsi que dans les forces armées de Colombie et du Mexique. "
 MEX_cv_CAS_equipment_2:0 "Douglas SBD-2 Intrépide"
 MEX_cv_CAS_equipment_2_short:0 "SBD-2 Intrépide"
 MEX_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu comme avion de reconnaissance et bombardier en piqué en 1940 et était le principal avion de ce type pour la marine américaine. Le « Dauntless », déjà un bombardier en piqué performant, a été amélioré avec la variante -2 avec un armement différent et une capacité de carburant accrue, n'était qu'un pis-aller mineur par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'appelaient l'A-24 Banshee."

