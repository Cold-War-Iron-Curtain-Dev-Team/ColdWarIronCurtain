 #Mexico MEX
 MEX_infantry_equipment_0:0 "SA vz. 24"
 MEX_infantry_equipment_0_short:0 "vz. 24"
 MEX_infantry_equipment_0_desc:0 "Le vz. 24 est une carabine à verrou conçue et produite en Tchécoslovaquie de 1924 à 1942. Elle a été développée à partir de la gamme allemande Mauser Gewehr 98 et présente une conception de boulon très similaire."

 MEX_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 MEX_infantry_equipment_1_short:0 "FN FAL"
 MEX_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 MEX_infantry_equipment_2:0 "Heckler & Koch G3"
 MEX_infantry_equipment_2_short:0 "G3"
 MEX_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 MEX_infantry_equipment_3:0 "Heckler & Koch G3A3"
 MEX_infantry_equipment_3_short:0 "G3A3"
 MEX_infantry_equipment_3_desc:0 "La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 MEX_infantry_equipment_4:0 "Heckler & Koch HK33E"
 MEX_infantry_equipment_4_short:0 "HK33E"
 MEX_infantry_equipment_4_desc:0 "Le HK33 est un fusil d'assaut de 5,56 mm développé dans les années 1960 par le fabricant d'armement ouest-allemand Heckler & Koch GmbH (H&K), principalement pour l'exportation."
 

  ########## NEW MEX ARMOR
 MEX_lt_equipment_1:0 "M3A3 Stuart"
 MEX_lt_equipment_1_short:0 "M3A3 Stuart"
 MEX_lt_equipment_2:0 "Lévrier M8"
 MEX_lt_equipment_2_short:0 "Lévrier M8"

 MEX_lt_equipment_5:0 "Panhard ERC 90 F1 Lynx"
 MEX_lt_equipment_5_short:0 "ERC90 F1 Lynx"
 MEX_lt_equipment_5_desc:0 "Le Panhard ERC (Engin à Roues, Canon) est un véhicule blindé français à six roues très mobile et amphibie avec la possibilité d'être à l'épreuve du NBC. Bien que différents modèles aient été testés, seules deux versions de l'ERC sont entrées en production en grand nombre ; l'ERC-90 Lynx et l'ERC-90 Sagaie. La principale différence entre les deux versions réside dans le type de tourelle et de canon de 90 mm installés. Sagaie est le français pour sagaie, un type de lance africaine. "

 MEX_mechanized_equipment_1:0 "Demi-piste M2"
 MEX_mechanized_equipment_1_short:0 "Demi-piste M2"
 MEX_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 MEX_mechanized_equipment_2:0 "Demi-piste M3"
 MEX_mechanized_equipment_2_short:0 "Demi-piste M3"
 MEX_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 MEX_mechanized_equipment_3:0 "Demi-piste M3A1"
 MEX_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 MEX_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 #MEX_mechanized_equipment_4:0 ""
 #MEX_mechanized_equipment_4_short:0 ""
