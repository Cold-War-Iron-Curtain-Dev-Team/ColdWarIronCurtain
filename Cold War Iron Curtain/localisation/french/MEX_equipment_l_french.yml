 MEX_motorized_equipment_1:0 "GMC CCKW 6x6"
 MEX_motorized_equipment_1_short:0 "CCKW 6x6"
 MEX_motorized_equipment_2:0 "RÉO M35 6x6"
 MEX_motorized_equipment_2_short:0 "M35 6x6"
 MEX_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 MEX_motorized_equipment_3:0 "RÉO M35A1 6x6"
 MEX_motorized_equipment_3_short:0 "M35A1 6x6"
 MEX_motorized_equipment_3_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 MEX_motorized_equipment_4:0 "AM Général M939 6x6"
 MEX_motorized_equipment_4_short:0 "M939 6x6"
 MEX_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 MEX_motorized_equipment_5:0 "Mercedes-Benz série LA1600 Gen3 4x4"
 MEX_motorized_equipment_5_short:0 "MB LA1600-Gen3 4x4"
 MEX_motorized_equipment_5_desc:0 "Le camion Mercedes-Benz « Kurzhauber » (à capot court) est un camion à configuration conventionnelle, cabine après moteur, fabriqué de 1959 à nos jours. En Allemagne, on l'appelle plus communément Kurzhauber pour bonnet court. Le moteur s'est introduit dans la cabine sous le pare-brise, tout cela dans le but de fabriquer un camion plus court pour répondre aux réglementations allemandes strictes sur la longueur hors tout. Le camion à capot court a été construit dans de nombreux pays et reste en service dans de nombreuses régions vers lesquelles il a été exporté."

 ########### END OF MEX ARMOR
