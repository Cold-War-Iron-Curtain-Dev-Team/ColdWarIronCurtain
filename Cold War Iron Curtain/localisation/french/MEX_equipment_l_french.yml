  #Mexico
 MEX_fighter_equipment_0:0 "Fuerza Aérea Mexicana"
 MEX_fighter_equipment_0_short:0 "FAM"
 MEX_fighter_equipment_0_desc:0 "L'armée de l'air mexicaine est la principale branche de service de guerre aérienne des forces armées mexicaines. C'est une composante de l'armée mexicaine et dépend du Secrétariat de la Défense nationale (SEDENA). L'objectif du FAM est de défendre l'intégrité, l'indépendance et la souveraineté du Mexique. Ses tâches auxiliaires comprennent la sécurité intérieure, l'assistance aux travaux publics et la gestion des catastrophes naturelles."
 #MEX_fighter_equipment_1:0 ""
 #MEX_fighter_equipment_1_short:0 "USA GFX"
 MEX_fighter_equipment_2:0 "République P-47 Thunderbolt"
 MEX_fighter_equipment_2_short:0 "P-47 Coup de Foudre"
 MEX_fighter_equipment_2_desc:0 "Le P-47 était le développement ultérieur des avions Seversky (le prédécesseur de Republic) P-35 et Republic P-43 Lancer. Bien qu'il ait été conçu à l'origine comme un chasseur de supériorité aérienne. La renommée du P-47 était sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de l'héritage de l'entreprise en matière de développement d'avions d'appui aérien rapproché (CAS). Ce type a été utilisé dans une myriade de nations alliées pendant la Seconde Guerre mondiale et a continué à fonctionner ainsi après la guerre, certains affirmant que ce type, et non le P-51 Mustang, aurait dû être utilisé en Corée. Son surnom est « Thunderbolt », le premier dans les conventions de dénomination modernes de Republic. A été rebaptisé F-47 en 1948."
 MEX_fighter_equipment_3:0 "République P-47D-30 Thunderbolt"
 MEX_fighter_equipment_3_short:0 "P-47D-30" 

 MEX_jet_multirole_equipment_1:0 "De Haviland Vampire F Mk.I Aguacate"
 MEX_jet_multirole_equipment_1_short:0 "Vampire F Mk.I Aguacate"
 MEX_jet_multirole_equipment_1_desc:0 "Le premier avion à réaction exploité par l'armée de l'air mexicaine était le subsonique de Havilland Vampire Mk.I. Le Mexique a reçu 17 vampires à la fin des années 1960 et au début des années 1961. Surnommés Aguacate (« avocat ») en raison de leur couleur et de leur forme."
