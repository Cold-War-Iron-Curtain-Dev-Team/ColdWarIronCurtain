 MEX_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 MEX_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 MEX_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 MEX_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 MEX_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 MEX_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 MEX_utility_helicopter_equipment_4:0 "Bell UH-1H Iroquois"
 MEX_utility_helicopter_equipment_4_short:0 "UH-1H Iroquois"
