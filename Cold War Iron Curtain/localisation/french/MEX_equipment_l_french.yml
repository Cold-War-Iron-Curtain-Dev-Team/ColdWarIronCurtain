 MEX_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 MEX_jet_light_equipment_1_short:0 "Étoile filante T-33"
 MEX_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 MEX_jet_light_equipment_2:0 "Étoile filante Lockheed AT-33A"
 MEX_jet_light_equipment_2_short:0 "Étoile filante AT-33A"
 MEX_jet_light_equipment_2_desc:0 "Conversions du T-33A pour l'exportation en tant que variante d'appui rapproché équipée de pylônes sous les ailes et de points durs pour les bombes et les roquettes. Également utilisé dans le programme initial de chasse à Cannon AFB, au Nouveau-Mexique, vers 1972-1975."
