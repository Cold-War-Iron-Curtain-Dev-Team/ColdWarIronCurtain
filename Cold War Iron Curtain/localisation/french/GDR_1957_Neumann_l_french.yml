 GDR_First_Secretary_Neumann: "Premier secrétaire Neumann"
 GDR_First_Secretary_Neumann_desc: "Au milieu du chaos, Alfred Neumann est devenu notre prochain premier secrétaire. Espérons qu'il puisse rétablir l'ordre rapidement."
 GDR_Re_Appoint_Hoenecker_to_FDJ_Leadership: "Renommer Hoenecker à la tête de la FDJ"
 GDR_Re_Appoint_Hoenecker_to_FDJ_Leadership_desc: "Erich Honecker a accompli un excellent travail en tant que leader de la Jeunesse allemande libre ; il devrait être réintégré immédiatement."
 GDR_Undoing_the_Damage: "Réparer les dégâts"
 GDR_Undoing_the_Damage_desc: "La République est au bord du gouffre. Si nous ne prenons pas les mesures appropriées pour réparer les dégâts, tout ce que nous avons construit au cours de la dernière décennie s'effondrera."
 GDR_Keep_Hoeneker_Sidelined: "Gardez Hoeneker à l'écart"
 GDR_Keep_Hoeneker_Sidelined_desc: "Le licenciement d'Erich Honecker de la Jeunesse libre allemande nous offre l'occasion de réorganiser l'organisation à notre goût. Gardons Honecker à la retraite."
 GDR_Unity_from_Below: "L'unité d'en bas"
 GDR_Unity_from_Below_desc: "L'unité d'en bas est un concept dans lequel nous allons susciter le soutien populaire au Parti communiste en Allemagne de l'Ouest, l'objectif final étant son accession au pouvoir et son éventuelle unification avec la RDA."
 GDR_Reinstitute_Political_Censorship: "Rétablir la censure politique"
 GDR_Reinstitute_Political_Censorship_desc: "Le chaos auquel nous avons assisté est le résultat direct des tentatives malavisées de libéralisation de nos prédécesseurs. Nous devons immédiatement faire reculer ces libertés excessives."
 GDR_Surveil_the_Intelligenistia: "Surveillez l'Intelligenistia"
 GDR_Surveil_the_Intelligenistia_desc: "Les intellectuels et les éducateurs font toujours fermenter des idées à contre-courant parmi les jeunes et les impressionnables. Il faut les surveiller de près."
 GDR_Restore_the_Power_of_the_Stasi: "Restaurer le pouvoir de la Stasi"
 GDR_Restore_the_Power_of_the_Stasi_desc: "La Stasi existe pour protéger les gens d'eux-mêmes. Restreindre leur capacité d'agir n'est rien d'autre qu'un suicide pour l'État."
 GDR_Reinstate_Hilde_Benjamin: "Réintégrer Hilde Benjamin"
 GDR_Reinstate_Hilde_Benjamin_desc: "La destitution d'Hilde Benjamin était totalement injustifiée et clairement orchestrée par des parasites égoïstes au sein du Parti. Elle doit être réintégrée immédiatement."
 GDR_Keep_Ulbricht_in_Retirement: "Gardez Ulbricht à la retraite"
 GDR_Keep_Ulbricht_in_Retirement_desc: "Walter Ulbricht a joué son rôle. La RDA doit se tourner vers l'avenir et non vers le passé."
 GDR_Reinstate_Ulbricht_to_the_Party: "Réintégrer Ulbricht au parti"
 GDR_Reinstate_Ulbricht_to_the_Party_desc: "Même si cela ne sera pas populaire, nous réintégrerons Walter Ulbricht dans le parti. Nous aurons besoin de son aide pour inverser la tendance du révisionnisme."
 GDR_Crackdown_on_the_Revisionists: "Répression contre les révisionnistes"
 GDR_Crackdown_on_the_Revisionists_desc: "Le révisionnisme, la libéralisation, peu importe comment on l'appelle, nous n'en voulons pas. Nous devons rester fidèles aux principes du marxiste-léninisme !"
 GDR_Put_Schirdewan_on_Trial: "Faire un procès à Schirdewan"
 GDR_Put_Schirdewan_on_Trial_desc: "Karl Schirdewan était autrefois favorisé pour la direction du Parti, mais son acceptation des politiques révisionnistes ne peut être conciliée avec nos vues. Il doit être jugé et éliminé."
 GDR_Seek_Soviet_Economic_Assistance: "Rechercher l'assistance économique soviétique"
 GDR_Seek_Soviet_Economic_Assistance_desc: "Les politiques de l'administration précédente ont causé un préjudice considérable à notre économie déjà fragile. Nous aurons besoin de l'aide soviétique pour nous remettre sur les rails."
 GDR_Investigate_Solutiions_to_the_Republikflucht_Crisis: "Enquêter sur les solutions à la crise de la Republikflucht"
 GDR_Investigate_Solutiions_to_the_Republikflucht_Crisis_desc: "La crise de la Republikflucht devient incontrôlable. Si nous ne résolvons pas ce problème rapidement et efficacement, la République s'effondrera."
 GDR_An_End_to_Collective_Leadership: "La fin du leadership collectif"
 GDR_An_End_to_Collective_Leadership_desc: "L'idée d'un leadership collectif s'est avérée un échec. La direction reviendra entre les mains compétentes du Parti et de personne d'autre."
 GDR_Expand_Funding_For_Electronic_Engineering_Education: "Augmenter le financement pour la formation en génie électronique"
 GDR_Expand_Funding_For_Electronic_Engineering_Education_desc: "L'électronique est la clé pour réaliser nos rêves d'utopie socialiste. Si c'est du financement dont ils ont besoin, c'est du financement qu'ils auront !"
 GDR_Reform_the_Economic_Planning_Commission: "Réformer la Commission de planification économique"
 GDR_Reform_the_Economic_Planning_Commission_desc: "Alors que la situation revient lentement à la normale, nous devons adapter en conséquence nos plans de développement économique de l'Allemagne."
