l_french:
 BAN_FOR.1.d:0 "Une nation intermédiaire a apporté un message du Bangladesh. Ils demandent une normalisation de nos relations. Jusqu'à présent, nous sommes restés résolus à soutenir le Pakistan en ne nous engageant pas avec le nouvel État. Cependant, la situation internationale est telle que nous ne pouvons ignorer la présence d'un nouvel État asiatique. Le Pakistan apprécie notre soutien mais ne nous en voudra pas pour l'ouverture des relations. Le Bangladesh occupe une position stratégique le long du golfe du Bengale et à la frontière orientale de l'Inde. Cela pourrait potentiellement être un allié de taille pour nous. Nous avons deux options : l'une consiste à établir des relations diplomatiques amicales, ce qui ne nuira probablement pas aux sentiments du Pakistan. L'autre option consiste à proposer un pacte d'aide commerciale et militaire pour montrer notre intérêt pour un partenariat stratégique, ce qui risque d'agacer le Pakistan."
 BAN_FOR.2.d:0 "Le gouvernement chinois a accepté d'établir des relations diplomatiques complètes avec nous. L'ancien consulat chinois à Dacca sera transformé en ambassade à part entière et un nouvel ambassadeur devrait être annoncé prochainement. Nous avons également été invités à établir une ambassade à Pékin. La Chine reste une puissance asiatique vitale et l'établissement de liens étroits contribuera à garantir que nous ne serons jamais complètement dépendants de l'Inde à l'avenir. Il s'agit d'un élan majeur pour notre politique étrangère et donne à notre peuple une plus grande légitimité sur la scène internationale."
 BAN_FOR.3.d:0 "Le gouvernement chinois a répondu très positivement à notre appel à une normalisation diplomatique. Ils ont proposé un pacte prévoyant des conditions commerciales favorables et une aide militaire. L'aide proposée pourrait permettre d'équiper plusieurs bataillons d'infanterie en armes légères. Nos plus hauts dirigeants militaires et économiques sont très attirés par cette proposition. Cependant, d'éminents experts politiques et diplomatiques notent que si nous acceptons ce soutien, nous nous aliénerons l'Inde. Les Indiens ne verront pas d'un bon oeil une présence chinoise accrue sur notre territoire. Au lieu de cela, ils pensent que nous devrions apprécier l'offre mais nous en tenir à maintenir des liens amicaux. Nous devons décider si l'aide militaire et le soutien économique valent la peine d'aliéner notre plus grand voisin."
 BAN_FOR.4.d:0 "L'État nouvellement indépendant du Bangladesh a récemment demandé que nous envoyions des experts pour stimuler son économie et son armée. Le gouvernement épouse le désir d'adopter un modèle économique socialiste pour élever sa population pauvre. Notre analyse note que même si le gouvernement et ses partisans soutiennent le socialisme, de nombreux Bangladais émettent des réserves. Surtout au sein de l'armée et parmi les éléments conservateurs. Notre aide pourrait aider le gouvernement à réussir et à convaincre de plus en plus la population d'adopter à terme une société socialiste totale. Cependant, certains rapports suggèrent que le pays est trop sous-développé économiquement ou socialement pour que notre aide soit efficace. Il serait peut-être préférable de se concentrer uniquement sur le renforcement des liens. Il faudra prendre une décision."
 BAN_FOR.5.d:0 "Le gouvernement et les médias ont récemment salué l'arrivée d'experts soviétiques à Dacca. D'autres conseillers sont attendus dans les semaines à venir à mesure que le comité consultatif s'organise dans le pays. Nous accueillons ces conseillers offrant un soutien aux ministères des Finances et de la Défense. Le socialisme offre le remède à la pauvreté et aux divisions de classe au Bangladesh. Les experts soviétiques bénéficieront de notre entière coopération. L'armée a refusé l'autorisation à tout expert soviétique de visiter ou de s'intégrer à un quartier général militaire ou à une unité de terrain. Ils invoquent des problèmes de sécurité, mais nous espérons qu'avec le temps, les officiers les plus réactionnaires pourront être remplacés."
 BAN_FOR.6.d:0 "Le gouvernement du Bangladesh a demandé en privé sa part des actifs fédéraux. Les Bangladais affirment que leur province a fourni un soutien financier important au gouvernement fédéral et souhaitent que les actifs restants soient restitués immédiatement. La situation nous met dans une situation délicate. Le ministère des Finances détient les dossiers et estime que le gouvernement pourrait restituer ces actifs spécifiques collectés dans l'ancien Pakistan oriental. Compte tenu de la manière dont ils ont quitté le pays, de nombreux membres du Cabinet préféreraient que nous ne donnions pas un centime. D'autres soutiennent qu'une partie pourrait être restituée, cela améliorerait nos relations. Enfin, nous pourrions restituer tous les actifs, ce qui contribuerait grandement à renforcer les liens."
 BAN_FOR.7.d:0 "Nous avons récemment demandé au gouvernement pakistanais de restituer les actifs et capitaux détenus par le gouvernement fédéral à partir de nos contributions provinciales au centre. Nous ne nous attendions pas à une réponse positive du Pakistan, mais nous avons été agréablement surpris. Les Pakistanais ont signé un accord promettant de restituer les actifs au cours des deux prochaines années. Cela stimulera notre économie et contribuera à stabiliser notre propre croissance. Cependant, la valeur des actifs ne semble représenter qu'un faible pourcentage de ce qui est dû. Les Pakistanais insistent sur le fait que leur offre ne peut pas être augmentée. Quoi qu'il en soit, il est significatif qu'ils aient accepté de tout donner et qu'ils renforcent nos liens."
 BAN_FOR.8.d:0 "Nous avons récemment demandé au gouvernement pakistanais de restituer les actifs et capitaux détenus par le gouvernement fédéral à partir de nos contributions provinciales au centre. Nous ne nous attendions pas à une réponse positive du Pakistan, mais nous avons été très surpris. Les Pakistanais ont signé un accord promettant de restituer les actifs au cours des cinq prochaines années. Cela stimulera notre économie et stabilisera notre croissance. La valeur offerte par les Pakistanais correspond à nos propres calculs ; il semble que les Pakistanais soient véritablement intéressés et disposés à restituer les actifs. Il s'agit d'une évolution significative et cela indique peut-être un avenir de coopération et de fraternité entre nos États."
 BAN_FOR.9.d:0 "Notre ambassadeur à Dacca a reçu une demande du ministre des Affaires étrangères du Bangladesh. Le ministre a appelé nos deux nations à tenir des négociations pour délimiter la frontière. Actuellement, il existe de nombreuses enclaves sur nos deux territoires et la population des zones frontalières trouve la situation problématique. Résoudre la frontière pourrait potentiellement renforcer les liens et rendre la frontière moins chaotique pour ses résidents. Cependant, nos experts notent qu'un certain nombre de nos enclaves sont essentiellement entourées par le Bangladesh. Une démarcation pourrait nous faire perdre des villages et des citoyens au profit du Bangladesh. Si c'est une possibilité que nous pouvons accepter, des pourparlers peuvent avoir lieu, sinon nous devons poliment refuser les pourparlers."
 BAN_FOR.10.d:0 "Le gouvernement indien a accepté de tenir des négociations à Calcutta, au-delà de notre frontière. Nous sommes actuellement en train de constituer une équipe performante et devons élaborer une stratégie de négociation. Les Indiens ont indiqué qu'ils voulaient entendre nos solutions au problème et négocier à partir de là. Une proposition que nous avons élaborée appelle les deux parties à se céder mutuellement les enclaves frontalières. Cela modifierait la propriété nationale des villages enclavés. Ses résidents pouvaient soit rester et obtenir leur nouvelle citoyenneté, soit rapatrier. L'autre proposition solidifierait les frontières mais nécessiterait un transfert de population. Tous les Bangladais vivant dans les enclaves prises par l'Inde seraient renvoyés et vice versa. Les villageois n'auraient pas le choix dans cette solution. Nous devons décider quelle position proposer."
 BAN_FOR.11.d:0 "Nous menons des négociations avec le Bangladesh à Calcutta, au-delà de notre frontière. Les villages enclavés détenus par les deux camps sont particulièrement préoccupants. Les Bangladais ont proposé aux deux camps de céder les enclaves entourées par l'autre puissance. Les villageois auront alors la possibilité soit de prendre la citoyenneté de leur nouveau pays, soit d'être rapatriés. Les Bangladais insistent sur le fait que cela stabilisera la frontière tout en offrant une option aux villageois. Nos propres négociateurs estiment que l'accord peut contribuer à stabiliser la frontière, mais ne donne qu'une illusion de choix aux villageois. Il convient de noter que ceux qui souhaitent conserver leur citoyenneté indienne devraient abandonner leur pays. Cela mettrait la pression sur les autorités locales pour qu'elles réinstallent ces citoyens, qui n'en valent peut-être pas la peine. Cependant, les négociateurs admettent également que l'accord mettrait fin au problème d'enclave qui sévit dans la région frontalière depuis la partition."
 BAN_FOR.12.d:0 "Nous menons des négociations avec le Bangladesh à Calcutta, au-delà de notre frontière. Les villages enclavés détenus par les deux camps sont particulièrement préoccupants. Les Bangladais ont proposé aux deux camps de céder les enclaves entourées par l'autre puissance. Cependant, ils insistent sur le fait que tous les résidents des enclaves soient transférés, ce qui signifie que nos citoyens de nos enclaves nous seront transférés. Nous renverrions également les citoyens bangladais de leurs enclaves en Inde. Cette proposition résoudrait le problème de manière décisive, mais nos négociateurs ont des inquiétudes. Nous avons bien plus de citoyens qui seraient expulsés de force de leurs foyers ancestraux. Cela augmentera probablement les tensions et fera pression sur les autorités locales pour qu'elles réinstallent les réfugiés. Le gouvernement devrait décider d'une réponse."
 BAN_FOR.13.d:0 "Les négociations frontalières à Calcutta entre le Bangladesh et l'Inde n'ont pas réussi à résoudre les tensions. Actuellement, il existe des centaines d'enclaves des deux côtés de la frontière et une grande confusion, associée à des affrontements frontaliers occasionnels. Les Bangladais étaient soucieux de résoudre la question des enclaves. Cependant, les Indiens s'intéressaient davantage aux habitants de l'enclave. Le gouvernement indien insiste sur le fait que toute solution concernant les enclaves devrait offrir aux résidents la possibilité de conserver leur identité nationale et l'accès aux terres ancestrales. Le gouvernement bangladais considère cela comme irréaliste. Malgré cet échec, les deux parties ont convenu de poursuivre les discussions positives sur toutes les questions en suspens."
 BAN_FOR.14.d:0 "Après des négociations à Calcutta, l'Inde et le Bangladesh ont convenu de résoudre leur différend frontalier par un transfert de population. Tous les habitants des enclaves seront invités à choisir leur identité nationale. Les Bangladais résidant dans les enclaves du côté indien de la frontière seront rapatriés. De même, les citoyens indiens des enclaves du Bangladesh seront également transférés en Inde. Le processus prendra plusieurs mois, mais les deux parties espèrent qu'il résoudra une grande partie des tensions frontalières. L'opinion publique bangladaise n'est pas satisfaite du résultat, estimant que le gouvernement a davantage abandonné car il contrôlait la plupart des enclaves. Cependant, les gouvernements bangladais et indien ont souligné que cette décision serait mutuellement bénéfique pour toutes les personnes impliquées."

 BAN_ECON.1.d:0 "Le peuple du Bangladesh mérite la paix et la prospérité. Notre peuple a été victime de l'exploitation coloniale pendant des siècles et contrôle désormais son propre destin. Le gouvernement a récemment reçu deux propositions de plans quinquennaux. L'une, développée par d'éminents dirigeants politiques et universitaires, envisage une nation en transition vers le socialisme. Ce plan propose un effort ambitieux pour fournir une réflexion dynamique pour la croissance de la société. L'autre plan, élaboré par les institutions bureaucratiques traditionnelles, propose une série de réformes plus modestes, destinées à faire évoluer le Bangladesh vers une économie stable et indépendante. De nombreux membres du gouvernement sont favorables au projet académique car il propose une nouvelle approche du développement économique et rompt avec les mécanismes traditionnels. Toutefois, un changement trop rapide pourrait poser des problèmes à l'État naissant."
 BAN_ECON.2.d:0 "Le jute reste l'une des industries les plus vitales du Bangladesh et historiquement une source de notre exploitation. Les Britanniques puis les Pakistanais dirigeaient les filatures de jute, drainant ainsi les richesses du pays. Avec l'indépendance, beaucoup de ces filatures de jute sont restées inactives. Certains ont recommandé que le gouvernement vende ces industries aux entreprises et sociétés privées. Cependant, cela ne ferait qu'encourager une nouvelle vague d'exploitation. Le gouvernement va entamer le processus de nationalisation de ces filatures de jute et les mettre en service. Les ouvriers et les usines sont désormais sous le contrôle de l'usine de jute du Bangladesh."
 BAN_ECON.3.d:0 "Un rapport récent note que la production de jute dans le pays est bien inférieure à celle de la période précédant l'indépendance. Les dépenses à l'usine sont également beaucoup plus élevées. Les syndicats sont accusés de créer des difficultés excessives aux administrateurs. L'administration a également fait face à de vives critiques dans le rapport. Ses membres sont accusés d'absentéisme et d'incompétence. De nombreux membres du Bangladesh Jute Board sont des personnalités politiques qui connaissent peu le secteur. Malgré ces revers majeurs, le gouvernement insiste sur le fait qu'il ne privatisera pas les usines, bien qu'il ait promis des réformes pour réduire les inefficacités. Il est prévu de mettre fin au Bangladesh Jute Board et de le placer sous la tutelle du ministère des Finances."
 BAN_ECON.4.d:0 "Un comité d'économistes et de hauts fonctionnaires de la fonction publique a récemment publié un rapport après avoir enquêté sur le Bangladesh Jute Board, géré par le gouvernement. Ils ont noté que les efforts visant à réformer les inefficacités ont été inefficaces. Les syndicats restent difficiles à gérer, surtout avec une administration composée de membres ayant peu d'expérience dans les affaires ou dans l'industrie du jute. La récente réforme visant à créer un ministère du jute distinct pour réduire les coûts a eu peu d'impact. Le rapport recommande au gouvernement de commencer à privatiser les usines qui pèsent lourdement sur les finances du pays. Cependant, les années d'engagement en faveur du contrôle étatique signifient qu'une privatisation complète n'est pas possible. Le gouvernement envisage de privatiser progressivement certaines filatures de jute pour évaluer la situation."
 BAN_ECON.5.d:0 "Suite aux recommandations d'un comité d'experts, le gouvernement a récemment privatisé une douzaine de filatures de jute. En outre, le gouvernement a lancé plusieurs incitations pour stimuler la croissance. Cependant, une évaluation récente conclut que les filatures de jute privées produisent autant ou à peine plus que les filatures gérées par le gouvernement. Il s'agit d'une nouvelle décevante pour l'économie, même si le rapport donne davantage d'arguments à ceux qui préconisent que le gouvernement n'abandonne pas complètement sa participation dans l'industrie. Le gouvernement a déclaré qu'il ralentirait le rythme de la privatisation mais continuerait à fournir des incitations et des subventions à l'industrie."
 BAN_ECON.10.d:0 "Le ministère des Finances a publié une série de réglementations visant à codifier les relations professionnelles entre la direction et les travailleurs. Celles-ci visent à mieux définir exactement les recours juridiques dont disposent les deux parties en ce qui concerne les négociations ou la déclaration de grève. Les groupes de travailleurs critiquent cette décision, soulignant que le Bangladesh ne dispose toujours pas d'une législation vitale sur la question, ce qui donne un avantage injuste aux propriétaires d'usines. La principale association patronale a également critiqué la réglementation, la qualifiant de feuille de route permettant aux travailleurs de mener efficacement des manifestations sans enfreindre la loi. Malgré ces critiques, le ministère des Finances insiste sur le fait que cette décision contribuera à résoudre les conflits actuels et à encourager davantage de législation à l'avenir."
 BAN_ECON.11.d:0 "Le jute est une industrie vitale pour le Bangladesh. Pendant la période coloniale, le jute produit dans ces terres était destiné à être transformé dans ce qui est aujourd'hui l'Inde. Malgré le potentiel et les promesses, peu a été fait pour construire une capacité de transformation au Bangladesh même. Pour remédier à cela, de nouvelles incitations et protections sont proposées au niveau international pour encourager les investissements étrangers dans l'industrie du jute. Le Bangladesh a un grand potentiel de croissance, mais il doit y parvenir avec l'aide financière de l'étranger. Les missions diplomatiques commenceront bientôt à faire connaître les nouvelles opportunités."
 BAN_ECON.12.d:0 "Nos efforts visant à encourager les investissements étrangers pour développer les installations de transformation du jute ont porté leurs fruits. Nous avons attiré des financements auprès de certaines organisations de développement et de quelques groupes d'investissement. Cependant, c'est moins que ce que nous avions prévu lors du lancement de l'effort. Il semble que la plupart des gens considèrent encore notre pays comme un investissement risqué. Malgré cela, nous sommes en mesure d'étendre certaines de nos capacités de transformation, ce qui constituera une aubaine pour l'économie. Plus important encore, cela nous permet de bénéficier davantage de l'exportation de produits fabriqués à partir de jute au lieu de simplement la matière première."
 BAN_ECON.13.d:0 "Nos efforts visant à encourager les investissements étrangers pour développer les installations de transformation du jute ont porté leurs fruits. Les missions diplomatiques et le ministère des Finances ont été bombardés de demandes de groupes d'investissement et d'organisations intéressées par le programme proposé. Il semble que notre pays soit perçu par beaucoup comme une terre d'opportunités. Nous sommes en mesure non seulement d'étendre considérablement la transformation du jute dans le pays, mais également d'attirer suffisamment de partenaires étrangers pour maximiser les opportunités de profit. Il s'agit d'un succès majeur pour la population du Bangladesh."
 BAN_ECON.14.d:0 "Nous recevons actuellement un nouvel intérêt pour les investissements étrangers au Bangladesh. Le ministère des Finances estime qu'il serait dans l'intérêt de la nation de pouvoir se concentrer sur un domaine de développement spécifique pour maximiser cette augmentation. Certains experts estiment que nous devrions orienter ce soutien vers la construction d'infrastructures à travers le pays. D'autres experts considèrent qu'il est primordial de se concentrer sur le développement de l'énergie pour jeter les bases d'une croissance économique future. Certains dirigeants politiques de haut niveau insistent sur le fait que l'accent devrait être mis sur les nouvelles industries afin de fournir davantage d'emplois à la population. Une décision doit être prise prochainement."
 BAN_ECON.15.d:0 "Le précédent régime pakistanais continuait de détenir de vastes étendues de terres héritées du régime britannique. L'armée s'est par la suite emparée de davantage de terres, apparemment pour des raisons de sécurité. Après une enquête approfondie, le gouvernement a identifié de grandes quantités de terres agricolement viables qui peuvent être restituées aux paysans. Il reste seulement à déterminer comment répartir les terres. Une option consiste à redistribuer les terres aux paysans sans terre. L'autre option prévoit la vente publique de ces terrains. Les partisans du premier croient que cela remédiera à l'oppression continue des paysans dans le pays. Ceux qui souhaitent une vente publique si quelqu'un achète le terrain, ils investiront probablement l'investissement nécessaire pour que cela en vaille la peine."
 BAN_ECON.16.d:0 "Nos paysans sont furieux de la décision de vendre publiquement les terres gouvernementales excédentaires. Ils soutiennent que ces terres auraient dû être restituées aux personnes qui en ont désespérément besoin. De nombreuses familles paysannes affirment qu'elles n'ont pratiquement aucune possibilité d'acquérir des terres et sont de plus en plus contraintes de travailler pour les propriétaires terriens. Certains responsables sont accusés de profiter massivement des ventes. Les cas de paysans refusant de travailler ou réduisant la quantité de travail se multiplient pour protester contre ce qu'ils considèrent comme une situation désastreuse."

 Rahman_Assasination.1.d:0 "Le chaos règne à Dacca suite à des informations selon lesquelles des hommes armés en uniforme ont pris d'assaut la résidence du président Cheikh Mujibur Rahman. Des explosions et des coups de feu ont été signalés depuis la résidence. Les Bangladais seraient dans un état d'appréhension alors qu'ils tentent de comprendre ce qui se passe. La récente montée de la violence, de la criminalité et de la crise économique a considérablement érodé la popularité du président. L'armée en particulier serait perturbée par ces crises car elle se retrouve engagée dans un conflit avec le JSD radical-socialiste."
 Rahman_Assasination.2.d:0 "Les médias d'État du Bangladesh ont confirmé que des officiers militaires patriotes étaient responsables de l'assaut contre la résidence du président Cheikh Mujibur Rahman. Les officiers ont ensuite confirmé à l'antenne qu'ils avaient tué Mujibur Rahman pour sauver la nation. Parmi les morts confirmés figurent ses deux fils, considérés comme ses futurs successeurs. Ses deux filles sont en Allemagne de l'Ouest. Quelques années plus tôt, des millions de personnes avaient acclamé Mujibur Rahman comme leur champion, mais la réaction à sa mort est largement modérée. Il semble que la crise économique et d'autres problèmes intérieurs aient largement entamé sa réputation auprès du peuple. On ne sait pas exactement qui dirige désormais le gouvernement. L'armée continue de garder le silence sur son rôle dans ce coup d'État. Les officiers impliqués appartiennent aux rangs intermédiaires et les officiers supérieurs semblent tout aussi choqués par le coup d'État que le peuple."
 Rahman_Assasination.3.d:0 "Dans un développement sans précédent, Khondaker Mostaq Khan s'est autoproclamé nouveau président du Bangladesh. Il est un leader nationaliste réputé et membre du comité exécutif. Le nouveau leader semble avoir pris le pouvoir avec le soutien des putschistes. Les analystes estiment que les putschistes pensaient que leurs rangs inférieurs les rendaient vulnérables, mais le nouveau président légitimera leur action. Le nouveau président a travaillé avec Cheikh Mujibur Rahman. Avant de rejoindre le comité exécutif, il avait été ministre du gouvernement. Certains experts estiment que sa sélection à la présidence vise à apaiser la branche armée de la Ligue Awami et à empêcher un contre-coup d'État ou une intervention étrangère. La population du Bangladesh attend de voir ce que l'avenir lui réserve."
 Rahman_Assasination.4.d:0 "Le président Khondaker Mostaq Khan a pris la présidence après avoir été approché par les dirigeants de la Ligue Awami à la suite de l'assassinat de Cheikh Mujibur Rahman. Le nouveau présent doit maintenant décider quoi faire des assassins. Il est clair que les assassins ont approuvé sa nomination à condition qu'il leur accorde l'immunité. Si cela n'est pas donné, il existe une forte possibilité d'un autre coup d'État, plus violent, perpétré par des officiers subalternes lourdement armés. L'autre option est de ne pas émettre d'opinion sur l'assassinat et de déférer l'affaire à la justice militaire. Cette décision déterminera le destin du nouveau gouvernement."
 Rahman_Assasination.5.d:0 "Le président Khondaker Mostaq Khan s'est adressé à la nation. Il a félicité les assassins de Cheikh Mujibur Rahman pour avoir sauvé la nation de la destruction. Il a également appelé à la réconciliation nationale. Dans le cadre de ce plan, il a annoncé une nouvelle ordonnance d'indemnisation. Cela accordera une immunité totale aux assassins, qui occupent déjà des postes élevés au sein du nouveau gouvernement. De nombreux Bangladais seraient choqués par cette décision, même si aucun trouble n'a été signalé. Cependant, la Ligue Awami et ses membres les plus purs et durs seront furieux du manque de justice envers leur défunt leader. Des rumeurs circulent déjà à Dacca selon lesquelles le nouveau président court un risque élevé de réaction de la Ligue Awami, car beaucoup souhaitent voir Mujibur Rahman vengé."
 Rahman_Assasination.6.d:0 "Si le régime du président Khondaker Mostaq Khan veut survivre, l'armée doit être maîtrisée. Le coup d'État initial avait été lancé par des officiers de niveau intermédiaire, mais ils n'ont ni l'autorité ni le statut nécessaires pour affirmer leur contrôle sur l'armée. L'actuel chef de l'armée, le général Shafiullah, était un fervent partisan de Mujibur Rahman et n'avait pas vu venir le coup d'État. S'il est retenu, cela pourrait maintenir l'ordre, mais cela mettrait le gouvernement en danger compte tenu de ses opinions politiques. De nombreux responsables recommandent que le général Shafiullah soit mis à la retraite et remplacé par le général Ziaur Rahman. Le général Rahman est considéré comme un officier conservateur, peu susceptible d'être influencé par les loyalistes de Mujibur Rahman. Cependant, c'est un officier ambitieux, et sa promotion pourrait donner à l'armée plus d'influence sur l'État."
 Rahman_Assasination.7.d:0 "Le défunt président Mujibur Rahman cherchait à consolider son pouvoir à travers son parti BakSAL. Le président Khondaker Mostaq Khan a annoncé qu'il dissoudrait immédiatement BakSAL et permettrait à tous les partis politiques de revenir. Il a noté que le parti à État unique a laissé de nombreux Bangladais se sentir privés de leurs droits ou peu impliqués dans la politique du pays. La restauration des partis politiques ramènera le riche activisme politique du peuple et redonnera un caractère plus démocratique au Bangladesh. Cette décision est largement saluée, même si elle suscite certaines inquiétudes. De nombreux responsables politiques craignent que les partis religieux ne profitent de cette nouvelle situation et tentent de manipuler l'électorat en jouant sur les sentiments religieux. Le président a rejeté ces préoccupations et a souligné sa conviction de la compatibilité de l'islam et de la démocratie."
 Rahman_Assasination.8.d:0 "À la suite de l'assassinat de Cheikh Mujibur Rahman et de l'accession au pouvoir du président Khondaker Mostaq Khan, de hauts dirigeants de la Ligue Awami ont été arrêtés. Le nouveau président a reconnu que sa position était très précaire, non seulement à l'égard des officiers militaires qui ont perpétré l'assassinat, mais aussi à l'égard des fidèles de Mujibur au sein du parti. Ces loyalistes, bien que détenus, exercent toujours une énorme influence et pourraient potentiellement susciter une réaction violente de la part de l'aile militante du Parti Awami. Certains hauts responsables recommandent au président de renvoyer ces opposants à la Ligue Awami, avant qu'ils ne s'échappent de prison ou soient libérés. Ils pourraient facilement rallier une opposition hostile au gouvernement. D'autres conseillers estiment que cela pourrait se retourner contre eux et appellent à la réconciliation. La libération des prisonniers politiques pourrait acquérir de la bonne volonté. Une décision doit être prise."
 Rahman_Assasination.9.d:0 "Le général Khaled Mosharaf, un officier supérieur bangladais hautement décoré, travaillant avec des unités militaires pro-Mujibur Rahman, a pris le contrôle du gouvernement du jour au lendemain. Le général Khaled Mosharaf, indigné par l'assassinat et la protection des assassins, a agi à la suite d'informations selon lesquelles de hauts responsables de la Ligue Awami avaient été tués en prison dans des circonstances suspectes. L'actuel chef de l'armée, de hauts responsables du gouvernement, dont le président Khondaker Mostaq Khan et les assassins de Mujibur Rahman, sont soit en détention, soit assignés à résidence. Dans un discours à la nation, Khaled Mosharaf a promis de traduire en justice les assassins de Mujibur Rahman et de rétablir la chaîne de commandement dans l'armée. Quelques heures après l'annonce, des milliers de personnes ont défilé pour commémorer Cheikh Mujibur Rahman, ne craignant plus les représailles du gouvernement. Le général Mosharaf a revendiqué le poste de chef de l'armée et de président."
 Rahman_Assasination.10.d:0 "Le chaos se poursuit au Bangladesh suite aux informations faisant état d'une mutinerie de soldats opposés au coup d'État du général Khaled Mosharaf. La mutinerie est menée par des soldats et des officiers de gauche, dirigés par le colonel à la retraite et leader du JSD Abu Taher. Les mutins arrêtent, tuent, s'en prennent aux officiers fidèles au général Mosharaf ou à feu Mujibur Rahman. Apparemment, de nombreux soldats mutinés pensent que le nouveau chef est un agent indien, déterminé à céder le Bangladesh à l'Inde. Bien que Mosharaf ait revendiqué le titre de chef de l'armée au général Ziaur Rahman, cette revendication n'est pas reconnue dans les rangs. Des combats intenses ont été signalés dans la capitale et autour de la maison où Ziaur Rahman est actuellement détenu. Le temps nous dira ce qui va se passer."
 Rahman_Assasination.11.d:0 "Quelques heures après les informations faisant état d'un soulèvement militaire de gauche, la situation au Bangladesh a de nouveau changé. Le général Khaled Mosharaf, qui avait renversé le gouvernement quelques jours plus tôt, a été tué lors d'un contre-coup d'État lancé par des soldats en révolte. Le général Ziaur Rahman a été libéré de son assignation à résidence et a pris le contrôle du gouvernement, récupérant son titre de chef de l'armée. Agissant rapidement, le général Ziaur a ordonné le rétablissement immédiat de la discipline et de la chaîne de commandement. Des officiers et soldats pro-Mosharaf sont en détention. Tous les prisonniers politiques restants détenus soit par feu le général Mosharaf, soit par l'ancien président Khondaker Mostaq Khan doivent être libérés ou assignés à résidence jusqu'à ce qu'une décision puisse être prise. Les soldats de gauche qui ont libéré Ziaur cherchaient un nouveau gouvernement socialiste, cependant, le général Ziaur a déclaré qu'il reprendrait la situation sans gouvernement ni junte socialiste."
 Rahman_Assasination.12.d:0 "Dans les semaines qui ont suivi un coup d'État et un contre-coup d'État, le général Ziaur Rahman a fermement rétabli l'ordre dans le pays et au sein de l'armée. Les officiers et les soldats impliqués dans les deux complots de coup d'État ont été rapidement arrêtés. Plus particulièrement, le colonel à la retraite Abu Taher, qui a influencé le coup d'État et qui a facilité sa libération de son assignation à résidence, a également été arrêté. Le général Ziaur a souligné que le soulèvement contre le général Mosharaf ne visait pas à rétablir l'ordre mais à amener au pouvoir un État militaire socialiste. Si l'on veut restaurer la discipline, tous ces mouvements doivent être éradiqués des casernes. En plus de rétablir l'ordre dans l'armée, le général Ziaur a supervisé un vaste déploiement de forces de sécurité pour réduire l'anarchie et rétablir l'ordre dans tout le pays. De nombreux Bangladais accueillent favorablement le nouveau sentiment de calme et d'ordre apporté par le nouveau régime."
 Rahman_Assasination.13.d:0 "Un tribunal militaire a condamné le colonel Abu Taher à la pendaison pour ses crimes de trahison et de meurtre. L'ancien leader du JSD est accusé d'avoir supervisé des activités anti-étatiques pendant la période d'insurrection. Il a également été accusé d'avoir organisé l'assassinat du général Khaled Mosharaf et d'autres officiers qui lui étaient fidèles afin de faciliter une prise de pouvoir socialiste brutale au Bangladesh. Son exécution n'augure rien de bon pour ses propres partisans au sein de l'armée, car beaucoup pensaient qu'ils bénéficieraient de l'immunité puisque leurs actions ont contribué à faciliter le retour au pouvoir du général Ziaur. Cependant, le général Ziaur reconnaît que l'influence d'idéologies et de personnalités extérieures a paralysé la discipline et l'ordre au sein de l'armée. Sa détention massive et les procès d'officiers militaires éminents impliqués dans les récents coups d'État visent à rétablir la discipline dans les casernes."
 Rahman_Assasination.14.d:0 "Le général K.M. Shafiullah, chef de l'armée du Bangladesh et héros de guerre populaire, a renversé le président Khondaker Mostaq Khan. Le général a agi suite à des informations selon lesquelles plusieurs membres de la Ligue Awami seraient morts dans des circonstances mystérieuses en prison. Pour le général Shafiullah, c'était le dernier tirage au sort. Un éminent partisan de Mujibur Rahman, il avait été choqué par son assassinat, mais avait contribué à maintenir l'unité de la nation par la suite. Cependant, l'échec du président Mostaq Khan à traduire les assassins en justice et les récents meurtres suspects dans les prisons ont rendu la situation intolérable pour le général et ses officiers supérieurs. Les troupes bangladaises sont dans les rues. Dans un discours à la nation, le nouveau dirigeant a promis justice pour feu Mujibur Rahman et stabilité pour une nation secouée par l'instabilité."
 Rahman_Assasination.15.d:0 "Le colonel à la retraite Abu Taher, ancien dirigeant du JSD, a organisé un soulèvement marxiste composé d'officiers subalternes et de soldats fidèles à la vision d'une révolution socialiste. Les soldats de gauche ont rapidement pris le contrôle des principales formations et assassiné le général K.M. Shafiullah. Des combats sporadiques ont été signalés dans les cantonnements militaires du pays. La résidence du chef de l'armée serait également le théâtre de tirs intenses. Il semble que le colonel Taher cherche à profiter de l'instabilité actuelle du pays pour établir un État socialiste révolutionnaire. Les heures à venir révéleront toute évolution de la situation sur le terrain."
 Rahman_Assasination.16.d:0 "Le contre-putsch de gauche contre le général K.M. Shafiullah s'est effondré dans le désordre. Le populaire chef de l'armée a pu rallier ses partisans et donner des ordres rapidement pendant les violences. Ses propres troupes fidèles ont réussi à empêcher une équipe d'assassins de cibler le général à son domicile. Des milliers de soldats rebelles, d'officiers et de sympathisants civils sont en détention. Ils devraient être jugés. Le colonel Abu Taher, qui avait organisé la tentative, a été tué au cours des combats. S'adressant à la nation, le général Shafiullah a félicité les forces armées pour leur fermeté dans leur devoir envers la nation. Son pouvoir étant fermement consolidé, il peut désormais se concentrer sur la restauration de la révolution, comme l'envisageait feu Mujibur Rahman."
 Rahman_Assasination.17.d:0 "Le JSD, profitant des luttes militaires internes entre les hauts commandants, a capturé un certain nombre d'installations militaires. Des officiers et soldats pro-JSD présents dans plusieurs bases se sont joints aux rebelles à l'extérieur pour s'emparer des installations. Cette action a réussi à couper quelques officiers supérieurs de leurs propres unités loyales. La tentative d'organisation d'une réponse unifiée du général Khaled Mosharaf a échoué car de nombreuses unités continuent de refuser ses commandements ou de le reconnaître comme chef de l'armée. Abu Taher, le chef du JSD et ancien colonel, coordonnerait les mouvements du JSD depuis un centre de communication récemment capturé."
 Rahman_Assasination.18.d:0 "Les efforts tumultueux du général Khaled Mosharaf pour prendre le pouvoir se sont soldés par son assassinat. Les détails restent flous, mais il semblerait que des soldats rebelles, peut-être fidèles au JSD, l'aient abattu alors qu'il coordonnait des opérations contre son opposition. Le leader du JSD, Abu Taher, a rapidement annoncé à la radio d'État que le JSD avait pris le contrôle et apporterait la sécurité à la population. Des véhicules militaires patrouillent désormais dans les rues, transportant des groupes mixtes de combattants du JSD et de soldats pro-JSD. Les officiers supérieurs opposés à Khaled Mosharaf et au JSD seraient détenus par le JSD. Les luttes intestines chaotiques entre les hauts responsables militaires ont ouvert la voie à une prise de contrôle totale du JSD."

 Khondaker_Regime.1.d:0 "Les tensions s'accroissent au sein de l'armée. Les officiers professionnels, formés pendant la période coloniale et pakistanaise, continuent de s'affirmer comme les officiers les plus élitistes de l'armée. Les combattants de la liberté et les combattants de la jeunesse d'avant l'indépendance ont été intégrés dans l'armée après l'indépendance. Les personnes promues officiers se plaignent que les officiers professionnels les marginalisent, empêchant ainsi leur promotion. Les officiers professionnels exigent que nous soutenions leur politique de conversion des éléments intégrés dans leur vision de l'Armée de terre. Les anciens combattants de la liberté prônent la création d'une armée populaire plus nationale. Le président doit décider quelle faction soutenir."
 Khondaker_Regime.2.d:0 "Le président Khondaker Mostaq Ahmad a rendu hommage aux assassins de Cheikh Mujibur Rahman dans un récent discours. Il a appelé les assassins fils du soleil pour leurs actes. Il a affirmé que si les officiers n'avaient pas agi, le gouvernement et la nation risquaient de s'effondrer totalement. Dans ses remarques finales, il a appelé la nation à se rassembler et a terminé son discours avec le Bangladesh Zindabad. Changeant notamment le slogan précédent de Joy Bangla. Ces remarques sont accueillies avec une réaction de surprise et de colère. De nombreux Bangladais sont désormais convaincus que leur nouveau dirigeant est impliqué dans cet assassinat. Les loyalistes de feu Mujibur Rahman seraient furieux de ces remarques."
 Khondaker_Regime.3.d:0 "Les Bangladais craignent de plus en plus que l'Inde jouisse de trop de privilèges et d'influence dans le pays. Ce sentiment est particulièrement répandu parmi les officiers. Le gouvernement mettra en oeuvre une nouvelle politique étrangère pour réduire l'influence indienne sur le pays. Nous augmenterons les restrictions aux passages frontaliers, appellerons l'Inde à réduire ses missions diplomatiques et mettrons en oeuvre davantage de restrictions commerciales. Nous avons divulgué certaines informations à l'avance et le public semble être d'accord avec cette nouvelle orientation politique. Les Indiens doivent savoir qu'ils ne peuvent pas empiéter sur notre souveraineté."
 Khondaker_Regime.4.d:0 "Le cabinet a noté que la précédente politique de nationalisation de l'économie avait été mise en oeuvre beaucoup trop rapidement dans le pays. Il affirmait son soutien à une société dans laquelle les travailleurs, la nation et l'économie pourraient tous prospérer ensemble. Cependant, les rapports d'experts ont confirmé que l'État n'avait pas la capacité de gérer efficacement toutes les industries qu'il avait nationalisées. À ce titre, le cabinet a décidé d'un programme visant à privatiser un certain pourcentage des industries publiques. Le gouvernement espère que cela stimulera les dépenses et stimulera une croissance dynamique de l'économie. Plusieurs syndicats et responsables de la Ligue Awami ont exprimé leur inquiétude face à cette décision. Cependant, de nombreux Bangladais qui souffrent d'une économie stagnante sont prêts à tout tenter pour favoriser la croissance."

 Shafiullah.1.d:0 "Le général K.M. Shafiullah, administrateur en chef de la loi martiale du Bangladesh, a rencontré ses hauts commandants militaires pour discuter du sort de ceux qui ont tué Cheikh Mujibur Rahman. Un groupe d'officiers estime qu'un procès public devrait avoir lieu au cours duquel les détails brutaux de l'assassinat puissent être compris par la population. Les tueurs pourront alors être exécutés pour rendre justice à la nation entière. Cependant, un autre groupe d'officiers craint qu'un tel procès n'entraîne des réactions négatives contre l'armée dans son ensemble. Au lieu de cela, ils soutiennent que les assassins devraient être jugés devant une cour martiale privée, afin de minimiser la rhétorique anti-militaire et de montrer à la nation comment l'armée traite les traîtres. Le président Shafiullah doit prendre une décision difficile."
 Shafiullah.2.d:0 "Le procès public des officiers militaires impliqués dans l'assassinat de Cheikh Mujibur Rahman s'est terminé aujourd'hui. La nation a été stupéfaite d'apprendre comment un groupe d'officiers de niveau intermédiaire se sont armés, ont pris d'assaut la résidence de Rahman et l'ont massacré, ainsi que sa famille. Ce n'est que parce qu'ils n'étaient pas à la campagne que ses deux filles ont été épargnées. L'accusation a laissé entendre que des officiers supérieurs de l'armée pourraient avoir facilité le coup d'État en privé, mais le gouvernement a déjà annoncé qu'il n'y aurait pas d'autres procès. Les huit assassins, dont trois majors, ont tous affirmé avoir agi pour sauver la nation de la corruption et de la dictature. Le verdict sera annoncé dans quelques jours, et beaucoup s'attendent à un verdict de culpabilité suivi d'une exécution."
 Shafiullah.3.d:0 "L'armée bangladaise a annoncé que sa cour martiale rendrait prochainement le verdict des huit hommes impliqués dans l'assassinat du défunt président Sheikh Mujibur Rahman. Les détails du procès ont été cachés au grand public. L'armée a affirmé que l'affaire relevait de la juridiction militaire et qu'elle veillerait à ce que justice soit rendue. Bien qu'il y ait eu au départ un certain mécontentement du public quant au respect de la vie privée dans cette affaire, de nombreux Bangladais attendent avec impatience de connaître la décision. Les avocats civils des accusés n'ont pas été autorisés à participer à la cour martiale et ont qualifié le procès de simulacre. Le procès suscite également la méfiance de la part des médias indiens."
 Shafiullah.4.d:0 "Les assassins de Cheikh Mujibur Rahman ont été condamnés à mort hier par le tribunal. Les huit hommes seront pendus dans les prochains jours. Des milliers de partisans de la Ligue Awami sont descendus dans la rue pour célébrer cette justice rendue à leur défunt leader. Le tribunal n'a pas été convaincu par l'argument des assassins selon lequel ils ont tué le président pour empêcher une dictature et sauver la nation. Le général K.M. Shafiullah, l'actuel président, a salué la décision du tribunal. Trois majors de l'armée figurent parmi les condamnés. Bien que le gouvernement et la Ligue Awami accueillent favorablement cette nouvelle, des rapports font état de troubles au sein de l'armée et dans les cercles plus conservateurs. Ils pensent que les accusés sont considérés comme des boucs émissaires et présentés de manière à calomnier l'armée et d'autres partis politiques conservateurs. De nombreux officiers militaires pensaient que la destitution de Mujibur Rahman était justifiée compte tenu de ses actions politiques et de sa proximité avec l'Inde."
 Shafiullah.5.d:0 "L'armée a annoncé le verdict de sa cour martiale : les huit personnes impliquées dans l'assassinat de Cheikh Mujibur Rahman et sa famille ont été condamnées à mort. L'armée a ajouté que les exécutions par pendaison avaient déjà eu lieu. La nouvelle a surpris de nombreuses personnes dans le pays. Un grand rassemblement de la Ligue Awami en l'honneur de feu Mujibur Rahman a été organisé à la hâte. Beaucoup dans le pays ont critiqué le procès militaire en raison de sa nature secrète, mais ont salué le verdict. Au sein de l'armée, certains estiment que le tribunal a fait des accusés des boucs émissaires. Ces officiers estiment que l'assassinat était justifié en raison de l'instabilité politique qui sévit dans le pays. Le gouvernement a publié une déclaration saluant cette nouvelle et confirmant qu'il n'y aurait pas d'autres procès liés à l'assassinat. Pour de nombreux Bangladais, l'incident est résolu, du moins pour le moment."
 Shafiullah.6.d:0 "Les officiers et les soldats issus du mouvement de résistance pré-indépendance connu sous le nom de Mukti Bahini qui ont rejoint l'armée nationale se plaignent d'être isolés au sein de l'armée. Ils affirment que les soldats et officiers d'avant l'indépendance, tous formés professionnellement, veillent systématiquement à ce que le personnel des FM ne reçoive pas de promotions ou de postes attractifs. Le président doit décider s'il permet que l'armée reste dominée par la classe militaire professionnelle, ou s'il insiste sur une véritable intégration des forces. Soutenir la classe militaire professionnelle permettrait de maintenir la structure militaire telle quelle, le personnel des FM étant finalement mis à la retraite. Soutenir le personnel des Frères musulmans poussera l'armée vers une organisation militaire plus populaire."
 Shafiullah.7.d:0 "Depuis son arrivée au pouvoir, le général K.M. Shafiullah a travaillé sans relâche pour identifier et neutraliser les menaces contre l'État. Les éléments conservateurs les plus militants ont été largement neutralisés avant même son arrivée au pouvoir. Cependant, les marxistes se livrent depuis longtemps à des actes de violence et à des infiltrations hostiles à la fois du gouvernement et de l'armée. En réponse à cette menace, le général Shafiullah a récemment ordonné une répression massive des organisations marxistes dangereuses à travers le pays. Les forces de sécurité ont arrêté des responsables gouvernementaux, militaires et publics identifiés comme pro-marxistes. En outre, un certain nombre de dirigeants étudiants et d'agitateurs ruraux ont également été arrêtés. Dans son discours à la nation, le général Shafiullah a souligné que le socialisme est un moyen d'émancipation économique, mais que le marxisme représente une menace pour la religion et la culture des Bangladais."
 Shafiullah.8.d:0 "Le général K.M. Shafiullah, administrateur en chef de la loi martiale du Bangladesh, a annoncé que de nouvelles élections auraient lieu dans un avenir proche. Le respecté héros de guerre a souligné que son régime rétablissait la stabilité. Dans la société et dans les institutions étatiques. Le dirigeant n'a pas donné de date précise sur la date à laquelle les élections auraient lieu, mais a déclaré que la criminalité et la corruption devaient être encore réduites pour qu'une élection soit possible. Il a ajouté qu'après les élections, il prendrait sa retraite de l'armée, après avoir accompli son devoir envers la nation et envers feu Cheikh Mujibur Rahman. Tous les partis politiques seront autorisés à participer et à faire campagne ouvertement. L'annonce a été bien accueillie dans tout le Bangladesh. La Ligue Awami semble prête à démarrer sa campagne tandis que les partis d'opposition devraient former une coalition pour s'y opposer. Même s'il n'y a pas de date ferme pour les élections, la population est satisfaite de l'évolution actuelle du pays."

 ZR_Regime.1.d:0 "Le général Ziaur Rahman, administrateur en chef de la loi martiale au Bangladesh, a prononcé un discours émouvant à la nation. Il a noté que le peuple avait surmonté une grande adversité ces dernières années, et que beaucoup étaient divisés selon des critères politiques, religieux et de classe. Zia a déclaré que le temps était venu pour la guérison et la stabilité. Il a ensuite promis au peuple une politique d'espoir, fondée sur un regard tourné vers l'avenir et non vers le passé. Construit non pas sur la destruction ou l'attaque des opposants, mais sur l'unité nationale et le développement pacifique. Il a promis des élections une fois que la situation se serait stabilisée. Ces commentaires sont bien accueillis par une population bangladaise assiégée et avide de paix et de stabilité."
 ZR_Regime.2.d:0 "Le peuple du Bangladesh s'est rendu aux urnes pour élire un nouveau président. L'administrateur en chef de la loi martiale, le général Ziaur Rahman, a remporté une victoire écrasante. Il s'agit d'une victoire majeure pour son nouveau parti politique, le Parti nationaliste du Bangladesh, qui a contribué à rallier le soutien populaire pendant la campagne électorale. Même si le général Zia n'a pas tardé à remercier les électeurs de lui avoir permis d'obtenir une telle victoire écrasante, les observateurs internationaux ont noté des irrégularités. Malgré ces informations sur l'intégrité du vote, de nombreux Bangladais semblent avoir accueilli favorablement le résultat. La Ligue Awami a publié une déclaration critiquant le processus de vote."
 ZR_Regime.3.d:0 "Cheikh Hasina, fille du président assassiné Cheikh Mujibur Rahman, a demandé l'autorisation de rentrer. Elle et sa soeur étaient à l'étranger lorsque des officiers militaires rouges ont massacré leur famille. La Ligue Awami reconnaît Sheikh Hasina comme l'héritière de Mujibur Rahman et les gouvernements précédents lui ont refusé la permission de revenir. Pour la présidente Zia, son retour donnera un élan majeur à la Ligue Awami. Cependant, refuser son retour pourrait déclencher des troubles et amener les gens à remettre en question sa propre intégrité, car il a promis aux gens qu'il se concentrerait sur l'avenir et non sur le passé. L'autorisation a finalement été accordée, permettant à Cheikh Hasina de rentrer chez elle pour assumer le rôle que son père a occupé pendant tant d'années."
 ZR_Regime.4.d:0 "Le président Ziaur Rahman a approuvé un nouvel amendement constitutionnel ajoutant la loi sur l'indemnisation à la constitution. La loi sur l'indemnisation a été adoptée pour accorder l'immunité aux assassins de Cheikh Mujibur Rahman. Le président Zia a insisté sur le fait que sa décision visait à guérir la nation et à s'éloigner d'une politique de vengeance ou de griefs. La Ligue Awami et les partisans de feu Cheikh Mujibur Rahman ont condamné l'amendement. Ils accusent le président de s'être rangé du côté des assassins et de protéger ses propres alliés politiques qui pourraient avoir été impliqués dans les coulisses. Certaines publications sont allées jusqu'à accuser le président Zia d'avoir adopté l'amendement visant à mettre fin à toute enquête sur son propre rôle dans l'assassinat. Le président a également confirmé la légalisation des partis conservateurs et religieux initialement interdits par la Ligue Awami."
 ZR_Regime.5.d:0 "Le président Ziaur Rahman reconnaît la popularité et les avantages du socialisme sur l'économie. Certaines industries d'État restent populaires dans l'esprit du peuple. Toutefois, l'économie reste faible et une nouvelle approche doit être testée. Le gouvernement a annoncé qu'il gèlerait toute nouvelle nationalisation, ouvrant ainsi plusieurs secteurs peu performants à la privatisation. En outre, une série de nouvelles politiques destinées à promouvoir la croissance du secteur privé ont été lancées. Le gouvernement espère que la transition vers une économie de marché pourra stimuler la croissance et réduire naturellement la nationalisation."
 ZR_Regime.6.d:0 "Historiquement, deux fois par an, avant la récolte, les agriculteurs bangladais courent le risque de mourir de faim. La disponibilité alimentaire pendant cette période est faible, tout comme les opportunités économiques. De nombreuses famines et famines se sont produites pendant cette période. Le président Ziaur Rahman a dévoilé un nouveau programme « vivres contre travail » pour mettre fin au cycle de la famine. Dans le cadre de ce programme, les agriculteurs bangladais, pendant ces périodes de soudure, seront employés pour travailler sur des programmes d'infrastructure gouvernementaux en échange de nourriture. La nourriture fournie sauvera ces familles et évitera une famine massive. Le gouvernement estime qu'en plus de fournir un service public à la population, le programme renforcera l'économie en assurant la stabilité agricole tout au long de l'année."
 ZR_Regime.7.d:0 "Il existe une inquiétude croissante, en particulier parmi les officiers militaires, quant à notre dépendance à l'égard du soutien indien. Le gouvernement est sous pression pour trouver une source alternative d'équipement militaire afin d'empêcher l'Inde d'accéder à une influence hégémonique. La Chine possède l'équipement, la technologie et est géographiquement proche de nous. Le ministre des Affaires étrangères effectuera prochainement un voyage et pourrait demander aux Chinois d'apporter leur soutien à l'armée bangladaise. D'autres membres du cabinet estiment que le déplacement vers la Chine pourrait conduire à une correction excessive, leur donnant trop d'influence au fil du temps, et demandent que nous utilisions simplement ce voyage pour renforcer les liens existants."
 ZR_Regime.8.d:0 "Une délégation de grande puissance du Bangladesh a récemment demandé une expansion des relations bilatérales. Ils étaient particulièrement intéressés par l'acquisition de chars. De nombreux officiers bangladais, formés à l'époque où le pays faisait partie du Pakistan, connaissent notre technologie. Cela représente un effort du Bangladesh pour se détourner de l'Inde et nous permettre une plus grande influence dans le pays. Le Bangladesh possède des ports clés menant au golfe du Bengale. Certains hauts responsables ne croient pas que le Bangladesh se détournera véritablement de l'Inde ou offrira grand-chose en retour ; ils suggèrent que nous nous engageons simplement à élargir nos relations bilatérales et commerciales."
 ZR_Regime.9.d:0 "Le gouvernement chinois a confirmé qu'il commencerait le transfert de plus de deux cents chars pour l'armée bangladaise. Le gouvernement a salué la nouvelle, tout comme les médias. L'armée est ravie du nouvel équipement, estimant qu'il constitue un puissant moyen de dissuasion pour la nation face à une agression étrangère. Au niveau national, le gouvernement est salué pour son sens politique et sa capacité à négocier avec les grandes puissances. Les Chinois devraient étendre leur présence diplomatique dans le pays pour faciliter le nouvel accord."
 ZR_Regime.10.d:0 "Dès son indépendance, le Bangladesh a adopté une idéologie laïque. Malheureusement, de nombreux États musulmans ont interprété à tort cela comme une suppression de l'identité islamique, alors que cela était loin d'être la vérité. Le Bangladesh est toujours resté une nation pieuse. Le président Ziaur Rahman a publiquement rendu les salutations et invocations islamiques lors d'événements publics, indiquant que même si le gouvernement reste laïc, il ne cachera pas l'identité islamique du peuple. Une fois nos références religieuses assurées, nous pouvons désormais nous rapprocher de l'Arabie saoudite pour normaliser les pourparlers et trouver des opportunités pour notre peuple dans ce riche royaume."
 ZR_Regime.11.d:0 "Le gouvernement du Bangladesh nous a contacté en privé pour nous demander de tenir des pourparlers. Ils cherchent à normaliser les liens avec notre peuple. Nos relations étroites avec le Pakistan et leur adoption initiale de la laïcité au détriment de l'identité islamique ont auparavant freiné les relations. Le Pakistan ne semble plus trop préoccupé par les relations extérieures avec le Bangladesh. Le gouvernement actuel du Bangladesh a également mis l'accent sur l'identité islamique de son peuple. Tenir des pourparlers et normaliser les liens contribuerait grandement à soutenir ce gouvernement pro-islam."
 ZR_Regime.12.d:0 "L'Arabie saoudite et le Bangladesh ont signé une série d'accords, renforçant les liens bilatéraux, élargissant les missions diplomatiques et acceptant des réunions interministérielles régulières. Les Bangladais seraient satisfaits de cet accord, car le nombre de pèlerins du Hajj a également augmenté. Le récent engagement avec l'Arabie Saoudite représente un effort plus large du gouvernement pour s'engager plus directement avec les nations musulmanes plutôt que socialistes."
 ZR_Regime.13.d:0 "Depuis la normalisation des relations, notre personnel diplomatique et d'autres visiteurs ont été frappés par le grand nombre de Bangladais formés professionnellement. En outre, il y a des millions de personnes dans la rue, prêtes à travailler, mais incapables de le faire en raison de la faiblesse de l'économie. Nous avions signé des contrats avec des travailleurs bangladais pour venir travailler en Arabie Saoudite. Nous leur offrons des salaires élevés et d'autres avantages, à condition qu'ils ne rompent pas avec les coutumes sociales et acceptent de rester des travailleurs invités, et non des résidents ou des citoyens. Le gouvernement du Bangladesh a récemment proposé que nous formalisions davantage le programme des travailleurs invités afin de faciliter l'accueil d'un plus grand nombre de travailleurs et de maximiser les envois de fonds qu'ils renvoient. Cela transformera notre désespoir en matière d'économie de travail."
 ZR_Regime.14.d:0 "Après plusieurs discussions, le cadre d'un accord pour les travailleurs invités a été défini. L'Arabie Saoudite pourra recruter dans notre pays toute la main-d'oeuvre non qualifiée et professionnelle qu'elle souhaite. Nous avons un excédent de main-d'oeuvre et l'Arabie saoudite offre d'immenses opportunités à la population. Les agents invités, les entreprises et la publicité seront librement autorisés. En échange, nos travailleurs bénéficieront d'un niveau de vie élevé par rapport à leur pays d'origine et de la possibilité de transférer facilement leurs gains à leurs familles. Nous espérons que les deux pays en bénéficieront grandement dans les années à venir."
 ZR_Regime.15.d:0 "Plusieurs années après l'accord sur les travailleurs invités avec l'Arabie Saoudite, les effets se font déjà sentir. De nombreuses familles de la classe moyenne, autrefois pauvres ou en difficulté, acquièrent désormais de nouvelles maisons, une éducation de haute qualité pour leurs enfants et des biens de consommation. L'afflux de fonds en provenance d'Arabie Saoudite est à l'origine de ce boom. Notre économie, habituellement en difficulté, est bien servie par le vaste programme de travailleurs invités, car l'argent envoyé depuis l'Arabie saoudite soutient tous les principaux secteurs de l'économie. Le gouvernement est largement félicité pour son initiative concernant ce programme, ces nouvelles familles de travailleurs invités étant surnommées la classe moyenne à la croissance la plus rapide au Bangladesh."
 ZR_Regime.16.d:0 "Dans le cadre des liens florissants avec l'Arabie saoudite, le gouvernement bangladais lui a donné la permission de financer une nouvelle madrassa dans le pays. La nouvelle et grande école, entièrement financée par les Saoudiens, offrira une éducation islamique aux garçons de tout le Bangladesh. L'ambassadeur saoudien a fait l'éloge de la nouvelle école, la qualifiant de première parmi tant d'autres qui contribueront à renforcer les liens islamiques qui unissent le monde musulman. De nombreux Bangladais accueillent favorablement les nouvelles écoles car elles offrent des cours, un internat et de la nourriture gratuits. Ce qui les rend idéaux pour les familles les plus pauvres. Le président du Bangladesh a publié sa propre déclaration faisant l'éloge de la nouvelle école."
 ZR_Regime.17.d:0 "Depuis la séparation du Pakistan, les relations se sont refroidies. Cependant, de nombreuses personnes dans le pays ressentent encore un lien idéologique et religieux avec le Pakistan. Nous sommes les deux États islamiques du sous-continent. Plusieurs conseillers principaux pensent que tendre la main au Pakistan peut rétablir des liens historiques et nous offrir une voie potentielle au cas où les liens avec l'Inde se détérioreraient. Nous pouvons demander à un État intermédiaire d'approcher les Pakistanais pour mener des négociations. Un grand nombre de Bangladais ont des opinions négatives à l'égard du Pakistan ; la décision de s'engager doit donc être mûrement réfléchie."
 ZR_Regime.18.d:0 "Un ambassadeur d'un État intermédiaire nous a envoyé un message indiquant que le Bangladesh souhaitait engager des négociations. Bien que la séparation ait laissé des souvenirs amers, beaucoup au Pakistan souhaitent toujours que notre nation entretienne des liens fraternels avec tous les États musulmans. Il existe encore de nombreux Bangladais de haut rang, notamment dans l'armée, qui ont été formés dans les écoles pakistanaises. Nous pouvons proposer d'accueillir des négociations pour améliorer les relations bilatérales et potentiellement commerciales. Ou nous pouvons nous concentrer sur l'amélioration des relations bilatérales tout en proposant une formation militaire, afin de rétablir les liens de défense entre nos nations. Le gouvernement doit décider quelle approche il souhaite proposer aux Bangladais avant que les négociations puissent avoir lieu."
 ZR_Regime.19.d:0 "Le gouvernement pakistanais s'est montré réceptif à nos efforts pour améliorer la situation. Nombreux sont ceux au Pakistan qui pensent qu'en dépit d'un passé difficile, les États musulmans doivent rester unis en Asie du Sud. Certains éléments indiquent que les Pakistanais seraient disposés non seulement à améliorer leurs contacts diplomatiques, mais également à renforcer leurs liens commerciaux. Nous pouvons décider dans quelle mesure il convient d'améliorer les relations bilatérales. Quelle que soit notre décision, nous pouvons nous attendre à une réaction de la part de New Delhi. Le peuple du Bangladesh attend avec impatience la normalisation d'une nation que tant d'entre nous ont eu du mal à fonder."
 ZR_Regime.20.d:0 "Le gouvernement pakistanais s'est montré réceptif à nos efforts pour améliorer la situation. Nombreux sont ceux au Pakistan qui pensent qu'en dépit d'un passé difficile, les États musulmans doivent rester unis en Asie du Sud. Certains éléments indiquent que les Pakistanais seraient disposés non seulement à améliorer les contacts diplomatiques, mais également à proposer une formation militaire. Beaucoup de nos officiers ont été formés par l'armée pakistanaise et le maintien de tels contacts pourrait s'avérer bénéfique à mesure que nous renforçons nos propres capacités militaires. Cependant, nous devrions garder les liens militaires privés, car de nombreux Bangladais pourraient ne pas réagir positivement à de telles nouvelles. Nous pourrions également choisir de nous concentrer uniquement sur l'amélioration des relations bilatérales."
 ZR_Regime.21.d:0 "L'ambassadeur indien a délivré un message depuis New Delhi exprimant son mécontentement face à nos récentes négociations avec le Pakistan. Le gouvernement indien n'est pas satisfait du renforcement des relations bilatérales. Nous avons informé les Indiens que nos relations étaient nos propres affaires. Quoi qu'il en soit, les Indiens ont annulé certains de nos programmes d'échanges culturels et ajouté certaines restrictions au commerce. C'est regrettable, mais nous ne pouvons accepter une situation dans laquelle l'Inde dicte la politique étrangère du Bangladesh. Les médias rapportent cette dispute, mais le public soutient largement notre position."

 JAF_472.1.d:0 "L'Armée rouge japonaise (JRA) a réussi à détourner le vol 472 de Japan Airlines depuis Bombay. Cinq pirates de l'air armés ont pris le contrôle de l'avion et ont dirigé le pilote vers Dacca. Les pirates de l'air sont désormais assis dans l'avion, sur le tarmac, tenant en otage les 156 passagers et membres d'équipage. La JRA réclame six millions de dollars et la libération de neuf membres de la JRA emprisonnés. Le gouvernement japonais tient une réunion d'urgence pour discuter d'une réponse. Le gouvernement bangladais a encerclé l'avion mais attendra la réponse japonaise. Le président Ziaur Rahman s'entretient avec ses hauts responsables de la sécurité."
 JAF_472.2.d:0 "Des troubles ont été signalés au cantonnement de Bogra. La récente crise des otages de la compagnie aérienne japonaise à Dacca a donné lieu à des rumeurs et à des troubles parmi le personnel militaire antigouvernemental qui croit qu'un coup d'État plus large est en train de se produire. Des troupes armées ont été vues prendre le contrôle des bâtiments du gouvernement local et des officiers supérieurs du cantonnement seraient en état d'arrestation. Une colonne de troupes fidèles fut envoyée à Bogra. Après une confrontation tendue, la rébellion a été réprimée. Cependant, la répression de Bogra n'a pas mis fin aux rumeurs et des révoltes similaires ont été signalées dans d'autres garnisons. Le gouvernement doit se préparer à de nouveaux incidents."
 JAF_472.3.d:0 "Une attaque contre la résidence du président Ziaur Rahman a été déjouée. Des membres antigouvernementaux de l'armée de l'air et des sympathisants de l'armée ont lancé une révolte, croyant qu'ils soutenaient un coup d'État national contre le président. Les troupes rebelles ont temporairement saisi Radio Dacca et à l'aéroport international, au moins deux douzaines de membres de l'armée de l'air, dont des officiers, ont été tués. Ces officiers négociaient avec les terroristes de l'Armée rouge japonaise qui détenaient actuellement en otage un vol de Japan Airlines sur la piste. Heureusement, les commandants locaux des secteurs de l'armée de l'air et de l'armée ont réussi à réprimer la révolte, arrêtant de nombreux rebelles. Le gouvernement a ordonné à l'armée d'arrêter immédiatement tout membre du personnel dissident."
 JAF_472.4.d:0 "Un vol de Japan Airlines en provenance de Bombay a récemment été détourné par des membres armés de l'Armée rouge japonaise. L'avion se trouve actuellement à Dacca, les pirates de l'air réclament six millions de dollars et la libération de neuf de leurs membres emprisonnés. L'opinion publique est catégorique : nous devons ramener les 156 otages sains et saufs. Nos partenaires internationaux nous exhortent à refuser ces demandes, affirmant que cela créerait un mauvais précédent non seulement pour la communauté mondiale mais aussi pour le Japon. Cependant, le sentiment de notre peuple et de la plupart des responsables est que sauver des vies humaines, quel qu'en soit le prix, doit être l'idéal directeur. Une décision doit être prise."
 JAF_472.5.d:0 "Le gouvernement a accepté les demandes des pirates de l'air de l'Armée rouge japonaise. Un vol de Japan Airlines est affrété à destination de Dacca avec les six millions de dollars destinés aux preneurs d'otages. L'avion ramènera également les 156 otages. Nous avons également libéré les prisonniers, comme demandé. Bien que de nombreuses personnes à l'échelle internationale condamnent cette décision comme visant à apaiser le terrorisme, le Premier ministre a publié une déclaration, soulignant que la vie d'une seule personne dépasse celle de la terre. Ce sentiment trouve un écho auprès du peuple japonais qui accueille favorablement la nouvelle. Une fois la situation résolue, le gouvernement a également annoncé son intention de créer une force antiterroriste robuste pour gérer de futures crises comme celle-ci."
 JAF_472.6.d:0 "Le gouvernement japonais a refusé les demandes des pirates de l'air de l'Armée rouge japonaise qui détiennent actuellement un avion de 156 otages sur le tarmac de Dacca. Il s'agit d'une escalade majeure, et l'on craint que les pirates de l'air n'agissent de manière imprudente. En apprenant la nouvelle, les pirates de l'air ont demandé au gouvernement du Bangladesh de ravitailler l'avion et de l'autoriser à décoller. Le président Ziaur Rahman est confronté à un choix difficile : il peut accéder à la demande, permettant ainsi à la crise de quitter le Bangladesh, ou envoyer des troupes pour prendre d'assaut l'avion. Prendre d'assaut l'avion sera incroyablement risqué, mais montrera aux terroristes que le Bangladesh n'est pas un endroit à partir duquel émettre des exigences ou mener des opérations."
 JAF_472.7.d:0 "Le détournement du vol 472 de Japan Airlines se poursuit après que le gouvernement du Bangladesh a fait le plein de carburant et lui a permis de quitter le pays. L'avion se dirige vers le Moyen-Orient, mais aucune destination finale n'a été communiquée. Cinq membres armés de l'Armée rouge japonaise ont pris l'avion en otage depuis Bombay et l'ont atterri à Dacca. Ils ont exigé la libération de plusieurs membres au Japon ainsi que six millions de dollars. Le gouvernement japonais a refusé ces demandes. Pour éviter une escalade violente, le gouvernement bangladais a accédé à la demande terroriste selon laquelle l'avion serait ravitaillé en carburant et autorisé à repartir avec ses otages. Le président Ziaur Rahman du Bangladesh a exprimé son souhait que la crise soit résolue sans perte de vies innocentes."
 JAF_472.8.d:0 "Lors d'un assaut nocturne époustouflant, des commandos bangladais ont pris d'assaut le vol 472 de la Japan Airlines. Le vol a récemment été détourné par des membres armés de l'Armée rouge japonaise après son décollage de Bombay. L'avion a été conduit à Dacca où les pirates de l'air ont exigé des millions de dollars et la libération de ses membres des prisons japonaises. Après que le gouvernement japonais ait refusé ses demandes, le gouvernement bangladais a décidé d'agir pour empêcher l'assassinat des otages. L'opération visant à prendre d'assaut l'avion n'a duré que quelques minutes, mais a donné lieu à des échanges de tirs nourris et à des explosions. L'armée bangladaise a confirmé que l'avion était sécurisé et que les terroristes étaient neutralisés. Interrogée sur l'état des otages, l'armée a admis qu'il y avait eu un certain nombre de victimes, mais que la plupart avaient été secourues en toute sécurité."
 JAF_472.9.d:0 "La récente crise de Japan Airlines a donné lieu à des rumeurs à travers le Bangladesh, entraînant des rébellions armées de militaires antigouvernementaux. Ces hommes pensaient que le gouvernement s'était effondré ou qu'un coup d'État plus large était en cours, entraînant des soulèvements majeurs dans les bases. Ces rébellions ont été rapidement réprimées et de nombreux meneurs ont été arrêtés. Le président Ziaur Rahman a reçu deux listes, dont celle de tous les militaires impliqués dans les troubles. L'autre liste comprend des policiers, des services de renseignement et d'autres membres des forces de sécurité soupçonnés d'avoir facilité les soulèvements. Il doit décider s'il doit purger uniquement l'armée ou l'ensemble de son appareil de sécurité de ses ennemis."
 JAF_472.10.d:0 "La crise des otages de la compagnie aérienne japonaise a provoqué la propagation de rumeurs folles dans les bases militaires du pays. Une précédente mutinerie antigouvernementale à Bogra avait été réprimée avec succès, mais le soulèvement qui y a eu lieu a incité les soldats pro-JSD à Dacca à lancer leur propre coup d'État. Les soldats rebelles, avec le soutien des combattants locaux du JSD, ont non seulement pris le contrôle du cantonnement, mais ont également capturé le président Ziaur Rahman. De nombreux officiers supérieurs de l'armée bangladaise, qui étaient avec le président pour discuter de la crise des otages, ont également été capturés. Les éléments pro-JSD prennent désormais le contrôle des bases militaires à travers le pays, les forces loyalistes étant paralysées de toute action en raison du manque de leadership."
 JAF_472.11.d:0 "Le JSD a annoncé la formation d'un nouveau gouvernement. Des militaires pro-JSD ont récemment lancé un coup d'État, motivés par des rumeurs liées à la crise actuelle des otages de la compagnie aérienne japonaise. Le président ainsi que de hauts responsables militaires ont été capturés par les soldats rebelles, inspirant les combattants du JSD et leurs partisans à prendre le contrôle du pays. Le JSD affirme qu'il apportera le socialisme au peuple, mettra fin à la corruption et amènera le peuple bangladais vers sa véritable destinée. La population du Bangladesh serait abasourdie par ce soudain revirement sur le terrain. Concernant la crise des otages, le JSD a déclaré qu'il poursuivrait ses efforts pour résoudre la situation avec le gouvernement japonais."

 Ziaur_Rahman_Assasination.1.d:0 "Le président Ziaur Rahman a reçu des informations selon lesquelles les responsables locaux de son parti à Chittagong souffrent d'intenses luttes politiques internes. La situation se détériore rapidement et sa présence est sollicitée pour négocier un compromis. Rapidement, le président a quitté Dacca. Il compte rester à proximité du cantonnement militaire ces prochains jours pour régler le problème. Le maintien de la discipline et de l'unité du parti à Chittagong est crucial pour gouverner le pays. Avant de quitter la capitale, le président a assuré à ses hauts responsables que l'affaire serait résolue dans quelques jours."
 Ziaur_Rahman_Assasination.2.d:0 "Le président Ziaur Rahman est mort. Un groupe d'officiers, armés de mitraillettes, de lance-roquettes et de grenades, a pris d'assaut le Circuit Hotel où séjournait le président lors d'une visite à Chittagong. Les assassins ont évité un assaut frontal, faisant exploser deux trous à l'arrière du Circuit Hôtel. Avant l'arrivée du gros des forces de la Garde présidentielle, les assassins avaient réussi à capturer Ziaur Rahman avant de l'exécuter à bout portant. Deux des assassins ont été tués alors qu'ils s'enfuyaient, l'un d'entre eux étant identifié comme étant un colonel. Le général Abul Manzoor, commandant de Chittagong, s'est adressé à la radio locale, appelant la nation à s'unir et à créer une véritable nation. Il semble qu'un coup d'État se prépare."
 Ziaur_Rahman_Assasination.3.d:0 "Les craintes d'un coup d'État au Bangladesh suite à l'assassinat du président Ziaur Rahman se sont dissipées. Le chef de l'armée en exercice, le général Hussain Muhammad Ershad, a rapidement pris la situation en main. Il est passé à la radio et a appelé toutes les forces rebelles à se rendre et à arrêter le général Abul Manzoor. La réponse a effectivement isolé Chittagong et les dirigeants rebelles du reste du pays. La réponse rapide du général Ershad a rallié toutes les autres garnisons majeures à promettre leur loyauté envers le gouvernement et la hiérarchie militaire. Des rapports font état de troubles parmi les troupes à Chittagong à la fois à cause de l'assassinat et des émissions de radio."
 Ziaur_Rahman_Assasination.4.d:0 "Le général Abul Manzur, considéré comme le cerveau derrière l'assassinat du défunt président Ziaur Rahman, aurait été tué, mettant ainsi fin à sa rébellion. Suite aux demandes de capitulation du chef de l'armée pour Manzur et ses forces, la moitié de la garnison de Chittagong a retourné sa loyauté envers le gouvernement. La situation étant retournée contre lui, le général Manzur se serait rendu aux troupes loyalistes sans incident. Cependant, quelques heures plus tard, il aurait été tué. Des rumeurs circulent selon lesquelles un groupe de soldats loyalistes en colère aurait encerclé et tué le commandant rebelle par colère. Bien que de nombreuses personnes dans le pays estiment que justice a été rendue, certaines rumeurs suggèrent que Manzur a été tué pour l'empêcher de révéler l'implication de dirigeants militaires et civils de plus haut rang dans la tentative de coup d'État."
 Ziaur_Rahman_Assasination.5.d:0 "Quelques millions de Bangladais ont assisté aux funérailles du défunt président Ziaur Rahman à Dacca. La foule était affligée et beaucoup ont exprimé leur grande tristesse pour le défunt dirigeant. Malgré sa réputation d'homme fort, beaucoup ont estimé que le président Rahman apportait la main ferme dont la nation avait besoin. Ses campagnes en faveur du nationalisme et de la stabilité économique resteront gravées dans les mémoires. À la fin des funérailles, de nombreuses personnes dans le pays regarderont nerveusement vers l'avenir. Le vice-président Abdus Sattar a prêté serment pour assumer la présidence. L'homme d'État chevronné a promis de poursuivre la politique de Ziaur Rahman et d'organiser de nouvelles élections dans un avenir proche."
 Ziaur_Rahman_Assasination.6.d:0 "Le président par intérim Abdus Sattar, qui a pris la relève après l'assassinat du président Ziaur Rahman, a facilement remporté la récente élection présidentielle. De nombreux Bangladais considèrent les résultats des élections comme une confirmation que le pays reste attaché à l'héritage de Ziaur Rahman. Le président Sattar a remercié les partisans du BNP et a appelé à une nouvelle ère de développement pour la nation. Il a également révélé une vision visant à accroître la coopération des institutions nationales. Malgré la victoire, des inquiétudes subsistent quant à la santé et à l'âge de Sattar."
 Ziaur_Rahman_Assasination.7.d:0 "Le général Hussain Muhammad Ershad a assumé le poste de président et administrateur en chef de la loi martiale. Au cours des heures précédentes, le président et le vice-président ont tous deux démissionné. Le général Ershad a dissous le parlement et annoncé que des centaines de politiciens seraient arrêtés pour corruption. L'armée affirme qu'elle a dû agir suite à l'inefficacité du gouvernement actuel. Le général Ershad insiste sur le fait que s'il n'avait pas agi, les forces anti-étatiques auraient plongé le Bangladesh dans le chaos. Les analystes ne sont pas surpris par ce coup d'État, car le président et le chef de l'armée se sont livrés à des querelles politiques au cours des derniers mois. La décision récente de retirer les officiers militaires des postes administratifs est considérée comme le dernier tirage au sort. Les Bangladais regardent vers un avenir incertain."
 Ziaur_Rahman_Assasination.8.d:0 "L'homme fort et président bangladais Ziaur Rahman a été assassiné lors d'une apparente tentative de coup d'État à Chittagong. Des informations indiquent que le président a été attiré là-bas par un commandant militaire local qui a ensuite orchestré une attaque contre sa résidence. Le chef de l'armée, le général Hussein Mohammad Ershad, a réagi rapidement, exigeant que les soldats rebelles se rendent immédiatement et envoyant des troupes pour pacifier la ville. Les rebelles se sont rapidement rendus et le chef militaire qui dirigeait la révolte aurait été tué par des soldats en colère contre cet assassinat. Le président Rahman reposera à Dacca, où au moins un million de personnes en deuil devraient lui rendre hommage. Le dirigeant militaire s'est révélé populaire en établissant un régime stable dans un pays en proie à l'instabilité politique. Conformément à la constitution, Abdus Sattar est le président par intérim et il a promis de nouvelles élections dans les mois à venir."

 FG_AL.0.d:0 "Il y a un grand enthousiasme dans tout le Bangladesh alors que la population se rend aux urnes. De nombreux Bangladais considèrent ces élections comme une confirmation de leur nation comme véritable avant-garde de la démocratie sud-asiatique. La Ligue Awami devrait triompher dans les sondages. Les résultats étant presque acquis d'avance, les dirigeants de la Ligue Awami sont confrontés à un dilemme. Il peut gouverner de manière indépendante et mettre pleinement en oeuvre sa vision pour le pays. Cependant, certains au sein du parti prônent la formation d'un gouvernement d'unité nationale, afin d'impliquer tous les Bangladais dans le processus politique. Le Comité central doit prendre une décision sur la manière de procéder."
 FG_AL.1.d:0 "À la fin des années 1950, deux organisations se sont formées pour enseigner et faire connaître les pratiques islamiques à Dacca. Dans les années qui ont suivi, ces organisations sont devenues les principales institutions de recherche de la région sur la philosophie, la culture et le savoir islamiques. Le gouvernement a récemment réprimé et interdit ces organisations parce qu'elles ne soutenaient pas les efforts visant à promouvoir l'indépendance du Bangladesh. Cependant, la population du Bangladesh souhaite de plus en plus le rétablissement des organisations d'orientation spirituelle, ce qui a conduit à de grandes protestations. Il existe une proposition au Parlement visant à fusionner les anciens groupes en une organisation financée par le gouvernement appelée la Fondation islamique. La nouvelle organisation se concentrerait exclusivement sur les questions spirituelles et n'interviendrait pas dans la politique. Certains laïcs soutiennent qu'une telle organisation va à l'encontre des principes démocratiques fondamentaux et que le gouvernement devrait maintenir cette interdiction."
 FG_AL.2.d:0 "Cheikh Mujibur Rahman gouverne actuellement le pays sur la base de la récente constitution, mais le gouvernement est accusé d'ignorer ses dispositions. Des efforts sont en cours pour adopter de nouveaux amendements qui légitimeront certaines des actions douteuses du gouvernement. Cheikh Mujibur Rahman souhaite que le document se recentre sur les principes fondamentaux du nationalisme, de la laïcité, de la démocratie et du socialisme. Malgré ces nobles prétentions à étendre l'autorité constitutionnelle, l'opposition accuse le gouvernement de créer un État à parti unique. Les membres de la Ligue Awami, au pouvoir, appellent à la patience, notant les problèmes généralisés auxquels le pays est actuellement confronté."
 FG_AL.3.d:0 "Le paysan bangladais reste une victime de l'histoire, d'abord par l'aristocratie féodale précoloniale, puis par le régime colonial qui a donné du pouvoir à ces zamindars. En tant que telle, une grande partie du territoire reste sous-développée ou sous le contrôle d'une petite cabale. Le socialisme ouvre la voie à la prospérité du paysan. Le cabinet a présenté deux programmes de réforme agraire, l'un appelant à un programme modéré de collectivisation, tandis que l'autre appelle à un changement radical. Certains préconisent une action rapide pour transformer la société, mais ceux qui soutiennent un programme modéré notent qu'il serait peut-être préférable d'amener la société vers le socialisme."
 FG_AL.4.d:0 "Le projet de collectivisation que nous avons récemment lancé a rencontré des obstacles majeurs. De nombreux paysans refusent d'abandonner leurs petites propriétés. Plus important encore, les propriétaires fonciers maintiennent le contrôle en payant les paysans pour qu'ils détiennent des terres à leur place, ce qui va à l'encontre de l'objectif du programme. La fonction publique semble incapable d'identifier efficacement de nouvelles terres à cultiver et les agents gouvernementaux ne sont pas non plus capables de stimuler la production locale. Nous devrons réduire le programme de collectivisation. En plus de cela, de nombreux paysans sont furieux contre le gouvernement, le programme s'est avéré désastreux et la production agricole a chuté de façon spectaculaire."
 FG_AL.5.d:0 "Les problèmes de bureaucratie, la faiblesse des autorités rurales et les problèmes de collectivisation ont provoqué de graves pénuries alimentaires. L'année en cours montre une chute brutale de la productivité agricole. Des rapports font déjà état de famine parmi les communautés paysannes, nombre d'entre elles fuyant vers les villes. Le coût de la nourriture augmente également, alimentant la panique parmi les populations urbaines. Nos propres responsables n'ont pas réussi à tenir le gouvernement central au courant de ces problèmes et de nombreux ministères ont du mal à réagir. Il y a des promesses d'aide et de soutien international, mais cela ne viendra pas assez vite ni dans les quantités nécessaires à notre population. Dans un récent rapport au cabinet, le ministre de l'Agriculture a noté que le pays était entré dans une situation de famine."
 FG_AL.6.d:0 "La famine qui sévit au Bangladesh provoque des morts massives mais aussi l'hystérie dans les rues. Les politiciens, les propriétaires fonciers et même les militaires sont accusés de détourner les réserves alimentaires de la population en général. Les paysans qui arrivent dans la ville sont désespérés, les services de police font état de violentes manifestations et d'une augmentation de la criminalité. Le président n'a qu'une seule option. Il doit déclarer l'état d'urgence humanitaire pour mobiliser les ressources de l'État et réprimer la thésaurisation par les éléments du crime organisé. Une fois que nous aurons stabilisé l'économie, l'anarchie croissante et le désordre politique seront également résolus. De nombreux membres de la Ligue Awami reconnaissent que l'opposition a cherché de manière imprudente à répandre des rumeurs dangereuses à des fins politiques."
 FG_AL.7.d:0 "Le Bangladesh est confronté à des défis sans précédent. Le gouvernement continue d'être attaqué par l'opposition, qui n'hésite pas à publier de fausses nouvelles pour enflammer la population. Si nous voulons mettre en oeuvre notre vision pour la nation, certains membres du parti suggèrent une solution radicale. Ils veulent faire adopter un amendement à la Constitution interdisant tous les partis politiques pour l'unité nationale. Le président peut alors déclarer l'état d'urgence et créer un État à parti unique. Nous pourrons alors rassembler tous les dirigeants politiques sous la direction du Président et mener pleinement à bien notre programme. Cependant, cette démarche étant peut-être trop radicale, une décision doit être prise."
 FG_AL.8.d:0 "Le Parlement du Bangladesh a adopté de justesse un nouvel amendement autorisant le président à interdire tout parti politique pendant l'état d'urgence. Malgré les protestations véhémentes de l'opposition, qui affirme que la nouvelle loi est prête à donner lieu à des abus, elle a été adoptée. Le président déclare que le projet de loi garantira qu'une situation d'urgence puisse être gérée efficacement. La réaction des médias a été mitigée. Les publications progouvernementales notent que le climat politique exacerbé signifie que de telles lois doivent être adoptées. La presse d'opposition affirme que le projet de loi jette les bases d'une prise de pouvoir politique par le gouvernement."
 FG_AL.9.d:0 "Face à un environnement politique de plus en plus instable, le président Sheikh Mujibur Rahman a annoncé l'état d'urgence. Conformément à ses pouvoirs d'urgence, le président a déclaré que tous les partis politiques devaient être interdits. Il a déclaré son intention d'apporter une solution significative aux luttes politiques internes dans le pays. Les dirigeants de l'opposition n'ont pas pu être contactés pour commenter, la plupart étant sous protection policière. Bien que Mujibur Rahman ait promis de rétablir la normalité, nombreux sont ceux qui, dans le pays, ne savent pas exactement ce que signifiera la normalité."
 FG_AL.10.d:0 "Le président Cheikh Mujibur Rahman a annoncé la création d'un nouveau parti politique appelé Ligue Krishak Sramik Awami du Bangladesh ou BaKSAL. Tous les hommes politiques sont tenus d'y adhérer, y compris tous les parlementaires en exercice. Un nouveau cabinet, composé de membres de tous les principaux partis politiques, gouvernera le pays. Mujibur Rahman considère le nouveau parti comme essentiel à l'établissement de l'harmonie et de l'unité politiques. Avec une direction politique unie, le Bangladesh peut enfin embrasser son destin. En raison de la censure de la presse, on ne sait pas exactement quelle est la réaction du public. Cependant, la presse étrangère note un calme général et inquiet parmi la population, ce qui indique qu'un certain mécontentement pourrait être présent."

 FG_UNITY.1.d:0 "Les partis islamiques du Bangladesh, dont beaucoup disposent de puissantes organisations de base, exigent la création d'un ministère des Affaires islamiques. Ils souhaiteraient que toute la législation soit revue par ce ministère pour déterminer si elle est compatible avec l'Islam. C'est bien sûr inacceptable, l'Islam doit être au-dessus de la politique. Au lieu de cela, un compromis a été trouvé pour créer une Académie islamique chargée de promouvoir l'Islam et de fournir des conseils non contraignants au gouvernement lorsqu'il lui est demandé. Cependant, même cela est considéré comme inacceptable, en particulier par les éléments les plus à gauche de la Ligue Awami. Ils prônent une laïcité totale."
 FG_UNITY.2.d:0 "Un groupe de dirigeants de gauche de la Ligue Awami, ainsi que des membres d'autres partis de gauche, ont demandé au gouvernement de renforcer considérablement les droits de négociation collective des travailleurs. Cela fait sensation car le ministère des Finances signale que cette décision pourrait s'avérer économiquement peu judicieuse, compte tenu du climat économique actuel. Les chefs d'entreprise ont également exhorté le gouvernement à ne pas céder à de telles demandes. Cependant, il ressort clairement des dirigeants syndicaux que l'incapacité à mettre en oeuvre ces revendications pourrait provoquer des troubles parmi les travailleurs. Le gouvernement est confronté à une décision difficile."
 FG_UNITY.3.d:0 "La récente décision du gouvernement de mettre en oeuvre des droits plus larges pour les travailleurs a apporté des impulsions inattendues. Les rapports indiquent une production accrue et une diminution des incidents de troubles ouvriers, qui se sont intensifiés ces derniers mois. Le gouvernement doit profiter de la stabilité de la production et des relations de travail."
 FG_UNITY.4.d:0 "La Ligue Awami et ses alliés prônent depuis longtemps une transformation radicale de l'agriculture. Ils croient que l'État colonial et postcolonial a maintenu des modes d'agriculture archaïques qui entravaient le développement des paysans. Pour eux, la collectivisation offre une solution à la crise. La Ligue Awami a proposé un modeste programme de collectivisation pour ne pas s'aliéner complètement les autres partis de la coalition. Les partis les plus conservateurs estiment cependant qu'une telle mesure est trop radicale. Ils souhaitent plutôt instaurer une réforme agraire qui permettrait à l'État de saisir les terres improductives pour les redistribuer aux paysans. Si la collectivisation est mise en oeuvre, le gouvernement d'unité pourrait être menacé."
 FG_UNITY.5.d:0 "Le gouvernement a récemment lancé un programme visant à acquérir auprès des grands propriétaires les terres arables non utilisées et à les redistribuer aux paysans. Le programme a connu un succès rapide, mais il a commencé à stagner. Les propriétaires soudoient les fonctionnaires locaux en toute impunité pour garantir que les terres restent sous leur contrôle par l'intermédiaire de mandataires. Le gouvernement de Dacca ne semble pas intéressé ou incapable de mettre un terme à ces pratiques, ce qui compromet l'ensemble du programme."
 FG_UNITY.6.d:0 "L'échec du programme de réforme agraire a plongé le Bangladesh dans la famine. Le manque de fiabilité des données a entraîné un manquement beaucoup plus important aux objectifs agricoles. Le gouvernement semble incapable de faire venir suffisamment de nourriture de l'étranger pour atténuer la situation. La pénurie alimentaire croissante entraîne déjà une hausse des prix sur les marchés. De nombreux agriculteurs sont accusés de stocker de la nourriture, tout comme les responsables gouvernementaux. La situation s'effondre rapidement, le gouvernement devra bientôt s'en occuper."
 FG_UNITY.7.d:0 "La nationalisation est une question qui divise au Parlement. La Ligue Awami reste attachée à une nationalisation généralisée, mais de nombreux autres partis appellent à un programme de nationalisation plus progressif. Il existe également un large soutien en faveur d'une économie plus mixte composée à la fois d'industries privées et nationalisées. Le gouvernement propose un programme de nationalisation industrielle basé à Chittagong. Toutefois, les membres du gouvernement d'union les plus conservateurs préféreraient un programme plus modeste visant à nationaliser certaines industries essentielles. Si le programme de nationalisation industrielle est mis en oeuvre, on craint que le gouvernement d'unité nationale ne s'effondre."
 FG_UNITY.8.d:0 "La question de l'installation des réfugiés reste très pressante pour le gouvernement. Il y a des réfugiés venus du Pakistan pendant la partition et récemment. Les placer dans des camps n'est pas une solution à long terme, cela érode le soutien populaire au gouvernement. Un plan prévoit que ces réfugiés soient placés dans des communautés qui ont désespérément besoin de main d'oeuvre pour produire de nouveaux projets de développement. L'autre proposition est d'installer les réfugiés dans les quartiers commerciaux, notamment sur les marchés, pour soutenir cette partie de l'économie."
 FG_UNITY.9.d:0 "De nombreux jeunes de gauche sont de plus en plus critiques à l'égard du gouvernement. Ils estiment que le socialisme est négligé au nom de compromis politiques et que la direction actuelle du parti est déconnectée. Beaucoup souhaitent que certains des membres les plus expérimentés démissionnent et donnent de la place aux jeunes leaders. Des manifestations de plus en plus violentes éclatent à Dacca, les étudiants exigeant la fin du gouvernement d'unité nationale et l'instauration du socialisme complet dans le pays. La Ligue Awami peut attirer ce groupe en promouvant certains des dirigeants les plus à gauche à des postes élevés au sein du parti, même si cela mettrait à rude épreuve le gouvernement d'unité, voire le briserait. L'autre option consiste à déployer la police pour réprimer ces manifestations et tenter d'imposer la discipline de parti sur les campus."
 FG_UNITY.10.d:0 "Le gouvernement d'unité dirigé par la Ligue Awami s'est effondré. Les partenaires de la coalition affirment que la Ligue Awami ne gouverne pas par consensus. Cette décision fait suite à une série de désaccords concernant la législation récente. Les partenaires de la coalition affirment que la Ligue Awami cherche à faire adopter une législation radicale. Même si le gouvernement d'unité nationale s'est effondré, la Ligue Awami continuera de gouverner puisqu'elle détient la majorité des sièges. Le gouvernement a publié une déclaration, soulignant qu'il avait formé un gouvernement d'unité dans un souci d'unité nationale, mais que l'opposition souhaite désormais faire de la politique alors que le Bangladesh est confronté à un moment critique."
 FG_UNITY.11.d:0 "La politique étrangère est une préoccupation majeure pour le gouvernement. Ceux qui sont fortement attachés à la période coloniale et aux premiers mouvements pakistanais soutiennent une volonté de renforcer les liens avec l'Occident. Ils considèrent que la démocratie et l'économie du Bangladesh sont intrinsèquement liées à ces liens. Les socialistes et les gens de gauche souhaitent se concentrer sur l'amélioration des liens avec le monde socialiste. Ils croient que l'avenir du Bangladesh réside dans la création d'une société socialiste. Enfin, nombreux sont ceux qui pensent qu'une grande partie des problèmes auxquels le Bangladesh est confronté proviennent de l'influence étrangère et souhaitent se concentrer sur les liens avec les voisins et les puissances régionales."
 FG_UNITY.12.d:0 "La famine qui sévit au Bangladesh provoque des morts massives mais aussi l'hystérie dans les rues. Les politiciens, les propriétaires fonciers et même les militaires sont accusés de détourner les réserves alimentaires de la population en général. Les paysans qui arrivent dans la ville sont désespérés, les services de police font état de violentes manifestations et d'une augmentation de la criminalité. Le président n'a qu'une seule option. Il doit déclarer l'état d'urgence humanitaire pour mobiliser les ressources de l'État et réprimer la thésaurisation par les éléments du crime organisé. Une fois que nous aurons stabilisé l'économie, l'anarchie croissante et le désordre politique seront également résolus. De nombreux membres de la Ligue Awami reconnaissent que l'opposition a cherché de manière imprudente à répandre des rumeurs dangereuses à des fins politiques, malgré les efforts du parti pour gouverner dans l'unité."
 FG_UNITY.13.d:0 "La nation est confrontée à des défis sans précédent sur les plans social, politique et économique. La famine actuelle a révélé les limites du gouvernement d'union. Si nous voulons concrétiser la vision de la Ligue Awami pour la nation, certains membres du parti suggèrent une solution radicale. Ils veulent faire adopter un amendement à la Constitution interdisant tous les partis politiques afin de promouvoir une véritable unité nationale. Le président peut alors déclarer l'état d'urgence et créer un État à parti unique. Nous pourrons alors rassembler tous les dirigeants politiques sous la direction du Président et mener pleinement à bien notre programme. Cependant, cette démarche étant peut-être trop radicale, une décision doit être prise."
 FG_UNITY.14.d:0 "Le président a rencontré le ministre des Finances et d'autres conseillers économiques clés pour déterminer les détails d'un nouveau programme d'industrialisation pour Chittagong. En raison des contraintes financières actuelles, seul un projet limité est possible. Le gouvernement peut se concentrer sur la construction de la base infrastructurelle et sur la mise en place d'une croissance future en renforçant les transports et la production d'électricité dans la région. Elle peut également se concentrer sur la création de nouvelles usines pour accroître la production le plus rapidement possible. Le projet devrait durer trois ans."
 FG_UNITY.15.d:0 "Le président a tenu une conférence de presse confirmant que le programme de nationalisation industrielle a terminé ses travaux à Chittagong. Il a salué la création de plusieurs centrales électriques gérées par l'État et l'infrastructure urbaine de la ville. Les bases sont posées pour une croissance industrielle soutenue et rapide, qui offrira des opportunités, du développement et de la prospérité à la région. Le programme est salué par les médias comme un modèle pour les autres régions du pays. Un porte-parole parlementaire de la Ligue Awami a fait une déclaration distincte saluant la coopération des institutions étatiques dans le développement économique."
 FG_UNITY.16.d:0 "Le président a tenu une conférence de presse confirmant que le programme de nationalisation industrielle a terminé ses travaux à Chittagong. Il a salué la création de plusieurs usines industrielles publiques dans la ville. La région semble prête à connaître une croissance économique rapide et soutenue, qui offrira des opportunités, du développement et de la prospérité à la région. Le programme est salué par les médias comme un modèle pour les autres régions du pays. Un porte-parole parlementaire de la Ligue Awami a fait une déclaration distincte saluant la coopération des institutions étatiques dans le développement économique."

 BAN_JSD.1.d:0 "Le nouveau régime du Jatiya Samajtantrik Dal (JSD) a annoncé une transformation majeure de l'armée. Le parti a annoncé que tous les éléments réactionnaires et déloyaux devaient être éliminés. Des informations font état d'arrestations massives, notamment de soldats et d'officiers de carrière. Les écoles préparatoires militaires font également l'objet de perquisitions et des projets sont annoncés pour modifier le programme. Certains officiers supérieurs bangladais ont fui le pays et beaucoup se sont retrouvés en Inde. Lorsqu'un porte-parole du gouvernement a été interrogé sur le sort des militaires arrêtés, il a déclaré qu'ils seraient jugés par des tribunaux militaires."
 BAN_JSD.2.d:0 "Le nouveau gouvernement bangladais promet d'apporter un véritable socialisme à son peuple. Son programme radical l'a isolé de ses voisins et des autres puissances. Un représentant diplomatique du Bangladesh nous a récemment contacté pour demander un accord global sur l'aide économique et militaire. Le Bangladesh souhaite accélérer sa transition vers une économie socialiste et développer une armée capable de défendre sa révolution. Nos experts indiquent que le nouveau régime a déployé des efforts considérables pour purger les contre-révolutionnaires, notamment au sein de son armée. Sans un soutien global, ils pourraient avoir du mal à conserver le pouvoir. Soutenir le régime pourrait nous donner un allié socialiste dans la région, mais certains conseillers estiment que le nouveau régime est trop instable et que nous ne devrions pas soutenir un régime potentiellement autodestructeur."
 BAN_JSD.3.d:0 "Nous avons récemment conclu un important programme d'aide économique de la part de l'Union soviétique. C'est une aubaine majeure pour la révolution et donne une bien plus grande légitimité à notre régime. L'économie du Bangladesh a longtemps été victime de l'exploitation des colonisateurs et des occupants. Nous devons construire une économie destinée à la croissance du peuple et non à des intérêts extérieurs. L'aide et les conseillers soviétiques joueront un rôle précieux dans la réussite de la révolution. Dans le cadre de l'accord, nous pouvons nous attendre à des visites régulières de responsables soviétiques pour superviser les opérations."
 BAN_JSD.4.d:0 "Nous avons conclu avec succès d'importants programmes d'aide économique et militaire avec l'Union soviétique. Cela contribuera grandement à solidifier la révolution et à légitimer notre régime au sein du monde socialiste. Notre économie a longtemps été victime de l'exploitation de la part des colonisateurs et des occupants. Le soutien soviétique contribuera à faire du Bangladesh un paradis industriel pour les travailleurs. La révolution a de nombreux ennemis, tant à l'intérieur que dans la région. Une armée faible signifie une révolution sans protection. Les Soviétiques prévoient de fournir une formation avancée et des armes à nos militaires naissants. Nos officiers supérieurs ne seront plus le produit des écoles impérialistes."
 BAN_JSD.5.d:0 "Après avoir contacté en privé l'Union Soviétique pour des négociations, nous avons été discrètement refusés. Il semble que notre révolution ait des ennemis à l'intérieur, à l'étranger et au sein du camp socialiste. Les Soviétiques n'ont pas donné de raison claire, affirmant simplement qu'ils devaient évaluer la situation de manière complète. Il a accepté de maintenir son ambassade dans le pays. Il est clair maintenant que les puissances extérieures cherchent à étouffer notre révolution dès le berceau, nous devons nous unir en tant que nation pour enfin libérer notre peuple des chaînes de l'impérialisme et du capitalisme."
 BAN_JSD.6.d:0 "Le mouvement communiste indien est vaste et comprend des idéologues de toutes positions différentes. Certains des plus radicaux ont vu leur voix de plus en plus ignorée par le mouvement au sens large, qui semble se consacrer à opérer au sein de l'ordre capitaliste et féodal en Inde. Certains des dirigeants les plus radicaux sont également la cible de la répression gouvernementale. Au cours des dernières semaines, un certain nombre de ces dirigeants communistes les plus radicaux sont arrivés à Dacca. En tant que régime révolutionnaire, nous accueillons ces militants qui font des discours publics, à la fois lors de réunions publiques et à la radio. Ils publient également d'importants articles et revues sur leur cause. L'ambassadeur indien nous demande constamment d'expulser ces militants ou de restreindre leurs activités, mais nous ne trahirons jamais les révolutionnaires."
 BAN_JSD.7.d:0 "Des comités du prolétariat sont créés à travers le pays. Les travailleurs locaux élisent des représentants locaux pour gouverner leur région. Ces comités présentent également les points de vue et les griefs de leur communauté aux structures régionales du parti. Il s'agit de la représentation à son niveau le plus élémentaire, donnant une voix à tous les Bangladais."
 BAN_JSD.8.d:0 "Après des semaines de discussions, le Comité central de planification économique est prêt à décider de la direction que devrait prendre l'économie au cours des dix prochaines années. Une faction estime que le Bangladesh doit jeter les bases de la croissance future et souhaite se concentrer sur le développement des infrastructures. Une autre faction croit en l'agriculture et souhaite développer ce secteur, ainsi que développer les banques et les installations portuaires pour, à terme, exporter notre richesse agricole. Enfin, la faction industrielle estime que la construction d'une base industrielle puissante alimentera une croissance économique rapide. Une décision doit être prise."
 BAN_JSD.9.d:0 "Le régime précédent avait lancé un plan de nationalisation, mais celui-ci n'a été exécuté que sans enthousiasme. Nous prévoyons d'intégrer la plupart de ces plans à nos propres efforts. Cependant, nos conseillers économiques principaux estiment qu'avec un peu de concentration, nous pouvons réaliser rapidement un projet et produire des résultats immédiats. Nous devons décider quel projet réaliser. Nous pouvons mener à bien un projet de collectivisation, un projet industriel ou un projet d'indépendance financière rurale. Seul notre régime a la capacité de transformer les efforts ratés du dernier gouvernement en un succès pour le peuple."

 Bangladesh_Federation.1.d:0 "Suite à la création d'une co-fédération, une Assemblée constituante a été créée pour créer une constitution pour le Pakistan oriental. Les principaux dirigeants politiques et sociaux du Pakistan oriental se réunissent sous la présidence du très respecté juge de la Cour supérieure de Dacca, Abdus Sattar. Dans une démarche sans précédent, les discussions de l'assemblée doivent rester privées et non rendues publiques. Il s'agit d'éviter toute influence indue du gouvernement fédéral ou des partis politiques locaux. Une fois la constitution achevée, des élections générales auront lieu dans trois mois. (Les décisions prises par le joueur tout au long de cet arbre détermineront quel type de constitution sera établi.)"
 Bangladesh_Federation.2.d:0 "L'un des premiers débats concerne la situation des droits de la personne dans la province. Certains souhaitent créer une Déclaration des droits similaire à celles établies par les constitutions britannique et américaine. Les partisans de cette approche la considèrent comme conforme aux normes internationales pour toutes les sociétés civilisées. Cependant, un autre groupe au sein de l'Assemblée affirme que l'Islam garantit fondamentalement tous les droits de l'homme. Ils souhaitent une déclaration épousant les principes universels des droits de l'homme conformément aux traditions islamiques. Après un débat acharné, une décision doit être prise."
 Bangladesh_Federation.3.d:0 "Dès le début, une question flagrante est celle du rôle de la laïcité dans la constitution. De nombreux membres de l'assemblée ont été formés dans des institutions laïques ou exercent des professions laïques. Cependant, l'Islam est la religion principale de nombreux Pakistanais de l'Est et un certain nombre de chefs religieux ont été choisis par la population pour les représenter à l'assemblée. Ces membres soutiennent que l'Islam est par nature la religion la plus juste et que la constitution devrait commencer par une déclaration proclamant l'adhésion aux principes de l'Islam. Cependant, les députés libéraux estiment que cela pourrait poser problème et souhaiteraient que le document reste laïc, afin de protéger les intérêts de tous les citoyens du Pakistan oriental."
 Bangladesh_Federation.4.d:0 "Le Pakistan oriental abrite une population diversifiée, comprenant des castes minoritaires et des communautés sous-représentées. Le Pakistan a été fondé en raison du refus du Parti du Congrès de préserver les droits politiques des communautés minoritaires. Il est donc naturel que la constitution du Pakistan oriental poursuive la politique de préservation des sièges des minorités. Les éléments plus traditionnels souhaitent des sièges réservés généreux, notamment pour les femmes et les communautés hindoues. Cependant, les éléments libéraux soulignent que cette proposition pourrait potentiellement limiter le potentiel électoral de ces communautés. Ils souhaitent offrir une proportion de sièges réservés plus limitée pour offrir davantage de possibilités de démocratie directe aux communautés minoritaires."
 Bangladesh_Federation.5.d:0 "L'Assemblée constituante débat de l'étendue du pouvoir parlementaire. De nombreux membres estiment que l'essentiel du pouvoir exécutif devrait être détenu par le Premier ministre. Un Premier ministre habilité serait en mesure de guider directement le corps législatif. Plus important encore, un Premier ministre doit être membre du Parlement, ce qui signifie que l'exécutif doit être élu par le peuple. Cependant, d'autres membres estiment qu'un chef de l'exécutif habilité devrait détenir l'essentiel du pouvoir exécutif. Les partisans d'un chef de l'exécutif plus fort estiment que cela favoriserait un équilibre des pouvoirs entre les branches du gouvernement. Plus important encore, un tel chef de l'exécutif ne serait pas corrompu par la politique au sein du Parlement."
 Bangladesh_Federation.6.d:0 "Le Pakistan oriental a une riche histoire judiciaire. Les premiers tribunaux coloniaux ont été fondés au Bengale. Bon nombre des dirigeants les plus célèbres du Pakistan oriental sont issus du milieu juridique. La question est de savoir si le législateur devrait se tourner vers la Cour suprême du Pakistan ou vers une Cour suprême du Pakistan oriental qui sera établie avec la constitution pour vérifier la constitutionnalité de la législation. Ceux qui soutiennent davantage de liens avec le Pakistan occidental soutiennent le recours à la Cour suprême du Pakistan. Cependant, ceux qui souhaitent une plus grande autonomie veulent la Cour suprême du Pakistan oriental, sachant que cela entraînera probablement un casse-tête judiciaire majeur à l'avenir."
 Bangladesh_Federation.7.d:0 "L'Assemblée constituante du Pakistan oriental a présenté une constitution qui favorise fortement le modèle de fédération avec le Pakistan occidental. Beaucoup notent à quel point le document suit la constitution pakistanaise sur un certain nombre de questions et de thèmes. Les membres qui ont rédigé la constitution la saluent comme garantissant l'unité du Pakistan tout en assurant la dignité aux Pakistanais de l'Est. Il y a eu des protestations sporadiques, notamment de la part des nationalistes bengalis qui condamnent le document comme étant rédigé par les élites pour étouffer la voix des masses. Des élections auront lieu dans trois mois, et les partis vainqueurs devront déterminer la relation finale avec le Pakistan."
 Bangladesh_Federation.8.d:0 "L'Assemblée constituante du Pakistan oriental a présenté une constitution qui favorise fortement une plus grande autonomie au sein du Pakistan. Des responsables politiques, militaires et gouvernementaux de premier plan seraient préoccupés par ce document. Les journaux du Pakistan occidental l'ont critiqué parce qu'il contredisait parfois complètement l'esprit de la constitution pakistanaise. Au Pakistan oriental, il y a eu quelques rassemblements de nationalistes bengalis en faveur du document. Cependant, la constitution n'est pas universellement saluée, car de nombreux Pakistanais de la classe moyenne et conservateurs de l'Est ont exprimé leurs inquiétudes quant à une constitution qu'ils estiment délibérément conflictuelle. Des élections auront lieu dans trois mois, et les partis vainqueurs devront déterminer la relation finale avec le Pakistan."
 Bangladesh_Federation.9.d:0 "À la surprise de certains, les partis pro-fédération ont dominé les élections générales au Pakistan oriental. Une coalition de ces partis se formera bientôt pour gouverner et établir de nouvelles relations solides entre les ailes du Pakistan. Les élections se sont déroulées dans une atmosphère presque festive, malgré des accusations de manipulation des électeurs de la part de certains groupes pro-autonomie. Ils ont affirmé que la nouvelle constitution offrait des droits de vote généreux, accordant le plein droit de vote à de nombreux Pakistanais occidentaux, qui n'ont vécu que brièvement dans la province ou y ont servi à des fins gouvernementales ou militaires. Malgré ces accusations, il semble que les élections soient généralement acceptées."
 Bangladesh_Federation.10.d:0 "À la surprise de certains, les partis pro-autonomie ont dominé les élections générales au Pakistan oriental. Une coalition de ces partis, dirigée par la Ligue Awami, se formera bientôt pour gouverner et établir de nouvelles relations solides entre les ailes du Pakistan. Cheikh Mujibur Rahman devrait diriger le gouvernement. Les élections se sont déroulées dans une atmosphère presque festive, malgré des accusations de manipulation des électeurs de la part de certains groupes pro-fédération. Ils affirment que la nouvelle constitution a imposé des conditions de résidence si strictes que de nombreux Pakistanais occidentaux, qui ont des intérêts commerciaux ou familiaux au Pakistan oriental, n'ont pas pu participer. Quoi qu'il en soit, il semble que les élections soient généralement acceptées."
 Bangladesh_Federation.11.d:0 "Avec l'annonce d'une fédération entre le Pakistan occidental et oriental, les hauts responsables bureaucratiques et administratifs des deux ailes, ainsi que les responsables fédéraux, se sont rencontrés pour discuter du partage des actifs. Les deux parties ont récemment conclu un accord non seulement sur le partage des actifs, mais également sur les responsabilités des agences fédérales et provinciales. L'accord est largement bien accueilli, même si certains médias pro-autonomie du Pakistan oriental se plaignent que le Pakistan oriental reste largement subordonné au centre. Un porte-parole du président a salué le succès des négociations, affirmant qu'il ne s'agissait que d'un petit pas vers la construction d'un Pakistan plus fort."
 Bangladesh_Federation.12.d:0 "Après des négociations difficiles, l'armée pakistanaise a confirmé qu'elle avait accepté de permettre à son personnel de décider s'il devait servir dans l'armée du Pakistan occidental ou dans la nouvelle armée du Pakistan oriental. On s'attend à ce que pratiquement tout le personnel du Pakistan oriental opte pour le Pakistan oriental, même s'il semble que certains Pakistanais occidentaux ayant des liens matrimoniaux avec l'aile orientale pourraient également le rejoindre. Les détails restent flous, mais il semble que le Pakistan occidental transférera au moins deux divisions d'infanterie d'équipement. Un transfert d'avions de combat pour l'aile est est également prévu. Le président a félicité l'armée pour sa capacité à soutenir la Fédération pakistanaise. En privé, il y aurait de l'agacement parmi les officiers militaires du Pakistan occidental, mais on s'attend à ce qu'ils donnent suite à l'accord."
 Bangladesh_Federation.13.d:0 "Les agences fédérales du Pakistan ont finalisé leur projet d'établir leurs propres homologues au Pakistan oriental. L'accord sur le régime fédéral stipule que le Pakistan oriental aura ses propres agences et ne relèvera pas des autorités fédérales basées au Pakistan occidental. Le personnel du Pakistan oriental au sein de ces agences existantes est à la tête des nouveaux départements en cours de création à Dacca. L'accord est largement salué dans les deux camps, même s'il n'existe toujours pas de mécanisme permettant de traiter les contradictions qui pourraient survenir dans les politiques ou dans la mise en oeuvre de la législation."
 Bangladesh_Federation.14.d:0 "La Banque d'État du Pakistan a annoncé que tous ses actifs au Pakistan oriental seront désormais connus sous le nom de Banque d'État du Pakistan oriental. La nouvelle banque aura l'autorité budgétaire complète pour le Pakistan oriental. Toutes les banques opérant au Pakistan oriental ne sont plus tenues d'enregistrer ou de conserver des actifs au Pakistan occidental. La nouvelle banque a promis d'initier une série de changements qui stimuleront la croissance au Pakistan oriental. Les économistes des deux ailes estiment qu'il y aura probablement un boom majeur pour l'économie du Pakistan oriental, car les politiques budgétaires fédérales se sont par le passé largement concentrées sur la croissance du Pakistan occidental."
 Bangladesh_Federation.15.d:0 "Après des discussions à huis clos, un accord concernant le statut final du Pakistan oriental a été conclu. Le président pakistanais a annoncé les détails à l'issue de ses longues discussions avec les dirigeants politiques du Pakistan oriental. Le Pakistan oriental conservera sa constitution favorable à la fédération et un contrôle accru sur son propre développement. Toutefois, la politique étrangère, l'économie nationale et la défense resteront du ressort de l'autorité fédérale. La législation adoptée au Pakistan oriental doit être conforme à la constitution nationale. L'accord est salué des deux côtés comme un véritable compromis politique. Les seules critiques émanent des partis pro-autonomie comme la Ligue Awami au Pakistan oriental. Ces groupes voient l'accord comme une capitulation face aux exigences du Pakistan occidental et considèrent l'autonomie promise dans l'accord comme une illusion. Ces critiques n'ont pas provoqué de manifestations de rue. Il semble donc que tous les Pakistanais soient prêts à donner une chance à cette nouvelle structure politique."
 Bangladesh_Federation.16.d:0 "Les discussions entre le président pakistanais et les responsables récemment élus du Pakistan oriental se sont terminées après des pourparlers épuisants. La Ligue Awami, pro-autonomie, aurait fait de nombreuses demandes au gouvernement fédéral. Les contre-propositions ont été largement rejetées par les deux parties. Après deux semaines supplémentaires de négociations, il fut décidé que le Pakistan oriental obtiendrait sa souveraineté tout en maintenant une alliance diplomatique. Le Bangladesh prévoit d'organiser de nouvelles élections tandis que le Pakistan se prépare à affronter un nouvel avenir. Même si de nombreux Pakistanais seront déçus, la plupart d'entre eux comprennent qu'accepter le Pakistan oriental comme une province pratiquement indépendante constituerait un dangereux précédent pour l'avenir."
 Bangladesh_Federation.17.d:0 "La décision de libérer le Bangladesh a été difficile pour le président. Cependant, les dirigeants du Pakistan oriental n'étaient pas disposés à faire de compromis sur leurs exigences extrêmes en matière d'autonomie. L'élite militaire et politique pakistanaise a reconnu qu'un tel scénario conduirait à de plus graves troubles politiques si d'autres provinces exigeaient des concessions similaires. Le président a noté que les dirigeants du Pakistan oriental souhaitaient obtenir la majorité des sièges à l'Assemblée nationale tout en jouissant d'une quasi-indépendance, un scénario inacceptable. Le maintien d'une alliance diplomatique et militaire contribuera grandement à légitimer la séparation en tant que séparation mutuelle opérée par des frères. Il y aura une période de transition, mais une grande partie du processus de séparation s'est déjà produite au cours de la récente période de fédération."

 BAN_2AL.0.d:0 "Le Bangladesh a organisé ses deuxièmes élections générales depuis son indépendance. Les gens attendent avec impatience les résultats. La participation électorale a été observée comme étant très élevée. Même s'il y a un sentiment d'enthousiasme, ces élections ne devraient pas être de la partie de plaisir pour la Ligue Awami au pouvoir. L'ampleur des défis et de la crise qui ont frappé le dernier gouvernement a ouvert une opportunité aux partis conservateurs de gagner du soutien. La Ligue Awami continue de promettre la mise en oeuvre du socialisme pour le peuple, notant que les défis récemment rencontrés reflètent ce qui se produit lorsqu'une société lève les chaînes de l'esclavage imposées aux gens par les régimes précédents. Les partis conservateurs, réunis en coalition, condamnent la Ligue Awami pour sa corruption, sa mauvaise gestion et sa volonté d'acquérir une domination politique. Les experts et les observateurs ne savent pas vraiment quel camp a l'avantage."
 BAN_2AL.1.d:0 "Le Bangladesh est confronté à des défis sans précédent. Le gouvernement continue d'être attaqué par l'opposition, qui n'hésite pas à publier de fausses nouvelles pour enflammer la population. Si nous voulons mettre en oeuvre notre vision pour la nation, certains membres du parti suggèrent une solution radicale. Ils veulent faire adopter un amendement à la Constitution interdisant tous les partis politiques pour l'unité nationale. Le président peut alors déclarer l'état d'urgence et créer un État à parti unique. Nous pourrons alors rassembler tous les dirigeants politiques sous la direction du Président et mener pleinement à bien notre programme. Cependant, cette démarche étant peut-être trop radicale, une décision doit être prise."
 BAN_2AL.2.d:0 "Le Parlement du Bangladesh a adopté de justesse un nouvel amendement autorisant le président à interdire tout parti politique pendant l'état d'urgence. Malgré les protestations véhémentes de l'opposition, qui affirme que la nouvelle loi est prête à donner lieu à des abus, elle a été adoptée. Le président déclare que le projet de loi garantira qu'une situation d'urgence puisse être gérée efficacement. La réaction des médias a été mitigée. Les publications progouvernementales notent que le climat politique exacerbé signifie que de telles lois doivent être adoptées. La presse d'opposition affirme que le projet de loi jette les bases d'une prise de pouvoir politique par le gouvernement."
 BAN_2AL.3.d:0 "Face à un environnement politique de plus en plus instable, le président Sheikh Mujibur Rahman a annoncé l'état d'urgence. Conformément à ses pouvoirs d'urgence, le président a déclaré que tous les partis politiques devaient être interdits. Il a déclaré son intention d'apporter une solution significative aux luttes politiques internes dans le pays. Les dirigeants de l'opposition n'ont pas pu être contactés pour commenter, la plupart étant sous protection policière. Bien que Mujibur Rahman ait promis de rétablir la normalité, nombreux sont ceux qui, dans le pays, ne savent pas exactement ce que signifiera la normalité."
 BAN_2AL.4.d:0 "Le président Cheikh Mujibur Rahman a annoncé la création d'un nouveau parti politique appelé Ligue Krishak Sramik Awami du Bangladesh ou BaKSAL. Tous les hommes politiques sont tenus d'y adhérer, y compris tous les parlementaires en exercice. Un nouveau cabinet, composé de membres de tous les principaux partis politiques, gouvernera le pays. Mujibur Rahman considère le nouveau parti comme essentiel à l'établissement de l'harmonie et de l'unité politiques. Avec une direction politique unie, le Bangladesh peut enfin embrasser son destin. En raison de la censure de la presse, on ne sait pas exactement quelle est la réaction du public. Cependant, la presse étrangère note un calme général et inquiet parmi la population, ce qui indique qu'un certain mécontentement pourrait être présent."
 BAN_2AL.5.d:0 "La fonction publique trouve ses origines dans l'ère coloniale. Beaucoup de hauts fonctionnaires sont issus de cette période. Ils sont fortement influencés par ces idéaux impérialistes. C'est pourquoi ils traînent souvent les pieds ou ne parviennent pas à mettre en oeuvre notre vision du pays. Certains hauts responsables du parti estiment que nous devrions procéder à une refonte et remplacer les hauts responsables par des fidèles du parti. Nous pouvons également nommer des sympathisants à des postes clés pour renforcer le favoritisme. Cependant, cela pourrait avoir des conséquences imprévues ; il serait peut-être préférable de séparer la fonction publique de la politique."
 BAN_2AL.6.d:0 "Nos efforts visant à remplacer la fonction publique par des partisans fidèles aux partis nous ont apporté un plus grand soutien, notamment de la part des partis régionaux. Cependant, la fonction publique perdrait le moral. De nombreux officiers parmi les plus expérimentés seraient mécontents de perdre leurs promotions et d'être placés sous des membres non qualifiés du parti. Plus important encore, un certain nombre d'officiers précieux ont démissionné par dégoût, entravant ainsi la formation de leurs remplaçants. Il faudra plusieurs années avant que la fonction publique retrouve son niveau d'efficacité antérieur."
 BAN_2AL.7.d:0 "Notre décision de séparer la fonction publique de la politique a entraîné certains revers. De nombreux partis régionaux se plaignent du fait que les politiques initiées depuis Dacca ne sont pas mises en oeuvre efficacement. Cela érode le soutien aux initiatives gouvernementales. En outre, de plus en plus d'agents de la fonction publique accèdent à des postes élevés et leurs prédécesseurs partent à la retraite. Cela met à rude épreuve le budget, car nous devons payer des salaires croissants ainsi que des retraites. Malgré ces revers, une nouvelle génération d'officiers entre dans le service et pourrait s'avérer plus efficace avec le temps."
 BAN_2AL.8.d:0 "L'Inde soutient notre cause depuis longtemps. Cependant, de nombreux Bangladais considèrent l'Inde avec hostilité. Cela découle de la violence de la partition et de nos problèmes frontaliers. En tant que nation, nous avons désespérément besoin d'un soutien économique et militaire pour assurer notre développement. L'Inde dispose des ressources nécessaires pour nous aider immédiatement. Nous pouvons tendre la main à l'Inde pour des négociations globales, cela pourrait constituer une aubaine majeure. Cependant, l'opposition considérera probablement un tel effort comme un exemple de ses affirmations ridicules selon lesquelles la Ligue Awami est une marionnette de l'Inde."
 BAN_2AL.9.d:0 "Le gouvernement bangladais a récemment contacté le pays pour s'enquérir de la possibilité de tenir des négociations globales. Les Bangladais recherchent du matériel militaire et des conseillers économiques. Nous pouvons certainement fournir au moins un soutien économique. Cependant, certains au ministère des Affaires étrangères estiment que le Bangladesh a l'habitude de recevoir notre soutien tout en continuant à promouvoir un discours de confrontation, notamment en ce qui concerne les questions frontalières. Ils suggèrent que nous devrions simplement concentrer les discussions sur l'expansion des relations bilatérales. Nous devrions réfléchir à la manière d'aborder les pourparlers."
 BAN_2AL.10.d:0 "Notre gouvernement a récemment conclu une série de nouveaux accords avec l'Inde. Même si nous avons souligné les avantages de l'accord, il y a eu des réactions négatives considérables. L'opposition et les nationalistes nous accusent de nous plier une fois de plus au pouvoir régional. Plusieurs manifestations sont prévues dans les prochains jours. Malgré les réactions négatives, l'accord dans son ensemble bénéficiera à la nation et nous permettra de mettre en oeuvre notre vision pour le Bangladesh. Pour éviter de nouvelles protestations, nous avons décidé d'annuler une prochaine conférence de presse avec l'ambassadeur indien faisant l'éloge des récents accords."

 BAN_CC.1.d:0 "La fonction publique, son système d'examens et de recrutement est profondément enraciné dans le système colonial. Il existe une pression croissante pour introduire des réformes des programmes et des exigences. Cela permettrait à une plus grande partie de la population d'accéder à une telle carrière. Les réformes impliqueraient la suppression de certaines exigences linguistiques occidentales et le remplacement d'éléments du programme scolaire par une plus grande concentration sur l'environnement culturel du Bangladesh. La mise en oeuvre de ces mesures prendrait du temps et entraînerait une perte d'efficacité. Les critiques de ces mesures remettent également en question la nécessité de modifier une structure bureaucratique qui est restée relativement efficace et totalement apolitique depuis l'indépendance. Le cabinet devra prendre une décision."
 BAN_CC.2.d:0 "Le gouvernement s'apprête à dévoiler une campagne de privatisation de Khulna. Cette campagne sera essentielle pour convaincre le peuple bangladais que la nationalisation est une politique vouée à l'échec, vulnérable à la corruption et à une croissance limitée. La campagne nous verra vendre des industries d'État non rentables pour aider à stimuler le développement de Khulna en tant que centre financier du pays. Nous espérons qu'à la fin, nous contribuerons non seulement à soutenir une révolution financière, mais que nous verrons également notre production industrielle augmenter à mesure que ces entreprises d'État non rentables entreront dans le secteur privé. Le ministre des Finances est si confiant qu'il a proposé un plan révisé, appelant à maximiser la vente des entreprises d'État pour un succès encore plus grand. Le président doit décider s'il doit suivre la recommandation ou maintenir le plan tel qu'envisagé."
 BAN_CC.3.d:0 "La récente campagne de privatisation a abouti à un énorme succès pour le gouvernement. La vente de nombreuses entreprises d'État a d'abord surpris la nation, de nombreuses publications de gauche la qualifiant de trahison flagrante envers les travailleurs. Cependant, il est clair que bon nombre de ces anciennes entreprises d'État prospèrent sous propriété privée, stimulant ainsi la production industrielle du pays et créant davantage d'emplois pour les travailleurs. Plus important encore, la libération des capitaux a permis au gouvernement de faire de Khulna un centre financier majeur pour la région. De nombreuses banques, y compris étrangères, profitent des incitations gouvernementales pour s'implanter dans la ville. Le gouvernement jouit d'une popularité sans précédent."
 BAN_CC.4.d:0 "La récente campagne de privatisation s'est soldée par un échec pour le gouvernement. Malgré les promesses selon lesquelles la vente des entreprises publiques non rentables entraînerait une croissance et une innovation de la part du secteur privé, cela ne s'est pas concrétisé. Beaucoup de ces nouvelles entreprises privatisées sont sur le point de s'effondrer. L'incapacité à accroître la production ou la croissance a conduit de nombreuses entreprises à réduire leurs effectifs et leurs salaires, conduisant à d'intenses conflits du travail. Cela a fini par obliger le gouvernement à intervenir et à soutenir certaines de ces entreprises pour prévenir la violence dans les rues. En fin de compte, le gouvernement a dû abandonner son projet et admettre que ses efforts avaient entraîné un déclin de la croissance industrielle. L'opposition profite de chaque occasion pour embarrasser le gouvernement à cause de son échec."
 BAN_CC.5.d:0 "La récente campagne de privatisation s'avère être un succès pour le gouvernement. La liquidation des entreprises d'État a d'abord surpris beaucoup de monde, certaines publications de gauche la qualifiant de trahison flagrante envers les travailleurs. Cependant, il est clair que la plupart de ces anciennes entreprises d'État prospèrent sous propriété privée, stimulant la production industrielle du pays et fournissant davantage d'emplois et, parfois, des salaires plus élevés aux travailleurs. Plus important encore, la libération des capitaux a permis au gouvernement de faire de Khulna un centre financier majeur pour la région. L'afflux d'institutions financières, notamment des banques régionales, transforme la région. Le gouvernement jouit d'une popularité croissante grâce à son programme."
 BAN_CC.6.d:0 "Le gouvernement a discrètement annoncé qu'il suspendrait sa campagne de privatisation. Malgré les promesses selon lesquelles la vente de certaines entreprises d'État non rentables entraînerait une croissance et une innovation de la part du secteur privé, cela ne s'est pas concrétisé. Beaucoup de ces nouvelles entreprises privatisées sont sur le point de s'effondrer. L'incapacité à accroître la production ou la croissance a conduit de nombreuses entreprises à réduire leurs effectifs et leurs salaires, conduisant à d'intenses conflits du travail. En fin de compte, le gouvernement a admis que son programme n'avait abouti qu'à un déclin de la croissance industrielle. L'opposition profite de chaque occasion pour embarrasser le gouvernement à cause de son échec."
 BAN_CC.7.d:0 "La coalition des partis conservateurs qui dirigent actuellement le Bangladesh a récemment signé une constitution pour former un parti politique unifié appelé Parti nationaliste du Bangladesh (BNP). Les signataires, tous les chefs de parti des membres de la coalition, ont accepté de servir sous la direction du président et de céder immédiatement leur parti au profit d'un nouveau Comité central. L'annonce de la création d'un nouveau parti transforme complètement le paysage politique du Bangladesh. La Ligue Awami, qui a traditionnellement dominé la gauche politique, a désormais un adversaire avec une domination égale sur la droite politique du pays. Le BNP est salué comme une force stabilisatrice de la politique bangladaise."
 BAN_CC.8.d:0 "La coalition des partis conservateurs qui dirigent actuellement le Bangladesh a récemment signé une constitution pour former un parti politique unifié appelé Parti nationaliste du Bangladesh (BNP). Les signataires, tous les chefs de parti des membres de la coalition, ont accepté de servir sous la direction du président et de céder immédiatement leur parti au profit d'un nouveau Comité central. L'annonce de la création d'un nouveau parti transforme complètement le paysage politique du Bangladesh. La Ligue Awami, qui a traditionnellement dominé la gauche politique, a désormais un adversaire avec une domination égale sur la droite politique du pays. Le BNP est salué comme une force stabilisatrice de la politique bangladaise."

 JSD_Insurgency.100.d:0 "La Ligue Chatra, qui est l'aile jeunesse de la Ligue Awami, s'est récemment scindée. De nombreux militants ont exprimé leur consternation face à ce qu'ils perçoivent comme un manque de zèle révolutionnaire de la part du gouvernement. En particulier, ils s'opposent à l'utilisation de l'islam par les responsables gouvernementaux et à l'absence de poursuites contre ceux qu'ils considèrent comme des traîtres à la nation. Les dissidents ont formé leur propre groupe appelé Jatiya Samamtantrik Dal (JSD). Il s'agit d'une évolution inquiétante dans la mesure où le nouveau groupe, composé d'étudiants et de jeunes officiers militaires, a également créé une aile militante secrète appelée Gonobhani. Des rapports font état d'étudiants abandonnant leurs dortoirs et de soldats désertant leurs unités pour se retrouver dans la jungle. Nous devons surveiller la situation de près."
 JSD_Insurgency.101.d:0 "Une récente vague d'assassinats a ébranlé la nation et le Parti Awami. Ces fusillades et attentats flagrants sont revendiqués par le JSD et sa branche militante, les Gonobhani. Ils prétendent que le gouvernement trahit la nation et manque d'esprit révolutionnaire. Ils plaident pour une révolution socialiste complète au Bangladesh. Le JSD est composé d'anciens membres de la Chatra League qui se sont séparés du groupe plusieurs mois plus tôt. Les unités militaires et policières signalent une augmentation des incidents impliquant des combattants armés. Le JSD a déclaré la guerre au Bangladesh, mais le gouvernement ne cédera pas à ses revendications."
 JSD_Insurgency.102.d:0 "Les manifestants pacifiques soutenant le JSD ont été accueillis par des tirs de la force paramilitaire gouvernementale appelée Jatiya Rakhi Bahini (JRB). Le JSD a affirmé que jusqu'à soixante manifestants avaient été tués, tandis que le gouvernement affirme que ce chiffre est de cinq ou six. La fusillade a eu lieu après que les manifestants du JSD se sont déplacés pour encercler la résidence du ministre de l'Intérieur. Les manifestants étaient furieux des informations accusant la corruption d'être responsable de la récente flambée de l'inflation à travers le pays. Le JRB a affirmé que les manifestants étaient hors de contrôle et que, pour empêcher une série d'incidents, ils avaient eu recours à la force. La fusillade a suscité la colère de nombreux Bangladais qui considèrent de plus en plus le JRB comme une branche armée de la Ligue Awami au pouvoir. Le JRB fait également face à des accusations de torture et de détentions illégales."

 JSD_Insurgency.1.d:0 "Le JSD compte beaucoup sur ses contacts au sein de nos rangs et du gouvernement. Nous en avons récemment profité. Un officier avait été approché par des sympathisants du JSD pour soutenir leur cause. Il en a informé nos agents de renseignement qui se sont arrangés pour qu'il devienne agent double. Il a jusqu'à présent identifié plusieurs cellules du JSD et des sympathisants présumés. Nous les surveillons de près et les empêchons d'obtenir des renseignements préjudiciables. Avec de tels atouts, nous finirons par détruire leurs partisans au sein de l'armée et rétablir l'ordre dans la nation."
 JSD_Insurgency.2.d:0 "Le JSD compte beaucoup sur ses contacts au sein de nos rangs et du gouvernement. Nous en avons récemment profité. Un officier avait été approché par des sympathisants du JSD pour soutenir leur cause. Il en a informé nos agents de renseignement qui se sont arrangés pour qu'il devienne agent double. Malheureusement, le JSD semble avoir réalisé notre projet. Ils nous ont joué et notre officier a disparu. Il avait identifié plusieurs sympathisants du JSD dans l'unité, mais cette information s'est révélée fausse. Ce fut un revers majeur pour nos agents de renseignement, nous devons repenser les tactiques utilisées pour dénicher dans les rangs les infiltrés du JSD."
 JSD_Insurgency.3.d:0 "Le JSD est composé de mécréants et de voleurs déterminés à semer l'anarchie et la violence parmi la population. Là-bas, les combattants sont plus aptes à voler et à tuer des civils qu'à engager le combat. Cela a été prouvé récemment lorsque nos militaires ont identifié une cellule du JSD agissant dans leur zone. Un assaut est lancé qui débusque l'ennemi, lui infligeant des pertes. Des prisonniers ont également été faits. Non seulement nous avons rétabli l'ordre dans la zone, mais nous avons également obtenu de précieux renseignements sur les opérations ennemies. C'est une grande victoire pour la nation."
 JSD_Insurgency.4.d:0 "Nous savons que le JSD est constitué d'une foule armée plus efficace pour terroriser les civils que pour engager nos forces militaires. Malheureusement, l'une de nos unités militaires a tenté, avec trop de confiance, d'attaquer un avant-poste du JSD dans la jungle. Ils n'ont pas réussi à effectuer une reconnaissance adéquate, ce qui a conduit leur attaque à être contrecarrée par un ennemi retranché. Nos hommes ont subi des pertes et ont été contraints de se retirer en désarroi. Le JSD le présente comme une victoire majeure et le moral de nos soldats présents dans la zone est très bas. Il nous faudra du temps pour rétablir l'ordre et rétablir la confiance."
 JSD_Insurgency.5.d:0 "Des civils amis ont remarqué un important camp du JSD situé dans la jungle à proximité de leur village. Envoyer des troupes ne ferait que les faire fuir ou fortifier leur place forte. Un officier courageux s'est porté volontaire pour s'habiller en civil, avec une radio et explorer les concessions. Il a réussi à identifier le camp et ses coordonnées. L'unité d'artillerie locale a alors lancé un bombardement. Nos forces ont enquêté sur le site ciblé, découvrant des pertes ennemies ainsi que des preuves selon lesquelles le site avait été un dépôt d'armes. De précieux documents de renseignement ont également été obtenus lorsque le lâche JSD a fui la zone. C'est une victoire majeure pour nos forces."
 JSD_Insurgency.6.d:0 "Des civils amis ont remarqué un important camp du JSD situé dans la jungle à proximité de leur village. Envoyer des troupes ne ferait que les faire fuir ou fortifier leur place forte. Un officier courageux s'est porté volontaire pour s'habiller en civil, avec une radio et explorer les concessions. Il a réussi à identifier le camp et ses coordonnées. Malheureusement, les coordonnées semblent avoir été mal comprises. La frappe d'artillerie a manqué la cible et quelques obus sont tombés dans le village. Les habitants, autrefois pro-gouvernementaux, sont furieux. Nous devons travailler à corriger ces erreurs, mais cet échec a affaibli notre influence dans la zone contestée."
 JSD_Insurgency.7.d:0 "Le JSD a officiellement pris le contrôle du gouvernement du Bangladesh. Ils ont récemment remporté une série de succès militaires majeurs. Alors que leurs combattants approchaient de Dacca, les sympathisants du JSD au sein de l'armée ont agi, prenant le contrôle des unités et arrêtant des officiers fidèles au gouvernement. De hauts dirigeants politiques et militaires bangladais sont désormais en état d'arrestation. La direction du JSD a pris le contrôle des médias d'État et a publié une déclaration. Ils ont promis la mise en oeuvre d'une véritable révolution socialiste au Bangladesh. Le peuple bangladais attend l'avenir avec une grande appréhension car il craint que le nouveau régime ne déclenche un règne de terreur."
 JSD_Insurgency.8.d:0 "Le gouvernement du Bangladesh a confirmé que le JSD ne constitue plus une menace. Cela fait suite à une série de succès militaires de l'armée bangladaise face aux rebelles. Le gouvernement note que le JSD pourrait avoir encore des sympathisants dans l'armée, mais que ces cellules seront expulsées. Un haut responsable a noté que le JSD est tellement affaibli que ces cellules ne disposent d'aucune cellule de direction sur laquelle faire appel. Il s'agit d'un succès majeur pour le gouvernement. Les membres du JSD qui ne se sont pas engagés dans la lutte armée bénéficieront d'une amnistie pour contribuer à restaurer l'unité du pays."

 JSD_Insurgency_Decisions:0 "L'insurrection de Jatiya Samajtantrik Dal"
 JSD_Insurgency_Decisions_desc:0 "Le Jatiya Samajtantrik Dal s'est séparé de l'aile jeunesse de la Ligue Awami. Ils ont quitté le parti car ils estimaient que la Ligue Awami n'avait pas tenu sa promesse d'apporter le socialisme au Bangladesh. Le groupe a formé une branche armée appelée Gonobhaini. Craignant une corruption accrue et une répression étatique, le groupe a décidé de lancer une insurrection contre le gouvernement. Le JSD souhaite renverser la Ligue Awami, remplacer la vieille garde et apporter une véritable vision socialiste à la nation.\n\n[?ROOT.JSD_Strength|R]%"
