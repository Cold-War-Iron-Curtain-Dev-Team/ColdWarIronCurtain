 HUN_Agrarian_Reform_Decisions_OTL:0 "Achever la collectivisation agricole"
 HUN_Agrarian_Reform_Decisions_OTL_desc:0 " La collectivisation a, malgré ses critiques, connu un succès relatif en Hongrie. Bien qu'il soit controversé au sein de notre peuple et qu'il soit encore loin d'être optimal, l'abandonner purement et simplement serait une erreur critique. Cela étant dit, nous devons à la fois l'étendre et la réformer si nous voulons vraiment qualifier notre collectivisation de complète et de réussie. Avec la campagne des Terres Vierges en URSS, quel meilleur moment que maintenant ?"
 HUN_Agrarian_Reform_Decisions_ATL:0 "Réformer notre agriculture"
 HUN_Agrarian_Reform_Decisions_ATL_desc:0 "La collectivisation agricole traditionnelle est inefficace et totalement incompatible avec les objectifs à long terme du communisme du Goulash. Alors que nous poursuivons la réforme de notre industrie et d'autres secteurs de notre économie, nous devons accorder la même attention à notre agriculture. Même si la décollectivisation nous apportera une faveur immédiate auprès de nos agriculteurs, nous devons toujours nous assurer que nos agriculteurs peuvent se débrouiller seuls et que notre population reste nourrie."

