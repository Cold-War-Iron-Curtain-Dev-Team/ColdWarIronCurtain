 HUN_KADAR_ECON.1.d:0 "L'un des plus grands problèmes économiques auxquels nous sommes confrontés en tant que nation est notre déficit commercial. Nous sommes contraints de faire face à ce problème depuis des décennies sans succès, et récemment, la situation semble s'aggraver, ce qui a des conséquences désastreuses pour notre économie, qui dépend de plus en plus du commerce extérieur. Ce qui rend la résolution de ce problème encore plus nécessaire, c'est le fait que nos réformes sont très populaires auprès de notre population, et que de nombreuses personnes, tant au sein du parti qu'à l'extérieur, pensent que si nous parvenons à maintenir notre croissance actuelle et à suivre la voie tracée par le camarade Kadar, la menace de la chute du socialisme en Hongrie pourrait être totalement écartée ! Cela dit, nous devons résoudre ce problème dès que possible, et pour ce faire, bien qu'il y ait beaucoup de choses que nous pouvons faire pour améliorer la situation, nous n'avons que deux options à notre disposition si nous recherchons une solution à long terme. Nous pouvons soit nous tourner vers l'Occident, obtenir de nouvelles routes commerciales et élargir considérablement nos importations et nos exportations. L'alternative consiste à étendre considérablement nos routes commerciales vers l'est et à rechercher un soulagement à long terme auprès de l'Union soviétique, qui s'est montrée plus que disposée à nous fournir l'aide dont nous avons besoin.\n\nD'une part, l'ouverture vers l'ouest sera une étape importante pour faire reconnaître notre gouvernement au niveau international et augmenter considérablement le volume de nos importations et exportations. Cependant, cela négligerait nos routes commerciales préexistantes, créerait probablement un cauchemar logistique pour nos économistes qui tenteraient de faire passer des marchandises à travers les frontières de l'OTAN et du Pacte de Varsovie, et ne nous apporterait probablement aucune solution à long terme tant que la guerre froide se poursuivrait. L'alternative consisterait à améliorer les infrastructures commerciales dans tout le bloc de l'Est, à renforcer l'efficacité du CAEM et, si les Soviétiques acceptent notre proposition, à les voir prendre en charge et combler entièrement notre déficit commercial. Cela nous rendrait toutefois de plus en plus dépendants de Moscou, ne ferait pas avancer la reconnaissance internationale de notre gouvernement et, si les Soviétiques refusaient, nous nous retrouverions à la case départ, mais avec encore moins d'options qu'auparavant."
 HUN_KADAR_ECON.2.d:0 "Aujourd'hui le Kremlin a reçu une requête perplexe de la part de Budapest, alors que Kádár et son gouvernement cherchent à surmonter les défis économiques du pays. La Hongrie, même après avoir écrasé l'insurrection de 1956, a adopté une position plus ambivalante à l'égard du monde occidental que nos alliés. Le principal obstacle économique de la Hongrie, avant même l'arrivée de Kádár au gouvernement, était son déficit commercial sans cesse en hausse. En raison du flirt hongrois avec l'Europe de l'Ouest et ses tentatives de recevoir de la reconnaissance internationale (une initiative dans laquelle nous avons été plus qu'heureux de les aider), Budapest a décidé de faire la bonne décision et venir nous aider de nouveau. Cela dit, l'ampleur de la demande hongroise a laissé de nombreux membres du PCUS dans l'incertitude quant à l'opportunité d'accepter cette requête. Au final, la Hongrie nous demande de prendre le relais et combler son déficit commercial à leur place. D'un côté, cela assurera la longétivité du socialisme hongrois, qui garantit sa longévité même sans notre aide, et permet d'alléger les tâches administratives et le stress. En plus de cela, cela liera potentiellement la Hongrie à Moscou économiquement pour toujours, sans mentionner les bénéfices d'une Hongrie stable et économiquement puissante qui rayera sans doute les coûts nécessaires pour la redresser. Un autre point en faveur de la Hongrie est la loyauté irréprochable dont fait preuve Kádár, en suivant la ligne sans faille et obéissant à nos directives et ordres sans se plaindre et avec une diligence inégalée par nos autres alliés. Mais de l'autre côté, se charger du déficit entier nous arrachera un montant considérable d'argent et compte tenu de la précarité du PCUS actellement et nos problèmes internes, certains membres du parti ne croient pas que nous soyons capables d'encaisser cette proposition actuellement. Indépendamment, Budapest attend une réponse, et nous devrions mieux ne pas les faire attendre."
 HUN_KADAR_ECON.21.d:0 "De bonnes nouvelles de la part de Moscou ! Les Soviétiques ont décidés de nous sauver encore une fois, et se sont accorder à prendre en charge notre déficit commercial ! Bien que cela ne résoudra peut être pas les problèmes liés à la hausse des dépenses de consommation, ou que cela nous aidera directement avec la modernisation de notre économie, ils ont assuré à ce que nous ne tombions plus dans un gouffre d'endettement croissant dont ne pourrions pas sortir et, à long terme, ils auront très probablement sauvé notre économie en comblant notre déficit. Maintenant que nous avons cette plus grande marge de manœuvre, nous pouvons continuer la vision de Kádár sans risque de crise ou de pression, et nous pouvons garantir que notre peuple ne manquera jamais à l'appel dans un avenir prévisible. Même si beaucoup l'ignorent, le Kadarisme est là pour le dire, grâce à la générosité de Moscou."
 HUN_KADAR_ECON.22.d:0 "Graves nouvelles en provenance de Moscou aujourd'hui, il semble que nous soyons à court de chance. Alors qu'ils étaient plus qu'enclins à nous aider auparavant, il semble que les Soviétiques aient atteint leurs limites et refusent de prendre en charge notre déficit. Alors qu'ils invoquent leurs propres problèmes internes pour justifier cette situation, nous nous sommes déjà engagés auprès de nos alliés de l'Est et avons commencé à brûler les quelques ponts qu'il nous reste avec le monde occidental.  En l'absence de solution à notre déficit, et alors qu'il devient de plus en plus impossible de tendre la main à l'Occident, nous ne pouvons qu'espérer désespérément trouver une autre solution..."
 HUN_KADAR_ECON.6.d:0 "Si l'on compare une seule de nos grandes villes à une ville de taille moyenne en Europe occidentale, l'état pathétique de nos infrastructures ne pourrait être plus évident.  Routes en mauvais état, autoroutes décevantes, vastes zones rurales, absence de chemins de fer modernes et des métros minuscules mal entretenus qui parsèment nos villes... Personne de bonne foi ne peut qualifier notre pays de moderne.  Cependant, sous la direction de Kádár et grâce à l'attention croissante que les partis accordent à notre économie, nous sommes prêts à consacrer d'importantes ressources à la refonte totale des infrastructures de notre nation. De nouvelles routes, de nouvelles voies ferrées et même une expansion majeure du métro de Budapest nous permettront de faire un grand pas vers l'objectif de modernisation totale. Sous la direction de Kadar, nous pouvons garantir à notre population qu'elle pourra être fière de vivre dans une ville hongroise."
 HUN_KADAR_ECON.3.d:0 "Alors que nous continuons d'étendre le rôle de l'économie de marché dans notre système socialiste, nous sommes confrontés à la question cruciale de l'avenir de notre agriculture. La collectivisation a fonctionné pour nous, pour l'instant sans faille, et bien qu'elle présente des défauts, ce n'est pas une petite réforme à petite échelle et un financièrement supplémentaire ne peut pas résoudre le problème. Si nous maintenons le cap et poussons la collectivisation agraire au maximum, ce qui est sur le point de se produire, la capacité de nourrir notre peuple ne sera pas une source d'inquiètude ni de peur pour un futur proche. Cela dit, cela ne passera sans doute pas auprès des paysans, un groupe avec qui nous avons du mal à gagner la confiance, sans parler des voix réformistes de plus en plus nombreuses qui pensent que la décollectivisation permettera non seulement d'augmenter le profit de nos fermes, mais aussi rendre notre économie plus compatible avec celles des pays de l'Ouest, assurant une facilité des échanges et investissements sans dévier complètement du socialisme. Aussi soundain soit-il, tout changement immédiat ne peut avoir d'issue favorable, car il risque d'absolument détruire notre productivité agricole. Parallèlement, supprimer le rôle de l'État dans la garantie d'un accès à des technologies de pointe pour nos agriculteurs exercera une pression financière supplémentaire sur notre population. Quoi qu'il en soit, si nous ne parvenons pas à mener à bien l'un ou l'autre de ces choix, la famine et l'effondrement de l'agriculture seront inévitables."
 HUN_KADAR_ECON.10.d:0 "Nos efforts pour rénover l'agriculture hongroise se sont avérés être un véritable succès! Bien que nous n'ayons pas rencontré de problèmes majeurs en matière d'approvisionnement alimentaire, nos exploitations agricoles étaient loin d'être modernes et nos agriculteurs loin d'être satisfaits. Mais maintenant, nos fermiers vivent confortablement et sont bien rémunérés pour leur travail. Grâce à la technologie avancée, à la rénovation des logements et à une productivité agricole record, notre administration n'a jamais été aussi populaire depuis qu'Imre Nagy a usurpé notre gouvernement légitime !  De plus, grâce à l'excédent dont nous bénéficions actuellement, nous disposons d'une source de revenus supplémentaire pour financer nos dépenses de consommation croissantes et d'un nouveau moyen de combler notre déficit commercial en vendant les récoltes hongroises à nos alliés.  Nos fermes étant sécurisées et prospères, nous pouvons désormais nous concentrer pleinement et en toute confiance sur des crises plus urgentes, sachant que nous disposons d'une base solide sur laquelle nous appuyer."
 HUN_KADAR_ECON.11.d:0 "Les nouvelles de Budapest provoquent encore une fois l'inquiétude au sein du bloc de l'Est, par contre cette fois ça n'a rien à voir avec une invasion. Récemment, János Kádár et son gouvernement ont annoncés faire un effort pour totalement rénover et moderniser les fermes hongroises pour assurer une stabilité agraire sur le long terme. Cependant, ce matin, des rapports ont fait état d'un effondrement total de l'agriculture hongroise, alors qu'une famine auto-infligée ravage désormais le pays. Si le pire semble avoir été évité grâce à une augmentation désespérée des importations de céréales en provenance de l'Union soviétique, il s'agit sans aucun doute d'un coup dévastateur pour le gouvernement Kádár, déjà construite sur des bases fragiles et impopulaires, et désormais contrainte de revenir sur la quasi-totalité des réformes précédemment engagées dans ce domaine. Dans un pays encore en pleine industrialisation, les implications à long terme pour l'économie hongroise ne sont pas non plus très réjouissantes, d'autant plus que le gouvernement refuse de réduire ses dépenses accrues en biens de consommation, ce qui risque de transformer la famine en une crise économique plus générale. Seul le temps nous dira si la Hongrie pourra se relever, alors qu'une nouvelle humiliation frappe la sphère d'influence Soviétique."
 HUN_KADAR_ECON.7.d:0 "Le communisme du goulash a apporté de nombreux avantages à notre économie et a prouvé que Kàdàr menait la Hongrie sur la bonne voie.  Aujourd'hui cependant, nous nous préparons à lancer un plan de réforme à grande échelle de notre économie.  Le Nouveau Mécanisme Économique, ou NME, sera le guide à long terme de notre économie et visera à mettre en œuvre des réformes radicales, en abandonnant presque entièrement l'économie planifiée et en passant à un modèle économique principalement basé sur le profit, tout en conservant les principes socialistes. Bien que le chemin soit difficile et que des changements devront probablement être apportés au fil du temps, c'est finalement la nature même de la réforme, et nous effectuerons fièrement tous les changements nécessaires, dans l'intérêt de la stabilité économique et du progrès."
 HUN_KADAR_ECON.8.d:0 "Tout comme les réformes précédentes du camarade Kádár, la NME s'est avérée être un succès quasi total. Bien que nous soyons toujours confrontés à des problèmes mineurs, tels que la concurrence avec les marchés occidentaux et la recherche de nouveaux moyens pour suivre le rythme de nos dépenses en biens de consommation, notre économie connaît une croissance record, notre industrie est en pleine expansion, les rayons des magasins regorgent de produits hongrois et nos routes sont neuves et bien entretenues.  Le succès rapide de nos réformes économiques a même attiré l'attention de nombreux responsables à Moscou, et les relations autrefois hostiles que nous entretenions avec la population dans son ensemble ont pratiquement disparu, puisque nous bénéficions enfin d'un large soutien populaire. Pour beaucoup, nous avons réalisé l'impossible, et pour beaucoup au sein du parti, nous ne faisons que commencer."
