 HUN_KADAR_ECON.1.d:0 "L'un des plus grands problèmes économiques auxquels nous sommes confrontés en tant que nation est notre déficit commercial. Nous sommes confrontés à ce problème depuis des décennies, sans succès, et récemment, il semble que la situation ne fait qu'empirer, ce qui a des conséquences absolument mortifiantes pour notre économie, de plus en plus dépendante du commerce extérieur. Ce qui rend cette question encore plus nécessaire à résoudre, c'est le fait que nos réformes sont véritablement populaires auprès de notre peuple, et beaucoup, au sein et à l'extérieur du parti, croient que si nous pouvons maintenir notre croissance actuelle et suivre la voie tracée par le camarade Kadar, la menace de chute du socialisme en Hongrie peut potentiellement être entièrement évitée ! Cela étant dit, nous devons résoudre ce problème le plus rapidement possible et, ce faisant, même si nous pouvons faire de nombreuses choses pour atténuer la situation, nous n'avons que deux options parmi lesquelles choisir si nous recherchons une solution à long terme. Nous pouvons soit nous étendre vers l'ouest, ouvrir de nouvelles routes commerciales et élargir considérablement les destinations et exportations vers et depuis. L'alternative est d'élargir considérablement nos routes commerciales à l'est et de chercher un soulagement à long terme auprès de l'Union soviétique, qui s'est montrée plus que disposée à nous fournir l'aide dont nous avons besoin.\n\nD'une part, l'ouverture à l'Ouest constituera une étape importante dans la reconnaissance internationale de notre gouvernement et dans l'augmentation considérable du volume que nous importons et exportons. Cependant, cela néglige nos routes commerciales préexistantes, créera probablement un cauchemar logistique pour nos économistes qui tenteront de faire passer les marchandises à travers les frontières de l'OTAN et du Pacte de Varsovie, et ne nous apportera probablement aucune solution à long terme tant que la guerre froide se poursuivra. L'alternative verra une amélioration des infrastructures commerciales à travers le bloc de l'Est, contribuera à l'efficacité du CAEM et, si les Soviétiques acceptent notre proposition, ils pourraient probablement les voir assumer et combler entièrement notre déficit commercial par eux-mêmes. Cependant, cela nous rend de plus en plus dépendants de Moscou, ne fait aucun progrès dans la reconnaissance internationale de notre gouvernement, et si les Soviétiques refusent, nous nous retrouverons là où nous avons commencé, mais avec encore moins d'options qu'auparavant."
 HUN_KADAR_ECON.2.d:0 "Aujourd'hui, le Kremlin a reçu une demande déconcertante de Budapest, alors que Kadar et son gouvernement cherchent à surmonter les obstacles économiques du pays. La Hongrie, même après avoir écrasé la rébellion en 1956, a adopté une position plus ambivalente à l'égard du monde occidental que la plupart de nos alliés. Le principal obstacle économique de la Hongrie, avant même que Kadar soit nommé nouveau dirigeant, était son déficit commercial toujours croissant. En raison du flirt de la Hongrie avec l'Europe occidentale dans ses tentatives d'obtenir une reconnaissance internationale (une initiative que nous avons été plus qu'heureux de les aider), Budapest a décidé de prendre la bonne décision et de s'adresser à nouveau à nous pour obtenir de l'aide. Cependant, l'ampleur de ce que la Hongrie nous demande laisse de nombreux membres du PCUS indécis quant à savoir si nous devons ou non accepter leur demande. En fin de compte, la Hongrie nous demande de prendre en charge et de combler son déficit commercial à sa place. D'une part, cela garantira la longévité du socialisme hongrois, garantissant sa longévité même sans notre main directrice, ce qui en retour atténuera beaucoup de soucis et de stress administratifs. En outre, cela pourrait potentiellement lier de manière permanente la Hongrie à Moscou sur le plan économique, sans compter que les avantages d'une Hongrie économiquement forte et stable dépasseront sans aucun doute les coûts liés à son aide. Un autre point en faveur de la Hongrie est la loyauté incontestable dont Kadar a fait preuve, en suivant la ligne sans faute, en suivant nos directives et nos ordres sans se plaindre et avec une diligence inégalée par nos autres alliés. D'un autre côté, assumer l'intégralité de leur déficit retirera une somme considérable d'argent de notre propre trésor, et étant donné la nature précaire actuelle du PCUS et nos propres problèmes croissants, certains dans le parti ne croient pas que nous soyons en mesure d'assumer ce fardeau en ce moment. Quoi qu'il en soit, Budapest attend une réponse et nous préférons ne pas la faire attendre longtemps."
 HUN_KADAR_ECON.21.d:0 "Excellente nouvelle de Moscou ! Les Soviétiques ont décidé de nous sauver une fois de plus et ont accepté de prendre en charge notre déficit commercial ! Même si cela ne résoudra peut-être pas les problèmes de consommation croissante ni ne contribuera directement à la modernisation économique, ils ont veillé à ce que nous ne tombions pas dans un gouffre d'endettement toujours croissant dont nous ne pouvons pas sortir et, à long terme, ils ont très probablement sauvé notre économie en comblant notre déficit. Grâce à une grande marge de manoeuvre, nous pouvons désormais poursuivre la vision complète de Kadar sans aucun risque de crise ou de pression, et nous pouvons garantir que nos collaborateurs ne seront jamais trouvés en difficulté dans un avenir prévisible. Même si beaucoup ne le savent peut-être pas, le Kadarisme est là pour s'exprimer, grâce à la générosité de Moscou."
 HUN_KADAR_ECON.22.d:0 "Grave nouvelle de Moscou aujourd'hui, car il semble que notre chance soit terminée. Même s'ils étaient plus que disposés à nous sauver auparavant, il semble que les Soviétiques aient atteint leurs limites et refusé de prendre en charge notre déficit. Alors qu'ils citent leurs propres problèmes internes pour expliquer pourquoi, nous nous sommes déjà engagés envers nos alliés de l'Est et avons commencé à brûler les ponts, certes modestes, qu'il nous reste avec le monde occidental. Sans solution à notre déficit et où il devient de plus en plus impossible d'atteindre l'Occident, nous ne pouvons qu'espérer désespérément pouvoir trouver une autre solution..."
 HUN_KADAR_ECON.6.d:0 "Si nous devions comparer l'une de nos grandes villes à celle d'une ville de taille moyenne en Europe occidentale, l'état lamentable de nos infrastructures ne pourrait être plus évident. Des routes en mauvais état, des autoroutes en mauvais état, de vastes agglomérations rurales, le manque de chemins de fer modernes et des métros minuscules et pitoyablement entretenus parsemant nos villes, personne en bonne conscience ne nous qualifie de pays moderne. Cependant, sous la direction de Kadars et l'attention toujours croissante que les partis accordent à notre économie, nous sommes prêts à consacrer d'énormes ressources à la refonte totale de l'infrastructure de notre pays dans son intégralité. De nouvelles routes, de nouvelles voies ferrées et même une grande extension du métro de Budapest nous amèneront un long chemin vers l'objectif d'une modernisation totale, et sous la direction de Kadars, nous pouvons garantir que nos citoyens pourront être fiers de vivre dans une ville hongroise"
 HUN_KADAR_ECON.3.d:0 "Alors que nous continuons à étendre le rôle de l'économie de marché dans le cadre du système socialiste, nous sommes confrontés à la question cruciale du sort de notre agriculture. La collectivisation a fonctionné pour nous, jusqu'à présent, sans échec, et même si elle a ses défauts, il ne s'agit pas d'une réforme à petite échelle, et un financement supplémentaire ne peut pas résoudre le problème. Si nous maintenons le cap et insistons pour une collectivisation agricole complète, ce que nous sommes sur le point de réaliser, la capacité de nourrir notre population ne sera jamais un souci ni une crainte dans un avenir prévisible. Cela étant dit, cela ne sera probablement pas bien accueilli par les paysans, un groupe que nous avons particulièrement eu du mal à conquérir, sans parler des voix réformistes de plus en plus nombreuses au sein du Parti qui estiment que la décollectivisation augmentera non seulement les bénéfices de nos fermes, mais rendra également notre économie plus compatible avec celle occidentale, garantissant la facilité du commerce et des investissements sans s'éloigner complètement du socialisme économique. Cependant, un changement soudain et immédiat ne se termine jamais bien et risque de détruire complètement la productivité agricole actuelle, tandis que supprimer le rôle de l'État qui veille à ce que nos agriculteurs aient accès aux technologies les plus modernes exercera une pression financière accrue sur notre population. Quoi qu'il en soit, si nous ne parvenons pas à concrétiser l'un ou l'autre de ces choix, la famine et l'effondrement de l'agriculture s'ensuivront inévitablement."
 HUN_KADAR_ECON.10.d:0 "Nos efforts pour rénover l'agriculture hongroise se sont révélés être un succès retentissant ! Même si nous n'avons pas rencontré de problèmes majeurs en matière de disponibilité alimentaire, nos fermes étaient loin d'être modernes et nos agriculteurs loin d'être satisfaits. Mais aujourd'hui, nos agriculteurs vivent confortablement et sont correctement rémunérés pour leur travail. Technologie moderne, maisons rénovées et productivité agricole record, notre administration n'a plus été aussi populaire depuis qu'Imre Nagy a usurpé notre gouvernement légal ! De plus, avec l'excédent dont nous bénéficions actuellement, du moins pour l'instant, nous disposons d'une source de revenus étendue pour financer nos dépenses de consommation croissantes et d'une nouvelle voie pour combler notre déficit commercial, en vendant les récoltes hongroises au-delà des frontières de nos alliés. Nos fermes étant en sécurité et heureuses, nous pouvons désormais réorienter pleinement et de manière fiable notre attention vers des crises plus urgentes, sachant que nous disposons d'une base solide sur laquelle nous appuyer."
 HUN_KADAR_ECON.11.d:0 "Les dernières nouvelles en provenance de Budapest suscitent une fois de plus la peur dans le bloc soviétique, mais cette fois, pas à cause d'une invasion. Récemment, Janos Kadar et son administration ont annoncé un effort concentré pour rénover et moderniser entièrement les fermes hongroises et assurer la stabilité agraire à long terme. Cependant, depuis ce matin, des rapports font état d'un effondrement complet de l'agriculture hongroise, alors qu'une famine auto-infligée ravage désormais le pays. Même si le pire semble avoir été évité grâce à une augmentation désespérée des importations de céréales en provenance de l'Union soviétique, il s'agit sans aucun doute d'un coup dévastateur porté au gouvernement Kadars, déjà bâti sur des fondations fragiles et impopulaires, contraint désormais d'annuler presque toutes les réformes précédemment initiées dans ce domaine. Dans un pays encore en proie à l'industrialisation, les implications à long terme pour l'économie hongroise ne s'annoncent pas non plus bonnes, surtout compte tenu du refus du gouvernement de réduire ses dépenses accrues en biens de consommation, menaçant de passer d'une famine à une crise économique plus large. Seul le temps nous dira si la Hongrie pourra s'en remettre, alors qu'une nouvelle humiliation frappe la sphère soviétique."
 HUN_KADAR_ECON.7.d:0 "Le communisme du Goulash a apporté de nombreux avantages à notre économie et a été la preuve que Kadar mène la Hongrie sur la bonne voie. Mais nous nous préparons désormais à lancer un plan de réforme à grande échelle de notre économie. Le nouveau mécanisme économique, ou NEM, sera le guide à long terme de notre économie et cherchera à initier des réformes radicales, en abandonnant presque entièrement l'économie planifiée et en passant à un modèle économique principalement basé sur le profit, tout en maintenant les principes socialistes. Même si le chemin sera difficile et que des changements devront probablement être apportés au fil du temps, telle est en fin de compte la nature de la réforme, et nous apporterons fièrement tous les changements nécessaires, dans l'intérêt de la stabilité économique et du progrès."
 HUN_KADAR_ECON.8.d:0 "Tout comme les réformes précédentes du camarade Kadar, le NEM s'est avéré être un succès presque total. Même si nous sommes encore confrontés à des problèmes mineurs, tels que la concurrence avec les marchés occidentaux et la recherche de nouveaux moyens de suivre le rythme de nos dépenses en biens de consommation, notre économie croît à un rythme record, notre industrie se développe, les rayons des magasins sont remplis de produits hongrois et nos routes sont fraîches et bien entretenues. Le succès rapide de nos réformes économiques a même fait tourner de nombreuses têtes à Moscou, et les relations autrefois hostiles que nous entretenions avec l'ensemble de la population ont pratiquement disparu, car nous bénéficions enfin d'un large soutien populaire. Pour beaucoup, nous avons réalisé l'impossible, et pour beaucoup dans le parti, nous ne faisons que commencer."

