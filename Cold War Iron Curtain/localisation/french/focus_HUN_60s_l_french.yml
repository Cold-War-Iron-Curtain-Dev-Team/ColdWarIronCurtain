 HUN_60s_Kadar_The_Sweet_60s_in_Hungary_desc:0 "Cela ne fait que 4 ans depuis l'échec de la Révolution, et même si nous avons parcouru un long chemin, il nous reste beaucoup de travail devant nous. Les relations entre le parti et le peuple sont toujours tendues, nos forces armées sont pratiquement inexistantes et nous n'avons toujours pas de réponse sur la direction que doit prendre notre économie ou notre politique étrangère. Telles sont parmi les nombreuses questions auxquelles nous devrons répondre au cours des prochaines années."
 HUN_60s_Kadar_Prepare_For_the_8th_Party_Congress_desc:0 "Parmi nos principales priorités figure le prochain 8e Congrès du Parti socialiste ouvrier hongrois. Si nous ne voulons pas être laissés pour compte par le reste de nos alliés, nous devons affirmer notre stratégie actuelle et décider de notre rôle non seulement dans le Pacte de Varsovie, mais également sur la scène mondiale."
 HUN_60s_Kadar_Reign_in_the_Paranoia_desc:0 "Depuis que les forces de maintien de la paix soviétiques ont réprimé la Révolution ratée, les membres de notre Parti ont été constamment paranoïaques à l'idée de faire quoi que ce soit, ou d'apporter le moindre changement, avec la peur infondée d'une seconde invasion qui les tourmentait. Si nous souhaitons accomplir quelque chose, nous devons d'abord y remédier."
 HUN_60s_Kadar_Maintaining_Intra_Bloc_Relationships_desc:0 "Bien que notre gouvernement ait maintenant quatre ans, nous sommes encore relativement nouveaux sur la scène et devrions réévaluer et solidifier nos relations avec nos voisins idéologiques."
 HUN_60s_Kadar_The_Western_Question_desc:0 "Une fois nos bases orientales couvertes et les Soviétiques apaisés, du moins pour le moment, nous devons décider quelle sera notre politique à l'égard du monde occidental. Devrions-nous suivre nos camarades d'Allemagne de l'Est ou assouplir notre politique ?"
 HUN_60s_Kadar_Re_Thinking_Our_Strategy_desc:0 "Le tollé violent auquel nous avons fait face en 1956, bien que réprimé, a montré que nous ne pouvons pas maintenir les mêmes vieilles politiques sans changement. Nagy, bien que traître contre-révolutionnaire, a conquis le coeur du prolétariat hongrois, et si nous voulons gagner une fraction de son soutien, nous devons opérer de nouveaux changements."
 HUN_60s_Kadar_The_VIII_Party_Congress_desc:0 "Enfin, après tous nos préparatifs et les réformes planifiées, l'heure du Congrès est arrivée. Maintenant que le moment est venu, exposons notre nouvelle stratégie réformée..."
 HUN_60s_Kadar_Initiate_Small_Scale_Liberalization_desc:0 "Après réévaluation, peut-être que les réformes de Nagy n'étaient pas totalement sans fondement et sans fondement. Même si nous devons faire attention à ne pas tomber sur la pente glissante de la corruption bourgeoise, beaucoup de nos mesures sont pour le moins excessives, mais revenir sur certaines de nos politiques les plus extrêmes sera une première étape importante pour garantir le soutien du public à notre gouvernement."
 HUN_60s_Kadar_Declare_General_Amnesty_desc:0 "Dans nos efforts pour renforcer le soutien populaire, nous entrerons sûrement en conflit avec certains des membres les plus radicaux et conservateurs du parti. Dans le même temps, de nombreux réformateurs innocents furent emprisonnés en raison de leur association avec le traître Nagy. Si nous faisons preuve de pitié envers nos vieux ennemis et expulsons les membres les plus radicaux de notre parti, nous pouvons au moins consolider notre position en interne."
 HUN_60s_Kadar_Realigning_Our_Foreign_Policy_desc:0 "Avec la solidification de notre règne au sein du parti, nous pouvons désormais aborder sérieusement la question de notre politique étrangère. Après tout, avec notre déficit commercial croissant et la nécessité de financer les réformes prévues, nous devons choisir vers qui nous tourner ; nos alliés orientaux ; ou pour adoucir nos relations avec l'Occident... Avec l'approbation soviétique bien sûr."
 HUN_60s_Kadar_Curtail_the_Secret_Police_desc:0 "L'AVH après la Révolution, bien qu'ayant de nobles extensions, est allée trop loin dans ses efforts pour empêcher une autre révolution. Si nous voulons gagner le soutien du peuple, le faire fanatiquement dans son cou ne fera que motiver une révolte future."
 HUN_60s_Kadar_Expanding_Goulash_Communism_desc:0 "Même si le temps que nous avons consacré à l'expérimentation du communisme Goulash a été à la fois limité et court, nous en constatons déjà les avantages. Avec un tel potentiel prometteur, il est tout à fait naturel de devenir plus ambitieux dans sa mise en oeuvre, car cela contribuera sans aucun doute à garantir le soutien populaire au parti."
 HUN_60s_Kadar_Solidify_Eastern_Ties_desc:0 "Même s'il est intéressant de s'étendre vers l'ouest, cela n'est pas raisonnable pour le moment. Beaucoup au sein du parti veulent poursuivre l'Occident pour obtenir des prêts ou obtenir une pleine reconnaissance de l'ONU. Les objectifs, même s'ils sont modestes, ne profiteront pas à la Hongrie à long terme. Avec nos projets d'augmentation de nos dépenses de consommation et une économie déjà déséquilibrée, la Hongrie n'a pas les moyens de rembourser ses prêts. De plus, nous voyons des avantages à plus long terme dans le renforcement de nos relations sans alliés idéologiques. Cela étant dit, les réformes que nous envisageons provoqueront probablement la colère des Soviétiques ; Voulons-nous « piquer l'ours » si tôt, surtout avec une présence aussi importante de l'Armée rouge à l'intérieur de nos frontières ?"
 HUN_60s_Kadar_Expand_Soviet_Aid_desc:0 "Nos camarades de Moscou n'ont été que bienveillants envers nous ; de la libération de la menace fasciste à la répression des opportunistes bourgeois en 1956. Maintenant que nous cherchons à revigorer nos relations avec le monde oriental, nous devrions à nouveau faire appel à leur aide. Compte tenu de nos projets de réorganisation et de développement de notre économie et de la nécessité de maintenir des finances stables pour soutenir nos projets d'augmentation des dépenses de consommation, Moscou devrait être plus qu'heureuse de nous aider une fois de plus, et sans risquer de se mettre en colère si nous étendions la même demande vers l'ouest."
 HUN_60s_Kadar_Expand_East_German_Trade_desc:0 "Il se peut que nous ne soyons pas d'accord avec nos alliés est-allemands, ni que nous puissions soutenir tous leurs choix parfois discutables ; mais ils restent un allié. Sans oublier que, même s'ils ne sont peut-être pas aussi robustes ou efficaces qu'ils pourraient l'être, leurs progrès économiques sont admirables. Nous ne pouvons tous les deux que gagner à élargir nos liens économiques avec eux."
 HUN_60s_Kadar_Reinvigorate_Soviet_Trade_desc:0 "L'importance du commerce au sein de notre économie ne peut être sous-estimée. Qu'il s'agisse d'importations ou d'exportations, nous ne pouvons nier qu'une part importante de nos résultats financiers en découle. Cela étant dit, nous ne pouvons pas prétendre que notre déficit commercial n'existe pas. Prêts à nous aider plus tôt, malgré les coûts potentiels qui y sont liés, il serait insensé de leur part de ne pas voir les avantages mutuels à long terme. Si l'Union soviétique parvient à combler son déficit commercial tout en développant son économie, nous pourrons éviter les complications liées à la recherche de l'aide occidentale, tout en étant en mesure d'apporter une solution temporaire à l'un de nos plus gros problèmes."
 HUN_60s_Kadar_Expand_Czechoslovakian_Trade_desc:0 "Même si nous n'avons pas toujours été d'accord, même lors de conflits sur le territoire slovaque dans le passé, la Hongrie et la Tchécoslovaquie se trouvent désormais toutes deux du même côté du champ de bataille. Le fait d'être voisins directs, de soutenir des relations amicales et des liens économiques mutuels plus complets présente un potentiel de grand bénéfice mutuel."
 HUN_60s_Kadar_Yesterdays_Foe_Todays_Friend_desc:0 "Dire que les relations entre la Hongrie et la Roumanie sont tendues serait peut-être le plus grand euphémisme de la décennie. Cependant, la Hongrie est dans une nouvelle ère, une ère de paix, du moins nous l'espérons. Dans cette nouvelle ère, la Hongrie a de nouveaux alliés, et la Roumanie en fait partie. Si nous voulons être des alliés efficaces et explorer des solutions diplomatiques pour atteindre nos objectifs, nous ouvrirons la porte à un large éventail d'options qui étaient autrefois possibles. Même si nous ne pouvons pas en faire trop, nous devons quand même faire les premiers pas."
 HUN_60s_Kadar_Deepen_Polish_Trade_Ties_desc:0 "Les relations modernes de la Hongrie avec la Pologne ont toujours été basées sur des concessions mutuelles, surtout après la tragédie de la Seconde Guerre mondiale. Mais aujourd'hui, nous sommes amis, ou du moins nous sommes censés le faire. Nous partageons tous les deux des problématiques économiques assez similaires et nous avons tous deux beaucoup à gagner à travailler ensemble. Faisons ensemble les premiers pas vers le rétablissement."
 HUN_60s_Kadar_Pursue_Further_COMECON_Integration_desc:0 "Si nous souhaitons trouver une solution permanente à notre déficit commercial, nous devons accroître nos capacités de production ; mais en même temps, il est extrêmement difficile d'étendre nos capacités de production si nous sommes constamment dans une situation de déficit financier en raison de nos déficits commerciaux. Une intégration plus profonde au sein du COMECON nous offre une solution temporaire à ces deux problèmes, car nos alliés peuvent nous aider à combler nos déficits et nous fournir l'aide indispensable au développement de nos capacités de production. Nous ne pouvons pas compter éternellement sur le COMECON ; aussi agréable que cela puisse être, mais pour l'instant, c'est notre meilleure solution économique à long terme, même si ce n'est que temporairement."
 HUN_60s_Kadar_The_Ferryman_of_Europe_desc:0 "Dire que nous devons choisir uniquement l'Est ou uniquement l'Ouest est tout à fait insensé. Nous serons éternellement reconnaissants de ce que les Soviétiques ont fait pour nous ; cependant, nous avons des problèmes urgents qui doivent être résolus le plus rapidement possible. Même si l'investissement et la gestion économiques à long terme constituent l'idéal, la Hongrie n'a pas les ressources nécessaires pour le faire à l'heure actuelle, et nous ne pouvons pas attendre des Soviétiques qu'ils fassent tout à notre place. Cependant, si la Hongrie parvient à obtenir la reconnaissance occidentale, elle pourra peut-être nous fournir une aide financière immédiate. Bien sûr, nous courons le risque de tomber dans le piège du retrait d'un trop grand nombre de prêts ; mais, à condition d'investir correctement, la Hongrie sera plus que capable de les rembourser le moment venu, n'est-ce pas ?"
 HUN_60s_Kadar_Regain_Bloc_Normal_Status_desc:0 "Notre statut au sein du Pacte de Varsovie et dans le reste du monde a été considérablement étouffé depuis la révolution hongroise. Beaucoup refusent même de reconnaître notre gouvernement à la suite de l'invasion soviétique. Si la Hongrie souhaite un jour retrouver la normalité diplomatique et réussir à combler les écarts entre l'OTAN et le Pacte de Varsovie, nous devons y remédier immédiatement."
 HUN_60s_Kadar_Expand_Western_Diplomacy_desc:0 "La Hongrie ne cherche pas à s'occidentaliser, ni à abandonner ses alliés orientaux, mais si nous souhaitons atteindre de nouveaux sommets, nous devons tendre la main aux deux côtés du monde. L'Europe de l'Est et l'Europe de l'Ouest sont peut-être divisées, mais cela ne signifie pas que nous ne pouvons pas franchir le mur."
 HUN_60s_Kadar_Reassure_the_Soviets_desc:0 "Malgré nos ouvertures occidentales, nous ne sommes que fidèles au camarade [SOV.GetLeader]. Alors que nous souhaitons élargir nos relations économiques et diplomatiques avec l'Occident, le rôle de la Hongrie dans le bloc de l'Est est une position que nous prenons avec fierté, et nous devons nous assurer que les Soviétiques le sachent."
 HUN_60s_Kadar_Meet_with_De_Gaulle_desc:0 "Si la Hongrie veut consolider ses relations avec l'Occident, une rencontre avec De Gaulle contribuera grandement à consolider notre légitimité à la fois envers l'Occident et la France et, espérons-le, jettera les bases d'une future coopération financière avec le bloc occidental."
 HUN_60s_Kadar_Start_Trading_With_the_West_desc:0 "Maintenant que la Hongrie a largement aplani ses relations avec le monde occidental, nous pouvons enfin commencer à ouvrir de nouvelles entreprises commerciales et à combler notre déficit. Même si la Hongrie risque d'être confrontée à des revers financiers à long terme, nous espérons être alors dans une meilleure position que nous ne l'avons été pour y faire face. Tout ce qui compte, c'est que la Hongrie puisse mettre ses marchandises en rayon et que nos industries obtiennent les ressources dont elles ont besoin, quelles que soient les conséquences à long terme."
 HUN_60s_Kadar_Attempt_to_Soften_East_West_Relations_desc:0 "Ce n'est pas parce que la Hongrie poursuit des relations plus étroites avec le monde occidental que nous devrions exclure nos alliés orientaux des avantages qui en découlent. En vérité, l'Est comme l'Ouest ont beaucoup à gagner si nous parvenons à apaiser les tensions."
 HUN_60s_Kadar_Consider_Western_Loans_desc:0 "Avec le rétablissement de la normalité à l'Est en 1956 et l'établissement de nouvelles relations avec l'Ouest ; avec même la reconnaissance des pays occidentaux, nous pouvons enfin trouver une solution provisoire à nos dépenses de consommation croissantes. Grâce aux prêts financiers occidentaux, la Hongrie peut non seulement soutenir ses dépenses, mais aussi financer son développement économique. Nous pourrons sûrement les rembourser le moment venu, n'est-ce pas ?"
 HUN_60s_Kadar_Handle_Rising_Anti_Kadar_Sentiment_desc:0 "La dernière décennie a été absolument stupéfiante pour la Hongrie. Libéralisation culturelle, croissance économique sans précédent, associées à notre succès dans la répression de la dissidence et de la colère suite à l'écrasement de la Révolution de 1956. Cependant, tout n'est pas sûr, car de nombreux membres du parti commencent à exprimer leurs inquiétudes."
 HUN_60s_Kadar_Address_Growing_Party_Unrest_desc:0 "Il semble que nous ayons largement sous-estimé le mécontentement suscité par nos réformes au sein du parti. C'est bien plus grave que ce que nous avions prévu au départ, et nous ne pouvons pas simplement espérer que cela passe avec le temps. Kadar doit trouver une solution, et vite."
 HUN_60s_Kadar_The_Remaining_Hardliners_desc:0 "L'ancien ministre de l'Intérieur Bela Biszku continue d'exercer une influence considérable au sein du parti, ayant acquis une notoriété grâce à ses sanctions efficaces et efficaces contre les dissidents après la Révolution ; il a même été vice-premier ministre de 1961 à 1962. Malgré cela, il n'est peut-être pas aussi digne de confiance qu'on le pensait au départ."
 HUN_60s_Kadar_Attempt_to_Cement_Kadars_Authority_desc:0 "Pour maintenir un gouvernement stable et apaiser l'opposition, nous devons réaffirmer le rôle du parti dans la société hongroise. L'essentiel de notre opposition venant des conservateurs et des partisans de la ligne dure, nous pourrions peut-être les apaiser temporairement, avant de les écraser complètement."
 HUN_60s_Kadar_Promote_Reformers_to_High_Party_Positions_desc:0 "Même si nous nous sommes débarrassés de la majeure partie des partisans de la ligne dure dans les années 1960, il reste encore suffisamment de conservateurs, ce qui rend la transition vers notre nouvelle doctrine encore plus difficile. Peut-être pouvons-nous résoudre cette impasse en les remplaçant par des réformistes plus fidèles."
 HUN_60s_Kadar_A_Letter_to_the_Soviets_desc:0 "Bela Biszku, ancien ministre de l'Intérieur, autrefois bras droit de Kadar, a de fait été rétrogradé et déshonoré. Cela étant dit, son influence n'a pas diminué, et nous ne pouvons pas simplement le retirer du parti ou l'arrêter, compte tenu des réactions négatives au sein du parti auxquelles nous serions confrontés, sans compter que cela saperait notre nouvelle orientation. Biszku n'a pratiquement aucune capacité à influencer notre politique, nous pouvons donc le laisser tranquille pour le moment... Cependant, les renseignements hongrois ont déterminé qu'il avait échangé des lettres avec Moscou... Il n'y a certainement pas de quoi s'inquiéter, n'est-ce pas ? Droite?"
 HUN_60s_Kadar_Rethinking_Military_Strategy_desc:0 "Même si nous avons connu une histoire militaire assez intéressante, depuis les Magyars médiévaux jusqu'à l'héritage durable de l'Autriche-Hongrie, en passant par nos forces armées pendant la Seconde Guerre mondiale, les temps ont changé, tout comme les besoins de la Hongrie. Pourquoi devrions-nous continuer à drainer notre trésorerie déjà épuisée vers quelque chose dont nous n'avons tout simplement pas besoin ?"
 HUN_60s_Kadar_Reduce_Military_Expenditures_desc:0 "Nos frères de Moscou assurent déjà la défense des frontières de l'Est avec l'OTAN et la Yougoslavie, tandis que la Hongrie est flanquée de tous les côtés par des alliés. Même si nous n'avons pas besoin d'une démilitarisation complète, nos finances seront mieux dépensées ailleurs."
 HUN_60s_Kadar_Shifting_Our_Resources_desc:0 "Grâce à des ressources substantielles désormais libérées du contrôle militaire, nous pouvons désormais les réinvestir dans notre économie. La Hongrie n'a toujours pas résolu son déficit commercial et doit trouver des moyens de maintenir ses dépenses de consommation. En outre, une fois que nous aurons réussi à restructurer notre économie, nous pourrons toujours réinvestir nos ressources plus tard."
 HUN_60s_Kadar_Join_the_Soviets_in_Prague_desc:0 "Nos camarades tchèques ont commis la même erreur que le traître Imre Nagy il y a près de dix ans, et la Hongrie ne peut tout simplement pas laisser cette situation perdurer. En outre, notre politique professe une loyauté totale envers l'Union soviétique, en échange d'une relative liberté dans la manière dont nous gérons notre situation intérieure, et nous ne sommes pas près de risquer de violer cette règle ou de provoquer une nouvelle invasion contre nous-mêmes."
 HUN_60s_Kadar_Increase_Soviet_Reliance_desc:0 "Un jour, la Hongrie pourra compter sur ses propres forces armées nationales, et un jour, nous pourrons apporter une contribution militaire significative au Pacte de Varsovie. Mais ce jour n'est pas aujourd'hui et nous devons désespérément nous concentrer sur l'économie civile. Avec une présence militaire soviétique importante déjà établie dans tout le pays, nous devrions continuer à compter sur eux pour nous protéger dans cette phase critique de restructuration."
 HUN_60s_Kadar_Rely_on_Soviet_Designs_desc:0 "Au cours des années 1930 et 1940, la Hongrie avait la capacité de proposer et de développer ses propres créations indigènes. Dès la période austro-hongroise, nous avons même lancé des concepts et des prototypes pour de nouveaux chars et armes. Les temps ont cependant changé et, alors que notre industrie militaire continue de passer au second plan, nous devons compter sur nos camarades soviétiques pour les armes et les véhicules. En outre, le partage de conceptions augmentera la cohésion avec nos alliés."
 HUN_60s_Kadar_Continue_Using_Soviet_Weapons_desc:0 "Même si nous disposons d'une petite base de production, elle est loin d'être suffisante pour équiper une armée à elle seule, même si nous réduisons nos effectifs. Cependant, non seulement nos frères de Moscou disposent d'armes fiables, mais ils sont prêts à les partager avec nous, même s'ils sont un peu dépassés."
 HUN_60s_Kadar_Buy_Into_Soviet_Armor_Development_desc:0 "Si nous essayons de réduire les effectifs de notre armée tout en continuant de compter sur les Soviétiques pour l'armement, qu'est-ce qui nous fait penser qu'il est possible de produire nos propres chars ? Bien qu'il s'agisse d'un objectif à long terme, ce n'est tout simplement pas possible pour le moment. En outre, utiliser les mêmes chars que ceux des Soviétiques nous permettra de les réparer et de les rééquiper beaucoup plus rapidement et avec moins de pression sur notre industrie."
 HUN_60s_Kadar_Expand_Our_Air_Bases_desc:0 "Comme nous l'avons déjà déclaré, la Hongrie ne recherche pas une démilitarisation totale, mais simplement une réduction temporaire des effectifs. Cela dit, cela ne veut pas dire que nous ne pouvons pas innover et nous développer en même temps. Tandis que nous réduisons nos forces terrestres, nous pouvons encore augmenter nos forces aériennes. Le maintien d'une force aérienne sera bien plus simple qu'une force terrestre importante, et probablement plus utile à long terme. En outre, nous sommes certains que le camarade [SOV.GetLeader] sera satisfait de bases de première ligne de meilleure qualité."
 HUN_60s_Kadar_Bolster_Domestic_Forces_desc:0 "Étant donné que nous nous concentrons de plus en plus sur le centre national, cela ne signifie pas que nous ne pouvons pas l'utiliser au profit des militaires. L'industrie militaire présente des bénéfices potentiels, ainsi que des avantages à long terme et des opportunités d'emploi. Nous pouvons consacrer une partie de l'argent que nous aurions utilisé pour financer nos forces armées au développement de notre industrie lourde pour un bénéfice à plus long terme."
 HUN_60s_Kadar_Rebuilding_Our_Air_Force_desc:0 "En grande partie laissée à l'abandon et laissée à l'abandon, l'armée de l'air de l'armée populaire hongroise n'a été qu'une pure plaisanterie au lendemain de 1956. Tandis que nous réduisons nos forces terrestres, nous devrions porter notre attention sur la modernisation de notre force aérienne, car plus nous attendons, plus cela sera coûteux et difficile à l'avenir."
 HUN_60s_Kadar_Utilize_Soviet_Jet_Technology_desc:0 "Malheureusement, contrairement aux États-Unis et à l'Union soviétique, la Hongrie n'a jamais été à la pointe de la technologie moderne des avions à réaction. Toutefois, cela ne nous donne pas une excuse pour simplement rester les bras croisés et ne pas innover. Même si nous n'avons pas de base locale sur laquelle partir ou sur laquelle bâtir, Moscou en a une. Nous pouvons apprendre de leur technologie, informer nos propres scientifiques et lancer notre propre base de recherche à l'avenir."
 HUN_60s_Kadar_Develop_Hungarian_MIG_19s_desc:0 "Nos recherches nous ont beaucoup appris et nous ont fourni un point de départ solide, fiable mais temporaire pour notre nouvelle force aérienne. Le MiG-19, bien qu'il ne soit pas l'avion le plus original, est assez avancé et fera bien l'affaire en tant que pilier temporaire de notre force aérienne."
 HUN_60s_Kadar_Receive_Czech_IL_28s_desc:0 "La technologie multirôle et d'interception est très différente de la technologie des bombardiers. Bien qu'il en ait toujours été ainsi, et c'est une évidence, nous n'avons toujours pas de base propre avec laquelle travailler, et la Hongrie ne peut pas se contenter de ramper jusqu'à Moscou pour résoudre tous les problèmes que nous avons. Cependant, nos camarades tchèques semblent bien gérer les choses. Peut-être seraient-ils prêts à donner un coup de main ?"
 HUN_60s_Kadar_Further_Expanding_Air_Force_Bases_desc:0 "À quoi sert une force aérienne rénovée si nous n'avons nulle part où déployer nos avions dans notre propre pays ? Sans oublier que la Hongrie fait partie de la ligne de front du Pacte de Varsovie contre l'agression occidentale. Si nous souhaitons exploiter nos avancées jusqu'à présent, nous devons leur donner suffisamment d'espace pour le stockage et l'utilisation."
 HUN_60s_Kadar_Form_Magyar_Aviation_Clubs_desc:0 "Apprendre à créer et concevoir de nouveaux modèles d'avions est une bonne chose et constitue une étape importante dans la modernisation de notre force aérienne, mais à quoi bon si nos pilotes ne savent pas piloter l'avion ? Si nous élargissons la portée et le financement des clubs d'aviation, cela devrait aider à maintenir les pilotes hongrois au courant de la doctrine et de la technologie actuelles."
 HUN_60s_Kadar_Innovate_Anti_Air_Technology_desc:0 "Tout comme les avions ont changé, les moyens de les abattre ont également changé. L'époque des canons antiaériens et des tours fortifiées est révolue. Si nous voulons éviter que nos villes ne soient détruites par les premiers bombardements de l'OTAN, la Hongrie doit se moderniser avec le reste du monde."
 HUN_60s_Kadar_Reinforce_the_Gyor_Air_Base_desc:0 "Même si nous ne sommes pas une ligne de front aussi cruciale que les Allemands de l'Est ou les Tchèques, nous faisons néanmoins partie de la ligne de front du Pacte de Varsovie. En tant que tel, si jamais cette guerre froide s'intensifie, nous devons nous assurer que nous sommes préparés autant que possible à réagir à toute menace. L'augmentation de la capacité de nos aérodromes de Gyor pour les pilotes soviétiques et la modernisation de nos emplacements radar contribueront grandement à renforcer notre position."
 HUN_60s_Kadar_Import_the_Strela_desc:0 "Tout comme les capacités anti-aériennes stationnaires ont changé, les systèmes anti-aériens mobiles ont également évolué. Si la Hongrie souhaite suivre le rythme, nous devrions une fois de plus nous tourner vers Moscou. Le 9K31 Strela est un véhicule assez impressionnant, étant suffisamment léger et rapide pour pouvoir déployer facilement nos unités existantes, et il devrait être suffisamment inoffensif pour que les Soviétiques nous en prêtent quelques-unes."
 HUN_60s_Kadar_Pursue_Helicopter_Innovations_desc:0 "L'hélicoptère est un ajout relativement nouveau aux armées modernes. Bien qu'il soit encore beaucoup trop tôt pour savoir quel type de rôle ils joueront dans la guerre moderne, sans parler de notre armée, la Hongrie devrait prendre une longueur d'avance et les étudier tant que possible, afin de ne pas avoir à rattraper son retard à l'avenir."
 HUN_60s_Kadar_Bring_the_Mi_4_to_Hungary_desc:0 "Si la Hongrie veut réellement étudier les hélicoptères, nous avons besoin d'un véritable hélicoptère pour commencer. Même si nous ne pouvons pas justifier de demander à nos alliés les modèles les plus récents, le Mi-4 fera très bien l'affaire. Après tout, ce sont uniquement pour l'étude et le développement futur, pas pour le combat."
 HUN_60s_Kadar_Develop_Aerial_Transport_Capabilities_desc:0 "Dans nos études, nous avons réalisé l'incroyable potentiel des hélicoptères non seulement pour ravitailler nos unités, mais aussi pour les transporter rapidement d'un champ de bataille à l'autre. Dans notre situation actuelle, une petite armée mobile est non seulement idéale, mais c'est tout ce que nous pouvons nous permettre. Nous ne devrions pas perdre de temps à ajuster notre doctrine pour tenir compte de notre découverte."
 HUN_60s_Kadar_Unequal_Inequality_desc:0 "Dans un État qui prône l'unité, l'égalité et le progrès, il n'est pas difficile de constater que certains sont plus égaux que d'autres. Les appels croissants des homosexuels, ainsi que les appels au suffrage féminin retentissent dans tout le pays, même s'ils sont en petit nombre. Quoi qu'il en soit, nous ne pouvons pas simplement ignorer le problème et le reporter à plus tard ; cela doit être résolu immédiatement."
 HUN_60s_Kadar_The_Debate_of_Hungarian_Suffrage_desc:0 "Le rôle des femmes dans la société hongroise est absolument indéniable. Cependant, ce rôle est très controversé ; historiquement, les femmes ont été simplement des mères et rien de plus. Mais aujourd'hui, nous sommes une société moderne et nous n'avons pas besoin de lois aussi archaïques, surtout en tant qu'État socialiste. Cependant, voulons-nous vraiment casser ce qui fonctionne ?"
 HUN_60s_Kadar_Magyar_Mothers_Nothing_More_desc:0 "Peut-être que nos ancêtres avaient raison ; les femmes, à l'usine ? Comment aurions-nous pu envisager cette idée ? Le rôle des femmes dans la société révolutionnaire devrait être au foyer. Notre révolution est pour les travailleurs, et une femme ne peut pas être une travailleuse."
 HUN_60s_Kadar_An_Equal_Counterpart_desc:0 "Nous ne vivons plus dans les années 40, encore moins dans les années 50. Notre peuple aspire à la liberté et à l'égalité, et en tant que communistes, il est de notre devoir de garantir cela. Nos femmes sont tout autant membres du prolétariat que les hommes, et nous devons les reconnaître en conséquence."
 HUN_60s_Kadar_In_the_Home_and_the_Factory_desc:0 "Comme tous nos travailleurs, les femmes ont des responsabilités non seulement à la maison mais aussi sur leur lieu de travail. Si nous voulons les émanciper, nous devons les faire travailler. Bien que ce soit peut-être peu orthodoxe dans d'autres endroits, notre industrie ne devrait avoir aucun problème à embaucher l'un ou l'autre sexe."
 HUN_60s_Kadar_New_Protections_for_Women_desc:0 "Nous avons fait assez de paroles en l'air, il est maintenant temps de consacrer officiellement les droits des femmes aux côtés des droits des hommes, partenaires égaux à la fois dans la révolution et dans la loi."
 HUN_60s_Kadar_The_Mothers_of_Our_Workers_desc:0 "Bien qu'elles ne soient pas elles-mêmes des travailleuses, les femmes jouent un rôle tout aussi important dans notre société (du moins c'est ce que nous leur disons). Il n'y a rien de plus important que de donner la vie à ce monde, surtout une vie qui rejoindra un jour le prolétariat. Comment une femme peut-elle être mère si elle travaille dur à l'usine ?"
 HUN_60s_Kadar_Repeal_Old_Legislation_desc:0 "Nous n'avons jamais été à l'avant-garde de l'égalité des sexes, mais nous avons encore de vieilles lois qui font obstacle à la réalisation de nos objectifs finaux. Même si beaucoup peuvent nous condamner comme étant cruels et même dépassés, abroger certaines libertés est vraiment dans leur intérêt, même s'ils ne le savent pas encore."
 HUN_60s_Kadar_Queer_Magyars_desc:0 "Tout comme pour le statut des femmes dans notre société, ceux qui s'identifient comme queer, même s'ils ne sont absolument pas importants, existent toujours au sein de notre République populaire. La majeure partie du monde les condamne, et même si nous n'avons aucune raison de le faire, après tout, un prolétariat queer n'en reste pas moins un prolétariat. Mais faut-il vraiment s'en soucier, est-ce vraiment si important ?"
 HUN_60s_Kadar_Maintain_the_Database_desc:0 "Nous n'aimons pas le gouvernement aligné sur l'Allemagne de la fin des années 30 et du début des années 40. Cependant, ils disposaient d'outils utiles, comme la base de données sur les homosexuels, qui était utilisée pour suivre les homosexuels et ceux jugés « indésirables » en raison de leur sexualité. Même si nous ne l'utiliserons pas pour les traquer ou poursuivre en justice des homosexuels identifiés, nous devrions le conserver."
 HUN_60s_Kadar_A_United_Hungary_desc:0 "Gay ou hétéro, peu importe ? Un ouvrier est un ouvrier, un agriculteur est un agriculteur et un communiste est un communiste, quelle que soit sa sexualité. Ce serait absolument hypocrite et une parodie si nous ne le reconnaissions pas."
 HUN_60s_Kadar_Destroy_the_Database_desc:0 "Nous ne voulons plus rien avoir à faire avec le gouvernement d'antan. Un gouvernement responsable de tant de douleur, de souffrance et de mort devant notre glorieuse République populaire. L'un des outils qu'ils ont utilisés pour nous persécuter était la base de données sur les homosexuels. Cette base de données n'a pas sa place dans la société magyar moderne et aurait dû être détruite il y a des années."
 HUN_60s_Kadar_The_Full_Legalization_of_Hungarian_Homosexuality_desc:0 "Nous avons fait de nombreux progrès et remporté quelques victoires pour nos camarades queer. La base de données étant éradiquée, il est grand temps d'accorder officiellement à nos camarades queer l'égalité, non seulement en rhétorique, mais aussi en droit."
 HUN_60s_Kadar_Traditional_Hungarian_Sexual_Values_desc:0 "Tout va bien, et même si nous détestons nos anciennes méthodes, la société était stable, et après l'échec de la contre-révolution de 1956, c'est exactement ce dont nous avons besoin maintenant. Peut-être, peut-être qu'un jour dans le futur, cela changera, mais pour le moment, la stabilité est la priorité, et nous ne pouvons pas changer ce qui fonctionne pour un si petit groupe de personnes."
 HUN_60s_Kadar_Ignore_Growing_Dissent_desc:0 "On est loin des manières de Rakosi et de sa brutalité. Notre refus de réforme a provoqué de nombreux troubles, mais une répression sévère ne fera qu'aggraver notre situation. Nous essayons de nous éloigner de la politique pré-révolutionnaire et de construire un véritable socialisme hongrois. Donc, pour l'instant, nous pouvons fermer les yeux sur les manifestations et les émeutes..."
 HUN_60s_Kadar_A_Hungarian_Musical_Golden_Age_desc:0 "La technologie de la communication ne fait que s'améliorer avec le temps, et même si nos camarades soviétiques maîtrisent l'art de la propagande au cinéma et à la radio, nous ne devrions pas nous permettre de prendre du retard."
 HUN_60s_Kadar_Magyar_Radio_Es_Televizio_desc:0 "Il n'est pas exagéré de dire que nous ne sommes pas le pays le plus moderne. Mais cela ne veut pas dire que nous ne pouvons pas nous efforcer de nous élever. Même si cela implique beaucoup de responsabilités, pourquoi ne pas commencer modestement et dans les foyers de nos concitoyens ?"
 HUN_60s_Kadar_Our_First_Colored_Broadcast_desc:0 "Le monde est plein de couleurs, et nos téléviseurs aussi. Il n'est pas particulièrement controversé de dire que la Hongrie est en retard sur une grande partie de l'Europe et sur chaque petit pays. Être en mesure de proposer des émissions de télévision en couleur est donc une étape cruciale."
 HUN_60s_Kadar_Establish_MTV_Archives_desc:0 "L'histoire de la télévision sera indéniablement un élément culturel important, sur lequel nous pourrons nous retourner dans de nombreuses années. Alors pourquoi ne pas commencer à archiver plus tôt ?"
 HUN_60s_Kadar_Rural_Television_desc:0 "Si nous voulons être un véritable gouvernement du peuple, cela s'étend également aux paysans. Bien que généralement plus conservateurs, nous pouvons toujours changer lentement d'avis en leur fournissant non seulement des informations de base, mais aussi la vérité, à la télévision."
 HUN_60s_Kadar_Magyar_Rock_and_Roll_desc:0 "La musique est une chose absolument merveilleuse. Alors que nos alliés répriment les styles occidentaux, qu'est-ce qui nous empêche de les adopter et de les utiliser à nos propres fins ?"
 HUN_60s_Kadar_Consumerism_In_Our_Music_desc:0 "Nos politiques, tant dans notre culture que dans notre économie, ont conduit à certains effets secondaires étranges, bien que non indésirables. Le consumérisme joue désormais un rôle imprévisible dans le développement de notre nouvelle culture révolutionnaire, et il a également trouvé sa place dans notre musique."
 HUN_60s_Kadar_Education_Through_Media_desc:0 "L'éducation est au coeur du développement d'une société communiste à long terme. Même si nous ne pouvons évidemment pas forcer les travailleurs à aller à l'école ou forcer les agriculteurs à aller dans les salles de classe, nous pouvons quand même leur donner un coup de main, via nos médias."
 HUN_60s_Kadar_Adapt_Western_Advertisement_Methods_desc:0 "La publicité est un élément absolument essentiel pour permettre au système capitaliste de fonctionner. Même si nous devons faire attention à ne pas adopter une idéologie aussi misérable, cela ne signifie pas que nous ne pouvons pas utiliser les méthodes occidentales pour atteindre nos propres objectifs."
 HUN_60s_Kadar_Enshrine_Sellars_desc:0 "Les vendeurs, dans les pays capitalistes, ne sont que des outils bourgeois ; en Hongrie, ils sont de simples intermédiaires permettant à la population d'accéder aux biens nécessaires. Ce rôle doit être protégé et respecté."
 HUN_60s_Kadar_Expand_Capacity_of_Schools_desc:0 "Garantir la conscience de classe devrait être l'une de nos principales priorités dans la construction du socialisme en Hongrie. De plus, l'éducation de notre population est un objectif que nous ne pouvons simplement ignorer ; peut-être pouvons-nous faire d'une pierre deux coups..."
 HUN_60s_Kadar_Stay_the_Course_desc:0 "Dans l'objectif final d'une conscience de classe, l'éducation idéologique et la juste vérité du réalisme socialiste doivent être maintenues. L'éducation idéologique est un pilier essentiel que nous ne pouvons ignorer, et encore moins remplacer."
 HUN_60s_Kadar_Ideology_Doesnt_Belong_In_the_Classroom_desc:0 "Nous pouvons atteindre la conscience de classe par d'autres moyens. Après tout, continuer à offrir et à améliorer la qualité de vie de notre population est une bonne chose. Nous devons strictement nous en tenir à un programme éducatif et laisser la politique en dehors de celui-ci."
 HUN_60s_Kadar_Mold_the_Workers_of_Tomorrow_desc:0 "Notre plus grand allié à long terme est la jeunesse si nous voulons assurer le maintien de notre pouvoir. S'ils ne nous soutiennent pas, ils entraîneront notre chute à l'avenir. Nous devons les façonner le plus tôt possible et, par conséquent, affirmer notre politique éducative, idéalement le plus tôt possible."
 HUN_60s_Kadar_Expand_Technical_and_Vocational_Education_desc:0 "Si nous cherchons à faire des progrès à long terme dans l'affirmation du socialisme en Hongrie, nous devons garantir que les jeunes acquièrent les compétences pratiques et nécessaires dont ils auront besoin pour entrer sur le marché du travail."
 HUN_60s_Kadar_Force_Peasants_Into_the_Classroom_desc:0 "Ce n'est pas seulement l'ouvrier industriel ou les futurs scientifiques et soldats que nous devons éduquer, mais aussi le paysan. Même si nous ne voulons pas toujours l'admettre et même si nous nous débarrasserons un jour de ces principes rétrogrades, ils restent une partie vitale de notre population que nous ne pouvons ignorer. Les intégrer en classe est le premier pas vers le progrès."
 HUN_60s_Kadar_Fund_Comprehensive_Engineering_Education_desc:0 "Alors que les travailleurs d'aujourd'hui sont notre prolétariat actuel et immédiat, la jeunesse est le prolétariat de demain. Si nous espérons un jour réussir à long terme, nous ne pouvons pas simplement consacrer toute notre énergie à un seul de ces groupes et devons veiller à ce que nos enfants reçoivent autant de soins que nos travailleurs adultes."
 HUN_60s_Kadar_Recruit_Soviet_Professors_desc:0 "Nous ne souhaitons peut-être pas toujours admettre quand nous avons besoin d'aide, mais si nous voulons que nos projets ambitieux en matière d'éducation prennent racine, nous devons reconnaître nos lacunes en termes de personnel dans nos nouvelles salles de classe. Vers qui mieux se tourner pour obtenir une telle aide que ceux qui nous ont sauvés de la contre-révolution ?"
 HUN_60s_Kadar_Introduce_Russian_Language_Studies_desc:0 "Beaucoup ne voient peut-être pas la nécessité immédiate d'étudier le russe. Si nous souhaitons que nos travailleurs réussissent dans la sphère soviétique ou dans un monde centré sur l'Union soviétique, nous devons d'abord veiller à ce que nos citoyens soient capables d'y travailler, même si cela signifie apprendre une ou deux nouvelles langues."
 HUN_60s_Kadar_Examine_Household_Goods_Availability_desc:0 "Alors que nous poursuivons la marchandisation de notre économie, les produits de luxe de base constituent un aspect important de cet objectif. Notre gouvernement n'est peut-être pas populaire actuellement, mais nous pouvons très facilement changer cela."
 HUN_60s_Kadar_Hungarian_Games_For_Hungarian_Families_desc:0 "Un aspect important pour assurer la popularité de notre gouvernement populaire est d'assurer le bonheur de notre peuple. Notre gouvernement défend l'élévation du prolétariat, et cela ne s'applique pas seulement au travail."
 HUN_60s_Kadar_The_Role_of_Commodities_in_Socialist_Society_desc:0 "La production marchande selon des méthodes capitalistes relève de l'exploitation et n'a sa place dans aucun pays moderne du XXe siècle. Toutefois, cela ne s'étend pas à toutes ses formes. Prendre la production et la distribution des matières premières sous une perspective socialiste sera sûrement la solution."
 HUN_60s_Kadar_Made_in_Hungary_desc:0 "À mesure que notre secteur de consommation se développe, notre qualité et notre quantité ne peuvent être égalées que par les puissantes superpuissances de notre époque. Nous ne devons pas gaspiller cette opportunité et afficher notre réussite en dehors de nos frontières."
 HUN_60s_Kadar_Magyar_Cultural_Exports_desc:0 "Ce ne sont pas seulement des produits et des ressources que nous exportons. Très peu de gens connaissent, et encore moins s'intéressent, au sort du socialisme hongrois, et si nous recherchons l'approbation et la reconnaissance à la fois de l'Est et de l'Ouest, alors nous n'avons d'autre choix que de faire quelque chose."
 HUN_60s_Kadar_Household_Radios_and_Televisions_desc:0 "Contrairement à certains de nos homologues socialistes, nous ne nous faisons aucune fausse illusion de modernité. Nous reconnaissons à quel point nous sommes en retard, même par rapport à certains pays occidentaux les moins développés. Cela ne veut pas dire que nous ne pouvons pas travailler pour changer cela, et une étape importante consiste à garantir que les ménages aient un accès régulier aux technologies civiles de base."
 HUN_60s_Kadar_Import_the_Volga_desc:0 "Même si nous souhaitons à terme faire décoller notre propre industrie automobile, nous devons néanmoins veiller à ce que nos collaborateurs aient facilement accès aux véhicules d'ici là. La série de voitures soviétiques « Volga » est une voiture solide et fiable qui peut fonctionner plus qu'un simple palliatif."
 HUN_60s_Kadar_Import_East_German_Cars_desc:0 "L'Allemagne de l'Est est un pays en difficulté autant, sinon plus, que nous. Cependant, cela ne veut pas dire qu'ils n'ont rien fait de bon, surtout en ce qui concerne leurs automobiles. Peut-être pouvons-nous en tirer des bénéfices mutuels et combler lentement notre déficit commercial toujours croissant en travaillant avec notre frère socialiste."
