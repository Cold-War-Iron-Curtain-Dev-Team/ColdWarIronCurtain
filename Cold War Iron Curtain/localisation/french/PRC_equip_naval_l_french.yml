l_french:
 
 
 PRC_carrier_hull_2:0 "Projet 1143.5 Krechyet"
 PRC_carrier_hull_2_short:0 "Projet 1143.5"
 PRC_carrier_hull_2_desc:0 "La classe Kiev était la première classe de porte-avions à voilure fixe (croiseur lourd de classification soviétique) construite en Union soviétique pour la marine soviétique. Les navires ont été conçus avec une grande superstructure insulaire à tribord, avec un pont d'envol incliné 2/3 de la longueur du pont total, et le pont avant était occupé par un armement lourd de missiles sol-air et sol-sol. La mission prévue de la classe Kiev était de soutenir les sous-marins lance-missiles stratégiques, d'autres navires de surface et l'aviation navale ; il était capable de s'engager dans des guerres anti-aériennes, anti-sous-marines et de surface."
 
 PRC_carrier_hull_3:0 "Tapez 001"
 PRC_carrier_hull_3_short:0 "Tapez 001"
 PRC_carrier_hull_3_desc:0 "Le Liaoning est un porte-avions chinois de type 001. Premier porte-avions mis en service dans la force de surface de la marine de l'Armée populaire de libération, il était à l'origine classé comme navire-école, destiné à permettre à la marine d'expérimenter, de s'entraîner et de se familiariser avec les opérations des porte-avions. Initialement prévu en 1985 pour la marine soviétique sous le nom de croiseur aérien de classe Kuznetsov Riga, il a été lancé le 4 décembre 1988 et renommé Varyag en 1990."
 
 PRC_carrier_hull_4:0 "Tapez 002"
 PRC_carrier_hull_4_short:0 "Tapez 002"
 PRC_carrier_hull_4_desc:0 "Le Shandong est un porte-avions chinois de première génération. Il s'agit du deuxième porte-avions du pays après l'achèvement du Liaoning et du premier construit au niveau national. Le Shandong a été initialement désigné comme transporteur aérien de type 001A pendant le développement, mais a été finalisé comme type 002 lors de la mise en service. Le Shandong, comme son prédécesseur, utilise le système de lancement et de récupération plus simple « à décollage court mais récupération arrêtée » (STOBAR). Les futurs porte-avions chinois, comme le porte-avions Type 003, devraient utiliser un système de lancement électromagnétique d'avions (EMALS) qui permet le lancement d'avions plus lourds et plus avancés comme le Shenyang J-31 ou le Chengdu J-20."
 

 
 PRC_carrier_hull_light_2:0 "Classe majestueuse"
 PRC_carrier_hull_light_2_short:0 "Classe majestueuse"
 PRC_carrier_hull_light_2_desc:0 "La Chine a acquis le porte-avions désaffecté de la Marine royale australienne HMAS Melbourne, lorsqu'il a été vendu à la China United Shipbuilding Company pour être remorqué vers la Chine et démoli pour être mis au rebut. Avant le départ du navire pour la Chine, le RAN a dépouillé le Melbourne de tout équipement électronique et de tout armement et a soudé ses gouvernails dans une position fixe afin qu'il ne puisse pas être réactivé. Cependant, sa catapulte à vapeur, son équipement d'arrêt et son système d'atterrissage à miroir n'ont pas été retirés. A cette époque, peu d'experts occidentaux s'attendaient à ce que le gouvernement chinois tente à l'avenir de développer des porte-avions."
 
 PRC_carrier_hull_light_3:0 "Tapez 075"
 PRC_carrier_hull_light_3_short:0 "Tapez 075"
 PRC_carrier_hull_light_3_desc:0 "Le quai d'hélicoptère d'atterrissage de type 075 (nom de l'OTAN Assaut d'hélicoptère d'atterrissage de classe Yushen) est une classe de navire d'assaut amphibie chinois en construction par la société Hudong - Zhonghua Shipbuilding. Le quai d'hélicoptère de type 075 est une nouvelle génération de navire d'assaut amphibie et bien plus grand que les navires similaires précédemment construits pour la marine de l'APL. Le Type 075 donnerait à la marine chinoise la possibilité de lancer différents types d'hélicoptères pour attaquer des navires militaires, des forces terrestres ennemies ou des sous-marins. Les navires pourront également déployer des péniches de débarquement et des troupes, ainsi que des opérations de commandement et de contrôle."
 
 PRC_carrier_hull_light_4:0 "Tapez 076"
 PRC_carrier_hull_light_4_short:0 "Tapez 076"
 PRC_carrier_hull_light_4_desc:0 "Le quai d'atterrissage pour hélicoptères de type 076 est une classe de navires d'assaut amphibie chinois. Le Type 076 est un successeur plus grand et plus performant du Type 075. Il est souvent décrit comme un porte-drones doté d'un complément principal d'UCAV, comprenant éventuellement une conception d'aile volante similaire au Hongdu GJ-11. Le type 076 aura probablement un poste de pilotage sur toute la longueur et la capacité d'exploiter des avions à voilure fixe avec un système de catapulte EMALS et un dispositif d'arrêt. Le navire aura un pont de coffre inondable et des ascenseurs pour avions d'une capacité de 30 tonnes."
 
 PRC_carrier_hull_super_3:0 "Tapez 003"
 PRC_carrier_hull_super_3_short:0 "Tapez 003"
 PRC_carrier_hull_super_3_desc:0 "Projet d'un porte-avions lourd polyvalent russe prometteur. Le navire est conçu pour effectuer diverses missions dans la zone océanique lointaine, sera capable de frapper des cibles terrestres et maritimes ennemies en utilisant ses propres armes et avions du groupe aérien aéroporté, en outre, il sera en mesure de fournir une défense aérienne avec des moyens de défense aérienne et de groupe aérien, d'assurer la stabilité au combat et les groupements de navires de défense aérienne, ainsi que de fournir un soutien à l'atterrissage."
 
 PRC_carrier_hull_super_4:0 "Tapez 004"
 PRC_carrier_hull_super_4_short:0 "Tapez 004"
 PRC_carrier_hull_super_4_desc:0 "Le porte-avions Type 004 est un porte-avions prévu dans le cadre du programme de porte-avions de la marine de l'Armée populaire de libération. Il est destiné à être une itération du porte-avions Type 003 précédent et, comme le Type 003, il comportera un système de propulsion électrique intégré qui permettra le fonctionnement de catapultes de lancement électromagnétiques. Contrairement au Type 003 à propulsion conventionnelle, le Type 004 sera plus grand et sera également le premier transporteur chinois à disposer d'une propulsion nucléaire marine, et pourrait produire suffisamment d'électricité pour alimenter les armes laser et les canons à rail actuellement en cours de développement."
 
 

 
 PRC_battle_hull_light_0:0 "Roi Tchoung"
 PRC_battle_hull_light_0_short:0 "Roi Tchoung"
 PRC_battle_hull_light_0_desc:0 "Ancien croiseur léger britannique HMS Aurora de la classe Arethusa, destiné aux opérations en escadrille, de reconnaissance rapprochée et de contre-destroyers. Il fut transféré à la fin des années 40 du XXe siècle en République de Chine, où il coula pendant les hostilités. Il a été construit par la République populaire de Chine et, au début des années 1950, un plan a été élaboré pour la reconstruction du croiseur avec le remplacement des armes et des équipements par des modèles soviétiques."
 
 PRC_battle_hull_light_3:0 "Projet 956-EM"
 PRC_battle_hull_light_3_short:0 "Projet 956-EM"
 PRC_battle_hull_light_3_desc:0 "Type de destroyers de troisième génération, modernisation en profondeur des destroyers du projet 956. Les destroyers du projet 956E ont été construits au chantier naval \"Severnaya Verf\" sur ordre des Forces navales de l'Armée populaire de libération de la République populaire de Chine."
 
 PRC_battle_hull_light_4:0 "Tapez 055"
 PRC_battle_hull_light_4_short:0 "Tapez 055"
 PRC_battle_hull_light_4_desc:0 "Le destroyer Type 055 (croiseur de classe Renhai de l'OTAN/OSD) est une classe de destroyers lance-missiles furtifs en cours de construction pour la force de surface de la marine de l'Armée populaire de libération chinoise. Il s'agit d'une conception multi-missions ; la combinaison de capteurs et d'armes suggère un rôle majeur de la défense aérienne de zone, avec des capacités de guerre anti-sous-marine dépassant celles des précédents combattants de surface chinois. L'armement principal est constitué de missiles transportés dans 112 cellules de lancement vertical universel (VLS) ; 64 cellules à l'avant et 48 cellules à l'arrière. Le même modèle VLS est utilisé sur le destroyer Type 052D, qui serait une mise en oeuvre de la norme GJB 5860-2006. La variante la plus longue, avec des cellules de 9 mètres, est probablement utilisée. Le Type 055 devrait transporter des missiles sol-air HHQ-9, des missiles de croisière antinavires YJ-18, des missiles de croisière d'attaque terrestre CJ-10 et des torpilles anti-sous-marines lancées par missiles dès son entrée en service. Potentiellement, les cellules les plus grandes pourraient également transporter des missiles balistiques antinavires."
 
 PRC_screen_hull_medium_0:0 "Type Anshan"
 PRC_screen_hull_medium_0_short:0 "Type Anshan"
 PRC_screen_hull_medium_0_desc:0 "Type Anshan - destroyers de l'Armée populaire de libération de Chine, qui étaient quatre destroyers soviétiques du projet 7 achetés par le gouvernement chinois à l'URSS en 1954-55. Les navires sont devenus les premiers destroyers au service effectif de la marine de l'APL, ont jeté les bases du développement ultérieur de ce type de navires dans la flotte communiste chinoise et ont reçu le nom symbolique de \"quatre gardes célestes\"."
 
 PRC_screen_hull_medium_1:0 "Tapez 053K"
 PRC_screen_hull_medium_1_short:0 "Tapez 053K"
 PRC_screen_hull_medium_1_desc:0 "Les frégates de type 053 (OTAN Jianghu, Jiangwei et Jiangdong) ont constitué l'épine dorsale de la force de frégates chinoises PLAN de 1977 jusqu'à récemment. Ils étaient tous dérivés d'une tentative de créer un meilleur design que le Type 065 Chengdu de la classe Riga des années 1950 et sa tentative de copie modifiée, le Type 065 jiangnan. Le même Institut n°701 (Wuhan) conçut le Type 053K (Kong signifiant « défense aérienne ») comme un dérivé du Type 065, à la demande de l'Amirauté au milieu des années 1960. Ils ont été spécialement conçus pour escorter les nouveaux destroyers de classe Type 051 Luda."
 
 PRC_screen_hull_medium_2:0 "Frégate type 053H2G"
 PRC_screen_hull_medium_2_short:0 "Tapez 053H2G"
 PRC_screen_hull_medium_2_desc:0 "Le type 053H2G (nom de code OTAN Jiangwei I) étaient des frégates chinoises entrées en service dans la force de surface de la marine de l'Armée populaire de libération dans les années 1990. Il s'agissait de variantes ultérieures de la famille de frégates Type 053 et des premières frégates polyvalentes du PLAN. Seules 4 unités ont été construites avant que la classe ne soit remplacée par la classe Type 053H3 Jiangwei II, plus performante."
 
 PRC_screen_hull_medium_3:0 "Frégate type 053H3"
 PRC_screen_hull_medium_3_short:0 "Tapez 053H3"
 PRC_screen_hull_medium_3_desc:0 "Le type 053H3 (nom de code OTAN Jiangwei II) étaient des frégates chinoises entrées en service dans la force de surface de la marine de l'Armée populaire de libération. Le Type 053H2G était légèrement plus grand que le Type 053H2 et équipé de missiles sol-air (SAM) HQ-61B. Cependant, le HQ-61 s'est avéré insatisfaisant et la classe a été rapidement remplacée par le Type 053H3 qui était un Type 053H2G amélioré équipé de SAM HQ-7. Le HQ-7 était une version chinoise du R330 Sea Crotale français."
 
 PRC_screen_hull_medium_4:0 "Frégate type 054"
 PRC_screen_hull_medium_4_short:0 "Tapez 054"
 PRC_screen_hull_medium_4_desc:0 "La frégate Type 054 (nom de code OTAN Jiangkai I) est un navire de guerre chinois polyvalent mis en service dans la force de surface de la marine de l'Armée populaire de libération. Le Type 054 a une coque furtive avec des surfaces inclinées, des matériaux absorbant les radars et un encombrement réduit de la superstructure. Le principal armement antinavire était constitué de missiles de croisière antinavires à rasage en mer YJ-83 équipés de deux lanceurs à quatre cellules. Il a conservé le HQ-7 SAM, une version améliorée du Crotale français, du précédent Type 053H3 ; le HQ-7 disposait d'un lanceur à 8 cellules prêt à tirer, dont 16 étaient stockées dans le rechargement automatique. La défense à courte portée a été améliorée avec quatre tourelles AK-630 CIWS. Un canon principal de 100 mm, également basé sur une conception française, a été monté."
 
 PRC_screen_hull_heavy_0:0 "Projet 051"
 PRC_screen_hull_heavy_0_short:0 "Projet 051"
 PRC_screen_hull_heavy_0_desc:0 "Les destroyers chinois du Projet 051 (désignation OTAN - destroyers de classe Luda) sont devenus le premier type de navires de guerre entièrement construits en Chine. La conception était basée sur les destroyers soviétiques du projet 41 et en partie du projet 56, mais avec un réarmement avec des missiles de croisière antinavires au lieu de torpilles."
 
 PRC_screen_hull_heavy_1:0 "Projet 051H"
 PRC_screen_hull_heavy_1_short:0 "Projet 051H"
 PRC_screen_hull_heavy_1_desc:0 "Modernisation des navires du projet 51. Dans le même temps, les armes d'artillerie de la partie arrière ont été démantelées et un héliport et un hangar pour deux hélicoptères ont été installés, ainsi que l'équipement et les munitions d'aviation appropriés. Le groupe aérien était composé de deux hélicoptères légers Z-9 en construction en Chine sous licence française."
 
 PRC_screen_hull_heavy_2:0 "Type 052 Classe Luhu"
 PRC_screen_hull_heavy_2_short:0 "Type 052 Classe Luhu"
 PRC_screen_hull_heavy_2_desc:0 "La classe Luhu Type 052 est l'un des premiers destroyers lance-missiles multirôles modernes construits par la Chine. Les navires de guerre chinois ont historiquement limité leurs opérations à la zone couverte par leurs avions terrestres en raison du manque de capacité de défense de leur flotte. Pour remédier à cette tendance, les destroyers Luhu (et la plus petite frégate de classe Jiangwei) ont été équipés du HQ-7 SAM qui leur confère une bien meilleure capacité de défense aérienne que les autres modèles chinois précédents, bien qu'ils soient toujours limités à portée visuelle (WVR)."
 
 PRC_screen_hull_heavy_3:0 "Tapez 052C"
 PRC_screen_hull_heavy_3_short:0 "Tapez 052C"
 PRC_screen_hull_heavy_3_desc:0 "Le destroyer de type 052C (destroyer de classe OTAN/OSD Luyang II) est une classe de destroyers lance-missiles de la Force de surface navale (PLAN) de l'Armée populaire de libération chinoise. Le type 052C a introduit à la fois un radar fixe à réseau actif à balayage électronique (AESA) et des missiles sol-air à lancement vertical en service PLAN, ce qui en fait le premier navire de guerre PLAN doté d'une capacité de défense aérienne de zone. Le canon principal est un PJ-87 de 100 mm (4 pouces). Le canon a souffert d'un brouillage et a peut-être influencé la décision d'adopter une arme différente pour le destroyer Type 052D. L'arme a une cadence de tir de 25 coups par minute. La défense rapprochée est assurée par deux CIWS de type 730 à sept canons de 30 mm (1,2 po), un monté à l'avant du pont et un au sommet du hangar. Chaque arme a une cadence de tir maximale de 4 200 coups par minute."
 
 PRC_screen_hull_heavy_4:0 "Tapez 052D"
 PRC_screen_hull_heavy_4_short:0 "Tapez 052D"
 PRC_screen_hull_heavy_4_desc:0 "Le destroyer de type 052D (destroyer de classe OTAN/OSD Luyang III) est une classe de destroyers lance-missiles de la force de surface de la marine de l'Armée populaire de libération chinoise. Le Type 052D est une variante plus grande du Type 052C ; le type 052D utilise un système de lancement vertical (VLS) de type cartouche, au lieu de type revolver, et dispose d'un radar à réseau actif à balayage électronique (AESA) à panneau plat. Le nouveau VLS ne se limite pas aux missiles sol-air, faisant du Type 052D le premier destroyer multirôle dédié de Chine."
 
 
 
 
 
 
 
 
 # Submarine Hulls #

 PRC_sub_hull_small_single_0:0 "Classe M"
 PRC_sub_hull_small_single_0_short:0 "Sous-marins de classe M"
 PRC_sub_hull_small_single_0_desc:0 "Deux sous-marins de la première série de cette classe, ainsi que deux sous-marins soviétiques de classe S (S-52 et S-53) et deux sous-marins de classe Shchuka (en location, S-121 et S-123) ont été vendus à la République populaire de Chine en juin 1954 en tant que fondation de la force sous-marine de la marine de l'Armée populaire de libération. Les sous-marins des classes M et S ont été vendus à la Chine, et deux autres séries M-XV de cette classe (M-278 et M-279) ont été vendues à la Chine quelques années plus tard. Les quatre sous-marins de classe M achetés par la Chine ont été rebaptisés respectivement National Defense No 21, 22, 23 (ex M-278) et 24 (ex M-279)."
 PRC_sub_hull_small_single_1:0 "Tapez 033"
 PRC_sub_hull_small_single_1_short:0 "Type 033 Wuhan"
 PRC_sub_hull_small_single_1_desc:0 "Les sous-marins de type 033 ont été fabriqués en Chine de 1962 à 1984. Le type chinois 033 comprend certaines améliorations par rapport à la conception originale 633 (031), notamment un niveau de bruit réduit à moins de 20 dB. Le système sonar embarqué a également été mis à jour : le GAS soviétique a été remplacé par un sonar chinois H/SQ2-262A."
 PRC_sub_hull_small_single_2:0 "Classe de kilo"
 PRC_sub_hull_small_single_2_short:0 "Kilo classe 877 Paltus"
 PRC_sub_hull_small_single_2_desc:0 "Le projet 877 Paltus est une classe de sous-marins d'attaque diesel-électriques."
 PRC_sub_hull_small_single_3:0 "Tapez 039"
 PRC_sub_hull_small_single_3_short:0 "Type 039 Chanson"
 PRC_sub_hull_small_single_3_desc:0 "Est une classe de sous-marins diesel-électriques de la marine de l'Armée populaire de libération. La classe est le premier sous-marin diesel-électrique à être entièrement développé en Chine et également le premier sous-marin diesel-électrique chinois à utiliser la forme moderne de coque en forme de larme. L'arme principale du Type 039 est la torpille Yu-4 de 533 mm, une torpille à tête chercheuse passive de 40 noeuds (74 km/h) produite localement basée sur le SAET-50 et à peu près comparable au SAET-60. Les cibles de surface peuvent être attaquées jusqu'à 15 km. Les torpilles filoguidées Yu-6 peuvent également être utilisées pour cibler les sous-marins. "
 PRC_sub_hull_small_single_4:0 "Tapez 041"
 PRC_sub_hull_small_single_4_short: "Type 041 Yuan"
 PRC_sub_hull_small_single_4_desc:0 "La classe Yuan dispose de six tubes lance-torpilles de 533 mm (21 pouces). Ceux-ci peuvent être utilisés pour lancer des torpilles indigènes telles que le Yu-6 ainsi que des torpilles de fabrication russe. On suppose qu'il sera équipé du supersonique YJ-18. Le concepteur général du système de lancement de torpilles et de missiles est Sun Zhuguo. Le Type 041 serait également capable de lancer des missiles antinavires de la série YJ-8X (C-80X). Le missile utilise un guidage radar actif inertiel + terminal. Il transporte une ogive explosive semi-perforante retardée de 165 kg (364 lb), avec une portée maximale de 80 à 120 km (50 à 75 mi) et une vitesse de Mach 0,9."

 PRC_sub_hull_large_single_0:0 "Tapez 03"
 PRC_sub_hull_large_single_0_short:0 "Whisky Type 03"
 PRC_sub_hull_large_single_0_desc:0 "La classe Whisky (désignation soviétique Projekt 613) faisait partie de celles proposées à la Chine dans le but de renforcer le PLAN, avant que la scission sino-soviétique de 1960 n'interrompe de nombreux autres transferts et travaux de collaboration. Dans le cadre de l'accord initial, cinq de ces sous-marins devaient être expédiés en Chine, tandis que des pièces, des équipements et des conseillers étaient envoyés pour en assembler 21 autres. Ces copies locales étaient appelées « Type 03 »."
 PRC_sub_hull_large_single_1:0 "Tapez 035"
 PRC_sub_hull_large_single_1_short:0 "Tapez 035 Min"
 PRC_sub_hull_large_single_1_desc:0 "Sous-marins de type \"Min\", ou type 035 (ES5 dans la version export), qui au début des années 2000. 23 unités ont été construites, en termes de nombre, elles constituent la base du groupement de sous-marins dotés de centrales électriques conventionnelles de la marine chinoise et constituent un développement ultérieur du type soviétique \"Romeo\", développé dans les années 1950."
 PRC_sub_hull_large_single_2:0 "Tapez 091"
 PRC_sub_hull_large_single_2_short:0 "Type 091 Han"
 PRC_sub_hull_large_single_2_desc:0 "Le Type 091 (désignation chinoise : 09-I ; nom de rapport OTAN : classe Han) est un sous-marin nucléaire d'attaque de première génération produit par la Chine. Il s'agissait du premier sous-marin à propulsion nucléaire employé par la force sous-marine de la marine de l'Armée populaire de libération. Ils disposent de six tubes lance-torpilles de 533 mm (21 pouces) et transportent 20 torpilles. Alternativement, ils peuvent transporter 36 mines dans leurs tubes. Il est capable de tirer des variantes sous-lancées du missile antinavire C-801 ainsi qu'une gamme de torpilles ou de mines indigènes et russes."
 
 PRC_sub_hull_large_single_3:0 "Tapez 093"
 PRC_sub_hull_large_single_3_short:0 "Type 093 Shang"
 PRC_sub_hull_large_single_3_desc:0 "Le Type 093 (désignation chinoise : 09-III ; nom de rapport OTAN : classe Shang) est une classe de sous-marins d'attaque à propulsion nucléaire de deuxième génération déployés par la force sous-marine de la marine de l'Armée populaire de libération chinoise. Le Type 093 est armé de six tubes lance-torpilles ; les rapports sont contradictoires quant à savoir s'il s'agit de tubes de 553 mm (21,8 pouces) ou de 650 mm (26 pouces). Le Type 093 serait armé des missiles antinavires YJ-12 ou YJ-82. Les missiles de croisière antinavires pourraient également constituer une option future."
 PRC_sub_hull_large_single_4:0 "Tapez 095"
 PRC_sub_hull_large_single_4_short:0 "Type 095 Sui"
 PRC_sub_hull_large_single_4_desc:0 "Le Type 095 (désignation chinoise : 09-V, nom OTAN : classe Sui) est une classe de sous-marins d'attaque à propulsion nucléaire de troisième génération pour la marine de l'Armée populaire de libération (PLAN) de Chine. Il était prévu que les sous-marins de type 095 auraient une signature acoustique considérablement réduite, au sein d'un type de coque amélioré. Par rapport au Type 093, le Type 095 sera doté d'un réacteur nucléaire plus avancé, de tubes VLS et d'un plus grand nombre de capteurs avancés tels qu'un nouveau sonar à réseau latéral actif/passif et un réseau de sonars remorqués basse et haute fréquence."

 PRC_sub_hull_large_double_0:0 "Tapez 031"
 PRC_sub_hull_large_double_0_short:0 "Tapez 031"
 PRC_sub_hull_large_double_0_desc:0 "Les sous-marins chinois de classe Golf ont été construits à Dalian entre 1960 et 1966, après avoir reçu des données techniques de l'URSS en 1959. La Chine n'a pas acheté de SLBM et le type 6631 était donc équipé de systèmes de simulation et principalement utilisé pour la formation. Initialement portant le numéro de fanion 1101, il a ensuite été changé en 200 en 1967. La deuxième unité était censée être construite et livrée par l'URSS (numéro de fanion K-208), mais en raison de la scission sino-soviétique, la plupart des équipements à bord n'ont pas été livrés et le bateau a été utilisé comme échantillon pour l'ingénierie inverse pour compléter la première unité, qui est entrée en service en Chine en août 1966."
 PRC_sub_hull_large_double_1:0 "Tapez 092"
 PRC_sub_hull_large_double_1_short:0 "Tapez 092 Xia"
 PRC_sub_hull_large_double_1_desc:0 "Le sous-marin Type 092 (désignation chinoise : 09-II ; nom de rapport OTAN : classe Xia) a été le premier sous-marin nucléaire lance-missiles (SNLE) déployé par la force sous-marine de la marine de l'Armée populaire de libération, et le premier SSBN conçu et construit en Asie."
 PRC_sub_hull_large_double_2:0 "Tapez 094"
 PRC_sub_hull_large_double_2_short:0 "Type 094 Jin"
 PRC_sub_hull_large_double_2_desc:0 "Le Type 094 (désignation chinoise : 09-IV ; nom de rapport OTAN : classe Jin) est une classe de sous-marins lance-missiles balistiques développé par la Chine pour la force sous-marine de la marine de l'Armée populaire de libération. Le type 094 est armé de 12 SLBM JL-2, chacun avec une portée estimée à 7 400 km (4 600 mi). Chaque missile transporte une ogive. Les Type 094 et JL-2 constituent la première force de dissuasion nucléaire maritime crédible de la Chine."
