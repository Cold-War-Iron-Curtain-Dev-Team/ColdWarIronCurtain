l_french:
 VIN_Strike_Lai_Chau: "Le déménagement sur Lai Chau"
 VIN_Strike_Lai_Chau_desc: "Lai Chau est la capitale Tai, perchée dans les montagnes loin de toute réserve française. Une division envoyée contre lui obligera le corps expéditionnaire à choisir entre abandonner le pays Tai ou s'éparpiller encore davantage le long de la route Pavie."
 VIN_Camp_War_Lai_Chau_tt: "§RCommencer l'assaut contre la Fédération Tai§!\nPrenez la §Yprovince unique de Lai Chau§! à Tay Bac Bo - pas Dien Bien Phu ou Son La - et maintenez-la pendant §Y5 jours consécutifs§!. Victoire nette : jour §Y30§!. Date limite finale : jour §Y45§!. La bataille ne change pas à qui appartient la province."
 VIN_Lai_Chau_Dien_Bien_Bonus_tt: "Parce que Lai Chau a été prise, la campagne de Dien Bien Phu commence avec §G+15 ravitaillement de campagne§!."
 VIN_Lai_Chau_Objective: "Horloge de bataille : Lai Chau"
 VIN_Lai_Chau_Objective_desc: "Prenez et maintenez la province §YLai Chau§! en surbrillance dans §YTay Bac Bo§!, pas Dien Bien Phu ou Son La, pendant §Y5 jours consécutifs§!. Le perdre réinitialise la prise.\nSuccès net jusqu'à §Yjour 30§!; le succès ultérieur coûte cher. Délai final : §Yjour 45§!.\n§YMaintien actuel§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours."
 VIN_CAMP_OBJ_LAI_CHAU: "Prenez et maintenez la province §YLai Chau§! en surbrillance dans §YTay Bac Bo§! pendant §Y5 jours consécutifs§!."
 FRE_Preparation.6.t: "La capitale Tai menacée"
 FRE_Preparation.6.d: "La 316e division Viet Minh est sur la route de Lai Chau, et la capitale Tai se trouve à quelques jours de toute réserve française. La garnison ne peut être renforcée que par voie aérienne, et chaque transport envoyé vers le nord-ouest représente un de moins pour le delta. Un vol de parachutistes pourrait renforcer la défense, mais rien de ce qui a été envoyé ne pourra être récupéré en cas de perte de la ville."
 FRE_Preparation.6.a: "Envoyez des renforts à Lai Chau."
 FRE_Preparation.6.b: "La garnison doit tenir avec ce qu'elle a."
 FRE_Preparation_Lai_Chau_tt: "Un groupe aéroporté renforce la garnison §YLai Chau§! jusqu'à la fin de la bataille."
 VIN_Campaign_Lai_Chau_Result_Clean: "§GLa bataille de Lai Chau : un franc succès§!"
 VIN_Campaign_Lai_Chau_Result_Costly: "§YLa bataille de Lai Chau : un succès coûteux§!"
 VIN_Campaign_Lai_Chau_Result_Failure: "§RLa bataille de Lai Chau : l'attaque échoue§!"
 VIN_Campaign_Lai_Chau_Result_Superseded: "§YLa bataille de Lai Chau : remplacée par une bataille plus large§!"
 VIN_Campaign_Lai_Chau_Result_Aborted: "§RLa bataille de Lai Chau : interrompue avant une décision§!"
 VIN_Campaign_Lai_Chau_Active: "La campagne §YLai Chau§! est sur le terrain"
 VIN_Campaign_Cooldown_Lai_Chau: "§RLai Chau : les divisions se regroupent encore§!"
 VIN_Temporary_Objective_VP_Lai_Chau: "L'objectif de Lai Chau est marqué sur la carte"
 VIN_Lai_Chau_Focus_Superseded: "L'offensive de Lai Chau a été dépassée par les événements"
 FRE_Lai_Chau_Result_Clean: "§GLa défense de Lai Chau : une nette réussite§!"
 FRE_Lai_Chau_Result_Costly: "§YLa défense de Lai Chau : un succès coûteux§!"
 FRE_Lai_Chau_Result_Failure: "§RLa défense de Lai Chau : l'attaque a échoué§!"
 FRE_Lai_Chau_Result_Superseded: "§YLa défense de Lai Chau : remplacée par une bataille plus large§!"
 FRE_Lai_Chau_Defensive_Success: "§GLa capitale Tai détenue§!"
 FRE_Lai_Chau_Airborne_Relief: "§YLes renforts aéroportés atteignent Lai Chau§!"
