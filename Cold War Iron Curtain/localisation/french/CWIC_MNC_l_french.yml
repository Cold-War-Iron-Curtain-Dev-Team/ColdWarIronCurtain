 CWIC_MNC.1059.d:0 "AT&T a proposé d'entrer sur notre marché dans le secteur de l'électronique. Si nous acceptons, l'entreprise établira une présence locale, commencera à déployer des capitaux et recherchera des contrats, des concessions ou des partenariats conformes à nos règles économiques. Le refus laisse l'invitation ouverte à d'autres partenaires, mais peut ralentir les investissements étrangers et réduire les retombées futures en matière de technologie et de productivité. Notre pression actuelle en matière de nationalisation et notre ouverture économique influenceront à la fois les conditions et le risque à long terme des conflits d'exploitation."
 CWIC_MNC.1059.a:0 "Approuver l'entrée d'AT&T"
 CWIC_MNC.1059.b:0 "Refuser l'invitation"
