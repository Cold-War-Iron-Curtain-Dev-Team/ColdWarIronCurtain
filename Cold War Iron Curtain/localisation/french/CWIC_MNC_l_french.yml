  cwic_mnc_nationalization_targeted_cat:0 "Nationaliser les sociétés étrangères"
 cwic_mnc_nationalization_targeted_cat_desc:0 "Émettre des ordonnances de nationalisation ciblées contre des sociétés multinationales spécifiques opérant à l'intérieur de nos frontières. Une action réussie réduit le niveau de présence de l'entreprise dans le secteur sélectionné, gèle temporairement toute expansion future et transfère les actifs saisis dans les coffres de l'État. Les niveaux supérieurs dans le secteur ciblé génèrent généralement des paiements plus importants, mais peuvent accroître l'instabilité politique et accroître la pression sur les nationalisations à long terme."
 cwic_mnc_nat_exxon_hydrocarbons:0 "Nationaliser Exxon (Hydrocarbures)"
 cwic_mnc_nat_exxon_hydrocarbons_desc:0 "Saisir les actifs et restreindre les opérations d'Exxon dans le secteur des hydrocarbures. Cette action réduit d'un cran le niveau de présence sectorielle de l'entreprise (ou le supprime s'il est minime), applique un gel temporaire sur les nouveaux investissements et convertit la valeur saisie en revenus de l'État."
