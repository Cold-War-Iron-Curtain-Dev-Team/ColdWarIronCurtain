 cwic_mnc_invitations:0 "Invitations aux investissements étrangers"
 cwic_mnc_invitations_desc:0 "Envoyez des invitations ou des concessions aux sociétés multinationales. Les invitations seront examinées au fil du temps et pourront déclencher une réaction, conduisant à une présence élargie des entreprises par secteur si le pays hôte reste politiquement acceptable. Les économies planifiées peuvent permettre des concessions limitées en autorisant les concessions étrangères."
 cwic_mnc_invite_exxon_hydrocarbons:0 "Inviter Exxon (Hydrocarbures)"
 cwic_mnc_invite_exxon_hydrocarbons_desc:0 "Invitez Exxon à investir dans notre secteur des hydrocarbures. Si les conditions de risque restent acceptables, la société peut répondre en proposant d'étendre sa présence. Une pression plus forte en matière de nationalisation peut décourager les investissements."
 cwic_mnc_concession_exxon_hydrocarbons:0 "Offrir une concession à Exxon (Hydrocarbures)"
 cwic_mnc_concession_exxon_hydrocarbons_desc:0 "Offrir une concession contrôlée à Exxon pour investir dans notre secteur des hydrocarbures. Cette option est destinée aux économies planifiées ou fermées qui ont autorisé des concessions étrangères. L'entreprise peut toujours refuser si le risque perçu est trop élevé."
