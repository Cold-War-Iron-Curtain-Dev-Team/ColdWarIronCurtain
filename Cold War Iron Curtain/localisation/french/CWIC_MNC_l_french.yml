 CG_PRODUCED_TITLE_TT:0 "§YProduit§!\nProduction nationale mensuelle de biens de consommation.\n\nLa production est attribuée au meilleur niveau actuellement disponible pour chaque catégorie.\n\n§YNiveau de production actuel§!\nBiens de base : [?cg_basic_producible_tier|Y0]\nBiens durables : [?cg_durable_producible_tier|Y0]\nVéhicules : [?cg_vehicles_producible_tier|Y0]\nElectronique grand public : [?cg_consumer_electronics_producible_tier|Y0]\n\n§YCapacité industrielle§!\nIndustrie légère : [?modifier@cap_light_industry|Y1]\nFabrication de précision : [?modifier@cap_precision_manufacturing|Y1]\nAutomobile : [?modifier@cap_automotive|Y1]\nElectronique : [?modifier@cap_electronics|Y1]\nGestion : [?modifier@cap_management|Y1]\n\nLes niveaux supérieurs nécessitent une capacité industrielle, manufacturière, de gestion, automobile ou électronique plus forte, selon la catégorie."
 CG_IMPORTED_TITLE_TT:0 "§YImporté§!\nBiens de consommation achetés à des exportateurs étrangers dans le cadre d'accords commerciaux réguliers.\n\nLes importations comptent dans l'offre intérieure. Leur qualité est moyenne sur le marché mondial."
 CG_EXPORTED_TITLE_TT:0 "§YPool d'exportation§!\nBiens de consommation offerts sur le marché mondial.\n\nLes biens proposés ne sont pas disponibles dans le pays, qu'un acheteur étranger les prenne ou non."
 CG_CONSUMPTION_TITLE_TT:0 "§YConsommation§!\nDemande et couverture mensuelles de biens de consommation intérieure.\n\nLa demande est basée sur la population, le niveau de développement, l'année en cours et le niveau de vie attendu. Si les biens disponibles ne suffisent pas, la pression sur les biens de consommation augmente."
 CG_COVERAGE_ROW_TT:0 "§YCouverture§!\nLa part de la demande mensuelle actuellement satisfaite.\n\nUne faible couverture crée des pénuries de biens de consommation et accroît la pression économique et politique."
 CG_DEMAND_ROW_TT:0 "§YDemande§!\nDemande mensuelle de la population pour cette catégorie de biens de consommation.\n\nLa qualité attendue augmente avec le temps et avec le développement national. Des niveaux attendus plus élevés rendent les produits plus anciens moins efficaces pour satisfaire la demande."
 cwic_mnc_hydrocarbons_presence_t1:0 "Présence d'hydrocarbures étrangers I"
 cwic_mnc_hydrocarbons_presence_t1_desc:0 "La présence d'entreprises pétrolières et gazières étrangères opérant dans notre secteur des hydrocarbures (niveau 1 sur 5) façonne notre économie, apportant des revenus et des capitaux au détriment du contrôle national."
