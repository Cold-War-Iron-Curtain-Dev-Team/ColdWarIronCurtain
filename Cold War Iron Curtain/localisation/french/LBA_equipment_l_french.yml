 LBA_motorized_equipment_1:0 "GMC CCKW 6x6"
 LBA_motorized_equipment_1_short:0 "GMC CCKW 6x6"
 LBA_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW utilise un moteur GMC270, une transmission à 5 vitesses/2 gammes et un essieu à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer jusqu'à 45 mph sur 300 miles et atteint 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine en tant que camion de transport et de ravitaillement de troupes. Le camion, en plus d'être utilisé pour le ravitaillement et le transport, pourrait également monter une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et peut également monter des armes remorquées sur son plateau pour créer des armes SP bon marché."
