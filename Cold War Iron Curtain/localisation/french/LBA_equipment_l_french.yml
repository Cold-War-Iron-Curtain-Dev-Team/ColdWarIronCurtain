#prewar Italian Air Force in Libya
 LBA_fighter_equipment_0:0 "Force aérienne libyenne"
 LBA_fighter_equipment_0_short:0 "Force aérienne libyenne"
 LBA_fighter_equipment_0_desc:0 "L'armée de l'air a été créée pour la première fois sous le nom de Force aérienne royale libyenne (Al Quwwat al Jawwiya al Malakiya al Libiyya) en septembre 1962 par décision du ministre de la Défense Younis Bel Khayer, le lieutenant-colonel Salim al-Hsoumi et le lieutenant-colonel Mohamed Shennib ont été chargés de diriger la nouvelle force. Il était à l'origine équipé d'un petit nombre de transports et d'entraîneurs ; Douglas C-47 et Lockheed T-33."
 LBA_tac_bomber_equipment_0:0 "Savoia-Marchetti SM.81 Pipistrello"
 LBA_tac_bomber_equipment_0_short:0 "SM.81 Pipistrello"

 #Libyan Air Force
 LBA_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 LBA_jet_multirole_equipment_2_short:0 "MiG-15"
 LBA_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 LBA_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 LBA_jet_multirole_equipment_3_short:0 "MiG-17"
 LBA_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 LBA_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 LBA_jet_multirole_equipment_4_short:0 "MiG-19"
 LBA_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 LBA_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 LBA_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 LBA_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 LBA_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 LBA_jet_multirole_equipment_6_short:0 "MiG-21PF"
 LBA_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 LBA_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 LBA_jet_multirole_equipment_7_short:0 "MiG-23M" 
 LBA_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 LBA_jet_multirole_equipment_8:0 "Dassault Mirage F1ED"
 LBA_jet_multirole_equipment_8_short:0 "Mirage F1ED"

 LBA_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 LBA_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 LBA_jet_CAS_equipment_4_short:0 "Su-7B"
 LBA_jet_CAS_equipment_5:0 "Sukhoï Su-7BMK"
 LBA_jet_CAS_equipment_5_short:0 "Su-7BMK" 
 LBA_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 LBA_jet_CAS_equipment_6:0 "Dassault Mirage 5DD"
 LBA_jet_CAS_equipment_6_short:0 "Mirage 5DD"
 LBA_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."

 LBA_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 LBA_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 LBA_jet_interceptor_equipment_7_short:0 "MiG-25P"

 LBA_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 LBA_jet_light_equipment_1_short:0 "Étoile filante T-33"
 LBA_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 #LBA_jet_light_equipment_2:0 ""
 #LBA_jet_light_equipment_2_short:0 ""
 #LBA_jet_light_equipment_2_desc:0 ""
 LBA_jet_light_equipment_3:0 "Chasseur de la liberté Northrop F-5A"
 LBA_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 LBA_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 LBA_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 LBA_jet_light_equipment_4_short:0 "L-39 Albatros"
 LBA_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 LBA_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 LBA_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 LBA_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."
 
