 LBA_naval_helicopter_equipment_5:0 "Mil Mi-14PL Haze-A"
 LBA_naval_helicopter_equipment_5_short:0 "Mi-14PL Haze-A"

 LBA_cargo_helicopter_equipment_2:0 "Sud Aviation SA-321J Super Frélon"
 LBA_cargo_helicopter_equipment_2_short:0 "SA-321J Super Frélon"
 LBA_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 LBA_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 LBA_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine propulsés par deux moteurs T55-L-712, le moteur le plus courant étant le dernier T55-GA-714A. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter de lourdes charges utiles à l'intérieur et jusqu'à 26 000 lb (12 000 kg) (comme des conteneurs de 40 pieds ou de 12 mètres) à l'extérieur. Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de moteur principal à l'obusier M198 de 155 mm, accompagnant 30 cartouches et un équipage de 11 hommes."

 LBA_attack_helicopter_equipment_4:0 "Mi-35"
 LBA_attack_helicopter_equipment_4_short:0 "Mi-35"
 LBA_attack_helicopter_equipment_4_desc:0 "Basé sur le Mi-24 Hind, l'hélicoptère militaire Mi-35M intègre plusieurs améliorations, notamment des ailes tronquées raccourcies, un nouveau système de rotor, une avionique moderne, des turbomoteurs améliorés et un système hydraulique. Le cockpit et les composants vitaux de l'hélicoptère sont lourdement blindés."

 LBA_scout_helicopter_equipment_1:0 "Mil Mi-2A"
 LBA_scout_helicopter_equipment_1_short:0 "Mi-2A"
 LBA_scout_helicopter_equipment_2:0 "Agusta-Bell AB-206 JetRanger"
 LBA_scout_helicopter_equipment_2_short:0 "AB-206"
 LBA_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."

