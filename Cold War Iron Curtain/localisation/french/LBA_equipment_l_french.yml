 LBA_mach2stratbomber_equipment_1:0 "Tupolev Tu-22"
 LBA_mach2stratbomber_equipment_1_short:0 "Tu-22"
 LBA_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce type s'est avéré décevant, car il lui manquait la portée intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, étant utilisé comme plate-forme de lancement pour le missile antinavire à longue portée Kh-22 (nom OTAN : AS-4 Kitchen). Son nom de code OTAN est Blinder."


