 ########## LBA Infantry equipment

 LBA_infantry_equipment_0:0 "Fucile Modello 1891 Carcano"
 LBA_infantry_equipment_0_short:0 "Carcano Modèle 91"
 LBA_infantry_equipment_0_desc:0 "Carcano est le nom fréquemment utilisé pour une série de fusils et carabines militaires italiens à verrou, alimentés par un chargeur et à répétition. Introduit en 1891, ce fusil était chambré pour la cartouche Carcano sans monture de 6,5 × 52 mm (Cartuccia Modello 1895). Il a été développé par le technicien en chef Salvatore Carcano de l'Arsenal militaire de Turin en 1890 et s'appelait à l'origine Modello (modèle) 91 ou simplement M91."

 LBA_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 LBA_infantry_equipment_1_short:0 "FN FAL"
 LBA_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 LBA_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 LBA_infantry_equipment_2_short:0 "AKM"
 LBA_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 LBA_infantry_equipment_3:0 "Avtomat Kalachnikova 1974"
 LBA_infantry_equipment_3_short:0 "AK-74"
 LBA_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un alésage chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été repensés pour contenir un canal bas installé à 90 degrés de l'axe de l'alésage afin de réduire le cisaillement des balles au niveau de la cale bâbord. De plus, son développement s'est accompagné d'une variété d'accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec des précisions moyennes plus élevées. Il a été utilisé de manière coûteuse pendant le conflit en Afghanistan, où la CIA a payé une grosse somme d'argent aux moudjahidines pour récupérer un AK74 capturé."

 LBA_infantry_equipment_4:0 "Avtomat Kalachnikova 1974 modernizirovanniy"
 LBA_infantry_equipment_4_short:0 "AK-74M"
 LBA_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé pour incorporer de nouveaux matériaux et des avancées de fabrication afin de créer une arme améliorée. Il comporte un boulon et un support allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide chargé de verre pouvant tenir latéralement, une bouche améliorée, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également livré avec un rail pour le montage des optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant de pouvoir être envisagée. Cependant, il a été adopté par la Fédération de Russie."


 ########## NEW LBA ARMOR

 LBA_lt_equipment_4:0 "Alvis FV601 Saladin"
 LBA_lt_equipment_4_short:0 "FV601 Saladin"
 LBA_lt_equipment_5:0 "Engesa EE-9 Cascavel Mk.II"
 LBA_lt_equipment_5_short:0 "EE-9 Cascavel Mk.II"
 LBA_lt_equipment_5_desc:0 "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."

 LBA_mbt_equipment_2:0 "T-54"
 LBA_mbt_equipment_2_short:0 "T-54"
 LBA_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 LBA_mbt_equipment_3:0 "T-55"
 LBA_mbt_equipment_3_short:0 "T-55"
 LBA_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 LBA_mbt_equipment_4:0 "T-62"
 LBA_mbt_equipment_4_short:0 "T-62"
 LBA_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 LBA_mbt_equipment_5:0 "T-62M"
 LBA_mbt_equipment_5_short:0 "T-62M"
 LBA_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 LBA_mbt_equipment_6:0 "T-72M"
 LBA_mbt_equipment_6_short:0 "T-72M"
 LBA_mbt_equipment_6_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 LBA_mbt_equipment_7:0 "T-72M1"
 LBA_mbt_equipment_7_short:0 "T-72M1"
 LBA_mbt_equipment_7_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars. Cette variante est une version d'exportation soviétique, avec un blindage plus épais et similaire au T-72A obr.1979g. Il est également équipé de 7+5 lance-grenades fumigènes sur l'avant de la tourelle."

