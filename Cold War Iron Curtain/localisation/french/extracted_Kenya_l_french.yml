 # ---- from Kenya.txt ----
 kenya.1.a2:0 "Le chef bien-aimé ! Le serviteur du Kenya !"
 kenya.1.t2:0 "L'assassinat du chef Waruhiu"
 kenya.10.a2:0 "Points équitables"
 kenya.10.d2:0 "Jaramogi Oginga Odinga a critiqué le maintien en détention de Jomo Kenyatta. Ses appels à la libération de Kenyatta renforcent l'opposition au régime colonial et attirent une attention renouvelée sur cette affaire."
 kenya.10.t2:0 "Critique de Jaramogi Odinga"
 kenya.11.a2:0 "C'est du vrai journalisme."
 kenya.11.d2:0 "La publication du livre « Le procès de Jomo Kenyatta » a suscité l'indignation alors que les lecteurs découvrent les véritables motivations derrière son emprisonnement."
 kenya.11.t2:0 "Le procès de Jomo Kenyatta"
 kenya.12.a2:0 "Tous les Britanniques ne sont pas racistes."
 kenya.12.d2:0 "De nombreuses voix libérales en Grande-Bretagne ont commencé à s'élever contre l'emprisonnement injuste de Jomo Kenyatta, invoquant le manque de preuves crédibles ou de raisons justifiables."
 kenya.12.t2:0 "Sympathie britannique"
 kenya.13.a2:0 "Un joli changement."
 kenya.13.d2:0 "Alors que nous nous adaptons au nouveau style de vie auquel nous aspirons ici au Kenya, nous changeons lentement notre gouvernement pour devenir un État-nation permanent plutôt qu'une colonie"
 kenya.13.t2:0 "Adoption d'une législature bicamérale"
 kenya.14.a2:0 "Hourra!"
 kenya.14.d2:0 "Michael Blundell, candidat à l'expansion de l'exclusivité des hauts plateaux blancs, a été élu gouverneur du Kenya"
 kenya.14.t2:0 "L'investiture de Michael Blundell"
 kenya.15.a2:0 "Nous avons des jours sombres devant nous"
 kenya.15.d2:0 "Notre gouverneur cette semaine, suite à l'assassinat de diverses personnalités locales pro-britanniques, ainsi qu'à la violence et à la rébellion contre la colonisation et le pouvoir des Blancs ; a déclaré l'état d'urgence"
 kenya.15.t2:0 "Déclaration de l'état d'urgence !"
 kenya.16.a2:0 "Ainsi se termine ce chapitre de l'histoire"
 kenya.16.d2:0 "Le long mandat d'Evelyn Baring en tant que gouverneure touche enfin à sa fin. Même si de nombreux Kenyans autochtones le considéreront toujours comme un tyran, il restera dans l'histoire comme l'homme qui a mis fin au soulèvement des Mau Mau"
 kenya.16.t2:0 "Le départ à la retraite de Sir Evelyn Baring"
 kenya.17.a2:0 "Une nouvelle décennie pour le Kenya."
 kenya.17.d2:0 "La résolution du soulèvement Mau Mau par le KLFA et sa reconstruction ultérieure sont probablement ce qui restera dans les mémoires du poste de gouverneur de Patrick Muir Renison"
 kenya.17.t2:0 "Gouverneur de Patrick Muir Renison"
 kenya.18.a2:0 "Les cicatrices des Mau Mau persistent."
 kenya.18.d2:0 "Les dégâts causés par les Mau Mau sur les infrastructures et l'économie du Kenya ne sont toujours pas entièrement résolus"
 kenya.18.t2:0 "Reconstruction post-Mau-Mau"
 kenya.19.a2:0 "Qui dirigera le Kenya à l'avenir ?"
 kenya.19.d2:0 "Cette décennie est mouvementée pour les colonies britanniques. Nous faisons clairement partie d'un système obsolète et désuet. Les égoïstes conserveront-ils leur propre pouvoir, ou la majorité régnera-t-elle sur un Kenya uhuru ?"
 kenya.19.t2:0 "La direction du protectorat"
 kenya.2.a2:0 "Espérons que ce splendide calme continue"
 kenya.2.d2:0 "Philip Mitchell est gouverneur du Kenya depuis 1944 et le restera jusqu'en 1952. Bien que flou et dépourvu de politique coloniale spécifique, Philip Mitchell est très apprécié de l'establishment britannique"
 kenya.2.t2:0 "Le poste de gouverneur de Philip Mitchell"
 kenya.20.a2:0 "Le colonialisme au Kenya touche lentement à sa fin."
 kenya.20.d2:0 "Malcolm MacDonald est l'un des principaux partisans de la nouvelle politique décoloniale du Royaume-Uni. Connu comme sympathisant de Jomo Kenyatta, MacDonald soutiendra sûrement le retour de la KAU, aujourd'hui KANU."
 kenya.20.t2:0 "La nomination de Malcolm Mcdonald"
 kenya.21.a2:0 "Euhuru !"
 kenya.21.d2:0 "Le gouverneur a signé un gouvernement de transition temporaire sous la direction de Jomo Kenyatta qui passera d'une colonie à un dominion, puis à une république indépendante."
 kenya.21.t2:0 "La mise en place du gouvernement de transition"
 kenya.22.a2:0 "Tom Mboya !"
 kenya.22.b2:0 "Kenyatta nous amènera Uhuru !"
 kenya.22.d2:0 "L'Union nationale africaine du Kenya a remporté une victoire écrasante, mais qui devrait être son candidat ?"
 kenya.22.t2:0 "Les élections générales de 1963"
 kenya.23.a2:0 "Euhuru !"
 kenya.23.d2:0 "Harambee est une tradition kenyane d'événements d'entraide communautaire, par ex. Activités de collecte de fonds ou de développement. Harambee signifie littéralement « tous ensemble » en swahili"
 kenya.23.t2:0 "Harambees du gouvernement"
 kenya.24.a2:0 "La modernisation arrive."
 kenya.24.d2:0 "Aujourd'hui, Jomo Kenyatta a adopté la loi sur le transfert des fonctions, qui met fin aux subventions aux autorités locales et transfère les principaux services du contrôle provincial au contrôle central."
 kenya.24.t2:0 "La loi sur le transfert de fonctions"
 kenya.25.a2:0 "Le Kenya est proche d'un État à parti unique."
 kenya.25.d2:0 "Suite aux récents troubles, Kenyatta a organisé la fusion de tous les principaux partis au sein de la KANU au sein d'une seule coalition"
 kenya.25.t2:0 "La fusion de KADU avec KANU"
 kenya.26.a2:0 "Nous sommes dans une nouvelle ère"
 kenya.26.d2:0 "Les dirigeants indépendantistes de l'Afrique de l'Est, notamment Julius Nyerere, Milton Obote et Jomo Kenyatta, ont organisé ce soir une conférence où ils décideront du sort d'une future fédération."
 kenya.26.t2:0 "La Conférence de l'Afrique de l'Est"
 kenya.27.a2:0 "L'Afrique a un brillant avenir"
 kenya.27.t2:0 "Formation de la Fédération de l'Afrique de l'Est"
 kenya.27.d2:0 "Les peuples d'Afrique de l'Est se sont réunis au sein d'une nouvelle fédération. Ses dirigeants promettent une coopération politique et économique plus étroite dans la région alors qu'ils commencent à construire les institutions de leur gouvernement commun."
 kenya.28.a2:0 "Mort aux seigneurs de guerre !"
 kenya.28.t2:0 "Opération Bunyoro"
 kenya.29.a2:0 "Mort aux seigneurs de guerre !"
 kenya.29.d2:0 "Dans une tentative d'étendre son influence, Mouammar Kadhafi a décidé d'envoyer des forces spéciales d'élite pour nous aider."
 kenya.29.t2:0 "Arrivée des volontaires libyens"
 kenya.3.a2:0 "Elle est montée dans l'arbre en princesse et en est descendue en reine"
 kenya.3.t2:0 "La visite de la reine"
 kenya.30.a2:0 "Super!"
 kenya.30.d2:0 "En guise de symbole de notre force contre les gouvernements minoritaires blancs de notre sud, un immense complexe de forteresses a été construit dans l'étroite frontière rhodésienne entre les grands lacs"
 kenya.30.t2:0 "La Grande Forteresse de Mbeya"
 kenya.31.a2:0 "l'EAF exerce son pouvoir"
 kenya.31.d2:0 "Les administrateurs de la colonie peu peuplée des Seychelles se sont soumis à notre ultimatum concernant l'entrée fédérale de leur pays."
 kenya.31.t2:0 "Annexion des Seychelles"
 kenya.32.a2:0 "Nous sommes des hommes libres"
 kenya.32.d2:0 "Les délégués de l'Afrique du Sud ont proposé avec nous une série complexe de traités défensifs."
 kenya.32.t2:0 "L'Afrique du Sud propose un traité défensif"
 kenya.33.a2:0 "L'Afrique pour les Africains !"
 kenya.33.d2:0 "De grands dirigeants de tout le continent se sont réunis aujourd'hui dans un plan pour une plus grande unité africaine. Même si les premières tentatives d'organisations telles que l'OUA n'ont pas abouti, il s'agira d'un événement bien plus décisif."
 kenya.33.t2:0 "L'Internationale panafricaniste"
 kenya.34.a2:0 "Nous sommes des hommes libres"
 kenya.34.d2:0 "Kwame Nkrumah a organisé la formation d'une faction tiers-mondiste défensive."
 kenya.34.t2:0 "Le Traité du Tiers Monde"
 kenya.35.a2:0 "Le KPU!"
 kenya.35.b2:0 "KANU nous a bien conduit !"
 kenya.35.d2:0 "L'élection présidentielle générale de 1966 se déroule actuellement dans un contexte houleux, avec Jaramogi Oginga Odinga à la tête de l'UCP en tant que parti d'opposition contre la KANU."
 kenya.35.t2:0 "Les élections générales de 1966"
 kenya.36.a2:0 "Jomo Kenyatta crée un État à parti unique !"
 kenya.36.b2:0 "Jaramogi Oginga Odinga est un gauchiste radical !"
 kenya.36.d2:0 "Dans la ville à majorité Lua de Kisumu, des émeutes massives ont eu lieu suite à la violente altercation entre Jarmogi Oginga Odinga et Jomo Kenyatta qui a conduit à l'arrestation du premier."
 kenya.36.t2:0 "Les émeutes de Kisumu !"
 kenya.37.a2:0 "Qu'il repose en paix."
 kenya.37.t2:0 "L'assassinat de Tom Mboya"
 kenya.38.a2:0 "Règle de la minorité blanche au Kenya."
 kenya.38.d2:0 "L'agriculteur et homme politique kenyan d'origine britannique qui a été membre du Conseil législatif a été nommé premier ministre d'un dominion de transition du Kenya."
 kenya.38.t2:0 "La nomination de Michael Blundell"
 kenya.39.a2:0 "Aux côtés de l'UCP !"
 kenya.39.b2:0 "Aux côtés de la Révolution !"
 kenya.39.c2:0 "Coup d'État des vétérans de la KLFA !"
 kenya.39.t2:0 "La guerre civile au Kenya !"
 kenya.4.a2:0 "Secrétaire, qui a le temps pour ça !"
 kenya.4.t2:0 "D'étranges mouvements Kikuyu ?"
 kenya.40.a2:0 "Euhuru !"
 kenya.40.d2:0 "Grâce à un désordre bureaucratique alambiqué, le Kenya a finalement obtenu son indépendance interne et externe du Royaume-Uni"
 kenya.40.t2:0 "L'indépendance du Kenya !"
 kenya.41.a2:0 "Une meilleure façon de nous organiser"
 kenya.41.d2:0 "Alors que nous nous adaptons au nouveau style de vie auquel nous aspirons ici au Kenya, nous changeons lentement notre gouvernement pour devenir un État-nation permanent plutôt qu'une colonie"
 kenya.41.t2:0 "Création du Parlement bicaméral"
 kenya.42.a2:0 "Ils constituent une menace !"
 kenya.42.d2:0 "Utilisant comme justification le sentiment socialiste et nationaliste nourri par les syndicats, Michael Blundell a déjà adopté une loi abolissant leur existence"
 kenya.42.t2:0 "Interdiction des syndicats"
 kenya.43.a2:0 "Nous avons les mêmes intérêts."
 kenya.43.d2:0 "Le petit collectif des gouverneurs des îles des Seychelles a décidé d'accueillir d'abord leur fédération avec notre nation."
 kenya.43.t2:0 "Fédération avec les Seychelles"
 kenya.45.a2:0 "Le KADU"
 kenya.45.b2:0 "Encore l'UCP !"
 kenya.45.d2:0 "Alors qu'un gouvernement minoritaire blanc a eu une administration semi-solide ces trois premières années, la question suivante est de savoir si nous allons continuer sur cette voie, ou sur une voie plus modérée."
 kenya.45.t2:0 "L'élection présidentielle générale de 1966"
 kenya.46.a2:0 "Nous sommes des hommes libres !"
 kenya.46.d2:0 "Les délégués de l'Afrique du Sud, de la Rhodésie et du Kenya se sont réunis aujourd'hui en tant que nations indépendantes cherchant à se défendre contre les agressions extérieures"
 kenya.46.t2:0 "Bloc défensif africain"
 kenya.47.a2:0 "Alignez-vous sur le marxiste-léninisme orthodoxe !"
 kenya.47.b2:0 "Nous suivons le modèle chinois !"
 kenya.47.c2:0 "Nous trouverons notre propre chemin !"
 kenya.47.d2:0 "Toute agression réactionnaire contre le prolétariat a été éliminée. Le socialisme a triomphé de toutes les autres idéologies au Kenya, mais quelle voie du socialisme allons-nous emprunter ?"
 kenya.47.t2:0 "Fondation de la République populaire du Kenya"
 kenya.48.a2:0 "Moi marchera sur ses traces..."
 kenya.48.b2:0 "KANU soit damné !"
 kenya.48.d2:0 "Aujourd'hui, tout le Kenya pleure alors que le père de tous les Kenyans est décédé d'une crise cardiaque. Il n'y en a qu'un pour suivre ses traces..."
 kenya.48.t2:0 "La mort de Jomo Kenyatta !"
 kenya.5.a2:0 "Adieu."
 kenya.5.t2:0 "La retraite de Philip Mitchell"
 kenya.52.a2:0 "Au diable ces Mau Mau !"
 kenya.52.t2:0 "La mort d'Archibald J. A. Wavell (2e comte)"
 kenya.53.a2:0 "On dit qu'il est bon en cuisine ?"
 kenya.53.t2:0 "Bienvenue officier Idi Amin !"
 kenya.6.a2:0 "Comment cela va-t-il se terminer ?"
 kenya.6.t2:0 "La bagarre de Kolloa"
 kenya.7.a2:0 "Le joyau de l'Afrique"
 kenya.7.d2:0 "En Afrique du Sud et en Rhodésie, la grande colonie blanche du Kenya a suscité le désir d'une minorité blanche dans la colonie et le protectorat"
 kenya.7.t2:0 "Règle blanche des Highlands"
 kenya.8.a2:0 "Était-il vraiment coupable ?"
 kenya.8.t2:0 "L'arrestation de Jomo Kenyatta"
 kenya.9.a2:0 "Les jeunes ne comprennent pas comment fonctionne ce monde"
 kenya.9.t2:0 "Émeutes étudiantes à Nairobi"
 kenya_bw.1.a2:0 "Bonne nouvelle"
 kenya_bw.1.t2:0 "Offensive réussie contre..."
 kenya_bw.2.a2:0 "Horrible"
 kenya_bw.2.t2:0 "Échec de l'offensive contre..."
 newskenya.3.a2:0 "Il nous manquera beaucoup."
 newskenya.3.d2:0 "Aujourd'hui, toute l'Afrique pleure tandis que le lion dort cette nuit. Jomo Kenyatta est décédé hier soir des suites d'une grave crise cardiaque."
 newskenya.3.t2:0 "[GetNewspaperHeader] La mort de Jomo Kenyatta !"
