 NGUYEN_THANH_PHUONG_DESC: "Puissant seigneur de guerre Cao-Dai, Nguyen-Thanh-Phuong a gravi les échelons de la milice religieuse après avoir servi dans le Noi-Ung-Nghia-Binh, formé par les Français, et dans le Viet-Nam-Phuc-Quoc-Hoi, soutenu par le Japon. Rival acharné de Tran-Quang-Vinh, il écarta de force ce dernier et fit pression sur la hiérarchie Cao-Dai pour qu'elle reconnaisse sa promotion au grade de lieutenant général et sa nomination au poste de commandant en chef. Aujourd'hui à la tête du mouvement indépendant Lien-Minh (Alliance), Phuong commande un formidable réseau de troupes Cao-Dai ayant fait défection et d'alliés sectaires, cherchant à préserver son autonomie militaire tout en naviguant entre les intérêts concurrents de Saigon et des puissances étrangères.\n\nBase d'opérations : Tay-Ninh"

