 VIE_Marxist_Organization: "Organisation marxiste"
 VIE_Marxist_Organization_desc: "La Révolution Personnaliste n'a pas à craindre les méthodes de ses ennemis. Sous la direction du conseiller Ngo-Dinh-Nhu, le parti étudiera et adoptera la discipline organisationnelle du marxisme-léninisme - cellules, cadres, critique - tout en rejetant son âme matérialiste."
 VIE_Organize_Party_Cells: "Organiser des cellules de fête"
 VIE_Organize_Party_Cells_desc: "Le modèle Can-Lao : organiser le parti en petites cellules disciplinées implantées dans chaque village, usine et caserne. Chaque cellule répond vers le haut ; personne ne connaît l'intégralité du réseau."
 VIE_Introduce_Democratic_Centralism: "Introduire le centralisme démocratique"
 VIE_Introduce_Democratic_Centralism_desc: "Liberté de discussion, unité d'action. Une fois la ligne du parti définie, chaque cadre doit l'appliquer sans hésitation - une discipline que nos ennemis maîtrisent depuis longtemps."
 VIE_Vanguard_NhanVi_Revolution: "Une avant-garde pour la révolution Nhan-Vi"
 VIE_Vanguard_NhanVi_Revolution_desc: "Le parti n'est plus une simple machine électorale mais une avant-garde : une élite de cadres éprouvés qui conduisent les masses vers la société personnaliste au sein de chaque institution de l'État."
 VIE_Cadres_To_Barracks: "Cadres à la Caserne"
 VIE_Cadres_To_Barracks_desc: "Les vétérans Viet-Minh réhabilités du programme Chieu-Hoi connaissent la guerre dans la jungle et le soldat politique mieux que n'importe lequel de nos instructeurs. Attachez-les à nos commandes d'entraînement. Il reste §Y[?VIE_ChieuHoi_Cadres]§! des pools de cadres."
 VIE_Cadres_To_Villages: "Cadres aux Villages"
 VIE_Cadres_To_Villages_desc: "Les cadres réhabilités ont déjà organisé une fois la redistribution des terres pour le Viet-Minh - qu'ils le fassent à nouveau, cette fois sous notre drapeau. Il reste §Y[?VIE_ChieuHoi_Cadres]§! des pools de cadres."
