 LIEN_MINH_TITLE: "Quoc-Gia Lien-Minh (L'Alliance)"
 LIEN_MINH_DESC: "Le Lien-Minh (L'Alliance) est un nouveau mouvement militaro-religieux vietnamien indépendant créé en 1951 par le général de brigade Trinh-Minh-The après s'être séparé de la hiérarchie religieuse Cao-Dai. Il a uni les forces Cao-Dai, catholiques romaines, bouddhistes Hoa-Hao et Binh-Xuyen sous une coalition interconfessionnelle de « troisième force » connue sous le nom de Front Cao-Thien-Hoa-Binh, prônant l'opposition à la fois à la domination coloniale française et au Viet-Minh. Sa branche militaire était connue sous le nom d'Armée Quoc-Gia Lien-Minh (Quan-Doi Quoc-Gia Lien-Minh)."
 TRINH_MINH_THE_LIEN_MINH_DESC: "Ancien commandant du Cao-Dai, Trinh-Minh-The s'est détaché de la hiérarchie religieuse pour diriger le mouvement indépendant Lien-Minh (Alliance). En tant que président du Front interreligieux et commandant en chef de l'armée Quoc-Gia Lien-Minh, il commande les forces rebelles Cao-Dai, catholiques, Hoa-Hao et Binh-Xuyen en opposition aux Français et au Viet-Minh. Dirigeant nationaliste ambitieux, il représente une puissance militaire indépendante croissante, hors du contrôle de Saigon.\n\nBase d'opérations : Tay-Ninh"
