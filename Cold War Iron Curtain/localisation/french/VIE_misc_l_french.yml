 # French Favoritism Minigame
 VIE_Bao_Dai_Power_Minigame: "Gestion de crise factionnelle"

 VIE_MINIGAME_INTERNAL_POLITICS_TT: "Politique interne\n\n Alors que les luttes de pouvoir se poursuivent, le fait de garder le peuple vietnamien dans l'esprit des dirigeants tout en faisant plaisir à nos soutiens français est devenu un gâchis brûlant constant. Plaire complètement à un camp plutôt qu'à l'autre entraînera probablement soit une vague d'indignation de la part du peuple, soit une crise de confiance des Français dans notre régime."
 VIE_MINIGAME_POWER_STRUGGLE_TT: "La lutte pour le pouvoir\n\n Alors que les prétendants rivaux au gouvernement s'affrontent sur le champ de bataille politique, les principaux acteurs de la campagne ont fait apparaître la vie normale au Vietnam plus proche d'un thriller, alors que les gens ordinaires regardent un jeu politique se dérouler devant eux. De l'autre côté de la lutte, les intérêts français au Vietnam regardent avec une horrible fascination celui qui remportera la lutte, espérant silencieusement que le vainqueur sera plus favorable à leurs objectifs et à leurs intérêts."
 VIE_MINIGAME_FAVORITISM_TT: "Favorisisme\n\n Le favoritisme est marqué par les pourcentages et la case à cocher ci-dessous. Un pourcentage plus élevé signifie que le leader en question est plus susceptible d'être influencé par les Français qui nous récompenseront généreusement, mais dont le gouvernement risque de ne pas être populaire auprès du public. Un pourcentage plus faible signifie que les gens considèrent que le gouvernement du leader donné est plus favorable, mais qu'ils sont moins susceptibles de travailler avec les Français."

 CuongDe_NgoDinh_Countdown: "Recrutez les frères Ngo-Dinh"
 CuongDe_Weapon_Purchase: "Acheter des armes américaines"

 Dealing_With_CuongDe_Mission: "Cuong-De fait son pas"
 Dealing_With_CuongDe_Mission_desc: "Cuong-De renforce tranquillement son influence auprès de notre peuple et de nos dirigeants politiques. Si rien n'est fait, sa faveur pourrait devenir suffisamment forte pour faire pencher la balance du pouvoir en sa faveur. Nous devons surveiller attentivement son ascension et agir en conséquence avant qu'il ne soit trop tard."
 CuongDe_Countdown: "Le voyage de Cuong-De"
 CuongDe_Countdown_desc: "Les préparatifs sont tranquillement en cours pour le voyage de Cuong-De au Sud-Vietnam. Soutenue par des partisans japonais, son arrivée pourrait faire pencher la balance politique si les bases sont posées. Le temps presse pour influencer l'issue de son retour."
 Discredit_the_CuongDe_Faction: "Discréditer la faction Cuong-De"
 Discredit_the_CuongDe_Faction_desc: "Nous ne pouvons pas permettre que la propagande de Cuong-De reste sans contestation. En révélant ses défauts et en sapant ses partisans, nous réduisons son influence et réaffirmons la légitimité de notre gouvernement."
 Lighten_Propaganda_Against_CuongDe: "Alléger la propagande contre Cuong-De"
 Lighten_Propaganda_Against_CuongDe_desc: "Il est peut-être temps de relâcher la pression sur les partisans de Cuong-De. Relâcher nos efforts de propagande pourrait nous gagner la faveur de ses partisans et ouvrir de nouvelles voies de coopération."
 Organize_Rallies_For_CuongDe: "Organiser des rassemblements en soutien à Cuong-De"
 Organize_Rallies_For_CuongDe_desc: "Une série de rassemblements publics renforcera l'image de Cuong-De en tant que sauveur national. Ces manifestations de soutien influenceront sûrement les citoyens indécis et intimideront son opposition."
 CuongDe_Our_True_Leader: "Cuong-De, notre véritable leader !"
 CuongDe_Our_True_Leader_desc: "Alors que le pays est à la dérive et que des mains étrangères tirent les ficelles, seul Cuong-De reste ferme dans sa vision du Vietnam. Il est le leader légitime de notre peuple et il est temps que nous le reconnaissions comme tel."

 Discredit_the_Nguyen_Phan_Long_Faction: "Discréditer la faction Nguyen-Phan-Long"
 Discredit_the_Nguyen_Phan_Long_Faction_desc: "En révélant les faux pas et en semant le doute dans la presse, nous pouvons progressivement éroder la crédibilité de Nguyen-Phan-Long auprès des bailleurs de fonds français potentiels et du public."
 Boost_Long_French_Favoritism: "Boostez l'opinion française sur Nguyen-Phan-Long"
 Boost_Long_French_Favoritism_desc: "Encourager les ouvertures diplomatiques et les gestes flatteurs pour renforcer la position de Nguyen-Phan-Long auprès des principaux responsables et conseillers français."
 VIE_USA_Long_Weapon_Shipment: "Demander des armes américaines"
 VIE_USA_Long_Weapon_Shipment_desc: "En tirant parti de nos liens améliorés avec les États-Unis, nous pouvons demander une livraison discrète d'armes pour renforcer la position de Long et notre lutte contre le communisme. Les Américains regardent, il est temps d'agir."
 Long_PM_Countdown: "La décision de la France concernant Nguyen-Phan-Long"
 Long_PM_Countdown_desc: "Les Français débattent du sort de Nguyen-Phan-Long en tant que Premier ministre. Si sa faveur reste forte, ils pourraient continuer à le soutenir. Mais le temps presse et les rivaux attendent dans les coulisses."

 Discredit_the_Tran_Van_Huu_Faction: "Saper le bloc Tran-Van-Huu"
 Discredit_the_Tran_Van_Huu_Faction_desc: "Répandez discrètement des critiques sur l'indécision politique et le manque de vision de Tran-Van-Huu afin d'affaiblir sa base de soutien et de ramener l'élan politique au statu quo."
 Boost_Huu_French_Favoritism: "Promouvoir les références pro-françaises de Tran-Van-Huu"
 Boost_Huu_French_Favoritism_desc: "Soulignez l'approche pragmatique de Tran-Van-Huu et son histoire de coopération avec la France pour obtenir un plus grand soutien des administrateurs coloniaux et des élites françaises."
 VIE_Huu_Weapon_Shipment_USA: "Pétition aux États-Unis pour des armes"
 VIE_Huu_Weapon_Shipment_USA_desc: "Faites valoir auprès des diplomates et des observateurs américains que Tran-Van-Huu est le meilleur espoir d'un Sud-Vietnam démocratique et stable. En échange, demandez un soutien matériel."
 VIE_Huu_Weapon_Shipment_FRA: "Demander l'assistance militaire française"
 VIE_Huu_Weapon_Shipment_FRA_desc: "La France reste l'acteur clé en Indochine. Avec les bonnes manoeuvres politiques, Tran-Van-Huu pourrait obtenir une nouvelle série d'aides pour consolider son contrôle."
 VIE_Huu_Weapon_Shipment_ENG: "Rechercher le soutien britannique contre le communisme"
 VIE_Huu_Weapon_Shipment_ENG_desc: "Face à l'inquiétude internationale croissante concernant l'Asie du Sud-Est, un appel soigneusement formulé au gouvernement britannique pourrait aboutir à d'importantes livraisons d'armes."
 VIE_Huu_Weapon_Shipment_ROC: "Appel à l'aide de la République de Chine"
 VIE_Huu_Weapon_Shipment_ROC_desc: "Même si elle lutte pour sa propre survie, la République de Chine reste farouchement anticommuniste - et pourrait être disposée à armer ses camarades opposants aux insurgés du Viet Minh."

 Discredit_the_Ngo_Dinh_Diem_Faction: "Discréditer la faction Ngo-Dinh-Diem"

 Uncensor_Bao_Dais_Scandals: "Décensurer les scandales de Bao-Dai"
 Uncensor_Bao_Dais_Scandals_desc: "Auparavant dissimulées par les censeurs soutenus par la France, les indiscrétions de Bao-Dai, telles que les affaires, l'opulence et l'absentéisme, peuvent désormais être diffusées pour discréditer la monarchie fantoche. Une démarche risquée, mais qui entravera son attrait auprès des Français."
 Broadcast_Pro_Independence_Speeches: "Diffusez des discours en faveur de l'indépendance"
 Broadcast_Pro_Independence_Speeches_desc: "Dans tout le sud, des discours publics proclament le droit du Vietnam à l'autonomie, rejetant le maintien de la surveillance française. Cela renforce l'influence intérieure croissante des cercles nationalistes."
 Attack_French_Loyalists: "Attaquer les loyalistes français"
 Attack_French_Loyalists_desc: "Frappez directement ceux qui restent fidèles aux intérêts coloniaux. Que ce soit par des arrestations, du chantage ou des intimidations ciblées, cela renforcera considérablement l'emprise du mouvement indépendantiste sur le pouvoir."
 Broadcast_Pro_French_Propaganda: "Diffusez de la propagande pro-française"
 Broadcast_Pro_French_Propaganda_desc: "Les messages publics mettront l'accent sur l'investissement, l'ordre et le prestige culturel français. En fin de compte, rappeler aux citoyens les soi-disant avantages du partenariat colonial."
 Assure_Loyalty_to_France: "Assurer la fidélité à la France"
 Assure_Loyalty_to_France_desc: "Réaffirmer l'engagement de l'État envers l'Union française peut contribuer à éviter l'agitation étrangère. Cela apaisera les responsables français tout en sapant la montée de la ferveur nationaliste."
 Ask_France_for_Money: "Plaidoyer pour l'argent français"
 Ask_France_for_Money_desc: "Demander un soutien financier direct au Trésor français. En fonction de leur influence actuelle, le niveau de soutien varie. Mais le coût pour la légitimité nationale pourrait être élevé."
 Ask_France_for_Weapons: "Mendier des armes françaises"
 Ask_France_for_Weapons_desc: "Sollicitez l'assistance militaire de la France en échange d'un alignement plus profond. Leur réponse dépendra de l'influence qu'ils détiennent encore, et votre demande peut avoir des conséquences."
 ProFrench_Coup: "Intervention française imminente"
 ProFrench_Coup_desc: "Une tempête s'abat sur Saigon. Si l'influence française devient trop soumise ou si le soutien intérieur domine, les surveillants coloniaux pourraient agir. Les loyalistes se préparent et les murmures des généraux en mouvement signalent le retour du contrôle direct."
 VIE_ProFrench_Coup_Warning_Title: "§RCoup d'Etat français imminent !§!"
 VIE_ProFrench_Coup_Warning_Desc: "L'influence française s'est effondrée à un niveau critique. L'establishment colonial s'agite et les généraux fidèles à Paris prennent tranquillement position. Si la confiance en la France n'est pas rapidement restaurée, un coup d'État renversera le gouvernement.\n §YRestaurez l'influence française au-dessus de 10 pour empêcher une prise de pouvoir militaire.§!"

 Dealing_With_Diem_Countdown: "Faire face à Diem"
 Dealing_With_Diem_Countdown_desc: "Le manifeste radical de Ngo-Dinh-Diem a tiré la sonnette d'alarme politique, mais une action décisive ne peut être retardée éternellement. Qu'ils soient exilés, arrêtés ou ignorés, les conséquences de l'inaction se répercuteront dans le futur. Nous avons soixante-dix jours pour affronter le dilemme de Diem... Ou laisser les autres le faire à notre place."

 Reach_out_to_Phan_van_Giao: "Contactez Phan-Van-Giao"
 Reach_out_to_Nguyen_van_Xuan: "Contactez Nguyen-Van-Xuan"
 Reach_out_to_Le_van_Ty: "Contactez Le-Van-Ty"
 Reinstate_Xuan_CCC: "Donnez à Xuan l'autonomie sur Nam-Ky"
 Reintergrate_Xuan_CCC: "Réintégrer la Cochinchine"
 Reintergrate_Xuan_CCC_desc: "Réintégrer la région autonome de Cochinchine dans l'État du Vietnam, mettant fin à l'autonomie temporaire de Xuan et ramenant le territoire sous le contrôle direct de Saigon."

 Long_Retires_PM: "Les Français ont décidé de soutenir §YBao-Dai§!"
 Long_Stays_PM: "Les Français ont décidé de soutenir §YNguyen-Phan-Long§!"
 Long_PM_tt: "Si §YNguyen-Phan-Long§! a au moins 60 % de favoritisme français, les Français §Rreconsidéreront§! qui sont leurs alliés.§!"

 Huu_PM_Countdown: "L'équilibre diplomatique de Huu"
 Huu_PM_Countdown_desc: "Le Premier ministre Tran-Van-Huu se retrouve pris entre deux puissants protecteurs : les États-Unis et la France. Ses manoeuvres diplomatiques détermineront s'il peut convaincre les Français malgré le soutien américain, ou s'il doit accepter le désintérêt français et se tourner pleinement vers Washington. Le temps presse et chaque décision compte."
 Huu_PM_tt: "Si les Français préfèrent §YTran-Van-Huu§! à §YBao-Dai§!, §YHuu§! §Gl'emportera sur les Français§!. Sinon, il acceptera §Rle désintérêt français§!."
 VIE_Huu_Wins_Over_French_tt: "Huu a réussi à convaincre les Français grâce à ses efforts diplomatiques, malgré le soutien américain."
 VIE_Huu_Accepts_French_Disinterest_tt: "Huu n'a pas réussi à convaincre les Français et doit accepter leur désintérêt et se tourner vers les États-Unis."

 Boost_Huu_USA_Influence: "Renforcer les liens avec Washington"
 Boost_Huu_USA_Influence_desc: "Investir du capital politique et des ressources pour approfondir nos relations avec les États-Unis. Cela augmentera l'influence américaine sur notre gouvernement et améliorera notre position auprès de Washington."
 Boost_Huu_USA_Influence_effect: "Augmente §Yl'influence des États-Unis§! de §G5§!."

 Boost_Huu_French_Influence: "Renforcer les liens avec Paris"
 Boost_Huu_French_Influence_desc: "Investir du capital politique et des ressources dans le maintien et le renforcement de nos relations avec la France. Cela augmentera l'influence française sur notre gouvernement et améliorera notre position auprès de Paris."
 Boost_Huu_French_Influence_effect: "Augmente §YInfluence française§! de §G5§!."

 Huu_USA_Diplomatic_Mission: "Envoyer une mission diplomatique à Washington"
 Huu_USA_Diplomatic_Mission_desc: "Envoi d'une délégation diplomatique de haut niveau aux États-Unis pour renforcer les relations bilatérales. Cette mission améliorera notre position auprès de Washington et augmentera l'influence américaine, tout en améliorant les relations diplomatiques."
 Huu_USA_Diplomatic_Mission_effect: "Augmente §Yl'influence des États-Unis§! de §G10§!. Améliore les relations avec §YUSA§!. Coûts §R25 Pouvoir politique§! et §R200 millions de dollars§!."

 Huu_French_Cultural_Exchange: "Organiser un échange culturel français"
 Huu_French_Cultural_Exchange_desc: "Établir un programme d'échange culturel avec la France pour renforcer les liens et démontrer notre engagement dans la relation franco-vietnamienne. Cela augmentera l'influence française et améliorera les relations avec Paris."
 Huu_French_Cultural_Exchange_effect: "Augmente §YInfluence française§! de §G10§!. Améliore les relations avec §YFrance§!. Coûts §R20 Pouvoir politique§! et §R150 millions de dollars§!."

 Huu_USA_Economic_Agreement: "Négocier un accord économique avec les États-Unis"
 Huu_USA_Economic_Agreement_desc: "Signer un accord économique global avec les États-Unis, offrant des avantages économiques tout en augmentant considérablement l'influence américaine. Il s'agit d'un engagement majeur dans les relations américaines."
 Huu_USA_Economic_Agreement_effect: "Augmente §Yl'influence des États-Unis§! de §G15§!. Fournit §G300 millions de dollars§! d'aide économique. Coûts §R30 Pouvoir politique§! et §R250 millions de dollars§!."

 Huu_French_Military_Cooperation: "Élargir la coopération militaire française"
 Huu_French_Military_Cooperation_desc: "Approfondir la coopération militaire avec la France à travers des programmes conjoints de formation et d'achat d'équipements. Cela augmentera considérablement l'influence française et fournira du matériel militaire, tout en renforçant nos relations avec Paris."
 Huu_French_Military_Cooperation_effect: "Augmente §YInfluence française§! de §G15§!. Fournit §G300 équipements d'infanterie§! de France. Améliore les relations avec §YFrance§!. Coûts §R25 Pouvoir politique§! et §R200 millions de dollars§!."

 Phuong_Mutiny_Timer: "Faire face à Phuong"
 Phuong_Mutiny_tt: "§RLe Vietnam est à nouveau divisé...§!"
 End_Phuong_Mutiny_tt: "§YC'est fini, mais à quel prix§!"

 Industrialization_Development_Discount_20_tt: "§G-20§!% De réduction sur l'amélioration de l'industrialisation"

 Ask_France_for_Money_tt: "Si nous avons plus de §Y75%§! §Cde favoritisme français§!, nous pourrons gagner plus de notre dirigeant colonial"
 Ask_France_for_Weapons_tt: "Si nous avons plus de §Y90%§! §Cde favoritisme français§!, nous pourrons gagner plus de notre dirigeant colonial"

 VIE_PM_Nguyen_Phan_Long: "§YNguyen-Phan-Long§! est actuellement Premier ministre"
 VIE_PM_Tran_Van_Huu: "§YTran-Van-Huu§! est actuellement Premier ministre"

 VIE_Current_Opposition_tt: "§Y[GetAltNameVie]§! Est chef de l'opposition §Y§!"
 VIE_Current_Opposition_tt_NOT: "§Y[GetAltNameVie]§! Est-ce que §YNON§! est à la tête de l'opposition §Y§!"

 MAIN_MINIGAME_TT: "[GetMinigameMainTT]"
 ALT_MINIGAME_TT: "[GetMinigameAltTT]"

 BAO_DAI_MINIGAME_TT: "Bao-Daï\n\n Malgré tout ce qu'il a pu pour capitaliser sur sa légitimité, le gouvernement de l'empereur Bao-Dai est plus que jamais impopulaire. Comme c'était le cas lorsqu'il était une marionnette des Français, il a choisi les mauvais conseillers, a suivi des conseils mal avisés et a brûlé le budget national à des niveaux critiques. Aujourd'hui, d'autres candidats à la légitimité réclament une chance de prouver au peuple et au gouvernement français qu'ils ont à l'esprit les intérêts nationaux et qu'ils peuvent faire leur travail de manière efficace et pragmatique."
 LEROY_MINIGAME_TT: "Jean Leroy\n\n Commandant de milice mi-français, mi-vietnamien, Jean Leroy a fait de l'UMDC une armée privée dominant la province de Ben-Tré. Connu pour ses tactiques brutales contre les populations non chrétiennes, son anticommunisme fanatique le rendit utile aux intérêts français malgré les atrocités commises en son nom. Pour ses partisans, un croisé ; pour ses ennemis, un chef de guerre."
 HIHH_MINIGAME_TT: "Nguyen-Van-Hinh\n\n La France a joué sa dernière carte. Fils du Premier ministre Nguyen-Van-Tam et citoyen français naturalisé qui a bâti sa carrière dans l'armée de l'air française, Hinh n'a jamais eu d'illusions sur sa loyauté - et personne d'autre non plus. Son accession au pouvoir n'est pas le fruit d'une lente lutte politique, mais de l'instrument brutal d'un coup d'État, soutenu par le CEFEO et annoncé au pays avec un effondrement cuisant du moral national. Le Conseil militaire de transition constitue désormais le gouvernement. Les officiers nationalistes ont été purgés, les bureaucrates français comblent le vide et les vieux débats sur la souveraineté ont été remplacés par un arrangement beaucoup plus simple. La seule question qui reste est de savoir si le Vietnam en sortira avec quelque chose qui lui soit propre - ou si les Français ne partiront tout simplement jamais."
 CUONG_MINIGAME_TT: "Cuong-Dé\n\n À mesure que l'intrigue des batailles politiques s'accentuait, Cuong-De, qui avait peut-être déclenché la chaîne d'événements, s'irritait de la menace imminente des intérêts français dans la politique vietnamienne, tandis que le gouvernement de Bao-Dai continuait de sombrer dans l'incompétence et la décadence. Déterminé à défendre son pays, il s'est engagé à faire en sorte que le peuple soit entendu et à pouvoir prendre la tête du gouvernement pour venger une querelle personnelle et représenter les intérêts du peuple avant tout."
 XUAN_MINIGAME_TT: "Nguyen-Van-Xuan\n\n Général franco-vietnamien et l'un des premiers partisans de Bao-Dai, Nguyen-Van-Xuan a brièvement servi comme chef du gouvernement provisoire du centre du Vietnam. Militaire pragmatique ayant de solides liens avec la France, il s'est positionné comme un intermédiaire entre les ambitions nationalistes vietnamiennes et les intérêts coloniaux français - même si son influence a diminué à mesure que des personnalités plus influentes entraient dans l'arène politique."
 NGUYEN_MINIGAME_TT: "Nguyen-Phan-Long\n\n Acteur mineur dans les batailles politiques qui ont tourmenté le pays, Long est apparu comme un pont entre nous et le Cao-dai et une main plus douce que le profondément impopulaire Bao-Dai. Les observateurs attentifs comprennent qu'au-delà de cette posture et de cette forte démonstration, il se positionne comme l'option la plus favorable de la France, afin de saper la légitimité de l'Empereur à l'étranger."
 HUU_MINIGAME_TT: "Tran-Van-Huu\n\n L'un des principaux visages des politiques gouvernementales défendues par les intérêts français, Huu s'est imposé derrière ces politiques comme un modéré, qui ne s'est pas complètement engagé dans un camp ou dans l'autre dans ce conflit en cours. Il semble qu'il soit motivé par autre chose que le désir de diriger un gouvernement juste et représentatif, sans poser de questions."
 TAM_MINIGAME_TT: "Nguyen-Van-Tam\n\n Connu sous le nom de « Tigre de Cai-Lay » pour sa répression brutale des activités du Viet-Minh, Nguyen-Van-Tam est passé du statut d'officier de police coloniale à celui de Premier ministre grâce à sa cruauté et sa loyauté envers les intérêts français. Ses méthodes anticommunistes dures ont fait de lui un instrument d'ordre fiable, quoique redouté - respecté par les Français mais vilipendé par une grande partie de la population."
 LOC_MINIGAME_TT: "Nguyen-Phuc Buu-Loc\n\n Prince de la maison royale Nguyen et cousin de Bao-Dai lui-même, Buu-Loc apporte une légitimité dynastique discrète à un gouvernement qui a de plus en plus de mal à justifier sa propre existence. Formé en France et profondément ancré dans les réseaux aristocratiques qui lient la cour à Paris, il représente une dernière tentative de gouvernance digne et ordonnée avant de devoir faire des choix plus difficiles. Sa nomination au poste de Premier ministre a le poids du caractère définitif : son entourage sent qu'après Buu-Loc, l'ordre ancien ne se rétablira pas."
 VINH_MINIGAME_TT: "Tran-Quang-Vinh\n\n Le commandant militaire du Cao Dai, Tran-Quang-Vinh a construit sa carrière en naviguant entre les loyautés croisées de l'Indochine coloniale - au service des intérêts japonais pendant l'occupation, puis en se repositionnant en tant que force pragmatique au sein de l'État soutenu par la France. Sa base de pouvoir est l'armée privée du Cao Dai dans les terres saintes de Tay Ninh, et ses ambitions vont bien au-delà du rôle de commandant de secte. Il se présente comme un pont entre les nationalistes religieux et le gouvernement de Saigon, même si ses détracteurs le considèrent comme un opportuniste prêt à vendre ce pont à celui qui offre les meilleures conditions."
 TOAN_MINIGAME_TT: "Nguyen-Bao-Toan\n\n Nationaliste vietnamien et leader du mouvement Dan Xa, Nguyen-Bao-Toan envisage un Vietnam reconstruit de fond en comble à travers trois révolutions imbriquées : nationale, sociale et morale. Ses liens avec les Hoa Hao et d'autres mouvements religieux du Sud lui confèrent une légitimité populaire dans les campagnes que les politiciens aristocratiques de Saigon ne peuvent égaler, mais son sentiment anti-français le met en permanence en désaccord avec les hommes qui détiennent les véritables leviers du pouvoir. S'il parvient un jour à atteindre le chef du gouvernement, il arrivera en attirant des forces qu'il n'est pas facile de remettre dans leurs cases."
 QUANG_MINIGAME_TT: "Dinh-Xuan-Quang\n\n Administrateur civil plutôt qu'agitateur politique, Dinh-Xuan-Quang représente l'aile la plus calme de la gouvernance vietnamienne - des hommes qui croient qu'une bureaucratie compétente peut gagner du temps là où l'idéologie ne le peut pas. Sa priorité est de réformer la fonction publique et de stabiliser le sud rural grâce à une politique foncière mesurée, un travail peu glamour qui ne rapporte que peu de crédit populaire mais qui fait tourner la machine de l'État. Dans une compétition entre hommes forts et visionnaires, il est un personnage improbable - c'est précisément pourquoi certains le considèrent comme un choix sûr, et d'autres le considèrent comme inutile."
 DIEM_MINIGAME_TT: "Ngo-Dinh-Diem\n\n Catholique, patriote et révolutionnaire engagé, Ngo-Dinh-Diem a développé sa philosophie politique autour du personnalisme et du syndicalisme de Mournier, qu'il considérait ni comme capitalistes ni communistes, mais comme une « troisième voie » distinctement vietnamienne et spiritualiste. Son personnalisme oriental cherchait à placer la liberté communautaire et la dignité de l'individu au-dessus de la lutte des classes matérialiste et de l'individualisme exploiteur, aspirant à libérer l'humanité de toute forme d'oppression, d'exploitation et de déshumanisation. Ses convictions intransigeantes l'ont maintenu en contradiction à la fois avec l'establishment colonial français et avec les révolutionnaires communistes, tout en attirant des intellectuels et des nationalistes à la recherche d'une alternative au clivage gauche-droite établi. La question reste ouverte de savoir si sa vision révolutionnaire pourrait devenir le fondement d'un nouveau Vietnam ou sombrer dans l'autoritarisme."
 CEFEO_MINIGAME_TT: "Corps expéditionnaire français en Extrême-Orient\n\n Le corps expéditionnaire français d'Extrême-Orient représente tout le poids de la puissance militaire française en Indochine. À la fois force militaire dominante et garant des intérêts coloniaux français, le CEFEO exerce une énorme influence sur les résultats politiques au Vietnam. Leur faveur peut faire ou défaire une faction politique - mais le soutien militaire français a toujours un prix."


 # === Ideologies ===
 oriental_personalism: "Personnalisme oriental"
 oriental_personalism_desc: "£Ideology_Oriental_Personalism_pic\n\n\n\n\n\n\n\n\nLe personnalisme oriental est l'idéologie officielle du parti Can-Lao de Ngo Dinh Diem au Sud-Vietnam. En raison autant de l'influence de son frère Ngo Dinh Nhu que de Diem lui-même, le personnalisme oriental a diverses influences idéologiques, notamment la théorie du personnalisme d'Emannuel Mournier, le marxisme et les traditions et religions populaires du Vietnam. Le manifeste Can-Lao appelle à la transformation progressive de la société vietnamienne en deux phases. Dans la première phase, la révolution personnaliste, les classes sociales et ouvrières briseront leurs divisions et s'uniront. Vient ensuite la Révolution sociale, où toutes les formes de capitalisme et d'influence coloniale seront balayées dans une marche triomphale vers une société utopique, socialiste et fièrement vietnamienne."

 labor_personalism: "Personnalisme du travail"
 labor_personalism_desc: "£Ideology_Labor_Personalism_pic\n\n\n\n\n\n\n\n\nLa deuxième phase du personnalisme oriental est le personnalisme travailliste (Can-Lao Nhan-Vi) et c'est l'idéologie officielle du Parti révolutionnaire Can-Lao Nhan-Vi née de l'adoption du modèle marxiste et des enseignements des frères Ngo-Dinh et Kieu-Cong-Cung en 1958-1960.\n\nAlors que le personnalisme travailliste maintient toujours les vues antimatérialistes et pro-spiritualistes de la première phase et la doctrine « Nhan-Vi + Cong-Dong = Dong-Tien » (personnalité + collectif = progrès mutuel), ils mettent désormais davantage l'accent sur la construction d'une utopie via la révolution sociale et prolétarienne avec la coopération de toutes les classes (ouvrières) Can-Lao et d'autres pays marxistes pour combattre l'avidité matérialiste et le mal du capitalisme et du faux communisme."

 nhuism: "Théorie de la dignité de la personne"
 nhuism_desc: "£Ideology_Spiritualistic_Marxism_pic\n\n\n\n\n\n\n\n\nLa théorie de la dignité de la personne, également connue sous le nom de marxisme spiritualiste, décrit la vision du monde la plus radicale de Ngo Dinh Nhu. Influencé par son implication dans le syndicalisme français dans les années 1930 et par le nationalisme de gauche du Viet-Minh, les opinions de Nhu sont nettement à gauche de son frère aîné. L'interprétation de Nhu du « vrai marxisme » appelle à une centralisation totale du pouvoir d'État dans le parti Can Lao et à la destruction complète de la société traditionnelle en faveur de l'enrégimentement strict des paysans dans des « hameaux stratégiques » collectivistes et des citadins à travers des « syndicats révolutionnaires urbains ». Certains pensent que les ambitions de Nhu pourraient se situer au-delà du Vietnam, compte tenu de ses appels à une croisade mondiale contre le « capitalisme matérialiste »."

 DanVuong_Model: "Modèle Dan-Vuong"
 DanVuong_Model_desc: "£Ideology_Monarchism_Cuong_De_pic\n\n\n\n\n\n\n\n\nContrairement à de nombreux empereurs avant lui, l'empereur Nam-Hung a conçu une idée unique de royauté appelée « Dan-Vuong » ou monarchie populaire. Le concept de « Dan-Vuong » consiste en une combinaison des enseignements révolutionnaires du tridémisme de Sun Yat-Sen et du système monarchique vietnamien traditionnel, dans lequel le rôle du roi est un rôle exécutif pour servir les intérêts communs du peuple tout en permettant à un parlement habilité d'adopter un rôle législatif. L'Empereur espère que son idée de royauté permettra au Vietnam de passer à un État moderne sur les cendres de systèmes réactionnaires archaïques."
 Cuong_De_desc: "Descendant direct de l'empereur Gia Long, Nguyen-phuoc-dan - mieux connu sous le nom de cuong-de - a passé une grande partie de sa jeunesse en exil au Japon après son implication dans le mouvement Dong-Du (Voyage vers l'Est) aux côtés de Phan-boi-chau au début du XXe siècle. Considéré comme collaborateur des autorités coloniales françaises, Cuong-de reste néanmoins un symbole persistant de la résistance monarchiste vietnamienne, équilibrant ses liens avec le panasiatisme japonais avec sa vision d'un Vietnam souverain enraciné à la fois dans la tradition confucianiste et dans le nationalisme moderne.\n\nÀ la fin des années 1940, alors que la France cherchait à réaffirmer son contrôle sur l'Indochine à travers l'État fragile du Vietnam dirigé par Bao-dai, le Cuong-de revint sur le devant de la scène. Soutenu par des éléments de l'armée, des ligues nationalistes et des organisateurs ouvriers mécontents de la faiblesse perçue de Bao-dai et de sa collaboration avec les Français, il lança un coup d'État rapide à Phu-xuan en 1949. Se déclarant empereur Nam-Hung - « Force du Sud » - il présenta son idée Dan-vuong comme une synthèse de la modernisation de l'héritage culturel vietnamien de la dynastie Nguyen et du tridémisme révolutionnaire de Sun-yet-Sen. Et j'espère pouvoir réunifier le Vietnam soit pacifiquement, soit par la guerre contre toutes les forces de l'impérialisme."
 NGUYEN_PHAN_LONG_DESC: "Journaliste chevronné, constitutionnaliste et défenseur de la coopération franco-vietnamienne, Nguyen-Phan-Long a émergé de l'élite terrienne de Cochinchine pour devenir une voix éminente dans la réforme politique de l'ère coloniale. Formé au lycée Albert Sarraut et en France, il a contribué à organiser les premiers mouvements constitutionnalistes, recherchant davantage de droits politiques et d'opportunités économiques pour les classes supérieures vietnamiennes grâce à la coopération avec les Français. Ancien co-dirigeant du Parti constitutionnaliste et fervent partisan de l'unité religieuse de Cao-Dai, Long entra plus tard dans le gouvernement de Bao-Dai en tant que premier Premier ministre de l'État du Vietnam, détenant simultanément le portefeuille de l'Intérieur. Homme politique modéré et pragmatique, il cherche à établir la légitimité du nouvel État par le biais de réformes administratives et d'accommodements avec la France."
 TRAN_QUANG_VINH_PM_DESC: "Un éminent dignitaire du Cao-Dai, organisateur militaire et homme politique nationaliste, le lieutenant-général Tran-Quang-Vinh, connu sous son nom religieux Thuong-Vinh-Thanh, a fondé les forces armées du Cao-Dai en 1943 et en a été le premier commandant en chef. Organisant initialement le mouvement paramilitaire de la secte sous la bannière du soutien au prince Cuong-De, il dirigea sa coopération avec les forces japonaises lors du coup d'État de mars 1945 contre les Français et devint plus tard un représentant des intérêts de Cao-Dai au sein de la coalition Viet-Minh. Après la création de l'État du Vietnam, il entre au gouvernement en tant que ministre de la Défense sous Nguyen-Van-Xuan. Grâce à un récent règlement politique, Vinh est devenu le premier Premier ministre de l'État du Vietnam et cherche à concilier l'autonomie de Cao-Dai, l'autorité religieuse et le nationalisme vietnamien au sein d'un gouvernement national unifié."
 TRAN_VAN_HUU_DESC: "Riche propriétaire terrien cochinchinois devenu homme d'État, Tran-Van-Huu est un ingénieur agronome formé en France et un ardent défenseur de l'autonomie administrative vietnamienne et de l'alignement occidental. Après avoir été vice-Premier ministre, il s'est efforcé d'élargir la participation vietnamienne au gouvernement, d'améliorer le moral de la fonction publique et de réduire la dépendance de l'administration à l'égard des responsables français. Architecte clé du développement initial de l'Armée nationale vietnamienne, il a soutenu la création de son état-major général, la formation d'officiers vietnamiens et l'armement des forces sectaires alliées, notamment les Cao-Dai, Hoa-Hao, les milices catholiques et Binh-Xuyen. Fervent homme politique pro-américain et pro-occidental, Huu cherche désormais à renforcer l'État du Vietnam en tant que gouvernement anticommuniste crédible tout en obtenant un plus grand soutien international et une plus grande indépendance vis-à-vis de l'influence française."
 NGUYEN_VAN_XUAN_DESC: "Officier et homme d'État franco-vietnamien distingué, Nguyen-Van-Xuan a gravi les échelons de l'armée française pour devenir le premier officier vietnamien à atteindre le grade de général. Officier d'artillerie vétéran de la Première Guerre mondiale et diplômé de l'École Polytechnique, il devient un intermédiaire clé dans les négociations qui amènent Bao-Dai au règlement politique avec la France. Nommé général de division en 1947, il fut Premier ministre de la République autonome de Cochinchine avant de diriger le gouvernement provisoire de l'État du Vietnam. Actuellement vice-Premier ministre, Xuan représente l'establishment militaire et administratif formé en France, cherchant à construire un État vietnamien viable tout en préservant ses relations avec l'Union française."
 NGUYEN_BAO_TOAN_DESC: "Choix très inattendu et controversé pour le poste de Premier ministre, Nguyen-Bao-Toan est un nationaliste catholique, social-démocrate et secrétaire général du Parti socialiste démocratique du Vietnam (Dan-Xa-Dang), dont l'influence politique repose en grande partie sur ses liens étroits avec le mouvement bouddhiste Hoa-Hao. Anticolonialiste engagé, il fut emprisonné et exilé à Con-Dao par les Français pour ses activités révolutionnaires, mais devint plus tard l'un des principaux défenseurs d'un gouvernement national vietnamien uni sous Bao-Dai. Malgré ses origines catholiques, Toan bénéficie d'un soutien considérable parmi les adeptes du bouddhisme Hoa-Hao, ayant été nommé chef du parti par le prophète Huynh-Phu-So lui-même. Sa nomination représente la tentative désespérée de Bao-Dai d'apaiser les Hoa-Hao, d'élargir la base populaire du gouvernement et de contenir l'opposition sectaire, même au prix de s'aliéner les Français. Fervent opposant au maintien de la domination française, Toan aspire à un Vietnam révolutionnaire véritablement indépendant, fondé sur les principes sociaux-démocrates bouddhiques et l'unité nationale."
 NGUYEN_VAN_TAM_DESC: "Connu sous le nom de « vieux tigre de Cai-Lay », Nguyen-Van-Tam est un administrateur anticommuniste pur et dur et membre de la Section française de l'Internationale ouvrière (SFIO), dont la réputation s'est forgée grâce à la répression brutale du soulèvement de Nam-Ky en 1940-1941. Ancien chef de district, directeur de la police et ministre de la Sécurité, il a construit sa carrière grâce à une coopération étroite avec les autorités françaises et une approche sans compromis des mouvements communistes. Parlant couramment le français et expérimenté dans l'administration coloniale, Tam est devenu Premier ministre sous Bao-Dai, réunissant un gouvernement de coalition avec le Parti nationaliste vietnamien (Viet-Quoc) dans le but d'élargir ses références nationalistes tout en renforçant ses fondations anticommunistes. Personnage sévère et autoritaire, il donne la priorité à la sécurité intérieure, à l'ordre politique et à la consolidation de l'État vietnamien, même si sa dépendance à l'égard du soutien français reste une source de controverse."
 DINH_XUAN_QUANG_DESC: "Juriste respecté, nationaliste catholique et défenseur de la réforme constitutionnelle, Dinh-Xuan-Quang est sorti de l'establishment juridique en tant que partisan de l'indépendance vietnamienne par la négociation démocratique plutôt que par le régime colonial ou la révolution communiste. L'un des premiers diplômés vietnamiens de la Faculté de droit de Hanoï, il se bâtit une réputation de magistrat incorruptible et participa aux négociations qui aboutirent aux accords de l'Élysée de 1949 et à la réunification de la Cochinchine avec l'État du Vietnam. Dans ce règlement politique alternatif, Quang a accédé au poste de Premier ministre en tant que leader civil réformateur, cherchant à renforcer la légitimité populaire du gouvernement grâce à une meilleure protection du travail, des salaires plus élevés, des conditions de travail plus équitables et une vaste campagne contre la corruption administrative. Estimant que l'indépendance nationale doit s'accompagner de justice sociale, il vise à impliquer les travailleurs ordinaires et la population dans son ensemble dans la vie politique du nouvel État."
 NGUYEN_PHUC_BUU_LOC_DESC: "Membre de la dynastie impériale Nguyen et lointain descendant de l'empereur Minh-Mang, le prince Nguyen-Phuc-Buu-Loc est un juriste de formation française et un diplomate expérimenté qui allie prestige royal et expérience en affaires internationales. Ancien chef d'état-major de Bao-Dai, il a ensuite représenté l'État du Vietnam à l'Assemblée générale des Nations Unies et en a été le haut-commissaire en France, tout en présidant l'Association royale à Paris. Nommé ministre de l'Intérieur avant de devenir Premier ministre en janvier 1954, Buu-Loc représente l'establishment monarchiste et diplomatique entourant le chef de l'État. Son mandat vise à renforcer la légitimité de l'État vietnamien grâce à la continuité dynastique, à la reconnaissance internationale et à une coordination plus étroite entre la cour royale et l'administration nationale."
 HOANG_NAM_HUNG_DESC: "Révolutionnaire chevronné, soldat et nationaliste vietnamien, Hoang-Nam-Hung a passé une grande partie de sa vie en exil, se consacrant à la restauration de l'indépendance vietnamienne. Né au Tonkin en 1888, il s'installe en Chine en 1917, où il suit une formation militaire aux côtés des futurs responsables du gouvernement nationaliste chinois, pour finalement atteindre le grade de major-général dans l'Armée nationale révolutionnaire chinoise. Proche collaborateur du prince en exil Cuong-de, Hung a contribué à la création du Parti nationaliste vietnamien à Canton en 1931, en tant que vice-président avant de devenir secrétaire général du Viet-Nam Phuc-Quoc Dong-minh-Hoi en 1933. Après des décennies d'activité politique à travers la Chine, Formose et le Japon, il fut envoyé à Hong Kong en 1947 pour assurer la liaison avec Bao-Dai au nom du mouvement nationaliste. Après l'ascension de Cuong De au trône en tant qu'empereur Nam-Hung, Hung est revenu sur le devant de la scène politique, remportant le premier poste de Premier ministre de l'État populaire du Vietnam lors de ses élections inaugurales. Aujourd'hui premier Premier ministre de l'empire, il fait face à la tâche formidable de traduire des décennies de nationalisme révolutionnaire en un gouvernement fonctionnel, de consolider l'autorité du nouvel État et d'assurer l'indépendance du Vietnam au milieu des pressions concurrentes du colonialisme français et du communisme."
 NGUYEN_RINH_NHIEP_DESC: "Révolutionnaire de toujours et disciple dévoué du prince Cuong-De, Nguyen-Rinh-Nhiep a passé des décennies en exil à travers le Japon et la Chine, travaillant au sein des mouvements Dong-Du et Viet-Nam Phuc-Quoc Dong-Minh-Hoi. En tant que lieutenant de confiance de Cuong-De et organisateur politique en chef, Nhiep dirigeait les réseaux secrets du mouvement, entretenait des liaisons avec les partisans pan-asiatiques à Tokyo et supervisait l'appareil administratif de la Ligue Phuc-Quoc après la restauration de 1949. Chargé du poste de Premier ministre de l'État populaire du Vietnam en tant que successeur choisi par l'empereur Nam-Hung, Nhiep représente l'establishment loyaliste orthodoxe de Dan-Vuong. En se tournant vers Hué et Tokyo plutôt que vers Paris ou Washington, il cherche à institutionnaliser le Phuc-Quoc-Hoi en tant que parti au pouvoir discipliné, à reconstruire la capitale impériale de Phu-Xuan, à approfondir les liens avec le Japon et à préserver la vision du défunt empereur d'une monarchie populaire moderne."
 TRAN_QUANG_VINH_CD_DESC: "Un éminent dignitaire du Cao-Dai, organisateur militaire et homme politique nationaliste, le maréchal Tran-Quang-Vinh, connu sous son nom religieux Thuong-Vinh-Thanh, a fondé les forces armées du Cao-Dai en 1943 et en a été le premier commandant en chef. Organisant initialement le mouvement paramilitaire de la secte sous la bannière du soutien au prince Cuong-De, il dirigea sa coopération avec les forces japonaises lors du coup d'État de mars 1945 contre les Français et devint plus tard un pilier du Viet-Nam Phuc-Quoc Dong-Minh-Hoi. Après l'ascension de Cuong-De sur le trône en tant qu'empereur Nam-Hung, Vinh fut le principal commandant militaire de l'empire et le pont entre la cour impériale de Phu-Xuan et le Saint-Siège de Tay-Ninh. Désormais élevé au poste de Premier ministre de l'État populaire du Vietnam à la tête d'une coalition Phuc-Quoc et Cao-Dai, il cherche à unir les diverses communautés religieuses du pays, à intégrer les milices sectaires dans une armée nationale unifiée et à défendre l'ordre Dan-Vuong contre les vestiges coloniaux et l'insurrection communiste."

 # === Autonomous Territories Leaders ===
 VONG_A_SANG_DESC: "Officier militaire Hakka d'origine chinoise et chef suprême du territoire autonome Nung de Hai-Ninh, Vong-A-Sang s'est fait connaître grâce à son service militaire aux côtés des Français dans le nord-est du Tonkin. Originaire du village de Hoang-Lan-Ba dans le comté de Fangcheng, Guangxi, il a rejoint les forces françaises qui se retiraient en Chine à la suite du coup d'État japonais du 9 mars 1945, menant un groupe de partisans Nung et chinois en sécurité dans les zones frontalières. Son service lui valut d'être promu capitaine le 1er juin 1945, et il participa par la suite à l'expédition française pour reconquérir Hai-Ninh, aidant à la reconquête de Mong-Cai en mars 1947. Le 14 juillet 1948, représentant le Conseil militaire de Hai-Ninh, il proclama la création du territoire autonome de Nung sous protection française et en devint le chef suprême trois jours plus tard."
 DEO_VAN_LONG_DESC: "L'aristocrate héréditaire des Tai blancs et chef suprême des Sip-Song-Chau-Tai, Deo-Van-Long, est l'autorité féodale dominante du nord-ouest du Vietnam et est largement considéré comme le « roi des Tai ». Succédant à son père et à son frère aîné, il consolida son contrôle sur les douze cantons Tai et obtint la reconnaissance française comme leur principal dirigeant, devenant finalement président de la Fédération autonome Tai sous l'Union française en 1948. Maintenant son autorité grâce à des réseaux aristocratiques héréditaires, des prélèvements locaux et une étroite coopération avec les autorités coloniales françaises, Long exerce une autonomie politique, économique et militaire considérable par rapport à Lai-Chau. Son immense richesse personnelle, accumulée en partie grâce à son rôle d'intermédiaire dans le commerce régional de l'opium, renforce encore son influence sur les hauts plateaux. Fervent défenseur des privilèges aristocratiques Tai, il cherche à préserver l'ordre ancien traditionnel de la fédération et ses relations privilégiées avec les Français."
 MONTAGNARD_CHIEFTAINS_DESC: "Les chefs montagnards traditionnels gouvernent collectivement les communautés autochtones du Pays montagnard du sud de l'Indochine, une circonscription administrative spéciale établie sous l'autorité coloniale française et administrée par l'intermédiaire de délégués français responsables devant l'Union française. Plutôt que d'imposer une administration directe à chaque communauté des hautes terres, les autorités coloniales s'appuient sur des chefs de tribu loyaux, des chefs de village héréditaires et des institutions coutumières pour maintenir l'ordre et arbitrer les relations avec le gouvernement des basses terres. Leur autorité s'étend cependant au-delà de l'administration politique, exigeant la reconnaissance des territoires sacrés et des frontières spirituelles maintenues par des personnalités religieuses influentes, en particulier le Jarai Potao Apui (roi du feu), Potao Ia (roi de l'eau) et Potao Angin (roi du vent). Même si aucun d'eux ne détient la souveraineté politique conventionnelle, ces maîtres rituels exercent une influence spirituelle considérable et leurs traditions restent essentielles à la légitimité de la gouvernance des hautes terres. Cet arrangement préserve un équilibre fragile entre l'autorité autochtone, le droit coutumier, les institutions spirituelles et la tutelle coloniale française."
 HOI_DONG_LANH_THO_THO_DESC: "Conseil territorial dirigeant du territoire autonome de Tho, le Hoi-Dong-Lanh-Tho-Tho est la principale institution représentative et législative des communautés Tay locales. Opérant aux côtés des autorités administratives traditionnelles, notamment Tri-Chau, Tri-Truong et des conseils d'administration locaux, le conseil supervise les affaires territoriales, les réglementations coutumières et les intérêts de la population Tho. Tout en restant soumis aux lois générales et à la souveraineté du Vietnam, il préserve un certain degré d'autonomie locale grâce à la reconnaissance des coutumes autochtones, des dirigeants traditionnels et de la représentation communautaire."
 MUONG_CHANH_QUAN_LANG_DESC: "Chef héréditaire du territoire autonome de Muong, les Chanh-Quan-Lang se dressent au sommet de l'aristocratie traditionnelle des Muong, exerçant leur autorité à travers des générations de lignées nobles établies entre les 4 familles : Dinh-Cong, Quach, Bach et Ha. Issu des puissantes familles Quan-Lang de Hoa-Binh, le bureau commande l'allégeance des subordonnés Quan-Lang, Lang-Cun, Lang-Tao et des autorités villageoises locales, préservant ainsi la hiérarchie traditionnelle de la société Muong. Initialement reconnu sous l'administration coloniale française comme le principal intermédiaire entre la population Muong et les autorités du protectorat, le Chanh-Quan-Lang exerce une influence considérable sur la gouvernance locale, le droit coutumier et les affaires communales, tout en restant formellement subordonné au résident français. Sa position incarne l'équilibre précaire entre l'autonomie héréditaire des Muong et la surveillance coloniale."

 # === Relations ===
 VIE_French_Yes_Man_modifier: "Nommé Yes-Men pro-français"
 VIE_French_Bureaucrat_modifier: "Nommé bureaucrates français"
 VIE_French_Investments_modifier: "Investissements français reçus"
 VIE_Disjointed_Army: "Armée décousue"
 VIE_Disjointed_Army_desc: "Les purges militaires ont laissé nos forces armées dans le désarroi. Avec le retrait d'officiers clés et la perturbation des structures de commandement, notre armée peine à maintenir sa cohésion et son efficacité."
 VIE_AnNinh_QuocGia: "An-Ninh Quoc-Gia"
 VIE_AnNinh_QuocGia_desc: "L'appareil de sécurité nationale a été renforcé pour maintenir l'ordre et réprimer la dissidence. Même si cela garantit la stabilité, cela se fait au détriment des libertés civiles."
 VIE_Censor_French: "Censure française"
 VIE_Censor_French_desc: "Les autorités françaises ont imposé une censure stricte aux médias et aux publications. Tout contenu doit être approuvé par les autorités françaises, ce qui limite considérablement la liberté d'expression et de discours politique."
 VIE_Repress: "Répression"
 VIE_Repress_desc: "Le gouvernement a mis en oeuvre des mesures répressives sévères contre les groupes d'opposition et les dissidents. Même si cela maintient l'ordre, cela a aliéné de nombreux segments de la population et réduit le soutien populaire au service militaire."
