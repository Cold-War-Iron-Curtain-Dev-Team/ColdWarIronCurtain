 VIE_geneva_settlement_lost_trigger_TT: "§YLes Accords de Genève ont été signés aux conditions de Hanoï§! - le Nord a pris la meilleure ligne, ou la guerre s'est déroulée contre nous lorsque les puissances se sont assises"
 VIE_geneva_settlement_otl_trigger_TT: "§YLes Accords de Genève ont été signés§! - Le Vietnam reste divisé, aucune des deux capitales ne sortant de Genève en tête"
