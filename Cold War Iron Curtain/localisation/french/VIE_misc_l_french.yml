 # === Leader Traits ===
 BaoDai_Loyalist: "Loyaliste Bao-Dai"
 BaoDai_Loyalist_desc: "Ce général est fidèle à Bao-Dai et à sa légitimité en tant qu'ancien empereur du Vietnam, estimant que la stabilité du Vietnam dépend du leadership de l'empereur. Il défendra résolument l'État du Vietnam contre toutes les menaces."
 BinhXuyen_Member: "Membre Binh-Xuyen"
 BinhXuyen_Member_desc: "Ce général est fidèle au syndicat Binh-Xuyen, embrassant les orientations de Le-van-Vien d'autonomie militarisée et de contrôle économique. Il valorise le pouvoir, l'influence et l'indépendance des forces Binh-Xuyen vis-à-vis du contrôle de l'État."
 CaoDai_Member: "Membre Cao-Dai"
 CaoDai_Member_desc: "Ce général est un fervent adepte du Cao-Daoïsme, déterminé à défendre sa vision théocratique et à veiller à ce que l'influence politique et militaire de Cao-Dai reste forte au Vietnam."
 CuongDe_Comrade: "Camarade de Cuong-De"
 CuongDe_Comrade_desc: "Ce général est fidèle à l'empereur Nam-Hung et à son idéologie de la monarchie Dan-Vuong, mêlant tridémisme et socialisme pour créer un Vietnam modernisé mais traditionnel, libre de toute domination coloniale."
 DaiViet_Party_Member: "Membre du Dai-Viet"
 DaiViet_Party_Member_desc: "Ce général suit le Parti Dai-Viet, dédié à une vision de l'ultranationalisme du Grand Vietnam, de l'anticommunisme et de la gouvernance centralisée. Il est attaché à un État vietnamien fort sous une direction nationaliste."
 Diem_Comrade: "Camarade de Diem"
 Diem_Comrade_desc: "Ce général est fidèle à Ngo-Dinh-Diem et à son idéologie du personnalisme oriental modéré, croyant fermement à la vision communiste antimatérialiste et personnaliste socialiste de Diem pour un Vietnam indépendant."
 French_Indochina_Member: "Loyaliste franco-indochinois"
 French_Indochina_Member_desc: "Ce général est un partisan de l'Indochine française, plaidant pour le maintien de l'influence française et estimant que l'avenir du Vietnam est mieux assuré par la coopération avec l'administration coloniale française."
 HoaHao_Member: "Membre Hoa-Hao"
 HoaHao_Member_desc: "Ce général est un fervent bouddhiste Hoa-Hao, déterminé à protéger l'autonomie de sa secte et à garantir que les communautés Hoa-Hao restent indépendantes de l'autorité centrale."
 Nhu_Comrade: "Camarade de Nhu"
 Nhu_Comrade_desc: "Ce général suit Ngo-dinh-Nhu et son idéologie de la théorie de la dignité de la personne, un marxisme spiritualiste qui promeut les croisades anti-matérialistes, les hameaux stratégiquement et la mobilisation idéologique de masse."
 NRM_Member: "Membre du Mouvement Révolutionnaire National"
 NRM_Member_desc: "Ce général est un membre engagé du Mouvement révolutionnaire national (NRM), luttant pour la suprématie politique et idéologique de Ngo-dinh-Diem grâce à un contrôle discipliné du parti et à une mobilisation populaire."
 PhatDiem_Member: "Membre Phat-Diem"
 PhatDiem_Member_desc: "Ce général est un chef de milice catholique fidèle au diocèse de Phat-Diem, dédié à la défense des communautés chrétiennes du Vietnam contre les factions communistes et bouddhistes."
 Pro_QuocGia: "Loyaliste de Quoc-Gia"
 Pro_QuocGia_desc: "Ce général est un fervent partisan de la cause Quoc-gia, plaidant pour un État militarisé, anticommuniste et nationaliste, indépendant de toute influence étrangère."
 Pro_Vietminh: "Sympathisant du Viet-Minh"
 Pro_Vietminh_desc: "Ce général est un révolutionnaire communiste dévoué, engagé dans la lutte marxiste-léniniste et dans l'expulsion complète des forces impérialistes et réactionnaires du Vietnam."
 UMDC_Member: "Membre de l'UMDC"
 UMDC_Member_desc: "Ce général est un membre radical de l'Union Militaire du Christ (UMDC), un paramilitaire chrétien extrémiste dirigé par Jean Leroy, connu pour sa répression brutale des non-chrétiens au Vietnam."
 VIE_Pro_America: "Sympathisant américain"
 VIE_Pro_America_desc: "Ce général est aligné sur les intérêts américains, croyant fermement dans l'anticommunisme, la démocratie et le soutien militaire occidental comme la clé pour assurer l'avenir du Vietnam."
 VIE_Pro_France: "Sympathisant français"
 VIE_Pro_France_desc: "Ce général reste fidèle à la France, plaidant pour une présence coloniale continue ou un partenariat franco-vietnamien pour maintenir l'ordre et la stabilité."
 VIE_Pro_ROC: "Sympathisant du Kuomintang"
 VIE_Pro_ROC_desc: "Ce général soutient la République de Chine (Taiwan), estimant que la survie du Vietnam dépend des alliances avec Chiang Kai-shek et des forces chinoises anticommunistes contre le Viet Minh."
 VietCong_Spy: "Espion Viet-Cong"
 VietCong_Spy_desc: "Ce général est un agent secret du Viet Minh, travaillant secrètement à saper les forces coloniales et réactionnaires de l'intérieur. Tout en conservant une façade de loyauté, il se consacre à la révolution marxiste-léniniste et sabotera les opérations ennemies, divulguera des renseignements et soutiendra les soulèvements communistes le moment venu."
 french_defector: "Transfuge français"
 french_defector_desc: "Ce général a servi dans l'armée coloniale française avant de faire défection pour la cause nationaliste vietnamienne. Sa connaissance approfondie des tactiques, équipements et structures de commandement français lui confère un aperçu unique et précieux du champ de bataille."
 french_trainee: "Stagiaire français"
 french_trainee_desc: "Ce général a reçu son éducation et sa formation militaires auprès d'officiers coloniaux français. Sa doctrine et ses instincts sur le champ de bataille portent la marque indubitable de la tradition militaire française."
 french_trainee_navy: "Stagiaire français"
 french_trainee_navy_desc: "Cet officier de marine a reçu sa formation auprès des officiers de marine coloniale française. Sa connaissance de la doctrine navale française et du matelotage a été inestimable dans la construction de la force maritime naissante du Vietnam."
 ww2_veteran: "Vétéran de la Seconde Guerre mondiale"
 ww2_veteran_desc: "Ce général a combattu pendant la Seconde Guerre mondiale et a acquis une expérience durement acquise dans le conflit le plus destructeur de l'histoire. Les leçons de la guerre interarmes, de la logistique et du commandement sous pression ont fait de lui un commandant aguerri."
 ww1_veteran: "Vétéran de la Première Guerre mondiale"
 ww1_veteran_desc: "Ce général est un vétéran de la Grande Guerre, dont la guerre de tranchées brutale lui a forgé une détermination de fer et une compréhension sombre et pratique des coûts de la guerre moderne. Bien qu'avançant au fil des années, son expérience reste inestimable."
 self_taught: "Autodidacte"
 self_taught_desc: "Ce général a accédé au commandement non pas grâce à une académie militaire formelle, mais grâce à ses capacités brutes, son instinct sur le champ de bataille et sa volonté insatiable d'apprendre de chaque engagement. Son approche peu orthodoxe constitue souvent un avantage là où la doctrine conventionnelle échoue."
 voBi_trainee: "Stagiaire Vo-Bi"
 voBi_trainee_desc: "Ce général est diplômé de l'académie militaire Vo-Bi, formé à la tradition militaire vietnamienne et à la doctrine nationaliste. Son éducation lui a inculqué à la fois une discipline professionnelle et un profond engagement envers la cause de l'indépendance vietnamienne."
 voBi_trainee_navy: "Stagiaire Vo-Bi"
 voBi_trainee_navy_desc: "Cet officier de marine a été formé au programme naval de l'académie Vo-Bi, alliant la tradition militaire vietnamienne aux exigences de la guerre maritime moderne. Sa loyauté envers la marine nationale reflète l'influence durable de l'institution."
 roc_trainee: "Stagiaire du Kuomintang"
 roc_trainee_desc: "Ce général a reçu une formation militaire de la République de Chine, absorbant les tactiques et les doctrines de l'armée du Kuomintang. Sa formation lui a donné une vision du monde anticommuniste façonnée par l'expérience brutale de la guerre civile chinoise."
 eastern_bloc_trainee: "Stagiaire du Bloc de l'Est"
 eastern_bloc_trainee_desc: "Ce général a été formé par des conseillers militaires soviétiques ou du bloc de l'Est, recevant un enseignement sur la doctrine militaire marxiste-léniniste et sur les tactiques de style soviétique. Sa connaissance des méthodes du bloc de l'Est est un atout à double tranchant dans ce conflit chargé idéologiquement."
 political_commissar: "Commissaire politique"
 political_commissar_desc: "Cet officier fait office de commissaire politique, responsable de la discipline idéologique et du moral au sein des unités militaires. Il veille à ce que les soldats restent fidèles à la ligne du parti et à ce que la doctrine politique façonne tous les aspects de l'organisation militaire."
 quocGia_sympathizer: "Sympathisant Quoc-Gia"
 quocGia_sympathizer_desc: "Ce général sympathise discrètement avec la cause nationaliste Quoc-Gia, soutenant la vision d'un Vietnam fort et indépendant, libre de la subversion communiste et de la domination étrangère, sans pour autant parvenir à un engagement total."
 quocGia_loyalist: "Loyaliste de Quoc-Gia"
 quocGia_loyalist_desc: "Nationaliste Quoc-Gia engagé, ce général se consacre pleinement à la vision d'un Vietnam souverain et anticommuniste. Sa loyauté envers le mouvement nationaliste détermine chacune de ses décisions, sur et en dehors du champ de bataille."
 vietminh_sympathizer: "Sympathisant du Vietminh"
 vietminh_sympathizer_desc: "Ce général sympathise en privé avec la cause du Viet Minh, considérant leur lutte armée comme la voie la plus véritable vers l'indépendance du Vietnam de la domination coloniale, bien qu'il ne se soit pas encore ouvertement engagé en faveur de leur mouvement."
 vietminh_loyalist: "Loyaliste vietnamien"
 vietminh_loyalist_desc: "Ce général est secrètement un agent fidèle du Viet Minh, oeuvrant pour saper de l'intérieur l'effort de guerre nationaliste. Masquant sa véritable allégeance derrière une façade de coopération, il trahira ses opérations et divulguera des renseignements chaque fois que l'occasion se présentera."
 irregular_officer: "Officier irrégulier"
 irregular_officer_desc: "Ce général a gravi les échelons en dehors des académies militaires traditionnelles, émergeant souvent de la guérilla, des groupes paramilitaires ou des milices locales. Manquant de formation formelle, il s'appuie sur des tactiques non conventionnelles, une expérience du champ de bataille et une capacité d'adaptation pour déjouer ses ennemis."
 Hirohito_Inheritor: "L'héritier de Hirohito et Sun-et-Sen"
 Pan-asian_Revolutionary: "Révolutionnaire panasiatique chevronné"
 Strength_of_South: "Force du Sud"

 # === GUI ===
 activate_sect_menu_tt: "Nous avons débloqué un nouveau menu GUI §Y§! pour gérer et traiter les différentes sectes"

 TITLE_TOOLTIP: "Les luttes de pouvoir entre les principales « troisièmes forces » dans les conflits auxquels le Vietnam est confronté jouent un rôle majeur dans l'évolution du pays. En faisant pression sur ces organisations, ces entités criminelles et ces sectes et institutions religieuses ou en les mettant à rude épreuve, il faut maintenir un équilibre - ou une organisation doit prendre le dessus."
 LOYALTY_TT: "§YNiveau de fidélité§!\n\nL'allégeance du groupe à notre gouvernement et la probabilité qu'il nous aide dans nos causes."
 ANNIHILATION_TT: "§YProgrès de l'annihilation§!\n\nLes progrès dans nos efforts pour détruire l'efficacité et la portée du groupe donné."
 UMDC_TITLE: "Unités Mobiles Pour La Défense Des Chrétiens (UMDC)"
 UMDC_DESC: "Parmi les nombreuses milices catholiques importantes de la région, l'UMDC constitue le groupe le plus puissant. Dirigés par Jean Leroy, ils ont pris le contrôle de vastes étendues du sud du pays, faisant des ravages dans les mouvements de résistance de la région et massacrant de nombreux civils non chrétiens."
 BINH_XUYEN_TITLE: "Binh-Xuyen"
 BINH_XUYEN_DESC: "Les Binh-Xuyen se sont révélés être la troisième force la plus dangereuse, la plus insidieuse et la plus inquiétante à laquelle nous ayons eu affaire dans cette lutte. Force militaire voyou qui se consacre à l'éradication du communisme, ses commandants ont eu recours à des opérations comme un syndicat criminel ; ils font le commerce de l'opium, exploitent des casinos et extorquent la population pour financer leur guerre privée. Même s'ils pourraient être de puissants alliés, ils sont\npour l'instant une menace dangereuse pour la paix."
 CAO_DAI_TITLE: "Cao-Daï"
 CAO_DAI_DESC: "Le Dai-Dao Tam-Ky Pho-Do (La Grande Voie de la Troisième Rédemption Universelle) est une nouvelle religion syncrétique formée en 1926 qui est rapidement devenue une partie importante de la culture vietnamienne au cours des dernières années. Les adeptes prêchent un système de croyance monothéiste syncrétisé qui combine la culture populaire locale, le bouddhisme, le taoïsme, le taoïsme et le catholicisme romain avec une politique de non-violence et de \nle végétarisme."
 HOA_HAO_TITLE: "Bouddhisme Hoa-Hao"
 HOA_HAO_DESC: "Malgré leurs origines en tant que secte bouddhiste locale vénérant un « Bouddha » autoproclamé, les Huynh-Phu-So syncrétisent des éléments de la doctrine confucianiste et des pratiques folkloriques vietnamiennes, les Hoa-Hao se sont transformés en un groupe militant violent occupant la plupart des provinces du sud, n'étant fidèle à aucun gouvernement, Saigon ou Hanoi. Les maintenir en ligne est peut-être aussi difficile que \ngagner leur acceptation."
 HARMONISM_TITLE: "Hoa-Dong Ton-Giao (Harmonisme)"
 HARMONISM_DESC: "Le groupe le plus curieux dans cette lutte pour le pouvoir est peut-être celui de la religion « noix de coco » de Thich-Hoa-Binh (Ong Dao-dua), une niche croissante qui souscrit à un grand nombre de religions synthétisées, dont le christianisme et le bouddhisme. Personnalité politique qui a utilisé les actions de son groupe pour protester contre la guerre, malgré le caractère bizarre du groupe, nous avons tendance à le traiter comme une figure \nde statut et d'importance."
 TRINH_MINH_THE_TITLE: "Dossier Seigneur de Guerre : Trinh-Minh-The"
 TRINH_MINH_THE_DESC: "Formé par les Japonais et servant comme soldat de carrière, The est peut-être le visage du mouvement Cao-Dai. Considéré comme un possible rival du gouvernement de Saigon, il a joué un rôle déterminant dans la lutte contre les efforts coloniaux français. Il est à la fois compétent et dangereux.\n\nBase d'opérations : Tay Ninh"
 LE_VAN_VIEN_TITLE: "Dossier Warlord : Le-Van-Vien"
 LE_VAN_VIEN_DESC: "Le général de division Le-Van-Vien a eu une carrière longue et incroyable, de révolutionnaire au Viet-Minh à collaborateur puis leader du Binh-Xuyen, s'engageant dans des stratagèmes de racket et de corruption sous couvert de « fonctions de police pour le gouvernement ».\n\nBase d'opérations : Long An"
 JEAN_LEROY_TITLE: "Dossier Seigneur de Guerre : Jean Leroy"
 JEAN_LEROY_DESC: "Homme brutal, Leroy a conduit l'UMDC et nombre de ses forces catholiques à la violence politique contre le gouvernement et les autres partis révolutionnaires. Il a une haine profonde pour beaucoup de choses progressistes et est considéré comme un boucher et un meurtrier dans sa croisade pour protéger les communautés religieuses de son propre fief, ce qui a fait de lui une cible dans les communautés.\n\nBase d'opérations : Kien Hoa"
 TRAN_VAN_SOAI_TITLE: "Dossier du seigneur de guerre : Tran-Van-Soai"
 TRAN_VAN_SOAI_DESC: "Commandant en chef des Hoa-Hao, Tran Van Soai a connu une carrière similaire à celle d'Ho Chi Minh, occupant plusieurs postes avant de se reconvertir et de devenir une présence militaire pendant la Seconde Guerre mondiale. Ses méthodes sont brutales, mais son message et ses tactiques de combat font de lui une présence meurtrière dans la région.\n\nBase d'opérations : Ba Xuyen"
 BA_CUT_TITLE: "Dossier Warlord : Ba-Cut"
 BA_CUT_DESC: "Irrégulière et cruelle, Ba-Cut est devenu un commandant efficace sur le terrain dans la région, mais sa brutalité contre les civils est devenue une nuisance constante pour le gouvernement de Saigon. Certains au sein du gouvernement se demandent si ses efforts contre les communistes compensent réellement le bain de sang qui a suivi.\n\nBase d'opérations : An Giang"
 NGUYEN_GIAC_NGO_TITLE: "Dossier Warlord : Nguyen-Giac-Ngo"
 NGUYEN_GIAC_NGO_DESC: "Gardien de l'ordre et ardent prédicateur, Nguyen-giac-Ngo est devenu l'un des chefs militaires les plus remarquables du mouvement Hoa-Hao. Contrairement à ses contemporains, il s'est montré plus pragmatique, coopératif avec le gouvernement et pourrait être un allié puissant et utile.\n\nBase d'opérations : Sa Dec"
 LAM_THANH_NGUYEN_TITLE: "Dossier du seigneur de guerre : Lam-Thanh-Nguyen"
 LAM_THANH_NGUYEN_DESC: "Éduqué à la guerre par les Français, Lam Thanh Nguyen est devenu une menace pour les efforts communistes dans la région, mais il est mieux connu comme guérisseur au sein de la secte et est devenu une sorte de figure de proue alternative du mouvement.\n\nBase d'opérations : Chau Doc"
 TRAN_QUANG_VINH_TITLE: "Dossier du seigneur de guerre : Tran-Quang-Vinh"
 TRAN_QUANG_VINH_DESC: "Ancien chef de guerre du mouvement Cao-dai et collaborateur de Cuong-De, Tran-quang-Vinh s'est révélé un allié précieux et un commandant fort, considéré comme moins une menace que son chef de file. Il a des liens avec les Japonais et en a souffert en termes de popularité.\n\nBase d'opérations : Tay Ninh"

