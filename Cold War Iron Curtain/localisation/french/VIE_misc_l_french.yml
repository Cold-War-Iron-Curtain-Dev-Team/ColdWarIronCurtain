 VIE_Emphasized_NamKy_desc: "Le gouvernement a promu une identité sud-vietnamienne (Nam-Ky) distincte, en mettant l'accent sur les différences régionales par rapport au Nord. Cette politique a réduit la résistance dans le Sud mais a approfondi la fracture avec le Nord du Vietnam."
