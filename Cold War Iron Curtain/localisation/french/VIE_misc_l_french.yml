 VIE_Emphasized_NamKy_NLF_desc: "L'accent mis par le gouvernement du Sud sur l'identité Nam-Ky a créé la confusion et la division au sein de nos rangs. De nombreux combattants remettent en question leur objectif lorsque l'ennemi promeut la même identité régionale que nous prétendons défendre."
