 # === Diem in the Cuong-De Route ===
 VIE_disorganized_land_ownership: "Propriété foncière désorganisée"
 VIE_disorganized_land_ownership_desc: "L'économie agraire du sud du Vietnam reste profondément inégalitaire après des décennies de régime colonial. De vastes domaines dominent le fertile delta du Mékong, avec environ 2,5 % des propriétaires possédant près de 45 % de toutes les terres agricoles, tandis que 73 % des petits exploitants ne se partagent qu'environ 15 %. Dans des provinces comme Bac Lieu, les inégalités sont encore plus graves, où une poignée de propriétaires fonciers contrôlent l'écrasante majorité des terres arables et où la plupart des paysans n'en possèdent aucune. De grandes plantations étrangères, notamment françaises comme le Domaine agricole de l'Ouest, continuent de contrôler des dizaines de milliers d'hectares. Cette concentration de la propriété foncière alimente la pauvreté rurale, les tensions sociales et les appels croissants à une réforme agraire globale."
