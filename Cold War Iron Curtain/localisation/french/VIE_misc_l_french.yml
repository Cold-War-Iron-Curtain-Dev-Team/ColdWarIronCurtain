 pol_desc_chanh_quyen_quoc_gia: "En l'absence de Premier ministre, les affaires du gouvernement reviennent aux secrétaires permanents et aux chefs de département, qui continuent de signer ce qui doit l'être sous le nom collectif du gouvernement national.\n\nLe chef de l'État reste au-dessus et en dehors du dispositif. Il nomme, et jusqu'à ce qu'il nomme, c'est ce qui gouverne.\n\nAucun ministère intérimaire n'a jamais défini de politique à Saigon, et celui-ci ne le fera pas non plus. Son rôle est de faire tourner la machine jusqu'à ce que le palais choisisse un nom."

