 # === Border Settlement ===

 # --- Decision category ---
 VIE_Border_Settlement: "La question des frontières"

 # --- Decisions ---
 VIE_Border_Table_Demand: "Déposer une demande frontalière"
 VIE_Border_Table_Demand_desc: "Remettre une note officielle au gouvernement concerné, exposant notre titre historique sur la province et l'invitant à régler la question par accord. Ils préféreront peut-être garder la province.\n\n§YSvay Rieng§! peut être exigé immédiatement - cette revendication est valable depuis les accords de l'Elysée. §YTran-Ninh§! et §YHouaphanh§! exigent que nous insistions sur notre revendication historique sur Tran-Ninh. §YPhongsaly§! n'est discutable qu'une fois que Tran-Ninh est à nous et que nous en détenons les abords."
 VIE_Border_Provoke_Incidents: "Provoquer des incidents à la frontière"
 VIE_Border_Provoke_Incidents_desc: "Des patrouilles qui s'égarent. Des postes de douane qui bougent d'un kilomètre dans la nuit. Des villageois qui découvrent qu'ils paient les mauvais impôts du gouvernement. Rien de tout cela n'est de la guerre, tout cela n'est que de la pression. Plus ils en subiront les conséquences, plus ils auront de chances de venir à la table des négociations - et plus toute la frontière risque de prendre feu."
 VIE_Border_Renewed_Demand: "Renouveler la demande"
 VIE_Border_Renewed_Demand_desc: "Mettez cette note une seconde fois, à un gouvernement qui a passé des mois à voir ses postes frontières brûler. Les arguments n'ont pas changé. Leur appétit pour l'argumentation l'a fait."
 VIE_Border_Punitive_Clash: "Lancez un affrontement punitif"
 VIE_Border_Punitive_Clash_desc: "Envoyez l'armée en force traverser la ligne, prenez les districts contestés et présentez le règlement comme un fait. Ce n'est pas une guerre et personne ne la qualifiera de telle, mais des hommes en mourront et le monde regardera comment elle se terminera."
 VIE_Border_Fabricate_Frontier_Casus_Belli: "Fabriquer un casus belli de frontière"
 VIE_Border_Fabricate_Frontier_Casus_Belli_desc: "L'affrontement a échoué et la province leur appartient toujours. Il ne reste qu'un seul instrument : monter le dossier juridique, publier les atrocités et prendre la province dans une guerre que nous déclarons ouvertement. Washington et Paris auront tous deux leur mot à dire."
 VIE_Border_Renounce_Claims: "Renoncer à la réclamation"
 VIE_Border_Renounce_Claims_desc: "Retirez la note, abandonnez la réclamation et laissez la ligne rester là où les Français l'ont tracée. Nous gagnons un voisin qui nous parlera et perdons une dispute que nous n'étions jamais certains de gagner."

 # --- Trigger tooltips ---
 VIE_indochina_war_won_trigger_TT: "§YLa Première Guerre d'Indochine s'est terminée dans des conditions qui nous étaient favorables§! - le Nord a été absorbé, ou les accords ont été signés avec Saigon en position de force"
 VIE_can_press_border_claims_trigger_TT: "§YNous sommes un État souverain, en paix, avec la question des frontières ouverte§!"
 VIE_border_election_pending_block_tt: "§YAucun scrutin pan-vietnamien n'est en attente§! - nous n'ouvrirons pas de querelle de frontière avec l'État même auprès duquel nous nous apprêtons à aller aux urnes"
 VIE_border_target_not_french_subject_TT: "§YLe propriétaire n'est pas un sujet français§! - nous ne portons pas plainte contre les autres membres de l'Union"
 VIE_border_target_adjacent_TT: "§YLa province borde le territoire que nous possédons et contrôlons§!"
 VIE_border_tranninh_claimed_TT: "§YNous avons fait valoir notre revendication historique sur Tran-Ninh§!"
 VIE_border_clash_force_TT: "§YNos troupes occupent déjà la province, ou nous détenons un État limitrophe - le nôtre, exempt de combats frontaliers et doté d'au moins une division§! - à partir duquel monter l'opération"
 VIE_border_no_clash_tt: "§RAucun affrontement ne peut être organisé§! - nous avons besoin d'un État que nous possédons et contrôlons en bordure de la province, avec en garnison au moins une division"
 VIE_border_clash_running_tt: "§YAucune opération punitive n'est en cours§! - la question de la frontière attend que les tirs cessent"
 VIE_border_demand_pending_tt: "§YAucune note n'attend de réponse§! - nous ne présenterons pas deux exigences à deux gouvernements à la fois"
 VIE_frontier_gained_TT: "§YNous détenons au moins une des provinces frontalières contestées§!"

 # --- Effect tooltips ---
 VIE_border_demand_sent_tt: "§YUne note formelle est remise au gouvernement concerné§!, établissant notre titre sur la province. Leur réponse est attendue d'ici le mois ; si aucun ne vient, le silence sera lu comme un refus."
 VIE_border_incidents_begun_tt: "§YLa campagne frontalière dure 14 jours§!, après quoi la pression sur la province est évaluée et le commandement des frontières rapporte ce que cela nous a coûté."
 VIE_border_clash_launch_tt: "§YL'armée avance en force sur la province.§! Là où le terrain leur appartient encore, l'opération se déroule comme un affrontement frontalier ; là où se trouve déjà notre garnison, la province est simplement conservée. Quoi qu'il en soit, Saigon sera marqué comme agresseur régional §R§! et l'affaire augmentera la tension mondiale."
 VIE_border_cb_fabricated_tt: "§YLe procès est publié et un objectif de guerre est préparé contre le propriétaire de la province.§! Washington et Paris auront tous deux leur mot à dire."

 # --- World tension reasons ---
 VIE_border_clash_threat: "Opération punitive vietnamienne à la frontière"
 VIE_border_casus_belli_threat: "Les projets vietnamiens sur leurs voisins"

 # --- Ideas ---
 VIE_Regional_Aggressor: "Agresseur régional"
 VIE_Regional_Aggressor_desc: "Saigon a cessé de prétendre que ses revendications frontalières sont une question juridique. Les capitales d'Asie du Sud-Est l'ont remarqué, tout comme les puissances qui nous financent."
 VIE_Regional_Hegemon: "Maître de la frontière"
 VIE_Regional_Hegemon_desc: "Nous avons pris ce que nous disions être le nôtre et personne ne nous a arrêté. L'armée n'a jamais été aussi confiante et nos voisins n'ont jamais été aussi prudents."
 VIE_Chastened_Frontier: "Une frontière laissée seule"
 VIE_Chastened_Frontier_desc: "Les plaintes ont été abandonnées avant qu'elles ne coûtent la vie à quiconque. Cela se lit comme une faiblesse dans certains milieux et comme un sens politique dans d'autres, et les districts frontaliers sont calmes."
 VIE_Diem_Hinh_Already_Won_tt: "§RLe général Hinh détient déjà l'État§!"
 VIE_Diem_Hinh_Already_Settled_tt: "La question de l'état-major §Y§! est déjà réglée"
 VIE_Diem_Controls_Army_tt: "Le Premier ministre commande l'Armée nationale §Y§!"
 VIE_Diem_Cao_Dai_Settled_tt: "§RLa question Cao-Dai est déjà réglée§!"
 VIE_Diem_Hoa_Hao_Settled_tt: "§RLa question Hoa-Hao est déjà réglée§!"
 VIE_Diem_Binh_Xuyen_Settled_tt: "§RLa question Binh-Xuyen est déjà réglée§!"
 VIE_Referendum_Score_tt: "Compter le référendum contre la position du §Ypremier ministre§! et du §Ytrône§!, l'influence nationale §Y§!, la loyauté des §Ysectes§!, le contrôle de l'armée §Y§!, les §Yréfugiés§!, le §YComité national révolutionnaire§!et le soutien américain"
 VIE_Diem_Loyalist_Officer_Corps: "Corps des officiers loyalistes"
 VIE_Diem_Loyalist_Officer_Corps_desc: "Les hommes qui détenaient les commissions françaises sont partis, et ceux qui les ont remplacés doivent leur rang au premier ministre personnellement. L'armée est moins expérimentée qu'elle ne l'était et elle est bien plus sûre de savoir à qui elle obéit."

# === Diem premiership additions ===
 VIE_Hinh_Standoff_Adj_tt: "Ajustera l'entretoise §Cavec le général Hinh§! de [?hinh_standoff_change|Y+0]."
 VIE_DaiViet_Threat_Adj_tt: "Ajustera §CConspiration Dai-Viet§! de [?daiviet_threat_change|Y+0]."
 VIE_Hinh_Standoff_tt: "Notre position §Ycontre le général Hinh§! doit être §Gau-dessus de 24§! (actuellement §Y[?VIE_Hinh_Standoff|0]§!)"
 VIE_Hinh_Break_Requirement_tt: "Notre position §Ycontre le général Hinh§! doit être §Gau-dessus de 49§! (actuellement §Y[?VIE_Hinh_Standoff|0]§!)"
 VIE_DaiViet_Threat_Contained_tt: "§CLa conspiration Dai-Viet§! doit tomber §Gen dessous de§! §Y50§! (actuellement §Y[?VIE_DaiViet_Threat|0]§!)"
 VIE_binh_xuyen_revolt_tt: "Les §YBinh-Xuyen§! prennent les armes plutôt que d'être désarmés, et tiennent §YCholon§! et leur base en §YPhuoc Tuy§!"
 VIE_binh_xuyen_rung_sac_tt: "Les §YBinh-Xuyen§! sont chassés de Saigon et Cholon dans le §YRung-Sac§!, mais ils ne sont pas détruits"
 VIE_Diem_Binh_Xuyen_At_Rung_Sac_tt: "Le §YBinh-Xuyen§! doit avoir été §Yenfoncé dans le Rung-Sac§!"
 VIE_Diem_Crown_Domain_Gone_tt: "§RLe Domaine de la Couronne a déjà disparu§!"
 VIE_Diem_Sects_All_Settled_tt: "§RIl n'y a plus aucune secte à éliminer§!"
 VIE_Diem_Ba_Long_Cleared_tt: "§RLa zone de guerre de Ba-Long a déjà disparu§!"
 VIE_Diem_Throne_Already_Gone_tt: "§RIl n'y a plus de trône à désarmer§!"
 VIE_Diem_Immediate_Ballot_tt: "Le règlement a programmé le scrutin §Yimmédiatement§! - il sera compté bien avant juillet 1955, donc le refus ne peut pas attendre"
 VIE_Diem_No_North_To_Refuse_tt: "§RIl n'y a pas de gouvernement du Nord avec qui organiser un vote§!"
 VIE_50s_content_end_tt: "§GC'est pour l'instant la fin du contenu pour l'État du Vietnam. Merci d'avoir joué et restez à l'écoute sur notre Discord pour les mises à jour et les rapports de progression !§!"
 VIE_summary_republic_tt: "§YLa République du Vietnam§! a été proclamée et Ngo-Dinh-Diem en est le président"
 VIE_summary_junta_tt: "§YLe général Nguyen-Van-Hinh§! a pris l'État et Paris a conservé les ministères importants"
 VIE_summary_throne_tt: "§YBao-Dai§! reste chef de l'État et le poste de Premier ministre reste une porte tournante"
 VIE_summary_throne_confirmed_tt: "Le plébiscite d'octobre s'est tenu sans aucun candidat contre le trône et a confirmé Bao-Dai comme chef de l'État."
 VIE_summary_hinh_exiled_tt: "§YLe général Hinh§! a été brisé et est mort citoyen français à Paris"
 VIE_summary_hinh_bought_tt: "§YLe général Hinh§! a été acheté plutôt que battu, et l'armée n'a jamais vraiment été la nôtre"
 VIE_summary_can_lao_tt: "Le §YCan-Lao§! détient les ministères, le corps des officiers et les provinces"
 VIE_summary_hoang_dieu_tt: "Les §YBinh-Xuyen§! ont été chassés jusqu'à la destruction dans le Rung-Sac"
 VIE_summary_rung_sac_tt: "Les §YBinh-Xuyen§! détiennent toujours le Rung-Sac, et Le-Van-Vien a encore de l'argent"
 VIE_summary_ba_long_tt: "La zone de guerre §YDai-Viet à Ba-Long§! a été démantelée"
 VIE_summary_royal_guard_tt: "La §YGarde Royale§! a été abolie et intégrée à l'Armée Nationale"
 VIE_summary_decree_21_tt: "§YDu-So 21§! a mis fin au Domaine de la Couronne"
 VIE_summary_reject_geneva_tt: "Les élections §Yde réunification du Vietnam§! ont été publiquement refusées"
 VIE_Can_Lao_Party: "La fête Can-Lao"
 VIE_Can_Lao_Party_desc: "Le Parti révolutionnaire travailliste personnaliste recrute par cellules de cinq, sur invitation, et aucune cellule ne connaît les noms des autres. Il est présent dans les ministères et dans le corps des officiers bien avant d'être présent à toute élection, et il répond devant le frère du premier ministre."
 VIE_Caretaker_Cabinet: "Cabinet de gardien"
 VIE_Caretaker_Cabinet_desc: "Quinze des dix-huit ministres ont démissionné ensemble et n'ont pas été remplacés. Les commis ouvrent encore les ministères le matin ; rien n'y est décidé."
 VIE_Hinh_Coup_Attempt: "L'ambition du chef d'état-major"
 VIE_Hinh_Coup_Attempt_desc: "Le général Nguyen-Van-Hinh dispose de véhicules blindés aux portes du palais, d'un passeport français en poche et d'une offre permanente de se débarrasser du Premier ministre par téléphone. Le gouvernement ne peut pas le limoger ni l'ignorer. Il ne peut que construire une base suffisante - des réfugiés, de l'argent, un parti, des gardes américains - pour que l'appel ne vaut pas la peine d'être lancé, puis le briser avec le focus du général Hinh. Si le temps presse, les généraux prennent l'État."
 VIE_Hinh_Request_American_Guards: "Demandez à Manille un détail de garde"
 VIE_Hinh_Request_American_Guards_desc: "Le colonel Lansdale posera la question directement au président Magsaysay. Ce qui revient, ce sont quatre officiers philippins, un programme de formation et un garde du palais qui ne doivent rien à l'armée nationale."
 VIE_Hinh_Request_American_Guards_effect: "Augmente notre position §Ycontre le général Hinh§! de §G25§! après deux semaines."
 VIE_Hinh_Buy_the_Officer_Corps: "Achetez le Corps des Officiers"
 VIE_Hinh_Buy_the_Officer_Corps_desc: "Des arriérés de solde, des promotions et des arrangements discrets avec des commandants de bataillon qui n'ont pas encore décidé quelle voie prendre. Ce n'est pas de la loyauté et cela ne dure pas, mais il n'est pas nécessaire que cela dure longtemps."
 VIE_Hinh_Buy_the_Officer_Corps_cost: "§Y25§! Pouvoir politique et §Y0,1§! Million"
 VIE_Hinh_Buy_the_Officer_Corps_effect: "Augmente notre position §Ycontre le général Hinh§! de §G10§!."
 VIE_Hinh_Appeal_to_Bao_Dai: "Appel au chef de l'État"
 VIE_Hinh_Appeal_to_Bao_Dai_desc: "Le général télégraphia à Cannes une intervention et ne l'obtint pas. Nous pouvons câbler Cannes nous-mêmes, et nous l'obtiendrons, car le trône préfère avoir un premier ministre qu'il peut destituer plutôt qu'un général qu'il ne peut pas. La faveur sera mémorisée et facturée."
 VIE_Hinh_Appeal_to_Bao_Dai_effect: "Augmente notre position face au général Hinh de 20, et la position du trône avec lui.§!§!§!"
 VIE_Hinh_Reform_the_Cabinet: "Réformer le gouvernement"
 VIE_Hinh_Reform_the_Cabinet_desc: "Remplissez les quinze ministères vides des associations de réfugiés, du nord catholique et des cercles d'exilés. Aucun d'entre eux n'est expérimenté. Tous doivent leur siège à un seul homme."
 VIE_Hinh_Reform_the_Cabinet_effect: "Supprime le cabinet de gardien §Y§! et augmente notre position §Ycontre le général Hinh§! de §G10§!."
 VIE_Hinh_Ease_Out_the_Chief: "Soulager le chef de cabinet"
 VIE_Hinh_Ease_Out_the_Chief_desc: "Le général a été acheté, non battu, et il signe toujours les ordres. Il existe un moyen plus lent. Déplacez Le-Van-Ty dans l'état-major général département par département, transférez les hommes qui dépendent de Hinh à des commandements qui n'ont pas d'importance et laissez l'arrangement expirer de son propre gré. Le trône comprendra exactement ce qui se fait et ne le pardonnera pas."
 VIE_Hinh_Ease_Out_the_Chief_effect: "Après §Y30§! jours, le premier ministre commande la §YArmée nationale§!. Coûte la position§! du trône §Yet alimente la conspiration §RDai-Viet§!."
 VIE_DaiViet_Plot: "Une conspiration Dai-Viet"
 VIE_DaiViet_Plot_desc: "Le Dai-Viet Quoc-Dan-Dang complotait contre les Français avant que ce gouvernement n'existe et considère l'arrangement actuel comme une interruption. Quelque chose se prépare dans les garnisons. Ramener la conspiration à moins de cinquante ans l'arrêtera ; le laisser fonctionner ne le fera pas."
 VIE_DaiViet_Offer_Cabinet_Seats: "Offrez des sièges au Cabinet du Dai-Viet"
 VIE_DaiViet_Offer_Cabinet_Seats_desc: "Deux ministères et une province, étant entendu que le parti cessera de recruter au sein du corps des officiers. Cela achète le calme et dit à tout le monde à Saigon que comploter est un chemin vers le pouvoir."
 VIE_DaiViet_Offer_Cabinet_Seats_effect: "Réduit la conspiration §CDai-Viet§! de §G25§! et notre propre position §Y§! de §R5§!."
 VIE_DaiViet_Can_Lao_Infiltration: "Lâchez le Can-Lao sur eux"
 VIE_DaiViet_Can_Lao_Infiltration_desc: "Le parti recrute dans le même vivier nationaliste que celui du Dai-Viet, dans les mêmes provinces, en utilisant la même langue. Il est bien moins coûteux de savoir ce que fait un complot que de l'arrêter ensuite."
 VIE_DaiViet_Can_Lao_Infiltration_effect: "Réduit la conspiration Dai-Viet §C§! de §G20§!."
 VIE_DaiViet_Arrest_the_Cadres: "Arrêter les cadres"
 VIE_DaiViet_Arrest_the_Cadres_desc: "Prenez les comités provinciaux à quatre heures du matin et tenez-les sans inculpation pendant que se déroulent les interrogatoires. Ça marche. Cela confirme également, publiquement et selon les propres mots du Dai-Viet, tout ce que le parti a dit à propos de ce gouvernement."
 VIE_DaiViet_Arrest_the_Cadres_effect: "Réduit la conspiration Dai-Viet §C§! de §G35§! pour un coût de §Rde stabilité§!."

 #The premiership situation report - display-only decision VIE_Diem_Situation_Report
 VIE_Diem_Situation_Report: "Rapport de situation"
 VIE_Diem_Situation_Report_desc: "Un résumé permanent de la position réelle du gouvernement : le trône contre le Premier ministre, l'équilibre d'influence avec Paris, les sectes et - pendant que Ngo-Dinh-Diem occupe le poste de Premier ministre - l'impasse entre Hinh, la conspiration Dai-Viet et ce que rapporterait le référendum d'octobre s'il avait lieu aujourd'hui. Lire ne coûte rien et ne change rien."
 VIE_Diem_Situation_Report_tt:0 "§YLE PALAIS§!\n[GetMainNameVie]: §Y[?Main_Favoritism|0]§!    [GetAltNameVie]: §Y[?Alt_Favoritism|0]§!\nInfluence domestique : §Y[?VIE_Influence|0]§! Vietnamien / §Y[?FRA_Influence|0]§! Français\nTrésorerie : §Y[?currentMoney|+1]§!B\n\n[GetVIEPremiershipReport]\n§YLES SECTES§!\nFidélité Cao-Dai : §Y[?Cao_Dai_Loyalty_number|0]§! Fidélité Hoa-Hao : §Y[?Hoa_Hao_Loyalty_number|0]§!\nBinh-Xuyen cassé : §Y[?Binh_Xuyen_Annihilation_number|0]§!"
 VIE_SITREP_PREMIERSHIP:0 "§YLE PREMIER MINISTRE§!\nAffrontement avec le général Hinh : §Y[?VIE_Hinh_Standoff|0]§!/100 - [GetVIEHinhStatus]\nConspiration Dai-Viet : §Y[?VIE_DaiViet_Threat|0]§!/100 - [GetVIEDaiVietStatus]\nRéférendum s'il a lieu aujourd'hui : §Y[?VIE_Referendum_Score|0]§! - [GetVIEReferendumBand]\n[GetVIESitrepArmy]\n[GetVIESitrepBinhXuyen]\n[GetVIESitrepRefugees]\n[GetVIESitrepNRC]\n[GetVIESitrepCanLao]\n[GetVIESitrepRoyalGuard]\n[GetVIESitrepGeneva]\n[GetVIESitrepBaLong]\n[GetVIESitrepCabinet]\n[GetVIESitrepLand]\n[GetVIESitrepEstate]\n[GetVIESitrepFront]\n[GetVIESitrepArvn]\n"
 VIE_SITREP_NO_PREMIERSHIP:0 "§YLE PREMIER MINISTRE§!\nNgo-Dinh-Diem n'occupe pas le poste de Premier ministre. L'impasse Hinh, la conspiration Dai-Viet et le référendum de 1955 ne se déroulent pas.\n"
