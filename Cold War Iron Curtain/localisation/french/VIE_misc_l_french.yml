 # === Cuong-De / Ho Reconciliation Chain ===
 VIE_cuongde_no_north_bypass_tt: "§YLe Nord Vietnam§! n'existe plus"
 VIE_cuongde_rapprochement_req_tt: "Un véritable rapprochement s'est construit entre §YSaigon§! et §YHanoi§! (§Y[?global.geneva_rapprochement_vie_vin|0]§!/§G100§!)"
 VIE_cuongde_unification_offer_tt: "Si Hanoï honore l'accord, le Vietnam sera réunifié pacifiquement sous le gouvernement §YSaigon§! après une période de transition"
 VIE_cuongde_dan_quoc_armed_tt: "Une paix négociée §YDan-Quoc§! entre Diem et Ho devient une résolution possible de la §YLutte en Indochine§!"
 VIE_cuongde_failure_branch_tt: "La branche de focus §YA House Divided§! devient disponible"
 VIE_cuongde_house_divided_branch_tt: "La réconciliation avec le §YNord§! a échoué §R§!, ou le §YFront anticommuniste§! a été formé"
 VIE_cuongde_outcome_geneva_tt: "Les puissances sont assises à §YGenève§!: l'accord devient la capitale des négociations vers un règlement entre les deux Vietnam"
 VIE_cuongde_outcome_armistice_tt: "Un armistice s'installe entre §YNord§! et §YSud§!; le processus d'unification se terminera dans §Y180 jours§! si Diem et Ho dirigent toujours leur gouvernement"
 VIE_cuongde_outcome_postwar_tt: "La guerre étant déjà terminée, l'accord devient une tentative de réunification entre deux États en paix, concluant dans §Y180 jours.§!"
 VIE_cuongde_outcome_moot_tt: "§RLe Nord-Vietnam n'existe plus ; il n'y a plus personne avec qui se réconcilier§!"
 VIE_cuongde_finalize_deferred_tt: "La §YConférence de Genève§! est toujours en session ; la fusion définitive attend que les pouvoirs sortent de la table"
 VIE_cuongde_finalize_moot_tt: "§YLe Vietnam est déjà réunifié§!"
 VIE_cuongde_finalize_merge_tt: "§GLe Vietnam est réunifié pacifiquement sous le gouvernement de Saigon§!"
 VIE_cuongde_finalize_failed_tt: "§RLes hommes qui ont signé l'accord ne dirigent plus leur gouvernement - ce moment est révolu§!"
