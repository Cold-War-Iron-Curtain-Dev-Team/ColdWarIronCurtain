 VIE_Navy_Marines_Upgrade_TT: "Améliore l'infanterie de marine de la §YNational Navy§!:\n  §GAttaque et défense d'invasion amphibie§! et §GCapacité d'invasion§!"
 VIE_Navy_Assault_Upgrade_TT: "Améliore les flottilles d'assaut de la §YNational Navy§!:\n  §GPénalité d'invasion navale§!, §GPréparation§! et §GVitesse de préparation§!"
 VIE_Navy_Academy_Upgrade_TT: "Améliore la formation des officiers de la §YNational Navy§!:\n  §GGain d'expérience navale§! et §GCoût de recrutement d'amiral§!"
 VIE_Navy_Patrol_Upgrade_TT: "Améliore les patrouilles fluviales et côtières de la §YNational Navy§!:\n  §GCapacité de transport§!, §GVitesse de réparation§! et §GCoûts de mise à niveau de l'équipement§!"
 VIE_Navy_French_Ships_Upgrade_TT: "La §YNational Navy§! se transforme en une véritable flotte :\n  §GCoût et vitesse de réaménagement§!, §GCoûts de mise à niveau de l'équipement§! et §GInvasions navales§!"
 VIE_Found_National_Air_Force_TT: "Fonde la Force aérienne nationale de l'État du Vietnam §Y§!"
 VIE_Air_Officers_Upgrade_TT: "Améliore le corps des officiers de la §YNational Air Force§!:\n  §GGain d'expérience aérienne§!, §GCoûts de doctrine§!, §GAccidents§!, §GGénération d'as§! et §GPénalités de nuit et météorologiques§!"
 VIE_Air_Airborne_Upgrade_TT: "Améliore la coordination air-sol de la §YNational Air Force§!:\n  §GEfficacité de la mission§!, §GAgilité§!, §GPortée§! et §GSoutien de supériorité aérienne§!"
 VIE_Air_Bases_Upgrade_TT: "Améliore l'infrastructure terrestre de la §YNational Air Force§!:\n  §GAttaque aérienne et défense§!, §GEfficacité de la mission§!, §GAgilité§!, §GMissions aériennes navales§! et §GVisibilité des bombardements stratégiques§!"

 VIE_Recruit_CEFEO_Foreign_Legion_Units: "Recruter des unités de la Légion étrangère du CEFEO"
 VIE_Recruit_CEFEO_Foreign_Legion_Units_desc: "Coordonner avec le corps expéditionnaire français le recrutement d'unités d'élite de la Légion étrangère française pour servir sous commandement vietnamien."
 VIE_Recruit_FFL_Tank: "Recrue Division de Tonkin"
 VIE_Recruit_FFL_Tank_desc: "Recrutez la division blindée de la Légion étrangère française connue sous le nom de Division de Tonkin. Cette unité d'élite combine l'infanterie de la Légion étrangère avec un soutien blindé léger."
 VIE_Recruit_FFL_Parachute_1: "Recrue 1er Régiment Etranger de Parachutistes"
 VIE_Recruit_FFL_Parachute_1_desc: "Recrutez le 1er Régiment étranger de parachutistes, unité aéroportée d'élite de la Légion étrangère française possédant une vaste expérience du combat."
 VIE_Recruit_FFL_Parachute_2: "Recrue 3e Régiment Etranger de Parachutistes"
 VIE_Recruit_FFL_Parachute_2_desc: "Recrutez le 3e Régiment étranger de parachutistes, autre unité aéroportée d'élite de la Légion étrangère française."
 VIE_Recruit_FFL_Regular_1: "Recrue Brigade d'Annam-Laos"
 VIE_Recruit_FFL_Regular_1_desc: "Recrutez la brigade de la Légion étrangère basée en Annam et au Laos, fournissant des forces d'infanterie expérimentées."
 VIE_Recruit_FFL_Regular_2: "Recruter le 11e Régiment d'Infanterie de Marine"
 VIE_Recruit_FFL_Regular_2_desc: "Recrutez le 11e Régiment d'infanterie de marine, une unité de la Légion étrangère possédant une expérience des opérations côtières et maritimes."
 VIE_mil_decisions: "Décisions militaires"
 VIE_Demand_French_ships: "Demander des transferts navals français"
 VIE_Demand_French_ships_desc: "Demander le transfert des navires de la marine française pour renforcer nos capacités navales. Cela améliorera notre capacité à patrouiller les eaux côtières et à soutenir les opérations militaires."
