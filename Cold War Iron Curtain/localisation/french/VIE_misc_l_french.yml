 VIE_NH_Diem_Begin_5YP_WIP_tt: "§YLe plan quinquennal débouchera sur un nouvel arbre d'orientation économique dans une prochaine mise à jour.§!\n§RCe contenu est toujours en cours de développement et n'a actuellement aucun effet.§!"
