 VIE_Flag_Change: "Discussions pour un nouveau drapeau"
 VIE_Readopt_Royal_Court_Banner: "Réadopter la bannière de la Cour royale"
 VIE_Merge_Two_Flags: "Fusionner nos deux drapeaux"

 VIE_CrownDomain_Decisions: "Les domaines de la Couronne"
 VIE_CrownDomain_Decisions_desc: "Les Hoang-Trieu Cuong-Tho, ou Domaines de la Couronne, restent sous l'autorité personnelle de Bao-Dai, indépendamment de l'État vietnamien. Leur sort est à nous de décider."
 VIE_Annex_FUL: "Dissoudre le domaine de la Couronne montagnarde"
 VIE_Annex_FUL_desc: "Le domaine de la Couronne des hauts plateaux du centre a dépassé son objectif. Il est temps de placer le Pays Montagnard sous administration vietnamienne directe."
 VIE_Annex_CCC: "Récupérer la Cochinchine"
 VIE_Annex_CCC_desc: "Le gouvernement autonome de Saigon a échoué. La Cochinchine sera rattachée au Vietnam sans autre cérémonie."
 VIE_Puppet_NUN: "Ouvrez la colonie Nung"
 VIE_Puppet_NUN_desc: "Les Nung de Hai-Ninh gardent notre frontière nord. Ils peuvent conserver leurs privilèges locaux, mais leur territoire doit nous répondre."
 VIE_Pau_Treaty_command_tt: "L'État §Ydu Vietnam§! obtient le statut d'État associé au sein du commandement sud ; Le CEFEO conserve les domaines de la couronne nord"
 VIE_Matignon_Treaty_command_tt: "L'État §Ydu Vietnam§! met fin à sa dépendance politique à l'égard de Paris sans quitter le commandement du théâtre français de l'Indochine"

 VIE_State_Industrialization: "Industrialisation de Ky-Nghe-Hoa"
 State_Industrialization_Ready: "Industrialiser [From.GetName]"
 VIE_State_Industrialization_tt: "Aura une chance aléatoire de construire une usine civile §Y§!, un complexe agro-industriel §Y§!ou un district de fonderie §Y§!"

 VIE_Development_Scheme: "Le programme de développement du Vietnam"
 VIE_Development_Scheme_desc: "Depuis notre récente indépendance grâce à la solution Bao-Dai, l'économie de notre pays est encore fortement arriérée et largement exploitée en raison de siècles de domination féodale et coloniale. Cependant, il existe, bien que obsolètes ou déchirées par la guerre, des infrastructures coloniales et de petites zones industrielles que nous pouvons réutiliser et servir de base à la modernisation et à l'industrialisation en cours de notre grand pays !"
 Development_Scheme_Cooldown: "N'a pas récemment lancé un projet de développement §YDécision§!"

