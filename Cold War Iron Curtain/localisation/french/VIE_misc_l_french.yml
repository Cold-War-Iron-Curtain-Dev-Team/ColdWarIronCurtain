 VIE_General_Officers_Commission: "Promotions et commissions des officiers généraux"
 VIE_Give_BaoDai_Command: "Récompensez le commandement sur le terrain de Bao-Dai"
 VIE_Recruit_Lam_Van_Huong: "Recruter Lam-Van-Huong"
 VIE_Recruit_Lam_Van_Huong_desc: "Administrateur militaire et officier de police chevronné, l'expérience de Lam-Van-Huong en matière de gouvernance et de sécurité intérieure fait de lui un atout précieux pour l'effort de guerre national."
 VIE_Recruit_Vu_Thiet: "Recruter Vu-Thiet"
 VIE_Recruit_Vu_Thiet_desc: "Un officier militaire compétent dont la loyauté et la capacité tactique lui ont valu une reconnaissance parmi le corps des officiers de l'armée nationale."
 VIE_Recruit_Nguyen_Van_Dan: "Recruter Nguyen-Van-Dan"
 VIE_Recruit_Nguyen_Van_Dan_desc: "Un commandant de terrain vétéran expérimenté dans les opérations anti-insurrectionnelles dans les provinces du sud."
 VIE_Recruit_Nguyen_Van_Tam: "Recruter Nguyen-Van-Tam"
 VIE_Recruit_Nguyen_Van_Tam_desc: "Connu sous le nom de « Tigre de Cai-Lay » pour sa répression brutale des activités du Viet-Minh, Nguyen-Van-Tam est un administrateur radical dont l'anticommunisme farouche et la discipline de fer font de lui un instrument d'ordre fiable, quoique redouté"
 VIE_Recruit_Phan_Trong_Vinh: "Recruter Phan-Trong-Vinh"
 VIE_Recruit_Phan_Trong_Vinh_desc: "Un officier militaire dévoué dont le leadership sur la ligne de front a attiré l'attention du haut commandement."
 VIE_Recruit_Trinh_Van_Cu: "Recruter Trinh-Van-Cu"
 VIE_Recruit_Trinh_Van_Cu_desc: "Un officier fiable dont les capacités organisationnelles se sont révélées précieuses pour coordonner les opérations sur plusieurs fronts."
 VIE_Recruit_Nguyen_Van_Lai: "Recruter Nguyen-Van-Lai"
 VIE_Recruit_Nguyen_Van_Lai_desc: "Un commandant militaire prometteur connu pour sa capacité d'adaptation et son leadership calme sous pression."
 VIE_Give_Charles_Chanson_Command: "Donnez à Charles Chanson le commandement sur le terrain de la NVA"
 VIE_Recruit_Hoang_Co_La: "Recruter Hoang-Co-La"
 VIE_Recruit_Hoang_Co_La_desc: "Officier aux capacités démontrées et aux convictions nationalistes, engagé dans la défense de la République contre tous les ennemis."
 VIE_Recruit_Tran_Dinh_Vy: "Recruter Tran-Dinh-Vy"
 VIE_Recruit_Tran_Dinh_Vy_desc: "Un officier militaire décoré dont l'expérience de première ligne et le dévouement à la cause nationale en font un atout précieux pour nos forces."
 VIE_Recruit_Tran_Dinh_Lan: "Recruter Tran-Dinh-Lan"
 VIE_Recruit_Tran_Dinh_Lan_desc: "Un officier compétent dont les états de service reflètent une loyauté constante et une compétence sur le champ de bataille."
 VIE_Integrate_Sect_Armies: "Intégrer les armées sectaires"
 VIE_Integrate_Sect_Armies_desc: "Les différentes factions armées des sectes religieuses vietnamiennes opèrent depuis longtemps en dehors du contrôle de l'État. En intégrant formellement leurs forces dans l'armée nationale, nous pouvons consolider la puissance militaire et réduire le risque de conflit armé interne."
 VIE_Integrate_Militia_CaoDai: "Intégrer la milice Cao-Dai"
 VIE_Integrate_Militia_CaoDai_desc: "La secte Cao-Dai maintient une milice importante dans la région de Tay-Ninh. Placer ces combattants sous commandement national élargira notre portée militaire tout en réduisant une puissance armée indépendante qui menace l'autorité centrale."
 VIE_Integrate_Militia_NguyenTrungTruc: "Intégrer la milice Nguyen-Trung-Truc"
 VIE_Integrate_Militia_NguyenTrungTruc_desc: "La milice Nguyen-Trung-Truc, opérant dans les provinces du sud, peut être placée sous commandement national, ajoutant ainsi des combattants expérimentés à nos forces tout en réduisant les factions armées indépendantes dans la région."
 VIE_Integrate_Militia_UMDC: "Intégrer la milice UMDC"
 VIE_Integrate_Militia_UMDC_desc: "Les forces paramilitaires de l'UMDC représentent une présence armée importante dans le delta du Mékong. Les intégrer dans l'armée nationale consolidera notre puissance militaire, mais au prix de l'influence autonome de Jean Leroy."
 VIE_Recruit_Anselmo_Tadeo_LeHuuTu: "Recruter Anselmo-Tadeo Le-Huu-Tu"
 VIE_Recruit_Anselmo_Tadeo_LeHuuTu_desc: "L'évêque catholique de Phat-Diem, Le-Huu-Tu commande une formidable milice dans la région du delta du fleuve Rouge. Les combattants bien armés de son diocèse se sont avérés un frein vital aux empiètements du Viet-Minh."
 VIE_Recruit_Guise_DinhNgocVinh: "Recruter Guise Dinh-Ngoc-Vinh"
 VIE_Recruit_Guise_DinhNgocVinh_desc: "Officier loyal et nationaliste engagé dont les états de service témoignent à la fois de compétences et de dévouement à la cause nationale."
 VIE_Recruit_Pham_Cao_Hung: "Recruter Pham-Cao-Hung"
 VIE_Recruit_Pham_Cao_Hung_desc: "Un commandant militaire compétent connu pour son sens opérationnel et sa loyauté envers la cause nationale."
 VIE_Recruit_Tran_Van_Hai: "Recruter Tran-Van-Hai"
 VIE_Recruit_Tran_Van_Hai_desc: "Un commandant de terrain déterminé dont l'expérience dans les opérations de contre-insurrection dans le delta du Mékong a fait de lui l'un des officiers les plus compétents de nos rangs."
 VIE_Recruit_Tran_Van_Chon: "Recruter Tran-Van-Chon"
 VIE_Recruit_Tran_Van_Chon_desc: "Officier de marine expérimenté dont le leadership en mer a fait de lui une figure essentielle dans le développement de la capacité maritime émergente du Vietnam."
 VIE_Recruit_Nguyen_Van_Lich: "Recruter Nguyen-Van-Lich"
 VIE_Recruit_Nguyen_Van_Lich_desc: "Un officier compétent dont les compétences tactiques et la loyauté l'ont distingué parmi le corps des officiers."
 VIE_Recruit_Chung_Tan_Cang: "Recruter Chung-Tan-Cang"
 VIE_Recruit_Chung_Tan_Cang_desc: "Un officier de marine talentueux dont l'expérience et le dévouement à la construction d'une marine vietnamienne moderne seront essentiels à la sécurité de nos frontières maritimes."
 VIE_Recruit_Lam_Nguon_Tanh: "Recruter Lam-Nguon-Tanh"
 VIE_Recruit_Lam_Nguon_Tanh_desc: "Un officier de marine compétent dont l'expérience opérationnelle en mer a contribué au développement des forces maritimes du Vietnam."
 VIE_Recruit_Doan_Ngoc_Bich: "Recruter Doan-Ngoc-Bich"
 VIE_Recruit_Doan_Ngoc_Bich_desc: "Un officier militaire dévoué dont le service a démontré à la fois des compétences organisationnelles et un courage en première ligne."
 VIE_Recruit_Tran_Van_Phan: "Recruter Tran-Van-Phan"
 VIE_Recruit_Tran_Van_Phan_desc: "Un officier compétent et loyal dont les contributions à l'effort de défense nationale lui ont valu le plus grand respect parmi ses pairs."
 VIE_Recruit_VIE_Pierre_Y_Wo_Mlo: "Recruter Pierre-Y Wo-Mlo"
 VIE_Recruit_VIE_Pierre_Y_Wo_Mlo_desc: "Un chef parmi les peuples montagnards des hauts plateaux du centre dont la connaissance intime du terrain et des tactiques de guérilla de ses guerriers constitue un atout inestimable pour sécuriser la frontière des hauts plateaux."
 VIE_Recruit_VIE_Y_Wo_Mlo: "Recruter Y-Wo-Mlo"
 VIE_Recruit_VIE_Y_Wo_Mlo_desc: "Un commandant montagnard de confiance dont la connaissance des combattants du terrain des hautes terres en fait une force essentielle dans la lutte pour les hauts plateaux du centre."
 VIE_Recruit_VIE_Y_Tot_Nai: "Recruter Y-Tot-Nai"
 VIE_Recruit_VIE_Y_Tot_Nai_desc: "Un chef de tribu montagnard dont l'autorité parmi les communautés des hautes terres peut étendre notre influence et notre sécurité au plus profond des hauts plateaux du centre."

 VIE_Recruit_General_Cost: "£command_power  §Y50§!  £pol_power  §Y15§!"
