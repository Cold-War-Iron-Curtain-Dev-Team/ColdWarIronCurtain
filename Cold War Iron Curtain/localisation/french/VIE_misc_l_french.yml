 Decrease_Land_Reform_Penalty_10: "Diminuer §Yla pénalité pour la réforme agraire§! de §G10 %§!"
 VIE_Diem_Accept_Elections_tt: "Saigon ne bloquera pas §Ypas§! les §Yélections de réunification du Vietnam§! prévues par les Accords de Genève.\nÀ la fin de la période intérimaire, le scrutin a lieu, à moins que l'une des parties ne l'annule ou n'entre en guerre :\n- Si §Rla liste§! de Ho-Chi-Minh emporte le pays, §RHanoï annexe le Sud§!.\n- Si la liste §Yde l'État du Vietnam§! tient, §GSaigon annexe le Nord§!.\nLes chances suivent l'équilibre final de la guerre, notre §Ystabilité§!, si §YHo-Chi-Minh§! mène toujours le Nord, et toute §Yfalsification américaine§!.\nReconnaître le scrutin affaiblit également les arguments en faveur d'une république du Sud lors du référendum des §Y§!."
 VIE_Diem_Buu_Defected_tt: "§YTran-Quoc-Buu§! a fait défection du Viet-Minh du Sud"
 VIE_Diem_NRC_Formed_tt: "Le §YComité National Révolutionnaire§! s'est prononcé contre le trône, ou il est passé §Y12 mai 1955§!"
 VIE_Diem_ChieuHoi_Cadres_tt: "Gagnez §Ycadres Chieu-Hoi§! pour le programme du village"
 VIE_Diem_United_Front_Standing_tt: "Le §YFront National Unifié§! est toujours debout"
 VIE_Diem_No_United_Front_tt: "§RLes sectes n'ont jamais formé un front unique§!"
 VIE_Diem_Referendum_Already_Held_tt: "§RLe référendum a déjà eu lieu§!"
 VIE_Diem_Referendum_Won_tt: "Le référendum §Y§! a rendu un verdict pour la république"
 VIE_Diem_Republic_Already_Proclaimed_tt: "§RLa République est déjà proclamée§!"
 VIE_Nhu_Political_Counsellor: "Conseiller Ngo-Dinh-Nhu"
 VIE_Nhu_Political_Counsellor_desc: "Le frère du premier ministre n'exerce aucun ministère et ne répond à aucune assemblée. Il gère les dossiers, le parti et les hommes qui le surveillent, et il le fait depuis une salle du palais Gia-Long qui ne figure sur aucun organigramme."
 VIE_Phu_Tong_Uy_Di_Cu: "Commissariat Général aux Réfugiés"
 VIE_Phu_Tong_Uy_Di_Cu_desc: "Construit pour déplacer cent mille habitants du Nord et demandé d'en déplacer près d'un million. Il dispose de camions, de camps, de concessions de terres et de ses propres hommes dans chaque province, et c'est la seule branche de ce gouvernement que les campagnes ont réellement rencontrée."
 VIE_Phong_Trao_Cach_Mang_Quoc_Gia: "Mouvement révolutionnaire national"
 VIE_Phong_Trao_Cach_Mang_Quoc_Gia_desc: "Un front plutôt qu'un parti : catholiques, réfugiés, syndicalistes et transfuges sous une même bannière, capables de remplir une place provinciale dans un délai de trois jours et portant le nom du premier ministre d'une manière suffisamment proche pour que la distinction soit académique."
 VIE_Cach_Mang_Quoc_Gia_Press: "La Presse Cach-Mang Quoc-Gia"
 VIE_Cach_Mang_Quoc_Gia_Press_desc: "Le ministère de l'Information autorise désormais les quotidiens français et les revues d'élite, et le mouvement imprime son propre journal dans chaque capitale de province. L'opposition n'a pas été réduite au silence, mais plutôt enterrée sous le papier journal."
 VIE_Dac_Phu_Cong_Dan_Vu: "Commissariat Spécial à l'Action Civile"
 VIE_Dac_Phu_Cong_Dan_Vu_desc: "Des cadres en pyjama noir qui habitent là où ils sont affectés, creusent le puits, enseignent à l'école et déposent le rapport. C'est la méthode qui a battu les Français, courir dans l'autre sens, et c'est la seule qui ait jamais fonctionné dans le delta."
 VIE_Quan_Luc_VNCH: "Armée de la République du Vietnam"
 VIE_Quan_Luc_VNCH_desc: "Nouvelles couleurs, nouveau serment et mêmes hommes dans la même caserne. Ce qui a changé, c'est que ce qu'ils jurent, c'est un État, et que l'état-major doit ses étoiles au palais."
 VIE_SITREP_CABINET_YES:0 "  §G+10§! Le deuxième cabinet est assis"
 VIE_SITREP_CABINET_NO:0 "  §R 0§! Le gouvernement n'a pas été réformé depuis 1954"
 VIE_SITREP_LAND_YES:0 "  §G+10§! Sac-lenh 7 et 57 sont en vigueur"
 VIE_SITREP_LAND_NO:0 "  §R 0§! Les loyers delta se situent là où les Français les ont laissés"
 VIE_SITREP_ESTATE_YES:0 "  §G+10§! Le domaine royal est entre les mains de l'État"
 VIE_SITREP_ESTATE_NO:0 "  §R 0§! Hué et les comptes impériaux restent ceux du trône"
 VIE_SITREP_FRONT_YES:0 "  §G+10§! Le Front National Unifié est dissous"
 VIE_SITREP_FRONT_NO:0 "  §R 0§! Le front de la secte n'a pas été brisé"
 VIE_SITREP_ARVN_YES:0 "  §G+10§! L'Armée de la République est fondée"
 VIE_SITREP_ARVN_NO:0 "  §R 0§! L'armée sert toujours l'État du Vietnam"
 VIE_Diem_No_Rung_Sac_Pocket_tt: "§RLes Binh-Xuyen n'ont jamais été conduits dans le Rung-Sac§!"
 VIE_Diem_No_Cung_tt: "§RKieu-Cong-Cung n'a pas traversé ; le programme fonctionne sans lui§!"
 VIE_Diem_Cung_Civic_Action_tt: "§YKieu-Cong-Cung§! prend en charge les cadres d'action civique"

 # === French Coup (General Nguyen-Van-Hinh) ===
 VIE_Intensify_Propaganda: "Intensifier la propagande"
 VIE_Intensify_Propaganda_desc: "Le gouvernement du général Nguyen-Van-Hinh, soutenu par la France, peut exercer une pression plus forte sur sa machine de propagande contre le Viet-Minh et ses sympathisants."
 VIE_NamKy_Cultures: "Cultures Nam-Ky"
 VIE_NamKy_Cultures_desc: "La Cochinchine est la plus française de nos provinces. Investir dans sa vie culturelle et industrielle lie ses élites à l'avenir de Saigon."
 VIE_Francophile_Ideals: "Idéaux francophiles"
 VIE_Francophile_Ideals_desc: "La faction francophile de l'armée et de l'administration défend la civilisation française comme modèle d'un Vietnam moderne."
 VIE_Phap_Duhe: "Phap-Viet De-Hué"
 VIE_Phap_Duhe_desc: "Un partenariat de travail avec la France, construit sur des projets et des investissements partagés, est la plus sûre garantie de l'ordre dans le Sud."
 VIE_Denounce_HO: "Dénoncer Ho-Chi-Minh"
 VIE_Denounce_HO_desc: "Dénoncer Ho-Chi-Minh dans la presse comme un agent de Moscou et un traître au peuple vietnamien. La stabilité dans le Nord diminue tandis que notre propre soutien augmente."
 VIE_Communist_Failures: "Faire connaître les échecs communistes"
 VIE_Communist_Failures_desc: "Publier les échecs de la politique foncière du Viet-Minh et les difficultés des villages sous son contrôle. Le Viet-Minh perd son statut auprès de la paysannerie et la campagne ne pourra pas se répéter avant un certain temps."
 VIE_Cochinchina_Industry: "Industrie cochinchine"
 VIE_Cochinchina_Industry_desc: "Construire une usine d'armement et un complexe industriel en Cochinchine, avec des emplacements de construction supplémentaires dans l'État partagé, afin que le Sud produise pour sa propre défense."
 VIE_Praise_Cochinchinese: "Louons les Cochinchins"
 VIE_Praise_Cochinchinese_desc: "Honorez les habitants de Cochinchine et leur loyauté envers l'État. Leur coopération apporte une impulsion durable à la productivité locale."
 VIE_Project_Friendship: "Projet Amitié"
 VIE_Project_Friendship_desc: "Proclamer l'amitié entre le Vietnam et la France. La stabilité augmente et notre favoritisme se déplace vers Paris."
 VIE_Encourage_Investment: "Encourager les investissements français"
 VIE_Encourage_Investment_desc: "Inviter le capital français dans l'État partagé, en ajoutant des emplacements de construction et une grande usine d'armes à la base industrielle cochinchine."
 VIE_Praise_French: "Louons le patrimoine français"
 VIE_Praise_French_desc: "Célébrez la civilisation française et les oeuvres de l'époque coloniale. Notre favoritisme se déplace vers Paris et la stabilité s'améliore."
 VIE_French_Heroic: "L'héroïsme français"
 VIE_French_Heroic_desc: "Commémorez l'héroïsme des soldats français qui ont combattu à nos côtés. Leur exemple inspire notre propre armée pour un temps."
 VIE_Cochinchina_Industry_spawnrate: "Industrie cochinchine"
 VIE_Cochinchina_Industry_spawnrate_desc: "Les investissements soutenus par la France dans les usines de Cochinchine ont lié la classe industrielle du sud à Saigon."
 VIE_Cochinchina_Residents_spawnrate: "Cochinchinois fidèle"
 VIE_Cochinchina_Residents_spawnrate_desc: "Les habitants de la Cochinchine, honorés par le gouvernement, répondent à l'appel à servir en plus grand nombre."
 VIE_FRA_Hero: "L'héroïsme français"
 VIE_FRA_Hero_desc: "Le souvenir des soldats français qui ont combattu à nos côtés stabilise les campagnes face au Viet-Minh."
