 VIE_SECT_CONFLICT_PROMPT_TITLE_2: "Échec de l'assaut sur les forces [GetVieConflictSectName]"
 VIE_SECT_CONFLICT_PROMPT_TITLE_3: "[GetVieConflictSectName] Installations saisies"
 VIE_SECT_CONFLICT_PROMPT_TITLE_4: "Échec de l'assaut sur les installations [GetVieConflictSectName]"
 VIE_SECT_CONFLICT_PROMPT_DESC_1: "Après un début difficile, nos forces ont réussi à repousser les forces [GetVieConflictSectName], permettant ainsi de rétablir le contrôle du gouvernement sur des zones limitées autrefois détenues par les [GetVieConflictSectName]."
 VIE_SECT_CONFLICT_PROMPT_DESC_2: "Après les premiers succès, nos forces ont été repoussées par des forces [GetVieConflictSectName]. De plus, les pertes subies et l'élan pris par le [GetVieConflictSectName] ont réduit notre position par rapport au [GetVieConflictSectName]."
 VIE_SECT_CONFLICT_PROMPT_DESC_3: "Lors d'un assaut audacieux sur le territoire [GetVieConflictSectName], nos forces ont pu prendre le dessus et liquider un grand nombre de forces [GetVieConflictSectName]. Une fois cet objectif atteint, nous avons réussi à prendre le contrôle de diverses installations [GetVieConflictSectName], renforçant ainsi considérablement la position du gouvernement par rapport aux [GetVieConflictSectName]."
 VIE_SECT_CONFLICT_PROMPT_DESC_4: "Après avoir pénétré dans le territoire détenu par [GetVieConflictSectName], nos forces ont rapidement essuyé le feu de l'ennemi et ont été encore plus gênées par l'opposition locale à notre régime. Après plusieurs heures de combats acharnés, nos forces furent mises en déroute par l'ennemi. L'incapacité de s'emparer des installations du [GetVieConflictSectName] nuirait sûrement à notre position et rendrait plus difficiles toutes négociations futures avec le [GetVieConflictSectName]."
