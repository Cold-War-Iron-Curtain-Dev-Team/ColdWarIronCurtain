 newsdecolonization.28.d:0 "Les Britanniques ont pris possession de Maurice au début du XIXe siècle et ont été confrontés à des problèmes économiques et sociaux dus à la dépendance de l'île à l'égard du sucre et à une main-d'oeuvre diversifiée. Aujourd'hui, l'île a une nouvelle constitution et a proclamé son indépendance. Depuis plusieurs années, les Britanniques ont identifié Maurice comme un espace d'indépendance, mais leurs efforts pour faire de la colonie un État indépendant ne se sont pas déroulés sans heurts. La diversité des groupes de population et de travailleurs a conduit à des violences sectaires sur l'avenir du pays quelques semaines seulement avant les élections. L'armée britannique a dû déployer des troupes pour mettre fin aux émeutes. Cependant, malgré ces incertitudes, nombreux sont ceux qui gardent espoir pour l'avenir. Le nouveau parlement sera dirigé par Sir Seewoosagur Ramgoolam, du parti travailliste au pouvoir. En réaction, l'organisation étudiante Mauritian Militant Wing (MMW) dirigée par Paul Bérenger s'est déjà proclamée principale formation d'opposition au parti travailliste au pouvoir. Le MMW propose une alternative socialiste au Parti travailliste. Malgré la violence et les premiers défis politiques, beaucoup sont optimistes que la nouvelle nation sera en mesure de réaliser ses intérêts nationaux."
 newsdecolonization.29.d:0 "Aux Comores françaises, le parlement de l'île a voté en faveur d'une déclaration unilatérale d'indépendance vis-à-vis de la France. Les Français seraient surpris par cette décision car ils espéraient accorder l'indépendance en 1978. Des référendums avaient eu lieu plusieurs années plus tôt sur l'indépendance des quatre îles des Comores, trois ont voté pour l'indépendance et Mayotte s'est abstenue, le nouvel État est composé de toutes les îles des Comores à l'exception de Mayotte. Le ministre en chef des Comores, Ahmed Abdallah, a annoncé le vote pour l'indépendance et est le premier président des Comores. Les tensions sur l'île sont vives car l'importante communauté francophile considère cette décision comme préjudiciable au développement de la nation. De l'autre côté, les socialistes considèrent le Parlement et Ahmed Abdallah comme trop centristes pour apporter des changements significatifs. On ignore si ces tensions entraîneront des troubles politiques, mais la décision d'indépendance a suscité la colère de Paris face aux actions des nationalistes comoriens. On s'attend à ce que la France coupe ses liens avec les îles et renforce son emprise sur Mayotte. Peut-être qu'au fil du temps, les relations pourront être rétablies avec la France et son ancienne colonie."
 newsdecolonization.30.d:0 "Les Seychelles étaient à l'origine inhabitées jusqu'à l'arrivée des Européens au XVIe siècle. Au début du XIXe siècle, elles étaient une colonie de la couronne britannique. L'île disposait historiquement d'un système de plantations robuste qui exportait des cultures commerciales, mais depuis la création d'un aéroport international, elle est devenue une destination touristique majeure. L'avenir économique étant orienté dans une direction positive, le gouvernement britannique a annoncé son intention d'accorder l'indépendance aux Seychelles. James Mancham, un avocat issu d'une famille éminente, a créé le Parti démocratique des Seychelles (SDP) en réaction aux projets d'indépendance de la Grande-Bretagne. Le parti de Mancham avait dominé les élections provinciales organisées pendant la période transitoire et Londres a annoncé aujourd'hui que cette période transitoire était terminée. James Mancham sera président des Seychelles indépendantes et, dans une déclaration publique, il a annoncé que sa nation serait une république au sein du Commonwealth. Le parti d'opposition socialiste, le Parti uni du peuple, n'a pas de sièges à l'Assemblée nationale mais jouit d'un fort soutien à travers les îles et s'est vu confier le poste de Premier ministre à l'Assemblée nationale. Le succès futur des Seychelles dépendra de la capacité des deux principaux partis politiques à s'unir pour répondre au besoin d'une croissance économique rapide tout en protégeant les citoyens de la classe ouvrière."
 decolonization.34.d:0 "L'objectif de l'ONU d'assurer l'indépendance du peuple du Somaliland d'ici 10 ans a finalement été atteint avec l'indépendance du Somaliland italien par rapport à l'Italie aujourd'hui. Le Somaliland nouvellement formé s'est simultanément uni au Somaliland britannique, qui a obtenu sa propre indépendance quelques jours auparavant. L'unification a immédiatement donné naissance à la République somalienne, avec un gouvernement formé par Abdullahi Issa et Muhammad Haji Ibrahim Egal ainsi que d'autres membres des gouvernements de tutelle et de protectorat, avec Haji Bashir Ismail Yusuf comme président de l'Assemblée nationale somalienne, Aden Abdullah Osman Daar comme président de la République somalienne et Abdirashid Ali Shermarke comme Premier ministre. Cependant, la poussée précipitée de l'ONU en faveur d'une indépendance de 10 ans a révélé ses inconvénients, car la république semble toujours sous une forte influence coloniale, tant au sein de la population que du gouvernement. Pour l'instant, le sort de la Somalie dépend de la république."
 decolonization.40.d:0 "Après une promesse faite il y a dix ans en 1942 par l'ancienne reine Wilhelmine selon laquelle tous les territoires d'outre-mer du Royaume des Pays-Bas obtiendraient une certaine forme d'autonomie, aujourd'hui, en décembre 1954, marque la création officielle des Antilles néerlandaises après avoir été publiées par décret royal trois ans plus tôt. Cela permettra une autonomie accrue sans que notre gouvernement ait à gérer chaque île individuellement. Chaque île aura un lieutenant-gouverneur qui rendra compte au gouverneur général de Curaçao dans le but de centraliser les territoires. Les Antilles néerlandaises comprennent Curaçao, Bonaire, Aruba, Sint Maarten, Sint Eustatius et Saba, leur monnaie officielle étant le florin des Antilles néerlandaises. Leur gouvernement sera dirigé par un parlement et un conseil des ministres avec le Premier ministre comme chef du gouvernement à Willemstad, la capitale de l'île de Curaçao. Espérons que cela apaisera les troubles et la lutte pour l'indépendance qui ont éclaté pendant la brève domination américaine pendant la Seconde Guerre mondiale."
 decolonization.42.d:0 "Cette semaine, notre Parlement a ratifié les Accords de Madrid, un traité cédant le Sahara espagnol à la Mauritanie et au Maroc. Depuis la résolution 1514 de l'Assemblée générale des Nations Unies, nous avons subi d'intenses pressions de la part de cette maudite organisation pour abandonner nos quelques territoires africains mineurs, malgré notre classification en provinces internes. Alors que la plupart des membres de haut rang du gouvernement voulaient une République sahraouie indépendante alignée sur l'Espagne, la pression de la Mauritanie et du Maroc exigeant tous deux leur annexion complète de la province ainsi qu'un groupe séparatiste nouvellement formé, ont fait de ces accords l'approche la plus logique."
 newsdecolonization.41.d:0 "L'indépendance du Nigeria a été obtenue cette semaine grâce à des négociations menées par une coalition globale de partis politiques nigérians qui avaient ensuite la tâche plus compliquée de former un nouveau gouvernement. Finalement, cette tâche ardue a abouti à ce que le Premier ministre soit Abubakar Tafawa Balewa, d'origine haoussa du Congrès populaire du Nord, et sous ses ordres le président d'ethnie Igbo, Nnamdi Azikiwe, du Conseil national du Nigeria et du Cameroun. Tout comme les autres anciennes colonies britanniques, la Fédération nigériane choisira de rester partie du Commonwealth et de continuer à avoir la reine Elizabeth II comme monarque officiel, le général britannique C.B. Welby-Everard restant à la tête des nouvelles forces armées nigérianes pour les prochaines années."
 newsdecolonization.42.d:0 "Après des années de pression de la part de l'Assemblée générale de l'ONU sur l'Espagne pour qu'elle décolonise ses territoires sahariens, un accord a finalement été conclu à la lumière de la nouvelle insurrection du Front Polisario. L'Espagne a tenté de retarder sa décolonisation en regroupant ses possessions nord-africaines dans la « province intérieure » du Sahara espagnol et en battant brièvement les organisations militantes locales. Cependant, après que le Maroc ait organisé une marche de 350 000 citoyens vers le Sahara espagnol pour une manifestation visant à « marocaniser » la province, il était alors clair pour l'Espagne que le Maroc était prêt à faire la guerre pour le territoire. Dans un traité élaboré à la hâte, les Accords de Madrid ont été signés cette semaine par le Parlement espagnol alors que Francisco Franco est dans le coma"
 decolonization.45.d:0 "Après plus de 300 ans de soumission, la population de la petite nation insulaire de la Dominique jouit de son indépendance vis-à-vis de la couronne. Le peuple dominiquais pourra désormais tracer sa propre voie. Cependant, avec la CIA tapie dans l'ombre, nous pensons que la nouvelle voie ne sera pas trop différente de l'ancienne."
 newsdecolonization.45.d:0 "Après plus de 300 ans de soumission, la population de la petite nation insulaire de la Dominique jouit de son indépendance vis-à-vis de la couronne. Le peuple dominiquais pourra désormais tracer sa propre voie. Cependant, avec la CIA tapie dans l'ombre, nous pensons que la nouvelle voie ne sera pas trop différente de l'ancienne."
 decolonization.46.d:0 "A l'origine colonie française, la petite île était un champ de bataille entre les colonies britanniques voisines. Au total, Sainte-Lucie a été échangée 14 fois entre la France et la Grande-Bretagne avant de devenir finalement une colonie britannique. Le 22 février 1979, après près de 400 ans d'intervention européenne, ni le drapeau français ni le drapeau britannique ne flottaient au sommet de l'île. Aujourd'hui, un drapeau saint-lucien indépendant trône dans la capitale."
 newsdecolonization.46.d:0 "A l'origine colonie française, la petite île était un champ de bataille entre les colonies britanniques voisines. Au total, Sainte-Lucie a été échangée 14 fois entre la France et la Grande-Bretagne avant de devenir finalement une colonie britannique. Le 22 février 1979, après près de 400 ans d'intervention européenne, ni le drapeau français ni le drapeau britannique ne flottaient au sommet de l'île. Aujourd'hui, un drapeau saint-lucien indépendant trône dans la capitale."
 decolonization.47.d:0 "Aujourd'hui, Saint-Vincent-et-les Grenadines a déclaré son indépendance de la Grande-Bretagne. Après 400 ans de rébellion, l'indépendance est finalement parvenue au peuple de Saint-Vincent-et-les Grenadines, non pas d'un coup de fusil, mais d'un trait de plume."
 newsdecolonization.47.d:0 "Aujourd'hui, Saint-Vincent-et-les Grenadines a déclaré son indépendance de la Grande-Bretagne. Après 400 ans de rébellion, l'indépendance est finalement parvenue au peuple de Saint-Vincent-et-les Grenadines, non pas d'un coup de fusil, mais d'un trait de plume."
 decolonization.48:0 "Aujourd'hui, la Grenade a officiellement obtenu son indépendance de la Grande-Bretagne. Bien qu'indépendante, la nation insulaire a annoncé qu'elle resterait sous la couronne avec la reine Elizabeth comme chef d'État officiel."
 newsdecolonization.48:0 "Aujourd'hui, la Grenade a officiellement obtenu son indépendance de la Grande-Bretagne. Bien qu'indépendante, la nation insulaire a annoncé qu'elle resterait sous la couronne avec la reine Elizabeth comme chef d'État officiel."
 newsdecolonization.49:0 "Alors que l'impopulaire fédération des Antilles est en pleine tourmente, l'île de la Jamaïque a annoncé son retrait officiel de ce syndicat voué à l'échec. Aujourd'hui, l'Union Jack a été abaissé et remplacé par le nouveau drapeau indépendant de la Jamaïque au-dessus du bâtiment du Parlement."
 newsdecolonization.50:0 "Suite au retrait de la Jamaïque de la Fédération des Antilles, Trinité-et-Tobago a déclaré son indépendance. Trinité-et-Tobago, l'une des plus anciennes colonies de la région sous l'empire britannique, n'a plus d'autonomie depuis 1498, lorsque Colomb y est tombé comme un imbécile maladroit. Le destin des deux îles étant entre leurs mains, nombreux sont ceux qui se demandent quelle direction ils prendront."
 decolonization.56.d:0 "Après que notre gouvernement ait finalement réussi à atteindre un niveau d'accord satisfaisant dans les négociations avec le plus grand parti local, le Parti national du Suriname, nous sommes en mesure de donner officiellement suite à l'indépendance du Suriname. En raison de leur petite population et du manque d'infrastructures civiles indigènes, nous devons leur donner une série d'injections économiques, qui s'élèveront très probablement à plus de 2,7 milliards de florins néerlandais."
 newsdecolonization.57.d:0 "Suite aux négociations menées par le Parti national du Suriname (NPS), la République du Suriname a été officiellement établie comme la plus récente nation postcoloniale. Le destin tragique de cette situation est cependant qu'un tiers de sa population a choisi d'émigrer aux Pays-Bas pour conserver sa citoyenneté, car beaucoup considèrent le nouvel État comme non viable. Compte tenu de ce manque de ressources, de population et d'infrastructures civiles, les Pays-Bas ont décidé d'accorder une série de financements de développement au cours des 7 prochaines années s'élevant à plus d'un milliard de dollars. Cependant, malgré ces problèmes, de nombreux Surinamiens se réjouissent dans tout le pays, célébrant leur nouvelle nation comme un creuset culturel avec des dizaines de langues parlées et une population descendant d'Afrique, d'Indonésie, d'Inde, des Pays-Bas et des autochtones du nouveau monde."
 surinamedecolonization:0 "§YUn tiers de la population du Suriname arrivera dans notre pays, venant s'ajouter à la communauté surinamienne déjà importante. §RIls constitueront donc notre plus grande minorité ethnique dans de nombreuses zones urbaines, ce qui entraînera des tensions ethniques.§!"