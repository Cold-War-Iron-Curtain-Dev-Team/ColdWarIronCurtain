 decolonization.25.d:0 "La Fédération des Antilles a vu le jour aujourd'hui à la suite de l'adoption de la British Caribbean Federation Act. La nouvelle union politique unit plus de vingt îles principales et près de deux cent cinquante îles plus petites en dix provinces dotées d'un centre fédéral. Les Britanniques espèrent que la Fédération sera en mesure de transformer ses anciennes îles coloniales en un État totalement indépendant. Londres considère la Fédération comme une réponse à la pression croissante exercée par les sujets des îles en faveur de l'indépendance, tout en garantissant que l'indépendance se traduira par un État viable et non dépendant de Londres. Certains habitants, notamment ceux des grandes îles, accueillent avec prudence ce nouvel État, mais expriment leur inquiétude quant au degré de centralisation de la Fédération. Certains militants anticoloniaux voient la Fédération comme une simple exploitation britannique continue et seule une indépendance immédiate mettrait fin à des siècles d'oppression coloniale envers les habitants des îles. Cependant, il semble que la plupart des gens accueillent favorablement cette nouvelle et espèrent qu'elle marquera une nouvelle période d'indépendance et de développement pour le peuple."
