 decolonization.27.d:0 "São Tomé et Príncipe était une colonie portugaise depuis l'arrivée des Portugais sur les îles inhabitées à la fin du XVe siècle. C'est devenu un site de plantations de canne à sucre et un centre majeur de traite négrière dans la région. Finalement, le cacao et le café sont également devenus des exportations majeures de l'île, mais son histoire d'esclavage et de travail forcé a assombri les relations entre la population africaine majoritaire des îles et le Portugal. Alors que la clameur en faveur de la décolonisation grandissait après la Seconde Guerre mondiale, un parti socialiste de São Toméens s'est formé, appelé Mouvement pour la libération de São Tomé et Príncipe (MLSTP). Bien que le MLSTP ne se soit pas livré à la violence, il a néanmoins établi une base et plaidé contre le colonialisme portugais. Suite à la décision du Portugal d'adopter la décolonisation, les autorités coloniales locales se sont engagées dans le MLSTP et ont entamé une transition vers l'indépendance des îles. Lors d'un référendum national, le peuple a voté pour une assemblée constituante où le MLSTP a remporté tous les sièges, marquant la fin de la domination portugaise sur l'île. Le leader du MLSTP, Manuel Pinto da Costa, devrait devenir chef de l'État de la nouvelle nation."
