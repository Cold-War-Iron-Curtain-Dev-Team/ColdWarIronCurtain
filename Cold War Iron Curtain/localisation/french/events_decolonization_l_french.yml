 decolonization.26.d:0 "La lutte anticoloniale en Guinée portugaise et au Cap-Vert a continué de se rapprocher de la paix. Lors d'un référendum organisé au Cap-Vert, la population de l'île a voté massivement en faveur de l'acceptation d'une Assemblée nationale indépendante présentée par le Parti africain pour l'indépendance de la Guinée et du Cap-Vert (PAIGC). L'autre option était de rejeter l'indépendance du Portugal. Bien qu'aucune activité anticoloniale violente n'ait eu lieu au Cap-Vert, les Cap-Verdiens ont participé activement au conflit sur le continent et comptaient plusieurs hommes politiques de premier plan au sein du PAIGC. Aristides Pereira, membre éminent du parti et Cap-Verdien, devrait prendre le pouvoir une fois le Portugal officiellement parti. Il a occupé des postes élevés au sein du PAIGC et a aidé à organiser des grèves et des manifestations anticoloniales au Cap-Vert, garantissant ainsi que son peuple était engagé dans la lutte pour l'indépendance. Le référendum reflète la transition portugaise vers la décolonisation pour résoudre le conflit en Guinée portugaise. La seule pierre d'achoppement potentielle pour le nouvel État du Cap-Vert est le débat interne sur la question de savoir si le pays doit rechercher l'unification avec la Guinée-Bissau ou maintenir son indépendance."
