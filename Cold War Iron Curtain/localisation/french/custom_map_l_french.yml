 state_religion_map_mode_tooltip_delayed: "Les États sont colorés par leur religion à pluralité §Y§!. Gray signifie qu'aucune religion ne mène à elle seule."

 MAPMODE_HDI_MAP_MODE_NAME:0 "IDH de l'État $MAPMODE_CONSTANT$"
 MAPMODE_HDI_MAP_MODE:0 "IDH de l'État"
 MAPMODE_HDI_MAP_MODE_DESCRIPTION:0 "Affiche l'indice de développement humain de chaque État, reflétant le niveau de vie, l'éducation et les conditions économiques locales."

 hdi_map_mode_tooltip:0 "IDH de l'État : §Y[?From.State_HDI]§! $MAPMODE_CONSTANT$"
 hdi_map_mode_tooltip_delayed:0 "L'indice de développement humain §Y§! (IDH) représente la qualité de vie globale au sein d'un État.\n\nIl reflète §Gl'éducation§!, §Yle revenu§!et §Cla santé§! les résultats, ainsi que l'accès aux infrastructures et au développement à long terme.\n\n§CLes États à IDH élevé§! sont plus §Gproductifs§!, §Gstables§!et résilients, tandis que les États à IDH faible §R§! souffrent de faiblesses structurelles et de tensions sociales."
 
 MAPMODE_NATIONAL_HDI_MAP_MODE_NAME:0 "IDH national"
 MAPMODE_NATIONAL_HDI_MAP_MODE:0 "IDH national $MAPMODE_CONSTANT$"
 MAPMODE_NATIONAL_HDI_MAP_MODE_DESCRIPTION:0 "Affiche l'indice de développement humain global de chaque pays."

 national_hdi_map_mode_tooltip:0 "IDH national : §Y[?From.owner:National_HDI]§!"
 national_hdi_map_mode_tooltip_delayed:0 "L'indice national de développement humain §Y§! (IDH) mesure le niveau moyen de développement dans l'ensemble d'un pays.\n\nIl résume §Gla performance économique§!, §Cla capacité éducative§!et §Yl'investissement social§! à un niveau stratégique.\n\nLes pays avec un IDH §Ctrès élevé§! ont tendance à posséder des institutions plus solides, une cohésion sociale plus élevée et une plus grande stabilité à long terme."

