l_french:
 # Constants:
 MAPMODE_CONSTANT: "Mode Carte"

 # Map Modes:
 fallout_core_map_mode: "États centraux"
 MAPMODE_FALLOUT_CORE_MAP_MODE: "§Y$fallout_core_map_mode$§! $MAPMODE_CONSTANT$"
 MAPMODE_FALLOUT_CORE_MAP_MODE_NAME: "$fallout_core_map_mode$"
 MAPMODE_FALLOUT_CORE_MAP_MODE_DESCRIPTION: "Affiche nos États centraux, les États non centraux et les États occupés dans différentes couleurs."
 fallout_core_map_mode_tooltip: "[From.GetFalloutCoreMapModeTooltip]"
 fallout_core_map_mode_tooltip_delayed: "[From.GetFalloutCoreMapModeTooltipDelayed]"

 fallout_stability_map_mode: "$STABILITY$"
 MAPMODE_FALLOUT_STABILITY_MAP_MODE: "§Y$fallout_stability_map_mode$§! $MAPMODE_CONSTANT$"
 MAPMODE_FALLOUT_STABILITY_MAP_MODE_NAME: "$fallout_stability_map_mode$"
 MAPMODE_FALLOUT_STABILITY_MAP_MODE_DESCRIPTION: "Montre le degré de stabilité de chaque pays."
 fallout_stability_map_mode_tooltip: "§Y[From.owner.GetNameWithFlag]§! a actuellement une stabilité de §Y[?From.owner:stability|2%]§!."
 fallout_stability_map_mode_tooltip_delayed: "[From.owner.GetFalloutStabilityMapModeTooltipDelayed]"

 fallout_war_support_map_mode: "$WAR_SUPPORT$"
 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE: "§Y$fallout_war_support_map_mode$§! $MAPMODE_CONSTANT$"
 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE_NAME: "$fallout_war_support_map_mode$"
 MAPMODE_FALLOUT_WAR_SUPPORT_MAP_MODE_DESCRIPTION: "Montre le soutien de guerre dont dispose chaque pays."
 fallout_war_support_map_mode_tooltip: "§Y[From.owner.GetNameWithFlag]§! a actuellement un soutien de guerre de §Y[?From.owner:has_war_support|2%]§!."
 fallout_war_support_map_mode_tooltip_delayed: "[From.owner.GetFalloutWarSupportMapModeTooltipDelayed]"
 

