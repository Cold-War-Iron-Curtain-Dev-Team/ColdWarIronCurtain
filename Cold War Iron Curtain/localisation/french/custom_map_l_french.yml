 MAPMODE_INFLUENCE_MAP_MODE_NAME:0 "Influence"
 MAPMODE_INFLUENCE_MAP_MODE:0 "Influence"
 MAPMODE_INFLUENCE_MAP_MODE_DESCRIPTION:0 "Montre votre influence dans chaque pays à l'aide d'un gradient de force. Mis à jour chaque semaine."

 influence_map_mode_tooltip:0 "§Y[From.owner.GetNameWithFlag]§!"
 influence_map_mode_tooltip_delayed:0 "Votre force d'influence\n§gGris§! aucune influence\n§RRouge§! faible influence\n§YJaune§! influence modérée\n§GVert§! influence élevée\n\nPrincipaux influenceurs\n1  [?FROM.owner:influence_array^0.GetFlag] [?FROM.owner:influence_array^0.GetName]  §Y[?FROM.owner:influence_array_val^0]%§!\n2  [?FROM.owner:influence_array^1.GetFlag] [?FROM.owner:influence_array^1.GetName]  §Y[?FROM.owner:influence_array_val^1]%§!\n3  [?FROM.owner:influence_array^2.GetFlag] [?FROM.owner:influence_array^2.GetName]  §Y[?FROM.owner:influence_array_val^2]%§!"

 
 MAPMODE_INFLUENCE_SPHERE_MAP_MODE_NAME:0 "Sphères d'influence"
 MAPMODE_INFLUENCE_SPHERE_MAP_MODE:0 "Sphère d'influence"
 MAPMODE_INFLUENCE_SPHERE_MAP_MODE_DESCRIPTION:0 "Montre quels pays appartiennent à une sphère d'influence §Y§! et identifie la puissance dominante exerçant le contrôle."

