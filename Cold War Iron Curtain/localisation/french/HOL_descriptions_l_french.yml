 HOL_GATHERING_STORM_DESC:0 "Cinq ans seulement après notre libération du Reich fasciste, de nouveaux développements ont eu lieu dans notre pays, la décolonisation devenant de plus en plus populaire, l'Indonésie a pris l'initiative de se libérer de nos emprises impériales. En Europe, les tensions sont à un niveau sans précédent entre l'OTAN et le Pacte de Varsovie. Nous avons été historiquement neutres, mais grâce à notre alliance avec la Grande-Bretagne, la France et les États-Unis, nous sommes devenus membre signataire de l'Organisation du Traité de l'Atlantique Nord. Avec la menace d'une guerre nucléaire de la part des États-Unis ou de la Russie, est-ce le bon moment pour choisir son camp ?"

