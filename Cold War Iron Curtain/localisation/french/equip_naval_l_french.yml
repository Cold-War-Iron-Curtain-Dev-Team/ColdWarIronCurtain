 # Sub Engines #
 conventional_sub_engines_0: "Moteurs sous-marins de la Seconde Guerre mondiale"
 conventional_sub_engines_0_short: "Sous-moteurs de la Seconde Guerre mondiale"
 conventional_sub_engines_0_desc: "La plupart des premiers sous-marins utilisaient une connexion mécanique directe entre le moteur à combustion et l'hélice, alternant entre les moteurs diesel pour la navigation en surface et les moteurs électriques pour la propulsion immergée. Il s'agissait en fait d'un type d'hybride « parallèle », puisque le moteur et le moteur étaient couplés au même arbre."

 conventional_sub_engines_1: "Moteurs sous-marins améliorés"
 conventional_sub_engines_1_short: "Sous-moteurs améliorés"
 conventional_sub_engines_1_desc: "En revanche, dans un véritable système de transmission diesel-électrique, l'hélice ou les hélices sont toujours entraînées directement ou via des réducteurs par un ou plusieurs moteurs électriques, tandis qu'un ou plusieurs générateurs diesel fournissent de l'énergie électrique pour charger les batteries et entraîner les moteurs."

 conventional_sub_engines_2: "Moteurs sous-marins avancés"
 conventional_sub_engines_2_short: "Sous-moteurs avancés"
 conventional_sub_engines_2_desc: "Cette technologie utilise un moteur diesel sous-marin qui peut fonctionner de manière conventionnelle en surface, mais qui peut également être alimenté en comburant, généralement stocké sous forme d'oxygène liquide, lorsqu'il est immergé. Étant donné que le métal d'un moteur brûle dans l'oxygène pur, l'oxygène est généralement dilué avec des gaz d'échappement recyclés. L'argon remplace les gaz d'échappement au démarrage du moteur."

 conventional_sub_engines_3: "Moteurs sous-marins Stirling"
 conventional_sub_engines_3_short: "Sous-moteurs Stirling"
 conventional_sub_engines_3_desc: "Un moteur Stirling est un moteur thermique qui fonctionne par compression et expansion cycliques de l'air ou d'un autre gaz (le fluide de travail) à différentes températures, entraînant une conversion nette de l'énergie thermique en travail mécanique. Plus précisément, le moteur Stirling est un moteur thermique régénératif à cycle fermé avec un fluide de travail gazeux permanent. Dans ce contexte, le cycle fermé désigne un système thermodynamique dans lequel le fluide de travail est contenu en permanence dans le système."

 conventional_sub_engines_4: "Moteurs sous-marins à pompe-jet"
 conventional_sub_engines_4_short: "Sous-moteurs à pompe-jet"
 conventional_sub_engines_4_desc: "Vers la fin du XXe siècle, certains sous-marins, comme la classe britannique Vanguard, ont commencé à être équipés de propulseurs à pompe au lieu d'hélices. Bien que celles-ci soient plus lourdes, plus coûteuses et moins efficaces qu'une hélice, elles sont nettement plus silencieuses, offrant ainsi un avantage tactique important."

 nuclear_sub_engines_0: "Premiers moteurs de sous-marins nucléaires"
 nuclear_sub_engines_0_short: "Premiers sous-moteurs nucléaires"
 nuclear_sub_engines_0_desc: "L'un des premiers réacteurs thermiques sous-marins ou STR, également connu sous le nom de réacteur S2W dans l'US Navy, est un réacteur à eau sous pression. L'énergie nucléaire présente un avantage crucial dans la propulsion des sous-marins car il s'agit d'un processus zéro émission qui ne consomme pas d'air. Cela signifie qu'un sous-marin équipé d'un tel réacteur pourrait théoriquement rester immergé indéfiniment."

 nuclear_sub_engines_1: "Moteurs de sous-marins nucléaires améliorés"
 nuclear_sub_engines_1_short: "Sous-moteurs nucléaires améliorés"
 nuclear_sub_engines_1_desc: "L'énergie nucléaire a révolutionné le sous-marin, en faisant enfin un véritable navire « sous-marin », plutôt qu'un engin « submersible », qui ne pouvait rester sous l'eau que pendant des périodes limitées. Il donnait au sous-marin la capacité d'opérer en immersion à des vitesses élevées, comparables à celles des navires de surface, pendant des périodes illimitées, dépendant uniquement de l'endurance de son équipage."

 nuclear_sub_engines_2: "Moteurs de sous-marins nucléaires modernes"
 nuclear_sub_engines_2_short: "Sous-moteurs nucléaires modernes"
 nuclear_sub_engines_2_desc: "Un réacteur à eau sous pression (REP) est un type de réacteur nucléaire à eau légère. Les REP constituent la grande majorité des centrales nucléaires dans le monde (à l'exception notable du Royaume-Uni, du Japon et du Canada). Dans un REP, le liquide de refroidissement primaire (eau) est pompé sous haute pression vers le coeur du réacteur où il est chauffé par l'énergie libérée par la fission des atomes. L'eau chauffée à haute pression s'écoule ensuite vers un générateur de vapeur, où elle transfère son énergie thermique à l'eau à basse pression d'un système secondaire où la vapeur est générée."

 sub_batteries_0: "Batteries sous-marines améliorées"
 sub_batteries_0_short: "Sous-batteries améliorées"
 sub_batteries_0_desc: "Les batteries ont été lancées pour la première fois à la fin de la Seconde Guerre mondiale, sous-marin de type XXI, également connu sous le nom d'Elektroboot ou bateau électrique. Cette conception intègre davantage de batteries pour augmenter le temps qu'un sous-marin peut passer immergé à plusieurs jours, la recharge s'effectuant via un système de plongée. La configuration de la batterie du type XXI est le prédécesseur de nombreux autres sous-marins de la marine, tels que les classes soviétique Whiskey, US Tang, British Porpoise et suédois Hajen."

 sub_batteries_1: "Batteries sous-marines lithium-ion"
 sub_batteries_1_short: "Batteries secondaires au lithium-ion"
 sub_batteries_1_desc: "Ces batteries ont environ le double du stockage électrique des batteries traditionnelles, et en remplaçant les batteries au plomb dans leurs zones de stockage normales et en remplissant le grand espace de coque normalement consacré au moteur AIP et aux réservoirs de carburant avec plusieurs tonnes de batteries lithium-ion."

 sub_batteries_2: "Batteries sous-marines à hydrogène"
 sub_batteries_2_short: "Sous-batteries à hydrogène"
 sub_batteries_2_desc: "Bien que la propulsion hydrogène-oxygène ait été envisagée pour les sous-marins dès la Première Guerre mondiale, le concept n'a pas eu beaucoup de succès. Cela a été contré en stockant le carburant et le comburant dans des réservoirs à l'extérieur de l'espace de l'équipage, entre la coque pressurisée et la coque légère extérieure. Les gaz sont acheminés à travers la coque sous pression jusqu'aux piles à combustible selon les besoins pour produire de l'électricité, mais à tout moment, seule une très petite quantité de gaz est présente dans l'espace de l'équipage."

