 #Battleship/Battlecruiser Hulls in research tree#

 ww_capitals: "Coque de cuirassé de la Seconde Guerre mondiale"
 ww_capitals_desc: "Les puissantes bêtes d'acier de l'époque de la Seconde Guerre mondiale. Bien que la faisabilité du cuirassé et du croiseur de bataille ait été jugée insuffisante, dans de bonnes conditions, ces navires peuvent encore délivrer un coup de poing mortel."

 battle_hull_medium_0: "Coque du croiseur de bataille I"
 battle_hull_medium_1: "Coque du croiseur de bataille II"
 battle_hull_medium_2: "Coque du croiseur de bataille III"
 battle_hull_medium_3: "Coque du croiseur de bataille IV"
 battle_hull_medium_4: "Coque du croiseur de bataille V"
 battle_hull_medium_0_desc: "Coque de cuirassé plus avancée de la fin de la Seconde Guerre mondiale, ces navires sont rapides et assez agiles pour leur taille, avec un excellent armement pour leur époque et le potentiel d'être améliorés avec de nouveaux équipements presque indéfiniment."
 battle_hull_medium_1_desc: "Un grand croiseur ou croiseur de bataille de l'époque de la guerre froide, armé d'une variété d'armes. Certains sont encore équipés de canons de gros calibre d'antan et d'autres sont équipés de nouveaux missiles navire-air et navire-sol."
 battle_hull_medium_2_desc: "Un grand croiseur guidé ou un croiseur de bataille de l'époque de la guerre froide, armé de divers systèmes d'armes pour les engagements de missiles navire-navire, navire-sol ou navire-air."
 battle_hull_medium_3_desc: "Un grand croiseur guidé ou un croiseur de bataille de l'époque de la guerre froide, doté d'un espace permettant aux ressources aériennes d'opérer ainsi qu'un large assortiment mortel de systèmes de missiles spécifiques à la mission."
 battle_hull_medium_4_desc: "Un croiseur lance-missiles ou un croiseur de bataille moderne, armé des dernières technologies en matière de systèmes de missiles ou des premières technologies de canon à rail, peut frapper au-delà de l'horizon comme aucun autre navire avant lui."
  
 #Carrier Hulls in research tree#
 
 carrier_hull_ww: "Coque de transporteur WW2"
 carrier_hull_ww_desc: "Le porte-avions a radicalement changé la guerre navale au cours de la Seconde Guerre mondiale, car la puissance aérienne devenait un facteur important dans la guerre. L'avènement des avions comme armes focales a été motivé par la portée, la flexibilité et l'efficacité supérieures des avions lancés depuis un porte-avions."

 carrier_hull_0: "Coque de transporteur I"
 carrier_hull_1: "Coque de transporteur II"
 carrier_hull_2: "Coque de transporteur III"
 carrier_hull_3: "Coque de transporteur IV"
 carrier_hull_4: "Coque de transporteur V"
 carrier_hull_0_desc: "Un porte-avions de la fin de la Seconde Guerre mondiale, également connu sous le nom de porte-avions de flotte, est le pilier de toute grande force opérationnelle navale et tire de nombreuses leçons des conceptions de porte-avions précédentes."
 carrier_hull_1_desc: "Un porte-avions datant de l'après-Seconde Guerre mondiale. L'avènement de l'ère des avions à réaction et des conceptions de porte-avions à réaction navalisés nécessitent des améliorations jamais vues auparavant. Avec les postes de pilotage inclinés, les déflecteurs de souffle et les supports de systèmes d'atterrissage optiques peuvent être plus efficaces qu'auparavant."
 carrier_hull_2_desc: "Un porte-avions conventionnel de l'époque de la guerre froide avec un poste de pilotage incliné et avec des exigences de taille supplémentaires pour les ailes aériennes plus grandes."
 carrier_hull_3_desc: "Un porte-avions conventionnel de l'époque de la guerre froide avec un poste de pilotage incliné et/ou un tremplin à ski monté et une portée améliorée grâce à des moteurs plus efficaces."
 carrier_hull_4_desc: "Un transporteur conventionnel moderne de l'après-guerre froide, doté de systèmes numériques modernes et de capacités de mise en réseau, comme nouveau pilier de toute grande force opérationnelle."
 
 carrier_hull_light_0: "Coque de transporteur léger I"
 carrier_hull_light_1: "Coque de transporteur léger II"
 carrier_hull_light_2: "Coque de transporteur léger III"
 carrier_hull_light_3: "Coque de transporteur léger IV"
 carrier_hull_light_4: "Coque de transporteur léger V"
 carrier_hull_light_0_desc: "Un avion léger ou un porte-avions d'escorte datant de la Seconde Guerre mondiale, moins cher à produire et, par conséquent, transportant également moins d'avions."
 carrier_hull_light_1_desc: "Un porte-avions léger du début de la Guerre froide. À cette époque, les porte-avions légers étaient souvent utilisés pour la défense de la flotte, la guerre anti-sous-marine ou le déploiement d'infanterie navale ou de marines via des hélicoptères vers une zone d'atterrissage."
 carrier_hull_light_2_desc: "Un transporteur léger ou un quai de plate-forme d'atterrissage de l'époque de la guerre froide, utilisé soit pour la défense de la flotte, soit pour la guerre anti-sous-marine, soit comme navire d'assaut amphibie déployant des troupes à terre via des hélicoptères et des péniches de débarquement situées dans un pont de coffre."
 carrier_hull_light_3_desc: "Un porte-avions léger ou un navire d'assaut amphibie avancé de l'ère de la guerre froide, capable de déployer une infanterie navale ou des marines ou de déployer une plus grande quantité d'avions légers pour la défense de la flotte ou des frappes sur les positions ennemies à l'appui des forces terrestres."
 carrier_hull_light_4_desc: "Un porte-avions léger moderne ou un navire d'assaut amphibie capable d'embarquer une grande quantité de différents types d'avions pour une variété de rôles."
 
 carrier_hull_super_1: "Coque Supercarrier I"
 carrier_hull_super_2: "Coque de supercarrier II"
 carrier_hull_super_3: "Coque de supercarrier III"
 carrier_hull_super_4: "Coque de supercarrier IV"
 carrier_hull_super_1_desc: "L'introduction de l'ère nucléaire et l'adoption de réacteurs navalisés plus petits permettent à ces grands navires non seulement de transporter de grandes ailes aériennes, mais également de rester en mer presque indéfiniment."
 carrier_hull_super_2_desc: "Une conception de super porte-avions mise à jour avec des réacteurs plus efficaces et la capacité de transporter encore plus d'avions."
 carrier_hull_super_3_desc: "Une conception avancée de super porte-avions de la fin de la Guerre froide, dotée d'un effectif massif d'avions et de réacteurs améliorés."
 carrier_hull_super_4_desc: "Une conception de super porte-avions moderne avec des réacteurs encore améliorés, un effectif massif d'avions et la capacité de les lancer rapidement et efficacement en utilisant des catapultes améliorées."
 
 # Submarine Hulls #
 
 sub_hull_ww: "Sous-marin du début de la Seconde Guerre mondiale"
 sub_hull_ww_desc: "Un sous-marin conventionnel du début de la Seconde Guerre mondiale qui était considéré comme le fléau de tous les convois qui avaient la malchance d'en rencontrer un ou pire, plusieurs."

 sub_hull_small_single_0: "Petit sous-marin I"
 sub_hull_small_single_0_desc: "Petit sous-marin de l'après-Seconde Guerre mondiale, en aucun cas un mini ou un micro-sous-marin, ces sous-marins peuvent toujours être considérés comme assez grands et en partie les véritables héritiers de l'héritage des sous-marins de la Seconde Guerre mondiale en ce qui concerne leurs capacités."
 sub_hull_small_single_1: "Petit sous-marin II"
 sub_hull_small_single_1_desc: "Un petit sous-marin de la guerre froide avec une coque en forme de larme. Cette conception est plus efficace que les sous-marins précédents dotés d'une coque conventionnelle."
 sub_hull_small_single_2: "Petit sous-marin III"
 sub_hull_small_single_2_desc: "Un petit sous-marin abordable de l'époque de la guerre froide doté d'un système de propulsion conventionnel. qui peut frapper depuis les profondeurs et est difficile à détecter."
 sub_hull_small_single_3: "Petit sous-marin IV"
 sub_hull_small_single_3_desc: "Un petit sous-marin amélioré du début de l'ère moderne. Ces sous-marins sont silencieux et, grâce au sonar, les matériaux absorbants sont très difficiles à détecter."
 sub_hull_small_single_4: "Petit sous-marin V"
 sub_hull_small_single_4_desc: "Un sous-marin conventionnel de l'ère moderne est un outil abordable dans les boîtes à outils navales de nombreux pays et leur permet de projeter une force qu'ils ne pourraient autrement pas."

 sub_hull_large_single_0: "Sous-marin de la fin de la Seconde Guerre mondiale"
 sub_hull_large_single_0_desc: "Un sous-marin conventionnel de la fin de la Seconde Guerre mondiale doté d'une navigation améliorée et d'un tuba capable de le maintenir immergé plus longtemps."
 sub_hull_large_single_1: "Sous-marin d'après-guerre"
 sub_hull_large_single_1_desc: "Un sous-marin de l'après-Seconde Guerre mondiale prenant en compte toutes les leçons apprises pendant cette période. Ces sous-marins peuvent rester immergés bien plus longtemps que cela n'était possible auparavant."
 sub_hull_large_single_2: "Sous-marin d'attaque I"
 sub_hull_large_single_2_desc: "Un sous-marin d'attaque du début de la guerre froide avec une coque en forme de larme. Cette conception est plus efficace que les sous-marins précédents dotés d'une coque conventionnelle."
 sub_hull_large_single_3: "Sous-marin d'attaque II"
 sub_hull_large_single_3_desc: "Avec la conception de la coque en forme de larme normalisée, cette coque de sous-marin de l'ère de la guerre froide est encore améliorée en mettant en oeuvre la furtivité, ce qui rend la détection par les navires ennemis encore plus difficile."
 sub_hull_large_single_4: "Sous-marin d'attaque III"
 sub_hull_large_single_4_desc: "Une conception avancée de la fin de la Guerre froide intégrant des technologies furtives avancées pour réduire encore plus la détection et capable d'être armé d'une variété d'armes."
 #sub_hull_large_single_5: "Attack Submarine IV"
 #sub_hull_large_single_5_desc: ""
 #sub_hull_large_single_6: "Attack Submarine V"
 #sub_hull_large_single_6_desc: ""
 #sub_hull_large_single_7: "Attack Submarine VI"
 #sub_hull_large_single_7_desc: ""

 sub_hull_large_double_0: "Grand sous-marin I"
 sub_hull_large_double_0_desc: "Un grand sous-marin dont le rôle principal est d'être armé de missiles de croisière ou balistiques propulsés par des moteurs conventionnels ou nucléaires."
 sub_hull_large_double_1: "Grand sous-marin II"
 sub_hull_large_double_1_desc: "Une conception plus aboutie d'un grand sous-marin capable de lancer des missiles balistiques est le pilier de la dette nucléaire de tout pays."
 sub_hull_large_double_2: "Grand sous-marin III"
 sub_hull_large_double_2_desc: "Un grand sous-marin capable de lancer des missiles balistiques avec une coque moderne qui réduit sa capacité à être détecté par ses ennemis."
 sub_hull_large_double_3: "Grand sous-marin IV"
 sub_hull_large_double_3_desc: "Un grand sous-marin moderne capable de lancer des missiles balistiques avec une portée véritablement mondiale. En tant que detterent, cette conception mortelle et silencieuse est capable d'une plus grande portée que n'importe lequel de ses prédécesseurs."
 #sub_hull_large_double_4: "Large Submarine V"
 #sub_hull_large_double_4_desc: ""

 sub_hull_mega_double: "Méga sous-marin"
 sub_hull_mega_double_desc: ""

