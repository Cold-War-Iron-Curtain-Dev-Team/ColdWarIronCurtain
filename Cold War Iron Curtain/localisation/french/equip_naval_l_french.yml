 battle_hull_light_1: "Croiseur II"
 battle_hull_light_1_desc: "Une première conception améliorée de croiseur lance-missiles avec des capacités de capteurs et un armement adaptés à sa mission."
 battle_hull_light_2: "Croiseur III"
