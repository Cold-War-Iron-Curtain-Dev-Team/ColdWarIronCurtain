 battle_hull_light_ww_desc: ""

 ww_screens: "Navires à écran de la Seconde Guerre mondiale"
 ww_screens_desc: "Les navires-écrans pendant la Seconde Guerre mondiale étaient relativement petits par rapport aux navires plus gros tels que les cuirassés. Les destroyers, les escortes et les croiseurs légers étaient les classifications les plus courantes de navires-écrans à l'époque de la Seconde Guerre mondiale. Bien que les navires écrans de la Seconde Guerre mondiale constituent une base importante, il leur manque de nombreux systèmes importants nécessaires pour prendre en charge les modules modernes et les faire fonctionner correctement. De plus, les nouvelles innovations en électronique et en informatique ont conduit à des changements fondamentaux dans les doctrines et les mandats de conception et, en tant que tels, ils ne peuvent pas être mis en service ou rééquipés avec des modules qui nécessitent ces innovations, comme des armes spéciales ou des équipements électroniques modernes."

