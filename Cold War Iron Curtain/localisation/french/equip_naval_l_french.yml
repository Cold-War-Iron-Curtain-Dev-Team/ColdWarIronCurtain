 ship_armament_light_0_desc: "Armements de navires légers de l'après-Seconde Guerre mondiale, d'apparence similaire mais avec des matériaux plus récents."
 ship_armament_light_1_desc: "Armements de navires légers du début de la Guerre froide, dotés de canons à tir rapide et de faible calibre."
 ship_armament_light_2_desc: "Armements de navires légers de l'époque de la guerre froide, dotés de canons à tir rapide et de faible calibre."
 ship_armament_light_3_desc: "Armements de navires légers de l'époque de la guerre froide, dotés de canons à tir rapide de faible calibre et de fusibles améliorés."
 ship_armament_light_4_desc: "Canons automatiques à tir rapide de l'époque de la guerre froide, capables de tirer efficacement à portée de tir."
 ship_armament_light_5_desc: "Canons automatiques à tir rapide de la fin de la guerre froide, capables de tirer efficacement à portée de tir."
 ship_armament_light_6_desc: "Canons automatiques modernes à tir rapide de petit calibre avec fusées programmables pour un impact maximal."
 
 ship_armament_heavy_ww: "Armement lourd de la Seconde Guerre mondiale"
 ship_armament_heavy_0: "Armement lourd I"
 ship_armament_heavy_1: "Armement lourd II"
 ship_armament_heavy_2: "Armement lourd III"
 ship_armament_heavy_3: "Armement lourd IV"
 ship_armament_heavy_ww_desc: "Armements de gros calibre produits pendant la Seconde Guerre mondiale."
 ship_armament_heavy_0_desc: "Armements de navires lourds de l'après-Seconde Guerre mondiale, d'apparence similaire mais avec des matériaux plus récents."
 ship_armament_heavy_1_desc: "Armements de navires lourds de l'époque de la guerre froide, dotés de canons à tir rapide d'un calibre similaire."
 ship_armament_heavy_2_desc: "Canons automatiques de gros calibre à tir rapide de l'époque de la guerre froide, capables de tirer efficacement à portée de tir."
 ship_armament_heavy_3_desc: "Un railgun est un dispositif à moteur linéaire, généralement conçu comme une arme, qui utilise la force électromagnétique pour lancer des projectiles à grande vitesse. Le projectile ne contient normalement pas d'explosifs, mais compte plutôt sur sa vitesse, sa masse et son énergie cinétique élevées pour infliger des dégâts."

 ship_armament_super_heavy_0: "Armement super lourd I"
 ship_armament_super_heavy_1: "Armement super lourd II"
 ship_armament_super_heavy_0_desc: "Armements de navires super lourds de l'époque de la guerre froide, d'un calibre incroyablement gros qui peuvent causer des dégâts incroyables."
 ship_armament_super_heavy_1_desc: "La fin de la guerre froide a amélioré les armements des navires super lourds d'un calibre impressionnant qui peuvent causer des dégâts incroyables."

