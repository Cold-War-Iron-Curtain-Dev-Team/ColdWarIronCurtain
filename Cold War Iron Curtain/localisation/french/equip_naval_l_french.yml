 screen_hull_medium_0: "Frégate I"
 screen_hull_medium_0_desc: "Un destroyer d'escorte ou une première frégate de la fin de la Seconde Guerre mondiale, souvent chargé d'escorter des convois ou d'autres navires de guerre."
 screen_hull_medium_1: "Frégate II"
 screen_hull_medium_1_desc: "Une frégate du début de la Guerre froide armée d'une plus grande variété d'armes que ses prédécesseurs. Pour sa petite taille, il peut contenir beaucoup de punch."
 screen_hull_medium_2: "Frégate III"
 screen_hull_medium_2_desc: "Une frégate de l'époque de la guerre froide dotée d'un assortiment d'armes, de systèmes de capteurs performants et largement destinée à escorter des convois ou d'autres navires de guerre."
 screen_hull_medium_3: "Frégate IV"
 screen_hull_medium_3_desc: "Une frégate avancée de la guerre froide dotée de systèmes d'armes modernes, de capteurs chargés d'escorter les convois, d'assurer la sécurité dans une zone ou de protéger d'autres navires de guerre plus grands faisant partie d'une flotte."
 screen_hull_medium_4: "Frégate V"
 screen_hull_medium_4_desc: "Une frégate moderne dotée d'une grande variété d'armes et de capteurs capables d'effectuer des opérations à longue distance sans soutien."
 #screen_hull_medium_5: "Frigate VI"
 #screen_hull_medium_5_desc: ""
 #screen_hull_medium_6: "Frigate VII"
 #screen_hull_medium_6_desc: ""
 
 screen_hull_heavy_0: "Destructeur I"
 screen_hull_heavy_0_desc: "Un navire de guerre rapide, maniable et de longue endurance du début de la Guerre froide, destiné à escorter les plus gros navires d'une flotte, d'un convoi ou d'un groupement tactique et à les défendre contre de puissants attaquants à courte portée."
 screen_hull_heavy_1: "Destructeur II"
 screen_hull_heavy_1_desc: "Un navire de guerre de taille moyenne datant de la guerre froide, armé des premières armes navire-air afin de protéger les plus gros navires des attaques aériennes ennemies. Ces navires sont cependant tout à fait capables d'agir seuls."
 screen_hull_heavy_2: "Destructeur III"
 screen_hull_heavy_2_desc: "Un navire de guerre amélioré de l'ère de la guerre froide, doté de capteurs performants et d'un armement navire-air décent qu'il utilise pour se défendre ou défendre d'autres navires contre les attaques."
 screen_hull_heavy_3: "Destructeur IV"
 screen_hull_heavy_3_desc: "Un navire de guerre de taille moyenne du début de l'ère moderne doté d'excellents capteurs pour trouver et défendre les menaces contre les navires ou les zones qu'il est chargé de défendre."
 screen_hull_heavy_4: "Destructeur V"
 screen_hull_heavy_4_desc: "Un navire de guerre moderne de taille moyenne doté d'un équipement sensoriel et d'armes modernes et avancés avec lesquels il peut se défendre ou défendre les autres contre les attaques."
