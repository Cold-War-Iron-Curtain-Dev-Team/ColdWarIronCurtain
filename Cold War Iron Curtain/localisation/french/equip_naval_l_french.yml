 # ARMAMENTS #
 ww_armaments: "Armements de la Seconde Guerre mondiale"
 ww_armaments_desc: "Armements de léger et moyen calibre produits pendant la Seconde Guerre mondiale."
 
 ship_armament_aa_0: "AA Je"
 ship_armament_aa_1: "AA II"
 ship_armament_aa_2: "CIWS JE"
 ship_armament_aa_3: "CIWS II"
 ship_armament_aa_4: "CIWS III"
 ship_armament_aa_0_desc: "Les canons anti-aériens de la Seconde Guerre mondiale se sont révélés de fidèles défenseurs contre les menaces aériennes, des canons lourds aux mitrailleuses rapides. Pilotés par des équipages qualifiés, ces canons protégeaient les navires et déclenchaient des barrages pour contrecarrer les bombardiers et les chasseurs ennemis."
 ship_armament_aa_1_desc: "Les canons anti-aériens de la Seconde Guerre mondiale se sont révélés de fidèles défenseurs contre les menaces aériennes, des canons lourds aux mitrailleuses rapides. Pilotés par des équipages qualifiés, ces canons protégeaient les navires et déclenchaient des barrages pour contrecarrer les bombardiers et les chasseurs ennemis."
 ship_armament_aa_2_desc: "Le système d'armes rapprochées (CIWS) est un mécanisme de défense de pointe sur les navires militaires, offrant une protection rapide et précise contre les menaces entrantes. Équipé de capteurs et de systèmes de ciblage avancés, le CIWS détecte et neutralise rapidement les dangers à l'aide de canons Gatling situés à des endroits stratégiquement positionnés à travers le navire. Ce système de haute technologie représente le summum de la défense maritime, garantissant une réponse rapide pour protéger les navires contre l'évolution des menaces."
 ship_armament_aa_3_desc: "Le système d'armes rapprochées (CIWS) est un mécanisme de défense de pointe sur les navires militaires, offrant une protection rapide et précise contre les menaces entrantes. Équipé de capteurs et de systèmes de ciblage avancés, le CIWS détecte et neutralise rapidement les dangers à l'aide de canons Gatling situés à des endroits stratégiquement positionnés à travers le navire. Ce système de haute technologie représente le summum de la défense maritime, garantissant une réponse rapide pour protéger les navires contre l'évolution des menaces."
 ship_armament_aa_4_desc: "Le système d'armes rapprochées (CIWS) est un mécanisme de défense de pointe sur les navires militaires, offrant une protection rapide et précise contre les menaces entrantes. Équipé de capteurs et de systèmes de ciblage avancés, le CIWS détecte et neutralise rapidement les dangers à l'aide de canons Gatling situés à des endroits stratégiquement positionnés à travers le navire. Ce système de haute technologie représente le summum de la défense maritime, garantissant une réponse rapide pour protéger les navires contre l'évolution des menaces."
 
