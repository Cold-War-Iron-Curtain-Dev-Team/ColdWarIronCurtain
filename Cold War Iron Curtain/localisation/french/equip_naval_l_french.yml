 vls_0: "VLS JE"
 vls_0_desc: "Le système de lancement vertical (VLS) est un système avancé permettant de maintenir et de tirer des missiles sur des plates-formes navales mobiles, telles que des navires de surface et des sous-marins. Chaque système de lancement vertical se compose d'un certain nombre de cellules pouvant contenir un ou plusieurs missiles prêts à être tirés."
