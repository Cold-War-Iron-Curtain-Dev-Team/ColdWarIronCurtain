 subkiller_4: "Torpilles guidées lancées par missiles ASW"
 subkiller_5: "Missiles de croisière ASW"
 subkiller_6: "Torpilles anti-torpilles"

 subkiller_0_short: "Hérissons"
 subkiller_1_short: "Roquettes ASW"
 subkiller_2_short: "Torpilles ASW"
 subkiller_3_short: "Torpilles ASW améliorées"
 subkiller_4_short: "Torpilles lance-missiles"
 subkiller_5_short: "Missiles de croisière ASW"
 subkiller_6_short: "Torpilles anti-torpilles"

 subkiller_1_desc: "Le Hérisson (également connu sous le nom de projecteur anti-sous-marin) était une arme anti-sous-marine à projection vers l'avant qui était principalement utilisée pendant la Seconde Guerre mondiale. L'appareil, développé par la Royal Navy, a tiré jusqu'à 24 mortiers à broche devant un navire lors de l'attaque d'un sous-marin."
 subkiller_2_desc: "Un lance-roquettes anti-sous-marin est un système de lance-roquettes de guerre anti-sous-marine (ASW) avancé. Son principe est similaire au système Royal Navy Hedgehog utilisé pendant la Seconde Guerre mondiale. Sauf que les projectiles sont propulsés par fusée."
 subkiller_3_desc: "Les premières torpilles anti-sous-marines étaient de type droit et généralement un groupe était tiré au cas où la cible manoeuvrait. Ils peuvent être divisés en deux types principaux : les lourds, tirés depuis des sous-marins, et les légers, tirés depuis des navires."
 subkiller_4_desc: "Des progrès supplémentaires dans le domaine des torpilles anti-sous-marines signifient qu'elles sont devenues plus complètes qu'avant. Ces torpilles peuvent désormais également être larguées depuis des avions (à voilure fixe et des hélicoptères) et lancées par un système de fusée ou de missile."
 subkiller_5_desc: "Les progrès réalisés dans le domaine des torpilles anti-sous-marines signifient qu'elles sont devenues plus efficaces qu'auparavant. Ces torpilles avancées peuvent désormais également être larguées depuis des avions (à voilure fixe et hélicoptères) et lancées par un système de fusée ou de missile à des vitesses et des forces G plus élevées qu'auparavant."
 subkiller_6_desc: "Une torpille anti-torpille vise à détruire les torpilles à guidage acoustique, filoguidées, non filoguidées et à guidage par sillage qui sont lancées contre des navires de surface et des sous-marins."
 
