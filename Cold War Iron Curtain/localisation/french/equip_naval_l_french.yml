 ###################################################################
 ########## MAN THE GUNS [MTG] TECHNOLOGIES AND EQUIPMENT ##########
 ###################################################################
 
 #Subs, Torpedoes
 #Small Torpedoes
 ww_submarines: "Sous-marins de la Seconde Guerre mondiale"
 ww_submarines_desc: "Les sous-marins de la Seconde Guerre mondiale étaient rudimentaires par rapport aux variantes plus modernes. Beaucoup d'entre eux devaient rester hors de l'eau pendant de longues périodes avant de plonger en raison de la difficulté qu'ils avaient à stocker et à acquérir de l'air. Les sous-marins jouent un rôle principalement offensif dans les combats navals en utilisant des torpilles pour éliminer les navires ennemis et sont également utilisés pour abattre des navires de transport mal défendus. Bien que basiques, les sous-marins de la Seconde Guerre mondiale peuvent toujours remplir ce rôle naval crucial et valent mieux que de ne pas avoir de sous-marins du tout."
 torpedo_ww: "Torpilles de la Seconde Guerre mondiale"
 torpedo_ww_desc: "Les torpilles de la Seconde Guerre mondiale étaient des torpilles antinavires comparables aux torpilles légères des marines modernes. Pendant la guerre froide, les torpilles étaient exclusivement utilisées dans les sous-marins, il n'y a donc aucune mise à niveau disponible pour ce module de torpilles obsolète de la Seconde Guerre mondiale."
 torpedo_small_0: "Petites torpilles I"
 torpedo_small_0_desc: "Les torpilles du début de l'après-guerre suivaient la plupart des principes de conception des torpilles de la fin de la guerre, notamment les moteurs électriques et la détonation par contact avec guidage gyroscope. Cependant, les torpilles d'après-guerre incluraient également des composants plus récents, notamment un sonar de croisière passif. En plus des améliorations du guidage et de l'ajout du système de guidage, ils avaient également une plus grande capacité de dégâts et des portées, profondeurs et vitesses considérablement étendues."
 torpedo_small_1: "Petites torpilles II"
 torpedo_small_1_desc: "En suivant les premières conceptions et en les améliorant, les petites torpilles ultérieures ont commencé à inclure une technologie plus avancée telle que le guidage Doppler actif et de meilleures ogives nucléaires pour les explosifs. Ces torpilles comportaient également des hélices optimisées pour une plus grande agilité et vitesse et des matériaux modernes qui pourraient leur permettre d'être déployées à des profondeurs bien plus grandes. Cette flexibilité et cette agilité permettent aux sous-marins d'adopter des positions plus optimales ou cachées et d'attaquer dans des zones plus difficiles à défendre ou à contourner pour l'ennemi."
 torpedo_small_2: "Petites torpilles III"
 torpedo_small_2_desc: "En continuant à améliorer la technologie des torpilles, les torpilles de cette époque ont été complètement repensées et ont remplacé la plupart des doctrines des torpilles de la Seconde Guerre mondiale. Les torpilles améliorées comprennent des jets à pompe et des moteurs à pistons à plateau oscillant avec des carburants monoergols. En plus de cela, les ogives ont été améliorées avec des explosifs et des détonateurs de proximité plus performants. Ces torpilles sont également améliorées par l'ajout de meilleurs systèmes de guidage actif pour les aider à rechercher et à engager activement des cibles. Il convient également de noter que les torpilles de cette époque ont commencé à adopter des métaux ou des alliages plus légers partout où cela était possible, ce qui leur a permis d'être plus légères et plus résistantes que jamais."
 torpedo_small_3: "Petites torpilles IV"
 torpedo_small_3_desc: "Les torpilles modernes présentaient une meilleure acoustique, une meilleure électronique et de meilleurs matériaux. Ces torpilles modernes peuvent même revenir en arrière en cas d'échec et tenter une autre attaque si elles ont le carburant. De plus, une meilleure acoustique et une meilleure électronique peuvent réduire considérablement le nombre de ratés de première chance. Toutes ces améliorations permettent aux torpilles d'atteindre de nouveaux sommets de létalité."
 torpedo_small_4: "Petites torpilles V"
 torpedo_small_4_desc: "Le nouveau siècle apporte de nouvelles technologies et de nouveaux défis pour les torpilles. Les contre-mesures, les défenses et les matériaux améliorés de l'ère moderne se sont prêtés au besoin de meilleurs systèmes de guidage, d'une plus grande vitesse et d'explosifs plus puissants. La technologie CBASS (Common Broadband and Advanced Sonar System) permet aux torpilles avancées d'engager des cibles beaucoup plus éloignées. Les optimisations de l'intégrité structurelle et des systèmes de propulsion permettent de les utiliser à de plus grandes profondeurs. Ces sous-marins peuvent également surveiller les champs électriques et magnétiques environnants pour activer des fusées de détonation de haute précision et permettre un guidage actif pour frapper les navires dans des emplacements privilégiés."
 
 #Large Torpedoes
 torpedo_large_0: "Grandes torpilles I"
 torpedo_large_0_desc: "En augmentant simplement la quantité d'explosifs et en augmentant la taille des systèmes de guidage et des moteurs des torpilles, vous pouvez augmenter considérablement leur puissance de feu. Cela nécessite cependant le développement d'une meilleure structure et d'un système moteur étendu pour supporter l'augmentation du poids. Diverses améliorations apportées à ces champs ont permis le développement de torpilles plus grandes et plus puissantes après la guerre."
 torpedo_large_1: "Grandes torpilles II"
 torpedo_large_1_desc: "Alors que les grands navires ont commencé à perdre la faveur de la plupart des marines, y compris certaines marines abandonnant complètement les croiseurs lourds/de bataille au profit de croiseurs plus nombreux et plus difficiles à atteindre, le besoin de torpilles plus puissantes n'a pas pris fin. Des niveaux plus élevés de technologie anti-sous et de technologie de détection sous ont créé le besoin de torpilles à plus longue portée. La solution la plus simple consiste simplement à créer des torpilles plus grosses, capables de contenir plus de carburant et dotées de moteurs plus puissants pour aller plus loin et atteindre leurs cibles de plus loin. Cela donne cependant une plus grande importance à la nécessité de meilleurs systèmes de guidage et d'une capacité de ciblage à longue portée des sous-marins, ce qui rend le problème plus complexe que le simple fait d'avoir une torpille plus grosse."
 torpedo_large_2: "Grandes torpilles III"
 torpedo_large_2_desc: "Les nouvelles doctrines et les nouvelles routes empruntées dans la conception des torpilles rendent obsolètes les anciennes méthodes de tir des torpilles. Augmenter la taille des moteurs à pistons à plateau oscillant et des jets de pompe n'est pas aussi facile dans l'enceinte d'une torpille que sur un navire. De nombreuses structures arrière de la torpille devaient être modernisées et redessinées. Cependant, grâce aux nouvelles technologies, cette torpille était plus facile à créer que les anciennes torpilles lourdes."
 torpedo_large_3: "Grandes torpilles IV"
 torpedo_large_3_desc: "L'une des principales améliorations apportées au développement des torpilles modernes était la possibilité de revenir en arrière pour un autre tir sur un ennemi manqué. Afin d'équiper les torpilles lourdes de cette capacité, la structure devait être plus légère et les moteurs mis à jour."

 #SLBM
 slbm_tube_1: "Tube SLBM I"
 slbm_tube_1_desc: "Le premier tube SLBM était basique et les premiers modèles avaient une capacité très limitée. Les premiers tubes SLBM étaient basés sur le tube lance-torpilles avec de lourdes modifications apportées pour s'adapter à la nouvelle arme. Cependant, la majeure partie du coût du développement de systèmes sous-marins capables de lancer des armes nucléaires concernait les systèmes électroniques étendus nécessaires au ciblage et à l'orientation du missile plutôt que de le maintenir eux-mêmes. Malgré l'incroyable investissement et les fondations nécessaires au développement du tube SLBM, les sous-marins avaient une portée et une capacité de ciblage très limitées en raison de la nature primitive des premiers composants électroniques."
 slbm_tube_2: "Tube SLBM II"
 slbm_tube_2_desc: "Alors que les premiers tubes SLBM présentaient de sérieux problèmes en raison des limites de la technologie de l'époque, les améliorations apportées à la technologie informatique ont grandement permis aux sous-marins de contenir de bien meilleurs systèmes de ciblage et de visée pour les SLBM et ont également miniaturisé la taille des systèmes embarqués, ce qui pourrait permettre l'installation de davantage de tubes SLBM ou d'autres systèmes.\nEn raison des limites de HOI4 et du format du concepteur de modules, cette conception améliorée augmente la capacité du SLBM en supposant que l'espace économisé soit consacré à l'augmentation du nombre de tubes."
 slbm_tube_3: "Tube SLBM III"
 slbm_tube_3_desc: "De nouvelles améliorations apportées à la technologie des tubes SLBM ont ouvert la voie à des portées et à des capacités de ciblage encore plus grandes. Les progrès récents en informatique et en électronique permettent de meilleurs systèmes de contrôle des SLBM"
 slbm_tube_4: "Tube SLBM IV"
 slbm_tube_4_desc: "Les systèmes SLBM modernes sont capables d'interopérabilité entre le réseau stratégique d'un pays et le réseau de sous-marins nucléaires à un niveau inimaginable auparavant. De plus, les systèmes SLBM modernes peuvent permettre aux sous-marins nucléaires de cibler des régions avec une extrême précision et des portées incroyablement longues. En combinaison avec les SLBM modernes, les systèmes SLBM modernes pourraient permettre aux sous-marins nucléaires de frapper n'importe où dans le monde et d'assurer véritablement une destruction mutuelle, même en cas de première frappe paralysant la capacité de représailles."

 #Screen Modules
 rhib_launch_1: "Installation de lancement RHIB I"
 rhib_launch_1_desc: "Le RHIB est un bateau doté d'une coque rigide et de pneumatiques. Ils peuvent être utilisés pour diverses opérations, notamment aider les patrouilles d'un navire, fournir une aide aux efforts de travail, transporter des troupes et être utilisés comme canots de sauvetage. Les premiers bateaux RHIB avaient des utilisations et des capacités limitées par rapport aux conceptions ultérieures, bien que cela soit dû presque entièrement aux efforts de développement indirects tels que la recherche sur les matériaux et les avantages liés aux petits équipements. Néanmoins, les bateaux RHIB peuvent être utilisés pour contribuer aux patrouilles navales, à la sécurité maritime, à la réduction des accidents et à la réparation du navire en cas de problèmes, ainsi que pour plusieurs autres tâches."
 rhib_launch_2: "Installation de lancement RHIB II"
 rhib_launch_2_desc: "La modernisation des RHIB avec des matériaux modernes et des améliorations indirectes apportées dans d'autres domaines améliore considérablement leur capacité et permet un plus grand niveau de flexibilité. Cependant, des améliorations doivent également être apportées au lancement du RHIB lui-même, notamment de meilleures installations de récupération et de déploiement, des équipements de maintenance et la standardisation du pont lui-même."
 rhib_launch_3: "Installation de lancement RHIB III"
 rhib_launch_3_desc: "Améliorer davantage les RHIB avec des équipements et des auxiliaires modernes peut grandement contribuer à l'interopérabilité entre les RHIB et le navire lui-même. De plus, l'inclusion de timoneries aux côtés de ces auxiliaires peut améliorer l'efficacité des patrouilles."
 rhib_launch_4: "Installation de lancement RHIB IV"
 rhib_launch_4_desc: "Un centre RHIB avancé entièrement équipé de RHIB pour une multitude de missions et d'objectifs afin de réduire considérablement les accidents de navires et de faciliter les patrouilles."
 screen_aviation_1: "Écran Aviation I"
 screen_aviation_1_desc: "Les hélicoptères ASW sont de gros hélicoptères transportant des missiles ASW utilisés pour abattre des sous-marins. Ces hélicoptères peuvent aider à protéger les navires contre les sous-marins et à se déplacer plus rapidement que le navire ou le sous-marin ne le peuvent. Equiper les plates-formes d'un héliport de base et les armer d'un hélicoptère ASW et de son équipe de maintenance peut grandement améliorer la capacité anti-sous-marine d'un navire."
 screen_aviation_2: "Écran Aviation II"
 screen_aviation_2_desc: "S'il est simple et efficace de disposer d'une plateforme de base et d'un hélicoptère ASW, cela ne suffit pas pour répondre aux besoins de l'armée moderne. Equiper une installation aéronautique de contrôle de pièces de rechange supplémentaires et de tout l'équipement nécessaire pour entretenir l'hélicoptère pendant une période prolongée en mer est nécessaire pour garantir des opérations continues et sûres et maintenir la protection du navire contre les sous-marins."
 screen_aviation_3: "Écran Aviation III"
 screen_aviation_3_desc: "Equiper la plate-forme aéronautique de l'écran avec des auxiliaires et des équipements pour monter des hélicoptères plus modernes est coûteux mais nécessaire pour accueillir lesdits hélicoptères modernes."
 screen_aviation_4: "Écran Aviation IV"
 screen_aviation_4_desc: "Les plates-formes aéronautiques à écran modernes sont équipées de systèmes électroniques et de contrôle de mission très avancés pour faciliter l'interopérabilité entre l'hélicoptère et le navire. Lorsqu'ils sont combinés à cet équipement moderne, les hélicoptères ASW peuvent atteindre des niveaux élevés d'efficacité de mission et protéger leurs engins des sous-marins."
 
 ### MTG Naval Modules ###
 
 #Countermeasures
 countermeasures_0: "Écran de fumée"
 countermeasures_0_desc: "Un écran de fumée est de la fumée dégagée pour masquer le mouvement ou l'emplacement d'unités militaires telles que l'infanterie, les chars, les avions ou les navires. Sur les navires de guerre, un tel écran de fumée est souvent généré."
 countermeasures_1: "Fusées pyrophoriques"
 countermeasures_1_desc: "Une fusée éclairante ou une fusée leurre est une contre-mesure aérienne infrarouge utilisée par un navire de guerre dans ce cas pour utiliser rapidement un contre-attaque contre un missile à recherche infrarouge ou des lunettes d'observation infrarouge."
 countermeasures_2: "Distributeurs de paillettes"
 countermeasures_2_desc: "Les paillettes sont une contre-mesure radar dans laquelle des avions ou d'autres cibles répandent un nuage de petits et minces morceaux d'aluminium, de fibre de verre métallisée ou de plastique, qui apparaissent soit comme un groupe de cibles principales sur les écrans radar, soit inondent l'écran de multiples retours, afin de confondre et de distraire."
 countermeasures_3: "Éblouisseurs laser"
 countermeasures_3_desc: "Un éblouissant est une arme non mortelle qui utilise un rayonnement dirigé intense pour désactiver temporairement sa cible grâce à la cécité éclair. Les cibles peuvent inclure des capteurs ou une vision humaine."
 countermeasures_4: "Réponse automatique aux paillettes et aux fusées éclairantes"
 countermeasures_4_desc: "Les réponses automatisées aux paillettes ou aux fusées éclairantes sont déclenchées sans aucune intervention humaine. Un ordinateur de bord calculera une menace entrante et tirera des paillettes ou des fusées éclairantes en conséquence."
 countermeasures_5: "FTG/DRFM"
 countermeasures_5_desc: "Les générateurs de fausses cibles et les brouilleurs de mémoire radio numérique sont des systèmes automatisés qui peuvent être utilisés dans une perspective de guerre électronique pour faire apparaître un navire sur le radar là où il ne se trouve pas. Le brouillage actif des fréquences numériques peut le compléter pour confondre davantage une force adverse."
 countermeasures_6: "Leurres de missiles actifs"
 countermeasures_6_desc: "Les leurres de missiles actifs sont souvent des leurres actifs jetables, hors-bord, conçus pour éloigner les missiles anti-navires de leurs cibles. Certains ont une conception unique dans la mesure où le fourgon leurre plane dans les airs tout en attirant le missile anti-navire entrant."
 
 #Sonar
 maritime_sonar_0: "Navigation sonore et télémétrie"
 maritime_sonar_0_short: "Sonar"
 maritime_sonar_0_desc: "Le sonar (navigation et télémétrie sonore) est une technique qui utilise la propagation du son (généralement sous l'eau, comme dans la navigation sous-marine) pour naviguer, mesurer des distances (télémétrie), communiquer avec ou détecter des objets sur ou sous la surface de l'eau, comme d'autres navires."
 maritime_sonar_1: "Détecteurs d'anomalies magnétiques"
 maritime_sonar_1_short: "FOU"
 maritime_sonar_1_desc: "Un détecteur d'anomalies magnétiques (MAD) est un instrument utilisé pour détecter d'infimes variations du champ magnétique terrestre. Le terme fait spécifiquement référence aux magnétomètres utilisés par les forces militaires pour détecter les sous-marins (une masse de matériau ferromagnétique crée une perturbation détectable dans le champ magnétique)."
 maritime_sonar_2: "Sonar hybride à transducteur magnétostrictif-piézoélectrique"
 maritime_sonar_2_short: "Sonar avancé"
 maritime_sonar_2_desc: "Dans les années 1970, des composés de terres rares et de fer dotés de propriétés magnétomécaniques supérieures ont été découverts, à savoir l'alliage Terfenol-D. Cela a rendu possible de nouvelles conceptions, par ex. Un transducteur hybride magnétostrictif-piézoélectrique. Le plus récent de ces matériaux magnétostrictifs améliorés est le Galfénol."
 maritime_sonar_3: "Système mondial de surveillance par sonar"
 maritime_sonar_3_short: "Système mondial de surveillance par sonar"
 maritime_sonar_3_desc: "Le GSSS est un réseau de réseaux d'hydrophones montés sur le fond marin dans les océans Atlantique et Pacifique. Avec le système SOSUS, il tire parti du canal sonore qui existe dans l'océan, qui permet aux sons basse fréquence de parcourir de grandes distances. Ce canal est appelé SOund Fixing And Ranging, ou SOFAR."
 maritime_sonar_4: "Coordination anti-sous-marine multi-capteurs"
 maritime_sonar_4_short: "MSASC"
 maritime_sonar_4_desc: "Les nouvelles menaces sous-marines ont conduit à un changement significatif des exigences conduisant à une évaluation multi-capteurs de la situation sous-marine globale."

