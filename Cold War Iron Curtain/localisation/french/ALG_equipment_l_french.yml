#Algerian Air Force

 ALG_fighter_equipment_0:0 "Al Quwwat aljawwiya aljaza'eriiya"
 ALG_fighter_equipment_0_short:0 "FAA"
 ALG_fighter_equipment_0_desc:0 "L'Armée de l'Air algérienne (AAF) (Al Quwwat aljawwiya aljaza'eriiya en arabe ou ; Forces Aériennes en français) est la branche aérienne de l'Armée nationale populaire algérienne. L'armée de l'air algérienne a été créée pour soutenir la lutte de l'Armée nationale populaire contre les forces d'occupation françaises. Cela faisait partie des décisions du congrès de la Soummam tenu le 20 août 1956, qui recommandait un plan à long terme pour former une armée moderne."

 #ALG_jet_multirole_equipment_1:0 ""
 #ALG_jet_multirole_equipment_1_desc:0 ""
 ALG_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 ALG_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 ALG_jet_multirole_equipment_2_short:0 "MiG-15"
 ALG_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 ALG_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 ALG_jet_multirole_equipment_3_short:0 "MiG-17"
 ALG_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-17F"
 #ALG_jet_multirole_equipment_4_desc:0 ""
 ALG_jet_multirole_equipment_4_short:0 "MiG-17F"
 ALG_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 ALG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 ALG_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 ALG_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21MF"
 ALG_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 ALG_jet_multirole_equipment_6_short:0 "MiG-21MF"
 ALG_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-21bis"
 ALG_jet_multirole_equipment_7_short:0 "MiG-21bis"
 ALG_jet_multirole_equipment_7_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés à la PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI, tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS."
 ALG_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 ALG_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 ALG_jet_multirole_equipment_8_short:0 "MiG-23ML"
 ALG_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 ALG_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 ALG_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 ALG_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 ALG_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 ALG_jet_multirole_equipment_10_short:0 "MiG-29A"

 ALG_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29S"
 ALG_mr_stealth_fighter_equipment_1_short:0 "MiG-29S"
 ALG_mr_stealth_fighter_equipment_1_desc:0 "Le MiG-29S, doté du code de rapport OTAN « Fulcrum-C », présente des améliorations du système de commande de vol ; un total de quatre nouveaux ordinateurs offrent une meilleure stabilité et une meilleure contrôlabilité avec une augmentation de 2° de l'angle d'attaque (AoA). Un système de commandes de vol mécano-hydraulique amélioré permet de plus grandes déflexions des gouvernes."


 ALG_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 ALG_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 ALG_jet_interceptor_equipment_3_short:0 "MiG-17PF"

 ALG_jet_interceptor_equipment_7:0 "Mikoyan-Gourevitch MiG-25P"
 ALG_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 ALG_jet_interceptor_equipment_7_short:0 "MiG-25P"
 ALG_jet_interceptor_equipment_8:0 "Mikoyan-Gourevitch MiG-25PD"
 ALG_jet_interceptor_equipment_8_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de 1964 et est officiellement entré en service en 1970. Tout au long de sa vie, plus de 1 150 avions ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. L'avion a été conçu pour intercepter rapidement des avions à très haute altitude comme le U-2 et le B-58 à une vitesse fulgurante. L'avion a donné à l'Union soviétique un contrôle bien supérieur sur son propre espace aérien éloigné que jamais auparavant. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 ALG_jet_interceptor_equipment_8_short:0 "MiG-25PD"


 ALG_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 ALG_jet_CAS_equipment_2_short:0 "MiG-17bis"
 ALG_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 #ALG_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 #ALG_jet_CAS_equipment_3_short:0 "MiG-19S"
 #ALG_jet_CAS_equipment_3_desc:0 "Fighter-Bomber version with all-moving slab tail. Equipped with Svod long-range navigation receiver and armed with three 30 mm NR-30 cannons. Had provisions for an ORO-32K rocket unguided rocket pack or a FAB-250 bomb under each wing, and from 1957 modified to allow four rocket pods to be carried."
 ALG_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 ALG_jet_CAS_equipment_4_short:0 "Su-7B"
 ALG_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 ALG_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 ALG_jet_CAS_equipment_5_short:0 "Su-7BKL"
 ALG_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 ALG_jet_CAS_equipment_6:0 "Sukhoï Su-7BMK"
 ALG_jet_CAS_equipment_6_short:0 "Su-7BMK"
 #ALG_jet_CAS_equipment_6_desc:0 ""
 ALG_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-23BN"
 ALG_jet_CAS_equipment_7_desc:0 "(\"Flogger-H\") Version améliorée du MiG-23B, le MiG-23BN se distinguait par le fait qu'il était équipé des ailes Edition 3 et du moteur R-29 des variantes de chasseurs contemporaines, ainsi que de mises à jour mineures de l'électronique et de l'équipement. L'autre différence majeure était la suppression de la tête diélectrique présente sur le MiG-23B. Produits de 1973 à 1985, un total de 624 MiG-23BN ont été construits, bien que seul un petit nombre ait servi dans des unités VVS, le reste étant exporté."
 ALG_jet_CAS_equipment_7_short:0 "MiG-23BN"
 #ALG_jet_CAS_equipment_8:0 "Sukhoi Su-25K"
 #ALG_jet_CAS_equipment_8_short:0 "Su-25K"
 #ALG_jet_CAS_equipment_8_desc:0 "The Sukhoi Su-25 Frogfoot is a twin-engine ground attack aircraft developed in the Soviet union. The aircraft completed its maiden flight in 1975 and was introduced in 1981. Since 1978 over 1000 aircraft have been produced. It was particularly popular aircraft overseas, being sold to 29 countries. Because of this the Su-25 has been involved in several conflicts, notably the Soviet Afghan, Iran-Iraq and Gulf Wars. The aircraft remains in service with all export countries today."

 #ALG_cas_stealth_equipment_1:0 ""
 #ALG_cas_stealth_equipment_1_short:0 ""

 ALG_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 ALG_jet_light_equipment_2_short:0 "MiG-15UTI"
 ALG_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 #ALG_jet_light_equipment_3:0 "L-29 Delfin"
 #ALG_jet_light_equipment_3_short:0 "L-29 Delfin"
 #ALG_jet_light_equipment_3_desc:0 "The Aero L-29 Delfín (English: Dolphin, NATO reporting name: Maya) is a military jet trainer developed and manufactured by Czechoslovakian aviation manufacturer Aero Vodochody. During the course of the programme, in excess of 3,000 L-29 Delfin trainers were produced. Of these, around 2,000 were reported to have been delivered to the Soviet Union, where it was used as the standard trainer for the Soviet Air Force."
 ALG_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 ALG_jet_light_equipment_4_short:0 "L-39 Albatros"
 ALG_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 ALG_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 ALG_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 ALG_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."
 
 #ALG_recon_equipment_0:0 ""
 #ALG_recon_equipment_0_short:0 ""
 #ALG_recon_equipment_0_desc:0 ""
 ALG_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 ALG_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 ALG_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 ALG_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 ALG_jet_recon_equipment_1_short:0 "MiG-25RB"
 ALG_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 ALG_jet_recon_equipment_2:0 "Sukhoï Su-24MR"
 ALG_jet_recon_equipment_2_short:0 "Su-24MR"
 ALG_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi de terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, la caméra TV « Aist-M » (« Cigogne »), le radar aéroporté latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et l'infrarouge « Zima » (« Hiver »). Système de reconnaissance. D'autres capteurs sont transportés sous forme de pod."
 
 ALG_jet_tac_bomber_equipment_5:0 "Mikoyan-Guérivitch MiG-25RBT"
 ALG_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 ALG_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 ALG_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 ALG_jet_tac_bomber_equipment_6_short:0 "Su-24"
 ALG_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."
 ALG_jet_tac_bomber_equipment_7:0 "Soukhoï Su-24M"
 ALG_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 ALG_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 ALG_jet_tac_bomber_equipment_8:0 "Soukhoï Su-24MK"
 ALG_jet_tac_bomber_equipment_8_short:0 "Su-24MK"
 ALG_jet_tac_bomber_equipment_8_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."

