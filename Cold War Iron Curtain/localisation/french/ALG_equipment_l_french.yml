 #Algeria infantry equipment
 
 ALG_infantry_equipment_0:0 "MAS-36"
 ALG_infantry_equipment_0_short:0 "MAS-36"
 ALG_infantry_equipment_0_desc:0 "Le MAS-36 est un fusil à verrou conçu en 1927 chambré dans une cartouche française de 7,62x54 mm, et a été adopté par l'armée française en 1936 en remplacement des fusils de service Berthier et Lebel. Il a été utilisé en nombre limité pendant la Seconde Guerre mondiale, mais en raison de la production de masse après la fin de la guerre, il a été utilisé dans de nombreux conflits impliquant de nombreuses nations différentes. Les fusils produits après la Seconde Guerre mondiale ont connu quelques améliorations en termes d'ergonomie. Il a même vu quelques variantes qui ont vu l'ajout d'une grenade à fusil amovible et d'un modèle de tireur d'élite. On s'attendait à ce qu'il ne s'agisse que d'un fusil provisoire, construit sur des machines pouvant être utilisées pour construire les fusils à chargement automatique prévus"

 ALG_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 ALG_infantry_equipment_1_short:0 "AK-47"
 ALG_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde. "

 ALG_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 ALG_infantry_equipment_2_short:0 "AKM"
 ALG_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 ALG_infantry_equipment_3:0 "Avtomat Kalachnikova Modernizirovanniy PM 89"
 ALG_infantry_equipment_3_short:0 "PM 89"
 ALG_infantry_equipment_3_desc:0 "Variante produite localement du vénérable fusil AKM en service en Algérie"

 ALG_infantry_equipment_4:0 "Avtomat Kalachnikova AK-103"
 ALG_infantry_equipment_4_short:0 "AK-103"
 ALG_infantry_equipment_4_desc:0 "L'AK-103 est un fusil d'assaut conçu par le concepteur russe d'armes légères Mikhaïl Kalachnikov en 1994. Il s'agit d'un dérivé AK-100 de l'AK-74M chambré pour la cartouche M43 de 7,62 x 39 mm, similaire à l'AKM."

 ########## NEW ALG ARMOR

 ALG_mbt_equipment_0:0 "T-34-85"
 ALG_mbt_equipment_0_short:0 "T-34-85"
 ALG_mbt_equipment_1:0 "T-34-85M"
 ALG_mbt_equipment_1_short:0 "T-34-85M"
 ALG_mbt_equipment_2:0 "T-54"
 ALG_mbt_equipment_2_short:0 "T-54"
 ALG_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 ALG_mbt_equipment_3:0 "T-55"
 ALG_mbt_equipment_3_short:0 "T-55"
 ALG_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 ALG_mbt_equipment_4:0 "T-62"
 ALG_mbt_equipment_4_short:0 "T-62"
 ALG_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 ALG_mbt_equipment_5:0 "T-62M"
 ALG_mbt_equipment_5_short:0 "T-62M"
 ALG_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 ALG_mbt_equipment_6:0 "T-72"
 ALG_mbt_equipment_6_short:0 "T-72"
 ALG_mbt_equipment_6_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 ALG_mbt_equipment_7:0 "T-72M1"
 ALG_mbt_equipment_7_short:0 "T-72M1"
