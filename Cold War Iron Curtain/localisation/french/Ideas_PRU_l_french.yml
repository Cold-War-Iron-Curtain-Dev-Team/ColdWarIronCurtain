 improve_peruvian_production:0 "Production péruvienne améliorée"
 improve_peruvian_production_desc:0 "Après avoir fini de nous concentrer sur l'industrie, nous avons enfin amélioré notre production. Désormais, les péruviens vont travailler dur dans l'industrie militaire. Pour la nation péruvienne."
 bolognesi_memories:0 "Souvenirs de Bolognesi"
 bolognesi_memories_desc:0 "Le Coronel Francisco Bolognesi est l'image d'un vaillant héros qui s'est battu jusqu'au bout pour la nation péruvienne, c'est pourquoi nous devons nous souvenir de ses actions héroïques qu'il a sacrifiées pour notre nation."
 A_New_Peruvian_Ejercito:0 "Un Nouvel Ejercito Péruvien"
 A_New_Peruvian_Ejercito_desc:0 "Avec la nouvelle armée organisée et préparée, nous sommes prêts pour la guerre future, nos courageux soldats défendront la nation péruvienne jusqu'au bout." 
 