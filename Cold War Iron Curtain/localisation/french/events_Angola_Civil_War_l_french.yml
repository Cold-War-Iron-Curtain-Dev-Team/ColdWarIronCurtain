l_french:
  Angola_Civil_War.0.d:0 "Dans les 24 heures qui ont suivi la signature de l'Accord d'Alvor, la capitale de l'Angola a éclaté en violence alors que le MPLA et le FNLA ont entamé une lutte pour le contrôle de la ville. Beaucoup avaient espéré que l'accord d'Alvor aurait abouti à la création d'un gouvernement national dirigé par le MPLA, le FNLA et l'UNITA qui établirait la paix en Angola, mais cela ne s'est malheureusement pas produit. Le MPLA a affirmé que le FNLA avait tenté d'assassiner son chef tandis que le FNLA a affirmé que le MPLA s'était engagé dans une prise de pouvoir. Alors que les combats s'intensifiaient, l'UNITA a retiré son personnel et ses combattants de Luanda vers ses bases situées au sud. Cette ouverture des hostilités marque le début de la guerre civile angolaise et une nouvelle phase de guerre pour le peuple angolais."
  Angola_Civil_War.1.d:0 "La trêve difficile entre les trois principaux partis angolais, le FNLA, le MPLA et l'UNITA, a pris fin dans la capitale. Peu après l'annonce d'un nouveau gouvernement d'unité pour assurer la transition du pays vers l'indépendance, des combats ont éclaté entre le MPLA et le FNLA. Le FNLA a été accusé d'avoir lancé un coup d'État et tenté d'assassiner le leader du MPLA. Après trois mois de combats, le MPLA a finalement chassé le FNLA de la capitale. Alors que le FNLA a subi de nombreuses pertes, les combattants et partisans de l'UNITA ont réussi à se retirer de manière ordonnée. Le MPLA a déclaré avoir agi pour empêcher un coup d'État du FNLA soutenu par des puissances étrangères. Le FNLA affirme qu'il s'agit d'une conspiration du MPLA pour prendre le pouvoir. Les combats entre les trois partis indépendantistes devraient s'intensifier à mesure que chacun commence "
  Angola_Civil_War.2.d:0 "Le gouvernement cubain entretient depuis longtemps une camaraderie révolutionnaire avec le MPLA en Angola. Le MPLA, à son tour, a demandé à plusieurs reprises l'aide de Cuba et d'autres gouvernements révolutionnaires à travers le monde. Au cours des semaines précédentes, les Cubains avaient répondu à ces demandes en envoyant des officiers évaluer les besoins du MPLA. Ils ont conclu que le MPLA est confronté à une menace existentielle de la part des régimes réactionnaires et que s'il ne reçoit pas d'aide rapidement, il pourrait tomber. Avec l'approbation finale des dirigeants cubains, l'armée cubaine commencera à déployer un grand nombre de troupes en Angola, via des cargos et des avions, afin de former, soutenir et renforcer le MPLA contre ses ennemis."
  Angola_Civil_War.3.d:0 "Alors que la date limite officielle pour l'indépendance de l'Angola par le Portugal approche à grands pas, le FNLA a lancé une offensive pour sécuriser la capitale Luanda. Cela leur donnerait une légitimité et leur ferait perdre l'un des bastions de soutien au MPLA. Au nord de la ville, la force du FNLA a décidé d'attaquer le village stratégique de Quifangondo afin de disposer d'une base pour sécuriser la capitale et contrôler le réservoir d'eau. Soutenue par le soutien aérien et d'artillerie sud-africain et zarian, l'attaque a commencé tôt le matin. Cependant, un retard dans l'assaut de l'infanterie a vu le MPLA et son artillerie de roquettes soviétique nouvellement acquise et exploitée par des conseillers cubains dévaster la force d'attaque. Le FNLA a perdu presque tous ses véhicules et équipements lourds lors de sa retraite. Une fois la victoire assurée, le MPLA était prêt à contrôler Luanda une fois l'indépendance obtenue."
  Angola_Civil_War.4.d:0 "Alors que la date limite officielle pour l'indépendance de l'Angola par le Portugal approche à grands pas, le FNLA a lancé une offensive pour sécuriser la capitale Luanda. Cela leur donnerait une légitimité et leur ferait perdre l'un des bastions de soutien au MPLA. Au nord de la ville, la force du FNLA a décidé de s'emparer du village stratégique de Quifangondo afin de disposer d'une base pour sécuriser la capitale et contrôler le réservoir d'eau. Soutenue par le soutien aérien et d'artillerie sud-africain et zarian, l'attaque a commencé tôt le matin. Les forces du MPLA étant hébétées, l'infanterie du FNLA a immédiatement attaqué, franchissant les lignes du MPLA et forçant son ennemi à battre en retraite. L'artillerie du MPLA n'a pas pu être utilisée à temps car le FNLA a envahi les lignes immédiatement après que ses bombardiers et son artillerie aient fini de ramollir la zone. Une fois le FNLA fermement sécurisé, il semble qu'il soit sur le point de prendre Luanda avant que l'indépendance officielle ne soit accordée."
  Angola_Civil_War.5.d:0 "L'Afrique du Sud a suivi de très près la montée du MPLA communiste. Ils représentaient une menace pour l'Afrique du Sud et organisaient déjà des combattants pour résister en Namibie. Afin d'empêcher les guérilleros namibiens d'avoir une base d'opérations en Angola, il a été décidé de soutenir le FNLA et l'UNITA dans leur lutte contre le MPLA. L'Afrique du Sud a lancé l'opération Savannah pour atteindre cet objectif. L'opération a commencé lorsque l'Afrique du Sud a lancé une force opérationnelle composée de combattants du FNLA entraînés de manière conventionnelle pour attaquer le MPLA depuis la frontière namibienne. Dans les premières heures, la force opérationnelle a obtenu un grand succès et les troupes sud-africaines se préparent à entrer en Angola pour soutenir la mission. A terme, l'Opération Savannah espère aboutir à la prise de Luanda et à la fin du MPLA."
  Angola_Civil_War.6.d:0 "Le groupe de travail du FNLA, composé de forces formées de manière conventionnelle, travaillant en collaboration avec la force d'intervention militaire sud-africaine, a obtenu des résultats éclairants. Le MPLA s'est révélé incapable de résister à la discipline et à la puissance de feu de nos forces. Après une campagne difficile et l'arrivée de l'aide étrangère au MPLA, les forces du FNLA, soutenues par l'Afrique du Sud, ont atteint les principaux objectifs de l'opération Savannah. Avec ce succès, on espère qu'un gouvernement modéré prendra le contrôle de l'Angola et que tout soutien aux guérilleros namibiens sera supprimé, ce qui en fera une cible facile."
  Angola_Civil_War.7.d:0 "Le groupe de travail du FNLA, composé de forces de formation conventionnelle, travaillant en collaboration avec la force d'intervention militaire sud-africaine, avait dans un premier temps obtenu des résultats éclairants. La résistance initiale du MPLA s'est révélée plutôt limitée en termes de discipline et de puissance de feu de nos forces. Cependant, à mesure que l'opération Savannah progressait, l'ennemi commença à recevoir un énorme soutien en termes d'équipement et d'aide étrangère. En effet, au moment où l'armée sud-africaine réalisa qu'elle ne pouvait pas réussir, il devint évident que les forces sud-africaines faisaient face à un ennemi mieux équipé. De nombreux Sud-Africains attribuent ce revers au manque de soutien international à leurs efforts. De hauts responsables militaires sud-africains accusent également l'échec du gouvernement à obtenir le soutien international et médiatique pour l'opération."
  Angola_Civil_War.8.d:0 "Le Front de libération de l'enclave de Cabinda (FLEC) a annoncé son indépendance du Portugal et de l'Angola. Cabinda était un protectorat portugais et jusqu'au XXe siècle, c'était une administration distincte de l'Angola portugais. Cependant, le gouvernement angolais prétend faire partie de l'Angola proprement dit et a rejeté la déclaration d'indépendance. Le FLEC a participé activement à la guerre contre la domination portugaise, mais affirme avoir été mis à l'écart lors des pourparlers de paix et souhaite un État reconnu. Malgré la proclamation, on s'attend à ce que les forces angolaises interviennent bientôt pour arrêter le FLEC."
  Angola_Civil_War.9.d:0 "Le gouvernement du Zaïre est engagé depuis longtemps dans les conflits qui font rage en Angola. Au départ, le Zaïre espérait soutenir un renversement nationaliste africain d'un État colonial, mais au fil du temps, ses ambitions se sont transformées en une tentative d'installer un gouvernement ami. Après une série de victoires militaires, les forces zariennes ont réussi à percer les lignes ennemies et à prendre le contrôle de Luanda, la capitale angolaise. Alors que les troupes zarianes faisaient la fête dans les rues, le gouvernement zarian a publié une déclaration affirmant qu'il espérait avoir une relation productive avec les représentants légitimes de l'Angola. De nombreux observateurs s'attendent à ce que le gouvernement Zarian installe un régime ami, mais on ne sait pas s'il envisage d'annexer des zones du pays."
  
  #Restoration of the Kongo
  Angola_Civil_War.10.d:0 "\nAprès une série de succès militaires, le FNLA a remporté une victoire militaire sur le MPLA et l'UNITA. Avec cette victoire, le FNLA contrôle désormais le destin de l'Angola. Le FNLA a annoncé son intention de rétablir l'État du Kongo et de donner au peuple Bakongo la patrie que le Portugal leur a volée en 1914 avec la dissolution du Royaume du Kongo. En démantelant l'Angola, le FNLA espère donner une représentation à tous les Angolais et prévenir de futurs troubles. Le FNLA comptait depuis longtemps sur le soutien du nord de l'Angola et du peuple Bakongo en particulier. On ne sait pas comment le reste des Angolais réagira à la création d'États successeurs, mais le FNLA reste convaincu que sa décision de diviser le pays mènera à une paix plus large."
  #Savimbi Victorious
  Angola_Civil_War.11.d:0 "L'UNITA est apparue comme un groupe proposant de garantir l'indépendance de l'Angola et la création d'un État garantissant l'égalité des citoyens. Malgré l'adversité en termes de capacité à obtenir des armes, du matériel et des hommes, l'UNITA a finalement réussi à sortir victorieuse et occupe la capitale Luanda. Le chef de l'UNITA, Jonas Savimbi, a maintenu le mouvement depuis le début et partout en Angola, les citoyens sont descendus dans la rue en scandant son nom. Savimbi a publié une déclaration déclarant que l'Angola adopterait la démocratie et le non-alignement pour garantir qu'aucune idéologie ou aucun État étranger ne pervertirait la liberté angolaise. De nombreux Angolais attendront avec impatience de voir si l'UNITA pourra tenir ses promesses."
  #Retreat of the FNLA
  Angola_Civil_War.12.d:0 "Le FNLA s'est tellement dégradé militairement que ses forces se retirent au Zaïre. La route militaire a commencé plus tôt et, à mesure que les défaites du FNLA se poursuivaient, ses forces ont commencé à se retirer dans un chaos croissant, avec des bandes de combattants du FNLA se déchaînant dans les villages alors qu'ils fuyaient. L'aide étrangère au groupe a en grande partie pris fin et les mercenaires étrangers restants combattant aux côtés du FNLA ont également largement abandonné le combat. Bien qu'ils s'attendent à occuper des bases et des refuges au Zaïre, le nouveau gouvernement angolais s'est engagé à s'occuper des restes du FNLA et à faire pression pour que le Zaïre élimine le groupe."
  #MPLA Victory
  Angola_Civil_War.13.d:0 "Dans un communiqué de presse, le parti MPLA a annoncé qu'il avait enfin réalisé les voeux du peuple et qu'il était sorti vainqueur de ses ennemis. Malgré les menaces de deux puissants groupes angolais soutenus par des puissances étrangères, le MPLA a réussi à vaincre les deux groupes après une série de victoires. Maintenant que la paix est assurée, le MPLA a annoncé qu'il apporterait un véritable socialisme au peuple et établirait des sièges régionaux du parti à travers le pays. Cela permettra au parti de déraciner les éléments contre-révolutionnaires, de lutter contre la corruption et la thésaurisation, et de commencer le processus de distribution des biens indispensables au peuple angolais. En réponse à ces déclarations du MPLA, nombreux sont ceux en Angola qui accueillent avec prudence la fin de la guerre civile et espèrent que le régime du MPLA mènera à la stabilité et à la prospérité, et non à des purges ou à la répression."

 ANGOLA_IND.0.d:0 "Depuis la fin de la Seconde Guerre mondiale, la montée des sentiments de décolonisation a conduit le Portugal à apaiser les troubles potentiels en Angola. Cependant, le rétablissement des droits provinciaux et d'autres réformes n'ont pas réussi à empêcher quelques groupes anticoloniaux de s'organiser. Certains défendent les groupes ethniques locaux tandis que d'autres sont motivés par l'idéologie communiste. Ces derniers mois, le gouvernement portugais a choisi de recourir à une force militaire massive pour mettre fin à une série de protestations et de troubles parmi les paysans. Cette action a poussé l'un des groupes anticoloniaux, l'Union des peuples d'Angola (UPA), à envahir l'Angola depuis le Congo-Léopoldville. Leur saisie des terres et des fermes des colons portugais, au lieu de conduire à une fuite massive des Portugais, a plutôt vu les colons rester sur place et le Portugal a lancé une contre-attaque. Les autres forces anticoloniales émergentes devraient se joindre à la lutte contre le Portugal et entre elles. La guerre angolaise a commencé et aucune des deux parties ne semble disposée à jeter l'éponge."
 ANGOLA_IND.1.d:0 "Les travailleurs angolais d'une plantation de coton gérée par la société Cotonang ont lancé une manifestation massive. L'objectif était de pousser l'entreprise à améliorer les conditions de travail. Cela a conduit à des violences contre les employés portugais de la plantation. La nouvelle de la protestation des travailleurs a vu les villages locaux se joindre à eux, la transformant en une révolte contre le contrôle colonial portugais de l'Angola. En réponse à ces événements, le gouvernement colonial a déployé des forces militaires et une puissance aérienne pour réprimer le soulèvement. L'action militaire a tué des centaines de personnes, et de nombreux villages ont déclaré avoir été bombardés sans discernement par les Portugais. Cette répression brutale a grandement provoqué la colère des groupes anticoloniaux angolais. Le Mouvement pour la libération de l'Angola (MPLA) a répandu des rumeurs selon lesquelles les morts civiles se chiffraient à des dizaines de milliers, attisant encore davantage le sentiment angolais."

 ANGOLA_SAF.1.d:0 "Notre force opérationnelle mobile a pénétré sur le territoire du MPLA. Nous avions réussi à identifier un centre opérationnel du MPLA qu'ils avaient laissé légèrement défendu. L'ennemi ne s'attendait pas à ce que nos forces mobiles avancent aussi rapidement et nous avons facilement percé leurs lignes. L'assaut a permis de vaincre rapidement la résistance ennemie et le MPLA a été vaincu et contraint de se retirer de la zone. Ce succès amènera le MPLA à réfléchir à deux fois avant d'essayer d'empiéter sur nos intérêts."
 ANGOLA_SAF.2.d:0 "Un officier trop zélé a commis une grave erreur hier. Peut-être trop confiant face aux tactiques mobiles rapides utilisées, il a cherché à attaquer et à détruire un camp du MPLA dans la région. Cependant, le camp s'est avéré fortifié et préparé pour une attaque. Au lieu de s'effondrer sous la pression, l'ennemi a tenu bon et a infligé des pertes à nos forces. Nous avons dû nous retirer et le MPLA annonce déjà sa victoire sur nos forces dans la région. Le moral de nos hommes a également été affaibli par l'engagement."
 ANGOLA_SAF.3.d:0 "Les forces combattant dans le sud de l'Angola contre les insurgés du MPLA ont appelé à un soutien aérien pour contrer une attaque majeure. Nous avons envoyé plusieurs hélicoptères modifiés pour l'appui aérien rapproché. Ces hélicoptères ont fourni une puissance de feu, des bombes et des missiles pour repousser l'avancée ennemie, une bombe détruisant un véhicule d'état-major du MPLA. Cette opération réussie montre que le MPLA devra faire face à des menaces aériennes s'il tente de se diriger vers notre frontière."
 ANGOLA_SAF.4.d:0 "Dans le sud de l'Angola, nous avons reçu des demandes de soutien aérien en raison d'une attaque du MPLA. Nous avons envoyé plusieurs hélicoptères modifiés pour l'appui aérien rapproché, mais les hélicoptères ont rapidement été pris en embuscade par les forces du MPLA qui les attendaient avec des armes anti-aériennes légères. Heureusement, nous n'avons perdu aucun hélicoptère, mais la mission de soutien visant à bombarder les forces du MPLA qui avançaient a dû être annulée."

 ANGOLA_POR.11.d:0 "Le FNLA s'est engagé depuis longtemps dans une campagne de violence brutale contre les groupes qu'il considère comme loyaux à notre régime. En outre, les Angolais d'origine européenne, même ceux d'ascendance européenne et africaine, sont également des cibles. Cela a permis à nos agents de renseignement de recruter des hommes dans les villages victimes du FNLA. Lors d'une opération récente, nous avons envoyé certains de ces hommes rejoindre le FNLA et ils nous ont à leur tour fourni de précieux renseignements liés aux mouvements des troupes du FNLA, à leur moral et à leurs plans tactiques. Ce succès contribuera sans aucun doute à nos efforts non seulement pour contenir le FNLA, mais aussi pour enfin éradiquer la menace."
 ANGOLA_POR.12.d:0 "Le FNLA s'est engagé depuis longtemps dans une campagne de violence brutale contre les groupes qu'il considère comme loyaux à notre régime. En outre, les Angolais d'origine européenne, même ceux d'ascendance européenne et africaine, sont également des cibles. Nous avons récemment tenté de recruter un leader local dont les villageois avaient fait face aux attaques du FNLA. Nous espérions qu'il pourrait tendre la main, devenir un partisan du FNLA et ensuite nous fournir des informations sur les opérations du FNLA dans sa zone stratégique. Cependant, une fois qu'il a rejoint le FNLA, il est devenu évident qu'il était un agent double. Les informations fournies n'ont abouti à aucun succès et n'ont fait qu'étendre nos forces, ce qui a permis au FNLA de gagner du territoire. L'opération visant à mettre un espion au sein du FNLA s'est finalement soldée par un échec."
 ANGOLA_POR.15.d:0 "Le FNLA prétend être un mouvement national pour l'Angola. L'occupation des terres et des villages leur donne une légitimité. Plus important encore, les villages deviennent des espaces où ils peuvent installer des installations et des structures administratives, défiant ainsi l'autorité du Portugal. Après avoir obtenu des renseignements sur le terrain, un groupe d'avions a lancé un bombardement audacieux ciblant plusieurs villages sous le contrôle du FNLA. Les transmissions radio interceptées confirment que nous avons détruit les structures de commandement, les bâtiments administratifs et les magasins de fournitures. Cela entravera la capacité du FNLA à approvisionner et à diriger ses hommes et cela nuira à leur moral."
 ANGOLA_POR.16.d:0 "Faisant suite à des informations selon lesquelles le FNLA avait pénétré dans un village fidèle à notre administration, quelques avions ont volé pour offrir un appui aérien rapproché. Ils ont identifié ce qu'ils ont vu comme étant une colonne de combattants du FNLA et ont procédé à un bombardement. Cependant, les rapports sur le terrain suggèrent que les bombes pourraient avoir raté leur cible ou, pire encore, avoir ciblé une colonne de loyalistes qui quittaient le village. Les détails ne sont pas encore confirmés, mais les rapports indiquent qu'il y a une panique et un choc palpables parmi les villageois et que leur loyauté envers notre cause semble avoir été ébranlée."
 ANGOLA_POR.13.d:0 "Le FNLA est très efficace pour attaquer des villageois non armés, des colons portugais ou des fonctionnaires non armés. Au cours d'une opération punitive réussie, une unité légèrement armée a suivi un groupe d'attaquants du FNLA et, une fois qu'ils ont campé pour la nuit, nos hommes sont intervenus. Ils ont rapidement percé les défenses, encerclé l'ennemi puis ont lancé leur assaut, détruisant la force du FNLA. Des opérations plus réussies comme celles-ci continueront à semer la peur et à montrer que le FNLA ne peut pas poursuivre sa campagne de terreur."
 ANGOLA_POR.14.d:0 "Un commandant de la police locale a informé l'unité militaire voisine qu'une force du FNLA se massait pour attaquer son village. L'unité militaire s'est mobilisée pour réagir et chasser le FNLA, mais n'a pas mené de reconnaissance adéquate ni même une stratégie cohérente pour éliminer le FNLA. Au lieu de prendre le FNLA par surprise et de l'encercler, le ratissage lancé par nos troupes a vu le FNLA s'éloigner. En effet, plusieurs de nos troupes ont fini par s'éloigner trop du corps principal au cours de cette opération confuse et ont été abattues par le FNLA qui s'est retiré sans pertes. Pour couronner le tout, le village censé être protégé par notre opération a été attaqué une semaine plus tard."

 ANGOLA_POR.1.d:0 "Le MPLA s'appuie largement sur le soutien de l'élite urbaine de la capitale. Nous avons récemment lancé une opération dans la capitale où certains Angolais fidèles, diplômés de l'université et d'ascendance portugaise, ont été envoyés pour rejoindre le MPLA. Ces agents se sont rapidement développés, aidés par un soutien clandestin et de l'argent liquide. Ils envoient désormais régulièrement des rapports sur les efforts du MPLA visant à propager son idéologie dans les campagnes et à saper notre autorité. Grâce à ces renseignements, nous avons réussi à déraciner dans une zone une administration parallèle mise en place par le MPLA communiste."
 ANGOLA_POR.2.d:0 "Le MPLA s'appuie largement sur le soutien de l'élite urbaine de la capitale. Nous avons récemment lancé une opération dans la capitale où certains Angolais fidèles, diplômés de l'université et d'ascendance portugaise, ont été envoyés pour rejoindre le MPLA. Malheureusement, ces agents ont fini par faire défection et rejoindre leur cause. Ils ont révélé le processus dans lequel nous plaçons les agents au sein de leur organisation et, par conséquent, le MPLA a lancé une purge qui a éliminé un certain nombre de nos agents au sein de l'organisation, entravant grandement notre capacité à obtenir des renseignements sur le groupe."
 ANGOLA_POR.5.d:0 "Une de nos équipes de reconnaissance a identifié un petit convoi, déguisé en véhicules civils, transportant des hommes et du matériel pour le MPLA. Nous avons dépêché plusieurs avions qui ont pu bombarder et détruire le convoi. Lorsqu'une unité est arrivée sur le site, elle a découvert que le MPLA transportait des mortiers lourds et des armes à feu lourdes avec les hommes du convoi. Ce succès entravera leur capacité à cibler nos avant-postes dans la région et affaiblira leur moral."
 ANGOLA_POR.6.d:0 "Lors d'une opération anti-insurrectionnelle, l'un de nos commandants militaires a affirmé avoir engagé une force ennemie majeure et a demandé un appui aérien. Nous avons dépêché des avions qui ont largement touché la cible. Cependant, après inspection, nous avons découvert que les coordonnées étaient erronées et que le commandant avait exagéré l'opposition à laquelle il était confronté. Les bombes n'ont touché aucun objet de valeur et ont malheureusement détruit une ferme. Aucune information sur les victimes pour l'instant. L'attaque nous a embarrassés et a suscité des protestations de la part des villageois locaux opposés à notre recours excessif à la force."
 ANGOLA_POR.3.d:0 "Une force opérationnelle lourdement armée a été dépêchée depuis l'une de nos bases avancées. Cette unité a lancé une opération de bouclage rapide pour encercler un village voisin soupçonné d'héberger des forces du MPLA. L'unité s'est engagée contre les sentinelles ennemies à l'extérieur du village avant de lancer son assaut complet. En peu de temps, les forces ennemies furent vaincues, faisant de nombreuses victimes et prisonniers. Cette opération rapide menée par une force plus petite et plus mobile démontre l'efficacité de tactiques anti-insurrectionnelles à plus petite échelle."
 ANGOLA_POR.4.d:0 "Le général en charge d'une région stratégique a mobilisé ses forces et mené une opération de ratissage massive pour éradiquer le MPLA. De nombreuses villes et villages ont été fouillés ainsi que les terres. Malgré de nombreux commentaires de la presse avant l'opération et des vantardises selon lesquelles le MPLA serait fermement combattu, l'opération n'a donné que des résultats minimes. Il semble que le MPLA ait été informé de l'opération grâce à la mobilisation à grande échelle et aux conférences de presse et qu'il ait tout simplement disparu. L'apparition des combattants du MPLA quelques jours seulement après la fin de l'opération n'a fait que souligner encore davantage son échec."

 ANGOLA_POR.21.d:0 "Bien que l'UNITA soit très opposée à notre régime, ses dirigeants sont composés d'hommes qui changent d'avis sur ce que doit être l'avenir de l'Angola. Cela a entraîné des tensions au sein du groupe que nos agents de renseignement ont cherché à exploiter. Lors d'une opération récente, notre agent s'est fait passer pour un partisan d'une des factions de l'UNITA et a commencé à acheminer des fonds vers les hauts dirigeants de l'UNITA de cette faction. En retour, ces hommes fournissaient à notre agent des renseignements précieux sur leur structure de leadership, le nombre de combattants et la situation logistique. Le succès de l'opération garantira à nos forces un avantage sur l'ennemi et nous pourrons également semer le mécontentement en son sein."
 ANGOLA_POR.22.d:0 "Bien que l'UNITA soit très opposée à notre régime, ses dirigeants sont composés d'hommes qui changent d'avis sur ce que doit être l'avenir de l'Angola. Cela a entraîné des tensions au sein du groupe que nos agents de renseignement ont cherché à exploiter. Lors d'une opération récente, notre agent s'est fait passer pour un partisan de l'une des factions de l'UNITA et a acheminé des fonds vers les hauts dirigeants de l'UNITA de cette faction. Cependant, il semble que l'UNITA était au courant de cette tentative et a collecté pendant longtemps de l'argent et, à un moment donné, une importante livraison d'armes par nos agents désespérés d'obtenir des informations clés. En fin de compte, aucun renseignement crédible n'a été obtenu et plusieurs de nos actifs au sein de l'UNITA ont été purgés au fur et à mesure qu'ils découvraient nos méthodes. Nous devrons nous réajuster pour éviter de futurs échecs."
 ANGOLA_POR.25.d:0 "Les combattants de l'UNITA se déplacent en petites bandes et mènent des opérations frustrantes de délit de fuite contre nos forces ainsi que contre nos partisans. Cependant, nous avons récemment découvert qu'un haut commandant de l'UNITA avait transformé une maison située dans un village situé au coeur de sa zone d'opération en poste de commandement. Apparemment, ce commandant était trop sûr que nous ne pourrions pas l'atteindre ou que nous ne découvririons pas ses mouvements. Cela s'est avéré être une erreur coûteuse puisque plusieurs de nos avions ont bombardé le poste de commandement, détruisant le commandement des forces de l'UNITA dans cette zone. Une opération réussie ne fera que renforcer notre moral et nuire au leur."
 ANGOLA_POR.26.d:0 "Les combattants de l'UNITA se déplacent en petites bandes et mènent des opérations frustrantes de délit de fuite contre nos forces ainsi que contre nos partisans. Lors d'un incident embarrassant, nous avons reçu les coordonnées de ce qu'on appelle un agent de renseignement d'une bande de l'UNITA opérant dans une zone. Cependant, après que nos avions ont bombardé la cible, il était clair que nous n'avions rien touché et que l'UNITA avait placé les renseignements. Les frappes ont été menées dans une zone clairement visible pour de nombreux villageois et l'UNITA avait promis qu'elle nous ferait tellement peur qu'elle nous convaincrait facilement de bombarder cet endroit précis. Cela a finalement renforcé leur position dans la région et diminué le soutien des villageois à notre cause."
 ANGOLA_POR.23.d:0 "Un officier subalterne audacieux a réussi à identifier le schéma de déplacement d'un groupe de l'UNITA qui avait lancé plusieurs attaques brutales avec délit de fuite visant les forces gouvernementales et leurs partisans. Il comprenait que les combattants de l'UNITA évitaient les combats directs avec des adversaires supérieurs et installaient souvent des points d'embuscade lorsqu'ils se préparaient à une attaque pour éviter d'être surpris par une force ennemie. Cependant, notre officier a compris leur schéma et a positionné ses troupes là où il pensait que le commandant de l'UNITA placerait ses hommes en préparation d'une attaque contre un village voisin. Lorsque les combattants de l'UNITA sont arrivés, ils ont été victimes d'une embuscade et nos forces sont sorties victorieuses. Nous avons infligé des pertes et de nombreux combattants ennemis ont abandonné leurs armes lors de la retraite."
 ANGOLA_POR.24.d:0 "L'un de nos commandants a décidé de lancer une importante opération de bouclage pour expulser les combattants de l'UNITA de sa zone. Ses hommes étaient constamment attaqués par la guérilla de l'ennemi et il voulait mener le combat contre l'UNITA. Cependant, l'opération s'est avérée un échec massif, l'UNITA s'est largement retirée de la zone fouillée et chaque fois que nos unités s'éloignaient du corps principal, elles étaient confrontées à des frappes rapides des combattants de l'UNITA. En fin de compte, l'opération n'a produit pratiquement aucun combattant de l'UNITA ni aucun stock de fournitures ennemies et nous avons fait plusieurs victimes. Le moral de nos hommes a été mis à rude épreuve dans la région suite à cette tentative ratée."

 ANGOLA_ANG.15.d:0 "Le FNLA s'est emparé d'un village d'une valeur stratégique, chassant ses habitants et établissant une position forte à partir de laquelle coordonner ses efforts pour nous pousser vers le sud. Cependant, plusieurs escadrons ont coordonné leurs unités de mortiers et, lors d'une attaque avant l'aube, ont largué tellement de bombes que de nombreux combattants du FNLA, dont plusieurs de leurs chefs, ont fui. La position a été facilement reprise plus tard dans la journée."
 ANGOLA_ANG.16.d:0 "Le FNLA a créé la surprise suite à une tentative de bombardement au mortier de nos forces. Le commandant régional pensait que ses forces pouvaient se positionner et atteindre plusieurs points forts tenus par les combattants du FNLA. Cependant, alors que l'équipe de mortiers se préparait, le FNLA a lancé ses propres mortiers ainsi qu'une attaque d'infanterie. Cet assaut a contraint nos hommes à fuir et ils ont laissé derrière eux les mortiers et autres équipements de valeur. Ce fut un grand succès pour le FNLA dans la région et les villageois locaux semblent désormais se ranger de leur côté. Nous soupçonnons que ces manoeuvres tactiques sont probablement le résultat de conseillers étrangers déterminés à éteindre la flamme de notre révolution."
 ANGOLA_ANG.13.d:0 "Une récente offensive du FNLA a chassé nos forces de plusieurs villages. Le FNLA semblait s'être retiré, mais un commandant expérimenté a découvert qu'il opérait à partir d'un village sympathique situé à proximité des sites de ses attaques. Pendant la nuit, nos hommes ont encerclé le village et le lendemain, plusieurs patrouilles de routine du FNLA qui avaient quitté le village ont été prises en embuscade. Lorsque l'ennemi s'est rendu compte qu'il était encerclé, beaucoup se sont rendus ou ont paniqué. Nos forces ont réussi à mener à bien l'assaut et à capturer des armes et des documents chez l'ennemi. La nouvelle de notre assaut réussi a incité les villages de la région à nous soutenir et a affaibli l'influence de leurs chefs."
 ANGOLA_ANG.14.d:0 "Une de nos forces trop zélées a cherché à repousser une incursion du FNLA sur notre territoire. Le commandant pensait qu'un assaut rapide contre leur camp principal forcerait le FNLA à se retirer. Cependant, faute de préparer correctement l'assaut, nos hommes se sont retrouvés dans une embuscade à l'extérieur de leur camp. Le choc de l'attaque ennemie a provoqué la panique lorsque nos forces se sont retirées. En plus des victimes, nous avons perdu du matériel et certains de nos hommes ont été faits prisonniers. Le FNLA considère la victoire comme une confirmation de sa cause et le soutien à la révolution est épuisé dans la région."
 ANGOLA_ANG.11.d:0 "Nous avons acquis des preuves contre le fils d'un éminent chef partisan du FNLA qui étudie dans une université de premier plan à l'étranger. Grâce à ce chantage, nous l'avons convaincu de commencer à nous fournir des informations détaillées sur les plans et tactiques du FNLA. Grâce aux informations recueillies jusqu'à présent, nous avons pu contrecarrer une tentative d'assaut contre un village de nos partisans. Nous espérons que les informations qu'il fournit se révéleront vitales dans nos efforts pour vaincre cette menace réactionnaire qui pèse sur notre révolution."
 ANGOLA_ANG.12.d:0 "Il est courant que certains de nos cadres armés soient envoyés rejoindre un groupe rival afin de recueillir des informations et semer le mécontentement. Cependant, un de nos agents au sein du FNLA a apparemment été soudoyé pour faire défection et se retourner contre le peuple et notre parti. Le traître a réussi à convaincre son maître de faire appel à plusieurs autres agents afin de coordonner une opération qui aurait vu le FNLA perdre plusieurs dirigeants éminents. Cependant, tout cela n'était qu'une ruse et le FNLA a réussi à capturer les maîtres et ces agents."

 ANGOLA_ANG.21.d:0 "Nombreux sont ceux au sein de l'UNITA qui considèrent que l'idéologie du parti s'éloigne de ses origines. Certains de ces dissidents croient en un gouvernement révolutionnaire comme nous, et nos agents ont réussi à transformer un dirigeant politique de l'UNITA en agent pour nous. Sa position lui permet une communication étroite avec les hauts commandants militaires de l'UNITA et les informations qu'il a déjà fournies nous donnent une image précise de leurs tactiques, de leur moral et des opérations planifiées. Cette aubaine en matière de renseignement nous permettra de cibler l'UNITA bien plus efficacement."
 ANGOLA_ANG.22.d:0 "Une équipe d'agents de renseignement a fait valoir les origines modestes de l'UNITA, et son leadership la rendrait particulièrement vulnérable aux dirigeants intellectuels qui pourraient rapidement gravir les échelons et diviser le groupe en interne pour nous. Ce plan a échoué car les hommes recrutés pour infiltrer les rangs de l'UNITA se sont révélés mal préparés pour cette mission et ont été expulsés assez rapidement. Cependant, les agents qui avaient eux-mêmes organisé l'opération ont été presque tous capturés, l'UNITA ayant prouvé qu'elle pouvait tendre son propre piège à nos agents. Heureusement, la plupart de nos agents ont réussi à s'échapper mais l'opération d'infiltration s'est soldée par un échec."
 ANGOLA_ANG.25.d:0 "L'un de nos chefs d'escadron les plus expérimentés a exécuté une brillante opération contre un camp de base de l'UNITA près de notre territoire. Il a ordonné à une petite force de reconnaître une zone stratégique à partir de laquelle les combattants de l'UNITA avaient attaqué nos lignes de ravitaillement. La force a trouvé un camp rebelle et pendant la nuit, une équipe de mortiers s'est mise en position. Ils se sont ensuite dirigés vers eux et ont bombardé le camp. Une fois le bombardement terminé, le reste de l'escadron a attaqué la position, la trouvant abandonnée par les combattants de l'UNITA terrifiés par notre démonstration de force. Des documents ennemis, des victimes et du matériel ont été saisis dans le camp."
 ANGOLA_ANG.26.d:0 "Un commandant d'escadron avait lancé une série de frappes au mortier sur les positions avancées de l'UNITA, mais il semble avoir fait preuve de complaisance car sa dernière tentative s'est soldée par un revers majeur. L'UNITA avait laissé entendre à la radio, peut-être intentionnellement, qu'elle stockait des hommes et des armes dans un poste familier à notre commandant. Peut-être a-t-il senti l'opportunité d'infliger des dégâts massifs grâce à une frappe de mortier sur place. Cependant, dès que son escadron a commencé à se mettre en position, une force de l'UNITA leur a tendu une embuscade, leur infligeant des pertes, faisant des prisonniers et capturant un certain nombre de mortiers. Aujourd'hui, nos avant-postes sont bombardés par nos propres mortiers, ce qui nuit au moral de nos forces."
 ANGOLA_ANG.23.d:0 "Un petit groupe de combattants de l'UNITA a attaqué les villages sous notre protection et lancé des attaques éclair contre nos avant-postes au cours des dernières semaines. Le commandant sur place a pu découvrir l'emplacement général du camp de base ennemi. Utilisant un nombre supérieur, il encercla la zone puis effectua un ratissage, découvrant le camp ennemi. Nos forces ont ensuite mené un assaut, détruisant la base de l'UNITA et faisant un certain nombre de prisonniers."
 ANGOLA_ANG.24.d:0 "Une tentative visant à vider une zone contrôlée par l'UNITA de ses combattants et à affirmer notre contrôle s'est soldée par un échec. Nos forces, composées de plusieurs escadrons, cherchaient à sécuriser un certain nombre de villages et à attirer l'ennemi dans un combat ou à le prendre par surprise. Cependant, les villages manquaient de ravitaillements ou de dépôts de munitions et les efforts pour localiser les combattants n'ont fait qu'exaspérer les villageois qui estimaient que leurs libertés étaient violées. Au fur et à mesure que les troupes avançaient, elles rencontrèrent des combattants de l'UNITA, mais ils étaient retranchés et bien préparés. Nous avons subi de lourdes pertes et les combattants de l'UNITA ont continué à harceler nos forces jusqu'à ce que nous nous retirions."

 ANGOLA_ANG.1.d:0 "Un jeune bureaucrate colonial angolais a été secrètement approché par plusieurs de nos agents. Il a exprimé sa désillusion face au régime colonial et a promis de rendre compte des informations relatives à la distribution de fournitures, d'argent et d'armes dans sa région. Ces renseignements précieux nous diront quels habitants locaux se rangent du côté des colonisateurs et où les troupes ennemies sont concentrées pour de futures opérations."
 ANGOLA_ANG.2.d:0 "À l'université de Luanda, une opération visant à inciter quelques futurs diplômés favorables à notre cause à rejoindre le gouvernement colonial et l'armée afin de recueillir des renseignements a été interrompue. Non seulement les étudiants ont été arrêtés, mais aussi leurs responsables et certains de nos meilleurs recruteurs sur le campus. Le plan semblait voué à l'échec dès le départ, car nos gestionnaires ont regroupé l'opération en recrutant des étudiants qui étaient nos partisans connus. Les responsables portugais ont facilement compris le plan et ont lancé l'opération."
 ANGOLA_ANG.5.d:0 "Une caserne de police à l'extérieur de Luanda a été lourdement bombardée par une équipe de mortiers composée de nos combattants. Les obus ont causé d'importants dégâts et ont provoqué une énorme explosion lorsque l'armurerie a été touchée. Les forces de police coloniales ont subi des pertes, mais plus important encore, la capacité de nos combattants à mener une telle opération puis à s'enfuir rapidement sans se faire prendre a renforcé notre crédibilité auprès de la population."
 ANGOLA_ANG.6.d:0 "Un commandant local pensait pouvoir bombarder un camp militaire colonial avec une équipe de mortiers, mais lorsque ses combattants tentèrent de se mettre en position, une patrouille de troupes ennemies les repéra. Le combat qui a suivi a vu nos forces subir plusieurs pertes et capturer de précieux mortiers. Le commandant portugais a apporté les armes et les bombes capturées au village local et a déclaré que nous avions l'intention de bombarder les villageois sans discernement pour semer la peur. Notre prestige et notre soutien dans la région ont été épuisés."
 ANGOLA_ANG.3.d:0 "Dans une manoeuvre classique de guérilla, un petit convoi de camions de ravitaillement militaire portugais a été touché par un escadron de nos combattants. L'ennemi n'était absolument pas préparé à la puissance de feu importante et au retrait rapide de nos forces après que d'importants dégâts lui aient été infligés. Le commandant a rapporté que presque tous les camions avaient été désactivés ou détruits, entraînant de lourdes pertes ennemies. De nombreux habitants locaux font désormais connaître notre triomphe et des rumeurs abondent selon lesquelles les Portugais pourraient bientôt abandonner leurs postes dans la région si les camions de ravitaillement ne peuvent pas circuler librement."
 ANGOLA_ANG.4.d:0 "L'un de nos commandants d'escadron a conduit ses forces vers ce que l'on pensait être une force militaire portugaise isolée, composée principalement de soldats africains. Le commandant supposait qu'un assaut intensif verrait la plupart des troupes soit se rendre, soit faire défection, ce qui nous donnerait une victoire majeure et une réserve d'armes. Cependant, lorsque les combats ont commencé, la résistance de la base était forte et le nombre de troupes ennemies était beaucoup plus élevé que prévu. Nos combattants se retirèrent rapidement mais dans le désordre, et une force ennemie envoyée à leur poursuite finit par infliger de lourdes pertes et faire des prisonniers. Le commandant de l'escadron a été démis de ses fonctions pour avoir échoué à anticiper ou à reconnaître correctement les forces coloniales."

 ANGOLA_FNL.1.d:0 "Nous représentons la volonté de la nation et unirons le pays sous un gouvernement angolais non contrôlé par des États étrangers ou des idéologies étrangères. Cet appel résonne fortement auprès des Angolais toujours liés au régime colonial qui savent qu'ils n'atteindront jamais un rang ou un statut élevé tant que la domination portugaise perdurera. Lors d'une opération récente, nos agents ont réussi à convaincre un responsable colonial angolais de niveau intermédiaire de nous fournir de précieux renseignements sur les intentions et les mouvements portugais. Il nous mettra également en contact avec d'autres sympathisants de notre mission."
 ANGOLA_FNL.2.d:0 "Nous représentons la volonté de la nation et unirons le pays sous un gouvernement angolais non contrôlé par des États étrangers ou des idéologies étrangères. Cet appel résonne fortement auprès des Angolais toujours liés au régime colonial qui savent qu'ils n'atteindront jamais un rang ou un statut élevé tant que la domination portugaise perdurera. Une récente tentative visant à convaincre un responsable angolais de niveau intermédiaire de nous fournir des renseignements s'est avérée désastreuse. Le responsable a immédiatement signalé les agents à ses supérieurs, qui ont capturé les hommes. Suite à leur arrestation, un certain nombre de responsables sympathisants ont été limogés par l'État colonial et nos efforts de collecte de renseignements ont abouti à un échec."
 ANGOLA_FNL.5.d:0 "Un club social portugais situé dans une importante colonie est sous la surveillance de nos supporters depuis un certain temps. Il a été décidé que la sécurité sur place était faible et que nous pouvions poser des explosifs. La mission de poser les bombes fut un succès et le club social fut détruit. Cela a ébranlé les responsables portugais et les colons et nous espérons que cela incitera de nombreux habitants de la région à quitter l'Angola et à rehausser notre propre position parmi la population."
 ANGOLA_FNL.6.d:0 "Une équipe transportant des explosifs pour mener une opération de bombardement contre une installation portugaise a été interceptée à un barrage de police. Les hommes ont apparemment attiré les soupçons et ont été rapidement arrêtés par les Portugais. Les explosifs ont été montrés aux habitants locaux et aux colons portugais et les autorités coloniales ont affirmé que nous étions sur le point de mener une campagne terroriste contre des civils, cherchant à nous discréditer et à montrer aux colons que leur sécurité était assurée."
 ANGOLA_FNL.3.d:0 "Une plantation gérée par une famille de colons portugais a été rapidement envahie par nos forces. Cela a incité les autorités locales à envoyer des forces pour repousser notre attaque et elles sont à leur tour tombées dans une embuscade. Le raid et l'embuscade nous ont rapporté de l'argent, des armes, des fournitures et des biens que nous pouvons vendre pour la cause. Psychologiquement, notre succès contre les colons servira, espérons-le, d'exemple et les poussera à laisser l'Angola à notre peuple."
 ANGOLA_FNL.4.d:0 "Notre commandant a identifié un village sympathique au gouvernement colonial portugais, lui offrant du matériel et des hommes. Le commandant pensait que le village était mal défendu et prévoyait de lancer un assaut pour détruire les installations portugaises et la présence des forces de sécurité afin de montrer au village qu'il devait changer ses habitudes. Cependant, lorsque nos combattants se sont déplacés pour lancer son assaut rapide, une patrouille portugaise dans la zone les a repérés et a attaqué l'arrière de nos forces. Ils infligent de lourdes pertes et obligent nos hommes à se replier, la tentative de raid se solde par un échec."
	
 ANGOLA_FNL.11.d:0 "Le FNLA représente un Angola libéré des impérialistes étrangers et des idéologies étrangères. Le MPLA est clairement l'esclave d'une idéologie étrangère et doit être arrêté. Parmi eux, certains craignent que leurs dirigeants ne les déplacent vers des endroits en dehors des normes culturelles ou sociales angolaises. Ce sont également des hommes qui ne sont pas récompensés pour leurs talents et nos agents ont récemment convaincu un commandant supérieur incertain du MPLA de commencer à nous fournir des informations en échange d'une aide monétaire. Les informations que nous avons déjà glanées nous en disent long sur leur organisation, leurs tactiques et leur moral. Nous espérons utiliser ces informations pour mieux cibler leurs forces sur le terrain."
 ANGOLA_FNL.12.d:0 "Aujourd'hui, nous avons subi un embarras majeur. Nous avions envoyé un haut responsable recruter un responsable du MPLA pour nous fournir des informations. Nous avions espéré que l'offre de nous rejoindre dans la cause nationale et de l'argent convaincrait le responsable. Au départ, nous avons été informés que l'opération avait été un succès, mais nous avons vite réalisé que les informations que nous avions reçues conduisaient nos forces à plusieurs embuscades ou dans des zones sans aucune présence du MPLA, étirant ainsi nos forces. Avant que nous puissions comprendre que nous étions attaqués, le responsable du MPLA a organisé une réunion avec deux de nos agents et le MPLA les a capturés. L'opération d'acquisition de sources au sein du MPLA s'est soldée par un échec."
 ANGOLA_FNL.15.d:0 "Le MPLA dispose d'un vaste appareil de parti qui cherche à exploiter et à utiliser la propagande pour laver le cerveau de ses partisans au sein du peuple angolais. Une autre méthode de contrôle qu'ils utilisent consiste à distribuer des ressources aux villages par quotas dans certaines zones. Pour profiter et nuire au soutien que la population locale apporte au MPLA, une de nos équipes a récemment fait exploser plusieurs magasins sur le territoire du MPLA. La destruction de ces ressources a conduit à une pénurie de biens essentiels pour les villageois locaux, ce qui suscite un sentiment anti-MPLA et remonte le moral de notre propre parti dans la région."
 ANGOLA_FNL.16.d:0 "Le MPLA a récemment découvert un groupe de nos combattants se déplaçant derrière leurs lignes afin de poser des explosifs ciblant leurs dirigeants et leurs installations. Les détails sur la façon dont les hommes ont été capturés restent inconnus, mais le MPLA n'a pas perdu de temps pour présenter les explosifs à la population locale. Ils ont lancé une série de mensonges vicieux affirmant que les bombes étaient destinées à cibler les marchés et les écoles dans le but d'utiliser la peur comme moyen d'amener les villageois à soutenir notre juste cause."
 ANGOLA_FNL.13.d:0 "Les forces du MPLA manquent généralement d'officiers professionnels ou de discipline. Nous pouvons heureusement compter sur des bénévoles extérieurs possédant des connaissances approfondies en matière de discipline et de tactique militaires. L'un de ces volontaires a récemment dirigé une force de nos hommes qu'il avait entraînés vers un camp de base du MPLA. Utilisant des tactiques de reconnaissance et d'infiltration, nos hommes ont réussi à pénétrer dans le camp ennemi sans être détectés, ce qui a conduit à un assaut. Nous avons envahi le camp, infligeant des pertes, faisant des prisonniers et capturant des documents importants à l'ennemi."
 ANGOLA_FNL.14.d:0 "Un chef du FNLA a récemment réprimandé le commandant du FNLA dans sa région pour ne pas avoir réagi ou empêché les attaques du MPLA. Le chef a également déclaré aux habitants qu'il craignait que les villages ne tombent bientôt aux mains du MPLA, ce qui entraînerait des troubles parmi la population. Le commandant a décidé de mettre fin à ces critiques et a pris des mesures contre la base du MPLA opérant dans la région. Cependant, le MPLA était apparemment préparé et a transformé l'assaut de nos combattants en piège et a mis nos hommes en déroute. Nous avons subi de lourdes pertes et on dit que le moral des villageois s'est presque effondré."
	
 ANGOLA_FNL.21.d:0 "L'UNITA a longtemps fonctionné sans une base financière ou idéologique étendue quant à ses désirs. Cela a joué en notre faveur puisque nous avons récemment envoyé un combattant pour rejoindre leurs forces et gravir les échelons en tant qu'agent. Ses efforts ont porté leurs fruits car il a pu s'élever, souvent en utilisant l'argent que nous lui fournissons pour soudoyer son chemin vers le sommet, et il a trouvé plusieurs officiers et responsables de l'UNITA prêts à nous aider contre de l'argent ou pour les aider à accéder à des postes plus élevés au sein de l'UNITA. Ce réseau a déjà fourni des renseignements précieux sur l'UNITA et nous a aidé à protéger des ressources clés contre le sabotage ennemi."
 ANGOLA_FNL.22.d:0 "L'UNITA a longtemps fonctionné sans une base financière ou idéologique étendue quant à ses désirs. Nous pensions pouvoir utiliser cela à notre avantage en recrutant un commandant de l'UNITA avec de l'argent liquide pour nous fournir des renseignements. Cependant, le commandant de l'UNITA s'est révélé être un agent double et il a collecté beaucoup d'argent et de fournitures auprès de nous en échange de renseignements, ce qui n'a finalement abouti à aucun succès majeur. Il a finalement été découvert lorsque notre agent lui a accidentellement donné des renseignements mineurs que l'UNITA a utilisés pour tendre une embuscade à nos forces. Une fois cela réalisé, nous avons coupé les ponts avec lui, mais l'opération visant à acquérir un agent au sein de l'UNITA s'est avérée un échec."
 ANGOLA_FNL.25.d:0 "Un commandant de l'UNITA vivant confortablement dans un camp de l'autre côté de la frontière est devenu la cible d'une équipe de nos combattants. Les combattants ont traversé clandestinement la frontière avec des explosifs et ont détruit la maison du commandant. On ne sait pas pour l'instant combien de victimes il y a eu, mais l'attaque a démontré à l'UNITA qu'elle ne peut pas échapper à notre colère. Le moral de nos forces s'est remonté lorsque la nouvelle est arrivée qu'un commandant ennemi brutal avait été si efficacement pris pour cible par nos forces."
 ANGOLA_FNL.26.d:0 "En raison de la justesse de notre cause, nous avons eu la chance de pouvoir compter sur de nombreux volontaires venus de l'étranger pour nous aider dans la lutte visant à créer un Angola libéré des gouvernements et des idéologies étrangères. Pour montrer notre force, nous avions prévu de démolir les bâtiments majeurs d'un village abandonné qui avait fui l'arrivée de nos forces. Nous voulions refuser aux sympathisants de l'UNITA un village fonctionnel où retourner. Cependant, lorsque les bâtiments ont été détruits, nous avons découvert que les villageois avaient été retenus par les combattants de l'UNITA par crainte qu'ils ne soutiennent nos forces qui avançaient. En détruisant les bâtiments, nous nous sommes assurés qu'ils seraient désormais des partisans de l'UNITA, faisant ainsi du bombardement un échec."
 ANGOLA_FNL.23.d:0 "Les combattants de l'UNITA suivent un ensemble de règles et de tactiques pour minimiser les pertes et infliger des pertes. L'un de nos commandants s'est rendu compte que la bande de combattants de l'UNITA à laquelle il faisait face semblait faire des économies en termes d'embuscades et d'itinéraires de retraite. Après une planification minutieuse, il s'avança dans leur zone d'opération, provoquant une embuscade dont il savait qu'elle se produirait, mais il avait déjà une force plus petite derrière l'ennemi et fut capable de coincer et de vaincre la force de l'UNITA. Il a infligé des pertes, fait des prisonniers et capturé des armes ennemies, entravant sans aucun doute leur capacité à opérer efficacement dans la région."
 ANGOLA_FNL.24.d:0 "L'UNITA a tendance à disparaître face à des forces supérieures et lors d'un récent engagement, notre commandant a beaucoup souffert en supposant que cela se produirait. Le commandant disposait d'une force plus importante que d'habitude et les récentes actions de l'UNITA dans la région indiquaient qu'elle disposait d'une force beaucoup plus réduite. Le commandant a suivi les combattants de l'UNITA jusqu'à un endroit précis. Il décide de lancer un assaut, de les repousser puis de poursuivre l'ennemi. Cependant, son hypothèse selon laquelle il y aurait une supériorité numérique et un retrait de l'UNITA était erronée car l'UNITA avait rassemblé une force beaucoup plus importante et ne s'est pas retirée pendant l'attaque. Nos forces ont été contraintes de se replier après avoir subi de lourdes pertes et sont actuellement sur la défensive."

 ANGOLA_UNT.1.d:0 "Les Portugais sont depuis longtemps débordés et se font un devoir de recruter parmi les Angolais pour remplir leurs rangs. Nous en avons profité et avons envoyé certains de nos cadres rejoindre ces milices. Les récents efforts ont porté leurs fruits puisque ces infiltrés ont introduit clandestinement des armes et des fournitures précieuses pour nos combattants. Plus important encore, ces hommes diffusent le message de l'UNITA dans les rangs et nous fournissent des renseignements clés que nous utilisons pour mettre les hommes en position de frapper efficacement."
 ANGOLA_UNT.2.d:0 "Les Portugais sont depuis longtemps débordés et se font un devoir de recruter parmi les Angolais pour remplir leurs rangs. Nous en avons profité et avons envoyé certains de nos cadres rejoindre ces milices. Les récents efforts se sont toutefois révélés désastreux. Il semble que l'attrait de l'argent ait poussé un certain nombre de nos infiltrés à faire défection. Ils ont dénoncé nos efforts d'infiltration et ont déraciné nombre de nos sympathisants au sein des milices coloniales. Quelques bandes de combattants furent également prises en embuscade à cause de cette trahison."
 ANGOLA_UNT.5.d:0 "Un groupe de nos combattants a identifié un bâtiment gouvernemental vulnérable dans un village contesté. Pendant la nuit, les hommes ont placé des explosifs et le matin, nous avons détruit ce symbole du régime impérialiste portugais. Les villageois auraient été impressionnés par notre succès et un certain nombre d'entre eux sont venus rejoindre nos combattants ou offrir de la nourriture aux hommes opérant dans la région. Ce succès remontera le moral."
 ANGOLA_UNT.6.d:0 "Une tentative visant à faire sauter un poste de contrôle de la police ennemie s'est soldée par un désastre du jour au lendemain. Notre bande de combattants pensait avoir identifié un point faible à partir duquel entrer et placer des explosifs, mais ils ont été interceptés et capturés par la police coloniale. Les hommes devraient être exécutés publiquement et les Portugais ont présenté les explosifs comme la preuve d'un complot terroriste visant des civils. Le moral de nos combattants a été touché et les villageois ont désormais davantage peur de soutenir notre cause."
 ANGOLA_UNT.3.d:0 "Lors d'un récent ratissage effectué par les forces portugaises, une de nos bandes a repéré une unité qui dépassait la force principale. Les combattants ont pu tendre une embuscade à l'unité, infligeant de lourdes pertes et capturant des armes et des munitions dont nos combattants ont toujours besoin. Mao lui-même serait fier de la performance des hommes. Les forces portugaises se sont rapidement retirées et le moral de nos hommes s'est considérablement amélioré après ce succès."
 ANGOLA_UNT.4.d:0 "Un rapport troublant est parvenu aujourd'hui aux dirigeants. Un groupe de nos combattants a subi de lourdes pertes face aux troupes coloniales lors d'une attaque ratée contre un avant-poste ennemi. Le commandant n'a apparemment pas suivi nos procédures tactiques et au lieu d'attaquer lorsque l'ennemi est le plus faible, il l'a frappé lorsqu'il était fort et s'est retranché. Une directive sera émise à tous les commandants leur rappelant que nous ne devons pas gaspiller nos forces dans de faibles efforts."

 ANGOLA_UNT.11.d:0 "Le MPLA prétend depuis longtemps être le parti révolutionnaire de l'Angola, mais sa décadence et sa brutalité ont déçu nombre de ses membres. Un commandant régional important a exprimé sa sympathie pour la cause de l'UNITA et nos agents ont pu prendre contact. Grâce à lui, nous obtenons des renseignements précieux sur les mouvements et les tactiques du MPLA. Nous espérons que notre influence augmentera suite à cette infiltration dans les rangs du MPLA."
 ANGOLA_UNT.12.d:0 "Le MPLA prétend depuis longtemps être le parti révolutionnaire de l'Angola, mais sa décadence et sa brutalité ont déçu nombre de ses membres. Plusieurs de nos agents pensaient pouvoir convaincre un membre du MPLA d'agir comme une taupe dans leurs rangs. Il aurait diffusé nos opinions et fourni des renseignements essentiels, mais cela s'est avéré être un piège. Les agents ont été capturés et suite à un interrogatoire brutal, le MPLA a purgé certains de nos sympathisants dans ses rangs."
 ANGOLA_UNT.15.d:0 "Le MPLA a établi des bureaux de parti dans les villages et les villes de sa zone de contrôle. Pour montrer au peuple que nous sommes les véritables représentants de l'Angola, une équipe de nos combattants a pu poser des explosifs et faire exploser les installations du parti MPLA dans un village stratégique. En détruisant ce centre de propagande, nous avons montré que le MPLA n'avait pas la capacité de se protéger. S'ils ne peuvent pas le faire, comment peuvent-ils protéger ou représenter le peuple ? Notre succès fera grandir l'UNITA dans l'esprit de la population et suscitera la peur au sein du MPLA."
 ANGOLA_UNT.16.d:0 "Une bande ambitieuse de nos combattants cherchait à poser des explosifs et à détruire un entrepôt du MPLA. Cependant, ils n'ont pas exploré les lieux aussi bien qu'ils auraient dû et ont été tués pendant le processus de pose des explosifs. Le moral du MPLA dans la région a été considérablement remonté. On dit que nos propres combattants se sentent épuisés par cet échec. Le MPLA a répandu des rumeurs selon lesquelles nos hommes envisageaient de commettre des violences aveugles contre la population pour nuire à notre réputation."
 ANGOLA_UNT.13.d:0 "Mao aurait été fier de nos forces aujourd'hui. Dans un village occupé par le MPLA, une petite bande de combattants a tendu une embuscade à plusieurs sentinelles qui s'étaient éloignées du village. Le reste des forces présentes dans le village a riposté, mais un groupe plus important de nos hommes s'est ouvert de l'autre côté. Le MPLA a divisé ses forces et s'est déplacé pour faire face à cette nouvelle menace, mais ils sont tombés dans un piège alors qu'un autre groupe caché s'est ensuite ouvert sur la force exposée du MPLA, les frappant de différents côtés. Après avoir infligé de lourdes pertes, les combattants se retirèrent victorieux."
 ANGOLA_UNT.14.d:0 "Un commandant du MPLA, sans doute familier avec nos tactiques, a transformé une attaque de nos combattants en route. Le MPLA a fait preuve d'une discipline extraordinaire pour ne pas tomber dans un piège en ne marchant pas face à l'endroit d'où tiraient les forces de diversion. Au lieu de cela, une force plus petite de combattants du MPLA s'est faufilée sur le flanc et a fait des ravages. Ils ont repoussé nos forces, infligeant des pertes et capturant des armes abandonnées qu'ils ont présentées comme trophées aux villageois. Le moral local en a pris un coup dur."

 ANGOLA_UNT.21.d:0 "Le FNLA agit comme une force réactionnaire déterminée à créer une nouvelle oppression pour le peuple angolais. Ils comptent sur l'argent et le soutien extérieurs pour fidéliser les gens. Afin d'obtenir des renseignements et d'accéder aux fournitures et aux armes vitales, nous avons lancé une opération visant à envoyer des cadres pour les rejoindre en tant que combattants. L'opération a été un succès et les hommes nous fournissent des informations essentielles et où nous pouvons nous ravitailler. Plus important encore, nous sommes également capables d'étendre notre mission dans les rangs et de semer le mécontentement."
 ANGOLA_UNT.22.d:0 "Une tentative de nos agents de transformer certains combattants du FNLA en informateurs de la cause s'est soldée par un désastre. Au départ, nous étions en mesure d'acquérir des informations auprès de ces sources pour capturer des fournitures et des armes, mais ce n'était qu'un piège. Ces traîtres ont conduit certains de nos principaux agents dans un piège et après avoir été capturés, certains de nos partisans dans les rangs du FNLA ont été découverts et traités par les dirigeants brutaux du FNLA."
 ANGOLA_UNT.25.d:0 "Le FNLA a mené des opérations brutales pour forcer les villages et les villes à accepter leur autorité. Dans l'une de ces villes, nous avons découvert la maison d'un important partisan du FNLA. Nos combattants ont pu poser des bombes et détruire la maison. Cet attentat à la bombe contre un important partisan du FNLA a semé la peur au sein du FNLA et nous a apporté le soutien de nombreux habitants qui méprisaient cet homme."
 ANGOLA_UNT.26.d:0 "Une unité de pose de bombes a été capturée alors qu'elle tentait de se faufiler dans un village contrôlé par le FNLA. Les hommes disposaient d'explosifs et d'autres équipements pour leur mission et devraient être brutalement réprimés par le commandant local du FNLA. Ce succès a remonté le moral de notre ennemi et a rendu nos propres combattants incertains des ordres donnés par leurs supérieurs."
 ANGOLA_UNT.23.d:0 "Le lâche FNLA a attaqué un village sans défense qui soutenait notre cause. En représailles, plusieurs commandants importants de la région se sont réunis pour planifier nos représailles. En utilisant nos tactiques traditionnelles, les forces du FNLA ont été attirées à l'extérieur du village où nous avons attaqué sur plusieurs côtés. Le lâche FNLA s'est rapidement enfui, subissant de lourdes pertes et abandonnant ses armes. Parmi les quelques prisonniers capturés, nous avons réalisé que l'un d'entre eux venait d'un État étranger et nous l'interrogeons actuellement pour savoir d'où il vient."
 ANGOLA_UNT.24.d:0 "Une tentative par l'un de nos groupes d'attaquer ce qui semblait être une unité dispersée de combattants du FNLA s'est transformée en une défaite désastreuse. L'ennemi a tenu bon et a fini par coincer un certain nombre de nos combattants. Cela a permis aux renforts du FNLA d'arriver et de faire un grand nombre de victimes parmi nos hommes. Nous soupçonnons que les retardataires du FNLA pourraient en réalité être une unité de soldats entraînés venus d'un État voisin et amenés pour soutenir la cause du FLNA."

 Angolan_War_Decisions_category:0 "Guerre d'indépendance angolaise" # this scripted loc doesn't exist [GetAngolaWarStatus]
