 Angola_Expulsion.1.d:0 "La Zambie a depuis longtemps ouvert ses frontières aux groupes opposés au régime colonial portugais en Angola. En outre, il a facilité le mouvement des armes, des fournitures et des formateurs vers les groupes anticoloniaux de la région, ce qui correspondait à la croyance zambienne dans la résistance anticoloniale et le nationalisme africain. Cependant, la Zambie a récemment annoncé qu'elle expulserait de son territoire l'Union nationale pour l'indépendance totale de l'Angola (UNITA). Le gouvernement zambien a déclaré que le groupe profitait des installations zambiennes, harcelait les citoyens zambiens et complotait contre le gouvernement. En privé, beaucoup notent que le gouvernement zambien craignait également les opérations transfrontalières portugaises qui pourraient déstabiliser le gouvernement. En outre, l'UNITA avait ciblé les infrastructures portugaises en Angola, notamment les liaisons ferroviaires reliant les marchandises zambiennes à la côte, et le refus de l'UNITA de ne pas cibler ces routes a également rendu furieux le gouvernement."
 Angola_Expulsion.3.d:0 "La Zambie a depuis longtemps ouvert ses frontières aux groupes opposés au régime colonial portugais en Angola. En outre, il a facilité le mouvement des armes, des fournitures et des formateurs vers les groupes anticoloniaux de la région, ce qui correspondait à la croyance zambienne dans la résistance anticoloniale et le nationalisme africain. Cependant, le gouvernement zambien a annoncé qu'il expulserait le Mouvement populaire pour la libération de l'Angola (MPLA) de ses terres. Ils ont indiqué que le MPLA complotait contre le gouvernement, harcelait les Zambiens et ne se concentrait pas sur sa mission de libération de l'Angola. En privé, des rumeurs courent selon lesquelles le gouvernement craignait également d'inciter le Portugal à lancer des opérations transfrontalières plus directes, ce qui pourrait déstabiliser le pays."
 Angola_Expulsion.2.d:0 "Le FNLA a longtemps trouvé le soutien du Zaïre en termes de conseillers militaires, d'armes et de bases à partir desquelles combattre le régime colonial portugais. Cependant, la situation a changé avec l'annonce récente du gouvernement du Zaïre selon laquelle le Front de libération nationale de l'Angola (FNLA) serait expulsé du pays. Le Zaïre a déclaré que le FNLA abusait de la générosité du Zaïre et était simplement devenu un groupe accumulant des richesses sans lutter pour la liberté. En privé, beaucoup suggèrent que le Zaïre craignait que le Portugal puisse mener des opérations au-delà de la frontière et déstabiliser le gouvernement. En outre, le Zaïre avait espéré que les succès du FNLA dans le nord de l'Angola lui auraient ouvert des ressources minières, mais cela ne s'est pas produit, ce qui a entraîné une frustration croissante."
 Carnation_Revolution.0.d:0 "Le gouvernement et l'armée portugaises ont entamé leur retrait officiel d'Angola. Des rapports à Luanda décrivent des navires de guerre et des avions de ligne chargés de fonctionnaires et de soldats portugais. Cela marque la fin de la domination coloniale portugaise dans le pays et la fin de son conflit militaire avec les combattants indépendantistes angolais. L'action portugaise est intervenue après avoir obtenu un accord avec les différents groupes indépendantistes qui ont accepté le retrait en échange de la mise en place d'un gouvernement de transition. Après plus de quatre siècles d'engagement dans la région, le Portugal est enfin sorti de sa colonie la plus précieuse d'Afrique. De nombreux Angolais seraient ravis à l'idée que leur pays accède enfin à l'indépendance, même si l'incertitude demeure quant à la capacité du gouvernement de transition à maintenir la cohésion des différents groupes politiques."
 Carnation_Revolution.1.d:0 "Le peuple portugais subit un régime autocratique depuis près d'un demi-siècle. L'accent mis par le gouvernement sur le corporatisme aliène la classe ouvrière portugaise, tandis que les guerres coloniales impopulaires drainent les richesses et coûtent des vies. Le livre récent du général Antonio de Spinola, qui commanda les forces dans l'une des guerres coloniales, souligne la corruption et les erreurs de leadership qui ont coûté cher au pays et appelle à des réformes. Inspiré par son message, une cabale désenchantée de jeunes officiers, appelée le Mouvement des Forces Armées, a planifié un coup d'État. Utilisant des émissions musicales pré-arrangées comme signaux, les officiers et soldats rebelles se sont emparés de points et de bâtiments stratégiques à travers le pays. Incroyablement, ce coup d'État militaire s'est transformé en révolution populaire alors que des dizaines de milliers de personnes sont descendues dans la rue pour soutenir les rebelles et leur remettre des oeillets. Ce soutien public a contribué à convaincre le gouvernement de démissionner et de céder le pouvoir à une junte dirigée par Spinola qui a promis une transition rapide vers la démocratie pour le Portugal."
 Carnation_Revolution.2.d:0 "Le livre récent du général Antonio de Spinola, qui commanda les forces dans l'une des guerres coloniales, souligne la corruption et la folie du gouvernement. Il appelle à des réformes et a inspiré une cabale au sein de l'armée appelée le Mouvement des Forces Armées. Ce groupe prévoyait un coup d'État qui commencerait après des diffusions musicales pré-arrangées. Cependant, le deuxième signal n'a jamais été diffusé. Cela a conduit à une situation dans laquelle les unités rebelles, réagissant au premier signal, se sont mises en position mais n'ont pas agi. Cela a permis aux forces loyalistes de prendre conscience de la situation et de réagir. En quelques heures, la plupart des unités rebelles furent désarmées. Certaines unités ont tenté d'atteindre leurs objectifs, mais ces actions sporadiques ont été facilement gérées par les forces du régime. La tentative de coup d'État a été un immense échec et conduira probablement à une purge des officiers radicaux dans l'armée. Bien que le gouvernement ait affirmé avoir déjoué un complot marxiste, de nombreux civils ne sont pas convaincus et seraient découragés par cette nouvelle."

 Portugal_Victory_Angola.1.d:0 "Les récents succès militaires contre le MPLA communiste ont vu son appareil et ses réseaux insurgés pratiquement complètement déracinés en Angola. Nos forces patrouillent sans entrave et nos agences de renseignement surveillent efficacement les centres d'influence du MPLA, en particulier sur les campus scolaires. Le MPLA a effectivement été expulsé d'Angola, ses combattants restants opèrent depuis les États voisins et toute incursion qu'ils effectuent entraîne généralement leur retrait. Avec le MPLA effectivement hors de l'Angola, le Portugal espère consolider et restaurer son autorité sur l'ensemble de la colonie."
 Portugal_Victory_Angola.3.d:0 "L'UNITA est apparue comme une force de guérilla de style maoïste opérant dans le sud-est de l'Angola. Leurs tactiques frustrantes avaient causé de nombreux problèmes aux forces portugaises. Cependant, à la suite d'une série de revers militaires et d'échecs des services de renseignement, l'État portugais a effectivement forcé l'UNITA à quitter l'Angola. Sans base en Angola, les combattants restants seraient basés de l'autre côté de la frontière des États voisins mais n'auraient pas la capacité de contrôler le territoire angolais. Une fois l'UNITA effectivement retirée de l'Angola, le Portugal espère consolider et restaurer son autorité sur l'ensemble de la colonie."
 Portugal_Victory_Angola.2.d:0 "Le FNLA est arrivé sur les lieux pour tenter de chasser les colons portugais d'Angola par une campagne d'escalade de la violence. Cependant, les récents succès de l'armée et des services de renseignement portugais ont vu le groupe pratiquement déraciné de tout l'Angola, en particulier de sa base de soutien dans le nord de l'Angola. Les combattants restants du FNLA seraient basés dans les États voisins mais n'auraient pas démontré leur capacité à contrôler le territoire angolais. Une fois le FNLA effectivement retiré d'Angola, le Portugal espère consolider et restaurer son autorité sur l'ensemble de la colonie."

 Kick_out_Portugal_from_Angola:0 "Expulser le Portugal de l'Angola"
 Seize_Control_of_Angola:0 "Prendre le contrôle de l'Angola"
 Eliminate_UNITA_MPLA:0 "Prendre le contrôle de l'Angola"
 Angola_Prelude.1.d:0 "Dans le but de mieux coordonner ses efforts pour libérer l'Angola du Portugal, l'Union des peuples d'Angola (UPA) a convenu de s'unir avec le Partido Democrático de Angola (PDA) pour former le Front national pour la libération de l'Angola (FNLA). Cela permettra également à l'UPA, qui était initialement une organisation séparatiste bakongo, de devenir une organisation nationale de libération de tout l'Angola. Il a élargi sa portée en tant que mouvement ethnique et politique. L'idéologie anticoloniale, anti-colonisation et ethnique du groupe le rend très populaire, en particulier auprès des États voisins qui cherchent à soutenir les efforts anticoloniaux, car ils craignent qu'un groupe plus communiste puisse nourrir des ambitions régionales plus larges."
 Angola_Prelude.2.d:0 "Le Parti communiste angolais de Viriato da Cruz a fusionné avec le Parti de lutte unie pour les Africains en Angola (PLUA) pour former le Mouvement populaire pour la libération de l'Angola (MPLA). Cette fusion associera l'intelligentsia et les militants urbains de la capitale coloniale Luanda avec l'ethnie Ambundu. Cette base permettra idéalement à l'organisation de s'organiser efficacement, de résister aux pressions extérieures et de s'imposer comme le premier mouvement de libération de l'Angola."

 UNITA.1.d:0 "Jonas Savimbi et Antonio de Costa Fernandes ont formé l'Union nationale pour la libération totale de l'Angola (UNITA). Savimbi appartenait à l'origine au Front national de libération de l'Angola (FNLA), mais estimait qu'il manquait d'une approche populaire, notamment en termes de réforme paysanne. La création de l'UNITA a vu des centaines de délégués se réunir dans le sud-est de l'Angola portugais. Le groupe cherche à obtenir le soutien du groupe ethnique Ovimbundu. L'UNITA adopte une ligne plus maoïste et espère coopérer dans sa campagne contre le Portugal avec le Mouvement populaire pour la libération de l'Angola (MPLA). L'UNITA combattra non seulement le Portugal, mais aussi d'autres groupes « idéologiquement opposés à lui ». Il faudra voir si elle pourra maintenir sa coopération avec le MPLA."