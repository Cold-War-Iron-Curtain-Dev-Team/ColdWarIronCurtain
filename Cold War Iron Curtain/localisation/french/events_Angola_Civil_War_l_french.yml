 angola_war.1.d:0 "La vague de décolonisation et de nationalisme africain d'après-guerre a déferlé sur la colonie portugaise d'Angola. Lors d'une manifestation contre les conditions de travail, le Portugal a eu recours à une force excessive pour affirmer son pouvoir. Cependant, cela n'a provoqué que trois mouvements anticoloniaux majeurs à sortir et à combattre les Portugais en ciblant les colons européens. Le Portugal lutte pour conserver sa colonie la plus précieuse et protéger les centaines de milliers de colons vivant en Angola. Les trois principaux partis anticoloniaux doivent non seulement chasser le Portugal, mais aussi négocier entre eux pour déterminer le destin futur de l'Angola.\n\n Force portugaise actuelle : [?POR.ANGOLA_VICTORY_POINTS]\n Force actuelle du FNLA : [?FNL.ANGOLA_VICTORY_POINTS]\n Force actuelle du MPLA : [?ANG.ANGOLA_VICTORY_POINTS]\n Force actuelle de l'UNITA : [?UNT.ANGOLA_VICTORY_POINTS]\n\nFinancement du FNLA : [?FNL.global_fnla_funding] Millions\nFinancement du MPLA : [?ANG.global_mpla_funding] Millions\nFinancement de l'UNITA : [?UNT.global_unita_funding] Millions\n\nForce des bases du FNLA au Zaïre [?295.FNLA_Camp_Level]/20\nForce des bases du MPLA en Zambie [?246.MPLA_Camp_Level]/20\nForce des bases de l'UNITA en Zambie [?246.UNITA_Camp_Level]/20"
 angola_war.2.d:0 "Le MPLA, le FNLA et l'UNITA avaient tous travaillé contre le gouvernement colonial et l'armée portugaise. Cependant, même pendant la guerre d'indépendance, les trois groupes étaient souvent en désaccord les uns avec les autres. Lorsque le Portugal a proposé d'accorder l'indépendance, les trois groupes indépendantistes ont accepté de partager le pouvoir à Luanda. Cependant, des luttes intestines ont commencé presque immédiatement et une nouvelle phase de guerre a éclaté à travers l'Angola. Chaque camp retourne maintenant à ses bases de soutien et commence les préparatifs pour garantir que son parti devienne le leader indiscutable d'un Angola indépendant.\n\n Force actuelle du FNLA : [?FNL.ANGOLA_VICTORY_POINTS]\n Force actuelle du MPLA : [?ANG.ANGOLA_VICTORY_POINTS]\n Force actuelle de l'UNITA : [?UNT.ANGOLA_VICTORY_POINTS]\n\n\nFinancement du FNLA : [?FNL.global_fnla_funding] Milliards\nFinancement du MPLA : [?ANG.global_mpla_funding] Millions\nFinancement de l'UNITA : [?UNT.global_unita_funding] Millions\n\nForce des bases du FNLA au Zaïre [?295.FNLA_Camp_Level]/20\nForce des bases du MPLA en Zambie [?246.MPLA_Camp_Level]/20\nForce des bases de l'UNITA en Zambie [?246.UNITA_Camp_Level]/20"

