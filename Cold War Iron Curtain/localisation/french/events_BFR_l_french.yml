l_french:
 BFR.103.d:0 "Après d'intenses combats dans la capitale Lagos, des commandos de la République du Biafra et de la République du Bénin ont pris le contrôle du centre-ville lourdement barricadé. Alors que les responsables gouvernementaux du Nigeria avaient déjà fui il y a quelques semaines vers les provinces du nord, cela montrait que la guerre était pour l'essentiel perdue pour l'État fédéral. Le moral étant entièrement démoli et aucune contre-opération réalisable à ce stade n'étant possible, le gouvernement nigérian a convenu lors d'une réunion avec Ojukwu en Côte d'Ivoire neutre d'un cessez-le-feu."
 BFR.104.d:0 "Cet après-midi, le cessez-le-feu mettant fin à la guerre civile nigériane a été signé en Côte d'Ivoire neutre entre [NGA.GetLeader] et C. Odumegwu Ojukwu, marquant la fin du conflit le plus sanglant de l'histoire de l'Afrique. Même si l'accord impliquait une reconnaissance officielle par le Nigeria, de nombreux pays majeurs, comme les États-Unis et le Royaume-Uni, ne savaient pas s'ils reconnaîtraient le nouvel État successeur. Cependant, lorsque la France a officiellement reconnu l'indépendance de la petite nation, le reste du monde a rapidement suivi, le Biafra rejoignant les Nations Unies en tant que membre officiel. Le monde accueille désormais la nouvelle république que son peuple appelle « Pays du Soleil Levant »."
 BFR.105.d:0 "Au début, lorsque notre République s'avançait dans le delta du Niger, les choses semblaient très prometteuses car la valeur stratégique des ressources de la région était grandement à notre avantage. Cependant, il est immédiatement devenu clair que, avec le gouvernement fédéral nigérian qui nous faisait pression sur le cou, cette région non ethnique Igbo ne pouvait pas faire partie du Biafra en toute sécurité. Au lieu de cela, le docteur Albert Okonkwo a persuadé Ojukwu de créer une république indépendante dans la région qui soutiendrait le mouvement du Biafra tout en étant une nation indépendante distincte qui répondrait aux désirs des particularismes ethniques locaux et demanderait à devenir membre de l'ONU."
 BFR.106.d:0 "Aujourd'hui, la nouvelle nation du monde a été déclarée : la République du Bénin. Destiné à être un État souverain reconnu par l'ONU, le pays a véritablement été créé par le gouvernement du Biafra dans un territoire occupé non-igbo dans le but d'étendre le contrôle de l'État du delta du Niger, riche en ressources, sans troubles des minorités ethniques du delta. S'inspirant de la République du Delta de l'Ijaw qui a déclaré son indépendance quelques années plus tôt, la nation a tenté de se faire une propagande qui aligne principalement le peuple sur la cause du Biafra et sur la prétendue tyrannie du gouvernement fédéral nigérian."
 BFR.107.d:0 "Un grand peloton d'exécution exécute aujourd'hui des dizaines d'anciens officiers du Biafra alors qu'une série de procès controversés ont lieu dans ce petit pays. Les généraux Victor Banjo et Emmanuel Ifeajuna ont été accusés d'avoir tenté de renverser le gouvernement et de mettre fin à la nation du Biafra alors que leur défense était qu'ils tentaient de négocier un cessez-le-feu avec le gouvernement fédéral, car ils pensaient que le succès du Biafra était une futilité qui ne ferait que continuer à causer des centaines de milliers de morts supplémentaires. Bien sûr, Ojukwu n'allait prendre aucune de ces affirmations au sérieux et a approuvé leur exécution après leur procès opportun."
 BFR.108.d:0 "Patrick Chukwuma Nzeogwu, l'un des principaux orchestrateurs du coup d'État des Cinq majeurs, est décédé cette semaine en défendant le Biafra. Nzeogwu est retourné au coeur des Igbo après sa libération à la veille de la guerre civile, car Yakubu Gowon souhaitait stabiliser le pays en libérant des prisonniers politiques. Alors qu'il dirigeait une armée dans une opération de reconnaissance, il s'est retrouvé pris au piège dans une embuscade et il existe différents récits de ce qui s'est passé, certains déclarant qu'il est mort au combat tandis que d'autres disent qu'il allait être fait prisonnier mais qu'il s'est suicidé pour éviter l'humiliation due à sa réputation."