 # === THO Events extracted from French_Indochina_l_english.yml ===
 THO.1.t:0 "La question du Bac Viet"
 THO.1.d:0 "On a demandé aux marches du nord ce qui leur était dû. Cao Bang et Lang Son ont abrité le Parti alors qu'il n'avait rien d'autre : les grottes de Pac Bo, les bases de la résistance, la route sur laquelle marchaient les premiers régiments réguliers. Les cadres Tay et Nung qui ont maintenu ce pays ouvert pendant une décennie ne l'ont pas oublié, et le Comité central non plus.\n\nL'une d'elles est une région autonome : une administration Viet Bac basée à Cao Bang, gérant ses propres écoles dans ses propres langues, nommant ses propres fonctionnaires et gardant sa propre milice sur une frontière faisant face à la Chine. Cela règle une dette que la république doit réellement et cela donne aux peuples frontaliers une raison d'être nôtre qui ne dépend pas des garnisons. Le prix à payer est que les ministères de Hanoï ne gouverneront pas directement le terrain sur lequel la révolution est née.\n\nL'autre voie est l'intégration. Cao Bang, Lang Son et les pays qui les entourent deviennent des provinces comme les autres, administrées depuis le delta par des cadres nommés par le delta. C'est plus simple, c'est uniforme et cela demande aux hauts plateaux d'accepter en paix une autorité qu'on ne leur a jamais demandé d'accepter pendant la guerre."
 THO.1.a:0 "Constituer la Région Autonome du Viet Bac."
 THO.1.b:0 "Les marches seront gouvernées comme n'importe quelle autre province."
 
 THO.2.t:0 "La création de la zone autonome du Viet Bac"
 THO.2.d:0 "Suite à la consolidation de l'autorité révolutionnaire à travers la frontière nord, le Parti a commencé à examiner un nouveau cadre administratif pour les montagnes ethniquement diverses du Viet Bac. Abritant les Tay, Nung, Dao, San Chi et de nombreux autres peuples minoritaires, la région a servi de berceau de la résistance contre le colonialisme français et reste vitale pour la sécurité de notre frontière nord.\n\nDepuis la création de l'Interzone Viet Bac en 1949 sous la direction du général Chu Van Tan, les cadres des minorités locales ont joué un rôle indispensable dans la défense de la révolution. Aujourd'hui, avec le retour progressif de la paix, de nombreux responsables proposent de remplacer l'administration de guerre par une zone autonome permanente qui reconnaîtrait les traditions culturelles uniques des peuples des hauts plateaux tout en renforçant leur intégration dans la République démocratique du Vietnam.\n\nLes partisans soutiennent qu'accorder une autonomie régionale limitée récompenserait la loyauté des communautés de montagne, améliorerait la gouvernance locale, encouragerait le développement économique et démontrerait l'engagement du Parti en faveur de l'égalité entre toutes les nationalités. D'autres préviennent qu'une décentralisation excessive pourrait affaiblir l'autorité centrale dans une région frontalière stratégiquement sensible.\n\nLe Politburo doit maintenant déterminer qui gouvernera le Viet Bac."
 THO.2.a:0 "Général Tan, car il peut promouvoir l'unité entre les communautés montagnardes."
 # === MEO Events extracted from French_Indochina_l_english.yml ===
 MEO.1.t:0 "Forger la grande unité nationale dans le royaume des Meo"
 MEO.1.d:0 "Alors que les brumes des hautes terres recouvraient Sa Phin, les échos des martèlements et les cris des ouvriers remplissaient l'air. Vuong Chi Sinh, autrefois connu comme le roi des Meo, se présente désormais comme un leader révolutionnaire, guidant son peuple vers un nouvel avenir. Sous son règne, les Hmong de Dong Van ne vivaient plus à l'ombre de l'oppression coloniale mais se rassemblaient plutôt sous la bannière du Khoi Dai Doan Ket Dan Toc - le grand mouvement d'unité nationale, à l'appel d'Ho Chi Minh.\n\nAutrefois figure puissante du commerce de l'opium, Vuong Chi Sinh avait abandonné le chemin de son père pour choisir plutôt la voie de la révolution. Les Français et les nationalistes chinois avaient tous deux tenté de le tenter avec des promesses d'autonomie, cherchant à utiliser son influence pour diviser les minorités ethniques du Viet Minh. Mais le roi Meo resta fidèle, ayant juré fidélité à Bac Ho et à la cause de la libération nationale.\n\nDésormais, sous sa direction, les Hmong ne combattaient plus pour les intérêts des maîtres coloniaux mais s'armaient plutôt pour la résistance. En secret, Vuong Chi Sinh stockait depuis longtemps des armes, entraînait son peuple à la guerre en montagne et formait une armée clandestine issue des clans Hmong les plus fidèles. Lorsque l'appel du Khang chien toan quoc arriva, ses guerriers étaient prêts.\n\nMais au-delà du champ de bataille, Vuong Chi Sinh a également embrassé la cause révolutionnaire de l'autosuffisance et de la prospérité. Les champs autrefois utilisés pour la culture du pavot ont désormais été reconvertis en élevage de bétail et en cultures de base. Sous ses ordres, les villageois ont utilisé des marteaux et des ciseaux pour tracer de nouvelles routes à travers le plateau de pierre, ouvrant ainsi des voies de commerce et de communication. Ses efforts, alignés sur la vision de Ho Chi Minh de Khoi Dai Doan Ket Dan Toc, ont permis que les Hmong ne soient plus un peuple isolé, mais une partie intégrante du mouvement révolutionnaire. "
 MEO.1.a:0 "Un toast à notre pays et à ses peuples."
 MEO.2.t:0 "Tan Tam Bao Quoc, Bat Thu No Le"
 MEO.2.d:0 "Les vents froids des hauts plateaux du nord balayaient les salles du palais du roi Meo à Dong Van lorsqu'un messager arrivait de Hanoï, portant un cadeau du président Hô Chi Minh lui-même. Dans l'emballage orné se trouvait un chiec ao tran thu, brodé des mots : « Kinh Tang Ho Chu Tich, Hoi L.H.P.N Hai Duong ». Symbole de chaleur et de protection, il avait été offert au Père de la Nation par les femmes de Hai Duong, mais il avait désormais un objectif plus important. Ho avait ajouté sa propre inscription : « Chuyen tang Vuong Chi Thanh Dai bieu Quoc hoi. Ky ten Ho Chi Minh ». Il ne s'agissait pas d'un simple geste de gratitude mais d'une réaffirmation du lien entre Vuong Chi Sinh, qui porte désormais le nom de Vuong Chi Thanh, et le gouvernement révolutionnaire auquel il avait prêté allégeance.\n\nÀ côté du manteau se trouvait une magnifique épée, son fourreau orné de huit caractères puissants en Han Nom, inscrits de la propre main d'Ho Chi Minh :\n\"Tan Tam Bao Quoc; Bat Thu No Le\"\n(« Consacrez-vous au service de la nation ; ne vous soumettez jamais à l'esclavage. »)\n\nAvec ces cadeaux, Hô Chi Minh a honoré le roi Meo non seulement comme un allié mais aussi comme un frère juré dans la lutte pour la libération nationale. Contrairement à de nombreux autres dirigeants ethniques qui hésitaient entre les forces coloniales, Vuong Chi Thanh s'était engagé dans la révolution, croyant en un Vietnam où les Hmong et toutes les minorités ethniques seraient égaux dans la nouvelle république. Sa loyauté envers le Viet Minh n'était pas seulement politique : c'était un engagement scellé avec la lame d'un guerrier et un coeur de patriote.\n\nAlors que la guerre contre les Français faisait rage, le roi Meo restait ferme, ralliant son peuple à la cause de l'indépendance, sachant que les mots gravés sur son épée guideraient son chemin : lutter pour la liberté du Vietnam, ne plus jamais se plier à la domination étrangère."
 MEO.2.a:0 "Un toast à notre frère, Ho Chi Minh."
 MEO.3.t:0 "La guerre civile Quoc-Cong"
 MEO.3.d:0 "Pendant des décennies, le royaume Meo avait observé le chaos de la Chine depuis les hauts plateaux brumeux de Sa Phin. Sous le règne de Vuong Chi Sinh, les clans Hmong comptaient autrefois sur le commerce avec les seigneurs de guerre du Yunnan, échangeant de l'opium contre de l'argent, des armes et des fournitures. Les Français fermèrent les yeux, sachant que tant que le roi Meo restait puissant, les cols de Ha Giang étaient sécurisés. Mais les temps avaient changé.\n\nSous la direction d'Ho Chi Minh, Vuong Chi Sinh avait rompu avec les anciennes habitudes. Les Hmong ne s'appuieraient plus sur le poison du passé. Bac Ho l'avait exhorté : « Nous devons construire un nouveau Vietnam, libre des entraves coloniales, libre de l'oppression féodale et libre de l'exploitation - y compris celle de l'opium. Le roi Meo écouta et ordonna à son peuple de mettre fin au commerce. Les anciens du clan grognent, les seigneurs de guerre du Yunnan maudissent son nom, mais la décision est prise.\n\nAujourd'hui, alors que la Chine brûle dans la guerre civile entre le Guomindang et les communistes, d'anciens partenaires envoient des messagers désespérés à Sa Phin. Les généraux du Yunnan ont plaidé pour que le royaume Meo reprenne les expéditions d'opium. Leurs armées manquaient de ressources. Même les forces de Chiang Kai-shek dans le sud étaient prêtes à payer généreusement pour se ravitailler.\n\nMais Vuong Chi Sinh a refusé. Il en avait assez vu des chefs de guerre et des impérialistes. Le royaume Meo ne reviendrait pas dans le passé. Son peuple avait choisi la révolution, l'autosuffisance et l'unité de Khoi Dai Doan Ket Dan Toc dans le cadre de la lutte nationale du Vietnam.\n\nEn réponse, des bandits alignés sur le KMT ont attaqué les villages Meo, brûlant des champs et volant du bétail, dans l'espoir de faire pression sur le roi pour qu'il reprenne le commerce. Mais les guerriers Hmong, entraînés par l'armée secrète de Vuong Chi Sinh, ont riposté. Des affrontements éclatèrent le long de la frontière et le royaume Meo se retrouva mêlé à la grande guerre chinoise - non pas en tant que marchands, mais en tant que défenseurs de leur nouvelle indépendance."
 MEO.3.a:0 "Attendons et voyons."
 MEO.4.t:0 "Fin de la guerre Quoc-Cong - Victoire de Chiang "
 MEO.4.d:0 "Après des années de conflit sanglant, la guerre civile chinoise s'est terminée par une victoire décisive de Chiang Kai-shek et du Guomindang (KMT). L'Armée rouge a été brisée et Mao Zedong a disparu dans l'ombre. Depuis Nanjing, le KMT déclare son contrôle total sur la Chine, s'engageant à rétablir l'ordre et à écraser toute influence communiste dans la région.\n\nÀ Sa Phin, Vuong Chi Sinh se réunit avec des conseillers de confiance pour discuter de la nouvelle réalité géopolitique. Un message d'Hô Chi Minh arrive bientôt, exhortant le royaume Meo à rester neutre dans les affaires chinoises, suivant la sagesse de la diplomatie de \"Cay Tre\" - comme le bambou, le Vietnam doit plier mais pas se briser face aux vents changeants.\n\nCependant, la vigilance est de mise. Duong Trung Nhan, le chef de guerre Tusi de Meo Vac et ennemi juré de Vuong Chi Sinh, s'est aligné sur le KMT. Ses bandits, une fois dispersés, sont enhardis par la victoire de Chiang. Avec le soutien secret de Nanjing, il menace désormais la fragile stabilité de Ha Giang.\n\nDevons-nous continuer à respecter l'approche prudente de Ho Chi Minh, ou devons-nous nous préparer à l'inévitable conflit avec les factions soutenues par le KMT ?"
 MEO.4.a:0 "Le bambou se plie mais ne se brise jamais. Restez neutre, mais gardez les guerriers prêts."
 MEO.5.t:0 "La République populaire de Chine se lève"
 MEO.5.d:0 "Le monde a changé du jour au lendemain. Mao Zedong et le Parti communiste chinois (PCC) sont sortis victorieux de la guerre civile chinoise. Chiang Kai-shek et ses forces restantes ont fui vers l'île de Taiwan, laissant Pékin sous le contrôle total du PCC. Depuis la capitale, Mao a déclaré la formation de la République populaire de Chine (RPC), jurant sa solidarité avec les peuples opprimés de toute l'Asie.\n\nUne lettre de félicitations d'Hô Chi Minh et du Viet Minh arrive bientôt à Sa Phin. Ils saluent la victoire de la Chine comme un triomphe contre l'impérialisme et le féodalisme, y voyant un grand pas en avant dans la lutte révolutionnaire. Toutefois, la prudence reste de mise. Alors que le PCC a promis son soutien à la libération du Vietnam, les restes du KMT se cachent toujours dans le Yunnan et préparent leur retour.\n\nLe royaume Meo, autrefois pris entre seigneurs de guerre et colonialistes, doit désormais naviguer dans un nouveau paysage politique. Avec la RPC comme allié potentiel, l'équilibre des pouvoirs en Asie du Sud-Est a changé - mais pouvons-nous vraiment leur faire confiance ?"
 MEO.5.a:0 "Félicitez le PCC, mais préparez-vous à ce que l'ombre du KMT persiste sur le Yunnan."
 MEO.6.t:0 "Le royaume de Meo revient à la tradition"
 MEO.6.d:0 "Les habitants de Sa Phin ont pris la parole : les réformes agricoles à elles seules ne peuvent pas les soutenir. Alors que la famine menace et que les promesses de Bo Canh Nong ne sont pas tenues, Vuong Chi Sinh prend une décision difficile. Il publie un décret royal graciant Duong Trung Nhan et rétablissant les routes commerciales de l'opium avec le Yunnan et le Laos, assurant ainsi une source de revenus stable aux hauts plateaux.\n\nLes anciens murmurent que cela a toujours été ainsi. Les champs de pavot, une fois abandonnés, fleuriront à nouveau et le royaume Meo prospérera comme avant.\n\nMême si cette décision risque de susciter la désapprobation de Ha Noi, Vuong Chi Sinh sait que son premier devoir est envers son peuple. Les idéaux ne remplissent pas les estomacs vides - l'opium oui."
 MEO.6.a:0 "Un royaume affamé ne peut pas rêver d'utopie. Nous faisons ce qui doit être fait."
 
 MEO.7.t:0 "Le pardon de la famille Duong"
 MEO.7.d:0 "La maison Duong a envoyé des envoyés à Dong Van. Ses anciens offrent l'obéissance, l'accès à leurs relations commerciales et s'engagent à retenir leurs partisans armés, à condition que leurs biens confisqués et leur statut soient restaurés. Leurs rivaux insistent sur le fait qu'une grâce ne fera que donner à la famille le temps de rassembler les hommes qui répondent encore à son appel."
 MEO.7.a:0 "Leur fidélité sera testée en service."
 MEO.7.b:0 "Le pardon est un avertissement, pas une réconciliation."
 
 MEO.8.t:0 "Canaux à travers la frontière"
 MEO.8.d:0 "Les officiers chinois, les marchands et les serviteurs déplacés se déplacent à travers les cols de montagne avec une fréquence alarmante. Certains portent encore les habits de la machine de guerre du Kuomintang : lettres cachetées, anciennes dettes et promesses de fusils pour quiconque voudrait garder la route ouverte. Une entente discrète pourrait enrichir Dong Van et élargir sa marge de manoeuvre. Cela pourrait aussi nous rendre suspect à Hanoï."
 MEO.8.a:0 "Ouvrez une chaîne discrète."
 MEO.8.b:0 "Nous ne vendrons pas notre avenir aux fugitifs."
 
 MEO.9.t:0 "La route de Hanh Phuc"
 MEO.9.d:0 "Aucune autorité dans les hautes terres du nord ne peut être assurée alors que les hommes, les céréales et les messages mettent des semaines à traverser une seule crête. Les ingénieurs et les dirigeants syndicaux locaux ont présenté un plan pour une route en dur de Ha Giang à Dong Van. Cela exigera de la poudre explosive, de la nourriture, du travail et des vies, mais il promet de lier le plateau aux vallées en contrebas."
 MEO.9.a:0 "Coupez la route dans la pierre."
 
 MEO.10.t:0 "Thi Dua Tot, Lao Dong Tot"
 MEO.10.d:0 "L'appel a été lancé à chaque village : rivalisez dans le bon travail et travaillez bien. Les équipes routières, les ateliers, les détachements de milices et les ménages agricoles sont invités à se surpasser au service des hauts plateaux. Certains entendent un véritable appel à l'effort collectif ; d'autres entendent une autre demande de la part de fonctionnaires qui n'ont jamais porté de panier sur ces pentes."
 MEO.10.a:0 "Chaque foyer doit faire sa part."
 
 MEO.11.t:0 "Plans pour Sip Song Tai"
 MEO.11.d:0 "Le personnel a posé ses cartes sur la table. Les marches occidentales sont un labyrinthe de ravins, d'obligations villageoises et de loyautés changeantes ; une opération contre les Sip Song Tai ne peut pas être considérée comme une simple marche à travers une frontière. Il faut trouver des guides, préparer des dépôts de ravitaillement et apprendre à chaque colonne à combattre dans des pays où les montagnes favorisent celui qui les connaît le mieux."
 MEO.11.a:0 "Dessinez les plans; préparez les colonnes."
 
 MEO.12.t:0 "Le soulèvement des Highlands de 1950"
 MEO.12.d:0 "Des nouvelles sont parvenues à Dong Van selon lesquelles des notables alignés sur Duong et des bandes armées de Tho phi rassemblent à nouveau des hommes. Leurs proclamations invoquent l'ancienne autorité des maisons Hmong et exigent l'élévation de Hoang A Tuong, dont les liens avec la France, les contacts avec le Kuomintang et la haine du communisme en font un puissant symbole pour les insatisfaits. Le défi n'est pas simplement un raid : c'est une compétition pour savoir qui peut parler au nom du plateau."
 MEO.12.a:0 "Les hauts plateaux ne peuvent pas être gouvernés par décret."
 
 MEO.13.t:0 "La famille Hoang monte sur le trône"
 MEO.13.d:0 "Forte de ses partisans armés et de l'ordre ancien invoqué dans chaque marché et village, la famille Hoang a pris l'initiative. Hoang A Tuong est acclamé comme roi par ses partisans, qui promettent de restaurer un royaume Hmong hors de portée des partis des basses terres et de leurs cadres. Les acclamations sont fortes ; que ce soit universel est une autre affaire."
 MEO.13.a:0 "Levez les vieilles bannières."
 
 MEO.14.t:0 "La zone autonome de Tai-Meo"
 MEO.14.d_vin:0 "La République démocratique du Vietnam constitue la région autonome de Tai-Meo à mesure que l'administration Meo est absorbée par la république. L'accord prévoit une administration régionale à Tay Bac Bo et Ha Giang, mais Hanoï doit encore nommer un président capable d'assurer la coopération entre les communautés des hauts plateaux.\n\nLo Van Hac bénéficie du soutien des cadres Tai qui considèrent ses liens avec le Parti et la résistance comme une base solide pour le gouvernement régional. Sa nomination renforcerait l'autorité des responsables ayant travaillé pour la république dans les montagnes. Vuong Chi Sinh propose une base différente pour le règlement. L'ancien roi Meo conserve une place importante parmi les ménages et notables Hmong, dont la coopération pourrait apporter un soutien local plus ferme à la nouvelle administration.\n\nConfier la région à Vuong préserverait une place importante pour les anciens dirigeants des hauts plateaux, un arrangement auquel certains cadres du Parti s'opposent. Le choix du président déterminera sur lequel de ces groupes Hanoï s'appuiera pour administrer la région autonome."
 MEO.14.b:0 "Nommer Lo Van Hac pour présider la région."
 MEO.14.c:0 "Confiez la présidence à Vuong Chi Sinh."
 
 MEO.15.t:0 "Dong Van déclare son indépendance"
 MEO.15.d:0 "Le compromis avec Hanoï a échoué. Les partisans de Hoang A Tuong ont dénoncé l'administration communiste comme une menace pour l'autorité Hmong, la propriété privée et l'ancien ordre des Highlands. Leur message circule à travers les cols avec la promesse d'amis extérieurs et la certitude qu'aucun gouvernement des plaines ne comprend ces montagnes. La pause est désormais publique."
 MEO.15.a:0 "Dong Van se gouvernera lui-même."
 
 MEO.16.t:0 "Sécession à Dong Van"
 MEO.16.d:0 "Une faction de Dong Van a ouvertement rompu avec l'État vietnamien. Ses dirigeants parlent la langue de l'autonomie Hmong, mais leurs ennemis pointent du doigt les connexions françaises, les intermédiaires du Kuomintang et les bandes armées à la frontière chinoise. Les montagnes sont un pays difficile pour une expédition punitive ; Cependant, permettre à la révolte de se durcir pourrait en inciter d'autres à tester la détermination du gouvernement."
 MEO.16.a:0 "Cette insurrection doit être écrasée."
 MEO.16.b:0 "Offrez des conditions et gagnez du temps."
 
 MEO.17.t:0 "Une porte s'ouvre à Dong Van"
 MEO.17.d:0 "Des rapports en provenance de la frontière nord décrivent un mouvement Hmong anticommuniste se déclarant indépendant de Hanoï. Le nom de Hoang A Tuong pèse lourd parmi certains notables des Highlands, et ses partisans n'ont pas oublié ses anciens contacts français. Ils recherchent la reconnaissance, des armes et un patron prêt à transformer une frontière difficile en un problème pour le Viet Minh."
 MEO.17.a:0 "Une intervention discrète de l'autre côté de la frontière pourrait s'avérer utile."
 MEO.17.b:0 "Nous n'inviterons pas un autre désastre."
 
 MEO.18.t:0 "L'Insurrection de Dong Van en 1959"
 MEO.18.d:0 "Les partisans de Duong Trung Nhan ont pris les armes à Dong Van contre la région autonome de Tai-Meo. Ils rejettent l'administration régionale et réclament un royaume Hmong sous son règne. Le soulèvement menace le contrôle de Hanoï sur Ha Giang et remet en question l'autorité du président régional Lo Van Hac.\n\nLe règlement autonome visait à concilier l'autonomie gouvernementale des hauts plateaux avec l'adhésion à la République démocratique du Vietnam. L'opposition armée révèle désormais les limites de la capacité des autorités régionales à la faire respecter. Pour réprimer le mouvement, il faudrait que les troupes régulières de l'Armée populaire du Vietnam interviennent à Dong Van, ce qui engagerait des ressources gouvernementales et risquerait de susciter davantage de ressentiment parmi les villages touchés par les combats.\n\nHanoï doit décider s'il faut restaurer l'autorité de l'administration régionale par la force. Sans intervention, les partisans de Duong Trung Nhan peuvent établir un royaume Hmong séparé à Ha Giang, mettant ainsi fin au contrôle de la république."
 MEO.18.a:0 "Envoyez le PAVN à Dong Van. Écrasez la montée."
 MEO.18.b:0 "Permettez à Ha Giang de se détacher."
 VIN_tai_meo_vuong_chi_sinh_tt:0 "Vuong Chi Sinh lie les notables Hmong dans la région autonome de Tai-Meo. Le soulèvement de Duong Trung Nhan de 1959 n'aura pas lieu."
 VIN_tai_meo_revolt_breakaway_tt:0 "Ha Giang se détache en tant que royaume Hmong indépendant sous Duong Trung Nhan."
 
 MEO.19.t:0 "Dong Van réaffirme son allégeance"
 MEO.19.d:0 "Vuong Chi Sinh a rejeté le soulèvement et a appelé au soutien contre les bandes armées qui se rassemblent dans les hauts plateaux. Sa position confère au gouvernement une voix locale inestimable, mais cela ne signifiera rien sans des cadres, des fournitures et des renforts capables d'atteindre le plateau. La lutte pour Dong Van est désormais aussi un test de la capacité de Hanoï à protéger ses alliés."
 MEO.19.a:0 "Envoyez les renforts demandés."
 MEO.19.b:0 "Ils doivent régler cette question entre leurs propres citoyens."
 
 MEO.20.t:0 "La pensée d'Hô Chi Minh"
 MEO.20.d:0 "La révolte a mis en évidence les limites de l'autorité personnelle. Les organisateurs du parti affirment qu'une unité durable ne peut pas reposer uniquement sur le prestige de Vuong Chi Sinh ou sur des marchés entre grandes familles. Les cadres doivent être formés, les comités villageois renforcés et les idéaux associés à Ho Chi Minh font du langage politique du plateau."
 MEO.20.a:0 "Un peuple, une lutte, une frontière."
 
 MEO.21.t:0 "Le KMT Tho Phi à la frontière"
 MEO.21.d:0 "Les survivants vaincus du Kuomintang, les bandits locaux et les opportunistes ont trouvé une cause commune dans les cols. Ils attaquent les entrepôts, menacent les chefs de village et traversent la frontière avant qu'une colonne régulière ne puisse les attraper. La campagne à venir sera difficile : aucune bataille ne pourra en décider à elle seule, et chaque succès devra être détenu par les peuples qui vivent sous ces montagnes."
 MEO.21.a:0 "Dégagez chaque passage et chaque village."
 
 MEO.22.t:0 "Le royaume Hmong déclare son indépendance"
 MEO.22.d:0 "Les rebelles ont pris le dessus et Duong Trung Nhan s'est emparé de la couronne. Le roi de la tribu Duong a passé trois décennies à l'ombre de la maison Vuong ; il n'a pas l'intention d'élever un autre homme au trône qu'il vient de conquérir. Dong Van a renoncé à l'autorité des communistes vietnamiens et le nouveau tribunal parle de tradition et d'autonomie Hmong, tandis que ses opposants voient un régime fragile lié aux patrons étrangers, aux restes du Kuomintang et à la coercition des bandes armées. Quoi qu'il en soit, l'ancienne colonie est brisée."
 MEO.22.a:0 "Levez la bannière du royaume Hmong."
 
 MEO.23.t:0 "Le royaume Hmong s'effondre"
 MEO.23.d:0 "Les autorités de Dong Van ont répudié Hanoï et annoncé la création d'un royaume Hmong dirigé par Duong Trung Nhan. La déclaration est un affront à l'unité nationale et une invitation à toute puissance hostile qui surveille la frontière chinoise. Pourtant, une guerre en montagne consommera des hommes et des ressources à une époque où la république a de nombreux autres ennemis, et où les cols au-dessus de Dong Van ont déjà englouti des colonnes punitives."
 MEO.23.a:0 "Aucun tribunal sécessionniste ne perdurera."
 MEO.23.b:0 "Évitez une guerre de montagne coûteuse pour l'instant."
 
 MEO.24.t:0 "L'assassinat de Vuong Chi Sinh"
 MEO.24.d:0 "Vuong Chi Sinh est mort. Que les tueurs aient agi seuls ou sur ordre du nouveau régime importe moins que la conséquence : le seul homme capable de s'exprimer au-delà des divisions claniques, villageoises et politiques a été destitué. Sa mort restera dans les mémoires comme un meurtre pour ses partisans et comme un acte nécessaire pour ceux qui sont déterminés à effacer l'ancien compromis avec Hanoï."
 MEO.24.a:0 "La dernière contrainte est tombée."
 
 MEO.25.t:0 "Vuong Chi Sinh a été assassiné"
 MEO.25.d:0 "La nouvelle de l'assassinat de Vuong Chi Sinh est parvenue à Hanoï. Pendant des années, sa position à Dong Van a donné à la république un pont vers les hauts plateaux Hmong et un contrepoids au banditisme, aux agents étrangers et aux maisons rivales. Son assassinat n'est pas simplement la perte d'un responsable local : c'est une déclaration selon laquelle la réconciliation à la frontière a échoué."
 MEO.25.a:0 "Il restera dans les mémoires comme un patriote."
 
 MEO.26.t:0 "Trois réponses pour les Highlands"
 MEO.26.d:0 "Le soulèvement est passé, mais il a laissé toutes les factions de Dong Van convaincues que l'ancien arrangement ne peut pas tenir. Trois partis font désormais valoir leurs arguments devant la salle du conseil et dans les villages situés à proximité.\n\nLa maison Hoang et ses partisans armés affirment que seule une couronne Hmong restaurée impose l'obéissance dans les cols et que Hoang A Tuong devrait y être élevé avant qu'une nouvelle saison de banditisme ne fasse le travail à sa place. Les cadres issus de la résistance répondent que rien n'a changé : le pacte avec Hanoï a résisté au pire, et un montagnard qui garde la tête baissée gardera son autonomie. Une troisième voix, plus calme mais croissante, dit que tous deux mendient auprès des habitants des plaines qui n'ont jamais compris ces montagnes, et que Dong Van devrait simplement se gouverner lui-même.\n\nLes anciens ont dit ce qu'ils étaient venus dire. La décision nous appartient."
 MEO.26.a:0 "Le plateau aura bientôt sa réponse."
 
 MEO.27.t:0 "La question de l'autonomie Meo"
 MEO.27.d:0 "Dong Van a demandé à Hanoï de régler le statut des hauts plateaux du nord, et la question ne peut plus être différée. La politique du Parti à l'égard des minorités nationales promet l'égalité et l'autonomie gouvernementale ; les affaires pratiques de la fiscalité, de la conscription et de la construction de routes promettent un peu moins.\n\nL'une d'elles est la zone autonome : une administration Tai-Meo avec ses propres fonctionnaires, ses propres douanes et sa propre milice, liée à la république mais non fuie. Il achète à bas prix la loyauté des laissez-passer et prive toute puissance hostile à la frontière chinoise d'une minorité lésée avec laquelle travailler. Le coût est une frontière que les ministères de Hanoï ne contrôlent pas directement.\n\nL'autre voie est l'intégration. Les hauts plateaux deviennent des provinces comme les autres, les cadres sont nommés plutôt que proclamés, et la question ne se pose plus jamais. C'est plus simple, et c'est la réponse qui a déjà transformé des frontières tranquilles en frontières rebelles."
 MEO.27.a:0 "Constituer la zone autonome Tai-Meo."
 MEO.27.b:0 "Les Highlands seront gouvernées comme n'importe quelle autre province."
