 Nung_Future.1.t: "Bao-dai exige notre soumission !"
 Nung_Future.1.d: "Le 30 mai 1949, le ministère français des Outre-mer a confié au gouvernement national du Vietnam le pouvoir de gérer les régions ethniques autonomes des Hauts Plateaux du Centre et de la Haute Indochine du Sud. Le chef de l'État Bao-Dai a plutôt séparé les Hauts Plateaux du Centre et a établi un règlement administratif spécial appelé Hoang-Trieu Cuong-Tho (domaines de la Couronne) par l'intermédiaire de Du so 6/QT/TH le 15 avril 1950. Le Du a précisé que dans ces nouvelles régions, Bao-dai en plus d'être chef de l'État, occupera le rôle d'« Empereur » et gouvernera personnellement les domaines de la Couronne comme ses fiefs. Alors que le gouvernement français de Paris a promis d'accorder et de protéger l'indépendance de notre nation vis-à-vis du Vietnam après la guerre contre le communisme, Bao-dai a plutôt utilisé le Du pour exiger la soumission de notre gouvernement via un télégramme envoyé de Saigon, quelle sera notre réponse ? "
 Nung_Future.1.a: "Très bien, mais on nous avait promis que nous serions libres après la guerre !"
 Nung_Future.1.b: "Nous utiliserons la promesse des Français de protéger et de défendre notre souveraineté pour déclarer notre indépendance !"

 NUN_VIN.1.t: "Le colonel Vong-a-Sang passe à la révolution"
 NUN_VIN.1.d: " Au milieu de l'année 1948, le camarade Nhi Quy, secrétaire du Comité du Parti communiste de Hai Ninh, a ordonné au camarade Hoang Mau Thanh (délégué de la 1ère Assemblée nationale, vice-président du Comité de résistance provincial de Hai Ninh, cousin du leader de Nung, Vong-a-Sang) d'écrire une lettre de soutien exhortant Vong-a-Sang à revenir à « la cause révolutionnaire ». Le contenu de la lettre était d'avertir A Sang que s'il n'avait pas encore eu l'opportunité de rejoindre la révolution, il ne devrait pas commettre davantage de crimes contre le peuple. \nAujourd'hui, notre gouvernement au Viet-bac a reçu un télégramme inattendu informant que le gouvernement Nung et le colonel Vong-a-Sang avaient fait défection et accepté l'autorité de notre gouvernement révolutionnaire en échange du maintien de l'autonomie du peuple chinois Nung, le télégramme informait qu'ils seraient recontactés lorsqu'ils pourraient transférer l'autorité à notre gouvernement du régime d'occupation du CEFEO."
 NUN_VIN.1.a: "Nous détruisons les ennemis en les transformant en camarades !"

 NUN_VIN.2.t: "A-sang nous a trahis"
 NUN_VIN.2.d: "Le colonel Vong-a-Sang est passé au Viet Minh. La milice Nung de Hai-ninh, levée, payée et armée pour tenir la frontière chinoise contre les communistes, répond désormais au Comité du Parti de Hai Ninh, et la route côtière de Mong Cai à Tien Yen a changé de mains sans qu'un coup de feu ne soit tiré.\n\nLa défection n'est pas venue de nulle part. Le propre cousin d'A-sang siégeait à l'Assemblée nationale de Ho Chi Minh et les agents de Nhi Quy travaillaient dans les villages frontaliers depuis un an. Il reste à décider si nous traiterons Hai-ninh comme un front ennemi supplémentaire ou si nous garderons un canal discret ouvert au cas où les nouveaux amis du colonel le décevraient."
 NUN_VIN.2.a: "Alors Hai-ninh est un front ennemi."
 NUN_VIN.2.b: "Laissez une porte ouverte pour son retour."

 NUN_VIN.3.t: "La région autonome populaire de Hai Ninh"
 NUN_VIN.3.d: "Conformément à la résolution de l'Assemblée nationale du [?global.date.GetDateStringNoHourLong], le Président de la République démocratique du Vietnam a mis en oeuvre la politique de création de régions autonomes pour l'autonomie des groupes ethniques dans leurs pays d'origine. 219/SL a établi la région autonome populaire de Hai Ninh après la défection du gouvernement Nung dirigé par le colonel Vong-a-Sang vers la Révolution. La région qui serait la première d'une longue série incorporera la région spéciale de Hong Quang et l'ancien royaume autonome Nung dirigé par les Français pour créer la nouvelle patrie du peuple Nung sous la protection et l'autorité du gouvernement de la République démocratique du Vietnam et de Hanoï."
 NUN_VIN.3.a: "Nous garantirons l'autodétermination de tous les compatriotes Dong Bao"

 NUN_VIE.1.t: "La zone autonome de Nung ratifie Du so 6/QT/TG"
 NUN_VIE.1.d: "Aujourd'hui, le 15 avril 1950, le ministère français des Outre-mer a confié à l'État du Vietnam le pouvoir de gérer la province de Hai-ninh du territoire autonome Nung. Le chef d'État Bao-dai a placé l'autorité du pays sous le système administratif spécial appelé Domaine de la Couronne au sein de l'État du Vietnam comme ses possessions par l'intermédiaire du Du so 6 /QT/TG le 15 avril 1950. Selon le Du, Bao-dai détiendra les deux titres de « chef d'État » dans la province nouvellement annexée tout en maintenant le système de gouvernement du colonel Vong-a-sang."
 NUN_VIE.1.a: "Encore un toast au Chef de l'Etat et à la Solution Quoc-gia !"

