 # CCC Unification Choices
 CCC_Unification_Choices.1.t: "La visite de Bao-Dai à Saigon"
 CCC_Unification_Choices.1.d: "Le chef de l'État a atterri à Saigon ce matin après le court vol depuis Da-Lat, et l'arrivée était en soi la moitié du message. Bao-Dai a choisi de diriger les négociations avec la Cochinchine en personne plutôt que par l'intermédiaire d'une délégation, et il arrive avec un soutien français considérable derrière lui.\n\nLe terrain était préparé à Paris. Le récent projet de loi de l'Assemblée retirant la Cochinchine du statut de territoire français direct et la rattachant à l'État du Vietnam fixe en droit ce que nos négociateurs défendent depuis deux ans, et laisse à l'ancien empereur une position suffisamment confortable pour être dépensé.\n\nAvec tout cela derrière lui, Bao-Dai a guidé les discussions qui ont suivi..."
 CCC_Unification_Choices.1.a: "...avec une grande convivialité, en offrant le plus de concessions possible."
 CCC_Unification_Choices.1.b: "...avec une diplomatie astucieuse et des compromis, en veillant à ce que personne ne reparte insatisfait."
 CCC_Unification_Choices.1.c: "...avec assurance et confiance, car il avait le dessus."

 CCC_Unification_Choices.2.t: "Déclaration de Bao-Dai à la Nation"
 CCC_Unification_Choices.2.d: "Une proclamation rédigée personnellement par le chef de l'État a fait la une de tous les grands journaux ce matin : un appel à la paix et à l'unité de son peuple et une annonce des projets d'unification avec la Cochinchine.\n\nLes presses ne parvenaient pas à suivre le rythme. Les exemplaires sortaient des stands plus vite qu'ils ne pouvaient être remplacés et, au milieu de la matinée, le texte était lu à haute voix au coin des rues aux personnes qui n'avaient pas réussi à en acheter un.\n\nLe verdict a mis le reste de la journée à être réglé, comme c'est souvent le cas pour les verdicts de ce type. Ce que les lecteurs de Saigon ont finalement reconnu, c'est que les écrits de l'ancien empereur étaient plutôt..."
 CCC_Unification_Choices.2.a: "...tact et poli, appelant avant tout à la solidarité"
 CCC_Unification_Choices.2.b: "... agressif et intransigeant, affirmant que la nation serait unie quel qu'en soit le prix."

 # CCC Unification
 CCC_Unification.1.t: "Plaider la France pour l'unification vietnamienne"
 CCC_Unification.1.d: "Nos efforts pour intégrer la « République » de Cochinchine dans l'union par un accord ont échoué. Les relations entre le général Nguyen-Van-Xuan et le chef de l'Etat sont assez chaleureuses en public et n'ont rien donné en privé, car les deux hommes ne parviennent pas à trouver une solution alors que l'un d'eux n'en veut pas.\n\nC'est la lecture dans le palais. On pense que Xuan attend un dirigeant différent, ou du moins un arrangement différent, et qu'il poursuit les négociations jusqu'à ce que l'un ou l'autre soit disponible. Rien n'indique qu'il ait l'intention de les rompre - seulement qu'il a l'intention de ne jamais les conclure.\n\nBao-Dai a donc décidé de faire appel directement aux Français, et leur pression amènera très probablement les récalcitrants à la table, puisque la position de Xuan repose entièrement sur l'argent et la bonne volonté française. Cela signifiera également que l'unification du Vietnam a été réalisée par une instruction française. Tout homme à Saigon le saura, et la pureté de la victoire ne survivra pas à cette connaissance."
 CCC_Unification.1.a: "Espérons le meilleur."

 CCC_Unification.2.t: "Bao-Dai demande l'unification avec la Cochinchine"
 CCC_Unification.2.d: "Bao-Dai est arrivé au bout de ses ressources et nous a demandé d'unifier son pays pour lui. Ce n'est pas la première demande de ce type et, comme d'habitude, l'aboiement s'est révélé bien pire que la morsure.\n\nL'obstruction est Nguyen-Van-Xuan, ce qui est pratique. Xuan est notre homme dans tous les sens du terme, et une certaine pression appliquée dans le bon quart le ramènerait très probablement. Un Vietnam unifié pourrait même commencer à peser une partie de son propre poids dans cette lutte, ce qui allégerait le fardeau de nos propres garçons dans le delta.\n\nLa vraie question n'est pas du tout la Cochinchine. Il s'agit de savoir si nous continuons à soutenir un chef de l'État dont nous devons renforcer l'autorité tous les quelques mois, ou si le moment est venu de chercher du sang neuf."
 CCC_Unification.2.a: "Nous y réfléchirons."

 CCC_Unification.3.t: "La France demande son unification avec Bao-Dai"
 CCC_Unification.3.d: "Une deuxième demande est arrivée, celle-ci du gouvernement français, nous invitant à nous unir à l'administration de Bao-Dai. Il porte beaucoup plus de poids que le premier.\n\nNous pouvons y adhérer sous certaines conditions, en subordonnant l'unification aux engagements que Bao-Dai devrait prendre et ensuite tenir. Ou nous pouvons décliner et rester une république autonome avec notre propre assemblée et notre propre administration, comme nous l'avons été depuis la fin de la guerre.\n\nLe coût du déclin devrait être clairement énoncé dans cette Chambre plutôt que de rester à découvrir plus tard. Bao-Dai veut la Cochinchine et il a une armée. Si nous refusons la demande française, nous perdons avec elle l'objection française à l'utilisation de cette armée."
 CCC_Unification.3.a: "Puissions-nous construire ensemble un Vietnam fort."
 CCC_Unification.3.b: "Nous resterons sur nos positions."

 CCC_Unification.4.t: "La Cochinchine accepte de s'unifier !"
 CCC_Unification.4.d: "La République autonome de Cochinchine a cessé d'exister. Son territoire fait désormais partie intégrante des provinces de l'État du Vietnam, et notre bureau diplomatique à Saigon est en train d'être démantelé au moment où l'annonce est publiée - il n'y a plus rien à faire dans cette ville pour un de nos diplomates.\n\nLe chef de l'État serait personnellement ravi, ce qui, selon ceux qui le connaissent, n'est pas un mot qui s'applique souvent. Il y a eu beaucoup de célébrations dans les rues, certaines organisées et la plupart non.\n\nCela compte au-delà de la carte. Tous les arguments avancés contre ce gouvernement depuis sa création reposent sur l'affirmation selon laquelle il ne gouverne pas réellement le Vietnam, mais uniquement les parties que la France ne s'est pas réservées. Cette affirmation est plus faible ce soir qu'elle ne l'était ce matin, et ceux qui la feront devront en trouver une autre."
 CCC_Unification.4.a: "Lentement mais sûrement, le Vietnam redevient un."

 CCC_Unification.5.t: "La Cochinchine refuse l'unification !"
 CCC_Unification.5.d: "La Cochinchine a refusé. Notre bureau diplomatique à Saigon restera ouvert plus longtemps que prévu, car la réponse des représentants de la République autonome n'était pas une contre-offre mais un refus et elle était formulée pour être publiée. Ils ne se soumettront pas, disent-ils, à l'autorité des « imbéciles incompétents de l'État du Vietnam ».\n\nBao-Dai a été immédiatement informé et aurait quitté ses appartements sans rien dire à personne, de téléphoner aux Français et d'exiger une intervention immédiate. Rien n'est revenu du Haut-Commissariat, ce qui constitue en soi une sorte de réponse.\n\nLes rues n'ont pas attendu que le gouvernement rédige une déclaration. Des foules se sont formées dans le centre-ville tout l'après-midi et ce qu'elles crient, ce n'est pas la Cochinchine mais nous, un gouvernement qui a annoncé l'unification avant de l'avoir réalisée. La prétention de parler au nom de tout le Vietnam a été publiquement refusée par les Vietnamiens, et aucun communiqué ne pourra remédier à cela rapidement."
 CCC_Unification.5.a: "Nous sommes divisés, mais pas pour longtemps."

 CCC_Unification.6.t: "Un plaidoyer de Bao-Dai"
 CCC_Unification.6.d: "Bao-Dai a encore écrit sur la Cochinchine. Les pourparlers entre Saigon et son gouvernement ont suivi le chemin de tous les autres, et il nous demande une fois de plus d'unifier les deux sous une seule administration au nom de la stabilité vietnamienne.\n\nSa persévérance est usée et son cas n'est pas mauvais. Un Sud divisé signifie deux trésors, deux administrations et deux groupes d'officiers avec lesquels il faut se disputer, et nous menons une guerre à travers les deux.\n\nCompte tenu de l'état de la campagne, le ministère estime que nous devrions faire ce qu'il demande et convaincre la Cochinchine d'adhérer à l'union - avec fermeté et sans laisser d'empreintes digitales. Quoi qu'il en soit, ce sera au moins un gouvernement vietnamien unique, et il sera amical envers nous."
 CCC_Unification.6.a: "La Cochinchine a trop joué, finissons-en pacifiquement maintenant."

 CCC_Unification.7.t: "Un ultimatum final"
 CCC_Unification.7.d: "Les Français ont rendu leur dernier mot sur l'unification, et ce n'est pas une demande. Nous devons rejoindre le gouvernement de Bao-Dai, parce que Bao-Dai leur a dit qu'il prendrait la Cochinchine par la force si nous n'arrivons pas pacifiquement, et ils ont décidé de ne pas l'arrêter.\n\nNous pouvons accepter. L'unification selon ses conditions maintient la paix entre les Vietnamiens, laisse nos administrateurs à leurs postes sous un drapeau différent et met fin à la dispute qui consume cette république depuis quatre ans.\n\nOu nous pouvons refuser et conserver ce que nous détenons. Le conseil doit comprendre précisément ce que dit entre ses lignes la note française avant de voter : si Bao-Dai marche, ils ne viendront pas. Quelle que soit la manière dont nous décidons, nous décidons seuls."
 CCC_Unification.7.a: "C'est peut-être pour le mieux."
 CCC_Unification.7.b: "Notre décision est définitive, nous ne nous inclinerons pas devant Bao-Dai !"

 CCC_Unification.8.t: "La Cochinchine se soumet !"
 CCC_Unification.8.d: "Il est naturel que notre glorieux chef Bao-Dai attire la Cochinchine dans l'État du Vietnam. Le général Nguyen-Van-Xuan a, à juste titre, un grand respect, car l'hégémonie de Bao-Dai sur l'ensemble du Vietnam est juste, prometteuse et naturelle. Bao-Dai est le plus grand dirigeant que notre nation ait jamais eu au cours de ses milliers d'années d'histoire. Ses compétences diplomatiques, son sens économique et sa personnalité autoritaire le rendent inarrêtable et écraseront sûrement la menace communiste du Nord.\n\nL'unification de la Cochinchine avec notre Gouvernement Central Provisoire nous mènera à une grandeur sans équivoque. Nguyen-Van-Xuan comprend que sous un gouvernement centralisé supérieur, nous pouvons vaincre les communistes et créer un véritable État vietnamien moderne."
 CCC_Unification.8.a: "Nous sommes enfin un..."

 CCC_Unification.9.t: "La Cochinchine refuse encore !"
 CCC_Unification.9.d: "Le général Nguyen-Van-Xuan a encore refusé. Il n'unira pas sa Cochinchine occupée au reste du pays, et son refus a été publié dans des termes clairement écrits pour être cités. Qu'un Vietnamien refuse de se ranger aux côtés des Vietnamiens contre les communistes du Nord sera une tache sur ce pays pendant des années.\n\nSon argument avancé est que notre ancien roi est inapte à gouverner, à cause de ce que les journaux de Saigon appellent délicatement les controverses. Bao-Dai porte le poids d'une nation sur son dos. Ce n'est ni une surprise ni un crime qu'un homme si chargé prenne ses plaisirs là où il les trouve, et ce n'est certainement pas une raison pour qu'un général maintienne une région entière hors de l'État.\n\nDe la part d'un sympathisant français, c'est exactement ce à quoi il fallait s'attendre : l'avidité déguisée en principe et l'appétit du pouvoir présenté en prudence. Le peuple le verra tel qu'il est, tout comme le monde, et tous deux comprendront pourquoi l'autorité du chef de l'État doit s'étendre sur l'ensemble du Vietnam."
 CCC_Unification.9.a: "Le Sud-Vietnam sera uni une fois pour toutes !"

 CCC_Unification.10.t: "Bao-Dai s'empare de la Cochinchine !"
 CCC_Unification.10.d: "Récemment, Bao-Dai est arrivé à Saigon pour démontrer qu'il a unifié la Cochinchine et l'Annam sous son gouvernement. Même si cela signifie que la Cochinchine est perdue pour l'instant, car nos troupes sont dépassées en nombre par les Français et leurs laquais, nous ne devons pas abandonner notre rêve de réunifier le Vietnam. Nous ne devons pas arrêter cette guerre tant que le Vietnam n'est pas libéré de l'impérialisme !"
 CCC_Unification.10.a: "Ne perdons pas espoir, ce n'est qu'un début."

 # CCC Political Events
 CCC_Pol.1.t: "La question de l'identité"
 CCC_Pol.1.d: "Maintenant que notre constitution est rédigée, les dirigeants cochinchinois doivent résoudre le débat central : sommes-nous en tant que Nam-Ky, la culture distinctive du Mékong et de Saigon, ou prétendons-nous être les porte-étendards Quoc-Gia de tout le Vietnam ?"
 CCC_Pol.1.a: "Nous sommes Nam-Ky, un peuple à part."
 CCC_Pol.1.b: "Nous sommes les vrais nationalistes vietnamiens."

 # CCC Dan-xa Party Events
 CCC_DanXa.1.t: "Le coup d'État Dan-xa"
 CCC_DanXa.1.d: "Inspiré par le vénérable Huynh-Phu-So de la foi bouddhiste Hoa-Hao, le parti Dan-xa - le Parti socialiste démocratique vietnamien - a lancé un coup d'État audacieux contre le gouvernement de Bao-Dai. S'appuyant sur le sentiment anticolonial populaire et sur une vision de libération nationale fondée sur l'éthique bouddhiste et la justice sociale, les forces Dan-xa ont réussi à prendre le contrôle de la Cochinchine. Le coup d'État déclare l'indépendance du colonialisme français et du communisme marxiste, proclamant une troisième voie : une révolution morale enracinée dans la dignité humaine et une gouvernance d'inspiration bouddhiste."
 CCC_DanXa.1.a: "Les gens ont parlé - accueillez cette nouvelle aube."
 CCC_DanXa.1.b: "Le coup d'État réussit, mais la lutte ne fait que commencer."

 CCC_DanXa.2.t: "La guerre de résistance Dan-xa"
 CCC_DanXa.2.d: "La prise du pouvoir par le parti Dan-xa a plongé la Cochinchine dans une lutte à trois : l'armée coloniale française, le Viet-Minh communiste et les forces Dan-xa elles-mêmes. Enfermé dans un conflit armé sur plusieurs fronts, le mouvement de résistance Dan-xa mobilise ses partisans - moines bouddhistes, milices paysannes et guérilleros - pour défendre leur vision d'un Vietnam indépendant et moralement centré. La guerre draine les ressources mais rallie la population derrière l'étendard de la libération nationale."
 CCC_DanXa.2.a: "Mobilisez le peuple : la victoire réside dans la lutte."
 CCC_DanXa.2.b: "La guerre est coûteuse mais nécessaire à notre survie."
 # === FUL Events extracted from VIE_events_l_english.yml ===
 # FUL Unification - Integration
 FUL_Unification.1.t: "Le pays montagnard ratifie Du-So 6/QT/TG"
 FUL_Unification.1.d: "Le ministère de l'Outre-mer a transféré l'autorité sur les hauts plateaux de Trung-Phan du Pays autonome montagnard à [VIE.GetNameDef]. Sur le papier, le plateau nous appartient.\n\nLe chef de l'Etat ne l'a pas intégré à l'administration ordinaire. Par \"Du-So 6/QT/TG\", il a complètement détaché les hauts plateaux de Trung-Phan des ministères et les a constitués comme domaine de la Couronne : un ordre juridique distinct à l'intérieur de l'État du Vietnam, détenu comme sa possession personnelle. À l'intérieur de ses frontières, il n'est pas chef d'État mais empereur, et les deux titres reposent désormais sur le même homme dans le même pays.\n\nC'est une réponse intéressante à un problème que personne d'autre n'avait résolu. C'est aussi un arrangement selon lequel les hauts plateaux répondent à une personne plutôt qu'à un État, et les hommes qui l'ont rédigé à Da-Lat comprennent très bien qu'une personne est plus facile à remplacer qu'une constitution."
 FUL_Unification.1.a: "Encore un toast à notre Chef de l'État et à la Solution Quoc-Gia !"

 FUL_Unification.2.t: "La France rétablit la domination coloniale sur les Montagnards"
 FUL_Unification.2.d: "Léon Pignon, à la tête du Haut Comité français en Indochine, a proclamé une République montagnarde dans ce qui était jusqu'à ce matin le domaine de la couronne des hauts plateaux de Trung-Phan.\n\nIl a fait cette annonce depuis le palais du maire de Da-Lat. L'argument était que les peuples montagnards ont besoin d'être protégés - pour leur développement, leur culture distinctive, pour leur sécurité - contre la vietnamisation, contre la colonisation et contre l'instabilité produite par le récent changement de régime dans le sud.\n\nLisez cette liste une deuxième fois. Un haut-commissaire français, debout dans une station de montagne française, a déclaré que les montagnards devaient être protégés de la colonisation et a proposé d'effectuer lui-même la protection. Le Domaine nous appartenait par un décret rédigé par Paris et ratifié par Paris. Il a été repris par un discours."
 FUL_Unification.2.a: "Quelle ironie... nous allons émettre une notion de protestation contre le gouvernement français."

 FUL_Unification.3.t: "Demander la domination sur les hautes terres de Trung-Phan"
 FUL_Unification.3.d: "L'Empereur et le Parlement ont télégraphié directement à Paris \"Du-So 1/HD/CN-TP\", demandant l'autorité sur le territoire du Pays Montagnard Autonome.\n\nLes bases juridiques ont été posées il y a des années. La France a délégué la gestion des hauts plateaux du centre à l'ancien gouvernement central provisoire en mai 1949, et Bao-Dai a converti la délégation en domaine de la Couronne par le numéro Du 6/QT/TG en avril 1950. La position de Nam-Hung est que les deux instruments étaient de jure et rien de plus. Les montagnards continuèrent à se gouverner eux-mêmes, continuèrent à refuser le nouveau gouvernement et, dans plusieurs districts, firent encore pire que de refuser.\n\nLe télégramme nomme ces districts. Il nomme Dinh-Nup et décrit les raids sur Kinh et d'autres villages sédentaires qui ont été lancés aux portes des bandes montagnardes travaillant aux côtés du Viet Minh. Que Paris accepte ou non ce récit, la demande a été formulée dans le langage de la sécurité plutôt que de la souveraineté, et la sécurité est le seul langage que lit actuellement le ministère des Outre-mer."
 FUL_Unification.3.a: "Nous espérons qu'ils nous accorderont notre autorité légitime sur cette terre sauvage."

 FUL_Unification.4.t: "[GetVIEChiefOfState] Demande la domination sur les hautes terres de Trung-Phan"
 FUL_Unification.4.d: "Le nouveau gouvernement de Cuong-De nous a télégraphié directement \"Du-So 1/HD/CN-TP\", demandant l'autorité sur le territoire du Pays Autonome Montagnard.\n\nL'affaire était, nous l'avions supposé, réglée. Nous avons délégué l'administration de ces régions au gouvernement de Bao-Dai en mai 1949, et la délégation a été ratifiée par Du numéro 6/QT/TG en avril 1950. Phu-Xuan soutient que l'accord était de jure seulement : que les montagnards sont restés effectivement indépendants jusqu'au bout, qu'ils se sont depuis opposés à l'administration et que certains d'entre eux aident activement le Viet Minh dans les raids sur nos plantations dans la région.\n\nLe côté inconfortable du télégramme est qu'il est globalement exact. La question qui se pose au ministère n'est donc pas de savoir si l'empereur a raison au sujet des hauts plateaux, mais si nous préférerions conserver un plateau que nous ne pouvons pas contrôler, ou le confier à un gouvernement que nous n'avons ni choisi ni voulu."
 FUL_Unification.4.a: "Nous préférons garder les régions montagnardes sous notre domination dans un avenir proche."
 FUL_Unification.4.b: "Très bien, nous allons passer le pouvoir."

 FUL_Unification.5.t: "La France nie notre domination sur les hauts plateaux de Trung-Phan"
 FUL_Unification.5.d: "Le ministère des Outre-mer a refusé \"Du-So 1/HD/CN-TP\". L'autorité sur les hauts plateaux de Trung-Phan reste à Paris, et la raison invoquée est la sécurité des colonies et plantations françaises dans la région.\n\nC'est la raison publiée. Ce que nos propres gens sur le plateau rapportent, c'est que les bataillons de sécurité français et montagnards stationnés là-bas - des détachements de quelques centaines d'hommes il y a un mois - ont été rapidement élargis et déplacés vers de nouveaux postes depuis la rédaction du refus. La justification officielle de ce renforcement est la prévention d'un nouveau terrorisme vietminh et montagnard.\n\nUn gouvernement qui entend uniquement protéger ses planteurs n'a pas besoin de nouvelles garnisons dans des régions où aucun planteur n'a jamais mis les pieds. Paris a décidé de tenir les hauts plateaux, et il a décidé de les tenir contre nous autant que contre quiconque."
 FUL_Unification.5.a: "Ce n'est qu'une excuse. C'est NOTRE terre légitime..."

 FUL_Unification.6.t: "La France approuve notre domination sur les hauts plateaux de Trung-Phan"
 FUL_Unification.6.d: "Le Ministère des Outre-mer a agréé « Du-So 1/HD/CN-TP ». L'autorité sur les hauts plateaux de Trung-Phan passe immédiatement à ce gouvernement, et le transfert est inconditionnel à tous égards, sauf un.\n\nLes bataillons de sécurité français et montagnards restent là où ils sont, dans un avenir prévisible, pour empêcher la poursuite du terrorisme vietminh et montagnard. Personne n'a défini l'avenir prévisible, et personne n'a dit qui commandera ces bataillons une fois que l'administration sera la nôtre. Il faudra poser la question, et elle ne le sera pas cette semaine.\n\nL'Empereur a déjà publié un Du établissant une administration autonome sur le plateau, et le Kien-Quoc Quan commence immédiatement à emprunter les routes des hautes terres. Ce que nous avons obtenu est un titre de propriété. Ce que nous n'avons pas encore, c'est le plateau."
 FUL_Unification.6.a: "L'acte est signé - maintenant pour le terrain"
 # === NUN Events extracted from VIE_events_l_english.yml ===
 # NUN Unification - Integration
 NUN_Unification.1.t: "Bao-Dai exige notre soumission"
 NUN_Unification.1.d: "Le ministère de l'Outre-mer français a transféré l'autorité sur les régions ethniques autonomes des Hauts Plateaux du Centre et du Haut-Sud au gouvernement national du Vietnam. Il ne nous a pas consultés, ni les chefs.\n\nBao-Dai n'a pas tant administré le transfert qu'il l'a empoché. Par Du So 6/QT/TH, il a complètement détaché les Hauts Plateaux du Centre de l'administration ordinaire et les a constitués sous le nom de Hoang-Trieu Cuong-Tho, les domaines de la Couronne. Au sein d'eux, il n'est pas chef de l'État mais empereur, dirigeant personnellement, et nos districts sont son fief.\n\nParis a promis par écrit d'accorder et de protéger notre indépendance du Vietnam une fois la guerre contre les communistes terminée. Saïgon vient d'envoyer un télégramme exigeant notre soumission sur la base d'un décret que Paris lui a permis de prendre. Les deux affirmations ne peuvent pas être vraies et nous devons répondre à celle qui est arrivée en premier."
 NUN_Unification.1.a: "Nous nous conformerons tant que leur promesse de liberté sera tenue."
 NUN_Unification.1.b: "Les Français nous ont promis le droit de défendre notre indépendance !"

 NUN_Unification.2.t: "Le Nung Accepte"
 NUN_Unification.2.d: "Après mûre réflexion, les dirigeants Nung ont décidé d'accepter les conditions de Bao-Dai et de se soumettre à l'accord sur les domaines de la Couronne. Bien que cela représente un compromis important pour leur autonomie, les dirigeants Nung ont conclu que la coopération avec le gouvernement vietnamien est préférable à la confrontation, surtout compte tenu de la menace communiste persistante et de la promesse de protection de la France.\n\nLe processus d'intégration commencera immédiatement, les territoires Nung étant incorporés à l'État du Vietnam en tant que région autonome. Les Nung conserveront un certain degré d'autonomie gouvernementale, mais l'autorité ultime reviendra à Bao-Dai en tant que chef d'État et empereur des domaines de la Couronne.\n\nCette décision a suscité des réactions mitigées au sein de la population Nung. Certains y voient un choix pragmatique garantissant leur sécurité, tandis que d'autres y voient une trahison de leur indépendance. Cependant, la décision des dirigeants est maintenue et les Nung feront désormais partie de la structure étatique vietnamienne plus large."
 NUN_Unification.2.a: "Un nouveau chapitre commence pour le peuple Nung."

 NUN_Unification.3.t: "Les Nung refusent"
 NUN_Unification.3.d: "Les dirigeants Nung ont fermement rejeté la demande de soumission de Bao-Dai. Citant les promesses antérieures d'indépendance et de protection du gouvernement français, les Nung ont déclaré leur intention de maintenir leur autonomie et de résister à l'intégration dans les domaines de la Couronne.\n\nCe refus représente un défi important pour l'autorité de Bao-Dai et ses projets de consolidation du contrôle sur les régions ethniques. La décision Nung envoie un message clair : ils ne se laisseront pas facilement subjuguer, même face aux pressions du gouvernement central.\n\nLes conséquences de ce refus restent incertaines. Bao-Dai tentera-t-il de forcer le problème par des moyens militaires, ou cherchera-t-il une solution diplomatique ? Les Nung ont clairement exprimé leur position et la balle est désormais dans le camp du gouvernement vietnamien."
 NUN_Unification.3.a: "Nous ne tolérerons pas cela."
 # === FUL Events (Dan-Vuong/Economic/Military) extracted from VIE_events_l_english.yml ===
 # Dan-Vuong Model in FUL
 FUL_DanVuong_Model.1.t: "Présentation du modèle Dan-Vuong aux Montagnards"
 FUL_DanVuong_Model.1.d: "Pendant des siècles, les tribus montagnardes ont été tenues dans une guerre intertribale perpétuelle, dans des superstitions et dans des croyances qu'aucune puissance extérieure n'a jamais eu de difficulté à utiliser pour son propre usage. Ce n'est pas une accusation contre eux. C'est la raison pour laquelle toutes les forces impérialistes venues en Indochine ont trouvé les hauts plateaux faciles.\n\nLa « République » montagnarde autoproclamée et le projet de Léon Pignon qui la sous-tend prouvent ce point plutôt que de le réfuter. Un peuple gouverné en son nom par un haut-commissaire français n'a pas encore appris à se gouverner lui-même, et il y a plus de respect à le dire clairement qu'à le flatter.\n\nNous allons donc enseigner. Le modèle Dan-Vuong doit être transposé dans les hauts plateaux - dans les écoles, les marchés et les conseils de village - afin que lorsque l'autonomie leur sera accordée au sein de ce pays, il y ait des hommes sur le plateau capables de l'exercer. Ils doivent être nos compatriotes, et les compatriotes sont créés plutôt que proclamés."
 FUL_DanVuong_Model.1.db: "Pendant des siècles, nous avons été prisonniers d'une guerre intertribale perpétuelle, de superstitions et de croyances qu'aucune puissance extérieure n'a jamais eu de difficulté à retourner contre nous. Ce n'est pas une chose confortable à dire dans notre propre conseil. C'est aussi la raison pour laquelle toutes les forces impérialistes venues en Indochine ont trouvé ces hauts plateaux faciles.\n\nLa « République » montagnarde autoproclamée et le projet de Léon Pignon qui la sous-tend prouvent ce point plutôt que de le réfuter. Un peuple gouverné en son nom propre par un haut-commissaire français n'a pas encore appris à se gouverner lui-même, et il n'y a aucune dignité à prétendre le contraire.\n\nNous allons donc apprendre. Le modèle Dan-Vuong est à enseigner dans nos écoles, nos marchés et nos conseils de village, pour que lorsque l'autonomie nous parviendra au sein du [VIE.GetNameDef] il y ait des hommes sur ce plateau capables de l'exercer. Nous devons être compatriotes, et les compatriotes se créent plutôt que ne se proclament."
 FUL_DanVuong_Model.1.a: "Nous sommes un ! Nous sommes vietnamiens après tout !"

 FUL_DanVuong_Model.2.t: "Visite de Nam-Hung dans les hauts plateaux du centre"
 FUL_DanVuong_Model.2.d: "L'Empereur est arrivé à Da-Lat. Nam-Hung a voyagé deux jours depuis Phu-Xuan en train et en voiture blindée sous la protection du maréchal Tran-Quang-Vinh, emmenant avec lui une délégation de vétérans de Phuc-Quoc - Ngo-Dinh-Diem, Hoang-Nam-Hung et Nguyen-Rinh-Nhiep - dans la ville thermale qui servait de capitale d'été à Bao-Dai.\n\nLa fête a été vue au lac Xuan-Huong, le long de la Côte d'Azur, au lycée Yersin et à la nouvelle académie des cadets de Da-Lat, où l'empereur a brièvement parlé aux officiers en formation sur les rêves et la lutte, et a déclaré qu'une nation en difficulté n'est soutenue par rien d'autre.\n\nCe qui n'a pas été visité a suscité plus de commentaires que ce qui l'a été. L'itinéraire contournait chacun des palais et villas de Bao-Dai dans ces collines, et l'empereur les a décrits, à la vue de la presse, comme un gaspillage total d'argent et de ressources en temps de guerre. La tournée devrait se poursuivre à Bao-Loc, Ban-Me-Thuot et Dar-Lac avant de retourner dans la capitale."
 FUL_DanVuong_Model.2.db: "L'Empereur est arrivé à Da-Lat. Nam-Hung a voyagé deux jours depuis Phu-Xuan en train et en voiture blindée sous la protection du maréchal Tran-Quang-Vinh, emmenant avec lui une délégation de vétérans de Phuc-Quoc - Hoang-Nam-Hung et Nguyen-Rinh-Nhiep - dans la ville thermale qui servait de capitale d'été à Bao-Dai. L'absence dans cette liste du nom que tout le monde s'attendrait à y trouver a été constatée dans tous les salons des Highlands.\n\nLa fête a été vue au lac Xuan-Huong, le long de la Côte d'Azur, au lycée Yersin et à la nouvelle académie des cadets de Da-Lat, où l'empereur a brièvement parlé aux officiers en formation sur les rêves et la lutte, et a déclaré qu'une nation en difficulté n'est soutenue par rien d'autre.\n\nCe qui n'a pas été visité a suscité plus de commentaires que ce qui l'a été. L'itinéraire contournait chacun des palais et villas de Bao-Dai dans ces collines, et l'empereur les a décrits, à la vue de la presse, comme un gaspillage total d'argent et de ressources en temps de guerre. La tournée devrait se poursuivre à Bao-Loc, Ban-Me-Thuot et Dar-Lac avant de retourner dans la capitale."
 FUL_DanVuong_Model.2.a: "Nous avons hâte de vous accueillir à Bao-Loc !"
 FUL_DanVuong_Model.2.b: "Nous avons hâte de visiter Bao-Loc !"

 # Economic

 # Economic Committee
 FUL_Econ_Committee.1.t: "Formation du Comité économique montagnard"
 FUL_Econ_Committee.1.d: "Parmi les dispositions de Quy-Che 16, convenues entre le chef de l'État et le haut-commissaire Pignon, figurait la création du « Hoi-Dong Kinh-Te Xu-Thuong », le Comité économique des hauts plateaux. Il est désormais constitué et détient l'ensemble de l'autorité économique sur le domaine de la Couronne : propositions, planification et politique.\n\nSa première annonce est une vague de réformes visant directement les tribus. Les Montagnards auront le droit de détenir des terres en nom propre, ce qu'aucune administration de ce plateau ne leur a jamais accordé, et un programme de travaux d'infrastructure s'ensuit.\n\nLe titre foncier constitue la partie substantielle et tout le reste n'est que décoration. Un peuple qui ne peut pas posséder ce qu'il cultive peut en être expulsé par n'importe quel planteur disposant d'une concession et d'un avocat, et cela a été toute l'histoire de ces hautes terres. C'est sur cette base que le Comité sera jugé si le droit survivra au contact avec les concessions déjà accordées."
 FUL_Econ_Committee.1.a: "Nous assurerons la prospérité économique de la région."

 # Colonel Massau's Proposal
 Colonel_Massau.1.t: "Proposition du colonel Jacques Massau"
 Colonel_Massau.1.d: "Il y a une proposition datant de 1949 dans les dossiers qui a été mise de côté et qui n'a jamais été complètement supprimée. Le colonel Jacques Massu le proposa et le haut-commissaire d'Argenlieu l'approuva : des soldats français à la retraite seraient installés sur le plateau montagnard, dotés de terres et établis là comme planteurs.\n\nElle fut suspendue indéfiniment au retour de Bao-Dai, pour des raisons politiques plutôt que de mérite. Son objectif était d'accomplir deux choses à la fois : une population française enracinée dans les hauts plateaux pour y maintenir les intérêts français sans les dépenses d'une garnison, et le développement d'une région dont personne n'a jamais sérieusement exploité le potentiel économique.\n\nLe potentiel est toujours là, tout comme l'argent qui en découlerait. L'objection aussi. Une colonie d'anciens combattants français armés implantée sur un terrain que les Vietnamiens et les montagnards prétendent n'est pas un projet de colonisation ; c'est une guerre future avec une adresse de retour française dessus."
 Colonel_Massau.1.a: "Nous avons besoin d'argent !"
 Colonel_Massau.1.b: "Cela ne ferait que diviser notre nation."

 # French Economic Aid
 French_Econ_Aid.1.t: "Le domaine de la Couronne des Hautes Terres du Sud demande une aide économique"
 French_Econ_Aid.1.d: "Le Domaine de la Couronne des Hauts Plateaux du Sud a sollicité une aide économique du gouvernement français. La demande a été formulée par le président du Domaine de la Couronne, Léon Pignon, et a été approuvée par le haut-commissaire français, Georges Thierry d'Argenlieu. L'aide sera utilisée pour aider le domaine de la Couronne des Southern Highlands à développer son économie et ses infrastructures."
 French_Econ_Aid.1.a: "D'accord."
 French_Econ_Aid.1.b: "Non."

 French_Econ_Aid.2.t: "Les Français acceptent."
 French_Econ_Aid.2.d: "Le gouvernement français a accepté la demande d'aide économique du Domaine de la Couronne des Hauts Plateaux du Sud. L'aide sera utilisée pour aider le domaine de la Couronne des Southern Highlands à développer son économie et ses infrastructures."
 French_Econ_Aid.2.a: "Nous aiderons le domaine de la Couronne des Hautes Terres du Sud à développer son économie et ses infrastructures."

 French_Econ_Aid.3.t: "Les Français refusent."
 French_Econ_Aid.3.d: "Le gouvernement français a refusé la demande d'aide économique du Domaine de la Couronne des Hauts Plateaux du Sud. Le gouvernement a cité le manque de développement économique et d'infrastructures du domaine de la Couronne des Southern Highlands comme raison de son refus."
 French_Econ_Aid.3.a: "Nous ne tolérerons aucune forme de néo-impérialisme !"

 # Central Highland Railway
 Central_Highland_Railway.1.t: "Le chemin de fer central trans-indochinois des hautes terres"
 Central_Highland_Railway.1.d: "Une délégation de fonctionnaires nommés du Domaine des Hautes Terres du Sud est arrivée au palais avec un groupe de planteurs français et a demandé une audience personnelle avec [GetVIEChiefOfState]. Ils sont venus avec une carte.\n\nCe qu'ils proposent, c'est le « Chemin de fer central trans-indochinois des hautes terres » : quelque sept cents kilomètres de ligne parcourant la steppe située au-dessous de la chaîne annamite. Le trajet actuel dure dix-sept heures par beau temps, et les planteurs le mettent à deux heures de moins une fois la ligne ouverte. Cela semble bien peu de chose, jusqu'à ce que l'on se souvienne que l'ensemble de l'économie des hautes terres évolue actuellement à la vitesse d'une route qui est emportée par les eaux à chaque saison des pluies.\n\nLes planteurs trouveront un quart du coût de leurs propres poches, et les entrepreneurs et ingénieurs français se chargeront de la construction. On nous demande les trois quarts restants, ainsi que la sécurité. La ligne traverse sur toute sa longueur un pays dans lequel le Viet Minh se déplace à sa guise, et chaque kilomètre devra être surveillé aussi longtemps qu'il faudra pour poser."
 Central_Highland_Railway.1.a: "Un projet ambitieux, nous l'approuverons !"
 Central_Highland_Railway.1.b: "Nous ne pouvons pas financer un chemin de fer et une guerre en même temps"

 Central_Highland_Railway.2.t: "Le plan du chemin de fer central trans-indochinois des hautes terres est approuvé"
 Central_Highland_Railway.2.d: "Après des séries de négociations entre les autorités et les propriétaires de plantations français, notre projet de construction du Central Trans-Indochine Highland Railway est approuvé. Nous commencerons la construction du chemin de fer dès que possible avec des fonds publics et privés pour payer les travailleurs. Espérons que ce chemin de fer plaira à tout le monde une fois terminé !"
 Central_Highland_Railway.2.a: "Excellent!"

 Central_Highland_Railway.3.t: "Le projet du chemin de fer central trans-indochinois des hautes terres est rejeté"
 Central_Highland_Railway.3.d: "Malgré tous nos efforts pour négocier avec les autorités et les propriétaires de plantations français, il semble qu'ils aient rejeté notre projet de chemin de fer central trans-indochinois. Malheureusement, cela signifie que nous devrons alors compter sur l'itinéraire le plus ancien et le plus long pour arriver à destination."
 Central_Highland_Railway.3.a: "Tout ça pour rien."

 Central_Highland_Railway.4.t: "Ouverture du chemin de fer central trans-indochinois des hautes terres"
 Central_Highland_Railway.4.d: "Aujourd'hui, nous célébrons l'ouverture du chemin de fer central trans-indochinois des hautes terres. Avec ce chemin de fer, nous pouvons nous déplacer entre les villes à l'intérieur des chemins de fer plus rapidement qu'auparavant. C'est une autre victoire pour les citoyens et les propriétaires de plantations !"
 Central_Highland_Railway.4.a: "Excellent!"

 Central_Highland_Railway.5.t: "Le chemin de fer central trans-indochinois des hautes terres est terminé"
 Central_Highland_Railway.5.d: "Excellente nouvelle ! Après tout le travail acharné pour construire et sécuriser la construction du chemin de fer contre le sabotage du Viet-Minh, nous avons réussi à terminer le chemin de fer à temps pour l'inauguration officielle. Espérons que ce projet sera payant à long terme."
 Central_Highland_Railway.5.a: "Excellent!"

 # Military

 # Montagnard Armed Forces
 FUL_Armed_Forces.1.t: "Moderniser nos forces armées"
 FUL_Armed_Forces.1.d: "Le domaine de la Couronne des Southern Highlands a demandé la modernisation de ses forces armées. La demande a été formulée par le président du Domaine de la Couronne, Léon Pignon, et a été approuvée par le haut-commissaire français, Georges Thierry d'Argenlieu. La modernisation servira à aider le domaine de la Couronne des Hautes Terres du Sud à se défendre contre les révoltes locales des Montagnards et les incursions du Viet-Minh."
 FUL_Armed_Forces.1.a: "Nous moderniserons nos forces armées."

 FUL_Armed_Forces.2.t: "Les hauts plateaux du centre demandent une aide militaire"
 FUL_Armed_Forces.2.d: "Un télégramme est parvenu à [VIE.capital.GetName] et au ministère de la Défense à partir de [FUL.capital.GetName], et son ton se rapproche d'un plaidoyer ouvert.\n\nLe Crownland demande du matériel et des conseillers, en urgence. Les retours qu'ils joignent expliquent pourquoi. La majeure partie de ce que transportent leurs formations date des années 1910 et 1930, et une grande partie était obsolète lorsque les Français les leur ont fourni pour la première fois. Contre les révoltes montagnardes dans leurs propres districts et contre les colonnes du Viet Minh qui descendent de l'autre côté de la frontière, cela ne suffit pas, et ils le disent eux-mêmes.\n\nNous avons du matériel de ce type exactement dans les dépôts parce que nous l'avons remplacé. Nous avons également nos propres unités qui attendent toujours d'être remplacées."
 FUL_Armed_Forces.2.a: "Nous enverrons certains de nos anciens équipements."
 FUL_Armed_Forces.2.b: "Nous n'avons même pas de matériel pour nous-mêmes, nous ne pouvons rien prêter."

 FUL_Armed_Forces.3.t: "[VIE.GetLeader] Approuve l'envoi d'un soutien militaire"
 FUL_Armed_Forces.3.d: "Notre demande urgente d'assistance militaire immédiate et de matériel a été approuvée par [VIE.capital.GetName], et les premiers envois de leur assistance militaire arriveront bientôt dans notre capitale. Ces nouveaux atouts nous aideront sans aucun doute grandement à combattre nos ennemis actuels et à stabiliser les territoires au nom de la cause Quoc-Gia !"
 FUL_Armed_Forces.3.a: "Nous n'oublierons pas leur aide !"

 FUL_Armed_Forces.4.t: "[VIE.GetLeader] Nous refuse"
 FUL_Armed_Forces.4.d: "[VIE.capital.GetName] nous a refusé. Notre demande d'assistance militaire immédiate et de matériel est refusée, et la raison invoquée est qu'ils sont eux-mêmes à court de ressources - difficultés d'approvisionnement constantes et combats quotidiens entre leur armée et les communistes qui consomment tout ce qui leur parvient.\n\nCela peut même être vrai. C'est certainement pratique, et cela nous laisse exactement là où nous en étions : tenir une frontière avec des fusils plus vieux que la plupart des hommes qui les portaient, contre un ennemi qui est mieux armé chaque mois qui passe.\n\nLes territoires doivent encore être détenus et la cause Quoc-Gia doit encore y être servie. Puisque le matériel ne nous sera pas donné, il faudra le trouver par d'autres moyens, et le conseil serait bien avisé de ne pas trop s'enquérir de ces moyens."
 FUL_Armed_Forces.4.a: "Nous demanderons aux Français la prochaine fois."

 # Militarizing the FUL-VIE Border
 Militarize_Viet_Border.1.t: "Poursuite de la militarisation dans les hauts plateaux du centre"
 Militarize_Viet_Border.1.d: "Le domaine de la Couronne des Hautes Terres du Sud a demandé que sa frontière avec le Vietnam soit davantage militarisée. Le Président Pignon en a fait la demande et le Haut-Commissaire d'Argenlieu l'a approuvée.\n\nLa justification avancée est entièrement interne : révoltes de montagnards dans les districts mêmes du Domaine et colonnes du Viet Minh travaillant dans les cols des hauts plateaux. Les deux sont réels, les deux s'aggravent et les bataillons de sécurité, avec leurs effectifs actuels, ne peuvent répondre à aucun des deux.\n\nCe que la demande ne se donne pas la peine d'expliquer, c'est pourquoi une défense contre la révolte et les infiltrations devrait être construite notamment le long de la frontière vietnamienne, plutôt qu'autour des districts réellement en révolte. Personne à Da-Lat n'a soulevé la question. Personne à Saigon ne l'a remarqué."
 Militarize_Viet_Border.1.a: "Déployez les bataillons et laissez Saigon tirer ses propres conclusions"

