 Nung_Independence.1.a: ""

 Nung_Independence.2.t: "A-sang déclare son indépendance"
 Nung_Independence.2.d: "Les dirigeants Nung de Mong Cai ont proclamé une République Nung indépendante, rejetant toutes les revendications formulées sur Hai-ninh par les autorités vietnamiennes à Hanoï et à Saigon. La proclamation cite la promesse française d'autonomie pour les minorités ethniques, et le nouveau gouvernement fait déjà appel à Paris et à Washington pour obtenir sa reconnaissance.\n\nUne république de quelques centaines de milliers d'habitants ne peut pas survivre longtemps. La question est de savoir si nous y répondons comme une rébellion à réprimer, ou comme un voisin dont la bonne volonté coûte moins cher que sa reconquête."
 Nung_Independence.2.a: "Hai-ninh est le sol vietnamien."
 Nung_Independence.2.b: "Mieux vaut un voisin amical qu'une frontière hostile."

