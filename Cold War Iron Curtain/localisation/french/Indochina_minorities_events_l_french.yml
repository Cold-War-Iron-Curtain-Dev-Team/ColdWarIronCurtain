 NUN_Vong.1.t: "La République Nung demande des investissements"
 NUN_Vong.1.d: "Le gouvernement de la République autoproclamée de Nung a contacté nos ministères pour leur demander des crédits de développement. Le président Vong-a-Sang veut des routes, un port moderne à Mong Cai et de l'argent pour payer les milices qui combattaient autrefois sous les ordres des officiers français.\n\nLes sommes sont modestes au regard du budget indochinois. Accepter garderait les Nung de notre côté de la ligne au nord ; refuser épargnerait un Trésor déjà saigné à blanc par la guerre et rappellerait Mong Cai qui avait accordé son indépendance en premier lieu."
 NUN_Vong.1.a: "Prolongez les crédits."
 NUN_Vong.1.b: "Le Trésor ne peut pas l'épargner."

 NUN_Vong.2.t: "La République Nung en quête de reconnaissance"
 NUN_Vong.2.d: "Un envoyé de la République Nung est arrivé à Washington pour demander une reconnaissance formelle. Les Nung se présentent comme un bastion anticommuniste fiable à la frontière chinoise, et ils ne se trompent pas sur la géographie.\n\nUne reconnaissance nous coûterait peu d'argent mais beaucoup d'argent avec Saigon, qui considère Hai-ninh comme un territoire vietnamien et considère comme une insulte une ambassade américaine à Mong Cai."
 NUN_Vong.2.a: "Reconnaissez la République Nung."
 NUN_Vong.2.b: "Nous ne pouvons pas nous permettre d'offenser Saigon."

 NUN_Vong.3.t: "La « République Nung » déporte notre peuple"
 NUN_Vong.3.d: "Les autorités de la République de Nung ont commencé à expulser les Vietnamiens de Hai-ninh. Les familles qui cultivent et font du commerce le long de la côte depuis des générations sont mises sur la route vers le sud avec ce qu'elles peuvent transporter, tandis que leurs terres sont cédées aux colons Nung et chinois.\n\nLes réfugiés arrivent déjà à nos postes. Nous pouvons les accueillir et les mettre au travail, à un coût sur commande dans les districts qui les accueillent, ou nous pouvons faire de leur sort une cause et traiter Mong Cai en conséquence."
 NUN_Vong.3.a: "Installez les réfugiés parmi notre propre peuple."
 NUN_Vong.3.b: "Mong Cai en répondra."

 NUN_Vien.1.t: "La prise de pouvoir du Viet-quoc à Hai-ninh ?"
 NUN_Vien.1.d: "Linh Quang Vien a emmené la République Nung sur la voie des Trois principes du peuple de Sun Yat-sen, et les hommes autour de lui sont les anciens cadres du Viet Nam Quoc Dan Dang et du Viet Nam Cach Menh Dong Minh Hoi, le même Viet Quoc qui était autrefois entré au Tonkin derrière les armées nationalistes chinoises.\n\nUn gouvernement Viet Quoc à la frontière, ayant des liens avec le Kuomintang, est une revendication rivale du nationalisme vietnamien lui-même. Nous pouvons le dénoncer et durcir notre peuple contre lui, ou déployer des efforts pour rassurer tranquillement les nationalistes dans nos propres rangs."
 NUN_Vien.1.a: "Dénoncez les marionnettes du Viet Quoc."
 NUN_Vien.1.b: "Rassurez nos propres nationalistes."

 #News Event

 NUN_VIN.0.t: "La région autonome populaire de Hai Ninh"
 NUN_VIN.0.d: "Aujourd'hui, le gouvernement du Vietminh a déclaré son intention de créer des régions autonomes pour l'autonomie des groupes ethniques dans leurs pays d'origine afin de promouvoir la coopération multiculturelle comme mesure contre le colonialisme français. Le président Hô Chi Minh et l'Assemblée nationale ont ainsi délivré des diplômes spéciaux. 219/SL concernant la création de la région autonome populaire de Hai Ninh après la défection du gouvernement colonial Nung dirigé par le colonel Vong-a-Sang au profit du Viet Minh. Le porte-parole du Vietminh a déclaré que cette décision contribuerait, espérons-le, à inciter davantage de groupes minoritaires en Indochine à faire défection à leurs côtés pour lutter contre le colonialisme français et à promettre de meilleurs traitements et des droits à l'autodétermination. "
 NUN_VIN.0.a: "Un geste intelligent !"

