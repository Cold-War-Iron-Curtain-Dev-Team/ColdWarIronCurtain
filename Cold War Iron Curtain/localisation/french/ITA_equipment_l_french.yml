 ITA_mechanized_marine_equipment_1:0 "Buffle d'eau LVT-4"
 ITA_mechanized_marine_equipment_1_short:0 "LVT-4"
 ITA_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 ITA_mechanized_marine_equipment_2:0 "LVT(A)-5"
 ITA_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 ITA_mechanized_marine_equipment_2_desc:0 "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
 ITA_mechanized_marine_equipment_3:0 "AAVP-7"
 ITA_mechanized_marine_equipment_3_short:0 "AAVP-7"
 ITA_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 ou AAVP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 ITA_mechanized_marine_equipment_4:0 "AAVP-7A1"
 ITA_mechanized_marine_equipment_4_short:0 "AAVP-7A1"
 ITA_mechanized_marine_equipment_4_desc:0 "Le LVTP-7 ou AAVP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 ITA_mechanized_marine_equipment_5:0 "Arisgateur VAL M113"
 ITA_mechanized_marine_equipment_5_short:0 "VAL Arisgateur"
 ITA_mechanized_marine_equipment_5_desc:0 "L'Arisgator est un véhicule amphibie à chenilles conçu par A.R.I.S. Co. Pour les forces amphibies italiennes, dérivées du M113. Il utilisait des caissons de coque pour la flottabilité et les hélices. En kit, il coûte 1/5 de l'AAV7"

