 ITA_infantry_equipment_1:0 "Modèle Garand 1952"
 ITA_infantry_equipment_1_short:0 "M52 Garand"
 ITA_infantry_equipment_1_desc:0 "Le M52 était une version produite sous licence du célèbre M1 Garand."

 ITA_infantry_equipment_2:0 "Beretta BM-59"
 ITA_infantry_equipment_2_short:0 "BM-59"
 ITA_infantry_equipment_2_desc:0 "Le Beretta BM 59 est un fusil de fabrication italienne basé sur le fusil M1 Garand, mais chambré en 7,62 × 51 mm OTAN et modifié pour utiliser un chargeur amovible. Les révisions ultérieures incorporaient d'autres caractéristiques communes aux fusils plus modernes."

 ITA_infantry_equipment_3:0 "Beretta AR70/223"
 ITA_infantry_equipment_3_short:0 " AR70/223"
 ITA_infantry_equipment_3_desc:0 "Le Beretta AR70/90 est un fusil à gaz chambré pour la cartouche OTAN de 5,56 × 45 mm et est le fusil de service standard des forces armées italiennes. L'arme est également conçue pour être équipée d'une grenade à fusil et possède des viseurs de grenade. La série AR se décline en de nombreuses variantes telles que l'AR90, avec une crosse pliable en fil, destinée aux parachutistes. "

 ITA_infantry_equipment_4:0 "Beretta AR70/90"
 ITA_infantry_equipment_4_short:0 "AR70/90"
 ITA_infantry_equipment_4_desc:0 "Le Beretta AR70/90 est un fusil à gaz chambré pour la cartouche OTAN de 5,56 × 45 mm et est le fusil de service standard des forces armées italiennes. L'arme est également conçue pour être équipée d'une grenade à fusil et possède des viseurs de grenade. La série AR se décline en de nombreuses variantes telles que l'AR90, avec une crosse pliable en fil, destinée aux parachutistes. "