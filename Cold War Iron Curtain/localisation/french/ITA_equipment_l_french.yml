 ITA_jet_multirole_equipment_10:0 "General Dynamics F-16A Block 15ADF Faucon de combat"
 ITA_jet_multirole_equipment_10_short:0 "F-16A Bloc 15ADF"
 ITA_jet_multirole_equipment_10_desc:0 "Depuis le début des années 90, l'armée de l'air italienne cherche avec impatience un remplaçant pour ses chasseurs Aeritalia F-104S Starfighter d'époque. Son remplaçant prévu est l'Eurofighter Typhoon. Ce programme étant en retard depuis quelques années, l'armée de l'air italienne avait besoin d'une solution provisoire. Le programme Peace Caesar était doté d'une version Block 15 spécifiquement équipée pour le rôle de défense aérienne, d'où le préfixe ; FAD"

 ITA_mr_stealth_fighter_equipment_1:0 "Eurofighter F-2000 Typhoon"
