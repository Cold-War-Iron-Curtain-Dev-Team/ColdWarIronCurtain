 ITA_cargo_helicopter_equipment_2:0 "Agusta A.101"
 ITA_cargo_helicopter_equipment_2_short:0 "Agusta A.101"
 ITA_cargo_helicopter_equipment_2_desc:0 "L'Agusta A.101 (initialement désigné AZ.101) était un grand prototype d'hélicoptère de transport développé en Italie dans les années 1960. Malgré des commandes potentielles des forces armées italiennes, aucun acheteur ne se manifeste et le projet est abandonné en 1971. "
 ITA_cargo_helicopter_equipment_5:0 "Boeing CH-47D-II Chinook"
