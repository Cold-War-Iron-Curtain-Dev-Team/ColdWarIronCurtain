 ITA_mechanized_heavy_equipment_3:0 "Transporteur, personnel, entièrement chenillé, blindé, M113 ACAV"
 ITA_mechanized_heavy_equipment_3_short:0 "M113 ACAV"
 ITA_mechanized_heavy_equipment_3_desc:0 "le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une des premières formes de l'IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 embarque un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes comme on le voit au Vietnam. Le M113 ACAV a été utilisé partout où le M113 était utilisé."
 ITA_mechanized_heavy_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A1 ACAV"
 ITA_mechanized_heavy_equipment_4_short:0 "M113A1 ACAV"
 ITA_mechanized_heavy_equipment_4_desc:0 "Version M113A1 ACAV avec des armes supplémentaires telles qu'un fusil sans recul."
