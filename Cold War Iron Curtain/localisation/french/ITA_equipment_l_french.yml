 ITA_jet_CAS_equipment_7_desc:0 "L'AMX International AMX est un avion d'attaque au sol développé conjointement par le Brésil et l'Italie. L'AMX est désigné A-11 Ghibli par l'armée de l'air italienne et A-1 par l'armée de l'air brésilienne. Le nom italien « Ghibli » vient du vent chaud et sec du désert libyen. "
