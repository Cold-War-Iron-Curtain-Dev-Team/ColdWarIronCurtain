 ITA_mechanized_equipment_1:0 "Demi-piste M2"
 ITA_mechanized_equipment_1_short:0 "Demi-piste M2"
 ITA_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 ITA_mechanized_equipment_2:0 "Demi-piste M3"
 ITA_mechanized_equipment_2_short:0 "Demi-piste M3"
 ITA_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 ITA_mechanized_equipment_3:0 "Demi-chenille M5"
 ITA_mechanized_equipment_3_short:0 "Demi-chenille M5"
 ITA_mechanized_equipment_3_desc:0 "Le M5 est un M3 Half-track doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit et est une version simplifiée du M3A1. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 ITA_mechanized_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, M59"
 ITA_mechanized_equipment_4_short:0 "M59"
 ITA_mechanized_equipment_4_desc:0 "Le M59 est un APC développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de 2 moteurs essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barre de torsion. Il peut se déplacer jusqu'à 32 mph sur 120 miles. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 était également utilisé comme porteur de mortier et comme véhicule de soutien."
