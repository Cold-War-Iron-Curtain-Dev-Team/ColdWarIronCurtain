 ITA_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 ITA_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 ITA_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet anglo-américain conjoint conçu par McDonnell Douglas avec British Aerospace. Au service du Corps des Marines des États-Unis depuis 1985, le « Harrier II » était considéré comme un outil important dans de nombreux conflits américains de mémoire récente."
 ITA_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 ITA_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 ITA_jump_jet_equipment_4_desc:0 "Mise à niveau à mi-vie de l'AV-8B, l'AV-8B Plus intègre un moteur amélioré, un système radar et une caméra infrarouge, ce qui en fait un avion d'attaque de nuit très efficace."

 ITA_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 ITA_jump_stealth_equipment_1_short:0 "F-35B Foudre II"
 ITA_jump_stealth_equipment_1_desc:0 "Un chasseur polyvalent produit à l'aide d'une conception JSF (Joint Strike Fighter). Bien qu'il soit capable d'utiliser une variété d'armes dans les combats air-air et sol-sol, le coût d'acquisition de ce chasseur furtif est plus gérable que celui du F-22A. Conformément à son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 
