 ITA_heavy_fighter_equipment_3_desc:0 "Un avion à double moteur à pistons conçu en mettant l'accent sur la vitesse et les armements lourds. Pendant la Seconde Guerre mondiale, sa vitesse a été utilisée dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme particulière lui a valu le nom de « der Gabelschwanz-Teufel » ou « le diable à queue fourchue » en Allemagne et de « Ni hikouki, ippairotto » ou « deux avions, un pilote » au Japon. Il est également connu sous le nom de « Foudre »."

