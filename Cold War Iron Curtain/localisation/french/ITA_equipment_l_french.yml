 ITA_jet_recon_equipment_1:0 "Chasseur stellaire Lockheed RF-104G"
 ITA_jet_recon_equipment_1_short:0 "Chasseur stellaire RF-104G"
 ITA_jet_recon_equipment_1_desc:0 "Le RF-104G était un modèle de reconnaissance tactique basé sur le F-104G, généralement équipé de trois caméras KS-67A montées à l'avant du fuselage à la place du canon interne. La plupart des 189 exemplaires construits ont ensuite été reconfigurés selon la norme F-104G"
 ITA_jet_recon_equipment_2:0 "Panavia Tornado ECR"
 ITA_jet_recon_equipment_2_short:0 "Tornade ECR"
 ITA_jet_recon_equipment_2_desc:0 "Version de guerre électronique du Panavia Tornado en service ouest-allemand. Pourrait être armé de missiles SEAD et de brouilleurs pour affronter les batteries de missiles sol-air soviétiques. Mais il a également joué un rôle de reconnaissance avec des modules de caméra."

