 ITA_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 ITA_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 ITA_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, un CH-47D amélioré, a effectué son vol inaugural ; le premier modèle de production a été déployé le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les mises à niveau comprennent des moteurs Honeywell de 4 868 chevaux (3 630 kW) et la cellule dotée d'une plus grande construction monobloc pour réduire les besoins de maintenance. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion pour augmenter la durée de vie."

