#AUS Army Aviation

 AUS_utility_helicopter_equipment_1:0 "Tourbillon de Westland HA.2"
 AUS_utility_helicopter_equipment_1_short:0 "Tourbillon HA.2"
 AUS_utility_helicopter_equipment_2:0 "Aérospatiale SA316 Alouette III"
 AUS_utility_helicopter_equipment_2_short:0 "SA316 Alouette III"
 AUS_utility_helicopter_equipment_3:0 "Agusta Bell AB-212"
 AUS_utility_helicopter_equipment_3_short:0 "AB-212"
 AUS_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."

 AUS_utility_helicopter_equipment_7:0 "Sikorsky S-70A-42 Faucon Noir"
 AUS_utility_helicopter_equipment_7_short:0 "S-70A Faucon Noir"
 AUS_utility_helicopter_equipment_7_desc:0 "Le S-70A-42 Black Hawk est une version d'exportation du S-70 Black Hawk destinée à l'armée de l'air autrichienne."

 AUS_cargo_helicopter_equipment_2:0 "Étalon de mer Sikorsky S-65Ö"
 AUS_cargo_helicopter_equipment_2_short:0 "Étalon de mer S-65Ö"

 AUS_scout_helicopter_equipment_2:0 "Bell OH-58B Kiowa"
 AUS_scout_helicopter_equipment_2_short:0 "OH-58B Kiowa"
 AUS_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."
