 AUS_recon_equipment_0_desc:0 "Le Cessna L-19/O-1 Bird Dog est un avion de liaison et d'observation. Il s'agissait du premier avion à voilure fixe entièrement métallique commandé pour et par l'armée américaine après la séparation de l'armée de l'air en 1947. Le Bird Dog a eu une longue carrière dans l'armée américaine, ainsi que dans d'autres pays. "

