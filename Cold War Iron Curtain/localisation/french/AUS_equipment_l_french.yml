#Austria

 AUS_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 AUS_infantry_equipment_0_short:0 "SMLE n°4"
 AUS_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 AUS_infantry_equipment_1:0 "Fabrique Nationale StG 58"
 AUS_infantry_equipment_1_short:0 "StG 58"
 AUS_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 AUS_infantry_equipment_2:0 "Steyr AOÛT StG 77"
 AUS_infantry_equipment_2_short:0 "Steyr StG77"
 AUS_infantry_equipment_2_desc:0 "Le Steyr AUG (allemand ; Armee-Universal-Gewehr, lit. « fusil militaire universel ») est un fusil d'assaut autrichien bullpup chambré pour la cartouche intermédiaire OTAN de 5,56 × 45 mm, conçu dans les années 1960 par Steyr-Daimler-Puch, et maintenant fabriqué par Steyr Mannlicher GmbH & Co KG."

 AUS_infantry_equipment_3:0 "Steyr AOÛT StG 77A1"
 AUS_infantry_equipment_3_short:0 "Steyr StG 77A1"
 AUS_infantry_equipment_3_desc:0 "Le Steyr AUG (allemand ; Armee-Universal-Gewehr, lit. « fusil militaire universel ») est un fusil d'assaut autrichien bullpup chambré pour la cartouche intermédiaire OTAN de 5,56 × 45 mm, conçu dans les années 1960 par Steyr-Daimler-Puch, et maintenant fabriqué par Steyr Mannlicher GmbH & Co KG. Ce fusil est la première mise à niveau majeure de la plate-forme existante, la désignant comme A1."
 
