 AUS_motorized_equipment_3_desc:0 "Le Steyr 680M était un camion de la marque Steyr. Il a été produit de 1960 à env. 1986 par l'ancienne Steyr Daimler Puch AG en Autriche et dans sa succursale en Grèce."
