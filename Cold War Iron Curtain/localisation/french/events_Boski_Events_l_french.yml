 Iranian_Revolution.1.d:0 "Le gouvernement iranien espérait que l'exil de l'ayatollah Khomeini d'Iran l'isolerait de ses partisans et briserait son influence dans le pays. Cependant, depuis son domicile en Irak, l'ayatollah continue de s'en prendre au Shah et à son alliance avec les États-Unis. L'espoir que ses années d'exil feraient flétrir son soutien s'est avéré être une erreur. Lorsque ses disciples visitent l'Irak, souvent en pèlerinage dans les villes saintes, ils rapportent des cassettes audio de l'ayatollah Khomeini et de ses sermons. Ces cassettes sont devenues incroyablement populaires sur le marché noir et il a non seulement augmenté son nombre d'adeptes, mais il est également une figure connue à l'échelle nationale. Même les opposants iraniens les plus laïques au Shah respectent la rhétorique enflammée de Khomeiny et sa conviction inébranlable que la monarchie doit disparaître."
 Iranian_Revolution.2.d:0 "Le jeune sociologue Ali Shariati est devenu un idéologue révolutionnaire pour les Iraniens de toutes orientations politiques. Dans ses enregistrements très populaires, il parvient à combiner des éléments du marxisme, de l'islam chiite et du nationalisme iranien. Il critique les autres grands mouvements révolutionnaires de l'après-Seconde Guerre mondiale pour leur laïcité. Au lieu de cela, il plaide en faveur de l'Iran, où la foi chiite doit être adoptée car il s'agit historiquement d'une foi activiste. Son argument permet aux Iraniens religieux de s'engager confortablement dans la politique révolutionnaire sans craindre de compromettre leurs croyances religieuses. Bien que le gouvernement iranien ait tenté de supprimer ces enregistrements de manière agressive, ils se sont largement répandus et sont populaires aussi bien dans les médersas que sur les campus universitaires."
 Iranian_Revolution.3.d:0 "Le Shah d'Iran a formellement approuvé la décision du Premier ministre (quel que soit le Premier ministre à l'époque) de fusionner les deux partis politiques légaux et de s'unir pour former le parti Rastakhiz (Résurgence). Le nouveau parti exige que tous les Iraniens participent en tant que membres et agira comme une force d'unité nationale et de développement. Il n'y aura plus de désunion politique au sein du Majlis et une nouvelle aile de jeunesse contribuera à diffuser le parti à travers l'Iran. Cette décision est considérée comme le fait que le Shah consolide son pouvoir absolu et a aliéné les communautés professionnelles et politiquement conscientes. L'exigence d'adhésion et les cotisations qu'elle implique ont aliéné la communauté Bazaari qui est réticente à payer le gouvernement ou à respecter ses réglementations. Pour le Shah, il a assuré un contrôle politique total et désormais le Majlis adoptera des lois et des réformes sans débats ni retards."
 Iranian_Revolution.4.d:0 "Dans la dernière tentative du Shah de s'imposer sur le clergé, il a annoncé que le calendrier persan remplacerait officiellement le calendrier islamique en Iran. Cette décision a suscité l'indignation non seulement du clergé mais aussi de tous les groupes sociaux iraniens qui considèrent l'islam comme une partie importante de leur identité. Pour le clergé, il s'agit du dernier effort du Shah, qui a également élargi les départements de théologie dans les universités laïques afin de diffuser sa version acceptée de l'Islam. Les agences de sécurité ont informé le Shah que de nombreux imams de rang inférieur condamnaient la décision dans leurs sermons du vendredi."
 Iranian_Revolution.5.d:0 "\nÀ Mashhad, le gouvernement a achevé un projet de réaménagement visant à embellir le sanctuaire de l'Imam Reza et la ville. Les bazars autour du site ont été démolis et de nouvelles routes ont été construites autour du site. Ces actions ont provoqué des violences et des protestations de colère, notamment le bombardement de plusieurs véhicules de construction. Les habitants de Bazaari étaient bouleversés par la destruction de leurs bâtiments et par la façon dont le projet les a séparés du clergé local. Le clergé local était également irrité par la façon dont le projet les a isolés des masses. Pour le gouvernement, ce résultat ne peut être considéré que comme un succès. La zone est désormais visuellement attrayante et plus organisée. Plus important encore, l'opération a rompu le lien physique entre les opérateurs du Bazaari et le clergé."
 Iranian_Revolution.6.d:0 "Le Front national mène une campagne visant à envoyer des lettres ouvertes de doléances au Shah et au gouvernement. Ils réclament plus de démocratie pour l'Iran et un rôle réduit pour le Shah. De nombreux hommes politiques et intellectuels libéraux iraniens y ont participé. Ces lettres sont largement ignorées par le gouvernement, mais la réputation internationale de l'Iran s'en trouve affectée négativement. De plus en plus de rapports font état du manque de libertés politiques en Iran, malgré sa vaste campagne de modernisation. Ces lettres poussent également les étudiants iraniens, en particulier ceux qui étudient à l'étranger, à mettre en avant les problèmes qu'ils constatent dans leur pays."
 Iranian_Revolution.7.d:0 "Les avocats iraniens ont organisé une série de manifestations à Téhéran. Les avocats protestent contre les récents changements apportés aux procédures judiciaires qui facilitent la détention des dissidents par le gouvernement. De tels changements ne profitent qu'aux agences d'État et mettent le système juridique au détriment des citoyens iraniens. En plus d'exiger que ces changements soient annulés, les avocats appellent également le gouvernement et le système judiciaire iraniens à adhérer davantage à l'État de droit tel qu'énoncé dans la constitution. Ils soutiennent que depuis des années, le gouvernement et les agences de sécurité ont fait étalage de procédures juridiques et de lois pour mener à bien leur programme. Le gouvernement a qualifié ces avocats d'agents étrangers et insiste sur le fait que l'Iran possède l'un des systèmes judiciaires les plus solides de la région."
 Iranian_Revolution.8.d:0 "Le sociologue et révolutionnaire iranien Ali Shariati est décédé d'une apparente crise cardiaque en Angleterre. Sa mort soudaine à un si jeune âge alimente le scepticisme dans tout l'Iran quant à son assassinat par la SAVAK, la police secrète du gouvernement. Shariati, formé à Paris, a été profondément influencé par les mouvements révolutionnaires postcoloniaux comme moyen de libérer l'Iran, mais s'est opposé à leur nature laïque. Au lieu de cela, il a souligné que l'islam chiite était une foi militante qui, combinée au marxisme et au patriotisme iranien, permettrait aux Iraniens de préserver leur identité et de se libérer de l'oppression. Son message principal consistant à permettre aux Iraniens de maintenir leur foi tout en menant des actions révolutionnaires a fait de lui une influence populaire à travers le pays. Ses sermons et ses cassettes connaissent un énorme succès auprès des étudiants universitaires et des militants religieux. Sa mort est un coup dur pour les révolutionnaires iraniens, mais ses enregistrements sont désormais plus populaires que jamais, inspirant de nombreux Iraniens à croire en la légitimité de l'action révolutionnaire."
 Iranian_Revolution.9.d:0 "Les lourdes dépenses publiques, notamment dans les produits de luxe et l'armée, ainsi que les programmes sociaux ambitieux ont mis l'économie à rude épreuve. L'inflation est endémique et le boom pétrolier n'a fait qu'alimenter ces dépenses extravagantes. Plus inquiétant encore, l'écart de richesse dans le pays s'est considérablement creusé à mesure que les élites ont réussi à amasser des fortunes au cours de cette période. Pour lutter contre les difficultés économiques auxquelles est confronté l'Iran, le gouvernement a annoncé de nouvelles mesures d'austérité destinées à maîtriser l'inflation. Cependant, ces nouvelles mesures affecteront probablement principalement les populations urbaines pauvres du pays. Les experts préviennent que l'impact de l'austérité sur les travailleurs industriels pourrait provoquer un large mécontentement à l'égard du gouvernement et des perturbations dans la production industrielle."
 Iranian_Revolution.10.d:0 "Amnesty International a publié un rapport accablant sur le Shah et son gouvernement. Ils accusent le gouvernement de se livrer à des violations flagrantes des droits humains, notamment en torturant des suspects et en procédant à des arrestations sans procédure régulière. C'est la première fois que l'organisation de défense des droits de l'homme publie un rapport sur l'Iran. Le gouvernement iranien nie les affirmations selon lesquelles les violations des droits humains relèvent de la politique de l'État et insiste sur le fait que toute violation constitue un incident isolé. Ils ajoutent que le rapport est biaisé parce qu'il s'appuie sur des individus antigouvernementaux. En Iran, le rapport a déclenché des rumeurs selon lesquelles les États-Unis auraient retiré leur soutien au Shah, beaucoup supposant qu'Amnesty est une branche du gouvernement américain."
 Iranian_Revolution.11.d:0 "Lorsque la nouvelle de la visite prévue du Shah et de son épouse à la Maison Blanche est arrivée, des milliers d'étudiants iraniens ont commencé à converger vers la capitale. Ils voulaient manifester contre le Shah et son gouvernement. Pour contrer ces manifestants, le gouvernement iranien a fait venir en bus des officiers et des cadets de l'armée ainsi que des partisans du gouvernement actuellement aux États-Unis pour contrer la manifestation. Lorsque le Shah atteint la Maison Blanche, il fait face à des milliers de manifestants. Les contre-manifestants ont alors commencé à attaquer, provoquant des affrontements. Alors que le président accueillait le Shah à l'extérieur, la police locale a largué des gaz lacrymogènes, qui ont fini par atteindre le Shah et le président, obligeant les deux hommes à se précipiter dans la Maison Blanche. En Iran, des informations faisant état de l'incident ont déclenché des rumeurs selon lesquelles la CIA aurait délibérément utilisé des gaz lacrymogènes contre le Shah, confirmant ainsi la conviction croissante dans le pays selon laquelle il avait perdu le soutien américain."
 Iranian_Revolution.12.d:0 "Un grand journal gouvernemental a publié un article bizarre concernant l'ayatollah Khomeini. L'article publiait des allégations exagérées concernant Khomeini concernant son orientation sexuelle, sa nationalité et sa dévotion religieuse. Il l'a également accusé d'être un agent britannique déterminé à vendre l'Iran aux impérialistes et aux communistes. L'article a été condamné dans tout le pays, car même les Iraniens les plus laïcs reconnaissent Khomeini comme un homme de foi et de principes. Parmi les partisans de Khomeini, la réaction a été la colère. Les étudiants religieux de la ville sainte de Qom, rejoints par des bazaris et d'autres partisans de Khomeiny, ont commencé à protester contre cet article. La police est intervenue, ce qui a provoqué de violents affrontements. Le gouvernement affirme que deux manifestants ont été tués, mais des rumeurs prétendent que la police aurait ouvert le feu et que le nombre de victimes s'élèverait à plus de cinquante. Conformément à la coutume chiite, les services commémoratifs pour les manifestants morts auront lieu quarante jours après leur mort."
 Iranian_Revolution.13.d:0 "Partout en Iran, des services commémoratifs (appelés chehelom) ont été organisés pour commémorer les personnes tuées par la police lors des manifestations de Qom. Les violentes manifestations ont commencé à la suite de la publication d'un article incendiaire dans le principal journal gouvernemental au sujet de l'ayatollah Khomeini. Dans les quarante jours qui ont suivi les manifestations, les partisans de Khomeiny et d'autres chefs religieux chiites ont pu organiser des mosquées à travers l'Iran pour organiser des services pour les morts. A la fin des offices, des dizaines de milliers de personnes sont descendues dans la rue pour condamner le gouvernement et le Shah. Les manifestations de Chehelom ont fait plusieurs morts supplémentaires, et il est déjà prévu d'organiser des manifestations similaires dans quarante jours. Le gouvernement doit décider s'il doit travailler avec un clergé modéré, proposer des concessions mineures et surmonter l'indignation du public. Ou si une réponse militaire plus forte est nécessaire pour mettre fin aux manifestations et restaurer la stabilité en Iran."
 Iranian_Revolution.14.d:0 "Le cycle des manifestations chehelom dure depuis des mois maintenant, nuisant à l'économie et à la stabilité de l'Iran. Cependant, les derniers cycles de manifestations ont vu une forte baisse du nombre de participants. Le gouvernement a affirmé que la dernière manifestation était suffisamment modeste pour que les forces de sécurité puissent facilement contrôler la situation. Le succès du gouvernement se reflète dans ses efforts auprès du clergé chiite modéré, dans la libéralisation progressive du droit de manifester et dans les négociations avec les manifestants. Il a promis des élections démocratiques l'année prochaine, apaisant les opposants laïcs, et a signé des ordonnances visant à réduire la corruption, notamment au sein de la famille royale. Même si les manifestants ont continué à faire des victimes chaque jour de protestation, les personnes arrêtées ont été jugées par des tribunaux civils. Des fonctionnaires prétendument corrompus ont également été limogés et le Shah a également remplacé le chef de la SAVAK par un général modéré. Le Shah semble avoir survécu à cette dernière période de troubles civils."
 Iranian_Revolution.15.d:0 "La nation iranienne est en deuil suite à une attaque choquante à Abadan. Un groupe d'hommes non identifiés a incendié le cinéma Cinema Rex après avoir barré les portes pour empêcher toute fuite des clients. L'incendie s'est propagé rapidement et finalement plus de quatre cents personnes sont mortes dans les flammes. Le gouvernement iranien accuse les marxistes islamiques d'être responsables de cette attaque. Cependant, les manifestants et les opposants du Shah accusent la SAVAK, la police secrète de l'État, d'avoir mené l'attaque pour creuser un fossé entre les manifestants laïcs et religieux. Les Iraniens qui hésitaient face à la récente intensification des manifestations croient généralement aux affirmations des manifestants, et le gouvernement iranien se prépare à une vague de nouvelles manifestations à travers le pays. Aujourd'hui, de nombreux Iraniens pensent que le Shah et son gouvernement font preuve de complaisance face à l'incendie criminel dévastateur du Cinema Rex."
 Iranian_Revolution.16.d:0 "Les manifestants anti-Pahlavi, dont le nombre a augmenté après que l'incendie criminel du Cinéma Rex a été imputé au gouvernement, ont reçu un nouvel élan au début du mois sacré du Ramadan. Le clergé antigouvernemental parvient à inciter de nombreux membres de ses congrégations à se joindre aux manifestations, ce qui constitue une obligation presque religieuse envers leur foi et leur nation. Les espoirs du gouvernement de stabiliser cette période de troubles semblent se désintégrer rapidement. Tout comme lors des manifestations précédentes, des soldats et des policiers inexpérimentés tirent sur la foule, malgré les ordres de ne pas recourir à la violence pour disperser les troubles. Plus troublante est la nouvelle selon laquelle le clergé modéré semble perdre le contrôle et l'influence sur le jeune clergé et la population."
 Iranian_Revolution.17.d:0 "L'Aïd al-Fitr, la célébration qui marque la fin du Ramadan, était censée être l'occasion pour le Shah d'apaiser les récents troubles. Le gouvernement iranien a accordé des autorisations pour les prières en plein air à Téhéran. Des foules de plus d'un demi-million de citoyens étaient présentes et après les prières, le clergé leur a ordonné de défiler dans le centre de Téhéran. La foule s'est transformée en une manifestation anti-Shah, avec des chants réclamant le retour de l'ayatollah Khomeini et des appels à une république islamique. Cela a marqué une radicalisation des protestations, car Khomeini est catégorique en faveur du retrait du Shah, et pas seulement en faveur de réformes politiques. Le Shah aurait observé les manifestations depuis son hélicoptère. Inquiet, il a réuni ses hauts responsables et doit décider de sa ligne d'action. Il peut déclarer la loi martiale et demander aux militaires de résoudre la situation. Son autre option est de convoquer l'opposition laïque, de négocier son abdication et d'accepter une nouvelle constitution qui restreint la monarchie."
 Iranian_Revolution.18.d:0 "Le Shah a annoncé la loi martiale dans douze villes d'Iran. Les manifestations seront interdites et le sévère général Gholam-Ali Oveissi supervisera l'administration de la loi martiale. Dans la continuité de la position hésitante du Shah, il a promis la poursuite de la libéralisation après la levée de la loi martiale. Plusieurs milliers de manifestants ont défié les ordres et se sont affrontés avec les soldats iraniens, qui ont tiré sur la foule. Des dizaines de personnes ont été tuées, malgré les affirmations du général Oveissi selon lesquelles ses troupes avaient été la cible de tirs. De nombreuses personnes dans le pays accusent l'armée de violences aveugles et appellent ces événements le Black Friday. Les nouvelles de la poursuite des violences et les photos de manifestants morts ont durci la population contre le Shah. Le Shah a critiqué l'armée et lui a ordonné de se retirer lors de futures manifestations, mais même les membres de l'opposition les plus modérés ne sont pas disposés à engager des négociations ouvertes avec le Shah."
 Iranian_Revolution.19.d:0 "Au lendemain du Black Friday, de nombreux Iraniens sont passés d'un désir de réduction de la monarchie à la fin de la dynastie Pahlavi. Cependant, aux difficultés du Shah s'ajoute l'annonce récente par les travailleurs iraniens d'une grève générale en solidarité avec les manifestants. L'industrie pétrolière iranienne, essentielle à son poids économique, est pratiquement fermée, comme la plupart des industries. Les travailleurs organisent des comités de grève nationaux pour garantir que l'impact économique des grèves soit ressenti par le gouvernement. Le Shah a refusé de déployer des troupes pour briser les grèves et a plutôt augmenté leurs salaires. Malgré ses actions, les travailleurs restent pour l'instant déterminés à se tenir aux côtés des manifestants."
 Iranian_Revolution.20.d:0 "Un Shah désespéré a demandé au gouvernement irakien de retirer l'ayatollah Khomeini de Najaf. Le gouvernement iranien estime que son renvoi l'empêchera de tenter d'entrer secrètement en Iran ou de diffuser ses messages dangereux à ses partisans en Iran. Le gouvernement irakien s'est conformé, craignant que Khomeini n'enflamme sa propre population, et l'ayatollah est parti pour la banlieue parisienne. Cependant, les espoirs que Khomeiny soit réduit au silence ou mis à l'écart ont été rapidement anéantis lorsque les dissidents iraniens et les exilés à l'étranger ont convergé pour rendre visite à l'ayatollah. En outre, Paris bénéficie d'une forte présence médiatique, ce qui a permis à Khomeiny de s'adresser plus facilement aux Iraniens qui protestaient contre le Shah. L'ayatollah Khomeini s'est également entretenu avec les principaux dirigeants laïcs de l'opposition qui ont accepté de soutenir son appel au renversement du Shah et à une présence islamique au sein du prochain gouvernement."
 Iranian_Revolution.21.d:0 "Alors que les manifestations antigouvernementales faisaient rage quotidiennement à travers l'Iran et que l'économie était pratiquement au point mort, plusieurs généraux de haut rang ont contacté le Shah. Ils ont exigé qu'il donne le pouvoir à un comité militaire d'assurer la sécurité et d'appliquer la loi martiale. Ils affirment que l'indécision du gouvernement n'a fait qu'alimenter les troubles et que la situation se détériorait rapidement. Le Shah a accepté mais doit décider quelle faction de l'armée il souhaite renforcer. Il peut choisir les modérés, qui tenteront probablement de maîtriser les affrontements et d'être plus conciliants, ou donner du pouvoir aux extrémistes qui estiment qu'une approche forte et ferme est nécessaire."
 Iranian_Revolution.22.d:0 "Le Shah d'Iran s'est récemment adressé à la nation. Il a reconnu les corruptions et les erreurs de son régime, s'engageant à les corriger. En outre, il a déclaré que le régime militaire actuel était temporaire et qu'il entamerait des négociations avec l'opposition sur la formation d'un gouvernement de coalition ainsi que des réformes démocratiques. Le discours visait à calmer les protestations et à mettre fin à la grève nationale qui paralysait l'économie, mais il semble avoir seulement fait croire aux manifestants que le régime allait bientôt s'effondrer. Le gouvernement militaire est très mécontent de cette annonce car elle mine sa position et ses actions potentielles. Compte tenu de ses appels à la retenue, de nombreux militaires pensent qu'ils ne peuvent plus mener à bien une répression complète, même s'ils le voulaient."
 Iranian_Revolution.23.d:0 "Le gouvernement militaire a récemment étendu la loi martiale au Khouzistan. Cette province vitale détient l'essentiel de la production pétrolière iranienne et ses travailleurs sont en grève depuis plus d'un mois. Les marches de protestation ont été considérablement réduites et la marine a envoyé du personnel pour briser la grève des travailleurs du pétrole. La production pétrolière est revenue à la période pré-révolutionnaire et apporte un certain soulagement à l'économie iranienne en difficulté. Par ailleurs, le chef de l'opposition Karim Sanjabi a été arrêté après son retour en Iran après avoir eu des entretiens avec l'ayatollah Khomeini à Paris. Certains considèrent le succès au Khouzistan comme le signe d'un retour du gouvernement, mais cela reste à voir."
 Iranian_Revolution.24.d:0 "L'armée iranienne est confrontée à des difficultés majeures dans ses efforts pour contrôler les manifestations de rue et assurer la sécurité. De nombreux soldats conscrits ne disposent pas d'une formation adéquate en matière de contrôle des foules, ce qui conduit à des incidents où les troupes tirent sur la foule. Dans d'autres cas, les conscrits sympathisent avec les manifestants et finissent par refuser de disperser les manifestations. Les agents sur le terrain sont de plus en plus frustrés par les ordres contradictoires qu'ils reçoivent de leurs supérieurs. Cependant, ces dernières semaines, ces tensions ont conduit à des incidents où des soldats ont tiré sur des officiers qui leur ordonnaient de tirer sur des manifestants. Dans certains cas, les soldats désertent publiquement et rejoignent les manifestants. Dans l'ensemble, l'armée a informé le Shah que près d'un millier de soldats iraniens désertent chaque jour leurs unités. De nombreux généraux ne savent pas s'ils disposent de suffisamment d'hommes pour exécuter les ordres ou même s'ils peuvent compter sur eux alors que les troubles se poursuivent."
 Iranian_Revolution.25.d:0 "Le mois sacré de Muharram commence aujourd'hui. Ce mois-ci est particulièrement les dix premiers jours importants pour les chiites car ils pleurent le martyre d'Ali, le petit-fils du prophète Mahomet. Le dixième jour, appelé Achoura, commémore l'événement lui-même et constitue une période de deuil public massif. Les révolutionnaires et les manifestants du Shah ont déjà prévu une série d'escalades de protestations qui culmineront avec une marche nationale de l'Achoura à travers l'Iran. L'opposition laïque et religieuse travaille en étroite collaboration sur ces manifestations. Le gouvernement iranien ne peut pas risquer des affrontements massifs en cette période aussi propice, car de tels mouvements pourraient provoquer un soulèvement au sein des rangs militaires."
 Iranian_Revolution.26.d:0 "Avant la marche de l'Achoura, le Shah et les manifestants ont négocié pour empêcher de violents affrontements. Le Shah, désespéré d'éviter les violences pendant l'Achoura, a libéré des prisonniers politiques, dont Karim Sanjabi. En outre, l'interdiction de manifester a été levée pour l'Achoura et les autorisations ont été accordées aux organisateurs. Les manifestants se sont en retour engagés à éviter la violence. La marche d'Achoura est devenue une démonstration de force massive, avec certaines estimations suggérant au moins dix millions de manifestations, soit plus de dix pour cent de tous les Iraniens participants. Il s'agit de la plus grande marche de l'histoire du monde. Karim Sanjabi et l'ayatollah Taleghani ont mené les manifestations pour symboliser l'unité révolutionnaire de l'opposition laïque et religieuse au Shah. Le Shah aurait été découragé par ces informations."
 Iranian_Revolution.27.d:0 "La situation en Iran a atteint un point critique. Le Shah a informé l'ambassadeur qu'il ne savait pas ce qui pouvait être fait et que sa position semblait intenable. Ce manque de détermination est clairement une cause majeure de la crise et exacerbe les sentiments anti-américains parmi les Iraniens. Certains hauts responsables soutiennent que si le Shah ne peut pas survivre, nous devons essayer de faire bonne impression sur le prochain régime. Ces responsables proposent que nous élaborions un plan qui verrait le Shah abdiquer et remettre le pouvoir à un gouvernement républicain dirigé par des responsables et des officiers militaires pro-occidentaux. D'autres au sein de l'administration affirment que les révolutionnaires iraniens sont déjà farouchement anti-américains et que toute implication supplémentaire ne fera que servir de munitions à nos ennemis dans la région. Le Shah acceptera probablement ce que nous avons proposé, mais le président doit décider s'il doit proposer le plan à l'opposition ou attendre."
 Iranian_Revolution.28.d:0 "L'opposition iranienne a tenu des réunions avec des responsables américains pour discuter d'une solution politique à la crise. Les Américains suggèrent qu'un système démocratique pourrait être établi avec l'ayatollah Khomeini agissant comme guide spirituel de l'État iranien. Khomeiny et les Américains ont tous deux estimé que les négociations étaient positives, mais un accord final reste pour le moment incertain. L'opposition iranienne doit décider si elle peut obtenir la destitution du Shah avec la médiation des Américains ou si elle peut y parvenir seule. Le recours aux Américains aboutira probablement à un gouvernement avec une forte présence de responsables pro-américains et un rôle réduit du clergé chiite. Cependant, si l'opposition parvient à renverser le Shah elle-même, elle aura alors un contrôle total sur son destin."
 Iranian_Revolution.29.d:0 "La marche d'Achoura, les désertions de l'armée et l'effondrement économique ont rendu la situation intenable pour le Shah. Les observateurs notent que la marche d'Achoura a vu au moins dix pour cent de tous les Iraniens participer, ce qui est bien plus que les trois ou quatre pour cent de citoyens français qui ont participé à la Révolution française. Ayant besoin d'une stratégie de sortie, le Shah a conclu un accord avec le leader du Front national Shapour Bakhtiar pour devenir Premier ministre. Il a également annoncé son intention de prendre des vacances avec sa famille et de laisser le pays entre les mains d'un conseil de régence dirigé par le Premier ministre. Bakhtiar a rejoint le gouvernement par crainte que Khomeini n'accepte pas la démocratie pour le pays. Cependant, sa décision suscite le mépris universel de la part de l'opposition laïque et religieuse. Le Front National l'a expulsé et Khomeiny l'a accusé d'obéir à de faux dieux."
 Iranian_Revolution.30.d:0 "Shah Mohammad Reza Pahlavi et sa famille ont quitté Téhéran, marquant la fin de la dynastie Pahlavi en Iran. La Garde impériale a pleuré lorsque la famille royale est montée à bord de son avion tandis que son Premier ministre Shapour Bakhtiar, opposant de toujours au Shah, ne pouvait cacher son mépris pour le monarque. Il pensait que le Shah devait rester pour faire face à la justice du peuple. La nouvelle s'est rapidement répandue selon laquelle le Shah était parti. Les Iraniens sont descendus dans la rue avec joie et ont détruit tous les symboles de la monarchie, des statues aux portraits de la famille royale. Le Premier ministre a ordonné aux militaires de se retirer et de permettre au peuple de s'exprimer alors qu'il cherchait à s'imposer comme nouveau leader."
 Iranian_Revolution.31.d:0 "Le Premier ministre Bakhtiar a formellement invité l'ayatollah Khomeini à revenir après ses années d'exil. L'ayatollah est arrivé peu après à bord d'un vol affrété à destination de Téhéran. Des millions d'Iraniens sont descendus dans la rue pour accueillir le leader révolutionnaire emblématique. Sa voiture a été tellement envahie que Khomeini a finalement été emmené hors de l'aéroport par hélicoptère. Alors que les foules scandaient son nom et lui demandaient de diriger le pays, Khomeini est resté stoïque et ferme. Malgré l'ouverture du Premier ministre en l'invitant, Khomeini a critiqué son gouvernement comme étant le produit du Shah corrompu. Il a également semblé critiquer la notion d'une démocratie sans le leadership des religieux, la qualifiant de scénario inacceptable. Il devrait adopter une position plus définitive dans les prochains jours."
 Iranian_Revolution.32.d:0 "Le Premier ministre Shapour Bakhtiar, opposant de longue date au Shah, a pris le poste de Premier ministre à la condition que le Shah quitte le pays. Cependant, sa décision a été condamnée par ses anciens alliés du Front national et l'ayatollah Khomeini. Tous deux l'accusèrent de soutenir et de légitimer le Shah. Depuis que le Shah a quitté le pays, le Premier ministre a affirmé qu'il s'agissait d'un gouvernement intérimaire et a promis de nouvelles élections dans le cadre d'une constitution démocratique. En outre, il a dissous la police secrète SAVAK et libéré tous les prisonniers politiques. Il a également ordonné aux militaires de ne plus s'immiscer dans les manifestations. Ces décisions et ces démarches ont ouvert des négociations avec le Front national, mais l'ayatollah Khomeini continue de critiquer Bakhtiar. Khomeiny a une décision à prendre : soit il travaille avec Bakhtiar et accepte un rôle limité pour le clergé dans la nouvelle constitution, soit il peut ordonner à ses partisans d'établir un gouvernement intérimaire parallèle."
 Iranian_Revolution.33.d:0 "Ces derniers jours, l'ayatollah Khomeini a ordonné à ses partisans de créer des conseils de gouvernement local et de mettre en place un gouvernement parallèle à celui du Premier ministre Shapour Bakhtiar. Des dizaines de milliers de jeunes révolutionnaires considèrent Khomeini comme leur leader et exécutent les ordres avec empressement. En quelques jours, le gouvernement parallèle a non seulement commencé à administrer, mais a également chassé les loyalistes du régime de Bakhtiar. Pour de nombreux Iraniens, le seul gouvernement qui fonctionne est celui dirigé par Khomeini. Les jeunes révolutionnaires ont également attaqué des dépôts d'armes et capturé des armes lourdes. Les forces militaires locales ont refusé d'intervenir, craignant des pertes civiles. Malgré ses efforts, Bakhtiar semble incapable de combler le fossé entre sa base et la jeunesse révolutionnaire qui mène la révolution. Sa situation se détériorant, le Conseil militaire suprême réfléchit à la possibilité de continuer à soutenir le Premier ministre."
 Iranian_Revolution.34.d:0 "Le Conseil militaire suprême a annoncé qu'il resterait neutre dans la lutte en cours entre le gouvernement du Premier ministre Bakhtiar et l'ayatollah Khomeini. Sans le soutien de l'armée, Bakhtiar a vu son dernier groupe de partisans fuir tandis que des jeunes révolutionnaires s'emparaient des bâtiments gouvernementaux, des palais, des stations de radio et de télévision. Bakhtiar lui-même aurait fui le pays pour échapper aux révolutionnaires armés. Cette défaite marque l'effondrement définitif des derniers vestiges de l'ancien régime. Alors que Khomeini et ses partisans gagnent rapidement le pouvoir, l'opposition laïque, dirigée par le Front national, est en train de finaliser une nouvelle constitution pour le pays, qui, selon eux, accorde un rôle au clergé. Il reste à voir si Khomeiny et ses partisans autoriseront une nouvelle constitution qui n'offrira pas une République islamique complète."
 Iranian_Revolution.35.d:0 "Depuis l'effondrement définitif de l'ancien régime, l'ayatollah Khomeini gouverne par l'intermédiaire de son Conseil révolutionnaire et de ses organisations subsidiaires. L'opposition laïque dirigée par le Front national et apparemment alliée à Khomeini est organisée sous le nom de Front national démocratique. Le Parti républicain des peuples musulmans est composé d'un clergé modéré dirigé par le grand ayatollah Mohammad Kazem Shariatmadari. Ils plaident pour une République islamique plus modérée que celle proposée par Khomeini. Toutes ces forces politiques étaient autrefois unies contre le Shah, mais elles sont désormais toutes engagées dans une compétition les unes avec les autres pour l'avenir de l'Iran."
 Iranian_Revolution.36.d:0 "Le Conseil révolutionnaire a organisé un référendum national au cours duquel le peuple iranien a été invité à approuver ou non une République islamique. Les critiques, comme le Front national démocratique, trouvent le référendum trop vague car il n'y a aucune indication claire de ce qu'est réellement une République islamique. Le référendum a également été boycotté par la population kurde qui reste farouchement opposée à l'installation d'une théocratie chiite sur sa population majoritairement sunnite. Au final, quatre-vingt-dix-huit pour cent ont voté en faveur d'une révolution islamique. L'Ayatollah Khomeini a salué le résultat, affirmant qu'il représentait une confirmation écrasante de ses efforts pour établir une véritable République islamique."
 Iranian_Revolution.37.d:0 "La révolution iranienne a provoqué une réaction violente avec des organisations royalistes, marxistes et ethniques se révoltant contre les forces révolutionnaires. Le Khouzistan et le Kurdistan iranien sont des foyers majeurs de cette violence. Au Khouzistan, certains habitants arabes réclament une plus grande autonomie, ce qui conduit à des affrontements armés avec les forces de sécurité. Pour les Kurdes, la révolution et l'accent mis sur une République islamique dirigée par les chiites se heurtent à l'opposition de ce groupe ethnique majoritairement sunnite. Le soulèvement kurde est dirigé par des combattants de gauche déterminés à obtenir soit l'autonomie, soit l'indépendance. Dans d'autres régions, de petits groupes de marxistes s'en prennent aux dirigeants révolutionnaires, provoquant encore davantage d'affrontements. Cependant, les forces révolutionnaires, appuyées par les immenses ressources de l'ancienne armée du Shah, semblent plus que capables de faire face à ces menaces."
 Iranian_Revolution.38.d:0 "Le Conseil révolutionnaire reconnaît la montée de différents groupes d'opposants à travers le pays et s'inquiète particulièrement des restes de l'ancienne armée du Shah. Ces soldats restent dans leur caserne et leurs officiers peuvent les activer quand ils le souhaitent. Pour contrer cette influence, ils ont convenu de créer une Garde révolutionnaire, composée de militants armés et organisés qui protégeront la révolution des usurpateurs ou des ennemis. La nouvelle force lance déjà des opérations visant à perturber les rassemblements politiques et l'organisation des partis politiques rivaux. Dans les semaines à venir, les Gardiens de la révolution devraient constituer un moyen viable de contrer la menace toujours posée par l'ancienne armée."
 Iranian_Revolution.39.d:0 "Avec la destitution réussie du Shah, nombreux sont ceux qui ont demandé à l'ayatollah Khomeini son opinion sur la révolution islamique dans le monde islamique au sens large. Avant son retour, Khomeiny avait laissé entendre que tous les États musulmans avaient besoin d'une telle transformation, mais maintenant qu'il occupe un poste élevé et qu'il commande, il doit décider s'il doit ou non approuver l'exportation de la Révolution. Exporter la révolution correspond généralement à l'idéologie défendue par Khomeiny et s'exprimer publiquement sur ce point renforcera sa base de soutien, en particulier dans l'Irak voisin. Cependant, s'il choisit de prétendre que la révolution doit se concentrer sur l'intérieur, il risque de s'aliéner ses partisans les plus dévoués, mais une telle déclaration calmerait ses voisins."
 Iranian_Revolution.40.d:0 "Avant l'effondrement définitif de la monarchie, Hassan Habibi avait proposé une constitution pour l'Iran. Selon sa version, l'Iran aura un président et un corps législatif forts. Un conseil des clercs donnera son avis sur les lois mais ne pourra pas rédiger ou rejeter une législation. Les gauchistes l'ont accusé de ressembler trop à l'ancienne constitution avec un président au lieu d'un Shah. En conséquence, une assemblée d'experts, composée principalement de religieux, examine le document pour finaliser son approbation. Deux factions, dont l'une soutenue par Khomeini, proposent des changements radicaux au document afin d'établir une véritable République islamique. Le clergé modéré veut conserver le document tel quel mais donner au conseil des religieux plus de pouvoir pour abroger les législatures jugées offensantes pour l'Islam. Le pays attend de voir quelle constitution émergera."
 Iranian_Revolution.41.d:0 "Avec son pouvoir protégé par les Gardiens de la révolution et sa République islamique inscrite dans la constitution, l'ayatollah Khomeini triomphe des autres groupes révolutionnaires. Pour assurer un transfert de pouvoir sans heurts, il a ordonné aux Gardiens de la révolution et à d'autres réseaux de supprimer par la force les partis laïcs et religieux modérés. Khomeini estime que le peuple iranien a besoin d'une direction claire et d'une seule voix pour le guider dans cette nouvelle ère pour le pays. Khomeini a également nommé les religieux qui serviront de dirigeants exécutifs clés et de conseillers du nouveau régime. Quelques jours après sa directive, la plupart des opposants organisés à Khomeiny se sont effondrés, ont fui en exil ou se sont cachés."
 Iranian_Revolution.42.d:0 "Avec l'établissement de la République islamique et l'annonce du traitement médical du Shah aux États-Unis, des foules d'étudiants en colère ont déclenché une série de violentes manifestations devant l'ambassade américaine. Ils exigent le retour du Shah et accusent le gouvernement américain de tenter secrètement de renverser la nouvelle République islamique. Le Premier ministre a réussi à empêcher que la situation ne devienne incontrôlable, mais le personnel de sécurité l'informe que la situation dégénère rapidement. Le Premier ministre a décidé de demander à l'ayatollah Khomeini de calmer les étudiants avant que leurs protestations ne conduisent au désastre. L'ayatollah Khomeini peut soit tolérer les étudiants et maintenir son influence sur la jeunesse révolutionnaire, soit les maîtriser et risquer de perdre ce soutien vital alors qu'il construit un nouvel Iran."
 Iranian_Revolution.43.d:0 "Après une intense médiation des diplomates américains, le Shah d'Iran a accepté d'abdiquer son trône. Après une cérémonie émouvante au cours de laquelle lui et sa famille ont fait leurs adieux à leur personnel du palais, le Shah a été emmené à l'aéroport où il a signé les papiers d'abdication, marquant la fin de la dynastie Pahlavi. Un avion du gouvernement américain affrété l'a ensuite emmené, lui et sa famille, aux États-Unis. Quelques heures après le départ du Shah d'Iran, l'ayatollah Khomeini est arrivé de Paris. Les rues de Téhéran et d'autres grandes villes étaient remplies de foules en liesse célébrant la destitution du Shah et le retour de Khomeini. Ce n'est que grâce à des négociations américaines que le Shah a pu quitter le pays de la manière la plus digne possible. Dès son arrivée, Khomeini a déclaré son soutien au processus constitutionnel."
 Iranian_Revolution.44.d:0 "Une constitution a été rédigée par des politiciens laïcs et des dirigeants démocrates. Le document appelle à une république avec un comité de religieux pour conseiller sur la législation. Le clergé n'aura pas le pouvoir de veto ou de proposer des lois. Avant qu'elle puisse finalement être approuvée, une assemblée d'experts, composée principalement de membres du clergé, doit se réunir pour décider si la constitution est conforme à la loi islamique. Au sein du clergé, il existe une division : les modérés estiment que le clergé devrait minimiser les interactions avec l'État, tandis que les plus politiques, inspirés par Khomeini et la chariati, croient en un gouvernement islamique. Les États-Unis, grâce à leur rôle de médiateur, ont pu user de leur influence pour garantir que les modérés dominent l'Assemblée des experts."
 Iranian_Revolution.45.d:0 "La décision de recourir à la médiation pendant la crise est intervenue à un moment critique. Même si nous avons perdu notre allié de longue date, le Shah, nous avons réussi à organiser son départ sain et sauf et à établir des liens avec le nouveau régime. Le Shah et sa famille vivront confortablement et sous notre protection. Plus important encore, notre rôle en aidant le peuple iranien à réaliser une république et une constitution a restauré notre prestige dans le pays. Même si de nombreux Iraniens nous tiennent toujours pour responsables des injustices passées, nos actions ont permis de garantir que le nouveau gouvernement sera pour le moins cordial. Avec le temps, nous espérons rétablir nos relations intimes avec le gouvernement iranien."
 Iranian_Revolution.46.d:0 "Le cycle des manifestations chehelom dure depuis des mois maintenant, nuisant à l'économie et à la stabilité de l'Iran. Cependant, les deux derniers cycles de protestations ont vu une forte augmentation des protestations après une baisse initiale. La décision du Shah de recourir à la force militaire et de réprimer impitoyablement les manifestations a semblé au début réprimer les troubles. Cependant, le nombre de décès, notamment lors des funérailles, finit par exaspérer les religieux et le clergé. Même les religieux modérés, traditionnellement fidèles au Shah, travaillent en étroite collaboration avec les religieux révolutionnaires pour amener les fidèles à protester. Lors des dernières manifestations de Chehelom, les plus grandes foules ont émergé partout en Iran. Bien que l'armée ait ordonné le tir en dernier recours, les soldats inexpérimentés ont souvent paniqué, ce qui a entraîné de nombreuses morts à travers le pays. Aujourd'hui, même les groupes d'opposition laïcs ont promis de participer en plus grand nombre à la prochaine manifestation de Chehelom, dans quarante jours."
 Iranian_Revolution.47.d:0 "À l'approche du prochain cycle de manifestations contre les Chehelom, la situation au sein de l'armée iranienne semble désastreuse. De nombreux soldats sont des conscrits et les ordres chehelom de disperser les manifestants et les incidents de fusillades ont des conséquences néfastes. Les désertions se multiplient et les officiers supérieurs perdent le contrôle sur leurs subordonnés. Certains officiers rapportent que leurs soldats ont promis que s'ils recevaient l'ordre de tirer sur les manifestants, ils tireraient sur les officiers. Le haut commandement militaire a largement rejeté ces informations, les qualifiant d'exagérées, et demande au Shah de rester ferme, car il estime que les protestations vont bientôt s'essouffler."
 Iranian_Revolution.48.d:0 "Les prochaines manifestations de Chehelom n'auront pas lieu avant plusieurs jours mais Téhéran regorge d'activités militaires. Les agents bouclent les quartiers clés de la ville. Le ministère de la Défense, en particulier, est complètement encerclé. Les officiers supérieurs s'y réunissaient avec le Shah et son cabinet pour discuter des dispositions en matière de sécurité pour la prochaine manifestation. Lorsque la nouvelle parvint à l'assemblée que le bâtiment était encerclé, deux des officiers supérieurs, connus pour être modérés, annoncèrent que la situation était devenue intolérable et plusieurs soldats armés entrèrent dans la salle. Le Shah a ensuite été informé que les officiers et les soldats de l'armée étaient en grande partie peu disposés à poursuivre le massacre de citoyens et lui a demandé de destituer tous les généraux et conseillers qui préconisaient la répression sous peine de risquer la désintégration de l'Iran. Le Shah est conscient que ses propres gardes impériales rétabliront probablement l'ordre bientôt afin qu'il puisse attendre que les modérés partent, ou qu'il puisse se joindre à leur action et ordonner la capture des hauts fonctionnaires et des officiers."
 Iranian_Revolution.49.d:0 "Le Shah a toléré les actions des officiers modérés et a ordonné à sa garde impériale d'aider les soldats à rassembler les officiers et fonctionnaires extrémistes. Le Shah s'est ensuite adressé à la nation, déclarant qu'il avait été grossièrement induit en erreur et que des membres patriotes de l'armée étaient capables de le guider sur la bonne voie. Il a annoncé que la prochaine manifestation de Chehelom se poursuivrait sans interférence de l'armée. Durant les manifestations, la foule a loué l'armée et a continué à condamner le Shah. Les officiers modérés informèrent alors en privé le Shah que sa situation n'était plus tenable. Quelques jours plus tard, le Shah, tout comme son père, annonça son abdication au trône pour son fils. Un conseil de régence dirigé par son épouse et composé d'officiers supérieurs de l'armée se rapprochera de l'opposition et discutera des projets d'une nouvelle constitution. Le Shah lui-même envisage de quitter immédiatement le pays pour une période prolongée."
 Iranian_Revolution.50.d:0 "Le Shah a bluffé les officiers modérés et, en une heure, sa garde impériale avait rétabli le contrôle de Téhéran. Il n'y a pas eu d'incidents de violence majeurs, car les putschistes savaient que sans le Shah, le plan s'effondrerait. Les généraux modérés et leurs subordonnés ont été arrêtés et seront probablement traduits en cour martiale. Le Shah et ses hauts responsables considèrent ce coup d'État comme une conspiration des manifestants et envisagent de redoubler d'efforts. Le Shah a déjà approuvé des plans visant à appliquer la loi martiale dans plusieurs zones stratégiques où la loyauté des officiers n'est pas assurée. Un Shah enhardi a également approuvé davantage de mesures pour punir les manifestants et arrêter les dirigeants présumés de l'opposition."
 Iranian_Revolution.51.d:0 "\nAlors que l'Assemblée des experts approuve largement la constitution qui lui est présentée, tous les regards sont tournés vers l'ayatollah Khomeini. Dès les premiers jours de la révolution, Khomeini avait préconisé non seulement la destitution du Shah mais aussi une véritable République islamique. Beaucoup de ses partisans considèrent que la nouvelle constitution ne donne pas suffisamment de pouvoir ou d'influence au clergé. Face à ces partisans de plus en plus bruyants et parfois hostiles, le haut clergé iranien a exigé que Khomeiny approuve publiquement la nouvelle constitution et soit le président du conseil du clergé chargé de conseiller le Majles. Si Khomeini accepte, sa base perdra de son élan mais il obtiendra un poste important dans le nouveau gouvernement. Toutefois, s'il refuse, il pourra galvaniser ses partisans autour de sa position."
 Iranian_Revolution.52.d:0 "Après avoir défié les hauts clergés et le nouveau gouvernement, l'ayatollah Khomeini a ordonné à ses partisans et aux Gardiens de la révolution d'établir des gouvernements parallèles dans les provinces et les villes. Ils assureront la direction et l'administration tandis que Khomeini et son Conseil révolutionnaire dirigeront depuis Téhéran. L'ordre est exécuté avec enthousiasme, notamment parmi les jeunes, et le nouveau gouvernement se retrouve poussé par la force à travers le pays. Les restes de l'armée royale ont contacté le gouvernement et ont annoncé leur volonté de l'aider à rétablir l'ordre et à mettre en oeuvre la nouvelle constitution."
 Iranian_Revolution.53.d:0 "Le gouvernement iranien, enhardi par la confirmation que les anciennes forces militaires l'aideront dans sa lutte pour le pouvoir contre l'ayatollah Khomeini, a lancé un ultimatum. Ils ont reconfirmé leur offre de confier à Khomeiny la présidence du conseil des religieux s'il acceptait de se retirer en dissolvant son gouvernement parallèle. En outre, il doit ordonner aux Gardiens de la révolution de désarmer. L'ultimatum est appuyé par la signature de plusieurs généraux de haut rang qui promettent d'assurer la suprématie de la constitution. Des unités militaires se mobiliseraient déjà dans des casernes à travers le pays. Khomeini peut accepter les conditions ou défier l'ultimatum. Nombreux sont ceux dans son camp qui affirment que l'armée sera incapable d'agir contre lui."
 Iranian_Revolution.54.d:0 "L'ultimatum étant ignoré par Khomeini, l'armée iranienne est intervenue pour désarmer et mettre fin à son gouvernement parallèle. Des combats intenses ont rapidement éclaté entre les Gardiens de la révolution et les militaires. Plus inquiétante pour le gouvernement a été la défection de plusieurs unités, dont du matériel lourd, vers Khomeini. L'armée semble avoir surestimé ses propres capacités et il est clair que l'Iran est confronté à une véritable guerre civile. Le vainqueur de ce conflit déterminera l'avenir du pays, soit en tant que République, soit en République islamique."
 Iranian_Revolution.55.d:0 "Le Conseil militaire suprême et le Shah reconnaissent tous deux que la période de troubles a récemment été maîtrisée grâce à des pourparlers et des concessions avec l'opposition, en particulier avec le clergé modéré. Suite à la récente flambée de troubles, il a été décidé d'essayer d'utiliser ces connexions pour rétablir l'ordre. En outre, l'armée a reçu pour instruction d'éviter les affrontements avec les manifestants et les autorités locales ont été encouragées à donner également des permis aux manifestants, tout cela afin d'éviter une effusion de sang. Après plusieurs semaines d'intenses discussions, le Shah a accepté de nommer plusieurs membres du clergé comme hauts conseillers du gouvernement et de signer un accord garantissant les droits des citoyens iraniens tels qu'ils sont inscrits dans la constitution. Ces deux réformes donnent à l'opposition religieuse un siège à la table des négociations et garantissent à l'opposition laïque une protection contre les détentions illégales ou la répression. Il y a encore des protestations, mais leur nombre commence à baisser."
 Iranian_Revolution.56.d:0 "\nLors d'un événement très médiatisé, les hauts dirigeants du cabinet et les dirigeants du Conseil militaire suprême ont promis une loyauté éternelle à l'héritier du trône et à sa mère, que le Shah a désignée comme régente. Le Shah a déclaré que l'événement visait à assurer au pays la continuation de la dynastie Pahlavi et la stabilité du gouvernement. Pour les observateurs, l'événement est considéré comme une confirmation que le Shah pourrait souffrir de problèmes de santé, ses apparitions publiques ayant sensiblement diminué récemment. Même pendant l'événement, bien qu'il portait son plus bel uniforme, le Shah semblait maladif aux yeux des participants."
 Iranian_Revolution.57.d:0 "\nLe Shah d'Iran est parti aux États-Unis pour ce qu'il appelle des procédures médicales de routine. Le Shah a annoncé qu'il ne quitterait pas le pays sans un leadership ferme et a nommé un Conseil de régence pour gouverner en son absence. Le Conseil de Régence sera sous le contrôle de son épouse, la Reine. Des membres du Conseil militaire suprême ont également été nommés. Sa famille étant restée sur place, nombreux sont ceux qui s'attendent à ce que le Shah revienne bientôt, mais sa décision de partir continue d'alimenter les spéculations sur son état de santé."
 Iranian_Revolution.58.d:0 "Les concessions proposées par le gouvernement et la nomination de hauts responsables du clergé à des postes consultatifs de haut niveau ont largement mis fin aux protestations contre le gouvernement. Ceux qui y participent encore sont en grande partie les antimonarchistes les plus radicaux et les fervents partisans de l'ayatollah Khomeini. L'armée a récemment informé le Conseil de régence qu'elle ne pensait plus que les manifestations constituaient une menace pour le gouvernement ou même pour l'ordre public. Il s'agit d'une victoire majeure pour le gouvernement et de bon augure pour le Conseil de régence qui attend le retour du Shah après ses traitements médicaux aux États-Unis."
 Iranian_Revolution.59.d:0 "Shah Mohammad Reza Pahlavi est décédé hier aux États-Unis. Il avait suivi un traitement médical, désormais considéré comme un traitement contre le cancer. Son corps a été rapidement rapatrié par avion à Téhéran où sa famille, dont son jeune fils, l'a reçu à l'aéroport. La Garde Impériale a fermé la plupart des routes principales alors que le corps a été transporté au palais alors que les préparatifs des funérailles sont en cours. De nombreux dignitaires étrangers arrivent déjà dans le pays pour assister à ses funérailles. La réaction du public est largement sourde, le Shah a eu une histoire compliquée avec son peuple. Il a supervisé des efforts massifs de réforme et de modernisation, mais a également maintenu son pouvoir en accusant son gouvernement d'avoir commis des violations des droits de l'homme pour se maintenir au pouvoir. Le nouveau Shah, Reza Pahlavi, devrait éventuellement être intronisé par sa mère et le Conseil de régence."
 Iranian_Revolution.60.d:0 "\nAprès le décès du Shah Mohammad Reza Pahlavi, le Conseil militaire suprême a annoncé publiquement qu'il continuait à soutenir le Conseil de régence de la reine Farah. Il a ajouté que les pouvoirs du Shah seront également préservés par le biais du conseil et que lorsque son fils sera prêt, Shah Reza Pahlavi montera sur le trône avec les pleins pouvoirs de son père. Cette annonce est considérée comme une menace évidente pour quiconque, dans le pays, aurait comploté pour saper ou défier la monarchie pendant cette période de transition. Dans l'ensemble, il semble que la population iranienne soit disposée à découvrir quel type de dirigeant est Shah Reza et cette annonce était principalement destinée aux responsables gouvernementaux ou aux chefs militaires ambitieux."
 Iranian_Revolution.61.d:0 "\nAprès des débats et des discussions animés, l'Assemblée des experts a approuvé la constitution avec seulement de légères modifications. Le conseil du clergé aura davantage son mot à dire dans la législation relative aux questions sociales, mais la structure globale d'un pouvoir législatif et d'un pouvoir exécutif fort a été approuvée. Les gauchistes sont déçus car ils craignent que le président ne devienne simplement un nouveau Shah dans le cadre du nouveau système, mais nombreux sont ceux à travers le pays qui saluent la transformation de l'Iran en république. Même si les religieux sont largement satisfaits, il reste à voir ce que l'ayatollah Khomeini et ses partisans penseront d'une république dans laquelle les religieux ne gouvernent pas."
 Iranian_Revolution.62.d:0 "Après des discussions entre le Conseil de régence et l'opposition, notamment le Front national et le clergé antigouvernemental, une nouvelle constitution a été approuvée. La nouvelle constitution habilite le Premier ministre à gouverner par l'intermédiaire du Majles. Le Shah se retrouvera avec des fonctions essentiellement cérémonielles et un rôle au sein de l'armée. Le Conseil de régence a accepté ces conditions car le Shah est actuellement trop jeune et l'ambiance publique est assez opposée à la monarchie. Bien que l'opinion publique iranienne approuve largement le document et attend avec impatience de nouvelles élections, certains observateurs craignent que la clause donnant au Shah un rôle non spécifié dans l'armée ne s'avère être un moyen pour un jour le retour de la monarchie."

 Iranian_Iraq_War.1.d:0 "Plusieurs bâtiments gouvernementaux situés dans des quartiers à majorité chiite ont récemment été bombardés. L'identité des auteurs de l'attentat est inconnue, mais les rapports indiquent qu'il s'agissait probablement de radicaux chiites inspirés par la révolution iranienne. L'ayatollah Khomeini n'a cessé d'appeler les chiites irakiens à rejoindre la révolution et à renverser notre gouvernement. Il continue de faire ces déclarations malgré les efforts de nos diplomates qui le supplient d'arrêter. De telles actions donnent à notre gouvernement un air de semaine et enhardissent les radicaux. Une enquête est immédiatement ouverte."
 Iranian_Iraq_War.2.d:0 "Malgré nos appels constants à l'ayatollah Khomeini pour qu'il cesse d'appeler les chiites irakiens à se soulever contre le gouvernement, il continue de le faire. Cette rhétorique dangereuse continue de poser problème puisque plusieurs responsables gouvernementaux ont récemment été assassinés. Une fois de plus, il est clair que les auteurs de ces actes sont des radicaux inspirés par Khomeini. Ces attaques, ainsi que les attentats à la bombe, constituent des provocations manifestes. Une réunion de hauts responsables du gouvernement est convoquée pour examiner nos options face à la menace iranienne."
 Iranian_Iraq_War.3.d:0 "Lors d'une réunion de hauts responsables gouvernementaux et militaires, des discussions ont eu lieu sur la manière de faire face à la radicalisation continue de notre jeunesse chiite par l'ayatollah Khomeini. Une faction soutient que la révolution iranienne menace non seulement notre peuple mais aussi nos frères arabes du Khouzistan. Pour eux, la meilleure approche serait de libérer le Khuzestan et ses gisements de pétrole. Une fois cela sous notre contrôle, nous pouvons dicter à Khomeiny ce qu'il peut ou ne peut pas dire. Une telle opération serait probablement facile à réaliser étant donné que l'armée iranienne est en plein désarroi après la révolution. L'autre faction soutient que nous devrions poursuivre nos efforts diplomatiques et laisser la situation se calmer. Bien que les attentats à la bombe et les assassinats soient décourageants, il semble que ce soit l'oeuvre d'une petite minorité que nous pourrons éventuellement éradiquer."
 Iranian_Iraq_War.4.d:0 "Les troupes irakiennes appuyées par des chars et des forces aériennes ont traversé la frontière iranienne vers le Khouzistan. Le gouvernement irakien a annoncé que cette opération était une réponse au terrorisme iranien contre le peuple irakien. Il a également ajouté que le gouvernement iranien représentait une menace existentielle pour les Arabes du Khouzistan et que l'Irak faisait son devoir de les libérer. La résistance iranienne initiale semble jusqu'à présent presque inexistante. Cependant, des rapports indiquent déjà que les anciens moyens militaires du Shah sont mobilisés aux côtés de volontaires enthousiastes pour contrer l'invasion irakienne."
 Iranian_Iraq_War.5.d:0 "Notre gouvernement surveille de très près la situation en Iran. Une révolution réussie aura de nombreuses conséquences pour nous. Notre propre population chiite, importante, pourrait tomber sous l'influence d'idéologies radicales et cela doit être contrôlé. Dans le même temps, le chaos en Iran pourrait nous offrir des opportunités. Nous bordons le territoire kurde iranien et la province arabe du Khuzestan, riche en pétrole. Si la situation gouvernementale et militaire se détériore considérablement, cela pourrait constituer une opportunité pour nos forces d'agir. Pendant des années, la taille et la force de l'Iran ont dissuadé et limité nos options, mais au milieu des troubles révolutionnaires, nous pouvons trouver des solutions à des conflits vieux de plusieurs décennies."
 Iranian_Iraq_War.6.d:0 "La nouvelle de la révolution iranienne ayant réussi à chasser le Shah indique un nouveau changement dans la région et dans nos relations avec l'Iran. Notre gouvernement et le Shah ont signé plusieurs traités ces dernières années sur notre frontière commune. Alors qu'il n'est plus au pouvoir et que l'armée iranienne est sans doute en pleine tourmente, le moment est peut-être venu pour nous de résoudre les différends en notre faveur. Nous pouvons certainement affirmer que les traités ne s'appliquent plus aujourd'hui et qu'il est dans le meilleur intérêt du monde de sécuriser ces terres et les personnes qui y vivent afin de les protéger de la violence révolutionnaire. D'autres membres du cabinet s'opposent à une intervention et estiment que nous devrions attendre de voir quel gouvernement émergera et les impliquer. En déclarant publiquement notre respect des traités, nous pourrions peut-être nouer des relations étroites avec l'Iran."
 Iranian_Iraq_War.7.d:0 "La révolution iranienne semble inarrêtable. Après une lutte acharnée contre le gouvernement irakien, ses forces se sont emparées de Bagdad et la résistance militaire irakienne a en grande partie pris fin. Le gouvernement iranien a annoncé qu'il retirerait bientôt ses forces d'Irak et laisserait derrière lui un gouvernement islamique comme cadeau au peuple irakien longtemps opprimé. Le nouveau régime irakien devrait être étroitement lié à Téhéran et dominé par la communauté chiite irakienne majoritaire. La victoire iranienne provoque déjà une onde de choc dans la région, car les États voisins mettent déjà en oeuvre des politiques visant à empêcher que leur propre population ne soit influencée par l'Iran et son idéologie panislamique. Pour l'ancien gouvernement irakien, ce résultat souligne l'erreur qu'il a commise en envahissant l'Iran afin de stopper l'exportation de la révolution et de sécuriser la province à majorité arabe du Khuzestan de l'Iran."
 Iranian_Iraq_War.8.d:0 "Des foules de célébrations sont descendues dans les rues de Bagdad et d'autres villes irakiennes après l'annonce de la fin de la guerre par la victoire du pays. Le gouvernement irakien a initialement déclenché la guerre par crainte de voir la Révolution islamique se propager à sa population et par désir de résoudre ses problèmes frontaliers de longue date avec l'Iran. L'armée irakienne a calculé que le gouvernement iranien serait faible et chaotique à cause de la Révolution et qu'il pourrait atteindre ses objectifs. Il s'est avéré qu'ils avaient raison puisque l'armée irakienne a non seulement assuré ses revendications frontalières, y compris la libération de la province à majorité arabe du Khuzestan, mais a également renversé le gouvernement islamique de Téhéran. Le nouveau gouvernement iranien est dirigé par le Conseil national de la Résistance iranienne, dominé par l'organisation laïque de gauche MEK. Il purge déjà les islamistes et a accepté de céder le Khuzestan à l'Irak, affirmant que c'est la volonté du peuple. Les États de la région craignent que la victoire irakienne n'encourage leurs dirigeants à rechercher des solutions similaires à d'autres différends."
 Iranian_Iraq_War.9.d:0 "Des foules de célébrations sont descendues dans les rues de Bagdad et d'autres villes irakiennes après l'annonce de la fin de la guerre par la victoire du pays. Le gouvernement irakien a initialement déclenché la guerre par crainte de voir la Révolution islamique se propager à sa population et par désir de résoudre ses problèmes frontaliers de longue date avec l'Iran. L'armée irakienne a calculé que le gouvernement iranien serait faible et chaotique à cause de la Révolution et qu'il pourrait atteindre ses objectifs. Il s'avère qu'ils avaient en partie raison : les forces irakiennes ont réussi à s'emparer du Khouzistan, mais les efforts visant à s'enfoncer plus profondément en Iran et à détruire la Révolution sont restés au point mort. Pour les Iraniens, même s'ils ont réussi à stopper l'expansion irakienne, ils n'ont pas pu les déloger du Khuzestan. La situation étant dans l'impasse, le gouvernement iranien a accepté à contrecoeur de mettre fin à la guerre et de céder le Khuzestan à l'Irak. L'Irak considère l'accord comme une victoire totale, mais de nombreux analystes suggèrent que les Iraniens pourraient relancer le conflit une fois qu'ils auront reconstruit leurs forces armées."
 Iranian_Iraq_War.10.d:0 "La guerre Iran-Irak a commencé après que le gouvernement irakien a initialement envahi l'Iran par crainte de voir la révolution islamique se propager à sa population et par désir de sécuriser ses problèmes frontaliers de longue date avec l'Iran. L'armée irakienne a calculé que le gouvernement iranien serait faible et chaotique à cause de la Révolution et qu'il pourrait atteindre ses objectifs. Cependant, après quelques premiers succès, la population iranienne s'est ralliée et a réussi à chasser les Irakiens du pays. Les deux camps ont alors tenté d'envahir l'autre, le gouvernement iranien promettant d'établir un gouvernement islamique à Bagdad. Aucune des deux parties n'a réussi et toutes deux ont accepté un cessez-le-feu qui rétablissait essentiellement les frontières d'avant-guerre. L'Irak revendique la victoire pour avoir réussi à stopper la propagation de la Révolution islamique, se qualifiant de bastion arabe contre les hordes perses. Les Iraniens revendiquent également la victoire de leur résistance nationale contre l'occupation étrangère. De nombreux analystes ne sont pas surpris que les deux pays présentent l'impasse militaire comme une victoire afin de montrer à leur peuple que la guerre n'a pas été vaine."
 Iran_Iraq_War_decision_category:0 "La guerre Iran-Irak"
 The_Iranian_Iraqi_War:0 "La guerre Iran-Irak"
 Iran_Iraq_War_decision_category_desc:0 "Le bouleversement de la révolution iranienne a offert à la fois une opportunité et un danger pour l'Irak. Beaucoup en Irak voient le chaos en Iran comme une opportunité de recourir à la force militaire pour résoudre les problèmes frontaliers et libérer la province du Khouzistan à majorité arabe. Cependant, la révolution iranienne et les mouvements panislamiques qu'elle propage remettent directement en question l'idéologie nationaliste arabe de l'Irak. Si rien n'est fait, l'Irak risque une révolution au sein de sa propre population chiite. Fort de ces considérations, le gouvernement irakien a décidé qu'il devait agir pour atteindre ses objectifs avant que le nouveau régime iranien ne s'installe ou que sa propre population n'explose dans des troubles."
