 French_PM.1.d:0 "Le gouvernement du Premier ministre français et vétéran politique Henri Queuille est tombé faute d'avoir obtenu un soutien suffisant à l'Assemblée nationale. Bien que son régime ait semblé court, il a réussi à gérer la montée des partis gaullistes et du communisme. Cependant, il devient évident que Queuille a eu du mal à gouverner avec une Assemblée nationale politiquement divisée et des lois constitutionnelles mal conçues concernant la législation. Certains se demandent si la IVe République a réellement corrigé les erreurs de la IIIe République. Cependant, le consensus général est qu'Henri Queuille s'en est bien sorti dans les circonstances."
 French_PM.2.d:0 "Le gouvernement du premier ministre Georges Bidault s'est récemment effondré à l'Assemblée nationale. Homme politique de carrière et ministre de longue date, Bidault a eu du mal à atteindre ses objectifs et a fait face à la pression constante de l'Assemblée nationale. Il a trouvé sa position de Premier ministre constamment remise en question par les débats de l'Assemblée sur ses ministres. Sa situation étant intenable, il a été contraint de se retirer. Les partis politiques français restent disposés à exploiter les faiblesses et les lacunes constitutionnelles à leur profit politique."
 French_PM.3.d:0 "Le gouvernement du Premier ministre René Pleven s'est récemment effondré à l'Assemblée nationale. Pleven était un fervent partisan de l'intégration européenne et s'est parfois retrouvé à lutter contre la gauche et la droite pour adopter une législation visant à faciliter ce processus. Cependant, les conflits sur le budget et ses luttes constantes avec la gauche et la droite ont fragilisé sa position. Réalisant qu'il ne pouvait plus proposer de législation ni même adopter son récent budget, il a démissionné."
 French_PM.4.d:0 "Pour la deuxième fois, le Premier ministre français Henri Queuille et son gouvernement tombent du pouvoir. Il s'agissait de son deuxième mandat en tant que Premier ministre, et beaucoup pensent qu'il s'est avéré bien plus difficile que lorsqu'il a pris ce poste pour la première fois. Les divisions et procédures politiques qu'il a habilement gérées lors de son premier mandat se sont révélées bien plus difficiles à surmonter cette fois-ci. Il a eu du mal à obtenir une légitimité auprès de son cabinet ou à négocier des compromis. Il semble que tous les partis politiques en France soient prêts à exploiter les faiblesses constitutionnelles de la Quatrième République pour atteindre leurs objectifs politiques."
 French_PM.5.d:0 "Pour la deuxième fois, le gouvernement du premier ministre Georges Bidault s'effondre à l'Assemblée nationale. Durant ce bref mandat, Bidault fait des questions syndicales sa priorité. Même s'il estimait que des progrès avaient été réalisés, l'instabilité politique de l'Assemblée nationale et les défis constants de ses ministres lui prenaient du temps. Lorsqu'il a réalisé que continuer à occuper ce poste ne ferait qu'entraîner davantage de retards et d'embouteillages, Bidault a décidé de mettre fin à son gouvernement. De nombreux citoyens français sont de plus en plus frustrés par le système politique actuel du pays, d'autant plus que le pays est confronté à des problèmes nationaux et internationaux majeurs."
 French_PM.6.d:0 "Le Premier ministre Edgar Faure a annoncé la dissolution de son gouvernement à l'Assemblée nationale. Le politicien conservateur a eu du mal au cours de son bref mandat à gérer les conflits politiques et les instabilités inhérentes à la Quatrième République. Les analystes estiment que les procédures de vote proportionnel, l'élection du Premier ministre par l'Assemblée nationale et la vulnérabilité des ministres aux votes de l'Assemblée nationale sont les principales causes empêchant un Premier ministre de consolider son emprise sur le gouvernement et le pouvoir législatif."
 French_PM.7.d:0 "Le gouvernement conservateur d'Antoine Pinay prend fin avec l'éclatement de sa coalition ministérielle. Pinay, qui a évité de peu d'être déclaré collaborateur pour son soutien à Pétain pendant la guerre, a réussi à organiser le soutien des conservateurs à l'Assemblée nationale. Il a consacré son bref mandat à restaurer les finances du pays, mais une fois de plus, l'absence de majorité claire à l'Assemblée nationale a rendu son gouvernement vulnérable dès le départ. Certains Français se demandent désormais ce qui a changé exactement entre la Troisième et la Quatrième République."
 French_PM.8.d:0 "Le Premier ministre René Mayer a annoncé la fin de son gouvernement après un bref passage au pouvoir. René Mayer, membre du Parti radical, comme beaucoup de ses prédécesseurs, a été gêné par l'absence de majorité claire à l'Assemblée nationale. La chute de son gouvernement est un autre signe pour les citoyens français que la Quatrième République n'a peut-être pas résolu les problèmes qui tourmentaient la politique française avant la guerre. René Mayer est important pour être le deuxième Premier ministre d'origine juive."
 AJAX.13.d:0 "Des informations selon lesquelles des membres du parti Tudeh se déchaînaient dans les magasins et détruisaient des symboles du capitalisme ont provoqué une panique massive à Téhéran. Des milliers de contre-manifestants sont venus condamner le Premier ministre Mossadegh pour avoir encouragé les troubles communistes dans les rues et appelé au retour du Shah. Parmi les principaux organisateurs de ces manifestations figure Shaban Jaffri. Les manifestants pro-Shah se sont rapidement agrandis de citoyens inquiets qui ont aidé à chasser les membres du parti Toudeh des rues. Le général Zahedi a convaincu la garnison locale de soldats de se joindre à nous et d'aider à expulser les Tudeh de la ville. Une fois le Tudeh retiré, les bâtiments gouvernementaux ont été saisis et le Premier ministre Mossadegh s'est rendu à l'armée après que sa résidence ait été la cible de tirs de chars. Mossadegh, afin d'éviter un bain de sang, a refusé d'appeler ses partisans à tenter de reprendre la situation. Une fois Mossadegh arrêté et Téhéran débarrassé de ses partisans, le général Zahedi prit le contrôle du gouvernement et invita le Shah à revenir d'Italie."
 Soviet_Nuke_Test.1.d:0 "L'Union soviétique a testé avec succès sa première arme nucléaire en République socialiste soviétique du Kazakhstan. Le dispositif d'une puissance de 22 kt a été conçu par l'Institut Kurchatov et armé de plutonium produit à l'installation nucléaire de Chelyabinsk-40. La bombe elle-même ressemble à la bombe américaine Fat Man larguée sur Nagasaki. Les Soviétiques ont désigné le test comme RDS-1. Ce succès est considéré comme le point culminant d'intenses recherches et développements soviétiques visant à contrer le monopole des États-Unis sur les armes nucléaires. Le Kremlin a chaleureusement félicité les scientifiques et les responsables qui ont réalisé cette grande réussite. Le gouvernement américain a découvert le test après qu'un avion de reconnaissance météorologique de l'Air Force ait collecté des échantillons confirmant une détonation nucléaire. À mesure que la nouvelle se répandra, les services de renseignement occidentaux seront déconcertés car ils ne s'attendaient pas à ce que les Soviétiques parviennent à une détonation nucléaire avant plusieurs années."
 CMEA_empowered:0 "Le CAEM habilité"
 
 vie.1500.d:0 "L'honneur et la dignité de la France et de son peuple ont été restaurés. La France a déjoué tous les pronostics en retournant dans ses colonies d'Indochine, alors que de nombreux analystes prédisaient un désastre. Cependant, l'armée et l'administration françaises ont pu se rétablir et construire des partenariats entre la population pour permettre leur succès militaire. Les efforts communistes ont été contrecarrés car leurs combattants n'ont pas pu prendre pied parmi la population et nos forces ont pu éliminer la menace. Avec nos partenaires locaux, la France envisagera l'avenir avec la certitude de pouvoir faire face aux difficiles vagues de décolonisation qui semblent déferler sur le monde entier."
 USA_70s_The_Paris_Peace_Accords:0 "Les accords de paix de Paris"
 USA_CIVIL_RIGHTS.1.d:0 "Les passagers noirs représentent soixante-quinze pour cent des passagers des bus de la ville de Montgomery. Cependant, ils sont tenus de s'asseoir à l'arrière du bus et sont confrontés à une discrimination ouverte de la part des chauffeurs de bus. Lors d'un incident récent, Rosa Parks, secrétaire de la NAACP, épouse et mère, a été arrêtée pour avoir refusé de céder son siège à un passager blanc. Elle a ensuite été condamnée à une amende de dix dollars. Organisateur E.D. Nix a décidé de faire de cette affaire le catalyseur d'un boycott contre la ségrégation des bus et la discrimination des passagers noirs. Il fait appel au jeune révérend Martin Luther King pour diriger le mouvement qui prend rapidement de l'ampleur. Les bus de Montgomery ont rapidement perdu des clients et les résidents noirs se sont entraidés pour maintenir le boycott. Les églises de tout le pays ont collecté des fonds pour le boycott. Les résidents blancs enragés ont eu recours à des attaques physiques et à des bombes incendiaires contre les églises noires à la tête des manifestations, mais Martin Luther King a réussi à empêcher les représailles violentes, prêchant la non-violence aux boycotteurs. La ville de Montgomery a finalement mis fin à sa politique de ségrégation suite au boycott et aux ordonnances du tribunal."
 USA_CIVIL_RIGHTS.2.d:0 "La communauté noire et le grand public ont été choqués après que le magazine Chicago Defender et Jet ait publié des photos inédites d'Emmitt Till. Jusqu'à présent, un jeune de 14 ans de Chicago avait été brutalement tué par des hommes blancs alors qu'il rendait visite à sa famille dans le Mississippi. Till aurait sifflé une femme blanche travaillant dans une épicerie. Son mari et ses amis ont retrouvé Till, l'ont battu, mutilé, puis lui ont tiré dessus avant de jeter son corps. Les tribunaux ont refusé de condamner les assassins et, lors des funérailles d'Emmitt Till, sa mère a ordonné qu'un cercueil soit ouvert pour montrer au monde ce qui avait été fait à son fils. Les images choquantes sont considérées comme un catalyseur de davantage d'actions en faveur des droits civiques. De nombreuses personnes à travers le pays ne comprennent pas comment un prétendu incident d'offense contre une femme pourrait conduire à un meurtre aussi brutal et à un manque de justice pour la victime."
 USA_CIVIL_RIGHTS.3.d:0 "À Albany, en Géorgie, les ministres noirs locaux et les dirigeants communautaires ont formé une alliance appelée Albany Movement. La ville est composée à quarante pour cent de noirs, mais les politiques de ségrégation et l'inaction de la police ont mis la communauté dans de graves difficultés. Il cherchait à utiliser les manifestations non-violentes pour déségréger les espaces publics de la ville. Le gouvernement local a refusé et les médias locaux se sont ouvertement rangés contre le mouvement Albany. Le mouvement Albany a cherché à envoyer des volontaires à la gare routière locale et à tester sa conformité aux lois fédérales sur la déségrégation. La police locale a arrêté les manifestants sous l'accusation de trouble à l'ordre public. Les arrestations et le refus des manifestants de verser une caution ont conduit à des manifestations de rue. La police d'Albany, craignant une presse nationale négative, a lancé une opération pour affronter de manière non violente les manifestants et répartir les personnes arrêtées dans tout le comté afin d'empêcher les prisons locales de se remplir. Le mouvement d'Albany a finalement échoué, mais ses efforts ont montré son lien avec les médias et le gouvernement, fournissant ainsi d'importantes leçons aux militants des droits civiques."
 USA_CIVIL_RIGHTS.4.d:0 "La Southern Christian Leadership Conference (SCLC), dirigée par le révérend Martin Luther King, a choisi Birmingham, en Alabama, peut-être la ville la plus ségréguée d'Amérique, comme cible de sa campagne d'action directe non-violente. La campagne a commencé par un boycott des entreprises locales à qui il a été demandé de mettre fin aux politiques d'emploi discriminatoires. Les manifestants ont eu recours à des sit-in, à des marches et à des campagnes électorales, mais ont été confrontés à des arrestations massives et à des actes d'intimidation. Martin Luther King a finalement été arrêté et il a écrit sa célèbre Lettre depuis la prison de Birmingham pour défendre les manifestations non-violentes. Pour maintenir l'élan, les manifestants ont recruté des étudiants, notamment dans les collèges et lycées, beaucoup plus disposés à être arrêtés par la police. La presse nationale et la nation dans son ensemble ont suivi les événements de près, les images de policiers utilisant des lances à eau et des chiens attaquant les manifestants étant les images déterminantes. Alors que la ville était paralysée et que l'opinion publique était contre eux, la ville a accepté la déségrégation."
 USA_CIVIL_RIGHTS.5.d:0 "Suite au succès de la campagne de Birmingham et à une plus grande sensibilisation du public au mouvement des droits civiques, une coalition de groupes de défense des droits civiques à travers le pays s'est réunie pour marcher sur Washington DC. On estime qu'environ un quart de million de personnes ont participé à la marche le long du National Mall. Au Lincoln Memorial, d'éminents dirigeants des droits civiques ont prononcé des discours, notamment le discours télévisé à l'échelle nationale I Have a Dream du révérend Martin Luther King. Ensuite, les intervenants se sont rendus à la Maison Blanche et ont discuté avec le président des questions relatives aux droits civiques. La marche est considérée comme un succès majeur et une expression de l'autonomisation des Noirs, mais certains participants, en particulier ceux de Nation of Islam, accusent les orateurs d'avoir transformé la marche d'une expression de colère noire en une manifestation de conciliation avec les Blancs et le gouvernement."
 USA_CIVIL_RIGHTS.6.d:0 "Des suprémacistes blancs présumés ont lancé une bombe incendiaire contre l'église baptiste de la 16e rue à Birmingham, en Alabama. L'église était un quartier général majeur des militants pendant la campagne de Birmingham et une cible visible pour les opposants aux droits civiques. Ce n'était pas la première attaque à la bombe incendiaire dans la ville, car de nombreuses attaques de ce type ont eu lieu au cours de la dernière décennie, mais c'était la première à faire des morts. Quatre jeunes filles noires ont été tuées dans l'explosion, provoquant la colère et le choc non seulement dans la ville mais aussi dans tout le pays. Dans les heures qui ont suivi l'attaque, des jeunes noirs et blancs se sont affrontés dans toute la ville alors que les deux communautés luttaient pour maintenir la paix. La police enquête apparemment sur l'implication du Ku Klux Klan, mais de nombreux résidents noirs doutent que justice soit rendue par ce qu'ils considèrent comme une force de police raciste."
 USA_CIVIL_RIGHTS.7.d:0 "L'Alabama a une législation d'État exigeant des tests d'alphabétisation et une taxe électorale pour les électeurs, ce qui a effectivement privé la plupart des résidents noirs et des Blancs pauvres du droit de vote. Cela est particulièrement visible dans le comté de Dallas, une région à majorité noire dans laquelle moins de deux cents Noirs ont le droit de voter sur une population de quinze mille habitants. Les autorités locales contrecarrent continuellement les efforts visant à élargir les listes électorales. Suite au meurtre du manifestant Jimmie Lee Jackson par un agent de l'État, les manifestants pour les droits des électeurs ont décidé de marcher de Selma à Montgomery pour interroger le gouverneur sur l'affaire et demander des réformes sur les lois électorales. Alors qu'ils traversaient un pont sur l'autoroute 80, les soldats de l'État ont attaqué pour disperser la foule, utilisant des matraques, des gaz lacrymogènes et des charges à cheval contre les manifestants. Les images et vidéos de l'action brutale de la police ont choqué la nation. Au total, dix-sept manifestants, dont des jeunes femmes, ont été hospitalisés et cinquante soignés pour des blessures mineures. Beaucoup qualifient cette marche ratée de « Dimanche sanglant »."
 USA_CIVIL_RIGHTS.8.d:0 "Les événements du Bloody Sunday ont provoqué la colère dans le comté de Dallas et dans la presse nationale. Les militants locaux ont demandé une ordonnance du tribunal pour protéger les manifestants lors d'une marche ultérieure, mais les tribunaux ont demandé plus de temps. Les manifestants impatients ont insisté pour que la deuxième marche se poursuive et le révérend Martin Luther King les a dirigés. Cependant, il a conclu un accord secret avec les autorités et après avoir conduit les manifestants à une prière sur le site du Bloody Sunday, il a renvoyé les manifestants vers Selma. Cette nuit-là, un prédicateur blanc, James Reeb, qui participait aux manifestations, a été brutalement assassiné par des membres du Ku Klux Klan à Selma. Le meurtre a suscité encore plus d'indignation et lorsque les tribunaux ont autorisé la marche à continuer, la Maison Blanche a promis sa protection. Le Dr Martin Luther King a ensuite conduit les manifestants à Montgomery, où jusqu'à vingt-cinq mille manifestants ont participé. La sympathie nationale et la protection fédérale mettent en évidence le soutien croissant aux droits civiques aux États-Unis."
 USA_CIVIL_RIGHTS.9.d:0 "Le révérend Martin Luther King a emmené sa campagne pour les droits civiques du sud ségrégationniste jusqu'à Chicago. Son arrivée vise à soutenir les efforts visant à mettre fin à la ségrégation de facto en matière de logement, d'éducation et d'emploi qui sévit dans toute la ville. Bien que les résidents noirs locaux aient d'abord résisté au Dr King, il a pu aider à mettre sur pied le Chicago Freedom Movement et a commencé à organiser des rassemblements à travers la ville, malgré quelques incidents de violence de la part de la police et des résidents blancs. Finalement, le Dr King a présenté une liste d'exigences à la mairie de Chicago afin qu'elle fasse pression sur ses dirigeants pour qu'ils agissent contre la discrimination. La campagne souligne que la discrimination raciale existe partout aux États-Unis, et pas seulement dans le sud, et qu'elle influencerait la législation à venir au Congrès sur les pratiques déloyales en matière de logement. Le Chicago Freedom Movement constitue la plus grande campagne pour les droits civiques dans le nord."
 USA_CIVIL_RIGHTS.10.d:0 "La Campagne des Pauvres vise à faire pression sur le gouvernement pour qu'il garantisse à tous les citoyens la justice économique et l'accès à ce dont ils ont besoin pour vivre. Il s'agit d'un changement de cap de la part des dirigeants du mouvement des droits civiques, comme le Dr Martin Luther King, qui estiment que les conditions de vie des Noirs n'ont pas changé en raison de la nouvelle législation sur les droits civiques. Plusieurs milliers de participants ont organisé un camp de protestation à Washington DC pour faire pression sur le gouvernement en faveur de la justice économique et est unique en ce qu'il s'agit d'un effort multiracial réunissant des manifestants de tous les principaux groupes raciaux du pays. Les manifestants resteront et sont censés montrer au Congrès et au gouvernement le visage de la pauvreté dans le pays. La campagne a effectivement sensibilisé et a conduit à certains changements politiques destinés à réduire la pauvreté, mais en général, les médias nationaux et les résidents locaux ont manqué de sympathie envers les manifestants. Les agences fédérales concernées enquêtent actuellement sur le révérend Martin Luther King et d'autres leaders des droits civiques, les accusant d'être des communistes potentiels."
 USA_CIVIL_RIGHTS.11.d:0 "Bien que les tribunaux et le gouvernement fédéral aient déségrégué les transports publics et les bus interétatiques dans le sud, les autorités locales refusent d'obéir aux lois. En réponse, des groupes de défense des droits civiques à travers le pays organisent des Freedom Rides au cours desquels des militants métis sont assis dans des bus pour défier les États qui n'appliquent pas les lois. Les autorités locales ont invoqué des ordonnances locales et tenté d'imposer la ségrégation lorsque les bus atteignaient les villes du sud, ce qui a entraîné des arrestations et des violences collectives. Cependant, des ordonnances judiciaires ultérieures ont déclaré ces ordonnances inconstitutionnelles et ont statué en faveur des Freedom Riders. Même face à la violence de la foule, les militants des droits civiques ont continué jusqu'à ce que l'Interstate Commerce Commission obéisse finalement aux ordonnances du tribunal et permette aux passagers de choisir où ils souhaitent s'asseoir, quelle que soit leur race."
 USA_CIVIL_RIGHTS.12.d:0 "Le Dr Martin Luther King est arrivé à Memphis Tennessee pour soutenir les travailleurs noirs du secteur de l'assainissement exigeant des salaires plus élevés et la fin des pratiques discriminatoires qui favorisaient les employés blancs. Cela s'inscrit dans la continuité du récent changement approuvé par le Dr King, visant à se concentrer sur la justice économique ainsi que sur les droits civils. Le 3 avril, le Dr King s'est adressé à une église dans laquelle il a déclaré que s'il mourait, ce ne serait pas en vain et que la cause continuerait. Le lendemain soir, alors qu'il se tenait sur le balcon de sa chambre de motel, une balle a touché l'icône des droits civiques. Une heure plus tard, son décès a été constaté à l'hôpital. La Maison Blanche et les dirigeants de tout le pays n'ont pas tardé à manifester leur sympathie et le meurtre a indigné la population à travers le pays. L'assassin est toujours en fuite. Des nouvelles ont commencé à se répandre selon lesquelles des communautés noires frustrées à travers le pays se livraient à de violentes émeutes pour exprimer leur frustration face à l'assassinat. Les proches collaborateurs de Martin Luther King appellent au calme et à la non-violence, comme le Dr King l'a toujours prêché."
 USA_CIVIL_RIGHTS.13.d:0 "Malik El-Shahbaz, mieux connu sous le nom de Malcolm X, a été assassiné lors d'un discours à Manhattan par des hommes armés de Nation of Islam. Shahbaz a longtemps accusé son ancien groupe d'avoir tenté de le tuer après avoir publiquement rompu avec Elijah Muhammad. En tant que Malcolm X, il a aidé le groupe à accroître le nombre de ses membres de manière exponentielle. Devenir connu à l'échelle nationale pour sa rhétorique sur l'identité noire et le séparatisme. Il a longtemps critiqué d'autres leaders des droits civiques pour avoir fait des compromis avec les oppresseurs. Il a publiquement rompu avec la Nation de l'Islam en 1964. Il s'est rendu à La Mecque pour le pèlerinage du Hajj, où cette expérience l'a amené à se convertir à l'islam sunnite et à changer sa vision du monde. À son retour aux États-Unis, il a annoncé son nouveau nom et sa croyance en l'harmonie raciale et non en le séparatisme. Il a contacté des dirigeants qu'il avait autrefois critiqués, comme Martin Luther King, pour offrir son soutien au mouvement non-violent. Beaucoup pleurent la perte d'un homme qui parlait si éloquemment de fierté pour l'identité noire et qui a été abattu alors qu'il venait tout juste de commencer son chemin vers l'harmonie raciale."
 USA_CIVIL_RIGHTS.14.d:0 "La deuxième grande migration a vu de nombreuses familles afro-américaines arriver à Los Angeles. Cependant, ils ont été confrontés à des règles de logement discriminatoires, à des brutalités policières et, malgré les législations sur les droits civiques, ils ont maintenu des pratiques destinées à empêcher les minorités de détenir des biens. En outre, le LAPD, de plus en plus militarisé, a lancé des opérations et des patrouilles ciblées axées sur les jeunes noirs et hispaniques. Toute cette tension a explosé en violence lorsque l'automobiliste noire Marquette Frye a eu une altercation avec des policiers de l'État. Le chaos a vu la police arrêter des habitants des environs, provoquant la formation d'une foule en colère qui a jeté des pierres sur la police. Des émeutes ont éclaté dans la région malgré les appels au calme des dirigeants communautaires. La Garde nationale de Californie a été appelée avec la police qui a traité les émeutes comme une zone de guerre. Au final, il y a eu trente-quatre morts, des milliers de blessés, des milliers d'arrestations et des millions de dégâts matériels. L'État a convoqué une commission chargée d'examiner les causes des troubles et les leaders des droits civiques citent les émeutes comme une raison pour laquelle le pays devrait repenser ses pratiques racistes."
 USA_CIVIL_RIGHTS.15.d:0 "Une conséquence de la Deuxième Grande Migration fut l'émergence de communautés afro-américaines dans des villes situées en dehors du sud. Ces résidents étaient constamment confrontés à la discrimination, à la violence et au racisme. Pour ces habitants, la tactique du mouvement des droits civiques du sud, destinée à lutter contre la ségrégation légale et le métayage, ne leur était pas applicable. De jeunes jeunes noirs ont organisé des groupes Black Power pour étudier comment la communauté noire peut éventuellement accéder au pouvoir économique et politique ainsi qu'à l'égalité des droits. Huey Newton et Bobby Seale ont créé le Black Panther Party à partir de ces discussions à Oakland. Ils se sont inspirés de la rhétorique nationaliste noire de Malcolm X et se sont opposés à tout accommodement avec leurs oppresseurs. Le groupe s'est joint à des groupes étudiants militants pour former des forces d'autodéfense afin de se protéger contre les suprémacistes blancs et les patrouilles de police racistes. Ils ont installé des camps et collectent légalement des armes pour se défendre. Le groupe fait partie d'une nouvelle tendance du nationalisme noir qui refuse de compromettre leur droit à la protection contre la violence extérieure."
 USA_CIVIL_RIGHTS.16.d:0 "Dans une décision historique, la Cour suprême s'est prononcée en faveur de la famille Loving et a déclaré inconstitutionnelles les lois anti-métissage. Le tribunal a jugé que les lois anti-métissage violaient les lois sur l'égalité de protection. Ils n'étaient pas impressionnés par l'argument selon lequel de telles lois affectaient les deux races de manière égale et ne violaient donc aucun groupe. Les tribunaux ont noté que les lois faisaient uniquement la distinction de race sur la pratique du mariage, qui est une pratique largement acceptée, rendant ainsi les lois discriminatoires. Les résultats ouvriront la porte aux mariages interraciaux à travers les États-Unis. L'affaire a commencé lorsque la famille Loving a été arrêtée pour avoir violé les lois de Virginie interdisant les unions interraciales en se mariant à Washington DC. Ils ont porté l'affaire devant la Cour suprême. Après le verdict, le couple devrait recommencer à vivre en Virginie avec sa jeune famille."
 USA_CIVIL_RIGHTS.17.d:0 "À Détroit, après que la police a fait une descente dans un bar sans permis, dans lequel elle a arrêté des fêtards célébrant le retour de deux GI noirs du combat, une foule a éclaté de violence. Les émeutes se sont rapidement propagées dans la région et la police a été rapidement submergée. La violence a dégénéré en incendies de bâtiments et la police a dû être soutenue par des agences extérieures. Au bout de deux jours, la Maison Blanche a autorisé le déploiement de troupes fédérales et de la Garde nationale pour réprimer les émeutes. Finalement, les violences ont pris fin et des milliers de personnes ont été arrêtées, mais la Garde nationale a été critiquée pour avoir tué neuf émeutiers sans grande provocation. La police est également accusée d'avoir maltraité les habitants pendant le chaos. Les émeutes sont imputées à des politiques de logement discriminatoires et à une brutalité policière excessive dans les quartiers noirs. L'État s'est engagé à examiner ces préoccupations et à accroître le recrutement des minorités au sein du gouvernement, mais de nombreux Blancs accusent désormais le gouvernement de légitimer les émeutiers et les radicaux."
 USA_CIVIL_RIGHTS.18.d:0 "Le gouverneur de l'Alabama, George Wallace, a prononcé un discours passionné dans la capitale de l'État, à Montgomery, en Alabama. Il a défendu ses opinions ségrégationnistes et a vivement critiqué le mouvement des droits civiques. Il a déclaré la ségrégation maintenant, la ségrégation demain, la ségrégation pour toujours devant une foule de partisans enthousiastes. Ses remarques ont retenu l'attention de la presse nationale et le gouverneur Wallace semble être le principal symbole contre l'intégration dans le sud. Les leaders des droits civiques ont condamné ses propos comme étant insensibles et racistes, affirmant qu'ils risquaient d'inciter à la violence contre les minorités vulnérables de l'État."
 USA_CIVIL_RIGHTS.19.d:0 "À Tuscaloosa, en Alabama, des manifestants menés par le révérend T.Y. Rogers prévoyait de marcher depuis leur église jusqu'au palais de justice du comté de Tuscaloosa pour protester contre ses politiques de ségrégation. Cependant, la police a réagi à la manifestation pacifique avec une violence extrême pour tenter d'empêcher les manifestants d'atteindre le palais de justice. Au final, près d'une centaine d'arrestations ont été effectuées et près de quarante personnes ont été hospitalisées en raison des blessures brutales reçues. Les médias ont largement ignoré cet incident et très peu de personnes en dehors du sud ou du mouvement des droits civiques sont au courant de ce qui s'est produit. Cependant, cela montre l'ampleur de la violence à laquelle les groupes de défense des droits civiques sont confrontés presque quotidiennement dans le sud. Le Dr Martin Luther King a condamné la violence et appelé la police à respecter la nature non-violente du mouvement."
 USA_CIVIL_RIGHTS.20.d:0 "La campagne Freedom Summer s'est récemment terminée mais n'a pas atteint son objectif d'augmenter considérablement le nombre d'électeurs noirs inscrits dans le Mississippi. La campagne a vu des militants des droits civiques et des bénévoles de tout le pays venir au Mississippi et aider les habitants à s'inscrire et à voter. La campagne a été grandement entravée par les lois Jim Crow, les autorités locales et les actes de violence perpétrés par des groupes comme le Ku Klux Klan. La campagne a fait connaître la nature de ces lois et a suscité une sympathie nationale pour les mouvements des droits civiques, aidant finalement grandement la cause. Au cours de l'été, plus d'un millier de militants ont été arrêtés, près d'une centaine battus et quatre tués. Trois résidents noirs locaux ont également été assassinés en raison de leur implication dans le mouvement. La violence a sensibilisé les volontaires noirs à la nécessité de se défendre et est considérée comme un catalyseur de la tendance nationaliste noire croissante parmi les jeunes afro-américains."

 algeria.1000.d:0 "Le Premier ministre français Guy Mollet a récemment conclu sa désastreuse visite à Alger. Avant son déplacement, Mollet avait promis de s'entretenir avec les insurgés du FLN. Cependant, après avoir pris le pouvoir, il a fait marche arrière et a déclaré que les négociations ne pourraient avoir lieu qu'après une victoire militaire française. Son changement de position a fini par exaspérer les populations pro-françaises et anti-françaises en Algérie. Durant son voyage, le Premier ministre a été bombardé de tomates pourries lancées par une manifestation hostile. Les médias français qualifient déjà l'événement de journée de la tomate. Le Premier ministre est rentré à Paris convaincu qu'il doit prendre une position ferme sur la question algérienne sous peine de perdre le soutien de tous les partis sur le territoire français."
 algeria.1001.d:0 "Le nationalisme algérien s'est développé de façon spectaculaire à mesure que la majorité algérienne arabe et berbère musulmane s'est inspirée des idées wilsoniennes d'autodétermination. L'Algérie a joué un rôle de premier plan pendant la Seconde Guerre mondiale, fournissant de vastes bases, main-d'oeuvre et ressources à la France libre. Après la guerre, le gouvernement français a fermement refusé de concéder l'indépendance de l'Algérie, soutenu par l'importante population de colons algériens européens appelée les pieds-noirs. Depuis la Seconde Guerre mondiale, les groupes anti-français ont évolué et ont formé le Front de libération nationale (FLN) pour diriger l'effort anticolonial. Dans un effort pour faire pression sur la France pour qu'elle se décolonise, le FLN a formé un comité exécutif pour administrer et organiser une branche armée afin de lancer une guérilla contre les Français. À la suite d'attaques spectaculaires à travers l'Algérie le jour de la Toussaint, le FLN a annoncé sa présence et son adhésion à une résistance violente. En réponse, l'armée et l'État français ont commencé à rassembler leurs propres forces pour détruire le FLN et la résistance anticoloniale algérienne."
 algeria.1002.d:0 "La guerre d'Algérie a pris une tournure sombre suite à l'échec de l'attaque du FLN sur Philippeville. Le FLN a lancé un assaut complet, dans l'espoir de prendre les Français par surprise et de s'emparer de l'importante ville portuaire. Cependant, les forces françaises avaient découvert le mouvement des combattants du FLN et étaient au courant d'une attaque. Lors de l'attaque initiale, les forces françaises ont subi des pertes alors que des civils européens ainsi que des Arabes et des Berbères considérés comme des collaborateurs ont été tués par le FLN et leurs partisans locaux. Ces massacres et l'attaque ont été stoppés après l'arrivée des parachutistes français, capturant plus d'une centaine de prisonniers. Les forces françaises ont procédé à l'exécution de leurs prisonniers, tuant au moins deux cents personnes. La population civile européenne locale a réagi à ses pertes en lançant un pogrom brutal de violence aveugle contre la population musulmane locale composée d'Arabes et de Berbères. Sous les yeux des forces françaises, des centaines de ces civils ont été tués dans le stade de football local, sous les yeux de civils européens depuis les tribunes. Ces horribles violences ont provoqué la colère de la population musulmane algérienne, indigné la communauté internationale et conduit à exiger à Paris que le gouvernement réfléchisse à ses options."
 algeria.1003.d:0 "La Main Rouge, ou La Main Rouge, est une organisation terroriste française dont l'objectif est d'assassiner des dirigeants et de saboter les opérations du Front de libération nationale (FLN). Depuis sa création, le groupe a été responsable de l'assassinat de plusieurs dirigeants et partisans éminents du FLN en Europe et en Tunisie. Plus important encore, le groupe est lié aux meurtres d'importants marchands d'armes en Allemagne liés à la contrebande d'armes pour le FLN. De nombreux médias et FLN soupçonnent que le groupe est une façade pour les services de renseignement français, les autorités françaises ne semblant pas disposées à réprimer le groupe."
 algeria.1004.d:0 "La crise récente a mis en évidence la faiblesse politique de la Quatrième République et le pouvoir militaire sur les autorités civiles. Pour combattre cette faiblesse politique, les pouvoirs politiques ont convenu de ramener Charles De Gaulle à la tête de la France. Sa nomination a satisfait l'armée, le grand public et la plupart des groupes politiques. Afin de résoudre la crise en Algérie et de fixer la Constitution, De Gaulle a demandé et obtenu de l'Assemblée nationale l'autorisation de gouverner par décret. Avec ces pouvoirs d'urgence, De Gaulle espère mieux traiter avec l'Algérie et résoudre les problèmes politiques qui tourmentent le pays depuis la fin de la Seconde Guerre mondiale."
 algeria.1005.d:0 "Le Front de libération nationale (FLN) a récemment subi des revers dans la lutte pour l'indépendance de l'Algérie. Les Français ont arrêté certains de leurs dirigeants et, plus troublant encore, les colons européens Pied-noir ont commencé à former leurs propres groupes paramilitaires. Ces groupes ont organisé des attentats à la bombe et des meurtres d'Arabes musulmans et de Berbères dans les villes côtières. Le FLN a décidé de lancer une campagne terroriste aveugle dans les villes, en particulier dans la capitale Alger, pour amener la guerre à l'ennemi et démontrer que l'armée française n'avait pas le contrôle des espaces urbains. La campagne a vu des bombardements et des attaques à l'arme à feu contre des cibles civiles européennes et du personnel militaire français à travers la ville. Les forces françaises ont été renforcées par les autorités coloniales locales désespérées de rétablir l'ordre. Au cours des mois suivants, les forces françaises ont eu recours à des tactiques agressives d'interrogatoire et de contre-insurrection pour démanteler les réseaux du FLN dans la ville. Bien qu'Alger ait finalement été sécurisée, les violences brutales des deux côtés ont entraîné une rupture complète des relations entre les Pieds-noirs et les communautés musulmanes de la ville."

 USA_CIVIL_RIGHTS.21.d:0 "L'historique Brown vs Board of Education a mis fin à la pratique de la ségrégation dans les écoles à travers le pays. Cependant, depuis la décision, l'Université d'Alabama n'a admis aucun candidat noir, travaillant souvent en étroite collaboration avec la police pour trouver quoi que ce soit qui puisse disqualifier un candidat ou prétendre que tous les sièges disponibles étaient pourvus. Récemment, un tribunal fédéral a constaté cette discrimination et a ordonné à l'université d'admettre Vivian Malone et James Hood. Le gouverneur de l'Alabama, George Wallace, dans un effort symbolique pour tenir son engagement inaugural de maintenir la ségrégation pour toujours, a bloqué l'entrée de l'Auditorium Foster pour empêcher les deux étudiants de s'inscrire officiellement. Sous les yeux des médias, il a refusé haut et fort de se retirer lorsqu'il a été confronté au procureur général adjoint des États-Unis. Le président a ensuite fédéralisé la Garde nationale de l'Alabama et a ordonné à son commandant de déplacer le gouverneur. Les genres ont poliment demandé à se conformer, ce que le gouverneur a fait, permettant aux deux étudiants de finaliser leur inscription. L'incident a galvanisé les tensions dans la région et a attiré davantage l'attention nationale de Wallace."
 USA_CIVIL_RIGHTS.22.d:0 "Lors d'une cérémonie à la Maison Blanche, le président des États-Unis a signé la loi historique sur les droits civils, sous l'oeil attentif d'éminents défenseurs des droits civiques. Le projet de loi interdit toute discrimination fondée sur la race, le sexe, la couleur ou l'origine nationale. Il interdit également l'application inégale des lois liées à l'emploi, à l'inscription des électeurs ou à la ségrégation dans les écoles ou les lieux publics. Le projet de loi a longtemps été défendu par des politiciens et des militants, mais a reçu un soutien renouvelé suite à la montée des protestations et de la sensibilisation aux droits civiques, en particulier dans les États du sud. Malgré quelques protestations de la part des partisans de la ségrégation et des efforts visant à faire obstruction au projet de loi au Congrès, le président et les partisans du projet de loi ont contribué à son adoption. Bien que nombreux soient ceux qui louent la loi, il reste à voir avec quelle efficacité les autorités locales et le gouvernement fédéral en appliquent les conditions."
 USA_CIVIL_RIGHTS.23.d:0 "Le président des États-Unis a promulgué un projet de loi historique sur les droits civiques, le Voting Rights Act. Cette nouvelle loi interdit la discrimination raciale lors du vote et protège l'accès des citoyens aux droits des quatorzième et quinzième amendement. Pendant des décennies, de nombreux États, en particulier dans le sud, avaient des lois électorales exigeant des conditions d'éducation et économiques qui empêchaient la grande majorité des électeurs noirs de voter. Bon nombre des récentes manifestations en faveur des droits civiques étaient liées à la question de la discrimination dans le vote des citoyens noirs. Le président a signé le projet de loi en présence d'éminents militants des droits civiques et est félicité pour avoir aidé le projet de loi à être adopté par le Congrès et le Sénat. Le projet de loi permettra également aux observateurs fédéraux de surveiller les élections et de garantir qu'aucune violation n'est commise. Bien que le projet de loi aide les électeurs minoritaires, il convient de noter que ses dispositions permettront à de nombreux Blancs pauvres de participer également aux élections."

 fra.10.d:0 "Le gouvernement autonome du Tchad a officiellement demandé son indépendance à la France. Ses dirigeants estiment que le pays a progressé rapidement sous la direction de la France et est désormais prêt à rejoindre la communauté des nations selon ses propres conditions. La classe politique dirigeante actuelle est composée de nombreux dirigeants formés à l'occidentale ou francophiles. Le gouvernement français peut accepter cette demande, cela rendra la France populaire auprès du peuple tchadien et de son nouveau gouvernement. Cependant, l'indépendance peut comporter des risques imprévus qui pourraient coûter cher à la France. L'autre option est de décliner poliment la demande et d'insister sur le fait que le Tchad a besoin de la protection française, surtout dans un monde de plus en plus dangereux. Cela pourrait aliéner la population, mais nos intérêts seraient fermement garantis."
 fra.9.d:0 "Le gouvernement autonome du Niger a officiellement demandé son indépendance à la France. Ses dirigeants estiment que le pays a progressé rapidement sous la direction de la France et est désormais prêt à rejoindre la communauté des nations selon ses propres conditions. La classe politique dirigeante actuelle est composée de nombreux dirigeants formés à l'occidentale ou francophiles. Le gouvernement français peut accepter cette demande, cela rendra la France populaire auprès du peuple nigérien et de son nouveau gouvernement. Cependant, l'indépendance peut comporter des risques imprévus qui pourraient coûter cher à la France. L'autre option est de décliner poliment la demande et d'insister sur le fait que le Niger a besoin de la protection française, surtout dans un monde de plus en plus dangereux. Cela pourrait aliéner la population, mais nos intérêts seraient fermement garantis."
 fra.8.d:0 "Le gouvernement autonome de Guinée a officiellement demandé son indépendance à la France. Ses dirigeants estiment que le pays a progressé rapidement sous la direction de la France et est désormais prêt à rejoindre la communauté des nations selon ses propres conditions. La classe politique dirigeante actuelle est composée de nombreux dirigeants formés à l'occidentale ou francophiles. Le gouvernement français peut accepter cette demande, cela rendra la France populaire auprès du peuple guinéen et de son nouveau gouvernement. Cependant, l'indépendance peut comporter des risques imprévus qui pourraient coûter cher à la France. L'autre option est de décliner poliment la demande et d'insister sur le fait que la Guinée a besoin de la protection française, surtout dans un monde de plus en plus dangereux. Cela pourrait aliéner la population, mais nos intérêts seraient fermement garantis."

 YEM_COuP.1.d:0 "La récente désignation de Muhammad al-Badr comme prince héritier par son père, l'imam Ahmad bin Yahya, a suscité des troubles parmi ses principaux conseillers militaires et au sein de la famille royale. Les frères de l'Imam Ahmad bin Yahya pensaient que l'un d'entre eux aurait dû être nommé héritier en raison de la tradition et de son rôle dans le maintien de l'Imam au pouvoir. Au sein de l'armée, beaucoup estimaient qu'Al-Badr était trop favorable à la rhétorique nationaliste arabe qui déferle sur la région. Le lieutenant-colonel Ahmed Yahya al-Thalaya a décidé d'agir. Il a déployé ses forces sous prétexte de maîtriser les agriculteurs protestataires, mais a plutôt conduit ses hommes à assiéger l'imam Ahmad bin Yahya dans son palais de Taiz. Thalaya a demandé à l'Imam d'abdiquer en faveur de son frère le prince Abdullah Yahya Hamid al-din. Le prince Abbas, un autre frère, organise des manifestations en faveur du coup d'État dans la capitale Sanaa. Le prince al-Badr, craignant de perdre son trône, tente de rallier le soutien tribal contre Thalaya..."
 YEM_COuP.2.d:0 "Le prince al-Badr, héritier désigné et fils de l'imam Ahmad bin Yahya, n'a pas réussi à faire échouer le coup d'État contre son père. Le lieutenant-colonel Ahmed Yahya al-Thalaya, qui avait assiégé l'imam à Taiz, a réussi à forcer l'imam à abdiquer le trône en faveur de son frère Abdullah Yahya Hamid al-din. Le prince Muhammad al-Badr avait rallié un certain nombre de membres de tribus pour soutenir son contre-coup d'État. Cependant, lorsqu'ils tentèrent de s'emparer de l'armurerie royale et du trésor près de Taiz, ils se heurtèrent à la résistance des loyalistes de Thalaya. Le commandant, à la dernière minute, a ordonné à ses partisans à Taiz de sécuriser les dépôts d'armes et d'arrêter les soldats fidèles à l'imam, sauvant probablement son complot. Alors qu'al-Badr n'a pas pu sauver son père, les forces gouvernementales à Sanaa ont refusé d'agir, permettant ainsi aux manifestations organisées par le prince Abbas de s'intensifier. La situation étant intenable, l'imam Ahmad bin Yahya a signé les papiers d'abdication et a remis le pouvoir à son frère."
 YEM_COuP.3.d:0 "Le prince al-Badr, héritier désigné et fils de l'imam Ahmad bin Yahya, a réussi à faire échouer la tentative de coup d'État contre son père. Le cerveau, le lieutenant-colonel Ahmed Yahya al-Thalaya, a concentré ses forces sur le siège de l'Imam à Taiz, ce qui a permis à al-Badr d'amener ses partisans tribaux et de s'emparer de l'armurerie et du trésor locaux de Taiz. De plus, des soldats loyalistes à l'Imam qui avaient fui Thalaya ont rejoint al-Badr qui a rapidement rompu la saisie et arrêté al-Thalaya. À Sanaa, le succès d'al-Badr a contribué à galvaniser les forces gouvernementales de la ville qui ont rapidement réprimé les manifestations pro-coup d'État et arrêté ses organisateurs, le prince Abbas. Le prince Abdullah Yahya Hamid al-din, que Thalaya cherchait à placer sur le trône, a également été arrêté. L'imam Ahmad bin Yahya serait furieux de la trahison de ses militaires et de ses frères."
 YEM_COuP.4.d:0 "L'imam du Yémen, Ahmad bin Yahya, s'est récemment rendu en Italie pour suivre un traitement médical. Son héritier et fils désigné, le prince Muhammad al-Badr, a pris la relève pendant que son père se rétablissait. Cependant, des rumeurs parvinrent bientôt dans le pays selon lesquelles l'Imam Ahmad était tombé dans le coma et ne s'en remettrait pas. Le prince al-Badr a pris cela comme un signe et a lancé une série de réformes, comme la création d'un parlement et l'invitation de conseillers égyptiens à moderniser l'État. Ces réformes radicales ont provoqué des réactions négatives au sein du gouvernement, en particulier parmi les militaires qui s'y sont opposés. Le prince al-Badr a versé des fonds aux forces tribales qui ont lancé une rébellion en soutien aux réformes et à al-Badr. Les modérés et les partisans pro-royalistes prient pour que l'imam se rétablisse et revienne avant que les rebelles ne deviennent trop puissants."
 YEM_COuP.5.d:0 "Bien que l'imam Ahmad bin Yahya se soit remis de sa maladie en Italie, il a suivi les conseils de ses médecins et y est resté pour se rétablir complètement. Beaucoup pensent qu'il a été induit en erreur quant à l'ampleur réelle des troubles dans le pays. À son retour, il trouva les troubles tribaux en faveur de son fils, le prince Muhammad al-Badr, bien plus fort qu'il ne l'avait imaginé. L'Imam a annulé toutes les réformes réalisées en son absence et a ordonné aux militaires d'écraser les forces tribales. Cependant, de nombreuses unités avaient déjà été infiltrées par la propagande du prince al-Badr et les forces tribales étaient profondément ancrées. Lorsqu'il est devenu clair que l'armée ne pouvait pas contenir les troubles et que les manifestants pro-al-Badr ont commencé à défiler dans la capitale, l'imam Ahmad ben Yahya a annoncé son abdication du trône en faveur de son fils."
 YEM_COuP.6.d:0 "À la grande surprise du prince Muhammad al-Badr, l'imam Ahmad bin Yahya a non seulement survécu à sa maladie en Italie, mais il est également immédiatement revenu. L'Imam a immédiatement annulé toutes les réformes d'al-Badr et a ordonné à l'armée d'écraser les rebelles tribaux. L'armée a impitoyablement écrasé toutes les tribus qui ne se rendaient pas immédiatement et ne prêtaient pas allégeance à l'Imam. Certaines tribus se sont enfuies en Arabie Saoudite mais ont été rapidement remises à l'Imam. Pour tester la loyauté de son fils, le prince al-Badr reçut l'ordre de superviser l'exécution de tous les chefs rebelles. Les militaires et les hauts responsables gouvernementaux seraient très satisfaits du retour de l'Imam."
