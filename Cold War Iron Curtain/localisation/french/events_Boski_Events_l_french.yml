 insurgency_below_five_TT:0 "Force d'insurrection inférieure à 5 %"
 Rajk.1.d:0 "Laszlo Rajk a été arrêté par le gouvernement sous l'accusation de collaboration avec les capitalistes, d'être titiste et de trahison de l'indépendance hongroise. Cela marque la fin des premiers dirigeants du Parti communiste hongrois. Il a combattu pendant la guerre civile espagnole et a été arrêté pendant la Seconde Guerre mondiale pour ses actions contre le régime fasciste. Dirigeant populaire, il a été ministre de l'Intérieur et ministre des Affaires étrangères, contribuant à purger la Hongrie des contre-révolutionnaires et à créer l'agence de sécurité de l'État, l'AVH. Cependant, le Premier ministre hongrois Matyas Rakosi commence à considérer le leader populaire comme une menace pour lui. Les Soviétiques estiment également que ses déclarations en tant que ministre des Affaires étrangères ont sapé les efforts diplomatiques, notamment en ce qui concerne la Yougoslavie. Avec l'aide soviétique, Rakosi a agi contre Rajk et beaucoup voient dans son arrestation le signe que Rakosi commence à consolider son emprise sur la Hongrie et le parti."
 Kadar.1.d:0 "Janos Kadar, ancien dirigeant communiste et coordinateur politique en pleine ascension, a été arrêté par l'AVH sous les ordres du Premier ministre Matyas Rakosi. Kadar est accusé d'être un espion du précédent régime fasciste de Miklos Horthy. Beaucoup considèrent ces accusations comme étant forgées de toutes pièces et représentent un coup de pouvoir de la part de Rakosi pour consolider le pouvoir sur le gouvernement. Kadar a récemment démissionné de son poste de ministre de l'Intérieur en invoquant des problèmes de santé, beaucoup soupçonnant qu'il essayait d'éviter d'être arrêté, mais cela ne l'a pas protégé. Il est actuellement interrogé par l'AVH et sera prochainement traduit en justice pour faire face à ses accusations. Le parti lui a déjà retiré son statut."
 Golden_Team.1:0 "L'équipe nationale hongroise de football est devenue l'équipe la plus dominante ces derniers temps, appelée Golden Team. L'équipe est dirigée par le directeur Gusztav Sebes, un ancien organisateur syndical. Les principaux acteurs sont Ferenc Puskas, Sandor Kocsis, Nandor Hidegkuti, Zoltan Czibor, Jozsef Bozsik et Gyula Grosics. Sebes a mis en place un programme de conditionnement physique scientifique, une flexibilité tactique et une exigence de polyvalence de la part de tous ses joueurs. Cela permet à l'équipe de jouer un jeu beaucoup plus dynamique qui excite les foules et remporte les matchs. L'équipe a dominé certaines des puissances traditionnelles du football, notamment une victoire éclatante contre l'Angleterre à domicile. Leurs victoires sont saluées par le gouvernement comme un exemple de la supériorité de l'homme socialiste. Chez les Hongrois, ces victoires encouragent la fierté nationale, ce qui inquiète légèrement certains communistes radicaux."
 Nagy.1.d:0 "Imre Nagy, membre du Politburo et ancien président de l'Assemblée nationale, a été récemment nommé Premier ministre de Hongrie. Vétéran de la Première Guerre mondiale, il a combattu pour les Rouges pendant la Révolution russe et s'est finalement installé pendant un certain temps à Moscou. Il est retourné en Hongrie après la Seconde Guerre mondiale et est considéré comme un partenaire fiable pour Matyas Rakosi. Il a contribué à la signature de plusieurs ordres d'arrestation lors de la récente purge, démontrant ainsi sa loyauté envers Rakosi. Moscou se réjouira également de la nomination d'un homme qui fut un informateur majeur du NKVD lors de son séjour à Moscou. Cependant, certaines rumeurs circulent concernant les tendances nationalistes de Nagy, même si cela semble avoir dissuadé sa nomination."
 SOV_HUN.1.d:0 "Le gouvernement hongrois a demandé l'approbation de ses récentes réformes dans le cadre de la campagne Nouveau cap pour le socialisme menée par le Premier ministre Imre Nagy. Depuis sa nomination, Nagy a lancé une série de mesures destinées à réduire les pouvoirs coercitifs du gouvernement. Il appelle cela une « nouvelle voie » et cela a entraîné la libération de prisonniers politiques et des réformes juridiques. Ces actions ont valu à Nagy la popularité parmi la population, mais se heurtent à une opposition au sein du parti. De nombreux communistes hongrois pensent que ces pouvoirs et actions coercitifs sont ce qui soutient l'État et sont essentiels à la transformation socialiste de la Hongrie. Ils craignent que les réformes de Nagy affaiblissent l'État, soient doctrinalement opposées au modèle soviétique et puissent provoquer des troubles. Ce sont certes des considérations importantes, mais il convient de noter que les réformes ont amélioré les relations entre le peuple et l'État, ce qui pourrait s'avérer vital dans les années à venir."
 SOV_HUN.2.d:0 "Le gouvernement soviétique a répondu positivement à notre demande d'approbation des récentes réformes. Cette adhésion de Moscou au nouveau socialisme du Premier ministre Imre Nagy fera taire les partisans de la ligne dure au sein du parti et nous permettra d'étendre la campagne de libéralisation. Le Premier ministre Nagy a répondu que cette approbation permettrait au gouvernement de lancer plus ouvertement et plus efficacement les politiques souhaitées par le peuple hongrois et de l'aider à affirmer sa volonté à travers un gouvernement dédié au peuple. Avec la bénédiction soviétique, il est très difficile pour l'opposition au sein du Parti communiste hongrois de défier ouvertement Nagy."
 SOV_HUN.3.d:0 "[SOV.GetNameDef] ont fermement condamné les réformes initiées par le Premier ministre [HUN.GetLeader] Ils ont déclaré que les réformes allaient à l'encontre de la doctrine, s'adressaient aux contre-révolutionnaires et permettraient aux puissances extérieures de saper l'État hongrois. La forte opposition soviétique aux réformes fut un coup dur pour le Premier ministre. L'opposition au sein du Parti communiste hongrois a alors réussi à rallier les neutres et il semble désormais que le gouvernement des [HUN.GetLeader] soit sur le point de prendre fin. En raison de la forte condamnation de Moscou, lorsque Nagy sera démis de ses fonctions, il sera probablement démis de ses fonctions de direction au sein du parti hongrois. Même s'il s'agit d'une victoire pour les partisans de la ligne dure, de nombreux Hongrois seront déçus par la destitution du leader populaire."
 Kadar.5.d:0 "Le Premier ministre Imre Nagy, dans le cadre de ses efforts visant à réformer certains des éléments les plus coercitifs de l'État hongrois, a libéré plusieurs prisonniers politiques éminents, dont Janos Kadar. Kadar était une étoile montante du parti avant d'être purgé et condamné lors d'un procès-spectacle pour sa prétendue opposition à Staline et à Matyas Rakosi. Depuis qu'il a été libéré de prison et réhabilité, Kadar a accepté un poste de secrétaire du parti pour un secteur industriel de Budapest. Il montre déjà ses compétences d'opérateur politique en recrutant des travailleurs et en se forgeant parmi eux une solide clientèle. Beaucoup dans le pays s'attendent à ce que Kadar retrouve bientôt l'importance qu'il avait avant son arrestation."
 Rakosi.1.d:0 "L'ancien homme fort hongrois et ardent stalinien Matyas Rakosi a été exclu de tout poste de direction. Son appareil d'État oppressif, ses purges et son culte de la personnalité l'ont longtemps éloigné non seulement du peuple hongrois, mais aussi des dirigeants communistes de son propre parti et de l'Union soviétique. Il est considéré comme une relique d'une époque antérieure dont les États socialistes tentent d'évoluer et d'apprendre. Durant la révolution hongroise, ses propres partisans et successeurs se sont révélés largement inefficaces et déconnectés, confirmant que Rakosi n'a pas sa place dans l'avenir de la Hongrie."
 Hungarian_Collectivized.1.d:0 "Même si les premières tentatives de collectivisation agricole en Hongrie se sont soldées par un échec, la tentative la plus récente s'est révélée être un grand succès. Le gouvernement hongrois a annoncé que plus de quatre-vingt-dix pour cent des terres agricoles appartenaient à des fermes collectives. Le gouvernement affirme que son succès est dû aux réformes et à son engagement en faveur d'une approche socialiste appropriée sur cette question. Les analystes notent que les derniers efforts étaient beaucoup plus graduels et ne reposaient pas sur la coercition pour forcer la collectivisation. L'état d'oppression dans les efforts antérieurs a également étouffé l'innovation et les discussions ouvertes, ce qui a également entravé ces tentatives. Le gouvernement a félicité les agences d'État et les paysans pour avoir réalisé la collectivisation et a promis une croissance et une prospérité agricoles futures."

 #News Event
 Hungary_Anti_Semitic.1.d:0 "L'antisémitisme et l'antisionisme augmentent parmi les Hongrois. À première vue, cela semble étrange étant donné que le régime communiste a longtemps lié les tropes antisémites traditionnels au régime fasciste de Miklos Horthy. L'Union soviétique a longtemps soutenu que tous les peuples avaient été victimes du fascisme lors de la dernière guerre ; ceux qui mettent l'accent sur les souffrances des Juifs pendant l'Holocauste sont considérés comme des nationalistes agissant contre l'unité socialiste. La Hongrie a suivi cet exemple et a réprimé les informations concernant l'Holocauste dans le pays et tous les militants pour la réhabilitation des victimes juives sont également pris pour cible. Le sionisme est également accusé d'encourager le nationalisme et la division, et ces partisans sont également réprimés par le gouvernement hongrois."
 Wallenberg.1.d:0 "Une série de procès ont eu lieu concernant la mystérieuse disparition et la mort présumée de Raoul Wallenberg. Wallenberg était un diplomate et architecte suédois qui a joué un rôle majeur dans l'organisation du sauvetage de milliers de Juifs hongrois en leur fournissant un refuge et des passeports de protection. Après la libération de Budapest par les forces soviétiques, Wallenberg a disparu et beaucoup suggèrent qu'il est mort sous la garde des Soviétiques. Cependant, le gouvernement hongrois a lancé des procès pour prouver que Wallenberg n'avait pas été assassiné par les Soviétiques. Au lieu de cela, les procès ont montré que c'était un groupe de Juifs de Budapest et d'anciens membres du régime fasciste qui avait commis le meurtre de Wallenberg. Tous les suspects ont été condamnés au cours des procès, même si de nombreux observateurs internationaux les ont qualifiés de victimes de procès-spectacles. Beaucoup estiment que ces procès étaient un moyen pratique pour le régime communiste de minimiser toute implication soviétique et de blâmer les fascistes et la communauté juive hongroise, deux groupes actuellement ciblés par l'État."
 Kadar.2.d:0 "Le haut dirigeant communiste Janos Kadar a été nommé secrétaire général du Parti communiste hongrois. Kadar, tout au long de sa carrière, a montré son habileté à convertir les partisans du parti et à organiser les travailleurs. Cette capacité fait de lui une figure influente. Avec Matyas Rakosi et sa clique discrédités, Kadar est un leader idéal pour le peuple hongrois et le gouvernement soviétique. Même s'il apparaît publiquement très fidèle au parti hongrois, il entretient de bonnes relations avec les Soviétiques. Plus important encore, il croit en l'ordre soviétique et ils lui font confiance pour veiller à ce que la Hongrie reste un partenaire fidèle dans l'ordre socialiste mondial."
 Nagy_Executed.1.d:0 "Dans une annonce surprise, le gouvernement hongrois a annoncé que l'ancien Premier ministre Imre Nagy avait été exécuté après avoir été reconnu coupable par un tribunal hongrois. Il avait gardé le procès et la sentence secrets du public, ne les annonçant qu'après l'exécution de la sentence. Le gouvernement craignait un tollé public et international. Nagy a été reconnu coupable de trahison et de tentative de renversement de l'État hongrois. Le gouvernement a refusé d'autoriser tout accès à la tombe et aucun tollé général n'a eu lieu. Cela est dû au déploiement de personnel de sécurité et à la politique de tolérance zéro du gouvernement actuel. En tant que Premier ministre, Imre Nagy a cherché à libéraliser la société, à rétablir la démocratie et à atteindre la neutralité hongroise, mais ses efforts ont échoué après l'invasion de l'Union soviétique pour restaurer le régime communiste. La déclaration de l'exécution est considérée dans toute la sphère soviétique comme un avertissement aux dirigeants de ce qui les attend s'ils n'obéissent pas à Moscou."


 cam.1.d:0 "Le roi Norodom Sihanouk a décidé de dissoudre l'Assemblée nationale dirigée par le Premier ministre Yem Samaur. Quelques mois plus tôt, le Premier ministre Penn Nouth était confronté à des attaques croissantes de la part de l'opposition concernant la montée de la corruption et les problèmes économiques au Cambodge. Il avait été remplacé par Yem Samaur, ancien membre du Parti démocrate et homme proche de la famille royale et des élites traditionnelles. Le Parti démocrate a alors fait pression sur le roi pour qu'il dissout l'assemblée. Craignant que le Parti démocrate ne cherche à mobiliser ses partisans dans la rue, le roi a accepté. L'Assemblée nationale étant dissoute, le Cambodge sera dirigé par décret royal jusqu'à la tenue de nouvelles élections. Beaucoup dans le pays espèrent qu'une nouvelle Assemblée nationale reflétera mieux la population et garantira une gouvernance plus stable à l'avenir."
 CAM_Recognition.2.d:0 "Le roi Norodom Sihanouk reconnaît de plus en plus que le contrôle continu de la France sur les ministères et les politiques cambodgiens a conduit à un sentiment anti-français généralisé dans le pays. Cela a conduit à des critiques à l'encontre de la monarchie et du gouvernement, accusés de complicité avec la présence française au Cambodge. Le roi s'est récemment rendu en France et a demandé une indépendance totale. Le gouvernement français refusa et, en réponse, le roi entreprit une tournée internationale aux États-Unis et au Canada. Il a défendu l'indépendance du Cambodge comme le meilleur moyen de combattre l'influence communiste dans la région auprès d'un public réceptif. À son retour au Cambodge, le roi a organisé des rassemblements publics massifs pour l'indépendance et a béni la formation d'une nouvelle milice pour lutter pour l'indépendance. Il avait également refusé de retourner dans la capitale, mais les Français ont récemment restitué plusieurs ministères au gouvernement et ont accepté de discuter prochainement de l'indépendance du Cambodge."
 CAM_Exile.1.d:0 "Suite au coup d'État dramatique mené par Lon Nol et aux émeutes anti-vietnamiennes au Cambodge, le prince Norodom Sihanouk a décidé de rester à l'étranger et de ne pas rentrer au pays. L'ancien roi, dans une émission de radio, a accusé le nouveau gouvernement de voler le pouvoir et a exhorté les Cambodgiens à se soulever contre le nouveau régime. Le prince Sihanouk devrait rester auprès des gouvernements amis proches du Cambodge et organiser le soutien international au retour de son gouvernement. Il organise également un gouvernement en exil et tentera probablement également de mobiliser des combattants armés pour rétablir son pouvoir. Bien que sa première émission ait suscité des protestations dans la capitale, pour le moment, le nouveau gouvernement semble fermement au pouvoir, mais Sihanouk semble déterminé à rassembler les forces pour mettre fin au nouveau gouvernement et restaurer son pouvoir."
 CAM_Exile.2.d:0 "Le prince Norodom Sihanouk est rentré aujourd'hui au Cambodge pour reprendre ses responsabilités cérémonielles en tant que chef de l'État. Le nouveau gouvernement au pouvoir au Cambodge lui a récemment proposé ce poste et a appelé l'ancien roi à revenir de son exil. Le prince Sihanouk a remercié le nouveau gouvernement et le peuple cambodgien d'avoir travaillé avec lui pour mettre fin au régime précédent de Lon Nol. La plupart des Cambodgiens, quelles que soient leurs opinions politiques, considèrent la monarchie comme une institution vitale pour la stabilité et l'ordre du pays. Ils saluent largement le retour de l'ancien monarque, même si nombreux sont ceux qui estiment qu'il devrait se limiter à son poste cérémoniel et ne pas chercher à s'engager dans la politique comme il l'a fait dans le passé. Beaucoup aimeraient voir bientôt une monarchie cérémoniale officiellement restaurée avec Sihanouk rétabli en tant que roi."
 Rep_Cam.1.d:0 "Le prince Norodom Sihanouk a été informé que le gouverneur Chhuon préparait un coup d'État contre le gouvernement. Les détails étaient obscurs et le prince décida d'attendre pour découvrir plus d'informations. Cela a fini par être une erreur puisque les conspirateurs ont découvert le nouveau prince et ont immédiatement agi. Les combattants Khmer Serei ont organisé un soulèvement dans le nord-est. Le prince envoya des troupes pour la réprimer, mais celles-ci se révélèrent inefficaces. Cela a accru la tension et le malaise dans la capitale. Lorsque le prince a tenté d'ordonner à davantage de troupes d'entrer, les militaires se sont retournés contre le prince pour son incapacité à maintenir l'ordre. Après avoir sécurisé les institutions gouvernementales et les hommes politiques clés, l'armée a annoncé qu'un nouveau gouvernement, composé de nombreux anticommunistes, prendrait le relais. Le nouveau gouvernement alors proclamé, le Cambodge sera désormais connu sous le nom de République du Cambodge et son peuple ne sera plus les pions des étrangers communistes ou un monarque distant."
 Assasination_Nop.1.d:0 "Nop Bophann, rédacteur en chef d'un journal et représentant du Front uni Issarak, a été brutalement abattu dans la capitale, à proximité de la principale caserne militaire. Le Front uni Issarak était un groupe de résistance cambodgien de gauche anticolonial qui avait mené la guerre contre les autorités coloniales françaises. L'assassinat a provoqué la colère de nombreux partisans de gauche et communistes à travers le pays. Cela exerce une pression énorme sur le gouvernement cambodgien qui tente de maintenir un équilibre avec les factions communistes et anticommunistes opérant dans le pays. Beaucoup craignent que l'assassinat ait été ordonné par des officiers militaires anticommunistes qui cherchent à déstabiliser la situation et à forcer le gouvernement à agir contre les communistes en provoquant une réponse de gauche. Cependant, les partisans des factions anticommunistes notent qu'il pourrait s'agir d'un complot communiste visant à les piéger et à forcer le gouvernement à sévir contre leurs partisans. L'assassinat a suscité l'instabilité et les tensions à travers le pays."
 VIN_CAM.1.d:0 "De hauts représentants de la République du Vietnam et du Cambodge ont récemment signé un traité de défense mutuelle. L'accord engage les deux voisins à se protéger et à s'entraider contre les menaces extérieures. Beaucoup considèrent le traité comme un défi direct au Nord-Vietnam communiste, accusé de fomenter des troubles et de déployer des troupes dans ces États. En effet, un porte-parole du Nord-Vietnam a souligné que cet accord était l'un des deux régimes fantoches qui tentaient désespérément de garantir que leurs régimes illégaux restent au pouvoir malgré les souhaits et les désirs du peuple. Cependant, le Cambodge et le Sud-Vietnam insistent sur le fait qu'ils ne sont pas dérangés par cette réaction et que ce traité reflète les intérêts communs et les liens historiques qui unissent les deux nations."
 Bangkok_Coup.5.d:0 "Le prince Norodom Sihanouk a été informé que le gouverneur Chhuon était l'un des principaux conspirateurs du complot contre son gouvernement. Le prince Sihanouk décide d'agir immédiatement et déploie un bataillon de troupes pour arrêter Chhuon. Chhuon a finalement été capturé par les troupes qui ont également arrêté un citoyen américain travaillant avec Chhuon. Lors d'un interrogatoire militaire, Chhuon a commencé à avouer mais est décédé rapidement. Il n'a pas révélé tous les co-conspirateurs et le prince soupçonne que Chhuon n'a pas survécu à l'interrogatoire parce que les chefs militaires ne voulaient pas être impliqués. Le prince sait que les Khmers Serei étaient censés être la force militaire chargée de mettre en oeuvre le complot et qu'ils travaillaient avec des politiciens anticommunistes. Eux et les Khmers Serei seront désormais étroitement surveillés. Les relations avec la Thaïlande se détérioreront car ils soutiennent les Khmers Serei et Sihanouk a déposé une protestation auprès des États-Unis contre le fait que leur citoyen ait été surpris en train de collaborer avec Chhuon."
 
 Bangkok_Coup.1.d:0 "Depuis la fin de la Seconde Guerre mondiale, le gouvernement cambodgien, dirigé par l'ancien roi, le prince Norodom Sihanouk, a du mal à équilibrer ses relations avec les communistes, les anticommunistes et les élites traditionnelles. Cela a frustré beaucoup de gens et ceux de droite, travaillant en étroite collaboration avec des agents de renseignement thaïlandais et, selon certains, même avec les États-Unis, envisagent d'agir pour destituer le prince Sihanouk. Ils veulent remplacer le prince et établir un régime fermement anticommuniste pour protéger le Cambodge de l'empiètement communiste, en particulier de la part de ses voisins. L'ancien conseiller royal Sam Sary, en collaboration avec le puissant commandant de la milice nationaliste Son Ngc Thanh et le gouverneur Dap Chhuon, envisagent d'utiliser la milice, les Khmer Serei, pour déclencher une révolte dans le nord-est. Du chaos, ils prendraient ensuite le pouvoir avec l'aide de leurs alliés dans la capitale. Sary et Thanh sont prêts à passer à l'action et mettent l'intrigue en action..."
 Bangkok_Coup.2.d:0 "Le prince Norodom Sihanouk a été informé que des combattants militants s'étaient révoltés dans le nord-est. Il ne savait pas que cette force était en fait des combattants Khmer Serei qui aidaient à la tentative de coup d'État en semant des troubles. Le prince envisagea initialement d'envoyer une force immédiate pour apaiser les troubles, mais il choisit d'abord de s'adresser à la nation. Il a appelé les citoyens à s'unir contre la menace qui pèse sur le Cambodge et a complété la force militaire par des miliciens locaux. Cela s'est avéré décisif puisqu'ils ont découvert les combattants Khmer Serei et les ont rapidement reconduits vers leurs bases. Les putschistes espéraient que la révolte organisée semerait la panique et forcerait la population et l'armée à perdre confiance dans le prince, facilitant ainsi le coup d'État, mais le prince Sihanouk est resté au pouvoir. Désespérés, certains officiers militaires impliqués dans le complot ont tenté de lancer un coup d'État, mais ils ont échoué et au cours de leur interrogatoire, tous les détails et les participants ont été révélés. Des arrestations et des détentions massives devraient suivre."


 #Soviet Khrushchev
 destalinization.0.d:0 "L'accession de Nikita Khrouchtchev au poste de secrétaire général de l'Union soviétique a marqué le début d'une nouvelle ère. Khrouchtchev a rapidement décidé qu'il devait assouplir la répression, le contrôle et la politique étrangère agressive de l'ère stalinienne. Khrouchtchev est en mesure de se lancer dans ce projet ambitieux de transformation de la société soviétique grâce à sa capacité à s'allier avec des factions puissantes et à placer des partisans fidèles dans tout le système soviétique. Son passé de paysan contribue également à sa crédibilité. Cependant, alors que Khrouchtchev s'efforce de défaire les pires aspects du régime précédent, il devra faire face à des rivaux ambitieux et à des staliniens convaincus qui n'apprécient pas cette campagne d'ouverture, notamment envers les ennemis de l'État. Khrouchtchev estime qu'une ère de déstalinisation revitaliserait l'Union soviétique dans sa lutte contre le monde capitaliste."
 Khruschev.100.d:0 "Après la mort de Joseph Staline, Nikita Khrouchtchev a pu mobiliser ses partisans plus efficacement que ses rivaux et assurer le pouvoir. Grâce à une alliance avec de hauts commandants de l'Armée rouge et à la nomination de jeunes protégés à des postes clés, Khrouchtchev a déjoué les extrémistes conservateurs du cercle restreint de Staline. Des staliniens éminents comme Lavrenti Beria ont été purgés tandis que d'autres ont été mis à l'arrière-plan avant d'être lentement poussés à la retraite. Pour remplacer ces hommes, Khrouchtchev a commencé à promouvoir des hommes jeunes et ambitieux qui partagent sa vision de la société soviétique. Bien que ces hommes puissent s'avérer un défi à l'avenir, Khrouchtchev réussit actuellement à éliminer les partisans de la ligne dure et la puissante vieille garde avec un cadre de partisans plus jeunes et plus fidèles qui seront dans des années avant de le défier."
 Lysenko.1.d:0 "Pendant des décennies, les théories agricoles et biologiques de Trofim Lyssenko ont été les seules théories acceptables sur le développement agricole. Ces théories, appelées lysenkoïsme, condamnaient les généticiens et les méthodes agricoles plus scientifiques comme étant capitalistes et incorrectes. Il rejetait le concept de sélection naturelle et l'idée du gène. Avec l'approbation de Staline, les partisans de Lyssenko ont arrêté des milliers de biologistes et de généticiens. Toute critique de son travail était condamnée et passible d'arrestation. Cependant, ces dernières années, le gouvernement soviétique, après la mort de Staline, a mis fin à son soutien à Lysenko et désormais les publications, y compris celles associées à l'État, condamnent ouvertement le lyssenkisme. Ce changement est attribué au nouvel assouplissement des lois sur la censure et de nombreuses universités ramènent désormais les agronomes scientifiques et déclassent ou suppriment le lysenkoïsme du programme."
 destalinization.1.d:0 "Dans un discours devant le Comité central, Nikita Khrouchtchev a condamné ce qui s'est passé lors de l'affaire de Léningrad. L'affaire de Léningrad était une purge des principaux responsables soviétiques de Léningrad par Staline et ses services de sécurité. À l'époque, cela avait été présenté au peuple soviétique comme un complot des autorités de Léningrad visant à prendre le pouvoir. Khrouchtchev, dans ses remarques, a noté que les accusations portées contre les responsables soviétiques de Leningrad étaient soit truquées, soit fabriquées de toutes pièces par Lavrenti Beria sous la direction de Joseph Staline. Il a appelé à la réhabilitation des victimes survivantes de l'affaire de Léningrad et a critiqué dans ses remarques plusieurs staliniens puissants du Comité central. Khrouchtchev a non seulement mis en lumière les victimes d'une fausse purge menée par Staline, mais en impliquant les staliniens encore présents au Comité, y compris son rival Malenkov, il les a affaiblis et a renforcé sa propre position."
 VLC.1.d:0 "Le secteur agricole de l'Union soviétique est depuis longtemps un sujet de préoccupation pour le gouvernement. Sous Staline, la collectivisation forcée cherchait à maintenir les paysans sur la terre, mais cette politique dure conduisait souvent à des rendements décevants, à de lourdes pertes en vies humaines et au mécontentement des paysans. Le régime de Nikita Khrouchtchev a décidé d'un projet ambitieux, appelé Campagne des Terres Vierges, visant à accroître considérablement la productivité agricole soviétique en cultivant des millions d'hectares de terres auparavant incultes. Ces terres proposées sont situées à l'est de la Volga jusqu'à la Sibérie occidentale. En outre, Khrouchtchev développera ses politiques de réforme agricole pour encourager la productivité et améliorer les conditions des agriculteurs. Ce plan ambitieux a des détracteurs préoccupés par les coûts et la faisabilité, mais Khrouchtchev ne se laissera pas dissuader de son objectif de mener une révolution agricole. Le gouvernement a lancé une campagne de propagande agressive visant à inciter les jeunes citoyens soviétiques à s'installer sur ces terres par devoir patriotique. Jusqu'à présent, la réponse a été très positive."
 destalinization.2.d:0 "Le nouveau dirigeant soviétique, Nikita Khrouchtchev, cherche à consolider son pouvoir et à mettre fin à ce qu'il considère comme la politique destructrice de l'ère stalinienne. Dans le cadre de cet effort, Khrouchtchev a ordonné la libération de millions de prisonniers politiques des redoutables prisons du Goulag. Khrouchtchev a noté que bon nombre des condamnés avaient été envoyés pour des délits très mineurs ou avaient purgé leur peine mais n'avaient pas été libérés. La nouvelle a été bien accueillie dans toute l'Union soviétique, notamment de la part des membres du parti, dont beaucoup ont des amis ou des membres de leur famille qui ont été envoyés dans ces camps sur ordre de Staline. D'un point de vue plus pratique, le nombre de prisonniers avait atteint des niveaux dangereusement élevés et de nombreux rapports faisant état d'émeutes ou de soulèvements de prisonniers parvenaient à Moscou. Khrouchtchev espère atténuer ces troubles potentiels et gagner le crédit politique de nombreux membres de l'Union soviétique qui applaudissent cette action."
 Sov_Missle.1.d:0 "Alors que l'Union soviétique développe son arsenal nucléaire et ses vecteurs, le ministère de la Défense a décidé de créer une Force de missiles stratégiques (SMF) en tant que branche militaire de l'Union soviétique. Le SMF supervisera tous les missiles balistiques soviétiques, leur organisation, leur positionnement et testera également de nouveaux systèmes de fusées. De nouvelles formations devraient être organisées au sein de la SMF et les Soviétiques espèrent que cette branche rationalisera le développement, la production et le déploiement de missiles. Cette nouvelle branche militaire reflète l'importance croissante des armes militaires stratégiques et l'importance de ces moyens. Au niveau international, le SMF sera scruté de près en tant que modèle sur la manière dont d'autres pays dotés de tels systèmes d'armes pourraient les organiser par semaine."
 Baikonur.1.d:0 "À mesure que l'Union soviétique étend son programme de missiles balistiques et s'engage dans le développement de nouveaux systèmes, le besoin d'un côté test et lancement s'est accru. Pour répondre à ce besoin, le gouvernement soviétique a ouvert un nouveau site d'essais et de lancement de fusées dans le sud du Kazakhstan, appelé cosmodrome de Baïkonour. L'installation massive (couvrant 90 km) a nécessité la construction de nouvelles infrastructures et d'une nouvelle ville pour accueillir le personnel requis. Plus important encore, à mesure que l'installation entre en service, les Soviétiques ont également désigné le site comme principal port spatial de l'Union soviétique. La technologie et les fusées destinées au programme spatial seront également développées et lancées depuis l'installation. L'installation est située à proximité de l'équateur et ses conditions météorologiques seraient idéales pour les futurs lancements de fusées et spatiaux. L'installation est maintenue sous haute sécurité et secret pour protéger les développements aérospatiaux et de fusées soviétiques des puissances étrangères hostiles."
 KGB.1.d:0 "Le gouvernement soviétique avait décidé de réorganiser ses agences de renseignement et avait créé le Comité pour la sécurité de l'État, ou KGB. Dans le passé, les dirigeants du renseignement soviétique ont consolidé un pouvoir excessif qui a parfois menacé l'État soviétique. Cette nouvelle organisation devrait empêcher l'accumulation de pouvoir et rationaliser les opérations de renseignement non seulement nationales mais aussi étrangères. Différents types de services de renseignement et de régions seront dirigés par des directions individuelles qui répondront toutes au président. Cette configuration structurelle empêchera un responsable de consolider son pouvoir et améliorera l'efficacité de la collecte de renseignements. L'organisation agit en tant que successeur du NKVD, un succès de la Seconde Guerre mondiale, et devrait jouer un rôle majeur dans la sécurisation du régime communiste et dans le soutien des efforts communistes à travers le monde."
 SOV_COL.1.d:0 "Les paysans colombiens, longtemps opprimés, ont récemment commencé à s'organiser contre l'exploitation capitaliste. Leur organisation s'appelle les Forces armées révolutionnaires de Colombie ou FARC. Les FARC ont lancé une lutte armée en réponse à l'exploitation mais aussi à la répression politique en Colombie qui a réduit au silence les populistes et les socialistes par la violence. Les services de renseignement soviétiques estiment que l'organisation a du potentiel et adhèrent aux valeurs socialistes. C'est dans cette optique que l'Union soviétique a décidé d'envoyer une aide militaire aux FARC et de les aider dans leur lutte. L'aide soviétique égalisera les chances et aidera les paysans à se défendre contre l'État colombien capitaliste et violent. L'expansion de l'influence soviétique en Colombie permettra également aux Soviétiques de projeter leur puissance dans l'hémisphère occidental."
 SOV_ALG.1.d:0 "Les Français ont longtemps exploité et maltraité le peuple algérien avec leur projet colonial. Aujourd'hui, les Algériens ripostent avec leur organisation, le Front de Libération Nationale ou FLN. Le FLN organise les paysans et autres personnes exploitées et les mène dans une lutte armée contre une armée française violente soutenue par des collaborateurs locaux. Le FLN promet un nouveau régime de socialisme et d'égalité économique pour l'Algérie. Pour faciliter cet effort, l'Union soviétique a accepté de commencer à offrir son aide au FLN. Le soutien soviétique sera crucial pour aider les Algériens à résister à l'armée française moderne. Plus important encore pour les Soviétiques, saper la domination française et obtenir le soutien de l'Algérie pourraient s'avérer vitaux à long terme. Plus important encore, l'aide au FLN confirme chez les Soviétiques leur opposition de longue date à l'impérialisme et à son exploitation des peuples colonisés."
 SovFlySub.1.d:0 "À la fin des années 1930, la marine soviétique a exploré l'idée de concevoir et de tester un avion qui pourrait ensuite s'immerger. C'est ce qu'on a appelé le programme de sous-marins volants. Il était dirigé par l'ingénieur Boris Ouchakov et, bien que le programme ait bénéficié d'un soutien précoce, il a été abandonné avant 1940, la Marine ayant conclu que l'avion proposé était irréalisable. Cependant, les Soviétiques, sous la direction de Lavrenti Beria, ont relancé le programme après la fin de la guerre. Les Soviétiques ont récemment construit un avion d'essai et les résultats sont en cours d'évaluation. Idéalement, le sous-marin volant pourrait potentiellement jouer un rôle en ciblant les navires ennemis vitaux. Cependant, il semble que le problème de l'avion soit son poids. Plus important encore, à mesure que les ennemis de Beria prennent de plus en plus d'importance au sein de la direction soviétique, il semble peu probable qu'ils poursuivent le programme qu'il a lancé."
 TU_114.1.d:0 "Lors de la récente Exposition universelle de Bruxelles, les Soviétiques ont dévoilé une nouvelle compagnie aérienne de passagers, la TU-114. Cet avion de ligne massif est capable d'effectuer des vols transocéaniques, dispose de couchettes pour les passagers et est l'avion à hélices le plus rapide de l'histoire, capable d'égaler les vitesses des avions de ligne à réaction. Le Premier ministre soviétique Nikita Khrouchtchev, désireux de présenter cette brillante technologie soviétique, a décidé de faire voler l'avion lors de sa visite aux États-Unis. Même si, en privé, de hauts responsables soviétiques craignaient de faire confiance à un avion encore en développement, Khrouchtchev a insisté pour le prendre. À son arrivée, de nombreux journalistes internationaux ont été impressionnés par sa taille et ses capacités, affirmant qu'il était supérieur à n'importe quel avion de ligne occidental actuellement sur le marché. Le vol du TU-114 s'est avéré être un succès majeur pour Khrouchtchev et sa campagne visant à présenter au monde l'ingéniosité soviétique."
 Khruschev_Agri.1.d:0 "Le Premier ministre soviétique Nikita Khrouchtchev est issu d'un milieu paysan et considère la révolution agricole comme l'un de ses principaux objectifs. Cependant, il a choisi d'ignorer les conseils des principaux agriculteurs, dont beaucoup ont déclaré que le gouvernement devait investir massivement dans l'agriculture et écouter Trofim Lysenko. Lyssenko, l'un des favoris de Staline, a promis de créer une croissance agricole record avec des investissements limités. Les méthodes de Lyssenko rejettent les méthodes scientifiques modernes, notamment celles des généticiens et des botanistes. Khrouchtchev, comme Staline, croit à ses arguments. Cependant, contrairement à Staline, Khrouchtchev n'a pas purgé ni arrêté ceux qui s'opposent à Lyssenko et a permis aux scientifiques de le critiquer ouvertement. Cependant, malgré les critiques scientifiques et l'absence de résultats par rapport aux promesses de Lyssenko, Khrouchtchev continue de s'appuyer sur le maintien de ses méthodes traditionnelles d'agriculture soviétique."
 cpsu.20.d:0 "Le vingtième Congrès du Parti communiste de l'Union soviétique s'est terminé après plus de dix jours de réunions. Il s'agit de la première conférence organisée sous la direction du Premier ministre soviétique Nikita Khrouchtchev et il a choisi de faire du Congrès une condamnation des purges et de la violence de l'ère stalinienne. Khrouchtchev, le dernier jour du Congrès, l'a exposé dans un discours secret intitulé Du culte de la personnalité et de ses conséquences. Dans son discours, Khrouchtchev a accusé Staline d'avoir un culte de la personnalité et a critiqué ses purges pour des menaces imaginaires. Le discours impliquait également de hauts responsables soviétiques de l'époque qui avaient contribué à aider Staline à mener à bien ses purges. La réaction au discours a été mitigée, beaucoup félicitent Khrouchtchev pour avoir dit la vérité tandis que de nombreux partisans de la ligne dure ou fidèles à Staline, le dirigeant soviétique couronné de succès en temps de guerre, ont accusé Khrouchtchev de révisionnisme. On s'attend à ce que la nouvelle de ce discours ébranle profondément le monde communiste."
 Doctors_Plot.10.d:0 "Lors de son discours condamnant les purges de l'ère stalinienne, le Premier ministre soviétique Nikita Khrouchtchev a révélé que la fameuse purge des médecins survenue peu avant la mort de Staline était en réalité basée sur des preuves fabriquées de toutes pièces. Il a déclaré que les médecins étaient innocents et n'avaient été sauvés que par la mort de Staline. Khrouchtchev a déclaré que Staline avait demandé au juge chargé de l'affaire de prononcer des verdicts de culpabilité et de battre les médecins pour de faux aveux. Plus important encore, Khrouchtchev a lié le complot à l'antisémitisme de Staline, le complot fabriqué étant la première étape d'une purge à l'échelle du parti. Les révélations de Khrouchtchev en ont stupéfié plus d'un, car la presse, sous la direction de Staline, avait fait de cette affaire un sujet majeur dans tout le pays. Les critiques de Khrouchtchev notent qu'il était un membre important à cette époque et qu'il se contentait du complot. Ils suggèrent qu'il ne s'exprime maintenant que pour renforcer sa position politique."
 APG_Fail.1.d:0 "Suite à la dénonciation publique de Staline par le Premier ministre soviétique Nikita Khrouchtchev, il a provoqué beaucoup de colère de la part des responsables de l'ère stalinienne et d'autres personnes qui considèrent Khrouchtchev comme hypocrite compte tenu de sa position élevée lors des purges qu'il a critiquées. Une faction de ces hommes a formé une cabale qui comprenait, entre autres, Gregory Malenkov, Vyacheslav Molotov, Lazar Kaganovich, Dmitri Shepilov. Le groupe a tenté de destituer Khrouchtchev lors d'une réunion dramatique du Comité central au cours de laquelle Khrouchtchev a qualifié le groupe de Groupe anti-parti. Avant le vote, le ministre soviétique de la Défense et le héros de guerre, le général Gueorgui Joukov, ont menacé de détruire le groupe anti-parti même si leur vote était couronné de succès en raison de leurs crimes sous Staline. Cependant, le vote a échoué et Khrouchtchev a dû décider où rétrograder les membres du groupe anti-parti."
 KhruschevRel.1.d:0 "Né paysan, le Premier ministre soviétique Nikita Khrouchtchev a toujours considéré la religion avec méfiance. Il souscrivait profondément à la critique marxiste de la religion et la considérait comme une menace majeure pour l'illumination et le développement socialiste du peuple. Khrouchtchev a considéré la levée des restrictions religieuses pendant la Seconde Guerre mondiale comme une erreur et, après avoir pris le pouvoir, a lancé une nouvelle vague de répression contre l'Église orthodoxe russe. De nombreuses églises sont fermées, les participants aux services religieux sont enregistrés, les parents sont limités quant à la religion qu'ils peuvent enseigner à leurs enfants et les enfants n'ont pas le droit d'assister aux services religieux. En plus de ces nouvelles restrictions, les prêtres qui enfreignent l'une des réglementations sont rapidement arrêtés tandis que ceux qui expriment leurs plaintes sont également confrontés à des questions ou à une détention par l'État."
 KhruschevRel.2.d:0 "Dans le cadre de la campagne antireligieuse du Premier ministre soviétique Nikita Khrouchtchev, le gouvernement soviétique ferme un nombre record de monastères russes. Tous les membres qui se plaignent ou n'obéissent pas aux ordres de fermeture sont arrêtés et poursuivis par l'État pour avoir désobéi à la loi. En outre, les nouvelles réglementations interdisent les pèlerinages, ce qui a frappé certains des monastères les plus populaires. Ces fermetures s'inscrivent dans le cadre d'une répression plus large contre l'Église orthodoxe russe. Des sources au sein du gouvernement indiquent que le gouvernement soviétique envisage peut-être de fermer les deux tiers des églises existantes depuis l'arrivée au pouvoir de Khrouchtchev. Le gouvernement déclare qu'il ne fait qu'appliquer des lois déjà établies et souligne que l'Église a des contacts avec des groupes étrangers et peut agir pour saper l'Union soviétique de l'intérieur."
 APG_Fail.2.d:0 "Lazar Kaganovitch et Dmitri Shepilov étaient tous deux des membres importants du parti impliqués dans la récente tentative de destitution du Premier ministre soviétique Nikita Khrouchtchev. Ils avaient tenté de le renverser du pouvoir lors de la réunion du Comité central, mais le vote avait échoué et ils avaient été vaincus. Après avoir perdu le vote, Kaganovitch et Chepilov ont été envoyés dans de petites institutions industrielles au-delà de l'Oural en guise de punition. Ces anciens hauts responsables du parti ont vu leur statut et leur position considérablement réduits. Cependant, Khrouchtchev a souligné que s'ils avaient tenté ce qu'ils ont fait à Staline, la punition aurait été bien pire. Le temps nous dira si ces deux hommes pourront un jour se réconcilier avec Moscou ou si cela marquera la fin de leur carrière."
 APG_Fail.3.d:0 "Viatcheslav Molotov, l'un des dirigeants de la récente tentative de destitution du Premier ministre soviétique Nikita Khrouchtchev, a été nommé ambassadeur soviétique en Mongolie. C'est une punition pour son rôle dans le complot après que le Comité central a voté contre la destitution de Khrouchtchev. L'ancien ministre des Affaires étrangères de Staline et haut dirigeant soviétique de longue date a été banni et humilié par cette nomination. Khrouchtchev estime qu'il s'agit d'une juste punition pour sa tentative de renversement et a noté que sous Staline, la punition aurait été bien pire. Même si Molotov a été vaincu et que l'ère stalinienne continue d'être attaquée par le gouvernement Khrouchtchev, il reste convaincu que lui et Staline ont agi dans le meilleur intérêt du peuple soviétique."
 Khruschev_yug.1.d:0 "Les relations avec l'Union soviétique et la Yougoslavie se sont rapidement détériorées après la Seconde Guerre mondiale. Le dirigeant soviétique Joseph Staline a tenté de forcer le président yougoslave Josip Tito à obéir à ses diktats. Tito a refusé et après plusieurs lettres hostiles, les relations sont restées très froides. Cependant, le Premier ministre soviétique Nikita Khrouchtchev a fait de la réconciliation et des relations positives avec la Yougoslavie un objectif majeur de sa politique étrangère de relations plus amicales. Khrouchtchev s'est récemment rendu à Belgrade et, malgré l'hostilité initiale de Tito, une avancée décisive a été réalisée et les deux hommes ont convenu de rétablir une coopération plus étroite entre les deux États communistes. Bien que le voyage ait été un succès, des rumeurs circulent parmi d'autres partis communistes dans le monde selon lesquelles Khrouchtchev serait en train de se réconcilier avec un régime qui a fait ses preuves dans la mise en oeuvre d'un communisme libéral. Les partisans de Khrouchtchev rétorquent que l'unification de l'ensemble du monde communiste est importante pour empêcher l'exploitation capitaliste des divisions."
 sinosovietsplit.1.d:0 "Dès son arrivée au pouvoir, le Premier ministre soviétique Nikita Khrouchtchev a cherché à continuer de renforcer les liens avec le gouvernement communiste chinois. Les experts, l'aide et les armes soviétiques ont grandement aidé les Chinois dans leurs efforts de reconstruction du pays après des décennies de guerre. Cependant, ces relations ont récemment commencé à se rompre suite à la décision de Khrouchtchev de déstaliniser et de condamner publiquement son prédécesseur. En outre, les Chinois se sont opposés aux efforts soviétiques visant à améliorer les liens avec l'Occident et avec les États communistes, considérés comme incapables de mettre en oeuvre des régimes marxistes-léninistes appropriés. Cette tension a atteint son paroxysme lors d'une récente visite de Khrouchtchev en Chine, entraînant un départ anticipé du dirigeant soviétique. Cela a finalement abouti au retrait de leurs conseillers par les Soviétiques et à la dégradation des liens entre la Chine et la Chine après le récent congrès du Parti communiste roumain, au cours duquel les deux pays se sont publiquement tirés dessus. Cette scission sino-soviétique marque une division majeure dans le monde communiste et nombreux sont ceux qui craignent que l'Occident ne cherche à l'exploiter à son avantage."

 #Kuomintang
 
 #Bulgarian 1950s
 AntiRevBul.1.d:0 "La récente campagne de déstalinisation et de coopération pacifique avec les États non communistes menée par le gouvernement soviétique a provoqué une montée des critiques antirévisionnistes en Bulgarie. Les critiques de la nouvelle politique soviétique ont condamné les Soviétiques comme révisionnistes. Et une menace pour la bonne mise en oeuvre de l'idéologie marxiste-léniniste. Plus important encore, la politique de Moscou visant à promouvoir la coexistence pacifique avec les puissances capitalistes mondiales et à améliorer les liens avec les États communistes qui n'adhèrent pas pleinement au marxisme-léninisme est considérée comme un affaiblissement de la révolution. Les critiques antirévisionnistes se répandent rapidement en Bulgarie et font pression sur le Parti communiste bulgare pour qu'il critique ouvertement l'Union soviétique et continue ses pratiques. Cependant, le parti reconnaît la nécessité continue du soutien soviétique et devrait réformer sa direction et sa gouvernance selon la nouvelle approche soviétique."
 Bul_Purge.1.d:0 "Le gouvernement bulgare a annoncé l'exécution d'Anton Yugov pour trahison du Parti communiste bulgare et de son idéologie. Cela s'inscrit dans le contexte d'une purge majeure en Bulgarie. Suivant l'exemple de l'Union soviétique, Anton Yugov a préconisé de changer le parti pour qu'il soit plus ouvert, axé sur la Bulgarie et élimine l'influence stalinienne. Cependant, la vieille garde a survécu à cette nouvelle menace et est restée aux commandes du gouvernement, rejetant l'idée d'un changement d'idées de parti. Pour consolider leur contrôle continu sur le pays, ils purgent le Parti communiste bulgare de ce qu'ils accusent de révisionnistes cherchant à saper la mise en oeuvre du marxiste-léninisme. Anton Yugov était un haut dirigeant du parti depuis la Seconde Guerre mondiale et a occupé des postes élevés jusqu'à son arrestation puis son exécution."
 Bul_Purge.2.d:0 "Le gouvernement bulgare a annoncé l'exécution de Todor Jivkov pour trahison du Parti communiste bulgare et de son idéologie. Cela s'inscrit dans le contexte d'une purge majeure en Bulgarie. Suivant l'exemple de l'Union soviétique, Todor Jivkov a préconisé de changer le parti pour qu'il soit plus ouvert, axé sur la Bulgarie et supprime l'influence stalinienne. Cependant, la vieille garde a survécu à cette nouvelle menace et est restée aux commandes du gouvernement, rejetant l'idée d'un changement d'idées de parti. Pour consolider leur contrôle continu sur le pays, ils purgent le Parti communiste bulgare de ce qu'ils accusent de révisionnistes cherchant à saper la mise en oeuvre du marxiste-léninisme. Todor Jivkov a combattu en tant que partisan pendant la Seconde Guerre mondiale et a rejoint le parti par la suite. Il a occupé des postes de direction et était un fervent partisan de la ligne dure stalinienne jusqu'à ce que Moscou annonce sa nouvelle approche et son rejet des pratiques staliniennes. Cependant, ce changement s'est avéré une erreur puisque la vieille garde a conservé le pouvoir et l'a désormais purgé."
 Protivobalgarska.1.d:0 "Le Parti communiste bulgare a décidé de revenir sur sa politique d'après-Seconde Guerre mondiale à l'égard de la région macédonienne du Pirin. Le dirigeant soviétique Joseph Staline avait demandé à la Bulgarie d'offrir une autonomie culturelle à la région et de reconnaître la population comme macédonienne. Cela a conduit l'État bulgare à lancer une politique consistant à déclarer les résidents macédoniens et à déplacer de force d'autres Macédoniens déclarés vers la région afin d'établir son identité culturelle. Les opposants à cette politique ont été arrêtés ou déclarés fascistes par l'État. De nombreux habitants de la région sont considérés comme des locuteurs bulgares et des membres de l'Église bulgare. La motivation de la macédonisation était les projets de fédération avec la Yougoslavie et le gouvernement a même ordonné aux autorités de recensement d'identifier la région comme étant à majorité macédonienne afin de combler le fossé avec la région macédonienne yougoslave voisine. Cependant, ces projets ont maintenant pris fin en raison de la scission de la Yougoslavie avec Moscou et la région est à nouveau appelée bulgare."
 Bul_Purge.5.d:0 "Todor Zhivkov a été démis de ses fonctions au sein du gouvernement bulgare et devrait être officiellement exclu du Parti communiste bulgare. L'ancien chef partisan de la Seconde Guerre mondiale et membre éminent du parti a commis une erreur critique en acceptant la déstalinisation et l'assouplissement du contrôle de l'État réclamés par le gouvernement soviétique. Zhivkov pensait qu'en suivant l'exemple de Moscou, il pourrait prendre le contrôle du parti, éliminer la vieille garde et obtenir en même temps le soutien du public. Cependant, sa tentative de prendre le pouvoir au sein du Comité central a échoué et ses ennemis triomphants ont décidé que Jivkov devait être complètement écarté du gouvernement. Les alliés de Jivkov devraient également être démis de leurs fonctions d'autorité dans les semaines à venir."
 Bul_Purge.10.d:0 "Traicho Kostov, l'ancien chef du Parti communiste bulgare a été réhabilité à titre posthume et réadmis dans le parti à la suite d'un rapport du Comité central sur le procès Kostov. Kostov avait été arrêté pour avoir été un agent des agences de renseignement occidentales, avoir porté atteinte aux relations soviétiques et prôné le nationalisme au détriment de l'unité marxiste-léniniste. Après son arrestation et son exécution, ses partisans au sein du parti ont également été arrêtés et condamnés à de longues peines. La nouvelle démarche de déstalinisation a vu le Parti communiste bulgare réévaluer ces procès et créer des commissions chargées d'examiner ces procès. Ils ont conclu que l'erreur du culte de la personnalité avait conduit à la condamnation injustifiée de Kostov et de ses partisans. Ceux qui étaient encore en prison ont également été libérés et réhabilités."
 Bul_Purge.11.d:0 "La faction partisane au sein du Parti communiste bulgare se trouve de plus en plus marginalisée au sein du parti. Les partisans communistes qui ont résisté au régime fasciste et aux forces de l'Axe ont joué un rôle déterminant après la guerre dans le lancement du coup d'État mené par les communistes qui a porté le Parti communiste bulgare au pouvoir. La récente évolution de Moscou vers la déstalinisation et la coopération pacifique a marqué un changement dans le monde communiste. En Bulgarie, cela a vu l'émergence d'un nouveau groupe de dirigeants qui prônent un changement de la vieille garde stalinienne et la mise en oeuvre d'une déstalinisation localisée dans le pays. Ce changement a entraîné une perte d'influence et de statut de la faction partisane au sein du parti, car elle a largement adopté la ligne stalinienne."
 AntiRevBul.2.d:0 "Le Comité central du Parti communiste bulgare, dans une décision surprise, a annoncé qu'il adoptait l'antirévisionnisme. Cela constitue un coup dur pour l'Union soviétique et sa récente adhésion à la déstalinisation et à la coopération amicale avec les États capitalistes. Les critiques de ce revirement soviétique par rapport à la politique stalinienne accusent Moscou d'être révisionniste. En adoptant cette position, la vieille garde bulgare a été renforcée et devrait conserver un contrôle ferme sur la Bulgarie. Cependant, les relations chaleureuses qui existaient auparavant entre les gouvernements soviétique et bulgare seront probablement affectées négativement par ce changement. Le gouvernement bulgare a tenu à mentionner qu'en adoptant l'antirévisionnisme, il préserve l'idéologie marxiste-léniniste de l'État."
 yugov.1.d:0 "La transition vers la déstalinisation lancée depuis Moscou a conduit les principaux partis communistes de toute l'Europe à réévaluer leurs politiques et leurs structures. En Bulgarie, la vieille garde qui contrôle le parti depuis la Seconde Guerre mondiale en suivant une ligne pro-soviétique et stalinienne se retrouve marginalisée au sein du parti. La déstalinisation étant à l'ordre du jour, le Parti communiste bulgare a annoncé qu'il nommait Anton Yougov au poste de premier secrétaire. Yugo condamne le culte de la personnalité et soutient le développement d'un communisme bulgare, indépendant de Moscou. Dans le passé, de telles opinions auraient pu conduire à son retrait du pouvoir et du parti, mais avec la déstalinisation adoptée par le parti, ces opinions constitueront la base du parti. La vieille garde fait désormais face à des critiques et ses partisans ne considéreront pas la nomination de Yougov comme une étape productive pour le parti. Yugov a également battu ses rivaux au sein de son camp qui auraient pu chercher à s'approprier le poste de direction."
 Bul_Purge.3.d:0 "Traicho Kostov, ancien chef du Parti communiste bulgare, a été exécuté par le gouvernement bulgare. Il avait été démis de ses fonctions par le Comité central et déchu de son adhésion au parti il y a plusieurs mois. Après son arrestation, il a été accusé de s'écarter du marxiste-léninisme en embrassant le nationalisme, en sapant les liens avec l'Union soviétique et en étant un agent des agences de renseignement occidentales. Au cours du procès, Kostov n'a pas été en mesure d'offrir une défense efficace et a été rapidement reconnu coupable. Alors que Kostov était jugé, ses partisans au sein du parti ont été arrêtés et jugés également pour des accusations similaires. Ils devraient également être reconnus coupables et condamnés à de longues peines de prison. Beaucoup pensent que ces procès étaient des procès-spectacles destinés à purger le parti de Kostov et de ses partisans et à renforcer les factions pro-soviétiques au sein du parti."
 Zhivkov.1.d:0 "Le nouveau secrétaire général du Parti communiste bulgare est Todor Zhivkov. L'ancien commandant partisan a accédé aux échelons supérieurs du parti après avoir été nommé à la tête de la police de Sofia. Zhivkov a réussi à occuper le poste de secrétaire général grâce à l'adhésion de nombreux pays communistes à la déstalinisation après que l'Union soviétique a annoncé son soutien à cette déstalinisation. Les anciennes dirigeants communistes bulgares ont construit leur pouvoir en obéissant à la ligne de Moscou et à Staline, mais avec cette approche désormais critiquée à Moscou, leur position est devenue intenable. Zhivkov a réussi à aider à faire sortir l'ancienne direction du pouvoir et à se positionner comme le meilleur candidat à ce poste. Il devrait initier des politiques et des réformes visant à établir une version bulgare du communisme qui devrait non seulement revitaliser le parti, mais aussi lui apporter le soutien de la population."
 Bul_Purge.4.d:0 "Le secrétaire général du Parti communiste bulgare, Valko Chervenkov, a été démis de ses fonctions. Chervenkov a passé des années à Moscou pour suivre des études et une formation. Il a dirigé les efforts de propagande pendant la Seconde Guerre mondiale et a ensuite rejoint le gouvernement. Il a déjoué ses adversaires et a finalement fusionné son rôle de chef du parti avec celui de Premier ministre. Il adhère à la ligne soviétique du marxisme-léninisme et du développement économique et social. Cependant, l'évolution de Moscou vers la déstalinisation a rendu sa position intenable, car Tchervenkov était l'un des partisans les plus obéissants du stalinisme. Face à l'augmentation de l'opposition au sein du parti et au déclin du soutien populaire, Tchervenkov n'a eu d'autre choix que de démissionner et d'être démis du gouvernement. Il reste membre du parti mais ne devrait pas avoir beaucoup de voix auprès de l'État. Une nouvelle ère du communisme bulgare a commencé."
 
 ZSL.1.d:0 "Le ZSL, Parti populaire uni, a été créé après la fusion du parti communiste Stronnictwo Ludowe et des restes du Parti populaire ; dirigé par Józef Niecko, le parti proclame une vision de l'agraire et du socialisme agraire. Il est considéré et fonctionne comme un parti satellite du PZPR communiste, le Parti unifié des travailleurs polonais, et l'intention principale de ce qu'on appelle le « satellite » est de représenter les travailleurs ruraux de Pologne. Quelques hommes politiques polonais ont salué la création de ce nouveau parti et ont félicité Józef lui-même pour son travail remarquable."
 ZSL.2.d:0 "Le célèbre médecin et homme politique Tadeusz Michejda, sénateur du Parti national des travailleurs dans les années 1930 et ministre de la Santé en Pologne, a officiellement déclaré son intention de soutenir la ZSL récemment créée, louant les politiques agraires et l'attention portée par le parti aux travailleurs ruraux, qui sont souvent négligés dans la société de plus en plus urbanisée à laquelle la Pologne est confrontée. La ZSL a remercié l'homme politique pour ses éloges, reconnaissant non seulement son travail en Pologne mais, comme on dit, un champion du socialisme."
 Wyszynski.1.d:0 "Le professeur et cardinal Stefan Wyszynski a été récemment arrêté à la suite d'une répression contre plusieurs éléments de la société polonaise et est désormais emprisonné à Rywald ; le gouvernement polonais invoque un comportement de trahison pour expliquer la vague d'arrestations en cours, suivie de procès et d'emprisonnements de masse. Il avait récemment été élevé au rang de cardinal prêtre par le pape et était un fervent travailleur social. Il a aidé plusieurs Juifs pendant l'occupation nazie de la Pologne, avant de diriger un projet de restauration à Wloclawek après la guerre. Beaucoup considèrent cette arrestation comme une grave injustice envers l'Église et le peuple polonais lui-même."
 Gomulka.1.d:0 "Wladislaw Gomulka, vice-Premier ministre du gouvernement provisoire de Pologne de janvier à juin 1945 et homme politique communiste notoire du Parti unifié des travailleurs polonais, a été emprisonné sur ordre de Boleslaw Bierut, le président de la Pologne. Dans ce qui semblait être, selon les experts, une longue lutte de pouvoir entre les deux phares du communisme, a finalement éclaté lorsque Bierut a accusé Gomulka de \"déviation réactionnaire de droite\", sans aucun commentaire sur la durée de l'emprisonnement et son exclusion ultérieure du Parti unifié des travailleurs polonais."

 POL_NATOLIN.1.d:0 "La République populaire de Pologne, un État satellite de l'Union soviétique et l'un des États les plus peuplés du bloc de l'Est, a appris aujourd'hui qu'elle niait le massacre de Katyn. Le massacre était une série de fusillades de masse qui ont eu lieu entre avril et mai 1940. Environ 22 000 responsables militaires polonais et personnes instruites ont été exécutés par le NKVD, tandis que les meurtres ont eu lieu dans les prisons soviétiques. Le massacre doit son nom à la forêt de Katyn où les premières fosses communes ont été découvertes. Les Soviétiques affirment que les responsables du massacre étaient les Allemands et nient continuellement toute responsabilité dans ce massacre."        #Deny the Katyn Massacre (Part of the Hardliner Route)
 POL_NATOLIN.2.d:0 "Des rapports émanent des communautés juives de la République populaire de Pologne concernant la discrimination, l'interdiction de permettre à la diaspora juive de Pologne de retourner en Israël, ainsi que l'arrestation de nombreux responsables et intellectuels juifs d'élite dans le pays. Cela a suscité un tollé en Israël et dans de nombreuses communautés juives d'Europe implorant un traitement équitable de la population juive en Pologne. C'est une campagne totale contre eux. Il faut agir !"        #Poland Launches Anti-Semitic Campaign (Part of the Hardliner Route)

 Gomulka.2.d:0 "À la fin des années 1940, le gouvernement de notre pays était divisé par une rivalité entre Gomulka et Bierut. Gomulka dirigeait un groupe national et Bierut dirigeait un groupe soutenu par l'Union soviétique. Cela a finalement conduit à la destitution de Gomulka du pouvoir en 1948. Il a été accusé de déviation réactionnaire de droite, ce qui a conduit à son emprisonnement pendant plus de huit ans, de 1949 à 1956. Mais aujourd'hui, avec la multiplication des émeutes à Poznan, nous sommes obligés de réhabiliter Gomulka. Les réformateurs du PZPR veulent une réhabilitation politique et son retour à la direction du parti, et Gomulka veut un véritable pouvoir pour mettre en oeuvre les réformes. Nous n'avons pas vraiment le choix en la matière."            #Gomulka Released from Prison
 Gomulka.3.d:0 "Avec les protestations qui font rage dans la ville de Poznan, les protestations croissantes des civils et des membres du gouvernement appellent à une action concrète. Maintenant que Zawadzki a assumé le rôle de Premier secrétaire, avec le plein soutien de nos camarades d'Union soviétique, nous avons commencé à réprimer les manifestations avec l'aide de l'armée et de la police secrète. De nombreuses arrestations ont eu lieu, mais surtout. Gomulka, un vieux réformateur réhabilité, a de nouveau été arrêté. Peut-être que cela lui montrera, ainsi qu'aux manifestants, que la réforme n'est pas nécessaire et que notre population doit apprendre à vivre avec ! Après tout, tout ce que nous avions à faire était d'enfoncer la porte lors de son arrestation, et toute la protestation s'effondrerait."            #Gomulka Arrested Once More (Aftermath of Zawadzki becoming Secretary instead of Gomulka)

 Polish_October.0.d:0 "La République populaire de Pologne a déclaré une période de deuil national suite au décès du Premier secrétaire Boleslaw Bierut. Le premier secrétaire d'État Boleslaw Bierut est décédé hier d'une crise cardiaque dans la capitale soviétique, Moscou. Près d'un mois auparavant, Bierut assistait au 20e Congrès du Parti communiste de l'Union soviétique en tant que membre de la délégation polonaise en février, cependant, au lieu de retourner en Pologne avec le reste de la délégation polonaise, Bierut est resté hospitalisé à Moscou en raison d'un cas de grippe. La grippe de Bierut finirait par provoquer une pneumonie et des complications cardiaques qui conduiraient à la crise cardiaque de Bierut. Les cloches des églises sonneraient dans toute la nation polonaise le jour des funérailles de Bierut, auxquelles assisterait également le premier secrétaire de l'Union soviétique. Quatre jours après les funérailles de Bierut, le PZPR tiendrait son 6e Plénum pour déterminer un successeur à Bierut. Lors du 6e Plénum du PZPR, Edward Ochab serait élu à l'unanimité par le Comité central du PZPR comme nouveau premier secrétaire, en tant que candidat de compromis entre la faction réformiste Pulawy et la faction stalinienne dure Natolin."
 Polish_October.1.d:0 "Des rapports récents montrent un changement dans le climat politique en Pologne. C'est ce qu'on appelle le dégel polonais ou l'octobre polonais. La faction stalinienne dure a perdu de sa popularité et, lors des manifestations du début du mois de juin, elle a mis en évidence le mécontentement et l'inconfort général du peuple face à sa situation et à son pouvoir. Les événements ont entraîné la montée de la faction réformatrice, dirigée par Wladyslaw Gomulka. Gomulka est soutenu avec enthousiasme par la grande majorité de la société polonaise, non pas principalement en tant que dirigeant communiste, mais en tant que dirigeant d'une nation qui a résisté à la pression soviétique et au régime totalitaire de Staline."    #Polish October (global)
 Polish_October.2.d:0 "\nAvec l'apaisement des tensions en République populaire polonaise au lendemain du mois d'octobre polonais, Wladyslaw Gomulka a pris la direction du Parti ouvrier unifié polonais. Il fut de facto le dirigeant de la Pologne d'après-guerre jusqu'en 1948. Après le mois d'octobre polonais, il redevint dirigeant après le décès de Bierut. Gomulka a d'abord été très populaire pour ses réformes et sa recherche d'une \"voie polonaise vers le socialisme\", ce qui donne naissance à la période connue sous le nom de \"dégel de Gomulka\". Peut-être que cela conduira à une période de paix, de prospérité et de réforme dans l'un des plus grands pays du bloc de l'Est ?"    #First Secretary Gomulka(global)
 Polish_October.3.d:0 "\nAvec le décès de Bierut, le poste de Premier secrétaire de la République populaire de Pologne est désormais occupé par Aleksander Zawadzki. Il a été vice-Premier ministre de la République populaire de Pologne et a été nommé président du Conseil d'État polonais, en remplacement de Boleslaw Bierut qui avait pris le poste de premier secrétaire. Avec le décès de Bierut, Zawadzki a détaillé son plan visant à aligner davantage le pays sur l'Union soviétique et à intégrer davantage d'éléments de la culture soviétique dans la nation."    #First Secretary Zawadzki (Alternative Hardliner to Gomulka) (global)

#Indian Events
 Dalit.1.d:0 "Le Mouvement Bouddhiste Dalit sous la direction de B.R. Ambedkar envisage de convertir les Dalits, connus sous le nom d'intouchables, à sa version du bouddhisme. L'objectif est de convertir suffisamment de Dalits pour créer une pression politique en faveur du changement social et mettre fin à l'influence de l'hindouisme sur les communautés dalits qui maintiennent la communauté opprimée. B.R. Ambedkar, un important militant indépendantiste et militant dalit, considère depuis longtemps l'hindouisme comme le problème fondamental du développement social des Dalits. La version du bouddhisme qu'il propose s'appelle Navayana, qui considère la religion à travers le prisme de la lutte des classes et rejette de nombreuses croyances bouddhistes dominantes. Dès le lancement de sa campagne, pas moins d'un demi-million de Dalits se sont convertis. Bien que les chiffres soient impressionnants, les critiques notent que le taux de conversion n'est pas aussi élevé qu'Ambedkar le souhaiterait et que les Dalits convertis ne sont pas assez nombreux pour devenir une force politique poussant au changement social. Les tensions communautaires se sont également accrues, de nombreux hindous considérant ces conversions ciblées comme une menace directe pour leur communauté."
 India.25.d:0 "\nPendant la Seconde Guerre mondiale, les îles Andaman et Nicobar étaient sous l'occupation de l'Armée indienne libre et de ses protecteurs japonais. Ils ont administré les îles dans le cadre de l'Inde libre et, après la guerre, les ont cédées aux forces indiennes britanniques. Avec son indépendance, l'Inde a déclaré son intention de voir tous les Indiens libérés du colonialisme et avoir le choix de rejoindre l'Union indienne. Cependant, au cours de cette période, les Britanniques ont déclaré qu'ils avaient l'intention de déplacer tous les Anglo-Indiens et Anglo-Birmans vers les îles et de leur donner l'indépendance. Cependant, ce plan s'est avéré impossible à mettre en oeuvre mais a suscité des inquiétudes parmi les dirigeants indiens. Pour mettre fin à tout différend sur le statut de ces îles, le gouvernement indien a officiellement annoncé l'annexion des îles Andaman et Nicobar à l'Union indienne et a promis de fournir à l'île l'éducation et le développement."
 Asian_Games.1.d:0 "La première édition des Jeux asiatiques a débuté à New Delhi. Des athlètes de plus de dix nations asiatiques participent à plus de cinquante compétitions. Pour cette première édition, les régimes communistes n'ont pas été invités et le Pakistan s'est vu refuser l'autorisation en raison du conflit au Cachemire. Les origines des Jeux asiatiques remontent aux Championnats d'Extrême-Orient d'avant la Seconde Guerre mondiale, qui se sont terminés après le début de la guerre sino-japonaise. Lors des Jeux olympiques de 1948, la Chine et les Philippines ont discuté d'une nouvelle édition des Jeux d'Extrême-Orient et le représentant indien au Comité international olympique a accepté, mais a suggéré que la portée inclue les nouveaux États indépendants émergents d'Asie. Cela a lancé le processus qui a finalement conduit à la formation de l'Association asiatique d'athlétisme et à un accord pour accueillir les premiers Jeux asiatiques à New Delhi. Bien que le Japon ne soit pas membre de l'Asian Athletic Association, il a été autorisé à y participer."
 COM_Hyderabad.1.d:0 "Pendant des siècles, les habitants d'Hyderabad ont vécu sous le règne tyrannique de leur Nizam et de sa cabale de propriétaires et de serviteurs. Le Nizam a utilisé ces hommes pour écraser physiquement les paysans et ceux qui réclamaient des réformes pour développer la région. Maintenant que l'Inde contrôle Hyderabad et reconnaît qu'elle peut réparer les torts historiques. Le gouvernement indien a annoncé une vaste série de licenciements et d'arrestations d'anciens fonctionnaires, conseillers royaux et propriétaires qui avaient travaillé en étroite collaboration avec le Nizam d'Hyderabad. Ces hommes sont punis pour leurs actions passées et, à mesure que ces affaires seront jugées, le gouvernement s'attend à ce qu'ils restituent au peuple les richesses qu'ils ont volées. Le gouvernement a ajouté que la libération physique d'Hyderabad n'était qu'une partie et que la partie suivante nécessiterait l'élimination des classes réactionnaires. Cela permettra de réaliser le développement et les réformes avec peu d'interférences ou de sabotages."
 COM_Hyderabad.2.d:0 "Tout au long de 1947 et 1948, l'opération Polo annexa la principauté d'Hyderabad à l'Inde nouvellement indépendante. Cependant, cela a engendré une instabilité et l'État a rapidement été envahi par un soulèvement paysan soutenu par le Parti communiste indien. Les paysans ont attaqué les propriétaires féodaux qui régnaient sur la terre depuis l'Antiquité, avant de tourner leur attention et toute la force de leur colère vers Osman Ali Khan, le prince au pouvoir d'Hyderabad depuis 1911. L'écrasement brutal de cette violence mettra enfin un terme à l'opération Polo, mais ne mettra pas fin aux violences incessantes entre naxalites et maoïstes dans la région. Cependant, cela signifiera que le CPI devra amener le communisme en Inde à travers le cadre de la démocratie et qu'il devra enfin apporter au moins un semblant d'ordre dans cette région déchirée par la guerre."
 India.6.d:0 "La Constitution d'Imaraudingndia exigeait que le président crée une commission chargée d'enquêter sur les conditions des classes arriérées à travers le pays et de proposer des suggestions sur la manière de mettre fin à la discrimination. Les classes arriérées ont été identifiées comme des communautés qui, pour des raisons religieuses, tribales ou socio-économiques, étaient empêchées d'obtenir une représentation, un accès à l'éducation ou à un emploi. Le président a placé cette commission, appelée Commission des premières classes arriérées, sous la direction du célèbre militant indépendantiste indien Kaka Kalelkar. La commission a finalement identifié plus de deux mille castes et communautés arriérées, dont près de neuf cents étaient qualifiées de plus arriérées. Il recommandait le socialisme, réservant des places dans les universités aux communautés arriérées et une campagne de justice sociale dans laquelle ceux des castes ou des statuts supérieurs renonçaient à leurs avantages pour le bien de la nation. Il a également fait appel à des programmes d'alphabétisation et de formation pour ces communautés."
 kashmir.100.d:0 "Lorsque des bandes de combattants, agissant sans doute avec l'accord du Pakistan, sont entrées au Cachemire peu après l'indépendance, le gouvernement indien a reçu une demande du Maharaja du Cachemire. Il a déclaré que sa capitale était sur le point de s'effondrer face à des voyous violents et a demandé notre aide. Nous lui avons dit que s'il acceptait d'intégrer le Cachemire à l'Union indienne, nous serions alors en mesure de lui proposer notre aide. Il a accepté et l'armée indienne est rapidement arrivée pour empêcher Srinagar d'être limogée par les combattants. Le Pakistan a rapidement révélé son rôle manifeste et a déployé ses propres troupes au Cachemire. Après des mois de combats intenses, un cessez-le-feu de l'ONU a été convenu par les deux parties et l'Inde occupe actuellement les deux tiers de ce qui était l'État princier de Jammu-et-Cachemire. Notre présence est essentielle pour garantir la paix et mettre fin à l'expulsion massive des hindous vers Jammu."
 Negar.1.d:0 "Les patriotes indiens vivant à Nagar Haveli au Portugal après l'indépendance ont travaillé dur pour libérer la région des forces coloniales. Après une brève lutte, le peuple fut victorieux et commença à s'administrer lui-même avec l'aide de l'Inde. Cependant, au niveau international, le territoire était toujours considéré comme portugais. Cela a pris fin aujourd'hui après qu'un haut responsable de la fonction publique indienne a été nommé chef de l'État de Negar Haveli. Une fois assermenté, il a officiellement demandé l'autorisation de rejoindre l'Inde, ce que le gouvernement indien a accepté. Les forces indiennes et les représentants du gouvernement se sont rapidement rendus sur le territoire pour entamer le processus d'intégration du territoire à l'Inde. Les Portugais ont déposé une protestation auprès du gouvernement indien et des Nations Unies, mais de nombreux observateurs estiment que cela aura peu d'effet sur le terrain."
 kashmir.101.d:0 "Le Maharaja du Cachemire avait adhéré à l'État princier de Jammu-et-Cachemire en Inde afin d'obtenir l'aide indienne dans ses efforts contre les combattants tribaux soutenus par le Pakistan. L'armée indienne est rapidement intervenue et a sécurisé la majeure partie du territoire pour l'Inde. Le front étant stabilisé, une assemblée législative a été créée au Cachemire. Cette assemblée a récemment confirmé les actions du Maharaja et a déclaré que le peuple du Jammu-et-Cachemire approuvait l'adhésion à l'Inde. Cette décision a amené le gouvernement indien à réagir en annonçant qu'il commencerait bientôt à intégrer l'administration et la police du Cachemire aux institutions nationales, les mettant ainsi en conformité avec les normes et procédures appropriées. Sur le plan politique, le gouvernement indien a également déclaré qu'il agirait rapidement pour ajouter le Cachemire comme nouvelle province nationale."
 IndiaPuppet.1.d:0 "Le Royaume du Népal est depuis longtemps lié à l'histoire de l'Inde. De nombreux Népalais travaillent à travers l'Inde et leurs célèbres soldats Gurkha comptent parmi les plus élitistes de l'armée indienne. C'est ce lien historique étroit qui, selon le gouvernement indien, est la raison pour laquelle il a demandé au Népal d'accepter l'hégémonie indienne. Le gouvernement indien du Népal est essentiellement un État princier et, en tant que tel, doit régler son statut avec New Delhi et non avec Londres. Le gouvernement indien a également déclaré que même si le gouvernement népalais prétend être indépendant, le peuple népalais désire profondément une union avec l'Inde. Les Indiens ont souligné que le Népal n'aurait pas d'économie viable ni d'accès au monde sans l'Inde. Le gouvernement népalais devrait réagir prochainement, même si de nombreux observateurs pensent qu'il acceptera les demandes indiennes, malgré leurs réticences."
 IndiaPuppet.2.d:0 "Le gouvernement indien a annoncé que le Bhoutan conclurait un partenariat plus approfondi avec le Bhoutan, donnant à l'Inde un accès au pays ainsi qu'une voix sur sa politique étrangère et intérieure. Le gouvernement indien a déclaré que le Bhoutan est essentiellement un État princier et qu'il dépend depuis longtemps de l'Inde en termes de sécurité, d'économie et de développement. Le nouvel arrangement reflète la réalité historique. Plus important encore, le gouvernement indien a noté que la population du Bhoutan serait désormais protégée des machinations de voisins hostiles. Les observateurs de cette action récente estiment que la décision indienne reflète le désir de l'Inde de sécuriser ses frontières et de disposer d'un espace tampon au cas où une puissance rivale chercherait à défier l'Inde au nord."
 IndiaPuppet.3.d:0 "Le gouvernement tibétain a fait part de son enthousiasme pour le nouvel accord conclu avec le gouvernement indien. Cette déclaration est considérée avec scepticisme dans le monde entier, car le Tibet a essentiellement accepté de céder sa politique étrangère, sa défense et son économie au contrôle indien en échange de la protection de l'armée indienne. Certains rapports indiquent déjà que des unités militaires indiennes se sont installées au Tibet. Le gouvernement indien, dans sa propre déclaration, a noté que l'accord récent correspondait aux liens historiques entre l'Inde et le Tibet qui remontent à plusieurs siècles. De nombreux observateurs pensent que cette intervention indienne au Tibet vise à leur donner une zone tampon solide pour défendre les plaines indiennes de toute menace future venant du nord. Pour les Tibétains, bien que leur souveraineté ait été réduite, ils estiment que cela vaut la peine d'assurer une protection contre une agression potentielle de la part de leurs propres voisins, dont beaucoup ont des visées territoriales sur le Tibet."
 IndiaPuppet.4.d:0 "Les Français possèdent des enclaves en Asie du Sud depuis le XVIIe siècle. Avec l'indépendance de l'Inde, les habitants des régions françaises ont exigé l'union avec le nouvel État. Les Français ont à leur tour décidé d'autoriser des élections dans les régions afin de déterminer ce que désire le peuple. Suite à ces résultats, toutes les enclaves françaises ont été cédées à la juridiction indienne. Le gouvernement indien envoie déjà des fonctionnaires et des administrateurs pour assurer une transition en douceur de l'ancien territoire français vers le pays. Certains de ces territoires seront incorporés aux provinces voisines mais la principale région française, Pondichéry, sera administrée comme un territoire de l'Union. Une autre puissance coloniale en Inde a été chassée et l'Union indienne se renforce. La mission visant à mettre fin au colonialisme en Asie du Sud se poursuit avec succès."
 
