 ino_war.2.t: "L'histoire de Komarudin"
 ino_war.2.d: "Dans les annales de l'histoire, la plupart de ceux qui ont combattu pour l'indépendance étaient quelque peu limités aux groupes qui habitaient le territoire avant la colonisation, mais un nom ressort le plus.\n\nKomarudin ne s'appelait pas toujours Komarudin. Son vrai nom était Yang Chil-seong, un ressortissant coréen bloqué dans notre pays non pas par force, mais par choix. Lorsque nous avons déclaré notre indépendance en 1945, la Corée a été libérée à la fois par les Soviétiques et les Américains, mais Yang n'y est pas retourné. Au lieu de cela, il est resté, a épousé une ressortissante indonésienne et a changé de nom. Rejoignant le TKR nouvellement créé en 1945, Yang combattit dans la guérilla au sein d'un groupe surnommé « Pasukan Pangeran Papak », basé à Wanaraja, Garut.\n\nLorsque les Néerlandais occupèrent Wanaraja, Yang et son bataillon furent contraints de se retirer dans les montagnes de Galunggung, où ils poursuivirent le combat dans une guérilla incessante. Depuis les forêts et les hautes terres, ils ont frappé les forces d'occupation chaque fois que l'occasion se présentait, refusant de se rendre malgré une pression écrasante. Finalement, la trahison conduisit à la capture de Yang en 1948, et après un long procès, il fut exécuté le 21 mai 1949, mettant ainsi fin tragiquement à une vie passée dans une résistance inébranlable."
 ino_war.2.a: "Héros de l'Indonésie et de la Corée."
 ino_war.3.t: "[GetNewspaperHeader]L'Indonésie a rejoint les Nations Unies en Corée !"
 ino_war.3.d: "Après l'abolition de la structure fédérale indonésienne, le Premier ministre Mohammad Hatta a suivi de près l'évolution de la situation dans d'autres parties du monde, la guerre de Corée en cours attirant particulièrement l'attention. En tant que nation nouvellement indépendante cherchant sa place sur la scène internationale, l'Indonésie considérait les événements mondiaux, en particulier ceux d'Asie, comme étant étroitement liés à ses propres aspirations à la stabilité et à la souveraineté.\n\nDéterminée à soutenir une démocratie émergente en Asie, l'Indonésie a ratifié la résolution 83 des Nations Unies et a officiellement envoyé ses troupes en Corée du Sud. Cette décision a été officiellement saluée par les Nations Unies, qui ont exprimé l'espoir que la contribution de l'Indonésie contribuerait à guider la péninsule coréenne vers une éventuelle paix et une réunification sous la République de Corée."
 ino_war.3.a: "Développement intéressant."
