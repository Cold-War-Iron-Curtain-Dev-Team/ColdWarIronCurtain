 india.50.t:0 "Exécution de Nathuram Vinayak Godse"
 india.50.d:0 "Nathuram Vinayak Godse, défenseur du nationalisme hindou qui a assassiné le Mahatma Gandhi en 1948, vient d'être condamné à mort par pendaison. Godse a été jugé devant la Haute Cour du Pendjab, à Peterhoff, Shimla. Bien que des appels à la commutation aient été lancés par les deux fils de Gandhi, Manilal Gandhi et Ramdas Gandhi, ils ont été rejetés par le Premier ministre indien Jawaharlal Nehru, le vice-premier ministre Vallabhbhai Patel et le gouverneur général Chakravarti Rajagopalachari, et Godse a été pendu peu après à la prison d'Ambala."
 india.50.a:0 "Victoire pour les autres, défaite pour les autres"
 india.51.t:0 "[GetNewspaperHeader]Exécution de l'assassin de Gandhi"
 india.51.d:0 "Aujourd'hui, Nathuram Godse, un nationaliste hindou, a été exécuté pour le meurtre du célèbre défenseur de l'indépendance indienne et combattant de la liberté Mohandas Karamchand Gandhi. Il a été jugé devant la Haute Cour du Pendjab à Peterhoff, Shimla. Même si les deux fils de Gandhi, Manilal et Ramas Gandhi, ont plaidé pour sa commutation, le Premier ministre indien, le vice-premier ministre et le gouverneur général ont rejeté leurs demandes. La pendaison a eu lieu dans la prison d'Ambala, dans l'est du Pendjab."
 karachi.1.t:0 "Accord concernant l'établissement d'une ligne de cessez-le-feu dans l'État de Jammu"
 india.51.a:0 "Temps turbulents en Inde..."
 karachi.1.d:0 "L'Accord de Karachi de 1949 a été signé par les représentants militaires de l'Inde et du Pakistan, supervisé par la Commission des Nations Unies pour l'Inde et le Pakistan, établissant une ligne de cessez-le-feu au Cachemire à la suite de la guerre indo-pakistanaise de 1947. Il a établi une ligne de cessez-le-feu qui a été surveillée depuis lors par les observateurs des Nations Unies des Nations Unies. Les signataires étaient :\nLieutenant-général S. M. Shrinagesh, au nom de l'Inde\nMajor-général W. J. Cawthorn, au nom du Pakistan\nHernando Samper et M. Delvoie, au nom de l'UNCIP."
 Tripura.1.t:0 "Accord de fusion Tripura"
 Tripura.1.d:0 "L'État de Tripura était l'un des anciens États princiers de l'Inde. Selon le Rajmala, Tripura a été gouvernée en permanence par pas moins de 184 rois Tripuri dotés d'un statut souverain et indépendant avant sa fusion avec l'Union indienne en 1949, après la mort du dernier roi au pouvoir, Bir Bikram Kishore Debbarman. Son successeur, Kirit Bikram Kishore Deb Barman, avait treize ans au moment de la fusion. Le roi Bir Bikram Kishore Debbarman était décédé en 1947, après quoi un Conseil de régence fut formé pour diriger l'administration sous la présidence de la reine Kanchan Prava Devi, la mère de Kirit Bikram Kishore Deb Barman.\nQuelques mois après la disparition anormale du roi Bir Bikram Kishore Debbarman, Tripura fut confrontée à une grande crise, avec des menaces de forces internes et externes. La reine Kanchan Prava Devi, en tant que présidente du Conseil de régence, a subi de fortes pressions pour choisir de rejoindre l'Union indienne. Sur les conseils du gouvernement indien, elle dissout le Conseil de régence et devint l'unique régente le 12 janvier 1948. Plus d'un an plus tard, elle signa « l'accord de fusion de Tripura » et, avec effet, Tripura devint partie intégrante de l'Union indienne. Il a ensuite été administré par le commissaire en chef en tant qu'État de catégorie « C »."
 Tripura.1.a:0 "Que Dieu bénisse notre effort commun avec succès."
 india.2.d:0 "L'Inde a obtenu son indépendance du Raj britannique le 15 août 1947. L'indépendance est venue grâce à l'Indian Independence Act 1947, une loi du Parlement du Royaume-Uni qui a divisé l'Inde britannique en deux nouveaux dominions indépendants du Commonwealth britannique. L'Inde a obtenu son indépendance le 15 août 1947 en tant que monarchie constitutionnelle avec George VI comme chef de l'État et le comte Mountbatten comme gouverneur général.\nLe 29 août 1947, un comité de rédaction fut nommé pour rédiger une constitution permanente, avec B. R. Ambedkar comme président. Un projet de constitution a été préparé par la commission et soumis à l'Assemblée constituante. L'Assemblée s'est réunie, en séances ouvertes au public, pendant 166 jours, répartis sur une période de deux ans avant d'adopter la Constitution. Après de nombreuses délibérations et quelques modifications, les membres de l'Assemblée ont signé deux exemplaires manuscrits du document."
 india.2.a:0 "Jour de fierté pour nous"
 india.2.b:0 "Félicitations"
 india.52.t:0 "Le pacte de Delhi"
 india.52.d:0 "Le pacte de Delhi, également connu sous le nom de Pacte Liaquat-Nehru, vient d'être signé entre nous et le Pakistan, où les réfugiés étaient autorisés à rentrer chez eux pour disposer de leurs biens, les femmes enlevées et les biens pillés devaient être restitués, les conversions forcées n'étaient pas reconnues et les droits des minorités étaient confirmés. Le traité a été signé à New Delhi par le Premier ministre indien Jawahar Lal Nehru et le Premier ministre pakistanais Liaquat Ali Khan. Le traité est le résultat de six jours de négociations visant à garantir les droits des minorités dans les deux pays après la partition de l'Inde et à éviter une nouvelle guerre entre nous."
 india.52.a:0 "Paix pour l'instant"

Sablin_Meme.1.d:0 "Valéry Sabline regardait ses pieds avec honte et déception alors que ses doigts souples mais fermes caressaient sa médaille d'ordre de service de la patrie.\n\n\"Putain d'enfoiré. \"Comment ma fière nation ouvrière m'a-t-elle trahi ? N'étais-je pas destiné à être un putain de Lénine réincarné avec un soupçon de Mère Teresa qu'un prolétaire cultivé pourrait honorer pour toujours ? »\n\nSablin leva les yeux de sa cabine de cour vers ses marins autrefois courageux, toujours debout avec dignité devant le gros et tyrannique Brejnev. Aujourd'hui plus que jamais, le Premier ministre soviétique avait l'air particulièrement bouffi lorsqu'il lisait sa phrase à Sablin.\n\nBrejnev commença à palper chaque page des accusations de Sablin tout en ajustant ses lunettes.\n\"S'il vous plaît, ayez pitié du pauvre garçon\", dit Suslov depuis la potence d'une voix rauque mais autoritaire.\nBrejnev a rejeté les objections du vieux révolutionnaire et a continué.\n\n\"Par ordre du soviet suprême, je vous condamne à mort par peloton d'exécution.\" » dit Brejnev avec un grognement stoïque qui fit frissonner Sablin à la fois de peur et, à sa grande surprise, d'excitation.\n\n« Pourrais-je être martyrisé ? Et si ma mort poussait le peuple soviétique à se rassembler autour de moi en signe de solidarité en criant mon nom ? Sablin... Sablin.... Sablin... Ils chanteront. Ils se souviendront tous de moi maintenant ! » Pensa-t-il tandis qu'un sourire excité mais enfantin affichait son visage rougissant.\n\nAvant qu'il ait pu finir ses pensées, deux puissants officiers soviétiques en short kaki l'ont attrapé par son corps chaud et l'ont traîné dehors, devant la tombe de Lénine. L'officier le plus grand a donné un coup de pied à Sablin et a mis sa botte sur la gorge des révolutionnaires en disgrâce. Malgré le caoutchouc épais, Sablin pouvait sentir chaque tendon du pied de l'officier fléchir. L'officier s'est alors penché vers son oreille.\n\n\"Vous avez vécu comme Lénine, et maintenant vous mourrez comme Lénine\", a murmuré l'officier avant qu'un craquement ne résonne dans les murs du Kremlin. À mesure que le son s'estompait, le monde s'est rendu compte qu'il avait perdu le plus grand révolutionnaire de tous les temps."

