Naxalbari.1.d:0 "Le révolutionnaire Charu Majumdar a rédigé une série de documents pour guider les principes idéologiques et les tactiques révolutionnaires des militants communistes naxalites. Les documents dénoncent l'Union soviétique comme révisionniste, condamnent l'État indien et appellent à une guerre populaire pour renverser le gouvernement. Les Naxalites sont membres d'un groupe dissident plus radical qui a quitté le Parti communiste indien dominant. Ils estimaient que le PCI était compromis parce qu'il participait à la politique nationale et s'engageait dans la vision des Naxalites de l'État indien en tant qu'institution bourgeoise. Les écrits se répandent déjà dans les zones rurales, notamment au Bengale. On rapporte déjà que des paysans du quartier de Naxalbari, dans le district de Darjeeling, au Bengale, commencent à s'agiter. Le gouvernement indien craint que ces documents n'encouragent des troubles généralisés."
Naxalbari.2.d:0 "Des comités paysans, inspirés par les écrits de Cahru Majumdar, se sont récemment formés dans le district de Darjeeling et ont commencé à saisir les terres des propriétaires et à les cultiver sans autorisation. Certains des propriétaires concernés ont constitué des groupes armés qui ciblent les métayers soupçonnés d'être impliqués dans ces comités. Les paysans militants saisissent les armes, la nourriture et l'argent des propriétaires fonciers. Ces derniers jours, des informations sont parvenues à Calcutta selon lesquelles des paysans armés prennent d'assaut les avant-postes du gouvernement local et de la police, saisissant des documents relatifs à la propriété foncière et des armes à feu. Les efforts des autorités locales pour organiser des bandes de police n'ont pas réussi à déloger les paysans. Le gouvernement du Bengale occidental qualifie la situation d'ordre public de hors de contrôle et demande le déploiement de forces paramilitaires dans la région."
Naxalbari.3.d:0 "La situation dans le district de Darjeeling continue de se détériorer alors que les efforts visant à déployer des policiers armés n'ont pas réussi à disperser les militants paysans naxalites. Cependant, le vent a commencé à changer une fois que les forces paramilitaires sont arrivées sur les lieux. Ces soldats lourdement armés et entraînés ont facilement repoussé et désarmé un certain nombre de militants dans les premières phases. Le gouvernement indien a informé les médias que le déploiement et les opérations se poursuivraient jusqu'à ce que l'ordre public soit rétabli. Une déclaration des rebelles communistes a accusé le gouvernement indien d'atrocités et d'avoir déployé des mercenaires rémunérés pour massacrer des paysans innocents. Dans l'ensemble, le grand public semble plus intéressé par le rétablissement de l'ordre public que par l'écoute des revendications des Naxalites."
Naxalbari.4.d:0 "Suite au déploiement des forces paramilitaires, le mouvement naxalite semble être entré dans la clandestinité. La plupart des comités paysans et des bandes armées ont rendu leurs armes, tandis que les membres les plus radicaux semblent s'être retirés plus profondément dans la jungle ou fondus dans les villages. Le gouvernement indien salue le succès de l'opération et note que plusieurs des militants communistes les plus radicaux ont été tués ou capturés au cours des opérations en cours. L'opinion publique indienne soutient largement l'action du gouvernement, car beaucoup considèrent les Naxalites comme des radicaux et considèrent leurs déclarations publiques comme de la propagande. Le Premier ministre et l'armée craignent qu'une fois les opérations terminées, les rebelles ne reviennent et étudient donc des options pour négocier avec les dirigeants paysans locaux."
Naxalbari.5.d:0 "Les dirigeants paysans du district de Darjeeling ont annoncé qu'ils cesseraient les opérations armées contre l'État indien et ne soutiendraient plus les Naxalites. Le gouvernement a affirmé qu'une fois que les paysans avaient compris comment ils étaient exploités par les Naxalites, ils s'étaient immédiatement excusés et s'étaient engagés à ne plus se laisser égarer. Les représentants des paysans ont affirmé qu'ils restaient des citoyens fidèles de l'Inde et appréciaient les efforts du gouvernement pour rétablir l'ordre et écouter les doléances des paysans. Le gouvernement indien a pour sa part déclaré apprécier le soutien des paysans et envisageait de mettre un terme aux opérations paramilitaires dans la région. Le gouvernement a ajouté qu'il chercherait à répondre aux préoccupations des paysans pour contribuer à restaurer la paix dans la région. Avec cette annonce, il semble que le gouvernement ait mis fin aux troubles paysans, mais des inquiétudes subsistent concernant les dirigeants naxalites qui ont réussi à s'échapper dans la clandestinité ces derniers jours."
Naxalbari.6.d:0 "Les Naxalites sont depuis plusieurs années une épine dans le pied du gouvernement. Le Premier ministre, profitant de la situation d'urgence, a récemment ordonné à l'armée de se coordonner avec les forces de l'ordre locales pour lancer une offensive totale contre le groupe. Une fois les forces requises organisées, l'opération Steeplechase a commencé. Les troupes indiennes, dont des parachutistes, des unités paramilitaires et des policiers, ont envahi le territoire contrôlé par les Naxalites. Des centaines de Naxalites ont été neutralisés et au moins 20 000 membres présumés sont en détention. L'opération est un succès retentissant, mais le gouvernement garde les détails secrets pour éviter l'inquiétude du public. Les médias sont informés de ne pas rendre compte de l'opération sous peine de poursuites pour atteinte à la sécurité nationale."
Naxalbari.7.d:0 "Charu Majumdar, fondateur du mouvement naxalite et principal idéologue du mouvement, est décédé alors qu'il était en détention à Calcutta. Les autorités pénitentiaires affirment qu'il est mort d'une grave crise cardiaque. La police a accompagné le corps jusqu'au crématorium où la famille l'a accueilli. La police a empêché la famille de voir le corps avant de superviser la crémation. La famille et les critiques du gouvernement affirment que Majumdar a probablement été tué sous la torture et condamnent le gouvernement pour meurtre politique. Majumdar a publié de nombreux ouvrages remarquables mais on se souviendra de ses Huit Documents, qui jettent les bases idéologiques du mouvement naxalite. Les Naxalites ont publié une déclaration promettant de poursuivre la lutte et de demander justice pour leur chef."

SINO_INDIAN_WAR.0.d:0 "Les différends frontaliers entre l'Inde et la Chine se sont intensifiés depuis 1947. L'Inde a accusé la Chine d'empiéter sur son territoire dans la zone frontalière du Nord-Est (NEFA) et de voler des terres indiennes en occupant l'Aksai Chin. Les Chinois, en revanche, prétendent que tous ces territoires sont historiquement chinois. Ils accusent également l'Inde d'interférer au Népal et au Sikkim pour préserver leurs propres revendications et intérêts. Ces tensions se sont récemment intensifiées après que le gouvernement chinois a publié une nouvelle carte confirmant son occupation de l'Aksai Chin et revendiquant la totalité de la NEFA comme sienne. Le Premier ministre indien a convoqué une réunion immédiate pour déterminer comment l'Inde réagirait à cette menace. Certains réclament un effort diplomatique, et si celui-ci échoue, un déploiement militaire. D'autres préconisent un déploiement militaire immédiat pour démontrer la détermination indienne face à la provocation chinoise."
SINO_INDIAN_WAR.1.d:0 "L'armée indienne a rapporté que des patrouilles chinoises avaient franchi la ligne McMahon et installé des avant-postes dans des zones stratégiques de la NEFA. La publication récente de cartes controversées, combinée à ces incursions, amène les responsables du renseignement à conclure que la Chine envisage peut-être de nous confisquer la NEFA. Les médias indiens condamnent le gouvernement et appellent à une ligne beaucoup plus dure à l'égard de la Chine. Nos forces surveillent les Chinois et il semble qu'ils tiennent actuellement le coup. Nous devons décider rapidement comment faire face à la provocation chinoise, que ce soit par des moyens diplomatiques ou militaires."
SINO_INDIAN_WAR.2.d:0 "Le gouvernement indien a dénoncé haut et fort nos récentes cartes, nous accusant d'occuper des terres indiennes et de revendiquer leur territoire. Les affirmations indiennes vont à l'encontre des faits historiques et sont fondées sur la propagande impérialiste britannique. Nous pensons que les Indiens tentent soit de sauver la face auprès de leur public, soit qu'ils nourrissent de dangereuses ambitions contre la Chine. Nous avons récemment reçu une invitation à tenir des négociations formelles sur les frontières controversées avec l'Inde. Même si nos revendications sont justes, il peut s'avérer utile d'écouter les Indiens et de comprendre leurs ambitions. De hauts responsables soutiennent que nous devrions assister aux négociations. D'autres au sein du gouvernement soutiennent que nous devrions simplement refuser de montrer à l'Inde que nous ne serons pas victimes d'intimidation."
SINO_INDIAN_WAR.3.d:0 "De hauts dirigeants chinois ont rencontré leurs homologues indiens pour discuter de leurs frontières controversées. Les pourparlers ont eu lieu à la suite d'une escalade diplomatique provoquée par la publication de cartes par le gouvernement chinois qui, selon l'Inde, plaçaient son territoire sous domination chinoise. En particulier, le gouvernement indien estime que la Chine empiète sur les frontières négociées par la Chine et le gouvernement colonial indien britannique et, dans le cas d'Aksai Chin, considéré comme faisant partie du Jammu-et-Cachemire par l'Inde, ils ont simplement saisi des terres indiennes. La Chine, en revanche, prétend occuper un territoire historiquement chinois et l'Inde n'a pas de revendications exclusives sur l'Aksai Chin en raison de la nature contestée du Cachemire. Les analystes ne sont pas sûrs que l'Inde puisse atteindre ses objectifs, car la Chine contrôle largement les territoires contestés."
SINO_INDIAN_WAR.4.d:0 "L'Inde a entamé nos discussions sur les différends frontaliers en appelant au retrait chinois d'Aksai Chin. Les Indiens affirment que le territoire fait historiquement partie du Jammu-et-Cachemire et que depuis que le souverain princier a annexé l'État à l'Inde, cette terre leur appartient. Nos propres diplomates ont noté que l'Inde n'avait aucune présence sur ce territoire, ni en termes de personnel ni de citoyens, et que c'était notre gouvernement qui avait établi des routes pour relier la région à la Chine. De plus, le Cachemire est un territoire faisant l'objet d'un différend international et l'Inde n'a pas de revendications exclusives. Nous n'avons pas l'intention d'abandonner l'Aksai Chin, c'est beaucoup trop important pour nous stratégiquement et nous y avons investi massivement. Cependant, nous proposerons un accord à l'Inde, ils devront accepter nos revendications sur l'Aksai Chin et nous retirerons nos propres revendications sur le territoire qu'ils appellent la zone frontalière du Nord-Est."
SINO_INDIAN_WAR.5.d:0 "Le gouvernement chinois a proposé un accord pour mettre fin à ses revendications sur la zone frontalière du Nord-Est (NEFA) en échange de la reconnaissance de son occupation d'Aksai Chin. La proposition appelle essentiellement à rendre les frontières actuelles permanentes et à mettre fin au conflit. La Chine finit certainement par gagner le plus, même si le fait d'avoir une frontière établie pourrait réduire la pression sécuritaire sur l'Inde. Cependant, de hauts conseillers préviennent que l'accord sera considéré comme une défaite pour l'Inde et que nous devrions faire une contre-offre. Après délibération, il a été décidé que nous demanderions à la Chine de confirmer également sa reconnaissance des frontières du Népal, du Bhoutan et du Sikkim. En outre, la Chine doit reconnaître l'Inde comme la puissance protectrice du Sikkim. Si la Chine accepte cela, un accord pourra certainement être conclu. Nous pouvons également rejeter cette solution clairement biaisée de la part des Chinois et reconnaître qu'ils n'ont jamais pris au sérieux les négociations."
SINO_INDIAN_WAR.6.d:0 "Le gouvernement indien nous a envoyé une contre-offre. Pour qu'ils acceptent nos revendications sur l'Aksai Chin et rendent permanente la frontière actuelle à la NEFA, ils ont besoin que nous confirmions les frontières actuelles du Bhoutan, du Sikkim et du Népal. De plus, ils veulent que nous reconnaissions le Sikkim comme faisant partie de la sphère d'influence indienne. Accepter cela entraverait grandement la flexibilité diplomatique future dans l'Himalaya, mais au moins nos affirmations ne feraient plus l'objet de critiques de la part de l'Inde. Si cela est important pour nous, nous devons accepter l'accord. Sinon, nous pouvons mettre fin aux négociations. Nous contrôlons déjà Aksai Chin et une grande partie de nos revendications sur la NEFA, donc l'échec de la signature d'un accord ne serait pas un désastre pour notre gouvernement."
SINO_INDIAN_WAR.7.d:0 "Malgré le scepticisme généralisé des experts, les dirigeants chinois et indiens ont signé un accord global pour résoudre leur différend frontalier. Dans l'accord final, l'Inde doit accepter le contrôle chinois d'Aksai Chin et de sa frontière actuelle dans la zone frontalière contestée de la NEFA. En échange, les Chinois doivent également accepter la frontière actuelle de la NEFA et mettre fin à leurs revendications sur l'ensemble du territoire indien. En outre, la Chine a accepté les frontières actuelles du Sikkim, du Népal et du Bhoutan, en utilisant les frontières établies par l'ancien gouvernement colonial britannique de l'Inde. L'accord semble être un véritable compromis. Le contrôle chinois sur l'Aksai Chin est légitimé alors que l'Inde a fermement établi son influence parmi les États himalayens."
SINO_INDIAN_WAR.8.d:0 "Les espoirs que l'Inde puisse négocier une solution à ses différends frontaliers avec la Chine se sont soldés par un échec. Le gouvernement chinois est accusé par les responsables indiens et les journaux d'avoir des visées territoriales hostiles à l'égard de l'Inde. Un éditorial particulièrement cinglant notait que les Chinois s'étaient emparés des terres indiennes depuis 1947 et que lorsque l'Inde cherchait à entamer des pourparlers pour tenter pacifiquement de mettre fin à cette agression, les Chinois se montraient peu coopératifs et satisfaits de leur vol. De plus en plus de voix s'élèvent pour que le gouvernement adopte une approche beaucoup plus ferme en déployant des troupes à la frontière. En Chine, la réponse a été largement modérée, les hauts responsables et les médias d'État déclarant que la Chine n'avait aucune ambition impérialiste et qu'elle ne se laisserait pas intimider par l'Inde pour lui céder le territoire historiquement chinois. Dans au moins un rapport, un haut responsable chinois a souligné que l'Inde devrait être reconnaissante que la Chine ne les expulse pas par la force du territoire chinois qu'ils continuent d'occuper."
SINO_INDIAN_WAR.9.d:0 "Suite à des informations selon lesquelles les Chinois déployaient lentement des troupes dans la NEFA, une réunion de haut niveau a été convoquée par le Premier ministre. Le Premier ministre a entendu de hauts responsables de la défense et des chefs militaires parler des projets visant à mettre en oeuvre la stratégie Forward Policy contre les infiltrés chinois. Forward Policy appelle les troupes indiennes à établir des postes derrière les forces chinoises pour les couper de leurs approvisionnements et forcer leur retrait. Le général B.M. Kaul, l'un des principaux défenseurs de cette stratégie, insiste sur le fait que la politique prospective est défensive et entraînera des retraits chinois, avec peu de risques de pertes. Il a estimé que l'armée chinoise était en grande partie une milice. Certains généraux de haut rang ont exprimé leurs inquiétudes quant à l'escalade du conflit et au maintien des forces indiennes isolées dans des postes avancés, mais le Premier ministre a finalement approuvé le plan de mise en oeuvre de la politique prospective au sein de la NEFA."
SINO_INDIAN_WAR.10.d:0 "La politique prospective a jusqu'à présent conduit au succès le long de la ligne McMahon. La plupart des incursions chinoises se sont retirées de l'autre côté de la ligne. L'armée indienne est ravie des résultats et propose maintenant un plan visant à établir des postes au nord de la ligne McMahon et à consolider nos revendications sur la région. De nombreux officiers estiment que ces opérations prouvent l'hypothèse selon laquelle les forces chinoises ne disposent pas des normes militaires modernes. Cependant, certains autres généraux de haut rang appellent à la prudence, affirmant que nous avons stabilisé les frontières et que nous ne devrions pas faire pression sur une armée chinoise expérimentée. Le premier ministre doit décider s'il veut aller de l'avant pour mettre enfin fin à la menace d'incursions chinoises."
SINO_INDIAN_WAR.11.d:0 "L'armée indienne a établi une série de postes sur notre territoire, au nord de la ligne McMahon. Les Indiens avaient affirmé que la ligne McMahon marquait notre frontière, mais cette incursion montre clairement qu'ils ont des intentions hostiles. Nos propres forces craignent que, depuis ces postes, les Indiens n'interdisent bientôt la circulation des renforts et des approvisionnements. Cependant, ces postes sont en grande partie isolés et si nous déplaçons des forces adéquates, ils peuvent utiliser des tactiques d'infiltration pour repousser les Indiens. La décision nous appartient : devons-nous chasser les Indiens ou les laisser nous repousser et établir une nouvelle ligne défensive."
SINO_INDIAN_WAR.12.d:0 "Le gouvernement indien a annoncé que ses forces avaient affirmé leur position au sein de la NEFA et neutralisé la menace chinoise sur son territoire. L'armée indienne a salué dans sa propre déclaration le professionnalisme de ses forces dans la conduite d'opérations difficiles. Le gouvernement chinois n'a publié aucune déclaration publique, mais ses diplomates critiqueraient l'Inde pour son action hostile. Il semble que le gouvernement chinois n'était pas disposé à se battre pour ce territoire. Une délégation chinoise se serait rendue à Delhi pour des pourparlers d'urgence."
SINO_INDIAN_WAR.13.d:0 "Une délégation chinoise est arrivée à Delhi pour tenir des entretiens d'urgence avec le Premier ministre sur les récentes violences le long de la frontière dans la NEFA. Les Chinois nous demandent de nous retirer jusqu'à la frontière d'avant-guerre de la ligne McMahon. Ils ont promis que si nous acceptons, ils veilleraient à ce que leurs forces ne commettent plus d'incursions et respectent la ligne. Ils ont suggéré qu'un refus pourrait amener la Chine à agir. La proposition semble raisonnable dans la mesure où nous demandons depuis longtemps que la ligne McMahon soit acceptée comme frontière. Cependant, nous avons actuellement l'avantage et il serait peut-être insensé de le laisser partir."
SINO_INDIAN_WAR.14.d:0 "Le gouvernement indien a montré ses ambitions impérialistes en refusant de restaurer les frontières. Malgré notre appel au rétablissement de la paix, les Indiens occupent désormais des terres chinoises dans lesquelles ils prétendaient n'avoir aucun intérêt auparavant. L'APL est prête à l'action et est prête à intervenir si elle en reçoit l'ordre. Nous devons décider si nous voulons lancer une offensive pour expulser les Indiens ou si nous devons simplement laisser la situation perdurer. Le peuple chinois se sent humilié. Le moment est peut-être venu d'agir et de rétablir l'ordre."
SINO_INDIAN_WAR.15.d:0 "Le gouvernement indien a été stupéfait d'apprendre que les troupes chinoises attaquaient les avant-postes indiens tout au long de nos positions dans la NEFA. Le gouvernement chinois a affirmé que l'APL intervenait pour rétablir l'ordre et la stabilité dans la région. L'armée indienne, bien que surprise, promet que ses forces sont plus que capables de faire face à la menace. Le gouvernement chinois a également déclaré que ses opérations visaient à donner à l'Inde une leçon d'humilité. Le gouvernement indien, en revanche, a condamné l'action chinoise, la qualifiant de continuation de ses actions hostiles depuis l'indépendance."
SINO_INDIAN_WAR.16.d:0 "Les Indiens et les Chinois sont actuellement impliqués dans un conflit armé. Beaucoup au sein du GHQ pensent que cela représente une opportunité pour le Pakistan de réaliser des gains au Cachemire. Le conflit a pris nos services de renseignement et nos militaires par surprise, nombre de nos forces étant actuellement en congé. Cependant, si nous donnons l'ordre maintenant, nous pouvons essayer de pousser depuis Haji Pir et Burzil et nous emparer du territoire au nord de Srinagar. Cette avancée améliorera considérablement notre position au Cachemire, mais ne provoquera pas les Indiens ou la communauté internationale au point de les condamner ouvertement. Cependant, si l'attaque échoue, nous risquons de subir des pertes imprévues. Nous devons prendre la décision de déployer ou non l'armée."
SINO_INDIAN_WAR.17.d:0 "L'armée indienne a signalé au Premier ministre que les forces indiennes avaient lancé une offensive limitée au Cachemire. Les premiers rapports de renseignement et de reconnaissance indiquent qu'il ne s'agit pas du début d'une invasion totale, mais plutôt d'une tentative opportuniste de gagner des frontières pendant que nous combattons la Chine. Nous tendons déjà la main aux grandes puissances pour protester contre cette agression pakistanaise, mais il semble qu'elles ne feront pas grand-chose compte tenu de sa portée limitée. Quoi qu'il en soit, nos forces réagiront et puniront les Pakistanais pour cette trahison. Cependant, nous devons être sûrs de ne pas oublier la menace chinoise. Le peuple doit se rallier à la nation."
SINO_INDIAN_WAR.18.d:0 "Les combats au Cachemire se sont calmés ces dernières heures. Des rapports récents indiquent qu'un nouveau cessez-le-feu est en place et qu'il semble que le Pakistan occupe désormais un territoire stratégique au nord de Srinagar. Des foules en liesse se rassembleraient dans les grandes villes du Pakistan suite à l'annonce du gouvernement selon laquelle certaines terres du Cachemire avaient été libérées. Le gouvernement indien a tenté jusqu'à présent de rester silencieux, mais il ressort clairement de déclarations privées qu'un revers s'est produit au Cachemire. Les analystes notent que le Pakistan a probablement amélioré sa position le long de la frontière, mais il est peu probable qu'il se soit emparé d'énormes quantités de terres, car cela aurait provoqué une guerre générale et une condamnation internationale. De nombreux journaux indiens condamnent le Pakistan pour ses coups dans le dos alors qu'il lutte contre l'invasion massive des communistes chinois."
SINO_INDIAN_WAR.19.d:0 "La récente offensive pakistanaise contre les forces indiennes dans le nord du Cachemire s'est soldée par un échec. Le Pakistan espérait profiter du conflit sino-indien en réalisant des gains au Cachemire. Le Pakistan espère établir une nouvelle position qui lui permettra de mieux libérer le Cachemire à l'avenir. Au lieu de cela, l'offensive pakistanaise a non seulement échoué, mais a vu les forces indiennes avancer et capturer le col stratégique de Burzil. Avec Burzil Pass sous contrôle indien, ils sont désormais en mesure de menacer Skardu. Le gouvernement pakistanais a reconnu qu'une offensive indienne non provoquée avait permis de réaliser des gains mineurs, mais les forces pakistanaises ont évité de nouvelles pertes. Les analystes estiment que l'armée pakistanaise s'est peut-être précipitée dans la bataille dans l'espoir de surprendre, mais cela s'est retourné contre eux. Des foules pakistanaises en colère se rassemblent, tandis que les médias indiens ne tarissent pas d'éloges sur les forces armées."
SINO_INDIAN_WAR.20.d:0 "Le gouvernement indien a déclaré que ses forces avaient éliminé les troupes chinoises envahissantes et établi une nouvelle ligne au nord de la ligne McMahon. L'Inde affirme qu'elle n'a agi qu'après des années de provocations chinoises. Le gouvernement chinois n'a pas tardé à condamner l'Inde pour son agression contre le peuple chinois et a affirmé que ses forces avaient simplement été prises au dépourvu et non vaincues au combat. L'armée indienne serait ravie de sa récente performance, non seulement en repoussant l'assaut chinois, mais aussi en les repoussant. Alors que le gouvernement chinois minimise l'ampleur des combats, de nombreux analystes pensent en privé que Pékin procédera probablement à une évaluation approfondie de ses forces militaires. L'Inde doit décider si elle veut occuper de façon permanente les terres qu'elle a conquises, au risque d'une guerre générale avec la Chine, si elle veut restituer ces terres pour des garanties de sécurité, ou bien exploiter son avantage et avancer plus profondément sur le territoire chinois."
SINO_INDIAN_WAR.21.d:0 "À la suite de nos récents affrontements avec une armée indienne agressive et astucieusement préparée, ils ont occupé des terres au-delà de ce qu'ils revendiquaient initialement. Ils l'appellent la frontière naturelle de leur territoire appelée North East Frontier Agency (NEFA). Les services de renseignement rapportent que les troupes indiennes creusent et établissent des chantiers de construction permanents. Nous devons décider comment agir : soit nous acceptons les gains indiens et rétablissons une ligne de cessez-le-feu, soit nous élargissons le conflit et déclenchons une guerre générale pour chasser les Indiens de ces terres." 
SINO_INDIAN_WAR.22.d:0 "Le gouvernement indien a dépêché un haut diplomate pour transmettre un message en privé. Si nous acceptions la ligne McMahon d'avant le conflit comme frontière permanente et retirons publiquement nos revendications sur les terres au sud de la soi-disant ligne McMahon. La proposition semblait raisonnable et notre gouvernement l'a acceptée, bien qu'une nouvelle demande de retrait d'Aksai Chin ait été rejetée. Au cours des jours suivants, l'armée indienne a retiré ses forces tandis que nos troupes retournaient dans la région. Nos commandants ont pour instructions strictes d'obéir à la ligne établie avant le conflit, car les Indiens ont clairement fait savoir que le non-respect de cette règle pourrait entraîner une nouvelle attaque. Les Indiens se réjouissent de leur succès tandis que nous devons découvrir ce qui n'a pas fonctionné."
SINO_INDIAN_WAR.23.d:0 "Le Premier ministre indien a félicité le peuple indien et les forces armées pour leur courage inébranlable face à l'agression chinoise massive à la frontière. Dressant un tableau désastreux, le Premier ministre a souligné que les Chinois n'étaient qu'à des kilomètres d'atteindre les plaines de l'Inde et de ravager la nation avant que l'armée indienne ne les vainque. Ces remarques font suite à des informations selon lesquelles l'Inde aurait repoussé avec succès une offensive chinoise le long de sa frontière contestée au sein de l'Agence de la frontière du Nord-Est. Le gouvernement chinois a minimisé les récents revers, accusant l'Inde d'être l'agresseur et exagérant grossièrement l'ampleur des combats. Les médias chinois décrivent les combats comme une escarmouche mineure, mais les analystes estiment que la vérité se situe entre les deux histoires présentées."
SINO_INDIAN_WAR.24.d:0 "L'APL a réussi à repousser les troupes indiennes qui occupaient nos terres et a même pénétré profondément dans la NEFA. Certains rapports qualifient la défaite indienne de désastreuse et affirment que la Chine a pratiquement complètement occupé la NEFA. Ces rapports ne sont pas si loin : nos forces contrôleront bientôt la NEFA et sont sur le point d'infliger un coup dévastateur à l'Inde proprement dite. Cependant, cela pourrait provoquer une intervention internationale et nos commandants ne sont pas sûrs que nous ayons la capacité logistique d'envahir un si grand pays. Nous pouvons soit poursuivre et ouvrir le conflit, revendiquer la NEFA et risquer que l'Inde étende le conflit, soit simplement annoncer un cessez-le-feu et revenir à ce que nous considérons comme les frontières d'avant-guerre pour maximiser le succès psychologique, diplomatique et militaire de nos forces."
SINO_INDIAN_WAR.25.d:0 "Le Sikkim a longtemps été une marionnette du gouvernement indien. Son peuple est contrôlé par un prince fantoche placé là par les impérialistes britanniques et entretenu par l'État successeur indien. Le territoire offre à l'Inde un avantage pour nous espionner et son statut d'État « indépendant » en fait un parfait tampon pour eux. Alors que notre conflit en Inde s'intensifie, il est peut-être dans notre intérêt de ne plus accepter le mythe du Sikkim et de ses frontières artificielles. L'APL est prête à intervenir et à libérer son peuple de la tyrannie locale et de l'hégémonie indienne. Cependant, le choix de ce qu'il faut faire du Sikkim revient en fin de compte au président et au Politburo."
SINO_INDIAN_WAR.26.d:0 "À la suite de nos revers lors du récent conflit frontalier avec la Chine, nous avons perdu l'Agence des frontières du Nord-Est. Les Chinois ont attaqué avec une puissance écrasante et meurtrière, prenant nos forces par surprise pour s'emparer des terres. Les rapports des services de renseignement indiquent que les Chinois creusent actuellement sur le territoire et déplacent du matériel pour établir des structures permanentes afin de consolider leurs revendications. L'armée indienne admet qu'elle a été touchée lors du récent conflit, mais si elle est appelée à le faire, elle ripostera. Nous pouvons ordonner à l'armée d'intensifier le conflit et de lancer une attaque totale pour repousser les envahisseurs, ou nous pouvons laisser la situation telle quelle et laisser ces combats prendre fin."
SINO_INDIAN_WAR.27.d:0 "Le gouvernement chinois a annoncé un cessez-le-feu et a retiré ses forces vers la frontière d'avant-conflit avec l'Inde, le long de la ligne dite McMahon. Cette nouvelle a stupéfié le gouvernement indien qui avait récemment lancé un appel désespéré à l'aide pour faire face à ce qu'il qualifie d'agression chinoise. Le gouvernement chinois a insisté sur le fait que ses forces agissaient de manière défensive et que, comme la Chine n'était pas une puissance impériale, elle n'avait aucune envie d'envahir ou d'occuper une autre nation. Les analystes suggèrent que les actions chinoises marquent une victoire diplomatique et militaire. En ne saisissant pas de terres, la Chine a miné l'argument indien selon lequel elle faisait face à une invasion massive de la Chine. De plus, en montrant publiquement que leurs forces se retiraient de l'Inde sans aucune menace, cela met en évidence l'ampleur de leurs succès militaires dans le conflit. Les médias indiens publient déjà des articles critiques et des sources indiquent que le gouvernement indien envisage de procéder à une profonde introspection."
SINO_INDIAN_WAR.28.d:0 "Le récent conflit entre l'Inde et la Chine le long de leur frontière contestée au sein de l'Agence de la frontière du Nord-Est s'est soldé par une victoire militaire chinoise. L'armée indienne s'est révélée incapable de remplir cette tâche et est considérée comme mal équipée et mal dirigée pendant le conflit. De nombreux Indiens pensent que cet échec à fournir et à diriger des soldats hautement motivés et entraînés est le résultat d'une complaisance et des influences coloniales persistantes sur l'institution. Pour la Chine, la victoire militaire est considérée comme la confirmation que l'APL est capable non seulement de mener des guerres massives, mais aussi de faire face aux menaces localisées à ses frontières. Beaucoup suggèrent désormais que les combats en Inde offrent un modèle qui peut être utilisé dans d'autres zones frontalières difficiles. Les dirigeants chinois sont ravis de la coordination réussie des pouvoirs diplomatique, militaire et politique pour parvenir au succès."
SINO_INDIAN_WAR.29.d:0 "Le gouvernement indien a lancé un appel désespéré, appelant à une aide militaire importante pour renforcer l'armée indienne face à la menace de la Chine communiste. Les rapports des services de renseignement avertissent qu'une avancée communiste en Inde pourrait inciter les communistes indiens à abandonner le gouvernement et à briser l'unité indienne. Ils suggèrent que nous devrions fournir une aide militaire, en particulier aux unités de guerre en montagne, afin de renforcer leurs défenses et de les aider à empêcher une profonde pénétration communiste. Bien qu'il semble naturel que nous aidions l'Inde contre un ennemi communiste, certains membres de l'administration préviennent que le gouvernement indien a toujours été froid envers l'Occident. En outre, fournir une telle aide provoquerait une réaction de colère de la part du Pakistan. Nous devons décider comment agir."
SINO_INDIAN_WAR.30.d:0 "Des équipements d'urgence d'armes occidentales sont arrivés pour aider l'armée indienne dans sa défense contre la Chine. Même si notre gouvernement a demandé une aide beaucoup plus importante et a appelé les bombardiers occidentaux à cibler les Chinois, ce soutien améliorera nos capacités. Le ministère de la Défense supervisera l'intégration de ces équipements dans nos forces et nous avons envoyé un message de gratitude aux États-Unis. Le Pakistan est furieux de cette décision, mais ce n'est pas grave, l'Inde a besoin de ce soutien pour se défendre. Les militants communistes indiens condamnent également cette action, mais nous avons informé le public que notre acceptation d'une telle aide ne signifie pas que nous avons rejoint le camp occidental."
SINO_INDIAN_WAR.31.d:0 "Alors que le conflit entre l'Inde et la Chine se transforme en guerre totale, nous avons peut-être une opportunité à saisir. Nous pouvons mobiliser nos forces et attaquer l'Inde car elle est sans aucun doute distraite par ce conflit. Beaucoup estiment qu'une frappe forte pourrait sécuriser le Cachemire et peut-être résoudre certains des problèmes territoriaux persistants liés à la partition. Certains dans le pays appellent déjà le gouvernement à saisir cette occasion en or. Cependant, d'autres membres du gouvernement appellent à la prudence. Ils craignent que si nous rejoignons la guerre, nous puissions nous retrouver isolés sur le plan international et perdre le soutien essentiel de l'ONU au Cachemire."
SINO_INDIAN_WAR.32.d:0 "L'ambassadeur américain a convoqué le président pour un entretien privé. L'ambassadeur a donné un avertissement sévère indiquant que les États-Unis étaient au courant de nos projets de se joindre à la guerre contre l'Inde. Il a ajouté que si une telle mesure était prise, les États-Unis cesseraient toute aide militaire et économique. Cela ferait également pression sur ses alliés pour qu'ils mettent fin à leur propre soutien, ce qui paralyserait notre économie et affaiblirait gravement l'armée. Les États-Unis ne peuvent pas tolérer qu'un de leurs alliés régionaux se joigne à une nation communiste dans une guerre d'agression. Après avoir donné cet avertissement, le président a convoqué une réunion d'urgence du cabinet. Après une brève discussion, il a été décidé que les projets actuels de participation à la guerre seraient abandonnés."
SINO_INDIAN_WAR.33.d:0 "Dans un rare acte de coopération, les États-Unis et l'Union soviétique ont tous deux exercé une pression intense, soit indirectement, soit directement sur la Chine et l'Inde. Ils font pression sur les deux parties pour qu'elles mettent rapidement fin aux combats actuels et rétablissent la paix dans la région. Jusqu'à présent, les deux gouvernements résistent à la pression des superpuissances. Cependant, la communauté internationale s'inquiète davantage des conséquences humanitaires ou géopolitiques potentielles de la guerre si elle dure trop longtemps. En privé, les dirigeants chinois et indiens informent leurs commandants qu'ils doivent obtenir des résultats le plus rapidement possible."
SINO_INDIAN_WAR.34.d:0 "Les Nations Unies ont annoncé l'entrée en vigueur d'un cessez-le-feu entre la Chine et l'Inde. Le récent conflit s'est intensifié à la suite d'une série d'affrontements frontaliers le long de la ligne McMahon, dans l'est de l'Himalaya. Ce conflit frontalier a dégénéré en guerre générale, mais la communauté internationale a rapidement exercé de fortes pressions pour mettre fin aux combats. On craignait les conséquences humanitaires d'une guerre totale entre les deux plus grandes populations. Les prochains jours connaîtront les résultats définitifs du conflit."
SINO_INDIAN_WAR.35.d:0 "Suite au cessez-le-feu de l'ONU, il est clair que l'Inde a dominé l'ancienne ligne McMahon. Les troupes chinoises ont été en grande partie chassées et le gouvernement indien affirme qu'il maintiendra le contrôle afin de protéger la zone frontalière du Nord-Est d'une future agression chinoise. Le gouvernement chinois a publié une brève déclaration condamnant le militarisme indien et les ambitions impérialistes. Pékin revendiquait depuis longtemps le territoire, y compris la totalité de la NEFA, mais après ce revers, il doit faire face au contrôle indien de la région."
SINO_INDIAN_WAR.36.d:0 "L'Inde avait condamné avec véhémence l'occupation chinoise d'Aksai Chin lorsqu'elle avait découvert que la Chine avait construit des autoroutes reliant la région à la Chine. L'Inde a fait valoir que la terre faisait historiquement partie du Cachemire et donc sous contrôle indien. La Chine n'était pas d'accord, revendiquant la terre comme étant historiquement chinoise et notant que le Cachemire était contesté, niant toute prétention indienne d'autorité complète. Pendant le conflit de Cent, l'armée indienne a réussi à déloger les forces chinoises et à occuper Aksai Chin pour la première fois dans l'histoire de l'Inde. Une fois le cessez-le-feu en vigueur, le gouvernement indien a annoncé qu'il avait libéré les terres du Cachemire et chassé l'un des occupants étrangers de l'ancien État princier. Il ajoutait que la libération complète serait une question de temps. Cette dernière déclaration a provoqué la colère des dirigeants pakistanais qui ont publié un communiqué de protestation. Les observateurs notent qu'avec sa victoire à Aksai Chin, le Pakistan est désormais plus isolé diplomatiquement en ce qui concerne le Cachemire et que la Chine a perdu un lien clé entre ses principales terres et le Xinjiang."
SINO_INDIAN_WAR.37.d:0 "Constituant un revers majeur pour la Chine, le gouvernement indien victorieux a annoncé la création d'un nouveau gouvernement provisoire au Tibet à la suite d'un cessez-le-feu de l'ONU qui a mis fin à leur récent conflit. Le nouveau gouvernement de Lhassa doit faciliter le retour d'un État tibétain indépendant. L'avancée réussie des forces indiennes a poussé les Chinois à un point tel que leur présence au Tibet apparaît de plus en plus intenable. De nombreux États occidentaux n'ont pas tardé à saluer cette décision et le Dalaï Lama préparerait son retour à Lhassa. Le gouvernement chinois condamne l'installation d'un régime fantoche et, en privé, on craint que le Tibet ne se perde définitivement. À Lhassa, on rapporte que des civils font la fête sous le regard des troupes indiennes, assurant ainsi la sécurité de l'atmosphère festive."
SINO_INDIAN_WAR.38.d:0 "Après la fin des combats entre la Chine et l'Inde suite à un cessez-le-feu négocié par l'ONU, les Chinois ont annoncé qu'ils étaient en pleine possession de leurs revendications légitimes le long de leur frontière orientale. Le gouvernement indien est resté muet, mais en privé, certains responsables ont admis que les Chinois contrôlent totalement non seulement la ligne McMahon, mais également l'ensemble de l'Agence de la frontière du Nord-Est. L'absence de réaction indienne et l'immense pression internationale qui a conduit à un cessez-le-feu indiquent que l'Inde devra probablement accepter le recul territorial."
SINO_INDIAN_WAR.39.d:0 "La fin des combats entre l'Inde et la Chine a vu les forces chinoises envahir une grande partie du Cachemire indien. Les Chinois sont accueillis en libérateurs par certains Cachemiriens, les troupes chinoises étant accueillies par des drapeaux cachemiris, pakistanais et chinois faits maison. Cela a récemment donné lieu à des photos de propagande embarrassantes et à des incidents où des officiers pakistanais agissant en tant qu'« observateurs » rendaient visite aux dirigeants cachemiriens. Le gouvernement chinois a augmenté la mise en déclarant qu'il se retirerait bientôt du Cachemire, mais à la condition que l'Inde applique les résolutions de l'ONU sur le Cachemire et organise un plébiscite. L'alternative est que la Chine continue d'occuper le Cachemire ou, plus probablement, qu'elle cède le territoire au Pakistan. Le gouvernement indien devrait bientôt annoncer son intention d'organiser un plébiscite, ce qui déclencherait un retrait chinois et un nouvel avenir pour le Cachemire."
SINO_INDIAN_WAR.40.d:0 "Lors du récent conflit entre l'Inde et la Chine, l'APL a réussi à s'emparer du Sikkim. Les Chinois ont décrit la conquête comme une libération d'un régime fantoche corrompu soutenu par l'Inde. Le gouvernement indien a qualifié cela de simple accaparement de terres et a appelé la population du Sikkim à rester forte pendant cette période difficile. Quoi qu'il en soit, les Chinois conservent un contrôle ferme sur le Sikkim et annoncent déjà des projets d'intégration de l'ancien État princier sur le modèle de ce que le gouvernement a fait au Tibet. L'ancienne famille royale du Sikkim a fui vers Delhi et tient des conférences de presse avec les médias indiens et internationaux."
SINO_INDIAN_WAR.41.d:0 "Le gouvernement chinois a officiellement confié le pouvoir à un nouveau gouvernement cachemirien indépendant à Srinagar. Les Chinois ont affirmé que le peuple cachemirien était resté pendant des années sous le régime autocratique d'un monarque soutenu par les Britanniques, pour ensuite être victime de l'impérialisme indien et pakistanais. Le nouveau gouvernement du Cachemire a publié sa propre déclaration affirmant que, pour la première fois depuis 1947, tout le Cachemire était sous un seul gouvernement. Il a ajouté que pour la première fois de son histoire, la province serait sous le contrôle du peuple cachemirien. Il s'agit du dernier coup porté au Pakistan et à l'Inde après leur défaite militaire contre la Chine. Le nouvel État du Cachemire offre à la Chine un tampon stratégique et affaiblit considérablement la position géopolitique des États vaincus. L'Inde et le Pakistan ont tous deux publié des déclarations exprimant leur déception face à cette évolution."

CMC_Sino_India_War.260.d:0 "Le gouvernement chinois a capitulé devant la pression internationale pour mettre fin à sa guerre contre l'Inde. Une coalition internationale, comprenant les États-Unis et l'Union soviétique, s'est récemment formée en réponse à l'invasion croissante de l'Inde par la Chine. La puissante coalition antichinoise appelle la Chine à mettre un terme à sa guerre et à restaurer le territoire indien. Le gouvernement indien a salué cette nouvelle, la qualifiant de victoire pour la paix et de son soutien inébranlable à la coopération internationale. Les Chinois seraient amers face à cette nouvelle. Des publications de premier plan qualifient la coalition de complot néo-impérialiste destiné à retenir la Chine."

India_Pak_War_65.1.d:0 "Nous nous adresserons bientôt à l'ONU pour convenir d'un cessez-le-feu afin de mettre fin à la guerre actuelle contre le Pakistan. Nos hauts responsables et chefs militaires suggèrent que la poursuite du conflit ne changera pas beaucoup la situation actuelle sur le terrain. Notre peuple et nos militaires ont combattu avec un courage et une discipline immenses. L'agression pakistanaise s'est heurtée à notre plus forte résistance et nous ne pouvons pas en espérer davantage. Il est désormais de notre devoir de mettre fin au conflit et aux combats."
India_Pak_War_65.2.d:0 "Nos forces armées ont donné une réponse appropriée à la récente agression du Pakistan. Le résultat de leur folie est clair pour le monde entier. Cependant, un conflit sans fin et une course aux armements en Asie du Sud ne constituent pas le destin que nos fondateurs envisageaient pour l'Union indienne. Maintenant que nous avons le dessus, le moment est venu pour nous de tendre la main et d'offrir des liens fraternels avec le Pakistan. Cela permettrait également de confirmer le nouvel ordre politique en Asie du Sud. Au niveau international, une telle approche sera largement appréciée."
India_Pak_War_65.3.d:0 "Le gouvernement indien a officiellement demandé des pourparlers avec notre gouvernement. Les Indiens affirment vouloir rétablir les relations et mettre fin aux années d'animosité depuis la partition. Il est probable que les Indiens souhaitent normaliser leurs relations et établir des liens commerciaux plus solides. Certains de nos conseillers estiment que cela pourrait aider notre économie qui est ébranlée par la récente guerre et ses pertes. En outre, cela pourrait renforcer le soutien des éléments libéraux de la société. Cependant, l'Inde capitalise probablement sur ses récents succès militaires et s'engager avec elle pourrait être considéré comme une reconnaissance de notre position de faiblesse. Il vaudrait peut-être mieux, pour le moral de notre peuple, rejeter cette initiative et se concentrer sur nos efforts de reconstruction. Nous devons décider comment réagir."
India_Pak_War_65.4.d:0 "Lors de nos entretiens avec l'Inde, ils ont proposé une normalisation complète des relations ainsi qu'un accord visant à assouplir les restrictions à l'immigration. L'accord améliorerait les relations, notamment commerciales. Notre propre population serait probablement favorable à un assouplissement de l'immigration, ce qui permettrait de réunir des familles et des amis longtemps séparés par la partition et offrirait à certains citoyens la possibilité de récupérer leurs propriétés perdues. Cependant, il existe une certaine résistance, notamment parmi les officiers supérieurs de l'armée, qui estiment que la meilleure approche serait de se retirer des pourparlers et d'y mettre un terme. Cela équivaudrait à affirmer le défi pakistanais. Nous devons décider comment réagir."
India_Pak_War_65.5.d:0 "Nos récents efforts visant à normaliser les relations avec le Pakistan se sont soldés par un succès. Les Pakistanais ont accepté de signer une série d'accords qui amélioreront le commerce, normaliseront les relations et assoupliront les restrictions à l'immigration. La nouvelle de l'accord est déjà accueillie positivement au niveau national et international. Le monde considère désormais que l'Inde est un nouveau type de puissance. Les Indiens et les Pakistanais peuvent désormais devenir comme les frères et soeurs qu'ils sont censés être. Nous ne sommes pas une puissance militariste ou impérialiste, mais plutôt une nation épris de paix et dévouée à une paix continue."
India_Pak_War_65.6.d:0 "Les efforts indiens pour normaliser leurs relations avec le Pakistan se sont soldés par un échec embarrassant. Les Pakistanais ont condamné les Indiens pour avoir cherché à consolider leurs récents succès et à faire du Pakistan une marionnette indienne. Le gouvernement pakistanais a publié une autre déclaration affirmant qu'il n'abandonnerait jamais son désir de libérer le peuple du Cachemire et d'empêcher l'Inde de devenir une puissance hégémonique en Asie du Sud. Le gouvernement indien a répondu en affirmant que le Pakistan politisait un véritable effort de paix et qu'il avait seulement révélé son désir de guerre."
India_Pak_War_65.7.d:0 "Les revers militaires de notre récente guerre avec le Pakistan ont révélé des problèmes systémiques. Le Parlement, peu après la fin du conflit, a créé une commission chargée d'étudier ces déficiences militaires et d'élaborer des solutions. Leurs conclusions ont été soumises au Premier ministre qui doit décider quelle recommandation mettre en oeuvre. Le Premier ministre doit faire preuve de prudence, car une action trop drastique pourrait nuire à la santé institutionnelle de l'armée. Le comité a finalement blâmé l'héritage colonial arriéré hérité des Britanniques. Cela a conduit à une politique de recrutement qui exclut une grande partie de la population. En outre, cela a amené un certain nombre d'officiers supérieurs à atteindre leurs rangs en grande partie grâce à leur service dans l'armée coloniale britannique indienne. Une solution consiste à introduire des réformes dans le recrutement, ce qui nous permettrait d'utiliser plus efficacement notre immense main-d'oeuvre. L'autre solution consiste à licencier un certain nombre d'officiers de l'armée et à ouvrir la voie à l'émergence d'officiers plus créatifs et plus professionnels. Nous devons décider quelle réforme est la plus importante, car faire les deux pourrait s'avérer catastrophique."
India_Pak_War_65.8.d:0 "Après avoir rendu public le rapport du comité sur les récents échecs militaires, le premier ministre a décidé d'agir. Il a annoncé le limogeage d'un grand nombre d'officiers supérieurs, notamment des brigadiers, des généraux de division, des lieutenants généraux et des généraux. Cela ouvrira la voie à l'ascension des jeunes officiers. La réponse militaire a été muette, mais en privé, de nombreux officiers seraient furieux. Quoi qu'il en soit, le public soutient largement ces mesures, les considérant comme nécessaires. Il s'agit sans aucun doute d'un jour incroyablement difficile pour l'Inde, mais sans ces actions, l'Inde ne pourra pas connaître la renaissance nécessaire pour surmonter ses récents revers."
India_Pak_War_65.9.d:0 "Le gouvernement indien a annoncé une série de réformes destinées à élargir la base de recrutement et à mieux relier l'armée à la population indienne. Le gouvernement a ajouté qu'il suivait les recommandations formulées récemment par la commission parlementaire enquêtant sur les récents échecs militaires. De nombreux Indiens soutiennent fermement cette décision, car beaucoup estiment que l'armée continue de s'accrocher aux pratiques coloniales en ce qui concerne son recrutement et son organisation. Les nouvelles réformes élargiront la base de recrutement et établiront davantage de programmes de formation dans les établissements d'enseignement civils. Le gouvernement indien a ajouté que ces réformes aideront la nation à maximiser sa vaste population et ses ressources pour mieux assurer la défense et l'honneur de l'Inde."

Jammue_Refugee_Crisis.1.d:0 "L'insistance du Pakistan à s'emparer du Cachemire a donné lieu à la plus grande crise de réfugiés depuis la partition. Les Cachemiriens hindous affluent vers le Pendjab. Selon certaines informations, des musulmans cachemiriens enhardis s'emparent de leurs propriétés et menacent la communauté hindoue. Les réfugiés sont placés dans des camps temporaires avant de pouvoir être réhabilités. L'arrivée des réfugiés suscite la colère et les esprits communautaires. Les autorités locales déploient des policiers supplémentaires pour prévenir les violences. Leur présence renouvelle également les critiques à l'encontre du gouvernement pour sa performance pendant la guerre."
IND_BAN.22.d:0 "Notre offensive ratée au Pakistan oriental a provoqué une révolte ouverte et des émeutes parmi les réfugiés bengalis et leurs partisans à Calcutta. La réaction est motivée par un véritable désespoir et par les pressions provoquées par l'afflux massif de réfugiés depuis le début de la crise. Les autorités locales ont demandé le soutien des unités militaires locales pour maintenir la paix. De nombreux magasins et bâtiments ont été endommagés lors des violences, les rapports locaux les qualifiant de pires violences depuis la partition. Des habitants appellent désormais le gouvernement à expulser les réfugiés. Nous devrons faire face à des tensions au Bengale dans un avenir prévisible."


INDIA_KAS60s.0.d:0 "Il y a quelques jours, Srinagar a déclenché des manifestations massives à la suite d'informations selon lesquelles une relique sacrée avait été volée dans le célèbre sanctuaire Hazratbal. Les musulmans du Cachemire sont immédiatement descendus dans la rue pour condamner le vol et les manifestations se sont rapidement transformées en agitation anti-indienne. Les tensions communautaires au Cachemire s'intensifient alors que les rumeurs selon lesquelles la communauté hindoue aurait organisé le vol se répandent parmi les musulmans du Cachemire. Le gouvernement indien a été pris au dépourvu par ces manifestations et se demande comment réagir. Les autorités locales sont inquiètes et souhaitent déployer des policiers et des troupes pour réprimer les troubles. Cependant, les membres du cabinet et du gouvernement central estiment qu'une telle approche musclée pourrait attiser les tensions. Ils suggèrent plutôt que le gouvernement demande une enquête complète et exprime sa compréhension des troubles."
INDIA_KAS60s.1.d:0 "Plusieurs semaines après que le gouvernement indien a annoncé qu'il déployait sa principale unité d'enquête, le Bureau central d'enquête, pour retrouver la relique volée au Cachemire, celle-ci a été retrouvée hier. Les gouvernements indien et cachemirien n'ont pas expliqué comment la relique a été récupérée, mais ont exprimé leur satisfaction. Les temples hindous et les mosquées ont organisé des prières de remerciement pour aider à réduire les tensions communautaires dans la région. De nombreux Cachemiriens, en particulier ceux liés au gouvernement, sont satisfaits des résultats, mais l'animosité persiste à l'égard du gouvernement indien en raison de son incapacité à mettre fin au vide politique dans lequel le Cachemire reste. Parmi les Cachemiriens les plus anti-indiens, ils répandent des rumeurs selon lesquelles la relique récupérée était une contrefaçon créée par le gouvernement."
INDIA_KAS60s.2.d:0 "En réponse au vol d'une relique sacrée musulmane à Srinagar, les musulmans du Cachemire ont commencé à s'agiter en signe de frustration face au vol, mais ont également maintenu la domination indienne sur la vallée du Cachemire. Nombreux sont ceux qui expriment leur colère face au vide politique dans lequel vivent les Cachemiriens depuis 1947. Les tensions communautaires se sont également accrues en raison des rumeurs d'implication des hindous dans le vol et de leur proximité perçue avec le gouvernement indien. En réponse aux troubles, le gouvernement indien a déployé des troupes ainsi que des policiers armés. Cette approche brutale a fini par attiser les tensions lorsque les musulmans ont remarqué que des troupes étaient déployées pour protéger les temples hindous, attisant ainsi les troubles communautaires et politiques. La relique sacrée a été récupérée hier, mais les espoirs que cela mettrait immédiatement fin aux manifestations ont été anéantis alors que les Cachemiriens de Srinagar continuent de s'agiter contre leur impasse politique actuelle."
INDIA_KAS60s.3.d:0 "Au cours des derniers mois, des soldats et des policiers indiens ont arrêté des agitateurs dans tout le Cachemire. Ces hommes ont été identifiés par le gouvernement comme étant des meneurs impliqués dans le mécontentement et les tensions communautaires dans la province. Bien que le nombre de protestations ait diminué suite à la récupération de la relique sacrée volée, cette dernière vague d'arrestations a déclenché une nouvelle série de manifestations. De nombreux dirigeants politiques du Cachemire critiquent désormais le gouvernement indien pour avoir eu recours à la force plutôt qu'au dialogue pendant une période de tensions accrues. Les médias à travers l'Inde soutiennent largement cette ligne dure face à ce que le gouvernement a décrit comme une anarchie générale."
INDIA_KAS60s.4.d:0 "Suite aux récentes tensions au Cachemire, le gouvernement indien a réalisé que la population cachemirienne était de plus en plus frustrée face à la situation actuelle. Dans le cadre des efforts visant à remédier à cette situation, le gouvernement indien a annoncé qu'il libérerait le célèbre dirigeant politique cachemirien Cheikh Abdullah. L'ancien Premier ministre du Jammu-et-Cachemire purgeait une peine de prison de longue durée pour avoir prétendument comploté contre l'Inde en vue de créer un État indépendant du Cachemire. À sa libération, Cheikh Abdallah s'est engagé à travailler avec le gouvernement indien et à garantir que les droits et les souhaits du peuple cachemirien soient toujours satisfaits. Cette action contribuera à atténuer certaines frustrations parmi les Cachemiriens qui saluent le retour d'un homme appelé Sher-e-Kashmir (Lion du Cachemire)."
INDIA_KAS60s.5.d:0 "Les récents bouleversements religieux et politiques ont provoqué d'importants troubles communautaires au Pakistan oriental et au Bengale occidental. Au Pakistan oriental, les manifestants ont condamné ce qu'ils considèrent comme une attaque contre l'islam et la répression continue des musulmans du Cachemire par l'État indien. Ces manifestations se sont transformées en émeutes communautaires lorsque les manifestants ont commencé à attaquer les quartiers hindous. Lorsque les habitants du Bengale occidental ont entendu parler de ces attaques, ils ont lancé leurs propres manifestations et pris pour cible les quartiers musulmans, provoquant des émeutes. L'ampleur de la violence est loin d'être comparable aux émeutes communautaires de la Partition, mais nombreux sont ceux qui, en Inde, craignent que de nouveaux incidents n'aggravent la situation. Le Bengale est actuellement calme, mais les tensions communautaires entre hindous et musulmans sont exacerbées."
INDIA_KAS60s.6.d:0 "Le Parlement débat de l'opportunité d'invoquer les articles 356 et 357 au Jammu-et-Cachemire. Cela suspendrait le gouvernement de l'État et permettrait au centre d'imposer un pouvoir direct sur la province, lui permettant ainsi d'assumer l'autorité législative. Imposer le règne de l'État permettra au gouvernement de modifier la constitution de l'État du Cachemire, de supprimer une partie de l'autonomie accordée par l'article 370 et de rendre l'État plus conforme à la Constitution indienne. Compte tenu des récents troubles au Cachemire, nombreux sont ceux en Inde qui estiment que cette action est essentielle pour empêcher un complot cachemirien ou pakistanais visant à saper la domination indienne. De nombreux hommes politiques cachemiris, même pro-indiens, s'opposent avec véhémence à cette action et affirment qu'une telle décision serait considérée comme une trahison de la part des Cachemiriens et cimenterait leur animosité envers l'Inde."
INDIA_KAS60s.7.d:0 "Le parlement indien a voté pour invoquer le pouvoir direct sur le Cachemire en utilisant les articles 356 et 357 de la constitution. Cette décision est considérée comme une action essentielle pour garantir la loyauté du Cachemire et la poursuite de son intégration à l'Inde. Le gouvernement affirme que le gouvernement direct permettra au centre de garantir que le Cachemire fonctionne comme un État productif capable d'apporter progrès et développement à la population du Cachemire. Les dirigeants politiques du Cachemire ont largement condamné cette action, arguant que l'Inde avait trahi sa promesse en 1949 de préserver l'autonomie du Cachemire. Bien qu'il existe un ressentiment parmi les Cachemiriens, jusqu'à présent, aucune manifestation ou trouble de masse n'a été signalé."
INDIA_KAS60s.8.d:0 "Le Parlement indien a adopté une série de lois et d'amendements à l'économie de l'État du Cachemire qui ont largement sapé les garanties de l'article 370 concernant l'autonomie interne. Le poste de Premier ministre a été aboli, pour être remplacé par les titres de gouverneur et de ministre en chef afin de garantir la cohérence du Cachemire avec les autres États indiens. Le gouvernement indien a rejeté les critiques de nombreux dirigeants politiques du Cachemire et du Pakistan selon lesquelles il reviendrait sur ses promesses. Au contraire, affirme le gouvernement indien, sans ces réformes, les Cachemiriens ne bénéficieront pas des fonds de développement et des réformes démocratiques dont bénéficient d'autres États indiens. Certains dirigeants cachemiriens soutiennent ces efforts, ce qui entraîne des divisions au sein de la Conférence nationale du Jammu-et-Cachemire. Le gouvernement indien insiste sur le fait que ses actions visent à améliorer le pays et ne portent pas atteinte à ses engagements envers les Cachemiriens ou la communauté internationale."
INDIA_KAS60s.9.d:0 "La Conférence nationale du Jammu-et-Cachemire, le parti politique légal qui milite pour la préservation de l'autonomie du Cachemire, a récemment voté sa dissolution. Il s'agit de la première étape d'un projet visant à fusionner le parti en tant que branche du Congrès national indien. La Conférence nationale estime que ce n'est qu'en travaillant avec le gouvernement central et un parti national qu'elle pourra garantir la préservation continue de l'autonomie du Cachemire en Inde. Ils affirment que l'absence de tels contacts a conduit à l'imposition récente d'un régime étatique. Cependant, cette action a provoqué la séparation d'une faction rivale de la Conférence nationale. Ce groupe, dirigé par des partisans de Cheikh Abdallah, a formé un groupe appelé Front du Plébiscite. Le Front du Plébiscite plaide pour la mise en oeuvre du Plébiscite parrainé par l'ONU pour déterminer l'avenir du Cachemire. La division du Cachemire "

Sino_India_Pact.1.d:0 "L'Inde nous a demandé d'honorer notre pacte de défense et de nous joindre à eux contre la Chine. Le récent conflit frontalier entre les deux pays s'est transformé en un conflit général. Compte tenu de notre propre différend avec l'Inde, certains responsables estiment que nous ne devrions offrir notre aide qu'avec la garantie que les résolutions de l'ONU sur le Cachemire seront mises en oeuvre après le conflit. D'autres responsables estiment que l'agression chinoise constitue une menace régionale et que nous devrions honorer le traité. Enfin, certains au sein du gouvernement pensent que nous devrions simplement nier que nous sommes obligés d'aider et laisser l'Inde se vider de son sang. Une décision est nécessaire."
Sino_India_Pact.2.d:0 "Selon les termes de notre traité de défense mutuelle, nous avons récemment appelé le Pakistan à nous rejoindre face à une invasion chinoise massive. Les Pakistanais affirment que, même s'ils sympathisent avec notre situation, le peuple pakistanais reste passionné par le sort des Cachemiriens. Ils insistent sur le fait que nous devons accepter de mettre en oeuvre les résolutions de l'ONU sur le Cachemire après le conflit. Cela permettrait de dissiper toute animosité et de permettre au Pakistan de se ranger pleinement à nos côtés. Compte tenu de la situation militaire, un certain nombre de responsables sont intéressés à accepter ces conditions, estimant qu'elles offrent des avantages à court et à long terme. Cependant, un certain nombre de responsables s'y opposent, y voyant une capitulation face à l'agression pakistanaise et estiment que nous devrions faire cavalier seul."
Sino_India_Pact.3.d:0 "Le gouvernement pakistanais a annoncé qu'il honorerait son pacte de défense avec l'Inde et se joindrait à la lutte contre l'agression chinoise. Les deux gouvernements ont également confirmé qu'un accord avait été conclu concernant le Cachemire, reflétant ce nouvel esprit d'unité en Asie du Sud. Les deux pays mettront en oeuvre les résolutions existantes de l'ONU pour résoudre le statut du Cachemire une fois le conflit avec la Chine résolu. Les troupes pakistanaises se mobiliseraient rapidement. Le gouvernement chinois a condamné l'accord, le qualifiant de chauvinisme éhonté."
Sino_India_Pact.4.d:0 "Le Pakistan et l'Inde n'ont pas pu s'entendre sur les conditions selon lesquelles le Pakistan rejoindrait la guerre contre la Chine aux côtés de l'Inde. Aucun des deux gouvernements n'a révélé ce qui n'allait pas, même si des rumeurs courent selon lesquelles les tensions persistantes sur le statut final du Cachemire ont empêché un accord. Les médias pakistanais affirment que le gouvernement n'est pas obligé d'intervenir car on ne sait pas clairement qui a déclenché le conflit indo-sino. Les journaux indiens affirment que le Pakistan a renié le pacte de défense et a cherché à faire chanter le gouvernement indien. Quelle que soit la véritable cause, il est clair que le Pakistan n'interviendra pas pour soutenir l'Inde."
Sino_India_Pact.5.d:0 "Le gouvernement pakistanais, à la suite de discussions avec de hauts responsables indiens, a confirmé qu'il honorerait le pacte de défense et se joindrait à la lutte contre la Chine. Les dirigeants pakistanais ont souligné que cette crise n'était pas une période de politique ou de querelles : les peuples du sous-continent devaient travailler ensemble pour empêcher une nouvelle puissance étrangère de chercher à dominer. L'armée pakistanaise se mobiliserait rapidement. Le gouvernement indien a accueilli favorablement la nouvelle. Des rapports font état de protestations de la part des communautés cachemiriennes dans les villes pakistanaises et de membres de partis religieux condamnant cette décision. Ils estiment que le Pakistan a trahi la cause du Cachemire en n'exigeant pas sa résolution en échange de son soutien."

Pak_India_War_65.1.d:0 "L'armée pakistanaise a récemment lancé l'opération Nusrat. Les forces pakistanaises le long des lignes de cessez-le-feu du Cachemire mènent des opérations de reconnaissance pour trouver des brèches et des points d'infiltration le long de la frontière. De petites incursions sont également lancées pour tester les temps de réponse et la réaction des civils locaux à nos mouvements. Les connaissances que nous acquérons seront cruciales pour d'éventuelles opérations au Cachemire. Il semble que les Indiens ne soient pas conscients de l'ampleur de nos opérations. Nos troupes sont très motivées et confiantes, ces opérations remontent le moral et l'expérience."
Pak_India_War_65.2.d:0 "Après une série de réunions de haut niveau impliquant de hauts responsables du gouvernement et de l'armée, il fut décidé de réactiver l'opération Gibraltar, un plan initialement conçu au début des années 1950. Le plan prévoit l'infiltration de troupes pakistanaises déguisées en combattants de la liberté. Ces hommes mèneraient ensuite des opérations de sabotage et encourageraient un soulèvement populaire pour mettre fin à la domination indienne au Cachemire. Tous les soldats impliqués doivent être recrutés dans le régiment Azad Kashmir. Il est prévu de leur dispenser une formation spécialisée d'un mois avant de les envoyer passer la frontière. Neuf forces d'infiltration ont été désignées, chacune portant le nom d'un personnage célèbre de l'histoire islamique."
Pak_India_War_65.3.d:0 "Des colonnes des forces d'infiltration ont traversé la frontière du Cachemire. Ils ont commencé à se déplacer vers leurs zones d'opérations prévues. Cependant, l'infiltration ne s'est pas déroulée aussi bien que nous l'espérions. Certains groupes ont été découverts par des locaux qui ont informé les autorités indiennes. Ils ont supposé que nos hommes armés, habillés en civils, étaient des criminels armés et non des combattants de la liberté. D'autres forces se déplacent beaucoup plus lentement vers leurs zones d'opérations. Malgré ces revers, nous avons déjà reçu des informations faisant état de certaines opérations de sabotage et d'affrontements armés avec les forces indiennes. Les communications interceptées indiquent que l'armée indienne pense qu'un soulèvement armé pourrait se produire. Idéalement, les habitants en arriveront bientôt à cette conclusion et se joindront au soulèvement. Une fois que le soulèvement aura réellement commencé, nos forces avanceront pour achever la libération."
Pak_India_War_65.4.d:0 "L'opération Gibraltar n'a pas progressé comme nous l'espérions. De nombreux habitants sont soit restés à l'écart de nos combattants, soit ont conduit les forces indiennes vers leurs camps. La plupart de nos groupes d'infiltration ont subi de lourdes pertes, certains se retirant même vers la frontière. À ce stade, l'armée indienne réalise clairement qu'elle fait face à nos troupes et non aux insurgés. Il y a eu de violents combats de tirs et quelques opérations de sabotage, mais pas autant que nous l'espérions. Nous devrons peut-être envisager de passer à la phase deux, avec une attaque directe de nos forces le long de la frontière, pour sauver la situation et ne pas perdre notre élan."
Pak_India_War_65.5.d:0 "Nos bandes d'infiltration ont réussi à pénétrer dans le Cachemire occupé. Depuis leur arrivée, ils ont réussi à cibler des sites militaires et d'infrastructures indiens clés. Nos combattants réussissent à semer le chaos au Cachemire, avec des militants cachemiriens enhardis qui lancent des manifestations à Srinagar. À mesure que nos opérations se poursuivent, le gouvernement indien sera contraint de s'engager à nos côtés sous peine de risquer l'isolement complet de l'armée indienne au Cachemire. Alors que le GHQ célèbre ce succès, estimant que le Cachemire va bientôt tomber, certains responsables expriment leurs inquiétudes. Ils soutiennent que les Indiens pourraient plutôt chercher à aggraver la situation, d'autant plus qu'ils reconnaissent désormais à quel point l'armée pakistanaise est impliquée dans la direction des troubles."
Pak_India_War_65.6.d:0 "Au cours des dernières semaines, nos forces au Cachemire se sont engagées dans de violents combats contre de nombreux groupes de combattants armés. Au début, nos services de renseignements locaux craignaient qu'il s'agisse du début d'une rébellion armée parmi les Cachemiriens. Cependant, il ressort désormais clairement des rapports des habitants locaux et des combattants capturés qu'il s'agit de réguliers pakistanais. Nous avons deux options devant nous : lancer des offensives frontalières pour punir les Pakistanais et mener le combat contre eux. Si nous réussissons, nous pourrions améliorer notre position le long de la ligne de cessez-le-feu et peut-être même faire pression en faveur d'une résolution au Cachemire. L'autre option consiste simplement à poursuivre nos opérations pour éliminer les infiltrés et rétablir la normalité au Cachemire dès que possible."
Pak_India_War_65.7.d:0 "Au cours des dernières semaines, nos forces au Cachemire se sont engagées dans de violents combats contre de nombreux groupes de combattants armés. Au début, nos services de renseignements locaux craignaient qu'il s'agisse du début d'une rébellion armée parmi les Cachemiriens. Cependant, il ressort désormais clairement des rapports des habitants locaux et des combattants capturés qu'il s'agit de réguliers pakistanais. Ces infiltrés ont causé d'importants dégâts aux infrastructures locales et nous avons des rapports troublants selon lesquels certains Cachemiriens locaux ont rejoint les combattants. La situation se détériorant, nous nous retrouvons face à deux options. Nous pouvons lancer des offensives le long de la ligne de cessez-le-feu pour punir les Pakistanais et relâcher la pression. L'autre option consiste à annoncer notre soutien à la mise en oeuvre de la résolution 47 de l'ONU et à organiser un plébiscite."
Pak_India_War_65.8.d:0 "En réponse à l'opération Grand Slam, l'armée indienne a lancé des offensives le long de la ligne de cessez-le-feu du Cachemire. Nos forces ont été prises de court dans certains secteurs mais résistent avec ténacité. Avec la grâce d'Allah, nous repousserons bientôt cette attaque. Nos commandants sur le terrain sont convaincus qu'avec le temps, nous pourrons bientôt combattre les Indiens et mener à bien notre mission pour enfin libérer le Cachemire de son occupation."
Pak_India_War_65.9.d:0 "L'offensive indienne le long de la ligne de cessez-le-feu a été largement repoussée par l'armée pakistanaise. Bien que les forces indiennes aient semblé réaliser quelques gains initiaux, les contre-attaques pakistanaises localisées ont tenu bon. En particulier, les forces indiennes semblaient sur le point de capturer le col de Haji Pir, mais ont été stoppées. Les observateurs surveillent la situation de près pour voir si le Pakistan lancera sa propre offensive en réponse ou s'il s'efforcera de calmer l'escalade de la situation. Cette récente série de combats a eu lieu après que l'Inde a découvert que les troupes pakistanaises s'infiltraient dans la partie contrôlée du Cachemire pour lancer des attaques. Les États-Unis et l'Union soviétique ont publié des déclarations appelant au calme dans la région."
Pak_India_War_65.10.d:0 "L'offensive indienne le long de la ligne de cessez-le-feu au Cachemire réalise des gains dangereux contre les forces pakistanaises. L'armée indienne a récemment annoncé que ses forces contrôlaient désormais fermement le col de Haji Pir. Cette révélation marque un revers majeur pour les forces pakistanaises et menace Muzaffarabad. Il semble que ces offensives soient de nature limitée et ne constituent pas une attaque totale contre le Cachemire sous contrôle pakistanais. Le gouvernement indien a réitéré que le Pakistan devait retirer toutes ses forces d'infiltration du Cachemire indien et que la récente action militaire était une réponse directe à l'agression pakistanaise. Le gouvernement pakistanais est resté largement silencieux. On craint une nouvelle escalade au Cachemire, malgré les appels des États-Unis et de l'Union soviétique au rétablissement de la paix."
Pak_India_War_65.11.d:0 "Alors que la pression indienne monte sur la ligne de cessez-le-feu et dans le Cachemire occupé, les hauts commandants de l'armée pakistanaise ont planifié l'opération Grand Slam. Cette offensive soulagera la pression sur nos troupes déjà engagées dans l'action et si elle réussit, nous pourrions potentiellement couper l'Inde du Cachemire occupé. L'essentiel de l'offensive sera dirigé vers Akhnoor. Si nous prenons la ville, le Cachemire sera coupé et nous pourrons enfin achever la libération du Cachemire. Les troupes sont positionnées, il suffit d'approuver l'opération pour la lancer."
Pak_India_War_65.12.d:0 "L'Opération Grand Chelem réalise d'énormes progrès. Nos forces se dirigent rapidement vers Akhnoor et une fois sécurisée, nous pourrons couper l'armée indienne et même prendre Jammu. Les rapports de nos officiers sur le front vantent l'efficacité et le moral de nos soldats. Ils pensent qu'une fois l'Inde isolée, ils devront évacuer la vallée du Cachemire ou risquer de perdre toutes ses forces au Cachemire. L'armée de l'air et la marine sont en état d'alerte, notamment le long de la frontière internationale. Cependant, les derniers rapports des services de renseignement indiquent que l'Inde n'intensifiera probablement pas le conflit au-delà du Cachemire."
Pak_India_War_65.13.d:0 "L'opération Grand Chelem est en grande partie au point mort. Notre attaque initiale, en particulier l'artillerie, s'est déroulée magnifiquement. Cependant, nos forces se sont heurtées à un terrain difficile et à une force défensive beaucoup plus tenace que prévu. Même s'il est clair que nous ne menaçons pas de couper l'Inde du Cachemire, l'offensive a réussi à soulager la pression sur nos autres forces et à stabiliser la ligne de cessez-le-feu. Nos hommes continueront à se battre et, espérons-le, une nouvelle opportunité se présentera. Cependant, ce qui est clair, c'est que la situation au Cachemire échappe rapidement à notre contrôle."
Pak_India_War_65.14.d:0 "L'offensive massive du Pakistan vers Akhnoor a pris nos forces complètement par surprise. Cependant, malgré leur supériorité en nombre et en équipement, nos hommes combattent avec courage. Le commandant local affirme que ses forces peuvent certainement tenir les Pakistanais pendant encore plusieurs jours, mais il craint la taille de la force d'attaque et estime ne pas disposer de suffisamment de réserves. La situation nous laisse deux options. La première consiste à déclarer notre intention de mettre en oeuvre la résolution 47 de l'ONU sur le Cachemire et à nous engager dans le processus. Même si c'est difficile, nous pourrions finir par perdre le Cachemire, mais pas sur le champ de bataille. Nous pourrons certainement trouver un moment pour punir les Pakistanais plus tard. L'autre option, de loin la plus populaire, consiste à étendre le conflit et à attaquer le Pakistan occidental depuis la frontière internationale. Cela soulagera la pression et nous pourrons rapidement nous emparer de la ville de Lahore pour l'utiliser comme monnaie d'échange. La seule autre alternative est un désastre militaire au Cachemire."
Pak_India_War_65.15.d:0 "Les récentes opérations pakistanaises au Cachemire, consistant à infiltrer des guérilleros puis à lancer une vaste offensive pour couper les forces indiennes, ont réussi à sécuriser la vallée du Cachemire. Lorsque les forces pakistanaises ont finalement coupé l'Inde du Cachemire, le gouvernement indien est parvenu à un accord. Ils céderaient la vallée du Cachemire, y compris Srinagar, au Pakistan et établiraient une nouvelle ligne de cessez-le-feu. En échange, le Pakistan garantissait l'évacuation et le retour rapides des forces indiennes le long de l'ancienne ligne de cessez-le-feu. Peu de temps après l'accord, les troupes pakistanaises ont atteint Srinagar, où leurs partisans sont venus les soutenir. Cependant, les célébrations ont eu lieu dans un contexte non seulement de retrait des forces indiennes, mais également de familles minoritaires souhaitant rester partie intégrante de l'Inde. Le gouvernement indien a affirmé qu'il n'avait pas d'autre choix mais qu'il était confronté à des critiques cinglantes de la part de l'opposition au Parlement."
Pak_India_War_65.16.d:0 "Les forces armées indiennes ont déjoué les machinations du Pakistan et de son armée. Ses efforts pour déclencher un soulèvement puis s'emparer du Cachemire par la force armée ont été stoppés. Nos forces possèdent l'élan. Nous pouvons certainement mettre un terme aux combats ici, laisser les frontières telles quelles et espérer que le Pakistan retienne la leçon. Cependant, de nombreux dirigeants civils et militaires insistent désormais pour que nous imposions une résolution décisive afin de garantir que le Pakistan n'envisage plus jamais de tels projets. Ils proposent que nous étendions la guerre au-delà de la frontière internationale, au Pakistan occidental. Si nous nous emparons rapidement de l'importante ville de Lahore et progressons au Cachemire, nous pourrons enfin affirmer notre statut de puissance incontestée dans la région."
Pak_India_War_65.17.d:0 "Le récent conflit armé au Cachemire s'est transformé en une véritable guerre entre l'Inde et le Pakistan. Les forces indiennes auraient franchi la frontière près de Lahore et se déplaceraient dans d'autres secteurs. Le gouvernement pakistanais a lancé un message de défi à sa population, l'appelant à s'unir contre l'invasion indienne. Le gouvernement indien a déclaré que ses opérations étaient une réponse aux violences non provoquées déclenchées par le Pakistan au Cachemire. Ils ont déclaré que l'armée indienne ne se reposerait pas tant que la menace pakistanaise ne serait pas neutralisée."
Pak_India_War_65.18.d:0 "Alors que la guerre éclate au Pakistan occidental, le commandement du Pakistan oriental doit décider d'activer ou non le théâtre. Le front avec l'Inde est long et nos forces présentes au Pakistan oriental sont normalement réduites. Il vaudrait peut-être mieux maintenir nos forces dans leurs positions d'alerte. Si nous ne leur montrons pas d'intention agressive, les Indiens pourraient choisir de ne pas rendre ce front actif également. Cependant, certains officiers estiment que nous disposons de forces adéquates non seulement pour tenir le coup, immobiliser les divisions indiennes, mais aussi pour lancer des opérations offensives. Nous devons décider quelle position adopter."
Pak_India_War_65.19.d:0 "Alors que la guerre éclate au Cachemire et le long de la frontière du Pakistan occidental, notre commandement oriental doit réfléchir à ses options. Nous pouvons essayer de maintenir nos forces en position d'alerte, mais sans intention hostile. Si les forces pakistanaises leur rendent la pareille, nous pourrons maintenir le silence sur le front. Cela garantira que nous pouvons engager le maximum de forces sur le front principal. Ne pas engager le Pakistan oriental montrerait également notre soutien aux Bengalis du Pakistan, ce qui pourrait nous aider à l'avenir. Certains de nos officiers supérieurs estiment cependant que nous disposons de forces suffisantes pour pénétrer profondément au Pakistan oriental. Ils nous poussent à ouvrir ce front et à préparer immédiatement les opérations."
Pak_India_War_65.20.d:0 "Bien que l'Inde et le Pakistan soient engagés dans une guerre ouverte à l'ouest, les deux armées ont tacitement décidé de ne pas déclencher de combats le long de la frontière du Pakistan oriental. Même si les Indiens et les Pakistanais peuvent être tentés de déplacer leurs forces hors de la région, tant que la guerre fait rage, il est toujours possible que des combats s'y ouvrent. De nombreux Bengalis du Pakistan oriental ne sont pas conscients de cette situation et craignent de se retrouver dépassés et laissés sans protection face à une opération indienne majeure."
Pak_India_War_65.21.d:0 "La guerre entre le Pakistan et l'Inde s'est intensifiée lorsque des combats ont éclaté entre les deux camps à la frontière avec le Pakistan oriental. Les citoyens de Calcutta et de Dahka seraient en train de s'approvisionner. Les pratiques de black-out qui n'avaient pas été pratiquées depuis la Seconde Guerre mondiale sont en train d'être rétablies. Même si les deux camps promettent une victoire rapide, il est actuellement incertain qui aura le dessus dans cette zone de bataille. Les volontaires des deux côtés se rassemblent pour apporter de l'aide à leur nation respective."
Pak_India_War_65.22.d:0 "La situation en Asie du Sud a dégénéré en une guerre totale entre l'Inde et le Pakistan. Nos diplomates et agents sur le terrain imputent ces combats au Pakistan. Ces combats sont le résultat des récentes opérations pakistanaises au Cachemire destinées à forcer une résolution du conflit. Le Département d'État et la communauté du renseignement sont furieux. Ils pensent que le Pakistan utilise les armes que nous lui avons fournies pour lancer ses opérations et que ce conflit ne fera que renforcer le communisme dans la région. Ils suggèrent que nous annoncions un embargo sur les armes à la fois contre l'Inde et le Pakistan. Le Pakistan sera bien plus touché par cette situation. Certains experts militaires appellent toutefois à la prudence et affirment que nous ne devrions pas prendre une décision aussi irréfléchie. Le Pakistan reste pour nous un État vital."
Pak_India_War_65.23.d:0 "L'ambassadeur des États-Unis nous a informé que son gouvernement allait bientôt annoncer le gel de toute aide militaire et expéditions vers le Pakistan et l'Inde. Ils prétendent que cela vise à empêcher une nouvelle accumulation d'armes dans la région. L'ambassadeur américain a également ajouté que le gouvernement américain avait toujours insisté pour que ses armes soient utilisées pour se défendre contre le communisme et que notre utilisation d'armes américaines contre l'Inde violait ces conditions. C'est bien sûr un coup dur et absurde. Notre nation est confrontée à l'invasion d'un voisin beaucoup plus grand, et nous avons le droit d'utiliser toutes les armes dont nous disposons pour la défense de la patrie. L'Amérique a clairement montré son vrai visage."
Pak_India_War_65.24.d:0 "L'ambassadeur des États-Unis a informé notre gouvernement qu'il y aurait un gel de toute aide militaire potentielle ou expédition d'armes vers l'Inde et le Pakistan. Ils prétendent que cela vise à empêcher une nouvelle accumulation d'armes dans la région. Cette nouvelle constitue sans aucun doute un coup dur pour le Pakistan, longtemps dépendant des armes américaines. Nos propres militaires insistent sur le fait que cette nouvelle n'aura pas d'impact majeur. Nous avons répondu à l'ambassadeur en l'informant que ce sont les actions de sa nation qui ont encouragé les Pakistanais à agir de cette manière. Sans le soutien américain, le Pakistan n'aurait pas cherché à bouleverser la situation actuelle."
Pak_India_War_65.25.d:0 "Alors que les combats avec l'Inde s'intensifient, les Pakistanais exigent un réapprovisionnement immédiat en armes, chars et avions pour leurs forces. Ils affirment que le stress d'une guerre ouverte provoque une usure considérable de leur équipement et qu'ils ont désespérément besoin de soutien. L'armée pakistanaise note que l'Inde est à l'aise avec Moscou et que si le Pakistan échoue, l'influence soviétique dans la région ne sera pas contrôlée. Le Département d'État trouve ces affirmations douteuses, mais note que l'aide américaine cimentera certainement les relations entre nous et le Pakistan. D'autres hauts responsables suggèrent qu'il vaudrait mieux que nous refusions de nous impliquer dans le conflit."
Pak_India_War_65.26.d:0 "Les États-Unis ont achevé la fourniture d'urgence d'armes à nos forces. Cet équipement nous aidera grandement dans la lutte actuelle. Les Indiens n'étaient pas contents de l'arrivée rapide des armes. Bien que nous ayons demandé aux Américains une livraison d'armes beaucoup plus importante, compte tenu du délai court, les militaires sont très satisfaits. L'action américaine montre clairement qu'ils sont de véritables amis du Pakistan, et leur action ne sera pas oubliée de sitôt. Le matériel est rapidement envoyé aux unités de première ligne."
Pak_India_War_65.27.d:0 "Alors que la guerre atteint un niveau critique, les hauts dirigeants du Pakistan ont effectué une visite d'urgence chez nous afin de recueillir du soutien. Nous les avons informés que s'ils craignent la défaite, ils devraient se préparer à une guerre populaire et survivre à leur ennemi. Les Pakistanais ont poliment suivi nos conseils mais ont déclaré sur le moment qu'ils avaient besoin de notre implication directe. Nos propres experts suggèrent que nous impliquer directement ne serait pas prudent. Au lieu de cela, nous pouvons offrir des armes ou condamner avec véhémence l'agression indienne pendant ce conflit."
Pak_India_War_65.28.d:0 "Même si la Chine ne pouvait pas nous promettre une intervention armée pendant notre guerre actuelle avec l'Inde. Ils ont veillé à ce qu'une livraison d'urgence d'armes parvienne à nos forces. Notre armée a désespérément besoin de tout le soutien possible. Avec cette aide, la Chine s'est sans doute montrée une grande amie du Pakistan. L'équipement est rapidement traité et prêt à être utilisé immédiatement sur le front. La guerre avec l'Inde continue, mais avec une telle aide, nous espérons y mettre fin par une victoire décisive pour le peuple pakistanais."
Pak_India_War_65.29.d:0 "Les Chinois ont publié hier une déclaration troublante. Ils ont accusé notre gouvernement d'agression flagrante et de desseins impérialistes contre le Pakistan. Ils ont insisté sur le fait que le Pakistan était victime d'une agression illégale et ont déclaré qu'ils surveillaient la situation de près. Nous avons reçu des informations faisant état de mouvements de troupes chinoises le long de la frontière. Cela semble impliquer que si nous poursuivons le conflit, la Chine pourrait choisir d'intervenir contre nous. Ceci est important à considérer. Cependant, plusieurs conseillers ont qualifié cette déclaration de bravade et ont insisté sur le fait que la Chine n'interviendrait pas réellement. Ils soutiennent que la Chine essaie simplement de montrer son soutien au Pakistan sans réellement engager de forces."
Pak_India_War_65.30.d:0 "La guerre avec l'Inde a atteint un niveau critique. Nos hauts commandants et responsables indiquent que le moment est venu de chercher à mettre un terme aux combats. Nous demanderons bientôt aux responsables concernés de se rapprocher des Nations Unies. Nous leur demanderons de faciliter un cessez-le-feu avec l'Inde et de déployer des observateurs pour assurer la paix. Nous espérons que les Indiens se conformeront rapidement et que ces combats pourront cesser le plus rapidement possible. Quels que soient les résultats, la population et les forces armées du Pakistan ont réalisé des performances admirables."
Pak_India_War_65.31.d:0 "Les Nations Unies ont contacté notre gouvernement pour lui dire que le Pakistan était prêt à déclarer un cessez-le-feu immédiat. La nouvelle n'est guère surprenante compte tenu de la situation sur le terrain. Les Nations Unies ont ajouté dans leur communication qu'un cessez-le-feu était le souhait de la communauté mondiale. Nous rencontrons nos plus hauts responsables militaires et gouvernementaux pour évaluer la situation sur le terrain. Il est clair que les Pakistanais veulent la fin des combats et nous pouvons être d'accord sur ce point. Cependant, nos diplomates ont déclaré qu'ils pourraient retarder le cessez-le-feu d'une dizaine de jours au maximum avant que la pression internationale ne devienne trop forte. Si nous estimons que dix jours supplémentaires de combat pourraient améliorer notre position finale, nous pouvons également le faire."
Pak_India_War_65.32.d:0 "Les Nations Unies ont contacté notre gouvernement pour lui dire que l'Inde était prête à déclarer un cessez-le-feu. Cette nouvelle n'est pas surprenante compte tenu de la situation sur le terrain. Les Nations Unies ont ajouté dans leur communication qu'un cessez-le-feu était le souhait de la communauté mondiale. Nous rencontrons nos hauts gradés et nos responsables pour évaluer la situation. Nous pouvons certainement accepter dès maintenant le cessez-le-feu que l'Inde préconise à ce stade. Cependant, le ministère des Affaires étrangères estime que nous pouvons utiliser des tactiques dilatoires et retarder un cessez-le-feu jusqu'à dix jours avant que la pression internationale ne devienne trop forte. Si nous pensons que dix jours supplémentaires de combat pourraient améliorer notre position finale, nous pouvons également le faire."
Pak_India_War_65.33.d:0 "Un cessez-le-feu parrainé par les Nations Unies est enfin entré en vigueur, mettant au moins temporairement un terme au conflit indo-pakistanais actuel. Les deux parties semblent respecter le cessez-le-feu. Les Nations Unies ont publié un communiqué affirmant qu'une fois les combats arrêtés, des observateurs arriveront bientôt pour garantir qu'il n'y aura pas de violations majeures du cessez-le-feu ni d'accaparement de territoires par les deux parties. Les dirigeants indiens et pakistanais devraient également se rencontrer prochainement et chercher à mettre officiellement fin au conflit. De nombreuses personnes en Asie du Sud peuvent enfin pousser un soupir de soulagement alors que cette dernière série de combats de grande ampleur semble terminée."


kashmiri_plebiscite:0 "Résolution 47 de l'ONU : Plébiscite du Cachemire"
kashmiri_plebiscite_desc:0 "L'Inde et le Pakistan occupent l'ancien État princier du Cachemire. Tous deux revendiquent l'ensemble de l'État et mènent une brève guerre quelques semaines après la partition. Récemment, les deux parties ont convenu de mettre en oeuvre les résolutions du Conseil de sécurité des Nations Unies sur le territoire pour organiser un plébiscite. Dans les semaines à venir, la population du Cachemire déterminera son avenir et votera pour rejoindre l'Inde ou le Pakistan. Les deux gouvernements sont fortement impliqués dans la campagne visant à convaincre le peuple cachemirien que son avenir dépend de son État. L'ONU administrera des élections équitables."
