 PRC_peoples_army:0 "Armée populaire"
 china_capitualted:0 "La Chine a capitulé"
 PRC_Communist_Army_arrives:0 "Nous pourrions rassembler certaines divisions à Pékin pour lutter pour nos convictions."
 prc.1.t:0 "Constitution d'une petite armée"
 prc.1.d:0 "Nous pourrions rassembler certaines divisions à Pékin pour lutter pour nos convictions."
 prc.1.a:0 "Puissent-ils écraser ces nationalistes !"
 prc.2.t:0 "La RPC se bat pour la Corée du Sud"
 prc.2.d:0 "Maintenant que nous avons gagné la guerre contre la Corée du Nord, la donnons-nous à la Corée du Sud ou la gardons-nous ?"
 prc.2.a:0 "Rendons-le."
 prc.2.b:0 "Nous le garderons !"
 prc.3.t:0 "La RPC se bat pour la Corée du Nord"
 prc.3.d:0 "Maintenant que nous avons gagné la guerre contre la Corée du Sud, la donnons-nous à la Corée du Nord ou la gardons-nous ?"
 prc.3.a:0 "Rendons-le."
 prc.3.b:0 "Nous le garderons !"
 PRC_revolution_reinforcement:0 "Nous pourrions mobiliser certaines divisions au sein de la République de Chine pour nous dresser contre notre ennemi."
 prc.5.t:0 "Aide révolutionnaire de l'intérieur de la République"
 prc.5.d:0 "Nous pourrions mobiliser certaines divisions au sein de la République de Chine pour nous dresser contre notre ennemi."
 prc.5.a:0 "Exactement ce dont nous avons besoin !"
 prc_ussr_intervention:0 "Demandez de l'aide à l'Union soviétique §Y§!\n"
 prc_usa_intervention:0 "Demandez de l'aide au §YUSA§!\n"
 prc.6.t:0 "[GetNewspaperHeader]Ils acceptent notre demande"
 prc.6.d:0 "Nous allons désormais recevoir 10 000 équipements d'infanterie pour nous aider."
 prc.6.a:0 "Super!"
 prc.7.t:0 "[GetNewspaperHeader]Ils ont rejeté notre demande"
 prc.7.d:0 "Nous ne recevrons pas les 10 000 équipements d'infanterie que nous avons demandés."
 prc.7.a:0 "Une triste journée pour nous."
 prc.8.t:0 "[GetNewspaperHeader]Ils ont rejeté notre demande"
 prc.8.d:0 "Nous n'adhérerons pas au Pacte de Varsovie car l'Union Soviétique a rejeté notre demande."
 prc.8.a:0 "Une triste journée pour nous."
 prc.11.t:0 "La RPC demande du soutien"
 prc.11.d:0 "La République populaire de Chine demande notre soutien. Cela rappelle le pacte anti-Komintern que les nazis avaient mis en place contre la Russie avant la Seconde Guerre mondiale."
 prc.11.a:0 "Nous soutenons la RPC"
 prc.11.b:0 "Nous soutenons l'URSS"
 prc.12.t:0 "Annexer l'ETR"
 prc.12.d:0 "Les habitants de la République du Turkestan oriental faisaient à l'origine partie de la Chine. Ils ont lancé leur propre révolution contre la Chine, tout comme nous. Mais ils faisaient partie de notre pays, ils devraient donc en faire à nouveau partie."
 prc.12.a:0 "Annexion de la guerre."
 prc.13.t:0 "Annexion par la RPC"
 prc.13.d:0 "Notre peuple faisait initialement partie de la Chine. Nous avons lancé notre propre révolution contre la Chine, tout comme eux. Ils veulent que nous fassions à nouveau partie de la Chine. Cela signifierait leur annexion de tout notre territoire. Que devons-nous faire ?"
 prc.13.a:0 "Soyez annexé"
 prc.13.b:0 "Cela signifie une autre guerre !"
 prc.20.t:0 "Nouveau leader pour nous"
 prc.20.d:0 "Maintenant que la République populaire a consolidé son pouvoir sur le continent, nous avons une occasion unique de convoquer un congrès du parti et de nommer un nouveau dirigeant pour notre nouvelle Chine. Les candidats sont : Mao Zedong, président du Parti ; Liu Shaoqi, commissaire politique et commandant suprême des forces communistes en Mandchourie et dans le Nord ; Zhou Enlai, ministre des Affaires étrangères et diplomate en chef ; Chen Yun, économiste et chef de la Commission centrale financière et économique. Bien sûr, nous pourrions simplement choisir de garder le président Mao."
 prc.20.a:0 "Le commissaire Liu prendra le relais."
 prc.20.b:0 "Ouvrez la porte à l'ouest, choisissez Chen"
 prc.20.c:0 "Élire le réformateur Zhou"
 prc.20.do:0 "Pas de congrès ! Leader éternel Mao !"
 
 #1960s PRC News Events
 CulRevPurge.1.d:0 "Le président Mao et ses partisans ont eu recours à des dénonciations directes, à des articles ciblés dans les journaux du parti et à des alliés politiques pour orchestrer une série de purges contre des membres importants du Parti communiste chinois. Ces purges éliminent les modérés qui ont pris de l'importance ces dernières années afin de restaurer l'économie et la stabilité chinoises. Cependant, ces purges sont nécessaires pour que Mao et ses partisans prennent le contrôle de postes clés et réhabilitent l'image de Mao en tant que véritable leader de la révolution en Chine. Les personnes ciblées par les purges sont souvent démis de leurs fonctions politiques et, dans des cas plus extrêmes, arrêtées pour activités contre-révolutionnaires."
 Enlais_Tour.1.d:0 "L'éminent dirigeant communiste chinois et ancien ministre des Affaires étrangères, le Premier ministre Zhou Enlai, s'est lancé dans une tournée mondiale. Enlai prévoit de se rendre dans de nombreux pays, notamment en Afrique et au Moyen-Orient, où il espère démontrer la puissance et l'influence chinoises. Ce voyage démontrera que la Chine est une force mondiale et qu'elle regarde au-delà de ses frontières. Les Chinois sont désireux de démontrer leur soutien aux luttes révolutionnaires qui se déroulent actuellement contre les régimes réactionnaires et impérialistes. Un autre objectif majeur du Premier ministre est de faire pression sur les nouveaux États indépendants émergents pour renforcer le soutien à la Chine aux Nations Unies."
 PRCUN.1.d:0 "La décolonisation a vu l'émergence d'un nouveau tiers-monde de puissances, principalement concentrées en Afrique et en Asie. Ces États possèdent beaucoup d'optimisme, de jeunesse et d'opportunités que la Chine ne peut ignorer. Plus important encore, bon nombre de ces États n'ont obtenu leur indépendance que grâce à une action révolutionnaire contre les maîtres coloniaux. Le gouvernement chinois tend la main et fait pression auprès de ces gouvernements pour qu'ils offrent leur soutien à la RPC aux Nations Unies, alors que de nombreuses anciennes puissances coloniales et les États-Unis continuent d'empêcher de nous donner la place qui nous revient au sein de la communauté mondiale. Nous devons rallier le tiers monde et apprendre à ses dirigeants à nous soutenir contre les machinations impérialistes aux Nations Unies."
 CulRev.11.d:0 "Sous la direction de leaders de la jeunesse et de militants dévoués du parti, des millions de livres sont arrachés des bibliothèques, des centres culturels et religieux pour être brûlés dans des feux de joie publics. Les livres qui discutent d'idées contre-révolutionnaires, contredisent les orientations de Mao, les ouvrages historiques, les textes religieux ou les oeuvres de fiction qui glorifient le passé réactionnaire font tous partie des oeuvres rassemblées pour être brûlées. Pour nettoyer la Chine et purifier le parti, une destruction directe du passé et de ses impuretés est essentielle. Mao enseigne que pour qu'une nouvelle littérature et un art révolutionnaires émergent, le passé doit être nettoyé et ne doit pas interférer avec la révolution continue. Tous ceux qui se sont opposés aux incendies ou ont tenté d'empêcher la collecte de livres ont été arrêtés et seront jugés comme réactionnaires."
 CulRev.12.d:0 "L'une des principales pierres d'achoppement à une révolution continue et à la fin de l'influence du passé réactionnaire est l'existence continue de tombes glorifiées de dirigeants nobles et vénérés du passé. Ces tombes deviennent des espaces de faux culte et de glorification, en particulier de personnes qui ont exploité et opprimé les masses pour acquérir leur renommée. Dans tout le pays, la jeunesse révolutionnaire déterre ces tombeaux, dénonce les restes et les brûle ensuite. Détruire ensuite l'espace pour garantir que cette fausse glorification du passé soit supprimée. Il convient de noter en particulier le raid sur les tombeaux Ming où les restes de l'empereur Wanli et de ses impératrices ont été détruits de la même manière. Les fouilles archéologiques des tombes sont immédiatement interrompues et les archéologues qui refusent ou se plaignent de ces actions sont arrêtés."
 CulRevPurge.4.d:0 "La religion a longtemps empêché le peuple chinois d'adhérer véritablement à la révolution et d'obéir à ses principes. La religion engendre la superstition et enlève l'énergie et les ressources des personnes qu'elle trompe. Bien que les sites religieux bouddhistes et musulmans soient également des cibles majeures, la Garde rouge et les jeunes révolutionnaires se sont concentrés sur les sites de connaissances confucéennes et d'importance historique. Dans toute la Chine, les temples de Confucius sont assiégés, notamment le temple de Confucius dans le Shandong. Des reliques sont brisées tandis que des écrits et des collections, pour la plupart inestimables, sont déchirés ou brûlés par les révolutionnaires. Les cimetières confucianistes et d'autres sites sont également saccagés afin de purger la Chine de son attachement aux anciennes pratiques réactionnaires qui entravent l'adhésion à une révolution continue."
 PLA_CulRev.1.d:0 "Avec la ferveur révolutionnaire qui balayait la nation et les activités des Gardes rouges sans surveillance, les hauts dirigeants du parti craignaient de plus en plus que la situation ne dégénère. Le président Mao, sentant cela et le conflit croissant au sein du parti à propos des révolutionnaires radicaux et des membres du parti de l'establishment souhaitant maintenir la stabilité, a demandé à l'APL dirigée par le célèbre chef militaire Lin Biao de se déployer et d'aider la gauche. Même si cela impliquait que l'APL devait soutenir les radicaux, cela n'était pas explicite et la plupart des unités de l'APL ont commencé à soutenir les membres du parti établi. Ces unités luttent activement contre les excès de la Garde rouge et veillent à ce que la faction radicale de certaines régions n'ait pas accès à des armes lourdes ou ne renverse pas les dirigeants locaux du parti."
 HyperCulRev.1.d:0 "Alors que la Révolution culturelle fait rage en Chine, le conflit entre les factions radicales au sein du parti et la direction plus modérée et établie du parti s'est déplacé en faveur des radicaux. Ancien président chinois et autrefois deuxième homme le plus puissant de Chine, Liu Shaoqi a été exécuté. Bien qu'il ait présidé la réunion qui a lancé la Révolution culturelle, dans l'espoir de combattre la corruption et de réformer le pays, Mao et ses partisans en ont rapidement pris le contrôle et ont orchestré la chute de Shaoqi et son arrestation. Il était détenu dans des conditions difficiles, mais beaucoup en Chine s'attendaient à ce qu'il soit simplement emprisonné. Son exécution pour capitaliste secret et traître indique que les radicaux sont plus fermement établis et constitue un coup dur pour les membres du parti qui espèrent qu'une future réhabilitation de Shaoqi pourrait aider le pays à mettre fin à la violence."
 HyperCulRev.2.d:0 "Deng Xiaoping, qui a aidé à superviser une campagne de réforme économique visant à atténuer les dommages économiques maoïstes, a été exécuté par le gouvernement. Cette nouvelle étonnante indique qu'au sein de la direction du Parti communiste chinois, les maoïstes radicaux gagnent en importance sur les membres du parti établi. Avant cette annonce, Deng n'avait pas été officiellement arrêté, même si, peu après le début de la Révolution culturelle, il était la cible des Gardes rouges. Les Gardes rouges pensaient que ses réformes économiques étaient capitalistes et s'opposaient à Mao. Contrairement à son allié politique Liu Shaoqi, Deng a seulement été purgé de ses positions nationales. Cependant, il fut très rapidement jugé, reconnu coupable, puis exécuté. Bien que certaines rumeurs spéculent que Deng aurait simplement été exécuté par des gardes rouges émus. Deng était toujours étroitement allié à certains des membres restants du parti de l'establishment qui envisagent désormais leur avenir avec de sérieuses inquiétudes suite à cette dernière annonce."
 HyperCulRev.5.d:0 "Avec l'exécution du leader d'avant la Révolution culturelle Liu Shaoqi et du jeune réformateur économique Deng Xiaoping, la position des membres du parti communiste établi semblait numérotée. Depuis les exécutions, rares sont ceux qui se sont prononcés ou ont défié l'aile radicale du parti d'étendre la révolution. Aux dernières nouvelles, le Parti communiste chinois a annoncé qu'il se purgeait du conservatisme et a déclaré que parmi les derniers à avoir été démis du gouvernement national se trouvait le célèbre homme d'État Zhou Enlai. Enlai est un élément majeur du parti depuis les années 1930 et le visage du gouvernement à l'étranger. Il était également proche de Deng exécuté et on pense que s'il avait tenté de résister, il aurait risqué de subir le même sort que Deng et d'être reconnu coupable comme partenaire du traître. Il existe désormais une incertitude totale quant à savoir qui ou si quelqu'un au sein du gouvernement tente d'atténuer ou de contrôler le niveau de violence qui semble s'intensifier de jour en jour."
 HyperCulRev.6.d:0 "Le dernier empereur de Chine Puyi a été tué par des gardes rouges qui l'ont emmené dans la rue, l'ont humilié publiquement pour son passé impérial, puis ont tué l'ancien dirigeant âgé du Mandchoukouo. Après la fin de la Seconde Guerre mondiale, les Soviétiques ont détenu Puyi avant de le transférer aux autorités chinoises. Le Parti communiste chinois l'a envoyé dans un centre de réadaptation où il a finalement été réhabilité et transféré à Pékin. Bien que fervent partisan du communisme et porte-parole du régime, les Gardes rouges ne le considéraient pas comme un réformé, d'autant que son autobiographie était publiée dans des langues étrangères considérées comme suspectes, l'anglais et le français. De hauts dirigeants du parti comme Zhou Enlai avaient usé de leur influence pour protéger Puyi, mais avec la dernière purge des dirigeants du parti de l'establishment, sa protection a pris fin et il est rapidement tombé aux mains de la Garde rouge."
 PRC_Congress.1.d:0 "Le neuvième congrès du Parti communiste chinois s'est récemment terminé avec succès. Lin Biao a prononcé le discours d'ouverture devant les délégués enthousiastes qui ont soutenu son éloge de la révolution continue. Les récentes purges de l'ancien président Liu Shaoqi et de son allié Deng Xiaoping ont été confirmées et approuvées, et les délégués ont été élus. L'aile radicale du parti a réalisé des gains substantiels en termes de représentants, notamment parmi la Garde rouge, et ses principaux principes directeurs, comme la révolution continue, étaient inscrits dans la constitution. Cependant, Lin Biao a fini par être le principal vainqueur puisqu'il a été confirmé comme successeur de Mao et ses partisans au sein de l'APL ont également remporté de nombreux sièges. Beaucoup considèrent ces deux développements comme une indication que, même si les radicaux restent puissants, ils peuvent encore être contrôlés et gérés, notamment par l'APL."
 PRC_Congress.2.d:0 "Le neuvième congrès du Parti communiste chinois s'est terminé récemment et ses résultats ont été accueillis par des foules enthousiastes à travers la Chine. Le Congrès a ratifié la révolution continue et d'autres principes de la Révolution culturelle dans le cadre de la constitution. Dans son discours, Mao a promis que la Révolution culturelle se poursuivrait et a appelé tous les travailleurs à en élargir la portée et à délivrer la Chine des forces réactionnaires et contre-révolutionnaires. Le Congrès a salué la rapidité avec laquelle la justice a été rendue lors des récentes exécutions de l'ancien président Liu Shaoqi et de son allié Deng Xiaoping et a confirmé que la purge de Zhou Enlai était la bonne voie à suivre. Le congrès sera dominé par les représentants des révolutionnaires radicaux et de la Garde rouge. La récente mise à l'écart du PLA et la purge de l'aile établie du parti signifient que le pouvoir est désormais presque entièrement entre les mains des radicaux du parti."
 PRC_Congress.3.d:0 "Le neuvième congrès du Parti communiste chinois s'est récemment terminé. Le Congrès a ratifié et approuvé ouvertement les réformes initiées par le président Shaoqi. Shaoqi a été félicité pour son leadership avisé et son esprit visant à améliorer la vie des gens. Les élections ont notamment vu de nombreux réformateurs et partisans de Shaoqi remporter des sièges. Les membres de la vieille garde et les maoïstes les plus dévoués n'ont pas obtenu beaucoup de sièges suite à leur récente purge. En outre, les sièges militaires sont restés limités, ce qui reflète également le succès de Shaoqi dans le contrôle de l'institution. À la fin du parti, il était clair que Shaoqi restait fermement aux commandes et que ses réformes étaient constitutionnellement ratifiées."
 BeijingSpring.1.d:0 "Les échecs du Grand Bond en avant ainsi que les efforts visant à mettre fin à l'isolement politique ont conduit au déclin de l'influence du président du Parti communiste chinois, Mao Zedong. Même au sein des échelons supérieurs du parti, sa rhétorique révolutionnaire a perdu son impact antérieur. Profitant de cette situation, le président Liu Shaoqi a émergé avec une vision réformiste pour le pays. Il a déjà annoncé son intention de revenir sur les politiques économiques maoïstes plus radicales pour aider l'économie à se redresser. Plus important encore, il a exposé le gouvernement à la critique du public lors de ce qu'on appelle le Printemps de Pékin. Les citoyens chinois sont autorisés à critiquer ce qu'ils n'aiment pas dans le gouvernement, ce qui reflète une libéralisation de la société. Reste à savoir quelles seront les conséquences de cette nouvelle ouverture."
 ZhenbaoConflict.1.d:0 "Les tensions se sont accrues entre la République populaire de Chine et l'Union soviétique, lorsque le président Mao Zedong a demandé le retour de l'île de Zhenbao, également connue sous le nom d'île Damansky en Union soviétique, ainsi qu'une révision du traité d'Aigun. Zhenbao est une petite île de la rivière Oussouri, à la frontière de la Mandchourie et de la Mandchourie extérieure russe. La Russie a acquis la Mandchourie extérieure pendant les années du déclin des Qing. Le Traité d'Aigun et la Première Convention de Pékin accordèrent plusieurs concessions chinoises aux puissances occidentales et à l'Empire russe, notamment la cession de la Mandchourie extérieure à la Russie, y compris toutes les îles de la rivière Oussouri, qui incluraient l'île de Zhenbao. Le président Mao a cité ces traités comme rien d'autre qu'un impérialisme opportuniste flagrant et a affirmé que l'Union soviétique, en tant qu'ennemi de l'impérialisme, devrait rectifier les deux traités. Récemment, il a été rapporté que l'Armée populaire de libération et l'Armée soviétique se sont mobilisées à la frontière de Zhenbao alors que les négociations sont toujours en cours. Beaucoup craignent que les négociations tournent au vinaigre et déclenchent potentiellement un conflit à grande échelle entre les deux puissances."
 ZhenbaoConflict.10.d:0 "Ce matin, un petit groupe de soldats chinois a tendu une embuscade aux forces soviétiques en garnison à Zhenbao et s'est emparé de l'île. Jusqu'à présent, les médias ont surnommé l'incident « l'incident de Zhenbao ». Apparemment, cette attaque était une réponse au refus du secrétaire général Khrouchtchev de signer un accord cédant Zhenbao à la République populaire de Chine. Jusqu'à présent, les Soviétiques n'ont pas riposté et aucune des deux parties n'a encore fait de commentaire ou de réponse sur l'incident. Beaucoup craignent que cela n'entraîne une guerre conventionnelle à grande échelle entre les deux superpuissances. Il est effrayant que les deux pays aient accès à des armes nucléaires qui pourraient être utilisées l'une contre l'autre. Certains pensent qu'il ne s'agira que d'un simple conflit frontalier, tandis que d'autres pensent qu'il pourrait être le catalyseur d'une guerre nucléaire entre les deux superpuissances et se terminer par la dévastation et la destruction des deux nations."
 ZhenbaoConflict.30.d:0 " Le secrétaire général de l'Union soviétique a annoncé aujourd'hui qu'un état de guerre existe entre son pays et la République populaire de Chine. Des escarmouches mineures le long des frontières du Heilongjiang et du Xinjiang ont incité les Soviétiques à déployer tout le poids de leur puissance militaire contre la Chine. Les rapports indiquent que les forces soviétiques et chinoises sont déjà entrées en contact le long de la frontière et que des troupes, des fournitures et des avions supplémentaires affluent vers le front. Même si l'origine de l'incident de l'île de Zhenbao reste quelque peu floue, ce qui est clair, c'est que les deux parties semblent déterminées à mener ce conflit jusqu'au bout. Certains observateurs craignent qu'un échange nucléaire ne se profile à l'horizon, mais même si le conflit reste conventionnel, il est clair que l'enjeu n'est rien de moins que le leadership moral de l'ensemble du monde communiste."
 ZhenbaoConflict.25.d:0 "Après quelques jours de violents combats sur l'île de Zhenbao, les forces soviétiques et chinoises ont convenu d'un cessez-le-feu. L'Union soviétique semble avoir répondu à la prise de l'île par les Chinois par une contre-attaque limitée de forces mécanisées appuyées par un volume important de tirs d'artillerie. Les affrontements sur et autour de l'île ont été largement indécis, et la menace d'une escalade a persisté jusqu'à ce que les négociations soient facilitées par les alliés mutuels de la RPC et de l'Union soviétique dans le monde communiste. Les termes du cessez-le-feu ne prévoient aucun changement territorial, les Soviétiques conserveront le contrôle de Zhenbao. Les deux camps revendiquent la victoire dans l'escarmouche, les Soviétiques en raison des termes du cessez-le-feu, et les Chinois en raison des dégâts infligés aux forces soviétiques, et il reste à voir comment cela affectera l'unité de la communauté communiste mondiale."
 ZhenbaoConflict.31.d:0 "Après un affrontement bref mais intense entre les troupes soviétiques et chinoises au sujet de l'île contestée de Zhenbao, le secrétaire général de l'Union soviétique et le Premier ministre chinois sont parvenus à un accord. Les négociations de paix ont abouti après qu'il est devenu clair que les forces soviétiques ne pouvaient ou ne voulaient pas déloger les troupes chinoises occupant l'île de Zhenbao. Le Politburo a publié une déclaration reconnaissant que les différents traités du XIXe siècle définissant la frontière sino-russe sont nuls et non avenus, ayant été conclus entre des gouvernements bourgeois qui ne représentent plus la volonté du peuple. Le libellé de l'accord semble être un effort creux pour sauver la face de la part des Soviétiques, après ce qui a dû être une défaite embarrassante à Zhenbao. Les renégociations de la frontière devraient favoriser la Chine et la capacité de l'Union soviétique à diriger le monde communiste a été sérieusement remise en question."
 Cultural_Rev.2.d:0 "Plus officiellement connu sous le nom de Citations du président Mao Tsé-toung, le « Petit Livre rouge » est rapidement devenu le centre de la rhétorique révolutionnaire en [PRC.GetNameDef]. Ce livre rouge inoffensif contient 267 citations de Mao Zedong et épouse les idées d'unité entre le parti et les masses populaires, la correction des idées erronées et la lutte constante contre les oppresseurs impériaux et de classe. Plus particulièrement, Mao mentionne que, même sous le socialisme, les ennemis de classe existent toujours et qu'ils doivent être éliminés sans cesse pour garantir la réalisation du rêve socialiste. Cette rhétorique d'une « révolution culturelle » constante a été prise à coeur par les jeunes qui la lisent à travers la Chine. Inspirés par les histoires de leurs parents et grands-parents sur la Guerre populaire de libération contre le Kuomintang, étudiants et soldats reprennent le flambeau de la révolution de leurs prédécesseurs afin de réaliser ce rêve d'une révolution encore plus glorieuse. Ils descendent désormais dans les rues de toute la Chine pour soutenir le président Mao et son petit livre rouge incendiaire."
