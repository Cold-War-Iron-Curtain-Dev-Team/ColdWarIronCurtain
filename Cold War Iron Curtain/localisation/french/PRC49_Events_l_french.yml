 #Country Events
 CulRevPurge.2.d:0 "Deng Xiaoping a été commissaire politique pendant la guerre civile et est devenu une étoile montante prometteuse au sein du Parti communiste chinois. Lorsque les politiques économiques radicales de Mao se sont avérées préjudiciables, il a travaillé en étroite collaboration avec le président Liu Shaoqi pour instaurer des réformes économiques qui modéraient les éléments radicaux des politiques économiques précédentes. Cependant, avec la Révolution culturelle et la résurgence de Mao, Deng se trouvait dans une situation dangereuse car il était identifié par la Garde rouge comme un critique de Mao. Après l'arrestation de Shaoqi, Deng a été confronté à une hostilité plus agressive et à des attaques de la Garde rouge. La Garde Rouge a également attaqué ses enfants et sa famille. Finalement, Deng a été dénoncé et expulsé de ses fonctions au sein du gouvernement national, bien qu'il n'ait pas été arrêté. Au lieu de cela, Deng travaillera comme ouvrier d'usine, loin de la politique centrale."
 CulRevPurge.3.d:0 "L'ancien président chinois Liu Shaoqi a été arrêté aujourd'hui pour être un capitaliste secret travaillant à trahir la révolution et à guider la Chine vers une société bourgeoise. Shaoqi a pris de l'importance grâce à une campagne de réforme économique qui a vu la Chine atténuer les théories économiques les plus radicales de Mao. Il était également d'accord avec Mao sur la nécessité d'une révolution culturelle pour éradiquer la corruption et mettre fin à une structure bureaucratique trop centralisée. Cependant, peu après qu'il eut inauguré la Révolution culturelle, le mouvement échappa à son contrôle et le pouvoir revint à Mao. En raison de ses critiques antérieures à l'égard de Mao et de sa position élevée au sein du parti, Shaoqi a été l'une des premières cibles des radicaux du parti qui sont devenus suffisamment puissants pour l'emprisonner."
 HyperCulRev.3.d:0 "Les régions isolées du Xinjiang et du Tibet sont non seulement physiquement éloignées de la patrie chinoise, mais également idéologiquement et culturellement éloignées. Les habitants manquent d'esprit révolutionnaire et s'accrochent à leurs identités religieuses et culturelles traditionnelles. Afin d'y faire face, Mao a ordonné à la Garde Rouge d'entrer dans ces provinces et de commencer leur révolution continue. Les sites et textes religieux seront ciblés. Le port de vêtements culturels et les pratiques rétrogrades seront également purgés de ces provinces. Tous ceux qui résistent seront arrêtés pour leurs pensées réactionnaires. Bientôt, avec l'aide de la Garde Rouge, ces lieux se libéreront des chaînes de leur passé et deviendront un organe vivant de la révolution."
 HyperCulRev.4.d:0 "L'Union soviétique a abandonné son engagement en faveur d'un véritable marxiste-léninisme révolutionnaire. Cela a conduit à la scission sino-soviétique et la Révolution culturelle vise à garantir que l'État révolutionnaire ne cesse jamais. Grâce à nos récents succès et à l'intensification de nos efforts pour mettre en oeuvre une révolution continue, le Parti communiste chinois a annoncé son intention d'envoyer des représentants dans plusieurs États communistes d'Europe de l'Est pour promouvoir nos principes et soutenir les factions anti-révisionnistes. Le succès continu de la Révolution culturelle continue de démontrer que la Chine est à l'avant-garde de la politique révolutionnaire et doit s'efforcer de diffuser son message auprès des travailleurs du monde entier."
 BeijingSpring.5.d:0 "Mao Zedong et ses partisans, malgré leur zèle révolutionnaire et leurs grandes réalisations dans l'établissement du parti en Chine, ont malheureusement causé d'importantes difficultés économiques ces dernières années. Même si leurs intentions étaient les meilleures, ils n'avaient pas anticipé les conséquences de leurs actes. En outre, ils sont assez mal à l'aise face à la récente ouverture du discours public sur l'État. Le président Shaoqi a prévu des réformes et des actions qui atténueront les difficultés du peuple et mieux le connecter à l'État, mais cette vieille garde maoïste fait obstacle. Pour résoudre le problème, Shaoqi a annoncé le limogeage des maoïstes de tout le parti en réponse à leurs échecs précédents et aux critiques publiques. Ces fonctionnaires seront déchus de leurs nominations nationales. Shaoqi s'est assuré que Mao lui-même n'était pas ciblé ou directement critiqué lors de cette purge."
 PRC_Japan.1.d:0 "Dans les années 1930, la guerre sino-japonaise a causé des difficultés incalculables au peuple chinois, dévastant les villes et coûtant des millions de vies à cause de la violence et de la famine. Les blessures de ce conflit et des conflits antérieurs ne sont pas guéries. Ces dernières semaines, dans toute la Chine, nombreux sont ceux qui sont descendus dans la rue pour dénoncer le Japon comme une marionnette américaine déterminée à renverser la révolution et impénitente envers ses crimes de guerre contre le peuple chinois. Conformément aux souhaits du peuple, le président Shaoqi a annoncé l'expulsion de tous les citoyens japonais de Chine, y compris ceux de l'armée impériale japonaise de la Seconde Guerre mondiale restés après la guerre. Même si certains d'entre eux ont aidé notre cause, cela ne compense pas la douleur et les souffrances endurées par la population. On dit que Tokyo est furieux de notre décision. La Chine réduira également sa mission diplomatique au Japon."
 BeijingSpring.2.d:0 "Le Parti communiste chinois a annoncé qu'il avait démis Jiang Qing, l'épouse de Mao Zedong, de ses fonctions au sein du parti national, avec effet immédiat. Cette purge souligne combien de pouvoir le président Shaoqi a accumulé récemment aux dépens de Mao et de ses alliés politiques. Jiang, ancienne actrice et directrice artistique, a mené une campagne visant à purger l'art et les médias non révolutionnaires. Elle agit en tant que secrétaire personnelle de Mao et entretient des liens étroits avec ses plus proches alliés politiques. Le Parti a cité de nouvelles preuves de son passé bourgeois qu'elle avait caché au parti comme raison de son retrait de la politique."
 BeijingSpring.4.d:0 "Lin Biao est l'un des plus grands commandants militaires de l'APL, ayant combattu dans tous les conflits de l'APL de 1925 à 1945. Après la fin de la guerre, il a été promu maréchal et a finalement rejoint le Politburo où il a formé une alliance avec Mao. Il reste très populaire et respecté au sein de l'APL. Pour le président Shaoqi, cela fait de lui une menace dangereuse, car l'APL pourrait contrecarrer ses réformes et ramener les maoïstes au pouvoir. Pour neutraliser cette menace, le président Shaoqi a demandé à ses alliés politiques au sein de l'APL de prétendre que Lin cherchait le pouvoir pour lui-même. Avec cette accusation, le Maréchal a été démis de ses fonctions politiques jusqu'à ce qu'une résolution des accusations puisse être confirmée. La destitution de Lin Biao permettra à Shaoqi de placer ses partisans de l'APL à des postes plus élevés et de maintenir l'APL à l'écart du pouvoir politique."
 BeijingSpring.6.d:0 "Deng Xiaoping a récemment aidé le Comité central à publier une histoire des débuts du Parti communiste chinois. Le document vise à préserver l'héritage de Mao mais également à approuver les réformes initiées par le président Shaoqi. L'histoire prétend que les réalisations de Mao sont immenses, en particulier dans les premières décennies du parti et dans ses tactiques militaires. Cependant, il note que des erreurs ont également été commises, même si elles n'enlèvent rien à ses réalisations. Le document accuse également les proches confidents de Mao de l'avoir mal dirigé et les blâme pour les erreurs qu'il a commises, exonérant Mao de pratiquement toute faute directe. Deng lui-même a noté que Mao était sept parts bon et trois parts mauvais. Cela illustre la position du parti selon laquelle Mao doit être vénéré et respecté, mais que les réformes et les écarts par rapport à sa doctrine sont parfaitement acceptables."
 Mao_Return.1.d:0 "Mao Zedong a profité du récent effondrement de la société pour tenter d'inverser sa perte de pouvoir ! Bien qu'il ait conservé la présidence du PCC, l'un des rôles les plus influents en [PRC.GetNameDef], Mao a conservé peu d'influence depuis son désastreux Grand Bond en avant. Maintenant, il semble que la rhétorique de son Petit Livre Rouge ait été un outil pour inverser la tendance en incitant une armée de jeunes révolutionnaires qui s'accrocheront à chacune de ses paroles ! Le président a déjà accusé les dirigeants du PCC et du gouvernement d'être des contre-révolutionnaires cherchant à amener la décadence capitaliste en Chine."
#[We will see if his gambit works.] Mao Begins Effort to Retake Power  (Local)
 Mao_Return.2.d:0 "De nombreux membres éminents du PCC se sont ouvertement opposés à la tentative de Mao Zedong de reprendre le pouvoir au sein du [PRC.GetNameDef]. Bien que le président cherche à purger les éléments bourgeois du parti, il n'a pas vu l'ironie de ses objections."
#[A shame.] CPC Openly Hostile to Mao's Return (Local)
 Mao_Return.3.d:0 "Incités par la rhétorique du Petit Livre Rouge, les soldats et les généraux de l'Armée populaire de libération ont exprimé leur soutien à la rhétorique du président Mao et à son éventuel retour au pouvoir !"
#[Excellent news!] PLA Supportive of Mao's Return (Local)
#[This can not stand!] Fires Mao_Return.4/ Loads Liu Shaoqui Focus Tree [LIU_60s]
 Mao_Return.4.d:0 "Après plusieurs tentatives visant à utiliser de jeunes révolutionnaires impressionnables pour reprendre le pouvoir, le président et ancien président Mao Zedong a été contraint à la retraite définitive par la direction du PCC. Après la famine catastrophique qui a suivi sa tentative de relancer l'industrie et l'agriculture chinoises avec le Grand Bond en avant, Mao a démissionné de son rôle de président de la République populaire de Chine et a simplement maintenu son poste de président du Parti communiste chinois. Cependant, son rôle dans le récent chaos provoqué par les jeunes parvenus est apparu comme une attaque contre le parti ainsi que contre les dirigeants du [PRC.GetNameDef], en particulier le président [PRC.GetLeader]. L'ancien président est désormais assigné à résidence permanente dans une résidence d'État à Pékin. Même s'il restera sans doute dans les mémoires comme une figure héroïque de l'histoire du prolétariat, il passera le reste de sa vie en marge de la révolution."
#[He is but a relic of old wars.]
 ZhenbaoConflict.3.d:0 "Un groupe de soldats chinois a tendu une embuscade aux gardes-frontières du KGB stationnés à Zhenbao et s'est emparé de l'île. Le bureau politique est dans le chaos quant à la réponse à apporter. Beaucoup se sont prononcés contre toute représailles extrême telle qu'une frappe nucléaire ou tout ce qui pourrait conduire à une guerre totale. La plupart ont préconisé des représailles sévères pour reprendre l'île aux Chinois. Certains membres ont proposé un traité pour donner l'île à la RPC afin d'éviter la crise. Tandis que d'autres soulignent que laisser les Chinois saper l'autorité soviétique pourrait éroder l'autorité soviétique sur d'autres nations communistes indépendantes. Quelques-uns des Soviétiques les plus extrémistes du Politburo prétendent que c'est l'occasion idéale de s'emparer de la Chine, laissant ainsi les Soviétiques devenir la seule et unique bannière d'autorité du communisme. Les forces armées soviétiques sont également prêtes à répondre à toute mesure de représailles contre les Chinois. Mais en fin de compte, la décision sur ce qui doit être fait appartient au Secrétaire Général."
 ZhenbaoConflict.2.d:0 "Nos soldats dans la province du Heilongjiang ont frappé de manière décisive. Les quelques gardes-frontières relativement peu équipés de l'île de Zhenbao ont été totalement pris par surprise, et l'île contestée est désormais sous contrôle chinois. D'après ce que nous pouvons observer, le Politburo semble être momentanément paralysé. Les partisans de la ligne dure au sein du gouvernement soviétique recommandent sans aucun doute une escalade, peut-être même une vaste attaque conventionnelle ou nucléaire, mais certains signes indiquent également que les Soviétiques pourraient être disposés à parvenir à un règlement négocié. Les forces armées soviétiques sont en état d'alerte dans leurs territoires d'Extrême-Orient, et nos propres forces sont prêtes à les affronter si elles choisissent une nouvelle escalade. Un coup porté aux Soviétiques à Zhenbao pourrait se répercuter dans tout le monde communiste, affaiblissant potentiellement le contrôle soviétique sur le bloc communiste."
 GLP.100.d:0 "[PRC.GetLeader]le projet de transformer [PRC.GetNameDef] d'une société agraire en un sommet de la puissance communiste ne s'est pas déroulé comme prévu. Avec le noble objectif de dépasser les impérialistes en [ENG.GetNameDef] en seulement quinze ans, [PRC.GetLeader] a déclaré une collectivisation massive de l'industrie et de l'agriculture au moyen de fourneaux en fonte et de projets étatiques intensifs sur les cultures. Même s'il n'y a eu que peu ou pas de réactions négatives à l'égard de ces projets lors de la conférence qui en a discuté à Lushan, les conséquences drastiques sur les projets du président sont devenues claires. Les rendements des cultures de la première année ont été considérablement inférieurs aux prévisions en raison d'une redistribution des travailleurs et d'essaims catastrophiques de criquets apparus à la suite de la campagne malavisée des quatre ravageurs. En outre, ces rendements inférieurs ont atteint des niveaux records en raison de la surveillance étroite des autorités centrales, ce qui signifie qu'un excédent de céréales inexistant a été retiré aux paysans qui en avaient besoin pour survivre. Au cours de ce plan, plus de trente millions de personnes sont mortes dans la région [PRC.GetNameDef], l'économie de la région [PRC.GetAdjective]s'est effondrée et l'hostilité envers le gouvernement a atteint un niveau sans précédent."
#[We can rebuild from this failure!]
 Cultural_Rev.4.d:0 "En mai 1966, le président Mao Zedong a convoqué une « session élargie » du Politburo, le groupe qui supervise le PCC. De manière inattendue, la séance a été chargée de rhétorique politique maoïste sur la lutte des classes, ainsi que d'attaques contre les dirigeants actuels et anciens du parti. En outre, le 16 mai, Mao a publié un document dans lequel il affirme de manière radicale que la bourgeoisie s'est infiltrée dans « le Parti, le gouvernement, l'armée et diverses sphères de la culture » afin de saboter la cause socialiste et de transformer la dictature du prolétariat en une dictature de la bourgeoisie. Cette notification à toute la Chine semble être une sorte de justification d'une attaque contre les contre-révolutionnaires cachés en Chine."
#[There is a storm coming…]  May 16 Notification //triggers Cultural_Rev.2 global event
 Cultural_Rev.200.d:0 "Même s'il ne fait aucun doute que le président Mao avait de bonnes intentions avec son Grand Bond en avant, son plan quinquennal s'est soldé par une catastrophe totale. Dans ses tentatives de restructurer la production agricole et industrielle au tout début du [PRC.GetName], il a infligé des dommages irréparables à notre grande nation. Bien que le gouvernement ait fait de son mieux pour dissimuler les résultats de sa politique calamiteuse, l'indignation face aux famines massives, à la violence et à l'effondrement général de l'économie est dirigée contre le président. Bien qu'il ait déjà été contraint d'abandonner son « Grand Bond », de nombreux membres du parti débattent de forcer Mao à se retirer de la présidence du [PRC.GetNameDef], et même de la présidence du [PRC.GetRulingParty]. Bien qu'il ait prouvé ses mérites dans la Guerre populaire de libération, ses échecs nous ont forcé la main."
#[He has proven himself incapable of leading China!] //Mao kicked from chair of PRC, not CPC. Liu Shaoqi becomes leader. Leads to cultural revolution
#[He is incapable of leading altogether!] //Mao kicked from chair of PRC and CPC, could also lead to consequences? idk
 Cultural_Rev.1.d:0 "Jiang Qing, ancienne actrice et épouse estimée de Mao Zedong, a revendiqué le contrôle de l'Opéra de Pékin. L'un des derniers vestiges de la décadente dynastie Qing, cette forme d'opéra désuète s'est révélée féodale et bourgeoise, ce qui doit être éradiqué si nous voulons respecter les nouvelles normes du prolétariat. Ces opéras voient leurs thèmes régulièrement remplacés pour garantir une bonne affirmation des idéaux révolutionnaires et modernes. Les huit nouveaux opéras modèles de Jiang Qing racontent des histoires de glorieuse lutte révolutionnaire contre les ennemis étrangers et de classe. De plus, ils racontent l'histoire de notre leader [PRC.GetLeader] ouvrant la voie au socialisme dans notre grande nation. Cet art inspiré renforce nos idéaux dans la lutte contre la bourgeoisie."
#[Another step towards crushing the counterrevolutionaries!]
 Cultural_Rev.3.d:0 "Après le départ du président Mao Zedong de la présidence de [PRC.GetNameDef], son ancien protégé Liu Shaoqui a assumé le rôle de président. Cependant, les frictions entre les deux dirigeants au sujet du Grand Bond en avant ont abouti à des étincelles massives qui se transforment lentement en un brasier rugissant. Mao Zedong a formellement condamné le président Shaoqi comme un ennemi de classe tentant d'orienter la révolution vers le capitalisme, et l'a ainsi déchu de tous ses rôles, battu et assigné à résidence pour ses crimes contre le peuple chinois."
#[Down with the counterrevolutionaries!]
 PRC_Tibet.1.d:0 "Le Tibet est passé sous le règne de la dynastie chinoise Qing en 1720 après que les forces chinoises ont réussi à expulser les forces du khanat de Dzoungar. Après la révolution Xinhai en 1911, ils sont devenus un État indépendant. À l'époque où le Tibet politique obtenait son indépendance de facto, ses systèmes socio-économiques et politiques ressemblaient à l'Europe médiévale. Les tentatives du 13e Dalaï Lama entre 1913 et 1933 pour agrandir et moderniser l'armée tibétaine ont finalement échoué, en grande partie à cause de l'opposition de puissants aristocrates et moines. Le gouvernement tibétain a eu peu de contacts avec les autres gouvernements du monde pendant sa période d'indépendance de facto, à quelques exceptions près ; notamment l'Inde, le Royaume-Uni et les États-Unis. Cela a laissé le Tibet isolé diplomatiquement et coupé au point qu'il ne pouvait pas faire connaître sa position sur des questions bien connues de la communauté internationale.\n\nNous n'avons cependant jamais abandonné notre affirmation selon laquelle le Tibet fait partie de la Chine et négocions avec eux depuis des années maintenant. Mais il est peut-être temps d'être plus agressifs si nous voulons qu'ils soient unis."
 PRC_Tibet.2.d:0 "La République populaire de Chine vient d'annoncer sa nouvelle politique à l'égard du Tibet. Dans une annonce très surprenante, le président Mao Zedong a annoncé que la RPC ne poursuivrait pas l'unification du Tibet avec la Chine, concentrant plutôt son attention ailleurs."
 PRC_Tibet.3.d:0 "Le gouvernement chinois a exigé que nous nous unissions sous son égide. Devons-nous nous y conformer ?"
 PRC_Tibet.4.d:0 "Excellente nouvelle le président ! Le gouvernement tibétain a accepté de nous rejoindre, à condition que nous lui accordions un certain degré d'autonomie en matière économique. Ce n'est bien sûr pas un problème, puisque nous pouvons simplement les écraser s'ils s'éloignent trop de nous."
 PRC_Tibet.5.d:0 "Le Tibet a refusé notre offre généreuse de nous rejoindre. Il semble que nous devons désormais réagir par la force militaire."
 PRC_Tibet.6.d:0 "Comme prévu, les forces chinoises nous submergent complètement. Aujourd'hui, ils sont venus avec une offre de paix, l'Accord en dix-sept points. Cet accord affirmerait la souveraineté chinoise sur le Tibet, tout en nous permettant de conserver une autonomie limitée. Moins nous voulons être détruits, plus nous devons accepter cet accord."
 PRC_Tibet.7.d:0 "Après de vilaines rumeurs, des milliers de personnes se sont rassemblées dans la capitale tibétaine pour protéger le Dalaï Lama. Cependant, cela s'est rapidement transformé en une protestation massive contre nous, exigeant que nous quittions le Tibet. Avec de plus en plus de gens qui s'y joignent, nous devons décider s'il faut écraser les manifestations ou se conformer à leurs revendications."

#Other
 Red_Guard.1.d:0 "Les jeunes se sont soulevés ! Inspirés par la rhétorique du Petit Livre rouge du président Mao, des hordes d'écoliers ont pris sur eux d'éliminer les éléments contre-révolutionnaires de [PRC.GetNameDef]et de rendre la Chine maoïste de l'intérieur vers l'extérieur. Ces jeunes s'attaquent à tout ce qui est contre-révolutionnaire. Les critiques des pièces de théâtre maoïstes ont déjà été attaquées, et des enseignants ont même été intimidés et attaqués en raison de leurs cours et de leur passé dans l'armée nationaliste. Même si les Gardes rouges se sont heurtés à une forte résistance de la part de nombreux éléments en Chine, ils ont reçu le soutien personnel du président Mao Zedong."
#[Long live Chairman Mao!] The Rise of the Red Guards (local)
 Red_Guard.2.d:0 "La Garde Rouge est à nouveau sous le feu des projecteurs ! La jeunesse révolutionnaire a lancé une attaque contre les vieilles coutumes, la vieille culture, les vieilles habitudes et les vieilles idées à la suite d'un éditorial encourageant la destruction de ces idées anti-prolétariennes dans le journal Quotidien du Peuple. Au cours des dernières semaines, la Garde rouge a forcé le changement des noms de magasins et de rues et a attaqué tous ceux qui s'opposaient à la révolution. En outre, ils ont lancé une campagne de destruction massive, détruisant l'architecture traditionnelle chinoise, la littérature, l'art, les temples et même les cimetières et les tombeaux impériaux. Bien que d'éminents responsables soient intervenus pour empêcher la poursuite de la campagne, un travail considérable a été accompli pour étouffer l'oppression du passé."
#[Maybe they have gone too far?] Four Olds Campaign
 Red_Guard.3.d:0 "Les Gardes rouges sont confrontées à un effondrement constant à la suite de plusieurs incidents. À plusieurs reprises, les Gardes rouges se sont retrouvés dans un conflit direct et sanglant contre l'Armée populaire de libération, prenant d'assaut les zones de l'APL sous les encouragements de l'épouse du président Mao, Jiang Qing. Les jeunes ont pris d'assaut les zones de production et se sont retrouvés en conflit avec les ouvriers des usines et les agriculteurs qui souhaitent maintenir le statu quo. Les conflits au sein du gouvernement sur la question de savoir s'il faut soutenir ou supprimer le parti ont encore ajouté à la confusion, et maintenant l'ancien front uni s'est effondré dans le factionnalisme et les luttes intestines entre les différentes factions."
#[Something must be done!] Chaos within the Red Guards!
 Red_Guard.4.d:0 "Suite à la déclaration du PCC qualifiant le radicalisme étudiant de contre-révolutionnaire, des mesures ont été prises pour réprimer la Garde rouge par le biais de la politique et de la force militaire. Les jeunes qui ont pris part à la révolution ont entendu de la bouche du président que le mouvement était terminé. Aujourd'hui, de nombreux étudiants sont envoyés à la campagne pour y être rééduqués et réadaptés par le travail et la pauvreté rurale. La Garde Rouge est morte."
#[That's a relief.] Up to the Mountains and Down to the Countryside Movement






