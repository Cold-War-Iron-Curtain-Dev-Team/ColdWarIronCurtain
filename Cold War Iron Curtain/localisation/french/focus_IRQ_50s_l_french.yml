 Pachachi.1.d: "Muzahim al-Pachachi, homme politique irakien chevronné et nationaliste arabe, a quitté l'Irak aujourd'hui. L'ancien Premier ministre irakien a contribué à la création de l'un des premiers groupes nationalistes arabes en Irak et a joué un rôle important dans la rédaction de la constitution irakienne de 1925. Pendant l'entre-deux-guerres, il a occupé divers postes ministériels et diplomatiques. Il a réussi à établir des liens avec l'URSS, des dirigeants militants anticoloniaux et d'autres nationalistes arabes, le mettant en désaccord avec le roi hachémite pro-occidental au pouvoir en Irak. En tant que Premier ministre, il a poussé l'Irak à s'impliquer fortement dans la libération de la Palestine et sa pression continue en faveur des droits des Palestiniens a rendu furieux les Hachémites en Irak et en Jordanie. La dynastie jordanienne a sa propre vision de la Palestine tandis que le roi irakien craint que sa position pro-occidentale ne soit sapée par les nationalistes anti-occidentaux. Ces dernières semaines, des partisans hachémites pro-britanniques et des responsables du palais ont exercé une immense pression sur Muzahim al-Pachachi pour qu'il quitte l'Irak dans le but de freiner la montée de la ferveur nationaliste arabe en Irak. Bien qu'ils aient réussi à le faire partir, nombreux sont ceux qui pensent que Muzahim va simplement s'allier avec d'autres nationalistes arabes de la région et propager son message sans être gêné par la surveillance hachémite."
 CENTO.1.d: "Les États-Unis ont identifié le Moyen-Orient comme un espace vulnérable à travers lequel le communisme pourrait s'étendre. Les efforts américains pour former un commandement au Moyen-Orient ont échoué en raison des sentiments anticoloniaux et de la montée du nationalisme arabe. Au lieu de cela, l'accent a été mis sur la formation d'un « niveau nord » et sur le confinement du communisme en reliant l'OTAN à l'OTASE pour achever l'encerclement de Moscou. Cela signifiait former une alliance qui relierait géographiquement la Turquie (membre de l'OTAN) au Pakistan (membre de l'OTASE). La Turquie et l'Irak ont récemment signé un traité de coopération appelé Pacte de Bagdad qui appelait à une résistance commune aux ingérences extérieures et invitait les États de la région à s'y joindre. Le Royaume-Uni, le Pakistan et l'Iran ont convenu de s'unir pour solidifier ainsi le Pacte de Bagdad en tant qu'alliance régionale de liens militaires, culturels et économiques. Bien que les États-Unis aient soutenu cette initiative et qu'elle corresponde à ses objectifs régionaux, ils ont refusé d'en devenir membre. Cela soulève des questions sur la manière dont l'alliance coopérera militairement sans la participation directe des États-Unis. Chaque État membre a ses propres intérêts et, mis à part l'Iran et la Turquie, ni le Pakistan ni l'Irak ne bordent un État communiste. Sur le papier, l'alliance semble solide, mais le temps nous dira si, en pratique, elle deviendra une OTAN du monde musulman."
 Faisal.1.d: "Aujourd'hui, le roi Fayçal II d'Irak a atteint sa majorité et a pris sa place à la tête de l'Irak. Bien qu'il soit monté sur le trône à l'âge de 4 ans en 1939 après la mort du roi Ghazi, son père, le pays avait été gouverné par son régent et oncle pro-britannique, le prince Abd al-llah. Le roi Fayçal II a commencé le couronnement en voyageant dans une calèche découverte conduite par des cavaliers élégamment habillés pour se rendre au Majlis irakien. Il entra au Parlement avec des troupes au garde-à-vous en uniforme de cérémonie, le long des lignes européennes. Après s'être adressé au Majlis, le roi Fayçal II a prêté serment de royauté et a accepté un gage de loyauté de la part du Majlis et du peuple irakien de la part du président du Sénat. Après la cérémonie, le roi a assisté à une réception massive où il a reçu des dignitaires notables, dont le duc de Gloucester. Les uniformes et pratiques de style européen tout au long du couronnement indiquent que le roi Fayçal II espère poursuivre la politique de son oncle. Il reste incertain s'il pourra contenir la menace croissante du panarabisme et du nationalisme arabe, car malgré la magnifique cérémonie, des Irakiens des quartiers de classe moyenne se sont plaints des dépenses liées au couronnement. Dans les quartiers ouvriers, certains Irakiens ont été découragés par un événement au cours duquel le roi était encerclé par des gardes armés et non par le peuple irakien."
 Suwaidi.1.d: "Tawfiq al-Suwaidi a décidé d'accepter l'invitation du roi Fayçal II de former un nouveau gouvernement et de travailler avec les Hachémites. Brillant avocat et ancien Premier ministre ayant grandi à la fin de l'Empire Ottoman, al-Suwaidi a acquis une notoriété à l'époque du mandat britannique. Aujourd'hui, il est un homme politique chevronné et une personnalité internationale. Les Hachémites espéraient que ses tendances pro-occidentales se traduiraient par un soutien à leur régime, mais al-Suwaidi a historiquement prouvé qu'il croyait aux principes occidentaux de démocratie représentative et de droits individuels. La famille royale irakienne considérait avec méfiance ses précédents mandats de Premier ministre, car il avait permis aux partis politiques de fonctionner et ordonné au ministère de l'Intérieur d'assouplir ses opérations, en particulier contre les gauchistes. Cependant, la situation dans laquelle se trouve l'Irak nécessite un leadership fort et un homme de l'expérience et de la réputation d'al-Suwaidi dépasse les risques liés à la levée des restrictions gouvernementales et de la surveillance des groupes douteux dans le pays. Pour Tawfiq al-Suwaidi, il a une longue histoire d'affrontements avec les Hachémites, mais lui aussi estime que le moment est peut-être venu pour une relation plus fructueuse et peut-être pour un Irak plus démocratique."
 Central_League_Games.1.d: "La Ligue centrale irakienne se compose d'équipes de football de clubs et d'institutions basées à Bagdad. Bien qu'elle soit l'une des quatre ligues régionales du pays, la Ligue centrale irakienne est considérée comme la première ligue de football irakienne. Ses champions représentent ensuite l'Irak au Championnat d'Asie des Clubs. Le club Haris Al-Maliki est considéré comme le club phare du pays. Cependant, tous les matches semblent populaires, car ils attirent souvent des foules à guichets fermés. En outre, de nombreux Irakiens suivent de près les résultats dans les médias dans l'espoir que leur équipe puisse remporter la victoire. Les grandes institutions comme la police et l'armée disposent également d'équipes sur le terrain, ce qui donne aux membres de ces institutions davantage de raisons de soutenir leur équipe. L'amour du football irakien maintient la population heureuse pendant la saison de championnat et permet aux institutions rivales de résoudre leurs tensions sur le terrain plutôt que dans la rue. Quel beau jeu c'est."
 Ayoubi.1.d: "Ali Jawdad al-Ayoubi a longtemps servi les Hachémites en Irak. Après avoir servi pour l'éphémère régime syrien de Faisal, il l'a suivi en Irak. Il a occupé des postes de direction et des postes diplomatiques importants, y compris plusieurs mandats en tant que Premier ministre de l'Irak. Al-Ayoubi, un leader politique chevronné, reconnaît le changement de l'ordre mondial après la fin de la Seconde Guerre mondiale. Dans le cadre d'une manoeuvre diplomatique dramatique, al-Ayoubi s'est envolé pour Washington D.C. Pour ouvrir personnellement une ambassade irakienne dans la capitale américaine. Le gouvernement irakien reconnaît que les Britanniques ne sont plus la puissance suprême qu'ils étaient autrefois. Si les Hachémites veulent survivre face à la montée du nationalisme anti-monarchique, panarabe et de l'agitation communiste, ils devront renforcer leurs liens avec les Américains et la nouvelle ambassade sera la première étape de ce processus. Aux États-Unis, les médias ont fait état de l'enthousiasme et de l'intérêt locaux suscités par la décision dramatique du haut dirigeant irakien de venir ouvrir personnellement une ambassade. En Irak, cette décision est saluée comme une reconnaissance de l'ordre mondial tandis que les anti-monarchistes soulignent cette action comme le fait que l'Irak continue de céder sa souveraineté aux forces coloniales."
 Constitution_Party.1.d: "La frustration et la colère face à la répression politique en Irak et à l'ingérence britannique se sont transformées en manifestations et en grèves contre la monarchie et le traité anglo-irakien de 1948. Depuis trop longtemps, estiment les manifestants, l'Irak a vu sa politique étrangère dictée par Londres tandis que la dynastie hachémite a restreint toute expression du discours politique. Au milieu de ces troubles, le roi Fayçal II a publié une dénonciation publique contre le Parti constitutionnel. Il affirme que le parti a attisé la colère des manifestants et a cherché à provoquer une guerre civile au nom de ses propres acquis politiques. Il affirme qu'en réalité, une grande partie des plaintes des manifestants sont en réalité causées par le Parti de la Constitution et que, comme les manifestations visent la famille royale, le Parti de la Constitution refuse d'aider à calmer les troubles. Cette condamnation du Parti de la Constitution a surpris de nombreuses personnes en Irak et il reste à voir si les efforts du roi pour rejeter le blâme et la responsabilité sur le parti contribueront à sa capacité à calmer les troubles qui ravagent l'Irak."
 IRQ_Reign.1.d: "L'Irak est peut-être l'État le plus arbitrairement conçu qui a émergé de la Première Guerre mondiale. Les Britanniques ont fusionné trois Ottoman provinces distinctes pour créer l'Irak. Le nouvel État manquait d'homogénéité ethnique, religieuse ou linguistique. La majorité arabe était divisée entre sunnites et chiites. Le pays comptait une importante minorité kurde concentrée dans le nord. Une importante population chrétienne assyrienne existait ainsi qu'une importante communauté juive à Bagdad. Les Britanniques cherchaient à gouverner l'Irak par le biais de traités avec un gouvernement ami afin de garantir leurs intérêts et d'éviter des dépenses. Faisal ibn Hussein, récemment déposé par les Français en Syrie, a été amené par les Britanniques à devenir le roi Fayçal Ier d'Irak. Bien qu'il n'ait aucun lien avec le pays, le roi Fayçal Ier s'est montré habile à servir de médiateur entre les factions irakiennes et à établir la légitimité de sa dynastie auprès du peuple. Sa mort en 1933 a amené sur le trône l'inepte roi Ghazi. Après la mort du roi Ghazi en 1939, le roi Fayçal II, âgé de trois ans, a pris la relève, mais le pouvoir appartient au régent, le prince Abdallah. La mort prématurée du roi Fayçal Ier a vu le Parlement dominé par des politiciens vieillissants de l'ère Ottomanqui alternent constamment le pouvoir au Parlement. L'armée a renversé plusieurs premiers ministres depuis le début de la régence du prince Abdallah, même si elle a choisi de ne pas renverser le système. La Seconde Guerre mondiale a été le théâtre du plus grand défi auquel les Hachémites ont dû faire face lorsque des officiers de l'armée nationaliste ont pris le pouvoir. Les Hachémites et le Parlement ne sont revenus au pouvoir qu'après une invasion britannique, entachant à jamais l'État hachémite aux yeux d'une population de plus en plus nationaliste. La politique centralisatrice de l'État irakien a donné lieu à une répression brutale alors que l'armée a réprimé les Kurdes et les Assyriens. En plus de la résistance à la centralisation, la classe moyenne anticoloniale et l'agitation de gauche parmi les travailleurs urbains sont autant de menaces émergentes pour l'État hachémite irakien. Le temps nous dira si le roi Fayçal II pourra mettre fin à l'incertitude politique et restaurer la confiance du peuple dans la dynastie."
 
IRQ_formalise_arab_federation_tooltip: "§HCe Focus sera automatiquement complété lors de la création de la Fédération Arabe.§!"
 hashemite_survival_tt: "§HCette orientation ouvre la possibilité d'étendre la Fédération arabe à la Syrie et à l'Arabie et garantit la survie du régime hachémite en Irak. Cette focalisation doit être prise avant juillet 1958"
 IRQ_Integrate_Hashemite_Arabia_into_the_Federation: "Intégrer l'Arabie dans la Fédération"
 IRQ_the_hashemite_soveriegnty: "La souveraineté hachémite"
 IRQ_the_hashemite_soveriegnty_desc: "L'Irak se trouve dans une situation difficile dans une nouvelle ère. Nous devons oeuvrer pour garantir que nos relations avec le monde occidental et avec notre propre population soient positives sans nuire à nos relations avec l'autre."
 IRQ_exodus_of_the_jews: "Exode des Juifs"
 IRQ_exodus_of_the_jews_desc: "Le gouvernement israélien tente d'aider les Juifs d'Irak à émigrer vers Israël via l'Iran et Chypre. Nous devons réprimer ces tentatives."
 IRQ_parliamentary_election: "Élection parlementaire"
 IRQ_parliamentary_election_desc: "Le moment est venu pour le peuple irakien d'élire un nouveau Parlement."
 IRQ_financial_managment: "Gestion financière"
 IRQ_financial_managment_desc: "Un pays existe ostensiblement pour le bénéfice et la sécurité de ses habitants. En tant que tel, nous devrions commencer à moderniser et transformer notre économie pour qu'elle corresponde à celle du monde occidental, ce n'est qu'ainsi que nous pourrons apporter la prospérité à notre peuple."
 IRQ_increase_troops_in_palestine: "Augmenter les troupes en Palestine"
 IRQ_increase_troops_in_palestine_desc: "Le monde arabe est toujours sous la menace d'une agression sioniste, nous devrions accroître notre engagement militaire sur les lignes de front du conflit israélo-arabe en Palestine."
 IRQ_unpopular_rule: "Règle impopulaire"
 IRQ_unpopular_rule_desc: "La position pro-occidentale de notre gouvernement a rendu notre régime très impopulaire auprès de nombreux critiques du régime. Faire taire ces critiques et écrivains et garder leurs oeuvres accessibles au public contribuera à la stabilité interne et augmentera le soutien à notre gouvernement."
 IRQ_denounce_the_constitution_union_party: "Dénoncer le Parti de l'Union Constitutionnelle"
 IRQ_denounce_the_constitution_union_party_desc: "Le Parti de l'Union constitutionnelle est un parti politique fondé par Nuri Al-Said en 1949, qui vise à restreindre l'intervention du prince héritier Abd al-Ilah dans la politique irakienne, à soutenir Al-Said dans la formation du gouvernement et à résister aux partis de gauche. Nuri Said est un homme politique corrompu qui ne défend avant tout que ses propres intérêts, même au détriment de l'indépendance du pays ou de la vie de sa population, et sa politique n'a provoqué que des troubles au sein de la population. Il faut le dénoncer."
 IRQ_support_the_constitutional_union_party: "Soutenez le Parti de l'Union Constitutionnelle"
 IRQ_support_the_constitutional_union_party_desc: "Le Parti de l'Union constitutionnelle est un parti politique fondé par Nuri Al-Said en 1949, qui vise à restreindre l'intervention du prince héritier Abd al-Ilah dans la politique irakienne, à soutenir Al-Said dans la formation du gouvernement et à résister aux partis de gauche. Ce parti est important pour maintenir l'influence communiste à l'écart du gouvernement, et Nuri Said est un homme politique important qui a servi notre pays pendant longtemps, et il a donc besoin du soutien du roi."
 IRQ_crackdown_on_terrorism: "Répression du terrorisme"
 IRQ_crackdown_on_terrorism_desc: "Plusieurs groupes terroristes chiites existent dans le sud et visent à renverser la monarchie et le gouvernement dominé par les sunnites. Ces groupes dangereux doivent être combattus et détruits."
 IRQ_maintain_british_relations: "Entretenir les relations britanniques"
 IRQ_maintain_british_relations_desc: "Le coup d'État de 1941 et les manifestations de 1948 ont rendu les Britanniques sceptiques quant à notre capacité à maintenir la stabilité de la nation. Nous devons maintenir à flot nos relations avec eux et leur assurer que notre situation est sous contrôle."
 IRQ_condemn_the_1949_agreements: "Condamner les accords de 1949"
 IRQ_condemn_the_1949_agreements_desc: "Nous n'avons pas réussi à renverser l'État d'Israël et les États arabes situés à l'est ont signé des accords d'armistice avec les sionistes. Ces actes ont suscité d'importantes protestations dans notre pays et doivent être condamnés afin d'apaiser notre population."
 IRQ_restrict_israeli_recognition: "Restreindre la reconnaissance israélienne"
 IRQ_restrict_israeli_recognition_desc: "L'État israélien a envahi et repris les maisons de milliers de Palestiniens arabes, et nous ne pouvons pas les laisser faire cela sans conséquence."
 IRQ_negotiate_with_the_populace: "Négocier avec la population"
 IRQ_negotiate_with_the_populace_desc: "Le traité anglo-irakien de 1948 et la guerre israélo-arabe de la même année ont provoqué d'importantes manifestations anti-impérialistes et antisionistes dans tout notre pays, et la répression gouvernementale de ces manifestations n'a fait qu'empirer les choses. Nous devons proposer une négociation pacifique avec les manifestants et céder à leurs revendications si nous voulons rester au pouvoir."
 IRQ_sign_oil_agreements: "Signer des accords pétroliers"
 IRQ_sign_oil_agreements_desc: "Une récente découverte de pétrole dans le sud a incité diverses sociétés à vouloir y lancer des opérations de forage. Passer un accord commercial avec eux nous permettra de profiter encore plus."
 IRQ_host_the_iraqi_central_league_game: "Organisez le match de la Ligue centrale irakienne"
 IRQ_host_the_iraqi_central_league_game_desc: "Le football est l'un des sports les plus populaires en Irak, et organiser un match entre les équipes irakiennes les plus populaires unira notre population et nous rapportera d'importantes sommes d'argent de la part des fans de football."
 IRQ_establish_the_university_of_baghdad: "Créer l'Université de Bagdad"
 IRQ_establish_the_university_of_baghdad_desc: "Bagdad est depuis longtemps le centre de nombreuses universités et écoles célèbres dans le monde, et avec une population croissante qui a besoin d'être éduquée, l'expansion des universités contribuera grandement aux activités intellectuelles de l'Irak."
 IRQ_arabize_kirkuk: "Arabiser Kirkouk"
 IRQ_arabize_kirkuk_desc: "Kirkouk a longtemps été une ville divisée entre Kurdes, Arabes et Turcs. Avec la montée des sentiments séparatistes kurdes dans la région, nous devons nous assurer que de nombreux Arabes immigrent à Kirkouk afin d'en faire une ville arabe."
 IRQ_force_civil_service: "Fonction publique des forces"
 IRQ_force_civil_service_desc: "Les séparatistes kurdes causent depuis longtemps des problèmes au pays, donc au lieu de simplement les emprisonner, les forcer à travailler pour l'Irak serait bien plus utile et constituerait une punition bien plus ironique."
 IRQ_countering_operation_ezrah: "Contrer l'opération Ezrah"
 IRQ_countering_operation_ezrah_desc: "Les opérations Ezrah et Néhémie visent à transférer tous les Juifs irakiens vers Israël. Nous ne pouvons pas les laisser faire cela, car cela les renforcerait et nous affaiblirait."
 IRQ_financial_gains_from_AJJDC: "Gains financiers de l'AJJDC"
 IRQ_financial_gains_from_AJJDC_desc: "L'opération visant à aider les Juifs irakiens à émigrer vers Israël est financée par l'American Jewish Joint Distribution Committee. Cependant, avec un travail financier astucieux, une grande partie de ces fonds peut être acheminée vers le gouvernement."
 IRQ_crackdown_on_airlift_operations: "Répression des opérations de transport aérien"
 IRQ_crackdown_on_airlift_operations_desc: "De nombreux Juifs irakiens sont transportés par avion pour fuir le pays. Nous devons intercepter ces avions dans le cadre de notre contre-attaque à l'opération."
 IRQ_reverse_ban_on_jewish_emmigration: "Annuler l'interdiction de l'émigration juive"
 IRQ_reverse_ban_on_jewish_emmigration_desc: "En raison de l'importante pression politique exercée sur nous par les gouvernements américain, britannique et israélien, en plus des embargos économiques proposés, revenir sur l'interdiction de l'émigration juive vers Israël sera la meilleure solution."
 IRQ_mass_arrests: "Arrestations massives"
 IRQ_mass_arrests_desc: "De nombreux Juifs irakiens sont soupçonnés d'activités sionistes ou communistes. Nous devrions donc arrêter et interroger ces espions présumés. Parce qu'après tout, mieux vaut prévenir que guérir. "
 IRQ_iraqi_secret_services: "Services secrets irakiens"
 IRQ_iraqi_secret_services_desc: "L'opération Ezra permet à de nombreux agents sionistes d'entrer dans le pays et d'espionner notre gouvernement. Nous devrions créer un service secret pour traquer ces agents."
 IRQ_denounce_israeli_spying_activities: "Dénonçons les activités d'espionnage israéliennes"
 IRQ_denounce_israeli_spying_activities_desc: "Malgré nos efforts pour empêcher les espions israéliens d'entrer dans le pays, ils restent toujours. Dénoncer publiquement ces espions nuira certainement à la réputation d'Israël sur la scène mondiale."
 IRQ_coronation_of_faisal_ii: "Couronnement de Fayçal II"
 IRQ_coronation_of_faisal_ii_desc: "Le prince Abd al-llah, ancien prince héritier du Hedjaz, dirige le royaume d'Irak en tant que régent depuis la mort de son neveu le roi Ghazi I. Enfin, le jeune Faisal, fils de Ghazi, a atteint la majorité selon les règles de la constitution et peut assumer la direction du pays. Le prince régent Abd al-llah a organisé une somptueuse cérémonie de couronnement au palais royal où Fayçal sera officiellement investi du contrôle de l'État. Vive Sa Majesté Fayçal II Par la grâce de Dieu et de la Constitution, Roi d'Irak !"
 IRQ_the_journey_of_al_ayoubi: "Le voyage d'Al-Ayoubi"
 IRQ_the_journey_of_al_ayoubi_desc: "Ali Jawdat Al-Ayoubi sert fidèlement la monarchie hachémite depuis l'époque du roi Fayçal Ier en Syrie. Proche conseiller et confident du prince-régent et du roi Fayçal II, il est chargé d'une importante mission diplomatique à Londres pour les négociations préliminaires à la formation du pacte de Bagdad."
 IRQ_founding_of_the_baghdad_pact: "Fondation du Pacte de Bagdad"
 IRQ_founding_of_the_baghdad_pact_desc: "Après des semaines de négociations, nous avons presque finalisé l'accord qui deviendra connu sous le nom de CENTO ou Pacte de Bagdad. Il s'agit d'un important traité de sécurité parrainé par les États-Unis et qui inclura presque tous les pays alignés sur l'Occident au Moyen-Orient et les Britanniques. Nous rejoindrons officiellement ce que l'on appelle l'OTAN du Moyen-Orient et Bagdad en sera le siège."
 IRQ_purge_soviet_influence: "Purger l'influence soviétique"
 IRQ_purge_soviet_influence_desc: "L'Union soviétique est le principal sponsor des mouvements communistes dans notre pays. Leur influence déstabilise notre pays et constitue une grave menace pour la monarchie. Nous devons prendre des mesures immédiates pour éliminer toute présence soviétique dans notre pays, même si cela ne leur fera certainement pas plaisir."
 IRQ_denounce_british_presence_in_the_suez_crisis: "Dénoncer la présence britannique dans la crise de Suez"
 IRQ_denounce_british_presence_in_the_suez_crisis_desc: "Malgré notre alliance nominale à travers le Pacte de Bagdad, les relations avec les Britanniques se sont détériorées depuis des années, depuis le retrait britannique après la Seconde Guerre mondiale. Leur contrôle sur Suez leur confère une influence indue sur toutes les nations arabes et nous devrions exprimer clairement notre position concernant l'occupation britannique."
 IRQ_local_democratic_elections: "Élections démocratiques locales"
 IRQ_local_democratic_elections_desc: "Le temps est venu d'organiser de nouvelles élections, mais cette fois dans les circonscriptions locales et dans les administrations de l'État. Même si nous avons réussi à maintenir un contrôle strict sur le parlement national afin d'empêcher le sentiment anti-monarchiste de prendre trop de pouvoir, les législatures locales, en revanche, sont bien plus indépendantes de notre contrôle. Nos conseillers s'attendent à ce que les partis et hommes politiques anti-hachémites gagnent du terrain lors de ces élections grâce à cela."
 IRQ_crackdown_on_pachachi: "Répression contre Pachachi"
 IRQ_crackdown_on_pachachi_desc: "L'ancien Premier ministre Muzahim al-Pachachi est la principale voix du panarabisme en Irak depuis de nombreuses années et, à ce titre, est souvent entré en conflit avec la monarchie. De nombreux membres de notre gouvernement ont fait pression sur le roi pour qu'il l'expulse du pays, et même si cela porterait un coup dur à la force des nationalistes, cela provoquerait certainement la colère de nombre de ses partisans."
 IRQ_forcefully_remove_british_influence: "Supprimer avec force l'influence britannique"
 IRQ_forcefully_remove_british_influence_desc: "Les Britanniques contrôlent une grande partie de notre politique depuis la fondation de notre Royaume. Heureusement pour nous, la puissance britannique dans la région s'est détériorée et King et ses conseillers ont décidé que le moment était venu de nous débarrasser complètement de la domination britannique."
 IRQ_establish_the_reconstruction_sector: "Créer le secteur de la reconstruction"
 IRQ_establish_the_reconstruction_sector_desc: "En 1945, les Kurdes, sous la direction de Mustafa Barzani, ont mené une rébellion contre notre gouvernement. Bien qu'elle ait été rapidement réprimée et que Barzani ait été contraint de fuir vers l'Union soviétique avec ses partisans, elle a néanmoins provoqué des destructions généralisées dans les régions du nord de l'Irak. Malgré le soulèvement qui a eu lieu il y a des années, la région ne s'est pas encore complètement rétablie et le nouveau roi Fayçal II a décidé de se lancer dans un programme de reconstruction et d'en profiter pour investir et développer davantage le nord de l'Irak."
 IRQ_new_palaces: "Nouveaux palais"
 IRQ_new_palaces_desc: "Pour célébrer le couronnement de Fayçal II, plusieurs nouveaux palais ont été en construction pour le plaisir du roi et de la famille royale. Cependant, parallèlement aux palais, les infrastructures et les communautés locales ont été rénovées et modernisées. Cela a conduit à une augmentation des activités commerciales et économiques dans les zones autour des nouveaux palais, ce qui a grandement plu à la population locale."
 IRQ_vast_infastructure_project: "Vaste projet d'infrastructure"
 IRQ_vast_infastructure_project_desc: "Bagdad était autrefois considérée comme l'épicentre du monde islamique, juste derrière les villes saintes de La Mecque et de Médine. Cependant, depuis sa destruction par les Mongols, elle n'est plus que l'ombre d'elle-même. Le roi Fayçal II a proposé une série de projets d'infrastructures à grande échelle dans et autour de la ville pour aider Bagdad à retrouver son ancienne gloire. "
 IRQ_work_with_aramco: "Travailler avec Aramco"
 IRQ_work_with_aramco_desc: "Aramco est la compagnie pétrolière publique d'Arabie Saoudite. Ils ont prouvé qu'ils étaient une entreprise compétente avec le boom pétrolier saoudien. Nous devrions les inviter, avec leur expertise, à nous aider à développer nos propres champs de pétrole et à faire de l'Irak la prochaine superpuissance pétrolière."
 IRQ_northern_dam_constructions: "Constructions de barrages du Nord"
 IRQ_northern_dam_constructions_desc: "Le Tigre et l'Euphrate sont considérés comme les deux fleuves les plus importants de l'histoire de l'humanité, n'ayant d'égal que le grand Nil. C'est entre ces deux fleuves que sont nées les premières civilisations de l'humanité. En hommage à cette tradition, nous devrions investir dans les infrastructures pour capitaliser sur le potentiel hydroélectrique que peuvent exploiter ces deux grands fleuves."
 IRQ_the_baghdad_international_fair: "La Foire internationale de Bagdad"
 IRQ_the_baghdad_international_fair_desc: "Bagdad était autrefois considérée comme la ville la plus éclairée au monde, avec des érudits du monde islamique et même chrétien venus faire briller ne serait-ce qu'un soupçon de la sagesse emmagasinée à Bagdad. Nous devrions une fois de plus faire de Bagdad un centre mondial de science et d'apprentissage. Organiser une foire internationale et inviter les experts les plus intelligents du monde entier à discuter et à présenter leurs recherches serait un premier pas dans la bonne direction."
 IRQ_state_funded_programs: "Programmes financés par l'État"
 IRQ_state_funded_programs_desc: "Il est bien reconnu par notre gouvernement que la monarchie n'est pas appréciée du peuple comme elle devrait l'être. Afin de prouver que les Hachémites ont à l'esprit les meilleurs intérêts du peuple, nous devrions augmenter le financement des programmes sociaux et des services publics. Même si nos conseillers financiers s'attendent à ce que cela pèse lourdement sur le budget, les avantages politiques et sociaux potentiels dépassent de loin toute perte monétaire."
 IRQ_build_new_public_institutions: "Construire de nouvelles institutions publiques"
 IRQ_build_new_public_institutions_desc: "Dans le cadre de nos efforts pour faire aimer la monarchie au peuple, nous devrions construire de nouvelles écoles, hôpitaux, palais de justice et tout autre type d'institution publique pour montrer au peuple irakien que son gouvernement est bienveillant."
 IRQ_establish_a_new_ministry: "Créer un nouveau ministère"
 IRQ_establish_a_new_ministry_desc: "Notre Royaume est l'un des nombreux peuples et ethnies différents, créant ainsi un cauchemar bureaucratique pour nos ministres. Nous devrions créer de nouveaux ministères pour mieux gérer les nombreuses tâches nécessaires à la gestion de notre État. Non seulement cela allégerait la charge de travail des responsables gouvernementaux actuels, mais cela contribuerait également à faciliter une interaction plus rapide et meilleure du gouvernement avec la population, ce qui les attirerait sûrement auprès de la monarchie."
 IRQ_dissolute_the_national_congress_union_party: "Dissoudre le Parti syndical du Congrès national"
 IRQ_dissolute_the_national_congress_union_party_desc: "Le Parti de l'Union du Congrès National est depuis un certain temps déjà une épine dans le pied de la monarchie. Ils ont insisté pour que le pouvoir du roi et du régent avant lui soit de plus en plus limité. Il est temps de traiter cette nuisance et de la dissoudre formellement afin de les empêcher d'interférer dans le devoir de gouverner du roi."
 IRQ_promote_arab_unity: "Promouvoir l'unité arabe"
 IRQ_promote_arab_unity_desc: "Alors que de nombreux nationalistes panarabes affirment que la dynastie hachémite s'oppose à l'unité arabe, cela ne pourrait être plus éloigné de la vérité. Ce sont les Hachémites sous Hussein ibn Hashem et Faisal bin Hussein qui ont été les premiers à rechercher l'unification arabe et l'indépendance des Ottoman Turcs. La dynastie hachémite est le seul dirigeant légitime d'un monde arabe uni et pour le prouver, nous devrions promouvoir un mouvement panarabe dirigé par les hachémites au sein de notre pays."
 IRQ_formalise_arab_federation: "Officialiser la Fédération arabe"
 IRQ_formalise_arab_federation_desc: "En tenant sa promesse d'unité arabe, le roi Fayçal II et le gouvernement irakien ont engagé des négociations avec le cousin de Faisal, le roi Hussein de Jordanie, pour la création d'une fédération arabe entre les deux royaumes. La création d'une telle fédération prouverait au monde arabe que les Hachémites cherchent à travailler ensemble pour unir tous les Arabes sous un même drapeau."
 IRQ_inspire_revolt_in_hejaz: "Inspirer la révolte au Hedjaz"
 IRQ_inspire_revolt_in_hejaz_desc: "Dans les années 1920, la perfide maison des Saoud a usurpé le monarque hachémite, le roi Hussein, et le prince héritier, notre ancien prince régent 'Abd al-llah, de leurs trônes légitimes. Le moment est venu de renverser la dynastie saoudienne illégitime et pour les Hachémites de récupérer non seulement leur trône mais aussi leur domination légitime sur toute l'Arabie."
 IRQ_hashemite_reentry_into_syria: "Rentrée hachémite en Syrie"
 IRQ_hashemite_reentry_into_syria_desc: "Les Syriens voyant les avantages d'une monarchie dirigée par les Hachémites, ils ont invité l'ancien prince-régent 'Abd al-llah à devenir roi du royaume réformé de Syrie. Nous devrions inviter formellement le régent devenu monarque à se joindre à ses parents hachémites au sein de la Fédération arabe et à franchir la prochaine étape vers l'unité arabe."
 IRQ_milk_new_demands: "Lait Nouvelles demandes"
 IRQ_milk_new_demands_desc: "Le pétrole est l'or noir des déserts et, ces dernières années, avec la commercialisation des automobiles et la motorisation rapide des armées, la demande a explosé. Afin de répondre à cette nouvelle demande, nous devons développer et étendre nos champs de pétrole et nos opérations d'extraction de pétrole."
 IRQ_creation_of_a_large_public_sector: "Création d'un grand secteur public"
 IRQ_creation_of_a_large_public_sector_desc: "Aux côtés du secteur privé, pour qu'une économie puisse véritablement prospérer, il faut un secteur public dynamique et solide afin que l'État puisse répondre à ses propres demandes sans dépendre des entreprises privées. Cela fournira également un grand nombre d'emplois publics confortables et sûrs qui profiteront grandement aux classes inférieures qui, autrement, pourraient trouver plus difficilement un emploi dans le secteur privé."
 IRQ_oil_interest: "Intérêts pétroliers"
 IRQ_oil_interest_desc: "Le succès de notre précédente campagne d'expansion de nos opérations d'extraction de pétrole a commencé à attirer des investisseurs et des entrepreneurs qui cherchent à tirer profit des nouveaux gisements de pétrole découverts. Nous devrions bien sûr négocier le meilleur accord pour le gouvernement et permettre à ces nobles hommes d'affaires de produire encore plus de pétrole pour nous."
 IRQ_higher_oil_production: "Production pétrolière plus élevée"
 IRQ_higher_oil_production_desc: "On n'a jamais trop de bonnes choses et, suivant ce principe, le roi Fayçal II a ordonné la construction d'encore plus de raffineries de pétrole et de forages pour exploiter les vastes richesses de nos déserts."
 IRQ_silo_construction: "Construction de silos"
 IRQ_silo_construction_desc: "Avec l'augmentation de la production pétrolière, nous sommes confrontés à un problème inévitable : celui du stockage du pétrole. Tout ce pétrole sera gaspillé si, une fois extrait, il n'y a pas d'endroit où le mettre, nous devons investir dans la création de silos supplémentaires et de réserves de carburant pour être sûrs d'en récupérer jusqu'à la dernière goutte."
 IRQ_increase_oil_prices: "Augmenter les prix du pétrole"
 IRQ_increase_oil_prices_desc: "Si vous remontez assez loin, vous verrez que l'argent pousse effectivement sur les arbres, mais pas le pétrole et, en tant que tel, le prix du pétrole devrait refléter sa rareté et sa difficulté à extraire. Jusqu'à présent, nous avons été généreux sur nos prix, mais cette pratique devrait cesser. Le roi Fayçal II a proposé d'augmenter les prix du pétrole et d'utiliser les revenus générés par cette mesure pour construire de nouveaux quartiers financiers à Bagdad et développer le secteur des services. Un tel plan rapporterait sûrement de grands avantages financiers et le gouvernement est impatient de mettre en oeuvre cette proposition."
 IRQ_increase_electric_consumption: "Augmenter la consommation électrique"
 IRQ_increase_electric_consumption_desc: "Le pétrole est le principal composant de nombreux produits pétrochimiques. Ces produits pétrochimiques ont diverses utilisations, mais l'une des plus importantes est celle de la production d'électricité. Avec la récente augmentation de la production pétrolière, il n'y a jamais eu de meilleure opportunité d'augmenter considérablement la consommation électrique de notre pays en construisant davantage de centrales électriques et, en tant que tel, nous devrions immédiatement ordonner la construction de ces centrales."
 IRQ_introduce_american_oil_companies: "Présenter les compagnies pétrolières américaines"
 IRQ_introduce_american_oil_companies_desc: "Le pétrole nécessite un processus long et compliqué pour être transformé en quelque chose. Les Américains se livrent à toute cette activité de raffinage du pétrole depuis des décennies et ont connu beaucoup de succès. En invitant les compagnies pétrolières américaines à raffiner nos vastes réserves de pétrole brut avec des contrats avantageux, nous pouvons utiliser leur expertise pour garantir le déroulement fluide et efficace de ce processus."
 IRQ_provide_capital_to_IPC: "Fournir du capital à IPC"
 IRQ_provide_capital_to_IPC_desc: "La Compagnie pétrolière irakienne est une société majeure impliquée dans bon nombre de nos puits de pétrole. Nous devons nous assurer qu'ils disposent du capital nécessaire pour poursuivre et même accroître leur production."
 IRQ_increase_manufactured_goods_development: "Accroître le développement des produits manufacturés"
 IRQ_increase_manufactured_goods_development_desc: "L'industrie manufacturière est devenue la référence pour mesurer le développement d'un pays. Pour montrer au monde que nous sommes également une nation moderne et pertinente, nous devrions étudier les méthodes industrielles des pays plus avancés et les adopter comme nôtres."
 IRQ_agricultural_hub: "Pôle agricole"
 IRQ_agricultural_hub_desc: "L'Irak se trouve au coeur d'un croissant fertile et l'agriculture reste un aspect vital de notre économie. Nous devons développer nos activités agricoles et transformer notre pays en grenier du monde arabe."
 IRQ_state_provided_tools: "Outils fournis par l'État"
 IRQ_state_provided_tools_desc: "Pour garantir que chaque agriculteur ait accès à un équipement moderne de qualité, nous devrions entreprendre un programme visant à fournir des outils à ceux qui n'ont pas les moyens de se les procurer eux-mêmes."
 IRQ_green_revolution: "Révolution verte"
 IRQ_green_revolution_desc: "Avec l'introduction de techniques agricoles modernes, cela a conduit à une nouvelle révolution verte et à un boom de la production alimentaire. Nous devrions investir davantage dans l'agriculture et encourager cette tendance."
 IRQ_modern_irrigation: "Irrigation moderne"
 IRQ_modern_irrigation_desc: "L'eau est l'élément le plus fondamental de la vie. Pour garantir que chacun ait accès à de l'eau douce pour boire et approvisionner ses fermes, nous devons moderniser et étendre notre système d'irrigation actuel."
 IRQ_import_fertilizers: "Importer des engrais"
 IRQ_import_fertilizers_desc: "Avec la lumière du soleil et l'eau, l'engrais constitue le prochain ingrédient important pour toute ferme. Les pays occidentaux ont développé des engrais de meilleure qualité et de meilleure qualité que ceux utilisés dans notre pays, nous devrions importer une partie de leurs engrais et essayer de les reproduire pour une production agricole ultérieure."
 IRQ_boost_grain_production: "Augmenter la production céréalière"
 IRQ_boost_grain_production_desc: "Les céréales sont la culture alimentaire de base pour la majorité des habitants du monde, les empires se sont développés et ont chuté en raison de l'accès aux céréales. Nous devrions investir dans des complexes agricoles centrés sur les céréales et garantir que tout le monde ait accès au pain."
 IRQ_decrease_communist_insurgency: "Diminuer l'insurrection communiste"
 IRQ_decrease_communist_insurgency_desc: "Alors que la guerre froide bat son plein, de nombreux habitants de notre pays opposés à la monarchie hachémite se sont tournés vers Moscou pour obtenir leur soutien. La pensée communiste commence à se répandre parmi notre population et les cas de violence deviennent plus fréquents. Nous devrions tuer cela dans l'oeuf et réprimer le mouvement communiste alors qu'il en est encore à ses balbutiements."
 IRQ_infastructure_expedition: "Expédition sur les infrastructures"
 IRQ_infastructure_expedition_desc: "L'Irak reste encore un pays largement rural et désolé en raison des déserts brûlants. Pour promouvoir le commerce et le développement, nous devrions nous lancer dans un vaste projet d'infrastructure visant à moderniser et étendre les routes, les voies ferrées, les voies navigables et toutes les infrastructures nécessaires pour voyager en toute sécurité et confortablement à travers le désert."
 IRQ_rural_infastructure: "Infrastructure rurale"
 IRQ_rural_infastructure_desc: "La majeure partie de notre population vit encore dans de petites villes et des villages isolés. Afin d'améliorer le bien-être de nos citoyens et la production économique des communautés rurales, nous devons améliorer les infrastructures de ces zones rurales."
 IRQ_invest_agrarian_schools: "Investir dans les écoles agraires"
 IRQ_invest_agrarian_schools_desc: "Si nous voulons avoir les agriculteurs les plus efficaces et de la plus haute qualité, nous devons investir dans une éducation centrée sur l'enseignement des techniques et des sciences agricoles."
 IRQ_encourage_a_sizable_household: "Encouragez un ménage important"
 IRQ_encourage_a_sizable_household_desc: "De nombreux pays occidentaux considèrent la famille dite nucléaire comme le foyer idéal composé de deux parents et de deux enfants. Cependant, ce mode de vie conduira à une stagnation de la population. Nous devrions plutôt aller dans la direction opposée et encourager les familles à avoir autant d'enfants que possible et à nouer des liens fraternels forts avec leur famille élargie."
 IRQ_urban_investments: "Investissements urbains"
 IRQ_urban_investments_desc: "Les villes sont le lieu où se déroule la majeure partie de l'activité économique et, en tant que telles, nécessitent beaucoup d'investissements pour se développer, mais les récompenses de ces investissements sont astronomiques et en valent largement la peine."
 IRQ_rebrand_iraqi_banks: "Renommer les banques irakiennes"
 IRQ_rebrand_iraqi_banks_desc: "Les banques irakiennes ne sont pas aussi prestigieuses ni aussi connues que les grandes banques occidentales, nous devrions nous engager dans une campagne de refonte de l'image de marque pour rendre les banques irakiennes plus attrayantes et plus conviviales."
 IRQ_encourage_transport: "Encourager les transports"
 IRQ_encourage_transport_desc: "Une économie forte nécessite que tous les endroits d'un pays soient intégrés et connectés. Nos routes et nos chemins de fer sont terriblement sous-développés et si nous voulons un jour avoir une grande économie robuste, nous devons améliorer les transports à travers le pays."
 IRQ_the_kurdish_question: "La question kurde"
 IRQ_the_kurdish_question_desc: "Les Kurdes du nord ont toujours eu, dans le meilleur des cas, des relations ténues avec le gouvernement central. En 1945, les Kurdes se sont révoltés et, même si nous avons réussi à les vaincre, le ressentiment demeure au sein de la population kurde et est prête à frapper à tout moment de faiblesse. Le gouvernement peut emprunter deux voies : soit améliorer le bien-être et la qualité de vie des Kurdes, soit les intégrer dans notre pays en tant que citoyens égaux. La seconde est la solution souvent adoptée dans le passé et qui s'est avérée efficace ; c'est la répression, en réprimant les Kurdes, nous pouvons nous assurer qu'ils sont trop faibles et qu'ils ont peur de constituer un jour une menace pour notre gouvernement."
 IRQ_improve_kurdish_opinion: "Améliorer l'opinion kurde"
 IRQ_improve_kurdish_opinion_desc: "Depuis la fondation du Royaume, les Kurdes ont été traités comme des citoyens de seconde zone et souvent négligés par le gouvernement. Nous devons rencontrer leurs dirigeants et faire appel au peuple en garantissant l'autonomie et l'égalité des droits afin d'améliorer leur opinion de notre gouvernement et de stabiliser la région."
 IRQ_their_opinion_is_irrelevant: "Leur opinion n'est pas pertinente"
 IRQ_their_opinion_is_irrelevant_desc: "Les Kurdes ont prouvé à maintes reprises leur déloyauté envers le gouvernement, ils ne sont qu'une nuisance pour le pays et nous ne devrions donc prendre que les mesures nécessaires pour garantir qu'ils ne se révoltent plus."
 IRQ_appoint_a_prince_of_terror: "Nommer un prince de la terreur"
 IRQ_appoint_a_prince_of_terror_desc: "La méthode la plus éprouvée pour mettre fin à une rébellion avant qu'elle ne commence est la terreur. En nommant des responsables ayant une réputation peu charitable, nous pouvons garantir que le peuple kurde sera bien trop terrifié pour songer à se soulever contre le gouvernement."
 IRQ_lower_autonomy: "Autonomie réduite"
 IRQ_lower_autonomy_desc: "Les Kurdes ont toujours bénéficié d'un certain niveau d'autonomie et de liberté par rapport au gouvernement central. Cependant, avec la rébellion de 45, ils ont perdu tout droit de revendiquer plus de droits que les autres citoyens irakiens et les précédents accords d'autonomie devraient donc être révoqués et les lois abrogées."
 IRQ_reform_the_armed_forces: "Réformer les forces armées"
 IRQ_reform_the_armed_forces_desc: "Nos forces armées ont été humiliées lors de la guerre contre Israël en 1948, nous devrions nous lancer dans un programme de réforme et de modernisation pour améliorer nos capacités militaires et garantir que la prochaine guerre avec Israël se terminera par notre victoire."
 IRQ_advance_the_land_forces: "Faire progresser les forces terrestres"
 IRQ_advance_the_land_forces_desc: ""
 IRQ_review_military_budget: "Réviser le budget militaire"
 IRQ_review_military_budget_desc: "Toutes les armées ont besoin d'argent et d'équipement pour fonctionner, nous devrions revoir le montant d'argent et de ressources actuellement alloués à des fins militaires et garantir que nos forces armées obtiennent ce dont elles ont besoin."
 IRQ_improve_camp_rustamiyah: "Améliorer le camp de Rustamiyah"
 IRQ_improve_camp_rustamiyah_desc: "Le camp Rustamiyah est le principal complexe militaire de notre pays, nous devons l'améliorer et le mettre à jour et encourager la croissance des fabricants d'armes autour du camp."
 IRQ_expand_military_production: "Augmenter la production militaire"
 IRQ_expand_military_production_desc: "La production est tout aussi importante pour remporter la victoire que la capacité de combat de nos soldats. Malheureusement, nos capacités actuelles de production militaire sont loin d'être adéquates et nous devrions donc investir dans le développement de nos industries militaires."
 IRQ_heavy_artillery: "Artillerie lourde"
 IRQ_heavy_artillery_desc: "Au lieu que nos garçons meurent pour notre pays, nous devrions faire mourir l'ennemi pour le sien. La meilleure façon d'y parvenir est de les réduire en miettes aussi loin que possible et, en tant que tel, nous devrions investir dans l'amélioration des capacités de notre artillerie."
 IRQ_invest_in_licenses: "Investissez dans les licences"
 IRQ_invest_in_licenses_desc: "Notre industrie d'armement nationale est insuffisante pour répondre aux exigences de la guerre moderne. Nous devrions plutôt chercher à produire les armes de nations plus puissantes et garantir que nos usines sont équipées pour construire des modèles étrangers."
 IRQ_importation_of_t_55: "Importation du T-55"
 IRQ_importation_of_t_55_desc: "Malgré notre dégoût idéologique, l'Union soviétique est l'un des plus grands producteurs de chars et d'équipements militaires au monde. Nous devrions nous taire et importer des chars soviétiques afin de développer notre corps blindé."
 IRQ_airforce_development: "Développement de la Force aérienne"
 IRQ_airforce_development_desc: "L'Armée de l'Air est un secteur jeune mais de plus en plus important de notre armée ; pour assurer une victoire totale sur le champ de bataille, nous devons développer nos capacités aériennes en plein essor."
 IRQ_flying_shells: "Coquilles volantes"
 IRQ_flying_shells_desc: "Bombarder l'ennemi depuis le ciel est bien plus sûr que de le combattre au sol. Nous devrions investir dans l'amélioration de nos bombardiers et de nos explosifs pour parvenir à ce résultat plus sûr."
 IRQ_replace_old_planes: "Remplacer les anciens avions"
 IRQ_replace_old_planes_desc: "Peu importe le nombre d'avions dont nous disposons s'ils sont tous obsolètes et incapables de rivaliser avec l'ennemi. Nous devrions acheter des avions aux Britanniques pour remplacer nos anciens avions qui sont plus un désavantage qu'un atout au combat."
 IRQ_import_vampire_planes: "Importer des vampires"
 IRQ_import_vampire_planes_desc: "La supériorité aérienne est importante pour que nous puissions remporter la victoire sur le terrain, les Britanniques disposent d'un important stock d'avions qu'ils sont prêts à nous vendre pour nous aider à moderniser notre force aérienne."
 IRQ_the_british_doctrine: "La doctrine britannique"
 IRQ_the_british_doctrine_desc: "Les Britanniques ont réussi à repousser la puissance de la machine de guerre allemande grâce à leur capacité à la vaincre dans les airs. Nous devrions étudier les tactiques employées par les Britanniques pour assurer la supériorité aérienne et les adopter comme nôtres."
 IRQ_aviation_manufacturing: "Fabrication aéronautique"
 IRQ_aviation_manufacturing_desc: "La production d'avions et de tous leurs composants nécessaires est complexe et nécessite des méthodes de fabrication différentes de celles utilisées pour construire des chars et des navires. Nous devrions donc construire de nouveaux complexes uniquement dédiés au renforcement de notre force aérienne."
 IRQ_raf_cooperation: "Coopération RAF"
 IRQ_raf_cooperation_desc: "Parallèlement à l'importation d'avions britanniques, nous devrions travailler avec les officiers de l'armée de l'air britannique pour accroître l'expertise et les compétences de notre propre force aérienne."
 IRQ_increase_airports: "Augmenter les aéroports"
 IRQ_increase_airports_desc: "Tout comme les navires et les avions ont besoin d'un endroit d'où ils peuvent décoller et revenir, nous manquons actuellement d'un nombre suffisant d'aéroports pour soutenir notre force aérienne croissante et un plan a donc été élaboré pour construire de nouveaux aéroports modernes."
 IRQ_improve_raf_bases: "Améliorer les bases de la RAF"
 IRQ_improve_raf_bases_desc: "La RAF a maintenu plusieurs bases stratégiques au sein de notre pays pendant la Seconde Guerre mondiale, en réquisitionnant ces bases désormais vides et en les améliorant, nous pouvons les utiliser à nos propres fins."
 IRQ_maritime_assistance: "Assistance maritime"
 IRQ_maritime_assistance_desc: "Même si notre littoral est petit, cela ne diminue en rien l'importance de notre marine et la protection de notre commerce et de nos transports maritimes à travers le golfe Persique."
 IRQ_sub_efforts: "Sous-efforts"
 IRQ_sub_efforts_desc: "Les sous-marins sont l'un des navires les plus utiles et les plus polyvalents de l'arsenal d'une flotte. Nous devrions étudier les conceptions de sous-marins modernes pour garantir que nous disposons des navires les meilleurs et les plus puissants."
 IRQ_increase_shipping_in_basrah: "Augmenter le transport maritime à Bassorah"
 IRQ_increase_shipping_in_basrah_desc: "Bassora est notre seul port majeur mais l'un des plus fréquentés du golfe Persique. En agrandissant nos ports et nos bases navales dans la ville, nous pouvons augmenter encore davantage le transport maritime et notre potentiel naval."
 IRQ_baban_family: "Famille Baban"
 IRQ_baban_family_desc: "La famille Baban est une famille kurde éminente qui exerce une influence incroyable parmi le peuple kurde. En travaillant avec les dirigeants de la famille Baban et en les ralliant à nos côtés, nous contribuerons grandement à stabiliser la région. Cependant, cela nécessitera un capital politique important et l'offre de faveurs spéciales et d'un traitement préférentiel pour y parvenir."
 IRQ_kurdish_urbanization_projects: "Projets d'urbanisation kurde"
 IRQ_kurdish_urbanization_projects_desc: "La grande majorité des Kurdes vivent encore dans des villages isolés et des colonies tribales. Nous pouvons améliorer la vie de la population kurde en nous engageant dans des projets d'urbanisation de masse et en y apportant des technologies et des biens modernes."
 IRQ_replace_the_incompetent_officals: "Remplacer les fonctionnaires incompétents"
 IRQ_replace_the_incompetent_officals_desc: "Beaucoup de nos fonctionnaires dans les régions du nord sont corrompus et incompétents, ce qui a suscité un ressentiment et une colère continus à l'égard du gouvernement. En remplaçant ces responsables, nous pouvons améliorer l'opinion que les Kurdes ont de nous et l'application de la politique gouvernementale."
 IRQ_push_against_leftist_parties: "Pousser contre les partis de gauche"
 IRQ_push_against_leftist_parties_desc: "Les partis de gauche en Irak gagnent un soutien croissant parmi les penseurs urbains et les agriculteurs ruraux en raison de leurs mauvaises conditions de vie. Cependant, ces partis sont très anti-monarchistes et constituent une menace pour notre roi et devraient être réprimés."
 IRQ_promote_the_Constitutional_Charter: "Promouvoir la Charte Constitutionnelle"
 IRQ_promote_the_Constitutional_Charter_desc: "La charte constitutionnelle est la prochaine étape vers un système politique plus raffiné."
 IRQ_protection_of_the_workers: "Protection des travailleurs"
 IRQ_protection_of_the_workers_desc: "Les travailleurs irakiens ont longtemps été exploités par de riches propriétaires terriens, ce qui a poussé nombre de ces travailleurs à faire grève continuellement. Protéger les droits de ces travailleurs les rendrait non seulement plus heureux et moins rebelles, mais augmenterait également leur productivité."
 IRQ_encourage_various_industries: "Encourager diverses industries"
 IRQ_encourage_various_industries_desc: "La récente découverte de grandes quantités de ressources et de minéraux dans le pays a provoqué la création de nombreuses nouvelles entreprises et industries afin d'exploiter ces ressources. Soutenir ces efforts les fera prospérer encore davantage, ce qui profitera grandement à l'économie."
 IRQ_organize_the_youth: "Organiser la jeunesse"
 IRQ_organize_the_youth_desc: "Avec la montée du nationalisme dans notre pays, il est évident que de nombreuses personnes mourraient en se battant pour ce nationalisme. Nous pouvons utiliser cela à notre avantage en encourageant les jeunes nationalistes à s'enrôler dans l'armée."
 IRQ_call_on_suwaidi_to_be_prime_minister: "Faites appel à Suwaidi"
 IRQ_call_on_suwaidi_to_be_prime_minister_desc: "Tawfiq al Suwaidi est un homme politique âgé et chevronné, qui croit en la démocratie représentative et se conforme aux idéaux occidentaux. Malgré sa position anti-hachémite, l'Irak a encore besoin d'un leader fort capable de mettre en oeuvre les réformes démocratiques dont notre population a besoin. Cependant, sa position pro-occidentale pourrait susciter la controverse au sein de la population."
 IRQ_social_stability: "Stabilité sociale"
 IRQ_social_stability_desc: "Nous avons finalement atteint au moins un certain niveau de stabilité sociale, avec la popularité du roi à un niveau record et la qualité de vie s'étant grandement améliorée pour le citoyen moyen. Le peuple en est désormais venu à accepter et même à soutenir le règne de la monarchie hachémite et les appels à sa destitution n'existent désormais qu'en marge politique."
 IRQ_reaction_to_the_abadan_crisis: "Réaction à la crise d'Abadan"
 IRQ_reaction_to_the_abadan_crisis_desc: "Le nouveau gouvernement iranien a décidé de nationaliser la production pétrolière du pays et d'expulser les sociétés occidentales. Les Britanniques sont indignés par cette décision la qualifiant de vol et d'acte criminel. Dans la ville d'Abadan, les tensions ont atteint leur paroxysme et la ville est devenue une impasse entre les Britanniques et les Iraniens. En tant que voisin le plus proche de l'Iran ayant des liens avec les intérêts pétroliers britanniques, notre opinion pourrait faire pencher la balance dans cette impasse tendue. Le roi Fayçal II et le gouvernement sont jusqu'à présent restés silencieux mais le moment est venu de publier une réaction officielle à la crise."
 IRQ_secure_our_convoys: "Sécurisez nos convois"
 IRQ_secure_our_convoys_desc: "Nous dépendons de l'exportation de pétrole et d'autres ressources de notre pays. Pour garantir la sécurité de ce secteur précieux de notre économie, nous devrions étudier des conceptions modernes d'escorte et de frégates afin qu'elles puissent défendre nos convois et nos voies de navigation."
 IRQ_encourage_kurdish_science: "Encourager la science kurde"
 IRQ_encourage_kurdish_science_desc: "Les écoles qui enseignent en kurde sont pratiquement inexistantes. Afin d'accroître l'alphabétisation et l'éducation de la population kurde, nous devrions renoncer à essayer d'imposer l'arabe au peuple kurde et plutôt encourager l'enseignement en kurde et permettre aux Kurdes d'apprendre leur propre langue."
 IRQ_issue_improved: "Améliorer la situation kurde"
 IRQ_issue_improved_desc: "Il n'y a aucune différence entre un Kurde et un Arabe, tous deux sont unis par leur loyauté commune envers le Roi. En tant que tel, nous devrions étendre le bien-être et les droits civils dont jouit notre population arabe pour inclure les Kurdes. Cela répondra également à de nombreux griefs contre lesquels les rebelles kurdes ont pris les armes pour lutter et, en tant que tel, même si cela ne résoudra pas entièrement le conflit kurde, cela amènera un nombre important de rebelles et de sympathisants à abandonner leur soutien aux rebelles."
 IRQ_increase_military_presence_in_iraqi_kurdistan: "Augmenter la présence militaire"
 IRQ_increase_military_presence_in_iraqi_kurdistan_desc: "Les Kurdes constituent une menace constante pour les autorités et les activités dans les régions du nord. En augmentant la présence militaire et les mesures de sécurité, nous pouvons garantir que chaque fois que les rebelles kurdes décident d'attaquer nos citoyens, ils se heurteront à une force écrasante."
 IRQ_stomp_out_further_resistance: "Éliminer davantage de résistance"
 IRQ_stomp_out_further_resistance_desc: "Grâce aux vaillants efforts de nos courageux agents de sécurité et aux investissements accrus dans les mesures de sécurité, nous avons démantelé de plus en plus de cellules rebelles et la fréquence des attaques a considérablement diminué."
