 PRC_return_manchuria_communist_desc: "Les impérialistes japonais ont enlevé la Mandchourie à ses propriétaires légitimes : le peuple libre de Chine. Maintenant que nos camarades japonais ont chassé les oppresseurs, nous devrions demander que cet argent soit restitué au peuple."
