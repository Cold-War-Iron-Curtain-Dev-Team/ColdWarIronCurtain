 JAP_interservice_rivalry: "Rivalité interservices"
 JAP_interservice_rivalry_desc: "La Marine Impériale et l'Armée Impériale sont engagées dans un conflit violent concernant nos ressources limitées. Nous avons institué des conférences régulières pour garantir que nos ressources sont dépensées au bon endroit. Favoriser l'un par rapport à l'autre aura des conséquences considérables."
