 improved_worker_conditions: "Conditions de travail améliorées"
 improved_worker_conditions_desc: "Le travail en usine est dur et comporte de nombreux dangers. L'amélioration des conditions de travail de nos ouvriers d'usine réduira la production à court terme, mais les avantages à long terme en valent la peine."
 promises_of_peace: "Promesses de paix"
 promises_of_peace_desc:1 "L'histoire nous a appris les horreurs de la guerre. Nous ne devons plus jamais laisser cela se reproduire. Il est temps pour notre nation de connaître la paix et la prospérité."
 refuse_the_tribute: "Refuser de rendre hommage"
 refuse_the_tribute_desc: "Les exigences soviétiques saignent à blanc notre pays. Nous ne pouvons pas permettre à nos soi-disant « camarades » de nous exploiter ainsi."
