 # RGO DEVELOPMENT ## RGO DEVELOPMENT ## RGO DEVELOPMENT ## RGO DEVELOPMENT #
 
 prospect_for_resources: "Développement RGO (Opérations de Collecte de Ressources)"
 prospect_for_resources_desc: "Prospecter des ressources et étendre les opérations de collecte de ressources."
 
 renewable_energy_project: "(ÉLECTRICITÉ)(§C360 $§!)Projet d'énergie renouvelable"
 renewable_energy_project_desc: "Lancer et financer un projet de conversion de 5 centrales électriques à combustibles fossiles en centrales électriques renouvelables. Toutes les infrastructures électriques, de gestion, de maintenance, etc. Utilisables seront converties pour être utilisées et une ferme/station de production d'énergies renouvelables sera construite en utilisant les installations de l'ancienne centrale à combustible fossile.\n\nCoûts §R5§! §YParcs industriels§! pour §Y215§! jours et §Y60M§!"
 
 fusion_energy_project: "(ÉLECTRICITÉ)(§C4 000 $§!)Projet de réacteur à fusion Tokamak"
 fusion_energy_project_desc: "Lancer un effort considérable pour construire un réacteur à fusion Tokamak afin de fournir au pays d'immenses niveaux d'énergie renouvelable.\n\nCoûts §R10§! §YParcs industriels§! pour §Y10§! ans et §YB§!"
 
 fusion_energy_project_wtt: "(ÉLECTRICITÉ)(§C4 000 $§!)Projet de réacteur à fusion Tokamak"
 fusion_energy_project_wtt_desc: "Lancer un effort considérable pour construire un réacteur à fusion Tokamak afin de fournir au pays d'immenses niveaux d'énergie renouvelable.\n\nCoûts §R10§! §YParcs industriels§! pour §Y10§! ans et §YB§!"
 
 # NORTH AMERICA #
 
 tungsten_arizona_I_develop: "(TERRES RARES)(§C360 $§!) Mine de terres rares du mont Lemmon"
 tungsten_arizona_I_develop_desc: "Avec l'avènement de l'exploitation minière au sommet des montagnes, les terres rares quasi invisibles contenues dans le mont Lemmon peuvent enfin être extraites."
 steel_arizona_I_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Permis de mine de cuivre MAGMA"
 steel_arizona_I_develop_desc: "Afin de développer l'industrie minière du cuivre en Arizona, nous accorderons des permis pour que les mines MAGMA se développent et commencent à exploiter ce précieux matériau de construction."
 steel_arizona_I_developed: "Permis MAGMA"
 steel_arizona_II_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mine de cuivre San Manuel MAGMA"
 steel_arizona_II_develop_desc: "Le puits minier de San Manuel s'est avéré contenir des quantités de cuivre bien plus importantes qu'auparavant. La construction d'un site minier et d'une fonderie majeurs près de San Manuel soutiendra grandement nos efforts."
 steel_arizona_II_developed: "Permis MAGMA"
 steel_arizona_III_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mines exploratoires de cuivre du Nord MAGMA"
 steel_arizona_III_develop_desc: "Il existe de nombreuses autres veines de cuivre dans la partie nord de l'État, dans des régions isolées, qui ont été découvertes lors de projets d'infrastructure. Nous devrions commencer à construire des mines d'exploration et étendre celles qui possèdent des réserves prouvées."
 steel_arizona_III_developed: "Permis MAGMA"
 steel_arizona_IV_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mine Morenci"
 steel_arizona_IV_develop_desc: "La mine Morenci est une immense mine de cuivre à ciel ouvert située dans le sud de l'Arizona. En investissant dans cette mine, la production de cuivre de l'Arizona s'améliorera considérablement."
 steel_arizona_V_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Aidez la mine de cuivre concentré"
 steel_arizona_V_develop_desc: "La mine Ray, dans le comté de Pinal, possède des sources concentrées de minerai de cuivre. Il serait intéressant de doter financièrement la mine Ray afin qu'elle puisse exploiter des veines plus profondes."
 steel_magma_I_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Expansion de MAGMA au Nouveau-Mexique"
 steel_magma_I_develop_desc: "La société MAGMA a connu un succès notable dans les mines d'exploration du nord de l'Arizona. Ils demandent des permis pour s'étendre au Nouveau-Mexique"
 petrochemicals_texas_I_develop: "(MULTIPLE)(§C360 $§!) Terminer l'enquête sur les ressources du Texas"
 petrochemicals_texas_I_develop_desc: "Le boom pétrolier du Texas a apporté de grandes quantités de pétrole au pays et a apporté de grandes quantités de richesse à notre pays. Une prospection complète de l'État peut nous permettre de découvrir les derniers grands gisements de pétrole et éventuellement d'autres ressources également."
 petrochemicals_texas_II_develop: "(PRODUITS PÉTROCHIMIQUES)(§C360 $§!) Champs pétrolifères de Big Bend"
 petrochemicals_texas_II_develop_desc: "Selon l'enquête, il existe de grandes quantités de réserves de pétrole inexploitées dans le grand virage."
 petrochemicals_texas_III_develop: "(PRODUITS PÉTROCHIMIQUES)(§C360 $§!) Pipeline ConocoPhillips/ExxonMobil"
 petrochemicals_texas_III_develop_desc: "Bien que coûteux, un énorme pipeline sponsorisé par un double effort de Conoco et Exxon améliorerait considérablement notre production pétrolière."
 petrochemicals_texas_IV_develop: "(PRODUITS PÉTROCHIMIQUES)(§C360 $§!) Champs pétrolifères exploratoires"
 petrochemicals_texas_IV_develop_desc: "Afin de trouver davantage de gisements, nous devons mener des efforts d'extraction exploratoire de pétrole et étendre ceux qui se sont avérés avoir une capacité supérieure à celle initialement prospectée."
 petrochemicals_texas_V_develop: "(PÉTROCHIMIE) Fracturation des schistes du Texas"
 petrochemicals_texas_V_develop_desc: "Avec la technologie d'extraction de schiste à grande capacité dont nous disposons désormais, nous pouvons commencer à exploiter d'énormes gisements de pétrole."
 steel_texas_I_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Relancer les mines de fer texanes"
 steel_texas_I_develop_desc: "Après la Seconde Guerre mondiale, de nombreuses mines de fer texanes ont été confrontées à des problèmes de gestion et d'épuisement silencieux mais mortels. Cependant, ces problèmes ont été rapidement résolus avec l'avènement de l'enquête texane. Les sociétés minières de fer du Texas ont pu se déplacer vers de nouveaux gisements nouvellement découverts."
 steel_texas_II_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Sociétés TexasSteelProcessing et Corpus Christi"
 steel_texas_II_develop_desc: "La création et la création de sociétés telles que TexasSteelProcessing et Corpus Christi amélioreraient les capacités de transformation de l'acier du Texas et renforceraient davantage les finances et l'expansion des mines de fer."
 aluminium_texas_I_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Relancer les mines de métaux légers texans"
 aluminium_texas_I_develop_desc: "De nombreuses sociétés minières texanes ont vu leurs mines épuisées après la guerre et avaient du mal à s'étendre vers de nouvelles sources. Cependant, le Texan Survey permettrait à ces mines de trouver de nouvelles sources de matière."
 petrochemicals_texas_I_developed: "Rapports d'enquête texans"
 steel_texas_I_developed: "Rapports d'enquête texans"
 petrochemicals_texas_II_developed: "Rapports d'enquête texans"
 petrochemicals_texas_III_developed: "Rapports d'enquête texans"
 petrochemicals_texas_IV_developed: "Rapports d'enquête texans"
 tungsten_california_I_develop: "(TERRES RARES)(§C360 $§!) Mine de Mountain Pass"
 tungsten_california_I_develop_desc: "Un chercheur d'uranium a récemment découvert une étrange anomalie près de Mountain Pass, en Californie. Après inspection du site, il s'est avéré qu'il s'agissait de l'emplacement d'un énorme et massif gisement de matériaux de terres rares insaisissables. C'est potentiellement l'un des sites de terres rares les plus riches et les plus grands !"
 tungsten_california_I_developed: "Mine du col de montagne"
 tungsten_california_II_develop: "(TERRES RARES)(§C360 $§!) Usine d'hydrométallurgie de Mountain Pass"
 tungsten_california_II_develop_desc: "Le traitement est devenu un goulot d'étranglement critique dans la production de terres rares à la mine Mountain Pass. Il faut investir dans la construction d'une usine d'hydrométallurgie pour continuer à recevoir des productions régulières de la mine !"
 tungsten_california_II_developed: "Mine du col de montagne"
 tungsten_california_III_develop: "(TERRES RARES)(§C360 $§!) Fournir plus d'eau au col de montagne"
 tungsten_california_III_develop_desc: "L'usine d'hydrométallurgie de Mountain Pass traite les vastes minerais provenant de la mine Mountain Pass. Il manque cependant suffisamment d'eau pour fonctionner à pleine efficacité et continuer à se développer. Nous devons améliorer les infrastructures hydrauliques sur place afin de pouvoir continuer à exploiter cette précieuse ressource."
 tungsten_california_III_developed: "Mine du col de montagne"
 tungsten_california_IV_develop: "(TERRES RARES)(§C360 $§!) Agrandissez la mine Mountain Pass"
 tungsten_california_IV_develop_desc: "Nous devons étendre la mine Mountain Pass dans les montagnes et exploiter les riches ressources qui s'y cachent."
 tungsten_california_IV_developed: "Mine du col de montagne"
 tungsten_california_V_develop: "(TERRES RARES)(§C360 $§!) Usine californienne de recyclage des déchets électroniques"
 tungsten_california_V_develop_desc: "L'adoption massive de produits électroniques et leur remplacement rapide entraînent des déchets toxiques. Nous devons construire une usine de recyclage des déchets électroniques afin de récupérer la plupart de ce matériel précieux."
 tungsten_california_V_developed: "Recyclage des déchets électroniques du Mountain Pass"
 petrochemicals_california_I_develop: "(MULTIPLE)(§C$360§!) Enquête californienne complète à la recherche d'uranium"
 petrochemicals_california_I_develop_desc: "La Californie est riche en divers minerais et minéraux. Nous devrions commencer à rechercher des gisements d'uranium dans l'État afin d'acquérir ses ressources."
 petrochemicals_california_I_developed: "Rapports d'enquête californiens"
 petrochemicals_california_II_develop: "(PÉTROCHIMIE)(§C360 $§!) Construire un pipeline californien NGCC"
 petrochemicals_california_II_develop_desc: "Nous avons découvert des gisements massifs répartis dans tout l'État. Nous devrions construire un pipeline NGCC afin d'exploiter les gisements de pétrole et de gaz naturel dans tout l'État !"
 petrochemicals_california_II_developed: "Rapports d'enquête californiens"
 petrochemicals_california_III_develop: "(PRODUITS PÉTROCHIMIQUES)(§C360 $§!) Permis de fracturation californiens"
 petrochemicals_california_III_develop_desc: "Nous disposons désormais d'une exploitation minière de schiste à grande capacité. Nous devrions lancer des processus expérimentaux de fracturation hydraulique afin d'exploiter ces vastes gisements de gaz naturel et de pétrole. §RJ'espère que rien ne va vraiment mal§!"
 steel_california_I_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mines de fer des montagnes californiennes"
 steel_california_I_develop_desc: "Un grand nombre de petites veines riches ont été découvertes dans les montagnes de Californie. Lorsque nous disposerons de la technologie capable d'accéder à ces régions, nous pourrons commencer l'exploitation minière."
 aluminium_california_I_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Gisements de bauxite de Kern"
 aluminium_california_I_develop_desc: "Notre enquête a découvert de nombreux gisements de bauxite dans le sud de l'État, dans le comté de Kern. Nous devrions créer un site minier pour les exploiter."
 steel_nevada_I_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mines à ciel ouvert éloignées du Nevada"
 steel_nevada_I_develop_desc: "Les projets d'infrastructure et les perspectives ont révélé une nouvelle et riche source de fer, de plomb et de chrome qui peut être extraite via une grande mine à ciel ouvert. Ce processus nécessite cependant des excavatrices à roues à godets et une infrastructure hydraulique efficace pour exploiter l'exploitation minière dans cette région."
 aluminium_idaho_I_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Mines d'argent de Coeur d'Alene"
 aluminium_idaho_I_develop_desc: "Le district de Coeur d'Alene, dans l'Idaho, regorge d'une grande quantité d'argent. À tel point que les mines de ce district contiennent plus d'argent que tous les autres États réunis."
 petrochemicals_wyoming_I_develop: "(PÉTROCHIMIE)(§C$360§!) Régler les différends sur le charbon du Wyoming"
 petrochemicals_wyoming_I_develop_desc: "L'exploitation du charbon dans le Wyoming est l'une des plus grandes RGO de charbon du pays. Actuellement, il existe d'innombrables conflits entre syndicats, industriels, entrepreneurs et bien d'autres sur les conditions de travail et les droits miniers. Cela demandera beaucoup de travail et d'accords politiques, mais ces problèmes doivent être résolus."
 tungsten_nebraska_I_develop: "(TERRES RARES)(§C360 $§!) Approuve la mine de titane NioCorp Elk Creek"
 tungsten_nebraska_I_develop_desc: "Approuver le permis de NioCorp pour construire une mine de titane/niobium/scandium à Elk Creek afin d'avoir accès aux matériaux rares et de grande valeur du comté de Johnson."
 tungsten_south_dakota_I_develop: "(TERRES RARES)(§C360 $§!) Résolvez L-208 et agrandissez la mine d'or de Homestake"
 tungsten_south_dakota_I_develop_desc: "La mine Homestake, la mine d'or la plus profonde d'Amérique du Nord, a cessé sa production de 1943 à 1945 en raison de l'ordonnance de limitation L-208 du War Production Board. Maintenant que la guerre est terminée, il est temps de résoudre l'ordonnance de limitation et de commencer à agrandir la mine."
 petrochemicals_kansas_I_develop: "(PÉTROCHIMIE)(§C360 $§!) Doter les champs NGCC du Kansas"
 petrochemicals_kansas_I_develop_desc: "La production de pétrole et de gaz naturel du Kansas a été une aubaine incroyable pour le pays. Leurs champs de pétrole et de gaz naturel ont actuellement sérieusement besoin d'infrastructures NGCC pour pouvoir exploiter de nouveaux réservoirs."
 steel_pennsylvania_I_develop: "(MULTIPLE)(§C360 $§!) Établir un district de fonderie massive à Pittsburgh"
 steel_pennsylvania_I_develop_desc: "Pittsburgh est depuis longtemps une source massive de fonderies d'acier aux États-Unis. Cependant, la demande et les besoins en minerai dans le pays augmentent. Avec le début de la guerre froide, les exigences militaires et un monde en voie de modernisation, nous devons lancer un projet majeur qui soutiendra les RGO à travers le pays.\n§GMène à de NOMBREUX projets RGO§!"
 steel_pennsylvania_I_developed: "Mégadistrict de la fonderie de Pittsburgh"
 steel_pittsburgh_I_developed: "Mégadistrict de la fonderie de Pittsburgh"
 metals_pittsburgh_I_develop: "(MULTIPLE)(§C360 $§!)Organiser la ligne ferroviaire moderne de la côte Est"
 metals_pittsburgh_I_develop_desc: "Afin de commencer à exploiter les vastes richesses inexploitées de cette région, nous devons construire et organiser une ligne logistique massive menant directement à Pittsburg. Ce projet sera TRÈS coûteux mais permettra §Gla construction de RGO dans tout l'est des États-Unis§!"
 metals_pittsburg_I_developed: "Mégadistrict de la fonderie de Pittsburgh"
 metals_pittsburgh_ohio_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mines de fer et de plomb de Cleveland"
 metals_pittsburgh_ohio_develop_desc: "Grâce à notre projet de Pittsburgh De Rotte Ramble, nous pouvons commencer à construire des mines de fer et de plomb destinées à être utilisées comme métaux de construction dans les armes et les bâtiments."
 metals_pittsburgh_indiana_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Carrière de magnésium du sud de l'Indiana"
 metals_pittsburgh_indiana_develop_desc: "Les grandes veines de magnésium du sud de l'Indiana peuvent être fondues en alliages destinés à la construction d'avions et d'une variété de produits de consommation."
 metals_pittsburgh_kentucky_develop: "(MATÉRIEL NUCLÉAIRE)(§C360 $§!) Kentucky Plutonium RGO"
 metals_pittsburgh_kentucky_develop_desc: "La source de plutonium du Kentucky est probablement l'une des découvertes les plus précieuses de tout ce projet et constitue une grande aubaine pour les programmes nucléaires de notre pays. Disposer d'une source locale de plutonium garantit les meilleurs prix et un contrôle direct sur son développement."
 metals_pittsburgh_tennessee_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Construisez la mine de fer Rockcastle en utilisant le domaine éminent"
 metals_pittsburgh_tennessee_develop_desc: "Rock-Castle, dans le comté de Trigg, dans le Kentucky, abrite une riche veine de minerai de fer qui n'a pas été exploitée en raison de graves conflits fonciers avec les propriétaires fonciers régionaux. Nous devons nous emparer des terres d'Eminent Domain et y construire une mine de fer. Nous ajouterons même un petit site historique pour le site d'Old Rockcastle qui a été incendié pendant la guerre civile."
 metals_pittsburgh_georgia_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Construire une mine de fer dans le comté de Forsyth"
 metals_pittsburgh_georgia_develop_desc: "Nos arpenteurs ont découvert une veine de fer très profonde dans le comté de Forsyth. Ce ne sera pas facile, mais nous devons construire une mine de fer à puits profond pour exploiter cette ressource."
 metals_pittsburgh_alabama_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Carrière de bauxite de Tuscaloosa"
 metals_pittsburgh_alabama_develop_desc: "La bauxite est une forme de roche qui contient de l'aluminium non fondu. Nos géomètres ont failli rater cette source de bauxite près de Tuscaloosa. Grâce à notre nouveau réseau logistique menant à Pittsburgh, nous pouvons transformer la bauxite vierge en aluminium."
 metals_pittsburgh_michigan_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Mine de plomb de silex"
 metals_pittsburgh_michigan_develop_desc: "Nous avons trouvé une source massive de plomb près de Flint, dans le Michigan. Nous pouvons facilement exploiter ce gisement de plomb, mais nous devrons déplacer la source d'eau de la ville ailleurs car la rivière actuelle est nécessaire à la mine. Il y a une autre bonne source à proximité qui devrait être bonne pour la ville, donc ce n'est pas un problème."
 metals_pittsburgh_newyork_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Carrière de bauxite d'Albany"
 metals_pittsburgh_newyork_develop_desc: "Albany, la ville du célèbre jambon cuit à la vapeur, se trouve tout près d'une source de bauxite (aluminium vierge). Nous pouvons construire une grande carrière à ciel ouvert à proximité de la ville pour renforcer ses finances. Cela pourrait même contribuer à amener de délicieux jambons cuits à la vapeur et des cacahuètes bouillies dans le reste du pays."
 metals_pittsburgh_maryland_develop: "(PRODUITS PÉTROCHIMIQUES)(§C360 $§!) Mines de charbon à ciel ouvert du comté d'Allegany et de Garrett/Drainage acide propre"
 metals_pittsburgh_maryland_develop_desc: "Il existe de riches exploitations minières de charbon à ciel ouvert dans les comtés d'Allegany et de Garrett qui produisent de grandes quantités de charbon. Il existe cependant également de nombreuses mines abandonnées et des drainages acides. Nous pouvons agrandir les mines et en construire de nouvelles à Allegany et Garrett, mais nous devons réévaluer les anciennes mines avec des équipements modernes et également nettoyer les drainages acides qui menacent la santé et la vie de nos travailleurs et l'environnement."
 metals_pittsburgh_virginia_develop: "(PRODUITS PÉTROCHIMIQUES)(§C360 $§!) Mines de charbon de Virginie"
 metals_pittsburgh_virginia_develop_desc: "Les mines de charbon de Virginie constituent un élément essentiel de l'industrie de notre pays depuis plus d'un siècle. Ils ont cependant connu des moments difficiles après la guerre. Nous devons donc faire des efforts pour les relancer et retrouver notre source de charbon."
 metals_pittsburgh_westvirginia_develop: "(PÉTROCHIMIE)(§C360 $§!) Mener des recherches sur le charbon de Virginie occidentale"
 metals_pittsburgh_westvirginia_develop_desc: "Les mines de charbon de Virginie occidentale sont presque épuisées et les mineurs et les industriels de l'État sont à la recherche de nouvelles sources de charbon à exploiter. Aider à cet effort leur permettra de se remettre au travail, les clochards paresseux !"
 steel_florida_I_develop: "(MULTIPLE)(§C360 $§!) Évaluer les rapports sur les crépines anormales des mines de sable"
 steel_florida_I_develop_desc: "Avec l'avènement des excavatrices à godets, certaines mines de sable de Floride ont commencé à se rassembler plus que jamais. Cependant, certaines mines comme Janha ont commencé à signaler d'étranges impuretés dans leurs sables. Nous devrions évaluer ces rapports pour savoir s'ils contiennent quelque chose d'utile."
 steel_florida_I_developed: "Rapports d'enquête floridiens"
 steel_florida_II_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Crépines en fer Janha"
 steel_florida_II_developed: "Les sables profonds des mines de Janha sont extrêmement riches en sédiments ferreux. Nous pouvons investir dans des tamis en fer pour extraire les sédiments et en tirer profit."
 aluminium_florida_I_develop: "(MÉTAUX LÉGERS)(§C360 $§!) Crépines en aluminium Stewart"
 aluminium_florida_I_develop_desc: "Les sables profonds des mines Stewart Sand and Gravel sont exceptionnellement riches en sédiments d'aluminium. Nous devrions subventionner leurs crépines pour éliminer l'aluminium afin qu'il ne gêne pas les opérations d'extraction de gravier très précieux."
 
 # SOVIET BLOCC #
 
 steel_odessa_I_develop: "(MÉTAUX DE CONSTRUCTION)(§C360 $§!) Carrière de minerai de fer d'Odessan"
 steel_odessa_I_develop_desc: "L'exploitation minière de Coquina (forme de pierre) à Odessa a découvert une source de minerai de fer à proximité de son exploitation. Nous pouvons créer une mine de minerai de fer et installer des aciéries à proximité de Chisinau pour le traiter et résoudre le problème du chômage dans la ville."
 aluminium_chukotka_I_develop: "(MULTIPLE)(§C360 $§!) Enquête sur le projet à distance Kupol"
 aluminium_chukotka_I_develop_desc: "Le projet Kupol est une tentative expérimentale visant à commencer à collecter de l'or et de l'argent dans un endroit éloigné, désolé et hostile de Tchoukotka. Le projet imposera de lourdes exigences technologiques et nécessitera des investissements importants, mais il rapportera de nombreux minerais d'argent et d'or à l'avenir."
 aluminium_chukotka_I_developed: "Exploitation minière de Kupol"
 aluminium_chukotka_II_develop: "(MULTIPLE)(§C360 $§!) Alimenter le projet Kupol"
 aluminium_chukotka_II_develop_desc: "Nous devons construire une réserve régionale de carburant et construire des installations d'approvisionnement en eau appropriées pour soutenir le projet minier éloigné de Kupol, sinon la mine sera sous-approvisionnée."
 aluminium_chukotka_II_developed: "Exploitation minière de Kupol"
 aluminium_chukotka_III_develop: "(MULTIPLE)(§C360 $§!) Construire une centrale géothermique et un échangeur de chaleur pour Kupol"
 aluminium_chukotka_III_develop_desc: "Afin de fournir de l'électricité et de la chaleur à moindre coût à la mine de Kupol, nous devons construire une centrale géothermique et un échangeur de chaleur urbain afin de résoudre les problèmes de chaleur de la mine."
 aluminium_chukotka_III_developed: "Exploitation minière de Kupol"
 aluminium_chukotka_IV_develop: "(MULTIPLE)(§C360 $§!) Usine d'hydrométallurgie de Kupol"
 aluminium_chukotka_IV_develop_desc: "Afin de mieux exploiter les riches minerais de Kupol, nous devons construire une usine d'hydrométallurgie."
 aluminium_chukotka_IV_developed: "Exploitation minière de Kupol"
 aluminium_chukotka_V_develop: "(MULTIPLE)(§C360 $§!) Fournir au projet Kupol de nouveaux équipements"
 aluminium_chukotka_V_develop_desc: "Nous pouvons étendre davantage les opérations minières de Kupol en leur fournissant des équipements miniers modernisés pour obtenir un meilleur accès à l'or et à l'argent qu'elles contiennent."
 aluminium_chukotka_V_developed: "Exploitation minière de Kupol"
 
 
 
