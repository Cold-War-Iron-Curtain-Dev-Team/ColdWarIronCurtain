 demobilization_manpower: "Faciliter la conscription"
 demob_economic_mission: "Démobiliser notre économie"
 demob_manpower_mission: "Faciliter la conscription"
 demobilization_desc: "Alors que la menace de guerre semble lointaine, les gens ne sont plus disposés à accepter les rigueurs des lois de guerre. Nous devons revoir nos lois et envisager de les modifier pour faire taire les manifestants avant que la situation ne dégénère."
 demobilization_economic_desc: "Alors que la menace de guerre semble lointaine, les gens ne sont plus disposés à accepter les difficultés d'une économie de guerre. Nous devrions revoir nos lois économiques et envisager de les modifier pour produire davantage de biens de consommation afin de répondre à leurs demandes."
 draft_dodging_mission: "Résoudre la crise d'évasion"
 draft_dodging_mission_desc: "À moins d'être résolu rapidement, le problème des recrues refusant la conscription ne fera qu'empirer et pourrait amener les gens à remettre en question l'autorité du gouvernement lui-même."
