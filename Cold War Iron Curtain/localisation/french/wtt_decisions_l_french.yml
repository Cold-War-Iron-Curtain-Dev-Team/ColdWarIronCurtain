 GER_case_anton_category: "Cas Anton"
 GER_case_anton_category_desc: "L'intention derrière la création de Vichy France a toujours été de garder les colonies françaises et la flotte française hors des mains des alliés. Cependant, il s'agit d'un accord que nous pouvons choisir d'annuler à tout moment. Nous avons un plan élaboré pour intégrer la zone par la force, ainsi qu'une poussée éclair vers la base de la flotte française à Toulon."
 GER_case_anton:1 "Exécuter l'affaire Anton"
 GER_case_anton_desc: "Notre État fantoche en France a fait son temps. Nous commencerons immédiatement l'intégration dans le [Root.GetName] et, si nous avançons suffisamment rapidement, nous pourrons même réquisitionner les restes de la flotte française."
 GER_case_anton_tt: "Annexe Vichy à la France en 7 jours et s'empare de la flotte française.\n\n§RLa France pourra saborder sa flotte à moins que les troupes allemandes ne soient à Toulon d'ici 2 jours !§!\n"
