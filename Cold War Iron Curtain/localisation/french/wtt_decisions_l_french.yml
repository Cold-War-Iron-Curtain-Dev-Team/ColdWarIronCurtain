 fusion.0.t: "[Root.GetName] a achevé un réacteur à fusion Tokamak !"
 fusion.0.d: "Il arrive un moment dans les annales de chaque civilisation où les plus grands défis sont relevés avec les solutions les plus radicales. Qu'il s'agisse de la promesse d'une nourriture illimitée grâce à l'agriculture ou de la promesse d'une locomotion sans entrave offerte par la roue. L'immense défi actuel, à savoir l'augmentation de la consommation d'énergie et l'expansion industrielle au détriment de l'environnement, était d'une nécessité et d'une conséquence urgentes. Alors que le désir économique de consommer et de satisfaire le désir de chaque être humain dépassait la capacité de charge de notre planète, les scientifiques de [Root.GetName] ont, après des décennies de recherche et de travail acharné, après des millions d'heures de travail et des milliards de dollars, réalisé le rêve d'alimenter le monde pour toujours sans taxer ses ressources en diminution ni devenir redevables aux caprices de la nature. Les habitants de [Root.GetName] se sont réjouis de la réussite de leur nation dans la fusion nucléaire ! Avec le partage des connaissances et de l'expertise avec le reste des peuples du monde, il est indubitable que de nombreuses nations suivront bientôt leurs traces. Cet effort national et international nous mènera au jour où notre croissance et celle de la planète ne feront plus qu'un. Grâce à une énergie bon marché, abordable et omniprésente."
 fusion.0.a: "Une nouvelle ère de l'histoire a commencé !"
 fusion.1.t: "Réacteur à fusion Tokamak terminé !"
 fusion.1.d: "Notre pays a achevé un autre réacteur à fusion tokamak et est prêt à démarrer un autre projet !"
 fusion.1.a: "Excellent"
 
 
 
 
