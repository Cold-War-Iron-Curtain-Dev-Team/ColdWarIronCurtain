 war_propaganda_campaign_running: " Je mène déjà une campagne de propagande de guerre"
 JAP_test_the_soviets: "Testez les [SOV.GetAdjective]s"
 JAP_test_the_soviets_desc: "Nous partageons une longue frontière avec [SOV.GetNameDef] en Corée et en Mandchourie. Il existe un grand nombre de points chauds potentiels où nos forces pourraient s'affronter à tout moment. Pour nous, cela crée une opportunité de tester la réponse soviétique à une provocation mineure."
 JAP_border_conflict_warning_SOV: "Provocation à la frontière japonaise"
 JAP_border_conflict_warning_SOV_desc: "Il y a eu un affrontement entre nos gardes-frontières et les soldats japonais à notre frontière commune en Corée. Des sources de renseignement au Japon rapportent que cela pourrait bien n'être que la première étape d'une confrontation plus large. Nous devrions immédiatement renforcer la frontière avec le Japon."
 JAP_border_conflict_escalation_warning_SOV: "Préparations japonaises"
 JAP_border_conflict_escalation_warning_SOV_desc: "La reconnaissance aérienne a confirmé d'importants mouvements de troupes du côté japonais de la frontière. Nous ne savons pas si ni quand les Japonais ont décidé de frapper, mais nous devons être prêts."
 JAP_border_incident_forgotten: "Fenêtre d'opportunité"
 JAP_border_incident_forgotten_desc:1 "Si nous voulons profiter de l'incident survenu à la frontière soviétique avec la Corée, nous devons agir rapidement."
 JAP_escalate_incident_to_border_conflict_SOV: "Escalader l'incident"
 JAP_escalate_incident_to_border_conflict_SOV_desc: "Il semble que les Soviétiques ne reculent pas devant le conflit. À ce stade, nous devons soit dégénérer en une confrontation armée, soit reculer."
 JAP_border_conflict_time_until_cancelled: "Mettre fin au conflit"
 JAP_border_conflict_time_until_cancelled_desc: "Au rythme actuel, nous ne pouvons soutenir les opérations de combat que pendant un certain temps avant de devoir interrompre le combat."
 JAP_border_conflict_escalate_conflict: "Escalader le conflit"
 JAP_border_conflict_escalate_conflict_desc: "Le conflit à la frontière avec l'Union soviétique est au point mort. Peut-être qu'en intensifiant davantage l'escalade et en envoyant davantage de troupes sur le théâtre des opérations, nous pourrons encore remporter la victoire."
 JAP_border_conflict_escalate_to_war: "Déclarer la guerre"
 JAP_border_conflict_escalate_to_war_desc: "Les combats dans la région contestée durent depuis un certain temps déjà et ne montrent aucun signe d'arrêt. Nous devons être prêts à franchir l'étape suivante et à considérer ce conflit comme la première étape d'une guerre générale."
 JAP_border_conflict_back_out_of_conflict: "Reculer"
 JAP_border_conflict_back_out_of_conflict_desc: "Le risque que ce conflit devienne incontrôlable et devienne une guerre à grande échelle entre nos pays est tout simplement trop grand. Nous devrions réduire nos pertes maintenant et envoyer des sondes diplomatiques à l'autre camp."
