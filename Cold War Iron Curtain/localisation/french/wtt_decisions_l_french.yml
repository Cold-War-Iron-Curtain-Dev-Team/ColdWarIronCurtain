 byz_triumph_for_italy: "Triomphe de l'Italie"
 byz_triumph_for_italy_desc: "L'Italie est passée sous notre contrôle, et nous devrions la réintégrer dans l'empire lors d'une glorieuse cérémonie !"
 byz_triumph_for_middle_east: "Triomphe pour le Levant"
 byz_triumph_for_middle_east_desc: "Le Levant est passé sous notre contrôle, et nous devrions le réintégrer dans l'empire lors d'une glorieuse cérémonie !"
 byz_triumph_for_egypt_and_tunis: "Triomphe de l'Egypte et de Tunis"
 byz_triumph_for_egypt_and_tunis_desc: "L'Egypte et Tunis sont passées sous notre contrôle, et nous devrions les réintégrer dans l'empire lors d'une glorieuse cérémonie !"
 form_arabia: "Unir l'Arabie"
 form_majapahit_empire: "Réformer la thalassocratie"
 form_rattanakosin_kingdom: "Renforcer le patrimoine Rattanakosin"
 form_hre: "Faire revivre le Saint Empire romain germanique"
 form_scandinavia_category: "Restaurer l'Union de Kalmar"
 form_scandinavia_category_desc: "Avec la conquête de tous les territoires scandinaves, il est temps de restaurer l'esprit de l'Union de Kalmar. Toute la Scandinavie prospérera sous notre domination."
 form_nordic_league_category: "Proclamer l'unité nordique"
 form_nordic_league_category_desc: "Les pays nordiques ressentent depuis longtemps une certaine affinité les uns avec les autres. Maintenant que nous contrôlons toutes les terres appartenant autrefois aux États constitutifs nordiques, il est possible de porter cette parenté vers de nouveaux sommets."
 form_gran_colombia_category: "Faire revivre l'héritage de Bolívar"
 form_gran_colombia_category_desc: "Même si l'expérience de la Grande Colombie n'a été que de courte durée il y a un siècle, nous avons aujourd'hui réussi une fois de plus à reprendre le contrôle de ses territoires constitutifs. Nous pourrions, une fois de plus, réaliser le rêve de Bolívar."
 form_austria_hungary_category: "Restaurer l'Empire austro-hongrois"
 form_austria_hungary_category_desc: "Les anciennes terres austro-hongroises ont été conquises et, en tant que seul État successeur, il dépend de nous de restaurer l'Empire. Ne tardons pas et faisons-le immédiatement."
 form_commonwealth_category: "Reformer le Commonwealth"
 form_commonwealth_category_desc: "Il y a une longue histoire entre nous et la Lituanie. Maintenant que nous sommes à nouveau unis par la force des armes, il est peut-être temps de revivre les jours les plus glorieux de notre passé."
 form_united_netherlands_category: "Répudier le traité de Londres"
 form_united_netherlands_category_desc: "Le Traité de Londres de 1839 sépara honteusement le nord et le sud des basses terres, après une bien trop brève période d'unité. Désormais, sous notre direction, nous pouvons recréer cette époque et prendre la place qui nous est assignée en tant que contrepoids à la France et à l'Allemagne."
 form_united_central_america_category: "Reconstituer la République fédérale"
 form_united_central_america_category_desc: "L'État puissant dont notre nation faisait partie il y a un siècle a eu une durée de vie bien trop brève. Maintenant que nous avons conquis les États sécessionnistes qui ont causé sa chute, nous pouvons envisager de reconstituer la république fédérale et commencer à projeter la puissance d'une Amérique centrale unie."
 form_baltic_federation_category: "Unifier les pays baltes"
 form_baltic_federation_category_desc: "Nos précédentes déclarations de solidarité régionale et de politique étrangère unifiée ne peuvent qu'être améliorées maintenant que nous avons l'ensemble de la Baltique sous notre contrôle. L'intégration de nos anciens voisins assurera une sécurité accrue pour tous, face aux dangers à l'Ouest et à l'Est."
 form_european_union_category: "Réaliser l'unité européenne"
 form_european_union_category_desc: "Bien que le concept d'une Europe politiquement unifiée n'ait gagné un semblant de popularité qu'au cours des dernières décennies, notre récente conquête des nations européennes continentales les plus puissantes nous présente cette réalité inattendue. Peut-être qu'une restructuration de la nation est nécessaire pour tirer pleinement parti des opportunités qu'elle nous offre."
 form_mutapa_category: "Recréer l'empire zimbabwéen"
 form_mutapa_category_desc: "Après avoir débarrassé les parties méridionales du continent des influences coloniales, il est peut-être temps de rallier les peuples derrière le concept d'un empire puissant issu de notre passé. Il en a existé plusieurs dans cette région, et il suffit d'un nom pour servir de symbole."
 form_roman_empire_category: "Réaliser les ambitions romaines"
 form_roman_empire_category_desc: "L'idée d'un empire s'étendant sur la Méditerranée a été relancée ces dernières années dans l'esprit populaire. Aujourd'hui, nos campagnes militaires ont dépassé les rêves les plus fous, même de nos plus ardents partisans, et nous nous trouvons sur le point de pouvoir réaliser ces ambitions. Roma invicta !"
 form_persian_empire_category: "Recréez l'empire perse"
 form_persian_empire_category_desc: "Nos récentes conquêtes ont atteint l'étendue de l'ancien empire perse. Compte tenu de la riche histoire de notre région, comment ne pas profiter de cette occasion pour identifier notre royaume comme une continuation des empires d'autrefois ?"
 form_byzantine_empire_category: "Restaurer Byzance"
 form_byzantine_empire_category_desc: "Après avoir débarrassé nos anciens territoires du joug turc, nous pouvons maintenant, avec un peu de propagande, affirmer que notre nation est le successeur de l'empire même que les Turcs ont mis fin il y a cinq siècles. Cet héritage fera certainement monter en flèche notre prestige international !"
 form_arabia_category: "Unir l'Arabie"
 form_arabia_category_desc: "Les États arabes sont depuis trop longtemps divisés par des rivalités régionales. Maintenant que nous avons unifié la péninsule sous notre domination, nous pouvons enfin annoncer la formation d'une Arabie unie !"
 form_majapahit_empire_category: "Réformer la thalassocratie"
 form_majapahit_empire_category_desc: "Il y a plusieurs siècles, un grand empire s'étendait sur l'archipel indonésien et dominait son commerce. Nous avons réussi à étendre nos frontières pour englober l'étendue de cet empire, et sa reconstitution pourrait bien servir de symbole de l'unité de la région."
 form_rattanakosin_kingdom_category: "Renforcer le patrimoine Rattanakosin"
 form_rattanakosin_kingdom_category_desc: "Ces dernières années, nous nous sommes éloignés des valeurs traditionnelles sur lesquelles notre nation était fondée. Maintenant que nous avons atteint l'étendue territoriale de nos jours de gloire, il est peut-être temps d'embrasser plus étroitement notre histoire."
 form_hre_category: "Faire revivre le Saint Empire romain germanique"
 form_hre_category_desc: "La splendeur de notre Kaiserin ne connaît pas de limites, pas plus que les frontières de notre nation. Celles-ci se sont désormais étendues pour englober les limites de l'ancien Saint-Empire romain germanique, et les nations qui nous suivent ne sont plus en mesure de s'opposer à notre politique. Le Kaiserin a décrété que l'occasion actuelle serait saisie et que la nation assumerait son rôle de successeur spirituel du Saint Empire romain germanique. Aquila Elegit Iovis Omnia Vincit!"
 form_greater_german_reich_category: "Proclamer le Grand Reich allemand"
 form_greater_german_reich_category_desc: "Nos ennemis ont été vaincus devant nous et nos objectifs d'expansion vers l'Est ont été atteints. Il est maintenant temps de faire comprendre au monde la grandeur de notre nation et de commencer la transformation de notre capitale en quelque chose que tous peuvent regarder avec fierté."
 form_greater_german_reich: "Proclamer le Grand Reich allemand"
 liberate_angola: "Libérer l'Angola"
 liberate_angola_desc: "Cela prendra environ 6 mois."
 liberate_mozambique: "Libérer le Mozambique"
 liberate_mozambique_desc: "Cela prendra environ 6 mois."
 liberate_congo: "Libérer le Congo"
 liberate_congo_desc: "Cela prendra environ 6 mois."
 liberate_zimbabwe: "Libérer le Zimbabwe"
 liberate_zimbabwe_desc: "Cela prendra environ 6 mois."
 liberate_kenya: "Libérer le Kenya"
 liberate_kenya_desc: "Cela prendra environ 6 mois."
 hold_fight_on_the_beaches_speech: "Tenir le discours « Nous nous battrons sur les plages »"
 hold_fight_on_the_beaches_speech_desc: "« Nous irons jusqu'au bout. Nous combattrons en France, nous combattrons sur les mers et les océans, nous combattrons avec une confiance croissante et une force croissante dans les airs, nous défendrons notre île, quel qu'en soit le prix. Nous nous battrons sur les plages, nous nous battrons sur les terrains de débarquement, nous nous battrons dans les champs et dans les rues, nous nous battrons dans les collines ; nous ne nous rendrons jamais...'"
 fight_on_the_beaches_speech: "Discours « Nous nous battrons sur les plages »"
 operation_fork: "Opération Fourche"
 operation_fork_desc: "La nation nouvellement indépendante qu'est l'Islande occupe une position extrêmement importante sur le plan stratégique dans l'Atlantique Nord. La perte de la Norvège placerait l'île sans défense dans une position vulnérable. Nous devons vaincre nos ennemis jusqu'à l'invasion et l'occupation de l'Islande, de peur qu'ils n'obtiennent les bases stratégiques de l'île, à partir desquelles ils pourraient mettre en danger nos lignes d'approvisionnement. Ce n'est qu'avec notre protection que les Islandais seront à l'abri de nos ennemis."
 invade_ireland: "Envahir l'Irlande"
 invade_ireland_desc: "Nous devons assurer la sécurité de nos convois par tous les moyens nécessaires. Une invasion de l'Irlande n'est peut-être pas acceptable pour certains d'entre nous, mais si c'est ce qu'il faut pour pouvoir utiliser leurs bases aériennes, qu'il en soit ainsi."
 macdonald_proposal: "La proposition Macdonald"
 macdonald_proposal_desc: "Nous devons garantir la sécurité de nos convois et, pour y parvenir, les bases aériennes et navales irlandaises sont de la plus haute importance. Nous enverrons un envoyé pour proposer un commerce de l'Irlande du Nord en échange de l'entrée immédiate de l'Irlande dans la guerre, à nos côtés."
 hold_blood_toil_tears_sweat_speech: "Tenir un discours sur « Sang, labeur, larmes et sueur »"
 hold_blood_toil_tears_sweat_speech_desc: "« Je n'ai rien à offrir à part du sang, du labeur, des larmes et de la sueur. (...) Vous demandez, quelle est notre politique ? Je dirai : c'est faire la guerre, sur mer, sur terre et dans les airs, de toutes nos forces et avec toute la force que Dieu peut nous donner ; faire la guerre à une tyrannie monstrueuse, jamais surpassée dans le sombre et lamentable catalogue du crime humain. C'est notre politique. Vous demandez, quel est notre objectif ? Je peux répondre en un mot : Victoire. Victoire à tout prix - Victoire malgré toute la terreur - Victoire, aussi longue et difficile que soit la route, car sans victoire il n'y a pas de survie."
 blood_toil_tears_sweat_speech: "Discours « Sang, labeur, larmes et sueur »"
 hold_this_was_their_finest_hour_speech: "Tenir un discours « C'était leur plus belle heure »"
 hold_this_was_their_finest_hour_speech_desc: "« Préparons-nous donc à nos devoirs, et faisons en sorte que si l'Empire britannique et son Commonwealth durent mille ans, les hommes diront encore : C'était leur plus belle heure. »"
 this_was_their_finest_hour_speech: "Discours « C'était leur plus belle heure »"
 mers_el_kebir_raid:1 "Opération Catapulte"
 mers_el_kebir_raid_desc: "La flotte française est tombée aux mains de la France de Vichy, et nous ne pouvons pas permettre qu'elle tombe aux mains des Allemands. Aussi écoeurant soit-il, nous devons exiger la reddition immédiate de la marine de notre ancien allié, sous la menace de bombardements."
 FRA_vichy_france: "Vichy France"
 FRA_scuttle_the_fleet: "Saborder la flotte"
 FRA_scuttle_the_fleet_desc: "Les forces étrangères s'efforcent de prendre le contrôle de nos forces navales par la force. Nous ne pouvons pas permettre que cela se produise et devons saborder nos navires !"
 FRA_case_anton_mission: "Affaire Anton en cours"
 case_anton: "Cas Anton"
 FRA_case_anton_mission_tt: "L'annexion est évitée."
 war_measures: "Mesures de guerre"
 women_in_the_workforce: "Les femmes sur le marché du travail"
 women_in_the_workforce_desc: "Alors que les hommes partent à la guerre, des milliers de femmes acceptent des emplois dans les usines pour faire fonctionner la machine de guerre."
 scientist_refuge: "Refuge des scientifiques"
 scientist_refuge_desc: "Dans le contexte politique actuel en Europe, un certain nombre de scientifiques ont décidé de quitter leur pays d'origine. Ils ont demandé un visa d'entrée dans notre pays. L'accorder nous donnera un bonus à la recherche, mais cela contrariera également certains qui considèrent qu'il s'agit d'une affaire interne dans laquelle nous ne devrions pas nous mêler."
 give_refuge_ger: "Donner refuge aux scientifiques allemands"
 give_refuge_ita: "Donner refuge aux scientifiques italiens"
 operations: "Opérations"
 GER_military_buildup: "Renforcement militaire"
 GER_weserubung_sud: "Weserübung-Süd"
 GER_weserubung_sud_desc: "Pour obtenir une bonne zone de rassemblement pour l'invasion de la Norvège, nous devons d'abord nous diriger vers le Danemark."
 GER_weserubung_nord: "Weserübung-Nord"
 GER_weserubung_nord_desc: "La Norvège est un point stratégique critique et constituerait un point d'attaque évident pour tout ennemi souhaitant perturber notre commerce de l'acier avec la Suède. Nous ne pouvons pas risquer que nos ennemis établissent des bases dans cette région."
 GER_case_yellow_netherlands: "Automne Gelb - Pays-Bas"
 GER_case_yellow_netherlands_desc: "Une attaque à travers la Belgique nous oblige à traverser un front trop étroit. Nous devons élargir notre plan de guerre aux Pays-Bas pour éviter les erreurs commises en 1914."
 GER_case_yellow_belgium_luxembourg: "Fall Gelb - Belgique et Luxembourg"
 GER_case_yellow_belgium_luxembourg_desc: "Une attaque sur la ligne Maginot est un suicide. Nous le flanquerons au nord et traverserons les Ardennes pour contourner les fortifications les plus lourdes."
 GER_polish_ultimatum: "Lancez l'ultimatum à la Pologne"
 SOV_industry_relocation: "Délocalisation de l'industrie"
 SOV_relocate_industry_from_moscow: "Délocaliser l'industrie de Moscou"
 SOV_relocate_industry_from_moscow_desc: "L'évacuation des machines lourdes de nos usines moscovites vers l'Oural est une entreprise immense, mais elle est nécessaire pour sécuriser notre production de guerre."
 SOV_relocate_industry_from_moscow_tt: "§RCes effets nécessitent le contrôle de Moscou lorsque la décision expire.§!"
 SOV_relocate_industry_from_leningrad: "Délocaliser l'industrie de Leningrad"
 SOV_relocate_industry_from_leningrad_desc: "Evacuer les machines lourdes de nos usines de Léningrad vers l'Oural est une entreprise immense, mais elle est nécessaire pour sécuriser notre production de guerre."
 SOV_relocate_industry_from_leningrad_tt: "§RCes effets nécessitent le contrôle de Leningrad lorsque la décision expire.§!"
 SOV_relocate_industry_from_smolensk: "Délocaliser l'industrie de Smolensk"
 SOV_relocate_industry_from_smolensk_desc: "L'évacuation des machines lourdes de nos usines de Smolensk vers l'Oural est une entreprise colossale, mais elle est nécessaire pour sécuriser notre production de guerre."
 SOV_relocate_industry_from_smolensk_tt: "§RCes effets nécessitent le contrôle de Smolensk lorsque le délai de décision expire.§!"
 relocate_industry_repair:1 "Certaines usines seront à reconstruire !"
 SOV_order_227: "Ordonnance 227"
 SOV_order_227_desc: "\"Il est temps de finir de battre en retraite. Pas un pas en arrière !\""
 SOV_scorched_earth: "Mettre en oeuvre les tactiques de la Terre brûlée"
 SOV_scorched_earth_baltics: "Exécuter Scorched Earth dans les pays baltes"
 SOV_scorched_earth_moscow: "Exécuter Scorched Earth aux abords de Moscou"
