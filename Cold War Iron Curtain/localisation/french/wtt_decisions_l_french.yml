 SOV_scorched_earth_caucasus: "Exécuter la Terre brûlée dans le Caucase"
 SOV_scorched_earth_ukraine: "Exécuter la Terre brûlée en Ukraine"
 SOV_scorched_earth_stalingrad: "Exécuter Scorched Earth aux abords de Stalingrad"
 GER_reichskommissariats: "Commissariats du Reich"
 GER_reichskommissariats_desc: "Permet la création de certains sujets du Reichskommissariat hors du territoire contrôlé.\n\n"
 GER_reichskommissariat_norwegen: "Reichskommissariat Norvège"
 GER_reichskommissariat_niederlande: "Reichskommissariat Pays-Bas"
 GER_reichskommissariat_belgien_nordfrankreich: "Reichskommissariat Belgien-Nordfrankreich"
 GER_reichskommissariat_ostland: "Reichskommissariat Ostland"
 GER_reichskommissariat_ukraine: "Commissariat du Reich d'Ukraine"
 reinstate_wilhelm_iv_succession_rights: "Rétablir le droit de succession du prince Wilhelm"
 reinstate_wilhelm_iv_succession_rights_desc:1 "Le fils de l'empereur Guillaume III a été contraint de renoncer à son droit de succession en souhaitant se marier contre l'approbation de Guillaume II, alors chef de famille. Comme Guillaume III a désormais assumé ce rôle, il pourrait être en mesure de faire pression sur son père en exil pour qu'il soutienne un renversement de cette décision."
 reinstate_wilhelm_iv_succession_rights_tt: "La ligne de succession est modifiée.\n"
 modernize_the_succession_laws: "Moderniser les lois sur les successions"
 modernize_the_succession_laws_desc: "Le fils de l'actuel Kaiser, le futur Guillaume IV, n'a que deux filles comme héritières. Il faut sécuriser la ligne de succession, et donc les lois successorales doivent être modernisées pour permettre à la princesse Felicitas de régner, le moment venu."
 modernize_the_succession_laws_tt: "Les femmes peuvent hériter du trône.\n"
 request_restoration_of_british_titles: "Demander la restauration des titres britanniques"
 request_restoration_of_british_titles_desc: "En 1917, le Parlement britannique a voté la révocation de toutes les pairies britanniques et de tous les titres royaux des familles royales et princières allemandes. Maintenant que nous sommes alliés et entretenons d'excellentes relations, il est peut-être temps de demander l'annulation de cette décision."
 hindenburg_destroyed_tt: "Le Hindenburg est §YNON§! détruit.\n"
 request_restoration_of_british_titles_tt: "Cela mènera sans aucun doute à des récompenses sans précédent...\n"
 GER_request_polish_war_participation: "Exiger la participation polonaise à la guerre"
 GER_request_polish_war_participation_desc: "Comme nous sommes en guerre contre le [SOV.GetName], nous devons faire passer nos armées par le territoire [POL.GetAdjective]. Comme nous avons juré de les protéger, il est tout à fait naturel qu'ils se joignent à notre guerre."
 GER_reform_austro_hungarian_empire:1 "Réformer l'Empire austro-hongrois"
 GER_reform_austro_hungarian_empire_tt: "Demande aux autres États successeurs austro-hongrois de reformer l'Empire.\n§RS'ils acceptent, vous hériterez de toutes les guerres dans lesquelles ils sont impliqués !§!\n"
 GER_barbarossa_mission: "Directive 21 du Führer"
 emergency_factory_conversion_defensive: "Conversion d'usine d'urgence"
 emergency_factory_conversion_defensive_desc: "Il y a désespérément besoin de plus d'équipement sur le front. Nous devons de toute urgence convertir davantage d'usines pour produire des armes et des véhicules destinés à défendre notre pays."
 emergency_factory_conversion_offensive: "Conversion d'usine d'urgence"
 emergency_factory_conversion_offensive_desc: "Nos troupes ont un besoin urgent de plus d'équipement. Il faut davantage d'usines pour produire l'équipement nécessaire pour gagner la guerre."
 demolish_enemy_fortifications: "Démolir les fortifications ennemies"
 dismantle_maginot: "Démanteler Maginot"
 propaganda_efforts: "Efforts de propagande"
 war_propaganda: "Propagande de guerre"
 war_propaganda_desc: "Alors que le monde brûle autour de nous, nos peuples ne sont malheureusement pas préparés à la guerre. Nous devons rallier leur soutien pour prendre les armes pour notre nation."
 desperate_defense: "Défense désespérée"
 desperate_defense_desc: "Nous ne pouvons plus reculer. Nos soldats doivent se retrancher et tenir la ligne."
 war_bonds: "Obligations de guerre"
 war_bonds_desc: "Nous avons besoin de plus de ressources pour notre économie de guerre, et les obligations de guerre ne sont que le moyen de les obtenir."
 CHI_lessons_of_war: "Leçons de guerre"
 CHI_bolster_our_ranks: "Renforcez nos rangs"
 CHI_industrial_evacuations_from_beijing: "Évacuations industrielles de Pékin"
 GER_barbarossa_mission_desc: "\"Les forces armées allemandes doivent être prêtes à écraser la Russie soviétique au cours d'une campagne rapide. La majeure partie de l'armée russe sera détruite par des opérations audacieuses menées par des fers de lance blindés.\""
 USA_war_measures: "Mesures de guerre"
 USA_homeland_defense: "Loi d'urgence en matière de défense intérieure"
 USA_homeland_defense_desc:1 "L'ennemi a mis le pied sur le sol de notre fière nation. Le peuple américain va se soulever et repousser les envahisseurs à la mer !"
 USA_aid_britain: "Aidez la Grande-Bretagne"
 USA_establish_personal_communication_with_former_naval_person: "Correspondance avec un ancien marin"
 USA_establish_personal_communication_with_former_naval_person_desc: "Un nouveau leader a assumé le rôle de Premier ministre dans le [ENG.GetName]. Nous devons ouvrir un dialogue personnel avec lui, nous aidant à préparer et à coordonner notre inévitable entrée dans la guerre."
 USA_battle_domestic_isolationism: "Combattre l'isolationnisme domestique"
 USA_battle_domestic_isolationism_desc: "Si les éléments isolationnistes voulaient faire ce qu'ils voulaient, nous serions sans défense contre toute nation hostile. Pour notre propre bien, nous devons commencer à déconstruire la rhétorique isolationniste dominante."
 USA_emergency_arms_deliveries: "Livraisons d'armes d'urgence"
 USA_emergency_arms_deliveries_desc: "La France est tombée et la Grande-Bretagne se trouve désormais seule face à l'agresseur, luttant pour défendre ses côtes contre l'invasion. Par une rhétorique enflammée, ils ont indiqué que leur détermination était plus forte que jamais et qu'ils n'avaient pas l'intention de rester silencieux dans la nuit. Nous devons à la démocratie de garantir qu'ils aient les moyens de défendre leur liberté."
 USA_arsenal_of_democracy_decision: "Arsenal de la démocratie"
 USA_arsenal_of_democracy_decision_desc: "Même si nous ne serons pas encore entraînés dans le conflit, nous pouvons aider nos amis en constituant leur arsenal. Faisons comprendre aux gens pourquoi cela est nécessaire."
 USA_women_in_the_workforce:1 "Rosie la riveteuse"
 USA_women_in_the_workforce_desc: "Peut-on utiliser un batteur électrique ? Si tel est le cas, vous pouvez apprendre à utiliser une perceuse. Tout au long de la guerre, plus de six millions de femmes américaines ont travaillé dans les usines, la construction et d'autres travaux physiques et ont prouvé à jamais que les femmes pouvaient faire ce travail aussi bien que les hommes."
 CAN_women_in_the_workforce: "Ronnie la fille au pistolet Bren"
 CAN_women_in_the_workforce_desc: "Ronnie dit : \"Continuez à les venir !\" Avec nos hommes servant dans l'armée, le fardeau de notre production militaire repose sur les épaules des femmes de notre nation. Au cours de la guerre, 800 000 Canadiennes ont occupé les emplois laissés par celles qui s'étaient enrôlées, prouvant ainsi à jamais que les femmes pouvaient faire ce travail aussi bien que les hommes."
 CHI_integrate_the_warlords: "Intégrez les seigneurs de guerre"
