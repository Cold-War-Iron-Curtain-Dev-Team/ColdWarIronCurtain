 SOV_hold_stalingrad: "Tenir Stalingrad"
 SOV_hold_leningrad: "Tenir Léningrad"
 SOV_hold_moscow: "Tenir Moscou"
 SOV_seize_manchuria: "S'emparer de la Mandchourie"
 SOV_seize_manchuria_desc: "À la suite de la guerre civile japonaise, [MAN.GetName] s'est libéré de la domination japonaise. Nous avons une occasion en or d'établir enfin la domination soviétique sur la région, si nous agissons rapidement."
 SOV_return_manchuria: "Retour en Mandchourie"
 SOV_return_manchuria_desc: "Nous rendrons la Mandchourie au seul régime populaire légitime en Chine."
 fascism_on_the_rise: "Le fascisme en hausse"
 fascism_on_the_rise_desc: "Des éléments politiques virulents ont commencé à s'exprimer en faveur des valeurs fascistes, trouvant le soutien d'un nombre croissant de la population. La voie vers le fascisme est ouverte pour la nation, attendant simplement le choix d'une transition pacifique ou violente."
 prepare_for_fascist_civil_war: "Préparez-vous à la guerre civile"
 prepare_for_fascist_civil_war_desc:1 "Nous n'avons pas le temps d'attendre les lents changements dans l'esprit des gens. Dans leur propre intérêt, nous devons agir rapidement, même si certains risquent de perdre la vie dans le processus. Contrairement à un référendum pacifique, une guerre civile causera d'énormes dégâts à nos forces armées ainsi qu'à l'industrie et aux infrastructures du pays, mais elle est également plus rapide et garantit que nous serons ensuite en mesure d'imposer notre volonté avec plus de force."
 expand_civil_fascism_support: "Élargir le soutien civil"
 expand_civil_fascism_support_desc:1 "Nous devons garantir la diffusion continue du soutien à notre cause parmi la population et l'encourager à contester publiquement l'autorité du gouvernement actuel. À mesure que la position du gouvernement est de plus en plus ébranlée et que les troubles civils continuent de s'intensifier, il nous sera plus facile d'atteindre nos objectifs. Cela est particulièrement vrai si, contrairement à un changement juridique de gouvernement, ces objectifs impliquent un moyen plus... Sinistre de changement de régime."
 army_support_for_fascist_civil_war: "Élargir le soutien militaire"
 army_support_for_fascist_civil_war_desc: "Sans un soutien militaire suffisant, tout espoir de victoire dans une lutte idéologique armée serait vain. Nous devons garantir la loyauté des unités bien placées de nos forces militaires."
 army_support_TT: "Chaque fois que le soutien de l'armée est augmenté, 10 % sont ajoutés à la force de votre faction dans la guerre civile, jusqu'à une force totale maximale de 70 %.\n"
 ensure_general_loyalty_for_fascist_civil_war:1 "Assurer la loyauté du commandement de l'armée inférieure"
 ensure_general_loyalty_for_fascist_civil_war_desc: "Il est possible que certains généraux nourrissent des sentiments secrets en faveur du fascisme. Nous devons les approcher et garantir leur loyauté jusqu'au début des combats."
 ensure_marshal_loyalty_for_fascist_civil_war: "Assurer la loyauté du commandement de la Haute Armée"
 ensure_marshal_loyalty_for_fascist_civil_war_desc: "Il est possible que certains maréchaux nourrissent des sentiments secrets en faveur du fascisme. Nous devons les approcher et garantir leur loyauté jusqu'au début des combats."
 siphon_equipment_stockpiles_for_fascist_civil_war: "Équipement de siphon"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc: "En parcourant les réserves d'équipement du pays, nous pouvons créer une petite réserve d'armes pour nous aider dans notre lutte future."
 formulate_surprise_attack_plan_for_fascist_civil_war: "Formuler un plan d'attaque surprise"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc: "L'ennemi n'a aucune idée de la calamité imminente. Nous devons veiller à ce que cela reste ainsi, tout en orientant nos plans de bataille de manière à utiliser au maximum l'élément de surprise."
 formulate_surprise_attack_plan_for_civil_war_tt: "Le plan d'attaque surprise donne un bonus d'attaque de 25 % à toutes les divisions sur le territoire principal, pendant 30 jours.\n"
 ignite_the_fascist_civil_war: "Déclenchez la guerre civile"
 ignite_the_fascist_civil_war_desc: "Le moment est venu de franchir le pas. Tous les préparatifs que nous avons jugés nécessaires ont été effectués. Il n'y a plus de retour en arrière possible."
 rebuild_the_nation_fascism: "Reconstruire la nation"
 rebuild_the_nation_fascism_desc: "Après la guerre civile, le moment est venu de reconstruire notre nation ruinée."
 open_up_political_discourse_fascism: "Ouvrir le discours politique"
 open_up_political_discourse_fascism_desc:1 "Nous devons accepter les points de vue divergents au sein du gouvernement. Peut-être que cela permettra à terme d'instaurer un changement pacifique dans la politique de notre nation."
 discredit_government_fascism: "Discréditer le gouvernement"
 discredit_government_fascism_desc: "En soulignant les nombreux défauts de notre gouvernement actuel, nous pouvons amener les gens à réfléchir aux causes idéologiques de ces échecs."
 hold_the_fascist_national_referendum: "Organiser un référendum national"
 hold_the_fascist_national_referendum_desc: "Avec un soutien suffisant, nous pouvons désormais organiser en toute sécurité un référendum pour provoquer un changement de gouvernement, sans effusion de sang."
 democratic_on_the_rise: "Le progressisme à la hausse"
 democratic_on_the_rise_desc: "Des éléments politiques virulents ont commencé à s'exprimer en faveur des valeurs progressistes, trouvant le soutien d'un nombre croissant de la population. La voie du pays vers le progressisme est ouverte, attendant simplement le choix d'une transition pacifique ou violente."
