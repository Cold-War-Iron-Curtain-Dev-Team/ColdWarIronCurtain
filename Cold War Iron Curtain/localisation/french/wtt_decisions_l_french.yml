 JAP_china_step_up_war_effort: "Intensifier la guerre en Chine"
 JAP_ichi_go: "Ichi va"
 JAP_ichi_go_desc: "La fin de la guerre est en vue. Avec un dernier effort et des efforts déterminés, nous pouvons mettre rapidement un terme au conflit. Cependant, si nous ne parvenons pas à remporter la victoire au cours de l'année prochaine, nous pourrions souffrir d'une instabilité interne alors que l'opinion publique s'élève contre l'effort de guerre accru..."
