 JAP_sue_for_peace_CHI:1 "Proposer des conditions de rachat à [From.GetNameDef]"
 JAP_sue_for_peace_TT: "Aucun noyau continental §Ychinois§! ou §Ycoréen§! n'est contrôlé par §YJapon§! ou l'un de ses sujets."
 JAP_sue_for_peace_CHI_desc: "Nous avons perdu notre emprise sur le continent. L'armée estime qu'il est peu probable que nous puissions récupérer les territoires perdus. Le gouvernement civil suggère que nous cherchions des conditions pour au moins conserver notre souveraineté sur les îles."
 JAP_sue_for_peace_MAN: "Proposer des conditions de rachat à [From.GetNameDef]"
 JAP_sue_for_peace_MAN_desc: "Nous avons perdu notre emprise sur le continent. L'armée estime qu'il est peu probable que nous puissions récupérer les territoires perdus. Le gouvernement civil suggère que nous cherchions des conditions pour au moins conserver notre souveraineté sur les îles."
 JAP_sue_for_peace_nuke: "Offrez une reddition inconditionnelle"
 JAP_sue_for_peace_nuke_desc: "L'ennemi a employé une bombe nouvelle et des plus cruelles. La guerre évolue pas nécessairement à notre avantage. Nous devons endurer l'insupportable."
 JAP_sue_for_peace_nuke_mission: "Exécuter des frappes nucléaires sur le sol japonais"
 JAP_sue_for_peace_nuke_mission_desc: "Le récent essai réussi d'une bombe nucléaire offre une alternative à une invasion à grande échelle des îles japonaises. Les renseignements suggèrent que frapper deux endroits des îles Home avec des bombes nucléaires en succession rapide obligera le gouvernement japonais à se rendre sans condition."
 JAP_request_soviet_support: "Demander le soutien soviétique"
 JAP_request_soviet_support_desc: "Nous avons besoin d'aide dans la guerre civile actuelle, et les partisans les plus proches de notre cause sont les Soviétiques situés au nord de notre pays. Peut-être pourrions-nous échanger le sud de la péninsule de Sakhaline contre un groupe de divisions de volontaires soviétiques."
 JAP_nuke_1: "Exécution de la première frappe nucléaire contre le Japon"
 JAP_nuke_2: "Exécution de la deuxième frappe nucléaire contre le Japon"
 foreign_politics: "Politique étrangère"
 JAP_pressure_france:1 "Exiger l'Indochine"
 JAP_break_the_london_naval_treaty: "Rompre le traité naval de Londres"
 JAP_break_the_london_naval_treaty_desc: "Les restrictions scandaleuses du Traité naval de Londres constituent une menace pour la sécurité de notre nation. Nous devons avoir la liberté de construire une marine capable de résister à toute nation qui mettrait en cause ce qui nous appartient de droit."
 JAP_tora_tora_tora: "Tora ! Tora ! Tora !"
 JAP_tora_tora_tora_desc: "Le premier coup attend. Ensuite, nous devons continuer rapidement, en utilisant l'élan que nous avons acquis pour paralyser nos ennemis avant qu'ils ne réalisent ce qui s'est passé."
 JAP_war_with_soviet_union: "Déclarer la guerre à l'Union soviétique"
 JAP_war_with_soviet_union_desc: "Nos alliés en Europe ont signé un pacte de non-agression avec l'Union soviétique. Cependant, notre guerre ne peut pas attendre ; nous devons poursuivre unilatéralement un conflit avec les communistes, même si cela risque de nous aliéner nos alliés."
 institute_press_censorship_fascist_state: "Censure de la presse de l'Institut"
 institute_press_censorship_fascist_state_desc: "Nous vivons une époque dangereuse et nous ne pouvons pas permettre que des voix dissidentes déchirent notre pays. Restreindre la liberté de la presse est nécessaire pour garantir que la vérité soit entendue haut et fort."
