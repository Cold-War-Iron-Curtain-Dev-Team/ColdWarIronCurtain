 blow_suez_canal: "Faire sauter le canal de Suez"
 blow_suez_canal_desc: "Nous ne pouvons pas permettre à nos ennemis d'utiliser le canal de Suez, stratégiquement vital. Nous devons donc commencer à nous préparer pour infliger suffisamment de dégâts ciblés au canal afin qu'il reste hors service pendant une longue période. Cela limitera considérablement la capacité de l'ennemi à déplacer des navires d'Asie et d'Afrique de l'Est vers la Méditerranée."
 blow_panama_canal: "Faire sauter le canal de Panama"
 blow_panama_canal_desc: "Nous ne pouvons pas permettre à nos ennemis d'utiliser le canal de Panama, d'une importance stratégique. Nous devons donc commencer à nous préparer pour infliger suffisamment de dégâts ciblés au canal afin qu'il reste hors service pendant une longue période. Cela augmentera considérablement la difficulté pour l'ennemi de déplacer les navires du Pacifique vers l'Atlantique, et vice versa."
 rebuild_suez_canal: "Réparer le canal de Suez"
 rebuild_suez_canal_desc: "Le canal de Suez est de la plus haute importance pour notre effort de guerre. Nous devons consacrer toutes les ressources nécessaires à la reconstruction de ce grand canal, afin que nous puissions l'utiliser pour faire circuler librement les navires et les troupes entre la Méditerranée et l'océan Indien."
 rebuild_panama_canal: "Réparer le canal de Panama"
 rebuild_panama_canal_desc: "Le canal de Panama est de la plus haute importance pour notre effort de guerre. Nous devons allouer toutes les ressources nécessaires à la reconstruction de ce grand canal, afin que nous puissions l'utiliser pour faire circuler librement les navires et les troupes entre les océans Pacifique et Atlantique."
 border_war_with_from: "Guerre frontalière avec [From.GetNameDef]"
 MAN_banditry_category: "Banditisme"
 MAN_banditry_category_desc: "L'armée du Guandong montre peu d'intérêt à aider les habitants de la Mandchourie, la considérant comme une occupation militaire plutôt que comme une construction de la nation. Le gouvernement du Mandchoukouo, tel qu'il est, n'a reçu que peu de ressources de la part des Japonais pour maintenir l'ordre. Dans ce vide de pouvoir affluent toutes sortes de bandits : parfois des soi-disant « combattants de la liberté », assassinant et volant au nom d'idéaux abstraits comme la « libération nationale » ou « l'internationalisme prolétarien », mais le plus souvent sans aucune idéologie déclarée pour masquer leurs abus."
 MAN_bandit_raids: "Raids de bandits"
 MAN_bandit_raids_desc: "Des brigands et des terroristes errants volent tout ce qui n'est pas cloué et brûlent le reste ! Levez plus de troupes et arrêtez-les !"
 PRC_border_clashes: "Affrontements aux frontières"
 PRC_border_clashes_desc: "Le terrain de la Chine oblige chacun à choisir ses batailles avec soin. Cela nous donne l'opportunité de nous emparer de certains terrains vulnérables sans nous engager dans une guerre totale."
