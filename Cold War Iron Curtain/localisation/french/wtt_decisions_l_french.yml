 anti_fascist_raids: "Raids antifascistes"
 anti_fascist_raids_desc: "Nous devons réprimer les éléments fascistes dans notre pays dans l'intérêt de la stabilité intérieure à long terme. Leur influence est trop grande et pourrait potentiellement devenir un problème pour le gouvernement."
 anti_democratic_raids: "Raids antidémocratiques"
 anti_democratic_raids_desc: "Nous devons réprimer les éléments démocratiques de notre nation dans l'intérêt de la stabilité intérieure à long terme. Leur influence est trop grande et pourrait potentiellement devenir un problème pour l'État."
 anti_communist_raids: "Raids anticommunistes"
 anti_communist_raids_desc: "Nous devons réprimer les éléments communistes dans notre pays dans l'intérêt de la stabilité intérieure à long terme. Leur influence est trop grande et pourrait potentiellement devenir un problème pour le gouvernement."
 object_to_attaches: "Objection à l'Attaché"
 object_to_attaches_desc: "Nos ennemis reçoivent une aide étrangère ! Nous devons émettre une objection ferme et exiger le retrait de tous les attachés."
