l_french:
 FRE_Operation_Bretagne: "Opération Bretagne"
 FRE_Operation_Bretagne_desc: "Sécurisez §YPhat Diem et Ninh Binh§! à §YDong Bang Song Hong (Delta du Fleuve Rouge)§!. La prise ne commence qu'une fois que le Viet Minh commet des divisions n'importe où dans l'État du Delta ou contrôle l'un ou l'autre des objectifs. Les forces de l'Union française doivent alors tenir les deux pendant §Y7 jours consécutifs§!. Terminez la prise par jour §Y30§! pour un succès net ; le succès ultérieur est coûteux et l'opération se termine le jour §Y45§!. Si le Viet Minh ne s'engage jamais, il est rompu sans récompense.\n\n§RNe pas pénétrer dans la ville de Thanh Hoa§!: la contrôler alors que le Viet Minh possède toujours l'État de Thanh Hoa provoque une surextension opérationnelle. Thanh Hoa n'est pas un objectif et ne compte pas pour la Bretagne.\n\nUn résultat net coûte au Viet Minh §Y15 ravitaillement de campagne§! et renforce la cause française dans la lutte."
 FRE_Operation_Adolphe: "Opération Adolphe"
 FRE_Operation_Adolphe_desc: "Prenez et maintenez §YYen Chau§! dans §YTay Bac Bo§! avec les forces de l'Union française pendant §Y5 jours consécutifs§!. La perte de l'objectif réinitialise la prise. Complétez-le par jour §Y20§! pour un succès net ; le succès ultérieur est coûteux et l'opération se termine le jour §Y30§!. L'occupation de l'arrière-plan appartenant au Viet Minh à Dong Bac Bo, Thanh Hoa, Nghe-Tinh ou Quang Binh provoque une surextension opérationnelle de §R§!.\n\nUn résultat net coûte au Viet Minh §Y10 ravitaillement de campagne§! et ajoute un niveau de préparation à la prochaine préparation de secours."
 FRE_Operation_Camargue: "Opération Camargue"
 FRE_Operation_Camargue_desc: "Sécurisez les provinces côtières mises en évidence sur la Route 1 de §YVan Trinh et My Thuy§! dans §YCoastal Trung Phan§!, entre Hue et Quang Tri. La prise ne commence qu'une fois que le Viet Minh ou le Viet Minh du sud engagent des divisions sur la côte de Trung Phan ou Hue, ou contrôlent l'un ou l'autre des objectifs. Les forces de l'Union française doivent alors tenir les deux pendant §Y7 jours consécutifs§!, réduits à §Y6§! si la garnison Chanson survit. Terminez la prise par jour §Y25§! pour un succès net ; le succès ultérieur est coûteux et l'opération se termine le jour §Y40§!. Si l'ennemi ne s'engage jamais, il est interrompu sans récompense. L'occupation de l'arrière-plan appartenant au Viet Minh provoque une surextension opérationnelle de §R§!. Les deux divisions de l'État du Vietnam levées pour la Camargue se retirent à la fin de celle-ci.\n\nUn résultat net confère à l'État du Vietnam une certaine stabilité et un soutien de guerre et renforce la cause de l'indépendance dans la lutte."
 FRE_Operation_Bretagne_Available_tt: "Disponible après le §Y15 novembre 1952§!, ou plus tôt dans le cadre d'un programme d'opérations accélérées, une fois que Lorraine aura été décidée ou que Na San aura été préparé. Le théâtre d'Indochine doit rester ouvert, le temps de recharge des opérations doit être terminé, et aucune opération CEFEO, campagne du Viet Minh, raid du Laos ou guerre existante du CEFEO avec le Viet Minh ne peut être en cours."
 FRE_Operation_Adolphe_Available_tt: "Disponible après le §Y15 mars 1953§!, ou avant dans le cadre d'un programme d'opérations accélérées, une fois la bataille de Na San terminée et les forces de l'Union française contrôlent toujours son aérodrome. Le théâtre d'Indochine doit rester ouvert, le temps de recharge des opérations doit être terminé, et aucune opération CEFEO, campagne du Viet Minh, raid du Laos ou guerre existante du CEFEO avec le Viet Minh ne peut être en cours."
 FRE_Operation_Camargue_Available_tt: "Disponible après le §Y1 juillet 1953§!, ou avant dans le cadre d'un programme d'opérations accélérées, une fois Hirondelle ou Brochet terminé. Le théâtre d'Indochine doit rester ouvert, le temps de recharge des opérations doit être terminé, et aucune opération CEFEO, campagne du Viet Minh, raid du Laos ou guerre existante du CEFEO avec le Viet Minh ne peut être en cours."
 FRE_Operation_Bretagne_Launched: "§YLancement de l'opération Bretagne§!"
 FRE_Operation_Adolphe_Launched: "§YLancement de l'opération Adolphe§!"
 FRE_Operation_Camargue_Launched: "§YL'opération Camargue est lancée§!"
 FRE_OP_OBJ_HIRONDELLE: "Conserver §Yavions de transport en stock CEFEO§!, ou faire livrer les moyens aériens, pendant §Y14 jours consécutifs§! avec engagement léger, §Y10§! avec engagement standard ou §Y7§! avec engagement maximum.\nIl s'agit d'un raid aéroporté : §Yaucune province ne doit être capturée§!, y compris Lang Son ou Ky Lua."
 FRE_OP_OBJ_MOUETTE: "Prenez et maintenez la province §YPhu Nho Quan§! en surbrillance dans l'état §YThanh Hoa§! ET soit §YNinh Binh§! ou §YPhat Diem§! dans §YDong Bang Song Hong§! pendant §Y5 jours consécutifs§! avec les forces de l'Union française. La perte d'une position requise réinitialise la prise.\n§RSurextension§!: occupation de terrains appartenant au Viet Minh dans la ville de Thanh Hoa, ou à Lang Son, Cao Bang, Dong Bac Bo, Nghe-Tinh ou Quang Binh."
 FRE_OP_OBJ_BROCHET: "Tenez la §YCentral Day River Line§! en §YDong Bang Song Hong§! avec les forces de l'Union française le §Yjour 35§!, la date limite finale. Le Viet Minh lance l'attaque.\nUn résultat propre nécessite de ne jamais perdre la ligne ; le perdre et le reprendre donne un succès coûteux. Ne pas le tenir au jour 35 signifie un échec.\n§RSurextension§!: occupation de terrains appartenant au Viet Minh à Lang Son, Cao Bang ou les zones arrière de Dong Bac Bo, Thanh Hoa, Nghe-Tinh ou Quang Binh."
 FRE_OP_OBJ_BRETAGNE: "Tenez les DEUX provinces mises en évidence, §YPhat Diem et Ninh Binh§! dans §YDong Bang Song Hong (Delta du fleuve Rouge)§!, avec les forces de l'Union française pendant §Y7 jours consécutifs§!.\nLe décompte ne commence qu'une fois que le Viet Minh commet des divisions n'importe où dans cet État ou contrôle l'un ou l'autre des objectifs. S'ils ne s'engagent jamais avant §Yjour 45§!, l'opération est interrompue sans récompense. Perdre l'un ou l'autre objectif réinitialise la prise.\n§RThanh Hoa n'est pas l'objectif§! et ne compte pas pour la Bretagne. Le contrôle de la ville de Thanh Hoa alors que le Viet Minh possède toujours son État provoque §Rune surextension opérationnelle§!."
 FRE_OP_OBJ_ADOLPHE: "Prenez et maintenez la province §YYen Chau§! en surbrillance dans §YTay Bac Bo§! avec les forces de l'Union française pendant §Y5 jours consécutifs§!. Le perdre réinitialise la prise.\n§RSurextension§!: occupation de l'arrière-plan appartenant au Viet Minh à Dong Bac Bo, Thanh Hoa, Nghe-Tinh ou Quang Binh."
 FRE_OP_OBJ_CAMARGUE: "Tenez les DEUX provinces côtières de la Route 1 mises en évidence, §YVan Trinh et My Thuy§! dans §YTrung Phan côtier§!, avec les forces de l'Union française pendant §Y7 jours consécutifs§! (§Y6§! si la garnison Chanson a survécu).\nLe décompte ne commence qu'une fois que le Viet Minh ou le Viet Minh du sud engagent des divisions sur la côte de Trung Phan ou Hue, ou contrôlent l'un ou l'autre des objectifs. S'ils ne s'engagent jamais avant §Yjour 40§!, l'opération est interrompue sans récompense. Perdre l'un ou l'autre objectif réinitialise la prise.\n§RSurextension§!: occupation de l'arrière-plan appartenant au Viet Minh à Dong Bac Bo, Thanh Hoa, Nghe-Tinh ou Quang Binh."
 FRE_OP_OBJ_NONE: ""
 FRE_OP_CONTEST_ENGAGED: "\n§GLe Viet Minh s'est engagé.§! Les prises consécutives comptent désormais pour le succès."
 FRE_OP_CONTEST_WAITING: "\n§YLe Viet Minh ne s'est pas encore engagé.§! Tenir les objectifs ne compte pas encore pour le succès. S'ils ne s'engagent pas dans le délai imparti, l'opération est interrompue sans récompense."
 FRE_OP_CONTEST_NONE: ""
 FRE_Op_Mouette_Objective: "Opération Mouette : Phu Nho Quan et le Delta"
 FRE_Op_Mouette_Objective_desc: "$FRE_OP_OBJ_MOUETTE$\nTerminez la prise avant §Yjour 30§! pour un succès net ; le succès ultérieur coûte cher. Le délai final est §Yjour 45§!. Les provinces mises en évidence sont les cibles."
 FRE_Op_Brochet_Objective: "Opération Brochet : Central Day River Line"
 FRE_Op_Brochet_Objective_desc: "$FRE_OP_OBJ_BROCHET$\nLa province en surbrillance est la cible. Il n'y a pas de prise plus courte qui termine Brochet plus tôt : la ligne doit être tenue le §Yjour 35§!."
 FRE_Op_Bretagne_Objective: "Opération Bretagne : Phat Diem et Ninh Binh"
 FRE_Op_Bretagne_Objective_desc: "$FRE_OP_OBJ_BRETAGNE$\nTerminez la prise avant §Yjour 30§! pour un succès net ; le succès ultérieur coûte cher. Le délai final est §Yjour 45§!. Les provinces mises en évidence sont les cibles."
 FRE_Op_Adolphe_Objective: "Opération Adolphe : Yen Chau"
 FRE_Op_Adolphe_Objective_desc: "$FRE_OP_OBJ_ADOLPHE$\nComplete the hold by §Yday 20§! for a clean success; le succès ultérieur coûte cher. Le délai final est §Yjour 30§!. La province en surbrillance est la cible."
 FRE_Op_Camargue_Objective: "Opération Camargue : Van Trinh et My Thuy"
 FRE_Op_Camargue_Objective_desc: "$FRE_OP_OBJ_CAMARGUE$\nComplete the hold by §Yday 25§! for a clean success; le succès ultérieur coûte cher. Le délai final est §Yjour 40§!. Les provinces mises en évidence sont les cibles."
 FRE_Operation_Timeout_tt: "A l'échéance finale, l'opération se termine. Ses exigences en matière d'objectif et de maintien déterminent le succès, le succès coûteux ou l'échec ; une Bretagne ou une Camargue non engagée est rompue sans récompense. La guerre ouverte pour l'opération se termine par une paix blanche, sans gains territoriaux."
 VIN_Campaign_Timeout_tt: "À la date limite, la campagne se termine. Atteindre son objectif et toute prise requise donne un succès net ou coûteux selon le calendrier ; sinon ça échoue. La guerre de campagne se termine. Les campagnes territoriales réussies attribuent leurs États désignés au Viet Minh ; les batailles limitées ne transfèrent pas la propriété."
 NLF_Dak_Doa_Timeout_tt: "Si Dak Doa n'a pas été tenu pendant sept jours consécutifs au jour 45, l'offensive du Sud Viet Minh échoue. La guerre séparée pour le poste se termine par une paix blanche, sans changement de propriétaire. D'autres guerres continuent."
 FRE_Abort_Limited_Operation_Effect_tt: "Arrêtez l'opération sans récompense. La guerre ouverte pour lui se termine par une paix blanche, sans gains territoriaux."
