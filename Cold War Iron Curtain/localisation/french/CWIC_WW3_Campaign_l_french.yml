l_french:
 SOVw_Third_World_War.5.t: "Un appel à Pékin"
 SOVw_Third_World_War.5.a: "Envoyez notre proposition aux dirigeants chinois."
 SOVw_Third_World_War.7.t: "L'appel soviétique"
 SOVw_Third_World_War.7.a: "La Chine doit rester en dehors de cette guerre."
 SOVw_Third_World_War.7.b: "Préparez-vous à soutenir l'Union soviétique."
 SOVw_Third_World_War.8.d: "La guerre met à rude épreuve les ressources des deux camps. Nos diplomates et nos planificateurs militaires continuent d'évaluer l'équilibre des forces et les perspectives d'un règlement."
 SOVw_Third_World_War.8.a: "Tenez les dirigeants informés."
 SOVw_Third_World_War.9.d: "L'état-major a fait le point sur le déroulement de la campagne. Les théâtres européens nécessaires doivent être acquis avant la date limite si nous voulons négocier en position de force."
 SOVw_Third_World_War.9.a: "Continuez la campagne."
 CWIC_WW3_OBJECTIVES_REGISTERED_TT: "Au moins un théâtre européen a participé à la campagne."
 CWIC_WW3_WASHINGTON_TT: "Le bloc soviétique contrôle Washington, D.C."
 CWIC_WW3_US_DEFEATED_TT: "Les États-Unis ont capitulé face au bloc soviétique, ont été remplacés par un gouvernement aligné sur l'Union soviétique ou n'existent plus."
 CWIC_WW3_STRATEGIC_VALUE_TT: "La valeur stratégique de cet État dépasse 50."
 CWIC_WW3_NEGOTIATED_CEASEFIRE_TT: "Un armistice accepté met fin aux guerres du bloc soviétique contre les opposants enregistrés lors de la Troisième Guerre mondiale. Les gouvernements établis et les transferts territoriaux demeurent ; les occupations inachevées sont restituées. La victoire européenne n'est accordée que si tous les États requis sont sécurisés."
 SOV_WW3_Time_Limit_desc: "Sécurisez tous les États répertoriés ci-dessous avant la date limite d'ouverture de la conférence européenne de paix. Les alliés soviétiques, les sujets et les gouvernements successeurs alignés sur les Soviétiques comptent. Chaque province de chaque État répertorié doit être détenue ; les poches ennemies bloquent toujours l'achèvement.\n\nLe délai initial est de 365 jours. Chaque capitulation qualificative le change une fois, durant cette phase uniquement : France +40 jours ; Italie, Allemagne de l'Ouest, Danemark, Sarre, Autriche, Luxembourg, Finlande, Suède, Norvège, Pays-Bas, Belgique, Yougoslavie et Japon +25 jours ; Andorre +5 jours. Perdre la Pologne, l'Allemagne de l'Est, l'Albanie ou la Yougoslavie au profit des Américains coûte 15 jours.\n\nSi le délai expire, un cessez-le-feu est imposé. La sécurisation des objectifs ouvre automatiquement la conférence lors du prochain contrôle quotidien."
 SOV_Operation_Red_Dusk: "Opération Crépuscule Rouge"
 SOV_Operation_Red_Dusk_desc: "D'ici 765 jours, le bloc soviétique doit contrôler Washington et vaincre les États-Unis. La capitulation américaine face au bloc soviétique, un gouvernement américain aligné sur l'Union soviétique ou l'élimination des États-Unis satisfont à la deuxième exigence. Le succès met fin à la guerre par la victoire soviétique. L'expiration coûte 50 % de stabilité et 50 % de soutien de guerre, puis force un cessez-le-feu."
 SOV_Force_Peace: "Négocier un cessez-le-feu"
 SOV_Force_Peace_desc: "Après plus de sept mois de guerre, proposer un armistice à Washington. Les États-Unis peuvent l'accepter ou le rejeter. L'acceptation met fin aux guerres du bloc soviétique contre les opposants enregistrés pendant la Troisième Guerre mondiale et clôt les délais de campagne. Les gouvernements établis et les transferts territoriaux demeurent ; les occupations inachevées sont restituées. Une victoire européenne nécessite que tous les États requis soient sécurisés."
 SOV_capital_targeted_decision_desc: "Reconnaître la libération de l'objectif de capital fixe indiqué ci-dessous. Le contrôle soviétique et allié compte. Un gouvernement déplaçant sa capitale ne peut pas atteindre cet objectif. Cela réduit l'épuisement dû à la guerre et, si la guerre a duré moins de deux mois, augmente la force de l'armée."
 SOV_States_Strategic_target_decision_desc: "Reconnaître un État stratégiquement précieux contrôlé par le bloc soviétique. Cela réduit l'épuisement de guerre et, si la guerre contre son propriétaire a duré moins de deux mois, augmente la force de l'armée."
 SOV_form_austrian_democratic_republic_desc: "Une fois que les neuf États autrichiens seront sécurisés par le bloc soviétique, établissez la République démocratique autrichienne."
 SOV_yugoslavian_problem_desc: "Faire pression sur une Yougoslavie non affiliée pour qu'elle accepte notre leadership. La Yougoslavie décidera si elle doit se soumettre ou résister."
 SOVw_Third_World_War.1000.t: "Victoire outre-atlantique"
 SOVw_Third_World_War.1000.d: "Washington est aux mains du bloc soviétique et les États-Unis ont été vaincus. L'opération Red Dusk a atteint ses objectifs. Un règlement met fin à la guerre restante avec nos adversaires enregistrés, préservant les gouvernements et les changements territoriaux déjà établis. La longue guerre est terminée."
 SOVw_Third_World_War.1000.a: "Ramenez nos soldats à la maison."
 SOVw_Third_World_War.1010.t: "Le cessez-le-feu forcé"
 SOVw_Third_World_War.1010.d: "Le délai pour la campagne européenne est expiré. Les théâtres nécessaires n'étant toujours pas sécurisés, les dirigeants soviétiques acceptent un cessez-le-feu. Notre bloc met fin à la guerre avec ses opposants enregistrés. Les occupations inachevées reviennent, tandis que les gouvernements et les changements territoriaux déjà établis par la guerre demeurent."
 SOVw_Third_World_War.1010.a: "Les combats doivent cesser."
 SOVw_Third_World_War.1011.t: "Le crépuscule rouge tombe court"
 SOVw_Third_World_War.1011.d: "L'opération Red Dusk n'a pas réussi à assurer la défaite de Washington et des États-Unis avant la date limite. L'Union soviétique épuisée doit désormais accepter un cessez-le-feu. La stabilité et le soutien à la guerre ont fortement chuté. Les gouvernements établis et les changements territoriaux demeurent, mais les occupations inachevées reviennent."
 SOVw_Third_World_War.1011.a: "Mettez fin à l'offensive."
