l_french: 
 KOR_RAID.4.d:0 "Une nation en crise s'est développée depuis que le président sud-coréen, Park Chung Hee, a été assassiné par des commandos nord-coréens. L'attaque, orchestrée par l'unité 124, l'unité commando la plus prisée de Corée du Nord, a réussi à attaquer la Maison Bleue, la résidence présidentielle en Corée du Sud, et à éliminer Park sans laisser de trace. En son absence permanente, le Premier ministre Chung Il-kwon a prêté serment en tant que 7e président de la République de Corée. Les observateurs soulignent que si la Corée du Sud ne parvenait pas à réagir de manière appropriée, elle se retrouverait vulnérable à une éventuelle invasion nord-coréenne."
