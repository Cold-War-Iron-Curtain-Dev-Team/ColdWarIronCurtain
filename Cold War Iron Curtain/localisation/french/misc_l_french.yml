 cambodia.2.d:0 "Le 17 janvier 1968, le nouveau groupe militant communiste, les Khmers rouges, dirigé par le mystérieux Pol Pot, lança une insurrection communiste à l'échelle nationale à travers le Cambodge. Les guérilleros, au nombre de 4 à 5 000 seulement, ont pris une bonne partie du territoire rien que dans la campagne du nord, utilisant la jungle à leur avantage. Le Vietnam a déjà manifesté son soutien aux Khmers rouges, en leur fournissant des armes et un entraînement dispensé par d'autres insurgés. La révolution est survenue après ce que l'on peut seulement considérer comme des années de préparation à l'insurrection."
 Uganda.1.d:0 "Le 30 juillet 1953, le secrétaire d'État aux Colonies Oliver Lyttelton évoquait au passage la possibilité d'unification et de fédération des territoires britanniques de l'Afrique orientale. Cette mention passagère a suscité de vives protestations de la part des ministres du Buganda, déclarant qu'ils estimaient que l'idée d'intégration détruirait leur culture et leur mode de vie. Bien que le gouverneur de l'Ouganda, Sir Andrew Cohen, leur ait assuré qu'aucune décision ne serait prise sans consulter le Buganda, de nombreuses personnalités politiques ont le sentiment que le chat est sorti du sac, et bien d'autres appellent à l'indépendance du Buganda." 
 Uganda.2.d:0 "Alors que la crise du Kebaka continue de s'aggraver en Ouganda, l'administration coloniale britannique a décidé d'exiler le roi Bugandan Mutesa II pour faire taire ses appels contre le projet de fédération d'Afrique de l'Est. Alors que les autorités britanniques espéraient que cela calmerait la situation, il semble avoir l'effet inverse. Sir Cohen, le gouverneur de l'Ouganda voulait qu'un nouveau monarque soit choisi, mais le Buganda refuse de s'y conformer......"
 Uganda.3.d:0 "Après avoir été en exil pendant des mois, Mutesa II est retourné en Ouganda suite à la ratification de l'accord du Buganda modifiant l'accord antérieur de 1900. L'accord a augmenté la représentation africaine locale dans le protectorat ougandais tout en préservant le Buganda en tant que partie intégrante de l'Ouganda."
 cultural_events.4.d:0 "L'écrivain, activiste et anticolonialiste français Jean-Paul Sartre est décédé des suites d'un oedème pulmonaire. Tout au long de sa vie, Sartre s'est concentré sur la notion de liberté humaine et deviendra finalement un intellectuel public après la guerre, appelant activement les écrivains à exprimer leur engagement politique. Sartre a également joué un rôle de premier plan dans la lutte contre la domination française en Algérie et contre le recours à la torture et aux camps de concentration par les Français en Algérie. Plus de cinquante mille Parisiens ont assisté à ses funérailles au cimetière du Montparnasse."
 Uganda.10.d:0 "Le roi Mutesa II du Buganda a fui son pays d'origine, l'Ouganda, pour se réfugier au Royaume-Uni à la suite d'accusations de haute trahison portées par le Premier ministre Milton Obote. Ces accusations font suite à une série de crises politiques, notamment la prise par Obote des pouvoirs présidentiels de l'Ouganda à Mutesa plus tôt cette semaine. L'objection de Mutesa à cette prise de pouvoir aboutit à ce qu'Obote envoie des troupes à la résidence du roi sur Mengo Hill pour lui amener le roi, mort ou vivant. Même si les gardes du corps du roi et les loyalistes combattirent vaillamment sur la colline et dans les rues, ils furent dépassés par les soldats les mieux armés. À la fin de la bataille, le palais fut incendié et le roi échappa de peu lors d'un orage soudain."
 Uganda.11.d:0 "De nouveaux troubles ont éclaté aujourd'hui en Ouganda lorsque le Premier ministre Milton Obote a annoncé un référendum sur le statut de deux comtés et sur la question de savoir s'ils devaient ou non rester partie du Royaume du Buganda, être renvoyés au Royaume de Bunyoro ou créer un nouveau district. Le Royaume du Buganda considère ce référendum comme une atteinte directe à son autonomie. Le roi du Buganda étant le président cérémonial de l'Ouganda, d'autres troubles pourraient bientôt survenir pour cette petite nation africaine."
 Uganda.12.d:0 "Le Premier ministre Milton Obote a été exécuté par le roi Mutesa II du Buganda pour haute trahison contre le roi du Buganda, suite à ses propres accusations selon lesquelles le roi lui-même avait commis une haute trahison. Ces accusations font suite à une série de crises politiques, notamment la prise par Obote des pouvoirs présidentiels de l'Ouganda à Mutesa plus tôt cette semaine. L'objection de Mutesa à cette prise de pouvoir aboutit à ce qu'Obote envoie des troupes à la résidence du roi sur Mengo Hill pour lui amener le roi, mort ou vivant. Bien que les soldats d'Obote fussent bien mieux armés que les gardes du corps du roi et les loyalistes hétéroclites combattant de rue en rue, leurs tactiques de guérilla et leur refus de se rendre aboutirent à l'effondrement de l'offensive rebelle. Le honteux Premier ministre a été retrouvé en train d'essayer de s'échapper de la capitale dans le coffre d'une voiture et a été immédiatement amené devant le roi pour que justice soit rendue pour ses crimes."
 KPA_RAID.4.d:0 "La guerre est de nouveau revenue dans la péninsule coréenne, le gouvernement sud-coréen ayant officiellement annoncé la cessation de l'accord d'armistice, une déclaration de guerre informelle. Cela s'est produit quelques jours seulement après l'assassinat réussi du dirigeant sud-coréen Park Chung Hee par l'unité 124, l'unité commando la plus prisée de Corée du Nord. Les États-Unis d'Amérique, principal allié de la Corée du Sud, n'ont pas encore répondu officiellement à la déclaration de guerre, mais des rapports circulent selon lesquels la garnison américaine stationnée dans la zone métropolitaine de Séoul a déjà quitté les environs, se préparant à renforcer la zone démilitarisée qui a déjà connu un nombre important d'escarmouches jamais vues depuis la guerre de Corée. Le président Chung Il-kwon et son cabinet ont déjà évacué la zone vers un lieu tenu secret, les habitants de Séoul, d'Inchon et d'autres grandes villes de la région s'évacuant eux-mêmes vers les provinces du sud de la République. Les principaux alliés de la Corée du Nord, l'Union soviétique et la République populaire de Chine, n'ont pas encore réagi, mais les observateurs prédisent que la Chine sera probablement celle qui réagira le plus et le plus rapidement, l'Union soviétique intervenant en dernier recours si cela s'avère nécessaire."
 KPA_RAID_ALT.4.d:0 "La guerre est de nouveau revenue dans la péninsule coréenne, le gouvernement nord-coréen ayant officiellement annoncé la cessation de l'accord d'armistice, une déclaration de guerre informelle. Déjà, des milliers de soldats de la KPA ont été déployés dans la zone démilitarisée et des agents dormants de la Corée du Nord ont été activés, sabotant la capacité de la Corée du Sud à mettre en place une réponse appropriée. C'était le résultat d'une tentative d'assassinat réussie contre le président Park Chung Hee orchestrée par l'unité 124, le commando d'élite de la Corée du Nord. Constatant leur incapacité à protéger la DMZ et ses provinces environnantes, la garnison américaine à Séoul a déjà évacué et pris des positions défensives à Busan et Jeju, mettant ainsi en danger des millions de citoyens sud-coréens face à la Corée du Nord. Même si les principaux alliés de la Corée du Nord, l'Union soviétique et la République populaire de Chine, n'ont pas encore réagi, il est fort probable que la Chine mobilisera ses troupes pour aider leur allié communiste à renforcer son influence en Asie, les Soviétiques intervenant si nécessaire."
 KPA_RAID.5.d:0 "La Corée du Nord a annoncé la mort de son dirigeant Kim Il-Sung. Cela est surprenant pour cette nation isolée, et encore plus surprenant est que le dirigeant nord-coréen soit mort de blessures par balle dans ce qu'ils prétendent être un assassinat sud-coréen. On pense que cet assassinat constitue une mesure de représailles de la Corée du Sud à la tentative d'assassinat de la Corée du Nord contre Park Chung Hee, le dirigeant sud-coréen. Selon des sources sud-coréennes, l'unité 684 des forces spéciales de l'armée de l'air a mené l'attaque. Une telle attaque est sans précédent dans la péninsule coréenne, et les observateurs prédisent qu'un conflit militaire majeur éclatera bientôt."
 KPA_RAID.2:0 "Le désastre et l'embarras ont frappé la Corée du Sud aujourd'hui alors que l'Agence centrale de presse coréenne, le bras de propagande de la Corée du Nord, ainsi que des sources internes ont rapporté que la Corée du Sud n'avait pas réussi à assassiner Kim Il-Sung de Corée du Nord en représailles aux tentatives de la Corée du Nord d'assassiner la présidente sud-coréenne Park Chung Hee. L'unité des forces spéciales chargée de cette tâche, l'unité 684 de l'armée de l'air de la République de Corée, fait désormais face à des accusations criminelles en Corée du Nord, certains experts affirmant qu'il ne s'agit que d'un procès simulé, et qu'il se terminera inévitablement soit par leur exécution, soit par la torture pour obtenir des informations. En réponse, la KCNA a déclaré que la Corée du Nord utiliserait toutes les méthodes disponibles pour « détruire l'Amérique et son État fantoche sud-coréen, et libérer le peuple coréen de son jaune d'oeuf ». Quelques heures seulement après la publication du rapport, la garnison américaine de Séoul est mise en état d'alerte maximale, Washington envisageant d'augmenter considérablement les forces de la garnison face à un potentiel conflit militaire à grande échelle dans la péninsule."
 dmz_conflict.100.d:0 "Depuis la signature de l'accord d'armistice, la Corée du Nord et la Corée du Sud sont censées connaître une période de paix, sans conflit qui aurait autrement fait couler encore plus de sang dans une région remplie de mort et de destruction depuis le début du 20e siècle. Cependant, c'est loin d'être la vérité. Depuis l'accord d'armistice, des escarmouches occasionnelles aux frontières sévissent dans toute la DMZ, où les soldats de l'Armée populaire coréenne et de l'armée de la République de Corée, ainsi que la garnison américaine stationnée là-bas, s'attaquent souvent, avec des résultats peu concluants. Cela montre indirectement les défauts de l'accord d'armistice, dans la mesure où il ne fait que créer une paix temporaire et symbolique dans la péninsule coréenne."
 dmz_conflict.101.d:0 "Cela fait plus de 4 ans que les escarmouches frontalières et les incursions occasionnelles ont commencé dans la péninsule coréenne, les deux parties tentant de gagner du territoire et de repousser leurs frontières au-delà de la zone démilitarisée pour obtenir un avantage stratégique contre la partie adverse. En raison des attaques et contre-attaques infructueuses menées par les deux Corées, les observateurs en déduisent que le conflit dans la zone démilitarisée s'est effectivement terminé avec un résultat peu concluant, car les deux parties ont toujours leurs frontières par le 38e parallèle. Bien qu'il s'agisse d'un résultat qu'aucune des parties ne voudrait accepter, la diminution de la fréquence des escarmouches frontalières a prouvé que les deux parties se sont retirées et ont perdu tout intérêt à poursuivre le conflit et à se concentrer sur leurs problèmes internes qui tourmentent leurs nations respectives, ramenant effectivement une paix temporaire dans la péninsule."
 dmz_conflict.102.d:0 "Cela fait plus de 4 ans que les escarmouches frontalières et les incursions occasionnelles ont commencé dans la péninsule coréenne, les deux parties tentant de gagner du territoire et de repousser leurs frontières au-delà de la zone démilitarisée pour obtenir un avantage stratégique contre la partie adverse. Grâce au recours massif à la guérilla par le Nord et à ses succès avérés contre la Corée du Sud soutenue par les États-Unis, la Corée du Nord a sans aucun doute gagné le conflit dans la zone démilitarisée, les observateurs étant d'accord avec cette déclaration. Cependant, les mêmes observateurs qualifient une telle victoire de sans précédent et estiment que la Corée du Nord pourrait tenter sa chance et potentiellement provoquer un conflit militaire à grande échelle contre la Corée du Sud."
 dmz_conflict.103.d:0 "La guerre est de nouveau revenue dans la péninsule coréenne, le gouvernement nord-coréen ayant officiellement annoncé la cessation de l'accord d'armistice, une déclaration de guerre informelle. Déjà, des milliers de soldats de la KPA ont été déployés dans la zone démilitarisée et des agents dormants de la Corée du Nord ont été activés, sabotant la capacité de la Corée du Sud à mettre en place une réponse appropriée. Cela était le résultat des incursions réussies de la Corée du Nord sur le territoire de son voisin du sud, atteignant les limites de la ville de Séoul. Constatant leur incapacité à protéger la DMZ et ses provinces environnantes, la garnison américaine à Séoul a déjà évacué et pris des positions défensives à Busan et Jeju, mettant ainsi en danger des millions de citoyens sud-coréens face à la Corée du Nord. Même si les principaux alliés de la Corée du Nord, l'Union soviétique et la République populaire de Chine, n'ont pas encore réagi, il est fort probable que la Chine mobilisera ses troupes pour aider leur allié communiste à renforcer son influence en Asie, les Soviétiques intervenant si nécessaire."