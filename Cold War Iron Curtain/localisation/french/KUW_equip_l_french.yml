 KUW_fighter_equipment_0:0 "Force aérienne du Koweït"
 KUW_fighter_equipment_0_short:0 "KAF"
 KUW_fighter_equipment_0_desc:0 "L'armée de l'air koweïtienne a été fondée en 1953 par le maréchal Cheikh Abdullah Moubarak Al-Sabah lorsque la Direction des forces de sécurité publique s'est séparée de l'armée koweïtienne. La Force aérienne du Koweït est la branche aérienne des forces armées du Koweït. Le quartier général de l'armée de l'air est situé sur la base aérienne Abdullah Al-Moubarak, le reste des forces étant stationné dans les brigades de défense aérienne."

