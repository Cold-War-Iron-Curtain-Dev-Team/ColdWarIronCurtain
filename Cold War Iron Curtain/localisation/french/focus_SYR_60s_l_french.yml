l_french: 
SYR_stateoftheeconomy:0 "État de l'économie"
SYR_stateoftheeconomy_desc:0 ""
SYR_headwaterdiversionplan:0 "Plan de dérivation des eaux d'amont"
SYR_headwaterdiversionplan_desc:0 ""
SYR_purgeconspirators:0 "Purger les conspirateurs"
SYR_purgeconspirators_desc:0 "Même si nous avons pris le pouvoir grâce à un coup d'État, cela ne veut pas dire que nous en sommes à l'abri. Il est temps de prendre des mesures préventives."
SYR_thepeopleswaragainstzionism:0 "La guerre populaire contre le sionisme"
SYR_thepeopleswaragainstzionism_desc:0 "Ce ne sont pas seulement les forces armées, mais aussi le peuple syrien qui doivent se préparer à la guerre contre le sionisme."
SYR_denouncethereactionaries:0 "Dénoncer les réactionnaires"
SYR_denouncethereactionaries_desc:0 "Les monarchies arabes sont des marionnettes molles pour l'Occident impérialiste. Nous ne voyons pas la nécessité d'être gentils avec eux."
SYR_canceltheunification:0 "Annuler l'unification"
SYR_canceltheunification_desc:0 "À la réflexion, comment pouvons-nous faire confiance à l'Égypte pour ne pas nous marginaliser à nouveau ? Nous sommes meilleurs par nous-mêmes."
SYR_harderstanceagainstisrael:0 "Une position plus dure contre Israël"
SYR_harderstanceagainstisrael_desc:0 "Il est de notre devoir de maintenir les hostilités contre Israël en solidarité avec nos frères palestiniens."
SYR_secondbaathcoup:0 "Deuxième coup d'État Baas"
SYR_secondbaathcoup_desc:0 "La vieille garde est incapable de diriger le pays selon sa vieille pensée. Nous allons prendre le relais maintenant."
SYR_startunificationplanning:0 "Démarrer la planification de l'unification"
SYR_startunificationplanning_desc:0 "Les discussions avec l'Égypte et l'Irak étant terminées, nous nous préparons désormais à l'unification."
SYR_attempttoformtheunitedarabrepublic:0 "Tentative de formation de la République arabe unie"
SYR_attempttoformtheunitedarabrepublic_desc:0 "Nous formerons à nouveau la République Arabe Unie. Il n'y aura plus de sécessionnistes cette fois."
SYR_conductunificationtalkswithegypt:0 "Mener des pourparlers d'unification avec l'Égypte"
SYR_conductunificationtalkswithegypt_desc:0 "Nous avons abandonné avec regret la précédente tentative d'unification, mais peut-être pourrions-nous réessayer ?"
SYR_discussunificationwithiraq:0 "Discuter de l'unification avec l'Irak"
SYR_discussunificationwithiraq_desc:0 "L'Irak a manifesté son intérêt à rejoindre la RAU. Nous discuterons davantage avec eux à ce sujet."
SYR_purgethenasserists:0 "Purger les nasséristes"
SYR_purgethenasserists_desc:0 "Purger le chien de Nasser devrait être une mesure de précaution. Il n'aura aucun pouvoir ici."
SYR_8thofmarchrevolution:0 "révolution du 8 mars"
SYR_8thofmarchrevolution_desc:0 "Notre gouvernement actuel s'est révélé incompétent et incapable de répondre aux attentes du peuple syrien. Il est temps de changer cela par la force."
SYR_nationalcouncilfortherevolutionarycommand:0 "Conseil national du commandement révolutionnaire"
SYR_nationalcouncilfortherevolutionarycommand_desc:0 "Au lendemain de la Révolution du 8 mars, nous formerons un organe directeur qui représentera mieux la Syrie."
SYR_strengthenourrule:0 "Renforcer notre règle"
SYR_strengthenourrule_desc:0 "Notre victoire contre le régime sioniste a fait de nous des héros nationaux. L'opposition à notre régime est réduite au silence dans la honte."
SYR_enforcetheheadwaterdiversionplan:0 "Appliquer le plan de détournement des eaux d'amont"
SYR_enforcetheheadwaterdiversionplan_desc:0 "Avec cette victoire, nous avons réduit au silence les protestations des sionistes contre notre projet de détournement des eaux. Nous ferons ce que nous voulons pendant qu'ils regardent, impuissants."
SYR_reviewingthearmedforces:0 "Revoir les forces armées"
SYR_reviewingthearmedforces_desc:0 "À l'aube d'une nouvelle décennie, nos forces armées doivent se préparer aux conflits à venir."
SYR_politicisedmilitary:0 "Militaire politisé"
SYR_politicisedmilitary_desc:0 "En gardant l'armée fidèle au parti, nous garantirons la marginalisation de l'opposition qui pourrait l'utiliser contre nous."
SYR_newgenerationofofficers:0 "Nouvelle génération d'officiers"
SYR_newgenerationofofficers_desc:0 "De nouveaux officiers et de nouveaux talents ouvriront la voie aux réformes militaires."
SYR_reviewingthearmy:0 "Revoir l'armée"
SYR_reviewingthearmy_desc:0 "Il est désormais temps de revoir l'armée."
SYR_reviewingtheairforce:0 "Revue de l'Armée de l'Air"
SYR_reviewingtheairforce_desc:0 "Il est désormais temps de revoir l'Armée de l'Air."
SYR_sovietaircraftpurchases:0 "Achats d'avions soviétiques"
SYR_sovietaircraftpurchases_desc:0 "L'achat des avions les plus récents sur le marché nous maintiendra en bonne forme."
SYR_reviewingthenavy:0 "Revoir la Marine"
SYR_reviewingthenavy_desc:0 "Il est désormais temps de revoir la Marine."
SYR_spanishpanzers:0 "Panzers espagnols"
SYR_spanishpanzers_desc:0 "Parmi nos derniers achats militaires figurent les Panzer IV. Peut-être que cela effraiera les sionistes lorsqu'ils verront le passé les hanter ?"
SYR_sovietinstructors:0 "Instructeurs soviétiques"
SYR_sovietinstructors_desc:0 "Avoir des pilotes soviétiques pour former nos propres pilotes contribuera à accroître les compétences de l'armée de l'air."
SYR_dockyardupgrades:0 "Améliorations de la base navale"
SYR_dockyardupgrades_desc:0 "La modernisation de nos bases navales nous permettra d'améliorer nos capacités navales."
SYR_strenghenthemukhabarat:0 "Renforcer le Mukhabarat"
SYR_strenghenthemukhabarat_desc:0 "Notre renseignement militaire ne peut être négligé alors que nos ennemis complotent contre nous."
SYR_kgbassistance:0 "Assistance du KGB"
SYR_kgbassistance_desc:0 "Les agents soviétiques du KGB ont quelques tours dans leur sac à nous enseigner. Nous en tirerons des leçons approfondies."
SYR_studysovietdesigns:0 "Étudier les conceptions soviétiques"
SYR_studysovietdesigns_desc:0 "L'étude de la conception des navires soviétiques nous aidera dans la conception de nos navires."
SYR_rootoutzionistspies:0 "Éliminer les espions sionistes"
SYR_rootoutzionistspies_desc:0 "Les sionistes ont peut-être le nez trop près de nous. Qu'est-ce que c'est? Des signaux inhabituels provenant de l'appartement de Thaabet ?"
SYR_surveillancewithinthecountry:0 "Surveillance à l'intérieur du pays"
SYR_surveillancewithinthecountry_desc:0 "Un gouvernement bienveillant comme le nôtre veille à ce que les gens soient bons et ne se contentent pas de bien agir."
SYR_sovietalignment:0 "Alignement soviétique"
SYR_sovietalignment_desc:0 "L'Union soviétique est un allié naturel contre l'impérialisme sioniste. Nous devons renforcer les liens bilatéraux."
SYR_strengthenthebaathparty:0 "Renforcer le parti Baas"
SYR_strengthenthebaathparty_desc:0 "Affirmer la position du parti Baas au-dessus des autres est crucial pour la survie de l'État."
SYR_1964arableaguesummit:0 "Sommet de la Ligue arabe de 1964"
SYR_1964arableaguesummit_desc:0 ""
SYR_studycapturedisraeliweapons:0 "Étude sur les armes israéliennes capturées"
SYR_studycapturedisraeliweapons_desc:0 "Après notre victoire, les sionistes se sont retirés précipitamment car ils avaient oublié une partie de leur équipement. Nous devons bien sûr les étudier, tout en témoignant notre gratitude à notre allié soviétique en envoyant également quelques échantillons."
SYR_assadjadidpowerstruggle:0 "Lutte pour le pouvoir Assad-Jadid"
SYR_assadjadidpowerstruggle_desc:0 "Les divergences entre le secrétaire régional adjoint du parti Baas, Salah Jadid, et le ministre de la Défense Hafez al-Assad sont devenues visibles, les divergences devenant de plus en plus irréconciliables. Dieu seul sait qui gagnera cette lutte."
SYR_jadidvictory:0 "Victoire de Jadid"
SYR_jadidvictory_desc:0 "Le secrétaire régional adjoint du parti Baas, Salah Jadid, a réussi à réprimer la tentative de coup d'État d'Assad, garantissant que la Syrie continue sur sa ligne de gauche dure."
SYR_assadvictory:0 "Victoire d'Assad"
SYR_assadvictory_desc:0 "Le ministre de la Défense Hafez al-Assad et ses modérés ont pris le dessus, poussant la politique syrienne vers une politique pragmatique."
SYR_alliancewiththesyriancommunistparty:0 "Alliance avec le Parti communiste syrien"
SYR_alliancewiththesyriancommunistparty_desc:0 "En formant un partenariat avec le Parti communiste, nous indiquons notre engagement envers le socialisme."
SYR_correctivemovement:0 "Mouvement correctif"
SYR_correctivemovement_desc:0 "Avec le Mouvement Correctif, il est temps de réparer les torts causés par Jadid et ses radicaux."
SYR_purgemilitaryfactionalism:0 "Purger le factionnalisme militaire"
SYR_purgemilitaryfactionalism_desc:0 "L'armée est une épine depuis trop longtemps. Une nouvelle purge les gardera sous contrôle."
SYR_requesttojointhewarsawpact:0 "Demander un traité de défense syro-soviétique"
SYR_requesttojointhewarsawpact_desc:0 "Nous pensons que notre avenir réside dans nos amis de Moscou. Nous devons voir s'ils peuvent s'entendre sur un traité de défense mutuelle."
SYR_nonalignment:0 "Non-alignement"
SYR_nonalignment_desc:0 "En acceptant le non-alignement, nous nous protégeons non seulement du conflit plus vaste entre l'Est et l'Ouest, mais nous nous unissons également à ceux qui souhaitent la même chose."
SYR_reaffirmsovietties:0 "Réaffirmer les liens soviétiques"
SYR_reaffirmsovietties_desc:0 "La destitution du fidèle allié pro-soviétique qu'était Jadid a suscité certaines inquiétudes. Rassurez-vous, nous sommes toujours amis."
SYR_inviteaflaqites:0 "Inviter des Aflaqites"
SYR_inviteaflaqites_desc:0 "En invitant les anciens Aflaqites qui ont fui en Irak, nous pouvons dégeler partiellement les relations avec les anciens Baasistes."
SYR_diplomaticmissiontochina:0 "Mission diplomatique en Chine"
SYR_diplomaticmissiontochina_desc:0 "L'envoi d'une mission en Chine affirme non seulement notre indépendance, mais aussi un message à l'Union soviétique selon lequel nous pouvons choisir avec qui nous lier d'amitié. Ils ne peuvent pas se permettre de nous perdre maintenant."
SYR_civiliancontrolofthemilitary:0 "Contrôle civil des militaires"
SYR_civiliancontrolofthemilitary_desc:0 "Placer un contrôle civil mettra fin à l'ingérence militaire dans la politique."
SYR_arabdefeat:0 "Défaite arabe"
SYR_arabdefeat_desc:0 "L'agression sioniste de 1967 a entraîné la destruction des forces armées arabes syriennes et l'occupation du plateau du Golan."
SYR_arabvictory:0 "Victoire arabe"
SYR_arabvictory_desc:0 "L'agression sioniste de 1967 a entraîné la destruction de leur soi-disant « Force de défense » et leur a causé une humiliation."
SYR_sixdaywar:0 "Guerre de 1967"
SYR_sixdaywar_desc:0 "À 8h45, l'aviation sioniste a porté un coup soudain aux stations radar égyptiennes, à l'appareil de défense aérienne et aux bases aériennes, provoquant une paralysie complète des télécommunications entre les dirigeants égyptiens et leurs forces. En quatre heures, l'avion israélien a détruit environ 85 % des avions égyptiens au sol."
SYR_requestemergencyarmssupply:0 "Demander un approvisionnement d'urgence en armes"
SYR_requestemergencyarmssupply_desc:0 "Au cours de la guerre, nous avons contacté l'Union soviétique pour qu'elle nous fournisse des armes afin de compenser nos pertes."
SYR_governmentmarketingorganisations:0 "Organisations gouvernementales de marketing"
SYR_governmentmarketingorganisations_desc:0 "Le gouvernement prendra officiellement en charge la vente des produits selon les principes du socialisme arabe."
SYR_commercialbankofsyria:0 "Banque commerciale de Syrie"
SYR_commercialbankofsyria_desc:0 "L'économie syrienne a besoin d'une banque commerciale contrôlée par le gouvernement contre les banques privées."
SYR_upgradethepowergrid:0 "Améliorer notre réseau électrique national"
SYR_upgradethepowergrid_desc:0 "Pour répondre à la nouvelle demande industrielle et domestique en électricité, il faudra investir dans notre réseau électrique."
SYR_tabqadam:0 "Barrage de Tabqa"
SYR_tabqadam_desc:0 "En construisant un barrage sur l'Euphrate, nous pouvons exploiter le potentiel du fleuve en matière d'électricité et d'agriculture."
SYR_rumailiaoilfield:0 "Champ pétrolifère de Rumailia"
SYR_rumailiaoilfield_desc:0 "La dernière décennie, nous avons découvert un autre gisement de pétrole près de Karatchok. Il est temps que nous exploitions cela aussi."
SYR_socialistlandreforms:0 "Réformes agraires socialistes"
SYR_socialistlandreforms_desc:0 "Notre économie stagne parce que la terre est toujours gouvernée par des élites féodales. Il est temps de changer cette pratique par la force."
SYR_nationalisationofindustries:0 "Nationalisation des industries"
SYR_nationalisationofindustries_desc:0 "Le gouvernement nationalisera les industries privées pour représenter les intérêts du peuple syrien."
SYR_militaryindustrialallocation:0 "Allocation militaro-industrielle"
SYR_militaryindustrialallocation_desc:0 "À l'approche de la guerre, nous préparerons des usines pour approvisionner nos militaires."
SYR_easternbloctrade:0 "Commerce avec le bloc de l'Est"
SYR_easternbloctrade_desc:0 "Le commerce avec l'Union soviétique et ses satellites nous sera grandement bénéfique."
SYR_egalitarianworkplace:0 "Milieu de travail égalitaire"
SYR_egalitarianworkplace_desc:0 "L'égalité des sexes améliore non seulement la société, mais contribue également à renforcer notre main-d'oeuvre nationale."
SYR_generalfederationoftradeunions:0 "Fédération générale des syndicats"
SYR_generalfederationoftradeunions_desc:0 "En reliant tous les syndicats au sein de la Fédération générale des syndicats, nous représenterons les travailleurs en leur nom."
SYR_implementhealthcarefoundations:0 "Mettre en oeuvre les fondations des soins de santé"
SYR_implementhealthcarefoundations_desc:0 "En transition d'une économie féodale, les réformes nationales des soins de santé sont la marque d'une économie moderne."
SYR_ministryofhighereducation:0 "Ministère de l'Enseignement Supérieur"
SYR_ministryofhighereducation_desc:0 "En créant un organisme pour l'enseignement supérieur, nous garantissons que nous aurons les Syriens les plus intelligents pour travailler pour nous."
SYR_triumphatdamascus:0 "Triomphe à Damas"
SYR_triumphatdamascus_desc:0 "Pour marquer notre victoire contre le régime sioniste, nous organiserons un défilé à Damas. Le monde verra notre triomphe !"
SYR_shifttheblame:0 "Unissez nos gens"
SYR_shifttheblame_desc:0 "Notre échec dans le conflit a mis en évidence une chose : le manque d'unité au sein du peuple syrien. Nous devons maintenant rallier le peuple dans un seul but. La libération du plateau du Golan."
SYR_syrianscientificstudiesandresearchcenter:0 "Centre syrien d'études et de recherches scientifiques"
SYR_syrianscientificstudiesandresearchcenter_desc:0 "Cette institution contribuera grandement au progrès du pays en coordonnant nos scientifiques."
SYR_bitterlessons:0 "Leçons amères"
SYR_bitterlessons_desc:0 "Notre défaite a été un signal d'alarme. Nous devons prendre ces leçons à coeur."
SYR_syrianarabnewsagency:0 "Agence de presse arabe syrienne"
SYR_syrianarabnewsagency_desc:0 "La création de SANA consolidera le flux d'informations à l'intérieur du pays."
SYR_trainingineastgermany:0 "Formation en Allemagne de l'Est"
SYR_trainingineastgermany_desc:0 "En envoyant nos officiers se former en Allemagne de l'Est, leurs compétences dans ce domaine s'amélioreront."
SYR_mendthefences:0 "Réparer les clôtures"
SYR_mendthefences_desc:0 "La position de Jadid envers les autres États arabes ne nous a pas été bénéfique. Nous commencerons à renouer les liens, notamment dans le Golfe."
SYR_nationalprogressivefront:0 "Front national progressiste"
SYR_nationalprogressivefront_desc:0 "Une alliance politique avec d'autres partis non seulement contrôle l'opposition, mais donne également l'image d'un front uni contre l'impérialisme occidental."
SYR_rejuvenatetheprivatesector:0 "Rajeunir le secteur privé"
SYR_rejuvenatetheprivatesector_desc:0 "Donner de la vigueur au secteur privé permettra de surmonter les dégâts causés par la politique socialiste de Jadid."
SYR_religiousrevival:0 "Renouveau religieux"
SYR_religiousrevival_desc:0 "En réintroduisant la religion dans la vie publique plus large, nous nous présentons comme leurs protecteurs."
SYR_updatingournavaldoctrine:0 "Actualiser notre doctrine navale"
SYR_updatingournavaldoctrine_desc:0 "Notre doctrine navale doit être maintenue à jour."
SYR_thepuppetpresident:0 "Le président fantoche"
SYR_thepuppetpresident_desc:0 "Qui surveille Jadid pendant qu'il surveille al-Attasi ?"
SYR_modernsovietequipment:0 "Équipement soviétique moderne"
SYR_modernsovietequipment_desc:0 "Les derniers achats nous tiendront au coude à coude avec nos voisins."
SYR_airbaseupgrades:0 "Améliorations de la base aérienne"
SYR_airbaseupgrades_desc:0 "Notre base aérienne devra rattraper son retard pour maintenir nos nouveaux avions en état de marche."
SYR_upgradelatakianavalbase:0 "Améliorer la base navale de Lattaquié"
SYR_upgradelatakianavalbase_desc:0 "L'installation navale de Lattaquié sera maintenue à jour pour répondre aux besoins de notre Marine."
SYR_radarinstallations:0 "Installations de radars"
SYR_radarinstallations_desc:0 "Le radar est essentiel pour suivre ce que nos ennemis pourraient faire."
SYR_airdefencecapabilities:0 "Capacités de défense aérienne"
SYR_airdefencecapabilities_desc:0 "Pour maintenir la supériorité aérienne, notre défense aérienne doit être préparée."
SYR_resettlegolanirefugees:0 "Réinstaller les réfugiés Golani"
SYR_resettlegolanirefugees_desc:0 "La perte du Golan a conduit nos citoyens à fuir les combats et, plus tard, l'occupation sioniste. Nous devrons aider à les réinstaller."
SYR_blackseptember:0 "Septembre noir"
SYR_blackseptember_desc:0 ""
SYR_entrenchrifdimashq:0 "Retranchement du Rif Dimashq"
SYR_entrenchrifdimashq_desc:0 "Les sionistes ont pris nos terres, et il est logique qu'ils aillent plus loin dans leur accaparement de terres. Nous devons nous fortifier immédiatement."
SYR_alawitesecurityapparatus:0 "Appareil de sécurité alaouite"
SYR_alawitesecurityapparatus_desc:0 "À première vue, à qui ferez-vous confiance ? Famille? Clan? Ou des coreligionnaires pour fabriquer votre appareil de sécurité ?"
SYR_cutfoodprices:0 "Réduire les prix des denrées alimentaires"
SYR_cutfoodprices_desc:0 "Nous pouvons apaiser les troubles publics en fournissant des produits de première nécessité. Mais en baissant les prix des denrées alimentaires, les gens seront moins susceptibles de déclencher des émeutes."
SYR_loosentraderestrictionswithlebanon:0 "Assouplir les restrictions commerciales avec le Liban"
SYR_loosentraderestrictionswithlebanon_desc:0 "La perte des échanges commerciaux avec le Liban aidera notre économie à se redresser plus rapidement."
SYR_gainindustrialknowledge:0 "Acquérir des connaissances industrielles"
SYR_gainindustrialknowledge_desc:0 "Il y a beaucoup plus à apprendre pour améliorer nos industries."
SYR_armtheplo:0 "Armer l'OLP"
SYR_armtheplo_desc:0 "A quoi servent les militants sans armes ? Nous fournirons notre ancien stock comme base de leur approvisionnement."
SYR_intervenefortheplo:0 "Intervenir pour l'OLP"
SYR_intervenefortheplo_desc:0 "Alors que l'OLP combat les Jordaniens, une intervention pourrait finalement nous apporter certains avantages."
SYR_aligntheplotosyria:0 "Aligner l'OLP sur la Syrie"
SYR_aligntheplotosyria_desc:0 "L'OLP nous doit beaucoup si nous pouvons lui imposer notre volonté. Ils seront soumis à nos caprices."
SYR_refusetointervene:0 "Refuser d'intervenir"
SYR_refusetointervene_desc:0 "La guerre entre l'OLP et la Jordanie n'est pas une guerre dans laquelle nous devons intervenir en premier lieu. Nous n'y gaspillerons pas notre propre sang."
SYR_reachouttoarabsocialiststates:0 "Tendre la main aux États arabes socialistes"
SYR_reachouttoarabsocialiststates_desc:0 "Les alliances avec d'autres États socialistes arabes constituent un objectif naturel à poursuivre."
SYR_enforcesecularism:0 "Appliquer la laïcité"
SYR_enforcesecularism_desc:0 "En éloignant la religion de la politique, nous préservons le principe laïc du socialisme arabe."
SYR_publicworksinvestment:0 "Investissement dans les travaux publics"
SYR_publicworksinvestment_desc:0 "Les investissements dans les infrastructures détourneront l'attention du public."
SYR_geartowardsautarky:0 "Vers l'autarcie"
SYR_geartowardsautarky_desc:0 "Une économie ouverte nous rend vulnérables aux attaques économiques. L'isolement et l'autonomie nous serviront mieux."
SYR_snubchina:0 "Snober la Chine"
SYR_snubchina_desc:0 "En ignorant la Chine, nous montrons à l'Union soviétique que nous sommes son allié le plus fidèle."
SYR_agriculturalmanagement:0 "Gestion agricole"
SYR_agriculturalmanagement_desc:0 "Le modèle agricole soviétique est un modèle vers lequel nous devons lutter. Suivons leurs traces."
SYR_sovietorbit:0 "Orbite soviétique"
SYR_sovietorbit_desc:0 "En suivant de près l'Union soviétique, nous leur assurons où se situent nos allégeances."
SYR_trainploofficers:0 "Former les officiers de l'OLP"
SYR_trainploofficers_desc:0 "L'OLP a fait ses preuves au combat. Ceci peut être consolidé par la formation de leurs agents."
SYR_sovietmilitaryoverhaul:0 "Révision militaire soviétique"
SYR_sovietmilitaryoverhaul_desc:0 "Nous avons pris conscience du fait que nous avons besoin d'un soutien supplémentaire de la part des Soviétiques pour réformer notre armée."
SYR_sovietdivisions:0 "Divisions soviétiques"
SYR_sovietdivisions_desc:0 "La réorganisation de nos forces selon le modèle soviétique nous donnera la force nécessaire à la guerre moderne."
SYR_sovietdoctrines:0 "Doctrines soviétiques"
SYR_sovietdoctrines_desc:0 "En mettant en oeuvre les doctrines militaires soviétiques, nous pouvons améliorer nos capacités tactiques."
SYR_newsyrianarmy:0 "Nouvelle armée syrienne"
SYR_newsyrianarmy_desc:0 "Notre armée est prête. Nous sommes l'armée arabe syrienne."
