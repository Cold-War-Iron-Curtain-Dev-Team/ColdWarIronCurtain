 KPA_Korean_Communism:0 "Communisme coréen"
 KPA_Korean_Communism_desc:0 "Notre type de communisme est basé sur la base, comme le voit Kim Il-Sung, notre chef et ancien chef du gouvernement provisoire nord-coréen. Les idées de notre leader nous renforcent."
