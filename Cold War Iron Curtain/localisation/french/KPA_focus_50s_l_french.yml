 KPA_Comrade_Pak_Hon_Yong:0 "Camarade Pak Hon Yong"
 KPA_Comrade_Kim_Won_Bong:0 "Camarade Kim Won Bong"
 KPA_Democratic_Revolution:0 "Révolution démocratique"
 KPA_Organize_Local_Elections:0 "Organiser des élections locales"
 KPA_Empower_the_Korean_National_Revolutionary_Party:0 "Donner du pouvoir au Parti révolutionnaire national coréen"
 KPA_Reach_out_to_the_Americans:0 "Tendez la main aux Américains"
 KPA_Amity_with_the_Soviets:0 "Amitié avec les Soviétiques"
 KPA_Open_the_Border:0 "Ouvrez la frontière"
 KPA_Empower_the_Guerilas:0 "Donnez du pouvoir aux guérilleros"
 KPA_Empower_the_Guerilas_desc:0 "Nous devons travailler avec ceux qui se sont battus pour donner à la Corée son indépendance du Japon."
 KPA_Initiate_the_Kim_Cult:0 "Initier le culte de Kim"
 KPA_Initiate_the_Kim_Cult_desc:0 "Il faut enseigner que Kim Il-Sung est le père de notre nation, le guérillero bien-aimé contre les Japonais et le Soleil de notre pays."
 KPA_Juche:0 "Juché"
 KPA_Independent_Korea:0 "Corée indépendante"
 KPA_Begin_Purges:0 "Commencer les purges"
 KPA_Oust_the_Southerners:0 "Éliminer les sudistes"
 KPA_Oust_the_Soviets:0 "Éliminer les Soviétiques"
 KPA_Songun:0 "Songun"
 KPA_Songun_desc:0 "L'armée doit être la première dans notre État car elle est l'avant-garde du communisme."
 KPA_Korean_Peoples_Army:0 "Armée populaire coréenne"
 KPA_Korean_Peoples_Army_desc:0 "Nous devons établir une nouvelle armée qui représente le peuple."
 KPA_Oust_the_Pro_Chinese:0 "Éliminez les pro chinois"
 KPA_Nationalize_Military_Industry:0 "Nationaliser l'industrie militaire"
 KPA_Nationalize_Military_Industry_desc:0 "Nous devons souligner la domination de nos militaires en toutes choses. Commençons par l'économie."
 KPA_Push_to_Busan:0 "Poussez vers Busan"
 KPA_Chinese_Armed_Divisions:0 "Divisions armées chinoises"
 KPA_Ready_for_War:0 "Prêt pour la guerre"
 KPA_Ready_for_War_desc:0 "Sous la direction du KPA et de notre leader Kim, nous sommes prêts à affronter tout ce qui arrive."
 KPA_Ask_Soviets_for_Endorsement:0 "Demandez l'approbation des Soviétiques"
 KPA_Ask_Soviets_for_Endorsement_desc:0 "Nous devons voir quelle est la position des Soviétiques par rapport à nous. Une meilleure question, cependant, est de savoir comment ils pourraient s'opposer à nous."
