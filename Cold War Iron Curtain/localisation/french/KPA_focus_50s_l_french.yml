PWK.1.d:0 "Le Parti des travailleurs coréens a été officiellement annoncé à la suite de la fusion du Parti des travailleurs de Corée du Nord avec le Parti des travailleurs de Corée du Sud. Ce dernier acte poursuit la consolidation du leadership communiste autour de Kim Il-Sung. Cela survient après que le récent Congrès du Parti a déclaré la Corée du Nord bastion de la démocratie et approuvé une constitution établissant une Corée indépendante et unie avec Séoul comme capitale. Avec un seul parti, il semble que la Corée du Nord finalise ses efforts pour jeter les bases d'une unification de la péninsule coréenne sous le régime communiste."
PWK.2.d:0 "Les observateurs de l'Armée populaire nord-coréenne (APC) notent avec inquiétude la récente construction d'un culte de la personnalité et d'une vaste structure de surveillance au sein de l'armée. La loyauté semble concentrée sur Kim Il-Sung et les responsables politiques seraient très actifs pour garantir à la fois la loyauté et l'éducation au marxiste-léninisme. Faisant fi de ces critiques, un haut responsable nord-coréen a déclaré que le KPA était en train de se transformer en une force révolutionnaire disciplinée et dévouée au peuple. Et non pas une force asservie par un dictateur ou achetée par l'argent impérialiste."
KPA_Purge.3.d:0 "Le nationaliste coréen Cho Man-sik a été exécuté à Pyongyang. Ardent nationaliste, beaucoup le considéraient comme un rival potentiel pour le pouvoir en Corée du Nord. Son exécution est considérée comme une victoire pour Kim Il-Sung et ses partisans. Cho Man-sik a eu du mal à s'établir après la Seconde Guerre mondiale et son refus d'accepter la tutelle de la péninsule coréenne lui a coûté tout soutien potentiel soviétique. Cho Man-sik était bien connu pour son adhésion à la résistance non-violente à la domination japonaise, mais son échec à adopter les idéaux soviétiques a conduit à sa détention et finalement à son exécution."
KPA_Purge.4.d:0 "Dans une rare réprimande publique, des informations se sont répandues selon lesquelles Kim Il-Sung tient les généraux formés par les communistes chinois pour responsables des récents revers militaires. Il s'agit d'un défi ouvert à la faction Yanan, composée des dirigeants communistes coréens pro-chinois. Le groupe entretient des liens étroits avec les communistes chinois et domine la direction militaire. Suite à ces critiques, Kim devrait purger un certain nombre de ces généraux et les remplacer par ses propres loyalistes. Les dirigeants communistes chinois seraient mécontents de la situation."
KPA_Purge.5.d:0 "Des rapports en provenance de Corée du Nord indiquent que Ho Ka-I est mort de maladie, bien que des rapports non officiels suggèrent qu'il pourrait avoir été exécuté au cours d'une lutte pour le pouvoir. Il s'agit d'un coup dur porté à la faction pro-soviétique au sein du parti communiste. Ho Ka-I, un Coréen soviétique, a pris de l'importance après la Seconde Guerre mondiale, les Soviétiques l'ayant identifié comme un organisateur clé. Il a travaillé en étroite collaboration avec Kim Il-Sung pour éliminer les ennemis du parti et consolider le pouvoir, mais les deux hommes se sont récemment brouillés. Kim aurait accusé son ancien allié de chercher à transformer la Corée du Nord en une mini-Union soviétique et de se concentrer uniquement sur sa gloire personnelle. Son exécution indique que Ho Ka-I et sa faction ont probablement perdu le dernier conflit interne au sein des dirigeants communistes nord-coréens."
KPA_Purge.7.d:0 "Malgré les appels des États-Unis et de l'Union soviétique, le gouvernement nord-coréen a annoncé avoir exécuté Pak Hon-yong pour espionnage. Pak Hon-yong a longtemps défendu le mouvement communiste en Corée occupée par le Japon, même s'il a fini par se cacher jusqu'après la Seconde Guerre mondiale. Il a finalement créé le parti communiste en Corée du Sud, mais il a finalement été contraint de quitter le pays. En Corée du Nord, il a contribué à l'unification du communisme coréen sous Kim Il-Sung et a obtenu un poste de direction grâce à son influence en Corée du Sud. Cependant, la guerre de Corée a été marquée par une répression massive des communistes sud-coréens, entraînant des répressions et des déportations massives. Avec sa position affaiblie et une victoire militaire improbable, Pak Hon-yong manquait de beaucoup d'influence politique et fut facilement purgé par Kim Il-Sung alors qu'il cherchait à assurer une autorité complète sur le communisme coréen."
August_Faction.2.d:0 "Une récente lutte pour le pouvoir contre Kim Il-Sung s'est soldée par un échec. Les hauts dirigeants des factions pro-soviétiques et pro-chinoises de la direction communiste coréenne ont tenté de destituer Kim du pouvoir. Ils prévoyaient d'affronter Kim lors de la prochaine grande réunion du Comité central et de lui reprocher de ne pas avoir corrigé son style de leadership suite à la vague de déstalinisation qui a déferlé sur le monde communiste. Kim Il-Sung a apparemment découvert le complot et renversé la situation sur ses rivaux. Il a d'abord retardé la réunion d'un mois et a rempli le public de ses fidèles. Lorsque les critiques ont commencé, les partisans de Kim ont réprimandé les critiques, déjouant ainsi le complot. Par la suite, de nombreux dirigeants communistes pro-soviétiques et pro-chinois ont été arrêtés. Kim Il-Sung a annoncé son intention de procéder à une nouvelle purge, indiquant qu'il pourrait enfin réussir à briser toutes les factions rivales au sein du parti."
August_Faction.3.d:0 "La déstalinisation balaie le monde communiste. Ces dirigeants communistes sont toujours attachés au stalinisme, en particulier au culte de la personnalité et à la consolidation du leadership par un individu. Les dirigeants communistes pro-soviétiques et pro-chinois dirigés par Choe Chang-ik ont convenu d'affronter Kim Il-Sung lors de la prochaine grande réunion du parti. Lorsque Kim a ouvert la réunion pour ouvrir la discussion, Che Chang-ik a commencé à dénoncer publiquement Kim et à consolider son pouvoir. Kim Il-Sung, non préparé, a cherché à mettre fin à la rencontre mais a perdu le contrôle. En fin de compte, le Comité central a voté pour destituer Kim pour son leadership défaillant et le remplacer par un nouveau secrétaire général, Choe Chang-ik. Les efforts déployés par Kim Il-Sung pour consolider le pouvoir et purger les factions rivales au sein du parti ont complètement échoué."
KPA_Purge.9.d:0 "Le gouvernement nord-coréen a annoncé l'exécution de Pak Il-u. L'ancien ministre de l'Intérieur était considéré comme un membre puissant de la faction pro-chinoise Yanan au sein du parti communiste nord-coréen. On s'attend à ce que sa destitution suscite des critiques de la part des communistes chinois, mais indique le déclin continu de la faction Yanan. De nombreux analystes voient dans cette dernière purge le signe que Kim Il-Sung continue de consolider son pouvoir autour de lui."
KPA_FOR.1.d:0 "Le Premier ministre nord-coréen Kim Il-Sung a récemment conclu une visite dans les États du bloc soviétique de l'Est. Ce voyage renforce la légitimité du régime nord-coréen et contribue à en faire un acteur majeur dans le monde communiste. Le dirigeant nord-coréen a rendu visite à de nombreux dirigeants politiques ainsi qu'à des experts industriels et agricoles clés. La Corée du Nord devrait élargir ses liens avec ces États et aider l'économie nord-coréenne à poursuivre son développement socialiste. Ce voyage a également solidifié les liens avec Moscou."
KPA_POL.5.d:0 "Kim Il-Sung, dans une rare démonstration de défi, a vivement réagi contre les récentes politiques de déstalinisation dirigées depuis Moscou. Le Premier ministre nord-coréen condamne ce qu'il appelle le révisionnisme et l'abandon du véritable marxiste-léninisme et du développement socialiste. Plus important encore, Kim Il-Sung a annoncé son soutien à l'opposition chinoise à la nouvelle politique soviétique. Cela marque un changement majeur dans la mesure où la Corée du Nord était auparavant considérée comme une alliée étroite de l'Union soviétique."
KPA_Purge.8.d:0 "Le Parti communiste nord-coréen a poursuivi son remaniement en annonçant que la faction Kapsan était actuellement en train d'être purgée du parti. Cela fait suite à la destitution de Kim Il-Sung du pouvoir par les factions pro-soviétiques et pro-chinoises. La faction Kapsan est composée d'anciens guérilleros coréens anti-japonais qui étaient étroitement alliés à Kim. Avec leur retrait, la possibilité d'un contre-coup d'État pro-Kim est considérablement réduite. Les nouveaux dirigeants nord-coréens continueront probablement à consolider leur pouvoir sur le parti et l'État."
PWK.20.d:0 "Le parti communiste nord-coréen a annoncé un nouveau programme visant à purger la nation du culte de la personnalité. La direction du Parti a noté que les dirigeants précédents s'étaient écartés de la voie socialiste en glorifiant un dirigeant individuel au détriment des besoins de la nation ou du parti lui-même. Il a également ajouté que le nouveau programme ouvrirait la voie à la Corée du Nord pour établir fermement un leadership collectif et une plus grande stabilité nationale alors que le socialisme continue de prospérer."
Juche.1.d:0 "Le dirigeant nord-coréen Kim Il-Sung a commencé à articuler une nouvelle idéologie nationale pour le peuple nord-coréen appelée Juche. Il a appelé la Corée du Nord à achever la transformation de la nation en un État marxiste fondé sur les besoins du peuple coréen. Le Juche appelle la Corée du Nord à devenir totalement autonome et indépendante à trois niveaux. Grâce au Juche, la Corée du Nord atteindra son indépendance politique ainsi que son autonomie économique et militaire. Dans des publications ultérieures, le gouvernement a affirmé que la nouvelle idéologie avait émergé de Kim Il-Sung et de ses expériences avec les mouvements anti-japonais dans les années 1930."
KPA_Purge.1.d:0 "La faction intérieure a été fermement purgée par le Parti à la suite de rapports faisant état de ses tendances antimarxistes et de son désir de pouvoir. Ces anciens combattants antijaponais étaient étroitement liés à Séoul, mais leurs échecs idéologiques les ont empêchés de permettre au socialisme de prospérer en Corée occupée. Ils passèrent plus de temps à comploter pour le pouvoir qu'à soutenir la ferveur révolutionnaire de tous les Coréens. Leur suppression renforcera le parti et contribuera à renforcer les actions révolutionnaires."
KPA_POL.1.d:0 "Le Comité central a tenu un débat animé sur l'avenir du parti. Un groupe de dirigeants du parti suggère que le parti doit se purger et concentrer ses membres parmi un cadre d'élite, un peu comme le parti communiste soviétique. Ils soutiennent que cette structure aiderait l'État à mieux organiser l'implantation du marxiste-léninisme dans le pays. Un autre groupe, composé principalement de Coréens formés au socialisme en dehors de la Chine et de l'Union soviétique, soutient que la Corée du Nord a besoin d'un parti de masse afin de diffuser plus directement le marxiste-léninisme auprès des masses. Ceux qui plaident en faveur d'un parti de masse estiment qu'il faut dialoguer plus directement avec le peuple."
KPA_POL.2.d:0 "La faction intérieure a été publiquement dénoncée par le Comité central. La Faction intérieure revendique depuis longtemps une grande influence parmi les marxistes du Sud, mais ses efforts pour susciter un soulèvement de masse en soutien à la révolution n'ont pas abouti. La Faction intérieure est accusée d'exagérer son influence et de se laisser distraire par des désirs contre-révolutionnaires au lieu de nourrir la ferveur révolutionnaire. Leur échec est une grande tache pour la mission d'unification et d'indépendance sous le socialisme."
KPA_POL.3.d:0 "Le gouvernement a annoncé qu'il retirait ces membres du sud de leurs postes au sein du Parti. Les sudistes ont échoué dans leur mission de soutenir une révolution nationale. Ils sont également devenus complaisants et se sont concentrés sur la réussite personnelle plutôt que sur l'amélioration du parti. Éliminer ces échecs et ces contre-révolutionnaires garantira la force du Parti. De nouveaux membres, plus révolutionnaires et dévoués, remplaceront ceux qui ont été supprimés. Les nouvelles promotions seront annoncées dans les prochains jours." 
KPA_Purge.6.d:0 "Pak Hon-yong a été arrêté pour ses crimes contre le peuple. Il représente les dirigeants des communistes du Sud et a promis de susciter des troubles dans le Sud pour soutenir nos efforts de libération nationale. Cependant, il a complètement échoué dans ses efforts. Cela est dû à son manque d'engagement et à sa concentration sur la gloire et la réussite personnelles. Son arrestation marque un grand gain pour la révolution et un premier pas pour remettre la révolution sur les rails."
KPA_Purge.2.d:0 "Ho Ka-i a été démis de tous ses postes au sein du parti. Il a été accusé de saper la révolution coréenne. Il est accusé d'être un agent d'intérêts étrangers, notamment ceux de l'Union soviétique. L'État nord-coréen doit se concentrer sur son indépendance et sa transformation révolutionnaire. La destitution de Ho Ka-i et son remplacement par des membres du parti engagés uniquement dans l'intérêt de la Corée ne feront que renforcer le parti en cette période critique."
August_Faction.4.d:0 "Lors d'une récente réunion plénière du Comité central, certains membres sournois du parti ont tenté de dénoncer le président Kim Il-Sung. Ils cherchaient à provoquer un changement de direction déstabilisateur. Heureusement, des membres fidèles du parti se sont levés et ont condamné ceux qui recherchaient égoïstement le pouvoir personnel. La tentative de dénonciation a lamentablement échoué et la direction du parti reste intacte. Une fois la réunion terminée, le leader a annoncé son intention de nettoyer le parti des ennemis internes."
August_Faction.5.d:0 "Lors d'une récente réunion plénière du Comité central, certains membres patriotes ont dénoncé avec succès le président Kim Il-Sung pour ses écarts par rapport à la voie socialiste. Cette attaque stupéfiante a exposé Kim et a conduit à un débat de parti qui a annoncé la destitution du président Kim de ses fonctions de direction. Une nouvelle direction du parti sera annoncée et ils ont déjà promis de mettre fin au culte de la personnalité et d'instaurer un pouvoir collectif à la direction. Ce changement est déjà bien accueilli à l'étranger, le gouvernement soviétique ayant exprimé son soutien au peuple nord-coréen."
Han_Sorya.3.d:0 "Han Sorya a été démis de ses fonctions de ministre de l'Éducation du Comité central. Le gouvernement a déclaré que Sorya s'était consacrée au culte de la personnalité et s'était fortement écartée du véritable marxiste-léninisme. Son retrait revitalisera l'éducation idéologique du peuple et permettra d'éradiquer les effets persistants du culte toxique de la personnalité encouragé par les dirigeants précédents."
Han_Sorya.2.d:0 "Han Sorya est devenu un grand champion de la révolution en Corée du Nord. L'écrivain talentueux a consacré ses efforts en tant que ministre de l'Éducation non seulement à promouvoir le développement idéologique de tous les Coréens, mais également à purger la langue des influences étrangères. Il est particulièrement dévoué au Leader et ses écrits glorifient et mettent en valeur les progrès étonnants réalisés ces dernières années. Plus important encore, il a joué un rôle précieux en déterminant la manière dont le gouvernement est capable d'expliquer et de justifier son idéologie d'un État coréen complètement indépendant." 
Han_Sorya.1.d:0 "Han Sorya a été nommé à la tête de la nouvelle Union des écrivains coréens. Cet écrivain talentueux a longtemps été un proche confident du Leader et a joué au fil des années un rôle majeur dans l'expression de l'idéologie de l'État auprès du peuple. Plus important encore, il a réussi à nettoyer la langue coréenne des influences étrangères et capitalistes. Avec son nouveau poste, il devrait diriger plus efficacement non seulement l'éducation des Coréens mais également le développement de la littérature afin de mieux refléter le véritable dévouement du peuple coréen envers le Parti et son Leader."
August_Faction.1.d:0 "Le récent changement à Moscou a revitalisé les factions pro-soviétiques et pro-chinoises au sein du Parti. Ils pensent que Kim Il-Sung s'engage sur une voie contre-révolutionnaire, notamment avec son culte de la personnalité et ce qu'ils considèrent comme une série de purges égoïstes. Ils ont élaboré un plan pour affronter Kim lors de la prochaine réunion du Comité central et dénoncer publiquement sa politique visant à forcer un changement de direction. Le président Kim Il-Sung a entendu des rumeurs concernant un complot, mais pas de détails. Il a le choix de remplir la prochaine rencontre de ses supporters pour se protéger ou non. S'il choisit de ne pas amener ses partisans, cela montrerait sa force au parti."