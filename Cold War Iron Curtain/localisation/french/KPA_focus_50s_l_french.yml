l_french:
 #1950s
 #Domestic
 KPA_50s_the_stalinization_of_democratic_peoples_republic_of_korea:0 "La stalinisation de la République populaire démocratique de Corée"
 KPA_50s_the_stalinization_of_democratic_peoples_republic_of_korea_desc:0 "Le camarade Staline a passé des décennies à éradiquer les tendances contre-révolutionnaires et à garantir une doctrine et une discipline socialistes appropriées. Nous apporterons ce socialisme au peuple et à l'État."
 KPA_50s_emulate_soviet_culture:0 "Imiter la culture soviétique"
 KPA_50s_emulate_soviet_culture_desc:0 "L'Union soviétique est l'État socialiste le plus puissant et le plus développé. Son parti a transformé une population arriérée et superstitieuse, nous pouvons tirer des leçons de cet exemple."
 KPA_50s_establish_the_writers_union:0 "Créer l'Union des écrivains"
 KPA_50s_establish_the_writers_union_desc:0 "Le Parti reconnaît l'importance de la littérature pour éduquer le peuple sur le socialisme et le processus révolutionnaire. Une Union des écrivains coréens doit être créée. Son président décidera quelle littérature sera publiée et quels écrivains bénéficieront du soutien de l'État."
 KPA_50s_an_asian_peoples_democracy:0 "Une démocratie des peuples asiatiques"
 KPA_50s_an_asian_peoples_democracy_desc:0 "Nos efforts de consolidation politique et d'établissement d'un véritable État socialiste portent leurs fruits. La République populaire démocratique de Corée est devenue une véritable démocratie populaire asiatique."
 KPA_50s_embrace_socialist_realism:0 "Adoptez le réalisme socialiste"
 KPA_50s_embrace_socialist_realism_desc:0 "Nos artistes et sculpteurs seront amenés à suivre le réalisme socialiste. Le prolétariat doit être présenté comme embrassant les valeurs communistes pour inculquer les valeurs socialistes au sein du peuple."
 KPA_50s_promote_russian_language_educaiton:0 "Promouvoir l'enseignement de la langue russe"
 KPA_50s_promote_russian_language_educaiton_desc:0 "L'Union soviétique reste un ami important et un modèle de développement socialiste. Afin d'apprendre plus efficacement, le Parti a chargé les départements concernés de promouvoir l'enseignement et l'acquisition de la langue russe."
 KPA_50s_establish_education_facilities_for_war_orphans:0 "Créer des établissements d'enseignement pour les orphelins de guerre"
 KPA_50s_establish_education_facilities_for_war_orphans_desc:0 ""
 KPA_50s_purge_the_japanese_collaborationist_bureacracy:0 "Purger la bureaucratie collaborationniste japonaise"
 KPA_50s_purge_the_japanese_collaborationist_bureacracy_desc:0 "De nombreux Coréens travaillaient en étroite collaboration avec le régime colonial japonais. Ils revendiquent des connaissances administratives essentielles pour gouverner, mais nous n'avons pas besoin de ces pratiques impérialistes."
 KPA_50s_establish_the_political_security_agency:0 "Créer l'Agence de sécurité politique"
 KPA_50s_establish_the_political_security_agency_desc:0 "L'État est menacé par des traîtres au sein du Parti et parmi la population. Afin d'éradiquer cette menace et de protéger le Parti, une nouvelle organisation, appelée Agence de sécurité politique, sera créée."
 KPA_50s_co_opt_non_communist_parties:0 "Coopter les partis non communistes"
 KPA_50s_co_opt_non_communist_parties_desc:0 "Les partis non communistes actuellement tolérés doivent être cooptés et intégrés au Parti sous la forme d'un front unique. Cela confère une légitimité et permet la propagation de l'idéologie révolutionnaire."
 KPA_50s_infiltrate_the_democratic_party:0 "Infiltrer le Parti démocrate"
 KPA_50s_infiltrate_the_democratic_party_desc:0 "Le Parti démocrate, malgré son histoire anticolonialiste, est étroitement lié aux chrétiens et a montré des tendances anticommunistes dans le passé. Nous installerons des membres et des agents du Parti pour superviser plus étroitement le parti et déraciner les éléments réactionnaires en son sein."
 KPA_50s_enforce_state_atheism:0 "Appliquer l'athéisme d'État"
 KPA_50s_enforce_state_atheism_desc:0 "La religion est utilisée depuis des siècles pour exploiter les paysans et les travailleurs coréens. Le Parti n'imposera plus l'athéisme et éclairera le peuple pour qu'il puisse poursuivre son développement en tant que véritable socialiste."
 KPA_50s_subsidize_the_chondoist_chongu_party:0 "Subventionner le parti Chondoist Chongu"
 KPA_50s_subsidize_the_chondoist_chongu_party_desc:0 "Le Parti Chondoist Chongu a un solide bilan anti-impérialiste et pour encourager son soutien au front unique, nous subventionnerons ses activités."
 KPA_50s_crackdown_on_nationalist_christians:0 "Répression contre les chrétiens nationalistes"
 KPA_50s_crackdown_on_nationalist_christians_desc:0 "Les chrétiens coréens ont longtemps été associés au colonialisme anti-japonais. Cependant, ces partisans doivent embrasser une véritable identité socialiste. Le christianisme est enraciné chez les Américains et d'autres ennemis de la révolution."
 KPA_50s_expand_the_democratic_youth_league_of_korea:0 "Développer la Ligue de la jeunesse démocratique de Corée"
 KPA_50s_expand_the_democratic_youth_league_of_korea_desc:0 "Le Parti a créé la Ligue démocratique de la jeunesse de Corée pour être l'aile de la jeunesse et assurer l'endoctrinement socialiste. Avec un front uni ferme, l'organisation peut être considérablement élargie."
 KPA_50s_begin_post-war_reconstruction_process:0 "Commencer le processus de reconstruction d'après-guerre"
 KPA_50s_begin_post-war_reconstruction_process_desc:0 ""
 #Economy
 KPA_50s_the_three_year_plan:0 "Le plan triennal"
 KPA_50s_the_three_year_plan_desc:0 "Suite au conflit dévastateur avec l'impérialisme mondial, le Parti a annoncé un plan de reconstruction sur trois ans. Le peuple coréen bâtira une base de croissance sans fin."
 KPA_50s_mobilize_labor:0 "Mobiliser la main d'oeuvre"
 KPA_50s_mobilize_labor_desc:0 ""
 KPA_50s_mobilize_agriculture:0 "Mobiliser l'agriculture"
 KPA_50s_mobilize_agriculture_desc:0 ""
 KPA_50s_socialist_transformation_of_commerce_and_industry:0 "Transformation socialiste du commerce et de l'industrie"
 KPA_50s_socialist_transformation_of_commerce_and_industry_desc:0 ""
 KPA_50s_receive_soviet_and_chinese_economic_aid:0 "Recevez l'aide économique soviétique et chinoise"
 KPA_50s_receive_soviet_and_chinese_economic_aid_desc:0 ""
 KPA_50s_establish_collective_farms:0 "Créer des fermes collectives"
 KPA_50s_establish_collective_farms_desc:0 "L'agriculture est une composante vitale de notre économie. Afin d'améliorer la production et de mettre en oeuvre une économie socialiste, des fermes collectives seront créées dans tout l'État."
 KPA_50s_hero_of_labor_medals:0 "Médailles du héros du travail"
 KPA_50s_expand_farm_production:0 "Augmenter la production agricole"
 KPA_50s_expand_farm_production_desc:0 "Les bellicistes impérialistes brutaux ont travaillé à dévaster notre agriculture pendant la guerre. Ils cherchaient à affamer notre peuple. Nous redoublerons d'efforts non seulement pour reconstruire l'agriculture, mais aussi pour la développer."
 KPA_50s_pyongyang_steel_production:0 "Production d'acier à Pyeongyang"
 KPA_50s_pyongyang_steel_production_desc:0 "Les bombardiers impérialistes ont pris un plaisir supplémentaire à détruire l'industrie sidérurgique en plein essor à Pyeongyang. Le Parti dirigera les efforts visant à rétablir cette production aux niveaux d'avant-guerre."
 KPA_50s_nationwide_reconstruction_of_infrastructure:0 "Reconstruction des infrastructures à l'échelle nationale"
 KPA_50s_nationwide_reconstruction_of_infrastructure_desc:0 ""
 KPA_50s_the_first_five_year_plan:0 "Le premier plan quinquennal"
 KPA_50s_the_first_five_year_plan_desc:0 "Après avoir reconstruit avec succès l'État, le Parti peut désormais diriger la production et le développement afin de guider le peuple vers un avenir de prospérité et d'unité sous le socialisme."
 KPA_50s_local_guidance_of_factory_management_by_state_officials:0 "Orientation locale de la gestion des usines par des fonctionnaires de l'État"
 KPA_50s_local_guidance_of_factory_management_by_state_officials_desc:0 ""
 KPA_50s_modernize_fertilizer_production:0 "Moderniser la production d'engrais"
 KPA_50s_modernize_fertilizer_production_desc:0 "Nos agriculteurs continuent de s'appuyer sur des méthodes de production archaïques, notamment en agriculture. Nous utiliserons nos ressources pour produire des engrais modernes afin de stimuler l'agriculture."
 KPA_50s_machine_tools_reproduction_movement:0 "Mouvement de reproduction de machines-outils"
 KPA_50s_machine_tools_reproduction_movement_desc:0 "Le dévouement, la loyauté et la capacité du travailleur coréen ne pourront jamais être égalés. Cependant, afin de respecter les quotas de production et de développer rapidement l'État, il faut mettre l'accent sur l'augmentation des machines-outils et de la productivité."
 KPA_50s_construct_the_pyongyang_theater_and_okryu_restaurant:0 "Construire le théâtre de Pyongyang et le restaurant Okryu"
 KPA_50s_construct_the_pyongyang_theater_and_okryu_restaurant_desc:0 ""
 KPA_50s_chollima_cooperative_movement:0 "Mouvement coopératif Chollima"
 KPA_50s_chollima_cooperative_movement_desc:0 ""
 KPA_50s_sculpture_creation_project:0 "Projet de création de sculpture"
 KPA_50s_sculpture_creation_project_desc:0 ""
 KPA_50s_invest_in_the_chongjin_textile_mill:0 "Investissez dans l'usine textile de Chongjin"
 KPA_50s_invest_in_the_chongjin_textile_mill_desc:0 ""
 KPA_50s_complete_the_currency_reform:0 "Achever la réforme monétaire"
 KPA_50s_complete_the_currency_reform_desc:0 "La Banque centrale doit réformer notre monnaie. Le won remplacera le yen et ne dépendra d'aucune monnaie fantoche ou impérialiste. Les réformes incluront le rattachement de notre monnaie au rouble soviétique."
 KPA_50s_initiate_educational_reforms:0 "Initier des réformes éducatives"
 KPA_50s_initiate_educational_reforms_desc:0 ""
 #Political
 KPA_50s_premier_kim_il_sung:0 "Premier ministre Kim il Sung"
 KPA_50s_premier_kim_il_sung_desc:0 "L'Assemblée populaire suprême a confirmé le leadership du combattant de la liberté et révolutionnaire Kim il Sung. Alors qu'il consolide son pouvoir, le dirigeant promet de mettre en oeuvre le socialisme et de libérer toute la Corée."
 KPA_50s_arrival_of_korean_troops_from_abroad:0 "Arrivée des troupes coréennes de l'étranger"
 KPA_50s_arrival_of_korean_troops_from_abroad_desc:0 ""
 KPA_50s_establish_the_fatherland_unification_democratic_front:0 "Créer le Front démocratique d'unification de la patrie"
 KPA_50s_establish_the_fatherland_unification_democratic_front_desc:0 ""
 KPA_50s_confirm_guarantee_of_war_support_from_stalin_and_mao:0 "Confirmer la garantie du soutien de guerre de Staline et de Mao"
 KPA_50s_confirm_guarantee_of_war_support_from_stalin_and_mao_desc:0 ""
 KPA_50s_final_preparations_of_fatherland_liberation_war:0 "Derniers préparatifs de la guerre de libération de la patrie"
 KPA_50s_final_preparations_of_fatherland_liberation_war_desc:0 ""
 KPA_50s_integrate_the_workers_party_of_south_korea:0 "Intégrer le Parti des travailleurs de Corée du Sud"
 KPA_50s_integrate_the_workers_party_of_south_korea_desc:0 ""
 KPA_50s_execute_cho_mansik:0 "Exécuter Cho Man-sik"
 KPA_50s_execute_cho_mansik_desc:0 "Cho Man-sik est un maillon faible du Parti depuis des années. Son adhésion à la non-violence et son refus d'accepter la tutelle n'ont fait qu'affaiblir notre position. Son refus d'adhérer véritablement au socialisme fait de lui une menace dangereuse qui doit être éliminée."
 KPA_50s_launch_sweeping_purges:0 "Lancer des purges radicales"
 KPA_50s_launch_sweeping_purges_desc:0 "L'État se trouve dans une situation dangereuse. Les ennemis de l'État sont omniprésents au sein du parti. Nous devons travailler rapidement pour éliminer toutes les menaces."
 KPA_50s_finding_a_scapegoat:0 "Trouver un bouc émissaire"
 KPA_50s_finding_a_scapegoat_desc:0 "Le Parti et le peuple vaillant ne peuvent être tenus pour responsables des défauts de la récente guerre. Nous devons rechercher, dénoncer et éliminer les ennemis du peuple."
 KPA_50s_criticize_ho_kai:0 "Critiquer Ho Ka-i"
 KPA_50s_criticize_ho_kai_desc:0 "Ho Ka-i était un membre important du parti. Cependant, il a montré une tendance à une obéissance et un dévouement excessifs à l'Union soviétique. Sa destitution est indispensable."
 KPA_50s_purge_southern_communists:0 "Purger les communistes du Sud"
 KPA_50s_purge_southern_communists_desc:0 "Les communistes du Sud ont fait des promesses audacieuses au fil des années. Cependant, certains échecs ont été clairement révélés. Cela indique qu'ils ne sont pas dévoués à la révolution et qu'il faut s'en occuper."
 KPA_50s_blame_yanan_generals_for_disaster:0 "Blâmer les généraux Yanan pour le désastre"
 KPA_50s_blame_yanan_generals_for_disaster_desc:0 "Les difficultés de la guerre ne peuvent être imputées au Parti ou au peuple. Au contraire, c'est clairement la faute des généraux Yanan. Ces officiers formés en Chine sont incompétents et doivent être démis de leurs fonctions."
 KPA_50s_administrative_district_reorganization:0 "Réorganisation des districts administratifs"
 KPA_50s_administrative_district_reorganization_desc:0 ""
 KPA_50s_establish_the_national_academy_of_science:0 "Créer l'Académie nationale des sciences"
 KPA_50s_establish_the_national_academy_of_science_desc:0 "Le Parti et l'État doivent être suprêmes afin de guider correctement le peuple vers la prospérité et le socialisme. Pour ce faire, les plus grands intellectuels doivent être intégrés."
 KPA_50s_change_in_the_leadership_of_soviet_union:0 "Changement dans la direction de l'Union soviétique"
 KPA_50s_change_in_the_leadership_of_soviet_union_desc:0 ""
 KPA_50s_the_6th_plenary_session_of_the_workers_party:0 "La 6ème séance plénière du Parti des Travailleurs"
 KPA_50s_the_6th_plenary_session_of_the_workers_party_desc:0 ""
 KPA_50s_expand_the_personality_cult:0 "Développez le culte de la personnalité"
 KPA_50s_expand_the_personality_cult_desc:0 ""
 KPA_50s_promote_kims_supporters:0 "Promouvez les partisans de Kim"
 KPA_50s_promote_kims_supporters_desc:0 ""
 KPA_50s_purge_pak_ilu:0 "Purger Pak Il-u"
 KPA_50s_purge_pak_ilu_desc:0 "La Faction Yanan a fait preuve d'un manque de capacité et d'engagement révolutionnaire. Pak Il-u, un dirigeant éminent de cette faction, est sans aucun doute une cause majeure de ces échecs et le parti doit agir pour éliminer ce danger pour la révolution."
 KPA_50s_the_famine_of_1955:0 "La famine de 1955"
 KPA_50s_the_famine_of_1955_desc:0 ""
 KPA_50s_execute_pak_honyong:0 "Exécuter Pak Hon-yong"
 KPA_50s_execute_pak_honyong_desc:0 "Les trahisons et les échecs de Pak Hon-young ont coûté beaucoup de bonheur au peuple coréen ainsi que la vie de nombreux révolutionnaires. Pour ces crimes, il n'y a qu'une seule juste punition."
 KPA_50s_establishing_juche:0 "Création du Juche"
 KPA_50s_establishing_juche_desc:0 "L'idéologie du Juche appelle l'État et le peuple à devenir totalement autonomes et forts pour réaliser le socialisme."
 KPA_50s_3rd_congress_of_the_workers_party_of_korea:0 "3e Congrès du Parti des travailleurs de Corée"
 KPA_50s_3rd_congress_of_the_workers_party_of_korea_desc:0 ""
 KPA_50s_tour_the_eastern_bloc:0 "Visitez le bloc de l'Est"
 KPA_50s_tour_the_eastern_bloc_desc:0 "Des plans sont en cours pour que le Grand Leader et ses principaux responsables voyagent à travers le bloc de l'Est. Ils renforceront leur soutien idéologique au milieu des visions divergentes du socialisme qui émergent parmi les États communistes."
 KPA_50s_the_august_faction_incident:0 "L'incident des factions en août"
 KPA_50s_the_august_faction_incident_desc:0 "Le récent changement de pouvoir à Moscou a galvanisé les dirigeants des partis pro-chinois et pro-soviétiques. Il y a actuellement un complot visant à changer la direction du parti..."
 KPA_50s_unwelcome_visit_of_mikoyan_and_peng:0 "Visite malvenue de Mikoyan et Peng"
 KPA_50s_unwelcome_visit_of_mikoyan_and_peng_desc:0 ""
 KPA_50s_purge_the_opposing_factions:0 "Purger les factions adverses"
 KPA_50s_purge_the_opposing_factions_desc:0 ""
 KPA_50s_receive_apology_from_moscow_and_beijing:0 "Recevez des excuses de Moscou et de Pékin"
 KPA_50s_receive_apology_from_moscow_and_beijing_desc:0 ""
 KPA_50s_empower_han_sorya:0 "Donnez du pouvoir à Han Sorya"
 KPA_50s_empower_han_sorya_desc:0 "Han Sorya est un écrivain doué et ministre de l'Éducation. Il sera élevé et apportera beaucoup d'efficacité au parti."
 KPA_50s_the_guerilla_faction_triumphant:0 "La faction guérilla triomphante"
 KPA_50s_the_guerilla_faction_triumphant_desc:0 "Les luttes entre factions sont résolues, la faction guérilla est l'avant-garde du Parti."
 KPA_50s_decrease_russian_language_education:0 "Diminuer l'enseignement de la langue russe"
 KPA_50s_decrease_russian_language_education_desc:0 "La menace d'une pensée idéologique divergente de la part de l'Union soviétique nécessite de s'éloigner des cours de langue russe."
 KPA_50s_the_second_arduous_march:0 "La deuxième marche ardue"
 KPA_50s_the_second_arduous_march_desc:0 "Les factions au sein du parti qui sont fidèles aux puissances extérieures ont cherché à destituer illégalement le Grand Leader. Il faut s'en occuper."
 KPA_50s_begin_the_chollima_movement:0 "Commencez le mouvement Chollima"
 KPA_50s_begin_the_chollima_movement_desc:0 ""
 KPA_50s_withdraw_peoples_republic_of_china_forces_in_korea:0 "Retirer les forces de la République populaire de Chine en Corée"
 KPA_50s_withdraw_peoples_republic_of_china_forces_in_korea_desc:0 ""
 KPA_50s_begin_the_settlement_of_japanokoreans:0 "Commencer l'installation des Japono-Coréens"
 KPA_50s_begin_the_settlement_of_japanokoreans_desc:0 ""
 KPA_50s_introduce_the_chongsanri_method:0 "Présenter la méthode Chongsanri"
 KPA_50s_introduce_the_chongsanri_method_desc:0 ""
 KPA_50s_the_consolidation_of_power:0 "La consolidation du pouvoir"
 KPA_50s_the_consolidation_of_power_desc:0 ""
 KPA_50s_blistering_criticism_of_Kims_leadership:0 "Critique cinglante du leadership de Kim"
 KPA_50s_blistering_criticism_of_Kims_leadership_desc:0 ""
 KPA_50s_resigning_of_kim_il_sung:0 "Démission de Kim Il Sung"
 KPA_50s_resigning_of_kim_il_sung_desc:0 ""
 KPA_50s_political_support_from_miyokan_and_peng:0 "Soutien politique de Miyokan et Peng"
 KPA_50s_political_support_from_miyokan_and_peng_desc:0 ""
 KPA_50s_formation_of_kimpakchoe_triumverate:0 "Formation du triumvérat Kim-Pak-Choe"
 KPA_50s_formation_of_kimpakchoe_triumverate_desc:0 ""
 KPA_50s_purge_the_manju_faction:0 "Purger la faction Manju"
 KPA_50s_purge_the_manju_faction_desc:0 "La faction Manju s'est engagée dans un culte réactionnaire des héros. Ils entravent la révolution et doivent être purgés."
 KPA_50s_dismiss_han_sorya:0 "Renvoyer Han Sorya"
 KPA_50s_dismiss_han_sorya_desc:0 "Han Sorya était un ardent défenseur de l'ancien leadership. Il doit être démis de ses fonctions de ministre de l'Éducation."
 KPA_50s_weaken_the_personality_cult:0 "Affaiblir le culte de la personnalité"
 KPA_50s_weaken_the_personality_cult_desc:0 "Le culte des héros encourage la glorification de l'individu au détriment du parti et doit être mis fin."
 KPA_50s_rehabilitate_purged_writers:0 "Réhabiliter les écrivains purgés"
 KPA_50s_rehabilitate_purged_writers_desc:0 "Certains de nos plus grands écrivains ont été purgés en raison de leurs liens avec l'Union soviétique. Toutefois, ces écrivains offrent beaucoup pour le Parti et seront réhabilités."
 KPA_50s_increase_chinese_cultural_influences:0 "Augmenter les influences culturelles chinoises"
 KPA_50s_increase_chinese_cultural_influences_desc:0 "La Révolution chinoise offre de nombreux parallèles avec notre propre lutte ; nous pouvons en tirer de nombreuses leçons."
 KPA_50s_purge_kim_loyalists:0 "Purger les loyalistes de Kim"
 KPA_50s_purge_kim_loyalists_desc:0 "L'ancien secrétaire général a refusé de gouverner par consensus et a favorisé des courtisans incompétents. Ces hommes doivent être démis de leurs fonctions pour lesquelles ils n'ont jamais été qualifiés."
 KPA_50s_embrace_destalinization:0 "Adoptez la déstalinisation"
 KPA_50s_embrace_destalinization_desc:0 "Le Parti doit rester engagé sur la voie révolutionnaire et suivre l'Union soviétique dans l'éradication des pratiques antérieures qui ont affaibli la révolution."
 KPA_50s_fracture_within_the_new_regime:0 "Fracture au sein du nouveau régime"
 KPA_50s_fracture_within_the_new_regime_desc:0 ""
 #Military
 KPA_50s_the_korean_peoples_army:0 "L'Armée populaire coréenne"
 KPA_50s_the_korean_peoples_army_desc:0 "Les anciens groupes de libération et bandes de guérilla coréennes sont dissous et réformés en une Armée populaire coréenne pour défendre efficacement la révolution contre les menaces étrangères ou intérieures. De nouvelles doctrines et équipements pour les centres de formation seront nécessaires pour achever cette transition vers une armée professionnelle."
 KPA_50s_the_korean_peoples_army_airforce:0 "Force aérienne de l'Armée populaire coréenne"
 KPA_50s_the_korean_peoples_army_airforce_desc:0 "L'armée de l'air de l'armée populaire coréenne protégera notre ciel des ennemis capitalistes. Le noyau de cette force sera la Société coréenne de l'aviation."
 KPA_50s_request_yak_18s:0 "Demander des Yak 18"
 KPA_50s_request_yak_18s_desc:0 "L'armée de l'air de l'Armée populaire coréenne a besoin d'une capacité de bombardiers pour soutenir nos forces terrestres sur le terrain. Le Yak-18 soviétique répond à ce besoin, nous demanderons de fournir ces avions."
 KPA_50s_import_soviet_lavochkin_la_9s:0 "Importer des Lavochkin La 9 soviétiques"
 KPA_50s_import_soviet_lavochkin_la_9s_desc:0 "Notre Force aérienne a besoin de chasseurs pour protéger le ciel et former davantage de pilotes. Le Lavochkin La 9 soviétique répond aux besoins de notre force et nous demanderons des chasseurs à l'Union soviétique."
 KPA_50s_import_the_mig_15s:0 "Importez les MiG-15"
 KPA_50s_import_the_mig_15s_desc:0 "La technologie aérienne se développe rapidement, l'Air Force doit entrer dans l'ère des avions à réaction afin de faire face efficacement à toutes les menaces possibles. Le Mig-15 soviétique est l'avion parfait pour répondre à nos besoins."
 KPA_50s_a_second_batch_of_MiG_15s:0 "Un deuxième lot de MiG-15"
 KPA_50s_a_second_batch_of_MiG_15s_desc:0 "Nous devrions recontacter les Soviétiques pour un autre lot de MiG-15."
 KPA_50s_the_korean_peoples_army_ground_force:0 "La force terrestre de l'Armée populaire coréenne"
 KPA_50s_the_korean_peoples_army_ground_force_desc:0 "La Force terrestre de l'Armée populaire coréenne est l'unification de plusieurs groupes de résistance et bandes armées communistes qui doivent être transformées en une force militaire moderne."
 KPA_50s_soviet_t_3485s:0 "T-34/85 soviétiques"
 KPA_50s_soviet_t_3485s_desc:0 "Une force blindée permettra à nos forces d'avancer rapidement au combat. Cela est crucial si nous voulons libérer la Corée et vaincre le régime fantoche. Les T-34/85 soviétiques dépasseront nos besoins."
 KPA_50s_soviet_weapon_shipments:0 "Expéditions d'armes soviétiques"
 KPA_50s_soviet_weapon_shipments_desc:0 "L'Union soviétique a indiqué qu'elle fournirait des armes à l'infanterie pour garantir que notre armée soit bien approvisionnée et préparée pour ses opérations futures."
 KPA_50s_import_the_pt76:0 "Importez le PT-76"
 KPA_50s_import_the_pt76_desc:0 "Le terrain de la Corée et notre besoin de progrès rapides signifient que nous avons besoin de davantage de véhicules blindés. Le PT-76 soviétique répond à nos besoins."
 KPA_50s_the_type_58_assault_rifle:0 "Le fusil d'assaut type 58"
 KPA_50s_the_type_58_assault_rifle_desc:0 "Nos meilleurs experts militaires reconnaissent que nos troupes ont besoin d'un fusil d'assaut moderne pour faire face aux menaces et vaincre nos ennemis. Le Type 58 soviétique est l'arme idéale."
 KPA_50s_the_korean_peoples_navy:0 "La marine populaire coréenne"
 KPA_50s_the_korean_peoples_navy_desc:0 "La Marine populaire coréenne a débuté sous le nom de Force de sécurité maritime. Afin d'atteindre nos objectifs, notre capacité navale doit être rapidement développée."
 KPA_50s_increase_naval_landing_capabilitites:0 "Augmenter les capacités de débarquement naval"
 KPA_50s_increase_naval_landing_capabilitites_desc:0 "Notre doctrine navale fait appel à la capacité de déplacer rapidement des hommes et du matériel le long de la côte lors d'assauts rapides. Nous procéderons à davantage d'exercices et renforcerons nos capacités."
 KPA_50s_establish_naval_training_academies:0 "Créer des académies de formation navale"
 KPA_50s_establish_naval_training_academies_desc:0 "Nous avons besoin de personnel formé, capable de réaliser des opérations complexes. De nouvelles écoles de formation et académies seront créées afin de faciliter ce développement."
 KPA_50s_expand_the_wonsan_naval_base:0 "Agrandir la base navale de Wonsan"
 KPA_50s_expand_the_wonsan_naval_base_desc:0 "Une marine forte a besoin d'une base puissante à partir de laquelle opérer. La base navale de Wonson est l'installation idéale pour s'agrandir."
 KPA_50s_projects_613_submarines:0 "Projets 613 sous-marins"
 KPA_50s_projects_613_submarines_desc:0 "Nos dirigeants navals reconnaissent qu'une flotte de sous-marins modernes est essentielle aux opérations de combat. Les sous-marins diesel soviétiques du projet 613 répondront à ce besoin."
 #Korean War
 KPA_50s_the_fatherland_liberation_war:0 "La guerre de libération de la patrie"
 KPA_50s_the_fatherland_liberation_war_desc:0 "Tous les peuples coréens réclament la liberté. Le moment est venu pour le Parti populaire coréen de renverser le régime fantoche du sud et d'unifier la Corée."
 KPA_50s_operation_storm:0 "Opération Tempête"
 KPA_50s_occupy_seoul:0 "Occupez Séoul"
 KPA_50s_launch_the_new_show_trials:0 "Lancez les nouveaux essais de spectacle"
 KPA_50s_enact_socialist_transformation_of_occupied_territories:0 "Adopter une transformation socialiste des territoires occupés"
 KPA_50s_regroup_in_the_chinese_borders:0 "Regroupement aux frontières chinoises"
 KPA_50s_form_the_koreachina_joint_command:0 "Former le commandement conjoint Corée-Chine"
 KPA_50s_tactical_retreat:0 "Retraite tactique"
 KPA_50s_participate_in_the_armistice_talks:0 "Participez aux pourparlers d'armistice"
 KPA_50s_reeducate_south_chosen_puppet_prisoners_of_war:0 "Rééduquer les prisonniers de guerre fantoches choisis par le Sud"
 KPA_50s_discuss_the_return_of_prisoners_of_war:0 "Discutez du retour des prisonniers de guerre"
 KPA_50s_continue_the_struggle_abroad:0 "Continuer la lutte à l'étranger"
 
 ####legacy
 KPA_Empower_the_State_Security_Apparatus:0 "Renforcer l'appareil de sécurité de l'État"
 KPA_Empower_the_State_Security_Apparatus_desc:0 "L'appareil de sécurité de l'État doit être encore renforcé par de nouveaux pouvoirs afin de déraciner les ennemis cachés."
 KPA_Arrest_Pak_Hon-yong:0 "Arrêter Pak Hon-yong"
 KPA_Arrest_Pak_Hon-yong_desc:0 "Pak Hon-young, un membre éminent du Parti, s'est révélé être un traître à la révolution. Ses efforts pour organiser les révolutionnaires dans le sud ont clairement échoué et son manque d'influence reflète son manque de ferveur. Même si l'Occident et les Soviétiques s'opposent à cette action, nous ne pouvons pas compromettre la révolution."
 KPA_Rehabilitate_the_Coal_Sector:0 "Réhabiliter le secteur du charbon"
 KPA_Rehabilitate_the_Coal_Sector_desc:0 "Notre État est riche de nombreuses ressources naturelles, notamment du charbon. Les efforts des bombardiers impérialistes et la demande de soldats ont entraîné un fort déclin du secteur du charbon. L'affectation de main-d'oeuvre et la reconstruction de l'administration locale rétabliront le charbon en tant que ressource majeure."
 KPA_Expand_the_Taian_Electric_Appliances_Factory:0 "Agrandissez l'usine d'appareils électriques de Taian"
 KPA_Expand_the_Taian_Electric_Appliances_Factory_desc:0 "Notre comité de planification a identifié l'usine d'appareils électriques de Taian comme un site capable d'une expansion rapide. La demande pour ses produits augmente à mesure que l'économie se développe et doit donc être développée pour répondre à cette demande."
 KPA_Major_Chinee_Financial_Grants:0 "Principales subventions financières chinoises"
 KPA_Major_Chinee_Financial_Grants_desc:0 "Nos frères socialistes de Chine nous ont généreusement offert d'importantes subventions financières. Ce financement contribuera grandement à nous aider à nous remettre de la guerre avec les impérialistes."
 KPA_Increase_Irrigation_Networks:0 "Augmenter les réseaux d'irrigation"
 KPA_Increase_Irrigation_Networks_desc:0 "Alors que le Parti s'efforce de reconstruire l'État et son agriculture, il est de plus en plus reconnu que l'expansion de nos réseaux d'irrigation est nécessaire pour stimuler la production agricole."
 KPA_Establish_the_Sangnong_Mine:0 "Établir la mine de Sangnong"
 KPA_Establish_the_Sangnong_Mine_desc:0 "Les excavateurs et les géomètres ont identifié un important gisement d'or et d'autres minéraux dans la province du Hamgyong du Sud. La mine de Sangong extraira efficacement ces ressources pour le bénéfice de la population et de l'État."
 KPA_Mass_Rural_Investments:0 "Investissements ruraux de masse"
 KPA_Mass_Rural_Investments_desc:0 "Le Parti a identifié que l'épine dorsale de l'économie réside parmi les paysans et les zones rurales. Pour soutenir cela, le Parti commencera à investir massivement pour soutenir la croissance économique rurale."
 KPA_Invest_in_the_Chongjin_Textile_Mill:0 "Investissez dans l'usine textile de Chongjin"
 KPA_Invest_in_the_Chongjin_Textile_Mill_desc:0 "Afin de relancer l'économie, des efforts doivent être faits pour établir une base industrielle. L'usine textile de Chongjin est dans une position idéale pour être agrandie."
 KPA_Increase_Workers_Pay:0 "Augmenter le salaire des travailleurs"
 KPA_Increase_Workers_Pay_desc:0 "Pour inciter et récompenser nos travailleurs, le Parti augmentera leur salaire. Cette nouvelle initiative aidera à pousser nos travailleurs à atteindre leurs objectifs de production."
 KPA_Reaffirm_The_United_Front:0 "Réaffirmer le Front Uni"
 KPA_Reaffirm_The_United_Front_desc:0 "Le Parti lancera une série de programmes afin de démontrer publiquement la force de notre front uni. Cela reflète le soutien universel au Parti et à notre légitimité."
 KPA_Purge_the_Domestic_Faction:0 "Purger la faction nationale"
 KPA_Purge_the_Domestic_Faction_desc:0 "La faction intérieure a une longue histoire d'anti-impérialisme, mais elle reste liée à Séoul et idéologiquement compromise. Cette faction divergente doit être purgée."
 KPA_Establish_the_Korean_Workers_Party:0 "Créer le Parti des travailleurs coréens"
 KPA_Establish_the_Korean_Workers_Party_desc:0 "Nous commencerons à fusionner le Parti populaire de Corée et formerons un Parti des travailleurs coréens unifié qui se présentera au prochain Congrès."
 KPA_The_Structure_of_The_Workers_Party:0 "La structure du Parti des Travailleurs"
 KPA_The_Structure_of_The_Workers_Party_desc:0 "Pour renforcer la révolution, le Parti doit être fort. Nous avons lancé des réformes et commencé à éliminer les éléments contre-révolutionnaires du parti. Nous devons décider quelles seront les prochaines étapes."
 KPA_Reverse_the_Purges:0 "Inverser les purges"
 KPA_Reverse_the_Purges_desc:0 "Le Parti reconnaît que ses récentes purges ont malheureusement affaibli le Parti des Travailleurs. Nous devons réhabiliter certains des membres purgés afin de restaurer le Parti démocratique."
 KPA_Emulate_the_Soviet_Model:0 "Imitez le modèle soviétique"
 KPA_Emulate_the_Soviet_Model_desc:0 "Le Parti des travailleurs doit adopter le modèle du parti soviétique et oeuvrer à la création d'un parti d'élite et discipliné."
 KPA_Launch_New_Show_Trials:0 "Lancer de nouveaux essais de spectacle"
 KPA_Launch_New_Show_Trials_desc:0 "Nous préparons une nouvelle série de procès publics pour éliminer les ennemis du peuple. Ces procès seront bien couverts et renforceront la confiance de la population dans l'État."
 KPA_Criticize_The_Inability_of_the_Domestic_Faction:0 "Critiquer l'incapacité de la faction nationale"
 KPA_Criticize_The_Inability_of_the_Domestic_Faction_desc:0 "La Faction intérieure a promis de propager le socialisme à travers la Corée, mais ses échecs sont évidents. Ils doivent être dénoncés et critiqués."
 KPA_Expand_the_Personality_Cult:0 "Développez le culte de la personnalité"
 KPA_Expand_the_Personality_Cult_desc:0 "Nous devons accroître le dévouement et la reconnaissance du leader. Cela renforcera le dévouement du peuple envers l'État et encouragera davantage de production."
 KPA_An_Elite_Communist_Party:0 "Un parti communiste d'élite"
 KPA_An_Elite_Communist_Party_desc:0 "La série de purges au sein du Parti a réussi à déraciner les membres inefficaces et les menaces contre l'État. Nous sommes désormais un parti d'élite."
 KPA_The_Rehabilitation_of_the_Workers_Party:0 "La réhabilitation du Parti ouvrier"
 KPA_The_Rehabilitation_of_the_Workers_Party_desc:0 "Après une série d'ajustements nécessaires au sein du Parti des Travailleurs, celui-ci a enfin retrouvé son efficacité et son bon fonctionnement."
 KPA_Rebuild_Hydroelctric_Dams:0 "Reconstruire les barrages hydroélectriques"
 KPA_Rebuild_Hydroelctric_Dams_desc:0 "Les impérialistes ont cherché à affamer le peuple en détruisant des barrages hydroélectriques vitaux. Nous lancerons un programme de reconstruction de ces installations."
 KPA_Electrify_the_Cooperatives:0 "Électrifier les coopératives"
 KPA_Electrify_the_Cooperatives_desc:0 "Le Parti a identifié les questions clés affectant le développement et la croissance de notre secteur agricole. Une nouvelle campagne d'électrification des coopératives augmentera la capacité de production."
 KPA_The_Death_of_Stalin:0 "La mort de Staline"
 KPA_The_Death_of_Stalin_desc:0 "Le dirigeant soviétique Joseph Staline était un pilier du socialisme et de la révolution. Avec sa mort, le monde socialiste surveillera de près si la nouvelle direction soviétique poursuit la voie tracée par Staline ou trace une nouvelle voie divergente."
 KPA_Execute_Ho_ka_i:0 "Exécuter Ho ka i"
 KPA_Execute_Ho_ka_i_desc:0 "Ho ka i continue de faire preuve d'une déférence excessive envers l'Union soviétique et non envers le Parti. Les Soviétiques semblent s'engager sur une voie idéologique divergente. Ho ka, je dois être traité."
 KPA_A_New_Milestone_in_the_International_Workers_Movement_and_the_Might_of_Proletariat:0 "Une nouvelle étape dans le mouvement ouvrier international et la puissance du prolétariat"
 KPA_A_New_Milestone_in_the_International_Workers_Movement_and_the_Might_of_Proletariat_desc:0 "Le principal journal du Parti publiera un article intitulé « Une nouvelle étape dans le mouvement ouvrier international et la puissance du prolétariat » pour exprimer le point de vue du grand leader sur la nécessité pour les socialistes de se souvenir des nombreuses et grandes contributions du regretté camarade Staline."
 KPA_Purge_the_Yanan_Faction:0 "Purger la faction Yanan"
 KPA_Purge_the_Yanan_Faction_desc:0 "La faction Yanan s'est longtemps présentée comme un outil d'influence chinoise. Pour que le Parti et l'État survivent, ces ennemis et instruments des intérêts étrangers doivent être éliminés."
 KPA_Purge_the_Soviet_Faction:0 "Purger la faction soviétique"
 KPA_Purge_the_Soviet_Faction_desc:0 "La faction soviétique s'est révélée aussi traîtresse que Moscou est divergente. Il est grand temps que cette faction soit supprimée."
 KPA_Reduce_Soviet_Influence:0 "Réduire l'influence soviétique"
 KPA_Reduce_Soviet_Influence_desc:0 "Les Soviétiques continuent sur une voie idéologique divergente, nous devons réduire leur influence pour protéger la révolution."
 KPA_Condemn_Foriegn_Cultural_Influenes:0 "Condamner les influences culturelles étrangères"
 KPA_Condemn_Foriegn_Cultural_Influenes_desc:0 "La culture coréenne possède tous les éléments nécessaires à la prospérité, à la paix et à la stabilité. Les influences extérieures doivent être purgées."
 KPA_Encourage_Chinese_Language_Education:0 "Encourager l'enseignement de la langue chinoise"
 KPA_Encourage_Chinese_Language_Education_desc:0 "Afin de maximiser ce que nous pouvons apprendre de nos frères révolutionnaires chinois, il faut mettre davantage l'accent sur les cours de langue chinoise."
 KPA_General_Secretary_Choe_Chang-ik:0 "Secrétaire général Choe Chang-ik"
 KPA_General_Secretary_Choe_Chang-ik_desc:0 "Choe Chang-ik possède les compétences et les références révolutionnaires nécessaires pour diriger le Parti par le consensus."
 KPA_Promote_Kims_Supporters:0 "Promouvez les partisans de Kim"
 KPA_Promote_Kims_Supporters_desc:0 "Les alliés proches du Grand Leader doivent être amenés à des postes élevés pour mettre en oeuvre plus efficacement le socialisme."
 
