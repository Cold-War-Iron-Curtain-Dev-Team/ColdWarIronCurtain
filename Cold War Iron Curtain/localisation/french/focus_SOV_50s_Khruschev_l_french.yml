#Country Events
 Tblisi.1.d:0 "La politique de déstalinisation de Khrouchtchev commencerait à démolir le culte de la personnalité formé autour du totalitaire de son vivant, mais tous ne l'approuveraient pas. Beaucoup en sont venus à considérer Staline comme un héros national qui a courageusement dirigé le monde communiste contre les maux des puissances de l'Axe et des oppresseurs impériaux. Staline reste particulièrement populaire dans sa région natale de Géorgie, où Khrouchtchev est devenu de plus en plus impopulaire en raison de ses réformes anti-staliniennes. Le discours à huis clos de Khrouchtchev devant le 20ème Congrès contre Staline et ses loyalistes géorgiens ne ferait qu'engendrer davantage de frustration. En représailles, le 4 mars, les Géorgiens se rassembleraient autour d'un monument à Staline pour pleurer le troisième anniversaire de sa mort. Dans les jours à venir, un mouvement de protestation organisé contre Khrouchtchev allait commencer à gagner du terrain alors que des milliers de personnes descendaient dans la rue. Rapidement, la situation a évolué, de nombreux nationalistes géorgiens appelant à la sécession totale de la Géorgie de l'Union soviétique. Les autorités locales géorgiennes sont totalement aveuglées et attendent les instructions de Moscou. " 							#The Tbilisi Riot (over removal of Stalin monument)
 destalinization.3.d:0 "Après près de 6 jours d'émeutes paralysantes en RSS de Géorgie, Moscou a enfin réaffirmé son contrôle total sur sa région. À la suite d'intenses affrontements contre les forces de police locales, l'armée a été envoyée sur place pour disperser la foule. La situation atteindrait son paroxysme lorsqu'une délégation civile serait arrêtée par le gouvernement et que les manifestants prendraient d'assaut l'armée et la police pour les secourir. Les chars soviétiques feraient irruption sur la place Lénine, suivis par des bataillons de troupes qui n'auraient aucun scrupule à abattre la foule à balles réelles. Le 10 mars, des manifestants ont été arrêtés et tués en masse et des centaines d'autres ont disparu au milieu de la nuit. L'ordre a été rétabli mais la légitimité de Khrouchtchev et de son leadership est désormais discutable." 					#Restore Public Order (Aftermath of Tbilisi Riot)
 
 #Spirits#
 Failing_Health_System_5:0 "Un système de santé désuet"
 Failing_Health_System_4:0 "Un système de santé défaillant"
 Failing_Health_System_3:0 "Système de santé sous-financé"
 Failing_Health_System_2:0 "Planification du rétablissement du système de santé"
 Failing_Health_System_1:0 "Améliorer le système de santé"



#News Events

 KHRUSCHEV_The_Khruschev_Thaw:0 "Le dégel de Khrouchtchev"
 KHRUSCHEV_The_Khruschev_Thaw_desc:0 "Notre nouveau Premier ministre, Nikita Khrouchtchev, a déclaré une nouvelle période de « déstalinisation », citant la politique étrangère et intérieure de notre dirigeant récemment décédé comme étant trop dure. Khrouchtchev veut accroître la liberté de notre peuple et réduire le fossé entre l'Est et l'Ouest."
 KHRUSCHEV_Resume_Heavy_Industry_Priority:0 "Reprendre la priorité de l'industrie lourde"
 KHRUSCHEV_Resume_Heavy_Industry_Priority_desc:0 "Ces dernières années, nous avons mis l'accent sur l'industrie civile et le développement agricole, mais nous devons également, plus que jamais, maintenir notre production d'armes militaires."
 KHRUSCHEV_Consolidate_Khruschevs_Hold_on_Power:0 "Consolider le pouvoir de Khrouchtchev"
 KHRUSCHEV_Consolidate_Khruschevs_Hold_on_Power_desc:0 "L'accession au pouvoir de notre Premiere a été fortement contestée par d'autres membres de haut rang du parti, notamment Lavrenti Beria, aujourd'hui décédé, et ce n'est toujours pas une chose sûre. Nous avons besoin d'un effort concerté pour consolider la place de Khrouchtchev au sommet de l'Union soviétique."
 KHRUSCHEV_The_Soviet_Armed_Forces:0 "Les forces armées soviétiques"
 KHRUSCHEV_The_Soviet_Armed_Forces_desc:0 "Alors que nos forces armées ont continué à prospérer sous le camarade Staline, celui-ci s'est trop intéressé personnellement à beaucoup de choses, ce qui a conduit à... Des projets intéressants comme le sous-marin volant. Nous devons décider si notre approche doit être la même ou plus traditionnelle."
 KHRUSCHEV_Tackle_the_Housing_Crisis:0 "Lutter contre la crise du logement"
 KHRUSCHEV_Tackle_the_Housing_Crisis_desc:0 "Notre population est en plein essor, mais nos infrastructures urbaines ne sont pas conçues pour gérer un tel boom. Nous devons construire davantage d'appartements pour que toutes les familles puissent y vivre."
 KHRUSCHEV_The_Khrushchevka:0 "La Khrouchtchevka"
 KHRUSCHEV_The_Khrushchevka_desc:0 "les Khrouchtchevka sont un système planifié de logements gouvernementaux qui seront construits dans toute l'Union. Abordables pour les camarades de tous horizons, ils amélioreront la qualité de vie moyenne dans notre nation."
 KHRUSCHEV_Expand_City_Limits:0 "Élargir les limites de la ville"
 KHRUSCHEV_Expand_City_Limits_desc:0 "L'élargissement des limites de la ville est un moyen facile d'encourager la construction de nouvelles maisons et l'immigration de personnes des zones rurales vers les zones urbaines."
 KHRUSCHEV_Every_Man_a_Room_Every_Family_a_House:0 "Chaque homme une chambre Chaque famille une maison"
 KHRUSCHEV_Every_Man_a_Room_Every_Family_a_House_desc:0 "Nos efforts d'expansion du logement se déroulent bien, mais nous devons encore les intensifier si nous voulons que tous nos citoyens aient un endroit où vivre."
 KHRUSCHEV_Every_Man_a_Room_Every_Family_a_House_TT:0 "Ajoutez §G1§! un emplacement de bâtiment aux États de plus d'un million d'habitants"
 KHRUSCHEV_Khrushchevite_Architecture:0 "Architecture khrouchtchévienne"
 KHRUSCHEV_Khrushchevite_Architecture_desc:0 "Avec tous les nouveaux bâtiments construits, un nouveau style d'architecture s'est formé à la volée et presque par accident. Bien qu'il ne soit ni tape-à-l'oeil ni quoi que ce soit de spécial, le style khrouchtchévien fait le travail."
 KHRUSCHEV_Guarentee_Right_to_Work:0 "Garantir le droit au travail"
 KHRUSCHEV_Guarentee_Right_to_Work_desc:0 "L'idée selon laquelle certains de nos citoyens peuvent souffrir de la faim sans emploi est absurde et n'a pas sa place dans notre Union. Nous devons garantir que chacun ait le droit et un lieu de travail. "
 KHRUSCHEV_Allow_Small_Scale_Syndicalism:0 "Autoriser le syndicalisme à petite échelle"
 KHRUSCHEV_Allow_Small_Scale_Syndicalism_desc:0 "Même si nous ne sommes pas d'accord avec l'application des concepts syndicalistes à notre société dans son ensemble, ils ont leurs mérites pour les petites communautés, en particulier celles agricoles."
 KHRUSCHEV_Reduce_Legal_Working_Hours:0 "Réduire les heures de travail légales"
 KHRUSCHEV_Reduce_Legal_Working_Hours_desc:0 "Désormais, nos travailleurs peuvent consacrer jusqu'à 14 heures par jour au travail. Bien que cela nous donne évidemment plus de ressources, cela diminue le moral et l'efficacité. Abaisser la limite légale nous vaudra certes de la gratitude, mais réduira également notre profit."
 KHRUSCHEV_Increase_Kosomols_Funding:0 "Augmenter le financement du Komsomol"
 KHRUSCHEV_Increase_Kosomols_Funding_desc:0 "Le Komsomol, ou Ligue des jeunes communistes léninistes de toute l'Union en anglais, est une organisation politique de jeunesse conçue pour cultiver nos jeunes esprits. En augmentant le financement du Komsomol, nous pouvons améliorer ses programmes et ses techniques. "
 KHRUSCHEV_Develop_the_Soviet_Spirit:0 "Développer l'esprit soviétique"
 KHRUSCHEV_Develop_the_Soviet_Spirit_desc:0 "Le moral national n'a jamais été aussi élevé depuis notre glorieuse victoire dans la Grande Guerre Patriotique. Nous devons saisir ce sentiment de ferveur patriotique et cultiver une fierté durable chez nos peuples pour leur Union"
 KHRUSCHEV_Promote_an_Atheltic_Culture:0 "Promouvoir une culture sportive"
 KHRUSCHEV_Promote_an_Atheltic_Culture_desc:0 "Promouvoir l'athlétisme aura pour nous deux bénéfices principaux. La première est d'avoir des équipes nationales pour montrer nos prouesses sur la scène mondiale. La deuxième est que davantage de jeunes seront en forme et mieux préparés pour l'Armée rouge."
 KHRUSCHEV_Komsomolets_Propaganda_Programs:0 "Programmes de propagande des Komsomolets"
 KHRUSCHEV_Komsomolets_Propaganda_Programs_desc:0 "Les Komsomolets, ou les membres masculins du Komsomol, font preuve d'un manque d'enthousiasme pour l'Union et ses programmes malgré nos efforts antérieurs. Cela signifie que nous devons intensifier notre propagande à leur égard."
 KHRUSCHEV_Ready_for_Labour_and_Defence_of_the_USSR:0 "Prêt pour le travail et la défense de l'URSS"
 KHRUSCHEV_Ready_for_Labour_and_Defence_of_the_USSR_desc:0 "Nos récents efforts de propagande ont porté leurs fruits et, aujourd'hui plus que jamais, notre peuple est prêt à servir son pays, que ce soit sur le front ou à la chaîne."
 KHRUSCHEV_Working_Class_Propaganda_Campaigns:0 "Campagnes de propagande de la classe ouvrière"
 KHRUSCHEV_Working_Class_Propaganda_Campaigns_desc:0 "Nous avons besoin d'une campagne de propagande centrée sur notre vaste classe ouvrière pour garantir la force de notre régime et améliorer la stabilité nationale."
 KHRUSCHEV_Raise_Workers_Pensions:0 "Augmenter les retraites des travailleurs"
 KHRUSCHEV_Raise_Workers_Pensions_desc:0 "Nos travailleurs héroïques sont l'épine dorsale du syndicat et méritent d'être traités comme tels. En augmentant leurs pensions, ils sauront à quel point nous apprécions leurs efforts. "
 KHRUSCHEV_Lower_Retirement_Limit:0 "Limite inférieure de retraite"
 KHRUSCHEV_Lower_Retirement_Limit_desc:0 "Beaucoup de nos camarades plus âgés sont inaptes au travail et pourtant incapables de se reposer en raison de nos lois strictes en matière de retraite. Ces lois n'ont pas été conçues pour nuire à notre peuple, mais pour garantir que chacun fasse sa part de travail pour l'Union. Nous devrions donc les modifier."
 KHRUSCHEV_Educational_and_Health_Investments:0 "Investissements dans l'éducation et la santé"
 KHRUSCHEV_Educational_and_Health_Investments_desc:0 "Nos normes en matière d'éducation et de santé sont terribles, que ce soit dans les villes ou dans les zones rurales. Nous devons y investir des sommes considérables si nous voulons les améliorer"
 KHRUSCHEV_Improve_Suburban_Hygene_Standards:0 "Améliorer les normes d'hygiène en banlieue"
 KHRUSCHEV_Improve_Suburban_Hygene_Standards_desc:0 "Nos politiques et services de travaux publics et d'assainissement en banlieue ont besoin d'une refonte majeure, car la plupart des banlieues ont un niveau d'hygiène écoeurant."
 KHRUSCHEV_Expand_Immunization_Campaign:0 "Élargir la campagne de vaccination"
 KHRUSCHEV_Expand_Immunization_Campaign_desc:0 "La vaccination est un domaine relativement nouveau, MAIS ELLE EST PROUVÉE ET PARFAITEMENT SAINE. Il est temps de mettre fin aux maladies mortelles et de vacciner nos citoyens."
 KHRUSCHEV_Extend_Healthcare_Coverage_to_General_Practitioners:0 "Étendre la couverture des soins de santé aux médecins généralistes"
 KHRUSCHEV_Extend_Healthcare_Coverage_to_General_Practitioners_desc:0 "Actuellement, seuls les médecins spécialisés ou ceux travaillant dans les hôpitaux publics peuvent proposer des soins à leurs patients. Cela n'a pas beaucoup de sens et est contre-productif, nous devrions donc résoudre le problème."
 KHRUSCHEV_Properly_Fund_Hospitals:0 "Financer correctement les hôpitaux"
 KHRUSCHEV_Properly_Fund_Hospitals_desc:0 "Même si nous ne souffrons pas d'un manque d'hôpitaux ou de lits d'hôpitaux, nous souffrons d'un manque criant de financement hospitalier, qui handicape l'ensemble de notre système. Nous devons donner à nos hôpitaux ce dont ils ont besoin, quel qu'en soit le prix."
 KHRUSCHEV_Promote_Professionalizing_Education:0 "Promouvoir une éducation professionnalisante"
 KHRUSCHEV_Promote_Professionalizing_Education_desc:0 "Nous devons améliorer notre système scolaire. Plus précisément, nous devons augmenter le nombre d'écoles spécialisées dans une profession spécifique et les promouvoir auprès de la population."
 KHRUSCHEV_Extend_Compulsory_School_Attendence:0 "Étendre la fréquentation scolaire obligatoire"
 KHRUSCHEV_Extend_Compulsory_School_Attendence_desc:0 "En obligeant nos jeunes camarades à prolonger leur scolarité et en appliquant la fréquentation obligatoire à un plus grand nombre d'enfants, nous offrirons à un plus grand nombre de nos jeunes une éducation meilleure et plus complète."
 KHRUSCHEV_Sharpen_Medical_Education_Programs:0 "Affiner les programmes de formation médicale"
 KHRUSCHEV_Sharpen_Medical_Education_Programs_desc:0 "En améliorant et en rationalisant les cours de nos facultés de médecine, nous rendrons nos médecins et nos infirmières plus efficaces et efficients."
 KHRUSCHEV_Raise_Produciton_Quotas:0 "Augmenter les quotas de production"
 KHRUSCHEV_Raise_Produciton_Quotas_desc:0 "La journée est courte, le travail est long et les ouvriers sont paresseux. Cela doit changer. Nos travailleurs ont suffisamment de temps pour produire le double de ce qu'ils produisent actuellement."
 KHRUSCHEV_Increase_Machine_Tool_Production:0 "Augmenter la production de machines-outils"
 KHRUSCHEV_Increase_Machine_Tool_Production_desc:0 "L'augmentation de la production de machines-outils facilitera non seulement la production de davantage d'outils, mais nous permettra également de construire davantage de complexes et d'équipements plus avancés."
 KHRUSCHEV_Dniepr_and_Volga_Dam_Works:0 "Travaux des barrages sur le Dniepr et la Volga"
 KHRUSCHEV_Dniepr_and_Volga_Dam_Works_desc:0 "Après avoir reconstruit les barrages détruits de la Seconde Guerre mondiale, il est temps de passer à de nouveaux projets visant à utiliser les puissants fleuves de la Russie occidentale. Les nouveaux barrages sur la Volga et le Dniepr nous bénéficieront grandement."
 KHRUSCHEV_Ukranian_Industrial_Expansion:0 "Expansion industrielle biélorusse"
 KHRUSCHEV_Ukranian_Industrial_Expansion_desc:0 "Les industries ukrainiennes comptent parmi les meilleures de l'Union et sont en train de se remettre des attaques incessantes de l'UIA. Nous devrions les développer et y investir pour accélérer le problème."
 KHRUSCHEV_Expand_the_Siberian_Railways:0 "Développer les chemins de fer sibériens"
 KHRUSCHEV_Expand_the_Siberian_Railways_desc:0 "Souvent, la seule chose qui relie les villes et les provinces dans les déserts gelés de la Sibérie sont les chemins de fer, et ils sont terriblement sous-développés. Nous devons accroître et améliorer les chemins de fer sibériens."
 KHRUSCHEV_Complete_the_Sixth_Five_Year_Plan:0 "Achever le sixième plan quinquennal"
 KHRUSCHEV_Complete_the_Sixth_Five_Year_Plan_desc:0 "Le sixième plan quinquennal a été un succès retentissant. Nous avons revitalisé, rééquipé et amélioré les industries et les pratiques industrielles dans toute l'Union. Il est temps de compléter les programmes du plan et de se tourner vers l'avenir."
 KHRUSCHEV_Declare_Lysenkos_Theories_Quackery:0 "Déclarez les théories de Lyssenko comme du charlatanisme"
 KHRUSCHEV_Declare_Lysenkos_Theories_Quackery_desc:0 "Nos pratiques et théories agricoles précédentes étaient basées sur les travaux d'un certain Trofim Lysenko. Récemment, nos scientifiques ont prouvé que ses travaux n'étaient rien d'autre que de la pseudoscience et que presque tout ce en quoi il croyait était faux. Il est temps d'abandonner son navire en perdition."
 KHRUSCHEV_Heavily_Emphasize_Agriculture:0 "Mettre fortement l'accent sur l'agriculture"
 KHRUSCHEV_Heavily_Emphasize_Agriculture_desc:0 "Notre peuple connaît la famine depuis trop longtemps. Même avant que la menace nazie ne déferle sur nos terres et ne brûle nos champs, l'approvisionnement alimentaire était un problème, et c'est certainement le cas aujourd'hui. Il est temps que cela cesse."
 KHRUSCHEV_The_Virgin_Lands_Campaign:0 "La campagne Terres Vierges"
 KHRUSCHEV_The_Virgin_Lands_Campaign_desc:0 "La campagne Terres Vierges vise à utiliser des terres auparavant intactes pour l'agriculture et les fermes. Cela augmentera nos capacités de production alimentaire et notre capacité de stockage des aliments."
 KHRUSCHEV_Create_New_Sovkhozes:0 "Créer de nouveaux Sovkhozes"
 KHRUSCHEV_Create_New_Sovkhozes_desc:0 "Les sovkhozes, ou fermes d'État, sont essentielles à notre effort agricole. En créer davantage ne sera que bénéfique pour nous."
 KHRUSCHEV_Reassert_Agricultural_Prices:0 "Réaffirmer les prix agricoles"
 KHRUSCHEV_Reassert_Agricultural_Prices_desc:0 "En réaffirmant le contrôle des prix dans le secteur agricole, nous protégerons nos agriculteurs et garantirons que tout le monde bénéficie d'un traitement équitable."
 KHRUSCHEV_Inaugurate_the_Seventh_Five_Year_Plan:0 "Inaugurer le septième plan quinquennal"
 KHRUSCHEV_Inaugurate_the_Seventh_Five_Year_Plan_desc:0 "Le septième plan quinquennal déterminera l'orientation économique et les perspectives de l'Union pour les cinq prochaines années. Nos planificateurs ont travaillé dur et ont présenté à Première Khrouchtchev un dossier complet détaillant les efforts considérables déployés dans tous les domaines de l'industrie, dans toutes les régions du pays."
 KHRUSCHEV_Replace_Old_Coal_Trains:0 "Remplacer les vieux trains à charbon"
 KHRUSCHEV_Replace_Old_Coal_Trains_desc:0 "Nous avons de nombreuses mines de charbon, donc le problème n'est pas de les exploiter. Cependant, nos trains qui relient les mines aux usines et aux villes sont obsolètes, peu fiables et sujets aux accidents. Les remplacer est une nécessité absolue."
 KHRUSCHEV_Increase_Oil_Investments:0 "Augmenter les investissements pétroliers"
 KHRUSCHEV_Increase_Oil_Investments_desc:0 "À mesure que notre économie se développe vers l'ère moderne, le pétrole devient de plus en plus important et nécessaire à notre survie. Nous disposons de réserves importantes dans le Caucase et il ne serait pas logique de les ignorer ou de les sous-utiliser."
 KHRUSCHEV_Engage_Railway_Improvements:0 "Engager les améliorations ferroviaires"
 KHRUSCHEV_Engage_Railway_Improvements_desc:0 "Nous avons commencé à moderniser et à moderniser notre système ferroviaire, tant les voies que les wagons, mais il reste encore beaucoup de travail à faire si nous voulons disposer d'un réseau satisfaisant."
 KHRUSCHEV_Further_Infrastructure_Efforts:0 "Efforts supplémentaires en matière d'infrastructures"
 KHRUSCHEV_Further_Infrastructure_Efforts_desc:0 "L'amélioration continue des infrastructures est vitale pour la cohésion de notre nation, améliorera notre économie et la qualité de vie locale, et permettra également un transport plus rapide du personnel militaire."
 KHRUSCHEV_Modernize_Gas_Facilities:0 "Moderniser les installations de gaz"
 KHRUSCHEV_Modernize_Gas_Facilities_desc:0 "De plus en plus de gens conduisent des voitures, et de plus en plus de ressources brutes, de produits manufacturés et même d'équipements militaires sont transportés par camions. Tous ces véhicules ont besoin d'essence, ce qui nécessite davantage de stations-service. "
 KHRUSCHEV_Create_a_Large_Petro_Chemical_Industry:0 "Créer une grande industrie pétrochimique"
 KHRUSCHEV_Create_a_Large_Petro_Chemical_Industry_desc:0 "Notre pays, en particulier la région du Caucase, possède de nombreux gisements de pétrole naturels, mais il est toujours dans notre intérêt de construire et de soutenir de nouvelles usines et entreprises pétrochimiques"
 KHRUSCHEV_Expand_Chemicals_Production_Beyond_the_Ural:0 "Développer la production de produits chimiques au-delà de l'Oural"
 KHRUSCHEV_Expand_Chemicals_Production_Beyond_the_Ural_desc:0 "La chaîne de montagnes de l'Oural constitue une grande barrière de séparation dans notre pays, séparant l'ouest de la Russie de la Sibérie. Bien que sous-développée, la région située au-delà de l'Oural est riche en minéraux et en ressources et mérite le développement d'industries chimiques naturelles et synthétiques."
 KHRUSCHEV_Pipeline_Network_Expansion:0 "Expansion du réseau de pipelines"
 KHRUSCHEV_Pipeline_Network_Expansion_desc:0 "Si le pétrole est l'élément vital d'une économie mécanisée, alors notre réseau de pipelines en constitue les artères. Le pétrole ne peut circuler que là où des pipelines existent. L'expansion de notre réseau sera donc vitale pour le bien-être de notre économie."
 KHRUSCHEV_Restore_The_Prominence_of_the_Communist_Party:0 "Restaurer l'importance du Parti communiste"
 KHRUSCHEV_Restore_The_Prominence_of_the_Communist_Party_desc:0 "Dans ses dernières années en particulier, le camarade Staline s'est mis à mettre le Parti sur la touche et à faire de notre État communiste une sorte de one man show. Il est temps de redonner au Parti communiste la place qui lui revient dans notre société."
 KHRUSCHEV_Reactivate_the_CPSU_Apparatus:0 "Réactiver l'appareil du PCUS"
 KHRUSCHEV_Reactivate_the_CPSU_Apparatus_desc:0 "En plus de mettre le Parti sur le côté, Staline a également fermé l'appareil du Parti, diminuant encore davantage son importance et son influence. Nous devons le réactiver pour renforcer le Parti."
 KHRUSCHEV_Put_Beria_on_Trial:0 "Mettre Beria en jugement"
 KHRUSCHEV_Put_Beria_on_Trial_desc:0 "Lavrenti Beria, le serpent traître et ancien chef du NKVD, a exploité sa position pour conspirer contre l'Union, le Parti et le peuple. Beaucoup ont même dit qu'il se réjouissait de la mort du camarade Staline ! L'insolence de ce cochon ! Un essai, c'est trop beau pour lui ! Mais nous devons lui en donner un, même improvisé ou truqué, pour montrer au peuple la légitimité de notre nouveau régime."
 KHRUSCHEV_Revitilize_Party_Activity:0 "Revitaliser l'activité du parti"
 KHRUSCHEV_Revitilize_Party_Activity_desc:0 "Les divers efforts déployés par le parti pour se faire connaître du public et inciter nos citoyens à s'y impliquer ont énormément ralenti, ce qui est mauvais pour nous et pour eux. Nous devons redynamiser notre Parti."
 KHRUSCHEV_Seek_the_Approval_of_The_Central_Committee:0 "Demander l'approbation du Comité central"
 KHRUSCHEV_Seek_the_Approval_of_The_Central_Committee_desc:0 "En dehors de Premiere Khrouchtchev, le Comité central est l'organisation la plus influente et la plus puissante de l'URSS. Nous aurons besoin de leur approbation si nous voulons accomplir quelque chose de qualité substantielle."
 KHRUSCHEV_Gain_Lower_Membership_Support:0 "Bénéficiez d'un soutien inférieur aux membres"
 KHRUSCHEV_Gain_Lower_Membership_Support_desc:0 "Notre soutien le plus clair et le plus important vient de nos citoyens les plus aisés, qui sont satisfaits du statu quo. Nous devons convaincre les couches les plus modestes de notre population que l'Union a également ses intérêts à l'esprit."
 KHRUSCHEV_Assert_Khruschevs_Legitimacy:0 "Affirmer la légitimité de Khrouchtchev"
 KHRUSCHEV_Assert_Khruschevs_Legitimacy_desc:0 "Maintenant que nous avons renforcé le Parti communiste et lui avons restauré la position qui lui revient, il est clair que notre nouveau chef, Nikita Khrouchtchev, est là pour rester et qu'il est l'homme idéal pour ce poste. Nous devons nous assurer que nos collaborateurs comprennent la même chose."
 KHRUSCHEV_Renounce_Stalins_Ways:0 "Renoncez aux voies de Staline"
 KHRUSCHEV_Renounce_Stalins_Ways_desc:0 "Le camarade Staline exigeait une loyauté absolue, une confiance et une croyance aveugle si totale qu'elles en étaient étouffantes. Notre nouveau chef n'exige rien de tel. C'est un Premiere gentil et bienveillant qui ne souhaite qu'être aimé de son peuple."
 KHRUSCHEV_Criticize_the_Lenningrad_Affair:0 "Critiquer l'affaire de Léningrad"
 KHRUSCHEV_Criticize_the_Lenningrad_Affair_desc:0 "L'Affaire de Leningrad était un sale incident, provoqué par un dirigeant paranoïaque et vieillissant, qui se méfiait de tous les membres de l'Union qui conspiraient pour le tuer. Nous devons mettre cela derrière nous et nous en éloigner."
 KHRUSCHEV_Clear_Out_the_Gulags:0 "Débarrassez-vous des Goulags"
 KHRUSCHEV_Clear_Out_the_Gulags_desc:0 "Un autre sous-produit malheureux de la paranoïa de Staline est un nombre incroyable de prisonniers politiques, entassés dans un système du Goulag débordant et débordé. Le nettoyer permettra de rationaliser notre bureaucratie, de réduire nos dépenses et de gagner la confiance de notre population."
 KHRUSCHEV_Restore_Public_Order_and_Legality:0 "Restaurer l'ordre public et la légalité"
 KHRUSCHEV_Restore_Public_Order_and_Legality_desc:0 "En raison de notre récente politique de « déstalinisation », de nombreux partisans enragés de notre récent leader ont manifesté dans les rues, surtout après que nous avons décidé de renommer les villes portant son nom, en particulier Stalino et Stalingrad, avec leurs titres d'origine. Nous devons rétablir l'ordre maintenant."
 KHRUSCHEV_Ensure_Moderate_Support:0 "Assurer un soutien modéré"
 KHRUSCHEV_Ensure_Moderate_Support_desc:0 "Même s'ils ne sont peut-être pas les plus énergiques ou les plus bruyants, les détenteurs d'opinion les plus modérés de l'Union représentent un pourcentage important de notre population, et nous devons obtenir leur soutien, par tous les moyens possibles."
 KHRUSCHEV_Establish_a_New_Diplomatic_Stance:0 "Établir une nouvelle position diplomatique"
 KHRUSCHEV_Establish_a_New_Diplomatic_Stance_desc:0 "Notre nouvelle position diplomatique apparaîtra à l'ouest comme une position plus douce, transformant peut-être le rideau de fer en une clôture grillagée. Mais les apparences sont trompeuses. Nous n'enverrons peut-être pas nos propres forces, mais nous continuerons de lutter pour le communisme à travers le monde."
 KHRUSCHEV_Push_for_the_Hydrogen_Bomb:0 "Poussons pour la bombe à hydrogène"
 KHRUSCHEV_Push_for_the_Hydrogen_Bomb_desc:0 "Si les Américains veulent prendre nos menaces au sérieux, nous devons être capables de causer les mêmes dégâts qu'eux. Et pour ce faire, nous avons besoin d'une bombe à hydrogène, le dernier développement en matière de technologie des armes nucléaires."
 KHRUSCHEV_Establish_the_Strategic_Missle_Forces:0 "Créer les forces de missiles stratégiques"
 KHRUSCHEV_Establish_the_Strategic_Missle_Forces_desc:0 "À mesure que notre stock de missiles augmente, nous avons besoin d'une structure de commandement plus organisée et centralisée pour superviser la distribution, la maintenance et, si nécessaire, le lancement de nos armes."
 KHRUSCHEV_Heavily_Fund_Ballistic_Programs:0 "Financer massivement des programmes balistiques"
 KHRUSCHEV_Heavily_Fund_Ballistic_Programs_desc:0 "En investissant une grande quantité d'argent dans la recherche balistique, nous pouvons bénéficier de toutes sortes de technologies, des balles aux obus, en passant par les fusées - tout ce qui a une trajectoire balistique, en fait."
 KHRUSCHEV_Create_the_Soviet_Space_Program:0 "Créer le programme spatial soviétique"
 KHRUSCHEV_Create_the_Soviet_Space_Program_desc:0 "Avec la création de toute cette nouvelle technologie de fusée, il semble que l'espace - la dernière frontière - soit enfin à notre portée. Nous avons désormais le pouvoir, pour la première fois dans l'histoire, d'envoyer quelque chose hors de notre atmosphère. Il nous suffit de découvrir comment."
 KHRUSCHEV_Build_the_Baikonur_Cosmodrome:0 "Construire le cosmodrome de Baïkonour"
 KHRUSCHEV_Build_the_Baikonur_Cosmodrome_desc:0 "Construire une grande installation capable de gérer la construction et de soutenir les lancements de nos fusées est une nécessité absolue. Baïkonour, une steppe kazakhe isolée, est l'endroit idéal."
 KHRUSCHEV_Persue_Civil_Nuclear_Research:0 "Poursuivre la recherche nucléaire civile"
 KHRUSCHEV_Persue_Civil_Nuclear_Research_desc:0 "Même si nous nous sommes concentrés sur ses applications destructrices, la science nucléaire a également des utilisations civiles. Plus précisément, une source d'énergie et d'énergie de longue durée et incroyablement puissante."
 KHRUSCHEV_Stimulate_Scientific_Competition:0 "Stimuler la compétition scientifique"
 KHRUSCHEV_Stimulate_Scientific_Competition_desc:0 "En stimulant la concurrence scientifique, nous encouragerons nos chercheurs à créer des conceptions plus innovantes, le résultat escompté étant une amélioration des spécifications, de nouvelles avancées et une réduction des coûts."
 KHRUSCHEV_Fill_the_Missle_Gap:0 "Combler le manque de missiles"
 KHRUSCHEV_Fill_the_Missle_Gap_desc:0 "Grâce à leur longueur d'avance dans ce domaine, les Américains disposent d'une grande longueur d'avance sur la production de missiles. Encore une fois, nous devons être capables d'en utiliser autant qu'ils le peuvent si nous voulons être pris au sérieux, et le fossé en matière de missiles doit donc être comblé."
 KHRUSCHEV_Boost_Electronics_Research_and_Development:0 "Stimuler la recherche et le développement en électronique"
 KHRUSCHEV_Boost_Electronics_Research_and_Development_desc:0 "L'électronique devient de plus en plus importante, désormais à petite échelle, de la taille d'un ordinateur et d'un transistor, en plus de l'étage d'alimentation plus grand. Nous devons donc orienter davantage nos recherches dans ce domaine."
 KHRUSCHEV_Compete_with_American_Scientists:0 "Rivaliser avec les scientifiques américains"
 KHRUSCHEV_Compete_with_American_Scientists_desc:0 "Nos récents efforts de R&D ont porté leurs fruits et nos brillants esprits émergents travaillent de concert avec nos dirigeants établis pour amener la science soviétique dans une nouvelle ère, une ère meilleure, dans laquelle nous pouvons rivaliser avec la technologie américaine et gagner."
 KHRUSCHEV_Establish_the_KGB:0 "Créer le KGB"
 KHRUSCHEV_Establish_the_KGB_desc:0 "Le KGB - Komitet Gosudarstvennoy Bezopasnosti - qui se traduit en anglais par « Comité pour la sécurité de l'État », est notre réponse à la CIA. Il cherchera à propager nos intérêts et nos idéologies partout, à réprimer les dissidents internes et, à l'inverse, à semer la dissidence dans les pays de nos ennemis."
 KHRUSCHEV_Fund_Latin_American_Communist_Movements:0 "Financer les mouvements communistes latino-américains"
 KHRUSCHEV_Fund_Latin_American_Communist_Movements_desc:0 "Actuellement, l'Amérique latine est un foyer de communistes et de mouvements communistes, et il est dans notre intérêt de financer ces groupes et d'attiser les flammes de la révolution dans l'hémisphère occidental."
 KHRUSCHEV_Help_FARC:0 "Aidez les FARC"
 KHRUSCHEV_Help_FARC_desc:0 "En Amérique du Sud, les rebelles communistes des FARC sont engagés dans une lutte pour la survie du communisme en Colombie contre le régime capitaliste de l'ordre ancien. Nous devons les aider de toutes les manières possibles."
 KHRUSCHEV_Befriend_Castros_Regime:0 "Devenez ami avec le régime de Castro"
 KHRUSCHEV_Befriend_Castros_Regime_desc:0 "Fidel Castro, le nouvel homme fort de Cuba, est un bon allié potentiel. Les Américains l'ont déjà aliéné, et se lier d'amitié avec lui nous donnerait des ports et des bases stratégiques à portée de main des États-Unis."
 KHRUSCHEV_Integrate_Cuba_into_the_Eastern_Bloc:0 "Intégrer Cuba au bloc de l'Est"
 KHRUSCHEV_Integrate_Cuba_into_the_Eastern_Bloc_desc:0 "Maintenant que nous entretenons des liens plus étroits avec Castro et son régime, il est temps d'intégrer pleinement Cuba dans nos organisations de coopération économique et militaire - le Pacte de Varsovie et le COMECON. "
 KHRUSCHEV_Deploy_Ballistic_Forces_to_Cuba:0 "Déployer des forces balistiques à Cuba"
 KHRUSCHEV_Deploy_Ballistic_Forces_to_Cuba_desc:0 "Les bases aériennes cubaines nous offrent une opportunité que nous n'avons jamais eue auparavant : une plate-forme de lancement à quelques kilomètres seulement des côtes de la Floride et à portée même de nos plus petits missiles nucléaires. Nous devons en profiter et l'utiliser comme levier contre les Américains."
 KHRUSCHEV_Fund_Nasserist_Egypt:0 "Fonds Egypte Nassériste"
 KHRUSCHEV_Fund_Nasserist_Egypt_desc:0 "Même si Nasser n'est peut-être pas aussi communiste que nous l'aurions souhaité, il n'est pas une marionnette réactionnaire occidentale comme le Shah et ces juifs parvenus. L'aider nous donnera un point d'ancrage au Moyen-Orient que nous pourrons exploiter."
 KHRUSCHEV_Invest_in_Burma:0 "Investir en Birmanie"
 KHRUSCHEV_Invest_in_Burma_desc:0 "La Birmanie est un pays sous-développé et en difficulté, mais ils restent nos frères d'armes dans la lutte contre le capitalisme, et pour cela nous fournirons un financement monétaire à leur industrie et à leur peuple."
 KHRUSCHEV_Arm_Algerian_Rebels:0 "Armer les rebelles algériens"
 KHRUSCHEV_Arm_Algerian_Rebels_desc:0 "En armant et en soutenant les rebelles algériens, nous pouvons affaiblir davantage l'emprise des puissances impérialistes sur l'Afrique."
 KHRUSCHEV_Aid_the_Congolese_Insurgency:0 "Aidez l'insurrection congolaise"
 KHRUSCHEV_Aid_the_Congolese_Insurgency_desc:0 "Les Belges ont longtemps opprimé, réprimé et réprimé le peuple congolais autochtone d'Afrique centrale, et ils se sont soulevés contre leurs suzerains. Nous devons envoyer de l'aide."
 KHRUSCHEV_Strengthen_Influence_in_Occidental_French_Africa:0 "Renforcer son influence en Afrique occidentale française"
 KHRUSCHEV_Strengthen_Influence_in_Occidental_French_Africa_desc:0 "En renforçant nos efforts pour contrôler la politique en Afrique subsaharienne, nous pouvons élargir notre sphère d'action tout en affaiblissant les Français."
 KHRUSCHEV_The_Soviet_Airforce:0 "L'armée de l'air soviétique"
 KHRUSCHEV_The_Soviet_Airforce_desc:0 "Notre force aérienne a commencé à faire des progrès à pas de géant, en introduisant des avions à réaction dans toutes les zones d'opérations pour toute mission dont nous pourrions avoir besoin, mais nous ne pouvons pas nous arrêter là. Nous devons continuer à développer notre technologie d'armes à réaction et aériennes."
 KHRUSCHEV_Research_High_Speed_Bombers:0 "Recherche sur les bombardiers à grande vitesse"
 KHRUSCHEV_Research_High_Speed_Bombers_desc:0 "Le principal inconvénient des gros bombardiers stratégiques est leur lenteur. Vraiment lent. Ainsi, si nous pouvons concevoir et développer un bombardier à grande vitesse capable de franchir le mur du son, cela donnera à nos bombardiers un grand avantage en matière de positions anti-aériennes et d'intercepteurs."
 KHRUSCHEV_Restart_the_Flying_Submarine_Program:0 "Redémarrez le programme de sous-marins volants"
 KHRUSCHEV_Restart_the_Flying_Submarine_Program_desc:0 "Le sous-marin volant. Que faut-il dire de plus ? C'est épique. C'est glorieux. C'est un foutu sous-marin volant, pour emprunter une expression américaine. Qu'est-ce qu'il n'y a pas à aimer là-dedans ?"
 KHRUSCHEV_Invest_in_Traditional_Aircraft:0 "Investissez dans des avions traditionnels"
 KHRUSCHEV_Invest_in_Traditional_Aircraft_desc:0 "Des sous-marins volants ? Pfff. Quelle idée idiote. Cela ne fonctionnera jamais. Il est de loin préférable de se concentrer sur ce qui se passera - les avions traditionnels - plutôt que sur des projets farfelus qui nous font perdre du temps et de l'argent."
 KHRUSCHEV_Increase_Aircraft_Production:0 "Augmenter la production d'avions"
 KHRUSCHEV_Increase_Aircraft_Production_desc:0 "Si nous voulons contrôler le ciel dans une guerre à grande échelle, nous avons besoin de plus d'avions là-haut pour le défendre ou le capturer. Il est indispensable d'intensifier notre production d'avions à réaction."
 KHRUSCHEV_The_Tu_114_Propaganda_Campaign:0 "La campagne de propagande Tu 114"
 KHRUSCHEV_The_Tu_114_Propaganda_Campaign_desc:0 "Le Tu-114 est un tout nouveau modèle qui peut être utilisé comme paquebot ou bombardier à longue portée. Faire voler des Tu-114 à travers le monde nous fera gagner de la reconnaissance et donnera le droit de se vanter à nos ingénieurs."
 KHRUSCHEV_Indian_Arms_Deals:0 "Offres d'armes indiennes"
 KHRUSCHEV_Indian_Arms_Deals_desc:0 "Le gouvernement indien nous a contacté et souhaiterait nous acheter des armes pour soutenir sa jeune armée, en échange d'investissements importants dans notre secteur civil et d'un peu d'argent. C'est une bonne idée."
 KHRUSCHEV_Adopt_the_MiG_15:0 "Adoptez le MiG 15"
 KHRUSCHEV_Adopt_the_MiG_15_desc:0 "Le MiG 15 est un modèle haut de gamme, avancé et polyvalent, et son adoption dans l'ensemble de notre force aérienne lui donnera un grand coup de pouce."
 KHRUSCHEV_Invest_in_Recon_Drone_Initiatives:0 "Investissez dans des initiatives de drones de reconnaissance"
 KHRUSCHEV_Invest_in_Recon_Drone_Initiatives_desc:0 "Nos meilleurs ingénieurs en aérodynamique ont commencé à étudier une technologie de vol sans pilote capable de prendre des photos et d'en rendre compte aux commandants. En cas de succès, ces drones seraient révolutionnaires et très utiles à nos forces armées."
 KHRUSCHEV_Focus_on_Jet_Interceptors:0 "Focus sur les intercepteurs à réaction"
 KHRUSCHEV_Focus_on_Jet_Interceptors_desc:0 "Il est préférable de se concentrer sur des intercepteurs conçus pour la vitesse, mais capables également d'effectuer des manoeuvres plus avancées à G élevé, plutôt que sur des intercepteurs à Mach élevé."
 KHRUSCHEV_Prioritize_High_Speed_Interceptors:0 "Donner la priorité aux intercepteurs à grande vitesse"
 KHRUSCHEV_Prioritize_High_Speed_Interceptors_desc:0 "Nous disposons toujours d'avions d'appui aérien polyvalents et rapprochés pour effectuer des tâches de non-interception. Nos intercepteurs devraient être uniquement des intercepteurs, et justement les meilleurs des meilleurs."
 KHRUSCHEV_The_Soviet_Army:0 "L'armée soviétique"
 KHRUSCHEV_The_Soviet_Army_desc:0 "Notre armée ne cesse de croître, mais la taille ne fait pas tout. Nous avons besoin d'une technologie moderne pour fournir à nos soldats une chance de se battre."
 KHRUSCHEV_Adopt_the_AKM:0 "Adoptez l'AKM"
 KHRUSCHEV_Adopt_the_AKM_desc:0 "L'AKM est encore une autre conception révolutionnaire du génial inventeur Mikhaïl Kalachnikov, héros de l'Union soviétique. Une conception améliorée de l'AK-47, il s'agit d'un verrou rotatif et d'un rechargement au gaz pour soulager une partie de la pression du carabinier et lui permettre de se concentrer sur l'ennemi."
 KHRUSCHEV_Modernize_Surface_to_Air_Missles:0 "Moderniser les missiles sol-air"
 KHRUSCHEV_Modernize_Surface_to_Air_Missles_desc:0 "Les SAM sont l'avenir des armes anti-aériennes. Utilisant des radars et des missiles plutôt que le jugement humain et les obus antiaériens, ils sont beaucoup plus efficaces et efficients. Cela étant dit, nous devons toujours nous assurer que nos conceptions peuvent le faire, plutôt qu'en théorie."
 KHRUSCHEV_Invest_in_the_T55:0 "Investissez dans le T55"
 KHRUSCHEV_Invest_in_the_T55_desc:0 "Le T55 sera le nouveau char de combat principal de notre corps de chars et, au moment de son développement, il est l'un des meilleurs au monde. C'est une bonne idée d'investir massivement dans sa production afin de la distribuer plus rapidement à nos troupes."
 KHRUSCHEV_Advanced_ATGM_Designs:0 "Conceptions ATGM avancées"
 KHRUSCHEV_Advanced_ATGM_Designs_desc:0 "À mesure que les chars s'améliorent, nos armes antichars évoluent également. Les missiles guidés antichar sont les nouveaux Panzerschrecks et bazookas, et nous ne devrions pas être à la traîne dans ce domaine. Nous devons créer des modèles avancés capables de détruire n'importe quel véhicule américain."
 KHRUSCHEV_The_BMP:0 "Le BMP"
 KHRUSCHEV_The_BMP_desc:0 "Le BMP-1, en anglais Infantry Fighting Vehicle-1 (IFV), fournira à nos forces un nouveau type de véhicule blindé qui leur offrira une plus grande flexibilité que jamais. Combinant la fonction de transport de troupes d'un APC avec le blindage plus lourd d'un char léger, il permettra à nos troupes d'opérer avec plus de sécurité, même sous des attaques nucléaires et chimiques."
 KHRUSCHEV_Reinforce_Ties_within_the_Socialist_World:0 "Renforcer les liens au sein du monde socialiste"
 KHRUSCHEV_Reinforce_Ties_within_the_Socialist_World_desc:0 "Nos frères communistes et socialistes sont tout ce que nous avons dans le conflit en cours avec l'Occident capitaliste et impérialiste. Aujourd'hui plus que jamais, nous devons nous serrer les coudes et réaffirmer notre engagement les uns envers les autres."
 KHRUSCHEV_Promote_Softer_Leadership_in_the_Eastern_Bloc:0 "Promouvoir un leadership plus doux dans le bloc de l'Est"
 KHRUSCHEV_Promote_Softer_Leadership_in_the_Eastern_Bloc_desc:0 "Notre sphère est souvent dépeinte par l'Occident comme dépourvue de vie et de créativité, étouffée par la menace rouge. Et, bien que ce ne soient que de sales mensonges et des calomnies, notre nation ainsi que nos amis auraient besoin d'un peu d'animation, et peut-être même d'une plus grande liberté d'expression pour notre peuple."
 KHRUSCHEV_Consolidate_Soviet_Supremacy:0 "Consolider la suprématie soviétique"
 KHRUSCHEV_Consolidate_Soviet_Supremacy_desc:0 "Il est clair que nous contrôlons le monde socialiste. Nous disposons de l'armée la plus puissante et de la plus grande influence au sein de l'ONU. Nous devons en profiter et mettre nos « amis » en ligne."
 KHRUSCHEV_Allow_Liberalization_Throughout_the_Bloc:0 "Autoriser la libéralisation dans tout le Bloc"
 KHRUSCHEV_Allow_Liberalization_Throughout_the_Bloc_desc:0 "Peut-être qu'un léger relâchement de la répression de l'ère stalinienne est nécessaire si nous voulons continuer à bénéficier du soutien de notre peuple. Permettre une pensée et un discours un peu plus libéraux ne peut pas faire de mal, n'est-ce pas ? Juste un peu."
 KHRUSCHEV_The_Soviet_Navy:0 "La marine soviétique"
 KHRUSCHEV_The_Soviet_Navy_desc:0 "Nous avons fait quelques progrès dans la modernisation de notre Marine entre la fin de la Seconde Guerre mondiale et là où nous en sommes aujourd'hui, mais cela n'est toujours pas suffisant. Même notre flotte de sous-marins est pitoyable comparée à celle des Américains."
 KHRUSCHEV_Project_627_Kit:0 "Kit Projet 627"
 KHRUSCHEV_Project_627_Kit_desc:0 "Le projet 627 est un nouveau sous-marin à longue portée de pointe, censé pouvoir lancer des missiles balistiques, donnant ainsi à notre force de dissuasion stratégique une portée beaucoup plus grande."
 KHRUSCHEV_Project_672:0 "Projet 672"
 KHRUSCHEV_Project_672_desc:0 "Le projet 672 est similaire dans son concept à celui du projet 627, mais diffère dans quelques domaines clés, tels que sa mission prévue et ses spécifications technologiques. Cependant, il sera utile de s'y pencher également."
 KHRUSCHEV_Kotlin_Class_Destroyer:0 "Destructeur de classe Kotlin"
 KHRUSCHEV_Kotlin_Class_Destroyer_desc:0 "Le destroyer de classe Kotlin sera la principale plate-forme d'escorte et d'écran de notre marine lorsque le premier lot sera terminé. Il représente un grand pas en avant pour notre flotte de surface et nous donne un navire comparable aux destroyers américains."
 KHRUSCHEV_Ka_25_Naval_Helicoptor:0 "Hélicoptère naval Ka 25"
 KHRUSCHEV_Ka_25_Naval_Helicoptor_desc:0 "L'hélicoptère Ka 25 est le premier pas dans une nouvelle direction pour notre guerre aérienne-navale. Il offre un meilleur moyen de repérer et de détruire les sous-marins ennemis et peut être lancé même depuis nos plus petits navires."
 KHRUSCHEV_Grozny_Class_Destroyer:0 "Croiseur de classe Grozny/Kynda"
 KHRUSCHEV_Grozny_Class_Destroyer_desc:0 "Nos ingénieurs ont attiré notre attention sur un nouveau modèle de croiseur radical, qui, au lieu de se concentrer sur les missions de soutien traditionnelles, transportera des missiles antinavires mortels à livrer à nos ennemis."
 KHRUSCHEV_Refine_COMECON:0 "Affiner COMECON"
 KHRUSCHEV_Refine_COMECON_desc:0 "Le COMECON est une organisation utile qui rationalise la coopération économique du bloc de l'Est, mais a quelque peu besoin de se rationaliser."
 KHRUSCHEV_Create_Permanent_Sectoral_Commissions:0 "Créer des Commissions Sectorielles Permanentes"
 KHRUSCHEV_Create_Permanent_Sectoral_Commissions_desc:0 "La création de commissions permanentes pour superviser divers projets et régions des membres du COMECON contribuera à l'efficacité de nos mesures et de nos efforts."
 KHRUSCHEV_Establish_a_CMEA_Secretariat:0 "Créer un Secrétariat du CAEM"
 KHRUSCHEV_Establish_a_CMEA_Secretariat_desc:0 "Nous avons besoin d'un poste à la tête du Conseil d'assistance économique mutuelle, de préférence l'un de nos propres hommes, pour aider à organiser et superviser les projets en cours du COMECON."
 KHRUSCHEV_Boost_the_Polish_Economy:0 "Stimuler l'économie polonaise"
 KHRUSCHEV_Boost_the_Polish_Economy_desc:0 "L'économie polonaise stagne depuis sa libération en 1945. Comme elle est l'un des membres les plus importants de notre sphère, il serait prudent de notre part de les aider."
 KHRUSCHEV_Increase_East_German_Trade:0 "Augmenter le commerce est-allemand"
 KHRUSCHEV_Increase_East_German_Trade_desc:0 "L'Allemagne de l'Est possède certains des plus grands gisements de ressources et bases manufacturières du COMECON et a cruellement besoin d'argent. Nous pouvons donc en bénéficier pour nous en obtenant leurs produits et eux en leur donnant les fonds qu'ils souhaitent."
 KHRUSCHEV_Develop_Black_Sea_Exchanges:0 "Développer les échanges en mer Noire"
 KHRUSCHEV_Develop_Black_Sea_Exchanges_desc:0 "La mer Noire est entourée de presque tous côtés par nous ou par des nations amies avec nous, et pourtant très peu de commerce la traverse. Nous devrions faciliter le passage des marchandises par là."
 KHRUSCHEV_Give_Loans_to_Hungary_and_Czechoslovakia:0 "Accorder des prêts à la Hongrie et à la Tchécoslovaquie"
 KHRUSCHEV_Give_Loans_to_Hungary_and_Czechoslovakia_desc:0 "Il semble que tous nos alliés aient désespérément besoin d'argent, en permanence. C'est frustrant, mais leur amitié (terres de lecture et ressources) est plus importante que d'économiser notre argent pour les mauvais jours."
 KHRUSCHEV_Develop_Intrabloc_Tourism:0 "Développer le tourisme intrabloc"
 KHRUSCHEV_Develop_Intrabloc_Tourism_desc:0 "Il existe de nombreux sites magnifiques, naturels et artificiels, dans toute l'Europe de l'Est, et en encourageant les citoyens de toutes les régions à voyager et à dépenser de l'argent ailleurs, nous pouvons stimuler l'économie de tous les membres du COMECON."
 KHRUSCHEV_The_Berlin_Gamble:0 "Le pari berlinois"
 KHRUSCHEV_The_Berlin_Gamble_desc:0 "Le statut de Berlin est une question qui doit être résolue en notre faveur, et rapidement. Les Américains refusent de rendre leur dernier bastion du capitalisme à l'Est, mais Berlin-Ouest constitue une grave menace pour notre sécurité. Il est temps de mettre fin au statu quo en exigeant le retrait de toutes les forces de l'OTAN de Berlin et l'annexion totale par l'Allemagne de l'Est."
 KHRUSCHEV_Promote_Intergenerational_Cohabitation_and_Solidarity:0 "Promouvoir la cohabitation intergénérationnelle et la solidarité"
 KHRUSCHEV_Promote_Intergenerational_Cohabitation_and_Solidarity_desc:0 "Un fossé générationnel se creuse rapidement dans notre nation, entre ceux qui ont combattu, souffert et sacrifié pendant la Grande Guerre patriotique et leurs enfants, qui ne connaissent que la paix, aussi fragile soit-elle. Il faut encourager ces 2 générations, aussi différentes soient-elles, à travailler ensemble."
 KHRUSCHEV_Equalize_Wages:0 "Égaliser les salaires"
 KHRUSCHEV_Equalize_Wages_desc:0 "Les hommes et les femmes ont les mêmes opportunités d'emploi dans l'Union, mais il semble que les hommes gagnent plus d'argent pour la même quantité de travail, ce qui est absurde. Nous devons garantir que l'égalité salariale prévaut dans tout notre pays."
 KHRUSCHEV_Control_Renting_and_Heating_Prices:0 "Contrôler les prix de location et de chauffage"
 KHRUSCHEV_Control_Renting_and_Heating_Prices_desc:0 "Avec l'augmentation du coût de la location d'un logement et du coût de son chauffage, de nombreuses personnes parmi les plus pauvres de notre pays ont du mal à conserver leur logement. En contrôlant les prix et en les baissant, nous pouvons garder nos citoyens à l'écart de la rue et en sécurité."
 KHRUSCHEV_Regionalize_Economic_Decision_Process:0 "Régionaliser le processus de décision économique"
 KHRUSCHEV_Regionalize_Economic_Decision_Process_desc:0 "Notre pays est trop grand pour que nous puissions élaborer des politiques économiques universelles auxquelles toutes les régions doivent adhérer. Nous devons ventiler nos décisions par région pour mieux desservir chaque région de notre pays."
 KHRUSCHEV_Mobilize_Women_and_Soliders_in_the_Workforce:0 "Mobiliser les femmes et les soldats sur le marché du travail"
 KHRUSCHEV_Mobilize_Women_and_Soliders_in_the_Workforce_desc:0 "Maintenant que nous sommes en paix, nous devons renforcer notre main-d'oeuvre qualifiée pour améliorer nos industries et nos services civils. Encourager les soldats et les femmes à trouver du travail dans les usines y parviendra."
 KHRUSCHEV_Comfort_for_the_People:0 "Confort pour le peuple"
 KHRUSCHEV_Comfort_for_the_People_desc:0 "En tant que nation, nous manquons cruellement de biens de consommation et de produits de luxe. Nos concitoyens peuvent acheter de la nourriture et des vêtements de base, et seulement un peu plus. Nous voulons que nos citoyens vivent dans le confort et non dans l'austérité. Nous devons donc redoubler d'efforts pour changer cette situation."
 KHRUSCHEV_Encourage_Growth_of_the_Automobile_Industry:0 "Encourager la croissance de l'industrie automobile"
 KHRUSCHEV_Encourage_Growth_of_the_Automobile_Industry_desc:0 "Les voitures et les bus sont importants pour la société civile moderne. C'est un fait. Les chevaux et les chariots sont obsolètes et nous ne devrions plus les utiliser."
 KHRUSCHEV_Enhance_Synthetic_Fiber_Production:0 "Améliorer la production de fibres synthétiques"
 KHRUSCHEV_Enhance_Synthetic_Fiber_Production_desc:0 "En améliorant notre production de fibres et de tissus artificiels, nous pouvons réduire nos besoins en exportations en provenance de pays étrangers et être plus autosuffisants."
 KHRUSCHEV_Expand_Mineral_Fertilizer_Output:0 "Augmenter la production d'engrais minéraux"
 KHRUSCHEV_Expand_Mineral_Fertilizer_Output_desc:0 "Nous devrions augmenter la quantité d'engrais minéraux que nous produisons afin que nos fermes puissent les utiliser et être plus productives, donnant ainsi un coup de pouce à notre secteur agricole."
 KHRUSCHEV_The_Fate_of_the_Economic_Thaw:0 "Le sort du dégel économique"
 KHRUSCHEV_The_Fate_of_the_Economic_Thaw_desc:0 "Jusqu'à présent, nos vastes politiques de réforme économique et de modernisation ont fait des merveilles pour notre population et nos industries et portent leurs fruits. Surfons sur cette vague de prospérité pour parvenir à une reprise économique durable."
 KHRUSCHEV_Modernize_Obsolete_Machine_Tools:0 "Moderniser les machines-outils obsolètes"
 KHRUSCHEV_Modernize_Obsolete_Machine_Tools_desc:0 "Un trop grand nombre de nos ouvriers d'usine sont obligés d'utiliser de vieilles machines-outils qui pourraient même être antérieures à la Seconde Guerre mondiale. Cela inhibe leur productivité et donc l'ensemble de notre chaîne d'approvisionnement. Cette situation doit donc changer."
 KHRUSCHEV_Increase_Mechanization_of_Industry:0 "Accroître la mécanisation de l'industrie"
 KHRUSCHEV_Increase_Mechanization_of_Industry_desc:0 "En augmentant le niveau de notre mécanisation industrielle, nous pouvons améliorer considérablement la production, l'efficacité et l'efficience de nos usines."
 KHRUSCHEV_Launch_Engineer_Training_Programs:0 "Programmes de formation d'ingénieur de lancement"
 KHRUSCHEV_Launch_Engineer_Training_Programs_desc:0 "Notre pays manque cruellement d'ingénieurs, ce qui nuit à notre progrès industriel et technologique. C'est pourquoi, en créant des écoles de formation spécialisées, nous devrions être en mesure d'y remédier."
 KHRUSCHEV_Lift_Heaviest_Tax_Burdens_on_Farmers:0 "Supprimer les charges fiscales les plus lourdes pesant sur les agriculteurs"
 KHRUSCHEV_Lift_Heaviest_Tax_Burdens_on_Farmers_desc:0 "Nos agriculteurs ont dû subir des impôts exorbitants, tant sur leur production que sur leurs revenus, et nombre d'entre eux se retrouvent en difficulté financière. Nous devons alléger un peu la pression qui pèse sur eux."
 KHRUSCHEV_Rationalized_Seed_Production:0 "Production de semences rationalisée"
 KHRUSCHEV_Rationalized_Seed_Production_desc:0 "Notre production de semences est partout. Certains fabricants ne prennent même pas la peine de vérifier quelles semences ils distribuent, et tandis que d'autres le font, leur qualité est épouvantable. Nous devons résoudre ce problème immédiatement."
 KHRUSCHEV_Supply_Farmers_with_New_Machinery:0 "Fournir aux agriculteurs de nouvelles machines"
 KHRUSCHEV_Supply_Farmers_with_New_Machinery_desc:0 "Beaucoup de nos agriculteurs labourent encore avec des boeufs et récoltent à la main. Cela prend du temps et est inefficace pour eux, et mauvais pour nous car il leur faut plus de temps pour acheminer les produits alimentaires vers le marché. En dotant les agriculteurs de machines et d'équipements modernes, nous pouvons changer cela."
 KHRUSCHEV_Open_Up_New_Fields:0 "Ouvrez de nouveaux champs"
 KHRUSCHEV_Open_Up_New_Fields_desc:0 "En défrichant les terres pour de nouveaux champs et en les préparant pour les cultures, nous pouvons accélérer le processus agricole et augmenter notre production alimentaire."
 KHRUSCHEV_Establish_Agrarian_Banks:0 "Créer des banques agraires"
 KHRUSCHEV_Establish_Agrarian_Banks_desc:0 "Nos agriculteurs ont besoin d'une banque fiable et conviviale vers laquelle se tourner pour obtenir un prêt en cas de besoin, ce qui, pour eux, arrive souvent. La création de banques agraires spéciales comblera un vide dans notre économie."
 KHRUSCHEV_Further_Tax_Reliefs_on_Private_Plots:0 "Allégements fiscaux supplémentaires sur les parcelles privées"
 KHRUSCHEV_Further_Tax_Reliefs_on_Private_Plots_desc:0 "Nous avons déjà accordé des allégements fiscaux à nos agriculteurs, mais les faits ont démontré que cela ne suffit pas. Nous devons aller plus loin dans leur aide."
 KHRUSCHEV_Decentralize_Agricultural_Management:0 "Décentraliser la gestion agricole"
 KHRUSCHEV_Decentralize_Agricultural_Management_desc:0 "En décentralisant la gestion agricole, nous pouvons aider nos agriculteurs à s'approvisionner plus rapidement et à livrer de la nourriture plus facilement."
 KHRUSCHEV_Raise_Over_the_Quota_Rewards:0 "Augmentez les récompenses au-delà du quota"
 KHRUSCHEV_Raise_Over_the_Quota_Rewards_desc:0 "Notre industrie agricole est basée sur un système de quotas, qui fixe la quantité de nourriture que chaque ferme doit produire chaque année. Pour encourager les agriculteurs à être plus efficaces, nous devrions augmenter les récompenses en cas de dépassement des quotas."
 KHRUSCHEV_Erase_Kolkhozy_Long_Term_Debts:0 "Effacer les dettes à long terme des Kolkhozes"
 KHRUSCHEV_Erase_Kolkhozy_Long_Term_Debts_desc:0 "Les kolkhozes sont les fermes collectives que notre gouvernement a créées pour fournir davantage de nourriture à notre peuple. Malheureusement, la plupart ont besoin d'un prêt important et sont donc lourdement endettés. Nous devrions effacer cette dette pour les aider."
 KHRUSCHEV_Expand_Central_Asian_Cotton_Fields:0 "Développer les champs de coton d'Asie centrale"
 KHRUSCHEV_Expand_Central_Asian_Cotton_Fields_desc:0 "Dans les plaines et steppes d'Asie centrale, notamment autour de la mer d'Aral, se trouvent de vastes champs de coton. Nous devons les développer et les exploiter davantage au profit de notre économie d'exportation."
 KHRUSCHEV_Favor_Polyculture:0 "Favoriser la polyculture"
 KHRUSCHEV_Favor_Polyculture_desc:0 "La polyculture - la pratique consistant à cultiver plusieurs plantes dans le même espace à la fois pour imiter la nature - s'est avérée être une théorie solide et productive par nos scientifiques, et c'est une théorie que nous devrions adopter."
 KHRUSCHEV_Dig_the_Karakum_Canal:0 "Creusez le canal du Karakoum"
 KHRUSCHEV_Dig_the_Karakum_Canal_desc:0 "Le canal du Karakoum, une fois achevé, sera l'un des plus grands au monde et transportera 13 kilomètres cubes d'eau par an depuis le fleuve Amou-Daria à travers le désert du Karakoum au Turkménistan."
 KHRUSCHEV_Preserve_Traditional_Agriculture:0 "Préserver l'agriculture traditionnelle"
 KHRUSCHEV_Preserve_Traditional_Agriculture_desc:0 "Malgré toute notre modernisation dans le domaine agricole, il reste encore une place pour les pratiques traditionnelles, notamment dans les zones plus rurales."
 KHRUSCHEV_Grant_Larger_Autonomy_to_Kolkhozes:0 "Accorder une plus grande autonomie aux kolkhozes"
 KHRUSCHEV_Grant_Larger_Autonomy_to_Kolkhozes_desc:0 "Les kolkhozes, bien que responsables devant l'État, devraient bénéficier de plus d'autonomie afin que chacun puisse déterminer les pratiques qui lui conviennent le mieux."
 KHRUSCHEV_Establish_Local_Food_Networks:0 "Établir des réseaux alimentaires locaux"
 KHRUSCHEV_Establish_Local_Food_Networks_desc:0 "Chaque petite région de notre pays dépend de sa nourriture provenant d'endroits éloignés, ce qui est mauvais pour toutes les personnes impliquées. Nous devrions créer de petits réseaux alimentaires semi-indépendants."
 KHRUSCHEV_Favor_Quality_Farmland:0 "Favoriser des terres agricoles de qualité"
 KHRUSCHEV_Favor_Quality_Farmland_desc:0 "Jusqu'à présent, la quantité plutôt que la qualité a été notre principe directeur. Plus il y a de terres, mieux c'est, quelle que soit la capacité innée à soutenir la vie végétale et la croissance des cultures. Cette situation est imprudente et improductive et devrait être inversée."
 KHRUSCHEV_Create_Massive_Agricultural_Complexes:0 "Créer des complexes agricoles massifs"
 KHRUSCHEV_Create_Massive_Agricultural_Complexes_desc:0 "Nous possédons de vastes étendues de terres et il serait dommage de les gaspiller. Les grands complexes agricoles tentaculaires constituent le meilleur moyen d'atteindre notre objectif de quasi-autosuffisance agricole."
 KHRUSCHEV_Expand_Storage_Facilities:0 "Agrandir les installations de stockage"
 KHRUSCHEV_Expand_Storage_Facilities_desc:0 "Nous créons plus de nourriture, ce qui est bien, mais nous manquons d'endroits où la mettre, ce qui n'est... Pas aussi bon. Il est évident que cette situation doit changer le plus rapidement possible."
 KHRUSCHEV_Large_Scale_Maize_Production:0 "Production de maïs à grande échelle"
 KHRUSCHEV_Large_Scale_Maize_Production_desc:0 "Le maïs est une plante merveilleuse. Il est rustique, peut pousser n'importe où et est incroyablement nourrissant et rassasiant. En tant que telle, c'est la culture idéale à cultiver pour une masse de personnes affamées."
 KHRUSCHEV_Encourage_Higher_Quotas:0 "Encourager des quotas plus élevés"
 KHRUSCHEV_Encourage_Higher_Quotas_desc:0 "Nos agriculteurs travaillent dur, mais cela ne suffit pas. Nous leur avons accordé des répits et de l'aide, et il est maintenant temps pour eux de nous rendre la pareille et de préparer davantage de nourriture."
 KHRUSCHEV_Promote_Agrarian_Propaganda:0 "Promouvoir la propagande agraire"
 KHRUSCHEV_Promote_Agrarian_Propaganda_desc:0 "Nous devons faire savoir à nos citoyens les progrès que nous avons réalisés dans ce département, afin qu'ils puissent être assurés qu'ils n'auront pas faim."
 KHRUSCHEV_Expand_Fertilizer_Usa:0 "Augmenter l'utilisation des engrais"
 KHRUSCHEV_Expand_Fertilizer_Usa_desc:0 "En augmentant l'utilisation des engrais, nous augmenterons la productivité et l'efficacité de nos agriculteurs."
 KHRUSCHEV_Crackdown_on_the_Black_Market:0 "Répression du marché noir"
 KHRUSCHEV_Crackdown_on_the_Black_Market_desc:0 "Le marché noir et le milieu criminel qui lui correspond sont tous deux bien vivants et constituent des menaces qui rongent notre société. Nous devons arrêter cela."
 KHRUSCHEV_Finalize_Agricultural_Collectivization:0 "Finaliser la collectivisation agricole"
 KHRUSCHEV_Finalize_Agricultural_Collectivization_desc:0 "Il est temps de terminer ce que nos prédécesseurs ont commencé. L'agriculture est vitale pour la santé de notre Union et doit donc être totalement supervisée par le gouvernement et gérée par des fermes collectives."
 KHRUSCHEV_A_Responsible_Agrarian_Socialism:0 "Un socialisme agraire responsable"
 KHRUSCHEV_A_Responsible_Agrarian_Socialism_desc:0 "Tous nos efforts portent leurs fruits et notre secteur agricole rebondit enfin. Espérons que cela restera ainsi pour de bon."
 KHRUSCHEV_Overtax_Remaining_Private_Livestock:0 "Surtaxation du bétail privé restant"
 KHRUSCHEV_Overtax_Remaining_Private_Livestock_desc:0 "Même si la majeure partie de notre cheptel est détenue par des collectifs, certains propriétaires tenaces résistent. Peut-être que le fait de devoir payer des taxes excessives et brutales pour posséder ces animaux contribuera à les convaincre."
 KHRUSCHEV_Forbid_Urban_Meat_Production:0 "Interdire la production urbaine de viande"
 KHRUSCHEV_Forbid_Urban_Meat_Production_desc:0 "La production urbaine de viande rendra nos belles villes sales et puantes de sang et de mort. Ce ne sera pas acceptable."
 KHRUSCHEV_Transfer_Livestock_Ownership_to_Kolkhozy:0 "Transférer la propriété du bétail à Kolkhozy"
 KHRUSCHEV_Transfer_Livestock_Ownership_to_Kolkhozy_desc:0 "Le bétail, tout comme les plantes et les cultures, est vital pour notre peuple et ne peut donc pas être confié à des agriculteurs individuels uniquement pour leur propre gain personnel."
 KHRUSCHEV_Allow_Small_Private_Flocks:0 "Autoriser les petits troupeaux privés"
 KHRUSCHEV_Allow_Small_Private_Flocks_desc:0 "Idéalement, tous les troupeaux appartiendraient à l'État, mais nous sommes conscients que cela sera difficile à réaliser. Les agriculteurs seront autorisés à posséder du bétail, mais en plus petit nombre qu'auparavant."
 KHRUSCHEV_Encourage_Private_Vegetable_Gardens:0 "Encourager les potagers privés"
 KHRUSCHEV_Encourage_Private_Vegetable_Gardens_desc:0 "Si chacun cultive ses propres légumes, nos agriculteurs pourront se concentrer sur la culture la plus importante : le maïs."
 KHRUSCHEV_Increase_Domestic_Food_Production:0 "Augmenter la production alimentaire nationale"
 KHRUSCHEV_Increase_Domestic_Food_Production_desc:0 "Nos agriculteurs locaux ne produisent pas assez de maïs. Cela ne correspond pas aux vues agricoles de Khrouchtchev, qui placent le maïs comme priorité numéro un, nous devons donc les inciter à produire davantage de maïs."
 KHRUSCHEV_Regulate_Ailments_Prices:0 "Réguler les prix des maladies"
 KHRUSCHEV_Regulate_Ailments_Prices_desc:0 "Actuellement, le marché des médicaments connaît une forte demande et une offre faible, ce qui fait monter en flèche le prix des médicaments, même les plus simples. Nous devons réguler le marché pour que nos populations puissent être en bonne santé sans avoir faim. "
 KHRUSCHEV_Integrate_the_Informal_Economy:0 "Intégrer l'économie informelle"
 KHRUSCHEV_Integrate_the_Informal_Economy_desc:0 "Une grande partie du commerce s'effectue « hors réseau » ou via un système de troc. C'est obsolète et cela retire également de l'argent de notre économie, nous devrions donc absorber ces transactions le plus tôt possible."
 KHRUSCHEV_Allow_Farmers_to_Buy_Their_Own_Material:0 "Permettre aux agriculteurs d'acheter leur propre matériel"
 KHRUSCHEV_Allow_Farmers_to_Buy_Their_Own_Material_desc:0 "Parfois, l'homme qui cultive le maïs sait plus ce dont il a besoin pour produire du maïs que la personne qui lui dit de le faire. Nous devrions permettre aux producteurs de maïs d'acheter leur propre matériel de culture du maïs."
 KHRUSCHEV_Abolish_Machine_Tractor_Stations:0 "Supprimer les stations de tracteurs de machines"
 KHRUSCHEV_Abolish_Machine_Tractor_Stations_desc:0 "Les MTS sont des entreprises d'État chargées de la propriété et de l'entretien des machines agricoles utilisées dans les kolkhozes. Cela semblait être une bonne idée, mais cela conduit à une répartition déséquilibrée et injuste des machines à fabriquer le maïs, nous devrions donc les abolir."
 KHRUSCHEV_Increase_Fodder_Production:0 "Augmenter la production fourragère"
 KHRUSCHEV_Increase_Fodder_Production_desc:0 "Malheureusement, nous ne pouvons pas cultiver uniquement du maïs. Nos animaux aussi ont besoin de manger quelque chose, et ils mangent beaucoup. Nous devons augmenter notre production d'aliments pour animaux afin que nos animaux ne meurent pas."
 KHRUSCHEV_Improve_Slaughterhouse_Facilities:0 "Améliorer les installations des abattoirs"
 KHRUSCHEV_Improve_Slaughterhouse_Facilities_desc:0 "L'offre et la demande de viande sont toutes deux élevées, mais nous avons du mal à transformer la viande d'animaux vivants en quelque chose d'un peu plus savoureux en raison d'un petit système de boucherie et d'abattoir. Nous avons besoin de plus d'installations si nos populations veulent compléter leur maïs avec un peu de protéines."
 KHRUSCHEV_Favor_Livestock_Multiplication:0 "Favoriser la multiplication du bétail"
 KHRUSCHEV_Favor_Livestock_Multiplication_desc:0 "Plutôt que d'utiliser nos troupeaux existants pour la viande ou les produits laitiers, nous allons les concentrer simplement sur la production de plus d'animaux. Même si nos concitoyens ne pourront plus profiter du lait avec leur maïs maintenant, cela leur profitera plus tard."
 KHRUSCHEV_Replace_Hostile_Officials:0 "Remplacer les responsables hostiles"
 KHRUSCHEV_Replace_Hostile_Officials_desc:0 "Les échelons supérieurs de l'administration sont remplis de vestiges de Staline et, pire encore, de partisans de Beria. Nous devons nous assurer que nos fonctionnaires et fonctionnaires nous soutiennent."
 KHRUSCHEV_Force_Malenkovs_Resignation:0 "Forcer la démission de Malenkov"
 KHRUSCHEV_Force_Malenkovs_Resignation_desc:0 "Le camarade Malenkov constitue une menace pour la sécurité de notre nouveau régime. Il a toujours été proche de Beria (ce sale traître), et les rumeurs disent qu'il collaborait avec lui pour prendre la relève une fois Staline décédé. Il doit partir."
 KHRUSCHEV_XXth_Congress_of_the_CPSU:0 "XXe Congrès du PCUS"
 KHRUSCHEV_XXth_Congress_of_the_CPSU_desc:0 "Maintenant que notre position est assurée et que le parti a retrouvé son ancienne importance, il est temps de convoquer à nouveau le Congrès du PCUS, qui se réunira pour une 20e fois historique."
 KHRUSCHEV_Reduce_Criminal_Sentences:0 "Réduire les peines pénales"
 KHRUSCHEV_Reduce_Criminal_Sentences_desc:0 "Sous Staline, les gens recevaient les châtiments les plus sévères pour les crimes les plus mineurs. Cela a abaissé le moral de notre peuple et nous a fait perdre sa confiance. Nous devons montrer que nous travaillons à une véritable justice, que nous ayons réellement l'intention de l'obtenir ou non."
 KHRUSCHEV_Remove_Monuments_to_Stalin:0 "Supprimer les monuments à Staline"
 KHRUSCHEV_Remove_Monuments_to_Stalin_desc:0 "Les monuments et les statues du camarade Staline se trouvent partout en URSS, en grande partie grâce à ses propres efforts. Nous ne voulons pas que notre peuple le déifie, car il est mort et nous avons plutôt besoin qu'il nous aime. Cela étant, nous devons malheureusement supprimer certains de ces hommages."
 KHRUSCHEV_Reveal_the_Factitious_Doctors_Plot:0 "Révélez le complot factice des médecins"
 KHRUSCHEV_Reveal_the_Factitious_Doctors_Plot_desc:0 "Le Complot du Docteur était un tas de maïs concocté par un vieux Staline paranoïaque près de son lit de mort dans un rêve fiévreux. En conséquence, tous les médecins éminents de Moscou - pour la plupart juifs, tous innocents - ont été exécutés. C'est une mauvaise image pour le gouvernement et Moscou n'a pas de médecins. Nous devons dire au public que nous n'avons aucune part dans cette affaire."
 KHRUSCHEV_Gain_the_Backing_of_the_Red_Army:0 "Obtenez le soutien de l'Armée rouge"
 KHRUSCHEV_Gain_the_Backing_of_the_Red_Army_desc:0 "L'Armée rouge exerce une grande influence sur la politique soviétique moderne, comme le montre l'aide précieuse apportée par le maréchal Joukov à notre accession au pouvoir. Toutefois, nous devons obtenir le soutien du reste de l'armée si nous voulons réellement être en sécurité."
 KHRUSCHEV_Loosen_Freedom_of_Speach_Restrictions:0 "Assouplir les restrictions à la liberté d'expression"
 KHRUSCHEV_Loosen_Freedom_of_Speach_Restrictions_desc:0 "Pendant des décennies, la liberté d'expression n'a été qu'un rêve pour nombre de nos citoyens, alors que le NKVD et maintenant le KGB répriment tout signe de dissidence politique. Cependant, il est peut-être temps d'assouplir les restrictions."
 KHRUSCHEV_Promote_Limited_Cultural_Liberalization:0 "Promouvoir une libéralisation culturelle limitée"
 KHRUSCHEV_Promote_Limited_Cultural_Liberalization_desc:0 "Nous avons essayé au fil des années de créer et de maintenir une culture et un mode de pensée socialistes soviétiques, mais aussi diversifiée que soit notre Union, certaines régions ne l'ont pas si bien adopté. Nous devrions leur permettre de conserver leurs anciennes cultures et même de les laisser prospérer."
 KHRUSCHEV_Counter_the_Anti_Party_Group:0 "Contrer le groupe anti-parti"
 KHRUSCHEV_Counter_the_Anti_Party_Group_desc:0 "Le Groupe Anti-Parti est, comme son nom l'indique, un groupe qui s'oppose et condamne la domination de Nikita Khrouchtchev au sein du PCUS. Dirigés par Malenkov, le ministre des Affaires étrangères Dmitri Chepilov et le haut fonctionnaire Lazar Kaganovitch, ils ont récemment prévu d'évincer du pouvoir notre dirigeant bien-aimé. Heureusement, nous avons eu vent de ce complot et pouvons anticiper leur tentative."
 KHRUSCHEV_Ensure_Khrushchevs_Socialism_Existence:0 "Garantir l'existence continue du khrouchtchevisme"
 KHRUSCHEV_Ensure_Khrushchevs_Socialism_Existence_desc:0 "Il est désormais évident pour tous que Nikita Khrouchtchev est non seulement là pour rester, mais qu'il est également un véritable socialiste et un dirigeant tout à fait approprié pour notre grande Union. Il aura sûrement une bonne emprise à la tête de l'URSS pour les années à venir."
 KHRUSCHEV_Crackdown_on_the_Russian_Orthodox_Church:0 "Répression contre l'Église orthodoxe russe"
 KHRUSCHEV_Crackdown_on_the_Russian_Orthodox_Church_desc:0 "L'Église orthodoxe russe est une épine dans notre pied depuis des années, promouvant l'opium des masses et endoctrinant notre peuple. Il est temps qu'ils apprennent leur place."
 KHRUSCHEV_Exile_Clergymen:0 "Ecclésiastiques en exil"
 KHRUSCHEV_Exile_Clergymen_desc:0 "Certains prêtres parvenus ont refusé de désamorcer leur rhétorique religieuse, nous serons donc obligés d'intensifier nos réponses. Un séjour en Sibérie devrait leur faire des merveilles."
 KHRUSCHEV_Close_Monasteries:0 "Fermer les monastères"
 KHRUSCHEV_Close_Monasteries_desc:0 "Les monastères ne sont rien d'autre que des centres de propagande de masse et d'endoctrinement et doivent être traités comme tels. Nous ne pouvons pas permettre que des institutions aussi dangereuses restent ouvertes."
 KHRUSCHEV_Imprison_Religous_Leaders:0 "Emprisonner les chefs religieux"
 KHRUSCHEV_Imprison_Religous_Leaders_desc:0 "En emprisonnant d'importantes figures religieuses - juives, chrétiennes, etc. - nous couperons la tête du serpent qui s'enroule lentement autour de notre grande Union."
 KHRUSCHEV_Open_Psychiatric_Asylums_for_Opponents:0 "Des asiles psychiatriques ouverts aux opposants"
 KHRUSCHEV_Open_Psychiatric_Asylums_for_Opponents_desc:0 "Un moyen pratique de faire disparaître des opposants religieux et politiques est de demander à un psychiatre ordonné et employé par l'État de les déclarer cliniquement fous et de les envoyer dans un asile."
 KHRUSCHEV_End_Cultural_Indulgences:0 "Mettre fin aux indulgences culturelles"
 KHRUSCHEV_End_Cultural_Indulgences_desc:0 "Notre tentative de libéralisation culturelle renouvelée a échoué. Notre peuple a pris notre gracieux don et l'a utilisé pour diffamer notre gouvernement, calomnier notre nation et embarrasser notre premier ministre. S'ils n'utilisent pas notre don à bon escient, ils ne l'auront plus."
 KHRUSCHEV_Renewed_Communist_Power_and_Ideals:0 "Pouvoir et idéaux communistes renouvelés"
 KHRUSCHEV_Renewed_Communist_Power_and_Ideals_desc:0 "Une fois nos rivaux politiques et idéologiques écartés et la ferveur patriotique communiste balayant la nation, nous sommes soutenus par une grande vague d'admiration et de soutien de la part de notre peuple, sur laquelle nous pouvons nous lancer dans la bataille imminente pour le sort de l'humanité."
 KHRUSCHEV_Appoint_Molotov_Ambassador_of_Mongolia:0 "Nommer l'ambassadeur Molotov de Mongolie"
 KHRUSCHEV_Appoint_Molotov_Ambassador_of_Mongolia_desc:0 "Molotov n'est plus chef du gouvernement, mais il reste dangereux. Nous ne pouvons pas simplement l'exécuter ou l'exiler, car il est trop populaire, mais un responsable entreprenant a suggéré ce qui suit : le nommer ambassadeur en Mongolie. En fait, c'est un exil, car il devra vivre dans cette steppe lointaine la majeure partie de ses jours."
 KHRUSCHEV_Exile_Kaganovitch_and_Shepilov_Beyond_the_Urals:0 "Exilez Kaganovitch et Shepilov au-delà de l'Oural"
 KHRUSCHEV_Exile_Kaganovitch_and_Shepilov_Beyond_the_Urals_desc:0 "Kaganovich et Shepilov méritent pire que l'exil pour leur rôle dans le coup d'État raté du Groupe anti-parti, mais l'exil est ce qu'ils recevront. Nous espérons qu'ils apprécieront ce voyage en Sibérie !"
 KHRUSCHEV_Limit_Public_Officials_Terms:0 "Limiter les conditions des agents publics"
 KHRUSCHEV_Limit_Public_Officials_Terms_desc:0 "Trop de responsables de partis de la vieille garde et à l'esprit étroit s'accrochent à leurs positions et freinent nos efforts pour améliorer l'Union et faire parti avec eux. Limiter la durée des mandats des fonctionnaires les supprimera lentement, mais mieux vaut tard que jamais."
 KHRUSCHEV_Prepare_a_New_Generation_of_Cadres:0 "Préparer une nouvelle génération de cadres"
 KHRUSCHEV_Prepare_a_New_Generation_of_Cadres_desc:0 "Maintenant que nous avons commencé à limoger les anciens responsables, nous avons besoin de nouveaux membres énergiques du parti pour les remplacer. Heureusement, nos Komsomolets enthousiastes sont plus que prêts à assumer le rôle de service public au sein de l'Union."
 KHRUSCHEV_Supply_the_Democratic_Republic_of_Vietnam:0 "Alimenter la République Démocratique du Vietnam"
 KHRUSCHEV_Supply_the_Democratic_Republic_of_Vietnam_desc:0 "Les Nord-Vietnamiens se battent depuis longtemps pour leur survie contre le vieux monde impérialiste occidental et, malgré leur désavantage technologique, ils ont obtenu des résultats spectaculaires. Imaginez à quel point ils feront mieux avec des jets et des équipements modernes."
 KHRUSCHEV_State_Visit_to_Jakarta:0 "Visite d'État à Jakarta"
 KHRUSCHEV_State_Visit_to_Jakarta_desc:0 "Nous avons suivi avec beaucoup d'intérêt la carrière du nouveau gouvernement indonésien et de son chef, Sukarno, et avons décidé qu'ils constitueraient un allié précieux dans le Pacifique Sud-Est. Une visite d'État de notre Première contribuera grandement à renforcer nos relations."
 KHRUSCHEV_Subsidize_the_Kim_Regime:0 "Subventionner le régime Kim"
 KHRUSCHEV_Subsidize_the_Kim_Regime_desc:0 "Kim Il Sung a admirablement dirigé son pays dans des moments difficiles, tant en paix qu'en guerre, et possède toutes les caractéristiques d'un grand leader charismatique. Nous devrions aider à maintenir son régime à flot."
 KHRUSCHEV_Depose_Kim_il_Sung:0 "Déposer Kim Il Sung"
 KHRUSCHEV_Depose_Kim_il_Sung_desc:0 "Kim Il Sung a raté la guerre de Corée, a permis à l'OTAN de prendre pied à l'Est et n'a connu depuis que des échecs. Il doit partir, maintenant."
 KHRUSCHEV_Expand_Indochinese_Guerilla_Operations:0 "Développer les opérations de guérilla indochinoise"
 KHRUSCHEV_Expand_Indochinese_Guerilla_Operations_desc:0 "Le Vietcong et les Khmers rouges mènent déjà avec succès des campagnes de guérilla contre les capitalistes, mais cela ne veut pas dire qu'ils n'ont pas besoin d'aide. Les armes et les conseillers soviétiques les aideraient grandement dans leur quête de liberté."
 KHRUSCHEV_Reach_Out_to_Thai_Communists:0 "Contactez les communistes thaïlandais"
 KHRUSCHEV_Reach_Out_to_Thai_Communist_desc:0 "Bien que la Thaïlande aide l'Occident à combattre le Vietcong opprimé et d'autres combattants de la liberté en Indochine, elle compte elle-même un grand nombre de partisans communistes. C'est peut-être quelque chose que nous pouvons utiliser à notre avantage."
 KHRUSCHEV_Repress_Hungarian_Counter_Revolutionaries:0 "Réprimer les contre-révolutionnaires hongrois"
 KHRUSCHEV_Repress_Hungarian_Counter_Revolutionaries_desc:0 "La République populaire hongroise connaît de nombreux troubles internes, alors que des contre-révolutionnaires traîtres tentent de prendre le contrôle du gouvernement. Il faut les réprimer à tout prix."
 KHRUSCHEV_Condemn_Hoxha:0 "Condamner Hoxha"
 KHRUSCHEV_Condemn_Hoxha_desc:0 "Enver Hoxha, le leader albanais, est faible et a totalement mal géré la crise actuelle. Nous devons faire connaître notre mécontentement à son égard dans tout le bloc de l'Est."
 KHRUSCHEV_Reconcile_with_Tito:0 "Réconcilier avec Tito"
 KHRUSCHEV_Reconcile_with_Tito_desc:0 "Nos petites querelles avec le maréchal Tito ont assez duré. En tant que camarade socialiste, il est notre ami, même si nous sommes en désaccord."
 KHRUSCHEV_Cut_Ties_with_Mao:0 "Couper les liens avec Mao"
 KHRUSCHEV_Cut_Ties_with_Mao_desc:0 "Mao est diamétralement opposé à Tito. Il est cupide, avide de pouvoir, agressif et constitue une menace pour notre sécurité à l'Est. Malheureusement, nous et les Chinois allons désormais suivre notre propre chemin."
 KHRUSCHEV_Form_the_Warsaw_Pact:0 "Former le Pacte de Varsovie"
 KHRUSCHEV_Form_the_Warsaw_Pact_desc:0 "La structure de l'alliance politique et militaire COMINFORM/COMINTERN est dépassée et désuète, surtout si on la compare à la haute organisation de l'OTAN. Il est temps de renommer notre alliance, de lui donner un nouveau départ et d'affronter le monde ensemble sous le nom de Pacte de Varsovie."
 KHRUSCHEV_Improve_Mobile_AA:0 "Améliorer l'AA mobile"
 KHRUSCHEV_Improve_Mobile_AA_desc:0 "L'amélioration de nos unités mobiles AA existantes augmentera notre capacité à protéger nos citoyens, nos villes et nos soldats contre les attaques aériennes ennemies."
 KHRUSCHEV_Project_659:0 "Projet 659"
 KHRUSCHEV_Project_659_desc:0 "Les sous-marins de la classe Echo du Projet 659 seront des sous-marins de croisière nucléaires de pointe, capables d'aller presque n'importe où pour lancer nos missiles."
