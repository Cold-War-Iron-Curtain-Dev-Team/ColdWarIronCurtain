#DEGASPERI V REWORK
ita_Gasperi_V.1.d:0 "Mai 1949, et l'Italie reste dans un état fragile. La guerre a laissé la nation en ruines, mais sous la direction d'Alcide De Gasperi, il y a un espoir de renouveau. Son cinquième gouvernement a présenté des propositions ambitieuses pour reconstruire l'économie, renforcer le système de protection sociale et assurer la place de l'Italie parmi les démocraties occidentales. Cependant, ces projets ne sont encore que des idées pour l'instant, face à la résistance politique, aux contraintes économiques et à l'incertitude quant à l'alignement futur de l'Italie. Le gouvernement de De Gasperi trouvera-t-il le soutien nécessaire pour faire avancer ces réformes, ou l'Italie restera-t-elle prisonnière de l'instabilité et de l'indécision ?"
#PELLA REWORK
ita_Degasperi_VI.1.d: "Lors des élections politiques organisées avec la nouvelle loi électorale, qualifiée de loi de l'arnaque par ses opposants, les partis centristes « apparentés » (DC-PLI-PSDI-PRI) n'ont pas réussi à obtenir le bonus majoritaire. Ils obtinrent cependant une faible majorité au Parlement sur laquelle De Gasperi comptait pour obtenir la confiance nécessaire. En outre, il a également réussi à former uniquement un bloc DC au sein du gouvernement" 
ita_degasperiVI_fail.1.d: "Aujourd'hui, lorsque De Gasperi s'est présenté à la Chambre des Députés, le gouvernement De Gasperi VIII a été vaincu et le Premier ministre a été contraint de démissionner. C'est la première fois qu'un gouvernement républicain ne gagne pas la confiance en se présentant aux Chambres et c'est aussi la dernière dirigée par De Gasperi"
ita_trieste_crisis.1.d: "SAS"
#FANFANI I REWORK
ita_fanfani_first.1.d:0 "Dans un développement politique surprenant, le Premier ministre italien Giuseppe Pella a annoncé sa démission à la suite d'une série de différends avec son parti, la Démocratie chrétienne. Pella, qui occupe le poste de Premier ministre depuis 1953, a fait face à une opposition significative de la part de personnalités clés du parti de la Démocratie chrétienne. La direction du parti s'est opposée aux changements proposés, arguant qu'un tel remaniement déstabiliserait le gouvernement. Le gouvernement et le parti de la Démocratie Chrétienne. Le président Luigi Einaudi devrait entamer des consultations pour nommer un nouveau Premier ministre capable de jouir de la confiance du Parlement et de guider le parti à travers cette période de troubles."
ita_fanfani_second.1.d:0 " Amintore Fanfani a prêté serment aujourd'hui en tant que Premier ministre par le président Luigi Einaudi au Palais du Quirinal. Fanfani a eu une réunion cruciale avec Donato Menichella, le président de la Banque d'Italie. La discussion a porté sur la situation économique de l'Italie, abordant des questions urgentes telles que l'inflation, la dette publique et les stratégies de croissance économique. Cet engagement immédiat a souligné l'engagement de Fanfani à s'attaquer de front aux défis économiques du pays."
########1949s events
ita_graziani.1.d:0 "Le procès très attendu de Rodolfo Graziani, ancien maréchal italien et figure clé du régime fasciste, s'est ouvert aujourd'hui. Graziani fait face à des accusations de crimes de guerre et de crimes contre l'humanité pour ses actions lors des campagnes coloniales italiennes en Afrique et sa collaboration avec l'Allemagne nazie pendant la Seconde Guerre mondiale. Graziani, connu sous le nom de « le boucher d'Éthiopie », est accusé d'avoir ordonné des exécutions massives, des déportations et d'autres atrocités lors de l'invasion et de l'occupation de l'Éthiopie par l'Italie de 1935 à 1941. Il est également accusé de collaborer avec les forces allemandes dans la répression des mouvements de résistance en Italie au cours des dernières années de la guerre. Le procès, qui s'est tenu à Rome, a suscité une attention considérable tant au niveau national qu'international. Les survivants et les familles des victimes attendent avec impatience justice pour les brutalités infligées par Graziani et ses forces. L'accusation devrait présenter de nombreuses preuves, notamment des témoignages et des documents historiques détaillant l'étendue des crimes. Graziani, aujourd'hui âgé d'une soixantaine d'années, semblait serein à la lecture des accusations. Il a toujours nié tout acte répréhensible, affirmant que ses actes étaient justifiés par des nécessités militaires et qu'il obéissait aux ordres des autorités supérieures. Son équipe de défense fera probablement valoir qu'il est injustement visé pour des actions entreprises en temps de guerre. Le procès devrait être long et complexe, car il aborde certains des chapitres les plus sombres de l'histoire récente de l'Italie. Le résultat déterminera non seulement le sort de Graziani, mais servira également de réflexion critique sur la responsabilité des dirigeants dans les atrocités commises en temps de guerre."
########1950s events
ita_scomunica_commie.1.d:0 "Dans une mesure importante et sans précédent, le pape Pie XII a officiellement excommunié tous les membres des partis communistes et toute personne soutenant les idéologies communistes. Cette décision, annoncée aujourd'hui, constitue une réponse directe à l'influence croissante du communisme en Europe et à sa menace perçue pour l'Église catholique et les valeurs chrétiennes. Le décret, publié par le Saint-Office, stipule que les catholiques qui professent, défendent ou promeuvent les principes matérialistes et antireligieux du communisme sont automatiquement excommuniés. L'Église considère le communisme comme fondamentalement incompatible avec les enseignements du christianisme, notamment en ce qui concerne la nature de la dignité humaine, la famille et l'ordre social. Cette annonce a provoqué une onde de choc dans les communautés catholiques du monde entier, en particulier dans les pays où les partis communistes ont acquis un pouvoir politique important. Cette excommunication signifie que les personnes concernées n'ont pas le droit de recevoir les sacrements, y compris l'Eucharistie et la confession, et ne peuvent occuper aucune fonction ni aucun rôle dans l'Église. Le Vatican a souligné que la décision vise à protéger les fidèles des dangers posés par l'idéologie communiste et à réaffirmer l'engagement de l'Église à promouvoir la justice sociale à travers les enseignements chrétiens plutôt qu'à travers des idéologies laïques et matérialistes."
ita_calabria_rain.1.d:0 "Le 21 octobre 1953, une forte inondation frappa le centre-sud de la Calabre, dans les provinces de Catanzaro et Reggio de Calabre, causant malheureusement des dizaines de victimes et des dégâts très graves. Il s'agit de l'une des pires catastrophes hydrogéologiques depuis l'après-guerre. Des centaines de millimètres de pluie tombent en quelques heures. À Badolato (Catanzaro), 362 mm ont été atteints en quelques heures, à Stilo 315 mm, tandis qu'à Montebello Ionico plus de 290 mm. Les torrents gonflent de manière inimaginable en quelques heures, provoquant des crues exceptionnelles. Il y a des dizaines de glissements de terrain, avec interruption des artères de communication. Des centaines de maisons ont été détruites, y compris des cabanes construites pour accueillir les personnes déplacées par les événements de 1951 "
ita_benevento_flood.1.d:0 "La nuit dernière, une forte tempête a frappé la région de Campanie, déclenchant des pluies torrentielles et intenses. Le fleuve Calore Irpino, qui traverse la ville de Bénévent, a grossi rapidement et a débordé en plusieurs endroits, inondant de nombreux quartiers de la ville. Aux premières heures du 2 octobre, la situation est devenue désastreuse : l'eau a inondé les rues, les maisons et les magasins, atteignant dans certaines zones les deuxièmes étages des immeubles. Le pont Vanvitelli, l'un des symboles de la ville, a été entièrement détruit par la fureur du fleuve. Les opérations de sauvetage ont immédiatement commencé, mais les conditions étaient extrêmement difficiles : les routes étaient impraticables et de nombreux habitants étaient bloqués sur les toits. L'armée italienne et la Croix-Rouge se sont mobilisées pour évacuer les personnes et porter secours aux blessés. Les inondations ont causé d'importants dégâts à Bénévent : environ 3 000 bâtiments ont été endommagés ou détruits, plus de 10 000 personnes ont été évacuées et il y a eu 20 morts. Les dommages ont été estimés à environ 3 milliards de lires. Le quartier ferroviaire a été le plus durement touché, avec des quartiers entiers complètement submergés. La reconstruction de la ville sera un long processus. Le gouvernement italien a alloué des fonds pour les réparations et la construction de nouvelles maisons. Le pont Vanvitelli sera reconstruit et devrait rouvrir en 1951."
maxi_trial.1.d:0 "Le soi-disant Maxi Procès, un procès pénal contre la mafia sicilienne a débuté aujourd'hui à Palerme en Sicile. Pour des raisons de sécurité, le procès se déroule dans un palais de justice de type bunker spécialement construit à cet effet à l'intérieur des murs de la prison d'Ucciardone. Des violences contre les juges sont déjà attendues et des inquiétudes ont été soulevées quant à la protection du personnel judiciaire. Le procès est présenté comme le procès le plus important jamais intenté contre la mafia sicilienne et pourrait peut-être devenir le plus grand procès de l'histoire du monde. Cela fait suite à la deuxième guerre mafieuse qui a duré jusqu'en 1984 et qui a entraîné des milliers de morts et la victoire globale du clan Corleonesi qui avait déclenché le conflit pour prendre le contrôle de l'ensemble de la mafia sicilienne. Reste à savoir si ce procès pourra finalement écraser la Cosa Nostra, mais les tentatives passées n'ont abouti qu'à des échecs et à du sang."
ita_bas_attack.1.d:0 "Hier soir, le Comité de libération du Tyrol du Sud (BAS) a mené une attaque coordonnée qui a détruit 37 pylônes électriques dans le Tyrol du Sud. Les explosions ont ciblé des infrastructures clés, coupant l'électricité à la zone industrielle de Bolzano et à ses environs. Même si l'objectif de perturber complètement les activités industrielles de la région n'a pas été atteint, l'attaque a causé d'importants dégâts et des pannes d'électricité.\n\nLe BAS, créé en 1957, aspire depuis longtemps à la réunification du Tyrol du Sud avec l'Autriche ou à une plus grande autonomie de la population germanophone. Les actions militantes du groupe se sont intensifiées suite au mécontentement suscité par la gestion par l'Italie des accords post-fascistes du Traité de Paris.\n\nNotre gouvernement a renforcé la sécurité dans le Tyrol du Sud, en déployant des forces militaires et policières supplémentaires pour sécuriser les infrastructures critiques et enquêter sur l'attaque. Les tensions dans la région devraient s'intensifier."
########1970s events
aldo_moro_abduction.1.desc:0 "L'ancien Premier ministre italien Aldo Moro a été retrouvé mort, suite à son enlèvement par les Brigades rouges, un groupe terroriste d'extrême gauche. Moro, figure clé du Parti chrétien-démocrate italien, a été enlevé lors d'une violente embuscade contre son convoi. Son corps a été découvert dans le coffre d'une voiture dans le centre de Rome, quelques semaines après que le groupe ait exigé la libération de ses membres emprisonnés en échange de sa vie. Le gouvernement italien a refusé de négocier avec les terroristes, déclenchant un débat houleux sur leur approche dure. Moro, connu pour ses efforts visant à former des alliances politiques entre les démocrates-chrétiens et les communistes, a été ciblé pour son travail en faveur de l'unité nationale. Son enlèvement et son assassinat ont provoqué une onde de choc dans toute l'Italie, soulignant l'escalade de la violence politique qui sévit dans le pays. L'incident suscite des inquiétudes quant à la stabilité de l'Italie et à la capacité du gouvernement à gérer la menace croissante des groupes extrémistes. L'Italie pleure aujourd'hui la perte de l'un de ses hommes d'État les plus éminents."