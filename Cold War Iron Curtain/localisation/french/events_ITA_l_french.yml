 Italy_Gladio_Coup.1.d:0 "Dans une série d'événements choquants en Italie, le commandant des carabiniers, Giovanni de Lorenzo, a pris le contrôle du gouvernement. Cela fait suite à l'assassinat du défunt Premier ministre par des sympathisants communistes. Outre la prise par les carabiniers des principaux médias et institutions gouvernementales au début du coup d'État, les locaux du Parti communiste italien, du Parti socialiste italien et du Parti socialiste italien de l'unité prolétarienne ont été occupés et de nombreuses arrestations ont été effectuées sur la base de reportages locaux. La réponse internationale a été pour le moins mitigée, les États-Unis soutenant cette décision comme une étape nécessaire vers la restauration de la stabilité en Italie, tandis que d'autres ont critiqué cette décision comme violant les principes démocratiques, tandis que le bloc soviétique a condamné la nouvelle répression des partis pro-soviétiques en Italie."
 Italy_Gladio_Coup.2.d:0 "L'Italie a connu d'importants troubles ces dernières années avec des conflits entre les forces néofascistes, communistes et gouvernementales. Cependant, de manière inattendue, la situation a atteint de nouveaux sommets avec des militants du Front national, de l'Avant-garde nationale et des dissidents au sein de l'armée et des services de sécurité qui ont lancé un coup d'État contre le gouvernement. Dans les heures qui ont suivi le début du coup d'État, les militants ont rapidement pu prendre le contrôle du ministère de l'Intérieur ainsi que leurs stocks d'armes lourdes. Plusieurs ministres du gouvernement, dont le Premier ministre et le chef de la police nationale, ont été exécutés et les unités militaires soutenant le coup d'État ont cherché à s'emparer des bastions du Parti communiste italien. Le coup d'État semblant avoir réussi, le leader Junio Valerio Borghese, héros de guerre italien de renom pendant la Seconde Guerre mondiale et fasciste pur et dur, a été déclaré chef du nouveau gouvernement."

 ita_communist.1.d:0 "Les résultats des élections nationales italiennes sont connus et le Partito Comunista Italiano (PCI) a remporté une victoire écrasante. Dirigé par Palmiro Togliatti, le parti a réussi à remporter 335 sièges sur 574, une victoire écrasante pour le Parti chrétien-démocrate et d'autres opposants. L'élection, fortement influencée par les puissances extérieures, avec le soutien des États-Unis aux Démocrates-Chrétiens et l'Union Soviétique au PCI, a montré la puissance politique de l'Union Soviétique et a sans aucun doute élargi sa sphère d'influence. Ce résultat électoral était redouté par les membres de l'OTAN car il s'agit d'une autre nation tombée sous le communisme, tout comme le coup d'État communiste de 1948 en Tchécoslovaquie. Togliatti n'a pas encore annoncé quelle sera la prochaine position du pays. Certains spéculent que le nouveau régime pourrait se retirer de l'OTAN et même rejoindre le Kominform, puisque Togliatti est un stalinien. Il s'agit en effet d'un tournant pour l'Europe et pourrait très bien en être un pour le monde."
 ita_communist.2.d:0 "Aujourd'hui, Palmiro Togliatti a officiellement annoncé son retrait de l'Organisation du Traité de l'Atlantique Nord. Bien que [ITA.GetNameDef] ait été un membre fondateur de l'alliance défensive démocratique, l'élection récente au pouvoir d'une coalition dominée par le Partito Comunista Italiano a éloigné la nation de ses anciens alliés. Bien que Palmiro Togliatti n'ait rien dit sur l'avenir de [ITA.GetNameDef], des rumeurs émergent déjà concernant des communiqués à [SOV.Capital.GetName], même si elles ne sont pas encore confirmées."
 trieste_crisis.1.d:0 "Après de nombreuses années de reconstruction en République fédérale de Yougoslavie et en République italienne, le moment est venu de mettre définitivement un terme à la question du territoire libre de Trieste. Ayant été divisé en deux zones d'occupation distinctes ; l'une d'elles, la zone A, devait être patrouillée par les forces britanniques et américaines le long de la zone métropolitaine de Trieste, et l'autre zone, la zone B, occupée par des partisans yougoslaves, contrôlant la campagne rurale en dehors des limites de la ville. Les gouvernements italien et yougoslave, avec l'aide des Nations Unies, espèrent parvenir à un accord sur la poursuite de leur politique à l'égard de Trieste."
 annex_trieste.1.d:0 "Les efforts visant à parvenir à une résolution pacifique de la crise de Trieste se sont brutalement arrêtés aujourd'hui lorsque l'armée italienne est entrée dans la zone d'occupation yougoslave de Trieste pour faciliter sa réintégration forcée au sein de l'État italien. Après plusieurs jours de négociations mouvementées et pleines de tensions entre les États-nations de l'Adriatique sur le statut de Trieste et sa population mixte italienne et slave, le gouvernement italien, après des mois de rhétorique nationaliste du Premier ministre Palla, a ordonné à l'armée italienne de quitter la zone d'occupation métropolitaine et de pénétrer dans la campagne en grande partie slave, montrant peu de respect pour les ouvertures du Premier ministre yougoslave Josip Broz Tito. Les yeux du monde, une fois de plus, se tournent vers Belgrade en prévision de la réponse du gouvernement fédéral à l'agression italienne à Trieste, et avec les souvenirs de la première et de la seconde guerre mondiale encore présents dans l'esprit des deux nations, beaucoup dans le monde craignent qu'un autre chapitre violent de l'histoire de la Méditerranée ne soit sur le point de se dérouler à nouveau."
 italy_resign.1.d:0 "Après seulement six mois de mandat, le Premier ministre italien Giuseppe Pella a remis aujourd'hui sa démission à Rome, la capitale italienne. Après avoir été sous-secrétaire aux Finances dans les deuxième et troisième cabinets et secrétaire aux Finances sous le quatrième cabinet sous l'ancien Premier ministre Alcide De Gasperi, il est devenu la cible d'un examen incessant de la part des communistes et des socialistes pour ses tentatives d'occidentalisation de l'économie italienne d'après-guerre. Suite à l'échec de l'adoption de la loi sur la fraude, il a été nommé Premier ministre italien et a été durement critiqué pour son rôle dans les récentes tensions avec Josip Broz Tito en Yougoslavie concernant les territoires libres de Trieste, dont beaucoup pensent que c'est la principale raison de son départ."
 ita.1.t:0 "L'unification de Trieste"
 ita.1.d:0 "Le moment est venu pour la ville de Trieste, actuellement contrôlée par le Conseil de sécurité de l'ONU, de revenir à ses dirigeants respectifs. Il est prévu de diviser Trieste en zone A, la ville principale, et en zone B, la campagne à l'extérieur de Trieste. La Yougoslavie aurait la campagne et nous la ville. Devons-nous permettre cette scission ou voulons-nous les deux parties ?"
 ita.1.a:0 "Nous autorisons la scission."
 ita.1.b:0 "Nous voulons les deux parties !"
 ita.2.t:0 "Menace de la Yougoslavie"
 ita.2.d:0 "La Yougoslavie nous menace de garder les deux parties pour elle. Si nous ne reculons pas, ils envahiront Trieste, mais cela pourrait conduire à une guerre entre nous et la Yougoslavie. Si nous reculons, ils auront les deux parties et tout restera paisible."
 ita.2.a:0 "Nous ne reculons pas !"
 ita.2.b:0 "Nous restons paisiblement."
 ita.202.d:0 "San Marco 1 a été lancé le 15 décembre 1964 par une équipe au sol italienne à l'aide d'une fusée American Scout depuis Wallops Flight Facility en Virginie. Il s'agit du premier satellite italien et une grande réussite pour Edoardo Amaldi et son équipe. Grâce à leur dévouement et à leur travail acharné, l'Italie est devenue le cinquième pays à posséder son propre objet artificiel en orbite terrestre. L'objectif principal de la mission est de mener des recherches sur l'ionosphère. Après 272 jours de service, San Marco brûlera en rentrant dans l'atmosphère terrestre."
