l_french:
 stalin_speech_category:0 "Le discours de Staline au peuple"
 stalin_speech_category_desc:0 "Le camarade Staline a fait beaucoup pour le peuple soviétique ; après la défaite du fascisme, l'avenir de l'Union soviétique et l'avenir du socialisme ont encore besoin de son guide."
 addresstothe19thcongressofthecommunistpartyofthesovietunion:0 "Discours au 19e Congrès du Parti communiste de l'Union soviétique."
 addresstothe19thcongressofthecommunistpartyofthesovietunion_desc:0 "Permettez-moi, au nom de notre Congrès du Parti, d'exprimer nos remerciements à tous les partis et organisations frères dont les représentants ont honoré notre Congrès du Parti par leur présence ou qui ont adressé à notre Congrès des voeux d'amitié, pour leurs voeux de succès futur et pour leur confiance. Pour nous, cette confiance est particulièrement précieuse car elle signifie leur disponibilité à soutenir notre Parti dans sa lutte pour un avenir meilleur pour le peuple, dans sa lutte contre la guerre, dans sa lutte pour le maintien de la paix. Ce serait une erreur de croire que notre Parti, devenu une grande puissance, n'a pas besoin de plus de soutien. Ce serait une erreur. Notre Parti et notre pays ont besoin de la confiance, de la sympathie et du soutien continus des peuples frères hors de nos frontières, et ils en auront toujours besoin."
 stalin_funeral_category:0 "Discours aux funérailles de Staline"
 stalin_funeral_category_desc:0 "Notre grand leader, le camarade Staline, est décédé des suites d'un accident vasculaire cérébral. Après quatre jours de deuil national, des funérailles nationales lui sont offertes. Les contributions du camarade Staline resteront gravées à jamais dans les mémoires."
 khrushchev_speech:0 "Discours de Khrouchtchev à l'occasion des funérailles de Staline"
 khrushchev_speech_desc:0 "Au nom du Comité central du Parti communiste de l'Union soviétique et du Conseil des ministres de l'URSS, il s'agit d'une réunion commémorative à la mémoire du président du Conseil des ministres de l'Union des Républiques socialistes soviétiques et secrétaire du Comité central du Parti communiste de l'Union soviétique, le généralissime Joseph Staline. "
 malenkov_speech:0 "Discours de Malenkov à l'occasion des funérailles de Staline"
 malenkov_speech_desc:0 "Chers compatriotes, camarades, amis, chers amis de notre parti. Le peuple soviétique et l'humanité tout entière ont subi une perte très grave et irréparable. Notre professeur, notre guide, génie illustre pour toute l'humanité, est décédé. Joseph Vissarionovitch Staline, en ces jours difficiles, la douleur du peuple soviétique est partagée par toute l'humanité progressiste. Les actes de Staline continueront à traverser les siècles et la postérité. Les travailleurs de l'Union soviétique et moi-même savons que notre puissante patrie connaîtra de nouveaux succès. Il n'existe pas de chiffres dans le monde qui pourraient arrêter le mouvement de la société soviétique vers le communisme. Adieu à notre professeur. Notre cher ami, notre cher camarade, attendons avec impatience le plein triomphe de Lénine et de Staline."
 beria_speech:0 "Discours de Beria à l'occasion des funérailles de Staline"
 beria_speech_desc:0 "Chers amis, amis, il est difficile d'exprimer mes grands sentiments ces jours-ci. Quant à la pluie et aux habitants de notre pays, tous des êtres humains progressistes. Staline est une personne très compatissante et talentueuse, et la personne la plus proche qui nous ait quitté. Le peuple de notre pays peut être assuré que les partis politiques et le gouvernement soviétique ne ménageront aucun effort pour maintenir l'unité globale du Parti. Les lignes directrices pour l'amitié du peuple de la République socialiste soviétique peuvent désormais donner au pays la confiance dans les idées marxistes-léninistes afin d'enquêter sur l'héritage de Lénine et de Staline et de conduire le pays du socialisme au communisme. Gloire à notre bien-aimé, cher et grand professeur Staline."
 molotov_speech:0 "Discours de Molotov à l'occasion des funérailles de Staline"
 molotov_speech_desc:0 "Chers camarades et amis, nous souffrons tous ces jours-ci de la mort de Joseph Staline, de la perte du grand leader et en même temps du proche natif d'une personne infiniment chère. Nous sommes ses anciens et proches amis et des millions de Soviétiques, travailleurs de tous les pays du monde. Aujourd'hui avec un camarade d'acier que nous avons tous tellement aimé que les résultats vivront toujours dans nos coeurs. Le souvenir du grand Staline nous donne une direction claire pour construire une grande cause du communisme pour notre pays, qui sera plus fort et plus étroitement uni au sein du gouvernement central et les travailleurs du monde entier vivront pendant des siècles. Vive les grands professeurs Marx, Engels, Lénine et Staline. Vive notre puissante patrie socialiste. De temps en temps, le peuple soviétique vit du grand Parti communiste de l'Union soviétique."
