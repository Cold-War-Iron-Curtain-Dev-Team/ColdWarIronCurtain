 KEN_50s_mitchell_governorship:0 "Le poste de gouverneur Mitchell"
 KEN_50s_mitchell_governorship_desc:0 "Initialement nommé gouverneur du Kenya en décembre 1944, Mitchell a abordé ce poste avec un devoir et une responsabilité envers les autochtones. Cependant, cette vision a depuis décliné, la ferveur de Mitchell étant remplacée par une dérision à l'égard de la « grande masse des êtres humains » qui se trouvaient « à l'heure actuelle dans un état moral, culturel et social très primitif »."
 KEN_50s_support_bantu_cooperatives:0 "Soutenir les coopératives bantoues"
 KEN_50s_support_bantu_cooperatives_desc:0 "Mitchell croit en la relance et en soutenant l'introduction de coopératives ethniques bantoues dans nos campagnes, un exemple étant les Masaï"
 KEN_50s_invite_princess_elizabeth:0 "Invitez la princesse Elizabeth"
 KEN_50s_invite_princess_elizabeth_desc:0 "Sa Majesté le roi George VI étant par ailleurs en mauvaise santé, il a été décidé que la princesse Elizabeth visiterait le Kenya à sa place."
 KEN_50s_ignore_mau_mau:0 "Ignorer Mau Mau"
 KEN_50s_ignore_mau_mau_desc:0 "Les mouvements et activités Kikuyu ne sont pas nouveaux au Kenya. Nous pouvons ignorer cette tentative évidente de provoquer une réaction de la part de notre administration."
 KEN_50s_embrace_swahili_language_in_schools:0 "Adoptez la langue swahili dans les écoles"
 KEN_50s_embrace_swahili_language_in_schools_desc:0 "Étant la langue principale de notre peuple, le swahili devrait être adopté comme nouvelle langue centrale de notre système éducatif."
 KEN_50s_the_retiring_of_mitchell:0 "La retraite de Philip Mitchell"
 KEN_50s_the_retiring_of_mitchell_desc:0 "Après près de 10 ans de gouvernance plutôt inactive, mais pas chaotique, le mandat de Philip Mitchell en tant que gouverneur touche à sa fin. Espérons que son successeur jouera un rôle plus actif dans le protectorat."
 KEN_50s_the_kolloa_affray:0 "La bagarre de Kolloa"
 KEN_50s_the_kolloa_affray_desc:0 "La question des prophètes religieux locaux existe depuis de nombreuses années avant même l'administration coloniale. Bien que leurs messages aient généralement varié ; Un certain Lucas Pkech a apparemment pris sur lui de semer le trouble avec sa rhétorique anticoloniale et d'inciter au défi dans l'ensemble du protectorat."
 KEN_50s_lucas_pkech_surrenders:0 "Lucas Pkech se rend"
 KEN_50s_lucas_pkech_surrenders_desc:0 "Lucas Pkech, conscient que cela ne peut que mal se terminer, a choisi de se rendre pacifiquement aux autorités locales."
 KEN_50s_alan_stevens_confronts_seditioners:0 "Alan Stevens affronte les séditionnaires"
 KEN_50s_alan_stevens_confronts_seditioners_desc:0 "Bien que ce ne soit peut-être pas la meilleure solution, le responsable du district local, Alan Stevens, a conclu que le recours à la force est le moyen optimal de faire face à ces troubles. Espérons que cela n'entraîne pas de répercussions trop graves."
 KEN_50s_governor_evelyn_baring:0 "Gouverneure Evelyn Baring"
 KEN_50s_governor_evelyn_baring_desc:0 "Qui dit nouvelle décennie, dit nouveau gouverneur. Voyons ce qu'Evelyn Baring lui réserve pour son mandat."
 KEN_50s_the_royal_technical_college:0 "Le Collège Royal Technique"
 KEN_50s_the_royal_technical_college_desc:0 "Avec l'apparition de nouveaux établissements d'enseignement supérieur dans tout le protectorat, il a été décidé de fusionner les deux concepts actuels pour former le « Royal Technical College, Nairobi », grâce à l'idée de la communauté asiatique d'un collège commémoratif dédié au Mahatma Gandhi."
 KEN_50s_the_swynnerton_plan:0 "Le plan Swynnerton"
 KEN_50s_the_swynnerton_plan_desc:0 "Avec l'expansion économique est née l'idée de la gouverneure Evelyn Baring de créer le « Plan Swynnerton », qui vise à augmenter radicalement la production agricole."
 KEN_50s_kakuzi_limited_co:0 "Kakuzi Limited Co.."
 KEN_50s_kakuzi_limited_co_desc:0 "La première étape de ce grand projet consiste à fonder « Kakuzi PLC » ; qui se concentrera principalement sur le thé, l'avocat et l'ananas ainsi que sur la productivité de l'élevage."
 KEN_50s_rea_vipingo_co:0 "Réa Vipingo Co."
 KEN_50s_rea_vipingo_co_desc:0 "Le projet étant en cours, la deuxième étape sera la création de « Rea Vipingo », dont le produit sera le sisal."
 KEN_50s_unga_group_limited_co:0 "Unga Group Limited Co.."
 KEN_50s_unga_group_limited_co_desc:0 "Enfin, la dernière étape de cet effort sera de subventionner « Unga Group Limited » dont la principale production tourne autour de la meunerie, des produits nutritionnels et de l'alimentation animale."
 KEN_50s_rift_valley_aquifers:0 "Aquifères de la Vallée du Rift"
 KEN_50s_rift_valley_aquifers_desc:0 "La « Vallée du Rift », peuplée majoritairement de blancs, et ses environs en grande partie montagneux, rendent la région parfaite pour l'exploitation des aquifères afin de contribuer à l'efficacité agricole."
 KEN_50s_expand_central_plumbing_infrastructure:0 "Développer l'infrastructure de plomberie centrale"
 KEN_50s_expand_central_plumbing_infrastructure_desc:0 "L'exploitation de la Rift Valley étant bien avancée, nous pouvons désormais détourner les fruits de l'opération vers la capitale."
 KEN_50s_mombasa_roadworks:0 "Travaux routiers à Mombasa"
 KEN_50s_mombasa_roadworks_desc:0 "Mombasa étant notre seul accès à la côte est-africaine et au-delà, il est impératif que les infrastructures soient améliorées à des niveaux suffisants."
 KEN_50s_nairobi_roadworks:0 "Travaux routiers à Nairobi"
 KEN_50s_nairobi_roadworks_desc:0 "Bien entendu, maintenant que la voie est libre vers le littoral, il ne sert à rien de s'arrêter maintenant. Avec cet élan, nous pouvons moderniser en profondeur les réseaux routiers dans tout le protectorat."
 KEN_50s_encourage_settlement_to_white_highlands:0 "Encourager la colonisation des White Highlands"
 KEN_50s_encourage_settlement_to_white_highlands_desc:0 "Les hauts plateaux blancs sont la zone du centre du Kenya réservée aux colonies blanches et européennes. Nous devons développer cela pour le bien de notre nation"
 KEN_50s_lease_veterans_property:0 "Louer la propriété des anciens combattants"
 KEN_50s_lease_veterans_property_desc:0 "La vaste zone de terre que nous avons réservée à l'augmentation de la population européenne et blanche doit être entretenue immédiatement."
 KEN_50s_british_and_south_africa_immigration:0 "Immigration britannique et sud-africaine"
 KEN_50s_british_and_south_africa_immigration_desc:0 "Nos magnifiques hauts plateaux attirent désormais l'attention des migrants britanniques et sud-africains. Il ne faut pas se moquer d'une telle aubaine."
 KEN_50s_expand_the_999_year_lease:0 "Prolongez le bail de 999 ans"
 KEN_50s_expand_the_999_year_lease_desc:0 "Le bail de 999 ans est quelque chose que le protectorat kenyan a offert aux anciens combattants au cours de la dernière décennie. Il promet aux anciens combattants et à leurs enfants un bail de propriété de 999 ans sur les terres des hauts plateaux blancs. Nous devons étendre cette offre au-delà du groupe sélectif auquel elle est actuellement proposée."
 KEN_50s_white_highland_rule:0 "Règle blanche des Highlands"
 KEN_50s_white_highland_rule_desc:0 "Le gouvernement du protectorat kenyan doit venir des hauts plateaux blancs, par la minorité blanche, comme c'est le cas en Rhodésie et en Afrique du Sud."
 KEN_50s_rise_of_the_united_country_party:0 "Montée du nouveau parti Kenya"
 KEN_50s_rise_of_the_united_country_party_desc:0 "Michael Blundell a fondé le United Country Party, aujourd'hui le New Kenya Party, qui mènera à un programme plus conservateur dans notre intérêt."
 KEN_50s_infiltrate_student_groups:0 "Infiltrer des groupes d'étudiants"
 KEN_50s_infiltrate_student_groups_desc:0 "Aussi merveilleusement simpliste qu'un club puisse paraître, peut-être qu'une approche plus subtile rapportera de plus grands dividendes."
 KEN_50s_british_propoganda:0 "Propagande britannique"
 KEN_50s_british_propoganda_desc:0 "Il est nécessaire de mener une campagne de propagande parrainée par les Britanniques pour stabiliser notre nation."
 KEN_50s_disinformation_campaign:0 "Campagne de désinformation"
 KEN_50s_disinformation_campaign_desc:0 "Il devient évident que la force ne va pas modifier la façon de penser de ces étudiants gênants. Mais grâce à la désinformation et à la supercherie, nous pourrions bien triompher."
 KEN_50s_nairobi_student_riots:0 "Émeutes étudiantes à Nairobi"
 KEN_50s_nairobi_student_riots_desc:0 "Il semble que malgré nos efforts pour être des guides et des dirigeants bienveillants, la jeunesse de ce pays semble déterminée à saper notre gentillesse."
 KEN_50s_ban_the_kenyan_african_union:0 "Interdire l'Union africaine kenyane"
 KEN_50s_ban_the_kenyan_african_union_desc:0 "Nous devons interdire le parti politique de l'Union africaine kenyane en raison de sa nature rebelle. C'est intrinsèquement contraire à nos intérêts."
 KEN_50s_ban_the_young_kikuyu_association:0 "Interdire l'association des jeunes Kikuyu"
 KEN_50s_ban_the_young_kikuyu_association_desc:0 "L'Association des Jeunes Kikuyu est anticonformiste et s'oppose à ce dont notre société a besoin pour fonctionner"
 KEN_50s_jomo_kenyattas_speech:0 "Discours de Jomo Kenyatta"
 KEN_50s_jomo_kenyattas_speech_desc:0 "Récemment, au congrès africain, la figure la plus éminente des mouvements indépendantistes et pro-autonomie au Kenya, Jomo Kenyatta, a prononcé un discours extrêmement populaire. Tout en dénonçant les Mau Mau, il a affirmé que la lutte pour l'indépendance devrait être l'objectif de chaque Africain, en particulier en Afrique de l'Est."
 KEN_50s_the_arrest_of_jomo_kenyatta:0 "L'arrestation de Jomo Kenyatta"
 KEN_50s_the_arrest_of_jomo_kenyatta_desc:0 "Avec l'arrêt de cette influence incroyablement perturbatrice, peut-être qu'un peu d'ordre et de stabilité pourront désormais revenir dans le pays. Droite?"
 KEN_50s_KAU_underground:0 "Métro KAU"
 KEN_50s_KAU_underground_desc:0 "L'indépendance du Kenya doit être recherchée même sous la persécution, nous maintiendrons l'Union africaine kenyane interdite, dans la clandestinité"
 KEN_50s_elect_tom_mboya_as_mayor_of_nairobi:0 "Élire Tom Mboya comme maire de Nairobi"
 KEN_50s_elect_tom_mboya_as_mayor_of_nairobi_desc:0 "Tom Mboya ; aux côtés de Kenyatta lui-même, Mboya est véritablement un homme sur lequel nous pouvons compter pour nous conduire vers l'indépendance. Son charme, son intelligence et ses qualités de leadership sauront sûrement attirer tous ceux qui sont fidèles à notre cause."
 KEN_50s_jaramogi_odingas_criticism:0 "Critique de Jaramogi Odingas"
 KEN_50s_jaramogi_odingas_criticism_desc:0 "Jaramogi Odingas, l'éminent écrivain panafricaniste, a écrit une série de brochures dénonçant l'emprisonnement injuste de Jomo Kenyatta, totalement innocent."
 KEN_50s_advocate_freedom_for_kenyatta:0 "Plaider pour la liberté pour Kenyatta"
 KEN_50s_advocate_freedom_for_kenyatta_desc:0 "Les accusations gonflées pour l'emprisonnement de Jomo Kenyatta sont scandaleuses ! Les revendications pour sa liberté doivent être amplifiées et accélérées. D'une manière ou d'une autre, Kenyatta sera libéré et il nous conduira vers l'avenir."
 KEN_50s_international_controversy:0 "Controverse internationale"
 KEN_50s_international_controversy_desc:0 "La controverse internationale sur l'arrestation de Jomo Kenyatta suscite un scandale parmi les personnalités les plus marquantes. Julius Nyrerer, Kwame Nkrumah et Nehru se sont tous prononcés publiquement contre son arrestation et son emprisonnement."
 KEN_50s_advance_independence_movements:0 "Faire progresser le mouvement indépendantiste"
 KEN_50s_advance_independence_movements_desc:0 "Malgré l'absence de notre cher leader, nous ne pouvons pas nous arrêter maintenant. Partout dans le pays, le soutien à notre cause augmente et bientôt les colons britanniques ne pourront plus nous refuser notre indépendance tant méritée."
 KEN_50s_the_trial_of_jomo_kenyatta:0 "\"Le procès de Jomo Kenyatta\""
 KEN_50s_the_trial_of_jomo_kenyatta_desc:0 "Le roman « Le procès de Jomo Kenyatta » a conduit à une remise en question généralisée de l'arrestation et de l'emprisonnement de Jomo Kenyatta, même en Occident."
 KEN_50s_african_representation:0 "Représentation africaine"
 KEN_50s_african_representation_desc:0 "Des droits égaux pour tous. Un concept plutôt étranger aux Britanniques, mais pas à nous. Nous n'aurons de repos que lorsque chaque homme et chaque femme sera traité avec respect et considéré comme un être humain plutôt que comme le sujet d'une couronne qui ne nous appartient pas."
 KEN_50s_reestablishment_of_KAU:0 "Rétablissement de KAU"
 KEN_50s_reestablishment_of_KAU_desc:0 "Des efforts doivent être faits pour rétablir l'Union africaine kenyane. Les Britanniques nous ont peut-être repoussé, mais de toutes nos forces, la KAU reviendra plus forte que jamais !"
 KEN_50s_british_sympathy:0 "Sympathie britannique"
 KEN_50s_british_sympathy_desc:0 "Ironiquement, les Britanniques ordinaires qui ont entendu parler du traitement épouvantable infligé à Jomo Kenyatta ont généré à la fois de la sympathie pour notre cause et de l'embarras pour leur gouvernement."
 KEN_50s_the_road_to_independence:0 "La route vers l'indépendance"
 KEN_50s_the_road_to_independence_desc:0 "À travers le sang, la sueur et les larmes, notre objectif d'indépendance du Kenya se rapproche de plus en plus. Dans peu de temps, frères et soeurs, nous serons bientôt une nation libre d'hommes et de femmes libres !"
 KEN_50s_enforce_martial_law:0 "Appliquer la loi martiale"
 KEN_50s_enforce_martial_law_desc:0 "Même si cela nous fait mal, les indigènes semblent insister pour ne pas reconnaître notre droit de gouverner. Il semble donc que nous devrons adopter une position plus ferme à l'égard de la population."
 KEN_50s_manipulate_tribal_leaders:0 "Manipuler les chefs tribaux"
 KEN_50s_manipulate_tribal_leaders_desc:0 "La minorité blanche est trop petite pour contrôler l'ensemble du pays, mais heureusement, il y a suffisamment de chefs de tribus qui semblent ouverts à nos « conseils » et même disposés à suivre nos recommandations."
 KEN_50s_institute_apartheid:0 "Institut Apartheid"
 KEN_50s_institute_apartheid_desc:0 "Bien qu'il s'agisse d'une mesure plutôt désagréable, si nous voulons être encore là au cours de la prochaine décennie, nous devons également suivre l'exemple de l'Afrique du Sud."
 KEN_50s_create_a_bicameral_legislature:0 "Créer une législature bicamérale"
 KEN_50s_create_a_bicameral_legislature_desc:0 "Avec la transition d'un gouvernement colonial à un gouvernement fédéral, le système même de gouvernement doit également être modifié pour s'adapter à une société civilisée."
 KEN_50s_empower_the_executive_branch:0 "Donner du pouvoir au pouvoir exécutif"
 KEN_50s_empower_the_executive_branch_desc:0 "Il est clair que la seule façon dont nous pouvons espérer renforcer notre emprise sur le pays est de centraliser l'autorité gouvernementale au sein du pouvoir exécutif."
 KEN_50s_abolish_legislative_council:0 "Abolir le Conseil législatif"
 KEN_50s_abolish_legislative_council_desc:0 "La « réception» indigène à notre gouvernement a rendu douloureusement évident qu'on ne peut pas leur faire confiance pour prendre des décisions éclairées. Ainsi, sans notre volonté personnelle, le Conseil législatif doit être aboli."
 KEN_50s_empower_white_businesses:0 "Autonomiser les entreprises blanches"
 KEN_50s_empower_white_businesses_desc:0 "Alors que notre autorité devient de plus en plus apparente parmi les autochtones, c'est le moment idéal pour leur montrer la prospérité économique qu'un peu de capitalisme peut apporter."
 KEN_50s_expand_white_highland_restrictions:0 "Étendre les restrictions sur les White Highlands"
 KEN_50s_expand_white_highland_restrictions_desc:0 "À mesure que la population blanche augmente et s'établit de plus en plus, la zone dans laquelle elle réside doit également être rendue plus exclusive aux seuls Blancs."
 KEN_50s_rename_nairobi_coldbrook:0 "Renommer Nairobi Coldbrook"
 KEN_50s_rename_nairobi_coldbrook_desc:0 "En effet, au moment de la fondation de notre protectorat, le nom indigène de Nairobi est resté. Mais avec l'UCP au pouvoir, le nom natif de Nairobi ne convient pas à une ville britannique, renommons-le son équivalent anglais, Coldbrook"
 KEN_50s_united_country_party_victory:0 "Victoire du Parti Pays Uni"
 KEN_50s_united_country_party_victory_desc:0 "Enfin, avec la victoire du United Country Party de Michael Blundell, nous pourrons peut-être, espérons-le, commencer à consolider notre position au Kenya. La domination de la minorité blanche est là pour rester."
 KEN_50s_the_rogue_colony:0 "La colonie des voleurs"
 KEN_50s_the_rogue_colony_desc:0 "Même si elle n'a fait preuve que d'une loyauté inébranlable envers la couronne et le pays, la Grande-Bretagne nous a snobés. Avec cet acte final, il a été décidé que nous devions tracer notre propre voie dans le monde."
 KEN_50s_loyalty_to_the_crown:0 "Loyauté envers la Couronne"
 KEN_50s_loyalty_to_the_crown_desc:0 "Il est plutôt répugnant de penser que nous tournerions le dos à la mère patrie. Nous sommes désormais et à jamais de loyaux sujets de Sa Majesté la reine Elizabeth II."
 KEN_50s_rise_of_kenyan_industry:0 "L'essor de l'industrie kenyane"
 KEN_50s_rise_of_kenyan_industry_desc:0 "Ce qui est plutôt embarrassant, c'est que le Kenya, comparé à des pays comme le Canada et l'Australie, reste terriblement sous-industrialisé. C'est une population très peu familiarisée avec le travail urbain. Cela doit être corrigé immédiatement !"
 KEN_50s_public_construction_works:0 "Travaux Publics"
 KEN_50s_public_construction_works_desc:0 "Une Commission centrale de planification est essentielle pour diriger tous les efforts d'industrialisation dans tout le pays. Une fois que les grandes villes de Nairobi et Mombasa seront suffisamment développées, nous pourrons nous concentrer sur les zones rurales."
 KEN_50s_begin_mining_in_kerio_valley:0 "Commencer l'exploitation minière dans la vallée de Kerio"
 KEN_50s_begin_mining_in_kerio_valley_desc:0 "Grâce aux rapports des prospecteurs, nous avons pris connaissance d'un riche gisement de minéraux sous la vallée de Kerio, situé dans l'ouest du Kenya."
 KEN_50s_begin_mining_the_highlands:0 "Commencez à exploiter les hautes terres"
 KEN_50s_begin_mining_the_highlands_desc:0 "Les Hautes Terres sont déjà l'une des régions les plus riches du protectorat, mais il y a très probablement encore des matériaux utiles cachés qui ne demandent qu'à être déterrés."
 KEN_50s_create_mombasa_sugar_factory:0 "Construire l'usine sucrière de Mombasa"
 KEN_50s_create_mombasa_sugar_factory_desc:0 "La Commission a décidé de créer une usine de transformation du sucre au centre-ville de Mombasa, ce qui constituerait un premier pas solide vers l'industrialisation."
 KEN_50s_magadi_soda_co:0 "Magadi Soda Co.."
 KEN_50s_magadi_soda_co_desc:0 "La commission, ainsi que les entrepreneurs locaux, ont remarqué que le lac Magadi est riche en trona, un composé clé pour les boissons gazeuses. Un investissement confortable dans Magadi Soda Company semble rentable."
 KEN_50s_nairobi_security_exchange:0 "Bourse de sécurité de Nairobi"
 KEN_50s_nairobi_security_exchange_desc:0 "Pour encourager la spéculation étrangère, nous créerons le Nairobi Security Exchange."
 KEN_50s_the_bunyala_road_factory:0 "L'usine de la route de Bunyala"
 KEN_50s_the_bunyala_road_factory_desc:0 "La rue principale de Bunyala Road à Nairobi deviendra le siège d'une immense usine industrielle."
 KEN_50s_the_rise_of_kenyan_entrepeneurship:0 "L'essor de l'entrepreneuriat kenyan"
 KEN_50s_the_rise_of_kenyan_entrepeneurship_desc:0 "Il semble que l'odeur de l'argent soit dans l'air, car de nombreux habitants ont pris sur eux de promouvoir leurs propres idées et, espérons-le, de s'enrichir grâce à elles."
 KEN_50s_cooper_motors_limited:0 "Cooper Motors Limitée"
 KEN_50s_cooper_motors_limited_desc:0 "Bien que Cooper Motors existe depuis un certain temps déjà, elle n'a jamais vraiment décollé. Avec un soutien supplémentaire, ils pourraient devenir une aubaine pour notre industrie."
 KEN_50s_founding_of_kenyan_power_and_lighting_co:0 "Création de Kenyan Power and Lighting Co."
 KEN_50s_founding_of_kenyan_power_and_lighting_co_desc:0 "Bien qu'elle ait été fondée quelques années plus tôt en 1922 sous le nom de « East African Power and Lighting Company » (EAP&L), un terme aussi large est devenu une exagération ces dernières années. Alors différencions-nous de tout le monde, l'EAP&L sera réorganisée en Kenya Power and Lighting Company !"
 KEN_50s_build_a_plant_in_mombasa:0 "Construire une usine à Mombasa"
 KEN_50s_build_a_plant_in_mombasa_desc:0 "Électrification; bien que ce ne soit pas une nouveauté, il a souvent été difficile de l'introduire dans tout le pays. Pourtant, il faut bien commencer quelque part, et le littoral est un bon endroit comme n'importe quel autre."
 KEN_50s_build_a_plant_in_nairobi:0 "Construire une usine à Nairobi"
 KEN_50s_build_a_plant_in_nairobi_desc:0 "Électrifier une grande ville comme Nairobi sera certainement une entreprise ardue, mais avec un peu d'efforts et d'investissement en temps, Nairobi pourrait devenir un phare pour la modernisation future."
 KEN_50s_assassination_of_cheif_waruhiu:0 "L'assassinat du chef Waruhiu"
 KEN_50s_assassination_of_cheif_waruhiu_desc:0 "L'assassinat du chef pro-britannique Waruhiu a provoqué une période d'incertitude et d'instabilité au Kenya. Avec une telle obscurité qui descend sur nous, qui sait quand le matin se lèvera."
 KEN_50s_declare_a_state_of_emergency:0 "Déclarer l'état d'urgence"
 KEN_50s_declare_a_state_of_emergency_desc:0 "Alors que la nouvelle de l'assassinat du chef Waruhiu ébranle les fondements mêmes du protectorat, la gouverneure Evelyn Baring a jugé nécessaire de déclarer l'état d'urgence jusqu'à ce que l'ordre soit rétabli."
 KEN_50s_expand_king_african_rifles:0 "Développez les fusils africains du roi"
 KEN_50s_expand_king_african_rifles_desc:0 "La situation actuelle, couplée au manque de personnel blanc, impose que les KAR indigènes soient élargis pour aider à la répression."
 KEN_50s_weapon_sharing_with_britain:0 "Partage d'armes avec la Grande-Bretagne"
 KEN_50s_weapon_sharing_with_britain_desc:0 "La Grande-Bretagne est aujourd'hui une puissance leader dans le monde. De telles connexions nous seront vraiment bénéfiques en termes de supériorité technologique sur une bande d'hommes armés d'armes en bois."
 KEN_50s_modernize_artillery:0 "Moderniser l'artillerie"
 KEN_50s_modernize_artillery_desc:0 "Étant donné que nous n'avons pas les moyens de développer notre propre artillerie, nous devons nous tourner vers la Grande-Bretagne pour obtenir de l'aide dans ce domaine."
 KEN_50s_enlist_highlander_special_forces:0 "Enrôlez les forces spéciales des Highlanders"
 KEN_50s_enlist_highlander_special_forces_desc:0 "Nous devons faire appel aux forces spéciales écossaises pour anéantir complètement toute forme de résistance."
 KEN_50s_expand_air_operations:0 "Développer les opérations aériennes"
 KEN_50s_expand_air_operations_desc:0 "En tant que colonie de la Couronne de la Mère Patrie, nous avons un avantage significatif sur ces rebelles. Nous avons des avions. Que les Mau Mau tremblent de terreur tandis que nous secouons leur monde archaïque avec le tonnerre de l'ère des avions à réaction !"
 KEN_50s_nairobi_airbases:0 "Bases aériennes de Nairobi"
 KEN_50s_nairobi_airbases_desc:0 "Avec l'aide britannique, nous devons nous efforcer de répondre à leur présence grâce à la construction d'aérodromes à grande échelle."
 KEN_50s_lincoln_bombing_campaigns:0 "Campagnes d'attentats à la bombe contre Lincoln"
 KEN_50s_lincoln_bombing_campaigns_desc:0 "Avec l'approbation du gouverneur et avec des avions fournis par la mère patrie, nous commencerons une campagne efficace de bombardement de Lincoln."
 KEN_50s_british_anti_insurgency:0 "Anti-insurrection britannique"
 KEN_50s_british_anti_insurgency_desc:0 "Les Britanniques feront de leur mieux pour mener une campagne anti-insurrectionnelle efficace et efficiente."
 KEN_50s_villagization:0 "Villagisation"
 KEN_50s_villagization_desc:0 "Si nous voulons espérer étouffer cette rébellion, nous devons centraliser les Kikuyu afin de les surveiller de plus près."
 KEN_50s_british_military_intervention:0 "Intervention militaire britannique"
 KEN_50s_british_military_intervention_desc:0 "Malheureusement, l'insurrection a atteint un point où nous sommes incapables de la réprimer seuls. En conséquence, une intervention militaire des Britanniques est tout à fait nécessaire à ce stade, espérons qu'avec leur aide nous pourrons mettre un terme à cette rébellion."
 KEN_50s_detention_programs:0 "Programmes de détention"
 KEN_50s_detention_programs_desc:0 "En isolant les éléments Kikuyu dans divers centres d'internement, nous pouvons commencer à éliminer les partisans Mau Mau les plus rebelles"
 KEN_50s_operation_anvil:0 "Opération Enclume"
 KEN_50s_operation_anvil_desc:0 "L'Opération Anvil est une opération militaire visant à infiltrer efficacement tous les aspects de l'insurrection Mau Mau, en commençant par une approche ascendante du recrutement ennemi et de l'assassinat des dirigeants Mau Mau."