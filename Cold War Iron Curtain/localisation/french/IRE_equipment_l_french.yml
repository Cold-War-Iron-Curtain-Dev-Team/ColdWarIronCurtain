 IRE_mechanized_equipment_5:0 "FMC M113"
 IRE_mechanized_equipment_5_short:0 "M113"
 IRE_mechanized_equipment_5_desc:0 "Pendant les combats au Congo, les Irlandais ont réussi à acquérir 6 APC M113. Ceux-ci étaient ultramodernes à l'époque et offraient des performances bien supérieures à tout ce que le DF avait en service. Cependant, cela ne les a pas empêchés d'être mis en service et de donner au détachement un renforcement indispensable de sa capacité blindée."
 IRE_mechanized_equipment_6:0 "Panhard M3 VTT"
 IRE_mechanized_equipment_6_short:0 "M3 VTT"
 IRE_mechanized_equipment_6_desc:0 "Pendant les combats au Congo, les Irlandais ont réussi à acquérir 6 APC M113. Ceux-ci étaient ultramodernes à l'époque et offraient des performances bien supérieures à tout ce que le DF avait en service. Cependant, cela ne les a pas empêchés d'être mis en service et de donner au détachement un renforcement indispensable de sa capacité blindée."
 IRE_mechanized_equipment_7:0 "Timoney Mk IV APC"
 IRE_mechanized_equipment_7_short:0 "Timoney Mk IV APC"
 IRE_mechanized_equipment_7_desc:0 "Timoney, une société basée dans le comté de Meath, a conçu et construit trois prototypes uniques de APC 4x4 à roues désignés Marks I, II, III pour des tests par l'armée irlandaise entre 1972 et 1974. En 1977, l'armée a commandé cinq APC basés sur la conception Mk III connue sous le nom de Timoney Mk IV APC. Ceux-ci ont été livrés en 1978, équipés d'une tourelle construite par Timoney et armée de deux mitrailleuses FN MAG de 7,62 mm"
 IRE_mechanized_equipment_8:0 "Timoney Mk VI APC"
 IRE_mechanized_equipment_8_short:0 "Timoney Mk VI APC"
 IRE_mechanized_equipment_8_desc:0 "En 1981, l'armée commanda cinq APC Timoney Mk VI améliorés qui furent livrés en 1983, équipés d'une tourelle Creusot-Loire TLi 127 armée d'une mitrailleuse M2 Browning.5 et d'une mitrailleuse FN MAG de 7,62 mm chacune. Les APC Timoney Mk VI ont été utilisés par l'armée jusqu'en 1999."
 IRE_mechanized_equipment_9:0 "SISU XA-180"
 IRE_mechanized_equipment_9_short:0 "XA-180"
 IRE_mechanized_equipment_10:0 "Mowag Piranha IIIH"
 IRE_mechanized_equipment_10_short:0 "Piranha IIIH"
 IRE_mechanized_equipment_10_desc:0 "La famille de véhicules blindés Mowag depuis 1972 est un succès d'exportation exceptionnel, qui rappelle les anciennes compagnies mercenaires de piquiers suisses qui parcouraient les champs de bataille d'Europe lors des guerres de la Renaissance. Ce véhicule extrêmement polyvalent et modulaire est produit depuis 1972 en quatre variantes, 4x4, 6x6, 8x8 et même 10x10"

