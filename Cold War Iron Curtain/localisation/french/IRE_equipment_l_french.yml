#Ireland, Republic of

 IRE_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 IRE_infantry_equipment_0_short:0 "SMLE n°4"
 IRE_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 IRE_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 IRE_infantry_equipment_1_short:0 "FN FAL"
 IRE_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 IRE_infantry_equipment_2:0 "Fabrique Nationale Carabine Automatique Légère"
 IRE_infantry_equipment_2_short:0 "CAL FN"
 IRE_infantry_equipment_2_desc:0 "La CAL (Carabine Automatique Légère) était une arme belge fabriquée par la Fabrique Nationale. C'était le premier fusil de 5,56 mm produit par la Fabrique Nationale. Il ressemblait au FN FAL, très réussi de la société, mais il s'agissait d'une conception originale. Contrairement au FAL, il s'agit d'un échec du marché, même si son développement a conduit au succès raisonnable du FN FNC."

 IRE_infantry_equipment_3:0 "Steyr AOÛT A1"
 IRE_infantry_equipment_3_short:0 "Steyr AOÛT A1"
 IRE_infantry_equipment_3_desc:0 "Le Steyr AUG est le fusil de service standard des Forces de défense. Il est entré en service en 1989 et est utilisé par toutes les unités des Forces de Défense. Les unités opérationnelles reçoivent un fusil amélioré équipé d'un viseur optique ACOG 4x32 qui entre en service fin 2014, connu sous le nom de modèle 14 ou MOD 14."

 IRE_infantry_equipment_4:0 "Steyr AUG Modèle 14"
 IRE_infantry_equipment_4_short:0 "Steyr AOÛT MOD14"
 IRE_infantry_equipment_4_desc:0 "Le Steyr AUG est le fusil de service standard des Forces de défense. Il est entré en service en 1989 et est utilisé par toutes les unités des Forces de Défense. Les unités opérationnelles reçoivent un fusil amélioré équipé d'un viseur optique ACOG 4x32 qui entre en service fin 2014, connu sous le nom de modèle 14 ou MOD 14."


