 #SOVIET BREZNEV Economic
 #8th 5 year plan
 SOV_ECON_Launch_the_Liberman_Plan: "Lancez la réforme Liberman"
 SOV_ECON_Launch_the_Liberman_Plan_desc: "La réforme économique soviétique, parfois appelée réforme Kossyguine ou réforme Liberman, est un ensemble de changements planifiés dans l'économie de l'URSS. L'élément central de ces changements est l'introduction de la rentabilité et des ventes comme deux indicateurs clés du succès de l'entreprise. Une partie des bénéfices d'une entreprise serait reversée à trois fonds, utilisés pour récompenser les travailleurs et développer les opérations ; la plupart iraient au budget central."
 SOV_ECON_Reduce_the_Amount_of_Policy_Targets: "Réduire le nombre d'objectifs politiques"
 SOV_ECON_Reduce_the_Amount_of_Policy_Targets_desc: "Le nombre d'objectifs politiques doit être réduit de 30 à 9. Les neuf grands sont : la production totale aux prix de gros courants, les produits les plus importants en unités physiques, la masse salariale totale, les bénéfices totaux et la rentabilité, exprimés comme le rapport entre les bénéfices, les immobilisations et le fonds de roulement normalisé ; les versements au budget et les crédits budgétaires ; les objectifs d'investissement total en capital pour l'introduction de nouvelles technologies ; et le volume de l'approvisionnement en matières premières et en équipements."
 SOV_ECON_Expand_the_Central_Mathematical_Institute: "Agrandir l'Institut central de mathématiques économiques"
 SOV_ECON_Expand_the_Central_Mathematical_Institute_desc: "L'Institut central de mathématiques économiques (russe : Центральный экономико-математический институт (ЦЭМИ)) de l'Académie des sciences de Russie est un institut de recherche économique situé à Moscou. Il se concentre sur la théorie économique, l'économie mathématique et l'économétrie. Nous envisageons désormais de l'étendre à Tallinn et à Leningrad."
 SOV_ECON_Encourage_Enterprise_Independence: "Encourager l'indépendance des entreprises"
 SOV_ECON_Encourage_Enterprise_Independence_desc: "Avec cette réforme, les entreprises sont tenues de déterminer la gamme détaillée et la variété des produits, d'utiliser leurs fonds propres pour investir dans la production, d'établir des accords contractuels à long terme avec les fournisseurs et les clients et de déterminer le nombre de personnel requis."
 SOV_ECON_Re_Centralize_Macro_Management: "Recentraliser la macro-gestion"
 SOV_ECON_Re_Centralize_Macro_Management_desc: "Le plan appelle à une planification centrale plus détaillée et scientifique, comprenant des objectifs annuels."
 SOV_ECON_Forecast_Results_with_Computer_Systems: "Résultats de prévision avec les systèmes informatiques"
 SOV_ECON_Forecast_Results_with_Computer_Systems_desc: "Afin de planifier l'économie plus efficacement, nous devons utiliser les ordinateurs pour nous aider."
 
 SOV_ECON_Set_the_8th_Five_Year_Budget: "Fixer le budget du 8e plan quinquennal"
 SOV_ECON_Set_the_8th_Five_Year_Budget_desc: "Le budget du VIIIe Plan quinquennal s'élèvera à 310 000 000 000 de roubles, dont la répartition est moins détaillée que précédemment."
 
