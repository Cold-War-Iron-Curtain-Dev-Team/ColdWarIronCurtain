 SOV_BREZHNEV_Inaugurate_the_Collective_Leadership: "Inaugurer le leadership collectif"
 SOV_BREZHNEV_Inaugurate_the_Collective_Leadership_desc: " Le Présidium, qui était devenu mécontent du style de leadership de Khrouchtchev et craignait la domination individuelle de Mao Zedong et le culte croissant de la personnalité en République populaire de Chine, a lancé une campagne agressive contre Khrouchtchev en 1963. Cette campagne a culminé en 1964 avec le remplacement de Khrouchtchev dans ses fonctions de premier secrétaire par Léonid Brejnev et de président du Conseil des ministres par Alexeï Kossyguine. Brejnev et Kossyguine, ainsi que Mikhaïl Souslov, Andreï Kirilenko et Anastas Mikoyan, ont été élus à leurs postes respectifs pour former et diriger une direction collective fonctionnelle."
