 #Soviet End
 Soviet_End.1.d: "À un moment qui remodèlera à jamais le paysage politique mondial, l'Union soviétique a officiellement cessé d'exister aujourd'hui. Le président Mikhaïl Gorbatchev a annoncé la dissolution de l'Union soviétique dans un discours télévisé, marquant la fin d'une superpuissance qui existe depuis près de 70 ans.\nCette décision fait suite à une série d'événements tumultueux qui ont commencé avec l'échec du coup d'État du mois d'août plus tôt cette année, qui a affaibli l'emprise du Parti communiste sur le pouvoir. La montée ultérieure des mouvements indépendantistes dans diverses républiques a accéléré l'effondrement, alors que des pays comme l'Ukraine, la Biélorussie et les États baltes ont déclaré leur souveraineté.\nGorbatchev, qui a introduit les politiques de glasnost (ouverture) et de perestroïka (restructuration) visant à revitaliser le système soviétique, a fait face à une pression croissante à mesure que les sentiments nationalistes montaient à travers la fédération. Dans son discours, il a déploré la désintégration mais a souligné la nécessité d'une transition pacifique vers un nouvel ordre politique.\nSuite à cette annonce, les dirigeants de la Russie, de l'Ukraine et de la Biélorussie ont signé un accord historique à Minsk, établissant officiellement la Communauté des États indépendants (CEI). Cette nouvelle entité vise à favoriser la coopération entre les anciennes républiques soviétiques tout en soulignant leur indépendance."

