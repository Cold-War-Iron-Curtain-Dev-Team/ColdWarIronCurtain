 AOC_reorganize_farming_policies: "Réorganiser les politiques agricoles"
 SOV_agriculture_desc: "Depuis l'aube de l'humanité, l'agriculture était le moyen de produire de la nourriture pour la population. Après la Grande Guerre Patriotique, nous devons établir un nouveau système agricole pour soutenir notre population en cas de nouvelle guerre avec les puissances capitalistes."
 SOV_improved_training_desc: "Pendant la guerre, nous avons perdu des centaines de milliers de conscrits soviétiques en raison de notre situation désespérée sur le front. Nous devrions établir une formation militaire plus professionnelle afin de ne pas perdre autant d'hommes dans une entreprise aussi inutile."
 SOV_lessons_from_the_great_patriotic_war_desc: "La Grande Guerre patriotique nous a beaucoup appris, nous devons entamer une réforme majeure de nos forces armées afin de ne plus jamais laisser une force oppressive s'enfoncer aussi profondément en URSS, ni gouverner les eaux de notre nation, ni gouverner le ciel de notre grande nation communiste."
 SOV_rebuild_member_civilian_industries_desc: "Ceux qui se sont opposés à nous pendant la guerre ont énormément souffert de leurs actions et de leurs décisions, mais maintenant que nous avons établi des gouvernements amis dans ces pays, avec des gens partageant les mêmes idées, nous devons renforcer leur secteur industriel afin de concurrencer l'Occident."
 SOV_develop_membership_infrastructure_desc: "Les bombardements de nos forces aériennes soviétiques ont laissé une grande marque sur tous nos anciens ennemis. Après l'établissement de nos camarades amis, nous devons reconstruire leurs chemins de fer, leurs villes et leurs autoroutes pour un plus grand développement de leurs nations."
 SOV_develop_membership_research_collection_desc: "Depuis le début de la guerre froide, il y a quelques années, nous avons remarqué que les puissances capitalistes ont énormément augmenté en supériorité technologique, cela est dû à leur coopération dans un programme de recherche, nous devrions également en établir un afin de créer de glorieux projets pour la patrie."
 SOV_collectivized_five_year_plans_desc: "Depuis le début de notre nation, les plans quinquennaux ont été la source de notre force industrielle et c'est la raison pour laquelle nous avons repoussé la bête fasciste. Puisque cela a si bien fonctionné pour nous, nous devrions mettre en oeuvre le plan quinquennal sur tous nos nouveaux camarades amis."
 SOV_soviet_oil_fields_desc: "L'avancée allemande dans le Caucase nous a rappelé l'immense pouvoir que le pétrole a sur une machine de guerre militaire : nous devons rechercher et utiliser au maximum tous les nouveaux gisements de pétrole que nous trouvons afin d'alimenter notre machine de guerre au maximum de son potentiel."
 SOV_soviet_oil_refineries_desc: "Une économie mondiale en constante évolution nous a appris que le pétrole est l'un des produits les plus importants qui doivent être fournis à tout pays qui veut être qualifié de puissance et, à ce titre, nous devons établir de nouvelles raffineries de pétrole pour répondre aux besoins du peuple soviétique et également de nos alliés du monde entier."
 SOV_autarkic_policies_desc: "Nous ne pouvons dépendre de personne, pas même de nos alliés, pour nos ressources d'une grande importance pour le peuple, notre grand dirigeant a donc décidé que nous adopterions l'autarcie comme nouvel objectif politique pour l'URSS."
 SOV_latam_operations_desc: "Plus nous nous rapprochons de l'ennemi des travailleurs, mieux c'est. C'est pourquoi nous devons financer nos frères communistes des gouvernements d'Amérique du Sud et d'Amérique centrale afin de favoriser la révolution et d'abattre l'aigle capitaliste."
 SOV_european_thrust_desc: "Depuis que nous avons inversé la tendance contre la bête fasciste, nous voulions amener le communisme dans le reste de l'Europe, mais les alliés ont entravé notre progrès, pas plus, disons-nous, car nous allons commencer à renverser la tyrannie capitaliste sur l'Europe et libérer tous les travailleurs."
 SOV_internal_stability_desc: "Nous devons autrefois parvenir à la stabilité intérieure pour repousser l'aigle capitaliste à l'Ouest ; nous étions autrefois dangereusement proches d'un coup d'État trotskiste, où nous écrasions les contre-révolutionnaires dans le feu socialiste juste ; nous devons une fois de plus rechercher la stabilité afin de protéger nos États tampons contre les Américains."
 SOV_new_political_theory_desc: "Le monde change, et alors que nous sentons le vent du changement souffler sur notre nation, nous devons également commencer à changer. L'un des piliers de notre nation est la façon dont nous traitons les forces réactionnaires partout dans le monde, nous devons développer une nouvelle théorie de l'expansion communiste dans le monde entier."
 SOV_middle_east_operations_desc: "Nous devons considérer le Moyen-Orient comme un terrain de révolution, c'est l'une des régions pétrolières les plus riches de la planète, un pétrole qui serait grandement apprécié par tous en URSS, c'est pourquoi nous devons commencer à ouvrir des négociations avec les gouvernements du Moyen-Orient et commencer à envoyer nos agents pour promouvoir la révolution."
 SOV_support_arab_cause_desc: "Les Arabes ont une opinion juste à l'égard d'un pays israélien, nous devons les soutenir ouvertement autant que possible dans cette affaire contre le capitalisme et l'impérialisme."
 SOV_arm_arab_states_desc: "Nous devrions commencer à préparer les Arabes contre toute tentative d'apaiser leur soif de révolution de la part des Américains ou des Britanniques, ce qui est l'une des raisons pour lesquelles nous allons envoyer des armes et des combattants à de nombreux États arabes."
 SOV_soviet_arabian_sphere_desc: "La pression de notre gouvernement amènera sûrement la plupart, sinon la totalité, des gouvernements arabes à nous apporter leur soutien dans cette guerre froide contre les États-Unis. Nous devons nous assurer d'étendre notre sphère d'influence aussi grande que possible, afin d'augmenter notre État tampon et de protéger le véritable leader du socialisme, l'URSS."
 SOV_anti_colonialism_desc: "Le colonialisme britannique et français a longtemps pesé sur la situation des travailleurs partout sur la planète, y compris en Asie et en Afrique, nous devons nous opposer ouvertement à ces efforts flagrants visant à briser l'esprit du travailleur international."
 SOV_stalin_reforms_desc: "Notre Union soviétique a depuis longtemps été à l'origine de nombreuses réformes pour le bien des travailleurs, et ce n'est pas différent, notre grand dirigeant Staline va introduire des réformes majeures en URSS qui la feront accéder au statut de superpuissance, la rendant plus grande que les États-Unis d'Amérique."
 SOV_an_iron_curtain_desc: "Il a été observé que des éléments subversifs des puissances capitalistes s'infiltrent dans chaque État communiste comme une maladie. Nous devons établir une politique anticapitaliste dans chaque État tampon que nous avons, car nous devons empêcher l'échec de la révolution en tant que bastion des travailleurs dans le monde entier."
 SOV_expand_gulags_desc: "Nous ne pouvons pas laisser les ennemis de l'État entraver notre développement, en fait, nous devrions étendre notre système carcéral, de sorte que les ennemis de l'État doivent plutôt travailler pour le bien du pays, nous ne devons laisser rien ni personne interférer avec l'essor de notre nation à la place qui lui revient sur terre."
 SOV_traditional_beliefs_desc: "Les femmes n'ont pas leur place sur les champs de bataille, elles appartiennent à leurs maisons, nourrissant les futurs enfants de la révolution socialiste. Cela n'a pas de sens de laisser les mères de nos enfants mourir sans raison sur le champ de bataille pour paralyser notre grande nation."
 SOV_egalitarian_beliefs_desc: "Il est de la plus haute importance que nous laissions les femmes travailler dans l'armée et dans les usines, elles ont joué un rôle crucial dans la Grande Guerre patriotique et ont prouvé leur valeur, car elles sont aussi utiles sur les champs de bataille ou dans les usines que les hommes, car nous devons montrer aux pays réactionnaires du monde que l'Union soviétique est véritablement le pays le plus égalitaire au monde."
 SOV_collectivization_desc: "Impératif est le mot utilisé pour désigner la collectivisation de toutes les fermes en URSS, ce n'est qu'ensemble que les travailleurs de l'Union soviétique trouveront leur utopie plus proche d'eux, en abandonnant leurs principes égoïstes pour la grandeur de leur nation."
 SOV_traditional_farms_desc: "Le retour des fermes traditionnelles est la véritable voie à suivre, car la collectivisation de nos fermes dans le passé a coûté la vie à des millions de nos compatriotes, nous devrions lutter pour le bonheur et la sécurité de notre population, au lieu d'être terriblement durs avec elle dans notre industrialisation."
 SOV_continue_the_great_turn_desc: "Nous avons été interrompus pendant la Grande Guerre Patriotique dans la poursuite de notre Grand Tour contre les politiques capitalistes mises en oeuvre par Lénine en 1921, mais maintenant, avec le camarade Staline à la tête de notre nation après la victoire de la bête fasciste, nous pouvons reprendre le Grand Tour et révolutionner encore plus l'industrie de l'Union Soviétique."
 SOV_revitalize_the_new_economic_policy_desc: "Nous devons reconnaître les défauts de notre gouvernement par une accélération aussi rapide de la collectivisation des travailleurs et notre quête d'un véritable communisme. En tant que tel, nous devons essayer de réparer les dommages massifs que nous avons causés à l'industrie de notre nation et réintroduire la politique capitaliste de Lénine, afin que notre économie puisse croître d'une manière saine."
 premier_khrushchev: "Nikita Khrouchtchev"
 premier_malenkov: "Gueorgui Malenkov"
 premier_zhukov: "Gueorgui Joukov"
 premier_beria: "Lavrenti Béria"
 premier_brezhnev: "Léonid Brejnev"
 SOV_government_corruption: "Corruption du gouvernement"
 SOV_government_corruption_endemic: "Corruption gouvernementale endémique"
 stagnation: "L'ère de la stagnation"
 SOV_Generalissimo_Stalin: "Généralissime Staline"
 SOV_Generalissimo_Stalin_desc: "Le camarade Staline a fait beaucoup pour le peuple soviétique, mais après la défaite de la bête fasciste et l'expansion de l'Union soviétique, il reste encore beaucoup à faire en ce qui concerne l'avenir du socialisme dans notre pays et à l'étranger !"
 SOV_Proclaim_Victory_Over_Fascism: "Proclamer la victoire sur le fascisme"
 SOV_Proclaim_Victory_Over_Fascism_desc: "Avec l'aide du camarade Staline et la puissance de la patrie, le peuple soviétique peut légitimement revendiquer sa victoire contre les agresseurs fascistes allemands qui cherchaient à violer notre glorieuse patrie et à la détruire à son profit !"
 SOV_Korea_Question: "Question Corée"
 SOV_Korea_Question_desc: "Le régime de Kim Ill Sung est menacé par les impérialistes occidentaux ! Il faut trouver un moyen de les aider de manière efficace !"
 SOV_Demand_War_Reparations: "Exiger des réparations de guerre"
 SOV_Demand_War_Reparations_desc: "L'Allemagne et ses alliés de l'Est étant vaincus, nous devons exiger des réparations pour les crimes de guerre qu'ils ont commis contre le peuple soviétique et pour le bombardement de plusieurs usines dans des villes soviétiques comme Minsk, Koursk, Kiev et d'autres. Nous veillerons à ce qu'ils paient intégralement chaque réparation en moins de 5 ans pour ce qu'ils ont fait !"
 SOV_Establish_European_Radar_Stations: "Établir des stations radar"
 SOV_Establish_European_Radar_Stations_desc: "Les stations radar aideront à maintenir la sécurité de notre bloc de l'Est et de notre Union stable et à suivre toute mesure potentielle que l'Occident pourrait prendre contre nous."
 SOV_Infrastructure_Effort: "Efforts en matière d'infrastructures"
 SOV_Infrastructure_Effort_desc: "L'amélioration de nos infrastructures améliorera les connexions entre les grandes villes et les communautés plus rurales de la mère patrie ainsi qu'une meilleure circulation des marchandises et des fournitures dans le pays."
 SOV_Institute_Nation_Wide_Workers_Programs: "Instituer des programmes nationaux pour les travailleurs"
 SOV_Institute_Nation_Wide_Workers_Programs_desc: "Il serait bénéfique pour la nation et le prolétariat d'établir de nouveaux programmes pour tous nos travailleurs afin qu'ils soient plus productifs."
 SOV_Resume_the_1945_Five_Year_Plan: "Reprendre le plan quinquennal de 1945"
 SOV_Resume_the_1945_Five_Year_Plan_desc: "D'ici 1960, nous serons la première puissance industrielle mondiale. Ce sont les paroles du premier ministre Joseph Staline. Au lendemain de la Grande Guerre Patriotique, notre pays a été dévasté. Il faut reprendre le quatrième plan quinquennal pour reconstruire notre pays."
 SOV_Comecon_Investments: "Investissements Comecon"
 SOV_Comecon_Investments_desc: "Nos anciens ennemis sont désormais devenus nos camarades depuis que nous avons établi de nouveaux gouvernements dans leurs pays. Nous devons y investir de nouvelles industries afin qu'ils puissent retrouver leur stabilité et que nous puissions coopérer davantage entre nos économies."
 SOV_Turkish_Straits_Crisis: "Crise du détroit turc"
 SOV_Turkish_Straits_Crisis_desc: "La Turquie détient les portes de la Méditerranée. Nous devons aborder cette question concernant nos navires et l'accès à la Méditerranée."
 SOV_Peaceful_Resolution: "Résolution pacifique"
 SOV_Peaceful_Resolution_desc: "Grâce à nos talentueux diplomates envoyés pour discuter de la question des détroits turcs et de l'accès de nos navires à la Méditerranée, nous sommes parvenus à une solution pacifique à la situation et avons réussi à éviter un conflit entre nous et la Turquie."
 SOV_Expand_the_Nuclear_Program: "Élargir le programme nucléaire"
 SOV_Expand_the_Nuclear_Program_desc: "Nous n'avons pas la capacité de rivaliser avec les États-Unis en termes de capacités nucléaires. Nous devons investir davantage de scientifiques et de notre budget dans l'avancement de notre programme nucléaire !"
 SOV_Continue_Demands_for_Regime_Chang: "Continuer à exiger un changement de régime"
 SOV_Continue_Demands_for_Regime_Chang_desc: "L'arrogance des Turcs et nos conflits historiques avec la Turquie nous donnent de nombreuses raisons de les libérer de leur régime antisoviétique et d'établir notre contrôle dans la région !"
 SOV_Partition_of_Turkey: "Partition de la Turquie"
 SOV_Partition_of_Turkey_desc: "La Turquie étant finalement vaincue et sous notre sphère d'influence, il est impératif que nous cédons une partie de ses terres à la patrie soviétique en guise de compensation !"
 SOV_The_Greek_Civil_War: "La guerre civile grecque"
 SOV_The_Greek_Civil_War_desc: "Les camarades grecs ont déclaré la guerre à leur établissement. Il est essentiel que nous prenions position sur ce sujet potentiellement stratégique."
 SOV_Leave_them_to_their_Fate: "Laissez-les à leur sort"
 SOV_Leave_them_to_their_Fate_desc: "Compte tenu des pertes subies par nos camarades en Grèce, il serait trop coûteux de tenter de les sauver maintenant. Dans l'intérêt de la paix internationale et pour la préparation potentielle d'une autre révolution plus réussie en Grèce, nous devons les abandonner à leur sort."
 SOV_Intervene_in_the_Greek_Civil_War: "Intervenir dans la guerre civile grecque"
 SOV_Intervene_in_the_Greek_Civil_War_desc: "Nos camarades grecs ont besoin de nous pour aider leur révolution à réussir ! La révolution pour le socialisme en Grèce est trop importante sur le plan stratégique pour que nous l'ignorions ! Il faut les aider !"
 SOV_Invite_Greece_to_COMECON: "Inviter la Grèce au COMECON"
 SOV_Invite_Greece_to_COMECON_desc: "Avec notre intervention en Grèce, nous devons maintenant les introduire officiellement dans notre sphère d'influence et orienter leur économie vers la voie du socialisme !"
 SOV_Revival_of_the_Russian_Orthodox_Church: "Renaissance de l'Église orthodoxe"
 SOV_Revival_of_the_Russian_Orthodox_Church_desc: "Malgré la suppression passée de l'Église orthodoxe, nous sommes désormais conscients de son importance sociale pour le peuple soviétique et des avantages qu'il y a à laisser l'Église exister sous l'État soviétique. Nous allons maintenant laisser l'Église se revitaliser pour gagner les faveurs de la population orthodoxe en faveur du socialisme !"
 SOV_Soviet_Socialist_Patriotism: "Patriotisme socialiste soviétique"
 SOV_Soviet_Socialist_Patriotism_desc: "Après la Grande Guerre Patriotique, nous avons suscité une nouvelle vague d'amour pour notre patrie et notre mode de vie socialiste ! Notre nation entière chante la chanson de la splendeur à nos anciens combattants et à nos travailleurs pour avoir assuré un avenir pour notre syndicat !"
 SOV_stalin_notes: "Les notes de Staline"
 SOV_stalin_notes_desc: "Après la division de l'Allemagne, nous avons montré qui était la véritable puissance du monde. Cela fait quelques années depuis cette division et il existe encore une possibilité de réunification allemande, mais cela dépendra de nos conditions d'un gouvernement neutre en Allemagne et du retrait de nos forces et des forces occidentales dans l'intérêt d'une paix durable. Nous proposerons cela à l'ouest."
 SOV_Direct_Intervention: "Intervention directe"
 SOV_Direct_Intervention_desc: "Les Américains et leur État bandit coréen au Sud devront passer par nous s'ils veulent même mettre le pied sur la péninsule coréenne !"
 SOV_Indirect_Intervention: "Intervention indirecte"
 SOV_Indirect_Intervention_desc: "Nous enverrons notre équipement et nos hommes pour aider nos camarades coréens au Nord. Nous devons le faire en secret pour ne pas alarmer les Américains."
 SOV_expand_gulags: "Agrandissez les Goulags"
 SOV_Further_Purges: "D'autres purges"
 SOV_Further_Purges_desc: "Même si Trotsky est mort, ainsi que nombre de ses alliés grâce à la grande purge, il y a encore ceux dans notre bureau politique qui souhaitent du mal au camarade Staline et à ce qu'il a fait pour notre nation et qui doivent être entièrement purgés du parti."
 SOV_Favour_Beria_and_Malenkov: "Favoriser Beria et Malenkov"
 SOV_Favour_Beria_and_Malenkov_desc: "Le camarade Beria et Malenkov se sont montrés fidèles au camarade Staline et à sa politique. Nous devrions les maintenir à leurs postes élevés au sein du bureau politique afin de consolider l'influence du camarade Staline pour qu'il reste dans le parti."
 SOV_Purge_the_Lenningrad_Party_Leadership: "Purger la direction du parti de Léningrad"
 SOV_Purge_the_Lenningrad_Party_Leadership_desc: "Les dirigeants de Leningrad ont montré leur dégoût envers les purges au sein du bureau politique. Ils seront ajoutés sur le billot."
 SOV_the_doctors_plot: "Le complot des médecins"
 SOV_the_doctors_plot_desc: "Récemment, le camarade Staline était en mauvaise santé et a dû compter sur des médecins juifs pour l'aider. Il en est cependant venu à ne plus leur faire confiance et les considère désormais comme altérant sa santé pour le tuer et a donc ordonné une campagne contre ces médecins et contre les Juifs de toute l'Union destinés à être envoyés en Sibérie pour avoir tenté de lui faire du mal."
 SOV_propaganda_against_judaism: "Propagande contre le judaïsme"
 SOV_propaganda_against_judaism_desc: "Nous devons faire avancer le complot des médecins avec une propagande contre les Juifs dans notre pays, car ils ont été ciblés comme ennemis de l'État et comme espions américains !"
 SOV_anti_western_propaganda: "Propagande anti-occidentale"
 SOV_anti_western_propaganda_desc: "L'Occident a sans aucun doute engagé ces « médecins » pour assassiner le camarade Staline ! Nous devons alors montrer notre colère contre l'Occident pour montrer que nous ne tolérerons pas leurs espions dans notre pays !"
 SOV_Purge_the_Georgian_Party_Leadership: "Purger la direction du parti géorgien"
 SOV_Purge_the_Georgian_Party_Leadership_desc: "Les dirigeants de la République Socialiste Soviétique de Géorgie ont montré leur hostilité aux nouvelles purges du bureau politique menées par le camarade Staline. Ils seront ajoutés sur le billot."
 SOV_Eastern_European_Stimulus_Package: "Plan de relance pour l'Europe de l'Est"
 SOV_Eastern_European_Stimulus_Package_desc: "Alors que les Américains aident l'Europe occidentale avec le plan Marshall, nous devrions faire quelque chose de similaire afin que nos pays puissent rivaliser avec l'Occident et se remettre de la guerre !"
 SOV_Jumpstart_Belorussian_Industry: "Relancer l'industrie biélorusse"
 SOV_Jumpstart_Belorussian_Industry_desc: "Pour nous remettre davantage de la guerre, nous devons aider l'industrie de nos camarades biélorusses !"
 SOV_Jumpstart_Baltic_and_Balkan_Industry: "Relancer l'industrie baltique et balkanique"
 SOV_Jumpstart_Baltic_and_Balkan_Industry_desc: "Après l'intégration de l'Estonie, de la Lettonie et de la Lituanie dans notre grande Union en 1940, nous devrions investir dans leur industrie ainsi que dans nos nouveaux alliés des Balkans pour les aider à se rétablir et à rester fidèles !"
 SOV_Invest_In_Ukranian_Reconstruction_Program: "Investir dans les programmes de reconstruction ukrainiens"
 SOV_Invest_In_Ukranian_Reconstruction_Program_desc: "Nos camarades ukrainiens ont été durement touchés par l'invasion allemande et leurs maisons et industries ont été détruites. Pour gagner leurs faveurs et relancer leur pouvoir économique, des programmes de reconstruction de leur pouvoir économique seront lancés pour les aider."
 SOV_Execute_Khruschev: "Exécuter Khrouchtchev et Joukov"
 SOV_Execute_Khruschev_desc: "Joseph Staline considère Joukov et Khrouchtchev comme des menaces pour sa base de pouvoir. Pour assurer sa sécurité et celle de l'Union soviétique, Khrouchtchev et Joukov doivent être éliminés."
 SOV_Begin_Military_Purges: "Commencer les purges militaires"
 SOV_Begin_Military_Purges_desc: "La Grande Purge des années 1930 a contribué à éliminer les éléments tsaristes de l'armée russe. Nous devons une fois de plus purger l'armée pour assurer la sécurité de l'Union face au monde capitaliste."
