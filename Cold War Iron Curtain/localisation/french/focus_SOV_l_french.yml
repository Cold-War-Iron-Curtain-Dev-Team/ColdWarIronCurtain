 SOV_eliminate_shukhevych: "Éliminer Roman Shukhevych"
 SOV_eliminate_shukhevych_desc: "L'armée insurrectionnelle ukrainienne continue de saigner l'ouest de l'Ukraine et son commandant Roman Shukhevych dirige la résistance depuis l'ombre. La reconstruction de la république ne peut pas avoir lieu tant que l'OUN-UPA contrôle les campagnes. Le MGB va monter une opération décisive pour le traquer et l'éliminer, brisant ainsi l'insurrection une fois pour toutes."
 SOV_eliminate_shukhevych_tt: "Débloque §YReconstruction ukrainienne complète§!"
 SOV_UST.1.t: "Réélection du secrétaire général Dmitri Ustinov"
 SOV_UST.1.d: "Le XXIVe Congrès du Parti a confirmé Dmitri Fiodorovitch Ustinov au poste de secrétaire général pour un second mandat, prolongeant ainsi son mandat et consolidant la domination de l'aile militaro-industrielle et techno-administrative du Parti.\nNé à Samara en 1908 dans une famille ouvrière, Ustinov rejoint le Parti communiste en 1927 et gravit les échelons en tant qu'ingénieur et organisateur industriel. Diplômé de l'Institut de génie mécanique militaire (1934), il devient directeur de l'usine d'armement bolchevique avant d'être nommé commissaire du peuple à l'armement pendant la Grande Guerre patriotique. Son évacuation réussie des industries de défense de Leningrad vers l'Oural lui a valu le titre de Héros du travail socialiste. Après 1945, il a supervisé la saisie de la technologie des missiles, des scientifiques et des actifs industriels allemands, jetant ainsi les bases des fusées et des systèmes d'armes avancés soviétiques.\nAprès avoir été secrétaire du Comité central du complexe militaro-industriel (1965-1971) et ministre de la Défense jusqu'en 1971, la réélection d'Ustinov marque la continuité et l'accélération du programme de cybernisation initié sous Lazar Kaganovitch. Son nouveau mandat met l'accent sur l'automatisation, la planification assistée par ordinateur, la cybernétique et l'intégration des systèmes de contrôle numérique dans l'industrie, la défense et l'administration d'État."
 SOV_UST.1.a: "Vive le camarade Ustinov !"
 SOV_UST.6.t: "Le secrétaire général Nikolai Ogarkov a été élu."
 SOV_UST.6.d: "Le Soviet suprême et le Congrès du Parti ont confirmé Nikolai Vasilyevich Ogarkov comme nouveau secrétaire général du Parti communiste de l'Union soviétique, marquant ainsi un virage décisif vers une réforme technocratique et un socialisme cybernétique. Figure de proue de la faction cybernétique Kaganovitch-Ustinov, la victoire d'Ogarkov reflète une reconnaissance croissante du fait que le système soviétique doit se moderniser ou prendre du retard.\nOgarkov s'est fait connaître en tant que chef d'état-major général, où il a ouvertement reconnu le retard technologique de l'URSS par rapport aux États-Unis, arguant qu'une réforme économique significative nécessiterait inévitablement une réforme politique. Ses opinions contrastaient fortement avec la doctrine orthodoxe et provoquaient la résistance des officiers traditionalistes attachés à la guerre de masse de type Seconde Guerre mondiale.\nEn tant que réformateur militaire, Ogarkov a été le pionnier du concept d'une force de frappe plus petite, hautement mobile et axée sur la technologie, mettant l'accent sur les armes de précision, les systèmes de commandement automatisés et la cybernétique. Il a supervisé des exercices opérationnels et stratégiques massifs, notamment Zapad-81, qui ont testé des systèmes de contrôle industriels, les premières munitions à guidage de précision et des concepts avancés de commandement et de contrôle. Il a également créé un centre de recherche stratégique au sein de l'état-major général pour intégrer les forces de missiles, la défense antimissile et la théorie des systèmes.\nEn tant que secrétaire général, Ogarkov a annoncé un nouveau cours centré sur :\n- Standardisation des programmes numériques et cybernétiques à travers l'État et l'armée\n- Finalisation et extension du réseau informatique national OGAS\n- Promotion des véhicules électriques et de l'industrie automatisée\n- Transition vers une doctrine moderne de « révolution dans les affaires militaires »"
 SOV_UST.6.a: "Longue vie au camarade Ogarkov !"
 SOV_UST.2.t: "Dépolitisation de la science et de l'éducation soviétiques"
 SOV_UST.2.d: "Le secrétaire général Dmitri Ustinov a annoncé une réforme radicale visant à réduire le dogmatisme politique et l'ingérence idéologique dans les institutions scientifiques, militaires et éducatives de l'Union soviétique. Présentée comme une étape nécessaire pour maintenir la parité technologique et le développement socialiste à long terme, cette politique s'applique non seulement à l'URSS mais également aux systèmes de formation et de recherche du Pacte de Varsovie.\nSelon la nouvelle directive, le mérite scientifique, la compétence technique et la réussite créative doivent prévaloir sur la loyauté politique dans les nominations, les promotions et les décisions de financement. Le contrôle du parti au sein des universités, des académies militaires, des écoles de militsiya et des instituts scientifiques sera réduit, les programmes d'études et de recherche bénéficiant d'une plus grande autonomie professionnelle.\nL'Académie des sciences de l'Union soviétique, qui comprend près de 300 instituts, laboratoires et observatoires, conservera son rôle de coordination des priorités nationales de recherche, mais en mettant un accent renouvelé sur la science fondamentale, l'innovation et les résultats appliqués, plutôt que sur une conformité idéologique rigide. Les académies régionales et républicaines sont encouragées à identifier et à nourrir les talents locaux, accélérant ainsi la traduction de la recherche dans la pratique industrielle et militaire.\nUstinov a justifié la réforme en avertissant qu'une politisation excessive avait étouffé l'initiative, ralenti les progrès cybernétiques et technologiques et découragé les scientifiques prometteurs. Le nouveau cours vise à libérer la créativité au sein des structures socialistes, en positionnant la science et l'éducation comme des moteurs de modernisation plutôt que comme des instruments de dogme."
 SOV_UST.2.a: "Pragmatisme, Résultats, Socialisme."
