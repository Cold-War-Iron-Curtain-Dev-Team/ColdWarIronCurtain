 #Vietnam#
 SOV_VIN.0.t: "Reconnaissance de la souveraineté du Vietnam"
 SOV_VIN.0.d: ""
 SOV_VIN.0.a: ""
 SOV_VIN.1.t: "Reportages sur le voyage de Ho Chi Minh"
 SOV_VIN.1.d: "Au début de [GetYear], le président Ho Chi Minh du Vietnam a préparé des lettres et signé des décrets. Dans l'après-midi du 2 janvier, il a quitté la zone de sécurité de la province de Tuyen Quang et s'est dirigé vers le poste frontière de Chongqing. Il entreprend un voyage en Chine et en Union soviétique.\nLe voyage d'Hô Chi Minh a été mené secrètement pour assurer la sécurité, car les soldats français contrôlaient étroitement la frontière avec la Chine et les restes des gangs et des soldats du Kuomintang restaient toujours sur le territoire chinois nouvellement libéré.\nLa délégation était composée de neuf personnes : Hô Chi Minh, Tran Dang Ninh, l'interprète Pham Van Khoa, le docteur Le Van Chanh et la sécurité japonaise. Le groupe de travail comprenait le colonel Lam Kinh, l'interprète Le Phat, l'opérateur radio Ngo Vi Thien (qui assistait également Tran Dang Ninh) et l'opérateur radio Nhiem Vu.\nDès le début du voyage, le 1er juin, le journal vietnamien « Vérité » publiait un télégramme de félicitations d'Ho Chi Minh, au nom du peuple vietnamien, à I.V. Staline à l'occasion de son 70e anniversaire."
 SOV_VIN.1.a: "Un allié potentiel"
 SOV_VIN.2.t: "Reportages sur le voyage de Ho Chi Minh"
 SOV_VIN.2.d: "Le [?global.date.GetDateStringNoHourLong], Hô Chi Minh a quitté Pékin à bord d'un train spécial chinois à destination de Moscou. Il était accompagné de M. Tran Dang Ninh..\nQuelques jours plus tard, depuis Chita, Hô Chi Minh envoyait à Staline le télégramme suivant :\n\"1. J'espère que ma visite à Moscou restera secrète pour deux raisons. Premièrement, seuls quelques membres du Comité central du Parti communiste et deux membres du gouvernement savent que j'ai quitté le Vietnam. Deuxièmement, je crois que si les Français savaient que j'ai quitté le Vietnam, ils pourraient entreprendre une action politique et militaire.\n2. Le [?global.date.GetDateStringNoHourLong], j'ai demandé par radio la position du Parti communiste vietnamien sur la nature de ma visite à Moscou. Cependant, la réponse a été que je ne pourrais arriver à Moscou que dans 10 jours au plus tôt.\n3. Si vous, camarade Staline, espérez que mon voyage à Moscou soit officiel, j'espère que le Parti communiste vietnamien partage votre position.\n4. En arrivant à Moscou, j'aimerais que vous me permettiez d'aller directement chez vous.\n\nSalutations, Hô Chi Minh.\""
 SOV_VIN.2.a: "Accepter la délégation"
 SOV_VIN.2.b: "Refuser la délégation"
 SOV_VIN.3.t: "Ho Chi Minh a réussi l'examen"
 SOV_VIN.3.d: "Hô Chi Minh arrive à Moscou pour une rencontre confidentielle avec le camarade Staline et nos dirigeants. Bien que menée discrètement, cette visite marque un tournant historique : la République démocratique du Vietnam est formellement accueillie dans le camp socialiste.\nLors des pourparlers du Kremlin, Staline reçoit Ho personnellement aux côtés de Molotov et d'autres hauts dirigeants soviétiques. L'atmosphère est cordiale et respectueuse, signe de la reconnaissance par Moscou de Hô Chi Minh comme leader légitime de la révolution vietnamienne. Un moment symbolique se produit lorsque Staline signe une copie de l'Union soviétique en construction pour Ho, suivie par les signatures d'autres membres du Politburo - un sceau tacite de soutien politique.\nÀ huis clos, les discussions se concentrent sur la guerre anticoloniale du Vietnam, la reconnaissance internationale et la coordination avec le bloc socialiste au sens large. Peu de temps après cette visite, l'Union soviétique s'oriente vers une reconnaissance diplomatique totale du gouvernement de Ho, renforçant ainsi la position du Vietnam dans sa lutte contre la domination coloniale et l'impérialisme français."
 SOV_VIN.3.a: "Alors que veux-tu d'autre, Ho Chi Minh"
