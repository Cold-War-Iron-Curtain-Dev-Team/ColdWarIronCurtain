 #Soviet Starting events#
 sov_turkey_in_nato.3.t: "La Turquie refuse de se conformer à nos exigences"
 sov_turkey_in_nato.3.desc: "Le mépris flagrant d'Ankara pour nos intérêts de sécurité est une provocation directe de l'influence légitime de l'Union soviétique dans la région de la mer Noire. En rejetant nos demandes, la Turquie renforce la position de l'alliance occidentale sur notre flanc sud. Alors que certaines voix au sein du Kremlin appellent à une démonstration de force immédiate, d'autres mettent en garde contre le risque de déclencher une crise qui pourrait dégénérer en une autre catastrophe mondiale. L'avenir de la domination régionale soviétique - et l'équilibre des pouvoirs - est en jeu."
 sov_turkey_in_nato.3.a: "Exige immédiatement que le gouvernement turc se replie !"
 sov_turkey_in_nato.3.b: "Un tel recul ne vaut pas le risque d'une Troisième Guerre mondiale."

 sov_turkey_in_nato.2.t: "Les Soviétiques nous ordonnent de ne pas adhérer à l'OTAN."
 sov_turkey_in_nato.2.desc: "Notre nation se trouve à un carrefour périlleux. Adhérer à l'OTAN signifie s'assurer des alliances et du soutien militaire de l'Occident, mais cela risque également de susciter la colère de l'Union soviétique, qui a lancé un avertissement sévère contre toute nouvelle dérive vers l'influence occidentale. Les souvenirs de la dévastation de la Seconde Guerre mondiale restent frais ; nous devons décider s'il faut protéger notre souveraineté en nous alignant sur l'OTAN ou préserver des relations prudentes avec Moscou en accédant à leurs exigences. L'une ou l'autre voie pourrait façonner le destin de la Turquie pour des générations."
 sov_turkey_in_nato.2.a: "Accomplissez leurs demandes et annoncez nos retraits aux Américains."
 sov_turkey_in_nato.2.b: "Ne bougez pas, les Soviétiques sont trop faibles pour exiger quoi que ce soit !"

 sov_turkey_in_nato.1.t: "La Turquie rejoint l'OTAN !"
 sov_turkey_in_nato.1.desc: "Défiant nos avertissements clairs, le gouvernement turc a pris une mesure provocatrice en signant son engagement envers l'alliance de l'OTAN. Les décideurs occidentaux saluent l'entrée de la Turquie comme un succès stratégique dans la maîtrise de l'influence soviétique. Au Kremlin, la sonnette d'alarme retentit : beaucoup y voient une menace directe pour nos frontières et la stabilité régionale. Nos dirigeants doivent maintenant décider s'ils doivent réagir avec force, en insistant sur un retrait immédiat de l'OTAN, ou rechercher une solution diplomatique pour éviter une confrontation totale."
 sov_turkey_in_nato.1.a: "Exigez leur retrait immédiat de l'OTAN."
 sov_turkey_in_nato.1.b: "Nous ne pouvons pas risquer la guerre, essayons de négocier avec eux."

 sov_german_question.1.t: "La question allemande"
 sov_german_question.1.desc: "Pour l'Union soviétique, l'avenir de l'Allemagne ne se limite pas à la politique : c'est l'héritage de la Grande Guerre patriotique et les sacrifices consentis par notre peuple. Nous avons une occasion unique de façonner les événements en Allemagne de l'Ouest, en veillant à ce qu'elle ne constitue plus jamais une menace pour notre patrie ou ne sape les victoires que nous avons remportées en 1945. Même si une ingérence directe risque d'attiser les tensions avec les puissances occidentales, ne rien faire pourrait permettre aux forces réactionnaires de se reconstruire et de nous encercler avec des régimes hostiles. Chaque décision entraîne de graves conséquences sur notre position mondiale."
 sov_german_question.1.a: "Notre ingérence dans la politique ouest-allemande pourrait remodeler tout le statu quo d'après-guerre."

 sov_percentage_agreement.1.t: "Les accords de pourcentage"
 sov_percentage_agreement.1.desc: "Durant les dernières étapes de la Grande Guerre Patriotique, nos dirigeants ont négocié des accords secrets avec la Grande-Bretagne pour délimiter les sphères d'influence. Aujourd'hui, il est clair que les puissances occidentales n'ont pas honoré ces accords, s'immisçant dans des territoires qui relèvent légitimement de la protection soviétique. Devrions-nous continuer à reconnaître ces engagements dans l'espoir de préserver la paix, ou devrions-nous les rejeter complètement et soutenir nos camarades communistes en Grèce, où l'ingérence impérialiste menace la croissance du socialisme ? La décision définira le rôle de l'Union soviétique dans le façonnement du monde d'après-guerre."
 sov_percentage_agreement.1.a: "Respectez les accords même si les Britanniques les ont rompus en premier."
 sov_percentage_agreement.1.b: "Les accords sont déjà rompus, aidons nos frères communistes en Grèce !"
