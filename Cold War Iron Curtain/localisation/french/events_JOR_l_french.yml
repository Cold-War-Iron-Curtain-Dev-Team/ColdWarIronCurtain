l_french:

 Jor.1.d:0 "    Aujourd'hui, alors qu'il pénétrait dans la mosquée Al-Aqsa à Jérusalem-Est occupée, un tireur palestinien isolé a tiré sur le roi Abdallah Ier et son petit-fils Hussein. Hussein s'en est sorti avec des blessures légères, mais le roi a été mortellement blessé par balle et est aujourd'hui décédé. Son fils Talal va désormais monter sur le trône jordanien."
 Jor.2.d:0 "    Après avoir reçu un diagnostic de schizophrénie, le parlement auquel il a lui-même accordé des pouvoirs étendus a décidé que le roi Talal serait contraint d'abdiquer en raison de sa maladie. Son fils Hussein va désormais monter sur le trône jordanien."
 Jor.3.d:0 "    Aujourd'hui, le roi Hussein est malheureusement décédé d'un lymphome et d'autres problèmes de santé. Des foules immenses se sont rassemblées devant son hôpital alors qu'il était déclaré mort, et il a récemment nommé son fils Abdullah prince héritier de Jordanie, succédant à son frère Hassan. Abdullah va désormais monter sur le trône jordanien."
 Jor.4.d:0 "    Aujourd'hui, Talal de Jordanie a réaffirmé son contrôle en tant que monarque jordanien après que son parlement ait tenté de le destituer au moyen d'une motion de censure alors que Talal était à l'hôpital pour un traitement, le raisonnement étant que Talal souffrait de schizophrénie et donc inapte au pouvoir. Talal a ainsi réaffirmé son contrôle pour le moment, mais nombreux sont ceux qui doutent de ce que l'avenir nous réserve avec Talal à la tête de la Jordanie."
 Jor.5.d:0 "    Aujourd'hui, le gouvernement jordanien a annoncé l'interdiction des crabes. Du personnel militaire a été dépêché pour rassembler et expulser tous les crabes trouvés en Jordanie. Talal a considéré les crabes comme une menace pour la sécurité nationale et a jugé nécessaire de les interdire formellement. Des crabes sont déjà jugés par les tribunaux jordaniens et toute personne soupçonnée d'héberger des crabes fugitifs sera également jugée. Lorsqu'on a demandé à un porte-parole du gouvernement pourquoi les crabes sont considérés comme une menace pour la sécurité nationale, il a simplement déclaré qu'il s'agissait d'un ordre de Talal et qu'il ne fallait donc pas le remettre en question. Partout en Jordanie, les gens sont unis dans la confusion et beaucoup pensent que cela pourrait bien être le début des étranges tendances de Talal."
 Jor.6.d:0 "    Le jeune colonel Gamal Abdel Nasser a consolidé son pouvoir au sein du Conseil de commandement révolutionnaire (RCC) égyptien. Nasser est panarabiste et un fervent anti-impérialiste. On ne sait toujours pas ce que prévoit le jeune président égyptien, mais une chose est sûre. Une nouvelle ère vient de commencer pour l'Égypte et peut-être pour le monde arabe tout entier."
 Jor.7.d:0 "    Depuis la Nakba et l'occupation de la Cisjordanie, la Jordanie souffre sous la pression des Israéliens et des réfugiés palestiniens, tant sur le plan politique qu'économique. Les Palestiniens représentent une partie importante de la population jordanienne totale et sont plus enclins aux idéologies nationalistes et extrémistes arabes. En raison de leur grand nombre, nous ne parvenons pas à déloger les plus dangereux de ces agitateurs et nous nous retrouvons donc dans une impasse, ce qui a créé une tension en Jordanie qui peut être ressentie par tout le monde. Nous devrons à l'avenir décider quoi faire face à ce problème croissant."
 Jor.8.d:0 "    Aujourd'hui, le chef d'état-major militaire Ali Abu Nuwar a lancé l'opération Hachem dans laquelle des unités jordaniennes ont encerclé la capitale Amman. Lorsque Hussein s'est méfié du mouvement des troupes et pensant que Nuwar faisait preuve de force pour renverser Hussein, il a appelé Nuwar à retirer ses troupes et a pris des mesures pour dissoudre le gouvernement arabiste de Suleiman Nabulsi. Hussein doit désormais attendre de voir ce qu'il adviendra de ce qu'il considère comme une tentative de coup d'État contre lui."
 Jor.9.d:0 "    Après avoir réalisé les mouvements de troupes suspects initiés par le chef d'état-major Ali Abu Nuwar au cours desquels il a encerclé la capitale jordanienne Amman, Hussein n'a pas tardé à ordonner à Nuwar de retirer immédiatement ses troupes, ce que Nuwar a fait. Hussein a ensuite pris position en ordonnant l'arrestation de ceux qu'il prétendait être des conspirateurs contre lui et la destitution du gouvernement de gauche panarabe sympathisant au Parlement qui, une fois la poussière retombée, avait assuré son règne."
 Jor.10.d:0 "   Le Premier ministre Suleiman Nabulsi, un dirigeant nationaliste arabe, a été contraint de démissionner à la suite d'une lutte avec le roi Hussein pour savoir qui détenait le pouvoir. Le retrait de Nabulsi a poussé le chef d'état-major de l'armée jordanienne, Ali Abu Nuwar, à activer les Jordaniens urbains et les Palestiniens au sein de l'armée qui lui est fidèle. Il dut d'abord neutraliser les unités militaires bédouines fidèles au roi. Il a d'abord convaincu le roi Hussein d'envoyer le principal régiment bédouin de la capitale pour un exercice militaire. Lorsqu'ils sont partis, il a envoyé des unités qui lui étaient fidèles pour désarmer les unités bédouines restantes et sécuriser les principaux bâtiments gouvernementaux. Malgré des affrontements mineurs, le complot réussit et le roi fut bientôt encerclé. Face à sa situation intenable, le roi Hussein capitula. Dans une émission nationale, Ali Abu Nuwar a annoncé sa révolution, la fin de la monarchie et un nouveau gouvernement d'officiers libres. Il a ajouté que des pourparlers étaient déjà en cours pour s'unifier avec la République arabe unie afin de répondre aux aspirations du peuple jordanien."
 Jor.11.d:0 "   Après des décennies d'efforts, les fières dynasties hachémites d'Irak et de Jordanie ont annoncé leur unification au sein de la Fédération arabe. Deux facteurs se sont révélés essentiels pour permettre cela. La montée récente de la République Arabe Unie et son idéologie dangereuse, notamment parmi le peuple, ont poussé les deux nations à reconnaître l'unification comme un moyen de protéger le peuple. Plus important encore, les jeunes monarques sont des amis d'enfance et c'est leur désir personnel qui a été le principal moteur de leur succès. La Fédération arabe unit la politique étrangère et la défense des deux nations mais laisse l'administration entre les mains de chaque pays. De cette façon, les deux monarques conservent leur statut élevé mais restent capables de contrer la menace nationaliste arabe, qu'elle apparaisse à l'intérieur ou à la frontière. Les deux monarques prévoient de se recevoir lors de banquets pour commémorer ce jour historique pour les peuples d'Irak et de Jordanie."
 Jor.12.d:0 "   La lutte idéologique dans le monde arabe a pris aujourd'hui un tournant majeur avec l'annonce de la création d'une fédération arabe entre l'Irak et la Jordanie. Les deux nations sont contrôlées par des monarques hachémites qui se sont engagés à unir leurs politiques étrangère et de défense. Ceci est considéré comme une réaction directe à la récente formation de la République Arabe Unie (RAU). La RAU a rapidement condamné la nouvelle alliance, la qualifiant de dernier combat de princes réactionnaires et appelant les Arabes à se soulever dans les deux pays. Les gouvernements irakien et jordanien ont tous deux déclaré que la Fédération arabe était l'aboutissement d'un rêve vieux de plusieurs décennies pour la dynastie et que les gagnants seraient les peuples d'Irak et de Jordanie. Des rassemblements pro-royaux ont eu lieu à Amman et à Bagdad pour souligner la popularité de l'accord auprès de la population. Les analystes notent que malgré les allégations d'unification, la Fédération arabe est principalement une alliance militaire destinée à contrer la RAU."
 