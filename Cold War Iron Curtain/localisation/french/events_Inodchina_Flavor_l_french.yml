 Bangkok_Plot_1_desc:0 "\nNorodom Sihanouk, roi du Cambodge, a été destitué par les généraux et hommes politiques de droite Son Ngoc Thanh, Sam Sary et le chef de guerre et gouverneur régional cambodgien Dap Chhuon ; Son Ngoc Thanh a rassemblé des guérilleros anticommunistes et antimonarchistes dans les régions du sud du Cambodge tandis que Chhuon a déclenché un soulèvement dans le nord-est. Tandis que les troupes du roi étaient envoyées pour faire face à la rébellion, les guérilleros menés par Thanh envahirent Phnom Penh et s'emparèrent du palais ; une déclaration de Son Ngoc Thanh a proclamé la formation de la République khmère, alors que le roi est introuvable, il est probable qu'il s'est enfui avec sa famille loin du Cambodge. La Thaïlande, le Sud-Vietnam et les États-Unis sont tous impatients d'entamer des négociations avec le nouveau gouvernement."
 Bangkok_Plot_2_desc:0 "\nSon Ngoc Thanh, un général de droite cambodgien, ainsi que Sam Sary et le chef de guerre et gouverneur cambodgien régional, Dap Chhuon, ont tenté de destituer le roi du Cambodge, Norodom Sihanouk, de sa place de chef de l'État et de roi de la nation ; tandis que Thanh massait des guérilleros anticommunistes et antimonarchistes dans le sud du pays, pour la plupart issus de minorités khmères Krom, Chhuon allait déclencher un soulèvement dans le nord-est. Le plan a été déjoué par les services de renseignement de Norodom Sihanouk qui ont tenté d'arrêter Chhuon, avant qu'il ne s'échappe et soit ensuite capturé - mourant de ses blessures plus tard après avoir été interrogé. Sary et Thanh ont tous deux fui le pays tandis qu'un citoyen américain et présumé opérateur radio Victor Matsui a été arrêté, ce qui a incité Norodom à accuser la CIA d'avoir déclenché un coup d'État contre lui en raison de ses relations chaleureuses avec la République populaire de Chine. Des photos du cadavre de Chhuon ont été prises et montrées à Phnom Penh, dernière marque d'une tentative de coup d'État contre Norodom ; les partisans du régime ont accusé la Thaïlande, le Sud-Vietnam et les États-Unis de tenter de destituer le dirigeant cambodgien."
 
 Mon_Cambodia_1_desc:0 "Critique virulent du prince Norodom Sihanouk en raison de sa détente avec la République populaire de Chine, général nationaliste et de droite, Dap Chhuon fut ministre de la Sécurité intérieure et gouverneur de la province de Siem Reap dans les années 1950. Après avoir été exclu du Cabinet, il a de plus en plus rompu ses liens avec le régime Norodom, ce qui a abouti au complot de Bangkok. Il a été arrêté, interrogé et est décédé des suites de ses blessures ; beaucoup affirment que Lon Nol, un général et homme politique cambodgien, l'a exécuté par crainte d'être lui-même impliqué dans le complot de Bangkok."
 Mon_Cambodia_2_desc:0 "Nop Bophann, journaliste, rédacteur en chef du journal Pracheachon et l'un des représentants du Front uni Issarak de gauche, a été abattu aujourd'hui. Tué devant une caserne militaire à Phnom Penh, il était un élément dangereux de l'administration de Norodom Sihanouk en raison de son soutien à un mouvement de guérilla qui détenait autrefois la moitié du territoire cambodgien ; Beaucoup affirment que le prince lui-même a ordonné sa mort alors qu'il nie bien sûr ces affirmations avec véhémence et prétend qu'il était un admirateur de la détermination de Bophann."
 Mon_Cambodia_3_desc:0 "Le chef du Comité Urbain de Pracheachon, Tou Samouth, a disparu de tout le pays. Aucune trace de l'homme politique de gauche et mentor de l'éminent dirigeant communiste Saloth Sar, mieux connu sous le nom de Pol Pot, n'a été trouvée. Homme intelligent au tempérament modéré, il était connu pour avoir appelé à des négociations pacifiques avec le roi Norodom Sihanouk et pour avoir reconnu en lui une figure de stabilité et d'unité nationale. Beaucoup dans l'entourage de Pol Pot affirment que Lon Nol, un général militaire cambodgien, l'a arrêté et exécuté ; tandis que des rumeurs, même au sein du parti, prétendent que c'est Pol Pot qui aurait organisé l'assassinat de son ancien mentor et allié. Quelle que soit la véritable raison de la disparition et de la mort de Tou Samouth, elle est désormais enterrée entre des piles de documents au Cambodge."
 
 EVT181246_TITLE:0 "[GetNewspaperHeader]Première guerre d'Indochine"
 EVT181246_DESC:0 "Compatriotes de tout le pays !\nPar amour de la paix, nous avons fait des concessions. Mais plus nous faisions de concessions, plus les colonialistes français allaient loin car ils sont résolus à envahir à nouveau notre pays.\nNon!\nNous préférons tout sacrifier plutôt que de perdre notre pays, plutôt que de retourner à l'esclavage.\nCompatriotes ! Se soulever!\nHommes et femmes, vieux et jeunes, quels que soient leurs croyances, leurs partis politiques ou leurs nationalités, tous les Vietnamiens doivent se lever pour combattre les colonialistes français et sauver la Patrie. Ceux qui ont des fusils utiliseront leurs fusils. Ceux qui ont des épées utiliseront leurs épées. Ceux qui n'ont pas d'épée utiliseront leurs pelles, leurs houes et leurs bâtons. Chacun doit s'efforcer de s'opposer aux colonialistes et de sauver son pays.\nSoldats, gardes d'autodéfense, miliciens !\nL'heure de la libération nationale a sonné ! Nous devons sacrifier jusqu'à notre dernière goutte de sang pour sauver notre pays. Quelles que soient les difficultés que nous devons endurer, nous sommes prêts à les endurer. Avec la détermination de se sacrifier, la victoire sera nôtre !\nVive un Vietnam indépendant et unifié !"
 EVT181246_OPTA:0 "Vive la résistance victorieuse !"
 
 EVT831949_TITLE:0 "[GetNewspaperHeader]Accords de l'Élysée"
 EVT831949_DESC:0 "Le 8 mars 1949, le président français Vincent Auriol et l'ancien empereur Bao-Dai ont signé les accords de l'Élysée, reconnaissant officiellement l'État fantoche du Vietnam comme un État associé indépendant au sein de l'Union française, avec Bao-Dai comme chef d'État.\nCependant, l'État du Vietnam n'était qu'un régime fantoche dépendant fortement de la puissance coloniale française pour son existence. Malgré son propre gouvernement, sa propre administration et son armée, elle resta fermement sous contrôle français.\nUne analyse juridique basée sur des preuves historiques révèle que les accords de l'Élysée, orchestrés par les colonialistes français, étaient illégitimes dès le départ pour plusieurs raisons. Premièrement, après la déclaration d'indépendance de l'empereur Bao-Dai en mars 1945, qui a annulé les traités antérieurs avec la France, les Français n'avaient plus aucun statut juridique au Vietnam. Deuxièmement, Bao-Dai lui-même n'avait plus l'autorité de représenter la nation, car il avait abdiqué le 25 août 1945 et était simplement un citoyen vietnamien nommé Nguyen Phuc Vinh Thuy. Enfin, le gouvernement légitime du Vietnam à cette époque était la République démocratique du Vietnam. Tout accord signé par Nguyen Phuc Vinh Thuy sans l'autorisation de la République démocratique du Vietnam était nul et non avenu."
 EVT831949_OPTA:0 "Les Français sont indignés !"
 
 EVT7554_TITLE:0 "[GetNewspaperHeader]Victoire à la bataille de Dien Bien Phu"
 EVT7554_DESC:0 "Le 7 mai 1954, une explosion retentissante retentit à Dien Bien Phu, signalant l'effondrement de la forteresse française et ouvrant un nouveau et glorieux chapitre de l'histoire du Vietnam. La victoire de Dien Bien Phu, l'un des plus grands triomphes de l'histoire de l'humanité, a démontré l'immense pouvoir de détermination et de créativité d'une petite nation face à un puissant empire.\nSous le brillant commandement du général Vo Nguyen Giap et avec le courage inébranlable des principales unités de la force, nos troupes ont persévéré, lancé des attaques incessantes et finalement remporté une victoire éclatante. La campagne de Dien Bien Phu a montré une intégration harmonieuse de diverses branches militaires, combinant l'artillerie et l'infanterie et employant des tactiques d'encerclement et d'anéantissement. Nos forces ont utilisé efficacement le terrain, le climat et, surtout, leur esprit combatif indomptable pour vaincre l'ennemi.\nLa victoire de Dien Bien Phu n'était pas seulement un triomphe militaire mais aussi diplomatique. Elle a ébranlé les fondements du colonialisme et inspiré le mouvement de libération mondial. De nombreuses colonies africaines se sont inspirées de Dien Bien Phu pour se lever et lutter pour leur indépendance. La défaite de Dien Bien Phu marque l'effondrement de l'Empire français en Indochine et porte un coup dur au prestige des puissances occidentales."
 EVT7554_OPTA:0 "En route vers Hanoï !"
 
 EVT101954_TITLE:0 "[GetNewspaperHeader]Libération de Hanoï"
 EVT101954_DESC:0 "Le 10 octobre 1954, à 8 heures du matin, après la Conférence militaire de Trung Gia et la signature des Accords de Genève, le régiment Thu Do, qui fait partie de la 308e division, dirigé par le héros des Forces armées populaires Nguyen Quoc Tri, a défilé dans les rues de Hanoï, chaleureusement accueilli par la population après neuf ans de résistance contre le colonialisme français.\nL'ordre du Parti assurait une sécurité totale, protégeant les citoyens et leurs biens, prenant rapidement le contrôle des positions militaires cruciales à Hanoï et empêchant finalement tout conflit militaire entre la population et les soldats français.\nUn convoi de véhicules et d'artillerie, conduit par la jeep du président du Comité de direction militaire Vuong Thua Vu et du vice-président Tran Duy Hung, a commencé son voyage à 9h30. Lors de la cérémonie de lever du drapeau, le président Vuong Thua Vu a lu l'appel du président Hô Chi Minh aux citoyens de la capitale le jour de la libération : \n\"Depuis huit ans, le gouvernement a dû quitter la capitale pour résister et sauver le pays. Même si nous avons été séparés, le coeur du gouvernement est toujours resté proche du peuple. Aujourd'hui, grâce à l'unité et à la solidarité de nos citoyens et aux efforts héroïques de notre armée, la paix a triomphé. Le gouvernement est revenu dans la capitale et dans le peuple. Malgré les milliers de kilomètres qui nous séparent, notre joie est sans limites...\""
 EVT101954_OPTA:0 "En avant vers le Sud !"