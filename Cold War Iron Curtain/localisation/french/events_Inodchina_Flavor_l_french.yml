 Fulro_1_desc:0 "Une nouvelle organisation est née des jungles du Vietnam. Des affiches de propagande aux luttes armées, le Front uni pour la libération des races opprimées a pris les armes contre le Sud et le Nord-Vietnam - réclamant les droits et l'autonomie des Montagnards, ils ont été déterminés dans leurs combats. La plupart disent que le Cambodge et la Chine sont responsables du financement et du soutien de ce groupe. Reste à savoir s'il réussira dans ses luttes.\n En 1958, un groupe d'intellectuels français monta le prédécesseur du FULRO, dont l'objectif était de défendre les peuples Bahnar, Jarai, Rhade et K'Ho. Nommé BAJARAKA, il a vécu pendant une courte période avant de fusionner à la fois avec le Front de libération du Champa et le Front de libération du Kampuchea Krom, deux groupes originaires du Cambodge qui se sont battus pour leurs ethnies respectives. Les Montagnards, ethnie qui compose le plus le FULRO, sont composés de 2,25 millions de personnes, avec une douzaine de tribus et diverses langues parlées."
 North_Vietnam_1_desc:0 "Le coeur du fondateur de la République démocratique du Vietnam s'est arrêté. Ho Chi Minh repose tranquillement et paisiblement sur son lit de mort ; l'insuffisance cardiaque a éloigné le fondateur du socialisme vietnamien de la nation et l'a ainsi laissé momentanément sans chef. Né en mai 1890, l'insaisissable Ho Chi Minh était connu pour utiliser au moins cinquante pseudonymes, avec un lieu et une date de naissance inconnus ou pour le moins incertains, le dirigeant du Nord-Vietnam était aimé par beaucoup et détesté par beaucoup d'autres, en particulier au Sud-Vietnam ; écrivain, journaliste, poète et polyglotte, il était une figure inspirante qui a dirigé la République démocratique du Vietnam à travers des périodes de turbulences et était inébranlable dans sa foi que le Vietnam devait être uni sous une seule bannière."
 North_Vietnam_2_desc:0 "\nLe gouvernement de la République démocratique du Vietnam a annoncé qu'il entamerait une série de réformes agraires au profit de la paysannerie et des travailleurs ruraux ; tout en adoptant dans un premier temps une position modérée et en faisant des compromis avec les propriétaires fonciers sur les terres, avec une simple réduction du loyer foncier, le gouvernement nord-vietnamien a entamé une réforme plus dure et radicale, s'inspirant des Chinois. Considérer les propriétaires comme des éléments traîtres de la cause et former un tribunal populaire spécial ; dont la plupart sont composés de paysans ayant peu ou pas d'expertise en matière de droit et prononçant des peines arbitraires allant de la peine de mort à quelques années de travaux forcés. En outre, une série de décrets et de lois sur la réforme agraire ont été publiés, détaillant la dernière phase de la révolution agraire, la redistribution des terres agricoles."
 North_Vietnam_3_desc:0 "\nAprès la radicalisation de la réforme agraire par des éléments du Parti communiste vietnamien, les exécutions et l'isolement social des propriétaires fonciers n'ont pas tardé à commencer. Avec la publication d'un document du Politburo qui détaille qu'une personne sur mille sur la population totale doit être exécutée, au motif qu'elle est propriétaire ou qu'elle collabore d'une autre manière avec les propriétaires ; on estime que quinze mille réactionnaires et propriétaires fonciers sont morts. Le VWP a jusqu'à présent lancé une campagne visant à rectifier les erreurs commises après l'exécution de ces propriétaires, dont beaucoup ont été faussement ou à tort condamnés à mort. Au moyen d'une opération en trois phases, elle a reclassé les paysans et restitué les biens expropriés par erreur ou a apporté d'une autre manière une compensation appropriée pour ces erreurs ; en outre, il y a eu un examen, un inventaire et un réendoctrinement concentré du personnel local."

 Cambodia_Com_1_desc:0 "\nAprès la séparation du Parti communiste indochinois en homologues lao, vietnamien et cambodgien, la décision de former un parti communiste cambodgien a été prise. Son Ngoc Minh a été nommé président par intérim du parti, initialement nommé Parti révolutionnaire du peuple khmer. Selon certaines rumeurs, le Parti communiste chinois et le Viet Minh seraient liés et entretiendraient des relations très fortes ; et le KPRP soutient fortement le parti vietnamien dans cette phase initiale de son existence."
 Cambodia_Com_2_desc:0 "Une longue marche a été initiée ; l'échec du Viet Minh à négocier un rôle politique pour le KPRP à la Conférence de Genève a incité le président par intérim du KPRP, Son Ngoc Minh, à marcher vers le Nord-Vietnam avec un millier d'hommes. Les hommes restés au Cambodge ont formé un parti politique légal, le Krom Pracheachon. Lors de la formation de Pracheachon, deux nouveaux dirigeants qui dirigeront le parti sont apparus, Tou Samouth du Comité Urbain et Sieu Heng du Comité Rural ; le Comité urbain a des opinions chaleureuses sur Norodom Sihanouk et est soutenu par le Nord-Vietnam tandis que Sieu Heng était avec véhémence contre Norodom et prône une lutte pour renverser le Sihanouk « féodal »."
 
