 Bangkok_Plot_1_desc:0 "\nNorodom Sihanouk, King of Cambodia, was deposed by right-wing generals and politicians Son Ngoc Thanh, Sam Sary and regional Cambodian warlord and governor Dap Chhuon; Son Ngoc Thanh amassed anti-communist and anti-monarchist guerillas in the southern areas of Cambodia while Chhuon sparked an uprising in the north-east. While the King's troops were sent out to deal with the rebellion, the guerillas led by Thanh invaded Phnom Penh and seized the Palace; a declaration by Son Ngoc Thanh proclaimed the formation of the Khmer Republic, while the King is nowhere to be found, it is likely that he escaped with his family far away from Cambodia. Thailand, South Vietnam and the United States are all eager to initiate talks with the new government."
 Bangkok_Plot_2_desc:0 "\nSon Ngoc Thanh, a Cambodian right-wing general, along with Sam Sary and regional Cambodian warlord, and governor, Dap Chhuon, have attempted to remove the King of Cambodia, Norodom Sihanouk, from his place as the Head of State and King of the nation; while Thanh was massing anti-communist and anti-monarchist guerrillas in the south of the nation, most of them minorities from the Khmer Krom, Chhuon was to start an uprising in the north-east. The plan was foiled by the intelligence services of Norodom Sihanouk which attempted to arrest Chhuon, before he escaped and was later captured -  dying of injuries later after being interrogated. Both Sary and Thanh escaped the country while an US citizen and alleged radio operator Victor Matsui was arrested, which prompted Norodom to accuse the CIA of sparking a coup against him due to warm relations with the People's Republic of China. Pictures of Chhuon's corpse were taken and shown in Phnom Penh, a final mark of an attempted coup against Norodom; supporters of the regime have accused Thailand, South Vietnam and the United States of attempting to depose the Cambodian leader."
 Mon_Cambodia_1_desc:0 "An outspoken critic of Prince Norodom Sihanouk due to his détente with the People's Republic of China, a nationalist and right-wing general, Dap Chhuon was the Internal Security Minister and Governor of Siem Reap Province during the 1950s. After being dropped from the Cabinet, he increasingly broke his ties with the Norodom regime, culminating in the Bangkok Plot. He was arrested, interrogated and subsequently died of his injures; many claim that Lon Nol, a Cambodian general and politician, executed him due to fears of being implicated in the Bangkok Plot himself."
 Mon_Cambodia_2_desc:0 "Nop Bophann, a journalist, editor of the newspaper Pracheachon and one of the representatives of the left-wing United Issarak Front was shot and killed today. Being killed outside a military barrack in Phnom Penh, he was a dangerous element of the Norodom Sihanouk administration due to his support of a guerilla movement which once held half of the Cambodian territory; many claim that the Prince himself ordered his death while he, of course, denies these claims vehemently and claims that he was an admirer of Bophann's determination."
 Mon_Cambodia_3_desc:0 "The head of the Urban Committee of Pracheachon, Tou Samouth, has disappeared from the entire nation. Not a single trace of the leftist politician and mentor of prominent Communist leader, Saloth Sar, better known as Pol Pot, has been found. An intelligent man with a moderate temperament, he was notorious for calling for peaceful negotiations with the King, Norodom Sihanouk, and for recognizing him as a figure of stability and national unity. Many from Pol Pot's circle claims that Lon Nol, a Cambodian military general, arrested and executed him; while rumors, even inside the party, claim that Pol Pot was the one that arranged for the assassination of his former mentor and ally. Whatever the real reason for Tou Samouth's disappearance and subsequent death, it is now buried between stacks of documents in Cambodia."
 EVT181246_TITLE:0 "[GetNewspaperHeader]First Indochina War"
 EVT181246_DESC:0 "Compatriots throughout the country!\nOut of love for peace we have made concessions. But the more concessions we made, the further the French colonialists went because they are resolved to invade our country once again.\nNo!\nWe would rather sacrifice everything than lose our country, than return to slavery.\nCompatriots! Rise up!\nMen and women, old and young, regardless of creeds, political parties, or nationalities, all the Vietnamese must stand up to fight the French colonialists to save the Fatherland. Those who have rifles will use their rifles. Those who have swords will use their swords. Those who have no swords will use their spades, hoes, and sticks. Everyone must endeavor to oppose the colonialists and save his country.\nSoldiers, self-defense guards, militiamen!\nThe hour of national liberation has struck! We must sacrifice to our last drop of blood to save our country. Whatever hardships we must endure, we are ready to endure them. With the determination to sacrifice, victory will be ours!\nLong live an independent and unified Viet Nam!"
 EVT181246_OPTA:0 "Long live the victorious resistance!"
 EVT831949_TITLE:0 "[GetNewspaperHeader]Élysée Accords"
 EVT831949_DESC:0 "On March 8, 1949, French President Vincent Auriol and former Emperor Bao Dai signed the Élysée Accords, officially recognizing the puppet State of Vietnam as an independent associated state within the French Union, with Bao Dai as its head of state.\nHowever, the State of Vietnam was merely a puppet regime heavily reliant on French colonial power for its existence. Despite having its own government, administration, and military, it remained firmly under French control.\nA legal analysis based on historical evidence reveals that the Élysée Accords, orchestrated by the French colonialists, were illegitimate from the outset for several reasons. Firstly, after Emperor Bao Dai's declaration of independence in March 1945, which annulled previous treaties with France, the French no longer had any legal standing in Vietnam. Secondly, Bao Dai himself no longer held the authority to represent the nation, as he had abdicated on August 25, 1945, and was simply a Vietnam citizen named Nguyen Phuc Vinh Thuy. Lastly, the legitimate government of Vietnam at that time was the Democratic Republic of Vietnam. Any agreements signed by Nguyen Phuc Vinh Thuy without the authorization of the Democratic Republic of Vietnam were null and void."
 EVT831949_OPTA:0 "The French are outraged!"
 EVT7554_TITLE:0 "[GetNewspaperHeader]Victory at the Battle of Dien Bien Phu"
 EVT7554_DESC:0 "On May 7, 1954, a resounding explosion echoed through Dien Bien Phu, signaling the collapse of the French fortress and opening a new, glorious chapter in Vietnam's history. The victory at Dien Bien Phu, one of the greatest triumphs in human history, demonstrated the immense power of determination and creativity of a small nation in the face of a mighty empire.\nUnder the brilliant command of General Vo Nguyen Giap, and with the unwavering courage of the main force units, our troops persevered, launched relentless attacks, and ultimately achieved a resounding victory. The Dien Bien Phu campaign showcased a seamless integration of various military branches, combining artillery and infantry, and employing encirclement and annihilation tactics. Our forces effectively utilized the terrain, climate, and, most importantly, their indomitable fighting spirit to defeat the enemy.\nThe victory at Dien Bien Phu was not merely a military triumph but also a diplomatic one. It shook the foundations of colonialism and inspired the global liberation movement. Many African colonies drew inspiration from Dien Bien Phu to rise and fight for their independence. The defeat at Dien Bien Phu marked the collapse of the French Empire in Indochina and dealt a severe blow to the prestige of Western powers."
 EVT7554_OPTA:0 "Onward to Hanoi!"
 EVT101954_TITLE:0 "[GetNewspaperHeader]Liberation of Hanoi"
 EVT101954_DESC:0 "At 8:00 AM on October 10, 1954, following the Trung Gia Military Conference and the signing of the Geneva Accords, the Thu Do Regiment, part of the 308th Division, led by People's Armed Forces Hero Nguyen Quoc Tri, marched into the streets of Hanoi, warmly welcomed by the people after nine years of resistance against French colonialism.\nThe order from the Party ensured complete security, protecting the citizens and their property, swiftly taking control of crucial military positions in Hanoi, and ultimately preventing any military conflicts between the population and French soldiers.\nA convoy of vehicles and artillery, led by the jeep of Chairman of the Military Management Committee Vuong Thua Vu and Vice Chairman Tran Duy Hung, began its journey at 9:30 AM. During the flag-raising ceremony, Chairman Vuong Thua Vu read President Ho Chi Minh's appeal to the capital's citizens on the day of liberation: \n\"For the past eight years, the government has had to leave the capital to resist and save the country. Although we have been apart, the government's heart has always remained close to the people. Today, thanks to the unity and solidarity of our citizens and the heroic efforts of our army, peace has triumphed. The government has returned to the capital and the people. Despite the thousands of miles between us, our joy is boundless...\""
 EVT101954_OPTA:0 "Onward to the South!"