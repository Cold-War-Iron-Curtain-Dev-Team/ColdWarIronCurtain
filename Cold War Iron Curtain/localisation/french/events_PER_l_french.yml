l_french:

 iran_political.100.d:0 "Longtemps défenseur du régime islamique en Iran, Navvab Safavi a fondé Fada'iyan-e Islam pour promouvoir des réformes fondamentalistes accrues dans le pays. Le gouvernement en place en aurait finalement assez de ses pitreries après une tentative d'assassinat du Premier ministre, le général Fazlollah Zahedi. Safavi a été exécuté par les autorités de l'État avec trois autres alliés.\nCette exécution marque un jour sombre pour les fondamentalistes islamiques en Iran, car il devient clair que les politiques laïques doivent rester en Iran."
 iran_political.500.d:0 "Un tribunal militaire a condamné à mort l'ancien Premier ministre iranien Mohammad Mossadegh pour ses crimes de trahison contre le gouvernement et le peuple iraniens. Peu de temps après avoir été condamné, un peloton d'exécution a exécuté la sentence. Mossadegh aurait déclaré avant d'être exécuté que ses actes avaient été accomplis pour la liberté et l'honneur du peuple iranien. Les opposants au défunt Premier ministre se réjouiront sans doute de sa mort. Sa capacité à rallier le soutien populaire et l'influence politique faisait de lui une menace puissante pour ses adversaires. Pour ses partisans et alliés, son décès suscitera un grand désespoir. Cependant, des rumeurs parviennent déjà à Téhéran selon lesquelles son réseau d'alliés politiques tentera probablement de poursuivre ses efforts pour démocratiser l'Iran et restaurer son honneur national."
 iran_political.1301.d:0 "Suite à l'échec de l'opération Ajax, les tensions entre le régime de Mosaddegh et le Tudeh ont éclaté. La résistance féroce des Tudeh pendant l'Ajax a inspiré de nombreuses personnes à rejoindre le parti, gonflant leurs rangs jusqu'à devenir majoritaires dans le pays. Craignant un nouveau coup d'État, Mosaddegh tenterait de réprimer le parti. La police armée tenterait d'arrêter des forces importantes de haut rang au sein des Tudehs, y compris des membres des Cinquante-Trois. En ralliant le parti, Téhéran serait envahi par des civils armés et des forces paramilitaires. Dans les deux jours, Mosaddegh démissionnerait de son poste et fuirait en Turquie. Avec la disparition des anciens dirigeants et la prise de Téhéran, la République socialiste d'Iran a été déclarée. Sans opposition interne, cette décision a solidifié le pouvoir du parti Tudeh.\nLes Iraniens de tout le pays célèbrent la victoire, avec de vastes festivals organisés pour soutenir cette décision. Les fondamentalistes islamiques continuent de s'opposer au Tudeh, mais manquent de cohésion ou de soutien populaire pour véritablement défier le nouveau régime. Pour l'Occident, ce qui a commencé comme un plan visant à économiser les profits pétroliers a conduit à la place d'un Iran communiste."
 iran_political.1298.d:0 "L'ancien monarque emblématique d'Iran, qui était autrefois accueilli par des acclamations alors qu'il se déplaçait dans les rues de Téhéran, était maintenant nargué par la foule, des fruits pourris bombardant le convoi protégé dans lequel il se trouvait. Le convoi s'est rapidement déplacé, se dirigeant vers la Cour suprême de Téhéran. Aux côtés de Mohammad Reza Pahlavi se trouvent sa famille, Shaban Jafari, Fazlollah Zahedi et Nematollah Nassiri, tous jugés pour haute trahison. Devant la Haute Cour, des centaines de manifestants de Tudeh réclament la peine de mort pour toutes les personnes impliquées. Comment le tribunal décidera-t-il du sort des désormais traîtres ?"
 iran_political.1300.d:0 "L'audience tendue de la Cour suprême de Téhéran a finalement été tranchée. Les personnes impliquées dans le coup d'État ont été condamnées à mort. À l'extérieur du palais de justice, les partisans de Tudeh célèbrent l'annonce, la qualifiant de pas majeur vers la fin du régime bourgeois en Iran. Peu de temps après l'annonce, les conspirateurs ont été amenés à 25 kilomètres de Téhéran et exécutés par un peloton d'exécution. Plus de 280 conspirateurs ont été exécutés, dont l'ensemble de la dynastie Pahlavi.\nLa fin d'une époque frappe l'Iran, alors que des milliers d'années d'influence monarchiste touchent à leur fin. Cet événement enverra une onde de choc sur l'avenir de l'Iran pendant des générations."
 tudeh.1.d:0 "La Cour suprême de Téhéran trancherait. D'ici 48 heures, les Pahlavis et nombre de leurs complices seront exilés du pays pour ne plus jamais revenir. Alors que Mohammad Reza quittait la salle d'audience, des manifestants agressifs lui jetaient des pierres, ainsi qu'à sa famille. Ce serait son dernier souvenir d'Iran, car il fut rapidement révoqué de sa citoyenneté et expulsé vers l'Arabie saoudite, où il s'installera aux États-Unis. L'ancien monarque a nié toute interview avec les médias et a demandé que les gens respectent sa vie privée et celle de sa famille.\nLa fin d'une époque frappe l'Iran, alors que des milliers d'années d'influence monarchiste touchent à leur fin. Cet événement enverra une onde de choc sur l'avenir de l'Iran pendant des générations."
 iran_political.1100.d:0 "Après des mois de réflexion, Mohammad Reza Shah annoncerait son divorce avec la reine Soraya en raison de son infertilité et ne lui permettrait pas d'avoir un héritier. Son unique enfant épouserait Ardeshir Zahedi, un ennemi de la famille royale. Ce faisant, il a dénoncé sa femme et sa fille et s'est remarié avec Farah Pahlavi. Beaucoup ont considéré cette épreuve comme corrompue et moralement répréhensible, d'autres la considérant comme excusable en raison de la nécessité d'un héritier. Quoi qu'il en soit, le divorce royal a suscité de nouvelles controverses en Iran" 
 phi_events.1.d:0 "Une terrible nouvelle est tombée aujourd'hui à Manille, lorsque l'ancien sénateur philippin Benigno \"Ninoy\" Aquino Jr. A été assassiné sur le tarmac de l'aéroport international de Manille. Fervent critique du président Ferdinand Marcos, le sénateur Aquino est récemment arrivé à Manille après son exil volontaire des États-Unis, échappant aux périls et à ce qui serait une torture extrême et une mort potentielle. À son arrivée à Manille, les soldats du gouvernement l'attendaient et l'arrêtèrent au passage. Cependant, à la sortie de son avion, des coups de feu ont été signalés et Ninoy Aquino a été retrouvé mort, allongé sur le tarmac. L'enquête a conclu qu'un tueur à gages communiste nommé Rolando Galman avait assassiné Aquino, mais des rapports circulent selon lesquels Galman n'était qu'un bouc émissaire et que l'assassinat avait été ordonné par l'administration Marcos. Néanmoins, des milliers de Philippins pleuraient la mort de Ninoy Aquino, et les appels à la démission du régime de Marcos se font plus forts. Les observateurs soulignent que cet événement pourrait être un catalyseur de ce qui serait une révolution et un renversement du régime de Marcos, mais il est trop tôt pour spéculer."

 AJAX.101.d:0 "La nationalisation du pétrole iranien par le régime Mosaddegh a laissé le Royaume-Uni et les États-Unis amers. Déterminée à rétablir son influence sur l'Iran, la CIA a entamé des contacts avec le Shah, les chefs de gangs et de hauts responsables militaires pour orchestrer un coup d'État. Le plan allait se développer à mesure que Mosaddegh entendait parler du coup d'État en cours, arrêtant le chef Shaban Jafari avant que le plan puisse être lancé. Grâce aux informations divulguées par les Tudeh et Jafari, la police iranienne arrêterait la famille royale Pahlavi juste avant leur départ pour leurs « vacances » dans les montagnes du nord de l'Iran. Sans un leadership fort de la part de Pahlavi et de Jafari, Tudeh et les forces gouvernementales mettraient facilement fin à toute tentative de coup d'État. Des centaines d'orchestrateurs et d'agents étrangers présumés ont été arrêtés.\nCe qui va maintenant arriver à l'Iran reste un mystère. L'influence monarchiste et occidentale a été éliminée, mais la question de savoir comment le régime Mosaddegh et le parti Tudeh réagiront au coup d'État pourrait déterminer le sort de la nation. Une nouvelle lutte pour le pouvoir se prépare-t-elle déjà ?"
 AJAX.105.d:0 "Peu de temps après l'échec de l'opération Ajax, le désordre restant allait être résolu. Les Tudehs gagneraient en force grâce à leurs efforts impressionnants pour réprimer le coup d'État, ce qui créerait des frictions entre le régime de Mosaddegh et les communistes presque immédiatement après l'épreuve. Au lieu de gérer la situation avec davantage de conflits, les deux parties comprendraient rapidement l'importance de la discussion et une réunion officielle entre les dirigeants des deux factions émergerait rapidement. Bien qu'ayant des opinions divergentes sur de nombreux sujets, tous deux ont montré le pouvoir qu'ils avaient en travaillant ensemble. Grâce à cela, des règlements ont été conclus pour maintenir la paix.\nLa République d'Iran dirigée par Mosaddegh reste au pouvoir, même avec la force des forces internes qui l'entourent. La jeune démocratie a fait face à sa plus grande menace à ce jour, en résistant à l'Occident et en gagnant."