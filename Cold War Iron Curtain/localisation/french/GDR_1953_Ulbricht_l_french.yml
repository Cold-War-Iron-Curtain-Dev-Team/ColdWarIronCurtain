l_french: 

 GDR_Political_Support_from_Moscow: "Soutien de Moscou"
 GDR_Political_Support_from_Moscow_desc: "La survie et la légitimité de la République dépendent du soutien continu de l'Union soviétique."
 GDR_Secure_the_Politurbo: "Sécurisez le Politurbo"
 GDR_Secure_the_Politurbo_desc: "Garantir la loyauté du Politburo est essentiel au maintien de la stabilité au sein du Parti socialiste unifié. Nous prendrons les mesures nécessaires pour éliminer la dissidence et consolider le pouvoir au sein des dirigeants."
 GDR_Fears_of_a_German_Gomulka: "Craintes d'une Gomulka allemande"
 GDR_Fears_of_a_German_Gomulka_desc: "Le spectre du révisionnisme hante le Parti. Si nous ne voulons pas suivre les traces de Wladyslaw Gomulka, nous devons agir de manière décisive."
 GDR_Deepen_Ties_with_Moscow: "Approfondir les liens avec Moscou"
 GDR_Deepen_Ties_with_Moscow_desc: "Des liens plus étroits avec l'Union soviétique renforceront notre économie, renforceront notre sécurité et feront progresser la cause socialiste. Qu'ils ne doutent pas de notre solidarité."
 GDR_Purge_Schirdewan: "Purger Schirdewan"
 GDR_Purge_Schirdewan_desc: "Les récentes déclarations de Karl Schirdewan font peser un risque sur l'unité du Parti. Son retrait est nécessaire pour empêcher la propagation de sentiments révisionnistes au sein de nos dirigeants"
 GDR_Review_Prior_Political_Purges_Within_the_SED: "Examiner les purges antérieures"
 GDR_Review_Prior_Political_Purges_Within_the_SED_desc: "Les erreurs du passé doivent être reconnues sans porter atteinte à l'autorité du Parti. Un examen attentif des purges précédentes nous permettra de restaurer la confiance là où cela est nécessaire et de réaffirmer la discipline là où cela est nécessaire."
 GDR_Purge_the_Harich_Group: "Purger le groupe Harich"
 GDR_Purge_the_Harich_Group_desc: "La subversion intellectuelle menée par Wolfgang Harich menace les fondements idéologiques de la République. Nous démantelerons son réseau et réaffirmerons l'autorité de l'orthodoxie marxiste."
 GDR_Expand_Combat_Groups_of_the_Working_Class: "Élargir les groupes de combat de la classe ouvrière"
 GDR_Expand_Combat_Groups_of_the_Working_Class_desc: "Le prolétariat doit être armé non seulement d'idéologie mais aussi de force. Nous élargirons les groupes de combat pour aider à maintenir l'ordre et à nous défendre contre les agressions extérieures."
 GDR_Continue_Repression_and_Observation_of_Noted_Intelligenistia: "Continuer l'observation d'Intelligenistia noté"
 GDR_Continue_Repression_and_Observation_of_Noted_Intelligenistia_desc: "Nous disposons d'une liste de noms d'intelligentsia notables qui sont dangereusement proches de commettre des actes subversifs contre la République. Nous les surveillerons de près."
 GDR_Allow_Greater_Freedoms_for_the_Intelligenistia: "De plus grandes libertés pour l'Intelligenistia"
 GDR_Allow_Greater_Freedoms_for_the_Intelligenistia_desc: "Une libéralisation contrôlée peut servir à apaiser l'intelligentsia sans sacrifier le contrôle du Parti. Certaines libertés seront accordées pour favoriser la loyauté et l'innovation dans les limites idéologiques."
 GDR_Appoint_Hilde_Benjamin_Minister_of_Justice: "Nommer Hilde Benjamin"
 GDR_Appoint_Hilde_Benjamin_Minister_of_Justice_desc: "L'engagement inébranlable d'Hilde Benjamin en faveur du socialisme et son expertise juridique font d'elle la candidate idéale pour faire respecter la loi et réprimer les éléments réactionnaires."
 GDR_Expand_the_Stasi: "Développez la Stasi"
 GDR_Expand_the_Stasi_desc: "Nos ennemis se multiplient dans l'ombre. Le ministère de la Sécurité de l'État doit être renforcé pour éliminer la dissidence, prévenir le sabotage et garantir la loyauté dans toute la République."
 GDR_Increase_Pensions_and_Reform_Working_Hours: "Augmenter les heures de travail dans le cadre des retraites et de la réforme"
 GDR_Increase_Pensions_and_Reform_Working_Hours_desc: "Pour faire avancer la cause socialiste et garantir la loyauté de la classe ouvrière, nous devons offrir des avantages tangibles. Augmenter les retraites et réformer les horaires de travail remonterait le moral et démontrerait la supériorité du système socialiste."
 GDR_Emphasize_Military_Funding: "Mettre l'accent sur le financement militaire"
 GDR_Emphasize_Military_Funding_desc: "En ces temps incertains, nous devons donner la priorité à la défense. L'attribution de ressources supplémentaires à nos forces armées garantira leur préparation contre les soulèvements internes et les agressions extérieures."
 GDR_The_Partys_Policy_on_Church_Questions: "La politique du Parti sur les questions ecclésiales"
 GDR_The_Partys_Policy_on_Church_Questions_desc: "La religion doit être réconciliée avec le socialisme. Nous devons adopter des politiques qui transforment la foi en un outil d'harmonie sociale, et non en résistance contre l'État."
 GDR_Introduce_Socialist_Marriage_Rites: "Introduire les rites de mariage socialistes"
 GDR_Introduce_Socialist_Marriage_Rites_desc: "Le mariage doit servir les objectifs de la construction socialiste. Nous réformerons les politiques matrimoniales pour promouvoir l'égalité des sexes, la productivité économique et le respect des valeurs du Parti."
 GDR_The_Military_Church: "L'Église militaire"
 GDR_The_Military_Church_desc: "Depuis la fondation de la RDA, il n'existe pas encore d'aumônerie au sein de l'armée. Compte tenu de nos tentatives visant à introduire la religion dans le giron socialiste, il est peut-être temps de permettre à l'armée de rechercher une direction spirituelle."
 GDR_Relax_Persecution_of_Junge_Gemeinde: "Détendez-vous dans la persécution de Junge Gemeinde"
 GDR_Relax_Persecution_of_Junge_Gemeinde_desc: "La tolérance stratégique de la Junge Gemeinde réduira les critiques internationales et les troubles intérieurs, tout en nous permettant de surveiller et d'orienter subtilement sa direction."
 GDR_Continue_the_New_Course: "Continuer le nouveau cours"
 GDR_Continue_the_New_Course_desc: "Le Nouveau Cours promet une réforme économique et une amélioration du niveau de vie. Continuer dans cette voie est la meilleure façon d'assurer l'avenir de la RDA."
 GDR_Crackdown_on_the_Junge_Gemeinde: "Répression contre la Junge Gemeinde"
 GDR_Crackdown_on_the_Junge_Gemeinde_desc: "La Junge Gemeinde sème la désobéissance parmi les jeunes. Une répression décisive réaffirmera l'autorité du Parti et éliminera cette source de subversion religieuse."
 GDR_End_the_New_Course: "Terminer le nouveau cours"
 GDR_End_the_New_Course_desc: "La réforme est allée trop loin. Le Nouveau Cours a encouragé le révisionnisme et enhardi nos ennemis. Il est temps de réaffirmer un contrôle idéologique strict et de mettre fin à cette déviation."
 GDR_Ten_Commandments_of_Socialist_Morals_and_Ethics: "Dix commandements de la morale et de l'éthique socialistes"
 GDR_Ten_Commandments_of_Socialist_Morals_and_Ethics_desc: "Grâce aux dix commandements du nouvel homme socialiste, nous inculquerons les vertus socialistes à chaque citoyen, en redéfinissant la moralité par la loyauté envers l'État, la solidarité et la discipline du travail."
 GDR_Unification_from_Above_Unification_from_Below: "Unification par le haut, Unification par le bas"
 GDR_Unification_from_Above_Unification_from_Below_desc: "La véritable unité allemande ne peut être réalisée que par un double processus : des négociations menées par l'État et une solidarité socialiste populaire des deux côtés. Les deux approches seront poursuivies pour faire avancer notre cause."
 GDR_Come_to_Terms_with_Reality: "Accepter la réalité"
 GDR_Come_to_Terms_with_Reality_desc: "Le modèle occidental a pris racine en RFA. Plutôt que de poursuivre nos rêves de réunification, nous devons nous concentrer sur la consolidation, la survie et l'influence par le biais de la compétition idéologique et économique."
 GDR_Double_Down_on_the_Magnet_Theory: "Doublez la mise sur la théorie de l'aimant"
 GDR_Double_Down_on_the_Magnet_Theory_desc: "En construisant une société socialiste supérieure, nous pouvons « magnétiser » la population ouest-allemande vers l'unification sous notre système. Le réengagement envers cette théorie façonnera nos politiques à l'avenir."
 GDR_Responding_to_the_Godesberg_Program: "Répondre au programme Godesberg"
 GDR_Responding_to_the_Godesberg_Program_desc: "L'abandon du marxisme par le SPD marque une trahison de la classe ouvrière. Nous devons tirer le meilleur parti de cette situation."
 GDR_Arrest_Otto_Dibelius: "Arrêter Otto Dibelius"
 GDR_Arrest_Otto_Dibelius_desc: "L'évêque Dibelius a constamment sapé l'ordre socialiste. Son arrestation neutralisera un agitateur religieux majeur et démontrera notre intolérance à l'égard de l'ingérence religieuse."
 GDR_Tensions_Within_the_Western_SPD: "Tensions au sein du SPD occidental"
 GDR_Tensions_Within_the_Western_SPD_desc: "Le SPD ouest-allemand est en train de se fracturer. L'échec du programme Godesberg menace de déchirer le parti en deux. Cette opportunité est trop précieuse pour la laisser passer."
 GDR_Covertly_Back_the_Left_SPD_Faction: "Soutenir secrètement la faction de gauche du SPD"
 GDR_Covertly_Back_the_Left_SPD_Faction_desc: "En soutenant discrètement les marxistes loyalistes du SPD, nous pouvons raviver l'opposition consciente de classe au sein de l'Allemagne et accroître la popularité du socialisme parmi le peuple"
 GDR_Continue_Funding_the_Alliance_of_Germans_Party_for_Unity_Peace_and_Freedom: "Continuer à financer le Bund der Deutschen"
 GDR_Continue_Funding_the_Alliance_of_Germans_Party_for_Unity_Peace_and_Freedom_desc: "Le SPD n'est plus utile. Au lieu de cela, nous concentrerons tous nos efforts sur le Bund der Deutschen et lui allouerons davantage de ressources."
