 lover_of_the_libyan_people:0 "Compassion pour le peuple libyen"
 LBA_DECADE_CRISIS_DESC:0 " La Libye, à l'aube des années 1960, est essentiellement un désert vide et dépeuplé, mais les nouveaux capitaux d'État issus de l'extraction pétrolière étrangère dans le pays ont rendu les élites politiques et l'aristocratie Senussi très riches, tandis que le Libyen moyen vit toujours dans des logements arriérés. Le monde arabe n'a plus jamais été le même depuis la Seconde Guerre mondiale, mais dans des villes comme Tripoli, Cirté et Bayda, le panarabisme et les opinions politiques nasséristes se retrouvent parmi tous les groupes démographiques de la jeunesse. Quoi qu'Idris estime qu'il faudrait faire au Royaume, la profonde influence que l'Égypte nassérienne voisine a exercée sur la Libye au cours des dernières années est inéluctable."
