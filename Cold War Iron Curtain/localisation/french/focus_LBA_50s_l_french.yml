 LBA.5.d:0 "    Sa Majesté le Roi Idris a appelé Mohieddin Fikini à former un nouveau cabinet pour répondre aux objectifs actuels de l'État. Les nouvelles voies de changement adoptées par Fikini seront la tentative d'abolir le système fédéral et de former un gouvernement unitaire, de lancer notre premier plan quinquennal de développement et de modifier la constitution de 1951. Nous ne pouvons qu'espérer que cela conduira à une Libye plus unie et plus sûre, compte tenu des flammes de la révolution au Caire et à Bagdad."
 LBA.9.d:0 "    La Constitution libyenne de 1951 a été créée à l'origine lors de l'intégration du Fezzan et de la Tripolitaine par l'Émirat cyrénaïque sous l'émir Idris Ier, et est depuis devenue obsolète par rapport aux souhaits actuels de notre établissement. Les changements apportés à la nouvelle constitution rédigée par Mohieddin Fikini incluent l'adoption d'un État unitaire et le droit de vote pour les femmes."
 LBA_nationalist_party:0 "Officiers libres"
 LBA_nationalist_party_desc:0 "les officiers libres"
 LBA_60s_Abolish_the_federal_system:0 "Abolir le système fédéral"
 LBA_60s_Abolish_the_federal_system_desc:0 "Le système fédéral consistant à diviser la Libye en trois districts est trop décentralisé dans l'esprit du cabinet d'Idris. Il est temps d'adopter un système de gouvernement unitaire pour la Libye."
 LBA_60s_Centralize_the_state:0 "Centraliser l'État"
 LBA_60s_Centralize_the_state_desc:0 "Nous centraliserons les institutions de notre pays"
 LBA_60s_prime_minister_mohieddin_fekini:0 "Premier ministre Mohieddine Fekini"
 LBA_60s_prime_minister_mohieddin_fekini_desc:0 "Le nouveau Premier ministre aidera le gouvernement d'Idris à se conformer aux nouvelles normes d'un État centralisé et unitaire."
 LBA_60s_Reorganize_Subdivisions:0 "Réorganiser les subdivisions"
 LBA_60s_Reorganize_Subdivisions_desc:0 "Il est temps de réorganiser nos subdivisions"
 LBA_60s_Invest_Bayda:0 "Investir à Bayda"
 LBA_60s_Invest_Bayda_desc:0 "Nous concentrerons nos investissements sur la ville royale de Bayda"
 LBA_60s_appoint_provisional_govenors:0 "Nommer des gouverneurs provisoires"
 LBA_60s_appoint_provisional_govenors_desc:0 "Le gouvernement nommera de nouveaux gouverneurs provisoires."
 LBA_60s_revise_the_constitution:0 "Réviser la Constitution"
 LBA_60s_revise_the_constitution_desc:0 "Le nouveau Premier ministre va réviser notre constitution écrite après notre indépendance en 1952"
 LBA_60s_expel_american_military:0 "Expulser les bases militaires américaines"
 LBA_60s_expel_american_military_desc:0 "Divers traités et accords conclus par notre gouvernement dans les années 50 ont permis à l'Amérique d'établir des bases dans notre pays. Nous ne placerons plus l'Occident ici, mais il est temps d'adopter une approche plus isolationniste"
 LBA_60s_expel_british_military:0 "Expulser les bases militaires britanniques"
 LBA_60s_expel_british_military_desc:0 "Divers traités et accords conclus par notre gouvernement dans les années 50 ont permis à la Grande-Bretagne d'établir des bases dans notre pays. Nous ne placerons plus l'Occident ici, mais il est temps d'adopter une approche plus isolationniste"
 LBA_60s_continue_influx_of_egyptian_teachers:0 "Poursuite de l'afflux d'enseignants égyptiens"
 LBA_60s_continue_influx_of_egyptian_teachers_desc:0 "Personne ne fera obstacle à l'afflux continu d'enseignants bénévoles en provenance d'Égypte, même si les conséquences des opinions nasséristes défendues par de nombreux Égyptiens sont d'une importance inconnue."
 LBA_60s_rampant_nasserism:0 "Un nassérisme rampant"
 LBA_60s_rampant_nasserism_desc:0 "De plus en plus, le nassérisme est visible parmi tous les groupes démographiques de la jeunesse."
 LBA_60s_Mandatory_Egyptian_History:0 "Histoire égyptienne obligatoire"
 LBA_60s_Mandatory_Egyptian_History_desc:0 "Les nombreux enseignants égyptiens bénévoles dans notre pays se concentrent principalement sur l'enseignement de l'histoire et de la culture égyptiennes, rendant ainsi la jeunesse libyenne de plus en plus égyptophile."
 LBA_60s_radicalization_of_the_youth:0 "Radicalisation de la jeunesse"
 LBA_60s_radicalization_of_the_youth_desc:0 "Inévitablement, la jeunesse se radicalise de plus en plus."
 LBA_60s_spread_of_pan_arabism:0 "Propagation du panarabisme"
 LBA_60s_spread_of_pan_arabism_desc:0 "Le panarabisme devient de plus en plus populaire dans notre pays"
 LBA_60s_rise_of_the_free_officers:0 "L'essor des officiers libres"
 LBA_60s_rise_of_the_free_officers_desc:0 "Un petit groupe de jeunes officiers affectés aux compagnies de transmissions devient de plus en plus insouciant, ce que cela dit de notre structure militaire reste à décider."
 LBA_60s_Idris_withdrawals_from_politics:0 "Idris se retire de la politique"
 LBA_60s_Idris_withdrawals_from_politics_desc:0 "Idris s'est désintéressé des affaires quotidiennes de gouvernance et s'est complètement retiré de la vie publique."
 LBA_60s_Hasan_as_Senussi_regency:0 "Régence Hasan as-Senussi"
 LBA_60s_Hasan_as_Senussi_regency_desc:0 "L'aristocratie des Senussi a décidé de qualifier le prince Hasan de nouvel héritier et chef du royaume, sa régence commencera ainsi jusqu'à ce qu'il ait pris les mesures nécessaires pour devenir roi."
 LBA_60s_the_libyan_revolution:0 "La révolution libyenne"
 LBA_60s_the_libyan_revolution_desc:0 "La Libye s'est lancée dans un coup d'État mené par les officiers libres !"
 LBA_60s_The_Idris_Years:0 "Les années Idris"
 LBA_60s_The_Idris_Years_desc:0 "Ces temps où nous vivons sous Idris et le cabinet"
 LBA_60s_join_OPEC:0 "Rejoignez l'OPEP"
 LBA_60s_join_OPEC_desc:0 "C'est seulement dans notre intérêt de rejoindre l'OPEP"
 LBA_60s_join_OAU:0 "Rejoignez l'OUA"
 LBA_60s_join_OAU_desc:0 "Idris considère que c'est un choix judicieux de rejoindre l'Organisation de l'unité africaine"
 LBA_60s_support_maghrebi_arabs:0 "Soutenez les Arabes maghrébins"
 LBA_60s_support_maghrebi_arabs_desc:0 "Nous devons soutenir les Arabes maghrébins"
 LBA_60s_expand_private_education:0 "Développer l'enseignement privé"
 LBA_60s_expand_private_education_desc:0 "nous souhaitons développer l'enseignement privé"
 LBA_60s_expand_foreign_relations:0 "Développer les relations extérieures"
 LBA_60s_expand_foreign_relations_desc:0 "Nous devrions développer nos relations extérieures"
 LBA_60s_strengthen_western_ties:0 "Renforcer les liens avec l'Occident"
 LBA_60s_strengthen_western_ties_desc:0 "nous devons nous ouvrir à l'ouest et voir ce qu'ils ont à offrir"
 LBA_60s_open_relations_with_ussr:0 "Relations ouvertes avec l'URSS"
 LBA_60s_open_relations_with_ussr_desc:0 "Il est temps d'arrêter d'agir dans la peur, il y a de bonnes choses que les Soviétiques peuvent nous offrir malgré notre méfiance à l'égard du marxisme."
 LBA_60s_accept_economic_aid:0 "Accepter l'aide économique"
 LBA_60s_accept_economic_aid_desc:0 "Mettons notre fierté de côté et acceptons l'aide économique"
 LBA_60s_decline_economic_aid:0 "Refuser l'aide économique"
 LBA_60s_decline_economic_aid_desc:0 "Nous ferions mieux de ne pas accepter l'aide économique de ces communistes"
 LBA_60s_decrease_dependency_on_the_west:0 "Diminuer la dépendance à l'égard de l'Occident"
