 LBA_60s_increase_dependency_on_the_west:0 "Accroître la dépendance à l'égard de l'Occident"
 LBA_60s_increase_dependency_on_the_west_desc:0 "Au-delà de l'orgueil inutile, l'Occident nous offre ce dont nous avons besoin."
 LBA_60s_first_five_year_plan:0 "Premier plan quinquennal"
 LBA_60s_first_five_year_plan_desc:0 "Notre nouveau Premier ministre a proposé un nouveau plan de développement quinquennal."
 LBA_60s_rifining_industrial_zones:0 "Zones industrielles de raffinage"
 LBA_60s_rifining_industrial_zones_desc:0 "La création de zones industrielles sélectionnées pour raffiner le pétrole est une étape importante dans notre progrès."
 LBA_60s_end_the_petroleum_law_of_1955:0 "Mettre fin à la loi pétrolière de 1955"
