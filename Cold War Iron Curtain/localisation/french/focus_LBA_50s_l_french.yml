 LBA_60s_socialized_healthcare:0 "Soins de santé socialisés"
 LBA_60s_socialized_healthcare_desc:0 "Kadhafi va mettre en oeuvre des soins de santé socialisés pour notre nation"
 LBA_60s_grants_for_married_couples:0 "Subventions pour les couples mariés"
