 LBA_analyze_infantry_weapons:0 "Analyser les armes d'infanterie"
 LBA_analyze_infantry_weapons_desc:0 "Nous pouvons en apprendre davantage sur la fabrication des récepteurs et l'usinage de base en analysant les conceptions étrangères"
 LBA_analyze_artillery_equipment:0 "Analyser l'équipement d'artillerie"
 LBA_analyze_artillery_equipment_desc:0 "Nous pouvons apprendre à produire du matériel d'artillerie en analysant du matériel étranger"
 LBA_American_Advisors:0 "Conseillers américains"
 LBA_American_Advisors_desc:0 "Nous inviterons des conseillers américains"
 LBA_further_leadership_reforms:0 "Poursuite des réformes du leadership"
 LBA_further_leadership_reforms_desc:0 "Nous allons poursuivre la réforme de notre leadership militaire"
 LBA_modern_transmission_blueprints:0 "Plans de transmission modernes"
