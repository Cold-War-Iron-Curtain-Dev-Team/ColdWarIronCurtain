 LBA_60s_institute_secular_reforms:0 "Instituer des réformes laïques"
 LBA_60s_institute_secular_reforms_desc:0 "Kadhafi souhaite contourner la politique du RCC par des réformes laïques."
 LBA_60s_build_bayda_university:0 "Construire l'Université Bayda"
 LBA_60s_build_bayda_university_desc:0 "Nous devons construire l'Université de Bayda pour le bien de notre jeunesse étudiante."
 LBA_60s_relations_with_nasser:0 "Relations avec Nasser"
