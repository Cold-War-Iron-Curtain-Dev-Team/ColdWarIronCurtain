 LBA_60s_aquire_P-51s:0 "Acquérir des Grumman F6F"
 LBA_60s_aquire_P-51s_desc:0 "Les relations avec l'Amérique nous ont permis d'acquérir des P-51 Mustang"
 LBA_60s_form_the_libyan_navy:0 "Former la marine libyenne"
 LBA_60s_form_the_libyan_navy_desc:0 "Nous formerons la marine libyenne"
 LBA_60s_Naval_invasion_force:0 "Force d'invasion navale"
