 LBA_60s_research_tanks:0 "Réservoirs de recherche"
 LBA_60s_research_tanks_desc:0 "En étudiant des conceptions étrangères, nous pouvons développer nos propres installations de fabrication de chars"
 LBA_60s_mechanized_research:0 "Recherche mécanisée"
 LBA_60s_mechanized_research_desc:0 "Nous devons rechercher la technologie mécanisée"
 LBA_60s_soviet_advisors:0 "Conseillers soviétiques"
 LBA_60s_soviet_advisors_desc:0 "Nous inviterons des conseillers de l'Union soviétique"
