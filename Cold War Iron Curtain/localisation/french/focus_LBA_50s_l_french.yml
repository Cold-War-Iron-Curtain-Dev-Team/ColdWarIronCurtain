 1_libya_tt:0 "Avec la publication du Plan Bevin-Sforza, les protestations vont s'étendre partout, du Caire à Détroit"
 2_libya_tt:0 "§YCe focus sera complété automatiquement par un événement"
 libya_news.1.d:0 "\nRécemment, en mai, le projet européen de plan Bevin-Sforza a été rendu public. Le plan prévoit une tutelle de quinze ans sur la Libye. Les Italiens, les précédents colonisateurs, conserveront le contrôle de la principale agglomération de la Tripolitaine, tandis que le Royaume-Uni et la France posséderont respectivement la Cyrénaïque et le Fezzan. Cela a créé des bouleversements massifs dans le monde entier, en particulier dans le monde arabe, aux États-Unis et en Union soviétique"
 LBA_GATHERING_STORM_DESC:0 "   L'existence même de l'Émirat de Cyrénaïque d'Idris est menacée par le colonialisme. Depuis que les diplomates britanniques et italiens Ernest Bevin et Carlo Sforza ont composé le Bevin-Sforza, la Libye est au centre d'une controverse internationale. Ce projet de partition de la Libye italienne, largement condamné, la divisera entre la France dans le Fezzan-Garamtes, le Royaume-Uni dans la Cyrénaïque et l'Italie dans le centre de population de la Tripolitaine. Souverain de facto de l'Émirat cyrénaïen, Idris Ier se trouve dans une situation complexe et difficile. Il devra faire confiance aux Nations Unies et au soutien international du monde arabe nouvellement décolonisé et des grandes puissances de l'époque."
