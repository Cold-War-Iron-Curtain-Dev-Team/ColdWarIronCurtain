 LBA_60s_fight_resistance:0 "Combattre la résistance"
 LBA_60s_fight_resistance_desc:0 "Nous exerçons suffisamment de pouvoir pour combattre toute résistance importante à notre pouvoir"
 LBA_60s_expand_the_senussi_order:0 "Élargir l'Ordre Senussi"
