#1949
 LBA_emirship_of_idris:0 "L'émirat d'Idris"
 LBA_emirship_of_idris_desc:0 "Cette époque marque l'émirat d'Idris sur l'émirat cyrénaïque"
 LBA_glorify_omar_mukhar:0 "Glorifier Omar Muktar"
 LBA_glorify_omar_mukhar_desc:0 "Omar Muktar, le héros du peuple libyen, a combattu courageusement contre l'invasion italienne. Nous devons être fiers de lui et étudier ses tactiques"
 LBA_manage_the_sharifs:0 "Gérer les chérifs"
 LBA_manage_the_sharifs_desc:0 "Nous gérerons les Sharifs"
 LBA_manage_dynastic_claims:0 "Gérer les réclamations dynastiques"
 LBA_manage_dynastic_claims_desc:0 "Nous gérerons les réclamations dynastiques"
 LBA_strengthen_noble_privlidges:0 "Renforcer les privilèges nobles"
 LBA_strengthen_noble_privlidges_desc:0 "Nous renforcerons les nobles privilèges"
 LBA_lesson_noble_priviledges:0 "Leçon sur les privilèges nobles"
 LBA_lesson_noble_priviledges_desc:0 "Nous enseignerons les nobles privilèges"
 LBA_plan_of_succession:0 "Plan de succession"
 LBA_plan_of_succession_desc:0 "Nous créerons un plan de succession"
 LBA_ignore_the_succession:0 "Ignorer la succession"
 LBA_ignore_the_succession_desc:0 "Nous ignorerons tout plan de succession"
 LBA_demonstrate_against_the_bevin_sforza_plan:0 "Manifester contre le plan Bevin-Sforza"
 LBA_demonstrate_against_the_bevin_sforza_plan_desc:0 "Comment le peuple peut-il soutenir le plan néocolonial Bevin-Sforza visant à diviser la Libye entre la Grande-Bretagne et la France ? Ils sont indignés et dans les rues de Bayda à Tripoli"
 LBA_petition_united_nations:0 "Pétition aux Nations Unies"
 LBA_petition_united_nations_desc:0 "Nous devons adresser une pétition aux Nations Unies contre le plan Bevin-Sforza, il est dans leur intérêt de vaincre le colonialisme"
 LBA_spread_demonstrations_worldwide:0 "Diffusez des démonstrations dans le monde entier"
 LBA_spread_demonstrations_worldwide_desc:0 "Les manifestations contre le plan Bevin-Sforza se propagent dans le monde entier alors que de plus en plus de gens voient le plan de la Grande-Bretagne et de la France visant à consolider leur empire. "
 LBA_suggest_resolution_to_un:0 "Proposer une résolution à l'ONU."
 LBA_suggest_resolution_to_un_desc:0 "Nous proposerons une résolution à l'ONU."
 LBA_declare_united_kingdom_of_libya:0 "Déclarer le Royaume-Uni de Libye"
 LBA_declare_united_kingdom_of_libya_desc:0 "Maintenant que nous avons surmonté le plan Bevin-Sforza, nous pouvons désormais unir la Tripolitaine, le Fezzan et la Cyrénaïque sous Idris en un seul royaume."
 LBA_determine_the_future_administration:0 "Déterminer la future administration"
 LBA_determine_the_future_administration_desc:0 "Après la formation de la Libye, la question la plus importante est : Devons-nous être une administration unitaire et indivisible ? Ou bien les régions distinctes de la Tripolitaine, du Fezzan et de la Cyrénaïque seront-elles gouvernées comme des entités distinctes dans un système fédéral."
 LBA_adopt_unitary_administration:0 "Adopter une administration unitaire"
 LBA_adopt_unitary_administration_desc:0 "Nous adopterons l'Administration Unitaire, où les régions de notre pays seront un groupe indivisible"
 LBA_adopt_federal_administration:0 "Adopter une administration fédérale"
 LBA_adopt_federal_administration_desc:0 "Nous adopterons une administration fédérale dans laquelle la Tripolitaine, la Cyrénaïque et le Fezzan seront des États distincts"
 LBA_tripolitian_and_fezzan_discontent:0 "Mécontentement tripolitain et fezzanien"
 LBA_tripolitian_and_fezzan_discontent_desc:0 "Il y a du mécontentement en Tripolitaine et au Fezzan"
 LBA_efficent_resource_management:0 "Gestion efficace des ressources"
 LBA_efficent_resource_management_desc:0 "Nous gérons désormais plus efficacement nos ressources"
 LBA_tripolitan_and_fezzan_autonomy:0 "Autonomie tripolitaine et fezzanienne"
 LBA_tripolitan_and_fezzan_autonomy_desc:0 "Nous accorderons plus d'autonomie à la Tripolitaine et au Fezzan"
 LBA_Bureacratic_Reform:0 "Réforme bureaucratique"
 LBA_Bureacratic_Reform_desc:0 "Nous faisons des réformes bureaucratiques"
 LBA_adopt_the_1952_constitution:0 "Adopter la Constitution de 1952"
 LBA_adopt_the_1952_constitution_desc:0 "À mesure que notre pays évolue, nos temps modernes justifient certaines questions concernant la fonction exécutive. Idris doit-il gouverner par décret comme c'est le statu quo, ou devons-nous adopter un système monarchique parlementaire."
 LBA_monarchial_status_quo:0 "Statu quo monarchique"
 LBA_monarchial_status_quo_desc:0 "Nous maintiendrons le statu quo monarchique"
 LBA_form_parlimentary_monarchy:0 "Former une monarchie parlementaire"
 LBA_form_parlimentary_monarchy_desc:0 "Nous formerons une monarchie parlementaire"
 LBA_allow_political_parties:0 "Autoriser les partis politiques"
 LBA_allow_political_parties_desc:0 "Nous autoriserons les partis politiques"
 LBA_revise_provisional_administration:0 "Réviser l'administration provisoire"
 LBA_revise_provisional_administration_desc:0 "Nous réviserons les administrations provisoires"
 LBA_ban_political_parties:0 "Interdire les partis politiques"
 LBA_ban_political_parties_desc:0 "Nous interdirons les partis politiques"
 LBA_supremacy_of_provisional_authorities:0 "Suprématie des autorités provisoires"
 LBA_supremacy_of_provisional_authorities_desc:0 "Nous aurons la suprématie des autorités provisoires"
 LBA_adequate_tax_collection:0 "Recouvrement adéquat des impôts"
 LBA_adequate_tax_collection_desc:0 "Nous aurons une collecte d'impôts adéquate"
 LBA_devalue_tribal_cyrenaican_chiefs:0 "Dévaluer les chefs tribaux cyrénaïques"
 LBA_devalue_tribal_cyrenaican_chiefs_desc:0 "Nous dévaloriserons la parole des chefs tribaux cyrénaïques"
 LBA_tolerate_pan_arabism:0 "Tolérer le panarabisme"
 LBA_tolerate_pan_arabism_desc:0 "En raison des relations étroites entre notre roi et Nasser, nous tolérerons le panarabisme"
 LBA_Literacy_Campaign:0 "Campagne d'alphabétisation"
 LBA_Literacy_Campaign_desc:0 "Nous allons lancer une campagne d'alphabétisation"
 LBA_Invest_in_Bayda:0 "Investir à Bayda"
 LBA_Invest_in_Bayda_desc:0 "Nous investirons dans le palais de la cour royale, à Bayda"
 LBA_appeal_to_cyrenaican_cheifs:0 "Appel aux chefs cyrénaïques"
 LBA_appeal_to_cyrenaican_cheifs_desc:0 "Nous ferons appel aux chefs cyrénaïques"
 LBA_anti_pan_arabism:0 "Anti-panarabisme"
 LBA_anti_pan_arabism_desc:0 "Nous devons être contre cette nouvelle idée dangereuse du panarabisme"
 LBA_form_loyalist_cabinet:0 "Former un cabinet loyaliste"
 LBA_form_loyalist_cabinet_desc:0 "Nous formerons un cabinet loyaliste"
 LBA_idris_international_airport:0 "L'aéroport international d'Idris"
 LBA_idris_international_airport_desc:0 "Nous construirons l'aéroport international d'Idris"
 LBA_join_the_league_of_arab_states:0 "Rejoignez la Ligue des États arabes"
 LBA_join_the_league_of_arab_states_desc:0 "Nous devons rejoindre la ligue des États arabes"
 LBA_establish_university_of_libya:0 "Créer l'Université de Libye"
 LBA_establish_university_of_libya_desc:0 "Nous allons créer l'université de Libye, éduquer notre peuple"
 LBA_enforce_traditional_muslim_values:0 "Appliquer les valeurs musulmanes traditionnelles"
 LBA_enforce_traditional_muslim_values_desc:0 "Notre principe est de faire respecter les valeurs musulmanes traditionnelles"
 LBA_superficial_relations_with_egypt:0 "Relations superficielles avec l'Égypte"
 LBA_superficial_relations_with_egypt_desc:0 "Bien que nous ne soyons pas d'accord avec les attitudes panarabistes et réformistes de l'Égypte, notre roi Idris est de bons amis avec Nasser et il aime visiter la nation égyptienne"
 LBA_Develop_Cyrenaica:0 "Développer la Cyrénaïque"
 LBA_Develop_Cyrenaica_desc:0 "Nous devons développer l'État de Cyrénaïque"
 LBA_Aid_Pastoral_Families:0 "Aider les familles pastorales"
 LBA_Aid_Pastoral_Families_desc:0 "Nous devons aider les familles d'agriculteurs pastoraux de notre pays"
 LBA_Increase_Access_to_Healthcare:0 "Augmenter l'accès aux soins de santé"
 LBA_Increase_Access_to_Healthcare_desc:0 "Nous augmenterons l'accès aux soins de santé, au moins pour une classe moyenne plus large"
 LBA_Depoliticization_of_Society:0 "Dépolitisation de la société"
 LBA_Depoliticization_of_Society_desc:0 "Notre roi n'est pas idéologique, ne s'intéresse pas à la politique, la société doit le montrer, pour éviter que le peuple ne devienne trop idéologique"
 LBA_invite_egyptian_teachers:0 "Invitez des professeurs égyptiens"
 LBA_invite_egyptian_teachers_desc:0 "Nasser a encouragé de bonne foi les enseignants égyptiens à venir dans notre pays pour enseigner à la jeunesse. Espérons qu'ils ne propageront pas le panarabisme et ne feront pas l'éloge excessif de la culture égyptienne."
 LBA_appeal_to_us:0 "Appel aux États-Unis."
 LBA_appeal_to_us_desc:0 "Nous devons faire appel à l'aide de la principale superpuissance occidentale"
 LBA_appeal_to_uk:0 "Appel au Royaume-Uni"
 LBA_appeal_to_uk_desc:0 "Nous devrions faire appel à la grande puissance de la région, le Royaume-Uni"
 LBA_washington_legation:0 "La Légation de Washington"
 LBA_washington_legation_desc:0 "Nous établirons une légation à Washington"
 LBA_london_legation:0 "La Légation de Londres"
 LBA_london_legation_desc:0 "Nous établirons une légation à Washington"
 LBA_host_american_military_bases:0 "Héberger des bases militaires américaines"
 LBA_host_american_military_bases_desc:0 "Nous accueillerons des bases militaires américaines"
 LBA_host_british_military_bases:0 "Héberger des bases militaires britanniques"
 LBA_host_british_military_bases_desc:0 "Nous accueillerons des bases militaires britanniques"
 LBA_foreign_protection:0 "Protection étrangère"
 LBA_foreign_protection_desc:0 "Nous sommes protégés par une protection étrangère"
 LBA_libyan_self_determination_of_resources:0 "Autodétermination libyenne des ressources"
 LBA_libyan_self_determination_of_resources_desc:0 "Maintenant que nous sommes une Libye unie, nous pouvons disposer de l'autodétermination de nos ressources"
 LBA_invite_foreign_extraction_corporations:0 "Inviter des sociétés d'extraction étrangères"
 LBA_invite_foreign_extraction_corporations_desc:0 "Nous gagnerons des revenus en invitant les sociétés d'extraction étrangères à extraire nos ressources"
 LBA_trade_oil_with_western_europe:0 "Commercer du pétrole avec l'Europe occidentale"
 LBA_trade_oil_with_western_europe_desc:0 "Nous échangerons du pétrole avec l'Europe occidentale"
 LBA_esso_funded_power_plants:0 "Centrales électriques financées par Esso"
 LBA_esso_funded_power_plants_desc:0 "Nous avons été persuadés par Esso Corp. d'investir dans notre pays à un faible coût de consommation de pétrole"
 LBA_trade_oil_with_arab_states:0 "Commercer du pétrole avec les États arabes"
 LBA_trade_oil_with_arab_states_desc:0 "Nous échangerons du pétrole avec d'autres pays arabes"
 LBA_mineral_law_of_1953:0 "Loi minérale de 1953"
 LBA_mineral_law_of_1953_desc:0 "Nous adoptons une nouvelle loi sur les minéraux qui facilitera une extraction plus étendue des ressources"
 LBA_lower_foreign_corporation_fees:0 "Frais de sociétés étrangères réduits"
 LBA_lower_foreign_corporation_fees_desc:0 "Nous réduirons les frais des sociétés étrangères"
 LBA_Petroleum_law_of_1955:0 "Loi pétrolière de 1955"
 LBA_Petroleum_law_of_1955_desc:0 "En adoptant une nouvelle loi sur le pétrole, les sociétés étrangères et locales étendront leur extraction de pétrole dans notre pays"
 LBA_civilian_gridization:0 "Gridisation civile"
 LBA_civilian_gridization_desc:0 "Grâce au financement étranger, nous pouvons désormais construire un réseau électrique civil moderne dans notre principale agglomération"
 LBA_1959_esso_oil_discovery:0 "1959 Découverte du pétrole Esso"
 LBA_1959_esso_oil_discovery_desc:0 "Les enquêtes d'Esso ont révélé une nouvelle découverte pétrolière majeure dans notre pays"
 LBA_liberalize_industrial_zoning_laws:0 "Libéraliser les lois sur le zonage industriel"
 LBA_liberalize_industrial_zoning_laws_desc:0 "En libéralisant les lois sur le zonage industriel, nous encouragerons la croissance industrielle"
 LBA_tripolitan_civilian_industrialization:0 "Industrialisation civile tripolitaine"
 LBA_tripolitan_civilian_industrialization_desc:0 "Nous devons développer l'industrie civile en Tripolitaine"
 LBA_cyrenaican_civilian_industrialization:0 "Industrialisation civile cyrénaïque"
 LBA_cyrenaican_civilian_industrialization_desc:0 "Nous devons développer l'industrie civile en Tripolitaine"
 LBA_industrialize_benghazi:0 "Industrialiser Benghazi"
 LBA_industrialize_benghazi_desc:0 "Benghazi doit être industrialisée pour le bien de notre pays"
 LBA_industrialize_tripoli:0 "Industrialiser Tripoli"
 LBA_industrialize_tripoli_desc:0 "Tripoli est notre plus grande ville et devient archaïque, nous devons l'industrialiser pour le bien de notre pays"
 LBA_refurbish_italian_arms_manufacturies:0 "Rénover les manufactures d'armes italiennes"
 LBA_refurbish_italian_arms_manufacturies_desc:0 "Nous allons rénover les manufactures d'armes italiennes qui datent de l'entre-deux-guerres"
 LBA_the_emirate_military:0 "L'armée de l'émirat"
 LBA_the_emirate_military_desc:0 "L'armée de l'Émirat cyrénaïcain est plutôt petite et modeste, nous allons commencer à planifier son développement"
 LBA_defend_the_emirate:0 "Défendre l'Émirat"
 LBA_defend_the_emirate_desc:0 "Nous devons planifier la défense de notre Émirat contre les étrangers"
 LBA_begin_tribal_conscription:0 "Commencer la conscription tribale"
 LBA_begin_tribal_conscription_desc:0 "Le seul bassin de conscription sur lequel nous pouvons réellement puiser pour répondre à des normes de recrutement satisfaisantes est celui des milices tribales"
 LBA_ottoman_weapons_reserves:0 "Ottoman Réserves d'armes"
 LBA_ottoman_weapons_reserves_desc:0 "Il reste d'anciens stocks de Ottoman dans les bâtiments intacts de Benghazi et de Syrte où nous pouvons acquérir des fusils à verrou fonctionnels du début du siècle"
 LBA_Captured_Italian_Weapons:0 "Armes italiennes capturées"
 LBA_Captured_Italian_Weapons_desc:0 "D'autres stocks d'armes italiens ont été découverts récemment, probablement cachés pour une utilisation ultérieure sur le théâtre africain de la Seconde Guerre mondiale"
 LBA_study_egyptian_military_doctrine:0 "Étudier la doctrine militaire égyptienne"
 LBA_study_egyptian_military_doctrine_desc:0 "Nos officiers pensent qu'ils peuvent étudier la doctrine très utile de notre voisin plus puissant"
 LBA_Salvaged_Artillery:0 "Artillerie récupérée"
 LBA_Salvaged_Artillery_desc:0 "Il existe une artillerie pratique que nous pouvons récupérer des anciens empires italien et turc"
 LBA_senussi_order_militias:0 "Milices de l'Ordre Senussi"
 LBA_senussi_order_militias_desc:0 "L'ordre religieux de Libye a toujours maintenu une milice appropriée pour son propre agenda, nous pouvons l'étendre et l'utiliser pour le bien-être de l'État"
 LBA_reverse_engineer_italian_engineering:0 "Ingénierie inverse de la technologie des champs de bataille italiens"
 LBA_reverse_engineer_italian_engineering_desc:0 "Il existe de nombreuses techniques d'ingénierie que nous pouvons apprendre de nos anciens esclavagistes"
 LBA_organize_senussi_veterans:0 "Organiser les anciens combattants Senussi"
 LBA_organize_senussi_veterans_desc:0 "Nous devons organiser nos anciens vétérans Senussi dans la nouvelle armée libyenne"
 LBA_the_royal_libyan_military:0 "L'armée royale libyenne"
 LBA_the_royal_libyan_military_desc:0 "Il est temps d'organiser une nouvelle armée royale libyenne unie"
 LBA_british_equipment_exchange:0 "Bourse d'équipement britannique"
 LBA_british_equipment_exchange_desc:0 "Nous pouvons nous mettre d'accord avec les Britanniques pour acquérir de nouveaux équipements"
 LBA_american_equipment_exchange:0 "Échange d'équipement américain"
 LBA_american_equipment_exchange_desc:0 "On peut s'entendre avec les Américains pour acquérir de nouveaux équipements"
 LBA_analyze_military_truck_designs:0 "Analyser la conception des camions militaires"
 LBA_analyze_military_truck_designs_desc:0 "Nous pouvons analyser ces modèles de camions militaires étrangers pour les utiliser dans nos propres usines"
 LBA_analyze_world_war_2_planes:0 "Analyser les avions étrangers"
 LBA_analyze_world_war_2_planes_desc:0 "Nous pouvons analyser ces conceptions d'avions étrangers pour les utiliser dans nos propres usines"
 LBA_British_Advisors:0 "Conseillers britanniques"
