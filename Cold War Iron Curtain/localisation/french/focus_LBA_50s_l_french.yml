 LBA_60s_Libyan_Foreign_Policy:0 "Politique étrangère libyenne"
 LBA_60s_Libyan_Foreign_Policy_desc:0 "Le monde interconnecté de nos vies modernes apparaît en Libye. Elle doit s'engager dans la politique étrangère, peu importe comment elle essaie de l'éviter."
 LBA_60s_the_UAR:0 "La RAU"
 LBA_60s_the_UAR_desc:0 "La République Arabe Unie apparaît à nous en tant qu'Arabes. Comment allons-nous y remédier ? Devons-nous le rejoindre directement en tant que nation ou nous y associer politiquement."
 LBA_60s_political_association:0 "Association politique"
 LBA_60s_political_association_desc:0 "Il est dans notre intérêt de nous associer politiquement uniquement à la RAU"
 LBA_60s_administrative_union:0 "Union administrative"
 LBA_60s_administrative_union_desc:0 "Nous rejoindrons directement la République Arabe Unie"
 LBA_60s_the_six_day_war:0 "La guerre des Six Jours"
 LBA_60s_the_six_day_war_desc:0 "Comment allons-nous aborder la guerre des Six Jours ?"
 LBA_60s_the_israeli_question:0 "La question israélienne"
 LBA_60s_the_israeli_question_desc:0 "Comment allons-nous nous adresser à la nation sioniste ?"
 LBA_60s_ignore_the_issue:0 "Ignorer le problème"
 LBA_60s_ignore_the_issue_desc:0 "Nous ne devrions même pas aborder cette question complexe."
 LBA_60s_support_UAR:0 "Soutenez la RAU"
 LBA_60s_support_UAR_desc:0 "Nous soutiendrons la République Arabe Unie pendant la guerre des Six Jours en fournissant des armes et des effectifs."
 LBA_60s_politically_support_palestine:0 "Soutenir politiquement la Palestine"
 LBA_60s_politically_support_palestine_desc:0 "Nous soutiendrons politiquement la Palestine"
 LBA_60s_Palestinian_Militias:0 "Milices palestiniennes"
 LBA_60s_Palestinian_Militias_desc:0 "Nous parrainerons et utiliserons les milices palestiniennes pour nous prémunir contre le sionisme"
 LBA_60s_form_the_libyan_army:0 "Former l'armée libyenne"
 LBA_60s_form_the_libyan_army_desc:0 "Il est temps de former une armée libyenne sophistiquée pour notre royaume"
 LBA_60s_found_libyan_air_force:0 "J'ai fondé l'armée de l'air libyenne"
 LBA_60s_found_libyan_air_force_desc:0 "Il est temps de former une force aérienne sophistiquée pour notre royaume libyen"
 LBA_60s_replace_infantry_equipment:0 "Remplacer l'équipement d'infanterie"
 LBA_60s_replace_infantry_equipment_desc:0 "Il est nécessaire de remplacer l'équipement de l'infanterie dans notre armée."
 LBA_60s_invest_in_mobile_combat:0 "Investissez dans le combat mobile"
 LBA_60s_invest_in_mobile_combat_desc:0 "Une avancée moderne nécessaire est l'adoption du combat mobile"
 LBA_60s_multirole_jet_research:0 "Recherche sur les avions multirôles"
