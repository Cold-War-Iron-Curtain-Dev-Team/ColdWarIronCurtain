 GDR_First_Secretary_Herrnstadt: "Premier secrétaire Herrnstadt"
 GDR_First_Secretary_Herrnstadt_desc: "Rudolf Herrnstadt a réussi à ravir la direction de la RDA à Walter Ulbricht ; il est temps de le reconnaître officiellement comme notre nouveau Premier Secrétaire."
 GDR_Exorcise_the_Spectre_of_the_Construction_of_Socialism: "Exorciser le spectre de la construction du socialisme"
 GDR_Exorcise_the_Spectre_of_the_Construction_of_Socialism_desc: "Notre vision de l'avenir de l'Allemagne ne correspond pas aux politiques ratées d'Ulbricht. Nous devons exprimer clairement nos intentions, par des paroles et des actions."
 GDR_The_New_Reconstruction_Plan: "Le nouveau plan de reconstruction"
 GDR_The_New_Reconstruction_Plan_desc: "La guerre est terminée depuis un certain temps, mais notre pays est toujours en ruines. Il est clair que nous devons réévaluer nos plans de reconstruction de notre nation."
 GDR_Modernize_Rail_Connections: "Moderniser les connexions ferroviaires"
 GDR_Modernize_Rail_Connections_desc: "Les chemins de fer furent pratiquement détruits dans les derniers jours de la guerre. Bien que regrettable, cela nous donne l'occasion de les moderniser au fur et à mesure de notre reconstruction."
 GDR_Address_the_Economic_Causes_of_Republikflucht: "Les causes économiques de Republikflucht"
 GDR_Address_the_Economic_Causes_of_Republikflucht_desc: "Nous ne pouvons plus ignorer Republikflucht ; Même s'il serait plus simple d'interdire simplement à notre peuple de partir, cela ne s'attaquerait pas à la cause profonde du problème. Une réforme économique est donc nécessaire."
 GDR_Soviet_Food_Aid: "Aide alimentaire soviétique"
 GDR_Soviet_Food_Aid_desc: "Il faudra du temps pour que nos terres agricoles se remettent des ravages de la guerre. En attendant, nous devrons compter sur l'aide alimentaire soviétique."
 GDR_Ensure_Delivery_of_Raw_Materials: "Assurer la livraison des matières premières"
 GDR_Ensure_Delivery_of_Raw_Materials_desc: "Afin de faciliter la reconstruction économique de l'État allemand, nous devons veiller à ce que les matières premières soient livrées là où elles sont nécessaires."
 GDR_Integrate_into_the_Eastern_Market: "Intégrer le marché oriental"
 GDR_Integrate_into_the_Eastern_Market_desc: "Un nouveau marché est en train d'émerger chez nos voisins socialistes, et s'y intégrer entraînerait un énorme boom pour notre économie."
 GDR_Restore_Social_Services: "Restaurer les services sociaux"
 GDR_Restore_Social_Services_desc: "Un pays socialiste est fier de disposer de services sociaux de pointe. Nous devons restaurer le nôtre immédiatement !"
 GDR_Reverse_Work_Quota_Increases: "Augmentations inversées des quotas de travail"
 GDR_Reverse_Work_Quota_Increases_desc: "Les quotas de travail trop élevés du gouvernement précédent ont laissé nos travailleurs fatigués et désillusionnés. Nous devons les inverser immédiatement."
 GDR_Reform_the_Legal_System: "Réformer le système juridique"
 GDR_Reform_the_Legal_System_desc: "Il existe un consensus croissant parmi notre peuple et parmi plusieurs membres du parti sur le fait que notre système judiciaire a besoin de réformes. Abordons cela."
 GDR_H_The_Cult_of_the_Spanish_Civil_War: "Le culte de la guerre civile espagnole"
 GDR_H_The_Cult_of_the_Spanish_Civil_War_desc: "Les hommes et les femmes courageux qui se sont battus pour empêcher l'Espagne de tomber sous l'influence fasciste ne pourront jamais être oubliés ! Tous nos citoyens devraient s'efforcer de suivre leur exemple."
 GDR_Focus_on_the_Unified_Deutschemark_Zone_Proposal: "La proposition de zone unifiée du Deutschemark"
 GDR_Focus_on_the_Unified_Deutschemark_Zone_Proposal_desc: "Une zone économique unifiée entre l'Allemagne de l'Est et l'Allemagne de l'Ouest constituerait un grand pas vers l'unification, si elle réussit. Nous devrions faire de notre mieux pour garantir que ce soit le cas !"
 GDR_The_New_Course: "Le nouveau cours"
 GDR_The_New_Course_desc: "La République démocratique allemande se dirige dans une nouvelle direction ; celui qui nous mènera à la paix et à la prospérité pour les décennies à venir !"
 GDR_Purge_the_Ulbricht_Group: "Purger le groupe Ulbricht"
 GDR_Purge_the_Ulbricht_Group_desc: "Les partisans d'Ulbricht détiennent toujours une influence considérable sur le gouvernement. Il faut s'en occuper."
 GDR_Dismantle_the_Personality_Cult: "Démanteler le culte de la personnalité"
 GDR_Dismantle_the_Personality_Cult_desc: "Les cultes de la personnalité ne conviennent pas aux pays socialistes. Celui qui a été propagé ici doit être démantelé immédiatement."
 GDR_Reverse_Course_on_Clerical_Persecution: "Inverser les persécutions cléricales"
 GDR_Reverse_Course_on_Clerical_Persecution_desc: "La persécution excessive et la diffamation du clergé ont causé plus de mal que de bien au pays. Il est clair que nous devons désamorcer nos efforts."
 GDR_Institute_Collective_Leadership: "Institut de leadership collectif"
 GDR_Institute_Collective_Leadership_desc: "La RDA est prête à adopter une direction collective et à abolir le parti unique. Avec le temps, le système allemand deviendra un modèle pour les autres pays socialistes !"
 GDR_Reign_in_the_Stasi: "Règne dans la Stasi"
 GDR_Reign_in_the_Stasi_desc: "La portée excessive de la Stasi ne peut plus être ignorée ; si les gens ont trop peur de vivre, ils ne peuvent pas travailler correctement. Nous devons corriger cela."
 GDR_Dissolve_the_Secretariat: "Dissoudre le Secrétariat"
 GDR_Dissolve_the_Secretariat_desc: "Avec l'adoption formelle d'une direction collective, le secrétariat n'est plus nécessaire."
 GDR_Apply_to_Join_the_ECSC: "Postuler pour adhérer à la CECA"
 GDR_Apply_to_Join_the_ECSC_desc: "Nous ferons clairement connaître à l'Occident nos intentions de coopération pacifique en étendant une candidature formelle à la Communauté européenne du charbon et de l'acier."
 GDR_Bridging_the_Divide: "Combler le fossé"
 GDR_Bridging_the_Divide_desc: "Alors que nous cherchons à resserrer nos liens avec l'Occident, nous souhaitons également exprimer clairement notre intention de nous réunifier avec nos frères ouest-allemands. La première étape consiste à apaiser les tensions entre nos deux gouvernements et à planifier une coopération à long terme."
