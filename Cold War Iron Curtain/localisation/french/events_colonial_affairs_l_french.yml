 #SPAIN
 decolonization.15.t:0 "Accords de Madrid"
 decolonization.15.d:0 "La pression monte. Nos possessions au Sahara occidental subissent de fortes pressions de la part du Maroc, de la Mauritanie et de la communauté internationale pour être décolonisées. Le Maroc et la Mauritanie émettent des revendications territoriales et les guérilleros du Front Polisario font des ravages sur le territoire. Nous devons régler ce problème immédiatement."
 decolonization.15.a:0 "Se retirer du Sahara occidental"
 decolonization.15.b:0 "Concessions à la Mauritanie"
 decolonization.15.c:0 "Refuser les négociations"
 
 #AUSTRALIA
 end_nauru_mandate:0 "Dissoudre le mandat - Nauru"
 end_papua_new_guinea_mandate:0 "Dissoudre le mandat - Papouasie-Nouvelle-Guinée"
 decolonization.5.t:0 "Nauru Expiré"
 decolonization.5.d:0 "Comme nous n'avons pas encore décolonisé Nauru, notre mandat est désormais expiré et Nauru obtiendra aujourd'hui son indépendance."
 decolonization.5.a:0 "Très bien.."
 decolonization.9.t:0 "Papouasie et Nouvelle Guinée Expiré"
 decolonization.9.d:0 "Comme nous n'avons pas encore décolonisé la Papouasie et la Nouvelle-Guinée, notre mandat est désormais expiré et aujourd'hui la Papouasie-Nouvelle-Guinée obtiendra son indépendance."
 decolonization.9.a:0 "Très bien.."
 
 #BELGIUM
 end_ruanda_urundi_mandate:0 "Dissoudre le mandat - Ruanda-Urundi"
 decolonization.6.t:0 "Ruanda-Urundi Expiré"
 decolonization.6.d:0 "Comme nous n'avons pas encore décolonisé le Ruanda-Urundi, notre mandat est désormais expiré et aujourd'hui le Rwanda et le Burundi obtiendront tous deux leur indépendance."
 decolonization.6.a:0 "Très bien.."
 decolonization.7.t:0 "Le Congo belge déclare son indépendance"
 decolonization.7.a:0 "Nous souhaitons au Congo bonne chance dans la construction de sa nation."
