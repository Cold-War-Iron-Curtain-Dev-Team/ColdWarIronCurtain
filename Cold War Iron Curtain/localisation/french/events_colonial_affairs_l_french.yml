l_french:
 colonial_affairs:0 "Affaires coloniales"
 colonial_affairs_desc:0 "Gérez vos nations §Cpossessions coloniales,§! par \nsoit en renforçant le pouvoir de votre État sur votre \ncolonies, ou en leur accordant l'économie. \n\nDans un nouvel ordre mondial en évolution rapide, et après \navoir mené une guerre pour vaincre la tyrannie et \nautocratie, ce serait peut-être légèrement hypocrite \npour opprimer les indigènes de ces terres sous notre botte."
 #UNITED KINGDOM
 end_cameroon_mandate_uk:0 "Fin du mandat - Cameroun britannique"
 end_togo_mandate_uk:0 "Fin du mandat - Togoland britannique"
 end_tanganyika_mandate:0 "Fin du mandat - Tanganyika"
 cocos_islands_act:0 "Loi sur les îles Cocos"
 christmas_island_act:0 "Loi sur l'île Christmas"
 terminate_british_trucial_sheikhdoms_treaty:0 "Mettre fin au Traité des Cheikhs de la Trêve britannique"
 decolonization.2.t:0 "Cameroun britannique Expiré"
 decolonization.2.d:0 "Comme nous n'avons pas encore décolonisé le Cameroun britannique, notre mandat est désormais expiré et le statut du territoire va être négocié avec le Nigeria et le Cameroun."
 decolonization.2.a:0 "Très bien.."
 decolonization.4.t:0 "Togoland britannique Expiré"
 decolonization.4.d:0 "Comme nous n'avons pas encore décolonisé le Togo britannique, notre mandat est désormais expiré et le territoire va être intégré au Ghana."
 decolonization.4.a:0 "Très bien.."
 decolonization.8.t:0 "Tanganyika Expiré"
 decolonization.8.d:0 "Comme nous n'avons pas encore décolonisé le Tanganyika, notre mandat est désormais expiré et le Tanganyika obtiendra son indépendance."
 decolonization.8.a:0 "Très bien.."
 decolonization.10.t:0 "La question malaise"
 decolonization.10.d:0 "Il est temps de s'attaquer à la question de la décolonisation du Nord de Bornéo. Nous avons le choix entre 2 forfaits. Le plan malaisien est favorisé par la majorité de la population et implique la fusion des colonies de Singapour et du nord de Bornéo, à l'exclusion de Brunei, avec la Malaisie pour former la Malaisie. Le plan du Nord-Bornéo est favorisé par le Parti populaire de Brunei et implique la fusion des colonies du Nord-Bornéo avec Brunei pour former la Fédération du Nord-Bornéo, seul Singapour rejoignant la Malaisie."
 decolonization.10.a:0 "Le plan Malaisie"
 decolonization.10.b:0 "Le plan Nord-Bornéo"
 decolonization.11.t:0 "Loi sur l'indépendance de la Malaisie"
 decolonization.11.d:0 "Le Parlement a adopté la loi sur l'indépendance de la Malaisie, nous obligeant à révoquer le statut colonial malais et à leur accorder la souveraineté."
 decolonization.11.a:0 "Nous leur souhaitons du succès !"
 decolonization.12.t:0 "Loi sur l'indépendance de la Guyane"
 decolonization.12.d:0 "Le Parlement a adopté la loi sur l'indépendance de la Guyane, nous obligeant à accorder l'indépendance à la colonie de la Couronne de Guyane et à la transformer en République coopérative de Guyane."
 decolonization.12.a:0 "Nous leur souhaitons du succès !"
 decolonization.13.t:0 "Loi du Belize"
 decolonization.13.d:0 "Le Parlement a adopté la loi du Belize, nous obligeant à accorder l'indépendance à la colonie de la couronne du Honduras britannique et à la transformer en Belize."
 decolonization.13.a:0 "Nous leur souhaitons du succès !"
 decolonization.14.t:0 "Loi sur le Royaume du Lesotho"
 decolonization.14.d:0 "Le Parlement a adopté la loi sur le Royaume du Lesotho, nous obligeant à accorder l'indépendance à la colonie de la couronne du Basutoland et à la transformer en Lesotho."
 decolonization.14.a:0 "Nous leur souhaitons du succès !"
 decolonization.16.t:0 "Le Traité des Cheikhs de la Trêve britannique a expiré"
 decolonization.16.d:0 "Les traités que nous avons signés avec les dirigeants des États de la Trêve, du Qatar et de Bahreïn sont désormais expirés et nous devons désormais accorder l'indépendance à ces États arabes."
 decolonization.16.a:0 "Nous leur souhaitons du succès !"
 decolonization.17.t:0 "Urgence à Aden"
 decolonization.17.d:0 "Nos colonies d'Aden traversent une période difficile. Les guérilleros d'extrême gauche lancent une insurrection sur nos territoires dans le but d'obtenir l'indépendance. Pour atténuer le problème, nos administrateurs coloniaux réforment l'administration coloniale dans la région."
 decolonization.17.a:0 "Ces fichus communistes !"
 decolonization.18.t:0 "Loi sur l'indépendance de Malte"
 decolonization.18.d:0 "Le Parlement discute et vote actuellement sur un projet de loi visant à accorder l'indépendance à la colonie de la Couronne de Malte. Cependant, Malte elle-même est partagée entre l'indépendance et l'intégration en tant que territoire d'outre-mer. Nous pourrions interférer dans le processus législatif."
 decolonization.18.a:0 "Laissez le Parlement tranquille !"
 decolonization.18.b:0 "Malte comme territoire d'outre-mer !"
 decolonization.19.t:0 "Loi sur l'indépendance des Bahamas"
 decolonization.19.d:0 "Le Parlement a adopté la loi sur l'indépendance des Bahamas, nous obligeant à accorder l'indépendance à la colonie de la couronne des îles Bahama et à la transformer en Commonwealth des Bahamas."
 decolonization.19.a:0 "Nous leur souhaitons du succès !"
 decolonization.20.t:0 "Accords Londres-Zurich"
 decolonization.20.d:0 "Après d'intenses violences ethniques, des négociations ont eu lieu à Londres et à Zurich pour parvenir à une solution à la crise chypriote. Actuellement, les négociations ont abouti à la conclusion qu'une République unifiée de Chypre serait formée par les Grecs et les Turcs, tandis qu'Akrotiri et Dhekelia deviendraient des bases militaires britanniques."
 decolonization.20.a:0 "Créer la République de Chypre"
 decolonization.20.b:0 "Les conditions sont injustes !"
 decolonization.21.t:0 "Loi sur l'indépendance du Botswana"
 decolonization.21.d:0 "Le Parlement a adopté la loi sur l'indépendance du Botswana, nous obligeant à accorder l'indépendance au Protectorat du Bechuanaland et à le transformer en République du Botswana."
 decolonization.21.a:0 "Nous leur souhaitons du succès !"
 decolonization.22.t:0 "Loi sur l'indépendance de la Zambie"
 decolonization.22.d:0 "Le Parlement a adopté la loi sur l'indépendance de la Zambie, nous obligeant à accorder l'indépendance à la Rhodésie du Nord et à la transformer en République de Zambie."
 decolonization.22.a:0 "Nous leur souhaitons du succès !"
 decolonization.23.t:0 "Loi sur l'indépendance du Malawi"
 decolonization.23.d:0 "Le Parlement a adopté la loi sur l'indépendance du Malawi, nous obligeant à accorder l'indépendance au Nyassaland et à le transformer en République du Malawi."
 decolonization.23.a:0 "Nous leur souhaitons du succès !"
 decolonization.24.t:0 "L'État du Somaliland"
 decolonization.24.d:0 "Après des années de préparation par les administrateurs coloniaux, le protectorat britannique du Somaliland a obtenu son indépendance et a été transformé en État du Somaliland, alors que les pourparlers d'unification avec la Somalie sont toujours en cours."
 decolonization.24.a:0 "J'avais oublié que nous avions cette colonie !"
 
