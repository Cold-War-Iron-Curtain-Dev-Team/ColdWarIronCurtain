 glacial_flood_risk:0 "§RRisque d'inondation glaciaire§!"
 glacial_flood_risk_desc:0 "Dans le haut Himalaya, le retrait des glaciers a augmenté le nombre et la taille des lacs glaciaires. Le Bhoutan est confronté à une menace croissante liée aux crues des lacs glaciaires (GLOF), où des ruptures soudaines des barrages glaciaires libèrent des torrents dévastateurs en aval. Ce risque pèse sur le développement des infrastructures, de l'agriculture et de l'hydroélectricité tout en menaçant les vies et les moyens de subsistance dans les vallées vulnérables. Sans mesures d'atténuation, cela ralentit la croissance économique et augmente les coûts dans les secteurs vitaux. Des stratégies d'adaptation ciblées sont essentielles pour surveiller, renforcer et gérer ces aléas."
 
 BHU_Conservative_Backlash:0 "§RRéaction conservatrice§!"
 BHU_Conservative_Backlash_desc:0 "Les réformes récentes ont déclenché une réaction conservatrice de la part des factions religieuses et traditionalistes du Bhoutan. Alarmés par les menaces perçues contre l'autorité monastique, l'harmonie sociale et l'identité nationale, des membres influents du clergé et des dirigeants communautaires mobilisent la résistance. Ces troubles se manifestent par un défi subtil, une obstruction aux initiatives gouvernementales et la résurgence du sentiment royaliste et isolationniste dans les dzongkhags ruraux. Si elle n'est pas gérée avec soin, elle pourrait faire dérailler les efforts de modernisation de l'État et saper le fragile consensus politique du Bhoutan."
 
 BHU_Monastic_Autonomy:0 "§YAutonomie monastique§!"
 BHU_Monastic_Autonomy_desc:0 "Les institutions monastiques du Bhoutan revêtent une profonde signification spirituelle, culturelle et politique. Leur accorder une plus grande autonomie a stabilisé le soutien religieux et réduit les troubles religieux, mais cela a un coût. L'administration indépendante des terres, des finances et de l'éducation limite le contrôle de l'État et restreint la diffusion des réformes modernes. Même si les monastères restent des piliers vitaux de la société, leur isolement de la politique civile peut entraver le développement rural, la fiscalité et l'uniformité juridique. Concilier indépendance spirituelle et cohésion nationale reste un défi persistant."
 
 BHU_First_Five_Year_Plan:0 "Premier plan quinquennal"
 BHU_First_Five_Year_Plan_desc:0 "Le Bhoutan se lance dans son premier plan quinquennal ambitieux pour jeter les bases du développement national. Avec l'aide financière de l'Inde et l'accent mis sur les infrastructures modernes, ce plan donne la priorité à la construction de routes, à l'éducation et aux services de santé tout en préservant la préservation culturelle. Bien que sa portée soit limitée par rapport à d'autres pays, elle représente un changement significatif vers une gestion économique planifiée et une intégration nationale."
 
 Thrimzhung_Chenmo:0 "Thrimzhung Chenmo (Grand Code Juridique)"
 Thrimzhung_Chenmo_desc:0 "Le Thrimzhung Chenmo, ou Grand Code juridique, codifie le droit civil et pénal bhoutanais sous la direction du Druk Gyalpo. Il formalise les pratiques juridiques traditionnelles tout en affirmant le rôle des valeurs bouddhistes dans la gouvernance. Ce code renforce l'autorité centrale et la cohérence judiciaire dans tout le royaume, réduisant ainsi l'arbitraire local et soutenant les efforts de construction d'un État moderne."
 
 PM_Jigme_Palden_Dorji:0 "Premier ministre Jigme Palden Dorji"
 PM_Jigme_Palden_Dorji_desc:0 "Jigme Palden Dorji, l'un des principaux architectes de la modernisation du Bhoutan, est Premier ministre sous le jeune roi Jigme Dorji Wangchuck. Éduqué en Inde et formé en administration, il milite en faveur de la réforme institutionnelle, de la diplomatie étrangère et du renforcement de l'État. Son mandat est marqué à la fois par l'ambition et la controverse, alors qu'il défie les élites bien établies dans la quête d'un État bhoutanais moderne."
 
 PM_Chabda_Namgyal:0 "Premier ministre Chabda Namgyal"
 PM_Chabda_Namgyal_desc:0 "Chabda Namgyal représente les factions conservatrices de la cour, plaidant pour une réforme progressive alignée sur l'autorité monastique traditionnelle. En tant que Premier ministre, il met l'accent sur la préservation du patrimoine spirituel du Bhoutan et sur l'autonomie des institutions religieuses tout en gérant prudemment les efforts de modernisation. Son leadership reflète une tentative d'équilibrer réforme et continuité dans un paysage politique changeant."
