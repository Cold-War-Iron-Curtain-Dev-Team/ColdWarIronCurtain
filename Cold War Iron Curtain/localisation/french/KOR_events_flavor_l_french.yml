l_french:
 ##KOR Flavor
 #50s
 KOR_50s_flavor.1.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Homer Bezaleel Herbert, un missionnaire américain réputé pour sa contribution au mouvement indépendantiste coréen, est décédé d'une maladie pulmonaire à Séoul. Il a été invité en République de Corée en tant qu'invité d'État pour la commémoration du Jour de l'Indépendance. Alors qu'il montait à bord d'un navire à destination de la Corée, il a déclaré qu'il souhaitait être enterré sur le sol coréen plutôt qu'à l'abbaye de Westminster. Ses paroles sont devenues réalité lorsque la décision a été prise de l'enterrer à Séoul après les funérailles publiques. Le président Syngman Rhee a exprimé sa volonté de lui graver une épitaphe en signe de respect pour sa vie."
 KOR_50s_flavor.2.d:0 "Aujourd'hui, Kim Sam-ryong et Lee Joo-ha, qui sont les principaux dirigeants du Parti des travailleurs de la République de Corée, ont été arrêtés par les forces de police de la République de Corée. Kim Sang-ryong et Lee Joo-ha sont restés en République de Corée pour poursuivre les activités du Parti des travailleurs de la République de Corée, contrairement à ses autres dirigeants majeurs comme Pak Hon-yong. Ils ont poursuivi leurs activités secrètes visant à renverser le gouvernement de la République de Corée par le biais d'organisations clandestines et ont tourmenté les autorités de la République de Corée pendant des mois. Les deux personnalités devraient être condamnées à mort lors des prochains procès militaires. Les autorités et les citoyens de la République de Corée ont accueilli favorablement la nouvelle de leur arrestation."
 KOR_50s_flavor.3.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Chae Man-sik, l'un des romanciers coréens les plus célèbres des dernières décennies, est décédé des suites d'une maladie. Il a écrit de nombreuses oeuvres, notamment des romans, des pièces de théâtre et des contes de fées, et est largement connu pour ses grands romans, tels que Readymade Life, Muddy Streams et Foolish Man. Comme d'autres écrivains de l'époque, il est également critiqué pour ses activités pro-japonaises. Après la libération de la Corée, il publie un roman intitulé Le pécheur du peuple et réfléchit sur ses activités pro-japonaises passées."
 KOR_50s_flavor.4.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Philp Jaisohn, ancien militant pour l'indépendance coréenne et journaliste de renom, est décédé des suites d'une maladie aux États-Unis. Lorsque Philip était un homme politique de l'Empire de Corée, il a lancé un journal appelé Independence, fondé une organisation appelée Independence Association et dirigé un mouvement populaire de modernisation en Corée. Il a insisté sur la création d'un parlement et d'une monarchie constitutionnelle, mais il est retourné aux États-Unis après que sa proposition ait été rejetée par le roi Gojong. Plus tard, il soutient le Mouvement du 1er Mars en écrivant des articles à son sujet aux États-Unis. Après la libération de la Corée du joug colonial japonais en 1945, il a reçu une offre pour devenir président de la République de Corée, mais n'a pas pu se présenter aux élections en raison de sa citoyenneté américaine."
 KOR_50s_flavor.5.d:0 "Après que plusieurs propositions aient été faites par l'ONU et les forces communistes, les premières négociations d'armistice entre l'ONU, la Corée du Nord et la Chine ont eu lieu officiellement à Kaesong. Après une année de conflit immense et meurtrier en Corée, de nombreux pays impliqués dans la guerre ont pris conscience de la nécessité d'entamer des négociations pour mettre fin à la guerre. La République de Corée a refusé de participer aux pourparlers d'armistice alors que Syngman Rhee a exprimé sa ferme volonté de poursuivre la guerre et de réunifier la Corée."
 KOR_50s_flavor.6.d:0 "Aujourd'hui, le gouvernement et les citoyens de la République de Corée ont activement exprimé leur opposition aux pourparlers de cessez-le-feu lors de manifestations à l'échelle nationale. Ils ont affirmé qu'un cessez-le-feu devait être obtenu grâce à une marche vers la Corée du Nord et à la réunification de la péninsule coréenne. Bien que la République de Corée ne puisse pas continuer la guerre seule en raison de problèmes de contrôle en temps de guerre, des milliers de Sud-Coréens se sont rassemblés dans les rues pour rejoindre les rassemblements nationaux anti-armistice."
 KOR_50s_flavor.7.d:0 "Aujourd'hui, une violente émeute entre prisonniers de guerre nord-coréens et chinois a eu lieu dans le camp des prisonniers de guerre de Koje. Camp. Le prisonnier de guerre de Koje Le camp a été créé pour accueillir les prisonniers nord-coréens et chinois capturés pendant la guerre de Corée. Plus de 170 000 personnes y étaient détenues, dont 150 000 Nord-Coréens et 20 000 prisonniers de guerre chinois. Bien que les émeutiers aient occupé certaines zones de l'établissement en utilisant des armes de fortune, il semble que l'émeute sera réprimée par les forces de l'ONU et de la République de Corée d'ici quelques jours."
 KOR_50s_flavor.8.d:0 "La moralité du gouvernement de Syngman Rhee a de nouveau été gravement meurtrie en raison d'un scandale de corruption. Il a été révélé que le gouvernement envoyait l'argent qu'ils gagnaient en vendant du tungstène aux étrangers à des entreprises privées et leur permettait d'acheter de la farine et des engrais. Les entreprises vendaient ensuite les marchandises aux agriculteurs à des prix excessivement élevés. Même si l'opinion publique réclame très fortement que les personnes impliquées soient punies, le conseil d'enquête semble manquer de progrès."
 KOR_50s_flavor.9.d:0 "Aujourd'hui, le Président Syngman Rhee de la République de Corée s'est rendu au Japon et a rencontré le Premier ministre japonais Yoshida Sigeru. Bien que Syngman Rhee soit largement connu pour son comportement agressif envers le Japon, il semble que Rhee et Yoshida cherchent à améliorer les relations entre les deux nations afin de refléter l'évolution de la situation internationale. Le commandant des forces de l'ONU, Mark Clark, était également présent à la réunion."
 KOR_50s_flavor.10.d:0 "De nombreux citoyens ont été frappés par le choc et le chagrin en République de Corée lorsqu'un navire à passagers appelé Changyeong a coulé dans un terrible accident en mer. Le navire a quitté le port de Yeosu et se dirigeait vers le port de Busan. Parmi les 338 passagers à bord, 330 sont morts dans l'accident tandis que 8 ont été secourus. On estime que cet accident est le plus grave accident maritime jamais enregistré en République de Corée."
 KOR_50s_flavor.11.d:0 "Jang Joon Ha, ancien combattant indépendantiste coréen et jeune homme politique, a lancé un journal appelé Sasanggye, qui prône ouvertement la réunification, la démocratie, le développement économique et la culture créative. Le premier numéro du journal a gagné en popularité auprès des citoyens coréens et s'est vendu instantanément. Il semble que la société de presse continuera à maintenir sa popularité auprès de nombreux lecteurs coréens dans les années à venir."
 KOR_50s_flavor.12.d:0 "Rho Geum-seok, un ancien lieutenant d'aviation nord-coréen, a fait défection vers la République de Corée après avoir pénétré dans l'espace aérien de la République de Corée à bord d'un chasseur à réaction MIG-15. Les autorités de la République de Corée ont salué l'arrivée du pilote, saluant sa décision courageuse d'échapper à la tyrannie communiste et de rejoindre la République libre et démocratique de Corée."
 KOR_50s_flavor.13.d:0 "Aujourd'hui, le Président Syngman Rhee de la République de Corée s'est rendu à Taiwan et a rencontré le Président Chiang Kai Shek. Après son arrivée à Taiwan, le président Syngman Rhee a récompensé Chiang Kai Shek pour sa contribution au mouvement indépendantiste coréen. Il semble que les relations amicales entre la République de Corée et la République de Chine ne feront que se renforcer pour refléter l'évolution de la situation internationale."
 KOR_50s_flavor.14.d:0 "Le roman Madame Freedom récemment publié est devenu controversé au sein de la société coréenne. Le roman a attiré beaucoup d'attention pour avoir décrit la liaison d'un professeur d'université avec un étudiant, et 40 000 exemplaires du roman ont été vendus. Cependant, de nombreuses personnalités conservatrices comme Hwang San-deok, professeur à l'Université nationale de Séoul, ont critiqué le roman comme étant excessivement obscène et décadent. Le président Syngman Rhee a également ordonné à la police d'emmener et d'interroger l'auteur du roman, Jeong Bi-seok."
 KOR_50s_flavor.15.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Kim Young-hwan, membre renommé de l'armée de l'air de la République de Corée et héros de guerre, est décédé dans un accident d'avion alors qu'il se rendait à un événement organisé par l'armée de l'air de la République de Corée. Pendant la guerre de Corée, Kim Young-hwan a reçu l'ordre de lancer une frappe aérienne dans la zone où se trouvait le temple de Haeinsa. Parce que le temple de Haeinsa et les gravures sur bois du Tripitaka Koreana avaient une énorme valeur historique, Kim Young-hwan a ordonné aux autres pilotes de ne pas bombarder la zone et de tirer à la place un barrage de mitrailleuses, prenant le risque d'être puni pour avoir désobéi aux ordres. Grâce à ses efforts, les artefacts de Haeinsa ont pu être bien préservés."
 KOR_50s_flavor.16.d:0 "Après deux matches, la République de Corée a remporté le match de qualification pour la Coupe du Monde contre le Japon. Bien que les matches devaient avoir lieu respectivement en République de Corée et au Japon, les deux matchs ont eu lieu à Tokyo. Syngman Rhee a exprimé sa ferme volonté de ne pas laisser les joueurs de football japonais jouer un match sur le sol coréen. Malgré des conditions difficiles, l'équipe nationale de la République de Corée est sortie victorieuse et a assuré la place de la République de Corée pour la prochaine finale de la Coupe du monde."
 KOR_50s_flavor.17.d:0 "Aujourd'hui, le Président Syngman Rhee de la République de Corée s'est rendu aux États-Unis et a rencontré le Président Eisenhower. Durant son séjour aux États-Unis, Syngman Rhee a reçu un diplôme honorifique de l'Université George Washington et a prononcé un discours devant le Congrès américain. Il semble que les relations amicales entre la République de Corée et les États-Unis ne feront que se renforcer pour refléter l'évolution de la situation internationale."
 KOR_50s_flavor.18.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Lee Young-min, un sportif de renom, est décédé des suites d'une maladie. Lee Young-min a participé à plusieurs matchs de baseball et de football dans les années 1920 et 1930 et est devenu l'entraîneur de l'équipe coréenne de football pour les Jeux olympiques de Londres de 1948. L'Association coréenne de baseball et softball prévoit de créer un prix portant son nom pour récompenser les sportifs coréens ayant battu des records."
 KOR_50s_flavor.19.d:0 "Aujourd'hui, une escarmouche navale a eu lieu près de l'île de Dokdo entre la Garde volontaire de Dokdo et la Garde côtière japonaise. La bataille a commencé lorsque trois navires japonais et un avion se sont approchés de Dokdo et ont ignoré les avertissements de la garde volontaire de Dokdo. Après avoir perdu l'un de leurs navires et subi des pertes, les forces japonaises se sont retirées de l'île. Le gouvernement japonais a protesté contre les provocations de la République de Corée par la voie diplomatique."
 KOR_50s_flavor.20.d:0 "De nombreux citoyens ont été frappés par le choc et le chagrin en République de Corée lorsqu'un grand incendie a eu lieu à Busan. Plus de 1 000 bâtiments ont été incendiés et 7 000 personnes ont perdu leur maison à cause de l'incendie. En outre, plus de 3 500 objets de valeur, dont des portraits de rois coréens, ont été entièrement détruits par l'incendie."
 KOR_50s_flavor.21.d:0 "Donga-ilbo, l'un des principaux journaux de la République de Corée, a été suspendu par le ministère des Communiqués de presse après avoir publié un journal mal imprimé. Le journal mal imprimé utilisait des termes sensibles et dangereux tels que « permission de faire la queue à des hauts fonctionnaires fantoches ». Il est prévu que le gouvernement lève la suspension de Donga-ilbo le mois prochain."
 KOR_50s_flavor.22.d:0 "Park In-soo, un ancien marine de la République de Corée, a été arrêté pour avoir eu des liaisons avec plusieurs femmes. Park In-soo a eu des relations avec plusieurs femmes en se déguisant en officier de marine. Le premier procès a cependant abouti à une conclusion choquante, déclarant que Park In-soo est coupable de se faire passer pour un employé de l'État mais non coupable d'adultère. Le juge a même fait une remarque controversée selon laquelle la loi ne peut protéger que les femmes saines d'esprit et pures."
 KOR_50s_flavor.23.d:0 "La moralité du gouvernement de Syngman Rhee a de nouveau été gravement mise à mal en raison d'un scandale de corruption. Il a été révélé que le parti au pouvoir et le ministère de la Défense avaient profité de la vente illégale de coton brut à une entreprise papetière. Le coton brut était un produit d'aide américain pour la production de couvertures et de vêtements d'hiver pour les soldats de la République de Corée. Il est fort probable que ce crime ait été commis par le Parti libéral dans le but de lever des fonds politiques."
 KOR_50s_flavor.24.d:0 "Cho Byeong-gee, un ouvrier coréen venu sur l'île de Peleliu pour travailler pour la marine japonaise, est finalement rentré chez lui aujourd'hui. Cho Byeong-gee se cachait avec d'autres travailleurs coréens des Américains et des locaux, croyant qu'ils allaient le tuer, et a été arrêté après avoir volé de la nourriture à des civils. Après avoir été soigné par les autorités locales, Cho Byung-gee est arrivé au port de Busan par bateau et est retourné dans sa ville natale."
 KOR_50s_flavor.25.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque le prince Ui, l'un des fils du roi Gojong et militant indépendantiste, est décédé de causes naturelles. Pendant l'occupation japonaise de la Corée, le prince Ui a soutenu d'autres militants indépendantistes coréens par divers moyens et a même tenté de rejoindre le gouvernement provisoire coréen en exil, mais a échoué. Après la libération de la Corée, le prince Ui a vécu une vie difficile alors que sa nation tombait dans un état de guerre."
 KOR_50s_flavor.26.d:0 "Une société de presse appelée Daegu Maeil Newspaper a été attaquée par des gangs politiques soutenant le Parti libéral. Avant cet incident, le rédacteur principal du journal Daegu Maeil, Choi Seok-chae, avait publié un article critiquant l'administration Rhee pour avoir rassemblé des étudiants pour saluer un diplomate coréen par temps chaud. Cette décision a été considérée comme impardonnable par les gangs politiques de droite et les membres du Parti libéral. Bien que des membres des partis non gouvernementaux aient critiqué cette attaque, la police et les procureurs ont accusé Choi Seok-chae de violation de la loi sur la sécurité nationale."
 KOR_50s_flavor.27.d:0 "La première voiture fabriquée en Corée a été fabriquée en récupérant et en réassemblant des pièces de jeeps Willis MB jetées par l'armée américaine. Cette voiture de taxi s'appelait « Sibal », ce qui signifie un nouveau départ en coréen. Le taxi Sibal a été présenté pour la première fois lors d'une exposition industrielle organisée au palais Deoksugung à Séoul."
 KOR_50s_flavor.28.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Shin Ik-hui, le candidat présidentiel du Parti démocrate, est décédé des suites d'une maladie. Shin Ik-hui était bien connu pour être une figure de proue du mouvement indépendantiste coréen, prônant la démocratie et étant un rival sérieux de Syngman Rhee. Sans sa présence, il semble que Syngman Rhee remportera facilement les prochaines élections présidentielles."
 KOR_50s_flavor.29.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Rho Cheon-myeong, l'une des poètes coréennes les plus populaires des dernières décennies, est décédée des suites d'une maladie. Elle a écrit de nombreux poèmes célèbres, tels que Deer, Can't let go et As a Nameless Woman. Comme d'autres écrivains de l'époque, elle est également critiquée pour ses activités pro-japonaises pendant la Seconde Guerre mondiale. Après la libération de la Corée, elle a travaillé comme professeur d'université et journaliste."
 KOR_50s_flavor.30.d:0 "Un homme appelé Kang Seong-byeong a été arrêté pour s'être fait passer pour Lee Gang-seok, le fils adoptif du président Syngman Rhee. Kang Seong-byeong a reçu un traitement spécial de la part des autorités locales pendant trois jours jusqu'à ce que sa véritable identité soit révélée. Lors de son procès, Kang Seong-byeong a fait des blagues sarcastiques sur les crimes commis par le véritable Lee Gang-seok et sur la corruption des fonctionnaires du gouvernement."
 KOR_50s_flavor.31.d:0 "Aujourd'hui, la Société de langue coréenne a enfin achevé le projet Notre dictionnaire linguistique, qui durait depuis 30 ans. Pendant l'occupation japonaise de la Corée, les membres de la Société de langue coréenne ont étudié la langue coréenne et ont travaillé pendant des années à la création d'une série de dictionnaires. Beaucoup d'entre eux ont souffert de la répression de la police japonaise et certains sont même morts en prison. Grâce à l'achèvement du dictionnaire, de grands progrès ont été réalisés dans l'étude de la langue coréenne."
 KOR_50s_flavor.32.d:0 "Donga-ilbo, l'un des principaux journaux de la République de Corée, a été condamné à une amende pour avoir fait des blagues sarcastiques sur l'administration Syngman Rhee dans ses caricatures politiques. Le caricaturiste Kim Seong-hwan, qui a dessiné les scènes problématiques du dessin, a été arrêté par la police et condamné pour diffusion de fausses nouvelles et réalisation de profits illégaux. Malgré ce malheureux incident, il semble que Donga-ilbo continuera à publier des caricatures politiques."
 KOR_50s_flavor.33.d:0 "La République de Corée a été submergée par l'indignation du public lorsque des agents nord-coréens ont détourné un avion de ligne de la République de Corée appelé Changlang. Les pirates de l'air ont menacé le pilote et l'ont forcé à voler vers le nord et à atterrir à l'aéroport international de Pyongyang. Les passagers comprenaient trois étrangers, un colonel de l'armée de l'air de la République de Corée et un membre de l'Assemblée nationale. Après les pressions diplomatiques de plusieurs pays, le gouvernement nord-coréen a accepté de renvoyer les passagers. On estime que la Corée du Nord a détourné l'avion afin de se vanter de ses capacités politiques auprès de Zhou Enlai lors de sa prochaine visite à Pyongyang."
 KOR_50s_flavor.34.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Cha Il-hyeok, ancien combattant pour l'indépendance et officier de police renommé, est décédé dans un accident. Pendant l'occupation japonaise de la Corée, Cha Il-hyeok a rejoint la Force des volontaires coréens et s'est engagé dans plusieurs batailles contre l'armée japonaise. Après la libération de la Corée, Cha Il-hyeok est devenu un officier de police de haut rang et a joué un rôle majeur dans les opérations de contre-guérilla de la République de Corée."
 KOR_50s_flavor.35.d:0 "Aujourd'hui, le Président Syngman Rhee de la République de Corée a visité la République du Vietnam et a eu une réunion avec le Président Ngo Dinh Diem. Durant son séjour au Sud-Vietnam, Syngman Rhee a reçu un diplôme honorifique de l'Université de Saigon et a eu un entretien avec des journalistes vietnamiens. Il semble que les relations amicales entre la République de Corée et le Sud-Vietnam seront encore renforcées pour refléter l'évolution de la situation internationale."
 KOR_50s_flavor.36.d:0 "De nombreux citoyens ont été frappés par le choc en République de Corée lorsque le lieutenant-général Jeong Gu-heon a tué le général de brigade Seo Jeong-cheol. Après avoir tué son supérieur, Jeong Gu-heon s'est rendu au Service d'enquête spécial et a été condamné à mort lors d'un procès militaire. La violence répandue au sein de l'armée de la République de Corée est pointée du doigt comme l'une des causes de cet incident."
 KOR_50s_flavor.37.d:0 "Kyunghyang-shinmun, l'un des principaux journaux de la République de Corée, a été suspendu par le ministère des Communiqués de presse après avoir publié un article critiquant sévèrement la situation politique actuelle de la République de Corée. L'administration de Syngman Rhee a tenté de fermer complètement la société de presse, mais le système judiciaire de la République de Corée a décidé de suspendre Kyunghyang-shinmun. Il est prévu que la suspension ne soit levée qu'à la fin du régime de Syngman Rhee."
 KOR_50s_flavor.38.d:0 "De nombreux citoyens ont été frappés par le chagrin en République de Corée lorsque Woo Jang-choon, biologiste renommé et directeur de l'Institut coréen des sciences agricoles, est décédé des suites d'une maladie. Pendant l'occupation japonaise de la Corée, Woo Jang-choon a étudié la biologie et a découvert le concept d'hybridation interspécifique pour la première fois au monde. Après la libération de la Corée, Woo Jang-choon a développé diverses nouvelles cultures pour la République de Corée et a reçu la médaille d'honneur du gouvernement de la République de Corée."
 KOR_50s_flavor.39.d:0 "De nombreux citoyens des régions méridionales de la République de Corée ont commencé à évacuer leurs maisons alors qu'un typhon destructeur appelé Sarah a atteint les côtes de la République de Corée. La tempête a complètement détruit de nombreux bâtiments et plusieurs villages et fait de nombreuses victimes. Les pluies typhons et les inondations ont également laissé des centaines de milliers de personnes sans abri."
 KOR_50s_flavor.40.d:0 "De nombreux citoyens ont été plongés dans un état de choc aujourd'hui lorsque Lee Yu-rip et d'autres personnalités royalistes ont été arrêtés par les autorités de la République de Corée. Il s'est avéré que Lee Yu-rip et ses hommes ont formé un complot visant à renverser le régime de Syngman Rhee et à restaurer le régime dynastique en Corée, tentant même de contacter les membres royaux restants de la dynastie Lee. On estime que l'attitude hostile du gouvernement de Syngman Rhee à l'égard des descendants royaux ne fera que se renforcer."
 KOR_50s_flavor.41.d:0 "Aujourd'hui, de nombreux citoyens de la République de Corée ont été choqués d'apprendre l'histoire déconcertante d'une réunion clandestine qui aurait eu lieu à New Delhi l'année dernière. L'incident a commencé avec la révélation inattendue par un législateur de la prétendue réunion secrète entre l'éminente figure de l'opposition Shin Ik-hui et Cho So-ang, homme politique de la République de Corée kidnappé par la Corée du Nord pendant la guerre de Corée. Le législateur a affirmé que Shin Ik-hui et Cho So-ang avaient comploté ensemble la réunification de la Corée par un tiers autre que Syngman Rhee et Kim Il-sung. Bien que Shin Ik-hui et son parti aient rapidement dénoncé ces allégations comme étant une conspiration sans fondement, le parti au pouvoir a déjà exploité cette opportunité pour semer la peur au sein de la société coréenne."
 KOR_50s_flavor.42.d:0 "Kim Dong-jin, ancien membre du gang politique pro-Rhee, a été abattu par des gangsters dans le cinéma Danseongsa. Il a été blessé par balle et bénéficie de soins médicaux de longue durée. Avant la fusillade, Kim avait divulgué à la presse que le chef du gang avait donné l'ordre de lancer des attaques terroristes contre des personnalités clés des partis non gouvernementaux, notamment Shin Ik-hui et Cho Pyung-ok. Cette attaque, vraisemblablement ordonnée par le chef du gang Lee Jeong-jae, semble être une tentative de faire taire les personnalités opposées au sein du gang politique."
 KOR_50s_flavor.43.d:0 "Aujourd'hui, le gouvernement de la République de Corée et les autorités américaines ont décidé de placer en adoption les enfants métis nés pendant la guerre de Corée et de les confier à des familles américaines. Certains ont exprimé leurs inquiétudes face à cette politique, car les enfants qui ont déjà un parent coréen dont ils doivent s'occuper sont également proposés à l'adoption internationale. De nombreuses agences de garde d'enfants et organisations caritatives ont proposé leur aide dans le processus d'adoption."
 KOR_50s_flavor.44.d:0 "Fujii Hideto, un civil japonais qui a servi dans l'armée nord-coréenne et dans l'armée de la République de Corée pendant la guerre de Corée, est finalement rentré chez lui aujourd'hui. Contrairement à d'autres civils japonais qui sont rentrés au Japon très tôt, Fujii Hideto vivait en Corée même après sa libération et a été enrôlé par l'armée populaire coréenne au début de la guerre de Corée. Après avoir été capturé par les forces de l'ONU et envoyé à Koje P.O.W. Camp, il a révélé son identité japonaise et a demandé à retourner dans son pays natal mais a été refusé. Il a été pris pour un insoumis et a dû servir dans l'armée de la République de Corée après sa libération du camp de Koje. Pendant ses vacances, Fujii a contacté le ministère des Affaires étrangères de la République de Corée et a été autorisé à retourner au Japon un an plus tard."
 KOR_50s_flavor.45.d:0 "Une décision prise aujourd'hui par le gouvernement de la République de Corée concernant sa politique financière a choqué de nombreux investisseurs et dévasté le marché obligataire. En 1957, le gouvernement a annulé sa décision de ne plus octroyer de fonds gouvernementaux pour l'anniversaire de la Fondation nationale. Depuis lors, de nombreux investisseurs et sociétés de bourse ont rendu le marché obligataire coréen très instable en se livrant à des ventes et des achats à découvert. En conséquence, le gouvernement de la République de Corée a décidé de mettre fin aux troubles en annulant entièrement les fonds publics, ce qui a été un coup catastrophique pour les investisseurs."
 KOR_50s_flavor.46.d:0 "L'image de l'Union des résidents coréens au Japon et du gouvernement de la République de Corée a été ternie aujourd'hui lorsque les autorités japonaises ont arrêté des agents présumés de la République de Corée et découvert des explosifs dans leurs bagages. Les suspects ont été arrêtés après que des civils japonais les ont dénoncés à la police pour leurs conversations suspectes. Après avoir interrogé les coupables, la police japonaise a révélé qu'elle prévoyait de bombarder le centre de la Croix-Rouge dans la préfecture de Niigata. Le but de ce complot était d'arrêter la réinstallation des Japonais-Coréens en Corée du Nord."
 #60s
 KOR_60s_flavor.1.d:0 "De nombreux citoyens ont été frappés par le choc et le chagrin en République de Corée lorsqu'une bousculade à la gare de Séoul a tué et blessé plusieurs personnes. L'accident s'est produit alors que de nombreuses personnes se précipitaient pour monter dans le train et glissaient dans les escaliers du quai. La mauvaise gestion générale de la politique relative aux passagers et le manque de chauffage sont pointés comme les principales causes de l'accident."