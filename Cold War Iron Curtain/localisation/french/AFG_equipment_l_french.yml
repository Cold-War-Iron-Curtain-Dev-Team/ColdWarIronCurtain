 AFG_mbt_equipment_0:0 "T-34-85"
 AFG_mbt_equipment_0_short:0 "T-34-85"
 AFG_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et est bien connu pour sa fiabilité. Le T-34 a été conçu en 1940 par le KMBD en Union soviétique. Dans le but de réduire les coûts, le blindage incliné a été introduit dans la conception du char. Cependant, cela a également permis au réservoir lui-même de devenir bien mieux protégé et moins coûteux avec une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité de transport de munitions nominale. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait difficile le fonctionnement des commandants de char et leur faible capacité de coordination réduisait de nombreux avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays les plus pauvres."
 AFG_mbt_equipment_1:0 "T-34-85M"
 AFG_mbt_equipment_1_short:0 "T-34-85M"
 AFG_mbt_equipment_1_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et est bien connu pour sa fiabilité. Le T-34 a été conçu en 1940 par le KMBD en Union soviétique. Dans le but de réduire les coûts, le blindage incliné a été introduit dans la conception du char. Cependant, cela a également permis au réservoir lui-même de devenir bien mieux protégé et moins coûteux avec une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité de transport de munitions nominale. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait difficile le fonctionnement des commandants de char et leur faible capacité de coordination réduisait de nombreux avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays les plus pauvres."
 AFG_mbt_equipment_2:0 "T-54"
 AFG_mbt_equipment_2_short:0 "T-54"
 AFG_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 AFG_mbt_equipment_3:0 "T-55"
 AFG_mbt_equipment_3_short:0 "T-55"
 AFG_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 AFG_mbt_equipment_4:0 "T-62"
 AFG_mbt_equipment_4_short:0 "T-62"
 AFG_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 AFG_mbt_equipment_5:0 "T-62M"
 AFG_mbt_equipment_5_short:0 "T-62M"
 AFG_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 AFG_mbt_equipment_6:0 "T-62M1"
 AFG_mbt_equipment_6_short:0 "T-62M1"
 AFG_mbt_equipment_6_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "

