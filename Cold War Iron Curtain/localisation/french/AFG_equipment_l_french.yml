 ### Jet CAS
 AFG_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 AFG_jet_CAS_equipment_1_desc:0 "Le Yakovlev Yak-23 Flora était un avion d'attaque au sol de conception soviétique introduit en 1949. L'avion était un développement du chasseur à réaction Yak-15. Le Yak-23 était principalement exporté vers les pays du pacte de Varsovie, où il resta en service jusqu'à la fin des années 1950."
 AFG_jet_CAS_equipment_1_short:0 "IL-10M"
 AFG_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 AFG_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 AFG_jet_CAS_equipment_2_short:0 "MiG-17bis"
 AFG_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 AFG_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 AFG_jet_CAS_equipment_3_short:0 "MiG-19S"
 AFG_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 AFG_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 AFG_jet_CAS_equipment_4_short:0 "Su-7B"
 AFG_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 AFG_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 AFG_jet_CAS_equipment_5_short:0 "Su-7BKL"
 AFG_jet_CAS_equipment_6:0 "Soukhoï Su-22M4"
 AFG_jet_CAS_equipment_6_short:0 "Su-22M4"
 AFG_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 AFG_jet_CAS_equipment_7:0 "Soukhoï Su-22M4K"
 AFG_jet_CAS_equipment_7_short:0 "Su-22M4K"
 AFG_jet_CAS_equipment_7_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 AFG_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 AFG_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."
