##Afghan Air Forces
 AFG_fighter_equipment_0:0 "Force aérienne afghane"
 AFG_fighter_equipment_0_short:0 "FAA"
 AFG_fighter_equipment_0_desc:0 "La Royal Afghan Air Force a été créée en 1921 sous le règne du roi Amanullah et considérablement modernisée par le roi Zahir Shah dans les années 1960. Au cours des années 1980, l'Union soviétique a créé l'armée de l'air afghane, d'abord dans le but de vaincre les moudjahidines et dans l'espoir qu'une forte puissance aérienne afghane préserverait le gouvernement pro-soviétique de Mohammad Najibullah"

 AFG_fighter_equipment_1:0 "Yakolev Yak-3"
 AFG_fighter_equipment_1_short:0 "Yak-3"
 AFG_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
 AFG_fighter_equipment_2:0 "Lavotchkine La-7"
 AFG_fighter_equipment_2_short:0 "La-7"
 AFG_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 AFG_fighter_equipment_3:0 "Lavotchkine La-9"
 AFG_fighter_equipment_3_short:0 "La-9"
 AFG_fighter_equipment_3_desc:0 "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

 AFG_jet_multirole_equipment_1:0 "Mikoyan-Gourevitch MiG-9"
 AFG_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
 AFG_jet_multirole_equipment_1_short:0 "MiG-9"
 AFG_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 AFG_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 AFG_jet_multirole_equipment_2_short:0 "MiG-15"
 AFG_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 AFG_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 AFG_jet_multirole_equipment_3_short:0 "MiG-17"
 AFG_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 AFG_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 AFG_jet_multirole_equipment_4_short:0 "MiG-19"
 AFG_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 AFG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 AFG_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 AFG_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 AFG_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 AFG_jet_multirole_equipment_6_short:0 "MiG-21PF"
 AFG_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-21bis"
 AFG_jet_multirole_equipment_7_short:0 "MiG-21bis"
 AFG_jet_multirole_equipment_7_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés au PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI (\"Fishbed-L\"), tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS (\"Fishbed-N\")."
 #AFG_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 #AFG_jet_multirole_equipment_8_desc:0 "The early "Flogger" variants had a number of design shortcomings, including airframe strength and reliability, engine performance, maneuverability and radar performance. A considerable redesign of the airframe was conducted, resulting in the MiG-23ML."
 #AFG_jet_multirole_equipment_8_short:0 "MiG-23ML"
 #AFG_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 #AFG_jet_multirole_equipment_9_desc:0 "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 #AFG_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 #AFG_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 #AFG_jet_multirole_equipment_10_desc:0 "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 #AFG_jet_multirole_equipment_10_short:0 "MiG-29A"

