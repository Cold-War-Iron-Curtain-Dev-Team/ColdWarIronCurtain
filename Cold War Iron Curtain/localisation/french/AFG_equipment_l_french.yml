 #Jet light
 
 AFG_jet_light_equipment_1:0 "Yakovlev Yak-11"
 AFG_jet_light_equipment_1_short:0 "Yak-11"
 AFG_jet_light_equipment_1_desc:0 "Le Yak-11 est entré en service en 1947, servant d'entraîneur avancé standard auprès des forces aériennes soviétiques et de la DOSAAF. Les Yak-11 et C-11 ont été utilisés dans tous les pays du Pacte de Varsovie et exportés vers dix-huit pays, dont de nombreux pays d'Afrique, du Moyen-Orient et d'Asie."
 AFG_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 AFG_jet_light_equipment_2_short:0 "MiG-15UTI"
 AFG_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 AFG_jet_light_equipment_3:0 "L-29 Delfin"
 AFG_jet_light_equipment_3_short:0 "L-29 Delfin"
 AFG_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 AFG_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 AFG_jet_light_equipment_4_short:0 "L-39 Albatros"
 AFG_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 AFG_jet_light_equipment_5:0 "Aéro L-39ZA Albatros"
 AFG_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 AFG_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."

 AFG_recon_equipment_0:0 "Tupolev Tu-2R"
 AFG_recon_equipment_0_short:0 "Tu-2R"
 AFG_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 AFG_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 AFG_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 AFG_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 AFG_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-21R-13"
 AFG_jet_recon_equipment_1_short:0 "MiG-21R-13"
 AFG_jet_recon_equipment_1_desc:0 "Initialement désigné Izdeliye 03 pour confondre les étrangers, la désignation officielle de « type » du MiG-21R était Izdeliye 94R. La première unité de production a été déployée au début de 1966 et la production s'est poursuivie jusqu'en 1971. Pour les missions de reconnaissance, le MiG-21R pouvait transporter un pod PHOTINT de jour de type D, un pod PHOTINT de nuit de type N, un pod ELINT à usage général de type R ou un pod de type T abritant un système de télévision, faisant du MiG-21R l'un des premiers avions de reconnaissance soviétiques à utiliser l'équipement ELINT. De petits changements ont été apportés tout au long du cycle de production."
 #AFG_jet_recon_equipment_2:0 ""
 #AFG_jet_recon_equipment_2_short:0 ""
 #AFG_jet_recon_equipment_2_desc:0 ""

 #Tactical bombers

 AFG_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 AFG_jet_tac_bomber_equipment_2_short:0 "Il-28"
 AFG_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 
