 MBZ_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 MBZ_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 MBZ_jet_multirole_equipment_2_short:0 "MiG-15"
 MBZ_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 MBZ_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 MBZ_jet_multirole_equipment_3_short:0 "MiG-17"
 MBZ_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 MBZ_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 MBZ_jet_multirole_equipment_4_short:0 "MiG-19"
 #MBZ_jet_multirole_equipment_5:0 ""
 #MBZ_jet_multirole_equipment_5_desc:0 "" 
 MBZ_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21MF"
 MBZ_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 MBZ_jet_multirole_equipment_6_short:0 "MiG-21MF"
 MBZ_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-21bis"
 MBZ_jet_multirole_equipment_7_short:0 "MiG-21bis"
 MBZ_jet_multirole_equipment_7_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés au PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI (\"Fishbed-L\"), tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS (\"Fishbed-N\")."

 MBZ_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 MBZ_jet_light_equipment_2_short:0 "MiG-15UTI"
 MBZ_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 MBZ_jet_light_equipment_3:0 "L-29 Delfin"
 MBZ_jet_light_equipment_3_short:0 "L-29 Delfin"
 MBZ_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 MBZ_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 MBZ_jet_light_equipment_4_short:0 "L-39 Albatros"
 MBZ_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."

