 #Mozambique infantry equipment
 MBZ_infantry_equipment_0:0 "Mousqueton 98k Espingarda 8 mm Mauser m/938"
 MBZ_infantry_equipment_0_short:0 "Mauser m/938"
 MBZ_infantry_equipment_0_desc:0 "Le Mauser-Vergueiro était un fusil à verrou, conçu en 1904 par José Alberto Vergueiro, un officier d'infanterie de l'armée portugaise, et fabriqué par Deutsche Waffen und Munitionsfabriken (DWM). Il a été développé à partir du fusil Mauser 98 avec l'introduction d'un nouveau système de verrou dérivé du Gewehr 1888 et du Mannlicher - Schönauer. En dehors du Portugal, l'arme était également connue sous le nom de Mauser portugais."

 MBZ_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 MBZ_infantry_equipment_1_short:0 "AK-47"
 MBZ_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 MBZ_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 MBZ_infantry_equipment_2_short:0 "AKM"
 MBZ_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

########## NEW MBZ ARMOR

 MBZ_mbt_equipment_2:0 "T-54"
 MBZ_mbt_equipment_2_short:0 "T-54"
 MBZ_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 MBZ_mbt_equipment_3:0 "T-55"
 MBZ_mbt_equipment_3_short:0 "T-55"
 MBZ_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "

