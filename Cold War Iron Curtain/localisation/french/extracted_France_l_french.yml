 FRA_FP.15.t:0 "État des lieux sur l'Extrême-Orient"
 FRA_FP.16.a:0 "Cherchez un logement avec Pékin. Facilitez la confrontation."
 FRA_FP.16.b:0 "Dites à Pékin de suspendre son aide au Viet Minh."
 FRA_FP.16.d:0 "Suite à la reconnaissance française de la République populaire de Chine, le Quai d'Orsay a ouvert des discussions avec Zhou Enlai sur les relations entre les deux pays. L'assistance chinoise au Viet Minh reste le principal différend. Les approvisionnements franchissant la frontière renforcent les forces combattant le corps expéditionnaire français et donnent à Pékin un intérêt direct dans toute implantation indochinoise.\n\nUn accommodement pourrait améliorer les relations et réduire le risque d'une confrontation plus large, même si de meilleures relations diplomatiques ne mettraient pas fin, à elles seules, au soutien chinois au Viet Minh. Une demande formelle de mettre fin à ce soutien maintiendrait la position française en Indochine, au prix de contrarier Pékin.\n\nLe gouvernement français doit déterminer si ces négociations doivent viser à un accord plus large ou faire de l'aide chinoise au Viet Minh le point de discorde immédiat."
 FRA_FP.16.t:0 "Pourparlers diplomatiques franco-chinois"
 FRA_FP.17.a:0 "Refusez la demande française. Nous ne fournirons pas cette campagne."
 FRA_FP.17.b:0 "Agréer les fusils et les camions pour le CEFEO."
 FRA_FP.17.t:0 "Une demande française d'intervention en Indochine"
 FRA_FP.17.d:0 "La France a demandé du matériel militaire américain pour le Corps expéditionnaire français en Extrême-Orient. L'envoi proposé comprend des fusils et des camions destinés aux forces combattant le Viet Minh ; il ne prévoit pas le déploiement de troupes de combat américaines.\n\nLes partisans de l'assistance à Washington soutiennent que le fait de maintenir le corps expéditionnaire approvisionné renforcerait la position militaire française et donnerait aux États-Unis une plus grande influence sur un règlement négocié. Les opposants préviennent que l'approvisionnement de la campagne associerait plus étroitement la politique américaine aux intérêts coloniaux français et susciteraient de nouvelles demandes à mesure que la guerre se poursuivrait.\n\nParis considère cette demande comme un test du soutien américain. Un refus nuirait aux relations et affaiblirait la confiance des Français dans le maintien de leur engagement expéditionnaire. L'administration doit peser ces conséquences par rapport aux obligations que pourrait entraîner une aide supplémentaire."
 FRA_FP.2.a:0 "L'aide française doit être étendue... à tous les territoires de la Fédération"
 FRA_FP.2.t:0 "La formalisation de l'Union française : la France métropolitaine et ses domaines unis"
 FRA_FP.3.a:0 "Ces terres seront gardées et étudiées pour toute la France !"
