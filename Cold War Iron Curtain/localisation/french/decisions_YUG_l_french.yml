YUG_informbiro: "Les luttes d'Informbiro"
YUG_informbiro_desc: "§Y\"Ils diront toujours : nous n'autoriserons pas l'ingérence dans les affaires de notre pays pour lequel nous sommes prêts à nous battre à nouveau si nécessaire\" \nJosip Broz Tito, 1948§!\n\nMalheureusement pour les travailleurs yougoslaves, ils se trouvent une fois de plus dans une situation où la guerre pourrait survenir et les hanter à nouveau. La cause de cette inquiétude est la scission §YTito-Staline§! en 1948, dans laquelle la nation yougoslave et son Parti communiste, n'ayant jamais été dépendants du soutien soviétique dans la §YGuerre de libération nationale§! et menant en tant que tels une politique étrangère nettement plus indépendante, ont été expulsés lors du Kominform §Y1948.§! réunion de l'Union soviétique et de ses alliés. Ce qui a suivi a été l'isolement diplomatique total du bloc de l'Est et un blocus qui a paralysé encore davantage l'économie yougoslave déjà déchirée par la guerre.\n\nC'est donc sans surprise que notre gouvernement est non seulement menacé d'une §Yinvasion étrangère§! mais aussi d'un potentiel §Ycoup d'État§! de la part des sympathisants cominformistes (comme tenté un an auparavant) découlant d'un hypothétique §Yeffondrement économique§!. Par conséquent, il est de la plus haute importance de garantir que, afin d'éviter un tel effondrement de notre nation agraire, nous devons veiller à ce que §Yaucune famine ne frappe nos terres§! (§OStabilité alimentaire§!) En plus de cela, nous devons garder notre armée prête en cas d' §Yune éventuelle incursion stalinienne en Yougoslavie.§! (§gÉtat de préparation de l'armée§!) Enfin, notre §YAppareil de sécurité de l'État§! doit nous rester fidèle afin que nous ne succombions pas de l'intérieur. (§CStabilité interne§!)"
