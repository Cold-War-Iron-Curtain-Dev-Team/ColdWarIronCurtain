YUG_ethnicity_opinion: "L'expérience multiculturelle « Jugoslavija »"
YUG_ethnicity_opinion_desc: "§Y\"Nous avons versé des mers de sang pour la fraternité et l'unité de nos peuples et nous ne permettrons à personne d'y toucher ou de la perturber de l'intérieur, pour ruiner cette fraternité et cette unité.\" \nJosip Broz Tito, 1962 §!\n\nL'aspect le plus fascinant de la Yougoslavie est peut-être son absence flagrante d'État-nation. Les habitants de cette terre peuvent être classés comme Slaves du Sud, mais ils sont néanmoins plus liés à leur nationalité qu'à toute autre chose. De plus, la Guerre de libération nationale a laissé des cicatrices, notamment entre Serbes et Croates.  \n Si une nationalité trop influente devenait mécontente du gouvernement, les conséquences pourraient conduire à une catastrophe nationale.\n\n"
