l_french:
 Ayub_Constitution.1.d:0 "La première expérience démocratique au Pakistan a abouti à l'instabilité, à la corruption et à la stagnation. Le peuple n'a pas développé l'éducation ni la maturité politique nécessaires à la démocratie. Le Pakistan a donc besoin d'un leadership fort, ce que la Commission Shahabuddin a recommandé dans son rapport. Avec une Constitution présidentielle, le président Ayub Khan peut fournir au Pakistan le leadership fort et discipliné dont il a besoin pour occuper la place qui lui revient dans le monde."
