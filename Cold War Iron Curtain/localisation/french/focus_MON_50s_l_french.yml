 MON_The_Stalin_of_Mongolia:0 "Le Staline de Mongolie"
 MON_The_Stalin_of_Mongolia_desc:0 "Choibalsan mérite à juste titre le surnom de Staline de Mongolie. Choibalsan a supervisé les purges ordonnées par les Soviétiques à la fin des années 1930, qui ont entraîné la mort d'environ 35 000 Mongols. La plupart des victimes étaient des membres du clergé bouddhiste, de l'intelligentsia, des dissidents politiques, des Bouriates et des Kazakhs et d'autres « ennemis de la révolution ». Bien que le dévouement de Choibalsan envers Staline ait contribué à préserver l'indépendance naissante de son pays au cours des premières années de son règne, il a également lié étroitement la Mongolie à l'Union soviétique."
