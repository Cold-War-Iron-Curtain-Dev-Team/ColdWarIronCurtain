 MON_Accension_of_Yumjaagiin_Tsedenbal:0 "Adhésion de Yumjaagiin Tsedenbal"
 MON_Accension_of_Yumjaagiin_Tsedenbal_desc:0 "Yumjaagiin Tsedenbal est en politique depuis 1939, d'abord en tant que vice-ministre, puis en tant que ministre des Finances de 1939 à 1940. De plus, il était à cette époque gouverneur de la Banque de Mongolie. En 1940, lors du 10e congrès du Parti révolutionnaire du peuple mongol, il devient secrétaire général du parti à l'âge de 23 ans. Et aujourd'hui, après la mort de Choibalsan, il est également président du Conseil des ministres."
