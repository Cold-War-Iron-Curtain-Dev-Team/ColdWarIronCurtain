 Piano_Solo.1.d:0 "Suite aux positions socialistes et communistes contre le gouvernement ainsi qu'aux grèves et attaques répétées contre les fonctionnaires et les piétons, les Carbinieri ont jugé bon de mettre le pays sous leur gouvernance pour le moment, avec la promesse d'un éventuel retour à la démocratie."
 Piano_Solo.2.d:0 "Suite aux postures socialistes et communistes contre le gouvernement italien, ainsi qu'aux grèves et attaques répétées contre des fonctionnaires et des piétons, la gendarmerie nationale italienne a jugé bon de placer le pays sous sa gouvernance pour le moment, avec la promesse d'un éventuel retour à la démocratie."
