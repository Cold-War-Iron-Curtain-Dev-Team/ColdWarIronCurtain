#### The Road to Sam Neua (March 1953) ####
 VINLAO.10.t:0 "La route vers Sam Neua"
 VINLAO.10.d:0 "Le Parti a une décision à prendre concernant le Laos, et elle doit être prise maintenant, alors que dure la saison sèche et que les Français sont toujours retenus dans le delta.\n\nLes cadres du Pathet Lao sont prêts. Sam Neua peut être prise et un gouvernement libéré peut y être proclamé dans un délai d'un mois. Mais les montagnes à l'est du Mékong dévorent les armées, nos lignes de ravitaillement parcourraient trois cents kilomètres sur des pistes de chèvres, et le Royaume ne sera pas seul : Paris transportera par avion tout ce qu'il peut vers Vientiane et Luang Prabang dès le premier coup de feu.\n\nL'alternative est la patience : armer les cadres, les laisser à l'intérieur du Royaume et laisser le mouvement grandir là où il se trouve déjà."
 VINLAO.10.a:0 "Traversez la frontière. Proclamez la zone libérée à Sam Neua."
 VINLAO.10.b:0 "Aucune invasion. Construisez le mouvement à l'intérieur du Royaume."
 VINLAO.10.c:0 "Pas cette saison. Revisitez-le avant la conférence."
 VINLAO.11.t:0 "Le mouvement grandit sur place"
 VINLAO.11.d:0 "Aucune colonne ne traverse la chaîne annamite. Au lieu de cela, les fusils, les cadres et les presses à imprimer se dirigent tranquillement vers l'ouest, et le Pathet Lao passe l'année à faire ce qu'une insurrection fait de mieux : recruter dans les villages que les responsables du royaume ne visitent jamais.\n\nVientiane le sait. Vientiane ne peut pas le prouver et ne peut pas atteindre les districts où cela se produit.\n\nLorsque les diplomates s'assoiront, le Pathet Lao ne détiendra pas de capitale - mais il détiendra quelque chose de plus difficile à négocier que le territoire."
 VINLAO.11.a:0 "La révolution n'est pas pressée."
 VINLAO.12.t:0 "Laos, avant la conférence"
 VINLAO.12.d:0 "La saison que nous avions reportée est revenue et les diplomates commencent à parler d'une conférence. Tout ce que nous détenons au Laos lorsqu'ils s'assoient, c'est ce que nous serons autorisés à conserver.\n\nLa fenêtre se ferme. Si Sam Neua doit être emmené, il doit l'être maintenant."
 VINLAO.12.a:0 "Partez maintenant, avant que la table ne soit mise."
 VINLAO.12.b:0 "Laissez-le reposer. Les cadres suffisent."
 VINLAO.13.t:0 "Nos camarades laotiens rejoignent la bataille"
 VINLAO.13.d:0 "Dien Bien Phu se trouve à trente kilomètres de la frontière laotienne, et aucun personnel à Hanoi ne connaît ces collines comme les Pathet Lao les connaissent. Le message est allé vers l'ouest le jour où la campagne a été décidée. La réponse est tombée avant la nuit.\n\nLes bataillons qui ont passé cette guerre à combattre l'armée royale au nord remontent déjà le Nam Ou, en passant par Sop Nao et Muang Khoua, sur les mêmes pistes que leurs pères utilisaient pour le commerce du sel. Derrière eux viennent les colonnes de porteurs, et derrière celles-ci le riz et les coquillages qu'il faut porter à la main sur le dernier tronçon car rien sur roues ne rentre dans ce bassin.\n\nQuoi que les Français aient afflué dans la vallée, celle-ci est désormais assiégée par deux mouvements et non un seul. La guerre du Laos et la guerre du Tonkin n'ont jamais été des guerres distinctes. Ils sont sur le point d'être combattus au même endroit."
 VINLAO.13.a:0 "Deux rivières, un courant."
