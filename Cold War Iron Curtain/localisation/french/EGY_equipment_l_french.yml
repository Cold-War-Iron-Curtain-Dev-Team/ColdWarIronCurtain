l_french:

 #Infantry weapons
 EGY_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 EGY_infantry_equipment_0_short:0 "SMLE n°4"
 EGY_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 EGY_infantry_equipment_1:0 "Maadi Hakim"
 EGY_infantry_equipment_1_short:0 "Maadi Hakim"
 EGY_infantry_equipment_1_desc:0 "Le fusil Hakim est un fusil semi-automatique fonctionnant au gaz. Il a été conçu à l'origine par la Suède et produit sous le nom d'Ag m/42 pour l'armée suédoise. L'outillage et la conception ont ensuite été vendus en Égypte, et le Hakim y a été produit dans les années 1950 et au début des années 1960."

 EGY_infantry_equipment_2:0 "Maadi Misr"
 EGY_infantry_equipment_2_short:0 "Maadi Misr"
 EGY_infantry_equipment_2_desc:0 "Le Misr est une copie de l'AKM russe. Le Misr est doté d'une crosse en bois ou pliable latéralement. L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959."

 EGY_infantry_equipment_3:0 "Maadi ARM"
 EGY_infantry_equipment_3_short:0 "Maadi ARM"
 EGY_infantry_equipment_3_desc:0 "Le Maadi ARM est une copie égyptienne sous licence du fusil d'assaut russe AKM. L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959."

 EGY_infantry_equipment_4:0 "Avtomat Kalachnikova 101"
 EGY_infantry_equipment_4_short:0 "AK-101"
 EGY_infantry_equipment_4_desc:0 "L'AK-101 est un fusil d'assaut de la série Kalachnikov. L'AK-101 est conçu pour le marché mondial d'exportation, utilisant la cartouche standard OTAN de 5,56 x 45 mm. L'AK-101 est commercialisé auprès de ceux qui recherchent une arme combinant la compatibilité logistique et la familiarité de la cartouche OTAN de 5,56 × 45 mm avec la fiabilité d'une Kalachnikov. La conception de ce fusil est similaire à celle de l'AK-74."
 
 #Tanks
 EGY_lt_equipment_1:0 "Carro Armato M13/40"
 EGY_lt_equipment_1_short:0 "M13/40"
 EGY_lt_equipment_2:0 "Criquet M22"
 EGY_lt_equipment_2_short:0 "Criquet M22"
 EGY_lt_equipment_3:0 "PT-76"
 EGY_lt_equipment_3_short:0 "PT-76"
 EGY_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 EGY_lt_equipment_4:0 "PT-76B modèle 4"
 EGY_lt_equipment_4_short:0 "PT-76B"
 EGY_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'), du système de protection NBC PAZ (protivo-atomnaya zashchita), d'un système d'extinction automatique d'incendie, d'un viseur TShK-2-66 amélioré, d'un système de filtration-ventilation, de dispositifs d'observation améliorés, d'un système électrique amélioré. équipement, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."

