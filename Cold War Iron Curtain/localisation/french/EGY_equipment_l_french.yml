 EGY_transport_plane_equipment_5_desc:0 "Le de Havilland Canada DHC-5 Buffalo est un avion de transport utilitaire à turbopropulseur à décollage et atterrissage courts (STOL) développé à partir du précédent DHC-4 Caribou à pistons. L'avion a des performances STOL extraordinaires et est capable de décoller sur des distances beaucoup plus courtes que ce que même la plupart des avions légers peuvent gérer. "
