 #Attack
 EGY_attack_helicopter_equipment_3:0 "Mil Mi-25"
 EGY_attack_helicopter_equipment_3_short:0 "Mil Mi-25"
 EGY_attack_helicopter_equipment_3_desc:0 "La version d'exportation du Mi-24D. (Hind-D) Le Mi-24D a été conçu pour être un vaisseau de combat plus pur que les variantes précédentes. Il est entré en production en 1973. Le Mi-24D possède un fuselage avant redessiné, avec deux cockpits séparés pour le pilote et le tireur. Il est armé d'une seule mitrailleuse Yak-B à quatre canons de 12,7 mm sous le nez. Il peut également transporter quatre nacelles de roquettes de 57 mm, quatre missiles antichar SACLOS 9M17 Phalanga (une amélioration significative par rapport au système MCLOS du Mi-24A), ainsi que des bombes et d'autres armes."
 EGY_attack_helicopter_equipment_4:0 "McDonnell Douglas AH-64D Apache"
 EGY_attack_helicopter_equipment_4_short:0 "AH-64D Apache"
 EGY_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, en plus de sa superbe maniabilité, cette variante est livrée sans le radar Longbow, mais elle pourrait être appelée « Longbowless Delta » et n'est pas connue sous le nom d'« Apache Longbow ». Même s'il est livré sans ce système radar, il s'agit toujours d'une variante entièrement améliorée."

