 EGY_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 EGY_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 EGY_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains en plus des porte-avions. Cette portabilité a prolongé la carrière du « Seasprite » et des variantes améliorées ont existé. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 EGY_naval_helicopter_equipment_4:0 "Westland Sea King Mk.47"
 EGY_naval_helicopter_equipment_4_short:0 "Sea King Mk.47"
 EGY_naval_helicopter_equipment_5:0 "Kaman SH-2G Super Seasprite"
 EGY_naval_helicopter_equipment_5_short:0 "SH-2G Super Seasprite"
 EGY_naval_helicopter_equipment_5_desc:0 "Le Kaman SH-2G Super Seasprite est un hélicoptère naval américain doté d'une capacité anti-sous-marine et anti-menace de surface, y compris un ciblage au-dessus de l'horizon. Cet avion étend et augmente les capacités des capteurs et des armes embarqués contre plusieurs types de menaces ennemies, notamment les sous-marins de tous types, les navires de surface et les patrouilleurs pouvant être armés de missiles anti-navires. Il a été initialement développé pour la marine américaine dans les années 1980 en tant que version remotorisée de l'ancien Kaman SH-2 Seasprite."
