 EGY_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 EGY_jet_tac_bomber_equipment_2_short:0 "Il-28"
 EGY_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 EGY_jet_tac_bomber_equipment_3:0 "Iliouchine Il-28P"
 EGY_jet_tac_bomber_equipment_3_short:0 "Il-28P"
 EGY_jet_tac_bomber_equipment_3_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 
 #Strategic bomber
 EGY_strat_bomber_equipment_1:0 "Handley Page Halifax"
 EGY_strat_bomber_equipment_1_short:0 "Halifax"
 EGY_strat_bomber_equipment_2:0 "Avro Lancaster"
