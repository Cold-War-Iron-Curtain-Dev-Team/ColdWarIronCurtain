 #Light Fighter
 EGY_jet_light_equipment_1:0 "Yakovlev Yak-11"
 EGY_jet_light_equipment_1_short:0 "Yak-11"
 EGY_jet_light_equipment_2:0 "Hispano HA-200"
 EGY_jet_light_equipment_2_short:0 "HA-200"
 EGY_jet_light_equipment_2_desc:0 "L'Hispano HA-200 Saeta était un avion d'entraînement avancé biplace conçu et produit par l'avionneur espagnol Hispano Aviación. Il a la particularité d'être le premier avion espagnol à exploiter la propulsion à réaction."
 EGY_jet_light_equipment_3:0 "L-29 Delfin"
 EGY_jet_light_equipment_3_short:0 "L-29 Delfin"
 EGY_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
 EGY_jet_light_equipment_4:0 "Aéro L-39 Albatros"
 EGY_jet_light_equipment_4_short:0 "L-39 Albatros"
 EGY_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
 EGY_jet_light_equipment_5:0 "PAC Karakorum-8" 
 EGY_jet_light_equipment_5_short:0 "Karakorum-8"
 EGY_jet_light_equipment_5_desc:0 "Le Hongdu JL-8 (Nanchang JL-8), également connu sous le nom de Karakorum-8 ou K-8 en abrégé, est un avion d'entraînement à réaction intermédiaire biplace et un avion d'attaque léger conçu en République populaire de Chine par China Nanchang Aircraft Manufacturing Corporation. Le Pakistan est également le co-partenaire de ce projet. Le maître d'oeuvre est la Hongdu Aviation Industry Corporation. Sa variante d'exportation, le K-8 Karakorum, est coproduite par le complexe aéronautique du Pakistan pour l'armée de l'air pakistanaise."

