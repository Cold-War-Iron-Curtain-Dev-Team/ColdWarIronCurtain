 #Aircraft
 #Fighter Aircraft
 EGY_fighter_equipment_0:0 "Force aérienne égyptienne"
 EGY_fighter_equipment_0_short:0 "Force aérienne égyptienne"
 EGY_fighter_equipment_0_desc:0 "L'armée de l'air égyptienne (EAF) (El Quwat El Gawiyä El Masriya), est la branche aéronautique des forces armées égyptiennes, est responsable de toutes les missions de défense aéroportée et exploite tous les avions militaires, y compris ceux utilisés en soutien à l'armée égyptienne, à la marine égyptienne et aux forces de défense aérienne égyptiennes." 
 EGY_fighter_equipment_1:0 "Hawker Hurricane Mk.I"
 EGY_fighter_equipment_1_short:0 "Ouragan Mk.I"
 EGY_fighter_equipment_2:0 "Supermarine Spitfire F Mk.Vb"
 EGY_fighter_equipment_2_short:0 "Spitfire F Mk.Vb"
 EGY_fighter_equipment_3:0 "Supermarine Spitfire F Mk.IX"
 EGY_fighter_equipment_3_short:0 " Spitfire F Mk.IX"

 EGY_jet_multirole_equipment_1:0 "Supermarine Spitfire F Mk.22"
 EGY_jet_multirole_equipment_1_short:0 "Spitfire F Mk.22" 
 EGY_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 EGY_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 EGY_jet_multirole_equipment_2_short:0 "MiG-15"
 EGY_jet_multirole_equipment_3_short:0 "MiG-17"
 EGY_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 EGY_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 EGY_jet_multirole_equipment_4_short:0 "MiG-19"
 EGY_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 EGY_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 EGY_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 EGY_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 EGY_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 EGY_jet_multirole_equipment_6_short:0 "MiG-21PF"
 EGY_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23B"
 EGY_jet_multirole_equipment_7_short:0 "MiG-23B"
 EGY_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 EGY_jet_multirole_equipment_8:0 "Faucon de combat F-16A de General Dynamics"
 EGY_jet_multirole_equipment_8_short:0 "Faucon de combat F-16A"
 EGY_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger avec une maniabilité et une stabilité bien équilibrées. Il possède un corps d'aile mixte exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Appelé « Fighting Falcon », son coût relativement faible et sa puissance élevée sont la raison pour laquelle il a été adapté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle best-seller ont été fabriqués."
 EGY_jet_multirole_equipment_9:0 "Dassault Mirage 2000EM"
 EGY_jet_multirole_equipment_9_short:0 "Mirage 2000EM"
 EGY_jet_multirole_equipment_9_desc:0 "L'Égypte est devenue le premier client à l'exportation du Mirage 2000 lorsqu'elle a commandé 20 avions en décembre 1981. La commande de 890 millions de dollars comprenait 16 Mirage 2000EM monoplaces et quatre Mirage 2000BM biplaces, ainsi que des options pour 20 avions supplémentaires. Les avions ont été livrés entre juin 1986 et janvier 1988."
 EGY_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Faucon de combat"
 EGY_jet_multirole_equipment_10_short:0 "F-16C Bloc 25"
 EGY_jet_multirole_equipment_10_desc:0 "Première sous-variante du F-16C, un nouveau radar a été installé et un système de contrôle de tir amélioré, ainsi que des systèmes de données intégrés pour une capacité d'attaque de nuit améliorée. Introduite en 1984, la variante F-16C B25 servira de grande capacité pendant la guerre du Golfe Persique."

 EGY_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 EGY_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 EGY_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
