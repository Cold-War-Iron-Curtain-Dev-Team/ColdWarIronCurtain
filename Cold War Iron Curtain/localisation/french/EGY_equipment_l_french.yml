 EGY_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 EGY_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 EGY_jet_CAS_equipment_4_short:0 "Su-7B"
 EGY_jet_CAS_equipment_5:0 "Sukhoï Su-7BMK"
 EGY_jet_CAS_equipment_5_short:0 "Su-7BMK" 
 EGY_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 EGY_jet_CAS_equipment_6:0 "Dassault Mirage 5SDD"
 EGY_jet_CAS_equipment_6_short:0 "Mirage 5SDD"
 EGY_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 EGY_jet_CAS_equipment_7:0 "Dassault Mirage 5E2"
 EGY_jet_CAS_equipment_7_short:0 "Mirage5E2"
 EGY_jet_CAS_equipment_7_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
