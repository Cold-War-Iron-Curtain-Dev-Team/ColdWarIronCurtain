l_french:
 mongolia.1.d:0 "Sous la botte de Staline et de ses marionnettes communistes en Mongolie, les populations de la région ont énormément souffert. Depuis sa création en 1921, la République populaire mongole a été en proie à des purges et à des massacres qui ont complètement déraciné le mode de vie du peuple mongol et ont eu un impact dévastateur sur la population. Bien qu'il prétende représenter le peuple, le Parti populaire mongol a forcé la population à collectiviser son bétail tout en éradiquant pratiquement la religion bouddhiste. Leurs temples profanés restent comme des rappels calcinés des temps perdus. Le mécontentement à l'égard du régime soviétique s'est accru et la population est devenue de plus en plus mécontente du régime communiste. Bien qu'il ne s'agisse pas encore d'une menace pour le régime soviétique, le sentiment antisoviétique croissant dans toute la Mongolie constitue un danger que Staline ne peut se permettre d'ignorer."
 mongolia.2.d:0 "Notre cher leader Khorloogiin Choibalsan est décédé à l'âge de 56 ans d'un cancer du rein à Moscou. On se souviendra de lui comme d'un héros, d'un patriote et finalement d'un martyr pour la cause de l'indépendance de la Mongolie. Son corps a été restitué avec tous les honneurs militaires et il a eu des funérailles nationales dans la capitale, en présence de responsables mongols et soviétiques. Il a été enterré au cimetière Altan Ulgii à Oulan-Bator, mais les travaux ont commencé sur un mausolée devant le Palais du Gouvernement."
 mongolia.3.d:0 "\nMalgré l'enthousiasme des dirigeants communistes mongols, l'Union soviétique a rejeté leur demande de devenir une république constituante du pays. Bien que les Soviétiques apprécient l'engagement de la Mongolie en faveur du socialisme et du modèle soviétique, nombre d'entre eux estiment que la nation est bien trop sous-développée pour être incorporée. On craignait également que l'incorporation de la Mongolie finisse par contrarier les alliés socialistes soviétiques en Chine et en Asie de l'Est. Le gouvernement mongol aurait été déçu par cette décision et s'est engagé à poursuivre le développement révolutionnaire du pays sous la direction soviétique. Cependant, au sein du parti communiste mongol, des rumeurs courent selon lesquelles de nombreux membres du parti se seraient opposés au projet et auraient peut-être exhorté en privé les responsables soviétiques à rejeter également la proposition."
 mongolia.11.d:0 "Le Parti communiste mongol a conclu des débats publics et des rapports concernant les transgressions passées et les excès de violence survenus lors de la Grande Purge de 1937 à 1939. Le Parti regrette les pertes de vies humaines et la destruction culturelle au cours de cette période. Plus important encore, le Parti a décidé de réhabiliter les membres du parti purgés qui avaient été condamnés pour excès de nationalisme. De nombreux membres du parti accusent le rôle des conseillers soviétiques, notamment du NKVD, accusés d'avoir dirigé et contrôlé la violence, qui comprenait la torture et la création de camps de prisonniers. Le leader communiste de l'époque, le bien-aimé maréchal Choibalsan, a également été critiqué pour avoir commis des erreurs à cette époque et bâtir un culte de la personnalité. Une partie de la vieille garde du parti est mal à l'aise face à ces procédures."
 mongolia.20.d:0 "Le secrétaire général Dashiin Damba a récemment été démis du pouvoir à la suite d'une lutte de pouvoir au sein du parti communiste mongol. Damba a récemment joué un rôle majeur dans les efforts de déstalinisation en poussant le pays à s'engager avec d'autres puissances asiatiques à orientation socialiste au lieu de se limiter à l'Union soviétique. La vieille garde du Parti s'est offusquée de la déstalinisation, notamment des critiques adressées à l'ancien dirigeant, le maréchal Choybalsan. C'est cette faction qui a orchestré l'éviction de Damba et la purge de ses proches collaborateurs. L'Union soviétique sera probablement satisfaite de cette évolution car elle contribuera à consolider la direction de la faction pro-Moscou au sein du parti."
 mongolia.7.d:0 "La Mongolie a connu une histoire compliquée et instable depuis la chute de l'Empire mongol. Dans le désordre politique chinois de l'ère des seigneurs de guerre, la petite nation isolée de Mongolie a été oubliée par les grandes puissances et n'a donc jamais reçu de reconnaissance formelle. Après que Bogd Khan et les forces d'occupation chinoises aient été chassés par l'Armée rouge en 1921, le pays était effectivement sous contrôle soviétique et n'avait aucun État officiel. Bien qu'elle ait participé de manière indépendante aux batailles contre le Japon pendant la Seconde Guerre mondiale, l'indépendance de la Mongolie n'était encore reconnue que par les Soviétiques. Cependant, avec l'intensification de la guerre froide à travers le monde, l'Union soviétique a conduit à une intensification considérable des efforts visant à reconnaître les Mongols en tant qu'État indépendant. Cette décision représente une avancée majeure pour l'identité nationale mongole et pourrait éventuellement redonner à la Mongolie son statut de puissance universellement reconnue pour la première fois depuis le 14e siècle."
 mongolia.21.d:0 "Lors d'une réunion extraordinaire du Comité central, le Premier ministre Yumjaagiin Tsedenbal a été démis de ses fonctions. Figure majeure du parti depuis qu'il en est devenu secrétaire général en 1940, sa destitution indique que le parti se méfiait de ses efforts d'industrialisation et de son dévouement à Moscou. Sa destitution est probablement le résultat des récents efforts de déstalinisation qui ont vivement critiqué les mentors du parti Tsedenbal. Son association avec la direction précédente a rendu sa position intenable alors que la nouvelle direction du parti souhaite passer à autre chose. Le nouveau Premier ministre n'a pas encore été nommé, mais il devra maintenir des liens solides avec Moscou et pousser la Mongolie à nouer des relations plus étroites avec d'autres États socialistes asiatiques. On ne sait pas si Tsendenbal a été déchu de son adhésion au parti ou simplement démis de ses postes élevés."
 AJAX.900.d:0 "Le nouveau gouvernement iranien d'Ahmad Qavam a consenti à la restauration de la dynastie Qajar. Le jeune Hamid Mirza Qajar, fils de l'ancien prince héritier deviendra Shah. Le gouvernement iranien a qualifié cela de restauration d'un tort historique. Notant que Reza Pahlavi a usurpé le trône par des machinations, la violence et avec des forces étrangères. C'est cette tendance à la cruauté et à la connivence avec les puissances étrangères qui a maintenu la nation iranienne faible ces dernières années. La restauration Qajar ramène une dynastie du XVIIIe siècle et revigorera les liens naturels entre non seulement la monarchie et le peuple, mais aussi entre la monarchie et le clergé."
 AJAX.911.d:0 "La position publique du Shah s'est encore détériorée à la suite de l'organisation de rassemblements de masse contre le Shah par le groupe radical Fadaiyan-i-Islam. Le groupe, utilisant ses contacts parmi le clergé, a réussi à rallier des partisans pendant les prières du vendredi et à les amener dans les rues à travers le pays. Les manifestants ont condamné la politique occidentalisante de la dynastie Pahlavi, son engagement envers les puissances impériales et ce qu'elle appelle l'oppression de l'Islam. La mobilisation des communautés religieuses en Iran est un coup dur pour le Shah, qui fait déjà face à un tollé public en raison de ses tendances autocratiques et de son statut perçu de larbin impérial."
 mongolia_prc_1_desc:0 "Dans un communiqué officiel, le [PRC.GetName] a offert quelques centaines de milliers de travailleurs chinois Han à la Mongolie extérieure afin de contribuer à la modernisation de notre pays. Cela serait sans aucun doute extrêmement utile pour garantir notre rôle dans le monde communiste. Cependant, le [MON.GetName] est une très petite nation, relativement parlant, avec peu de Mongols de souche vivant dans notre pays. Si nous acceptons ces travailleurs chinois Han, nous aurions bien plus de Chinois de souche que nous ne pourrions en assimiler, et il est possible que les [PRC.GetName] tentent d'intégrer notre nation."
 inner_mongol_13_desc:0 "Plus tôt dans la journée, le [PRC.GetName] a annoncé qu'il autoriserait et encouragerait la migration du peuple mongol de la région de la Mongolie intérieure vers la Mongolie extérieure, ou le [MON.GetName]. Cela fait suite à une première demande de cession de toute la région de la Mongolie intérieure, ce qui a apparemment été jugé ridicule par le gouvernement chinois, qui a rejeté avec véhémence cette demande. Cependant, leur demande formelle d'une sorte de traité sur la migration a été acceptée comme un acte de bonne volonté, et le mouvement vers l'unité mongole est célébré ce soir à Oulan-Bator."
 inner_mongol_14_desc:0 "Plus tôt dans la journée, les [MON.GetName] ont fait part de leur mécontentement à l'égard du gouvernement chinois en raison de son refus agressif de travailler avec le gouvernement mongol dans ses tentatives d'intégrer les populations de Mongolie intérieure dans leur domaine. Initialement, [PRC.GetName] a nié une première tentative d'organiser une cession de la région de Mongolie intérieure dans leur État dans l'espoir de meilleures relations après le transfert de la région. Lorsque les [MON.GetName] ont envoyé un autre communiqué demandant une politique migratoire ouverte, les [PRC.GetName] l'ont encore refusé. Ce soir, de nombreuses personnes en Mongolie se sentent frustrées face au manque de coopération."
 inner_mongol_12_desc:0 "Le maudit [PRC.GetName] a encore plus sali nos objectifs d'unir les Mongols. Dans une tentative malavisée de nous combattre bec et ongles par dépit, ils ont rejeté nos deux demandes, favorisant plutôt une position ferme de ce qui semble presque être un sentiment anti-mongol. Malheureusement, nous devrons attendre notre syndicat."
 inner_mongol_11_desc:0 "Bien que les [PRC.GetName] aient refusé notre demande initiale de transfert des terres altaïques, ils ont provisoirement accepté la demande de migration ouverte des peuples de la Mongolie intérieure vers la Mongolie extérieure. Cette décision n'est pas exactement ce que nous souhaitions, mais l'union de notre peuple est néanmoins une bonne chose."
 inner_mongol_10_desc:0 "Bien que nous ayons rejeté leur communiqué précédent, nous avons reçu un autre message du gouvernement mongol. S'excusant de sa présomption, [PRC.GetLeader] a demandé un traité pour la migration ouverte des peuples altaïques vers leur pays, renforçant ainsi leur mission d'unité de leur peuple. Même si cette demande est moins gênante que la demande précédente, certains s'opposent toujours à l'idée d'apaiser les Mongols."
 
 inner_mongol_1_desc:0 "Bien que la Mongolie intérieure ne fasse plus partie de la nation mongole depuis la chute de l'empire de Temujin, le peuple altaïque habite toujours de vastes étendues des steppes de la Mongolie intérieure, qui fait désormais partie du nord de la Chine. Plus encore, une population bruyante de cette région désire une steppe unie et une sphère de Grande Mongolie enfin réunie. Cependant, les [PRC.GetName] contrôlent ces vastes steppes et peuvent ne pas voir notre point de vue lorsqu'il s'agit de notre acquisition de leurs terres. Nous ne pouvons qu'envoyer notre demande et espérer le meilleur."
 inner_mongol_2_desc:0 "Aujourd'hui à midi, nous avons reçu un communiqué de [MON.GetName]. Le communiqué contenait une demande détaillée de cession des territoires de la Mongolie intérieure à [MON.GetName] dans ce que [MON.GetLeader] décrit comme un « droit ancestral et ethnique à l'unité des peuples ». S'il est vrai que cela constituerait un acte notable de bonne volonté envers les peuples altaïques de la région, ainsi que quelque chose qui établirait de meilleures relations entre nos pays, de nombreux membres virulents de notre gouvernement ont répondu à cette demande avec hostilité, déclarant en termes clairs que nous ne devons rien au peuple mongol. "
 inner_mongol_3_desc:0 "La Chine a rejeté notre demande suite à une malheureuse tournure des événements. [PRC.GetLeader] a affirmé que « le peuple chinois ne doit rien aux Mongols ». Refuser notre tentative d'unité des peuples. Cependant, nous parviendrons peut-être à convaincre nos voisins de participer à un traité de migration ouverte qui permettrait à nos frères du sud de se réinstaller sur nos terres."
 inner_mongol_4_desc:0 "La Chine a accepté notre demande. En quelques mots, [PRC.GetLeader] a effectivement cédé la Mongolie intérieure, citant l'animosité du passé et l'espoir d'une nouvelle amitié entre les deux nations. Même si le transfert de terres peut prendre un certain temps, il s'agit d'une réalisation historique pour la diplomatie."
 inner_mongol.5.d:0 "Plus tôt dans la journée, le [PRC.GetName] a proclamé qu'il céderait les terres de la Mongolie intérieure au [MON.GetName], citant les peuples altaïques prolifiques de la région, ainsi que le désir d'améliorer les relations entre les deux nations. Bien que les terres n'appartiennent plus à un État mongol depuis la dynastie Yuan, le gouvernement mongol a revendiqué son désir d'union du peuple mongol. À Oulan-Bator, la population est descendue dans la rue pour célébrer ce couronnement de la diplomatie."

