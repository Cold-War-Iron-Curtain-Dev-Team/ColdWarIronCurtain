 NZL_cv_CAS_equipment_3:0 "Fairey Firefly Mk.1"
 NZL_cv_CAS_equipment_3_short:0 "Luciole Mk.1"
 NZL_cv_CAS_equipment_3_desc:0 "Le Canada a choisi d'acquérir le Firefly malgré l'opposition qui préconisait plutôt l'achat d'avions américains. En guise de mesure provisoire, des Fireflies de la Royal Navy ont été prêtés tandis que des avions spécialement conçus plus avancés étaient en cours de construction."
 NZL_cv_jet_CAS_equipment_1:0 "Fairey Firefly AS Mk.5"
 NZL_cv_jet_CAS_equipment_1_short:0 "Luciole AS Mk.5"
 NZL_cv_jet_CAS_equipment_1_desc:0 "La Marine canadienne employait 65 lucioles AS Mk.5 sur ses porte-avions. Le dernier Firefly AS.Mk 5 était un avion anti-sous-marin, qui transportait des bouées sonores et du matériel américains."
 NZL_cv_jet_CAS_equipment_2:0 "Hawker Sea Fury FB.11"
 NZL_cv_jet_CAS_equipment_2_short:0 "Fureur marine FB.11"
 NZL_cv_jet_CAS_equipment_3:0 "Hawker Sea Fury FB.20"
 NZL_cv_jet_CAS_equipment_3_short:0 "Fureur marine FB.20"
 NZL_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 NZL_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 NZL_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
 NZL_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 NZL_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"

 NZL_cv_fighter_equipment_2:0 "Vought F4U-5 Corsaire"
 NZL_cv_fighter_equipment_2_short:0 "Corsaire F4U-5"
 NZL_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 NZL_cv_fighter_equipment_3:0 "Supermarine Seafire F Mk.XV"
 NZL_cv_fighter_equipment_3_short:0 "Seafire F Mk.XV"
 NZL_cv_fighter_equipment_3_desc:0 "Le Supermarine Seafire était une version navale du Supermarine Spitfire adaptée pour être utilisée à partir de porte-avions. Son concept était analogue au Hawker Sea Hurricane, une version navalisée du compagnon d'écurie du Spitfire, le Hawker Hurricane. Le nom Seafire est dérivé de l'abréviation du nom plus long Sea Spitfire."

