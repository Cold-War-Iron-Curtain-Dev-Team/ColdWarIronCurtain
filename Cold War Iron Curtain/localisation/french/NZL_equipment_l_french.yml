 NZL_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 NZL_nav_bomber_equipment_6_short:0 "P-3A Orion"
 NZL_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le rôle de patrouille maritime et de guerre anti-sous-marine terrestre (ASW). Il dispose d'une soute à bombes interne pour les torpilles aériennes, avec des pylônes sous les ailes pour une myriade d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des charges sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques sur sa queue pour détecter les sous-marins utilisant le champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à jouer un rôle depuis son introduction en 1962, il est tout à fait approprié que l'avion soit surnommé « Orion ». Le chasseur de navires ennemis."
 NZL_nav_bomber_equipment_7:0 "Lockheed P-3K Orion"
 NZL_nav_bomber_equipment_7_short:0 "P-3K Orion"
 NZL_nav_bomber_equipment_7_desc:0 "Le P-3C disposait d'une nouvelle suite ASW et d'un ordinateur de mission avec une disposition interne révisée. À l'extérieur, le P-3C comportait une échelle d'entrée à commande électrique ; petite antenne à aileron ; chutes de bouées sonores ventrales chargées extérieurement ; et trois petites fenêtres sur le côté arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux bien à l'arrière). Les avions de production initiaux avaient un nez de caméra situé sur la partie inférieure du radôme. Les avions de production ultérieurs avaient une tourelle IRDS rétractable à la place de la caméra nasale. À partir du début des années 1980, les nez de caméra existants ont été équipés de tourelles IRDS. Les premiers modèles étaient également connus sous le nom d'avion P-3C « Baseline » ou Non-Update (NUD). Tous les avions ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 NZL_nav_bomber_equipment_8:0 "Lockheed P-3CK2 Orion"
 NZL_nav_bomber_equipment_8_short:0 "P-3CK2 Orion"
 NZL_nav_bomber_equipment_8_desc:0 "Avions P-3K2 de la Royal New Zealand Air Force qui ont été entièrement mis à niveau avec des systèmes de mission totalement nouveaux par la Division d'intégration de mission L-3, Greenville, Texas.. Le poste de pilotage dispose désormais d'une instrumentation « en verre » et d'un ordinateur de navigation automatisé. Le rail tactique (Tacrail) a été entièrement rééquipé de capteurs, de systèmes de communication et de gestion de données modernes."

 NZL_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion de liaison et d'observation militaire britannique produit par la société Taylorcraft Airplanes (England) Limited pendant la Seconde Guerre mondiale. "
 NZL_jet_recon_equipment_0:0 "Météore Gloster PR.1"
 NZL_jet_recon_equipment_0_short:0 "Météore PR.1"
 NZL_jet_recon_equipment_0_desc:0 "Variante de reconnaissance monoplace du Gloster Meteor F.1."
 NZL_jet_recon_equipment_1:0 "McDonnell Douglas A-4E (NZ) Skyhawk de reconnaissance"
 NZL_jet_recon_equipment_1_short:0 "Reconnaissance A-4E(NZ)"
 NZL_jet_recon_equipment_1_desc:0 "Variante de reconnaissance de la variante néo-zélandaise de l'A-4, la mise à niveau A-4E pré-Kahu, armée de caméras plutôt que de canons et de missiles. Prendre des photos de kiwis sans méfiance pour la plupart."
 NZL_jet_recon_equipment_2:0 "McDonnell Douglas A-4K-R Skyhawk de reconnaissance"
 NZL_jet_recon_equipment_2_short:0 "Reconnaissance A-4K-R"
 NZL_jet_recon_equipment_2_desc:0 "Variante de reconnaissance de la variante néo-zélandaise de l'A-4K, armée de caméras plutôt que de canons et de missiles. Prendre des photos de kiwis sans méfiance pour la plupart, parfois vus survolant le Mordor."
