 NZL_lt_equipment_3:0 "Char de combat à chenilles complètes : canon de 76 mm, M41"
 NZL_lt_equipment_3_short:0 "M41 Walker Bulldog"
 NZL_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a combattu au Vietnam, dans la Baie des Cochons, au Liban et en Somalie. Son blindage varie de 19 mm à 31,7 mm. Il est armé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre.30 et d'un canon de toit de calibre.50. Il utilise un moteur essence Continental 6 cylindres et fonctionne jusqu'à 45 mph avec une autonomie opérationnelle de 100 miles. Le développement du M41 progressait lentement avec peu de financement, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à précipiter le programme. La précipitation a causé un grand nombre de problèmes dans le programme et des problèmes de taille excessive. Le M41, en raison de graves problèmes liés à la précipitation du programme, a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, la production n'a démarré qu'en 1951 et n'a duré que 3 ans."
