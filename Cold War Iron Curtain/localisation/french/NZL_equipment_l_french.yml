#New Zealand

 NZL_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 NZL_infantry_equipment_0_short:0 "SMLE n°4"
 NZL_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 NZL_infantry_equipment_1:0 "Fusil à chargement automatique L1A1"
 NZL_infantry_equipment_1_short:0 "L1A1"
 NZL_infantry_equipment_1_desc:0 "Le L1A1 est une version britannique du fusil de combat belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL intégrant les modifications développées par l'Allied Rifle Committee, le désignant le L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, Birmingham Small Arms, la Royal Ordnance Factory et le ROF Fazakerley. Après l'arrêt de la production, des composants de remplacement ont été fabriqués par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à 1994 environ, remplacé par le L85A1 à partir de 1985."

 NZL_infantry_equipment_2:0 "Polymère de fusil à chargement automatique L1A1"
 NZL_infantry_equipment_2_short:0 "L1A1(p)"
 NZL_infantry_equipment_2_desc:0 "Version améliorée du C1." 
 
 NZL_infantry_equipment_3:0 "Arme individuelle Steyr AUG"
 NZL_infantry_equipment_3_short:0 "IW Steyr"
 NZL_infantry_equipment_3_desc:0 "Le F88 Austeyr est l'arme individuelle standard de l'Australia Defence Force. Il est fabriqué sous licence de Steyr Mannlicher AG à l'usine d'armes légères Thales Lithgow, qui appartient désormais à Thales Australie. Il est délivré et fourni aux forces armées d'Australie et de Nouvelle-Zélande et intègre un viseur en forme de beignet en forme de croix. Il est également en service dans 30 pays différents."
 
 NZL_infantry_equipment_4:0 "Steyr AUG Arme Individuelle A1"
 NZL_infantry_equipment_4_short:0 "IW Steyr A1"
 NZL_infantry_equipment_4_desc:0 "Le F88SA1 Austeyr est une variante du F88 Austeyr avec un rail Picatinny intégré à la place du viseur optique standard qui permet la fixation de divers autres dispositifs de visée (lunettes de vision nocturne, optiques grossies et non grossies comme l'ELCAN C79, le Trijicon ACOG ou l'Aimpoint)."

########## NEW NZL ARMOR

 NZL_lt_equipment_1:0 "M5 Stuart"
