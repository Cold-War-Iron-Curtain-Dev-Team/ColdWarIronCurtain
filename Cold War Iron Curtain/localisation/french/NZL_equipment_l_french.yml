 NZL_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 NZL_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer le PV-1 Ventura et le PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour l'US Navy, il s'agissait en fait d'un avion basé à terre, et le P2V, plus tard désigné P-2 après 1962, n'a jamais effectué d'atterrissage sur un porte-avions, mais un petit nombre a été converti et déployé à partir de porte-avions comme bombardiers nucléaires provisoires qui devraient atterrir sur le rivage ou dans un fossé, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », du nom du dieu romain de la mer."
