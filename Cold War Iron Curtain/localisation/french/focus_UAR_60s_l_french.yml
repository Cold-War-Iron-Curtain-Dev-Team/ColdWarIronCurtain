l_french:
#Focusses
 EGY_Nationalize_Suez_Canal:0 "Nationaliser le canal de Suez"
 Launch_Coup_SAU_desc:0 "Pour §Ygarantir le succès§! notre §Cinfluence§! sur l'Arabie Saoudite doit être d'au moins §Y75 %§!"
 Launch_Coup_JOR_desc:0 "Pour §Ygarantir le succès§! notre §Cinfluence§! sur la Jordanie doit être d'au moins §Y75 %§!"
#Economy
 UAR_Economic_Affairs:0 "Affaires économiques"
 UAR_Economic_Affairs_desc:0 "L'économie égyptienne s'est considérablement améliorée depuis la fondation de la République, nous devons poursuivre notre politique d'esprit socialiste et réinvestir nos nouvelles richesses dans l'économie."
 UAR_Agricultural_Modernization:0 "Modernisation agricole"
 UAR_Agricultural_Modernization_desc:0 "Nos récentes réformes agraires se sont avérées largement efficaces et ont considérablement augmenté la production agricole. Cependant nos agriculteurs utilisent encore des outils considérés comme désuets par le reste du monde. Si nous investissons dans la modernisation des infrastructures et des équipements agricoles, cela pourrait propulser notre secteur agricole déjà en plein essor vers de nouveaux sommets."
 UAR_Establish_El_Nasr_Automotive_Manufacturing_Company:0 "Créer la société de fabrication automobile El Nasr"
 UAR_Establish_El_Nasr_Automotive_Manufacturing_Company_desc:0 "Les automobiles ont toujours été considérées comme un luxe hors de portée de l'Égyptien moyen, mais avec l'expansion de nos infrastructures dans les villes et à travers le pays, les automobiles deviennent de plus en plus importantes dans la vie quotidienne et l'activité économique. Nous devrions fonder une nouvelle entreprise publique pour produire des automobiles en Égypte afin de répondre à la demande croissante."
 UAR_Helwan_Steelworks:0 "L'aciérie d'Helwan"
 UAR_Helwan_Steelworks_desc:0 "Helwan est une ville de la grande région du Caire qui a connu peu de développement ou de modernisation. Nous devrions transformer cette zone en une puissance industrielle en investissant dans les aciéries et autres usines métallurgiques de la ville, créant des emplois et fournissant l'approvisionnement en acier et autres matériaux indispensables."
 UAR_Expand_the_Middle_Class:0 "Développer la classe moyenne"
 UAR_Expand_the_Middle_Class_desc:0 "La classe moyenne est la plus grande consommatrice de toute économie. Malheureusement, notre pays manque encore d'une classe moyenne forte. En investissant dans la création de nouveaux secteurs de services et axés sur la consommation, nous pouvons créer des emplois bien rémunérés et ainsi créer une économie plus virulente."
 UAR_Economic_Growth:0 "Croissance économique"
 UAR_Economic_Growth_desc:0 "L'économie n'a jamais été aussi bonne, et grâce aux politiques judicieuses du président Nasser et du gouvernement, nous assistons à un boom économique sans précédent."
 UAR_Ensure_University_Acces:0 "Garantir l'accès à l'université"
 UAR_Ensure_University_Acces_desc:0 "Si l'Égypte veut prospérer, nous aurons besoin des meilleurs et des plus brillants membres de notre peuple. Ce serait une grande perte si des individus brillants passaient inaperçus en raison de leur richesse. En garantissant l'accès universel à l'enseignement supérieur, nous pouvons garantir que chacun, quelle que soit sa classe, ait la possibilité de s'épanouir et que les génies de notre pays soient reconnus."
 UAR_Industrializaiton_Inititiative:0 "Initiative d'industrialisation"
 UAR_Industrializaiton_Inititiative_desc:0 "L'industrie égyptienne est encore à la traîne en matière d'équipements et de techniques de production modernes. En modernisant nos usines et nos équipements et en étudiant les pratiques occidentales, nous pouvons augmenter considérablement notre production industrielle."
 UAR_Soviet_Aid:0 "Aide soviétique"
 UAR_Soviet_Aid_desc:0 "L'Union soviétique a été un partenaire étroit de notre développement économique, en invitant des techniciens et des experts soviétiques à l'aider à conseiller et à enseigner à son propre peuple que nous pouvons moderniser plus rapidement notre industrie."
 UAR_Expand_Housing:0 "Agrandir le logement"
 UAR_Expand_Housing_desc:0 "Le sans-abrisme et les mauvaises conditions de vie restent un problème dans notre pays. En élargissant l'accès à un logement abordable, nous pouvons accroître le bien-être de nos citoyens et le potentiel économique global de notre population."
 UAR_Complete_the_Aswan_Dam:0 "Terminer le barrage d'Assouan"
 UAR_Complete_the_Aswan_Dam_desc:0 "Le Nil est le fleuve le plus important d'Afrique, fournissant plus de 90 % des terres arables de l'Égypte. Depuis plus d'une décennie, le barrage d'Assouan est en construction. Ce barrage fournirait une importante énergie hydroélectrique nécessaire au maintien du pays. Malgré le retrait de l'aide des puissances occidentales et quelques difficultés mineures pour obtenir un financement, le barrage a finalement été achevé et beaucoup sont optimistes que cela conduira à un nouvel âge d'or économique !"
 
#Military
 UAR_The_United_Arab_Republic_Armed_Forces:0 "Les Forces armées de la République arabe unie"
 UAR_The_United_Arab_Republic_Armed_Forces_desc:0 "Les armées égyptienne et syrienne restent placées sous des structures de commandement différentes et opèrent en utilisant des tactiques différentes. En unifiant nos structures de commandement et en combinant l'expertise des officiers égyptiens et syriens, nous pouvons créer une force militaire bien plus efficace et cohérente."
 UAR_The_United_Arab_Republic_Navy:0 "La Marine de la République Arabe Unie"
 UAR_The_United_Arab_Republic_Navy_desc:0 "La Marine est souvent considérée comme le membre junior de toutes les forces armées, mais nos anciens maîtres britanniques ont enseigné au monde que la puissance navale est tout aussi importante que les prouesses terrestres. Nous devrions nous lancer dans un programme de modernisation et d'expansion navale pour garantir que nous pouvons projeter notre puissance à travers le monde et sécuriser nos eaux nationales au cas où les Britanniques décideraient d'envahir à nouveau."
 UAR_Purchase_Project_663_Class_Submarines:0 "Achat de sous-marins soviétiques de classe Projet 633"
 UAR_Purchase_Project_663_Class_Submarines_desc:0 "Les véhicules navals submersibles existent depuis la guerre civile américaine. Durant les deux guerres mondiales, les Allemands ont montré à quel point les sous-marins peuvent être dévastateurs sur le champ de bataille. Les Soviétiques ont proposé de nous vendre plusieurs de leurs vieux sous-marins, ce qui contribuera grandement à renforcer notre marine."
 UAR_Expand_Alexandrian_Shipyards:0 "Agrandissement des chantiers navals d'Alexandrie"
 UAR_Expand_Alexandrian_Shipyards_desc:0 "Alexandrie est célèbre pour son phare et une ville portuaire importante était autrefois le centre de la puissance navale méditerranéenne. Nous devrions imiter les empires du passé et développer les chantiers navals d'Alexandrie en augmentant notre production navale."
 UAR_Invest_in_Anti_Ship_Missles:0 "Investissez dans les missiles antinavires"
 UAR_Invest_in_Anti_Ship_Missles_desc:0 "Les missiles antinavires deviennent rapidement le principal moyen de mener une guerre navale. Nous devrions investir dans la recherche et la production de ces missiles afin de suivre le rythme des autres puissances navales."
 UAR_Develop_Naval_Special_Forces:0 "Développer les forces spéciales navales"
 UAR_Develop_Naval_Special_Forces_desc:0 "Un navire est aussi bon que son équipage, nous devrions investir dans le développement d'unités de forces spéciales opérant sous commandement naval et capables d'effectuer des opérations que nos soldats normaux ne pourraient pas effectuer."
 UAR_The_United_Arab_Republic_Army:0 "L'Armée de la République Arabe Unie"
 UAR_The_United_Arab_Republic_Army_desc:0 "L'armée est la principale force de combat de n'importe quel pays, nos officiers ont l'expérience des combats dans les guerres de Suez et d'Israël, mais nos rangs inférieurs utilisent encore des équipements obsolètes, le moment est venu de moderniser enfin notre armée."
 UAR_Import_PT_76s:0 "Importer des PT 76"
 UAR_Import_PT_76s_desc:0 "Le PT 76 est un char léger de fabrication soviétique, il peut fournir un soutien blindé rapide et flexible à notre infanterie, nous pouvons conclure un accord avec l'Union soviétique pour importer certains de ces chars et les intégrer dans notre corps blindé."
 UAR_Soviet_Advisors:0 "Inviter des conseillers soviétiques"
 UAR_Soviet_Advisors_desc:0 "Nous devrions inviter des conseillers de l'Union soviétique ; grâce à leur expertise et à leur expérience de la Seconde Guerre mondiale, ils peuvent nous aider à transformer rapidement notre armée en une force professionnelle moderne."
 UAR_Soviet_Weaponry:0 "Adoptez l'armement soviétique"
 UAR_Soviet_Weaponry_desc:0 "Les Soviétiques sont réputés pour la fiabilité et la qualité de leurs armes, nous devrions importer des armes légères et autres équipements de l'Union soviétique et les adopter comme norme pour toutes nos forces armées."
 UAR_Import_Soviet_Weaponry:0 "Importer des T54 soviétiques"
 UAR_Import_Soviet_Weaponry_desc:0 "Le T54 est l'un des plus grands modèles de chars de fabrication soviétique et l'Union soviétique a accepté d'exporter plusieurs centaines de ses chars pour aider à moderniser notre corps blindé."
 UAR_The_United_Arab_Republic_Airforce:0 "L'armée de l'air de la République arabe unie"
 UAR_The_United_Arab_Republic_Airforce_desc:0 "L'armée de l'air est une région de guerre relativement nouvelle, mais les Allemands ont montré au cours de la Seconde Guerre mondiale l'importance et la force de la puissance aérienne. Nous devrions investir dans le développement d'une force aérienne nouvelle et moderne pour assurer la victoire dans les airs."
 UAR_Soviet_MiG_17s:0 "Achat de MiG 17 soviétiques"
 UAR_Soviet_MiG_17s_desc:0 "Les Soviétiques et les Américains ont été à l'avant-garde de la technologie des fusées et des avions à réaction. Nous devrions importer plusieurs dizaines de MiG 17 soviétiques pour garantir que nous disposons d'une force aérienne moderne et complète"
 UAR_Soviet_Sukhoi_Su_7s:0 "Achat de Sukhoi Su 7 soviétiques"
 UAR_Soviet_Sukhoi_Su_7s_desc:0 "Le Sukhoi Su 7 est l'un des chasseurs multirôles les plus avancés de notre époque, nous devrions en importer certains de l'Union soviétique pour créer l'armée de l'air la plus avancée du monde arabe."
 UAR_Import_MiG_21s:0 "Importer des MiG 21"
 UAR_Import_MiG_21s_desc:0 "Le MiG 21 est une amélioration par rapport à son prédécesseur le MiG 17 dans presque tous les aspects, nous devrions importer un nouveau lot de ces avions des Soviétiques afin de ne pas continuer à utiliser des équipements obsolètes."
 UAR_Expand_Anti_Air_Capabilitites:0 "Développez les capacités anti-aériennes"
 UAR_Expand_Anti_Air_Capabilitites_desc:0 "Même si nos troupes dans le ciel peuvent assurer la supériorité aérienne à nos troupes sur le front intérieur, nous restons vulnérables aux raids aériens ou aux bombardements ennemis. Nous devrions investir dans nos capacités anti-aériennes pour protéger nos populations qui se trouvent derrière les lignes de front."
 UAR_Purchase_Project_633_Class_Submarines:0 "Acheter des sous-marins de classe Project-633"
 UAR_Ensure_University_Access:0 "Garantir l'accès à l'université"
 UAR_Import_Soviet_T54s:0 "Importer des T54 soviétiques"
 UAR_Soviet_Adivsors:0 "Conseillers soviétiques"

#Political
 UAR_The_Nasser_Era:0 "L'ère Nasser"
 UAR_The_Nasser_Era_desc:0 "L'ère Nasser fait référence à une période de l'histoire égyptienne après la révolution de 1952. Cette période a été marquée par une vague de modernisation, de réforme socialiste et un fervent plaidoyer en faveur du nationalisme panarabe. Cette époque serait considérée comme un âge d'or de la culture et de la prospérité égyptienne et l'Égypte serait au sommet de sa puissance régionale."
 UAR_The_Nationalization_Campaigns:0 "Campagnes de nationalisation"
 UAR_The_Nationalization_Campaigns_desc:0 "Notre politique économique a longtemps été critiquée tant par l'Est que par l'Ouest, parce qu'elle est soit trop communiste, soit pas assez communiste. La politique économique nassérienne est sans équivoque socialiste et, en tant que telle, nous devrions nous lancer dans une campagne de nationalisation des industries vitales."
 UAR_Nationalize_Banking_Industry:0 "Nationaliser le secteur bancaire"
 UAR_Nationalize_Banking_Industry_desc:0 "Les banques sont bien trop importantes et détiennent bien trop d'influence pour pouvoir rester entre des mains privées. Si nous voulons contrôler notre politique monétaire, nous devons assurer le contrôle des banques."
 UAR_Land_Reform:0 "Adopter des réformes agraires"
 UAR_Land_Reform_desc:0 "On dit que depuis plus d'un millénaire, l'expansion des terres arables en Égypte a échappé aux Égyptiens. Mais grâce aux réformes révolutionnaires du président Nasser, ce miracle s'est réalisé. Nous devons poursuivre les programmes de réforme agraire pour garantir une expansion agricole encore plus grande."
 UAR_Seize_the_Cotton_Industry:0 "S'emparer de l'industrie cotonnière"
 UAR_Seize_the_Cotton_Industry_desc:0 "L'Égypte est célèbre pour son industrie du coton depuis des milliers d'années et constitue un secteur important de notre économie depuis son introduction en Égypte par les Romains. Nous devons nationaliser l'industrie cotonnière si nous voulons que cet important secteur économique profite à la fois à l'État et à la population."
 UAR_Strengthen_Unions:0 "Renforcer les syndicats"
 UAR_Strengthen_Unions_desc:0 "L'aspect le plus important de toute théorie socialiste est le travailleur, les hommes et les femmes qui accomplissent le travail qui fait fonctionner toute société. En tant que tel, nous devons renforcer le pouvoir des travailleurs à travers la création et l'expansion des syndicats et des organisations syndicales."
 UAR_Eliminate_Interest_Rates_for_Farmers:0 "Éliminer le taux d'intérêt pour les agriculteurs"
 UAR_Eliminate_Interest_Rates_for_Farmers_desc:0 "Avec les récentes réformes agraires, une nouvelle classe d'agriculteurs pauvres a commencé à émerger. Nous devrions éliminer les taux d'intérêt sur leurs prêts afin de leur permettre d'étendre leurs activités et d'augmenter la taille et la portée de leurs fermes."
 UAR_State_of_the_National_Union:0 "État de l'Union nationale"
 UAR_State_of_the_National_Union_desc:0 "Le président Nasser n'est plus seulement le président de l'Égypte mais une République arabe unie. Même si jusqu'à présent, seule la Syrie a rejoint notre grande union, l'ambition du président Nasser va bien plus loin qu'une union à deux États, car la Syrie est un terrain d'essai pour nos politiques futures et le potentiel d'un monde arabe uni. Le président Nasser a décidé de prononcer un discours sur l'état de l'union pour exposer ses projets pour la République et la nature de sa gouvernance, notamment en Syrie."
 UAR_Stack_the_Government_with_Egyptians:0 "Empilez le gouvernement avec les Égyptiens"
 UAR_Stack_the_Government_with_Egyptians_desc:0 "Depuis la crise de Suez, l'Égypte est le centre du monde arabe et un phare pour l'unification arabe. Il est donc tout à fait naturel que les Égyptiens fidèles à l'idée d'une République arabe unie constituent la majorité des responsables gouvernementaux."
 UAR_Nationalize_Syrian_Assets:0 "Nationaliser les actifs syriens"
 UAR_Nationalize_Syrian_Assets_desc:0 "La Syrie est tout autant membre de l'Union que l'Égypte, c'est pourquoi le président Nasser a décidé que la Syrie devrait se soumettre à un programme de nationalisation similaire à celui de l'Égypte afin que son industrie puisse bénéficier à la République dans son ensemble."
 UAR_Integrate_Baathist_Representation:0 "Intégrer la représentation baathiste"
 UAR_Integrate_Baathist_Representation_desc:0 "Le parti Baas est la principale voix du panarabisme en Syrie et le plus fervent partisan de la République. Nous devrions intégrer des membres du parti Baas dans le gouvernement afin de montrer le statut égal de la Syrie au sein de l'Union."
 UAR_Limit_Economic_Centralization_in_Syria:0 "Limiter la centralisation économique en Syrie"
 UAR_Limit_Economic_Centralization_in_Syria_desc:0 "La Syrie est une nation autonome au sein de la République, au même titre que l'Égypte. Nous devrions donc renoncer à une nationalisation à grande échelle à l'intérieur du pays, limiter la centralisation économique et accorder aux Syriens un certain niveau d'autonomie dans leur propre politique économique."
 UAR_Modernize_Al_Azhar:0 "Moderniser Al Azhar"
 UAR_Modernize_Al_Azhar_desc:0 "L'Université Al-Azhar est une université associée à la mosquée Al-Azhar du Caire et est considérée comme l'une des plus prestigieuses du monde arabe avec ses origines remontant à la dynastie fatimide. Nous devrions développer ce centre d'éducation et accroître son importance en tant que phare du monde universitaire arabe."
 UAR_Teach_Evolution_in_Schools:0 "Enseigner l'évolution dans les écoles"
 UAR_Teach_Evolution_in_Schools_desc:0 "Malgré ce que disent les fondamentalistes, c'est un fait depuis que Charles Darwin a publié Sur l'origine des espèces, que l'évolution est la principale théorie scientifique sur le développement humain. Si nous voulons que notre population soit correctement éduquée, nous devons alors imposer un programme d'enseignement axé uniquement sur l'évolution et restreignant les enseignements religieux à l'école."
 UAR_Establish_Coeducational_Education:0 "Établir un enseignement mixte"
 UAR_Establish_Coeducational_Education_desc:0 "Les hommes et les femmes travaillent tous deux pour un avenir meilleur et, en tant que tel, le fait que les femmes soient limitées dans leurs études n'est qu'un obstacle pour notre nation. En élargissant les programmes co-éducatifs au sein des écoles, nous pouvons augmenter la fréquentation féminine et les opportunités académiques."
 UAR_Combat_Wahhabism:0 "Combattre le wahhabisme"
 UAR_Combat_Wahhabism_desc:0 "Parmi toutes les sectes appelant à l'établissement d'un État islamique en Égypte, aucune n'est plus radicale que les wahhabites. Secte restaurationniste ultraconservatrice, les wahhabites cherchent à imposer une interprétation stricte des enseignements islamiques et le respect de la charia. Pour qu'un rêve arabe laïc survive, les wahhabites doivent être contrés à chaque occasion et empêchés de diffuser leur message fondamentaliste, mais cette action risque de provoquer la colère de leurs plus grands partisans, la monarchie saoudienne."
 UAR_Recognize_Alawites_Druze_and_Shia_as_Muslims:0 "Reconnaître les Alaouites, les Druzes et les Chiites comme musulmans"
 UAR_Recognize_Alawites_Druze_and_Shia_as_Muslims_desc:0 "Cheikh Mahmood Shaltoot, le grand imam de l'école théologique d'Al-Azhar, a publié une fatwa déclarant les Alaouites, les Chiites et les Druzes comme étant des musulmans et devant être traités avec le même respect et sans préjugés que les autres musulmans. Souvent considérées au mieux comme marginales, ou au pire comme hérétiques et païennes, ces minorités religieuses ont été exclues d'une grande partie de la société dominante. Cependant, cette nouvelle Fatwa pourrait changer cette attitude et, en la soutenant formellement, pourrait contribuer à intégrer ces minorités religieuses dans la société arabe."
 UAR_Establish_the_Arab_Socialist_Union:0 "Créer l'Union Socialiste Arabe"
 UAR_Establish_the_Arab_Socialist_Union_desc:0 "Depuis la révolution, l'Égypte, puis la République arabe unie, sont devenues un État à parti unique sous différents noms. Cependant, aujourd'hui, le président Nasser a annoncé la création de l'Union socialiste arabe et a décrété qu'elle serait le seul parti légal au sein de la République."
 UAR_Sponsor_Regime_Change_in_Yemen:0 "Changement de régime de parrainage au Yémen"
 UAR_Sponsor_Regime_Change_in_Yemen_desc:0 "Les partisans du panarabisme au Yémen nous ont contactés pour obtenir de l'aide dans le cadre d'un éventuel coup d'État contre leur monarchie tyrannique. Le président Nasser s'intéresse depuis un certain temps déjà au changement de régime au Yémen et, en fournissant des armes, du matériel et même des forces terrestres, nous pourrions parrainer un tel changement et, en cas de guerre civile, assurer une victoire nationaliste."
 UAR_The_National_Charter:0 "La Charte nationale"
 UAR_The_National_Charter_desc:0 "La Charte nationale était une proposition introduite par le président Nasser pour poursuivre la modernisation et les réformes. Principalement concerné par la poursuite de la réforme agraire, l'expansion du pouvoir des travailleurs et les soins de santé, ce projet marquerait la prochaine étape de la politique égyptienne vers une nation moderne et puissante."
 UAR_Womens_Rights:0 "Droits des femmes"
 UAR_Womens_Rights_desc:0 "Les femmes méritent une plus grande participation à notre société et en garantissant un accès égal aux services et des chances égales de progresser dans la société, nous pouvons accroître considérablement la force de notre nation."
 UAR_Increase_the_Minimum_Wage:0 "Augmenter le salaire minimum"
 UAR_Increase_the_Minimum_Wage_desc:0 "Le salaire d'un travailleur doit être égal à la valeur qu'il produit, mais cet idéal ne peut pas être atteint en un jour et des réformes progressives sont donc nécessaires et les bas salaires actuels de notre classe ouvrière sont inacceptables. Une augmentation du salaire minimum requis par les entreprises serait un grand pas vers la réalisation du rêve socialiste."
 UAR_Family_Planning_Programs:0 "Programmes de planification familiale"
 UAR_Family_Planning_Programs_desc:0 "La famille est au coeur de notre nation et un État qui fonctionne nécessite des familles qui fonctionnent. Nous devrions instituer des programmes pour aider les futurs couples à planifier leur avenir et leur donner accès à des ressources qui permettraient aux couples de décider quand ils devraient fonder une famille. Avec une stabilité accrue dans la famille, cela devrait accroître la stabilité de la nation dans son ensemble."
 UAR_Establish_Vocational_Schools:0 "Créer des écoles professionnelles"
 UAR_Establish_Vocational_Schools_desc:0 "La Charte nationale proposée par le président Nasser accorde une grande importance au travail professionnel et aux programmes scolaires pour ceux qui décident de ne pas poursuivre des études supérieures. En respectant cet aspect de la Charte nationale en créant davantage d'écoles professionnelles, cela devrait créer une nouvelle génération de travailleurs instruits et compétents dans les secteurs les plus nécessaires de l'économie."
 UAR_Repress_the_Muslim_Brotherhood:0 "Réprimer les Frères musulmans"
 UAR_Repress_the_Muslim_Brotherhood_desc:0 "Malgré nos efforts pour supprimer les Frères musulmans, il y a encore des membres et des sympathisants qui militent pour l'établissement d'un État islamique au sein de notre nation. Nous devons poursuivre et étendre notre répression contre les Frères musulmans pour assurer la survie de notre pays arabe laïc."
 UAR_Universal_Health_Care:0 "Soins de santé universels"
 UAR_Universal_Health_Care_desc:0 "Les soins de santé sont le service le plus fondamental qu'un gouvernement puisse fournir. Nous devrions légiférer sur l'accès universel, quel que soit le statut patrimonial de chacun, afin de garantir la santé et le bien-être de nos citoyens."
 UAR_Encourage_Secular_Values:0 "Encourager les valeurs laïques"
 UAR_Encourage_Secular_Values_desc:0 "Même si notre gouvernement et nos institutions publiques sont totalement laïcs depuis la révolution, de nombreux établissements et organisations privés continuent d'inclure de nombreux éléments religieux. Nous devrions encourager les valeurs et les modes de pensée laïques au sein de notre population et éroder davantage le contrôle religieux dans la société publique."
 UAR_Strengthen_Soviet_Ties:0 "Renforcer les liens soviétiques"
 UAR_Strengthen_Soviet_Ties_desc:0 "Nos relations avec les pays occidentaux sont restées froides depuis la crise de Suez et notre adoption du socialisme arabe. Notre nation n'est pas encore assez grande pour se présenter sur la scène mondiale sans un sponsor puissant et la nation à choisir est donc l'Union soviétique."
 UAR_Purge_The_Military:0 "Purger l'armée"
 UAR_Purge_The_Military_desc:0 "Le renversement de la monarchie n'a été réalisé que grâce au travail de jeunes et courageux officiers. Afin d'empêcher de nouveaux officiers de répéter nos succès, nous devrions provoquer une légère purge de l'armée et remplacer les rangs par ceux fidèles à Nasser."
 UAR_Mandate_Profit_Sharing:0 "Mandat de participation aux bénéfices"
 UAR_Mandate_Profit_Sharing_desc:0 "Le partage des bénéfices est l'idée selon laquelle chaque travailleur bénéficie du succès global d'une entreprise. En rendant obligatoire la participation aux bénéfices dans les entreprises publiques et privées, nous pouvons accroître l'investissement des travailleurs dans leur travail et permettre au succès d'une entreprise d'inclure également le travailleur."
 UAR_Combat_Rural_Poverty:0 "Combattre la pauvreté rurale"
 UAR_Combat_Rural_Poverty_desc:0 "Beaucoup de nos citoyens qui vivent en dehors des villes restent dans des conditions épouvantables et peinent à s'en sortir. En adoptant un programme d'emploi et en investissant dans ces domaines, nous pouvons réduire la pauvreté dans les zones rurales tout en augmentant la production et l'activité économique."
 UAR_Increase_Political_Repression:0 "Augmenter la répression politique"
 UAR_Increase_Political_Repression_desc:0 "Il y a encore des gens qui s'opposent au projet socialiste arabe du président Nasser et cherchent à détruire tout ce pour quoi nous avons travaillé. La solution logique à ce problème consiste à intensifier la répression contre les critiques de la politique gouvernementale et à éliminer l'opposition au président Nasser."
 UAR_Execute_Sayyed_Qutb:0 "Exécuter Sayyed Qutb"
 UAR_Execute_Sayyed_Qutb_desc:0 "Sayyid Qutb est un islamiste radical qui milite pour l'établissement d'un gouvernement islamique fondamentaliste en Égypte. Il est une épine dans le pied de notre gouvernement laïc depuis des années et le président Nasser a jugé nécessaire de condamner Qutb à mort en justifiant un complot d'assassinat planifié contre le président."
 UAR_Close_the_Straits_of_Tiran:0 "Fermer le détroit de Tiran"
 UAR_Close_the_Straits_of_Tiran_desc:0 "Les tensions avec Israël ont toujours été élevées depuis sa création en 1948. Dans le cadre de l'idéologie panarabe, la terre de Palestine est considérée comme une terre arabe légitime occupée par les sionistes israéliens. Dans le but d'affaiblir Israël, le président Nasser a jugé nécessaire de fermer le détroit de Tiran, stratégiquement important, qui coupe Israël d'une route commerciale majeure."
 
 
 
#Six Days War
 UAR_The_Six_Days_War:0 "La guerre des Six Jours"
 UAR_The_Six_Days_War_desc:0 "En réponse à la fermeture du détroit de Tiran et à l'escalade des tensions, Israël, notre plus grand adversaire, a stupéfié notre état-major militaire en lançant une attaque surprise dans la péninsule du Sinaï. Nos généraux et nos officiers se démènent pour réagir, mais les Israéliens ont actuellement l'avantage et nous devons donc être rapides si nous voulons les repousser."
#Victory
 UAR_The_Partial_Liberation_of_Palestine:0 "La libération partielle de la Palestine"
 UAR_The_Partial_Liberation_of_Palestine_desc:0 "Dans une tournure d'événements qui ont stupéfié le monde, notre grande et courageuse armée a repoussé l'assaut israélien, prouvant une fois de plus la force du monde arabe. Les Arabes du monde entier célèbrent cela comme un tournant dans la lutte contre le sionisme et comme le fait que le peuple palestinien ait enfin l'espoir de se libérer."
 UAR_Revitilize_the_Pan_Arabian_Movement:0 "Revitaliser le mouvement panarabe"
 UAR_Revitilize_the_Pan_Arabian_Movement_desc:0 "Avec la victoire contre Israël, le prestige du président Nasser n'a jamais été aussi élevé et les Arabes du monde entier se tournent vers lui pour son leadership. Le président Nasser a décidé de profiter de cet élan pour raviver le mouvement panarabe en déclin et unir les Arabes sous un même drapeau."
 UAR_Expulsion_of_the_Jewish_Population:0 "Expulsion de la population juive"
 UAR_Expulsion_of_the_Jewish_Population_desc:0 "Les colons juifs des régions de Palestine désormais libérées occupent illégalement leurs terres depuis bien trop longtemps. Il est temps de les expulser et de restituer les terres à leurs propriétaires légitimes."
 UAR_Undermine_the_Hashmites:0 "Saper les Hachémites"
 UAR_Undermine_the_Hashmites_desc:0 "Les Hachémites sont de fervents opposants au mouvement panarabe nassérien, mais avec la chute de la monarchie en Irak, la Jordanie se retrouve seule. Nous devrions encourager la dissidence et le sentiment anti-monarchique au sein du pays afin de saper la dynastie désuète."
 UAR_The_Integration_of_Liberated_Palestine:0 "L'intégration de la Palestine libérée"
 UAR_The_Integration_of_Liberated_Palestine_desc:0 "Les Palestiniens des régions nouvellement libérées seront éternellement reconnaissants de notre rôle dans leur libération. Les responsables de l'OLP, en remerciement pour notre aide, ont officiellement demandé que la Palestine devienne un État autonome et rejoigne le mouvement panarabe en pleine croissance."
 UAR_Destabilize_Saudi_Arabia:0 "Déstabiliser l'Arabie Saoudite"
 UAR_Destabilize_Saudi_Arabia_desc:0 "La Maison des Saoud occupe actuellement la péninsule arabique d'où les Arabes tirent leur nom. Nous devrions soutenir les mouvements anti-monarchiques à l'intérieur du pays pour le déstabiliser et contribuer à affaiblir les tyrans saoudiens."
 UAR_Preperations_for_an_Jordanian_Uprising:0 "Préparatifs d'un soulèvement jordanien"
 UAR_Preperations_for_an_Jordanian_Uprising_desc:0 "Tout comme notre ancienne monarchie, les Hachémites sont considérés par beaucoup comme des marionnettes corrompues des Britanniques. Nous devrions soutenir secrètement les mouvements anti-hachémites en Jordanie et préparer le pays à une éventuelle révolution."
 UAR_Combat_Rising_Unemployment:0 "Combattre la hausse du chômage"
 UAR_Combat_Rising_Unemployment_desc:0 "Avec l'expulsion de la population juive, de nombreuses entreprises et industries importantes ont été abandonnées, entraînant un chômage généralisé parmi les Palestiniens des régions libérées. Nous devrions redistribuer ces industries désormais vides et fournir une protection sociale accrue pour aider à lutter contre le chômage."
 UAR_Resettle_Palestinian_Refugees:0 "Réinstaller les réfugiés palestiniens"
 UAR_Resettle_Palestinian_Refugees_desc:0 "La libération de la Palestine n'est pas passée inaperçue auprès de la diaspora palestinienne au sens large et de nombreux réfugiés à travers l'Égypte et même dans d'autres pays migrent vers l'État de Palestine. Nous devrions aider ces migrants à réinstaller de nombreuses villes désormais vides et à les intégrer dans la société au sens large."
 UAR_The_Liberation_of_Arabia:0 "La libération de l'Arabie"
 UAR_The_Liberation_of_Arabia_desc:0 "L'Arabie est la patrie de tous les Arabes et, depuis plusieurs décennies, elle est injustement occupée par la maison des Saoud. Adeptes de la secte islamique radicale des wahhabites, la maison des Saoud impose depuis trop longtemps une loi religieuse stricte à sa population. Le moment est venu de libérer les Arabes arabes de leurs tyrans monarchiques et de les intégrer au mouvement panarabe plus large."
 UAR_Encourage_Arab_Economic_Cooperation:0 "Encourager la coopération économique arabe"
 UAR_Encourage_Arab_Economic_Cooperation_desc:0 "Même si le monde arabe n'est pas encore politiquement uni, la première étape vers l'unification est l'interdépendance économique. Nous devrions encourager les entreprises des autres pays arabes afin de favoriser un sentiment de coopération et de besoin mutuel qui pourrait éventuellement conduire à des appels à l'unification politique."
 UAR_Remilitarize_Umm_al_rashrash:0 "Remilitariser Um al rashrash"
 UAR_Remilitarize_Umm_al_rashrash_desc:0 "Malgré notre victoire dans la guerre, Israël reste une menace toujours présente, nous devons fortifier notre territoire récemment acquis pour nous défendre contre toute éventuelle agression israélienne future."
 UAR_Nasserism_Triumphant:0 "Le Nassérisme triomphant"
 UAR_Nasserism_Triumphant_desc:0 "Le président Gamal Abdel Nasser est devenu le symbole de la coopération panarabe et de la résistance à l'impérialisme étranger. L'idéologie nassériste est étudiée dans les écoles, des images de Nasser peignent les rues et les Arabes de toute la région crient de plus en plus fort chaque jour qui passe en faveur d'une Arabie unie sous la direction du président Nasser."
 UAR_The_Center_of_the_Arabic_World:0 "Le centre du monde arabe"
 UAR_The_Center_of_the_Arabic_World_desc:0 "Le Caire a éclipsé la ville sainte de La Mecque en tant que centre du monde arabe. Les Arabes de la région se tournent désormais vers le Caire et son gouvernement pour leur leadership, et le Caire est devenu la référence en matière de culture arabe dominante. Avec l'afflux quotidien d'Arabes pour vivre dans la ville, il est devenu indéniable que Le Caire est désormais le coeur du monde arabe."

UAR_Undermine_the_Hashemites:0 "Saper les Hachémites"
 UAR_Appoint_Marshall_Amer_Vice_President:0 "Nommer le maréchal Amer vice-président"
 UAR_Appoint_Marshall_Amer_Vice_President_desc:0 "Le maréchal Amer est une figure presque aussi célèbre que le président Nasser lui-même. Héros de guerre qui a dirigé nos forces armées victorieuses dans la guerre contre Israël, son influence politique continue de croître de jour en jour. Pour garantir sa loyauté envers la République et le président Nasser, de nombreux membres du gouvernement ont proposé de nommer le maréchal Amer au poste de vice-président de la République arabe unie."
 UAR_Appoint_Hafez_Assad_Vice_President:0 "Nommer Hafez Assad vice-président"
 UAR_Appoint_Hafez_Assad_Vice_President_desc:0 "Hafez al-Assad s'est hissé à l'avant-garde du parti baasiste syrien ces dernières années et détient une influence incommensurable dans la région et agit comme la figure de proue de ceux qui craignent un monde arabe dominé par l'Égypte. Pour montrer que tous les Arabes sont égaux et obtenir le soutien du parti Baas, Nasser a proposé de nommer Assad au poste de vice-président de la République arabe unie."
 
#Defeat
 UAR_an_Naksah:0 "une Naksah"
 UAR_an_Naksah_desc:0 "Le monde arabe a subi une nouvelle humiliation de la part des impérialistes sionistes. L'attaque surprise contre nos forces s'étant révélée trop écrasante, notre gouvernement n'a eu d'autre choix que de reconnaître sa défaite dans la guerre."
 UAR_Arrest_Egyptian_Jews:0 "Arrêter les Juifs égyptiens"
 UAR_Arrest_Egyptian_Jews_desc:0 "Avec notre défaite une fois de plus aux mains de l'État israélien, nombreux sont ceux qui ont commencé à chercher quelqu'un à blâmer dans leur frustration. En Égypte, il existe une importante population juive qui habite la région depuis des milliers d'années, mais de nombreux Égyptiens croient désormais que ces Juifs sympathisaient avec l'ennemi et le soutenaient peut-être même activement. Afin de garantir la sécurité de l'État, le président a décidé de s'attaquer à ce problème juif potentiel."
 UAR_Settle_Palestinian_Refugees:0 "Réinstaller les réfugiés palestiniens"
 UAR_Settle_Palestinian_Refugees_desc:0 "Le peuple palestinien a été une fois de plus contraint de fuir ses foyers à cause de l'agression israélienne. Avec la perte de leur patrie, beaucoup vivent désormais comme réfugiés dans les pays arabes voisins. Nous devrions nous lancer dans un programme de réinstallation et d'intégration de ces réfugiés afin qu'ils puissent enfin avoir un chez-soi."
 UAR_Encourage_Exports:0 "Encourager les exportations"
 UAR_Encourage_Exports_desc:0 "Le président Nasser a décidé de rééquilibrer la politique commerciale égyptienne actuelle en augmentant le montant des exportations de notre pays afin de tirer davantage de richesse des ressources de notre pays."
 UAR_Political_Liberalization:0 "Libéralisation politique"
 UAR_Political_Liberalization_desc:0 "Avec la défaite de la guerre, le prestige et la réputation du président Nasser ont été considérablement touchés. Dans un effort pour tenter de consolider le soutien populaire, le président Naser a décidé de lever bon nombre des restrictions antérieures à l'activité politique et à la liberté d'expression."
 UAR_Economic_Liberalization:0 "Libéralisation économique"
 UAR_Economic_Liberalization_desc:0 "Les programmes de nationalisation des années précédentes se sont révélés utiles pour le développement de l'économie égyptienne. Cependant, maintenant que l'économie est modernisée et que la croissance économique a commencé à ralentir, le président Nasser a décidé de mettre en oeuvre un programme de libéralisation économique pour accroître l'entreprise privée et les investissements."
 UAR_Support_the_PLO:0 "Soutenir l'OLP"
 UAR_Support_the_PLO_desc:0 "Même si nous avons été vaincus dans la guerre, notre soutien à la lutte de libération palestinienne n'a pas faibli. Nous devrions accroître notre soutien à l'OLP, la principale organisation de la résistance palestinienne, mais comme elle est basée en Jordanie, cela pourrait potentiellement avoir des effets négatifs pour notre pays arabe."
 UAR_Purge_Amer:0 "Purger Amer"
 UAR_Purge_Amer_desc:0 "Le maréchal Amer est devenu la personnification de la défaite et de l'humiliation d'Israël. Lui et plusieurs autres officiers ont été arrêtés pour trahison en raison de leur échec dans la guerre. Malheureusement, Amer a connu une fin tragique avant de pouvoir être jugé."
 UAR_Reduce_Political_Repression:0 "Réduire la répression politique"
 UAR_Reduce_Political_Repression_desc:0 "Dans le cadre des efforts de libéralisation politique du président Nasser, les arrestations effectuées par les forces de sécurité ont diminué et l'activisme politique n'est plus considéré comme une condamnation à perpétuité. La réduction de la répression entraînera probablement une augmentation du soutien à des organisations dangereuses telles que les Frères musulmans, mais le président a jugé ce risque nécessaire."
 UAR_Fortify_the_Suez_Frontlines:0 "Fortifier les lignes de front de Suez"
 UAR_Fortify_the_Suez_Frontlines_desc:0 "Le canal de Suez est la route commerciale la plus vitale au monde, reliant la Méditerranée à la mer Rouge. La majorité des transports maritimes mondiaux passe par le canal. Malheureusement, il est désormais devenu la ligne de front du conflit israélo-arabe et il est donc nécessaire de construire des défenses le long de notre côté du canal pour empêcher les Israéliens d'en obtenir le contrôle total."
 UAR_Sack_the_Military_Ministers:0 "Limoger les ministres militaires"
 UAR_Sack_the_Military_Ministers_desc:0 "L'état-major militaire actuel s'est révélé au mieux incompétent et au pire traître. Le président Nasser a décidé de limoger la plupart des ministres militaires et de recruter de nouveaux professionnels, plus fidèles, pour combler le vide."
 UAR_Reform_the_Arab_Socialist_Union:0 "Réformer l'Union Socialiste Arabe"
 UAR_Reform_the_Arab_Socialist_Union_desc:0 "L'Union socialiste arabe s'inspire toujours du gouvernement répressif d'antan. Dans un effort pour poursuivre la libéralisation politique, le président Nasser, en tant que chef du parti, a décidé de restructurer et de réformer la direction du parti et de créer une Union socialiste arabe plus compétente."
 UAR_Restore_Boghdadi_as_Vice_President:0 "Restaurer Boghdadi en tant que vice-président"
 UAR_Restore_Boghdadi_as_Vice_President_desc:0 "L'un des membres fondateurs du mouvement des Officiers Libres et une figure importante de la révolution de 1952, Abdel Latif Boghdadi fut vice-président de l'Égypte pendant les premières années de la présidence de Nasser. Cependant, un désaccord sur ce qu'il pensait être l'adoption par Nasser d'une politique économique de style plus soviétique et un désaccord sur la création de relations plus étroites avec les États-Unis ont conduit Boghdadi à démissionner de son poste. Cependant, grâce aux récents efforts de libéralisation politique et économique, le président Nasser s'aligne davantage sur les idéaux de Boghdadi. Nous devrions rendre Boghdadi comme vice-président légitime et bras droit de Nasser."
 UAR_Keep_Sadat_Vice_President:0 "Gardez Sadate vice-président"
 UAR_Keep_Sadat_Vice_President_desc:0 "Anwar Sadat était un membre éminent du mouvement des Officiers Libres et a toujours été un proche confident du président Nasser. Beaucoup le considèrent comme le protégé politique de Nasser et le candidat le plus susceptible de succéder à Nasser si quelque chose lui arrivait. Il a fidèlement et loyalement servi Nasser en tant que vice-président au fil des années, et bien qu'il ait été en désaccord avec Nasser à certaines occasions, il n'y a aucune raison de bouleverser l'administration en le remplaçant."
 UAR_Accept_the_Rogers_Plan:0 "Acceptez le forfait Rogers"
 UAR_Accept_the_Rogers_Plan_desc:0 "Le président Nasser a accepté la proposition du secrétaire d'État américain William Rogers. Le plan est une esquisse globale d'une voie à suivre pour mettre fin au conflit israélo-arabe, et bien que certains le dénoncent comme étant trop pro-israélien, le président Nasser y a vu une opportunité de regagner le Sinaï, de donner aux Palestiniens une chance de rentrer chez eux et d'accroître la position de l'Égypte auprès des grandes puissances."
 
 SIX_DAYS_WAR.100.d:0 "Le ministère de la Défense a récemment reçu une proposition d'officiers subalternes du renseignement visant à mettre en oeuvre une mise à niveau des capacités de télécommunication des institutions gouvernementales et militaires. La proposition note que le système actuel date de plusieurs décennies et, selon l'analyse, semble vulnérable à l'interception ennemie. Plus important encore, ils notent une forte sollicitation du système, car en temps de guerre, cela peut conduire à des pannes qui limiteraient considérablement la capacité des commandants à diriger les forces. Lorsque les officiers supérieurs et les ministres ont donné leur avis, ils ont déclaré que le système actuel est plus que performant et que la proposition semble être un effort de la part de ces officiers subalternes pour élever leur position et profiter du processus. En effet, il est à noter que la mise à niveau proposée serait très coûteuse et pourrait avoir un impact sur l'acquisition d'équipements vitaux pour l'armée. Dans cette optique, le gouvernement doit réfléchir à l'opportunité d'approuver ou non la proposition."
 SIX_DAYS_WAR.1.d:0 "Les forces israéliennes ont lancé leur invasion préventive du Sinaï. L'armée égyptienne s'est rapidement retrouvée face à une attaque concentrée dans le nord et le centre du Sinaï, contre toute attente. Les unités terrestres israéliennes se déplaçant rapidement flanquaient et écrasaient les unités égyptiennes à la frontière. Quelques heures après le début des hostilités, les forces égyptiennes étaient dans un désarroi presque total, avec des unités coupées et des systèmes de communication débordés. Les hauts dirigeants du Caire ne semblent pas comprendre la situation sur le terrain et il semble désormais que la résistance de l'armée égyptienne s'effondre. De nombreuses forces se replient déjà vers Suez."
 SIX_DAYS_WAR.2.d:0 "Il faudra bientôt appeler les dirigeants syriens et jordaniens pour les informer de la situation actuelle dans le Sinaï. Certains conseillers croient qu'il faut les informer de la vérité sur les situations. Que nous avons subi de lourdes pertes en matériel et en soldats. Plus important encore, la situation dans le Sinaï s'est détériorée au point de devenir une route complète pour nos forces. D'autres conseillers craignent que la révélation de telles nouvelles ne les amène à trahir la cause arabe et à nous laisser seuls face à l'ennemi sioniste. Ils veulent que nous rejetions les affirmations israéliennes de victoires comme de la propagande et que nous déclarons que nous avons infligé de lourdes pertes à leurs avions et que nos forces sont sur le point d'entrer dans les frontières de la nation sioniste elle-même. Cela les pousserait à intervenir et à réduire la pression sur nos forces. À l'approche du moment où nous devons prendre la décision, nous devons décider si nous devons ou non dire la vérité."
 SIX_DAYS_WAR.3.d:0 "En apprenant que nos frères égyptiens affrontent les sionistes dans une lutte brutale, nous avons décidé de lancer nos propres assauts contre les sionistes. Cela libérera les terres arabes et exercera suffisamment de pression sur leurs frontières pour que la maison corrompue du mensonge et de la fausse nation s'effondre bientôt. Les commandants militaires sur le terrain pensent que l'ennemi est concentré dans le Sinaï et que nos forces submergeront facilement les forces faibles à nos frontières. La victoire sera décisive. Bien que les premiers rapports indiquent une forte résistance de la part de l'ennemi, nous nous attendons à ce que des nouvelles de victoires suivent bientôt. Nous respectons nos voeux sacrés envers le peuple arabe."
 SIX_DAYS_WAR.5.d:0 "Notre offensive combinée dans la patrie sioniste s'est avérée être un magnifique succès. Leurs soldats et leur peuple manquaient de détermination pour résister au courage et aux compétences de nos courageux soldats et pilotes. Les gens sont descendus dans les rues du monde arabe pour célébrer notre grande victoire. Des milliers d'Arabes déplacés pendant la Nakba attendent avec impatience l'opportunité de retourner sur leurs terres libérées. Pour le moment, le commandement militaire arabe conjoint continuera à fonctionner pour s'occuper des prisonniers, en patrouillant le long de la ligne de cessez-le-feu et en veillant à ce que les sionistes ne tentent aucun stratagème. Mais pour le moment, il est clair pour le monde que nous avons triomphé."
 SIX_DAYS_WAR.17.d:0 "La lâche tentative sioniste de détruire notre force aérienne s'est soldée par un échec pour eux. Cet acte d'agression pure et simple ne peut rester injustifié. Les dirigeants ont approuvé l'ordre donné à nos forces courageuses dans le Sinaï de mener la bataille contre l'ennemi et d'envahir les terres qu'ils ont volées en 1948. Les officiers et les soldats sont confiants et de bonne humeur suite aux récents succès. Ils ont attendu cette commande pendant des années et le moment est venu. Nous espérons que les sionistes résisteront, mais nous sommes convaincus qu'avec cette initiative, nos forces écraseront toute opposition. Avec notre puissance aérienne préservée, cela facilitera grandement notre avance."
 SIX_DAYS_WAR.21.d:0 "Le président au Caire a reçu un message d'Eilat annonçant la chute de la forteresse sioniste. Il s'agit de la plus grande réussite des forces armées dans ce conflit. Le monde arabe a toujours considéré que nous étions sa Prusse et jusqu'à présent, nous avons dépassé ces attentes. Grâce à leur endurance et à leur habileté, nos forces ont avancé de manière experte dans le désert occidental du Néguev, libérant les terres arabes et les tribus bédouines. De là, nous nous sommes dirigés vers la ville sioniste d'Eilat. Son port et son aérodrome sur la mer Rouge sont essentiels pour l'économie sioniste et leur perte n'est pas seulement un coup économique majeur mais rendra leur économie vulnérable à l'avenir. Le commandant militaire a déjà été autorisé à établir un gouvernement militaire à Eilat et à garder sous contrôle ses résidents sionistes pour empêcher l'émergence d'une cinquième colonne."
 SIX_DAYS_WAR.25.d:0 "Depuis la Nakba, les sionistes se sont engagés dans une vicieuse campagne de violence et d'oppression contre les Arabes. Ils s'immiscent dans nos affaires et infligent des souffrances à des innocents, en particulier à ceux qui ont été expulsés de leurs anciennes demeures. Ces dernières années, nous avons construit une machine de guerre impressionnante, qui fait la fierté du monde arabe. De plus, la situation internationale actuelle et la ferveur de notre peuple favorisent l'action et le moment est venu de prouver que nous sommes la Prusse des Arabes. Après avoir reçu des ordres du Caire, nos puissantes forces militaires du Sinaï sont entrées en action et ont commencé leur avancée vers les terres arabes occupées et exploitées depuis longtemps par les sionistes. Même si la communauté internationale n'appréciera pas cette action, nous avons pris l'élément de surprise et d'initiative de la part de l'ennemi, ce qui nous aidera sans aucun doute à vaincre les défenses sionistes."
 SIX_DAYS_WAR.35.d:0 "Le gouvernement israélien a accepté de capituler face aux demandes syriennes concernant les droits sur l'eau du Jourdain. C'était la principale exigence de la Syrie après sa victoire lors de la récente guerre avec Israël. L'armée syrienne s'est jointe à ses compatriotes arabes, la Jordanie et l'Égypte, pour vaincre Israël. Bien que les Israéliens aient pu empêcher une capitulation totale, ils ont été contraints de faire des concessions territoriales et économiques avec leurs ennemis. Pour la Syrie, le différend sur les droits à l'eau a dominé le conflit avec Israël. Les deux États se sont longtemps accusés mutuellement de tenter de voler l'eau, essentielle à leurs économies respectives. La Syrie espère qu'avec les droits désormais acquis après sa victoire, elle pourra connaître une révolution agricole. En Israël, la crainte est largement répandue que cette concession entraîne des pénuries d'eau et un désastre économique."
 SIX_DAYS_WAR.36.d:0 "Bien que les Jordaniens semblent être le plus réticent des États arabes impliqués dans la récente guerre avec Israël, ils ont engagé leurs forces et sont sortis victorieux du conflit, aux côtés de leurs alliés. Bien qu'Israël ait évité une capitulation totale, sa défaite militaire l'oblige à faire des concessions économiques et territoriales à ses adversaires. Après d'intenses discussions, les Jordaniens ont annoncé qu'Israël céderait Jezreel et ses environs. Les Jordaniens prétendent avoir libéré les Arabes, en particulier les Arabes chrétiens de la région et de leurs terres saintes, du régime oppressif d'occupation israélien. La nouvelle de cet accord voit de nombreux réfugiés arabes de 1948 se diriger vers la frontière afin de rentrer chez eux. Les résidents souhaitant rester en Israël sont invités à quitter ou à accepter la nouvelle administration jordanienne."
 SIX_DAYS_WAR.37.d:0 "La République arabe unie (RAU) a signé son accord final pour mettre fin à la récente guerre qui l'oppose à Israël. Dans cet accord, Israël a accepté de céder le Néguev occidental aux forces d'occupation de la RAU. Pendant la guerre, les forces de la RAU avaient avancé jusqu'à Eilat, mais une contre-offensive avant le cessez-le-feu a permis à Israël de reprendre Eilat. Cette victoire de dernière minute a permis à Israël de n'avoir qu'à céder une région désertique peu peuplée au lieu de perdre une ville et un port vitaux. La RAU présente l'accord comme une victoire totale, affirmant qu'elle a libéré les Bédouins arabes de la région et qu'elle est désormais placée pour punir la patrie israélienne si elle tente de futures agressions. De nombreuses personnes au Caire sont descendues dans la rue pour célébrer cette annonce, mais de nombreux observateurs notent que les Israéliens seront probablement soulagés d'avoir gardé Eilat, ce qui pourrait s'avérer vital pour sa reconstruction d'après-guerre."
 SIX_DAYS_WAR.38.d:0 "La République arabe unie (RAU) a signé son accord final pour mettre fin à la récente guerre qui l'oppose à Israël. Dans cet accord, Israël a accepté de céder le Néguev occidental et Eilat aux forces d'occupation de la RAU. Pendant la guerre, la RAU et les forces israéliennes se sont livrées à des combats brutaux, mais les forces de la RAU ont pu avancer et capturer Eilat. Une contre-attaque tardive d'Israël pour reprendre la ville s'est soldée par un échec et beaucoup en Israël considèrent la perte d'Eilat comme catastrophique. Pour l'UAR, l'ambiance est à l'extase alors que les gens sont descendus dans la rue. Le gouvernement de la RAU a annoncé que l'accord confirmait sa victoire. Ils prétendent avoir libéré les terres arabes occupées et les résidents bédouins de ses nouveaux territoires. Il ajoute également qu'en contrôlant Eilat, la RAU dispose désormais d'un pont vers le reste du monde arabe."
 SIX_DAYS_WAR.39.d:0 "Malgré sa vaste campagne de propagande, l'Égypte ne peut cacher la réalité : elle a subi une défaite écrasante aux mains d'Israël. Les forces israéliennes contrôlent désormais le Sinaï et occupent les Arabes palestiniens à Gaza. L'armée égyptienne, malgré ses prétentions de supériorité d'avant-guerre, s'est révélée incapable de gérer l'armée israélienne qui a utilisé des tactiques, une coordination et des compétences efficaces pour remporter une victoire éclatante. Beaucoup en Israël soutiennent l'occupation du Sinaï, estimant qu'elle offre à Israël un tampon à partir duquel surveiller et contrôler une future agression égyptienne. Le gouvernement égyptien et ses alliés condamnent déjà l'occupation israélienne, la qualifiant d'illégale et de menace pour la paix future dans la région. Quoi qu'il en soit, Israël reste triomphant et ses acquis incontestés." #Israeli Victory Against the UAR (Global)
 SIX_DAYS_WAR.40.d:0 "Le gouvernement israélien a confirmé aujourd'hui sa victoire sur la Syrie en annonçant qu'il continuera de contrôler le plateau du Golan. Le plateau du Golan et son terrain difficile semblent être le principal avantage défensif des forces syriennes. Cependant, au cours de la récente guerre, les forces israéliennes ont réussi à submerger et à reprendre la zone aux mains de l'armée syrienne. Les forces syriennes n'ont pas réussi à contre-attaquer ni à arrêter les forces israéliennes. Avec le cessez-le-feu, il est devenu clair que les Israéliens avaient pris le Golan et que les efforts militaires syriens avaient en grande partie pris fin. Avec cette victoire, beaucoup en Israël pensent que le pays a acquis une frontière défensive naturelle pour mieux protéger le pays d'une future agression de la Syrie." #Israeli Victory Against Syria (Global)
 SIX_DAYS_WAR.42.d:0 "Le gouvernement jordanien a reconnu que la Cisjordanie reste sous occupation israélienne. Cela confirme la victoire majeure remportée par Israël dans la récente guerre. Les forces israéliennes ont réussi à vaincre les Jordaniens et à sécuriser la Cisjordanie afin de mieux soutenir ses autres acquis et d'assurer la sécurité de Jérusalem. La Cisjordanie abrite de nombreux Palestiniens arabes et est actuellement sous le gouvernement militaire israélien. On dit que les Israéliens sont ravis de ces victoires. Il existe également une immense pression internationale sur Israël et les États arabes pour qu'ils ne voient pas se répéter la crise des réfugiés de 1948. De nombreux habitants de Cisjordanie sont actuellement incertains quant à l'avenir. Les Jordaniens sont largement humiliés et se trouvent désormais à l'est du Jourdain. En Israël, nombreux sont ceux qui estiment que le pays dispose désormais d'un espace lui permettant de croître en prospérité." #Israeli Victory Against Jordan (Global)
 SIX_DAYS_WAR.0.d:0 "Les récentes provocations arabes dans le Sinaï ainsi que la fermeture du détroit de Tiran ont amené le Premier ministre à convoquer une réunion de hauts responsables du cabinet et de l'armée pour discuter d'une réponse. Lors de la réunion, l'agence de renseignement a déclaré qu'elle ne pensait pas que l'Amérique interviendrait pour résoudre les récentes tensions. Cela a incité plusieurs généraux de haut rang, dont Yitzhak Rabin, Arial Sharon et Moshe Dayan, à demander une frappe préventive avant que l'ennemi ne frappe le premier. Le Premier ministre a répondu en appelant au calme et en affirmant sa conviction que l'Amérique aiderait à résoudre la situation. Les généraux sont presque rebelles dans leurs critiques à l'égard du Premier ministre et de sa position. C'est au gouvernement de décider s'il lance une frappe préventive ou d'attendre et d'espérer une désescalade de la situation. La frappe initiale prévue serait une attaque audacieuse et totale visant à détruire l'armée de l'air égyptienne, baptisée Opération Moked."
 SIX_DAYS_WAR.31.d:0 "Malgré l'audace du plan et les immenses compétences de nos pilotes, l'opération Moked s'est soldée par un échec. Il semble que nos avions manquaient d'élément de surprise puisque les observateurs égyptiens et les équipes radar étaient capables de communiquer le mouvement de nos chasseurs. Les efforts visant à interrompre ou à submerger les systèmes de communication ont échoué. Bien que la vitesse de notre attaque ait laissé de nombreux avions arabes à découvert, les tirs antiaériens nourris et le brouhaha de plusieurs avions ennemis ont grandement perturbé l'attaque. De nombreuses bombes ont raté leurs cibles et les efforts visant à mitrailler les combattants ennemis au sol n'ont pas été possibles ni précis. Nous avons perdu plusieurs chasseurs et n'avons pas infligé les dégâts réclamés par l'opération Focus. Cet échec nous place désormais en guerre contre un ennemi arabe possédant une force aérienne intacte et nous devons désormais nous battre pour protéger notre espace aérien et notre population." #Operation Moked Failure
 SIX_DAYS_WAR.30.d:0 "L'étroite coopération entre l'armée de l'air et les services de renseignement a permis le brillant succès de l'opération Focus. Nos combattants se déplaçaient sous la couverture radar arabe tandis que les agents des renseignements perturbaient les communications ennemies, empêchant tout avertissement pour notre opération. Une fois que les avions ont atteint les aérodromes ciblés, ils ont commencé les bombardements et les mitraillages. La défense égyptienne était tout à fait insuffisante car la plupart des avions étaient sur les pistes et les hangars ne semblaient pas construits pour résister aux bombes. D'après les interceptions des services de renseignement et les photographies prises par nos combattants attaquants, nous pouvons confirmer que des centaines d'avions arabes ont été détruits. Beaucoup de ces pistes sont également gravement endommagées. Les forces anti-aériennes ennemies n'ont eu aucun avertissement et au moment où elles se sont mises en position, nous étions déjà rentrés chez nous. Nos courageux pilotes planifient déjà des frappes de suivi contre des cibles militaires arabes dans le Sinaï pour aider nos forces terrestres à réussir leurs opérations. » #Opération moked Success"
 SIX_DAYS_WAR.4.d:0 "Les Arabes en Syrie ont cherché à profiter de notre crise et à enfoncer un poignard dans notre patrie. Les forces ennemies manquent de discipline, de compétences et d'entraînement comme nos propres forces, mais elles ont néanmoins progressé à la frontière. En réponse, nous avons rassemblé nos forces et lancé une contre-attaque contre eux. Grâce à notre supériorité aérienne, les commandants sur le terrain sont convaincus que les avancées réalisées par l'ennemi seront inversées. Les communications interceptées indiquent que les Arabes sont nerveux et incertains, ils ne pourront pas nous résister si nous les repoussons." #Israeli Perspective Counter-Attacking Syria
 SIX_DAYS_WAR.41.d:0 "Les Arabes de Jordanie, poussés à l'action par les autres Arabes, ont lancé une attaque sur nos terres. Cet ennemi s'est révélé difficile lors de notre lutte pour l'indépendance, mais nous sommes beaucoup plus forts aujourd'hui et il n'agit pas avec conviction. Nous avons rassemblé nos forces et lancé une contre-attaque contre eux. Grâce à notre supériorité aérienne, les commandants sur le terrain sont convaincus que les avancées réalisées par l'ennemi seront inversées. Nous ne nous attendons pas à ce qu'ils soient capables de nous résister et nous sommes convaincus qu'ils seront repoussés de leurs gains mineurs." #Israeli Perspective Counter-Attacking Jordan
 SIX_DAYS_WAR.6.d:0 "Malgré la confiance de nos commandants et la solidité de notre stratégie, notre contre-attaque contre les intrus arabes a échoué. Ils se sont montrés des défenseurs tenaces et, malgré nos avantages évidents, se sont suffisamment bien positionnés pour contrer nos mouvements. Le cabinet a exprimé sa déception à l'égard des militaires pour leur incapacité à atteindre les résultats escomptés. Partout en Israël règne un sentiment de déception et de peur quant à ce qui va se passer maintenant que l'ennemi reste sur nos terres. Une réunion d'urgence du cabinet et de l'armée devrait bientôt examiner les options." #Failed Counter-Attack (Israeli Perspective)
 SIX_DAYS_WAR.7.d:0 "Les dangereux desseins arabes contre nous sont clairs depuis longtemps. S'ils tardent à agir, ils risquent seulement de s'organiser et de nous frapper au moment de leur choix. Après mûre réflexion, les dirigeants militaires ont présenté au cabinet un plan visant à neutraliser de manière préventive les Arabes en Syrie et en Jordanie. Malgré la condamnation internationale qui pourrait résulter de cette action, la survie de la nation est en jeu. Le cabinet l'a reconnu et a approuvé le plan. Ce matin, les courageux soldats et pilotes des Forces de défense israéliennes sont entrés en action. Ils ont franchi efficacement les deux frontières et la nation attend avec impatience des nouvelles positives de ces offensives." #Israel Perspective Launch Offensives Against Syria/Israel (Jordan and Syria did not attack first)
 SIX_DAYS_WAR.15.d:0 "La Cisjordanie est tombée aux mains de nos soldats victorieux après d'intenses combats. Le cabinet a approuvé un décret donnant au commandant militaire de la région un contrôle administratif total et plaçant la Cisjordanie sous gouvernement militaire. La prise de la Cisjordanie n'était pas prévue à l'origine, mais alors que nos forces éliminaient la résistance arabe dans la région, il est devenu évident que contrôler la Cisjordanie et disposer d'une frontière défendable sur le fleuve Jourdain étaient essentiels pour la sécurité de nos autres gains dans la région. La région abrite une importante population arabe, mais avec une sécurité adéquate en place, cela ne devrait pas poser de problème majeur. Plus important encore, la Vieille Ville de Jérusalem et le Mont du Temple sont désormais entre nos mains ; pour la première fois depuis deux mille ans, le Mont du Temple est entre les mains des Juifs." #Israeli Perspective Seizes the West Bank
 SIX_DAYS_WAR.151.d:0 "Le cabinet avait âprement débattu de l'opportunité d'attaquer le plateau du Golan occupé par les Arabes. On craignait que le terrain difficile entraîne de lourdes pertes pour peu de gains contre un ennemi retranché. Cependant, le manque de détermination et de capacité démontré par l'ennemi a montré clairement que le Golan n'était peut-être pas aussi dangereux qu'on le pensait initialement. Sous l'impulsion et les ordres de Moshe Dayan, deux brigades ont lancé l'assaut et après une journée de résistance acharnée, elles ont submergé l'ennemi. Les Arabes n'ont pas réussi à contre-attaquer et il est clair que nous contrôlons désormais le plateau du Golan. Nos forces ont commencé à se retrancher et à veiller à ce que nous ne soyons pas facilement délogeés." #Israeli Perspective Seizes Golan Heights
 SIX_DAYS_WAR.19.d:0 "Les Arabes du nord ont progressé dans notre pays. Nous savons qu'ils n'ont pas les capacités ni le tact de nos propres soldats, mais le grand nombre de forces et de blindés ennemis ont submergé les défenses initiales de la frontière. Nos commandants ont maintenant évalué la situation et ce matin, nos forces ont lancé une contre-attaque pour repousser les Arabes vers Damas. Même si l'armée est confiante, elle a fait remarquer au cabinet que nos troupes auront du mal à faire appel à un appui aérien lourd ou à se concentrer en grand nombre. Le manque de supériorité aérienne signifie qu'un grand nombre de nos chasseurs sont déterminés à défendre l'espace aérien. Cela signifie également que nos forces risquent une attaque aérienne ennemie si elles se concentrent en une force trop importante à découvert. Cependant, malgré ces défis, la victoire sera sans aucun doute au rendez-vous." #Israeli Perspective Counter-Attacking Syria (OP Focus Failed)
 SIX_DAYS_WAR.191.d:0 "Les Arabes de l'Est ont progressé dans notre pays. Nous savons qu'ils n'ont pas la détermination de nos propres soldats, mais les avantages de concentrer leurs forces sur un seul front et leur expérience leur ont permis de submerger dans un premier temps nos faibles défenses frontalières. Nos commandants ont maintenant évalué la situation et ce matin, nos forces ont lancé une contre-attaque pour repousser les Arabes à travers le Jourdain. Même si l'armée est confiante, elle a fait remarquer au cabinet que nos troupes auront du mal à faire appel à un appui aérien lourd ou à se concentrer en grand nombre. Le manque de supériorité aérienne signifie qu'un grand nombre de nos chasseurs sont déterminés à défendre l'espace aérien. Cela signifie également que nos forces risquent une attaque aérienne ennemie si elles se concentrent en une force trop importante à découvert. Dans le terrain auquel nous sommes confrontés, disposer d'une puissance aérienne pour soutenir les avancées terrestres aurait été très apprécié." #Israeli Perspective Counter-Attacking Jordan (OP Focus Failed)
 SIX_DAYS_WAR.192.d:0 "Les forces militaires arabes du Sinaï ont lancé une invasion dans le pays. Comme ils constituent de loin la plus grande force arabe, il n'est pas surprenant qu'ils aient pu pénétrer la frontière et avancer. Ils se déplacent en grand nombre et défient le ciel pour la supériorité aérienne. Cependant, nos chefs militaires ont récemment lancé une série de contre-attaques pour stopper et finalement repousser les Arabes vers la frontière. Même si nous sommes confrontés à la menace d'attaques aériennes contre nos forces, nous pensons que l'entraînement, les compétences et les aptitudes de nos soldats leur permettront de déjouer les manoeuvres et de vaincre cette force d'invasion." #Israeli Perspective Counter-Attack into Sinai
 SIX_DAYS_WAR.22.d:0 "Lors d'une réunion d'urgence du cabinet avec de hauts responsables militaires, il a été décidé d'autoriser immédiatement une contre-attaque pour reprendre Eilat aux envahisseurs arabes. Même si les combats sont désespérés et que nos forces sont largement engagées, nous ne pouvons pas risquer de perdre Eilat. Le port d'Eilat nous relie à l'Asie et à l'Afrique. Sa situation au bord de la mer Rouge nous confère une flexibilité en termes de commerce maritime essentielle pour empêcher les efforts de blocus arabes. Stratégiquement, cela sépare également les Arabes d'Égypte du reste du monde arabe et sa perte faciliterait grandement leurs efforts contre nous. L'attaque prévue espère cibler deux points faibles des défenses ennemies, conduisant à une percée qui verra Eilat encerclée puis fortifiée par nos forces. L'attaque a commencé il y a une heure." #Launch Counter-Attack to Retake Eilat (Israeli Perspective)
 SIX_DAYS_WAR.23.d:0 "Après des combats désespérés, nos troupes ont réussi à protéger Eilat, son port et son aérodrome des forces arabes. Le fait que, malgré les difficultés et les défis récents, nous ayons pu lancer un assaut vital et reprendre Eilat témoigne de la capacité de notre peuple. Nos forces ont pu frapper l'ennemi sur deux points faibles identifiés, passer à travers puis encercler Eilat. Après un bref combat, la petite force arabe présente dans la ville s'est rendue et nous avons établi de solides lignes défensives protégeant la ville. Depuis que nous avons créé Eilat, c'est notre fenêtre sur l'Afrique et l'Asie. Quels que soient les revers subis dans ce conflit, nous n'oublierons jamais le courage de nos forces à Eilat et la manière dont elles ont sauvé l'avenir du pays d'après-guerre." # Eilat Retaken (Israeli Perspective)
 SIX_DAYS_WAR.24.d:0 "Le cabinet a été récemment informé de l'échec de l'attaque d'Eilat. Bien que nos forces aient réussi à atteindre les deux points faibles, l'une de ces positions a résisté suffisamment fermement pour que des renforts arrivent, émoussant ainsi l'attaque. L'autre force a fait une percée et malgré sa maniabilité et ses succès initiaux, elle n'était pas assez forte pour achever l'encerclement d'Eilat et a été arrêtée. L'attaque nous a coûté des équipements et des effectifs vitaux, mais il a été convenu que nous n'avions pas le choix. La perte d'Eilat rend la situation d'après-guerre encore plus désastreuse pour notre nation, mais en fin de compte, nous persévérerons et nous souviendrons toujours des courageux sacrifices de nos soldats alors qu'ils cherchaient désespérément à sauver Eilat de la ruine." # Eilat Counter-Offensive Fails
 SIX_DAYS_WAR.26.d:0 "Les forces militaires arabes présentes dans le Sinaï ont prouvé le danger qu'elles représentent pour la patrie avec leur récente agression. Alors que leurs forces sont toujours prêtes à menacer davantage notre peuple, le cabinet a récemment approuvé le lancement d'une offensive dans le Sinaï pour neutraliser cette menace. Débarrasser le Sinaï de cette force et détruire sa capacité à mener une guerre offensive garantira grandement l'avenir de notre nation. Ce matin, nos forces ont avancé, franchissant rapidement la frontière. On espère que le recours à des manoeuvres de flanc et l'avancée sur des routes imprévues par l'ennemi mèneront à des percées et à la victoire." #Israeli Counter-Offensive into the Sinai (Israel Perspective)
 SIX_DAYS_WAR.27.d:0 "L'offensive dans le Sinaï s'est malheureusement soldée par un échec. Les efforts visant à déborder et à détruire les formations arabes ne se sont pas concrétisés car la résistance s'est avérée beaucoup plus dure que prévu. Même si nos forces ont connu des succès précoces et qu'il y avait un espoir que les forces arabes s'effondreraient sous les premiers coups, l'ennemi a tenu bon à suffisamment d'endroits pour freiner l'avancée. Même s'ils ne pouvaient égaler la maniabilité et les compétences de nos forces, ils étaient capables de déployer une puissance de feu concentrée, ce qui s'est avéré décisif pour émousser nos forces. L'impasse de l'attaque a coûté cher à nos forces en équipement et en personnel." #Failed Israeli Offensive in the Sinai (Israel Perspective)
 SIX_DAYS_WAR.28.d:0 "Après de brefs combats, nos forces sont les maîtres incontestés du Sinaï et de Gaza. Dans le Sinaï, nous avons fait face à une opposition militaire arabe importante, mais leur résistance et leur résolution se sont effondrées très tôt. Nos troupes et leurs officiers ont pu utiliser leur vitesse et leur maniabilité pour déborder, diviser et détruire les formations ennemies au coup par coup. Nos victoires ont brisé la résistance de nos adversaires qui ont fini par fuir, abandonnant le Sinaï que nous possédons désormais. Gaza, avec sa population arabe nombreuse et hostile, a également été rapidement sécurisée, toute résistance étant écrasée presque immédiatement. Le pays est désormais sous gouvernement militaire pour assurer la paix. Avec le Sinaï et Gaza sous occupation, nous disposons désormais d'un tampon pour nous protéger de la menace du Caire et contrôlons désormais une population arabe hostile qui ne peut plus être mobilisée contre nous." #Israel Seizes the Sinai and Gaza (Israel Perspective)
 
 
