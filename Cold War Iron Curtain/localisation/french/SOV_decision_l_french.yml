 #Starting Decisions#
 sov_generic_decisions: "Le 4e-5e plan quinquennal"
 sov_generic_decisions_desc: "\n\n\n\n\n\n£Five_Year_Plans\n\n\n\n\n\n\nL'invasion allemande en 1941 a stoppé définitivement les progrès de notre industrialisation ; à ce titre, les plans quinquennaux furent suspendus de 1941 à 1945, l'État étant contraint de réorienter toutes les ressources disponibles vers l'effort de guerre et la survie nationale. Durant cette période, le développement économique et la planification à long terme ont été suspendus, l'accent étant désormais mis sur la production militaire, la défense et la mobilisation de la population en réponse à la menace existentielle posée par l'avancée allemande.\n\nImmédiatement après la capitulation des Allemands le 9 mai 1945, lors d'un congrès extraordinaire, Staline annonça la poursuite des plans quinquennaux. Cependant, reconnaissant l'immense destruction causée par la guerre et la nécessité urgente d'une reconstruction rapide, il a déclaré que le quatrième plan quinquennal et le cinquième plan quinquennal seraient fusionnés en un seul programme global, visant à restaurer la capacité industrielle et à reprendre la voie du développement économique interrompue par le conflit."
 SOV_test_first_nuke: "Essai nucléaire RDS-1"
 SOV_test_first_nuke_desc: "§W---------------------------§!\n\n\n\n£RDS_1_Test\n\n\n\n\n\n§W----------------------------§!\nL'une des plus grandes réalisations de l'histoire de l'espionnage soviétique est représentée ici : le §RРеактивный двигатель специальный§!, ou le §RSpecial Jet Engine§!. Cette percée a été rendue possible grâce aux informations recueillies par notre taupe dans le cadre du projet Manhattan, fournissant un aperçu critique du développement de cette arme. Grâce à cette intelligence, notre communauté scientifique a pu accéder à des connaissances qui étaient auparavant hors de notre portée.\n\nForts de ces informations, nos talentueux scientifiques, en particulier le camarade §YIgor Kurchatov§!, ont finalement réussi à recréer la formule d'une telle arme. L'engin nucléaire explosera dans la région de Pavlodar, à proximité de l'installation où l'arme a été produite."
 SOV_building_don_volga_canal: "Achever le canal Lénine Volga Don"
 SOV_Khrushchev_ukraine_leader_mission: "Khrouchtchev en Ukraine"
 #SINO-SOVIET WAR
 SOV_Sino_Soviet_War: "La guerre sino-soviétique"
 SOV_Sino_Soviet_War_desc: "[GetSOVPRCPics]Les communistes chinois ont toujours été une présence gênante dans l'histoire de la Chine, depuis le banditisme de Mao jusqu'à leur dogmatisme en 1941, qui a contribué à l'effondrement du Front uni, une alliance cruciale dans la lutte contre les impérialistes japonais.\n\nCependant, rien de tout cela n'est comparable à leurs actions à cette date. Ils ont complètement abandonné l'idéologie marxiste-léniniste et se sont engagés dans un révisionnisme total des idéaux de Lénine. Il est temps de vaincre les communistes chinois et de restaurer la véritable foi dans le marxisme-léninisme."
 SOV_Strike_The_Chinese_Railway: "Frappez le chemin de fer chinois"
 SOV_Support_American_With_Intel: "Soutenez les Américains avec le renseignement"
 SOV_Support_American_With_Intel_desc: "§W---------------------------§!\n\n\n\n£Support_Americans\n\n\n\n\n\n§W----------------------------§!\nLes États-Unis ont été un adversaire constant de l'Union soviétique, se livrant à diverses formes d'hostilité et d'opposition tout au long de notre histoire. Cependant, avec la guerre en cours entre nous et la Chine, il est clair que les États-Unis sont confrontés à des défis importants et se trouvent dans une situation de manque d'informations. En leur fournissant un soutien en matière de renseignement, nous pouvons exacerber encore davantage leurs difficultés et potentiellement accélérer leur déclin avec la guerre en cours."
 #Dynamic Modifier
 SOV_Kuril_Illegal_Fishing: "Pêche illégale japonaise"
 SOV_Kuril_Illegal_Fishing_desc: "§W---------------------------§!\n\n\n\n£Japanese_Illegals\n\n\n\n\n\n§W----------------------------§!\nDepuis que nous avons acquis les îles Kouriles, comme le déclare l'accord de Potsdam, les pêcheurs japonais ont continué à empiéter sur notre territoire, la pêche illégale s'étendant de manière incontrôlée et des millions de tonnes de poissons étant prélevées dans nos eaux. Alors que le Japon continue de tirer profit des ressources extraites de son territoire, ce n'est qu'une question de temps avant que cette question ne soit résolue de manière décisive."
 SOV_Yakut_ASSR: "République socialiste soviétique autonome de Yakoute"
 SOV_Yakut_ASSR_desc: "§W---------------------------§!\n\n\n\n£Yakut_ASSR\n\n\n\n\n\n§W----------------------------§!\nLa République socialiste soviétique autonome de Yakoute (ASSR de Yakoute) a été créée dans le cadre de la RSFSR le 27 avril 1922, pendant la révolte de Yakoute. Il comprenait le territoire de l'oblast de Iakoutsk, à l'exclusion du district de Nizhnyaya Toungouska, qui était incorporé au district de Kirensky du gouvernorat d'Irkoutsk. En outre, la république comprenait le district de Khatango-Anabar du gouvernorat d'Ienisseïsk, le volost Olekminsko-Suntarskaya du district de Kirensky du gouvernorat d'Irkoutsk, ainsi que toutes les îles de l'océan Arctique situées entre les méridiens de 84° et 140½° de longitude est.\n\nMaksim Ammosov, avec Platon Oyunsky et Isidor Barakhov, ont joué un rôle central dans la formation de la République autonome de Yakoute. Ammosov a été le premier secrétaire exécutif du Parti communiste de Yakoute, Oyunsky est devenu le premier président du Comité exécutif central et Barakhov a été nommé premier président du Conseil des commissaires du peuple."
 #EVENTS
 sov_jvs.1.t: "Procès de Grigoriy Kulik"
 sov_jvs.1.d: "Grigoriy Kulik est peut-être l'un des individus les plus idiots à avoir accédé à un poste élevé au sein de l'armée, un personnage dont l'incompétence a été révélée à plusieurs reprises malgré son rang et son autorité. Ses échecs de 1942 furent finalement pardonnés en raison de ses relations étroites avec Staline, un privilège qui le protégeait des conséquences auxquelles les autres seraient confrontés. Plutôt que de l'humilier, cette protection n'a fait que renforcer son arrogance, le rendant de plus en plus critique, imprudent et finalement à la limite d'un danger pour le Parti et l'État.\n\nAprès son arrestation en 1947, lorsqu'un de nos agents l'a écouté parler ouvertement de la possibilité d'un coup d'État contre Staline, sa déloyauté a finalement été confirmée. Bien qu'il ait été détenu, la peine capitale avait alors été interdite, empêchant une résolution définitive de la menace qu'il représentait. Avec le nouveau décret rétablissant la peine capitale, l'État pourra enfin faire taire Kulik une fois pour toutes, éliminant ainsi de ses rangs un élément persistant et dangereux."
 sov_jvs.1.a: "Ce traître le mérite !"
 sov_jvs.1.a.tt: "§RLa trahison de Kulik ne peut rester impunie. Ses actions ont mis en danger le tissu même de notre État, et il est impératif que nous démontrions les conséquences d'une telle trahison. En exécutant Kulik, nous envoyons un message clair à tous ceux qui pourraient considérer des actes de déloyauté similaires : l'Union soviétique ne tolérera pas la trahison, et ceux qui nous trahissent feront face à toute l'étendue de notre système judiciaire. Cette exécution ne consiste pas seulement à punir un§!"
 sov_jvs.2.t: "Pe-2 Shotdown dans notre jardin !"
 sov_jvs.2.d: "Nous avons reçu un rapport confirmant que notre avion de reconnaissance Pe-2 a été abattu au-dessus de Vladivostok. Bien que l'ambassadeur américain ait présenté ses excuses pour cet incident, la déclaration faite apparaît moins comme un aveu de responsabilité que comme une tentative de justification. Une telle explication ne tient pas compte de la gravité de la violation et ne fait que renforcer l'impression que l'affaire est traitée à la légère plutôt qu'avec le sérieux qu'elle mérite.\n\nCamarade Secrétaire général, il devient de plus en plus évident qu'une victoire complète des forces des Nations Unies en Corée pourrait signifier l'érosion, voire la fin pure et simple, de notre influence en Extrême-Orient. Aujourd'hui, c'est la Corée ; demain, ce sera peut-être la Chine, et après cela, nous-mêmes. Conscient de ce danger, le ministère de la Défense a déjà pris des mesures et la STAVKA en a été dûment informée. Nous sommes désormais confrontés à un choix clair : accepter des excuses malhonnêtes et laisser le problème s'estomper, ou enfin le résoudre en ordonnant au district militaire d'Extrême-Orient de lancer une opération spéciale pour soutenir nos alliés coréens et chinois."
 sov_jvs.2.a: "Acceptez les excuses américaines."
 sov_jvs.2.b: "C'est allé trop loin !"
 sov_jvs.3.t: "[GetNewspaperHeader]L'Union Soviétique entre en Corée !"
 sov_jvs.3.d: "Suite à la rupture des communications diplomatiques et à l'abattage d'un avion soviétique Pe-2 au-dessus de la mer du Japon, le gouvernement de l'Union soviétique a conclu que le moment d'une action décisive était arrivé. Ces développements, pris ensemble, ont été considérés comme un défi direct à la sécurité et à l'influence soviétiques en Extrême-Orient, laissant peu de place à de nouveaux retards ou à une ambiguïté politique.\n\nAujourd'hui à [?global.date.GetDateStringShortMonth], des détachements du district militaire soviétique sont entrés en Corée, entrant officiellement dans la guerre de Corée. Par cette action, l'Union soviétique s'est ouvertement engagée dans le conflit, marquant une escalade décisive et signalant sa détermination à défendre ses intérêts stratégiques et à soutenir ses alliés dans la péninsule coréenne."
 sov_jvs.3.a: "L'histoire se répète."
 sov_jvs.4.t: "La division coréenne"
 sov_jvs.4.d: "Depuis la déclaration de la République de Corée en 1948 et sa reconnaissance ultérieure par les Nations Unies, Kim Il Sung, notre allié du Nord, se méfie de plus en plus de la posture agressive de Syngman Rhee envers Pyongyang. La rhétorique ouvertement favorable à l'unification de Rhee, ouvertement soutenue par les Nations Unies et les États-Unis, représente un défi direct et sérieux à l'influence soviétique en Asie de l'Est. Cet alignement politique au Sud a accru les tensions dans la péninsule coréenne et suscité des inquiétudes à Moscou quant à l'équilibre des pouvoirs dans la région.\n\nCependant, la guerre en Chine étant toujours en cours, une action militaire immédiate de Kim Il Sung serait désastreuse. L'Union soviétique ne peut pas se permettre d'apporter un soutien massif à la Chine et à la Corée sans mettre dangereusement à rude épreuve ses ressources. Cette réalité nous laisse face à une ligne de conduite alternative : la préparation progressive et méthodique de la Corée du Nord à une future confrontation. Une telle retenue suscite naturellement de la frustration à Pyongyang, d'autant plus que nos renseignements indiquent que le Sud lui-même se prépare à une éventuelle attaque contre le Nord."
 sov_jvs.4.a: "Nous devons préparer Pyongyang."
 sov_jvs.5.t: "La question dalienne"
 sov_jvs.5.d: "L'Empire russe a détenu Dalian pendant une période considérable, jusqu'à ce que les conséquences de la guerre russo-japonaise en 1905 nous obligent à céder le territoire à l'Empire japonais.\n\nAvec la défaite du Japon en 1945, Dalian nous est restituée. Pourtant, alors que la guerre civile chinoise a repris et s'est finalement conclue par la victoire du Parti communiste chinois sur le continent, nous nous trouvons désormais confrontés à un dilemme stratégique et politique. Ce territoire, doté d'un port d'eau chaude vital, nous offre des avantages significatifs, servant de plaque tournante commerciale essentielle qui nous relie aux marchés plus larges de l'Asie de l'Est. Dans le même temps, avec le triomphe des communistes en Chine, notre raison de conserver un contrôle direct sur le territoire semble diminuée - après tout, nous sommes désormais alliés.\n\nAinsi, trois options s'offrent à nous : établir une administration conjointe sous la direction du PCC parallèlement à notre présence militaire ; restituer l'intégralité du territoire à la Chine ; ou adhérer strictement aux dispositions du traité existant et transférer la souveraineté en 1997 comme stipulé."
 sov_jvs.5.a: "Établissons l'administration de Dalian !"
 sov_jvs.5.b: "Renvoyez-le en Chine."
 sov_jvs.5.c: "Eh bien... Le traité dit que jusqu'en 1997..."
 sov_jvs.6.t: "[GetNewspaperHeader]Dalian est de retour en Chine !"
 sov_jvs.6.d: "Après la fin de la guerre civile chinoise, le territoire de Dalian, auparavant administré par l'Union soviétique, a été officiellement restitué à la République populaire de Chine.\n\nAvec la victoire communiste sur le continent et la mise en place d'un nouveau gouvernement central à Pékin, la question de l'administration de Dalian est désormais définitivement réglée.\n\nLes responsables décrivent cette passation de pouvoir comme un geste de bonne volonté et de solidarité entre les gouvernements alliés, soulignant le renforcement des liens entre Moscou et Pékin dans les premières années du nouvel ordre régional. Cette décision conclut effectivement un chapitre de l'administration étrangère sur la ville portuaire stratégique, en la rétablissant pleinement sous la souveraineté chinoise."
 sov_jvs.6.a: "Amitié pour toujours !"
 sov_jvs.6.b: "Développement intéressant...."
 sov_jvs.7.t: "Suppression du poste de secrétaire général"
 sov_jvs.7.d: "Lorsque Joseph Staline a été élu au 11e Congrès du Parti communiste russe (bolcheviks), il a rapidement nommé des loyalistes au sein du Présidium, transformant progressivement le poste de secrétaire général en un poste effectivement équivalent, sinon plus puissant, à celui de Premier ministre.\n\nCependant, lors du 17e Congrès du Parti communiste de l'Union soviétique, Staline n'a pas été officiellement réélu à ce poste et, à partir de ce moment, le titre de secrétaire général est devenu rarement mentionné par le gouvernement soviétique. Bien que l'influence associée au poste soit restée significative, le titre lui-même a disparu de l'usage officiel.\n\nAinsi, lors du 19e Congrès du Parti communiste de l'Union soviétique, Staline a officiellement aboli le titre de secrétaire général."
 sov_jvs.7.a: "Vive Staline !"
 sov_jvs.8.t: "Conclusion de la réunion du Conseil des ministres des Affaires étrangères"
 sov_jvs.8.d: "La réunion du Conseil des ministres des Affaires étrangères à Paris est terminée.\n\nNos espoirs de parvenir à un accord sur l'unité politique et économique de l'Allemagne ont été anéantis par les puissances occidentales, qui ont rejeté la proposition du camarade Vychinski de restaurer l'ancien contrôle quadripartite de l'Allemagne, déclarant qu'« elles ne détruiraient pas ce qu'elles avaient accompli pour promouvoir l'organisation économique et l'autonomie démocratique de leurs zones ». Toute nouvelle dispute avec eux n'a abouti qu'à suggérer d'appliquer leurs normes d'occupation sur notre zone et, par conséquent, de la leur céder de facto.\n\nCette réunion, ainsi que la création de la République fédérale d'Allemagne qui l'a précédée, ont prouvé une fois de plus que l'expansion de l'impérialisme américain est plus importante pour eux que le sort du peuple allemand. Bien que les territoires allemands que nous contrôlons ne soient pas en mesure de rivaliser avec l'ancienne Trizone, il semble que nous devrions sérieusement envisager d'établir un État allemand socialiste dans notre propre zone."
 sov_jvs.8.a: "Nous n'avons plus d'options ici."
 sov_jvs.9.t: "[GetNewspaperHeader]Conclusion de la réunion du Conseil des ministres des Affaires étrangères"
 sov_jvs.9.d: "La réunion du Conseil des ministres des Affaires étrangères à Paris est terminée.\n\nLa sixième réunion du Conseil s'est tenue depuis sa fondation, avec Andreï Vychinski, Maurice Schumann, Ernest Bevin et Dean Acheson représentant respectivement l'Union soviétique, la France, le Royaume-Uni et les États-Unis.\n\nLa proposition soviétique de reprise du contrôle des quatre puissances sur l'Allemagne, discutée lors de la réunion, a été rejetée par les puissances occidentales, qui ont déclaré qu'elles ne détruiraient pas ce qu'elles avaient accompli en faveur de l'organisation économique et de l'autonomie démocratique de leurs zones. Les bases de l'indépendance autrichienne restaurée ont été convenues, mais sans la signature d'un traité allemand, les négociations ne pourraient pas progresser au-delà de ce point.\n\nLa réunion a prouvé que les différences entre les anciens alliés sont devenues trop grandes, car la réunification pacifique de l'Allemagne, qui était déjà devenue improbable après la création de la République fédérale d'Allemagne par les puissances occidentales, devient encore plus improbable aujourd'hui."
 sov_jvs.9.a: "Au diable l'Occident !"
 sov_jvs.9.b: "De toute évidence, le Conseil a perdu son objectif."
 sov_jvs.10.t: "Compromis rejeté"
 sov_jvs.10.d: "Dans une tentative de revenir au statu quo, qui a été sévèrement assoupli après la création de la République fédérale d'Allemagne, le camarade Vychinski a suggéré de restaurer l'ancien contrôle des quatre puissances sur l'Allemagne, y compris la renaissance du Conseil de contrôle allié et de la Kommandatura alliée. Cependant, Dean Acheson a rejeté cette proposition, tandis que d'autres ministres des Affaires étrangères occidentaux ont déclaré qu'ils ne détruiraient pas « ce qu'ils avaient accompli pour promouvoir l'organisation économique et l'autonomie démocratique de leurs zones » - des actions qui constituent une violation directe des accords de Yalta et de Potsdam.\n\nMême si la réunion est toujours en cours, les chances de parvenir à un compromis sur le statut de l'Allemagne s'amenuisent."
 sov_jvs.10.a: "Voyons s'ils ont de meilleures suggestions."
 sov_jvs.11.t: "Impasse"
 sov_jvs.11.d: "Après avoir rejeté la proposition du camarade Vychinski, les puissances occidentales ont déclaré qu'elles étaient favorables à l'établissement d'un gouvernement allemand unifié. Cependant, toutes leurs propositions suivantes ont été suivies d'exigences visant à appliquer leurs normes d'occupation dans notre zone, culminant avec la proposition d'aujourd'hui d'étendre la constitution ouest-allemande à l'ensemble du pays. Cette proposition signifierait de facto abandonner notre zone d'occupation sous leur contrôle, et c'est pourquoi le camarade Vychinski l'a rejetée.\n\nLa réunion d'aujourd'hui a montré que les puissances occidentales n'ont aucune intention de trouver un compromis qui satisferait les deux parties. Il semble très peu probable que des accords concernant l'Allemagne soient conclus lors de cette conférence."
 sov_jvs.11.a: "Il fallait s'y attendre."
 sov_jvs.12.t: "Grèves à Berlin-Ouest"
 sov_jvs.12.d: "Au lendemain de la réforme monétaire occidentale, qui violait à la fois les accords de Yalta et de Potsdam, le « Deutsche Mark » (DM occidental) a été introduit en remplacement de l'ancien Reichsmark, ce qui a conduit le Reichsmark à affluer dans notre zone d'occupation alors que son cours s'effondrait. Comme l'une des contre-mesures pour gérer cette crise, nous avons introduit le Deutsche Mark oriental (DM oriental) en remplacement du Reichsmark. Cependant, Berlin-Ouest n'étant toujours pas directement connecté à l'Allemagne de l'Ouest, beaucoup de ses citoyens étaient payés avec des DM de l'Est au lieu de ceux de l'Ouest.\n\nEn conséquence, environ 16 000 cheminots non communistes vivant à Berlin-Ouest, soutenus par le syndicat des cheminots Unabhängige Gewerkschaftsopposition (UGO) et les chemins de fer est-allemands, ont entamé une grève, exigeant un paiement dans les DM de l'ouest au lieu de ceux de l'est. La grève se poursuit et nous devons trouver une solution satisfaisante le plus rapidement possible."
 sov_jvs.12.a: "Que devons-nous faire..."
 sov_jvs.13.t: "La guerre américano-iranienne"
 sov_jvs.13.d: ""
 sov_jvs.13.a: "Nous devons sécuriser l'Iran !"
 sov_jvs.13.b: "Nous avons d'autres affaires à régler..."
 sov_jvs.14.t: "Règlement sur le drapeau national de l'URSS"
 sov_jvs.14.d: "Le drapeau national de l'URSS se compose d'un panneau rectangulaire rouge avec une image sur son coin supérieur au niveau de la tige d'une faucille et d'un marteau dorés et au-dessus d'eux une étoile rouge à cinq branches encadrée par une bordure dorée. Le rapport largeur/longueur est de 1:2. Le marteau et la faucille s'inscrivent dans un carré dont le côté fait 1/4 de la largeur du drapeau. L'extrémité pointue de la faucille se trouve au milieu de la partie supérieure du carré, les manches de la faucille et du marteau reposent contre les coins inférieurs du carré. La longueur du marteau avec le manche est de 3/4 de la diagonale du carré. L'étoile à cinq branches s'insère dans un cercle d'un diamètre de 1/8 de la largeur du drapeau, touchant le côté supérieur du carré. La distance entre l'axe vertical de l'étoile, de la faucille et du marteau et du manche est de 1/3 de la largeur du drapeau. La distance entre le bord supérieur du drapeau et le centre de l'étoile est égale à 1/8 de la largeur du drapeau."
 sov_jvs.14.a: "Le Drapeau Rouge est là pour rester."
 sov_jvs.15.t: "Proposition de drapeau de la RSFSR"
 sov_jvs.15.d: "Mikhaïl Rodionov est venu nous proposer un nouveau dessin pour le drapeau de la RSFSR. Le drapeau en question est, pour le moins, plutôt... Éteint. Sa proposition consiste en rien de plus qu'un drapeau tricolore standard, marqué uniquement par l'ajout d'un marteau et d'une faucille, sans grand respect pour le symbolisme établi ou le caractère révolutionnaire auquel nous sommes habitués.\n\nNous ne pouvons pas déterminer s'il présente ce dessein avec une conviction sincère ou comme un acte de pure imprudence. Il est difficile de dire si cela vient d'une ambition malavisée, d'une erreur de jugement ou de quelque chose de bien plus périlleux sous la surface. Certains d'entre nous se demandent s'il saisit pleinement les implications d'une telle proposition.\n\nMais en fin de compte, la décision vous appartient, camarade Staline.\n\n\n\n\n\n\n£Mikhail_Rodionov_Pic\n\n\n\n\n\n"
 sov_jvs.15.a: "Ce type est un putain de génie !"
 sov_jvs.15.b: "Tuez ce fils de pute !"
 austria.10.t:0 "La question autrichienne"
 austria.10.d:0 "Des années d'occupation conjointe ont laissé l'Autriche divisée entre zones rivales, et Vienne est désormais un point chaud entre l'Est et l'Ouest. Nos commandants sur le terrain nous exhortent à officialiser la division et à sécuriser notre zone en tant qu'État tampon loyal.\n\nPendant ce temps, le gouvernement autrichien à Vienne a avancé une proposition différente : une Autriche unie, neutre en permanence, tenue de ne rejoindre aucun bloc militaire et d'héberger aucune base étrangère, en échange du retrait de toutes les forces d'occupation.\n\nLes deux voies comportent des risques. Diviser l'Autriche provoquerait la colère de l'Occident et durcirait les lignes de la guerre froide, tandis que la neutralité signifierait abandonner un point d'ancrage stratégique en Europe centrale."
 austria.10.a:0 "Divisez l'Autriche et sécurisez notre zone"
 austria.10.b:0 "Acceptez la proposition de neutralité"
 SOV_Treaty_of_Friendship_with_China:0 "Traité d'amitié avec la Chine"
 SOV_Treaty_of_Friendship_with_China_desc:0 "La victoire des communistes chinois a créé un allié puissant à notre frontière orientale. Un traité d'amitié, d'alliance et d'assistance mutuelle liera nos deux nations contre l'agression impérialiste."

 SOV_Renounce_claims_on_Turkish_territory:0 "Renoncer aux revendications sur le territoire turc"
 SOV_Renounce_claims_on_Turkish_territory_desc:0 "Ankara a montré qu'elle était prête à se tourner vers Moscou plutôt que vers Washington. Abandonner nos revendications concernant Kars, Ardahan et avoir notre mot à dire sur le détroit récompenserait ce choix et consoliderait la place de la Turquie dans notre sphère."

 SOV_Arms_the_Korean_Army:0 "Armer l'armée coréenne"
 SOV_Arms_the_Korean_Army_desc:0 "Nos camarades coréens ont besoin d'armes et d'équipements modernes s'ils veulent défendre la révolution et unifier la péninsule. Les chars, l'artillerie et les avions seront expédiés des stocks soviétiques."

 SOV_consolidate_Korea:0 "Consolider la Corée"
 SOV_consolidate_Korea_desc:0 "La situation dans la péninsule doit être fermement contrôlée. Les conseillers soviétiques contribueront à bâtir le parti, l'État et l'armée afin que la Corée reste un allié socialiste fiable."

 SOV_Arms_the_Greek_Army:0 "Armer l'armée grecque"
 SOV_Arms_the_Greek_Army_desc:0 "Les communistes grecs se battent pour leur cause dans les montagnes. Leur fournir des armes et des munitions maintiendra la lutte vivante et retiendra l'attention britannique et américaine en Méditerranée."

 SOV_Establish_the_Warsaw_Pact:0 "Établir le Pacte de Varsovie"
 SOV_Establish_the_Warsaw_Pact_desc:0 "Avec l'adhésion de l'Allemagne de l'Ouest à l'OTAN, les États socialistes d'Europe de l'Est doivent répondre par une alliance militaire formelle. Le Traité de Varsovie unifiera nos armées sous un commandement unique."

 SOV_Arrange_Meeting_with_Ho:0 "Organiser une réunion avec Ho"
 SOV_Arrange_Meeting_with_Ho_desc:0 "Hô Chi Minh cherche du soutien pour lutter contre le régime colonial en Indochine. Une réunion secrète nous permettra de juger de ce dont il a besoin et jusqu'où nous pouvons nous engager."

 SOV_Recognize_Vietnam:0 "Reconnaître le Vietnam"
 SOV_Recognize_Vietnam_desc:0 "La République démocratique du Vietnam est le gouvernement légitime de son peuple. La reconnaissance officielle renforcera sa position et ouvrira la porte à l'aide et aux conseillers."

 SOV_Resolve_the_Austrian_Question:0 "Résoudre la question autrichienne"
 SOV_Resolve_the_Austrian_Question_desc:0 "Une décennie d'occupation commune a pris fin. Le moment est venu de décider du sort de l'Autriche, que ce soit par la division ou par un règlement négocié."

 #Tooltip
 sov_jvs.14.a.tt: "§RLe drapeau de l'URSS sera modifié.§!"

### USSR debug break-up scenarios ###
 ussr_debug_breakup_category:0 "Débogage de l'URSS - Scénarios de rupture"
 ussr_debug_breakup_category_desc:0 "Outils de test pour l'effondrement soviétique. Rien ici ne se déclenche tout seul et l'IA ne l'utilisera jamais."
 ussr_debug_enable_tools:0 "DEBUG : Activer les outils de démantèlement de l'URSS"
 ussr_debug_enable_tools_desc:0 "Révèle la catégorie §YDébogage URSS - Scénarios de rupture§!. Débogage uniquement - aucun effet de gameplay en soi."
 ussr_debug_disable_tools:0 "DEBUG : Masquer les outils de démantèlement de l'URSS"
 ussr_debug_disable_tools_desc:0 "Masque à nouveau la catégorie du scénario de rupture."
 ussr_debug_break_historical:0 "Scénario : Dissolution historique (1991)"
 ussr_debug_break_historical_desc:0 "Diviser l'Union en §Yquinze républiques fédérées§! exactement comme elle s'est dissoute en décembre 1991. La RSFSR garde intactes ses républiques autonomes."
 ussr_debug_break_historical_tt:0 "Sortie §YRussie, Ukraine, Biélorussie, Moldavie, Estonie, Lettonie, Lituanie, Géorgie, Arménie, Azerbaïdjan, Kazakhstan, Ouzbékistan, Turkménistan, Kirghizistan et Tadjikistan§!."
 ussr_debug_break_full:0 "Scénario : Panne totale"
 ussr_debug_break_full_desc:0 "Tout s'effondre d'un coup : les quinze républiques fédérées §Ret§! chaque république autonome §Ret§! chaque mouvement séparatiste. Le pire des cas."
 ussr_debug_break_full_tt:0 "Libérez §Yles 15 républiques fédérées§!, §Ychaque république autonome§!, §Ychaque oblast autonome§! et §Ychaque okrug national§! - 56 nations au total."
 ussr_debug_break_assr_only:0 "Scénario : Sécession des Républiques autonomes"
 ussr_debug_break_assr_only_desc:0 "Les républiques autonomes se séparent mais l'Union elle-même tient bon - une crise interne à la Russie plutôt qu'un effondrement."
 ussr_debug_break_assr_only_tt:0 "Libérez §Ychaque république autonome et oblast autonome§! - 26 d'entre eux, du Tatarstan et de la Yakoutie à l'AO juive et au Haut-Badakhshan. Les okrugs nationaux restent dans l'Union."
 ussr_debug_break_separatists:0 "Scénario : Insurrection séparatiste"
 ussr_debug_break_separatists_desc:0 "Les républiques baltes retrouvent leur indépendance et les régions séparatistes se développent. Le reste de l'Union reste dans le giron."
 ussr_debug_break_separatists_tt:0 "Libérez §YEstonie, Lettonie, Lituanie§!, l'armée insurrectionnelle ukrainienne §Y, Itchkérie, Abkhazie, Ossétie du Sud, Artsakh, Transnistrie et Gagaouzie§!."
 ussr_debug_german_assr_volga:0 "Créer l'ASSR allemande - Terres historiques de la Volga"
 ussr_debug_german_assr_volga_desc:0 "Restaurer l'ASSR allemande de la Volga §Y§! là où elle se trouvait réellement avant son abolition en 1941 : la steppe de la Trans-Volga à l'est de Saratov, autour de Pokrovsk (Engels).\n\nMutuellement exclusif avec le placement du Kazakhstan du Nord."
 ussr_debug_german_assr_volga_tt:0 "Core §YKrasnyy Kut§! pour l'ASSR allemande et libérez-le."
 ussr_debug_german_assr_kazakhstan:0 "Créer la RSSA allemande - Kazakhstan du Nord"
 ussr_debug_german_assr_kazakhstan_desc:0 "Établir l'ASSR allemande dans le nord du Kazakhstan §Y§!, où les Allemands de la Volga déportés ont été réinstallés. Cela correspond à l'emplacement utilisé par l'arbre de focus de Staline.\n\nMutuellement exclusif avec le placement Volga."
 ussr_debug_german_assr_kazakhstan_tt:0 "Noyau §YOblast de Severo-Kazakhstanskaya§! et §YOblast d'Akmolinskaya§! pour l'ASSR allemande et libérez-le."
 ussr_debug_korean_assr_balkhash:0 "Créer une ASSR coréenne - au sud du lac Balkhash"
 ussr_debug_korean_assr_balkhash_desc:0 "Établir l'ASSR coréenne §Y§! dans la steppe au sud du lac Balkhach, où étaient installés les Coréens déportés d'Extrême-Orient en 1937.\n\nMutuellement exclusif avec le placement Pavlodar."
 ussr_debug_korean_assr_balkhash_tt:0 "Noyez §YBakanas§! pour l'ASSR coréen et publiez-le."
 ussr_debug_korean_assr_pavlodar:0 "Créer l'ASSR coréenne - Pavlodar"
 ussr_debug_korean_assr_pavlodar_desc:0 "Établissez l'ASSR coréen en §YPavlodar§!, l'emplacement utilisé par l'arbre de focus de Staline.\n\nMutuellement exclusif avec le placement Balkhash."
 ussr_debug_korean_assr_pavlodar_tt:0 "Core §YPavlodarskaya Oblast§! pour l'ASSR coréenne et libérez-le."
 ussr_debug_restore_union:0 "Restaurer l'Union"
 ussr_debug_restore_union_desc:0 "Annexez chaque successeur libéré à l'Union soviétique et réinitialisez les drapeaux allemands et coréens de l'ASSR. Utilisez-le pour réinitialiser entre les tests de scénario."
 ussr_debug_restore_union_tt:0 "Annexe §Ychaque État successeur soviétique libéré§! réintègre l'URSS."
 ussr_debug_break_okrugs:0 "Scénario : Sécession des Okrugs nationaux"
 ussr_debug_break_okrugs_desc:0 "Les neuf okrugs nationaux se séparent : Nenets, Khanty-Mansi, Yamalo-Nenets, Taymyr, Evenki, Ust-Orda Bouriate, Aga Bouriate, Tchoukotka et Koryak. Petites populations, territoire immense."
 ussr_debug_break_okrugs_tt:0 "Libérez les §Yneuf okrugs nationaux§!."

