l_french:
 Red_Scare.1.d:0 "Dans un discours explosif prononcé en Virginie occidentale lors du Lincoln Day, le sénateur Joseph McCarthy a brandi un morceau de papier sur lequel, selon lui, se trouvait une liste de 205 employés du Département d'État soupçonnés d'être communistes. Il a noté que bien qu'ils soient identifiés comme sympathisants communistes, ils sont restés sur leurs positions et façonnent la politique étrangère américaine. Il a appelé le gouvernement fédéral à renforcer sa détermination et à exclure tous les sympathisants communistes des agences fédérales. Le discours a suscité beaucoup d'attention du public et McCarthy est désormais considéré comme l'un des principaux croisés anticommunistes au Sénat."
 Red_Scare.2.d:0 "Le Sénat des États-Unis a créé la sous-commission sénatoriale sur la sécurité intérieure pour enquêter sur l'application de la loi sur la sécurité intérieure et d'autres lois liées à l'espionnage, à l'infiltration et au sabotage contre les États-Unis d'Amérique. Le comité est dirigé par le sénateur Patrick McCarran. Le comité devrait jouer un rôle majeur dans la découverte des menaces communistes contre les États-Unis. Le sénateur Joseph McCarthy, le fervent croisé anticommuniste, ne fait pas partie du comité. De nombreux initiés notent que la direction du Parti républicain se méfie de McCarthy et de ses accusations agressives, c'est pourquoi ils ont assuré qu'il ne ferait pas partie du comité."
 Red_Scare.3.d:0 "Le puissant groupe d'anciens combattants, l'American Legion, a déclaré qu'il soutenait toutes les enquêtes sur d'éventuels sympathisants communistes et espions soviétiques sur le sol américain. Le groupe note que le communisme est l'antithèse de la démocratie et de la liberté américaines. Des milliers de soldats américains ont donné leur vie pour défendre ces idées et des millions ont servi à les préserver. Par respect pour ces sacrifices, il est du devoir du gouvernement américain d'enquêter pleinement et de détruire ces menaces contre les États-Unis. Avec ce soutien du groupe influent, les politiciens des deux côtés soutiendront ouvertement les enquêtes pour ne pas perdre le vote des anciens combattants qui constituent un bloc électoral important à travers le pays."
 Red_Scare.4.d:0 "Un grand jury a inculpé Julius et Ethel Rosenberg d'espionnage et de trahison envers les États-Unis. Le couple est déjà tous deux en détention depuis que Julius a été arrêté il y a plusieurs mois à la suite d'une enquête du FBI qui l'a identifié comme un espion soviétique. Un grand jury a ensuite été constitué et au cours de ces débats, Ethel Rosenberg a également été arrêtée après avoir témoigné. Le mari et la femme seront bientôt traduits en justice, le gouvernement les accusant tous deux d'avoir dirigé un puissant réseau d'espionnage qui a livré des secrets nucléaires américains à l'Union soviétique pendant la guerre. Julius Rosenberg, qui a travaillé pour l'armée pendant la guerre, est accusé d'avoir recruté des agents du projet top-secret Manhattan et d'avoir fourni des informations inestimables à l'Union soviétique. Ethel Rosenburg est accusée d'avoir aidé son mari dans ces démarches."
 Red_Scare.5.d:0 "Le procès de Julius et Ethel Rosenberg s'est ouvert à New York. Le procès devrait comprendre le témoignage de David Greenglass, qui, lors de son propre interrogatoire, a admis avoir fourni des informations à des agents soviétiques par l'intermédiaire de Julius Rosenberg. Les Rosenberg n'ont été découverts que pour leur prétendue espionnage en temps de guerre, à la suite des récents aveux d'un scientifique du projet Manhattan. Julius et Ethel sont accusés d'avoir organisé un puissant réseau d'espionnage soviétique qui a aidé les Soviétiques à mettre rapidement fin au monopole nucléaire américain. Le public serait indigné par la facilité avec laquelle les Soviétiques ont semblé infiltrer les opérations de guerre les plus secrètes et de hauts responsables accusent ces espions de permettre aux Soviétiques de rattraper rapidement les États-Unis en matière de technologie nucléaire. Les Rosenberg nient catégoriquement ces accusations et devraient plaider le cinquième amendement lors du procès."
 Red_Scare.6.d:0 "Le jury du procès pour espionnage très suivi de Julius et Ethel Rosenberg les a déclarés tous deux coupables de meurtre. Le juge chargé de l'affaire a décidé de les condamner tous deux à mort. Dans ses commentaires, le juge a noté que les deux hommes n'avaient pas seulement commis de l'espionnage, mais avaient également permis à l'Union soviétique d'acquérir une technologie qui a enhardi le communisme à travers le monde, lui fournissant ainsi un frein à l'énergie nucléaire américaine. Il a déclaré que toute mort américaine dans les turbulences d'après-guerre pouvait être imputée aux Rosenburg et s'apparentait à un meurtre et que pour cela également, ils devaient être punis. Julius Rosenberg, dans sa propre déclaration, a qualifié le procès de imposture et a affirmé qu'il était en train d'être piégé à des fins politiques. Le peuple américain a suivi l'affaire de près et serait stupéfait par l'ampleur et la capacité de l'espionnage soviétique."
 Red_Scare.7.d:0 "La plupart des Américains soutiennent sans réserve la condamnation à mort prononcée contre Julius et Ethel Rosenberg pour leur implication dans la divulgation de secrets nucléaires à l'Union soviétique. Cependant, il existe un mouvement croissant appelant à la clémence pour Julius et Ethel Rosenberg. La campagne rassemble non seulement des individus de tendance communiste, mais aussi des opposants à la peine de mort et des humanistes. Le pape se serait également prononcé en faveur d'une commutation de peine et aurait fait part de ses préoccupations au président. La campagne a attiré plusieurs scientifiques internationaux de haut niveau et des lauréats du prix Nobel. Le Président doit décider s'il doit rejeter le recours en grâce ou commuer les peines. Commuter la peine améliorerait l'image internationale des États-Unis, mais cela entraînerait des réactions négatives dans l'opinion publique intérieure."
 Red_Scare.8.d:0 "La décision du Président de commuer la peine de Julius et Ethel Rosenberg en prison à vie sans possibilité de libération conditionnelle a reçu de nombreux éloges à l'échelle internationale. Cependant, la presse américaine a éviscéré le président. En outre, de grandes manifestations ont lieu partout aux États-Unis pour condamner cette décision. Beaucoup accusent le président de se prosterner devant les étrangers et d'ignorer les souhaits du peuple américain. D'autres accusent le président d'être indulgent envers les communistes et affirment que cette décision encouragera davantage de communistes et d'opérations d'espionnage soviétiques. Les anciens combattants américains sont particulièrement indignés, soulignant que cette décision était une gifle pour tous les Américains qui ont consenti des sacrifices extrêmes pendant la guerre. Le président doit espérer pouvoir récupérer une partie du soutien perdu de l'électorat."
 Red_Scare.9.d:0 "Dans la célèbre prison de Sing Sing à New York, Julius et Ethel Rosenberg ont tous deux été exécutés pour leurs crimes contre les États-Unis. Ils ont été reconnus coupables d'avoir fourni des informations nucléaires top secrètes à l'Union soviétique, ce qui a accéléré son programme nucléaire. Les corps ont ensuite été envoyés à Brooklyn pour des funérailles avant d'être inhumés au cimetière de Wellwood. Ils laissent derrière eux deux enfants mineurs. Des centaines de personnes ont assisté aux funérailles tandis que des milliers de personnes se tenaient devant le cimetière. Il est clair que les deux hommes sont considérés comme des martyrs pour un certain nombre de participants qui voient dans l'exécution une confirmation que les États-Unis se détournaient lentement de leurs idéaux libéraux et se tournaient vers un régime despotique. La plupart des Américains ont cependant accueilli favorablement la nouvelle alors que justice était rendue."
 Red_Scare.10.d:0 "Le sénateur Joseph McCarthy, considéré par de nombreux membres de son parti comme un lâche incontrôlable, continue de gagner en popularité. Les journaux publient presque quotidiennement des rapports sur ses affirmations et accusations d'infiltration communiste au sein du gouvernement. De nombreux membres du Congrès suivent son exemple, espérant que leur propre rhétorique anticommuniste leur attirera de l'attention et des votes. Aux États-Unis, de nombreux Américains soutiennent ses enquêtes et les poussent plus loin. Ils font pression pour que soient retirés des livres, des films ou même des fonctionnaires soupçonnés de sympathiser avec les communistes. McCarthy continue de gagner en popularité et en influence, beaucoup qualifiant sa campagne contre le communisme de maccarthysme."
 Red_Scare.11.d:0 "Le sénateur Joseph McCarthy a annoncé aux médias son intention d'enquêter sur un laboratoire de l'Army Signal Corps dans le New Jersey. Le sénateur controversé affirme qu'il existe un réseau d'espionnage composé de scientifiques au sein du laboratoire et que l'armée n'a pas réussi à gérer correctement la situation. Après plusieurs semaines, McCarthy a admis qu'il n'y avait aucune preuve de l'existence de réseaux d'espionnage communistes dans le laboratoire. L'armée serait furieuse des accusations de McCarthy. Cependant, le sénateur McCarthy a récemment reçu des informations selon lesquelles un major de l'armée aurait été découvert comme membre d'un dangereux parti de gauche mais n'aurait pas été démis de ses fonctions. Certains alliés de McCarthy lui demandent d'arrêter son enquête sur l'armée et de passer au Département d'État, mais le sénateur semble déterminé à prouver que l'armée a tort."
 Red_Scare.12.d:0 "Le sénateur McCarthy a commencé à poser des questions à l'armée sur le cas du major Irving Peress. McCarthy note que le dentiste de l'armée s'est révélé être un ancien membre du Parti travailliste américain. Il a également laissé vide la section sur les affiliations politiques dans le formulaire de loyauté. McCarthy voulait savoir pourquoi il avait fallu quatre-vingt-dix jours à l'armée pour retirer le major du service. Le major Peress a obtenu une séparation honorable de la part de son commandant. L'armée affirme avoir mené son enquête et son processus conformément à la procédure, mais McCarthy a déclaré : « Qui a promu Peress ? Cette citation est devenue un cri de ralliement pour les anticommunistes et les partisans de McCarthy à travers le pays. On dit que l'armée est en ébullition."
 Red_Scare.13.d:0 "L'armée a récemment accusé le sénateur Joseph McCarthy et son avocat principal Roy Cohn d'utiliser sa position pour obtenir un traitement favorable pour un ancien assistant qui sert actuellement comme soldat. McCarthy a condamné les accusations et l'incident fera l'objet d'une enquête de la sous-commission permanente des enquêtes du Sénat. Les audiences seront retransmises à la télévision nationale et devraient durer plus d'un mois. McCarthy est convaincu que les audiences l'exonéreront, tandis que l'armée prévoit d'utiliser les informations d'un avocat familier avec McCarthy pour planifier sa propre stratégie. McCarthy doit planifier son approche avec soin."
 Red_Scare.14.d:0 "Joseph Nyle Welch, le principal avocat de l'armée, a eu une dispute majeure avec le sénateur Joseph McCarthy lors des audiences en cours. Welch a mis Roy Cohn au défi de fournir la liste de 130 noms de communistes ou de subversifs au sein de l'appareil de défense que McCarthy prétend détenir. Le sénateur McCarthy a répondu en disant que Welch devrait plutôt se tourner vers son propre cabinet d'avocats, car Fred Fisher appartenait à une association d'avocats progressistes. Welch a fourni une solide défense de Fisher, à la fin de sa réponse passionnée, il a déclaré : « N'assassinons pas davantage cet homme, sénateur. Vous en avez fait assez. N'avez-vous aucun sens de la décence ? Ce à quoi la galerie tonne d'applaudissements. Cela souligne que l'exposition publique a exposé McCarthy à la critique d'être un tyran et à une publicité négative."
 Red_Scare.15.d:0 "Les audiences Army-McCarthy se sont terminées sans qu'aucune des parties ne remporte la victoire. L'armée a pu prouver que Roy Cohn s'était immiscé dans les affaires de l'armée, mais le sénateur McCarthy a été disculpé. Il a été établi que le secrétaire de l'armée était intervenu dans la récente enquête du laboratoire du corps des transmissions de l'armée dans le New Jersey. Cependant, la publicité des audiences et la couverture médiatique ont donné au public une image très désagréable du sénateur McCarthy. Beaucoup le voient désormais comme un tyran et un menteur de mensonges. La réputation du sénateur et de ses partisans est au plus bas."
 Red_Scare.16.d:0 "Les audiences Army-McCarthy se sont terminées sans qu'aucune des parties ne remporte la victoire. L'armée a pu prouver que Roy Cohn s'était immiscé dans les affaires de l'armée, mais le sénateur McCarthy a été disculpé. Il a été établi que le secrétaire de l'armée était intervenu dans la récente enquête du laboratoire du corps des transmissions de l'armée dans le New Jersey. De nombreux observateurs ont été frappés par la façon dont McCarthy est apparu contrôlé et parfois silencieux pendant les débats. Il semble que les conseils de l'armée aient été un peu surpris et espéraient provoquer quelques éclats de la part du sénateur. La couverture médiatique a été assez étendue mais n'a pas modifié de manière significative l'opinion du public selon laquelle la poursuite des communistes doit se poursuivre."
 Red_Scare.17.d:0 "Le sénateur McCarthy a récemment tenu des auditions remettant en question la loyauté des officiers supérieurs de l'armée. Le sénateur a noté que les communistes et les subversifs présumés étaient en mesure de transmettre des rapports d'évaluation de la loyauté. Il s'est demandé pourquoi certains officiers traînaient les pieds ou se plaignaient des procédures destinées à défendre les États-Unis contre les menaces internes. Ses commentaires ont gagné du terrain parmi le peuple américain mais aussi parmi les membres du Pentagone. Certains hauts responsables de la défense craignent en privé que ces commentaires n'entraînent des tensions au sein de l'armée, alors que les officiers commencent à se soupçonner les uns les autres."
 Red_Scare.18.d:0 "Le Sénat a récemment voté la censure du sénateur Joseph McCarthy. Il est accusé de tactiques d'intimidation qui ne conviennent pas à un sénateur et d'avoir déformé la vérité à son avantage politique personnel. Le vote fait suite à ses apparitions ratées aux audiences Army-McCarthy. Ceci, combiné à ses autres enquêtes ratées et à ses accusations incendiaires, a poussé ses alliés politiques et publics à prendre leurs distances de lui. Le fait que nombre de ses compatriotes républicains aient soutenu le vote montre un rejet bipartisan du sénateur."
 Red_Scare.19.d:0 "La récente censure sénatoriale du sénateur Joseph McCarthy fait suite à une réaction publique beaucoup plus large contre le sénateur et le maccarthysme. De nombreux éditoriaux reprochent désormais au sénateur d'attiser les émotions et la peur du public afin d'attirer l'attention. Il est également accusé d'avoir tenté de lancer une chasse aux sorcières publique qui va à l'encontre des valeurs américaines. Beaucoup de ses opposants politiques dénoncent également McCarthy pour avoir ruiné l'image et la carrière d'innombrables personnes dans le pays. Cela indique que l'ère du maccarthysme anticommuniste touche peut-être à sa fin."
 Red_Scare.20.d:0 "Le sénateur McCarthy a récemment lancé une série d'enquêtes contre le Département d'État. Le sénateur a affirmé que des centaines de communistes et de subversifs façonnent la politique étrangère. Les représentants du Département d'État ont nié ces accusations, mais le public a parfois semblé captivé par ces affirmations. En fin de compte, un certain nombre de responsables du Département d'État ont soit démissionné, soit discrètement pris leur retraite pour éviter l'examen minutieux et l'embarras. Il semble que le maccarthysme reste fort et que McCarthy reste au sommet."
 Red_Scare.21.d:0 "Le peuple américain a été stupéfait d'apprendre que le sénateur Joseph McCarthy est décédé, apparemment des suites d'une hépatite aiguë. Le regretté sénateur est décédé à l'hôpital naval de Bethesda. Pendant des années, McCarthy a été le visage des enquêtes du Congrès sur l'infiltration communiste et les réseaux d'espionnage au sein du gouvernement fédéral et de l'armée. McCarthy est devenu l'homonyme du maccarthysme et, malgré son décès, l'intérêt public et l'inquiétude du communisme aux États-Unis perdurent. De nombreux hommes politiques et personnalités américaines de premier plan ont publié des déclarations exprimant leur admiration pour le défunt sénateur."
 Red_Scare.22.d:0 "Ces dernières semaines, l'armée a connu une série de démissions à la suite d'audiences sur la loyauté des officiers. Il semble que de nombreux militaires, craignant qu'une enquête plus approfondie n'affecte le moral et l'organisation, aient choisi de démissionner au lieu de faire traîner le processus. Plusieurs généraux et amiraux supérieurs ont démissionné ou pris une retraite anticipée. Le Pentagone a également annoncé de nouvelles directives visant à rationaliser davantage les enquêtes et le processus de retrait des rangs des subversifs. Les rapports d'évaluation de la fidélité sont également mis à jour pour être plus efficaces. De nombreux officiers à la retraite ont condamné l'ingérence politique dans l'armée et craignent qu'il faille du temps à l'armée pour retrouver son efficacité en tant que force de combat."
 Red_Scare.23.d:0 "Le sénateur Joseph McCarthy est décédé des suites d'une hépatite aiguë à l'hôpital naval de Bethesda. Certains journalistes suggèrent que cela pourrait être dû à l'alcoolisme, mais cela n'a pas été confirmé. Le sénateur McCarthy avait été le visage des enquêtes du Congrès sur les influences communistes et subversives au sein du gouvernement fédéral. Il a d'abord attiré l'attention du public, car de nombreux Américains étaient inquiets suite à la révélation des vastes réseaux d'espionnage soviétiques qui existaient pendant la Seconde Guerre mondiale. Cependant, il a récemment été censuré par le Sénat pour ses interrogatoires agressifs lors des audiences et les nombreuses accusations sans fondement qu'il a formulées. L'opinion publique a également considérablement baissé. Beaucoup pensent que la popularité du maccarthysme prendra fin avec sa mort."

 Red_Scare_Cul.1.d:0 "L'attention se porte à nouveau sur le système judiciaire américain après le décès des juges Frank Murphy et Wiley Rutledge, à quelques mois seulement l'un de l'autre. Les deux postes vacants doivent être pourvus par le Président et les observateurs politiques de tout le pays attendent sa nomination. Certains pensent que le président pourrait choisir deux juristes conservateurs. Cela aiderait le gouvernement dans les affaires ciblant des dissidents dangereux ou des menaces à la sécurité nationale. D'autres suggèrent qu'une décision judicieuse pourrait consister à nommer des juges libéraux pour contribuer aux efforts futurs visant à protéger les libertés civiles et les droits civiques."
 Red_Scare_Cul.2.d:0 "Les soi-disant Hollywood Ten ont vu leur condamnation pour outrage au Congrès confirmée par la Cour suprême. Le tribunal a refusé de se saisir de leur dossier, confirmant la condamnation. Les dix anciens scénaristes et réalisateurs hollywoodiens devront bientôt payer une amende et purger une peine d'un an de prison. La condamnation est intervenue après que les accusés n'ont pas témoigné devant le comité des activités anti-américaines de la Chambre des représentants sur les allégations selon lesquelles ils étaient membres du Parti communiste. Les accusés ont tenté de lire des déclarations condamnant le comité et ses actions, mais ont souvent été interrompus ou traités avec hostilité par les membres du Congrès. L'espoir que la Cour suprême se prononcerait en faveur des Hollywood Ten et ses affirmations selon lesquelles les condamnations constituaient une violation de la Constitution ont été rejetés par le tribunal." 
 Red_Scare_Cul.3.d:0 "Les Hollywood Ten entament aujourd'hui leur peine d'un an de prison. Le groupe d'anciens réalisateurs et écrivains d'Hollywood a été reconnu coupable d'outrage au Congrès pour avoir refusé de témoigner devant le comité des activités anti-américaines de la Chambre des représentants sur des allégations selon lesquelles ils étaient membres du Parti communiste. Les hommes condamnés ont fait valoir qu'ils n'étaient pas tenus de répondre aux questions posées par le premier amendement et ont soutenu que le comité lui-même était inconstitutionnel. Cependant, leur argument n'a pas été convaincant et la Cour suprême a finalement choisi de ne pas réexaminer l'affaire, confirmant les condamnations. De nombreux Américains libéraux estiment que cela marque une défaite pour les droits individuels dans le pays."
 Red_Scare_Cul.4.d:0 "Dans un arrêt surprise, la Cour suprême a annoncé qu'elle entendrait l'appel des \"Hollywood Ten\" contre leur peine d'un an de prison. Les dix anciens réalisateurs et scénaristes ont été reconnus coupables d'outrage au Congrès pour leur refus de répondre aux questions du comité des activités anti-américaines de la Chambre. De nombreux journaux conservateurs remettent en question la récente nomination de juges libéraux aux tribunaux et affirment que la révision de l'affaire n'augure rien de bon pour les efforts futurs du gouvernement visant à éradiquer le communisme et la dissidence du pays. Des journaux plus libéraux soutiennent que la Cour suprême fait entendre raison et contrôle le pouvoir d'un gouvernement fédéral de plus en plus incontrôlable."
 Red_Scare_Cul.5.d:0 "Dans un geste sans précédent, le chef de la commission des activités anti-américaines de la Chambre des représentants a publié une déclaration condamnant la Cour suprême pour avoir entendu l'appel des Hollywood Ten. Le membre du Congrès a souligné que de telles actions constituaient clairement un excès judiciaire et sapaient les efforts du Congrès et du gouvernement pour faire face à la menace d'une influence communiste étrangère dans le pays. Les traîtres, les espions et les ennemis des États-Unis ne devraient pas être autorisés à se cacher derrière les tribunaux et les libertés garanties par la Constitution pour détruire la république sacrée."
 Red_Scare_Cul.6.d:0 "Le réalisateur Edward Dmytryk, l'un des Hollywood Ten condamnés, a publié une déclaration publique depuis sa prison dans laquelle il a condamné le Parti communiste pour l'avoir utilisé, lui et ses coaccusés, comme outils pour faire avancer leur programme. Dmytryk avait cherché à s'échapper de prison en fuyant vers l'Angleterre avant de pouvoir être arrêté. Cependant, après l'expiration de son passeport, il est retourné aux États-Unis et a été arrêté. Il a promis de comparaître enfin devant le comité des activités anti-américaines de la Chambre des représentants pour remettre les pendules à l'heure et nommer les communistes à Hollywood."
 Red_Scare_Cul.7.d:0 "Le réalisateur Edward Dmytryk a comparu devant le comité des activités anti-américaines de la Chambre pour témoigner sur les communistes à Hollywood. Le directeur avait auparavant refusé de témoigner et avait en conséquence été arrêté pendant un an. Il affirmait maintenant que les communistes l'utilisaient à des fins de propagande et il témoignait désormais avec plaisir. Au cours de son témoignage électrique, Dmytryk a admis avoir brièvement rejoint le Parti communiste en 1945 et a ensuite énuméré 21 communistes, dont sept directeurs. Dmytryk a révélé que la découverte de cellules d'espionnage communistes au sein du gouvernement fédéral et l'agression communiste internationale étaient également des facteurs majeurs dans sa décision de témoigner."
 Red_Scare_Cul.8.d:0 "Deux ans seulement après avoir témoigné devant le comité des activités anti-américaines de la Chambre des représentants, Edward Dmytryk, ancien membre d'Hollywood Ten, constate une résurgence de sa carrière de réalisateur. Depuis son témoignage, il a réalisé plusieurs films, dont un avec l'acteur hollywoodien montant Kirk Douglas. Des rumeurs courent selon lesquelles il pourrait bientôt être choisi pour réaliser un prochain film mettant en vedette Humphrey Bogart et qui, selon les observateurs, pourrait être un grand succès pendant la saison des Oscars. Il semble que son repentir et sa condamnation du communisme aient été la clé alors que tous les autres membres d'Hollywood Ten continuent d'être mis sur la liste noire de l'industrie cinématographique. Les initiés d'Hollywood pensent que les studios craignent une réaction négative du public s'ils engageaient des hommes considérés comme des sympathisants communistes."
 Red_Scare_Cul.9.d:0 "11 dirigeants du Parti communiste des États-Unis d'Amérique (CPUSA) ont été inculpés en vertu de la loi Smith de 1940 pour avoir conspiré en vue de renverser le gouvernement. Ces arrestations font suite à de récents procès publics d'espions soviétiques et à des audiences du Congrès sur les infiltrés communistes dans la société américaine. Le FBI, dirigé par J. Edgar Hoover, aurait joué un rôle déterminant dans la collecte de preuves pour cette affaire. Des fuites dans les médias suggèrent que le FBI a utilisé des informateurs et d'autres outils de renseignement pour mener à bien son enquête. Toutes les personnes arrêtées sont membres du Conseil national du CPUSA. Une source au sein de l'équipe d'enquête suggère que le nombre des personnes inculpées pourrait dépasser la centaine. La nouvelle a choqué le public, surtout après avoir appris que le CPUSA comptait 80 000 membres pendant la guerre."
 Red_Scare_Cul.10.d:0 "Le procès des dirigeants du Parti communiste des États-Unis d'Amérique (CPUSA) s'est intensifié, les cinq avocats de la défense remettant en question le but du procès et l'incapacité du tribunal à garantir un jury impartial ou à maintenir l'ordre. Cela fait référence à ce que de nombreux journalistes appellent une atmosphère de carnaval, alors que le tribunal reste rempli de journalistes et de spectateurs, dont beaucoup lancent des insultes aux accusés et à leurs avocats. Les dirigeants accusés du CPUSA sont défendus par cinq avocats bénévoles qui soutiennent que l'affaire va à l'encontre des principes fondamentaux de la liberté d'expression et des droits de l'homme. L'accusation allègue que les accusés ont collaboré activement avec l'Union soviétique et complotaient une révolution armée contre les États-Unis depuis 1945. Les journaux et les éditoriaux soutiennent largement l'accusation."
 Red_Scare_Cul.11.d:0 "Le procès des dirigeants du Parti communiste des États-Unis d'Amérique (CPUSA) continue de faire l'objet de critiques de la part des défenseurs de la liberté d'expression et des leaders des droits civiques, qui notent que les nouvelles d'autres condamnations d'espions soviétiques sont largement partagées dans la salle d'audience. Les récentes condamnations dans ces affaires, qui ne sont pas liées au procès en cours, ont alimenté l'inquiétude du public quant à l'infiltration communiste. Les avocats de la défense du leader du CPUSA pensent que ces affaires sont utilisées par l'accusation pour attiser la peur au sein du jury. Entre cela, et la quantité massive de reportages et de spectateurs présents, comment ne pas influencer le jury ?"
 Red_Scare_Cul.12.d:0 "Pour la deuxième fois au cours du procès des dirigeants du Parti communiste des États-Unis d'Amérique (CPUSA), le juge a déclaré que les cinq avocats de la défense seraient détenus pour outrage au tribunal et punis à l'issue du procès. Cela survient après que la défense ait une fois de plus remis en question la validité et la légitimité de la procédure, soulignant des problèmes liés au processus de sélection du jury et l'atmosphère parfois perturbatrice des spectateurs qui regardaient. Le juge a constamment nié ces affirmations et accuse la défense de se moquer du tribunal et de recourir à des tactiques dilatoires. Certains avocats éminents ont exprimé leur inquiétude quant aux actions du juge."
 Red_Scare_Cul.13.d:0 "Le procès des dirigeants du Parti communiste des États-Unis d'Amérique (CPUSA) s'est terminé par un jury déclarant tous les accusés coupables. Dix des personnes reconnues coupables ont été condamnées à une amende et à cinq ans de prison. Le onzième, Robert Thompson, vétéran de la Seconde Guerre mondiale, s'est vu accorder trois ans en considération de son service en temps de guerre. Le juge a ensuite condamné les cinq avocats de la défense pour outrage au tribunal, leur infligeant des peines allant d'un mois à six mois de prison. Le public soutient largement les condamnations, mais les observateurs juridiques ont été déçus par la condamnation, qui, selon eux, montre un juge faisant preuve d'un caractère vindicatif envers les avocats de la défense. Certains avocats sont allés jusqu'à souscrire à l'affirmation d'un accusé selon laquelle le tribunal était un tribunal fantoche. Quoi qu'il en soit, le public semble soutenir ces condamnations comme un exemple de justice respectée."
 Red_Scare_Cul.14.d:0 "Le Parti communiste des États-Unis d'Amérique (CPUSA) a déclaré qu'il ferait appel de tous les verdicts de culpabilité prononcés lors du procès récemment conclu des dirigeants du parti. Ils ont été reconnus coupables d'avoir violé la loi Smith en appelant au renversement du gouvernement américain. La défense du CPUSA a fait valoir que ses membres exprimaient simplement leurs droits du premier amendement et a affirmé que personne ne préconisait un renversement violent mais une transition pacifique vers le socialisme. Le procès a attiré l'attention du public sur l'influence communiste étrangère aux États-Unis et sur la colère du public envers le CPUSA. Les avocats de la défense, tout au long du procès, ont souligné l'hostilité de la tribune et des procédures judiciaires, ce qui a grandement favorisé l'accusation. Cela a mis en colère le juge qui a fait condamner les avocats pour outrage et les a condamnés à la fin du procès. Le CPUSA espère que la Cour suprême examinera leur appel."
 Red_Scare_Cul.15.d:0 "Le secrétaire général du Parti communiste des États-Unis (CPUSA), Eugene Dennis, a vu sa condamnation en vertu de la loi Smith confirmée dans un arrêt majeur de la Cour suprême. Les juges ont jugé que Dennis ne bénéficiait pas de la protection du premier amendement s'il exerçait ces droits pour plaider en faveur du renversement du gouvernement. La décision du tribunal est un coup dur pour les dirigeants communistes reconnus coupables dans le cadre des procès en vertu de la loi Smith contre les dirigeants du CPUSA. Les observateurs notent que la récente nomination de juges conservateurs à la magistrature a probablement fait pencher les tribunaux en faveur du gouvernement."
 Red_Scare_Cul.16.d:0 "La Cour suprême a confirmé les condamnations des avocats de la défense lors des récents procès des dirigeants du Parti communiste des États-Unis (CPUSA) pour violation de la loi Smith. Les avocats se sont plaints tout au long du procès de procédures inéquitables et de partis pris en faveur de l'accusation. Ils ont également noté la galerie hostile et la presse négative qui recouvrent la nation. A la fin du procès, le juge a ordonné la détention de tous les avocats de la défense et les a condamnés à diverses peines de prison pour outrage au tribunal. Beaucoup pensent que le juge était si hostile qu'il estimait que la défense essayait délibérément de provoquer l'annulation du procès. La Cour suprême a choisi de se concentrer uniquement sur un petit aspect de l'accusation d'outrage et a déclaré que la condamnation était justifiée, confirmant ainsi les condamnations."
 Red_Scare_Cul.17.d:0 "Dans une décision choc, la Cour suprême a annulé les condamnations des avocats de la défense lors des récents procès des dirigeants du Parti communiste des États-Unis (CPUSA) pour violation de la loi Smith. Le juge du procès les a déclarés coupables après les avoir accusés d'avoir délibérément tenté de provoquer la salle d'audience afin d'obtenir l'annulation du procès. Les juges de la Cour suprême ont noté que les condamnations semblaient vindicatives, en particulier lorsque le juge a déclaré \"une affaire inachevée\" avant de prononcer ses condamnations. L'incapacité des avocats à se défendre et leur arrestation immédiate ont également été mises en cause par les juges. La réaction du public devrait être négative, beaucoup accusant le président d'avoir nommé des juges plus libéraux à la Cour suprême."
 Red_Scare_Cul.18.d:0 "La Cour suprême a choqué le public par sa décision d'annuler la condamnation d'Eugene Dennis en vertu de la loi Smith. Dennis, secrétaire général du Parti communiste des États-Unis (CPUSA), a été reconnu coupable d'avoir prôné le renversement violent des États-Unis. Le tribunal a statué que Dennis n'avait pas violé la loi et que ses actions étaient toutes protégées par le premier amendement de la constitution. En outre, le tribunal a également noté que les conditions du procès n'étaient ni idéales ni favorables à la défense, réprimandant le juge du procès. Cette décision étonnante suscitera probablement la colère du gouvernement ainsi que du grand public, qui a massivement soutenu le gouvernement et ses condamnations."
 Red_Scare_Cul.19.d:0 "Les journaux à travers les États-Unis critiquent la Cour suprême et sa décision d'annuler la condamnation d'Eugene Dennis, le secrétaire général du Parti communiste des États-Unis (CPUSA). Il avait été reconnu coupable en vertu de la loi Smith pour incitation au renversement violent du gouvernement des États-Unis. La Cour suprême a statué que Dennis n'avait pas violé la loi et ne pouvait pas être condamné pour avoir exercé ses droits au titre du premier amendement. Le procès avait captivé le pays, en particulier les New-Yorkais qui commençaient à comprendre que la menace communiste ne se limitait pas aux espions étrangers mais également aux autres Américains. Les New-Yorkais ont également organisé des manifestations. De nombreux Américains estiment que les tribunaux sont trop indulgents envers les ennemis de l'État qui se cachent derrière les protections constitutionnelles et estiment que les tribunaux ont considérablement affaibli la capacité du gouvernement à protéger la nation."
 Red_Scare_Cul.20.d:0 "À la suite des décisions controversées de la Cour suprême, qui, selon beaucoup, sapent complètement la capacité du gouvernement à punir et à arrêter les infiltrés communistes, le fougueux sénateur anticommuniste Joseph McCarthy a convoqué une conférence de presse. Dans ses commentaires, le sénateur a condamné la Cour suprême, en particulier les deux juges récemment nommés qui, selon lui, pourraient avoir des tendances d'extrême gauche. Il a souligné que les décisions de justice semblent contraires aux autres décisions de justice rendues à travers le pays et craint que le communisme ne tente d'infiltrer le système judiciaire. Le sénateur McCarthy a appelé le comité des activités anti-américaines de la Chambre des représentants à enquêter sur les juges et à s'assurer qu'aucun complot communiste n'infecte le système judiciaire."
 Red_Scare_Cul.21.d:0 "Le comité des activités anti-américaines de la Chambre des représentants, dans un geste sans précédent, a demandé aux deux juges les plus récemment nommés à la Cour suprême de soumettre des réponses écrites aux questions concernant des affaires récentes impliquant le renversement de communistes condamnés. En outre, des questions seront posées concernant les engagements politiques passés et les convictions des juges. Le comité a déclaré que les réponses seraient lues lors d'une prochaine audience sur les juges et apporteraient des réponses et, espérons-le, un soulagement aux Américains inquiets et mal à l'aise face aux récentes actions du tribunal. Un refus de répondre au congrès peut entraîner une assignation à comparaître du congrès, les obligeant à assister aux audiences."
 Red_Scare_Cul.22.d:0 "Le comité des activités antiaméricaines de la Chambre a lu la réponse officielle des deux juges de la Cour suprême aux questions du comité. Les membres du comité, les journalistes et les observateurs étaient tous stupéfaits en silence. Les juges ont systématiquement défendu leurs actions et leurs antécédents. Ils ont également pris le temps d'expliquer leurs actions au peuple américain comme étant fondées sur la préservation de leurs droits individuels et sur la réduction de la portée excessive du gouvernement. Les réponses éloquentes seront bientôt publiées dans les médias nationaux. Après avoir lu les documents, plusieurs membres du comité ont offert leur propre réponse cinglante, mais le HUAC a décidé de reporter la prochaine audience sur les juges après le week-end. Les observateurs estiment que la commission souhaite connaître la réaction du public avant de décider de poursuivre l'enquête."
 Red_Scare_Cul.23.d:0 "L'opinion publique à l'égard de l'enquête menée par le Comité des activités anti-américaines de la Chambre des représentants sur les deux juges les plus récemment nommés à la Cour suprême s'est détériorée. Les transcriptions et les éditoriaux des rédacteurs des journaux reflètent la conviction générale selon laquelle beaucoup considèrent l'enquête du HUAC comme une vendetta politique et une tentative de saper le pouvoir judiciaire. La plupart des Américains ne sont pas convaincus par l'idée selon laquelle les juges seraient secrètement liés à la menace communiste. Face à ce contrecoup, la HUAC a décidé de mettre fin prématurément à son enquête et de se concentrer sur des questions plus urgentes."
 Red_Scare_Cul.24.d:0 "La réaction du public à l'égard du Comité des activités anti-américaines de la Chambre des représentants et de son enquête sur les deux juges les plus récemment nommés à la Cour suprême est grandement favorable au HUAC. Les transcriptions et les éditoriaux des rédacteurs en chef des journaux reflètent la conviction de beaucoup que l'enquête de la Chambre révèle un dangereux parti pris de gauche au sein du plus haut tribunal du pays. De nombreux Américains estiment que les enquêtes sur les juges devraient être étendues à tous les tribunaux afin d'empêcher un plan communiste visant à éviter les poursuites judiciaires du gouvernement. Les partisans du pouvoir judiciaire craignent que de telles réactions ne fassent que compromettre la capacité des juges à rendre des décisions équitables."
 Red_Scare_Cul.25.d:0 "Les deux juges de la Cour suprême faisant l'objet d'une enquête menée par le Comité des activités anti-américaines de la Chambre des représentants ont présenté leur démission aujourd'hui. Les juges notent qu'ils ne souhaitent pas être une distraction ni même donner l'impression de souiller le tribunal ; ils démissionneront donc. Dans leur déclaration, les deux juges ont souligné qu'ils ne démissionnaient pas par culpabilité mais par désir de protéger le système judiciaire et ses principes. Le président devrait remplacer les juges par des juges plus conservateurs car il ne voudra pas voir ce scénario se reproduire."
 Red_Scare_Cul.26.d:0 "Ces derniers jours, deux nouveaux juges de la Cour suprême ont prêté serment. Cela fait suite à la démission controversée de deux juges suite à leur rôle dans l'annulation de plusieurs condamnations anticommunistes pour des raisons constitutionnelles. Cela a entraîné une réaction négative du public et du Congrès, qui a conduit les juges à démissionner. Le président, connaissant l'état d'esprit du pays, a rapidement choisi deux nouveaux juges conservateurs ayant de forts préjugés anticommunistes pour empêcher toute nouvelle intervention judiciaire dans les affaires fédérales contre le communisme."
 Red_Scare_Cul.27.d:0 "Deux juges de la Cour suprême ont témoigné devant le Comité des activités anti-américaines de la Chambre (HUAC), répondant à l'assignation à comparaître du comité. Certains membres du Congrès ont profité de l'occasion pour fustiger les juges pour leur ingérence dans de récentes affaires judiciaires ciblant les menaces communistes contre les États-Unis. Ils ont également exigé que les juges rendent pleinement compte de leur implication passée ou de leurs relations avec des individus ou des organisations de gauche. Cependant, les juges étaient des experts chevronnés du droit et de la salle d'audience, ils ont présenté des défenses et des déclarations solides qui ont souvent déjoué leurs détracteurs. En fin de compte, ils ont affirmé que leurs récentes décisions n'étaient pas basées sur des équilibres idéologiques, mais sur la légitimité constitutionnelle, et ont averti que leurs décisions contribueraient à garantir qu'aucune idéologie néfaste ne puisse utiliser les tribunaux contre le peuple des États-Unis. Même si les juges se sont défendus de manière experte lors des audiences, il reste à voir comment le public américain réagira aux transcriptions."
 Red_Scare_Cul.28.d:0 "La Cour suprême des États-Unis a annulé la condamnation de dirigeants communistes de bas niveau reconnus coupables en vertu de la loi Smith pour leur appartenance à une organisation prônant le renversement violent du gouvernement. Dans cette décision historique, le tribunal a décidé que la clause de la loi Smith concernant les acteurs prônant le renversement violent du gouvernement américain ne s'appliquait pas à ceux qui croyaient seulement à un renversement violent, mais n'en préconisaient pas la réalisation. Ainsi, le tribunal a annulé les condamnations du leader communiste au motif que leurs droits au titre du premier amendement avaient été violés. La réaction du Congrès, de la Maison Blanche et des agences de sécurité devrait être négative, mais la Cour semble déterminée à ne pas laisser la ferveur du public dicter les normes judiciaires."
 Red_Scare_Cul.29.d:0 "La Cour suprême des États-Unis a décidé de confirmer les condamnations des dirigeants communistes de bas niveau reconnus coupables en vertu de la loi Smith. Le tribunal a souscrit à la décision initiale selon laquelle la loi Smith ne violait pas le premier amendement et que les personnes reconnues coupables étaient impliquées dans une organisation qui croyait au renversement violent du gouvernement. L'opinion dissidente a soutenu que le tribunal n'avait pas pris en compte la différence entre la croyance et le plaidoyer réel en faveur du renversement, ce qui n'a pas laissé de nombreux Américains innocents vulnérables. Quoi qu'il en soit, la décision du tribunal est saluée au Capitole, à la Maison Blanche et parmi les agences de sécurité qui estiment que le tribunal doit continuer à soutenir les efforts visant à protéger les États-Unis. Certains éditoriaux de journaux ont critiqué les tribunaux et affirmé que les récentes réactions négatives du public et les nominations ont coûté au tribunal tout semblant d'indépendance judiciaire."
 Red_Scare_Cul.30.d:0 "La Cour suprême a décidé d'annuler les condamnations prononcées contre les soi-disant Hollywood Ten. Ces scénaristes et réalisateurs ont été accusés d'avoir refusé de comparaître devant le Comité de la Chambre des représentants sur les activités anti-américaines pour nommer les communistes dans l'industrie cinématographique. Les nouveaux juges progressistes ont déplacé le vote pour annuler les condamnations. La décision est largement critiquée par les journaux conservateurs et les membres du Congrès qui accusent le tribunal d'interférer dans la protection de la sécurité nationale des États-Unis. La Cour suprême a jugé que les condamnations et les peines de prison étaient inconstitutionnelles et excessives. La Cour a adopté une position ferme en faveur de la défense des libertés individuelles."