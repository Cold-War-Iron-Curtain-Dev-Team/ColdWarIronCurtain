 #Decision Category
 KOR_ministry_of_national_defense:0 "Ministère de la Défense Nationale"
 KOR_ministry_of_national_defense_desc:0 "Article 33 de la loi organique du gouvernement (ministère de la Défense nationale)\n1. Le ministre de la Défense nationale est chargé des affaires militaires liées à la défense nationale, des ordonnances militaires et d'autres affaires militaires.\n2. Le ministère de la Défense nationale peut avoir un secrétaire adjoint."
 KOR_military_faction_management:0 "Gestion des factions militaires"
 KOR_military_faction_management_desc:0 "Force actuelle des factions\n\nGouvernement provisoire de la République de Corée (KPG) : [?KOR.KPG_strength]\n\nArmée de libération coréenne : [?KOR.KLA_strength]\n\nArmée indépendantiste coréenne : [?KOR.KIA_strength]\n\nArmée révolutionnaire coréenne : [?KOR.KRA_strength]\n\nCorps national coréen de la jeunesse : [?KOR.KNC_strength]\n\nPolice coréenne : [?KOR.KCN_strength]\n\nAcadémie militaire coréenne : [?KOR.KMA_strength]\n\nArmée Nationale Révolutionnaire : [?KOR.NRA_strength]\n\nAcadémie militaire de l'Armée nationale révolutionnaire : [?KOR.NRAMA_strength]\n\nArmée japonaise[?KOR.IJA_strength]: \n\nOfficier du Japon : [?KOR.IJO_strength]\n\nPersonnel japonais : [?KOR.IJP_strength]\n\nOfficier japonais transformé : [?KOR.IJT_strength]\n\nArmée du Mandchoukouo : [?KOR.MAN_strength]\n\nAcadémie militaire du Mandchoukouo : [?KOR.MAA_strength]\n\nDongbuk : [?KOR.DON_strength]\n\nJungnambu : [?KOR.JUN_strength]\n\nSeobuk : [?KOR.SEO_strength]\n\nJunggun : [?KOR.JGG_strength]\n\nÉcole de langues militaires : [?KOR.MLS_strength]\n\nSyngman Rhee loyaliste : [?KOR.SRL_strength]"
