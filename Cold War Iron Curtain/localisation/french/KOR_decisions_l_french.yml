 Reform_Capital_Guard_Command:0 "Réformer le commandement de la Garde de la capitale"
 Reform_Capital_Guard_Command_desc:0 "Le commandement de la Garde de la Capitale est la partie importante de notre défense. Surtout si nous voulons protéger Séoul, alors cela doit être fait. Heureusement, notre commandement de la garde traîne toujours. Avec un petit coup, ils pourraient se réveiller."
