### Viet Minh - South 1950's Events ###

VIN_Sam_Neua_Invade_tt:0 "§RLancez le raid sur Sam Neua§!\nLe Pathet Lao éclate. Le gouvernement royal du Laos leur déclare la guerre et, s'il n'est pas déjà en guerre, au Viet Minh. Le raid du Viet Minh commence alors."
### Country Events ###

## Political ##

# Binh's Recall, 1951 #
Binh_Cung_Leadership.10.t: "Le verdict sur Nam Bo"
Binh_Cung_Leadership.10.d: "Le Comité central a passé le printemps à recueillir sur deux ans des rapports sudistes. En 1949 et 1950, le camarade Binh reçut l'ordre de frapper de front les postes français, et il le fit ; les postes occupés, l'artillerie et l'aviation ont fait ce que font l'artillerie et l'aviation, et Nam Bo a enterré les bataillons qu'elle ne peut pas remplacer. Les ordres venaient du Nord. Les morts sont dans le Sud.\n\nCertains cadres affirment désormais que le commandant qui a obéi à ces ordres doit en répondre et qu'une censure formelle réglerait la question de savoir qui dirige la guerre dans le Sud. D'autres répondent que Binh seul tient ensemble les réseaux de guérilla, les comités urbains et les contacts sectaires, et que briser son statut nous coûterait plus cher que les offensives."
Binh_Cung_Leadership.10.a: "Il devait répondre des pertes de Nam Bo."
Binh_Cung_Leadership.10.b: "Il a mené la guerre que nous lui avions ordonné de mener."

Binh_Cung_Leadership.11.t: "L'invocation du Nord"
Binh_Cung_Leadership.11.d: "Le Parti a décidé d'amener le camarade Binh dans le nord pour un entraînement et des consultations sur la guerre au sens large, y compris la piste de ravitaillement qui doit un jour parcourir toute l'Indochine. La convocation est écrite. Ce qui reste, c'est la route.\n\nLa route directe traverse les forêts du nord-est du Cambodge, passe Stung Treng - rapidement et surveillée par des fusiliers cambodgiens sous commandement français. La route maritime part de Ca Mau par jonque et remonte la côte, plus lente et plus coûteuse en transport, mais l'ennemi ne patrouille pas dans tous les estuaires. Un bataillon d'escorte complet dissuaderait une embuscade, même si chaque fusil envoyé avec lui est un fusil retiré du front sud. Et cet ordre peut encore être annulé : le Sud a un commandant de sa stature, et un seul."
Binh_Cung_Leadership.11.a: "Par voie terrestre, à travers les forêts du nord-est cambodgien."
Binh_Cung_Leadership.11.b: "En jonque depuis Ca Mau et jusqu'à la côte."
Binh_Cung_Leadership.11.c: "Envoyez un bataillon d'escorte complet avec lui."
Binh_Cung_Leadership.11.e: "Annuler l'ordre. Nam Bo ne peut pas l'épargner."

Binh_Cung_Leadership.12.t: "Binh reste à Nam Bo"
Binh_Cung_Leadership.12.d: "La convocation a été retirée. Le camarade Binh reste là où il est depuis 1945, et les comités du Sud ont pris la nouvelle comme un verdict en leur faveur : Nam Bo ne doit pas être dirigé depuis un bureau du Bac Viet.\n\nHanoï a dépensé une véritable autorité pour parvenir à ce résultat. Les consultations se poursuivront sans l'homme qu'elles ont demandé, le chemin sera tracé par d'autres, et il y a des cadres au Nord qui se souviendront de la direction dans laquelle s'est orienté le Comité central."
Binh_Cung_Leadership.12.a: "Le Sud garde son commandant."

Binh_Cung_Leadership.13.t: "La carte d'un courrier"
Binh_Cung_Leadership.13.d: "Le Deuxième Bureau possède un courrier capturé, un croquis et une date. Un officier supérieur du Viet Minh est déplacé de la Cochinchine vers le nord, et l'itinéraire rejoint les voies autour de Stung Treng.\n\nLe 4e Bataillon de Chasseurs Cambodgiens du Commandant Jacques Hogard peut être déployé sur ce terrain aussi longtemps que dure la fenêtre. C'est un bataillon engagé dans une rumeur, dans un pays où il est difficile de se passer d'un bataillon, sur la chance d'attraper un homme dans plusieurs centaines de kilomètres de forêt."
Binh_Cung_Leadership.13.a: "Placez les Chasseurs de Hogard sur les voies de Stung Treng."
Binh_Cung_Leadership.13.b: "Nous n'engagerons pas un bataillon dans une rumeur."

Binh_Cung_Leadership.20.t: "Le Duan rappelé à Hanoï"
Binh_Cung_Leadership.20.d: "Le camarade Le Duan occupe le poste sud depuis la mort de Nguyen Binh. Le Parti le veut désormais dans le Nord, où se décidera la prochaine phase de la guerre, et le poste qu'il quitte passe à son adjoint, Le Duc Tho.\n\nTho a passé ces années à apprendre de l'intérieur les comités du Sud. Il est le plus orthodoxe des deux et le moins patient avec les sectes, les syndicalistes et les commandants locaux qui considèrent encore Nam Bo comme les leurs. La ligne ne changera pas. La main qui l'applique le fera."
Binh_Cung_Leadership.20.a: "Le Duc Tho occupera le poste sud."

Binh_Cung_Leadership.21.t: "Une nouvelle main au bureau Sud"
Binh_Cung_Leadership.21.d: "La nouvelle est venue du Viet Bac. Le camarade Le Duan se dirige vers le nord et le camarade Le Duc Tho parle désormais au nom du Parti à Nam Bo.\n\nLes cadres qui avaient fait la paix avec le jugement d'un homme doivent maintenant le faire avec celui d'un autre. Rien n'a changé dans les directives, ce qui inquiète précisément les commissions qui ont appris où se trouvait l'ancienne flexibilité."
Binh_Cung_Leadership.21.a: "La ligne depuis Hanoï n'a pas changé."

# Binh-Cung Leadership Chain #
Binh_Cung_Leadership.1.t: "Le sacrifice du général Nguyen Binh"
Binh_Cung_Leadership.1.d: "Le 29 septembre 1951, à la demande personnelle du gouvernement central, le camarade Binh quitta nos zones de sécurité pour entreprendre une nouvelle mission dangereuse. Malgré nos précédentes reconnaissances et un détachement de gardes du corps d'élite, nous avons reçu la triste nouvelle, lors d'une embuscade dans la commune de Sre Doc, district de Se San, province de Stung Treng, Cambodge, une force coloniale d'élite française a abattu le général qui s'est battu courageusement et a réussi à infliger de lourdes pertes aux côtés de l'ennemi. Le commandant de la force de protection à cette époque était l'officier de bataillon Nguyen Van Si qui avait télégraphié à notre Haut Commissariat pour confirmer le sacrifice du général Binh."
Binh_Cung_Leadership.1.a: "Le Général Binh est toujours dans nos coeurs, son âme continuera à se battre !"

Binh_Cung_Leadership.2.t: "Décès du brigadier Nguyen Binh"
Binh_Cung_Leadership.2.d: "Le 29 septembre 1951, après des années de traque, nos services de renseignement et les éclaireurs khmers ont pu retrouver et confirmer l'identité du célèbre commandant en chef du Sud Vietminh : le brigadier Nguyen-Binh. Malgré notre plan bien préparé et exécuté et exploité l'élément de surprise, nous avons subi quelques pertes mais avons pu traquer le chef du Vietminh du Sud dans la commune de Sre Doc, district de Se San, province de Stung Treng, Cambodge avec quelques soldats Vietminh capturés qui ont confirmé que le cadavre est le célèbre brigadier lui-même et a été revérifié par nos photos et dossiers d'informations..."
Binh_Cung_Leadership.2.a: "Un homme courageux est parti ! Mais c'est un grand coup porté à l'Esprit de Corps du Vietminh !"

Binh_Cung_Leadership.3.t: "L'évasion audacieuse du général Nguyen Binh"
Binh_Cung_Leadership.3.d: "Le 29 septembre 1951, à la demande personnelle du gouvernement central, le camarade Binh quitta nos zones de sécurité pour entreprendre une nouvelle mission dangereuse. Avec l'aide de nos alliés khmers et d'un détachement de gardes du corps d'élite, nous avons pu repousser une embuscade française dans la commune de Sre Doc, district de Se San, province de Stung Treng, Cambodge, tandis que les forces coloniales d'élite françaises ont réussi à infliger de lourdes pertes à nos côtés mais le général a pu s'échapper bien que blessé. Le commandant de la force de protection à cette époque était l'officier de bataillon Nguyen Van Si qui avait télégraphié à notre Haut Commissariat pour confirmer la fuite audacieuse du général Binh !"
Binh_Cung_Leadership.3.a: "Dame Chance sourit à nouveau !"

Binh_Cung_Leadership.4.t: "Nguyen Binh s'échappe à nouveau"
Binh_Cung_Leadership.4.d: "Le 29 septembre 1951, malgré des années de traque et de gaspillage d'innombrables francs, nos services de renseignement et les éclaireurs khmers ont réussi à retrouver et à perdre les traces du célèbre commandant en chef du Sud Vietminh : le brigadier Nguyen-Binh. Malgré notre plan bien préparé et exécuté et l'effet de surprise exploité, nous avons subi de légères pertes mais n'avons pas été en mesure de traquer le chef du Vietminh du Sud dans la commune de Sre Doc, district de Se San, province de Stung Treng, Cambodge. Certes nous avons capturé quelques soldats et officiers Vietminh mais la cible principale : le filou s'est échappé... Encore une fois !"
Binh_Cung_Leadership.4.a: "Nous l'aurons la prochaine fois..."

Binh_Cung_Leadership.5.t: "La défection de Cung"
Binh_Cung_Leadership.5.d: "Selon le Xac-Te, Kieu-Cong-Cung était un brigadier vietminh engagé dans la résistance communiste contre la domination française au Vietnam, tout en adhérant aux principes marxistes de lutte des classes et d'anti-impérialisme. Cependant, après la mort du brigadier Nguyen-Binh après notre raid réussi, l'influence de Cung a diminué. Sa promotion d'une vision nationaliste plus modérée du marxisme, qui mettait l'accent sur l'autonomisation individuelle et le développement économique dans un cadre capitaliste, s'écartait de l'idéologie marxiste du Vietminh. Ce changement idéologique, associé aux luttes de pouvoir internes au Viet-minh et aux pressions extérieures de Moscou, a conduit à sa purge du Viet-minh. Le Xac-Te a reçu des nouvelles selon lesquelles Cung avait réussi à faire défection vers la RPC (si la République de Chine gagnait sur le continent alors : Cung s'est enfui vers les provinces du Sud) et a confirmé que Cung avait tenté en vain de contacter notre gouvernement et il nous a depuis exhorté à l'accepter pour lutter contre la folie du Viet-minh et son échec à préserver la culture vietnamienne."
Binh_Cung_Leadership.5.a: "Nous pouvons certainement utiliser ses talents"
Binh_Cung_Leadership.5.b: "Qu'il s'installe comme réfugié politique"

Binh_Cung_Leadership.6.t: "La trahison de Cung"
Binh_Cung_Leadership.6.d: "Selon nos renseignements militaires, Kieu Cong Cung, un ancien brigadier vietminh, s'était initialement engagé dans la résistance contre la domination coloniale française au Vietnam, suivant les principes marxistes de lutte des classes et d'anti-impérialisme. Cependant, après la disparition du brigadier Nguyen Binh sous le raid barbare des Français, l'engagement de Cung a faibli. Il a commencé à promouvoir une forme réactionnaire de nationalisme, mettant l'accent sur l'autonomisation individuelle et le développement économique dans un cadre capitaliste, qui s'opposait catégoriquement à l'idéologie marxiste du Vietminh.\n\nCette déviation idéologique, combinée aux luttes de pouvoir internes et aux pressions extérieures de Moscou, a conduit à l'expulsion nécessaire de Cung du Vietminh. Des rapports récents indiquent que Cung a fait défection en RPC (ou dans les provinces du Sud si la République de Chine gagne sur le continent) et a tenté de contacter des éléments réactionnaires, y compris nos ennemis, en demandant l'asile."
Binh_Cung_Leadership.6.a: "Sa place est là, pourrissant aux côtés des chiens réactionnaires"

Binh_Cung_Leadership.7.t: "[GetNewspaperHeader]La guerre civile éclate au sud du Vietminh"
Binh_Cung_Leadership.7.d: "Dans une tournure dramatique des événements, l'ancien général de brigade Kieu-Cong-Cung et ses camarades syndicalistes ont déclenché une guerre civile au sein du Viet-minh du Sud, défiant les factions staliniennes dominantes. Cung, précédemment expulsé du Vietminh pour avoir promu une approche nationaliste plus modérée du marxisme, a rassemblé un soutien important parmi ceux qui sont déçus par la direction stalinienne. De violents affrontements ont été signalés alors que les syndicalistes de Cung s'efforcent de récupérer leur influence et de promouvoir leur vision du développement économique et de l'autonomisation individuelle dans un cadre socialiste. Le conflit interne menace de déstabiliser davantage la région alors que la guerre en cours contre la France se poursuit, alors que les deux factions se disputent le contrôle du mouvement révolutionnaire au Sud-Vietnam."
Binh_Cung_Leadership.7.a: "Où se trouve exactement le Vietnam ?"

Binh_Cung_Leadership.8.t: "La trahison de Buu"
Binh_Cung_Leadership.8.d: "Selon nos renseignements militaires, Tran Quoc Buu, un ancien commandant du Vietminh, s'était initialement engagé dans la résistance contre la domination coloniale française au Vietnam et avait dirigé le célèbre 25e commando Dac Cong, souscrivant aux principes syndicalistes soréliens de lutte industrielle et d'anti-impérialisme. Cependant, après la disparition du brigadier Nguyen Binh sous le raid barbare des Français, l'engagement de Buu a faibli. Il a commencé à promouvoir une forme réactionnaire de syndicalisme, mettant l'accent sur l'autonomisation syndicale et le développement économique dans un cadre multipartite, qui s'opposait catégoriquement à l'idéologie marxiste du Vietminh.\n\nCette déviation idéologique, combinée aux luttes de pouvoir internes et aux pressions extérieures de Moscou, a conduit à l'expulsion nécessaire de Buu du Vietminh. Des rapports récents indiquent que Buu a fait défection à Paris via un vol organisé par les syndicats syndicalistes français et qu'il a tenté de contacter des éléments réactionnaires, y compris nos ennemis, en demandant l'asile."
Binh_Cung_Leadership.8.a: "Laissez-le partir. Les syndicalistes n'ont jamais été les nôtres."

Binh_Cung_Leadership.9.t: "L'ancien commandant vietnamien Tran-quoc-Buu repéré à Paris"
Binh_Cung_Leadership.9.d: "Paris, 1952 - Tran Quoc Buu, ancien commandant du Vietminh et chef du célèbre 25e commando Dac Cong, a été repéré à Paris, après avoir fait défection du Nord-Vietnam à la suite de conflits idéologiques au sein du Vietminh l'année dernière. Connu pour son engagement initial dans la résistance contre la domination coloniale française et son adhésion aux principes syndicalistes soréliens, la déviation idéologique de Buu et la promotion d'une forme nationaliste de syndicalisme révolutionnaire ont conduit à son expulsion.\n\nLes journalistes ont confirmé que Buu avait demandé l'asile en France, avec l'aide des syndicats syndicalistes français. On l'a vu suivre des cours de syndicaliste révolutionnaire à la Confédération générale des travailleurs français (CFTC), rue Montholon."
Binh_Cung_Leadership.9.a: "Demandez à la Sûreté de le surveiller."
Binh_Cung_Leadership.9.b: "C'est un homme libre dans une république libre."
#End

#VIN News Event
VIN_SOV.0.t: "[GetNewspaperHeader]L'Union soviétique a reconnu la République démocratique du Vietnam"
VIN_SOV.0.d: "La première présence de Vietnamiens en URSS remonte au début des années 1920. Ces individus étaient principalement des étudiants fréquentant les universités du Komintern, en particulier l'Université communiste des travailleurs de l'Est. Environ 70 étudiants vietnamiens se sont engagés dans ce programme estimé d'éducation communiste en Russie soviétique. Hô Chi Minh fait notamment partie de ceux qui poursuivent leurs études à Moscou durant cette période, aux côtés d'autres membres éminents du Parti communiste indochinois. \nLe 30 janvier 1950, l'Union soviétique, avec ses États satellites d'Europe de l'Est et la nouvelle République populaire de Chine, est devenue la première à accorder une reconnaissance diplomatique à la République démocratique du Vietnam pendant la première guerre d'Indochine."
VIN_SOV.0.a: "Vive la fraternité !"

VIN_PRC.0.t: "[GetNewspaperHeader]La République populaire de Chine reconnaît la République démocratique du Vietnam"
VIN_PRC.0.d: "Le 18 janvier 1950, la République populaire de Chine reconnaît officiellement la République démocratique du Vietnam. Ce geste diplomatique significatif marque une étape cruciale dans le contexte de la première guerre d'Indochine, renforçant les liens entre les deux nations et mettant en lumière leurs engagements idéologiques communs. \nCette reconnaissance a conféré au Viet Minh une légitimité politique essentielle et, surtout, a facilité l'aide militaire et matérielle cruciale de son puissant voisin du nord, ainsi que de l'Union soviétique."
VIN_PRC.0.a: "Vive la fraternité !"

VIN_Napalm.0.t: "[GetNewspaperHeader]L'armée française a utilisé le napalm pour la première fois !"
VIN_Napalm.0.d: "Après avoir subi de multiples défaites contre les forces du Vietminh, l'armée française est désormais équipée d'armes de fabrication américaine et a commencé à utiliser le napalm pour la première fois lors de la première guerre d'Indochine à Tien Yen, province de Quang Ninh. \nMais ils n'ont pas pu empêcher les forces vietnamiennes de poursuivre leur volonté de libération. \nCette action a considérablement affecté la population civile, entraînant de nombreuses victimes et d'importantes destructions de villages et de terres agricoles. Nous devons les arrêter à tout prix."
VIN_Napalm.0.a: "Les Français sont déprimés maintenant, n'est-ce pas ?"

VIN_Secret_Army.0.t: "[GetNewspaperHeader]Pol Pot a créé l'Armée révolutionnaire du Kampuchéa"
VIN_Secret_Army.0.d: "Selon les renseignements que nous avons recueillis, l'Armée révolutionnaire du Kampuchéa (KRA) est issue du soulèvement paysan qui a eu lieu dans le district de Samlout, dans la province de Battambang, en 1967. Actuellement, nous manquons d'informations détaillées sur cette force, mais on sait qu'elle a reçu une formation et des fournitures en provenance de Chine. Devons-nous nous en inquiéter ?"
VIN_Secret_Army.0.a: "Vont-ils se battre pour eux-mêmes ?"

VIN_Liberation.0.t: "[GetNewspaperHeader]Libération de Phuoc Long"
VIN_Liberation.0.d: "La victoire à Phuoc Long, connue sous le nom d'Opération Route 14-Phuoc Long, constitue une étape importante dans la lutte contre l'agression américaine et dans la quête du salut national. Cette réussite est le résultat des sacrifices héroïques consentis par l'Armée de libération du Sud-Vietnam (LASV), le PAVN et notre peuple, en particulier celui de la province de Phuoc Long. Le soutien des travailleurs du caoutchouc et des communautés ethniques minoritaires a été essentiel pour garantir cette victoire. \nCette victoire a non seulement causé un revers important à l'ARVN et au gouvernement sud-vietnamien, mais a également marqué le début d'une nouvelle phase sur le champ de bataille. Le corridor stratégique a été élargi, reliant nos bases et créant des conditions favorables à l'offensive générale et au soulèvement du printemps 1975. \nLa quantité importante de munitions, d'armes et de véhicules capturés dans la province de Phuoc Long a considérablement renforcé la puissance de feu de nos soldats, a contribué à raccourcir la guerre et a contribué de manière décisive à la victoire globale. Le triomphe de la province de Phuoc Long constitue un puissant témoignage de la détermination inébranlable de notre nation à libérer le Sud et à unifier le pays."
VIN_Liberation.0.a: "Xungphong !"

VIN_Battle.0.t: "[GetNewspaperHeader]Victoire à la bataille de Ia Drang"
VIN_Battle.0.d: "La bataille de Ia Drang, qui a eu lieu en novembre 1965 dans les hauts plateaux du centre, a été l'une des premières et des plus féroces batailles entre les Forces armées populaires de libération du Vietnam du Sud et l'armée américaine. Avec une détermination inébranlable et un courage extraordinaire, les soldats vietnamiens ont pris l'ennemi par surprise avec la tactique consistant à « lutter contre les Américains et frapper ». En se rapprochant de l'ennemi, nos troupes ont neutralisé la puissance de feu écrasante de l'ennemi, infligeant de lourdes pertes aux forces américaines. \nMalgré les pertes subies, nos troupes ont remporté une victoire significative, portant un coup dur au moral de l'armée américaine. La bataille a également démontré la remarquable maturité militaire de nos forces armées, notamment pour contrer les tactiques d'assaut héliportées des États-Unis. L'image de soldats vietnamiens dotés d'armes rudimentaires mais d'un esprit d'acier inébranlable symbolise la détermination de la nation à vaincre."
VIN_Battle.0.a: "On comprend désormais comment les Américains se battent"

VIN_LAO.0.t: "Le Pathet Lao a reconnu la République démocratique du Vietnam"
VIN_LAO.0.d: "Avant le retour des Français en Indochine en 1946, le Laos accéda brièvement à son indépendance. Cependant, sous la pression des forces coloniales françaises, le pays retombe sous leur contrôle. Le mouvement de résistance Lao Issara, dirigé par le prince Souphanouvong, est devenu un tournant important dans la lutte pour l'indépendance nationale. \nAvec le soutien de la République démocratique du Vietnam, le Pathet Lao, qui succéda à Lao Issara, remporta des victoires significatives qui contraignirent la France à signer les accords de Genève en 1954. Cependant, la paix qui suivit fut de courte durée, les États-Unis intensifiant leur intervention au Laos, conduisant finalement à une guerre civile prolongée. \nSous la direction du Parti révolutionnaire populaire lao, le Neo Lao Haksat est devenu une force politique importante qui représentait les espoirs et les aspirations du peuple. La lutte du peuple laotien pour l'indépendance et la démocratie s'est heurtée à de nombreux défis et a finalement abouti à une victoire remarquable."
VIN_LAO.0.a: "Vive la fraternité !"

VIN_INO.0.t: "L'Indonésie a reconnu la République démocratique du Vietnam"
VIN_INO.0.d: "Les relations entre le Vietnam et l'Indonésie ont une longue histoire qui remonte à la période féodale. Les royaumes anciens, tels que Champa et ceux de la région de Tam Phat Te (qui fait maintenant partie de l'Indonésie), ont interagi très tôt avec les royaumes vietnamiens. Les documents historiques mentionnent qu'un envoyé de Tra Oa s'est rendu au Vietnam sous la dynastie Tran, soulignant ainsi les relations diplomatiques entre les deux nations. En outre, le royaume Champa entretenait des liens étroits avec les petits États indonésiens, notamment dans le domaine de la culture bouddhiste. \nLes relations Vietnam-Indonésie ont connu de nombreuses fluctuations au cours de l'histoire, notamment des périodes de coopération commerciale, d'échanges culturels et de conflits. Ces derniers temps, les relations bilatérales se sont considérablement renforcées. Cao Ba Quat, un érudit vietnamien, a été envoyé comme envoyé en Indonésie, où il a fourni des descriptions vivantes du pays et de ses habitants. \nAprès avoir obtenu leur indépendance, les deux pays ont officiellement établi des relations diplomatiques le 30 décembre 1955, marquant un nouveau chapitre dans la coopération entre les deux nations."
VIN_INO.0.a: "Vive la fraternité !"

VIN_KPA.0.t: "La RPDC a reconnu la République démocratique du Vietnam"
VIN_KPA.0.d: "Le 31 janvier 1950, la République populaire démocratique de Corée a franchi une étape importante en reconnaissant officiellement et en établissant des relations diplomatiques avec la République démocratique du Vietnam. Cette évolution a fait de la Corée du Nord la troisième nation, après l'Union soviétique et la Chine, à étendre sa reconnaissance formelle et à favoriser ses relations diplomatiques avec le Vietnam. \nLa relation entre le Vietnam et la Corée du Nord représente un récit distingué de solidarité entre deux nations socialistes. Depuis sa création en 1950, ce partenariat a surmonté de nombreux défis historiques tout en préservant son identité unique. Il existe un potentiel considérable de développement ultérieur, ainsi qu'une série de défis qui doivent être relevés. Pourtant, grâce à une coopération mutuelle et à un engagement de solidarité, les deux pays ont la possibilité de surmonter ces obstacles et de favoriser ensemble un avenir prospère."
VIN_KPA.0.a: "Vive la fraternité !"

VIN_Intro.1.t: "L'Union nationale populaire du Vietnam : un triomphe révolutionnaire"
VIN_Intro.1.d: "À un moment historique pour la révolution, le Hiep Quoc dan Viet Nam de Hoi Lien a fièrement annoncé la consolidation et l'expansion de l'Union populaire nationale du Vietnam, marquant une réalisation majeure dans la garantie de la stabilité politique et l'adoption massive de la pensée marxiste dans toutes les entités politiques progressistes du Nord. Sous la direction avisée du président Hô Chi Minh, l'unité du peuple a été encore renforcée, garantissant que la République démocratique du Vietnam reste un gouvernement du peuple, par le peuple et pour le peuple. \nL'intégration de toutes les factions patriotiques - du Viet Minh, du Parti démocrate, du Parti socialiste et de la Fédération nationale du travail - dans l'Union populaire nationale a permis au gouvernement révolutionnaire de mobiliser tous les ouvriers, agriculteurs, intellectuels et soldats sous une bannière commune. Avec cette organisation de masse sans précédent, les idéaux du marxisme-léninisme, de libération nationale et de construction socialiste sont désormais ancrés dans le tissu même de la gouvernance. La création de cette Union garantit qu'aucune force, qu'elle soit réactionnaire intérieure ou impérialiste étrangère, ne pourra diviser la volonté révolutionnaire du peuple vietnamien. \nDepuis les grandes villes de Ha Noi et Hai Phong jusqu'aux vastes campagnes du delta du fleuve Rouge, l'administration révolutionnaire a mis en oeuvre avec succès des campagnes d'éducation, de collectivisation économique et de mobilisation militaire, garantissant la loyauté inébranlable du peuple à la cause de la libération nationale et de la transformation socialiste. L'expansion rapide des organisations marxistes a solidifié les fondements idéologiques de l'État, démontrant clairement que le socialisme n'est pas seulement la voie vers la victoire mais aussi la clé pour assurer un avenir juste et prospère à tous les Vietnamiens."
VIN_Intro.1.a: "Une victoire décisive de la révolution !"

VIN_Intro.2.t: "L'Association indochinoise pour la recherche sur le marxisme : diffuser la pensée révolutionnaire"
VIN_Intro.2.d: "Face aux menaces croissantes des forces réactionnaires et à l'agression impérialiste, le Parti communiste indochinois (Dang Cong san Dong Duong) a pris la décision tactique de se « dissoudre » officiellement en 1945. En réalité, le Parti s'est retiré dans le secret, lui permettant de poursuivre ses activités révolutionnaires tout en évitant la répression. Pour maintenir son influence idéologique et organisationnelle, le Parti a créé l'Association indochinoise pour la recherche sur le marxisme, une entité chargée de diffuser publiquement les principes marxistes-léninistes sous couvert d'études académiques et intellectuelles. \nEn 1949, l'Association était devenue un outil puissant pour la révolution, intégrant l'idéologie marxiste au sein de toutes les principales entités politiques alignées sur le Lien Viet, le Viet Minh et les structures militaires luttant contre le colonialisme français. A travers des journaux tels que Su That, l'Association poursuit la mission de l'ancien Co Giai Phong, diffusant la théorie révolutionnaire tout en évitant toute association directe avec le Parti communiste clandestin. \nL'association a fonctionné comme un pont entre le Parti et les forces politiques progressistes plus larges, garantissant que le marxisme n'était pas seulement l'idéologie d'un mouvement clandestin mais une force intellectuelle et politique croissante adoptée par les ouvriers, les paysans, les étudiants et les nationalistes. Intégrées au sein des institutions gouvernementales, des commandements militaires et des organisations de masse, les cellules du Parti travaillaient de l'intérieur pour guider, éduquer et radicaliser les cadres tout en maintenant une façade d'ouverture idéologique. \nLa création de l'Association pour la recherche sur le marxisme a permis aux forces révolutionnaires de consolider leur contrôle idéologique sur la résistance, garantissant ainsi que la lutte pour l'indépendance reste fermement ancrée dans le socialisme scientifique. Grâce à l'éducation, aux publications et à l'influence organisationnelle."
VIN_Intro.2.a: "Le marxisme mènera les masses à la victoire contre l'impérialisme et les forces réactionnaires."

VIN_Econ.1.t: "Le mouvement coopératif rural : un triomphe de la force collective"
VIN_Econ.1.d: "Dans une réalisation monumentale pour la révolution, le ministère de Canh Nong a fièrement annoncé le succès et l'expansion du mouvement Hop Tac Xa (coopérative rurale), marquant une étape historique vers la collectivisation de la nation. Suivant les enseignements visionnaires du président Hô Chi Minh, inspirés par son ouvrage Duong Kach Menh (La voie révolutionnaire), le modèle coopératif s'est avéré être le fondement d'une économie agricole véritablement socialiste - une économie où les fruits du travail du peuple restent entre leurs mains plutôt que d'être thésaurisés par les propriétaires et les marchands exploiteurs. \nLe premier Hop Tac Xa a été créé à Thuy Tinh-Dan Chu en 1948 et, en seulement un an, le mouvement s'est étendu à toutes les zones libérées, transformant le paysage économique du Vietnam. En collectivisant l'agriculture, les travailleurs ruraux partagent désormais équitablement les ressources, le travail et les terres, garantissant ainsi une plus grande productivité, une plus grande sécurité économique et une plus grande solidarité entre les populations. Ce mouvement a donné du pouvoir aux agriculteurs, aux travailleurs et à la classe ouvrière, les plaçant au coeur de la lutte socialiste. Ils ne seront plus à la merci des propriétaires féodaux ou des profiteurs étrangers : grâce au système Hop Tac Xa, ils ont pris le contrôle de leur propre destin. \nLe ministère de Canh Nong a déclaré qu'il s'agissait de la première grande victoire de la révolution économique, ouvrant la voie à une collectivisation et une modernisation plus poussées. Avec de nouveaux projets d'irrigation, des réformes agraires et des fermes coopératives élargies, le peuple vietnamien progresse vers l'autosuffisance agricole totale. Ce n'est qu'un début : à mesure que la révolution s'approfondit, la force collective du peuple construira un avenir socialiste prospère. \nLe camarade Hô Chi Minh et le ministère de Canh Nong célèbrent ce succès comme une étape décisive vers la libération totale."
VIN_Econ.1.a: "Nous construirons une société libérée de l'oppression, de la pauvreté et des chaînes impérialistes !"

VIN_Econ.2.t: "Le Grand Plan d'Amélioration Agricole - Une Victoire pour la Révolution !"
VIN_Econ.2.d: "Une nouvelle ère de prospérité s'ouvre au coeur de la révolution alors que le ministère de l'Agriculture (Bo Canh Nong), le Viet Minh et le front Lien Viet, sous la direction visionnaire du président Ho Chi Minh, dévoilent un ambitieux plan d'amélioration agricole. Cette initiative marque une étape décisive vers l'autosuffisance, la revitalisation rurale et l'autonomisation de la paysannerie, garantissant que les fruits de la terre restent entre les mains de ceux qui la cultivent. \nLe plan agricole Viet Bac, introduit au début de 1949, vise à moderniser les méthodes agricoles traditionnelles, à augmenter les rendements et à améliorer les infrastructures d'irrigation pour renforcer à la fois la sécurité alimentaire et l'effort de guerre. Reconnaissant l'importance stratégique de l'agriculture, le président Hô Chi Minh a publié le décret n° 68/SL le 18 juin 1949, lançant officiellement une initiative nationale d'ingénierie hydraulique visant à protéger et à étendre les réseaux d'irrigation, protégeant ainsi les terres agricoles des inondations et des sécheresses. \nEn août 1949, la Conférence agricole du Viet Bac fut convoquée, réunissant des dirigeants agraires, des cadres révolutionnaires et des agriculteurs locaux pour évaluer les progrès et fixer de nouveaux objectifs pour le développement agricole. Dans un message puissant adressé à la conférence, le président Hô Chi Minh a exhorté les responsables à rester proches du peuple, à apprendre d'eux et à montrer l'exemple, en veillant à ce que la réforme agricole s'aligne sur les réalités locales. \nLe processus de réforme agraire en est encore à ses balbutiements, renforçant la foi du peuple dans la révolution. Les propriétaires terriens et féodaux, qui exploitaient autrefois le travail des paysans, sont démantelés et restructurés, rendant la terre aux mains légitimes des agriculteurs. Les politiques du ministère de l'Agriculture ont déjà abouti à une augmentation de la production alimentaire, soutenant à la fois la population rurale et les courageuses forces révolutionnaires luttant pour la libération nationale. \nAvec une détermination inébranlable, la révolution agricole continue de renforcer l'épine dorsale de la résistance, prouvant que le pouvoir du peuple, lorsqu'il est uni sous la direction du Parti et du président Hô Chi Minh, est imparable. Le succès de cette initiative n'est pas seulement une victoire économique - c'est un symbole du chemin du Vietnam vers le socialisme et l'indépendance !"
VIN_Econ.2.a: "Un peuple bien nourri est un peuple victorieux ! Vive le président Hô Chi Minh !"

VIN_Econ.3.t: "La Confédération des syndicats du Vietnam adhère pleinement à la voie révolutionnaire !"
VIN_Econ.3.d: "Dans une victoire capitale pour la classe ouvrière et le mouvement révolutionnaire, la Confédération des syndicats du Vietnam (Tong Lien doan Lao dong Viet Nam) s'est officiellement alignée sur le Hoi Lien hiep Quoc dan Viet Nam (Lien Viet Nam), l'Association d'études marxistes d'Indochine (Hoi Nghien Cuu Chu Nghia Marx O Dong Duong) et le grand leadership du président Ho Chi Minh. Cette unification marque une réussite historique dans la consolidation du mouvement ouvrier socialiste, garantissant que les travailleurs du Vietnam se tiennent fermement sous la bannière du marxisme-léninisme dans la lutte contre l'oppression coloniale et l'exploitation capitaliste. \nSous la direction du camarade Hoang Quoc Viet, la Confédération a mobilisé les travailleurs de tous les secteurs - des usines industrielles et des mines aux coopératives agricoles - pour accélérer la lutte pour une économie socialiste. L'expansion de la production dirigée par les travailleurs, les initiatives économiques planifiées par l'État et la mobilisation massive des travailleurs ont déjà connu de grands succès. Plus de 57 installations de production de guerre ont été créées, garantissant que nos soldats révolutionnaires soient entièrement équipés pour le combat. \nLes principes de gestion démocratique du travail, d'éducation politique de masse et de collectivisation sur le lieu de travail sont désormais mis en oeuvre à l'échelle nationale. Les mouvements Thi dua san xuat, thi dua xay dung (Rivaliser dans la production, Rivaliser dans la construction) et Cai tien ky thuat, phat huy sang kien, trau doi nghe nghiep (Améliorations techniques, innovation et développement des compétences) ont acquis une immense popularité, unissant les travailleurs sous une seule cause révolutionnaire. \nMême dans les territoires occupés par la France, de courageux travailleurs poursuivent la lutte, menant des sabotages économiques, des mobilisations clandestines et une résistance secrète contre les colonialistes. Le courage de la classe ouvrière garantit qu'aucun centimètre du Vietnam ne restera entre les mains des impérialistes ou de leurs collaborateurs. \nGrâce à cette unification monumentale, le prolétariat vietnamien est plus fort que jamais, uni dans la cause de la construction socialiste et de la libération nationale. La Confédération des syndicats vietnamiens est devenue l'avant-garde des travailleurs, garantissant que la révolution reste inébranlable. Avec la direction du président Hô Chi Minh et le soutien indéfectible du Lien Viet, le mouvement ouvrier continuera à construire un Vietnam socialiste libéré de l'impérialisme, de la réaction et de l'exploitation !"
VIN_Econ.3.a: "Les ouvriers se sont levés ! Vive le mouvement ouvrier socialiste !"

VIN_Econ.4.t: "Commémoration de la Semaine d'Or - Un témoignage de l'unité nationale !"
VIN_Econ.4.d: "Aujourd'hui, partout en République démocratique du Vietnam, le peuple célèbre l'anniversaire de Tuan Le Vang (Semaine d'or), un événement capital dans l'histoire de notre lutte révolutionnaire. Cette semaine historique, qui s'est déroulée du 17 au 24 septembre 1945, a marqué une démonstration sans précédent d'unité nationale, de sacrifice et de ferveur patriotique, alors que des personnes de tous horizons ont contribué avec leurs richesses et leurs ressources pour soutenir la nation nouvellement libérée. \nDes montagnes les plus septentrionales au coeur impérial de Hué et aux terres Cham de Ninh Thuan, des individus et des dirigeants patriotes se sont tenus aux côtés de la révolution. Vuung Chi Sinh, le roi Meo de Dong Van, a généreusement fait don de neuf canettes d'or et de plus de deux millions de dong bac trang. L'impératrice Nam Phuong, épouse de l'ancien empereur Bao-Dai, a donné l'exemple aux habitants de Hué en faisant don de ses propres bijoux, les incitant à contribuer 420 langs d'or. Même la princesse Them du peuple Cham a présenté une couronne d'or, des offrandes de fruits symboliques et des objets de famille ancestraux pour aider la cause nationale. Ces actes de dévotion reflètent la solidarité profondément enracinée des divers peuples du Vietnam dans la lutte pour l'indépendance. \nAlors que nous célébrons cet anniversaire, les Hoi Nghien Cuu Chu Nghia Marx O Dong Duong et Lien Viet réaffirment leur engagement envers la politique de collaboration de classe du président Ho Chi Minh. Contrairement à la lutte de classes rigide promue par les factions dogmatiques marxistes-léninistes et staliniennes, notre voie révolutionnaire reconnaît les contributions vitales de la bourgeoisie patriotique (tu ban thanh thi yeu nuic) à la libération nationale. Tout comme les propriétaires terriens et les industriels qui se tiennent aux côtés du peuple ont été accueillis sur les premières lignes de la résistance, la révolution continue aujourd'hui d'embrasser toutes les forces patriotiques désireuses de se consacrer à la cause d'un Vietnam fort, indépendant et socialiste. \nL'anniversaire de la Semaine d'Or rappelle que la révolution n'est pas seulement la cause des ouvriers et des paysans mais de la nation vietnamienne tout entière. La lutte pour la libération rassemble tous ceux qui chérissent l'indépendance, l'autodétermination et le rêve d'un Vietnam prospère."
VIN_Econ.4.a: "Vive les contributions de nos Riches Camarades !"

VIN_Econ.5.t: "Hô Chi Minh demande des aides économiques"
VIN_Econ.5.d: "La République démocratique du Vietnam a demandé l'aide économique soviétique pour reconstruire son économie déchirée par la guerre et renforcer sa résistance contre les forces coloniales françaises. Devons-nous apporter de l'aide ?"
VIN_Econ.5.a: "Approuver la demande"
VIN_Econ.5.b: "Nous ne pouvons pas épargner les ressources"

VIN_Econ.6.t: "Hô Chi Minh demande des aides économiques"
VIN_Econ.6.d: "Le président Hô Chi Minh a appelé les États-Unis à une aide économique, mettant l'accent sur la lutte du Vietnam pour l'indépendance nationale et la reconstruction d'après-guerre. Comment réagirons-nous ?"
VIN_Econ.6.a: "Étendre l'aide économique."
VIN_Econ.6.b: "Refusez la demande."

VIN_Econ.7.t: "Une nouvelle aube pour le système financier vietnamien"
VIN_Econ.7.d: "Dans une réalisation historique pour la jeune République démocratique du Vietnam, le camarade Hoang Dinh Tung (Isamu Fujita), aux côtés du ministère des Finances dirigé par le camarade Le Van Hien, a dirigé avec succès la formalisation de la monnaie Dong et a jeté les bases d'un système financier moderne. Cette réforme historique marque la première étape vers la garantie de la souveraineté économique du Vietnam, garantissant que la nation puisse résister à la fois à l'asservissement économique impérialiste et à l'instabilité financière interne. \nSous la direction du camarade Tung, les institutions financières ont été modernisées, les politiques bancaires ont été standardisées et un système monétaire centralisé a été introduit pour stabiliser l'économie vietnamienne. Sa vaste expérience en tant qu'ancien responsable de la banque de Yokohama lui a permis de mettre en oeuvre des mécanismes financiers pratiques adaptés à une économie à orientation socialiste. Grâce à ces progrès, le Vietnam possède désormais les outils nécessaires pour financer ses efforts de reconstruction, soutenir le développement industriel et agricole et soutenir la guerre d'indépendance. \nEn outre, sous les auspices de Hoi Lien Hiep Quoc Dan Viet Nam, de nouveaux liens économiques avec le Japon et d'autres pays asiatiques ont été établis. Par la voie diplomatique, des accords commerciaux ont été conclus, garantissant la fourniture de biens essentiels, de matériaux industriels et d'une aide financière pour alimenter la voie de la modernisation socialiste du Vietnam. Le charbon vietnamien de Hon Gai et l'apatite de Lao Cai sont devenus des exportations essentielles, renforçant le rôle du Vietnam dans le commerce régional tout en le favorisant."
VIN_Econ.7.a: "Le premier pas vers notre progression vers le socialisme !"

VIN_Econ.8.t: "Création de la Banque Nationale"
VIN_Econ.8.d: "Avant la Révolution d'août 1945, le Vietnam était un pays colonial féodal sous le règne des colonialistes français. Les colonialistes français ont fondé et protégé le système bancaire et de crédit par le biais de la Banque de l'Indochine, qui fonctionnait à la fois comme banque centrale émettrice et comme banque commerciale multifonctionnelle avec des opérations bancaires commerciales et d'investissement. Après la Révolution d'Août, l'une des tâches clés du gouvernement révolutionnaire était de construire un système monétaire et bancaire indépendant et autonome pour servir la cause nationale de reconstruction et de défense nationales. Cette tâche a été progressivement réalisée au début des années 1950, lorsque la résistance anti-française a connu de forts progrès avec des victoires significatives sur les champs de bataille et dans une zone libérée en constante expansion. Dans ce contexte, le développement exigeait d'améliorer et de promouvoir les opérations économiques et financières pour répondre aux nouvelles exigences. Sur la base de la nouvelle politique économique et monétaire définie lors du 2e Congrès du Parti des travailleurs du Vietnam, le 6 mai 1951, le président Hô Chi Minh a signé le Sac lenh n°15/SL sur la création de la Banque nationale du Vietnam avec pour tâches clés notamment la gestion de l'émission des billets de banque et l'organisation d'un système de circulation monétaire ; gérer la trésorerie de l'État ; mener des politiques de crédit pour promouvoir la production économique et coordonner avec les autorités commerciales la gestion monétaire et s'engager dans la guerre monétaire contre l'ennemi. La création de la Banque nationale du Vietnam constitue une étape historique, le résultat progressif du processus de lutte pour développer un système monétaire et de crédit indépendant et autonome, marquant une nouvelle étape de développement, modifiant la qualité de la zone monétaire et de crédit nationale."
VIN_Econ.8.a: "Fini les Piastre et place aux Dong !"

VIN_Econ.9.t: "Premier pas vers le socialisme"
VIN_Econ.9.d: "Alors que les armes se sont finalement tues dans le Nord suite aux Accords de Genève, la République démocratique du Vietnam est désormais confrontée à une tâche historique. La révolution doit dépasser la résistance et commencer à construire une nouvelle société socialiste. Comme l'a déclaré le président Hô Chi Minh, le Nord doit devenir le fondement politique, économique et culturel de l'éventuelle réunification de la nation vietnamienne.\n\nLe gouvernement a dévoilé un programme visant à restaurer les routes, les voies ferrées et les usines dévastées par des années de guerre, tout en encourageant la production agricole dans les zones où la réforme agraire est achevée. De nouveaux ouvrages d'irrigation, des entreprises d'État et des coopératives agricoles jetteront progressivement les bases d'une économie socialiste planifiée. Dans le même temps, Hanoï a réaffirmé son engagement à maintenir des relations pacifiques entre le Nord et le Sud conformément aux Accords de Genève, tout en soutenant les aspirations démocratiques des compatriotes vivant sous l'administration du Sud.\n\nLe chemin à parcourir sera long et difficile. Le socialisme ne peut pas être construit du jour au lendemain, et une nation brisée par des décennies de colonialisme et de guerre ne peut pas non plus être transformée en une seule génération."
VIN_Econ.9.a: "Bâtissons les fondations d'un Vietnam socialiste."

VIN_Econ.10.t: "Le port de Hai Phong rouvre"
VIN_Econ.10.d: "Après des années de guerre et de perturbations, le port de Hai Phong a repris ses activités sous l'administration de la République démocratique du Vietnam. En tant que principale porte d'entrée du pays vers la mer, la réouverture du port historique marque une étape importante dans la reconstruction économique du Nord.\n\nConstruit à l'origine par les Français en 1874 comme port commercial et militaire colonial, Hai Phong est devenu l'un des ports les plus fréquentés d'Indochine, reliant le Vietnam aux marchés internationaux et au réseau ferroviaire s'étendant vers le Yunnan. Désormais, pour la première fois, ses quais, entrepôts et grues serviront les intérêts d'un État vietnamien indépendant plutôt que ceux d'un empire colonial.\n\nLe gouvernement a officiellement placé le port sous l'administration du secteur national du transport par eau, tandis que les ingénieurs et les dockers travaillent à réparer les quais endommagés, à restaurer les installations de manutention des marchandises et à augmenter la capacité de transport. Le nouveau flux de machines, d'équipements industriels, d'engrais et de biens de consommation via Hai Phong constituera une bouée de sauvetage vitale pour l'économie socialiste en pleine croissance du Nord.\n\nPlus qu'un port de commerce, Hai Phong est le pont de la République vers le monde extérieur. Depuis ses quais, les nations amies peuvent apporter leur aide, tandis que les produits vietnamiens peuvent à nouveau atteindre les marchés étrangers."
VIN_Econ.10.a: "La porte d'entrée du pays vers la mer s'est à nouveau ouverte."

VIN_Econ.11.t: "Agrandissement de la centrale électrique de Bo Ho"
VIN_Econ.11.d: "La libération de Hanoï a restitué à la population l'un des atouts industriels les plus précieux de la nation : la centrale électrique de Bo Ho. Autrefois construite par l'administration coloniale française pour éclairer ses propres districts et entreprises, la centrale fournira désormais de l'électricité à un Vietnam indépendant et servira de pierre angulaire de notre programme national d'électrification.\n\nLe gouvernement a approuvé des plans visant à moderniser et à agrandir les installations vieillissantes en réparant les machines usées, en installant des équipements de production supplémentaires, en modernisant les lignes de transport et en augmentant la distribution d'électricité dans tout Hanoï et les provinces environnantes. Ces améliorations fourniront l'électricité nécessaire aux usines, aux ateliers, aux écoles, aux hôpitaux et au nombre croissant d'entreprises d'État qui constituent l'épine dorsale de la construction socialiste.\n\nConnue comme le berceau de l'industrie électrique vietnamienne car elle fut la première centrale électrique d'Indochine, la centrale électrique de Bo Ho symbolise la transformation des infrastructures coloniales en un bien national. Là où il servait autrefois des intérêts étrangers, il alimentera désormais les foyers et les lieux de travail du peuple vietnamien, soutenant la reprise industrielle et améliorant la vie quotidienne dans la capitale."
VIN_Econ.11.a: "Pour éclairer les révolutionnaires non éclairés."

VIN_Econ.12.t: "Création de la Compagnie ferroviaire vietnamienne"
VIN_Econ.12.d: "Pendant des décennies, les chemins de fer vietnamiens ont servi d'artères sidérurgiques du régime colonial, transportant des troupes, des matières premières et des marchandises à travers le pays. Aujourd'hui, sous la direction de la République démocratique du Vietnam, ces mêmes chemins de fer seront transformés en instruments de reconstruction nationale et de développement socialiste.\n\nLe gouvernement a officiellement créé le Département général des chemins de fer vietnamiens, plaçant ainsi le réseau ferroviaire du pays sous une administration d'État unifiée. Chargée de restaurer les voies endommagées par la guerre, de réparer les locomotives, de reconstruire les ponts et d'augmenter la capacité de transport, la nouvelle administration jouera un rôle central dans la relance de l'économie du Nord et dans la connexion des centres industriels, des régions agricoles et des ports.\n\nLe système ferroviaire vietnamien tire ses origines du premier chemin de fer entre Saigon et My Tho en 1881, tandis que l'achèvement du chemin de fer Nord-Sud en 1936 reliait pour la première fois le pays sur toute la longueur. Durant la lutte pour l'indépendance, les cheminots ont fait preuve d'un patriotisme inébranlable, en entretenant des lignes de transport vitales dans les conditions les plus difficiles. Le 2 octobre 1946, le président Hô Chi Minh voyageait personnellement en train de Hai Phong à Hanoï, saluant le dévouement et le sacrifice des cheminots vietnamiens - une date qui est depuis devenue la journée traditionnelle de l'industrie ferroviaire."
VIN_Econ.12.a: "Connecter tous les révolutionnaires de tout le Vietnam."

VIN_Econ.13.t: "Le Parti met l'accent sur le développement de l'agriculture et de l'industrie légère"
VIN_Econ.13.d: "Les 14e (novembre 1958) et 16e (avril 1959) plénums du Comité central ont décidé d'accélérer la transformation socialiste du Nord-Vietnam à travers un plan triennal. Le Parti a souligné que la priorité immédiate n'est pas une industrialisation lourde et rapide, mais le développement de l'agriculture, de l'artisanat, de l'industrie légère et des entreprises publiques pour améliorer le niveau de vie de la population.\n\nLe gouvernement développera les coopératives agricoles, renforcera les projets d'irrigation et transformera progressivement l'artisanat et le commerce privé selon des principes socialistes. Dans le même temps, des investissements plus importants seront dirigés vers les industries légères produisant des textiles, des biens de consommation, des produits alimentaires, des médicaments et du matériel agricole.\n\nPour soutenir ce programme, le gouvernement a réorganisé plusieurs ministères, notamment en divisant le ministère des Transports et des Travaux publics en ministère des Transports et des Postes et en ministère des Ressources en eau et de l'Architecture, améliorant ainsi l'administration des transports, de l'irrigation et du développement national."
VIN_Econ.13.a: "Renforcez l'agriculture, développez l'industrie légère et construisez une économie socialiste autonome."

VIN_Econ.14.t: "Mouvement Tang gia San Xuat : la lutte du peuple pour l'autosuffisance"
VIN_Econ.14.d: "Sous la direction du président Hô Chi Minh, le Front Lien Viet, le ministère de Canh Nong et le commandement général de l'Armée nationale et de la milice du Vietnam ont fièrement déclaré le succès national du mouvement Tang Gia San Xuat (Production accrue). Lancé comme une réponse urgente aux difficultés économiques et aux conditions de guerre, ce mouvement est devenu un pilier de l'effort révolutionnaire, garantissant que l'armée et le peuple disposent des ressources nécessaires pour soutenir la résistance contre l'oppression coloniale. \nAvec le cri de ralliement « Tac dat tac vang » (Chaque centimètre de terre est de l'or) et « Khong mot tac dat bo hoang » (Pas un seul centimètre de terre inculte), le mouvement a mobilisé ouvriers, paysans et soldats. Les villageois ont agrandi leurs terres agricoles, mis en place des initiatives agricoles coopératives et maximisé la production alimentaire, tandis que l'armée elle-même a participé activement à l'agriculture et à l'élevage pour sécuriser ses chaînes d'approvisionnement. \nLe Front Lien Viet salue le mouvement comme une preuve de la volonté révolutionnaire du peuple, démontrant que la véritable indépendance ne vient pas seulement des victoires sur les champs de bataille mais aussi de l'autosuffisance économique. Le ministère de Canh Nong a signalé une reprise significative de la production agricole, renforçant les moyens de subsistance des paysans et renforçant l'économie de guerre. Parallèlement, le commandement général de l'armée nationale et de la milice a intégré le travail agricole dans sa stratégie militaire, garantissant que les troupes restent bien nourries et prêtes à une résistance prolongée. \nCette réalisation renforce la résilience de la République démocratique du Vietnam. Tant que le peuple travaillera ensemble dans l'unité et la discipline, aucun ennemi ne pourra affamer la révolution et la soumettre. Le mouvement se poursuit et le gouvernement révolutionnaire appelle chaque citoyen à persévérer dans ses efforts."
VIN_Econ.14.a: "Chaque grain récolté est un pas de plus vers la victoire finale."

VIN_Econ.15.t: "Les collines de thé de Thai Nguyen refleurissent"
VIN_Econ.15.d: "Après des années de guerre et de perturbations, les célèbres plantations de thé de Thai Nguyen ont repris leur production sous la direction de la République démocratique du Vietnam. Longtemps réputée pour produire certains des meilleurs thés du pays depuis la fin du XIXe siècle, la province se prépare une fois de plus à approvisionner à la fois le marché intérieur et les pays amis à l'étranger.\n\nLe gouvernement a ordonné la restauration des plantations abandonnées, l'expansion des coopératives de thé et l'introduction de variétés de thé améliorées pour accroître à la fois la productivité et la qualité. S'appuyant sur les fondations posées avant la révolution, de nouvelles techniques de culture et de transformation seront adoptées tout en préservant le savoir-faire traditionnel qui a rendu le thé Thai Nguyen célèbre dans tout le Vietnam.\n\nLa relance de l'industrie du thé représente bien plus qu'une simple reprise économique. Le thé est depuis longtemps un symbole de la culture et des moyens de subsistance de la population de Thai Nguyen, fournissant de l'emploi à des milliers de familles rurales et contribuant à de précieuses recettes d'exportation à l'économie nationale."
VIN_Econ.15.a: "Oncle Ho sera fier de nous."

VIN_Econ.16.t: "Interdire les coutumes arriérées et réactionnaires"
VIN_Econ.16.d: "Alors que le Nord-Vietnam avance sur la voie de la construction socialiste, le Parti a réaffirmé le principe du président Hô Chi Minh : « Liberté de croyance et unité entre les religions ». Tout citoyen continuera à jouir du droit de pratiquer sa foi et toutes les religions qui respectent la loi et contribuent à l'unité nationale resteront protégées par l'État.\n\nDans le même temps, le gouvernement a lancé une campagne nationale contre les pratiques réactionnaires et rétrogrades qui entravent la production, la santé publique, l'éducation et le progrès social. Les activités superstitieuses telles que la médiumnité spirituelle, la divination, les cérémonies rituelles extravagantes, le jeu excessif et les enterrements et mariages inutiles seront découragées, tandis que les fonctionnaires auront pour instruction d'éduquer et de persuader les gens plutôt que de recourir à la coercition.\n\nLe Parti appelle les cadres à respecter les coutumes et les croyances du peuple tout en promouvant un nouveau mode de vie socialiste basé sur l'épargne, la science, le travail et la solidarité mutuelle. Comme nous l'a souvent rappelé le président Hô Chi Minh, la force de la nation ne réside pas dans la superstition mais dans les efforts du peuple lui-même."
VIN_Econ.16.a: "Respectez la foi, rejetez la superstition et construisez une nouvelle vie socialiste."

VIN_Econ.17.t: "Début des réformes agraires ?"
VIN_Econ.17.d: "Avec la création des coopératives et la réparation des ouvrages d'irrigation, le Parti s'est tourné vers les vastes domaines laissés par l'ordre colonial. Le ministère de Canh Nong a commencé à réorganiser les anciennes plantations françaises et les terres des propriétaires absents, en les plaçant sous fermes d'État et en gestion coopérative afin que ceux qui labourent la terre puissent conserver la récolte.\n\nLa réorganisation n'a pas été sans douleur. Les anciens gestionnaires immobiliers résistent, les locataires se disputent à propos des limites et des dettes anciennes, et certains cadres locaux ont insisté trop fort et trop vite. Le gouvernement a demandé aux fonctionnaires de procéder avec discipline et persuasion, mais les campagnes sont instables et les intérêts commerciaux français protestent contre la perte de leurs propriétés.\n\nSi elle est menée à bien, la réforme permettra de mettre en production de nouvelles terres agricoles et d'ouvrir davantage de possibilités à l'industrie rurale et aux entreprises de transformation."
VIN_Econ.17.a: "La terre appartient à ceux qui la cultivent."

VIN_Econ.18.t: "Le Parti met l'accent sur l'industrialisation et la modernisation de la nation"
VIN_Econ.18.d: "Même si l'agriculture reste vitale pour nourrir la nation, le Comité central a conclu que le Vietnam ne peut pas compter uniquement sur les campagnes. Si la République démocratique veut se placer sur un pied d'égalité parmi les nations industrialisées et se préparer à l'éventuelle réunification de la Patrie, elle doit s'engager dans une politique d'industrialisation rapide et de modernisation nationale.\n\nLe Parti a donc adopté une nouvelle stratégie économique qui donne la priorité à l'expansion de l'industrie lourde, de la construction mécanique, de la production d'acier, de la production d'électricité, des produits chimiques et des transports modernes. Les usines, les zones industrielles, les instituts techniques et les centrales électriques deviendront les moteurs de la construction socialiste, créant ainsi la base matérielle d'un Vietnam fort et autonome.\n\nPour mettre en oeuvre ce programme ambitieux, le gouvernement a réorganisé l'administration de l'État. L'ancien ministère des Transports et des Travaux publics a été élargi pour devenir le ministère des Travaux publics et des Travaux naturels, lui conférant une autorité plus large en matière de transports, d'irrigation, de construction nationale et de développement des ressources naturelles. Dans le même temps, l'Assemblée nationale a approuvé la création d'un nouveau ministère de la Modernisation et de l'Industrialisation, chargé de coordonner la planification industrielle, le développement technologique, la recherche scientifique et la mécanisation de l'économie nationale.\n\nLe Parti estime que ce n'est qu'en adoptant la science, la technologie et l'industrie moderne que le Vietnam pourra surmonter des siècles de pauvreté et de sous-développement colonial."
VIN_Econ.18.a: "Le socialisme surgit !"

VIN_Econ.19.t: "Agrandissement de la cimenterie de Hai Phong"
VIN_Econ.19.d: "Alors que la reconstruction s'accélère dans le Nord-Vietnam, le Parti a approuvé une expansion majeure de la cimenterie de Hai Phong, transformant la plus ancienne cimenterie du pays en la pierre angulaire de notre programme d'industrialisation.\n\nFondée en 1899 comme première cimenterie du Vietnam et de toute l'Indochine, l'usine a été construite pour répondre aux besoins de l'économie coloniale française. Mais au fil des décennies, elle est devenue le berceau du mouvement syndical vietnamien. L'usine a vu la création de l'une des premières organisations de jeunesse révolutionnaire du pays, le Syndicat rouge, et l'une des premières cellules du Parti communiste indochinois en 1929. La grève ouvrière victorieuse du 8 janvier 1930 est devenue un symbole de la force de la classe ouvrière vietnamienne, tandis qu'en 1955, après la libération de Hai Phong, l'usine passa finalement entre les mains des ouvriers d'un Vietnam indépendant.\n\nAujourd'hui, le gouvernement a ordonné la construction de nouveaux fours rotatifs, d'installations de broyage modernes et l'expansion des opérations de carrière afin d'augmenter considérablement la production de ciment. La production supplémentaire soutiendra la construction d'usines, de barrages hydroélectriques, de voies ferrées, de ponts, d'écoles et de logements pour les travailleurs, alors que le Nord-Vietnam s'embarque dans une nouvelle ère d'industrialisation rapide."
VIN_Econ.19.a: "Le bâtisseur d'un avenir socialiste industrialisé."

VIN_Econ.20.t: "Recherche sur les ordinateurs et l'électronique"
VIN_Econ.20.d: "Les progrès rapides de l'informatique électronique à l'étranger ont démontré qu'une nouvelle ère technologique est en train d'émerger. Aux États-Unis, le SEAC (Standards Eastern Automatic Computer) récemment dévoilé est devenu le premier ordinateur à programme stocké entièrement opérationnel du pays, démontrant l'immense potentiel du calcul électronique et du stockage d'informations. Pendant ce temps, malgré les critiques idéologiques à l'égard de la cybernétique, des scientifiques soviétiques ont réussi à assembler le puissant ordinateur BESM-1 à Moscou, prouvant que l'Est et l'Ouest reconnaissent l'importance stratégique de la technologie informatique.\n\nReconnaissant son importance stratégique, le gouvernement a demandé au ministère de la Modernisation et de l'Industrialisation nouvellement créé de lancer des recherches sur les composants informatiques, électroniques et semi-conducteurs. \n\nBien que notre base industrielle reste modeste, le Parti estime que le Vietnam ne peut pas se permettre de rester à la traîne dans cette révolution scientifique. Le gouvernement a donc approuvé la création d'un petit programme de recherche pour étudier l'électronique, les télécommunications, l'automatisation et les machines informatiques. Ces technologies devraient améliorer la planification économique, la gestion industrielle, la logistique militaire et la recherche scientifique, jetant ainsi les bases de la modernisation de la nation."
VIN_Econ.20.a: "La machine peut calculer, mais ce sont les gens qui déterminent son objectif."

VIN_Econ.21.t: "L'usine textile de Nam Dinh reprend ses activités"
VIN_Econ.21.d: "Autrefois le plus grand complexe textile de toute l'Indochine, l'usine textile de Nam Dinh a repris ses activités à grande échelle sous l'administration de la République démocratique du Vietnam. Fondé à l'époque coloniale française et longtemps considéré comme le coeur industriel du nord du Vietnam, le vaste complexe a aujourd'hui été restauré pour servir un nouvel objectif : la construction d'une économie socialiste.\n\nAprès la libération du Nord en 1954, l'usine passe de la propriété française à l'État vietnamien. Des ingénieurs, des techniciens et des milliers d'ouvriers ont travaillé sans relâche pour réparer les machines endommagées par des années de guerre et de négligence, remettant en production les filatures, les ateliers de tissage, les teintureries et les ateliers mécaniques.\n\nLa réouverture de l'usine marque bien plus qu'une réussite industrielle. Pendant des décennies, les ouvriers du textile de Nam Dinh ont été à l'avant-garde du mouvement syndical vietnamien, contribuant à nourrir la conscience révolutionnaire sous le régime colonial. Aujourd'hui, leur usine constitue à nouveau un symbole de la force de la classe ouvrière et de la détermination de la nation à atteindre l'autonomie économique."
VIN_Econ.21.a: "Le métier à tisser tourne à nouveau."

VIN_Econ.22.t: "Agrandissement des aéroports de Bach Mai et de Phu Bai"
VIN_Econ.22.d: "La reconstruction rapide du Nord a mis en lumière une faiblesse critique de nos infrastructures de transport. Même si nos aérodromes militaires ont fidèlement servi la nation, la République démocratique du Vietnam ne dispose toujours pas d'un aéroport international civil moderne, capable de répondre aux demandes croissantes de la diplomatie, du commerce et de l'aviation civile. À mesure que nos liens avec nos compatriotes socialistes se développent et que les délégations étrangères arrivent en nombre croissant, le besoin d'installations d'aviation civile dédiées devient de plus en plus évident.\n\nPour remédier à cette lacune, le gouvernement a approuvé l'agrandissement et la modernisation des aérodromes de Bach Mai et de Gia Lam. Construits à l'époque coloniale, ces aérodromes ne seront plus de simples vestiges de l'occupation militaire française mais seront transformés en portes d'entrée vitales pour un nouveau Vietnam. De nouveaux terminaux passagers, des pistes agrandies, des installations de contrôle du trafic aérien, des hangars de maintenance et des infrastructures de manutention du fret seront construits pour accueillir l'aviation civile nationale et internationale tout en conservant la capacité de soutenir la défense nationale en cas de besoin.\n\nLe projet représente plus qu'un investissement dans le transport. Il symbolise la transformation des infrastructures coloniales en instruments de développement socialiste, reliant la capitale aux nations amies d'Asie et du monde socialiste au sens large."
VIN_Econ.22.a: "Nous dominons le ciel."

VIN_Econ.23.t: "Le Vietnam rejoint le COMECON"
VIN_Econ.23.d: "La République démocratique du Vietnam a été officiellement admise au Conseil d'assistance économique mutuelle (COMECON), marquant une étape importante dans le développement économique du pays et son intégration dans la communauté socialiste. À la suite de consultations approfondies avec nos alliés frères, le Vietnam participera désormais à la planification coordonnée et à la coopération économique qui sont devenues la pierre angulaire de la prospérité socialiste.\n\nL'adhésion donne à notre république l'accès à des opportunités commerciales élargies, à des équipements industriels, à une expertise technologique et à une aide au développement à long terme de la part des autres États socialistes. En retour, le Vietnam apportera ses produits agricoles, ses ressources naturelles et sa capacité industrielle croissante au progrès collectif du monde socialiste, renforçant ainsi le principe selon lequel chaque nation se développe selon ses forces tout en bénéficiant des réalisations de tous.\n\nPour un pays qui se remet encore des ravages du régime colonial et des années de conflit, l'adhésion au COMECON offre une voie vers une industrialisation accélérée et une plus grande autonomie économique."
VIN_Econ.23.a: "Un avenir, un socialisme"

VIN_Econ.24.t: "Ouverture au marché occidental"
VIN_Econ.24.d: "La reconstruction du Nord a donné lieu à des progrès remarquables dans les domaines de l'agriculture, de l'industrie et de la fabrication. De nouvelles usines ont repris leur production, les entreprises d'État continuent de se développer et les industries traditionnelles ont été revitalisées. Pourtant, avec une production en constante augmentation, un nouveau défi est apparu : assurer des marchés suffisants pour les produits vietnamiens au-delà du bloc socialiste.\n\nL'éminent économiste Bui Cong Trung a publiquement plaidé en faveur d'une politique économique plus tournée vers l'extérieur, arguant que la production socialiste ne devrait pas rester confinée à la consommation intérieure ou aux seuls partenaires commerciaux existants. Il a appelé à ce que les produits vietnamiens - depuis les textiles, les machines, les aliments transformés, les produits chimiques, le ciment et les matériaux industriels jusqu'aux produits agricoles et aux biens de consommation - soient compétitifs sur le marché international. En développant ses exportations vers l'Europe occidentale et d'autres économies non socialistes, le Vietnam pourrait gagner de précieuses devises étrangères, acquérir des technologies de pointe et créer de nouvelles opportunités pour une croissance industrielle continue.\n\nAprès mûre réflexion, le gouvernement a autorisé le ministère du Commerce extérieur à entretenir des relations commerciales limitées avec les marchés occidentaux."
VIN_Econ.24.a: "Nous ferons du commerce avec tous les pays, amis ou ennemis."

VIN_Econ.25.t: "Création de la marque automobile Chien Thang"
VIN_Econ.25.d: "L'industrialisation de la République démocratique du Vietnam a franchi une nouvelle étape historique avec le dévoilement de l'automobile Chien Thang - la première voiture de tourisme conçue et assemblée par des ingénieurs et des ouvriers vietnamiens. Développé à l'usine Chien Thang à Hanoï, le projet représente une étape audacieuse vers la création d'une industrie automobile locale capable de répondre aux besoins croissants de transport du pays.\n\nS'inspirant de la Frégate française tout en mettant l'accent sur l'utilisation maximale de composants fabriqués dans le pays, les ingénieurs vietnamiens ont fait preuve d'une ingéniosité remarquable pour surmonter les limites technologiques d'une jeune économie industrielle. Les blocs moteurs, culasses, carburateurs, pompes à carburant, pompes à huile et de nombreux composants mécaniques ont été coulés, usinés et assemblés par des artisans locaux. Bien que plusieurs pièces spécialisées dépendent encore de matériaux importés, le projet a prouvé que le Vietnam possède à la fois le talent et la détermination nécessaires pour produire ses propres automobiles modernes.\n\nL'achèvement réussi du Chien Thang a été salué comme un triomphe de l'industrie socialiste et de l'autonomie. Lors de la présentation du véhicule, le président Hô Chi Minh a salué cette réussite, encourageant les ingénieurs à poursuivre leurs recherches pour produire des camions et des véhicules utilitaires qui serviraient mieux l'économie et la reconstruction du pays."
VIN_Econ.25.a: "La voiture du peuple"

VIN_Econ.26.t: "Le succès de notre marque automobile Chien Thang"
VIN_Econ.26.d: "Ce qui a commencé comme une expérience ambitieuse d'ingénierie nationale est devenu l'une des réalisations les plus fières de l'industrie vietnamienne. Depuis l'introduction de la première automobile Chien Thang, des investissements continus dans la recherche, la fabrication et la formation technique ont transformé la marque d'un simple prototype en la base d'une industrie automobile nationale en pleine croissance.\n\nLes usines de Chien Thang ont progressivement augmenté leur production, introduisant des voitures particulières améliorées, des véhicules utilitaires légers et des modèles utilitaires conçus pour répondre aux besoins des agences gouvernementales, des entreprises d'État, des coopératives et des citoyens privés. Les progrès dans la métallurgie, la fabrication de moteurs et l'usinage de précision ont considérablement augmenté la proportion de composants produits dans le pays, réduisant ainsi la dépendance à l'égard des pièces importées tout en améliorant la fiabilité et en réduisant les coûts de production.\n\nLe succès de la marque Chien Thang a également favorisé le développement d'un écosystème industriel plus large. Les aciéries, les usines de machines-outils, les producteurs de caoutchouc, les fabricants de verre et les usines chimiques fournissent désormais des composants pour la production automobile, créant ainsi des milliers d'emplois qualifiés et accélérant la modernisation de l'industrie lourde du pays. Les ingénieurs vietnamiens, autrefois limités à reproduire des modèles étrangers, développent désormais des véhicules adaptés aux besoins routiers, climatiques et économiques du pays."
VIN_Econ.26.a: "Des millions de personnes doivent conduire la marque de voiture Chien Thang"

VIN_Nhan_Van_Giai_Pham.1.t: "Le mouvement Nhan Van - Giai Pham émerge"
VIN_Nhan_Van_Giai_Pham.1.d: "Un débat animé a commencé à se dérouler dans les cercles littéraires et intellectuels de la République démocratique du Vietnam. Inspirés par les développements récents dans le monde socialiste - y compris les critiques de l'Union soviétique à l'égard du culte de la personnalité après le 20e Congrès du PCUS et la politique chinoise « Que cent fleurs fleurissent, que cent écoles de pensée s'affrontent » - de nombreux écrivains, poètes, artistes et universitaires vietnamiens ont commencé à appeler à un plus grand débat sur le rôle de la culture dans la société socialiste.\n\nParmi les premiers à exprimer ces préoccupations furent un certain nombre d'écrivains et d'artistes militaires, qui soumirent des propositions prônant une plus grande autonomie artistique, la création d'associations littéraires professionnelles et une réduction du contrôle militaire des activités culturelles. Leurs appels ont été suivis de discussions plus larges entre intellectuels et membres de l'Association vietnamienne de littérature et d'art, où les participants ont débattu ouvertement des questions de liberté artistique, de critique et de relation entre l'expression créative et la direction du Parti.\n\nCes discussions ont rapidement abouti à ce qui est désormais connu sous le nom de mouvement Nhan Van - Giai Pham, du nom des revues qui ont fourni un forum pour les essais, la poésie et les commentaires sur la culture et la société. Alors que de nombreux contributeurs affirment leur engagement envers le socialisme et la révolution, ils soutiennent qu'une culture socialiste dynamique doit également encourager une critique honnête, une enquête intellectuelle et une innovation créative."
VIN_Nhan_Van_Giai_Pham.1.a: "Quelqu'un appelle le Cong An..."

VIN_Nhan_Van_Giai_Pham.2.t: "L'ombre de la campagne anti-droite"
VIN_Nhan_Van_Giai_Pham.2.d: "Les événements au-delà de notre frontière nord ont commencé à jeter une ombre sur les débats culturels du Vietnam. Suite à la conclusion de la Campagne des Cent Fleurs, le Parti communiste chinois a lancé une vaste campagne anti-droitiste, dénonçant de nombreux écrivains, intellectuels et responsables accusés de promouvoir le libéralisme bourgeois, de s'opposer à la direction du Parti ou de prôner les idées capitalistes. Ce qui avait commencé comme une invitation à la critique s'est rapidement transformé en un effort déterminé pour sauvegarder l'unité socialiste et la discipline idéologique.\n\nLes développements en Chine ont attiré l'attention des dirigeants de Hanoï. Au sein du Parti, certains responsables ont commencé à comparer le mouvement grandissant Nhan Van - Giai Pham aux courants intellectuels apparus pendant la période des Cent Fleurs en Chine. Une surveillance particulière s'est portée sur le poète Tran Dan, dont les écrits et les idées réformistes ont été influencés en partie par l'intellectuel chinois Hu Feng, lui-même condamné par Pékin comme chef d'une clique littéraire anti-Parti. Les parallèles intellectuels étroits entre les deux mouvements ont alimenté la crainte croissante que des déviations idéologiques similaires puissent s'enraciner au Vietnam.\n\nParmi les cadres du Parti, un sentiment de plus en plus commun est apparu : « La Chine avait son Hu Feng ; peut-être avons-nous aussi notre propre Hu Feng ». Pour ceux qui sont responsables de la sauvegarde de la révolution, la comparaison sert d'avertissement : la critique littéraire, si elle n'est pas maîtrisée, pourrait devenir un véhicule d'opposition politique déguisée en expression artistique.\n\nPour les partisans de Nhan Van - Giai Pham, les événements en Chine sont cependant profondément troublants. Beaucoup espéraient que le changement climatique dans le monde socialiste encouragerait une plus grande ouverture et une critique constructive. Au contraire, la campagne anti-droite a démontré avec quelle rapidité le débat intellectuel peut céder la place à la répression politique, plaçant les écrivains et artistes vietnamiens dans une suspicion croissante."
VIN_Nhan_Van_Giai_Pham.2.a: "Pas bon..."

VIN_Nhan_Van_Giai_Pham.3.t: "Nghi Quyet So 30/Van Nghe"
VIN_Nhan_Van_Giai_Pham.3.d: "Les activités continues du cercle Nhan Van - Giai Pham ont incité le Politburo à publier la résolution n° 30/VN sur la littérature et les arts, déclarant que la controverse n'est plus un simple désaccord sur la politique artistique, mais un défi politique sérieux à la révolution socialiste. La résolution avertit que des éléments hostiles ont exploité la littérature et la culture comme véhicules pour propager des idées révisionnistes, affaiblir la discipline révolutionnaire et saper la direction du Parti.\n\nSelon la résolution, des individus associés au mouvement ont utilisé des slogans tels que « opposition au dogmatisme » et « indépendance artistique » pour dissimuler des attaques contre le réalisme socialiste et le rôle révolutionnaire de la littérature. Les dirigeants du parti soutiennent que ces revendications ne visent pas à renforcer le socialisme par la critique, mais à détacher la culture de la politique et à orienter la littérature vietnamienne vers l'individualisme bourgeois et les influences idéologiques étrangères.\n\nLa campagne a été menée par To Huu, membre du Comité central du Parti et responsable de la culture et de la propagande. Dans une série de discours et de publications, il a dénoncé le groupe Nhan Van - Giai Pham comme une coalition d'intellectuels réactionnaires, de révisionnistes, d'anciens collaborateurs et d'éléments antisocialistes qui cherchent à corrompre la vie culturelle du pays. Il soutient que leurs appels à une liberté artistique sans restriction cachent un objectif politique plus large : l'érosion de la direction du Parti et la restauration des valeurs capitalistes et bourgeoises.\n\nLa résolution réaffirme en outre plusieurs principes fondamentaux de la culture socialiste. La littérature et les arts doivent être au service des ouvriers, des paysans et des soldats ; ils doivent faire avancer la cause révolutionnaire sous la direction du Parti ; et ils doivent rejeter le nationalisme bourgeois, l'individualisme et le révisionnisme en faveur de l'internationalisme prolétarien et de la construction socialiste."
VIN_Nhan_Van_Giai_Pham.3.a: "Mort à tous les chiens réactionnaires !"

VIN_Nhan_Van_Giai_Pham.4.t: "Mouvement littéraire en temps de guerre"
VIN_Nhan_Van_Giai_Pham.4.d: "Face aux drames en cours du mouvement Nhan Van - Giai Pham, la République démocratique du Vietnam a lancé une nouvelle initiative culturelle pour réaffirmer le but révolutionnaire de la littérature et des arts. Sous la direction du vice-ministre de la Propagande To Huu, les écrivains, poètes, musiciens et artistes sont appelés à rejeter l'individualisme bourgeois et la pensée révisionniste, et à consacrer leurs talents au service du socialisme, de la défense nationale et du peuple.\n\nLe nouveau mouvement littéraire de guerre s'oppose directement aux idéaux promus par Nhan Van - Giai Pham. Là où ce dernier mettait l'accent sur l'autonomie artistique et l'indépendance de la littérature par rapport aux dirigeants politiques, le nouveau mouvement proclame que la littérature doit servir la révolution, le Parti et les masses laborieuses. La plume n'est plus considérée comme l'instrument de l'écrivain individuel, mais comme une arme sur le front culturel dans la lutte contre l'impérialisme, le révisionnisme et les influences contre-révolutionnaires.\n\nDe cette vision est née une nouvelle génération de « poètes-soldats ». Les écrivains ne se distinguent plus du peuple ; ils marchent aux côtés des ouvriers dans les usines, des paysans dans les champs et des soldats sur les lignes de front. Beaucoup ont pris à la fois la plume et le fusil, documentant les difficultés, les sacrifices et les victoires du peuple vietnamien tout en participant directement à la lutte révolutionnaire du pays. L'image de l'intellectuel détaché de la société a cédé la place à celle du cadre culturel révolutionnaire.\n\nDes poètes chevronnés tels que To Huu, Xuan Dieu, Huy Can, Che Lan Vien et Te Hanh sont devenus les principales voix du mouvement."
VIN_Nhan_Van_Giai_Pham.4.a: "Un seul stylo peut vaincre de nombreuses pensées réactionnaires."

VIN_Nhan_Van_Giai_Pham.5.t: "Mouvement Artistique Des Cent Fleurs Fleurissent"
VIN_Nhan_Van_Giai_Pham.5.d: "Le changement du climat politique au sein du monde socialiste a commencé à influencer la vie intellectuelle du Vietnam. En République populaire de Chine, la campagne des Cent fleurs du président Mao Zedong a appelé les écrivains, les artistes, les scientifiques et les intellectuels à « laisser fleurir cent fleurs et cent écoles de pensée s'affronter », encourageant la critique de la bureaucratie et le débat sur l'avenir de la société socialiste. Pour de nombreux intellectuels vietnamiens, la campagne semble démontrer que le socialisme possède la confiance nécessaire pour tolérer le débat, l'autocritique et l'expérimentation créative.\n\nParmi ceux qui se sont le plus inspirés de ces développements se trouve le poète Tran Dan. Ayant suivi de près les débats qui se déroulent en Chine - y compris la controverse antérieure autour de l'écrivain Hu Feng - Tran Dan et un cercle d'écrivains estiment que le socialisme vietnamien devrait également favoriser un environnement culturel plus ouvert. En 1955, ils créèrent la revue Nhan Van, suivie par Giai Pham, offrant un forum où la littérature, la philosophie et les questions sociales pouvaient être discutées avec plus de franchise qu'auparavant.\n\nL'influence de la Campagne des Cent Fleurs s'est rapidement répandue dans la communauté littéraire vietnamienne. Écrivains, poètes, artistes et universitaires ont commencé à réclamer une plus grande liberté artistique, une critique constructive de la bureaucratie et une réévaluation de la relation entre culture et leadership politique. Beaucoup ont insisté sur le fait que ces propositions ne remettaient pas en question le socialisme lui-même, mais cherchaient à le renforcer par l'autocritique marxiste et la participation active des intellectuels du pays à la construction socialiste.\n\nAu sein du Parti, les réactions sont toutefois partagées. Les cadres réformateurs soutiennent que l'exemple chinois démontre l'intérêt de permettre à la critique de corriger les lacunes bureaucratiques et d'améliorer la gouvernance."
VIN_Nhan_Van_Giai_Pham.5.a: "Assurez-vous que seules les opinions sûres sont autorisées."

VIN_Nhan_Van_Giai_Pham.6.t: "Décider de notre voie de libéralisation"
VIN_Nhan_Van_Giai_Pham.6.d: "Le triomphe du mouvement Nhan Van - Giai Pham a fondamentalement remodelé le paysage politique de la République démocratique du Vietnam. Les appels à une plus grande liberté intellectuelle, à une réforme juridique et à une société socialiste plus ouverte ont été largement acceptés au sein du Parti et de l'intelligentsia nationale. Mais cette victoire soulève une question encore plus importante : jusqu'où doivent aller les réformes vietnamiennes ?\n\nLa situation internationale est à la fois source d'inspiration et d'avertissement. Dans toute l'Europe de l'Est, les demandes de réforme ont produit des résultats très différents. En Pologne, les réformes politiques négociées ont préservé le socialisme tout en accordant une plus grande flexibilité aux institutions nationales. En Hongrie, toutefois, des troubles généralisés ont dégénéré en conflit armé, en intervention étrangère et en destructions immenses. Ces événements ont convaincu de nombreux dirigeants vietnamiens que la libéralisation doit être prudente si elle ne veut pas menacer la révolution elle-même.\n\nAu sein du Parti, deux visions distinctes ont émergé.\n\nUne faction soutient que le Vietnam devrait suivre un programme de réforme à la hongroise, élargissant la liberté d'expression, décentralisant l'autorité politique, réduisant l'intervention du Parti dans la vie culturelle et introduisant une participation politique plus large. Ils croient que le socialisme ne peut rester fort que s'il gagne la confiance du peuple grâce à l'ouverture et aux réformes.\n\nD'autres mettent en garde contre l'adoption massive d'un modèle étranger. Ils soutiennent que la situation du Vietnam est unique et que la nation devrait plutôt s'appuyer sur l'expérience, la modération et la sagesse révolutionnaire du président Hô Chi Minh. Plutôt que d'imiter les bouleversements observés ailleurs, ils proposent que les réformes soient introduites progressivement sous la direction personnelle de Ho, en équilibrant la liberté intellectuelle avec la stabilité politique et en préservant l'unité forgée pendant la lutte pour l'indépendance."
VIN_Nhan_Van_Giai_Pham.6.a: "Le modèle de Budapest"
VIN_Nhan_Van_Giai_Pham.6.b: "Laissons Oncle Ho décider de la libéralisation"

VIN_Nhan_Van_Giai_Pham.7.t: "Tirer les leçons de la libéralisation du bloc de l'Est"
VIN_Nhan_Van_Giai_Pham.7.d: "Le succès du mouvement Nhan Van - Giai Pham a encouragé de nombreux intellectuels vietnamiens et membres du Parti réformateurs à chercher l'inspiration au-delà des frontières du pays. Partout en Europe de l'Est, les gouvernements socialistes expérimentent de nouvelles approches en matière de gouvernance, de gestion économique et de politique culturelle en réponse au changement de climat politique consécutif au vingtième congrès du Parti communiste de l'Union soviétique.\n\nDe Pologne sont venus des appels à une plus grande autonomie nationale au sein du camp socialiste, à un débat public élargi et à une approche plus pragmatique de la planification économique. Ailleurs, les gouvernements ont assoupli la censure, rétabli des libertés académiques limitées et encouragé les critiques constructives pour améliorer l'efficacité de l'administration socialiste. Même si le rythme et l'ampleur de ces réformes diffèrent d'un pays à l'autre, ils partagent la conviction commune que le socialisme peut être renouvelé par l'ouverture plutôt que par une orthodoxie rigide.\n\nAu Vietnam, les partisans de Nhan Van-Giai Pham affirment que ces développements démontrent la maturité et la confiance du socialisme moderne. Ils soutiennent que la République démocratique devrait également encourager le débat intellectuel, renforcer l'État de droit, élargir le rôle des organisations professionnelles et culturelles et autoriser une critique responsable de la bureaucratie et de l'inefficacité. De telles réformes, insistent-ils, créeraient un socialisme non seulement révolutionnaire mais également adapté aux besoins et aux aspirations du peuple vietnamien.\n\nTout le monde n'est pas convaincu. Des voix plus prudentes avertissent que les modèles étrangers ne peuvent pas être simplement transplantés au Vietnam et qu'une libéralisation excessive risque de saper l'unité forgée au fil des années de lutte révolutionnaire. Ils reconnaissent les succès obtenus à l'étranger mais demandent instamment que toute réforme soit soigneusement adaptée aux conditions historiques et aux traditions révolutionnaires du Vietnam."
VIN_Nhan_Van_Giai_Pham.7.a: "Le socialisme a besoin d'un visage humain"

VIN_Nhan_Van_Giai_Pham.8.t: "Hô Chi Minh autorise la libéralisation"
VIN_Nhan_Van_Giai_Pham.8.d: "La victoire du mouvement Nhan Van - Giai Pham a fait entrer le Vietnam dans une nouvelle ère de réflexion. Alors que les appels à la réforme résonnent dans tout le pays, nombreux sont ceux qui se tournent désormais vers le président Hô Chi Minh pour définir l'avenir du socialisme vietnamien. Plutôt que de considérer une plus grande ouverture comme un recul par rapport aux idéaux révolutionnaires, Oncle Ho a soutenu qu'une révolution confiante ne doit jamais craindre la voix honnête de son peuple.\n\nBien avant la naissance de la République démocratique du Vietnam, le jeune Nguyen Tat Thanh parcourait le monde à la recherche d'une voie de libération nationale. Pendant son séjour aux États-Unis, il a étudié attentivement la Déclaration d'indépendance américaine, dont l'affirmation selon laquelle tous les peuples possèdent le droit à la liberté et à l'égalité l'a profondément marqué. Il admirait également les idéaux incarnés par George Washington, Thomas Jefferson et particulièrement Abraham Lincoln, dont la vision d'un gouvernement « du peuple, par le peuple, pour le peuple » allait plus tard influencer la propre philosophie politique de Ho.\n\nCes principes n'ont pas été oubliés après l'indépendance. La Constitution de 1946 reflétait la conviction d'Hô Chi Minh selon laquelle l'État vietnamien devait être « un État du peuple, par le peuple et pour le peuple », combinant la participation démocratique avec l'indépendance nationale et la justice sociale. Pour Ho, ces idéaux n'étaient pas des importations étrangères mais des principes universels qui pouvaient coexister avec les traditions révolutionnaires et les aspirations socialistes du Vietnam.\n\nAlors que les réformes culturelles défendues par Nhan Van - Giai Pham sont désormais en vigueur, le président Ho a annoncé une nouvelle direction pour la nation. Les intellectuels bénéficieront d'une plus grande liberté pour débattre des affaires publiques, les écrivains et les artistes bénéficieront d'une plus grande autonomie créative et les institutions juridiques seront renforcées pour garantir que l'État reste responsable envers le peuple."
VIN_Nhan_Van_Giai_Pham.8.a: "Tous les êtres méritaient d'avoir la liberté et la liberté."

VIN_Nhan_Van_Giai_Pham.9.t: "Le nouveau mouvement poétique"
VIN_Nhan_Van_Giai_Pham.9.d: "La victoire du mouvement Nhan Van - Giai Pham a non seulement transformé le paysage politique et culturel du Vietnam, mais a également marqué le début de la renaissance littéraire la plus ambitieuse depuis le mouvement original Tho Moi (Nouvelle poésie) des années 1930. Avec la démission et l'éclipse politique de To Huu et d'autres partisans radicaux de l'orthodoxie idéologique, les contraintes qui définissaient depuis longtemps la littérature révolutionnaire ont été levées, ouvrant la porte à une nouvelle génération d'expérimentation poétique.\n\nLes architectes de Nhan Van-Giai Pham affirment que la littérature révolutionnaire ne doit pas se limiter à des formules rigides ou à des slogans politiques. Au lieu de cela, ils appellent à une poésie qui reflète la richesse de l'expérience humaine tout en restant engagée dans le progrès de la nation. En repensant à la révolution littéraire commencée par Phan Khoi, Xuan Dieu, Huy Can et d'innombrables autres avant la révolution, ils proclament le début d'un deuxième mouvement de nouvelle poésie - un mouvement qui cherche à libérer la poésie vietnamienne de la conformité idéologique, tout comme le mouvement original.\n\nLe nouveau mouvement encourage les poètes à expérimenter librement le vers blanc, le vers libre, la poésie en prose, l'imagerie symbolique, la réflexion philosophique, l'expression romantique et les techniques littéraires modernes. La rime traditionnelle et les structures métriques restent respectées, mais elles ne sont plus considérées comme le seul standard de la poésie vietnamienne. Les écrivains sont encouragés à découvrir leur propre voix, convaincus qu'une véritable créativité artistique renforce plutôt qu'elle n'affaiblit la nation.\n\nLes revues littéraires autrefois réduites au silence par la controverse politique ont rouvert leurs pages au débat et à l'expérimentation. Les jeunes poètes écrivent désormais non seulement sur la révolution et le travail, mais aussi sur l'amour, la mémoire, la solitude, la nature, la foi, la philosophie, la vie urbaine et les émotions complexes des gens ordinaires. La voix individuelle - autrefois critiquée comme individualisme bourgeois - est de plus en plus reconnue comme une partie essentielle de l'identité culturelle de la nation."
VIN_Nhan_Van_Giai_Pham.9.a: "Vous et moi sommes les seuls maîtres de nos mots et de notre personnalité."

VIN_Nhan_Van_Giai_Pham.100.t: "[GetNewspaperHeader]Nhan Van-Giai Pham purge"
VIN_Nhan_Van_Giai_Pham.100.d: "HANOI - Le gouvernement de la République démocratique du Vietnam a pris des mesures décisives pour démanteler le mouvement Nhan Van - Giai Pham, mettant ainsi fin à près de trois années de débats de plus en plus houleux sur l'avenir de la littérature, de la culture et de la liberté intellectuelle au Nord-Vietnam.\n\nCette répression intervient dans un contexte international en évolution rapide. À la suite de la campagne de déstalinisation menée par l'Union soviétique, de nombreux pays socialistes ont été confrontés à des demandes en faveur d'une plus grande ouverture politique et culturelle. Cependant, le soulèvement hongrois de 1956, les troubles en Pologne et en Géorgie et la transition brutale de la Chine de la campagne des Cent fleurs à la campagne anti-droite ont profondément modifié la vision des dirigeants communistes dans l'ensemble du bloc socialiste.\n\nLors de ses visites à Pékin en 1957, le président Hô Chi Minh a observé la lutte de la Chine contre la dissidence intellectuelle à la suite de la Campagne des Cent Fleurs. De retour à Hanoï, il a mis en garde contre ce qu'il a décrit comme une « pensée de droite », arguant que la démocratie socialiste ne pouvait pas être exploitée pour saper la direction du Parti. En septembre 1957, sous le pseudonyme de Tran Luc, Ho publia l'article « Smash Rightist Thought », condamnant les tendances révisionnistes et avertissant que les idées hostiles pourraient se propager rapidement si rien n'était fait.\n\nLe Parti a rapidement intensifié sa campagne contre le cercle Nhan Van - Giai Pham. En janvier 1958, le Politburo a adopté la résolution n° 30 sur la littérature et les arts, déclarant les activités du mouvement comme « un phénomène très dangereux » qui cherchait à propager le révisionnisme, l'idéologie bourgeoise et la pensée politique réactionnaire sous le slogan de l'opposition au dogmatisme. Les autorités ont accusé le mouvement de tenter de séparer les artistes de la direction révolutionnaire du Parti et de réorienter la littérature vietnamienne vers des valeurs capitalistes et individualistes.\n\nTo Huu, chef culturel du Parti, était à la tête de la campagne."
VIN_Nhan_Van_Giai_Pham.100.a: "Le fusil domine la plume..."

VIN_Nhan_Van_Giai_Pham.101.t: "[GetNewspaperHeader]La libéralisation du Nord-Vietnam"
VIN_Nhan_Van_Giai_Pham.101.d: "HANOI - Dans un développement qui a surpris les observateurs de l'Est comme de l'Ouest, la République démocratique du Vietnam s'est lancée dans un vaste programme de libéralisation politique et culturelle suite au triomphe inattendu du mouvement Nhan Van - Giai Pham.\n\nAutrefois condamné comme rassemblement d'intellectuels dissidents, le mouvement est devenu la force dominante au sein de l'establishment culturel de Hanoï après que des responsables réformateurs ont réussi à déjouer la faction orthodoxe du Parti. Le limogeage de plusieurs éminents partisans de la ligne dure, notamment des propagandistes influents qui prônaient depuis longtemps un contrôle idéologique strict, a ouvert la voie à une nouvelle génération d'écrivains, d'artistes, d'universitaires et de réformateurs juridiques.\n\nLes nouveaux dirigeants ont annoncé une série de réformes visant à créer ce qu'ils décrivent comme « un socialisme humain et démocratique adapté aux conditions du Vietnam ». Les restrictions sur la littérature et la presse ont été assouplies, les universités ont bénéficié d'une plus grande autonomie académique et le débat intellectuel fleurit à nouveau dans les journaux, les maisons d'édition et les associations culturelles. Le gouvernement a également promis des réformes judiciaires, des protections constitutionnelles plus fortes et une participation accrue du public à la gouvernance locale, tout en réaffirmant son engagement en faveur du socialisme et de l'indépendance nationale.\n\nLes réactions étrangères ont été mitigées. Dans toute l'Europe de l'Est, de nombreux socialistes réformateurs ont accueilli l'expérience de Hanoï comme la preuve que le socialisme peut évoluer par l'ouverture plutôt que par la coercition. Les gouvernements occidentaux ont prudemment salué l'expansion des libertés civiles, même si beaucoup restent sceptiques quant à la possibilité d'un pluralisme politique significatif. Parallèlement, des gouvernements socialistes plus orthodoxes ont exprimé leur inquiétude quant au fait que les réformes vietnamiennes pourraient encourager des revendications similaires à l'intérieur de leurs propres frontières."
VIN_Nhan_Van_Giai_Pham.101.a: "Une victoire des artistes et de l'individualisme"

VIN_Land_Reform.1.t: "Nghi Quyet So 09 - NQ/TW"
VIN_Land_Reform.1.d: "Nghi Quyet et Cong Tac Cai Cach Ruong Dat\n\nAprès avoir entendu et discuté du rapport du Gouvernement sur la mise en oeuvre de la réforme agraire,\n\nRÉSOUT :\n\n1- Actuellement, le mouvement de réforme agraire est fondamentalement achevé dans le Nord, et la tâche anti-féodale dans le Nord est fondamentalement accomplie.\n\nAu Nord, la classe des propriétaires terriens a été fondamentalement renversée, le système féodal de propriété foncière a été aboli et les paysans sont devenus les maîtres des campagnes ; l'aspiration de longue date des paysans à « la terre pour les cultivateurs » s'est réalisée ; la conscience de classe des paysans travailleurs s'est partiellement élevée ; Les forces productives rurales ont été libérées ; les relations de production rurale ont été réformées, stimulant ainsi dans un premier temps la production agricole, améliorant la vie des agriculteurs et ouvrant la voie au développement de l'industrie, du commerce et de la culture dans le pays.\n\nC'était le résultat de la lutte ardue, persistante et héroïque de notre peuple et de nos agriculteurs, le résultat des révolutions anti-impérialistes et anti-féodales et le résultat du régime démocratique populaire du Nord. Ces résultats démontrent que notre ligne générale, la loi de réforme agraire et les politiques supplémentaires adoptées par l'Assemblée nationale étaient fondamentalement correctes.\n\nCependant, les campagnes de réduction des loyers et de réforme agraire, en particulier les 7e et 8e réductions de loyer et les 4e et 5e campagnes de réforme agraire, ont commis de nombreuses erreurs. Il s'agissait d'erreurs graves, contraires à certaines dispositions de la loi de réforme agraire votée par l'Assemblée nationale, contraires à l'État de droit démocratique et contraires à la politique du Front de la Patrie.\n\nCes erreurs ont non seulement limité les réalisations déjà réalisées, mais nous ont également causé de nombreuses difficultés et conséquences négatives.\n\nFace aux graves erreurs évoquées ci-dessus, le Gouvernement a assumé ses responsabilités et s'est sérieusement critiqué devant l'Assemblée nationale."
VIN_Land_Reform.1.a: "Signé"

VIN_Land_Reform.2.t: "Le début de la communisation"
VIN_Land_Reform.2.d: "La victoire de la campagne de réforme agraire a fondamentalement transformé les campagnes de la République démocratique du Vietnam. Dans tout le Nord, le pouvoir de la classe des propriétaires terriens a été brisé, des millions de paysans ont reçu des terres et les vestiges des relations féodales ont été balayés. Pourtant, les dirigeants du Parti affirment de plus en plus que la redistribution des terres ne suffit pas à elle seule à réaliser le socialisme dans l'agriculture.\n\nDepuis des générations, l'agriculture vietnamienne est caractérisée par de petites parcelles fragmentées exploitées par des ménages individuels. Même si la distribution des terres a satisfait la demande de propriété de longue date des paysans, de nombreux responsables estiment que ce système ne peut pas assurer la productivité, la mécanisation et l'efficacité nécessaires à un développement socialiste rapide. Le défi auquel la révolution est désormais confrontée est de savoir comment transformer d'innombrables petites exploitations agricoles en une économie agricole moderne capable de soutenir l'industrialisation et la reconstruction nationale.\n\nÀ la suite de discussions approfondies au sein du Parti des travailleurs vietnamiens et de consultations avec les alliés socialistes, le gouvernement a annoncé le début d'une nouvelle étape dans la transformation rurale : la communalisation progressive de l'agriculture.\n\nPlutôt que d'abolir immédiatement les cultures privées, le Parti a appelé les paysans à former volontairement des équipes d'entraide et des coopératives de production agricole (Hop tac Xa). Les villageois sont encouragés à mettre en commun leur travail, leurs animaux de trait, leurs outils, leurs systèmes d'irrigation et leurs connaissances agricoles afin d'augmenter la productivité et de réduire les inefficacités. Les cadres du parti soulignent que la coopération représente la prochaine étape naturelle après la réforme agraire, permettant aux paysans de bénéficier des avantages du travail collectif tout en conservant les acquis acquis grâce à la révolution."
VIN_Land_Reform.2.a: "Terre aux motoculteurs"

VIN_Land_Reform.3.t: "La question de la collaboration de classe"
VIN_Land_Reform.3.d: "La transformation révolutionnaire du Nord-Vietnam a fondamentalement modifié l'ordre social du pays. La réforme agraire a affaibli l'ancienne classe des propriétaires fonciers, tandis que les ouvriers et les paysans ont assumé un rôle de plus en plus important dans la construction du socialisme. Pourtant, alors que le pays s'engage dans l'industrialisation et la reconstruction économique, le Parti doit déterminer comment aborder les groupes sociaux qui ne correspondent pas parfaitement aux catégories traditionnelles de la lutte des classes.\n\nParmi les plus débattus figurent la bourgeoisie nationale - les soi-disant « capitalistes patriotes » - dont les usines, les ateliers, les sociétés commerciales et l'expertise technique continuent de contribuer à l'économie nationale. Contrairement aux propriétaires féodaux, de nombreux membres de cette classe ont soutenu la lutte pour l'indépendance et ont démontré leur volonté de coopérer avec le gouvernement révolutionnaire. Au cours de la campagne de réforme agraire, le Parti les a délibérément distingués de la classe des propriétaires fonciers, permettant à leurs entreprises et à leurs propriétés de rester intactes tout en les encourageant à contribuer au développement de l'industrie et du commerce.\n\nCertains théoriciens du Parti soutiennent que l'expérience historique unique du Vietnam exige une approche flexible. Contrairement aux sociétés industrialisées décrites dans la théorie marxiste classique, le Vietnam précolonial était organisé autour de villages autonomes et de réseaux familiaux plutôt que de divisions de classes rigides. Selon eux, la solidarité nationale s'est souvent révélée plus décisive que l'identité de classe pour résister à la domination étrangère. Même pendant la lutte anticoloniale, les ouvriers, les paysans, les intellectuels, les commerçants et les hommes d'affaires patriotes se sont fréquemment unis sous l'objectif commun de libération nationale."
VIN_Land_Reform.3.a: "Les camarades riches aidaient les camarades les plus pauvres"

VIN_Land_Reform.4.t: "Des progrès lents dans les réformes agraires"
VIN_Land_Reform.4.d: "La campagne de réforme agraire a rencontré des difficultés croissantes dans les campagnes. Bien que le Parti reste déterminé à éliminer les vestiges du féodalisme et à donner du pouvoir à la paysannerie, la mise en oeuvre a progressé beaucoup plus lentement que prévu initialement.\n\nDe nombreux cadres locaux ont eu du mal à faire une distinction précise entre les paysans pauvres, les paysans moyens, les paysans riches et les propriétaires terriens. Dans de nombreux villages, les liens familiaux, les relations personnelles de longue date et les registres fonciers incomplets compliquent les enquêtes. Certains cadres ont appelé à une action immédiate et sans compromis, tandis que d'autres préconisent une plus grande prudence pour éviter des accusations injustifiées qui pourraient aliéner les fidèles partisans de la révolution.\n\nLe rythme de la redistribution a également été ralenti par l'énorme charge administrative liée à l'arpentage des terres, à l'organisation de réunions de masse, à la résolution des conflits et à la mise en place de nouvelles autorités villageoises. Dans certaines provinces, la pénurie de cadres expérimentés a contraint le Parti à reporter les campagnes prévues pendant que du personnel supplémentaire reçoit une formation politique et juridique.\n\nÀ ces difficultés s'ajoute le coût humain croissant de la campagne. La planification initiale du Parti aurait prévu l'exécution d'environ un « propriétaire réactionnaire et méchant » pour mille habitants, un chiffre qui, s'il était pleinement appliqué à l'échelle nationale, équivaudrait à environ 15 000 exécutions. Cependant, au fur et à mesure du déroulement de la campagne, les rapports provenant des campagnes ont produit des estimations très différentes. Certains responsables insistent sur le fait que seules quelques centaines de propriétaires fonciers parmi les plus notoires ont été exécutés, tandis que d'autres suggèrent que le nombre de morts a déjà atteint des dizaines de milliers. Les observateurs étrangers et les rapports ultérieurs ont estimé des chiffres allant d'environ 800 à plus de 50 000 morts, les estimations les plus élevées faisant état de 100 000 à 200 000 personnes qui pourraient avoir péri."
VIN_Land_Reform.4.a: "Oh non"

VIN_Land_Reform.5.t: "Préparer l'avenir"
VIN_Land_Reform.5.d: "La République démocratique du Vietnam est guidée depuis sa fondation par le président Hô Chi Minh, père incontesté de la révolution. Pourtant, à mesure que la nation se renforce, le Parti a commencé à se préparer tranquillement au jour où une nouvelle génération devra perpétuer son héritage. La question de la succession est devenue l'une des questions les plus importantes auxquelles le Parti est confronté.\n\nPlusieurs révolutionnaires de premier plan sont apparus comme successeurs potentiels.\n\nVo Nguyen Giap est célébré comme l'architecte des victoires militaires du Vietnam et jouit d'un immense prestige tant auprès de l'armée que du peuple.\n\nNguyen Chi Thanh est considéré comme un révolutionnaire convaincu, connu pour ses compétences organisationnelles, sa discipline idéologique et son leadership au sein de l'Armée populaire.\n\nLe Duan s'est bâti une réputation d'organisateur et de stratège compétent du Parti, prônant un développement socialiste rapide et une réunification nationale.\n\nTruong Chinh, l'un des principaux théoriciens du Parti, impose le respect pour son expérience de l'idéologie marxiste et de l'organisation du Parti.\n\nLe Duc Tho, chef de la commission d'organisation du Parti et vétéran de l'appareil du Sud, détient les dossiers des cadres et l'appareil qui décide de chaque promotion.\n\nPour l'instant, Oncle Ho continue de diriger la nation. Mais le choix de celui qui héritera un jour de son mandat déterminera l'orientation future de la révolution vietnamienne pour les décennies à venir."
VIN_Land_Reform.5.a: "Nguyên Chi Thanh"
VIN_Land_Reform.5.b: "Le Duan"
VIN_Land_Reform.5.c: "Vo Nguyen Giap"
VIN_Land_Reform.5.e: "Truong Chinh"
VIN_Land_Reform.5.f: "Le Duc Tho"

VIN_Land_Reform.100.t: "[GetNewspaperHeader]Le Nord-Vietnam entame une réforme agraire"
VIN_Land_Reform.100.d: "HANOI - La République démocratique du Vietnam a annoncé le début d'une ambitieuse campagne nationale de réforme agraire, marquant l'une des transformations sociales les plus importantes entreprises par le gouvernement communiste depuis sa création.\n\nLa réforme vise à démanteler le système traditionnel de propriété foncière en redistribuant les terres agricoles aux paysans pauvres et sans terre. Les responsables de Hanoï décrivent la campagne comme une étape nécessaire pour éliminer l'exploitation féodale, augmenter la production agricole et jeter les bases d'une campagne socialiste.\n\nS'appuyant largement sur les expériences d'autres États socialistes et communistes, en particulier l'Union soviétique et la Chine, la campagne combine la redistribution des terres avec la réduction des loyers et la lutte des classes organisée dans les villages ruraux. Des tribunaux révolutionnaires ont été créés pour enquêter sur les abus présumés commis par les propriétaires fonciers, tandis que des réunions de masse sont organisées pour mobiliser la participation des paysans.\n\nLes partisans soutiennent que la réforme répondra enfin aux aspirations de longue date de millions de paysans vietnamiens qui ont vécu sous des générations d'endettement et de propriété foncière inégale. Les dirigeants du parti ont déclaré que la campagne représentait « la terre pour les laboureurs » et l'achèvement de la révolution démocratique vietnamienne dans les campagnes."
VIN_Land_Reform.100.a: "Bienvenue dans les rizières"

VIN_Geneva_Conference.1.t: "Le début de la Conférence de Genève"
VIN_Geneva_Conference.1.d: "Les représentants des grandes puissances se sont réunis à Genève pour discuter de l'avenir de l'Indochine. La conférence représente une occasion cruciale de mettre fin au conflit sanglant qui ravage notre pays depuis des années. En tant que République démocratique du Vietnam, nous devons examiner attentivement notre position et ce que nous sommes prêts à accepter pour la paix. Les yeux du monde sont tournés vers nous et les décisions prises ici façonneront le destin de notre nation pour les générations à venir."
VIN_Geneva_Conference.1.a: "Nous participerons de bonne foi."
VIN_Geneva_Conference.1.b: "La paix sur le papier : la lutte continue dans le Sud."

VIN_Geneva_Conference.100.t: "[GetNewspaperHeader]La fin de la guerre d'Indochine"
VIN_Geneva_Conference.100.d: "Après des années de conflit brutal, la Conférence de Genève a finalement conclu un accord mettant fin à la guerre d'Indochine. Les accords établissent une division temporaire du Vietnam le long du 17e parallèle, avec des élections prévues en 1956 pour déterminer l'avenir du pays. Bien qu'il ne s'agisse pas de la victoire complète que nous espérions, cet accord offre à notre peuple un répit bien mérité face aux horreurs de la guerre et une voie vers une éventuelle réunification."
VIN_Geneva_Conference.100.a: "La paix enfin."

VIN_Geneva_Conference.200.t: "[GetNewspaperHeader]La Déclaration de la Fédération Indochinoise"
VIN_Geneva_Conference.200.d: "Genève, [?global.date.GetDateStringNoHourLong] - Dans un triomphe décisif pour la lutte révolutionnaire, la Conférence de Genève s'est conclue par la reconnaissance d'une victoire complète en Indochine. Avec l'expulsion des forces étrangères et le démantèlement de l'autorité coloniale, les représentants du Vietnam, du Laos et du Cambodge ont proclamé conjointement la création de la Fédération indochinoise.\n\nCette déclaration marque le point culminant d'années de sacrifice et de résistance partagés. Unis par une lutte commune, les peuples d'Indochine ont choisi la coopération plutôt que la division, forgeant un nouvel ordre politique ancré dans l'indépendance, la solidarité et l'autodétermination. La fédération représente un rejet clair de la domination étrangère et des frontières imposées.\n\nUne nouvelle ère commence désormais pour l'Indochine. Grâce à l'unité et à la force collective, les peuples de la région détermineront leur propre avenir, libres de toute domination coloniale et de toute ingérence extérieure.\n\n"
VIN_Geneva_Conference.200.a: "Un nouveau chapitre commence."

#### Campaigns (VIN_Camp namespace) ####
VIN_Campaign_Supply_Change_tt:0 "§YRavitaillement de campagne§! [?vin_supply_amount|+0] (maintenant §Y[?VIN.VIN_Campaign_Supply|0]§!)"
VIN_Camp.2.t:0 "La campagne est terminée"
VIN_Camp.2.d_clean:0 "L'objectif est le nôtre et dans le temps imparti par le personnel. Les colonnes quittèrent les cols avant que le corps d'armée puisse réagir, et le terrain fut pris alors que Saigon se disputait encore pour savoir où nous étions.\n\nLe Politburo entendra parler de cette campagne pendant des années. Paris aussi.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_ground:0 "L'objectif est le nôtre, mais il n'a pas été atteint, il a été usé. La date limite est passée et les combats se sont poursuivis au-delà de cette date, et la liste des victimes est plus longue que tout ce que la campagne était censée coûter.\n\nSaigon considère ce retard comme une victoire en soi et, sur la base des chiffres, ses arguments sont justifiés. Nous tenons le terrain malgré tout.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_called_off:0 "La campagne a été annulée. Les canons se sont arrêtés avant que l'objectif ne change de mains, et les colonnes reviennent par les cols sans rien avoir à montrer du riz qu'elles ont mangé.\n\nMieux vaut ceci que l'alternative. Une armée brisée dans les hauts plateaux ne revient pas du tout.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_failed:0 "Le délai est passé et l'objectif est toujours d'actualité. La campagne est terminée - non pas annulée, mais dépensée. Le ravitaillement a disparu, les formations qui ont avancé sont l'ombre de ce qui a marché, et le corps occupe toutes les positions qu'il occupait lorsque nous avons commencé.\n\nSaigon en fera beaucoup et elle en a bien mérité le droit.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.d_superseded:0 "La campagne a été dépassée par les événements ailleurs en Indochine. Son objectif ne décide plus du théâtre, les colonnes se retirent donc sans qu'un règlement du champ de bataille ne soit enregistré.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.2.a:0 "Le Parti remercie les camarades qui l'ont pris."
VIN_Camp.2.b:0 "Nous en tirerons des leçons et y retournerons."
VIN_Camp.3.t:0 "La vallée de Dien Bien Phu"
VIN_Camp.3.d:0 "Les Français ont mis une garnison dans un bassin entouré de collines, à douze jours de marche du delta et alimenté uniquement par l'air. Ils l'ont choisi pour nous entraîner dans une bataille planifiée qu'ils espèrent gagner, car ils ne croient pas que l'artillerie puisse être amenée par-dessus ces collines.\n\nÇa peut. Les canons graviront les pentes inverses à la main, creusés dans la crête et tirant à vue dégagée. Ce que nous ne pouvons pas faire, c'est prendre notre temps : le camp est renforcé par des parachutes chaque semaine où nous attendons, et les pluies mettent fin à cette offensive, qu'elle soit terminée ou non.\n\nChaque commandant des hautes terres doit comprendre une chose : §Yla bataille est le camp lui-même§!. Ce n'est pas le fond de la vallée qui est l'objectif, c'est la province."
VIN_Camp.3.a:0 "Amenez les armes par-dessus les collines."
VIN_Camp_Dien_Bien_Objective_tt:0 "§YObjectif§! - prendre le camp fortifié à §YDien Bien Phu§! lui-même.\nEn dépassant le reste de Tay Bac Bo, §Ret non§! gagnent cette bataille. Le camp le fait."
VIN_Camp.4.t:0 "La vallée est décidée"
VIN_Camp.4.d_clean:0 "Le camp est tombé, et il est tombé avant que les armes aient pu être approvisionnées. Le dernier point fortifié s'effondre avant que la garnison puisse être informée que les secours n'arriveront pas.\n\nIl n'y a plus rien entre nous et le delta que Paris puisse qualifier de plan. L'Assemblée entendra parler de cette vallée avant d'entendre quoi que ce soit d'autre, et ce qu'elle y décidera, elle le décidera à cause de cela.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_ground:0 "Le camp est tombé. Cela a pris plus de temps que ne le permettait l'état-major, et le prix a été payé point d'appui à la fois - des tranchées avancées à la main sur le terrain que les Français avaient tracées au mètre.\n\nSaigon fera grand cas de la durée de sa garnison. Laissez-le. La garnison est partie et la vallée est à nous.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_called_off:0 "Le siège a été levé sur notre propre ordre. Les canons redescendent des crêtes et les divisions regagnent leurs bases avec le camp toujours debout derrière elles.\n\nUne armée brisée dans ce bassin n'en serait pas sortie du tout. C'était la bonne décision, et cela ne sera pas le cas avant longtemps.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_failed:0 "L'offensive est passée et le drapeau tricolore survole toujours la vallée. Les canons sont à court d'obus, les divisions d'assaut sont des ombres et le pont aérien a permis de nourrir la garnison chaque semaine où nous avons pu maintenir la pression.\n\nDien Bien Phu a tenu. Paris dira que la guerre a tourné, et pour l'instant c'est le cas.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.d_superseded:0 "Les événements ailleurs ont réglé le théâtre avant que la vallée puisse en décider. Le siège est levé sans enregistrer le résultat du champ de bataille de Dien Bien Phu.\n\nJour §Y[?VIN.VIN_camp_days_elapsed|0]§! du §Y[?VIN.VIN_camp_deadline_y|0]§!."
VIN_Camp.4.a:0 "Dien Bien Phu est à nous."
VIN_Camp.4.b:0 "La vallée garda sa garnison. Nous ne l'oublierons pas."
VIN_Camp_War_Tay_Bac_tt:0 "§RDéclarez la guerre à la Fédération Tai§!\nObjectif : §Ys'emparer de Hoang Lien Son dans les 120 jours§!. Passé §Y210§! l'offensive a échoué."
VIN_Camp_War_Hoa_Binh_tt:0 "§RDéclarer la guerre à la Fédération Muong§!\nObjectif : §Ys'emparer de Hoa Binh dans les 120 jours§!. Passé §Y210§! l'offensive a échoué.\n\nLa saisie d'ouverture du CEFEO a déjà établi le saillant. Cette déclaration déclenche la contre-offensive et oblige Salan à choisir entre un retrait par étapes et la poursuite de la résistance."
VIN_Camp_War_Dien_Bien_tt:0 "§RDéclarez la guerre à la Fédération Tai§!\nObjectif : §Yprendre le camp fortifié de Dien Bien Phu en 150 jours§!. Envahir le reste des hauts plateaux ne signifie pas gagner la bataille. Passé §Y260§! le siège a échoué."
VIN_Camp_War_Cao_Bac_tt:0 "§RDéclarer la guerre au territoire autonome de Tho§!\nObjectif : §Ycontrôler les États de Cao Bang et de Lang Son dans un délai de 120 jours§!. Passé §Y210§! l'offensive a échoué.\nLes §Y[NUN.GetName]§! rejoindront la défense. Les combats à la frontière de Hai Ninh ne sont pas considérés comme une extension excessive."
VIN_Camp_War_Vinh_Yen_tt:0 "§RCommencez la bataille de Vinh Yen contre la Fédération Tai§!\nPrenez la §Yprovince unique de Vinh Yen§! à Hoang Lien Son et maintenez-la pendant §Y5 jours consécutifs§!. Victoire nette : jour §Y20§!. Date limite finale : jour §Y35§!."
VIN_Camp_War_Mao_Khe_tt:0 "§RCommencer la bataille de Mao Khe contre le CEFEO§!\nPrenez la §Yprovince unique de Mao Khe§! dans le delta du fleuve Rouge et maintenez-la pendant §Y5 jours consécutifs§!. Victoire nette : jour §Y20§!. Date limite finale : jour §Y35§!.\nLes §Y[NUN.GetName]§! rejoindront la défense. Les combats à la frontière de Hai Ninh ne sont pas considérés comme une extension excessive."
VIN_Camp_War_Day_River_tt:0 "§RCommencez la bataille de la rivière Day contre le CEFEO§!\nPrenez §YNinh Binh§!, §YPhat Diem§!et la §YCentral Day River Line§! en même temps, puis maintenez les trois pendant §Y5 jours consécutifs§!. Victoire nette : jour §Y30§!. Date limite finale : jour §Y50§!."
VIN_Camp_War_Na_San_tt:0 "§RCommencer l'assaut contre la Fédération Tai§!\nPrenez la §Yprovince unique du camp Na San§! à Tay Bac Bo - pas Dien Bien Phu ou Son La - et maintenez-la pendant §Y5 jours consécutifs§!. Victoire nette : jour §Y30§!. Date limite finale : jour §Y45§!."
VIN_Camp_War_Nghia_Lo_tt:0 "§RCommencer l'assaut contre la Fédération Tai§!\nPrenez le §Yposte unique de la province de Nghia Lo§! à Hoang Lien Son et maintenez-le pendant §Y5 jours consécutifs§!. Victoire nette : jour §Y25§!. Date limite finale : jour §Y40§!. La bataille ne change pas à qui appartient la province."
VIN_Camp_Clock_tt:0 "§YOBJECTIF ACTUEL§!\n[GetVINCampaignObjective]\n\n§YProgrès§!: jour de campagne §Y[?VIN.VIN_camp_days_elapsed|0]§! / §Y[?VIN.VIN_camp_deadline_y|0]§!. Résultat propre tout au long de la journée §Y[?VIN.VIN_camp_deadline_x|0]§!.[GetVINCampaignHoldProgress]"
VIN_CAMP_HOLD_PROGRESS:0 "\n§YMaintien continu§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours. La perte d'une province requise le réinitialise à zéro."
VIN_CAMP_HOLD_PROGRESS_NONE:0 ""
VIN_CAMP_OBJ_VINH_YEN:0 "Prenez et maintenez la province §YVinh Yen§! en surbrillance à §YHoang Lien Son§!, au nord-ouest de Hanoi, pendant §Y5 jours consécutifs§!."
VIN_CAMP_OBJ_MAO_KHE:0 "Prenez et maintenez la province §YMao Khe§! en surbrillance dans §YDong Bang Song Hong (Delta du fleuve Rouge)§! pendant §Y5 jours consécutifs§!."
VIN_CAMP_OBJ_DAY_RIVER:0 "Prenez et conservez les §Ytrois provinces mises en évidence§!: §YNinh Binh§!, §YPhat Diem§! et la §YCentral Day River Line§!, le tout dans §YDong Bang Song Hong§!. Tenez les trois ensemble pendant §Y5 jours consécutifs§!."
VIN_CAMP_OBJ_NA_SAN:0 "Prenez et maintenez le camp §YNa San§! en surbrillance dans §YTay Bac Bo§! pendant §Y5 jours consécutifs§!. Dien Bien Phu et Son La ne sont pas l'objectif."
VIN_CAMP_OBJ_NGHIA_LO:0 "Prenez et maintenez le poste §YNghia Lo§! en surbrillance dans §YHoang Lien Son§! pendant §Y5 jours consécutifs§!."
VIN_CAMP_OBJ_NORTHWEST:0 "Contrôlez simultanément les §Ycinq provinces du corridor§! dans §YHoang Lien Son§!, depuis la frontière de Dong Bac Bo jusqu'à l'approche de Hoa Binh. Il n'y a aucune exigence d'attente d'un jour consécutif pour cette offensive. L'extrême nord-ouest atteint par Ha Giang n'est pas nécessaire."
VIN_CAMP_OBJ_HOA_BINH:0 "Prenez le contrôle de l'état §YHoa Binh§! pour briser le saillant français. Il n'y a aucune exigence de retenue d'un jour consécutif. Si le CEFEO achève d'abord son retrait ordonné, le règlement attribue également Hoa Binh au Viet Minh et met fin à cette campagne sans mettre fin à la guerre d'Indochine au sens large."
VIN_CAMP_OBJ_DIEN_BIEN:0 "Prendre la province du camp §YDien Bien Phu§! en §YTay Bac Bo§!. Il n'y a aucune exigence de retenue d'un jour consécutif. Envahir d'autres parties de Tay Bac Bo ne répond pas à cet objectif."
VIN_CAMP_OBJ_CAO_BAC:0 "Contrôle sécurisé des DEUX états §YCao Bang§! et §YLang Son§! simultanément. Il n'y a aucune exigence de retenue d'un jour consécutif."
VIN_CAMP_OBJ_NONE:0 ""
VIN_Campaign_Objective_Timer:0 "Objectif et date limite de la campagne"
VIN_Campaign_Objective_Timer_desc:0 "Passez la souris sur l'objectif actuel, la fenêtre de résultats propres et la progression de la campagne. A l'échéance finale, l'offensive se termine par un résultat déterminé par son objectif et toute prise consécutive requise."
VIN_Vinh_Yen_Objective:0 "Horloge de bataille : Vinh Yen"
VIN_Vinh_Yen_Objective_desc:0 "Prenez et maintenez la province §YVinh Yen§! en surbrillance à §YHoang Lien Son§!, au nord-ouest de Hanoi, pendant §Y5 jours consécutifs§!. Le perdre réinitialise la prise.\nSuccès net jusqu'à §Yjour 20§!; le succès ultérieur coûte cher. Délai final : §Yjour 35§!.\n§YMaintien actuel§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours."
VIN_Mao_Khe_Objective:0 "Horloge de bataille : Mao Khe"
VIN_Mao_Khe_Objective_desc:0 "Prenez et maintenez la province §YMao Khe§! en surbrillance dans §YDong Bang Song Hong (Delta du fleuve Rouge)§! pendant §Y5 jours consécutifs§!. Le perdre réinitialise la prise.\nSuccès net jusqu'à §Yjour 20§!; le succès ultérieur coûte cher. Délai final : §Yjour 35§!.\n§YMaintien actuel§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours."
VIN_Day_River_Objective:0 "Horloge de bataille : ligne Day River"
VIN_Day_River_Objective_desc:0 "Prenez et conservez les trois provinces mises en évidence, §YNinh Binh§!, §YPhat Diem§! et la §YCentral Day River Line§! à §YDong Bang Song Hong§!, ensemble pendant §Y5 jours consécutifs.§!. En perdre un réinitialise la prise.\nSuccès net jusqu'au §Yjour 30§!; le succès ultérieur coûte cher. Date limite finale : §Yjour 50§!.\n§YMaintien actuel§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours."
VIN_Na_San_Objective:0 "Horloge de bataille : Na San"
VIN_Na_San_Objective_desc:0 "Prenez et maintenez le camp §YNa San§! en surbrillance à §YTay Bac Bo§!, pas Dien Bien Phu ou Son La, pendant §Y5 jours consécutifs§!. Le perdre réinitialise la prise.\nSuccès net jusqu'à §Yjour 30§!; le succès ultérieur coûte cher. Délai final : §Yjour 45§!.\n§YMaintien actuel§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours."
VIN_Nghia_Lo_Objective:0 "Horloge de bataille : Nghia Lo"
VIN_Nghia_Lo_Objective_desc:0 "Prenez et maintenez le poste §YNghia Lo§! en surbrillance dans §YHoang Lien Son§! pendant §Y5 jours consécutifs§!. Le perdre réinitialise la prise.\nSuccès net jusqu'à §Yjour 25§!; le succès ultérieur coûte cher. Délai final : §Yjour 40§!.\n§YMaintien actuel§!: §Y[?VIN.VIN_camp_objective_hold_days|0]§! / §Y5§! jours."
indochina_contested_objective:0 "Objectif contesté"
indochina_contested_objective_desc:0 "Ce terrain est pris d'assaut, pas de garnison. La garnison le tient sans positions préparées - et dès qu'elle change de mains, la pénalité l'accompagne."
VIN_campaign_rear_supply_network:0 "Approvisionnement dispersé dans la zone de base"
VIN_campaign_rear_supply_network_desc:0 "Les caches de village, les relais de porteurs et les ateliers dispersés fournissent §G+0,50 Approvisionnement local§! tandis que le Viet Minh contrôle cette zone de base sud et qu'une campagne nord reste sur le terrain."

# === Foreign Policy Event Chain (merged from VIN_FORPOL_l_english.yml) ===
# ============================================================
# Vietnamese Foreign-Policy Event Chain
# ============================================================

# ------------------------------------------------------------
# Opening foreign-policy sequence
# ------------------------------------------------------------

VIN_FORPOL.0.t: "Le Vietnam dans le Nouvel Ordre"
VIN_FORPOL.0.d: "La fin de la guerre coloniale n'a pas mis fin à la lutte du Vietnam. Les anciens empires sont affaiblis, les grandes puissances divisent le monde en camps rivaux et chaque gouvernement d'Asie est contraint de choisir entre la dépendance, la révolution et une neutralité incertaine. Hanoï ne peut plus traiter la politique étrangère comme une affaire de chancelleries lointaines. Elle est désormais indissociable de la survie de la République elle-même.\n\nCertains camarades demandent un alignement immédiat et sans équivoque sur le monde socialiste. D'autres préviennent que le Vietnam vient tout juste d'échapper à une forme de tutelle étrangère et qu'il doit conserver sa marge de manoeuvre pour agir en son propre nom. Quelle que soit la voie choisie, le gouvernement doit indiquer clairement que le peuple vietnamien n'acceptera pas tranquillement la place qui lui est assignée par Paris, Washington, Moscou ou Pékin."
VIN_FORPOL.0.a: "Le Vietnam parlera de sa propre voix."

VIN_FORPOL.1.t: "La quête de la reconnaissance des Nations Unies"
VIN_FORPOL.1.d: "La reconnaissance diplomatique reste incomplète. Bien que la République démocratique exerce son autorité sur son territoire et jouisse de la loyauté d'une grande partie de la population, de nombreux gouvernements étrangers considèrent toujours le Vietnam à travers le prisme des traités coloniaux, des arrangements de guerre et des ambitions des plus grandes puissances. Une approche formelle auprès des Nations Unies placerait la question de la souveraineté vietnamienne devant le monde.\n\nL'effort sera coûteux et incertain. Certaines délégations verront une candidature de Hanoï comme un test pour la France, l'Union soviétique, la Chine ou les États-Unis plutôt que comme une simple question d'autodétermination nationale. Pourtant, refuser de demander la reconnaissance laisserait les autres libres de définir la position internationale du Vietnam en son nom."
VIN_FORPOL.1.a: "Soumettez votre candidature et défendez notre cause."

VIN_FORPOL.2.t: "Les yeux sur le monde"
VIN_FORPOL.2.d: "Le ministère des Affaires étrangères a présenté sa première évaluation globale du monde d'après-guerre. L'Asie n'est plus simplement un terrain sur lequel les puissances extérieures rivalisent. De nouveaux gouvernements, mouvements de libération et coalitions fragiles émergent de Jakarta au Caire, de Belgrade à Rangoon. Le Vietnam a dans chacun d'eux des amis potentiels, mais aussi des obligations et des dangers qui ne peuvent être ignorés.\n\nLa question n'est pas de savoir si Hanoï peut influencer les affaires mondiales ; la question est de savoir où doit être dépensée en premier l'énergie diplomatique limitée. La République doit établir des canaux au-delà de ses frontières immédiates, connaître les intentions des grandes puissances et veiller à ce que son isolement ne puisse pas être utilisé contre elle."
VIN_FORPOL.2.a: "Ouvrez les fenêtres de Hanoï sur le monde."

VIN_FORPOL.3.t: "Revisiter la ligne Sainteny"
VIN_FORPOL.3.d: "Les ententes associées à Jean Sainteny offraient autrefois une voie possible entre la poursuite du conflit colonial et la partition pure et simple. Leur signification a depuis été dépassée par la guerre, la révolution et l'effondrement des anciennes hypothèses. Néanmoins, les contacts français suggèrent discrètement que certains éléments de l'accord antérieur pourraient encore servir de base à la communication.\n\nRouvrir la question, c'est ne pas oublier les sacrifices qui ont créé la République. Il s'agit de déterminer si la diplomatie peut obtenir des concessions que la force seule ne peut pas encore garantir. Hanoï doit décider si le canal Sainteny est une relique d'un compromis raté ou un instrument utile dans un paysage international modifié."
VIN_FORPOL.3.a: "Revoyez les anciennes compréhensions sans illusions."

# ------------------------------------------------------------
# French channel
# ------------------------------------------------------------

VIN_FORPOL.4.t: "Que veut la France ?"
VIN_FORPOL.4.d: "La position française reste difficile à lire. Paris parle de paix, de liens culturels et de relations renouvelées, mais les factions politiques françaises sont en profond désaccord sur l'avenir de son ancien empire. Certains responsables espèrent encore préserver leur influence grâce à la pression économique et à un accès militaire ; d'autres soutiennent qu'un Vietnam stable et indépendant est préférable à un conflit sans fin.\n\nLe Politburo doit décider comment interpréter ces signaux. Une ouverture diplomatique pourrait améliorer la position du Vietnam, mais une confiance mal placée exposerait la République à des manipulations à un moment où ses institutions sont encore jeunes."
VIN_FORPOL.4.a: "Étudiez chaque mot français et chaque silence français."

VIN_FORPOL.5.t: "L'enquête de Nguyen Duy Trinh"
VIN_FORPOL.5.d: "Nguyen Duy Trinh a été chargé de rédiger un rapport confidentiel sur la politique française. Ses enquêteurs ont examiné la correspondance diplomatique, les contacts commerciaux et les déclarations des hommes politiques de Paris et de Saigon. Les faits vont dans plusieurs directions à la fois : la France est lasse de la guerre, mais n'est pas nécessairement prête à perdre son influence ; Certaines personnalités françaises souhaitent un règlement, tandis que d'autres restent déterminés à restaurer l'ancienne hiérarchie par des moyens plus subtils.\n\nLe rapport ne propose pas de réponse simple. Cela montre cependant clairement que le Vietnam aura besoin de patience, de renseignements fiables et d'une volonté d'exploiter les divisions au sein même de la France."
VIN_FORPOL.5.a: "Apportez les résultats à la direction."

VIN_FORPOL.6.t: "Télégraphes entre De Gaulle et Ho Chi Minh"
VIN_FORPOL.6.d: "Des messages sont arrivés des milieux proches de Charles de Gaulle. Leur ton est particulièrement respectueux : ils reconnaissent la réalité politique du Vietnam, condamnent le retour à une guerre coloniale futile et laissent entendre que la France pourrait chercher à jouer un rôle de médiateur plutôt que de maître. Le langage est soigneusement choisi, mais il est tout de même plus conciliant que ce à quoi Hanoï s'attendait.\n\nCertains au sein du gouvernement y voient une ouverture rare. D'autres insistent sur le fait que même une France sympathique finira par poursuivre ses intérêts, notamment en ce qui concerne l'influence américaine et l'avenir de l'Indochine. La réponse envoyée maintenant déterminera si la chaîne se transforme en une véritable relation ou reste un échange prudent de courtoisies."
VIN_FORPOL.6.a: "Reconnaître la bonne volonté de De Gaulle et poursuivre l'ouverture."
VIN_FORPOL.6.b: "Restez prudent ; l'amitié n'est pas encore la confiance."

VIN_FORPOL.7.t: "Un médiateur français pour l'unité vietnamienne ?"
VIN_FORPOL.7.d: "Des intermédiaires français ont suggéré qu'un envoyé de confiance pourrait aider à établir un cadre pour les futurs pourparlers sur l'unité vietnamienne, les garanties de sécurité et les conséquences restantes de la guerre coloniale. La proposition est délicate. L'implication française pourrait donner un poids international aux négociations, mais elle pourrait aussi permettre à Paris de se présenter comme l'arbitre indispensable de l'avenir du Vietnam.\n\nLe gouvernement doit décider s'il souhaite faire usage de cette offre. Un médiateur ne peut pas remplacer la détermination vietnamienne, mais un canal extérieur peut contribuer à empêcher que le sort du Vietnam soit décidé exclusivement par des États plus puissants."
VIN_FORPOL.7.a: "Explorer la proposition tout en gardant l'initiative entre les mains des Vietnamiens."

VIN_FORPOL.8.t: "Une réunion officieuse à l'Elysée"
VIN_FORPOL.8.d: "Une délégation vietnamienne a été invitée à une réunion officieuse à Paris. Aucun traité ne sera signé, aucune photographie ne sera publiée et les deux gouvernements conserveront un déni plausible. Pourtant, la rencontre offre l'occasion de parler directement avec des personnalités proches de la présidence française, sans les couches habituelles d'administrateurs coloniaux, d'officiers militaires et d'intermédiaires hostiles.\n\nLa délégation a été chargée de souligner la souveraineté du Vietnam, son désir de paix et son refus de devenir un pion dans une lutte plus large. Le véritable test sera de savoir si la France est prête à entendre ces conditions."
VIN_FORPOL.8.a: "Allez à Paris, mais ne révélez rien."

VIN_FORPOL.9.t: "La demande vietnamienne"
VIN_FORPOL.9.d: "Des représentants de la République démocratique du Vietnam sont arrivés pour une rencontre discrète avec des responsables français. Ils recherchent une communication directe, une réduction des tensions en Indochine et le soutien de la France pour un éventuel règlement politique. Leur demande place la France dans une position délicate. Une adhésion publique pourrait provoquer des alliés et des critiques nationales, mais refuser le contact pourrait pousser Hanoï plus fermement dans l'orbite des puissances rivales.\n\nLe gouvernement doit décider jusqu'où il est prêt à aller pour ouvrir la voie aux révolutionnaires vietnamiens."
VIN_FORPOL.9.a: "Recevez-les discrètement ; La France doit garder le canal ouvert."
VIN_FORPOL.9.b: "Limitez la réunion à des politesses formelles."

VIN_FORPOL.10.t: "Gagner la confiance de la SFIO"
VIN_FORPOL.10.d: "Des intermédiaires vietnamiens ont proposé d'aider le gouvernement français à démontrer qu'une politique moins conflictuelle en Indochine peut produire des gains politiques tangibles. La proposition s'adresse particulièrement à la SFIO et à d'autres forces de centre-gauche sceptiques quant aux engagements coloniaux sans fin. En présentant Hanoï comme un gouvernement national sérieux plutôt que comme une menace irréconciliable, les partisans français d'un règlement pourraient gagner une marge de manoeuvre.\n\nL'assistance ne serait pas sans risque. Cela pourrait exposer le gouvernement français à des accusations de faiblesse et donnerait au Vietnam une voix dans un débat intérieur sensible."
VIN_FORPOL.10.a: "Profitez de l'ouverture pour renforcer la confiance avec la gauche française."
VIN_FORPOL.10.b: "La France ne peut pas jouer sa politique intérieure sur Hanoï."

VIN_FORPOL.11.t: "Une porte s'ouvre à Paris"
VIN_FORPOL.11.d: "Le centre-gauche français a répondu favorablement à l'effort diplomatique. Les partisans d'une relation négociée avec le Vietnam soutiennent désormais que le contact avec Hanoï peut réduire l'instabilité, affaiblir les partisans de la ligne dure et préserver l'influence française par la coopération plutôt que par la coercition. Ce changement n'est pas décisif, mais il donne à la diplomatie vietnamienne une assise en France qui n'existait pas auparavant.\n\nLe canal reste informel et vulnérable aux renversements politiques. Pourtant, Hanoï a acquis la preuve que les anciennes relations coloniales ne sont plus le seul avenir imaginable."
VIN_FORPOL.11.a: "Cultivez soigneusement cette ouverture."

VIN_FORPOL.12.t: "La prudence française prévaut"
VIN_FORPOL.12.d: "Les responsables français ont refusé de prendre un engagement politique substantiel. Ils sont disposés à discuter, mais ne veulent pas risquer une controverse intérieure ou des frictions avec des partenaires étrangers au nom d'une nouvelle politique à l'égard du Vietnam. La voie diplomatique reste techniquement ouverte, mais elle n'a produit que des assurances polies.\n\nHanoï doit désormais supposer que la bonne volonté française, là où elle existe, restera limitée par les calculs français. Le Vietnam ne peut pas abandonner la diplomatie, mais il ne peut pas non plus permettre que sa stratégie à long terme dépende d'un changement d'avis incertain à Paris."
VIN_FORPOL.12.a: "Nous procéderons sans garanties françaises."

VIN_FORPOL.13.t: "La rivalité franco-américaine"
VIN_FORPOL.13.d: "Les diplomates vietnamiens ont discrètement suggéré que la France pourrait retrouver son influence en Asie en distinguant sa politique de celle des États-Unis. Le rôle croissant de Washington dans la région a déstabilisé de nombreux hommes politiques français, qui craignent que l'anticommunisme américain ne remplace le colonialisme français sans aborder la question nationale sous-jacente.\n\nLa proposition est tentante : la France pourrait se présenter comme une puissance européenne indépendante, capable de parler à Hanoï là où Washington ne le peut pas. Pourtant, exploiter délibérément cette rivalité compliquerait les relations avec un allié important et pourrait avoir des conséquences bien au-delà de l'Indochine."
VIN_FORPOL.13.a: "La France doit conserver un rôle indépendant en Asie."
VIN_FORPOL.13.b: "Ne faites pas du Vietnam un conflit avec Washington."

VIN_FORPOL.14.t: "Chambre entre Paris et Washington"
VIN_FORPOL.14.d: "La France a accepté la logique d'une approche indépendante. Sans rompre avec les États-Unis, les responsables français sont prêts à explorer des politiques à l'égard du Vietnam qui servent les intérêts français plutôt que de simplement renforcer une stratégie américaine. Hanoï a acquis une ouverture diplomatique utile : Paris a désormais des raisons de considérer la stabilité et l'autonomie vietnamiennes comme des atouts dans sa propre lutte pour l'influence internationale.\n\nL'opportunité nécessitera une gestion prudente. Le Vietnam doit bénéficier de l'indépendance française sans devenir dépendant de la rivalité française."
VIN_FORPOL.14.a: "Une contradiction utile est apparue."

VIN_FORPOL.15.t: "Pas de rupture avec Washington"
VIN_FORPOL.15.d: "Les responsables français ont conclu que les risques d'une contestation des États-Unis l'emportent sur les avantages possibles d'une politique vietnamienne plus indépendante. Les relations avec Hanoï se poursuivront, mais seulement dans des limites acceptables au regard des engagements plus larges de l'alliance française.\n\nLe résultat est décevant mais éclairant. Le Vietnam peut encore recourir à la médiation française lorsque les intérêts coïncident, mais la République ne doit pas s'attendre à ce que Paris défie Washington lorsque les enjeux deviennent sérieux."
VIN_FORPOL.15.a: "Prenez note et ajustez nos attentes."

# ------------------------------------------------------------
# Socialist-world and non-aligned outreach
# ------------------------------------------------------------

VIN_FORPOL.50.t: "Nos frères socialistes"
VIN_FORPOL.50.d: "Le monde socialiste offre au Vietnam à la fois solidarité et choix difficiles. L'Union soviétique, les démocraties populaires, la Yougoslavie et d'autres gouvernements révolutionnaires possèdent les ressources, les connaissances techniques et le poids diplomatique dont Hanoï a un besoin urgent. Dans le même temps, leurs désaccords démontrent que le socialisme n'est pas un bloc unique et simple.\n\nLe Vietnam doit établir des relations fraternelles sans permettre que son indépendance disparaisse au profit des priorités des États plus grands. La première étape est simple : faire comprendre que la République démocratique recherche des camarades et non des patrons."
VIN_FORPOL.50.a: "Tendez la main de la solidarité révolutionnaire."

VIN_FORPOL.51.t: "[GetNewspaperHeader]Hô Chi Minh visite le monde socialiste"
VIN_FORPOL.51.d: "Hô Chi Minh a entamé une tournée très médiatisée dans les États socialistes, rencontrant les dirigeants des partis, les délégations de travailleurs et les représentants des gouvernements qui ont suivi avec sympathie la lutte du Vietnam. Le voyage vise à garantir une reconnaissance diplomatique, une assistance économique et une place pour Hanoï au sein du réseau émergent des États révolutionnaires.\n\nLa visite revêt également une importance symbolique. Le Vietnam, longtemps traité par les autorités coloniales comme une possession lointaine, apparaît désormais sur la scène mondiale comme un acteur politique indépendant. Les observateurs de l'Est comme de l'Ouest surveilleront de près si la tournée lie fermement Hanoï au camp dirigé par les Soviétiques ou si elle démontre une approche vietnamienne plus flexible du socialisme international."
VIN_FORPOL.51.a: "Le Vietnam a des amis au-delà de ses frontières."

# ------------------------------------------------------------
# Laos
# ------------------------------------------------------------

VIN_FORPOL.100.t: "Un nouvel ordre en Indochine"
VIN_FORPOL.100.d: "L'avenir du Vietnam ne peut être séparé de celui de ses voisins. Le Laos et le Cambodge restent vulnérables aux pressions extérieures, aux rivalités internes et à l'héritage inachevé de la domination française. Hanoï doit décider si la meilleure manière d'assurer la sécurité passe par une coopération patiente, un soutien aux mouvements alliés ou la création d'un ordre politique plus unifié à travers l'Indochine.\n\nChaque cours comporte des risques. Une politique régionale pacifique pourrait laisser aux forces hostiles une marge de manoeuvre pour s'organiser, tandis qu'une stratégie plus affirmée pourrait raviver les craintes d'une domination vietnamienne. Le gouvernement doit établir un principe cohérent avant que les événements au Laos et au Cambodge ne lui en imposent un."
VIN_FORPOL.100.a: "L'avenir de l'Indochine ne peut être laissé à d'autres."

VIN_FORPOL.101.t: "Le pays du million d'éléphants"
VIN_FORPOL.101.d: "Le Laos occupe une position difficile entre le Vietnam, la Thaïlande, la Chine et les vestiges du système colonial français. Ses institutions politiques sont fragiles, ses factions armées divisées et sa géographie à la fois protectrice et vulnérable. Pour Hanoï, le Laos n'est pas simplement un voisin : c'est un couloir, un partenaire potentiel et un test pour savoir si la solidarité régionale peut survivre à des ambitions concurrentes.\n\nDeux approches sont désormais débattues. L'une cherche à renforcer une coalition pacifique capable de maintenir la neutralité et la stabilité du Laos. L'autre soutient que seule une force révolutionnaire disciplinée peut empêcher le pays de devenir une base d'intervention hostile."
VIN_FORPOL.101.a: "La question laotienne doit être abordée avec prudence."

VIN_FORPOL.102.t: "Médiation du conflit laotien"
VIN_FORPOL.102.d: "Les représentants vietnamiens et laotiens ont convenu d'ouvrir des négociations sur le conflit croissant entre les autorités royalistes et les forces communistes. Les négociations sont fragiles : chaque camp craint qu'un compromis ne donne simplement à son rival le temps de se regrouper, tandis que les puissances extérieures voient le Laos comme un prix stratégique.\n\nPourtant, l'alternative apparaît de plus en plus clairement. Sans arrangement politique, la violence locale pourrait se transformer en une guerre civile qui attirerait tous les États voisins. La première tâche consiste à créer suffisamment de confiance pour que les parties puissent parler."
VIN_FORPOL.102.a: "Le Vietnam parrainera un règlement politique."
VIN_FORPOL.102.b: "Le Laos participera aux négociations de bonne foi."

VIN_FORPOL.103.t: "Le communiqué Dong-Phouma"
VIN_FORPOL.103.d: "Après des discussions difficiles, les délégués vietnamiens et laotiens ont rédigé un communiqué appelant à une réduction des tensions, à des contacts entre forces politiques rivales et à un engagement commun pour empêcher le Laos de devenir un champ de bataille pour les puissances étrangères. Le document ne règle pas tous les différends, mais il fournit un langage grâce auquel les deux gouvernements peuvent revendiquer des progrès sans renoncer à leurs intérêts essentiels.\n\nHanoï doit maintenant décider s'il convient d'investir du capital politique dans l'accord. Son succès dépendra moins des paroles signées aujourd'hui que de la coopération pratique qui suivra demain."
VIN_FORPOL.103.a: "Approuvez le communiqué et développez-le."

VIN_FORPOL.104.t: "Le communiqué Dong-Phouma"
VIN_FORPOL.104.d: "Le communiqué proposé avec le Vietnam offre au Laos un chemin étroit pour s'éloigner d'un conflit ouvert. Il promet des contacts, de la retenue et une certaine reconnaissance régionale, mais il fait également craindre que le Laos ne devienne dépendant de la protection de Hanoï. Les partisans soutiennent que la coopération est la seule alternative réaliste à la guerre ; les critiques préviennent que toute concession pourrait affaiblir la souveraineté du pays.\n\nLe gouvernement laotien doit choisir s'il considère l'accord comme une garantie de son indépendance ou comme le début d'un dangereux enchevêtrement."
VIN_FORPOL.104.a: "Acceptez le communiqué comme fondement de la paix."

VIN_FORPOL.105.t: "Espoir de paix au Laos"
VIN_FORPOL.105.d: "Les premiers résultats des pourparlers laotiens sont encourageants. Les patrouilles conjointes et les assurances publiques ont réduit le risque immédiat d'escalade, tandis que les autorités locales rapportent que certaines communautés commencent à croire qu'un compromis est possible. Le règlement reste vulnérable aux perturbations, aux pressions étrangères et aux ambitions non résolues des factions armées.\n\nMais pour l'instant, le Vietnam a l'occasion de démontrer que l'influence régionale ne signifie pas toujours une intervention. Un Laos stable renforcerait la sécurité de Hanoï, améliorerait sa position internationale et offrirait un modèle différent pour l'avenir de l'Indochine."
VIN_FORPOL.105.a: "Donnez à la paix toutes les chances de s'enraciner."

VIN_FORPOL.106.t: "[GetNewspaperHeader]La guerre civile éclate au Laos"
VIN_FORPOL.106.d: "Le fragile équilibre politique du Laos s'est effondré dans une guerre ouverte. Les forces du Pathet Lao, renforcées par un soutien extérieur et des années de préparation clandestine, se sont soulevées contre le gouvernement royal. Des rapports provenant de tout le pays font état d'attaques contre des avant-postes, de défections des autorités locales et d'une militarisation rapide d'un conflit longtemps resté sous la surface.\n\nL'épidémie menace de transformer le Laos en le prochain champ de bataille majeur de l'Indochine. Les gouvernements voisins sont désormais confrontés à un choix difficile entre l'intervention, la médiation et le risque qu'une guerre civile locale s'inscrive dans une confrontation plus large de la Guerre froide."
VIN_FORPOL.106.a: "L'Indochine entre dans un nouveau chapitre dangereux."

# ------------------------------------------------------------
# Cambodia
# ------------------------------------------------------------

VIN_FORPOL.115.t: "Le pays d'Angkor"
VIN_FORPOL.115.d: "L'histoire, la monarchie et les traditions politiques du Cambodge le distinguent nettement du Vietnam, mais son avenir est lié au même ordre régional instable. Le prince Sihanouk cherche une marge de manoeuvre entre des puissances concurrentes, tandis que les gauchistes khmers, les royalistes, les nationalistes et les intérêts étrangers luttent tous pour définir l'orientation du pays.\n\nHanoï fait face à un choix difficile. Elle peut rechercher une entente prudente avec Phnom Penh et accepter la neutralité cambodgienne, ou elle peut cultiver des forces révolutionnaires disposées à remodeler le pays de l'intérieur. La décision influencera non seulement le Cambodge, mais aussi la crédibilité de la revendication du Vietnam de soutenir une Indochine indépendante."
VIN_FORPOL.115.a: "Le Cambodge exige une politique qui lui est propre."

VIN_FORPOL.116.t: "[GetNewspaperHeader]Khmer Krahom proclame sa révolution"
VIN_FORPOL.116.d: "Un mouvement révolutionnaire khmer a ouvertement déclaré sa rupture avec le gouvernement cambodgien. Des unités armées sont apparues dans plusieurs provinces, appelant à la destruction de l'autorité royaliste et réactionnaire et proclamant une nouvelle lutte de libération nationale et sociale. L'émergence rapide du mouvement fait suite à une période d'agitation politique, d'organisation clandestine et d'hostilité croissante envers Phnom Penh.\n\nLa déclaration menace de plonger le Cambodge dans la guerre civile. Pour le Vietnam, la Thaïlande et les grandes puissances, le conflit soulève des questions immédiates sur les frontières, l'insurrection et le futur équilibre d'influence en Indochine."
VIN_FORPOL.116.a: "Un autre front s'est ouvert en Indochine."

# ------------------------------------------------------------
# Communist victory in China
# ------------------------------------------------------------

VIN_FORPOL.500.t: "Un soleil rouge sur la Chine"
VIN_FORPOL.500.d: "La victoire des communistes chinois a transformé la carte stratégique de l'Asie. Pour la première fois, le Vietnam partage une frontière avec un vaste État révolutionnaire dont les dirigeants parlent ouvertement d'anti-impérialisme, de libération nationale et de reconstruction socialiste. Le triomphe de la Chine offre de l'espoir aux mouvements révolutionnaires à travers le continent, mais il amène également un nouveau voisin puissant dont les intérêts façonneront inévitablement l'avenir du Vietnam.\n\nHanoï doit accueillir chaleureusement le nouveau gouvernement tout en préservant sa propre indépendance. La relation avec Pékin pourrait devenir le fondement de la solidarité asiatique - ou une source de pressions auxquelles le Vietnam n'est pas encore assez fort pour résister."
VIN_FORPOL.500.a: "Envoyez nos félicitations à Pékin."

VIN_FORPOL.501.t: "La proposition frontalière du Vietnam"
VIN_FORPOL.501.d: "Le Vietnam a demandé au nouveau gouvernement chinois de reconnaître les principes associés à la Convention Gérard de 1895 comme base pratique pour la gestion de la frontière sino-vietnamienne. Hanoï affirme qu'une compréhension claire dès maintenant pourrait empêcher de futurs différends d'empoisonner les relations entre deux États révolutionnaires.\n\nLa proposition est politiquement sensible. L'accepter rassurerait le Vietnam et démontrerait une retenue révolutionnaire, mais cela pourrait aussi être considéré comme une reconnaissance de revendications historiques avant que la nouvelle République populaire n'ait pleinement consolidé son autorité."
VIN_FORPOL.501.a: "Honorez la convention et assurez l'amitié du Vietnam."
VIN_FORPOL.501.b: "La question des frontières ne peut pas être réglée aussi facilement."

VIN_FORPOL.502.t: "Pékin soutient la Convention"
VIN_FORPOL.502.d: "Pékin a accepté la proposition du Vietnam d'utiliser la Convention Gérard de 1895 comme base pour gérer la frontière commune. La décision ne règle pas toutes les questions locales, mais elle élimine une source immédiate de friction et donne à Hanoï l'assurance précieuse que le nouveau gouvernement chinois recherche le partenariat plutôt que la domination.\n\nL'accord sera bien accueilli par ceux qui croient que la solidarité socialiste peut surmonter l'héritage des frontières impériales. Sa pérennité dépendra toutefois de la question de savoir si les deux gouvernements continueront à se traiter sur un pied d'égalité."
VIN_FORPOL.502.a: "Une frontière ferme crée une camaraderie plus forte."

VIN_FORPOL.503.t: "Pékin rejette la Convention"
VIN_FORPOL.503.d: "Le gouvernement chinois a refusé d'approuver le cadre frontalier proposé par le Vietnam. Pékin insiste sur le fait que la question frontalière nécessite un examen plus approfondi et ne peut être résolue par un accord hérité de l'ère de la diplomatie coloniale. La réponse n'est pas ouvertement hostile, mais elle rappelle que l'amitié révolutionnaire n'efface pas les intérêts nationaux.\n\nHanoï doit désormais procéder avec prudence. La relation avec la Chine reste vitale, mais le Vietnam ne peut pas permettre que l'incertitude le long de sa frontière nord devienne un instrument de pression permanent."
VIN_FORPOL.503.a: "Ne transformez pas un désaccord en rupture."

VIN_FORPOL.504.t: "Entre Moscou et Pékin"
VIN_FORPOL.504.d: "Les différences entre l'Union soviétique et la Chine sont de plus en plus difficiles à dissimuler. Ce qui a commencé comme des conflits sur la tactique, l'aide et le rythme de la révolution menace désormais de diviser le monde socialiste en centres d'autorité rivaux. Le Vietnam est profondément exposé : les deux puissances sont des partenaires essentiels, et un choix entre elles pourrait remodeler tous les aspects de la politique étrangère de la République.\n\nHanoï a l'opportunité de se proposer comme intermédiaire, mais la médiation ne peut que retarder un conflit trop important pour que le Vietnam puisse le résoudre. Les dirigeants doivent décider s'ils doivent investir leur prestige dans la préservation de l'unité."
VIN_FORPOL.504.a: "Offrez Hanoï comme pont entre les deux capitales."

VIN_FORPOL.505.t: "Un avenir inquiétant pour la révolution mondiale"
VIN_FORPOL.505.d: "La tentative de médiation a révélé la profondeur de la fracture sino-soviétique. Moscou et Pékin attendent de leurs amis qu'ils fassent preuve de loyauté, et tous deux considèrent la neutralité avec méfiance. Les dirigeants vietnamiens comprennent qu'il ne s'agit pas simplement d'un différend entre capitales lointaines : l'aide, le soutien militaire, le commerce et l'avenir de la révolution asiatique peuvent tous dépendre de la position adoptée par Hanoï.\n\nLa République doit décider si elle doit se rapprocher de Moscou, s'aligner sur Pékin ou insister sur une ligne vietnamienne distincte, malgré le risque d'offenser les deux."
VIN_FORPOL.505.a: "L'Union soviétique reste le point d'ancrage du socialisme."
VIN_FORPOL.505.b: "La révolution asiatique doit se tourner vers Pékin."
VIN_FORPOL.505.c: "Le Vietnam préservera une ligne révolutionnaire indépendante."

# ------------------------------------------------------------
# Nationalist victory in China
# ------------------------------------------------------------

VIN_FORPOL.550.t: "Un soleil blanc sur la Chine"
VIN_FORPOL.550.d: "Les nationalistes chinois ont pris le dessus, laissant le Vietnam dans un environnement stratégique étonnamment hostile. La frontière nord est désormais contrôlée par un gouvernement profondément méfiant à l'égard des mouvements communistes et étroitement lié aux forces anticommunistes de toute l'Asie. Les cadres révolutionnaires fuyant la Chine pourraient chercher refuge au Vietnam, tandis que le gouvernement de Chiang Kai-shek exigera probablement une coopération contre ce qu'il considère comme une menace insurrectionnelle régionale.\n\nHanoï ne peut ignorer la réalité de la nouvelle Chine. La République doit soit chercher un compromis pragmatique avec Nanjing, soit se préparer à devenir un refuge et une base pour la révolution chinoise qui a été vaincue de l'autre côté de la frontière."
VIN_FORPOL.550.a: "L'horizon nord s'est assombri."

VIN_FORPOL.551.t: "Survie grâce à la diplomatie"
VIN_FORPOL.551.d: "Avec une Chine nationaliste à sa frontière, le Vietnam ne peut pas se permettre des gestes qui invitent à une confrontation immédiate. Certains dirigeants affirment que la République doit faire preuve de retenue, ouvrir des canaux vers Nanjing et chercher à coexister avec le gouvernement chinois qui détient le pouvoir. Une telle politique est peut-être inconfortable sur le plan idéologique, mais elle pourrait permettre au Vietnam de gagner du temps pour se consolider et éviter une guerre qu'il ne peut pas encore gagner.\n\nL'alternative est d'adopter le défi révolutionnaire et d'accepter que la frontière puisse devenir la ligne de front d'un conflit asiatique plus vaste."
VIN_FORPOL.551.a: "Assurer la survie du Vietnam avant de poursuivre des objectifs plus ambitieux."

VIN_FORPOL.552.t: "La chaîne Lu Han"
VIN_FORPOL.552.d: "Les contacts associés à Lu Han ont indiqué qu'une voie plus calme vers la politique chinoise pourrait être possible. Les personnalités régionales du Yunnan comprennent l'importance pratique d'un commerce stable, de frontières sécurisées et d'éviter une confrontation permanente entre Hanoï et Nanjing. Ils ne partagent peut-être pas l'idéologie vietnamienne, mais ils ont des raisons de résister aux politiques qui transforment la frontière en zone militaire.\n\nCe canal ne peut pas remplacer la diplomatie formelle, mais il peut offrir à Hanoï une source d'informations utile et un moyen de tester la flexibilité du gouvernement nationaliste."
VIN_FORPOL.552.a: "Maintenez la chaîne et écoutez attentivement."

VIN_FORPOL.553.t: "La Conférence de Kunming"
VIN_FORPOL.553.d: "Après des mois de contacts indirects, les représentants vietnamiens et chinois sont prêts à se rencontrer à Kunming. Hanoï cherchera un cadre de coexistence : la fin de l'hostilité secrète, le respect des frontières, un commerce réglementé et la compréhension que le système interne du Vietnam ne sera pas utilisé comme prétexte pour une intervention.\n\nLa conférence est un pari. Un accord réussi pourrait stabiliser la frontière nord et donner au Vietnam une marge de reconstruction. Un échec confirmerait que le gouvernement nationaliste ne voit pas la place d'un Vietnam socialiste dans son ordre régional."
VIN_FORPOL.553.a: "Envoyez la délégation à Kunming."

VIN_FORPOL.554.t: "L'offre vietnamienne à Kunming"
VIN_FORPOL.554.d: "La délégation vietnamienne a proposé un accord de coexistence global : non-ingérence mutuelle, garanties aux frontières, commerce réglementé et fin du soutien aux factions politiques hostiles. Cette proposition ne ferait pas de Hanoï un allié, mais elle pourrait empêcher que la frontière ne devienne une source permanente de crise.\n\nAccepter cette offre signifierait reconnaître la pérennité du régime vietnamien. Le rejeter permettrait de préserver la clarté idéologique et l'influence politique, mais au prix d'une instabilité persistante dans le sud."
VIN_FORPOL.554.a: "Acceptez la coexistence ; La Chine a déjà suffisamment d'ennemis."
VIN_FORPOL.554.b: "Rejeter la proposition ; On ne peut pas faire confiance à Hanoï."

VIN_FORPOL.555.t: "Kunming réussit"
VIN_FORPOL.555.d: "La Conférence de Kunming a abouti à un accord. Le Vietnam et la Chine nationaliste ont accepté un cadre de coexistence mutuelle, comprenant un accord sur les frontières, le commerce et la non-ingérence politique. Aucune des deux parties n'a abandonné son idéologie, mais toutes deux ont reconnu qu'une crise permanente ne servirait que les puissances extérieures et les extrémistes régionaux.\n\nL'accord donne à Hanoï un répit que peu de gens croyaient possible après la victoire nationaliste en Chine. La République peut désormais poursuivre sa reconstruction et sa diplomatie sans craindre dans l'immédiat que sa frontière nord ne s'enflamme."
VIN_FORPOL.555.a: "Une paix difficile reste une paix."

VIN_FORPOL.556.t: "Kunming échoue"
VIN_FORPOL.556.d: "La Conférence de Kunming s'est terminée sans accord. Les délégués chinois ont rejeté les conditions de Hanoï et la délégation vietnamienne a conclu que de nouvelles concessions équivaudraient à une soumission politique. Cet échec laisse les deux gouvernements méfiants, armés et de plus en plus préparés à la possibilité que le conflit frontalier se transforme en une confrontation plus large.\n\nLa diplomatie n'est pas épuisée pour toujours, mais la perspective immédiate de coexistence s'est effondrée. Le Vietnam doit se préparer à un ordre régional plus dur."
VIN_FORPOL.556.a: "Ensuite, nous devons nous préparer aux conséquences."

VIN_FORPOL.557.t: "[GetNewspaperHeader]Un gouvernement de coalition réforme à Hanoï"
VIN_FORPOL.557.d: "Les dirigeants politiques vietnamiens ont annoncé la réforme du Chinh phu lien hiep, une large coalition nationale destinée à rassembler les forces nationalistes, socialistes et patriotiques dans un cadre politique commun. Cette initiative fait suite à des mois de négociations avec des groupes qui se tenaient auparavant en dehors du mouvement révolutionnaire dominant.\n\nLes partisans décrivent la coalition comme une réponse pratique au nouvel équilibre des pouvoirs en Asie : le Vietnam doit faire preuve d'unité nationale s'il veut négocier avec des voisins plus forts et résister aux pressions extérieures. Les critiques se demandent si cet arrangement pourra survivre aux divisions idéologiques qu'il est censé combler. Néanmoins, cette annonce marque un effort important pour redéfinir le caractère politique de l'État vietnamien."
VIN_FORPOL.557.a: "Hanoï cherche l'unité à une époque dangereuse."

# ------------------------------------------------------------
# Socialist resistance after Nationalist victory in China
# ------------------------------------------------------------

VIN_FORPOL.600.t: "La révolution ne s'arrêtera pas aux frontières"
VIN_FORPOL.600.d: "La défaite des communistes chinois a convaincu de nombreuses personnes à Hanoï qu'un compromis avec le gouvernement nationaliste ne ferait que retarder une lutte plus vaste. Des réfugiés, d'anciens officiers de l'APL et des cadres clandestins cherchent déjà à entrer en contact avec le Vietnam. Ils affirment que la révolution chinoise a été vaincue, et non détruite, et que les montagnes et les frontières de l'Asie du Sud-Est peuvent devenir la base à partir de laquelle elle se renouvellera.\n\nChoisir cette voie placerait le Vietnam en opposition directe avec Nanjing et exposerait la République à un énorme danger. Pourtant, ses partisans insistent sur le fait que l'abandon de la révolution asiatique laisserait le Vietnam isolé dans une région de plus en plus dominée par les puissances anticommunistes."
VIN_FORPOL.600.a: "Hanoï restera une citadelle de la révolution asiatique."

VIN_FORPOL.601.t: "Une tempête à venir pour la Chine"
VIN_FORPOL.601.d: "La création d'un Front de libération asiatique a transformé des réseaux de résistance dispersés en un projet politique et militaire plus délibéré. Les exilés révolutionnaires chinois, les organisateurs vietnamiens et les mouvements alliés parlent désormais ouvertement d'une future lutte contre le gouvernement nationaliste. Les défenses frontalières sont étudiées, les routes d'approvisionnement élargies et la propagande politique préparée pour circuler à l'intérieur de la Chine.\n\nAucune guerre immédiate n'a été déclarée, mais le sens de ces préparatifs est indubitable. Le Vietnam ne se contente plus de défendre son indépendance ; elle devient l'arrière-plan d'une nouvelle lutte pour l'avenir de la Chine et de l'Asie."
VIN_FORPOL.601.a: "Préparez-vous à la tempête à venir."

# === Military Doctrine Event Chain (merged from VIN_MIL_l_english.yml) ===
VIN_MIL.0.t: "Le concept de guerre populaire"
VIN_MIL.0.d: "La lutte pour la libération du Vietnam ne peut être gagnée par les seules armées. Sous la houlette de l'Oncle Ho et du Parti, une doctrine née de la résistance au colonialisme a pris forme : la Guerre Populaire.\n\nContrairement à la guerre conventionnelle, la guerre populaire mobilise la nation entière sur un seul front. Les soldats combattent sur les champs de bataille, les ouvriers travaillent dans les usines, les agriculteurs entretiennent les campagnes, les enseignants éduquent les jeunes et les cadres organisent les villages. Chaque hameau devient une forteresse, chaque province un champ de bataille et chaque citoyen un participant à la lutte révolutionnaire.\n\nLa victoire ne sera pas obtenue par les seuls moyens militaires. La guerre doit être menée sur les fronts militaire, politique, économique, culturel, idéologique et diplomatique. La lutte armée est indissociable de la mobilisation politique, tandis que la production et l'éducation sont elles-mêmes des formes de résistance.\n\nAu centre de cette stratégie se trouvent les Forces armées populaires : l'Armée populaire, les Forces populaires de sécurité publique et la Milice d'autodéfense. Ensemble, ils forment l'épine dorsale d'une résistance nationale capable d'affronter un ennemi bien plus puissant en ressources matérielles."
VIN_MIL.0.a: "Celui qui a une arme à feu, utilise une arme à feu. Celui qui a une épée, utilise une épée. S'il n'y a pas d'épée, utilisez des houes, des pelles et des bâtons."
VIN_MIL.1.t_prc: "Le retour des camarades formés en Chine"
VIN_MIL.1.d_prc: "Après la victoire des communistes chinois et l'établissement de la République populaire de Chine, la frontière nord est passée d'une frontière dangereuse à une porte de coopération révolutionnaire. Au cours de l'année écoulée, des centaines de cadres, officiers et soldats vietnamiens se sont entraînés dans les camps de Wenshan, Longzhou, Jingxi et Simao sous la direction d'instructeurs chinois expérimentés.\n\nAujourd'hui, les premiers gros contingents de ces camarades formés en Chine sont rentrés au Vietnam. Ils apportent des connaissances sur les opérations des grandes unités, la logistique, la coordination de l'artillerie, l'ingénierie, les communications et l'organisation politique. A leurs côtés arrivent des armes, des munitions, des radios, du matériel médical et des véhicules militaires acheminés par les nouvelles routes d'approvisionnement reliant le sud de la Chine au Viet Bac.\n\nLe général Vo Nguyen Giap a accueilli le retour des cadres comme le fondement d'une armée populaire capable d'affronter les forces coloniales sur un pied d'égalité. L'état-major général a commencé à les affecter à des formations régulières à travers le pays, avec une attention particulière accordée au développement continu de la 308e Division, la première division d'infanterie complète de l'Armée populaire."
VIN_MIL.1.a_prc: "L'Est est rouge."
VIN_MIL.1.t_chi: "Le retour des exilés révolutionnaires"
VIN_MIL.1.d_chi: "La victoire nationaliste dans la guerre civile chinoise a remodelé le paysage politique asiatique d'une manière inattendue. Les cadres communistes, les vétérans de l'Armée populaire de libération, les organisateurs syndicaux et les intellectuels révolutionnaires ont été chassés du continent par les forces de sécurité du Kuomintang. Privés de refuge dans une grande partie de l'Asie de l'Est, beaucoup ont cherché refuge dans les montagnes et les régions frontalières du nord du Vietnam.\n\nCes derniers mois, des flux de révolutionnaires chinois ont envahi le Viet Bac. Parmi eux figurent des commandants de guérilla, des commissaires politiques, des ingénieurs, des médecins, des enseignants et des vétérans endurcis par des années de guerre civile. Bien que vaincus en Chine, ils restent engagés dans la lutte contre l'impérialisme et la réaction.\n\nLe président Hô Chi Minh a autorisé des groupes internationaux de formation de volontaires à intégrer ces exilés dans la résistance vietnamienne. Leurs instructeurs formeront les unités vietnamiennes aux tactiques d'infanterie modernes, à la logistique, aux communications, au renseignement et à l'organisation politique, tandis que des réseaux clandestins à travers le sud de la Chine commenceront à déplacer des armes, des médicaments, du matériel d'impression et des volontaires à travers des cols de montagne isolés."
VIN_MIL.1.a_chi: "Le Vietnam et la Chine sont frères dans la révolution."
VIN_MIL.1.t_fallback: "Le retour des camarades du Nord"
VIN_MIL.1.d_fallback: "Des vétérans, des techniciens et des cadres révolutionnaires venus d'au-delà de la frontière nord du Vietnam ont commencé à arriver au Viet Bac. Leur expérience en matière d'organisation, de communications, de logistique et de guerre moderne renforcera l'Armée populaire à mesure qu'elle grandira d'une force de guérilla à une armée nationale de libération.\n\nLe sort exact de la Chine reste incertain, mais la révolution ne peut pas se permettre de gaspiller l'expertise de ceux qui sont prêts à poursuivre la lutte au Vietnam."
VIN_MIL.1.a_fallback: "Chaque camarade renforce la résistance."
VIN_MIL.2.t: "La fondation du Quan Y Vien"
VIN_MIL.2.d: "Alors que la guerre contre le colonialisme français entre dans une phase plus exigeante, la République démocratique du Vietnam a annoncé la création de la Quan Y Vien, l'Académie de médecine militaire. Il s'agit de la première institution dédiée à la formation de médecins militaires, de chirurgiens, de pharmaciens et de cadres médicaux de l'Armée populaire.\n\nOuverte à Doi Tram dans la province de Vinh Phuc, l'académie préparera le personnel médical aux conditions de la guerre dans la jungle, des campagnes en montagne et des hôpitaux de campagne improvisés. Depuis le début de la résistance, des milliers de soldats blessés dépendent d'infirmières volontaires, de médecins civils et de postes médicaux de fortune. Leur courage a sauvé de nombreuses vies, mais l'ampleur croissante de la guerre a rendu indispensable un service médical militaire professionnel.\n\nDans un message prononcé lors de la cérémonie d'ouverture, le président Hô Chi Minh a salué les futurs médecins de la révolution et leur a rappelé que la lutte pour l'indépendance dépend autant de ceux qui préservent la vie que de ceux qui prennent les armes."
VIN_MIL.2.a: "Guérir les blessés, c'est renforcer la résistance. Sauver un soldat, c'est ramener un fusil sur le champ de bataille."
VIN_MIL.3.t: "Sac longe donc 17/SL"
VIN_MIL.3.d: "Par décret du Président de la République démocratique du Vietnam, le ministère de la Défense nationale a établi un nouveau système de régions militaires : Viet Bac, Tay Bac, Dong Bac, Ta Ngan, Huu Ngan et la région militaire 4.\n\nChaque commandement régional assumera la responsabilité de la défense nationale sur le territoire qui lui est assigné. Ses commandants doivent organiser la défense locale, diriger les unités gardant les côtes, les frontières et les lignes de démarcation, commander les forces armées des provinces et des districts et coordonner les travaux de milice, de mobilisation et de démobilisation avec les autorités civiles.\n\nLe décret remplace toutes les réglementations antérieures contraires à la nouvelle organisation. Dans une guerre menée à travers les montagnes, les deltas et les zones libérées dispersées, la République a besoin de commandements capables d'unir les opérations militaires avec le travail du gouvernement local et du peuple."
VIN_MIL.3.a: "Signé."
VIN_MIL.4.t: "Mise en oeuvre des suggestions du général Giap"
VIN_MIL.4.d: "Alors que la résistance contre le colonialisme français entre dans une étape décisive, la Commission militaire centrale a approuvé les réformes proposées par le général Vo Nguyen Giap. Leur objectif est de transformer l'Armée populaire d'un ensemble de bandes de guérilla régionales en une force révolutionnaire coordonnée capable de vaincre un ennemi technologiquement supérieur.\n\nLes réformes s'appuient sur la doctrine de la guerre populaire. Parce que la République Démocratique n'a pas la capacité industrielle, les armes lourdes et les ressources financières de la France, la victoire doit reposer sur la détermination politique, la mobilité, le soutien populaire et une stratégie supérieure plutôt que sur la seule force matérielle.\n\nL'État-Major a adopté le principe de Compagnie Indépendante, Bataillon Concentré. Les entreprises locales harcèleront les positions ennemies, rassembleront des renseignements, protégeront les administrations révolutionnaires et perturberont les communications entre les villages et les provinces. Les bataillons et les formations plus importantes seront concentrés lorsque les conditions permettront de détruire les unités ennemies isolées grâce à une supériorité locale écrasante.\n\nL'éducation politique se développera également dans l'ensemble des forces armées. Chaque soldat doit comprendre non seulement comment se battre, mais aussi pourquoi il se bat."
VIN_MIL.4.a: "Si l'ennemi avance, nous nous retirons. S'il est isolé, nous frappons. S'il est faible, nous le détruisons."
VIN_MIL.5.t: "Le Bureau de recherche de l'Armée de l'Air est créé"
VIN_MIL.5.d: "Bien qu'il ne possède aucune force aérienne opérationnelle, le ministère de la Défense nationale a créé un bureau de recherche sur l'armée de l'air relevant de l'état-major général de l'armée nationale et de la milice vietnamienne. Cette décision reflète la détermination des dirigeants à préparer le développement futur de l'aviation militaire et à remettre un jour en question la suprématie aérienne française sur le Vietnam.\n\nLe bureau trouve ses origines dans deux avions civils donnés à la République démocratique après la Révolution d'août : un avion d'entraînement de Havilland Tiger Moth et un Morane-Saulnier MS.343, anciennement propriété de Bao-Dai. Après le déclenchement de la résistance nationale, les deux avions ont été démantelés et déplacés par des itinéraires dangereux vers la zone de résistance du Viet Bac. Les avions français ont attaqué les convois à plusieurs reprises, mais les ingénieurs révolutionnaires ont conservé de nombreux composants pour des études ultérieures.\n\nHa Dong, ancien secrétaire du vice-ministre de la Défense nationale Ta Quang Buu, a été nommé à la tête du bureau. Il sera assisté de techniciens, mécaniciens et passionnés d'aviation dont Nguyen Van Dong, Nguyen Duc Viet et Nguyen Tam Trinh."
VIN_MIL.5.a: "Nous défendrons le ciel de la patrie."
VIN_MIL.6.t: "Le Comité de recherche navale est créé"
VIN_MIL.6.d: "Le commandement général de l'Armée nationale et de la milice vietnamienne a créé le Comité de recherche navale relevant de l'état-major général, marquant la première étape majeure vers la reconstruction d'une force navale révolutionnaire après des années de guerre et de difficultés.\n\nCette décision ravive une vision poursuivie pour la première fois en 1946, lorsque le gouvernement a créé une agence navale chargée d'organiser les forces de défense côtière et de patrouille maritime pour la jeune République. Ces efforts ont été interrompus par le déclenchement d'une guerre à grande échelle. Alors que les forces françaises avançaient le long de la côte et des principales voies navigables, les navires et équipements militaires furent sabordés ou démantelés pour empêcher leur capture.\n\nAujourd'hui, le Parti et les forces armées ont décidé que le Vietnam devait se préparer à défendre non seulement ses montagnes et ses jungles, mais aussi ses rivières, ses côtes et ses eaux territoriales. Le siège du comité sera situé rue Gian, le long de la rivière Chay, dans le district de Doan Hung, province de Phu Tho. Nguyen Van Khuong a été nommé président du comité, assisté du commissaire politique Nguyen Viet et du vice-président Tran Dinh Vong.\n\nSes sections spécialisées couvriront les opérations maritimes, les communications maritimes et le génie électrique et maritime."
VIN_MIL.6.a: "Les îles sont nos maisons ; les océans sont notre patrie."
VIN_MIL.7.t: "Les forces populaires de sécurité publique"
VIN_MIL.7.d: "Le décret n° 23/SL, signé par le président Hô Chi Minh le 21 février 1946, a officiellement créé la Force populaire de sécurité publique - Cong An - en tant qu'organisation unifiée de sécurité nationale chargée de défendre la République démocratique du Vietnam contre l'espionnage, le sabotage, le banditisme et les activités contre-révolutionnaires.\n\nLa nouvelle force consolide les organisations de sécurité apparues au cours de la lutte révolutionnaire : les départements de sécurité au nord, les départements de renseignement au centre du Vietnam et les Forces nationales d'autodéfense opérant dans le sud. Ils opéreront désormais sous une structure de commandement unique dirigée par le Département de la sécurité publique vietnamienne au sein du ministère de l'Intérieur. Le révolutionnaire vétéran Le Gian a été nommé son premier directeur.\n\nLes dirigeants du parti soulignent que cette force n'est pas une création entièrement nouvelle. Il perpétue une tradition clandestine d'équipes d'autodéfense rouges, d'unités d'autodéfense ouvrières et paysannes, d'équipes de garde d'honneur et de détachements de sécurité du Viet Minh qui protégeaient les cadres, gardaient les installations du Parti, dénonçaient les agents ennemis et défendaient les zones libérées pendant les années de répression coloniale."
VIN_MIL.7.a: "Protégez la sécurité de la patrie."
VIN_MIL.8.t: "Sac long pour 121/SL"
VIN_MIL.8.d: "Par décret du Président, l'organisation de l'état-major de l'Armée nationale vietnamienne et de la milice a été clarifiée et élargie. L'état-major général, le département politique général, le département des approvisionnements généraux, l'équipe d'inspection et le bureau du commandant en chef assisteront ensemble le commandant en chef dans la direction de la guerre.\n\nL'état-major général organisera l'armée et la milice et dirigera les opérations de combat à travers ses départements des opérations, du renseignement militaire, de la formation militaire, de la milice et des communications. Elle sera dirigée par un chef d'état-major, assisté d'un ou deux adjoints. Le chef est autorisé à diriger les départements du génie et de l'artillerie et à superviser l'établissement des insignes militaires.\n\nLe Département politique général aidera le commandant en chef à maintenir la direction politique dans l'ensemble des forces armées. En reliant les opérations, le renseignement, la formation, l'approvisionnement et le travail politique sous une structure plus claire, le décret donne à la République un système de commandement adapté à une armée populaire en pleine croissance."
VIN_MIL.8.a: "L'état-major dirigera la guerre."
VIN_MIL.9.t: "Le Tong Quan Uy est rétabli"
VIN_MIL.9.d: "Le Comité central du Parti des travailleurs du Vietnam a annoncé le rétablissement de la Commission militaire générale, Tong Quan Uy, rétablissant ainsi l'organe suprême de direction militaire du Parti sur l'Armée populaire et les forces armées de la République démocratique du Vietnam.\n\nCette décision intervient alors que la résistance entre dans une nouvelle étape, plus exigeante. L'Armée populaire est passée de détachements de guérilla dispersés à une force révolutionnaire capable de mener des opérations à grande échelle à travers le pays. Les dirigeants des partis ont conclu qu'un leadership politique et une coordination plus forts sont nécessaires pour guider les forces armées en expansion dans les années à venir.\n\nLa Commission militaire générale formulera la stratégie militaire, la politique de défense nationale, les programmes de développement des forces et les plans pour la construction future des forces armées. Il assurera la direction directe et globale du Parti dans les affaires militaires. Bien que la Commission trouve ses racines dans les premiers jours de la révolution, sa restauration reflète l'ampleur et la complexité de la guerre actuellement menée."
VIN_MIL.9.a: "Victorieux à la fois en guerre et en esprit."
VIN_MIL.10.t: "Le Bureau de renseignement de Cuc Quan Bao est créé"
VIN_MIL.10.d: "Le ministère de la Défense nationale et le commandement général de l'armée nationale vietnamienne ont annoncé la création du Cuc Quan Bao, le Bureau du renseignement militaire. La nouvelle institution centralisera les travaux de renseignement militaire, de reconnaissance et de contre-infiltration en soutien direct aux forces armées révolutionnaires.\n\nSes racines remontent au Département du renseignement militaire créé après la révolution d'août le 25 octobre 1945 sous la direction de Hoang Minh Dao, également connu sous le nom de Dao Phuc Loc. Depuis le début de la guerre avec la France, les commandants ont appris à maintes reprises qu'une information opportune peut accomplir ce que ne peuvent pas accomplir des effectifs et des armes supérieurs.\n\nLe Bureau regroupera les éléments de reconnaissance et de renseignement en une organisation professionnelle subordonnée au commandement général. Ses missions consistent notamment à surveiller les mouvements des troupes françaises, à évaluer les forces amies, à infiltrer les réseaux administratifs ennemis, à mener des opérations de contre-espionnage et à fournir aux commandants des rapports précis sur le champ de bataille. Dans une lutte contre un ennemi matériellement plus fort, le renseignement n'est pas une tâche auxiliaire ; c'est une arme de la révolution."
VIN_MIL.10.a: "Courage et fidélité sans faille."
VIN_MIL.11.t: "Longueur du sac donc 50/SL"
VIN_MIL.11.d: "Le président Hô Chi Minh a publié le décret n° 50/SL, clarifiant les responsabilités du ministère de la Défense nationale et du commandant en chef de l'armée nationale et de la milice vietnamienne.\n\nLe ministère est chargé d'organiser et d'administrer l'armée et les agences de défense nationale, ainsi que de diriger la production de défense nationale. Le commandant en chef conserve la responsabilité du commandement de l'armée et de la milice, utilisant l'état-major général et les départements associés pour diriger les opérations, les déploiements et l'utilisation de la production militaire.\n\nLe décret établit également la structure d'appui nécessaire à un ministère de guerre moderne : bureaux et services administratifs assistant directement le ministre, services spécialisés de production, état-major et services de commandement, ainsi qu'une équipe d'inspection dirigée par un inspecteur en chef sous l'autorité du commandant en chef.\n\nLa lutte armée de la République ne peut plus dépendre uniquement d'arrangements improvisés. Les institutions de guerre doivent désormais être construites avec le même sérieux que les forces qui la combattent."
VIN_MIL.11.a: "Signé."

# === South Vietnam War Event Chain (merged from SWF_VIN_l_english.yml) ===
# ------------------------------------------------------------------
# National resistance
# ------------------------------------------------------------------

SWF_VIN.0.t: "La Résistance nationale"
SWF_VIN.0.d: "La lutte pour l'indépendance est entrée dans une phase nouvelle et plus exigeante. Dans tout le pays, la République démocratique appelle les travailleurs, les paysans, les étudiants, les fonctionnaires et les soldats à considérer la défense de la nation comme une responsabilité commune. L'ennemi possède peut-être des armes plus lourdes, des ressources plus vastes et un soutien étranger, mais le Vietnam possède la détermination d'un peuple défendant sa propre terre.\n\nLe Parti et le gouvernement ont donc proclamé une résistance globale. Les villages organiseront l'autodéfense, les usines soutiendront le front et les cadres lieront les opérations militaires au travail politique. Le conflit ne sera pas résolu en une seule bataille, mais par l'endurance, l'organisation et le refus d'abandonner l'avenir de la nation."
SWF_VIN.0.a: "Tout cela pour la résistance ; tout pour la victoire."

# ------------------------------------------------------------------
# PRC victory: Moscow and Beijing
# ------------------------------------------------------------------

SWF_VIN.1.t: "Une délégation vietnamienne à Moscou"
SWF_VIN.1.d: "Les représentants de la République démocratique du Vietnam sont arrivés à Moscou après un voyage à travers le paysage politique asiatique nouvellement transformé. Leur délégation recherche la reconnaissance, l'assistance matérielle et une place claire pour le Vietnam dans la lutte plus large contre le colonialisme.\n\nUne décision soviétique aura des conséquences bien au-delà de l'Indochine. Une reconnaissance ouverte renforcerait la résistance vietnamienne et signalerait que Moscou est prête à contester l'influence occidentale en Asie du Sud-Est. La prudence pourrait toutefois préserver la flexibilité diplomatique à un moment où la nouvelle révolution chinoise a déjà modifié l'équilibre des pouvoirs le long de la frontière asiatique."
SWF_VIN.1.a: "Reconnaissez la révolution vietnamienne."
SWF_VIN.1.b: "Offrez votre sympathie, mais évitez tout engagement formel."

SWF_VIN.2.t: "Hô Chi Minh regarde vers le nord"
SWF_VIN.2.d: "Une délégation vietnamienne est arrivée à Pékin pour chercher la reconnaissance et le soutien de la République populaire. Le triomphe de la révolution chinoise a transformé la frontière d'une barrière en une artère potentielle de coopération, reliant la résistance du Viet Bac à un vaste État révolutionnaire au nord.\n\nLa demande vietnamienne est à la fois politique et pratique. La reconnaissance établirait un partenariat public entre les deux révolutions, tandis que la coopération au-delà des frontières pourrait ouvrir des voies pour la formation, les communications, les médicaments et les fournitures militaires. Mais le nouveau gouvernement doit encore décider dans quelle mesure il souhaite contester ouvertement l'ordre colonial en Indochine."
SWF_VIN.2.a: "Ouvrez la frontière à nos camarades vietnamiens."
SWF_VIN.2.b: "Entretenir des relations amicales mais limitées."

# ------------------------------------------------------------------
# ROC victory: Moscow and Nanking
# ------------------------------------------------------------------

SWF_VIN.3.t: "Le Vietnam cherche un accord soviétique"
SWF_VIN.3.d: "L'issue de la guerre civile chinoise a laissé la révolution vietnamienne dans une position régionale plus incertaine. Alors que le gouvernement nationaliste contrôle le continent, des représentants de la République démocratique sont venus à Moscou pour rechercher une reconnaissance politique et une connexion indépendante avec le monde socialiste.\n\nLa délégation soutient que la lutte en Indochine reste une cause anticoloniale quels que soient les événements en Chine. La reconnaissance soviétique pourrait donner à Hanoï une légitimité précieuse et démontrer que le mouvement révolutionnaire n'a pas été isolé par la victoire du Kuomintang. Le Kremlin doit mettre en balance cet appel avec les risques d'une confrontation plus directe avec l'ordre soutenu par l'Occident en Asie."
SWF_VIN.3.a: "Reconnaître le parcours révolutionnaire indépendant du Vietnam."
SWF_VIN.3.b: "Gardez la relation non officielle pour le moment."

SWF_VIN.4.t: "Une ouverture de Hanoï"
SWF_VIN.4.d: "La République démocratique du Vietnam a contacté le gouvernement national avec une proposition d'aménagement pratique. Les dirigeants vietnamiens cherchent à empêcher la frontière nord de devenir un autre front dans la lutte entre révolution et réaction, en offrant l'assurance que leur lutte immédiate est dirigée contre la domination coloniale plutôt que contre la Chine.\n\nL'offre est politiquement délicate. Hanoï reste dirigée par des révolutionnaires dont l'idéologie est profondément suspecte pour Nankin, mais la coopération - ou du moins la retenue - pourrait priver les puissances étrangères de la possibilité d'exploiter la frontière. Le gouvernement national doit décider s'il doit poursuivre une entente prudente ou maintenir le mouvement vietnamien à distance."
SWF_VIN.4.a: "Explorez un hébergement prudent."
SWF_VIN.4.b: "Maintenez uniquement des contacts informels."

# ------------------------------------------------------------------
# Party and national-front development
# ------------------------------------------------------------------

SWF_VIN.5.t: "Le Département Politique Générale"
SWF_VIN.5.d: "L'Armée populaire ne peut pas être soutenue uniquement par les armes et les ordres. Alors que la guerre prend de l'ampleur, le gouvernement a approuvé la création du Tong Cuc Chinh Tri, le Département politique général, pour coordonner l'éducation politique, le moral, le travail des cadres et l'organisation du Parti dans l'ensemble des forces armées.\n\nSon objectif n'est pas seulement de diffuser des slogans. Le Département veillera à ce que les soldats comprennent le sens politique de la guerre, à ce que les commandants restent connectés au peuple et à ce que l'armée se développe comme un instrument de libération nationale plutôt que comme une caste militaire détachée. Dans une longue lutte révolutionnaire, la cohésion politique est considérée comme une arme non moins essentielle que les fusils ou l'artillerie."
SWF_VIN.5.a: "L'armée doit combattre avec conviction et discipline."

SWF_VIN.6.t: "Leçons d'une centaine de fleurs"
SWF_VIN.6.d: "Les débats qui se déroulent ailleurs dans le monde socialiste ont attiré l'attention à Hanoï. L'appel à laisser parler plus librement la critique, l'art et l'érudition offre à la fois une promesse et un avertissement : une révolution qui ne peut pas entendre le peuple peut devenir fragile, mais une ouverture sans direction politique peut être exploitée par ses ennemis.\n\nLes cadres vietnamiens ont été chargés d'étudier attentivement ces évolutions. La République doit trouver une place à la critique qui renforce la reconstruction nationale tout en évitant le factionnalisme et la paralysie que les puissances coloniales encourageraient volontiers. La question n'est pas de savoir si les idées comptent, mais comment un État révolutionnaire peut les cultiver sans perdre son objectif."
SWF_VIN.6.a: "Apprenez de chaque expérience, mais suivez notre propre chemin."

SWF_VIN.7.t: "Laïc Dan Lam Goc"
SWF_VIN.7.d: "Le Gouvernement a réaffirmé un principe simple : le peuple doit rester la racine de la révolution. On rappelle aux responsables que l'autorité n'est pas une fin en soi et que les politiques qui ignorent les conditions des travailleurs, des paysans, des anciens combattants et des familles affaibliront la cause même qu'ils sont censés servir.\n\nLes cadres de toute la République ont pour instruction d'écouter plus attentivement les préoccupations locales, de corriger les abus avant qu'ils ne se transforment en ressentiment et de veiller à ce que les fardeaux de la guerre soient partagés aussi équitablement que possible. La lutte de libération nationale ne peut pas survivre en tant qu'affaire menée au-dessus des têtes du peuple."
SWF_VIN.7.a: "Le peuple est le fondement de la République."

SWF_VIN.8.t: "Un bloc de solidarité nationale"
SWF_VIN.8.d: "La guerre a rassemblé des forces qui ne sont pas d'accord sur toutes les questions d'idéologie, de religion ou de politique sociale, mais qui partagent un intérêt commun pour l'indépendance du Vietnam. Le gouvernement cherche désormais à organiser ces courants en un bloc de solidarité nationale plus large, reliant les cadres révolutionnaires aux intellectuels patriotes, aux dirigeants locaux, aux communautés religieuses et aux nationalistes non communistes.\n\nUne telle coalition sera forcément difficile à gérer. Pourtant, ses partisans soutiennent que la République ne peut pas se permettre de restreindre la lutte nationale au moment même où elle a besoin de la base de soutien la plus large possible. La tâche qui nous attend est de construire l'unité sans abandonner la direction de la révolution."
SWF_VIN.8.a: "L'indépendance requiert l'unité la plus large possible."

SWF_VIN.9.t: "Le Manifeste de Ngo Dinh Diem"
SWF_VIN.9.d: "Un manifeste associé à Ngo Dinh Diem a intensifié le débat au sein de la coalition nationale émergente. Son langage de renouveau moral, d'indépendance nationale et de responsabilité publique séduit de nombreux Vietnamiens qui se méfient à la fois du régime colonial et des politiques idéologiques rigides. D'autres y voient la fondation potentielle d'un mouvement politique rival, notamment dans les milieux catholiques et conservateurs.\n\nLe gouvernement doit décider comment recevoir ces courants. Ils ont beau élargir le front contre la domination étrangère, ils portent aussi leurs propres ambitions et suspicions. La République devra démontrer que l'unité nationale peut s'accommoder des désaccords sans permettre que la lutte pour l'indépendance soit accaparée par une seule faction."
SWF_VIN.9.a: "Que le débat serve la nation et non la diviser."

SWF_VIN.10.t: "Le Viet Minh et le Lien Viet s'unissent"
SWF_VIN.10.d: "Les organisations Viet Minh et Lien Viet ont été fusionnées en un seul front national. La nouvelle structure vise à rassembler les cadres révolutionnaires, les partis patriotiques, les organisations religieuses, les intellectuels et les associations locales dans un cadre politique commun tout en préservant le caractère large du mouvement indépendantiste.\n\nCette consolidation offre à la République un visage public plus clair et un moyen plus solide de coordonner le travail politique à travers le pays. Il comporte également un avertissement : l'unité doit être maintenue par la persuasion et la participation, et non simplement annoncée d'en haut. Il va désormais être demandé au Front Lien Viet de démontrer que la cause vietnamienne appartient à la nation tout entière."
SWF_VIN.10.a: "Un front uni pour la libération nationale."

SWF_VIN.11.t: "Le règne de Staline"
SWF_VIN.11.d: "L'autorité continue de Joseph Staline à Moscou a façonné les calculs de chaque mouvement communiste. Pour le Vietnam, le modèle soviétique offre un exemple de transformation rapide, de discipline centralisée et de résistance sans compromis à la pression impériale. Cela exige également des choix politiques clairs à l'heure où la République continue de consolider ses institutions.\n\nLes partisans d'un alignement plus étroit soutiennent que le Vietnam doit se lier à la puissance socialiste la plus forte disponible. Ils croient que l'unité de doctrine et d'organisation protégera la révolution dans ses années les plus dangereuses. Les critiques craignent que la situation du Vietnam exige un équilibre plus indépendant entre la solidarité internationale et les réalités nationales."
SWF_VIN.11.a: "Restez fermement dans le camp socialiste."

SWF_VIN.12.t: "Après Staline"
SWF_VIN.12.d: "La mort de Joseph Staline a ouvert une période d'incertitude dans le monde socialiste. Les vieilles hypothèses sont remises en question, les nouveaux dirigeants se disputent l'influence et les partis communistes du monde entier doivent décider quels éléments de l'expérience soviétique ils doivent préserver et lesquels reconsidérer.\n\nPour le Vietnam, la transition comporte à la fois un danger et une opportunité. Un Moscou moins sûr peut offrir une plus grande marge de manoeuvre pour une évolution nationale indépendante, mais il peut également laisser des mouvements révolutionnaires plus petits exposés à des pressions concurrentes. La République doit honorer la solidarité internationale tout en veillant à ce que sa propre révolution ne soit pas réduite à l'écho de conflits bien au-delà de l'Indochine."
SWF_VIN.12.a: "Le Vietnam doit tracer sa propre voie."

SWF_VIN.13.t: "Diplomatie du bambou"
SWF_VIN.13.d: "La position du Vietnam exige une diplomatie aussi résiliente que le bambou : ferme dans ses racines, flexible face au vent et difficile à briser. La République ne peut pas se permettre l'isolement, mais elle ne peut pas non plus devenir en toute sécurité l'instrument d'une puissance lointaine. Sa survie dépend du maintien de liens au-delà des frontières idéologiques, tout en refusant de faire des compromis sur l'indépendance.\n\nCette approche nécessitera de la patience, un langage prudent et une volonté de négocier sans abandonner les principes. Le Vietnam cherchera des amis là où il le peut, évitera les conflits inutiles et préservera une marge de manoeuvre entre les grands États dont les rivalités pourraient autrement décider de l'avenir de l'Indochine."
SWF_VIN.13.a: "Racines fermes, branches flexibles."

# ------------------------------------------------------------------
# Southern resistance and National Liberation Front
# ------------------------------------------------------------------

SWF_VIN.14.t: "La Résistance Nam Bo"
SWF_VIN.14.d: "La lutte du Sud ne peut être considérée comme un théâtre secondaire. À Nam Bo, la résistance est confrontée à un paysage politique fragmenté composé d'autorités coloniales, de milices locales, de forces sectaires, d'organisations criminelles et de groupes nationalistes concurrents. Les rivières, les villes et la population dense de la région en font à la fois un objectif vital et une arène particulièrement difficile pour le travail révolutionnaire.\n\nHanoï a donc porté une plus grande attention vers le sud. Des organisateurs politiques, des instructeurs militaires, des courriers et du matériel seront envoyés dans la mesure du possible, tandis que les forces locales seront encouragées à construire un mouvement capable de survivre même lorsque la communication directe avec le nord est interrompue."
SWF_VIN.14.a: "Le front sud doit perdurer."

SWF_VIN.15.t: "Donner du pouvoir au Front démocratique"
SWF_VIN.15.d: "La lutte dans le Sud ne peut être menée par un seul parti ou un seul groupe social. Un Front démocratique plus large est en train d'être renforcé pour unir les militants anticoloniaux, les travailleurs, les étudiants, les communautés religieuses, les milices locales et les organisations patriotiques derrière une revendication commune d'autodétermination vietnamienne.\n\nLa coalition sera imparfaite et souvent controversée. Ses membres apportent des traditions, des intérêts et des visions différentes pour l'avenir du pays. Pourtant, les partisans du Front soutiennent que ces différences sont moins importantes que la nécessité immédiate de résister à la domination étrangère. En donnant aux forces du Sud une bannière politique plus large, Hanoï espère transformer une opposition dispersée en un mouvement national organisé."
SWF_VIN.15.a: "Construire la coalition sudiste la plus large possible."

SWF_VIN.16.t: "Après Nguyen Binh"
SWF_VIN.16.d: "La mort de Nguyen Binh a laissé la résistance du Sud sans l'un de ses commandants les plus compétents et les plus indépendants. Ses réseaux réunissaient des unités de guérilla, des organisateurs urbains, des contacts sectaires et des groupes armés locaux dans des conditions de pression extraordinaire. Sans lui, le Front de libération nationale doit choisir un leader capable de maintenir l'unité de ces forces tout en définissant le caractère politique de la lutte.\n\nLe choix est conséquent. Le Duan, qui dirige déjà le bureau sud du Parti, offre une direction disciplinée et une ligne directe vers Hanoï ; son adjoint Le Duc Tho se tient derrière lui. Tran Quoc Buu représente un courant plus syndicaliste et syndicaliste. Kieu Cong Cung promet une voie sudiste radicale, moins facilement contenue par les structures orthodoxes. L'avenir du Front repose désormais sur cette décision."
SWF_VIN.16.a: "Le Duan assurera la direction du Parti."
SWF_VIN.16.b: "Tran Quoc Buu ralliera les travailleurs organisés."
SWF_VIN.16.c: "Kieu Cong Cung dirigera un front sudiste radical."

SWF_VIN.17.t: "La question révisionniste du Sud"
SWF_VIN.17.d: "Le Comité central du Parti a commencé à réexaminer le statut de plusieurs personnalités révolutionnaires éminentes du Sud qui continuent de lutter sous la bannière de la libération nationale mais refusent de rejoindre le Parti. Parmi les plus notables figurent le brigadier Kieu Cong Cung, adjoint du lieutenant-général Nguyen Binh et représentant de l'Assemblée nationale, et Tran Quoc Buu, un organisateur syndical chevronné et commandant de la célèbre unité 25 de Dac Cong. Les deux hommes ont rendu des services distingués contre le colonialisme français et le régime Bao-Dai, mais aucun d'eux n'a accepté d'adhérer au Parti. Au lieu de cela, ils prônent diverses formes de syndicalisme, de socialisme chrétien et de marxisme révisionniste, arguant que la révolution devrait rester un vaste mouvement national plutôt que dirigé exclusivement par des marxistes-léninistes. Cela a déclenché un débat féroce au sein du Parti. Le lieutenant-général Nguyen Binh affirme que le champ de bataille du Sud exige le front uni le plus large possible. Selon lui, tout patriote désireux de combattre le colonialisme devrait être accueilli quelles que soient ses différences idéologiques, à condition qu'il reste fidèle à la révolution. Cependant, les cadres orthodoxes dirigés par Le Duc Tho avertissent que tolérer les tendances révisionnistes au sein de la résistance risque de saper la discipline et l'unité idéologique du Parti. Ils soutiennent que l'histoire a montré à plusieurs reprises que l'opportunisme et le factionnalisme constituent les plus grandes menaces intérieures pour un mouvement révolutionnaire. Après mûre réflexion, le Comité central a pris sa décision."
SWF_VIN.17.a: "L'unité contre les colonialistes doit primer."
SWF_VIN.17.b: "Les petites chenilles nuisibles doivent être retirées du grand arbre."
SWF_VIN.17.c: "La décision du Comité central sera appliquée vers le sud."

SWF_VIN.150.t: "L'opposition stalinienne émerge"
SWF_VIN.150.d: "De récents rapports de la sécurité publique (Cong An), renforcés par des informations provenant de services de renseignement amis, ont révélé l'existence d'une faction restreinte mais de plus en plus bruyante au sein du mouvement révolutionnaire opposée à la ligne politique du président Hô Chi Minh.\n\nCentré autour de Tran Ngoc Danh et La Vinh Loi, le groupe a accusé la direction du Parti d'abandonner le marxisme-léninisme orthodoxe au profit de ce qu'il décrit comme un « nationalisme bourgeois ». Entre fin 1949 et début 1950, Tran Ngoc Danh aurait envoyé une série de lettres au Comité central du Parti communiste de l'Union soviétique critiquant la direction de Hô Chi Minh. Il a fait valoir que la dissolution du Parti communiste indochinois et l'accent mis sur un large front uni patriotique représentaient de dangereuses déviations idéologiques.\n\nLa faction allègue en outre que le Parti a accordé une importance excessive à l'unité nationale plutôt qu'à la lutte des classes, et a accusé Hô Chi Minh de cultiver un prestige personnel incompatible avec une direction révolutionnaire collective. Pendant ce temps, La Vinh Loi aurait voyagé à l'étranger sans autorisation dans le but d'obtenir un soutien politique, financier et militaire direct de l'Union soviétique, tout en critiquant ouvertement la ligne actuelle du Parti aux côtés de Tran Ngoc Danh.\n\nLa direction du Parti a rejeté ces accusations, estimant que le dogmatisme était en décalage avec les réalités de la lutte révolutionnaire du Vietnam. Le président Hô Chi Minh et le secrétaire général Truong Chinh soutiennent que la tâche immédiate reste la libération nationale à travers le Grand Front d'unité nationale, arguant que le socialisme ne peut être construit qu'une fois l'indépendance assurée.\n\nÀ la suite d'une enquête du Comité central, Tran Ngoc Danh et La Vinh Loi ont été expulsés du Parti pour avoir violé la discipline organisationnelle et mené des activités politiques non autorisées à l'étranger."
SWF_VIN.150.a: "La révolution nationale visant à libérer tous les Vietnamiens reste notre priorité absolue."

SWF_VIN.151.t: "Mort de Nhuong Tong"
SWF_VIN.151.d: "Le ministère de la Sécurité publique a confirmé le décès de Nhuong Tong, secrétaire général du Viet Nam Quoc Dan Dang (VNQDD) et l'un des derniers dirigeants éminents de la faction nationaliste de gauche du parti.\n\nRévolutionnaire et intellectuel chevronné, Nhuong Tong était depuis longtemps actif dans la lutte contre la domination coloniale française. Après l'effondrement du gouvernement nationaliste vietnamien fin 1946, il réorganise les activités du VNQDD dans les zones sous contrôle français autour de Hanoï. Bien qu'il ait ensuite accepté un poste consultatif auprès du gouverneur Nghiem Xuan Thien en faveur de la solution Bao-Dai, il s'est progressivement retiré de la vie publique et est revenu à la pratique de la médecine traditionnelle chinoise.\n\nSelon le ministère de la Sécurité publique, des renseignements récemment découverts ont révélé que Nhuong Tong avait secrètement tenté de coordonner un dernier soulèvement national par les groupes paramilitaires Viet Quoc restants contre la République démocratique du Vietnam. Fort de ces informations, l'officier de la Sécurité publique Nguyen Van Viet l'arrête le 8 septembre 1949 dans la banlieue de Hanoï.\n\nAprès plusieurs semaines d'enquête, le gouvernement a annoncé que Nhuong Tong était décédé alors qu'il était en détention. Les autorités affirment que sa mort est due à une maladie survenue pendant sa détention. Les partisans du Viet Quoc ont cependant accusé les autorités révolutionnaires d'éliminer l'un des derniers dirigeants nationalistes influents opposés au Viet Minh."
SWF_VIN.151.a: "Échec et mat."


# === Second Congress Event Chain (merged from SWF_VIN_second_congress_l_english.yml) ===
# ------------------------------------------------------------------
# Second Congress of the Indochinese Communist Party
# ------------------------------------------------------------------

SWF_VIN.50.t: "Le deuxième congrès du Parti communiste indochinois"
SWF_VIN.50.d: "Le IIe Congrès national du Parti communiste indochinois s'est réuni dans la zone libérée de la commune de Vinh Quang, district de Chiem Hoa, province de Tuyen Quang. Il s'agit du premier congrès du Parti organisé depuis la Révolution d'Août et le début de la résistance nationale contre le colonialisme français.\n\nSeize ans après le premier congrès du Parti, le mouvement s'est transformé au point de devenir méconnaissable. Le peuple vietnamien est passé du statut de sujet colonial à celui de citoyen de sa propre république, tandis que les organisations révolutionnaires du Laos et du Cambodge continuent de se développer grâce à leur coopération avec le Viet Minh. Cent cinquante-huit délégués officiels et cinquante-trois délégués suppléants se sont réunis pour représenter plus de sept cent mille adhérents du Parti à travers l'Indochine. Des délégations fraternelles du Parti communiste chinois et du Parti communiste du Siam soulignent l'importance internationale croissante du Congrès.\n\nLes délégués se réunissent à un moment difficile. Le général Jean de Lattre de Tassigny a lancé une nouvelle stratégie française de lignes fortifiées, d'opérations mobiles et d'assistance étrangère élargie. Pourtant, le Congrès ne s'est pas réuni simplement pour raconter les difficultés. Elle doit décider du caractère politique, de l'orientation internationale et de l'organisation future de la révolution qui survivra à la guerre."
SWF_VIN.50.a: "Que le Congrès commence."

SWF_VIN.51.t: "La place du Vietnam dans la révolution mondiale"
SWF_VIN.51.d: "Parmi les questions soumises au Congrès, aucune n'a donné lieu à un débat plus sérieux que la politique étrangère de la République démocratique du Vietnam. La création de la République populaire de Chine a brisé l'encerclement colonial autour de la révolution, tandis que le camp socialiste s'est étendu à toute l'Eurasie. Dans le même temps, la guerre froide se durcit et l'argent, les armes et les conseillers américains soutiennent de plus en plus la guerre française en Indochine.\n\nLa mission du président Hô Chi Minh à Moscou a obtenu la reconnaissance soviétique, mais l'assistance matérielle reste limitée. Les dirigeants soviétiques sont préoccupés par l'Europe et la Corée, et beaucoup s'attendent à ce que le nouveau gouvernement chinois porte la responsabilité principale des affaires révolutionnaires en Asie de l'Est. Certains délégués plaident donc pour une intégration sans ambiguïté avec le camp socialiste. D'autres rappellent que les officiers américains de l'OSS Deer Team ont autrefois coopéré avec le Viet Minh et que plusieurs observateurs occidentaux ont d'abord compris Hô Chi Minh comme un patriote vietnamien. Un troisième courant soutient que le Vietnam doit soutenir la révolution mondiale sans devenir dépendant d'un quelconque capital étranger.\n\nLe Congrès doit définir la posture de la République avant que les grandes puissances ne la définissent à notre place."
SWF_VIN.51.a: "La révolution mondiale progresse par de nombreux chemins."
SWF_VIN.51.b: "Gardez la porte ouverte à la modération américaine."
SWF_VIN.51.c: "Le Vietnam appartient fermement au camp socialiste."

SWF_VIN.52.t: "Le sort du projet d'union indochinoise"
SWF_VIN.52.d: "Pendant plus de deux décennies, le Parti communiste indochinois a servi d'avant-garde révolutionnaire commune au Vietnam, au Laos et au Cambodge. Sous sa bannière, les patriotes des trois nations ont combattu la domination coloniale avec la conviction que la libération d'un peuple ne pouvait être séparée de celle des autres.\n\nMais la guerre et la révolution ont modifié le paysage politique. Les cadres laotiens et khmers insistent de plus en plus sur le fait que les mouvements nationaux enracinés dans leurs propres langues, histoires et conditions sociales doivent mener la lutte dans leur pays. De nombreux délégués vietnamiens conviennent que le parti unique indochinois a rempli son rôle historique et devrait céder la place à des organisations nationales indépendantes unies par l'amitié et un objectif commun.\n\nD'autres préviennent que la politique coloniale a délibérément fragmenté l'Indochine afin de la gouverner. Dissoudre la structure révolutionnaire commune, affirment-ils, inviterait les puissances impériales à restaurer les divisions du passé. Leur alternative est une future fédération socialiste : trois peuples, mais un seul destin politique et économique. Le Congrès doit décider si l'unité sera préservée par des mouvements nationaux indépendants ou par un projet révolutionnaire indochinois unique."
SWF_VIN.52.a: "Trois nations, une amitié."
SWF_VIN.52.b: "Une révolution, une Indochine."

SWF_VIN.53.t: "La nature du marxisme vietnamien"
SWF_VIN.53.d: "Le débat final et le plus conséquent du Congrès concerne la nature même du marxisme vietnamien. Un courant, associé à Tran Ngoc Danh et aux marxistes-léninistes orthodoxes, soutient que le Vietnam doit suivre la voie soviétique avec discipline : lutte des classes, autorité centralisée et préparation rapide à une transformation socialiste. Selon eux, s'écarter de la ligne internationale établie risque de diluer la révolution jusqu'à ce qu'elle devienne simplement un autre mouvement nationaliste.\n\nÀ l'opposé se trouvent ceux qui soutiennent que le marxisme doit être transposé dans les conditions vietnamiennes plutôt que mécaniquement importé. Le président Hô Chi Minh et le secrétaire général Truong Chinh soulignent que la contradiction immédiate reste l'occupation coloniale. La révolution doit donc organiser les ouvriers et les paysans comme base tout en attirant les intellectuels, les petits propriétaires, les patriotes religieux et même des sections de la bourgeoisie nationale dans un grand Front d'unité nationale.\n\nUne troisième position cherche à concilier la libération nationale avec la révolution internationale : le Vietnam restera marxiste et socialiste, mais son chemin sera guidé par les exigences spécifiques de l'indépendance, de la réunification, de la réforme agraire progressive et de la construction d'un État démocratique populaire. Le Congrès doit maintenant choisir son règlement idéologique."
SWF_VIN.53.a: "Le Vietnam doit tracer sa propre voie révolutionnaire."
SWF_VIN.53.b: "La voie soviétique est la seule qui soit correcte."
SWF_VIN.53.c: "La libération nationale et la révolution internationale sont indissociables."

SWF_VIN.54.t: "Un nom pour la fête"
SWF_VIN.54.d: "Après avoir mené pendant deux décennies la lutte révolutionnaire sous la bannière du Parti communiste indochinois, le Congrès a convenu que le mouvement devait désormais prendre un nom adapté aux réalités de la révolution nationale vietnamienne. La décision est plus qu'une question de présentation. Il annoncera au pays - et au monde - quelle sorte d'organisation revendique le droit de diriger la lutte pour l'indépendance.\n\nLes marxistes-léninistes orthodoxes exhortent les délégués à proclamer un Parti communiste du Vietnam. Selon eux, une avant-garde révolutionnaire devrait déclarer ouvertement son allégeance idéologique et lier sans équivoque le Vietnam au mouvement communiste international. Les modérés proposent plutôt un Parti socialiste vietnamien : un nom qui, selon eux, exprime mieux la tâche immédiate de construire une nation patriotique, démocratique et socialement juste tout en élargissant l'attrait du Parti auprès des intellectuels, des communautés religieuses et de la bourgeoisie nationale.\n\nLe président Hô Chi Minh avance une troisième proposition. Le Parti travailliste vietnamien affirmerait que les travailleurs sont le fondement du Parti tout en évitant les barrières inutiles au sein du Grand Front d'unité nationale. Cela s'adresserait non seulement aux cadres et aux théoriciens, mais à chaque ouvrier, paysan, soldat et patriote dont dépend la survie de la République."
SWF_VIN.54.a: "Le Parti travailliste vietnamien dirigera la nation."
SWF_VIN.54.b: "Que le Parti porte la bannière communiste."
SWF_VIN.54.c: "Un parti socialiste pour une nation socialiste."

SWF_VIN.55.t: "Renforcez le Parti, servez le peuple"
SWF_VIN.55.d: "Une fois ses grands débats terminés, le Deuxième Congrès passe de la déclaration à l'organisation. Les délégués conviennent que la révolution ne peut pas être soutenue uniquement par des victoires sur le champ de bataille. Le Parti doit construire des organisations disciplinées depuis la direction centrale jusqu'à chaque province, district, village, usine, unité militaire et école. Les ouvriers, les paysans, les femmes, les jeunes, les intellectuels, les anciens combattants et les patriotes religieux doivent être attirés dans des organisations de masse capables de transformer la sympathie populaire en résistance pratique et en reconstruction nationale.\n\nLe Congrès accorde une importance particulière à l'éducation des cadres, à la critique et à l'autocritique, ainsi qu'à la lutte contre la bureaucratie et la corruption. L'instruction politique doit être jointe à la compétence pratique ; le leadership doit être acquis par le service ; et chaque organisation doit rester connectée aux personnes qu'elle prétend représenter. Comme le président Hô Chi Minh le rappelle aux délégués, les cadres sont à la base de tout travail.\n\nLe Congrès se termine donc par l'engagement de construire un parti uni, capable et révolutionnaire, à la hauteur des fardeaux de l'indépendance, de la réunification et de la construction socialiste. Les choix faits ici façonneront l'avenir politique du Vietnam bien après que les armes de la guerre actuelle se soient tues."
SWF_VIN.55.a: "Renforcez le Parti, servez le peuple !"

# === Indochina War Battle Reports (merged from focus_VIN_50s_l_english.yml) ===

VIN_MIL.4.b: "Chaque soldat doit comprendre pourquoi il se bat."

VIN_Nhan_Van_Giai_Pham.5.b: "Laisse les fleurs s'épanouir"
VIN_Nhan_Van_Giai_Pham.10.t: "Les gens parlent, nous écoutons"
VIN_Nhan_Van_Giai_Pham.10.d: "Avec le débat Nhan Van - Giai Pham réglé en faveur de la réforme, des lettres de plainte, des pétitions et des critiques ouvertes ont commencé à affluer dans les journaux, les conseils populaires et les bureaux du Parti dans les villages et les usines. Les cadres qui craignaient autrefois le mot critique découvrent désormais que les paysans, les ouvriers et les enseignants s'attendent à être entendus.\n\nLe Parti doit décider comment recevoir ce flot de voix. Certains responsables proposent des bureaux de pétition permanents dans chaque province, où les griefs sont enregistrés et répondus en public. D'autres préfèrent que les critiques transitent par le Front de la Patrie et les comités du Parti, gardant ainsi le contrôle de ce qui est dit et du moment où il le dit."
VIN_Nhan_Van_Giai_Pham.10.a: "Ouvrir des bureaux de pétition dans toutes les provinces"
VIN_Nhan_Van_Giai_Pham.10.b: "Canaliser les critiques à travers les comités du Parti"

SWF_VIN.6.b: "Laissez les critiques couler ouvertement."
SWF_VIN.9.b: "Le manifeste est une tentative de prise de pouvoir par la réaction ; répondez-y fermement."
VIN_Aid.1.t: "Les conseillers chinois arrivent"
VIN_Aid.1.d: "Les premiers conseillers chinois ont atteint nos postes de commandement avec leurs camions de fusils et de matériel de signalisation. Leurs officiers d'état-major ont étudié nos campagnes avec intérêt et ont des opinions bien arrêtées sur la manière dont les prochaines devraient être menées.\n\nNos commandants peuvent accueillir librement les leçons ou insister pour que les directives chinoises soient adaptées aux conditions vietnamiennes et au jugement de nos propres officiers."
VIN_Aid.1.a: "Accueillir les cours de chinois librement"
VIN_Aid.1.b: "Adapter les directives chinoises aux conditions vietnamiennes"
VIN_Aid.2.t: "La mission soviétique arrive"
VIN_Aid.2.d: "La mission militaire soviétique a atteint notre quartier général. Ses officiers apportent des idées sur l'artillerie et sur l'organisation de grandes forces, et les premiers canons sont déjà en route depuis la frontière.\n\nCertains commandants souhaitent adopter immédiatement les méthodes soviétiques. D'autres disent que notre armée a été bâtie sur l'expérience de notre propre guerre et qu'elle ne devrait pas être restructurée à la hâte."
VIN_Aid.2.a: "Adopter immédiatement les méthodes soviétiques"
VIN_Aid.2.b: "Adaptez-les soigneusement à notre propre guerre"
VIN_Aid.3.t: "Volontaires étrangers dans les rangs"
VIN_Aid.3.d: "Des volontaires et déserteurs étrangers ont rejoint nos nouvelles unités combattantes. Beaucoup ont servi dans d'autres armées et apportent une discipline et une expérience qui manquent souvent à nos propres recrues, mais ils apportent également des habitudes que nos cadres politiques ont du mal à comprendre.\n\nLe Parti peut les placer sous une supervision politique stricte, ou donner aux anciens combattants la possibilité d'enseigner leurs compétences avec peu d'interférence."
VIN_Aid.3.a: "Les placer sous tutelle politique"
VIN_Aid.3.b: "Laissez les anciens combattants enseigner leurs compétences"
VIN_Aid.4.t: "Convois à travers la frontière"
VIN_Aid.4.d: "Des camions et des fusils ont commencé à se déplacer vers le sud, en passant par la route frontalière en provenance de Chine. Les cadres locaux ont installé des dépôts et des postes de garde, et chaque convoi qui arrive est accueilli par des porteurs volontaires.\n\nNos officiers logistiques peuvent intégrer les expéditions dans un système de comptabilité régulier ou les acheminer rapidement vers les unités combattantes avec le moins de paperasse possible."
VIN_Aid.4.a: "Intégrez les expéditions dans un système régulier"
VIN_Aid.4.b: "Déplacez rapidement les expéditions vers l'avant"
 VIN_Notice.1.t:0 "Fin du détournement du Bas Laos"
 VIN_Notice.1.d_win:0 "Le détournement vers le sud a détourné l'attention des Français du théâtre principal. Les partenaires du Pathet Lao et les cadres du Viet Minh rapportent que les garnisons ennemies du Bas Laos sont bloquées et que la pression sur le plateau demeure.\n\nLe commandement remercie les colonnes pour leur travail."
 VIN_Notice.1.d_fail:0 "La diversion vers le sud du Bas-Laos s'est heurtée à la résistance française et laotienne. Les colonnes se retirent en ordre et les routes du plateau nous restent pour l'instant fermées.\n\nLes responsables politiques demandent que les leçons soient écrites."
 VIN_Notice.1.a:0 "Louez les colonnes et partagez les leçons avec les cadres."
 VIN_Notice.1.b:0 "Ordonnez aux colonnes de se reposer et de reconstituer leur approvisionnement."
 VIN_CEFEO.14.t:0 "Le CEFEO balaie la côte de Phat Diem"
 VIN_CEFEO.14.d:0 "Des rapports provenant de la ceinture catholique du delta du fleuve Rouge indiquent que les bataillons du CEFEO quittent Bui Chu et Ninh Binh pour balayer les secteurs autour de Phat Diem. Des péniches de débarquement ont été aperçues dans les canaux côtiers et les postes de garnison ont été renforcés dans la nuit.\n\nCe ratissage semble destiné à repousser nos cellules du delta vers l'intérieur des terres et à alléger la pression sur les postes le long de la côte. Il ne s'agit pas d'une offensive sur nos bases principales, mais cela coûtera cher aux unités locales si elles se retrouvent à découvert."
 VIN_CEFEO.14.a:0 "Alertez les commandements régionaux du Delta."
 VIN_CEFEO.14.b:0 "Laissez les cellules delta se disperser et attendez la fin."
 VIN_CEFEO.15.t:0 "Le balayage Phat Diem se termine"
 VIN_CEFEO.15.d_clean:0 "Le ratissage du CEFEO dans les secteurs de Phat Diem est terminé et le commandement expéditionnaire le clame comme un succès. Nos cellules du delta ont subi de lourdes pertes, des dépôts ont été retrouvés et plusieurs villages sont repassés sous la protection de la garnison.\n\nL'organisation du Delta aura besoin de temps pour se reconstruire et les cadres devront apprendre des méthodes des bataillons avant le prochain balayage."
 VIN_CEFEO.15.d_costly:0 "L'opération de ratissage du CEFEO dans les secteurs de Bui Chu et Ninh Binh a pris fin après de violents combats locaux. Les bataillons ont atteint une partie de leurs objectifs mais ont payé pour chaque village, et nos cellules ont conservé suffisamment de leur réseau pour se reconstruire.\n\nAucune des deux parties ne peut affirmer que la côte est sûre, et toutes deux reviendront."
 VIN_CEFEO.15.d_failure:0 "Le ratissage du CEFEO dans les secteurs de Phat Diem a été interrompu. Nos unités du delta se sont éclipsées en bon ordre, les bataillons n'ont trouvé que des villages vides et des pièges, et la garnison retourne à ses postes après avoir accompli moins que ce qu'elle avait promis.\n\nLes cadres du delta rapportent que les villageois regardaient les bataillons partir en silence."
 VIN_CEFEO.15.a:0 "Étudiez les leçons du balayage."
 VIN_CEFEO.15.b:0 "Remontez le moral dans les villages du delta."
 VIN_CEFEO.16.t:0 "Sondes CEFEO de Na San"
 VIN_CEFEO.16.d:0 "La garnison du camp retranché de Na San a commencé à sonder vers l'ouest, en direction de Yen Chau. Des patrouilles de parachutistes du CEFEO et de partisans Tai testent les routes, et des avions de transport ont été aperçus larguant du ravitaillement sur la piste d'atterrissage du camp.\n\nCette sortie semble avoir pour but de perturber nos lignes de ravitaillement dans le nord-ouest et de montrer que le camp peut encore attaquer. C'est un déplacement limité, mais nos services arrières sur la route de Son La y sont exposés."
 VIN_CEFEO.16.a:0 "Renforcer les services arrière le long de la route."
 VIN_CEFEO.16.b:0 "Économisons nos forces ; la sortie se terminera d'elle-même."
 VIN_CEFEO.17.t:0 "Fin de la sortie de Yen Chau"
 VIN_CEFEO.17.d_clean:0 "La sortie de Na San vers Yen Chau est terminée et la garnison du camp est de retour derrière ses barbelés. En cours de route, il a coupé des routes, attaqué des points de ravitaillement et fait des prisonniers dans nos services arrière.\n\nLe couloir nord-ouest devra être réparé avant le passage des prochains convois, et les services ont été invités à mieux surveiller leurs dépôts."
 VIN_CEFEO.17.d_costly:0 "La sortie de Na San vers Yen Chau s'est terminée après une série d'affrontements violents. Les patrouilles ont atteint certaines de leurs cibles mais ont été prises en embuscade lors de la retraite, et nos services arrière ont perdu des provisions mais ont gardé la route ouverte.\n\nLe camp a montré qu'il pouvait encore se retirer, mais à un prix qu'il ne voudra pas répéter de sitôt."
 VIN_CEFEO.17.d_failure:0 "La sortie de Na San vers Yen Chau a été interrompue. Nos unités ont rencontré les patrouilles dans les collines et les ont reconduites vers le camp, et la route d'approvisionnement vers Son La n'a jamais été sérieusement menacée.\n\nLa garnison semble avoir décidé qu'il valait mieux nous laisser les collines."
 VIN_CEFEO.17.a:0 "Réparer les routes d'approvisionnement et renforcer la sécurité."
 VIN_CEFEO.17.b:0 "Louez les unités qui ont tenu la route."
 VIN_CEFEO.18.t:0 "Le CEFEO emprunte la route 1"
 VIN_CEFEO.18.d:0 "Les groupes mobiles du CEFEO et les divisions de l'État du Vietnam se déplacent le long de la route 1 entre Hué et Quang Tri. Des convois et du génie ont été aperçus sur la route côtière, et des postes montent aux ponts.\n\nL'opération vise à sécuriser le corridor côtier, et nos cadres dans les plaines seront mis à rude épreuve. Les commandements régionaux doivent décider s'ils doivent contester chaque pont ou conserver leurs forces."
 VIN_CEFEO.18.a:0 "Contestez les ponts et la route."
 VIN_CEFEO.18.b:0 "Évitez les combats et gardez les cadres cachés."
 VIN_CEFEO.19.t:0 "Le balayage de la Route 1 se termine"
 VIN_CEFEO.19.d_clean:0 "Le ratissage du CEFEO le long de la route 1 est terminé et une garnison siège désormais sur la route entre Hué et Quang Tri. Nos cadres des plaines ont été repoussés des ponts et plusieurs caches ont été découvertes.\n\nLe corridor côtier est pour l'instant plus solide aux mains des Français et nos cellules devront contourner les nouveaux postes."
 VIN_CEFEO.19.d_costly:0 "Le ratissage du CEFEO sur la route 1 s'est terminé après une dure quinzaine d'embuscades et de contre-embuscades. Les groupes mobiles ont atteint certaines parties de la route mais ont payé chaque pont, et nos cadres ont gardé la main sur de nombreux villages.\n\nLe couloir est plus contesté que sécurisé."
 VIN_CEFEO.19.d_failure:0 "Le ratissage du CEFEO sur la route 1 est annulé. Nos cellules coupent la route derrière les groupes mobiles et les colonnes reviennent à leurs points de départ sans les postes qu'elles avaient prévus.\n\nLes villages côtiers les ont vu partir et en ont pris note."
 VIN_CEFEO.19.a:0 "Apprenez des affrontements sur la route."
 VIN_CEFEO.19.b:0 "Construisez les milices des basses terres."
 VIN_CEFEO.20.t:0 "Une colonne française se prépare à quitter An Khe"
 VIN_CEFEO.20.d:0 "Nos éclaireurs dans les hauts plateaux rapportent que le Groupement Mobile 100 s'apprête à quitter An Khe. La seule route menant à Pleiku est la route 19, qui passe par le col de Mang Yang, et les unités qui occupent des positions le long du défilé depuis des semaines sont prêtes.\n\nLa colonne est la meilleure réserve mobile que le corps expéditionnaire ait laissée dans les hautes terres. S'il prend la route, c'est au col qu'on peut le rattraper ; s'il est transporté par avion, le pass restera vide."
 VIN_CEFEO.20.a:0 "Envoyez un message aux unités sur le laissez-passer."
 VIN_CEFEO.20.b:0 "Conservez les fournitures pour une campagne plus longue."
 VIN_CEFEO.21.t:0 "Le col Mang Yang"
 VIN_CEFEO.21.d_destroyed:0 "L'embuscade sur la route 19 s'est soldée par une victoire complète. Le Groupement Mobile 100 a été pris au col de Mang Yang, ses véhicules ont brûlé le long de la route et peu de ses hommes ont réussi à passer.\n\nLes hauts plateaux s'ouvrent à nos unités, et l'histoire du col se propage déjà de village en village."
 VIN_CEFEO.21.d_mauled:0 "Le Groupement Mobile 100 a atteint la fin du col Mang Yang, mais à un prix élevé. Véhicules et hommes gisent le long de la route 19, et les survivants sont dispersés et à court de matériel.\n\nLe groupement aura besoin de semaines pour se rétablir en tant que formation de combat."
 VIN_CEFEO.21.d_escaped:0 "La colonne se fraye un chemin à travers le col Mang Yang et atteint Pleiku. Nos unités d'embuscade ont fait des dégâts mais n'ont pas pu les arrêter, et le groupement reste une force organisée.\n\nLe laissez-passer a appris à nos unités où la route pourra être fermée plus étroitement la prochaine fois."
 VIN_CEFEO.21.d_airlifted:0 "Le Groupement Mobile 100 a quitté An Khe par voie aérienne, et la route 19 et le col Mang Yang sont restés silencieux. Nos unités d'embuscade ne trouvèrent aucune cible et le pont aérien français fit passer la colonne au-dessus de leurs têtes.\n\nLa route est désormais ouverte, mais le groupement est toujours intact."
 VIN_CEFEO.21.d_held:0 "Le groupement est resté à An Khe et le col de Mang Yang n'a vu aucune bataille. Nos unités restent sur la route et la garnison est immobilisée, coupée de Pleiku.\n\nL'impasse continue et les deux camps comptent les approvisionnements."
 VIN_CEFEO.21.a:0 "Apprenez les leçons du pass."
 VIN_CEFEO.21.b:0 "Reposez-vous et réapprovisionnez les unités qui ont combattu."
 VIN_CEFEO.22.t:0 "Une colonne française sur la route 14"
 VIN_CEFEO.22.d:0 "Le Groupement Mobile 42, la garnison de Pleiku, a pour ordre de se replier le long de la route 14 en direction de Ban Me Thuot, en traversant au passage le col de Chu Dreh. Nos unités se sont rapprochées de la route et la nouvelle de l'ordre leur est parvenue avant le départ de la colonne.\n\nLa colonne peut partir immédiatement et espérer échapper à une embuscade, ou elle peut rester à Pleiku et garder la ville. Quoi qu'il en soit, nos commandants sur le front des hautes terres doivent décider quelle part de leurs forces ils entendent engager."
 VIN_CEFEO.22.a:0 "Déplacez les unités jusqu'au col."
 VIN_CEFEO.22.b:0 "Retenez-vous et économisez nos forces."
 VIN_CEFEO.23.t:0 "Le col Chu Dreh"
 VIN_CEFEO.23.d_mauled:0 "La colonne sur la route 14 a été prise dans le col de Chu Dreh et gravement mutilée. Le Groupement Mobile 42 a perdu des véhicules et des hommes dans l'embuscade, et les survivants sont dispersés et à court de matériel.\n\nLa route des hauts plateaux menant à Ban Me Thuot n'est plus sécuritaire pour le CEFEO."
 VIN_CEFEO.23.d_escaped:0 "Le Groupement Mobile 42 s'est frayé un chemin à travers le col de Chu Dreh et a atteint Ban Me Thuot. Nos unités ont fait des dégâts mais n'ont pas pu arrêter la colonne, et elle reste une force organisée.\n\nLe col nous a appris où la route pourra être plus fermée la prochaine fois."
 VIN_CEFEO.23.d_held:0 "Le groupement resta à Pleiku et le col de Chu Dreh ne connut aucune bataille. Nos unités restent sur la route et la garnison est immobilisée.\n\nL'impasse continue et la ville compte ses ravitaillements."
 VIN_CEFEO.23.a:0 "Apprenez les leçons du pass."
 VIN_CEFEO.23.b:0 "Reposez-vous et réapprovisionnez les unités qui ont combattu."
 VIN_CEFEO.24.t:0 "Un programme de pacification dans le Delta"
 VIN_CEFEO.24.d:0 "Un programme de pacification a commencé dans le delta du Mékong sous commandement français au sud. Des postes sont installés autour de Sa Dec et le long des canaux, et des responsables de l'État vietnamien parcourent les villages accompagnés par le CEFEO.\n\nLe programme vise à couper nos cadres des villages rizicoles. Notre organisation du Sud ressentira la pression et devra décider comment y faire face."
 VIN_CEFEO.24.a:0 "Ramenez les cadres dans les canaux et attendez."
 VIN_CEFEO.24.b:0 "Frappez les responsables qui dirigent le programme."
 VIN_CEFEO.25.t:0 "Sa Déc"
 VIN_CEFEO.25.d_killed:0 "La bombe de Sa Dec a atteint la voiture du général Chanson, et le général ainsi que le gouverneur de Saigon-Cholon sont morts. Le delta est ébranlé et des recrues arrivent parmi nos cadres en provenance de villages calmes il y a un mois.\n\nLe commandement français sera en colère et prudent. Nos cellules doivent être prêtes aux représailles."
 VIN_CEFEO.25.d_survived:0 "Le bombardier de Sa Dec était arrivé un peu trop tôt et le général Chanson a survécu avec quelques coupures. Le programme de pacification se poursuit et les villages surveillent pour savoir qui ils doivent craindre.\n\nNos cadres doivent creuser plus profondément et éviter les gestes futiles."
 VIN_CEFEO.25.a:0 "Recrutez dans les villages touchés par l'attaque."
 VIN_CEFEO.25.b:0 "Déplacez les planques et brûlez les listes."
 VIN_CEFEO.26.t:0 "Parachutistes du CEFEO sur les Bolovens"
 VIN_CEFEO.26.d:0 "Des avions de transport ont transporté un groupe aéroporté du CEFEO vers le plateau des Bolovens, où il a été placé sous les couleurs du Royal Lao. Nos colonnes d'Attapeu font désormais face à de nouveaux bataillons sur un terrain qu'elles croyaient ouvert.\n\nLa garnison est petite, mais elle peut tenir les routes du plateau et lier nos colonnes à un combat plus long que prévu. Le pont aérien montre également qu'Atlante n'est pas le seul appel au commandement expéditionnaire."
 VIN_CEFEO.26.a:0 "Sondez la nouvelle garnison."
 VIN_CEFEO.26.b:0 "Consolidez-vous derrière la chaîne annamite."
 VIN_CEFEO.27.t:0 "Le camp de Dien Bien Phu est déclaré établi"
 VIN_CEFEO.27.d:0 "Le commandement français a déclaré le camp retranché de Dien Bien Phu établi et aucun autre largage aéroporté n'est prévu dans le cadre de l'opération Castor. Nos observateurs dans la vallée confirment que la piste d'atterrissage, les points forts et les magasins sont déjà en place.\n\nQuel que soit l'objectif du camp, il s'agira désormais d'une position fixe plutôt que d'un atterrissage en cours. Nos commandants doivent planifier en fonction de cela."
 VIN_CEFEO.27.a:0 "Intensifiez la reconnaissance du camp."
 VIN_CEFEO.27.b:0 "Continuez les préparatifs sans hâte."
 VIN_CEFEO.28.t:0 "Le CEFEO tourne vers le nord"
 VIN_CEFEO.28.d:0 "Le trafic intercepté indique que le commandement français s'est prononcé contre l'offensive Atlante au centre du Vietnam et maintiendra ses réserves dans le nord. Des avions de transport ont été vus déplaçant des provisions et des parachutistes vers les aérodromes du nord-ouest.\n\nLa côte sud respire plus facilement, mais nos commandants du nord-ouest devront désormais faire face à des réserves qui autrement auraient pu partir ailleurs."
 VIN_CEFEO.28.a:0 "Préparez-vous à rencontrer les réserves du nord-ouest."
 VIN_CEFEO.28.b:0 "Ne mordez pas à l'hameçon ; respecter notre propre emploi du temps."
 VIN_CEFEO.29.t:0 "Atlante abandonné faute de fonds"
 VIN_CEFEO.29.d:0 "La rumeur vient de Saigon que le commandement français a abandonné ses projets d'offensive dans le centre du Vietnam : les crédits de guerre nécessaires pour la mener à bien ne sont pas là. Les unités affectées à l'opération ont été renvoyées dans leurs garnisons.\n\nLa côte ne connaîtra pas l'offensive pour l'instant et nos commandants au centre peuvent se consacrer à d'autres travaux."
 VIN_CEFEO.29.a:0 "Faites part aux cadres des difficultés françaises."
 VIN_CEFEO.29.b:0 "Gardez les unités prêtes ; les plans peuvent revenir."
 VIN_CEFEO.1.b:0 "Harcelez la colonne et cachez les magasins que nous pouvons."
 VIN_CEFEO.2.b:0 "Alerter les commandements régionaux."
 VIN_CEFEO.4.b:0 "Alerter les commandements régionaux."
 VIN_CEFEO.6.b:0 "Alerter les commandements régionaux."
 VIN_CEFEO.8.b:0 "Alerter les commandements régionaux."
 VIN_CEFEO.10.b:0 "Alerter les commandements régionaux."
 VIN_CEFEO.12.b:0 "Alerter les commandements régionaux."
 VIN_CEFEO.3.a:0 "Étudiez les leçons de l'opération."
 VIN_CEFEO.3.b:0 "Remonter le moral dans les districts touchés."
 VIN_CEFEO.5.a:0 "Étudiez les leçons de l'opération."
 VIN_CEFEO.5.b:0 "Remonter le moral dans les districts touchés."
 VIN_CEFEO.7.a:0 "Étudiez les leçons de l'opération."
 VIN_CEFEO.7.b:0 "Remonter le moral dans les districts touchés."
 VIN_CEFEO.9.a:0 "Étudiez les leçons de l'opération."
 VIN_CEFEO.9.b:0 "Remonter le moral dans les districts touchés."
 VIN_CEFEO.11.a:0 "Étudiez les leçons de l'opération."
 VIN_CEFEO.11.b:0 "Remonter le moral dans les districts touchés."
 VIN_CEFEO.13.a:0 "Étudiez les leçons de l'opération."
 VIN_CEFEO.13.b:0 "Remonter le moral dans les districts touchés."
 VIN_CEFEO.1.a:0 "Laissez-les remonter la rivière."
 VIN_CEFEO.1.d_deep:0 "Nos éclaireurs signalent des groupes mobiles et des parachutistes français remontant la rivière Clear en direction de Phu Doan. Il ne s'agit pas d'un raid : l'ennemi entend frapper profondément nos arrières et faire reculer les divisions du Nord-Ouest.\n\nL'état-major estime que la colonne manquera de ravitaillement. Plus il avance, plus le chemin qu'il doit suivre est long."
 VIN_CEFEO.1.d_limited:0 "Des groupes mobiles français ont traversé vers nos dépôts le long de Clear River. Cette force est modeste et son objectif semble limité : brûler les réserves qu'elle peut trouver et retirer avant que nous puissions nous concentrer.\n\nLes troupes régionales doivent harceler la colonne et cacher ce qui peut encore être déplacé."
 VIN_CEFEO.1.d_withheld:0 "Le commandement français a retenu ses groupes mobiles. Au lieu de frapper sur nos arrières, ils sont retenus autour de Na San pour défendre le Nord-Ouest.\n\nNos arrières sont épargnés pour l'instant, mais le camp retranché de Na San en sera plus fort."
 VIN_CEFEO.1.t:0 "Opération Lorraine"
 VIN_CEFEO.2.a:0 "Regardez-les et faites un rapport."
 VIN_CEFEO.2.d:0 "Les rapports de nos agents et des troupes régionales confirment que le corps expéditionnaire français a lancé l'opération Hirondelle : un raid parachutiste sur nos dépôts autour de Lang Son et Loc Binh.\n\nL'état-major a ordonné aux unités proches de Lang Son de garder le contact, d'éviter une bataille rangée aux conditions françaises et de signaler chaque mouvement."
 VIN_CEFEO.2.t:0 "Le CEFEO lance l'opération Hirondelle"
 VIN_CEFEO.3.d_clean:0 "L'opération Hirondelle est terminée et les Français ont réalisé ce qu'ils s'étaient fixé. Nos unités présentes dans la zone sont déséquilibrées et l'ennemi se retire en bon ordre.\n\nL'état-major étudiera comment l'attaque a été préparée pour que nous ne soyons plus surpris de la même manière."
 VIN_CEFEO.3.d_costly:0 "L'opération Hirondelle est terminée. Les Français atteignirent leur objectif, mais ils payèrent chaque kilomètre et reculèrent avec de lourdes pertes.\n\nNos unités ont tenu suffisamment longtemps pour rendre l'opération coûteuse. L'ennemi y réfléchira à deux fois avant de répéter l'opération."
 VIN_CEFEO.3.d_failure:0 "L'opération Hirondelle a échoué. Les Français s'écartent avant d'atteindre leur objectif et se replient sur leurs postes.\n\nNos troupes régionales et nos milices locales leur ont refusé le terrain. Les cadres répandent la nouvelle dans chaque village."
 VIN_CEFEO.3.d_superseded:0 "L'opération Hirondelle a été annulée. Une bataille plus large a attiré les réserves françaises ailleurs et les unités qui y étaient engagées ont été rappelées."
 VIN_CEFEO.3.t:0 "Fin de l'opération Hirondelle"
 VIN_CEFEO.4.a:0 "Regardez-les et faites un rapport."
 VIN_CEFEO.4.d:0 "Les rapports de nos agents et des troupes régionales confirment que le corps expéditionnaire français a lancé l'opération Mouette : une avancée sur Phu Nho Quan, à la limite du Delta.\n\nL'état-major général a ordonné aux unités proches de Phu Nho Quan de garder le contact, d'éviter une bataille rangée aux conditions françaises et de signaler chaque mouvement."
 VIN_CEFEO.4.t:0 "Le CEFEO lance l'opération Mouette"
 VIN_CEFEO.5.d_clean:0 "L'opération Mouette est terminée et les Français ont réalisé ce qu'ils s'étaient fixé. Nos unités présentes dans la zone sont déséquilibrées et l'ennemi se retire en bon ordre.\n\nL'état-major étudiera comment l'attaque a été préparée pour que nous ne soyons plus surpris de la même manière."
 VIN_CEFEO.5.d_costly:0 "L'opération Mouette est terminée. Les Français atteignirent leur objectif, mais ils payèrent chaque kilomètre et reculèrent avec de lourdes pertes.\n\nNos unités ont tenu suffisamment longtemps pour rendre l'opération coûteuse. L'ennemi y réfléchira à deux fois avant de répéter l'opération."
 VIN_CEFEO.5.d_failure:0 "L'opération Mouette a échoué. Les Français s'écartent avant d'atteindre leur objectif et se replient sur leurs postes.\n\nNos troupes régionales et nos milices locales leur ont refusé le terrain. Les cadres répandent la nouvelle dans chaque village."
 VIN_CEFEO.5.d_superseded:0 "L'opération Mouette a été annulée. Une bataille plus large a attiré les réserves françaises ailleurs et les unités qui y étaient engagées ont été rappelées."
 VIN_CEFEO.5.t:0 "Fin de l'opération Mouette"
 VIN_CEFEO.6.a:0 "Regardez-les et faites un rapport."
 VIN_CEFEO.6.d:0 "Les rapports de nos agents et des troupes régionales confirment que le corps expéditionnaire français a lancé l'opération Brochet : un ratissage du secteur Hung Yen à l'intérieur du Delta.\n\nL'état-major a ordonné aux unités proches de Hung Yen de garder le contact, d'éviter une bataille rangée aux conditions françaises et de signaler chaque mouvement."
 VIN_CEFEO.6.t:0 "Le CEFEO lance l'opération Brochet"
 VIN_CEFEO.7.d_clean:0 "L'opération Brochet est terminée et les Français ont réalisé ce qu'ils s'étaient fixé. Nos unités présentes dans la zone sont déséquilibrées et l'ennemi se retire en bon ordre.\n\nL'état-major étudiera comment l'attaque a été préparée pour que nous ne soyons plus surpris de la même manière."
 VIN_CEFEO.7.d_costly:0 "L'opération Brochet est terminée. Les Français atteignirent leur objectif, mais ils payèrent chaque kilomètre et reculèrent avec de lourdes pertes.\n\nNos unités ont tenu suffisamment longtemps pour rendre l'opération coûteuse. L'ennemi y réfléchira à deux fois avant de répéter l'opération."
 VIN_CEFEO.7.d_failure:0 "L'opération Brochet a échoué. Les Français s'écartent avant d'atteindre leur objectif et se replient sur leurs postes.\n\nNos troupes régionales et nos milices locales leur ont refusé le terrain. Les cadres répandent la nouvelle dans chaque village."
 VIN_CEFEO.7.d_superseded:0 "L'opération Brochet a été annulée. Une bataille plus large a attiré les réserves françaises ailleurs et les unités qui y étaient engagées ont été rappelées."
 VIN_CEFEO.7.t:0 "Opération Brochet Fins"
 VIN_CEFEO.8.a:0 "Regardez-les et faites un rapport."
 VIN_CEFEO.8.d:0 "Les rapports de nos agents et des troupes régionales confirment que le corps expéditionnaire français a lancé l'opération Castor : un largage aéroporté sur la vallée de Dien Bien Phu.\n\nL'état-major général a ordonné aux unités proches de Dien Bien Phu de garder le contact, d'éviter une bataille rangée aux conditions françaises et de signaler chaque mouvement."
 VIN_CEFEO.8.t:0 "Le CEFEO lance l'opération Castor"
 VIN_CEFEO.9.d_failure:0 "Le largage français sur Dien Bien Phu a échoué. Les parachutistes n'ont pas pu tenir la vallée et ont été retirés.\n\nLa route vers le Laos nous reste ouverte."
 VIN_CEFEO.9.d_success:0 "Les parachutistes français ont pris la vallée de Dien Bien Phu et y construisent une piste d'atterrissage et des points forts. Ils veulent en faire une forteresse à cheval sur notre route vers le Laos.\n\nL'état-major estime que les Français ont placé leurs meilleures troupes au fond d'un bassin que nous pouvons encercler."
 VIN_CEFEO.9.d_superseded:0 "Les Français ont abandonné l'opération Castor. Les événements ailleurs ont éloigné leur réserve aéroportée de la vallée."
 VIN_CEFEO.9.t:0 "Fonctionnement des extrémités des roulettes"
 VIN_CEFEO.10.a:0 "Regardez-les et faites un rapport."
 VIN_CEFEO.10.d:0 "Les rapports de nos agents et des troupes régionales confirment que le corps expéditionnaire français a entamé l'opération Pollux : l'évacuation de la garnison de Lai Chau vers Dien Bien Phu.\n\nL'état-major général a ordonné aux unités proches de Lai Chau de garder le contact, d'éviter une bataille rangée aux conditions françaises et de signaler chaque mouvement."
 VIN_CEFEO.10.t:0 "Le CEFEO lance l'opération Pollux"
 VIN_CEFEO.11.d_loss:0 "La colonne de Lai Chau n'atteignit jamais Dien Bien Phu. Nos unités l'ont attrapé sur les sentiers de montagne et la plupart des compagnies Tai ont été détruites ou dispersées.\n\nLes Français ont perdu le dernier de leurs postes dans l'extrême Nord-Ouest."
 VIN_CEFEO.11.d_preserved:0 "La garnison de Lai Chau est en sécurité. Les Français et leurs auxiliaires Tai s'enfuirent avant que nos unités puissent fermer les pistes derrière eux."
 VIN_CEFEO.11.d_superseded:0 "Les Français ont renoncé à l'évacuation de Lai Chau. Une bataille plus vaste a pris le dessus sur l'opération."
 VIN_CEFEO.11.t:0 "Fin de l'opération Pollux"
 VIN_CEFEO.12.a:0 "Regardez-les et faites un rapport."
 VIN_CEFEO.12.d:0 "Les rapports de nos agents et des troupes régionales confirment que le corps expéditionnaire français a lancé l'opération Atlante : une offensive contre notre base dans l'Interzone V sur la côte centrale.\n\nL'état-major a ordonné aux unités proches de l'Interzone V de garder le contact, d'éviter une bataille rangée aux conditions françaises et de signaler chaque mouvement."
 VIN_CEFEO.12.t:0 "Le CEFEO lance l'opération Atlante"
 VIN_CEFEO.13.d_north:0 "Les Français ont retiré leurs unités du centre du Vietnam pour renforcer le Nord. L'offensive contre l'Interzone V a perdu de sa force.\n\nNotre pression au Nord oblige l'ennemi à choisir."
 VIN_CEFEO.13.d_stalled:0 "L'offensive française au centre du Vietnam est au point mort. Nos forces régionales tiennent la base de l'Interzone V et les colonnes ennemies s'enlisent."
 VIN_CEFEO.13.d_success:0 "L'offensive française au centre du Vietnam gagne du terrain. Notre zone de base dans l'Interzone V a été cambriolée et l'Armée nationale vietnamienne détient une partie de la côte.\n\nLe commandement sud rapporte que les cadres se sont déplacés vers l'intérieur du pays et que la lutte continue."
 VIN_CEFEO.13.d_superseded:0 "L'offensive française dans le centre du Vietnam a été dépassée par la colonisation plus large."
 VIN_CEFEO.13.t:0 "Fin de l'opération Atlante"
 VIN_Danh.1.t:0 "Lettres de Prague"
 VIN_Danh.1.d:0 "Tran Ngoc Danh, qui a quitté son poste de représentant en France pour la Tchécoslovaquie sans l'autorisation du Comité central, a envoyé un dossier à Moscou par l'intermédiaire du Parti communiste tchécoslovaque. Ses lettres accusent le Parti de minimiser la Révolution d'Octobre, de tendance opportuniste et boukharinienne et de faire passer les intérêts nationaux avant les intérêts de classe.\n\nIl va plus loin : il affirme que le Comité central isole ses critiques, que les camarades s'accrochent à leurs postes et qu'à peine deux pour cent des membres sont issus de la classe ouvrière et de la paysannerie. Des exemplaires parviennent déjà aux cadres du Bac Viet.\n\nLa querelle ne restera pas sur le papier. D'ici un an, soit la faction de Danh s'opposera au président, soit elle sera brisée. Nous devons décider où nous en sommes."
 VIN_Danh.1.a:0 "Danh a raison. Le Parti doit revenir à la ligne orthodoxe."
 VIN_Danh.1.b:0 "Soyez aux côtés du président Ho. Danh a déserté son poste."
 VIN_Danh.2.t:0 "Le dossier Danh"
 VIN_Danh.2.d:0 "Au milieu des préparatifs de l'anniversaire du camarade Staline, la Commission de politique étrangère dirigée par V.G. Grigoryan a transmis un dossier au Politburo. Il contient les lettres de Tran Ngoc Danh, un communiste vietnamien à Prague, ainsi que des dossiers du Komintern sur lui et sur Hô Chi Minh.\n\nDanh accuse Ho de déviation nationaliste, d'hostilité envers l'Union soviétique et de sympathie pour Tito. Ho a même déclaré à des journalistes étrangers que le Vietnam pourrait être neutre comme la Suisse.\n\nI. Kozlov, de la Commission, qualifie ces accusations de générales et d'irréalistes, mais admet que certaines déclarations de Ho sont déroutantes, voire suspectes. Avec si peu d'informations fiables sur le Vietnam, le verdict nous appartient."
 VIN_Danh.2.a:0 "Kozlov a raison. Hô Chi Minh est un camarade du camp socialiste."
 VIN_Danh.2.b:0 "Gardez le fichier ouvert. Nous surveillerons de près le camarade Ho."
 VIN_Danh.3.t:0 "Les conspirateurs se réunissent"
 VIN_Danh.3.d:0 "Dans une cabane à l'extérieur de Thai Nguyen, les cadres qui ont répondu aux lettres de Tran Ngoc Danh se sont réunis pour la première fois comme quelque chose de plus qu'un cercle de lecture. Ils conviennent que le Président ne corrigera jamais lui-même la ligne du Parti.\n\nIls ne sont pas d'accord sur par où commencer. Certains veulent construire des cellules tranquilles dans les écoles du Parti et attendre. D'autres veulent s'attaquer maintenant aux hommes autour d'Hô Chi Minh, avant que le Comité central ne réalise ce qui se passe."
 VIN_Danh.3.a:0 "Construisez d'abord les cellules. La patience gagne."
 VIN_Danh.3.b:0 "Frappez les hommes de Ho maintenant."
 VIN_Danh.4.t:0 "La cellule de Moscou"
 VIN_Danh.4.d:0 "Nos coursiers sont parvenus jusqu'aux étudiants et cadres vietnamiens vivant à Moscou. Beaucoup d'entre eux sont déjà déçus par les dirigeants de leur pays et désireux d'aider.\n\nIls peuvent recruter leurs camarades de classe et les renvoyer chez eux comme organisateurs, ou ils peuvent travailler par l'intermédiaire de la Commission de politique étrangère pour faire valoir notre cause directement auprès des camarades soviétiques. Quoi qu'il en soit, les travaux nous coûteront cher."
 VIN_Danh.4.a:0 "Renvoyez les étudiants chez eux en tant qu'organisateurs."
 VIN_Danh.4.b:0 "Travaillez via la commission de Grigoryan."
 VIN_Danh.10.t:0 "Une demande du Bac Viet"
 VIN_Danh.10.d:0 "Des agents de la faction de Tran Ngoc Danh ont contacté notre ambassade à Pékin avec une demande inhabituelle. Ils demandent que des fusils et de l'argent soient livrés non pas au gouvernement d'Hô Chi Minh, mais aux cadres orthodoxes qui s'opposent à lui.\n\nLes fournir nous donnerait une faction loyale au sein du Parti vietnamien. Cela signifierait également armer l'un des côtés d'une querelle entre communistes, ce que Hô Chi Minh ne pardonnerait jamais s'il en avait connaissance."
 VIN_Danh.10.a:0 "Envoyez l'envoi. Les camarades fidèles méritent notre aide."
 VIN_Danh.10.b:0 "Nous n'armons pas les factions contre un parti fraternel."
 VIN_Danh.11.t:0 "Danh demande la bénédiction du camarade Staline"
 VIN_Danh.11.d:0 "Une lettre de Tran Ngoc Danh est arrivée au bureau du camarade Staline. Danh déclare que le Parti vietnamien est tombé dans une déviation nationaliste et que ses camarades sont prêts à évincer Hô Chi Minh de la direction. Il ne demande qu'une chose : l'assurance que l'Union soviétique reconnaîtra et soutiendra la nouvelle direction.\n\nKozlov prévient que Ho est populaire et qu'un coup d'État en pleine guerre contre la France pourrait livrer l'Indochine aux impérialistes. Grigoryan répond qu'un leadership fiable à Hanoï en vaut la peine."
 VIN_Danh.11.a:0 "L'Union Soviétique se tiendra aux côtés des camarades orthodoxes."
 VIN_Danh.11.b:0 "Moscou ne renverse pas les partis frères. Ho reste."
 VIN_Danh.13.t:0 "Mot de Moscou"
 VIN_Danh.13.d_aid:0 "Les premières caisses sont arrivées par la frontière nord, adressées aux hommes de confiance de Danh. Moscou a choisi de nous aider. La nouvelle de l'envoi se répand rapidement parmi les cadres orthodoxes."
 VIN_Danh.13.d_no_aid:0 "Moscou a refusé de nous envoyer quoi que ce soit. Les camarades soviétiques ne veulent pas armer une faction d'un parti frère contre une autre, et nos courriers sont rentrés les mains vides. Certains de nos partisans se demandent déjà si Danh n'a pas surestimé ses amis du Kremlin."
 VIN_Danh.13.d_permit:0 "Un courrier de Moscou a apporté une brève réponse. Le camarade Staline a lu la lettre de Danh et l'Union Soviétique reconnaîtra une nouvelle direction à Hanoï. Les cadres orthodoxes savent désormais que le Kremlin est derrière eux."
 VIN_Danh.13.d_refuse:0 "Un courrier de Moscou a apporté une brève réponse. Le camarade Staline ne soutiendra aucune action contre Hô Chi Minh et les camarades soviétiques conseillent à Danh de se soumettre à la discipline du Parti. Sans le Kremlin, nombre de nos alliés s'éloignent."
 VIN_Danh.13.a:0 "Les armes seront utilisées à bon escient."
 VIN_Danh.13.b:0 "Ensuite, nous nous débrouillerons sans eux."
 VIN_Danh.13.c:0 "Le Kremlin est avec nous."
 VIN_Danh.13.d:0 "Nous sommes seuls."
 VIN_Danh.20.t:0 "La ligne orthodoxe prévaut"
 VIN_Danh.20.d:0 "Avant l'aube, des unités fidèles au groupe militaire Giang-Liem ont encerclé le quartier général du Comité central au Viet Bac. Les alliés les plus proches d'Hô Chi Minh ont été arrêtés sans coup férir, et le président lui-même a été informé que le Parti n'avait plus besoin de lui.\n\nA midi, Tran Ngoc Danh s'est adressé aux cadres en tant que secrétaire général. Il a promis de ramener le Parti au marxisme-léninisme, de mettre fin aux compromissions du front national et de faire entrer le Vietnam dans le camp socialiste en tant que membre loyal. La reconnaissance de Moscou a suivi en quelques heures."
 VIN_Danh.20.a:0 "Vive le Secrétaire Général !"
 VIN_Danh.21.t:0 "Le complot démasqué"
 VIN_Danh.21.d:0 "Le coup d'État a échoué en quelques heures. Les unités que nous croyions fidèles sont restées dans leurs casernes et le ministère de la Sécurité publique a arrêté les principaux conspirateurs avant qu'ils n'atteignent le Comité central. La faction de Tran Ngoc Danh est brisée.\n\nLe Parti doit maintenant décider comment traiter les traîtres. Un procès public mettrait en garde tous les cadres contre le factionnalisme, mais il révélerait également à quel point les camarades soviétiques ont écouté Danh. Une purge discrète épargnerait à Moscou un embarras, mais cela aurait un coût."
 VIN_Danh.21.a:0 "Essayez-les publiquement. Que chaque cadre le voie."
 VIN_Danh.21.b:0 "Purgez-les tranquillement et rassurez Moscou."
 VIN_Danh.20.d_ho:0 "Avant l'aube, des unités fidèles à Tran Ngoc Danh ont encerclé le siège du Comité central au Viet Bac. Les gardes du président étaient en infériorité numérique et, comme Moscou soutenait ouvertement les conspirateurs, peu d'officiers étaient prêts à se battre pour lui.\n\nA midi, Danh s'est adressé aux cadres en tant que secrétaire général. Hô Chi Minh, qui a mené la révolution pendant trente ans, s'est fait dire que le Parti n'avait plus besoin de lui. La reconnaissance de Moscou a suivi en quelques heures."
 VIN_Danh.21.d_ho:0 "La faction de Tran Ngoc Danh s'est finalement opposée au président et a échoué. Sans suffisamment de cadres ni le Kremlin derrière eux, les conspirateurs furent arrêtés avant d'atteindre le Comité central et l'armée resta fidèle à Hô Chi Minh.\n\nLe Parti doit maintenant décider comment traiter les traîtres. Un procès public mettrait en garde tous les cadres contre le factionnalisme, mais il révélerait également à quel point les camarades soviétiques ont écouté Danh. Une purge discrète épargnerait à Moscou un embarras, mais cela aurait un coût."
 VIN_Danh.30.t:0 "[GetNewspaperHeader]Coup d'État au Bac Viet"
 VIN_Danh.30.d:0 "Viet Bac, [?global.date.GetDateStringNoHourLong] - Hô Chi Minh a été démis de la direction du mouvement communiste vietnamien lors d'un coup d'État organisé par la faction orthodoxe de Tran Ngoc Danh. Les informations provenant de la zone de résistance indiquent que les alliés les plus proches du président ont été arrêtés avant l'aube, avec peu de résistance de la part de l'armée.\n\nDanh, un frère cadet du premier secrétaire général Tran Phu, a passé des années à Paris et à Prague pour dénoncer Ho comme un nationaliste et un opportuniste. Les nouveaux dirigeants promettent de suivre le modèle soviétique sans compromis et Moscou a déjà étendu sa reconnaissance.\n\nLes observateurs à Paris ne s'attendent à aucun changement dans la guerre contre la France, mais préviennent qu'un leadership si dépendant du Kremlin pourrait approfondir le conflit en Indochine dans la confrontation entre les blocs."
 VIN_Danh.30.a:0 "Moscou resserre son emprise sur l'Indochine."
 VIN_Danh.40.t:0 "Le Liem et le Nouveau Parcours"
 VIN_Danh.40.d:0 "La mort du camarade Staline a ébranlé le Parti. Le Liem, qui a dirigé notre travail politique en tant qu'allié le plus orthodoxe du secrétaire général, affirme désormais que les camarades soviétiques sont en train de réviser les anciennes méthodes et que le Vietnam doit suivre la nouvelle voie de Moscou.\n\nLe secrétaire général doit décider s'il doit laisser Le Liem diriger le Parti vers des réformes ou s'il doit le destituer avant que ses idées ne se répandent."
 VIN_Danh.40.a:0 "Moscou est en tête. Laissons Le Liem suivre le nouveau cap."
 VIN_Danh.40.b:0 "Le révisionnisme n'a pas sa place ici. Retirez-le."
 VIN_Danh.12.t:0 "Hanoï demande des volontaires"
 VIN_Danh.12.d:0 "Le secrétaire général Tran Ngoc Danh nous a demandé des instructeurs soviétiques et un ensemble d'armes, d'artillerie, de camions et de matériel de soutien pour construire une nouvelle armée sur le modèle soviétique.\n\nLa demande est modeste par rapport à nos normes, et Danh est notre allié le plus fidèle en Asie du Sud-Est. Pourtant, chaque fusil envoyé en Indochine n'est pas disponible ailleurs."
 VIN_Danh.12.a:0 "Envoyez les instructeurs et le matériel."
 VIN_Danh.12.b:0 "Hanoï doit se contenter de ce dont elle dispose."
 VIN_Danh.13.d_volunteers:0 "Des instructeurs soviétiques sont arrivés au Viet Bac avec des caisses de fusils, d'armes à feu, de camions et de matériel de campagne. En quelques semaines, nos officiers se familiarisent avec les réglementations soviétiques."
 VIN_Danh.13.d_no_volunteers:0 "Moscou a répondu qu'elle ne pouvait pas nous épargner d'instructeurs ni de matériel pour le moment. La nouvelle armée devra être construite avec nos propres ressources."
 VIN_Danh.13.e:0 "Nos officiers apprendront rapidement."
 VIN_Danh.13.f:0 "Ensuite, nous comptons sur nous-mêmes."
 VIN_Danh.50.t:0 "Soviétisation des forces armées"
 VIN_Danh.50.d:0 "L'état-major a élaboré des plans pour réorganiser l'Armée populaire selon les principes soviétiques. Les officiers formés pendant les années de guérilla sont divisés sur la distance à parcourir.\n\nCertains souhaitent que les réglementations soviétiques soient adoptées en bloc, à un coût considérable. D'autres soutiennent que les commissaires politiques de chaque régiment comptent plus que les manuels."
 VIN_Danh.50.a:0 "Adoptez les règlements soviétiques sur le terrain."
 VIN_Danh.50.b:0 "Un commissaire dans chaque régiment."
 VIN_Danh.51.t:0 "Imiter l'Armée rouge"
 VIN_Danh.51.d:0 "Nos officiers ont étudié comment l'Armée rouge combinait les réseaux radio avec les groupes de choc. Nous n'avons pas les moyens de tout copier d'un coup.\n\nNous pouvons investir dans des équipements de radio et de transmission, ou dans la formation des unités de choc aux nouvelles tactiques."
 VIN_Danh.51.a:0 "La radio d'abord."
 VIN_Danh.51.b:0 "Former les groupes de choc."
 VIN_Danh.52.t:0 "Étudier la Grande Guerre patriotique"
 VIN_Danh.52.d:0 "Les officiers revenant des académies soviétiques ont ramené deux leçons de la guerre contre l'Allemagne. Une école souligne les opérations approfondies qui ont conduit l'Armée rouge jusqu'à Berlin ; l'autre aux défenses en couches qui ont brisé la Wehrmacht à Koursk.\n\nNotre armée ne peut bien maîtriser qu'une seule doctrine."
 VIN_Danh.52.a:0 "Bataille profonde. Nous frapperons les arrières de l'ennemi."
 VIN_Danh.52.b:0 "Défense en profondeur. Laissons l'ennemi percer nos lignes."
 VIN_Danh.53.t:0 "Suggestions du général Loi"
 VIN_Danh.53.d:0 "Le général La Vinh Loi a présenté au secrétaire général une liste de commandants dont la première loyauté, dit-il, reste envers Ho Chi Minh. A sa tête se trouvent Vo Nguyen Giap et Nguyen Chi Thanh, suivis de Van Tien Dung et Hoang Van Thai.\n\nLeur retrait garantirait à l'armée la sécurité de la nouvelle ligne, mais ce sont les commandants les plus expérimentés dont nous disposons."
 VIN_Danh.53.a:0 "Supprimez-les tous."
 VIN_Danh.53.b:0 "Supprimez uniquement Giap et Thanh."
 VIN_Danh.53.c:0 "Nous en avons encore besoin. Surveillez-les attentivement."
 VIN_Tang.1.t:0 "Lettre de Tang Tuyet Minh"
 VIN_Tang.1.d:0 "Un curieux message est parvenu à la République démocratique du Vietnam depuis Guangzhou. Son expéditeur est Tang Tuyet Minh, une sage-femme catholique chinoise qui a partagé sa vie avec Nguyen Ai Quoc pendant ses années en Chine.\n\nLes deux se sont rencontrés à Guangzhou en 1926 et s'y sont mariés le 18 octobre, avec Cai Chang et Deng Yingchao, l'épouse de Zhou Enlai, qui auraient servi de témoins. Le couple vivait dans la résidence de Mikhaïl Borodine, le conseiller soviétique de la révolution chinoise. Le mariage n'a pas duré. Lorsque le Kuomintang s'en est pris aux communistes à Shanghai et à Guangzhou en 1927, Nguyen Ai Quoc a été contraint de fuir et Tang est resté sur place. On dit qu'elle était enceinte et, sur les conseils de sa mère, elle a mis fin à sa grossesse, craignant que l'enfant ne les mette en danger ou ne l'éloigne de la révolution.\n\nIls ne se sont jamais revus et le mariage n'a jamais été officiellement dissous. Certains récits suggèrent qu'il s'agissait en partie d'un arrangement pratique visant à héberger un révolutionnaire clandestin sur le territoire du Kuomintang. Pendant plus de vingt ans, Tang ne savait rien de son sort, jusqu'à ce qu'elle reconnaisse son visage sur une photo de journal d'Ho Chi Minh, président de la République démocratique du Vietnam. Elle a maintenant écrit à notre représentant à Pékin pour lui demander de rétablir le contact."
 VIN_Tang.1.a:0 "Les divagations d'un inconnu. Classez-le."
 VIN_Tang.1.b:0 "Elle est la femme d'oncle Ho. Nous devons la rejoindre."
 VIN_Tang.2.t:0 "Une autre lettre de Guangzhou"
 VIN_Tang.2.d:0 "Six ans après sa première tentative, Tang Tuyet Minh a de nouveau écrit à la République démocratique du Vietnam. La lettre est brève, formelle et soigneusement rédigée. Elle s'interroge une fois de plus sur le sort de Nguyen Ai Quoc, désormais connu dans le monde entier sous le nom de Hô Chi Minh, et si les contacts pourraient reprendre après près de trois décennies d'intervalle. Une fois de plus, il transite par notre ambassade à Pékin et, une fois de plus, Hanoï n'a pas répondu.\n\nL'image publique du président est désormais liée à la révolution elle-même. Il est le « Cha gia dan toc », le Père de la Nation, un homme dont le discours officiel laisse volontairement dans l'ombre la vie privée. La direction du Parti considère cette image comme trop précieuse pour la risquer. Reconnaissant que Tang rouvrirait un chapitre du passé de Ho, le Parti n'a aucune envie de revisiter et de compliquer l'histoire d'un révolutionnaire qui a tout abandonné pour la libération nationale.\n\nLe Politburo a discuté de la question en toute confidentialité. Le Duan est fermement opposé à toute réunion ou reconnaissance publique, arguant que la révélation d'un mariage nuirait au rôle symbolique du président et au moral du peuple. Pendant ce temps, les camarades chinois, conscients de sa persistance, ont discrètement dit à Tang d'arrêter d'écrire. En échange, ils ont promis que ses besoins matériels et son bien-être seraient pris en charge."
 VIN_Tang.2.a:0 "Le camarade Le Duan a raison. Les camarades chinois s'occuperont d'elle."
 VIN_Tang.2.b:0 "Oncle Ho veut la revoir."
 VIN_Tang.3.t:0 "Une réunion à Guangzhou"
 VIN_Tang.3.d:0 "Le message de Guangzhou ne pouvait être ignoré. Tang Tuyet Minh, la sage-femme catholique chinoise qui a partagé la vie de Nguyen Ai Quoc pendant ses premières années révolutionnaires en Chine, n'a demandé qu'une chance de rencontrer l'homme qu'elle a connu autrefois comme son mari. Hô Chi Minh a décidé de lui répondre lui-même.\n\nLeur histoire remonte au 18 octobre 1926, lorsqu'ils se sont mariés à Guangzhou devant Cai Chang et Deng Yingchao et ont élu domicile dans la résidence de Mikhaïl Borodine. La crise de 1927 chassa Nguyen Ai Quoc de Chine et laissa Tang derrière lui. Craignant pour sa mère et son enfant, elle mit fin à sa grossesse sur les conseils de sa mère et vécut pendant plus de vingt ans avec le souvenir d'un mari disparu dans la clandestinité. Aujourd'hui, ce révolutionnaire est revenu sous le nom de président Hô Chi Minh.\n\nHo a rencontré Tang en privé et, plutôt que de nier leur passé, il l'a reconnue publiquement comme son épouse et une camarade qui a partagé les dangers de son premier combat. Il parle de leur séparation non pas comme d'un scandale mais comme d'un des nombreux sacrifices personnels qu'exige la lutte pour l'indépendance. Sa foi catholique et sa nationalité chinoise ne sont pas un obstacle : pour Ho, la révolution appartient à tous ceux qui y ont donné. Le gouvernement a donné à Tang une place d'honneur dans l'histoire révolutionnaire en tant que camarade."
 VIN_Tang.3.a:0 "Elle est la mère d'un Vietnam nouveau, révolutionnaire et socialiste."
 VIN_Tang.4.t:0 "Le mariage secret du président"
 VIN_Tang.4.d:0 "Nos collaborateurs à Pékin ont fait leur travail. Des copies de la lettre restée sans réponse de Tang Tuyet Minh sont entre les mains de la faction de Tran Ngoc Danh, ainsi que l'histoire qui se cache derrière : une épouse chinoise pratiquant l'église, mariée en 1926 dans la maison de Mikhaïl Borodine, une grossesse terminée en secret et un mari qui ne l'a jamais reconnue.\n\nPour un homme que le Parti présente comme ayant consacré toute sa vie à la nation, c'est une histoire dommageable. Les camarades de Danh voient deux manières de l'utiliser. Imprimée dans les bulletins des cadres, elle ébranlerait la position du président au sein du Parti, même si une telle querelle publique déstabiliserait le pays tout entier. Transmis discrètement aux conseillers soviétiques, cela coûterait moins cher à Ho chez lui mais dirait à Moscou qu'on ne peut pas faire confiance au président, même avec son propre passé."
 VIN_Tang.4.a:0 "Imprimez-le dans les bulletins des cadres. Que tout le Parti le lise."
 VIN_Tang.4.b:0 "Informez les conseillers soviétiques en toute confidentialité."
 VIN_Tang.4.d_alt:0 "Nos gens ont fait leur travail. La faction de Tran Ngoc Danh détient désormais toute l'histoire de Tang Tuyet Minh : une femme chinoise pratiquante mariée en 1926 dans la maison de Mikhaïl Borodine, une grossesse terminée en secret, une lettre de Guangzhou à laquelle le président n'a jamais répondu, et une femme qui a fui le Kuomintang jusqu'à notre frontière et vit maintenant tranquillement à [Root.Capital.GetName], toujours ignorée par le mari qu'elle a traversé pour trouver un pays en guerre.\n\nPour un homme que le Parti présente comme ayant donné toute sa vie à la nation, c'est une histoire dommageable, et le témoin lui-même n'habite qu'à quelques rues de là. Les camarades de Danh voient deux manières de l'utiliser. Imprimée dans les bulletins des cadres, elle ébranlerait la position du président au sein du Parti, même si une telle querelle publique déstabiliserait le pays tout entier. Transmis discrètement aux conseillers soviétiques, cela coûterait moins cher à Ho chez lui mais dirait à Moscou qu'on ne peut pas faire confiance au président, même avec son propre passé."
 VIN_Tang.3.t_alt:0 "La mère du Vietnam révolutionnaire"
 VIN_Tang.3.d_alt:0 "[Root.Capital.GetName], République démocratique du Vietnam\n\nAprès plus de deux décennies d'intervalle, Hô Chi Minh a reçu Tang Tuyet Minh en personne. La sage-femme chinoise qui a partagé sa vie pendant ses années révolutionnaires à Guangzhou est parvenue à mettre fin à une séparation imposée par les luttes clandestines, les bouleversements et la guerre. Ils se marièrent en octobre 1926, alors qu'il était encore Nguyen Ai Quoc, travaillant pour la révolution en Chine. La purge des communistes par le Kuomintang en 1927 le força à fuir et l'abandonna derrière elle, et pendant plus de vingt ans, elle vécut sans savoir s'il reviendrait un jour.\n\nAujourd'hui, Ho la reconnaît non seulement comme une compagne de sa jeunesse, mais aussi comme une compagne de voyage dès les premières années de son voyage révolutionnaire. Il l'a accueillie dans la jeune république et a honoré les épreuves qu'elle a endurées alors que sa lutte le portait à travers les continents. Il l'appelle « la Mère du Vietnam révolutionnaire », un hommage à la place qu'elle occupe dans l'histoire personnelle de la révolution plutôt qu'à celle d'une fonction publique."
 VIN_Tang.5.t:0 "Le retour de Tang Tuyet Minh"
 VIN_Tang.5.d:0 "Frontière sino-vietnamienne\n\nUne remarquable demande d'asile a atteint la République démocratique du Vietnam. Fuyant les représailles du Kuomintang victorieux, une sage-femme catholique chinoise nommée Tang Tuyet Minh est arrivée à la frontière et a demandé à être admise au Vietnam. Son affirmation a surpris nos agents frontaliers : elle dit qu'elle est l'épouse du président Ho Chi Minh.\n\nElle rencontra Nguyen Ai Quoc à Guangzhou en 1926, au cours de son travail révolutionnaire en Chine, et ils s'y marièrent le 18 octobre, apparemment avec Cai Chang et Deng Yingchao comme témoins. Ils vivaient ensemble dans la résidence du conseiller soviétique Mikhaïl Borodine. Lorsque le Kuomintang s'en est pris aux communistes en 1927, Nguyen Ai Quoc a été contraint de fuir et Tang est resté sur place. Ils ne se sont jamais revus.\n\nPendant des années, elle ne savait rien de son sort, jusqu'à ce qu'elle reconnaisse son visage sur une photo de journal du président d'un Vietnam indépendant. Aujourd'hui, alors que le Kuomintang traque toute personne liée aux communistes, elle a entrepris le dangereux voyage vers le sud, en espérant que notre gouvernement reconnaîtra ses prétentions et lui accordera un refuge."
 VIN_Tang.5.a:0 "Laissez-la entrer en tant que simple citoyenne."
 VIN_Tang.5.b:0 "Elle est la femme d'oncle Ho. Amenez-la au président."
 VIN_Tang.6.t:0 "Des retrouvailles à [Root.Capital.GetName]"
 VIN_Tang.6.d:0 "[Root.Capital.GetName], République démocratique du Vietnam\n\nAprès des semaines d'incertitude à la frontière, Tang Tuyet Minh a obtenu le passage. Escortée vers le sud par nos responsables, la sage-femme chinoise a atteint la capitale avec un seul objectif : rencontrer le président Ho Chi Minh, celui qu'elle a connu sous le nom de Nguyen Ai Quoc il y a plus de vingt ans.\n\nElle a répété son récit de leur mariage à Guangzhou en 1926 et insiste sur le fait que le temps n'a pas effacé leur lien. Elle ne demande qu'une audience privée, espérant qu'il la reconnaîtra ainsi que leur passé commun. Son arrivée a suscité une grande curiosité parmi les responsables, dont peu connaissent la vie du président avant la révolution d'août.\n\nPour Hô Chi Minh, il s'agit d'une décision difficile et profondément personnelle. En tant que chef d'État, il a peu de place pour les affaires privées, et ses années en Chine rendent toute reconnaissance publique politiquement sensible. Pourtant, elle a traversé un pays déchiré par la guerre civile et a risqué sa vie pour avoir la chance de le revoir."
 VIN_Tang.6.a:0 "Accordez-lui une pension et laissez l'affaire en suspens."
 VIN_Tang.6.b:0 "Oncle Ho veut la revoir."
