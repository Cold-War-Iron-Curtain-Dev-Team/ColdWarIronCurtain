l_french:
 Baluchistan_Uprising.100.d:0 "Les principales tribus sardars du Baloutchistan ont adressé une liste de revendications au gouvernement. Ils réclament essentiellement l'autonomie, le contrôle du développement et les bénéfices tirés de l'extraction des ressources. Nos hauts responsables fédéraux et militaires de la province notent que les Sardars tribaux maintiennent la mainmise sur la population et imposent des lois tribales archaïques. Ils notent également que le Baloutchistan a une population relativement plus petite et est riche en ressources nationales, et ils recommandent fortement que nous rejetions les demandes. Certains conseillers politiques préviennent que le refus de ces demandes pourrait provoquer un soulèvement, même si cela nous ferait perdre l'accès aux ressources du Baloutchistan."
 Baluchistan_Uprising.101.d:0 "Le général Rahimuddin Khan a été nommé gouverneur du Baloutchistan. Son tempérament et son expérience le rendent idéal pour cette tâche. À l'heure actuelle, nous disposons certainement de la puissance de feu militaire nécessaire pour réprimer les rebelles, mais sans une gouvernance efficace, tout gain militaire disparaîtra rapidement. Le gouvernement provincial n'est pas fiable et a contribué à provoquer la crise en premier lieu. Un gouvernement militaire efficace doit être établi pour rétablir l'ordre dans la province. Le nouveau gouverneur supervisera le rétablissement de la gouvernance, dialoguera avec les dirigeants politiques baloutches et veillera à la fin du conflit. Avec le soutien militaire, nous espérons que la situation politique se stabilisera rapidement."
 Baluchistan_Uprising.0.d:0 "Suite au rejet de leurs demandes, de nombreux sardars baloutches ont fui vers les montagnes avec leurs loyalistes. Ces derniers jours, ils ont lancé des attaques armées visant les avant-postes de la police et des paramilitaires. Ces raids semblent axés sur la capture d'armes et l'interception des principales voies de transport. Nos responsables dans les villages clés ont été contraints de fuir après avoir été menacés. L'armée a rejeté ces actions, soulignant que de nombreux mécréants baloutches sont armés de fusils d'époque et n'ont pas le nombre ou la formation nécessaires pour constituer une menace sérieuse pour le Pakitan."
 Baluchistan_Uprising.1.d:0 "Malgré la confiance exprimée par le GHQ à Rawalpindi, les rangs des combattants tribaux baloutches se sont grossis ces dernières semaines. En outre, leurs attaques sont devenues plus nombreuses et plus sophistiquées. Les défections de la police et des troupes paramilitaires de l'ethnie baloutche sont particulièrement préoccupantes. De nombreux officiers paramilitaires ont exprimé leur inquiétude quant à l'efficacité au combat et à la fiabilité de leurs forces. Depuis Quetta, les autorités s'inquiètent du fait que même si les rebelles semblent opérer dans les montagnes, si l'action n'est pas rapide, ils pourraient bientôt tenter de s'emparer des villages et des villes. L'armée pakistanaise a annoncé son intention de déployer immédiatement des troupes dans la province et de mettre fin à la rébellion. L'armée promet une résolution rapide, mais ses évaluations ont été trop optimistes dans le passé."
 Baluchistan_Uprising.2.d:0 "Le gouvernement pakistanais a récemment envoyé une mission diplomatique et militaire de haut niveau pour rendre visite à nos dirigeants. Ils ont présenté un rapport sur les troubles en cours au Baloutchistan et ont partagé des renseignements indiquant que les rebelles baloutches établissent des liens avec les dirigeants baloutches iraniens. Il est clair que si les rebelles réussissent, ils pourraient finir par attiser notre propre population baloutche ou chercher à étendre leur contrôle sur notre propre territoire. Nous devons décider quel niveau de soutien apporter au Pakistan ; nous pouvons offrir un soutien économique, notamment avec des subventions pétrolières et militaires. Certains de nos plus hauts dirigeants militaires estiment qu'il est dans notre intérêt de fournir un soutien à la fois militaire et économique. Quoi qu'il en soit, nous devons offrir une certaine aide aux Pakistanais dans cette période difficile."
 Baluchistan_Uprising.3.d:0 "Les Pakistanais ont récemment annoncé une série de restrictions sur les déplacements vers le Baloutchistan depuis l'Afghanistan. Cela nuira à notre économie mais, plus important encore, séparera les familles qui vivent le long de la frontière. Les Pakistanais cherchent clairement à punir le peuple baloutche pour ses justes revendications. Cela ne fait que redoubler nos propres efforts pour défendre la cause des peuples pachtoun et baloutche vivant sous la botte de l'armée pakistanaise. Nous condamnerons fermement cette action et resterons vigilants face à une agression potentielle. Nous autoriserons également les Baloutches à diffuser leur message depuis nos tours radio."
 Baluchistan_Uprising.4.d:0 "Le gouvernement pakistanais a annoncé que sa marine patrouillerait et bloquerait le Baloutchistan contre la contrebande d'armes et de fournitures vers les rebelles. Les Pakistanais prétendent que ce sont les puissances étrangères qui aggravent la situation et nous en accusent ouvertement. Il s'agit clairement de propagande destinée à couvrir les politiques oppressives et les tactiques brutales de l'armée. Nos propres services de renseignement continueront à apporter leur soutien au peuple baloutche, même si celui-ci sera désormais limité. Ces actions témoignent du désespoir des Pakistanais et montrent qu'ils perdent le contrôle."
 Baluchistan_Uprising.5.d:0 "Un chef tribal loyal baloutche a informé le gouvernement que le gouvernement irakien avait récemment facilité l'envoi d'armes destinées aux rebelles baloutches. Il a insisté sur le fait que les armes étaient conservées à l'ambassade irakienne à Islamabad. Grâce à ces renseignements, les Pakistan Rangers, soutenus par la police locale, ont effectué une descente dans l'ambassade. Au cours de l'opération, nos forces ont découvert des centaines de mitraillettes soviétiques, cinquante mille cartouches et de l'argent destiné aux rebelles. Nous avons expulsé l'ambassadeur irakien. Confirmant leur culpabilité, Bagdad a ensuite accueilli un haut chef de tribu rebelle. Nous pensons que les Irakiens soutiennent les rebelles pour soutenir leur ami l'Inde et pour menacer le Baloutchistan iranien. Quoi qu'il en soit, il s'agit d'une victoire majeure pour nos forces et révèle la trahison irakienne."
 Baluchistan_Uprising.8.d:0 "Les commandants du Baloutchistan demandent l'autorisation d'utiliser des armes lourdes, notamment de l'artillerie de campagne et des chars, afin de débusquer les rebelles baloutches. De nombreux officiers sur le terrain notent que les forces rebelles sont capables de se fondre dans les montagnes et les villages isolés après les attaques. Avec l'artillerie et les tirs de chars, nos troupes pourraient riposter et limiter leurs refuges à partir desquels opérer contre nous. L'armée semble très enthousiaste à l'idée de déployer de telles armes. Cependant, certains conseillers à la sécurité nationale soulignent qu'une telle puissance de feu pourrait entraîner davantage de victimes civiles, car ces armes engloutissent de vastes zones et ne sont pas toujours précises. L'armée a accepté ces préoccupations et a promis que les pertes civiles seraient réduites au minimum, mais elle a fermement déclaré que protéger la vie des soldats pakistanais et rétablir rapidement l'ordre public valait le risque."
 Baluchistan_Uprising.9.d:0 "Le déploiement d'armes lourdes au Baloutchistan s'est révélé très efficace. Dès le début, le déploiement réussi de l'artillerie pakistanaise ainsi que des observateurs et de la surveillance de l'armée de l'air ont permis à l'armée de disperser de grandes concentrations de rebelles grâce à des tirs d'artillerie précis. Les rebelles baloutches s'adaptent en opérant en petits groupes et en lançant des attaques à couvert, mais même dans les situations où nos blindés sont présents, nous les avons débusqués. Les mécréants ne peuvent plus revendiquer exclusivement les montagnes. La principale différence réside dans le fait que les combattants baloutches sont passés à un plus petit nombre, ce qui a réduit leur capacité à lancer des attaques spectaculaires et améliore la capacité de nos avant-postes à mieux résister aux raids rebelles."
 Baluchistan_Uprising.10.d:0 "Le déploiement d'armes lourdes, notamment d'artillerie et de chars, s'est complètement retourné contre lui. Bien que l'armée ait utilisé ces armes pour disperser d'importantes concentrations de rebelles, il y a eu des incidents notables d'échecs de ciblage et d'assauts agressifs qui ont involontairement entraîné des victimes civiles. Cela n'a fait qu'inciter davantage de tribus à quitter le gouvernement et à soutenir les rebelles. Dans un cas, un ancien baloutche fidèle nous a informé que, bien qu'il soit resté fidèle, la plupart des jeunes hommes de sa tribu s'étaient enfuis dans les montagnes. Dans certaines apparitions, nos observateurs confondent parfois une concentration de membres d'une tribu engagés dans une réunion ou un mariage avec des concentrations de rebelles. En outre, il y a eu quelques incidents au cours desquels nos forces ont essuyé des tirs provenant d'un village voisin et le commandant local a ordonné l'assaut du village, en utilisant l'artillerie et les chars, ce qui a fini par causer d'importants dégâts et a donné lieu à des plaintes de la part des chefs tribaux locaux."
 Baluchistan_Uprising.11.d:0 "Lors d'opérations récentes au Baloutchistan, l'armée et les forces de sécurité ont appréhendé un certain nombre de combattants rebelles présumés. Ces hommes sont souvent interrogés et détenus, mais leur statut juridique n'est pas clarifié. Récemment, un colonel du GHQ a rédigé une recommandation invitant l'armée à remettre les combattants présumés aux tribunaux locaux et fédéraux pour les juger. Beaucoup de ces suspects peuvent être jugés en vertu des lois coloniales sur la sédition, ce qui donnerait une légitimité à nos opérations et à notre conduite avec les prisonniers. Le rapport a été porté au niveau du cabinet où une décision doit être prise. Les opposants à cette mesure craignent que les tribunaux locaux ne comptent des sympathisants des rebelles et que donner aux rebelles une plate-forme pour exprimer leur propagande pourrait finir par nuire à nos efforts. Nous devons nous demander si les avantages potentiels l'emportent sur les problèmes potentiels liés au recours aux tribunaux."
 Baluchistan_Uprising.12.d:0 "La récente décision du gouvernement de traduire en justice les rebelles baloutches présumés a montré au pays la véritable ampleur de la menace rebelle. Les procureurs sont en mesure d'expliquer l'ampleur des violences perpétrées par les accusés et ont dressé le portrait d'une armée rebelle assoiffée de sang déterminée à détruire la nation pakistanaise. Les allégations d'implication étrangère dans les rebelles baloutches sont particulièrement intéressantes pour de nombreux Pakistanais qui lisent ou écoutent des informations sur le procès. Le gouvernement prouve souvent l'origine des armes capturées par les rebelles et en déduit que ceux-ci reçoivent un soutien étranger, notamment de l'Inde. Bien que les groupes de défense des droits humains continuent de critiquer les actions militaires, le gouvernement note que les procès prouvent que l'État reste attaché à la loi et à l'ordre."
 Baluchistan_Uprising.13.d:0 "La récente décision du gouvernement de traduire en justice les rebelles baloutches présumés n'a pas réussi à montrer au pays la véritable ampleur de la menace rebelle. Bien que les procureurs aient travaillé dur pour souligner la violence des accusés et leurs liens avec des puissances étrangères, de nombreux citoyens ont été captivés par les témoignages des rebelles accusés. Ceux-ci, souvent d'humbles membres de la tribu baloutche, dressent l'image d'une société perpétuellement ignorée par l'État et la cible d'une répression militaire écrasante. Beaucoup disent que les Baloutches réclament la dignité seulement depuis 1947, mais que leur demande leur a été refusée et que si le gouvernement continue de la refuser, ils perdront le peuple du Baloutchistan. Sur les campus universitaires, l'agitation et les critiques à l'égard de l'armée en raison de son approche autoritaire se multiplient. Selon certaines rumeurs, certains étudiants universitaires auraient fui vers les montagnes et rejoint les rebelles en réponse."
 Baluchistan_Uprising.14.d:0 "Le gouvernement pakistanais ayant accepté de se retirer du Baloutchistan, il y a eu un exode massif de familles non baloutches et gouvernementales hors de la province. Les convois militaires pakistanais sont souvent saturés de nouveaux réfugiés, notamment ceux de la grande communauté Pathan de Quetta. Les réfugiés se dirigent vers Peshawar et Karachi. Le gouvernement pakistanais a averti que toute tentative visant à entraver le mouvement des réfugiés vers le Pakistan ne serait pas tolérée et jusqu'à présent, il semble que les combattants baloutches victorieux ne soient pas intéressés à prendre pour cible les réfugiés ou les forces militaires en retraite. Conformément au récent accord, une fois que les forces pakistanaises auront quitté la province, tous les prisonniers politiques et militaires baloutches seront renvoyés au Baloutchistan. Il existe un sentiment d'amertume et d'humiliation parmi la population pakistanaise."
 Baluchistan_Uprising.15.d:0 "L'armée pakistanaise a présenté un rapport aux principaux dirigeants du gouvernement. L'armée a noté que Quetta était en grande partie une ville pathan, dotée d'une puissante infrastructure de défense, notamment du Collège d'état-major. Ils ont noté que malgré l'exode de nombreux réfugiés, la ville reste ainsi et que de nombreux réfugiés pathans de Quetta demandent à l'armée de les rapatrier chez eux. L'armée demande au gouvernement de présenter un ultimatum au Baloutchistan. Ils doivent restituer Quetta et les terres qui l'entourent avec les populations Pathan au Pakistan, sinon l'armée les prendra par la force. L'armée pakistanaise garantit qu'elle n'aura aucun problème à sécuriser cette partie du Baloutchistan, car elle est historiquement loyale au Pakistan et les rebelles baloutches ne peuvent pas s'y implanter. Ils veulent que le gouvernement utilise un récent affrontement entre les tribus Baloutches et Pathan comme excuse pour lancer cet ultimatum."
 Baluchistan_Uprising.16.d:0 "Le gouvernement pakistanais, citant comme excuse un récent affrontement entre combattants baloutches et pathans, nous demande de nous retirer de Quetta et des terres à majorité pathane. Le Pakistan souhaite essentiellement sécuriser Quetta et un corridor terrestre vers la province frontalière du Nord-Ouest. Nous sommes un nouvel et jeune État et même si nous avons combattu l'occupation pakistanaise, tenter de conserver cette zone nécessiterait une défense militaire conventionnelle dans laquelle nos commandants n'ont pas confiance. Ceux qui veulent que nous acceptions l'ultimatum peuvent le présenter comme une autodétermination et gagner une légitimité et des éloges internationaux. D'autres cependant pensent que perdre Quetta, ses infrastructures et son potentiel économique pourrait paralyser notre nouvel État et que même si nous perdons, nous devrions nous battre jusqu'à ce que nous soyons forcés de partir et montrer au monde notre détermination. Le choix nous appartient."
 Baluchistan_Uprising.17.d:0 "Le Baloutchistan a refusé notre juste demande concernant Quetta et le retour de nos réfugiés dans leurs foyers. Comme prévu, les combattants baloutches n'étaient pas à la hauteur de nos forces militaires et Quetta a été capturée facilement. Les journaux de tout le Pakistan ont publié des photos de nos forces marchant dans la ville et de notre lever de drapeau sur le fort de Zhob. Cette victoire n'est qu'une maigre consolation après la défaite humiliante subie par les guérilleros baloutches. A Peshawar et Karachi, des caravanes de réfugiés « de la victoire » envisagent de repartir et de rentrer chez elles. Pour montrer la confiance dans notre victoire militaire, l'armée a annoncé qu'elle ouvrirait le Collège d'état-major de Quetta dans quelques mois seulement."
 Baluchistan_Uprising.18.d:0 "Nos forces ont combattu avec vaillance et ténacité, mais elles n'ont pas pu arrêter l'avancée des forces pakistanaises. Les Pakistanais ont déployé une force écrasante, notamment des armes lourdes, et ont utilisé tout pour nous prendre Quetta. Nos propres forces, même dans ces circonstances difficiles, ont continué à chercher à minimiser l'utilisation de munitions lourdes et à protéger à la fois les biens et les vies civiles. Même si le gouvernement pakistanais présente ses actions comme justes et sa victoire comme totale, le Baloutchistan reste indépendant. Plus important encore, le monde est témoin de l'agression flagrante du Pakistan. Dans ces circonstances, nous devons rechercher une protection et trouver des amis pour l'avenir."
 Baluchistan_Uprising.19.d:0 "Le gouvernement du Baloutchistan a officiellement demandé que nous garantissions sa souveraineté suite à son récent conflit frontalier avec le Pakistan. Malgré leur indépendance, les Pakistanais ont réussi à saper leur souveraineté en s'emparant de territoires précieux qu'ils pourraient occuper avec une force écrasante. Le Baloutchistan reconnaît que ce n'est qu'une question de temps avant que les Pakistanais ne cherchent à faire un nouvel effort pour le réduire et c'est pourquoi ils nous ont demandé de l'aide. Ils croient que si nous garantissons leur intégrité territoriale, le Pakistan et l'Iran hésiteront à étrangler le Baloutchistan dès le berceau. Nous pourrions certainement être d'accord et maintenir le Pakistan dans une menace perpétuelle sur deux fronts, mais certains soutiennent que le Baloutchistan, sans Quetta, ne pourra jamais être fort et que nous pourrions être entraînés dans un conflit désespéré à l'avenir."
 Baluchistan_Uprising.20.d:0 "De nombreuses photos du récent conflit frontalier montrent nos soldats avec un sourire narquois sur le visage. Malgré ce que beaucoup considéraient comme des obstacles impossibles, nos courageux soldats ont réussi à freiner l'invasion pakistanaise. Les Pakistanais avaient cherché à inventer un moyen de nous prendre Quetta, mais ils ont été contrecarrés. La communauté internationale nous surveillera de près, car nos anciens guérilleros se sont également révélés être d'habiles soldats conventionnels. Nos forces ont fait un certain nombre de prisonniers pakistanais, dont des officiers, et prévoient de montrer le matériel détruit et abandonné laissé par les forces pakistanaises en retraite. Cette bataille marque une victoire majeure, mais nous devons rester vigilants et envisager de trouver davantage d'alliés étrangers."
 Baluchistan_Uprising.21.d:0 "Le gouvernement a dû imposer un black-out médiatique lorsqu'il est devenu évident que notre offensive avait échoué. Nous avions promis une victoire rapide, mais nos forces ont fait face à un ennemi beaucoup plus tenace que prévu. Les rapports du front suggèrent que nos services de renseignement ont sous-estimé non seulement la taille et la formation des forces du Baloutchistan, mais également leurs capacités tactiques. Le black-out médiatique ne nous donnera que quelques jours pour organiser le déploiement de davantage de forces policières et paramilitaires dans les grandes villes, car nous nous attendons à des troubles une fois que la population aura pris conscience de ce dernier échec. Nos ambassades à l'étranger constatent déjà que la presse internationale fait état de nos échecs."
 Baluchistan_Uprising.22.d:0 "Le Front de libération du Baloutchistan a organisé une importante force de combattants tribaux pour attaquer les positions de l'armée pakistanaise autour de Gwadar. Les postes isolés de l'armée sont envahis ou encerclés par les rebelles qui cherchent à étendre leur présence. L'armée pakistanaise cherchera à stopper l'avancée des rebelles, car la perte de Gwadar donnera aux rebelles un accès au soutien étranger via la mer. Bien que les rebelles soient légèrement armés, ils sont très motivés et pensent que l'armée pakistanaise ne réagira pas assez rapidement pour empêcher leur succès. Le gouvernement continue de minimiser les nouvelles en provenance du Baloutchistan pour éviter la panique au sein de la population."
 Baluchistan_Uprising.23.d:0 "La garnison pakistanaise de Gwadar s'est rapidement retirée face à l'avancée des combattants du Front de libération du Baloutchistan et de leurs alliés tribaux. Les combattants rebelles ont réussi à percer et à couper la garnison. Les forces pakistanaises étant incapables d'opérer dans la région, elles ont été contraintes de se retirer. Les rebelles font défiler les armes capturées par les troupes en retraite. L'armée pakistanaise a minimisé ce revers, affirmant que le gouvernement garde le contrôle mais qu'il a dû redéployer ses moyens dans la région. Il s'est engagé à s'attaquer aux chefs tribaux réactionnaires baloutches qui trompent le peuple."
 Baluchistan_Uprising.24.d:0 "La garnison pakistanaise de Gwadar a accueilli un contingent de médias étrangers venus d'Islamabad par avion. L'armée a fait défiler des armes légères, des explosifs et des rebelles capturés. Le Front de libération du Baloutchistan et ses alliés tribaux ont récemment lancé une offensive pour arracher Gwadar au gouvernement pakistanais. Cependant, l'armée pakistanaise a réussi à contrecarrer l'attaque, infligeant de lourdes pertes aux assaillants. Les chefs rebelles de Kaboul ont condamné le gouvernement pakistanais pour ses violences aveugles contre le peuple baloutche. À Islamabad, le gouvernement insiste sur le fait qu'il reste aux commandes et que les chefs tribaux doivent prêter serment d'obéissance à la nation."
 Baluchistan_Uprising.25.d:0 "L'armée pakistanaise a confirmé que ses forces avançaient sur Gwadar. L'armée affirme que les rebelles utilisent le port pour acquérir illégalement des armes auprès de puissances hostiles, dans une accusation voilée adressée à l'Inde. L'offensive initiale du Front de libération du Baloutchistan, qui a capturé la ville portuaire endormie, a été une première victoire majeure pour le mouvement séparatiste. De nombreux experts suggèrent que la seule façon pour l'armée de réussir sera de déployer une force militaire suffisamment écrasante contre les combattants tribaux tenaces. Les rebelles s'appuieront sur leur combativité et leur connaissance du terrain pour repousser l'attaque."
 Baluchistan_Uprising.26.d:0 "L'armée pakistanaise a organisé une grande cérémonie de lever du drapeau à Gwadar, confirmant sa victoire sur les séparatistes baloutches qui occupaient le port. Bien que le gouvernement pakistanais refuse de divulguer le nombre de victimes, il a clairement réussi à vaincre la présence rebelle. Les dirigeants rebelles de Kaboul ont confirmé ce revers, déclarant que l'armée pakistanaise continue de recourir à la violence aveugle contre le peuple baloutche pour atteindre son objectif. De nombreux hauts responsables militaires et civils au Pakistan estiment que le plan de cette opération sera essentiel pour vaincre les rebelles."
 Baluchistan_Uprising.27.d:0 "Malgré le silence médiatique, il est clair que l'offensive pakistanaise visant à arracher Gwadar aux séparatistes baloutches a échoué. La presse étrangère à Islamabad constate un sentiment de désespoir, voire de panique, parmi les hauts responsables. Les dirigeants baloutches de Kaboul ont félicité leurs combattants et leur peuple pour avoir courageusement résisté à l'assaut brutal d'un ennemi aveugle. Conformément à la politique, les nouvelles du revers sont supprimées dans tout le Pakistan afin d'éviter des troubles au sein de la population. Cependant, un certain nombre d'experts craignent que le gouvernement doive faire face à ses critiques s'il continue à lutter contre les rebelles."
 Baluchistan_Uprising.28.d:0 "Le Front de libération du Baloutchistan et ses alliés tribaux ont lancé une offensive sur Khuzdar et ses environs. Les combattants très motivés auraient envahi des postes militaires isolés bordant le territoire contrôlé par les rebelles. L'armée pakistanaise serait en train d'organiser une réponse énergique pour mettre un terme à l'attaque rebelle. Malgré les récents revers, le gouvernement maintient un black-out médiatique, même s'il devient de plus en plus difficile de cacher la véritable situation. Les dirigeants baloutches en exil à Kaboul promettent une victoire rapide au peuple baloutche afin de poursuivre la lutte pour défendre le droit à l'autodétermination du Baloutchistan."
 Baluchistan_Uprising.29.d:0 "Contre toute attente, le Front de libération du Baloutchistan et ses alliés tribaux ont réussi à reprendre Khuzdar et ses environs aux mains du gouvernement pakistanais. Les dernières garnisons pakistanaises présentes dans la zone se sont retirées. Ils ne peuvent plus sécuriser les lignes d'approvisionnement des garnisons. Les efforts du Pakistan visant à maintenir un black-out médiatique semblent se désintégrer. Les nouvelles se répandent dans les zones urbaines concernant les revers militaires, provoquant des troubles sur les campus universitaires. De nombreux étudiants demandent au gouvernement de faire la paix et d'accorder l'autonomie provinciale à toutes les provinces."
 Baluchistan_Uprising.30.d:0 "Dans une rare reconnaissance du conflit en cours au Baloutchistan, l'armée pakistanaise a soigneusement envoyé des journalistes étrangers à Khuzdar. Les journalistes ont vu des séparatistes baloutches capturés et des tas d'armes capturées. Des documents de formation, des explosifs et des mortiers capturés ont également été présentés pour démontrer la sophistication des forces rebelles. Le Front de libération du Baloutchistan et ses alliés tribaux ont récemment lancé une offensive majeure à Khuzdar. Le gouvernement pakistanais a déclaré que la victoire militaire confirme le manque de soutien aux rebelles parmi le peuple baloutche et qu'une résolution rapide du conflit sera bientôt atteinte."
 Baluchistan_Uprising.31.d:0 "Dans une rare reconnaissance de la détérioration de la situation au Baloutchistan, le gouvernement pakistanais a annoncé que l'armée envoyait des troupes pour libérer Khuzdar du Front de libération du Baloutchistan. Les dirigeants du BLF à Kaboul ont confirmé que leurs forces étaient confrontées à un assaut de l'armée pakistanaise. Ils ont appelé tous les Baloutches à rester fermes face à un barrage non provoqué d'un gouvernement central oppressif. Le gouvernement pakistanais a récemment perdu du terrain face aux rebelles, et de nombreux experts estiment qu'il cherche désespérément à mener une offensive réussie. Les efforts visant à imposer un silence médiatique sur le conflit ont largement échoué car la majeure partie de la province est désormais sous le contrôle du BLF."
 Baluchistan_Uprising.32.d:0 "Le gouvernement pakistanais a publié une photographie d'un fort de l'époque coloniale avec le drapeau pakistanais hissé. Cela montre que la récente offensive visant à reprendre Khuzdar et ses environs a réussi. Un porte-parole de l'armée a salué les commandants et le dévouement des soldats comme étant essentiels au succès de l'opération. Le gouvernement a promis que tout le Baloutchistan serait pacifié dans les mois à venir. Les dirigeants du Front de libération du Baloutchistan, s'exprimant depuis leur exil à Kaboul, ont confirmé le revers et se sont engagés à venger tous les Baloutches innocents tués par l'action militaire."
 Baluchistan_Uprising.33.d:0 "Le Front de libération du Baloutchistan a réussi à stopper et à repousser une offensive majeure de l'armée pakistanaise à Khuzdar. Les dirigeants du BLF à Kaboul ont confirmé la nouvelle, saluant la détermination du peuple baloutche à s'opposer à la répression violente. L'armée pakistanaise reste discrète et refuse de commenter la situation. Cependant, des fuites dans les médias et la panique générale des hauts responsables militaires à Islamabad suggèrent que l'offensive de Khuzdar s'est soldée par un échec. Le gouvernement pakistanais avait cherché à exclure les médias de la crise du Baloutchistan, mais les récents succès des rebelles ont rendu cela impossible. Il est désormais de règle de ne pas commenter les revers et de ne pas saluer toutes les opérations réussies."
 Baluchistan_Uprising.34.d:0 "Le conflit au Baloutchistan semble atteindre un tournant critique puisque l'Armée de libération du Baloutchistan a confirmé que ses combattants lançaient une opération de « libération finale » pour reprendre la capitale de Quetta au gouvernement pakistanais. La BLA espère que la confiance acquise par ses forces lors des récentes opérations et leur moral seront suffisants pour vaincre les défenses de l'armée pakistanaise. L'armée pakistanaise s'est engagée à mettre fin à toute attaque de « mécréants » et à ramener la paix dans la province. Les observateurs à Quetta notent que l'armée a installé des points de contrôle, des fortifications et déploie des troupes de garnison pour défendre la ville. Le célèbre Collège de l'armée et de l'état-major a temporairement transféré son personnel et ses étudiants jusqu'à ce que la situation soit résolue."
 Baluchistan_Uprising.35.d:0 "L'armée pakistanaise a lancé des feux d'artifice et levé les récentes ordonnances de couvre-feu à Quetta. Cela survient après avoir stoppé une offensive majeure du Front de libération du Baloutchistan. Le BLF a récemment tenté de s'emparer de la capitale du Baloutchistan et de contrôler l'essentiel de la province. Cependant, ses forces manquaient apparemment d'armes ou de capacités pour submerger Quetta, une importante garnison militaire. Les dirigeants du BLF à Kaboul ont minimisé la nouvelle, affirmant que ses forces avaient été temporairement repoussées, mais qu'elles reviendraient bientôt. De nombreux analystes pensent que le gouvernement pakistanais pourrait chercher à profiter de sa victoire et tenter de reprendre les territoires perdus lors des précédentes offensives rebelles. Le temps nous dira si ce revers marque un tournant dans le conflit."
 Baluchistan_Uprising.36.d:0 "Des véhicules chargés de familles et de leurs biens encombrent les routes hors de Quetta. Les épouses, les enfants et les familles des militaires en service ou du personnel civil de l'armée fuient Quetta alors que les forces du Front de libération du Baloutchistan commencent à entrer dans la ville. Les combattants du BLF parcourent la ville en voiture, accueillis par les acclamations et les friandises de leurs partisans. Quetta, bastion militaire depuis la période coloniale, a été abandonnée aux séparatistes. Il semble que l'armée pakistanaise, après sa défaite contre les rebelles, ait décidé de redéployer ses forces pour empêcher les rebelles d'étendre leurs opérations aux provinces voisines, cédant essentiellement Quetta et ses environs au BLF. Le BLF se réjouirait de sa victoire et annoncerait son intention de faire revenir les dirigeants baloutches en exil. Bien que le gouvernement pakistanais reste provocateur, il existe une pression nationale et internationale croissante pour qu'il mette rapidement un terme au conflit, même si le Baloutchistan est sous le contrôle du BLF."
 Baluchistan_Uprising.37.d:0 "Les dirigeants du Front de libération du Baloutchistan à Kaboul se sont récemment rendus à Quetta, où ils ont été accueillis triomphalement par la population et ses combattants. Les dirigeants se sont engagés à instituer un nouveau gouvernement qui prendra soin de la population et veillera à ce qu'elle prospère grâce aux ressources de la province. Malgré l'ambiance jubilatoire, des inquiétudes subsistent également. De nombreux quartiers, qui abritaient autrefois des militaires à la retraite et des représentants du gouvernement, se vident à mesure que les réfugiés pro-pakistanais continuent d'affluer du Baloutchistan. Le gouvernement pakistanais continue d'insister sur le fait que le Baloutchistan est en état de révolte et non d'État indépendant. La population du Baloutchistan se demande ce que l'avenir lui réserve sous un nouveau régime."
 Baluchistan_Uprising.38.d:0 "Des sources de l'armée pakistanaise confirment en privé que l'armée a lancé une offensive pour en finir avec les séparatistes baloutches à Kharan. L'armée estime avoir rassemblé suffisamment de forces pour achever sa victoire. Les dirigeants baloutches à Kaboul ont confirmé que de nouveaux combats avaient éclaté. Il a appelé tous les Baloutches à se tenir aux côtés de leurs combattants pour mettre fin à ce qu'ils appellent une attaque brutale de l'armée. Le gouvernement pakistanais continue d'imposer un silence médiatique sur la situation sécuritaire au Baloutchistan, affirmant que l'armée cible les bandes criminelles et apporte de la modernité à la population du Baloutchistan."
 Baluchistan_Uprising.39.d:0 "Le gouvernement pakistanais a confirmé que son armée avait réussi à vaincre les séparatistes baloutches sur le terrain. Les commandants militaires sur le terrain rapportent que les rebelles restants sont actuellement encerclés et incapables de sortir de leurs positions. Une capitulation définitive est attendue prochainement. Les dirigeants baloutches de Kaboul seraient découragés par la situation actuelle. Pour l'armée pakistanaise, les opérations réussies constituent un formidable regain de confiance. De nombreux commandants sur le terrain ont acquis une précieuse expérience de combat. Le gouvernement s'est engagé à soutenir les efforts visant à apporter des progrès à la population du Baloutchistan."
 Baluchistan_Uprising.40.d:0 "Les séparatistes baloutches célébreraient leur résistance réussie à une offensive de l'armée pakistanaise. Les rebelles affirment que malgré un ennemi violent et impitoyable, le peuple baloutche a résisté à l'attaque impitoyable. L'armée et le gouvernement pakistanais ont refusé de commenter les informations, affirmant que la situation reste fluide sur le terrain. En privé, plusieurs responsables militaires déclarent que de nombreuses leçons précieuses ont été apprises et que ce n'est qu'une question de temps avant que l'armée rétablisse l'ordre. Le conflit au Baloutchistan continue de faire rage."
 Baluchistan_Uprising.41.d:0 "Lors d'une série de cérémonies, des milliers de combattants séparatistes baloutches ont remis leurs armes à l'armée pakistanaise. Les combattants ont été amnistiés et pardonnés pour leur rébellion contre l'État. Les chefs tribaux qui dirigeaient les combattants rebelles ont publiquement promis leur loyauté envers le gouvernement. Des officiers supérieurs de l'armée pakistanaise ont supervisé l'événement, confirmant leur victoire militaire sur les rebelles. Les rebelles baloutches se sont battus avec ténacité pour l'indépendance et pour protéger le peuple baloutche d'un gouvernement central autoritaire. Le gouvernement pakistanais affirme que sa victoire représente un pas vers le progrès et la modernisation du peuple baloutche. Ils affirment que les anciens des tribus traditionnelles insistent sur le maintien d'un système féodal oppressif. Les chefs rebelles baloutches de Kaboul restent en exil, mais certains d'entre eux seraient en train de négocier avec le Pakistan pour rentrer chez eux."

