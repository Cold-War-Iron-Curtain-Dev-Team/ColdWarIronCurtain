 TUR_jet_recon_equipment_1:0 "Chasseur stellaire Lockheed RF-104G"
 TUR_jet_recon_equipment_1_short:0 "Chasseur stellaire RF-104G"
 TUR_jet_recon_equipment_1_desc:0 "Le RF-104G était un modèle de reconnaissance tactique basé sur le F-104G, généralement équipé de trois caméras KS-67A montées à l'avant du fuselage à la place du canon interne. La plupart des 189 exemplaires construits ont ensuite été reconfigurés selon la norme F-104G"
 TUR_jet_recon_equipment_2:0 "THK RF-4E Fantôme 2000"
 TUR_jet_recon_equipment_2_short:0 "RF-4E Fantôme 2000"
 TUR_jet_recon_equipment_2_desc:0 "La version de reconnaissance photographique du F-4E Phantom 2000 créée par THK à la fin des années 1990 en tant que mise à niveau du vaste inventaire de F-4E Phantom II de Turquie. Armé d'une suite de caméras avancées et de capteurs le rapprochant des avions modernes."

