 TUR_jet_multirole_equipment_4_desc:0 "Le North American F-100 Super Sabre est un avion de combat supersonique américain utilisé dans le Flyvevåbnet danois de 1959 à 1961 dans le cadre du programme Mutual Defence Assistance Act visant à fournir aux membres européens de l'OTAN des capacités de puissance aérienne plus modernes." 
