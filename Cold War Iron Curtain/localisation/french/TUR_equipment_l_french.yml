 TUR_mbt_equipment_0:0 "Panzer III Ausf.J"
 TUR_mbt_equipment_0_short:0 "Panzer III Ausf.J"
 TUR_mbt_equipment_1:0 "Panzer IV Ausf.G"
 TUR_mbt_equipment_1_short:0 "Panzer IV Ausf.G"
 TUR_mbt_equipment_2:0 "M46 Patton"
 TUR_mbt_equipment_2_short:0 "M46 Patton"
 TUR_mbt_equipment_2_desc:0 "Le M46 Patton est un char moyen conçu par le Département des munitions de l'armée américaine en 1949. Il a combattu pendant la guerre de Corée et a été conçu pour remplacer le M26 Pershing en raison de son poids excessif. Il dispose d'un canon principal de 90 mm et d'un blindage de 102 mm. Il peut être équipé d'un seul Browning M2 ou de deux Browning M1919. Le M46 Patton utilise un moteur V12 biturbo qui atteint une vitesse de 15 à 30 mph et a une autonomie opérationnelle de 30 à 80 miles. Il a été produit en grande série dans le but de remplacer les anciens modèles. Il était à la pointe des conceptions et des armes modernes et ne souffrait pas d'un poids élevé."
 TUR_mbt_equipment_3:0 "Char de combat à chenilles complète : canon de 90 mm, M47"
 TUR_mbt_equipment_3_short:0 "M47 Patton"
 TUR_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux et a été conçu par le département des munitions de l'armée américaine en 1951. Il est très similaire au M46 Patton mais avec une tourelle de canon mise à jour avec un mécanisme interne amélioré et une transmission améliorée. Il a connu des combats lors de la crise de Suez, de la guerre des 6 jours et des guerres yougoslaves."
 TUR_mbt_equipment_4:0 "Char de combat à chenilles complète : canon de 90 mm, M48"
 TUR_mbt_equipment_4_short:0 "Patton M48A5T1"
 TUR_mbt_equipment_4_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 TUR_mbt_equipment_5:0 "Char de combat à chenilles complète : canon de 105 mm, M60"
 TUR_mbt_equipment_5_short:0 "M60 Patton"
 TUR_mbt_equipment_5_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 TUR_mbt_equipment_6:0 "KMW Léopard 1A1"
 TUR_mbt_equipment_6_short:0 "Léopard 1A1"
 TUR_mbt_equipment_7:0 "KMW Léopard 1A5"
 TUR_mbt_equipment_7_short:0 "Léopard 1A5"
 TUR_mbt_equipment_8:0 "KMW Léopard 2A4"
 TUR_mbt_equipment_8_short:0 "Léopard 2A4"
 TUR_mbt_equipment_9:0 "Industries militaires israéliennes M60T Sabra"
 TUR_mbt_equipment_9_short:0 "Sabre M60T"
 TUR_mbt_equipment_9_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."

 TUR_mechanized_equipment_1:0 "Demi-piste M2"
 TUR_mechanized_equipment_1_short:0 "Demi-piste M2"
 TUR_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 TUR_mechanized_equipment_2:0 "Demi-piste M3"
 TUR_mechanized_equipment_2_short:0 "Demi-piste M3"
 TUR_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 TUR_mechanized_equipment_3:0 "Demi-chenille M5"
 TUR_mechanized_equipment_3_short:0 "Demi-chenille M5"
 TUR_mechanized_equipment_3_desc:0 "Le M5 est un M3 Half-track doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit et est une version simplifiée du M3A1. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 TUR_mechanized_equipment_4:0 "Transporteur, personnel, entièrement chenillé, blindé, M59"
 TUR_mechanized_equipment_4_short:0 "M59"
 TUR_mechanized_equipment_4_desc:0 "Le M59 est un APC développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de 2 moteurs essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barre de torsion. Il peut se déplacer jusqu'à 32 mph sur 120 miles. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 était également utilisé comme porteur de mortier et comme véhicule de soutien."
