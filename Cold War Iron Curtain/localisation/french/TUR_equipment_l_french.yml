##Turkish Army Aviation
 TUR_scout_helicopter_equipment_2:0 "Agusta-Bell AB-206 JetRanger"
 TUR_scout_helicopter_equipment_2_short:0 "AB-206"
 TUR_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."
 TUR_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 TUR_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 TUR_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Il était doté de fonctionnalités telles qu'une transmission et un moteur améliorés pour les vols en sieste de terre (niveau extrêmement bas) de l'hélicoptère, ainsi qu'une configuration unique de rotor principal à quatre pales qui lui permettait d'être beaucoup plus silencieux que les autres hélicoptères, plus encore ses prédécesseurs. L'OH-58D a introduit le viseur distinctif monté sur mât (MMS) au-dessus du système de rotor et un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « en veille » pour une utilisation d'urgence."

 TUR_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 TUR_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 TUR_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73."
 TUR_attack_helicopter_equipment_3:0 "Cloche AH-1P Cobra"
 TUR_attack_helicopter_equipment_3_short:0 "AH-1P Cobra"
 TUR_attack_helicopter_equipment_3_desc:0 "Avion de production avec rotors composites, cockpit plat en verre et disposition améliorée du cockpit pour le vol en sieste de terre (NOE). L'AH-1P est également appelé « Production AH-1S » ou « AH-1S(PROD) » avant 1988. Ces améliorations sont considérées comme l'étape 1 du programme de mise à niveau de l'AH-1S."
 TUR_attack_helicopter_equipment_4:0 "Bell AH-1W SuperCobra"
 TUR_attack_helicopter_equipment_4_short:0 "AH-1W SuperCobra"
 TUR_attack_helicopter_equipment_4_desc:0 "Le Bell AH-1 SuperCobra est un hélicoptère d'attaque bimoteur basé sur le monomoteur AH-1 Cobra de l'armée américaine. La famille jumelle Cobra, elle-même partie de la plus grande famille Huey, comprend l'AH-1J SeaCobra, l'AH-1T Upgraded SeaCobra et l'AH-1W SuperCobra."
 TUR_attack_helicopter_equipment_5:0 "TAI T129 ATTAQUE"
 TUR_attack_helicopter_equipment_5_short:0 "T129 ATTAQUE"
 TUR_attack_helicopter_equipment_5_desc:0 "Le TAI/AgustaWestland T129 ATAK est un hélicoptère d'attaque bimoteur, à sièges tandem, multirôle et tous temps, basé sur la plate-forme Agusta A129 Mangusta. Le T129 a été développé par Turkish Aerospace Industries (TAI) avec son partenaire AgustaWestland"

 TUR_utility_helicopter_equipment_1:0 "Mésange Sikorsky H-19"
 TUR_utility_helicopter_equipment_1_short:0 "Mésange H-19"
 TUR_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la Marine HUS) est un hélicoptère militaire à moteur à pistons conçu à l'origine comme guerre anti-sous-marine (ASW), mais a ensuite été reconverti en transport moyen. Il deviendrait le dernier hélicoptère à moteur à pistons exploité par le Corps des Marines des États-Unis, car depuis lors, tous les hélicoptères utilisaient des moteurs à turbine. Dans la Marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'Armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 TUR_utility_helicopter_equipment_2:0 "Agusta Bell AB-204"
 TUR_utility_helicopter_equipment_2_short:0 "AB-204"
 TUR_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 TUR_utility_helicopter_equipment_3:0 "Agusta Bell AB-212"
 TUR_utility_helicopter_equipment_3_short:0 "AB-212"
 TUR_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 TUR_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 TUR_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 TUR_utility_helicopter_equipment_4_desc:0 "Introduit pour la première fois en 1970, l'UH-1N était un autre membre de la famille élargie « Huey », cette fois développé à partir de l'UH-1H, bien que contrairement à l'UH-1A et à l'UH-1D, la variante « N » serait celle qui donnerait naissance à sa version civile, le Bell 212. Le rotor principal est propulsé par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 shp) pendant 30 minutes ou 571 kW (765 shp), permettant à l'UH-1N de maintenir ses performances de croisière au poids maximum. C'était également l'une des rares variantes « iroquoises » à ne pas être utilisée par l'armée américaine, étant plutôt le porte-drapeau des Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 TUR_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Faucon Noir"
 TUR_utility_helicopter_equipment_5_short:0 "UH-60A Faucon Noir"
 TUR_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant que plate-forme d'hélicoptère utilitaire de l'armée américaine. Développé à partir du S-70 civil, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef de tribu amérindienne Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 TUR_utility_helicopter_equipment_6:0 "Aérospatiale AS532 Cougar UL Mk.II"
 TUR_utility_helicopter_equipment_6_short:0 "AS532 Cougar UL Mk.II"
 TUR_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 TUR_utility_helicopter_equipment_7:0 "TAI T-70 Faucon Noir"
 TUR_utility_helicopter_equipment_7_short:0 "T-70 Faucon Noir"
 TUR_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

