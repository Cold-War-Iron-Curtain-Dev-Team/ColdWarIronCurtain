 TUR_jet_CAS_equipment_2:0 "République F-84G Thunderjet"
 TUR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 TUR_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un chasseur-bombardier de jour destiné à remplacer l'ancien P-47 Thunderbolt. Malgré son entrée en service en 1947, le Thunderjet était en proie à de nombreux problèmes. À tel point que jusqu'à l'introduction de la variante « D » en 1949, le F-84 était presque annulé. Ce type a servi de principal avion d'attaque pour l'US Air Force pendant la guerre de Corée et a été le premier avion de combat utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que « Thunderjet » serait un nom approprié pour ce type."
 TUR_jet_CAS_equipment_3:0 "République F-84F Thunderstreak"
 TUR_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 TUR_jet_CAS_equipment_3_desc:0 "Développé à partir du précédent F-84 Thunderjet, le F-84F était une variante à ailes en flèche du chasseur-bombardier conçue pour rapprocher ce type des performances du tant vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances de décollage tout en ayant une stabilité et un contrôle médiocres. Le type servirait dans une capacité limitée tout au long de sa vie, jusqu'en 1971. Son surnom est « Thunderstreak »."
 TUR_jet_CAS_equipment_4:0 "Super Sabre nord-américain F-100D"
 TUR_jet_CAS_equipment_4_short:0 "Super Sabre F-100D"
 TUR_jet_CAS_equipment_4_desc:0 "Chasseur-bombardier monoplace, avionique plus avancée, aile et dérive plus grandes, volets d'atterrissage. Le F-100 a remplacé le F-84G Thunderjet en tant que chasseur d'attaque de la Royal Danish Air Force."

 TUR_jet_interceptor_equipment_4:0 "Poignard Convair F-102A Delta"
 TUR_jet_interceptor_equipment_4_short:0 "Dague Delta F-102A"
 TUR_jet_interceptor_equipment_4_desc:0 "Premier chasseur à réaction à ailes delta des États-Unis, le F-102 a été le premier chasseur supersonique utilisé par l'US Air Force, capable d'atteindre des vitesses de Mach 1. Il a été conçu comme un intercepteur et un tueur de bombardiers, remplaçant le F-89 Scorpion, et était capable d'abattre des avions ennemis avec des roquettes et des missiles embarqués depuis sa baie interne, le premier avion de combat à présenter cette conception. Le « Delta Dagger » servirait pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."

