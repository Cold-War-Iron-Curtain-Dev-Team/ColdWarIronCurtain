 ### Turkey Infantry Equipment

 TUR_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 TUR_infantry_equipment_0_short:0 "M1 Garand"
 TUR_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 TUR_infantry_equipment_1:0 "FN FAL"
 TUR_infantry_equipment_1_short:0 "FN FAL"
 TUR_infantry_equipment_1_desc:0 "En novembre 1956, l'Allemagne de l'Ouest commanda 100 000 FAL supplémentaires, désignés G1, pour l'armée. FN a fabriqué les fusils entre avril 1957 et mai 1958. Les modifications utilisateur du G1 comprenaient des protège-mains en métal léger et un bipied pliable intégré, de la même manière que la version autrichienne."

 TUR_infantry_equipment_2:0 "Heckler & Koch G3"
 TUR_infantry_equipment_2_short:0 "G3"
 TUR_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 TUR_infantry_equipment_3:0 "Heckler & Koch G3A3"
 TUR_infantry_equipment_3_short:0 "G3A3"
 TUR_infantry_equipment_3_desc:0 " La version de 1963 la plus connue. Des viseurs à tambour avec un guidon amélioré, un suppresseur de flash/frein de bouche capable de tirer des grenades aux normes OTAN, une crosse fixe en plastique solide et un protège-main en plastique qui n'entre pas en contact avec le canon flottant. Le protège-main était disponible en version fine et ventilée et en version large. Ce dernier permet la fixation d'un bipied."

 TUR_infantry_equipment_4:0 "Heckler & Koch G3A7"
 TUR_infantry_equipment_4_short:0 "G3A7"
 TUR_infantry_equipment_4_desc:0 "HK a attribué un numéro de modèle à la version turque du G3A3."

########## NEW TUR ARMOR
 TUR_lt_equipment_1:0 "M3 Stuart"
 TUR_lt_equipment_1_short:0 "M3 Stuart"
