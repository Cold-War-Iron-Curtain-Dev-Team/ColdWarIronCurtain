 TUR_motorized_equipment_1:0 "Praga RV"
 TUR_motorized_equipment_1_short:0 "Praga RV"
 TUR_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW utilise un moteur GMC270, une transmission à 5 vitesses/2 gammes et un essieu à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer jusqu'à 45 mph sur 300 miles et atteint 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine en tant que camion de transport et de ravitaillement de troupes. Le camion, en plus d'être utilisé pour le ravitaillement et le transport, pourrait également monter une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et peut également monter des armes remorquées sur son plateau pour créer des armes SP bon marché."
 TUR_motorized_equipment_2:0 "M35"
 TUR_motorized_equipment_2_short:0 "M35"
 TUR_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 TUR_motorized_equipment_3:0 "M809"
 TUR_motorized_equipment_3_short:0 "M809"
 TUR_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 TUR_motorized_equipment_4:0 "M939"
 TUR_motorized_equipment_4_short:0 "M939"
 TUR_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 TUR_motorized_equipment_5:0 "UNIMOG U1300L 4x4"
 TUR_motorized_equipment_5_short:0 "UNIMOG U1300L 4x4"

 TUR_mechanized_marine_equipment_1:0 "Buffle d'eau LVT-4"
 TUR_mechanized_marine_equipment_1_short:0 "LVT-4"
 TUR_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 TUR_mechanized_marine_equipment_2:0 "LVT(A)-5"
 TUR_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 TUR_mechanized_marine_equipment_2_desc:0 "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
 TUR_mechanized_marine_equipment_3:0 "FMC M113A2 Amfibi Komando"
 TUR_mechanized_marine_equipment_3_short:0 "M113A2AK"
 TUR_mechanized_marine_equipment_3_desc:0 "Une version du M113A2 pour la brigade de marine amphibie de la marine turque (turc ; Amfibi Deniz Piyade Tugayi), également connue sous le nom de commando amphibie (turc ; Amfibi Komando), est l'unité du corps des marines des forces navales turques basée à Foça près d'Izmir, trois bataillons amphibies"
 TUR_mechanized_marine_equipment_4:0 "FNSS ACV-15 AK"
 TUR_mechanized_marine_equipment_4_short:0 "ACV-15 AK"
 TUR_mechanized_marine_equipment_4_desc:0 "Une version de l'ACV-15 pour la brigade maritime amphibie de la marine turque (turc ; Amfibi Deniz Piyade Tugayi), également connue sous le nom de commando amphibie (turc ; Amfibi Komando), est l'unité du corps des marines des forces navales turques basée à Foça près d'Izmir, trois bataillons amphibies"
 TUR_mechanized_marine_equipment_5:0 "Otokar Arma"
 TUR_mechanized_marine_equipment_5_short:0 "Otokar Arma"
 TUR_mechanized_marine_equipment_5_desc:0 "Arma est une famille de véhicules blindés de combat amphibies à roues 6x6 et 8x8 conçue et développée par Otokar. Le véhicule est un véhicule modulaire à plusieurs roues configurable avec un haut niveau de protection balistique et contre les mines grâce à sa coque en acier monocoque de haute dureté."

