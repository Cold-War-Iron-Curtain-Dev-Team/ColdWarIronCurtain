 SOV_increase_aircraft_production_desc:0 "Soyez témoin de l'expansion de la production d'avions alors que nous nous efforçons d'atteindre la supériorité aérienne. La vision du camarade Khrouchtchev garantit une formidable force aérienne soviétique, capable de défendre notre patrie socialiste."
 SOV_socialism_in_one_country_desc: "Même si une révolution mondiale serait belle, la révolution est un processus long et ardu qui doit être encouragé pendant des siècles pour réussir. Nous devons au contraire nous assurer que notre base du socialisme est la plus forte au monde et attendre la tempête d'effondrement économique capitaliste qui suivra sûrement dans les années à venir."
 GER_anschluss_desc:0 "L'Anschluss, ou l'union avec l'Autriche, est un objectif de longue date du peuple allemand. Bien qu'interdit par le Traité de Versailles, le moment est enfin venu de le réaliser. Offrons aux Autrichiens une chance de partager notre glorieux destin !"
 anschluss_mefo_bills_tt:0 "Utilise l'or autrichien pour réduire le coût des factures MEFO §Y§!.\n"
 end_of_czechoslovakia_mefo_bills_tt:0 "Utilise l'or tchécoslovaque pour réduire le coût des factures MEFO §Y§!.\n"
 GER_trade_interdiction_desc:0 "Nos chantiers navals sont déterminés à produire des sous-marins, mais nous devons développer de meilleures façons d'utiliser ces « meutes de loups ». Donnez aux amiraux tout ce dont ils ont besoin pour mener leurs simulations et jeux de guerre..."
 yugoslavia_mefo_bills_tt:0 "Utilise l'or yougoslave pour réduire le coût des factures MEFO §Y§!.\n"
 SOV_collectivist_propaganda_desc:0 "En Union Soviétique, il n'y a pas de place pour la gloire individuelle. Notre propagande devrait fortement mettre l'accent sur les efforts collectifs ; objectifs de production dépassés, expéditions réussies et projets de construction massifs."
 SOV_positive_heroism_desc:0 "Il est temps de sortir de la vieille propagande collectiviste léniniste et de transformer divers individus exceptionnels en héros plus grands que nature du socialisme !"
 SOV_socialist_realism_desc:0 "Toutes les oeuvres d'art de l'Union soviétique doivent s'efforcer d'éduquer le peuple sur les objectifs et la signification du communisme, en représentant le prolétariat dans des scènes réalistes et typiques de la vie quotidienne. Les artistes soviétiques sont les ingénieurs des âmes !"
 SOV_far_east_fortification_desc:0 "Les Japonais font constamment des incursions à la frontière avec la Mandchourie. Nous devons améliorer nos défenses le long de cette frontière afin de les dissuader de manière permanente."
 SOV_reconcile_japan_desc:0 "Nos relations avec le Japon ont toujours été difficiles, mais il y a de plus gros poissons à affronter. En exploitant leur manque désespéré de ressources naturelles, les Japonais pourraient se laisser mener par le nez... De toute façon, leur régime féodal anachronique est voué à tomber bientôt."
 SOV_baltic_security_desc:0 "La Baltique est notre territoire et doit être protégée à tout prix. Il faut s'emparer de la Carélie pour donner à Léningrad une zone tampon sécurisée, et l'autonomie de l'Estonie est tout simplement ridicule !"
 SOV_claims_on_poland_desc:0 "La démonstration d'incompétence et d'embarras qu'a été la guerre soviéto-polonaise doit être vengée et la Pologne orientale réintégrée à l'URSS !"
 SOV_demand_eastern_poland_desc:0 "Après avoir réaffirmé nos droits sur les territoires de l'est de la Pologne, nous devons préciser que la Pologne ne pourra se sauver d'une nouvelle partition qu'en les cédant pacifiquement."
 SOV_offer_poland_protection_desc:0 "Même si nous pourrions simplement nous emparer de l'est de la Pologne, il serait de loin préférable qu'ils rejoignent notre Komintern dans le processus. Il nous faudrait cependant offrir quelque chose en échange de nos revendications. Si nous leur promettons l'Allemagne de l'Est, ils pourraient être intéressés."
 SOV_rehabilitated_military_desc:0 "Une fois la souillure du trotskysme enfin débarrassée du corps des officiers, il pourrait être possible de permettre à nouveau à l'armée une certaine liberté face à l'ingérence politique."
 SOV_military_reorganization_desc:0 "La Purge n'a pas laissé l'armée en bon état. La nouvelle direction est verte et inefficace, et aucun travail n'a été fait pour développer nos doctrines. Il faut remédier à cette situation immédiatement !"
 SOV_nkvd_primacy_desc:0 "L'armée a montré qu'on ne peut jamais lui faire confiance. Le NKVD devra donc être élargi et doté de plus grands pouvoirs, avec davantage de commissaires politiques pour surveiller les officiers."
 SOV_lessons_of_war:0 "Leçons de guerre"
 SOV_lessons_of_war_desc:0 "Grâce à l'expérience acquise dans des guerres limitées, nous devrions être en mesure de faire quelques percées dans la guerre blindée, et peut-être même enfin de remettre en forme le corps d'officiers épuisé !"
 SOV_smersh_desc:0 "SMERSH, ou « Mort aux espions », est une proposition d'initiative de contre-espionnage qui aurait un double objectif : ; extirper les espions ennemis et exécuter les déserteurs et les partisans dans les rangs de l'Armée rouge."
