 SYR_Mil_1:0 "Organisation de l'armée"
 SYR_Mil_1_desc:0 "Il a été démontré que nos forces étaient mal entraînées et mal armées dans la guerre de libération de la Palestine. Elle doit donc être réorganisée"
 SYR_Mil_2:0 "Afflux de chars soviétiques"
 SYR_Mil_2_desc:0 "Nous devons défier l'Égypte en tant que première puissance arabe afin de pouvoir combattre Israël"
 SYR_Mil_3:0 "Arrivée du T-55"
 SYR_Mil_3_desc:0 "Nous avons le dernier char soviétique, le brillant T-55"
 SYR_Mil_4:0 "Entraînement et renforts soviétiques"
 SYR_Mil_4_desc:0 "Les Soviétiques nous ont fourni des armes et entraîné nos troupes"
