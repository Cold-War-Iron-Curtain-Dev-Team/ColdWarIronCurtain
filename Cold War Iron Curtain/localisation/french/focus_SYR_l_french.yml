 SYR_Polit_1:0 "Fortifier les hauteurs du Golan"
 SYR_Polit_1_desc:0 "Les hauteurs du Golan seront fortifiées pour empêcher les raids de représailles des Israéliens."
 SYR_Polit_2:0 "Réfugiés palestiniens"
 SYR_Polit_2_desc:0 "Nous devrions accepter les réfugiés palestiniens et augmenter nos effectifs afin qu'à un moment donné, ils puissent retourner dans leur pays d'origine"
 SYR_Polit_3:0 "Base navale d'Alep"
 SYR_Polit_3_desc:0 "Pour le commerce et pour pouvoir avoir une marine, nous devons construire une base navale à Lattaquié"
 SYR_Polit_4:0 "Rejoignez l'UAR"
 SYR_Polit_4_desc:0 "Les coups d'État constants ont rendu le pays vulnérable. Nous devrions être unis sous la direction d'un leader fort qui a vaincu les puissances occidentales dans la crise de Suez, même si cela signifie sacrifier notre indépendance"
 SYR_Polit_5:0 "La Syrie d'abord"
 SYR_Polit_5_desc:0 "Malgré l'offre de Nasser, nous devons rester indépendants"
 SYR_Polit_6:0 "Se détacher"
 SYR_Polit_6_desc:0 "Il est clair que le panarabisme de Nasser n'a pas fonctionné dans la pratique. La Syrie a intérêt à être indépendante"
 SYR_Polit_7:0 "Agrandir le chemin de fer de Bagdad"
 SYR_Polit_7_desc:0 "Nous devons améliorer nos infrastructures en élargissant le chemin de fer actuel de Bagdad à Alep pour le relier également à Damas"
 SYR_Polit_8:0 "Améliorer les relations arabes"
 SYR_Polit_8_desc:0 "Entretenir des conversations avec les pays arables"
 SYR_Polit_9:0 "Plus de réfugiés palestiniens"
 SYR_Polit_9_desc:0 "Après la récente guerre, de plus en plus de réfugiés palestiniens ont inondé la région"
 SYR_Polit_10:0 "Alliance informelle"
 SYR_Polit_10_desc:0 "Les Soviétiques nous ont proposé une alliance informelle et une aide militaire si nous leur permettons d'accéder aux installations navales de Tartous"
 SYR_Polit_11:0 "Préparez-vous à la guerre"
 SYR_Polit_11_desc:0 "Nous devons réarmer nos armées pour la guerre"
 SYR_Polit_12:0 "Envahir le Liban"
 SYR_Polit_12_desc:0 "Avec l'intervention israélienne et islamiste au Liban, nous seuls pouvons rétablir l'ordre"
 SYR_Polit_13:0 "Fédération arabe"
 SYR_Polit_13_desc:0 "Nous devrions créer notre propre alliance avec nos partenaires régionaux"
 SYR_Polit_14:0 "Rejoignez le pacte de Varsovie"
 SYR_Polit_14_desc:0 " Nous entretenons déjà des relations solides avec les Soviétiques et devrions pouvoir rejoindre le pacte de Varsovie sans avoir à nous convertir au communisme pour nous protéger des États-Unis sionistes et de leurs maîtres israéliens"
