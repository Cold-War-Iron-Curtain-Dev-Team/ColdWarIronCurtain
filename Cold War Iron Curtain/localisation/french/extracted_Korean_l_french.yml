 korea.35.a2:0 "Envoyez plus !"
 korea.35.b2:0 "Gardez nos gars à la maison"
 korea.35.d2:0 "Les troupes nord-coréennes et chinoises ont avancé en Corée du Sud. Si nous n'envoyons pas plus d'hommes, le Nord communiste gagnera !"
 korea.35.t2:0 "Des forces supplémentaires sont nécessaires en Corée"
 korea.36.a2:0 "Intéressant."
 korea.36.b2:0 "Merde"
 korea.36.c2:0 "Plus il y en a, mieux c'est"
 korea.36.d2:0 "L'armée américaine vient d'envoyer davantage de troupes en Corée. Apparemment, c'est la première d'une longue vague de bénévoles..."
 korea.36.d3:0 "Nous devrions faire quelque chose"
 korea.36.t2:0 "[GetNewspaperHeader]Davantage de troupes américaines en Corée"
 korea.37.a2:0 "Envoyez plus !"
 korea.37.b2:0 "Nous en avons besoin nous-mêmes"
 korea.37.d2:0 "Les troupes sud-coréennes et américaines ont avancé en Corée du Nord. Si nous n'envoyons pas plus de forces, la racaille capitaliste gagnera !"
 korea.37.t2:0 "Plus d'hommes recherchés en Corée"
 korea.38.a2:0 "Intéressant."
 korea.38.b2:0 "Plus il y en a, mieux c'est"
 korea.38.c2:0 "Merde"
 korea.38.d2:0 "La République populaire de Chine vient d'envoyer davantage de troupes en Corée du Nord. On ne sait pas encore si ce sera le seul..."
 korea.38.d3:0 "Bon coup"
 korea.38.t2:0 "[GetNewspaperHeader]Davantage de troupes chinoises en Corée"
 korea.39.a2:0 "Envoyez plus !"
 korea.39.b2:0 "Gardez nos gars à la maison"
 korea.39.d2:0 "Les troupes nord-coréennes et chinoises ont avancé en Corée du Sud. Si nous n'envoyons pas plus d'hommes, le Nord communiste gagnera !"
 korea.39.t2:0 "Plus d'hommes recherchés en Corée"
 korea.40.a2:0 "Intéressant."
 korea.40.b2:0 "Merde"
 korea.40.c2:0 "Plus il y en a, mieux c'est"
 korea.40.d2:0 "L'armée américaine vient d'envoyer encore plus de troupes en Corée. C'est la deuxième vague de volontaires envoyés en Corée en un an."
 korea.40.d3:0 "Nous devrions faire quelque chose"
 korea.40.t2:0 "[GetNewspaperHeader]Encore plus de troupes américaines en Corée"
 korea.41.a2:0 "Envoyez plus !"
 korea.41.b2:0 "Nous en avons besoin nous-mêmes"
 korea.41.d2:0 "Les troupes sud-coréennes et américaines ont avancé en Corée du Nord. Si nous n'envoyons pas plus d'hommes, les ordures démocrates gagneront !"
 korea.41.t2:0 "Plus d'hommes recherchés en Corée"
 korea.42.a2:0 "Intéressant."
 korea.42.b2:0 "Plus il y en a, mieux c'est"
 korea.42.c2:0 "Merde"
 korea.42.d2:0 "La République populaire de Chine vient d'envoyer encore plus de troupes en Corée du Nord. Comme les États-Unis, ils continuent d'envoyer davantage de volontaires."
 korea.42.d3:0 "Bon coup"
 korea.42.t2:0 "[GetNewspaperHeader]Encore plus de troupes chinoises en Corée"
 korea.43.a2:0 "Envoyez plus !"
 korea.43.b2:0 "Gardez nos gars à la maison"
 korea.43.d2:0 "Ces troupes nord-coréennes sont plus fortes que nous le pensions. Avec l'aide des forces chinoises, ils ont réussi à pénétrer profondément en Corée du Sud. Il faut davantage d'hommes."
 korea.43.t2:0 "Il faut encore plus d'hommes en Corée"
 korea.44.a2:0 "Intéressant."
 korea.44.b2:0 "Merde"
 korea.44.c2:0 "Plus il y en a, mieux c'est"
 korea.44.d2:0 "En raison de la forte résistance du Nord et de la Chine, les États-Unis d'Amérique viennent d'envoyer leur troisième vague de volontaires pour soutenir la Corée du Sud."
 korea.44.d3:0 "Nous devrions faire quelque chose"
 korea.44.t2:0 "[GetNewspaperHeader]La troisième vague de volontaires américains"
 korea.45.a2:0 "Envoyez plus !"
 korea.45.b2:0 "Nous en avons besoin nous-mêmes"
 korea.45.d2:0 "Ces troupes sud-coréennes sont plus fortes que nous le pensions. Avec l'aide des forces américaines, ils ont réussi à pénétrer profondément en Corée du Nord. Il faut davantage d'hommes."
 korea.45.t2:0 "Il faut encore plus d'hommes en Corée"
 korea.46.a2:0 "Intéressant."
 korea.46.b2:0 "Plus il y en a, mieux c'est"
 korea.46.c2:0 "Dieu non !"
 korea.46.d2:0 "En réponse à la récente avancée sud-coréenne vers le Nord, la République populaire de Chine vient d'envoyer une troisième vague de volontaires en Corée."
 korea.46.d3:0 "Bon coup"
 korea.46.t2:0 "[GetNewspaperHeader]Troisième vague de troupes chinoises en Corée"
 korea.47.a2:0 "Au revoir Rhee !"
