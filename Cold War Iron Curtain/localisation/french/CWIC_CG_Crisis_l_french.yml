 cwic_cg_crisis.1.t:0 "Files d'attente pour les produits de base"
 cwic_cg_crisis.1.d:0 "La pénurie de biens de consommation de base entraîne de longues files d'attente devant les magasins. Les livraisons sont épuisées avant que tout le monde puisse être servi, et les ménages perdent des heures de travail à cause de la recherche de produits de première nécessité. Les disputes sur les places dans la file d'attente et la répartition des stocks restants s'adressent de plus en plus aux autorités.\n\nLes autorités locales peuvent être chargées d'entendre les plaintes et d'expliquer la situation de l'approvisionnement. Cela réduirait le temps consacré aux autres affaires gouvernementales sans rien ajouter aux rayons des magasins, mais cela donnerait aux ménages insatisfaits un moyen d'exprimer leurs doléances. Laisser les files d'attente sans surveillance épargnerait cet effort tout en permettant au ressentiment face aux pénuries de croître."
 cwic_cg_crisis.1.a:0 "Laissez les files d'attente pour le moment. Il n'y a plus rien à vendre."
 cwic_cg_crisis.1.b:0 "Demandez aux autorités locales d'entendre les plaintes."
 cwic_cg_crisis.2.t:0 "Marchandises sous le comptoir"
 cwic_cg_crisis.2.d:0 "Les produits de base qui ne sont pas disponibles dans les magasins sont proposés par des commerçants non officiels à des prix plus élevés. Certains ménages dépendent désormais de ces vendeurs pour leurs besoins de première nécessité, tandis que la perspective d'un profit encourage d'autres à acheter des stocks rares pour les revendre. Les marchandises détournées des circuits de vente au détail ordinaires rendent la pénurie plus difficile à gérer.\n\nTolérer ce commerce préserverait une source alternative d'approvisionnement, mais permettrait au marché noir de se développer. L'envoi d'inspecteurs nécessiterait que les fonctionnaires soient détournés d'autres tâches, et l'application des règles ne pourrait que restreindre le commerce tant que les pénuries perdureront. Le gouvernement doit décider quels efforts il consacrera à la poursuite des vendeurs dont les clients ont peu d'autres endroits vers lesquels se tourner."
 cwic_cg_crisis.2.a:0 "Laissez les commerçants tranquilles. Les gens ont besoin de ces biens."
 cwic_cg_crisis.2.b:0 "Envoyez des inspecteurs, même si certains échanges commerciaux échappent."
 cwic_cg_crisis.2.tt:0 "La pression du marché noir augmente de 5 points."
 cwic_cg_crisis.3.t:0 "Les portes de l'usine restent fermées"
 cwic_cg_crisis.3.d:0 "Les travailleurs confrontés à des pénuries persistantes de produits de première nécessité ont commencé à arrêter de travailler. Leurs griefs concernent la difficulté d'obtenir des produits de première nécessité et les heures que leurs familles passent à chercher des fournitures. Les arrêts perturbent la production des usines et d'autres lieux de travail pourraient suivre alors que les pénuries ne sont pas résolues.\n\nLes négociations donneraient aux travailleurs une audition, mais les pourparlers à eux seuls ne peuvent pas fournir les biens manquants. La production continuerait à souffrir pendant que les griefs seraient discutés. L'intervention de la police pourrait dégager les entrées des usines et disperser ceux qui empêchent le retour au travail, au prix d'une colère encore plus grande de l'opinion publique. Le gouvernement doit régler sa réponse avant que les arrêts ne se propagent."
 cwic_cg_crisis.3.a:0 "Ouvrir les négociations, même si les blocages se poursuivent."
 cwic_cg_crisis.3.b:0 "Envoyez la police dégager les portes."
 cwic_cg_crisis.4.t:0 "Rationnement des ménages proposé"
 cwic_cg_crisis.4.d:0 "Les pénuries persistantes ont conduit à proposer un système de rationnement des ménages pendant un an. Les cartes de rationnement limiteraient les achats de produits de base, réduisant ainsi la demande et empêchant les ménages capables de faire leurs courses en premier d'épuiser les stocks disponibles.\n\nLe projet n'augmenterait pas les approvisionnements et une allocation sur une carte ne garantirait pas qu'un magasin puisse l'honorer. Les restrictions entraîneraient également des conflits sur les droits des ménages et du ressentiment face à l'ingérence du gouvernement dans les achats quotidiens. Rejeter le rationnement permettrait d'éviter ces contrôles, mais laisserait les ménages se battre pour des approvisionnements insuffisants et les autorités confrontées à une colère constante face aux files d'attente. La proposition nécessite désormais l'approbation du gouvernement."
 cwic_cg_crisis.4.a:0 "Émettez les cartes. Limitez vos achats pendant un an."
 cwic_cg_crisis.4.b:0 "Rejetez les cartes, même si les files d'attente s'énervent."
 cwic_cg_rationing:0 "Rationnement des ménages"
 cwic_cg_rationing_desc:0 "Les cartes de rationnement limitent les achats de biens de base par les ménages, réduisant ainsi la demande des consommateurs. Les restrictions sur les achats quotidiens ont suscité du ressentiment et des conflits sur les allocations."
 cwic_cg_strike_wave:0 "Propagation des arrêts de travail"
 cwic_cg_strike_wave_desc:0 "Les travailleurs confrontés à des magasins vides ont arrêté de travailler alors que leurs griefs restent en suspens. Les arrêts de travail réduisent la production des usines militaires."
 cwic_cg_emergency_imports_idea:0 "Livraisons de marchandises d'urgence"
 cwic_cg_emergency_imports_idea_desc:0 "Les livraisons d'urgence complètent l'approvisionnement en produits de première nécessité. Pendant une période limitée, ils stimulent la production de biens de base."
 cwic_cg_introduce_rationing:0 "Émettre des cartes de rationnement pour les ménages"
 cwic_cg_introduce_rationing_desc:0 "Restreindre les achats de produits de base grâce à un système de cartes de rationnement d'un an. La baisse de la demande des consommateurs allégera la pression sur l'offre, au prix du ressentiment du public."
 cwic_cg_emergency_imports:0 "Organiser les livraisons de marchandises d'urgence"
 cwic_cg_emergency_imports_desc:0 "Organiser des expéditions d'urgence de produits de première nécessité depuis l'étranger. Ces livraisons stimuleront la production de biens de base pendant 90 jours, tandis que les pénuries à plus long terme restent à résoudre."
