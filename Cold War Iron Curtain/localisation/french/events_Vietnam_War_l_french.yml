l_french:
 NLF_Flavor.1.d:0 "Pour les communistes du Sud-Vietnam, le gouvernement de Saigon n'a pas réussi à organiser des élections d'unification et a poursuivi une politique d'oppression contre les communistes. Les conflits politiques internes réguliers à Saigon ainsi que la corruption ont grandement aliéné les paysans et les villages situés à l'écart des villes. Récemment, le gouvernement du Nord-Vietnam a approuvé une guerre de libération pour les communistes sud-vietnamiens. Les cadres du Viet Minh restés sur place après le retrait français ont été activés. Beaucoup forment désormais les paysans à la guérilla et les instruisent à la doctrine communiste. D'autres lancent déjà des attaques contre des responsables gouvernementaux dans les campagnes dans l'espoir de libérer rapidement le Sud-Vietnam. Le gouvernement sud-vietnamien déploie ses propres forces et s'est engagé à résoudre rapidement les troubles."
 NLF_Flavor.2.d:0 "Après les Accords de Genève, les communistes et le Viet Minh ont décidé de former le Front de libération nationale (FLN) pour défendre la cause communiste au Sud-Vietnam. Bien que l'accord stipule que tous les Viet Minh doivent se retirer du sud, plusieurs milliers seront secrètement laissés pour constituer le noyau du FNL. Pour l'instant, le FNL restera discret, nouera des contacts parmi les paysans et diffusera parmi eux l'idéologie communiste. Le FNL sèmera également troubles et instabilité pour maintenir le gouvernement de Saigon faible. Le FNL prévoit de créer plusieurs organisations de façade, notamment des mouvements religieux, pour couvrir son implication et frapper Saigon sous différents angles. Le FLN sera l'avant-garde de la révolution sudiste et dirigera l'unification du Vietnam le moment venu."
 Vietnam_War_Decisions_category_desc:0 "L'échec du Nord-Vietnam et du Sud-Vietnam \nse mettre d'accord sur un plan d'unification a quitté le régional \nsituation périlleuse. Chez les Sud-Vietnamiens \nil y avait ceux qui espéraient un gouvernement viable \npourrait émerger mais dans les zones rurales, il y avait \nmécontentement croissant face à l'incertitude politique et \nla corruption. Les Nord-Vietnamiens ont décidé de \nen profite et commence à s'entraîner vers le Sud \nLes communistes vietnamiens vont entamer une campagne nationale \nlutte pour l'unification. \n\n§RDes cadres nord-vietnamiens§! sont également envoyés \npour aider leurs alliés du sud. \n\nLe gouvernement §Ysud-vietnamien§! organise \nses propres forces et partisans pour écraser cela \nmenace et ensuite libérer le Vietnam eux-mêmes.\n\n§RFinancement du Front de libération nationale [?NLF.global_nlf_funding]§!\n§YFinancement de la République du Vietnam [?VIE.global_vie_funding]§!"

 VIN_Bao_Dai.1.d:0 "Aujourd'hui, nous avons pris la décision de dénoncer Bao-Dai. Le dernier empereur de la dynastie des Nguyen a montré une dernière fois son incompétence. Il n'est qu'une marionnette française et ne se soucie pas de son peuple ! Il n'a même pas la détermination nécessaire pour passer du temps dans notre pays et préfère passer du temps avec les impérialistes en France. Il est un symbole de l'oppression qui sévit dans notre pays depuis trop longtemps."
 CPSU_VIN.1.d:0 "Le 20e Congrès du Parti communiste de l'Union soviétique a lieu aujourd'hui. Nous avons reçu des informations sur un discours secret dénonçant l'ancien dirigeant de l'Union soviétique Joseph Staline et son culte de la personnalité. Il raconte comment il a consolidé son pouvoir et établi un culte comme un culte pour lui et le pouvoir qu'il détenait. Le PCUS a été victime de ses actions et nous soutenons le discours du Premier secrétaire Khrouchtchev : le communisme est une idéologie qui soutient tout le monde, pas seulement l'élite au sommet de la hiérarchie que nous avons tant essayé d'abolir. Même si nous sommes peut-être un peu incertains quant au discours, nous soutiendrons nos camarades du Nord. Espérons que le reste de la nation parvienne à comprendre les véritables motivations de l'ancien dirigeant."
 Le_Duan.1.d:0 "Le Duan a poussé sa campagne révolutionnaire à un rythme effréné. Il a critiqué les dirigeants actuels pour leur manque d'initiative en permettant la mort de nos camarades de l'État traître du sud. Diem n'a fait que céder aux capitalistes et aux impérialistes, il permet au gouvernement américain de l'utiliser comme une marionnette pour étendre son influence en Indochine et dans le reste de l'Asie du Sud-Est. Il a réorganisé les combattants après les Accords de Genève et appelle nos militaires à agir pour aider les combattants du Sud. Selon Le Duan, la tâche commune de la révolution vietnamienne à l'heure actuelle est d'accélérer la révolution socialiste au Nord-Vietnam tout en intensifiant la Révolution nationale démocratique populaire au Sud-Vietnam."
 VIN_Geneva.1.d:0 "Nous avons reçu une offre assez étrange de notre voisin du Nord qui demande un référendum. Lors des Accords de Genève, il a été déclaré qu'un référendum serait organisé pour l'unification afin de résoudre les divisions, mais nous recevons des pressions de la part de l'élite de notre gouvernement et du gouvernement américain pour refuser de le signer. Nous n'avons pas vraiment le choix dans cette affaire... N'est-ce pas ?"
 VIN_Geneva.2.d:0 "Sans surprise, le Sud a rejeté notre offre d'organiser un référendum, bien que cela soit stipulé dans les Accords de Genève. Il est clair que le Sud-Vietnam ne coopérera pas avec nous et est sous l'influence du gouvernement américain même si nous bénéficions du soutien des Chinois et des Français. Nous espérons qu'un jour ou l'autre, nos camarades du Sud comprendront qui est le propriétaire légitime des terres contestées."

 Vietnam_America.1.d:0 "\nEn raison des tensions croissantes au Nord-Vietnam et des désaccords généraux sur la politique intérieure, le gouvernement nord-vietnamien a annoncé la fermeture du consulat américain dans le pays et a donné à tout le personnel suffisamment de temps pour partir. Le Nord-Vietnam s'est prononcé et a dénoncé l'injustice des États-Unis, leur injustice et leurs actions secrètes, ainsi que leur soutien au Sud-Vietnam et a décidé que cela suffisait. Tous les regards du monde sont désormais tournés vers cette petite partie du monde... Tout ce qui peut se demander, c'est quel conflit va en découler ?"

