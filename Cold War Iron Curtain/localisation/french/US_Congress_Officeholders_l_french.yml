 USA_CONGRESS_SPEAKER_TT:0 "§Y[SPEAKER_TITLE]§!\n§gPrésident de la Chambre des représentants§!\n-------------------------------------\n[GetUSACongressSpeakerDescription]"
 USA_CONGRESS_SPEAKER_UNASSIGNED:0 "Non attribué"
 USA_CONGRESS_SPEAKER_UNASSIGNED_DESC:0 "La Chambre n'a pas de président reconnu. Le titulaire du poste apparaîtra ici une fois qu'une majorité gouvernementale aura été établie."
 USA_CONGRESS_VP_VACANT_DESC:0 "La vice-présidence est vacante. Aucun titulaire de charge n'est disponible pour présider le Sénat ou pour voter de manière décisive."
 USA_CONGRESS_VP_UNASSIGNED_DESC:0 "Le vice-président n'a pas été identifié pour cette administration."
 USA_CONGRESS_VP_GEORGE_H_W_BUSH_DESC:0 "Républicain du Texas avec une expérience au Congrès, en diplomatie et en renseignement, George H. W. Bush combine une vision internationale avec un vaste réseau au sein de son parti. Son approche privilégie les administrateurs expérimentés, les alliances fortes et la négociation."
 USA_CONGRESS_VP_JACK_KEMP_DESC:0 "Républicain de New York et ancien footballeur professionnel, Jack Kemp défend la baisse des impôts, la croissance économique et une base plus large pour son parti. Son engagement énergique en faveur de l'économie de l'offre s'accompagne d'un intérêt pour l'expansion des opportunités dans les villes américaines."
 USA_CONGRESS_VP_JOE_BIDEN_DESC:0 "Démocrate du Delaware avec une formation en droit, Joe Biden apporte son expérience aux débats judiciaires et de politique étrangère du Sénat. Son style politique met l'accent sur les relations personnelles, les préoccupations de la classe ouvrière et l'engagement direct avec ses collègues législateurs."
 USA_CONGRESS_VP_BOB_DOLE_DESC:0 "Républicain du Kansas et vétéran blessé de la Seconde Guerre mondiale, Bob Dole combine des vues budgétaires conservatrices avec une approche pratique de la législation. Sa maîtrise des négociations au Sénat et sa volonté de négocier au-delà des lignes de parti font de lui un partenaire influent au Congrès."
 USA_CONGRESS_VP_NANCY_KASSEBAUM_DESC:0 "Républicaine du Kansas, Nancy Kassebaum représente la tradition modérée de son parti. Son travail dans les domaines de l'éducation, de la santé publique et des affaires étrangères reflète une préférence pour des négociations prudentes et une coopération entre les partis."
 USA_CONGRESS_VP_BILL_CLINTON_DESC:0 "Démocrate de l'Arkansas ayant une expérience du gouvernement de l'État, Bill Clinton se présente comme un réformateur pragmatique. L'éducation, le développement économique et la modernisation du gouvernement sont au centre de ses efforts pour relier les priorités démocrates aux électeurs en quête de résultats pratiques."
 USA_CONGRESS_VP_AL_GORE_DESC:0 "Démocrate du Tennessee avec une formation en journalisme et au Congrès, Al Gore s'intéresse particulièrement à la technologie, à la protection de l'environnement et à la sécurité nationale. Son approche politique cherche à relier le changement scientifique aux besoins économiques à long terme du pays."
 USA_CONGRESS_VP_LLOYD_BENTSEN_DESC:0 "Démocrate du Texas, homme d'affaires et vétéran de la Seconde Guerre mondiale, Lloyd Bentsen apporte une vision méridionale modérée à la politique nationale. Son expérience dans les domaines de la finance et des négociations au Congrès fait de lui un pont utile entre les intérêts des entreprises et le programme législatif de son parti."
 USA_CONGRESS_VP_TED_KENNEDY_DESC:0 "Démocrate du Massachusetts, Edward Kennedy est l'un des principaux défenseurs des droits civiques, des soins de santé et du travail organisé. Son importance nationale et sa maîtrise des négociations législatives donnent à l'aile libérale de son parti une voix déterminée dans l'administration."
 USA_CONGRESS_VP_PAUL_LAXALT_DESC:0 "Républicain du Nevada avec une expérience à la fois comme gouverneur et sénateur, Paul Laxalt est un éminent conservateur occidental. Il est favorable à un gouvernement fédéral limité et à une coopération personnelle étroite avec ses alliés politiques, en s'appuyant sur les relations établies au sein des États et au niveau national."
 USA_CONGRESS_VP_BILL_BRADLEY_DESC:0 "Démocrate du New Jersey et ancien joueur de basket-ball professionnel, Bill Bradley aborde la fonction publique par un travail politique détaillé. La réforme fiscale, les opportunités économiques et les responsabilités du gouvernement sont des préoccupations centrales dans sa vision du renouveau national."
 USA_CONGRESS_VP_LINDY_BOGGS_DESC:0 "Démocrate de Louisiane, Lindy Boggs combine une connaissance approfondie de la politique du Congrès avec un intérêt pour l'égalité des femmes et les opportunités économiques. Son approche patiente et personnelle de la négociation lui permet de travailler avec des législateurs de différentes régions et traditions idéologiques."
 USA_CONGRESS_VP_ANN_RICHARDS_DESC:0 "Démocrate du Texas avec une expérience dans les finances publiques et le gouvernement de l'État, Ann Richards est connue pour ses prises de parole en public avec force et son intérêt pour la réforme politique. Elle plaide en faveur d'un gouvernement responsable et d'une participation plus large des personnes traditionnellement exclues des fonctions publiques."
 USA_CONGRESS_VP_PHIL_CRANE_DESC:0 "Républicain de l'Illinois et ancien professeur d'histoire, Philip Crane est un ardent défenseur d'un gouvernement limité, d'une fiscalité réduite et du libre-échange. Son identité politique repose sur les efforts du mouvement conservateur pour remodeler son parti et la politique économique nationale."
 USA_CONGRESS_VP_GERALDINE_FERRARO_DESC:0 "Démocrate de New York et ancienne procureure, Geraldine Ferraro apporte son expérience de la justice pénale et de la Chambre des représentants. Ses priorités incluent la sécurité économique, l'égalité des chances et une place plus forte pour les femmes dans la vie politique nationale."
 USA_CONGRESS_VP_PATRICK_LUCEY_DESC:0 "Démocrate du Wisconsin ayant une expérience dans le gouvernement et la diplomatie des États, Patrick Lucey est favorable aux investissements publics et à la réforme administrative. Son travail sur l'éducation et le développement économique reflète la tradition progressiste de son État d'origine."
 USA_CONGRESS_VP_WALTER_CRONKITE_DESC:0 "Journaliste chevronné, Walter Cronkite apporte la réputation publique d'un journaliste national familier à une fonction politique inconnue. Sa carrière couvrant la guerre, les élections et les grands événements nationaux lui donne une perspective façonnée par la communication publique plutôt que par l'organisation du parti."
 USA_CONGRESS_VP_HUGH_CAREY_DESC:0 "Démocrate de New York et vétéran de la Seconde Guerre mondiale, Hugh Carey apporte son expérience au Congrès et au bureau exécutif de l'État. Sa réputation repose notamment sur la gestion budgétaire et les négociations difficiles nécessaires au maintien des services publics en période de crise financière."
 USA_CONGRESS_VP_MILTON_SHAPP_DESC:0 "Démocrate de Pennsylvanie, ingénieur et homme d'affaires en électronique, Milton Shapp combine une expérience du secteur privé avec un intérêt pour les services publics. Sa carrière politique reflète sa conviction que les investissements gouvernementaux et le développement économique peuvent aller de pair avec les syndicats."
 USA_CONGRESS_VP_DAN_QUAYLE_DESC:0 "Républicain de l'Indiana, Dan Quayle représente une jeune génération de législateurs conservateurs. Son soutien à la défense nationale, à l'entreprise privée et à la maîtrise des dépenses fédérales le place fermement au sein de la coalition conservatrice de son parti."
 USA_CONGRESS_VP_WALTER_MONDALE_DESC:0 "Démocrate du Minnesota ayant une expérience en droit et au Sénat, Walter Mondale appartient à la tradition politique libérale de son État. Les droits civiques, la protection sociale et une coopération étroite avec les syndicats façonnent son approche de la responsabilité gouvernementale et exécutive."
 USA_CONGRESS_VP_JIM_HUNT_DESC:0 "Démocrate de Caroline du Nord, Jim Hunt place l'éducation et le développement économique au centre de son programme public. Son approche cherche à combiner l'amélioration des services publics avec les investissements des entreprises et la modernisation de l'économie du Sud."
 USA_CONGRESS_VP_JERRY_BROWN_DESC:0 "Démocrate californien, Jerry Brown combine préoccupations environnementales et intérêt pour les idées nouvelles en mettant l'accent sur la rigueur budgétaire. Son style politique indépendant remet souvent en question les attentes établies au sein de son propre parti ainsi que celles de ses adversaires."
 USA_CONGRESS_VP_TOM_RIDGE_DESC:0 "Républicain de Pennsylvanie et vétéran du Vietnam, Tom Ridge apporte à l'administration une expérience du Congrès et une vision politique pragmatique. Sa carrière publique met l'accent sur les opportunités économiques, le service national et la coopération au-delà des frontières de son parti."
 USA_CONGRESS_VP_JOHN_LAFALCE_DESC:0 "Démocrate de New York, avocat et vétéran de l'armée, John LaFalce apporte à l'administration une vaste expérience du Congrès. Son travail sur le secteur bancaire et les petites entreprises place la politique économique, la surveillance financière et les besoins des entreprises locales parmi ses principales préoccupations."
 USA_CONGRESS_VP_DIANE_FEINSTEIN_DESC:0 "Démocrate californienne ayant une expérience dans le gouvernement municipal, Dianne Feinstein met l'accent sur la compétence administrative, la sécurité publique et la négociation pratique. Son style politique privilégie une surveillance détaillée et un compromis entre les partis."
 USA_CONGRESS_VP_ROBERT_BYRD_DESC:0 "Démocrate de Virginie-Occidentale, Robert Byrd est étroitement associé aux règles, aux traditions et au contrôle des dépenses publiques du Sénat. Son influence repose sur ses connaissances procédurales, une attention soutenue aux intérêts de son État d'origine et une formidable compréhension de la politique du Congrès."
 USA_CONGRESS_VP_MO_UDALL_DESC:0 "Démocrate de l'Arizona et ancien basketteur professionnel, Morris Udall est un éminent défenseur de la conservation et de la réforme gouvernementale. Sa carrière législative combine les intérêts occidentaux avec une vision libérale et une réputation d'humour et de collégialité."
 USA_CONGRESS_VP_RICHARD_LUGAR_DESC:0 "Républicain de l'Indiana ayant une expérience du gouvernement municipal et du Sénat, Richard Lugar s'intéresse particulièrement aux affaires étrangères et à la sécurité nationale. Son approche met l'accent sur un travail politique détaillé, des relations internationales solides et une coopération entre les partis."
 USA_CONGRESS_VP_MIKE_GRAVEL_DESC:0 "Démocrate de l'Alaska, Mike Gravel est connu pour avoir contesté la conduite de la guerre du Vietnam et défendu l'accès du public à l'information. Sa vision indépendante place les libertés civiles, la responsabilité du Congrès et la critique du pouvoir en place au centre de sa politique."
 USA_CONGRESS_VP_EDWARD_BROOKE_DESC:0 "Républicain du Massachusetts, avocat et vétéran de la Seconde Guerre mondiale, Edward Brooke représente l'aile modérée du parti. Les droits civiques, le logement et les affaires urbaines occupent une place importante dans ses efforts visant à construire une coalition républicaine plus large et plus inclusive."
 USA_CONGRESS_VP_NEWT_GINGRICH_DESC:0 "Républicain de Géorgie et ancien professeur d'histoire, Newt Gingrich est favorable à une stratégie conservatrice affirmée pour remodeler la politique nationale. L'organisation du parti, la communication politique et la contestation de la direction établie du Congrès définissent son approche du pouvoir."
 USA_CONGRESS_VP_ADLAI_STEVENSON_III_DESC:0 "Démocrate de l'Illinois issu d'une famille politique éminente, Adlai Stevenson III apporte son expérience des finances publiques et du Sénat. Ses intérêts pour la politique économique et les affaires étrangères accompagnent un style politique mesuré façonné par le service public."
 USA_CONGRESS_VP_ALBEN_BARKLEY_DESC:0 "Démocrate du Kentucky et leader chevronné du Sénat, Alben Barkley est un ardent défenseur de la tradition du New Deal. Sa chaleur, son discours et sa longue expérience des négociations au Congrès contribuent à relier la Maison Blanche aux législateurs des différentes ailes du Parti démocrate."
 USA_CONGRESS_VP_RICHARD_NIXON_DESC:0 "Républicain californien possédant une expérience dans les deux chambres du Congrès, Richard Nixon a bâti sa réputation nationale grâce à son anticommunisme et à son intérêt pour les affaires étrangères. Son organisation politique disciplinée et son attention à la stratégie électorale font de lui un partenaire actif de l'administration."
 USA_CONGRESS_VP_LYNDON_B_JOHNSON_DESC:0 "Démocrate du Texas et leader expérimenté du Sénat, Lyndon Johnson est connu pour sa persuasion personnelle et ses négociations législatives complexes. Sa maîtrise des relations au Congrès lui permet de négocier entre les conservateurs du Sud, les libéraux du Nord et les priorités du pouvoir exécutif."
 USA_CONGRESS_VP_HUBERT_HUMPHREY_DESC:0 "Démocrate du Minnesota et ancien maire de Minneapolis, Hubert Humphrey est un fervent défenseur des droits civiques, du mouvement syndical et de la réforme sociale. Son style public optimiste accompagne un effort persistant pour transformer les objectifs libéraux en une législation viable du Congrès."
 USA_CONGRESS_VP_SPIRO_AGNEW_DESC:0 "Républicain du Maryland ayant une expérience dans le gouvernement local et étatique, Spiro Agnew est un ardent défenseur de la loi et de l'ordre. Son style public conflictuel donne une voix importante aux électeurs irrités par les mouvements de protestation, le changement culturel et les institutions politiques libérales."
 USA_CONGRESS_VP_GERALD_FORD_DESC:0 "$Gerald_Ford_TT$"
 USA_CONGRESS_VP_NELSON_ROCKEFELLER_DESC:0 "Républicain new-yorkais possédant une vaste expérience du gouvernement de l'État, Nelson Rockefeller représente une tradition militante et modérée au sein de son parti. Il est favorable à des programmes publics ambitieux, à une défense nationale forte et à une vision internationale éclairée par les entreprises et le service public."
