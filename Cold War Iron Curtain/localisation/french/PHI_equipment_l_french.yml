 #PHI_jet_multirole_equipment_8:0 "Northrop F-5E Tiger II"
 #PHI_jet_multirole_equipment_8_short:0 "F-5E Tiger II"
 #PHI_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 ADF (Operating Capability Upgrades) Fighting Falcon"
 #PHI_jet_multirole_equipment_9_short:0 "F-16A Block 15 OCU"
 #PHI_jet_multirole_equipment_9_desc:0 "The first major change in the F-16, the Block 15 aircraft featured larger horizontal stabilizers, the addition of two hardpoints to the chin inlet, a new radar, and increased capacity for underwing pylons. This variant also acquired an up-to-date Ultra High Frequency (UHF) radio. This variant is the most numerous among the F-16 variants."
 #PHI_jet_multirole_equipment_10:0 "General Dynamics F-16A Block 15 OCU (Air Defense Fighter ) Fighting Falcon"
 #PHI_jet_multirole_equipment_10_short:0 "F-16ADF Block 15"
 #PHI_jet_multirole_equipment_10_desc:0 "The F-16 Air Defense Fighter (ADF) was a special variant of the Block 15 optimized for the United States Air National Guard's fighter interception mission. Begun in 1989, 270 airframes were modified. Avionics were upgraded (including the addition of an Identification friend or foe (IFF) interrogator with "bird-slicing" IFF antennas), and a spotlight fitted forward and below the cockpit, for night-time identification. This was the only US version equipped with the AIM-7 Sparrow air-to-air missile. Beginning in 1994, these aircraft began to be replaced by newer F-16C variants. By 2005, only the North Dakota ANG was flying this variant, with these last examples retired from the US service by 2007."

 PHI_jet_interceptor_equipment_2:0 "Chien Sabre F-86D nord-américain"
 PHI_jet_interceptor_equipment_2_short:0 "Chien sabre F-86D"
 PHI_jet_interceptor_equipment_2_desc:0 "Développé comme un intercepteur tous temps, le F-86D (initialement désigné F-95) a repris les performances impressionnantes du F-86 Sabrejet et les a améliorées, en ajoutant un radar (donnant à la variante son radôme avant distinctif), un fuselage plus long et un moteur de postcombustion plus gros. Équipé à l'origine d'une baie de lancement de fusée interne pour l'interception des bombardiers, les variantes ultérieures du « Sabre Dog » seraient équipées de canons."

 PHI_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 PHI_jet_light_equipment_1_short:0 "Étoile filante T-33"
 PHI_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 PHI_jet_light_equipment_2:0 "Étoile filante Lockheed AT-33A"
 PHI_jet_light_equipment_2_short:0 "Étoile filante AT-33A"
 PHI_jet_light_equipment_2_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 PHI_jet_light_equipment_3:0 "Chasseur de la liberté Northtrop F-5A"
 PHI_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 PHI_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 PHI_jet_light_equipment_4:0 "Rockwell OV-10A Bronco nord-américain"
 PHI_jet_light_equipment_4_short:0 "OV-10A Bronco"
 PHI_jet_light_equipment_4_desc:0 "Le North American Rockwell OV-10 Bronco est un avion d'attaque et d'observation léger bi-turbopropulseur américain. Il a été développé dans les années 1960 comme avion spécial pour le combat contre-insurrectionnel (COIN), et l'une de ses principales missions était d'être un avion de contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et flâner pendant trois heures ou plus."
 PHI_jet_light_equipment_5:0 "Rockwell OV-10D Bronco nord-américain"
 PHI_jet_light_equipment_5_short:0 "OV-10D Bronco"
 PHI_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, ajoutant un système de vision nocturne infrarouge tourné vers l'avant avec une caméra montée sur la tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le D possède également des moteurs plus gros et des hélices en fibre de verre plus grandes. D'autres différences externes notables sont les distributeurs de paillettes installés à mi-chemin des flèches et les cheminées d'échappement suppressives des infrarouges (qui mélangent les gaz d'échappement avec de l'air plus froid pour réduire la signature thermique de l'avion)."

 PHI_recon_equipment_0:0 "Stinson L-5 Sentinelle"
 PHI_recon_equipment_0_short:0 "Sentinelle L-5"
 PHI_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il a été produit par la Stinson Aircraft Company."
 PHI_jet_recon_equipment_0:0 "Cessna O-1 Chien d'oiseau"
 PHI_jet_recon_equipment_0_short:0 "O-1 Chien Oiseau"
 PHI_jet_recon_equipment_0_desc:0 "Le Cessna L-19/O-1 Bird Dog est un avion de liaison et d'observation. Il s'agissait du premier avion à voilure fixe entièrement métallique commandé pour et par l'armée américaine après la séparation de l'armée de l'air en 1947. Le Bird Dog a eu une longue carrière dans l'armée américaine, ainsi que dans d'autres pays. "
 PHI_jet_recon_equipment_1:0 "Northrop RF-5A"
 PHI_jet_recon_equipment_1_short:0 "RF-5A"
 PHI_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace du chasseur F-5A."

 #PHI_cas_stealth_equipment_1:0 "KAI FA-50PH Golden Eagle"
 #PHI_cas_stealth_equipment_1_short:0 "FA-50PH Golden Eagle"
 #PHI_cas_stealth_equipment_1_desc:0 "The KAI T-50 Golden Eagle is a family of South Korean supersonic advanced jet trainers and light combat aircraft, developed by Korea Aerospace Industries (KAI) with Lockheed Martin. The T-50 is South Korea's first indigenous supersonic aircraft and one of the world's few supersonic trainers. Development began in the late 1990s, and its maiden flight occurred in 2002. The aircraft entered active service with the Republic of Korea Air Force (ROKAF) in 2005."

