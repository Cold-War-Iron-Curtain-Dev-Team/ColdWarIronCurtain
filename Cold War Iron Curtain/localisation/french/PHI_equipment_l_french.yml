 #PHI_attack_helicopter_equipment_5:0 "TAI T129 ATAK"
 #PHI_attack_helicopter_equipment_5_short:0 "T129 ATAK"
 #PHI_attack_helicopter_equipment_5_desc:0 "The TAI/AgustaWestland T129 ATAK is a twin-engine, tandem seat, multi-role, all-weather attack helicopter based on the Agusta A129 Mangusta platform. The T129 was developed by Turkish Aerospace Industries (TAI) with partner AgustaWestland"

 PHI_utility_helicopter_equipment_1:0 "Mésange Sikorsky H-19"
 PHI_utility_helicopter_equipment_1_short:0 "Mésange H-19"
 PHI_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 PHI_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 PHI_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connue sous le nom de « Huey » (du nom de sa désignation originale d'avant 1962, HU-1), l'UH-1A est la variante du modèle militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agissait du premier hélicoptère en service par une branche de l'armée américaine à utiliser un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication américaine dans la guerre du Vietnam. Bien que son nom soit officieusement « Huey », son surnom officiel est « Iroquois »."
 PHI_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 PHI_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 PHI_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la variante militaire du Bell 205. Il a été conçu avec un fuselage étiré, de sorte qu'il pourrait servir principalement de transport de troupes pour remplacer l'ancien CH-34 Choctaw dans l'armée américaine. 2 000 de ces variantes « Iroquois D » ont été construites, dont beaucoup ont été converties au standard UH-1H avec un moteur amélioré et plus puissant."
 PHI_utility_helicopter_equipment_4:0 "Bell UH-1H Huey"
 PHI_utility_helicopter_equipment_4_short:0 "UH-1H Huey"
 PHI_utility_helicopter_equipment_4_desc:0 "En 1966, Bell a installé le moteur Lycoming T53-L-13 de 1 400 shp (1 000 kW) pour fournir plus de puissance à l'avion. Le tube de Pitot a été déplacé du nez vers le toit du cockpit, pour éviter tout dommage lors de l'atterrissage. Les modèles de production dans cette configuration ont été désignés sous le nom d'UH-1H."
 PHI_utility_helicopter_equipment_5:0 "Bell UH-1H-II Huey"
 PHI_utility_helicopter_equipment_5_short:0 "UH-1H-II Huey"
 PHI_utility_helicopter_equipment_5_desc:0 "Un UH-1H modifié et remotorisé, les améliorations étaient un turbomoteur Allison T53-L-703 fournissant 1 343 kW (1 800 shp), un système de réduction des vibrations, des contre-mesures infrarouges et un cockpit compatible avec des lunettes de vision nocturne (NVG). Cela améliore considérablement les performances et la rentabilité."
 PHI_utility_helicopter_equipment_6:0 "Sikorsky UH-60A-5 Faucon Noir"
 PHI_utility_helicopter_equipment_6_short:0 "UH-60A-5 Faucon Noir"
 PHI_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 PHI_utility_helicopter_equipment_7:0 "Sikorsky S-70i Faucon Noir"
 PHI_utility_helicopter_equipment_7_short:0 "S-70i Faucon Noir"
 PHI_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."

