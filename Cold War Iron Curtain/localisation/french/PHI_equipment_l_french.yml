 PHI_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 PHI_infantry_equipment_0_short:0 "M1 Garand"
 PHI_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 PHI_infantry_equipment_1:0 "Fusil américain, calibre 7,62 mm, M14"
 PHI_infantry_equipment_1_short:0 "M14"
 PHI_infantry_equipment_1_desc:0 "Le M14 ou officiellement connu sous le nom de United States Rifle, calibre 7,62 mm, M14 est un fusil de combat américain chambré en 7,62x51 mm OTAN. Il est devenu le fusil standard de l'armée américaine en 1959, remplaçant le fusil M1 Garand dans l'armée américaine en 1958 et le Corps des Marines des États-Unis en 1965. C'était le dernier fusil de combat américain distribué en quantité au personnel militaire américain. La puissance de la cartouche OTAN de 7,62 × 51 mm lui a permis de bien pénétrer la couverture et d'atteindre une portée étendue. Il a servi principalement dans de nombreuses guerres en Indochine, mais son principal point culminant a été pendant la guerre du Vietnam. Après son remplacement par le M16, il fut exporté vers de nombreux membres."

 PHI_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16"
 PHI_infantry_equipment_2_short:0 "M16"
 PHI_infantry_equipment_2_desc:0 "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 PHI_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 PHI_infantry_equipment_3_short:0 "M16A2"
 PHI_infantry_equipment_3_desc:0 "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 PHI_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4"
 PHI_infantry_equipment_4_short:0 "Carabine M4"
 PHI_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."

