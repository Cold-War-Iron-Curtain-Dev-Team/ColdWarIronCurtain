 PHI_mechanized_equipment_1:0 "Demi-piste M2"
 PHI_mechanized_equipment_1_short:0 "Demi-piste M2"
 PHI_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 PHI_mechanized_equipment_2:0 "Demi-piste M3"
 PHI_mechanized_equipment_2_short:0 "Demi-piste M3"
 PHI_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 PHI_mechanized_equipment_3:0 "Demi-piste M3A1"
 PHI_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 PHI_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
 PHI_mechanized_equipment_4:0 "Camion canon REO M35A1"
 PHI_mechanized_equipment_4_short:0 "Camion canon M35A1"
 PHI_mechanized_equipment_4_desc:0 "Les premières conversions plus sophistiquées du modèle ont été réalisées par l'armée américaine au Vietnam. Les bataillons d'artillerie de l'armée américaine (armes automatiques, automotrices) se voyaient souvent attribuer des batteries d'artillerie (calibre.50), des unités équipées de camions M35 et de systèmes M55 Quadmount équipés de quatre mitrailleuses M2 Browning."
 PHI_mechanized_equipment_5:0 "M113" 
 PHI_mechanized_equipment_5_short:0 "M113"
 PHI_mechanized_equipment_5_desc:0 "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 PHI_mechanized_equipment_6:0 "Transporteur, personnel, entièrement chenillé, blindé, M113A1"
 PHI_mechanized_equipment_6_short:0 "M113A1"
 PHI_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 PHI_mechanized_equipment_7:0 "Cadilac Gage Commando V-150 APC"
 PHI_mechanized_equipment_7_short:0 "V-150 APC"
 PHI_mechanized_equipment_8:0 "FMC PIFV-A1-12.7"
 PHI_mechanized_equipment_8_short:0 "PIFV-A1-12.7"
 PHI_mechanized_equipment_9:0 "GKN Simba"
 PHI_mechanized_equipment_9_short:0 "Simba"
 PHI_mechanized_equipment_9_desc:0 "Le véhicule de combat léger (LCV) Simba a été conçu par GKN principalement pour les ventes sur les marchés d'exportation, destiné à l'origine à compléter le GKN Saxon. Un prototype a été présenté pour la première fois en 1978 à l'exposition d'Aldershot.[4] En juin 1982, il a été revu avec un canon Cockerill de 90 mm."
