 PHI_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 PHI_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 PHI_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73."
