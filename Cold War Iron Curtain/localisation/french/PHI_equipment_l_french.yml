 PHI_cv_jet_multirole_equipment_4:0 "Vought F-8D croisé"
 PHI_cv_jet_multirole_equipment_4_short:0 "Croisé F-8D"
 PHI_cv_jet_multirole_equipment_4_desc:0 "Chasseur monomoteur supersonique de supériorité aérienne, le F-8 (à l'origine connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée de la flotte. L'avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (ce dernier qu'il a remplacé), ainsi que la capacité de fonctionner comme une plate-forme de reconnaissance photographique rapide. Surnommé le « Croisé », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, lui donnant ainsi un autre surnom, « Le dernier Gunfighter »."
 PHI_cv_jet_multirole_equipment_5:0 "Vought F-8H croisé"
 PHI_cv_jet_multirole_equipment_5_short:0 "Croisé F-8H"
 PHI_cv_jet_multirole_equipment_5_desc:0 "Chasseur monomoteur supersonique de supériorité aérienne, le F-8 (à l'origine connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée de la flotte. L'avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (ce dernier qu'il a remplacé), ainsi que la capacité de fonctionner comme une plate-forme de reconnaissance photographique rapide. Surnommé le « Croisé », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, lui donnant ainsi un autre surnom, « Le dernier Gunfighter »."

