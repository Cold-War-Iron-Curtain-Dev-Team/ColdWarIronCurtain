 #Philipines Air Force

 PHI_fighter_equipment_0:0 "Force aérienne philippine"
 PHI_fighter_equipment_0_short:0 "FAP"
 PHI_fighter_equipment_0_desc:0 "La Philippine Air Force (PAF) est la branche des services de guerre aérienne des forces armées des Philippines. Initialement formée dans le cadre de l'armée philippine (Philippine Army Air Corps), la PAF est chargée à la fois de défendre l'espace aérien philippin et de mener des opérations aériennes à travers les Philippines, telles que des opérations d'appui aérien rapproché, des patrouilles aériennes de combat, des missions de reconnaissance aérienne, des opérations de transport aérien, des opérations tactiques par hélicoptère et des opérations humanitaires aériennes."

 PHI_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 PHI_fighter_equipment_1_short:0 "Faucon de guerre P-40"
 PHI_fighter_equipment_1_desc:0 "Le P-40 était un avion de combat monomoteur entièrement métallique développé en 1938 et était une version modifiée du P-36 Hawk. Ce type serait utilisé par un nombre important de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il soit inférieur aux derniers P-47 et P-51, il servirait en première ligne jusqu'à la fin de la guerre. 200 pilotes alliés de 7 pays différents, des États-Unis aux pays du Commonwealth britannique en passant par l'Union soviétique, sont devenus des as du P-40. Malgré les désignations différentes pour le service du Commonwealth et le service soviétique, le surnom officiel du service américain est « Warhawk »."
 PHI_fighter_equipment_2:0 "République F-47 Thunderbolt"
 PHI_fighter_equipment_2_short:0 "F-47 Tonnerre"
 PHI_fighter_equipment_2_desc:0 "Le P-47 était le développement ultérieur des avions Seversky (le prédécesseur de Republic) P-35 et Republic P-43 Lancer. Bien qu'il ait été conçu à l'origine comme un chasseur de supériorité aérienne. La renommée du P-47 était sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de l'héritage de l'entreprise en matière de développement d'avions d'appui aérien rapproché (CAS). Ce type a été utilisé dans une myriade de nations alliées pendant la Seconde Guerre mondiale et a continué à fonctionner ainsi après la guerre, certains affirmant que ce type, et non le P-51 Mustang, aurait dû être utilisé en Corée. Son surnom est « Thunderbolt », le premier dans les conventions de dénomination modernes de Republic. A été rebaptisé F-47 en 1948."
 PHI_fighter_equipment_3:0 "F-51D Mustang nord-américain"
 PHI_fighter_equipment_3_short:0 "F-51D Mustang"
 PHI_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais produits dans l'histoire de l'aviation. Développé par North American Aviation. Le type est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, le type allait, avec l'introduction de la variante « D », devenir célèbre comme le premier chasseur à domination aérienne au monde, assurant l'escorte des bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen, détruisant près de 5 000 avions pendant la guerre. Plus tard désigné F-51, il servira avec distinction comme avion CAS pendant la guerre de Corée, et le « Mustang », le cheval de trait de l'USAAAF, continuera son service jusqu'en 1968."

 #PHI_jet_multirole_equipment_1:0 ""
 #PHI_jet_multirole_equipment_1_short:0 ""
 #PHI_jet_multirole_equipment_1_desc:0 ""
 PHI_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 PHI_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 PHI_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 PHI_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 PHI_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 PHI_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 PHI_jet_multirole_equipment_4:0 "Sabre nord-américain F-86L"
 PHI_jet_multirole_equipment_4_short:0 "Sabre F-86L"
 PHI_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
