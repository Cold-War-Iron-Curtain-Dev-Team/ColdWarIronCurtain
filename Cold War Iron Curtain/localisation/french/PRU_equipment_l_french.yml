 PRU_jet_multirole_equipment_1:0 "Étoile filante Lockheed F-80C"
 PRU_jet_multirole_equipment_1_short:0 "Étoile filante F-80C"
 PRU_jet_multirole_equipment_1_desc:0 "Le premier chasseur à réaction exploité par l'US Army Air Force (plus tard l'US Air Force). C'était le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce type marquerait le début de l'ère des avions à réaction pour les États-Unis, car sa conception à aile droite servait largement de chasseur de jour et de chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « l'étoile filante », le F-80 représentait le premier summum de l'aviation américaine."
 PRU_jet_multirole_equipment_2:0 "Sabre nord-américain F-86A"
 PRU_jet_multirole_equipment_2_short:0 "Sabre F-86A"
 PRU_jet_multirole_equipment_2_desc:0 "Le F-86 est un chasseur à réaction à ailes en flèche développé et introduit à la fin des années 1940 à partir de recherches capturées par les Allemands. La conception de l'avion le rendait capable d'atteindre des vitesses transsoniques et une grande maniabilité, caractéristiques qui le rendaient capable de gérer son célèbre rival, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, aux côtés de ses variantes canadiennes et australiennes réunies, en ferait l'avion de combat occidental le plus produit de l'histoire de l'aviation."
 PRU_jet_multirole_equipment_3:0 "Hawker Chasseur F.1"
 PRU_jet_multirole_equipment_3_short:0 "Chasseur F.1"
 PRU_jet_multirole_equipment_4:0 "Hawker Hunter F.52"
 PRU_jet_multirole_equipment_4_short:0 "Chasseur F.52"
 #PRU_jet_multirole_equipment_5:0 ""
