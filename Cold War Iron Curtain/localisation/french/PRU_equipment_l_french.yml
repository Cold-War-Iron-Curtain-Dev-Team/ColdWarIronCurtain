 PRU_jet_multirole_equipment_9:0 "Dassault Mirage 2000P"
 PRU_jet_multirole_equipment_9_short:0 "Mirage2000P"
 PRU_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 PRU_jet_multirole_equipment_10_short:0 "MiG-29A"
 PRU_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."

 #PRU_CAS_equipment_1:0 ""
