 PRU_mbt_equipment_2:0 "T-54"
 PRU_mbt_equipment_2_short:0 "T-54"
 PRU_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 PRU_mbt_equipment_3:0 "T-55"
 PRU_mbt_equipment_3_short:0 "T-55"
 PRU_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "

 PRU_mechanized_equipment_1:0 "Demi-piste M2"
 PRU_mechanized_equipment_1_short:0 "Demi-piste M2"
 PRU_mechanized_equipment_1_desc:0 "La voiture semi-chenillée M2 est une voiture semi-chenillée blindée produite par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspirait des semi-chenilles importées de France dans les années 1930, employant des composants standard fournis par les constructeurs de camions américains pour accélérer la production et réduire les coûts. Le concept a été conçu et les modèles pilotes fabriqués par Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement étiqueté M2.). La production par la White Motor Company a commencé en 1940 et a été élargie pour inclure Autocar."
 PRU_mechanized_equipment_2:0 "Demi-piste M3"
 PRU_mechanized_equipment_2_short:0 "Demi-piste M3"
 PRU_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 PRU_mechanized_equipment_3:0 "Demi-piste M3A1"
 PRU_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 PRU_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
