 PRU_jet_tac_bomber_equipment_3:0 "Canberra électrique anglais B(I).56"
 PRU_jet_tac_bomber_equipment_3_short:0 "Canberra B(I).56"

 PRU_transport_plane_equipment_1:0 "Train aérien Douglas C-47"
 PRU_transport_plane_equipment_1_short:0 "Train aérien C-47"

 PRU_transport_plane_equipment_5:0 "De Haviland Canada DHC-5 Buffalo"
 PRU_transport_plane_equipment_5_short:0 "DHC-5 Buffle"
 PRU_transport_plane_equipment_6:0 "Antonov An-32"
 PRU_transport_plane_equipment_6_short:0 "An-32"
 PRU_transport_plane_equipment_6_desc:0 "L'An-32 est essentiellement un An-26 remotorisé. Il est conçu pour mieux résister aux conditions météorologiques défavorables que l'An-26 standard. Annoncé au Salon du Bourget de mai 1977, l'An-32 se distingue de son prédécesseur par des moteurs surélevés de 1,5 m au-dessus de l'aile afin d'éviter les dommages causés par des corps étrangers sur des pistes d'atterrissage accidentées et non préparées."
 PRU_transport_plane_equipment_8:0 "Alenia C-27J Spartiate"
 PRU_transport_plane_equipment_8_short:0 "C-27J Spartiate"

 #Peruvian Air Force Helicopters
 PRU_attack_helicopter_equipment_3:0 "Mil Mi-25D"
 PRU_attack_helicopter_equipment_3_short:0 "Mil Mi-25D"
 PRU_attack_helicopter_equipment_3_desc:0 "La version d'exportation du Mi-24D. (Hind-D) Le Mi-24D a été conçu pour être un vaisseau de combat plus pur que les variantes précédentes. Il est entré en production en 1973. Le Mi-24D possède un fuselage avant redessiné, avec deux cockpits séparés pour le pilote et le tireur. Il est armé d'une seule mitrailleuse Yak-B à quatre canons de 12,7 mm sous le nez. Il peut également transporter quatre nacelles de roquettes de 57 mm, quatre missiles antichar SACLOS 9M17 Phalanga (une amélioration significative par rapport au système MCLOS du Mi-24A), ainsi que des bombes et d'autres armes."
 PRU_attack_helicopter_equipment_4:0 "Mil Mi-35P"
 PRU_attack_helicopter_equipment_4_short:0 "Mi-35P"
 PRU_attack_helicopter_equipment_4_desc:0 "Initialement une version de base d'exportation du Mil Mi-24P produit par les Soviétiques, cette variante a été mise à niveau vers une nouvelle norme commune pour la modernisation du Mi-24. Le Mi-35P a reçu le système d'observation-viseur OPS-24N-1L avec une caméra thermique matricielle à ondes longues de troisième génération, une caméra TV et un télémètre laser. Le cockpit du vaisseau de combat amélioré est équipé du système de navigation de vol KNEI-24E-1 avec des écrans multifonctionnels. Le système de vol numérique PKV-8-35 augmente la maniabilité et la stabilité de l'hélicoptère. Le vaisseau de combat modernisé est également équipé du système de ciblage PrVK-24-2 mis à jour, qui permet l'utilisation de missiles guidés antichar 9M127-1 Ataka-VM et du système de contre-mesure électronique L370 Vitebsk ou de sa version d'exportation President-S."

