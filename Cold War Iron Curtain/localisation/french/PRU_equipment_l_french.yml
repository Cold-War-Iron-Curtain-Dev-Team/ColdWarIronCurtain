 PRU_CAS_equipment_2:0 "Douglas DB-8A-3P"
 PRU_CAS_equipment_2_short:0 "DB-8A-3P"

 PRU_jet_CAS_equipment_6:0 "Soukhoï Su-22M4"
 PRU_jet_CAS_equipment_6_short:0 "Su-22M4"
 PRU_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 PRU_jet_CAS_equipment_7:0 "Dassault Mirage 5P"
 PRU_jet_CAS_equipment_7_short:0 "Mirage5P"
 PRU_jet_CAS_equipment_7_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 PRU_jet_CAS_equipment_8:0 "Soukhoï Su-25"
 PRU_jet_CAS_equipment_8_short:0 "Su-25"
 PRU_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."

 PRU_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 PRU_jet_light_equipment_1_short:0 "Étoile filante T-33"
 PRU_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."

