 #Peru PRU
 PRU_infantry_equipment_0:0 "SA vz. 24"
 PRU_infantry_equipment_0_short:0 "vz. 24"
 PRU_infantry_equipment_0_desc:0 "Le vz. 24 est une carabine à verrou conçue et produite en Tchécoslovaquie de 1924 à 1942. Elle a été développée à partir de la gamme allemande Mauser Gewehr 98 et présente une conception de boulon très similaire."

 PRU_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 PRU_infantry_equipment_1_short:0 "FN FAL"
 PRU_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 PRU_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 PRU_infantry_equipment_2_short:0 "AKM"
 PRU_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."


 PRU_infantry_equipment_4:0 "Desarrollos Industriels Casanave SC-2005"
 PRU_infantry_equipment_4_short:0 "DIC-SC-2005"
 PRU_infantry_equipment_4_desc:0 "Le Diseños Casanave SC-2005 est une mise à niveau proposée par le Pérou pour le FN FAL. Il est chambré dans la cartouche OTAN de 5,56 × 45 mm et est compatible avec les magazines STANAG."

 ########## NEW PRU ARMOR

 PRU_lt_equipment_1:0 "CKD LTP"
 PRU_lt_equipment_1_short:0 "PLT"
 PRU_lt_equipment_1_desc:0 "Il s'agissait d'un dérivé du THN-S de 1936 (25 unités construites), équipé d'un moteur Scania-Vabis 1664 à 6 cylindres, refroidi par eau, 7 750 cm3, 125 ch. Le LTP ne pesait que 7,3 tonnes, avec un maximum de 25 mm (0,98 po) de blindage. Ils étaient rapides (40 km/h) et fiables, à tel point que l'armée péruvienne en maintint la plupart en service jusqu'en 1988."
