 oau.1.d:0 "Les délégués d'Adis Abeba nous ont informés que nous remplissions les conditions requises pour rejoindre l'Organisation de l'unité africaine. Ils nous ont envoyé une série de contrats d'État à signer, affirmant que cette organisation apporterait la coprospérité et l'unité entre tous les peuples africains. Comment réagirons-nous ?"
 