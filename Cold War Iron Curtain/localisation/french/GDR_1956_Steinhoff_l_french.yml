 GDR_First_Secretary_Steinhoff: "Premier secrétaire Steinhoff"
 GDR_First_Secretary_Steinhoff_desc: "Karl Steinhoff a réussi à ravir la direction de la RDA à Walter Ulbricht ; il est temps de le reconnaître officiellement comme notre nouveau Premier Secrétaire."
 GDR_An_Offer_of_Mass_Amnesty: "Une offre d'amnistie massive"
 GDR_An_Offer_of_Mass_Amnesty_desc: "En raison du zèle excessif du régime d'Ulbrich, la population a commencé à se méfier de ses voisins et du gouvernement. Grâce à une offre d'amnistie massive, nous pouvons apaiser les craintes de la population face à des punitions injustes."
 GDR_Emphasize_Quality_of_Life_Improvements_in_Government_Planning: "Améliorations de la planification gouvernementale"
 GDR_Emphasize_Quality_of_Life_Improvements_in_Government_Planning_desc: "Nous devons recentrer notre modèle de planification centrale pour qu'il se concentre sur la population, en veillant à ce qu'elle reçoive une éducation adéquate et les outils dont elle a besoin pour mener une vie épanouie."
 GDR_Offer_Incentives_to_Join_an_Landwirtschaftliche_Produktionsgenossenschaft: "Encourager les coopératives de production agricole"
 GDR_Offer_Incentives_to_Join_an_Landwirtschaftliche_Produktionsgenossenschaft_desc: "Nous offrirons des incitations aux agriculteurs pour qu'ils rejoignent les coopératives de production agricole, notre version des fermes collectivisées. Cela augmenterait l'efficacité de notre production alimentaire et empêcherait la création d'une classe de barons de la terre."
 GDR_Reform_Stasi_Practices: "Réformer les pratiques de la Stasi"
 GDR_Reform_Stasi_Practices_desc: "La Stasi a acquis une triste réputation en raison de ses méthodes sournoises et franchement inconvenantes de surveillance intérieure. Cela ne peut pas continuer."
 GDR_Liberalize_Media_Censorship_Laws: "Libéraliser les lois sur la censure des médias"
 GDR_Liberalize_Media_Censorship_Laws_desc: "Notre emprise de fer sur ce dont les médias peuvent et ne peuvent pas parler s'est avérée plus contraignante que bénéfique. Il est temps d'assouplir les lois sur la censure."
 GDR_Loosen_Restrictions_on_Western_Trade: "Assouplir les restrictions sur le commerce occidental"
 GDR_Loosen_Restrictions_on_Western_Trade_desc: "Il est devenu évident que les restrictions commerciales que nous avons mises en place avec l'Occident limitent notre capacité à rivaliser avec leurs produits. Nous lèverons les restrictions les plus zélées. "
 GDR_Expand_Funding_for_Housing_Improvements: "Augmenter le financement pour l'amélioration des logements"
 GDR_Expand_Funding_for_Housing_Improvements_desc: "Qu'un travailleur doive se contenter d'un logement spartiate dans une nation aussi riche que celle-ci est totalement inacceptable. Nos collaborateurs méritent le meilleur du meilleur !"
 GDR_Review_High_Profile_Cases_Under_Ulbricht: "Examiner les affaires très médiatisées sous Ulbricht"
 GDR_Review_High_Profile_Cases_Under_Ulbricht_desc: "La question a été récemment posée de la validité de certains procès très médiatisés survenus sous le régime d'Ulbricht. Nous devrions examiner ces cas et corriger toute injustice qui aurait pu se produire."
 GDR_Liberalize_the_SED_Party_Apparatus: "Libéraliser l'appareil du parti"
 GDR_Liberalize_the_SED_Party_Apparatus_desc: "Ulbricht a entaché l'image et la réputation du SED. Pour réparer les dégâts, il est essentiel de réformer l'appareil du parti et de contribuer à regagner la confiance du peuple."
 GDR_Cardboard_Socialism: "Socialisme en carton"
 GDR_Cardboard_Socialism_desc: "En augmentant notre production de biens de consommation et en encourageant les gens à acquérir ces produits abordables, nous verrons une amélioration de notre niveau de vie."
 GDR_Invest_in_Technocratic_Management: "Investissez dans la gestion technocratique"
 GDR_Invest_in_Technocratic_Management_desc: "Les progrès récents de l'informatique ont amené l'idée de gestion automatisée dans le monde de la plausibilité scientifique plutôt que de la fiction. Accélérons le processus avec un peu de financement !"
 GDR_Allow_Small_and_Medium_Businesses: "Autoriser les petites et moyennes entreprises"
 GDR_Allow_Small_and_Medium_Businesses_desc: "En permettant la création de petites entreprises privées faciles à gérer, nous pouvons ouvrir de nouvelles voies permettant aux populations de prospérer."
 GDR_Introduce_Limited_Market_Reforms: "Introduire des réformes limitées du marché"
 GDR_Introduce_Limited_Market_Reforms_desc: "Maintenant que nous avons créé un marché pour les biens de consommation, la prochaine étape consiste à faciliter l'acquisition de ces biens."
 GDR_Renewed_Focus_on_Consumer_Goods_Production: "Focus renouvelé sur la production de biens de consommation"
 GDR_Renewed_Focus_on_Consumer_Goods_Production_desc: "Notre transition vers la production de biens de consommation porte ses fruits, mais on peut faire davantage !"
 GDR_Request_Soviet_Aid_in_Factory_Modernization: "Demander l'aide soviétique pour la modernisation des usines"
 GDR_Request_Soviet_Aid_in_Factory_Modernization_desc: "Nos secteurs industriels commencent à montrer des signes de vieillissement. Peut-être que l'Union soviétique est prête à nous aider dans sa modernisation ?"
 GDR_Offer_Fair_Loans_to_the_Petty_Bourgeois: "Offrir des prêts équitables aux petits-bourgeois"
 GDR_Offer_Fair_Loans_to_the_Petty_Bourgeois_desc: "Les réformes économiques que nous avons entreprises ont donné naissance à une petite classe de commerçants et de propriétaires d'entreprises. Nous leur proposerons des prêts équitables pour qu'ils puissent développer leur entreprise. Le tout dans les limites du modèle socialiste et de ses idées, bien entendu."
