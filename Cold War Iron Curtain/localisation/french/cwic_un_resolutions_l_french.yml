 UN_RESOLUTION.40.t:0 "[GetNewspaperHeader]Les Nations Unies débloquent [un_nation_global_target.GetAdjective] avoirs nationaux"
 UN_RESOLUTION.40.d:0 "NATIONS UNIES - Les Nations Unies ont levé le gel des avoirs nationaux de [un_nation_global_target.GetName]. La résolution supprime la restriction de l'ONU sur l'utilisation par le gouvernement des fonds et des avoirs couverts par la mesure précédente.\n\nLes partisans ont fait valoir que le maintien du gel entraverait les transactions financières normales une fois que la nécessité de le geler serait passée. Les délégués favorables à une pression continue se sont demandé si la libération des actifs abandonnerait l'effet de levier avant que le différend à l'origine de la mesure n'ait été résolu de manière satisfaisante.\n\nLa décision revient désormais aux banques détentrices des comptes. L'accès renouvelé aux fonds à l'étranger donnera aux responsables du Trésor plus de latitude pour organiser les paiements, même si les prêteurs commerciaux doivent toujours prendre leurs propres décisions en matière d'octroi de crédit."
 UN_RESOLUTION.40.a:0 "Les fonds gelés sont débloqués."
 UN_RESOLUTION.41.t:0 "[GetNewspaperHeader]Les Nations Unies lèvent les sanctions contre les responsables [un_nation_global_target.GetAdjective]"
 UN_RESOLUTION.41.d:0 "NATIONS UNIES - Les Nations Unies ont levé leurs sanctions contre les responsables de [un_nation_global_target.GetName]. La décision met fin aux restrictions personnelles imposées par la résolution précédente, y compris les interdictions de voyager imposées par l'ONU aux personnalités concernées.\n\nLes partisans de l'abrogation ont fait valoir que les mesures visant les individus devraient prendre fin lorsque leur objectif diplomatique aura été atteint. Les critiques ont soutenu que la destitution pourrait restaurer la réputation de fonctionnaires dont la conduite les avait soumis à un examen international sans répondre aux allégations portées contre eux.\n\nLe vote met fin à ces sanctions de l'ONU plutôt que de porter un jugement sur une quelconque accusation criminelle. Il n'ordonne pas aux gouvernements étrangers de recevoir les fonctionnaires et n'empêche pas non plus des procédures distinctes en vertu du droit national."
 UN_RESOLUTION.41.a:0 "Les sanctions personnelles sont levées."
 UNPromptEffectLiftAssets:0 "- L'ONU dégèle les avoirs nationaux de [un_nation_global_target.GetName]."
 UNPromptEffectLiftOfficials:0 "- L'ONU lève ses sanctions contre les responsables de [un_nation_global_target.GetName]."
