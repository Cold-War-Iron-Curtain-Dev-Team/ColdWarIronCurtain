 artillery_equipment_1:0 "Artillerie remorquée I"
 artillery_equipment_1_short:0 "Artillerie I"
 artillery_equipment_1_desc:0 "L'artillerie fait référence aux armes de gros calibre, telles que les canons et les obusiers, actionnées par des équipages, qui peuvent projeter des munitions bien au-delà de la portée efficace des armes personnelles."
 artillery_equipment_2:0 "Artillerie remorquée II"
 artillery_equipment_2_short:0 "Artillerie II"
 artillery_equipment_2_desc:0 "L'artillerie moyenne est le juste milieu standard pour l'artillerie. Pas très mobile comme l'artillerie légère ni infligeant des dégâts comme l'artillerie lourde. L'artillerie moyenne sert de terrain d'entente qui peut à la fois infliger plus de dégâts que l'artillerie légère mais possède de meilleures capacités défensives que l'artillerie lourde."
