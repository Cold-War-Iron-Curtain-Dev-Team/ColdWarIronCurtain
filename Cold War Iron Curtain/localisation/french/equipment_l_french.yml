 direct_fire_gun_equipment_1:0 "Canon antichar I"
 direct_fire_gun_equipment_1_short:0 "Canon antichar I"
 direct_fire_gun_equipment_1_desc:0 "Les canons antichars sont, dans leur forme la plus élémentaire, des canons de char sans les chars. Les canons antichar sont généralement utilisés contre des cibles blindées ou de grande taille lorsqu'ils sont placés en position stationnaire. Ils sont également peu coûteux."
