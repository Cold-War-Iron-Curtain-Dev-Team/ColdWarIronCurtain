 ##### EQUIPMENT DESCRIPTIONS #####
 
 #####INFANTRY EQUIPMENT#####
 #PLATOON KITS
 infantry_equipment:0 "Équipement d'infanterie"
 infantry_equipment_desc:0 "Une collection d'armes et d'équipements utilisés par les bataillons d'infanterie. Comprend les fusils, les LMG, les mortiers, les armes spécialisées, les roquettes antichar ou anti-aériennes et toutes les autres armes utilisées par l'infanterie ainsi que les uniformes, les armures, les outils de retranchement, etc.\n\n Comprend également des kits pour équiper les équipements motorisés et mécanisés de mortiers, de HMG, etc."
 
 #COMPANY KITS
 support_equipment:0 "Équipement de soutien"
 support_equipment_desc:0 "L'équipement de soutien est une abstraction pour l'équipement utilisé par le personnel d'une division non combattante ou comme équipement général qui n'est pas suffisamment important pour créer une chaîne de production entièrement nouvelle. Cela peut inclure tout, des installations et fournitures hospitalières de campagne aux équipements de signalisation. Cela peut également inclure des améliorations pour les bataillons de combat direct, telles que des équipements de commandement avec la compagnie de transmissions, etc."
 
 #####FIRE SUPPORT######
 #ARTY
 light_artillery_equipment:0 "Artillerie légère remorquée"
 light_artillery_equipment_short:0 "Artillerie légère"
 light_artillery_equipment_desc:0 "L'artillerie légère est la forme d'artillerie la plus légère. L'artillerie légère inflige moins de dégâts que l'artillerie moyenne et est moins efficace dans les manoeuvres offensives que l'artillerie lourde. Cependant, il est léger et capable de réagir aux attaquants grâce à sa plus grande mobilité et de garder une zone plus vaste grâce à son plus grand nombre. L'artillerie légère peut inclure des mortiers lourds qui ne sont normalement pas utilisés par les bataillons d'infanterie ou les pièces d'artillerie légère."
 light_sp_artillery_equipment:0 "Artillerie légère automotrice"
 light_sp_artillery_equipment_short:0 "Artillerie légère SP"
 light_sp_artillery_equipment_desc:0 "L'artillerie légère est la forme d'artillerie la plus légère. L'artillerie légère inflige moins de dégâts que l'artillerie moyenne et est moins efficace dans les manoeuvres offensives que l'artillerie lourde. Cependant, il est léger et capable de réagir aux attaquants grâce à sa plus grande mobilité et de garder une zone plus vaste grâce à son plus grand nombre. L'artillerie légère peut inclure des mortiers lourds qui ne sont normalement pas utilisés par les bataillons d'infanterie ou les pièces d'artillerie légère."
 
 artillery_equipment:0 "Artillerie remorquée moyenne"
 artillery_equipment_short:0 "Artillerie moyenne"
 artillery_equipment_desc:0 "L'artillerie moyenne est le juste milieu standard pour l'artillerie. Pas très mobile comme l'artillerie légère ni infligeant des dégâts comme l'artillerie lourde. L'artillerie moyenne sert de terrain d'entente qui peut à la fois infliger plus de dégâts que l'artillerie légère mais possède de meilleures capacités défensives que l'artillerie lourde."
 sp_artillery_equipment:0 "Artillerie moyenne automotrice"
 sp_artillery_equipment_short:0 "Artillerie moyenne SP"
 sp_artillery_equipment_desc:0 "L'artillerie moyenne est le juste milieu standard pour l'artillerie. Pas très mobile comme l'artillerie légère ni infligeant des dégâts comme l'artillerie lourde. L'artillerie moyenne sert de terrain d'entente qui peut à la fois infliger plus de dégâts que l'artillerie légère mais possède de meilleures capacités défensives que l'artillerie lourde."
 
 heavy_artillery_equipment:0 "Artillerie lourde remorquée"
 heavy_artillery_equipment_short:0 "Artillerie lourde"
 heavy_artillery_equipment_desc:0 "L'artillerie lourde est un canon d'artillerie lourd à longue portée capable de tirer des coups lourds sur une très longue portée. Généralement utilisée contre les fortifications, l'artillerie lourde est la meilleure en attaque mais offre de faibles avantages défensifs en raison de son petit nombre et de sa nature stationnaire."
 heavy_sp_artillery_equipment:0 "Artillerie lourde automotrice"
 heavy_sp_artillery_equipment_short:0 "Artillerie lourde SP"
 heavy_sp_artillery_equipment_desc:0 "L'artillerie lourde est un canon d'artillerie lourd à longue portée capable de tirer des coups lourds sur une très longue portée. Généralement utilisée contre les fortifications, l'artillerie lourde est la meilleure en attaque mais offre de faibles avantages défensifs en raison de son petit nombre et de sa nature stationnaire."
 
 motorized_rocket_equipment:0 "Artillerie de fusée automotrice"
 motorized_rocket_equipment_short:0 "Artillerie de fusée"
 motorized_rocket_equipment_desc:0 "L'artillerie à roquettes comprend des systèmes d'artillerie qui tirent de grandes rafales de roquettes afin de saturer une zone cible. Ces roquettes individuellement sont très imprécises, mais tirées en rafales, elles peuvent complètement saturer une zone et infliger de lourds dégâts."
 
 #AA
 auto_cannon_equipment:0 "Pistolet anti-aérien"
 auto_cannon_equipment_short:0 "Pistolet anti-aérien"
 auto_cannon_equipment_desc:0 "Les canons anti-aériens sont des canons à tir rapide avec une portée particulièrement longue. Ils ont des cadences de tir exceptionnellement élevées et sont efficaces contre les cibles aériennes rapprochées. Les canons anti-aériens ont également une efficacité limitée contre les cibles au sol, mais n'ont pas l'avantage d'efficacité et de taille de l'infanterie."
 spaag_equipment:0 "Canon antiaérien automoteur"
 spaag_equipment_short:0 "SPAAGE"
 spaag_equipment_desc:0 "Les canons AA automoteurs ou SPAAG sont des canons anti-aériens mobiles automoteurs utilisés pour fournir un appui de tir rapide ou pour engager des cibles aériennes rapprochées."
 
 sam_carrier_equipment:0 "Porte-missile tactique sol-air"
 sam_carrier_equipment_short:0 "SAM"
 sam_carrier_equipment_desc:0 "Les missiles sol-air sont des missiles à tête chercheuse utilisés pour cibler des cibles en vol ou en altitude, bien que les transporteurs SAM que vous construisez et déployez avec les divisions soient uniquement des transporteurs SAM en vol ou en vol rapproché. Les cibles aériennes se déplacent rapidement, sont difficiles à atteindre et se trouvent à une distance immense des troupes au sol. C'est pour cette raison que des missiles à recherche et autocorrecteurs sont nécessaires pour attaquer ces cibles."
 
 
 #AT
 direct_fire_gun_equipment:0 "Canon antichar remorqué"
 direct_fire_gun_equipment_short:0 "Canon antichar"
 direct_fire_gun_equipment_desc:0 "Les canons antichars sont, dans leur forme la plus basique, des canons de char sans les chars. Les canons antichar sont généralement utilisés contre des cibles blindées ou de grande taille lorsqu'ils sont placés dans une zone stationnaire. Ils sont également assez bon marché."
 medium_tank_destroyer_equipment:0 "Chasseur de chars"
 medium_tank_destroyer_equipment_short:0 "Chasseur de chars"
 medium_tank_destroyer_equipment_desc:0 "Les chasseurs de chars sont des véhicules blindés de combat armés d'un canon à tir direct spécialisé dans la capacité anti-blindage. Ils existent, comme leur nom l'indique, pour éradiquer les véhicules blindés de combat.\n\nLes systèmes de canons mobiles sont des canons à tir direct trop lourds pour être un ARV équipés sur un châssis trop léger pour être un CCP. Les systèmes de canons mobiles jouent généralement un rôle de combat direct, bien qu'ils engagent rarement directement les chars."
 
 atgm_equipment:0 "Missile guidé antichar"
 atgm_equipment_short:0 "ATGM"
 atgm_equipment_desc:0 "Les missiles guidés antichar sont des missiles guidés utilisés pour détruire les chars. Les ATGM ont une très longue portée et une très grande précision, mais sont vulnérables à la défaite par des contre-mesures. Un avantage notable des ATGM est leur coût relativement faible par rapport aux véhicules qu'ils sont destinés à détruire. Cependant, la plupart des chars récents ou modernisés sont équipés de contre-mesures actives ou d'une protection passive et, en tant que tels, les ATGM obsolètes ne sont généralement efficaces que pour vaincre des chars mal équipés ou des véhicules qui ne disposent pas de protection ATGM."
 atgm_carrier_equipment:0 "Porte-missile guidé antichar"
 atgm_carrier_equipment_short:0 "Transporteur ATGM"
 atgm_carrier_equipment_desc:0 "Les ATGM Carriers sont des véhicules équipés de missiles guidés antichar. Il s'agit généralement de véhicules légers et rapides qui ciblent et engagent des véhicules en dehors de leur portée normale à l'aide de missiles à tête chercheuse dévastateurs. Bien que les véhicules blindés de combat puissent également être équipés d'ATGM, les transporteurs ATGM sont généralement moins chers et il est peu coûteux d'équiper des transports d'infanterie ou des véhicules utilitaires obsolètes pour devenir des transporteurs ATGM et perpétuer l'utilisabilité du véhicule jusqu'à sa durée de vie physique."
 
 #####COMBAT VEHICLES#####
 #INFANTRY VEHICLES
 
 motorized_equipment:0 "Véhicules motorisés"
 motorized_equipment_short:0 "Camions"
 motorized_equipment_desc:0 "Les véhicules motorisés représentent des véhicules de grande capacité, relativement économes en carburant, destinés au transport de fournitures et de troupes. Vital pour toute armée et constitue l'épine dorsale de la logistique et du transport d'infanterie."
 
 mechanized_equipment:0 "Véhicules mécanisés légers"
 mechanized_equipment_short:0 "APC"
 mechanized_equipment_desc:0 "Les APC sont des transports de troupes blindés qui sont généralement armés de HMG/HGL/petits canons automatiques. Ces véhicules peuvent offrir une meilleure protection à l'infanterie et fournir à eux seuls une petite puissance de feu."
 
 mechanized_heavy_equipment:0 "Véhicules mécanisés lourds"
 mechanized_heavy_equipment_short:0 "IFV"
 mechanized_heavy_equipment_desc:0 "Les IFV sont des transports de troupes à chenilles lourdement blindés, généralement armés de tourelles afin de fournir une puissance de feu aux pelotons d'infanterie au combat. Les IFV peuvent servir d'intermédiaire entre les véhicules de combat et les véhicules d'infanterie, car ils fournissent une grande puissance de feu parallèlement au transport de troupes."
 
 mechanized_marine_equipment:0 "Véhicules mécanisés amphibies"
 mechanized_marine_equipment_short:0 "APC marins"
 mechanized_marine_equipment_desc:0 "Les véhicules mécanisés amphibies ou APC marins sont des transports de troupes amphibies qui peuvent traverser des plans d'eau, fournissant ainsi à l'infanterie un transport dans et autour des rivières et sur les têtes de pont."
 
 #ARMORED COMBAT VEHICLES
 lt_equipment:0 "Char léger/véhicule blindé de reconnaissance"
 lt_equipment_short:0 "Char léger"
 lt_equipment_desc:0 "Les chars légers (de 1935 à 1960) sont des véhicules blindés légers de combat qui remplissent un rôle combiné d'attaque et de reconnaissance. Plus mobiles que les chars moyens, les chars légers sont capables de réagir rapidement aux situations de combat et sont généralement les premiers à tenter d'intervenir dans une situation de combat avec une capacité de combat frontal et une grande mobilité.\n\n Les véhicules blindés de reconnaissance sont des véhicules de reconnaissance équipés d'un canon et chenillés. Ils sont généralement amphibies et sont utilisés par les unités aéroportées, les marines ou les armées les plus pauvres comme véhicules de combat blindés légers en combat direct."
 
 mbt_equipment:0 "Char moyen/char de combat principal"
 mbt_equipment_short:0 "CCP"
 mbt_equipment_desc:0 "Les chars moyens (de 1935 à 1960) sont des véhicules blindés de combat moyens qui jouent un rôle d'attaque offensive. Moins lourdement blindés que les chars lourds mais plus rapides, les chars moyens sont l'unité la plus capable d'infliger des dégâts et d'attaquer, car les chars lourds sont trop peu nombreux et trop lents tandis que les chars légers n'ont pas la puissance de feu appropriée.\n\n Les chars de combat principaux sont des véhicules de combat blindés dotés de la puissance de feu d'un char lourd, du blindage et de la résistance aux dégâts d'un char super lourd, de la vitesse d'un char léger et de la taille d'un char moyen. En fait, ils constituent l'optimisation ultime de la conception des véhicules blindés de combat et constituent une source suprême de puissance de combat."
 
 ht_equipment:0 "Char lourd"
 ht_equipment_short:0 "Char lourd"
 ht_equipment_desc:0 "Les chars lourds jouent un rôle d'attaque anti-fortification/pure offensive. Les chars lourds sont très lourdement blindés et résistants à la plupart des armes antichar qui autrement affaibliraient les autres chars. Les chars lourds sont lents et coûteux, mais ils sont équipés de gros canons et possèdent un blindage très solide, ce qui les rend parfaits pour affronter des emplacements fortement fortifiés. Les chars lourds finiraient par être progressivement supprimés, car les chars de combat principaux finiraient par intégrer la puissance de feu des chars lourds dans un ensemble plus petit et plus optimisé. De plus, les chars de combat principaux peuvent être améliorés pour transporter moins de tirs mais avec une puissance de feu plus importante, il n'est donc plus nécessaire de fabriquer des chars lourds."
 
 sht_equipment:0 "Véhicule blindé de combat super-lourd/nucléaire"
 sht_equipment_short:0 "Char super lourd"
 sht_equipment_desc:0 "Les chars super lourds constituent le deuxième plus grand concept de véhicule blindé de combat jamais conçu et le plus grand jamais mis en oeuvre. Les chars super lourds sont dotés du blindage le plus épais, des chenilles les plus grandes, des canons les plus gros, et sont destinés à jouer un rôle de combat incroyable en première ligne, anéantissant les fortifications et les chars ennemis grâce à leur puissance de feu. Ils étaient rarement utilisés car leur canon à tir direct nécessitait une ligne de vue directe et l'artillerie lourde ou les bombes servaient le même objectif mais le faisaient plus efficacement.\n\nLe Nuclear Tank est un rêve fébrile d'arme dans laquelle des moteurs nucléaires sont placés dans des chars super lourds permettant une vitesse incroyable avec une autonomie illimitée. Les chars nucléaires n'ont jamais été sérieusement envisagés en dehors des expérimentations fermées par l'Union soviétique et les États-Unis et n'ont jamais été utilisés au combat."
 
 #####HELICOPTERS#####
 
 cargo_helicopter_equipment:0 "Hélicoptère logistique"
 cargo_helicopter_equipment_short:0 "Hélicoptère cargo"
 cargo_helicopter_equipment_desc:0 "Les hélicoptères logistiques sont de gros hélicoptères extrêmement lourds utilisés pour transporter des marchandises, de gros véhicules ou de grands groupes de soldats vers et depuis les zones d'opérations. Ce sont des cibles de grande taille donc il est rarement conseillé de les amener directement au combat mais cela est parfois nécessaire."
 
 attack_helicopter_equipment:0 "Hélicoptère d'attaque"
 attack_helicopter_equipment_short:0 "Atk Héli"
 attack_helicopter_equipment_desc:0 "Les hélicoptères d'attaque sont des armes d'une puissance dévastatrice, capables de conserver un avantage en hauteur sur les unités ennemies et de lancer un barrage de roquettes direct ou une attaque ATGM. Ils sont difficiles à atteindre et la plupart des armées veillent à ce que même les hélicoptères d'attaque obsolètes soient équipés de contre-mesures modernes car ils sont relativement peu coûteux."
 
 scout_helicopter_equipment:0 "Hélicoptère éclaireur/d'attaque léger"
 scout_helicopter_equipment_short:0 "Héli-scout"
 scout_helicopter_equipment_desc:0 "Les hélicoptères scouts sont des hélicoptères utilisés pour la reconnaissance, ils sont extrêmement mobiles et ont un avantage en hauteur et sont extrêmement utiles contre les insurgés.\n\nLes hélicoptères d'attaque légers ont une puissance de feu et une capacité de survie nettement inférieures à celles des hélicoptères d'attaque complets, mais ils sont néanmoins puissants. Ils sont généralement équipés d'un seul ensemble de nacelles de roquettes, de canons ou d'ATGM pour jouer un rôle d'appui-feu pour les chars ou l'infanterie en utilisant leur avantage en hauteur pour cibler les ennemis en contrebas."
 
 utility_helicopter_equipment:0 "Hélicoptère utilitaire"
 utility_helicopter_equipment_short:0 "Hélicoptère utilitaire"
 utility_helicopter_equipment_desc:0 "Les hélicoptères utilitaires sont des hélicoptères polyvalents qui assurent le transport des troupes dans les zones de combat, leur soutien et peuvent transporter des fournitures. Les hélicoptères utilitaires peuvent également être équipés d'armes pour fournir un soutien au combat à l'infanterie qu'ils transportent"
 
 naval_helicopter_equipment_short:0 "Hélicoptère ASW"
 naval_helicopter_equipment_desc:0 "Les hélicoptères ASW (lutte anti-sous-marine) sont des hélicoptères équipés de missiles anti-sous-marins ou d'ASM légers. Ils sont très utiles dans la guerre navale et cruciaux pour combattre les cibles navales."
 
 #####DRONES#####
 
 cas_uav_equipment:0 "Véhicule aérien de combat sans pilote"
 cas_uav_equipment_short:0 "UCAV"
 cas_uav_equipment_desc:0 "Les drones UCAV sont des drones utilisés pour des frappes à distance contre des unités et des structures ennemies. Ils sont relativement bon marché par rapport aux avions pilotés et peuvent être produits en grand nombre. Ils sont cependant beaucoup plus vulnérables aux EMP/ECM que les avions pilotés et ne peuvent pas être équipés pour résister à toutes les formes de brouillage des EMP/ECM car ils doivent établir une connexion à distance. Bien que cela puisse perturber les opérations, en particulier pour les drones antérieurs qui peuvent même s'écraser, les drones ultérieurs ont une capacité autonome limitée et peuvent soit tenter d'engager ou d'attaquer des cibles préalablement marquées par les troupes au sol, soit retourner à leur base."
 naval_uav_equipment:0 "Véhicule aérien de combat naval sans pilote"
 naval_uav_equipment_short:0 "UCAV de la Marine"
 naval_uav_equipment_desc:0 "Les drones navals UCAV sont des drones utilisés pour la guerre navale et sont extrêmement utiles pour la reconnaissance ou la livraison d'ASM légers à l'ennemi."
 
 #####LIGHT PLANES#####
 
 fighter_equipment:0 "Combattant multirôle"
 fighter_equipment_short:0 "Multirôle"
 fighter_equipment_desc:0 "Les avions multirôles sont des avions très polyvalents qui peuvent effectuer des attaques air-air ou air-sol. Bien qu'ils échangent souvent la puissance de feu air-air brute de l'intercepteur ou la capacité d'attaque au sol pure du CAS, ce sont des avions très performants et peuvent se protéger dans les airs ainsi qu'infliger des dégâts aux cibles au sol."
 cv_fighter_equipment:0 "Chasseur multirôle"
 cv_fighter_equipment_short:0 "CV multirôle"
 cv_fighter_equipment_desc:0 "Les avions multirôles sont des avions très polyvalents qui peuvent effectuer des attaques air-air ou air-sol. Bien qu'ils échangent souvent la puissance de feu air-air brute de l'intercepteur ou la capacité d'attaque au sol pure du CAS, ce sont des avions très performants et peuvent se protéger dans les airs ainsi qu'infliger des dégâts aux cibles au sol."
 cv_fighter:0 "Chasseur multirôle"

 heavy_fighter_equipment:0 "Intercepteur"
 heavy_fighter_equipment_short:0 "PPA"
 heavy_fighter_equipment_desc:0 "Les intercepteurs, ou chasseurs de supériorité aérienne, sont de purs avions de combat spécialisés dans la destruction de cibles aériennes ennemies. Ils sont hautement spécialisés et agiles et constituent la meilleure option pour détruire les bombardiers ou les avions ennemis et perturber les missions."
 heavy_fighter:0 "Intercepteur"
 heavy_fighter_highmach_equipment:0 "Intercepteur Highmach"
 heavy_fighter_highmach_equipment_short:0 "HS ASF"
 heavy_fighter_highmach_equipment_desc:0 "Les intercepteurs Highmach sont des avions intercepteurs à très grande vitesse qui utilisent de grandes quantités de carburant et des moteurs puissants pour les propulser à des vitesses incroyablement élevées. En raison de leur nature, ils peuvent rapidement frapper des cibles aériennes ennemies de très loin et surpasser d'innombrables avions en combat air-air."
 
 CAS_equipment:0 "Appui aérien rapproché"
 CAS_equipment_short:0 "CAS"
 CAS_equipment_desc:0 "Les avions d'appui aérien rapproché sont des avions spécialisés dans l'attaque d'unités terrestres. Ils transportent des munitions lourdes et infligent de lourds dégâts aux unités terrestres ennemies lors de missions d'attaque. Ils peuvent également percer les fortifications ennemies pour soutenir les opérations offensives et repousser l'élan des charges ennemies pour soutenir les opérations défensives. CAS peut facilement faire ou défaire une bataille."
 cas:0 "Appui aérien rapproché"
 cv_CAS_equipment:0 "Appui aérien rapproché des transporteurs"
 cv_CAS_equipment_short:0 "CV CAS"
 cv_CAS_equipment_desc:0 "Les avions d'appui aérien rapproché sont des avions spécialisés dans l'attaque d'unités terrestres. Le transporteur CAS transporte spécifiquement des missiles anti-navires et peut soutenir les batailles navales et infliger d'importants dégâts à la marine ennemie si elle n'est pas préparée."
 cv_cas:0 "Appui aérien rapproché des transporteurs"
 
 jump_jet_equipment:0 "VTOL"
 jump_jet_equipment_short:0 "VTOL"
 jump_jet_equipment_desc:0 "Les avions VTOL (décollage et atterrissage verticaux) sont des avions à réaction capables de décoller verticalement sur place (c'est d'ailleurs pourquoi ils sont appelés jets de saut). Ils sont généralement de haute technologie et très utiles en tant qu'avions navals, car beaucoup peuvent être installés sur le pont supérieur et décoller verticalement plutôt que de devoir partager une piste et un décollage un par un."
 jump_jet:0 "VTOL"
 
 jet_light_equipment:0 "Jet léger"
 jet_light_equipment_short:0 "Jet léger"
 jet_light_equipment_desc:0 "Les jets légers sont des avions très légers, très peu coûteux et fiables. Ils peuvent être équipés de missiles air-air à courte portée et de charges utiles de frappe légère ou remplir un rôle de reconnaissance légère. Ce sont des avions très efficaces et consommables mais des cibles très fragiles et faciles. Les avions à réaction légers ne sont généralement utilisables que contre les insurgés ou comme avions pour les militaires disposant de petits budgets.\n\nIL EST FORTEMENT RECOMMANDÉ DE NE PAS LES DÉPLOYER CONTRE DES ARMÉES ÉTABLIES CAR VOUS POURRIEZ RAPIDEMENT TOUTES LES PERDRE."
 jet_light:0 "Jet léger"
 
 scout_plane_equipment:0 "Avions de reconnaissance"
 scout_plane_equipment_short:0 "Avion de reconnaissance"
 scout_plane_equipment_desc:0 "Les avions de reconnaissance sont des avions spécialisés pour remplir un rôle de reconnaissance/renseignement. Plutôt que de combattre, ils collectent des informations sur les unités ennemies afin d'améliorer la prise de décision ou la réactivité des forces amies."
 scout_plane:0 "Avions de reconnaissance"
 
 #####HEAVY PLANES#####
 
 nav_bomber_equipment:0 "Bombardier naval"
 nav_bomber_equipment_short:0 "Bombardier de navigation"
 nav_bomber_equipment_desc:0 "Les bombardiers navals sont des avions spécialisés dans le bombardement des navires ennemis à des altitudes exceptionnellement élevées. Ils peuvent frapper des ports ou bombarder des flottes en mer, causant de graves dommages aux navires ennemis."
 nav_bomber:0 "Bombardier naval"
 
 tac_bomber_equipment:0 "Interdicteur/Bombardier Tactique"
 tac_bomber_equipment_short:0 "Bombardier tactique"
 tac_bomber_equipment_desc:0 "Les Interdictors ou bombardiers tactiques sont des bombardiers légers agiles qui peuvent effectuer des missions de combat et attaquer des cibles militaires stratégiques. Les intercepteurs sont capables de transporter de lourdes charges utiles et d'aller plus loin au-delà des lignes ennemies que les CAS pour détruire des cibles logistiques ou d'appui-feu."
 tac_bomber:0 "Interdicteur/Bombardier Tactique"
 stealth_tactical_bomber_equipment:0 "Interdicteur furtif/bombardier tactique"
 stealth_tactical_bomber_equipment_short:0 "Bombardier tactique furtif"
 stealth_tactical_bomber_equipment_desc:0 "Les intercepteurs furtifs sont des bombardiers légers agiles qui utilisent une technologie furtive avancée et peuvent effectuer des missions de combat et attaquer des cibles militaires stratégiques. Les intercepteurs sont capables de transporter de lourdes charges utiles et d'aller plus loin au-delà des lignes ennemies que les CAS pour détruire des cibles logistiques ou d'appui-feu."
 stealth_tactical_bomber:0 "Interdicteur furtif/bombardier tactique"
 
 transport_plane_equipment:0 "Avion de transport"
 transport_plane_equipment_short:0 "Avion de transport"
 transport_plane_equipment_desc:0 "Les avions de transport sont des avions logistiques qui fournissent des fournitures et des munitions aux militaires et sont essentiels aux lignes de ravitaillement de toute armée. Ils peuvent également larguer du ravitaillement ou des troupes afin d'effectuer des attaques derrière les lignes ennemies."
 transport_plane:0 "Avion de transport"
 
 strat_bomber_equipment:0 "Bombardier stratégique"
 strat_bomber_equipment_short:0 "Bombardier stratégique"
 strat_bomber_equipment_desc:0 "Les bombardiers stratégiques sont des avions super-lourds qui volent à haute altitude et transportent des charges utiles extrêmement lourdes pour détruire des cibles stratégiques. Ils sont plus que capables de détruire de grandes quantités d'usines, de bunkers, de centrales électriques ou d'autres cibles stratégiques."
 strat_bomber:0 "Bombardier stratégique"
 mach2stratbomber_equipment:0 "Bombardiers stratégiques à grande vitesse"
 mach2stratbomber_equipment_short:0 "Bombardier HS Strat"
 mach2stratbomber_equipment_desc:0 "Les bombardiers stratégiques sont des avions super-lourds qui volent à haute altitude et transportent des charges utiles extrêmement lourdes pour détruire des cibles stratégiques. Ils sont plus que capables de détruire de grandes quantités d'usines, de bunkers, de centrales électriques ou d'autres cibles stratégiques.\nLes bombardiers stratégiques à grande vitesse se déplacent à des vitesses bien supérieures à la vitesse du son et peuvent attaquer des cibles plus éloignées. Cette incroyable vitesse supersonique leur permet d'éviter les conflits."
 mach2stratbomber:0 "Bombardiers stratégiques à grande vitesse"
 mach3stratbomber_equipment:0 "Bombardiers stratégiques à très grande vitesse"
 mach3stratbomber_equipment_short:0 "Bombardier Strat SHS"
 mach3stratbomber_equipment_desc:0 "Les bombardiers stratégiques sont des avions super-lourds qui volent à haute altitude et transportent des charges utiles extrêmement lourdes pour détruire des cibles stratégiques. Ils sont plus que capables de détruire de grandes quantités d'usines, de bunkers, de centrales électriques ou d'autres cibles stratégiques.\nLes bombardiers stratégiques supersoniques sont les bombardiers les plus rapides qui soient technologiquement possibles, sacrifiant tout ce qu'ils peuvent pour se déplacer à des vitesses extrêmes. Cela leur permet d'avoir une capacité de survie incroyablement élevée et de lancer des attaques chirurgicales n'importe où sur le territoire ennemi, faisant des ravages et esquivant les défenses anti-aériennes."
 mach3stratbomber:0 "Bombardiers stratégiques à très grande vitesse"
 nuclearstratbomber_equipment:0 "Bombardiers stratégiques nucléaires"
 nuclearstratbomber_equipment_short:0 "Nuc. Bombardier stratégique"
 nuclearstratbomber_equipment_desc:0 "Les bombardiers stratégiques sont des avions super-lourds qui volent à haute altitude et transportent des charges utiles extrêmement lourdes pour détruire des cibles stratégiques. Ils sont plus que capables de détruire de grandes quantités d'usines, de bunkers, de centrales électriques ou d'autres cibles stratégiques.\nLes bombardiers stratégiques nucléaires sont un avion unique propulsé par un réacteur nucléaire et des moteurs électriques. Les bombardiers nucléaires stratégiques ont une autonomie pratiquement illimitée et peuvent attaquer n'importe où dans le monde sans avoir à se poser. Tant qu'ils transportent du combustible nucléaire et que l'équipage est en vie, ces avions peuvent rester dans les airs."
 nuclearstratbomber:0 "Bombardiers stratégiques nucléaires"
 
 ##### NAVY #####
 
 corvette:0 "Corvette (Première Ligne)"
 screen_hull_light:0 "Corvette (Première Ligne)"
 corvette_short:0 "Corvette"
 screen_hull_light_short:0 "Corvette"
 corvette_desc:0 "Les corvettes sont des navires à écran lumineux qui effectuent une variété de petites tâches hautement spécialisées. Ils sont souvent équipés d'armes très légères et sont extraordinairement maniables. Les Corvettes fonctionnent mieux en nombre, avec des conceptions adaptées aux flottes auxquelles elles sont affectées."
 screen_hull_light_desc:0 "Les corvettes sont des navires à écran lumineux qui effectuent une variété de petites tâches hautement spécialisées. Ils sont souvent équipés d'armes très légères et sont extraordinairement maniables. Les Corvettes fonctionnent mieux en nombre, avec des conceptions adaptées aux flottes auxquelles elles sont affectées."
 
 frigate:0 "Frégate (Première ligne)"
 screen_hull_medium:0 "Frégate (Première ligne)"
 frigate_short:0 "Frégate"
 screen_hull_medium_short:0 "Frégate"
 frigate_desc:0 "Les frégates sont des navires à écran moyen qui opèrent en première ligne. Ils sont excellents pour la patrouille, la maniabilité, le soutien rapproché à terre et sont très rapides. Ils transportent des armements légers et, à ce titre, leurs torpilles constituent souvent leur attribut le plus important."
 screen_hull_medium_desc:0 "Les frégates sont des navires à écran moyen qui opèrent en première ligne. Ils sont excellents pour la patrouille, la maniabilité, le soutien rapproché à terre et sont très rapides. Ils transportent des armements légers et, à ce titre, leurs torpilles constituent souvent leur attribut le plus important."
 
 destroyer:0 "Destructeur (Première ligne)"
 screen_hull_heavy:0 "Destructeur (Première ligne)"
 destroyer_short:0 "Destructeur"
 screen_hull_heavy_short:0 "Destructeur"
 destroyer_desc:0 "Les destroyers sont des navires à écran lourd qui opèrent en première ligne. Ils sont excellents pour protéger les autres navires de guerre contre les sous-marins et constituent un excellent compromis en termes de puissance de feu moderne, d'autant plus qu'ils sont les navires les moins chers, capables de déployer un nombre important d'ASM et dotés d'une coque assez grande."
 screen_hull_heavy_desc:0 "Les destroyers sont des navires à écran lourd qui opèrent en première ligne. Ils sont excellents pour protéger les autres navires de guerre contre les sous-marins et constituent un excellent compromis en termes de puissance de feu moderne, d'autant plus qu'ils sont les navires les moins chers, capables de déployer un nombre important d'ASM et dotés d'une coque assez grande."
 
 cruiser:0 "Croiseur (ligne de bataille)"
 battle_hull_light:0 "Croiseur (ligne de bataille)"
 cruiser_short:0 "Croiseur"
 battle_hull_light_short:0 "Croiseur"
 cruiser_desc:0 "Les croiseurs sont des navires de ligne de bataille légers dotés d'une puissance de feu importante. Leurs grandes coques leur permettent de déployer des armes que les destroyers ne peuvent pas déployer et de disposer d'une grande capacité anti-aérienne."
 battle_hull_light_desc:0 "Les croiseurs sont des navires de ligne de bataille légers dotés d'une puissance de feu importante. Leurs grandes coques leur permettent de déployer des armes que les destroyers ne peuvent pas déployer et de disposer d'une grande capacité anti-aérienne."
 
 battlecruiser:0 "Croiseur de bataille (ligne de bataille)"
 battlecruiser_short:0 "Croiseur de bataille"
 battlecruiser_desc:0 "Les croiseurs de bataille sont des navires de ligne de bataille moyens dotés d'une puissance de feu extrêmement importante. Ils peuvent déployer les armes les plus lourdes et fournir une immense puissance de feu. Ce sont cependant des cibles importantes."
 battle_hull_medium:0 "Croiseur de bataille (ligne de bataille)"
 battle_hull_medium_short:0 "Croiseur de bataille"
 battle_hull_medium_desc:0 "Les croiseurs de bataille sont des navires de ligne de bataille moyens dotés d'une puissance de feu extrêmement importante. Ils peuvent déployer les armes les plus lourdes et fournir une immense puissance de feu. Ce sont cependant des cibles importantes."
 
 battleship:0 "Cuirassé (ligne de bataille)"
 battleship_short:0 "Cuirassé"
 battleship_desc:0 "Les cuirassés sont de très grands navires de ligne de bataille extrêmement lourdement armés et dotés d'une puissance de feu concentrée. La production de cuirassés n'a pas été sérieusement envisagée pendant toute la guerre froide, car ils sont excessivement grands et concentrent beaucoup trop de puissance de feu et de ressources sur une seule cible."
 battle_hull_heavy:0 "Cuirassé (ligne de bataille)"
 battle_hull_heavy_short:0 "Cuirassé"
 battle_hull_heavy_desc:0 "Les cuirassés sont de très grands navires de ligne de bataille extrêmement lourdement armés et dotés d'une puissance de feu concentrée. La production de cuirassés n'a pas été sérieusement envisagée pendant toute la guerre froide, car ils sont excessivement grands et concentrent beaucoup trop de puissance de feu et de ressources sur une seule cible."
 
 carrier:0 "Transporteur"
 carrier_short:0 "Transporteur"
 carrier_desc:0 "Les porte-avions sont des navires qui naviguent efficacement sur des aérodromes à travers la mer. Ils transportent de nombreux avions pouvant être utilisés pour des combats navals ou terrestres et sont extrêmement utiles comme arme de projection de puissance ou comme arme offensive."
 carrier_hull:0 "Transporteur"
 carrier_hull_short:0 "Transporteur"
 carrier_hull_desc:0 "Les porte-avions sont des navires qui naviguent efficacement sur des aérodromes à travers la mer. Ils transportent de nombreux avions pouvant être utilisés pour des combats navals ou terrestres et sont extrêmement utiles comme arme de projection de puissance ou comme arme offensive."
 
 helicarrier:0 "Léger/Héliporteur"
 helicarrier_short:0 "Lt Carrier"
 helicarrier_desc:0 "Les transporteurs légers sont des transporteurs qui font effectivement flotter de petits aérodromes. Ils peuvent être plus nombreux que les grands transporteurs et sont souvent utilisés par des puissances nationales plus petites.\nLes héliporteurs sont des transporteurs qui naviguent efficacement dans des ports d'hélicoptères. Ils transportent un grand nombre d'hélicoptères qui peuvent servir à de nombreuses fins en fonction des hélicoptères qu'ils mettent en service."
 carrier_hull_light:0 "Léger/Héliporteur"
 carrier_hull_light_short:0 "Lt Carrier"
 carrier_hull_light_desc:0 "Les transporteurs légers sont des transporteurs qui font effectivement flotter de petits aérodromes. Ils peuvent être plus nombreux que les grands transporteurs et sont souvent utilisés par des puissances nationales plus petites.\nLes héliporteurs sont des transporteurs qui naviguent efficacement dans des ports d'hélicoptères. Ils transportent un grand nombre d'hélicoptères qui peuvent servir à de nombreuses fins en fonction des hélicoptères qu'ils mettent en service."
 
 supercarrier:0 "Supercarrier"
 supercarrier_short:0 "Supercarrier"
 supercarrier_desc:0 "Les supercarriers sont des transporteurs massifs qui naviguent efficacement vers des bases aériennes à travers la mer. Ils transportent un grand nombre d'avions pouvant être utilisés pour des combats navals ou terrestres et jouent un rôle déterminant dans la projection de puissance d'une superpuissance. De plus, ils peuvent être équipés pour devenir des navires-arsenal et devenir effectivement des silos de missiles flottants."
 carrier_hull_large:0 "Supercarrier"
 carrier_hull_large_short:0 "Supercarrier"
 carrier_hull_large_desc:0 "Les supercarriers sont des transporteurs massifs qui naviguent efficacement vers des bases aériennes à travers la mer. Ils transportent un grand nombre d'avions pouvant être utilisés pour des combats navals ou terrestres et jouent un rôle déterminant dans la projection de puissance d'une superpuissance. De plus, ils peuvent être équipés pour devenir des navires-arsenal et devenir effectivement des silos de missiles flottants."
 
 attack_submarine:0 "Sous-marin d'attaque"
 attack_submarine_short:0 "Attaque secondaire"
 attack_submarine_desc:0 "Les sous-marins d'attaque sont des sous-marins spécialisés dans la guerre navale. Ils sont désignés comme chasseurs ou comme navires de combat naval furtifs."
 
 ballistic_submarine:0 "Sous-marin balistique"
 ballistic_submarine_short:0 "Sous-marin balistique"
 ballistic_submarine_desc:0 "Les sous-marins balistiques sont des sous-marins équipés de missiles. Ils peuvent les utiliser contre des cibles navales ou terrestres et constituer un élément imprévisible dans la guerre nucléaire."
 
 sub_hull_small_single:0 "Petit sous-marin"
 sub_hull_large_single:0 "Sous-marin moyen"
 sub_hull_large_double:0 "Grand sous-marin"
 sub_hull_small_single_short:0 "Sous-marin S"
 sub_hull_large_single_short:0 "M Sous"
 sub_hull_large_double_short:0 "Sous-L"
 sub_hull_small_single_desc:0 "Les petits sous-marins sont des coques de sous-marins plus petites qui ne peuvent servir qu'à des rôles d'attaque."
 sub_hull_large_single_desc:0 "Les sous-marins moyens sont de grandes coques de sous-marins qui peuvent remplir des rôles d'attaque, balistiques ou hybrides."
 sub_hull_large_double_desc:0 "Les grands sous-marins sont des coques de sous-marins massives pouvant transporter un grand nombre de missiles balistiques et sont presque toujours utilisés comme sous-marins nucléaires."
 
