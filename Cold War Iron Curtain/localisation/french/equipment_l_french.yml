l_french:
 submarine:0 "Sous-marin"
 submarine_desc:0 "Les sous-marins utilisent des torpilles furtives et puissantes pour détruire les convois ennemis."
 light_cruiser:0 "Croiseur léger"
 light_cruiser_desc:0 "Un navire de protection contre la lumière. Sa tâche principale est de protéger les vaisseaux capitaux des vaisseaux légers ennemis, mais peut également déclencher de puissantes torpilles qui peuvent blesser des vaisseaux plus gros."
 battle_cruiser:0 "Croiseur de bataille"
 battle_cruiser_desc:0 "Un grand vaisseau capital souvent doté de capacités offensives proches de celles d'un cuirassé, mais avec un blindage plus faible échangé contre une vitesse plus rapide."
 convoy:0 "Convoi"
 convoy_desc:0 "Convois utilisés pour le commerce international de biens et de ressources. Également utilisé pour transporter des troupes et pour effectuer des invasions navales."
 sh_battleship:0 "Cuirassé super-lourd"
 sh_battleship_desc:0 "Le plus grand vaisseau capital doté des plus gros canons et du blindage le plus solide que l'argent puisse acheter. Un investissement aussi coûteux mérite un soutien adéquat de la part de petits navires de contrôle."
 light_airframe:0 "Cellule légère"
 light_airframe_desc:0 "Avions légers basés sur une cellule"
 medium_airframe:0 "Cellule moyenne"
 medium_airframe_desc:0 "Avions basés sur une cellule moyenne"
 heavy_airframe:0 "Cellule lourde"
 heavy_airframe_desc:0 "Avions lourds basés sur des cellules"
 jet_engines:0 "Moteurs à réaction"
 JET_ENGINES_SPECIAL:0 "Le développement des moteurs à réaction est une condition préalable essentielle au développement d'avions à réaction. Cela doit être étudié avant de pouvoir rechercher des avions avancés"
 jet_engines_desc:0 "Percée dans la technologie de propulsion, le Jet Engine permettra le développement d'une toute nouvelle génération d'avions."
 convoy_1:0 "Convoi"
 support_equipment_1:0 "Équipement de soutien"
 support_equipment_1_desc:0 "Radios, pontons et autres équipements utilisés pour soutenir les troupes."
