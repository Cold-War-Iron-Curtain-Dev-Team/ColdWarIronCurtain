 #####INFANTRY
 
 infantry_equipment_0:0 "Équipement d'infanterie I"
 infantry_equipment_0_short:0 "Équipement d'infanterie I"
 infantry_equipment_0_desc:0 "Un kit fondamental composé d'équipement d'infanterie et d'armes à feu de la Seconde Guerre mondiale. Composés principalement de fusils à verrou, de SMG automatiques, de LMG de base et d'autres armes de la Seconde Guerre mondiale, ces kits sont fiables et bon marché."
 infantry_equipment_1:0 "Équipement d'infanterie II"
 infantry_equipment_1_short:0 "Équipement d'infanterie II"
 infantry_equipment_1_desc:0 "Un kit amélioré composé d'équipement d'infanterie et d'armes à feu a évolué à partir de la doctrine de la fin et de l'après-guerre. Presque toutes les armes incluses sont automatiques et leurs conceptions sont créées à partir des leçons apprises pendant la guerre. Notamment plus cher que l'équipement de la Seconde Guerre mondiale, mais bien meilleur."
 infantry_equipment_2:0 "Équipement d'infanterie III"
 infantry_equipment_2_short:0 "Équipement d'infanterie III"
 infantry_equipment_2_desc:0 "Équipement d'infanterie et armes à feu conçus pour correspondre aux doctrines de l'ère atomique de la guerre. Beaucoup de ces kits sont dotés d'une simple protection NBC et d'armes très polyvalentes avec des niveaux de puissance de feu beaucoup plus élevés que la génération précédente d'armes à feu."
 infantry_equipment_3:0 "Équipement d'infanterie optimisé"
 infantry_equipment_3_short:0 "Équipement d'infanterie IV"
 infantry_equipment_3_desc:0 "Des armes optimisées issues des armes et équipements de guerre de l'ère atomique qui résolvent de nombreux problèmes de la génération précédente."
 infantry_equipment_4:0 "Équipement d'infanterie V"
 infantry_equipment_4_short:0 "Équipement d'infanterie V"
 infantry_equipment_4_desc:0 "Armes à feu avancées et équipement d'infanterie. Ces kits sont centrés sur une armée hautement professionnelle et axés sur la capacité de survie de leur utilisateur et sur un équipement tactique qui nécessite beaucoup de formation et de compétences."
 
 ###SP FORCES###
 
 special_operations:0 "Opérations spéciales"
 special_operations_short:0 "Opérations spéciales"
 special_operations_desc:0 "Opérations menées par des forces spécialement désignées, entraînées et équipées, utilisant souvent des techniques non conventionnelles."
 
 ###DESERT
 
 desert_warfare_1:0 "Tactiques de guerre dans le désert"
 desert_warfare_1_short:0 "Tactiques de guerre dans le désert"
 desert_warfare_1_desc:0 "Le désert est un environnement hostile qui nécessite des tactiques et un entraînement spécialisés pour que les forces restent efficaces. Nécessitant des tactiques mises à jour."
 desert_warfare_2:0 "Équipement de guerre dans le désert"
 desert_warfare_2_short:0 "Équipement de guerre dans le désert"
 desert_warfare_2_desc:0 "Des équipements spécialisés pour la guerre dans le désert permettront aux troupes de rester plus efficaces face à des conditions difficiles."
 infantry_desert_warfare_2_tt:0 "§GActive la capacité « Réquisition d'équipement du désert » !"
 desert_warfare_3:0 "Tactiques modernes de guerre dans le désert"
 desert_warfare_3_short:0 "Tactiques modernes de guerre dans le désert"
 desert_warfare_3_desc:0 "Survivre dans un désert ne suffit pas. Les troupes doivent maintenir leur disponibilité opérationnelle et leur mobilité dans un environnement désertique. Nécessitant des tactiques modernisées."
 desert_warfare_4:0 "Équipement de guerre moderne dans le désert"
 desert_warfare_4_short:0 "Équipement de guerre moderne dans le désert"
 desert_warfare_4_desc:0 "La filtration de l'eau, le camouflage, la dissimulation et les équipements d'ingénierie spécialisés mis à jour et modernisés augmenteront l'efficacité des forces combattant dans un environnement désertique."
 
 ABILITY_REQUISITION_HEAT_GEAR:0 "Réquisition d'équipement du désert"
 ABILITY_REQUISITION_HEAT_GEAR_DESC:0 "Accélère considérablement l'acclimatation aux climats chauds"
 
 ABILITY_REQUISITION_WINTER_GEAR:0 "Réquisition d'équipement d'hiver"
 ABILITY_REQUISITION_WINTER_GEAR_DESC:0 "Accélère considérablement l'acclimatation au climat froid"

 ###LAND
 
 army_sp_forces_1:0 "Forces spéciales de l'armée"
 army_sp_forces_1_short:0 "Forces spéciales de l'armée"
 army_sp_forces_1_desc:0 "Permet l'entraînement des unités des Forces Spéciales de l'Armée pour soutenir les troupes régulières ou spécialisées au combat."
 army_sp_forces_2:0 "Opérations spéciales de reconnaissance"
 army_sp_forces_2_short:0 "Opérations SR"
 army_sp_forces_2_desc:0 "Des unités de reconnaissance spécialisées sont créées pour fournir des informations de renseignement derrière les lignes ennemies."
 army_sp_forces_3:0 "Soutien à la grève"
 army_sp_forces_3_short:0 "Soutien à la grève"
 army_sp_forces_3_desc:0 "Les forces spéciales disposent de meilleurs équipements de communication afin de coordonner les frappes d'artillerie ou les tirs derrière les lignes ennemies."
 army_sp_forces_4:0 "Opérations de reconnaissance spéciales avancées"
 army_sp_forces_4_short:0 "Opérations SR avancées"
 army_sp_forces_4_desc:0 "Les forces spéciales disposent d'équipements de communication plus avancés afin de coordonner l'artillerie et les frappes aériennes ou les tirs conjoints derrière les lignes ennemies."
 army_sp_forces_5:0 "FID de défense intérieure étrangère"
 army_sp_forces_5_short:0 "IDE"
 army_sp_forces_5_desc:0 "Pour améliorer la formation, les agents des forces spéciales de différentes branches ou même au sein des institutions gouvernementales s'entraînent au getter afin de pouvoir opérer ensemble plus efficacement."
 army_sp_forces_6:0 "Soutien au renseignement"
 army_sp_forces_6_short:0 "Soutien au renseignement"
 army_sp_forces_6_desc:0 "Les opérateurs des forces spéciales sont intégrés au sein des sections régulières du renseignement pour améliorer le flux d'informations provenant des forces clandestines opérant derrière les lignes."
 army_sp_forces_7:0 "Tactiques antiterroristes"
 army_sp_forces_7_short:0 "Tactiques antiterroristes"
 army_sp_forces_7_desc:0 "Les unités militaires des forces spéciales sont formées aux opérations antiterroristes afin d'opérer plus efficacement sur leur territoire."
 
 ###MOUNTAIN
 
 mountain_warfare_1:0 "Guerre de montagne"
 mountain_warfare_1_short:0 "Guerre de montagne"
 mountain_warfare_1_desc:0 "Permet la formation d'infanterie alpiniste spécialisée pour combattre en terrain montagneux."
 mountain_warfare_2:0 "Équipement/Tactiques de guerre en montagne"
 mountain_warfare_2_short:0 "Équipement/Tactiques de guerre en montagne"
 mountain_warfare_2_desc:0 "Permet l'entraînement des unités Mountain Ranger pour soutenir les troupes régulières ou spécialisées au combat."
 mountain_warfare_3:0 "Équipement/tactiques de guerre dans l'Arctique"
 mountain_warfare_3_short:0 "Équipement/tactiques de guerre dans l'Arctique"
 mountain_warfare_3_desc:0 "Du matériel de guerre arctique supplémentaire est acquis pour fonctionner plus efficacement dans des conditions météorologiques extrêmement froides."
 infantry_mountain_warfare_3_tt:0 "§GActive la capacité « Réquisition d'équipement d'hiver » !"
 mountain_warfare_4:0 "Équipement/tactiques avancés de guerre en montagne"
 mountain_warfare_4_short:0 "Équipement/tactiques avancés de guerre en montagne"
 mountain_warfare_4_desc:0 "Le concept d'accompagnateurs en montagne et d'équipements plus avancés est introduit pour permettre aux troupes de travailler plus efficacement dans les environnements montagnards."
 mountain_warfare_5:0 "Équipement/tactiques avancés de guerre dans l'Arctique"
 mountain_warfare_5_short:0 "Équipement/tactiques avancés de guerre dans l'Arctique"
 mountain_warfare_5_desc:0 "Des équipements avancés de guerre arctique sont acquis pour fonctionner plus efficacement dans des conditions météorologiques extrêmement froides."
 mountain_warfare_6:0 "Équipement/Tactiques de guerre moderne en montagne"
 mountain_warfare_6_short:0 "Équipement/Tactiques de guerre moderne en montagne"
 mountain_warfare_6_desc:0 "Le concept d'accompagnateur en montagne est élargi et des équipements plus modernes sont introduits pour permettre aux troupes de travailler plus efficacement dans des environnements montagneux difficiles ou par temps froid."
 
 
 ###AMPHIBIOUS WARFARE
 
 amphibious_warfare_1:0 "Guerre amphibie"
 amphibious_warfare_1_short:0 "Guerre amphibie"
 amphibious_warfare_1_desc:0 "Permet la formation d'infanterie de marine ou navale spécialisée spécifiquement formée pour employer des opérations amphibies."
 amphibious_warfare_2:0 "Combat Littoral"
 amphibious_warfare_2_short:0 "Combat Littoral"
 amphibious_warfare_2_desc:0 "L'infanterie navale ou les unités de marine acquièrent une expérience supplémentaire dans les combats à proximité du rivage."
 amphibious_warfare_3:0 "Passage à gué profond"
 amphibious_warfare_3_short:0 "Passage à gué profond"
 amphibious_warfare_3_desc:0 "Des capacités supplémentaires de passage à gué profond sont installées sur les véhicules amphibies."
 amphibious_warfare_4:0 "Tactiques d'invasion à grande échelle"
 amphibious_warfare_4_short:0 "Tactiques d'invasion à grande échelle"
 amphibious_warfare_4_desc:0 "Des officiers d'état-major spécialisés sont inclus à bord des navires amphibies de la marine afin de coordonner le débarquement des troupes et leurs besoins en approvisionnement."
 amphibious_warfare_4_tt:0 "Active la capacité §YPlan du bureau de l'état-major maritime§!"
 amphibious_warfare_5:0 "Techniques modernes de gué profond"
 amphibious_warfare_5_short:0 "Techniques modernes de gué profond"
 amphibious_warfare_5_desc:0 "Des équipements de passage à gué profond plus efficaces sont installés sur les véhicules amphibies pour permettre d'opérer dans des conditions encore plus humides."
 amphibious_warfare_6:0 "Tactiques modernes d'invasion à grande échelle"
 amphibious_warfare_6_short:0 "Tactiques modernes d'invasion à grande échelle"
 amphibious_warfare_6_desc:0 "Des officiers d'état-major spécialisés sont inclus au sein de la force opérationnelle amphibie afin de coordonner davantage le flux de ravitaillement vers la tête de pont, en utilisant non seulement des péniches de débarquement amphibies mais également des hélicoptères lorsque cela est possible."
 
 IC_ABILITY_FASTER_NAVAL_PLANNING:0 "Plan du bureau du personnel maritime"
 IC_ABILITY_FASTER_NAVAL_PLANNING_DESC:0 "Planification rapide d'une invasion marine"
 
 ###LC
 
 landing_craft_1:0 "Assaut de péniches de débarquement"
 landing_craft_1_short:0 "ACV"
 landing_craft_1_desc:0 "Péniche de débarquement d'assaut de base utilisée pour débarquer des troupes qui seront en mesure de sécuriser une tête de pont."
 landing_craft_2:0 "Infanterie de péniches de débarquement"
 landing_craft_2_short:0 "LCI"
 landing_craft_2_desc:0 "Des péniches de débarquement d'infanterie plus performantes sont utilisées pour débarquer des troupes qui seront en mesure de sécuriser une tête de pont."
 landing_craft_3:0 "Péniche de débarquement mécanisée"
 landing_craft_3_short:0 "LCM"
 landing_craft_3_desc:0 "Grande péniche de débarquement capable de débarquer non seulement des troupes mais également des véhicules blindés, permettant ainsi plus de puissance de feu afin de sécuriser une tête de pont."
 landing_craft_4:0 "Péniche de débarquement sur coussin d'air I"
 landing_craft_4_short:0 "LCAC JE"
 landing_craft_4_desc:0 "Les péniches de débarquement à coussin d'air de base sont souvent plus rapides et capables de franchir de nombreux obstacles que les péniches de débarquement classiques ne peuvent pas franchir."
 landing_craft_5:0 "Péniche de débarquement sur coussin d'air II"
 landing_craft_5_short:0 "LCAC II"
 landing_craft_5_desc:0 "Péniches de débarquement sur coussin d'air plus grandes et plus rapides, capables de débarquer plus de troupes, d'équipement et de ravitaillement dans une zone d'atterrissage."
 landing_craft_6:0 "Péniche de débarquement sur coussin d'air III"
 landing_craft_6_short:0 "LCAC III"
 landing_craft_6_desc:0 "Des péniches de débarquement sur coussin d'air encore plus grandes, capables de débarquer non seulement des troupes, des équipements et des fournitures, mais également des véhicules blindés sur une tête de pont."
 
 ##FROGMEN
 
 combat_divers_1:0 "Tactiques d'infiltration amphibie furtive"
 combat_divers_1_short:0 "Tactiques d'infiltration amphibie furtive"
 combat_divers_1_desc:0 "Permet l'entraînement des unités des Forces Spéciales Navales pour soutenir les troupes régulières ou spécialisées au combat."
 combat_divers_2:0 "Équipes de démolition sous-marine"
 combat_divers_2_short:0 "UDT"
 combat_divers_2_desc:0 "Les forces spéciales navales étendent leur formation aux démolitions sous-marines en créant des équipes spécialisées d'hommes-grenouilles capables d'effectuer des opérations de reconnaissance ou d'éliminer les obstacles et les explosifs avant un atterrissage amphibie."
 combat_divers_3:0 "Tactiques de reconnaissance amphibie"
 combat_divers_3_short:0 "Tactiques de reconnaissance amphibie"
 combat_divers_3_desc:0 "Des opérations de reconnaissance améliorées par des hommes-grenouilles avant un débarquement amphibie permettent aux troupes de se préparer correctement à un débarquement opposé et de trouver les points faibles de la défense."
 combat_divers_4:0 "Tactiques avancées de reconnaissance amphibie"
 combat_divers_4_short:0 "Tactiques avancées de reconnaissance amphibie"
 combat_divers_4_desc:0 "En utilisant des équipements plus efficaces comme des recycleurs et de petits radeaux, les unités de reconnaissance et les hommes-grenouilles peuvent se rapprocher encore plus de la force adverse sans être détectés."
 combat_divers_5:0 "Armes à feu sous-marines"
 combat_divers_5_short:0 "Armes à feu sous-marines"
 combat_divers_5_desc:0 "Les armes à feu sous-marines permettent aux hommes-grenouilles de se protéger au cas où leur couverture serait détruite ou si une force adverse emploie ses propres hommes-grenouilles pour contrer les opérations de reconnaissance."
 combat_divers_6:0 "Tactiques d'infiltration amphibie modernes"
 combat_divers_6_short:0 "Tactiques d'infiltration amphibie modernes"
 combat_divers_6_desc:0 "Non seulement les hommes-grenouilles tenteront une opération de reconnaissance, mais ils tenteront également d'infiltrer des positions faibles ou non défendues dans la zone d'atterrissage afin de semer la confusion dans les lignes ennemies avant le débarquement principal."
 
 ##AIRBORNE
 
 airborne_operations_1:0 "Opérations d'assaut aéroporté"
 airborne_operations_1_short:0 "Opérations d'assaut aéroporté"
 airborne_operations_1_desc:0 "Permet la formation d'infanterie aéroportée ou parachutée spécialisée pour les opérations aéroportées."
 airborne_operations_2:0 "Tactiques de sécurisation de la tête aérienne"
 airborne_operations_2_short:0 "Tactiques de sécurisation de la tête aérienne"
 airborne_operations_2_desc:0 "Une tête aérienne, un peu comme une tête de pont, est un emplacement avancé qui était auparavant sécurisé par les forces aéroportées et permet aux troupes de renfort, à l'équipement et aux véhicules d'atterrir sans opposition."
 airborne_operations_3:0 "Véhicules blindés de combat aérotransportables"
 airborne_operations_3_short:0 "Véhicules blindés de combat aérotransportables"
 airborne_operations_3_desc:0 "Permet l'utilisation d'AFV aéroportés. Les véhicules blindés de combat aérotransportables peuvent apporter plus de puissance de feu à une force aéroportée d'infanterie par ailleurs légère."
 airborne_operations_4:0 "Parachutisme à haute altitude et à faible ouverture"
 airborne_operations_4_short:0 "Parachutisme à haute altitude et à faible ouverture"
 airborne_operations_4_desc:0 "Les tactiques de parachute à haute altitude et à faible ouverture permettent à de petites unités de forces spéciales d'infiltrer une zone d'atterrissage avec moins de chances d'être détectées."
 airborne_operations_5:0 "Parachutisme à haute altitude et ouverture élevée"
 airborne_operations_5_short:0 "Parachutisme à haute altitude et ouverture élevée"
 airborne_operations_5_desc:0 "Les tactiques de parachute à haute altitude et à ouverture élevée permettent à une unité de forces spéciales bien entraînées de se déposer dans une zone et, à l'aide de leurs parachutes, de se rapprocher d'une zone où une opération doit avoir lieu."
 airborne_operations_6:0 "Tactiques modernes d'enveloppement vertical"
 airborne_operations_6_short:0 "Tactiques modernes d'enveloppement vertical"
 airborne_operations_6_desc:0 "Les tactiques mises à jour pour l'ère moderne permettent aux forces aéroportées mais aussi aéromobiles d'encercler un ennemi par avion de transport ou par hélicoptère."
 
 ##AIR ASSAULT
 
 air_assault_operations_1:0 "Opérations d'assaut aérien"
 air_assault_operations_1_short:0 "Opérations d'assaut aérien"
 air_assault_operations_1_desc:0 "Permet la formation d'unités d'infanterie aéromobiles spécialisées qui utilisent des hélicoptères pour se déplacer sur un champ de bataille."
 air_assault_operations_2:0 "Tactiques d'enveloppement vertical"
 air_assault_operations_2_short:0 "Tactiques d'enveloppement vertical"
 air_assault_operations_2_desc:0 "Les tactiques d'encerclement vertical héliportées mises à jour permettent à l'infanterie aéromobile de se déplacer rapidement autour d'une force ennemie pour potentiellement l'encercler."
 air_assault_operations_3:0 "Opérations avancées d'assaut aérien"
 air_assault_operations_3_short:0 "Opérations avancées d'assaut aérien"
 air_assault_operations_3_desc:0 "Des tactiques d'encerclement vertical héliportées encore plus avancées permettent à l'infanterie aéromobile de se déplacer rapidement autour d'une force ennemie et, grâce à l'utilisation de l'armement aérien avancé et des points de ravitaillement, de rester plus longtemps dans le combat."
 
 ##COVERT
 
 cover_air_operations_1:0 "Tactiques secrètes de reconnaissance profonde"
 cover_air_operations_1_short:0 "Tactiques secrètes de reconnaissance profonde"
 cover_air_operations_1_desc:0 "Permet l'entraînement des unités des Forces Spéciales Aéroportées pour soutenir les troupes régulières ou spécialisées au combat."
 cover_air_operations_2:0 "Contrôle aérien avancé"
 cover_air_operations_2_short:0 "FAC"
 cover_air_operations_2_desc:0 "Des contrôleurs aériens avancés composés d'opérateurs des forces spéciales sont intégrés à des unités de reconnaissance pour assurer une communication directe avec les avions d'appui rapproché."
 cover_air_operations_3:0 "Recherche et sauvetage au combat"
 cover_air_operations_3_short:0 "CÉSAR"
 cover_air_operations_3_desc:0 "Les opérateurs de recherche et de sauvetage au combat sont formés pour effectuer des récupérations à haut risque de personnels disparus ou blessés, souvent sous le feu ennemi."
 cover_air_operations_4:0 "Tactiques modernes d'insertion en air profond"
