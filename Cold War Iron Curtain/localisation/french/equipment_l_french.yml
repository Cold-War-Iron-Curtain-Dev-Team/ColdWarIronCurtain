 auto_cannon_equipment_1_desc:0 "Les canons anti-aériens sont des canons à tir rapide avec une portée particulièrement longue. Ils ont des cadences de tir exceptionnellement élevées et sont efficaces contre les cibles aériennes rapprochées. Les canons anti-aériens peuvent également avoir une efficacité limitée contre des cibles au sol, mais n'ont pas l'avantage d'efficacité et de taille de l'infanterie."
