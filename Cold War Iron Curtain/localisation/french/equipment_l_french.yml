 ##### MISSILES #####
 
 cruisemissile_equipment:0 "Missile de croisière"
 cruisemissile_equipment_short:0 "Missile de croisière"
 cruisemissile_equipment_desc:0 "Les missiles de croisière sont des missiles à portée intermédiaire qui peuvent parcourir de longues distances à partir de l'endroit où ils sont tirés. Les missiles de croisière peuvent frapper des cibles stratégiques ou de combat et transporter de lourdes charges utiles.\nJe vais maintenant expliquer comment ils trouvent leurs cibles.\n\nLe missile sait à tout moment où il se trouve. Il le sait parce qu'il sait où il ne se trouve pas. En soustrayant l'endroit où il se trouve de l'endroit où il ne se trouve pas, ou l'endroit où il ne se trouve pas de l'endroit où il se trouve (selon la valeur la plus élevée), on obtient une différence, ou un écart. Le sous-système de guidage utilise des déviations pour générer des commandes correctives afin de conduire le missile d'une position où il se trouve à une position où il ne se trouve pas, et en arrivant à une position où il ne se trouvait pas, il se trouve maintenant. Par conséquent, la position où il se trouve est maintenant la position où il n'était pas, et il s'ensuit que la position où il était est maintenant la position où il n'est pas. Dans le cas où la position dans laquelle il se trouve n'est pas la position dans laquelle il n'était pas, le système a acquis une variation, la variation étant la différence entre l'endroit où se trouve le missile et l'endroit où il ne se trouvait pas. Si la variation est considérée comme un facteur significatif, elle peut également être corrigée par la GEA. Mais le missile doit aussi savoir où il se trouve. Le scénario de l'ordinateur de guidage de missile fonctionne comme suit. Parce qu'une variation a modifié certaines des informations obtenues par le missile, on ne sait pas exactement où il se trouve. Cependant, il est sûr de l'endroit où il ne se trouve pas, dans des limites raisonnables, et il sait où il se trouvait. Il soustrait maintenant l'endroit où il devrait être de l'endroit où il ne l'était pas, ou vice versa, et en différenciant cela de la somme algébrique de l'endroit où il ne devrait pas être et de l'endroit où il était, il est capable d'obtenir l'écart et sa variation, que l'on appelle erreur"
 
 slbm_equipment:0 "Missile balistique sous-lancé"
 slbm_equipment_short:0 "SLBM"
 slbm_equipment_desc:0 "Les SLBM sont des armes nucléaires balistiques tirées depuis des sous-marins. Ce sont des armes très dangereuses qui peuvent infliger d'immenses dégâts et ont l'avantage supplémentaire de rendre difficile leur suivi ou leur localisation par l'ennemi."
 
 srbm_equipment:0 "Missile balistique à courte portée"
 srbm_equipment_short:0 "SRBM"
 srbm_equipment_desc:0 "Les SRBM sont des armes nucléaires balistiques tactiques au sol à courte portée qui peuvent être tirées à partir de transporteurs au sol. Ils sont extrêmement dévastateurs et peuvent être utilisés dans les batailles pour les soutenir et anéantir toute la zone générale des unités ennemies."
 
 irbm_equipment:0 "Missile balistique à portée intermédiaire"
 irbm_equipment_short:0 "IRBM"
 irbm_equipment_desc:0 "Les IRBM sont des missiles balistiques nucléaires tactiques au sol à portée intermédiaire, parfaitement adaptés à l'engagement de cibles tactiques ou stratégiques. Ils sont très précis et tirent à assez longue distance pour détruire les fortifications ennemies ou les positions proches du front."
 
 icbm_equipment:0 "Missile balistique intercontinental"
 icbm_equipment_short:0 "IBM"
 icbm_equipment_desc:0 "Les ICBMS sont des missiles nucléaires balistiques stratégiques à longue portée lancés par des installations qui excellent à infliger des dégâts extrêmes aux cibles stratégiques et aux zones irradiantes. Les ICBM peuvent facilement être dévastateurs pour quiconque ou tout ce qu'ils ciblent."
 
 ##### FEVER DREAMS #####
 
 coup_equipment_desc:0 "Tricheur. Je ne peux pas croire que tu ferais ça, smdh. Lorsque vous avez téléchargé le mod, j'ai pensé que vous ressembliez à une personne de confiance. Quel mauvais jugement de caractère j'ai fait.\n\nÀ partir de maintenant et jusqu'à ce que vous commenciez un nouveau jeu, vous devez voir Sprinter (co-responsable technique alias « Starfoth ») vous regarder avec déception et jugement.\nPolarace (un autre co-responsable technique) vous juge également, mais il n'est pas montré car il ne peut même pas supporter de voir votre visage tricheur et menteur."
 
 aerosub_equipment:0 "Sous-marin aéronautique"
 aerosub_equipment_short:0 "Aérosub"
 aerosub_equipment_desc:0 "Le sous-marin volant est un bombardier naval amphibie capable de s'immerger pour échapper aux tirs anti-aériens ennemis et améliorer la furtivité. Utilisant une couverture aérienne ou maritime, le sous-marin volant est plus défendable à un coût et un compromis en termes de performances substantiels."
 
 suicide_craft_equipment:0 "Avion kamikaze"
 suicide_craft_equipment_short:0 "Avion suicide"
 suicide_craft_equipment_desc:0 "Armés d'explosifs lourds et d'une porte qui ne peut pas s'ouvrir une fois verrouillée, les avions kamikazes sont des avions extrêmement dangereux dans lesquels l'avion vole directement vers une position ennemie et explose à l'impact. Rendus totalement obsolètes et inutiles par les missiles de croisière, à moins que l'armée qui les utilise ne dispose de ressources minimales et d'un accès aux explosifs, aux vieux avions et aux membres fanatiques."
 
 #Trains
 train_equipment_short:0 "Train de la Seconde Guerre mondiale"
 train_equipment_1:0 "Train à vapeur de la Seconde Guerre mondiale"
 train_equipment_1_short:0 "Train de la Seconde Guerre mondiale"
 train_equipment_1_desc:0 "La locomotive à vapeur est restée de loin le type de locomotive le plus répandu jusqu'après la Seconde Guerre mondiale. Les locomotives à vapeur sont moins efficaces que les locomotives diesel et électriques modernes, et une main-d'oeuvre beaucoup plus importante est nécessaire pour les faire fonctionner et les entretenir, mais elles ont réussi à rester pertinentes pendant près de 100 ans jusqu'à présent."

 train_equipment_2_short:0 "Train amélioré"
 train_equipment_2:0 "Train diesel-électrique amélioré"
 train_equipment_2_desc:0 "Les locomotives diesel-électriques sont des locomotives diesel utilisant une transmission électrique. Le moteur diesel entraîne soit un générateur électrique à courant continu, soit un alternateur-redresseur électrique à courant alternatif, dont la sortie alimente les moteurs de traction qui entraînent la locomotive. Il n'y a aucune liaison mécanique entre le moteur diesel et les roues. La grande majorité des locomotives diesel sont aujourd'hui diesel-électriques."

 train_equipment_3_short:0 "Train moderne"
 train_equipment_3:0 "Train moderne à turbine à gaz"
 train_equipment_3_desc:0 "Une locomotive à turbine à gaz est une locomotive à moteur à combustion interne composée d'une turbine à gaz. Les moteurs ICE nécessitent une transmission pour propulser les roues. Le moteur doit pouvoir continuer à tourner lorsque la locomotive est arrêtée. Les locomotives mécaniques à turbine à gaz utilisent une transmission mécanique pour transmettre la puissance des turbines à gaz aux roues."


