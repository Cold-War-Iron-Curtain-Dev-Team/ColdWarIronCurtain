 medium_tank_destroyer_equipment_1:0 "Chasseur de chars I"
 medium_tank_destroyer_equipment_1_short:0 "Chasseur de chars I"
 medium_tank_destroyer_equipment_1_desc:0 "Les chasseurs de chars sont des véhicules blindés de combat armés d'un canon à tir direct spécialisé dans la capacité anti-blindage. Ils existent, comme leur nom l'indique, pour éradiquer les véhicules blindés de combat. Les systèmes de canons mobiles sont des canons à tir direct trop lourds pour être un ARV équipés sur un châssis trop léger pour être un CCP. Les systèmes de canons mobiles jouent généralement un rôle de combat direct, bien qu'ils engagent rarement directement les chars."
