 heavy_artillery_equipment_1:0 "Artillerie lourde I"
 heavy_artillery_equipment_1_short:0 "Artillerie lourde I"
 heavy_artillery_equipment_1_desc:0 "L'artillerie lourde est un canon d'artillerie lourd à longue portée capable de tirer des coups lourds sur une très longue portée. Généralement utilisée contre les fortifications, l'artillerie lourde est la meilleure en attaque mais offre de faibles avantages défensifs en raison de son petit nombre et de sa nature stationnaire."
