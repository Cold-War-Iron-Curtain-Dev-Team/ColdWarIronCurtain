 rocket_artillery_equipment_1:0 "Artillerie à fusées remorquées"
 rocket_artillery_equipment_1_short:0 "Artillerie de fusée"
 rocket_artillery_equipment_1_desc:0 "L'artillerie à roquettes est moins précise et a une cadence de tir soutenue bien inférieure à celle des batteries de canons d'artillerie traditionnels. Cependant, ils ont la capacité de toucher simultanément une cible avec plusieurs roquettes, avec un effet dévastateur."

 motorized_rocket_equipment_1:0 "Artillerie de fusée automotrice I"
 motorized_rocket_equipment_1_short:0 "Artillerie SP R I"
 motorized_rocket_equipment_1_desc:0 "L'artillerie à roquettes comprend des systèmes d'artillerie qui tirent de grandes rafales de roquettes afin de saturer une zone cible. Ces roquettes individuellement sont très imprécises, mais tirées en rafales, elles peuvent complètement saturer une zone et infliger de lourds dégâts."
