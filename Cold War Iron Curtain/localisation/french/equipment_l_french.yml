 light_artillery_equipment_1:0 "Artillerie légère I"
 light_artillery_equipment_1_short:0 "Artillerie légère I"
 light_artillery_equipment_1_desc:0 "L'artillerie légère est la forme d'artillerie la plus légère. L'artillerie légère inflige moins de dégâts que l'artillerie moyenne et est moins efficace dans les manoeuvres offensives que l'artillerie lourde. Cependant, il est léger et capable de réagir aux attaquants grâce à sa plus grande mobilité et de garder une zone plus vaste grâce à son plus grand nombre. L'artillerie légère peut inclure des mortiers lourds qui ne sont normalement pas utilisés par les bataillons d'infanterie ou les pièces d'artillerie légère."
