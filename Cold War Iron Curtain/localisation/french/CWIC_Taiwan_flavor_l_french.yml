 flavorchi.1.t:0 "[GetNewspaperHeader]Loi martiale levée"
 flavorchi.1.d:0 "La République de Chine a levé la loi martiale à Taiwan. Le décret était en vigueur depuis 1949."
 flavorchi.1.a:0 "Le décret est levé."
 flavorchi.1.b:0 "Taiwan a levé la loi martiale."
 flavorchi.2.t:0 "[GetNewspaperHeader]Le mouvement du lys sauvage"
 flavorchi.2.d:0 "Les étudiants ont occupé la place devant le palais présidentiel de Taipei. Ils veulent une nouvelle assemblée. Le sit-in est appelé le mouvement Wild Lily."
 flavorchi.2.a:0 "Les étudiants sont sur la place."
 flavorchi.2.b:0 "Taipei organise un sit-in étudiant."
 flavorchi.3.t:0 "[GetNewspaperHeader]Taiwan vote pour un président"
 flavorchi.3.d:0 "Les électeurs de Taiwan ont choisi pour la première fois un président au scrutin direct. Lee Teng-hui a gagné."
 flavorchi.3.a:0 "Le scrutin est lancé."
 flavorchi.3.b:0 "Taïwan a voté."
