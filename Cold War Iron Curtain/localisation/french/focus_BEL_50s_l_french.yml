  BEL_Belgium_and_the_World_desc:0 "La position de la Belgique dans le monde, dans la période d'après-guerre, n'a fait que croître. La politique étrangère est essentielle à nos objectifs."
  BEL_Pax_Belgica_desc:0 "Restant toujours une puissance coloniale, la place de la Belgique en Afrique est pour le moins fragile. Possédant des colonies au Congo belge et au Ruanda-Urundi, les temps pourraient changer..."
  BEL_Belgian_Reconstruction_desc:0 "Après avoir été envahie et occupée pour la deuxième fois en 40 ans, l'économie belge a été une fois de plus détruite. L'aide alliée sera utile, mais une reconstruction plus poussée est nécessaire pour dépasser les niveaux d'avant-guerre."
  BEL_The_Belgian_Armed_Forces_desc:0 "Petites mais puissantes, les forces armées belges ont besoin de nouvelles améliorations depuis la Seconde Guerre mondiale."
  BEL_The_Koningskwestie_desc:0 "La Koningskwestie, ou question royale, est une épine dans le pied de la Belgique depuis l'invasion allemande de 1940. Le roi Léopold abandonna son poste et devint un collaborateur allemand. Restant en exil en Suisse, le gouvernement doit recoller les morceaux pour savoir quoi faire de lui ; refuser son implication, ou lui souhaiter la bienvenue ?"
  BEL_Sanction_Former_Nazis_desc:0 "La collaboration avec les forces allemandes pendant la Seconde Guerre mondiale est considérée comme un crime contre l'État. Des sanctions et des punitions doivent être imposées à ces individus afin de les punir de leurs actes."
  BEL_Continue_the_Repression_of_Collaborators_desc:0 "La répression contre ces collaborateurs doit continuer. Leur raser la tête, les marquer, les mettre en prison, toutes les formes d'embarras public doivent être utilisées pour condamner ces traîtres."
  BEL_Form_the_Belgian_Office_for_Social_Security_desc:0 "Même si l'idée de la sécurité sociale et des prestations de retraite est un concept relativement nouveau, nous, en tant que gouvernement, devons introduire ces prestations auprès de notre population vieillissante."
  BEL_Empower_the_FGTB_ABVV_Union_desc:0 "Dans toute la Belgique, mais plus particulièrement en Wallonie, les syndicats, notamment la Fédération générale du travail de Belgique, contrôlent la plupart des opérations quotidiennes des travailleurs. Ils devraient bénéficier de plus d'autonomie et de soutien de la part du gouvernement."
  BEL_Call_For_A_Referendum_desc:0 "C'est au peuple de décider quel est le statut du roi."
  BEL_Bring_the_King_Back_From_Switzerland_desc:0 "La politique du gouvernement est que, quels que soient les sentiments du public à l'égard du roi, il doit être dûment renvoyé dans son pays natal depuis la Suisse, son lieu d'exil."
  BEL_Mobilize_Royalist_Support_in_Flanders_desc:0 "La région nord de la Flandre est une région royaliste et solidement catholique du pays. Concentrer nos efforts là-bas devrait garantir nos chances de voir le roi revenir."
  BEL_Campaign_Against_The_King_in_Wallonia_desc:0 "Sachant que la Wallonie est un bastion de la résistance anti-royaliste, nos efforts devraient être concentrés là-bas pour priver le roi traître de ses pouvoirs."
  BEL_Welcome_The_King_Back_to_Belgium_desc:0 "Le peuple a décidé, et le roi reviendra !"
  BEL_Deny_His_Constitutional_Duties_desc:0 "Le peuple a parlé ; le roi peut revenir, mais il ne peut exercer aucune de ses fonctions constitutionnelles comme il le faisait auparavant."
  BEL_Celebrate_The_Return_of_Leopold_desc:0 "Le Roi est revenu, et nous aurons des défilés dans les rues !"
  BEL_Negotiate_With_Anti_Royalist_Protestors_desc:0 "Les manifestants anti-royalistes font grève dans les rues pour demander pourquoi le roi a été renvoyé sans la voix du peuple. Des négociations rapides sont nécessaires pour garantir qu'il n'y ait plus de violence."
  BEL_Improve_Highway_Systems_in_Metropolitian_Belgium_desc:0 "Nos réseaux routiers ont été endommagés pendant la guerre ou sont vieux et en ruine. Avec le développement du réseau autoroutier, il sera plus facile de circuler non seulement en Belgique, mais dans tous les Pays-Bas !"
  BEL_Establish_the_Belgian_Office_for_the_Increase_of_Productivity_desc:0 "L'efficacité et la productivité sont les signes d'une bonne économie. Afin de relancer notre industrie, il faut créer un bureau pour augmenter la productivité sur le lieu de travail."
  BEL_Help_Establish_the_ECSC_desc:0 "La Communauté européenne du charbon et de l'acier assurera des échanges commerciaux bénéfiques entre l'Europe occidentale, en particulier nos abondantes réserves de charbon en Wallonie !"
  BEL_Accept_Marshall_Plan_Aid_desc:0 "L'aide du Plan Marshall des États-Unis financera et réparera notre industrie vieillissante et détruite."
  BEL_Embrace_American_Management_Principles_desc:0 "Les principes de gestion américains sont nécessaires dans nos industries, pour augmenter la productivité et les marges bénéficiaires, pour faire monter en flèche notre économie."
  BEL_Develop_Light_Consumer_Industry_in_Flanders_desc:0 "L'économie belge n'est pas connue pour ses usines de biens de consommation. Construire quelques installations en Flandre nous éviterait de recourir à l'aide étrangère."
  BEL_Sign_the_Treaty_of_Rome_and_Form_the_EEC_desc:0 "Nous nous rassemblerons avec d'autres pays occidentaux tels que la France et l'Allemagne de l'Ouest pour former la Communauté économique européenne, un pas plus important vers une plus grande Europe."
  BEL_An_Improved_and_Modern_Belgian_Economy_desc:0 "Tous ces efforts ; l'aide, la construction et l'adhésion à des organisations nous ont aidés à retrouver notre économie, rendant notre pays meilleur à long terme."
  BEL_The_Korean_War_desc:0 "La nation communiste de Corée du Nord a envahi la Corée du Sud démocratique. En tant que petit allié démocratique, nous devrions être enclins à aider les Sud-Coréens dans leur lutte pour la survie."
  BEL_Form_the_Belgian_United_Nations_Command_desc:0 "Dans le cadre de notre assistance dans la guerre de Corée, le Commandement belge des Nations Unies, composé d'une brigade, sera envoyé à Pusan, en République de Corée, pour fournir un soutien au combat."
  BEL_Condemn_North_Korean_Aggression_desc:0 "Au lieu d'envoyer une aide militaire, nous emprunterons la voie diplomatique et condamnerons la Corée du Nord pour son agression sans précédent contre son voisin du sud. Cette condamnation frappera et, espérons-le, empêchera toute nouvelle violence."
  BEL_Send_Military_Aid_desc:0 "Dans le cadre de notre aide à la Corée du Sud, nous enverrons nos meilleurs fusils, équipements motorisés et équipements de soutien."
  BEL_Increase_Commitment_in_Korea_desc:0 "Fournir simplement de l'aide ne suffit pas. Une implication militaire accrue en Corée est nécessaire pour renforcer l'esprit démocratique de la Corée du Sud, et il serait noble de contribuer davantage de nos hommes à cet objectif."
  BEL_The_North_Sea_Flood_desc:0 "Le 1er février 1953, les Pays-Bas furent frappés par une violente tempête de pluie, inondant la majeure partie de la région, notamment aux Pays-Bas."
  BEL_Expo_58_Preparations_desc:0 "Bruxelles a le plaisir d'accueillir l'Exposition universelle de 1958, également connue sous le nom d'Expo 58. Les préparatifs pour les grandes foules et les travaux de construction sont impératifs."
  BEL_European_Affairs_desc:0 "En Europe, ces affaires régionales sont tout aussi importantes que les affaires étrangères du monde entier."
  BEL_Join_NATO_desc:0 "L'Organisation du Traité de l'Atlantique Nord constitue un rempart de défense mutuelle contre les menaces en Europe. L'adhésion, avec le reste de l'Europe occidentale, garantira notre liberté."
  BEL_Form_the_Benelux_Parliament_desc:0 "Le Parlement Benelux, composé de députés belges, néerlandais et luxembourgeois, est la nouvelle branche législative de l'alliance Benelux."
  BEL_Begin_Gladio_Operations_desc:0 "Dans le cas où les Soviétiques avancent, nous disposerons d'opérations de maintien adéquates pour maintenir la lutte démocratique en vie."
  BEL_Form_the_Benelux_Economic_Union_desc:0 "Dans le cadre de l'alliance Benelux, une union économique devrait être incluse pour accroître les relations entre les pays du BeneLux"
  BEL_Establish_Euratom_desc:0 "L'adhésion à la Communauté européenne de l'énergie atomique garantira une utilisation sûre de l'énergie nucléaire et des utilisations de non-prolifération dans toute l'Europe occidentale."
  BEL_Ignore_the_Disaster_desc:0 "Au lieu de remédier aux dégâts causés par les inondations, nous refuserons tout simplement toute aide."
  BEL_Begin_Rebuilding_desc:0 "Les dégâts causés par les inondations ont ravagé nos régions côtières. Nous devons reconstruire."
  BEL_Assist_the_Dutch_in_Rebuilding_desc:0 "Pendant qu'ils reconstruisent, les Néerlandais ont besoin de plus d'aide. Ils ont besoin de notre aide, financièrement et infrastructurellement."
  BEL_Provide_Benefits_to_Flood_Victims_desc:0 "Toutes les personnes touchées par les inondations recevront une compensation du gouvernement pour les aider à redémarrer et à se rétablir."
  BEL_Build_the_Atomium_desc:0 "L'Atomium est une amélioration architecturale, conçue sous la forme d'un atome de fer, dont les sphères sont accessibles. Ce sera un phare brillant au centre de l'Expo 58."
  BEL_Include_the_Belgian_Congo_Exhibit_desc:0 "Nous mettrons en valeur les merveilles de nos colonies en présentant des autochtones évolués utilisant des équipements modernes derrière une vitre."
  BEL_Do_Away_With_the_Racist_Human_Zoos_desc:0 "Nous sommes en 1958 et présenter nos sujets comme des animaux est tout simplement une erreur."
  BEL_Develop_Expo_Transport_Networks_in_Brussels_desc:0 "Afin d'accueillir l'afflux de visiteurs à Bruxelles pour le salon, nous devons créer des réseaux de transports plus grands et plus efficaces autour de la ville et du parc des expositions."
  BEL_Welcome_Delegations_From_Around_the_World_desc:0 "Nous accueillerons des délégations de partout, notamment des États-Unis, de l'URSS, de l'Allemagne de l'Ouest, de la Yougoslavie et d'autres pavillons majeurs."
  BEL_Introduce_the_Ten_Year_Plan_desc:0 "Un plan décennal d'industrialisation massive et d'amélioration de l'économie coloniale ne fera qu'améliorer le niveau de vie... et nos marges de profit."
  BEL_Reorganize_the_Belgian_Ministry_of_Colonies_desc:0 "Le ministère des Colonies est dépassé et, alors que nous nous dirigeons vers les années 1950, il doit être réorganisé pour refléter la nouvelle ère dans laquelle nous vivons."
  BEL_Establish_the_Central_Bank_of_the_Belgian_Congo_and_Ruanda_Urundi_desc:0 "Être rattaché à la Banque centrale de Belgique est tout simplement trop difficile à cause de la distance. Une banque au Congo facilitera grandement la distribution d'argent et les prêts."
  BEL_The_Decree_of_14_July_1952_desc:0 "Ce décret royal permettra, pour la première fois, la participation politique et la formation de partis à la population indigène."
  BEL_The_Kings_Tour_of_the_Colonies_desc:0 "Le Roi Baudouin a le plaisir de visiter la colonie !"
  BEL_Establish_Native_Workers_Pensions_desc:0 "Les travailleurs autochtones méritent une pension de retraite, tout comme leurs travailleurs à la peau plus claire chez eux."
  BEL_Negotiate_the_Wage_Gap_With_the_APIC_desc:0 "Le syndicat local APIC s'est dit préoccupé par l'écart salarial entre les travailleurs européens et autochtones. Nous négocierons cet écart en conséquence." 
  BEL_The_Belgian_Air_Component_desc:0 "Formée en 1909 en tant que branche de l'armée belge, la composante aérienne est devenue sa propre branche, étant la première force aérienne à tirer une mitrailleuse depuis un avion et à combattre pendant la Première et la Seconde Guerre mondiale, bien que depuis l'Angleterre." 
  BEL_The_Belgian_Land_Component_desc:0 "Formée en 1873, la composante terrestre formait une force modeste de six divisions pour son entrée dans la Première Guerre mondiale et de dix-huit divisions avant la Seconde Guerre mondiale. Après la guerre, la majeure partie de l'armée fut responsable de l'occupation de l'Allemagne et de la libération de la Belgique."
  BEL_The_Belgian_Marine_Component_desc:0 "Créée en 1832 comme première branche de l'armée belge, la Marine a été supprimée à plusieurs reprises pour des raisons budgétaires, dans les années 1860 et 1920. Pendant la Seconde Guerre mondiale, elle fut refondée, mais rejoignit rapidement la Royal Navy, jusqu'à la fin de la guerre, où elle ne disposa que de quelques patrouilleurs donnés par les Britanniques."
  BEL_Purchase_F84_Thunderjets_desc:0 "En construisant notre force aérienne pour une époque moderne, nous achèterons des chasseurs-bombardiers F-84 Thunderjet aux Américains. Nous avons constaté leur efficacité dans le conflit coréen et leur coût en vaut la peine."
  BEL_Form_the_Advanced_Pilots_School_in_the_Congo_desc:0 "En améliorant notre présence au Congo, nous construirons une école de pilotes à Kabala, pour former nos aviateurs au combat aérien dans la jungle, aux bombardements et à l'interception."
  BEL_Join_the_Second_Allied_Tactical_Air_Force_desc:0 "Faisant partie de l'OTAN, notre présence au sein de la 2ATAF élargira le réseau de défense aérienne de l'Europe occidentale et empêchera les incursions soviétiques dans notre espace."
  BEL_Form_the_I_Belgian_Corps_desc:0 "Le Ier Corps belge était un corps existant avant la Seconde Guerre mondiale, mais nous le ramènerons pour renforcer les opérations de l'OTAN en Belgique et en Allemagne de l'Ouest."
  BEL_Acquire_M46_and_M47_Armored_Vehicles_desc:0 "L'achat de chars moyens américains M46 et M47 Patton excédentaires apportera un soulagement à notre grande armée basée sur l'infanterie."
  BEL_Form_the_Belgian_1st_Para_Commando_Regiment_desc:0 "Les forces spéciales et les troupes aéroportées sont une idée relativement nouvelle dans les milieux militaires. Avoir des Para-Commandos rendra notre force de réaction militaire plus rapide et plus décisive, venant du ciel !"
  BEL_Recognize_the_Royal_Belgian_Sea_Cadet_Corps_desc:0 "Le Corps des Cadets de la Marine Royale Belge a été un rempart d'entrée dans notre marine ainsi que dans la défense côtière, et ils méritent d'être reconnus pour leurs actions."
  BEL_Expand_the_Port_of_Zeebrugge_desc:0 "Le développement de la paisible ville balnéaire et du port de Zeebrugge aidera non seulement notre marine en pleine croissance, mais aussi notre économie."
  BEL_Acquire_Former_American_Frigates_and_Patrol_Craft_desc:0 "Nous accepterons une frégate de classe Tacoma et plusieurs dragueurs de mines des Américains pour augmenter notre force de défense navale."
  BEL_The_1950_General_Strike_desc:0 "Issues de la Question Royale, ces grèves générales laisseront certainement des traces dans notre nation"
  BEL_A_Vote_of_No_Confidence_on_Duvieusart_desc:0 "Jean Duvieusart a raté son mandat de Premier ministre au lendemain du retour du roi. Il n'est tout simplement plus capable d'être notre chef de gouvernement."
  BEL_Announce_the_Resumption_of_the_Kings_Duties_desc:0 "Maintenant que la crise est résolue, le Roi s'est déclaré prêt à reprendre ses fonctions."
  BEL_Nominate_Joseph_Pholien_as_PM_desc:0 "Notre nouveau candidat au poste de Premier ministre est Joseph Pholien, homme politique du CSP et ancien ministre de la Justice."
  BEL_Accept_the_Kings_Abdication_desc:0 "Le roi a proposé son abdication à la suite de la question royale, et nous, en tant que nation, devons l'accepter."
  BEL_Increase_Wages_to_Catholic_Schoolteachers_desc:0 "Les enseignants catholiques sont l'épine dorsale de l'éducation de nos enfants et devraient être augmentés en conséquence."
  BEL_Confer_Royal_Powers_on_Prince_Baudouin_desc:0 "Le prince Baudouin est le fils de Léopold et à juste titre, il sera couronné prochain roi des Belges !"
  BEL_Crown_Prince_Baudouin_desc:0 "L'heure du couronnement du Prince est venue, et ayant reçu les pouvoirs constitutionnels du Roi, il sera officiellement couronné à Bruxelles !"
  BEL_The_Debate_on_Education_desc:0 "L'éducation en Belgique a toujours été en conflit. Rester laïc ou adhérer à l'enseignement public catholique est une question vivement débattue et qui atteint un point critique dans l'esprit du peuple."
  BEL_Pass_the_Harmel_Education_Laws_desc:0 "Les nouvelles lois sur l'éducation, présentées par Pierre Harmel du CSP, lieront les subventions aux écoles privées catholiques et permettront aux écoles privées d'obtenir plus facilement une légitimité."
  BEL_Loosen_the_Repressie_desc:0 "Nous devrions mettre un terme aux mauvais traitements infligés aux collaborateurs allemands, ou au moins leur accorder une liberté limitée."
  BEL_Nominate_Jean_van_Houtte_as_PM_desc:0 "Jean van Houtte sera nommé Premier ministre, un homme politique du CSP qui a été ministre des Finances dans les gouvernements précédents."
  BEL_The_1952_Defense_Review_desc:0 "L'examen de nos forces armées d'un point de vue défensif et civil permettra de découvrir des fissures dans notre armée et de les réparer."
  BEL_Stop_the_Harsh_Treatment_of_German_Collaborators_desc:0 "Ces mauvais traitements doivent cesser."
  BEL_Form_Anti_Air_Battalions_desc:0 "Pour se préparer aux incursions soviétiques, des bataillons anti-aériens doivent être constitués pour assurer une défense aérienne supplémentaire de notre ciel."
  BEL_Expand_Military_Conscription_desc:0 "La guerre pourrait éclater à tout moment, et l'expansion de la conscription augmenterait nos forces militaires pour assurer la meilleure défense de l'Europe occidentale."
  BEL_Go_Back_to_the_Repressie_desc:0 "Les collaborateurs allemands ont encore trop de liberté, il faut sévir en conséquence pour les punir."
  BEL_Protest_Against_Freedom_of_German_Collaborators_desc:0 "Le peuple a réagi en conséquence au relâchement de la répression."
  BEL_The_Economic_Recession_desc:0 "Une récession économique sans précédent a frappé notre économie et nous devons nous relever."
  BEL_Put_Down_the_Anti_Royalist_Protests_desc:0 "Les manifestations anti-royalistes sont devenues incontrôlables et doivent être contrôlées en conséquence."
  BEL_Quietly_Support_the_Protests_desc:0 "Au lieu de réprimer les protestations, nous refuserons de nous impliquer et resterons dans l'ombre."
  BEL_Deploy_the_Belgian_Military_desc:0 "Laisser la gendarmerie gérer les manifestations ne suffit pas. Des unités militaires belges devront être déployées pour contrôler la situation et sécuriser les zones stratégiques."
  BEL_Arrest_Monarchist_Protestors_Only_desc:0 "En restant publiquement neutres, nous suggérerons que la police et les soldats n'arrêtent les manifestants monarchistes que pour leurs actions."
  BEL_The_Saga_of_Julien_Lahaut_desc:0 "Julien Lahaut, le chef du Parti communiste belge, a eu un passé mouvementé et son sort doit être déterminé." 
  BEL_Order_His_Assassination_By_a_Monarchist_desc:0 "Lahaut ne doit pas être maintenu en vie pour poursuivre ses activités subversives..."
  BEL_Allow_Lahaut_to_Continue_His_Communist_Activities_desc:0 "Nous épargnerons Lahaut, mais surveillons-le attentivement. Ce n'est pas un homme de confiance..."
  BEL_End_the_Strikes_desc:0 "Le gouvernement et les manifestants sont parvenus à une solution et les grèves prendront bientôt fin."
  BEL_Focus_on_the_Needs_of_the_Working_Class_desc:0 "Les besoins de la classe ouvrière sont les besoins du peuple, et nous répondons à ses besoins."
  BEL_Continue_Anti_Royalist_Rhetoric_desc:0 "Notre aversion pour le roi est forte et nous continuerons à condamner publiquement la famille royale jusqu'à notre dernier souffle."
  BEL_Continue_Development_of_the_Silion_Industriel_desc:0 "Le Silion Industriel est une zone industrielle de Wallonie qui mérite davantage de développement industriel."
  BEL_Negotiate_with_the_Unions_desc:0 "Pour éviter de nouvelles grèves, nos relations avec les syndicats doivent être améliorées et de grands mécanismes de négociation doivent être mis en place."
  BEL_Resist_Calls_from_Catholic_Leaders_for_Religious_Schools_desc:0 "Nous devons empêcher toute pression en faveur de la création d'écoles religieuses dans ce pays, y compris la réduction au silence de l'opposition."
  BEL_Push_for_Public_Secular_Schools_desc:0 "Au lieu des écoles religieuses, nous devons mettre l'accent sur les écoles publiques et non religieuses pour offrir la meilleure éducation sans aucun préjugé."
  BEL_Increase_Spending_on_NATO_desc:0 "Une défense forte est cruciale pour un pays fort, et nous devons maintenir notre position démocratique et notre défense en dépensant davantage pour les contributions à l'OTAN."
  BEL_Nominate_Max_Buset_as_PM_desc:0 "Max Buset sera nommé Premier ministre, homme politique du BSP et président du Parti socialiste belge depuis 1945."
  BEL_Analyze_the_1952_Defense_Reports_desc:0 "L'examen de nos forces armées d'un point de vue défensif et civil permettra de découvrir des fissures dans notre armée et de les réparer."
  BEL_Announce_Support_for_King_Baudouin_desc:0 "Tout en maintenant notre rhétorique publique anti-royaliste, le soutien au nouveau roi Baudouin est crucial pour une nation unie."
  BEL_Prioritize_the_French_Speaking_Population_desc:0 "En tant que parti principalement basé en Wallonie francophone, nous avons tendance à donner la priorité à notre circonscription avant tout."
  BEL_The_Workers_Line_of_Defense_desc:0 "Une nouvelle et meilleure politique de défense doit être instituée pour défendre notre nation, en se concentrant avant tout sur les travailleurs !"
  BEL_The_Buset_Style_of_Socialism_desc:0 "Présentation du nouveau style de socialisme de Buset, axé avant tout sur l'unité française et les droits des travailleurs."

  BEL_Dealing_with_the_Recession_desc:0 "La récession économique a détruit notre économie et nos tentatives de reconstruction. Faire face à ce recul pourrait assurer notre éventuel rétablissement."
  BEL_Continuing_CSP_Dominance_desc:0 "Le Parti chrétien-social a joué un rôle important dans le gouvernement depuis sa création, et maintenant qu'il a obtenu la majorité au gouvernement, sa politique peut être menée à bien sans trop d'opposition."
  BEL_Flanders_Economic_Recovery_desc:0 "La Flandre est une région économique émergente sur laquelle il faut se concentrer davantage pour se remettre de la récession."
  BEL_Wallonia_Economic_Recovery_desc:0 "La Wallonie est la région la plus ancienne, industrialisée et minière de Belgique. Les sortir des décombres contribuerait à sécuriser notre économie."
  BEL_Modernize_Obsolete_Manufacturing_Processes_desc:0 "Les processus de fabrication obsolètes et anciens ne font que créer davantage de problèmes pour notre reprise ; l'introduction de processus plus modernes sera utile."
  BEL_Expand_the_Flemish_Diamond_desc:0 "Le Diamant flamand est une zone récemment industrialisée autour de Bruxelles qui a besoin d'être agrandie et rénovée."
  BEL_Develop_Chemical_and_Automobile_Industries_desc:0 "La production de produits tels que les produits pétrochimiques et les automobiles permettra à notre commerce de croître et de se développer."
  BEL_Expand_Belgian_Beer_Imports_desc:0 "La Belgique a toujours été connue pour sa bière et, à l'ère du Jet, nous augmenterons la production pour permettre un accès mondial à nos bières."
  BEL_Diversify_Away_From_the_Coal_Industry_desc:0 "La région sud de la Wallonie a toujours été connue comme une zone industrielle minière majeure. Conscients de la nécessité de recourir à davantage de formes d'énergie alternatives, nous devrions nous tourner prudemment vers des sources autres que le charbon."
  BEL_Make_Antwerp_a_Large_European_Trade_Hub_desc:0 "Anvers est une grande ville belge depuis la fondation du pays en 1830, et même avant. Étendre le port d'Anvers pour en faire un commerce international pour toute l'Europe aiderait non seulement le continent mais aussi notre industrie maritime."
  BEL_Prioritize_Technical_Education_desc:0 "Au lieu de nous concentrer uniquement sur l'enseignement académique, nous devrions proposer des parcours vers des programmes d'enseignement professionnel et technique afin de permettre aux individus d'entrer directement sur le marché du travail après avoir quitté l'école."
  BEL_Reduce_Conscription_Time_to_18_Months_desc:0 "Notre armée est suffisamment forte et notre besoin de conscription n'est pas nécessairement nécessaire en cette période de paix fragile. Tout en maintenant notre politique de conscription, nous réduirons la période de service à un an et demi au lieu de deux ans ou plus comme auparavant."
  BEL_Award_Colonel_De_Melen_For_His_Service_desc:0 "Le colonel Henri Moreau de Melen était commandant du bataillon belge pendant la guerre de Corée, ainsi que ministre de la Défense avant la guerre. Pour son service (et son service unitaire en Corée), il sera dûment récompensé."
  BEL_Enact_the_Second_De_Taeye_Act_desc:0 "Bien que controversée, la deuxième loi De Taeye, du nom du ministre du Logement De Taeye, détruira les bâtiments condamnés et les bidonvilles pour un meilleur développement urbain."
  BEL_Welcome_US_Military_Aid_desc:0 "Lors de la construction de notre armée, il est nécessaire de solliciter l'aide des Américains sous la forme de dons d'équipements militaires, notamment d'armes à feu, de chars et d'avions."
  BEL_Investigate_Mining_Conditions_in_Wallonia_desc:0 "Après plusieurs catastrophes minières en Wallonie, il nous semble nécessaire d'enquêter sur les conditions minières et de sécurité, pour réévaluer la valeur de notre industrie minière dans la région."
  BEL_CSP_Prepare_For_Expo_58_desc:0 "Le moment est venu de préparer l'Exposition universelle de 1958 à Bruxelles, notamment en construisant des réseaux d'infrastructures et de grands pavillons pour soutenir les délégations."
  BEL_Van_Ackers_Welfare_State_desc:0 "Sous la direction du Premier ministre Achille van Acker, un État-providence plus fort sera construit pour fournir les fonds nécessaires aux retraités, aux personnes à faible revenu et aux familles."
  BEL_The_Collard_Act_desc:0 "La loi sur l'éducation présentée par le ministre de l'Éducation Leo Collard exigera que tous les enseignants soient officiellement certifiés, rendant ainsi les prêtres et autres membres du clergé travaillant comme enseignants inéligibles à diriger des écoles."
  BEL_Institute_a_45_Hour_Workweek_desc:0 "Il a été prouvé que des semaines de travail plus courtes augmentent la productivité des employés et permettent un meilleur moral au travail. Réduire les heures de travail à un maximum de 45 heures par semaine pour les particuliers garantira la stabilité des entreprises et le bonheur des gens."
  BEL_Reduce_Compulsory_Military_Service_desc:0 "Notre armée est suffisamment forte et notre besoin de conscription n'est pas nécessairement nécessaire en cette période de paix fragile. Tout en maintenant notre politique de conscription, nous réduirons la période de service à un an et demi au lieu de deux ans ou plus comme auparavant."
  BEL_Begin_Issuing_Pensions_to_Eligible_Citizens_desc:0 "Le fonds de pension devrait être construit pour être la facette la plus importante de notre programme de protection sociale, afin de permettre aux personnes âgées de vivre dans le confort et la stabilité au cours de leurs dernières années sans se soucier des problèmes financiers."
  BEL_The_Father_of_Belgian_Social_Security_desc:0 "Van Acker devrait être mythifié comme le père de la sécurité sociale belge et l'architecte de notre système de protection sociale pour les années à venir."
  BEL_BSP_Prepare_For_Expo_58_desc:0 "Le moment est venu de préparer l'Exposition universelle de 1958 à Bruxelles, notamment en construisant des réseaux d'infrastructures et de grands pavillons pour soutenir les délégations."
  BEL_The_Second_School_War_desc:0 "La Seconde Guerre scolaire est une période de conflit prolongée autour du débat sur l'éducation..."
  BEL_Continue_Separate_Catholic_Education_desc:0 "Une éducation catholique séparée est nécessaire pour éloigner les influences laïques et athées de la jeunesse catholique."
  BEL_Repeal_the_Harmel_Education_Laws_desc:0 "L'abrogation des lois Harmel sur l'éducation garantira l'égalité des salaires entre les enseignants catholiques et laïcs ainsi que la suppression des subventions aux écoles catholiques."
  BEL_Subsidize_Catholic_Teachers_Pay_desc:0 "Les enseignants catholiques sont l'épine dorsale de l'éducation de nos enfants et devraient être augmentés en conséquence."
  BEL_Face_Protests_From_the_Socialists_and_Liberals_desc:0 "Les socialistes et les libéraux protestent contre notre politique éducative et nous devons gérer ces manifestations en conséquence."
  BEL_Take_Criticism_From_the_CDLD_and_Bishops_desc:0 "Plusieurs évêques et organisations catholiques ont publiquement condamné nos réformes éducatives, et elles trouveront un fort écho dans l'esprit du peuple. Nous allons passer au travers."
  BEL_Begin_Negotiations_with_the_Opposition_desc:0 "Entamer des négociations avec l'opposition concernant le conflit éducatif pourrait raccourcir cette crise et fournir une éducation de qualité à nos jeunes."
  BEL_Begin_Campaigning_on_Education_Before_the_Election_desc:0 "Les prochaines élections approchent et l'éducation sera un sujet important dans l'esprit des gens lors du vote ; nous devrions nous concentrer sur cette question lors de notre campagne."
  BEL_Put_Down_the_PSB_Liberal_Protests_desc:0 "Les socialistes et les libéraux sont allés assez loin dans leurs protestations et leur opposition ne sera pas tolérée."
  BEL_Put_Down_the_Catholic_CSP_Protests_desc:0 "Les catholiques sont allés assez loin dans leurs protestations et leur opposition ne sera pas tolérée."

  BEL_Form_A_CSP_BSP_Government_desc:0 "La coopération avec l'opposition est possible et nécessaire pour un gouvernement efficace."
  BEL_Reach_an_Agreement_with_the_School_Pact_desc:0 "Le débat sur l'éducation sera enfin tranché avec le Pacte scolaire, un accord entre les deux parties sur la question."
  BEL_Prioritize_Regional_Economies_desc:0 "Se concentrer sur les économies régionales, plutôt que sur notre économie nationale, offrira plus d'autonomie et d'indépendance entre nos deux régions."
  BEL_Reduce_the_Price_of_Belgian_Coal_desc:0 "La réduction du prix de notre charbon pourrait affecter notre industrie, mais permettrait à davantage d'acheteurs étrangers de notre charbon."
  BEL_Resist_Separate_French_and_Dutch_Language_Laws_desc:0 "La législation linguistique est une idée relativement nouvelle en Belgique, et la séparation des langues dans certaines régions du pays ne fera que rendre la vie plus difficile."
  BEL_Enact_the_Expansion_Acts_desc:0 "La promulgation des lois d'expansion, aussi controversées soient-elles, stabilisera pour le mieux notre pays."
  BEL_The_Leopoldville_Riots_desc:0 "Les indigènes du Congo sont devenus indisciplinés sous notre domination ; en particulier le parti politique ABAKO, qui s'est vu refuser une réunion pour protester contre le gouvernement. Nous devons trouver comment réagir."
  BEL_Deploy_the_Force_Publique_desc:0 "La Force Publique, ou gendarmerie coloniale, doit être déployée dans les rues de Léopoldville pour rétablir l'ordre et arrêter les responsables de la désobéissance civile à Léopoldville." 
  BEL_Let_the_Congolese_Protest_desc:0 "Au lieu de réprimer immédiatement les protestations, nous observerons et laisserons les indigènes protester, en ne procédant à des arrestations qu'en cas d'absolue nécessité." 
  BEL_Increase_Hospital_Bedcount_desc:0 "L'augmentation du nombre de lits et d'autres infrastructures dans nos hôpitaux permettra un meilleur système de santé et une meilleure tranquillité d'esprit pour notre population." 
  BEL_Defend_the_Collard_Act_Against_Opposition_desc:0 "L'opposition a été forte ces derniers jours, centrée autour de la loi Collard, qui concerne la privation du droit de vote des prêtres catholiques qui étaient enseignants avant la loi. Nous défendrons cela avec nos politiques en faveur d'une éducation réussie."
  BEL_Focus_on_Water_and_Agricultural_Projects_desc:0 "Travailler sur les infrastructures hydrauliques et les systèmes agricoles modernisés permettra de développer notre industrie alimentaire et végétale et de réduire notre dépendance à l'égard de la production industrielle."
  BEL_Begin_Rethinking_the_Congo_Situation_desc:0 "Notre propriété du Congo belge devient de jour en jour de plus en plus controversée, d'autant plus que d'autres colonies se soulèvent et font face à l'indépendance. Peut-être devrions-nous envisager des pistes d'action possibles."
  BEL_Focus_on_Hydroelectric_Energy_desc:0 "Commencer à planifier de nouveaux systèmes de barrages hydroélectriques permettra à la fois de contrôler nos systèmes d'eau et de fournir une source d'énergie constante."
  BEL_Hold_Hearings_on_the_Colonial_Situation_desc:0 "Le Parlement et le ministère des Colonies procéderont à des auditions sur la situation coloniale pour comprendre réellement ce qui se passe et parvenir à un consensus sur la question."
