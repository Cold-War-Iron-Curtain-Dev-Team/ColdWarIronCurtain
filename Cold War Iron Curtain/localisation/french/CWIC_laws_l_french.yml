 #EDICTS[projects]#
 edict_welfare_project_mortgage:0 "Subventions hypothécaires"
 edict_welfare_project_mortgage_desc:0 "Un programme de subventions gouvernementales visant à réduire les taux d'intérêt hypothécaires, à augmenter le nombre de propriétaires et à bénéficier indirectement au secteur du logement"
 edict_welfare_project_homelessness:0 "Aide aux sans-abri"
 edict_welfare_project_homelessness_desc:0 "Un programme massif et de grande envergure visant à lutter contre le problème complexe du sans-abrisme. Fournit des dispositions pour les sans-abri, des programmes de sensibilisation pour lutter contre les causes profondes, des services psychologiques pour lutter contre l'itinérance chronique et les problèmes mentaux, des programmes de sensibilisation à la dépendance et un large éventail de projets de logement"
 
 #EDICTS[programs]#
 edict_welfare_program_compulsorywork:0 "Travail obligatoire pour les chômeurs"
 edict_welfare_program_compulsorywork_desc:0 "Programmes de travail mis en place par le gouvernement pour garantir des taux de chômage artificiellement bas. Fournit des avantages généraux aux services publics, offre une formation professionnelle et une expérience de travail universelles et fournit un revenu en échange de travaux publics"
 
