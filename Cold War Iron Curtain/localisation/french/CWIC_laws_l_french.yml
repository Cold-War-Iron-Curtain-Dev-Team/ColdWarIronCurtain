 #Christian#
 ReligionChristianity:0 "Christianisme"
 ReligionChristianity_desc:0 "Le christianisme est une religion monothéiste abrahamique basée sur les enseignements de Jésus. Les chrétiens croient que Jésus est le Christ, le Messie prophétisé dans le Tanakh. Après la conversion de l'empereur romain, la religion est devenue la foi dominante dans l'Empire romain d'Occident et d'Orient. Au fil des siècles, le christianisme a été ravagé par des schismes, mais il est devenu la religion dominante en Europe et dans les régions voisines. L'avènement du colonialisme et des missions de prosélytisme ont répandu la foi à travers le monde, faisant du christianisme la foi la plus grande et la plus répandue de la planète."
 
 ReligionChristianityCatholic:0 "Catholique (chrétien)"
 ReligionChristianityProtestant:0 "Protestant (chrétien)"
 ReligionChristianityOrthodox:0 "Orthodoxe (chrétien)"
 ReligionChristianityOriental:0 "Orthodoxe orientale (chrétienne)"
 ReligionChristianityCatholic_desc:0 "Le catholicisme est la plus grande confession chrétienne, dirigée par l'évêque de Rome, connu sous le nom de pape. L'église est basée au Vatican, à Rome. Les catholiques croient que leur Église a été fondée par Jésus et que ses évêques sont les successeurs des apôtres. L'Église et ses fidèles continuent d'adhérer aux pratiques traditionnelles de l'Église et de suivre le clergé dirigé par le Pape. Aujourd'hui, le catholicisme est présent dans presque tous les pays et, même si l'Église n'a pas l'influence politique de ses débuts, l'Église conserve une immense influence sur ses fidèles, en particulier en Europe et en Amérique du Sud."
 ReligionChristianityProtestant_desc:0 "Le protestantisme fait référence à un certain nombre de mouvements religieux apparus au XVIe siècle lors de la Réforme. Ses fondateurs étaient en désaccord avec la doctrine catholique, notamment en ce qui concerne les pouvoirs laïques de l'Église, le rôle de son clergé et certaines pratiques religieuses. L'Église protestante cherchait à diffuser la connaissance vernaculaire de la Bible et à mettre fin à ce qu'elle considérait comme des pratiques superstitieuses de l'Église catholique. Il existe aujourd'hui de nombreuses églises protestantes différentes et leurs fidèles sont présents en grand nombre en Europe occidentale et aux États-Unis."
 ReligionChristianityOrthodox_desc:0 "L'Église orthodoxe se considère comme l'Église de succession apostolique et croit que l'Église catholique romaine du Pape a quitté l'Église lors du Grand Schisme de 1054. Le schisme s'est produit à la suite de différends sur le statut de la primauté papale et de changements dans les interprétations que le Pape a tenté d'imposer. L'Église orthodoxe n'est pas une Église unique, mais un collectif d'Églises en communion ; chaque Église a donc des dirigeants différents et des traditions liturgiques variées. L'Église compte des fidèles dans les Balkans, en Europe de l'Est et en Méditerranée. Malgré la montée de l'islam et plus récemment du communisme en Europe de l'Est, les efforts des fidèles au sein des pays et de la diaspora lui permettent de persévérer."
 ReligionChristianityOriental_desc:0 "L'Église orthodoxe orientale se différencie des autres confessions par la doctrine selon laquelle Jésus-Christ lui-même a une nature singulière par opposition à humaine et divine, comme cela a été le cas au Concile de Chalcédoine. L'orthodoxie orientale a façonné l'histoire de l'Arménie, de l'Égypte, de l'Assyrie, de l'Afrique de l'Est et même du Kerala en Inde. L'Église orthodoxe orientale n'est pas une Église unique, mais un collectif d'Églises en communion ; chaque Église a donc des dirigeants différents et des traditions liturgiques variées."
 #Judaic#
 ReligionJudaic:0 "Judaïque"
 ReligionJudaic_desc:0 "Le judaïsme est la première et la plus ancienne religion monothéiste abrahamique. Elle est souvent considérée comme une religion ethnique, ses adeptes étant les descendants des Israélites de l'âge du bronze. Les adeptes du judaïsme adhèrent généralement aux traditions orales, au Tanakh et à d'autres écritures traditionnelles. Abraham est considéré comme le premier Hébreu et de sa lignée est née la communauté juive. De nombreux adeptes décrivent le judaïsme comme l'expression de l'alliance que Dieu a conclue avec les Israélites et leurs descendants. Au fil des siècles, les communautés juives se sont répandues à travers le monde, notamment en Europe et au Moyen-Orient, jouant un rôle de premier plan dans le développement des sciences, des théories sociales et du commerce. Cependant, en tant que minorité perpétuelle, ils ont été confrontés à des périodes de persécution intense et, plus récemment, à un génocide en Europe. Israël est le seul État juif, mais les communautés de la diaspora juive continuent d'exister à travers le monde."
 
 ReligionJudaism:0 "Judaïsme (judaïque)"
 ReligionJudaism_desc:0 "Il existe de multiples interprétations des textes religieux, des traditions orales et des pratiques de la foi. Cette apparente flexibilité identitaire est liée à la nature ethnique et religieuse de la foi. En général, presque tous les adeptes du judaïsme se considèrent comme des descendants d'Abraham. Bien que la plupart des rites religieux juifs puissent être accomplis par un adepte, les questions et interprétations juridiques sont généralement adressées aux érudits religieux appelés rabbins qui fournissent des conseils et des connaissances aux adeptes. Ces derniers temps, l'émergence du nationalisme, de la laïcité et du rationalisme a vu émerger de nouvelles interprétations et congrégations. Bien qu'Israël soit un État juif, la diaspora juive continue d'exister et de prospérer partout dans le monde. Cependant, les communautés restées en Europe de l'Est, au Moyen-Orient et en Afrique sont confrontées à des persécutions."
 #Islamic#
 ReligionIslamic:0 "Islamique"
 ReligionIslamic_desc:0 "L'Islam est apparu au VIIe siècle et constitue la foi monothéiste abrahamique la plus récente. Ses adeptes, appelés musulmans, croient en la suprématie absolue de Dieu, traduite par Allah en arabe. Ils croient que le dernier prophète de Dieu était Mahomet qui a révélé le Coran que les musulmans considèrent comme les paroles non filtrées de Dieu. Malgré un schisme sur l'héritier du pouvoir politique après la mort de Mahomet, l'Islam s'est développé rapidement, que ce soit à travers les conflits, le commerce, les mystiques ou les missionnaires. Aujourd'hui, l'islam est présent partout dans le monde, mais particulièrement répandu au Moyen-Orient, en Asie, en Afrique et dans certaines parties de l'Europe. L'impérialisme européen a vu une grande partie du monde islamique colonisée. Avec l'émergence de la décolonisation, de nombreuses sociétés musulmanes doivent se demander si un retour aux pratiques traditionnelles ou une adoption de la modernisation sont les clés pour assurer la protection et la santé de leurs sociétés."
 
 ReligionIslamSunni:0 "Sunnite (islamique)"
 ReligionIslamShia:0 "Chiite (islamique)"
 ReligionIslamIbadi:0 "Ibadite (islamique)"
 ReligionIslamSunni_desc:0 "La plus grande confession islamique au monde. Comme tous les musulmans, ils doivent pratiquer les cinq piliers de l'Islam, considérés comme les actes fondamentaux de la foi. Il n'y a pas de clergé formel et de nombreux musulmans sunnites se tournent souvent vers des érudits religieux pour obtenir des conseils sur la spiritualité, la vie et le droit. Les arguments juridiques et les décisions prises par les érudits religieux sont basés sur le Coran, les hadiths et le raisonnement. L'islam sunnite a émergé au cours d'âpres conflits pour savoir qui devait succéder à Mahomet. Aujourd'hui, les deux confessions ont établi une jurisprudence juridique divergente. À l'heure actuelle, la grande majorité des musulmans dans le monde sont sunnites et constituent généralement la plus grande population musulmane de tous les États musulmans, à l'exception de l'Iran. En Syrie, au Liban et en Irak, ils ne constituent pas une écrasante majorité."
 ReligionIslamShia_desc:0 "La deuxième plus grande confession de l'Islam au monde. Ses origines résident dans les disputes sur le successeur de Mahomet après sa mort. Les chiites, contrairement aux sunnites, estimaient que les successions étaient injustes et vénéraient Ali et Husayn assassinés comme des martyrs. Bien que les deux confessions reconnaissent l'importance des cinq piliers et la suprématie du Coran, les décisions juridiques des érudits chiites divergent de celles des écoles juridiques sunnites. En outre, les chiites duodécimains disposent d'un clergé formel composé d'érudits de différents rangs pour fournir des décisions et des conseils à la communauté. Les musulmans chiites constituent une nette majorité en Iran et en Irak, mais ils comptent d'importantes populations minoritaires au Moyen-Orient et en Asie du Sud."
 ReligionIslamIbadi_desc:0 "L'islam ibadite, bien qu'il s'agisse d'une dénomination beaucoup plus petite, est peut-être la plus ancienne encore active. L'islam ibadite est apparu seulement vingt ans après la mort de Mahomet en opposition au troisième calife. Les conflits avec les califes ultérieurs ont vu la secte poussée vers l'intérieur de l'Oman moderne. Les Ibadis ont finalement formé un imamat élu dans le pays. Bien que les érudits sunnites et chiites considèrent le groupe avec méfiance, leurs pratiques et croyances sont très similaires, même s'ils présentent des différences doctrinales avec les sunnites et les chiites. Les Ibadites ne constituent la communauté majoritaire qu'à Oman, cependant, il existe des communautés ibadites en Afrique du Nord."
 #Buddhism#
 ReligionBuddhism:0 "Bouddhisme"
 ReligionBuddhism_desc:0 "Le bouddhisme se compose de nombreuses traditions, pratiques et croyances différentes basées sur les enseignements du Bouddha, philosophe du cinquième siècle avant notre ère. Ses origines remontent à l'Inde, mais au cours des siècles suivants, elle s'est répandue à travers l'Asie. Les croyances bouddhistes visent souvent à surmonter la souffrance et un cycle sans fin de réincarnation en atteignant le bonheur spirituel à travers le Nirvana ou en suivant le chemin de la bouddhéité. Il existe plusieurs branches principales de la foi qui sont généralement divisées par espace géographique. Malgré la montée de différentes religions et le colonialisme de ces dernières années, le bouddhisme reste une religion très influente et populaire."
 
 ReligionBuddhismVajrayana:0 "Vajrayana (bouddhisme)"
 ReligionBuddhismMahayana:0 "Mahayana (bouddhisme)"
 ReligionBuddhismThereveda:0 "Theravada (bouddhisme)"
 ReligionBuddhismVajrayana_desc:0 "La tradition du Vajrayana a commencé avec les adeptes indiens médiévaux. Leurs textes principaux sont les Tantras bouddhistes. Le but spirituel des pratiquants du Vajrayana est d'atteindre l'illumination en poursuivant le chemin de la bouddhéité. Ils croient que les tantras constituent le moyen le plus efficace d'atteindre des objectifs spirituels. Il partage des similitudes avec les traditions Mahayana et utilise leurs textes. Cependant, contrairement à d'autres traditions bouddhistes, le Vajrayana n'exige pas de ses pratiquants qu'ils bannissent les sentiments négatifs comme l'avidité ou la haine, mais plutôt qu'ils les utilisent sur leur chemin vers l'illumination. Le Vajrayana est fermement implanté dans l'Himalaya, au Tibet, en Mongolie et dans certaines parties de l'est de la Russie."
 ReligionBuddhismMahayana_desc:0 "La plus grande tradition du bouddhisme, ses adeptes recherchent l'illumination à travers la voie du bodhisattva pour le bénéfice de toute l'humanité. Les adeptes du Mahayana croient que l'illumination est accessible à tous en une seule vie. La tradition trouve son origine au premier siècle de notre ère. Les adeptes du Mahayana ne sont liés à aucune doctrine, texte ou pratique spécifique. Ses enseignements sont suffisamment diversifiés pour pouvoir s'adapter à de nombreuses formes d'enseignement différentes. Elle est particulièrement répandue en Asie de l'Est, en Chine et au Vietnam."
 ReligionBuddhismThereveda_desc:0 "Theravada est la plus ancienne tradition du bouddhisme encore existante, dont les origines remontent au troisième siècle avant notre ère. Ses adeptes ont conservé leurs textes dans une collection appelée le Canon Pali qui est la plus ancienne et la seule collection d'enseignements de Bouddha dans son texte original qui existe aujourd'hui. Le pali, une langue indienne classique, est la langue sacrée de ses adeptes. Ses doctrines sont basées sur le Canon Pali et sont partagées avec les autres grandes sectes bouddhistes, bien que les adeptes du Theravada soulignent la nécessité pour celui qui cherche l'illumination d'être complètement purifié de ses impulsions ou émotions impures. Historiquement, la tradition s'est étendue au Sri Lanka, d'où les missionnaires ont voyagé à travers l'Asie du Sud-Est. Aujourd'hui, le Sri Lanka et la majeure partie de l'Asie du Sud-Est sont les principales terres des adeptes du Theravada."
 #Eastern#
 ReligionEastern:0 "Philosophie orientale"
 ReligionEastern_desc:0 "La philosophie orientale fait référence aux doctrines et aux idées développées au fil des siècles par des penseurs en Chine, au Japon et en Inde, entre autres. Ces différentes idées se sont mélangées et ont évolué au fil des interactions et ont joué un rôle majeur dans le développement des idées à travers le continent asiatique. L'avènement de la philosophie occidentale et du colonialisme a ouvertement remis en question ces idées et a forcé de nombreuses personnes à trouver des moyens d'adapter certaines de ces idées à leurs croyances traditionnelles."
 
 ReligionShinto:0 "Shinto (oriental)"
 ReligionTraditionalEastern:0 "Traditionnel oriental (oriental)"
 ReligionConfucian:0 "Confucianiste (oriental)"
 ReligionShinto_desc:0 "Le shintoïsme est souvent décrit comme la religion polythéiste du Japon, issue de diverses croyances et pratiques développées sur l'île depuis la préhistoire. Les adeptes du shintoïsme pratiquent diverses fêtes et traditions pour honorer leurs ancêtres et leur communauté. L'arrivée et la popularité du bouddhisme ont amené la société japonaise à syncrétiser les deux croyances pour les adapter au peuple. Cependant, au XIXe siècle, l'État japonais contrôlait ouvertement la religion et sa doctrine, supprimant toute influence bouddhiste sur le shintoïsme et rendant son observance obligatoire. Le gouvernement a cherché à utiliser le shintoïsme non pas comme une religion mais comme une philosophie pour favoriser l'unité nationale et le patriotisme. Le shintoïsme d'État a été dissous après la Seconde Guerre mondiale, mais de nombreux dirigeants japonais sont toujours attirés par la possibilité d'incorporer le shintoïsme pour revitaliser la nation."
 ReligionTraditionalEastern_desc:0 "Les religions orientales sont celles qui ont émergé en Asie de l'Est, du Sud et du Sud-Est. Elles s'appuient sur des périodes culturelles, philosophiques et temporelles différentes par rapport aux religions apparues en Occident ou en Afrique. En raison des populations et de la diversité de l'Asie, ces religions étaient généralement adaptables et répandues parmi de nombreuses populations. L'avènement récent de la religion et de la philosophie occidentales pendant les périodes d'industrialisation et de colonialisme a mis ces religions au défi de réagir et de s'adapter afin de préserver leur influence."
 ReligionConfucian_desc:0 "Le confucianisme est un système sophistiqué de comportement et de pensée qui trouve son origine dans les enseignements du philosophe chinois Confucius au VIe siècle avant notre ère. Les pratiquants du confucianisme recherchent l'unité de l'individu avec le Ciel. Cela ne peut être réalisé que lorsque l'individu comprend son humanité et construit une société et une famille stables. Pendant des siècles, les dynasties chinoises ont adopté le confucianisme et se sont fortement appuyées sur ses enseignements pour former la bureaucratie. Cependant, l'émergence de la puissance occidentale a finalement poussé le gouvernement à interdire aux étudiants d'étudier le confucianisme au profit des domaines occidentaux. Malgré son déclin en tant que religion d'État, ses principes philosophiques demeurent une influence majeure non seulement en Chine mais aussi en Asie de l'Est dans son ensemble."
 #Indo-Iranian#
 ReligionIndoiranian:0 "Indo-iranien"
 ReligionIndoiranian_desc:0 "On dit que le peuple indo-aryen aurait migré de la steppe vers le sous-continent indien il y a des milliers d'années. Ils ont apporté des langues et une identité culturelle qui s'étendaient à toutes les régions où ces gens se sont installés. Aujourd'hui, on peut considérer que leurs descendants et leur héritage linguistique relient les peuples de l'Asie centrale jusqu'à l'Iran et aussi loin à l'est que le Bengale et le Sri Lanka. Grâce à ces pratiques linguistiques et culturelles partagées, ils se sont également adaptés aux coutumes religieuses locales des régions où ils se sont installés."
 
 ReligionHindu:0 "Hindou (indo-iranien)"
 ReligionSikh:0 "Sikh (indo-iranien)"
 ReligionJain:0 "Jain (indo-iranien)"
 ReligionTraditionalIranian:0 "Iranien traditionnel (indo-iranien)"
 ReligionHindu_desc:0 "L'hindouisme en lui-même n'est pas une religion unique mais la synthèse de toutes les différentes religions et traditions de l'Inde ancienne. Les tribus védiques indo-aryennes ont joué un rôle majeur dans la synthèse hindoue et, au fil des siècles, la capacité de l'hindouisme à s'adapter et à synthétiser diverses croyances lui a permis de se développer, supplantant finalement le bouddhisme comme religion principale en Inde. L'avènement de l'Islam et plus tard du colonialisme occidental ont apporté de nouveaux défis à l'hindouisme, car ces religions représentaient des défis ouverts à la nature syncrétique de l'hindouisme. Un mouvement de réforme au XIXe siècle a conduit à un renouveau de l'hindouisme qui se poursuit encore aujourd'hui. Il a poussé la religion à se concentrer davantage sur l'idée que le divin peut être trouvé en chaque personne et a incité les hindous à aborder les problèmes sociaux avec une approche moderniste. Des populations hindoues peuvent être observées dans toute l'Asie, mais elles sont plus importantes en Asie du Sud, notamment en Inde."
 ReligionSikh_desc:0 "L'une des plus jeunes religions majeures de la planète, le sikhisme est apparu à la fin du XVe siècle en Asie du Sud. La religion est basée sur les enseignements de Guru Nanak et des neuf gourous qui lui ont succédé. Les croyances et les écritures sikhs se concentrent sur la foi et la méditation sur le nom du créateur unique, l'unité divine entre tous les peuples et la croyance qu'il faut vivre pour la justice, la paix et en tant que personne honnête. Parallèlement à ces croyances, il y a le rejet du fait que toute foi puisse véritablement connaître la vérité absolue. La religion est identifiée comme étant fortement influencée par les traditions religieuses hindoues et musulmanes et, malgré d'intenses persécutions, notamment de la part de l'empire moghol, elle a réussi à se développer grâce à la conversion des hindous et des musulmans. Ces périodes de persécution ont provoqué le développement d'une tradition guerrière sophistiquée au sein de la foi. Aujourd'hui, le sikhisme est répandu dans toute l'Asie du Sud, mais plus concentré au Pendjab."
 ReligionJain_desc:0 "Le jaïnisme est une ancienne religion indienne dont les adeptes étudient deux textes, les Agamas et les Paramagams. Les jaïns croient en plusieurs idées religieuses, notamment la non-violence, la conduite honnête, l'ascétisme et le non-attachement. Beaucoup de ses croyances sont liées à des éléments de l'hindouisme. Les adeptes du jaïnisme font également cinq voeux qui s'engagent à obéir aux principes de non-violence et d'ascèse, entre autres. Cette religion stricte et pacifiste compte plusieurs millions d'adeptes dévoués, principalement en Inde, bien que de petites communautés de Jaïns soient présentes dans toute l'Asie."
 ReligionTraditionalIranian_desc:0 "Le zoroastrisme fait partie des religions les plus anciennes de la planète. Ses adeptes croient aux enseignements de l'ancien prophète iranien Zoroastre. Les pratiquants de cette foi croient en une cosmologie dualiste du bien contre le mal qui aboutira à la défaite éventuelle du mal. Le texte principal de la foi est l'Avesta. La religion s'est développée sous le patronage des grandes dynasties perses de l'Antiquité. Alexandre le Grand a déplacé la foi mais l'Empire parthe allait la faire revivre. Cependant, l'avènement de l'Islam a vu le nombre de Zoroastriens diminuer considérablement en raison de la conversion et parfois de la suppression. Malgré cela, il existe encore des zoroastriens pratiquants en Iran et dans de petites communautés d'Asie du Sud."
 #Irreligious#
 ReligionNoreligion:0 "Non religieux"
 ReligionNoreligion_desc:0 "Tout au long de l'histoire, la plupart des peuples se sont retrouvés à croire ou à vivre selon une vision religieuse spécifique du monde. Cependant, les derniers siècles ont vu naître de nouvelles théories et philosophies scientifiques qui remettaient en question l'acceptation de toute identité religieuse. L'émergence des droits individuels, de la laïcité, des nouvelles technologies de voyage et de la connaissance d'autres croyances se sont tous combinés pour permettre aux individus de s'identifier comme non religieux. Cela a conduit au développement de diverses façons de regarder le monde ou de s'y connecter spirituellement."
 
 ReligionIrreligious:0 "Irréligieux (non religieux)"
 ReligionAtheist:0 "Athée (non religieux)"
 ReligionIrreligious_desc:0 "Cette vision du monde se compose d'individus indifférents à la religion en général ou d'individus qui croient que l'esprit humain est incapable de comprendre si une puissance supérieure existe ou non. Ces visions du monde sont enracinées dans la laïcité et dans les discussions qui y sont liées qui ont émergé au siècle des Lumières en Europe. Cependant, les chercheurs peuvent retrouver des éléments de ces idées dans des philosophes et des écrits de personnes du monde entier et de tous les temps. Les écrivains modernes suggèrent qu'ils ne pouvaient pas professer ouvertement leur compréhension du monde, craignant la façon dont la société dans son ensemble les traiterait."
 ReligionAtheist_desc:0 "L'athéisme est la non-croyance en aucune divinité. Tout au long de l'histoire, une telle croyance s'est souvent révélée très dangereuse et quiconque souscrivait à ce point de vue la cachait généralement. Bien que sa présence puisse être détectée dès l'Asie du Sud et la Grèce antiques. Le siècle des Lumières a fourni l'espace permettant aux athées d'émerger enfin et d'exprimer leurs croyances. L'avènement des progrès scientifiques et la croyance dans la certitude de la science ont également poussé de nombreuses personnes à accepter l'athéisme. Le communisme adhère fermement à l'athéisme et sa croissance ces derniers temps a vu l'athéisme largement promu par de nombreux États et partis communistes."
 #Minor/Esoteric#
 ReligionEsoteric:0 "Ésotérique"
 ReligionEsoteric_desc:0 "L'ésotérisme est l'étude d'une variété de textes religieux, philosophiques ou scientifiques pour rechercher des significations cachées ou plus profondes. Certains étudient ces textes ou philosophies pour trouver une signification cachée ou un lien entre eux. D'autres cherchent à trouver des preuves de la magie ou d'un monde au-delà de ce que l'on peut voir dans les sciences physiques. Enfin, les adeptes de ces philosophies cherchent à acquérir des connaissances supérieures ou à explorer des idées et des concepts ignorés par le courant dominant."
 
 ReligionStatist:0 "Statiste (ésotérique)"
 ReligionCultistSafe:0 "Culture cosmopolite (ésotérique)"
 ReligionCultistFatal:0 "Culture militante (ésotérique)"
 ReligionTraditionalAfrican:0 "Africain autochtone (ésotérique)"
 ReligionTraditionalAmerican:0 "Amérindien (ésotérique)"
 ReligionTraditionalOceanic:0 "Aborigène océanique (ésotérique)"
 ReligionMessianic:0 "Furry (ésotérique)"
 ReligionOther:0 "Mineure/Autre (Ésotérique)"
 ReligionStatist_desc:0 "En raison de la propagande gouvernementale et du contrôle de l'État, un certain nombre de citoyens d'un État donné considèrent leur leader politique comme une figure ayant une signification presque religieuse. L'idée qu'un chef politique soit vénéré ou considéré comme une figure céleste n'est pas nouvelle. En Asie de l'Est, cela a été largement pratiqué, notamment sous les dynasties impériales chinoise et japonaise. En Europe, de nombreux monarques ont légitimé leur règne comme la volonté de Dieu et leur présence comme ordonnée du ciel. Les progrès technologiques et l'avènement d'institutions étatiques modernes ont permis à de telles idées d'être propagées auprès des citoyens par de multiples voies."
 ReligionCultistSafe_desc:0 "Les sectes sont un groupe de personnes partageant un ensemble de croyances communes qui s'opposent à une autorité établie. Cette autorité peut être une religion dominante, une autorité politique ou des normes sociétales, entre autres possibilités. Les membres de ces sectes peuvent pratiquer des croyances ou des religions divergentes, mais ils ne propagent pas la violence contre leurs propres membres ni contre la société dans son ensemble. Même si de nombreuses communautés locales peuvent trouver ces groupes aliénants, voire bouleversants, leur absence de violence ou d'interférence avec la société garantit généralement que le groupe ne devient pas une préoccupation pour l'État ou la société dans son ensemble. Cependant, ils sont souvent isolés et s'ils deviennent violents, cela n'est généralement pas connu avant que leurs actions n'affectent la société dans son ensemble."
 ReligionCultistFatal_desc:0 "Les sectes sont un groupe de personnes partageant un ensemble de croyances communes qui s'opposent à une autorité établie. Cette autorité peut être une religion dominante, une autorité politique ou des normes sociétales, entre autres possibilités. Les membres de ces sectes pratiquent des croyances divergentes et propagent une certaine forme de violence, soit au sein du groupe, soit dans la société dans son ensemble. Cela conduit à des conflits avec les autorités locales et à une aliénation avec les communautés plus larges. Plus dangereux encore, les idées de ces sectes peuvent affecter des poches de population susceptibles d'agir selon ces enseignements, rendant ces types de sectes très dangereux pour la police et les autorités de l'État."
 ReligionTraditionalAfrican_desc:0 "Cela fait référence à un ensemble diversifié de croyances répandues à travers le continent. Parmi les croyances généralement associées aux religions africaines traditionnelles figurent, entre autres, la croyance dans la vénération des morts, la croyance aux esprits, à une puissance supérieure et aux formes de médecine traditionnelle. Les chercheurs pensent que bon nombre de ces croyances sont originaires d'Afrique subsaharienne et se sont répandues au fil des siècles à travers le continent. Parmi toutes les grandes religions pratiquées sur le continent, ces confessions sont les seules originaires du continent lui-même. La foi est souvent transmise par la tradition orale et non par les écritures écrites."
 ReligionTraditionalAmerican_desc:0 "Celles-ci font référence aux croyances traditionnelles et spiritualistes des peuples autochtones des Amériques. Ces croyances varient considérablement d'un hémisphère à l'autre, mais de nombreuses traditions croient au respect des ancêtres et à la recherche de l'harmonie avec la nature. Bien que l'avènement du colonialisme occidental ait entraîné des persécutions religieuses et des maladies qui ont ravagé les communautés autochtones, ces croyances se sont perpétuées jusqu'à nos jours. Les adeptes apprennent la foi non pas à travers les Écritures mais à travers la transmission verbale des connaissances d'une génération à l'autre."
 ReligionTraditionalOceanic_desc:0 "Les religions et traditions océaniennes reposent sur une cosmologie profonde et ancrées dans le rituel. Beaucoup associent la convivialité avec laquelle les premiers explorateurs étaient accueillis par les peuples de la région à ces rituels religieux qui appelaient souvent les adeptes à attendre de nouveaux arrivants. Sans doute une conséquence de la tradition maritime et des cultures insulaires de la région. Bien que les explorateurs aient apporté de nouvelles religions qui sont devenues populaires parmi la population, ces derniers temps ont vu les habitants raviver ou rejoindre les pratiques traditionnelles. Surtout les rituels."
 ReligionMessianic_desc:0 "Les religions centrées sur le Furry sont un groupe de croyances spirituelles qui s'alignent souvent étroitement sur les religions New Age, mais avec des liens avec la sous-culture Furry. Il existe une variété de doctrines spirituelles Furry, telles que les dénominations d'autres parents liées à Furry ou les modes de vie poilus quasi-religieux qui ont adopté un lien émotionnel/spirituel avec des animaux réels, fictifs ou symboliques. Une grande majorité de ce groupe est fortement cosmopolite, sociale et environnementaliste et accorde une grande valeur à l'art et à l'esthétique."
 ReligionOther_desc:0 "Il s'agit de traditions et de religions, souvent vieilles de plusieurs siècles, qui ont émergé au sein de petites communautés ou dans des espaces géographiques spécifiques. Souvent, l'isolement de ces communautés, dû soit à leur petite taille, soit à leurs limites géographiques, a permis à ces pratiques de perdurer sans obstacle de la part des religions plus répandues. À mesure que la technologie et les États deviennent plus sophistiqués, ces communautés seront probablement plus exposées aux nouvelles idées religieuses."
 
 
 ReligionChineseSalvationist:0 "Salutistes chinois"
 ReligionChineseSalvationist_desc:0 "Les religions salutistes chinoises font référence à une myriade de sectes religieuses axées sur les idées de pureté morale et de salut en suivant les enseignements d'une personne charismatique. Beaucoup considèrent ces sectes comme la quatrième grande tradition religieuse historique chinoise. Les sectes salutistes sont présentes dans toute la Chine, mais surtout dans le nord et le nord-est. Bien que ces sectes soient souvent confrontées à la répression de l'État, ces mouvements continuent de prospérer et de nouvelles sectes apparaissent presque chaque décennie. L'État chinois s'est toujours inquiété du fait qu'un chef de secte salutiste particulièrement ambitieux puisse être une source de rébellion et de troubles."
 ReligionZionistChristian:0 "Chrétiens sionistes"
 ReligionZionistChristian_desc:0 "Les églises chrétiennes sionistes ont proliféré en Afrique australe au début du XXe siècle. La foi est particulièrement populaire parmi la population africaine qui a combiné les croyances et pratiques chrétiennes avec les religions africaines traditionnelles. La guérison par la foi et les révélations spirituelles sont un élément clé des praticiens. Les églises se distinguent par leurs cérémonies et leurs rituels symboliques, impliquant souvent des vêtements spéciaux et des baptêmes fluviaux. Dans certaines églises, de grands services en plein air impliquant de la musique et de la danse africaines sont courants. À mesure que la foi s'enracine davantage dans les communautés africaines, les analystes prédisent qu'elle pourrait éventuellement devenir la principale dénomination chrétienne pratiquée en Afrique australe."
 ReligionMessianicChristian:0 "Cette religion fondée au Congo belge s'appuie sur les enseignements de Simon Kimbangu qui fonda son église en 1921. Elle est l'une des rares églises indépendantes fondées par des Africains. Kimbangu, un enseignant baptiste, a lancé son église et son mouvement de masse après être devenu célèbre pour sa capacité à guérir miraculeusement les gens et son interprétation de la Bible. Bien qu'il ait été arrêté par les autorités belges, son église perdure et est l'une des plus grandes églises du Congo. L'Église a une hiérarchie étendue et prêche un ensemble de croyances puritaines comprenant le rejet de la violence, de la danse, du tabac, de l'alcool et de la polygamie. Malgré les efforts des autorités pour supprimer l'Église, celle-ci continue de croître et offre une structure stricte que de nombreux Centrafricains admirent."

