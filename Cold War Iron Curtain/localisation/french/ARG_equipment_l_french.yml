 ARG_mechanized_marine_equipment_1:0 "Buffle d'eau LVT-4"
 ARG_mechanized_marine_equipment_1_short:0 "LVT-4"
 ARG_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule d'atterrissage amphibie conçu par Ford Machinery Corporation au début des années 40. Le LVTP-4 a été utilisé pendant la Seconde Guerre mondiale, en Corée et au Vietnam. Il utilise un moteur radial à 7 cylindres W-670-9A et peut parcourir jusqu'à 75 miles dans l'eau à 7 mph. Evolution du LVTP-1, le LVTP-4 est capable de parcourir des distances incroyables, bien qu'à des vitesses lentes. Si vous devez traverser 70 milles d'eau et disposer d'environ 10 heures pour le faire, le LVTP-4 est votre véhicule de choix. Il est capable de transporter des troupes ou des véhicules. "
 ARG_mechanized_marine_equipment_2:0 "LVT(A)-5"
 ARG_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 ARG_mechanized_marine_equipment_2_desc:0 "LVT(A)-4 avec une tourelle motorisée et un gyrostabilisateur pour l'obusier. Certains ont été améliorés à la fin des années 1940 en modifiant la configuration du blindage."
 ARG_mechanized_marine_equipment_3:0 "AAVP-7"
 ARG_mechanized_marine_equipment_3_short:0 "AAVP-7"
 ARG_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 ou AAVP-7 est un APC amphibie conçu en 1972 par la Food Machinery Corporation. Des conflits ont eu lieu aux Malouines, à la Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 utilise un moteur 8V-53T et peut parcourir 23 miles à 8,2 mph dans l'eau. Plus particulièrement, le LVTP-7 est capable de voyager dans un état de mer 5, qui est classé comme « agité » avec un gonflement de mer moyen à élevé, ce qui le rend excellent pour faire face à des conditions météorologiques difficiles que le LVTP-5. De plus, il est bien plus blindé que le LVTP-5. Parce qu'il peut voyager de manière impressionnante dans un état de mer 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il comporte également des disperseurs de fumée."
 ARG_mechanized_marine_equipment_4:0 "MECATROL AAVP-7 (Modification locale)"
 ARG_mechanized_marine_equipment_4_short:0 "AAVP-7 (G)"
 ARG_mechanized_marine_equipment_4_desc:0 "Le Commandement de l'infanterie navale a initialement reçu plusieurs véhicules composés de LVTP-7 et de LVTR, plusieurs d'entre eux ont ensuite été améliorés localement par MECATROL avec des moteurs diesel Caterpillar C7 et des modifications mineures des trains de roulement et d'autres composants."

 ARG_motorized_equipment_1:0 "GMC CCKW 6x6"
 ARG_motorized_equipment_1_short:0 "CCKW 6x6"
 ARG_motorized_equipment_2:0 "RÉO M35 6x6"
 ARG_motorized_equipment_2_short:0 "M35 6x6"
 ARG_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 ARG_motorized_equipment_3:0 "AM Général M809 6x6"
 ARG_motorized_equipment_3_short:0 "M809 6x6"
 ARG_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 ARG_motorized_equipment_4:0 "AM Général M939 6x6"
 ARG_motorized_equipment_4_short:0 "M939 6x6"
 ARG_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 ARG_motorized_equipment_5:0 "UNIMOG U1300L"
 ARG_motorized_equipment_5_short:0 "UNIMOG U1300L"
 ARG_motorized_equipment_5_desc:0 "Les Unimogs sont disponibles avec des empattements courts pour les opérations de transport d'outils ou des empattements longs pour les opérations de transport de marchandises tout-terrain. Actuellement, Daimler propose la série lourde 437.4 et la série de porte-outils 405. Après avoir acheté l'Unimog traditionnel de Boehringer en 1951, Daimler-Benz a commencé à fabriquer l'Unimog série S au milieu des années 1950 et a ajouté des séries légères, moyennes et lourdes à la gamme de modèles dans les années 1960 et 1970, avant de réduire successivement les modèles disponibles au cours des années 1990 pour aboutir au porte-outils moderne et à la série lourde aujourd'hui."

