 ARG_jet_multirole_equipment_1:0 "FMA IAe 27 Pulqui"
 ARG_jet_multirole_equipment_1_short:0 "IAe 27 Pulquí"
 ARG_jet_multirole_equipment_1_desc:0 "L'IAe 27 Pulqui I était un avion à réaction argentin conçu à l'« Instituto Aerotecnico » (Institut aérotechnique) en 1946. Un seul prototype fut achevé ; des performances insatisfaisantes ont conduit au remplacement de l'avion par une conception ultérieure."
 ARG_jet_multirole_equipment_2:0 "FMA IAe 33 Pulqui II"
 ARG_jet_multirole_equipment_2_short:0 "IAe 33 Pulqui II"
 ARG_jet_multirole_equipment_2_desc:0 "Le FMA IAe 33 Pulqui II était un avion de combat à réaction conçu par Kurt Tank à la fin des années 1940 en Argentine, sous le gouvernement Perón, et construit par la Fábrica Militar de Aviones (FMA). Incarnant de nombreux éléments de conception du Focke-Wulf Ta 183 de guerre, un projet de chasseur non réalisé, la FMA envisageait l'IAe 33 Pulqui II comme le successeur du Gloster Meteor F4 d'après-guerre en service dans la Fuerza Aérea Argentina."
 ARG_jet_multirole_equipment_3:0 "Sabre nord-américain F-86F"
 ARG_jet_multirole_equipment_3_short:0 "Sabre F-86F"
 ARG_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un contrôle à pleine puissance avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche qui étaient encore conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur.) Les Sabre F avaient une agilité à grande vitesse bien améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 ARG_jet_multirole_equipment_4:0 "Sabre nord-américain F-86F-30-NA"
 ARG_jet_multirole_equipment_4_short:0 "Sabre F-86F-30-NA"
 ARG_jet_multirole_equipment_4_desc:0 "D'autres améliorations du sabre F-86F pour le rendre plus efficace au combat contre les nouveaux avions équipés de postcombustion en les armant de points d'emport et de rails pour lancer des missiles AIM-9B Sidewinders."
