 ARG_mechanized_equipment_1:0 "Support universel"
 ARG_mechanized_equipment_1_short:0 "Support universel"
 ARG_mechanized_equipment_2:0 "Demi-piste M3"
 ARG_mechanized_equipment_2_short:0 "Demi-piste M3"
 ARG_mechanized_equipment_2_desc:0 "Le half-track M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et pendant la guerre froide. Dérivée de la voiture semi-chenillée M2, la M3 a été largement produite, avec environ 15 000 M3 standard et plus de 38 000 variantes fabriquées. À l'époque de la guerre froide, le véhicule a été utilisé par divers opérateurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, restant en service jusqu'au milieu des années 1990. Au Mexique, ils sont toujours utilisés en 2019."
 ARG_mechanized_equipment_3:0 "Demi-piste M3A1"
 ARG_mechanized_equipment_3_short:0 "Demi-piste M3A1"
 ARG_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 doté du support d'anneau de mitrailleuse M49 amélioré sur le siège avant droit. Entre 1942 et 1943, tous les half-tracks M3 (standard et A1) furent continuellement améliorés. Ces améliorations comprenaient un certain nombre d'améliorations de la transmission, du moteur et du rangement"
