 #Argentina ARG
 ARG_infantry_equipment_0:0 "Fusil américain, calibre.30, M1"
 ARG_infantry_equipment_0_short:0 "M1 Garand"
 ARG_infantry_equipment_0_desc:0 "Le M1 Garand est une arme grandiose conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre.30 qui a été largement utilisé pendant la Seconde Guerre mondiale. C'est l'une des premières armes à utiliser un système de rechargement au gaz pour recomposer une nouvelle cartouche après le tir. Il utilise des clips chargés depuis le haut du fusil et peut être équipé d'accessoires dont la grenade à fusil antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu symbolique et est toujours utilisé par les équipes de forage modernes aux États-Unis."

 ARG_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 ARG_infantry_equipment_1_short:0 "FN FAL"
 ARG_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 ARG_infantry_equipment_2:0 "Fabricaciones Militares Fusil Automático Liviano"
 ARG_infantry_equipment_2_short:0 "FM FAL"
 ARG_infantry_equipment_2_desc:0 "Les FAL argentins ont été produits par l'arsenal FM (Fabricaciones Militares), propriété du gouvernement, à la Fábrica Militar de Armas Portátiles \"Domingo Matheu\" (FMAP \"DM\") à Rosario. L'acronyme « FAL » a été conservé, sa traduction étant « Fusil Automático Liviano », (Fusil Automatique Léger)."

 ARG_infantry_equipment_3:0 "Fabricación Militares Fusil Automático Liviano Para"
 ARG_infantry_equipment_3_short:0 "FM FAL Par"
 ARG_infantry_equipment_3_desc:0 "Les FAL argentins ont été produits par l'arsenal FM (Fabricaciones Militares), propriété du gouvernement, à la Fábrica Militar de Armas Portátiles \"Domingo Matheu\" (FMAP \"DM\") à Rosario. L'acronyme « FAL » a été conservé, sa traduction étant « Fusil Automático Liviano », (Fusil Automatique Léger)."

 ARG_infantry_equipment_4:0 "FMAP-DM Fusil Argentino Modèle Asalto M5"
 ARG_infantry_equipment_4_short:0 "FMAP-DM FAMA"
 ARG_infantry_equipment_4_desc:0 "Fusil Argentino Modelo Asalto (Modèle de fusil d'assaut argentin), il s'agit de la version fusil d'assaut, utilisant des munitions de 7,62 mm. Il a une cadence de tir de 700 coups par minute et une longueur totale de 591 mm. Capable d'incorporer des viseurs holographiques, une lampe de poche laser, une poignée tactique ou un lance-grenades de 40 mm."

