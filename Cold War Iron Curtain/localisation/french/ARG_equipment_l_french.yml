 ARG_jet_CAS_equipment_1_short:0 "IAe 30 Pallavicino II"
 ARG_jet_CAS_equipment_6:0 "Dassault Mirage 5P"
 ARG_jet_CAS_equipment_6_short:0 "Mirage5P"
 ARG_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France et dans plusieurs autres pays sous licence. Il est dérivé du populaire chasseur Mirage III de Dassault."
 ARG_jet_CAS_equipment_7:0 "Douglas A-4P Skyhawk"
 ARG_jet_CAS_equipment_7_short:0 "A-4P Skyhawk"
 ARG_jet_CAS_equipment_7_desc:0 "Version terrestre pour l'armée de l'air argentine utilisée dans le rôle de frappe."
 ARG_jet_CAS_equipment_8:0 "Lockheed Martin A-4AR Fightinghawk"
 ARG_jet_CAS_equipment_8_short:0 "A-4AR Faucon de combat"
 ARG_jet_CAS_equipment_8_desc:0 "Le Lockheed Martin A-4AR Fightinghawk est une mise à niveau majeure de l'avion d'attaque McDonnell Douglas A-4M Skyhawk développé pour l'armée de l'air argentine, entré en service en 1998. Le programme a été nommé Fightinghawk en reconnaissance du F-16 Fighting Falcon, qui était à l'origine de sa nouvelle avionique."

 ARG_jet_light_equipment_1:0 "IAe 22DL"
 ARG_jet_light_equipment_1_short:0 "IAe 22DL"
 ARG_jet_light_equipment_1_desc:0 "L'I.Ae. 22 DL était un avion d'entraînement avancé argentin conçu par l'Instituto Aerotecnico (Institut aérotechnique) en 1943, avec une structure en bois qui ressemblait au NA-16 nord-américain. "
 ARG_jet_light_equipment_2:0 "Morane-Saulnier MS.760 Paris"
 ARG_jet_light_equipment_2_short:0 "MS.760 Paris"
 ARG_jet_light_equipment_2_desc:0 "Le Paris était basé sur un avion d'entraînement proposé précédemment, le MS.755 Fleuret. Suite à l'échec du choix du Fleuret par l'armée de l'air française, Morane-Saulnier a choisi de développer le modèle en avion de liaison et en avion d'affaires compact. La principale différence entre les deux modèles était la disposition modifiée des sièges, le cockpit à deux places côte à côte d'origine a été modifié pour permettre l'ajout d'une autre rangée de deux sièges pour accueillir les passagers. Le Paris a conservé les caractéristiques de vol du Fleuret ainsi que la possibilité d'installer des armements, ce qui a conservé son potentiel d'utilisation comme entraîneur militaire ainsi que pour l'aviation civile. Le 29 juillet 1954, le prototype effectua le vol inaugural du type."
 ARG_jet_light_equipment_3:0 "Aermacchi MB-326G"
 ARG_jet_light_equipment_3_short:0 "MB-326G"
 ARG_jet_light_equipment_3_desc:0 "Un certain nombre d'avions MB-326, ainsi que le MB-339, plus moderne, formaient l'équipement de la 1 Escuadrilla de Ataque de la marine argentine en 1982, lorsque l'Argentine a envahi les îles Falkland. Un certain nombre de MB-326 ont été déployés dans des bases le long de la côte argentine immédiatement après l'invasion argentine, mais sont rapidement retournés à la base de l'escadron à Punta Indio."
 ARG_jet_light_equipment_4:0 "FMA IA 58 Pucará"
 ARG_jet_light_equipment_4_short:0 "IA 58 Pucara"
 ARG_jet_light_equipment_4_desc:0 "Le FMA IA 58 Pucará est un avion argentin d'attaque au sol et de contre-insurrection (COIN) fabriqué par la Fábrica Militar de Aviones. Il s'agit d'un monoplan entièrement métallique bi-turbopropulseur à ailes basses avec train d'atterrissage rétractable, capable d'opérer à partir de pistes non préparées lorsque cela est nécessaire sur le plan opérationnel. Le type a été utilisé pendant la guerre des Malouines et la guerre civile du Sri Lanka."
 ARG_jet_light_equipment_5:0 "FMA IA-63 Pampa"
 ARG_jet_light_equipment_5_short:0 "IA-63 Pampa"
 ARG_jet_light_equipment_5_desc:0 "L'IA-63 Pampa est un avion d'entraînement à réaction avancé doté de capacités de combat, produit en Argentine par Fabrica Militar de Aviones (FMA) avec l'aide de Dornier d'Allemagne."

 ARG_recon_equipment_0:0 "FMA AeMOe.2"
 ARG_recon_equipment_0_short:0 "AeMOe.2"
 ARG_recon_equipment_0_desc:0 "Six AeMOe.1 suivirent, pour la formation des équipages au rôle d'observation, de conception généralement similaire mais dotés d'un capot moteur NACA, puis la version définitive AeMOe.2 apparut en 1937 avec un empennage encore plus raffiné, dont 61 exemplaires furent construits."
 ARG_jet_recon_equipment_0:0 "DINFIA IA 46 Ranquel"
 ARG_jet_recon_equipment_0_short:0 "IA 46 Ranquel"
 ARG_jet_recon_equipment_0_desc:0 "Le DINFIA IA 46 Ranquel, IA 46 Super Ranquel et IA 51 Tehuelche étaient des avions utilitaires argentins développés à la fin des années 1950."
 ARG_jet_recon_equipment_1:0 "Dassault Mirage IIIEAR"
 ARG_jet_recon_equipment_1_short:0 "Mirage IIIEAR"
 ARG_jet_recon_equipment_1_desc:0 "Variante de reconnaissance du Dassault Mirage IIIEA argentin, armé de caméras plutôt que de canons et de missiles."
