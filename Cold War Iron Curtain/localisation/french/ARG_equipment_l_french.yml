 #CV
 ARG_cv_CAS_equipment_1:0 "Canard Grumman J2F"
 ARG_cv_CAS_equipment_1_short:0 "Canard J2F"
 ARG_cv_CAS_equipment_1_desc:0 "Le Grumman J2F Duck (désignation de la société G-15) est un biplan amphibie monomoteur américain. Il a été utilisé par chaque branche majeure des forces armées américaines du milieu des années 1930 jusqu'à juste après la Seconde Guerre mondiale, principalement à des fins utilitaires et de sauvetage aéro-maritime. Il a également été utilisé par la marine argentine, qui a pris livraison de son premier exemplaire en 1937. Après la guerre, les J2F Ducks ont servi auprès d'opérateurs civils indépendants, ainsi que dans les forces armées de Colombie et du Mexique. "

 ARG_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 ARG_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 ARG_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un engin d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré son châssis plus petit. Servant dans plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a connu de nombreuses modifications et modernisations au cours de ses plus de 60 années de service et continue de servir dans de nombreux pays jusqu'à ce jour. Son surnom est « Skyhawk »."
 ARG_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 ARG_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"

 ARG_cv_jet_CAS_equipment_9:0 "Dassault-Breguet Super Étendard"
 ARG_cv_jet_CAS_equipment_9_short:0 "Super Étendard"

 ARG_cv_fighter_equipment_2:0 "Vought F4U-5 Corsaire"
 ARG_cv_fighter_equipment_2_short:0 "Corsaire F4U-5"
 ARG_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 ARG_cv_fighter_equipment_3:0 "Vought F4U-5N Corsaire"
 ARG_cv_fighter_equipment_3_short:0 "Corsaire F4U-5N"
 ARG_cv_fighter_equipment_3_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."

 ARG_cv_jet_multirole_equipment_1:0 "Vought F4U-5NL Corsaire"
 ARG_cv_jet_multirole_equipment_1_short:0 "Corsaire F4U-5NL"
 ARG_cv_jet_multirole_equipment_1_desc:0 "Le Vought F4U Corsair est un avion de combat américain qui a servi principalement pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair fut bientôt très demandé ; des contrats de production supplémentaires furent accordés à Goodyear, dont les Corsairs furent désignés FG, et Brewster, désignés F3A. Le Corsair fut conçu et exploité comme un avion embarqué et entra en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 ARG_cv_jet_multirole_equipment_2:0 "Grumman F9F Panthère"
 ARG_cv_jet_multirole_equipment_2_short:0 "Panthère F9F"
 ARG_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été conçu à l'origine comme un avion à réaction à aile droite introduit en 1949. L'un des premiers avions à réaction capables de porter un porte-avions utilisé dans la marine américaine, il était le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première destruction aérienne d'un chasseur de la marine américaine pendant la guerre. Son châssis robuste permettait à l'engin de soutenir des opérations d'attaque au sol, même face aux tirs des AA. Le F9F (plus tard rebaptisé F-9) servira également avec les Blue Angels, devenant ainsi le premier avion à réaction utilisé par l'équipe. Suivant la tradition de Grumman consistant à donner aux avions le nom de grands félins, l'avion est connu sous le nom de « Panthère »."
 ARG_cv_jet_multirole_equipment_3:0 "Grumman F9F Cougar"
 ARG_cv_jet_multirole_equipment_3_short:0 "F9F Cougar"
 ARG_cv_jet_multirole_equipment_3_desc:0 "Le F9F a été conçu à l'origine comme un avion à réaction à aile droite introduit en 1949. L'un des premiers avions à réaction capables de porter un porte-avions utilisé dans la marine américaine, il était le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première destruction aérienne d'un chasseur de la marine américaine pendant la guerre. Son châssis robuste permettait à l'engin de soutenir des opérations d'attaque au sol, même face aux tirs des AA. Le F9F (plus tard rebaptisé F-9) servira également avec les Blue Angels, devenant ainsi le premier avion à réaction utilisé par l'équipe. Suivant la tradition de Grumman consistant à donner aux avions le nom de grands félins, l'avion est connu sous le nom de « Panthère »."
