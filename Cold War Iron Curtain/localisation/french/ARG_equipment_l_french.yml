 #scout
 ARG_scout_helicopter_equipment_1:0 "Aérospatiale SA.315B Lama"
 ARG_scout_helicopter_equipment_1_short:0 "SA.315B Lama"
 ARG_scout_helicopter_equipment_2:0 "Agusta-Bell AB-206 JetRanger"
 ARG_scout_helicopter_equipment_2_short:0 "AB-206"
 ARG_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à 4 places dont la particularité remarquable était que, malgré la présence de 2 pilotes, les commandes du pilote sur le siège gauche pouvaient être retirées pour transporter un passager à l'avant. Pendant la guerre du Vietnam, son armement était un seul minigun M134 ou un lance-grenades M129. Après la guerre, l'OH-58 recevra de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un équipement de dérapage élevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) participeraient aux opérations antidrogue RAID de la Garde nationale militaire."
