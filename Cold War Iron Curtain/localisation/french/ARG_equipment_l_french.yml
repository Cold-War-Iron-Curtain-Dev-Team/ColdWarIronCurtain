 #Cargo
 ARG_cargo_helicopter_equipment_2:0 "Boeing CH-47C Chinook"
 ARG_cargo_helicopter_equipment_2_short:0 "CH-47C Chinook"
 ARG_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à rotor tandem qui compte parmi les hélicoptères de transport les plus lourds de l'Ouest. Remplaçant le CH-37 Mojave, le CH-47 possède plusieurs moyens de chargement de diverses marchandises, notamment plusieurs portes à travers le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. C'était également l'hélicoptère le plus rapide parmi ses contemporains lors de son introduction en 1962, et il est toujours considéré actuellement comme l'un des hélicoptères les plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État de Washington actuel."
 
 #Naval
 ARG_naval_helicopter_equipment_1:0 "Sikorsky S-51"
 ARG_naval_helicopter_equipment_1_short:0 "Sikorsky S-51"
 ARG_naval_helicopter_equipment_2:0 "Aérospatiale SA316 Alouette III ASW"
 ARG_naval_helicopter_equipment_2_short:0 "Alouette III ASW"

 ARG_naval_helicopter_equipment_4:0 "Sikorsky SH-3 Sea King"
 ARG_naval_helicopter_equipment_4_short:0 "SH-3 Sea King"
 ARG_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller à la fois depuis la terre et depuis la mer. Il fut également, aux côtés de son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. En plus des fonctions ASW, le SH-3 a également joué des rôles de recherche et de sauvetage (SAR), de transport, d'évacuation sanitaire et d'alerte précoce aéroportée (AEW), un certain nombre d'hélicoptères étant utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pour cette raison qu'il a gagné le surnom de « Sea King », l'hélicoptère le plus polyvalent au monde."
 ARG_naval_helicopter_equipment_5:0 "Westland Lynx Mk.23 "
 ARG_naval_helicopter_equipment_5_short:0 "Lynx Mk.23"
