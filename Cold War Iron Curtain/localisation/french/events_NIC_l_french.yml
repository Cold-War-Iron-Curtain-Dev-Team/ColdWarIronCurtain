l_french:
 nic.5.d:0 "Le café fait partie des exportations les plus nombreuses du Nicaragua. Le café a été cultivé pour la première fois dans le pays comme curiosité au début du 19e siècle. À la fin des années 1840, cependant, alors que la popularité du café augmentait en Amérique du Nord et en Europe, la culture commerciale du café commença dans la région de Managua. Au début des années 1850, les passagers traversant le Nicaragua en route vers la Californie recevaient de grandes quantités de café nicaraguayen. Le boom du café en Amérique centrale battait son plein au Nicaragua dans les années 1870, et de vastes zones de l'ouest du Nicaragua furent défrichées et plantées de caféiers.\n\nContrairement à l'élevage traditionnel ou à l'agriculture de subsistance, la production de café nécessite des capitaux importants et de vastes réserves de main-d'oeuvre. Des lois ont donc été votées pour encourager les investissements étrangers et permettre l'acquisition facile de terrains. Les bénéfices de la production de café vont à l'étranger ou à un petit nombre de propriétaires fonciers. Les taxes sur le café sont quasiment inexistantes."
 nic.6.d:0 "Certains civils, plusieurs militaires nicaraguayens exilés et d'autres militaires actifs, en désaccord avec le président Somoza Garcia, ont planifié un coup d'État. Les rumeurs disent que même Emiliano Chamorro y est pour quelque chose.\n\n Le [GetDate], une embuscade a été tendue sur la route du sud de Managua dans le but de capturer le président Somoza García, alors qu'il se rendait à l'hacienda de Montélimar. Elle a été planifiée et organisée par des officiers dissidents de la Garde nationale, accompagnés d'un groupe de jeunes conservateurs et d'un ou deux libéraux, qui rejetaient le régime de Somoza. Quand la capitale entend parler du coup d'État, elle entend ça..."
 nic.7.d:0 "Le président Somoza vient de m'informer que deux membres de la Garde nationale ont été tués, dont un blessé aujourd'hui, lors d'une tentative d'assassinat. Trois camions d'armes et de munitions ont été introduits clandestinement du Costa Rica en toute connaissance de cause des responsables costaricains, en particulier le colonel Herrera de la Garde civile, a affirmé le président. Hier soir, on a tenté de lui tendre une embuscade alors qu'il quittait la réception de ma maison, mais il nous a alors dit qu'il avait été prévenu et que les gardes avaient chassé les hommes du réservoir d'eau de la ville voisine. Aujourd'hui, deux gardes ont tenté d'arrêter un camion suspect sur la route de Montélimar mais les occupants ont ouvert le feu. Un policier à moto s'est joint à la mêlée et lui et un garde ont été tués et l'autre garde blessé. Un enfant qui passait par là a également été tué. Les assaillants ont pris la fuite mais semblent être encerclés. Somoza a dit au colonel Layton qu'il y avait quatorze hommes dans le camion. Le colonel Rogers dit que l'armée de l'air a repéré un camion abandonné contenant des munitions et qu'il a appris que des hommes en jeep avaient été arrêtés devant la porte de ma résidence la nuit dernière.\n\nLe président a dit à Layton qu'il déclarait la loi martiale. Le président revendique le général Chamorro derrière le complot. Chamorro ne s'est pas présenté à ma réception hier soir, ce qui était inhabituel, Somoza l'a alors commenté."
 nic.8.d:0 "Le plan a été défait et les personnes impliquées ont été capturées et par la suite, la plupart de ces prisonniers ont été emmenés dans certaines plantations de café du département de Carazo et cruellement exécutés, quelques-uns ont été laissés en vie, emmenés dans les prisons militaires de la Loma de Tiscapa, plus tard jugés en Conseil de Guerre, ceux sommairement exécutés ont été partiellement brûlés et enterrés dans une fosse commune.\n\nUn petit groupe de rebelles qui avaient réussi à échapper au piège tendu par la Garde nationale et qui se dirigeaient vers la frontière costaricienne à bord d'un camion, ont été capturés à Cuatro Esquinas et tous ont été exécutés par les troupes commandées par le capitaine Agustín Peralta Ruiz.\n\nFace à tant de répression, beaucoup se sont exilés directement ou se sont réfugiés dans une ambassade ; les pactes furent rompus et le général Emiliano Chamorro ordonna le retrait des députés et sénateurs conservateurs du Congrès national, mais tous ne lui prêtèrent pas attention."
 nic.9.d:0 "L'âge d'Anastasio Somoza Garcia a connu une fin soudaine lorsqu'il a été tué lors d'un coup d'État perpétré par des militaires et des civils mécontents. A sa place s'élève un ancien officier de la Garde nationale Adolfo Baez Bone, à la tête du Frente de Salvación de Nicaragua. Il a promis de faire du Nicaragua une véritable démocratie. De nombreux anciens partisans de Somoza quittent déjà le pays."
 nic.10.d:0 ""
 nic.11.d:0 "José Figueres Ferrer, un socialiste modéré, a été élu président du Costa Rica en 1953. Notre président Anastasio Somoza est certain d'avoir participé à un complot visant à l'assassiner avec l'aide de la Légion caribéenne (la légion avait soutenu Figueres lors de son élection) ; Somoza a rapidement prévu de riposter et a décidé de contacter Rafael Calderon Guardia, un ancien président mécontent du Costa Rica, qui dirigerait une bande de rebelles au sud du Nicaragua jusqu'au Costa Rica. Heureusement pour nous, Calderon est d'accord avec le plan et promet un paiement adéquat si nous réussissons."
 nic.12.d:0 "Nouvelles urgentes depuis notre frontière nicaraguayenne : les forces fidèles à l'ancien président mécontent Rafael Calderón ont traversé la frontière et ont commencé une invasion. Les rebelles se sont déjà emparés de la ville frontalière de Villa Quesada. Pendant ce temps, notre gouvernement mobilise ses forces de police, la Garde civile et des groupes paramilitaires de partisans du gouvernement pour affronter les envahisseurs. Nous devons demander à l'Organisation des États américains d'intervenir avant qu'il ne soit trop tard."
 nic.13.d:0 "L'Organisation des États américains a constaté que le gouvernement nicaraguayen soutenait les rebelles et dès que cela a été annoncé, le gouvernement nicaraguayen a mis fin à son soutien aux rebelles. Les États-Unis ont vendu quatre avions de combat au Costa Rica, tandis que les rebelles étaient submergés par les forces gouvernementales soutenues par la population. Après de violents combats dans une poignée de villes du nord, les rebelles ont été chassés du Costa Rica. José Figueres a accusé la CIA d'avoir secrètement aidé à l'invasion du Nicaragua en envoyant des pilotes et des sorties pour attaquer secrètement le Costa Rica, soumettant notamment au moins 11 villages à des tirs de mitrailleuses."
 nic.14.d:0 "L'Organisation des États Américains n'a pas trouvé de financement pour les rebelles calderonistes. Après de violents combats dans une poignée de villes du nord, les rebelles ont pu lancer un soulèvement contre Figures. En conséquence, Figures a démissionné et Rafael Calderón a assumé la présidence."
 nic.15.d:0 "Luis Somoza Debayle a officialisé son emprise sur la présidence par des élections frauduleuses en février 1957 qui ont été boycottées par toute l'opposition, à l'exception du Parti nationaliste conservateur fantoche. Le Parti social-chrétien a été créé en réaction à ces élections et a reçu le soutien de jeunes conservateurs mécontents de l'incapacité de leur parti à avoir un impact politique sur la dictature."
 nic.16.d:0 "Au milieu de l'ascension de Luis Somoza, à l'été 1957, Luis Somoza promulgue un décret d'amnistie large et inconditionnelle. La période couverte par ce décret d'amnistie s'étend de 1950 jusqu'à la date de sa publication dans La Gaceta, le journal officiel de l'État. Il met beaucoup l'accent sur les événements de 1954 et ne mentionne pas les événements tragiques de 1956, liés à l'assassinat de son père, mais comme il s'étend jusqu'au jour où ce décret d'amnistie est promulgué, Luis Somoza amnistiait également les exécuteurs testamentaires et tous ceux qui pourraient être impliqués et tous les prisonniers et exilés, coupables et innocents dans la mort de Somoza Garcia, ainsi que ceux impliqués dans les tortures et les morts ultérieures."
 nic.17.d:0 "Malgré les nombreuses réformes de Luis Somoza, une opposition saisissante demeure. Avec le triomphe de Fidel Castros à Cuba et ses efforts dévoués pour exporter sa révolution, son acte a stimulé le souci de beaucoup de suivre cette odyssée, y compris ceux ici au Nicaragua.\nDans les plaines d'Olama, un avion en provenance de Punta Llorona, au Costa Rica, a atterri avec 45 insurgés armés, désireux de renverser le gouvernement de Luis Somoza. Un autre groupe a débarqué à Mollejones, dans la vallée du Chontal, près de Santo Tomás. Les combattants appartiennent à des groupes de la bourgeoisie nicaraguayenne, aux côtés des rebelles cubains.\nComme si cela ne suffisait pas, les forces expéditionnaires d'El Chaparral, dirigées depuis Cuba par Che Guevara, envahissent également la région. En conséquence, les étudiants, principalement à Leon, organisent de grandes manifestations."
 
 
 nicr.1.d:0 "Le Nicaragua vient de vivre une révolution. D'après ce que l'on sait, un opposant à Anastasio Somoza Garcia a lancé un coup d'État contre lui, au cours duquel il a été tué. Le nouveau leader est un ancien officier de la Garde nationale, Adolfo Baez Bone. Il nous a assuré que cela n'affecterait pas nos bonnes relations."
 nicr.2.d:0 "Aujourd'hui est le jour de nos élections véritablement libres et équitables. Il est contesté entre le Parti conservateur et le Parti libéral indépendant.\nLe Partido Conservador est le plus ancien parti existant au Nicaragua. Elle a été fondée au XIXe siècle, alors que le Nicaragua s'établissait en tant que république indépendante, par des membres de l'élite de Grenade. Il vise à maintenir les bonnes relations que le Nicaragua entretient avec les États-Unis.\nLe Partido Liberal Independiente a été formé lors de sa séparation du Parti libéral nationaliste de Somoza en 1944. Il se maintient comme successeur de l'ancien Parti libéral."
 nicr.3.d:0 "Le sort du Partido Liberal Nacionalista est actuellement en discussion. Alors qu'au départ il présentait encore un programme libéral (les libéraux étant l'un des deux principaux partis du Nicaragua depuis le XIXe siècle avec les conservateurs), le Parti libéral nationaliste s'est ensuite développé pour devenir à peine plus qu'un véhicule politique pour la kleptocratie du clan Somoza. Lorsque Anastasio Somoza García prit le pouvoir en 1936, le parti s'aligna sur les États-Unis et d'autres caudillos d'Amérique latine, comme Rafael Trujillo, Oswaldo López Arellano et Fulgencio Batista.\n\nMaintenant, une proposition a été avancée. Dans ce cadre, nous permettrait aux anciens membres de rejoindre notre parti, le Partido Liberal Independiente. Cela pourrait nous aider à mieux paraître que le régime brutal de Somoza.\nCertains craignent cependant que leur inclusion ne ramène le Nicaragua à la dictature. Bien sûr, nous pourrions toujours autoriser certains membres à nous rejoindre, avec des restrictions telles que leur exclusion des postes de direction les plus élevés."
 nicr.4.d:0 "Des nouvelles urgentes sont arrivées. Il semblerait que le président Enoc Aguado Farfán soit mort dans l'explosion d'une voiture piégée. Cela s'est produit vers 9h30 ce matin, alors que le président se rendait à une conférence de presse à León. Le président et deux autres personnes qui se trouvaient dans la voiture ont été tués.\nLe motif de cette agression est inconnu selon la police. Cependant, certains soupçonnent que d'anciens membres de l'administration Somoza soient à blâmer. Après une élection rapide à la direction, le nouveau président est René Schick Gutiérrez, ancien membre du Parti libéral nationaliste, aujourd'hui Parti libéral unifié."
 
 nic_go_ahead_tt:0 "Débloque les décisions pour préparer l'invasion"
 
 nicc.1.d:0 "Maintenant que nous avons assuré notre emprise sur le pays, nous allons traduire en justice Luis Somoza Debayle pour ses crimes en tant que président entre 1956 et 1959. Le procès sera rapide et mené par le Tribunal de Justice Révolutionnaire. Dirigé par [NIC.GetLeader], le tribunal a délibéré pendant 3 jours, au cours desquels deux camps se sont formés. Le premier camp veut l'emprisonner. Durant son emprisonnement, il sera rééduqué pour devenir un bon ouvrier, tout comme l'empereur Puyi. L'autre camp, en revanche, veut le pendre pour les crimes que lui et sa famille ont commis pendant leur règne.\n\nLuis Somoza Debayle, ce tribunal vous déclare coupable de trahison et de crimes contre l'humanité. A ce titre, ce tribunal vous condamne à..."
 nicc.2.d:0 ""
 nicc.3.d:0 "Bien que la majorité des propriétés et des biens de Somoza aient été confisqués à l'État, il reste quelques objets mineurs qui seront cédés. Des choses comme des petites propriétés, des voitures, des bijoux et d'autres choses similaires. Maintenant, [NIC.GetLeader] doit décider qui les aura. Une option consiste à les donner au hasard aux ouvriers et aux paysans lors d'une loterie. De cette façon, ils pourraient être distribués de manière juste et équitable. D'un autre côté, ils pourraient être attribués à la haute direction du parti pour leur travail acharné et leur dévouement à la révolution. Mais les gens pourraient ne pas voir les choses de cette façon et nous accuseraient très probablement d'élitisme."
 nicc.4.d:0 ""
 nicc.5.d:0 "Le général Adolfo Calero Portocarrero a déclaré la loi martiale au Nicaragua en réponse aux violences après que l'ancien général Somoza a déclaré un coup d'État il y a quelques jours.\nDans un discours télévisé depuis le palais présidentiel de Managua, Calero a déclaré qu'il invoquait le décret d'urgence pour réglementer et surveiller la sécurité dans le pays, après que des violences ont éclaté dans diverses régions du pays à la suite du coup d'État.\n\n\"Je déclare par la présente l'état d'urgence, dans le but de surveiller et de contrôler la sécurité intérieure de l'État national. Avec cet acte, je confirme mon administration et j'ai l'intention de faire une évaluation dans les semaines à venir, pour voir quelles mesures seront nécessaires pour sécuriser notre nation\", a déclaré Calero.\n\n23 soldats ont été tués lors des manifestations et, selon des sources non officielles, 1 588 personnes ont été tuées depuis le putsch."
 nicc.6.d:0 "En-cours"
 nicc.7.d:0 "DE : Directeur du Servicio de Inteligencia\nOBJET : Opération Watchful Eye\n\nMonsieur le Président, vous trouverez ci-joint le rapport sur l'opération Watchful Eye. Nos agents infiltrent les églises, tout en surveillant le clergé et les églises elles-mêmes. Pour être clair, nous ne surveillons pas seulement l'église ; nous surveillons également ceux qui ont des liens avec l'église. Nous recherchons toute activité suspecte qui pourrait être le signe de manifestations antigouvernementales ou d'actes de terrorisme à venir. Nous publierons plus de détails au fur et à mesure de l'avancement de l'opération. Mais permettez-moi de dire que nous poursuivrons sans relâche ceux qui cherchent à provoquer nos compatriotes et à perturber l'ordre public.\n\nVive la révolution !"
 nicc.8.d:0 "Tomas Borge était assis à son bureau lorsque le téléphone sonna. De l'autre côté se trouvait Sergio Fontanez, capitaine local du Sdl du département de Masaya. Il avait l'air content.\n\n\"Camarade, l'opération Watchful Eye a donné des résultats. Il y a quelques heures, nos officiers ont suivi une information et ont mené une descente surprise à l'église de La Asunción à Masaya. Plusieurs suspects ont été arrêtés, dont José R. Somoza, ancien général de Somoza et membre de l'Unión Nacional Nicaragüense\", a déclaré Fontanez.\n\n\"De plus, les agents ont récupéré plusieurs armes, de faux documents et des documents gouvernementaux volés\", a ajouté Fontanez.\n\n\"Cela nous donne raison. Les églises travaillent avec les rebelles. Combien y a-t-il d'autres cellules similaires là-bas. Leurs activités sont illégales et doivent être arrêtées\", a répondu Borge.\n\n\"En effet camarade. Cependant, nous devons être prudents dans nos prochaines étapes, de peur de vouloir qu'ils soient informés. Je vais rédiger un rapport officiel sur le raid et l'envoyer au QG du Sdl. C'est tout.\"\n\nEt sur ce, Fontanez a dit au revoir et a raccroché. Borge se servit un verre et s'assit sur sa chaise avec un léger sourire."
 nicc.9.d:0 "Hier, La Policía Nacional a procédé à des arrestations massives dans tout le Nicaragua. Les cibles de ces arrestations semblent être pour la plupart des membres du FSSN, l'ancien parti interdit au pouvoir dans le pays.\n\nCes dernières semaines, le FSSN a intensifié ses appels à une grève générale et à une rébellion ouverte contre le gouvernement. Récemment, le FSSN a mené une série de barrages routiers autour de la côte de Moskito et a ouvertement déclenché des émeutes dans les rues de Managua, San Juan de Nicaragua et Masaya.\nAu total, 742 personnes ont été arrêtées pour violences présumées, terrorisme et autres accusations. 34 officiers ont été blessés lors des arrestations et 148 rebelles ont été tués."
 nicc.11.d:0 "DE : EXPURGÉ\n\nCamarade Borge. Conformément à vos instructions, Carlos Fonseca a été démis de ses fonctions de vice-président du parti. Il restera un membre ordinaire, mais il ne participera plus aux réunions du parti ni à l'élaboration des politiques. Il n'exercera aucune fonction politique du parti. C'est une punition pour son rôle dans le complot après que le Comité central a voté contre votre destitution. Je vous assure que cela n'aura aucun effet pour nous."
 nicc.12.d:0 "DE : Ministre des Affaires étrangères\n\nCher Président,\nNous vous présentons une proposition susceptible de transformer l'économie du Nicaragua et de renforcer nos relations internationales avec les pays du COMECON, en particulier avec l'Allemagne de l'Est. Le ministère des Affaires étrangères a développé un programme touristique qui vise à attirer les touristes de ces pays. Cette initiative comprend la construction de nouveaux hôtels le long de la côte ouest et le développement de Bluefields pour en faire un haut lieu touristique.\n\nS'il est mis en oeuvre, ce plan attirera des investissements directs et un tourisme à forte dépense en provenance de l'extérieur du Nicaragua, ce qui contribuera à l'expansion de notre économie. Cependant, comme pour tout projet d'envergure, il existe des défis que nous devons surmonter. Premièrement, nous avons besoin de fonds considérables pour construire et sécuriser la ville. Deuxièmement, la communauté Miskito s'inquiète des effets du plan proposé sur sa culture et son mode de vie. Même si nous reconnaissons leurs préoccupations, nous pensons que ce projet apportera des avantages significatifs à l'ensemble du pays.\n\nC'est pourquoi je vous demande d'examiner attentivement cette proposition et de peser ses avantages potentiels par rapport à ses inconvénients éventuels. Devons-nous aller de l'avant avec ce plan ou devrions-nous le reconsidérer ? La décision vous appartient, monsieur le président."
 nicc.13.d:0 "À la suite de la réunion extraordinaire du parti, Tomas Borge n'a eu d'autre choix que d'annoncer sa retraite de la direction du parti avec effet immédiat. En conséquence, le parti a élu Carlos Fonseca pour le remplacer."
 nicc.14.d:0 "Che Guevara a quitté le Nicaragua pour participer à d'autres révolutions. Pour cette raison, nous avons besoin d'un nouveau président. Alors que beaucoup s'attendaient à ce que Carlos Fonseca ou Tomás Borge occupent ce poste, celui-ci a finalement été attribué à Silvio Mayorga Moreno, un proche allié et ami de Guevara. Dans son premier discours, il s'est engagé à poursuivre la voie tracée par Che Gueveara pour le Nicaragua."
 nicc.15.d:0 "Il est temps pour le Politburo d'élire un nouveau vice-président du parti. L'ancien président Silvio Mayorga a été promu à un poste de direction après le départ du Che et, à ce titre, un nouveau vice-président est nécessaire.\nLes membres de l'élite du parti, parmi lesquels des représentants régionaux et des hauts fonctionnaires, se sont rassemblés dans la capitale, Managua, pour participer aux élections. L'atmosphère est tendue et électrique, alors que les prétendants au poste de vice-président font campagne avec enthousiasme pour obtenir les votes de leurs partisans.\n\nLe premier candidat, Juan Alberto Henríquez Oporta, est une étoile montante du parti, connu pour son soutien virulent aux politiques maoïstes. Il soutient que le parti a besoin d'une nouvelle perspective et qu'il est le candidat qui pourrait apporter cette nouvelle énergie et cette nouvelle passion au rôle de vice-président. Il est populaire auprès des membres pro-chinois du parti. \n\nLe deuxième candidat, Álvaro Ramírez González, est un ancien chef de guérilla qui a combattu contre Somoza, avant de se tourner vers une carrière dans l'administration publique. Malgré son histoire, il est considéré comme un bureaucrate neutre qui n'a aucune allégeance particulière à aucune faction du parti. Il se présente comme un candidat de compromis que la plupart des membres du Poliburo peuvent soutenir.\n\nLe candidat final, Eli Altamirano Pérez, est un leader syndical avec une longue histoire d'activisme, ayant été emprisonné trois fois lors de la vague de répression qui a suivi l'assassinat d'Anastasio Somoza en 1956. Il se positionne comme un champion de la classe ouvrière, mettant en avant son expérience de syndicaliste et sa longue histoire de lutte pour les droits des travailleurs. Cependant, sa politique radicale fait de lui une figure de division au sein du parti. Il tire son soutien des plus jeunes membres du Politburo.\n\nLe vote étant effectué, les membres attendent avec impatience les résultats. La commission de vote a besoin de cinq jours pour compter les votes."
 nicc.16.d:0 "Les tensions s'intensifient au sein du parti alors que sa direction adopte une position plus dure sur des questions telles que la politique étrangère et la stratégie révolutionnaire. L'un des fondateurs du parti et intellectuel respecté, Carlos Fonseca Amador, est devenu un critique virulent. Fonseca Amador plaide depuis longtemps pour une approche plus modérée et pragmatique du socialisme et n'est pas d'accord avec le radicalisme croissant du parti. Il estime que le parti s'éloigne trop de ses racines et devrait plutôt se concentrer sur le communisme traditionnel.\nMalgré sa stature au sein du parti, la voix dissidente de Fonseca Amador est considérée comme une menace par la direction du parti. Ils craignent que ses critiques puissent saper l'unité du parti et conduire à une scission au sein du parti. Au cours de l'été [GetYear], la direction du parti a lancé une série de purges pour éliminer la dissidence au sein du parti. Fonseca Amador a été pris pour cible et accusé de déloyauté et d'action contre les intérêts du parti. Malgré ses protestations et ses tentatives de défense, Fonseca Amador a finalement été exclu du parti. Cette décision fut pour lui un coup dur et il se sentit trahi par ses anciens camarades.\n\nDans les semaines qui ont suivi son expulsion, Fonseca Amador a continué à dénoncer la politique du parti. Mais son franc-parler fut de courte durée. Quelques semaines après son expulsion, aux petites heures d'une matinée pluvieuse, il a été assassiné devant son domicile par un agresseur inconnu. Les détails de sa mort n'étaient pas clairs, mais il était largement admis qu'il avait été pris pour cible par la direction du parti ou par ses alliés au sein du Servicio de Inteligencia."
 nicc.17.d:0 "DE : Ministre des Affaires étrangères\n\nCher Vice-président,\nC'est avec le coeur lourd que je vous écris pour vous informer de la tragique nouvelle qui vient de nous parvenir de Ciudad de Lénine. Notre bien-aimé leader et secrétaire général, Silvio Mayorga, a été assassiné de sang-froid. Comme vous le savez peut-être déjà, il tenait une réunion de haut niveau avec ses principaux conseillers lorsqu'un homme armé est entré dans la pièce et lui a tiré cinq coups de feu. Même si les forces de sécurité ont réussi à neutraliser l'agresseur, il était trop tard pour sauver notre chef, qui a succombé à ses blessures en quelques minutes. D'après ce que nous savons, l'agresseur était un ancien général ayant travaillé pour la famille Somoza.\n\nSilvio Mayorga n'était pas seulement un leader pour nous, mais aussi un mentor, un visionnaire et un véritable défenseur du peuple. Sa mort prématurée a non seulement créé un vide dans nos coeurs, mais aussi un vide de leadership dans le pays. C'est là que vous intervenez, vice-président. Vous êtes par la présente promu secrétaire général de notre grande nation.\n\nVotre première tâche est de vous présenter le plus rapidement possible au Politburo, le siège du pouvoir. Vous y serez informés par les ministres et d'autres hauts fonctionnaires de la situation actuelle et des mesures à prendre à la suite du décès de Silvio Mayorga. Vous devrez également vous adresser à la nation et lui assurer que le gouvernement est entre de bonnes mains. Puissiez-vous vous laisser guider par les principes de notre grand leader, Silvio Mayorga, et conduire le pays vers la paix, la prospérité et le progrès."
 nicc.18.d:0 "Dans un geste surprenant, le gouvernement du Nicaragua a annoncé qu'il purgeait l'aile guévariste du parti au pouvoir et qu'il adoptait une idéologie anti-guévariste. Cette décision, qui intervient après la nomination de Juan Alberto, est considérée comme une rupture significative avec les convictions socialistes de longue date du pays.\nLe gouvernement prétend que la purge est nécessaire pour débarrasser le pays des éléments contre-révolutionnaires et assurer le succès continu de l'expérience socialiste. Cette décision a suscité l'inquiétude de nombreux Nicaraguayens qui soutiennent depuis longtemps le mouvement guévariste.\n\nLes critiques du gouvernement l'ont accusé de trahir les idéaux de la révolution et ont averti que l'adoption de l'idéologie anti-guévariste entraînerait un gouvernement plus répressif. Cependant, le gouvernement reste ferme dans son engagement envers la nouvelle idéologie et a promis d'être vigilant contre toute tentative visant à saper la révolution.\nOn ne sait toujours pas exactement ce que cela signifie pour l'avenir du Nicaragua et de la région dans son ensemble, mais il est clair que le pays est entré dans une nouvelle ère, dans laquelle le guévarisme n'est plus l'idéologie dominante."
 nicc.19.d:0 "Notre gouvernement a récemment annoncé l'introduction de cours volontaires de langue et de culture albanaises dans le programme national, une mesure qui rend hommage à l'héritage d'Enver Hoxha et à ses réalisations socialistes en Albanie. Les cours devraient commencer au cours de la prochaine année universitaire et seront ouverts à tous les étudiants souhaitant en savoir plus sur la culture et l'histoire albanaises.\n\nNous devrions y voir un moyen de renforcer les liens entre le Nicaragua et l'Albanie et d'inciter les étudiants à poursuivre de nouvelles voies d'apprentissage. En tant que nation attachée aux idéaux socialistes, nous pensons que ces cours offriront aux étudiants une opportunité unique d'acquérir une compréhension plus profonde du monde dans son ensemble et de développer une plus grande appréciation des principes socialistes.\nEn outre, l'introduction de cours de langue et de culture albanaise élargira non seulement les horizons des étudiants, mais leur fournira également un ensemble de compétences précieuses qui leur seront utiles dans leur future carrière. La capacité de parler plusieurs langues et de comprendre différentes cultures est de plus en plus importante dans notre monde globalisé, et nous sommes fiers d'offrir cette opportunité à nos étudiants.\nEn conclusion, nous encourageons tous les étudiants à profiter de cette nouvelle opportunité passionnante et à embrasser la riche culture et l'histoire de l'Albanie."
 nicc.20.d: "Le Comité central du Parti communiste nicaraguayen s'est réuni pour une session d'urgence. La rencontre a été initiée par Carlos Fonseca, fondateur et idéologue du parti, et ses fidèles. Ils ont lancé une attaque féroce contre Tomás Borge, l'actuel secrétaire général, l'accusant de trahir la révolution, d'imposer une dictature et de servir les intérêts de Moscou. Fonseca prétend que Borge a perdu contact avec les masses et qu'il doit démissionner pour le bien du parti et du pays. Borge, cependant, n'est pas disposé à abandonner son pouvoir sans combattre. Il a ses propres partisans au sein du parti, ainsi que le soutien de l'Union soviétique et de Cuba. Il dénonce Fonseca comme un traître, un révisionniste et un agent de la CIA. La réunion se transforme rapidement en un débat houleux, les deux parties se lançant insultes et menaces. Le sort du parti et de la révolution est en jeu."
 nicc.21.t:0 "Visite de Casimiro Sotelo sur la côte Miskito"
 nicc.21.d:0 "Casimiro Sotelo, un éminent dirigeant de la faction guévariste de la RFA, a été assassiné par des hommes armés inconnus à Puerto Cabezas, la capitale de la côte Miskito. Sotelo était en visite dans la région pour répondre aux troubles et au mécontentement croissants au sein de la population indigène, qui se sent marginalisée et opprimée par le gouvernement central. Il prévoyait également de rencontrer des dirigeants et des militants locaux pour discuter des moyens d'améliorer les conditions sociales et économiques du peuple Miskito, ainsi que de renforcer son autonomie culturelle et politique.\n\nSa mort a suscité l'indignation et le chagrin parmi ses partisans, qui le voient comme un symbole de la rébellion des jeunes contre la dictature de Somoza. C'était un ancien leader étudiant qui a défié le tyran en public et lui a demandé de révéler où se trouvait le corps de Sandino. Il était également membre de la Direction nationale de la RFA et proche d'Álvaro Ramírez González.\nSon assassinat a également suscité des soupçons et des tensions au sein de la RFA, certains accusant des factions rivales d'être à l'origine du meurtre. Certains pointent du doigt la faction de la Guerre populaire prolongée, dirigée par Tomás Borge, qui critique l'approche modérée et conciliante de Sotelo sur la question Miskito. D'autres soupçonnent l'implication d'agents étrangers ou de collaborateurs locaux, qui cherchent à saper la révolution et à semer la discorde dans ses rangs.\nC'est un coup tragique porté à notre révolution et à notre unité. Comment allons-nous faire face à cette perte ?"
 nicc.22.t:0 "Troubles sur la côte Miskito"
 nicc.22.d:0 "Suite à l'assassinat de Casimiro Sotelo par des assaillants inconnus, la région a sombré dans le chaos et la violence. Les manifestants réclament plus d'autonomie et de reconnaissance de la part du gouvernement central, tandis que certains groupes radicaux appellent à une sécession pure et simple. La milice de défense nationale, dirigée par Tomas Borge, a été déployée dans la région pour réprimer les troubles et rétablir l'ordre. Cependant, leur présence n'a fait qu'envenimer davantage la situation, alors que des informations faisant état d'affrontements et d'atrocités sont parvenues jusqu'à nos oreilles. Comment devons-nous gérer cette crise ?"
