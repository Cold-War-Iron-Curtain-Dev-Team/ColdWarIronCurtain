l_french:
 TUR_cement_industry_effort:0 "Effort de l'industrie du ciment"
 TUR_cement_industry_effort_desc:0 "Nous devons reconstruire nos terres pour prospérer. Cela commencera par construire davantage de cimenteries."
 TUR_sugar_industry_effort:0 "Effort de l'industrie sucrière"
 TUR_sugar_industry_effort_desc:0 "Nous devrions pouvoir subvenir à nos besoins fondamentaux sans dépendre de personne."
 TUR_expand_the_ironweb:0 "Développez la toile de fer"
 TUR_expand_the_ironweb_desc:0 "Nous devons relier notre nation d'est en ouest. Notre réseau ferroviaire doit être étendu."
 TUR_build_pasabahce_glass_factory:0 "Construire l'usine de verre de Pasabahce"
 TUR_build_pasabahce_glass_factory_desc:0 "Nous diversifierons notre industrie."
 TUR_expand_central_industrial_region:0 "Développer la région industrielle centrale"
 TUR_expand_central_industrial_region_desc:0 "Développez notre industrie d'armement centralisée."
 TUR_the_five_year_plan:0 "Premier plan de développement quinquennal"
 TUR_the_five_year_plan_desc:0 "Nous devons améliorer nos infrastructures pour construire des usines civiles répondant aux besoins de notre nation."
 TUR_build_merinos_textiles_factory:0 "Construire une usine de textiles mérinos"
 TUR_build_merinos_textiles_factory_desc:0 "Nous diversifierons notre industrie."
 TUR_develop_the_capital:0 "Développer la capitale"
 TUR_develop_the_capital_desc:0 "La nouvelle capitale est au centre de notre territoire. Nous devons en faire un lien entre le transport et le fret."
 TUR_invest_in_western_anatolia:0 "Investir en Anatolie occidentale"
 TUR_invest_in_western_anatolia_desc:0 "Trop de dégâts ont été causés en Anatolie occidentale pendant notre guerre de libération. Nous devons déployer tous nos efforts pour reconstruire."
 TUR_build_kardemir_steelworks:0 "Construire l'aciérie de Kardemir"
 TUR_build_kardemir_steelworks_desc:0 "Nous devons développer notre industrie lourde pour rattraper les pays occidentaux."
 TUR_establish_village_institutes:0 "Créer des instituts villageois"
 TUR_establish_village_institutes_desc:0 "Nous éduquerons les gens ordinaires et ferons ainsi progresser considérablement la science de notre pays."
 TUR_prospect_for_oil:0 "Perspectives pétrolières"
 TUR_prospect_for_oil_desc:0 "Nos voisins flottent sur le pétrole. Il est fort probable que nous ayons également du pétrole. Nous devrions intensifier nos prospections sur la frontière orientale."
 TUR_raman_petrolium:0 "Pétrole Raman"
 TUR_raman_petrolium_desc:0 "Nous avons découvert les premières traces de gisements de pétrole commercialement viables au mont Raman. Il est temps de commencer à forer."
 TUR_electronics_effort:0 "Effort électronique"
 TUR_electronics_effort_desc:0 "Nous ne pouvons atteindre notre objectif de rattraper les pays occidentaux qu'en concentrant nos efforts sur les technologies de l'information et de l'informatique."
 TUR_atomic_energy_institute:0 "Institut de l'énergie atomique"
 TUR_atomic_energy_institute_desc:0 "Nous ne devons pas perdre l'occasion de découvrir un moyen d'exploiter le feu primordial de la fission."
 TUR_middle_east_technical_university:0 "Université technique du Moyen-Orient"
 TUR_middle_east_technical_university_desc:0 "L'industrialisation rapide de notre pays a ouvert de nouvelles opportunités en matière de R&D que nous devrions poursuivre. Avec une université technique avancée au coeur de notre pays, nous pouvons mener davantage de recherches."
 TUR_prepare_for_the_next_war:0 "Préparez-vous à la prochaine guerre"
 TUR_prepare_for_the_next_war_desc:0 "La Grande Guerre n'a peut-être été que la première du genre. Nous devons nous préparer à ce qui sera sûrement un champ de bataille en constante évolution."
 TUR_the_defence_of_anatolia:0 "La défense de l'Anatolie"
 TUR_the_defence_of_anatolia_desc:0 "Des stratagèmes encore plus audacieux doivent être imaginés si l'on veut réussir la défense de notre patrie."
 TUR_crescent_retreat_strategy:0 "Stratégie de retraite du croissant"
 TUR_crescent_retreat_strategy_desc:0 "Si les combats se retournent contre nous, nous devons avoir des plans en place pour un regroupement et des représailles efficaces."
 TUR_fortify_erzurum:0 "Fortifier Erzurum"
 TUR_fortify_erzurum_desc:0 "Les forts construits à l'est assureront des défenses supplémentaires contre une éventuelle agression soviétique."
 TUR_soviet_threat:0 "Menace soviétique"
 TUR_soviet_threat_desc:0 "En fortifiant les zones clés, nous nous rendons moins vulnérables au cas où notre grand voisin deviendrait agressif."
 TUR_standardisation_of_equipment:0 "Standardisation des équipements"
 TUR_standardisation_of_equipment_desc:0 "En standardisant l'équipement de nos soldats, nous posons les bases d'un appareil d'approvisionnement moderne."
 TUR_modernising_the_cavalry:0 "Moderniser la cavalerie"
 TUR_modernising_the_cavalry_desc:0 "Même si la cavalerie a encore un rôle à jouer, nous avons besoin de nouvelles montures métalliques pour qu'elle puisse rivaliser sur le champ de bataille moderne."
 TUR_study_foreign_tanks:0 "Étudier les chars étrangers"
 TUR_study_foreign_tanks_desc:0 "Ces « chars » seront un élément central des conflits armés d'aujourd'hui, et nous devons nous assurer de suivre le rythme des nations occidentales, par tous les moyens nécessaires."
 TUR_tank_experiments:0 "Expériences en char"
 TUR_tank_experiments_desc:0 "Une fois les bases de la conception des chars en place, nous sommes maintenant prêts à tracer notre propre voie dans le domaine complexe de la conception mécanisée."
 TUR_artillery_modernisation:0 "Modernisation de l'artillerie"
 TUR_artillery_modernisation_desc:0 "Nous ne devons pas négliger d'améliorer et de moderniser le soutien dont nos soldats ont besoin pour un déploiement efficace."
 TUR_special_forces:0 "Forces spéciales"
 TUR_special_forces_desc:0 "Nous devons déployer des troupes capables de profiter de nos terres montagneuses."
 TUR_army_modernisation:0 "Modernisation de l'armée"
 TUR_army_modernisation_desc:0 "Des armes modernes pour des hommes modernes !"
 TUR_aviation_effort:0 "Les femmes dans l'aviation"
 TUR_aviation_effort_desc:0 "Le succès de Sabiha Gökcen à l'Académie de l'aviation en entraînera certainement d'autres à venir."
 TUR_fighter_modernisation:0 "Modernisation des chasseurs"
 TUR_fighter_modernisation_desc:0 "Pilier de toute force aérienne, nos chasseurs ne doivent pas être rendus obsolètes. À mesure que le reste de notre force aérienne s'améliore, il doit en faire de même."
 TUR_air_innovations:0 "Innovations aériennes"
 TUR_air_innovations_desc:0 "Il reste encore beaucoup à faire dans le domaine de la stratégie et des tactiques aériennes."
 TUR_heavy_fighter_concept:0 "Concept de chasseur lourd"
 TUR_heavy_fighter_concept_desc:0 "Si nous sommes contraints de passer à l'offensive, nous avons besoin d'un nouveau type de chasseurs capables d'opérer durablement à l'intérieur de frontières hostiles."
 TUR_naval_bomber_experiments:0 "Expériences de bombardiers navals"
 TUR_naval_bomber_experiments_desc:0 "La suprématie aérienne est aussi importante en mer que sur terre. Les avions spécialisés développés pour la guerre navale constituent un moyen d'atteindre cet objectif."
 TUR_medium_bomber_focus:0 "Focus sur le bombardier moyen"
 TUR_medium_bomber_focus_desc:0 "Une extension de la philosophie du bombardement de précision adaptée à une portée étendue destinée à être utilisée dans des rôles de soutien."
 TUR_light_bomber_focus:0 "Focus sur les bombardiers légers"
 TUR_light_bomber_focus_desc:0 "L'intérêt de l'utilisation de bombardiers en piqué pour l'appui aérien rapproché ne doit pas être sous-estimé."
 TUR_air_modernisations_programme:0 "Programme de modernisation de l'air"
 TUR_air_modernisations_programme_desc:0 "La théorie de l'aviation est tout aussi importante que la technologie. De nouveaux stratagèmes pour nos pilotes attendent encore d'être découverts."
 TUR_rocket_development:0 "Développement de fusée"
 TUR_rocket_development_desc:0 "La vitesse est l'attribut sur lequel reposent tous les autres attributs aériens. Les moteurs de fusées et d'avions à réaction pourraient théoriquement nous permettre de dépasser toutes les limites précédentes."
 TUR_develop_turkish_ship_building:0 "Développer la construction navale turque"
 TUR_develop_turkish_ship_building_desc:0 "Entourés par les mers, nous n'avons aucune excuse pour négliger nos efforts navals."
 TUR_study_foreign_built_ships:0 "Étudier les navires construits à l'étranger"
 TUR_study_foreign_built_ships_desc:0 "De nouveaux types de navires sont continuellement développés par nos voisins. Nous devons les étudier, sinon nous trouverons les nôtres obsolètes."
 TUR_a_cruiser_navy:0 "Une marine de croiseurs"
 TUR_a_cruiser_navy_desc:0 "Des navires de plus en plus grands seront nécessaires pour concrétiser nos projets de présence maritime."
 TUR_import_submarine_technology:0 "Importer de la technologie sous-marine"
 TUR_import_submarine_technology_desc:0 "Une lacune sous-marine est inacceptable. Nous aurons la technologie, même si nous devons l'acheter."
 TUR_commerce_attack:0 "Tactiques d'attaque commerciale"
 TUR_commerce_attack_desc:0 "Aucune marine n'est complète sans sous-marins. Les nôtres doivent être organisés pour une létalité optimale, tout comme le reste de la flotte."
 TUR_the_twin_threats:0 "Les doubles menaces"
 TUR_the_twin_threats_desc:0 "En nous concentrant sur les contre-tactiques nécessaires pour affronter nos ennemis les plus probables, nous garderons le dessus dans le combat naval."
 TUR_coastal_defense:0 "Défense côtière"
 TUR_coastal_defense_desc:0 "Une force de défense navale mobile à courte portée pourrait potentiellement faire le travail d'une force plusieurs fois supérieure à sa force dans des fortifications stationnaires."
 TUR_strike_force:0 "Force de frappe"
 TUR_strike_force_desc:0 "Si nous manquons de chiffres, nous avons besoin d'une force de navires de guerre déployée rapidement pour pouvoir frapper l'ennemi là où il est le plus faible."
 TUR_mediterranean_navy:0 "Marine méditerranéenne"
 TUR_mediterranean_navy_desc:0 "Un effort approfondi pour réinventer notre stratégie navale sera d'une grande importance si nous voulons utiliser nos navires en Méditerranée."
 TUR_diplomatic_effort:0 "Effort diplomatique"
 TUR_diplomatic_effort_desc:0 "Nous devons être actifs sur la scène internationale pour protéger nos intérêts."
 TUR_the_montreux_convention:0 "La Convention de Montreux"
 TUR_the_montreux_convention_desc:0 "La zone du détroit a été démilitarisée depuis la Grande Guerre, mais elle ne peut pas le rester. Nous devons rechercher un soutien international pour imposer notre pleine souveraineté."
 TUR_claims_on_bulgaria:0 "Récupérer Bourgas et Sofia"
 TUR_claims_on_bulgaria_desc:0 "Nous devons contrôler toute terre qui nous appartient naturellement."
 TUR_sun_language_theory:0 "Théorie du langage solaire"
 TUR_sun_language_theory_desc:0 "Le bien de la nation doit primer sur les soi-disant « vérités ». Tout comme nous forgeons notre propre destin, nous devons forger nos propres faits."
 TUR_claim_rhodes:0 "Réclamez Rhodes"
 TUR_claim_rhodes_desc:0 "Rhodes et les îles du Dodécanèse au sud-ouest sont sous le contrôle de l'Italie. Avec le soutien des Britanniques, nous devrions les récupérer."
 TUR_peace_at_home_peace_in_the_world:0 "Paix à la maison Paix dans le monde"
 TUR_peace_at_home_peace_in_the_world_desc:0 "Nous devons rester à l'écart des conflits majeurs, tout en cherchant des amis pour s'unir contre l'agression."
 TUR_treaty_with_iran:0 "Traité avec l'Iran"
 TUR_treaty_with_iran_desc:0 "Les vieilles rancunes doivent rester dans le passé. Chaque ami est nécessaire dans les temps sombres à venir."
 TUR_expand_the_sadabat_pact:0 "Développer le pacte Sadabat"
 TUR_expand_the_sadabat_pact_desc:0 "On n'a jamais assez d'amis."
 TUR_internationalism:0 "Internationalisme"
 TUR_internationalism_desc:0 "Les ennemis de nos ennemis peuvent être nos amis."
 TUR_authoritarianism:0 "Autoritarisme"
 TUR_authoritarianism_desc:0 "La démocratie est une solution faible à des problèmes difficiles. Si le pouvoir doit être exercé avec force, il doit être libéré des entraves du consensus."
 TUR_paramilitarism:0 "Paramilitarisme"
 TUR_paramilitarism_desc:0 "Les principes militaires ont des applications en dehors du domaine militaire. Chaque composante de la société étant formée à ces disciplines, chaque citoyen pourra prendre les armes à tout moment."
 TUR_go_right:0 "Allez à droite"
 TUR_go_right_desc:0 "La force est la seule qualité qui mérite d'être recherchée. Nos voisins ont adopté cette vérité, et nous devons faire de même."
 TUR_military_youth:0 "Jeunesse militaire"
 TUR_military_youth_desc:0 "Enrôlant nos jeunes dans des organisations promouvant la discipline et l'idéologie nationale, nous engendrerons une génération fidèle de futures recrues."
 TUR_draw_closer_to_germany:0 "Rapprochez-vous de l'Allemagne"
 TUR_draw_closer_to_germany_desc:0 "Nous avons combattu ensemble, maintenant nous serons unis."
 TUR_go_left:0 "Allez à gauche"
 TUR_go_left_desc:0 "Ce n'est qu'en unissant notre peuple que nous pourrons vaincre les ennemis qui menacent de nous consumer."
 TUR_political_commissars:0 "Commissaires politiques"
 TUR_political_commissars_desc:0 "Afin de maintenir le contrôle de l'armée, des officiers politiques seront nommés pour garantir l'adhésion de l'armée aux politiques du parti."
 TUR_draw_closer_to_USSR:0 "Rapprochez-vous de l'URSS"
 TUR_draw_closer_to_USSR_desc:0 "L'URSS n'est pour nous qu'une amie. Nous devrions montrer l'appréciation nécessaire."
 TUR_liberalism:0 "Libéralisme"
 TUR_liberalism_desc:0 "Nous ne nous abaisserons pas au niveau des despotes et des dictateurs. N'oubliez jamais qu'un État est au service de son peuple, et non l'inverse."
 TUR_intervention_focus:0 "Objectif de l'intervention"
 TUR_intervention_focus_desc:0 "Si nous valorisons la liberté, nous devons la sauvegarder non seulement pour nous, mais pour les nations du monde entier. Si cela signifie la guerre, qu'il en soit ainsi !"
 TUR_draw_closer_to_britain:0 "Rapprochez-vous de la Grande-Bretagne"
 TUR_draw_closer_to_britain_desc:0 "Nous devons nous rapprocher de la Grande-Bretagne si nous voulons faire partie du monde occidental."
 TUR_claims_on_greece:0 "Exigez Thessalonique et les îles de la mer Égée"
 TUR_claims_on_greece_desc:0 "Nous devons récupérer les îles de la mer Égée, la Thrace occidentale et la Macédoine centrale pour notre sécurité."
 TUR_demand_mosul:0 "Exigez Mossoul"
 TUR_demand_mosul_desc:0 "La question de Mossoul n'a pas été résolue correctement après la Grande Guerre. Il est maintenant temps de le réparer."
 TUR_claim_cyprus:0 "Réclamez Chypre"
 TUR_claim_cyprus_desc:0 "Chypre est très importante pour notre sécurité dans le sud. Maintenant que nous avons des amis solides à nos côtés, il est temps de le reprendre."
 TUR_technology_sharing:0 "Partage de technologie"
 TUR_technology_sharing_desc:0 "Nous devrions bénéficier des progrès technologiques de nos alliés."
 TUR_ideological_fanaticism_focus:0 "Fanatisme idéologique"
 TUR_militarism_focus:0 "Militarisme"
 TUR_authoritarianism_focus:0 "Autoritarisme"
 TUR_revanchism_focus:0 "Revanchisme"
 TUR_internationalism_focus:0 "Internationalisme"
 TUR_invite_to_faction_tooltip:0 "est invité dans la faction de [Root.GetFlag]§Y[Root.GetName]§!.\n"
 TUR_mosul_extraction:0 "Extraction de Mossoul"
 TUR_mosul_extraction_desc:0 "Nous avons découvert un immense gisement de pétrole à Mossoul. Maintenant qu'elles nous appartiennent, nous pouvons bénéficier grandement de ces vastes ressources."
 TUR_found_sidem:0 "Fondation de l'aciérie Divrigi"
 TUR_found_sidem_desc:0 "L'utilisation convertit les grandes veines de fer de Divrigi en acier."
 TUR_nejd_drill:0 "Foret du Nejd"
 TUR_nejd_drill_desc:0 "La famille Saoud a été écrasée et ses riches terres sont les nôtres. Laissez l'huile couler."
 TUR_annex_nejd:0 "Annexe Arabie Saoudite"
 TUR_annex_nejd_desc:0 "Nous avons perdu la péninsule arabique après la Grande Guerre. Maintenant, ces terres doivent redevenir les nôtres."
 TUR_save_the_azerbaijanis:0 "Sauvez les Turcs d'Azerbaïdjan"
 TUR_save_the_azerbaijanis_desc:0 "Les Azerbaïdjanais souffrent sous le régime soviétique. Nous devons faire tout notre possible pour les sauver."
 TUR_demand_skopje:0 "Exigez Skopje"
 TUR_demand_skopje_desc:0 "Üsküp a été perdue pendant les guerres balkaniques. Il est maintenant temps de le récupérer !"
 TUR_annex_persia:0 "Annexe Perse"
 TUR_annex_persia_desc:0 "La Perse possède de riches ressources et une grande valeur commerciale. Nous devons faire ce que l'Empire Ottoman ne pouvait pas faire. Il faut les annexer."
 TUR_persian_oil:0 "Industrie pétrolière en Iran"
 TUR_persian_oil_desc:0 "L'industrie pétrolière en Perse est extrêmement primitive. Peut-être qu'avec une bonne utilisation des fonds, nous pourrons l'améliorer."
 TUR_establish_organized_industries:0 "Créer des industries organisées"
 TUR_establish_organized_industries_desc:0 "Établir des industries organisées dans tous les États. Améliorer l'économie civile."
 TUR_improve_turkish_defensive_industry:0 "Améliorer les industries défensives nationales"
 TUR_improve_turkish_defensive_industry_desc:0 "Développez l'industrie défensive de la Turquie et construisez des usines secrètes."
 TUR_annex_romania:0 "Annexe Roumanie"
 TUR_annex_romania_desc:0 "La Roumanie possède des gisements de pétrole stratégiques et un emplacement précieux. Nous devons le conquérir."
 TUR_annex_hungary:0 "Annexe Hongrie"
 TUR_annex_hungary_desc:0 "La Hongrie faisait partie de nos frontières au XVIe siècle. Rétablissons ce fait."
 TUR_restore_empire:0 "Élargir le serment national"
 TUR_restore_empire_desc:0 "L'empire Ottoman fut dissous à la suite de la Grande Guerre. Nous avons le droit de rétablir ces frontières !"
 TUR_restore_middle_east_borders:0 "Restaurer les frontières du Moyen-Orient"
 TUR_restore_middle_east_borders_desc:0 "Restaurez les frontières du Moyen-Orient."
 TUR_demand_egypt:0 "Exigez l'Égypte"
 TUR_demand_egypt_desc:0 "Les Anglais sont des maîtres cruels envers nos frères d'Egypte. Soyons leur espoir..."
 TUR_restore_europe_borders:0 "Restaurer les frontières européennes"
 TUR_restore_europe_borders_desc:0 "Autrefois, l'Empire Ottoman menaçait l'Occident. Que l'Europe nous fasse à nouveau peur !"
 TUR_reform_army:0 "Armée réformée"
 TUR_reform_army_desc:0 "Nous devons appliquer les innovations technologiques à notre armée pour notre indépendance et devenir une puissance régionale. Réformons notre armée le plus tôt possible."

 ### TUR - TURKEY ###
 TUR_submarine_1:0 "Classe Birinci Inönü"
 TUR_submarine_1_desc:0 "La classe Birinci Inönü était composée de deux sous-marins côtiers construits aux Pays-Bas pour la Turquie au milieu des années 1920. Ce furent les premiers navires construits pour la marine turque après la Première Guerre mondiale. Ils déplaçaient 520 tonnes et étaient armés de six tubes lance-torpilles de 450 mm. Ils étaient un peu lents mais avaient une bonne portée."
 #TUR_submarine_1b: "Dumlupinar Class"
 TUR_submarine_2:0 "Classe Saldiray"
 TUR_submarine_2_desc:0 "Les trois sous-marins de la classe Saldiray furent lancés à la fin des années 1930. Leur conception a été fortement influencée par l'Allemagne, le premier navire de cette classe étant construit en Allemagne et les deux autres construits sous licence à Istanbul. Il s'agissait de grands sous-marins océaniques, déplaçant plus de 930 tonnes et dotés d'une excellente portée. Ils étaient armés de six tubes lance-torpilles de 533 mm."
 TUR_submarine_3:0 "Classe Oruc Reis"
 TUR_submarine_3_desc:0 "Les sous-marins de la classe Oruc Reis ont été construits en Grande-Bretagne selon une conception britannique modifiée de la classe S. Les navires ont été lancés en 1940, et plusieurs ont été temporairement internés par la Royal Navy. Tous sauf un ont finalement été renvoyés en Turquie. Les navires déplaçaient 625 tonnes et étaient armés de cinq tubes lance-torpilles de 533 mm. Ils étaient quelque peu limités dans leur vitesse et leur portée."
 TUR_submarine_4:0 "Classe Sakarya"
 TUR_submarine_4_desc:0 "Les sous-marins de la classe Sakarya étaient une série de sous-marins américains de la classe Balao vendus à la Turquie après la guerre. Il s'agissait de très gros sous-marins pour leur époque, déplaçant plus de 1 520 tonnes. Ils avaient une excellente portée et vitesse et étaient armés de dix tubes lance-torpilles de 533 mm."
 TUR_destroyer_1:0 "Classe Peyk"
 TUR_destroyer_1_desc:0 "La classe Peyk se composait d'une paire de grands torpilleurs rapides commandés pour la marine Ottoman en 1907. Les navires ont été construits en Allemagne et ont survécu à la Première Guerre mondiale, mais étaient obsolètes pendant la Seconde Guerre mondiale. Les navires déplaçaient 775 tonnes et étaient armés de canons jumeaux de 105 mm/37 SK L/40, ainsi que de trois tubes lance-torpilles de 450 mm. Ils avaient une portée décente mais étaient assez lents pour un destroyer."
 TUR_destroyer_2:0 "Classe Kocatepe"
 TUR_destroyer_2_desc:0 "Les deux destroyers de la classe Kocatepe ont été construits en Italie pour la marine turque en 1931. Ils étaient basés sur le modèle italien folgore. Les navires déplaçaient 1 250 tonnes et étaient armés de quatre canons Ansaldo 1926 de 120 mm/50 et de six tubes lance-torpilles de 533 mm. Ils avaient également une bonne vitesse et une bonne portée."
 TUR_destroyer_3:0 "Classe Demirhisar"
 TUR_destroyer_3_desc:0 "Les quatre destroyers de la classe Demirhisar ont été construits en Grande-Bretagne et achevés en 1942. Deux des navires ont été internés par la Royal Navy, dont un a été restitué après la guerre. Les navires étaient basés sur la classe I britannique. Ils déplaçaient 1 370 tonnes et disposaient de quatre canons 120 mm/45 QF Mk IX comme armement principal. Ils avaient une vitesse décente et une bonne portée, et disposaient d'un solide complément de canons AA et d'équipement ASW."
 TUR_light_cruiser_1:0 "Classe Mecidiye"
 TUR_light_cruiser_1_desc:0 "Le navire turc Mecidiye était un croiseur protégé construit aux États-Unis pour la marine Ottoman au tournant du siècle. Il a en fait été coulé dans des eaux peu profondes pendant la Seconde Guerre mondiale, mais a été relevé et, après un bref passage au sein de la marine impériale russe, a été renvoyé en Turquie. Elle déplaçait un peu moins de 3 500 tonnes et était armée de deux canons Bethlehem No. 2 de 152 mm/44 et de huit canons Armstrong Y de 120 mm/45. Ils avaient une portée décente mais étaient relativement lents et légèrement blindés."
 TUR_battle_cruiser_1:0 "Classe Yavuz"
 TUR_battle_cruiser_1_desc:0 "Le Yavuz a été initialement commandé sous le nom de croiseur de bataille allemand Goeben, mais a été vendu au Ottomans et remis en service en 1914 pour éviter l'internement. Il déplaçait un peu moins de 23 000 tonnes et avait une vitesse et une autonomie décentes. Elle était bien blindée et était armée de dix canons de 283 mm/47 SK L/50 ainsi que d'un puissant armement secondaire."
 TUR_battleship_1:0 "Classe Resadiye"
 TUR_battleship_1_desc:0 "La classe Resadiye représente trois cuirassés dreadnought commandés au Royaume-Uni pour la marine turque juste avant la Première Guerre mondiale. Cependant, un seul des navires fut achevé et il fut ensuite interné par les Britanniques au début de la Première Guerre mondiale. Les navires auraient déplacé 23 000 tonnes et auraient eu un bon blindage, une bonne vitesse et une bonne portée. Leur armement principal aurait été composé de dix canons Vickers de 343 mm/45."
 
