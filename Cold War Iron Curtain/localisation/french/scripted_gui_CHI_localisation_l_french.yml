 POLITICS_MA_JIYUAN_50s_WARLORDS_DESC:0 "§gMa Jiyuan est née à l'époque du gouvernement Beiyang. Il est le fils unique de Ma Bufang et a ensuite rejoint la NRA pendant la guerre avec le Japon. Pendant la guerre civile, le jeune Ma a acquis une réputation dans le nord-ouest, en menant avec succès une campagne aux côtés de Hu Zongnan pour vaincre 120 000 forces communistes à la fin de la guerre civile. Après notre victoire dans la guerre civile, Ma Jiyuan s'est rapproché du gouvernement central et il a autorisé les réformes entreprises à Nankin dans le nord-ouest, contrairement à son père Ma Bufang. Ma Jiyuan a ensuite été nommé gouverneur du Nord-Ouest, son père ayant été envoyé outre-mer en Arabie Saoudite en tant qu'ambassadeur pour représenter la Chine.§!"
 POLITICS_HUANG_SHAOHONG_50s_WARLORDS_DESC:0 "§g§!"
 POLITICS_ZHAO_HENGTI_50s_WARLORDS_DESC:0 "§gBien qu'il ait été évincé du pouvoir en 1926 par Tang Shengzhi, Zhao Hengti sortit relativement rapidement de sa retraite pour devenir président de l'Assemblée provisoire du Hunan pendant la Seconde guerre sino-japonaise. Après la guerre, il rejoint le Kuomintang et devient un proche allié de Chiang Kai-shek. Zhao est réintégré dans la politique locale du Hunan. L'héritage de la Constitution fédéraliste de la province du Hunan fait de lui l'un des hommes politiques les plus populaires de la région et grâce au retrait de Cheng Qian du pouvoir par Nanjing, Zhao est désormais à nouveau gouverneur par intérim du Hunan.§!"


 
 
