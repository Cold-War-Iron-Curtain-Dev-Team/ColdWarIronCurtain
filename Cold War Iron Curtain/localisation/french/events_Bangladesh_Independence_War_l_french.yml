l_french:
 Operation_Searchlight.1.d:0 "Le quartier général de Rawalpindi réfléchit actuellement à la manière de planifier une solution sécuritaire à l'impasse politique actuelle. L'une des questions les plus importantes à considérer est de savoir quoi faire avec les soldats bengalis, en particulier les membres des East Bengal Rifles. Si nous devons lancer une opération de sécurité pour sauver le pays, les soldats bengalis ne seront peut-être pas dignes de confiance pour accomplir leurs tâches. Ce sont surtout les infiltrés qui s'inquiètent. Le Commandement Est pense pouvoir élaborer un plan pour désarmer et détenir ces soldats jusqu'à ce que la crise soit résolue. Cependant, certains au GHQ affirment que les soldats bengalis sont hautement entraînés et idéologiquement dévoués au Pakistan. Ils soutiennent que nous devrions plutôt utiliser ces forces dans le cadre de l'opération de sécurité visant à sécuriser la frontière et non promouvoir l'idée d'une opération anti-bengalie."
 Operation_Searchlight.2.d:0 "Le quartier général de Rawalpindi réfléchit actuellement à la manière de planifier une solution sécuritaire à l'impasse politique actuelle. L'un des plus grands problèmes est de savoir comment démanteler la Ligue Awami et ses partisans. En étroite collaboration avec le Commandement oriental et les agences de renseignement, une liste de leurs principaux membres est en cours d'élaboration. Leurs mouvements et leur localisation sont également suivis. Ainsi, si une opération est lancée, nos forces interviendront pour les arrêter tous en même temps. Idéalement, une telle opération décapiterait les dirigeants des mécréants anti-étatiques."
 Operation_Searchlight.3.d:0 "Il est devenu évident que Cheikh Mujibur Rahman et Zulfikar Bhutto étaient incapables de se réconcilier. De ses dernières conversations avec les deux hommes, le président Yahya a conclu que la situation était irrécupérable. Il est clair que Rahman réunira l'Assemblée nationale sans boycotter les membres du Pakistan occidental et adoptera les Six Points ou lancera une insurrection. Dans un récent discours, il a appelé les Bengalis à lancer une campagne de désobéissance civile pour la liberté et à transformer chaque foyer en forteresse. Il est clair que des mesures doivent être prises. Avant que le président Yahya ne quitte Dacca, il a informé en privé le commandement oriental de lancer l'opération Searchlight pour arrêter cette marche vers l'anarchie et la guerre civile. Alors que le président quittait la ville, les troupes pakistanaises à travers le Pakistan oriental ont lancé une opération simultanée pour mettre fin à la menace que la Ligue Awami pesait sur l'intégrité du Pakistan."
 Operation_Searchlight.4.d:0 "L'Université de Dacca a longtemps été un cloaque de résistance de la jeunesse et d'idéologie anti-étatique. Ces derniers jours, les étudiants ont été observés par la presse alors qu'ils participaient à des exercices militaires sur le campus. La faculté a largement soutenu un tel militantisme et sécuriser le campus et y rechercher des armes était l'un des principaux objectifs de la première nuit de l'opération Searchlight. Alors que d'autres unités sécurisaient Dacca, les 22e Baloutches et 32e Punjab furent chargés de s'emparer du campus. L'opération a été un succès, les professeurs principaux ont été rapidement arrêtés, mais notre tentative de capturer les dirigeants étudiants dans les dortoirs a conduit à une résistance armée des étudiants. Nos forces ont donné une réponse appropriée, écrasant facilement la résistance et sécurisant le campus. Les premiers rapports font état d'au moins une centaine de malfaiteurs neutralisés et d'armes saisies. Le campus est sécurisé."
 Operation_Searchlight.5.d:0 "Au cours de l'opération Searchlight, nos forces ont réussi à sécuriser l'université de Dacca, en arrêtant des militants dangereux, en neutralisant des mécréants armés et en capturant du matériel d'entraînement des militants. Cependant, nous sommes confrontés à de nombreuses réactions négatives de la part de la population locale et de la presse internationale. Les médias rapportent que nos forces ont tiré sans discernement, tuant ou exécutant au moins une centaine d'étudiants et de professeurs. En particulier, les images de notre utilisation de chars pour pénétrer dans certains dortoirs sont particulièrement condamnées. Indépendamment de cette réaction négative, nos forces ont agi sous l'ordre d'utiliser tous les moyens nécessaires pour écraser rapidement l'insurrection qui se développait sur le campus."
 Operation_Searchlight.6.d:0 "Lorsque l'opération Searchlight a commencé, nous avons déployé des bataillons à travers Dacca pour sécuriser la ville. Dans tout le Pakistan oriental, d'autres unités sont entrées en action, l'une des priorités étant de capturer les hauts dirigeants de la Ligue Awami afin de décapiter la résistance potentielle. Cette opération a été globalement réussie. Même si nous avons capturé un certain nombre de hauts fonctionnaires dans les premières heures, il semble que les fonctionnaires de niveau inférieur aient pu avoir vent de l'opération et se sont enfuis. Nous pensons qu'un certain nombre d'entre eux sont peut-être déjà en route vers l'Inde ou se cachent dans les zones rurales, coordonnant sans aucun doute une réponse militante contre l'État. Quoi qu'il en soit, nos officiers sont convaincus que la Ligue Awami a été largement démantelée par ces arrestations."
 Operation_Searchlight.7.d:0 "Cheikh Mujibur Rahman, chef de la Ligue Awami et cerveau du complot visant à détruire le Pakistan, a été arrêté à son domicile par un peloton de soldats des forces spéciales. Nos forces se sont déplacées rapidement, n'ont rencontré aucune résistance et ont pris Rahman sans incident. Il est déjà embarqué dans un avion à destination du Pakistan occidental où il sera jugé pour son complot anti-étatique. Les premiers rapports indiquent que Rahman est choqué par la tournure des événements et demande à parler avec le président Yahya Khan pour résoudre la crise. Il prétend soutenir l'action militaire visant à protéger le Pakistan de la guerre civile, mais insiste sur le fait qu'il ne fait partie d'aucun complot. Il s'agit clairement d'un stratagème destiné à gagner de la sympathie et peut-être à orchestrer son évasion. Quoi qu'il en soit, il sera réglé une fois arrivé à sa prison de Lyalpur."
 Operation_Searchlight.8.d:0 "Dans le cadre de l'opération Searchlight, les officiers et soldats du Pakistan occidental des bataillons East Bengal Rifles ont décidé de désarmer leurs camarades officiers et soldats bengalis. Cette partie de l'opération s'est avérée infructueuse. Dans certains cas, nos hommes ont réussi à désarmer et les Bengalis ont regagné leurs casernes. Dans certains cas, les soldats bengalis ont refusé de désarmer et ont résisté, ce qui a conduit à leur destruction par nos forces. Cependant, dans certains cas, notamment dans le cas du 2e East Bengal Rifles, ces Bengalis ont agi les premiers et ont massacré nos hommes avant que le désarmement puisse avoir lieu. Nous avons dû envoyer une brigade pour rétablir l'ordre, découvrant les scènes grizzlys de la façon dont ils massacraient nos hommes. Lorsque la nouvelle de l'escalade de la violence est parvenue aux casernes, de nombreux Bengalis qui s'étaient rendus pacifiquement ont paniqué et ont fui dans la jungle. Les East Bengal Rifles sont neutralisés, mais de nombreux soldats et officiers hautement qualifiés se sont enfuis dans la jungle."
 Operation_Searchlight.9.d:0 "Au cours de l'opération Search Light, le Commandement de l'Est a déployé ses forces à travers la province pour sécuriser ses objectifs. Les six bataillons des East Bengal Rifles étaient cependant des unités uniques dans la mesure où ils étaient en grande partie des soldats bengalis. Pour réduire le risque de révolte, ils ont été déployés en grande partie pour sécuriser des installations stratégiques en dehors des grandes villes ou des zones frontalières clés. Cela réduisait le risque de mettre les soldats en position de tirer sur leurs compatriotes Bengalis. Jusqu'à présent, les East Bengal Rifles ont admirablement accompli leur tâche. Cependant, à mesure que la nouvelle des violences survenues lors de l'opération Searchlight se répandait, un petit nombre de soldats et d'officiers ont fui leurs unités. Ces hommes chercheront sans aucun doute à rejoindre les mécréants anti-étatiques, mais dans l'ensemble, les East Bengal Rifles font leur devoir de loyaux serviteurs du Pakistan."
 Operation_Searchlight.10.d:0 "Durant les premières heures de l'opération Searchlight, l'armée pakistanaise a cherché à neutraliser les foyers potentiels de résistance bengali et à arrêter les dirigeants potentiels d'une telle insurrection. Dans la phase initiale, nos forces ont fait face à des étudiants mal armés et mal entraînés ainsi qu'à une certaine résistance armée de la part des cadres de la Ligue Awami. Ils n'ont pas fait le poids face à nos forces, mais ils ont fui soit vers l'Inde, soit plus profondément dans la jungle. Malheureusement, un certain nombre de dirigeants de niveau intermédiaire et de haut rang de la Ligue Awami et leurs alliés ont réussi à s'échapper en Inde. En outre, un certain nombre de soldats et d'officiers bengalis au sein de l'armée ont déserté leurs postes et rejoint le mouvement de résistance grandissant. Ces gens, ainsi que les Bengalis locaux séduits par la propagande ennemie, forment des bandes de guérilla. Ils bénéficient déjà du soutien des Bengalis qui appellent ces combattants Mukti Bahini, ce qui signifie combattants de la liberté."
 Operation_Searchlight.11.d:0 "L'incapacité à désarmer efficacement les bataillons East Bengal Rifles ou les bataillons paramilitaires East Pakistan Rifles a conduit à des batailles rangées et à des massacres des deux côtés. Cependant, de nombreux soldats et officiers rebelles bengalis ont réussi à s'échapper et ont trouvé leur chemin vers l'Inde ou ont rejoint les bandes de Mukti Bahini qui se forment au plus profond de la jungle. Les officiers traîtres travaillent avec les dirigeants de la Ligue Awami en Inde pour mieux coordonner le Mukti Bahini et installer des camps d'entraînement. À notre grand malheur, notre ennemi bénéficiera de notre entraînement et de nos anciens soldats, ce qui améliorera son efficacité opérationnelle."
 Operation_Searchlight.12.d:0 "Au cours de l'opération Searchlight, de nombreux efforts ont été déployés pour placer les officiers et les unités bengalis dans des positions et des zones où ils n'auraient pas à être directement impliqués dans les opérations de combat. Cela a été fait pour empêcher la Ligue Awami, anti-étatique, et ses partisans malavisés de tenter de provoquer une rébellion dans ses rangs. Ces unités se comportèrent admirablement et exécutèrent en général leurs ordres. Cependant, dans les jours qui ont suivi, ils ont entendu des rapports faisant état de massacres et de violences présumés, en grande partie de la propagande ennemie, mais quoi qu'il en soit, cela a eu un effet. Un certain nombre d'officiers bengalis ont déserté pour rejoindre les groupes Mukti Bahini ou la Ligue Awami en Inde. Certains soldats ont également fait défection, mais cela se fait au compte-goutte. À ce stade, nous pouvons nous attendre à davantage de désertions, mais nous avons redéployé nos forces à tel point qu'il n'y a plus d'unités à majorité bengali en place au Pakistan oriental, une révolte est donc peu probable."
 Operation_Searchlight.13.d:0 "Alors que nos forces au Pakistan oriental sont confrontées à une résistance armée et à une désobéissance civile croissantes, le gouvernement a autorisé le commandement oriental à agrandir les tribunaux de la loi martiale. Cela permettra aux autorités sur le terrain de traduire rapidement les militants présumés ou les mécréants anti-étatiques devant les tribunaux où un verdict rapide pourra être rendu. Les tribunaux civils sont trop lents et manquent d'expérience pour traiter ce type d'affaires. Plus important encore, cela nous permettra de mener des procès plus rapides contre les nombreux Bengalis actuellement détenus dans des camps de détention. Malheureusement, ces camps débordent, ce qui rend les conditions de vie misérables, donne aux militants la possibilité de manipuler leur sortie et s'aliène les familles des personnes détenues. Les nouvelles réglementations de la loi martiale renforceront notre capacité à déraciner les mécréants."
 Operation_Searchlight.14.d:0 "Le Commandement oriental s'est toujours plaint d'une pénurie d'unités militaires, mais cela ne peut être résolu car l'accès au Pakistan oriental est difficile et il existe des besoins en matière de sécurité au Pakistan occidental. Cela laisse nos forces dangereusement étirées car elles doivent faire face au Mukti Bahini, à la loi et à l'ordre, ainsi qu'à la longue frontière avec l'Inde. À ces problèmes s'ajoutent les éléments bengalis au sein de l'armée et de la police qui ont fait défection ou ne sont pas fiables. Il existe un besoin désespéré de mettre en place davantage de forces auxiliaires pour aider l'armée dans sa campagne contre les Mukti Bahini. Heureusement, les principaux partis religieux du Pakistan oriental sont fidèles et ont appelé leurs partisans à se joindre à notre cause. Avec cet afflux de main-d'oeuvre, nous avons créé les Forces Moudjahid, ce sont des Bengalis et des Biharis pro-pakistanais désireux d'exercer des fonctions auxiliaires qui libéreront nos forces pour mener des opérations militaires."
 Operation_Searchlight.15.d:0 "L'opération Searchlight a vu la situation au Pakistan oriental se transformer en une quasi-guerre civile, l'armée pakistanaise étant engagée dans une campagne contre les Mukti Bahini, qui militent pour un Bangladesh indépendant. Au sein de la population du Pakistan oriental, il existe d'autres divisions, même si le Mukti Bahini bénéficie du soutien d'une large partie des Bengalis, les partis religieux musulmans et leurs partisans soutiennent le gouvernement pakistanais. En outre, un grand nombre de Biharis, réfugiés venus d'Inde lors de la partition, sont également largement fidèles au Pakistan. Cela a conduit à des rapports faisant état de massacres brutaux perpétrés par les communautés fidèles au Pakistan et à l'armée pakistanaise elle-même. Le gouvernement pakistanais rejette ces affirmations, mais il existe des preuves irréfutables selon lesquelles les hindous bengalis sont ciblés par leurs voisins musulmans, le gouvernement refusant d'intervenir. Ces prétendus massacres de Bengalis, étayés par des interviews et quelques photos, sont accablants pour le gouvernement pakistanais qui semble pour le moins complice en n'empêchant pas ces événements de se produire."
 Operation_Searchlight.16.d:0 "Biharis est le terme collectif utilisé pour désigner les réfugiés musulmans d'Inde qui ont déménagé au Pakistan oriental pendant la partition. Ces familles ont en grande partie abandonné leurs maisons et communautés ancestrales pour commencer une nouvelle vie au Pakistan. Pour eux, ils rejettent un Bangladesh indépendant et sont restés largement fidèles à l'État pakistanais et à sa campagne contre les Mukti Bahini. Depuis le début de l'opération Searchlight, le Pakistan oriental a sombré dans le chaos alors que la campagne militaire pakistanaise contre les Mukti Bahini est éclipsée par les informations faisant état de massacres ethniques survenant à travers le territoire. Bien que la presse internationale ait largement couvert les massacres présumés des Bengalis, elle a jusqu'à présent évité les massacres présumés perpétrés contre les Biharis par les Mukti Bahini ou par leurs voisins bengalis. L'armée pakistanaise a récemment rendu public plusieurs sites présumés de massacres et des journalistes ont interviewé des survivants, actuellement protégés dans les cantonnements de l'armée pakistanaise. Ce qui est clair pour beaucoup, c'est que les combats au Pakistan oriental se déroulent à plusieurs niveaux, entraînant des souffrances massives."
 Operation_Searchlight.17.d:0 "Le commandement oriental de Dacca continue de faire face à la myriade de défis auxquels ses forces sont confrontées, notamment en termes de lutte contre une insurrection, de sécurisation de la frontière indienne et d'administration de la province. Le gouvernement local et la bureaucratie ne fonctionnent pratiquement pas, car beaucoup ont fui pour rejoindre les rebelles ou refusent de servir par crainte de représailles. Cependant, le Pakistan peut compter sur les Biharis et sur bon nombre de Bengalis les plus religieux qui restent attachés à l'idéologie du Pakistan. En outre, de nouvelles forces auxiliaires sont mobilisées pour améliorer l'ordre public et assurer la sécurité des représentants du gouvernement. Après une conférence avec des fonctionnaires, il a été décidé que des Pakistanais loyalistes seraient nommés à des postes clés et dotés de pouvoirs étendus, notamment le contrôle des milices loyalistes locales pour assurer la continuité de la gouvernance au Pakistan oriental. Certains craignent qu'une telle décision n'alimente la corruption ou des représailles violentes. Cependant, nous n'avons pas le choix et devons restaurer la gouvernance par tous les moyens."
 Operation_Searchlight.18.d:0 "Les médias internationaux ont récemment souligné que parmi les millions de Bengalis fuyant le Pakistan oriental vers l'Inde, un grand nombre d'entre eux appartiennent à la minorité hindoue. Ces réfugiés racontent des histoires de brutalité et de violence, principalement perpétrées par des voisins et, dans certains cas, par des unités de l'armée pakistanaise. Le gouvernement indien qualifie la situation croissante des réfugiés de crise mondiale et condamne le gouvernement pakistanais pour sa campagne d'une extrême brutalité contre son propre peuple. Un porte-parole de la Ligue Awami a déclaré aux journalistes que les réfugiés et leurs histoires sont la preuve d'une campagne systématique de génocide menée contre le peuple bengali. Le gouvernement pakistanais nie catégoriquement ces accusations, insistant sur le fait que ses forces ne ciblent pas les civils, notant que les médias ignorent les actes de violence et les massacres perpétrés contre les civils pro-pakistanais par le Mukti Bahini. À l'échelle internationale, de nombreux artistes, musiciens et hommes politiques de premier plan appellent le Pakistan à mettre un terme à ce qu'ils qualifient de campagne de violence insensée."
 Operation_Searchlight.19.d:0 "Le nombre de réfugiés affluant au Bengale se compte par millions, et certains prédisent que ce nombre pourrait éventuellement dépasser les dix millions. Ces réfugiés fuient les violences actuelles qui ravagent le Pakistan oriental, où les Mukti Bahini continuent de lutter pour leur indépendance du gouvernement pakistanais. À ce conflit s'ajoutent également des affrontements violents entre les Bengalis indépendantistes et les Bengalis et Biharis pro-pakistanais. Notre gouvernement continue de faire connaître les atrocités commises au Pakistan et s'engage à soutenir les réfugiés. Cependant, ces chiffres mettent à rude épreuve nos ressources et des affrontements ont été signalés entre les réfugiés frustrés et la population locale. Certains responsables suggèrent que le Pakistan facilite le mouvement des réfugiés, en particulier des réfugiés hindous, pour l'aider à débarrasser la province de ce qu'il considère comme des éléments déloyaux. Nous devons suivre la situation de près pour élaborer une réponse visant à mettre fin au flux de réfugiés et à la violence."
 Operation_Searchlight.20.d:0 "La situation au Pakistan oriental devient intolérable. En particulier, il est clair que l'Inde envisage d'exploiter la crise à son avantage. Plus le temps passe, plus l'Inde a le temps de nous détruire à loisir. Nous avons toujours soutenu que la défense de l'Est se trouvait à l'Ouest ; le moment est peut-être venu de mettre cette doctrine en pratique. L'armée de l'air pakistanaise a proposé de lancer un assaut surprise sur les bases aériennes tout au long de la frontière avec l'Inde et de paralyser sa puissance aérienne avant le premier tir. Une fois l'armée de l'air indienne neutralisée, nos propres forces devraient être en mesure de l'emporter avec supériorité aérienne. Bien que le président Yahya Khan et ses proches alliés semblent apprécier ce plan, certains officiers ont exprimé des doutes sur la capacité d'une telle opération à réaliser ses ambitions. Une décision doit être prise."
 Operation_Searchlight.21.d:0 "Le gouvernement et le peuple indiens ont été stupéfaits d'apprendre que des bombardiers pakistanais visaient près d'une douzaine d'aérodromes à la frontière occidentale. Heureusement, de nombreux chasseurs étaient dans leurs hangars renforcés, minimisant ainsi les dégâts causés par les avions pakistanais. Le gouvernement pakistanais a publié une déclaration appelant son peuple à s'unir contre l'agression indienne. Pour notre gouvernement, cette frappe marque le début de la guerre et nous donne la légitimité internationale nécessaire pour traiter fermement l'armée pakistanaise, en particulier au Pakistan oriental."
 Operation_Searchlight.22.d:0 "L'armée de l'air pakistanaise a mené ses attaques éclair contre les aérodromes indiens, dans l'espoir de détruire ses avions lors de la guerre à venir. Cependant, les premiers rapports ne sont pas bons. Bien que nos avions aient atteint leurs objectifs et se comportent admirablement, leurs bombes ont eu peu d'effet sur les aérodromes ou sur les avions indiens. Les pistes endommagées par les bombes sont déjà rapidement réparées. Il semble que les avions indiens aient été protégés et nous n'avons pas engagé un nombre écrasant d'avions qui auraient pu avoir plus d'effet. Quoi qu'il en soit, nos avions sont prêts à intervenir et nous devons nous préparer à la guerre !"
 Operation_Searchlight.23.d:0 "Dans une nouvelle choquante en provenance d'Asie du Sud, des avions de combat en provenance du Pakistan ont mené des frappes sur les principaux aérodromes indiens, certains frappant jusqu'à 400 kilomètres de profondeur en Inde. Bien que le gouvernement pakistanais affirme n'avoir subi aucune perte et infligé de lourds dégâts, le gouvernement indien dément cette information. Les frappes, le long de la frontière occidentale, ont surpris les analystes qui pensaient que ce serait l'Inde qui agirait le long de la frontière orientale du Pakistan, et non une attaque pakistanaise. Les tensions se sont intensifiées à mesure que les opérations militaires pakistanaises contre les rebelles de Mukti Bahini luttant pour l'indépendance du Bengale au Pakistan oriental s'intensifiaient, provoquant la fuite de millions de réfugiés vers l'Inde. Le gouvernement indien affirme que le Pakistan est engagé dans une campagne de brutalité insensée contre les Bengalis qui réclament simplement la liberté. Les Pakistanais prétendent cependant que l'Inde alimente le conflit et s'engage dans son propre renforcement militaire, ce qui incite le Pakistan à agir. Quoi qu'il en soit, il semble qu'un conflit militaire à grande échelle ait commencé."

 BAN_Liberation_War.1.d:0 "La situation au Pakistan oriental est intolérable. L'armée indienne, avec le soutien du gouvernement et du peuple, est prête à faire le nécessaire pour arrêter le gouvernement pakistanais. Les médias internationaux et leur soutien sont aux côtés de notre gouvernement, nombreux à condamner la violence brutale qui se produit au Pakistan oriental. Cependant, le Cabinet doit décider des objectifs de nos forces et de notre gouvernement. Beaucoup soutiennent que l'objectif de la guerre devrait être uniquement la libération du Bangladesh et l'autonomisation des Bengalis au Pakistan oriental. D'autres soutiennent que nous devrions également ajouter des objectifs le long de nos frontières occidentales et profiter de l'occasion pour résoudre également le Cachemire. Si nous poursuivons cet objectif, nous risquons de perdre la position internationale et d'impliquer la Chine ou les États-Unis."
 BAN_Liberation_War.2.d:0 "Une récente réunion de hauts dirigeants et de dirigeants militaires a récemment convenu d'envisager d'élargir les objectifs du conflit actuel pour inclure la libération du Cachemire de l'occupation pakistanaise. Le Premier ministre a récemment conclu des discussions avec de hauts responsables diplomatiques et militaires sur l'extension du conflit aux objectifs du Cachemire. Les diplomates étaient catégoriques sur le fait que garder l'objectif concentré sur la libération du Pakistan oriental et la garantie des droits des Bengalis garantirait le soutien international et maintiendrait une position morale élevée. Même si le Cachemire semble mûr pour notre intervention, l'inclure dans le conflit actuel érodera le soutien international et pourrait offrir au Pakistan de nouvelles lignes de soutien vitales. Les chefs militaires ont déclaré qu'ils soutiendraient toutes les directives proposées par le gouvernement, ajoutant que même si la campagne au Pakistan oriental constitue la principale priorité, les forces armées indiennes sont plus que capables d'ajouter le Cachemire comme cible."
 BAN_Liberation_War.3.d:0 "Nos sources diplomatiques et notre analyse des récentes déclarations du gouvernement indien indiquent que celui-ci pourrait chercher à faire du récent conflit au Pakistan oriental un tremplin pour s'emparer des territoires du Cachemire et bouleverser le statu quo actuel. Si l'Inde devait solidifier et affaiblir gravement le Pakistan en s'emparant du Cachemire et en obtenant l'indépendance du Pakistan oriental, cela pourrait conduire à un déséquilibre stratégique en Asie du Sud. L'Inde n'aurait aucun adversaire pour freiner son hégémonie et notre propre position dans la région s'en trouverait gravement affaiblie. Forts de ces considérations, nous envoyons un message privé au gouvernement indien exigeant l'assurance que l'Inde ne cherchera pas une résolution unilatérale par la force armée du conflit du Cachemire alors qu'elle mène une guerre contre le Pakistan."
 BAN_Liberation_War.4.d:0 "Des analystes chevronnés de la CIA et du Département d'État ont fourni des rapports indiquant que le gouvernement indien pourrait utiliser la guerre actuelle avec le Pakistan comme moyen de s'emparer du Cachemire. Une telle action ne semble pas justifiée étant donné que le conflit porte sur le soulèvement bengali au Pakistan oriental. Plus important encore, cela mettrait fin au statu quo au Cachemire et entraînerait des problèmes à long terme pour la région. Dans cet esprit, des pressions sont exercées pour que le président fasse part de nos préoccupations au Premier ministre indien et lui demande une déclaration concrète selon laquelle la saisie de pans de territoire au Cachemire contrôlé par le Pakistan ne fait pas partie du plan. D'autres conseillers soulignent les échecs du Pakistan dans la résolution du problème du Pakistan oriental et son impopularité actuelle auprès de la communauté internationale et nous exhortent à quitter la situation et à voir comment elle évolue."
 BAN_Liberation_War.5.d:0 "Le gouvernement chinois a déjà fait plusieurs déclarations hostiles condamnant nos actions au Pakistan oriental. Cependant, nous avons récemment reçu un message privé dans lequel les Chinois expliquaient sans équivoque que si nous essayions de repousser le Pakistan hors du Cachemire, la Chine considérerait cela comme une attaque contre son propre territoire. Cette déclaration puissante est peut-être un bluff, mais le haut commandement militaire affirme que mener la guerre sur les deux ailes du Pakistan et faire face à une incursion chinoise pourrait épuiser dangereusement l'armée. Forts de ces considérations, nous avons renvoyé une note à la Chine, insistant sur le fait que nous n'avons pas l'intention de modifier les positions territoriales au Cachemire. Le Premier ministre a également ordonné à l'armée de mettre un terme à ses projets de libération définitive du Cachemire et de concentrer toute son attention sur la libération du Bangladesh."
 BAN_Liberation_War.6.d:0 "Le premier ministre a reçu un appel téléphonique du président des États-Unis. Le Président a demandé à être informé de nos intentions. Le Premier ministre a déclaré au président que l'Inde attendait tranquillement depuis des mois que le Pakistan mette fin à sa campagne brutale au Pakistan oriental ou que la communauté internationale intervienne. Cependant, la crise croissante des réfugiés, l'épuisement économique et les craintes de génocide ont forcé l'Inde à agir. Le président a déclaré qu'il appréciait le point de vue du gouvernement indien et que les États-Unis pouvaient comprendre la façon dont la situation s'est détériorée en ce qui concerne le Pakistan oriental et l'implication de l'Inde. Cependant, il a fait part de ses inquiétudes concernant les mouvements militaires au Cachemire et a déclaré que les États-Unis considéreraient toute tentative militaire d'expansion du territoire du Cachemire par l'Inde comme un acte d'agression flagrant et obligeraient son gouvernement à considérer ses options. Le premier ministre a simplement exprimé son appréciation du point de vue américain et a mis fin à l'appel. La marine a ensuite informé le Premier ministre des manoeuvres navales américaines près de l'océan Indien. Ne voulant pas perdre le soutien international ni aider le Pakistan à attirer une intervention d'une superpuissance, le Premier ministre a ordonné à l'armée de mettre fin à toute planification ou opération visant à chasser le Pakistan du Cachemire."
 BAN_Liberation_War.7.d:0 "Le gouvernement indien a contacté les Nations Unies pour la mise en oeuvre d'un cessez-le-feu afin de mettre fin aux combats actuels. De toute évidence, ils ont le sentiment que rien d'autre ne peut être réalisé ou gagné militairement pour eux et sont prêts à mettre fin à la guerre. Nos propres forces ont combattu avec ténacité et courage pour la nation et l'Islam. Il appartient désormais aux hauts dirigeants de réagir. Nos diplomates disent que si nous voulons essayer d'améliorer notre position sur le terrain, ils pourraient retarder le cessez-le-feu jusqu'à dix jours. Cependant, si nous n'avons rien d'autre à réaliser ou à rectifier dans ce délai, nous pouvons nous mettre d'accord et entamer le processus de cessation immédiate des combats."
 BAN_Liberation_War.8.d:0 "Après notre victoire au Bangladesh, nous avons arrêté des dizaines de milliers de responsables de l'armée, du gouvernement, des services de renseignement et de la police pakistanais. Le ministre de l'Intérieur et le ministre de la Défense envisagent d'héberger ces prisonniers de guerre dans des camps à travers l'Inde. Répartir les prisonniers permettrait d'éviter des évasions massives ou des opérations de sauvetage clandestines. Garder ces prisonniers nous assure une solide monnaie d'échange dans les négociations futures avec le Pakistan. Le Bangladesh a demandé que nous lui remettions cinq cents fonctionnaires et officiers pakistanais pour crimes de guerre. Cependant, notre haut commandement est catégorique : nous ne le faisons pas, ce n'est donc pas une option. Certains conseillers suggèrent que nous rendions la plupart des prisonniers de guerre, cela améliorerait considérablement les relations avec le Pakistan et nous aiderait à établir une nouvelle ère pour nos liens tout en conservant notre monnaie d'échange."
 BAN_Liberation_War.9.d:0 "Après notre libération du Bangladesh, des bandes itinérantes de Mukti Bahini et d'autres groupes de Bengalis se sont vengés de prétendus collaborateurs pakistanais. Nos propres forces ont assuré la protection des responsables et du personnel militaire pakistanais capturés, mais les représailles suscitent une attention médiatique très négative. Le gouvernement intérimaire du Bangladesh insiste sur le fait qu'il maintiendra l'ordre public. Cependant, nos chefs militaires à Dacca estiment que ce n'est pas une attente raisonnable. Ils demandent que nous autorisons l'armée indienne à intervenir et à maintenir l'ordre public jusqu'à ce que le gouvernement bangladais soit prêt à prendre les rênes. Nous devons décider d'accepter cette demande, en nous aliénant les Bengalis, ou de laisser la situation telle qu'elle est."
 BAN_Liberation_War.10.d:0 "Lors d'une cérémonie publique, l'armée et le gouvernement indiens ont officiellement remis la souveraineté à la nouvelle République du Bangladesh. Les Bengalis de tout le Bangladesh ont accueilli leur liberté avec des célébrations massives à travers le pays. Le drapeau bangladais flotte sur presque tous les foyers. Certains membres de la délégation ont été contrariés par le manque d'appréciation accordé au gouvernement indien, mais dans l'ensemble, la cérémonie a été un énorme succès. Le nouveau gouvernement bangladais a promis la prospérité à son peuple, une véritable reconstruction du pays et a exigé que l'Inde lui remette les criminels de guerre pakistanais présumés. Malgré ces premières tensions, nous espérons une ère de paix et de prospérité avec notre nouveau voisin."
 BAN_Liberation_War.11.d:0 "Les dirigeants du Pakistan sont arrivés à la station de Simla pour s'entretenir avec le gouvernement indien après la conclusion de la dernière guerre indo-pakistanaise. Les Pakistanais seraient dans une position de négociation très faible car ils ont déjà perdu le Pakistan oriental et l'Inde occupe une position clairement dominante. Pour le Pakistan, leur objectif semble être le retour de leurs prisonniers de guerre et la préservation du statu quo au Cachemire. La seule monnaie d'échange pakistanaise est Cheikh Mujibur Rahman, qui reste sous leur garde. Cependant, la pression internationale s'accroît pour qu'ils le libèrent au Bangladesh, ce qui érode rapidement cet avantage. Quant à l'Inde, elle serait intéressée à utiliser les prisonniers de guerre et leur victoire militaire pour imposer un changement concernant le Cachemire et garantir que le Pakistan reconnaisse le Bangladesh."
 BAN_Liberation_War.12.d:0 "Lors des premiers pourparlers, le Pakistan a demandé le retour de ses prisonniers de guerre. Les Pakistanais citent la Convention de Genève qui appelle au rapatriement immédiat des prisonniers de guerre après la fin des combats. Nous avons informé les Pakistanais que certains de ces prisonniers de guerre sont accusés de crimes de guerre par le Bangladesh et que le refus persistant de reconnaître le Bangladesh implique que le conflit n'est pas résolu. Cela semble être l'occasion pour nous de faire pression sur le Pakistan pour qu'il libère Cheikh Mujibur Rahman et reconnaisse le Bangladesh en échange du rapatriement des prisonniers de guerre."
 BAN_Liberation_War.13.d:0 "Les Indiens nous ont fermement informés que le rapatriement des prisonniers de guerre ne peut se faire que si notre gouvernement libère Cheikh Mujibur Rahman et reconnaît le Bangladesh. Compte tenu de la pression à laquelle nous sommes confrontés pour maintenir Mujibur en détention, nous n'avons d'autre choix que de l'accepter. Toutefois, nous informerons les Indiens que nous sommes en principe d'accord avec cette demande. Par notre réponse positive, nous appellerons également l'Inde à rétablir les frontières d'avant-guerre le long de nos frontières occidentales. Cela implique de maintenir le statut du Cachemire tel qu'il était avant le début du conflit."
 BAN_Liberation_War.14.d:0 "Les Pakistanais ont réagi positivement à notre proposition et nous pouvons nous attendre à la libération prochaine de Cheikh Mujibur Rahman. Nous entamerons le processus de rapatriement des prisonniers de guerre, mais nous le ferons lentement et seulement lorsque le Pakistan normalisera ses liens avec le Bangladesh. Les Pakistanais ont également appelé au rétablissement des frontières d'avant-guerre et au maintien du Cachemire tel qu'il était une heure avant le début des combats. Les efforts initiaux visant à les forcer à accepter la frontière du Cachemire comme permanente et résolue ont échoué. Les Pakistanais insistent sur le fait que s'ils acceptaient une telle décision, il y aurait un risque soit d'une révolution, soit d'un coup d'État radical. Nos propres analystes sont d'accord, c'est pourquoi nous insisterons plutôt pour que le Pakistan accepte de résoudre pacifiquement le Cachemire en tant que question bilatérale entre nous. Cela mettra fin à leur insistance persistante à impliquer les Nations Unies et résoudra essentiellement le conflit en notre faveur."
 BAN_Liberation_War.15.d:0 "Le gouvernement indien nous a informé qu'il n'accepterait un retour au statu quo à la frontière occidentale que si nous acceptions d'accepter le Cachemire comme une question bilatérale. Nous avons passé beaucoup de temps à travailler avec les Indiens pour rédiger cet aspect dans l'accord final. Les Indiens ont accepté une version qui nous semble suffisamment vague pour nous permettre une certaine flexibilité avec le Cachemire et les Nations Unies. Cependant, à partir de maintenant, l'Inde insistera sur le fait que le conflit est un problème bilatéral. Certains de nos conseillers juridiques principaux notent également que si l'on en arrive à cette question, nous pouvons faire valoir auprès de la communauté internationale que ce prochain traité a été conclu sous la contrainte et qu'il n'est pas contraignant. Compte tenu de notre situation actuelle, c'est la meilleure approche possible. Mais à l'avenir, le Pakistan retrouvera sa gloire et mettra fin à cette injustice."
 BAN_Liberation_War.16.d:0 "Les gouvernements pakistanais et indien ont convenu de signer un accord pour mettre fin à leur récent conflit armé. Les deux parties se sont mises d'accord sur le principe du retour des prisonniers de guerre et du rétablissement des frontières d'avant-guerre à l'Ouest. Bien que la formulation concernant le Bangladesh soit vague, on pense que le Pakistan a accepté de reconnaître le pays et de libérer Cheikh Mujibur Rahman. Le changement le plus important est une déclaration qualifiant le conflit du Cachemire de question bilatérale entre les deux États. Après la signature du traité, le gouvernement indien a affirmé que cela signifiait que les résolutions des Nations Unies n'étaient plus sur la table concernant le Cachemire. Les Pakistanais, en revanche, ont déclaré que le libellé indique simplement que les deux parties travailleront ensemble de manière pacifique pour résoudre le conflit, mais qu'il n'exclut pas explicitement le rôle de la communauté internationale. Le peuple pakistanais a ressenti une immense humiliation à la suite du traité, mais la presse rapporte que les résultats n'ont pas été aussi dévastateurs que beaucoup le craignaient. Le gouvernement indien fait déjà l'objet de critiques de la part de l'opposition, qui lui reproche d'avoir gâché la victoire militaire dans les négociations de paix. Le temps nous dira quels seront les résultats finaux."
 BAN_Liberation_War.17.d:0 "Les gouvernements pakistanais et indien ont convenu de signer un accord pour mettre fin à leur récent conflit armé. Les deux parties se sont mises d'accord sur le principe du retour des prisonniers de guerre et du rétablissement des frontières d'avant-guerre à l'Ouest. Bien que la formulation concernant le Bangladesh soit vague, on pense que le Pakistan a accepté de reconnaître le pays et de libérer Cheikh Mujibur Rahman. Le changement le plus important est une déclaration qualifiant le conflit du Cachemire de question bilatérale entre les deux États. Après la signature du traité, le gouvernement indien a affirmé que cela signifiait que les résolutions des Nations Unies n'étaient plus sur la table concernant le Cachemire. Le gouvernement indien fait déjà l'objet de critiques de la part de l'opposition, qui lui reproche d'avoir gâché la victoire militaire dans les négociations de paix. Le temps nous dira quels seront les résultats finaux."
 BAN_Liberation_War.18.d:0 "Des millions de personnes à Dacca ont salué l'arrivée de Cheikh Mujibur Rahman, le père du Bangladesh. Après avoir été détenu illégalement au Pakistan pendant des mois, il est finalement rentré dans son pays natal. Les autorités pakistanaises l'ont libéré et ont organisé son voyage à Londres où il a pris son vol de retour. Cheikh Mujibur Rahman était plein d'émotion lorsqu'il a exprimé son amour et sa fierté pour le peuple du Bangladesh qui s'est libéré et a survécu à une occupation militaire brutale. Il a fait écho aux paroles du gouvernement lorsqu'il a promis que le Bangladesh non seulement se relèverait mais veillerait à ce que toutes les victimes des atrocités pakistanaises reçoivent la reconnaissance et le soutien de l'État. Il a également promis le socialisme au peuple et une nouvelle ère de prospérité."
 BAN_Liberation_War.19.d:0 "Après une longue et angoissante attente pour de nombreuses familles de militaires, les derniers prisonniers de guerre ont traversé la frontière de Wagah à Lahore et sont retournés au Pakistan. Des milliers de citoyens ont accueilli les soldats lors de leur traversée, nombre d'entre eux retrouvant leur famille après des années de séparation. Le gouvernement pakistanais s'est longtemps plaint que l'Inde avait utilisé les prisonniers de guerre comme monnaie d'échange et les avait détenus illégalement, en violation de la Convention de Genève. Les prisonniers de guerre de retour seront placés dans des camps temporaires où l'armée les débriefera et décidera qui rejoindra l'armée et qui sera démobilisé. Les premiers rapports des prisonniers de guerre indiquent que, bien qu'ils aient été relativement bien traités par l'Inde, ils ont été confrontés à une intense propagande les appelant à renoncer au Pakistan et à la partition. Le gouvernement pakistanais a exprimé sa satisfaction et a salué la détermination de ses soldats à ne pas céder à la propagande ennemie."
 BAN_Liberation_War.20.d:0 "Les hauts responsables militaires ont semblé visiblement secoués lorsqu'ils ont informé le Premier ministre que l'offensive pour la libération du Bangladesh avait échoué et était au point mort. Le Premier ministre s'est également montré découragé lorsqu'il s'est adressé à la nation au sujet de la situation. Des rapports faisant état d'émeutes et d'agitation se produisent déjà à travers le pays, en particulier à Calcutta, où règne un sentiment d'incrédulité. Le gouvernement pakistanais félicite déjà ses forces pour avoir réussi à empêcher l'humiliation nationale et appelle l'Inde à retirer ses forces. Les Nations Unies et d'autres grandes puissances nous appellent également à retirer nos forces, car elles sont considérées comme une source de distraction et un obstacle à une résolution définitive de la crise du Pakistan oriental. Dans les prochains jours, le gouvernement et la nation devront faire beaucoup d'introspection pour comprendre ce qui s'est passé."
 BAN_Liberation_War.21.d:0 "Une série de réformes militaires ont été annoncées par le gouvernement indien suite au résultat décevant de la récente guerre avec le Pakistan. Travaillant en étroite collaboration avec le Parlement, le gouvernement indien a révélé son intention d'élargir le recrutement afin de mieux mobiliser les ressources. Le Premier ministre a évoqué dans sa propre déclaration son intention de débloquer des fonds pour une augmentation temporaire des dépenses militaires afin de renforcer la défense nationale. Les Indiens de tout le pays ont exprimé leur déception et parfois leur indignation face à la débâcle au Pakistan oriental. Les éditoriaux déplorent que l'armée soit encore fermement ancrée dans la pensée de l'ère coloniale et qu'elle ne parvienne pas à inculquer les compétences nécessaires à la guerre moderne. Des officiers indiens se rendraient au travail en civil pour éviter d'être embarrassés et humiliés en public dans certaines régions."
 BAN_Liberation_War.22.d:0 "Quelques jours seulement après avoir annoncé une série de réformes militaires, le Premier ministre a publié les noms de nombreux hauts commandants militaires qui doivent immédiatement prendre leur retraite. Le Premier ministre a noté que ces officiers n'avaient pas rempli leurs fonctions ou occupaient des postes qui n'étaient plus pertinents pour la nouvelle armée indienne. L'armée indienne, en particulier, est confrontée au plus grand nombre de licenciements et, bien que les officiers supérieurs semblent plutôt démoralisés, l'action bénéficie du soutien de la population et des rangs subalternes. De nombreux jeunes officiers estimaient en privé que les hauts dirigeants n'avaient pas fait preuve d'urgence ni imposé de discipline pendant le conflit, ce qui a entraîné des retards et des revers. Beaucoup de ces officiers pensent que l'échec est dû au leadership et non à la performance des soldats ou de l'armée pakistanaise. Une nouvelle ère commence désormais pour l'armée indienne."

 Yahya_Khan.4.d:0 "Le CMLA du Pakistan, le général Yahya Khan, a affirmé que la situation s'était stabilisée et que l'atmosphère politique était prête pour la tenue d'élections générales dans six mois. Il a déclaré que tous les partis politiques seront autorisés à participer et à faire campagne tant qu'ils resteront pacifiques. Il a ordonné que l'armée veille à ce qu'il n'y ait pas de corruption ou de manipulation. La nouvelle a été bien accueillie dans tout le pays, mais de nombreux observateurs se demandent si l'on peut réellement faire confiance à l'armée pour organiser les élections impartiales qu'elle a promises."
 Yahya_Khan.5.d:0 "Des millions de Pakistanais, des collines du Baloutchistan aux jungles du Bengale, sont venus voter lors de la plus grande élection organisée dans l'histoire du Pakistan. Les observateurs internationaux ont constaté que le vote s'était déroulé sans heurts, dans le calme et sans aucune preuve d'ingérence. Contrairement aux attentes, l'armée pakistanaise a tenu parole et a assuré que le scrutin se déroulerait de manière pacifique et équitable. Les résultats définitifs devraient être annoncés prochainement. Les analystes politiques prédisent que la Ligue Awami, dirigée par Cheikh Mujibur Rahman, remportera probablement le plus de sièges, notamment depuis sa base au Pakistan oriental. Le PPP dirigé par Zulfiqar Bhutto devrait remporter la majorité des sièges dans l'aile ouest, mais nombreux sont ceux qui pensent qu'aucun des deux camps ne peut obtenir la majorité absolue. On a le sentiment que d'autres partis régionaux et religieux obtiendront également un certain nombre de sièges."
 Yahya_Khan.6.d:0 "La Commission électorale du Pakistan a publié les résultats des récentes élections générales. La Ligue Awami, dirigée par Cheikh Mujibur Rahman, a remporté 160 des 300 sièges totaux de l'Assemblée nationale. Avec cette majorité, la Ligue Awami peut amender la constitution comme elle le souhaite. La Ligue Awami s'est présentée sur la base de son programme en Six Points, appelant à une plus grande autonomie au Pakistan oriental. Pour une grande partie de l'establishment civil et militaire, la Ligue Awami est considérée comme une menace pour l'unité nationale du Pakistan. Ils n'avaient pas prévu que le parti serait capable de remporter pratiquement tous les sièges au Pakistan oriental. Zulfiqar Bhutto a remporté la majorité des sièges au Pakistan occidental, mais son parti, le PPP, reste loin derrière. Le président Yahya Khan a d'abord félicité la Ligue Awami, mais des rumeurs circulent déjà selon lesquelles de hauts généraux et hommes politiques du Pakistan occidental exigeraient que le président ne remette pas le pouvoir sans les garanties de Cheikh Mujibur Rahman."
 Yahya_Khan.7.d:0 "L'incertitude règne au Pakistan puisque Zulfikar Bhutto refuse d'assister à l'Assemblée nationale à Dacca. Le président Yahya Khan subit une immense pression pour soutenir Bhutto et refuser de se réunir jusqu'à ce que la Ligue Awami promette de ne pas mettre en oeuvre les Six Points. La Ligue Awami indique cependant qu'elle dispose d'une majorité, obtenue grâce à des élections libres et démocratiques, et qu'elle peut siéger à l'Assemblée nationale sans le soutien du PPP ou des autres partis du Pakistan occidental. Cheikh Mujibur Rahman, dans certains de ses discours, a condamné les actions de Bhutto, affirmant qu'il agissait contre la démocratie et a suggéré qu'il n'hésiterait pas à tenir l'Assemblée nationale et à adopter les Six Points. Yahya Khan est actuellement à Dacca avec Bhutto et Rahman cherchant à négocier une solution."

 Mukti_Bahini_Insurgency:0 "Insurrection de Mukti Bahini"
 Mukti_Bahini_Insurgency_desc:0 "Lorsque l'armée pakistanaise a lancé l'opération Searchlight, elle a mis fin à toute possibilité de résolution pacifique du conflit au Pakistan oriental. Les soldats bengalis qui ont échappé à leur détention ont réussi à s'associer à d'autres dissidents, notamment des membres de la Ligue Awami. Un gouvernement bengali en exil s'est formé avec les combattants organisés sous le nom de Mukti Bahini. Ils ont rapidement lancé des opérations contre l'armée d'occupation pakistanaise. Le gouvernement pakistanais s'engage à écraser cette rébellion et il semble que le Pakistan oriental soit désormais plongé dans la guerre civile."

 Bangladesh_War.1.d:0 "Le gouvernement indien a annoncé que ses forces se dirigeaient vers le Pakistan oriental pour mettre fin à l'effusion de sang et préserver la vie. L'armée indienne lance déjà des attaques contre nos forces. Cet acte d'agression recevra sans aucun doute une réponse appropriée de la part de nos forces. Nous publierons bientôt une déclaration appelant le peuple à s'unir et à défendre la patrie non seulement contre une invasion mais aussi contre une menace pour notre mode de vie et notre religion. Les Indiens prétendent qu'ils agissent parce que la situation des réfugiés a atteint un moment critique, mais nous savons que c'est la conclusion d'un complot de plusieurs mois visant à détruire notre nation, d'abord par la manipulation des médias, ensuite par l'armement du Mukti Bahini, par un renforcement militaire et enfin par cette invasion. Pour le bien du Pakistan, nous devons nous battre jusqu'au bout."
 Bangladesh_War.2.d:0 "L'ambassadeur du Pakistan a remis une lettre de son président appelant les États-Unis à fournir un soutien militaire face à une invasion indienne massive. Nous avions depuis longtemps averti les Pakistanais de résoudre leur crise au Pakistan oriental, mais ils ne voulaient pas ou ne pouvaient pas le faire. Actuellement, l'Inde affirme que son seul intérêt est d'expulser le Pakistan du Pakistan oriental, ce qui à nos yeux pourrait être le meilleur en termes de stabilité régionale. Cependant, l'agression indienne au Pakistan occidental pourrait être déstabilisatrice. Aux États-Unis, l'opinion publique et l'opposition ont vivement condamné le Pakistan pour ses actions visant à déraciner les rebelles de Mukti Bahini. Il ne serait pas populaire de soutenir ouvertement le Pakistan. Malgré cela, le Pakistan est un ami depuis de nombreuses années et soutient nos efforts pour interagir avec la Chine. Nos options sont de déployer symboliquement des forces navales et de dire à l'Inde de ne pas frapper le Pakistan occidental, de refuser de nous impliquer du tout ou de proposer discrètement des avions, des chars et des armes pour garantir que le Pakistan occidental ne tombe pas."
 Bangladesh_War.3.d:0 "Les États-Unis ont annoncé que les forces navales mèneraient des manoeuvres dans le golfe du Bengale. Ce déploiement est perçu par de nombreux observateurs comme un message adressé à l'Inde pour qu'elle contrôle ses ambitions pendant la guerre qu'elle mène actuellement avec le Pakistan. De nombreux éditoriaux et politiciens de l'opposition ont critiqué l'action du président. Ils estiment que le gouvernement soutient excessivement le Pakistan, accusé de s'être engagé dans une campagne militaire brutale au Pakistan oriental contre les Bengalis qui luttent pour l'indépendance. Un conseiller du président a déclaré en privé aux journalistes que les États-Unis ne se rangeaient pas du côté du Pakistan mais penchaient plutôt dans sa direction pour éviter une détérioration complète de l'équilibre des pouvoirs en Asie du Sud."
 Bangladesh_War.4.d:0 "Le premier ministre s'est récemment entretenu longuement avec le secrétaire d'État américain. Les États-Unis ont exprimé leur inquiétude quant au fait que la guerre actuelle pourrait conduire à un effondrement du Pakistan, ce qui serait préjudiciable à la région. Nous l'avons informé que notre objectif était de mettre enfin un terme aux massacres et à l'escalade de la crise humanitaire au Pakistan oriental. Les Américains l'ont reconnu et ont déclaré qu'ils n'avaient rien à redire sur cet objectif. Cependant, ils ont clairement indiqué que tout effort visant à élargir la portée du conflit et à s'emparer du territoire du Pakistan occidental, même au Cachemire, pourrait donner lieu à une action américaine forte. Ce favoritisme flagrant envers le Pakistan est très préoccupant, mais il est clair que nous bénéficions de leur soutien en ce qui concerne nos objectifs pour le Pakistan oriental."
 Bangladesh_War.5.d:0 "L'ambassadeur des États-Unis nous a informé que son gouvernement, bien que sensible au sort de notre peuple, ne peut pas prendre sur lui de s'impliquer dans le conflit. Les Américains insistent sur le fait que son meilleur rôle est d'être l'ami du Pakistan et de l'Inde. Soutenir ouvertement l'une ou l'autre des parties nuirait à long terme au Pakistan, en particulier sur la scène internationale. Il s'agit d'une nouvelle décevante ; il est clair que les Américains nous sentent faibles et sont préoccupés par les critiques intérieures concernant nos actions face aux éléments violents anti-pakistanais au Pakistan oriental. Nous ne pouvons pas compter sur les États-Unis et, à l'avenir, nous devrions réfléchir aux moyens de survivre sans eux."
 Bangladesh_War.6.d:0 "Par une nouvelle surprise, nous avons été informés que le président des États-Unis avait autorisé l'envoi immédiat d'armes pour aider nos forces, actuellement engagées dans une guerre brutale avec l'Inde. Les Américains ont souligné qu'ils ne pouvaient pas nous soutenir ouvertement, car de nombreux Américains attribuent la guerre actuelle aux actions du Pakistan. En outre, les États-Unis ne souhaitent pas contrarier l'Inde, ce qui lui permettrait de jouer un rôle dans les négociations futures. Les Américains n'expédieront probablement pas les armes eux-mêmes, mais permettront aux États amis de la région de nous transférer l'équipement sans aucune entrave. En outre, les Américains ont promis d'avertir l'Inde de ne pas utiliser le conflit actuel comme moyen de réaliser des gains territoriaux au Pakistan occidental."
 Bangladesh_War.7.d:0 "Les États-Unis avaient discrètement accepté de soutenir les efforts d'autres puissances régionales visant à transférer du matériel américain à l'armée pakistanaise alors qu'elle combat l'Inde. Les États-Unis ne sont pas intervenus pour mettre un terme aux transferts d'armes et ont informé en privé ces pays que le matériel qu'ils envoyaient serait remplacé par le gouvernement américain. Aujourd'hui, les dernières armes ont été déchargées et il est déjà prévu de les déployer au front. L'aide américaine n'est pas considérable, mais elle fera une grande différence dans notre lutte pour la survie de notre nation. Les États-Unis ont prouvé leur statut de véritable ami du Pakistan."
 Bangladesh_War.8.d:0 "Un journal national a récemment détaillé notre approbation des États de la région transférant des armes au Pakistan pendant le conflit indo-pakistanais actuel. Le rapport notait que nous aurions pu mettre un terme à ces transferts, mais au contraire les faciliter et promettre de reconstituer les stocks des pays qui envoyaient des armes. Le rapport a été fermement condamné par les gouvernements indien et soviétique. Ils nous ont accusés d'aggraver la crise et d'alimenter une accumulation d'armes. Notre ambassadeur en Inde a été sévèrement réprimandé par le ministre indien des Affaires étrangères. Il est désormais clair que nous soutenons les Pakistanais, ce qui nuira gravement aux relations avec l'Inde."
 Bangladesh_War.9.d:0 "Notre ami frère le Pakistan a demandé notre aide dans sa guerre contre l'Inde. Nos propres analystes estiment que le conflit n'a eu lieu que parce que le Pakistan n'a pas réussi à résoudre ses problèmes intérieurs et que l'Inde exploitera probablement cela à son avantage. Nos meilleurs conseillers suggèrent que la situation est telle qu'une intervention ne modifierait probablement pas les résultats mais prolongerait les souffrances. Il nous reste trois choix : envoyer un approvisionnement d'urgence en armes au Pakistan, accompagné d'un avertissement à l'Inde. Nous pourrions aussi simplement envoyer à l'Inde un avertissement ferme pour qu'elle mette un terme à ses ambitions hégémoniques. Enfin, nous pourrions choisir ce moment pour ne rien dire et laisser le Pakistan faire face seul à la situation. Avec le temps, comme un jeune frère, ils se rendraient compte que notre action était pour le mieux."
 Bangladesh_War.10.d:0 "Le gouvernement chinois a publié une déclaration cinglante nous condamnant et exprimant son soutien au Pakistan. La déclaration met également en garde contre des conséquences désastreuses pour nous. L'armée a également informé le cabinet des mouvements de troupes chinoises le long de la frontière. Les diplomates des États amis de la Chine ont fait passer un message selon lequel la principale préoccupation de la Chine est que nous ne cherchions pas de territoire ou de terres au Pakistan occidental. Pour l'instant, il ne semble pas que la Chine intervienne, mais nous devons rester vigilants face à cette éventualité. Indépendamment de la dureté des termes utilisés, il est clair que la Chine n'a pas intérêt à nous forcer à nous retirer face à la crise du Pakistan oriental."
 Bangladesh_War.11.d:0 "Notre amie la Chine s'est mobilisée et nous a fourni l'équipement militaire indispensable. L'aide chinoise est actuellement en cours de traitement et sera déployée dès que possible. L'Inde est une grande nation et une menace puissante, notre armée peut utiliser tout le soutien qu'elle peut obtenir. Même si une intervention chinoise directe serait appréciée, recevoir ce soutien reste tout de même très significatif. Le gouvernement chinois a également publié une déclaration menaçant l'Inde de contrôler ses ambitions et condamnant sa campagne néfaste visant à détruire notre pays."
 Bangladesh_War.12.d:0 "Le gouvernement chinois a rejeté notre demande de soutien. Non seulement ils ont refusé d'offrir une quelconque aide, mais ils ont même refusé d'offrir un soutien diplomatique face à d'éventuelles demandes d'extorsion de la part de l'Inde. Il s'agit d'un revers majeur pour nous et cela indique que nous sommes peut-être plus isolés que nous ne le pensions. Une fois cette crise passée, nous devrons sans doute reconsidérer la nature de nos relations avec la Chine. Certains suggèrent que nous retirions notre ambassadeur en signe de protestation, mais la plupart des membres du cabinet conviennent que la relation est trop importante pour laisser cela faire dérailler la bonne volonté que nous avons établie au fil des ans."
 Bangladesh_War.13.d:0 "Les Pakistanais ont contacté les Nations Unies pour négocier un cessez-le-feu concernant les combats en cours. De toute évidence, ils ne peuvent pas continuer le combat et souhaitent que cela cesse. Nos diplomates disent que si nous le voulons, ils peuvent retarder les Nations Unies de dix jours supplémentaires, après quoi nous devrons accepter le cessez-le-feu. Toutefois, si nous estimons que nos objectifs ont été atteints, nous pouvons accepter le cessez-le-feu. Nos forces et notre peuple ont lutté avec acharnement ; nous devons maintenant décider du moment où mettre fin au conflit."
 Bangladesh_War.14.d:0 "Les Nations Unies ont réussi à négocier un cessez-le-feu entre l'Inde et le Pakistan. Une force de surveillance est rapidement déployée dans la région pour s'assurer qu'aucune des parties ne viole l'accord. Jusqu'à présent, le cessez-le-feu tient et les affrontements ont cessé entre les deux parties. Le secrétaire général a salué cette décision et a exprimé son espoir que les deux parties pourront résoudre leurs problèmes en suspens par le dialogue. Les gouvernements pakistanais et indien ont publié des déclarations saluant le cessez-le-feu et louant leurs forces et leur peuple."
 Bangladesh_War.15.d:0 "Les Nations Unies nous ont informés que le gouvernement indien a demandé un cessez-le-feu pour notre conflit actuel. Nous pouvons accepter l'offre et mettre fin aux combats immédiatement. Cela pourrait s'avérer le meilleur choix, surtout si nous pensons que la situation ne peut pas changer sur le terrain. Cependant, nos diplomates déclarent que si nous le voulons, nous pouvons retarder le cessez-le-feu de dix jours supplémentaires, après quoi nous devrons accepter le cessez-le-feu. Si nous pensons que la situation peut être améliorée avec plus de temps, nous pouvons choisir cette option. Nos forces et notre peuple ont lutté durement."
 Bangladesh_War.16.d:0 "Le commandant du commandement oriental du Pakistan a signé un instrument de reddition à l'hippodrome de Ramna à Dacca. Il l'a signé sous le regard des commandants militaires indiens. Au moment de la signature du document, toutes les forces pakistanaises encore actives au Pakistan oriental ont entamé le processus de capitulation face aux forces indiennes. Des responsables civils pakistanais sont actuellement détenus. La population bengalie de Dacca et de ce qui était autrefois le Pakistan oriental réagit avec jubilation à cette nouvelle. Pour beaucoup, cela marque la fin de leur longue lutte pour l'indépendance. Au Pakistan, les nouvelles sont restées discrètes, mais il y a un air de colère et d'humiliation face à la tournure des événements."
 Bangladesh_War.17.d:0 "Après la perte humiliante du Pakistan oriental et l'émergence du Bangladesh, le président Yahya Khan était confronté à des troubles massifs au sein de la population et de son corps d'officiers. Craignant un soulèvement civil ou un coup d'État militaire, Yahya Khan a plutôt annoncé sa démission de son poste de président du Pakistan. Il a cédé le pouvoir à Zulfikar Ali Bhutto, faisant de lui à la fois président et administrateur en chef de la loi martiale. Bhutto, qui dirige le parti le plus populaire du Pakistan, jouit d'une légitimité auprès du peuple et n'a pas à craindre une réaction militaire. Dans son discours d'ouverture, Bhutto a promis de restaurer la fierté des Pakistanais et de lancer le processus d'établissement de la démocratie et d'une constitution pour le peuple."
 Bangladesh_War.18.d:0 "Contre toute attente, l'armée et le peuple pakistanais ont résisté à l'invasion indienne et à l'insurrection de Mukti Bahini. Durant les combats, de nombreux groupes Mukti Bahini ont lancé des attaques tous azimuts, les révélant et conduisant à leur destruction. Les forces qui ont survécu ont fui vers les lignes indiennes. L'Inde étant incapable de faire beaucoup de progrès, ses forces ont déjà accepté un retour aux frontières et aux conditions d'avant-guerre. La réaction générale au Pakistan occidental est la joie et la surprise face à cette défense réussie. En Inde, il existe un sentiment d'humiliation et d'introspection face à l'incapacité à mettre fin à la crise du Pakistan oriental selon leurs conditions. Cependant, les combats ont conduit à un effondrement de la gouvernance civile et de nombreux nationalistes bengalis continuent de lancer une campagne de désobéissance à l'échelle de la province."
 Bangladesh_War.19.d:0 "Le commandement oriental de Dacca a du mal à maintenir l'ordre et à administrer efficacement. Bien que les Mukti Bahini soient largement vaincus et que nos partisans au Pakistan oriental soient plus forts que jamais, il est clair que ce n'est qu'une question de temps avant que les combats internes ne commencent, en particulier entre les Bengalis et les Biharis. Étant donné que le Commandement de l'Est doit faire face à cette violence ethnique interne tout en maintenant des forces à la frontière, la situation est intenable. Le gouvernement fédéral a décidé qu'il n'est pas possible de maintenir l'ancien statu quo, mais nous pouvons contrôler la manière dont nous résolvons le différend. La première étape consiste à ouvrir des négociations avec la Ligue Awami et son leader Cheikh Mujibur Rahman, toujours en détention au Pakistan occidental."
 Bangladesh_War.20.d:0 "Cheikh Mujibur Rahman est retourné à Dacca au milieu d'une foule massive de partisans, témoignant du soutien continu à sa cause. Il est arrivé à bord d'un avion militaire pakistanais après avoir conclu des négociations tendues entre la Ligue Awami et le gouvernement militaire d'Islamabad. Les deux parties ont convenu d'un référendum dans trois mois pour déterminer si le Pakistan oriental resterait membre d'une fédération ou obtiendrait une quasi-indépendance en faisant partie d'une co-fédération avec le Pakistan occidental. Dans cet accord, la Ligue Awami et le Mukti Bahini bénéficient d'une amnistie, mais certains membres jugés particulièrement proches de l'Inde doivent être expulsés. En échange, la Ligue Awami a promis qu'elle ne ferait pas pression en faveur de l'indépendance et a promis de mettre fin à toute résistance armée et à toute désobéissance civile. La réaction des Pakistanais occidentaux à l'égard de l'accord a été hostile, car beaucoup le considèrent comme trop conciliant à l'égard d'un groupe qui a mené une guerre contre l'État."
 Bangladesh_War.21.d:0 "La population du Pakistan oriental a voté lors d'un référendum historique pour l'avenir de sa province. Au final, le peuple a décidé de continuer à faire partie du Pakistan en tant que co-fédération. Désormais, le Pakistan oriental sera gouverné par sa propre assemblée et son Premier ministre. Il sera essentiellement complètement indépendant du Pakistan, sauf en termes d'économie, de défense commune, d'affaires étrangères et sous la direction du même président. L'armée pakistanaise est déjà en train de se diviser, donnant au Pakistan oriental les East Bengal Rifles et les East Pakistan Rifles comme noyau de sa propre force militaire. Le Commandement oriental sera bientôt dissous et laissera la défense de la province à la nouvelle armée du Pakistan oriental. Le Premier ministre présumé du Pakistan oriental, Cheikh Mujibur Rahman, s'est félicité du résultat. Cependant, de nombreuses personnes au Pakistan occidental seraient furieuses que, malgré la défaite d'une invasion indienne et le sacrifice de tant de vies, la Ligue Awami semble avoir gagné."
 Bangladesh_War.22.d:0 "Alors que le récent référendum au Pakistan oriental a confirmé son nouveau statut, la population du Pakistan occidental attend avec impatience le retour de ses soldats héroïques. Cependant, nombreux sont ceux, notamment Zulfiqar Bhutto et son Parti du peuple pakistanais, qui ont critiqué les résultats. En effet, des grèves et des émeutes ont été signalées dans certaines villes, car beaucoup ne comprennent pas comment le gouvernement militaire a pu céder le pouvoir avec autant de désinvolture. Le président s'est cependant adressé à la nation et a déclaré que la situation au Pakistan oriental était désespérée et qu'il avait agi afin de préserver le Pakistan du mieux qu'il pouvait. Les officiers bengalis de l'armée auront bientôt la possibilité de rejoindre la nouvelle armée du Pakistan oriental ou de rester. Les analystes estiment que cette réaction négative est due à un effort conscient du gouvernement pour minimiser la situation depuis le début des troubles il y a quelques mois."
 Bangladesh_War.23.d:0 "Le président Yahya Khan a officiellement remis le pouvoir à Zulfiqar Bhutto et à son Parti du peuple pakistanais. Cela survient après plusieurs mois de troubles et de protestations de la part des Pakistanais en colère contre la décision de laisser le Pakistan oriental former une relation co-fédérale avec le Pakistan. Dans sa déclaration, le président Yahya a noté que le PPP avait remporté le plus de sièges au Pakistan occidental lors des précédentes élections générales et qu'il était temps de rendre le pouvoir au peuple. Il a déclaré que l'armée avait sauvé la nation et fait les choix difficiles nécessaires à sa survie. Contrairement aux attentes, Bhutto a déclaré qu'il ne modifierait pas les nouvelles relations avec le Pakistan oriental et a promis que les deux ailes continueraient de prospérer ensemble. Cela indique qu'un accord a peut-être été conclu entre le PPP et l'armée avant la passation des pouvoirs. Bhutto a également promis qu'il entamerait bientôt le processus de rédaction d'une constitution et de retour de la démocratie au Pakistan."

 Admiral_Ahsan_Mission.1.d:0 "Suite à la victoire décisive de la Ligue Awami aux récentes élections générales, une crise politique est apparue. De nombreux partis d'opposition, notamment ceux du Pakistan occidental, refusent de participer à l'Assemblée nationale. Ils affirment que la majorité de la Ligue Awami leur donne le pouvoir d'amender la constitution à volonté et de détruire l'État pakistanais. Le président Yahya Khan est engagé dans des pourparlers politiques, mais il a récemment décidé de charger le vice-amiral Syed Mohammad Ahsan, gouverneur par intérim du Pakistan oriental, d'élaborer une initiative de paix qui mettrait fin à la crise actuelle. Ahsan jouit d'une image positive auprès de nombreux Pakistanais de l'Est et n'est pas aussi intransigeant que les autres membres de l'armée. Ses relations positives avec le président Yahya Khan sont également considérées comme un atout dans l'élaboration d'une proposition de paix."
 Admiral_Ahsan_Mission.2.d:0 "L'amiral Syed Mohammad Ahsan a présenté sa proposition de paix au gouvernement. La proposition a été faite après des entretiens approfondis avec de hauts dirigeants gouvernementaux, militaires et politiques du Pakistan oriental. La proposition appelle à la création d'une co-fédération où les deux ailes auraient leur propre Premier ministre, Zulfikar Bhutto pour le Pakistan occidental et Sheikh Mujibur Rahman pour le Pakistan oriental, tous sous la direction du président. Une fonction publique et une armée distinctes seraient établies au Pakistan oriental, les personnes présentes dans la province ayant le choix d'être rapatriées au Pakistan. Certains membres du gouvernement estiment que la proposition va trop loin. D'autres soutiennent que la communauté internationale a déjà déclaré son soutien à la proposition et qu'elle offre un moyen viable de sortir de l'impasse politique et de maintenir le Pakistan."
 Admiral_Ahsan_Mission.3.d:0 "Après des discussions houleuses et des débats houleux, le gouvernement pakistanais a accepté d'adopter la proposition de la mission Ahsan. Bien que le chef du plus grand parti du Pakistan occidental, Zulfikar Bhutto, se soit opposé au projet, presque tous les autres dirigeants politiques du Pakistan occidental l'ont adopté. Parmi les militaires, de nombreux officiers de l'armée s'y sont opposés, mais les dirigeants des autres branches se sont montrés plus sympathiques. Finalement, lorsque le chef de l'armée a accepté, ses subordonnés se sont rangés dans le rang. La nouvelle de cette acceptation fait déjà naître l'espoir au Pakistan et dans le monde qu'une solution pacifique est à portée de main pour résoudre une fois pour toutes la crise du Pakistan oriental."
 Admiral_Ahsan_Mission.4.d:0 "La Ligue Awami plaide depuis longtemps pour une plus grande autonomie du Pakistan oriental au sein de la nation. Les récentes élections générales ont confirmé le large soutien dont bénéficie le parti au sein de la population du Pakistan oriental et son désir de plus de liberté. Récemment, l'amiral Syed Mohammad Ahsan, gouverneur militaire du Pakistan oriental, a proposé une solution qui a été récemment acceptée par le gouvernement. Basée sur nos Six Points, la proposition appelle à la création d'une co-fédération et permet essentiellement à chaque aile d'être autonome. Certains membres du parti soutiennent la proposition, car elle permet d'atteindre bon nombre de nos objectifs et de garantir notre autonomie. Cependant, d'autres membres du parti soutiennent que nous devrions rejeter la proposition, dans la mesure où nous avons remporté les élections, et que nous devrions faire pression pour obtenir tout le pouvoir politique que nous avons gagné lors des élections."
 Admiral_Ahsan_Mission.5.d:0 "Il y avait une ambiance de bonheur palpable dans les rues de Dacca après l'annonce que la Ligue Awami avait accepté la proposition de la mission Ahsan pour un État co-fédéral du Pakistan. Quelques jours plus tôt, la ville était plongée dans la tristesse et la tension en raison de la crise politique qui a suivi les récentes élections générales. Le gouvernement soutenant déjà ce plan, on s'attend à ce qu'une nouvelle annonce soit faite dans les prochains jours définissant le nouveau statut du Pakistan. Au Pakistan occidental, la proposition est adoptée par presque tous les partis, à l'exception du Parti du peuple pakistanais dirigé par Zulfiqar Bhutto. Cependant, les analystes s'inquiètent de l'opposition de Bhutto, son parti ayant remporté la majorité des sièges au Pakistan occidental lors des récentes élections."
 Admiral_Ahsan_Mission.6.d:0 "Le vice-amiral Syed Mohammad Ahsan, gouverneur militaire du Pakistan oriental, a récemment proposé une solution à la crise du Pakistan oriental. Il espérait que son plan préserverait l'unité du Pakistan tout en offrant à la population du Pakistan oriental l'autonomie qu'elle réclame depuis longtemps depuis que la Ligue Awami a dévoilé pour la première fois sa proposition en six points. Mais sa mission a échoué. Certains accusent l'opposition d'éléments radicaux au sein de l'armée, notamment de Zulfikar Bhutto. D'autres suggèrent que c'est la Ligue Awami qui a fait échouer cet effort, convaincues que sa domination électorale indique qu'elle n'a pas besoin de faire de compromis. Quoi qu'il en soit, ces efforts ont échoué et l'amiral Ahsan a récemment présenté sa démission, déçu."
 Admiral_Ahsan_Mission.7.d:0 "Au cours d'une cérémonie émouvante à Dacca, le président Yahya Khan et le nouveau Premier ministre du Pakistan Zulfikar Bhutto ont assisté à l'investiture de Cheikh Mujibur Rahman en tant que Premier ministre du Pakistan oriental. Cela a marqué une nouvelle ère pour le Pakistan après que l'amiral Syed Mohammad Ahsan et sa proposition de résolution de la récente crise politique ont transformé le Pakistan d'une fédération en une co-fédération. Les deux ailes du Pakistan seront dirigées par leur propre Premier ministre et tout différend entre les ailes sera résolu par le président. Le Pakistan oriental jouira d'une autonomie dans tous les domaines, à l'exception de la politique étrangère et de certains aspects de la défense et de l'économie. L'armée pakistanaise est déjà en train de transférer ses deux régiments du Pakistan oriental vers la nouvelle armée du Pakistan oriental et a désactivé son commandement oriental. La population du Pakistan oriental serait ravie de cette résolution, mais des rumeurs courent selon lesquelles de nombreux habitants du Pakistan occidental ne seraient pas satisfaits, y compris le nouveau Premier ministre."
 Admiral_Ahsan_Mission.8.d:0 "Quelques semaines seulement après la création d'une co-fédération au Pakistan, l'aile occidentale, désormais appelée Pakistan, est détruite par de grandes manifestations et grèves, notamment à Karachi. De nombreux manifestants sont furieux de ce qu'ils perçoivent comme l'octroi d'une quasi-indépendance aux Bengalis. Le gouvernement militaire a du mal à contrôler ces manifestations et le Premier ministre Zulfikar Bhutto a refusé de commenter ces manifestations. Il s'était longtemps opposé au récent accord, mais avait été nommé Premier ministre grâce au fait que son parti, le Parti du peuple pakistanais (PPP), avait remporté le plus de sièges lors des dernières élections générales. Il a souligné que le Pakistan ne pouvait pas revenir sur l'accord, mais que le fait que cela se soit produit sans l'approbation explicite de tous les Pakistanais prouvait que le système actuel était défectueux. De nombreux fonctionnaires et militaires sympathisent avec Bhutto. Les rumeurs abondent selon lesquelles certains officiers supérieurs auraient travaillé avec le PPP pour organiser cette campagne de troubles."
 Admiral_Ahsan_Mission.9.d:0 "Le président Yahya Khan a officiellement remis ses pouvoirs en matière de loi martiale et son titre de présidence au Premier ministre Zulfiqar Bhutto. Cela survient après plusieurs mois de troubles et de protestations de la part des Pakistanais en colère contre la décision de laisser le Pakistan oriental former une relation co-fédérale avec le Pakistan. Dans sa déclaration, le président Yahya a souligné que l'armée avait fait les choix difficiles qui s'imposaient pour le Pakistan, mais que pour que la démocratie revienne, cela doit être fait par les élus du peuple. En prenant le pouvoir, Bhutto a promis de ne pas renverser la co-fédération. Cela indique qu'un accord a peut-être été conclu entre le PPP et l'armée avant la passation des pouvoirs. Bhutto a également promis qu'il entamerait bientôt le processus d'organisation d'une assemblée constituante pour créer une nouvelle constitution et restaurer la démocratie au Pakistan. En ce qui concerne la co-fédération, Bhutto a immédiatement annoncé que le président ne ferait plus de médiation entre les deux ailes mais que les différends seraient désormais résolus par le dialogue entre les deux Premiers ministres."

 Awami_League_Win.1.d:0 "Le président Yahya Khan a réussi à convaincre Zulfikar Bhutto et le reste des membres de l'Assemblée nationale du Pakistan occidental de retirer leur protestation et de se rendre à Dacca pour fonder la nouvelle Assemblée nationale. Bhutto et ses partisans se sont opposés à cette participation car la Ligue Awami a obtenu une nette majorité et peut essentiellement rédiger la nouvelle constitution comme bon lui semble. Les Pakistanais occidentaux voulaient que la Ligue Awami accepte les modifications de l'Assemblée nationale et garantisse que tout changement apporté se ferait avec le consentement de tous les partis politiques. La Ligue Awami a fait valoir qu'elle avait remporté les élections de manière équitable et qu'elle ne devrait pas avoir à faire de compromis simplement parce que la majorité les soutenait. Le président Yahya Khan a choisi de soutenir la position de la Ligue Awami et il semble qu'il ait réussi à convaincre l'opposition de la rejoindre, probablement en utilisant l'armée pour faire pression sur elle."
 Awami_League_Win.2.d:0 "La Ligue Awami a utilisé sa majorité pour adopter ses Six Points comme base de la future constitution du Pakistan. Dès que le président de l'Assemblée a annoncé que le projet de loi serait voté, l'opposition, y compris tous les membres du Pakistan occidental, s'est retirée. Le chef de l'opposition, Zulfikar Ali Bhutto, a affirmé que le vote était un acte d'abus politique et qu'il avait ignoré l'opinion de toute une aile du pays. Le Premier ministre Cheikh Mujibur Rahman a condamné l'opposition et a déclaré que les Six Points étaient la principale plate-forme de son parti qui a remporté la majorité absolue à l'Assemblée nationale. Le président Yahya Khan, qui possède désormais des pouvoirs largement symboliques, s'est rendu à Dacca pour négocier et sortir de l'impasse. Bhutto doit décider s'il tentera d'établir un compromis avec la Ligue Awami ou de lancer un boycott de l'Assemblée nationale."
 Awami_League_Win.3.d:0 "Suite à l'adoption des Six Points par la Ligue Awami, les parlementaires du Pakistan occidental ont quitté le Parlement en signe de protestation. Le président Yahya Khan est arrivé comme médiateur avec la Ligue Awami et l'opposition. Après d'intenses discussions, un compromis a été trouvé pour mettre fin aux impasses politiques constantes dans lesquelles se trouve le pays. Le chef de l'opposition, Zulfikar Ali Bhutto, a accepté de créer une co-fédération du Pakistan. Cela créerait deux parlements, un pour chaque aile. Le Pakistan oriental jouirait d'une grande autonomie et serait pratiquement autonome. Le Pakistan partagerait ses actifs avec le Pakistan oriental. Bien que Bhutto ait accepté la solution, il a publiquement exprimé sa réticence et a déclaré que la décision avait été prise sous la pression intense de la Ligue Awami et du président Yahya Khan. En privé, ses partisans répandent des rumeurs selon lesquelles Bhutto serait fortement armé par l'armée. Quoi qu'il en soit, il semble qu'une solution ait été trouvée."
 Awami_League_Win.4.d:0 "La récente crise politique provoquée par l'adoption des Six Points à l'Assemblée nationale s'est transformée en une crise majeure. Les parlementaires du Pakistan occidental ont lancé un boycott et refusent de retourner à Dacca et à l'Assemblée nationale. Leurs espoirs de forcer la Ligue Awami à reculer et à faire des compromis ont échoué. Au lieu de cela, Cheikh Mujibur Rahman a annoncé devant une foule enthousiaste que désormais le peuple bengali ne serait plus des citoyens de seconde zone, mais qu'il contrôlerait plutôt son propre destin. Il a annoncé la création du Bangladesh et a appelé tous les Bengalis à s'unir pour garantir la liberté. Cette annonce a pris les Pakistanais occidentaux complètement par surprise. Des foules bengali ont déjà été signalées entourant des cantonnements à travers le Pakistan oriental et bloquant la circulation des fournitures et des personnes. Le gouvernement doit décider soit d'accepter ce changement désastreux, soit de tenter de rétablir l'ordre et de déployer les troupes."
 Awami_League_Win.5.d:0 "Suite à l'annonce de l'indépendance du Bangladesh par Cheikh Mujibur Rahman, les Bengalis de tout le Pakistan oriental ont entamé un quasi-blocage des cantonnements militaires à travers la province. Les forces pakistanaises étant à court de ravitaillement, le gouvernement a dû décider s'il devait accepter la réalité ou lancer une intervention militaire. Le président Yahya Khan a décidé d'accepter la perte du Pakistan oriental et a ordonné le rapatriement des soldats et des responsables pakistanais. Le nouveau gouvernement bangladais a accepté sans hésiter et autorise les forces pakistanaises à se déplacer vers Dacca afin de se retirer par voie aérienne et maritime. Le gouvernement indien se félicite de l'émergence du Bangladesh, tandis que Yahya Khan fait face à une quasi-révolte de la part de ses propres officiers."

 Mukti_Bahini.1.d:0 "Nos combattants ont identifié un avant-poste de l'armée pakistanaise. Depuis cette position, ils harcèlent les habitants et bloquent les déplacements de nos hommes dans la zone. Un commandant a organisé un groupe d'assaut. Ils ont effectué une reconnaissance minutieuse avant de lancer leur attaque. Les troupes pakistanaises n'avaient aucune idée de ce qui les frappait ; nous leur avons infligé de lourdes pertes alors qu'elles fuyaient notre position. Nos hommes ont réussi à capturer des armes et des fournitures avant de se retirer. Un grand convoi de Pakistanais est revenu, mais nous avions alors disparu depuis longtemps. Ces opérations saperont la volonté de notre ennemi."
 Mukti_Bahini.2.d:0 "Nos combattants ont identifié un avant-poste de l'armée pakistanaise. Depuis cette position, ils harcèlent les habitants et bloquent les déplacements de nos hommes dans la zone. Un commandant a organisé un groupe d'assaut. Malheureusement, il était trop impatient et ses forces qui approchaient ont été identifiées par des sentinelles pakistanaises. L'ennemi préparé a facilement repoussé notre attaque, infligeant des pertes et faisant plusieurs prisonniers. Il s'agit d'un revers majeur pour les Mukti Bahini de la région. Les Pakistanais gagneront en confiance grâce à ce succès et étendront leurs opérations de harcèlement."
 Mukti_Bahini.3.d:0 "Avec l'aide d'informateurs locaux, nous avons identifié les positions exactes des soldats d'un bataillon pakistanais opérant dans la zone. Un groupe d'élite d'opérateurs de mortier est entré dans la zone et a lancé un barrage aux coordonnées indiquées. Nos interceptions radio ont confirmé que les mortiers étaient précis et ont fait des victimes. Un certain nombre de positions ennemies ont été abandonnées grâce aux tirs précis. Cela renforcera les opérations dans la région et donnera à nos forces une marge de manoeuvre pour opérer plus efficacement dans la région."
 Mukti_Bahini.4.d:0 "Avec l'aide d'informateurs locaux, nous avons identifié les positions exactes des soldats d'un bataillon pakistanais opérant dans la zone. Un groupe d'élite d'opérateurs de mortier a tenté de pénétrer dans la zone et de lancer un barrage aux coordonnées indiquées. Malheureusement, nos hommes ont été interceptés par un groupe de soldats pakistanais et ont subi des pertes, notamment des mortiers qui ont dû être abandonnés sur le terrain. Il s'agit d'un revers majeur pour nos opérations. Les forces pakistanaises chercheront à exploiter leur avantage dans la région."
 Mukti_Bahini.5.d:0 "Nous avons récemment recruté plusieurs responsables locaux pour fournir des renseignements à nos forces Mukti Bahini dans la région. L'armée pakistanaise travaille en étroite collaboration avec les autorités gouvernementales locales et dépend d'elles. Nous obtenons des renseignements impressionnants sur les mouvements de troupes et les opérations futures. Ces informations ont déjà conduit à des succès opérationnels. Nous sommes également capables de déplacer Mukti Bahini sans aucun risque d'interception. C'est un succès majeur, nous reprenons petit à petit le contrôle de la zone aux mains des occupants pakistanais."
 Mukti_Bahini.6.d:0 "Nous avons récemment recruté plusieurs responsables locaux pour fournir des renseignements à nos forces Mukti Bahini dans la région. L'armée pakistanaise travaille en étroite collaboration avec les autorités gouvernementales locales et dépend d'elles. Les renseignements obtenus nous ont fait penser que nous obtenions des informations impressionnantes sur les mouvements et les opérations des troupes. Cependant, les fonctionnaires que nous avons recrutés étaient fidèles aux occupants. Ils ont trahi le peuple bengali. Avant que nous réalisions leur trahison, les Pakistanais avaient réussi à intercepter les forces de Mukti Bahini dans la région. Il s'agit d'un revers majeur pour notre cause dans ce domaine."
 Mukti_Bahini.7.d:0 "Un ambitieux commandant de bataillon a identifié un avant-poste majeur de Mukti Bahini dans sa région. Après une reconnaissance minutieuse, il chargea un capitaine de diriger l'assaut. L'opération fut un grand succès, la position fut rapidement envahie et plusieurs mécréants capturés. Ils ont également laissé derrière eux leurs victimes. Nos agents de renseignement ont pu acquérir sur place de précieux documents ennemis. Ce succès a réduit les opérations de Mukti Bahini dans la région et remonté le moral des troupes. Le Capitaine sera à juste titre reconnu pour son excellente conduite."
 Mukti_Bahini.8.d:0 "Un ambitieux commandant de bataillon a identifié un avant-poste majeur de Mukti Bahini dans sa région. Après une reconnaissance minutieuse, il chargea un capitaine de diriger l'assaut. L'opération tourne malheureusement à la débâcle. Nos forces ont été soit prévenues, soit identifiées à l'approche de la position. Les Mukti Bahini étaient bien préparés. Ils infligent de lourdes pertes avant de se retirer. L'avant-poste a été envahi mais l'ennemi avait déjà retiré du site ses documents et son équipement. Il s'agit d'un revers majeur pour nos opérations dans la région. Le bataillon a reçu des informations selon lesquelles nos soldats sont nerveux à l'idée de partir en patrouille."
 Mukti_Bahini.9.d:0 "Nos agents de renseignement ont identifié un avant-poste de Mukti Bahini au coeur de la jungle. L'armée a signalé qu'elle aurait besoin d'un convoi lourd pour attaquer la position, c'est pourquoi il a été demandé à l'armée de l'air de détruire le site. Après avoir reçu les coordonnées et les ordres, nos courageux pilotes ont mené à bien la mission. Ils ont indiqué que le site avait été neutralisé avec succès. Nous avons envoyé une petite patrouille pour inspecter le site. Ils ont identifié des ordonnances détruites et des documents capturés. Il existe des preuves que l'ennemi a subi des pertes et est parti précipitamment. Ce fut un succès majeur. Nous avons démontré que l'ennemi n'a nulle part où se cacher de nos forces."
 Mukti_Bahini.10.d:0 "Nos agents de renseignement ont identifié un avant-poste de Mukti Bahini au coeur de la jungle. L'armée a signalé qu'elle aurait besoin d'un convoi lourd pour attaquer la position, c'est pourquoi il a été demandé à l'armée de l'air de détruire le site. Après avoir reçu les coordonnées et les ordres, nos courageux pilotes ont mené à bien la mission. Ils ont indiqué que le site avait été neutralisé avec succès. Nous avons envoyé une petite patrouille pour inspecter le site. Malheureusement, ils n'ont trouvé aucune preuve de la présence de Mukti Bahini sur le site. Les villageois locaux sont furieux des bombardements et nous pensons que beaucoup sympathisent désormais avec les mécréants. Il s'agit d'un revers majeur qui est exploité comme une victoire de propagande majeure pour les rebelles."
 Mukti_Bahini.11.d:0 "Nos agents de renseignement ont identifié plusieurs Bengalis éminents dans des villages sous influence de Mukti Bahini. Ces hommes croient sincèrement à l'Islam et à l'idéologie du Pakistan. Ils fournissent des informations précieuses sur les partisans éminents de Mukti Bahini et les mouvements de Mukti Bahini dans la région. Nous avons lancé une opération combinée qui a arrêté un certain nombre de ces sympathisants et intercepté plusieurs groupes Mukti Bahini. C'est un succès majeur, nous pouvons désormais consolider notre contrôle sur la zone. Il s'agit d'une victoire majeure pour nos agents du renseignement et du signe d'une coopération militaire exceptionnelle."
 Mukti_Bahini.12.d:0 "Nos agents de renseignement ont identifié plusieurs Bengalis éminents dans des villages sous influence de Mukti Bahini. Nous pensions que ces hommes croyaient sincèrement à l'Islam et à l'idéologie du Pakistan. Ils fournissaient ce que nous pensions être des informations précieuses sur les principaux partisans de Mukti Bahini et les mouvements de Mukti Bahini dans la région. Malheureusement, lorsque nous avons lancé une opération visant à rassembler les sympathisants des rebelles et à intercepter les combattants de Mukti Bahini, cela s'est soldé par un désastre. Les Mukti Bahini n'étaient pas dans les positions identifiées. Plus important encore, il est devenu évident que les hommes que nous détenions étaient en réalité neutres. Ils sympathiseront désormais avec l'ennemi. Les Mukti Bahini exploitent leur succès et renforcent leur influence dans la région."
 Mukti_Bahini.13.d:0 "Le Premier ministre a réuni des hauts responsables du Cabinet et de l'armée pour une conférence privée. La situation au Pakistan oriental se détériore rapidement, l'armée pakistanaise combattant activement le rebelle Mukti Bahini. L'importante population de réfugiés bengalis sur notre territoire soutient fortement le Mukti Bahini. Nos hauts responsables militaires estiment qu'il ne serait pas difficile de leur fournir des armes et une formation plus sophistiquées, notamment aux anciens soldats pakistanais. Ils envisagent déjà d'établir immédiatement des camps d'entraînement de notre côté de la frontière. Certains ministres sont toutefois inquiets. Ils estiment que nous ne devrions pas aggraver la situation et plutôt faire pression sur le Pakistan pour qu'il résolve la crise. Une escalade pourrait pousser davantage de réfugiés à fuir et inciter le Pakistan à riposter."
