l_french:
 LOADING_TIP_0:0 "De Stettin dans la Baltique à Trieste dans l'Adriatique, un rideau de fer est tombé sur le continent.\n- Winston Churchill, 5 mars 1946"
 LOADING_TIP_1:0 "Sous Lénine, l'Union soviétique était comme un renouveau religieux, sous Staline comme une prison, sous Khrouchtchev comme un cirque et sous Brejnev comme la Poste américaine.\n- Zbigniew Brzezinski, 7 novembre 1977."
 LOADING_TIP_2:0 "Monsieur Gorbatchev, abattez ce mur !\n- Ronald Reagan, 12 juin 1987"
 LOADING_TIP_3:0 "Je rêve qu'un jour, sur les collines rouges de Géorgie, les fils d'anciens esclaves et les fils d'anciens propriétaires d'esclaves puissent s'asseoir ensemble à la table de la fraternité. \n- Martin Luther King Jr., 28 août 1963"
 LOADING_TIP_4:0 "Le capitalisme n'est qu'une méthode d'esclavage de gentleman. \n-Kwame Nkrumah, 1968"
 LOADING_TIP_5:0 "Parfois, la démocratie doit être baignée dans le sang.\n- Augusto Pinochet, sans date"
 LOADING_TIP_6:0 "Le communisme n'est pas l'amour. \n Le communisme est un marteau que nous utilisons pour écraser l'ennemi.\n- Mao Zedong, 1er octobre 1949"
 LOADING_TIP_7:0 "Pardonnez à vos ennemis, mais n'oubliez jamais leurs noms.\n-John F. Kennedy, 1963"
 LOADING_TIP_8:0 "Nous n'allons pas envoyer des garçons américains à 9 ou 10 000 milles de chez eux,\n faire ce que les garçons asiatiques devraient faire pour eux-mêmes.\n- Lyndon B. Johnson, 21 octobre 1964"
 LOADING_TIP_9:0 "Je ne perdrai pas le Vietnam.\n-Lydon B.Johnson, 1965"
 LOADING_TIP_10:0 "Aujourd'hui, la liberté est à l'offensive, \n la démocratie est en marche. \n- Douglas MacArthur, 2 décembre 1945"
 LOADING_TIP_11:0 "L'art de la politique consiste à savoir précisément quand\n il faut frapper un adversaire légèrement en dessous de la ceinture.\n-Konrad Adenauer, sans date"
 LOADING_TIP_12:0 "Quand je quitterai la Somalie, je quitterai les bâtiments mais pas les gens. \n- Siad Barre, 1991"
 LOADING_TIP_13:0 "Une révolution n'est pas un lit de roses. Une révolution est une lutte entre le futur et le passé.\n-Fidel Castro"
 LOADING_TIP_14:0 "Le drapeau de la liberté qui flotte aujourd'hui sur le Caire, Damas et Bagdad\n survolera le reste du Moyen-Orient. \n- Gamal Abdel Nasser, 19 juillet 1958"
 LOADING_TIP_15:0 "Et puis j'ai pensé : le monde ne sait rien de Khatyn ! \n Ils sont au courant pour Katyn et du massacre des officiers polonais. \nMais ils ne connaissent pas la Biélorussie. \n-Elem Kilmov, 1977"
 LOADING_TIP_16:0 "La menace d'une guerre mondiale n'existe plus.\n- Mikhaïl Gorbatchev, décembre 1991"
 LOADING_TIP_17:0 "L'apartheid est synonyme de bon voisinage. \n- P.W. Botha, 1998"
 LOADING_TIP_18:0 "Mes conseillers ont construit un mur entre moi et mon peuple.\n Je n'avais pas réalisé ce qui se passait. Quand je me suis réveillé, j'avais perdu mon peuple.\n-Mohammed Reza Pahlavi, sans date"
 LOADING_TIP_19:0 "Un mur vaut bien mieux qu'une guerre.\n- John F. Kennedy, août 1961 "
 LOADING_TIP_20:0 "Que la lumière de la liberté, venant sur toutes les terres sombres, flamboie avec éclat - jusqu'à ce qu'enfin les ténèbres disparaissent. \n Dwight D. Eisenhower, deuxième discours inaugural, 1957"
 LOADING_TIP_21:0 "Que cela vous plaise ou non, l'histoire est de notre côté. \n Nous allons vous enterrer.\n- Nikita Khrouchtchev, 18 novembre 1956"
 LOADING_TIP_22:0 "Je ne suis pas un dictateur et je ne pense pas le devenir. \n Je ne maintiendrai pas le pouvoir avec une mitrailleuse.\n-Fidel Castro, 1959"
 LOADING_TIP_23:0 "La base des idées du Juche est que l'homme est le maître de toutes choses et le facteur décisif de tout. \n -Kim Il-Sung, 1977"
 LOADING_TIP_24:0 "Je suis marxiste-léniniste,\n et je serai marxiste-léniniste jusqu'aux derniers jours de ma vie.\n-Fidel Castro, 1961"
 LOADING_TIP_25:0 "Un jour, j'ai dit : « Nous allons vous enterrer » et j'ai eu des ennuis à cause de cela. \nBien sûr, nous ne vous enterrerons pas avec une pelle. Votre propre classe ouvrière vous enterrera.\n-Nikita Khrouchtchev, 24 août 1963"
 LOADING_TIP_26:0 "Il n'y a pas de contradictions fondamentales entre un système socialiste et une économie de marché. \n- Deng Xiaoping, 4 novembre 1985"
 LOADING_TIP_27:0 "L'humanité doit mettre fin à la guerre, sinon la guerre mettra fin à l'humanité.\n- John F. Kennedy, 25 septembre 1961"
 LOADING_TIP_28:0 "Berlin est le testicule de l'Occident. \n Chaque fois que je veux que l'Occident crie, je presse Berlin.\n- Nikita Khrouchtchev, 1962"
 LOADING_TIP_29:0 "J'aime M. Gorbatchev, nous pouvons faire des affaires ensemble.\n- Margaret Thatcher, 17 décembre 1984"
 LOADING_TIP_30:0 "La démocratie n'est pas pour l'Afrique. \n-Mobuto Sese Seko, 1992"
 LOADING_TIP_31:0 "Les germes des régimes totalitaires sont nourris par la misère et le besoin.\n-Harry S.Truman, 3 mars 1947"
 LOADING_TIP_32:0 "Rien n'est plus précieux que l'indépendance et la liberté.\n- Hô Chi Minh, 1969"
 LOADING_TIP_33:0 "Les survivants d'une guerre nucléaire envieraient les morts.\n- Nikita Khrouchtchev, 20 juillet 1963"
 LOADING_TIP_34:0 "Je dirais que le colonialisme est une chose merveilleuse. Il a propagé la civilisation en Afrique. Avant cela, ils n'avaient pas de langue écrite, pas de roue telle que nous la connaissons, pas d'écoles, pas d'hôpitaux, pas même de vêtements normaux. \n- Ian Smith, juin 1997"
 LOADING_TIP_35:0 "Voici ma stratégie sur la guerre froide : \nnous gagnons, ils perdent.\n- Ronald Reagan, 2 juin 1988"
 LOADING_TIP_36:0 "Tout ce que j'ai fait, je l'ai fait pour mon pays. \n-Pol Pot"
 LOADING_TIP_37:0 "Un homme peut mourir, des nations peuvent s'élever et s'effondrer, mais une idée perdure. \n Les idées durent sans mourir.\n- John F. Kennedy, 14 décembre 1962"
 LOADING_TIP_38:0 "Si tu commences à me jeter des hérissons, \n Je vais jeter quelques porcs-épics sous toi.\n- Nikita Khrouchtchev, 7 novembre 1963"
 LOADING_TIP_39:0 "Les artistes ne sont pas des ingénieurs de l'âme.\n- John F. Kennedy, 26 octobre 1963"
 LOADING_TIP_40:0 "Nos votes doivent aller de pair avec nos armes. \n-Robert Mugabe, 1976"
 LOADING_TIP_41:0 "La politique, c'est comme la boxe : vous essayez d'éliminer vos adversaires. \n- Idi Amin, janvier 1976"
 LOADING_TIP_42:0 "Les régimes implantés à coups de baïonnette ne prennent pas racine.\n- Ronald Reagan, 8 juin 1982"
 LOADING_TIP_43:0 "C'est le moment de votre défaite. \n Vous venez de planter les derniers clous dans le cercueil du communisme.\n- Lech Walesa à ses geôliers, 13 décembre 1981"
 LOADING_TIP_44:0 "Et Il m'a permis de monter à la montagne. Et j'ai regardé. Et j'ai vu la terre promise.\n Je n'y arriverai peut-être pas avec toi. Mais je veux que vous sachiez ce soir que nous, en tant que peuple, atteindrons la terre promise.\n- Martin Luther King Jr., 3 avril 1968"
 LOADING_TIP_45:0 "C'est dans cet esprit, l'esprit des 76, que je vous demande de vous lever et de vous joindre à moi pour porter un toast au président Mao, au premier ministre Chou, aux peuples de nos deux pays et à l'espoir de nos enfants que la paix et l'harmonie puissent être l'héritage de notre génération à la leur.\n- Richard Nixon, 25 février 1972"
 LOADING_TIP_46:0 "Quand j'étais à la Maison Blanche, \nJ'ai été confronté au défi de la guerre froide. L'Union soviétique et moi disposions de 30 000 armes nucléaires capables de détruire la terre entière et je devais maintenir la paix. \n-Jimmy Carter, 30 mars 2012"
 LOADING_TIP_47:0 "Le Nigeria est aujourd'hui aussi oppressif et irréformable\n comme l'était l'Empire Ottoman en Europe de l'Est il y a plus d'un siècle. \n Chukwuemeka Odumegwu Ojukwu, 1969"
 LOADING_TIP_48:0 "L'Occident ne contiendra pas le communisme, il le transcendera. \nNous ne prendrons pas la peine d'y renoncer, nous le rejetterons comme un chapitre bizarre de l'histoire humaine \n dont les dernières pages sont encore en train de s'écrire.\n-Ronald Reagan, 1981"
 LOADING_TIP_49:0 "Mon travail consiste à empêcher la Grande-Bretagne de devenir rouge.\n-Margaret Thatcher, 1977"
 LOADING_TIP_50:0 "Mes compatriotes américains, j'ai le plaisir de vous annoncer aujourd'hui que \nJ'ai signé une loi qui interdira la Russie pour toujours.\n Nous commençons le bombardement dans cinq minutes.\n- Ronald Reagan, 11 août 1984"
 LOADING_TIP_51:0 "Nous, communistes, devons pendant un certain temps nous rallier aux capitalistes. \n Nous avons besoin de leur agriculture et de leur technologie.\n- Léonid Brejnev, 1976"
 LOADING_TIP_52:0 "Nous ne proposons pas de nous asseoir ici dans notre rocking chair les mains jointes \net laissons les communistes établir n'importe quel gouvernement dans l'hémisphère occidental.\n-Lydon B.Johnson, 1965"
 LOADING_TIP_53:0 "Centrafricains ! Ce matin, votre armée a pris le contrôle du gouvernement. \n L'heure de la justice est proche. La bourgeoisie est abolie. \nUne nouvelle ère d'égalité entre tous a commencé. Vive la République ! \n- Jean-Bedel Bokassa, 1er janvier 1966"
 LOADING_TIP_54:0 "Il y a des choses en Russie qui ne sont pas ce qu'elles paraissent. \n- Gueorgui Joukov, 1963"
 LOADING_TIP_55:0 "Nous avons versé un océan de sang pour la fraternité et l'unité de nos peuples, \n et nous ne permettrons à personne d'y toucher ou de le détruire de l'intérieur.\n-Josip Broz Tito, 1975"
 LOADING_TIP_56:0 "L'Union soviétique a en effet été notre plus grande menace\n pas tellement à cause de ce qu'il a fait, \n mais à cause des excuses qu'elle nous a fournies pour nos propres échecs.\n-J.William Fulbright, 1963"
 LOADING_TIP_57:0 "Nous ne risquerons pas prématurément ou inutilement les coûts d'une guerre nucléaire mondiale\n dans lequel même les fruits de la victoire seraient des cendres dans notre bouche - \n mais nous ne reculerons pas non plus devant ce risque chaque fois qu'il faudra y faire face.\n- John F. Kennedy, 1963"
 LOADING_TIP_58:0 "[The Albanians] semblent être des gens plutôt arriérés et primitifs... ils peuvent être aussi fidèles qu'un chien ; c'est un des traits du primitif. \n Nos Tchouvaches étaient les mêmes. Les tsars russes les utilisaient toujours comme gardes du corps. \n Joseph Staline, 1947"
 LOADING_TIP_59:0 "La retenue ? Pourquoi êtes-vous si soucieux de leur sauver la vie ? \n L'idée est de tuer ces salauds. \nÀ la fin de la guerre, s'il reste deux Américains et un Russe en vie, nous gagnons.\n-Thomas Power, 1960"
 LOADING_TIP_60:0 "La religion n'a rien à voir avec la nationalité et le statut d'État... la question des croyances religieuses doit être bien gardée à l'esprit, \n doit être traité avec beaucoup de précaution, car il ne faut pas offenser les sentiments religieux du peuple. \n Joseph Staline à Enver Hoxha, 1949"
 LOADING_TIP_61:0 "Ne nous trompons pas, \n nous sommes aujourd'hui en pleine guerre froide.\n- Bernard Baruch, 16 avril 1947"
 LOADING_TIP_62:0 "Aujourd'hui, nous sommes engagés dans une bataille finale et totale entre l'athéisme communiste et le christianisme. \n Les champions modernes du communisme ont choisi ce moment comme étant le moment \n et mesdames et messieurs, les jeux sont joués, ils sont vraiment joués.\n- Joseph McCarthy, 9 février 1950"
 LOADING_TIP_63:0 "Celui qui n'est pas patriote ne peut pas être considéré comme portugais. \n -António de Oliveira Salazar, 1952"
 LOADING_TIP_64:0 "Si nous voulons maintenir l'Europe contre le communisme, nous ne devons pas bouger. \n Je crois que l'avenir de la démocratie exige que nous restions ici, jusqu'à ce que nous soyons forcés de partir.\n- Lucius D. Clay sur Berlin, 1948"
 LOADING_TIP_65:0 "Je dois mourir pour revoir ceux qui sont morts avant, \n et leur dire que la graine que nous avons semée a pris racine. \n- Mengistu Neway avant son exécution, le 30 mars 1961"
 LOADING_TIP_66:0 "Nous ne voulons pas du nationalisme de quelqu'un d'autre. \n-Jomo Kenyatta, 1964"
 LOADING_TIP_67:0 "Même si la guerre des tirs est terminée, nous sommes au milieu d'une guerre froide qui se réchauffe.\n-Bernard Baruch, 1947"
 LOADING_TIP_68:0 "Nous luttions contre le taux de natalité d'une nation. \n- David Halberstam sur la guerre du Vietnam, 2011"
 LOADING_TIP_69:0 "La seule alternative à la coexistence est la codestruction. \n- Jawaharlal Nehru, 29 août 1954"
 LOADING_TIP_70:0 "Il fallut détruire la ville pour la sauver. \n- Major de l'armée américaine anonyme sur le bombardement d'un village vietnamien, 1968"
 LOADING_TIP_71:0 "Ce sont les soldats qui paient l'essentiel du coût humain. En temps de guerre, il est extraordinaire de voir à quel point tout se résume au caractère d'un seul homme. \n Général Creighton Abrams, 1969"
 LOADING_TIP_72:0 "Un moment arrive, ce qui arrive rarement dans l'histoire, \n quand nous passons de l'ancien au nouveau, quand une époque se termine, \n et quand l'âme d'une nation, longtemps réprimée, trouve la parole. \n- Jawaharlal Nehru, 14 août 1947"
 LOADING_TIP_73:0 "Nous avons toujours regardé vers l'extérieur, vers le Nouveau Monde, \net aujourd'hui, nous regardons vers le Nouveau Monde, vers l'Asie et l'Afrique. \n- Clément Attlee, 8 novembre 1962" 
 LOADING_TIP_74:0 "On ne peut pas opérer de changement fondamental sans une certaine folie.\n-Thomas Sankara, 1985"
 LOADING_TIP_75:0 "Contrairement à ce qu'on pourrait croire, \n Je suis le premier à saluer la manière pacifique avec laquelle les choses ont été résolues. \n- Maurice Yameogo après sa destitution, le 2 janvier 1966"
 LOADING_TIP_76:0 "Les techniques modernes de lavage de cerveau et de menticide \n-ces perversions de la psychologie-\n peut amener presque n'importe quel homme à se soumettre et à s'abandonner. \n- Viol mental de Joost Meerloo, 1956"
 LOADING_TIP_77:0 "Raymond Shaw est le plus gentil, le plus courageux, le plus chaleureux,\n l'être humain le plus merveilleux que j'aie jamais connu dans ma vie. \n- Bennett Marco, 1963"
 LOADING_TIP_78:0 "Je sais que tu es venu pour me tuer. \nTirez sur le lâche, vous n'allez tuer qu'un homme.\n-Ernesto Guevara, 1967"
 LOADING_TIP_79:0 "Si le président sait ce qu'il veut, aucun bureaucrate ne pourra l'arrêter.\n Un président doit savoir quand arrêter de suivre des conseils.\n-Harry S. Truman, 1945"
 LOADING_TIP_80:0 "J'ai commencé la révolution avec 82 hommes. Si c'était à refaire, je le ferais avec 10 ou 15 et une foi absolue. \nPeu importe à quel point vous êtes petit si vous avez la foi et un plan d'action.\n-Fidel Castro, 1959"
 LOADING_TIP_81:0 "Tous les humains sont-ils humains ?\n Ou certains sont-ils plus humains que d'autres ?\n-Roméo Dallaire, 1994"
 LOADING_TIP_82:0 "Je ne le saurais pas. \n Le mercenaire polonais Rafal Ganowicz, lorsqu'on lui demande ce que ça fait de visser une ampoule, 1967"
 LOADING_TIP_83:0 "Nous savions que le monde ne serait plus le même. Peu de gens riaient, peu de gens pleuraient, la plupart restaient silencieux. \n J. Robert Oppenheimer décrivant les réactions au test Trinity, 1965"
 LOADING_TIP_84:0 "Laissez-moi vous dire quelque chose que nous, Israéliens, avons contre Moïse. Il nous a fait traverser le désert pendant 40 ans pour nous amener au seul endroit du Moyen-Orient sans pétrole ! \n Golda Meir"
 LOADING_TIP_85:0 "Il est peu probable que le communisme devienne un jour un facteur important en Éthiopie sous le gouvernement actuel. \n L'activité communiste est limitée et rien n'indique qu'elle ait réellement progressé. \n CIA, 1952"
 LOADING_TIP_86:0 "Même si les révolutionnaires en tant qu'individus peuvent être assassinés, on ne peut pas tuer les idées. \n -Thomas Sankara, une semaine avant son assassinat, 1987"
 LOADING_TIP_87:0 "Sans dignité il n'y a pas de liberté, sans justice il n'y a pas de dignité et sans indépendance il n'y a pas d'hommes libres. \n -Patrice Lamumba, 1960"
 LOADING_TIP_88:0 "Le matérialisme dialectique fonctionne comme la cocaïne, disons. Si vous le reniflez une ou deux fois, cela ne changera peut-être pas votre vie. Mais si vous l'utilisez jour après jour, vous deviendrez un toxicomane, un homme différent.\n -Nicolae Ceausescu, 1972"
 LOADING_TIP_89:0 "Nous sommes doués pour jouer au bord du gouffre, et si nous tombons, nous ne tombons que sur les corps de nos ennemis. \n- Hafez al-Assad"
 LOADING_TIP_90:0 "À celui qui nous donne une bonne main, nous lui avons tendu une bonne main, et à celui qui nous donne une mauvaise main, nous lui avons tendu un couteau qui coupe le mal. \n- Hafez al-Assad"
 LOADING_TIP_91:0 "Il n'y a aucune crainte pour l'avenir. Nous sommes plus forts que tout le monde parce que nous sommes avec la vérité, parce que nous sommes avec les gens, parce que nous sommes avec Dieu et Dieu est avec les gens. \n- Hafez al-Assad"
 LOADING_TIP_92:0 "Un jour viendra dans l'histoire où seuls les Iraniens vous défendront tandis que les Arabes auront enfoncé leurs poignards dans la poitrine des Syriens. \n- Hafez al-Assad, 1985"
 LOADING_TIP_93:0 "Nos martyrs pendant la guerre d'Octobre et au cours de l'histoire resteront des motivations et des sauveurs de la dignité de la nation. \n- Hafez al-Assad, 1er août 1993"
 LOADING_TIP_94:0 "Les Américains devraient connaître le caractère des hommes avec lesquels ils ont affaire à Singapour et ne pas se laisser entraîner davantage dans la calomnie... Ils n'ont pas affaire à Ngo Dinh Diem ou à Syngman Rhee. Vous n'achetez ni ne vendez ce gouvernement. \n- Lee Kuan Yew, 2 septembre 1965"
 LOADING_TIP_95:0 "Ceux qui voudraient nous juger uniquement sur les hauteurs que nous avons atteintes feraient bien de se rappeler de la profondeur d'où nous sommes partis.\n-Kwame Nkrumah"
 LOADING_TIP_96:0 "Les décisions prises à Washington sont plus importantes pour nous que celles prises ici à Dar es-Salaam. Alors peut-être que mon peuple devrait être autorisé à voter aux élections présidentielles américaines.\n- Julius Nyerere"
 LOADING_TIP_97:0 "Il y a la liberté d'expression, mais je ne peux pas garantir la liberté après la parole \n-Idi Amin"
 LOADING_TIP_98:0 "Il vaut mieux mourir pour une idée qui vivra que de vivre pour une idée qui mourra. \n- Steve Biko, sur le régime majoritaire contre l'apartheid"
 LOADING_TIP_99:0 "Restez avec nous, restez dans ce pays et constituez une nation fondée sur l'unité nationale. \n-Robert Mugabe, 1980"
 LOADING_TIP_100:0 "Si vous ne défendez pas quelque chose, vous tomberez dans n'importe quoi. \n-Malcolm X"
 LOADING_TIP_101:0 "Tuez-en trois millions, et le reste nous mangera dans les mains.\n-Yahya Khan, 1971"
 LOADING_TIP_102:0 "Le président Reagan est le lanceur et je suis le receveur. Lorsque le lanceur donne des signes, je coopère sans réserve, mais s'il ne suit pas parfois les signes du receveur, la partie ne peut pas être gagnée. \n- Yasuhiro Nakasone"
 LOADING_TIP_103:0 "Je préfère être dans une tombe en Colombie plutôt que dans une cellule de prison aux États-Unis. \n-Pablo Escobar"
 LOADING_TIP_104:0 "Même si nous savions que la guerre était laide, nous étions obligés de la glorifier parce que la guerre était nécessaire. De nos jours, la guerre n'est plus nécessaire. Mais même si les bougies ne sont plus nécessaires, on préfère quand même dîner aux chandelles. \n-Yukio Mishima"
 LOADING_TIP_105:0 "Je suis extrêmement reconnaissant envers les nombreux citoyens qui ont continué à me soutenir. \n- L'empereur Hirohito lors de la dernière conférence de presse de son règne, 1988"
 LOADING_TIP_106:0 "Les Américains sont de bonnes personnes. Ils n'ont aucune agression contre nous et ils nous aiment comme nous les aimons. Ils doivent savoir que je ne les déteste pas. Je les aime... J'ai entendu dire que c'est une société complexe à l'intérieur. De nombreux Américains ne connaissent pas le monde extérieur. La majorité n'a aucune inquiétude et aucune information sur les autres. - Mouammar Kadhafi"
 LOADING_TIP_107:0 "J'ai été très triste pendant plusieurs jours lorsque j'ai découvert que dans le monde il y avait des pauvres et des riches ; et ce qui est étrange, c'est que l'existence des pauvres ne m'a pas causé autant de douleur que le fait de savoir qu'en même temps il y avait des gens riches. \n  Evita Peron"
 LOADING_TIP_108:0 "Remplissez d'abord vos obligations académiques et vous aurez ensuite le droit de vous qualifier de leader de gauche. \n -Salvador Allende"
 LOADING_TIP_109:0 "Ne me jugez pas sur mon succès, jugez-moi sur le nombre de fois où je suis tombé et me suis relevé. \n -Nelson Mandela"
 LOADING_TIP_110:0 "Cela semble impossible jusqu'à ce que ce soit fait. \n -Nelson Mandela"
 LOADING_TIP_111:0 "L'homme a inventé la bombe nucléaire, mais aucune souris ne ferait de souricière\n -Albert Einstein"
 LOADING_TIP_112:0 "L'augmentation des capacités de combat empêche l'ennemi d'attaquer.\n -Ali Khameinei"
 LOADING_TIP_113:0 "La situation va changer, le sort de la nation sera plus tard clairement inscrit dans les livres d'histoire... Quant à moi, si j'avance, vous me suivrez ; si je recule, vous pouvez me tuer. Si je meurs, vous suivrez mon exemple !\n - Ngo-dinh-Diem, octobre 1963"
 LOADING_TIP_114:0 "\"Le chef de l'Etat [of Marxist-Leninist Grenada] restera Sa Majesté la Reine.\"\n-Maurice Évêque, 1979"
 LOADING_TIP_115:0 "\"Pour voir de vrais héros, regarde autour de toi.\"\n-Mao Zedong, 1936"
 LOADING_TIP_116:0 "\"Peut-être que tu as peur de couler. N'y pense pas. Si tu n'y penses pas, tu ne couleras pas.\"\n-Mao Zedong, 1966"
 LOADING_TIP_117:0 "\"La 'réunion du Cabinet' du gouvernement chinois cède très vite. Même le pet des étrangers peut être considéré comme un 'parfum'.\"\n-Mao Zedong, « Taxe sur les cigarettes » dans « Oeuvres complètes de Mao Tse-Tung », 1923"
 LOADING_TIP_118:0 "\"Aujourd'hui, deux grandes montagnes pèsent comme un poids mort sur le peuple chinois. L'une est l'impérialisme, l'autre est la féodalité.\"\n-Mao Zedong, 11 juin 1945"
 LOADING_TIP_119:0 "\"Guerre aux connards, paix aux connards !\"\n-Friedrich Engels, à Karl Marx, 1869"
 LOADING_TIP_120:0 "\"Je suis un homme qui n'appartient à personne et qui appartient à tout le monde.\"\n-Charles de Gaulle, 1958"
 LOADING_TIP_121:0 "\"Avec tout le respect que je vous dois, Monsieur le Président, vous êtes un connard !\"\n-Joschka Fischer, 1984"
 LOADING_TIP_122:0 "\"Je sais que l'être humain et le poisson peuvent coexister pacifiquement.\"\n-George W. Bush, 2000"
 LOADING_TIP_123:0 "Nous sommes face à face, et je pense que l'autre gars a juste cligné des yeux.\n-Dean Rusk, 1962"
 LOADING_TIP_124:0 "Nous créerons une situation insupportable d'insécurité totale sans aucun espoir de survie ou de vie.\n-Radovan Karadzic, 1995"
 LOADING_TIP_125:0 "Nous le défendrons [The Suez Canal] avec notre sang et notre force, et nous rencontrerons l'agression par l'agression et le mal par le mal. La paix soit avec toi.\n-Gamal Abdel Nasser, juillet 1956"
 LOADING_TIP_126:0 "J'ai toujours été très méfiant envers ceux qui ne me demandaient jamais rien. Habituellement, ceux qui s'assoient à table sans appétit sont ceux qui mangent le plus.\n-Getúlio Vargas"
 LOADING_TIP_127:0 "La Constitution est comme les femmes vierges ; Il a été fait pour être violé.\n-Getúlio Vargas"
 LOADING_TIP_128:0 "Il est presque toujours facile de trouver la vérité. Ce qui est difficile, une fois qu'on l'a trouvé, c'est de ne pas le fuir.\n-Getúlio Vargas"
 LOADING_TIP_129:0 "Cela ne sert à rien de fermer les yeux sur la réalité. Si nous le faisons, la réalité ouvrira nos paupières et nous imposera sa présence. \n-Juscelino Kubitschek"
 LOADING_TIP_130:0 "Staline a demandé aux membres du Politburo : « Pourquoi l'Empire romain s'est-il effondré ? - et se répondit : - \"Parce que c'est devenu dirigé par des secrétaires !\"\n-Feliks Chuev"
 LOADING_TIP_131:0 "Oeil pour oeil rend le monde entier aveugle. \n-Mahatma Gandhi"
 LOADING_TIP_132:0 "La guerre n'est pas seulement une lutte de force, mais aussi une épreuve de moralité et d'éthique.\n-Kim Il-Sung"
 LOADING_TIP_133:0 "Même s'il existe encore des agresseurs impérialistes, l'État qui ne dispose d'aucune puissance de défense propre pour protéger sa souveraineté contre les ennemis internes et externes n'est, en fait, pas un État pleinement indépendant et souverain.\n-Kim Il-Sung, 1972"
 LOADING_TIP_134:0 "Toute ma vie, j'ai eu une certaine idée de la France.\n-Charles de Gaulle."
 LOADING_TIP_135:0 "Le patriotisme, c'est quand l'amour de son propre peuple passe en premier ; le nationalisme, quand la haine envers les autres que les vôtres passe en premier.\n-Charles de Gaulle, 1969"
 LOADING_TIP_136:0 "Nous considérons que l'idéal des Nations Unies est un idéal juif.\n-David Ben Gourion, 14 mai 1948"
 LOADING_TIP_137:0 "N'oubliez pas que la tempête est une bonne occasion pour le pin et le cyprès de montrer leur force et leur stabilité.\n- Hô Chi Minh, 1964"
 LOADING_TIP_138:0 "Le Vietnam est un, le peuple vietnamien est un. Les rivières peuvent s'assécher, les montagnes s'user, mais cette vérité ne change jamais.\n- Hô Chi Minh"
 LOADING_TIP_139:0 "Il ne suffit pas de faire de notre mieux ; parfois, nous devons faire ce qui est requis.\n-Winston Churchill"
 LOADING_TIP_140:0 "Bienheureux soient les peuples dont les dirigeants peuvent regarder le destin dans les yeux sans broncher mais aussi sans chercher à jouer à Dieu.\n-Henry Kissinger, 1982"
 LOADING_TIP_141:0 "Il peut être dangereux d'être l'ennemi de l'Amérique, mais être l'ami de l'Amérique est fatal.\n-Henry Kissinger, novembre 1968"
 LOADING_TIP_142:0 "Le plus important est que les hommes ne doivent pas laisser les femmes se sentir opprimées simplement parce qu'elle est une femme et qu'il est un homme.\n-Saddam Hussein, 1978"
 LOADING_TIP_143:0 "Les femmes représentent la moitié de la société. Notre société restera arriérée et enchaînée à moins que ses femmes ne soient libérées, éclairées et éduquées.\n-Saddam Hussein"
 LOADING_TIP_144:0 "Si, à ma mort, je suis toujours un dictateur, je tomberai certainement dans l'oubli de tous les dictateurs.\n-Chiang Kaï-chek"
 LOADING_TIP_145:0 "Un homme n'est pas fini lorsqu'il est vaincu. Il a fini quand il s'arrête.\n-Richard Nixon, 1969"
 LOADING_TIP_146:0 "Un gouvernement assez grand pour vous donner tout ce que vous voulez est un gouvernement assez grand pour vous prendre tout ce que vous avez.\n-Gerald Ford, 12 août 1974"
 LOADING_TIP_147:0 "Le premier devoir du gouvernement est de protéger la population, et non de gérer sa vie.\n-Ronald Reagan, 30 mars 1981"
 LOADING_TIP_148:0 "Abraham Lincoln a libéré l'homme noir. À bien des égards, le Dr King a libéré l'homme blanc.\n-Ronald Reagan, 15 janvier 1983"
 LOADING_TIP_149:0 "Tout ce que nous disons, c'est de donner une chance à la paix.\n- John Lennon, 1er juillet 1969"
 LOADING_TIP_150:0 "Tout va bien au final. Si ça ne va pas, ce n'est pas la fin.\n-John Lennon"
 LOADING_TIP_151:0 "Je me porterais volontaire pour aller en prison, tant qu'il y a des livres. Parce qu'avec les livres, je suis libre.\n-Mohammad Hatta"
 LOADING_TIP_152:0 "Le fait qu'une guerre atomique puisse éclater n'est-ce pas de la lutte des classes ? Il n'y a pas d'alternative à la lutte des classes.\n- Viatcheslav Molotov"