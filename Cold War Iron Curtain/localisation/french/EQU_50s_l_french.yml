l_french: 

 ROC_Review_the_Economy: "Revoir l'économie"
 ROC_Review_the_Economy_desc: "Les colonies françaises doivent réévaluer leur statut après la Seconde Guerre mondiale. Nous devrions également voir si nous pouvons améliorer l'une de nos infrastructures."
 ROC_Military_Reform: "Réforme militaire"
 ROC_Military_Reform_desc: "Beaucoup de nos plus brillants sont désormais en France après avoir montré leur mérite en combattant la France de Vichy. Il faut compenser."
 ROC_The_Matters_of_Colonial_Administration: "La question de l'administration coloniale"
 ROC_The_Matters_of_Colonial_Administration_desc: "Le système colonial doit être remanié à une époque de connectivité croissante."
 ROC_The_New_Governor_1951: "Le nouveau gouverneur"
 ROC_The_New_Governor_1951_desc: "Le temps de Cornut est écoulé. La France a dicté le départ de Bernard."
 ROC_Standardize_Laws: "Standardiser les lois"
 ROC_Standardize_Laws_desc: "Nous devrions normaliser les lois dans ces colonies afin d'accroître l'efficacité de notre gouvernement."
 ROC_An_Equatorial_Customs_Union: "Une union douanière équatoriale"
 ROC_An_Equatorial_Customs_Union_desc: "Nous devons établir formellement une union économique entre nos colonies. Cela augmentera l'efficacité de nos usines."
 ROC_Aid_From_the_Homeland: "Aide de la patrie"
 ROC_Aid_From_the_Homeland_desc: "Nous pouvons demander une aide industrielle aux Français. Nous étions la région la plus dévouée et restions fidèles aux Vrais Français malgré l'existence des Français de Vichy."
 ROC_More_Rubber: "Plus de caoutchouc"
 ROC_More_Rubber_desc: "Le caoutchouc est l'un des produits de base de notre économie. Il nous en faut davantage."
 ROC_Industry_of_Brazzaville: "Industrie de Brazzaville"
 ROC_Industry_of_Brazzaville_desc: "Encourageons un pôle industriel prometteur. Notre industrie doit croître en taille."
 ROC_Inroads_into_Africa: "Incursions en Afrique"
 ROC_Inroads_into_Africa_desc: "Nous avons besoin de davantage de moyens de transport entre les colonies équatoriales."
 ROC_Mining_in_Chad: "L'exploitation minière au Tchad"
 ROC_Mining_in_Chad_desc: "Le Tchad est riche en ressources rares. Nous devrions exploiter ce fait."
 ROC_Minds_of_Tommorrow: "Les esprits de demain"
 ROC_Minds_of_Tommorrow_desc: "Nous devons faire un effort cumulatif pour éduquer les autochtones."
 ROC_Public_Schools: "Écoles publiques"
 ROC_Public_Schools_desc: "Les écoles publiques encourageront l'égalité et toucheront davantage de personnes. Cela pourrait irriter certains chefs autochtones qui craignent les conséquences que cela pourrait avoir sur leurs pratiques traditionnelles."
 ROC_Teach_Local_Languages: "Enseigner les langues locales"
 ROC_Teach_Local_Languages_desc: "Les langues locales sont l'épine dorsale de ces colonies. Sans eux, rien ne peut être fait aux autochtones. Cela fera plaisir à beaucoup de gens dans nos colonies en signe d'indigénisation."
 ROC_Private_Schools: "Écoles privées"
 ROC_Private_Schools_desc: "Les écoles privées encouragent l'ordre. Personne ne s'en plaindra."
 CAN_Encourage_French: "Encourager le français"
 CAN_Encourage_French_desc: "Enseigner le français principalement augmentera la fidélité des autochtones tout en les rendant un peu hautains. Cela nous donnera cependant un capital politique supplémentaire pour négocier avec la France."
 ROC_Teaching_Reforms: "Réformes de l'enseignement"
 ROC_Teaching_Reforms_desc: "L'apprentissage dans ces colonies doit être facilité. Nous devons embaucher de meilleurs enseignants et revoir notre système d'enseignement."
 ROC_Catholic_Missionaries: "Missionnaires catholiques"
 ROC_Catholic_Missionaries_desc: "Nous devrions encourager le partenariat de ces écoles privées avec des missionnaires catholiques. Cela ne fera que solidifier l'ordre établi."
 ROC_Local_Troops: "Troupes locales"
 ROC_Local_Troops_desc: "Nous devons encourager les gens à rejoindre notre armée. Cela compensera l'émigration des soldats français après la Seconde Guerre mondiale."
 ROC_Local_Officers: "Officiers locaux"
 ROC_Local_Officers_desc: "Nous devons construire notre propre culture militaire, indépendante de la France. Nous devrions encourager les locaux à rejoindre notre corps d'armée."
 ROC_Officer_Schools: "Écoles d'officiers"
 ROC_Officer_Schools_desc: "L'ouverture d'écoles d'officiers locales encouragera notre propre culture militaire et nous rendra plus autonomes. Cela résoudra également le problème des officiers autochtones sans talent."
 ROC_Officers_from_Home: "Officiers à domicile"
 ROC_Officers_from_Home_desc: "Nous devons continuer à dépendre de la France pour nos stratégies militaires."
 ROC_Bargain_with_France: "Négocier avec la France"
 ROC_Bargain_with_France_desc: "Nous pourrions demander à la France certaines divisions militaires compte tenu de notre loyauté à leur égard."
 ROC_Army_Reform: "Réforme de l'armée"
 ROC_Army_Reform_desc: "Nous devons repenser le fonctionnement de notre armée. Nous devons déterminer ses priorités."
 ROC_Jeeps_Across_the_Plains: "Jeeps à travers les plaines"
 ROC_Jeeps_Across_the_Plains_desc: "Notre objectif principal doit être le Nord, où les divisions motorisées travaillent efficacement et où nous sommes menacés par l'Égypte et la Libye. Les divisions motorisées sont le moyen de moderniser notre armée."
 ROC_Cut_the_Trees: "Coupez les arbres"
 ROC_Cut_the_Trees_desc: "Nous devons nous concentrer sur les techniques de déboisement pour permettre à nos troupes motorisées de traverser la jungle. Des exercices pratiques libéreront de l'espace pour les usines tout en apprenant à notre armée comment déplacer des Jeeps dans la jungle."
 ROC_Army_of_the_Brush_and_Jungle: "Armée du pinceau et de la jungle"
 ROC_Army_of_the_Brush_and_Jungle_desc: "L'Afrique équatoriale est principalement constituée de forêts et de jungles. Nous devons nous concentrer sur la défense de la majorité de notre pays. Les troupes motorisées ne font rien dans la jungle."
 ROC_Local_Initiative: "Initiative Locale"
 ROC_Local_Initiative_desc: "Nous devons inspirer les autochtones pour qu'ils défendent cette nation. Leur expérience des traditions et des régions locales aidera grandement notre armée."
 ROC_Minor_Details: "Détails mineurs"
 ROC_Minor_Details_desc: "Bien que nous soyons une colonie, la Patrie nous laisse une certaine latitude quant à la manière de nous comporter. Réévaluons notre politique dans cette nouvelle ère."
 ROC_Undermine_French_Governors: "Saper les gouverneurs français"
 ROC_Undermine_French_Governors_desc: "Les gouverneurs sont des amateurs. Ils retiennent cette nation et créent une culture de népotisme. Ils doivent être supprimés en silence."
 ROC_Support_the_French_Governors: "Soutenez les gouverneurs français"
 ROC_Support_the_French_Governors_desc: "Les gouverneurs français sont inestimables. Ils connaissent ce pays presque aussi bien que les indigènes. Ils peuvent contrôler leurs populations indigènes. Nous devons les soutenir dans leurs efforts pour franciser ce territoire."
 ROC_Restrict_Local_Councils: "Restreindre les conseils locaux"
 ROC_Restrict_Local_Councils_desc: "Les conseils locaux constituent un tremplin vers l'indépendance et l'indigénisation. Ils vont détruire cette terre."
 ROC_Forced_Labor: "Travail forcé"
 ROC_Forced_Labor_desc: "Le travail forcé a bien fonctionné au Congo. Il faut le mettre en oeuvre ici pour pouvoir se moderniser."
 ROC_Cooperate_with_Local_Councils: "Coopérer avec les conseils locaux"
 ROC_Cooperate_with_Local_Councils_desc: "Compte tenu de certains changements dans leur façon de travailler, les conseils locaux peuvent gagner l'affection de notre gouvernement auprès de la population locale."
 ROC_The_Governors_Government: "Le gouvernement du gouverneur"
 ROC_The_Governors_Government_desc: "Notre système gouvernemental a été réorganisé dans la mesure où nous pouvons le changer jusqu'à présent. Continuons avec le changement."
 ROC_Request_Autonomy: "Demander l'autonomie"
 ROC_Request_Autonomy_desc: "Nous ne pouvons nous moderniser qu'en tant que colonie. Il est nécessaire de gagner plus d'autonomie et de pouvoir introduire rapidement les meilleures politiques sur le terrain."
 ROC_Autonomy_Denied: "Autonomie refusée"
 ROC_Autonomy_Denied_desc: "Il semble que les Français ne soient pas prêts à rompre avec l'Afrique équatoriale. Il faut leur faire voir la lumière."
 ROC_Stir_Up_Discontent: "Attiser le mécontentement"
 ROC_Stir_Up_Discontent_desc: "La France doit savoir à quel point le manque d'autonomie est répressif."
 ROC_Native_Resentment: "Ressentiment autochtone"
 ROC_Native_Resentment_desc: "Il est inévitable que certains commencent à haïr notre gouvernement en raison de notre interprétation littérale de la politique française."
 ROC_Stage_Riots: "Émeutes de scène"
 ROC_Stage_Riots_desc: "Nous devons continuer. L'autonomie pour nous et pour le peuple est en vue."
 ROC_Demand_Emergency_Powers: "Exiger des pouvoirs d'urgence"
 ROC_Demand_Emergency_Powers_desc: "Nous devons réprimer ces manifestants. La France saura alors qu'elle a commis une erreur."
 ROC_Autonomy_Accepted: "Autonomie Acceptée"
 ROC_Autonomy_Accepted_desc: "Après un long processus de négociation, la France a finalement décidé de céder une partie de sa suzeraineté à notre gouvernement de Pointe-Noire."
 ROC_Administrative_Reform: "Réforme administrative"
 ROC_Administrative_Reform_desc: "Pour faire simple, la direction française retenait ce territoire. Maintenant, tout va changer."
 ROC_Power_to_the_Governor: "Pouvoir au gouverneur"
 ROC_Power_to_the_Governor_desc: "Le gouverneur ne sera pas seulement le chef de notre gouvernement de nom. Tous seront soumis."
 ROC_A_Unitary_Constitution: "Une Constitution Unitaire"
 ROC_A_Unitary_Constitution_desc: "Oubangui-Chari, Gabon, Congo. Ce ne sont pas des États indépendants possibles. Le seul État indépendant possible dans cette zone est l'Afrique équatoriale."
 ROC_Suspend_our_Ambitions: "Suspendre nos ambitions"
 ROC_Suspend_our_Ambitions_desc: "Nous sommes allés trop loin. Nous devons calmer les gens."
 ROC_Governor_Chauvet_Takes_Command: "Le gouverneur Chauvet prend le commandement"
 ROC_Governor_Chauvet_Takes_Command_desc: "Gabriel Chauvet est là pour sauver le peuple africain des abus du Cornut-Gentille."
 ROC_Locals_In_Civil_Service: "Sections locales de la fonction publique"
 ROC_Locals_In_Civil_Service_desc: "Nous devons rendre notre administration plus efficace en incluant la population locale."
 ROC_Regional_Autonomy: "Autonomie régionale"
 ROC_Regional_Autonomy_desc: "Pensons à l'idée d'autonomie régionale. Faut-il l'augmenter ou le diminuer ?"
 ROC_Destandardize_Laws: "Dénormaliser les lois"
 ROC_Destandardize_Laws_desc: "Dans une démarche d'autonomie, nous devrions abandonner l'idée de maintenir les lois identiques sur tout ce territoire. Cela n'a aucun sens que chaque État ait le même ensemble de lois."
 ROC_Keep_the_Current_System: "Conserver le système actuel"
 ROC_Keep_the_Current_System_desc: "L'Afrique équatoriale progressera en élargissant son autorité, et non en déstandardisant."
 ROC_Invite_Cameroon: "Inviter le Cameroun"
 ROC_Invite_Cameroon_desc: "Le mandat du Cameroun devrait nous être confié. Demandons aux gouverneurs locaux ce qu'ils en pensent."
 ROC_Union_of_Central_African_Republics: "Union des Républiques Centrafricaines"
 ROC_Union_of_Central_African_Republics_desc: "Nous devrions officiellement changer de nom. Nous ne sommes pas simplement français."
 ROC_1951_Development_Plan: "Plan de développement de 1951"
 ROC_1951_Development_Plan_desc: "Créons un ensemble de plans pour moderniser notre nation."
 ROC_End_Forced_Labor: "Mettre fin au travail forcé"
 ROC_End_Forced_Labor_desc: "Débarrassons-nous de la pratique inhumaine de ce que l'on appelle les pseudo-goulags."
 ROC_Development_Plan_Modernization_51: "Plan de modernisation de 1951"
 ROC_Development_Plan_Modernization_51_desc: "Notre pays doit avancer."
 ROC_1953_Development_Plan: "Plan de développement de 1953"
 ROC_1953_Development_Plan_desc: "Nous continuerons à progresser."
 ROC_Development_Plan_Modernization_53: "Plan de modernisation de 1953"
 ROC_Development_Plan_Modernization_53_desc: "Nous devons continuer à nous concentrer sur l'avenir de notre pays."
 ROC_The_State_of_Equatorial_Africa: "L'état de l'Afrique équatoriale"
 ROC_The_State_of_Equatorial_Africa_desc: "Il est temps de déclarer un nouvel État africain. C'est désormais la réalité. Nos rêves sont devenus réalité."
 ROC_A_Union_Under_Gentille: "Une Union sous Gentille"
 ROC_A_Union_Under_Gentille_desc: "Nous ne devons pas oublier qui nous a amenés ici. Donnons-lui le titre le plus élevé possible. Il sera consul, comme Napoléon."
 ROC_Sweeten_the_Deal: "Adoucir l'affaire"
 ROC_Sweeten_the_Deal_desc: "La France ne verra sûrement pas d'inconvénient à l'indépendance si nous leur donnons quelque chose en retour."
 ROC_France_Rejects: "La France rejette"
 ROC_France_Rejects_desc: "Malheureusement, la France ne nous a pas encore donné l'indépendance. Nous devons voir ce que nous pouvons faire."
 ROC_Request_Independence: "Demander l'indépendance"
 ROC_Request_Independence_desc: "Nous pensons avoir montré à la France que nous sommes prêts à l'indépendance. Attendons leur réponse."
 ROC_France_Accepts: "La France accepte"
 ROC_France_Accepts_desc: "Aujourd'hui est un jour heureux. La France nous a donné l'indépendance."
 ROC_Autonomy_to_Gabon: "Autonomie gabonaise"
 ROC_Autonomy_to_Gabon_desc: "Le Gabon est confronté à peu près au même problème que l'Oubangui-Chari, mais il a besoin de plus d'autonomie en raison de sa proximité avec le Cameroun et les participations espagnoles."
 ROC_Give_Political_Authority_to_Ubangi_Shari: "Déléguer le pouvoir à l'Oubangui-Chari"
 ROC_Give_Political_Authority_to_Ubangi_Shari_desc: "Nous devrions donner plus de pouvoir aux gouverneurs locaux de l'Oubangui-Chari. Ils sont isolés de Pointe-Noire et nécessitent une attention locale particulière."
 ROC_Dissolution_of_French_Equatorial_Africa: "Dissolution de l'Afrique équatoriale française"
 ROC_Dissolution_of_French_Equatorial_Africa_desc: "La décolonisation ne peut plus être freinée. Il est désormais temps de se dissoudre."
 ROC_1955_Development_Plan: "Plan de développement de 1955"
 ROC_1955_Development_Plan_desc: "Il est temps de poursuivre nos projets industriels."
 ROC_Development_Plan_Modernization_55: "Plan de modernisation de 1955"
 ROC_Development_Plan_Modernization_55_desc: "Nous rattraperons l'industrie française d'ici 1960 !"
 roc_france_pay: "Paiements vers la France"
 roc_france_pay_desc: "Nous payons la France pour obtenir son indépendance."
 roc_france_give: "Paiements en Afrique équatoriale"
 roc_france_give_desc: "Nous recevons des hommages de notre colonie d'Afrique équatoriale en échange de son indépendance."
 equ.1.t: "Changement de gouverneur"
 equ.1.d: "Les Français ont décidé que le temps de Bernard Cornut-Gentille était écoulé. On lui avait promis gouverneur quelques années après la Seconde Guerre mondiale. Cependant, il a servi ce temps, et maintenant la France souhaite le rappeler et le remplacer par un autre gouverneur, Paul Louis Gabriel Chauvet. Nous pouvons contester cela, mais personne ne sera content et notre opportunité de réforme sera manquée."
 equ.1.a: "Renvoyer Gentille chez elle"
 equ.1.b: "Gardez Gentille"