 NGA_igbo_yoruba_hausa_divide:0 "Clivage Igbo-Yoruba-Haoussa"
 NGA_shell_monopoly:0 "Monopole Shell D'Arcy"
 NGA_shell_monopoly_desc:0 "Shell D'Arcy, créée en 1937, est avant tout une société d'exploration et d'arpentage qui cherche à découvrir des gisements de pétrole au Nigeria, même si elle n'a pas encore connu beaucoup de succès. Alors que la plupart des Nigérians pensent qu'ils recherchent simplement de l'huile de palme, les conséquences sur le Nigeria pourraient s'avérer bien plus sinistres sous ce monopole étranger néerlando-britannique s'il trouvait ce qu'il cherche..."
 NGA_shell_monopoly_1:0 "Monopole Shell D'Arcy"
 NGA_shell_monopoly_1_desc:0 "Shell D'Arcy, créée en 1937, est avant tout une société d'exploration et d'arpentage qui cherche à découvrir des gisements de pétrole au Nigeria, même si elle n'a pas encore connu beaucoup de succès. Alors que la plupart des Nigérians pensent qu'ils recherchent simplement de l'huile de palme, les conséquences sur le Nigeria pourraient s'avérer bien plus sinistres sous ce monopole étranger néerlando-britannique s'il trouvait ce qu'il cherche..."
 NGA_shell_bp_PDCNL:0 "Shell-BP PDCNL"
 NGA_shell_bp_PDCNL_desc:0 "Avec la découverte de gisements pétroliers mineurs dans le delta du Niger, Shell-BP a établi sa propre direction au Nigeria avec la création de Shell-BP Petroleum Development Company Nigeria Limited (Shell-BP PDCNL). Alors que les minorités ethniques du delta du Niger croient que les sociétés étrangères sont responsables de l'exploitation de leur peuple et de leurs terres ancestrales, les élites coloniales locales sont heureuses de récolter les bénéfices des partenaires du pays d'origine et de leur voisin néerlandais."
 NGA_shell_bp_PDCNL_1:0 "Shell-BP PDCNL"
 NGA_shell_bp_PDCNL_1_desc:0 "Fort de gisements pétroliers notables découverts en 1958 dans le delta du Niger, Shell-BP a établi sa propre direction au Nigeria avec la création de Shell-BP Petroleum Development Company Nigeria Limited (Shell-BP PDCNL). Alors que les minorités ethniques du delta du Niger croient que les sociétés étrangères sont responsables de l'exploitation de leur peuple et de leurs terres ancestrales, les riches élites igbo, haoussa et yoruba sont heureuses de prendre leur part des bénéfices de leurs partenaires néerlandais et britanniques."
 NGA_richards_constitution:0 "Constitution de Richard"
 NGA_richards_constitution_desc:0 "Les conventions dirigées par les gouverneurs coloniaux du Nigéria ont été, dans l'histoire récente, des outils importants pour apaiser les désirs des élites autochtones et coloniales. Si nous souhaitons maintenir cette poudrière de colonie unie, les gouverneurs suivants devront apporter des amendements à la constitution."
