#1950s
 nga50.1.d:0 "En réponse aux demandes croissantes de représentation régionale et aux mouvements indépendantistes croissants au Nigeria, la couronne a mandaté un conseil constitutionnel au Nigeria. Étant donné que diverses propositions sont impopulaires, ce qui sera le plus probablement retenu à l'avenir est la création d'un conseil des ministres et d'une assemblée fédérale."
 nga50.2.d:0 "Depuis la fusion du nord et du sud du Nigeria en une seule colonie, les Igbos entrepreneurs migrent vers le nord à la recherche de meilleures opportunités d'emploi. Cependant, comme c'est le cas de nombreux migrants prospères, ils se sentent irrités par leurs voisins autochtones. Cela a été clairement démontré la semaine dernière lors d'une série d'émeutes dans la ville de Kado, dans le nord du pays, où de grandes sections d'entreprises et de maisons igbo ont été détruites par les habitants du Nord"
 nga50.4.d:0 "La coentreprise de British Petroleum et de la Royal Dutch Shell Company a commencé une étude à grande échelle des ressources de la colonie et du protectorat du Nigeria. Avec une enquête couvrant toutes les grandes régions du Nigeria, nous verrons quelle valeur économique le Nigeria a en dehors de son rôle agricole actuel dans les cultures de rente comme le coton et le caoutchouc."
 nga50.5.d:0 ""
 nga50.6.d:0 "Cette année, un parti politique majeur a été fondé par le chef Obafemi Awolowo, un véritable journaliste autodidacte qui a créé son propre journal il y a plusieurs années. Le parti prône des politiques généralement sociales-démocrates similaires au parti travailliste au Royaume-Uni, mais est considéré par beaucoup comme simplement un premier parti des intérêts yoruba. "
 nga50.7.d:0 "Depuis la fusion des colonies nigérianes du nord et du sud, les Britanniques ont favorisé le nord organisé, plus autoritaire, afin de renforcer la domination indirecte de l'Empire dans la région. Dans une tentative d'acquérir davantage de contrôle sur les ressources de la nation, le Royaume-Uni a poursuivi cette approche dans les années 1950, où il s'est retrouvé incapable de mettre en oeuvre la réforme constitutionnelle appropriée pour maintenir à distance les tensions ethniques du Nigeria. Cela conduit désormais inévitablement au moment où le NCNC de Nnamdi Azikiwe dirige une République Igbo indépendante, tandis qu'en même temps, à l'ouest, le Groupe d'action d'Obafemi Awolowo a déclaré un État yoruban indépendant connu sous le nom de République d'Oduduwa."
 nga50.8.d:0 "En mettant fin aux rébellions de la nation, nous sommes parvenus à une solution acceptable dans les accords récents, pour diviser le Nigeria en une confédération lâche entre une moitié musulmane du nord et la moitié chrétienne et ingénieuse du sud. Le Nord et le Sud trouvent tous deux cette solution appropriée car elle créerait de facto des nations nigérianes séparées qui seront toujours représentées ensemble dans les accords diplomatiques et commerciaux à travers le monde. Une autre stipulation de l'accord est que les deux moitiés du Nigeria sont libres de déclarer leur indépendance à tout moment (en théorie) par le biais d'un référendum public."
 nga50.9.d:0 ""
 nga50.10.d:0 "La Grande-Bretagne, motivée par sa stratégie militaire mondiale de guerre froide, veut garantir ses intérêts à long terme en Afrique subsaharienne. L'establishment islamique du Nord, qui est malgré tout favorable aux Britanniques, est intéressé par cet accord car sa perspective de guerre froide est intrinsèquement anticommuniste. Toutefois, compte tenu de l'état-major militaire du Nigeria, trop dominé par les Anglo-saxons, une conséquence imprévue de cette situation sera probablement un processus plus long d'africanisation des forces armées après l'indépendance."
 nga50.11.d:0 "Suite à la création de la constitution Macpherson, le Nigeria en tant que colonie est composé de trois zones administratives (Nord, Est et Ouest), chacune dirigée par un Premier ministre élu par une assemblée régionale pour chaque zone. Nnamdi Azikiwe, au cours de sa carrière politique, a dirigé le NCNC dans une lutte acharnée avec le Groupe d'action à dominante yoruba d'Obafemi Awolowo pour le contrôle de la région occidentale. La région occidentale étant la capitale du pays, c'était ce pour quoi Zik se battait car il voulait transcender les lignes ethniques avec son parti panafricaniste, bien que cela se soit soldé par une futilité puisque la majorité yoruba de la région occidentale voterait perpétuellement selon des lignes ethniques. Cet échec l'a cependant conduit à retourner dans la région orientale à dominante igbo où la majorité du NCNC a volontiers fait des propositions pour l'accueillir et l'élire comme premier ministre de la région."
 nga50.12.d:0 "Sir Ahmadu Bello, le noble de Sokoto, a de nouveau fait sensation avec une interview controversée sur la BBC dans laquelle il a défendu une politique de « nothernisation » dans laquelle les Nordistes sont favorisés en premier dans l'embauche au-dessus des Igbos. Sa rhétorique était basée sur la nature trop dominante et ambitieuse des Igbos et sur le fait que pour limiter leur influence, il est nécessaire de maintenir les habitants du Nord dignes de confiance à des postes importants et dans la bureaucratie en général. Il a ensuite déclaré que le Nigeria était loin d'être prêt à accéder à l'indépendance et qu'il pourrait voir le colonialisme exister au Nigeria pendant encore vingt ans si cela était nécessaire."
 nga50.13.d:0 "Chinua Achebe, un Igbo du sud-est du pays et ancien élève de l'Université d'Ibadan, vient de publier par l'intermédiaire d'une société britannique, \"Things Fall Apart\" qui, bien que lent à décoller au Nigeria, circule dans le monde entier et reçoit un accueil très favorable des critiques."
 nga50.14.d:0 "Le romancier nigérian Chinua Achebe a publié en juin dernier le premier livre à succès international écrit par un Africain, \"Things Fall Apart\", qui raconte l'histoire d'un Igbo nommé Okonkwo qui vit au Nigeria à l'aube du colonialisme dans la région. Le livre est une tentative de retirer la littérature africaine d'un point de vue exclusivement colonial en construisant une histoire basée sur les traditions orales et les techniques traditionnelles de narration africaines d'une manière qui changera à jamais la littérature en Afrique. « Things Fall Apart » est en passe de s'imposer comme le livre le plus célèbre de l'histoire de l'Afrique, tandis qu'au Nigeria, l'impact du livre n'est pas encore visible."
