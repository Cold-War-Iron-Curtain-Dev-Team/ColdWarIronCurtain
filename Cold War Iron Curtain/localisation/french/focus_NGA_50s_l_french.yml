 #50s focus tree
 NGA_1950_ibadan_constitutional_conference:0 "Conférence constitutionnelle d'Ibadan"
 NGA_1950_ibadan_constitutional_conference_desc:0 "En raison des tensions entre l'aristocratie autocratique dominante du Nord et les migrants Igbo du Sud-Est, nous sommes une fois de plus attirés par une conférence constitutionnelle basée sur les mesures coloniales nécessaires pour faire face à ces troubles."
 NGA_1950_create_the_macpherson_constitution:0 "Créer la Constitution Macpherson"
 NGA_1950_create_the_macpherson_constitution_desc:0 "La Constitution Macpherson est la dernière itération du droit colonial au Nigeria"
 NGA_1950_create_a_council_of_ministers:0 "Créer un Conseil des Ministres"
 NGA_1950_create_a_council_of_ministers_desc:0 "La création d'un conseil des ministres permettra une administration coloniale plus coordonnée"
 NGA_1950_create_a_federal_assembly:0 "Créer une Assemblée fédérale"
 NGA_1950_create_a_federal_assembly_desc:0 "Avec une assemblée fédérale, une plus grande représentation sera accordée aux diverses factions politiques ; offrant un contenu plus populeux."
 NGA_1950_africanization_of_civil_services:0 "Africanisation de la fonction publique"
 NGA_1950_africanization_of_civil_services_desc:0 "En plaçant les Nigérians autochtones dans des rôles communs dans notre bureaucratie, nous africaniserons la fonction publique et préparerons la colonie à l'indépendance."
 NGA_1950_grant_northern_regional_autonomy:0 "Accorder l'autonomie régionale du Nord"
 NGA_1950_grant_northern_regional_autonomy_desc:0 "En accordant l'autonomie régionale au Nord, nous leur permettreons de mettre en oeuvre une politique d'abord axée sur les Nordistes"
 NGA_1950_grant_the_igbo_regional_autonomy:0 "Accorder l'autonomie régionale aux Igbo"
 NGA_1950_grant_the_igbo_regional_autonomy_desc:0 "Nous autoriserons l'autonomie régionale dans la région Igbo du sud-est, en attribuant davantage de pouvoir aux dirigeants locaux."
 NGA_1950_maintain_the_richards_constitution:0 "Maintenir la Constitution de Richards"
 NGA_1950_maintain_the_richards_constitution_desc:0 "Nous maintiendrons simplement la constitution coloniale actuelle du Nigeria"
 NGA_1950_build_an_electrical_grid_in_kano:0 "Construire un réseau électrique à Kano"
 NGA_1950_build_an_electrical_grid_in_kano_desc:0 "Kano ne dispose pas d'un réseau électrique majeur, ce problème devrait sûrement être résolu"
 NGA_1950_develop_urban_infrastructure:0 "Développer les infrastructures urbaines"
 NGA_1950_develop_urban_infrastructure_desc:0 "Nous devons développer les infrastructures urbaines"
 NGA_1950_centralize_resource_extraction:0 "Centraliser l'extraction des ressources"
 NGA_1950_centralize_resource_extraction_desc:0 "Avec une population plus proche du Nord autocratique, nous devrions être en mesure de centraliser notre extraction de ressources"
 NGA_1950_invite_foreign_companies_to_kaduna:0 "Inviter des entreprises étrangères à Kaduna"
 NGA_1950_invite_foreign_companies_to_kaduna_desc:0 "Pour favoriser l'aristocratie du Nord la plus fidèle à l'administration coloniale, nous inviterons des entreprises étrangères à Kaduna"
 NGA_1950_invite_foreign_companies_to_kano:0 "Inviter des entreprises étrangères à Kano"
 NGA_1950_invite_foreign_companies_to_kano_desc:0 "Pour favoriser l'aristocratie du Nord, la plus fidèle à l'administration coloniale, nous inviterons des entreprises étrangères à Kano"
 NGA_1950_kano_riots:0 "Les émeutes de Kano"
 NGA_1950_kano_riots_desc:0 "Les habitants du Nord, qui se sentent privés de leurs droits face aux sudistes trop prospères, ont commencé à vandaliser et à détruire les propriétés igbo dans la ville de Kano ; conduisant à une émeute incontrôlable."
 NGA_1950_lyttleton_constitution:0 "Constitution de Lyttleton"
 NGA_1950_lyttleton_constitution_desc:0 "La Constitution de Lyttleton sera la dernière manière de faire face à l'évolution des revendications coloniales au Nigeria et permettra la création d'une colonie fédérale."
 NGA_1950_connect_the_north_and_the_south:0 "Relier le Nord et le Sud"
 NGA_1950_connect_the_north_and_the_south_desc:0 "Nous devons établir un réseau reliant le nord et le sud du Nigeria, créant ainsi une plus grande coopération mutuelle"
 NGA_1950_create_regional_representation:0 "Créer une représentation régionale"
 NGA_1950_create_regional_representation_desc:0 "Assurer une représentation régionale dans toute la colonie fait écho au sentiment de privation de droits qui est courant parmi les expatriés ethniques."
 NGA_1950_treat_northern_drought:0 "Traiter la sécheresse dans le Nord"
 NGA_1950_treat_northern_drought_desc:0  "Nous devons faire face à une sécheresse à grande échelle dans les régions du nord en raison de la surexploitation agricole"
 NGA_1950_africanize_the_frontier_forces:0 "Africaniser les forces frontalières"
 NGA_1950_africanize_the_frontier_forces_desc:0 "Nous devons élaborer une politique d'abord autochtone pour l'armée coloniale locale"
 NGA_1950_robertson_constitution:0 "Constitution de Robertson"
 NGA_1950_robertson_constitution_desc:0 "Le régime du gouverneur Robertson établira une nouvelle constitution plus centralisée qui profitera à l'Empire britannique dans les dernières années de cette colonie"
 NGA_1950_centralize_rubber_plantations:0 "Centraliser les plantations d'hévéas"
 NGA_1950_centralize_rubber_plantations_desc:0 "Il existe de nombreuses plantations d'hévéas dans les parties sud de la colonie qui sont actuellement dispersées et non organisées, ce qui conduit à l'inefficacité. La centralisation de ces secteurs entraînerait une marge de profit bien plus importante pour le régime colonial."
 NGA_1950_centralize_cotton_plantations:0 "Centraliser les plantations de coton"
 NGA_1950_centralize_cotton_plantations_desc:0 "Il existe de nombreuses plantations de coton dans les parties nord de la colonie qui sont actuellement dispersées et non organisées, ce qui conduit à l'inefficacité. La centralisation de ces secteurs entraînerait une marge de profit bien plus importante pour le régime colonial."
 NGA_1950_colonial_nationalization_of_the_south:0 "Nationalisation coloniale du Sud"
 NGA_1950_colonial_nationalization_of_the_south_desc:0 "L'administration coloniale nigériane estime qu'elle peut gérer plus efficacement ses ressources du sud, comme le caoutchouc et le fer, sans gestion directe de la couronne."
 NGA_1950_integrate_colonial_guard:0 "Intégrer la Garde Coloniale"
 NGA_1950_integrate_colonial_guard_desc:0 "Il serait beaucoup plus productif pour l'avancement d'une armée autochtone si le gouvernement colonial du Nigeria intégrait les locaux dans le rôle de majors et d'officiers."
 NGA_1950_move_capital_to_kaduna:0 "Déplacer la capitale à Kano"
 NGA_1950_move_capital_to_kaduna_desc:0 "Le Nord étant l'endroit où se concentre l'essentiel de l'administration coloniale, il serait logique que nous y déplacions le centre de notre gouvernance coloniale."
 NGA_1950_Shell-BP_expeditions:0 "Expéditions Shell-BP"
 NGA_1950_Shell-BP_expeditions_desc:0 "Cette année, British Petroleum et la Royal Dutch Shell Company prévoient de commencer à étudier les nombreuses ressources de la colonie nigériane"
 NGA_1950_colonial_nationalization_of_the_north:0 "Nationalisation coloniale du Nord"
 NGA_1950_colonial_nationalization_of_the_north_desc:0 "L'administration coloniale nigériane estime pouvoir gérer plus efficacement ses ressources du nord, comme le coton et les arachides, sans gestion directe de la couronne."
 NGA_1950_expand_coal_mining_in_the_niger_river_valley:0 "Développer l'exploitation minière du charbon dans la vallée du fleuve Niger"
 NGA_1950_expand_coal_mining_in_the_niger_river_valley_desc:0 "Les richesses de la vallée du fleuve Niger peuvent facilement être développées grâce à leur exploitation."
 NGA_1950_expand_mineral_extraction:0 "Développer l'extraction minérale"
 NGA_1950_expand_mineral_extraction_desc:0 "L'extraction minière, principalement dans le Nord et le Sud-Est, est quelque peu rentable, mais leur exploitation pourrait facilement être étendue dans le cadre de ses opérations."
 NGA_1950_expand_steel_mining_in_Enugu:0 "Développer l'exploitation minière de l'acier à Enugu"
 NGA_1950_expand_steel_mining_in_Enugu_desc:0 "La zone entourant la ville d'Enugu regorge de gisements de fer qui, avec un peu de transformation, pourraient facilement être transformés en précieux matériaux de construction."
 NGA_1950_expand_tin_mining_in_jos:0 "Développer l'exploitation minière de l'étain à Jos"
 NGA_1950_expand_tin_mining_in_jos_desc:0 "La quantité modérée de réserves d'étain stockées autour de la ville de Jos serait utile en termes de commerce et d'emploi de la population locale si elle était bien exploitée."
 NGA_1950_small_scale_kerosene_production:0 "Production de kérosène à petite échelle"
 NGA_1950_small_scale_kerosene_production_desc:0 "Bien que d'importants gisements de pétrole n'aient pas encore été découverts, le gouvernement colonial dispose de l'infrastructure nécessaire dans la région pour commencer la production à petite échelle de kérosène destiné au chauffage et à la cuisine."
 NGA_1950_expand_coal_mining_in_enugu:0 "Développer l'exploitation minière du charbon à Enugu"
 NGA_1950_expand_coal_mining_in_enugu_desc:0 "L'exploitation du charbon à Enugu et dans ses environs est depuis longtemps une source d'emploi pour la région. Développer cela entraînera la stabilité et contribuera au développement de la communauté."
 NGA_1950_founding_of_shell_bp_PDCNL:0 "Création du PDCNL de Shell-BP"
 NGA_1950_founding_of_shell_bp_PDCNL_desc:0 "Compte tenu des possibilités d'extraction pétrolière dans l'avenir du Nigeria, Shell-BP envisage de créer une nouvelle succursale en propriété commune connue sous le nom de Petroleum Department of Colonial Nigeria Limited."
 NGA_1950_1956_petroleum_discovery:0 "1956 Découverte pétrolière"
 NGA_1950_1956_petroleum_discovery_desc:0 "Des études approfondies à travers la colonie se sont finalement révélées fructueuses dans la mesure où d'importants gisements de pétrole brut ont été découverts dans le sud-est du pays."
 NGA_1950_begin_extraction_in_port_harcourt:0 "Commencer l'extraction à Port Harcourt"
 NGA_1950_begin_extraction_in_port_harcourt_desc:0 "PDCNL envisage de commencer une importante extraction pétrolière à Port Harcourt"
 NGA_1950_begin_extraction_in_benin_city:0 "Commencer l'extraction dans l'État du Delta"
 NGA_1950_begin_extraction_in_benin_city_desc:0 "PDCNL envisage de lancer une importante extraction pétrolière dans l'État du Delta"
 NGA_1950_begin_extraction_in_aba:0 "Commencer l'extraction à Aba"
 NGA_1950_begin_extraction_in_aba_desc:0 "PDCNL envisage de lancer une importante extraction pétrolière à Aba"
 NGA_1950_establish_bitumen_processing:0 "Établir le traitement du bitume"
 NGA_1950_establish_bitumen_processing_desc:0 "Le bitume, sous-produit de la production de diesel et d'essence, a de nombreuses utilisations, notamment dans la production d'asphalte. Si les infrastructures locales nigérianes ne sont pas très demandeuses d'un tel matériau, son exportation pourrait être bénéfique à la colonie."
 NGA_1950_begin_exporting_petroleum_products:0 "Commencer à exporter des produits pétroliers"
 NGA_1950_begin_exporting_petroleum_products_desc:0 "Divers produits pétroliers tels que les lubrifiants peuvent être utiles pour stimuler une nouvelle série d'exportations dans la colonie nigériane."
 NGA_1950_expand_nigerian_domestic_exports:0 "Développer les exportations intérieures nigérianes"
 NGA_1950_expand_nigerian_domestic_exports_desc:0 "Dans le passé, la colonie et le protectorat du Nigeria ont eu peu d'exportations indépendantes en dehors des expéditions vers le Royaume-Uni ou les colonies pour une transformation ultérieure. Si la colonie pouvait se concentrer sur la récolte et la transformation de ses principales cultures et minéraux, elle pourrait être beaucoup plus efficace et préparer la nation à une économie indépendante."
 NGA_1950_build_a_peanut_plant:0 "Construire une usine d'arachide"
 NGA_1950_build_a_peanut_plant_desc:0 "Les arachides sont cultivées dans le nord du Nigeria depuis des décennies et se sont révélées être une utilisation très appropriée des terres arables du fleuve Niger."
 NGA_1950_expand_cotton_farming_in_the_north:0 "Développer la culture du coton dans le Nord"
 NGA_1950_expand_cotton_farming_in_the_north_desc:0 "La culture du coton dans les régions du nord du Nigeria, même si elle n'est pas aussi étendue que dans d'autres parties de l'Empire britannique, a néanmoins le potentiel d'être très rentable si nous développons cette pratique."
 NGA_1950_expand_peanut_farming_in_the_north:0 "Développer la culture de l'arachide dans le Nord"
 NGA_1950_expand_peanut_farming_in_the_north_desc:0 "Les arachides sont cultivées dans le nord du Nigeria depuis des décennies et se sont révélées être une utilisation très appropriée des terres arables du fleuve Niger."
 NGA_1950_reinvigorate_northern_tin_mining:0 "Redynamiser l'exploitation minière de l'étain dans le Nord"
 NGA_1950_reinvigorate_northern_tin_mining_desc:0 "L'extraction modérée d'étain dans le nord du Nigeria a toujours été une pratique importante pendant des milliers d'années, mais elle constitue aujourd'hui une bonne source de revenus et de développement local."
 NGA_1950_dawn_of_nigerian_industry:0 "L'aube de l'industrie nigériane"
 NGA_1950_dawn_of_nigerian_industry_desc:0 "C'est au cours de cette décennie que nous voyons les premières bases de ce qui sera un jour un système industriel nigérian prospère"
 NGA_1950_build_a_cocoa_plant_in_Ibadan:0 "Construire une usine de cacao à Ibadan"
 NGA_1950_build_a_cocoa_plant_in_Ibadan_desc:0 "Le cacao, la noix utilisée pour fabriquer le chocolat, est actuellement cultivé en petites quantités au Nigeria comme culture de rente. Si l'on devait développer ce secteur de l'agriculture, cela pourrait conduire à des bénéfices beaucoup plus importants."
 NGA_1950_build_a_palm_oil_plant_in_benin_city:0 "Construire une usine d'huile de palme à Benin City"
 NGA_1950_build_a_palm_oil_plant_in_benin_city_desc:0 "L'huile de palme est sans doute la culture de rente la plus rentable actuellement cultivée au Nigeria. Devenant de plus en plus populaire dans les produits de cuisine, ce matériau précieux pourrait être cultivé en grande quantité si nous devions défricher davantage de forêts et de broussailles"
 NGA_1950_build_a_palm_oil_plant_in_aba:0 "Construire une usine d'huile de palme à Aba"
 NGA_1950_build_a_palm_oil_plant_in_aba_desc:0 "L'huile de palme est sans doute la culture de rente la plus rentable actuellement cultivée au Nigeria. Devenant de plus en plus populaire dans les produits de cuisine, ce matériau précieux pourrait être cultivé en grande quantité si nous devions défricher davantage de forêts et de broussailles"
 NGA_1950_build_a_cocoa_plant_in_akure:0 "Construire une usine de cacao à Akure"
 NGA_1950_build_a_cocoa_plant_in_akure_desc:0 "Le cacao, la noix utilisée pour fabriquer le chocolat, est actuellement cultivé en petites quantités au Nigeria comme culture de rente. Si l'on devait développer ce secteur de l'agriculture, cela pourrait conduire à des bénéfices beaucoup plus importants."
 NGA_1950_expand_rubber_production_in_biafra:0 "Développer la production de caoutchouc au Biafra"
 NGA_1950_expand_rubber_production_in_biafra_desc:0 "Les hévéas sont cultivés depuis longtemps dans le sud du Nigeria, et leur expansion serait très rentable."
 NGA_1950_road_to_independence:0 "La route vers l'indépendance"
 NGA_1950_road_to_independence_desc:0 "Après la guerre mondiale, la situation du colonialisme a clairement changé. Dans un avenir proche, il est tout à fait possible pour un Nigeria indépendant de se diriger avec audace vers l'avant."
 NGA_1950_initiate_religious_autonomy:0 "Initier l'autonomie religieuse"
 NGA_1950_initiate_religious_autonomy_desc:0 "Les différences religieuses entre le sud chrétien et le nord musulman ont toujours été un problème dans la colonie. En accordant une autonomie religieuse au système juridique de la colonie, nous pouvons assurer la stabilité."
 NGA_1950_africanize_the_bureaucracy:0 "Africaniser la bureaucratie"
 NGA_1950_africanize_the_bureaucracy_desc:0 "En promouvant les peuples autochtones dans la bureaucratie coloniale, nous pouvons préparer de plus en plus la nation vers l'indépendance."
 NGA_1950_africanize_the_armed_forces:0 "Africaniser les forces armées"
 NGA_1950_africanize_the_armed_forces_desc:0 "Actuellement, il n'y a que quelques officiers africains de haut rang dans notre armée coloniale. En élargissant l'accès à l'éducation militaire, nous pourrions augmenter le pourcentage de Nigérians occupant des postes élevés dans l'armée."
 NGA_1950_africanize_general_assembly:0 "Assemblée générale d'Africaniser"
 NGA_1950_africanize_general_assembly_desc:0 "Permettre à la majorité africaine d'accéder ouvertement à l'assemblée générale entraînera sûrement le remplacement des partis politiques à l'agenda britannique/colonial dans le système."
 NGA_1950_segregate_state_institutions:0 "Séparer les institutions publiques"
 NGA_1950_segregate_state_institutions_desc:0 "En séparant les habitants du Nord avec les Yorubans et principalement les Igbos, nous garantirons que les tensions ethniques deviendront plus contrôlables."
 NGA_1950_fight_the_rebellions:0 "Combattez les rébellions"
 NGA_1950_fight_the_rebellions_desc:0 "Le Nigeria est confronté à des rébellions généralisées et à un conflit ethnique régional en raison des tensions ethniques dans la colonie et de l'incapacité des gouverneurs à y remédier."
 NGA_1950_a_unitary_nigeria:0 "Un Nigéria unitaire"
 NGA_1950_a_unitary_nigeria_desc:0 "Plutôt que les systèmes fédéraux auparavant plus populaires proposés pour le Nigeria, grâce à notre domination militaire, nous pouvons garantir un État unitaire directement gouverné."
 NGA_1950_centralize_the_north:0 "Centraliser le Nord"
 NGA_1950_centralize_the_north_desc:0 "La centralisation des diverses institutions et bureaucraties des régions du nord du Nigeria est clairement la prochaine étape vers l'établissement d'un État unitaire directement gouverné."
 NGA_1950_blend_sharia_law_and_colonial_law:0 "Mélanger la charia et le droit colonial"
 NGA_1950_blend_sharia_law_and_colonial_law_desc:0 "Étant donné que le Nord, plus autoritaire, est le meilleur groupe à privilégier pour créer l'unité nationale, nous favoriserons également ses coutumes religieuses et culturelles."
 NGA_1950_create_a_unitary_civil_service_program:0 "Créer un programme de fonction publique unitaire"
 NGA_1950_create_a_unitary_civil_service_program_desc:0 "L'ancien système de fonction publique décentralisée, caractérisé par le tribalisme et le compartimentage ethnique, est clairement moins efficace. Nous devrions plutôt tenter d'établir un système de fonction publique unitaire et hétérogène."
 NGA_1950_the_kano_accords:0 "Les accords de Kano"
 NGA_1950_the_kano_accords_desc:0 "Après la fin complète de toutes les rébellions régionales, nous pourrons tenter de trouver une solution à long terme aux conflits ethniques du Nigeria."
 NGA_1950_binational_state:0 "État binational"
 NGA_1950_binational_state_desc:0 "Nous devrions essayer de créer un État binational entre un Nigeria chrétien du Sud et un Nigeria musulman du Nord"
 NGA_1950_partition_nigeria:0 "Partitionner le Nigéria"
 NGA_1950_partition_nigeria_desc:0 "Ici, à la fin de l'ère du colonialisme, il est logique que la seule manière raisonnable de résoudre les conflits ethniques au Nigeria soit la partition complète de la nation."
 NGA_1950_nsobu_adighi:0 "Nsobu Adighi"
 NGA_1950_nsobu_adighi_desc:0 "Pour l'avenir du peuple nigérian, nous pouvons enfin nous concentrer sur le développement et la modernisation du pays, ses nombreux conflits ethniques antérieurs étant désormais résolus."
 NGA_1950_northern_peoples_congress:0 "Congrès populaire du Nord"
 NGA_1950_northern_peoples_congress_desc:0 "Le Congrès populaire du Nord est un parti favorable aux Haoussa, basé sur des lignes musulmanes conservatrices et qui soutient diverses politiques typiques du nationalisme de gauche"
 NGA_1950_emphasize_hausa_culture:0 "Mettre l'accent sur la culture haoussa"
 NGA_1950_emphasize_hausa_culture_desc:0 "Il n'est que raisonnable de mettre l'accent sur la culture du peuple haoussa, travailleur et intelligent. Les artisans, les ouvriers et la noblesse islamique régionale partagent tous ce magnifique héritage couchitique."
 NGA_1950_subsidize_large_families:0 "Subventionner les familles nombreuses"
 NGA_1950_subsidize_large_families_desc:0 "Les familles nombreuses sont un élément essentiel de la communauté haoussa et devraient sûrement être soutenues."
 NGA_1950_bring_water_to_sokoto:0 "Apporter de l'eau à Sokoto"
 NGA_1950_bring_water_to_sokoto_desc:0 "Sokoto, au Sahel, est régulièrement confrontée à des sécheresses et sa population souffre souvent de maladies d'origine hydrique. Amener la plomberie et l'eau potable dans cette région devrait être une priorité majeure."
 NGA_1950_divert_resources_to_kano:0 "Détourner les ressources vers Kano"
 NGA_1950_divert_resources_to_kano_desc:0 "Kano est une ville du nord fantastique à utiliser pour la transformation des matières premières. Il serait très pratique de détourner davantage de matières premières vers cette ville."
 NGA_1950_localize_tin_processing:0 "Localiser le traitement de l'étain"
 NGA_1950_localize_tin_processing_desc:0 "Si nous devions traiter l'étain brut dans les régions du nord où il est extrait, ce serait à la fois plus efficace et meilleur pour les communautés"
 NGA_1950_Nigerian_Democratic_Party:0 "Parti Démocratique Nigérian"
 NGA_1950_Nigerian_Democratic_Party_desc:0 "Le Parti démocratique nigérian est le plus ancien parti politique moderne du Nigeria. Alors qu'il était à un moment donné le parti leader dans les années 30, sa pertinence a considérablement diminué. Axé sur les intérêts commerciaux et encourageant l'implication politique du Nigérian moyen, ce parti serait favorisé par la petite minorité d'hommes d'affaires nigérians autodidactes, principalement d'origine yoruba et igbo."
 NGA_1950_expand_the_lagos_grid:0 "Développez la grille de Lagos"
 NGA_1950_expand_the_lagos_grid_desc:0 "La capitale, Lagos, est presque totalement dépourvue de tout ce qui ressemble à un réseau électrique moderne. Si nous voulons changer cela, cela nécessiterait une allocation importante de ressources."
 NGA_1950_bring_foreign_investment:0 "Apporter des investissements étrangers"
 NGA_1950_bring_foreign_investment_desc:0 "Le parti estime que grâce à divers accords et incitations, nous pouvons augmenter le montant des investissements étrangers au cours des cinq prochaines années."
 NGA_1950_encourage_local_entrepreneurship:0 "Encourager l'entrepreneuriat local"
 NGA_1950_encourage_local_entrepreneurship_desc:0 "Dans la culture Igbo, la richesse héritée est méprisée et les dirigeants locaux sont censés s'établir au cours de leur propre vie. Cette croyance au 20ème siècle a donné naissance à un grand nombre d'hommes d'affaires prospères d'origine igbo, prenant cette croyance et la développant, nous pouvons à notre tour encourager davantage l'entrepreneuriat autochtone"
 NGA_1950_encourage_businesses_in_lagos:0 "Encourager les affaires à Lagos"
 NGA_1950_encourage_businesses_in_lagos_desc:0 "Grâce à des changements dans les lois de zonage et fiscales, nous pouvons encourager les entreprises locales et étrangères dans la ville de Lagos"
 NGA_1950_advocate_for_intercolonial_trade:0 "Défenseur du commerce intercolonial"
 NGA_1950_advocate_for_intercolonial_trade_desc:0 "Si nos délégations font valoir leurs arguments lors de leur prochaine réunion avec les représentants de l'empire sur le continent, nous pourrons peut-être les convaincre d'encourager le commerce intercolonial dans les possessions britanniques d'Afrique de l'Ouest."
 NGA_1950_national_council_for_nigeria_and_the_cameroons:0 "Conseil national du Nigeria et du Cameroun"
 NGA_1950_national_council_for_nigeria_and_the_cameroons_desc:0 "Le Conseil national du Nigeria et du Cameroun est un parti politique à prédominance igbo dirigé par le Dr Nnamdi Azikiwe, qui prône l'unité nationale et un mouvement indépendantiste organisé."
 NGA_1950_oppose_right_to_succession:0 "S'opposer au droit de réussir"
 NGA_1950_oppose_right_to_succession_desc:0 "En raison de la nature conflictuelle des régions du Nigeria et de leurs divisions politiques reposant sur des clivages ethniques, il y a eu un grand appel pour que le droit à la réussite soit confié à chaque État fédéral. Étonnamment, le Conseil national du Nigéria et du Cameroun (NCNC), majoritairement igbo, s'est prononcé contre cette proposition, affirmant que cela pourrait facilement détruire tout nouvel État nigérian."
 NGA_1950_expand_eastern_iron_forges:0 "Agrandissez les forges de fer de l'Est"
 NGA_1950_expand_eastern_iron_forges_desc:0 "Les forges de fer de l'Est sont actuellement de petite envergure locale, si l'on mettait en place un meilleur équipement pour que ces forges puissent être exploitées à l'échelle industrielle."
 NGA_1950_emphasize_igbo_culture:0 "Mettre l'accent sur la culture Igbo"
 NGA_1950_emphasize_igbo_culture_desc:0 "Dans un Nigeria prospère, la grande culture entrepreneuriale des Igbos serait grandement appréciée dans tout le pays."
 NGA_1950_create_vocational_schools_in_benin_city:0 "Créer des écoles professionnelles à Benin City"
 NGA_1950_create_vocational_schools_in_benin_city_desc:0 "Pour augmenter l'emploi urbain, nous pouvons créer des écoles professionnelles à Benin City, créant davantage de personnes certifiées dans les compétences professionnelles."
 NGA_1950_embrace_social_freedom:0 "Adoptez la liberté sociale"
 NGA_1950_embrace_social_freedom_desc:0 "Grâce à des programmes de sensibilisation culturelle, des brochures et d'autres moyens de sensibilisation du public, nous pouvons encourager la population du sud du Nigeria à être plus ouverte aux libertés personnelles impliquant leur propre culture."
 NGA_1950_develop_port_harcourt_plumbing:0 "Développer la plomberie de Port Harcourt"
 NGA_1950_develop_port_harcourt_plumbing_desc:0 "La plomberie de Port Harcourt est si primitive qu'elle ne sert à rien pour la population générale de la ville. Si nous devions la développer davantage, cela réduirait considérablement les maladies et les déchets."
 NGA_1950_support_trade_unions:0 "Soutenir les syndicats"
 NGA_1950_support_trade_unions_desc:0 "Au sein de toute classe ouvrière urbaine, les syndicats seront essentiels à la préservation des droits des travailleurs et des libertés civiles. Si nous souhaitons un Nigéria prospère où le travailleur moyen peut subvenir aux besoins de sa propre famille et réussir par lui-même, le NCNC doit être capable de plaider en faveur d'une large syndicalisation."
 NGA_1950_Action_Group:0 "Groupe d'action"
 NGA_1950_Action_Group_desc:0 "Le Groupe d'action à dominante yoruba est un parti dirigé par l'homme d'affaires autodidacte Obafemi Awolowo qui épouse les principes largement sociaux-démocrates et l'unité nationale avant l'indépendance."
 NGA_1950_encourage_debate_in_parliament:0 "Encourager le débat au Parlement"
 NGA_1950_encourage_debate_in_parliament_desc:0 "L'une des principales tactiques du Groupe d'action est d'encourager des discussions actives et prolongées au parlement ou à l'assemblée nationale. Ici, ils estiment que leurs arguments sont décisifs et peuvent changer radicalement l'avis des représentants et des membres des autres partis."
 NGA_1950_move_away_from_britain:0 "S'éloigner de la Grande-Bretagne"
 NGA_1950_move_away_from_britain_desc:0 "Si le Nigeria souhaite être véritablement indépendant, il est impératif que nous éloignions encore davantage nos allégeances du Royaume-Uni."
 NGA_1950_emphasize_yoruba_culture:0 "Mettre l'accent sur la culture yoruba"
 NGA_1950_emphasize_yoruba_culture_desc:0 "Si nous souhaitons avoir un Nigéria riche sur le plan musical et artistique, il suffit de mettre l'accent sur les grandes pratiques culturelles et la vision du monde du peuple Yoruba."
 NGA_1950_divert_funding_to_lagos:0 "Détourner les fonds vers Lagos"
 NGA_1950_divert_funding_to_lagos_desc:0 "Lagos, étant la capitale du pays et son plus grand port de commerce, il est tout à fait logique de consacrer davantage de fonds à cette ville plutôt qu'au nord ou au sud-est."
 NGA_1950_western_public_schooling:0 "École publique occidentale"
 NGA_1950_western_public_schooling_desc:0 "L'école publique dans l'ouest du pays sera une priorité majeure pour le Groupe d'action et continuera de l'être jusqu'à ce que l'éducation dans cette région soit considérablement développée. D'ici là, les électeurs du parti seront insatisfaits"
 NGA_1950_encourage_formal_parties:0 "Encouragez les fêtes formelles"
 NGA_1950_encourage_formal_parties_desc:0 "Les principaux membres du Groupe d'action estiment que nous devons encourager les partis politiques formels plutôt que ces factions ethniques à l'Assemblée nationale."
 NGA_1950_Nigerian_Youth_Movement:0 "Mouvement de la jeunesse nigériane"
 NGA_1950_Nigerian_Youth_Movement_desc:0 "Le Mouvement de la jeunesse nigériane est une organisation politique plus ancienne fondée dans les années 1940 en opposition au Parti démocratique nigérian. Son effectif est en déclin car bon nombre de ses anciens dirigeants sont partis créer leurs propres partis, principalement sur des critères ethniques. Le parti plaide pour la justice sociale et la réforme juridique, ainsi qu'une plus grande représentation du peuple autochtone nigérian contre l'élite coloniale minoritaire."
 NGA_1950_new_zoning_law_in_lagos:0 "Nouvelles lois de zonage à Lagos"
 NGA_1950_new_zoning_law_in_lagos_desc:0 "La modification des lois de zonage à Lagos encouragera grandement les investissements étrangers et entraînera une expansion urbaine dans les principales parties de la ville."
 NGA_1950_clear_out_eastern_rainforests:0 "Débarrassez-vous des forêts tropicales de l'Est"
 NGA_1950_clear_out_eastern_rainforests_desc:0 "En défrichant les forêts tropicales du sud-est du Nigeria, on créera davantage de terres arables pour les plantations d'hévéas ou de cacao."
 NGA_1950_establish_benin_city_electric_grid:0 "Établir le réseau électrique de Benin City"
 NGA_1950_establish_benin_city_electric_grid_desc:0 "Actuellement, Benin City n'a rien qui ressemble à un réseau électrique majeur, la plupart de l'éclairage étant assuré par des lampes à kérosène. Cela doit changer si nous souhaitons inscrire la ville dans le monde moderne"
 NGA_1950_clear_out_western_rainforests:0 "Débarrassez-vous des forêts tropicales de l'Ouest"
 NGA_1950_clear_out_western_rainforests_desc:0 "En défrichant les forêts tropicales de l'ouest du Nigeria, on créera davantage de terres arables pour les plantations d'hévéas ou de cacao."
 NGA_1950_the_royal_west_african_frontier_forces:0 "Les Forces royales des frontières de l'Afrique de l'Ouest"
 NGA_1950_the_royal_west_african_frontier_forces_desc:0 "Les Royal West African Frontier Forces sont une branche des armées coloniales du Royaume-Uni. Les branches nigériane et ghanéenne sont les plus importantes, mais c'est au Nigeria que se trouvent presque toutes les forces. Il n'y a que quelques officiers africains notables dans l'institution, uniquement au Nigeria."
 NGA_1950_critique_the_army:0 "Critiquer l'armée"
 NGA_1950_critique_the_army_desc:0 "L'armée du RWAFF est actuellement sous-entraînée et sous-équipée. Si nous voulons avoir une base sur laquelle nous fonder plus tard une force armée nigériane, nous devrons travailler sur notre armée dès maintenant."
 NGA_1950_import_british_surplus:0 "Importer le surplus britannique"
 NGA_1950_import_british_surplus_desc:0 "Une solution proposée pour faire face aux graves pénuries de notre armée à l'heure actuelle consiste à importer des équipements britanniques excédentaires obsolètes de la dernière guerre."
 NGA_1950_improve_reward_system:0 "Améliorer le système de récompense"
 NGA_1950_improve_reward_system_desc:0 "Le système actuel de remise de rubans et de trophées est très lacunaire et inintéressant et le simple soldat ne sait pas de quoi il peut être récompensé. En créant des cérémonies de remise de prix et en établissant davantage d'ordres, de rubans et de médailles, nous encouragerons davantage les soldats à accomplir divers actes au cours de leur carrière militaire."
 NGA_1950_import_british_machinging_parts:0 "Importer des pièces d'usinage britanniques"
 NGA_1950_import_british_machinging_parts_desc:0 "La production domestique de la plupart des pièces de fusil ici au Nigeria n'est actuellement pas possible car nous ne disposons pas des outils appropriés pour usiner ces pièces métalliques du fusil, telles que la carcasse. Si nous devions obtenir des moules pour ces kits d'usinage du Royaume-Uni, nous pourrions commencer ce processus ici, dans le pays."
 NGA_1950_adopt_british_doctrines:0 "Adopter les doctrines britanniques"
 NGA_1950_adopt_british_doctrines_desc:0 "Ce serait un moyen simple d'améliorer considérablement la capacité de nos armées si nous analysions et imitions les doctrines militaires du Royaume-Uni que nos propres officiers pourraient appliquer à l'avenir."
 NGA_1950_reestablish_artillery_brigade:0 "Rétablir les brigades d'artillerie"
 NGA_1950_reestablish_artillery_brigade_desc:0 "Les brigades d'artillerie du Nigeria ont été en grande partie dissoutes après la dernière guerre mondiale. Si nous voulons créer les bases d'une nouvelle armée, nous allons rétablir cet élément de notre armée."
 NGA_1950_rehabilitate_old_artillery_equipment:0 "Réhabiliter le vieux matériel d'artillerie"
 NGA_1950_rehabilitate_old_artillery_equipment_desc:0 "Les dépôts militaires nigérians sont remplis de pièces d'artillerie hors service, cassées ou non entretenues. Une façon peu coûteuse de faire décoller ces nouvelles brigades d'artillerie consiste à réhabiliter nos anciens équipements."
 NGA_1950_import_artillery_from_french_west_africa:0 "Importer de l'artillerie de l'Afrique occidentale française"
 NGA_1950_import_artillery_from_french_west_africa_desc:0 "L'importation d'artillerie excédentaire de l'Afrique occidentale française est une idée proposée par les officiers coloniaux de haut rang, mais elle nécessitera une certaine organisation avec nos délégations."
 NGA_1950_address_direct_fire_gun_shortage:0 "Remédier à la pénurie d'armes à feu direct"
 NGA_1950_address_direct_fire_gun_shortage_desc:0 "Actuellement nos dépôts disposent de moins de quelques dizaines de canons à tir direct, indispensables à nos brigades d'artillerie. Nous devrons importer des surplus périmés du Royaume-Uni."
 NGA_1950_rehabilitate_auto_cannons:0 "Réhabiliter les canons automatiques"
 NGA_1950_rehabilitate_auto_cannons_desc:0 "La réhabilitation des vieux canons automatiques dans nos dépôts sera un moyen facile de nous préparer à une future armée dotée de capacités anti-aériennes."
 NGA_1950_a_frontier_air_force:0 "Marine marchande frontalière"
 NGA_1950_a_frontier_air_force_desc:0 "Bien que notre nation n'ait rien qui ressemble à une marine opérationnelle en dehors de quelques navires de transport obsolètes, cela peut être changé grâce à des ajustements organisationnels du système et à une certaine coopération britannique."
 NGA_1950_expand_training_programs:0 "Élargir les programmes de formation"
 NGA_1950_expand_training_programs_desc:0 "Si nous souhaitons avoir un programme opérationnel de force aérienne, nous devrons commencer à organiser des divisions formant des recrues pour devenir des pilotes de combat."
 NGA_1950_adapt_older_airplane_designs:0 "Adopter les doctrines navales britanniques"
 NGA_1950_adapt_older_airplane_designs_desc:0 "Naturellement, comme le font de nombreuses autres colonies, nous adopterons les doctrines militaires de notre suzerain colonial comme base d'une future marine indépendante."
 NGA_1950_rehabilitate_coastal_defenses:0 "Réhabiliter les défenses côtières"
 NGA_1950_rehabilitate_coastal_defenses_desc:0 "Pour travailler main dans la main avec les capacités de nos forces aériennes à protéger notre nation de toute guerre future, nous aurons besoin de défenses côtières pour aider à minimiser les dommages possibles infligés à nos ports de commerce côtiers."
 NGA_1950_build_an_air_base_in_lagos:0 "Construire une base navale à Lagos"
 NGA_1950_build_an_air_base_in_lagos_desc:0 "Le plus grand port, centre commercial et capitale du Nigéria serait le centre le plus logique pour construire notre première base navale militaire."