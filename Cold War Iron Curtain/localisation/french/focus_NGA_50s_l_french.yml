#ideas
 NGA_north_south_tension_low:0 "Faible tension Nord-Sud"
 NGA_north_south_tension_low_desc:0 "Depuis la fusion de la colonie du nord du Nigéria et des colonies du sud-est et de l'ouest, de profondes tensions ethniques et religieuses ont régné au Nigéria. Alors que les musulmans du Nord sont historiquement favorisés par les Britanniques en raison de leur attitude autoritaire et loyale, les peuples du Sud se sentent grandement privés de leurs droits. Si cette tension n'est pas soigneusement gérée par l'administration coloniale, nous pourrions nous retrouver confrontés à une guerre civile ethnique généralisée."
