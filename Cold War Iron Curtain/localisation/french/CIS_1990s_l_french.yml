 # Ideas
 CIS_budapest_memorandum_guarantee: "Garanties de sécurité du Mémorandum de Budapest"
 CIS_budapest_memorandum_guarantee_desc: "Dans le cadre du Mémorandum de Budapest de 1994, les États-Unis, le Royaume-Uni et la Fédération de Russie se sont engagés à respecter l'indépendance, la souveraineté et les frontières existantes de l'Ukraine, du Kazakhstan et de la Biélorussie en échange de leur adhésion au Traité de non-prolifération nucléaire (TNP) en tant qu'États non dotés d'armes nucléaires."

 RUS_BLR_union_state: "État de l'Union de la Russie et de la Biélorussie"
 RUS_BLR_union_state_desc: "Établies par le Traité de 1999 sur la création d'un État fédéré, la Russie et la Biélorussie partagent une profonde intégration supranationale englobant une défense unifiée, une harmonisation douanière et une coordination économique mutuelle."

 UKR_black_sea_fleet_accord: "Traité de partage de la flotte de la mer Noire"
 UKR_black_sea_fleet_accord_desc: "Signé en mai 1997, cet accord bilatéral divisait à l'amiable l'ancienne flotte soviétique de la mer Noire entre l'Ukraine et la Russie, garantissant le paiement des loyers russes pour les installations navales de Sébastopol et officialisant la reconnaissance russe de la souveraineté ukrainienne."

 RUS_sevastopol_naval_lease: "Bail de la base navale de Sébastopol"
 RUS_sevastopol_naval_lease_desc: "En vertu du Traité de partition de 1997, la marine russe loue des postes d'amarrage en eau profonde, des chantiers navals de réparation et des infrastructures d'aérodromes militaires à Sébastopol et en Crimée, garantissant ainsi une présence opérationnelle russe continue en mer Noire."

 # Events
 CIS_90.1.t: "[GetNewspaperHeader]Le Protocole de Lisbonne : dénucléariser les républiques post-soviétiques"
 CIS_90.1.d: "À Lisbonne, les représentants des États-Unis, de la Russie, de l'Ukraine, de la Biélorussie et du Kazakhstan ont signé un protocole historique au traité START I. Après l'éclatement de l'Union soviétique, l'Ukraine, la Biélorussie et le Kazakhstan ont hérité de milliers de têtes nucléaires stratégiques sur leur sol, soulevant des inquiétudes urgentes en matière de prolifération mondiale.\n\nEn vertu du Protocole de Lisbonne, les trois républiques non russes successeurs s'engagent formellement à adhérer au Traité de non-prolifération nucléaire (TNP) en tant qu'États non dotés d'armes nucléaires et à transférer toutes les ogives nucléaires soviétiques héritées à la Fédération de Russie pour démantèlement."
 CIS_90.1.a: "Une étape essentielle vers la non-prolifération."

 CIS_90.2.t: "[GetNewspaperHeader]Le Mémorandum de Budapest : des garanties de sécurité signées"
 CIS_90.2.d: "Lors du sommet de la Conférence sur la sécurité et la coopération en Europe (CSCE) à Budapest, les dirigeants des États-Unis, du Royaume-Uni et de la Fédération de Russie ont signé les mémorandums historiques de Budapest sur les garanties de sécurité.\n\nEn échange de l'abandon par l'Ukraine, le Kazakhstan et la Biélorussie de leurs énormes arsenaux nucléaires, les puissances signataires s'engagent formellement à respecter l'indépendance, la souveraineté et les frontières territoriales existantes des trois nations, et à s'abstenir de la menace ou du recours à la force contre leur intégrité territoriale."
 CIS_90.2.a: "Des garanties de souveraineté en échange du désarmement."

 CIS_90.3.t: "L'élection présidentielle ukrainienne de 1994"
 CIS_90.3.d: "Dans un contexte d'hyperinflation écrasante, de dette énergétique croissante et de divisions régionales marquées entre l'ouest ukrainien et l'est industriel russophone, des élections présidentielles anticipées ont eu lieu dans toute l'Ukraine.\n\nL'ancien directeur d'une usine de fusées et Premier ministre Leonid Koutchma a fait campagne sur un programme de pragmatisme économique, de réforme administrative et de rétablissement des liens commerciaux vitaux avec la Fédération de Russie, contestant la posture plus nationaliste du président sortant Leonid Kravtchouk."
 CIS_90.3.a: "Leonid Koutchma remporte la présidence grâce au pragmatisme économique."
 CIS_90.3.b: "Leonid Kravchuk conserve la présidence."

 CIS_90.4.t: "[GetNewspaperHeader]Partition de la flotte de la mer Noire"
 CIS_90.4.d: "Après des années de tension diplomatique entre Moscou et Kiev, le Premier ministre russe Viktor Tchernomyrdine et le Premier ministre ukrainien Pavlo Lazarenko ont signé le Traité de partage sur le statut et les conditions de la flotte de la mer Noire.\n\nAux termes de cet accord, les moyens navals soviétiques stationnés en Crimée ont été divisés, la Russie acquérant environ les quatre cinquièmes des navires de combat. Surtout, l'Ukraine a accepté de louer des baies navales, des mouillages et des infrastructures portuaires à Sébastopol à la flotte russe de la mer Noire pour vingt ans, résolvant ainsi l'un des conflits les plus périlleux de l'ère post-soviétique."
 CIS_90.4.a: "Le statut de Sébastopol est assuré."

 CIS_90.5.t: "Le référendum national biélorusse de 1995"
 CIS_90.5.d: "Le président Alexandre Loukachenko a organisé un référendum national dans toute la Biélorussie sur des questions nationales fondamentales. Le scrutin demandait aux électeurs d'approuver l'octroi à la Russie d'un statut officiel égal à celui du Biélorusse, l'adoption de nouveaux symboles d'État calqués étroitement sur le drapeau et les armoiries de l'ère soviétique, le soutien à l'intégration économique avec la Russie et l'octroi au président du pouvoir de dissoudre le Parlement.\n\nL'électorat a voté massivement en faveur des propositions de Loukachenko, orientant fermement la Biélorussie vers l'intégration à Moscou."
 CIS_90.5.a: "Adopter de nouveaux symboles d'État et une intégration économique."
 CIS_90.5.b: "L'opposition parlementaire résiste aux changements."

 CIS_90.6.t: "[GetNewspaperHeader]Traité sur la création de l'État de l'Union"
 CIS_90.6.d: "Lors d'une cérémonie solennelle au Grand Palais du Kremlin à Moscou, le président russe Boris Eltsine et le président biélorusse Alexandre Loukachenko ont signé le Traité sur la création de l'État fédéré de la Russie et de la Biélorussie.\n\nLe traité jette les bases d'une confédération supranationale, unissant les deux nations slaves dans un espace économique commun, un cadre de politique étrangère coordonné et un réseau régional de défense aérienne unifié tout en préservant leur statut souverain formel."
 CIS_90.6.a: "La Russie et la Biélorussie restent unies."

 CIS_90.7.t: "[GetNewspaperHeader]Armistice en Transnistrie : la 14e armée intervient"
 CIS_90.7.d: "Après des mois de conflit armé intense entre les forces de sécurité du gouvernement moldave et les paramilitaires séparatistes dans la République moldave autoproclamée de la Pridnestrovié, les forces russes de la 14e Armée de la Garde dirigée par le général de division Alexandre Lebed sont intervenues avec de l'artillerie lourde pour mettre fin aux combats dans la ville de Bender.\n\nLe président moldave Mircea Snegur et le président russe Boris Eltsine ont signé un accord d'armistice à Moscou, établissant une zone de sécurité démilitarisée, une commission conjointe de contrôle tripartite et des détachements russes de maintien de la paix le long du Dniestr."
 CIS_90.7.a: "Les armes se taisent le long du Dniestr."

 CIS_90.8.t: "[GetNewspaperHeader]Le Protocole de Bichkek : cessez-le-feu au Haut-Karabakh"
 CIS_90.8.d: "À Bichkek, au Kirghizistan, les représentants des parlements d'Arménie, d'Azerbaïdjan et du Haut-Karabakh ont signé un accord de cessez-le-feu provisoire négocié par la Russie, mettant fin à plus de six années de guerre ouverte dans la première guerre du Haut-Karabakh.\n\nL'accord gèle la ligne de front, laissant les forces arméniennes et d'Artsakh sous le contrôle de l'ancien oblast autonome du Haut-Karabakh et des districts de sécurité adjacents. Alors que le conflit politique sous-jacent n'est toujours pas résolu, les armes se sont finalement tues."
 CIS_90.8.a: "Une paix fragile règne de part et d'autre de la ligne de contact."

 CIS_90.9.t: "[GetNewspaperHeader]L'accord de paix de Moscou : fin de la guerre civile au Tadjikistan"
 CIS_90.9.d: "Au Kremlin de Moscou, le président Emomali Rahmon du Tadjikistan et le chef de l'opposition tadjike unie (OTU), Said Abdullah Nuri, ont signé l'Accord général pour l'établissement de la paix et l'accord national au Tadjikistan, mettant fin à cinq années de guerre civile dévastatrice.\n\nNégocié par la Russie, l'Iran et les Nations Unies, l'accord de paix intègre trente pour cent des représentants de l'OTU au gouvernement central, accorde l'amnistie aux anciens combattants et établit une Commission de réconciliation nationale pour superviser le désarmement national et la stabilité constitutionnelle."
 CIS_90.9.a: "La réconciliation rétablit la stabilité à Douchanbé."

 CIS_90.10.t: "Transfert de la capitale nationale : Akmola"
 CIS_90.10.d: "Le président Noursoultan Nazarbaïev a officiellement transféré la capitale de l'État du Kazakhstan de la métropole méridionale d'Almaty à la ville d'Akmola, dans le centre-nord (qui devrait être rebaptisée Astana).\n\nCette relocalisation audacieuse éloigne le centre administratif du bassin sismique d'Almaty et le rapproche des régions industrielles du nord, ancrant ainsi le gouvernement central fermement au coeur géographique de la steppe eurasienne."
 CIS_90.10.a: "Désigner Akmola comme nouvelle capitale nationale."
 CIS_90.10.b: "Conserver Almaty comme capitale."
