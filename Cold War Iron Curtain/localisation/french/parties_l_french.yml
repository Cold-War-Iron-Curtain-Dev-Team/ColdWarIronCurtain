 FIN_Social_Democratic_party_desc: "Fondé en 1899 sous le nom de Parti travailliste finlandais (et qui prendra son nom actuel en 1903), le SDP est le parti le plus ancien de Finlande. En raison de la défaite électorale de 1917, de nombreux membres rejoignirent les Gardes rouges lors de la guerre civile finlandaise. Après la guerre, il s'est réformé en une version plus patriotique et moins radicale, provoquant la scission du parti entre sociaux-démocrates et communistes. La scission ne s'est aggravée qu'après la Seconde Guerre mondiale."
