 ISR_liberal_party: "HaTsionim HaKlaliym"
 ISR_liberal_party_long: "HaTzionim HaKlaliym : §GHaTzionim HaKlaliym (sionistes généraux) est un grand parti capitaliste centriste. Formé par des sionistes non affiliés à aucune des deux écoles de pensée du sionisme, il a rapidement adopté des attitudes libérales et capitalistes. La principale base de soutien du sionisme général est la classe moyenne et les autres propriétaires fonciers en dehors des kibboutz. Les Sionistes Généraux sont considérés comme la solution bipartite à l'état de plus en plus polarisé de la politique israélienne.§!"
 ISR_nationalist_party: "Tnuat Hérout"
 ISR_nationalist_party_long: "Mouvement Herut : §GTnuat Herut (Mouvement Herut) également appelé simplement Herut est un parti sioniste révisionniste de droite. Formé par l'ancien leader de l'Irgun Menachem Begin et fortement influencé par le parti Hatzohar, aujourd'hui disparu. Herut a adopté le point de vue de Jabotinsky sur le sionisme, un sionisme révisionniste qui lutte pour la souveraineté juive sur l'intégralité de l'ancien mandat britannique sur la Palestine et le contrôle total de la Terre d'Israël. Le Herut est considéré par de nombreux autres partis comme une force radicale marginale, mais son soutien populaire en fait un candidat potentiel majeur au pouvoir à la Knesset.§!"
 ISR_socialist_party: "Mifleget Poalei Eretz Israël"
 ISR_socialist_party_long: "Mifleget Poalei Eretz Yisrael : §GMifleget Poalei Eretz Yisrael (Parti des travailleurs de la terre d'Israël), souvent abrégé en Mapai, est un parti socialiste modéré qui a dominé la politique sioniste dans les années précédant la création de l'État. Avec sa politique socialiste et ses positions pro-occidentales, le Mapai apparaît comme un parti pour les travailleurs ordinaires qui n'ont pas adhéré au communisme. Le Mapai est cependant un parti très instable, avec de nombreuses factions qui se disputent le pouvoir, ce qui culmine dans des troubles au sein du parti pour chaque erreur commise.§!"
 ISR_trotskyism_party: "Mifleget HaPoalim HaMeuhedet"
 ISR_trotskyism_party_long: "Mifleget HaPoalim HaMeuhedet : §GMifleget HaPoalim HaMeuhedet (Parti uni des travailleurs), souvent abrégé en Mapam, est un parti socialiste pur et dur avec des tendances marxistes mineures. Né de la fusion des partis HaShomer Hatzair et Ahdut Ha'Avodah, le Mapam se situe solidement à gauche. Mapam estime que le sionisme peut jouer un rôle dans la révolution mondiale et estime que l'URSS a commis une erreur en adoptant des attitudes antisionistes.§!"
