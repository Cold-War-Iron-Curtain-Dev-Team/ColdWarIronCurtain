USA_50s_The_CIA:0 "La CIA"
USA_50s_The_CIA_desc:0 "Opérations liées à la CIA."
USA_50s_US_MIssile_Command:0 "Commandement aérien stratégique"
USA_50s_US_MIssile_Command_desc:0 "Le Strategic Air Command (SAC) a été créé le 21 mars 1946. Le SAC contrôlait les bombardiers stratégiques basés au sol et les ICBM. SAC exploitait également tous les avions de reconnaissance stratégique, tous les avions de poste de commandement aéroporté stratégique et tous les avions de ravitaillement aérien de l'USAF."
USA_50s_The_Big_Stick:0 "Le gros bâton"
USA_50s_Polaris:0 "Jupiter"
USA_50s_Polaris_desc:0 "Le PGM-19 Jupiter fut le premier missile balistique à moyenne portée à pointe nucléaire de l'armée de l'air américaine."
USA_50s_IRBM_Focus:0 "Focus IRBM"
USA_50s_The_US_Army:0 "L'armée américaine"
USA_50s_The_US_Army_desc:0 "L'armée américaine a connu une réduction importante de ses effectifs après la fin de la Seconde Guerre mondiale. Avec le déclenchement de conflits partout dans le monde et le risque d'une nouvelle guerre mondiale, il pourrait être judicieux de reconstruire l'armée."
USA_50s_The_M14:0 "Le M14"
USA_50s_The_M40_Sniper_Rifle:0 "Le fusil de précision M40"
USA_50s_Improve_Special_Forces_Training:0 "Améliorer la formation des forces spéciales"
USA_50s_Improve_SPG:0 "Améliorer nos automoteurs WW2"
USA_50s_Improve_SPG_desc:0 "Comme nous l'avons vu pendant la Seconde Guerre mondiale, de puissants canons automoteurs sont nécessaires pour disposer d'une puissance de feu adéquate sur le champ de bataille."
USA_50s_LVTP_5_for_the_USMC:0 "LVTP 5 pour l'USMC"
USA_50s_Focus_on_Ultralight_Weight_Tank_Destroyers:0 "Focus sur les chasseurs de chars ultralégers"
USA_50s_Focus_on_Lightweight_Tanks:0 "Focus sur les chars légers"
USA_50s_Update_the_M103:0 "Mettre à jour le M103"
USA_50s_The_Navys_19th_Decade:0 "La 19e décennie de la Marine"
USA_50s_The_Navys_19th_Decade_desc:0 "Après la Seconde Guerre mondiale, la marine américaine est devenue la force de surface et sous-marine la plus puissante au monde. Mais de nouvelles menaces pourraient se profiler à l'horizon."
USA_50s_The_United_States_Marine_Corps:0 "Le Corps des Marines des États-Unis"
USA_50s_The_United_States_Marine_Corps_desc:0 "La fin de la Seconde Guerre mondiale n'a pas apporté la paix, mais simplement un nouveau champ de bataille, assombri par l'idéologie, les menaces nucléaires et les guerres par procuration à travers le monde. Le Corps des Marines des États-Unis, forgé dans les incendies d'Iwo Jima et d'Okinawa, doit désormais se préparer à un autre type de guerre : une guerre menée dans des jungles lointaines, sur des champs de bataille urbains et dans des régions instables où les intérêts américains sont en danger."
USA_50s_Jets_For_The_Fleet:0 "Des jets pour la flotte"
USA_50s_Jets_For_The_Fleet_desc:0 "Nos escadrons de chasse de l'US Navy s'appuient encore largement sur des avions à hélices. Afin de relever les défis de la guerre froide, nous devons les remplacer par des avions à réaction modernes."
USA_50s_Nuclear_Depth_Charges:0 "Charges nucléaires en profondeur"
USA_50s_Focus_on_Sub_Detection:0 "Concentrez-vous sur la sous-détection"
USA_50s_Focus_on_Sub_Detection_desc:0 "Les premiers rapports suggèrent que les Soviétiques envisagent de construire des centaines de sous-marins. Ils savent qu'ils ne peuvent égaler la puissance de notre flotte de surface. C'est pourquoi nous devons toujours être vigilants face à la menace sous-marine posée par les sous-marins."
USA_50s_The_Supercarrier:0 "Le Supercarrier"
USA_50s_The_Supercarrier_desc:0 "Les porte-avions de classe Forrestal étaient quatre porte-avions conçus et construits pour la marine américaine dans les années 1950. Il s'agissait de la première classe de supercarriers, combinant un tonnage élevé, des ascenseurs au bord du pont et un pont incliné. Le premier navire a été mis en service en 1955, le dernier mis hors service en 1998."
USA_50s_Navalised_Helicoptors:0 "Hélicoptères navals"
USA_50s_Navalised_Helicoptors_desc:0 "Les hélicoptères lancés depuis des destroyers peuvent accomplir leur mission anti-sous-marine avec brio. Si jamais la guerre froide s'intensifie, nous devons maintenir les voies maritimes ouvertes pour envoyer des renforts partout où cela est nécessaire."
USA_50s_Improve_Naval_Illuminator_Radar:0 "Améliorer le radar illuminateur naval"
USA_50s_Charles_F_Adams_Class_DDG:0 "DDG de classe Charles F. Adams"
USA_50s_Charles_F_Adams_Class_DDG_desc:0 "La classe Charles F. Adams est une classe de navires de 29 destroyers lance-missiles (DDG) construits entre 1958 et 1967. Vingt-trois destroyers ont été construits pour la marine américaine, trois pour la marine royale australienne et trois pour la Bundesmarine ouest-allemande. La conception de ces navires était basée sur celle des destroyers de la classe Forrest Sherman, mais la classe Charles F. Adams était la première classe conçue pour servir de destroyers lance-missiles."
USA_50s_The_Post_War_Airforce:0 "L'armée de l'air d'après-guerre"
USA_50s_The_Post_War_Airforce_desc:0 "L'USAF a été créée en tant que branche distincte des forces armées américaines le 18 septembre 1947. L'USAF est désormais chargée de fournir la majeure partie de l'arsenal nucléaire du pays ; il sera donc essentiel pour nous de garder un avantage constant sur les Soviétiques."
USA_50s_Strategic_Air_Command_in_the_Jet_Age:0 "Le commandement aérien stratégique à l'ère des avions à réaction"
USA_50s_Strategic_Air_Command_in_the_Jet_Age_desc:0 "Notre arsenal nucléaire est lancé par voie aérienne et nous aurons besoin d'une force de bombardiers tout aussi puissante pour vaincre les défenses aériennes soviétiques."
