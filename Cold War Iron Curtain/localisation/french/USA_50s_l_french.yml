 USA_50s_Improve_Special_Forces_Training:0 "Améliorer l'entraînement des forces spéciales"
 USA_50s_Improve_SPG:0 "Améliorez nos SAU de la Seconde Guerre Mondiale"
 USA_50s_Improve_SPG_desc:0 "Comme nous l'avons vu pendant la Seconde Guerre mondiale, des canons automoteurs puissants sont nécessaires pour apporter une puissance de feu adéquate sur le champ de bataille."
 USA_50s_LVTP_5_for_the_USMC:0 "LVTP 5 pour le Corps des Marines des États-Unis"
 USA_50s_Focus_on_Ultralight_Weight_Tank_Destroyers:0 "Se concentrer sur les chasseurs de chars ultralégers"
