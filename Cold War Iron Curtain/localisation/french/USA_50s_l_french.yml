 USA_50s_US_MIssile_Command:0 "Commandement Aérien Stratégique"
 USA_50s_US_MIssile_Command_desc:0 "Le Commandement aérien stratégique (SAC) a été créé le 21 mars 1946.Le SAC avait le contrôle des bombardiers stratégiques terrestres et des ICBM.Le SAC exploitait également tous les avions de reconnaissance stratégiques, tous les avions de commandement aéroportés stratégiques, et tous les avions de ravitaillement en vol de l'USAF."
 USA_50s_The_Big_Stick:0 "Le grand bâton"
 USA_50s_Polaris:0 "Jupiter"
 USA_50s_Polaris_desc:0 "Le PGM-19 Jupiter était le premier missile balistique à portée intermédiaire à ogive nucléaire de l'US Air Force."
 USA_50s_IRBM_Focus:0 "Focus sur le MB-PI"
 USA_50s_The_US_Army:0 "L'armée américaine"
 USA_50s_The_US_Army_desc:0 "L'armée américaine a connu une réduction majeure après la fin de la Seconde Guerre mondiale. Avec les conflits qui commencent à travers le monde et le risque d'une nouvelle guerre mondiale, il pourrait être judicieux de reconstruire l'armée."
