l_french:
 amendment_22.1.d:0 "Le Vingt-deuxième amendement à la constitution des États-Unis limite à deux le nombre de mandats qu'un individu peut remplir en tant que président. L'intérêt pour l'amendement a augmenté après que Franklin Roosevelt a été élu quatre fois au poste. Les partisans de l'amendement soutiennent que permettre des mandats illimités pourrait affaiblir la démocratie et s'éloigne de la tradition des deux mandats établie par George Washington. L'amendement a été adopté en février 1947 et le processus de ratification par l'État est en cours. Il y a une pression pour que les législatures des États adoptent l'amendement plus rapidement. Le président peut soit soutenir le processus, soit exhorter les législatures des États à retarder la ratification pour empêcher l'amendement d'atteindre la majorité des trois quarts requise des législatures des États. Si une majorité n'est pas atteinte d'ici février 1954, l'amendement échouera."
 amendment_22.2.d:0 "Quatre ans après avoir été adopté par le Congrès, le Vingt-deuxième amendement à la Constitution, le nombre requis de législatures d'État ont adopté l'amendement. Les exigences constitutionnelles ont toutes été satisfaites confortablement dans le délai de sept ans imparti par le Congrès aux législatures des États. Les dirigeants politiques des deux côtés de l'allée félicitent le président de ne pas s'immiscer dans le processus. Le nouvel amendement limitera à seulement deux le nombre de mandats qu'un individu peut exercer en tant que président. Beaucoup pensent que cet amendement rétablit l'équilibre entre les pouvoirs exécutif et législatif du gouvernement. Malgré l'approbation générale, certains Américains estiment que le nouvel amendement n'est pas nécessaire et pourrait coûter au peuple américain le leadership à long terme d'un président exceptionnel, tel que Franklin Roosevelt."
 amendment_22.3.d:0 "Le Président a provoqué une tempête politique suite à ses récentes déclarations concernant le processus de ratification du 22e amendement. Cet amendement limiterait un individu à seulement deux mandats en tant que Président. Dans ses remarques, le Président a qualifié cet amendement de réaction impulsive à l'ère immédiate post-Roosevelt, soulignant que le peuple américain peut et doit être digne de confiance pour élire le bon homme pour le poste, quel que soit le contexte ou le nombre de mandats qu'une personne a exercés. Il a appelé les dirigeants politiques au niveau des États à rejeter l'amendement. Les dirigeants du Congrès ont rapidement condamné l'ingérence du Président dans cette affaire, et des rapports indiquent que la Maison Blanche demande également aux législatures des États de retarder le vote sur l'amendement afin que la limite de sept ans fixée par le Congrès expire."
 amendment_22.4.d:0 "Les récentes remarques du Président contre le 22e amendement portent leurs fruits, car les législatures des États organisent soit des votes de rejet, soit mettent la discussion sur l'amendement en suspens indéfiniment. Il est peu probable que la Maison Blanche puisse garantir que suffisamment d'États rejetteront l'amendement, mais les tactiques de retardement peuvent empêcher d'atteindre la majorité des trois-quarts des législatures des États nécessaires pour approuver un amendement. Cela pourrait mettre l'amendement dans une situation de limbo politique étrange, mais l'empêcherait de devenir une loi. Le Président est fermement convaincu que limiter les mandats présidentiels ne ferait que rendre les États-Unis vulnérables en cas de future crise."
 amendment_22.5.d:0 "Des dirigeants politiques défiants dans les législatures des États à travers les États-Unis défient un appel récent de la Maison Blanche visant à stopper l'adoption du 22e amendement. Suffisamment de législatures des États ont accepté de ne pas retarder ni rejeter l'amendement, ce qui oblige le Président à accepter sa ratification comme inévitable. Il semble que de nombreux dirigeants aient été surpris par la Maison Blanche et craignaient que leur rejet de l'amendement ne perturbe l'équilibre national des pouvoirs. Un porte-parole de la Maison Blanche a déclaré que le Président avait exprimé son avis, mais qu'il n'avait pas exigé que les législatures des États obéissent à ses directives, contrairement à ce que prétendent les opposants."
 amendment_22.6.d:0 "Les opposants au Président se réjouissent de son échec à stopper la ratification du 22e amendement. Bien que le Président ait affirmé qu'il ne souhaitait pas de mandats supplémentaires pour lui-même, mais pour les futurs titulaires de fonctions, ses opposants ont rapidement présenté cette initiative comme une tentative évidente de gouverner plus longtemps. Les journaux sont remplis d'éditoriaux qualifiant la poursuite du processus de ratification de victoire pour la démocratie. Le Président avait misé une grande partie de son capital politique pour stopper l'amendement, et son échec a provoqué des réactions négatives. Les opposants à la Maison Blanche savourent pleinement leur victoire."
 amendment_22.7.d:0 "Le 22e amendement, bien qu'il ait été adopté par le Congrès et par une majorité d'États, n'a pas réussi à obtenir suffisamment de votes de ratification dans le délai de sept ans fixé par le Congrès. Les amendements nécessitent une majorité des trois-quarts des législatures des États pour ratifier l'amendement dans le délai spécifié. Lors de la phase de ratification par les États, la Maison Blanche de l'époque a ouvertement fait campagne pour que l'amendement ne soit pas adopté ni soumis au vote. Elle estimait que les limites de mandats pour la présidence étaient arbitraires et privaient le peuple américain de ses options. Les partisans de l'amendement condamnent l'échec de son adoption, soulignant que l'amendement protégerait la démocratie et restaurerait l'équilibre entre les trois branches du gouvernement."
 amendment_22.8.d:0 "Le 22e amendement limite un individu à seulement deux mandats. Cette limite arbitraire empêche le peuple américain de choisir le meilleur dirigeant si nécessaire et doit être abrogée. Cependant, cela nécessitera beaucoup de capital politique et de soutien public, car l'opposition peut facilement manipuler l'argument en le présentant comme une tentative de la Maison Blanche d'étendre son propre pouvoir."
 amendment_22.9.d:0 "Après avoir acquis suffisamment de capital politique et créé un environnement favorable au changement, le Président a réussi à superviser l'abrogation du 22e amendement. Cet amendement limite les individus à seulement deux mandats en tant que président. Cependant, le Président a réussi à obtenir la majorité des deux tiers requise dans les deux chambres du Congrès pour faire adopter un nouvel amendement l'abrogeant. La majorité des trois-quarts des législatures des États nécessaires pour adopter l'amendement devrait être obtenue dans les semaines à venir. Il s'agit d'une grande victoire pour la Maison Blanche, mais cela l'a exposée aux critiques des opposants qui affirment que l'amendement empêche un individu de monopoliser le pouvoir exécutif."
 amendment_22.10.d:0 "L'effort récent du Président pour obtenir suffisamment de soutien au Congrès et au niveau des États afin d'abroger le vingt-deuxième amendement a échoué. La Maison Blanche n'a pas réussi à convaincre suffisamment de dirigeants politiques que l'amendement, qui impose des limites de mandats présidentiels, est inutile et constitue un obstacle aux droits démocratiques des citoyens. Des experts juridiques constitutionnels renommés avaient averti le Président que son initiative faisait face à des chances de succès très minces, et ils ont eu raison. Bien que l'effort ait d'abord semblé avoir suffisamment de soutien, la réaction publique alimentée par les opposants politiques a assuré l'échec de l'initiative."
 amendment_22.11.d:0 "Le vingt-deuxième amendement n'a pas réussi à obtenir la majorité des trois-quarts parmi les législatures des États. À l'époque, il y avait beaucoup de débats politiques sur la question et un manque de consensus. En conséquence, malgré l'adoption de l'amendement par une majorité d'États, pas suffisamment l'ont ratifié avant la fin du délai fixé par le Congrès. Le Président et ses alliés au Congrès pourraient lancer un nouvel effort pour établir un nouveau calendrier et compléter le processus de ratification."
 amendment_22.12.d:0 "Le Président et ses principaux alliés au Congrès se sont rencontrés pour se féliciter mutuellement après l'adoption formelle du vingt-deuxième amendement à la Constitution. L'amendement, qui limite un individu à un maximum de deux mandats à la présidence, avait été bloqué pendant plusieurs années. Cependant, le Président et ses alliés ont réussi à relancer le processus de ratification et à garantir que le seuil des trois-quarts des législatures des États soit atteint. Le Président est salué pour sa perspicacité politique dans la gestion de cette crise constitutionnelle difficile."
 amendment_22.13.d:0 "Dans un revers embarrassant pour le Président et ses alliés, les efforts pour finaliser la ratification du vingt-deuxième amendement ont de nouveau échoué. Après des semaines d'efforts, il est clair que suffisamment de législatures des États refusent de se saisir de l'amendement, ce qui garantit que la majorité des trois-quarts ne pourra pas être atteinte. L'effort pour raviver l'amendement a nécessité un grand capital politique et une coopération étroite entre la Maison Blanche et le Congrès. Les journaux remettent ouvertement en question la crédibilité politique du Président, et les émissions de divertissement regorgent de blagues sur un Président qui ne parvient même pas à limiter ses propres mandats."
 nixon.1960.d:0 "Le Président Richard Nixon a pris le temps de condamner les démocrates du sud, appelés Dixiecrats, pour leur position extrême en faveur de la ségrégation et leur résistance aux droits civiques. Le Président a souligné que ces politiciens ont interféré avec les décisions de la Cour suprême et les lois fédérales à travers le sud. Le discours du Président est salué par les activistes des droits civiques. Cependant, les opposants au Président l'accusent de chercher à exploiter la situation actuelle dans le Sud afin de rallier le soutien du Parti républicain. Les partisans du Président rejettent cette critique et insistent sur le fait qu'il pose simplement les bases de futures législations sur les droits civiques."
 Operation_Vulture.1.d:0 "L'armée des États-Unis a annoncé le lancement d'opérations de combat contre les forces communistes anti-françaises du Viet Minh en Indochine française. Des bombardiers américains en provenance de bases aériennes proches ciblent des points stratégiques du Viet Minh tandis que d'autres unités de combat pénètrent dans le pays. Les États-Unis estiment que le Viet Minh représente une menace majeure pour la sécurité régionale et la sécurité du peuple vietnamien. Le gouvernement français accueille favorablement ce soutien et affirme qu'il sera bientôt en mesure de rétablir la sécurité au Vietnam et d'atteindre une résolution honorable du conflit. La réponse mondiale devrait être particulièrement négative de la part des États post-coloniaux qui verront cette action comme un soutien des États-Unis à l'impérialisme européen."
 Korean_Refugee_Oregon_TT:0 "§CEnviron 250 000 réfugiés coréens seront évacués vers l'État de l'Oregon, ce qui ajoutera la culture coréenne à l'Oregon et changera également la démographie religieuse de l'État§!"
