USA_indochina_geneva_weight_TT:0 "Le poids de négociation de notre délégation augmente de §Y[?geneva_lev_amount|0]§!"
USA_indochina_rapprochement_gain_TT:0 "Rapprochement entre Saigon et Hanoi : §G+[?usa_indo_rapp|0]§!"
USA_indochina_rapprochement_loss_TT:0 "Rapprochement entre Saigon et Hanoi : §R[?usa_indo_rapp|0]§!"
USA_indochina_cuongde_early_TT:0 "§GParrainage précoce :§! Cuong-De prend le pouvoir avec des années pour se consolider avant les campagnes décisives, et le soutien de Washington est décisif plutôt qu'accessoire."
USA_indochina_cuongde_mid_TT:0 "§YParrainage tardif :§! Cuong-De prend le pouvoir alors que la guerre est déjà bien avancée. Son régime hérite d'un conflit au lieu de le façonner."
USA_indochina_cuongde_late_TT:0 "§RParrainage tardif :§! la guerre est pratiquement décidée. Installer Cuong-De maintenant, c'est un changement de visage à Saigon, un peu plus."
USA_50s_Stabilize_DanQuoc_early_bonus_TT:0 "§GPrime de parrainage anticipé :§! un régime que nous avons installé il y a des années a eu le temps de s'enraciner - tout le soutien au gouvernement Dan-Quoc est doublé."
USA_indochina_cuongde_incumbent_TT:0 "§YApprobation, pas parrainage :§! Cuong-De a atteint Saigon sans nous. Washington achète une place à sa table, et ne construit pas la table."
USA_indochina_back_cuongde_TT:0 "§YCuong-De est une proposition vivante§! - soit il gouverne déjà à Saigon, soit son mouvement est en marche et la succession est encore ouverte"
USA_indochina_settlement_window_TT:0 "§YLa guerre s'est visiblement retournée contre Paris et Saigon§!\nDien Bien Phu est tombé, §You§! Hanoi a pris le terrain qui compte §Yet§! la guerre elle-même va dans l'autre sens.\n\nWashington ne fait pas pression en faveur d'un règlement tant qu'il n'y a pas quelque chose à régler."
USA_indochina_vulture_TT:0 "§YIl y a une guerre qui mérite d'être intensifiée§! - soit l'insurrection du sud est brisée et Hanoï est en train de perdre, §You§! le camp de Dien Bien Phu est assiégé et indécis"
