 USA_50s_The_Big_Stick_desc:0 "Les missiles de croisière sont rapides et précis, exactement ce dont nous avons besoin pour décimer l'ennemi avant qu'il n'ait la moindre chance de nous frapper."
 USA_50s_IRBM_Focus_desc:0 "Les IRBM nous donnent l'opportunité de décapiter l'ennemi à une distance confortable. Plus nous en avons, mieux c'est."
 USA_50s_The_M14_desc:0 "Alors que le M1 Garand commence à montrer son âge, nous devons développer une nouvelle arme pour les nouvelles guerres de la guerre froide."
 USA_50s_The_M40_Sniper_Rifle_desc:0 "Donnez un M40 à un Marines et les communistes ne sauront jamais ce qui les a frappés."
 USA_50s_Improve_Special_Forces_Training_desc:0 "Le communisme se répand dans le monde entier ; nos forces spéciales doivent apprendre à combattre dans tous les environnements possibles."
 USA_50s_LVTP_5_for_the_USMC_desc:0 "Le LVTP-4 nous a bien servi mais commence à montrer des signes de vieillesse. Nous devrions accélérer le développement de son successeur."
 USA_50s_Focus_on_Ultralight_Weight_Tank_Destroyers_desc:0 "Le Scorpion peut être léger, mais il est certainement rapide. Nous devrions augmenter leur production."
 USA_50s_Focus_on_Lightweight_Tanks_desc:0 "Les gars de Cadillac ont travaillé dur pour créer des designs pour remplacer le vieux M24. Voyons si nous ne pouvons pas leur donner un petit coup de pouce."
 USA_50s_Update_the_M103_desc:0 "Les chars lourds des communistes sont impressionnants, nous ferions mieux de trouver quelque chose d'encore plus puissant."
 USA_50s_Nuclear_Depth_Charges_desc:0 "Pourquoi devrions-nous limiter l'utilisation des armes nucléaires aux seuls missiles ? Voyons si ces sous-marins soviétiques survivent à ça !"
 USA_50s_Improve_Naval_Illuminator_Radar_desc:0 "Le radar de contrôle de tir est un élément clé d'un navire moderne, nous ferions mieux de nous assurer que nous avons la dernière technologie en la matière."
 USA_50s_Persue_Nuclear_Aircraft_desc:0 "Si nous pouvons perfectionner les avions à propulsion nucléaire, nous pourrons préserver le carburant et atteindre une plus grande dissuasion."
 USA_50s_The_French_Indochina_War_desc:0 "Après la Seconde Guerre mondiale, les Vietnamiens espéraient devenir indépendants. Au lieu de cela, les Français ont réoccupé le territoire, poussant le Viet Minh à lancer une guerre pour libérer leur pays. Alors que la guerre fait rage, nous devons décider comment soutenir nos alliés français."
 USA_50s_Unconventional_Approach_desc:0 "Le conflit en cours en Indochine est une guerre de libération contre le colonialisme français. Il est plus sage pour nous de considérer des solutions \"non conventionnelles\" pour stabiliser la région en concluant des accords avec les autochtones."
 USA_50s_Sponser_CuongDe_Coup_desc:0 "Les scandales répétés et les actions incompétentes de Bao-Dai ne sont pas acceptables, peut-être est-il temps de soutenir les tentatives de Cuong-De à la place."
 USA_50s_Stabilize_DanQuoc_Regime_desc:0 "Le régime Dan-Quoc de Cuong-De est encore à ses débuts. Par conséquent, envoyer un soutien matériel et économique le stabiliserait grandement contre la menace communiste actuelle !"
 USA_50s_Befriend_Minh_desc:0 "Il était imprudent pour notre gouvernement d'ignorer constamment l'amitié du Oncle Ho. Ainsi, nous devrions coopérer avec son régime populaire au lieu de soutenir la brutale domination coloniale de la France."
 USA_50s_Reestablish_Deer_Team_desc:0 "L'équipe des Cerfs a pu former et aider à se lier d'amitié avec l'oncle Ho et le Viet Minh en 1945, et il est donc bénéfique pour nous de les renvoyer afin de réaligner la vision de l'oncle Ho pour défendre nos valeurs démocratiques."
 USA_50s_Support_French_Allies_desc_desc:0 "Les Français ont toujours été nos alliés les plus proches depuis notre indépendance et notre guerre révolutionnaire contre les Britanniques en 1776.Rendons-leur la pareille en soutenant leur emprise sur l'Indochine contre la menace rouge !"
 USA_50s_Diplomatic_Assurances_to_France_desc:0 "Nous assurons aux Français que nous soutenons leurs efforts diplomatiques, peut-être même en mettant finalement fin à la guerre pacifiquement."
 USA_50s_VietMinh_Negotiating_desc:0 "Ho Chi Minh est un leader pragmatique qui cherche les meilleurs intérêts de son peuple plutôt que de servir une quelconque loyauté envers Moscou. Ainsi, nous devrions négocier directement avec lui pour chercher une solution pacifique en Indochine."
 USA_50s_Bring_the_French_to_the_Negotiating_Table_desc:0 "La guerre en Indochine continue de faire rage sans fin en vue. Nous devrions essayer de faire asseoir les Français à la table des négociations avec le Viet Minh."
 USA_50s_The_Geneva_Conferece_desc:0 "Des délégués des deux Vietnam, de la France, du Royaume-Uni, de l'Union soviétique et des États-Unis se réuniront à Genève pour discuter de la situation en Indochine."
 USA_50s_Military_Aid_to_France_desc:0 "Il n'y a pas de négociation avec les communistes. La seule façon de résoudre la crise en Indochine est de vaincre le Viet Minh."
 USA_50s_Send_Money_and_Guns_desc:0 "Rien ne tue un communiste mieux que du plomb chaud et de l'acier. Nous fournirons aux Français les outils nécessaires à la victoire."
 USA_50s_Operation_Vulture_desc:0 "La France ne peut pas gagner cette guerre toute seule. Nous allons intervenir en leur faveur et mettre fin à la petite révolte de Ho Chi Minh dès maintenant."
 USA_50s_The_Fall_of_the_Viet_Minh_desc:0 "Les communistes ont été écrasés et l'ordre a été rétabli au Vietnam. Une autre victoire pour les gentils !"
 USA_50s_Reunification_Election:0 "La guerre s'est terminée dans une impasse entre les communistes du Nord et les démocrates du Sud. Cependant, nous devons encore maintenir l'élection de réunification tant promise pour espérer réunifier les deux pays vietnamiens."
 USA_50s_Allow_Free_Elections_desc:0 "Les communistes ont été anéantis, il est très peu probable qu'ils gagnent lors d'une élection libre."
 USA_50s_Rig_the_Vietnamese_Elections_desc:0 "Nous veillerons à ce que le communisme ne réapparaisse jamais au Vietnam. Diem gagnera cette élection parfaitement libre et équitable."
 USA_50s_Fund_VIE_Reconstruction_desc:0 "La guerre d'Indochine est terminée et il est donc bénéfique pour nous de commencer à investir dans la région pour assurer sa richesse et sa stabilité continues."
 USA_50s_Encourage_French_Decolonization_desc:0 "Les Français doivent réaliser que la révolte était due à leur mauvaise politique coloniale en Indochine. Il est temps qu'ils partent."
 USA_50s_Fund_French_Coup_Against_Diem:0 "Il semble que la France soutienne plusieurs tentatives de coup d'État en coopérant avec le Binh-Xuyen, le général Hinh, le Viet-Quoc et le Parti Dai-Viet contre les politiques communistes de Diem. Nous devrions envisager de soutenir ces tentatives car les politiques et ambitions actuelles de Diem sont plus étroitement alignées avec Moscou qu'avec les nôtres."
 USA_50s_Permit_Diem_Regime_desc:0 "Nous établirons un contact avec Diem et lui assurerons que le Vietnam sera indépendant sous sa surveillance, que les Français aillent au diable."
 USA_50s_The_Decolonization_Debate_desc:0 "L'impérialisme est contesté de deux côtés. D'une part, il y a une montée du nationalisme au sein des différents empires, entraînant des revendications d'autonomie et d'indépendance. D'autre part, il y a une prise de conscience croissante que toute l'idée de l'empire exclusif appartient à une époque révolue; et que les régions arriérées du monde, tant en ce qui concerne le développement économique que l'avancement culturel, devraient être considérées comme une responsabilité reposant sur la communauté internationale dans son ensemble."
 USA_50s_Push_for_Decolonization_desc:0 "Le monde change, et dans ce nouveau monde, il n'y a pas de place pour l'impérialisme."
 USA_50s_A_Return_to_Wilsonian_Diplomacy_desc:0 "Notre politique de colonisation devrait suivre les Quatorze Points de Woodrow Wilson, qui incluent l'accent sur l'autodétermination des peuples, la promotion de la démocratie, la promotion du capitalisme, le soutien à la sécurité collective et au moins une opposition partielle à l'isolationnisme américain."
 USA_50s_Africa_for_the_Africans_desc:0 "L'Afrique doit être pour les Africains, et nous les aiderons à y parvenir."
 USA_50s_Offer_Entrance_to_the_Technical_Assistance_Program_desc:0 "Les nouvelles nations africaines sont désespérément en retard par rapport au reste du monde en matière de développement technologique. Nous pouvons aider avec cela."
 USA_50s_For_the_Almighty_Dollar_desc:0 "L'Amérique n'est pas une organisation caritative. Nous aiderons les Africains à s'établir, moyennant un prix raisonnable."
 USA_50s_Subvert_Independence_Movements_desc:0 "La plupart des mouvements indépendantistes sont pro-soviétiques par nature. Ils devront… disparaître."
 USA_50s_Introduce_American_Corporate_Investors_desc:0 "L'implantation de bureaux locaux en Afrique nous offrira un marché de consommation massif et un vivier de main-d'œuvre bon marché. Quoi ? Les mendiants ne peuvent pas choisir."
 USA_50s_Solidify_American_Economic_Influence_desc:0 "Tant de nouveaux pays, tant d'argent à gagner. Tout cela pour le bien de l'Afrique, bien sûr."
 USA_50s_Collaborate_with_Local_Interests_desc:0 "Nous devons veiller à ce que ces nouveaux pays comprennent que la voie vers la prospérité passe par nous, et non par le communisme."
 USA_50s_Expand_Foriegn_Aid_Recipients_desc:0 "Il existe déjà quelques pays nominalement indépendants en Afrique, donnons-leur un peu de financement."
 USA_50s_Infrastructure_Grants_desc:0 "Les marchandises ont besoin de routes pour circuler, nous accorderons aux gouvernements africains des subventions pour développer les artères commerciales nécessaires."
 USA_50s_Send_Educational_Aid_desc:0 "L'analphabétisme est un outil des oppresseurs pour maintenir les masses dans l'ignorance. Si l'Afrique veut prospérer, sa population doit recevoir une éducation adéquate."
 USA_50s_Provide_Economic_Loans_desc:0 "Nous approuverons certains prêts aux gouvernements africains afin qu’ils puissent accroître leur développement."
 USA_50s_Continue_the_Eurocentric_African_Policy_desc:0 "L'indépendance du XXe siècle ouvre la voie au communisme. Pour que l'Afrique reste libre, elle doit accepter la domination européenne."
 USA_50s_Warn_of_the_Dangers_of_Premature_Independence_desc:0 "La grandeur de l'Amérique réside dans le fait que nous avons obtenu notre indépendance quand nous étions prêts. Une indépendance prématurée mènerait au chaos, à la guerre civile et à la dictature."
 USA_50s_Foster_Happy_Colonial_Relationships_desc:0 "L’Afrique et l’Europe sont plus fortes ensemble, il faut le rappeler aux deux parties."
 USA_50s_Promote_Progressive_Colonial_Reforms_desc:0 "Certains partisans de l'indépendance avancent des arguments pertinents. Les régimes coloniaux devraient adopter certaines de leurs idées."
 USA_50s_Promote_Moderate_Local_Leaders_desc:0 "Pour chaque communiste africain, il y a 100 modérés. Nous favoriserons les seconds et discréditerons les premiers."
 USA_50s_Invest_in_New_African_Experts_desc:0 "Les experts africains compétents doivent être valorisés, et non écartés. Ils peuvent aider les colonies autant que les Européens."
 USA_50s_The_Hungarian_Revolution_desc:0 "Des réformistes se sont levés en Hongrie pour se libérer du joug soviétique ! Nous ne pouvons pas l'ignorer !"
 USA_50s_Threaten_the_Soviets_desc:0 "La Hongrie aspire à la liberté, et l'Amérique a entendu cet appel. Nous ferons clairement savoir que la Hongrie sera protégée de toute ingérence soviétique !"
 USA_50s_Stand_By_Our_Word_desc:0 "L’agression soviétique ne peut plus être permise, l’URSS doit être détruite."
 USA_50s_The_Curtain_Opens_desc:0 "Les Soviétiques ont reculé, la Hongrie est libre !"
 USA_50s_Bring_the_Issue_to_the_UN_desc:0 "Ce qui se passe en Hongrie affectera toutes les nations européennes. Les Nations Unies doivent agir !"
 USA_50s_Diplomatic_Objections_desc:0 "Ce que l'Union soviétique fait à la Hongrie constitue une violation de tous les droits internationaux établis depuis la fondation des Nations Unies. Le Conseil de sécurité tout entier doit en être conscient !"
 USA_50s_Expose_Soviet_Aggression_desc:0 "Le mépris flagrant de l'Union soviétique pour le décorum et la conduite internationale est pleinement visible. Nous devons montrer au reste du monde quel genre de nation elle est."
 USA_50s_International_Humanitarian_Aid_for_Hungarian_Refugees_desc:0 "Ce fut un beau combat, mais la Révolution a échoué. Nous veillerons à ce que ceux qui ont fui la Hongrie avant l'invasion soient correctement pris en charge."
 USA_50s_A_Military_Police_Action_desc:0 "Si un seul soldat soviétique franchit la frontière hongroise, cela constituera une violation du droit international. Une force de police de l'ONU sera déployée en Hongrie pour la défendre coûte que coûte."
 USA_50s_Issue_Diplomatic_Objections_desc:0 "Même si nous soutenons les Hongrois, la guerre n'est pas une option. Le mieux que nous puissions faire est d'émettre des objections diplomatiques contre l'agression soviétique."
 USA_50s_Accept_Hungarian_Refugees_desc:0 "Les peuples opprimés du monde sont toujours les bienvenus aux États-Unis. Toute personne ayant réussi à fuir la Hongrie se verra accorder l'asile, si elle le souhaite."
 USA_50s_The_Containment_Policy_desc:0 "Le communisme est comme une maladie, se propageant sans cesse et infectant tout ce qu'il touche. Il faut l'isoler et l'affamer."
 USA_50s_An_Arms_Race_desc:0 "Les Soviétiques travaillent d'arrache-pied pour construire une machine de guerre massive. Quoi qu'il arrive, nous devons garder une longueur d'avance."
 USA_50s_Vastly_Expand_the_Military_Industrial_Complex_desc:0 "L'armée est forte, mais elle peut l'être encore plus. Une seule bombe peut faire la différence entre la victoire et la défaite."
 USA_50s_The_Mutual_Security_Plan_desc:0 "Évolution du Plan Marshall, le Plan de sécurité mutuelle aidera à développer la capacité des autres pays à empêcher la propagation du communisme."
 USA_50s_Itegrating_Germany_Into_the_Western_Economy_desc:0 "L'Allemagne de l'Ouest se reconstruit lentement pour retrouver sa puissance économique d'avant-guerre. Les avoir à nos côtés, pour une fois, nous sera d'un grand secours."
 USA_50s_Invest_in_Scandinavia_desc:0 "La Scandinavie est très prometteuse, nous allons leur réserver des fonds pour qu'ils puissent développer leur capacité industrielle."
 USA_50s_Funding_the_Commonwealth_desc:0 "Le Royaume-Uni est notre plus puissant allié depuis des décennies, et l’Empire aura notre aide pour se reconstruire."
 USA_50s_Redirect_Aid_to_South_Asia_desc:0 "Le Royaume-Uni a suffisamment d’argent, les démocraties naissantes d’Asie en ont encore plus besoin."
 USA_50s_Finance_Continued_Benelux_Reconstruction_desc:0 "Les Pays-Bas ont beaucoup souffert pendant la guerre ; ils ont besoin de davantage d’aide de notre part."
 USA_50s_Continue_French_Fiscal_Aid_desc:0 "La France était l'un de nos alliés contre l'Allemagne nazie, elle a mérité notre aide."
 USA_50s_Redirect_Aid_to_Japan_and_Korea_desc:0 "La France n'a pas beaucoup souffert par rapport au reste de l'Europe. Le Japon et la Corée ont davantage besoin de ces fonds que la France."
 USA_50s_Development_Aid_to_Portugal_and_Italy_desc:0 "Le régime fasciste italien a disparu. La nouvelle Italie a besoin de notre aide pour bâtir une véritable économie industrielle civile. Le Portugal pourrait également en bénéficier."
 USA_50s_Expand_the_Technical_Assistance_Program_desc:0 "Plus nos alliés disposeront d'outils performants, plus ils pourront lutter efficacement contre le communisme. Pour ce faire, le Programme d'assistance technique sera élargi."
 USA_50s_Support_Our_Middle_Eastern_Allies_desc:0 "Le Moyen-Orient est dangereusement proche des Soviétiques, et ils ne sont pas à l'abri d'une révolution communiste. Nous ferons tout notre possible pour les aider."
 USA_50s_Asian_Funding_desc:0 "Nos alliés et anciens ennemis ont besoin d’aide pour se reconstruire après la brutale guerre du Pacifique."
 USA_50s_Invest_in_Taipei_desc:0 "La République de Chine a de meilleures chances de survie si elle dispose d’une économie forte."
 USA_50s_Funds_for_the_Philipines_and_Indonesia_desc:0 "Les Philippines et l'Indonésie ont été brutalement ravagées par l'Empire du Japon, nous les aiderons à se reconstruire."
 USA_50s_Fund_Japanese_Reconstruction_desc:0 "Le Japon impérial a été détruit, mais le travail n'est pas terminé. Le Japon sera reconstruit, passant d'une autocratie militarisée à un modèle de prospérité démocratique en Asie."
 USA_50s_Fiscal_Assistance_for_India_and_Pakistan_desc:0 "L'Inde et le Pakistan sont nouveaux sur la scène internationale. Si nous les aidons à construire leur État, cela ouvrira la voie à un futur partenariat."
 USA_50s_Bankroll_South_Korean_Reconstruction_desc:0 "La République de Corée a besoin d’une économie forte pour faire face à son homologue communiste du Nord."
 USA_Fund_the_CIA_Front_Lines_desc:0 "La CIA a besoin de financement pour protéger les intérêts américains à travers le monde."
 USA_50s_Expanding_NATO_desc:0 "L’OTAN a besoin de plus d’alliés pour lutter contre les Soviétiques."
 USA_50s_Invite_Turkey_desc:0 "L'Union soviétique représente une menace existentielle pour la Turquie, et elle le sait. Elle accueillera à bras ouverts une invitation à l'OTAN."
 USA_50s_Invite_West_Germany_desc:0 "L'Allemagne de l'Est est fermement ancrée dans la sphère d'influence soviétique. Nous devons compter sur la moitié de l'Allemagne pour nous soutenir."
 USA_50s_Invite_Greece_desc:0 "On ne peut pas laisser la Méditerranée sombrer dans le rouge. Nous inviterons la Grèce à rejoindre l'OTAN et à isoler les Soviétiques de la mer."
 USA_50s_The_Middle_East_desc:0 "Opérations liées au Moyen-Orient."
 USA_50s_Crisis_in_Lebaon_desc:0 "Le Liban est au bord de la guerre civile ; nous devons agir rapidement et protéger nos intérêts."
 USA_50s_Secure_Beirut_International_desc:0 "Le moyen le plus sûr d'entrer et de sortir du Liban est de passer par l'aéroport international de Beyrouth. Nous devons le sécuriser."
 USA_50s_Bring_Both_Sides_to_the_Table_desc:0 "Il y a encore une chance de trouver une solution pacifique, nous proposerons de servir de médiateur dans les négociations entre toutes les parties afin d'y parvenir."
 USA_50s_Install_a_Puppet_Leader_desc:0 "Afin de sauvegarder les intérêts américains au Moyen-Orient, nous installerons l’homme que nous préférons comme président."
 USA_50s_The_Legacy_of_the_Armistice_Agreements_desc:0 "Les tensions entre Arabes et Israéliens atteignent peu à peu leur point de rupture. Il faut avancer prudemment."
 USA_50s_Sign_the_Tripartite_Declaration_desc:0 "L'Accord tripartite de 1950 est une déclaration conjointe des États-Unis, du Royaume-Uni et de la France visant à garantir le statu quo territorial déterminé par les accords d'armistice israélo-arabes de 1949. Cette déclaration souligne l'engagement des parties en faveur de la paix et de la stabilité au Moyen-Orient et leur opposition à l'emploi ou à la menace de la force."
 USA_50s_Limited_Israeli_Economic_Aid_desc:0 "Bien que la déclaration limite l’aide militaire que nous pouvons apporter, nous pouvons toujours offrir une assistance économique limitée."
 USA_50s_Reject_the_Tripartite_Proposal_desc:0 "Nous ne pouvons pas signer la déclaration, car cela placerait notre allié dans une situation difficile."
 USA_50s_Advisors_to_Israel_desc:0 "Nous enverrons nos meilleurs hommes pour aider l’armée israélienne à devenir la plus forte de la région !"
 USA_50s_Extensive_Military_Aid_desc:0 "L’armée israélienne est très compétente, mais une aide supplémentaire est toujours la bienvenue."
 USA_50s_Ramp_Up_Foriegn_Aid_to_Israel_desc:0 "Notre aide ne doit pas se limiter uniquement à l’armée, nous pouvons également contribuer à stimuler l’économie israélienne."
 USA_50s_CENTO_desc:0 "L'Organisation du Traité Central est une alliance instable semblable à l'OTAN au Moyen-Orient. Nous devons déterminer si y adhérer serait dans notre meilleur intérêt."
 USA_50s_Influence_Negotiations_desc:0 "Il y a des prospects qui envisagent de rejoindre CENTO, peut-être pouvons-nous les pousser dans la bonne direction ?"
 USA_50s_Join_CENTO_desc:0 "Le CENTO est un élément clé de dissuasion contre le communisme au Moyen-Orient, nous devons le rejoindre immédiatement."
 USA_50s_Bow_to_the_Israel_Lobby_desc:0 "Les conflits entre plusieurs membres du CENTO et nos alliés israéliens sont tout simplement trop importants. Nous ne pouvons pas adhérer au CENTO."
 USA_50s_The_Suez_Crisis_desc:0 "Le gouvernement égyptien a annoncé son intention de nationaliser le canal de Suez et d'en expulser les autorités coloniales. Les Britanniques n'ont aucune intention de laisser cela se produire. Nous devons choisir notre camp."
 USA_50s_Support_Egypt_desc:0 "Nasser souhaite établir une République égyptienne libérée des caprices de puissances coloniales lointaines. Personne au monde ne peut s'identifier davantage à sa vision que nous."
 USA_50s_Denounce_Tripartite_Aggression_desc:0 "Comment pouvons-nous prétendre soutenir la liberté tout en permettant à des puissances étrangères d'occuper légitimement le territoire égyptien ? L'Alliance tripartite doit être stoppée."
 USA_50s_Demand_Tripartite_Withdrawal_desc:0 "Si l’Alliance ne quitte pas pacifiquement l’Égypte, nous serons obligés de prendre des mesures drastiques contre ses membres."
 USA_50s_Crash_the_British_Economy_desc:0 "Toutes les tentatives de solution diplomatique ont échoué. Les Britanniques devront apprendre à leurs dépens que toute ingérence dans les affaires d'autres nations a des conséquences."
 USA_50s_The_Twilight_of_the_Old_Order_desc:0 "§RLe monde n’a pas besoin de rois et d’empereurs.§"
 USA_50s_Support_the_Tripartite_Alliance_desc:0 "Nasser n'est pas communiste, mais sa rhétorique panarabiste incendiaire constitue une menace pour nos intérêts au Moyen-Orient. Nous devons tout mettre en œuvre pour contenir sa révolution."
 USA_50s_Veto_UN_Measures_desc:0 "Toute victoire autre qu'une victoire totale dans le canal de Suez est inacceptable. Nous ne laisserons pas les Nations Unies nous en empêcher."
 USA_50s_Indirect_Involvement_desc:0 "Il n'est pas nécessaire que le sang américain souille le sol égyptien. La victoire peut être obtenue par une implication indirecte."
 USA_50s_Discount_Weapon_Sales_desc:0 "L’Alliance aura besoin d’armes pour gagner à Suez, des armes que nous pourrons vendre à un prix raisonnable."
 USA_50s_Increase_Diplomatic_Coordination_desc:0 "Une communication constante est la clé du succès. Nous faciliterons la coordination de toutes les opérations entre les membres de l'Alliance."
 USA_50s_Abstain_in_the_UNSC_desc:0 "Ce qui se passe en Égypte ne nous concerne pas. Quelle que soit la décision de l'ONU concernant le canal de Suez, nous ne nous y opposerons pas."
 USA_50s_Force_a_Peace_desc:0 ""
 USA_50s_Leave_it_Be_desc:0 ""
 USA_50s_The_Chinese_Civil_War_desc:0 "Après la Seconde Guerre mondiale, l'alliance marginale entre nationalistes et communistes s'est effondrée, provoquant la reprise de la guerre civile. Nous devons désormais choisir notre politique face à cette situation."
 USA_50s_Partial_Support_for_KMT_desc:0 "Sans victoire en vue, mais pour atténuer la réaction de nombreux membres du lobby chinois, nous avons continué à apporter un soutien mineur au régime nationaliste en Chine, nous continuerons à leur accorder des prêts pour le moment."
 USA_50s_the_tides_of_war_turns_desc:0 "Par une manœuvre surprenante des nationalistes, leurs forces ont repoussé les communistes à la bataille de Shanghai, stoppant ainsi totalement leur avancée. Cela pourrait nous permettre d'apporter un soutien massif à la République de Chine."
 USA_50s_China_White_Paper_desc:0 ""
 USA_50s_Direct_Involvement_desc:0 "La seule façon d’arrêter la menace rouge chinoise est de nous impliquer directement dans la guerre, soit en envoyant des conseillers et des armes, soit même en envoyant directement des hommes au combat."
 USA_50s_military_mission_to_china_desc:0 "En envoyant des conseillers militaires, nous pouvons aider les forces nationalistes à combattre plus efficacement."
 USA_50s_Recruit_Volunteers_desc:0 "Au lieu de simples conseillers, nous avons besoin d'une action directe. Nous devons recruter des volontaires désireux de lutter contre la menace rouge."
 USA_50s_Bring_the_Issue_to_the_United_Nations_desc:0 "S'impliquer directement dans la guerre civile sera coûteux, mais ne rien faire garantira assurément la victoire communiste. Nous solliciterons plutôt l'intervention des Nations Unies et espérerons que l'aide internationale mènera la République à la victoire."
 USA_50s_Call_for_Western_Military_Intervention_desc:0 "Les nationalistes ne peuvent vaincre Mao à eux seuls. Nous devons rallier à leur cause le plus grand nombre de nations possible."
 USA_50s_A_UN_Police_Action_chi_desc:0 "Les rebelles communistes ne sont rien d’autre que des criminels, une action policière rapide et efficace des Nations Unies les réduira à néant."
 USA_50s_sway_western_powers_to_support_the_KMT_desc:0 "La guerre civile a causé des effusions de sang inimaginables. Nous ferons tout notre possible pour les civils pris entre deux feux."
 USA_50s_fund_the_nationalists_desc:0 "Il est temps de tenir notre promesse de défendre les nations libres du monde. Aucun drapeau rouge ne flottera jamais sur la Chine !"
 USA_50s_bomb_PLA_key_industries_desc:0 "Nous déploierons des bombardiers pour bombarder les industries communistes, de cette façon nous pourrons détruire leur production de guerre et donner au KMT un levier sur les communistes."
 USA_50s_Ramp_Up_Equipment_Deliveries_desc:0 "Les nationalistes ont besoin de plus d'armes et de matériel pour vaincre les communistes. Augmentons nos envois."
 USA_50s_Leave_it_to_Fate_desc:0 "Nous ne pouvons pas toujours être là pour protéger les Chinois de toutes les menaces qui pèsent sur eux. La République doit apprendre à se défendre seule si elle veut survivre, et la lutte contre le communisme est l'occasion idéale d'y parvenir."
 USA_50s_The_Fate_of_Mainland_China_desc:0 "La guerre civile chinoise ne connaîtra pas d'impasse. Soit la République triomphera, soit elle sera anéantie par la horde communiste."
 USA_50s_The_Kuomintang_Hold_On_desc:0 "Grâce à une contre-offensive spectaculaire, les nationalistes ont réussi à repousser l'APL. Le continent a été en grande partie protégé des rebelles communistes ; la République doit maintenant se reconstruire et se réformer pour préserver cet état de choses. Peut-être faudrait-il investir ?"
 USA_50s_Send_Reconstruction_Funds_desc:0 "La majeure partie de la Chine est en ruines après la guerre civile. Nous l'aiderons à se reconstruire, comme nous l'avons fait en Europe après la guerre."
 USA_50s_Encourage_American_Corporate_Investment_desc:0 "Permettre à certaines de nos entreprises de s’implanter en Chine contribuera à l’effort de reconstruction et ouvrira les portes d’un marché de consommation massif."
 USA_50s_Reaffirm_US_Chinese_Relations_desc:0 "Ce n'est pas parce que la guerre est terminée que le communisme ne représente plus une menace. Nous devons assurer la République que l'Amérique est prête à défendre ses alliés contre la Menace Rouge."
 USA_50s_Denounce_Communism_in_Asia_desc:0 "Le communisme s'est malheureusement avéré populaire en Asie. Nous devons assurer les nations non communistes du continent que nous sommes prêts à les aider à se défendre contre cette menace."
 USA_50s_Reaffirm_Local_Alliances_desc:0 "Les États-Unis ont de nombreux alliés dans le monde et nous nous engageons à les défendre contre tous les ennemis, communistes ou autres."
 USA_50s_Establish_SEATO_desc:0 "L'Organisation du Traité de l'Asie du Sud-Est sera notre réponse à la multiplication des États communistes en Asie. À l'instar de son homologue nord-atlantique, ses membres s'engageront à se défendre mutuellement contre les agresseurs communistes."
 USA_50s_The_Korean_War_desc:0 "La guerre a éclaté en Corée ! Les forces communistes nord-coréennes ont lancé une invasion au Sud, et si nous n'intervenons pas, il est probable que toute la péninsule tombera aux mains du communisme. Nous ne pouvons pas laisser cela se produire."
 USA_50s_A_UN_Police_Action_desc:0 "Les Nations Unies doivent intervenir dans la guerre."
 USA_50s_The_Korean_War_Draft_desc:0 "Nous avons besoin de davantage d'hommes pour soutenir nos efforts de guerre en Corée. Avec la révision de la loi Elston, l'âge d'incorporation sera abaissé à 18 ans et demi et la durée du service actif prolongée à 24 mois."
 USA_50s_Economic_Aid_for_South_Korea_desc:0 "Sans une économie forte, le Sud s’effondrera rapidement."
 USA_50s_Reform_The_South_Korean_Army_desc:0 "L'armée sud-coréenne est désorganisée, inefficace et sous-équipée. Elle ne gagnera jamais cette guerre si nous ne lui montrons pas comment faire."
 USA_50s_Approaching_a_Conclusion_desc:0 "La guerre de Corée a assez duré. Il est temps de déterminer si une victoire totale est envisageable ou s'il est temps de négocier la paix."
 USA_50s_No_Surrender_desc:0 "Un seul pays qui succombe au communisme menace le monde libre tout entier. Nous ne pouvons tout simplement pas tolérer la persistance de la Corée du Nord."
 USA_50s_Push_into_Manchuria_desc:0 "Le mépris flagrant de la Chine pour la souveraineté coréenne ne peut rester impuni. S'ils veulent la guerre, l'Amérique la leur donnera."
 USA_50s_Attempt_Negotiations_desc:0 "Nous sommes dans une impasse. Le front a à peine bougé, et rien ne laisse présager un changement. Il semble que la Corée restera divisée tant que le Nord acceptera un cessez-le-feu."
 USA_50s_Fortify_the_Line_of_Control_desc:0 "La facilité avec laquelle l'Armée populaire coréenne a écrasé la Corée du Sud a failli mettre fin à la guerre avant même qu'elle ne commence. La frontière sud-coréenne doit être transformée en un bouclier impénétrable."
 USA_50s_Threaten_the_Chinese_desc:0 "Nous étions sur le point de remporter la victoire contre la Corée du Nord jusqu'à ce que les communistes chinois interviennent en leur faveur. Nous leur donnerons une chance de battre en retraite et leur ferons comprendre clairement que tout refus entraînera de graves conséquences."
 USA_50s_Back_Down_desc:0 "Les Chinois ont pris notre bluff au sérieux et refusent de reculer. Nous ne pouvons sérieusement pas mettre en œuvre le plan de MacArthur ; nous n'avons d'autre choix que de reculer."
 USA_50s_Back_Down_HUN_desc:0 "Les Soviétiques ont ignoré nos avertissements. La Hongrie mérite-t-elle vraiment une Troisième Guerre mondiale ?"
 USA_50s_Chinese_Withdrawal_desc:0 "Les Chinois ont sagement décidé de quitter la Corée. Sans eux, les jours de la Corée du Nord sont comptés."
 USA_50s_A_Ceasefire_desc:0 "La guerre est finie. Même si ce n'est pas l'issue escomptée, nous avons au moins réussi à préserver la République."
 USA_50s_Halt_Financial_aid_desc:0 "Si le Royaume-Uni ne travaille pas avec nous, alors il ne mérite pas notre aide."
 USA_50s_The_Fall_of_the_Mainland_desc:0 "Les forces de Mao ont triomphé en Chine. Les nationalistes ont été contraints de se retirer du continent et de se réfugier sur la petite île de Taïwan. Nous devons tout mettre en œuvre pour défendre l'île contre les communistes."
 USA_50s_contact_sun_li_jen_desc:0 "Le général Sun Li-Jen, un éminent général ayant combattu pendant la Seconde Guerre mondiale sur le théâtre birman, a commencé à critiquer le leadership de Chiang. Nous le contacterons immédiatement pour organiser un coup d'État et renverser Chiang, puis le remplacer par le leadership de Sun Li-Jen. C'est seulement alors que nous pourrons garantir la protection des intérêts américains à Taïwan."
 USA_50s_keep_support_for_chiang_desc:0 "Il est clair que les communistes ne sont pas disposés à cesser les hostilités avec nous, nous allons détourner notre soutien vers les restes nationalistes à Taiwan sous Chiang Kai-Shek, Taiwan restera le dernier rempart contre la Chine communiste."
 USA_50s_Fortify_Taiwan_desc:0 "Même si la guerre est peut-être terminée pour l'instant, il est fort probable que les communistes tentent également de s'emparer de Taïwan. Pour les en dissuader, nous devrions aider les nationalistes à fortifier l'île."
 USA_50s_The_Formosa_Resolution_desc:0 "Mao a clairement indiqué son intention de s'emparer de Taïwan par la force. Nous nous engageons à défendre leur intégrité territoriale contre toute attaque des communistes."
 USA_50s_Military_and_Economic_Assistance_for_Taiwan_desc:0 "Taïwan ne survivra pas longtemps sans aide économique et militaire. Nous aiderons le KMT à industrialiser l'île et à moderniser son économie."
 USA_50s_cooperate_with_nanjing_desc:0 "Avec la victoire de la guerre civile chinoise, nous continuerons à coopérer avec les nationalistes de Nanjing et à les aider à se remettre des années de dévastation qu’ils ont endurées."
 USA_50s_rise_of_the_china_lobby_desc:0 "L'essor des relations sino-américaines s'accompagne d'une influence croissante du lobby chinois. Ce lobby est composé de partisans du Kuomintang, pour la plupart de riches hommes d'affaires ou de politiciens ayant des liens directs avec la famille Chiang. L'amitié sino-américaine se fera au prix d'une sympathie croissante pour le régime du Kuomintang."
 USA_50s_joint_sino_american_military_trainings_desc:0 "Nous participerons à des entraînements militaires aux côtés des Chinois afin d'être prêts à combattre la sphère soviétique en Asie en cas de guerre mondiale. Nous ne pourrons jamais garantir une paix totale tant que le communisme n'aura pas été éliminé à l'échelle mondiale."
 USA_50s_propose_chinese_Membership_into_SEATO_desc:0 "Avec la création de l'OTASE, nous inviterons la République de Chine à rejoindre l'alliance. Bien que n'appartenant pas à la région de l'Asie du Sud-Est, elle partage un intérêt pour cette région avec l'Australie et la France. L'adhésion de la Chine à l'OTASE renforce la légitimité de l'alliance et contribue à endiguer efficacement le communisme dans la région."
 USA_50s_reconcile_with_the_KMT_desc:0 "Nous nous réconcilierons avec le régime du Kuomintang, que nous avons abandonné au milieu de la guerre civile chinoise. Nous les récompenserons par une aide et un soutien massifs à la relance économique afin qu'ils nous pardonnent et renouent des relations amicales."
 USA_50s_Abandon_South_Korea_desc:0 "Malgré tous nos efforts, la République de Corée est au bord de l'effondrement. Il est temps de regarder les choses en face, de limiter nos pertes et de rentrer chez nous."
 USA_50s_Accept_South_Korean_Refugees_desc:0 "Alors que la dictature communiste se profile à l'horizon, des milliers de Sud-Coréens fuient la péninsule tant qu'ils le peuvent encore. Nous en accueillerons autant que possible."
 USA_50s_A_New_Front_desc:0 "Les vestiges du KMT se sont repliés à Taïwan et en Birmanie. Nous appellerons chaque soldat du Kuomintang à participer à la guerre de Corée et à faire diversion contre l'APL en établissant de nouveaux fronts au Yunnan et ailleurs."
 USA_50s_Implement_MacArthurs_Proposal_desc:0 "§RBonne nuit, Monsieur le Président...§"
 USA_50s_A_Unified_Korea_desc:0 "L'Armée populaire de Corée (APC) a été détruite et la Corée est unie. Les Chinois n'ont d'autre choix que d'admettre leur défaite."
 USA_50s_Request_Ceasefire_desc:0 "Nous n'avons aucun moyen réaliste de faire reculer les Chinois. Tout ce que nous pouvons faire, c'est appeler à un cessez-le-feu et espérer des conditions de paix favorables."
 USA_50s_Nation_Building_in_Africa_desc:0 "À mesure que les Africains grandissent, leurs besoins augmentent. Nous serons présents à chaque étape du parcours, apportant notre aide du mieux que nous pouvons."
 USA_50s_Condemn_European_Influence_desc:0 "L’Afrique en a assez de l’Europe ; elle n’en a plus besoin."
 USA_50s_Focus_on_the_Stratofortress_desc:0 "Qui est l'imbécile qui a cru bon d'installer un réacteur nucléaire dans un avion ? Nous allons plutôt nous concentrer sur le développement et la production du B-52 de Boeing."
 USA_50s_Sidewinder_Missiles_desc:0 "Nous équiperons nos avions de missiles d'interception aérienne, augmentant considérablement leur capacité de combat."
 USA_50s_The_Super_Sabre_desc:0 "Une fois terminé, le Super Sabre sera le premier chasseur à réaction supersonique américain."
 USA_50s_The_Ultimate_Interceptor_desc:0 "Le F-108 Rapier défendra notre ciel contre les bombardiers supersoniques soviétiques. Bien que coûteux, ses capacités sont indéniables."
 USA_50s_The_Last_of_Pattons_Namesake_desc:0 "Le M60 sera le dernier char de la famille Patton. Nous veillerons à ce que ce vieux char disparaisse en beauté."
 USA_50s_Bring_Strategic_Nuclear_Capability_to_the_Fleet_desc:0 "La seule façon de gagner la Guerre froide est de disposer de capacités nucléaires supérieures à celles de notre ennemi. Tout comme l'armée de l'air, la marine sera un élément clé de notre stratégie nucléaire."
 USA_50s_Supersonic_Strategic_Bombers_desc:0 "La vitesse de nos chasseurs est vraiment impressionnante, mais nous ne pouvons pas négliger nos bombardiers. Nous devons en concevoir un capable d'atteindre une vitesse supersonique tout en étant capable d'emporter une lourde charge utile."
 USA_50s_A_Partner_for_Valkyrie_desc:0 "Le Rapier s'avère beaucoup trop coûteux. Le Thunderchief, un chasseur-bombardier supersonique conçu par Republic Aviation, semble bien plus prometteur."
 USA_50s_The_Domestic_Front_desc:0 "Opérations à mener à l'intérieur de notre pays."
 USA_50s_Launch_Operation_Mockingbird_desc:0 "§RTop Secret§"
 USA_50s_Begin_Project_MUKULTRA_desc:0 "§RTop Secret§"
 USA_50s_The_Indonesia_Desk_desc:0 "§RTop Secret§ : Opérations liées à l’Indonésie."
 USA_50s_The_Sumatran_Revolt_desc:0 "Une révolte a éclaté à Sumatra ! Nous devons les aider à renverser le gouvernement socialiste de Sukarno !"
 USA_50s_Condemn_Indonesian_Treatment_of_Sumatrans_desc:0 "Sukarno a détruit la vie d’innombrables Sumatrais ; le monde entier doit le savoir."
 USA_50s_Back_Indonesian_Revolutionaries_desc:0 "Nous devons aider les rebelles dans leur lutte contre l’oppression du gouvernement."
 USA_50s_Discreet_Civilian_Bombing_Campaign_desc:0 "Nous avons nos cibles, sommes-nous autorisés à décoller ?"
 USA_50s_Involvement_Hidden_desc:0 "La campagne a été un succès, et le monde n’en est pas plus avancé."
 USA_50s_Raise_Humanitarian_Concers_desc:0 "Nous ne pouvons pas permettre que les actions barbares de l’Indonésie continuent, tout le monde doit aider le peuple de Sumatra."
 USA_50s_Exposed_desc:0 "§ROh-oh....§"
 USA_50s_Back_Away_desc:0 "Cela ne s'est pas passé comme prévu, il est temps de se retirer."
 USA_50s_Japan_Desk_desc:0 "§RTop Secret§ : Opérations liées au Japon."
 USA_50s_Fund_the_Liberal_Democrats_desc:0 "Nous soutiendrons les modérés japonais afin que leur succès contre les radicaux de gauche soit assuré."
 USA_50s_Indirect_Involvement_CIA_desc:0 "Il n'est pas encore nécessaire de mettre la main à la pâte. Voyons si une aide militaire indirecte peut faire pencher la balance en notre faveur."
 USA_50s_Air_Drop_Supplies_desc:0 "Comme c'est pratique, une cache d'armes et de munitions vient d'être déposée dans le camp des rebelles..."
 USA_50s_Instigate_a_Civil_War_desc:0 "Il est temps d’intensifier le conflit en Indonésie, seule la guerre civile permettra à l’Indonésie de devenir libre."
 USA_50s_Ad_the_Sumatran_Goverment_desc:0 "Les rebelles auront besoin de plus de matériel s'ils espèrent gagner la guerre, donnons-leur !"
 USA_50s_Promote_Left_Wing_Divisions_desc:0 "Diviser pour mieux régner. Sans un parti uni, le socialisme au Japon est quasiment mort."
 USA_50s_Direct_Intervention_desc:0 "Nous sommes restés sur la touche assez longtemps, il est temps d’aider les Indonésiens à se libérer."
 USA_50s_The_Albanian_Subversion_desc:0 "§RTop Secret§ : Opérations liées à l’Albanie."
 USA_50s_Contact_the_British_desc:0 "Si nous voulons aller de l’avant, nous devons sécuriser tous les renseignements britanniques sur cette affaire."
 USA_50s_Contact_Exiled_Royalists_desc:0 "Avec de nombreux royalistes éminents en exil, nous devrions les rechercher et les recruter pour nous aider."
 USA_50s_Train_Albanian_Emigres_desc:0 "Sans formation adéquate, les Pixies sont voués à l’échec."
 USA_50s_Establish_the_Free_Albania_National_Committee_desc:0 "Komiteti Kombëtar \"Shqipëria e Lirë\" est une organisation politique d'émigrés albanais d'après-guerre basés dans les pays occidentaux qui coopèrent avec les puissances occidentales pour renverser le régime communiste d'Enver Hoxha en Albanie."
 USA_50s_Listen_to_Zog_desc:0 "Même si le MI6 britannique nous a apporté une aide précieuse, il serait peut-être plus sage de faire confiance aux conseils albanais."
 USA_50s_Follow_British_Intelligence_desc:0 "En suivant les conseils donnés par le MI6, vos chances de succès sont augmentées."
 USA_50s_Albania_Subverted_desc:0 "Le gouvernement communiste en Albanie a été renversé !"
 USA_50s_Failure_of_the_Pixies_desc:0 "Nous n’avons pas réussi à renverser Hoxha, l’Albanie reste sous l’oppression communiste."
 USA_50s_Denounce_Communist_Albania_desc:0 "Il faut savoir que sous Enver Hoxha, l’Albanie ne sera jamais libre."
 USA_50s_Resettle_Albanian_Refugees_desc:0 "Nous veillerons à accorder l’asile à ceux qui auront la chance d’échapper au régime oppressif de Hoxha en Albanie."
 USA_50s_Establish_the_Assembly_of_Captive_European_Nations_desc:0 "L'ACEN sera composée de représentants des pays européens actuellement sous régime communiste. Leur objectif sera de montrer au monde ce qui se passe réellement derrière le rideau de fer et de promouvoir la coopération contre les gouvernements communistes."
 USA_50s_Haiti_Desk_desc:0 "§RTop Secret§ : Opérations liées à Haïti."
 USA_50s_Back_Papa_Doc_desc:0 "Nous fournirons à Haïti les outils nécessaires pour se défendre contre la révolution communiste. Un seul drapeau rouge dans les Caraïbes est inacceptable."
 USA_50s_Iran_Desk_desc:0 "§RTop Secret§ : Opérations liées à l’Iran."
 USA_50s_Work_with_MI6_desc:0 "La coopération avec le MI6 s’est avérée très bénéfique par le passé, et ce ne sera pas différent cette fois-ci."
 USA_50s_Operation_Ajax_desc:0 "Nos intérêts en Iran nécessitent le départ du Premier ministre Mohammad Mossadegh."
 USA_50s_A_Successful_Coup_desc:0 "Le coup d’État iranien a été un succès total !"
 USA_50s_Ajax_Fails_desc:0 "Le coup d’État iranien a échoué !"
 USA_50s_Object_to_Iranian_Oil_Nationalization_desc:0 "La nationalisation est le premier pas vers le communisme. Nous ne pouvons pas laisser les Soviétiques mettre la main sur le pétrole iranien."
 USA_50s_A_British_Counteroffer_desc:0 "Nous ne pouvons pas courir le risque d’un Iran rouge, et les Britanniques sont d’accord… mais la guerre en vaut-elle la peine ?"
 USA_50s_Stick_To_Diplomatic_Objections_desc:0 "La guerre en Iran n'est pas une option. Nous continuerons à émettre des objections diplomatiques."
 USA_50s_Ignore_MI6_desc:0 "La seule préoccupation des Britanniques en Iran est leur approvisionnement en pétrole bon marché. Nous ne nous mêlerons pas de cela."
 USA_50s_Condemn_British_Interference_in_Iranian_Domestic_Affairs_desc:0 "L’Iran est une nation souveraine avec un gouvernement démocratiquement élu, les Britanniques n’ont pas leur mot à dire dans leurs affaires."
 USA_50s_Invade_Iran_desc:0 "Il est temps d’apporter un peu de bonne vieille liberté américaine à l’Iran…"
 USA_50s_Radio_Free_Europe_desc:0 "Radio Free Europe diffusera la vérité sans filtre sur le communisme à ceux qui vivent en Europe."
 USA_50s_Expand_Western_Broadcasts_desc:0 "RFE ne se limite pas à l’Europe de l’Est, l’Occident doit également être informé de ce qui se passe et de la dangerosité du communisme."
 USA_50s_Promote_Pro_American_Parties_desc:0 "Les partis communistes existent au sein des nations libres d'Europe. En soutenant leurs rivaux, nous pouvons réduire leur influence."
 USA_50s_Increase_Eastern_European_Coverage_desc:0 "Bien que l'Europe de l'Est soit sous contrôle communiste, les citoyens ont droit à une information libre. Nous allons étendre nos diffusions afin que tous ceux qui vivent derrière le rideau de fer puissent nous entendre."
 USA_50s_Preach_Anti_Communist_Sentiment_desc:0 "Nous exhortons les peuples vivant sous la domination soviétique à regarder derrière le masque, à voir ce qu’ils ont réellement fait à leur peuple."
 USA_50s_Operation_Gladio_desc:0 "Si les Soviétiques envahissent un jour le reste de l'Europe, il est probable que nous devrons organiser des mouvements de résistance dans les pays occupés. L'opération Gladio formera nos agents et nos alliés à cette tâche."
 USA_50s_Vietnam_Desk_desc:0 "§RTop Secret§ : Opérations liées au Vietnam."
 USA_50s_Stand_with_South_Vietnam_desc:0 "La République du Vietnam est résolument anticommuniste, un allié naturel en Indochine."
 USA_50s_Allow_Unification_Elections_desc:0 "Nous avons décidé d'autoriser les élections d'unification au Vietnam, la question est : devons-nous intervenir dans ces élections ?"
 USA_50s_Allow_Fair_Elections_desc:0 "Il n’est pas nécessaire d’intervenir dans les élections, laissez-les se dérouler."
 USA_50s_Rig_the_Election_desc:0 "Nous ne pouvons pas risquer l'unification du Vietnam sous le communisme. Le référendum ne doit pas avoir lieu."
 USA_50s_Block_Unification_Elections_desc:0 "Les élections pour l'unification ne sont qu'un stratagème pour unifier le pays sous le communisme. Nous ne le permettrons pas."
 USA_50s_Stir_Unrest_Among_Catholic_North_Vietnamese_desc:0 "Le communisme a toujours été opposé à la religion. Nous pouvons utiliser cette position pour attiser la dissidence au sein des communautés religieuses du Nord-Vietnam."
 USA_50s_Launch_Operation_Passage_to_Freedom_desc:0 "Des milliers de soldats et de civils non communistes sont bloqués au Nord-Vietnam. Si nous parvenons à les transférer au Sud-Vietnam, ils pourront contribuer à la lutte contre Hô Chi Minh."
 USA_50s_Guatamal_Desk_desc:0 "§RTop Secret§ : Opérations liées au Guatemala."
 USA_50s_Operation_PBSUCCESS_desc:0 "Réforme agraire ? Cela ressemble au communisme, à nos yeux !"
 USA_50s_Coup_Succeeds_desc:0 "Il n’y aura pas de communisme en Amérique centrale sous notre surveillance !"
 USA_50s_Failed_Operation_desc:0 "Le coup d'État d'Armas a échoué ! Que faire maintenant ?"
 USA_50s_The_Failure_of_the_Monroe_Doctrine_desc:0 "Nous n'avons d'autre choix que d'admettre notre échec. L'Amérique est aux Américains, mais le Guatemala est aux communistes."
 USA_50s_Falsify_Intelligence_desc:0 "Nous n'abandonnerons pas si facilement, nos gars de la CIA trouveront une raison valable pour une intervention au Guatemala."
 USA_50s_Invade_Guatamala_desc:0 "Les preuves sont irréfutables : le Guatemala n’est qu’une marionnette soviétique ! Pas de problème, cela sera bientôt rectifié…"
 USA_50s_Farouk_Agrees_to_Reforms_desc:0 "Le roi Farouk a accepté de réformer !"
 USA_50s_Embolden_the_Free_Officers_desc:0 "Farouk a atteint ses limites. Il faudra peut-être envisager d'autres options…"
 USA_50s_Keep_Pressuring_Farouk_desc:0 "Les réformes ne vont pas assez loin ! Il faut maintenir la pression sur le roi."
 USA_50s_Farouk_Refuses_Pressure_desc:0 "Le roi Farouk refuse de se réformer !"
 USA_50s_Support_the_Free_Officers_desc:0 "Si le roi ne nous écoute pas, peut-être aurons-nous plus de chance avec son successeur !"
 USA_50s_A_Failed_Revolution_desc:0 "Les Officiers Libres n’ont pas réussi à renverser Farouk !"
 USA_50s_Falsify_Intelligence_on_Farouk_desc:0 "Le roi Farouk représente un danger pour le peuple égyptien et pour tous ceux qui l'entourent. Il doit partir."
 USA_50s_Support_Anti_Egyptian_Nations_desc:0 "Les voisins de l'Egypte sont en danger avec Farouk au pouvoir, nous les armerons de beaucoup de matériel pour le dissuader."
 USA_50s_The_Egyptian_Revolution_desc:0 "Les Officiers Libres ont réussi à renverser Farouk !"
 USA_50s_Support_the_New_Regime_desc:0 "Le nouveau gouvernement égyptien est un allié potentiel. Une généreuse livraison d'armes pourrait ouvrir la voie à une future coopération."
 USA_50s_Syria_Desk_desc:0 "§RTop Secret§ : Opérations liées à la Syrie."
 USA_50s_Operation_Straggle_desc:0 "§RTop Secret§"
 USA_50s_Abandon_the_Coup_desc:0 "Sur les recommandations faites par John Foster Dulles, Allen Dulles et Michail Bey Ilyan, l'opération Straggle sera abandonnée car irréalisable."
 USA_50s_A_Worthy_Risk_desc:0 "Malgré les inquiétudes, nous allons poursuivre l’opération."
 USA_50s_Colonel_Kabbanis_Coup_desc:0 "Le colonel Kabbani a réussi son coup d’État !"
 USA_50s_Solidify_the_New_Regime_desc:0 "Kabbani aura besoin d’armes pour maintenir l’ordre en Syrie, donnons-les-lui."
 USA_50s_Establish_Formal_Ties_with_the_Kabbani_Regime_desc:0 "Le régime est stable et la situation s'est apaisée. Il est temps de reconnaître officiellement le gouvernement de Kabbani."
 USA_50s_Another_Failed_Coup_desc:0 "Le coup d'État a échoué..."
 USA_50s_Abandon_Syrian_Plans_desc:0 "Nous avons gaspillé suffisamment de temps et de ressources dans ce désordre."
 USA_50s_Flex_Naval_Might_desc:0 "Mener des exercices navals près de l’Indonésie leur rappellera à qui ils ont affaire."
 USA_50s_Escalate_the_Conflict_desc:0 "L'Indonésie est sur le point de nous entraîner dans sa guerre. Assurez-vous qu'elle le comprenne."
 USA_50s_The_Indonesian_Civil_War_desc:0 "Une guerre civile généralisée a éclaté en Indonésie. Il est temps d'évaluer nos options."
 USA_50s_Partition_inondesia_desc:0 "L’Indonésie est trop grande et diversifiée pour son propre bien, une partition serait la meilleure solution."
 USA_50s_Solidfy_Colonel_Husseins_Regime_desc:0 "Il n’est pas nécessaire de découper l’Indonésie, le colonel Hussein fera du bon travail en tant que nouveau président !"
 USA_50s_The_Return_of_the_King_desc:0 "Le roi Zog n'a perdu son trône qu'à cause de Mussolini. Nous le rétablirons comme régent afin qu'il puisse rétablir l'ordre et unifier le peuple albanais."
 USA_50s_Invite_Albania_to_Join_NATO_desc:0 "Maintenant que l'Albanie est libre, nous allons l'inviter à rejoindre l'OTAN afin de dissuader toute agression de la part de ses voisins communistes."
 USA_50s_Solidify_Pahlavi_Rule_desc:0 "Le règne du Shah sur l'Iran sera consolidé. Sous son règne, l'Iran prospérera."
 USA_50s_Secure_Iran_in_the_Western_Sphere_desc:0 "Le Shah est un allié majeur de l’Occident, nous lui fournirons tout ce dont il a besoin pour maintenir l’ordre."
 USA_50s_Empower_the_Armas_Regime_desc:0 "Le régime de Carlos Castillo Armas doit être sécurisé, et rien ne sécurise mieux un régime qu’un tas d’armes."
 USA_50s_Invade_Egypt_desc:0 "À bas le roi !"
 USA_50s_Operation_Wappen_desc:0 "Kermit Roosevelt a organisé un nouveau coup d'État en Syrie. Peut-être celui-ci aura-t-il plus de chances de réussir ?"
 USA_50s_No_Price_Too_High_desc:0 "Combien vaut votre loyauté, Général ?"
 USA_50s_Generals_Agree_desc:0 "Il semble que l’argent puisse également déplacer les montagnes syriennes."
 USA_50s_The_Generals_Coup_desc:0 "Nos généraux alliés ont réussi leur coup d’État, cela valait chaque centime !"
 USA_50s_Recognize_the_New_Regime_desc:0 "Maintenant que la poussière est retombée, nous allons reconnaître officiellement le nouveau régime en Syrie."
 USA_50s_Generals_Reject_Bribes_desc:0 "Leur loyauté serait louable... si elle ne mettait pas la Syrie en danger d’une prise de pouvoir communiste !"
 USA_50s_Cut_Diplomatic_Ties_desc:0 "Tant que la situation en Syrie ne sera pas résolue, nous n’aurons rien à dire."
 USA_50s_Increase_Arms_Shipments_to_Turkey_and_Iraq_desc:0 "La seule option qui reste en Syrie est une intervention militaire. Si nous parvenons à rallier l'Irak et la Turquie à notre cause, les choses se dérouleront beaucoup mieux."
 USA_50s_Invade_Syria_desc:0 "Nous ne laisserons pas la Syrie sombrer dans le rouge ! Nous n'avons d'autre choix que de l'envahir !"
 USA_50s_Establish_A_Pro_Western_Regime_desc:0 "La guerre est finie, la Syrie est libérée ! Un gouvernement pro-occidental sera installé pour rétablir l'ordre dans le pays et le défendre contre le communisme au Moyen-Orient."
 USA_50s_Back_Down_CIA_desc:0 "Nos opérations en Syrie ont de meilleures chances de succès si nous parvenons à rallier nos alliés. Nous allons reculer pour le moment."
 USA_50s_Contact_Iraq_desc:0 "La perspective de restaurer le pouvoir hachémite sur la Syrie devrait suffire à rallier les Irakiens à notre cause."
 USA_50s_Contact_Turkey_desc:0 "La Turquie revendique historiquement les provinces du nord de la Syrie. Nous lui ferons savoir que ses revendications pourraient se concrétiser si elle nous aide."
 USA_50s_Diplomatic_Refusals_desc:0 "Personne ne veut nous aider contre la Syrie..."
 USA_50s_Abadon_Syrian_Schemes_desc:0 "C'est fini, on a tout essayé et on n'a rien trouvé. Il est temps de passer à autre chose."
 USA_50s_Arm_Paramilitaries_desc:0 "Certains groupes en Syrie sont mécontents du régime actuel. Donnons-leur un petit coup de pouce."
 USA_50s_Launch_False_Flag_Assasinations_desc:0 "C'est scandaleux ! Les États-Unis ne toléreront pas le terrorisme barbare !"
 USA_50s_Destablize_the_Regime_desc:0 "Le peuple syrien doit être amené à prendre conscience des méfaits de son gouvernement !"
 USA_50s_Support_the_Iraqi_Advance_desc:0 "En route vers la Syrie !"
 USA_50s_Secure_Hashemite_Rule_desc:0 "Le régime pro-soviétique est tombé, la Syrie est de retour aux mains anticommunistes des Hachémites !"
 USA_50s_Ferment_Unrest_in_Northern_Syria_desc:0 "Les habitants du nord de la Syrie prospéreraient grandement sous la domination turque, nous leur ferons comprendre cela."
 USA_50s_sway_western_powers_to_support_the_KMT_CIA_desc:0 "La Turquie a besoin de toute l’aide possible pour faire face aux réfugiés syriens."
 USA_50s_Increase_Turkish_Arms_Shipments_desc:0 "Pour augmenter leurs chances de succès, nous enverrons à la Turquie des armes supplémentaires."
 USA_50s_Endorse_the_Turkish_Intervention_desc:0 "La Turquie veille simplement à ce que la Syrie ne tombe pas sous la dictature communiste, elle a tout notre soutien !"
 USA_50s_Recogize_Turkish_Territorial_Gains_desc:0 "Comme promis, nous reconnaîtrons officiellement les revendications historiques de la Turquie sur le nord de la Syrie et autoriserons leur annexion."
 USA_50s_Falsify_Intelligence_syr_desc:0 "Nous montrerons à nos alliés des preuves irréfutables des complots soviétiques en Syrie et dans le reste du Moyen-Orient ! Bien sûr que c'est vrai, ça vient de la CIA !"
 USA_50s_Launch_Multi_National_Invasion_of_Syria_desc:0 "Avec le soutien de nos alliés, l’invasion est assurée de réussir !"
 Operation_Gladio:0 "Opération Gladio"
 operation_wetback.1.d:0 "Pendant plusieurs mois, l'ancien général et commissaire du Service de l'Immigration et de la Naturalisation (INS), Joseph Swing, a milité en faveur de mesures importantes pour freiner le taux de traversées illégales de la frontière en provenance du Mexique. Les appels à un renforcement plus strict de la sécurité des frontières ont été largement soutenus au niveau national par les agriculteurs américains et les intérêts commerciaux, qui se sont plaints des impacts économiques liés aux immigrants illégaux. Il convient de noter que le gouvernement mexicain a également exhorté notre gouvernement à limiter l'entrée illégale des travailleurs mexicains dans notre pays en raison des impacts économiques sur le Mexique. Après que des actions plus drastiques aient été rejetées, Swing propose désormais un nouveau plan, intitulé Opération Wetback.\n\nL'Opération Wetback viserait à purger le Sud-Ouest des États-Unis des travailleurs illégaux par le biais de raids ciblés dans les zones agricoles de la région, en utilisant une force opérationnelle combinée d'entités des forces de l'ordre locales, d'État et fédérales. Toutefois, des critiques internes au projet ont émergé, soulevant des préoccupations concernant la possibilité de déportations accidentelles de citoyens américains et des perturbations de l'approvisionnement alimentaire en raison de la dépendance à la main-d'œuvre bon marché des travailleurs mexicains. Comment devrions-nous procéder ?"