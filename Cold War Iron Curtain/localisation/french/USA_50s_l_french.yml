 USA_50s_Update_the_M103:0 "Améliorer le M103"
 USA_50s_The_Navys_19th_Decade:0 "La XIXe décennie de la Marine"
 USA_50s_The_Navys_19th_Decade_desc:0 "Après la Seconde Guerre mondiale, la marine américaine est devenue la force de surface et sous-marine la plus puissante au monde. Mais de nouvelles menaces défiant cette puissance pourraient se profiler à l'horizon."
 USA_50s_Jets_For_The_Fleet:0 "Des avions pour la flotte"
 USA_50s_Jets_For_The_Fleet_desc:0 "Nos escadrons de chasse de la marine américaine dépendent encore fortement des avions à hélices. Pour faire face aux défis de la guerre froide, nous devons les remplacer par des jets modernes."
 USA_50s_Nuclear_Depth_Charges:0 "Charges de profondeur nucléaires"
 USA_50s_Focus_on_Sub_Detection:0 "Se concentrer sur la détection de sous-marins"
 USA_50s_Focus_on_Sub_Detection_desc:0 "Les premiers rapports suggèrent que les Soviétiques prévoient de construire des sous-marins par centaines. Ils savent qu'ils ne peuvent pas égaler la puissance de notre flotte de surface, c'est pourquoi nous devons être toujours vigilants face à la menace sous-marine posée par les sous-marins."
 USA_50s_The_Supercarrier:0 "Le Super porte-avions"
 USA_50s_The_Supercarrier_desc:0 "Les porte-avions de la classe Forrestal étaient quatre porte-avions conçus et construits pour la Marine des États-Unis dans les années 1950.C'était la première classe de superporte-avions, combinant un tonnage élevé, des ascenseurs en bord de pont et un pont incliné.Le premier navire a été mis en service en 1955, le dernier a été désarmé en 1998."
 USA_50s_Navalised_Helicoptors:0 "Hélicoptères navals"
 USA_50s_Navalised_Helicoptors_desc:0 "Les hélicoptères lancés depuis des destroyers peuvent accomplir leur mission anti-sous-marine avec brio. Si la guerre froide venait à s'intensifier, nous devrions maintenir les voies maritimes ouvertes pour envoyer des renforts où cela serait nécessaire."
 USA_50s_Improve_Naval_Illuminator_Radar:0 "Améliorer le radar d'illuminateur naval"
 USA_50s_Charles_F_Adams_Class_DDG:0 "Classe DDG Charles F. Adams"
 USA_50s_Charles_F_Adams_Class_DDG_desc:0 "La classe Charles F. Adams est une classe de 29 destroyers lance-missiles (DDG) construits entre 1958 et 1967.Vingt-trois destroyers ont été construits pour la Marine des États-Unis, trois pour la Marine royale australienne, et trois pour la Bundesmarine ouest-allemande.La conception de ces navires était basée sur celle des destroyers de la classe Forrest Sherman, mais la classe Charles F. Adams était la première classe conçue pour servir de destroyers lance-missiles."
 USA_50s_The_Post_War_Airforce:0 "L'Armée de l'air d'après-guerre"
 USA_50s_The_Post_War_Airforce_desc:0 "L'USAF a été établie en tant que branche distincte des forces armées américaines le 18 septembre 1947.L'USAF est désormais chargée de livrer la plupart de l'arsenal nucléaire de la nation, il sera donc crucial pour nous de garder une avance constante sur les Soviétiques."
