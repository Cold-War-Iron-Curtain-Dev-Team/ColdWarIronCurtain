USA_50s_The_Big_Stick_desc:0 "Les missiles de croisière sont rapides et précis, exactement ce dont nous avons besoin pour décimer l'ennemi avant qu'il n'ait une chance de nous frapper."
USA_50s_IRBM_Focus_desc:0 "Les IRBM nous donnent la possibilité de décapiter l'ennemi à une distance confortable. Plus nous en avons, mieux c'est."
USA_50s_The_M14_desc:0 "Alors que le M1 Garand commence à montrer son âge, il faut développer une nouvelle arme pour les nouvelles guerres de la Guerre froide."
USA_50s_The_M40_Sniper_Rifle_desc:0 "Donnez un M40 à un Marine et les communistes ne sauront jamais ce qui les a frappés."
USA_50s_Improve_Special_Forces_Training_desc:0 "Le communisme se répand partout dans le monde ; nos forces spéciales doivent apprendre à combattre dans tous les environnements possibles."
USA_50s_LVTP_5_for_the_USMC_desc:0 "Le LVTP-4 nous a bien servi mais commence à montrer son âge. Nous devrions accélérer le développement de son successeur."
USA_50s_Focus_on_Ultralight_Weight_Tank_Destroyers_desc:0 "Le Scorpion est peut-être léger, mais il est certainement rapide. Nous devrions augmenter leur production."
USA_50s_Focus_on_Lightweight_Tanks_desc:0 "Les garçons de Cadillac ont travaillé dur pour créer des modèles destinés à remplacer l'ancien M24. Voyons si nous ne pouvons pas leur donner un petit coup de pouce."
USA_50s_Update_the_M103_desc:0 "Les chars lourds des communistes sont impressionnants, il vaudrait mieux trouver quelque chose d'encore plus fort."
USA_50s_Nuclear_Depth_Charges_desc:0 "Pourquoi devrions-nous limiter l'utilisation des armes nucléaires aux seuls missiles ? Voyons voir ces sous-marins soviétiques survivre à ça !"
USA_50s_Improve_Naval_Illuminator_Radar_desc:0 "Le radar de contrôle de tir est un élément clé d'un navire moderne, nous ferions mieux de nous assurer que nous disposons des dernières avancées technologiques."
USA_50s_Persue_Nuclear_Aircraft_desc:0 "Si nous parvenons à perfectionner les avions à propulsion nucléaire, nous pourrons économiser le carburant et parvenir à une plus grande dissuasion."
USA_50s_The_French_Indochina_War_desc:0 "Après la Seconde Guerre mondiale, les Vietnamiens espéraient devenir indépendants. Au lieu de cela, les Français ont réoccupé le territoire, obligeant le Viet Minh à lancer une guerre pour libérer leur pays. Alors que la guerre fait rage, nous devons décider comment soutenir nos alliés français."
USA_50s_Unconventional_Approach_desc:0 "Le conflit en cours en Indochine est une guerre de libération contre le colonialisme français. Il est plus sage pour nous d'envisager des solutions « non conventionnelles » pour stabiliser la région en concluant des accords avec les indigènes."
USA_50s_Sponser_CuongDe_Coup_desc:0 "Les scandales répétés et les actions incompétentes de Bao-Dai ne sont pas acceptables, il est peut-être temps pour nous de soutenir les tentatives de Cuong-De."
USA_50s_Stabilize_DanQuoc_Regime_desc:0 "Le régime Dan-Quoc de Cuong-De en est encore à ses balbutiements. Par conséquent, envoyer un soutien matériel et économique le stabiliserait grandement face à la menace communiste persistante !"
USA_50s_Befriend_Minh_desc:0 "Il n'était pas sage pour notre gouvernement d'ignorer constamment l'amitié d'Oncle Ho. Nous devrions donc coopérer avec son régime populaire au lieu de soutenir le régime colonial brutal de la France."
USA_50s_Reestablish_Deer_Team_desc:0 "L'équipe Deer a pu former et aider à se lier d'amitié avec Oncle Ho et le Viet Minh en 1945, et il est donc bénéfique pour nous de les renvoyer pour réaligner la vision d'Oncle Ho et défendre nos valeurs démocratiques."
USA_50s_Support_French_Allies_desc:0 "Les Français ont toujours été nos plus proches alliés depuis notre indépendance et notre guerre révolutionnaire contre les Britanniques en 1776. Rendons-les en retour en soutenant leur emprise sur l'Indochine contre la menace rouge !"
USA_50s_Diplomatic_Assurances_to_France_desc:0 "Nous assurons aux Français que nous soutenons leurs efforts diplomatiquement, peut-être même, à terme, pour mettre fin à la guerre de manière pacifique."
USA_50s_VietMinh_Negotiating_desc:0 "Hô Chi Minh est un dirigeant pragmatique qui recherche les meilleurs intérêts de son peuple plutôt que de servir une quelconque loyauté envers Moscou. Nous devrions donc négocier directement avec lui pour rechercher une solution pacifique en Indochine."
USA_50s_Bring_the_French_to_the_Negotiating_Table_desc:0 "La guerre en Indochine continue de faire rage sans qu'on puisse en voir la fin. Nous devrions essayer d'amener les Français à la table des négociations avec le Viet Minh."
USA_50s_The_Geneva_Conferece_desc:0 "Des délégués du Vietnam, de la France, du Royaume-Uni, de l'Union soviétique et des États-Unis se réuniront à Genève pour discuter de la situation en Indochine."
USA_50s_Military_Aid_to_France_desc:0 "Il n'y a pas de négociation avec les communistes. La seule façon de résoudre la crise en Indochine est de vaincre le Viet Minh."
USA_50s_Send_Money_and_Guns_desc:0 "Rien ne tue mieux un communiste que le plomb chaud et l'acier. Nous équiperons les Français des outils nécessaires à la victoire."
USA_50s_Operation_Vulture_desc:0 "La France ne peut pas gagner cette guerre seule. Nous allons intervenir en leur faveur et mettre fin dès maintenant à la petite révolte d'Hô Chi Minh."
USA_50s_The_Fall_of_the_Viet_Minh_desc:0 "Les communistes ont été écrasés et l'ordre a été rétabli au Vietnam. Encore une victoire pour les gentils !"
USA_50s_Withhold_American_Assent_desc:0 "La délégation s'assiéra à la table, écoutera la rédaction de la clause électorale et refusera d'y mettre son nom. Nous ne sommes pas obligés de garantir un scrutin organisé dans des provinces où aucun vote contesté n'a jamais été autorisé, et nous le dirons assez clairement pour que personne ne puisse prétendre plus tard que nous étions d'accord.\n\nLes accords peuvent encore être signés autour de nous. Ce qui compte, c'est que lorsque viendra le temps d'organiser le vote, les États-Unis seront libres de dire qu'ils n'ont jamais été partie prenante de cette promesse."
USA_50s_Endorse_Free_Vietnamese_Vote_desc:0 "L'alternative est de prendre la clause au sérieux. Si la question vietnamienne doit être réglée, mieux vaut qu'elle soit réglée par des urnes sous supervision internationale plutôt que par des fusils dans le delta pendant les vingt prochaines années - et mieux encore si nos clients la contestent et gagnent.\n\nL'assentiment américain ne nous coûtera pas grand-chose à la table et permettra d'acquérir une bonne volonté considérable auprès des coprésidents. Cela signifiera aussi vivre avec le résultat."
USA_50s_The_All_Vietnam_Ballot_desc:0 "Les accords ont fixé une date pour un vote à l'échelle nationale, et cette date approche. D'ici là, le Vietnam sera un pays avec deux gouvernements, qui espèrent tous deux être encore en place une fois le décompte terminé.\n\nWashington a une décision à prendre et, contrairement aux négociations de Genève, celle-ci ne peut être réglée entre les seules grandes puissances. Quoi que nous décidions, c'est Saigon qui devra le dire à haute voix."
USA_50s_Reunification_Election_desc:0 "Nous dirons à Saigon que les États-Unis n'ont pas l'intention de faire obstacle au scrutin prévu par les accords. Ce n'est pas la même chose que de leur demander de le tenir.\n\nLe gouvernement de l'État du Vietnam a signé la clause électorale et en répondra dans sa propre capitale, devant ses propres ministres et ses propres généraux. Nous pouvons retirer notre objection ; nous ne pouvons pas prendre la décision à leur place, et ils pourraient encore enterrer le vote sans nous."
USA_50s_Allow_Free_Elections_desc:0 "Washington reste en retrait de la balance. Pas d'agents dans les provinces, pas d'accords discrets avec les autorités des districts, pas de contrats d'impression passés par l'intermédiaire de tiers - le compte sera ce que les Vietnamiens en feront.\n\nSi notre équipe gagne dans ces conditions, le résultat en vaudra la peine. Si ce n'est pas le cas, nous devrons vivre avec un Vietnam que nous n'avons pas choisi."
USA_50s_Rig_the_Vietnamese_Elections_desc:0 "Le scrutin aura lieu et donnera la bonne réponse. Les listes d'enregistrement dans les provinces contestées seront examinées par des personnes qui comprennent ce qui est attendu d'elles, et les modalités ne seront pas discutées au préalable avec Saigon : un client auquel on demande d'approuver ce type de travail est un client qui pourra ensuite en répondre.\n\nBien fait, personne ne pourra rien prouver. Mal fait, nous donnons à Hanoï la victoire de la propagande de la décennie."
USA_50s_Fund_VIE_Reconstruction_desc:0 "La guerre d'Indochine est terminée et il est donc bénéfique pour nous de commencer à investir dans la région afin d'assurer la continuité de sa richesse et de sa stabilité."
USA_50s_Encourage_French_Decolonization_desc:0 "Les Français doivent comprendre que la révolte était due à leur mauvaise politique coloniale en Indochine. Il est temps pour eux de partir."
USA_50s_Fund_French_Coup_Against_Diem_desc:0 "Paris cherche depuis des mois un remplaçant à Saigon : les Binh-Xuyen, le Général Hinh, le Viet-Quoc et le Dai-Viet ont tous de l'argent français en poche, et aucun d'entre eux n'hésite à le faire. Ce qu'ils n'ont pas, c'est la garantie que Washington détournera le regard.\n\nNous pouvons leur en donner un. La politique foncière de Diem, son mépris pour les sectes et son habitude de traiter les conseils américains comme une offre d'ouverture lui ont coûté la patience qui restait au ministère ; un général qui doit son palais à Paris et son silence à nous est un partenaire plus prévisible qu'un mandarin qui ne doit rien à personne.\n\nLa décision appartient toujours à Paris, et le résultat appartient toujours à l'armée de Diem. Tout ce que nous faisons, c'est supprimer la dernière raison qui pousse quiconque à hésiter."
USA_50s_Permit_Diem_Regime_desc:0 "Diem tient Saigon, et la tenir était la partie la plus difficile. Les sectes ont été brisées ou achetées, les Français font leurs valises, et le référendum a rapporté un chiffre qu'aucun décompte honnête n'a jamais produit - mais il l'a rendu pour notre homme.\n\nNous enverrons les félicitations, accorderons une reconnaissance formelle et donnerons à la mission d'aide une base permanente. Quoi qu'il soit, Diem est désormais le gouvernement du sud du Vietnam, et l'alternative au soutien de lui est de voir toute la position s'effondrer pendant que nous cherchons quelqu'un de meilleur."
USA_50s_The_Decolonization_Debate_desc:0 "L'impérialisme est contesté de deux côtés. D'une part, on observe une montée du nationalisme au sein des différents empires, entraînant des revendications d'autonomie gouvernementale et d'indépendance. D'un autre côté, on se rend de plus en plus compte que l'idée même de l'empire exclusif appartient à une époque révolue ; et que les régions du monde en retard, tant en termes de développement économique que de progrès culturel, devraient être considérées comme une responsabilité incombant à la communauté internationale dans son ensemble."
USA_50s_Push_for_Decolonization_desc:0 "Le monde change et dans ce nouveau monde, il n'y a pas de place pour l'impérialisme."
USA_50s_A_Return_to_Wilsonian_Diplomacy_desc:0 "Notre politique en matière de colonisation devrait suivre les quatorze points de Woodrow Wilson, qui mettent l'accent sur l'autodétermination des peuples, le plaidoyer en faveur de la propagation de la démocratie, le plaidoyer en faveur de la propagation du capitalisme, le soutien à la sécurité collective et une opposition au moins partielle à l'isolationnisme américain."
USA_50s_Africa_for_the_Africans_desc:0 "L'Afrique doit être pour les Africains, et nous les aiderons à y parvenir."
USA_50s_Offer_Entrance_to_the_Technical_Assistance_Program_desc:0 "Les nouvelles nations africaines sont terriblement en retard sur le reste du monde en matière de développement technologique. Nous pouvons vous aider."
USA_50s_For_the_Almighty_Dollar_desc:0 "L'Amérique n'est pas une organisation caritative. Nous aiderons les Africains à s'implanter, pour un prix raisonnable."
USA_50s_Subvert_Independence_Movements_desc:0 "La plupart des mouvements indépendantistes sont de nature pro-soviétique. Ils devront... Partir."
USA_50s_Introduce_American_Corporate_Investors_desc:0 "La création de bureaux locaux en Afrique nous fournira un marché de consommation massif et une réserve de main-d'oeuvre bon marché. Quoi? Les mendiants ne peuvent pas choisir."
USA_50s_Solidify_American_Economic_Influence_desc:0 "Tant de nouveaux pays, tant d'argent à gagner. Tout cela pour le bien de l'Afrique, bien entendu."
USA_50s_Collaborate_with_Local_Interests_desc:0 "Nous devons faire en sorte que ces nouveaux pays comprennent que la voie de la prospérité dépend de nous et non du communisme."
USA_50s_Expand_Foriegn_Aid_Recipients_desc:0 "Il existe déjà quelques pays nominalement indépendants en Afrique, donnons-leur un peu de financement."
USA_50s_Infrastructure_Grants_desc:0 "Les marchandises ont besoin de routes pour circuler, nous accorderons aux gouvernements africains des subventions pour développer les artères commerciales nécessaires."
USA_50s_Send_Educational_Aid_desc:0 "L'analphabétisme est un outil utilisé par les oppresseurs pour maintenir les masses dans l'ignorance. Si l'Afrique veut prospérer, sa population doit recevoir une éducation adéquate."
USA_50s_Provide_Economic_Loans_desc:0 "Nous approuverons certains prêts aux gouvernements africains afin qu'ils puissent accroître leur développement."
USA_50s_Continue_the_Eurocentric_African_Policy_desc:0 "L'indépendance au XXe siècle ouvre la porte au communisme. Pour que l'Afrique reste libre, elle doit accepter la domination européenne."
USA_50s_Warn_of_the_Dangers_of_Premature_Independence_desc:0 "L'Amérique n'est grande que parce que nous avons obtenu notre indépendance lorsque nous étions prêts. Une indépendance prématurée conduirait au chaos, à la guerre civile et à la dictature."
USA_50s_Foster_Happy_Colonial_Relationships_desc:0 "L'Afrique et l'Europe sont plus fortes ensemble, il faut le rappeler aux deux parties."
USA_50s_Promote_Progressive_Colonial_Reforms_desc:0 "Certains partisans de l'indépendance font valoir des arguments valables. Les régimes coloniaux devraient adopter quelques-unes de leurs idées."
USA_50s_Promote_Moderate_Local_Leaders_desc:0 "Pour chaque communiste africain, il y a 100 modérés. Nous favoriserons le second et discréditerons le premier."
USA_50s_Invest_in_New_African_Experts_desc:0 "Les experts africains compétents doivent être valorisés et non rejetés. Ils peuvent aider les colonies autant que les Européens."
USA_50s_The_Hungarian_Revolution_desc:0 "Les réformistes se sont soulevés en Hongrie pour se débarrasser des chaînes de la domination soviétique ! Nous ne pouvons pas ignorer cela !"
USA_50s_Threaten_the_Soviets_desc:0 "La Hongrie aspire à la liberté et l'Amérique a entendu cet appel. Nous dirons clairement que la Hongrie sera protégée de l'ingérence soviétique !"
USA_50s_Stand_By_Our_Word_desc:0 "L'agression soviétique ne peut plus être autorisée, l'URSS doit être détruite."
USA_50s_The_Curtain_Opens_desc:0 "Les Soviétiques ont reculé, la Hongrie est libre !"
USA_50s_Bring_the_Issue_to_the_UN_desc:0 "Ce qui se passe en Hongrie affectera toutes les nations d'Europe. Les Nations Unies doivent agir !"
USA_50s_Diplomatic_Objections_desc:0 "Ce que l'Union soviétique fait à la Hongrie constitue une violation de toutes les lois internationales établies depuis la création des Nations Unies. Il faut que tout le Conseil de sécurité s'en rende compte !"
USA_50s_Expose_Soviet_Aggression_desc:0 "Le mépris flagrant de l'Union soviétique pour le décorum et la conduite internationale est pleinement visible. Nous devons montrer au reste du monde quel genre de nation elle est."
USA_50s_International_Humanitarian_Aid_for_Hungarian_Refugees_desc:0 "Ce fut un bon combat, mais la Révolution a échoué. Nous veillerons à ce que ceux qui ont fui la Hongrie avant l'invasion soient correctement pris en charge."
USA_50s_A_Military_Police_Action_desc:0 "Si un seul soldat soviétique entre en Hongrie, cela constitue une violation du droit international. Une force de police de l'ONU sera dépêchée en Hongrie pour la défendre coûte que coûte."
USA_50s_Issue_Diplomatic_Objections_desc:0 "Même si nous soutenons les Hongrois, la guerre n'est pas une option. Le mieux que nous puissions faire est d'émettre des objections diplomatiques contre l'agression soviétique."
USA_50s_Accept_Hungarian_Refugees_desc:0 "Les peuples opprimés du monde sont toujours les bienvenus aux États-Unis. Quiconque a réussi à s'enfuir de Hongrie se verra accorder l'asile s'il le souhaite."
USA_50s_The_Containment_Policy_desc:0 "Le communisme est comme une maladie, qui se propage sans fin et infecte tout ce qu'il touche. Il doit être isolé et affamé."
USA_50s_An_Arms_Race_desc:0 "Les Soviétiques font des heures supplémentaires pour construire une machine de guerre massive. Quoi qu'il en soit, nous devons garder une longueur d'avance."
USA_50s_Vastly_Expand_the_Military_Industrial_Complex_desc:0 "L'armée est forte, mais elle peut l'être. Une seule bombe peut faire la différence entre la victoire et la défaite."
USA_50s_The_Mutual_Security_Plan_desc:0 "Evolution du Plan Marshall, le Plan de sécurité mutuelle contribuera à développer la capacité des autres pays à empêcher la propagation du communisme."
USA_50s_Itegrating_Germany_Into_the_Western_Economy_desc:0 "L'Allemagne de l'Ouest reconstruit lentement sa puissance économique d'avant-guerre. Les avoir à nos côtés pour une fois nous aidera grandement."
USA_50s_Invest_in_Scandinavia_desc:0 "La Scandinavie est très prometteuse, nous leur réserverons des fonds pour développer leur capacité industrielle."
USA_50s_Funding_the_Commonwealth_desc:0 "Le Royaume-Uni est notre allié le plus puissant depuis des décennies, l'Empire aura notre aide pour se reconstruire."
USA_50s_Redirect_Aid_to_South_Asia_desc:0 "Le Royaume-Uni a suffisamment d'argent, les démocraties naissantes d'Asie en ont davantage besoin."
USA_50s_Finance_Continued_Benelux_Reconstruction_desc:0 "Les Pays-Bas ont beaucoup souffert pendant la guerre ; ils ont besoin de davantage de notre aide."
USA_50s_Continue_French_Fiscal_Aid_desc:0 "La France était l'un de nos alliés contre l'Allemagne nazie, elle a mérité notre aide."
USA_50s_Redirect_Aid_to_Japan_and_Korea_desc:0 "La France n'a pas beaucoup souffert par rapport au reste de l'Europe. Le Japon et la Corée ont plus besoin de fonds que les Français."
USA_50s_Development_Aid_to_Portugal_and_Italy_desc:0 "Le régime fasciste italien a disparu, la nouvelle Italie a besoin de notre aide pour construire une véritable économie industrielle civile. Le Portugal pourrait également en utiliser."
USA_50s_Expand_the_Technical_Assistance_Program_desc:0 "Plus nos alliés disposent de bons outils, mieux ils pourront combattre le communisme. Pour ce faire, le programme d'assistance technique sera élargi."
USA_50s_Support_Our_Middle_Eastern_Allies_desc:0 "Le Moyen-Orient est dangereusement proche des Soviétiques, et ils ne sont pas à l'abri d'une révolution communiste. Nous ferons ce que nous pouvons pour les aider."
USA_50s_Asian_Funding_desc:0 "Nos alliés et nos anciens ennemis ont besoin d'aide pour se reconstruire après la brutale guerre du Pacifique."
USA_50s_Invest_in_Taipei_desc:0 "La République de Chine a de meilleures chances de survivre si elle dispose d'une économie forte."
USA_50s_Funds_for_the_Philipines_and_Indonesia_desc:0 "Les Philippines et l'Indonésie ont été brutalement ravagées par l'Empire du Japon, nous allons les aider à se reconstruire."
USA_50s_Fund_Japanese_Reconstruction_desc:0 "Le Japon impérial a été détruit, mais l'oeuvre n'est pas terminée. Le Japon sera reconstruit, transformé d'une autocratie militarisée en un phare de prospérité démocratique en Asie."
USA_50s_Fiscal_Assistance_for_India_and_Pakistan_desc:0 "L'Inde et le Pakistan sont nouveaux sur la scène mondiale. Si nous aidons à la construction de leur État, cela ouvre la porte à un futur partenariat."
USA_50s_Bankroll_South_Korean_Reconstruction_desc:0 "La République de Corée a besoin d'une économie forte pour faire face à son homologue communiste du Nord."
USA_Fund_the_CIA_Front_Lines_desc:0 "La CIA a besoin de financement pour protéger les intérêts américains à travers le monde."
USA_50s_Expanding_NATO_desc:0 "L'OTAN a besoin de plus d'alliés pour lutter contre les Soviétiques."
USA_50s_Invite_Turkey_desc:0 "L'Union soviétique constitue une menace existentielle pour la Turquie, et ils le savent. Ils accueilleront à bras ouverts une invitation à l'OTAN."
USA_50s_Invite_West_Germany_desc:0 "L'Allemagne de l'Est est fermement ancrée dans la sphère d'influence soviétique. Nous devons avoir la meilleure moitié de l'Allemagne à nos côtés."
USA_50s_Invite_Greece_desc:0 "La Méditerranée ne peut pas devenir rouge. Nous inviterons la Grèce à rejoindre l'OTAN et à isoler les Soviétiques de la mer."
USA_50s_The_Middle_East_desc:0 "Opérations liées au Moyen-Orient."
USA_50s_Crisis_in_Lebaon_desc:0 "Le Liban est au bord de la guerre civile ; nous devons agir rapidement et protéger nos intérêts."
USA_50s_Secure_Beirut_International_desc:0 "Le moyen le plus sûr d'entrer et de sortir du Liban consiste à passer par l'aéroport international de Beyrouth. Nous devons le sécuriser."
USA_50s_Bring_Both_Sides_to_the_Table_desc:0 "Il y a encore une chance pour une solution pacifique, nous proposerons de négocier en tant que médiateur entre toutes les parties pour y parvenir."
USA_50s_Install_a_Puppet_Leader_desc:0 "Afin de sauvegarder les intérêts américains au Moyen-Orient, nous installerons notre homme préféré comme président."
USA_50s_The_Legacy_of_the_Armistice_Agreements_desc:0 "Les tensions entre Arabes et Israéliens atteignent lentement un point de rupture. Nous devons agir avec prudence."
USA_50s_Sign_the_Tripartite_Declaration_desc:0 "L'accord tripartite de 1950 est une déclaration conjointe des États-Unis, du Royaume-Uni et de la France visant à garantir le statu quo territorial déterminé par les accords d'armistice israélo-arabes de 1949. La déclaration souligne l'engagement des parties en faveur de la paix et de la stabilité au Moyen-Orient et leur opposition au recours ou à la menace de la force."
USA_50s_Limited_Israeli_Economic_Aid_desc:0 "Même si la déclaration limite l'aide militaire que nous pouvons apporter, nous pouvons néanmoins offrir une aide économique limitée."
USA_50s_Reject_the_Tripartite_Proposal_desc:0 "Nous ne pouvons pas signer la déclaration, car cela mettrait notre allié dans une situation difficile."
USA_50s_Advisors_to_Israel_desc:0 "Nous enverrons nos meilleurs hommes pour aider l'armée israélienne à devenir la plus forte de la région !"
USA_50s_Extensive_Military_Aid_desc:0 "L'armée israélienne est très compétente, mais une aide supplémentaire est toujours la bienvenue."
USA_50s_Ramp_Up_Foriegn_Aid_to_Israel_desc:0 "Notre aide ne doit pas se limiter uniquement à l'armée, nous pouvons également contribuer à stimuler l'économie israélienne."
USA_50s_CENTO_desc:0 "L'Organisation du Traité central est une alliance instable semblable à l'OTAN au Moyen-Orient. Nous devons déterminer si notre adhésion serait dans notre meilleur intérêt."
USA_50s_Influence_Negotiations_desc:0 "Il y a des prospects qui envisagent de rejoindre CENTO, peut-être pouvons-nous les pousser dans la bonne direction ?"
USA_50s_Join_CENTO_desc:0 "CENTO est un moyen de dissuasion clé contre le communisme au Moyen-Orient, nous devrions y adhérer immédiatement."
USA_50s_Bow_to_the_Israel_Lobby_desc:0 "Les conflits entre plusieurs membres du CENTO et nos alliés israéliens sont tout simplement trop importants. Nous ne pouvons pas adhérer au CENTO."
USA_50s_The_Suez_Crisis_desc:0 "Le gouvernement égyptien a annoncé son intention de nationaliser le canal de Suez et d'en expulser les autorités coloniales. Les Britanniques n'ont pas l'intention de permettre que cela se produise. Nous devons choisir un camp."
USA_50s_Support_Egypt_desc:0 "Nasser souhaite établir une République égyptienne libérée des caprices des puissances coloniales lointaines. Personne au monde ne peut comprendre autant sa vision que nous."
USA_50s_Denounce_Tripartite_Aggression_desc:0 "Comment pouvons-nous prétendre soutenir la liberté tout en permettant aux puissances étrangères d'occuper les terres égyptiennes légitimes ? L'Alliance tripartite doit être stoppée."
USA_50s_Demand_Tripartite_Withdrawal_desc:0 "Si l'Alliance ne quitte pas l'Égypte de manière pacifique, nous serons contraints de prendre des mesures draconiennes à l'encontre de ses membres."
USA_50s_Crash_the_British_Economy_desc:0 "Toutes les tentatives de solution diplomatique ont échoué. Les Britanniques devront apprendre à leurs dépens que l'ingérence dans les affaires des autres nations a des conséquences."
USA_50s_The_Twilight_of_the_Old_Order_desc:0 "§RLe monde n'a pas besoin de rois et d'empereurs.§"
USA_50s_Support_the_Tripartite_Alliance_desc:0 "Nasser n'est pas communiste, mais sa rhétorique panarabe incendiaire constitue une menace pour nos intérêts au Moyen-Orient. Nous devons faire tout notre possible pour garantir que sa révolution reste contenue."
USA_50s_Veto_UN_Measures_desc:0 "Toute victoire autre que complète dans le canal de Suez est inacceptable. Nous ne laisserons pas les Nations Unies faire obstacle."
USA_50s_Indirect_Involvement_desc:0 "Il n'est pas nécessaire que le sang américain souille le sol égyptien. La victoire peut être obtenue grâce à une implication indirecte."
USA_50s_Discount_Weapon_Sales_desc:0 "L'Alliance aura besoin d'armes pour gagner à Suez, des armes que nous pourrons vendre à un prix raisonnable."
USA_50s_Increase_Diplomatic_Coordination_desc:0 "Une communication constante est la clé du succès. Nous faciliterons la coordination de toutes les opérations entre les membres de l'Alliance."
USA_50s_Abstain_in_the_UNSC_desc:0 "Ce qui se passe en Égypte ne nous concerne pas. Quoi que l'ONU veuille faire concernant le canal de Suez, nous ne nous y opposerons pas."
USA_50s_Force_a_Peace_desc:0 ""
USA_50s_Leave_it_Be_desc:0 ""
USA_50s_The_Chinese_Civil_War_desc:0 "Après la Seconde Guerre mondiale, l'alliance marginale entre nationalistes et communistes s'effondre, provoquant la reprise de la guerre civile. Nous devons maintenant choisir quelle sera notre politique à ce sujet."
USA_50s_Partial_Support_for_KMT_desc:0 "Sans victoire en vue, mais pour atténuer les réactions négatives de nombreux membres du lobby chinois, nous avons maintenu un soutien mineur au régime nationaliste en Chine et nous continuerons à lui accorder des prêts pour le moment."
USA_50s_the_tides_of_war_turns_desc:0 "Dans un geste surprenant des nationalistes, leurs forces ont repoussé les communistes lors de la bataille de Shanghai tout en mettant un terme total à l'avancée communiste. Cela peut être notre ticket pour apporter un soutien étendu au ROC."
USA_50s_sway_western_powers_to_support_the_KMT_desc:0 ""
USA_50s_China_White_Paper_desc:0 ""
USA_50s_Direct_Involvement_desc:0 "La seule façon d'arrêter la menace rouge chinoise est de nous impliquer directement dans la guerre, soit en envoyant des conseillers et des armes, soit même en envoyant directement des hommes au combat."
USA_50s_military_mission_to_china_desc:0 "En envoyant des conseillers militaires, nous pouvons aider les forces nationalistes à combattre plus efficacement."
USA_50s_Recruit_Volunteers_desc:0 "Au lieu de simplement conseillers, nous avons besoin d'une action directe. Il faut recruter des volontaires qui souhaitent lutter contre la menace rouge."
USA_50s_Bring_the_Issue_to_the_United_Nations_desc:0 "S'impliquer directement dans la guerre civile coûtera cher, mais ne rien faire garantira sûrement la victoire communiste. Au lieu de cela, nous impliquerons les Nations Unies et espérons que l'aide internationale poussera la République à la victoire."
USA_50s_Call_for_Western_Military_Intervention_desc:0 "Les nationalistes ne peuvent pas vaincre Mao à eux seuls. Nous devons rallier autant de nations que possible à leurs côtés."
USA_50s_A_UN_Police_Action_chi_desc:0 "Les rebelles communistes ne sont rien d'autre que des criminels ; une action policière rapide et efficace de la part des Nations Unies les réprimera."
USA_50s_fund_the_nationalists_desc:0 "Il est temps de tenir notre promesse de défendre les nations libres du monde. Les drapeaux rouges ne flotteront jamais sur la Chine !"
USA_50s_bomb_PLA_key_industries_desc:0 "Nous déploierons des bombardiers pour bombarder les industries communistes, de cette façon nous pourrons détruire leur production de guerre et donner au KMT un moyen de pression sur les communistes."
USA_50s_Ramp_Up_Equipment_Deliveries_desc:0 "Les nationalistes ont besoin de davantage d'armes et de matériel pour vaincre les communistes. Augmentons le montant que nous envoyons."
USA_50s_Leave_it_to_Fate_desc:0 "Nous ne pouvons pas toujours être là pour sauver les Chinois de toutes les menaces auxquelles ils sont confrontés. La République doit apprendre à se débrouiller seule si elle veut survivre, et la lutte contre le communisme est l'occasion idéale pour y parvenir."
USA_50s_The_Fate_of_Mainland_China_desc:0 "Il n'y aura pas d'impasse dans la guerre civile chinoise. Soit la République règnera triomphante, soit elle sera dévorée par la horde communiste."
USA_50s_The_Kuomintang_Hold_On_desc:0 "Dans une contre-offensive époustouflante, les nationalistes ont réussi à repousser l'APL. Le continent a été en grande partie protégé des rebelles communistes, la République doit désormais se reconstruire et se réformer pour que cela reste ainsi. Peut-être que certains investissements s'imposent ?"
USA_50s_Send_Reconstruction_Funds_desc:0 "La majeure partie de la Chine est en ruines après la guerre civile. Nous les aiderons à se reconstruire, comme nous l'avons fait en Europe après la guerre."
USA_50s_Encourage_American_Corporate_Investment_desc:0 "Permettre à certaines de nos entreprises de s'implanter en Chine contribuera à l'effort de reconstruction et ouvrira les portes à un marché de consommation massif."
USA_50s_Reaffirm_US_Chinese_Relations_desc:0 "Ce n'est pas parce que la guerre est finie que le communisme n'est plus une menace. Nous devons assurer la République que l'Amérique est prête à défendre ses alliés contre la menace rouge."
USA_50s_Denounce_Communism_in_Asia_desc:0 "Le communisme s'est malheureusement révélé populaire en Asie. Nous devons assurer les nations non communistes du continent que nous sommes prêts à les aider à se défendre contre cette menace."
USA_50s_Reaffirm_Local_Alliances_desc:0 "Les États-Unis ont de nombreux alliés dans le monde et nous sommes déterminés à les défendre contre tous les ennemis, communistes ou autres."
USA_50s_Establish_SEATO_desc:0 "L'Organisation du Traité de l'Asie du Sud-Est sera notre réponse au nombre croissant d'États communistes en Asie. Comme leurs homologues de l'Atlantique Nord, les membres s'engageront à se défendre mutuellement contre les agresseurs communistes."
USA_50s_The_Korean_War_desc:0 "La guerre a éclaté en Corée ! Les forces communistes de Corée du Nord ont lancé une invasion du Sud, et si nous n'intervenons pas, il est probable que la péninsule entière tombera aux mains du communisme. Nous ne pouvons pas permettre que cela se produise."
USA_50s_A_UN_Police_Action_desc:0 "Les Nations Unies doivent intervenir dans la guerre."
USA_50s_The_Korean_War_Draft_desc:0 "Nous avons besoin de plus d'hommes pour soutenir nos efforts de guerre en Corée. Avec la révision de la loi Elston, l'âge d'admission sera abaissé à 18 ans et demi et les engagements de service actif étendus à 24 mois."
USA_50s_Economic_Aid_for_South_Korea_desc:0 "Sans une économie forte, le Sud s'effondrera rapidement."
USA_50s_Reform_The_South_Korean_Army_desc:0 "L'armée de la République de Corée est désorganisée, inefficace et sous-équipée. Ils ne gagneront jamais cette guerre si nous ne leur montrons pas comment on y parvient."
USA_50s_Approaching_a_Conclusion_desc:0 "La guerre de Corée a assez duré. Il est temps de déterminer si une victoire totale est possible ou s'il est temps de négocier la paix."
USA_50s_No_Surrender_desc:0 "Un seul pays qui tombe dans le communisme menace le monde libre tout entier. Nous ne pouvons tout simplement pas permettre que la Corée du Nord continue d'exister."
USA_50s_Push_into_Manchuria_desc:0 "Le mépris flagrant de la Chine à l'égard de la souveraineté coréenne ne peut rester impuni. S'ils veulent la guerre, l'Amérique la leur donnera."
USA_50s_Attempt_Negotiations_desc:0 "Nous sommes dans une impasse. L'avant a à peine bougé d'un pouce, et il n'y a aucun signe clair de changement. Il semble que la Corée restera divisée aussi longtemps que le Nord acceptera un cessez-le-feu."
USA_50s_Fortify_the_Line_of_Control_desc:0 "La facilité avec laquelle l'Armée populaire coréenne a envahi la Corée du Sud a presque mis fin à la guerre avant qu'elle ne commence. La frontière du Sud doit être transformée en un bouclier impénétrable."
USA_50s_Threaten_the_Chinese_desc:0 "Nous étions sur le point de remporter la victoire contre la Corée du Nord jusqu'à ce que les communistes chinois interviennent en leur faveur. Nous leur donnerons une chance de battre en retraite et nous ferons savoir très clairement que si nous ne le faisons pas, cela entraînera de graves conséquences."
USA_50s_Back_Down_desc:0 "Les Chinois ont bluffé et refusent de battre en retraite. Nous ne pouvons pas sérieusement mettre à exécution le plan de MacArthur, nous n'avons d'autre choix que de reculer."
USA_50s_Back_Down_HUN_desc:0 "Les Soviétiques ont ignoré nos avertissements. La Hongrie vaut-elle vraiment la Troisième Guerre mondiale ?"
USA_50s_Chinese_Withdrawal_desc:0 "Les Chinois ont sagement décidé de quitter la Corée. Sans eux, les jours de la Corée du Nord sont comptés."
USA_50s_A_Ceasefire_desc:0 "La guerre est finie. Même si ce n'est pas le résultat que nous espérions, nous avons au moins réussi à préserver la République."
USA_50s_Halt_Financial_aid_desc:0 "Si le Royaume-Uni ne travaille pas avec nous, alors il ne mérite pas notre aide."
USA_50s_The_Fall_of_the_Mainland_desc:0 "Les forces de Mao ont triomphé en Chine. Les nationalistes ont été contraints de se retirer du continent vers la petite île de Taiwan. Nous devons faire tout notre possible pour défendre l'île contre les communistes."
USA_50s_contact_sun_li_jen_desc:0 "Le général Sun Li-Jen, un éminent général qui a combattu pendant la Seconde Guerre mondiale sur le théâtre birman, a commencé à exprimer des critiques contre le leadership de Chiang. Nous le contacterons immédiatement, organiserons un coup d'État et renverserons Chiang du pouvoir, puis remplacerons Chiang par Sun Li-Jen à la tête du pays. Ce n'est qu'alors que nous pourrons garantir la sauvegarde de nos intérêts américains à Taiwan."
USA_50s_keep_support_for_chiang_desc:0 "Il est clair que les communistes ne sont pas disposés à cesser les hostilités avec nous, nous détournerons notre soutien vers les restes nationalistes à Taiwan sous Chiang Kai-Shek, Taiwan restera le dernier rempart contre la Chine communiste."
USA_50s_Fortify_Taiwan_desc:0 "Même si la guerre est peut-être terminée pour le moment, il est fort probable que les communistes tenteront également de s'emparer de Taiwan. Pour les dissuader, nous devrions aider les nationalistes à fortifier l'île."
USA_50s_The_Formosa_Resolution_desc:0 "Mao a clairement fait savoir qu'il avait l'intention de prendre Taiwan par la force. Nous nous engageons à défendre leur intégrité territoriale contre toute attaque des communistes."
USA_50s_Military_and_Economic_Assistance_for_Taiwan_desc:0 "Taiwan ne survivra pas longtemps s'il ne reçoit pas d'aide économique et militaire. Nous aiderons le KMT à industrialiser l'île et à moderniser son économie."
USA_50s_cooperate_with_nanjing_desc:0 "Avec la victoire de la guerre civile chinoise, nous continuerons à coopérer avec les nationalistes de Nanjing et à les aider à se remettre des années de dévastation qu'ils ont endurées."
USA_50s_rise_of_the_china_lobby_desc:0 "À mesure que les relations sino-américaines s'épanouissent, l'influence du lobby chinois s'accroît également. Le lobby chinois est composé de partisans du Kuomintang, la plupart d'entre eux sont de riches hommes d'affaires ou des hommes politiques ayant des liens directs avec la famille Chiang. L'amitié sino-américaine se fera au prix d'une sympathie croissante pour le régime du Kuomintang."
USA_50s_joint_sino_american_military_trainings_desc:0 "Nous participerons aux entraînements militaires aux côtés des Chinois pour être prêts au combat avec la sphère soviétique en Asie si une guerre mondiale éclatait. Nous ne pourrons jamais être sûrs d'une paix totale tant que le communisme ne sera pas éliminé à l'échelle mondiale."
USA_50s_propose_chinese_Membership_into_SEATO_desc:0 "Avec la formation de l'OTASE, nous inviterons la République de Chine à rejoindre l'alliance. Bien qu'ils n'appartiennent pas à la région de l'Asie du Sud-Est, ils partagent un intérêt pour la région aux côtés de l'Australie et de la France. L'adhésion de la Chine à l'OTASE renforce la légitimité de l'alliance et contribue à freiner efficacement le communisme dans la région."
USA_50s_reconcile_with_the_KMT_desc:0 "Nous nous réconcilierons avec le régime du Kuomintang, que nous avons abandonné en pleine guerre civile chinoise. nous les rembourserons par une aide et un soutien massifs à la relance économique afin de nous pardonner et de reprendre des relations amicales."
USA_50s_Abandon_South_Korea_desc:0 "Malgré tous nos efforts, la République de Corée est au bord de l'effondrement. Il est temps d'affronter les faits, de réduire nos pertes et de rentrer chez nous."
USA_50s_Accept_South_Korean_Refugees_desc:0 "Avec la dictature communiste à l'horizon, des milliers de Sud-Coréens fuient la péninsule tant qu'ils le peuvent. Nous en accueillerons le plus grand nombre possible."
USA_50s_A_New_Front_desc:0 "Les restes du KMT se sont retirés à Taiwan et en Birmanie. Nous appellerons tous les soldats du Kuomintang à participer à la guerre de Corée et à créer une diversion contre l'APL en établissant de nouveaux fronts au Yunnan et ailleurs."
USA_50s_Implement_MacArthurs_Proposal_desc:0 "§RBonne nuit, Président...§"
USA_50s_A_Unified_Korea_desc:0 "Le KPA a été détruit et la Corée reste unie. Les Chinois n'ont d'autre choix que d'admettre leur défaite."
USA_50s_Request_Ceasefire_desc:0 "Nous n'avons aucun moyen réaliste de faire reculer les Chinois. Tout ce que nous pouvons faire, c'est appeler à un cessez-le-feu et espérer des conditions de paix favorables."
USA_50s_Nation_Building_in_Africa_desc:0 "À mesure que les Africains grandissent, leurs besoins augmentent également. Nous serons là à chaque étape du voyage, vous aidant de toutes les manières possibles."
USA_50s_Condemn_European_Influence_desc:0 "L'Afrique en a assez de l'Europe ; ils n'en ont plus besoin."
USA_50s_Focus_on_the_Stratofortress_desc:0 "Quel est cet imbécile qui a pensé que mettre un réacteur nucléaire dans un avion était une bonne idée ? Nous nous concentrerons plutôt sur le développement et la production du B-52 de Boeing."
USA_50s_Sidewinder_Missiles_desc:0 "Nous équiperons nos avions de missiles d'interception aérienne, augmentant ainsi considérablement leur capacité de combat."
USA_50s_The_Super_Sabre_desc:0 "Une fois terminé, le Super Sabre sera le premier chasseur à réaction supersonique américain."
USA_50s_The_Ultimate_Interceptor_desc:0 "Le F-108 Rapier défendra notre ciel contre les bombardiers supersoniques soviétiques. Bien que coûteuses, ses capacités ne peuvent être niées."
USA_50s_The_Last_of_Pattons_Namesake_desc:0 "Le M60 sera le dernier de la famille des chars Patton. Nous ferons en sorte que ce vieux crétin s'en sorte en beauté."
USA_50s_Bring_Strategic_Nuclear_Capability_to_the_Fleet_desc:0 "La seule façon de gagner la guerre froide est de disposer de capacités nucléaires supérieures à celles de notre ennemi. Tout comme l'Armée de l'Air, la Marine sera un élément clé de notre stratégie nucléaire."
USA_50s_Supersonic_Strategic_Bombers_desc:0 "La vitesse de nos chasseurs est vraiment étonnante, mais nous ne pouvons pas négliger nos bombardiers. Nous devons en concevoir un capable d'atteindre une vitesse supersonique tout en étant capable de transporter une lourde charge utile."
USA_50s_A_Partner_for_Valkyrie_desc:0 "La Rapière s'avère beaucoup trop coûteuse. Le Thunderchief, un chasseur-bombardier supersonique conçu par Republic Aviation, semble bien plus prometteur."
USA_50s_The_Domestic_Front_desc:0 "Opérations à mener à l'intérieur de notre pays."
USA_50s_Launch_Operation_Mockingbird_desc:0 "§RTop Secret§"
USA_50s_Begin_Project_MUKULTRA_desc:0 "§RTop Secret§"
USA_50s_The_Indonesia_Desk_desc:0 "§RTop Secret§: Opérations liées à l'Indonésie."
USA_50s_The_Sumatran_Revolt_desc:0 "Une révolte a éclaté à Sumatra ! Nous devons les aider à renverser le gouvernement socialiste de Sukarno !"
USA_50s_Condemn_Indonesian_Treatment_of_Sumatrans_desc:0 "Sukarno a détruit la vie d'innombrables Sumatrans ; le monde entier doit le savoir."
USA_50s_Back_Indonesian_Revolutionaries_desc:0 "Nous devons aider les rebelles dans leur lutte contre l'oppression du gouvernement."
USA_50s_Discreet_Civilian_Bombing_Campaign_desc:0 "Nous avons nos objectifs, sommes-nous autorisés à décoller ?"
USA_50s_Involvement_Hidden_desc:0 "La campagne a été un succès, et le monde n'en est pas plus sage."
USA_50s_Raise_Humanitarian_Concers_desc:0 "Nous ne pouvons pas permettre que les actions barbares de l'Indonésie se poursuivent, tout le monde doit aider le peuple de Sumatra."
USA_50s_Exposed_desc:0 "§REuh-oh...§"
USA_50s_Back_Away_desc:0 "Cela ne s'est pas passé comme prévu, il est temps de renflouer."
USA_50s_Japan_Desk_desc:0 "§RTop Secret§: Opérations liées au Japon."
USA_50s_Fund_the_Liberal_Democrats_desc:0 "Nous soutiendrons les modérés japonais afin que leur succès contre les radicaux de gauche soit assuré."
USA_50s_Indirect_Involvement_CIA_desc:0 "Il n'est pas nécessaire de mettre la main dans le gâteau pour l'instant. Voyons si une aide militaire indirecte peut faire pencher la balance en notre faveur."
USA_50s_Air_Drop_Supplies_desc:0 "Comme c'est pratique, une cache d'armes et de munitions vient d'être déposée dans le camp des rebelles..."
USA_50s_Instigate_a_Civil_War_desc:0 "Il est temps d'intensifier le conflit en Indonésie, car ce n'est que par la guerre civile que l'Indonésie pourra être libre."
USA_50s_Ad_the_Sumatran_Goverment_desc:0 "Les rebelles auront besoin de plus d'équipement s'ils espèrent gagner la guerre, donnons-le-leur !"
USA_50s_Promote_Left_Wing_Divisions_desc:0 "Diviser et conquérir. Sans parti uni, le socialisme au Japon est pour ainsi dire mort."
USA_50s_Direct_Intervention_desc:0 "Nous sommes restés assez longtemps sur la touche, il est temps d'aider les Indonésiens à se libérer."
USA_50s_The_Albanian_Subversion_desc:0 "§RTop Secret§: Opérations liées à l'Albanie."
USA_50s_Contact_the_British_desc:0 "Si nous voulons aller de l'avant, nous devons obtenir tous les renseignements britanniques sur la question."
USA_50s_Contact_Exiled_Royalists_desc:0 "Avec de nombreux royalistes éminents en exil, nous devrions les rechercher et les recruter pour nous aider."
USA_50s_Train_Albanian_Emigres_desc:0 "Sans formation adéquate, les Pixies sont voués à l'échec."
USA_50s_Establish_the_Free_Albania_National_Committee_desc:0 "Komiteti Kombëtar \"Shqipëria e Lirë\" est une organisation politique d'émigrés albanais d'après-guerre basés dans les pays occidentaux qui coopèrent avec les puissances occidentales pour renverser le régime communiste d'Enver Hoxha en Albanie."
USA_50s_Listen_to_Zog_desc:0 "Même si le Mi6 britannique nous a apporté une aide importante, il serait peut-être plus sage de faire confiance aux conseils albanais."
USA_50s_Follow_British_Intelligence_desc:0 "En suivant les conseils donnés par le MI6, nos chances de succès sont augmentées."
USA_50s_Albania_Subverted_desc:0 "Le gouvernement communiste en Albanie a été renversé !"
USA_50s_Failure_of_the_Pixies_desc:0 "Nous n'avons pas réussi à renverser Hoxha, l'Albanie reste sous l'oppression communiste."
USA_50s_Denounce_Communist_Albania_desc:0 "Faites savoir que sous Enver Hoxha, l'Albanie ne sera jamais libre."
USA_50s_Resettle_Albanian_Refugees_desc:0 "Nous veillerons à accorder l'asile à ceux qui auront la chance d'échapper au régime oppressif de Hoxha en Albanie."
USA_50s_Establish_the_Assembly_of_Captive_European_Nations_desc:0 "L'ACEN sera composée de représentants des pays européens actuellement sous régime communiste. Leur objectif sera de montrer au monde ce qui se passe réellement derrière le rideau de fer et de promouvoir la coopération contre les gouvernements communistes."
USA_50s_Haiti_Desk_desc:0 "§RTop Secret§: Opérations liées à Haïti."
USA_50s_Back_Papa_Doc_desc:0 "Nous fournirons à Haïti les outils dont il a besoin pour se défendre contre la révolution communiste. Un seul rouge dans les Caraïbes est inacceptable."
USA_50s_Iran_Desk_desc:0 "§RTop Secret§: Opérations liées à l'Iran."
USA_50s_Work_with_MI6_desc:0 "La coopération avec le MI6 s'est avérée très bénéfique dans le passé, et ce ne sera pas différent."
USA_50s_Operation_Ajax_desc:0 "Nos intérêts en Iran nécessitent le renvoi du Premier ministre Mohammad Mosaddegh."
USA_50s_A_Successful_Coup_desc:0 "Le coup d'État iranien a été un succès complet !"
USA_50s_Ajax_Fails_desc:0 "Le coup d'État iranien a échoué !"
USA_50s_Object_to_Iranian_Oil_Nationalization_desc:0 "La nationalisation est le premier pas vers le communisme. Nous ne pouvons pas permettre aux Soviétiques de mettre la main sur le pétrole iranien."
USA_50s_A_British_Counteroffer_desc:0 "Nous ne pouvons pas courir le risque d'un Iran rouge, et les Britanniques sont d'accord... mais cela vaut-il la peine de faire la guerre ?"
USA_50s_Stick_To_Diplomatic_Objections_desc:0 "La guerre en Iran n'est pas une option. Nous continuerons à émettre des objections diplomatiques."
USA_50s_Ignore_MI6_desc:0 "La seule préoccupation des Britanniques en Iran est leur approvisionnement en pétrole bon marché. Nous ne nous impliquerons pas dans cela."
USA_50s_Condemn_British_Interference_in_Iranian_Domestic_Affairs_desc:0 "L'Iran est une nation souveraine dotée d'un gouvernement démocratiquement élu et les Britanniques n'ont pas leur mot à dire dans leurs affaires."
USA_50s_Invade_Iran_desc:0 "Il est temps d'apporter en Iran un peu de liberté américaine à l'ancienne."
USA_50s_Radio_Free_Europe_desc:0 "Radio Free Europe diffusera la vérité sans filtre sur le communisme à ceux qui vivent en Europe."
USA_50s_Expand_Western_Broadcasts_desc:0 "RFE ne se limite pas à l'Europe de l'Est, l'Occident doit également être informé de ce qui se passe et de la dangerosité du communisme."
USA_50s_Promote_Pro_American_Parties_desc:0 "Les partis communistes existent au sein des nations libres d'Europe. Si nous soutenons leurs rivaux, nous pouvons diminuer leur influence."
USA_50s_Increase_Eastern_European_Coverage_desc:0 "Bien que l'Europe de l'Est soit sous contrôle communiste, les citoyens ont droit à l'information libre. Nous allons étendre les émissions pour que tout le monde derrière le rideau de fer puisse nous entendre."
USA_50s_Preach_Anti_Communist_Sentiment_desc:0 "Nous exhortons les peuples vivant sous la domination soviétique à regarder derrière leur masque et à voir ce qu'ils ont réellement fait à votre peuple."
USA_50s_Operation_Gladio_desc:0 "Si les Soviétiques envahissent le reste de l'Europe, nous devrons probablement organiser des mouvements de résistance à l'intérieur des pays occupés. L'Opération Gladio formera nos agents et alliés pour ce faire."
USA_50s_Vietnam_Desk_desc:0 "§RTop Secret§: Opérations liées au Vietnam."
USA_50s_Stand_with_South_Vietnam_desc:0 "La République du Vietnam est résolument anticommuniste, un allié naturel en Indochine."
USA_50s_Allow_Unification_Elections_desc:0 "Nous avons décidé d'autoriser les élections d'unification au Vietnam. La question est : devons-nous y intervenir ?"
USA_50s_Allow_Fair_Elections_desc:0 "Il n'est pas nécessaire d'intervenir dans les élections, laissez-les se dérouler."
USA_50s_Rig_the_Election_desc:0 "Nous ne pouvons pas prendre le risque que le Vietnam s'unisse sous le communisme. Le référendum ne doit pas passer."
USA_50s_Block_Unification_Elections_desc:0 "Le scrutin d'unification est un stratagème pour livrer le pays à Hanoï lors des élections, et nous avons l'intention de le voir mourir. Mais il ne mourra pas à Washington - il mourra à Saigon, a annoncé le gouvernement vietnamien selon ses propres mots.\n\nNotre mission rendra la position américaine sans équivoque et laissera officiellement la décision là où elle appartient. Saigon dépend de nous, et les gouvernements dépendants arrivent généralement à la conclusion qu'attend leur patron. En général, ce n'est pas toujours le cas."
USA_50s_Stir_Unrest_Among_Catholic_North_Vietnamese_desc:0 "Le communisme a toujours été opposé à la religion. Nous pouvons utiliser cela pour susciter la dissidence au sein des communautés religieuses du Nord-Vietnam."
USA_50s_Launch_Operation_Passage_to_Freedom_desc:0 "Des milliers de soldats et de civils non communistes sont coincés au Nord-Vietnam. Si nous parvenons à les transporter au Sud-Vietnam, ils pourront contribuer à la lutte contre Hô Chi Minh."
USA_50s_Guatamal_Desk_desc:0 "§RTop Secret§: Opérations liées au Guatemala."
USA_50s_Operation_PBSUCCESS_desc:0 "Réforme agraire ? Cela nous semble être du communisme !"
USA_50s_Coup_Succeeds_desc:0 "Il n'y aura pas de communisme en Amérique centrale sous notre direction !"
USA_50s_Failed_Operation_desc:0 "Le coup d'État d'Armas a échoué ! Maintenant, que sommes-nous censés faire ?"
USA_50s_The_Failure_of_the_Monroe_Doctrine_desc:0 "Nous n'avons d'autre choix que d'admettre notre échec. L'Amérique est pour les Américains, mais le Guatemala est pour les communistes."
USA_50s_Falsify_Intelligence_desc:0 "Nous n'abandonnerons pas si facilement, nos hommes de la CIA trouveront une raison valable pour une intervention au Guatemala."
USA_50s_Invade_Guatamala_desc:0 "L'évidence est irréfutable, le Guatemala n'est qu'une marionnette soviétique ! Pas de problème, cela sera bientôt corrigé..."
USA_50s_Farouk_Agrees_to_Reforms_desc:0 "Le roi Farouk a accepté de réformer !"
USA_50s_Embolden_the_Free_Officers_desc:0 "Farouk est allé aussi loin qu'il pouvait aller. Nous devrons peut-être envisager d'autres options..."
USA_50s_Keep_Pressuring_Farouk_desc:0 "Les réformes ne vont pas assez loin ! Nous devons maintenir la pression sur le roi."
USA_50s_Farouk_Refuses_Pressure_desc:0 "Le roi Farouk refuse de se réformer !"
USA_50s_Support_the_Free_Officers_desc:0 "Si le roi n'écoute pas, peut-être aurons-nous plus de chance avec son successeur !"
USA_50s_A_Failed_Revolution_desc:0 "Les Officiers Libres n'ont pas réussi à renverser Farouk !"
USA_50s_Falsify_Intelligence_on_Farouk_desc:0 "Le roi Farouk constitue un danger pour le peuple égyptien et pour tous ceux qui l'entourent. Il doit partir."
USA_50s_Support_Anti_Egyptian_Nations_desc:0 "Les voisins de l'Égypte sont en danger avec Farouk au pouvoir, nous les armerons de nombreux équipements pour le dissuader."
USA_50s_The_Egyptian_Revolution_desc:0 "Les Officiers Libres ont réussi à renverser Farouk !"
USA_50s_Support_the_New_Regime_desc:0 "Le nouveau gouvernement égyptien est un allié potentiel. Une généreuse livraison d'armes pourrait ouvrir la porte à une coopération future."
USA_50s_Operation_Straggle_desc:0 "§RTop Secret§"
USA_50s_Abandon_the_Coup_desc:0 "Suite aux recommandations faites par John Foster Dulles, Allen Dulles et Michail Bey Ilyan, l'opération Straggle sera considérée comme irréalisable."
USA_50s_A_Worthy_Risk_desc:0 "Malgré les inquiétudes, nous poursuivrons l'opération."
USA_50s_Colonel_Kabbanis_Coup_desc:0 "Le colonel Kabbani a réussi son coup !"
USA_50s_Solidify_the_New_Regime_desc:0 "Kabbani aura besoin d'armes pour maintenir l'ordre en Syrie, donnons-les-lui."
USA_50s_Establish_Formal_Ties_with_the_Kabbani_Regime_desc:0 "Le régime est stable et les choses se sont calmées. Il est temps de reconnaître officiellement le gouvernement de Kabbani."
USA_50s_Another_Failed_Coup_desc:0 "Le coup d'État a échoué..."
USA_50s_Abandon_Syrian_Plans_desc:0 "Nous avons perdu suffisamment de temps et de ressources dans ce gâchis."
USA_50s_Flex_Naval_Might_desc:0 "Mener des exercices navals près de l'Indonésie leur rappellera à qui ils s'attaquent."
USA_50s_Escalate_the_Conflict_desc:0 "L'Indonésie est dangereusement sur le point de nous entraîner dans sa guerre. Assurez-vous qu'ils comprennent cela."
USA_50s_The_Indonesian_Civil_War_desc:0 "Une guerre civile totale a éclaté en Indonésie. Il est temps d'évaluer nos options."
USA_50s_Partition_inondesia_desc:0 "L'Indonésie est trop grande et trop diversifiée pour son propre bien, une partition serait pour le mieux."
USA_50s_Solidfy_Colonel_Husseins_Regime_desc:0 "Il n'est pas nécessaire de diviser l'Indonésie, le colonel Hussein fera du bon travail en tant que nouveau président !"
USA_50s_The_Return_of_the_King_desc:0 "Le roi Zog n'a perdu son trône qu'à cause de Mussolini. Nous le rétablirons comme régent afin qu'il puisse rétablir l'ordre et unir le peuple albanais."
USA_50s_Invite_Albania_to_Join_NATO_desc:0 "Maintenant que l'Albanie est libre, nous allons l'inviter à rejoindre l'OTAN afin de dissuader l'agression de ses voisins communistes."
USA_50s_Solidify_Pahlavi_Rule_desc:0 "Le règne du Shah sur l'Iran sera renforcé. Sous lui, l'Iran prospérera."
USA_50s_Secure_Iran_in_the_Western_Sphere_desc:0 "Le Shah est un allié majeur de l'Occident, nous lui fournirons tout ce dont il a besoin pour maintenir l'ordre."
USA_50s_Empower_the_Armas_Regime_desc:0 "Le régime de Carlos Castillo Armas doit être sécurisé, et rien ne garantit mieux un régime qu'un ensemble d'armes."
USA_50s_Invade_Egypt_desc:0 "A bas le roi !"
USA_50s_Operation_Wappen_desc:0 "Kermit Roosevelt a organisé un nouveau coup d'État en Syrie. Peut-être que celui-ci aura plus de chances de réussir ?"
USA_50s_No_Price_Too_High_desc:0 "Combien vaut votre loyauté, Général ?"
USA_50s_Generals_Agree_desc:0 "Il semblerait que l'argent puisse aussi déplacer les montagnes syriennes."
USA_50s_The_Generals_Coup_desc:0 "Nos généraux alliés ont réussi leur coup d'État, cela valait chaque centime !"
USA_50s_Recognize_the_New_Regime_desc:0 "Maintenant que la poussière est retombée, nous allons étendre la reconnaissance formelle du nouveau régime en Syrie."
USA_50s_Generals_Reject_Bribes_desc:0 "Leur loyauté serait louable... si elle ne mettait pas la Syrie en danger de prise de pouvoir par les communistes !"
USA_50s_Cut_Diplomatic_Ties_desc:0 "Tant que la situation en Syrie n'est pas résolue, nous n'avons rien à dire."
USA_50s_Increase_Arms_Shipments_to_Turkey_and_Iraq_desc:0 "La seule option qui reste en Syrie est une intervention militaire. Si nous parvenons à mettre l'Irak et la Turquie de notre côté, les choses se passeront beaucoup plus facilement."
USA_50s_Invade_Syria_desc:0 "Nous ne permettrons pas à la Syrie de devenir rouge ! Nous n'avons plus d'autre choix que d'envahir !"
USA_50s_Establish_A_Pro_Western_Regime_desc:0 "La guerre est finie, la Syrie est libérée ! Un gouvernement pro-occidental sera installé pour rétablir l'ordre dans le pays et se défendre contre le communisme au Moyen-Orient."
USA_50s_Back_Down_CIA_desc:0 "Nos opérations en Syrie ont de meilleures chances de succès si nous parvenons à rallier nos alliés. Nous allons nous retirer pour le moment."
USA_50s_Contact_Iraq_desc:0 "La perspective d'un rétablissement du régime hachémite sur la Syrie devrait suffire à mettre les Irakiens de notre côté."
USA_50s_Contact_Turkey_desc:0 "La Turquie a des revendications historiques sur les provinces du nord de la Syrie. Nous leur ferons savoir que leurs revendications pourraient devenir réalité s'ils nous aident."
USA_50s_Diplomatic_Refusals_desc:0 "Personne n'est prêt à nous aider contre la Syrie..."
USA_50s_Abadon_Syrian_Schemes_desc:0 "C'est fini, nous avons tout essayé et nous n'avons rien trouvé. Il est temps de passer à autre chose."
USA_50s_Arm_Paramilitaries_desc:0 "Certains groupes en Syrie sont mécontents du régime actuel. Donnons-leur un petit coup de pouce dans la bonne direction."
USA_50s_Launch_False_Flag_Assasinations_desc:0 "Scandaleux! Les États-Unis ne toléreront pas le terrorisme barbare !"
USA_50s_Destablize_the_Regime_desc:0 "Il faut faire comprendre au peuple syrien les méfaits de son gouvernement !"
USA_50s_Support_the_Iraqi_Advance_desc:0 "En avant pour la Syrie !"
USA_50s_Secure_Hashemite_Rule_desc:0 "Le régime pro-soviétique est tombé, la Syrie est de nouveau aux mains anticommunistes des Hachémites !"
USA_50s_Ferment_Unrest_in_Northern_Syria_desc:0 "La population du nord de la Syrie prospérerait grandement sous la domination turque, nous le lui ferons comprendre."
USA_50s_sway_western_powers_to_support_the_KMT_CIA_desc:0 "La Turquie a besoin de toute l'aide possible pour faire face aux réfugiés syriens."
USA_50s_Increase_Turkish_Arms_Shipments_desc:0 "Pour augmenter leurs chances de succès, nous enverrons à la Turquie des armes supplémentaires."
USA_50s_Endorse_the_Turkish_Intervention_desc:0 "La Turquie veille simplement à ce que la Syrie ne tombe pas sous la dictature communiste, elle a tout notre soutien !"
USA_50s_Recogize_Turkish_Territorial_Gains_desc:0 "Comme promis, nous reconnaîtrons officiellement les revendications historiques de la Turquie sur le nord de la Syrie et autoriserons leur annexion."
USA_50s_Falsify_Intelligence_syr_desc:0 "Nous montrerons à nos alliés des preuves irréfutables des projets soviétiques en Syrie et dans le reste du Moyen-Orient ! Bien sûr que c'est réel, ça vient de la CIA !"
USA_50s_Launch_Multi_National_Invasion_of_Syria_desc:0 "Avec le soutien de nos alliés, l'invasion est garantie de réussir !"
Operation_Gladio:0 "Opération Gladio"
operation_wetback.1.d:0 "Depuis plusieurs mois, l'ancien général et commissaire du Service de l'immigration et de la naturalisation (INS), Joseph Swing, milite pour que des mesures d'envergure soient prises pour endiguer le rythme des passages illégaux des frontières en provenance du Mexique. Les appels à un contrôle plus strict des frontières ont été largement soutenus au niveau national par les agriculteurs américains et les intérêts commerciaux qui se sont plaints des impacts économiques des immigrants illégaux. Il convient de noter que le gouvernement mexicain a également exhorté notre gouvernement à freiner l'entrée illégale de travailleurs mexicains dans notre pays en raison des impacts économiques sur le Mexique. Après que des actions plus drastiques aient été rejetées, Swing propose maintenant un nouveau plan, intitulé Opération Wetback.\n\nL'Opération Wetback chercherait à débarrasser le sud-ouest des États-Unis des travailleurs illégaux en balayant de manière ciblée les zones agricoles de toute la région par le biais d'un groupe de travail combiné composé d'entités chargées de l'application des lois locales, étatiques et fédérales. Pourtant, la proposition suscite des critiques en interne, des inquiétudes ont été soulevées quant à l'éventuelle expulsion accidentelle de citoyens américains et aux perturbations de l'approvisionnement alimentaire en raison du recours à une main-d'oeuvre bon marché de la part des travailleurs mexicains. Comment devons-nous procéder ?"

