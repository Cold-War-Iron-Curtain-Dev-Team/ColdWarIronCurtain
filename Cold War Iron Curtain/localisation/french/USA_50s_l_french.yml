 USA_50s_The_American_Armed_Forces:0 "Les forces armées américaines"
 USA_50s_The_American_Armed_Forces_desc:0 "Les forces armées américaines ont triomphé dans les deux guerres mondiales, mais nous ne devrions pas devenir complaisants. Nous devons nous assurer que toutes les branches des forces armées sont prêtes pour la Troisième Guerre mondiale si elle devait survenir."
