l_french:
amendment_22.1.d:0 "Le vingt-deuxième amendement à la Constitution des États-Unis limite à deux le nombre de mandats qu'un individu peut exercer en tant que président. L'intérêt pour l'amendement a augmenté après que Franklin Roosevelt ait été élu quatre fois à ce poste. Les partisans de l'amendement soutiennent qu'autoriser des mandats illimités pourrait affaiblir la démocratie et s'éloigner de la tradition des deux mandats établie par George Washington. L'amendement a été adopté en février 1947 et le processus de ratification par l'État est en cours. Des pressions sont exercées pour que les législatures des États adoptent l'amendement plus rapidement. Le président peut soit soutenir le processus, soit exhorter les législatures des États à retarder la ratification pour empêcher l'amendement d'atteindre la majorité des trois quarts requise des législatures des États. Si une majorité n'est pas atteinte d'ici février 1954, l'amendement échouera."
amendment_22.2.d:0 "Quatre ans après l'adoption par le Congrès du vingt-deuxième amendement à la Constitution, le nombre requis de législatures d'État a adopté l'amendement. Les exigences constitutionnelles ont toutes été satisfaites confortablement dans le délai de sept ans accordé par le Congrès aux législatures des États. Les dirigeants politiques des deux côtés félicitent le président de ne pas interférer dans le processus. Le nouvel amendement limitera à deux seulement le nombre de mandats qu'une personne peut exercer en tant que président. Beaucoup estiment que cet amendement rétablit l'équilibre entre les pouvoirs exécutif et législatif du gouvernement. Malgré l'approbation générale, certains Américains estiment que le nouvel amendement est inutile et pourrait priver le peuple américain d'un leadership à long terme de la part d'un président exceptionnel, tel que Franklin Roosevelt."
amendment_22.3.d:0 "Le président a déclenché une tempête politique à la suite de récents commentaires concernant le processus de ratification du vingt-deuxième amendement. L'amendement limiterait un individu à seulement deux mandats de président. Dans ses remarques, le président a qualifié l'amendement de réaction instinctive à l'ère post-Roosevelt, soulignant que l'on peut et doit faire confiance au peuple américain pour élire l'homme approprié pour le poste, quels que soient les circonstances ou le nombre de mandats d'un individu. Il a appelé les dirigeants politiques au niveau de l'État à rejeter l'amendement. Les dirigeants du Congrès n'ont pas tardé à condamner le président pour son ingérence dans cette affaire et des rapports indiquent que la Maison Blanche demande également aux législatures des États de retarder le vote sur l'amendement afin que le délai de sept ans fixé par le Congrès expire."
amendment_22.4.d:0 "Les récentes remarques du président contre le vingt-deuxième amendement portent leurs fruits, car les législatures des États organisent des votes de rejet ou reportent indéfiniment la discussion sur l'amendement. La Maison Blanche ne peut probablement pas garantir qu'un nombre suffisant d'États rejetteront l'amendement, mais des tactiques dilatoires peuvent garantir que la majorité requise des trois quarts des législatures des États approuvant un amendement ne soit pas atteinte. Cela pourrait placer l'amendement dans un étrange vide politique, mais l'empêcherait de devenir une loi. Le président est convaincu que limiter le nombre de mandats présidentiels ne fera que rendre les États-Unis vulnérables en cas de crise future."
amendment_22.5.d:0 "Les dirigeants politiques rebelles des assemblées législatives des États à travers les États-Unis défient un récent appel de la Maison Blanche visant à suspendre l'adoption du vingt-deuxième amendement. Un nombre suffisant de législatures d'État ont accepté de ne pas retarder ou rejeter l'amendement, de sorte que le président devra accepter sa ratification comme inévitable. Il semble que de nombreux dirigeants aient été surpris par la Maison Blanche et craignaient que leur rejet de l'amendement ne perturbe l'équilibre national des pouvoirs. Un porte-parole de la Maison Blanche a déclaré que le président avait fait connaître son opinion mais n'avait pas exigé que les législatures des États obéissent à ses directives comme le prétendent ses opposants."
amendment_22.6.d:0 "Les opposants au président s'en donnent à coeur joie suite à l'échec de ses efforts visant à empêcher la ratification du vingt-deuxième amendement. Bien que le président ait déclaré qu'il souhaitait des mandats supplémentaires non pas pour lui-même mais pour les futurs titulaires de fonctions, les opposants ont rapidement présenté cet effort comme une simple tentative de gouverner plus longtemps. Les journaux regorgent d'éditoriaux qualifiant la poursuite du processus de ratification de victoire pour la démocratie. Le président a misé une grande partie de son capital politique pour empêcher l'amendement, et son échec a provoqué des réactions négatives. Les adversaires de la Maison Blanche profitent grandement de leur tour de victoire."
amendment_22.7.d:0 "Le vingt-deuxième amendement, bien qu'il ait été adopté par le Congrès et une majorité d'États, n'a pas réussi à obtenir suffisamment de votes de ratification dans le délai de sept ans fixé par le Congrès. Les amendements nécessitent une majorité des trois quarts des législatures des États pour ratifier l'amendement dans le délai spécifié. Au cours de la phase de ratification par l'État, la Maison Blanche avait alors ouvertement fait campagne pour que l'amendement ne soit pas adopté ou soumis au vote. Ils estimaient que la limitation du nombre de mandats présidentiels était arbitraire et privait le peuple américain d'options. Les partisans de l'amendement condamnent l'échec de son adoption, soulignant que l'amendement protégerait la démocratie et rétablirait l'équilibre entre les trois branches du gouvernement."

amendment_22.8.d:0 "Le vingt-deuxième amendement limite un individu à seulement deux mandats. Cette limite arbitraire empêche le peuple américain de choisir le meilleur dirigeant si nécessaire et doit être repoussée. Cependant, cela nécessitera beaucoup de capital politique et de soutien public, car l'opposition peut facilement manipuler l'argument comme un effort de la Maison Blanche pour étendre son propre pouvoir."
amendment_22.9.d:0 "Après avoir obtenu suffisamment de capital politique et mis en place un environnement solide pour le changement, le Président a supervisé avec succès l'abrogation du vingt-deuxième amendement. L'amendement limite les individus à seulement deux mandats de président. Cependant, le président a réussi à obtenir la majorité des deux tiers requise pour que les deux chambres du Congrès adoptent un nouvel amendement l'abrogeant. La majorité des trois quarts des législatures des États requises pour adopter l'amendement devrait donner son approbation dans les semaines à venir. Il s'agit d'une victoire majeure pour la Maison Blanche, mais elle l'expose aux critiques de ses opposants qui prétendent que l'amendement empêche un individu de monopoliser le pouvoir exécutif."
amendment_22.10.d:0 "Les récents efforts présidentiels visant à obtenir un soutien suffisant au niveau du Congrès et des États pour abroger le vingt-deuxième amendement ont échoué. La Maison Blanche n'a pas réussi à convaincre suffisamment de dirigeants politiques que l'amendement, qui limite le nombre de mandats présidentiels, est inutile et constitue un obstacle aux droits démocratiques des citoyens. Des experts en droit constitutionnel de renom ont longtemps prévenu le président que ses efforts se heurtaient à des obstacles redoutables et ils se sont révélés exacts. Bien que l'effort ait initialement semblé bénéficier d'un soutien suffisant, la réaction du public alimentée par les opposants politiques a fait en sorte que l'effort ait échoué."
amendment_22.11.d:0 "Le vingt-deuxième amendement n'a pas réussi à obtenir la majorité des trois quarts parmi les législatures des États. À l'époque, la question faisait l'objet de nombreux débats politiques et d'un manque de consensus. En conséquence, bien qu'une majorité d'États aient adopté l'amendement, ils ne sont pas encore assez nombreux à l'avoir ratifié à la fin du délai fixé par le Congrès. Le président et ses alliés du Congrès pourraient lancer un nouvel effort pour fournir un nouveau calendrier et achever le processus de ratification."
amendment_22.12.d:0 "Le président et ses principaux alliés du Congrès se sont réunis pour se féliciter après l'adoption formelle du vingt-deuxième amendement à la Constitution. L'amendement, qui limite un individu à deux mandats maximum pour la présidence, était bloqué depuis plusieurs années. Cependant, le président et ses alliés ont réussi à relancer le processus de ratification et à garantir que le seuil de majorité des trois quarts dans les législatures des États soit atteint. Le président est félicité pour son sens politique dans la négociation de cette crise constitutionnelle difficile."
amendment_22.13.d:0 "Constat embarrassant pour le président et ses alliés, les efforts visant à achever la ratification du vingt-deuxième amendement sont une fois de plus au point mort. Après des semaines d'efforts, il est clair qu'un nombre suffisant de législatures d'États refusent d'adopter l'amendement, garantissant ainsi que la majorité des trois quarts ne pourra pas être atteinte. Les efforts visant à relancer l'amendement ont nécessité beaucoup de capital politique et de coopération entre la Maison Blanche et le Congrès. Les journaux remettent ouvertement en question la crédibilité politique du président et les émissions de divertissement regorgent de blagues sur un président qui ne peut même pas limiter ses propres mandats."

nixon.1960.d:0 "Le président Richard Nixon a pris le temps de condamner les démocrates du Sud, appelés Dixiecrats, pour leur position ségrégationniste extrême et leur résistance aux droits civiques. Le président a souligné que ces politiciens ont interféré avec les décisions de la Cour suprême et les lois fédérales dans tout le sud. Le discours du président est salué par les militants des droits civiques. Cependant, les opposants au président l'accusent de chercher à exploiter la situation actuelle dans le Sud pour rallier des soutiens au Parti républicain. Les partisans du président rejettent ces critiques et insistent sur le fait qu'il pose simplement le cadre d'une future législation sur les droits civiques."
Operation_Vulture.1.d:0 "L'armée américaine a annoncé le lancement d'opérations de combat contre les forces communistes anti-françaises du Viet Minh en Indochine française. Les bombardiers américains depuis les aérodromes voisins ciblent les points forts clés du Viet Minh alors que d'autres unités de combat pénètrent dans le pays. Les États-Unis estiment que le Viet Minh représente une menace majeure pour la sécurité régionale et celle du peuple vietnamien. Le gouvernement français salue ce soutien et affirme qu'il sera bientôt en mesure de rétablir la sécurité au Vietnam et de parvenir à une résolution honorable du conflit. La réponse mondiale devrait être particulièrement négative de la part des États postcoloniaux, qui considéreront cette action comme un soutien des États-Unis à l'impérialisme européen."
Korean_Refugee_Oregon_TT:0 "§CEnviron 250 000 réfugiés coréens seront évacués vers l'État de l'Oregon, ce qui ajoutera le coréen comme culture présente dans l'Oregon et modifiera également la démographie religieuse de l'État.§!"
Hungarian_Refugees_Wisconsin_TT:0 "§CEnviron 500 000 réfugiés hongrois seront réinstallés dans l'État du Wisconsin, ce qui ajoutera la culture hongroise présente au Wisconsin et modifiera également la démographie religieuse de l'État.§!"
USA_50s_The_American_Armed_Forces:0 "Les forces armées américaines"
USA_50s_The_American_Armed_Forces_desc:0 "Les forces armées américaines ont triomphé dans les deux guerres mondiales, mais nous ne devrions pas nous reposer sur nos lauriers. Nous devons nous assurer que toutes les branches de l'armée sont prêtes pour une Troisième Guerre mondiale, si elle devait survenir."
