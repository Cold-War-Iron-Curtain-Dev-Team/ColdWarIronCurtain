l_french:
 arabia.1.t:0 "Les Arabes demandent à nos colonies"
 arabia.1.d:0 "Aujourd'hui, le diplomate saoudien Ahmut al Pacha nous a apporté une proposition de leur roi. Ils proposent de prendre sous leur contrôle nos colonies de la péninsule arabique. Après les récentes découvertes de pétrole dans cette région, dire non signifierait que nous n'en obtenons plus le pétrole dont nous avons besoin. Que devons-nous faire ?"
 arabia.1.a:0 "Accepter la proposition"
 arabia.1.b:0 "Comment osent-ils !"
 arabia.2.t:0 "Les Britanniques ont cédé à nos demandes"
 arabia.2.d:0 "Après des négociations amicales, la Grande-Bretagne a décidé de nous céder ses colonies de la péninsule arabique contre le droit d'exporter et d'extraire du pétrole dans notre région."
 arabia.2.a:0 "L'Islam va renaître !"
 arabia.3.t:0 "La Grande-Bretagne décline nos demandes"
 arabia.3.d:0 "Les Britanniques ont rejeté nos demandes, ils ne nous laissent pas le choix de mettre fin au commerce du pétrole avec eux et de prendre le territoire par la force."
 arabia.3.a:0 "Nous prendrons ce qui nous appartient !"
arabia.4.t:0 "[GetNewspaperHeader]Quantités commerciales de pétrole découvertes"
 arabia.4.d:0 "Après cinq années de forage infructueux, le puits n°7 a finalement trouvé du pétrole le 3 mars 1938. Cette découverte s'est avérée être la première d'une longue série, révélant finalement la plus grande source de pétrole brut au monde. Cette découverte modifierait à jamais les relations politiques au Moyen-Orient."
 arabia.4.a:0 "Intéressant"
 arabia.4.b:0 "C'est de l'or noir !"
 arabia.5.t:0 "Unissez-vous au Yémen et à Oman"
 arabia.5.d:0 "À mesure que nous avons libéré notre peuple et pris le contrôle légitime de nos territoires historiques, de nombreuses minorités arabes, voire dans certaines régions, des populations majoritaires pourraient être mieux utilisées. En laissant les islamistes fidèles prendre place dans leurs institutions, nous pouvons faire des États d'Oman et du Yémen des États centraux, n'est-ce pas ?"
 arabia.5.a:0 "Nous devons le faire"
 arabia.5.b:0 "Trop d'efforts, je ne fais rien"
 arabia.6.t:0 "Inviter d'Arabie"
 arabia.6.d:0 "Aujourd'hui, le diplomate du califat arabe Mehmet al Pacha nous a présenté une proposition. Il propose de former une alliance défensive entre nos pays islamiques"
 arabia.6.a:0 "Nous accepterons !"
 arabia.6.b:0 "Nous serons seuls !"
 arabia.7.t:0 "[PER.GetNameDef] Rejoint notre pacte"
 arabia.7.d:0 "Il est judicieux de chercher des alliés en ces temps imprévisibles. Nous, les fils de Mahomet, devons nous serrer les coudes et diffuser les enseignements islamiques dans le monde entier."
 arabia.7.a:0 "Accueillir!"
 arabia.8.t:0 "[PER.GetNameDef] Rejeté notre pacte"
 arabia.8.d:0 "L'Iran a refusé notre pacte"
 arabia.8.a:0 "Imbéciles"
 arabia.9.t:0 "Signature d'un accord de concession pétrolière"
 arabia.9.d:0 "Aujourd'hui, après l'accord de concession pétrolière attribué entre l'Arabie Saoudite et la Standard Oil Company, deux géologues américains ont débarqué au petit port de Jubail. Ils étaient venus ouvrir la recherche de pétrole dans la péninsule arabique. Ouvrir les anciens forages pétroliers et donner du travail à beaucoup de nos concitoyens."
 arabia.9.a:0 "Nous bénéficions tous les deux de cet accord"
 arabia.10.t:0 "Unissez-vous aux anciennes colonies britanniques"
 arabia.10.d:0 "À mesure que nous avons libéré notre peuple et pris le contrôle légitime de nos territoires historiques, de nombreuses minorités arabes, voire dans certaines régions, des populations majoritaires pourraient être mieux utilisées. En laissant les islamistes fidèles prendre place dans leurs institutions, nous pouvons faire des anciens États britanniques des États centraux, n'est-ce pas ?"
 arabia.10.a:0 "Nous devons le faire"
 arabia.10.b:0 "Trop d'efforts, je ne fais rien"
 arabia.11.t:0 "L'Arabie nous invite"
 arabia.11.d:0 "Aujourd'hui, le diplomate du califat arabe Mehmet al Pacha nous a présenté une proposition. Il propose de former une alliance défensive entre nos pays islamiques"
 arabia.11.a:0 "Nous accepterons !"
 arabia.11.b:0 "Nous serons seuls !"
 arabia.12.t:0 "[TUR.GetNameDef] Rejoint notre pacte"
 arabia.12.d:0 "Après avoir reçu notre proposition, la Turquie a accepté notre invitation"
 arabia.12.a:0 "Bienvenue, mes frères !"
 arabia.13.t:0 "[TUR.GetNameDef] Rejeté notre pacte"
 arabia.13.d:0 "La Turquie a refusé notre pacte"
 arabia.13.a:0 "Imbéciles"
 arabia.14.t:0 "La chute du Caire"
 arabia.14.d:0 "Les forces armées arabes se sont frayées un chemin jusqu'au Caire, la capitale égyptienne. \n\nAlors que les forces alliées se retiraient plus loin dans le désarroi, les soldats saoudiens marchant dans le Caire furent acclamés comme des libérateurs par de nombreux citoyens qui en étaient venus à considérer les Britanniques comme des oppresseurs.\n\nLa chute du Caire constitue une perte importante pour l'effort de guerre allié, et plusieurs experts ont émis l'hypothèse que toute l'Afrique était désormais ouverte à la conquête arabe."
 arabia.14.a:0 "Nous sommes imparables !"
arabia.15.t:0 "[GetNewspaperHeader]La chute d'Ankara"
 arabia.15.d:0 "Plus tôt dans la journée, les forces du califat arabe ont occupé avec succès la ville d'Ankara, un objectif stratégique vital dans leur guerre contre la Turquie. \n\nSituée au centre de l'Asie Mineure, la ville est la clé de la route arabe vers l'Europe.\n\nSa capture met l'Arabie en position d'étendre la guerre plus loin en Méditerranée."
 arabia.15.a:0 "La victoire nous appartient !"
arabia.16.t:0 "[GetNewspaperHeader]La chute de Bagdad"
 arabia.16.d:0 "Après plusieurs rapports contradictoires, il est désormais confirmé que Bagdad est tombée aux mains des Arabes. \n\nCette ville stratégique garde l'entrée de la route de la soie et de deux rivières vitales, et elle était largement considérée comme imprenable avant le début de la guerre. La garnison irakienne s'est retirée dans les tunnels passant sous la ville, mais a finalement été délogée par des lance-flammes et des grenades. \n\nAvec Bagdad aux mains des Arabes, il y a eu un changement radical de pouvoir dans la bataille du Moyen-Orient"
 arabia.16.a:0 "La victoire nous appartient !"
