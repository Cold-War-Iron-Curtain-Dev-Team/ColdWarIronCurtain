l_french:
 flavorger.1.t:0 "[GetNewspaperHeader]L'automne allemand"
 flavorger.1.d:0 "Hanns Martin Schleyer a été assassiné après des semaines aux mains de la Fraction Armée Rouge. La même nuit, un avion de la Lufthansa détourné a été pris d'assaut à Mogadiscio."
 flavorger.1.a:0 "L'automne est terminé."
 flavorger.1.b:0 "Une sombre nuit en Allemagne."
 flavorger.2.t:0 "[GetNewspaperHeader]Kohl devient chancelier"
 flavorger.2.d:0 "Le Bundestag a démis Helmut Schmidt de ses fonctions. Helmut Kohl est chancelier."
 flavorger.2.a:0 "Kohl est chancelier."
 flavorger.2.b:0 "Bonn a un nouveau chancelier."
 flavorger.3.t:0 "[GetNewspaperHeader]Le mur de Berlin s'ouvre"
 flavorger.3.d:0 "Le mur de Berlin est ouvert. Les Berlinois de l'Est traversent vers l'ouest et les gardes-frontières se tiennent à l'écart."
 flavorger.3.a:0 "La frontière est ouverte."
 flavorger.3.b:0 "Ils se croisent."
 flavorger.3.c:0 "Le Mur est ouvert."
