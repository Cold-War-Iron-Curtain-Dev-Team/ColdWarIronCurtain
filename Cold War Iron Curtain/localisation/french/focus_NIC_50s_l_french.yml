l_french:
 NIC_the_political_climate:0 "Climat politique instable"
 NIC_the_political_climate_desc:0 "Les dernières années ont été marquées par des tensions et des coups d'État, car Anastasio Somoza García a travaillé dur pour maintenir son pouvoir. Bien qu'il ne soit pas président actuellement, il règne dans l'ombre, s'assurant que le président actuel ne s'éloigne pas trop de ses souhaits."
 NIC_somoza_family:0 "Serrez la poignée"
 NIC_somoza_family_desc:0 "La famille Somoza détient le pouvoir au Nicaragua depuis 1936. Les prochaines élections ne devraient pas changer cela et nous devons donc veiller à ce que l'emprise de Somoza soit assurée."
 NIC_purge_the_opposition:0 "Nettoyer l'opposition"
 NIC_purge_the_opposition_desc:0 "Malgré son long règne, nombreux sont ceux qui continuent de s'opposer aux Somozas. Il faut leur faire voir le bon chemin."
 NIC_1950_elections:0 "Élections générales 1950"
 NIC_1950_elections_desc:0 "Les élections approchent à grands pas. Mais grâce à nos efforts, la victoire est assurée pour Somoza."
 NIC_pacto_generales:0 "Pacto de los Generales"
 NIC_pacto_generales_desc:0 "Anastasio Somoza García et Emiliano Chamorro Vargas ont convenu de créer un pacte dans lequel le Parti conservateur se verra accorder un certain nombre de sièges au Congrès en échange du soutien de Vargas à Somoza."
 NIC_loyal_military:0 "Acheter la loyauté militaire"
 NIC_loyal_military_desc:0 "Fidèle jusqu'au bout. Tant que l'argent roule."
 NIC_expand_police_force:0 "Développer les forces de police"
 NIC_expand_police_force_desc:0 "Nous avons besoin d'agents à chaque coin de rue."
 NIC_buisness_empire:0 "L'empire commercial Somoza"
 NIC_buisness_empire_desc:0 "L'empire commercial de Somoza a accumulé des richesses grâce aux pots-de-vin des entreprises, à l'accaparement des terres et au siphonnage de l'aide étrangère. Bien entendu, une nouvelle décennie entraîne de nouvelles richesses."
 NIC_build_port_somoza:0 "Port Somoza"
 NIC_build_port_somoza_desc:0 "À mesure que le pays se développe, un port plus efficace est nécessaire. Pour cela, Somoza a décidé de construire Puerto Somoza dans le département de León."
 NIC_invest_in_airline:0 "Investissements LANICA"
 NIC_invest_in_airline_desc:0 "Líneas Aéreas de Nicaragua est notre compagnie aérienne nationale, fondée en 1945. Elle est maintenant sur le point d'absorber Flota Aérea Nicaragüense, acquérant le contrôle des routes lucratives vers les villes minières de Bonanza et Siuna, au nord."
 NIC_deepend_my_pockets:0 "Mettez de l'argent dans vos poches personnelles"
 NIC_deepend_my_pockets_desc:0 "Personne ne remarquera si de l'argent va sur le compte bancaire personnel de Somoza en Suisse."
 NIC_monitor_the_people:0 "Gardez un oeil sur tout le monde"
 NIC_liberals_54:0 "Parti libéral nationaliste"
 NIC_conseravtives_50:0 "Parti Conservateur"
 NIC_infonac:0 "Créer l'Instituto de Fomento Nacional"
 NIC_infonac_desc:0 "Créé avec de l'argent américain, l'INFONAC est une institution destinée à aider et à moderniser l'économie nicaraguayenne."
 NIC_us_support:0 "\"Notre fils de pute\""
 NIC_us_support_desc:0 "Somoza est peut-être un fils de pute, mais c'est notre fils de pute."
 NIC_textile_stuff:0 "Obtenir des usines textiles"
 NIC_textile_stuff_desc:0 "Au début des années 1950, Anastasio Somoza « nationalisa » certaines usines textiles."
 NIC_us_schools:0 "Créer des écoles avec de l'argent américain"
 NIC_us_schools_desc:0 "Laissons les dollars couler."
 NIC_agracultural:0 "Financer la modernisation agricole"
 NIC_agracultural_desc:0 "Les Somozas ont décidé de financer la modernisation de l'agriculture au Nicaragua. Pas pour être gentils, mais pour augmenter les profits que les Somozas en tirent."
 NIC_highway_projects:0 "Développer l'infrastructure des capitaux"
 NIC_highway_projects_desc:0 "Pour améliorer la mobilité et la connectivité de notre capitale, nous devons investir dans l'expansion et la modernisation de ses infrastructures. En construisant de nouvelles autoroutes, ponts, tunnels et voies ferrées, nous pouvons faciliter la circulation des marchandises, des personnes et des troupes à travers notre pays."
 NIC_banana_republics:0 "Développez les fermes de bananes"
 NIC_banana_republics_desc:0 "United Fruit Company et Standard Fruit Company ont toutes deux exprimé leur intérêt pour l'expansion de nos plantations de bananes."
 NIC_coffee_farms:0 "Agrandir les plantations de café"
 NIC_coffee_farms_desc:0 "Depuis environ 100 ans, le café est notre principale exportation."
 NIC_Guardia_nacional:0 "Garde Nationale"
 NIC_Guardia_nacional_desc:0 "La Garde nationale est une milice et une gendarmerie créées en 1925 lors de l'occupation du Nicaragua par les États-Unis. Le pays est connu pour ses violations des droits de l'homme et sa corruption sous le régime de la famille Somoza."
 NIC_air_force:0 "Fuerza Aérea de La Guardia Nacional"
 NIC_air_force_desc:0 "La « Force aérienne de la Garde nationale nicaraguayenne » (Fuerza Aérea de la Guardia Nacional) a été créée en 1938 et opère sur des avions américains excédentaires."
 NIC_us_garands:0 "Acheter des Garands M1"
 NIC_us_garands_desc:0 "Dans les années 1940 et 1950, le GN a reçu des armes d'infanterie américaines excédentaires - des carabines M1/M2 US.30 et des fusils semi-automatiques M1 Garand US.30-06 remplaçant les anciens Springfield à verrou, les modèles de mitraillettes Thompson M1A1 et M3 \"Grease Gun\" remplaçant l'ancien modèle Thompson M1928A1."
 NIC_favour_banamerica:0 "Favoriser le Groupe Banamérica"
 NIC_favour_banamerica_desc:0 "Le groupe Banamérica, une émanation de l'élite conservatrice de Grenade, possède de puissants intérêts dans le sucre, le rhum, le bétail, le café et la vente au détail."
 NIC_favour_banic:0 "Favoriser le groupe Banic"
 NIC_favour_banic_desc:0 "Le Groupe Banic, ainsi appelé en raison de ses liens avec la Banque nicaraguayenne de l'industrie et du commerce (Banco Nicaragüense de Industria y Comercio-Banic), a ses racines dans les familles libérales de León et a des liens avec les industries du coton, du café, de la bière, du bois, de la construction et de la pêche."
 NIC_m4:0 "Accord sur les chars philippins M4"
 NIC_m4_desc:0 "Les Philippines, confrontées à un déficit budgétaire et à la nécessité de moderniser leurs forces armées, ont décidé de nous vendre certains de leurs anciens chars M4 Sherman. L'accord, d'une valeur de 10 millions de dollars, nous fournira 20 chars qui ont été utilisés sur le théâtre du Pacifique pendant la Seconde Guerre mondiale."
 NIC_m3_lee:0 "Obtenez un surplus de chars M5 Stuart"
 NIC_m3_lee_desc:0 "Le M5 Stuart est un char léger utilisé par les États-Unis et leurs alliés pendant la Seconde Guerre mondiale. Même s'il était surclassé par la plupart des chars ennemis, il était rapide, fiable et facile à entretenir. Nous pouvons obtenir des Américains des surplus de chars M5 Stuart pour renforcer nos forces blindées."
 NIC_Us_aviation:0 "Mission de l'aviation des États-Unis"
 NIC_Us_aviation_desc:0 "Dans le cadre de notre coopération avec les États-Unis, nous avons convenu d'accueillir une mission d'experts et d'instructeurs américains en aviation. Ils nous aideront à moderniser et à entraîner notre force aérienne, et nous fourniront des avions et du matériel excédentaires."
 NIC_p51:0 "P-51 Mustang"
 NIC_p51_desc:0 "Le Nicaragua, en tant qu'allié proche des États-Unis, a pu acquérir des P-51 Mustang excédentaires."
 NIC_pacific_surplus:0 "L'excédent du Pacifique"
 NIC_pacific_surplus_desc:0 "Le Nicaragua, qui a besoin de moderniser son armée de l'air, a profité du surplus du Pacifique et a obtenu une bonne affaire sur certains chasseurs restants."
 NIC_bombers:0 "Attaquez les bombardiers de l'Oncle Sam"
 NIC_bombers_desc:0 "Le Nicaragua, dans le cadre de son programme d'assistance militaire des États-Unis, a reçu des bombardiers d'attaque de l'Oncle Sam."
 NIC_counter_training:0 "Formation contre-insurrectionnelle"
 NIC_counter_training_desc:0 "Le Nicaragua fait face à une opposition croissante de la part de divers groupes politiques et sociaux qui cherchent à renverser la dictature. Pour contrer l'insurrection croissante, [NIC.GetLeader] a décidé d'investir dans la formation anti-insurrectionnelle de sa fidèle Garde nationale. Les États-Unis, préoccupés par la propagation du communisme en Amérique centrale, ont décidé de nous fournir une aide financière et militaire."
 NIC_tax_cuts:0 "Des réductions d'impôts pour les amis"
 NIC_anti_communist:0 "Développer la rhétorique anticommuniste"
 NIC_anti_communist_desc:0 "Pour que les Yankees soient heureux, il suffit d'un peu d'anticommunisme et nos relations soient sécurisées."
 NIC_crackdown_on_labour:0 "Répression contre les syndicats"
 NIC_catholic_support:0 "Autoriser l'aide des missionnaires catholiques"
 NIC_catholic_support_desc:0 "Certaines missions catholiques demandent notre permission pour organiser des services à nos citoyens. Tant que Somoza obtient sa part, cela peut être autorisé."
 NIC_anastasio_killed:0 "Assassinat d'Anastase"
 NIC_tax_cuts_desc:0 "Des dollars pour mes amis, des balles pour mes ennemis."
 NIC_change_Successioin:0 "Modifier la loi sur la succession présidentielle"
 NIC_change_Successioin_desc:0 "Nous avons décidé de modifier la Constitution pour permettre à notre président, Anastasio Somoza García, de briguer un autre mandat. Il est le leader de notre nation depuis 1937. Nous pensons qu'il mérite de poursuivre son travail pour le progrès et la stabilité du Nicaragua, et que personne d'autre ne peut égaler sa vision et son charisme."
 NIC_56_elec:0 "Élections présidentielles de 1957"
 NIC_56_elec_desc:0 "En 1957, le Nicaragua organisera ses premières élections présidentielles depuis la mort d'Anastasio Somoza. Le parti au pouvoir a désigné Luis Somoza Debayle, le fils d'Anastasio, comme candidat, tandis que l'opposition fait face à de nombreux défis et obstacles."
 NIC_american_electric:0 "Inviter des entreprises américaines"
 NIC_american_electric_desc:0 "Nous pouvons offrir une main-d'oeuvre bon marché à des sociétés comme Ford, Socony-Vacuum Oil Company et Coca Cola."
 NIC_accuse_communist:0 "Accuser les communistes au Guatemala et au Costa Rica"
 NIC_accuse_communist_desc:0 "La menace communiste n'est pas seulement présente dans notre propre pays, mais aussi chez nos voisins. Le Guatemala et le Costa Rica ont été infiltrés par des agents soviétiques qui cherchent à saper leur démocratie et leur stabilité. Nous devons dénoncer leurs complots et rallier le peuple contre eux."
 NIC_reshuffle_Guard:0 "Remaniement de la Guardia Nacional"
 NIC_reshuffle_Guard_desc:0 "La Guardia Nacional est l'épine dorsale de notre régime, mais elle est également en proie à la corruption et à l'inefficacité. Nous devons réformer sa structure et sa direction, en remplaçant les officiers peu loyaux par de nouveaux officiers loyaux. Cela garantira notre contrôle sur les militaires et la population. Somoza sait que seule une Guardia forte et fidèle peut le protéger de la marée montante des révolutionnaires qui s'opposent à son régime."
 NIC_currency_deval:0 "Dévaluer la monnaie"
 NIC_cia_help:0 "Assistance secrète de la CIA"
 NIC_cia_help_desc:0 "Afin de contrer la menace communiste en Amérique centrale, nous avons accepté l'aide secrète de la CIA de la part des États-Unis. Ils nous fourniront des renseignements, une formation, des équipements et des fonds pour renforcer nos forces de sécurité et affaiblir nos ennemis."
 NIC_invite_foreign_school:0 "Faites venir des technocrates étrangers"
 NIC_support_costa_invasion:0 "Lancez l'invasion du Costa Rica"
 NIC_support_costa_invasion_desc:0 "Nous avons accepté de soutenir les rebelles calderonistes qui cherchent à renverser le gouvernement de José Figueres Ferrer au Costa Rica. Nous leur permettreons de traverser notre frontière tout en leur fournissant des armes et du matériel."
 NIC_coup_thing:0 "Tentative de coup d'État de 1954"
 NIC_coup_thing_desc:0 "Tentative de coup d'État de 1954"
 NIC_coup_avoided:0 "Coup d'État vaincu"
 NIC_somoza_dfeated:0 "Défaite de Somoza"
 NIC_coup_avoided_desc:0 ""
 NIC_somoza_dfeated_desc:0 ""
 NIC_guarantee_us_support:0 "Assurer le soutien américain"
 NIC_relax_press:0 "Mettre fin à la censure de la presse"
 NIC_amnesty:0 "Accordez l'amnistie aux prisonniers politiques"
 NIC_democratic_constituion:0 "Une Constitution démocratique"
 NIC_free_elecions:0 "Organiser des élections libres"
 NIC_distribute_land:0 "Accorder la terre de Somozas aux paysans"
 NIC_reduce_somoza_influence:0 "Nettoyer la Guardia Nacional des partisans de Somoza"
 NIC_conservative_victory:0 "Parti Conservateur"
 NIC_liberal_victory:0 "Parti libéral indépendant"
 NIC_cuban_invasions:0 "Les invasions cubaines"
 NIC_cuban_invasions_desc:0 "En 1959, le Nicaragua a connu des invasions de guérilleros soutenues par Cuba."
 NIC_repelled:0 "Échec des invasions"
 NIC_repelled_desc:0 ""
 NIC_revolution:0 "Révolution nicaraguayenne"
 NIC_propose_guetemala_ivnasioin:0 "Proposer l'invasion de Guetemala aux États-Unis"
 NIC_propose_guetemala_ivnasioin_desc:0 ""
 NIC_failure_invasion:0 "Les Américains ne sont pas intéressés"
 NIC_failure_invasion_desc:0 "Le secrétaire d'État américain craint que la tentative de coup d'État ne nuise à l'image des États-Unis, qui se sont engagés dans une politique de non-intervention et ont donc mis fin à l'opération."
 NIC_go_ahead:0 "Approbation américaine"
 NIC_venezuelan_help:0 "Demander de l'aide au Venezuela"
 NIC_venezuelan_help_desc:0 "Historiquement, le Venezuela a fourni un soutien financier aux rebelles et, semble-t-il, un soutien aérien."
 NIC_calderons_offer:0 "Offre Calderons"
 NIC_calderons_offer_desc:0 "Peut-être que Calderon pourrait aider à débarrasser le Costa Rica des communistes ?"
 NIC_bribe_friends:0 "Acheter des amis"
 NIC_patriotic_education:0 "Introduire le patriotisme dans l'éducation"
 NIC_patriotic_education_desc:0 "Nous devons veiller à ce que nos jeunes soient fidèles à notre nation et à ses valeurs. Nous introduirons l'éducation patriotique dans nos écoles et universités, en enseignant à nos étudiants l'histoire et la culture du Nicaragua, ainsi que les réalisations et les défis de notre gouvernement actuel. Nous promouvrons également le service civique et militaire comme un devoir et un honneur pour chaque citoyen."
 NIC_prepare_for_elections:0 "Assurer la victoire électorale à venir"
 NIC_prepare_for_elections_desc:0 "Luis Somoza Debayle a officialisé son emprise sur la présidence par des élections frauduleuses en février 1957 qui ont été boycottées par toute l'opposition, à l'exception du Parti nationaliste conservateur fantoche."
 NIC_amnesty_decree:0 "Amnistie N° 38"
 NIC_amnesty_decree_desc:0 "Dans le but d'apaiser les tensions et d'apaiser l'opposition, le gouvernement a publié un décret d'amnistie accordant la grâce à ceux qui ont participé au soulèvement de 1956. Cependant, nombreux sont ceux qui y voient une mesure cynique qui ne s'attaque pas aux causes profondes du conflit, et certains craignent qu'elle puisse être utilisée comme prétexte pour identifier et persécuter les dissidents."
 NIC_unveristy_autonomy:0 "Décret exécutif n° 38"
 NIC_unveristy_autonomy_desc:0 "Les étudiants mécontents continuent de revendiquer l'autonomie de l'université. Pour mettre un terme à cette situation, Luis Somoza a accepté de signer le décret exécutif n° 38, qui accorde l'autonomie par rapport au contrôle gouvernemental à l'Université nationale du Nicaragua, située à León."
 NIC_loose_poltiical_repe:0 "Réduire légèrement la représentation politique"
 NIC_living_standards:0 "NIC_living_standards"
 NIC_mokoronazo:0 "Le Mokoronazo"
 NIC_mokoronazo_desc:0 "Lors de son discours d'investiture au Stade National, Luis Somoza a annoncé que peu avant de quitter sa maison pour l'inauguration, il avait été informé que dans la ville de Mokorón, située à la frontière avec le Honduras, des soldats de ce pays avaient massacré 35 membres de la Garde nationale. Cette annonce a provoqué une réaction nationaliste populaire et un soutien de tous les secteurs, y compris de l'opposition politique. Bien entendu, tout cela n'est qu'une ruse astucieuse pour atténuer l'excitation politique du moment."
 NIC_agree_to_stop:0 "Rien de plus"
 NIC_full_invasion:0 "Escalade du conflit"
 NIC_limit_familiar_power:0 "\"Limiter\" le pouvoir de la famille Somoza"
 NIC_limit_familiar_power_desc:0 "Dans l'intention de réduire les troubles citoyens provoqués par l'existence de la dynastie Somoza et de préparer l'environnement pour les prochaines élections, Luis Somoza a envoyé au Congrès une réforme constitutionnelle avec un message évident à la population qu'à la fin de son mandat il n'y aura pas de réélection et qu'aucun de ses proches ne pourra aspirer à la présidence de la République."
 NIC_womens_rights:0 "Chercher à améliorer les droits des femmes"
 NIC_womens_rights_desc:0 "Luis Somoza Debayle a montré un certain intérêt pour l'amélioration de la situation des femmes au Nicaragua, qui sont confrontées à la discrimination et aux inégalités dans de nombreux aspects de la vie. Il a proposé certaines réformes pour accorder aux femmes davantage de droits et d'opportunités, comme le droit de vote, l'éducation et les soins de santé. Cependant, ces réformes se heurtent à la résistance des secteurs conservateurs de la société, qui craignent qu'elles ne portent atteinte aux valeurs et aux rôles traditionnels de la culture nicaraguayenne."
 NIC_sham_democracy:0 "Fausse démocratie"
 NIC_ally_with_former_somozian:0 "Allier avec les anciens partisans de Somoza"
 NIC_invest_in_education:0 "Augmenter le budget de l'éducation"
 NIC_agracultural_price_contgrol:0 "Limiter les prix agricoles"
 NIC_imporve_east:0 "Investir dans l'est du Nicaragua"
 NIC_expand_freight_network:0 "Développer les réseaux de fret"
 NIC_reduce_governemt_ownership:0 "Réduire davantage la propriété gouvernementale des entreprises"
 NIC_limted_pensions:0 "Adopter un programme de retraite limité"
 NIC_hunt_somoza_allies:0 "Trouver et arrêter les alliés de Somozas"
 NIC_efficent_goverment:0 "Un gouvernement efficace"
 NIC_end_banana_republic:0 "Abolir la « República Bananera »"
 NIC_invest_eastern_nicaragau:0 "Investir dans l'est du Nicaragua"
 NIC_invest_eastern_nicaragau_desc:0 "Pourquoi n'avez-vous pas investi dans l'est du Nicaragua ?"
 NIC_healthcare:0 "Élargir considérablement l'accès aux soins de santé"
 NIC_improve_indigios_rights:0 "Améliorer les droits autochtones"
 NIC_media_rights:0 "Garantir la liberté des médias"
 NIC_nsp:0 "Révolution étudiante"
 NIC_nsp_desc:0 ""
 NIC_fln:0 "Front de libération nationale du Nicaragua"
 NIC_maintain_anti_communist:0 "Maintenir l'anticommunisme"
 NIC_che_guerva:0 "Guerrillero Heroico"
 NIC_che_guerva_desc:0 "Sans le Che, cette révolution ne serait pas possible. Il est donc tout à fait logique de lui offrir la direction de notre nouvelle nation."
 NIC_drive_somozas_out:0 "Le destin du "
 NIC_proper_salery:0 "Garantir une vente vivable"
 NIC_decentralisation:0 "Décentraliser le gouvernement"
 NIC_compensate_ww2_germans:0 "Compenser les saisies d'actifs allemands"
 NIC_compensate_ww2_germans_desc:0 "Pendant la Seconde Guerre mondiale, le gouvernement a confisqué les propriétés de la petite communauté allemande du Nicaragua, mais économiquement influente, et les a vendues à Somoza et à sa famille à des prix considérablement réduits. Nous devons maintenant remédier à cette situation et offrir une compensation adéquate aux victimes."
 NIC_neutralityy:0 "Neutralité nicaraguayenne"
 NIC_morality:0 "Assurer la moralité sociale"
 NIC_fate_of_pln:0 "Le sort du PLN"
 NIC_fate_of_pln_desc:0 "Le Parti Libéral Nationaliste était le parti de Somoza. Cependant, tout le monde n'était pas un véritable partisan de Somoza. Peut-être pourrions-nous fusionner le parti avec nous ? Ou devrions-nous l'abolir complètement ?"
 NIC_develop_capital:0 "Développer la capitale"
 NIC_blind_eye:0 "Regardez de l'autre côté"
 NIC_blind_eye_desc:0 "Jeux de hasard, prostitution, tout est permis tant qu'Anastasio obtient sa part."
 NIC_blame_cuba:0 "Rompre les relations avec Cuba"
 NIC_blame_cuba_desc:0 "Nos rapports de renseignement suggèrent que Castro a quelque chose à voir avec les récentes invasions."
 NIC_capital_toiurism:0 "Transformez Managua en haut lieu touristique"
 NIC_capital_toiurism_desc:0 "Managua est la capitale et la plus grande ville du Nicaragua, mais c'est aussi une mine d'or potentielle pour le tourisme. Nous avons un lac magnifique, une histoire riche et une culture dynamique. Nous devons investir dans l'amélioration des infrastructures et des attractions de la ville et la promouvoir en tant que destination auprès des visiteurs du monde entier. Nous pouvons nous inspirer de l'exemple de Cuba, qui a dynamisé son économie en ouvrant ses portes aux touristes."
 NIC_palcate_the_people:0 "Des améliorations apparentes pour les gens"
 NIC_palcate_the_people_desc:0 "Nous pouvons promettre beaucoup, mais donner peu."
 NIC_deal_with_mafia:0 "Qu'est-ce que la corruption ?"
 NIC_deal_with_mafia_desc:0 "Qu'est-ce que la corruption ? Il n'y a pas de corruption ici."
 NIC_anti_coomunist:0 "Stimuler l'épargne des ménages"
 NIC_spanish_trade:0 "Commerce espagnol limité"
 NIC_elite_schools:0 "Financer des écoles d'élite"
 NIC_american_arms:0 "Fabrique d'armes américaine"
 NIC_american_Loans:0 "Prêts américains bon marché"
 NIC_religios_stuff:0 "Augmenter les droits religieux"
 NIC_rural_farms:0 "Accorder plus de terres aux agriculteurs"
 NIC_computers_us:0 "Inviter IBM"
 NIC_ensure_demoicracy:0 "S'engager pour la démocratie"
 NIC_paramilitary:0 "Créer \"Escuadrón de Protección\""
 NIC_paramilitary_desc:0 "Pour assurer sa sécurité personnelle et sa domination politique, Anastasio Somoza Garcia décide de former une unité spéciale de soldats loyaux et bien entraînés au sein de la Garde nationale. Cette force d'élite, connue sous le nom d'« Escuadrón de Protección » ou Escadron de Protection, lui servira de garde privée et de force de frappe contre tout ennemi ou rebelle potentiel."
 NIC_bread_and_ciruc:0 "Pain et cirques"
 NIC_bread_and_ciruc_desc:0 "Pour détourner la population des problèmes politiques et économiques du pays, le gouvernement a décidé d'investir dans le divertissement public et la protection sociale. En organisant des festivals, des événements sportifs et des activités culturelles, ainsi qu'en fournissant des subventions alimentaires et une aide sociale, le gouvernement espère créer un sentiment de bonheur et de loyauté parmi la population, ou du moins l'empêcher de rejoindre l'opposition."
 NIC_national_guard:0 "Fonds supplémentaires pour la Guardia Nacional"
 NIC_national_guard_desc:0 "La Garde nationale du Nicaragua est le principal pilier du régime Somoza, car elle contrôle les fonctions militaires et policières du pays. Le gouvernement a décidé d'allouer des fonds supplémentaires à la Garde nationale, afin d'améliorer son équipement, sa formation et sa fidélisation. Cela permettra à la Garde nationale de faire face plus efficacement à toute menace interne ou externe, ainsi que de maintenir l'ordre et la stabilité au Nicaragua."

our_bitch:0 "Notre fils de pute"