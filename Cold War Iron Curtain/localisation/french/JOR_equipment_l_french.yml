 JOR_jet_light_equipment_3:0 "Chasseur de la liberté Northrop F-5A"
 JOR_jet_light_equipment_3_short:0 "Chasseur de la liberté F-5A"
 JOR_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de combat léger destiné principalement à l'exportation. Il est plus léger et moins cher à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour remplacer les escadrons de chasseurs à courte portée. Malgré cela, ce type s'est avéré assez agile et était l'avion le plus proche pour rivaliser avec le MiG-21 « Fishbed » soviétique. Parce qu'il a été utilisé par la majorité des alliés de l'Amérique au plus fort de la guerre froide, il a été appelé à juste titre « Freedom Fighter »."
 JOR_jet_light_equipment_4:0 "Chasseur de la liberté Northrop F-5B"
 JOR_jet_light_equipment_4_short:0 "Chasseur de la liberté F-5B"
 JOR_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par la Royal Norwegian Airforco. Principalement utilisé comme entraîneur d'introduction pour d'autres avions à réaction multirôles, il disposait de points d'attache pour les ordonnances."
 JOR_jet_light_equipment_5:0 "CASA C-101 Aviojet"
 JOR_jet_light_equipment_5_short:0 "C-101 Aviojet"
 JOR_jet_light_equipment_5_desc:0 "Le CASA C-101 Aviojet est un avion d'entraînement avancé et d'attaque léger monomoteur à réaction à aile basse conçu et fabriqué par la compagnie aéronautique espagnole Construcciones Aeronáuticas SA (CASA). "

