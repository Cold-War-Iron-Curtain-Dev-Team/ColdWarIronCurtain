 JOR_jet_multirole_equipment_8:0 "Northrop F-5E Tigre II"
 JOR_jet_multirole_equipment_8_short:0 "F-5E Tigre II"
 JOR_jet_multirole_equipment_8_desc:0 "La RJAF a acquis des Northrop F-5 Tiger via l'Iran sous le règne du Shah qui les a achetés aux États-Unis."
 JOR_jet_multirole_equipment_9:0 "Northrop F-5E(M) Tigre II"
 JOR_jet_multirole_equipment_9_short:0 "F-5E(M) Tigre II"
 JOR_jet_multirole_equipment_9_desc:0 "Les programmes de modernisation se sont poursuivis avec sept F-5E vendus à Singapour et certains financements ont été utilisés pour moderniser la plupart des autres avec le radar AN/APG-67 (trouvé sur le Northrop F-20 Tigershark avorté, autrefois un avion en cours d'évaluation par la RJAF), des systèmes de contrôle de tir modernes et des AAM à portée visuelle (WVR), mettant ainsi le F-5 à égalité avec les avions plus modernes en termes d'électronique. Malgré cela, les F-5 n'ont pas de capacité de combat BVR."
