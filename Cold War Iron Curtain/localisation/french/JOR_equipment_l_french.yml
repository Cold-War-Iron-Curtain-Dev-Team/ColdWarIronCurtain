 #Mechanized APC
 JOR_mechanized_equipment_1:0 "Support universel"
 JOR_mechanized_equipment_1_short:0 "Support universel"
 JOR_mechanized_equipment_2:0 "Demi-chenille M5"
 JOR_mechanized_equipment_2_short:0 "Demi-chenille M5"
 #JOR_mechanized_equipment_3:0 "BTR-40"
 #JOR_mechanized_equipment_3_short:0 "BTR-40"
 JOR_mechanized_equipment_4:0 "FV603 Sarrasin"
 JOR_mechanized_equipment_4_short:0 "FV603 Sarrasin"
 JOR_mechanized_equipment_5:0 "M113"
 JOR_mechanized_equipment_5_short:0 "M113"
 JOR_mechanized_equipment_5_desc:0 "Les APC américains les plus reconnaissables depuis les années 60. Il est largement utilisé et, grâce à des années de recherche, il en a fait un véritable véhicule blindé de transport de troupes, en utilisant sa hauteur, son angle de blindage et son épaisseur. Et plus tard, introduisant de plus en plus de variantes, s'armant d'un M2 Browning.50 Cal avec quelques milliers de tours de liberté. Se vante vraiment d'être un bon APC. Des dizaines de variantes provenaient de la gamme du M113, toujours utilisée par l'armée américaine à ce jour."
 JOR_mechanized_equipment_6:0 "M113A1"
 JOR_mechanized_equipment_6_short:0 "M113A1"
 JOR_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), pour profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 JOR_mechanized_equipment_7:0 "FV103 Spartiate"
 JOR_mechanized_equipment_7_short:0 "FV103 Spartiate"
 JOR_mechanized_equipment_8:0 "M113A2MK-1J"
 JOR_mechanized_equipment_8_short:0 "M113A2MK-1J"
 JOR_mechanized_equipment_8_desc:0 "Mise à niveau vers la configuration Jordan. En 1987, d'autres améliorations pour une « survie améliorée (sur le champ de bataille) » ont été introduites. Cela comprenait un joug pour la direction au lieu des latéraux, un moteur plus puissant (le Detroit Diesel turbocompressé 6V-53T), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une protection améliorée. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau vers la norme A3."
 JOR_mechanized_equipment_9:0 "M113A2MK-2J"
 JOR_mechanized_equipment_9_short:0 "M113A2MK-2J"
 JOR_mechanized_equipment_9_desc:0 "Mise à niveau vers la configuration Jordan. En 1987, d'autres améliorations pour une « survie améliorée (sur le champ de bataille) » ont été introduites. Cela comprenait un joug pour la direction au lieu des latéraux, un moteur plus puissant (le Detroit Diesel turbocompressé 6V-53T), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une protection améliorée. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau vers la norme A3."
 JOR_mechanized_equipment_10:0 "Plate-forme blindée polyvalente KADDB"
 JOR_mechanized_equipment_10_short:0 "CARTE"
 JOR_mechanized_equipment_10_desc:0 "la plate-forme blindée polyvalente ou MAP est un véhicule blindé de transport de troupes lourd. Il a été développé par le Bureau de conception et de développement du roi Abdallah II (KADDB). Il s'agit d'une conversion du char de combat principal Tariq (version améliorée du Centurion)."

 #Motorized
 JOR_motorized_equipment_1:0 "Bedford QL"
 JOR_motorized_equipment_1_short:0 "Bedford QL"
 JOR_motorized_equipment_2:0 "M35"
 JOR_motorized_equipment_2_short:0 "M35"
 JOR_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé lors de chaque conflit américain de 1950 à 1988. Le M35 utilise un moteur OA-331 avec une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 lb. Il peut se déplacer à 58 mph sur 300 miles et obtient 8 mi/gal. Il a été largement utilisé par les États-Unis et nombre de leurs alliés dans le monde. Il a été construit pour remplacer le GMC CCKW après la guerre et fournir un véhicule plus robuste et plus rapide. "
 JOR_motorized_equipment_3:0 "M809"
 JOR_motorized_equipment_3_short:0 "M809"
 JOR_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 utilise un moteur NH250, une transmission à 5 vitesses/2 gammes et des essieux à poutre dynamique sur ressorts à lames. Il peut transporter une charge de 5 000 lb. Il a une vitesse de 52 mph sur 350 miles et obtient 10 mi/gal. En plus d'être utilisé pour le transport et le fret, le véhicule est très solide et peut supporter des composants utilitaires sur son plateau. Ceux-ci incluent la possibilité de monter des kits de dépanneuse, des bennes, des remorques, de grandes fourgonnettes pour le soutien/confort, des équipements de pontage et quelques autres. Le M809 peut également traverser des rivières peu profondes grâce à sa garde au sol élevée et est très efficace sur route ou hors route grâce à sa suspension. "
 JOR_motorized_equipment_4:0 "M939"
 JOR_motorized_equipment_4_short:0 "M939"
 JOR_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis 1982. Le M939 utilise un moteur 6CTA8.3, une transmission à 5 vitesses/2 gammes et des essieux à poutre sur suspension à ressorts à lames. Le véhicule est capable de transporter une charge de 10 000 lb. Il peut se déplacer à 6,3 mph sur 350 miles et obtient 6 mi/gal. Il est toujours utilisé aujourd'hui. Le M939 est très efficace sur tous les terrains et convient bien aux intempéries. Le M939 a permis une nouvelle génération de camions, de moteurs principaux et de véhicules de dépannage et a fait l'objet d'une fabrication intensive. Il est plus fiable et plus résistant que les véhicules précédents et a complètement supplanté les contrats de production antérieurs. "
 JOR_motorized_equipment_5:0 "Famille Oshkosh de véhicules tactiques moyens 6x6"
 JOR_motorized_equipment_5_short:0 "FMTV 6x6"
 JOR_motorized_equipment_5_desc:0 "La famille de véhicules tactiques moyens (FMTV) est une série de véhicules, basés sur un châssis commun, qui varient en fonction de la charge utile et des exigences de la mission. Le FMTV est dérivé du camion autrichien Steyr 12 M 18, mais considérablement modifié pour répondre aux exigences de l'armée américaine, celles-ci comprenant un minimum de 50 pour cent de contenu américain."

 
