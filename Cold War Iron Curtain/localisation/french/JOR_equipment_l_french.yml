##Jordanian Firearms

 JOR_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 JOR_infantry_equipment_0_short:0 "SMLE n°4"
 JOR_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 JOR_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 JOR_infantry_equipment_1_short:0 "FN FAL"
 JOR_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 JOR_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16"
 JOR_infantry_equipment_2_short:0 "M16"
 JOR_infantry_equipment_2_desc:0 "Les responsables militaires américains ont noté que la carabine M2 était largement surclassée par l'AK47 et le StG44 allemand et, en 1956, le développement du M16 a commencé. En 1959, l'arme fut achevée par Eugene Stoner et James Sullivan. Il affichait des capacités exceptionnelles et surclassait l'AK47 et l'AKM. Plus particulièrement, l'arme a beaucoup plus de puissance de feu que la carabine M2 et était plus précise que l'AK47 et transportait des munitions plus légères avec une perte de compétence minimale. Cependant, bien qu'il ait surclassé l'AK47 dans les tests généraux, il présentait une faible fiabilité qui pouvait l'empêcher d'être considéré comme son égal. Surtout au Vietnam, où les échecs étaient très fréquents."

 JOR_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 JOR_infantry_equipment_3_short:0 "M16A2"
 JOR_infantry_equipment_3_desc:0 "Après le manque de fiabilité fréquent de l'arme dans les jungles du Vietnam, le corps des marines américains a demandé une refonte de l'arme. En 1982, la refonte et les améliorations ont été apportées. L'arme comportait un récepteur renforcé, de nouvelles rayures, un boîtier renforcé, un meilleur refroidissement grâce à différents matériaux, un support amélioré pour les éléments attachables et un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Il a été témoin de combats au Liban, en Libye, en Égypte et dans tous les autres conflits dans lesquels les États-Unis ont participé depuis leur création."

 JOR_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4 "
 JOR_infantry_equipment_4_short:0 "Carabine M4"
 JOR_infantry_equipment_4_desc:0 "La carabine M4 est une nouvelle amélioration par rapport au M16A2. Il a été initialement commandé pour être conçu par une grande équipe ad hoc de concepteurs en 1984 et le développement s'est terminé en 1993. Après 9 ans de développement, j'espère que cela aurait valu la peine d'attendre. Il présente un plus grand niveau de fiabilité et est beaucoup plus léger et plus court. Principalement grâce à des matériaux améliorés, il est plus précis que le M16A2. Sa taille compacte le rend plus polyvalent et plus facile à utiliser que le M16A2. La carabine M4 a été utilisée lors de la guerre américaine en Afghanistan, de la guerre en Irak et de la guerre contre l'Etat islamique."
 
 
