 JOR_mbt_equipment_2_short:0 "Aurige Mk.VII"
 JOR_mbt_equipment_3:0 "Centurion Mk.3"
 JOR_mbt_equipment_3_short:0 "Centurion Mk.3"
 JOR_mbt_equipment_4:0 "M48A1 Patton"
 JOR_mbt_equipment_4_short:0 "M48A1 Patton"
 JOR_mbt_equipment_5:0 "Char de combat, entièrement chenillé, canon de 105 mm, M60"
 JOR_mbt_equipment_5_short:0 "M60 Patton"
 JOR_mbt_equipment_5_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 JOR_mbt_equipment_6:0 "Char de combat, entièrement chenillé, canon de 105 mm, M60A3 TTC"
 JOR_mbt_equipment_6_short:0 "M60A3 TTC Patton"
 JOR_mbt_equipment_6_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 JOR_mbt_equipment_7:0 "KADDB FV4030 Al-Hussein"
 JOR_mbt_equipment_7_short:0 "Al-Hussein"
 JOR_mbt_equipment_7_desc:0 "Le Bureau de conception et de développement du roi Abdallah II a modernisé les Challengers jordaniens et est devenu connu sous le nom d'Al-Hussein. Plusieurs variantes locales."
 #JOR_mbt_equipment_8:0 ""
 #JOR_mbt_equipment_8_short:0 ""
 #JOR_mbt_equipment_8_desc:0 ""
 JOR_mbt_equipment_9:0 "KADDB FV4030 Al-Hussein avec tourelle Falcon"
 JOR_mbt_equipment_9_short:0 "Faucon d'Al-Hussein"
 JOR_mbt_equipment_9_desc:0 "La tourelle Falcon est une tourelle de char de combat principale à profil bas en cours de développement par le bureau de conception et de développement du roi Abdallah II en Jordanie, avec l'assistance technique de l'Afrique du Sud. Dotée d'un chargeur automatique et capable de monter l'actuel canon à âme lisse GTC de 120 mm de RUAG Defence Systems, la tourelle était censée être installée sur le Challenger 1 de Jordanie et d'autres chars de combat principaux, et être disponible pour l'exportation. Fonctionnant de la même manière qu'une station d'armes à distance, il permet à tout l'équipage d'être situé à l'intérieur de la coque du char plutôt que dans la tourelle, donnant au véhicule un profil plus bas et à l'équipage une protection supplémentaire."

