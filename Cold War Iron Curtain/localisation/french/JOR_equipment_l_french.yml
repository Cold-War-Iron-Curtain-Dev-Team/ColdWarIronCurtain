##Jordanian Air Force

 JOR_fighter_equipment_0:0 "Force aérienne royale jordanienne"
 JOR_fighter_equipment_0_short:0 "Force aérienne royale jordanienne"
 JOR_fighter_equipment_0_desc:0 "La Royal Jordanian Air Force (Silah ul-Jawu al-Malaki 'al-Urduni') est l'armée de l'air des forces armées jordaniennes. La Jordanie a obtenu son indépendance en 1946, mais ses premières bases aériennes avaient été créées en 1931 par la Royal Air Force. En 1948, la Jordanie commença à développer une petite arme aérienne connue sous le nom de Force aérienne de la Légion arabe (ALAF). La Royal Air Force a contribué à la formation de cette petite arme aérienne et a fourni du matériel. Le principal chasseur de l'ALAF était le de Havilland Vampire et un Vickers VC.1 Viking était exploité comme avion VIP destiné au roi de Jordanie."


