 JOR_attack_helicopter_equipment_2:0 "Bell AH-1E Cobra"
 JOR_attack_helicopter_equipment_2_short:0 "AH-1E Cobra"
 JOR_attack_helicopter_equipment_2_desc:0 "L'AH-1S de base est un AH-1Q amélioré avec un turbomoteur T53-L-703 de 1 800 shp (1 300 kW). L'AH-1S est équipé du sous-système de missile M65 TOW/Cobra, de l'unité de visée télescopique (TSU) M65 et du viseur Reflex M73."
 JOR_attack_helicopter_equipment_3:0 "Bell AH-1F Cobra"
 JOR_attack_helicopter_equipment_3_short:0 "AH-1F Cobra"
 JOR_attack_helicopter_equipment_3_desc:0 "L'AH-1F intègre toutes les mises à niveau des étapes 1 et 2 de l'AH-1S. Il comportait également des mises à niveau de l'étape 3 ; un affichage tête haute, un télémètre laser, un brouilleur infrarouge monté au-dessus de l'échappement du moteur, un système d'échappement du moteur à suppression infrarouge et le sous-système de données aériennes M143 (ADS). L'AH-1F est également appelé « AH-1S modernisé », « AH-1S Modernized Cobra » ou « AH-1S(MC) » avant 1988."

