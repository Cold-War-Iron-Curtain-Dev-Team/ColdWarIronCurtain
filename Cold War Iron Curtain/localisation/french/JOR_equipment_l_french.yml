 JOR_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Faucon Noir"
 JOR_utility_helicopter_equipment_6_short:0 "UH-60L Faucon Noir"
 JOR_utility_helicopter_equipment_6_desc:0 "Une mise à niveau de l'UH-60A, la variante « L » du « Blackhawk » comprend des moteurs améliorés, une boîte de vitesses à durabilité améliorée et un système de commandes de vol mis à jour. Introduit en 1990, l'UH-60L est la principale variante de la variante utilitaire du H-60 actuellement en service dans l'armée américaine, avec des considérations sur le type utilisé pour remplacer l'UH-1N dans l'US Air Force."
 JOR_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Faucon Noir"
 JOR_utility_helicopter_equipment_7_short:0 "UH-60M Faucon Noir"
 JOR_utility_helicopter_equipment_7_desc:0 "Pales de rotor à large corde de conception améliorée, moteurs T700-GE-701D (max 2 000 shp ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur du système de gestion intégré de la santé du véhicule (IVHMS) et nouveau cockpit en verre."
