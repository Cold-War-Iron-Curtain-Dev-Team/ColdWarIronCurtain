l_french:
 NATO.1.t:0 "[From.GetName] et l'OTAN"
 NATO.1.d:0 "[From.GetName] est membre de l'OTAN. Si nous leur déclarons la guerre, ils auront la possibilité d'appeler d'autres membres de l'OTAN à la guerre. Cela signifie qu'il est fort probable que nous nous retrouvions en guerre avec la majorité des membres de l'OTAN."
 NATO.1.a:0 "Noté"
 NATO.2.t:0 "Appeler l'OTAN aux armes ?"
 NATO.2.d:0 "Nous avons été attaqués par une puissance étrangère. En tant que membre de l'OTAN, nous pouvons invoquer l'article 5 du traité, qui obligerait les autres pays de l'OTAN à nous aider."
 NATO.2.a:0 "Appelez l'OTAN"
 NATO.2.b:0 "Nous pouvons gérer ça"
 NATO.3.t:0 "[From.GetName] Appels à l'aide !"
 NATO.3.d:0 "[From.GetName] a été attaqué par un autre pays, et ils ont invoqué l'article 5 de l'OTAN. Cela signifie que nous devons les aider dans leur guerre"
 NATO.3.a:0 "Nous devons aider nos alliés !"
 NATO.3.b:0 "Peut-être rester en dehors de ça ?"
 NATO.4.t:0 "Démobilisation de l'OTAN"
 NATO.4.d:0 "Maintenant que la menace contre un membre de l'OTAN a été écartée, l'alliance militaire entre ces pays peut être dissoute. L'OTAN se mobilisera à nouveau si un autre membre est attaqué."
 NATO.4.a:0 "D'accord"
 NATO.5.t:0 "L'OTAN se démobilise"
 NATO.5.d:0 "Maintenant que la menace contre un membre de l'OTAN a été écartée, l'alliance militaire entre ces pays peut être dissoute. L'OTAN se mobilisera à nouveau si un autre membre est attaqué."
 NATO.5.a:0 "D'accord"
 NATO.6.t:0 "[GetNewspaperHeader][From.GetName] Quitte l'OTAN"
 NATO.6.d:0 "Le gouvernement [From.GetName] a annoncé qu'il quitterait l'OTAN. Ils ont déclaré que l'alliance ne répond plus à leurs besoins et qu'ils ne se sentent plus à l'aise de travailler avec leurs anciens alliés."
 NATO.6.a:0 "Intéressant"
 NATO.7.t:0 "[From.GetName] Cherche à devenir membre de l'OTAN"
 NATO.7.d:0 "[From.GetName] a manifesté son intérêt à devenir membre de l'OTAN. Ils recevront un plan d'action pour l'adhésion, après quoi ils devront obtenir l'approbation de tous les membres existants de l'OTAN pour devenir un nouveau membre."
 NATO.7.a:0 "De nouveaux alliés ?"
 NATO.8.t:0 "[GetNewspaperHeader][From.GetName] Rejoint l'OTAN"
 NATO.8.d:0 "[From.GetName] a été accepté pour rejoindre l'OTAN. Ils font désormais partie de l'alliance militaire et ils la rejoindront pour défendre leurs alliés, et leurs nouveaux alliés sont prêts à les défendre."
 NATO.8.a:0 "Intéressant"
 NATO.20.t:0 "[From.GetName] est expulsé de l'OTAN"
 NATO.20.d:0 "Après une attaque perfide contre un autre membre de l'OTAN, nous avons décidé d'expulser [From.GetName]. Ils paieront pour cela. Nous sommes unis contre tous les ennemis, même nos anciens alliés !"
 NATO.20.a:0 "Bien"
 NATO.201.t:0 "[GetNewspaperHeader][From.From.GetName] est expulsé de l'OTAN"
 NATO.201.d:0 "Dans une tournure effrayante des événements, les forces armées de [From.From.GetNameDef] ont lancé une incursion militaire contre [Prev.GetNameDef] dans une attaque non provoquée.\nÀ la lumière de cette récente agression, les forces de la coalition de l'OTAN ont rapidement retiré [From.From.GetNameDef] de l'Accord de l'Alliance internationale, les dénonçant formellement pour cet acte d'agression flagrant ; pas seulement contre [Prev.GetNameDef], mais contre la stabilité du monde occidental lui-même !\n\nLe rideau de fer commence à rouiller..."
 NATO.201.a:0 "Inquiétant"

 NUKE_LEVEL:0 "Il faudra [?THIS.radiation] mois pour que les radiations cessent d'affecter cet état"
 INSURGENCY_LEVEL:0 "L'insurrection dans cet État a une force militaire relative de [?THIS.insurgency_strength] une fois qu'elle atteint 200, elle peut se révolter, si elle est maintenue à 0 ou en dessous pendant un certain temps, elle peut réprimer le mouvement."
 #### NATO ####
 NATO_decisions:0 "Adhésion à l'OTAN"
 NATO_decisions_desc:0 "L'OTAN, ou l'Organisation du Traité de l'Atlantique Nord §C§! \nest une alliance militaire entre plusieurs pays du Nord \nPays américains et européens"
 leave_NATO:0 "Quitter l'OTAN"
 leave_NATO_desc:0 "Nous n'avons plus intérêt à faire partie de l'OTAN"
 become_NATO_aspirant:0 "Devenez un pays candidat à l'OTAN"
 become_NATO_aspirant_desc:0 "Les pays candidats à l'OTAN sont des États qui ont manifesté leur intérêt à devenir membres de l'OTAN. Après avoir manifesté notre intérêt pour l'OTAN, nous obtiendrons un plan d'action pour l'adhésion, qui nous fixera des objectifs à atteindre avant de pouvoir y adhérer. Une fois les objectifs atteints, nous pourrons entamer les négociations d'adhésion, ce qui nécessitera l'approbation de tous les membres existants de l'OTAN."
 finish_NATO_membership_action_plan:0 "Terminer le plan d'action pour l'adhésion"
 finish_NATO_membership_action_plan_desc:0 "En finalisant le plan d'action pour l'adhésion que nous a imposé l'OTAN, nous pouvons entamer les négociations d'adhésion avec les membres existants. Chaque membre existant de l'OTAN doit approuver notre candidature. Notre statut restera celui de candidat à l'OTAN jusqu'à ce que tous les membres aient approuvé notre candidature."
 ratify_country_accession:0 "Ratifier l'adhésion de [From.GetName]à l'OTAN"
 ratify_country_accession_desc:0 "[From.GetName] a terminé son plan d'action pour l'adhésion. Il ne nous reste plus qu'à ratifier, avec les autres membres de l'OTAN, leur adhésion, après quoi ils deviendront membres à part entière de l'OTAN."
 join_NATO:0 "Rejoindre l'OTAN"
 join_NATO_desc:0 "Tous les autres membres de l'OTAN ont ratifié notre adhésion à l'OTAN. Nous pouvons désormais devenir membre à part entière de l'alliance."
 show_non_ratified_countries:0 "Afficher les pays non ratifiés"
 show_non_ratified_countries_desc:0 "Ici vous pouvez voir une liste des pays qui n'ont pas encore ratifié notre adhésion. Vous pouvez amener les pays à ratifier votre adhésion en entretenant de meilleures relations avec eux."
 nato_member:0 "Membre de l'OTAN"
 non_aligned_movement_member_idea:0 "Membre du Mouvement des non-alignés"
 non_aligned_movement_member_idea_desc:0 "Cette nation a rejoint le Mouvement des non-alignés et suit une voie indépendante des blocs occidental et oriental."
 
 #Custom tooltips
 TT_CALL_NATO:0 "Appelleront leurs alliés de l'OTAN à la guerre !"
 TT_JOIN_NATO:0 "Nous rejoignons l'OTAN"
 TT_LEAVE_NATO:0 "Nous quittons l'OTAN"
 TT_NATO_DISBANDED:0 "La faction de l'OTAN est dissoute"
 TT_NO_MILITARY_INTERNAL_FACTION:0 "§HL'armée§! ne fait pas partie de nos factions internes actives §H§!"
 TT_AT_LEAST_SMALL_MILITARY_SPENDING:0 "Nous devons avoir au moins §Hde petites dépenses militaires§!"
 TT_AT_LEAST_BASIC_POLICE:0 "Nous devons disposer d'au moins §Hde financement de base pour la police et la sécurité§!"
 TT_SECRET_BALLOTS:0 "Nous devons avoir §Hdes bulletins de vote secrets§!"
 TT_NOT_CENSORED_PRESS:0 "Nous ne pouvons pas avoir une presse censurée"
 TT_RELIGIOUS_FREEDOM:0 "Nous devons garantir la liberté religieuse"
 TT_FAIR_JUSTICE_SYSTEM:0 "Nous devons avoir un système de justice équitable"
 TT_OKAY_CORRUPTION:0 "Notre niveau de corruption §H§! doit être meilleur que §H(6) Corruption systématique§!"
 TT_ALL_NATO_MEMBERS_RATIFIED:0 "Tous les membres de l'OTAN doivent avoir ratifié notre adhésion !"
 TT_ATTACKER_CONTROLS_OUR_STATES:0 "Nos ennemis doivent contrôler au moins un de nos États"
