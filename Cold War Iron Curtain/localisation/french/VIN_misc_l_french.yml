# === Equipment Names & Descriptions (merged from VIN_equipment_l_english.yml) ===
##Infantry Equipment
VIN_infantry_equipment_0: "Sung Tu Che"
VIN_infantry_equipment_0_short: "Sung Tu Che"
VIN_infantry_equipment_0_desc: "Pendant la Résistance française, le Bureau de fabrication militaire (Cuc Quan Gioi) et divers ateliers décentralisés produisaient des armes de fortune (Sung Tu Che) pour le PAVN et les milices alliées au Viet Minh. Ces armes à feu improvisées étaient souvent calquées sur des modèles existants comme les fusils Arisaka ou M1 Garand. Malgré leur construction rudimentaire, ces canons de fortune fournissaient une puissance de feu essentielle aux forces de résistance en l'absence d'armes standardisées, symbolisant l'ingéniosité et la détermination du peuple vietnamien dans sa lutte anticoloniale contre l'impérialisme étranger."

VIN_infantry_equipment_1: "Sung Tieu lien K-67"
VIN_infantry_equipment_1_short: "K-67"
VIN_infantry_equipment_1_desc: "Le K-67, désignation vietnamienne du PPS-43 soviétique, a joué un rôle clé dans les dernières étapes de la guerre de Résistance française. Chambré en Tokarev de 7,62 x 25 mm, il a été privilégié pour sa conception légère et compacte et sa facilité d'utilisation, particulièrement adapté aux tactiques de guérilla et au combat rapproché. Le K-67 a été largement utilisé par l'Armée populaire vietnamienne (PAVN) et les milices, fournissant une puissance de feu cruciale lors des embuscades et des opérations de fuite. \nBien qu'officiellement retiré du service de première ligne après la guerre, le K-67 reste toujours utilisé dans les arsenaux de la milice et des forces d'autodéfense."

VIN_infantry_equipment_2: "Sung Tieu lien K50M"
VIN_infantry_equipment_2_short: "K50M"
VIN_infantry_equipment_2_desc: "Le K50M est une mitraillette produite au Vietnam, chambrée en Tokarev de 7,62 x 25 mm, dérivée du modèle chinois Type 50/PPSh-41. Développé dans les années 1960, le K50M a été conçu pour améliorer l'efficacité opérationnelle des forces vietnamiennes, notamment dans la guérilla. Suite à l'afflux d'armes chinoises, notamment le Type 50 / PPSh-41, le Vietnam a pu modifier et améliorer la conception grâce à son tube de refroidissement qui a été raccourci à 76 mm, permettant un profil plus compact. De plus, le K50M intègre un viseur basé sur le MAT-49 français, qui est apposé à l'avant du canon pour une précision améliorée et un raccourcissement du canon et le remplacement de la crosse en bois par une crosse métallique pliable, améliorant considérablement la portabilité et la maniabilité de l'arme. \nCela fait du K50M un choix idéal pour les commandos, les milices et les guérilleros, car il peut facilement opérer dans des espaces confinés tout en conservant sa puissance de feu et son efficacité. Dans l'ensemble, le K50M représente une avancée significative dans les capacités du Vietnam en matière d'armes légères au cours d'une période critique de son histoire militaire."

VIN_infantry_equipment_3: "Chanté Truong AKS-47"
VIN_infantry_equipment_3_short: "AKS-47"
VIN_infantry_equipment_3_desc: "Le fusil AKS, une variante à crosse pliable de l'AK-47, a été largement utilisé par l'Armée populaire du Vietnam (PAVN) pendant la guerre du Vietnam. Chambré en 7,62 x 39 mm, l'AKS a été privilégié pour sa conception compacte, ce qui le rend idéal pour les guérilleros opérant dans des environnements de jungle dense ou dans des combats urbains. Sa crosse métallique pliable permettait une plus grande maniabilité et facilité de transport, notamment pour les unités commando et l'infanterie mobile.\nL'AKS, comme l'AK-47 standard, était réputé pour sa fiabilité dans des conditions difficiles, notamment la boue, la pluie et la chaleur extrême. Sa large disponibilité, son faible entretien et sa construction robuste en ont fait la pierre angulaire des armes PAVN, consolidant sa place comme l'une des armes à feu les plus emblématiques utilisées pendant le conflit."

VIN_infantry_equipment_4: "Chanté Truong STL-1A"
VIN_infantry_equipment_4_short: "STL-1A"
VIN_infantry_equipment_4_desc: "Le STL-1A est un fusil d'assaut modernisé développé dans l'usine vietnamienne Z111, basé sur les principes de conception de l'AK-103 et intégrant des fonctionnalités du Galil ACE. Chambré en 7,62 x 39 mm, le STL-1A a été introduit pour améliorer les fusils plus anciens comme le K-50M, l'AKS et le K-56 utilisés par l'Armée populaire du Vietnam (PAVN).\nLes principales améliorations incluent un revêtement anticorrosion pour les composants métalliques, un bouclier anti-recul similaire à celui de l'AK-74 et le remplacement des poignées et des protège-mains en bois par du plastique de haut poids moléculaire. Le fusil offre également le choix entre une poignée en plastique moulé ou une crosse métallique pliable semblable au Galil ACE, ce qui le rend plus polyvalent dans divers environnements de combat tout en conservant le long canon de l'AK-47 d'origine, et une caractéristique importante est sa compatibilité avec le lance-grenades M203, offrant une puissance de feu améliorée. \nDévoilé pour la première fois en novembre 2018, le STL-1A représente une modernisation significative des capacités du Vietnam en matière d'armes légères."


##Vietnamese Peoples Army Armored Vehicles
VIN_lt_equipment_1: "T-60"
VIN_lt_equipment_1_short: "T-60"
VIN_lt_equipment_1_desc: "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des 2 années de production. Le véhicule était un char à 2 équipages avec un moteur 6 cylindres et atteint jusqu'à 44 km/h avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
VIN_lt_equipment_2: "T-70"
VIN_lt_equipment_2_short: "T-70"
VIN_lt_equipment_2_desc: "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et l'a terminé en 1942. Au cours des deux années de fabrication, 8 300 exemplaires ont été produits. Le char avait un canon beaucoup plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée. Il a été largement utilisé pendant la Seconde Guerre mondiale."
VIN_lt_equipment_3: "PT-76"
VIN_lt_equipment_3_short: "PT-76"
VIN_lt_equipment_3_desc: "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
VIN_lt_equipment_4: "Char léger K-62 (Type 62 PRC)"
VIN_lt_equipment_4_short: "K-62"
