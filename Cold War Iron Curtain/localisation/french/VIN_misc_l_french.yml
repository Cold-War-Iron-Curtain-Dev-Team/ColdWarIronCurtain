### NLF ###
## Ideas
NLF_rev_cohesion: "Cohésion révolutionnaire"
NLF_rev_cohesion_desc: "Malgré leur éloignement du commandement central du Nord, les cadres du Sud maintiennent une unité idéologique et organisationnelle incassable, leur permettant de résister même sous une pression extrême."
NLF_nguyen_binh_command: "Le commandement de Nguyen Binh"
NLF_nguyen_binh_command_desc: "Le style de leadership de Nguyen Binh associe une discipline rigide à des tactiques de guérilla flexibles, transformant des cellules dispersées en une force de combat coordonnée capable de tendre une embuscade et de déjouer un ennemi supérieur."
NLF_guerilla_network: "Réseau de guérilla organisé"
NLF_guerilla_network_desc: "L'infrastructure du Viet Minh du Sud permet des déplacements fluides à travers les villages, les jungles et les tunnels souterrains, soutenant ainsi l'insurrection même sous des assauts constants."
NLF_vietminh_disarray: "Désordre dans les rangs"
NLF_vietminh_disarray_desc: "Avec le départ de Binh, l'unité partisane s'effondre en factionnalisme. La confiance s'érode. La coordination vacille."
NLF_fractured_command_structure: "Structure de commandement fracturée"
NLF_fractured_command_structure_desc: "L'absence de Nguyen Binh laisse un vide d'autorité, comblé par des commandants ambitieux mais inexpérimentés."
NLF_post_binh_disorganization: "Désorganisation post-Binh"
NLF_post_binh_disorganization_desc: "Les lignes d'approvisionnement autrefois étroitement gérées s'effondrent désormais. Les tactiques de guérilla deviennent imprudentes et coûteuses sans surveillance centrale."
NLF_wartime_reconstitution: "Reconstitution en temps de guerre"
NLF_wartime_reconstitution_desc: "Les réseaux villageois, les ateliers dissimulés et les cadres de liaison du Nord assurent l'approvisionnement des formations du Sud en ruines en remplaçants."

