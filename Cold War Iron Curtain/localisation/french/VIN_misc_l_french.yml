VIN_Peoples_War_Doctrine: "Doctrine de guerre populaire"
VIN_Peoples_War_Doctrine_desc: "La nation entière est organisée en un seul front. Chaque village est une forteresse et chaque citoyen un acteur de la résistance."
VIN_Chinese_Trained_Cadres: "Cadres formés en chinois"
VIN_Chinese_Trained_Cadres_desc: "Les officiers et les instructeurs formés dans les camps chinois et ayant l'expérience de la guerre civile chinoise élèvent le niveau de l'Armée populaire."
VIN_Military_Medical_Academy: "Académie de médecine militaire Quan Y Vien"
VIN_Military_Medical_Academy_desc: "Des médecins militaires, des chirurgiens et des hôpitaux de campagne qualifiés ramènent les soldats blessés sur la ligne et préservent les cadres vétérans."
VIN_Military_Regions_System: "Système de régions militaires"
VIN_Military_Regions_System_desc: "Les commandements régionaux unissent le travail local de défense, de milice et de mobilisation avec les autorités civiles à travers le pays."
VIN_Concentrated_Battalion_Doctrine: "Compagnie indépendante, bataillon concentré"
VIN_Concentrated_Battalion_Doctrine_desc: "Les compagnies locales harcèlent et observent l'ennemi tandis que les bataillons se concentrent pour détruire les postes isolés grâce à la supériorité locale."
VIN_Political_Commissar_System: "L'éducation politique dans l'armée"
VIN_Political_Commissar_System_desc: "Chaque soldat apprend pourquoi il se bat. Les commissaires renforcent le moral et maintiennent les unités ensemble malgré les difficultés."
VIN_Public_Security_Apparatus: "Forces populaires de sécurité publique"
VIN_Public_Security_Apparatus_desc: "Un service de sécurité unifié protège la République contre l'espionnage, le sabotage et le banditisme."
VIN_General_Staff_Directorate: "État-major élargi"
VIN_General_Staff_Directorate_desc: "Les départements des opérations, du renseignement, de la formation, de la milice et des communications dirigent la guerre sous une structure de commandement unique."
VIN_General_Military_Commission: "Commission militaire générale"
VIN_General_Military_Commission_desc: "L'organe militaire suprême du Parti coordonne la stratégie, la politique de défense et le développement des forces armées."
VIN_Military_Intelligence_Bureau: "Bureau de renseignement de Cuc Quan Bao"
VIN_Military_Intelligence_Bureau_desc: "La reconnaissance et le contre-espionnage centralisés fournissent aux commandants des informations précises sur l'ennemi."
VIN_Defense_Production_Directorate: "Direction de la production de la Défense nationale"
VIN_Defense_Production_Directorate_desc: "Des départements de production spécialisés relevant du ministère de la Défense nationale remplacent les arrangements improvisés."
VIN_Election_Campaign_Machinery: "Campagne électorale nationale"
VIN_Election_Campaign_Machinery_desc: "Les cadres compilent des registres, impriment des documents et sondent les districts en vue du vote national. Les ressources sont détournées de la préparation à la guerre."
VIN_Southern_Struggle_Preparation: "Préparer la lutte du Sud"
VIN_Southern_Struggle_Preparation_desc: "Les cadres préservent les réseaux clandestins et planifient une reprise de la lutte dans le Sud au détriment du calme intérieur."

VIN_FORPOL_own_voice: "Parler de notre propre voix"
VIN_FORPOL_own_voice_desc: "Hanoï a déclaré que le Vietnam définirait sa propre place dans le nouvel ordre."
VIN_FORPOL_diplomatic_momentum: "L'élan diplomatique"
VIN_FORPOL_diplomatic_momentum_desc: "Les capitales étrangères sont à l'écoute et le ministère des Affaires étrangères en profite."
VIN_FORPOL_french_channel: "La Manche française"
VIN_FORPOL_french_channel_desc: "Une ligne de communication discrète avec Paris porte ses fruits."
VIN_FORPOL_french_wariness: "Méfiance envers Paris"
VIN_FORPOL_french_wariness_desc: "Hanoï lit chaque signal français avec méfiance et planifie en conséquence."
VIN_FORPOL_indochina_doctrine: "Doctrine Indochine"
VIN_FORPOL_indochina_doctrine_desc: "Un principe cohérent guide désormais la politique vietnamienne à l'égard du Laos et du Cambodge."
VIN_FORPOL_laos_peace: "Espoir de paix au Laos"
VIN_FORPOL_laos_peace_desc: "Les patrouilles conjointes et les contacts politiques apaisent la frontière laotienne."
VIN_FORPOL_secure_northern_border: "La compréhension de Gérard"
VIN_FORPOL_secure_northern_border_desc: "Pékin a accepté le cadre frontalier de 1895, laissant la frontière nord tranquille."
VIN_FORPOL_moscow_line: "La ligne de Moscou"
VIN_FORPOL_moscow_line_desc: "Le Vietnam est aux côtés de l'Union soviétique le point d'ancrage du socialisme mondial."
VIN_FORPOL_beijing_line: "La ligne Pékin"
VIN_FORPOL_beijing_line_desc: "Le Vietnam considère la Chine comme le leader de la révolution asiatique."
VIN_FORPOL_independent_line: "Une ligne révolutionnaire indépendante"
VIN_FORPOL_independent_line_desc: "Le Vietnam refuse de choisir entre Moscou et Pékin."
VIN_FORPOL_northern_vigilance: "Vigilance du Nord"
VIN_FORPOL_northern_vigilance_desc: "La frontière nord est étroitement surveillée face à un gouvernement chinois hostile."
VIN_FORPOL_coexistence_breathing_space: "Espace de respiration de Kunming"
VIN_FORPOL_coexistence_breathing_space_desc: "L'accord de Kunming a apaisé la frontière nord et facilité la reconstruction."
VIN_FORPOL_revolutionary_sanctuary: "Citadelle de la révolution asiatique"
VIN_FORPOL_revolutionary_sanctuary_desc: "Les exilés chinois et les cadres vietnamiens s'organisent pour une lutte renouvelée."
VIN_FORPOL_liberation_front_rear: "Zone arrière du Front de libération"
VIN_FORPOL_liberation_front_rear_desc: "Les bases frontalières et les routes d'approvisionnement sont en cours de préparation pour la tempête à venir."
VIN_FORPOL_thai_front_prep: "Se préparer pour la Thaïlande"
VIN_FORPOL_thai_front_prep_desc: "L'armée prépare un affrontement à la frontière thaïlandaise."
VIN_1895_gerard_convention_upheld: "Pékin a confirmé la Convention Gérard de 1895"
VIN_sino_soviet_alignment_moscow: "Aligné sur Moscou dans la scission sino-soviétique"
VIN_sino_soviet_alignment_beijing: "Aligné sur Pékin dans la scission sino-soviétique"
VIN_kunming_conference_success: "La Conférence de Kunming a réussi"
VIN_kunming_conference_failure: "La Conférence de Kunming a échoué"

VIN_NV_Intellectual_Chill: "Refroidissement intellectuel"
VIN_NV_Intellectual_Chill_desc: "Les écrivains et les universitaires observent le sort des intellectuels chinois et gardent leurs opinions pour eux. Le Parti gagne en vigilance au détriment du travail créatif."
VIN_NV_Resolution_30: "Résolution n° 30"
VIN_NV_Resolution_30_desc: "Le Politburo a déclaré que la culture était un front de la révolution. L'obéissance est facile à imposer ; l'innovation ne l'est pas."
VIN_NV_Poet_Soldiers: "Poètes-Soldats"
VIN_NV_Poet_Soldiers_desc: "Les écrivains marchent avec les ouvriers et les soldats, et leurs vers portent au front le message de la révolution."
VIN_NV_Open_Debate: "Débat ouvert"
VIN_NV_Open_Debate_desc: "La critique de la bureaucratie est tolérée et discutée dans la presse. Les idées circulent librement, mais les dissidences aussi."
VIN_NV_Human_Face: "Le socialisme à visage humain"
VIN_NV_Human_Face_desc: "L'expérience des réformes en Europe de l'Est est étudiée ouvertement. Les spécialistes et les universitaires ont la liberté de travailler, tandis que les cadres orthodoxes s'inquiètent."
VIN_NV_Uncle_Ho_Mandate: "Le mandat de l'oncle Ho"
VIN_NV_Uncle_Ho_Mandate_desc: "La réforme se déroule sous l'autorité personnelle du président Hô Chi Minh, et rares sont ceux qui osent s'y opposer."
VIN_President_Ho_Chi_Minh: "Président Hô Chi Minh"
VIN_President_Ho_Chi_Minh_desc: "Oncle Ho se tient au-dessus du travail quotidien du Parti. Le secrétaire général dirige l'appareil, mais la parole du président porte toujours la nation, l'armée et la paysannerie."
pol_desc_VIN_Truong_Chinh: "§YSecrétaire général du Parti, théoricien en chef de la Révolution§!\nNé Dang Xuan Khu en 1907 dans une famille d'érudits de Nam Dinh, il prend le nom de guerre Truong Chinh, la Longue Marche, en hommage à la révolution chinoise qu'il a étudiée de si près. Vétéran de la prison de Son La et de la fondation du Viet Minh, il devient secrétaire général du Parti communiste indochinois en 1941 et écrit la doctrine de la guerre de résistance prolongée contre la France.\n\nTruong Chinh est le professeur du Parti : précis, austère et dévoué à l'orthodoxie marxiste-léniniste interprétée à travers l'expérience de Mao en matière de révolution rurale. Il croit que la lutte nationale et la lutte des classes ne peuvent être séparées et que la terre doit être restituée aux cultivateurs, même à un coût terrible. Si sa réforme agraire va trop loin, le Parti lui en tiendra pour responsable, mais peu de doutes que le théoricien de la résistance restera l'un des piliers du Politburo pour les décennies à venir."
pol_desc_VIN_Le_Duan: "§YPremier secrétaire du Parti, architecte de la Ligne Sud§!\nNé en 1907 dans une famille de charpentiers à Quang Tri, Le Duan a travaillé dans les chemins de fer avant de rejoindre la révolution en 1928. Il a passé la majeure partie des années 1930 et de la Seconde Guerre mondiale dans les prisons françaises et est devenu le principal organisateur du Parti à Nam Bo, dirigeant la résistance du sud depuis le delta du Mékong.\n\nDur, sans sentimentalité et convaincu que l'histoire n'attendra pas, Le Duan soutient que le Vietnam ne peut être réunifié que par la force et que le Nord doit devenir la base arrière de la révolution sudiste. En tant que chef du Parti, il gouverne par l'appareil plutôt que par le charisme, construisant une direction collective qui lui répond. Sous sa ligne, le Parti s'engagera tout en faveur de la libération du Sud, quel que soit le prix du sang et quels que soient les conseils de Moscou ou de Pékin."
pol_desc_VIN_Vo_Nguyen_Giap: "§YSecrétaire général du Parti, Général du Peuple§!\nProfesseur d'histoire de Quang Binh sans formation militaire formelle, Vo Nguyen Giap a construit l'Armée populaire vietnamienne à partir d'un peloton de trente-quatre hommes en 1944 pour devenir la force qui a brisé l'Union française à Dien Bien Phu. Son épouse et sa belle-soeur sont mortes dans les prisons françaises et son nom est désormais connu dans le monde colonial.\n\nGiap est un pragmatique qui mesure toute politique à l'aune de la force de l'armée et de la patience du peuple. Il se méfie de l'aventurisme, préfère les soldats professionnels aux commissaires politiques et estime que la révolution doit être construite sur une industrie moderne et une logistique solide plutôt que sur des slogans. En tant que chef du Parti, il dirigerait le Vietnam vers un socialisme prudent aligné sur l'Union soviétique et éviterait les guerres impossibles à gagner."
pol_desc_VIN_Nguyen_Chi_Thanh: "§YSecrétaire Général du Parti, Le Commissaire§!\nPaysan pauvre de Thua Thien entré au Parti en 1937, Nguyen Chi Thanh a gravi les échelons des prisons et de la clandestinité du centre du Vietnam pour devenir chef du Département politique général de l'armée. Il est l'homme du Parti au sein de l'Armée populaire et son critique le plus virulent de la prudence de Giap.\n\nThanh estime que la volonté révolutionnaire et l'éducation politique comptent plus que l'équipement, et que l'armée doit être dirigée d'abord par des commissaires et ensuite par des officiers d'état-major. Il admire le modèle chinois de guerre populaire et plaide en faveur d'une offensive dans le Sud plutôt que d'attendre de meilleures conditions. En tant que chef du Parti, il mettrait la nation entière sur le pied de guerre et exigerait une discipline idéologique de la part de tous les cadres."
pol_desc_VIN_Le_Duc_Tho: "§YSecrétaire général du Parti, chef de la commission d'organisation§!\nNé Phan Dinh Khai à Nam Dinh en 1911, Le Duc Tho fut l'un des membres fondateurs du Parti communiste indochinois et passa des années dans les prisons de Con Dao et Son La. Pendant la résistance, il a été adjoint de Le Duan au comité régional de Nam Bo et il contrôle désormais les dossiers du personnel et les promotions des cadres du Parti.\n\nLe Duc Tho est un homme d'appareil : patient, secret et totalement fidèle au Parti en tant qu'institution. Il croit que les révolutions se gagnent grâce à une organisation disciplinée, et il connaît les forces et les faiblesses de chaque cadre du pays. En tant que chef du Parti, il renforcerait le contrôle central, récompenserait la loyauté envers les talents et maintiendrait le mouvement sudiste fermement lié à Hanoï."
pol_desc_VIN_Nguyen_Van_Linh: "§YSecrétaire général du Parti, père de Doi Moi§!\nNé Nguyen Van Cuc en 1915, Nguyen Van Linh a passé l'ère coloniale dans la prison de Con Dao et les guerres du Sud, où il a dirigé la clandestinité sudiste du Parti. En tant que chef du Parti à Hô Chi Minh-Ville, il a été témoin de l'échec d'une collectivisation rigide et a tranquillement toléré les marchés qui alimentaient la ville.\n\nLinh est un réformateur qui reste communiste. Il estime que le Parti ne peut conserver son monopole du pouvoir que s'il livre du pain, et que l'économie planifiée a amené le pays au bord de la famine. Sous sa direction, le Parti ouvrira la porte à l'entreprise privée, aux investissements étrangers et à certaines critiques publiques, tout en refusant toute contestation de sa propre autorité."
pol_desc_VIN_Do_Muoi: "§YSecrétaire général du Parti§!\nPeintre en bâtiment de la banlieue de Hanoï qui a rejoint la révolution en 1936, Do Muoi s'est évadé d'une prison française pendant l'occupation japonaise et a gravi les échelons de l'administration économique du Parti. Il a supervisé la nationalisation du commerce du Sud après 1975 avant d'accepter la logique de la réforme.\n\nDo Muoi est un consolidateur prudent. Il soutient les réformes de marché de Doi Moi mais insiste sur le rôle moteur du secteur étatique et du Parti, et il observe avec inquiétude l'effondrement du bloc soviétique. En tant que dirigeant, il cherchera à normaliser les relations avec la Chine et les États-Unis, encouragera les investissements étrangers et veillera à ce que l'ouverture économique ne se transforme jamais en libéralisation politique."
pol_desc_VIN_Le_Kha_Phieu: "§YSecrétaire général du Parti§!\nOfficier politique de carrière de Thanh Hoa, Le Kha Phieu a servi comme commissaire pendant les guerres contre la France et les États-Unis et pendant l'occupation du Cambodge, avant de devenir chef du département politique général de l'armée.\n\nPhieu est un défenseur de l'orthodoxie idéologique qui se méfie du rythme des réformes et de l'influence du capital étranger. Il défend les campagnes anti-corruption et le rôle de l'armée dans la vie publique, mais sa méfiance à l'égard de l'Occident et sa proximité avec Pékin font de lui une figure de division parmi les réformateurs du Parti."
pol_desc_VIN_Nong_Duc_Manh: "§YSecrétaire général du Parti§!\nMembre de la minorité Tay de Bac Kan, Nong Duc Manh a suivi une formation d'ingénieur forestier et a gravi les échelons de l'administration provinciale avant de devenir président de l'Assemblée nationale. Il est le premier dirigeant du Parti issu d'une des minorités ethniques du Vietnam.\n\nManh est un technocrate et un bâtisseur de consensus. Il est favorable à une intégration progressive dans l'économie mondiale, à l'adhésion aux organismes commerciaux internationaux et à une réforme administrative progressive, tout en préservant le système de parti unique. Sous sa direction, le Parti recherche la prospérité par la stabilité plutôt que par l'idéologie."
pol_desc_VIN_Pham_Van_Dong: "§YPremier ministre de la République démocratique du Vietnam§!\nFils d'un mandarin de Quang Ngai, Pham Van Dong rejoint la ligue de la jeunesse révolutionnaire de Ho Chi Minh à Canton en 1925 et passe six ans à Con Dao. Il a dirigé la délégation du Viet Minh à Genève en 1954 et est depuis lors Premier ministre, le compagnon le plus proche de Ho et le diplomate le plus fiable.\n\nDong est l'administrateur fidèle de la révolution : courtois, patient et dévoué à l'héritage d'unité nationale de Ho. Il croit en un large front de patriotes, en des négociations où la guerre n'est pas nécessaire et en un Vietnam qui garde ses distances avec toutes les grandes puissances. En tant que leader, il gouvernerait en héritier de Ho plutôt qu'en homme fort du Parti."
pol_desc_VIN_Tran_Ngoc_Danh: "§YSecrétaire général du Parti communiste vietnamien§!\nFrère cadet de Tran Phu, premier secrétaire général du Parti communiste indochinois, Tran Ngoc Danh a représenté le Viet Minh à Paris et à Prague avant de rompre avec Hô Chi Minh. Depuis son exil, il dénonça Ho comme un nationaliste bourgeois et un opportuniste qui avait dissous le Parti pour courtiser les Français et les Américains.\n\nDanh est un stalinien orthodoxe qui estime que le Vietnam doit suivre le modèle soviétique sans compromis : collectivisation, lutte des classes, purge des nationalistes et des opportunistes et adhésion à part entière au camp socialiste sous la direction de Moscou. Après s'être emparé du Parti avec le soutien soviétique, il reconstruira le Vietnam à l'image de l'Union soviétique, quoi qu'en pensent les gens."
pol_desc_VIN_Hoang_Van_Hoan: "§YMembre du Politburo, Ami de la Chine§!\nNé à Nghe An en 1905, Hoang Van Hoan a rejoint la Ligue de la jeunesse révolutionnaire de Ho Chi Minh dans les années 1920 et a passé des années au Siam et en Chine à organiser des Vietnamiens d'outre-mer. Il a été le premier ambassadeur de la République démocratique à Pékin et reste le lien le plus étroit du Parti avec les dirigeants chinois.\n\nHoan croit que la révolution vietnamienne est indissociable de celle de la Chine et que le Parti devrait suivre la voie de la mobilisation de masse, des communes rurales et de la révolution continue de Mao. En tant que dirigeant, il lierait étroitement le Vietnam à Pékin, quel que soit le prix à payer pour les relations avec Moscou."
VIN_ho_chi_minh_in_power_TT: "§YHo Chi Minh§! est Président et sa ligne gouverne toujours le Parti"
VIN_ho_chi_minh_in_power_TT_NOT: "§YHo Chi Minh§! n'est pas Président ou sa ligne ne gouverne plus le Parti"
VIN_set_president_ton_duc_thang_TT: "§YTon Duc Thang§! devient président."
VIN_set_president_nguyen_huu_tho_TT: "§YNguyen Huu Tho§! devient président par intérim."
VIN_set_president_truong_chinh_TT: "§YTruong Chinh§! devient président du Conseil d'État."
VIN_set_president_vo_chi_cong_TT: "§YVo Chi Cong§! devient président du Conseil d'État."
VIN_set_president_le_duc_anh_TT: "§YLe Duc Anh§! devient Président."
VIN_set_president_tran_duc_luong_TT: "§YTran Duc Luong§! devient président."
VIN_clear_president_TT: "§YHo Chi Minh§! est déchu de la présidence. Le bureau reste vacant."
vin_truong_chinh_portrait_postwar: "Portrait d'après-guerre de Truong Chinh appliqué"
vin_truong_chinh_portrait_old: "Portrait tardif de Truong Chinh appliqué"
VIN_Land_Reform_Chinh_Resigns_TT: "Le dixième Plénum accepte la démission de §YTruong Chinh§! du poste de secrétaire général. §YHo Chi Minh§! prend le poste aux côtés de la Présidence."
VIN_NV_Petition_Offices: "Bureaux des pétitions"
VIN_NV_Petition_Offices_desc: "Les doléances sont entendues dans toutes les provinces. Les plaintes locales sont corrigées rapidement, même si les décisions arrivent plus lentement."
VIN_NV_Second_Tho_Moi: "La deuxième nouvelle poésie"
VIN_NV_Second_Tho_Moi_desc: "Une renaissance littéraire enrichit la vie culturelle et intellectuelle vietnamienne, tout en adoucissant le ton martial de l'art révolutionnaire."
VIN_LR_Sua_Sai: "Campagne pour corriger les erreurs"
VIN_LR_Sua_Sai_desc: "Le Parti a reconnu de graves erreurs dans la réforme agraire et libère les accusés à tort. La confiance dans les cadres est ébranlée."
VIN_LR_Quynh_Luu_Unrest: "Troubles à Quynh Luu"
VIN_LR_Quynh_Luu_Unrest_desc: "La colère des paysans face aux étiquettes de classe injustifiées a débouché sur des troubles ouverts à Nghe An. L'armée a été envoyée pour rétablir l'ordre."
VIN_LR_Cooperatives: "Coopératives agricoles"
VIN_LR_Cooperatives_desc: "Les paysans sont organisés en coopératives. La mise en commun du travail et des outils augmente la production, mais beaucoup sont réticents à céder leurs nouvelles terres."
VIN_LR_Patriotic_Capitalists: "Capitalistes patriotes"
VIN_LR_Patriotic_Capitalists_desc: "Les capitalistes nationaux mettent leurs ateliers et leur savoir-faire au service de la reconstruction, au grand dam des radicaux du Parti."
VIN_LR_Cautious_Pace: "Rythme prudent des réformes"
