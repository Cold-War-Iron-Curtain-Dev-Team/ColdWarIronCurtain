VIN_heavy_fighter_equipment_1: "Petliakov Pe-2"
VIN_heavy_fighter_equipment_1_short: "Pe-2"
VIN_heavy_fighter_equipment_1_desc: "Bien qu'entré en service en 1941 en tant que bombardier léger, le Pe-2 fut également un chasseur lourd et un chasseur de nuit à succès pendant la guerre. 11 500 avions ont été construits pendant la guerre. C'était également l'un des rares types utilisés par les deux parties au conflit, les Pe-2 soviétiques et finlandais étant susceptibles de s'affronter pendant la guerre de Continuation (le théâtre finlandais et carélien du front de l'Est). Son nom de rapport à l'OTAN est Buck."
VIN_heavy_fighter_equipment_2: "Petliakov Pe-3"
VIN_heavy_fighter_equipment_2_short: "Pe-3"
VIN_heavy_fighter_equipment_2_desc: "Développement ultérieur du Pe-2, le Pe-3 était un avion de combat de nuit dédié lors de son introduction en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi un chemin comparable à ceux empruntés par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et bien que la seule usine responsable de la construction de ce type ait été évacuée à la suite de la bataille, le Pe-3 a été utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
VIN_heavy_fighter_equipment_3: "Lavotchkine La-11"
VIN_heavy_fighter_equipment_3_short: "La-11"
VIN_heavy_fighter_equipment_3_desc: "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

