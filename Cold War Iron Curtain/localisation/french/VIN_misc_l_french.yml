VIN_jet_interceptor_equipment_9: "Sukhoï Su-27S"
VIN_jet_interceptor_equipment_9_short: "Su-27S"
VIN_jet_interceptor_equipment_9_desc: "Le Su-27S est la variante de production initiale du chasseur Sukhoi Su-27 de conception soviétique. L'avion était destiné à être le concurrent direct du F-14 Tomcat et du F-15 Eagle. Après avoir effectué son vol inaugural en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. Jusqu'à présent, 809 avions ont été produits, qui sont toujours en service dans l'armée de l'air russe. Les autres opérateurs comprennent, entre autres, l'Indonésie, l'Ukraine, le Vietnam et la Chine (désigné J-11). L'avion restera en service dans un avenir prévisible."

VIN_stealth_fighter_equipment_1: "Sukhoï Su-27PU"
VIN_stealth_fighter_equipment_1_short: "Su-27PU"
VIN_stealth_fighter_equipment_1_desc: "Le Sukhoi Su-27 est un avion de combat bimoteur supermaniable d'origine soviétique conçu par Sukhoi. Il était destiné à être un concurrent direct des grands chasseurs américains de quatrième génération tels que le Grumman F-14 Tomcat et le F-15 Eagle, avec une portée de 3 530 kilomètres (1 910 milles marins), des munitions d'avions lourds, une avionique sophistiquée et une grande maniabilité."

VIN_CAS_equipment_1: "de Havilland DH.82 Tiger Moth"
VIN_CAS_equipment_1_short: "DH.82 Tiger Moth"
#VIN_CAS_equipment_1_desc: ""
VIN_CAS_equipment_2: "Iliouchine Il-2 Sturmovik"
VIN_CAS_equipment_2_short: "Il-2 Sturmovik"
VIN_CAS_equipment_2_desc: "Illyusha, Bossu, le Flying Tank, le Flying Infantryman, tels sont quelques-uns des nombreux surnoms donnés à l'Il-2, en fait le visage de l'armée de l'air soviétique de la Seconde Guerre mondiale. Introduit en 1941, l'Il-2 était un avion d'attaque au sol qui, combiné avec son successeur, l'Il-10, était l'avion de combat le plus produit de l'histoire de l'aviation, l'Il-2 ayant produit à lui seul 36 183 unités. L'avion Il-2 a joué un rôle crucial sur le front de l'Est. Bien qu'il soit imprécis dans ses bombardements et ses attaques à la roquette, sa durabilité globale le rendait extrêmement efficace pour dévier tous les canons antiaériens de gros calibre, sauf les gros canons antiaériens, ce qui lui a valu son nom de Flying Tank. Connu sous le nom de Sturmovik, ce qui signifie avion d'attaque au sol, son nom ultérieur pour l'OTAN est Bark."
VIN_CAS_equipment_3: "Iliouchine Il-10"
VIN_CAS_equipment_3_short: "Il-10"
VIN_CAS_equipment_3_desc: "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à de nombreux défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 participa à certaines des dernières opérations de combat en Europe, ainsi qu'à la brève intervention soviétique dans la guerre du Pacifique. Au moment où l'Il-10 a pris sa retraite du service soviétique en 1956, l'armée de l'air a délaissé les avions purement CAS et d'attaque au sol pour se tourner vers les chasseurs-bombardiers. Son nom de rapport à l'OTAN est Beast."
VIN_CAS_equipment_4: "Iliouchine Il-16"
VIN_CAS_equipment_4_short: "Il-16"
VIN_CAS_equipment_4_desc: "L'Ilyushin Il-16 est le dernier développement de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais elle était équipée d'un moteur Mikulin AM-43NV nouvellement développé dans l'espoir qu'il serait plus rapide et plus maniable que son prédécesseur. Trois avions ont été construits à des fins d'essais, mais en raison de problèmes moteur imprévus qui n'ont pas pu être résolus, le projet a été annulé."

VIN_jet_CAS_equipment_1: "Iliouchine IL-10M"
VIN_jet_CAS_equipment_1_desc: "Le Yakovlev Yak-23 Flora était un avion d'attaque au sol de conception soviétique introduit en 1949. L'avion était un développement du chasseur à réaction Yak-15. Le Yak-23 était principalement exporté vers les pays du pacte de Varsovie, où il resta en service jusqu'à la fin des années 1950."
VIN_jet_CAS_equipment_1_short: "IL-10M"
VIN_jet_CAS_equipment_2: "Mikoyan-Guerevich MiG-17bis"
VIN_jet_CAS_equipment_2_desc: "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
VIN_jet_CAS_equipment_2_short: "MiG-17bis"
VIN_jet_CAS_equipment_3: "Mikoyan-Guerevich MiG-19S"
VIN_jet_CAS_equipment_3_desc: "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
VIN_jet_CAS_equipment_3_short: "MiG-19S"
VIN_jet_CAS_equipment_4: "Soukhoï Su-7B"
VIN_jet_CAS_equipment_4_desc: "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
VIN_jet_CAS_equipment_4_short: "Su-7B"
VIN_jet_CAS_equipment_5: "Soukhoï Su-22"
VIN_jet_CAS_equipment_5_short: "Su-22"
VIN_jet_CAS_equipment_5_desc: "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
VIN_jet_CAS_equipment_6: "Soukhoï Su-22M4"
VIN_jet_CAS_equipment_6_short: "Su-22M4"
VIN_jet_CAS_equipment_6_desc: "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
VIN_jet_CAS_equipment_7: "Soukhoï Su-22M4K"
VIN_jet_CAS_equipment_7_short: "Su-22M4K"
VIN_jet_CAS_equipment_7_desc: "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."

VIN_nav_bomber_equipment_1: "Iliouchine Il-4T"
VIN_nav_bomber_equipment_1_short: "Il-4T"
VIN_nav_bomber_equipment_1_desc: "Initialement connu sous le nom de DB-3F, l'Il-4 était un bombardier moyen performant, doté de la portée nécessaire pour effectuer même des missions de bombardement stratégiques. Cette version modifiée du DB-3 comportait de nouveaux moteurs et une tourelle dorsale améliorée (le HMG ShKAS de 7,62 mm a été remplacé par un HMG UBT de 12,7 mm). Certaines séries avaient des ailes extérieures et des fuselages avant en bois pour conserver les métaux, et tout au long de la production, les moteurs et les réservoirs de carburant ont été améliorés pour améliorer les performances tout en conservant la même autonomie. Cependant, en raison du poids supplémentaire, les moteurs ne se sont pas révélés assez puissants et étaient donc plus lents que leurs prédécesseurs immédiats. Son nom de rapport à l'OTAN est Bob"
VIN_nav_bomber_equipment_2: "Tupolev Tu-2T"
VIN_nav_bomber_equipment_2_short: "Tu-2T"
VIN_nav_bomber_equipment_2_desc: "Le Tu-2T (version prototype ANT-62T) était la variante bombardier-torpilleur du Tu-2, développée à partir de la variante Tu-2D. La décision d'utiliser la plate-forme pour ce rôle est probablement due à la préférence de l'équipage pour le Tu-2, bien qu'il s'agisse du deuxième bombardier le plus important de l'armée de l'air soviétique pendant la Seconde Guerre mondiale (le premier étant le Pe-2). Cette variante servirait avec les pilotes de l'aviation navale soviétique au crépuscule de la Seconde Guerre mondiale et servirait pendant une grande partie de la période d'après-guerre. Comme son cousin de l'Air Force, son nom de rapport à l'OTAN est « Bat »."
VIN_nav_bomber_equipment_3: "Iliouchine Il-6"
VIN_nav_bomber_equipment_3_short: "Il-6"
VIN_nav_bomber_equipment_3_desc: "L'Il-6 est un développement ultérieur du bombardier/bombardier torpilleur à longue portée Il-4 Bob. Initialement destiné à remplacer l'Il-4, l'Il-6 était équipé de moteurs diesel à autonomie beaucoup plus longue et économes en carburant. Il devait être doté d'un armement défensif composé de cinq canons de 20 mm. Cependant, les essais en vol ont montré que le type était difficile à contrôler à des poids élevés et à faibles vitesses, ce qui rendait l'atterrissage difficile. De plus, les moteurs étaient incapables de démarrer à basse température et réagissaient lentement aux mouvements de l'accélérateur. Malgré diverses tentatives d'amélioration, le développement fut interrompu en 1944."
VIN_nav_bomber_equipment_4: "Beriev Be-6"
VIN_nav_bomber_equipment_4_short: "Être-6"
VIN_nav_bomber_equipment_4_desc: "Le Be-6 était un hydravion produit par le bureau de conception de Beriev, dont le premier vol a eu lieu en 1949. Il était capable d'accomplir une grande variété de missions. En plus de son rôle principal de patrouille maritime et de reconnaissance maritime, le Be-6 a également été utilisé dans les patrouilles côtières et sur les lignes de ravitaillement, dans le pose de mines, dans les bombardiers torpilleurs, les bombardiers moyens et dans les transports. Son nom de rapport USAF/OTAN est Type 34, tandis que le nom de code OTAN était Madge."
VIN_nav_bomber_equipment_5: "Beriev Be-10"
VIN_nav_bomber_equipment_5_short: "Être-10"
VIN_nav_bomber_equipment_5_desc: "Le Be-10, également connu sous le nom d'Izdelye M, était un hydravion à turboréacteur développé par l'Union soviétique en 1956. Conçu comme un bombardier de patrouille, le Be-10 était notoirement difficile à piloter et souffrait de fatigue du métal due aux contraintes de la cellule lors des décollages et atterrissages à grande vitesse ainsi qu'à la corrosion. En tant que tel, le type a été rapidement remplacé en service par le dernier Be-12 Mail. Connu en Occident sous le nom de Mallow, une sous-variante civile modifiée, le M-10 était connu pour avoir établi 12 records du monde par la Fédération Aéronautique Internationale (Fédération Mondiale des Sports Aériens) en 1961."
VIN_nav_bomber_equipment_6: "Beriev Be-12N Tchaïka"
VIN_nav_bomber_equipment_6_short: "Be-12N Tchaïka"
VIN_nav_bomber_equipment_6_desc: "Le Be-12 a été développé en 1960 pour succéder et remplacer le Be-6 Madge et le Be-10 Mallow, et a été développé comme avion de patrouille anti-sous-marin et maritime. Contrairement à son prédécesseur immédiat, propulsé par un turboréacteur, le Be-12 était un avion propulsé par un turbopropulseur et doté également d'un train d'atterrissage rétractable, ce qui donnait à l'engin une capacité d'atterrissage amphibie. La variante N améliorée était équipée de nouveaux capteurs, d'une avionique, d'un système de recherche et d'attaque Nartsiss et d'un capteur de détecteur d'anomalies magnétiques (MAD). Connu localement sous le nom de Chayka, qui signifie mouette, son nom de rapport OTAN est Mail."
VIN_nav_bomber_equipment_7: "Tupolev Tu-142"
VIN_nav_bomber_equipment_7_short: "Tu-142"
VIN_nav_bomber_equipment_7_desc: "Le Tupolev Tu-142 est un avion soviéto-russe de reconnaissance maritime et de guerre anti-sous-marine (ASW) dérivé du bombardier stratégique à turbopropulseur Tu-95. Une variante de communication spécialisée, désignée Tu-142MR, était chargée de communications à longue portée avec les sous-marins lance-missiles balistiques soviétiques. Le Tu-142 a été conçu par le bureau d'études Tupolev et fabriqué par les usines de machines Kuibyshev Aviation et Taganrog de 1968 à 1994. Anciennement exploité par la marine soviétique et l'armée de l'air ukrainienne, le Tu-142 sert actuellement dans la marine russe."
VIN_nav_bomber_equipment_8: "Bryza M28B"
VIN_nav_bomber_equipment_8_short: "Bryza M28B"
#VIN_nav_bomber_equipment_8_desc: ""

VIN_tac_bomber_equipment_0: "Iliouchine DB-3"
VIN_tac_bomber_equipment_0_short: "DB-3"
VIN_tac_bomber_equipment_0_desc: "Le DB-3 était un bombardier bimoteur à ailes basses entré en service dans l'armée de l'air soviétique en 1936. Malgré une carrière plutôt calme dans l'armée soviétique, le type a servi en Chine, au sein de l'armée de l'air nationaliste chinoise pendant la Seconde Guerre sino-japonaise. C'était également le premier bombardier soviétique à lancer un raid sur la capitale allemande, Berlin, au cours des premiers mois du front de l'Est de la Seconde Guerre mondiale. La désignation DB est un raccourci pour Dalniy Bombardirovschik, signifiant bombardier à longue portée."
VIN_tac_bomber_equipment_1: "Tupolev SB-2M"
VIN_tac_bomber_equipment_1_short: "SB-2M"
VIN_tac_bomber_equipment_1_desc: "Le SB (connu en développement sous le nom de TsAGI-40 et sous le Tupolev Design Bureau sous le nom d'ANT-40), était un bombardier monoplan bimoteur trois places à grande vitesse introduit à la fin de 1936. Bien qu'il s'agisse d'un châssis avancé pour l'époque, le SB (abréviation de Skorostnoi Bombardirovschik ou bombardier à grande vitesse) manquait de raffinement, au grand dam des pilotes et des membres d'équipage du bombardier, du personnel de maintenance et même de Joseph Staline lui-même (il aurait dit à son sujet : « il n'y a pas de banalités dans l'aviation ». Malgré cela, c'était le premier avion moderne à peau tendue produit en quantité en Union soviétique et probablement le bombardier le plus redoutable du milieu des années 1930. Malgré son obsolescence en 1941, le SB était le bombardier équipé de l'armée de l'air soviétique au moment de la Seconde Guerre mondiale."
VIN_tac_bomber_equipment_2: "Tupolev Tu-2"
VIN_tac_bomber_equipment_2_short: "Ma-2"
VIN_tac_bomber_equipment_2_desc: "Le Tu-2 était un bombardier de jour bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, conçu pour répondre aux exigences d'un bombardier à grande vitesse ou d'un bombardier en piqué, avec une grande charge de bombes interne et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré suffisamment performant pour relever le défi, et des variantes de bombardiers torpilleurs, de reconnaissance et de chasseurs lourds existaient, jouant un rôle clé dans les offensives finales soviétiques de la Seconde Guerre mondiale. Son nom de rapport de l'OTAN d'après-guerre est Bat."
VIN_tac_bomber_equipment_3: "Tupolev Tu-8"
VIN_tac_bomber_equipment_3_short: "Tu-8"
VIN_tac_bomber_equipment_3_desc: "Le Tu-8 est une variante améliorée du bombardier moyen Tu-2D Bat. Volant pour la première fois en 1947, le Tu-8 a été développé pour avoir une portée beaucoup plus longue. Les canons de 7,62 mm dans les différentes écoutilles du fuselage ont été remplacés par des canons de 20 mm et la cellule a été renforcée pour une charge de bombes légèrement accrue. Cependant, l'engin s'est avéré instable, structurellement fragile et ses générateurs n'étaient pas assez puissants pour alimenter pleinement ses tourelles. Avec l'avènement des bombardiers à réaction comme le Tu-16, les planificateurs militaires soviétiques ont décidé qu'il ne valait tout simplement pas la peine de consacrer les ressources nécessaires à la résolution de ses nombreux problèmes, et le projet a donc été annulé."

VIN_jet_tac_bomber_equipment_2: "Iliouchine Il-28"
VIN_jet_tac_bomber_equipment_2_short: "Il-28"
VIN_jet_tac_bomber_equipment_2_desc: "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."

VIN_strat_bomber_equipment_1: "Petliakov Pe-8"
VIN_strat_bomber_equipment_1_short: "Pe-8"
VIN_strat_bomber_equipment_1_desc: "Bombardier lourd soviétique conçu avant la Seconde Guerre mondiale, le Pe-8 (à l'origine TB-7 jusqu'à ce que le nom change pour honorer Vladimir Petlyakov à sa mort en 1942) était le seul bombardier quadrimoteur développé pendant la guerre. Produit en nombre limité, il fut utilisé pour bombarder Berlin en août 1941. Il fut également utilisé pour des « raids de moral » destinés à remonter le moral du peuple soviétique en exposant les vulnérabilités de l'Axe. Sa mission principale, cependant, était d'attaquer de nuit les aérodromes, les gares de triage et autres installations arrière allemandes. Parce que ces avions remontaient le moral, la Luftwaffe allemande les a souvent ciblés, et un grand nombre d'entre eux ont été détruits au cours de la Grande Guerre patriotique. Après la guerre, ils servirent essentiellement de moyens de transport jusqu'à la fin des années 1950."
VIN_strat_bomber_equipment_2: "Iliouchine Il-4"
VIN_strat_bomber_equipment_2_short: "Il-4"
VIN_strat_bomber_equipment_2_desc: "Bien que l'Il-4 ne soit qu'un bombardier moyen, il avait la portée nécessaire pour être utilisé dans des missions stratégiques. L'utilisation des bombardiers dans ce rôle n'était pas une priorité pour le VVS, mais l'Il-4 fut néanmoins utilisé lors de plusieurs raids de bombardement à longue portée contre Berlin en 1941. La plupart seraient utilisés sur des missions à plus courte portée, ajoutant souvent 1 000 kg (2 204 lb) supplémentaires de bombes sous les ailes, en plus des 2 500 kg (5 512 lb) internes."
VIN_strat_bomber_equipment_3: "Tupolev Tu-4"
VIN_strat_bomber_equipment_3_short: "Tu-4"
VIN_strat_bomber_equipment_3_desc: "Le Tu-4 est une conception d'ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain vainqueur de la guerre. Malgré le refus des États-Unis de prêter-louer le B-29, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus de rétro-ingénierie. Malgré de nombreuses difficultés (obtention de pièces équivalentes ou supérieures aux pièces développées aux États-Unis, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à paniquer les États-Unis et la Grande-Bretagne, le premier d'une longue série pendant la guerre froide. Il aura cependant une courte durée de vie, remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de rapport OTAN est Bull."

VIN_jet_strat_bomber_equipment_1: "Tupolev Tu-16 Blaireau"
VIN_jet_strat_bomber_equipment_1_short: "Tu-16 Blaireau"
VIN_jet_strat_bomber_equipment_1_desc: "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952 et l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 sur les emplantures des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg avec un rendement similaire à la bombe britannique du Grand Chelem. Connu en Occident sous le nom de Badger, ce type a servi tout au long de la guerre froide et a pris sa retraite en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de la PLAAF."

