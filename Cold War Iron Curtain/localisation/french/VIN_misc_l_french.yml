# === Post-DBP strategic focus fork ===
VIN_South.1.t: "La guerre ne s'est pas terminée dans la vallée"
VIN_South.1.d_viable: "La position coloniale à Dien Bien Phu s'est effondrée, mais la résistance sudiste tient toujours bon et reste en campagne contre Saigon. La victoire dans la vallée a obligé le Politburo à prendre une décision stratégique : convertir le résultat du champ de bataille en négociations, ou porter la révolution vers le sud et préparer l'Armée populaire à la réunification par la force."
VIN_South.1.d_defeated: "La position coloniale à Dien Bien Phu s'est effondrée, mais la résistance du Sud a déjà été brisée ou dispersée. Cette défaite ne décide pas de la stratégie de Hanoï à notre place. Le Politburo doit maintenant choisir entre transformer la victoire dans la vallée en négociations ou reconstruire la lutte du Sud derrière une offensive générale de l'Armée populaire."
VIN_South.1.a: "Posez la question du Sud devant le Politburo."
VIN_South_Focuses_Unlock_tt: "Les axes stratégiques mutuellement exclusifs §Ypost-Dien Bien Phu§! sont désormais disponibles une fois qu'aucune campagne du Viet Minh n'est active."

VIN_South.2.t: "La campagne du Sud se termine"
VIN_South.2.d_defeat: "Les armes et les cadres envoyés à Nam Bo ont retardé la fin, mais ils n'ont pas pu l'empêcher. La résistance sudiste est brisée et Saigon contrôle le terrain. La voie choisie par Hanoï reste la réunification nationale par la force."
VIN_South.2.d_ceasefire: "Les canons du sud se sont tus avant que l'une ou l'autre des armées ne détruise l'autre. L'engagement d'approvisionnement est arrivé à son terme, tandis qu'Hanoï poursuit les préparatifs pour la réunification nationale."
VIN_South.2.a: "L'offensive générale tranchera la question."
VIN_Post_DBP_Southern_Support_Ended_tt: "La ligne de ravitaillement nord §Y§! est supprimée. La stratégie militaire de Hanoï et la préparation de l'offensive générale se poursuivent."

VIN_Push_for_Negotiations: "Pousser les négociations"
VIN_Push_for_Negotiations_desc: "La victoire de Dien Bien Phu a donné à Hanoï le levier nécessaire pour exiger un règlement. Nous ordonnerons à la résistance du Sud de se retirer et si elle tient toujours le terrain au bout de trois mois, elle signera un cessez-le-feu avec l'État du Vietnam. Genève ouvrira ses portes une fois que les deux gouvernements vietnamiens seront réellement en paix."
VIN_Carry_the_Revolution_South: "Portez la révolution vers le sud"
VIN_Carry_the_Revolution_South_desc: "Genève gèlerait sur place un Vietnam divisé. Au lieu de cela, nous soutiendrons ce qui reste de la résistance du Sud, rejetterons une fuite diplomatique automatique et engagerons l'Armée populaire dans la réunification."
VIN_Mobilize_for_National_Reunification: "Mobilisez-vous pour la réunification nationale"
VIN_Mobilize_for_National_Reunification_desc: "L'armée du Nord doit passer d'une campagne coloniale à une préparation à une guerre nationale. Le travail d'état-major, l'approvisionnement avancé et les réserves protégées dans le coeur du nord soutiendront une offensive concentrée contre Saigon."
VIN_Launch_the_General_Offensive: "Lancer l'offensive générale"
VIN_Launch_the_General_Offensive_desc: "Les préparatifs sont terminés. L'Armée populaire traversera la frontière vers le sud et détruira le régime de Saigon sans attendre une autre conférence diplomatique."
VIN_National_Reunification_Preparation: "Préparation à la réunification nationale"
VIN_National_Reunification_Preparation_desc: "L'Armée populaire constitue des stocks de matériel avancé, prépare des plans opérationnels et conserve une réserve dans le nord pour la prochaine campagne de réunification."

NLF_Northern_Supply_Line: "La ligne d'approvisionnement du Nord"
NLF_Northern_Supply_Line_desc: "Hanoï a libéré des armes, des cadres et des remplaçants pour la résistance du sud. Des routes dispersées ne peuvent pas faire de Nam Bo un front conventionnel, mais elles peuvent maintenir les formations approvisionnées et organisées suffisamment longtemps pour survivre."
VIN_Post_DBP_Southern_War_Recognized: "Hanoï a reconnu que la guerre du sud §Ycontinue après Dien Bien Phu§!"
VIN_Post_DBP_Funded_NLF: "Hanoï a choisi d'augmenter §Rson soutien à la résistance du Sud§!"
VIN_Post_DBP_Pressed_For_Geneva: "Hanoï a choisi de faire pression §Gpour un règlement en Indochine§!"
# Highland settlement - Viet Bac and Tai-Meo
VIN_highland_direct_rule: "Règle directe des marches"
VIN_highland_direct_rule_desc: "La région montagneuse est gouvernée depuis Hanoï comme des provinces ordinaires. Les cadres Tay, Nung, Thai et Meo qui y ont combattu les Français se sont vu promettre d'avoir leur mot à dire dans leurs propres affaires et n'ont pas eu leur mot à dire, et les districts répondent au Parti d'un air maussade."
VIN_highland_direct_rule_2: "Règle directe des hautes terres"
VIN_highland_direct_rule_2_desc: "Ni les marches du nord-est ni les hauts plateaux de Tai-Meo n'ont obtenu une région qui leur soit propre. Toute la frontière nord est administrée depuis Hanoï, et toute la frontière nord en souffre."
VIN_highland_autonomy_compact: "Compact d'autonomie des Highlands"
VIN_highland_autonomy_compact_desc: "La région autonome gouverne ses propres districts et possède ses propres cadres, et en tant que zone intégrée de la république, elle livre la totalité de sa production à Hanoï. La frontière est calme et les mines fonctionnent."
VIN_highland_autonomy_compact_2: "Compacts d'autonomie des Highlands"
VIN_highland_autonomy_compact_2_desc: "Le Viet Bac et le Tai-Meo ont été constitués en régions autonomes. Les minorités frontalières se gouvernent elles-mêmes sous le Parti, le minerai parvient toujours à Hanoï et aucune garnison n'a besoin de maintenir les collines."
VIN_highland_direct_rule_state: "Marches pleines de ressentiment"
VIN_viet_bac_region_state: "Région autonome du Viet Bac"
VIN_viet_bac_region_state_desc: "§YRégion autonome du Viet Bac§!\n-------------\nUne région autonome des §C[VIN.GetNameWithFlag]§!. Les marches Tay et Nung qui abritaient le Parti gouvernent leurs propres districts, écoles et milices depuis Cao Bang, et livrent leur production à Hanoï.\n\nPrésident du comité administratif :\n\n§HChu Van Tan§!\n\n\n\n\n\n\n\n£VIN_Chu_Van_Tan_region\n\n\n\n\n\n\n\n\n-------------------------------------"
VIN_tai_meo_region_state: "Région autonome de Tai-Meo"
VIN_tai_meo_region_state_desc: "§YRégion autonome de Tai-Meo§!\n-------------\nUne région autonome des §C[VIN.GetNameWithFlag]§!. Les hauts plateaux Tai et Hmong du nord-ouest conservent leurs propres institutions et coutumes sous le Parti, et leurs mines et champs dépendent de Hanoï.\n\nPrésident du comité administratif :\n\n§HLo Van Hac§!\n\n\n\n\n\n\n\n£MEO_Lo_Van_Hac_region\n\n\n\n\n\n\n\n\n-------------------------------------"
VIN_tai_meo_region_vcs_state: "Région autonome de Tai-Meo"
VIN_tai_meo_region_vcs_state_desc: "§YRégion autonome de Tai-Meo§!\n-------------\nUne région autonome des §C[VIN.GetNameWithFlag]§!. Le roi Meo siège à la tête du comité régional, liant les notables Hmong de Dong Van à la république tandis que la sortie de la région dépend de Hanoï.\n\nPrésident du comité administratif :\n\n§HVuong Chi Sinh§!\n\n\n\n\n\n\n\n£MEO_Vuong_Chi_Sinh_region\n\n\n\n\n\n\n\n\n-------------------------------------"

