########## VIN

VIN_fighter_equipment_0: "Défense aérienne de l'Armée populaire vietnamienne - Armée de l'Air"
VIN_fighter_equipment_0_short: "VPAF"
VIN_fighter_equipment_0_desc: "La Défense aérienne de l'Armée populaire vietnamienne - Force aérienne, communément appelée Force aérienne populaire du Vietnam (VPAF) ou Force aérienne vietnamienne/vietnamienne (VNAF), est la branche des services de guerre aérienne du Vietnam. C'est le successeur de l'ancienne force aérienne nord-vietnamienne et a absorbé l'armée de l'air de la République du Vietnam après la réunification du Vietnam en 1975 et est l'une des trois branches principales de l'armée populaire vietnamienne, qui est sous la direction du ministère de la Défense nationale. La mission principale de la VPAF est la défense de l'espace aérien vietnamien et la fourniture d'une couverture aérienne pour les opérations de l'Armée populaire du Vietnam."

VIN_fighter_equipment_1: "Yakolev Yak-3"
VIN_fighter_equipment_1_short: "Yak-3"
VIN_fighter_equipment_1_desc: "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
VIN_fighter_equipment_2: "Lavotchkine La-7"
VIN_fighter_equipment_2_short: "La-7"
VIN_fighter_equipment_2_desc: "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
VIN_fighter_equipment_3: "Lavotchkine La-9"
VIN_fighter_equipment_3_short: "La-9"
VIN_fighter_equipment_3_desc: "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

#VIN_jet_multirole_equipment_1: "Mikoyan-Gurevich MiG-9"
#VIN_jet_multirole_equipment_1_desc: "The MiG-9 Fargo was the first Mikoyan designed jet aircraft of the post WW2 era. Introduced in 1948. It saw limited combat and training use during the Chinese Civil War and Korean War. In total 610 aircraft were produced, solely by the USSR. The final MiG 9's were decommissioned by the PRC in 1951."
#VIN_jet_multirole_equipment_1_short: "MiG-9"
VIN_jet_multirole_equipment_2: "Mikoyan-Gourevitch MiG-15"
VIN_jet_multirole_equipment_2_desc: "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
VIN_jet_multirole_equipment_2_short: "MiG-15"
VIN_jet_multirole_equipment_3: "Mikoyan-Gourevitch MiG-17"
VIN_jet_multirole_equipment_3_desc: "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
VIN_jet_multirole_equipment_3_short: "MiG-17"
VIN_jet_multirole_equipment_4: "Mikoyan-Gourevitch MiG-19"
VIN_jet_multirole_equipment_4_desc: "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
VIN_jet_multirole_equipment_4_short: "MiG-19"
VIN_jet_multirole_equipment_5: "Mikoyan-Gourevitch MiG-21F-13"
VIN_jet_multirole_equipment_5_desc: "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
VIN_jet_multirole_equipment_5_short: "MiG-21F-13"
VIN_jet_multirole_equipment_6: "Mikoyan-Gourevitch MiG-21PF"
VIN_jet_multirole_equipment_6_desc: "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
VIN_jet_multirole_equipment_6_short: "MiG-21PF"
VIN_jet_multirole_equipment_7: "Mikoyan-Gourevitch MiG-21bis"
VIN_jet_multirole_equipment_7_short: "MiG-21bis"
VIN_jet_multirole_equipment_7_desc: "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés au PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI (\"Fishbed-L\"), tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS (\"Fishbed-N\")."
VIN_jet_multirole_equipment_8: "Mikoyan-Gourevitch MiG-23ML"
VIN_jet_multirole_equipment_8_desc: "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
VIN_jet_multirole_equipment_8_short: "MiG-23ML"
VIN_jet_multirole_equipment_9: "Mikoyan-Gourevitch MiG-23MLD"
VIN_jet_multirole_equipment_9_desc: "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
VIN_jet_multirole_equipment_9_short: "MiG-23MLD"
#VIN_jet_multirole_equipment_10: ""
#VIN_jet_multirole_equipment_10_desc: ""
#VIN_jet_multirole_equipment_10_short: ""

VIN_mr_stealth_fighter_equipment_1: "Soukhoï Su-30MK2V"
VIN_mr_stealth_fighter_equipment_1_short: "Su-30MK2V "
VIN_mr_stealth_fighter_equipment_1_desc: "Le Sukhoi Su-30 est une conception fortement améliorée du Su-27. Les mises à niveau comprennent une suite de capteurs mise à jour, permettant une capacité multirôle et une cellule entièrement repensée. Le cockpit a également été modernisé avec 2 écrans multifonctions (MFD) et un nouveau HUD."

