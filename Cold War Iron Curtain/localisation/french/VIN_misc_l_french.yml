VIN_Danh_Power_Struggle: "L'opposition stalinienne"
VIN_Danh_Circulate_Letters: "Faites circuler les lettres de Danh"
VIN_Danh_Circulate_Letters_desc: "Des copies des lettres de Tran Ngoc Danh à Moscou circulent main dans la main entre les cadres qui ont étudié en Union soviétique et en France. Chaque lecteur qui est d'accord avec eux est une voix de plus pour la ligne orthodoxe."
VIN_Danh_Appeal_to_Grigoryan: "Appel à la Commission de politique étrangère"
VIN_Danh_Appeal_to_Grigoryan_desc: "Les alliés de Danh envoient un autre dossier à V.G. Commission de politique étrangère de Grigoryan, avec les dossiers du Komintern et de nouvelles plaintes concernant les déviations nationalistes des dirigeants."
VIN_Danh_Rally_Orthodox_Cadres: "Rassembler les cadres orthodoxes"
VIN_Danh_Rally_Orthodox_Cadres_desc: "Les réunions à huis clos du Viet Bac rassemblent des cadres qui estiment que le Parti s'est éloigné du marxisme-léninisme. Leur organisation renforce la faction stalinienne, mais la querelle ne peut plus être cachée à la base."
VIN_Danh_Expose_Ho_Deviations: "Exposer les déviations de Ho"
VIN_Danh_Expose_Ho_Deviations_desc: "Les staliniens font connaître le programme de Ho Chi Minh de 1941, ses propos sur un Vietnam neutre comme la Suisse et la dissolution du Parti communiste indochinois comme preuve que le président a abandonné la ligne de classe."
VIN_Danh_Bring_In_Duan_Tho: "Apportez Le Duan et Le Duc Tho"
VIN_Danh_Bring_In_Duan_Tho_desc: "Le Duan et Le Duc Tho n'aiment pas Danh, mais ce sont des partisans de la ligne dure qui doutent de la patience d'Ho Chi Minh. Avec le groupe militaire à nos côtés, ils peuvent être persuadés que l'avenir appartient à la ligne orthodoxe."
VIN_Danh_Expose_Ho_Marriage: "Révéler le mariage du président"
VIN_Danh_Expose_Ho_Marriage_desc: "Hô Chi Minh n'a jamais répondu à la lettre de Guangzhou, et il n'a jamais reconnu la femme qu'il y a épousée en 1926. Elle est la preuve que la vie de dévouement désintéressé du président est une histoire soigneusement gardée, et que les staliniens entendent raconter la vraie."
VIN_Tang_Letter_Ignored: "La lettre de §YTang Tuyet Minh§! est restée sans réponse"
VIN_Tang_Letter_Ignored_tt: "§YTang Tuyet Minh§! pourrait réécrire après le règlement de Genève.\nSi §YTran Ngoc Danh§! défie le président, sa faction peut dénoncer le mariage."
VIN_Tang_Arrived: "§YTang Tuyet Minh§! a trouvé refuge au Vietnam"
VIN_Tang_Recognized: "§YHo Chi Minh§! a reconnu §YTang Tuyet Minh§! comme son épouse"
VIN_Recognized_Tang_Tuyet_Minh: "Tang Tuyet Minh reconnu"
VIN_Tang_Tuyet_Minh_Cared_For: "Nous avons laissé Tang Tuyet Minh à nos soins"
VIN_STL_COMECON_Member: "Membre du COMÉCON"
VIN_STL_COMECON_Member_desc: "Les crédits, les machines et les spécialistes soviétiques affluent au Vietnam par l'intermédiaire du Conseil d'assistance économique mutuelle."
VIN_Orthodox_Stalinist: "Stalinien orthodoxe"
VIN_Destalinizing_Reformer: "Réformateur déstalinisant"
VIN_Soviet_Republic: "République soviétique du Vietnam"
VIN_Soviet_Republic_ADJ: "Vietnamien"
VIN_Soviet_Republic_DEF: "la République Soviétique du Vietnam"
VIN_Danh_Struggle_Active: "La lutte entre §YHo Chi Minh§! et §YTran Ngoc Danh§! est en cours"
VIN_Danh_Coup_Launched: "§YLe coup d'État§! de Tran Ngoc Danh a été lancé"
VIN_Danh_Coup_Succeeded: "§YLe coup d'État§! de Tran Ngoc Danh a réussi"
VIN_Stalin_Survived_TT: "§YJoseph Staline§! a survécu à son accident vasculaire cérébral et dirige toujours l' §YUnion soviétique§!"
VIN_Stalin_Died_TT: "§YJoseph Staline§! est mort et une nouvelle direction dirige l' §YUnion soviétique§!"
VIN_STL_Hong_Ve_Army: "Armée Hong Ve"
VIN_STL_Hong_Ve_Army_desc: "Les milices sont parties ; Les divisions de la Garde rouge, sur le modèle soviétique, mènent désormais la guerre, combattant toujours mieux sur le sol vietnamien."
VIN_STL_Deep_Battle_Army: "Bataille profonde"
VIN_STL_Deep_Battle_Army_desc: "Conformément à la doctrine des opérations en profondeur de l'Armée rouge, nos divisions percent et pénètrent dans les arrières de l'ennemi."
VIN_STL_Defence_In_Depth_Army: "Défense en profondeur"
VIN_STL_Defence_In_Depth_Army_desc: "Comme les défenseurs de Koursk, notre armée saigne l'ennemi sur des défenses superposées avant de riposter."
VIN_Ho_Recall_Danh_From_Prague: "Commandez Danh de retour de Prague"
VIN_Ho_Recall_Danh_From_Prague_desc: "Le Comité central réitère son ordre de réintégrer Tran Ngoc Danh au Bac Viet et de répondre de son départ sans autorisation de son poste en France. Chaque refus le fait ressembler moins à un camarade qu'à un déserteur."
VIN_Ho_Assure_Moscow: "Assurer Moscou de notre loyauté"
VIN_Ho_Assure_Moscow_desc: "Nos envoyés expliquent aux camarades soviétiques que la tactique du front national sert le camp socialiste et que les accusations de Prague émanent d'un homme qui a brisé la discipline du Parti."
VIN_Danh_Coup_Countdown: "Le coup d'État contre Hô Chi Minh"
VIN_Danh_Coup_Countdown_desc: "La faction de Tran Ngoc Danh s'attaquera au président à la fin de ce compte à rebours. Regardez les barres de soutien au Parti et de faveur soviétique ci-dessus."
VIN_Danh_Countdown_Danh_tt: "Le coup d'État est lancé. Il §Gréussit§! si tout cela est vrai, sinon il §Réchoue§! et les conspirateurs sont purgés :\n- §YJoseph Staline§! l'a approuvé\n- §YTran Ngoc Danh§! a plus de soutien du Parti que §YHo Chi Minh§! (maintenant [?VIN.VIN_Stalinist_Support|0] contre [?VIN.VIN_Ho_Support|0])\n- l'Union Soviétique §Ya envoyé§! l'aide, Moscou a différé la reconnaissance du gouvernement de Ho, ou Ho a purgé la gauche du VNQDD"
VIN_Danh_Countdown_Ho_tt: "§YTran Ngoc Danh§! tente son coup d'État. Il §Rréussit§! s'il a plus de soutien du Parti que §YHo Chi Minh§! (maintenant [?VIN.VIN_Stalinist_Support|0] contre [?VIN.VIN_Ho_Support|0]) ET §YFaveur Soviétique§! est d'au moins §Y85§! (maintenant [?VIN.VIN_SOV_Favor|0]). Sinon, sa faction est brisée."
VIN_Sided_With_Danh_tt: "Nous nous sommes rangés du côté de §YTran Ngoc Danh§!"
VIN_Sided_With_Ho_tt: "Nous nous sommes rangés du côté de §YHo Chi Minh§!"
VIN_Sided_With_Danh_tt_NOT: "Nous n'avons pas pris le parti de §YTran Ngoc Danh§!"
VIN_Sided_With_Ho_tt_NOT: "Nous n'avons pas pris le parti de §YHo Chi Minh§!"
VIN_Backs_Danh_tt: "Nous soutenons la faction stalinienne. La branche de mise au point du coup d'État s'ouvre et le coup d'État est lancé à la fin du compte à rebours. §YHo Chi Minh§! ripostera chaque mois."
VIN_Danh_Stalinist_Agitation: "Danh s'agite dans le parti"
VIN_Danh_Stalinist_Agitation_desc: "Depuis Prague, Tran Ngoc Danh ne cesse d'écrire aux camarades soviétiques et à tous les cadres qui veulent l'écouter. Chaque mois, ses lettres gagnent davantage de convertis à la ligne orthodoxe et davantage de sympathie à Moscou. Nous devons garder le Parti et l'Union Soviétique à nos côtés avant qu'il n'agisse contre le Président."
VIN_Danh_Stalinist_Agitation_tt: "§YTran Ngoc Danh§! gagne §R8§! §YSoutien au parti§! (maintenant [?VIN.VIN_Stalinist_Support|0]) et §R6§! §YFaveur soviétique§! (maintenant [?VIN.VIN_SOV_Favor|0]).\nSon agitation continue pendant encore un mois."
VIN_Ho_Rallies_Committee: "Hô Chi Minh rallie le Comité central"
VIN_Ho_Rallies_Committee_desc: "Le président n'est pas resté inactif. Chaque mois, Hô Chi Minh appelle les cadres au Bac Viet, leur rappelle la Révolution d'Août et assure aux camarades soviétiques que le front national est au service du camp socialiste. Un véritable travail politique est nécessaire pour le devancer."
VIN_Ho_Rallies_Committee_tt: "§YHo Chi Minh§! gagne §R4§! §YParty Support§! (maintenant [?VIN.VIN_Ho_Support|0]), ou §Y2§! une fois que nous avons isolé les Thermidoriens.\n§YLa faveur soviétique§! pour les staliniens diminue de §R3§! (maintenant [?VIN.VIN_SOV_Favor|0]), ou §Y1§! une fois que l' §YUnion soviétique§! envoie de l'aide.\nSi §YTran Ngoc Danh§! arrive en tête du soutien du Parti, il perd §R2§!.\nLa contre-campagne de Ho se poursuit encore un mois."
VIN_Backs_Ho_tt: "Nous sommes aux côtés du président. Danh tentera de prendre le pouvoir à la fin du compte à rebours ; nous devons l'empêcher de gagner le Parti et Moscou."
VIN_Ho_Support_Adj_tt: "Ajustera §YParty Support§! pour §YHo Chi Minh§! par [?struggle_change|Y%%]."
VIN_Stalinist_Support_Adj_tt: "Ajustera §YParty Support§! pour §YTran Ngoc Danh§! de [?struggle_change|Y%%]."
VIN_SOV_Favor_Adj_tt: "Ajustera §YFaveur soviétique§! pour la faction stalinienne §Y§! de [?struggle_change|Y%%]."
VIN_STRUGGLE_TITLE: "La ligne du parti"
VIN_STRUGGLE_TT: "La ligne du parti\n\n La faction de Tran Ngoc Danh accuse Hô Chi Minh de placer la nation avant la lutte des classes. Plus les staliniens gagnent du soutien au sein du Parti et plus Moscou les écoute, plus ils se rapprochent de la contestation du président lui-même."
VIN_STRUGGLE_SOV_FAVOR_TITLE: "Faveur soviétique"
VIN_STRUGGLE_SOV_FAVOR_TT: "Faveur soviétique\n\n Dans quelle mesure les dirigeants soviétiques font-ils confiance à chaque camp ? La part de gauche appartient à Hô Chi Minh, la part de droite aux staliniens de Tran Ngoc Danh. Sans le soutien de Moscou, aucune contestation de Ho ne pourra aboutir."
VIN_STRUGGLE_SUPPORT_TITLE: "Soutien aux partis"
VIN_STRUGGLE_SUPPORT_TT: "Soutien aux partis\n\n La part des cadres du Parti et des officiers de l'armée qui soutiennent chaque dirigeant."
VIN_STRUGGLE_HO_NAME: "Hô Chi Minh"
VIN_STRUGGLE_DANH_NAME: "Tran Ngoc Danh"
VIN_STRUGGLE_HO_TT: "Hô Chi Minh\n\n Président de la République démocratique du Vietnam et fondateur du Parti communiste indochinois. Son large front national a porté la résistance contre la France, mais ses détracteurs disent qu'il a éloigné le Parti du marxisme-léninisme."
VIN_STRUGGLE_DANH_TT: "Tran Ngoc Danh\n\n Frère cadet du premier secrétaire général Tran Phu et ancien chef de la mission vietnamienne à Paris. Depuis Prague, il dénonce Hô Chi Minh comme un nationaliste et un opportuniste et demande à Moscou de ramener le Parti sur la ligne stalinienne orthodoxe."
NLF_Binh_Killed: "Nguyen Binh a été tué"
VIN_Backs_Danh: "Nous avons pris le parti de Tran Ngoc Danh"
VIN_Post_DBP_Settlement_After_South: "Un règlement a été recherché après la campagne du sud"
