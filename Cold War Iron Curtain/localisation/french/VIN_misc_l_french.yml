l_french:

VIN_Intel_Operation_Lorraine: "Renseignement : détournement de la rivière Clear"
VIN_Intel_Operation_Lorraine_desc: "Les colonnes du CEFEO opèrent contre les dépôts arrières autour de Phu Doan tandis que la campagne du Nord-Ouest reste active. Les rapports sont incomplets ; protéger la région de dépôt mise en évidence sans abandonner l'objectif principal."
VIN_Intel_Operation_Hirondelle: "Renseignement : Raid aéroporté de Lang Son"
VIN_Intel_Operation_Hirondelle_desc: "Les troupes aéroportées françaises menacent le réseau de dépôts de Lang Son et Loc Binh. Le CEFEO contrôle le calendrier de l'opération ; cette mission d'observation n'a aucun effet de résolution indépendant."
VIN_Intel_Operation_Mouette: "Renseignement : balayage du delta sud"
VIN_Intel_Operation_Mouette_desc: "Les groupes mobiles français déferlent sur le secteur de Phu Nho Quan. Le CEFEO contrôle le calendrier de l'opération ; cette mission d'observation n'a aucun effet de résolution indépendant."
VIN_Intel_Operation_Brochet: "Renseignement : balayage du Hung Yen"
VIN_Intel_Operation_Brochet_desc: "Les bataillons du CEFEO nettoient le secteur de Hung Yen. Le CEFEO contrôle le calendrier de l'opération ; cette mission d'observation n'a aucun effet de résolution indépendant."
VIN_Intel_Operation_Castor: "Renseignement : Dien Bien Phu Airhead"
VIN_Intel_Operation_Castor_desc: "Les troupes aéroportées françaises établissent un camp à Dien Bien Phu. La fenêtre d'établissement initiale dure trente jours."
VIN_Intel_Operation_Pollux: "Renseignement : retrait de Lai Chau"
VIN_Intel_Operation_Pollux_desc: "La garnison de Lai Chau avance sur la route vers Dien Bien Phu. Le retrait devrait faire l'objet d'une décision dans un délai de vingt et un jours."
VIN_Intel_Operation_Atlante: "Renseignement : offensive au centre du Vietnam"
VIN_Intel_Operation_Atlante_desc: "Les colonnes alignées sur la France opèrent contre les réseaux sudistes au centre du Vietnam. La fenêtre opérationnelle dure quatre-vingt-dix jours."

VIN_indochina_campaign_window_trigger_TT: "La guerre d'Indochine se poursuit, aucun règlement n'a été signé et aucune offensive majeure du CEFEO n'est en cours"
VIN_indochina_campaign_window_trigger_TT_NOT: "La guerre d'Indochine est terminée, un règlement a été signé ou une grande offensive du CEFEO est en cours"
VIN_no_campaign_running_trigger_TT: "Aucune campagne n'est actuellement sur le terrain"
VIN_no_campaign_running_trigger_TT_NOT: "Une campagne est actuellement sur le terrain"
VIN_campaign_cooldown_ready_trigger_TT: "Les divisions engagées dans notre dernière campagne ont terminé la période de regroupement requise"
VIN_campaign_cooldown_ready_trigger_TT_NOT: "Les divisions engagées dans notre dernière campagne se regroupent encore"

VIN_Chinese_PRC_Victory_tt: "Le Parti communiste chinois a pris le contrôle du continent"
VIN_Chinese_ROC_Victory_tt: "Le Kuomintang a pris le contrôle du continent"

VIN_Destalinization: "Déstalinisation"

VIN_Accept_Foreign_Investments: "Canaliser l'aide étrangère vers le développement"
VIN_Accept_Foreign_Investments_desc: "L'aide que nous avons obtenue de l'étranger ne doit pas disparaître dans le trésor de guerre. Le diriger vers les bureaux de planification et l'administration donne à la République les premières institutions d'une économie de travail."

VIN_Budapest_Model_tt: "Nous avons décidé d'opter pour le modèle de libéralisation de Budapest."
VIN_HCM_Model_tt: "Nous avons décidé de faire confiance à Oncle Ho dans ses idées de réformes."

VIN_DESC_UI_To_Huu: "Poète et haut responsable culturel du Parti, To Huu fixe la ligne idéologique de l'art et de la littérature en RDV. Il qualifie la dissidence de sabotage politique et pousse l'autocritique organisée à imposer la discipline."

VIN_DESC_UI_Xuan_Dieu: "Poète célèbre devenu loyaliste du Parti, Xuan Dieu défend le réalisme socialiste comme la seule voie littéraire légitime. Il donne du prestige aux dénonciations et contribue à isoler les écrivains hésitants par la critique publique."

VIN_DESC_UI_Huy_Can: "Poète révolutionnaire reconnu et figure culturelle, Huy Can soutient la demande du Parti d'unité idéologique dans les arts. Il renforce la ligne officielle avec autorité et prudence plutôt que par le spectacle."

VIN_DESC_UI_Che_Lan_Vien: "Polémiste pointu et adaptable, Che Lan Vien utilise la critique littéraire pour transformer des arguments en verdicts politiques. Il cible l'ambiguïté, l'ironie et l'expérimentation comme des signes de dérive idéologique."

VIN_DESC_UI_Hoang_Trung_Thong: "Poète et organisateur proche du Parti, Hoang Trung Thong aide à coordonner les campagnes qui traduisent les directives en pressions concrètes. Il excelle dans la mobilisation de réunions, de déclarations et de consensus organisés."

VIN_DESC_UI_Nguyen_Dinh_Thi: "Écrivain et responsable culturel de premier plan, Nguyen Dinh Thi défend le récit de la révolution et attaque les tendances « décadentes » de la presse écrite. Il fournit des messages disciplinés qui vont au-delà des réunions internes et s'étendent à la culture publique."

VIN_DESC_UI_Nguyen_Toan: "Figure de cadre loyale utilisée comme voix d'avant-garde, Nguyen Toan fait avancer la campagne grâce à des slogans directs et à l'alignement du public. Il est remplaçable et efficace pour amplifier la pression au niveau de la rue."

VIN_DESC_UI_Nguyen_Huu_Dang: "Révolutionnaire et organisateur chevronné, Nguyen Huu Dang insiste sur le fait que la vie culturelle ne doit pas être réduite à l'obéissance. Il défend le débat ouvert et la dignité des écrivains, même si le climat politique se durcit."

VIN_DESC_UI_Van_Cao: "Compositeur et artiste célèbre, Van Cao jouit d'un immense prestige culturel, même en cas de suspicion. Il est associé à une vision artistique indépendante et résiste à se limiter à la seule propagande."

VIN_DESC_UI_Tran_Dan: "Poète et intellectuel audacieux, Tran Dan pousse l'expérimentation formelle et remet en question le contrôle culturel rigide. Il refuse les abjurations faciles et devient l'emblématique de la défiance du mouvement."

VIN_DESC_UI_Phan_Khoi: "Ancien érudit et critique, Phan Khoi plaide en faveur de l'honnêteté intellectuelle et du droit de critiquer les erreurs. Il utilise un langage et une réputation prudents pour défier les limites étroites de l'expression."

VIN_DESC_UI_Le_Dat: "Poète et éditeur doué, Le Dat contribue à alimenter le courant Nhan-van grâce à une critique pointue et une écriture disciplinée. Il teste les limites à travers des essais et des jeux de mots qui exposent les contradictions de la rhétorique officielle."

VIN_DESC_UI_Hoang_Cam: "Poète connu pour ses images puissantes, Hoang Cam représente la portée culturelle du cercle dissident. Il étend son influence à travers des oeuvres qui résonnent au-delà de la politique formelle."

VIN_DESC_UI_Thuy_An: "Écrivain et journaliste, Thuy An participe au réseau littéraire réformateur et refuse de s'y plier silencieusement. Elle est présentée comme un exemple perturbateur destiné à avertir les autres."

REPUTATION_STRENGTH: "§YPosition politique :§! [?.xiangqi_selected_hp|G0]\n§YPression politique :§! [?.xiangqi_attack_power|G0]"

PLAY_PARTY_VIN: "§LJouez en tant que Party Line§!"
PLAY_REFOR_VIN: "§LIncarnez Nhan Van§!"
PLAY_VIN_EXIT: "§LFermer l'écran§!"
VIN_CHESS_GUIDE_TT: "§YL'AFFAIRE NHAN VAN - GIAI PHAM§!\nHanoï, milieu des années 1950. Les écrivains qui portaient des fusils dans la résistance portent désormais des stylos, et certains d'entre eux veulent utiliser ces stylos contre le Parti lui-même. Deux camps s'affrontent sur toute la ligne : le cercle §YParty Line§! de To Huu en haut, et le cercle §YNhan Van§! de Nguyen Huu Dang en bas. Cette querelle décidera si la République laissera éclore cent fleurs ou les coupera.\n\n§YCHOISIR UN CAMP§!\nChoisissez un côté avec les boutons sous le tableau. Comment vous avez géré les questions de réforme agraire : suivre les conseils de Mao ferme la porte à Nhan Van, et suivre une voie flexible la ferme à la Ligne du Parti. Si vous n'avez emprunté aucune des deux routes, les deux camps vous auront toujours.\n\n§YÀ TON TOUR§!\nCliquez sur l'un de vos propres personnages pour voir qui ils sont, leur §YPosition politique§! et leur §YPression politique§!. Des cercles de guidage apparaissent là où ils peuvent aller : cliquez sur l'un d'eux pour vous y déplacer. Des marqueurs d'attaque apparaissent sur les rivaux à portée de main : cliquez sur un pour attaquer. Cliquer sur la figure d'un rival affiche uniquement ses détails.\n\n§YATTAQUES§!\nUne attaque ne fait pas bouger votre silhouette. Cela supprime la position de la cible en fonction de la pression de votre figurine. Un personnage dont le statut atteint zéro est déshonoré et quitte définitivement le plateau. La plupart des personnages frappent là où ils pourraient se déplacer. Le canon est l'exception : il ne frappe qu'en sautant exactement une figure en ligne droite.\n\n§YL'AUTRE CAMP§!\nAprès chaque mouvement ou attaque, le camp adverse répond immédiatement. Il préfère attaquer quand il le peut, sinon il avancera.\n\n§YLES CHIFFRES§! (Debout / Pression)\nGénéral 6/2 - À Huu et Nguyen Huu Dang. Perdez le vôtre et vous perdez l'affaire.\nAvant-garde 3/2 - Xuan Dieu et Van Cao.\nÉléphant 9/2 - Huy Can et Tran Dan.\nCheval 6/3 - Che Lan Vien et Phan Khoi.\nChariot 8 / 5 - Hoang Trung Thong et Le Dat.\nCanon 6/5 - Nguyen Dinh Thi et Hoang Cam.\nSoldat 4/1 - Nguyen Toan et Thuy An.\n\n§YLE RÉSULTAT§!\nDéshonorez le général rival pour mettre fin à l'affaire. Si la ligne du parti l'emporte, l'État se tourne vers §YDétruire les pensées réactionnaires§!. Si Nhan Van l'emporte, il doit §YQue cent fleurs fleurissent§!. Ce qui compte, c'est le résultat, pas le camp auquel vous avez joué."

