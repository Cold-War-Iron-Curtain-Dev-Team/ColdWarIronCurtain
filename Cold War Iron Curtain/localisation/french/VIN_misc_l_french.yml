###Team weapons
VIN_team_weapons_1: "SG-43 (HMG), M1938 (mortier)"
VIN_team_weapons_1_short: "SG-43, M1938"
VIN_team_weapons_1_desc: "La SG-43 est une mitrailleuse moyenne développée par PM Goryunov pour remplacer la PM M1910 MG, obsolète, selon les normes de la Seconde Guerre mondiale, qui a été utilisée par l'Union soviétique pendant la majeure partie de la guerre. Le SG-43 utilisait une culasse inclinable et était livré avec un appareil en bas qui permettait d'être monté sur des trépieds, des supports à roues ou sur des véhicules comme arme de support. Le canon est refroidi par air et très dense, ce qui rend difficile son refroidissement dans la plupart des températures, mais il est livré avec un alésage chromé qui peut les supporter. Cela le rend peu fiable à des températures plus élevées. Il a été largement utilisé vers la fin de la Seconde Guerre mondiale. Il a été autorisé dans un grand nombre de pays, ce qui lui a permis de participer aux guerres de Corée et du Vietnam. Bien que l'arme elle-même ait également été impliquée dans de très nombreuses guerres civiles.\nLe mortier M1938 est un mortier soviétique de 120 mm largement utilisé par l'armée soviétique pendant la Seconde Guerre mondiale. Son design est une quasi-copie du Mortier Brandt français de 120 mm. Le mortier lui-même est très facile à assouplir et à détacher et peut se déplacer rapidement pour éviter les contre-tirs. Il utilise des obus très lourds de 120 mm et possède une cadence de tir élevée, ce qui en fait une arme puissante pour frapper les campements ennemis ou l'infanterie se trouvant à couvert, comme des bâtiments."
VIN_team_weapons_2: "120-PM-43 (mortier), KPV (HMG)"
VIN_team_weapons_2_short: "120H-43, KPV"
VIN_team_weapons_2_desc: "Le KPV est une mitrailleuse lourde conçue pour les Soviétiques en 1944 par Semen Vladimirov. Il n'a été mis en production ou en service qu'en 1949. Le canon lui-même a finalement été retiré du service d'infanterie au milieu des années 1960 en raison de son poids immense et remplacé par un HMG alternatif. Il est connu pour sa portée horizontale exceptionnelle de 3 000 mètres et sa portée aérienne de 2 000 mètres. Son gros calibre pouvait également en faire une arme anti-blindée légère et était placé sur les voitures de reconnaissance et les BTR. Il a été utilisé pendant la guerre de Corée et du Vietnam et sa location de longue date a conduit ces armes à être utilisées dans de nombreuses guerres différentes. Même aujourd'hui, l'arme elle-même n'a pas encore été mise hors service et a été témoin de conflits modernes tels que les guerres du Golfe et d'Irak.\nLe mortier 120-PM-43 était un mortier soviétique à culasse de 120 mm chargé par la bouche développé en 1943 et était une version modifiée du M1938. Sa conception a été fortement simplifiée et son poids et ses coûts ont été considérablement réduits. Il a été utilisé à la fin de la Seconde Guerre mondiale et a été utilisé par les Soviétiques dans les guerres d'Afghanistan ainsi qu'au Vietnam et dans la guerre du Golfe."
VIN_team_weapons_3: "NSV (HMG), ASG-17 (HGL)"
VIN_team_weapons_3_short: "NSV, ASG-17"
VIN_team_weapons_3_desc: "Le NSV est une mitrailleuse lourde conçue par Nikitin, Sokolov et Volkov en 1971. Bien qu'elle ait une portée inférieure à celle du KPV, le canon lui-même présente quelques avantages, notamment un poids beaucoup moins important, ce qui lui permet de continuer à être utilisé comme HMG d'infanterie et une plus grande polyvalence. Il était également connu pour être plus fiable et moins cher à fabriquer, permettant une amélioration globale en tant que HMG d'infanterie. Il a été témoin des guerres d'Afghanistan et du Vietnam, ainsi que des guerres en Irak et en Syrie.\nL'ASG-17 est un lance-grenades automatique lourd conçu par KBP en 1967. Il est conçu pour fonctionner depuis un véhicule ou une position fortifiée. Le tambour standard peut contenir jusqu'à 29 grenades et peut toutes les tirer en 10 secondes. Il a été largement utilisé par l'Union soviétique et s'est révélé extrêmement fiable en Afghanistan."
VIN_team_weapons_4: "NSVT (HMG), 2B14 (Mortier)"
VIN_team_weapons_4_short: "NSVT, 2B14"
VIN_team_weapons_4_desc: "Le NSVT est une variante améliorée du NSV HMG qui a été améliorée par ses concepteurs d'origine quelque temps après la sortie de l'arme initiale. Le NSVT présentait des améliorations telles qu'un poids plus léger grâce à des pièces simplifiées et des matériaux plus modernisés pour permettre à l'arme de tirer plus longtemps. C'est également à cette époque que divers accessoires furent développés pour le HMG. Le NSVT est bien connu pour être monté sur les CCP soviétiques tels que le 64, le 72 et le 80.\nLe 2B14 est un mortier léger à tir indirect moderne conçu en 1983 par l'usine d'ingénierie de Nizni Novgorod pour être utilisé dans les forces aéroportées et d'infanterie légère. L'arme tire un mortier moderne de 82 mm et a une cadence de tir d'environ 24 coups par minute. Sa cadence de tir élevée et sa conception logistique efficace en faisaient une excellente arme pour les Soviétiques et son utilisation allait bien au-delà de son objectif prévu, y compris pour les unités de fusils motorisés. Son succès s'est largement manifesté pendant la guerre en Afghanistan."
VIN_team_weapons_5: "Kord-6P50 (HMG), ASG-30 (HGL)"
VIN_team_weapons_5_short: "Kord-6P50, ASG-30"
VIN_team_weapons_5_desc: "Le Kord 6P50 est un HMG russe conçu par Namitulin, Obidin, Bogdanov et Zhirokhin. L'arme présente d'importants changements par rapport à l'ancien NSVT, notamment un boulon rotatif remplaçant le verrou de culasse pivotant, un système de gaz amélioré et un déflecteur de bouche retravaillé. Le canon a beaucoup moins de recul, ce qui lui confère une plus grande précision et des temps de tir plus longs, ce qui le rend meilleur pour supprimer les tirs et l'appui-feu à longue portée. Il est également beaucoup plus léger et produit un volume de feu plus élevé. Il a été témoin de combats dans une grande variété de conflits modernes en Russie et dans la sphère russe, notamment la guerre russo-géorgienne et la guerre civile syrienne. Il existe également des rapports selon lesquels cela a été observé dans les guerres en Irak et en Afghanistan avec les États-Unis, bien que rarement.\nL'ASG-30 est un lance-grenades lourd développé en 1990 par le bureau du KBP pour l'Union soviétique mais qui n'a été adopté qu'après la dissolution en 1995 par la fédération de Russie. Il tire à une cadence de 400 coups par minute et est équipé d'une action Blowback. Sa conception est fortement basée sur l'AGS-17 et est massivement plus légère, plus mobile, a une portée plus longue et est plus précise. Le lanceur a acquis un prestige notable grâce à sa capacité à abattre des ennemis fortifiés. Sa capacité a été prouvée lors de la deuxième guerre de Tchétchénie, où elle s'est révélée être une arme très performante."

VIN_ammo_explosives_1: "RGD-33 (Grenade AT), FMJ (Munitions)"
VIN_ammo_explosives_1_short: "RGD-33, FMJ"
VIN_ammo_explosives_1_desc: "La grenade RGD-33 AP était une grenade à main conçue par Dyakonov en 1933. La grenade elle-même est chargée de TNT et la mèche a été frappée par un processus de lancement et d'élan vers l'avant après avoir été amorcée. La grenade elle-même n'a été assemblée qu'avant le combat pour réduire le risque d'accident, le manchon, l'ogive et la poignée étant séparés. Il indique des niveaux d'utilisation importants avant, pendant et après la Seconde Guerre mondiale ainsi que la guerre de Corée et du Vietnam.\nLa cartouche Full Metal Jacket est une balle inventée en 1882 par le colonel suisse Eduard Rubin. Cependant, des améliorations ont été apportées à la métallurgie depuis la Seconde Guerre mondiale et, en tant que tel, la ronde FMJ de la Seconde Guerre mondiale a simplement incorporé des matériaux de meilleure qualité dans la conception déjà existante."
VIN_ammo_explosives_2: "RKG-3 (Grenade AT), F1 (Grenade), MON Mines (Mines)"
VIN_ammo_explosives_2_short: "Mines RKG-3, F1, MON"
VIN_ammo_explosives_2_desc: "La grenade RKG-3 AT est une grenade AT soviétique développée en 1950 comme une amélioration du RPG-40 par ses fabricants. Elle a été impliquée dans les guerres d'Irak et de Yom Kippour. La grenade elle-même présentait un meilleur niveau de capacité anti-blindage par rapport à son prédécesseur et comportait un fusible amélioré et un mélange de remplissage puissant.\nLa grenade F1 AP est une grenade AP/frag de développement partagé dans laquelle les fabricants d'armes russes ont amélioré la grenade F1 française existante en installant un fusible à fil-piège moderne et un remplissage en TNT avec un ensemble de coques métalliques à fragmentation de meilleure qualité. Il a été témoin de pratiquement tous les combats russes depuis la Seconde Guerre mondiale, depuis sa création en 1941 jusqu'à nos jours.\nLes mines terrestres MON sont une série de premières mines terrestres développées pour l'Union soviétique par divers concepteurs des années 50 aux années 60. Les mines terrestres MON sont toutes antipersonnel et utilisent généralement la fragmentation et le TNT pour effectuer des missions de déni de zone. Ils ont été témoins de pratiquement tous les combats de l'Union soviétique dans les années 50 et 60."
VIN_ammo_explosives_3: "Munitions AP modernes, mines TM (mines terrestres)"
VIN_ammo_explosives_3_short: "Munitions AP modernes, mines TM"
VIN_ammo_explosives_3_desc: "Les obus AP existent depuis de nombreuses années avant la Première Guerre mondiale et étaient principalement utilisés dans les navires de guerre pénétrants. Autour de la Première Guerre mondiale, après l'entrée du char sur le champ de bataille, des obus miniaturisés ont été créés. Finalement, de petits calibres AP ont été créés en réponse aux gilets pare-balles. Les munitions AP modernes ont été créées en 1965 pour répondre à l'augmentation de l'infanterie lourdement blindée et de la couverture d'infanterie. Les mines terrestres TM sont une série de mines antichars soviétiques initialement développées et largement utilisées vers 1941, mais qui ont été abandonnées en raison d'une pénurie de métal qui a été priorisée pour créer d'autres armes. Cependant, vers 1957, elles firent leur retour et le développement et la production des mines TM se poursuivirent finalement en utilisant des explosifs plus modernes. Les mines TM ont été fréquemment utilisées presque partout où il y avait un conflit dans la sphère soviétique, mais leur plein potentiel a été démontré lors de l'invasion soviétique de l'Afghanistan."
VIN_ammo_explosives_4: "RGO/RGN (Grenades)"
VIN_ammo_explosives_4_short: "RGO/RGN"
VIN_ammo_explosives_4_desc: "La RGO et la RGN sont respectivement des grenades à main à fragmentation défensive et offensive. Ils sont constitués d'un corps pré-fragmenté monocouche. La coque elle-même est composée de 2 sections dentelées en aluminium en haut et en bas. Les grenades elles-mêmes explosent immédiatement à l'impact, rendant la réaction des cibles plus difficile. Ils ont été créés dans le cadre du projet BAZALT pendant la guerre soviéto-afghane et leurs explosions à impact ont permis d'atteindre plus facilement des cibles sur un terrain rocheux.\nLes grenades utilitaires sont des grenades à main qui ont des rôles spécialisés tels que des flashbangs, des fumigènes, des incendiaires, etc. Elles peuvent être utilisées respectivement pour étourdir les ennemis, dissimuler des positions et interdire une zone. "
VIN_ammo_explosives_5: "Rondes modernes"
VIN_ammo_explosives_5_short: "Rondes modernes"
VIN_ammo_explosives_5_desc: "À l'ère moderne, il existe un vaste arsenal de différents types de munitions spécialisées pouvant être utilisées dans des situations spécifiques. Les obus AP modernes sont bien meilleurs pour pénétrer les cibles que les obus AP plus anciens et peuvent atteindre des vitesses plus élevées. Les alliages modernes permettent aux munitions standard d'infliger plus de dégâts à une cible. Les balles frangibles ou les cartouches incendiaires ont des situations particulières dans lesquelles elles sont utiles. De plus, les fusils de chasse peuvent avoir une utilisation améliorée dans les combats modernes avec des cartouches HE, des munitions 000, des cartouches à fléchettes ou des tirs incendiaires."

