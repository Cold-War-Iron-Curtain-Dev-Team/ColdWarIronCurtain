l_french:
 # ============================================================================
 #  THE KOREAN SETTLEMENT - post-war Korea side branch (SOV / Stalin tree)
 #  Appears when the war ends; replaces the wartime branch in place.
 #  The exiled southern government is referred to generically throughout - its
 #  location varies by playthrough and must never be named here.
 # ============================================================================

 # ---- Events ----
 sov_korea_settlement.1.t:0 "Deux Corées"
 sov_korea_settlement.1.d:0 "La ligne est là où elle était et elle va y rester.\n\nCe qui a commencé comme une guerre de réunification s'est terminé par une partition permanente, et les deux moitiés de la péninsule font désormais ce que font les États divisés : construire des armées rivales, des économies rivales et des revendications rivales pour être la seule vraie Corée.\n\nLa république du Nord sera correctement intégrée à l'économie socialiste - coordination des plans, commerce selon nos conditions, assistance technique. C'est un prix plus petit que l'ensemble de la péninsule. C'est aussi une question que personne ne nous enlèvera."
 sov_korea_settlement.1.a:0 "La ligne tient."

 sov_korea_settlement.2.t:0 "Une Corée unifiée"
 sov_korea_settlement.2.d:0 "La Corée est à nouveau un seul pays, et c'est le nôtre.\n\nLa guerre que Kim Il-sung a demandé l'autorisation de déclencher s'est terminée comme il l'avait annoncé, ce qui est plus que ce à quoi s'attendait quiconque au Présidium. Les Américains ont été chassés de la péninsule, le gouvernement du Sud a fui partout où il pouvait encore atteindre, et le camp socialiste détient un littoral à quatre cents kilomètres du Japon.\n\nTokyo a compris les implications plus rapidement que Washington. Il en va de même pour tous les autres pays asiatiques qui attendaient de voir si les garanties américaines valaient quelque chose."
 sov_korea_settlement.2.a:0 "Le premier territoire que l'Occident a effectivement perdu."

 sov_korea_settlement.3.t:0 "Le gouvernement en exil"
 sov_korea_settlement.3.d:0 "Ce qui reste de la république du sud, c'est un cabinet, un drapeau, un émetteur radio et toutes les unités qui en sont sorties.\n\nIl occupe toujours son siège aux Nations Unies, reçoit toujours de l'argent américain et se décrit toujours comme le gouvernement légitime de toute la Corée - un territoire qu'il pourrait perdre en un après-midi si quelqu'un pensait que cela en valait la peine.\n\nLa position de Moscou est qu'un tel gouvernement n'existe pas. Le travail pratique consiste à s'assurer que le reste du monde parvienne à la même conclusion avant que les exilés ne deviennent un embarras permanent."
 sov_korea_settlement.3.a:0 "Un gouvernement d'une île et un grief."

 sov_korea_settlement.4.t:0 "Le désastre coréen"
 sov_korea_settlement.4.d:0 "L'Armée populaire coréenne a été détruite et la République populaire démocratique n'existe plus.\n\nMoscou l'a armé, entraîné, lui a donné les avions et les aviateurs, et l'a quand même perdu. Il existe désormais un État client des États-Unis sur la frontière soviétique du Pacifique, avec des divisions américaines dessus, et aucun tampon d'aucune sorte entre elles et Vladivostok.\n\nLe Présidium n'a pas encore décidé à qui incombe la faute. Il a été décidé que la réponse se trouverait quelque part en dessous du Présidium."
 sov_korea_settlement.4.a:0 "Quelqu'un répondra pour la Corée."

 sov_korea_settlement.5.t:0 "Les camarades coréens"
 sov_korea_settlement.5.d:0 "Ceux du groupe coréen qui sont sortis ont traversé le Tumen vers le nord sans rien.\n\nIls seront réinstallés dans la province maritime et en Asie centrale, maintenus ensemble et utilisables. La Corée organisera à nouveau des élections un jour, ou elle ne le fera pas, et de toute façon, un parti en exil coûte très peu à maintenir et s'avère parfois valoir beaucoup."
 sov_korea_settlement.5.a:0 "Gardez-les. Nous en aurons peut-être besoin."

 # ---- Focuses: shared root ----
 SOV_kwp_the_korean_settlement:0 "La colonie coréenne"
 SOV_kwp_the_korean_settlement_desc:0 "Les armes se sont arrêtées. Ce qu'est la Corée aujourd'hui et ce que l'Union soviétique fait à ce sujet dépend entièrement de la façon dont les combats se sont terminés.\n\nTrois années de guerre ont coûté très cher au camp socialiste et ont appris aux Américains qu'ils se battront. Quelle que soit l'apparence de la carte, l'Asie n'est plus ce qu'elle était en 1950, et la position soviétique non plus."
 SOV_kwp_the_korean_settlement_tt:0 "Débloque la branche §YKorean Settlement§!, en fonction de la fin de la guerre."

 # ---- Focuses: historical division ----
 SOV_kwp_rebuild_the_north:0 "Reconstruire le Nord"
 SOV_kwp_rebuild_the_north_desc:0 "Il reste très peu de choses de la Corée du Nord à la surface.\n\nLa campagne aérienne américaine manqua de cibles en 1952 et se poursuivit malgré tout ; Au moment de l'armistice, les bombardiers détruisaient les barrages d'irrigation parce que les villes avaient déjà disparu. Pyongyang est un pays en ruine avec une population qui vit en dessous.\n\nLe reconstruire n'est pas de la charité. Un client qui ne peut pas se nourrir est un client qui coûte chaque année plus cher, et tout le camp socialiste sera jugé sur ce à quoi ressemblera la Corée du Nord dans dix ans."
 SOV_kwp_rebuild_the_north_tt:0 "Grosses dépenses soviétiques. La Corée du Nord gagne §Yde financement§!, §Yde stabilité§!, un §Ycomplexe industriel§! et §Yd'infrastructures§!, et les relations s'améliorent considérablement."

 SOV_kwp_the_frozen_frontier:0 "La frontière gelée"
 SOV_kwp_the_frozen_frontier_desc:0 "L'armistice est un cessez-le-feu entre commandants, et non une paix entre États. Personne n'a rien signé pour mettre fin à la guerre, et légalement, elle continue.\n\nCela nous convient. Une frontière armée en permanence maintient indéfiniment deux divisions américaines liées en Corée, maintient le Japon nerveux et maintient la république du Nord dépendante des armes soviétiques aussi longtemps que la ligne existera - ce qui, d'après les preuves actuelles, sera très long."
 SOV_kwp_the_frozen_frontier_tt:0 "La Corée du Nord gagne §Yd'équipement§!, §Yd'expérience militaire§! et §Yde soutien de guerre§!et nous accorde un accès militaire.\nLa tension mondiale retombe."

 SOV_kwp_two_koreas_one_peninsula:0 "Deux Corées, une péninsule"
 SOV_kwp_two_koreas_one_peninsula_desc:0 "Aucune des deux Corées ne se reconnaîtra jamais, et toutes deux passeront les cinquante prochaines années à insister sur le fait que la partition est temporaire.\n\nL'intérêt de Moscou est de rendre sa moitié permanente dans tous les domaines, sans même le dire : l'adhésion au COMECON, la coordination des plans, une relation de défense et une économie connectée à la nôtre plutôt qu'à celle des autres.\n\nLa rhétorique de la réunification peut continuer. Cela ne coûte rien et ça joue bien à Pyongyang."
 SOV_kwp_two_koreas_one_peninsula_tt:0 "La Corée du Nord rejoint §YCOMECON§!. Les relations s'améliorent considérablement et la projection de la puissance étrangère soviétique augmente."

 # ---- Focuses: the north wins ----
 SOV_kwp_a_unified_korea:0 "Une Corée unifiée"
 SOV_kwp_a_unified_korea_desc:0 "L'Armée populaire coréenne contrôle la péninsule, depuis le Yalu jusqu'à la mer, et le gouvernement qui dirigeait le sud a fui vers toutes les zones qu'il pouvait encore atteindre.\n\nC'est la première fois depuis 1945 que l'Occident perd un pays à cause des armes, et toutes les capitales d'Asie l'ont remarqué. Il en va de même pour Tokyo, qui fait désormais face à une Corée hostile et unifiée sur cent quatre-vingts kilomètres d'eau et a commencé à poser à Washington des questions pointues sur la valeur réelle de la protection américaine."
 SOV_kwp_a_unified_korea_tt:0 "La Corée est unifiée sous Pyongyang. Gain important en puissance politique §Y§! et projection de la puissance étrangère soviétique.\nLa tension mondiale monte fortement."

 SOV_kwp_rebuild_the_peninsula:0 "Reconstruire la péninsule"
 SOV_kwp_rebuild_the_peninsula_desc:0 "Gagner le pays tout entier, c'est hériter de toute la ruine.\n\nTrois années de guerre et la campagne de bombardements la plus intense depuis l'Allemagne ont laissé les deux moitiés de la Corée aplaties, et le sud - qui a été combattu à quatre reprises - est dans un état pire que le nord. Vingt millions de personnes sont désormais sous notre responsabilité.\n\nIl s'agira du plus grand programme de reconstruction que l'Union soviétique ait jamais entrepris en dehors de ses propres frontières, et chaque rouble en vaudra la peine la première fois qu'une usine coréenne expédiera quelque chose dont nous avons besoin."
 SOV_kwp_rebuild_the_peninsula_tt:0 "Dépenses soviétiques très importantes. La Corée gagne §Yde financement§!, §Yde stabilité§!, deux §Ycomplexes industriels§! et §Yd'infrastructures§!."

 SOV_kwp_the_government_in_exile:0 "Le gouvernement en exil"
 SOV_kwp_the_government_in_exile_desc:0 "La république du Sud survit sur le terrain où elle s'est retirée : un cabinet, une garnison, une subvention américaine et une revendication.\n\nCela ne peut pas menacer la Corée et tout le monde le sait. Ce qu'il peut faire, c'est détenir un siège aux Nations Unies, fournir un drapeau à chaque organisation en exil et tentative d'infiltration au cours des trente prochaines années, et donner à Washington un point de repère lorsqu'il refusera de reconnaître Pyongyang.\n\nNous veillerons à ce que le monde le traite comme ce qu'il est : un gouvernement de nulle part, maintenu en vie par l'embarras."
 SOV_kwp_the_government_in_exile_tt:0 "Le gouvernement du Sud en exil perd §Yde stabilité§! et §Yde soutien de guerre§!.\nLa Corée gagne §Yde soutien de guerre§!. La tension mondiale retombe."

 SOV_kwp_korea_in_the_socialist_camp:0 "La Corée dans le camp socialiste"
 SOV_kwp_korea_in_the_socialist_camp_desc:0 "Une Corée unifiée de vingt millions d'habitants, avec une industrie japonaise au nord et des ports au sud, est la chose la plus précieuse que le camp socialiste ait acquise depuis la guerre.\n\nIl sera intégré correctement : le COMECON, notre système d'alliance, notre sphère et l'accès naval soviétique aux ports donnant directement sur la mer du Japon.\n\nTokyo va passer la prochaine génération à vivre avec les conséquences d'une décision prise à Washington en 1950."
 SOV_kwp_korea_in_the_socialist_camp_tt:0 "La Corée rejoint le §YCOMECON§!, notre §Ysphère§! et, si nous dirigeons une faction, notre alliance.\nGain important dans la projection de la puissance étrangère soviétique. §YLe Japon§! est alarmé."

 # ---- Focuses: the south wins ----
 SOV_kwp_the_korean_disaster:0 "Le désastre coréen"
 SOV_kwp_the_korean_disaster_desc:0 "La République populaire démocratique n'existe plus. L'Armée populaire coréenne a été détruite, ses dirigeants ont fui ou ont été capturés et la péninsule est unie sous un gouvernement qui doit tout à Washington.\n\nMoscou a fourni cette armée, l'a entraînée et lui a assuré une couverture aérienne sous les marquages chinois. Tout cela a disparu et il y a désormais un client américain à la frontière soviétique du Pacifique, sans aucun tampon d'aucune sorte.\n\nLa première tâche est d'arrêter de décrire cela comme autre chose que ce qu'il était."
 SOV_kwp_the_korean_disaster_tt:0 "La république du Nord a disparu. Perdez §Yla stabilité§!, §Yle soutien de guerre§! et une grande partie de la projection de puissance étrangère."

 SOV_kwp_shelter_the_korean_comrades:0 "Abritez les camarades coréens"
 SOV_kwp_shelter_the_korean_comrades_desc:0 "Ce qui reste du Parti des travailleurs coréens a traversé le Tumen avant l'avancée : les cadres, les soldats, les familles, les archives s'ils avaient de la chance.\n\nIls seront réinstallés dans la province maritime et en Asie centrale et maintenus ensemble en tant qu'organisation. Un parti en exil est un piètre atout. C'est également le seul atout coréen qui nous reste, et la Corée ne sera pas éternellement une garnison américaine."
 SOV_kwp_shelter_the_korean_comrades_tt:0 "Gagnez §Yde main d'oeuvre§! et de pouvoir politique à un faible coût pour la stabilité.\nLa popularité communiste augmente en Corée et sa stabilité diminue."

 SOV_kwp_fortify_the_maritime_provinces:0 "Fortifier les provinces maritimes"
 SOV_kwp_fortify_the_maritime_provinces_desc:0 "Il n'existe plus d'État ami entre l'Extrême-Orient soviétique et l'armée américaine.\n\nVladivostok est la base de la flotte du Pacifique et se trouve désormais à portée aérienne tactique d'une péninsule hostile. La province maritime était en garnison contre le Japon ; il devra à nouveau être mis en garnison, contre une menace qui dispose d'armes nucléaires et d'un aérodrome à Pusan.\n\nC'est coûteux, permanent et c'est entièrement le prix à payer pour perdre la Corée."
 SOV_kwp_fortify_the_maritime_provinces_tt:0 "Nouvelle base aérienne §Y§! et radar §Y§! en Extrême-Orient soviétique. Obtenez §Yun soutien de guerre§! et durcissez la politique militaire.\nLa tension mondiale monte."

 SOV_kwp_lessons_of_the_korean_war:0 "Les leçons de la guerre de Corée"
 SOV_kwp_lessons_of_the_korean_war_desc:0 "La guerre mérite d'être étudiée précisément parce qu'elle a été perdue.\n\nLa doctrine soviétique supposait qu'une armée construite sur le modèle de 1945, dotée de suffisamment de blindés et d'artillerie, serait capable de renverser n'importe quoi en Asie. Il l'a fait pendant trois mois, puis il a rencontré la puissance aérienne et la mobilité amphibie américaines et s'est désagrégé.\n\nTout ce qui concerne la façon dont l'armée soviétique envisage de combattre doit être réexaminé : la défense aérienne, la logistique sous interdiction et l'hypothèse selon laquelle la prochaine guerre ressemblera à la dernière. Les hommes qui mèneront cet examen veilleront à ne jamais dire que c'est ce qu'ils font."
 SOV_kwp_lessons_of_the_korean_war_tt:0 "Gain important en §Yarmée§! et §Yexpérience aérienne§!, et un bonus à §Ydoctrine terrestre§! recherche.\nGagnez en pouvoir politique, en stabilité et en projection de puissance étrangère."

 # ---- Threats ----
 SOV_kwp_frozen_frontier_threat:0 "La ligne d'armistice coréenne"
 SOV_kwp_unified_korea_threat:0 "Une Corée communiste unifiée"
 SOV_kwp_exile_threat:0 "Le gouvernement coréen en exil"
 SOV_kwp_maritime_threat:0 "Renforcement de l'Extrême-Orient soviétique"
