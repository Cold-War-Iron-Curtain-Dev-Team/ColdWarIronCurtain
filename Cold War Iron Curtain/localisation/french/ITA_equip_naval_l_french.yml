 #Battleship/Battlecruiser Hulls in research tree# 

 ITA_battle_hull_medium_0:0 "Réaménagement de la classe Duilio"
 ITA_battle_hull_medium_0_desc:0 "La classe Andrea Doria (généralement appelée classe Duilio dans les sources italiennes) était une paire de cuirassés dreadnought construits pour la Marine royale italienne (Regia Marina) entre 1912 et 1916. Les deux navires, Andrea Doria et Duilio, furent achevés pendant la Première Guerre mondiale. La classe représentait une amélioration progressive par rapport à la classe Conte di Cavour précédente. "
 
 #ITA_carrier_hull_light_0:0 ""
 #ITA_carrier_hull_light_1:0 ""
 #ITA_carrier_hull_light_2:0 ""
 ITA_carrier_hull_light_3:0 "Classe Giuseppe Garibaldi"
 ITA_carrier_hull_light_4:0 "Classe Cavour"
 #ITA_carrier_hull_light_0_desc:0 ""
 #ITA_carrier_hull_light_1_desc:0 ""
 #ITA_carrier_hull_light_2_desc:0 ""
 ITA_carrier_hull_light_3_desc:0 "Giuseppe Garibaldi est un porte-avions italien, le premier navire à pont traversant jamais construit pour la marine italienne et le premier navire italien construit pour faire fonctionner des avions à voilure fixe. Il est équipé d'avions et d'hélicoptères à décollage court et atterrissage vertical (STOVL). Giuseppe Garibaldi a participé à des opérations de combat aérien au large de la Somalie, du Kosovo, de l'Afghanistan et de la Libye."
 ITA_carrier_hull_light_4_desc:0 "Le navire est conçu pour combiner les opérations aériennes V/STOL et hélicoptères à voilure fixe, les opérations de commandement et de contrôle et le transport de personnel militaire ou civil et de véhicules lourds. L'espace du hangar de 134 m (440 pi) et 2 800 m2 (30 000 pi²) peut servir de soute à véhicule capable de contenir jusqu'à 24 chars de combat principaux (généralement Ariete) ou beaucoup plus de véhicules plus légers (50 Dardo IFV, 100+ Iveco LMV), et est équipé à l'arrière de rampes d'accès d'une capacité de 70 tonnes, ainsi que de deux ascenseurs d'une capacité jusqu'à 30 tonnes pour les avions."

 # Submarine Hulls #
 ITA_sub_hull_small_single_0:0 "Classe Tang"
 ITA_sub_hull_small_single_0_desc:0 "Les sous-marins de classe Tang ont été les premiers sous-marins conçus (dans le cadre du projet SCB 2) et construits par la marine américaine après la Seconde Guerre mondiale. Ils incorporaient les meilleures caractéristiques du sous-marin allemand à grande vitesse de type XXI et du vénérable sous-marin de la flotte américaine."
 ITA_sub_hull_small_single_1:0 "Classe Toti"
 ITA_sub_hull_small_single_1_desc:0 "La classe Toti était un sous-marin construit pour la marine italienne dans les années 1960. Ce sont les premiers sous-marins conçus et construits en Italie depuis la Seconde Guerre mondiale. Ces bateaux étaient petits et conçus comme des sous-marins anti-sous-marins « chasseurs-tueurs ». Ils sont comparables aux sous-marins allemands Type 205 et aux sous-marins français de la classe Aréthuse."
 ITA_sub_hull_small_single_2:0 "Réaménagement de la classe Toti"
 ITA_sub_hull_small_single_2_desc:0 "La classe Toti était un sous-marin construit pour la marine italienne dans les années 1960. Ce sont les premiers sous-marins conçus et construits en Italie depuis la Seconde Guerre mondiale. Ces bateaux étaient petits et conçus comme des sous-marins anti-sous-marins « chasseurs-tueurs ». Ils sont comparables aux sous-marins allemands Type 205 et aux sous-marins français de la classe Aréthuse."
 ITA_sub_hull_small_single_3:0  "Classe Sauro"
 ITA_sub_hull_small_single_3_desc:0 "La classe Nazario Sauro est un sous-marin diesel-électrique exploité par la marine italienne. Tous les bateaux ont été construits par Fincantieri à Monfalcone."
 ITA_sub_hull_small_single_4:0 "Classe Todaro"
 ITA_sub_hull_small_single_4_desc:0 "La classe allemande Type 212, également classe italienne Todaro, est un sous-marin diesel-électrique développé par Howaldtswerke-Deutsche Werft AG (HDW) pour les marines allemande et italienne. Il est doté d'une propulsion diesel et d'un système de propulsion indépendant de l'air (AIP) supplémentaire utilisant des piles à combustible à hydrogène comprimé à membrane échangeuse de protons (PEM) de Siemens." 

 ITA_sub_hull_large_single_0:0 "Classe de tanche"
 ITA_sub_hull_large_single_0_desc:0 "Les sous-marins de classe Tench étaient un type de sous-marin construit pour la marine américaine (USN) entre 1944 et 1951. Ils constituaient une amélioration par rapport aux classes Gato et Balao, seulement environ 35 à 40 tonnes plus grandes, mais plus solidement construits et avec une disposition interne légèrement améliorée."

 # Screen Hulls #
 ITA_screen_hull_medium_0:0 "Classe Aldébaran"
 ITA_screen_hull_medium_0_desc:0 "La classe Aldebaran était une classe de quatre frégates/corvettes/destroyers d'escorte exploités par la marine italienne. Ils sont entrés en service en 1951, le dernier étant mis hors service en 1976."
 ITA_screen_hull_medium_1:0 "Classe Centaure"
 ITA_screen_hull_medium_1_desc:0 "La classe Centauro était une classe de quatre frégates exploitées par la marine italienne. Ils sont entrés en service en 1957, le dernier étant frappé en 1985."
 ITA_screen_hull_medium_2:0 "Cours Alpino"
 ITA_screen_hull_medium_2_desc:0 "Le design a été conçu à l'origine comme une version agrandie des frégates de classe Canopo. La conception a cependant été radicalement modifiée avec une suite de machines CODAG comprenant des turbines à gaz et des moteurs diesel. Ces navires ont introduit l'utilisation d'hélicoptères embarqués et de sonars à profondeur variable dans la marine italienne."
 ITA_screen_hull_medium_3:0 "Classe Lupo"
 ITA_screen_hull_medium_3_desc:0 "La classe Lupo est une classe de frégates construites par Cantieri Navali Riuniti (CNR) pour la marine italienne. Conçus comme des navires de guerre polyvalents mettant l'accent sur la guerre anti-surface (ASuW), ils ont connu un certain succès sur le marché d'exportation, étant acquis par les marines du Pérou et du Venezuela. Une petite série d'une version légèrement mise à jour est connue sous le nom de classe Soldati."
 ITA_screen_hull_medium_4:0 "Classe Maestrale"
 ITA_screen_hull_medium_4_desc:0 "La classe Maestrale est une classe de frégates de la marine italienne. La classe est composée de huit navires, tous construits par Fincantieri S.p.A., Riva Trigoso, à l'exception du Grecale, qui a été construit par Fincantieri S.p.A. - Muggiano, La Spezia."

 ITA_screen_hull_heavy_0:0 "Classe San Giorgio"
 ITA_screen_hull_heavy_0_desc:0 "La classe San Giorgio était une classe de deux destroyers de la marine italienne. Ils sont entrés en service en 1955, le dernier ayant été mis hors service en 1980. Anciens croiseurs de classe Capitani Romani de la Regia Marina (Marine royale italienne) pendant la Seconde Guerre mondiale, ils ont été reconstruits en destroyers pendant la Guerre froide."
 ITA_screen_hull_heavy_1:0 "Classe impétuose"
 ITA_screen_hull_heavy_1_desc:0 "La classe Impetuoso fut le premier destroyer construit après la Seconde Guerre mondiale pour la marine italienne. Les deux navires ont été commandés en février 1950, sont entrés en service en 1958 et ont été retirés du service au début des années 1980."
 ITA_screen_hull_heavy_2:0 "Cours d'impavido"
 ITA_screen_hull_heavy_2_desc:0 "La classe Impavido était le deuxième groupe de destroyers construits pour la marine italienne après la Seconde Guerre mondiale et les premiers destroyers lance-missiles italiens. De performances similaires à celles de la classe Charles F. Adams de l'US Navy, ces navires étaient essentiellement des navires améliorés de la classe Impetuoso, la tourelle arrière étant remplacée par un lanceur de missiles sol-air Tartar et un radar associé."
 ITA_screen_hull_heavy_3:0 "Classe Durand de la Penne"
 ITA_screen_hull_heavy_3_desc:0 "La classe Durand de la Penne est composée de deux destroyers lance-missiles exploités par la marine italienne. La conception est une version agrandie de la classe Audace, mise à jour avec des machines CODOG diesel et à turbine à gaz et des capteurs modernes. Quatre navires étaient prévus mais la deuxième paire a été annulée lorsque l'Italie a rejoint le projet Horizon."
 ITA_screen_hull_heavy_4:0 "Classe Orizzonte"
 ITA_screen_hull_heavy_4_desc:0 "La classe Horizon est une classe de destroyers de défense aérienne en service dans la marine française et la marine italienne, désignés comme destroyers selon la classification OTAN. Le programme a débuté sous le nom de Common New Generation Frigate (CNGF), une collaboration multinationale visant à produire une nouvelle génération de frégates de défense aérienne. En Italie, la classe est connue sous le nom de classe Orizzonte."

 ITA_battle_hull_light_0:0 "Classe Giuseppe Garibaldi"
 ITA_battle_hull_light_0_desc:0 "Après la guerre, il fut conservé par la marine italienne et modernisé avec des modifications mineures de l'armement et d'un radar. Il a été mis hors service en 1953 et reconstruit en croiseur lance-missiles."
 ITA_battle_hull_light_1:0 "Classe d'Andrea Doria"
 ITA_battle_hull_light_1_desc:0 "La classe Andrea Doria était un croiseur hélicoptère de la marine italienne. Premiers nouveaux modèles majeurs de l'Italie après la Seconde Guerre mondiale, ces navires étaient principalement conçus pour des tâches de guerre anti-sous-marine. Initialement prévus pour trois navires, les deux navires construits, Andrea Doria et Caio Duilio, ont servi jusqu'en 1991 à la fois en tant qu'actifs et en formation."
 ITA_battle_hull_light_2:0 "Classe Vittorio Veneto"
 ITA_battle_hull_light_2_desc:0 "Vittorio Veneto était un croiseur hélicoptère qui servait dans la marine italienne. Initialement destiné à être une classe de deux navires spécifiquement conçus pour la guerre anti-sous-marine (ASW), seul le Vittorio Veneto est entré en service en 1969, son sister-ship Italia étant annulé."
 