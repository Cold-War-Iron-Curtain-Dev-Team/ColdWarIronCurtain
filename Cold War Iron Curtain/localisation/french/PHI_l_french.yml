 ### Decisions ###
 Kamlon_Rebellion_Decisions: "La rébellion de Kamlon"
 Invade_Sulu: "Pacifier Sulu"
 Invade_Sulu_desc: "L'insurrection de Hadji Kamlon a affaibli notre contrôle sur Sulu et Mindandao. Il faut y mettre un terme. Cependant, cela nécessiterait un nombre important de troupes, ce qui pourrait compromettre notre capacité à faire face au Hukbalahap. Nous devons considérer la rentabilité de cette campagne à long terme avant de la mettre en oeuvre."
 PHI_Invade_Sulu_tt: "Durant cette campagne, nous ne pourrons pas mener d'opérations visant le Hukbalahap."
 PHI_Cebu_Maritime_Company_MIO: "Compagnie maritime de Cebu"
 PHI_Development_Decisions: "Programme de développement des Philippines"
 PHI_Development_Decisions_desc: "\n\n\n\n\n£decision_PHI_Development_Scheme\n\n\n\n\n\n\nIl existait de nombreux programmes et propositions nationaux complets axés sur la reconstruction, la modernisation et la stabilité après la Seconde Guerre mondiale, combinant la reconstruction des infrastructures (transports, chemins de fer et urbanisme), la réforme agraire et la réinstallation rurale, le soutien aux entreprises industrielles et locales et la coopération stratégique en matière de défense. Ces projets visaient à relancer l'économie, à lutter contre les inégalités sociales, à contrer l'insurrection et à transformer les Philippines d'un État agricole colonial arriéré en un État industrialisé moderne et connecté au monde."
