########## MLA INFANTRY

MLA_infantry_equipment_0: "Fusil à verrou Arisaka Type 38"
MLA_infantry_equipment_0_short: "Type-38"
MLA_infantry_equipment_0_desc: "Le Type 38 Arisaka était un fusil à verrou utilisé par l'Armée de libération malaise pendant l'urgence malaise. À l'origine une arme impériale japonaise de la Seconde Guerre mondiale, elle a été abandonnée en Asie du Sud-Est, modifiée et acquise par les insurgés communistes. Le Type 38 était apprécié pour sa précision à longue portée et sa conception robuste, ce qui le rendait adapté à la guerre dans la jungle. Malgré son âge, il servit bien aux insurgés dans les embuscades et les tactiques de guérilla contre les forces britanniques et du Commonwealth. Sa cartouche de 6,5 mm avait un recul modéré, permettant un meilleur contrôle lors d'engagements rapides."

MLA_infantry_equipment_1: "Avtomat Kalachnikova 1947"
MLA_infantry_equipment_1_short: "AK-47"
MLA_infantry_equipment_1_desc: "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

MLA_infantry_equipment_2: "Fusil d'assaut ZB-63"
MLA_infantry_equipment_2_short: "ZB-63"
MLA_infantry_equipment_2_desc: "Le ZB-63 est un fusil d'assaut automatique conçu par l'Arsenal du gouvernement de la RPC en 1963. Il a été utilisé au Vietnam, au Cambodge, en Afghanistan, au Kosovo et aux Touareg. L'arme comporte un mécanisme interne similaire à celui de l'AK et un mécanisme externe et un boîtier similaires à ceux du SKS. Cela permet à l'arme de faire un compromis entre la portée et la puissance de feu automatique, ce qui la rend comparable à un ZB-56 à longue portée. L'arme a une portée de tir efficace deux fois supérieure à celle du SKS et une cadence de tir légèrement supérieure à celle du ZB-56. L'arme est très fiable et son prix est modeste. Au cours des 10 années de fabrication, plus d'un million de fusils ont été fabriqués."

MLA_infantry_equipment_3: "Fusil d'assaut ZB-81"
MLA_infantry_equipment_3_short: "ZB-81"
MLA_infantry_equipment_3_desc: "Le ZB-81 est un fusil d'assaut automatique qui peut être modifié en une variété d'armes conçues par Norinco en 1981. Il a été témoin de tous les conflits sino-chinois depuis sa création, notamment la guerre sino-vietnamienne, l'Afghanistan et le Sri Lanka. Le ZB-81 est une amélioration basée sur le ZB-63 mais n'a pas la même portée efficace. L'arme elle-même a plus de puissance de feu que le ZB-63 et intègre une variété d'éléments du Dragunov, du SKS et de l'AK47. De plus, sa durée de vie est plus longue que l'AK47. De plus, l'arme prend en charge les fixations sous le canon."

MLA_infantry_equipment_4: "Fusil d'assaut ZB-81A"
MLA_infantry_equipment_4_short: "ZB-81A"
MLA_infantry_equipment_4_desc: "Le ZB-81 est un fusil d'assaut automatique qui peut être modifié en une variété d'armes conçues par Norinco en 1981. Il a été témoin de tous les conflits sino-chinois depuis sa création, notamment la guerre sino-vietnamienne, l'Afghanistan et le Sri Lanka. Le ZB-81 est une amélioration basée sur le ZB-63 mais n'a pas la même portée efficace. L'arme elle-même a plus de puissance de feu que le ZB-63 et intègre une variété d'éléments du Dragunov, du SKS et de l'AK47. De plus, sa durée de vie est plus longue que l'AK47. De plus, l'arme prend en charge les fixations sous le canon."

