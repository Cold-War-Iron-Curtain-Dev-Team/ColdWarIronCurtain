#MLA MQJ Focus Descs
MLA_Establish_MGQ_desc: "La Malaixiya Qingbao Ju (Agence de renseignement malaisienne) sera créée pour nous protéger des infiltrations étrangères et promouvoir nos intérêts à travers le continent."
MLA_Thai_Destabilization_Campaign_desc: "Avec la disparition de l'OTASE, nous pouvons envisager d'exporter la révolution à travers le continent. Il est peut-être temps de traiter plus directement le problème thaïlandais."
MLA_Attempt_to_Hijack_the_Malay_Nationalist_Movement_desc: "Depuis des décennies, il existe un mouvement séparatiste malais dans le sud de la Thaïlande. Nous essaierons de renverser son leadership et de rendre ses objectifs plus conformes aux nôtres."
MLA_Contact_Pathet_Lao_Splinters_desc: "Des groupes issus du Pathet Lao sont présents en Thaïlande. Nous solliciterons leur aide pour renverser le gouvernement thaïlandais."
MLA_Coordination_with_the_CPT_desc: "Notre plus grand allié en Thaïlande est leur parti communiste. Nous contribuerons à accroître leur influence dans le pays."
MLA_Funnel_Heavy_Weapons_Through_Hat_Yai_desc: "La Nation Thaïlandaise sera implantée dans le Nord du Malaisien, ce sera le berceau de leur révolution !"
MLA_Insert_Opioids_Into_Thailand_desc: "Une chose que les Chinois ont apprise des Britanniques : déstabiliser un pays, l'inonder de drogues addictives."
MLA_Start_Counterfeit_Operations_desc: "Rien n'attire plus la révolution que la faim et la crise économique. Donnons à la Thaïlande un peu de ce dernier."
MLA_The_Laotian_Civil_War_desc: "Le peuple du Laos s'est levé pour déposer le royaume réactionnaire et pro-français. Ils ont besoin de notre aide !"
MLA_Ship_Heavy_Artilery_Through_North_Vietnam_desc: "Avec l'aide vietnamienne, nous devrions pouvoir fournir au Laos du matériel d'artillerie lourde."
MLA_Provide_Entrenchment_Tools_desc: "Les Laotiens ont besoin de matériel de soutien, fournissons-leur-en !"
MLA_Send_Non_Combatant_Medics_desc: "La campagne au Laos sera sans aucun doute sanglante, nous leur enverrons certains de nos meilleurs médecins pour réduire les pertes."
MLA_Escelate_Involvement_desc: "Nous détournerons une partie de notre capacité industrielle pour produire des armes et des fournitures pour les révolutionnaires laotiens."
MLA_The_Cambodian_Civil_War_desc: "La guerre civile a éclaté au Cambodge, faut-il intervenir ou rester neutre ?"
MLA_None_Of_Our_Business_desc: "Nous ne nous impliquerons pas dans ce gâchis."
MLA_Limited_Involvement_desc: "Nos frères socialistes ont besoin de notre aide !"
MLA_Distribute_Pro_Khmer_Propaganda_desc: "Le peuple cambodgien verra l'avenir prospère qui l'attend sous le régime khmer !"
MLA_Mobilize_Scouting_Aircraft_desc: "Nos éclaireurs signaleront les positions ennemies à nos alliés khmers."
MLA_The_Burmese_Civil_War_desc: "Le gouvernement birman combat le Parti communiste birman depuis des décennies maintenant, peut-être pouvons-nous faire pencher la balance ?"
MLA_Persue_Prolonged_Malaysian_Involvement_desc: "Nous n'aurons de repos que lorsque le peuple birman sera libéré de l'oppression nationaliste !"
MLA_Provide_Short_Range_Radios_desc: "La communication entre nos forces est cruciale pour notre succès."
MLA_Airlift_Small_Arms_desc: "Nous larguerons des fournitures sur le territoire occupé par le BCP pour les aider dans leur combat."
MLA_Offer_Limited_Air_Support_desc: "Disposer d'un soutien aérien adéquat sera une aubaine monumentale pour le BCP."
MLA_Offer_Token_Aid_desc: "Vingt ans de combats et le BCP n'a pratiquement pas progressé. Nos ressources sont mieux dépensées ailleurs."
MLA_Pressure_Increased_Chinese_Involvement_desc: "Si nous parvenons à faire intervenir les Chinois en Birmanie, la victoire sera assurée !"
MLA_The_American_War_desc: "L'intervention américaine a empêché l'unification du Vietnam et causé des milliers de morts inutiles. Nous devons agir."
MLA_Industrial_Support_desc: "Nous ne pouvons pas risquer une guerre avec les États-Unis. Une aide économique limitée est la meilleure que nous puissions offrir."
MLA_Transfer_Vietnamese_Industry_desc: "Nous consacrerons une partie de notre industrie à l'effort de guerre vietnamien."
MLA_Malaysian_Boots_on_the_Ground_desc: "L'Amérique s'est montrée obstinée, et ce n'est que par une intervention directe que nous pouvons espérer déloger ses troupes."
MLA_The_Malaysian_Expeditionary_Force_desc: "La réalisation de la révolution mondiale est une noble cause, pour laquelle le peuple malaisien est fier de se battre et de mourir !"
MLA_Anti-Aircraft_Shipments_desc: "Les Viet Cong sont irrités par les frappes aériennes américaines constantes, nous devons leur fournir les outils nécessaires pour contrer cela."
MLA_Increase_Involvement_in_Cambodia_desc: "Nous avons fait quelques progrès, mais la guerre fait rage. Il est temps de redoubler d'efforts au Cambodge."
MLA_Send_The_Special_Branch_desc: "§RIl est temps de faire appel à un spécialiste...§"
MLA_Assassinate_Pol_Pot_desc: "Les idées folles de Pol Pot entacheraient à jamais le socialisme ! Il doit être expulsé."
MLA_Demand_Viet_Khmer_Cooperation_desc: "La coopération entre les Khmers et leurs voisins vietnamiens garantira le succès des deux régimes. Nous veillerons à ce qu'ils comprennent le message."
MLA_Ensure_the_Survival_of_the_Khmer_Government_desc: "La façon dont Pol Pot amènera la révolution au Cambodge ne nous concerne pas."
MLA_Advise_the_Santebal_desc: "Nous pouvons enseigner aux Santebal une ou deux choses sur le maintien de l'ordre et l'élimination des contre-révolutionnaires."
MLA_Establish_a_Competent_Socialist_Administration_desc: "Une fois Pol Pot éliminé, nous pouvons garantir que le pouvoir soit transféré entre les bonnes mains."
MLA_The_Thai_Civil_War_desc: "L'heure est venue de la libération de la Thaïlande !"
MLA_Transport_Industry_to_Southern_Thailand_desc: "Une partie de notre industrie sera transférée à nos camarades thaïlandais, ils en auront besoin pour assurer la victoire et se reconstruire."
MLA_Drastically_Increase_Arms_Production_desc: "L'armée thaïlandaise ne doit pas être sous-estimée ; nos camarades auront besoin de toutes les armes qu'ils peuvent porter."
MLA_Deploy_the_National_Liberation_Army_desc: "Il est temps pour nous de nous impliquer directement. Envoyez les troupes !"
MLA_Support_the_KNLA_desc: "L'Armée Karen de Libération Nationale ne s'intéresse qu'à l'indépendance. Si le socialisme ne triomphe pas en Birmanie, alors les peuples opprimés doivent être libérés par la séparation."
MLA_Establish_New_White_Flag_Faction_Cells_desc: "Il y a des Karens partisans de la cause socialiste ; nous devrions les encourager à continuer le combat !"
MLA_Create_New_Khmer_Supply_Lines_desc: "Les Khmers ont besoin de plus de provisions, et nous les leur fournirons."
MLA_Join_the_Civil_War_with_Thailand_desc: "Nous les avons aidés à commencer ce combat, et nous les aiderons à le terminer ! À Bangkok !"
MLA_Increase_Weapon_Shipments_desc: "La révolution doit venir de l'intérieur. Nous les équiperons de tous les outils dont ils ont besoin, mais ils doivent gagner cette guerre eux-mêmes."
MLA_Attempt_to_Influence_the_Laotian_Civil_War_desc: "Avec une implication encore plus grande, nous pouvons faire pencher la balance dans la guerre civile laotienne et assurer la victoire du socialisme !"
MLA_Support_Maoist_Factions_of_the_Pathet_Lao_desc: "Le Pathet Lao est un mouvement marxiste-léniniste, voyons si nous ne pouvons pas accroître l'influence de la faction maoïste en son sein."
MLA_Increase_Fighter_Shipments_desc: "Avec la supériorité aérienne, le Pathet Lao ne peut pas perdre !"
MLA_Provide_Engineers_to_Fix_Infrastructure_desc: "Le Laos devra se reconstruire après sa guerre civile, nous pouvons l'y aider."
MLA_Establish_New_Supply_Lines_to_the_Pathet_Lao_desc: "Plus nous parviendrons à ravitailler les Laotiens, mieux ce sera."
MLA_Demand_Thai_Intervention_desc: "Nous avons aidé les Thaïlandais à se libérer des chaînes de l'oppression, il est maintenant temps pour eux de contribuer à la lutte mondiale contre le despotisme !"
MLA_Maintain_a_Steady_Stream_of_Weapons_desc: "La Thaïlande a encore besoin de temps pour se stabiliser avant de pouvoir rejoindre le combat. Nous aiderons nous-mêmes les Laotiens."
MLA_Increase_American_War_Involvement_desc: "Nous ne quitterons pas le Vietnam tant qu'il ne sera pas libéré de l'ingérence américaine !"
MLA_Strengthen_the_North_Vietnamese_War_Economy_desc: "Les Vietnamiens ont besoin de plus d'usines s'ils espèrent rivaliser avec la machine de guerre américaine."
MLA_Subsidize_Vietnamese_Militarization_desc: "Subventionner la recherche militaire vietnamienne contribuera grandement à la victoire."
MLA_Send_Portable_Anti-Aircraft_Equipment_desc: "Le front est toujours en mouvement, nos camarades auront besoin d'armes lourdes portatives."
MLA_Temporarily_Transfer_Vulnerable_Industry_desc: "Les Américains n'hésiteront pas à décimer autant que possible l'industrie vietnamienne ; nous devons la déplacer hors du pays."
MLA_Share_Industrial_Secrets_desc: "Il existe quelques astuces que nous pouvons enseigner aux Vietnamiens en matière d'industrie."
MLA_Attempt_Long-Term_Economic_Growth_desc: "Le gouvernement socialiste du Vietnam ne durera pas longtemps si la population est appauvrie. Nous devons garantir que leur économie sera forte en temps de paix."
MLA_Escalate_Troop_Deployment_desc: "Nous allons submerger les envahisseurs américains en nombre supérieur !"
MLA_Organize_Tiger_Divisions_desc: "Les tigres sèment la peur dans le coeur même des soldats les plus aguerris. Les divisions Tigre feront de même."
MLA_Bombard_Coastal_Positions_desc: "L'engagement américain au Vietnam dépend fortement de sa marine. §RFaites-les exploser !§"
MLA_Greatly_Increase_Air_Support_desc: "L'Amérique est en train de mettre le feu à la moitié du pays avec tous ses bombardements, nos alliés ont besoin de plus de soutien aérien !"
MLA_Send_the_Air_Force_to_Vietnam_desc: "C'est l'heure d'un bon combat aérien à l'ancienne !"
MLA_Evacuate_the_South_desc: "La guerre est finie, il est temps pour nos hommes de rentrer au pays."

