MLA_fighter_equipment_0: "Force aérienne de libération nationale malaise"
MLA_fighter_equipment_0_short: "MLAF"
MLA_fighter_equipment_0_desc: "Avion de combat biplan, le I-15 (nom de développement TsKB-3) était connu pour son aile de mouette distinctive, qui lui a valu le surnom de Chaika. (en russe pour Seagull) Il était exploité en grand nombre par l'armée de l'air soviétique et était l'un des deux chasseurs standard utilisés par l'armée de l'air républicaine espagnole pendant la guerre civile espagnole."
MLA_fighter_equipment_1: "Yakolev Yak-3"
MLA_fighter_equipment_1_short: "Yak-3"
MLA_fighter_equipment_1_desc: "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
MLA_fighter_equipment_2: "Lavotchkine La-7"
MLA_fighter_equipment_2_short: "La-7"
MLA_fighter_equipment_2_desc: "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
MLA_fighter_equipment_3: "Lavotchkine La-9"
MLA_fighter_equipment_3_short: "La-9"
MLA_fighter_equipment_3_desc: "La-9 représente un développement ultérieur du prototype Lavochkin La-126. Le premier prototype, désigné La-130, fut achevé en 1946. La similitude avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur avait une construction entièrement métallique et une aile à flux laminaire. Les économies de poids dues à l'élimination du bois de la cellule ont permis d'améliorer considérablement la capacité de carburant et l'armement à quatre canons. Des combats simulés ont démontré que le La-130 était à égalité avec le La-7 mais qu'il était inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, entra en production en août 1946. Au total, 1 559 avions furent construits à la fin de la production en 1948."

MLA_jet_multirole_equipment_1: "Mikoyan-Gourevitch MiG-9"
MLA_jet_multirole_equipment_1_desc: "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
MLA_jet_multirole_equipment_1_short: "MiG-9"
MLA_jet_multirole_equipment_2: "Mikoyan-Gourevitch MiG-15"
MLA_jet_multirole_equipment_2_desc: "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
MLA_jet_multirole_equipment_2_short: "MiG-15"
MLA_jet_multirole_equipment_3: "Mikoyan-Gourevitch MiG-17"
MLA_jet_multirole_equipment_3_desc: "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
MLA_jet_multirole_equipment_3_short: "MiG-17"
MLA_jet_multirole_equipment_4: "Mikoyan-Gourevitch MiG-19"
MLA_jet_multirole_equipment_4_desc: "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
MLA_jet_multirole_equipment_4_short: "MiG-19"
MLA_jet_multirole_equipment_5: "Mikoyan-Gourevitch MiG-21F-13"
MLA_jet_multirole_equipment_5_desc: "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
MLA_jet_multirole_equipment_5_short: "MiG-21F-13"
MLA_jet_multirole_equipment_6: "Mikoyan-Gourevitch MiG-21PF"
MLA_jet_multirole_equipment_6_desc: "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
MLA_jet_multirole_equipment_6_short: "MiG-21PF"
MLA_jet_multirole_equipment_7: "Mikoyan-Gourevitch MiG-23M"
MLA_jet_multirole_equipment_7_desc: "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
MLA_jet_multirole_equipment_7_short: "MiG-23M"
MLA_jet_multirole_equipment_8: "Mikoyan-Gourevitch MiG-23ML"
MLA_jet_multirole_equipment_8_desc: "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
MLA_jet_multirole_equipment_8_short: "MiG-23ML"
MLA_jet_multirole_equipment_9: "Mikoyan-Gourevitch MiG-23MLD"
MLA_jet_multirole_equipment_9_desc: "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
MLA_jet_multirole_equipment_9_short: "MiG-23MLD"
MLA_jet_multirole_equipment_10: "Mikoyan-Gourevitch MiG-29A"
MLA_jet_multirole_equipment_10_desc: "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
MLA_jet_multirole_equipment_10_short: "MiG-29A"

MLA_mr_stealth_fighter_equipment_1: "Mikoyan MiG-29M"
MLA_mr_stealth_fighter_equipment_1_short: "MiG-29M"
MLA_mr_stealth_fighter_equipment_1_desc: "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."

MLA_jet_light_equipment_1: "Yakovlev Yak-18"
MLA_jet_light_equipment_1_short: "Yak-18"
MLA_jet_light_equipment_2: "Mikoyan-Gourevitch MiG-15UTI"
MLA_jet_light_equipment_2_short: "MiG-15UTI"
MLA_jet_light_equipment_2_desc: "Le 6 avril 1949, l'équipe OKB-155 se voit officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n°1 entre mars et mai 1949. La cabine de l'instructeur de l'UTI MiG-15 a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
MLA_jet_light_equipment_3: "L-29 Delfin"
MLA_jet_light_equipment_3_short: "L-29 Delfin"
MLA_jet_light_equipment_3_desc: "L'Aero L-29 Delfin (anglais : Dolphin, nom OTAN : Maya) est un avion d'entraînement militaire développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 entraîneurs L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avion d'entraînement standard pour l'armée de l'air soviétique."
MLA_jet_light_equipment_4: "Aéro L-39 Albatros"
MLA_jet_light_equipment_4_short: "L-39 Albatros"
MLA_jet_light_equipment_4_desc: "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfin comme avion d'entraînement principal. C'était le premier avion d'entraînement à être équipé d'un groupe motopropulseur à double flux. Ce type a été exporté dans un large éventail de pays en tant qu'entraîneur militaire."
MLA_jet_light_equipment_5: "Aéro L-39ZA Albatros"
MLA_jet_light_equipment_5_short: "L-39ZA Albatros"
MLA_jet_light_equipment_5_desc: "L-39 considérablement amélioré pour l'entraînement armé et les attaques légères, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un canon à double canon GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un chargeur de 150 cartouches dans la cellule."

MLA_tac_bomber_equipment_0: "Iliouchine DB-3"
MLA_tac_bomber_equipment_0_short: "DB-3"
MLA_recon_equipment_0: "Tupolev Tu-2R"
MLA_recon_equipment_0_short: "Tu-2R"
MLA_recon_equipment_0_desc: "Version de reconnaissance du Tu-2."
MLA_jet_recon_equipment_0: "Mikoyan-Gourevitch MiG-15Rbis"
MLA_jet_recon_equipment_0_short: "MiG-15Rbis"
MLA_jet_recon_equipment_0_desc: "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."

