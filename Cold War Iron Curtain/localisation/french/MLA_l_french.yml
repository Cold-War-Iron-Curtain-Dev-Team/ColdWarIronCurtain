#MLA 50's Focus Descs
MLA_Anti_British_War_desc: "Nous n'avons pas résisté aux Japonais simplement pour redevenir les marionnettes des Britanniques. Nous attendons depuis longtemps l'indépendance et nous l'accepterons par la force s'il le faut."
MLA_Retreat_to_the_Jungle_desc: "Nous ne sommes pas encore prêts à affronter ouvertement les Britanniques. Pour l'instant, il faut se replier et se regrouper."
MLA_Take_Stock_desc: "Nous devons savoir exactement combien d'équipement il nous reste."
MLA_Expand_Min_Yuen_desc: "Étant donné que les approvisionnements tels que la nourriture, l'équipement et les munitions sont essentiels à nos opérations, nous devrions étendre notre aile civile, le Min Yuen, pour garantir que nous disposons de quelqu'un pour nous assurer la logistique."
MLA_Expand_Non-Chinese_Supporter_Bases_desc: "Ce ne sont pas seulement les Chinois, mais aussi les Malais et les Indiens qui s'irritent sous la domination britannique. Nous devrions également faire appel à ces personnes et promouvoir notre cause en dehors de la communauté chinoise."
MLA_A_Pragmatic_Future_desc: "Puisque la majorité de la population malaise n'est pas chinoise, nous devrions adopter une approche pragmatique et faire également appel aux citoyens non chinois."
MLA_Recruit_Naryanan_desc: "Narayanan, un syndicaliste indien local, est connu pour être un fauteur de troubles dans la Malaisie occupée par les Britanniques. Recrutons-le à notre cause et promouvons le syndicalisme dans notre parti."
MLA_Tolerate_non_Marxist_Views_desc: "Tout le monde en Malaisie n'a pas des opinions marxistes, mais la plupart conviennent que le colonialisme doit cesser. Nous tolérerons ceux qui partagent notre lutte anticoloniale afin de promouvoir un front uni contre les Britanniques."
MLA_Resolve_Racial_Inequality_desc: "Les Britanniques nous ont divisés selon la race, puis nous ont dressés les uns contre les autres, une tactique coloniale classique. Nous devons oeuvrer pour apaiser les tensions entre les différents peuples et promouvoir la coopération entre nous."
MLA_All_Together_desc: "Ensemble, nous sommes unis sous la cause anticoloniale. Ensemble, nous lutterons pour libérer une fois pour toutes la Malaisie et l'Asie du Sud-Est de la domination étrangère !"
MLA_Show_Ethnic_Chinese_the_Rights_of_Humans_desc: "Notre nombre augmentera considérablement si nous montrons aux gens le brillant avenir qui les attend si nous triomphons."
MLA_Show_the_Malay_a_Better_Future_desc: "Il n'y a pas de temps à perdre en gestes et en promesses. Ce dont nous avons besoin, c'est d'une action audacieuse."
MLA_Maintain_Marxist_Purity_desc: "Les éléments révisionnistes du mouvement ne nous rendraient pas différents de nos oppresseurs coloniaux. Nous devons rester fidèles à la cause marxiste dans notre lutte anticoloniale."
MLA_Radical_China_desc: "En tant qu'ethnie minoritaire en Malaisie, les Chinois restent opprimés sous le régime colonial. Nous devrions profiter de ce fait et renforcer notre influence parmi eux."
MLA_Promote_Nanyang_desc: "Le problème ethnique entre les non-Chinois et le reste de la population est l'une des principales raisons pour lesquelles nous n'avons pas d'unité au sein de notre mouvement. Nous devrions promouvoir l'idée de Nanyang, ou synthèse culturelle, pour unir le peuple."
MLA_Enforce_Revolutionary_desc: "Il n'y a pas de demi-révolution. Soit vous êtes avec nous dans notre lutte pour la liberté, soit vous ne l'êtes pas."
MLA_Maintain_Sinophilic_Views_desc: "Même si de nombreux Chinois malais habitent en Malaisie depuis des générations, ils considèrent toujours la Chine comme leur patrie et conservent des liens avec leurs proches restés au pays. Nous ne voyons rien de mal à cela. Après tout, nous avons beaucoup à apprendre de la République populaire."
MLA_Ditch_Non-Chinese_desc: "Contrairement à nos partisans chinois, nombre de nos partisans non chinois ne partagent pas nos valeurs et ne sont pas non plus entièrement d'accord avec notre cause. Purgeons-les pour éviter que notre mouvement ne sombre dans des luttes intestines."
MLA_Show_the_British_a_Way_Out_desc: "Voilà la porte. Vous pouvez sortir paisiblement... Ou vous pouvez y être jeté."
MLA_Raid_Perak_desc: "Nous devons frapper vers l'ouest en direction de Perak !"
MLA_Attack_Kuala_Lumpur_desc: "Il faut frapper vers le sud, vers Kuala Lumpur !"
MLA_Assault_Terrengganu_desc: "Nous devons frapper vers le nord en direction de Terengganu !"
MLA_Operations_of_1950_desc: "Nous sommes prêts pour la prochaine étape de notre guerre de libération. 1950 sera l'année de la liberté malaisienne !"
MLA_Lessons_From_Comrade_Mao_Zedong_desc: "En Chine, Mao a pris une petite force de guérilla et l'a transformée en une armée organisée capable de remporter la victoire. Nous devons suivre son exemple."
MLA_Lessons_From_Uncle_Ho_Chi_Minh_desc: "Nous pourrons nous soucier de l'organisation et du professionnalisme plus tard. À l'heure actuelle, nous avons une guerre à gagner, et cela nécessite la force du nombre."
MLA_Victory_in_the_Hearts_and_Minds_desc: "Pour parvenir à une victoire totale, nous devons gagner les coeurs et les esprits du peuple."
MLA_Pengang_Ambush_desc: "Il est temps pour un autre raid vers l'ouest !"
MLA_Bukit_Kepong_Incident_desc: "Il est temps pour un autre raid vers le sud !"
MLA_Battle_of_Semur_River_desc: "Il est temps pour un autre raid vers le nord !"
MLA_OPERATION_TERMITE_desc: "Tous ensemble maintenant, direction la capitale !"
MLA_Request_Eastern_Bloc_Equipment_desc: "Nous avons besoin de plus d'équipement pour vaincre le régime colonial. Les Soviétiques et leurs alliés devraient être prêts à nous en donner."
MLA_Intercept_British_Convoys_desc: "En attaquant les convois de ravitaillement britanniques, nous pouvons priver les armées coloniales de fournitures et d'armes essentielles."
MLA_Intensify_Anti-Colonial_Propaganda_desc: "Notre message ne trouve pas un écho auprès d'autant de personnes que nous l'espérions. Nous devons redoubler d'efforts de propagande."
MLA_Raid_Jungle_Bases_From_Perak_desc: "Un dernier coup de pouce vers l'Est !"
MLA_Raid_Jungle_Bases_From_Kuala_Lumpur_desc: "Un dernier coup vers le sud !"
MLA_Raid_Jungle_Bases_From_Terrengganu_desc: "Un dernier coup de pouce vers le nord !"
MLA_Victory_Against_the_British_desc: "Trois fois nous sommes entrés, trois fois ils nous ont expulsés. Nous sommes battus, la guerre est perdue."

MLA_Strike_the_Heart_of_Colonial_Rule_desc: "Nos forces dirigées par le camarade Chin Peng se préparent pour une campagne finale pour libérer Singapour en ciblant les dernières garnisons coloniales sous le Field Marshal Temple. Le plan implique un assaut rapide et coordonné pour démanteler les défenses britanniques et capturer la ville. En cas de succès, la libération de Singapour marquera une victoire significative pour l'Armée de libération malaisienne et forcera les Britanniques à accepter l'inévitable."
MLA_Entrench_Johor_Bahru_desc: "Fortifier notre position à l'intérieur des limites de la ville augmentera considérablement nos chances de succès !"
MLA_Inspire_the_People_of_Singapore_desc: "Le peuple de Singapour saura que la libération est enfin arrivée !"
MLA_Shell_the_City_desc: "Nous devons détruire à distance les solides défenses de la ville."
MLA_The_Battle_of_Singapore_desc: "CHARGE!"
MLA_Transfer_the_Capital_desc: "La ville est à nous ! Singapour renaîtra, transformée d'un symbole d'oppression impérialiste en symbole de libération socialiste !"

MLA_Found_the_Peoples_Republic_of_Malaysia_desc: "La guerre a été gagnée ; nous sommes libres ! En ce jour mémorable, nous proclamons la fondation de la République démocratique populaire de Malaisie !"
MLA_Chairman_Chin_Peng_desc: "Chin Peng a brillamment dirigé le peuple malaisien en tant que soldat, il continuera de le faire en tant que président !"
MLA_Put_Tunku_Abdul_Rahman_on_Trial_desc: "Tunku Abdul Rahman est une pute égoïste, qui s'est vendue aux Britanniques et aux Japonais. La justice doit être rendue."
MLA_Execute_Gerald_Templer_desc: "Gerald Templer est coupable de crimes contre le peuple malaisien. Sa sentence est la suivante : mort par peloton d'exécution."
MLA_Our_Place_in_the_Socialist_World_desc: "La guerre civile chinoise étant terminée, les conseillers soviétiques et les camarades chinois recherchent notre amitié. Le Comité central doit décider s'il doit donner la priorité à la cause révolutionnaire chinoise ou à la solidarité prolétarienne internationale."
MLA_Co-rule_With_Shamsiah_Fakeh_desc: "Une direction collective avec Shamsiah Fakeh liera plus étroitement la république à l'Union soviétique, que Chin Peng conserve la présidence ou que Fakeh prenne la direction."
MLA_Chinese_Alignment_desc: "Le problème lorsque vous êtes sur la clôture est que vous pourriez vous y empaler. Les idées du président Mao correspondent davantage aux nôtres, nous suivrons son exemple."
MLA_Invite_Soviet_Advisors_desc: "Les conseillers soviétiques nous aideront à rattraper le reste du monde socialiste."
MLA_Establish_Contacts_With_the_KGB_desc: "Le KGB est passé maître dans l'art de protéger ses citoyens contre les dangereuses activités subversives. Nous devrions étudier leurs méthodes."
MLA_Invite_the_Dalai_Lama_to_Malaysia_desc: "De nombreux Malaisiens, dont le président Peng, sont bouddhistes. Accueillir le Dalaï Lama serait un grand honneur."
MLA_Foster_Close_Relationships_With_Vietnam_and_Laos_desc: "Avoir de bonnes relations avec nos voisins du Golfe sera très bénéfique."
MLA_State_Visits_to_the_Eastern_Bloc_desc: "Le président Peng effectuera une tournée dans le bloc de l'Est, établissant des relations diplomatiques au fur et à mesure."
MLA_Condemn_the_Chinese_Invasion_of_Tibet_desc: "Nous avons promis la neutralité et nous le pensons. Nous établirons des relations commerciales et diplomatiques solides avec la République populaire, et pas seulement avec l'Union soviétique."
MLA_Join_Comecon_desc: "Nous soumettrons une candidature formelle pour devenir membre à part entière du Comecon."
MLA_Distance_Malaysia_From_the_Dalai_Lama_desc: "Nous ne devons pas permettre que nos convictions personnelles s'immiscent dans la politique étrangère. Le Dalaï Lama est un ennemi du socialisme ; c'est donc un ennemi pour nous."
MLA_Endorse_Chinas_Nine_Dash_Line_Claim_desc: "Les revendications chinoises sur les îles situées dans la mer de Chine méridionale sont tout à fait légitimes, nous serons de leur côté sur cette question."
MLA_Condemn_Soviet_Revisionism_desc: "Le Comecon vise davantage à maintenir l'influence soviétique qu'à apporter une aide économique appropriée. Cela est finalement préjudiciable à la coopération socialiste."
MLA_Fund_the_Khmer_Rouge_desc: "Nos camarades du Cambodge ont besoin de toute l'aide possible dans leur lutte contre le despotisme !"
MLA_Demand_Japanese_Compensation_For_War_Crimes_desc: "Le Japon refuse de s'excuser ou même de reconnaître les crimes qu'il a commis contre notre peuple pendant la Seconde Guerre mondiale, c'est scandaleux !"
MLA_Spread_Maoism_throughout_Southeast_Asia_desc: "Le maoïsme est plus compatible avec la réalité de l'Asie du Sud-Est que le marxiste-léninisme orthodoxe. Nous favoriserons la diffusion des idées du Président Mao dans toute la région."
MLA_Chinese_Economic_Aid_desc: "Nous pourrions certainement avoir besoin d'aide pour transformer la Malaisie en un véritable État ouvrier, peut-être que nos camarades chinois seraient prêts à nous aider ?"
MLA_Consolidate_Our_Power_desc: "Nous souhaiterions que cela soit inutile, mais parfois les gens doivent être protégés d'eux-mêmes."
MLA_Create_a_Comprehensive_Criminal_Code_desc: "Le code pénal regorge de références obsolètes au droit britannique et à d'autres coutumes judiciaires étrangères. Nous devons le réécrire à partir de zéro."
MLA_Try_British_Pilots_for_Chemically_Induced_Famines_desc: "Les pilotes de la RAF ont délibérément utilisé la guerre chimique pour provoquer la famine et affamer la population malaisienne. Ils seront jugés et punis en conséquence."
MLA_Purge_Lau_Yews_Treasonous_Body_guards_desc: "Les preuves suggèrent que Lau Yew, un membre éminent du Parti tué en 1948, a été trahi par son propre garde du corps. Lui et tout autre traître présumé doivent être punis."
MLA_Show_Mercy_to_British_Collaborators_desc: "Nous ferons preuve d'un certain degré d'indulgence envers certains collaborateurs de bas niveau du régime colonial britannique."
MLA_Public_Execution_of_Colonial_Landlords_desc: "Les propriétaires coloniaux ont brutalement exploité notre peuple et ont sévèrement puni ceux qui ne s'y conformaient pas. C'est à leur tour d'affronter la justice."
MLA_Hunt_Down_Rogue_Japanese_Units_desc: "Des rapports indiquent qu'un petit nombre d'unités japonaises mènent encore des opérations de combat au coeur des zones rurales de la Malaisie, ignorant que la guerre est terminée depuis plus d'une demi-décennie. Nous devons nous en débarrasser. "
MLA_Liquidate_Remaining_Colonial_Enclaves_desc: "Il reste encore quelques vestiges du régime colonial. Il faut les traquer et les vaincre."
MLA_Found_the_Agricultureal_Safty_bureau_desc: "Le Bureau de la sécurité agricole veillera au strict respect des normes de qualité des aliments. Le peuple malais n'aura plus jamais à se serrer la ceinture."

MLA_Recreate_Malaysia_desc: "Tous les vestiges de la domination coloniale doivent être balayés. Quand notre travail sera terminé, la Malaisie sera méconnaissable, ce sera un véritable paradis socialiste !"
MLA_Deal_with_the_Great_Famine_desc: "La famine est le résultat direct des politiques coloniales brutales et de la guerre chimique. Quoi qu'il en soit, c'est à nous d'y remédier."
MLA_Irrigation_Efforts_To_Chin_Peng_City_desc: "La capitale a besoin d'eau douce ; nous devrions mettre en place un système d'irrigation pour aider la ville."
MLA_Create_Basic_Filtration_Standards_desc: "La pollution de notre eau potable est stupéfiante, nous avons désespérément besoin d'un système de filtration pour empêcher la propagation des maladies."
MLA_Disinfect_Livestock_desc: "Notre bétail est couvert de crasse, il faut le désinfecter pour atténuer la famine."
MLA_Scrub_the_Countryside_of_Defoliants_desc: "La campagne de guerre chimique de la RAF a contaminé une grande partie de nos terres agricoles. Il devra être soigneusement frotté avant de pouvoir être utilisé en toute sécurité."
MLA_Create_New_Agriculture_Plots_desc: "Il y a encore beaucoup de terres arables qui peuvent être réservées à l'agriculture, faisons en sorte qu'il en soit ainsi !"
MLA_Request_Grain_From_the_Soviet_Union_desc: "Nous travaillons sans relâche pour résoudre la famine. En attendant que le travail soit terminé, nous importerons des céréales soviétiques pour nous retenir."
MLA_Temporarily_Restrain_collectivization_desc: "Nous ne pouvons pas risquer une perturbation de l'approvisionnement alimentaire à l'heure actuelle. La collectivisation devra être reportée pour une durée indéterminée."
MLA_Cover_Up_the_True_Extent_of_the_Famine_desc: "Si les gens savaient à quel point la situation est grave, ils perdraient confiance en notre capacité à résoudre le problème. Le monde saura seulement ce dont il a besoin."
MLA_Literacy_Campaign_desc: "L'analphabétisme est élevé parmi notre peuple ; nous allons remédier à cela avec une grande campagne d'alphabétisation !"
MLA_Rebuild_Local_Schools_desc: "L'ignorance est un outil d'oppression impérialiste. Dans la nouvelle Malaisie, chaque enfant recevra une éducation complète !"
MLA_Promote_Simplified_Chinese_desc: "Les Chinois constituent notre deuxième groupe ethnique en importance. Nous les éduquerons en utilisant le langage simplifié nouvellement introduit."
MLA_Create_Positive_Living_Pamphlets_desc: "Un corps propre est un corps sain et un corps sain est un corps productif. Nous distribuerons des brochures expliquant comment maximiser l'hygiène auprès de la population."
MLA_Invite_Eastern_Bloc_Teachers_desc: "Pour nous aider à construire un programme socialiste complet, nous inviterons des enseignants de la République démocratique allemande dans nos écoles."
MLA_Study_Abroad_Programs_to_the_DPRK_desc: "La RPDC a des normes éducatives très élevées. Quel meilleur endroit pour envoyer nos jeunes travailleurs apprendre ?"
MLA_Enforce_Manditory_School_Attendence_desc: "L'absentéisme scolaire ne sera pas toléré. L'éducation est obligatoire."
MLA_Begin_Door_to_Door_Reading_Lessons_desc: "Nous enverrons des enseignants dans les zones rurales où ils apprendront à lire à chaque personne qui y vit."
MLA_Politicize_Education_desc: "Notre programme met fortement l'accent sur l'importance de la loyauté envers le Parti et la cause du socialisme."
MLA_Found_Chin_Peng_University_desc: "L'Université Chin Peng sera le summum de notre système éducatif, le meilleur institut d'enseignement supérieur de toute la Malaisie !"
MLA_Jumpstart_Colonial_Industry_desc: "Quelle que soit l'industrie qui reste après la guerre de libération, elle doit être réparée."
MLA_Redistribute_Colonial_Property_desc: "Les terres qui appartenaient aux autorités coloniales seront saisies et redistribuées à des fins de développement."
MLA_Attempt_to_Reopen_Rubber_Plants_desc: "Le caoutchouc est un élément clé de nombreux produits, tant civils que militaires. Nous devrions en relancer la production dès que possible."
MLA_Increase_Workers_Pension_desc: "Nos travailleurs méritent une compensation équitable pour leur dur travail de reconstruction de la Malaisie."
MLA_Request_Soviet_Technical_Expertise_desc: "Sans surprise, les Britanniques ne nous ont jamais appris à gérer ou entretenir correctement les machines avec lesquelles ils nous ont forcés à travailler. Les Soviétiques sont prêts à contribuer à remédier à cette situation."
MLA_Unearth_Bombed_Munitions_Plants_desc: "L'usine de munitions de Kuala Lumpur sera réparée et mise au service de l'Armée de libération nationale malaisienne !"
MLA_Salvage_the_Electric_Grid_desc: "L'infrastructure électrique a été en grande partie détruite pendant la guerre de libération. Les réparations devraient être effectuées prochainement."
MLA_Backyard_Smelteries_desc: "Notre capacité industrielle croît, mais pas assez vite. Nous suivrons l'exemple du président Mao et encouragerons les civils à produire leur propre acier en utilisant des fourneaux de basse-cour."
MLA_Create_Industrial_Training_Programs_desc: "Avant de pouvoir devenir une puissance industrielle, nos collaborateurs auront besoin d'une formation adéquate."
MLA_Construct_the_Kuala_Lumpur_Steel_Plant_desc: "L'usine sidérurgique de Kuala Lumpur fournira à nos militaires tous les outils dont ils ont besoin pour protéger la population !"


MLA_The_Malaysian_Peoples_Liberation_Army_desc: "Il est temps pour le MNLA de passer d'une force de guérilla à une véritable armée permanente."
MLA_Malaysian_Peoples_Liberation_Ground_Force_desc: "La MNLGF est chargée des opérations de combat au sol et, dans les cas extrêmes, du maintien de l'ordre national."
MLA_Malaysian_Peoples_Liberation_Air_Force_desc: "La MNLAF défend nos villes des bombardiers ennemis et protège notre ciel des incursions aériennes."
MLA_Embrace_Peoples_War_Doctrine_desc: "Le concept de guerre populaire a fait ses preuves en Chine et en Malaisie, pourquoi ne devrions-nous pas l'adopter ?"
MLA_License_the_AK_desc: "Les Avtomat Kalashnikova soviétiques sont des fusils de combat incroyables, nous en avons besoin pour l'armée."
MLA_Found_the_Malaysian_Arms_Industry_desc: "Nous devons renforcer notre capacité militaire. La construction d'usines spécialisées dans les armes et les munitions nous aidera à atteindre notre objectif."
MLA_Build_Forts_on_the_Thai_Boarder_desc: "N'oublions pas que la Thaïlande a coopéré avec les Japonais pendant la guerre. Nous avons besoin d'une frontière solide pour nous protéger au cas où ils auraient des idées."
MLA_Import_Soviet_Yaks_desc: "Les Yaks soviétiques sont en effet très impressionnants, nous devrions en acheter quelques-uns pour notre armée de l'air."
MLA_Purchase_Soviet_Migs_desc: "Le MiG est une merveille de l'aviation moderne. Nous devrions acheter un stock décent aux Soviétiques."
MLA_Study_Downed_British_Bombers_desc: "Aussi haineuse que soit la RAF, ses bombardiers sont impressionnants. Ce serait du gaspillage de ne pas étudier leur conception."
MLA_Open_Fighter_Research_Programs_desc: "Les avions de combat sont la clé de la victoire dans les airs, nous devons nous concentrer sur leur développement."
fighter_multirole_bonus_desc: ""
MLA_Malaysian_Peoples_Liberation_Navy_desc: "Le MNLN protège nos côtes des débarquements ennemis et des bombardements navals."
MLA_Invest_in_Destroyers_desc: "Les destroyers ont encore beaucoup à offrir, nous devrions investir dans leur développement."
MLA_Construct_Naval_Bases_in_Terengganu_desc: "Terengganu sera la fière demeure de la Marine !"
MLA_Marine_Training_Programs_desc: "Les combats des Marines américains contre les Japonais ont été une source d'inspiration. Nous devrions construire notre propre Corps des Marines !"
MLA_Build_Dry-docks_in_Melaka_desc: "Même les navires les plus puissants ont besoin d'entretien. Les cales sèches de Malacca serviront à cet effet."

#MLA Power Struggle focus tree desc
MLA_Seek_Alternative_Paths_desc: "Le mouvement de Chin Peng écarte complètement de nombreux non-Chinois qui le soutenaient au départ. Trouvons des alternatives à Chin Peng soit avec les Boestamamites, soit avec les syndicalistes."
MLA_Support_Boestamamites_desc: "Les Boestamamites sont les véritables adeptes de l'anticolonialisme tout en conservant leurs caractéristiques malaises. Soutenons Ahmad Boestamam et ses partisans"
MLA_Support_Syndicalists_desc: "Les syndicalistes, bien que peu orthodoxes, sont populaires parmi le peuple. Suivons Narayanan et ses partisans."
MLA_Declare_Nanyang_desc: "Guidés par l'exemple révolutionnaire de Mao, nous devrions déclarer la formation de Nanyang en tant qu'État chinois au sein de la Malaisie."
MLA_Under_the_White_Sun_desc: "Les Trois principes du peuple de Sun Yat-sen offrent un modèle pour notre révolution chinoise. Il est temps pour nous de considérer le tridémisme comme la nouvelle idéologie de la Malaisie."

