#MLA 70's Focus Descs
MLA_Begin_Industrial_Reconstruction_desc: "La campagne de modernisation a été un échec catastrophique, nous devons en gérer les conséquences immédiatement."
MLA_Request_Chinese_Agricultural_Aid_desc: "Pour la deuxième fois de mémoire récente, notre peuple souffre des effets de la famine. Bien qu'il ne s'agisse pas d'une solution permanente, l'aide alimentaire chinoise contribuera à en atténuer les effets."
MLA_Close_Mines_in_Perak_desc: "Nous avons besoin de nourriture, pas de pierres. Les nouvelles mines de Perak doivent rester fermées jusqu'à nouvel ordre."
MLA_Scrap_Unfinished_Factories_desc: "L'avantage d'avoir des usines inachevées est qu'elles seront beaucoup plus faciles à démolir."
MLA_Decrease_Urbanization_desc: "Notre niveau de développement actuel ne peut pas supporter des villes de cette taille, il faut les réduire."
MLA_Allow_Local_Market_Activity_desc: "Nous n'avons d'autre choix que de permettre la création de marchés locaux privés. Au moins, les effets de la famine s'atténueront."
MLA_Pursue_Limited_Industrialization_desc: "Notre objectif n'est pas de revenir à une société agraire pré-industrialisée. Nous voulons toujours de l'industrie, mais moins."
MLA_Divert_Resources_to_Failing_Agriculture_desc: "Nous avons déplacé trop de gens des fermes vers les villes et les usines. Cela doit être inversé."
MLA_Scapegoat_the_Party_Intelligentsia_desc: "Quelqu'un doit être puni pour l'échec de la campagne de modernisation, et ce ne sera pas nous !"
MLA_Commence_Monetary_Reform_desc: "La campagne de modernisation a été un énorme succès, mais elle s'est avérée très coûteuse. Nous devrons réformer et ajuster l'économie aux nouvelles réalités de notre nation."
MLA_Decrease_the_Money_Supply_desc: "Les gens ont plus d'argent qu'ils ne savent quoi en faire. Ce serait une bonne chose si cela ne provoquait pas de pénuries massives."
MLA_Implement_Austerity_desc: "Nous sommes obligés de mettre en oeuvre des mesures d'austérité pour le bien de l'économie. Ce ne sera pas populaire, mais c'est nécessaire."
MLA_Purge_Incompetent_Banking_Officials_desc: "Nous disposons d'un système de responsabilisation solide, mais aucun système n'est parfait. Ceux qui ont réussi à passer entre les mailles du filet seront punis."
MLA_Temporarily_Cut_Wages_desc: "Afin de réduire les dépenses excessives de nos citoyens, nous devrons réduire leurs salaires."
MLA_Inflate_Consumer_Prices_to_Market_Value_desc: "La fausse monnaie et le marché noir constituent des problèmes majeurs pour notre économie. Il est temps de les traiter correctement."
MLA_Crack_Down_on_Foreign_Currency_Use_desc: "Les devises étrangères ne seront plus utilisables en Malaisie."
MLA_Start_Financial_Literacy_Programs_desc: "La plupart des gens ne savent pas comment utiliser leur argent durement gagné de manière responsable, nous devrons leur apprendre."
MLA_Declare_the_Monetary_Crisis_Over_desc: "Nous avons surmonté la crise économique, nous pouvons désormais nous concentrer à nouveau sur le bon fonctionnement du gouvernement."

MLA_Operation_Hantu_Lilin_desc: "Dans un effort pour nous délégitimer, nos anciens maîtres coloniaux ont rétabli le gouvernement réactionnaire sur l'île de Bornéo. Il faut s'en occuper."
MLA_Establish_MJQ_Networks_desc: "Le MQJ établira des réseaux de renseignement en Malaisie orientale pour nous aider dans notre effort de libération."
MLA_Send_Abdullah_CD_to_Eastern_Malaysia_desc: "Abdullah CD montrera au peuple de la Malaisie orientale les véritables horreurs de son gouvernement et pourquoi il devrait nous soutenir dans sa libération."
MLA_Coopt_Independence_Movements_desc: "En infiltrant les organisations nationalistes en Malaisie orientale, nous pouvons progressivement les transformer en mouvements prosocialistes favorables à notre gouvernement."
MLA_Lynch_Reactionary_Officials_desc: "Le gouvernement du régime colonial a commis des crimes indescriptibles contre nos frères de Malaisie orientale. La seule juste punition est la mort."
MLA_Begin_Arming_Ethnic_Minorities_desc: "Les minorités d'Asie de l'Est sont considérées comme inférieures par le gouvernement réactionnaire. Nous les recruterons pour combattre à nos côtés."
MLA_Launch_the_East_Malaysian_Insurrection_desc: "Les préparatifs sont terminés, il est temps que la révolution se propage vers l'Est !"
MLA_Integrate_the_Revolutionary_Government_desc: "Le Front de libération nationale malaisien a une fois de plus triomphé des réactionnaires coloniaux ! Il est maintenant temps pour tous les Malaisiens de s'unir sous la prospérité socialiste !"
MLA_Begin_1975_7_Year_Plan_desc: "Comme prévu, les Britanniques ont laissé la Malaisie orientale dans un état de pauvreté et de sous-développement. Il nous faudra des années pour les remettre à niveau, mais il faut le faire !"
MLA_Implement_Factory_Safety_Regulations_desc: "Nos travailleurs doivent rester en sécurité et productifs !"
MLA_Modernize_Hospital_Equipment_desc: "Qu'il s'agisse d'une maladie mortelle ou d'une blessure sans conséquence, notre personnel médical disposera des meilleurs outils pour la traiter."
MLA_Attempt_to_Crack_Down_on_Productivity_Stagnation_desc: "L'un des problèmes des pays développés est la stagnation éventuelle de la productivité. Des quotas plus élevés garantissent une croissance continue."
MLA_Jumpstart_the_Eastern_Malaysian_Economy_desc: "Il y a beaucoup de terrains qui peuvent être utilisés pour le développement, nous allons commencer à les défricher."
MLA_Increase_Pensions_desc: "L'économie est actuellement suffisamment forte pour se permettre une augmentation des retraites."
MLA_Construct_the_Abdullah_CD_Shipping_Yard_in_Kuching_desc: "La Malaisie orientale a besoin de son propre chantier naval, nous ne pouvons pas compter uniquement sur Malacca."
MLA_Prospect_For_Iron_Deposits_in_Sarawak_desc: "Il y a des richesses sous terre qui ne demandent qu'à être découvertes !"
MLA_Construct_the_North_Borneo_Auto_Plant_desc: "Les automobiles gagnent en popularité dans le monde socialiste, nous devrions commencer à fabriquer les nôtres !"
MLA_Modernize_Nascent_Ports_desc: "Les ports et les bases navales de la Malaisie orientale sont assez vétustes et nécessitent des investissements."
MLA_Update_State_Rail_Networks_desc: "Un transport efficace des marchandises est essentiel ; Le système ferroviaire de la Malaisie orientale doit être mis à niveau."
MLA_Pave_Dirt_Paths_in_Suburban_Limbang_desc: "Dans un pays moderne comme celui-ci, les chemins de terre sont inacceptables."
MLA_Establish_the_Malaysian_Logging_Industry_desc: "Le nombre d'arbres que nous avons coupés pour le développement est énorme, nous pourrions en tirer toute une industrie !"
MLA_Launch_Efficent_Agriculture_Programs_desc: "De nouveaux progrès dans les techniques agricoles augmenteront considérablement notre production !"
MLA_Build_Experimental_Offshore_Wind_Turbines_desc: "Les vitesses du vent sont beaucoup plus fortes en mer que sur terre, voyons si nous ne pouvons pas exploiter cette force avec nos nouvelles conceptions d'éoliennes !"
MLA_Create_Advanced_Typhoon_Shelters_in_Urban_Areas_desc: "Les typhons sont une réalité malheureuse en Asie de l'Est. Mieux nous sommes préparés à faire face à ces catastrophes naturelles, moins elles causent de dégâts."
MLA_The_East_Malaysian_Disaster_desc: "Nos efforts pour libérer la Malaisie orientale ont échoué. De toute évidence, des traîtres dans les rangs ont permis que cela se produise."
MLA_Begin_the_Second_Red_Terror_desc: "Nous n'aurons pas de repos tant que tous les responsables de la catastrophe de la Malaisie orientale n'auront pas été traduits en justice."
MLA_Begin_Military_Purges_desc: "Tout soldat qui a hésité pendant l'insurrection de la Malaisie orientale doit être considéré comme un collaborateur réactionnaire."
MLA_Execute_Abdullah_CD_desc: "Abdullah CD était censé inciter le peuple de Malaisie orientale à rejoindre notre cause. Son échec équivaut à une trahison."
MLA_Found_the_Sungai_Reeducation_Facility_desc: "Les différences d'opinion ne peuvent être tolérées ; cela engendre la corruption et peut entraîner la destruction."
MLA_Expand_Labor_Camps_in_Kota_Bharu_desc: "Vous paierez vos crimes contre l'État par du travail et du labeur."
MLA_Clamp_Down_on_Intelectual_Reformism_desc: "Nous ne pouvons pas nous laisser emporter par le courant des réformes et de la libéralisation ; nos idéaux sont inébranlables."
MLA_Liquidate_Remaining_Intellegencia_desc: "Les quelques réformateurs et idéalistes qui n'ont pas encore été arrêtés seront bientôt réglés."
MLA_Unleash_the_Malaysian_Red_Gaurd_desc: "Le fait que la Garde rouge opère ouvertement, à la vue du peuple, encouragera... le respect des règles."
MLA_Blame_the_Timil_for_the_Military_Disaster_desc: "De toute évidence, les Tamouls ont de la sympathie pour l'ancien régime. Sinon, pourquoi auraient-ils saboté nos efforts ?"
MLA_Escelate_to_a_Full_Great_Purge_desc: "Les traîtres sont partout. Nous ne pouvons pas nous arrêter tant que chacun n'a pas été liquidé."

MLA_CPM_Reformist_Takeover_desc: "Chin Peng a fait preuve d'une incompétence flagrante en tant que président et a plongé notre pays dans un désastre économique sans précédent. Un nouveau leadership est nécessaire."
MLA_Maintain_Clergy_Repression_desc: "La religion reste une chose dangereuse et l'attitude du Parti à son égard ne changera pas."
MLA_Dismantle_the_Personality_Cult_desc: "Les gens ont fait confiance à Chin Peng, mais ils ont été déçus à maintes reprises. Il est indigne de sa réputation d'héroïque."
MLA_Open_Diplomatic_Relations_with_the_US_desc: "Nous n'avons aucune mauvaise volonté envers les États-Unis d'Amérique, les relations avec eux doivent être normalisées."
MLA_The_Johannesburg_Summit_desc: "Il est temps de tourner la page du passé et de chercher à mettre fin à l'hostilité diplomatique entre nous et le Royaume-Uni."
MLA_Maintain_Anti_Soviet_Dogma_desc: "Nous estimons que l'Union Soviétique a causé un grand tort à la cause socialiste ces dernières années."
MLA_Begin_Limited_Privatization_desc: "L'ouverture du marché encouragera une concurrence saine et une innovation constante."
MLA_Construct_Forced_IP_Transaction_Legislation_desc: "Les propriétés intellectuelles étrangères seront saisies et mises au service de l'État. Les détenteurs de propriété intellectuelle, bien entendu, n'approuveront pas."
MLA_Attract_Western_Corporations_desc: "Nous allons permettre aux entreprises étrangères de s'implanter dans notre pays et stimuler l'économie. Le tout correctement réglementé conformément à la loi malaisienne, bien sûr."

MLA_Open_the_Malaysian_Tech_Industry_desc: "Le président Peng a une fois de plus démontré sa capacité à diriger notre peuple ! Bravo à notre croissance continue sous sa direction !"
MLA_Reverse_Engineer_Western_Products_desc: "La technologie occidentale est assez avancée, voyons si nous ne pouvons pas découvrir ce qui la motive."
MLA_Hire_European_Computer_Scientists_desc: "Les experts en informatique d'Europe de l'Est peuvent nous aider à comprendre le fonctionnement de ces dernières avancées technologiques."
MLA_Produce_a_Competitive_Computer_System_desc: "Nos systèmes informatiques doivent pouvoir rivaliser avec leurs homologues occidentaux."
MLA_Found_the_MTDC_desc: "La Malaysian Technology Development Corporation contribuera à renforcer notre industrie électronique !"
MLA_Open_Hardware_Manufacturing_Plants_desc: "Nous devons augmenter et moderniser notre production de matériel informatique."
MLA_Begin_Wireless_Computation_Research_desc: "Les communications sans fil deviennent peu à peu la norme, nous ne pouvons pas rester à la traîne !"
MLA_Open_the_National_Cybercrime_Division_desc: "À mesure que les ordinateurs progressent, leur capacité offensive augmente. Nous devons nous défendre contre cette menace naissante."
MLA_Experiment_with_Cybernetic_Planning_desc: "Un système informatisé de planification centrale pourrait être une énorme aubaine, nous devrions essayer d'en développer un !"

MLA70s_The_Malaysian_National_Liberation_Army_desc: "La nouvelle décennie apportera de nouveaux défis et menaces, le MNLA doit être prêt à y faire face."
MLA70s_Malaysian_National_Liberation_Ground_Force_desc: "Le conflit avec la Malaisie orientale est inévitable, notre force terrestre doit être prête à affronter à nouveau les troupes réactionnaires !"
MLA70s_Malaysian_National_Liberation_Air_Force_desc: "Les hélicoptères sont la nouvelle norme en matière de guerre aérienne, nous ferions mieux d'apprendre à les utiliser correctement."
MLA70s_Malaysian_National_Liberation_Navy_desc: "De l'autre côté du détroit, les impérialistes préparent notre destruction. Notre Marine portera la révolution vers l'Est !"
MLA_Refine_Malaysian_Strategic_Doctrine_desc: "La guerre a changé et nos méthodes doivent évoluer avec elle."
MLA_Optimize_the_AK_for_Intense_Swamp_Warfare_desc: "Bornéo est une terre de jungles et de marécages épais ; nous devons nous assurer que nos armes fonctionneront correctement dans un tel environnement."
MLA_Develope_Squad_Support_Weapons_desc: "Nos troupes ont besoin de plus d'équipement de soutien pour combattre les impérialistes, assurons-nous qu'elles disposent de tout ce dont elles ont besoin ! "
MLA_Research_Heat_Friendly_Uniforms_desc: "La chaleur à Bornéo est intense, nos hommes auront besoin d'uniformes capables de les protéger des éléments."
MLA_License_the_Z6_desc: "Le Z-6 chinois est un hélicoptère très impressionnant, nous devrions étudier sa conception et construire notre propre version !"
MLA_Purchase_Mi24s_desc: "Le Mi-24 soviétique a une faible capacité en passagers mais compense cela par sa puissance de feu brute. Procureons-en quelques-uns."
MLA_Expand_Helicopter_Training_Programs_desc: "Nos pilotes et nos troupes recevront une formation approfondie à la guerre par hélicoptère."
MLA_Create_a_Domestic_AGM_System_desc: "L'avenir de la défense antiaérienne réside dans les systèmes de défense antimissile guidés."
MLA_Modernize_the_Escort_Fleet_desc: "Notre flotte doit être mise à niveau avec toutes les dernières avancées en matière de guerre navale."
MLA_Modernize_the_Tiger_Class_Submarine_desc: "Les sous-marins sont un élément essentiel de notre Marine ; nous ne pouvons pas les laisser prendre du retard !"
MLA_Begin_Naval_Helicopter_Research_desc: "Les hélicoptères se sont révélés très utiles pour les combats au sol ; nous devrions voir comment nous pouvons les intégrer dans la Marine."
MLA_Construct_Cutting_Edge_Shipyards_desc: "La Marine de libération nationale malaisienne sera la plus grande de toute l'Asie du Sud-Est !"

