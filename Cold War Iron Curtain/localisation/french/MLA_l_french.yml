MLA_lt_equipment_3: "PT-76"
MLA_lt_equipment_3_short: "PT-76"
MLA_lt_equipment_3_desc: "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."

MLA_mbt_equipment_0: "T-34-85"
MLA_mbt_equipment_0_short: "T-34-85"
MLA_mbt_equipment_0_desc: "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et est bien connu pour sa fiabilité. Le T-34 a été conçu en 1940 par le KMBD en Union soviétique. Dans le but de réduire les coûts, le blindage incliné a été introduit dans la conception du char. Cependant, cela a également permis au réservoir lui-même de devenir bien mieux protégé et moins coûteux avec une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité de transport de munitions nominale. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait difficile le fonctionnement des commandants de char et leur faible capacité de coordination réduisait de nombreux avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays les plus pauvres."
MLA_mbt_equipment_1: "T-44"
MLA_mbt_equipment_1_short: "T-44"
MLA_mbt_equipment_1_desc: "Le T-44 est un char moyen soviétique fabriqué vers la fin de la Seconde Guerre mondiale. Il offrait une mobilité améliorée et un blindage plus important avec un canon principal plus lourd de 85 mm. Il a été conçu par AA Morozov en 1944, mais peu ont été construits car le char était considéré comme trop cher pour les avantages qu'il offrait. Seulement 2 000 exemplaires furent construits avant que la production ne revienne au T-34."
MLA_mbt_equipment_2: "T-54"
MLA_mbt_equipment_2_short: "T-54"
MLA_mbt_equipment_2_desc: "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
MLA_mbt_equipment_3: "T-55"
MLA_mbt_equipment_3_short: "T-55"
MLA_mbt_equipment_3_desc: "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "

MLA_mbt_equipment_9: "PT-91M Pendékar"
MLA_mbt_equipment_9_short: "PT-91M Pendékar"

