#MLA 60's Focus Descs

MLA_The_Sino_Soviet_Split_desc: "Les différences entre les Soviétiques et le président Mao se sont révélées trop grandes. Devons-nous essayer de maintenir la neutralité sur cette question ou nous ranger du côté des Chinois ?"
MLA_Maintain_Dual_Leadership_desc: "C'est entre les Soviétiques et les Chinois. Nous maintiendrons notre neutralité et tenterons de maintenir de bonnes relations avec les deux pays."
MLA_Foster_Close_Relations_With_Mao_desc: "La Chine reste notre partenaire proche, malgré nos récentes divergences d'opinions."
MLA_Criticize_Soviet_Intervention_In_Hungary_desc: "L'invasion soviétique de la Hongrie était totalement inutile ; la question aurait très bien pu être réglée diplomatiquement avec la médiation de la Chine."
MLA_Meet_With_Khrushchev_desc: "Au cours des années qui ont suivi la mort du camarade Staline, nous n'avons pas eu une véritable réunion avec le nouveau secrétaire général de l'URSS."
MLA_State_Visit_to_Yugoslavia_desc: "Le socialisme de Tito est plutôt peu orthodoxe, mais nous ne pouvons nier qu'il a grandement stabilisé les Balkans. Nous pourrions apprendre de lui."
MLA_Support_Global_De-Escalation_desc: "Les tensions sont montées ces derniers temps, nous devons faire notre part pour inverser cette tendance dangereuse."
MLA_Diplomatically_Support_North_Vietnam_desc: "Hô Chi Minh se bat pour la libération de son peuple d'un régime colonial brutal, tout comme nous le faisions il n'y a pas si longtemps. Il aura notre soutien !"
MLA_Deepen_Comecon_Collabaration_desc: "Une coopération plus poussée avec le Comecon nous aidera grandement."
MLA_Purge_Shamsiah_Fakeh_desc: "Les idées de Shamsiah Fakeh ne sont rien d'autre que des chimères idéalistes. Elle est devenue préjudiciable à notre cause et doit donc être purgée."
MLA_State_Visit_to_Bejing_desc: "Wuhan est le théâtre d'une bataille majeure qui a eu lieu entre les envahisseurs japonais et chinois. Le président Peng rendra visite et rendra hommage à ceux qui ont courageusement lutté contre l'occupation impérialiste."
MLA_Establish_Relations_With_Albania_desc: "L'Albanie est idéologiquement plus proche de la Chine que des Soviétiques, nous devrions ouvrir des relations diplomatiques avec eux."
MLA_Arrest_Soviet_Diplomats_desc: "Les diplomates des pays révisionnistes ne sont pas les bienvenus ici."
MLA_Close_the_Soviet_Embassy_desc: "Jusqu'à ce que l'Union Soviétique se réengage en faveur d'un véritable marxiste-léninisme, nous n'avons rien à discuter."
MLA_Escalate_Anti-British_Sentiment_desc: "Expulser les soldats britanniques ne suffisait pas. Tous les civils restés sur place menacent l'existence d'une Malaisie indépendante !"
MLA_Support_Pol_Pot_desc: "Pol Pot a besoin de notre aide pour libérer le Cambodge des mains des despotes réactionnaires !"
MLA_Request_Chinese_Financial_Aid_desc: "Des liens économiques plus solides avec la Chine nous aideront grandement."
MLA_Assert_Malaysian_Geopolitical_Independence_desc: "La Malaisie ne sera plus jamais la marionnette des puissances étrangères, nous sommes un peuple fier et autosuffisant !"

MLA_Expand_Malaysian_Intelegence_desc: "L'ancienne culture a été irréversiblement entachée par l'impérialisme britannique. Tout comme en Chine, les anciennes méthodes doivent être oubliées et remplacées par de nouvelles idées et coutumes socialistes !"
MLA_Infiltrate_South_Vietnam_desc: "Le président Mao a lancé la Grande Révolution culturelle du prolétariat, un mouvement visant à annihiler tous les vestiges des traditions capitalistes-impérialistes de la Chine. Nous l'imiterons textuellement !"
MLA_Share_Intel_on_US_Military_Positions_desc: "La fragmentation linguistique constitue une menace pour l'unité nationale et ne peut être tolérée. "
MLA_Organize_Vietcong_Training_Camps_desc: "Au rythme où nous allons, le mandarin deviendra la langue principale de la Malaisie. §RBien.§"
MLA_Mislead_South_Vietnamese_Intelligence_desc: "La Malaisie est le second chez-soi de tous les citoyens chinois, nous devrions encourager davantage d'entre eux à immigrer !"
MLA_Allow_Volunteers_to_Join_the_Vietnam_War_desc: "La littérature révolutionnaire chinoise est l'une des meilleures jamais écrites, tout le monde devrait la lire !"
MLA_Begin_a_Misinformation_Campaign_desc: "Les fêtes chinoises sont vraiment spectaculaires, elles sont même populaires en Occident. En fait... Adoptons-les !"
MLA_Get_Involved_in_Laos_desc: "Comme nos frères chinois, nous promouvrons la création d'une Garde rouge pour aider à la propagation du socialisme dans le monde !"
MLA_Send_Medics_and_Engineers_desc: "La Garde Rouge est une institution respectée, aucun comportement contraire à celle-ci ne sera toléré."
MLA_Send_Anti-Aircraft_Guns_desc: "Avoir des yeux à l'intérieur de l'armée nous aidera à éradiquer la corruption."
MLA_Airdrop_Small_Arms_to_the_Pathet_Lao_desc: "La révolution doit venir de l'intérieur ; les peuples opprimés du monde doivent prendre les armes et lutter pour leur libération !"
MLA_Provide_Low-Flying_Scouting_Aircraft_desc: "Tout équipement excédentaire que nous avons en stock doit être réparti entre les Gardes rouges."
MLA_Request_Expanded_North_Vietnamese_Involvement_desc: "Les crimes commis par les régimes coloniaux en Malaisie et dans le reste du continent ne peuvent être ni pardonnés ni oubliés !"
MLA_Establish_the_Ministry_of_Internal_Affairs_desc: "Le ministère de l'Intérieur est chargé d'assurer une discipline stricte au sein du Parti, de l'armée et de la police civile."
MLA_Infiltrate_Cooperatives_desc: "Les coopératives sont essentielles à l'économie, mais même elles peuvent se corrompre. Nous veillerons à ce que cela n'arrive pas."
MLA_Greatly_Expand_Policing_desc: "Le peuple doit être protégé. Parfois même d'eux-mêmes."
MLA_Confiscate_Remaining_Religious_Texts_desc: "Etes-vous sûr de pouvoir faire confiance à votre camarade ? Pouvez-vous garantir qu'il n'est pas un réactionnaire, ni même un espion ?"
MLA_Open_Investigations_on_Suspected_CIA_Agents_desc: "Les Américains ont des yeux et des oreilles partout. Dans certains pays, même aux plus hauts échelons du gouvernement. Il faut les extirper."
MLA_Begin_Operations_In_Thailand_desc: "La première campagne de sécularisation a été un énorme succès, mais il reste encore quelques récalcitrants. Une deuxième campagne est nécessaire."
MLA_Ensure_CPT_Support_desc: "Les quelques textes religieux restant en Malaisie seront confisqués et détruits. Un seul exemplaire de ces livres peut causer de grandes souffrances."
MLA_Contact_Pathet_Lao_Cells_desc: "Nous présenterons le père John à l'oncle Stripes. §RIls s'entendront... délicieusement.§"
MLA_Provide_Assassination_Equpipment_desc: "Les services religieux, y compris privés, ne seront plus tolérés."
MLA_Establish_Training_Camps_in_Northern_Thailand_desc: "Les héros de la guerre de libération doivent être immortalisés et célébrés pour toujours !"
MLA_Hijack_the_Malaysian_Nationalist_Movement_desc: "Notre nouvelle culture n'a plus besoin de dieux ni de contes de fées."
MLA_Sew_Mistrust_in_the_Thai_Government_desc: "Maintenant que les choses se sont calmées, nous pouvons relâcher notre emprise sur les gens et nous concentrer sur d'autres projets."

MLA_Begin_Planning_The_Modernization_Campaign_desc: "Nos efforts de construction au cours de la dernière décennie se sont concentrés sur la reconstruction de ce que les Britanniques et les Japonais avaient détruit. La prochaine étape est de moderniser notre industrie et de rattraper nos camarades !"
MLA_Accept_Soviet_Support_desc: "L'Union soviétique a réalisé un travail remarquable de reconstruction après la Seconde Guerre mondiale. Nous devrions solliciter leurs conseils dans notre effort de modernisation."
MLA_Create_the_Malaysian_State_Planning_Committee_desc: "Un comité chargé de superviser correctement le développement industriel devrait être créé."
MLA_Lease_Malacca_to_the_USSR_desc: "Une condition du soutien soviétique est un bail de 50 ans sur le port de Malacca."
MLA_Support_Soviet_Interests_in_Southeast_Asia_desc: "Les Soviétiques nous aident grandement, nous leur rendrons la pareille en promouvant leur cause et leurs idéaux auprès de nos voisins."
MLA_Secure_Soviet_Raw_Materials_desc: "Nous manquons des matériaux nécessaires à la modernisation de notre industrie, nous devrons compter sur les Soviétiques pour les fournir."
MLA_Import_Fertilizer_desc: "L'agriculture soviétique dépasse de loin la nôtre ; nous pourrions utiliser leur aide pour comprendre la science qui se cache derrière cela."
MLA_Request_Soviet_Industrial_Schematics_desc: "L'industrie soviétique est l'une des plus puissantes au monde. Heureusement, ils sont prêts à partager les plans."
MLA_Finalize_the_7_Year_Plan_desc: "Nous avons tout ce dont nous avons besoin. Grâce aux Soviétiques, nous pouvons commencer à nous moderniser !"
MLA_Accept_Chinese_Support_desc: "La transformation de la Chine après deux guerres brutales est étonnante. Nous devrions suivre leurs conseils sur la manière de moderniser notre pays."
MLA_Expand_Backyard_Furnaces_desc: "Les fonderies de basse-cour nous ont bien servi, nous devrions les augmenter en nombre !"
MLA_Begin_Mass_Collectivization_Efforts_desc: "En raison de la famine, nous n'avons jamais pu mettre pleinement en oeuvre la collectivisation. Maintenant que c'est passé, nous pouvons le faire correctement !"
MLA_Guarantee_Malaysian_Support_in_Chinese_Affairs_desc: "La Chine et la Malaisie sont des nations soeurs, la République populaire aura toujours tout notre soutien !"
MLA_Create_the_Kuala_Lumpur_Cooprative_desc: "Nous créerons une coopérative spéciale à Kuala Lumpur pour superviser le développement industriel de toute la région."
MLA_All_Peasants_Must_Work_desc: "Chaque homme, chaque femme et chaque enfant contribuera à l'effort de modernisation !"
MLA_Request_Additional_Manpower_desc: "Nous aurons besoin de mains supplémentaires pour mener à bien notre projet. Des visas spéciaux seront accordés aux travailleurs chinois disposés à aider."
MLA_The_Malaysian_Great_Leap_Forward_desc: "Nous avons tout ce dont nous avons besoin. Grâce à nos camarades chinois, nous pouvons commencer à nous moderniser !"
MLA_Launch_The_Modernization_Campaign_desc: "La phase de planification est terminée. Maintenant, les travaux peuvent commencer !"
MLA_Continue_the_Mass_Literacy_Campaign_desc: "Notre première campagne d'alphabétisation s'est concentrée sur des aspects fondamentaux, tels que la lecture et l'écriture. La prochaine étape consiste à créer une population de professionnels qualifiés et instruits."
MLA_Expand_Higher_Education_Opportunities_desc: "Notre pays a cruellement besoin de spécialistes, nous devrions augmenter le nombre d'universités."
MLA_Promote_Bilingual_Programs_desc: "Chaque enfant parlera couramment le mandarin et le malais !"
MLA_Emphasize_Mathematics_Studies_desc: "Les mathématiques sont une partie essentielle de nombreux métiers ; nous devrions accorder une attention particulière à son étude !"
MLA_Expand_Extracurricular_Activities_desc: "Le sport et les arts sont fondamentaux pour le développement de l'enfant, chaque école devrait avoir ces programmes !"
MLA_Expand_Study_Abroad_Programs_in_the_DPRK_desc: "Notre programme de change avec la RPDC s'est avéré bénéfique, élargissons-le !"
MLA_Create_the_CPS_College_of_Engineering_desc: "Le Xinjipo City College of Engineering sera le meilleur du genre dans tout le pays !"
MLA_Begin_Material_Science_Research_Programs_desc: "Nous devons continuer à approfondir notre compréhension de la matière et la manière dont elle peut être utilisée pour développer davantage nos industries."
MLA_Found_the_Kuala_Lumpur_Institute_of_Nuclear_Physics_desc: "Nous vivons à l'ère atomique et pourtant nous comprenons très peu l'atome. Les meilleurs cerveaux de KLINP nous aideront à remédier à ce problème."
MLA_The_New_Life_Initiative_desc: "La famine est encore fraîche dans les mémoires des gens. Nous devons augmenter considérablement notre niveau de vie grâce à une production alimentaire plus élevée et à une disponibilité accrue des soins de santé."
MLA_Provide_Free_Vaccination_desc: "Grâce à nos derniers progrès en médecine, le choléra et d'autres maladies qui nous tourmentent depuis si longtemps peuvent être éradiqués !"
MLA_Construct_Rural_Clinics_desc: "La maladie sévit dans de nombreuses régions du pays. En élargissant l'accès aux soins de santé, nous pouvons améliorer considérablement la qualité de vie dans ces régions."
MLA_Attempt_Agricultural_Mechanization_desc: "Presque toute notre agriculture est encore réalisée selon des méthodes traditionnelles. Face à une industrialisation croissante, cela semble extrêmement contre-productif."
MLA_Create_New_Plots_in_Terengganu_desc: "Il existe de nombreuses terres arables prêtes à être cultivées à Terengganu. Passons à la plantation !"
MLA_Streamline_Collectivization_desc: "La Malaisie est enfin prête à mettre en oeuvre la collectivisation agricole !"
MLA_Irrigation_Efforts_in_Large_Cooperatives_desc: "Les fermes ont besoin d'eau, et nous en avons beaucoup à disposition. Il nous suffit de déplacer cette eau là où elle est nécessaire."
MLA_Allow_Local_Farmers_Markets_desc: "Les petits marchés où les agriculteurs pourront vendre leurs surplus de production seront autorisés."
MLA_Greatly_Expand_Fertilizer_Production_desc: "Plus de fermes signifie plus d'engrais, mieux vaut augmenter la production !"
MLA_Provide_For_the_People_desc: "Les conditions de vie en Malaisie se sont améliorées régulièrement depuis la guerre de libération, mais il reste encore beaucoup à faire. Il est temps d'améliorer le logement, de moderniser les routes et d'élargir le marché de consommation."
MLA_Adopt_Soviet_Housing_Design_desc: "Les logements soviétiques sont fonctionnels et confortables, nous devrions adopter leur conception."
MLA_Redistribute_Colonial_Assets_desc: "Les biens confisqués au régime colonial seront distribués à la population. Après tout, c'était toujours une propriété malaisienne légitime !"
MLA_Construct_Textile_Mills_in_Kuala_Lumpur_desc: "Le monde aura toujours besoin de textiles ; nous devrions construire des moulins pour les produire !"
MLA_Produce_Quality_of_Life_Products_desc: "Radios, ustensiles de cuisine modernes, fours grille-pain ; si vous pouvez le rêver, vous pouvez l'acheter !"
MLA_Research_Efficient_Production_Methods_desc: "Pour répondre à la demande croissante, nous développerons des méthodes de production plus efficaces."
MLA_Create_a_Modern_Road_Network_desc: "Les chemins de terre et les pavés appartiennent au passé. Laissez couler l'asphalte !"
MLA_Create_Power_Plants_in_Urban_Areas_desc: "À chaque progrès que nous réalisons, notre besoin en énergie brute augmente. Assurons-nous de répondre à la demande."
MLA_Construct_the_S.A._Ganapathy_Railway_desc: "Le chemin de fer S.A. Ganapathy fournira à la Malaisie un système ferroviaire national moderne !"
MLA_Establish_the_Malaysian_Mining_Industry_desc: "Il est temps de transformer la Malaisie d'une société essentiellement agraire en une nation moderne et industrialisée."
MLA_Modernize_Excavation_Technology_desc: "Les études géologiques suggèrent qu'il existe encore des gisements minéraux inexploités en Malaisie, nous avons juste besoin des outils appropriés pour les atteindre."
MLA_Expand_Heavy_Infrastructure_Development_desc: "Notre infrastructure doit être étendue si nous voulons être considérés comme un pays développé."
MLA_Recall_Backyard_Furnaces_desc: "Notre capacité industrielle s'est développée au point où les fonderies artisanales ne sont plus nécessaires."
MLA_Prospect_For_Rare_Minerals_in_Perak_desc: "Les métaux des terres rares et les matières nucléaires sont extrêmement précieux, nous espérons en trouver à Perak."
MLA_Construct_the_Pengang_National_Steel_Plant_desc: "L'acier est un élément essentiel de la construction moderne, assurons-nous d'en produire en quantité !"
MLA_Open_the_V._Lenin_Boxite_Mine_desc: "La bauxite est la principale source mondiale d'aluminium et nous venons d'en découvrir un gisement à Pahang. Commencez à creuser !"
MLA_Expand_Logistics_Networks_desc: "Le transport efficace des fournitures à travers notre pays doit être assuré."
MLA_Become_the_World's_Largest_Tin_Producer_desc: "L'étain est toujours très demandé, et nous en avons beaucoup à disposition !"
MLA_Declare_Malaysia_a_Second_World_Nation_desc: "Après d'innombrables heures de travail acharné, la campagne de modernisation est enfin terminée ! Nous sommes passés d'un pays pauvre et postcolonial à une nation prospère du second monde !"

MLA60s_The_Malaysian_Peoples_Liberation_Army_desc: "Le MNLA est fidèle au service du peuple depuis dix ans ! Il est temps de leur fournir les outils dont ils ont besoin pour y parvenir encore dix fois !"
MLA60_Malaysian_Peoples_Liberation_Air_Force_desc: "Voyons comment nous pouvons améliorer notre Force aérienne."
MLA60_Malaysian_Peoples_Liberation_Ground_Force_desc: "Voyons comment nous pouvons améliorer notre force terrestre."
MLA60_Malaysian_Peoples_Liberation_Navy_desc: "Voyons comment nous pouvons améliorer notre Marine."
MLA_Modernize_Defenses_on_the_Thai_Border_desc: "Les fortifications à notre frontière avec la Thaïlande montrent leur âge, elles ont besoin d'être rénovées."
MLA_Improve_the_AK_Platform_desc: "La conception de l'AK s'est radicalement améliorée au cours des dix dernières années !"
MLA_Establish_the_Special_Branch_of_the_MPLA_desc: "Nous créerons une branche spéciale de l'armée chargée d'accomplir des missions qui ne peuvent pas toujours être discutées."
MLA_Improve_Jungle_Warfare_Capabilities_desc: "§RPourquoi les arbres parlent-ils malais ?§"
MLA_Begin_Bomber_Research_Programs_desc: "Nous avons appris tout ce que nous pouvions des vieux bombardiers de la RAF, nous devons maintenant concevoir les nôtres."
MLA_Import_North_Korean_Migs_desc: "Le dernier design des MiG est incroyable, il nous faut les avoir !"
MLA_Found_the_Malaysian_Paratrooper_Corps_desc: "Des dizaines de nos hommes tomberont du ciel pour rendre justice rapidement aux impérialistes détestés !"
MLA_Modernize_Transport_Planes_desc: "... mais d'abord, nous aurons besoin de nouveaux avions de transport. "
MLA_Begin_Frigate_Production_desc: "Les frégates sont peut-être anciennes, mais elles sont très efficaces contre les sous-marins."
MLA_Develop_the_Tiger_Class_Submarine_desc: "On ne sait jamais ce qu'il y a sous cette eau. Une fois que nous aurons des sous-marins, nous le ferons."
MLA_Organize_a_Formal_Marine_Corps_desc: "Notre Corps des Marines fonctionne comme une branche de la Marine depuis sa création. Peut-être sont-ils prêts pour la prochaine étape ?"
MLA_Research_Efficent_Landing_Crafts_desc: "L'Asie du Sud-Est est composée de nations maritimes. Si jamais nous devons rendre visite à nos voisins, nous aurons besoin de la meilleure péniche de débarquement disponible."

#MLA 70's Focus Titles

MLA_70s: "République démocratique populaire de Malaisie Arbre focal des années 70" 

MLA_Begin_Industrial_Reconstruction: "Commencer la reconstruction industrielle"
MLA_Request_Chinese_Agricultural_Aid: "Demander une aide agricole chinoise"
MLA_Close_Mines_in_Perak: "Fermer les mines à Perak"
MLA_Scrap_Unfinished_Factories: "Ferrailles d'usines inachevées"
MLA_Decrease_Urbanization: "Diminuer l'urbanisation"
MLA_Allow_Local_Market_Activity: "Autoriser l'activité du marché local"
MLA_Pursue_Limited_Industrialization: "Poursuivre une industrialisation limitée"
MLA_Divert_Resources_to_Failing_Agriculture: "Détourner les ressources vers une agriculture en déclin"
MLA_Scapegoat_the_Party_Intelligentsia: "Bouc émissaire du Parti Intellegentsia"
MLA_Commence_Monetary_Reform: "Commencer la réforme monétaire"
MLA_Decrease_the_Money_Supply: "Diminuer la masse monétaire"
MLA_Implement_Austerity: "Mettre en oeuvre l'austérité"
MLA_Purge_Incompetent_Banking_Officials: "Purger les responsables bancaires incompétents"
