#TTM Focus Descs
TTM_Prepare_for_the_Thai_Civil_War_desc: "Nous avons reçu une occasion en or de libération, mais nous ne pouvons pas nous précipiter dans la bataille. Nous devons nous préparer à ce qui va arriver."
TTM_Request_Malaysian_Manpower_desc: "Nous aurons besoin de l'aide de nos camarades malaisiens pour gagner ce combat."
TTM_Beg_For_Light_Arms_desc: "Le MNLA dispose d'armes très impressionnantes. Ils sont sûrement prêts à nous en fournir."
TTM_Operation_Orbweaver_desc: "Le gouvernement tentera sans aucun doute de nous détruire avant que nous soyons prêts à nous battre. Nous devons renforcer nos défenses avant que cela n'arrive."
TTM_Fortify_Hat_Yai_desc: "Le capital provisoire doit être protégé à tout prix !"
TTM_Boobytrap_the_Jungle_desc: "Nous devons établir un nouveau système judiciaire, libre de toute influence monarchiste."
TTM_Begin_Tunnel_Construction_desc: "Les gens sont naturellement inquiets de la situation actuelle. Nous détournerons une partie de nos forces armées pour maintenir l'ordre."
TTM_Create_a_Fluid_Border_desc: "Les terres qui servaient auparavant aux riches et aux puissants seront désormais utilisées pour subvenir aux besoins du peuple !"
TTM_Insight_Violence_in_Bangkok_desc: "Faites savoir que Bangkok sera bientôt libérée de l'influence fasciste !"
TTM_Recruit_From_Local_Towns_desc: "Nous avons besoin de plus d'hommes pour lutter pour cette cause, et la conscription nous en fournira."
TTM_Encourage_Tactical_Withdrawls_desc: "Plus jamais nos mères et nos soeurs ne seront privées de leur dignité !"
TTM_Be_Strong_desc: "Les communes aideront à superviser la transformation de la Thaïlande en une nation moderne et industrialisée !"
TTM_Act_Weak_desc: "Jusqu'à ce que nous puissions libérer le reste de notre pays et ses riches terres agricoles, nous devrons compter sur les importations alimentaires malaisiennes."
TTM_Bait_the_Thai_Armed_Forces_desc: "Le gouvernement a une longue histoire de despotisme monarchiste et de collaboration fasciste, comment peuvent-ils prétendre représenter le peuple thaïlandais ?"
TTM_Operation_Trapdoor_desc: "Une frappe coordonnée entre les gouvernements birman et thaïlandais serait fatale. Nous devons les frapper avant qu'ils le puissent."
TTM_Improve_Fortifications_on_the_Burmese_Border_desc: "En nous procurant des armes auprès de l'armée birmane, nous pouvons approvisionner nos troupes et aider le BCP dans sa lutte de libération !"
TTM_Capture_Stray_Burmese_Weapons_Caches_desc: "Nos approvisionnements s'épuisent, nous allons devoir en acquérir chez nos voisins birmans."
TTM_Steal_Thai_Artillery_Pieces_desc: "Des frappes coordonnées contre le gouvernement birman entre nous et le BCP seront très bénéfiques pour leur révolution !"
TTM_Request_Malaysian_Anti-Aircraft_Guns_desc: "Un ravitaillement supplémentaire vers la Birmanie nous fournira tout ce dont nous avons besoin pour notre guerre contre le gouvernement."
TTM_Operation_Huntsman_desc: "Nous disposons des hommes et des outils nécessaires pour porter la révolution vers le nord."
TTM_Assassinate_Enemy_Officers_desc: "Sans leurs dirigeants expérimentés, l'armée thaïlandaise sera trop désorganisée pour combattre correctement."
TTM_Spread_Maoist_Propaganda_desc: "Le peuple doit nous considérer comme des libérateurs et non comme des opportunistes."
TTM_Call_For_Malaysian_Air_Support_desc: "Nos camarades malaisiens nous aideront à nous défendre contre les frappes aériennes ennemies."
TTM_Announce_a_General_Strike_desc: "Nous déstabiliserons davantage le gouvernement en lançant une grève générale des travailleurs."
TTM_Destroy_Thai_Communication_Lines_desc: "Sans communications efficaces, l'armée thaïlandaise ne sera pas en mesure de coordonner correctement ses défenses et ses contre-attaques."
TTM_Shell_Royalist_Positions_desc: "L'armée s'est retranchée, mais cela n'a aucune conséquence. Nous les extirperons facilement !"
TTM_Call_Up_Reserves_desc: "Il est temps d'appeler et de préparer nos hommes en réserve, la guerre est à nos portes !"
TTM_Begin_the_Thai_Civil_War_desc: "Il est temps que tous se battent pour la libération de la Thaïlande !"
TTM_Move_the_Capital_To_Bangkok_desc: "Hat Yai nous a bien servi, mais la capitale de la Thaïlande sera toujours Bangkok."
TTM_Found_the_Peoples_Republic_of_Thailand_desc: "La guerre est gagnée ! Que le monde soit témoin de la naissance d'une nouvelle Thaïlande !"

#### Malayan Emergency Decisions ####
malaysian_emergency_category: "Urgence malaise"
malaysian_emergency_category_desc: "Moment d'urgence : §Y[?MLA.emergency_momentum|0]§!\n\nL'urgence est une lutte pour le contrôle dans neuf États. Les déploiements de troupes et les réseaux de soutien locaux modifient chaque mois le contrôle de chaque État ; les actions dans l'écran de conflit et les récompenses de concentration peuvent modifier l'équilibre. Le contrôle positif favorise le MNLA, le contrôle négatif favorise le gouvernement. Les États au-dessus de §Y+59§! sont §YLibérés§!; ceux en dessous de §Y-59§! sont §YSécurisés§!.\n\nMomentum résume le contrôle dans les neuf États. Le MNLA peut proclamer le §YSoulèvement général§! avec au moins §Y5 États libérés§! et les trois focus §YAssaut final§! terminés. Le gouvernement peut lancer son §YFinal Sweep§! avec au moins §Y7 États sécurisés§! et le §YPlan Briggs§!. L'une ou l'autre décision déclenche une guerre ; il n'accorde pas la victoire."
MLA_Hotfix_Repair_State: "Restaurer l'administration révolutionnaire malaise"
MLA_Hotfix_Repair_State_desc: "Les versions antérieures du contenu malais pourraient, à tort, retirer notre noyau de notre seul État et appliquer une pénalité de guerre civile régionale. Cette décision répare cet état invalide."
Penang_Ambush: "Embuscade de Penang"
Bukit_Kepong_Incident: "Incident de Bukit Kepong"
Seize_Kuala_Lumpur: "S'emparer de Kuala Lumpur"
Raid_Kuala_Lumpur: "Raid à Kuala Lumpur"
Raid_Perak: "Raid Perak"
Raid_Terrengganu: "Raid Terrengganu"
Exile_the_MNLA_to_Thailand: "Opération Sledgehammer : le balayage final"
Exile_the_MNLA_to_Thailand_desc: "L'urgence est gagnée en tous points, sauf en nom. Le réseau Min Yuen est brisé, les camps de la jungle meurent de faim et le Politburo a perdu les campagnes. Il est temps d'arrêter de contrôler une insurrection et de commencer à mener une guerre d'anéantissement : les mains libres de Whitehall, l'armée de la Fédération sans laisse et le MNLA coincé à Pahang jusqu'à ce qu'il se brise."
The_Liberation_of_Malaya: "Proclamer le soulèvement général"
The_Liberation_of_Malaya_desc: "La campagne est à nous. La Fédération détient les villes et les grands axes routiers et rien d'autre. Le temps des embuscades et des levées est révolu : les colonnes sortent de la jungle sous forme d'armée, le Parti proclame la République populaire malaise et la Fédération se voit confier une guerre qu'elle ne peut pas gagner.\n\n§YLa Grande-Bretagne ne répondra pas à l'appel.§! Whitehall a déjà radié la péninsule ; la garantie expire et la garnison se replie sur Singapour.\n\n§RCela ne permet pas de gagner l'urgence, mais de déclencher la guerre qui en décidera.§!"
MLA_Dictate_the_Peace: "Dictez la paix"
MLA_Dictate_the_Peace_desc: "L'armée de la Fédération a cessé d'exister en tant que force combattante et tous les États de la péninsule brandissent le drapeau rouge. Quel que soit le nom du gouvernement croupion qui se fait encore appeler Malaisie, on peut lui dire les termes plutôt que de les lui demander."
MAL_Crush_the_Uprising: "Écraser le soulèvement"
MAL_Crush_the_Uprising_desc: "Les derniers camps de la jungle ont été envahis. Ce qui reste du MNLA peut traverser la frontière thaïlandaise et y être laissé."
MLA_Holds_the_Peninsula_tt: "Nous contrôlons §YKuala Lumpur, Pahang, Perak, Terengganu, Johor, Selangor, Negeri Sembilan, Kedah§! et §YKelantan§!"
MAL_Has_Crushed_the_MNLA_tt: "Nous détenons §YPahang§! et le MNLA ne contrôle §Raucun territoire qui lui est propre§!"

#### Malayan Emergency Country Events ####

MLA_OTL.1.t: "Élimination du tyran colonial britannique Henry Gurney"
MLA_OTL.1.d: "Dans une frappe triomphale contre les forces d'oppression coloniale, les courageux guérilleros de notre Parti communiste malais ont réussi à tendre une embuscade et à éliminer le haut-commissaire britannique, Sir Henry Gurney, au cours d'une bataille décisive au nord de Kuala Lumpur. Faisant preuve d'une bravoure et d'un génie tactique sans précédent, les guérilleros ont submergé le convoi colonial, semant la peur au coeur du régime impérialiste. Gurney, le symbole de la tyrannie britannique, a connu sa fin alors qu'il titubait, impuissant, vers le site de l'embuscade, témoignage de la force imparable de l'armée populaire. Cette victoire constitue un coup dur porté aux oppresseurs coloniaux et renforce la détermination du peuple malais dans sa juste lutte pour la libération. Les flammes de la révolution brûlent plus que jamais alors que l'empire colonial s'effondre."
MLA_OTL.2.t: "Perte tragique du haut-commissaire Sir Henry Gurney"
MLA_OTL.2.d: "Dans une tournure dévastatrice des événements, le haut-commissaire Sir Henry Gurney a été tragiquement tué lors d'une embuscade tendue par des guérilleros du Parti communiste malais alors qu'il voyageait au nord de Kuala Lumpur. Bien qu'il ait été blessé, Gurney est sorti héroïquement de son véhicule pour protéger sa femme et son secrétaire particulier, mais a été mortellement touché par les tirs ennemis. Son convoi, dépassé par l'attaque soudaine, n'a pas pu le sauver, et son fidèle chauffeur a également perdu la vie. Lady Gurney, émergeant des décombres, a eu le coeur brisé de retrouver son mari gisant sans vie dans un fossé au bord de la route. Les renforts sont arrivés trop tard pour éviter cette terrible perte, laissant les communautés britanniques et malaises dans le deuil."
MLA_OTL.5.t: "Des camarades singapouriens en grève contre l'oppression coloniale"
MLA_OTL.5.d: "Notre camarade Chin Peng et le Parti communiste malais célèbrent un acte audacieux de résistance à Singapour, où des camarades révolutionnaires ont tenté de porter un coup à l'autorité coloniale. La récente action ne visait nul autre que le gouverneur Franklin Gimson lui-même, symbolisant le mécontentement croissant parmi les travailleurs et les combattants de la liberté singapouriens qui en ont assez de l'exploitation britannique.\n\nNotre Parti considère cet acte comme un signal puissant montrant que l'esprit révolutionnaire est vivant à Singapour et que le peuple est prêt à résister. Le camarade Chin Peng a salué le courage des personnes impliquées, notant que chaque acte de défi rapproche la région de la libération. \"Cela montre que nos frères et soeurs de Singapour tiennent bon\", a déclaré Chin Peng. Le MCP est dynamisé par cette démonstration de solidarité et s'engage à soutenir le peuple de Singapour dans sa lutte continue pour se débarrasser des chaînes du colonialisme. L'étincelle de la résistance a été allumée et le MCP est prêt à l'attiser pour en faire une révolution flamboyante dans toute la Malaisie."
MLA_OTL.5.a: "Une autre petite étincelle d'espoir et de révolution s'est allumée......"

MLA_Victory.1.t: "Les chiens coloniaux se retirent à Singapour"
MLA_Victory.1.d: "Dans une avancée triomphale de notre Armée révolutionnaire de libération malaise sous le commandement du camarade Chin Peng, les forces des impérialistes britanniques ont été chassées de Kuala Lumpur et du continent malais, se retirant en désespoir de cause vers leur dernier bastion colonial, Singapour. Grâce à la lutte intrépide du peuple révolutionné, la libération totale de la Malaisie est presque achevée, signalant l'effondrement imminent de la domination coloniale britannique en Asie du Sud-Est."
MLA_Victory.2.t: "Évacuation d'urgence vers Singapour émise"
MLA_Victory.2.d: "Dans un revers important, les forces conjointes britanniques et malaises dirigées par le maréchal Gerald Templer ont été forcées de se retirer à Singapour après la chute choquante de Kuala Lumpur et du continent face à l'avancée de l'Armée communiste de libération malaise, dirigée par Chin Peng. La situation est désastreuse alors que les forces coloniales et gouvernementales nationales restantes se consolident à Singapour, le dernier bastion d'Asie du Sud-Est. L'avancée rapide des forces communistes a suscité de profondes inquiétudes quant à la stabilité future de la région et à l'effondrement potentiel du contrôle britannique et malais dans cette zone critique."
MLA_Victory.3.t: "L'« Armée de libération nationale malaisienne » a pris le contrôle de Singapour !"
MLA_Victory.3.d: "Tragiquement, malgré les efforts déployés par les armées britannique et malaise pour défendre Singapour du MLA, elles n'ont pas réussi à empêcher les communistes de prendre le pouvoir. Alors que les communistes contrôlent Singapour, beaucoup ont fui pour échapper aux persécutions du nouveau gouvernement communiste. De nombreux responsables espèrent également mettre en place un gouvernement malais en exil ailleurs dans l'espoir de récupérer un jour la Malaisie des mains des communistes, tandis que les Britanniques ont exprimé leur intérêt pour le rétablissement du Rajah blanc au pouvoir au Sarawak."
MLA_Victory.4.t: "Établir un gouvernement malais en exil"
MLA_Victory.4.d: "Dans un ultime effort pour maintenir un État malais loyal au sein du Commonwealth, le gouvernement britannique a approuvé la relocalisation et la création du gouvernement malais en exil sur les îles Coco et Christmas, désormais rebaptisées Pulau Kokos et Pulau Krismas. Après la chute de la Malaisie continentale aux mains du Parti communiste de Malaisie sous Chin Peng. Le Premier ministre Tunku Abdul Rahman a évacué vers Pulau Krismas, à la tête du gouvernement en exil. Cette décision, soutenue par la Grande-Bretagne, vise à préserver une présence pro-Commonwealth dans la région et est considérée comme une tentative stratégique de regrouper et de maintenir son influence en Asie du Sud-Est au milieu de la montée du contrôle communiste."
MLA_Victory.5.t: "Création du gouvernement malais en exil"
MLA_Victory.5.d: "Le Parti communiste malais, sous la direction du camarade Chin Peng, a fermement condamné la création du soi-disant gouvernement malais en exil sur les îles Coco et Christmas. Chin Peng a dénoncé cette démarche désespérée des Britanniques et de leur fantoche, Tunku Abdul Rahman, comme étant la dernière tentative de s'accrocher au pouvoir après leur défaite retentissante sur le continent.\n\nLe Parti a critiqué les conditions de vie misérables et l'incompétence du régime défaillant de Tunku Abdul Rahman, prédisant que ce n'est qu'une question de temps avant que le peuple malais ne se soulève contre cette création coloniale artificielle."
MLA_Victory.6.t: "Les impérialistes britanniques ressuscitent le régime colonial au Sarawak"
MLA_Victory.6.d: "Dans une tentative désespérée de s'accrocher au pouvoir en Asie du Sud-Est, l'Empire britannique a relancé le « Dominion du Sarawak » désuet sous la direction du Rajah Blanc, Vyner Brooke. Cette relique coloniale, soutenue par un financement britannique, est leur dernier stratagème pour stopper la marche inévitable de libération communiste dans la région.\n\nLe chien réactionnaire Templer, fuyant sa défaite à Singapour, a été nommé premier chef d'état-major des Sarawak Rangers. Cette force réactionnaire est destinée à servir de dernière barrière contre notre armée victorieuse dirigée par notre camarade Chin Peng.\n\nCet acte éhonté révèle la peur des impérialistes de perdre le contrôle, mais leurs efforts seront vains."
MLA_Victory.7.t: "La renaissance du Sarawak"
MLA_Victory.7.d: "Dans une démarche décisive pour assurer la paix et la stabilité en Asie du Sud-Est, le Commonwealth et Londres ont soutenu le rétablissement du Dominion du Sarawak sous la direction de notre Rajah Blanc, Vyner Brooke. Cette domination sera un symbole d'espoir et de résistance contre la marée rouge croissante du mal dans la région.\n\nLe feld-maréchal Templer, un leader chevronné récemment évacué de Singapour, a été nommé premier chef d'état-major des Sarawak Rangers. Cette force militaire nouvellement formée se consacre à protéger la population du Sarawak et à protéger la région contre de nouveaux troubles.\n\nLa renaissance du Sarawak reflète le partenariat perpétuel entre le Royaume-Uni et ses alliés d'Asie du Sud-Est. "
MLA_Victory.8.t.a: "Remise en état de Si Rat Malai"
MLA_Victory.8.t.b: "Les Thaïlandais impérialistes envahissent nos terres"
MLA_Victory.8.d.a: "Au cours d'une campagne militaire décisive, nos courageux hommes de l'Armée royale thaïlandaise ont occupé avec succès les États de Perlis, Kedah et certaines parties de Kelantan après l'effondrement du gouvernement malais dû à la victoire communiste menée par l'Armée de libération nationale de Chin Peng. Le gouvernement thaïlandais a déclaré que cette opération constituait une récupération légitime de Si Rat Malai, des provinces qui faisaient historiquement partie de la Thaïlande mais qui ont été injustement cédées au contrôle britannique en vertu du traité de 1909.\n\nNotre roi et notre gouvernement ont réaffirmé que ces terres, brièvement reprises pendant la Seconde Guerre mondiale, font partie intégrante du patrimoine national. L'opération est conçue à la fois comme une restauration de la souveraineté et comme une mesure de protection contre la propagation du communisme, visant à sécuriser la région et à protéger les citoyens thaïlandais du chaos et de l'instabilité provoqués par le soulèvement communiste en Malaisie. Notre peuple thaïlandais considère cette décision comme un accomplissement de la justice historique et une étape cruciale dans la stabilité régionale."
MLA_Victory.8.d.b: "Dans un acte flagrant d'agression impérialiste, l'armée thaïlandaise a illégalement pris d'assaut et occupé nos États malais de Perlis, Kedah et certaines parties du Kelantan, à la suite de la libération victorieuse menée par la courageuse Armée de libération nationale malaise. Notre camarade président Chin Peng et le Parti communiste malais dénoncent fermement cette invasion comme une tentative des forces réactionnaires de recoloniser et d'opprimer le courageux peuple malais sous couvert de reconquérir les soi-disant « provinces perdues ».\n\nCette démarche agressive de la Thaïlande n'est rien d'autre que la poursuite de ses ambitions impérialistes, visant à soumettre le peuple malais et à exploiter ses terres ancestrales. Notre Parti appelle tous les camarades et tous les peuples épris de liberté à résister à cette nouvelle agression coloniale et à protéger les acquis durement acquis de la révolution."
MLA_Victory.9.t: "Agression thaïlandaise en Malaisie"
MLA_Victory.9.d.a: "La colonie de la Couronne du Sarawak condamne fermement l'occupation militaire illégale de Perlis, Kedah et de certaines parties du Kelantan par l'armée royale thaïlandaise suite à l'effondrement du gouvernement malais. Ces terres sont les territoires légitimes du peuple malais, et cet acte flagrant d'opportunisme mine la stabilité régionale à un moment où la lutte contre l'insurrection communiste devrait être la priorité.\n\nBien que la Thaïlande revendique des liens historiques avec ces provinces, le traité de 1909 a établi leur administration britannique et elles sont depuis devenues partie intégrante de la Malaisie. Toute tentative de s'en emparer maintenant, sous couvert de lutte contre le communisme, n'est rien d'autre qu'un accaparement injustifié de terres. Le Sarawak se tient aux côtés des autorités malaises légitimes et exhorte les puissances internationales à rejeter cet expansionnisme irresponsable."
MLA_Victory.9.d.b: "La République de Malaisie condamne fermement l'occupation militaire illégale de Perlis, Kedah et de certaines parties de Kelantan par l'armée royale thaïlandaise suite à l'effondrement du gouvernement malais. Ces terres sont les territoires légitimes du peuple malais, et cet acte flagrant d'opportunisme mine la stabilité régionale à un moment où la lutte contre l'insurrection communiste devrait être la priorité.\n\nBien que la Thaïlande revendique des liens historiques avec ces provinces, le traité de 1909 a établi leur administration britannique et elles sont depuis devenues partie intégrante de la Malaisie. Toute tentative de s'en emparer maintenant, sous couvert de lutte contre le communisme, n'est rien d'autre qu'un accaparement injustifié de terres. Le Sarawak se tient aux côtés des autorités malaises légitimes et exhorte les puissances internationales à rejeter cet expansionnisme irresponsable."
MLA_Victory.10.t: "La restauration de l'indépendance du Sarawak !"
MLA_Victory.10.d: "Des célébrations jubilatoires éclatent dans tout le Sarawak alors que le retour tant attendu du Rajah Blanc se réalise ! Les voix du peuple sarawakien, longtemps ignorées depuis la cession forcée à la Grande-Bretagne en 1946, ont enfin été entendues. La réintégration du Rajah Charles Vyner Brooke n'est pas seulement le retour d'un monarque : c'est une victoire pour tous les Sarawakiens qui ont lutté sans relâche contre le régime colonial et ont tenu la promesse d'autodétermination.\n\nPendant des années, les patriotes du Sarawak ont mené une lutte vaillante contre cette cession injuste, subissant des menaces, des licenciements et même des effusions de sang de la part des autorités coloniales. Les sacrifices de personnalités comme Rosli Dhobi et les membres de Rukun 13 n'ont pas été oubliés. Leurs rêves d'un Sarawak indépendant, libéré de l'emprise de la domination étrangère, sont désormais plus proches que jamais de la réalité.\n\nLe Rajah Blanc a déclaré que son règne serait une mesure temporaire, travaillant aux côtés du Conseil Native Negri pour garantir que l'avenir du Sarawak soit décidé par son peuple. Les jours de trahison sont révolus et la lutte pour une véritable indépendance continue. Une fois le Raj rétabli et le joug colonial secoué, le Sarawak se dresse à nouveau debout, prêt à forger son propre destin."
MLA_PRC.1.t: "Proclamation de l'Union démocratique populaire de Nanyang"
MLA_PRC.1.d: "Dans un triomphe historique, le camarade Chin Peng et le Parti communiste malais déclarent fièrement notre allégeance inébranlable à Pékin et au Parti communiste chinois. Avec la chute de la Malaisie coloniale, nous allons maintenant de l'avant pour réaliser le rêve de l'Union de Nanyang - une puissante Union socialiste en Asie du Sud-Est unissant les Chinois, les Malais et toutes les races opprimées sous une seule bannière révolutionnaire.\n\nGuidée par les politiques vertueuses de Pékin, l'Union de Nanyang démantelera les chaînes du colonialisme et du capitalisme et les remplacera par une société unifiée et juste pour tous. L'aube d'une nouvelle ère est à nos portes, où les peuples d'Asie du Sud-Est seront enfin unis et solidaires, libérés du joug de l'exploitation impérialiste."
MLA_PRC.2.t: "La situation de Nanyang"
MLA_PRC.2.d: "Les autorités britanniques considèrent la récente déclaration d'allégeance du Parti communiste malais à Pékin et son projet de créer une soi-disant « Union de Nanyang » comme un exercice totalement insensé. L'idée de créer une Union socialiste en Asie du Sud-Est, réunissant sous un même toit les Chinois, les Malais et d'autres groupes ethniques, est considérée comme une pure folie.\n\nLes responsables britanniques préviennent que ce projet mal conçu est non seulement irréaliste mais aussi dangereusement incendiaire. Loin de susciter la solidarité, une telle démarche risque plutôt de déclencher une guerre raciale brutale entre Malais et Chinois, déstabilisant encore davantage la région. L'idée selon laquelle ces communautés diverses et historiquement divisées pourraient se rassembler sous une seule bannière communiste est considérée comme une chimère, vouée à l'échec et à causer d'immenses souffrances dans son sillage."

MLA.81.d.a: "Dans une démarche stratégique visant à élargir la portée du Parti communiste malais, le camarade Chin Peng a adressé une invitation formelle à l'éminent syndicaliste et dirigeant syndical anticommuniste, P.P. Narayanan. Malgré l'opposition de longue date de Narayanan au communisme et ses efforts pour maintenir le mouvement syndical libre de l'influence des partis politiques, Chin Peng a reconnu le rôle vital que joue Narayanan dans l'unification de la main-d'oeuvre de Malaisie.\n\nNarayanan, un révolutionnaire syndicaliste du mouvement ouvrier d'après-guerre, a dû faire face à la concurrence des syndicats dirigés par les communistes, qui avaient gagné en importance après avoir été le fer de lance de la résistance anti-japonaise pendant la Seconde Guerre mondiale. Après la guerre, les communistes étaient considérés comme des héros et tentaient de dominer le mouvement ouvrier naissant. Cependant, Narayanan a réussi à orienter ses syndicats vers une voie syndicaliste plus indépendante, mettant l'accent sur les droits des travailleurs et les réformes sans affiliation politique directe. Il a également joué un rôle clé dans la création de la Confédération internationale des syndicats libres (CISL) en 1949, plaidant pour un mouvement ouvrier libéré de l'exploitation communiste et capitaliste.\n\nL'invitation de Chin Peng s'inscrit dans le cadre de sa stratégie plus large visant à « étendre le Min Yuen », le réseau communiste de partisans et de sympathisants au sein de la population, ciblant particulièrement les syndicats. Notre Parti communiste (MCP) considère le leadership et l'influence de Narayanan sur les syndicats comme cruciaux pour obtenir un soutien de masse, en particulier parmi la classe ouvrière de Malaisie, afin d'alimenter la lutte communiste contre l'impérialisme britannique et l'exploitation capitaliste. En tendant la main à Narayanan, le camarade Chin Peng vise à favoriser un front uni au sein du mouvement syndical, en espérant que les dirigeants de Narayanan pourraient aplanir les divergences idéologiques pour la cause commune de la libération de la Malaisie."
MLA.81.a.a: "Nos objectifs s'alignent : la libération totale de toutes les formes d'opprimés."
MLA.81.d.b: "Les autorités coloniales britanniques et les responsables de l'Union malaise sont de plus en plus alarmés par le changement soudain de stratégie politique du camarade Chin Peng. Abandonnant sa politique précédemment rigide de suprématie Han, Chin Peng a adopté une approche plus inclusive et pragmatique, signalant une évolution tactique dans la campagne du Parti communiste malais (MCP) contre la domination britannique. Ce changement est particulièrement préoccupant suite aux efforts de Chin Peng pour engager le leader syndicaliste influent P.P. Narayanan, anticommuniste bien connu et figure clé du mouvement syndical malaisien.\n\nEn tendant la main à Narayanan, Chin Peng vise à unir le mouvement syndicaliste et le MCP dans une lutte commune contre l'oppression coloniale. Il s'agit d'une tentative calculée d'élargir la base de soutien du MCP, en faisant appel à une main-d'oeuvre frustrée par les difficultés économiques de l'après-guerre et l'exploitation britannique. Les responsables britanniques et malais considèrent cette nouvelle tactique comme une menace sérieuse, car elle pourrait unifier des éléments anticoloniaux auparavant fragmentés, rendant la cause révolutionnaire du MCP plus attrayante pour divers secteurs de la société malaise, notamment les syndicats, les intellectuels et les populations rurales.\n\nLa branche secrète a averti que ce tournant pragmatique pourrait revigorer le MCP, augmentant ainsi sa capacité à déstabiliser le contrôle économique et politique britannique dans la région. En unissant syndicalistes et communistes sous la bannière commune de la solidarité ouvrière et de l'anticolonialisme, l'approche de Chin Peng est considérée comme un défi direct à l'emprise de l'Empire britannique sur la Malaisie. Ce changement soudain a suscité des inquiétudes quant à la croissance potentielle de l'influence du MCP parmi les mouvements non communistes, ajoutant ainsi de la complexité à un paysage politique déjà instable."
MLA.81.a.b: "NOUS DEVONS VRAIMENT GAGNER LE COEUR ET L'ESPRIT DES GENS !"
MLA.82.d: "Dans une démarche audacieuse visant à intensifier les activités révolutionnaires, notre grand camarade Chin Peng du Parti communiste malais a ordonné l'expansion du Min Yuen, la branche clandestine de soutien civil de notre Armée de libération nationale qui s'avère essentielle aux opérations de guérilla de notre Parti. L'expansion vise à recruter davantage de sympathisants locaux pour aider à la lutte armée, en fournissant des renseignements, de la nourriture et des fournitures aux branches armées. Le camarade Chin Peng a souligné l'importance d'approfondir la participation civile pour renforcer la résistance actuelle contre l'impérialisme britannique, affirmant que le Min Yuen est l'épine dorsale du mouvement de libération."

MLA.83.d: "Le camarade Chin Peng et la direction de notre Parti communiste malais (MCP) sont de plus en plus préoccupés par la montée rapide de la popularité du P.P. Narayanan et son mouvement syndicaliste au sein du Malayan Trades Union Congress (MTUC). Le message syndicaliste de Narayanan, qui met l'accent sur l'unité de classe et les droits du travail sans préjugés raciaux, a gagné en popularité parmi les travailleurs malais de toutes origines ethniques, en particulier à la lumière des tensions raciales non résolues au sein du MCP.\n\nMalgré les efforts du camarade Chin Peng pour mener une lutte anticoloniale unifiée, le parti pris de longue date du MCP en faveur du leadership et de la culture chinoise a aliéné de nombreux travailleurs et intellectuels non chinois, en particulier les Malais et les Indiens. Cela a permis au mouvement syndicaliste de Narayanan, qui promeut l'inclusion et la solidarité syndicale au-delà des divisions raciales, de gagner du terrain. L'approche du MTUC, ancrée dans l'équité et l'autonomisation des travailleurs, a trouvé un écho auprès d'une classe ouvrière de plus en plus désillusionnée, qui se sent marginalisée par l'accent mis par le MCP sur les travailleurs chinois et par sa négligence des questions raciales et économiques plus larges.\n\nLa capacité de Narayanan à rallier diverses communautés, en particulier dans les régions où l'influence du MCP est en déclin, constitue une menace importante pour la domination du Parti communiste sur les mouvements ouvriers malais. Chin Peng et d'autres dirigeants du MCP reconnaissent que le syndicalisme de Narayanan pourrait saper leur lutte révolutionnaire en siphonnant le soutien des secteurs clés du travail, affaiblissant ainsi leur capacité à se mobiliser au-delà des clivages ethniques. Le mécontentement croissant parmi les travailleurs non chinois, exacerbé par l'incapacité du MCP à s'attaquer de manière adéquate aux inégalités raciales, n'a fait qu'alimenter l'attrait de Narayanan. Le MCP débat actuellement de la manière de répondre à cette menace croissante, certains membres préconisant des politiques plus inclusives pour contrer l'appel syndicaliste de Narayanan."

#### Malayan Emergency News Events ####

MLA_OTL.0.t: "[GetNewspaperHeader]Assassinat du haut-commissaire Sir Henry Gurney"
MLA_OTL.0.d: "Lors d'un voyage de routine au nord de Kuala Lumpur, à Fraser's Hill, Pahang, le convoi du haut-commissaire malais Sir Henry Gurney a été pris en embuscade par 38 guérilleros du Parti communiste malais. Gurney, bien qu'il ait été blessé, est sorti de son véhicule pour protéger et éloigner les tirs de sa femme et de son secrétaire particulier. Les insurgés l'ont pris pour cible, blessant mortellement Gurney. Son convoi a été lourdement endommagé et son chauffeur a été tué. Après un bref échange de tirs, les guérilleros se sont retirés, laissant Lady Gurney découvrir le corps de son mari dans un fossé au bord de la route. Les renforts arrivent 20 minutes plus tard, mais il est trop tard. L'Armée communiste de libération nationale malaise et son chef Chin Peng ont revendiqué la responsabilité du dernier meurtre."

MLA_Victory.0.t: "[GetNewspaperHeader]La Grande-Bretagne évacue vers la ville de Singapour"
MLA_Victory.0.d: "Dans le cadre d'un développement important en Asie du Sud-Est, l'armée britannique et les forces armées malaises, dirigées par le maréchal Gerald Temple, se sont retirées à Singapour après la chute de Kuala Lumpur et du continent malais aux mains de l'Armée de libération malaise dirigée par le dirigeant communiste Chin Peng. Cette retraite marque un tournant critique dans l'urgence malaise, alors que les forces communistes prennent le contrôle de territoires clés. La chute de Kuala Lumpur a accru les inquiétudes quant à la stabilité de la région, Singapour servant désormais de dernier bastion des forces britanniques et du Commonwealth face à la victoire communiste grandissante. La situation reste tendue alors que les deux parties se préparent à la prochaine phase du conflit."
MLA_Victory.100.t: "[GetNewspaperHeader]Le gouvernement malais à Singapour"
MLA_Victory.100.d: "La perte de la Malaisie et le retrait du gouvernement malais à Singapour ont été un coup dur pour les Britanniques et leurs alliés occidentaux en Asie du Sud-Est, car cela signifie un nouvel effondrement du domino sur la Malaisie. De nombreux Malais avaient également fui leur foyer de Malaisie pour éviter la persécution des forces communistes et s'étaient entassés dans la ville de Singapour. L'afflux de Malais à Singapour a entraîné une montée des tensions ethniques entre les résidents malais et chinois et seul le temps nous dira si les communistes profiteront de ce chaos."
MLA_Victory.200.t: "[GetNewspaperHeader]Le Raj du Sarawak restauré !"
MLA_Victory.200.d: "Dans une démarche stratégique visant à contrer la menace croissante du communisme en Asie du Sud-Est après la chute de la Malaisie aux mains de l'Armée de libération malaisienne de Chin Peng, le Rajah blanc du Sarawak, Rajah Vyner Brooke de la dynastie Brooke, a rétabli le Dominion du Sarawak. Cette nouvelle entité politique, formée avec le parrainage du gouvernement britannique, vise à servir de moyen de dissuasion ultime contre la propagation du communisme dans la région.\n\nDans le cadre de cet effort, le maréchal Templer, qui a récemment fui Singapour, a été nommé premier chef d'état-major des Sarawak Rangers, la force militaire chargée de défendre le Sarawak contre d'éventuelles incursions communistes. Le rétablissement du Raj du Sarawak souligne l'engagement de l'Empire britannique à maintenir un pied en Asie du Sud-Est, dans un contexte d'instabilité croissante et de victoires communistes sur le continent malais."

MLA_PRC.0.t: "[GetNewspaperHeader]Chin Peng déclare l'Union de Nanyang"
MLA_PRC.0.d: "Après leur victoire décisive en Malaisie continentale, Chin Peng et le Parti communiste malais (MCP) ont officiellement déclaré leur allégeance inébranlable à Mao Zedong et au Parti communiste chinois (PCC). Dans une proclamation audacieuse, la déclaration de la renaissance de « l'Union de Nanyang », un concept ambitieux initialement proposé par le PCC dans les années 1920. Cela envisageait une Union socialiste en Asie du Sud-Est qui unirait les Chinois, les Malais et d'autres groupes ethniques sous un cadre communiste unique. Chin Peng a salué cela comme un modèle pour parvenir à une véritable unité révolutionnaire dans la région, déclarant que l'Union de Nanyang éradiquerait les influences coloniales et capitalistes, en les remplaçant par une société socialiste harmonieuse.\n\nL'alignement du MCP sur Pékin témoigne d'une intégration plus profonde de l'Asie du Sud-Est dans le bloc communiste plus large, suscitant des inquiétudes parmi les gouvernements voisins et les puissances occidentales quant à l'influence croissante de la Chine dans la région. Cette annonce a également intensifié les craintes de nouvelles insurrections communistes dans toute l'Asie du Sud-Est, en particulier dans les territoires encore sous contrôle colonial ou non communiste."

####MLA Power Struggle Event####
MLA_Power_Struggle.1.t: "Le camarade Chin Peng célèbre la victoire de Mao Zedong"
MLA_Power_Struggle.1.d: "Le camarade Chin Peng, chef de notre Parti communiste (PCM), a exprimé sa joie et sa satisfaction après avoir reçu la nouvelle de la victoire du camarade Mao Zedong sur les forces du Kuomintang (KMT) en 1949. Il a salué la libération de la Chine par Mao comme une confirmation claire que le tridémisme, autrefois défendu par Sun Yat-sen et Chiang Kai-shek, était désormais dépassé. Selon le camarade Chin Peng, le maoïsme s'est révélé être le « nouveau tridémisme » - une doctrine plus révolutionnaire et plus pratique pour libérer le prolétariat de l'oppression impérialiste et capitaliste.\n\nLe camarade Chin Peng a également révélé que le PCM n'avait jamais recherché de soutien extérieur auprès de la Chine ou de l'Union soviétique, et qu'aucun agent de ces pays n'avait pris contact avec eux. Le seul soutien qu'ils ont ressenti est venu sous la forme d'un encouragement moral, sachant que les guérilleros de Mao avaient réussi à vaincre les forces du KMT, plus nombreuses et bien équipées, de Chiang Kai-shek. Pour notre Parti, le triomphe de Mao a réaffirmé que la guérilla et les tactiques révolutionnaires maoïstes étaient l'avenir de la Malaisie et de l'Asie du Sud-Est, par opposition au tridémisme désormais obsolète et inefficace."
MLA_Power_Struggle.1.a: "Gloire au nouveau socialisme chinois ! Gloire au président Mao ! Gloire au président Chin !"
MLA_Power_Struggle.2.t: "Le camarade Chin Peng célèbre la victoire du camarade Chiang Kai-shek sur Mao"
MLA_Power_Struggle.2.d: "Le camarade Chin Peng, chef de notre Parti communiste (PCM), a exprimé sa joie en apprenant la nouvelle de la réunification de la Chine par le camarade Chiang Kai-shek et de sa victoire sur le Parti communiste de Mao Zedong. Pour le camarade Chin Peng, ce triomphe a confirmé l'échec du maoïsme et réaffirmé que le tridémisme du camarade Sun Yat-sen - mettant l'accent sur le nationalisme, la démocratie et le bien-être du peuple - a toujours été la véritable voie vers le socialisme chinois et le succès révolutionnaire.\n\nLe camarade Chin Peng a révélé que le PCM n'avait jamais recherché de soutien extérieur auprès de la Chine ou de l'Union soviétique, et que des agents de ces pays n'avaient pas non plus pris contact avec eux. Le seul encouragement que le PCM a reçu est venu de la nouvelle que les forces du Kuomintang (KMT) bien équipées et numériquement supérieures de Chiang avaient réussi à vaincre les communistes soutenus par les Soviétiques. Pour notre Parti, cette victoire symbolisait le rejet ultime de l'idéologie maoïste et la justification du tridemisme en tant que vision authentique et durable de la Chine et de son avenir socialiste."
MLA_Power_Struggle.2.a: "Vive le tridémisme ! Gloire au président Chiang ! Gloire au président Chin !"
MLA_Power_Struggle.3.t: "L'orientation chinoise du Parti"
MLA_Power_Struggle.3.d: "Le Comité central en [ROOT.Capital.GetName] a choisi une orientation chinoise, mais le parti reste divisé sur le programme qu'il devrait adopter. Les partisans maoïstes de Chin Peng proposent une république de Nanyang guidée par son interprétation de la guerre révolutionnaire. Leurs rivaux défendent les Trois principes du peuple de Sun Yat-sen, plaçant l'indépendance nationale, le gouvernement représentatif et les moyens de subsistance du peuple au centre de la politique du parti. Les deux courants acceptent le leadership de Chin Peng.\n\nLeur force dépend en partie des connexions politiques chinoises. L'influence de la RPC s'élève à §Y[?MLA_Main_Influence|0]%§!, tandis que l'influence du KMT s'élève à §Y[?MLA_Alt_Influence|0]%§!. Le programme maoïste reste disponible uniquement tant que l'influence du KMT est inférieure à §Y50%§!; les Tridemistes ont besoin d'au moins §Y30%§! pour garantir la prise en compte de leur programme.\n\nAdopter la ligne maoïste préparerait l'établissement de Nanyang sous la pensée Chin Peng. Le programme tridemiste engagerait plutôt le parti envers les Trois Principes et ses liens avec le Kuomintang. Le Comité central doit décider quelle doctrine régira son orientation chinoise."
MLA_Power_Struggle.3.a: "Adoptez la ligne maoïste. La pensée Chin Peng guidera Nanyang."
MLA_Power_Struggle.3.b: "Adoptez les trois principes. Nous suivrons le Soleil Blanc."
MLA_Power_Struggle.4.t: "Qui occupera la présidence ?"
MLA_Power_Struggle.4.d: "La décision de rechercher le soutien soviétique a amené le conflit de leadership entre Chin Peng et Shamsiah Fakeh devant le Comité central en [ROOT.Capital.GetName]. Les deux factions acceptent de coopérer avec Moscou, mais sont en désaccord sur la répartition de l'autorité au sein du parti et du gouvernement.\n\nLes partisans de Chin Peng défendent son leadership dans la lutte armée et sont favorables à un accord dans lequel Fakeh partagerait la responsabilité du gouvernement sous sa présidence. L'opposition de Fakeh cherche à le remplacer et à permettre un plus grand débat au sein du parti, arguant que la reconstruction nécessite une administration moins rigide.\n\nLa faction de Chin Peng détient §Y[?MLA_Main_Support|0]%§! de soutien, contre §Y[?MLA_Alt_Support|0]%§! pour l'opposition. Il ne peut conserver le fauteuil que tant que le soutien de l'opposition reste inférieur à §Y50%§!; Fakeh a besoin d'au moins §Y30%§! pour contester la direction. Le comité doit décider qui dirigera le gouvernement aligné sur les Soviétiques."
MLA_Power_Struggle.4.a: "Gardez Chin Peng sur la chaise ; Fakeh gouvernera avec lui."
MLA_Power_Struggle.4.b: "Donnez la chaise à Fakeh. Chin Peng doit se retirer."
MLA_Path_Maoist_tt: "Débloquez §YDéclarez la formation de Nanyang§! sous §Yle président Chin Peng§!. Le compléter établit §YPensée Chin Peng§!."
MLA_Path_Tridemist_tt: "Débloque §YSous le Soleil Blanc§! et le chemin des §YTrois Principes du Peuple§!."
MLA_Chin_Peng_Holds_tt: "§YChin Peng§! reste leader, avec §YShamsiah Fakeh§! co-dirigeant sous lui. Ouvre la branche §Yalignée sur les Soviétiques§!."
MLA_Fakeh_Leads_tt: "§YShamsiah Fakeh§! devient leader sous le communisme libéral §Y§!, mettant Chin Peng sur la touche. Ouvre la branche §Yalignée sur les Soviétiques§!."

####MLA KMT Alternate History Events####
MLA_KMT.1.t: "Le camarade Chin Peng annonce l'adoption massive du tridémisme"
MLA_KMT.1.d: "Récemment, avec la victoire du KMT contre l'Armée populaire de libération de Mao, le camarade Chin Peng commence à abandonner sa politique du marxisme pour se tourner vers la philosophie tridemiste du KMT. Considérant le KMT comme un exemple de mouvement révolutionnaire chinois, Chin Peng commence à introduire des politiques et des philosophies tridemistes dans son glorieux parti, telles que Minzu (nationalisme), Minquan (droits de gouvernance) et Minsheng (bien-être social). Alors que le virage du camarade Chin Peng vers le tridemisme a été favorisé par la communauté chinoise de Malaisie qui est familière avec la pensée tridemiste de Sun Yat-sen, cela s'accompagne de controverses car de nombreux marxistes radicaux qualifient cette démarche de révisionniste, de suprémaciste chinois et qualifient même le camarade Chin Peng lui-même d'opportuniste. Malgré ces critiques, le camarade Chin Peng reste ferme dans l'adoption du tridémisme, arguant qu'il est compatible avec le marxisme dans la mesure où Sun Yat-sen lui-même a été fortement influencé par le marxisme et que sa position sur le bien-être s'aligne sur l'objectif socialiste d'apporter la prospérité au peuple."
MLA_KMT.1.a: "Sanmin Zhuyi, notre objectif sera." #First part of the ROC anthem
MLA_KMT.2.t: "Construction du monument Sun Yat-sen"
MLA_KMT.2.d: "À l'occasion de l'anniversaire de la révolution Xinhai, le camarade Chin Peng a approuvé la construction et a même participé personnellement à la pose de la première pierre du monument Sun Yat-sen en [MLA.Capital.GetName] exactement comme le monument Sun Yat-sen à Nanjing. De plus, Chin Peng a également rebaptisé la glorieuse capitale de Singapour en Sun Yat-sen City en l'honneur du dévouement de Sun Yat-sen à établir des liens entre la communauté chinoise d'outre-mer. Alors que la communauté chinoise de Malaisie célèbre la reconnaissance par Chin Peng de la contribution de Sun à son objectif révolutionnaire, de nombreuses populations non chinoises, en particulier les Malais et les Indiens, déclarent que cela n'est qu'un des projets vaniteux du camarade Chin Peng. Néanmoins, la décision du camarade Chin Peng de changer le nom de la capitale et de construire le monument de Sun Yat-sen a suscité des curiosités et des remarques dans la presse étrangère, et le temps nous dira si le projet du camarade Chin Peng améliorera sa réputation."
MLA_KMT.2.a: "Fonder une terre libre, la paix mondiale, telle est notre position." #Second part of the ROC anthem
MLA_KMT.3.t: "Appliquer le tridémisme dans le parti"
MLA_KMT.3.d: "Dans un effort pour cimenter le tridémisme en Malaisie, le camarade Chin Peng a ordonné un décret rendant le tridémisme et son histoire obligatoires dans les écoles primaires, secondaires et universitaires, quelles que soient leurs affiliations. Cette décision bouleverse complètement les communautés non chinoises, car beaucoup y voient le début de l'effacement de leur culture. Récemment, dans la capitale [MLA.Capital.GetName], de nombreux Malais et Indiens ont éclaté dans des émeutes, ce qui a obligé la police et les forces militaires à les écraser brutalement, faisant de nombreux morts et d'autres encore fuyant le pays. Malgré les critiques nationales et internationales, le camarade Chin Peng reste impassible car il considère sa lutte comme similaire aux efforts de Sun pour unifier la Chine des seigneurs de la guerre et même du Mouvement du 4 Mai contre l'impérialisme."
MLA_KMT.3.a: "Allez-y, camarades, vous êtes des avant-gardes. Tenez bon votre objectif, Par le soleil et les étoiles." #Third and fourth part of the ROC anthem
MLA_KMT.4.t: "Parti communiste renommé Parti populaire malais"
MLA_KMT.4.d: "Pour souligner la transition d'un parti marxiste à un parti tridemiste plus grand, le camarade Chin Peng et le Congrès national de Malaisie ont approuvé la décision de changer le nom du parti de Parti communiste de Malaisie à Parti populaire malais. Alors que de nombreux tridemistes et fidèles aux causes du camarade Chin Peng ont applaudi cette décision, de nombreux partisans de la ligne dure commencent à quitter en masse la réunion et à se retirer du parti du camarade Chin Peng. Le camarade Chin Peng dénonce ceux qui ont quitté le parti comme étant peu dévoués à la cause révolutionnaire et il faudra compter sur eux."
MLA_KMT.4.a: "Soyez sérieux et courageux, votre pays à sauver." #Fifth part of the ROC anthem
MLA_KMT.5.t: "Appliquer la sinisation en Malaisie"
MLA_KMT.5.d: "Dans un effort pour unifier la nation, le camarade Chin Peng et le Congrès national de Malaisie ont adopté des lois concernant l'éducation à l'unité nationale, telles que les exigences relatives aux cours obligatoires de langue chinoise, d'histoire chinoise et de tridémisme dans les écoles, et l'application de l'usage du chinois dans tous les aspects de la vie, depuis les documents gouvernementaux, la radio, les journaux et même la musique, pour garantir une identité et une culture nationales Nanyang unifiées en Malaisie. Alors que de nombreux Chinois de Malaisie ont approuvé cette décision, de nombreux Malais et Indiens ont soit quitté le pays à l'étranger, soit commencé à prendre les armes dans le but de déclencher une insurrection en Malaisie contre le régime du camarade Chin Peng. Dans un effort pour apaiser les citoyens de Malaisie, le camarade Chin Peng dénonce ceux qui ont quitté le pays ou qui luttent contre sa nation comme des traîtres ingrats qui résistent à sa tentative d'unifier la nation de Nanyang."
MLA_KMT.5.a: "Un coeur, une âme, un esprit, un objectif." #Last part of the ROC Anthem
MLA_KMT.100.t: "[GetNewspaperHeader]Chin Peng s'aligne sur Nankin"
MLA_KMT.100.d: "Récemment, avec la victoire du gouvernement du KMT contre l'Armée populaire de libération de Mao en Chine, Chin Peng a décidé de s'orienter vers une approche tridemiste de gouvernement de la Malaisie. Dans un effort pour faire appel au [CHI.GetNameDef], Chin Peng décide d'adopter le tridémisme comme philosophie politique et a même envoyé une délégation pour féliciter la victoire du KMT dans la guerre civile chinoise dans le but d'obtenir une reconnaissance internationale. Seul le temps nous dira si le virage de Chin Peng vers Nankin portera ses fruits à long terme."
MLA_KMT.100.a: "Hein, Soleil Blanc au-dessus de la Malaisie ?"

#MLA Boestamam Events
MLA_Boestamam.1.t: "Le camarade Ahmad Boestamam prend la direction contre Chin Peng"
MLA_Boestamam.1.d: "Le camarade Ahmad Boestamam, inspiré par les idéaux révolutionnaires de Sukarno et la lutte anticoloniale en Indonésie, a mené un coup d'État au sein du Parti communiste de Malaisie pour s'opposer à ce qu'il considérait comme le faux marxisme matérialiste génocidaire sino-suprémaciste de Chin Peng. Rejetant le marxisme sans âme et sans culture dominé par la Chine et prôné par le Parti communiste malais (MCP), Boestamam a embrassé un marhaenisme pan-malais/indonésien - une forme de marxisme révolutionnaire axé sur l'unification de l'Indonésie et de la Malaisie, aligné sur les luttes de la classe ouvrière des peuples malais et indonésien. Son leadership visait à créer un avenir socialiste enraciné dans les valeurs culturelles malaises et la libération du colonialisme, le plaçant en contraste frappant avec la vision de Chin Peng de la domination suprémaciste Han. La poussée de Boestamam en faveur d'un marxisme révolutionnaire centré sur le Malais cherchait à redéfinir la voie de l'indépendance malaise, en rejetant l'influence étrangère et en plaçant l'identité malaise au centre du mouvement de libération."
MLA_Boestamam.1.a: "Malais et prolétaires indo de tous les royaumes, unissez-vous !"
MLA_Boestamam.2.t: "Adoption massive du marhaenisme"
MLA_Boestamam.2.d: "Ahmad Boestamam, nationaliste incendiaire et ancien dirigeant du Parti Rakyat, est devenu le nouveau chef du Parti communiste malais après la chute de Chin Peng. Contrairement à son prédécesseur, qui adhérait strictement à la doctrine maoïste, Boestamam a emprunté une voie différente - en adoptant le marhaenisme, le cadre idéologique de la révolution indonésienne de Sukarno.\n\nLe marhaenisme, qui met l'accent sur l'unité nationale, l'économie collectiviste et la lutte contre l'impérialisme, a trouvé un terrain fertile parmi les paysans et les ouvriers de Malaisie. Rejetant la lutte de classes rigide, Boestamam a rebaptisé le Parti communiste un mouvement populaire plutôt qu'une avant-garde de la révolution prolétarienne. Sa vision séduit non seulement les nationalistes malais mais aussi le front anticolonial plus large, car il mélange le socialisme radical avec les traditions indigènes et la justice sociale islamique.\n\nAvec ce changement idéologique, la lutte contre la domination britannique prend un nouveau caractère. Les autorités coloniales font désormais face à un ennemi non seulement inspiré par Pékin mais enraciné dans les propres traditions révolutionnaires de Nusantara. Pendant ce temps, les tensions montent au sein du parti : certains maoïstes radicaux dénoncent le révisionnisme de Boestamam, tandis que d'autres voient le marhaenisme comme la clé pour élargir l'attrait du mouvement.\n\nLe vent de la révolution tourne. Comment le monde va-t-il réagir à la nouvelle orientation de Boestamam ?"
MLA_Boestamam.2.a: "C'est la naissance d'un véritable socialisme malais !"
MLA_Boestamam.3.t: "L'appel à l'unité de Nusantara"
MLA_Boestamam.3.d: "Le camarade président Ahmad Boestamam, désormais fermement aux commandes du Parti communiste malais (rebaptisé Parti Marhaen Malaya), a fait une déclaration historique - appelant à la réunification de la Malaisie avec l'Indonésie sous la direction de Sukarno. Déclarant que « l'Indonésie et la Malaisie forment un seul peuple divisé par des frontières coloniales », Boestamam affirme que la véritable indépendance ne peut être obtenue que par l'unité contre les impérialistes étrangers.\n\nCitant le marhaenisme comme colonne vertébrale idéologique de ce mouvement, le président envisage un Negara Marhaen Raya socialiste - un grand État Nusantara qui fusionne le nationalisme révolutionnaire malais et indonésien. Il fait directement appel à Sukarno, l'exhortant à soutenir la cause, tout en mobilisant des cellules clandestines à travers la péninsule malaise.\n\nLa proposition suscite des réactions immédiates. A Jakarta, Sukarno, longtemps partisan de Ganyang Malaysia, voit une opportunité potentielle d'étendre l'influence révolutionnaire de l'Indonésie. Pendant ce temps, les autorités coloniales britanniques en Malaisie tirent la sonnette d'alarme, craignant la montée d'une insurrection soutenue par l'Indonésie. Même au sein des factions nationalistes de Malaisie, les opinions sont divisées : certains saluent la vision d'un Nusantara uni, tandis que d'autres rejettent ce qu'ils considèrent comme l'assujettissement de la Malaisie à Jakarta.\n\nLe sort de la Malaisie est désormais en jeu. Cette vision d'unité se réalisera-t-elle ou brisera-t-elle le mouvement révolutionnaire ?"
MLA_Boestamam.3.a: "Pour la révolution du Grand Nusantara !"
MLA_Boestamam.4.t: "Vers un Nusantara uni"
MLA_Boestamam.4.d: "Le moment est venu de franchir une nouvelle étape dans la lutte révolutionnaire. Sous la ferme direction du camarade président Ahmad Boestamam, le Parti Marhaen Malaya (PMM) a déclaré que l'avenir de la Malaisie ne réside pas entre les mains de marionnettes coloniales, mais dans l'unité avec l'Indonésie - le grand phare du socialisme marhaeniste sous le président Sukarno.\n\nS'exprimant devant un rassemblement de cadres du parti, Boestamam expose sa vision : « L'Indonésie et la Malaisie ne sont pas des nations séparées. Nous sommes un seul peuple - un Nusantara - divisé par des frontières artificielles imposées par les impérialistes. Il est de notre devoir en tant que marhaenistes et révolutionnaires de réunifier notre patrie ! La salle éclate sous un tonnerre d'applaudissements.\n\nAvec cette déclaration, le PMM commence à jeter les bases de la réunification. Les militants du parti s'empressent d'établir des cellules clandestines, d'organiser des grèves et de mobiliser les travailleurs pour rejeter la domination britannique. Les conseils de village, les syndicats paysans et les groupes nationalistes de gauche sont intégrés au mouvement, tandis que des agents indonésiens prennent discrètement contact avec les dirigeants du PMM.\n\nPendant ce temps, Boestamam tend la main à Jakarta, appelant le président Sukarno à soutenir la révolution malaise et à faciliter l'intégration dans un État marhaeniste uni. Les journaux indonésiens parlent avec enthousiasme de « la libération inévitable de la Malaisie », tandis que les gauchistes malais murmurent que l'heure d'une révolte ouverte est proche.\n\nLes autorités coloniales ne restent cependant pas aveugles à cette menace grandissante. Les rapports des services de renseignement britanniques préviennent que PMM est en train de devenir un canal direct de l'influence indonésienne en Malaisie, alimentant les spéculations selon lesquelles un soulèvement armé pourrait être imminent. Les modérés malais au sein de l'UMNO et du MIC craignent que la poussée radicale du PMM en faveur de l'unification n'entraîne des effusions de sang et des troubles.\n\nLe décor est planté pour que l'histoire soit écrite. La question n'est pas de savoir si la réunification est possible, mais quand et comment elle sera réalisée."
MLA_Boestamam.4.a: "En avant la révolution marhaeniste !"
MLA_Boestamam.5.t: "Honorer la lutte, préparer la victoire"
MLA_Boestamam.5.d: "Devant une mer de banderoles rouges, le président Ahmad Boestamam se tient à la tribune, sa voix portant le poids de l'histoire. \"Nous ne sommes pas les premiers à lutter pour la libération de notre peuple. Nous suivons le chemin tracé par ceux qui nous ont précédés - ceux qui ont défié les impérialistes, qui ont saigné pour la liberté de la Malaisie. Leur lutte n'a peut-être pas réussi en leur temps, mais nous veillerons à ce qu'elle ne soit pas vaine.\"\n\nLa salle éclate sous les applaudissements tandis que les cadres du PMM, les syndicalistes et les dirigeants paysans rendent hommage aux héros du passé. Le Partai Kebangsaan Melayu Malaya (PKMM), qui s'est opposé à l'oppression coloniale, le Kesatuan Melayu Muda (KMM), qui a le premier osé rêver d'indépendance malaise, et le mouvement Azad Hind du camarade Netaji Subhas Chandra Bose, qui a rallié les Asiatiques contre la tyrannie britannique, sont tous honorés.\n\nBoestamam, qui s'est autrefois rebaptisé Netaji en admiration pour le défi révolutionnaire de l'Azad Hind, dirige une minute de silence pour ses camarades tombés au combat. \"Le camarade Bose s'est battu non seulement pour l'Inde, mais pour la libération de tous les peuples opprimés de l'Est. L'armée Azad Hind s'est tenue aux côtés des Malais, des Indiens et des Indonésiens contre le régime colonial. Il est de notre devoir d'achever ce qu'ils ont commencé.\"\n\nLe PMM publie une nouvelle déclaration : l'héritage du PKMM, du KMM et d'Azad Hind perdurera dans leur lutte. \"Ils sont tombés parce qu'ils étaient en avance sur leur temps. Nous ne répéterons pas leurs erreurs. Nous allons apprendre d'eux, nous organiser et nous battre jusqu'à ce que la victoire soit nôtre.\"\n\nPartout en Malaisie, des militants de gauche ont diffusé le message. Les villages voient de nouvelles peintures murales de Bose, des dirigeants du PKMM et des révolutionnaires du KMM, ainsi que des slogans appelant à la fin de la domination britannique. Les journaux indonésiens saluent le discours de Boestamam, tandis que les services de renseignement britanniques le remarquent : la rhétorique du PMM est de plus en plus audacieuse et ses appels à la révolution plus urgents."
MLA_Boestamam.5.a: "Leur lutte ratée nous guidera vers la victoire !"
MLA_Boestamam.6.t: "Adoption de Pancasilla"
MLA_Boestamam.6.d: "Au coeur du congrès du Parti Marhaen Malaya (PMM), des banderoles rouges et dorées flottent dans l'air humide. Le camarade Ahmad Boestamam se tient devant l'assemblée des révolutionnaires, des syndicalistes et des dirigeants paysans, une lueur déterminée dans les yeux. Le mouvement a atteint un tournant. Les idéaux du marhaenisme ont guidé leur lutte, mais pour parvenir à une véritable libération, un nouveau cadre est nécessaire pour l'esprit de la révolution pan-malaise.\n\n\"Nous ne luttons pas seulement pour l'indépendance, nous luttons pour l'âme de notre peuple\", déclare Boestamam. « Le capitalisme colonial a réduit nos travailleurs à de simples outils, nos paysans à des vagabonds sans terre, nos communautés à des ombres fracturées de ce qu'elles étaient autrefois. Nous devons adopter une nouvelle fondation, une fondation qui purge le poison du matérialisme et de l'avidité et la remplace par la solidarité, la justice et l'esprit du peuple.\n\nLa Pascicalla - une fusion de collectivisme spirituel, de justice économique et de solidarité révolutionnaire - est proclamée comme l'idéologie directrice du PMM. S'appuyant sur les enseignements du marhaenisme, du personnalisme travailliste et du nationalisme anti-impérialiste, Pascicalla envisage un avenir où le peuple, le Rakyat Marhaen, récupère son destin à travers une lutte unifiée. Il rejette à la fois l'exploitation capitaliste et les impositions idéologiques étrangères, mettant l'accent sur un socialisme révolutionnaire indigène construit sur les traditions locales, la solidarité communautaire et la morale des travailleurs.\n\nLa direction du PMM vote à l'unanimité l'adoption de Pascicalla comme fondement idéologique. Les journaux du parti ont diffusé le message à travers la Malaisie, le proclamant comme « la véritable voie vers la liberté, une voie qui ne sert ni le libéralisme occidental ni la dictature orientale, mais le seul peuple Marhaen ». Les révolutionnaires indonésiens en ont pris note, certaines factions du Partai Nasional Indonesia (PNI) et des communistes indonésiens ayant salué l'initiative de Boestamam."
MLA_Boestamam.6.a: "Pascicalla guidera notre lutte vers la victoire finale !"
MLA_Boestamam.7.t: "L'appel de Boestamam à la réunification"
MLA_Boestamam.7.d: "Un message est arrivé du camarade président Ahmad Boestamam du Parti Marhaen Malaya (PMM), demandant officiellement la réunification de la Malaisie avec l'Indonésie sous la bannière du marhaenisme et de l'anti-impérialisme. Dans son appel, Boestamam soutient que la division du monde malais est une création artificielle des oppresseurs coloniaux et que la véritable indépendance ne peut être obtenue que par l'unification de tous les peuples Marhaen sous un seul État révolutionnaire.\n\nLe président Soekarno parle depuis longtemps du rêve de Melayu Raya : une Indonésie et une Malaisie unifiées, unies comme une force puissante contre l'impérialisme occidental. Cependant, accepter cette proposition entraînerait l'Indonésie dans une confrontation directe avec l'État de Malaisie soutenu par les Britanniques, au risque de conséquences économiques et militaires. D'un autre côté, rejeter l'appel de Boestamam pourrait être considéré comme une trahison de la solidarité pan-malaise et affaiblir l'influence de l'Indonésie dans la région.\n\nFace à la montée des tensions en Asie du Sud-Est, le gouvernement indonésien doit décider : va-t-il suivre l'appel de Boestamam et promouvoir l'unification, ou bien maintenir sa position actuelle et éviter un conflit direct avec les puissances occidentales ?"
MLA_Boestamam.7.a: "L'esprit de révolution ne connaît pas de frontières - Melayu Raya doit être réalisé !"
MLA_Boestamam.7.b: "L'heure de la réunification n'est pas maintenant, camarade..."
MLA_Boestamam.100.t: "[GetNewspaperHeader]Fondation de l'Union socialiste de Malaisie"
MLA_Boestamam.100.d: "Dans une tournure historique des événements, Ahmad Boestamam a mené avec succès un coup d'État au sein du Parti communiste de Malaisie, renversant la direction de Chin Peng et déclarant la création de l'Union socialiste de Malaisie. Inspiré par les idéaux révolutionnaires de Sukarno et la lutte anticoloniale en Indonésie, Boestamam a rejeté avec véhémence ce qu'il a condamné comme le génocide, la suprématie chinoise et le faux marxisme matérialiste de Chin Peng.\n\nLa vision de Boestamam du marhaenisme pan-malais/indonésien, un marxisme révolutionnaire axé sur les luttes ouvrières des peuples malais et indonésien, constitue désormais le noyau de ce nouvel État socialiste. L'Union socialiste de Malaisie vise à unifier l'Indonésie et la Malaisie, Boestamam plaidant pour un avenir socialiste enraciné dans les valeurs culturelles malaises, la libération du colonialisme et la résistance à la domination suprémaciste Han. Cette décision marque un rejet décisif des influences étrangères, en particulier du marxisme maoïste sino-centrique que Chin Peng défendait autrefois.\n\nL'Union socialiste de Malaisie s'engage à placer l'identité malaise et la lutte collective du prolétariat indo-malais à l'avant-garde du mouvement indépendantiste. La nouvelle direction appelle les travailleurs de tous les domaines en scandant :"
MLA_Boestamam.100.a: "Malais et prolétaires indo de tous les royaumes, unissez-vous !"

#MLA Syndicalist Events
MLA_Syndies.1.t: "Félicitations pour la récente victoire du camarade président Narayanan"
MLA_Syndies.1.d: "Dans une tournure étonnante des événements, nos courageux travailleurs et révolutionnaires de toute la Malaisie continentale ont exprimé leur soutien et leur joie généralisés alors que le camarade président P.P. Narayanan et le Conseil révolutionnaire des syndicats malais (MTUC) ont réussi à prendre le contrôle du Parti communiste malais (MCP) réactionnaire du tyran chinois Chin Peng. Beaucoup ont salué ce changement comme une victoire d'une véritable solidarité révolutionnaire et la fin des tensions raciales et de classe qui avaient tourmenté le parti sous l'État en faillite de Chin Peng. Avec les valeurs syndicalistes plus révolutionnaires et plus correctes qui guident désormais le MCP renaissant, le mouvement promet de se concentrer sur l'unité au-delà des clivages ethniques et sociaux, représentant directement les diverses classes ouvrières et secteurs qualifiés de Malaisie. Un sentiment d'optimisme renouvelé s'est répandu parmi tous nos camarades et cercles ouvriers, avec l'espoir que le syndicalisme favoriserait une voie révolutionnaire juste et inclusive fondée sur le respect mutuel et l'égalité."
MLA_Syndies.1.a: "La lutte de toutes les races ouvrières asservies en Malaisie sera victorieuse grâce aux visions du nouveau camarade président Narayanan"
MLA_Syndies.2.t: "Le corps de Chin Peng découvert"
MLA_Syndies.2.d: "Dans une sombre tournure des événements, le corps mutilé en décomposition du leader communiste malais Chin Peng a été découvert dans une rue étroite de Wu-wei-gang. Des rapports indiquent que Chin Peng a été lynché par une foule après son évasion ratée de l'ancien palais du gouverneur, aujourd'hui rebaptisé palais du peuple. Sa tentative de fuite a marqué le dernier chapitre d'une période d'intenses troubles politiques, alors que ses dirigeants étaient confrontés à une opposition importante et à des troubles croissants. La vérification de son corps sur la base de ses dossiers dentaires a provoqué une onde de choc dans la région, mettant en évidence les profondes divisions et la résistance à son règne controversé et au nouveau régime dirigé par Narayanan."
MLA_Syndies.2.a: " A bientôt, Robertspierre..."
MLA_Syndies.3.t: "Collaboration avec Shamsiah Fakeh"
MLA_Syndies.3.d: "Pour éviter de nouveaux conflits entre factions, le camarade président P.P. Narayanan du Conseil des syndicats malais (MTUC) et le camarade Shamsiah Fakeh, leader communiste influent, ont annoncé une alliance révolutionnaire. Cette collaboration vise à fusionner des éléments du marxisme avec les principes syndicalistes, créant ainsi un cadre révolutionnaire unifié pour la Malaisie communiste. Les deux camarades ont convenu d'aller au-delà des concepts qui divisent comme la lutte des classes et la dictature du prolétariat, en plaidant plutôt en faveur d'un « Collectif de Syndicaux ». Ce modèle représente directement les métiers et professions spécialisés de la classe ouvrière, garantissant que tous les syndicats partagent un pouvoir et des ressources égales.\n\nLes camarades Shamsiah et Narayanan ont mis l'accent sur les enseignements révolutionnaires tels que le matérialisme dialectique, la propriété commune et l'égalité dans la production. L'alliance considère cette nouvelle voie comme un moyen d'éviter les conflits internes et de canaliser l'esprit révolutionnaire vers un avenir coopératif. En mêlant l'idéologie communiste aux pratiques syndicalistes, ils cherchent à construire une société malaise stable et inclusive, attachée aux valeurs de solidarité et d'égalité."
MLA_Syndies.3.a: "La libération des classes populaires peut redémarrer !"
MLA_Syndies.4.t: "Formation de la Confédération pan-malaisienne du parti travailliste"
MLA_Syndies.4.d: "Dans le cadre d'une percée révolutionnaire, le Conseil des syndicats malais (MTUC) et le Parti communiste malais se sont unis sous la bannière de la nouvelle Confédération pan-malaisienne du parti travailliste. Cette alliance monumentale fusionne les principes enflammés du marxisme avec les idéaux solidaires du syndicalisme, annonçant une nouvelle ère de lutte révolutionnaire et d'autonomisation des travailleurs en Malaisie.\n\nDans le cadre de cette glorieuse unification, le Conseil syndicaliste malais servira désormais d'organe directeur suprême et de cerveau collectif de l'Union des syndicats de Malaisie. Ce conseil, dirigé par des camarades de tous les secteurs, incarnera les voix des travailleurs de tous les métiers et professions, formant une véritable avant-garde de la classe ouvrière pour diriger la marche du peuple vers la libération.\n\nCamarade président P.P. Narayanan et le camarade Shamsiah Fakeh ont appelé tous les travailleurs, agriculteurs et camarades à s'unir sous cette noble cause, alors que le parti nouvellement unifié rejette les chaînes de division de la lutte des classes et la dictature étroite du prolétariat. Au lieu de cela, ils défendent une vision d'égalité à travers la représentation syndicale, le matérialisme dialectique et la propriété communautaire de la production. Selon les mots du camarade Shamsiah : « La libération de la classe ouvrière a de nouveau augmenté ! »\n\nCette formation de la Confédération panmalaisienne du parti travailliste marque l'aube d'une Malaisie animée par la solidarité, l'égalité et l'unité. Ensemble, les camarades de Malaisie marchent en avant, incarnant les idéaux du prolétariat, alors qu'ils construisent un avenir fondé sur la coopération, la révolution et un dévouement indéfectible aux masses travailleuses."
MLA_Syndies.4.a: "Solidarité pour toujours ! En tant que collectif révolutionnaire indivisible !! "
MLA_Syndies.5.t: "Mettre en oeuvre des politiques progressistes en Malaisie"
MLA_Syndies.5.d: "Camarades Shamsiah Fakeh et P.P. Narayanan a annoncé la mise en oeuvre de politiques féministes progressistes dans le cadre de son alliance révolutionnaire en Malaisie. Combinant les idéaux marxistes et syndicalistes, ils se sont engagés à faire de l'égalité des sexes un objectif central de leur modèle de Collectif des Syndicaux.\n\nShamsiah, féministe et combattante de la liberté, a souligné l'importance de l'autonomisation des femmes dans la libération de la Malaisie. Elle a plaidé pour une représentation égale au leadership, l'égalité salariale, l'accès à l'éducation, les droits à la maternité et les programmes de lutte contre le harcèlement au travail.\n\nNarayanan a salué les efforts de Shamsiah, affirmant que la révolution doit démanteler à la fois l'oppression de classe et la domination patriarcale. Leur vision commune vise à créer une société inclusive et égalitaire qui garantisse la participation active des femmes à la transformation sociale et économique de la Malaisie."
MLA_Syndies.5.a: "La première étape pour garantir une égalité totale."
MLA_Syndies.100.d: "Dans un geste inattendu, P.P. Narayanan et le Conseil des syndicats malais (MTUC) ont mené une prise de pouvoir syndicaliste par la violence contre le Parti communiste malais (MCP) de Chin Peng. Le coup d'État fait suite à la rupture de l'alliance entre Narayanan et Chin Peng, déclenchée par l'échec de Chin Peng à freiner les tendances suprémacistes Han et les préjugés racistes dans les rangs du parti. Narayanan, un éminent leader syndicaliste et défenseur de la solidarité ouvrière au-delà des frontières ethniques, a rallié le soutien au sein du MCP auprès de membres désillusionnés, de plus en plus frustrés par les disparités raciales et les politiques de division sous la direction de Chin Peng.\n\nSous la nouvelle direction de Narayanan, la faction dirigée par le MTUC a annoncé une réforme du MCP en un mouvement syndicaliste, promouvant une vision d'égalité et de gouvernance dirigée par les travailleurs qui transcende les divisions raciales. Narayanan a promis que ce MCP syndicaliste s'engagerait à favoriser l'unité entre tous les groupes ethniques de Malaisie, en se concentrant sur les droits des travailleurs de base et en établissant une société socialiste non sectaire et exempte de discrimination raciale. Cette transformation marque un changement significatif dans le paysage politique de la Malaisie, modifiant potentiellement l'équilibre des pouvoirs alors que les idéaux syndicalistes révolutionnaires remplacent l'agenda précédemment aligné sur les maoïstes du MCP."

