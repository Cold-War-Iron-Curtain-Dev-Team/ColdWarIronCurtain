MLA_guerrilla_economy: "Économie de guérilla"
MLA_guerrilla_economy_desc: "Le MNLA est un mouvement armé clandestin soutenu par des réseaux villageois, des magasins capturés et une assistance clandestine - et non un trésor public conventionnel."
MLA_jungle_reorganization: "Réorganisation dans la jungle"
MLA_jungle_reorganization_desc: "La retraite vers l'intérieur a temporairement perturbé les communications et les mouvements pendant que les colonnes de guérilla établissent de nouveaux camps."
MLA_prepared_operation: "Opération de guérilla préparée"
MLA_prepared_operation_desc: "Des éclaireurs, des caches de ravitaillement et des voies d'évacuation ont été préparés pour l'engagement à venir."
MLA_operation_exhaustion: "Colonnes de guérilla épuisées"
MLA_operation_exhaustion_desc: "Les récentes pertes ont contraint le MNLA à se disperser, à remplacer ses équipements et à reconstruire ses réseaux locaux."
MLA_general_uprising_idea: "Le soulèvement général"
MLA_general_uprising_idea_desc: "Dix ans d'embuscades sont devenus une guerre de mouvement. Les colonnes sont sorties de la jungle, les réseaux villageois alimentent une armée au lieu d'une bande de guérilla, et chaque État libéré lève des régiments plus vite qu'il ne peut être armé."
MLA_encirclement: "Encerclé dans la jungle"
MLA_encirclement_desc: "L'Armée de la Fédération a fermé le ring. Les cellules dans les villages sont regroupées, les pistes de ravitaillement sont coupées et ce qui reste du MNLA est broyé à Pahang sans aucun endroit où se disperser."
MLA_mobile_guerrilla_doctrine: "Doctrine de guérilla mobile"
MLA_mobile_guerrilla_doctrine_desc: "De petites colonnes mobiles éviteront une confrontation décisive et frapperont là où le contrôle du gouvernement est le plus faible."
MLA_mass_support_network: "Réseau de soutien de masse"
MLA_mass_support_network_desc: "L'organisation politique parmi les travailleurs, les villageois, les femmes et les communautés minoritaires soutient le recrutement et la collecte de renseignements."
MLA_expanded_mass_support_network: "Réseau de soutien de masse étendu"
MLA_expanded_mass_support_network_desc: "La doctrine de la vague humaine transforme chaque village sympathique en station de recrutement. Les effectifs affluent dans les colonnes plus rapidement que les Britanniques ne peuvent les couper."

MLA_Mobilize_Min_Yuen: "Mobiliser le Min Yuen"
MLA_Mobilize_Min_Yuen_desc: "Faites appel à l'organisation de soutien civil pour les recrues, les guides, la nourriture et les armes dissimulées."
MLA_Repair_Captured_Weapons: "Réparer les armes capturées"
MLA_Repair_Captured_Weapons_desc: "Les ateliers dispersés peuvent remettre en service les fusils endommagés et capturés."
MLA_Reorganize_Guerrilla_Columns: "Réorganiser les colonnes de guérilla"
MLA_Reorganize_Guerrilla_Columns_desc: "Retirez les formations épuisées, remplacez leurs pertes et préparez-les à de nouvelles opérations."
MLA_Expand_Rural_Support: "Élargir le soutien rural"
MLA_Expand_Rural_Support_desc: "Les cadres politiques renforceront les comités villageois et élargiront le réseau d'approvisionnement et de renseignement de l'insurrection."
MLA_Expand_Jungle_Farms: "Développez les fermes de la jungle"
MLA_Expand_Jungle_Farms_desc: "Les fermes cachées et les parcelles coopératives rendront les bases de guérilla moins dépendantes des voies d'approvisionnement extérieures vulnérables."
MLA_Request_Clandestine_Foreign_Aid: "Demander une aide étrangère clandestine"
MLA_Request_Clandestine_Foreign_Aid_desc: "Les gouvernements socialistes amis peuvent déplacer des armes et des volontaires par des voies interdites."

#### The General Uprising ####
MLA_Victory.20.t: "Le soulèvement général"
MLA_Victory.20.d: "A l'aube, la proclamation du Comité central fut diffusée sur tous les émetteurs clandestins de la péninsule. La République populaire malaise est déclarée. De Pahang à Kelantan, les colonnes sortirent de la jungle en plein jour pour la première fois depuis dix ans - non pas pour tendre une embuscade à un convoi, mais pour prendre et tenir le terrain.\n\nLa Fédération dispose d'une armée de policiers et d'un gouvernement qui vient de se découvrir seul. Nous avons une campagne qui nous a nourris pendant une décennie et qui n'a plus rien à perdre.\n\nL'urgence est terminée. La guerre a commencé."
MLA_Victory.20.a: "En avant pour Kuala Lumpur !"

MLA_Victory.21.t: "Une affaire malaise"
MLA_Victory.21.d: "Le Cabinet s'est réuni toute la nuit. Le calcul n'était pas compliqué : un déploiement complet pour tenir la péninsule coûterait plus cher que le retour de la péninsule, à un moment où le Trésor public ne peut se permettre ni l'un ni l'autre.\n\nLa garantie à la Fédération ne sera pas honorée. Le Commandement Est se repliera sur Singapour et tiendra la base, ce à quoi la base a toujours été destinée. Le Tunku a été informé par télégramme.\n\nOn dira, avec le temps, que nous les avons abandonnés. Ce sera vrai."
MLA_Victory.21.a: "Retirez-vous à Singapour."

MLA_Victory.22.t: "[GetNewspaperHeader]Le soulèvement communiste ravage la Malaisie"
MLA_Victory.22.d: "L'Armée de libération nationale malaise a abandonné la guérilla le [GetDateText], faisant sortir ses colonnes de la jungle en plein jour pour proclamer une République populaire malaise depuis l'intérieur de Pahang. Les postes de police de la Fédération à Perak, Kelantan et Terengganu ont été envahis en quelques heures, et Kuala Lumpur a confirmé que plusieurs districts ne sont plus sous le contrôle du gouvernement. Whitehall annonce le soir même que la garantie accordée à la Fédération ne sera pas honorée et que le commandement oriental se repliera sur la base de Singapour.\n\nL'état d'urgence a été déclaré en juin 1948 après le meurtre de trois planteurs européens à Sungai Siput, et a été combattu depuis comme une action policière de couvre-feu, de cartes d'identité et de réinstallation d'un demi-million de squatters dans de nouveaux villages gardés dans le cadre du plan Briggs. L'armée de Chin Peng a été chassée de la plaine côtière et dans la jungle profonde, mais elle n'y a jamais été détruite, et le réseau d'approvisionnement de Min Yuen a survécu à chaque balayage lancé contre elle.\n\nL'armée de la Fédération a été construite et entraînée pour chasser de petits groupes dans des contrées denses, et fait désormais face à une offensive conventionnelle sans son principal allié. Les commentateurs britanniques décrivent le retrait comme une reconnaissance du fait que la péninsule coûte plus cher à conserver qu'à en rapporter. Les critiques à Kuala Lumpur comme à la Chambre des Communes qualifient cela d'abandon et notent que la base que le Cabinet a l'intention de conserver se trouve désormais au bout d'une chaussée hostile."
MLA_Victory.22.a: "Un deuxième front s'ouvre en Asie du Sud-Est."
MLA_Victory.22.b: "Un autre domino vacille."

MLA_Victory.23.t: "Opération Sledgehammer"
MLA_Victory.23.d: "Pendant une décennie, nous avons mené cette guerre avec une main liée : réglementations d'urgence, couvre-feux, réinstallation et travail patient et sans fin pour séparer le terroriste du villageois. Ce travail est terminé. Il n'y a plus de Min Yuen à séparer.\n\nCe qui reste, ce sont quelques milliers d'hommes armés dans la jungle de Pahang, sans nourriture, sans recrues et sans frontière vers laquelle fuir pour les arrêter. L'armée de la Fédération entre pour l'achever."
MLA_Victory.23.a: "Finissez-en."

MLA_Victory.24.t: "[GetNewspaperHeader]La Malaisie lance l'offensive finale contre les insurgés communistes"
MLA_Victory.24.d: "La Fédération de Malaisie a déclaré la guerre ouverte à l'Armée de libération nationale malaise le [GetDateText], mettant de côté les règlements d'urgence en vertu desquels le conflit se déroule depuis 1948 au profit d'une campagne conventionnelle d'encerclement dans l'intérieur de Pahang. Les bataillons de la Fédération se sont déplacés en force vers la lisière de la jungle, et Kuala Lumpur a déclaré clairement qu'elle cherchait à détruire plutôt qu'à rendre les formations communistes survivantes.\n\nCe changement de méthode fait suite à l'effondrement de la base civile de l'insurrection. Le plan Briggs a éloigné la population de squatters de la lisière de la jungle et l'a dirigée vers de nouveaux villages gardés, le contrôle alimentaire a coupé les passeurs des cultivateurs et le réseau Min Yuen qui alimentait et recrutait autrefois les colonnes a cessé de fonctionner. Ce qui reste, selon les propres estimations de la Fédération, ce sont quelques milliers d'hommes armés sans ravitaillement, sans recrues et sans frontière vers laquelle se diriger pour les capturer.\n\nLes observateurs s'attendent à ce que l'opération soit brève. Cette mesure n'est pas bien accueillie partout : les officiers qui ont passé une décennie à séparer les terroristes des villageois affirment qu'une campagne de reddition coûterait moins de vies aux Malaisiens qu'un cordon dans les sources de Pahang, et Bangkok a déjà fait connaître son mécontentement face à la perspective de cadres armés traversant les provinces du sud avant le ratissage."
MLA_Victory.24.a: "L'urgence se termine comme elle a commencé : dans la jungle."

MLA_Victory.25.t: "L'urgence est terminée"
MLA_Victory.25.d: "Le dernier camp a été pris dans le cours supérieur de la rivière Pahang. Chin Peng et ce qui restait de son équipe sont entrés en Thaïlande avant le cordon ; les autres se sont rendus ou non.\n\nLes règles d'urgence sont levées. Douze ans, quelques milliers de morts et un pays qui nous appartient enfin, sans ambiguïté, à gouverner."
MLA_Victory.25.a: "La Malaisie est en paix."

MLA_Victory.26.t: "Invités dans les provinces frontalières"
MLA_Victory.26.d: "Les restes du mouvement communiste malais ont envahi Betong et les provinces du sud. Ils sont armés, ils sont organisés et ils constituent désormais notre problème.\n\nBangkok n'est pas encline à consacrer la vie des Thaïlandais à nettoyer la jungle au nom de Kuala Lumpur. Ils peuvent rester, à condition de rester silencieux."
MLA_Victory.26.a: "Laissez-les pourrir à Betong."

MLA_Victory.27.t: "[GetNewspaperHeader]L'état d'urgence en Malaisie est déclaré terminé"
MLA_Victory.27.d: "La Fédération de Malaisie a officiellement déclaré la fin de l'état d'urgence le [GetDateText], suite à la réduction du dernier camp communiste organisé dans le cours supérieur de la rivière Pahang. Le secrétaire du Parti, Chin Peng, et ce qui restait de son équipe auraient traversé la frontière vers le sud de la Thaïlande avant le cordon ; le reste de la formation s'est rendu ou a été tué lors des derniers ratissages.\n\nLe conflit débuta en juin 1948 avec l'assassinat de trois planteurs européens à Sungai Siput et coûta plusieurs milliers de morts à la péninsule, en grande majorité malais. Cela a été décidé moins par la patrouille dans la jungle que par le plan Briggs, qui a déplacé environ un demi-million de squatters dans de nouveaux villages gardés, et par le contrôle alimentaire qui a suivi, qui a affamé les Min Yuen de la campagne qui les avait soutenus pendant une décennie.\n\nCette campagne est déjà étudiée à Washington et à Paris comme modèle de contre-insurrection, et les officiers malais devraient être recherchés comme conseillers. Les critiques observent que le modèle repose sur la détention sans procès, la réinstallation massive et la déportation, et que les hommes qui ont perdu la guerre ne sont pas morts mais campés dans le saillant de Betong, à quelques kilomètres d'une frontière qu'aucun gouvernement n'est en mesure de contrôler."
MLA_Victory.27.a: "Une guerre coloniale que l'Occident a effectivement gagnée."

 # --- Reworked MLA Political Factions & Alternative Paths Loc ---
 MLA_Purge_Maoist_Hardliners_NPLA:0 "Purger les partisans de la ligne dure maoïste au sein du NPLA"
 MLA_Purge_Maoist_Hardliners_NPLA_desc:0 "L'armée révolutionnaire doit refléter la volonté nationale plutôt que le dogme maoïste étranger. Nous devons éliminer les dogmatiques inflexibles de notre structure de commandement pour garantir un front socialiste uni."
 MLA_Malayanize_Ex_Communists:0 "Malayaniser les anciens communistes"
 MLA_Malayanize_Ex_Communists_desc:0 "Notre lutte ne peut pas rester un mouvement ethnique isolé. Nous devons réorienter nos cadres vers une identité nationale malaise, en intégrant les anciens partisans communistes dans un mouvement socialiste populaire plus large."
 MLA_Embrace_Indo-Melayu_Raya_Ideas:0 "Embrassez les idéaux de Melayu Raya"
 MLA_Embrace_Indo-Melayu_Raya_Ideas_desc:0 "Les frontières artificielles tracées par les colonialistes britanniques et néerlandais divisent les frères de l'archipel. Nous regardons de l'autre côté du détroit de Malacca vers l'Indonésie et défendons la vision sacrée de la Grande Indonésie : Indonesia Raya."
 MLA_Emulate_Sukarno_Regime:0 "Imiter le modèle Sukarno"
 MLA_Emulate_Sukarno_Regime_desc:0 "L'anti-impérialisme fougueux du président Sukarno et son mélange de nationalisme, de religion et de socialisme constituent le modèle de notre gouvernance révolutionnaire. Nous alignerons nos institutions sur celles de Jakarta."
 MLA_Enforce_Pansicalla_Ideals:0 "Appliquer les principes de Pancasila"
 MLA_Enforce_Pansicalla_Ideals_desc:0 "Pour harmoniser notre société diversifiée sans sombrer dans les conflits ethniques, nous adoptons les cinq piliers philosophiques de Pancasila : la croyance en un Dieu unique, l'humanité juste, l'unité, la démocratie consensuelle et la justice sociale."
 MLA_Promote_Ex_Kesatuan_Melayu_Muda_Comrades:0 "Promouvoir les anciens camarades du KMM"
 MLA_Promote_Ex_Kesatuan_Melayu_Muda_Comrades_desc:0 "Les vétérans du Kesatuan Melayu Muda - des combattants comme Ibrahim Yaacob, Mustapha Hussain et Mokhtaruddin Lasso - défendent depuis longtemps notre indépendance. Nous les accueillons au sein du commandement militaire supérieur."
 MLA_Adopt_Marhaenism:0 "Adopter le marhaénisme"
 MLA_Adopt_Marhaenism_desc:0 "Le marhaenisme, né des luttes des paysans et des prolétaires pauvres, place le simple agriculteur et le cultivateur de caoutchouc au coeur de notre révolution socio-économique."
 MLA_Paving_The_Way_for_Greater_Indo-Malay:0 "Ouvrir la voie à une plus grande unité indo-malaise"
 MLA_Paving_The_Way_for_Greater_Indo-Malay_desc:0 "Une fois l'unité idéologique forgée et l'héritage colonial abandonné, nous préparons la voie diplomatique et politique vers une intégration totale avec nos frères indonésiens."
 MLA_Syndies_Takeover:0 "Les syndicalistes prennent le contrôle"
 MLA_Syndies_Takeover_desc:0 "La classe ouvrière organisée n'acceptera plus les ordres des bureaux politiques forestiers clandestins. Dirigés par le Conseil des syndicats malais, les travailleurs ont revendiqué la direction de l'État révolutionnaire."
 MLA_Collaborating_Shamsiah_Fakeh:0 "Coopérer avec Shamsiah Fakeh"
 MLA_Collaborating_Shamsiah_Fakeh_desc:0 "Shamsiah Fakeh et Angkatan Wanita Sedar (AWAS) apportent à notre cause un leadership progressiste et féministe vital. Avec les dirigeants syndicaux, nous formons une véritable coalition de gauche."
 MLA_Diversify_NPLA:0 "Diversifier l'Armée populaire de libération"
 MLA_Diversify_NPLA_desc:0 "Pour transformer le NPLA d'une force de guérilla en une véritable milice populaire, nous recrutons des dirigeants au-delà des frontières ethniques, y compris des organisateurs syndicaux et des vétérans comme John Thivy et Rasammah Bhupalan."
 MLA_Ditching_Sinophilic_Views:0 "Abandonner le dogme sinocentrique"
 MLA_Ditching_Sinophilic_Views_desc:0 "Notre révolution appartient aux travailleurs de Malaisie, pas à Pékin. En rejetant la rhétorique pro-chinoise rigide, nous construisons un mouvement révolutionnaire multiethnique qui représente à la fois les Malais, les Chinois et les Indiens."
 MLA_Formation_Syndicalist_System:0 "Établir la République syndicaliste"
 MLA_Formation_Syndicalist_System_desc:0 "Nous proclamons la réorganisation de l'État en syndicats industriels et en conseils ouvriers démocratiques sous l'égide de la Confédération pan-malaise du Parti du travail (AMCLP)."
 MLA_Enforce_Syndicalization:0 "Appliquer la syndicalisation industrielle"
 MLA_Enforce_Syndicalization_desc:0 "Les usines, les plantations et les quais sont placés directement entre les mains des comités ouvriers. Les syndicats coordonnent désormais la production, mettant ainsi fin à l'exploitation coloniale et à la bureaucratie d'État."
 MLA_Purge_Chin_Goons:0 "Expulser les partisans de la ligne dure"
 MLA_Purge_Chin_Goons_desc:0 "Les restes de la faction personnelle de Chin Peng qui résistent à la gouvernance syndicale démocratique doivent être écartés du commandement avant de renverser les conseils ouvriers."
 MLA_Syndicalism_More_Marxism:0 "Le syndicalisme : au-delà du dogme orthodoxe"
 MLA_Syndicalism_More_Marxism_desc:0 "Plutôt que de suivre servilement Moscou ou Pékin, notre démocratie syndicaliste adapte la théorie marxiste aux conditions coloniales et syndicales uniques de l'Asie du Sud-Est."
 MLA_New_Managament:0 "Sous une nouvelle direction"
 MLA_New_Managament_desc:0 "La période de transition est terminée. La Malaisie est désormais une démocratie syndicaliste gouvernée par les travailleurs, libérée des chaînes coloniales, des marionnettes impérialistes et de la guérilla terroriste."
 MLA_Demaoistization_of_NPLA_desc:0 "Avec le triomphe des nationalistes outre-mer, les tactiques insurrectionnelles dogmatiques maoïstes sont obsolètes. Nous réorganisons l'Armée de Libération selon des principes modernes et disciplinés inspirés par l'Armée Nationale Révolutionnaire."
 MLA_Marx-Sun_Yat-Sen-Chin_Peng_desc:0 "En réunissant l'esprit égalitaire de Marx et les Trois principes du peuple du Dr Sun Yat-sen, Chin Peng synthétise une idéologie distincte : le tridémisme révolutionnaire adapté à la Malaisie."
 MLA_Mimicking_KMT_Policies_desc:0 "Nous mettons en oeuvre des programmes d'industrialisation dirigés par l'État, de réforme agraire contrôlée et d'éducation civique qui reflètent les plans de reconstruction nationale établis en Chine."
 MLA_Infuse_Tridemism_with_Socialism_desc:0 "Le nationalisme, la démocratie et les moyens de subsistance du peuple sont imprégnés d'économie socialiste pour créer une république de développement progressiste et axée sur le bien-être."
 MLA_Enfore_New_Direction_NLA_desc:0 "L'armée adopte une police militaire moderne et une discipline logistique pour maintenir l'ordre civique dans toute la péninsule."
 MLA_Rebrand_Party_Vision_and_Future_desc:0 "Nous renommons officiellement le parti en Parti Rakyat Malaya - Tridemist (PRM), présentant ainsi un visage démocratique modernisé à la population malaise."
 MLA_Tridemism_is_Chinese_Socialism_desc:0 "Le tridemisme propose une synthèse unique qui réconcilie l'héritage culturel de la diaspora chinoise avec le socialisme civique malais, l'accueil des réfugiés et la construction d'une société moderne."
 MLA_White_Sun_Over_Malaya_desc:0 "Sous la bannière du Soleil Blanc et de la république socialiste, la Malaisie entre dans une nouvelle ère de stabilité, de démocratie constitutionnelle et de prospérité partagée."
 MLA_Radical_China_Attack:0 "Offensive des cadres radicalisés"
 MLA_Radical_China_Attack_desc:0 "Une fervente mobilisation idéologique a poussé nos cadres à lancer des assauts audacieux et agressifs contre les positions coloniales britanniques."
 MLA_Malayan_Boat_People:0 "Réinstallation de la diaspora malaise"
 MLA_Malayan_Boat_People_desc:0 "Des milliers de réfugiés et de familles de la diaspora sont arrivés et intégrés dans des coopératives malaises, élargissant ainsi notre bassin de main-d'oeuvre technique et qualifiée."
