 # === MEO Characters (merged from MEO_characters_l_english.yml) ===
 POLITICS_VUONG_CHI_SINH_DESC:0 "§YLe légendaire roi Meo de Ha Giang§L\nVuong Chi Sinh était une figure singulière de l'histoire de l'Indochine française, dirigeant les hauts plateaux Hmong comme une nation indépendante de facto. Né sous le nom de Vang Seo Lu en 1886, il a hérité du leadership de son père et s'est battu pour protéger son peuple de la domination étrangère. Contrairement à d'autres dirigeants du Vietnam, son royaume des Meo n'a jamais été entièrement soumis à la domination coloniale française, maintenant son autonomie grâce à une diplomatie stratégique et une résistance féroce.\nPendant la Seconde Guerre mondiale, Vuong Chi Sinh a rallié les Hmong contre les incursions japonaises et françaises, consolidant ainsi son statut de protecteur des hauts plateaux du nord. Après la Révolution d'Août, il prêta allégeance à Ho Chi Minh, qui l'adopta comme frère juré et lui donna le nom de Vuong Chi Thanh. Il est ensuite devenu membre de l'Assemblée nationale de la République démocratique du Vietnam, plaidant pour la représentation des Hmong dans le nouvel ordre socialiste. Bien que son royaume ait disparu dans l'histoire, son héritage en tant que leader ayant su naviguer dans les complexités de la guerre, du colonialisme et de la révolution reste un chapitre déterminant de la lutte du Vietnam pour l'indépendance."
 POLITICS_LO_VAN_HAC_DESC:0 "§YLe partisan Tai noir de Son La§L\nLo Van Hac est issu des villages Black Tai du bassin de Son La, un pays où l'autorité appartenait depuis des générations aux seigneurs héréditaires phia tao et, après eux, aux résidents français qui trouvaient commode de gouverner par l'intermédiaire de ces mêmes seigneurs. Il a rompu avec les deux. Rejoignant le mouvement révolutionnaire pendant la résistance, il organisa les villageois Tai en colonnes de ravitaillement et sections de guérilla dans les montagnes derrière les lignes françaises, et ses réseaux dans le nord-ouest furent parmi ceux qui rendirent possible la longue marche d'approche vers Dien Bien Phu.\nSa position repose sur quelque chose que les cadres des basses terres ne pouvaient pas fabriquer : c'est un montagnard qui a choisi la révolution plutôt qu'un révolutionnaire envoyé pour gouverner les montagnards. Lorsque Hanoï constitue la zone autonome Tai-Meo en 1955, cette combinaison fait de lui le président naturel, un homme capable de parler au nom des Tai, des Meo et des petits peuples du nord-ouest dans la langue du Parti, et de parler au nom du Parti dans les montagnes sans être entendu comme un occupant. Que l'autonomie sous un tel homme soit une véritable autonomie gouvernementale ou simplement une forme plus confortable d'incorporation est une question à laquelle les hauts plateaux répondront en leur temps."
 POLITICS_DUONG_TRUNG_NHAN_DESC:0 "§YLes Tusi de Meo Vac§L\nDuong Trung Nhan était le rival provocateur de la dynastie Vuong. Né en 1912 de Duong Tu Nghia, il a hérité du ressentiment de sa famille envers les Vuong, dont le pouvoir les avait éclipsés pendant des générations. Contrairement à Vuong Chi Sinh, qui s'est rangé du côté du Viet Minh, Duong Trung Nhan s'est aligné sur la République de Chine, adoptant le tridémisme et promettant de libérer les Hmong du règne de la famille Vuong et de l'influence communiste. Fervent anticommuniste, il a cherché à établir un État libre Hmong indépendant sous sa propre direction, se positionnant comme le dernier espoir d'un avenir non communiste dans les hauts plateaux. Sa lutte contre la dynastie Vuong et le Viet Minh a fait de lui un acteur clé dans la politique fragmentée des régions frontalières du nord."
 # === THO/MEO content extracted from French_Indochina_l_english.yml ===
 THO_viet_bac_establishment_TT:0 "Constituent la §YRégion autonome Viet Bac§! au sein de la §YRépublique démocratique du Vietnam§! en §YCao Bang§!, §YLang Son§! et §YDong Bac Bo§!, dont §YHa Giang§! si nous en sommes propriétaires et que son statut n'est pas déjà réglé. Ces provinces restent partie de la république ; aucun gouvernement séparé n'est créé. §YChu Van Tan§! préside le comité administratif régional tout en restant général de la DRV."
 POLITICS_CHU_VAN_TAN_DESC: "§YPrésident du Comité Administratif de la Région Autonome du Viet Bac§!\nChu Van Tan est un Nung des collines de Vo Nhai, et sa carrière révolutionnaire a commencé avant qu'il n'existe un Viet Minh auquel appartenir. En 1941, il créa dans les villages où il avait grandi le Cuu Quoc Quan, l'Armée du Salut National - une force partisane des montagnards Tay et Nung qui tenait le pays de Bac Son contre les Français puis contre les Japonais, et que le Parti a ensuite intégré dans l'armée régulière comme l'une de ses formations fondatrices. Il fut l'un des premiers généraux nommés par la république et il commanda la frontière nord pendant les années les plus difficiles de la résistance.\nCette histoire est exactement ce qui fait de lui l'homme idéal pour Cao Bang. Le Viet Bac est le terrain sur lequel la révolution est née, et ce n'est pas un terrain de plaine ; un comité qui y est assis doit pouvoir parler au nom des peuples frontaliers sans ressembler au delta, et parler au nom du delta sans ressembler à une occupation. Chu Van Tan peut faire les deux, car il était un montagnard avec un fusil avant d'être général avec un état-major. Hanoï abandonne un commandant de corps pour obtenir un président que la frontière écoutera réellement - et gagne, par-dessus le marché, un homme dont la loyauté envers le Parti n'a jamais dépendu de la surveillance du Parti."
