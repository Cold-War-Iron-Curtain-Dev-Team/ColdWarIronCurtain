 PAR_strike_against_corruption:0 "Strike Against Corruption"
 PAR_simplify_trade_with_argentina:0 "Simplify Trading With Argentina"
 PAR_improve_argentina_ties_desc:0 "Peron Stays"
 PAR_grant_peron_stay_desc:0 "Peron is gone"
 PAR_peoples_welfare:0 "Community Healthcare Program"
 PAR_control_food_prices_desc:0 "Unpopular with large traditional racnhers, popualr with small scale farmers"
 PAR_union_rights:0 "Relax Restrictions on Trade Unions"
 PAR_end_guion_rojo:0 "Dissolve The Guión Rojo"
 PAR_end_guion_rojo_desc:0 "In response to the persistent challenge posed by the Guión Rojo militia, we must enact decisive measures to eliminate this threat to national stability."
 PAR_native_rights:0 "Indigenous Equality Agenda"
 PAR_native_rights_desc:0 "Recognizing the historical marginalization of Paraguay's indigenous communities, President Méndez embarks on a transformative journey to elevate their status within the nation. Inspired by the precedent set by Perón in Argentina, Méndez initiates a series of sweeping reforms aimed at enhancing the rights and opportunities available to indigenous peoples. Through comprehensive legislative measures and targeted socio-economic initiatives, Méndez seeks to empower indigenous communities, granting them greater autonomy, representation, and access to resources"
 PAR_copacar:0 "Expand COPACAR"
 PAR_copacar_desc:0 "In a bid to bolster Paraguay's agricultural sector and uplift small landholders, President Méndez unveils plans to expand the Corporación Paraguaya de Carnes (COPACAR). Recognizing the monopolistic hold COPACAR has on the meat-trading market, Méndez aims to harness its influence to support minifundistas and other small landholders. Through targeted investments and regulatory measures, Méndez seeks to empower these stakeholders, providing them with greater access to markets and resources"
 PAR_education_increase:0 "Invest In Education"
 PAR_end_one_party_state:0 "Lift Ban on Political Parties"
