l_french:
 PAR_moilas_rule:0 "Le gouvernement Molas"
 PAR_moilas_rule_desc:0 "Avec le retrait de Federico Chaves du pouvoir, la direction du Paraguay est passée à Felipe Molas López, un membre fidèle du parti Colorado. Même si sa présidence est considérée comme une mesure temporaire, le gouvernement de Molas López doit désormais s'efforcer de stabiliser la nation et de maintenir l'unité du parti. La transition est délicate et l'avenir du Paraguay reste incertain."
 PAR_party_unity:0 "Commencer l'unification du parti"
 PAR_restore_democratic_inst:0 "Restauration des institutions démocratiques"
 PAR_restore_democratic_inst_desc:0 "Le président Molas s'est positionné comme un réformateur, plaidant pour la restauration des institutions démocratiques au Paraguay après des années de troubles politiques. Son gouvernement a présenté une série d'initiatives visant à réconcilier les conflits passés, notamment en accordant une amnistie aux dissidents politiques et aux révolutionnaires de la guerre civile de 1947. Cependant, Molas manque à la fois de l'influence politique et du temps nécessaire pour mettre en oeuvre des réformes structurelles plus profondes, ce qui laisse beaucoup de gens se demander s'il s'agit véritablement d'un nouveau départ ou simplement d'un vernis temporaire de progrès."
 PAR_depose_molas:0 "Dépôt forcé de Felipe Molas"
 PAR_cement_chaves:0 "Confirmer la position de Federico Chaves"
 PAR_army_focus:0 "Forces armées du Paraguay"
 PAR_army_focus_desc:0 "Les forces armées paraguayennes sont les garantes ultimes de la stabilité nationale, leur loyauté déterminant le sort de chaque gouvernement. Qu'il s'agisse d'assurer l'ordre intérieur ou de se défendre contre les menaces extérieures, l'armée reste un pilier du pouvoir. Renforcer sa structure, moderniser son commandement et réaffirmer son rôle dans les affaires nationales seront cruciaux pour la survie de la nation."
 PAR_army:0 "Aéroport paraguayen"
 PAR_army_desc:0 "En tant qu'épine dorsale de la force militaire du Paraguay, l'Ejército Paraguayo doit être renforcé pour maintenir la sécurité intérieure et dissuader les menaces extérieures. La modernisation des équipements, l'amélioration de la formation et l'expansion des capacités logistiques garantiront que l'armée reste la force dominante dans la défense et la gouvernance nationales."
 PAR_air_force:0 "Fuerza Aérea Paraguaya"
 PAR_air_force_desc:0 "Bien que relativement petite, la Fuerza Aérea Paraguaya joue un rôle crucial dans la défense nationale. L'expansion de ses capacités, l'acquisition d'avions modernes et le développement d'un commandement aérien stratégique renforceront la capacité du Paraguay à projeter sa puissance et à protéger sa souveraineté d'en haut."
 PAR_chaves:0 "Pacifiquer spirituellement la nation"
 PAR_1950_elections:0 "Convoquer de nouvelles élections"
 PAR_1950_elections_desc:0 "Pour légitimer son pouvoir et assumer officiellement la présidence, Federico Chaves a convoqué de nouvelles élections. Même si l'issue est presque certaine, ce vote lui accordera le mandat politique lui permettant de terminer le mandat inachevé de Molas López jusqu'en 1953. Avec le soutien du parti et de l'armée, la direction du Paraguay devrait rester inchangée - du moins pour le moment."
 PAR_economy:0 "De Defensa de la Economía Nacional"
 PAR_economy_desc:0 "Une nation forte nécessite une économie forte. La protection des industries clés, la stabilisation des institutions financières et le contrôle de l'État sur les ressources vitales seront essentiels pour la sécurité à long terme du Paraguay. Que ce soit par l'intervention du gouvernement ou par des incitations du secteur privé, la voie à suivre doit donner la priorité à la résilience économique nationale."
 PAR_undermine_rivals:0 "Combattre les opposants politiques"
 PAR_undermine_rivals_desc:0 "Combattre les opposants politiques"
 PAR_keep_allies_happy:0 "Gardez les Caudillos heureux"
 PAR_keep_allies_happy_desc:0 "Au Paraguay, le pouvoir politique n'est pas détenu uniquement par le gouvernement mais également par les caudillos régionaux qui contrôlent les réseaux d'influence locaux. Pour maintenir la stabilité, l'administration doit leur accorder des faveurs, des postes gouvernementaux et des opportunités économiques, garantissant ainsi leur loyauté continue."
 PAR_appoint_mendez:0 "Nommer Epifanio Méndez à la tête de BCP"
 PAR_appoint_mendez_desc:0 "Avec la création réussie de la Banco Central del Paraguay, le président Chaves doit désormais nommer un dirigeant compétent pour diriger les politiques financières du pays. Après mûre réflexion, le gouvernement a choisi Epifanio Méndez Fleitas, un économiste et stratège politique expérimenté, comme nouveau chef de la banque centrale. Cependant, l'influence croissante de Méndez au sein du parti Colorado n'est pas passée inaperçue. Si son expertise est indéniable, certains au sein du gouvernement expriment discrètement leur inquiétude quant au fait que ses ambitions pourraient s'étendre au-delà des questions économiques."
 PAR_1953_elections:0 "Les élections de 1953"
 PAR_1953_elections_desc:0 "Alors que le Paraguay entre dans une nouvelle année électorale, le Parti Colorado - la seule entité politique légale - reste une fois de plus incontesté. Avec le président Federico Chaves comme seul candidat, sa réélection est une simple formalité plutôt qu'une compétition. La domination du parti assure la continuité et la stabilité, renforçant la trajectoire du Paraguay sous une direction ferme et expérimentée."
 PAR_argentine_relations:0 "Alignement stratégique avec l'Argentine"
 PAR_combat_inflation:0 "Mesures contre l'inflation"
 PAR_combat_inflation_desc:0 "La hausse de l'inflation menace la stabilité économique, érodant le pouvoir d'achat et sapant la confiance du public. Pour en limiter les effets, le gouvernement doit mettre en oeuvre des politiques budgétaires strictes, réguler les marchés clés et stabiliser la valeur des devises"
 PAR_keep_party_happy:0 "Suivre le cours de fête"
 PAR_keep_party_happy_desc:0 "Le parti a clairement exprimé sa position : la politique économique doit rester entre les mains des pays, guidée par les principes qui ont soutenu notre mouvement. Même si certains plaident en faveur de réformes et de privatisations soutenues par l'étranger, de telles politiques risquent de céder les industries nationales à des intérêts extérieurs et de saper le rôle de l'État dans le développement économique. Au lieu de cela, nous renforcerons le contrôle de l'État sur des secteurs clés, en veillant à ce que l'économie paraguayenne serve la nation et sa population, et non les créanciers étrangers ou les profiteurs privés."
 PAR_outside_party:0 "Cherchez à l'extérieur des conseils économiques"
 PAR_outside_party_desc:0 "Malgré la résistance du parti, les réalités de notre économie ne peuvent être ignorées. Le contrôle étatique et le protectionnisme peuvent assurer la stabilité, mais ils entravent également la croissance, l'efficacité et la modernisation. Nous ne pouvons pas permettre que l'idéologie fasse obstacle au progrès économique. Le monde change et si le Paraguay veut assurer son avenir, nous devons nous adapter et nous engager sur le marché mondial."
 PAR_army_membership:0 "La loyauté au parti dans les rangs"
 PAR_army_membership_desc:0 "Pour garantir la loyauté inébranlable des forces armées, l'adhésion militaire sera de plus en plus limitée aux membres du parti au pouvoir. Cette politique renforcera l'unité politique au sein des rangs, empêchant la montée d'officiers déloyaux et d'éventuelles tentatives de coup d'État. En alignant l'armée sur l'idéologie du parti, nous pouvons créer une force armée plus stable et plus contrôlable, garantissant que le gouvernement reste fermement aux commandes sans risque de dissidence."
 PAR_fal_rifles:0 "Acquérir des fusils FAL"
 PAR_light_tanks:0 "Programme de Tanques Ligeros"
 PAR_modern_air_tactics:0 "Étudiez les tactiques aériennes modernes"
 PAR_intel_network:0 "Configurer la surveillance"
 PAR_1954_coup:0 "Le pari de Stroessner"
 PAR_Chaves_resigns:0 "Federico Chaves démissionne"
 PAR_arm_police:0 "Des armes lourdes pour la police nationale"
 PAR_arm_police_desc:0 "Pour renforcer la sécurité intérieure et garantir que les forces de l'ordre restent capables de faire face à toute menace, le gouvernement envisage un projet visant à doter la police nationale d'armes plus lourdes. Les partisans soutiennent qu'une force de police bien armée sera mieux préparée à maintenir l'ordre, particulièrement en période de troubles. Cependant, cette décision a déjà suscité des inquiétudes au sein de l'armée, certains craignant qu'elle puisse modifier l'équilibre des pouvoirs et créer des tensions inutiles entre la police et les forces armées."
 PAR_strenghten_party_line:0 "Efforts pour unifier le parti"
 PAR_strenghten_party_line_desc:0 "Alors que les divisions internes menacent la stabilité du parti au pouvoir, le président Federico Chaves a pris des mesures pour consolider la direction et renforcer l'unité du parti. Des efforts sont déployés pour combler les divisions idéologiques, renforcer la discipline de parti et garantir que toutes les factions restent alignées derrière une vision commune de l'avenir du Paraguay."
 PAR_amend_constitution:0 "Chercher à amender la Constitution"
 PAR_amend_constitution_desc:0 "Son pouvoir assuré lors des élections, le président Federico Chaves a proposé des amendements à la constitution, visant à introduire des dispositions de gouvernance plus libérales. Les réformes comprennent le renforcement des institutions civiles, l'élargissement du pouvoir exécutif et la modernisation des fonctions de l'État pour refléter l'évolution des besoins du Paraguay."
 PAR_status_quo_con:0 "Cave à la pression de la fête"
 PAR_simplify_border_check:0 "Simplifiez les protocoles frontaliers avec l'Argentine"
 PAR_simplify_border_check_desc:0 "Le Paraguay et l'Argentine partageant des liens économiques et historiques profonds, des efforts sont en cours pour rationaliser les protocoles frontaliers afin de faciliter le commerce, les voyages et la coopération diplomatique. En réduisant les obstacles bureaucratiques et en améliorant la coordination, le gouvernement cherche à renforcer les liens économiques tout en garantissant des mouvements transfrontaliers efficaces. Ces mesures visent à favoriser une plus grande intégration régionale et à renforcer la position du Paraguay au sein du cône Sud."
 PAR_no_dice:0 "Le coup d'État qui n'a jamais eu lieu"
 PAR_no_dice_desc:0 "Grâce à l'intervention opportune des officiers loyalistes du colonel Néstor Ferreira et au soutien critique de la faction Epifanista, le président Chaves a été sécurisé et les putschistes ont été contraints de battre en retraite. Chaves reste au pouvoir, mais le paysage politique est à jamais modifié. L'armée est fracturée, Stroessner attend dans l'ombre une autre chance, et notre gouvernement doit désormais sa survie à des alliés ambitieux qui en voudront le prix."
 PAR_expandd_education:0 "PAR_expandd_education"
 PAR_expand_education:0 "Élargir l'accès à l'éducation"
 PAR_expand_education_desc:0 "L'éducation est le fondement du progrès national et garantir un accès plus large à l'école est devenu une priorité clé pour le gouvernement. Des efforts sont en cours pour renforcer le système éducatif, le rendant plus accessible aux communautés à travers le pays."
 PAR_negotiate_with_brazil:0 "Négocier avec le Brésil"
 PAR_negotiate_with_brazil_desc:0 "Depuis des décennies, nos relations avec le Brésil sont un mélange de diplomatie prudente et de différends non résolus. Les tensions frontalières autour du fleuve Apa et le fardeau des dettes historiques posent des défis importants à nos intérêts nationaux. Le président Federico Chaves estime qu'un règlement négocié peut prévenir les hostilités et assurer la stabilité économique. Toutefois, ces négociations doivent être menées avec prudence : offrir trop de concessions pourrait affaiblir la souveraineté du Paraguay, tandis qu'en exiger trop pourrait conduire à de nouvelles tensions. Le résultat de ces négociations façonnera nos relations futures avec notre puissant voisin."
 PAR_anti_communist_operations:0 "Développer les opérations anticommunistes"
 PAR_anti_communist_operations_desc:0 "Notre nation est confrontée à une menace croissante de subversion communiste, mettant en danger notre stabilité et notre mode de vie. Pour contrer cela, nous prenons des mesures décisives pour renforcer les opérations de renseignement, renforcer la sécurité intérieure et éliminer les éléments subversifs avant qu'ils ne se propagent. Une coordination plus étroite entre la police nationale, les renseignements militaires et les forces de sécurité de l'État garantira que les agitateurs et dissidents de gauche soient maintenus sous stricte surveillance, protégeant ainsi la nation de leur influence perturbatrice."
 PAR_reverse_engineer_designs:0 "Ingénierie inverse des conceptions étrangères"
 PAR_national_companies:0 "Nationalisation limitée"
 PAR_regulate_private_sector:0 "Réguler le secteur privé"
 PAR_adopt_fmi:0 "Adopter les recommandations du FMI"
 PAR_privatize_state:0 "Privatiser les entreprises publiques"
 PAR_infrasctruture:0 "Développez les chemins de fer"
 PAR_infrasctruture_desc:0 "Une nation forte a besoin d'infrastructures solides et le réseau ferroviaire du Paraguay reste sous-développé par rapport à celui de ses voisins. L'expansion et la modernisation de nos chemins de fer amélioreront l'efficacité logistique, permettant des mouvements de troupes plus rapides, une meilleure répartition des ressources et une activité économique accrue."
 PAR_cultural_development:0 "Promouvoir le développement culturel"
 PAR_cultural_development_desc:0 "Reconnaissant l'importance de l'identité et des traditions nationales, le gouvernement a mis un accent renouvelé sur la croissance et la préservation de la culture. Grâce à diverses initiatives, des efforts sont déployés pour renforcer le patrimoine du Paraguay et garantir que la culture reste la pierre angulaire de l'unité nationale. À mesure que la modernisation progresse, il est essentiel que les valeurs et l'identité de la nation soient défendues, permettant au Paraguay d'avancer tout en restant fidèle à ses racines."
 PAR_growing_opposition:0 "Une opposition conservatrice croissante"
 PAR_purge_military:0 "Purge militaire à grande échelle"
 PAR_support_conservative_coup:0 "Soutenez le coup d'État conservateur"
 PAR_currency_reform:0 "Réforme guarani"
 PAR_currency_reform_desc:0 "La stabilité de notre économie dépend d'une monnaie nationale forte et fiable. Sans une surveillance adéquate, l'inflation, la volatilité et les inefficacités menacent la croissance à long terme. Pour garantir la résilience économique, les réformes du Guaraní se concentreront sur la stabilisation, la modernisation et l'amélioration des politiques budgétaires, renforçant ainsi la confiance dans notre système financier."
 PAR_urban_development:0 "Développement urbain"
 PAR_police_impro:0 "Augmenter le financement de la police"
 PAR_reduce_spending:0 "Réduire les dépenses gouvernementales"
 PAR_replace_mendez:0 "Remplacer Epifanio Méndez"
 PAR_replace_mendez_desc:0 "Le mandat d'Epifanio Méndez Fleitas à la tête de la Banque centrale du Paraguay a été marqué par des politiques économiques audacieuses, l'intervention de l'État et une ambition politique croissante. Cependant, son leadership suscite de plus en plus l'opposition de puissantes élites économiques, de factions conservatrices du Parti Colorado et d'éléments de l'armée. Ses récentes décisions économiques - en particulier sa résistance à l'augmentation des prix de la viande bovine - l'ont mis en porte-à-faux avec l'Asociación Rural del Paraguay, un bloc de pouvoir clé dans le pays. Parallèlement, les tensions croissantes entre les éléments pro-péronistes et anti-péronistes au sein du gouvernement ont rendu sa position intenable."
 PAR_confront_military:0 "Remanier le Cabinet"
 PAR_confront_military_desc:0 "Le président Federico Chaves a procédé à un important remaniement ministériel, remplaçant plusieurs ministres et nommant de nouveaux responsables à des postes clés du gouvernement. Bien qu'officiellement destinés à améliorer la gouvernance, ces changements ont suscité de discrètes spéculations au sein des cercles politiques. Certains y voient un ajustement de routine, tandis que d'autres soupçonnent que des motivations politiques plus profondes sont en jeu."
 PAR_party_opposition:0 "Réaffirmer l'autorité civile"
 PAR_party_opposition_desc:0 "Depuis les changements politiques turbulents de la dernière décennie, l'armée paraguayenne a joué un rôle démesuré dans la gouvernance nationale, agissant souvent comme un intermédiaire de pouvoir au sein du Parti Colorado. Alors que le président Federico Chaves lui-même est arrivé au pouvoir avec le soutien militaire, il cherche désormais à réaffirmer le leadership civil et à réduire l'influence directe des forces armées sur les décisions politiques. Cependant, les officiers de l'état-major et les partisans de la ligne dure qui considèrent l'armée comme la gardienne de l'ordre national commencent à s'inquiéter. Certains murmurent que Chaves sape la structure même qui assure la stabilité du Paraguay."
 PAR_military_compromise:0 "Rechercher un compromis avec les militaires"
 PAR_stoessner_takes_over:0 "Stroessner élu"
 PAR_stoessner_takes_over_desc:0 "Alors que la transition politique est en cours au Paraguay, le pays se prépare à une élection présidentielle spéciale pour désigner officiellement le successeur de Federico Chaves. Bien que présentée comme un exercice de continuité démocratique, la réalité est claire : le général Alfredo Stroessner, chef du coup d'État du 4 mai, se présente sans opposition comme candidat du Parti Colorado. Le parti, encore fragmenté entre diverses factions, considère Stroessner comme une solution temporaire pour maintenir la stabilité, tandis que l'armée veille à ce que les élections se déroulent sans interruption."
 PAR_resist_us_ilnfuence:0 "Résistez à l'influence américaine"
 PAR_party_influence:0 "Augmenter l'influence du Colorado"
 PAR_support_democratic_allies:0 "Renforcer la faction Démocratique"
 PAR_support_democratic_allies_desc:0 "Le président Federico Chaves s'appuie de plus en plus sur les Démocratiques, la faction réformiste du parti Colorado, pour contrebalancer l'influence des partisans de la ligne dure et des élites militaires. Ce groupe soutient un plus grand contrôle civil sur le gouvernement, un interventionnisme économique et une politique étrangère plus indépendante - des positions qui défient directement la vieille garde conservatrice du parti. Pour l'instant, Chaves est convaincu que le soutien à cette faction garantira l'avenir de son gouvernement, mais à mesure que les tensions internes montent, certains membres du parti pourraient ne pas rester fidèles pour toujours."
 PAR_old_guard:0 "Récompensez la vieille garde"
 PAR_virgilio:0 "Gambit de Virgilio Candia"
 PAR_restore_order:0 "Restaurer la stabilité"
 PAR_place_blame:0 "Expliquez le coup d'État"
 PAR_death_squads:0 "Escuadrón de la Muerte"
 PAR_death_squads_desc:0 "Alors que l'opposition au régime reste dans l'ombre, le président Alfredo Stroessner a autorisé la création de l'Escuadrón de la Muerte. Composée de fidèles du parti, d'agents militaires et de forces de sécurité triées sur le volet, cette unité opère en dehors de la chaîne de commandement formelle, garantissant que les ennemis de l'État peuvent être neutralisés sans obstruction légale. Même si les autorités ne reconnaîtront jamais son existence, le message est clair : ceux qui conspirent contre le régime ne seront pas tolérés."
 PAR_secure_military_power:0 "Assurer le pouvoir des militaires"
 PAR_mendez_coup:0 "La Reencuentro"
 PAR_ramp_up_communism:0 "Intensification de l'anticommunisme"
 PAR_mass_censorship:0 "Saisissez les médias"
 PAR_crush_the_rebellion:0 "Fête propre d'Epfenistas"
 PAR_mendez_coup_succes:0 "Front contre Stroessner"
 PAR_conspire_stoessner_out:0 "Accord improbable"
 PAR_conspire_stoessner_out_desc:0 "Le Parti et Mendez concluent un accord pour remplacer Stoessner par Justo Pastor Benítez"
 PAR_exile_mendez:0 "Envoyer Méndez en exil"
 PAR_secure_rule:0 "Nommer Méndez comme ambassadeur en Espagne"
 PAR_rally_supporters:0 "Rassemblement des partisans du parti"
 PAR_tear_colorado_down:0 "Détruire le Colorado"
 PAR_tear_colorado_down_desc:0 "Le Parti Colorado est une institution pourrie de l'intérieur. C'est le parti de Stroessner, de la vieille garde corrompue et de la botte militaire. Même avec nos réformes, le nom du parti entache notre nouvelle démocratie. Il est temps de faire une pause complète. Nous dissoudrons l'ANR et forgerons un nouveau mouvement, §HPartido Nacionalista Revolucionario§!, construit non pas sur des accords en coulisses mais sur le soutien populaire et notre vision d'un nouveau Paraguay."
 PAR_party_meeting:0 "Organiser un congrès du parti"
 PAR_strengthen_image:0 "Fortifier l'image publique de Chaves"
 PAR_open_discussion:0 "Dirigez la ligne du parti"
 PAR_imporve_worker_condition:0 "Améliorer les conditions des travailleurs"
 PAR_m1_garands:0 "Assistance aux fusils américains"
 PAR_m1_garands_desc:0 "Face à des préoccupations croissantes en matière de sécurité, le Paraguay se tourne vers l'aide militaire des États-Unis. Grâce à des programmes excédentaires, les États-Unis ont accepté de fournir aux forces armées les fusils, mitrailleuses et autres armes légères excédentaires de la Seconde Guerre mondiale. Bien qu'il ne s'agisse pas de l'équipement le plus moderne, ces armes renforceront considérablement nos forces d'infanterie, garantissant ainsi que nos soldats seront mieux armés pour tout conflit à venir."
 PAR_favour_argentinan_help:0 "Favoriser l'aide argentine"
 PAR_favour_argentinan_help_desc:0 "L'Argentine a longtemps maintenu l'une des armées les plus disciplinées et les mieux organisées de la région, avec un fort accent sur la formation et la planification stratégique. Le renforcement de nos liens avec Buenos Aires pourrait ouvrir la porte à une collaboration, améliorant ainsi notre propre infrastructure et notre préparation militaires. Pourtant, comme pour toute alliance, un engagement plus profond s'accompagne de son propre ensemble de considérations."
 PAR_brazilian_help:0 "Favoriser l'aide brésilienne"
 PAR_brazilian_help_desc:0 "Avec la puissance militaire croissante du Brésil et la coopération croissante avec les puissances internationales, des liens militaires plus étroits pourraient offrir de précieuses opportunités au Paraguay. Leur expérience en matière de modernisation et de logistique offre une chance de renforcer les capacités de notre armée, garantissant que nous restons prêts à relever tous les défis régionaux. Cependant, une telle décision n'est pas sans considérations diplomatiques, car les dynamiques régionales continuent de changer."
 PAR_us_donations:0 "Dons de l'Oncle Sam"
 PAR_us_donations_desc:0 "Oncle nous a offert de nouveaux avions"
 PAR_navy:0 "Armada paraguayenne"
 PAR_navy_desc:0 "La Marine paraguayenne est la force maritime des Forces armées du Paraguay, chargée de la défense des eaux du Paraguay même si elle n'a pas d'accès direct à la mer. Malgré cela, elle possède une forte tradition navale du fait qu'elle a accès à l'océan Atlantique par les fleuves Paraguay et Paraná."
 PAR_dispand_marines:0 "Dissoudre les Marines"
 PAR_shermans:0 "Chars Sherman M4"
 PAR_motorization:0 "Motoriser l'armée"
 PAR_motorization_desc:0 "L'époque où l'on comptait uniquement sur l'infanterie et la cavalerie touche à sa fin. Pour moderniser les capacités militaires du Paraguay, des efforts seront déployés pour acquérir des camions, des véhicules blindés et du matériel de transport, améliorant ainsi la mobilité et l'efficacité logistique."
 PAR_army_intelligence:0 "Renforcer le renseignement de l'armée"
 PAR_army_intelligence_desc:0 "À une époque d'incertitude croissante, l'information est aussi vitale que la puissance de feu. L'armée paraguayenne doit veiller à être préparée non seulement à la guerre conventionnelle, mais également aux luttes secrètes d'espionnage, de contre-espionnage et de sécurité intérieure. En élargissant nos capacités de renseignement militaire, nous pouvons mieux surveiller les menaces potentielles, tant étrangères que nationales, et préserver la stabilité nationale."
 PAR_iron_and_steel:0 "Programme Hierro et Acero"
 PAR_iron_and_steel_desc:0 "Le secteur industriel du Paraguay dépend depuis longtemps des importations pour ses matériaux essentiels, ce qui nous rend vulnérables aux perturbations extérieures. Pour résoudre ce problème, le programme Hierro y Acero se concentrera sur l'expansion de la production nationale de fer et d'acier, en garantissant que nos industries et nos militaires aient accès aux ressources dont ils ont besoin. En investissant dans de nouveaux sites d'extraction, en modernisant les fonderies existantes et en affinant les techniques de production, nous pouvons jeter les bases d'une économie plus autosuffisante."
 PAR_factory_upgrades:0 "Investissez dans l'usinage moderne"
 PAR_factory_upgrades_desc:0 "Le progrès industriel repose sur la capacité à produire des machines et des outils de précision de haute qualité."
 PAR_depose_molas_desc:0 "Face au mécontentement croissant face à son règne, le conseil d'administration du parti Colorado s'est réuni pour décider du sort de Molas López. Lors d'une session extraordinaire, le vote a eu lieu : sa présidence n'avait plus leur soutien. Privé de soutien politique et sans alternative, la chute de Molas López est devenue inévitable."
 PAR_chaves_desc:0 "Avec un nouveau gouvernement en place, le président Federico Chaves cherche à pacifier la nation, appelant à l'unité et à la stabilité après des années de troubles politiques. Cependant, son administration est confrontée à des inquiétudes croissantes concernant la corruption, les difficultés économiques et l'influence des caudillos politiques, qui pourraient menacer la cohésion nationale si rien n'est fait pour y remédier."
 PAR_chaves_takes_over:0 "Président Federico Chaves"
 PAR_rationing:0 "Introduire un rationnement temporaire"
 PAR_rationing_desc:0 "Face à l'instabilité économique et aux pénuries affectant les biens essentiels, le gouvernement a introduit des mesures de rationnement temporaires pour garantir une distribution équitable et empêcher les profits. Bien que nécessaire pour stabiliser la situation, cette politique risque d'alimenter le mécontentement de ceux qui y voient une opportunité de corruption et de trafic noir."
 PAR_stability:0 "Plan de stabilisation et de développement"
 PAR_stability_desc:0 "L'économie paraguayenne étant toujours confrontée à des faiblesses structurelles, le président Chaves a présenté le Plan de Estabilización y Desarrollo, une initiative audacieuse et stratégique visant à assurer la stabilité financière et à favoriser le développement national. Ce plan donne la priorité au contrôle de l'inflation, à l'expansion des infrastructures et à la modernisation des industries clés, garantissant ainsi que le Paraguay reste compétitif dans un monde de plus en plus complexe. En attirant les capitaux étrangers et en renforçant la production nationale, le gouvernement vise à créer une économie autonome capable de croître à long terme. Bien que certaines voix au sein du Parti Colorado mettent en garde contre une dépendance excessive à l'égard des investissements internationaux, l'administration rassure la nation sur le fait que ces mesures sont nécessaires à la prospérité future du Paraguay."
 PAR_emergency_party_meeting:0 "Convoquer la fête"
 PAR_emergency_party_meeting_desc:0 "Remplacer Chaves par Angel Florentín Peña"
 PAR_ruffeneli:0 "Carlos Levi Rufinelli"
 PAR_state_of_emergency:0 "Déclarer l'état de siège"
 PAR_state_of_emergency_desc:0 "Renouvelé jusqu'en 87"
 PAR_develop_capital:0 "Développer la capitale"
 PAR_develop_capital_desc:0 "Asunción se situe au coeur de la nation, mais ses infrastructures et son économie sont en retard par rapport à ce que l'on attend d'une capitale moderne. Les investissements dans le développement urbain, les transports et l'industrie renforceront non seulement le rôle de la ville en tant que centre politique et économique du Paraguay, mais offriront également des opportunités de croissance, d'emploi et de modernisation. Une capitale plus forte signifie une nation plus forte."
 PAR_export_crops:0 "Augmenter la production de cultures d'exportation"
 PAR_export_crops_desc:0 "Le secteur agricole du Paraguay reste l'épine dorsale de notre économie, avec des cultures commerciales comme le coton, le tabac et la canne à sucre qui constituent des sources vitales de revenus d'exportation. En encourageant la production à grande échelle, en améliorant l'irrigation et en accordant des subventions aux grandes plantations, nous pouvons garantir un flux constant de marchandises vers les marchés étrangers."
 PAR_foreign_oil_companies:0 "Investissements pétrochimiques étrangers"
 PAR_foreign_oil_companies_desc:0 "La demande énergétique croissante et l'expansion industrielle du Paraguay nécessitent un secteur pétrochimique modernisé pour réduire la dépendance aux carburants importés. Conscient de cette nécessité, le gouvernement a ouvert les appels d'offres aux investisseurs étrangers pour la construction d'une nouvelle raffinerie, dans le but d'établir un approvisionnement national fiable en carburant."
 PAR_epifanistas:0 "Soudoyer les Epifanistas"
 PAR_raise_militia:0 "Lever des milices loyales"
 PAR_raise_militia_desc:0 "L'armée régulière a prouvé qu'on ne pouvait pas lui faire entièrement confiance. Même si les loyalistes de Ferreira occupent le commandement, les rangs sont toujours remplis d'hommes à l'allégeance incertaine. Pour contrer cela, nous armerons formellement les factions qui se sont tenues aux côtés du gouvernement : les Epifanistas et nos propres Democráticos. Ces milices loyales serviront de contrepoids aux militaires et de police d'assurance contre de futurs complots."
 PAR_promote_Ferreira:0 "Promouvoir Ferreira au rang de commandant suprême"
 PAR_promote_Ferreira_desc:0 "Le colonel Néstor Ferreira a risqué sa carrière et sa vie pour défendre le gouvernement constitutionnel. Sa loyauté doit être récompensée et son autorité doit être absolue. Nous le promouvrons au rang de commandant suprême des forces armées. Cela permettra non seulement de confier la direction à un allié de confiance, mais également d'envoyer un message clair aux stroessnéristes : leur complot a échoué. Avec Ferreira à la barre, nous pouvons commencer le travail de reconstruction de l'armée."
 PAR_army_clean:0 "Purger l'armée des partisans de Stroessner"
 PAR_army_clean_desc:0 "Avec le commandant suprême Ferreira en place, nous pouvons enfin faire le ménage. Le complot du 4 mai a révélé un réseau de conspiration qui s'étend à tous les niveaux du corps des officiers. Nous autoriserons Ferreira à procéder à une purge à grande échelle de tous les partisans connus de Stroessner, des officiers déloyaux et des agitateurs politiques dans ses rangs. Ce sera un processus coûteux et difficile, mais c'est le seul moyen de garantir une fois pour toutes la loyauté de l'armée."
 PAR_reopen_us_embassy:0 "Rouvrir l'ambassade des États-Unis"
 PAR_epifanistas_desc:0 "Peut-être un chemin de verrouillage pour Stoesnner ? Des épifinistas sécurisés pour Chávez"
 PAR_anti_Communist_mild:0 "Poursuivre la campagne anticommuniste"
 PAR_reshuffle_marines:0 "Réorganiser les Marines"
 PAR_education_board:0 "Évaluer les défis éducatifs"
 PAR_american_loans_rebuild:0 "Fonds américains pour la reconstruction"
 PAR_american_loans_rebuild_desc:0 "La tentative de coup d'État, bien que brève, a provoqué d'importantes perturbations économiques et des dégâts matériels. Nos efforts pour rétablir les relations diplomatiques avec Washington ont porté leurs fruits, et les États-Unis nous ont offert un généreux programme de prêts et de fonds de reconstruction. Ces fonds seront cruciaux pour réparer les dégâts et stabiliser notre économie."
 PAR_combat_crime_as_ac:0 "Créer une police de quartier"
 PAR_reduce_argentina_dependence:0 "Réduire la dépendance à l'égard de l'Argentine"
 PAR_reduce_argentina_dependence_desc:0 "L'économie du Paraguay a longtemps été captive de Buenos Aires. Cette dépendance n'est pas seulement économique, mais politique. Nos rivaux, les Epifanistas, ont des liens profonds avec le péronisme, ce qui en fait une question de sécurité nationale. Nous devons diversifier notre économie et construire de nouveaux partenariats avec le Brésil et les États-Unis pour garantir notre souveraineté."
 PAR_create_bcp:0 "Créer la Banco Central del Paraguay"
 PAR_create_bcp_desc:0 "En raison des difficultés croissantes de gestion financière, de la hausse de l'inflation et de la spéculation monétaire croissante, le gouvernement a commencé à rédiger la loi 18/52 pour créer la Banco Central del Paraguay. Cette institution assumera la responsabilité de la politique monétaire, de la réglementation bancaire et de l'émission de devises, remplaçant ainsi le cadre financier obsolète qui a eu du mal à maintenir la stabilité. Construite sur le département monétaire de la Banco del Paraguay, la nouvelle banque centrale fournira une base plus solide pour la gouvernance économique, garantissant un système financier plus réglementé, capable de soutenir le développement à long terme du Paraguay."
 PAR_limit_heavy_arms:0 "Restreindre l'armement de la police"
 PAR_limit_heavy_arms_desc:0 "Afin de préserver l'équilibre des pouvoirs et d'éviter des frictions inutiles avec l'armée, le gouvernement envisage de limiter l'accès de la police nationale aux armes lourdes. Cette décision vise à maintenir une distinction claire entre les rôles militaires et chargés de l'application de la loi, garantissant que la police reste concentrée sur la sécurité publique plutôt que sur la militarisation. Alors que certains au sein du gouvernement estiment qu'une force de police plus lourdement armée est nécessaire, d'autres soutiennent qu'un armement excessif de la police pourrait conduire à une instabilité politique et à des conflits indésirables."
 PAR_reform_ministeries:0 "Ministères de réforme"
 PAR_cultural_support:0 "Soutenez la culture paraguayenne"
 PAR_mass_censorship_desc:0 "Remplacez les éditeurs et tout le reste par des fidèles"
 PAR_reassign_mendez:0 "Réaffecter Epifanio Méndez au poste de leader du PCA"
 PAR_reassign_mendez_desc:0 "Avec Stroessner désormais fermement au pouvoir, le régime prend des mesures pour récompenser ceux qui ont soutenu le coup d'État et garantir la loyauté au sein des institutions clés. L'une des nominations les plus significatives est la réintégration d'Epifanio Méndez Fleitas à la présidence de la Banque centrale du Paraguay. Ayant été démis de ses fonctions par Federico Chaves avant le coup d'État, Méndez a joué un rôle crucial en garantissant le soutien à Stroessner parmi les factions réformistes du parti Colorado. Au-delà de son rôle économique, Méndez étend également son influence politique. Il a pris le contrôle de La Unión, un journal qui servira de principal porte-parole médiatique du gouvernement, garantissant que le régime de Stroessner soit publiquement légitimé et que les discours de l'opposition soient supprimés."
 PAR_declare_state_of_siege:0 "Déclarer l'état de siège"
 PAR_declare_state_of_siege_desc:0 "Renouvelé tous les 3 mois jusqu'à la fin du règne"
 PAR_constitution_stuff:0 "Consolider le pouvoir"
 PAR_constitution_stuff_desc:0 "Avec Federico Chaves démis de ses fonctions et Alfredo Stroessner fermement au pouvoir, le moment est venu de consolider les fondations du nouveau régime. Alors que la direction du Parti Colorado considérait initialement Stroessner comme une solution temporaire, il est désormais clair que son gouvernement ne servira pas simplement de substitut."
 PAR_keep_eye_on_guion_rojo:0 "Gardez un oeil sur Guión Rojo"
 PAR_keep_eye_on_guion_rojo_desc:0 "PAR_keep_eye_on_guion_rojo_desc"
 PAR_offer_aid_to_korea:0 "Offrir une assistance en Corée"
 PAR_offer_aid_to_korea_desc:0 "Alors que la guerre froide s'intensifie, le conflit en Corée est devenu une lutte déterminante entre les forces de la démocratie et du communisme. Même si l'implication directe du Paraguay dans la guerre reste peu pratique, offrir un soutien symbolique à la coalition des Nations Unies - dirigée par les États-Unis - pourrait renforcer nos relations diplomatiques avec Washington."
 PAR_expand_py_nandi:0 "Développer Py Nandi"
 PAR_expand_py_nandi_desc:0 "Avec Alfredo Stroessner désormais fermement au pouvoir, les efforts commencent pour étendre l'influence du Py Nandi, l'aile rurale de Guión Rojo, qui sert d'épine dorsale à la mobilisation du Parti Colorado dans les campagnes. À l'origine un réseau de loyalistes du parti, de propriétaires fonciers et d'organisateurs ruraux, le Py nandi fonctionne comme une extension populaire du régime, garantissant que le contrôle politique s'étend jusqu'aux régions les plus reculées du Paraguay. Aucun village, aucune ferme, aucun Paraguayen n'est hors de portée du parti."
 PAR_pave_way_for_strossner:0 "Pourparlers entre militaires et ANR"
 PAR_pave_way_for_strossner_desc:0 "Le Parti Colorado reste divisé, tandis que les militaires cherchent à assurer une transition stable. Pour éviter une nouvelle instabilité, les principaux chefs militaires et responsables de l'ANR ont entamé des négociations en coulisses pour déterminer le prochain président. Alors que certains au sein du parti rêvent encore de réaffirmer le contrôle total des civils, l'armée a clairement fait savoir qu'elle n'accepterait pas un dirigeant en qui elle ne peut pas avoir confiance. En l'absence d'alternative claire, un compromis émerge : le général Alfredo Stroessner, figure montante de l'armée mais sans liens profonds avec aucune faction politique, est considéré comme un candidat neutre. Le parti le considère comme une solution temporaire, tandis que les militaires le voient comme un gage de stabilité et de sécurité."
 PAR_place_blame_desc:0 "Le président Federico Chaves étant démis de ses fonctions, le gouvernement doit maintenant présenter une explication officielle des événements du coup d'État. Même si le coup d'État s'est déroulé rapidement, il n'a pas été sans justification : Chaves avait tenté de renverser l'ordre au sein du parti Colorado et les dirigeants militaires considéraient son maintien au pouvoir comme une menace à la stabilité nationale. Les dirigeants du Parti Colorado et l'armée se sont désormais alignés pour considérer le coup d'État comme une correction nécessaire, garantissant que le Paraguay reste sur la voie de la stabilité et de l'unité. Cependant, certaines factions au sein du parti, ainsi que les fidèles de Chaves, ne seront peut-être pas aussi faciles à convaincre."
 PAR_may_decree:0 "Décret du 20 mai 1954"
 PAR_may_decree_desc:0 "Sous la direction du président par intérim Tomás Romero Pereira, le Paraguay a pris des mesures pour renforcer ses relations diplomatiques avec l'Argentine, marquant ainsi une nouvelle phase dans la coopération régionale. Dans un geste symbolique de bonne volonté, le gouvernement argentin a restitué les trophées de guerre historiques remportés lors de la guerre de la Triple Alliance, une mesure destinée à renforcer les liens entre les deux nations. Alors que le pays se prépare à de nouvelles élections, il sera crucial pour la prochaine administration d'assurer un soutien diplomatique continu."
 PAR_establish_us_support:0 "Établir des relations préliminaires avec les États-Unis"
 PAR_establish_us_support_desc:0 "\"En politique internationale, en général, le gouvernement du Paraguay apporte un soutien résolu aux États-Unis d'Amérique, en tant que leader du monde libre, dans leur lutte contre le communisme international, et nous partageons avec cette grande nation les idéaux de justice, de paix, de droits et de liberté, afin que le monde dans lequel nous vivons soit plus sûr et ait plus de garanties collectives et individuelles.\" - Alfredo Stroessner"
 PAR_take_over_guion_rojo:0 "Reprendre Guión Rojo"
 PAR_light_industry:0 "Développer la fabrication légère"
 PAR_invest_agraculture:0 "Projet d'aide aux agriculteurs"
 PAR_anti_soviet_action:0 "Action antisoviétique"
 PAR_mendez_coup_desc:0 "À la fin de 1955, les tensions au sein du Parti Colorado avaient atteint un point de rupture. Epifanio Méndez Fleitas, enhardi par son influence sur l'économie et les médias, avait cherché à unifier le parti à travers le Reencuentro d'octobre, le présentant comme un moment de consolidation contre les divisions internes. Ce qui a commencé comme une lutte politique est sur le point de devenir une bataille pour le pouvoir."
 PAR_assign_ynsfran:0 "Nommer Edgar Ynsfrán au poste de ministre de l'Intérieur"
 PAR_assign_ynsfran_desc:0 "Pour renforcer encore son emprise sur le pouvoir, le président Stroessner a décidé de nommer Edgar Ynsfrán au poste de ministre de l'Intérieur, plaçant ainsi l'un de ses alliés idéologiques les plus fiables en charge de la sécurité intérieure et de la stabilité politique du Paraguay. Fervent nationaliste, farouche anticommuniste et partisan de longue date d'un régime autoritaire, Ynsfrán considère les traditions paramilitaires du Parti Colorado comme essentielles au maintien de l'ordre. Fort de son expérience dans le domaine des forces de l'ordre et de Guión Rojo, il utilisera le ministère de l'Intérieur comme un outil pour étendre le contrôle de l'État et éliminer l'opposition, garantissant ainsi que le Paraguay reste fermement sous le régime de Stroessner."
 PAR_control_media:0 "Resserrez la prise sur la presse et le support"
 PAR_party_unity_two:0 "Fidélité sécurisée"
 PAR_party_unity_two_desc:0 "Avec l'éviction récente de la menace épifeniste, le président Stroessner reconnaît la nécessité impérative de consolider la loyauté au sein du parti. Au lendemain de la tentative de coup d'État, les voix dissidentes doivent être réduites au silence et une allégeance inébranlable au régime doit être assurée."
 PAR_1958_elections:0 "Élections générales de 1958"
 PAR_take_over_guion_rojo_desc:0 "Ou les faire s'allier contre Stoesnner ?"
 PAR_imporve_brazilian_relations:0 "Améliorer les relations avec le Brésil"
 PAR_army_friends:0 "Récompensez vos amis dans l'armée"
 PAR_army_friends_desc:0 "Corruption pour l'armée"
 PAR_strike_chavez_supporters:0 "Grèvez les partisans de Chávez"
 PAR_strike_chavez_supporters_desc:0 "Avec l'éviction récente de la menace épifeniste, le président Stroessner reconnaît la nécessité impérative de consolider la loyauté au sein du parti. Au lendemain de la tentative de coup d'État, les voix dissidentes doivent être réduites au silence et une allégeance inébranlable au régime doit être assurée."
 PAR_ramp_up_anti_communism:0 "Intensifier l'action anticommuniste"
 PAR_austerity_measures:0 "Programme d'austérité"
 PAR_austerity_measures_desc:0 "Face à la hausse de l'inflation et à la détérioration de l'économie, le président Stroessner a adopté des mesures d'austérité strictes pour restaurer la stabilité. Les dépenses sont réduites, le crédit est resserré et la discipline financière est imposée, dans le but de freiner l'inflation et d'assurer la croissance à long terme. Toutefois, ces réformes sont profondément impopulaires. Les officiers militaires, habitués aux prêts faciles, sont mécontents de perdre leurs privilèges financiers, tandis que les élites du monde des affaires s'opposent à la répression du crédit libre. Malgré les réactions négatives, Stroessner reste ferme : l'ordre économique doit passer avant la convenance politique."
 PAR_american_loans:0 "Prêts américains sécurisés"
 PAR_west_german_ties:0 "L'aide ouest-allemande ?"
 PAR_1958_elections_desc:0 "GetLeader a remporté les élections"
 PAR_woo_rural_pop:0 "Programme de sensibilisation agraire"
 PAR_woo_rural_pop_desc:0 "L'allégeance du coeur du pays étant cruciale pour la stabilité du régime, le président Stroessner a proposé le Programa de divulgación agraria. En courtisant l'oligarchie rurale traditionnelle, dominée par les latifundistes de conviction libérale, Stroessner vise à obtenir son soutien par le biais de réformes agricoles ciblées et d'investissements dans les infrastructures."
 PAR_jungle_camps:0 "Projet de détention à distance"
 PAR_jungle_camps_desc:0 " Avec un nombre croissant de dissidents qui menacent la stabilité du régime, il devient impératif d'étendre le réseau de camps d'internement dans la jungle. Ces camps, cachés au plus profond du feuillage dense, servent à réprimer l'opposition et à maintenir le contrôle. Sous couvert de sécurité nationale, les individus considérés comme une menace pour le régime sont internés, garantissant ainsi que la dissidence reste réduite au silence et que la loyauté envers le régime soit renforcée."
 PAR_brazil_paraguay_commission:0 "Commission mixte paraguayenne-brésilienne"
 PAR_brazil_paraguay_commission_desc:0 "La Comisión Mixta Paraguayo-Brasileña a joué un rôle déterminant dans la définition et la démarcation de la frontière entre le Paraguay et le Brésil depuis sa création par le Protocole d'instructions de 1930. Cette commission mixte a travaillé avec diligence pour délimiter, délimiter et caractériser nos frontières communes, garantissant la clarté et la coopération entre nos nations. En renforçant cette commission, nous visons à améliorer les relations bilatérales, à faciliter les projets d'infrastructures transfrontalières et à promouvoir la stabilité régionale"
 PAR_dnat:0 "Dirección Nacional de Asuntos Técnicos"
 PAR_repress_students:0 "Suppression académique"
 PAR_repress_students_desc:0 "Opérant sous prétexte d'anticommunisme, le régime cible les étudiants et les intellectuels soupçonnés d'entretenir des idéologies subversives. Par la surveillance, l'intimidation et la censure, le régime vise à éradiquer la dissidence intellectuelle et à garantir une loyauté inébranlable envers son idéologie."
 PAR_expand_party_media:0 "Développer les médias de fête"
 PAR_expand_party_media_desc:0 " les nombreux médias du parti, notamment le quotidien Patria et l'émission de radio \"La Voz del Coloradismo\", ont promu la vision du gouvernement sur les événements nationaux et internationaux. En outre, le parti a utilisé ses organisations auxiliaires, qui comprenaient des associations professionnelles, des groupes d'anciens combattants, des fédérations de femmes, des groupes de paysans, des sociétés culturelles et des clubs d'étudiants, pour maintenir le contact avec pratiquement tous les secteurs du pays. "
 PAR_genral_strike_58:0 "Général de Huelga"
 PAR_genral_strike_58_desc:0 "La grève a été déclenchée par la Confederación Paraguaya de Trabajadores (CPT ; « Confédération des travailleurs paraguayens »), avec des revendications telles qu'une augmentation de 30 % des salaires, une déclaration d'amnistie générale, la levée de l'état d'urgence, une politique économique plus équitable, la garantie de la liberté de participer aux activités politiques et syndicales et la tenue d'une assemblée constituante"
 PAR_repress_some_more:0 "Répression de la dissidence électorale"
 PAR_repress_some_more_desc:0 "Après les élections controversées de 1958, le président Stroessner réagit rapidement pour réprimer la dissidence de l'opposition. Malgré les affirmations de victoire, le mécontentement couve parmi ceux qui contestent la légitimité du processus électoral."
 PAR_arrest_strike_leaders:0 "Frappez les grévistes"
 PAR_arrest_strike_leaders_desc:0 "Il n'y aura pas de négociations. Le gouvernement ne peut pas se permettre de faire preuve de faiblesse face à la subversion. Le président Stroessner a ordonné une action immédiate et massive contre les grévistes : les forces policières et militaires sont mobilisées pour réprimer tous les rassemblements, arrêter les dirigeants de la grève et démanteler les infrastructures syndicales. Le CPT sera brisé, garantissant que les syndicats ne remettront plus jamais en cause l'autorité de l'État."
 PAR_seize_cpt:0 "Prendre le contrôle du CPT"
 PAR_attempt_negotations:0 "Tentative de négociation"
 PAR_attempt_negotations_desc:0 "Pris de court par la grève générale, le gouvernement a décidé de poursuivre une double stratégie : offrir des concessions limitées tout en se préparant à démanteler le mouvement. Stroessner a autorisé une modeste augmentation des salaires pour tenter d'apaiser les grévistes, mais si les négociations échouent, l'État agira de manière décisive pour rétablir l'ordre. Les dirigeants du CPT apprendront bientôt que même si le gouvernement parle de dialogue, il ne tolérera pas la défiance."
 PAR_increase_law_enforcment_budget:0 "Augmenter le budget de l'application de la loi"
 PAR_increase_law_enforcment_budget_desc:0 "Tout cela au nom de l'anticommunisme."
 PAR_usa_counterins:0 "Formation contre-insurrectionnelle"
 PAR_usa_counterins_desc:0 "L'aide militaire des États-Unis contribue à renforcer les compétences de l'armée en matière de guerre contre-insurrectionnelle"
 PAR_mengle:0 "Accorder la citoyenneté à Mengle"
 PAR_liberal_59:0 "Libéralisation de 1959"
 PAR_liberal_59_desc:0 "En avril 1959, l'état de siège fut levé, les exilés de l'opposition autorisés à revenir, la censure de la presse levée, les prisonniers politiques libérés et une nouvelle Constitution promise pour remplacer la Constitution autoritaire de 1940."
 PAR_rural_help:0 "Sécuriser le soutien rural"
 PAR_promulgate_new_constituion:0 "La Constitution de 1959"
 PAR_promulgate_new_constituion_desc:0 "Commencez à le faire. Cela n'arrive jamais."
 PAR_capital_student_riot:0 "Émeutes étudiantes d'Asunción"
 PAR_dissolve_parlament:0 "Dissoudre le Parlement"
 PAR_reintroduce_sog:0 "Cours de libéralisation inversée"
 PAR_strike_stoessner:0 "Revuelta Unitaria"
 PAR_strike_stoessner_desc:0 "Malgré les tentatives de Stroessner pour maintenir son emprise sur le pouvoir, Epifanio Méndez a défié tous les pronostics, réussissant à unir le parti et l'armée contre lui. Dans une tournure remarquable des événements, la direction de Méndez a comblé le fossé de longue date entre ces deux piliers de l'autorité paraguayenne, en forgeant une formidable coalition visant carrément à renverser Stroessner."
 PAR_invest_in_public_works:0 "Investir dans les travaux publics"
 PAR_control_food_prices:0 "Restreindre les prix du boeuf"
 PAR_control_food_prices_desc:0 "Le président Epifanio Méndez Fleitas, partisan de longue date de l'intervention économique, a une fois de plus adopté une position ferme contre la hausse des prix de la viande bovine. Dans un défi direct aux élites rurales et aux grands propriétaires fonciers, son administration a décidé d'imposer un contrôle strict des prix sur le produit le plus essentiel du Paraguay. Bien que cette mesure soit très populaire parmi les pauvres et la classe ouvrière des villes, l'Asociación Rural del Paraguay y voit une atteinte inacceptable à leurs libertés économiques. Les propriétaires fonciers et les exportateurs, habitués à profiter des marchés étrangers, se retrouvent désormais en porte-à-faux avec l'État."
 PAR_grant_peron_stay:0 "Autoriser Perón à rester"
 PAR_improve_argentina_ties:0 "Améliorer les liens avec l'Argentine"
 PAR_promote_fredesvinda:0 "Donner du pouvoir à Fredesvinda"
 PAR_promote_fredesvinda_desc:0 "Inspiré par les manoeuvres politiques de Perón, Epifanio Méndez prend une décision audacieuse en promouvant son épouse, Fredesvinda Vall, à un poste important et influent au sein du gouvernement. Dans un geste qui n'est pas sans rappeler l'élévation d'Eva Perón par Perón, Méndez reconnaît le potentiel de son épouse en tant qu'alliée puissante et symbole de soutien populaire."
 PAR_relax_media:0 "Assouplir la censure des médias"
 PAR_support_peronistas:0 "Soutenez les péronistes en Argentine"
 PAR_promote_paraguyan_music:0 "Promouvoir la culture paraguayenne dans le monde"
 PAR_promote_paraguyan_music_desc:0 "Alors que le Paraguay est souvent négligé sur la scène mondiale, notre identité culturelle, mêlant l'héritage guarani à la tradition espagnole, reste l'un de nos atouts les plus puissants et inexploités. Le président Epifanio Méndez Fleitas, lui-même musicien renommé et champion du style guarania, comprend que le soft power peut réaliser ce que la diplomatie seule ne peut pas réaliser. Cette initiative parrainera des artistes, musiciens et écrivains paraguayens à l'étranger, présentant ainsi nos traditions uniques au monde"
 PAR_end_death_squads:0 "Dissoudre l'Escuadrón de la muerte"
 PAR_strike_against_corruption:0 "Grève contre la corruption"
 PAR_simplify_trade_with_argentina:0 "Simplifiez le commerce avec l'Argentine"
 PAR_improve_argentina_ties_desc:0 "Séjours à Péron"
 PAR_grant_peron_stay_desc:0 "Péron est parti"
 PAR_peoples_welfare:0 "Programme de santé communautaire"
 PAR_union_rights:0 "Assouplir les restrictions imposées aux syndicats"
 PAR_end_guion_rojo:0 "Dissoudre le Guión Rojo"
 PAR_end_guion_rojo_desc:0 "En réponse au défi persistant posé par la milice Guión Rojo, nous devons adopter des mesures décisives pour éliminer cette menace à la stabilité nationale."
 PAR_native_rights:0 "Programme d'égalité autochtone"
 PAR_native_rights_desc:0 "Conscient de la marginalisation historique des communautés autochtones du Paraguay, le président Méndez se lance dans un voyage de transformation pour élever leur statut au sein de la nation. Inspiré par le précédent créé par Perón en Argentine, Méndez lance une série de réformes radicales visant à renforcer les droits et les opportunités disponibles pour les peuples autochtones. Grâce à des mesures législatives globales et à des initiatives socio-économiques ciblées, Méndez cherche à autonomiser les communautés autochtones, en leur accordant une plus grande autonomie, une plus grande représentation et un meilleur accès aux ressources"
 PAR_copacar:0 "Développer COPACAR"
 PAR_copacar_desc:0 "Dans le but de renforcer le secteur agricole du Paraguay et d'aider les petits propriétaires fonciers, le président Méndez dévoile son projet d'agrandir la Corporación Paraguaya de Carnes (COPACAR). Conscient de l'emprise monopolistique de COPACAR sur le marché du commerce de la viande, Méndez entend exploiter son influence pour soutenir les minifundistas et autres petits propriétaires fonciers. Grâce à des investissements ciblés et à des mesures réglementaires, Méndez cherche à responsabiliser ces parties prenantes, en leur offrant un meilleur accès aux marchés et aux ressources"
 PAR_education_increase:0 "Investir dans l'éducation"
 PAR_end_one_party_state:0 "Lever l'interdiction des partis politiques"
 PAR_58_elec_epif:0 "Élections de 1958"
 PAR_anc_victory:0 "Méndez réélu"
 PAR_anc_victory_desc:0 "Sous Epifanio"
 PAR_liberal_party:0 "Parti libéral"
 PAR_liberal_party_desc:0 "  Ernesto Gavilan"
 PER_febrerista:0 "Partido Revolucionario Febrerista"
 PAR_expel_nazis:0 "Campagne antifasciste"
 PAR_bolvian_relations:0 "Se réconcilier avec la Bolivie"
 PAR_bolvian_relations_desc:0 "La guerre du Chaco reste une cicatrice dans notre mémoire nationale, entravant les relations avec notre voisin sans littoral. Même si l'administration précédente recherchait la réconciliation, ses efforts étaient limités. Notre gouvernement poursuivra une nouvelle ère de relations avec la Bolivie, fondée non seulement sur une histoire commune, mais aussi sur des intérêts économiques partagés. L'ouverture des frontières au commerce et aux investissements profitera à nos deux nations et démontrera une nouvelle approche mature de la diplomatie régionale, libérée des postures nationalistes du passé."
 PAR_replace_old_officers:0 "Remplacer les anciens généraux"
 PAR_replace_old_officers_desc:0 "Après être devenu président, Stroessner a pris sa retraite de nombreux généraux plus âgés - en particulier des Colorados engagés dont la loyauté était principalement envers le parti."
 PAR_expel_nazis_desc:0 "Pendant trop longtemps, le Paraguay a servi de refuge sombre aux restes du fascisme européen. Les régimes précédents, que ce soit par complicité ou par négligence, ont permis à ces éléments malveillants de s'implanter dans notre société. C'est une honte pour notre nation et une menace pour notre nouvelle démocratie. Nous lancerons une campagne à grande échelle pour identifier, arrêter et expulser tous les agents fascistes et criminels de guerre. Le Paraguay sera un bastion de liberté et non un refuge pour les tyrans."
 PAR_south_american_trade:0 ""
 PAR_purge_remaining_stroessnerists:0 "Purger les stroessneristes restants"
 PAR_purge_remaining_stroessnerists_desc:0 "Stroessner a peut-être été vaincu, mais son réseau de loyalistes, d'informateurs et de militaires radicaux reste ancré au sein de l'appareil d'État. Nous devons agir de manière décisive pour démanteler ce réseau fantôme, en retirant ses partisans des postes clés dans l'armée et le gouvernement afin de garantir une fois pour toutes l'avenir démocratique de la nation."
 PAR_icnreased_state_managment:0 "Augmenter la surveillance gouvernementale sur les entreprises"
 PAR_anticommunism:0 "Rassurez nos amis américains"
 PAR_anticommunism_desc:0 "Nos réformes populistes, nos politiques foncières et notre action culturelle indépendante ont mis Washington... Mal à l'aise. Des inquiétudes se font entendre au sein du Département d'État selon lesquelles notre gouvernement serait « indulgent envers le communisme ». Ces soupçons sont sans fondement, mais dangereux. Nous devons faire un geste clair et public pour assurer les États-Unis de notre position antisoviétique. Une déclaration formelle de solidarité anticommuniste garantira notre place dans le monde libre et, surtout, maintiendra à distance l'intervention américaine."
 PAR_new_constitution:0 "Nouvelle Constitution"
 PAR_new_constitution_desc:0 "La Constitution autoritaire de 1940, vestige d'une époque révolue, est inadaptée au nouveau Paraguay. Il fournit le cadre juridique du despotisme et de l'intervention militaire en politique. Pour garantir nos réformes, nous convoquerons une assemblée constituante pour rédiger une nouvelle charte nationale, qui consacrera la suprématie civile, protégera les droits de tous les citoyens et jettera les bases juridiques d'un État démocratique juste et moderne."
 PAR_basic_welfare:0 "Introduire une protection sociale de base"
 PAR_basic_welfare_desc:0 "La force d'une nation se mesure non seulement par son économie, mais aussi par le bien-être de ses citoyens. Pendant trop longtemps, les bénéfices du progrès ont été concentrés entre les mains de l'élite, tandis que la classe ouvrière et les ruraux pauvres sont laissés pour compte. Notre gouvernement doit défendre la justice sociale. Ce plan établira un système de protection sociale fondamental, créant un filet de sécurité sociale pour protéger les travailleurs, les personnes âgées et les personnes vulnérables. En garantissant un niveau de vie de base, nous non seulement élevons notre peuple, mais nous renforçons également le soutien populaire à notre voie démocratique."
 PAR_renewed_colorado:0 "Colorado Rénové"
 PAR_renewed_colorado_desc:0 "Le Parti Colorado ne se limite pas à ses dirigeants corrompus ; c'est le parti historique du peuple paraguayen. Le démanteler reviendrait à abandonner un siècle de patrimoine et le lien qu'il entretient avec le peuple. La meilleure façon est de le racheter. Nous achèverons notre purge des partisans de la ligne dure et recentrerons le parti de l'intérieur. Nous récupérerons ses racines populistes et le transformerons en un instrument moderne et démocratique de la volonté populaire, fidèle non pas aux caudillos mais à la nation."
 PAR_increase_military_wages:0 "Augmenter les salaires des militaires"
 PAR_increase_military_wages_desc:0 "Même si la direction stroessneriste doit être purgée, le soldat de base reste le garant de notre souveraineté. L'armée est depuis longtemps un foyer de conspiration politique, souvent alimentée par de bas salaires et de mauvaises conditions de travail. Pour garantir leur loyauté envers la nation plutôt qu'envers des généraux ambitieux, nous professionnaliserons les forces armées en augmentant les salaires et en améliorant le niveau de vie de tous les militaires."
 PAR_increase_electricity_access:0 "Complexe Energético Méndez"
 PAR_religious_freedom:0 "Autoriser plus de libertés religieuses"
 PAR_religious_freedom_desc:0 "L'influence écrasante de l'État a parfois étouffé les diverses confessions qui font la force de notre peuple. Même si le catholicisme est le coeur de notre nation, une société véritablement libre doit respecter toutes les croyances. Nous relâcherons le contrôle de l'État sur les organisations religieuses et garantirons le droit de culte pour tous, y compris les communautés mennonites du Chaco et les confessions autochtones."
 PAR_judicracy_reform:0 "Planifier la réforme de la justice"
 PAR_open_economy:0 "Ouvrir l'économie"
 PAR_american_treaty:0 "Accords d'Asunción"
 PAR_liberal_constituion:0 "Grande Constitution libérale"
 PAR_anti_communist_tactics:0 "Un anticommunisme plus profond"
 PAR_anti_communist_tactics_desc:0 "Alors que le gouvernement Méndez a fait un discours anticommuniste du bout des lèvres, ses politiques populistes, notamment l'intervention de l'État, le contrôle des prix et l'apaisement des syndicats, ont créé un terrain fertile pour les idéologies subversives. Notre position doit être claire et inébranlable. Le Partido Libéral alignera pleinement le Paraguay sur le monde libre dans la lutte mondiale contre l'expansionnisme soviétique. Nous renforcerons notre sécurité intérieure et prouverons à nos alliés, notamment aux États-Unis, que nous sommes un partenaire fiable dans la défense de la civilisation occidentale."
 PAR_investigate_colorado_crimes:0 "Enquêter sur le parti Colorado"
 PAR_investigate_colorado_crimes_desc:0 "Nous ne pouvons pas construire une nouvelle démocratie sur la base de la corruption et de l'impunité. Le règne du parti Colorado, qui a duré plusieurs décennies, a été défini par la violence politique, les détournements de fonds et la création de groupes paramilitaires obscurs comme le Guión Rojo. Nous créerons une commission formelle pour enquêter sur ces activités et traduire les responsables en justice. Les gens méritent de connaître la vérité et la primauté du droit doit s'appliquer à tous."
 PAR_sweep_away:0 "Regarder ailleurs"
 PAR_sell_state_companies:0 "Commencer à vendre des sociétés d'État"
 PAR_oas_cooperation:0 "Coopération accrue avec l'OEA"
 PAR_oas_cooperation_desc:0 "En tant que nouvelle démocratie, il est impératif que nous dialoguions avec la communauté internationale. L'Organisation des États américains est le principal forum de coopération hémisphérique et de défense des principes démocratiques. Nous augmenterons activement notre participation à l'OEA, en alignant notre politique étrangère sur celle de nos voisins démocratiques et en contribuant à une Amérique stable et prospère."
 PAR_american_media:0 "Autoriser le financement étranger des médias"
 PAR_american_media_desc:0 "Une société libre nécessite une presse libre. L'administration précédente, tout en assouplissant la censure de l'État, utilisait toujours les journaux alignés sur l'État pour promouvoir son programme populiste. Pour garantir un paysage médiatique véritablement diversifié, nous garantirons non seulement la liberté de la presse, mais accueillerons également le soutien des partenaires internationaux. Autoriser les médias et les programmes journalistiques financés par les États-Unis contribuera à contrer la propagande subversive et offrira à nos citoyens une fenêtre claire et objective sur le monde libre."
 PAR_new_decade:0 "La Nouvelle Década des 60"
 PAR_workers_rights:0 "Droits limités des travailleurs"
 PAR_workers_rights_desc:0 "Nous devons être un parti des travailleurs. En réponse à la pression croissante en faveur du changement, des concessions limitées sont accordées à la main-d'oeuvre. Les nouvelles politiques visent à équilibrer réforme et contrôle, offrant des progrès sans porter atteinte à l'autorité de l'État."
 PAR_central_bank_fix:0 "Réformer le PCA"
 PAR_central_bank_fix_desc:0 "La Banco Central del Paraguay était le domaine personnel d'Epifanio Méndez. Bien qu'il soit désormais notre allié, ses politiques interventionnistes de l'État constituent un point de friction. Pour réaffirmer notre propre agenda, nous devons réformer le BCP, en le plaçant sous le contrôle de nos propres experts financiers qui privilégient une approche plus modérée et plus stable de l'économie plutôt qu'une approche populiste."
 PAR_pena_continues_desc:0 "Remplacer Chaves par Angel Florentín Peña"
 PAR_pena_continues:0 "Florentin continue"
 PAR_ynsfarn:0 "Coup d'État d'Edgar Ynsfrán"
 PAR_take_control_of_everything:0 "L'armée rétablit l'ordre"
 PAR_dta:0 "Dirección Nacional de Asuntos Técnicos"
 PAR_dta_desc:0 "Robert Thierry, un responsable du Pentagone et vétéran de la guerre de Corée, a été envoyé des États-Unis pour aider le régime Stroessner à mettre en place la nouvelle organisation. Lors de la sélection des employés, le lieutenant-colonel Thierry a accordé une attention particulière à l'avocat Antonio Campos Alum. En 1957, Campos Alum effectue un stage aux États-Unis. À son retour au Paraguay, il fut chargé par Stroessner de diriger la DNAT."
 PAR_rural_initiativie:0 "Augmenter la production alimentaire"
 PAR_regional_ties:0 "Liens régionaux"
 PAR_crackdown_on_black_markets:0 "Répression du marché noir"
 PAR_loosen_export:0 "Assouplir les contrôles à l'exportation"
 PAR_clean_party:0 "Parti Propre de la Vieille Garde"
 PAR_ysfran_rises_desc:0 "La patience de l'armée s'épuise"
 PAR_reinforce_guijon_rojo:0 "Renforcer Guijon Rojo"
 PAR_price_controls:0 "Contrôles de prix limités"
 PAR_price_controls_desc:0 "J'ai essayé une fois et j'ai échoué mais cette fois ça marchera"
 PAR_recognize_concern:0 "Reconnaître les préoccupations des militaires"
 PAR_ysfran_rises:0 "Demande militaire"
 PAR_crackdown_on_dissidents:0 "Le gouvernement reste ferme"
 PAR_military_in_government:0 "Nommer l'allié d'Ynsfran au gouvernement"
 PAR_arrest_suspected_dissidents:0 "Arrêter les comploteurs présumés"
 PAR_bolster_police:0 "Renforcer la sécurité interne"
 PAR_bolster_police_desc:0 "Surtout des policiers"
 PAR_yegros_military_academy:0 "Créer l'Académie militaire Fulgencio Yegros"
 PAR_reinforce_party_loyality:0 "Renforcer la loyauté envers le parti"
 PAR_plan_healthcare:0 "Plan Sanitaires"
 PAR_five_yer_plan:0 "Plan de développement quinquennal"
 PAR_anit_corruption_flor:0 "Pas de place pour les opportunistes"
 PAR_farms_to_factories:0 "Expansion de la ferme à l'usine"
 PAR_farms_to_factories_desc:0 "Les fermes cultivent des matières premières pour les usines."
 PAR_civilian_supremacy:0 "Suprématie civile"
 PAR_trade_neutrality:0 "Neutralité commerciale"
 PAR_contitution_crisis:0 "Crise constitutionnelle"
 PAR_contitution_crisis_desc:0 "J'en ai besoin d'un nouveau, les militaires doivent être contents blabla"
 PAR_controlled_reforms:0 "Des réformes contrôlées"
 PAR_controlled_reforms_desc:0 "Réformes limitées sur certaines sections pour donner une apparence de changement."
 PAR_expand_cpt:0 "Développer le CPT"
 PAR_expand_cpt_desc:0 "Confédération paraguayenne des travailleurs"
 PAR_purge_cpt:0 "Purger le CPT"
 PAR_control_military:0 "Tentative de contrôle de l'armée"
 PAR_nis:0 "Syndicat National Industriel"
 PAR_nis_desc:0 "Avec l'expansion de l'économie, Peña cherche à formaliser des syndicats industriels soutenus par l'État, créant ainsi un cadre dirigé par le gouvernement pour réglementer et contrôler les industries privées tout en maintenant l'efficacité"
 PAR_future_of_paraguay:0 "L'avenir du Paraguay"
 PAR_future_of_paraguay_desc:0 "Alors que la décennie touche à sa fin, le gouvernement du président Peña se trouve à la croisée des chemins. Le Paraguay a connu des années de croissance et de stabilité contrôlées, mais des questions demeurent quant à l'orientation à long terme du pays. Le Paraguay poursuivra-t-il sa voie actuelle de développement étatique contrôlé, ou une transformation plus profonde est-elle nécessaire ?"
 PAR_encorage_education:0 "Poursuite des réformes de l'éducation"
 PAR_encorage_education_desc:0 "Malgré notre travail, il reste encore beaucoup à faire."
 PAR_establish_own_party:0 "Rétablir la PNCP"
 PAR_establish_own_party_desc:0 "Une fois le coup d'État terminé et les éléments traîtres de l'ancien régime purgés, le guide suprême Edgar Ynsfrán a exposé sa vision d'un nouveau Paraguay, construit sur la discipline absolue, la pureté idéologique et le contrôle total de l'État. Les institutions dépassées du passé, corrompues par des politiciens civils peu volontaires, seront remplacées par un État à parti unique sous la direction du §YPartido Nacional Socialista Paraguayo§!, qui renaîtra, garantissant que le destin du Paraguay sera guidé par une main ferme et inflexible. Le message est clair : c'est l'aube d'une nouvelle ère, une ère où l'ordre règne en maître et où seuls les fidèles ont une place dans le futur."
 PAR_ynsfran_purge:0 "Purger l'armée des éléments déloyaux"
 PAR_ynsfran_purge_desc:0 "Bien que l'armée ait aidé Ynsfrán à prendre le pouvoir, tous les officiers ne sont pas pleinement fidèles à son règne. Une purge radicale est ordonnée pour éliminer tous les éléments susceptibles de remettre en cause son autorité."
 PAR_purge_everyone_else:0 "Un Paraguay sans ennemis"
 PAR_purge_everyone_else_desc:0 "Toute opposition politique, des communistes aux conservateurs modérés, est systématiquement éliminée. La police secrète nouvellement créée lance une vague d'arrestations, de disparitions et d'exécutions pour s'assurer qu'il ne reste aucune dissidence."
 PAR_fortress_against_communism:0 "Une forteresse contre le communisme"
 PAR_fortress_against_communism_desc:0 "Le Paraguay se positionne comme le régime anticommuniste le plus puissant d'Amérique latine, s'alignant pleinement sur les intérêts américains dans la guerre froide. Ynsfrán propose le Paraguay comme base pour les opérations de renseignement antisoviétiques."
 PAR_welcome_exiled_allies:0 "Accueillir les alliés exilés"
 PAR_welcome_exiled_allies_desc:0 "Le Paraguay devient un refuge pour les fascistes exilés et les anciens officiers SS. Ces personnalités, considérant Ynsfrán comme un compagnon de voyage, offrent leurs ressources financières et leur expertise pour renforcer l'appareil de renseignement de l'État."
 PAR_militarize_economy:0 "Militarisation de l'économie"
 PAR_militarize_economy_desc:0 "Sous le règne d'Ynsfrán, la politique économique du Paraguay s'oriente vers une militarisation totale. Les usines sont placées sous contrôle militaire et toute la planification industrielle est alignée sur les besoins de sécurité nationale."
 PAR_new_century:0 "El Nuevo Siglo Paraguayo"
 PAR_exiles_in_gov:0 "Un gouvernement des exilés ?"
 PAR_advisory_council:0 "Conseil des exilés"
 PAR_ties_with_franco:0 "Établir des liens avec Franco"
