l_french:
 PAR_moilas_rule:0 "The Molas Government"
 PAR_moilas_rule_desc:0 "With Federico Chaves removed from power, the leadership of Paraguay has passed to Felipe Molas López, a loyal member of the Colorado Party. While his presidency is seen as a temporary measure, Molas López's government must now work to stabilize the nation and maintain party unity. The transition is delicate, and the future of Paraguay remains uncertain."
 PAR_party_unity:0 "Begin Party Unification"
 PAR_restore_democratic_inst:0 "Restoration of Democratic Institutions"
 PAR_restore_democratic_inst_desc:0 "President Molas has positioned himself as a reformer, advocating for the restoration of democratic institutions in Paraguay after years of political turmoil. His government has outlined a series of initiatives aimed at reconciling past conflicts, including granting amnesty to political dissidents and revolutionaries from the Civil War of 1947. However Molas lacks both the political influence and the time necessary to implement deeper structural reforms, leaving many to question whether this is truly a new beginning or merely a temporary veneer of progress."
 PAR_depose_molas:0 "Force Deposition of Felipe Molas"
 PAR_cement_chaves:0 "Confirm Federico Chaves's Position"
 PAR_army_focus:0 "Fuerzas Armadas de Paraguay"
 PAR_army_focus_desc:0 "The Paraguayan Armed Forces stand as the ultimate guarantors of national stability, their loyalty shaping the fate of every government. Whether ensuring internal order or defending against external threats, the military remains a pillar of power. Strengthening its structure, modernizing its command, and reaffirming its role in national affairs will be crucial for the nation's survival."
 PAR_army:0 "Ejército Paraguayo"
 PAR_army_desc:0 "As the backbone of Paraguay’s military strength, the Ejército Paraguayo must be reinforced to maintain internal security and deter external threats. Modernizing equipment, improving training, and expanding logistical capabilities will ensure the army remains the dominant force in national defense and governance."
 PAR_air_force:0 "Fuerza Aérea Paraguaya"
 PAR_air_force_desc:0 "Though relatively small, the Fuerza Aérea Paraguaya plays a crucial role in national defense. Expanding its capabilities, acquiring modern aircraft, and developing a strategic air command will strengthen Paraguay’s ability to project power and protect its sovereignty from above."
 PAR_chaves:0 "Pacificar Espiritualmente la Nación"
 PAR_1950_elections:0 "Call New Elections"
 PAR_1950_elections_desc:0 "To legitimize his rule and formally assume the presidency, Federico Chaves has called for new elections. While the outcome is all but certain, this vote will grant him the political mandate to complete Molas López’s unfinished term until 1953. With party backing and military support, Paraguay’s leadership is set to remain unchanged—at least for now."
 PAR_economy:0 "De Defensa de la Economía Nacional"
 PAR_economy_desc:0 "A strong nation requires a strong economy. Protecting key industries, stabilizing financial institutions, and ensuring state control over vital resources will be essential for Paraguay’s long-term security. Whether through government intervention or private sector incentives, the path forward must prioritize national economic resilience."
 PAR_undermine_rivals:0 "Combat Political Opponents"
 PAR_undermine_rivals_desc:0 "Combat Political Opponents"
 PAR_keep_allies_happy:0 "Keep Caudillos Happy"
 PAR_keep_allies_happy_desc:0 "In Paraguay, political power is not held by the government alone but also by the regional caudillos who control local networks of influence. To maintain stability, the administration must grant them favors, government positions, and economic opportunities, ensuring their continued loyalty."
 PAR_appoint_mendez:0 "Appoint Epifanio Méndez as Head of BCP"
 PAR_appoint_mendez_desc:0 "With the successful establishment of the Banco Central del Paraguay, President Chaves must now appoint a capable leader to steer the nation’s financial policies. After careful consideration, the government has selected Epifanio Méndez Fleitas, an experienced economist and political strategist, as the new head of the central bank. However, Méndez’s growing influence within the Colorado Party has not gone unnoticed. While his expertise is undeniable, some within the government quietly express concern that his ambitions may extend beyond economic matters."
 PAR_1953_elections:0 "The 1953 Elections"
 PAR_1953_elections_desc:0 "As Paraguay enters another election year, the Colorado Party—the sole legal political entity—once again stands unchallenged. With President Federico Chaves as the only candidate, his re-election is a mere formality rather than a contest. The party’s dominance ensures continuity and stability, reinforcing Paraguay’s trajectory under firm and experienced leadership."
 PAR_argentine_relations:0 "Strategic Alignment With Argentina"
 PAR_combat_inflation:0 "Measures Against Inflation"
 PAR_combat_inflation_desc:0 "Rising inflation threatens economic stability, eroding purchasing power and undermining public confidence. To curb its effects, the government must implement strict fiscal policies, regulate key markets, and stabilize currency values"
 PAR_keep_party_happy:0 "Follow Party Course"
 PAR_keep_party_happy_desc:0 "The party has made its position clear: economic policy must remain in national hands, guided by the principles that have sustained our movement. While some advocate for foreign-backed reforms and privatization, such policies risk surrendering national industries to outside interests and undermining the state’s role in economic development. Instead, we will reinforce state control over key sectors, ensuring that Paraguay’s economy serves the nation and its people, not foreign creditors or private profiteers."
 PAR_outside_party:0 "Look Outside For Economic Guidance"
 PAR_outside_party_desc:0 "Despite the party’s resistance, the realities of our economy cannot be ignored. State control and protectionism may provide stability, but they also hinder growth, efficiency, and modernization. We cannot allow ideology to stand in the way of economic progress. The world is changing, and if Paraguay is to secure its future, we must adapt and engage with the global market."
 PAR_army_membership:0 "Party Loyalty in the Ranks"
 PAR_army_membership_desc:0 "To ensure the unwavering loyalty of the armed forces, military membership will be increasingly restricted to members of the ruling party. This policy will reinforce political unity within the ranks, preventing the rise of disloyal officers and potential coup attempts. By aligning the military with the party’s ideology, we can create a more stable and controllable armed force, ensuring that the government remains firmly in command without the risk of dissent."
 PAR_fal_rifles:0 "Acquire FAL Rifles"
 PAR_light_tanks:0 "Programa de Tanques Ligeros"
 PAR_modern_air_tactics:0 "Study Modern Air Tactics"
 PAR_intel_network:0 "Setup Surveillance"
 PAR_1954_coup:0 "Stroessner's Gambit"
 PAR_Chaves_resigns:0 "Federico Chaves Resigns"
 PAR_arm_police:0 "Heavy Arms for National Police"
 PAR_arm_police_desc:0 "To bolster internal security and ensure law enforcement remains capable of handling any threat, the government is considering a plan to equip the National Police with heavier weaponry. Proponents argue that a well-armed police force will be better prepared to maintain order, particularly in times of unrest. However, the move has already raised concerns within the military, as some fear it could shift the balance of power and create unnecessary tensions between the police and the armed forces."
 PAR_strenghten_party_line:0 "Efforts to Unify Party"
 PAR_strenghten_party_line_desc:0 "With internal divisions threatening the stability of the ruling party, President Federico Chaves has taken steps to consolidate leadership and strengthen party unity. Efforts are being made to bridge ideological rifts, reinforce party discipline, and ensure that all factions remain aligned behind a common vision for Paraguay’s future."
 PAR_amend_constitution:0 "Seek to Amend The Constitution"
 PAR_status_quo_con:0 "Cave To Party Pressure"
 PAR_simplify_border_check:0 "Simplify Border Protocols With Argentina"
 PAR_simplify_border_check_desc:0 "With Paraguay and Argentina sharing deep economic and historical ties, efforts are underway to streamline border protocols to facilitate trade, travel, and diplomatic cooperation. By reducing bureaucratic hurdles and improving coordination, the government seeks to strengthen economic ties while ensuring efficient cross-border movement. These measures aim to foster greater regional integration and reinforce Paraguay’s position within the Southern Cone."
 PAR_no_dice:0 "No Dice"
 PAR_expandd_education:0 "PAR_expandd_education"
 PAR_expand_education:0 "Expand Education Access"
 PAR_expand_education_desc:0 "Education is the foundation of national progress, and ensuring broader access to schooling has become a key priority for the government. Efforts are underway to strengthen the education system, making it more accessible to communities across the country."
 PAR_negotiate_with_brazil:0 "Negotiate With Brazil"
 PAR_negotiate_with_brazil_desc:0 "For decades, our relationship with Brazil has been a mixture of cautious diplomacy and unresolved disputes. The border tensions over the Apa River and the burden of historical debts pose significant challenges to our national interests. President Federico Chaves believes that a negotiated settlement can prevent hostilities and secure economic stability. However, these talks must be handled carefully—offering too many concessions could weaken Paraguay’s sovereignty, while demanding too much might lead to renewed tensions. The outcome of these negotiations will shape our future relations with our powerful neighbor."
 PAR_anti_communist_operations:0 "Expand Anti-Communist Operations"
 PAR_anti_communist_operations_desc:0 "Our nation faces a growing threat from communist subversion, endangering our stability and way of life. To counter this, we are taking decisive action to strengthen intelligence operations, tighten internal security, and root out subversive elements before they can spread. Closer coordination between the National Police, military intelligence, and state security forces will ensure that leftist agitators and dissidents are kept under strict surveillance, safeguarding the nation from their disruptive influence."
 PAR_reverse_engineer_designs:0 "Reverse Engineer Foreign Designs"
 PAR_national_companies:0 "Limited Nationalization"
 PAR_regulate_private_sector:0 "Regulate Private Sector"
 PAR_adopt_fmi:0 "Adopt the FMI Recommendations"
 PAR_privatize_state:0 "Privatize the State-Owned Enterprises"
 PAR_infrasctruture:0 "Expand The Railways"
 PAR_infrasctruture_desc:0 "A strong nation requires strong infrastructure, and Paraguay’s rail network remains underdeveloped compared to its neighbors. Expanding and modernizing our railways will improve logistical efficiency, allowing for faster troop movements, better resource distribution, and increased economic activity."
 PAR_cultural_development:0 "Promote Cultural Development"
 PAR_cultural_development_desc:0 "Recognizing the importance of national identity and tradition, the government has placed a renewed emphasis on cultural growth and preservation. Through various initiatives, efforts are being made to strengthen Paraguay’s heritage and ensure that culture remains a cornerstone of national unity. As modernization progresses, it is essential that the values and identity of the nation are upheld, allowing Paraguay to move forward while staying true to its roots."
 PAR_growing_opposition:0 "Growing Conservative Opposition"
 PAR_purge_military:0 "Large Scale Military Purge"
 PAR_support_conservative_coup:0 "Support Conservative Coup"
 PAR_currency_reform:0 "Guaraní Reform"
 PAR_currency_reform_desc:0 "The stability of our economy depends on a strong and reliable national currency. Without proper oversight, inflation, volatility, and inefficiencies threaten long-term growth. To ensure economic resilience, reforms to the Guaraní will focus on stabilization, modernization, and improved fiscal policies, reinforcing confidence in our financial system."
 PAR_urban_development:0 "Urban Development"
 PAR_police_impro:0 "Increase Police Funding"
 PAR_amend_constitution_desc:0 "Fake path, cant be done"
 PAR_reduce_spending:0 "Reduce Government Spending"
 PAR_replace_mendez:0 "Replace Epifanio Méndez"
 PAR_replace_mendez_desc:0 "Epifanio Méndez Fleitas’ tenure as head of the Paraguayan Central Bank has been marked by bold economic policies, state intervention, and growing political ambition. However, his leadership has increasingly drawn opposition from powerful economic elites, conservative factions of the Colorado Party, and elements of the military. His recent economic decisions—particularly his resistance to raising beef prices—have placed him at odds with the Asociación Rural del Paraguay, a key power bloc within the country. Meanwhile, growing tensions between pro-Peronist and anti-Peronist elements within the government have made his position untenable."
 PAR_confront_military:0 "Reshuffle the Cabinet"
 PAR_confront_military_desc:0 "President Federico Chaves has enacted a significant cabinet reshuffle, replacing several ministers and appointing new officials to key government positions. While officially done to improve governance, the changes have sparked quiet speculation within political circles. Some see it as a routine adjustment, while others suspect deeper political motives at play."
 PAR_party_opposition:0 "Reaffirm Civilian Authority"
 PAR_party_opposition_desc:0 "Since the turbulent political shifts of the past decade, the Paraguayan military has played an outsized role in national governance, often acting as a power broker within the Colorado Party. While President Federico Chaves himself came to power with military backing, he now seeks to reassert civilian leadership and reduce the armed forces' direct influence over political decisions. However, officers within the General Staff and party hardliners who view the military as the guardian of national order are beginning to grow uneasy. Some whisper that Chaves is undermining the very structure that ensures Paraguay’s stability."
 PAR_military_compromise:0 "Seek Compromise With Military"
 PAR_stoessner_takes_over:0 "Stroessner Elected"
 PAR_stoessner_takes_over_desc:0 "With Paraguay’s political transition underway, the nation prepares for a special presidential election to formally decide the successor to Federico Chaves. Although framed as an exercise in democratic continuity, the reality is clear—General Alfredo Stroessner, leader of the May 4 coup, stands unopposed as the Colorado Party’s candidate. The party, still fragmented between various factions, views Stroessner as a temporary solution to maintain stability, while the military ensures that the election proceeds without disruption."
 PAR_resist_us_ilnfuence:0 "Resist American Influence"
 PAR_party_influence:0 "Increase Colorado Influence"
 PAR_support_democratic_allies:0 "Strengthen the Democráticos Faction"
 PAR_support_democratic_allies_desc:0 "President Federico Chaves has increasingly relied on the Democráticos, the reformist faction within the Colorado Party, to counterbalance the influence of party hardliners and military elites. This group supports greater civilian control over the government, economic interventionism, and a more independent foreign policy—positions that directly challenge the party’s conservative old guard. For now, Chaves is confident that backing this faction will secure his government’s future, but as internal tensions rise, some within the party may not remain loyal forever."
 PAR_old_guard:0 "Reward The Old Guard"
 PAR_virgilio:0 "Gambit of Virgilio Candia"
 PAR_restore_order:0 "Restore Stability"
 PAR_place_blame:0 "Explain The Coup"
 PAR_death_squads:0 "Escuadrón de la Muerte"
 PAR_death_squads_desc:0 "With opposition to the regime still lingering in the shadows, President Alfredo Stroessner has authorized the formation of the Escuadrón de la Muerte. Comprised of trusted party loyalists, military operatives, and handpicked security forces, this unit operates outside the formal chain of command, ensuring that enemies of the state can be neutralized without legal obstruction. While officials will never acknowledge its existence, the message is clear: those who conspire against the regime will not be tolerated."
 PAR_secure_military_power:0 "Secure Power of Military"
 PAR_mendez_coup:0 "La Reencuentro"
 PAR_ramp_up_communism:0 "Ramp Up Anti-Communism"
 PAR_mass_censorship:0 "Seize The Media"
 PAR_crush_the_rebellion:0 "Clean Party From Epfenistas"
 PAR_mendez_coup_succes:0 "Front Against Stroessner"
 PAR_conspire_stoessner_out:0 "Unlikely Deal"
 PAR_conspire_stoessner_out_desc:0 "Party and Mendez make deal to repalce Stoessner with Justo Pastor Benítez"
 PAR_exile_mendez:0 "Send Méndez to Exile"
 PAR_secure_rule:0 "Nominate Méndez as Ambassador to Spain"
 PAR_rally_supporters:0 "Rally Supporters from Party"
 PAR_tear_colorado_down:0 "Tear Colorado Down"
 PAR_tear_colorado_down_desc:0 "Partido Nacionalista Revolucionario"
 PAR_party_meeting:0 "Hold a Party Convention"
 PAR_strengthen_image:0 "Fortify Chaves Public Image"
 PAR_open_discussion:0 "Steer the Party Line"
 PAR_imporve_worker_condition:0 "Improve Workers Conditions"
 PAR_m1_garands:0 "American Rifle Assistance"
 PAR_m1_garands_desc:0 "With growing security concerns, Paraguay looks to the United States for military aid. Through surplus programs, the U.S. has agreed to supply the Armed Forces with excess World War II rifles, machine guns, and other small arms. While not the most modern equipment, these weapons will significantly bolster our infantry forces, ensuring our soldiers are better armed for any conflict ahead."
 PAR_favour_argentinan_help:0 "Favour Argentinian Help"
 PAR_favour_argentinan_help_desc:0 "Argentina has long maintained one of the most disciplined and well-organized militaries in the region, with a strong emphasis on training and strategic planning. Strengthening our ties with Buenos Aires could open doors for collaboration, improving our own military infrastructure and preparedness. Yet, as with any alliance, deeper engagement comes with its own set of considerations."
 PAR_brazilian_help:0 "Favour Brazilian Help"
 PAR_brazilian_help_desc:0 "With Brazil’s growing military strength and increasing cooperation with international powers, deeper military ties could provide valuable opportunities for Paraguay. Their experience in modernization and logistics offers a chance to enhance our army’s capabilities, ensuring we remain prepared for any regional challenges. However, such a move is not without its diplomatic considerations, as regional dynamics continue to shift."
 PAR_us_donations:0 "Donations From Uncle Sam"
 PAR_us_donations_desc:0 "Uncle has blessed us with new planes"
 PAR_navy:0 "Armada Paraguaya"
 PAR_navy_desc:0 "The Paraguayan Navy is the maritime force of the Armed Forces of Paraguay, in charge of the defense of Paraguay's waters despite not having direct access to the sea. Despite this, it has a strong naval tradition by virtue of the fact that it has access to the Atlantic Ocean through the Paraguay–Paraná rivers."
 PAR_dispand_marines:0 "Disband the Marines"
 PAR_shermans:0 "M4 Sherman Tanks"
 PAR_motorization:0 "Motorize the Army"
 PAR_motorization_desc:0 "The days of relying solely on infantry and cavalry are coming to an end. To modernize Paraguay’s military capabilities, efforts will be made to acquire trucks, armored vehicles, and transport equipment, improving mobility and logistical efficiency."
 PAR_army_intelligence:0 "Bolster Army Intelligence"
 PAR_army_intelligence_desc:0 "In an era of growing uncertainty, information is as vital as firepower. The Paraguayan military must ensure it is not only prepared for conventional warfare but also for the covert struggles of espionage, counterintelligence, and internal security. By expanding our military intelligence capabilities, we can better monitor potential threats—both foreign and domestic—and safeguard national stability."
 PAR_iron_and_steel:0 "Hierro y Acero Program"
 PAR_iron_and_steel_desc:0 "Paraguay’s industrial sector has long relied on imports for essential materials, leaving us vulnerable to external disruptions. To address this, the Hierro y Acero Program will focus on expanding domestic iron and steel production, ensuring that our industries and military have access to the resources they need. By investing in new extraction sites, modernizing existing foundries, and refining production techniques, we can lay the groundwork for a more self-sufficient economy."
 PAR_factory_upgrades:0 "Invest In Modern Machining"
 PAR_factory_upgrades_desc:0 "Industrial progress relies on the ability to produce high-quality machinery and precision tools."
 PAR_depose_molas_desc:0 "With mounting dissatisfaction over his rule, the Colorado Party’s Governing Board convened to decide Molas López’s fate. In an extraordinary session, the vote was cast—his presidency no longer had their backing. Stripped of political support and faced with no alternative, Molas López's downfall became inevitable."
 PAR_chaves_desc:0 "With a new government in place, President Federico Chaves seeks to pacify the nation, calling for unity and stability after years of political unrest. However, his administration faces growing concerns over corruption, economic hardship, and the influence of political caudillos, which could threaten national cohesion if left unchecked."
 PAR_chaves_takes_over:0 "President Federico Chaves"
 PAR_rationing:0 "Introduce Temporary Rationing"
 PAR_rationing_desc:0 "With economic instability and shortages affecting essential goods, the government has introduced temporary rationing measures to ensure fair distribution and prevent profiteering. While necessary to stabilize the situation, this policy risks fueling discontent among those who see it as an opportunity for corruption and black-market dealings."
 PAR_stability:0 "Plan de Estabilización y Desarrollo"
 PAR_stability_desc:0 "With Paraguay’s economy still facing structural weaknesses, President Chaves has introduced the Plan de Estabilización y Desarrollo—a bold and strategic initiative aimed at securing financial stability and fostering national development. This plan prioritizes inflation control, infrastructure expansion, and the modernization of key industries, ensuring Paraguay remains competitive in an increasingly complex world. By attracting foreign capital and strengthening domestic production, the government aims to create a self-sustaining economy capable of long-term growth. Although some voices within the Colorado Party warn of overreliance on international investments, the administration reassures the nation that these measures are necessary for Paraguay’s future prosperity."
 PAR_no_dice_desc:0 "The Coup That Never Came"
 PAR_emergency_party_meeting:0 "Convene the Party"
 PAR_emergency_party_meeting_desc:0 "Replace Chaves with Ángel Florentín Peña"
 PAR_ruffeneli:0 "Carlos Levi Rufinelli"
 PAR_state_of_emergency:0 "Declare State of Siege"
 PAR_state_of_emergency_desc:0 "Renewed till 87"
 PAR_develop_capital:0 "Develop the Capital"
 PAR_develop_capital_desc:0 "Asunción stands at the heart of the nation, yet its infrastructure and economy lag behind what is expected of a modern capital. Investment in urban development, transportation, and industry will not only enhance the city’s role as the political and economic center of Paraguay but also provide opportunities for growth, employment, and modernization. A stronger capital means a stronger nation."
 PAR_export_crops:0 "Expand Production of Export Crops"
 PAR_export_crops_desc:0 "Paraguay’s agricultural sector remains the backbone of our economy, with cash crops like cotton, tobacco, and sugar cane serving as vital sources of export revenue. By incentivizing large-scale production, improving irrigation, and providing subsidies to major plantations, we can ensure a steady flow of goods to foreign markets."
 PAR_foreign_oil_companies:0 "Foreign Petrochemical Investments"
 PAR_foreign_oil_companies_desc:0 "Paraguay’s growing energy demands and industrial expansion require a modernized petrochemical sector to reduce reliance on imported fuels. Recognizing this necessity, the government has opened bidding to foreign investors for the construction of a new refinery, aiming to establish a reliable domestic fuel supply."
 PAR_epifanistas:0 "Bribe the Epifanistas"
 PAR_raise_militia:0 "Raise Loyal Militias"
 PAR_promote_Ferreira:0 "Promote Ferreira to Supreme Commander"
 PAR_army_clean:0 "Purge the Army of Stroessner Supporters"
 PAR_reopen_us_embassy:0 "Reopen the USA Embassy"
 PAR_epifanistas_desc:0 "Maybe lockout stoesnner path? Secure epifinistas for Chavez"
 PAR_anti_Communist_mild:0 "Continue Anti-Communist Campaign"
 PAR_reshuffle_marines:0 "Reorganize the Marines"
 PAR_education_board:0 "Assessing Educational Challenges"
 PAR_american_loans_rebuild:0 "American Funds for Rebuilding"
 PAR_combat_crime_as_ac:0 "Establish Neighborhood Police"
 PAR__reduce_argentina_dependence:0 "Reduce Dpendence on Argentina"
 PAR__reduce_argentina_dependence_desc:0 "Argentina is not well"
 PAR_create_bcp:0 "Create Banco Central del Paraguay"
 PAR_create_bcp_desc:0 "Due to growing difficulties in financial management, rising inflation, and increasing currency speculation, the government has begun drafting Law 18/52 to create the Banco Central del Paraguay. This institution will assume responsibility for monetary policy, banking regulation, and currency issuance, replacing the outdated financial framework that has struggled to maintain stability. Built upon the Monetary Department of the Banco del Paraguay, the new central bank will provide a stronger foundation for economic governance, ensuring a more regulated financial system capable of sustaining Paraguay’s long-term development."
 PAR_limit_heavy_arms:0 "Restrict Police Armament"
 PAR_limit_heavy_arms_desc:0 "To preserve the balance of power and avoid unnecessary friction with the military, the government is reviewing plans to limit the National Police’s access to heavy weaponry. This decision aims to maintain a clear distinction between military and law enforcement roles, ensuring that the police remain focused on public security rather than militarization. While some within the government believe a more heavily armed police force is necessary, others argue that overreach in police armament could lead to political instability and unwanted conflicts."
 PAR_reform_ministeries:0 "Reform Ministeries"
 PAR_cultural_support:0 "Support Paraguayan Culture"
 PAR_mass_censorship_desc:0 "Replace editors and stuff with loyals"
 PAR_reassign_mendez:0 "Reassign Epifanio Méndez as BCP Leader"
 PAR_reassign_mendez_desc:0 "With Stroessner now firmly in power, the regime moves to reward those who supported the coup and ensure loyalty within key institutions. One of the most significant appointments is the reinstatement of Epifanio Méndez Fleitas as the President of the Central Bank of Paraguay. Having been dismissed by Federico Chaves prior to the coup, Méndez played a crucial role in securing support for Stroessner among reformist factions within the Colorado Party. Beyond his economic role, Méndez is also expanding his political influence. He has taken control of La Unión, a newspaper that will serve as the government’s primary media mouthpiece, ensuring that Stroessner’s rule is publicly legitimized and opposition narratives are suppressed."
 PAR_declare_state_of_siege:0 "Declare State of Siege"
 PAR_declare_state_of_siege_desc:0 "Renewed every 3 motnhs till end of rule"
 PAR_constitution_stuff:0 "Consolidate Power"
 PAR_constitution_stuff_desc:0 "With Federico Chaves removed and Alfredo Stroessner firmly in power, the time has come to secure the foundations of the new regime. While the Colorado Party leadership initially saw Stroessner as a temporary solution, it is now clear that his government will not simply serve as a placeholder."
 PAR_keep_eye_on_guion_rojo:0 "Keep Eye on Guión Rojo"
 PAR_keep_eye_on_guion_rojo_desc:0 "PAR_keep_eye_on_guion_rojo_desc"
 PAR_offer_aid_to_korea:0 "Offer Support In Korea"
 PAR_offer_aid_to_korea_desc:0 "As the Cold War escalates, the conflict in Korea has become a defining struggle between the forces of democracy and communism. While Paraguay’s direct involvement in the war remains impractical, offering symbolic support to the United Nations coalition—led by the United States—could strengthen our diplomatic ties with Washington."
 PAR_expand_py_nandi:0 "Expand Py Nandi"
 PAR_expand_py_nandi_desc:0 "With Alfredo Stroessner now firmly in power, efforts begin to expand the influence of the Py Nandi, the rural wing of Guión Rojo, which serves as the backbone of the Colorado Party’s mobilization in the countryside. Originally a network of party loyalists, landowners, and rural organizers, the Py nandi operates as a grassroots extension of the regime, ensuring political control reaches even the most remote areas of Paraguay. No village, no farm, no Paraguayan is beyond the reach of the party."
 PAR_pave_way_for_strossner:0 "Talks Between Military and ANR"
 PAR_pave_way_for_strossner_desc:0 "The Colorado Party remains divided, while the military seeks to secure a stable transition. To prevent further instability, key military leaders and ANR officials have begun behind-the-scenes negotiations to determine the next president. While some within the party still dream of reasserting full civilian control, the military has made it clear that it will not accept a leader it cannot trust. With no clear alternative, a compromise emerges—General Alfredo Stroessner, a rising figure in the army but without deep ties to any political faction, is seen as a neutral candidate. The party views him as a temporary solution, while the military sees him as a guarantee of stability and security."
 PAR_place_blame_desc:0 "With President Federico Chaves removed from office, the government must now present an official explanation of the events of the coup While the coup unfolded rapidly, it was not without justification — Chaves had attempted to subvert order within the Colorado Party, and military leaders saw his continued rule as a threat to national stability. The Colorado Party leadership and the military have now aligned to frame the coup as a necessary correction, ensuring that Paraguay remains on the path of stability and unity. However, certain factions within the party, as well as those loyal to Chaves, may not be so easily convinced."
 PAR_may_decree:0 "Decreto Del 20 de Mayo de 1954"
 PAR_may_decree_desc:0 "Under Interim President Tomás Romero Pereira, Paraguay has taken steps to reinforce diplomatic relations with Argentina, marking a new phase in regional cooperation. In a symbolic gesture of goodwill, the Argentine government has returned historical war trophies taken during the War of the Triple Alliance, a move intended to strengthen ties between the two nations. With the country preparing for new elections, ensuring continued diplomatic support will be crucial for the next administration."
 PAR_establish_us_support:0 "Establish Preliminary Relations With USA"
 PAR_establish_us_support_desc:0 "\"In international policy, in general, the Government of Paraguay gives decided support to the United States of America, as leader of the free world, in its fight against international communism, and we share with this great nation the ideals of justice, peace, rights and liberty, in order that the world in which we live can be more secure and have more collective and individual guarantees.\" - Alfredo Stroessner"
 PAR_take_over_guion_rojo:0 "Take Over Guión Rojo"
 PAR_light_industry:0 "Expand Light Manufacturing"
 PAR_invest_agraculture:0 "Farmers' Assistance Project"
 PAR_anti_soviet_action:0 "Anti-Soviet Action"
 PAR_mendez_coup_desc:0 "By late 1955, tensions within the Colorado Party had reached a breaking point. Epifanio Méndez Fleitas, emboldened by his influence over the economy and media, had sought to unify the party through the Reencuentro of October, presenting it as a moment of consolidation against internal divisions. What began as a political struggle is about to become a battle for power."
 PAR_assign_ynsfran:0 "Assign Edgar Ynsfrán as Interior Minister"
 PAR_assign_ynsfran_desc:0 "To further tighten his grip on power, President Stroessner has decided to appointed Edgar Ynsfrán as Minister of the Interior, placing one of his most trusted and ideological allies in charge of Paraguay’s internal security and political stability. A staunch nationalist, fierce anti-communist, and longtime supporter of authoritarian rule, Ynsfrán sees the Colorado Party’s paramilitary traditions as essential to maintaining order. With his background in law enforcement and Guión Rojo, he will use the Interior Ministry as a tool to expand state control and eliminate opposition, ensuring Paraguay remains firmly under Stroessner’s rule."
 PAR_control_media:0 "Tighten Grip on Press and Media"
 PAR_party_unity_two:0 "Secure Party Loyality"
 PAR_party_unity_two_desc:0 "With the recent ousting of the Epifenista threat, President Stroessner recognizes the imperative of solidifying loyalty within the ranks of the party. In the aftermath of the attempted coup, dissenting voices must be silenced, and unwavering allegiance to the regime must be ensured."
 PAR_1958_elections:0 "1958 General Elections"
 PAR_take_over_guion_rojo_desc:0 "Or make em ally against stoesnner?"
 PAR_imporve_brazilian_relations:0 "Improve Brazilian Relations"
 PAR_army_friends:0 "Reward Friends In Army"
 PAR_army_friends_desc:0 "Corruption for army"
 PAR_strike_chavez_supporters:0 "Strike Chavez Supporters"
 PAR_strike_chavez_supporters_desc:0 "With the recent ousting of the Epifenista threat, President Stroessner recognizes the imperative of solidifying loyalty within the ranks of the party. In the aftermath of the attempted coup, dissenting voices must be silenced, and unwavering allegiance to the regime must be ensured."
 PAR_ramp_up_anti_communism:0 "Ramp Up Anti-Communist Action"
 PAR_austerity_measures:0 "Programa de Austeridad"
 PAR_austerity_measures_desc:0 "With inflation rising and the economy deteriorating, President Stroessner has enacted strict austerity measures to restore stability. Spending is cut, credit is tightened, and financial discipline is enforced, aiming to curb inflation and secure long-term growth. However, the reforms are deeply unpopular. Military officers, accustomed to easy loans, resent losing financial privileges, while business elites oppose the crackdown on loose credit. Despite the backlash, Stroessner remains firm — economic order must come before political convenience."
 PAR_american_loans:0 "Secure American Loans"
 PAR_west_german_ties:0 "West German Assistance?"
 PAR_1958_elections_desc:0 "GetLeader won elections"
 PAR_woo_rural_pop:0 "Agrarian Outreach Program"
 PAR_woo_rural_pop_desc:0 "With the heartland's allegiance crucial to regime's stability, President Stroessner has come up with Programa de divulgación agraria. By courting the traditional rural oligarchy, dominated by latifundistas of Liberal persuasion, Stroessner aims to secure their support through targeted agricultural reforms and infrastructure investment."
 PAR_jungle_camps:0 "Remote Detainment Project"
 PAR_jungle_camps_desc:0 " With growing numbers of dissenters posing a threat to the regime's stability, it becomes imperative to expand the network of jungle internment camps. These camps, hidden deep within the dense foliage, serve as a means to quell opposition and maintain control. Under the guise of national security, individuals deemed a threat to the regime are interned, ensuring that dissent remains silenced and loyalty to the regime enforced."
 PAR_brazil_paraguay_commission:0 "Comisión Mixta Paraguayo-Brasileña"
 PAR_brazil_paraguay_commission_desc:0 "The Comisión Mixta Paraguayo-Brasileña has been instrumental in defining and demarcating the border between Paraguay and Brazil since its establishment by the Protocol of Instructions of 1930. This joint commission has worked diligently to delimit, demarcate, and characterize our shared boundaries, ensuring clarity and cooperation between our nations.By strengthening this commission, we aim to enhance bilateral relations, facilitate cross-border infrastructure projects, and promote regional stability"
 PAR_dnat:0 "Dirección Nacional de Asuntos Técnicos"
 PAR_repress_students:0 "Academic Suppression"
 PAR_repress_students_desc:0 "Operating under the pretext of anti-communism, the regime targets students and intellectuals suspected of harboring subversive ideologies. Through surveillance, intimidation, and censorship, the regime aims to eradicate intellectual dissent and ensure unwavering loyalty to the regime's ideology."
 PAR_expand_party_media:0 "Expand Party Media"
 PAR_expand_party_media_desc:0 " the extensive party media, including the daily newspaper Patria and the radio program \"La Voz del Coloradismo,\" promoted the government's view of national and international events. In addition, the party employed its ancillary organizations, which included professional associations, veterans' groups, women's federations, peasants' groups, cultural societies, and students' clubs, to maintain contact with virtually all sectors in the country. "
 PAR_genral_strike_58:0 "Huelga General"
 PAR_genral_strike_58_desc:0 "The strike was called by the Confederación Paraguaya de Trabajadores (CPT; 'Paraguayan Workers' Confederation'), with demand such as a 30% raise in salaries, a general declaration of amnesty, a lifting of the state of emergency, a more equitable economic policy, securing the freedom to participate in political and trade union activities and the holding of a constituent assembly"
 PAR_repress_some_more:0 "Electoral Dissent Crackdown"
 PAR_repress_some_more_desc:0 "Following the controversial 1958 elections, President Stroessner reacts swiftly to suppress opposition dissent. Despite claims of victory, discontent simmers among those who contest the legitimacy of the electoral process."
 PAR_arrest_strike_leaders:0 "Strike The Strikers"
 PAR_arrest_strike_leaders_desc:0 "There will be no negotiations. The government cannot afford to show weakness in the face of subversion. President Stroessner has ordered immediate and overwhelming action against the strikers — police and military forces are mobilized to suppress all gatherings, arrest strike leaders, and dismantle union infrastructure. The CPT will be shattered, ensuring that organized labor will never again challenge the authority of the state."
 PAR_seize_cpt:0 "Seize Control of CPT"
 PAR_attempt_negotations:0 "Attempt to Negotiate"
 PAR_attempt_negotations_desc:0 "Caught off guard by the general strike, the government has decided to pursue a dual strategy — offering limited concessions while preparing to dismantle the movement. Stroessner has authorized a modest wage increase in an attempt to pacify the strikers, but if negotiations fail, the state will act decisively to restore order. The CPT leadership will soon learn that while the government may speak of dialogue, it will not tolerate defiance."
 PAR_increase_law_enforcment_budget:0 "Increase Law Enforcment Budget"
 PAR_increase_law_enforcment_budget_desc:0 "All in name of Anti-communism."
 PAR_usa_counterins:0 "Counter-Insurgency Training"
 PAR_usa_counterins_desc:0 "United States military aid was helping enhance the army's skills in counterinsurgency warfare"
 PAR_mengle:0 "Grant Mengle Citizenship"
 PAR_liberal_59:0 "Liberalization of 1959"
 PAR_liberal_59_desc:0 "In April 1959 the state of siege was lifted, opposition exiles allowed to return, press censorship ended, political prisoners freed, and a new Constitution promised to replace the authoritarian 1940 Constitution."
 PAR_rural_help:0 "Secure Rural Support"
 PAR_promulgate_new_constituion:0 "The 1959 Constitution"
 PAR_promulgate_new_constituion_desc:0 "Start making it. Never happens."
 PAR_capital_student_riot:0 "Asunción Student Riots"
 PAR_dissolve_parlament:0 "Dissolve The Parlament"
 PAR_reintroduce_sog:0 "Reverse Liberalization Course"
 PAR_strike_stoessner:0 "Revuelta Unitaria"
 PAR_strike_stoessner_desc:0 "Despite Stroessner's attempts to maintain his grip on power, Epifanio Méndez has defied the odds, successfully uniting both the party and military against him. In a remarkable turn of events, Méndez's leadership has bridged the longstanding divide between these two pillars of Paraguayan authority, forging a formidable coalition aimed squarely at toppling Stroessner."
 PAR_invest_in_public_works:0 "Invest In Public Works"
 PAR_control_food_prices:0 "Restrict Beef Prices"
 PAR_grant_peron_stay:0 "Allow Perón to Stay"
 PAR_improve_argentina_ties:0 "Improve Ties With Argentina"
 PAR_promote_fredesvinda:0 "Empowering Fredesvinda"
 PAR_promote_fredesvinda_desc:0 "Inspired by the political maneuvers of Perón, Epifanio Méndez takes a bold step by promoting his wife, Fredesvinda Vall, to a prominent and influential position within the government. In a move reminiscent of Perón's elevation of Eva Perón, Méndez recognizes the potential of his spouse as a powerful ally and symbol of popular support."
