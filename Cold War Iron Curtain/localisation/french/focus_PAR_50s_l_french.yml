 PAR_dta:0 "Dirección Nacional de Asuntos Técnicos"
 PAR_dta_desc:0 "Robert Thierry, a Pentagon official and veteran of the Korean War was sent from the United States to help the Stroessner regime set up the new organization. When selecting the employees, Lieutenant Colonel Thierry paid special attention to the lawyer Antonio Campos Alum. In 1957, Campos Alum completed an internship in the United States. Upon his return to Paraguay, he was commissioned by Stroessner to lead the DNAT."
