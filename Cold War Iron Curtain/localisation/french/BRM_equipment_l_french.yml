 #Myanmar/Burma BUR
 BRM_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n ° 4 Mk I"
 BRM_infantry_equipment_0_short:0 "SMLE n°4"
 BRM_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par un chargeur, qui a servi de principale arme à feu utilisée par l'Empire britannique et le Commonwealth au cours de la première moitié du 20e siècle. C'était le fusil standard de l'armée britannique de 1895 à 1957. Le fusil a été largement utilisé tout au long de la Seconde Guerre mondiale, en particulier sur les théâtres d'Afrique du Nord, d'Italie, du Pacifique et de Birmanie, aux mains des forces britanniques et du Commonwealth. L'Australie et l'Inde ont conservé et fabriqué le SMLE Mk III* comme fusil standard pendant le conflit et le fusil est resté en service militaire australien pendant la guerre de Corée, jusqu'à ce qu'il soit remplacé par le L1A1 SLR à la fin des années 1950."

 BRM_infantry_equipment_1:0 "Fairchild ArmaLite AR-10"
 BRM_infantry_equipment_1_short:0 "ArmaLite AR-10"
 BRM_infantry_equipment_1_desc:0 "L'ArmaLite AR-10 est un fusil de combat OTAN de 7,62 × 51 mm développé par Eugene Stoner à la fin des années 1950 et fabriqué par ArmaLite, alors une division de Fairchild Aircraft Corporation. Lors de son introduction en 1956, l'AR-10 utilisait une conception innovante de canon/crosse en ligne droite avec des pièces en composite phénolique et en alliage forgé, ce qui en faisait une arme légère beaucoup plus facile à contrôler en tir automatique et plus de 1 lb (0,45 kg) plus légère que les autres fusils d'infanterie de l'époque."

 BRM_infantry_equipment_2:0 "Heckler & Koch G3"
 BRM_infantry_equipment_2_short:0 "Heckler & Koch G3"
 BRM_infantry_equipment_2_desc:0 "Modèle original basé sur le CETME Model 58 introduit en 1959 et approuvé en 1960. Il avait une crosse et un garde-main en bois."

 BRM_infantry_equipment_3:0 "KaPaSa BA63"
 BRM_infantry_equipment_3_short:0 "KaPaSa BA63"
 BRM_infantry_equipment_3_desc:0 "G3 produit sous licence par le Myanmar, propriété déclarée des usines KaPaSa en partenariat avec Fritz Werner Industry Ausrustungen-Gmbh (FRG) et l'Agence allemande de la société technique avec des droits de licence vendus en 1960 avec les 10 000 premiers G3 achetés à l'Allemagne de l'Ouest (via Rheinmetall) avant que les usines birmanes ne deviennent opérationnelles en raison des craintes qu'elles puissent s'aligner sur l'Allemagne de l'Est."

 BRM_infantry_equipment_4:0 "Direction des Industries de Défense MA-1"
 BRM_infantry_equipment_4_short:0 "DDI MA-1"
 BRM_infantry_equipment_4_desc:0 "Le MA-1 Mk. I/II (Mark I/II) sont des clones fabriqués au Myanmar de la série IMI Galil avec quelques modifications apportées aux conditions localisées, qui ont été réalisés par la Direction des industries de défense avec l'aide d'ingénieurs israéliens envoyés au Myanmar pour une assistance technique dans le cadre de la tentative d'Israël de rechercher des alliés dans la région Asie-Pacifique dans les années 1990. La famille est parfois appelée EMERK. La création de la série MA-1 a commencé dans les années 1990, lorsque Tatmadaw souhaitait remplacer ses fusils de combat BA63 (Burma Army 63), qui étaient des versions sous licence du Heckler & Koch G3."

