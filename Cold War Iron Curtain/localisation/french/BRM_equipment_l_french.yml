 BRM_lt_equipment_1:0 "M3 Miel (Stuart)"
 BRM_lt_equipment_1_short:0 "M3 Miel"
 BRM_lt_equipment_2:0 "Voiture blindée AEC"
 BRM_lt_equipment_2_short:0 "Voiture blindée AEC"
 BRM_lt_equipment_3:0 "Furet Mk1"
 BRM_lt_equipment_3_short:0 "Furet Mk1"
 BRM_lt_equipment_4:0 "Panhard AML H-90"
 BRM_lt_equipment_4_short:0 "AML-90"
 BRM_lt_equipment_4_desc:0 "L'AML-90 est une variante modifiée de l'AML-60, dotée d'une nouvelle tourelle et d'un canon rayé basse pression DEFA de 90 mm qui permettait de combiner les éléments antichar et de reconnaissance des unités territoriales françaises en un nouvel élément capable d'abattre le véhicule le plus lourd susceptible d'être opposé à lui. Il a servi dans de nombreux conflits, notamment la guerre de Toyota, la guerre frontalière sud-africaine et la guerre des Six Jours."
 BRM_lt_equipment_5:0 "Engesa EE-9 Cascavel Mk.II"
 BRM_lt_equipment_5_short:0 "EE-9 Cascavel Mk.II"
 BRM_lt_equipment_5_desc:0 "L'EE-9 Cascavel est un véhicule blindé brésilien à six roues développé principalement pour la reconnaissance. Il a été conçu par Engesa en 1970 pour remplacer la flotte vieillissante de M8 Greyhounds du Brésil. Le véhicule fut d'abord équipé du canon principal de 37 mm du Greyhound, puis d'une tourelle française adoptée du Panhard AML-90."

