 BRM_motorized_equipment_1:0 "Camion 4x4 Dodge T-234 \"Birmanie\""
 BRM_motorized_equipment_1_short:0 "Ford F15 CMP 4x4"
 BRM_motorized_equipment_1_desc:0 "Les camions de modèle militaire canadien (CMP) étaient des gammes mutuellement cohérentes de camions militaires, fabriqués en grand nombre, dans plusieurs classes et de nombreuses versions, par les succursales canadiennes des « trois grands » constructeurs automobiles américains pendant la Seconde Guerre mondiale, conformes aux spécifications de l'armée britannique, principalement destinés à être utilisés dans les armées des alliés du Commonwealth britannique, mais servant également dans d'autres unités de l'Empire britannique. "
