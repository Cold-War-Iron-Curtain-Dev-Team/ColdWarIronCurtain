 #Burma/Myanmar Air Force

 BRM_fighter_equipment_0:0 "Westland Wapiti Mk.IIA"
 BRM_fighter_equipment_0_short:0 "Westland Wapiti Mk.IIA"
 BRM_fighter_equipment_0_desc:0 "Le Westland Wapiti était un biplan militaire monomoteur britannique biplace des années 1920. Il a été conçu et construit par Westland Aircraft Works pour remplacer l'Airco DH.9A dans le service de la Royal Air Force."
 BRM_fighter_equipment_1:0 "Hawker Hurricane Mk.I"
 BRM_fighter_equipment_1_short:0 "Hawker Hurricane Mk.I"
 BRM_fighter_equipment_2:0 "Hawker Hurricane Mk.IIB"
 BRM_fighter_equipment_2_short:0 "Hawker Hurricane Mk.IIB"
 BRM_fighter_equipment_2_desc:0 "le Hawker Hurricane est un avion de combat monoplace britannique des années 1930 à 1940, conçu et principalement construit par Hawker Aircraft Ltd. pour servir dans la Royal Air Force (RAF)."
 BRM_fighter_equipment_3:0 "Supermarine Spitfire F Mk.XIV"
 BRM_fighter_equipment_3_short:0 "Spitfire F Mk.XIV"
 BRM_fighter_equipment_3_desc:0 "Les premiers Spitfire propulsés par Griffon souffraient de mauvaises performances à haute altitude en raison du fait qu'ils n'avaient qu'un seul moteur suralimenté à un étage. En 1943, les ingénieurs de Rolls-Royce avaient développé un nouveau moteur Griffon, la série 61, doté d'un compresseur à deux étages. En fin de compte, c'est un moteur légèrement modifié, la série 65, qui fut utilisé dans le Mk XIV. L'avion résultant a fourni une augmentation substantielle des performances par rapport au Mk IX."

 BRM_jet_multirole_equipment_1:0 "De Havilland Vampire F.3"
 BRM_jet_multirole_equipment_1_short:0 "Vampire F.3"
 BRM_jet_multirole_equipment_1_desc:0 "Le 7e Escadron de l'Indian Air Force (IAF) a reçu des Vampires en janvier 1949. Le 17e Escadron de l'IAF a également exploité ce type. Le 37e Escadron de l'IAF a effectué un certain nombre de missions de reconnaissance nocturne Vampire NF54 au-dessus de Goa lors de l'annexion de Goa à la domination portugaise en 1961, parfois sous le feu anti-aérien."

 BRM_jet_multirole_equipment_9:0 "Chengdu F-7 IIK"
 BRM_jet_multirole_equipment_9_short:0 "F-7 IIK"
 BRM_jet_multirole_equipment_10:0 "Mise à jour de mi-vie du Chengdu F-7 IIK"
 BRM_jet_multirole_equipment_10_short:0 "F-7 IIK MLU"

 BRM_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29BM"
 BRM_mr_stealth_fighter_equipment_1_short:0 "MiG-29BM"
 BRM_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29BM/BM2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne. Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."

 BRM_CAS_equipment_1:0 "de Havilland DH.82 Tiger Moth"
 BRM_CAS_equipment_1_short:0 "DH.82 Tiger Moth"

 BRM_jet_CAS_equipment_7:0 "Soko G-4 Super Galeb"
 BRM_jet_CAS_equipment_7_short:0 "G-4 Super Galeb"
 BRM_jet_CAS_equipment_8:0 "Nanchang A-5C"
 BRM_jet_CAS_equipment_8_short:0 "A-5C"
 
 BRM_jet_light_equipment_1:0 "Étoile filante Lockheed T-33"
 BRM_jet_light_equipment_1_short:0 "Étoile filante T-33"
 BRM_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement à réaction subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80 en commençant sous le nom de TP-80C/TF-80C en développement, puis désigné T-33A."
 BRM_jet_light_equipment_2:0 "de Havilland Vampire T.55"
 BRM_jet_light_equipment_2_short:0 "Vampire T.55"
 #BRM_jet_light_equipment_3:0 "Shenyang FT-6"
 #BRM_jet_light_equipment_3_short:0 "FT-6"
 BRM_jet_light_equipment_4:0 "Shenyang FT-7P"
 BRM_jet_light_equipment_4_short:0 "FT-7P"
 BRM_jet_light_equipment_4_desc:0 "version d'exportation de JJ-7 avec le chinois remplacé par l'anglais pour tous les affichages. L'Iran a été le premier client avec une commande passée fin 1986. Un certain nombre ont été livrés au Pakistan avec une longueur de fuselage augmentée de 0,61 mètre et une capacité de carburant interne augmentée de 350 litres."
 BRM_jet_light_equipment_5:0 "PAC Karakorum-8"
 BRM_jet_light_equipment_5_short:0 "Karakorum-8"
 BRM_jet_light_equipment_5_desc:0 "Le Hongdu JL-8 (Nanchang JL-8), également connu sous le nom de Karakorum-8 ou K-8 en abrégé, est un avion d'entraînement à réaction intermédiaire biplace et un avion d'attaque léger conçu en République populaire de Chine par China Nanchang Aircraft Manufacturing Corporation. Le Pakistan est également le co-partenaire de ce projet. Le maître d'oeuvre est la Hongdu Aviation Industry Corporation. Sa variante d'exportation, le K-8 Karakorum, est coproduite par le complexe aéronautique du Pakistan pour l'armée de l'air pakistanaise."

 BRM_recon_equipment_0:0 "Taylorcraft Auster AOP6"
 BRM_recon_equipment_0_short:0 "Auster AOP6"
 BRM_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion de liaison et d'observation militaire britannique produit par la société Taylorcraft Airplanes (England) Limited pendant la Seconde Guerre mondiale. "

 BRM_nav_bomber_equipment_7:0 "Défenseur Britten-Norman BN-2B"
 BRM_nav_bomber_equipment_7_short:0 "Défenseur"

 BRM_transport_plane_equipment_5:0 "Fokker F27-400 Amitié"
 BRM_transport_plane_equipment_5_short:0 "F27-400 Amitié"
 BRM_transport_plane_equipment_6:0 "Shaanxi Y-8"
 BRM_transport_plane_equipment_6_short:0 "Y-8"

 #CV
 BRM_cv_fighter_equipment_1:0 "Gladiateur des mers Gloster"
 BRM_cv_fighter_equipment_1_short:0 "Gladiateur des mers"
 BRM_cv_fighter_equipment_1_desc:0 "Un Mk II modifié, le Sea Gladiator, a été développé pour la Fleet Air Arm (FAA), avec un crochet d'arrêt, des points de fixation de catapulte, une cellule renforcée et un carénage inférieur pour un canot de sauvetage, le tout pour les opérations à bord de porte-avions."
 BRM_cv_fighter_equipment_2:0 "Supermarine Seafire F Mk.17"
 BRM_cv_fighter_equipment_2_short:0 "Seafire F Mk.17"
 BRM_cv_fighter_equipment_2_desc:0 "Le Supermarine Seafire est une version navale du Supermarine Spitfire adaptée pour être utilisée à partir de porte-avions. Son concept était analogue au Hawker Sea Hurricane, une version navalisée du compagnon d'écurie du Spitfire, le Hawker Hurricane. Le nom Seafire est dérivé de l'abréviation du nom plus long Sea Spitfire"
 BRM_cv_fighter_equipment_3:0 "Supermarine Seafire FR 47"
 BRM_cv_fighter_equipment_3_short:0 "Feu de mer FR.47"
 BRM_cv_fighter_equipment_3_desc:0 "La version finale du Seafire était le Seafire F Mk 47 et le FR Mk 47. Il n'y avait pas de véritable prototype. En tant que Seafire « définitif » basé sur un porte-avions, le Mk 47 a incorporé plusieurs améliorations par rapport aux variantes précédentes. Tous les Mk 47 ont adopté les hélices contrarotatives Rotol."

 BRM_cv_jet_multirole_equipment_1:0 "Hawker Sea Fury F.11"
 BRM_cv_jet_multirole_equipment_1_short:0 "Fureur marine F.11"