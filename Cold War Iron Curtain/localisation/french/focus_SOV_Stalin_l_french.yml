 Soviet_Op_North.1.d: "L'Union soviétique est accusée d'avoir expulsé des milliers de Témoins de Jéhovah des pays baltes et d'autres régions d'Europe de l'Est vers la Sibérie. Des rapports indiquent que le ministère de la Sécurité de l'État a récemment pris des décrets sur les expulsions et la confiscation des biens. Le nombre de Témoins de Jéhovah se compterait en milliers. Les Témoins de Jéhovah se heurtent depuis longtemps aux autorités soviétiques en refusant de participer aux fonctions de l'État, notamment de servir dans l'armée. Pour de nombreux responsables soviétiques, ces croyances religieuses représentaient un défi direct pour l'État, qu'il fallait éradiquer avant de se propager à d'autres populations. Cette action suscitera probablement des critiques internationales concernant les persécutions religieuses."
 SOV_PRC_Treaty.1.d: "Les deux géants socialistes mondiaux ont beaucoup à gagner en coopération. Le traité garantit une alliance entre la Chine et l'Union soviétique. Le traité garantit une aide désespérément nécessaire au nouveau régime chinois. Les ports de Dalian et Lushun seront également restitués à la Chine. Les Soviétiques obtiennent des privilèges au Xinjiang et en Mandchourie. Les deux États bénéficieront de l'union du monde socialiste dans un partenariat."
