 SOV_law_on_labour_collectives: "Loi \"sur les collectifs de travail\""
 SOV_law_on_labour_collectives_desc: "Après l'adoption de la loi \"Sur les collectifs de travail et l'augmentation de leur rôle dans la gestion des entreprises, des institutions et des organisations\", les travailleurs ont commencé à essayer de participer à l'élaboration et à la discussion des projets de plans à long terme et en cours pour le développement économique et social de leur entreprise. Cependant, le manque de subjectivité et de sécurité juridique permet aux chefs d'entreprise de contourner ou de niveler souvent les décisions du collectif du travail."
 SOV_Decree_No_659: "Décret n° 659 \"Sur des mesures supplémentaires visant à étendre les droits des associations de production (entreprises) de l'industrie en matière de planification et d'activités économiques et à renforcer leur responsabilité à l'égard des résultats du travail\""
 SOV_Decree_No_659_desc: "Le décret n° 659 fixe la tâche d'améliorer la planification des activités des associations et des entreprises de production, de créer des conditions qui stimuleraient un travail de haute qualité et hautement productif, l'initiative et l'entrepreneuriat, d'assurer l'accélération du progrès scientifique et technologique et l'intensification de la production. Le Comité central du PCUS et le Conseil des ministres de l'URSS estiment nécessaire, parallèlement à l'introduction cohérente et persistante des formes et méthodes de gestion qui se sont justifiées, de mettre en oeuvre un système de mesures supplémentaires visant à élargir les droits des associations de production et des entreprises en matière de planification et d'activité économique, de garantir leur intérêt à atteindre une efficacité de production élevée et de renforcer la responsabilité des résultats du travail. Toutes ces mesures devraient viser à améliorer et à renforcer davantage la gestion centralisée de l'économie, en combinaison avec le développement de principes démocratiques dans la gestion de l'économie nationale, le renforcement du rôle des collectifs de travail dans la gestion des associations de production et des entreprises et l'introduction généralisée de la comptabilité analytique. Afin de développer ces mesures et d'assurer leur validité globale et leur vérification pratique, une expérience économique à grande échelle sera réalisée."
 SOV_Romanov_led_reforms_team: "Équipe de réformes dirigée par Romanov"
 SOV_Romanov_led_reforms_team_Decree_Market: "Équipe de réformes dirigée par Romanov"
 SOV_Romanov_led_reforms_team_Market: "Équipe de réformes dirigée par Romanov"
 SOV_Romanov_led_reforms_team_Decree: "Équipe de réformes dirigée par Romanov"
 SOV_Romanov_led_reforms_team_Decree_Market_desc: "Le camarade Grigori Romanov, industriel expérimenté et partisan de l'introduction de technologies avancées, est nommé par le camarade Andropov pour diriger un groupe informel de réformateurs qui travaillent sur un programme visant à moderniser et à réformer l'économie soviétique afin de lui donner une impulsion à la croissance."
