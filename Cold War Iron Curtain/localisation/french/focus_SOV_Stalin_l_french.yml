 Soviet_Don_Volga.1.t: "[GetNewspaperHeader]Achèvement du canal Lénine Volga-Don"
 Soviet_Don_Volga.1.d: "Le [?global.date.GetDateStringNoHourLong], l'Union soviétique a officiellement ouvert le canal Volga-Don, marquant l'achèvement de l'un des plus grands projets d'infrastructure de l'ère stalinienne d'après-guerre. S'étendant sur 101 kilomètres et reliant les rivières Volga et Don à leur point le plus proche, le canal reliait le bassin de la mer Caspienne au système mer Noire-Azov, devenant ainsi une artère clé du réseau unifié de transport en eaux profondes de l'URSS.\n\nLa construction, initialement prévue avant la Seconde Guerre mondiale et conçue par l'Institut des hydroprojets de Sergueï Jouk, reprit sérieusement entre 1948 et [GetYear]. Le projet a mobilisé une énorme main-d'oeuvre d'environ 900 000 travailleurs, dont des civils soviétiques, des prisonniers de guerre allemands et des détenus du Goulag. Grâce aux réformes du système de travail forcé introduites à la fin des années 1940, telles que les salaires, les incitations à la productivité et les réductions de peine, le projet de canal est devenu l'un des premiers à fonctionner sur une base d'autofinancement.\n\nSalué par les autorités soviétiques comme un triomphe de l'ingénierie socialiste moderne et de la reprise d'après-guerre."
 Soviet_Don_Volga.1.a: "L'acier, le béton et la volonté humaine ont remodelé la géographie de l'Union."
