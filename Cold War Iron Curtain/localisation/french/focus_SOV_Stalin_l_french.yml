 SOV_Gorbachev_led_reforms_team: "Équipe de réformes dirigée par Gorbatchev"
 SOV_Gorbachev_led_reforms_team_desc: "Le camarade Mikhaïl Gorbatchev, un jeune et actif membre du Politburo connu pour ses activités dans l'agriculture, est nommé par le camarade Andropov pour diriger un groupe informel de réformateurs qui travaillent sur un programme visant à moderniser et à réformer l'économie soviétique afin de lui donner une impulsion à la croissance."
