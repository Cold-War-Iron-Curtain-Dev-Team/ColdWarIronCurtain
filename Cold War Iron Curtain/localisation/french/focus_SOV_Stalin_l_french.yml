 SOV_Economic_Department_of_the_Central_Committee_of_the_CPSU: "Département économique du Comité central du PCUS"
 SOV_Economic_Department_of_the_Central_Committee_of_the_CPSU_desc: "Le Département économique du Comité central du PCUS, nouvellement créé, a quelque peu bouleversé l'ancien style de gestion, améliorant pendant un certain temps la formation et l'orientation de la politique économique."
 SOV_Mass_reshuffles_and_dismissals_in_the_party_and_administrative_apparatus: "Remaniements massifs et licenciements au sein du parti et de l'appareil administratif"
 SOV_Mass_reshuffles_and_dismissals_in_the_party_and_administrative_apparatus_desc: "§WCorruption mensuelle :§! §G-0,2§!\n§W--------------§!\nLa destitution massive de ministres et de responsables de parti corrompus et incompétents est une procédure nécessaire, mais cela ne se fait pas sans leur résistance et sans difficulté à choisir un remplaçant digne."
 SOV_Wide_anti_corruption_campaign: "Large campagne anti-corruption"
 SOV_Wide_anti_corruption_campaign_desc: "§WCorruption mensuelle :§! §G-0,2§!\n§W--------------§!\n"
 SOV_Ongoing_mass_dismissals_in_the_Ministry_of_Internal_Affairs: "Licenciements massifs en cours au ministère de l'Intérieur"
 SOV_Ongoing_mass_dismissals_in_the_Ministry_of_Internal_Affairs_desc: "§WCorruption mensuelle :§! §G-0,2§!\n§W--------------§!\nL'affaire Chtchelokov et d'autres enquêtes menées au sein du ministère de l'Intérieur et de ses structures révèlent un grand nombre d'officiers entachés de corruption, d'abus d'autorité, de violation de la charte, de dissimulation et de dissimulation des crimes de leurs collègues, de fusion avec des éléments criminels et même de vol pur et simple de citoyens soviétiques. A l'égard de ces personnes, des mesures d'enquête à grande échelle sont prises, des poursuites pénales sont ouvertes et des licenciements massifs sont effectués. Bien que ces mesures soient nécessaires, elles détournent les employés honnêtes du MVD et du KGB de leurs fonctions directes et imposent une lourde charge à l'appareil administratif."
 SOV_Anti_corruption_campaign_in_MVD: "Campagne anti-corruption au MVD"
 SOV_Anti_corruption_campaign_in_MVD_desc: "§WCorruption mensuelle :§! §G-0,2§!\n§W--------------§!\nAvant de lancer une campagne anti-corruption au sein du parti et des organes administratifs, nous devons mettre de l'ordre et éliminer la corruption au sein du MVD, auquel sont subordonnés de nombreux services, depuis les pompiers et les milices jusqu'aux troupes internes et au département principal de lutte contre le vol des biens socialistes (GUBKhSS). Nous sommes particulièrement préoccupés par ce dernier point, car c'est le GUBKhSS qui devrait enquêter et prévenir la corruption et le vol. Pour que tout se passe bien, nous placerons le ministère de l'Intérieur sous la tutelle de la 3e Direction principale du KGB, chargée du contre-espionnage militaire."
 SOV_Preparation_for_an_anti_corruption_campaign: "Préparation d'une campagne anti-corruption"
 SOV_Preparation_for_an_anti_corruption_campaign_desc: "La corruption imprègne le parti et la société de haut en bas, mais la plus grande menace est la corruption au sommet, et nous devons commencer par elle. De vastes préparatifs devraient être faits pour éliminer ce problème, en premier lieu en remplaçant l'incompétent Ivan Kapitonov par le responsable Yegor Ligachev à la tête du Département de l'organisation et du travail du parti du Comité central du PCUS, afin de faciliter le renvoi des fonctionnaires corrompus."
 SOV_Discipline_strengthening_initiative: "Initiative de renforcement de la discipline"
 SOV_Discipline_strengthening_initiative_desc: "§WDiscipline mensuelle du travail :§! §G+0,5§!\n§W--------------§!\nAprès le discours du camarade Andropov au dernier plénum du Comité central du PCUS, où il a déclaré la lutte contre toute violation du parti, de l'État et de la discipline du travail, des descentes locales ont commencé dans les lieux publics - comme les coiffeurs, les magasins et les cinémas - où les travailleurs ne sont pas censés se trouver pendant les heures de travail. La population est perplexe face à de telles mesures, et il n'est pas tout à fait clair si le camarade Andropov voulait dire cela lorsqu'il parlait du renforcement de la discipline."
 SOV_Campaign_on_Strengthening_Labour_Discipline: "Campagne sur le renforcement de la discipline du travail"
 SOV_Campaign_on_Strengthening_Labour_Discipline_desc: "§WDiscipline mensuelle du travail :§! §G+1§!\n§W--------------§!\nLa campagne pour renforcer la discipline du travail, lancée par le camarade secrétaire général Andropov, acquiert des contours législatifs plus explicites, sensiblement différents des initiatives locales pour le mieux, tant en termes d'efficacité que de réflexion."
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved: "Campagne sur le renforcement de la discipline du travail"
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved_desc: "§WDiscipline mensuelle du travail :§! §G+1§!\n§W--------------§!\nLa campagne pour renforcer la discipline du travail, lancée par le camarade secrétaire général Andropov, acquiert des contours législatifs plus explicites, sensiblement différents des initiatives locales pour le mieux, tant en termes d'efficacité que de réflexion."
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved_again: "Campagne sur le renforcement de la discipline du travail"
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved_again_desc: "§WDiscipline mensuelle du travail :§! §G+2§!\n§W--------------§!\nLa campagne pour renforcer la discipline du travail, lancée par le camarade secrétaire général Andropov, acquiert des contours législatifs plus explicites, sensiblement différents des initiatives locales pour le mieux, tant en termes d'efficacité que de réflexion."
