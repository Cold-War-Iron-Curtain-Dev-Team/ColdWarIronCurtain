 SOV_Complete_Ukrainian_Reconstruction: "Reconstruction ukrainienne complète"
 SOV_The_Sixth_Five_Year_Plan_desc: "Le sixième plan quinquennal vise à guider le développement de l'économie soviétique d'après-guerre grâce à une planification centralisée. Ses objectifs se concentrent sur la restauration de la croissance, l'amélioration de la productivité et la consolidation des acquis obtenus lors de la reconstruction tout en adaptant l'économie aux nouvelles conditions internationales."
 SOV_The_Global_Struggle_for_Socialism_desc: "Par le biais d'organisations internationales et d'une activité politique coordonnée, l'Union soviétique cherche à promouvoir la coopération entre les mouvements pacifistes et les partis socialistes. Ces efforts visent à renforcer l'influence diplomatique et à présenter une vision alternative aux institutions dirigées par l'Occident au début de la Guerre froide."
 SOV_Raise_Living_Standard_desc: "Après la stabilisation de l'économie et des forces armées, l'attention peut être portée sur l'amélioration des conditions de vie. L'accès accru au logement, à l'éducation et aux biens de consommation vise à soutenir la croissance démographique et la stabilité sociale dans la période d'après-guerre."
 SOV_Rebuild_the_Armed_Forces_of_the_Union_desc: "Après une vaste démobilisation à la fin de la Seconde Guerre mondiale, les forces armées soviétiques ont besoin d'être réorganisées et modernisées. Cet effort se concentre sur le rétablissement de l'état de préparation, la mise à jour des équipements et l'adaptation des structures militaires aux nouvelles réalités stratégiques."
 SOV_Found_the_Comecon_desc: "Le Conseil d'assistance économique mutuelle est créé pour coordonner la coopération économique entre les États socialistes. Son objectif est de faciliter le commerce, la planification industrielle et les échanges technologiques au sein du bloc socialiste en dehors des systèmes économiques dominés par l'Occident."
 SOV_Rebuild_Soviet_Agriculture_desc: "La production agricole a subi d'importantes perturbations pendant la guerre. Les efforts de reconstruction visent à rétablir la production, à mécaniser l'agriculture et à assurer un approvisionnement alimentaire fiable tant pour les populations urbaines que pour le développement industriel."
 SOV_Boost_Petroleum_Refining_desc: "L'expansion de la capacité de raffinage est nécessaire pour soutenir la croissance industrielle, le transport et la mécanisation. L'amélioration du traitement des carburants permet une utilisation plus efficace des ressources pétrolières nationales et réduit les contraintes logistiques sur l'économie dans son ensemble."
 SOV_Early_Atomic_ReD_Strategic_Science_desc: "La recherche scientifique en physique nucléaire et dans les domaines connexes devient une priorité stratégique dans l'après-guerre. Ces efforts contribuent à la fois au développement de l'énergie civile et aux capacités de défense nationale dans un environnement international de plus en plus compétitif."
 SOV_Electrification_of_the_Economy_desc: "L'expansion des infrastructures électriques reste un objectif central de la politique économique soviétique. Une plus grande électrification soutient la production industrielle, modernise les régions rurales et améliore la productivité globale dans l'ensemble de l'Union."
 SOV_Expand_Transportation_Infrastructure_desc: "Les chemins de fer, les routes et les canaux constituent l'épine dorsale de l'économie planifiée. L'investissement continu dans les infrastructures de transport améliore la distribution interne, réduit les goulots d'étranglement et soutient la coordination industrielle à long terme."
 SOV_Complete_Ukrainian_Reconstruction_desc: "L'Ukraine a subi d'importantes destructions pendant la guerre, en particulier dans ses régions industrielles et agricoles. L'achèvement des efforts de reconstruction est essentiel pour restaurer la capacité de production et réintégrer la république dans le plan économique national."
 SOV_The_Fourth_and_Fifth_Five_Year_Plan_desc: "Les quatrième et cinquième plans quinquennaux visaient la reconstruction d'après-guerre et la restauration des capacités industrielles et agricoles. Ces plans mettaient l'accent sur la reconstruction des régions détruites, le développement de l'industrie lourde et le rétablissement des bases de la croissance économique après les ravages de la Seconde Guerre mondiale."


