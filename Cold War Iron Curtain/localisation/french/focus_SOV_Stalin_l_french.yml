 SOV_Stalin_Announce_Stalins_Retirement: "Annoncer la retraite de Staline"
 SOV_Stalin_20th_Congress_of_the_Communist_Party: "Le 20e Congrès du Parti communiste"

 SOV_Stalin_The_Zhdanov_Doctrine_desc: "La doctrine Zhdanov, créée par Andrei Zhdanov, dicte que le monde est divisé en deux camps ; impérialiste et communiste ; avec nous comme leader de cette dernière et les États-Unis comme principale nation impérialiste."
 SOV_Stalin_Smuggle_Arms_to_Greek_Communists_desc: "La guerre civile a éclaté en Grèce et les forces communistes combattent courageusement face à l'oppression et à l'intervention occidentale. Nous savons que nous avons convenu d'avoir une sphère d'influence définie à Yalta, mais nous ne pouvons pas rester les bras croisés et regarder le feu de la Révolution s'éteindre."
 SOV_Stalin_Catch_Up_with_Western_Atomic_Research_desc: "L'énergie nucléaire - à la fois militaire et pacifique - sera l'un des facteurs décisifs dans la lutte à venir pour la survie, et nous ne pouvons pas nous permettre de rester à la traîne des Américains dans ce domaine."
 SOV_Stalin_Enact_a_Complete_Embargo_on_Yugoslavia_desc: "Le maréchal Tito et ses alliés en Yougoslavie refusent de s'intégrer au Komintern, malgré nos similitudes naturelles. Nous devons intensifier nos efforts diplomatiques pour faire pression sur eux."
 SOV_Stalin_Increase_Funding_for_Western_Communist_Parties_desc: "La France et l'Italie disposent déjà de partis communistes puissants, mais ils sont étranglés par la politique gouvernementale et les attaques radicales. Nous devons soutenir nos frères à l'étranger de toutes les manières possibles."
 SOV_Stalin_Suspend_Claims_on_Turkish_Lands_desc: "L'une des questions sur lesquelles nous avons essayé de insister est celle du détroit de Turquie, car leur possession nous donnerait un accès total à la Méditerranée et aux océans au-delà. Cependant, cela ne relève pas de notre compétence et nous devrions donc abandonner nos revendications."
 SOV_Stalin_Delay_Austrian_Independence_desc: "Les Autrichiens et les trois autres puissances alliées nous font pression pour l'indépendance de l'Autriche, mais nous estimons que les Autrichiens devraient rester sous notre emprise pendant un certain temps encore, car ils ont été responsables de deux guerres mondiales et nous n'en aimerions pas une troisième."
 SOV_Stalin_Maintain_Pressure_On_the_Turkish_Border_desc: "Le gouvernement turc a jusqu'à présent repoussé nos revendications sur les détroits et espère le soutien de l'Occident, mais si nous pouvons forcer un changement de régime, le nouveau gouvernement se contentera de nous donner ce que nous voulons."
 SOV_Stalin_An_Ultimatum_to_Yugoslavia_desc: "Les tentatives impertinentes de Tito et de la Yougoslavie pour nous ignorer et ignorer nos demandes sont allées trop loin, et il est temps qu'ils nous rejoignent ou qu'ils affrontent la puissance de l'Armée rouge."
 SOV_Stalin_The_Sino_Soviet_Treaty_of_Friendship_Alliance_and_Mutual_Assistance_desc: "Dans le cadre de nos actions de reconnaissance de la RPC et de reprise de notre reconnaissance de la République de Chine, nous avons signé un traité d'amitié, d'alliance et d'assistance mutuelle, offrant une coopération diplomatique plus amicale entre Moscou et Pékin."
 SOV_Stalin_Send_Military_Advisors_desc: "L'intervention directe est trop risquée à ce stade, mais nous pouvons nous permettre d'envoyer des « conseillers » militaires. Qu'ils soient impliqués dans le conflit n'est pas notre problème."
 SOV_Stalin_Increase_Korean_Production_Capabilities_desc: "En plus d'envoyer des canons, des chars et des avions, nous devrions également nous efforcer d'accroître la capacité de la Corée du Nord à fabriquer son propre équipement et à devenir plus autosuffisante."
 SOV_Stalin_Provide_Surplus_Tanks_desc: "De plus, la Corée du Nord a désespérément besoin de chars et de véhicules blindés pour compléter la poussée de son infanterie vers la Corée du Sud. De nouveaux modèles du T-54/55 seront présentés."
 SOV_Stalin_Direct_Intervention_In_the_Korean_War_desc: "Nous ne pouvons pas risquer que le régime de Kim Il Sung s'effondre sous la force d'une attaque de l'OTAN. Pas de plaisanterie ici. L'intervention directe est de loin préférable à un rôle plus passif."
 SOV_Stalin_Ensure_Kim_Regime_Survival_desc: "Maintenant que la guerre est terminée, il serait dommage que nous laissions le régime de Kim Il Sung s'effondrer et que tous nos efforts soient vains. Nous devons garantir la survie de son gouvernement pour montrer à l'Occident que nous sommes sérieux."
 SOV_Stalin_Prepare_For_the_Asian_Liberation_War_desc: "Depuis la fin de la guerre civile, la Chine reste particulièrement tendue. L'avancée de l'ONU vers le fleuve Yalu est allée assez loin, et des rumeurs courent selon lesquelles le PGNC et le Turkestan oriental pourraient s'impliquer. Nous devons être prêts."
 SOV_Stalin_Send_Surplus_Tanks_To_the_North_Koreans_desc: "D'autres T-54/55 excédentaires, ainsi que des modèles plus anciens, doivent être acheminés vers les Nord-Coréens pour garantir leur indépendance."
 SOV_Stalin_Expand_the_North_Chinese_Industrial_Base_desc: "L'industrie en Mandchourie est, au mieux, petite, et le gouvernement populaire du nord de la Chine a du mal à développer son économie ; l'aide d'une superpuissance comme la nôtre contribuera à leur succès !"
 SOV_Stalin_Send_In_The_Aviation_Corps_desc: "La situation en Chine et en Corée est allée assez loin. Plutôt que d'envoyer des troupes au sol, un de nos corps d'aviation, armé d'intercepteurs à réaction et de bombardiers tactiques, sera déployé dans la région pour assurer une sécurité maximale."
 SOV_Stalin_Smuggle_Guns_To_the_Vietnamese_desc: "Les communistes vietnamiens, dirigés par Hô Chi Minh, combattent les forces colonialistes françaises et seront précieux dans notre combat en Asie. Ils recevront également des armes."
 SOV_Stalin_Call_For_A_General_Peace_in_Asia_desc: "Le camarade Staline et le ministère des Affaires étrangères ont exhorté les dirigeants des deux camps, communistes et impérialistes, à parvenir à un accord sur les conflits fonciers, au lieu de se battre et de mourir. C'est un étrange changement d'avis pour Staline."
 SOV_Stalin_Send_The_Armed_Forces_desc: "La situation en Asie s'est suffisamment détériorée pour justifier notre intervention. Plusieurs divisions de l'armée soviétique sont déployées sur des points stratégiques de la région pour maintenir l'ordre."
 SOV_Stalin_The_Khabarovsk_War_Crimes_Trials_desc: "11 membres de l'armée japonaise du Guandong doivent être jugés aujourd'hui pour leurs crimes de guerre et leur implication dans des programmes d'armes chimiques et biologiques."
 SOV_Stalin_Recognize_Vietnams_Independence_desc: "Maintenant que le Vietnam s'est libéré des chaînes des forces colonialistes françaises, nous allons reconnaître son indépendance et faire pression pour son adhésion à l'ONU."
 SOV_Stalin_Purge_the_Leningrad_Dissenters_desc: "Maintenant que nous disposons des preuves de la culpabilité des communistes de Léningrad, nous pouvons les frapper et les purger par une série de procès."
 SOV_Stalin_Hold_The_Pavlovian_Session_desc: "Destinée à susciter l'intérêt pour la science et le développement en URSS, cette session ne fera que faire progresser notre développement dans le monde !"
 SOV_Stalin_Push_Khrushchev_To_Found_The_Black_Cat_Gang_desc: ""
 SOV_Stalin_Punish_Khrushchev_For_His_Failure_desc: "Les échecs de Khrouchtchev en tant que président du Parti de Moscou sont révélés et nous devons le punir équitablement pour ses erreurs. Cela ne sera pas toléré."
 SOV_Stalin_Deportation_of_Jehovahs_Witnesses_desc: "Les Témoins de Jéhovah sont un peuple étrange et ne devraient pas adorer publiquement dans un état athée. Ces individus seront rassemblés et déportés où ils pourront adorer seuls leur « Jéhovah »."
 SOV_Stalin_Dismantle_The_Jewish_Anti_Fascist_Committee_desc: "Le JAC a été créé à l'origine sous couvert de répandre la gloire du communisme et de l'Union à l'étranger auprès des communautés juives, mais ses véritables intentions sont désormais claires. La JAC n'est rien d'autre qu'un outil de la bourgeoisie."
 SOV_Stalin_Further_Investigate_The_Mingrelian_Affair_desc: "Dans un autre effort visant à affaiblir Beria, nous attaquerons ses plus fervents partisans, le groupe ethnique géorgien mingrélien. J'espère qu'il apprendra enfin sa place après cela."
 SOV_Stalin_19th_Congress_Of_The_Communist_Party_desc: "Le 19e Congrès du Parti communiste a enfin eu lieu et nous devrions nous réunir pour discuter des succès de notre nation."
 SOV_Stalin_Arrest_The_Treasonous_Doctors_desc: "Notre système d'espionnage a eu vent d'un complot juif massif et dégoûtant : les médecins juifs de Moscou vont empoisonner le camarade Staline et de nombreux autres responsables du Parti communiste ! Nous devons agir avant qu'ils puissent mettre à exécution cet horrible plan."
 SOV_Stalin_Arrest_The_Beria_Clique_For_Treason_desc: "Lavrenti Beria, bien qu'il soit un homme de main utile prêt à mener à bien nos projets et nos purges, a récemment acquis trop de notions de grandeur. Il est temps pour lui de se retirer."
 
 SOV_Stalin_Establish_the_Malenkov_Khrushchev_and_Beria_Troika_desc: "Au lendemain de la mort de Staline, un organe consultatif composé de trois membres, ou troïka, a été créé pour poursuivre le rôle du gouvernement. Composé de Gueorgui Malenkov, Nikita Khrouchtchev et Lavrenti Beria, ce groupe est fragile."
 SOV_Stalin_Investigate_Berias_and_Khrushchevs_Activities_desc: "Les activités et actions de Beria et Khrouchtchev dans les purges et autres actions au sein du Parti méritent un second regard, d'autant plus qu'ils sont 2 des 3 hommes les plus importants de l'URSS."
 SOV_Stalin_Suppress_the_East_Berlin_Uprising_desc: "Le soulèvement de Berlin-Est constitue une menace directe pour le mode de vie socialiste et fait le jeu des impérialistes occidentaux. Leurs actions ne resteront pas impunies, notamment de la part de l'Union Soviétique."
 SOV_Stalin_Arrest_Lavrentiy_Beria_desc: "Beria constitue une menace pour le maintien de ce gouvernement au pouvoir, en particulier pour son emprise sur les services secrets et la police. Nous devons l'arrêter et le faire sortir tant que nous le pouvons encore."
 SOV_Stalin_Arrest_Nikita_Khrushchev_desc: "Khrouchtchev est un sale réformiste et une menace pour la sécurité nationale et la fraternité socialiste de l'Union soviétique. Nous devons l'arrêter et le faire sortir tant que nous le pouvons encore."
 SOV_Stalin_Reopen_Our_Embassy_in_Israel_desc: "Même si les relations avec Israël sont tendues, notamment depuis qu'une bombe a explosé près de notre ambassade en février, nous devons rétablir des liens amicaux en rouvrant notre ambassade à Tel-Aviv."
 SOV_Stalin_Grant_Crimea_to_the_Soviet_Republic_of_Ukraine_desc: "La Crimée est à juste titre un territoire ukrainien, et maintenant que l'Ukraine fait elle-même partie de l'URSS en tant que RSS, nous jugeons opportun de restituer la Crimée."
 SOV_Stalin_Re_Empower_the_Secretariat_desc: "Dans ses dernières années en particulier, le camarade Staline s'est mis à mettre le Parti sur la touche et à faire de notre État communiste une sorte de one man show. Il est temps de redonner au Parti communiste la place qui lui revient dans notre société."
 SOV_Stalin_Send_Back_West_German_POWs_desc: "Ayant capturé des milliers de soldats allemands vers la fin de la Grande Guerre patriotique, nous n'en avons vraiment plus besoin. Ce serait un geste de bonne foi envers l'Occident, qu'il récupère ses prisonniers."
 SOV_Stalin_Extend_the_Government_Powers_desc: "En plus de mettre le Parti sur le côté, Staline a également fermé l'appareil du Parti, diminuant encore davantage son importance et son influence. Nous devons le réactiver pour renforcer le Parti."
 SOV_Stalin_Seek_the_Approval_of_the_Central_Committee_desc: "En dehors du Premier ministre Khrouchtchev, le Comité central est l'organisation la plus influente et la plus puissante de l'URSS. Nous aurons besoin de leur approbation si nous voulons accomplir quelque chose de qualité substantielle."
 SOV_Stalin_Lower_Retail_Prices_desc: "En réaffirmant le contrôle des prix dans le secteur agricole, nous protégerons nos agriculteurs et garantirons que tout le monde bénéficie d'un traitement équitable."
 SOV_Stalin_Establish_the_KGB_desc: "Le KGB - Komitet Gosudarstvennoy Bezopasnosti - qui se traduit en anglais par « Comité pour la sécurité de l'État », est notre réponse à la CIA. Il cherchera à propager nos intérêts et nos idéologies partout, à réprimer les dissidents internes et, à l'inverse, à semer la dissidence dans les pays de nos ennemis."
 SOV_Stalin_Establish_A_New_Diplomatic_Stance_desc: "Notre nouvelle position diplomatique apparaîtra à l'ouest comme une position plus douce, transformant peut-être le rideau de fer en une clôture grillagée. Mais les apparences sont trompeuses. Nous n'enverrons peut-être pas nos propres forces, mais nous continuerons de lutter pour le communisme à travers le monde."
 SOV_Stalin_Clear_Out_the_Gulags_desc: "Un autre sous-produit malheureux de la paranoïa de Staline est un nombre incroyable de prisonniers politiques, entassés dans un système du Goulag débordant et débordé. Le nettoyer permettra de rationaliser notre bureaucratie, de réduire nos dépenses et de gagner la confiance de notre population."
 SOV_Stalin_Investigate_the_Stalin_Purges_desc: "L'Affaire de Leningrad était un sale incident, provoqué par un dirigeant paranoïaque et vieillissant, qui se méfiait de tous les membres de l'Union qui conspiraient pour le tuer. Nous devons mettre cela derrière nous et nous en éloigner."
 SOV_Stalin_Pressure_Scientists_for_the_Hydrogen_Bomb_desc: "Si les Américains veulent prendre nos menaces au sérieux, nous devons être capables de causer les mêmes dégâts qu'eux. Et pour ce faire, nous avons besoin d'une bombe à hydrogène, le dernier développement en matière de technologie des armes nucléaires."
 SOV_Stalin_Reduce_Criminal_Sentences_desc: "Sous Staline, les gens recevaient les châtiments les plus sévères pour les crimes les plus mineurs. Cela a abaissé le moral de notre peuple et nous a fait perdre sa confiance. Nous devons montrer que nous travaillons à une véritable justice, que nous ayons réellement l'intention de l'obtenir ou non."
 SOV_Stalin_Begin_the_Virgin_Lands_Campaign_desc: "La campagne Terres Vierges vise à utiliser des terres auparavant intactes pour l'agriculture et les fermes. Cela augmentera nos capacités de production alimentaire et notre capacité de stockage des aliments."
 SOV_Stalin_Execute_Viktor_Abakumov_desc: "Le responsable du SMERSH est Viktor Abakumov, l'adjoint de Beria et son chef des purgeurs. Abakumov devrait être purgé, tout comme il l'a fait avec des centaines, voire des milliers d'innocents."
 SOV_Stalin_Push_for_Malenkovs_Resignation_desc: "Malenkov n'a jamais constitué une menace majeure pour le duumvirat, suffisamment pour exercer une influence sur l'influence, mais il était néanmoins suffisamment allié à Beria pour que nous devions le forcer à se retirer pacifiquement."

 SOV_Stalin_Appoint_Merkulov_Head_of_the_MVD_desc: "Maintenant que Beria a accédé à l'un des postes de direction les plus importants au sein de l'URSS, ses fonctions précédentes de ministre de l'Intérieur doivent être remplacées, en l'occurrence par Vsevolod Merkulov, l'un des fidèles adjoints de Beria."
 SOV_Stalin_Clean_the_Central_Committee_of_Khrushchevites_desc: "Puisque nous avons arrêté et éliminé l'influence de Khrouchtchev au sein de la troïka, nous devons effacer et nettoyer du Parti toute influence de son révisionniste bourgeois."
 SOV_Stalin_Prepare_A_Mass_Release_Plan_desc: "Aussi ironique que cela puisse paraître, préparer un plan de libération massive pour nos camps de travail et nos prisons garantira que nous saurons ce que nous ferons lorsque ce plan entrera en vigueur."
 SOV_Stalin_Reform_the_Secret_Services_desc: "En tant que responsable du ministère de l'Intérieur, Beria reconnaît la nécessité d'une réforme, ce qu'il n'a pas pu réaliser sous le camarade Staline. Maintenant qu'il est parti, nous pouvons passer à une nouvelle ère de sécurité intérieure."
 SOV_Stalin_Execute_Bulganin_desc: "Le ministre de la Défense nationale Nikolaï Boulganine est connu pour être un allié du réformateur Khrouchtchev. Étant le plus haut gradé de l'Armée rouge au sein du gouvernement, il ne peut pas rester à son poste."
 SOV_Stalin_Restart_of_the_Korenizatsiya_desc: "Korenizatsiya était une des premières politiques soviétiques d'intégration des nationalités non russes dans le Parti et le gouvernement central."
 SOV_Stalin_Emergency_Relief_for_the_Kolkhozy_desc: "Les kolkhozes, ou système de fermes collectives, ont désespérément besoin d'une aide d'urgence, en raison des famines et des pertes de récoltes."
 SOV_Stalin_Cancel_Superfluous_Projects_desc: "Les projets lancés par le camarade Staline, comme le Palais des Soviétiques, sont un gaspillage de nos ressources et devraient être réaffectés ailleurs."
 SOV_Stalin_Redirect_the_Nuclear_Project_Towards_Civilian_Use_desc: "Au lieu de nous limiter uniquement aux armes de guerre, nous devrions combattre notre crise énergétique en nous tournant vers l'énergie nucléaire pour l'électricité et d'autres usages civils."
 SOV_Stalin_Raise_Agricultural_Prices_desc: "Les prix des cultures doivent être augmentés pour suivre l'offre et la demande."
 SOV_Stalin_Reduce_Surplus_Equipment_Stockpiles_desc: "Les équipements excédentaires ne font que prendre la poussière dans nos entrepôts, et peut-être que les utiliser ou les donner à d'autres réduira la quantité de marchandises que nous devons stocker."
 SOV_Stalin_Abolish_Internal_Passports_desc: "Les passeports internes dans notre pays ne font qu'ajouter une couche supplémentaire d'inquiétude et d'inutilité au processus de voyage à travers l'Union. Leur suppression permettra une plus grande liberté de circulation à l'intérieur de nos frontières."
 SOV_Stalin_Empower_the_Presidium_desc: "Le Présidium devrait avoir plus de pouvoir au sein de notre gouvernement pour prendre des décisions cruciales."
 SOV_Stalin_Soften_Quotas_For_the_State_Farms_desc: "Les quotas des fermes d'État ont toujours été élevés, jamais suffisants pour leur permettre d'y parvenir. Afin de refléter les objectifs réels, le montant du quota sera réduit."
 SOV_Stalin_Fragment_the_Larger_Farms_desc: "Les grandes fermes d'État sont devenues lourdes et trop difficiles à gérer. La fragmentation de ces fermes en unités plus petites atténuera nos problèmes."
 
 SOV_Stalin_Establish_the_Malenkov_Pervukhinn_and_Saburov_Advisory_Body_desc: "Maintenant que le camarade Staline a survécu au complot contre sa vie, nous allons créer un groupe consultatif spécial pour soutenir son règne, comprenant Georgy Malenkov, président du Conseil des ministres ; Mikhail Pervukhinn, premier vice-président du Conseil des ministres et président du Gosplan ; et Maksim Saburov, également premier vice-président du Conseil des ministres et président du Gosplan et du Comité national de planification. "
 SOV_Stalin_Expand_the_GULAG_System_desc: "Il est devenu tout à fait clair que notre précédent système de camps de travail et d'emprisonnement n'a pas assez bien fonctionné, ayant révélé les traîtres au sein de notre gouvernement. Afin de consolider notre pouvoir, le système carcéral du Goulag sera étendu."
 SOV_Stalin_The_Khrushchev_Trial_desc: "Le camarade Nikita Khrouchtchev est un ancien membre de haut rang du Parti qui a tenté de tuer le camarade Staline et de lui prendre le pouvoir. Pour ses crimes et délits contre l'URSS, il sera jugé par la plus haute juridiction et condamné à mort immédiatement."
 SOV_Stalin_Begin_Construction_on_the_Great_Northern_River_Reversal_Project_desc: "Le camarade Staline a exprimé son intérêt pour l'inversion du débit de quelques rivières coulant vers le nord afin de détourner l'eau nécessaire de l'Arctique vers les steppes d'Asie centrale. Nous nous lancerons en toute hâte dans cette entreprise !"
 SOV_Stalin_The_Armenian_Azeri_Border_Problem_desc: "Entre l'empire impérialiste russe et la formation de l'Union soviétique, les pays de la mer Noire que sont l'Arménie et l'Azerbaïdjan, désormais RSS constituants de l'Union, étaient indépendants. Cependant, la frontière a toujours été controversée, même aujourd'hui, alors que les républiques sont intégrées au sein de l'Union."
 SOV_Stalin_Deport_Georgian_SSR_Minority_Populations_desc: "Le camarade Staline, originaire de la glorieuse RSS de Géorgie, a exprimé un favoritisme particulier à l'égard de sa patrie. Les populations minoritaires vivant en Géorgie, comme les Tchétchènes et les Ingouches, ainsi que les Azéris et les Arméniens, seront déportées vers leurs régions respectives pour assurer la supériorité des Géorgiens d'origine."
 SOV_Stalin_Investigate_Malenkov_Over_the_March_1953_Incident_desc: "Au lendemain de l'échec du complot des médecins et de la tentative d'assassinat contre Staline, Gueorgui Malenkov, président du Conseil des ministres et successeur présumé de Staline, a été placé sous le microscope. Son implication dans cette affaire est suspecte et pourrait être le signe de ses tentatives de prise de pouvoir."
 SOV_Stalin_Merge_the_GVD_and_MVD_desc: "Le ministère de l'Intérieur et le ministère de la Défense ont pour l'essentiel les mêmes objectifs, la même stratégie et le même personnel nécessaire pour remplir leurs fonctions. Afin de ne pas compliquer la structure du gouvernement, ces deux organisations, le GVD et le MVD, seront fusionnées."
 SOV_Stalin_Divert_the_Pechora_River_into_the_Volga_Basin_desc: "Étant donné que la rivière Pechora est l'une des rivières qui se jettent dans l'Arctique et qu'elle figure sur la liste restreinte des rivières à détourner et à inverser, nous modifierons le cours de la rivière pour l'éloigner de son itinéraire naturel et le diriger vers le bassin de la Volga, où il s'étendra à la majorité de la Russie occidentale."
 SOV_Stalin_Transfer_Nagorno_Karabakh_and_Nakhchivan_desc: "Afin de résoudre le différend frontalier arméno-azerbaïdjanais, nous interférerons et annulerons les deux RSS et accorderons les territoires du Haut-Karabakh et du Nakhitchevan à la République socialiste soviétique d'Arménie."
 SOV_Stalin_Transfer_Nagorno_Karabakh_to_Armenia_desc: "Afin de résoudre le différend frontalier entre l'Arménie et l'Azerbaïdjan, nous déciderons que le Haut-Karabagh sera transféré à la République socialiste soviétique d'Arménie, mais le territoire du Nakhitchevan reste en litige."
 SOV_Stalin_Deport_Armenians_from_Nagorno_Karabakh_and_Nakhchivan_desc: "Pour résoudre le problème une fois pour toutes, nous expulserons simplement toutes les personnes d'origine arménienne des territoires contestés du Haut-Karabakh et du Nakhitchevan, et ne céderons ces territoires à aucune des deux RSS."
 SOV_Stalin_Prepare_Central_Asian_Population_Transfers_desc: "Les steppes d'Asie centrale ne sont pas très peuplées et nous devrions profiter de cette occasion pour préparer le transfert d'individus indésirables vers ces zones, où ils ne pourront jamais s'échapper."
 SOV_Stalin_Welcome_Suslov_Into_Stalins_Inner_Circle_desc: "Mikhaïl Souslov, chef du département de propagande du Comité central, a été un atout précieux pour le camarade Staline au cours de son mandat. Il sera promu dans le cercle restreint en devenant deuxième secrétaire du Parti communiste de l'Union soviétique, responsable des opérations quotidiennes du Secrétariat du Parti."
 SOV_Stalin_Revitalize_the_Caspian_Fisheries_desc: "Les pêcheries de la mer Caspienne sont confrontées à de nombreux problèmes, allant du manque de poisson au manque de moral et au vieillissement des infrastructures. Un programme gouvernemental sera entrepris dès que possible pour développer l'industrie de la pêche dans cette zone."
 SOV_Stalin_New_Caspian_Irrigation_Schemes_desc: "Avec toute l'eau détournée des rivières du nord de l'Arctique, nous mettrons en oeuvre des projets d'irrigation de masse dans la région caspienne pour augmenter nos rendements agricoles."
 SOV_Stalin_Deport_Azeri_Populations_in_Armenian_SSR_desc: "Les populations azerbaïdjanaises de la République Socialiste Soviétique Arménienne sont devenues agitées et problématiques. Pour alléger le fardeau et éviter les conflits, ces populations seront simplement envoyées en République socialiste soviétique d'Azerbaïdjan pour vivre parmi leur peuple."
 SOV_Stalin_Deport_Traitorous_Elements_in_Germany_desc: "Les individus rebelles et bourgeois d'Allemagne de l'Est qui ont osé se rebeller contre notre autorité seront sévèrement punis, en étant déportés vers des régions reculées du Kazakhstan pour le reste de leur misérable et misérable vie."
 SOV_Stalin_Trial_of_the_14_desc: "quatorze personnalités de haut rang au sein du Parti ont été accusées de trahison et de crimes contre l'État, notamment Molotov, Mikoyan, Vorochilov et d'autres personnalités inférieures de leur appareil RSS. Tous seront jugés selon nos lois et condamnés à mort."
 SOV_Restructuring_the_Kazakh_SSR_desc: "La République socialiste soviétique du Kazakhstan a besoin de réformes et de restructurations, notamment en raison de l'afflux d'autres populations dans la région."
 SOV_Establish_the_German_SSR_desc: "Après avoir déporté jusqu'à un million d'Allemands de l'Est accusés de trahison, nous leur donnerons simplement leur propre RSS, la République socialiste soviétique allemande, au Kazakhstan."
 SOV_Deport_Chechens_to_Tajikistan_desc: "Tous les membres de la minorité tchétchène vivant dans l'Union et dans les petites RSS seront déportés vers la RSS tadjike où ils vivront pour le reste de leur vie."
 SOV_Incorporate_Northeastern_Kazakhistan_into_Russia_desc: "Le nord-est du Kazakhstan est peu peuplé, mais à majorité russe ; nous ajouterons simplement ce territoire à la République socialiste fédérative soviétique de Russie."
 SOV_Transfer_Karakalpak_ASSR_to_Kazakh_SSR_desc: "Ayant fait partie de la RSS d'Ouzbékistan, la République socialiste soviétique autonome du Karakalpak sera transférée sous le contrôle de la République socialiste soviétique du Kazakhstan."
 SOV_Establish_the_Korean_SSR_desc: "Compte tenu de la forte population coréenne et des réfugiés fuyant la guerre de Corée, nous établirons la République socialiste soviétique de Corée."
 SOV_Sorting_Out_the_Turkic_SSR_Mess_desc: "Les RSS turques, notamment les RSS tadjikes, ouzbèkes, kazakhes et kirghizes, ont cruellement besoin d'être réparées et restructurées pour accueillir les populations en mouvement venant de partout dans l'Union."
 SOV_Transfer_Central_Asian_Ukrainians_to_Ukraine_desc: "Les personnes d'origine ukrainienne vivant dans la région de l'Asie centrale seront rapatriées dans leur pays d'origine, la République socialiste soviétique d'Ukraine, où elles pourront vivre avec leur peuple."
 SOV_Send_Central_Asian_Armenians_to_Armenia_desc: "Les personnes d'origine arménienne vivant en Asie centrale seront rapatriées dans leur pays d'origine, la République socialiste soviétique d'Arménie, où elles pourront vivre avec leur peuple."
 SOV_Stalin_Resettle_Uzbek_Populations_desc: "Les populations ouzbèkes devraient appartenir à la RSS d'Ouzbékistan et non aux autres RSS turques. Les déportations et les réinstallations se feront en toute hâte."
 SOV_Stalin_Allow_Shelepin_Into_the_Presidium_desc: "Alexandre Chelepine, premier secrétaire du Komsomol ou Ligue des Jeunes Communistes Léninistes de toute l'Union, s'est révélé être un atout pour le Parti, notamment dans l'éducation de nos jeunes. Il sera promu au Présidium pour son dévouement fidèle au Parti et à ses idéaux."
 SOV_Stalin_Purge_Gromyko_and_Ponomarenko_desc: "Andrei Gromyko et Panteleimon Ponomarenko sont deux individus au sein du Parti RSS de Biélorussie, fortement impliqués et fortement corrompus. Leurs agissements et leur présence ne seront pas tolérés dans notre appareil."
 SOV_Stalin_Give_Kosygin_A_Place_in_the_Government_desc: "Alexeï Kossyguine a connu une période mouvementée au sein de notre gouvernement. Sortant de la Grande Guerre Patriotique en tant que candidat membre du Politburo, il devint ministre des Finances jusqu'à la mort de son patron Jdanov et il fut relégué à des postes inférieurs. Maintenant que la situation s'est stabilisée, nous allons redonner à Kossyguine une place au sein du gouvernement en tant que ministre des Finances."
 SOV_Stalin_The_Golubtsova_Affair_desc: "Selon des informations internes, Gueorgui Malenkov, président du Conseil des ministres, vivait avec une femme nommée Golubtsova avec laquelle il n'était pas légalement marié. Cela fera l'objet d'une enquête approfondie !"
 SOV_Stalin_Appoint_Zhukov_to_the_Defense_Ministry_desc: "Le maréchal de l'Union soviétique Gueorgui Joukov est devenu un grand héros, notamment pendant la Grande Guerre patriotique. En reconnaissance de ses réalisations, nous le nommerons au plus haut grade militaire de l'URSS, celui de ministre de la Défense."
 SOV_Stalin_Prepare_the_Succession_desc: "Staline vieillit et exprime le désir de démissionner et de se retirer de son mandat de secrétaire général. Nous devons nous dépêcher de préparer la transition et de nommer un successeur pour le remplacer avant qu'une prise de pouvoir n'ait lieu."
 SOV_Stalin_Announce_Stalins_Retirement_desc: "Le moment est venu de faire connaître au monde et à notre peuple la retraite du camarade Staline."
 SOV_Stalin_20th_Congress_of_the_Communist_Party_desc: "L'heure est venue de la 20e réunion du Parti communiste de l'Union soviétique, et de nombreuses décisions doivent être prises..."

 KhrushchevArrest: "Khrouchtchev sera arrêté."
 BeriaArrest: "Beria sera arrêté."
 MalenkovLoss: "Malenkov perdra considérablement son pouvoir et son influence au sein du Parti."
 MalenkovArrested: "Malenkov sera arrêté."
 
 #KAGANOVICH FOCUSES
 SOV_Analyse_the_results_of_the_Seventh_five_years_plan: "Analyser les résultats du septième plan quinquennal"
 SOV_Kaganovichs_Union: "L'Union de Kaganovitch"
 SOV_Kaganovichs_Union_desc: "Le camarade Lazar Moiseyevich Kaganovich a assumé le poste de secrétaire général du PCUS à la suite du départ à la retraite du camarade Staline. Largement considéré comme un fervent partisan de la politique de Staline, Kaganovitch a promis de guider le peuple et le Parti vers de nouveaux sommets. L'Union soviétique semble prête à se replier sur elle-même et à concentrer ses efforts sur la réalisation du socialisme dans un seul pays."
 SOV_Step_Away_From_the_Personality_Cult: "Éloignez-vous du culte de la personnalité"
 SOV_Step_Away_From_the_Personality_Cult_desc: "Bien que les actes du camarade Staline soient innombrables et que ses actions aient non seulement sauvé l'Union soviétique dans ses moments les plus sombres, mais ont également permis à l'Union de progresser, il a été l'un des nombreux à avoir consacré leur vie à la cause marxiste-léniniste. Il faut éviter de maintenir le culte de la personnalité qui s'est développé autour de lui, sous peine de tomber dans la déification et le dogmatisme."
 SOV_Focus_on_the_Greater_Good: "Concentrez-vous sur le bien commun"
 SOV_Focus_on_the_Greater_Good_desc: "Le collectivisme est l'une des valeurs les plus importantes de notre idéologie et de notre peuple. Alors que les impérialistes considèrent leurs propres compatriotes comme des outils à exploiter, le camarade Lénine nous a enseigné la voie d'une véritable civilisation. Nous devons recentrer notre propagande sur le dévouement et l'héroïsme du peuple soviétique, porteur du flambeau de la cause communiste."
 SOV_Refocus_Propaganda_Toward_Lenin: "Recentrer la propagande vers Lénine"
 SOV_Refocus_Propaganda_Toward_Lenin_desc: "Sous la direction du camarade Staline, un culte de la personnalité s'est créé autour de lui. Même si Staline était un grand homme, dans ce cas précis, il se trompait. Staline n'était qu'un fidèle serviteur de Lénine, et nous devons réapprendre à notre peuple à être fidèle non pas aux hommes, mais à l'idéal soviétique. Lénine a vécu, Lénine vit et Lénine vivra aussi longtemps que nous resterons fidèles à la cause de Lénine."
 SOV_Empathise_the_Collective_Leadership: "Mettre l'accent sur le leadership collectif"
 SOV_Empathise_the_Collective_Leadership_desc: "L'Union soviétique n'est pas une autocratie comme l'Empire russe avant elle. Le camarade Kaganovitch est peut-être le premier parmi ses pairs, mais le Politburo dans son ensemble doit participer à la gouvernance de notre grande Union, en défendant les valeurs de la démocratie soviétique."
 SOV_Internal_Work_on_Errors: "Travail interne sur les erreurs"
 SOV_Internal_Work_on_Errors_desc: "Un communiste ne doit jamais s'asseoir sur ses lauriers. Les impérialistes travaillent chaque jour pour accroître leur pouvoir et nous devons donc nous tourner vers l'intérieur et nous engager dans notre propre programme de réforme. Il ne s'agit pas d'une trahison des idées communistes, mais plutôt d'un achèvement de celles-ci. Nous remettrons en état de marche l'appareil du Parti, depuis les plus petits villages jusqu'au Comité central lui-même. "
 SOV_Strengthen_the_party_Structure_and_Legality: "Renforcer la structure et la légalité du parti"
 SOV_Strengthen_the_party_Structure_and_Legality_desc: "Des réglementations et des règles sont nécessaires pour maintenir la fonctionnalité de tout système. Alors que nous passons de la dictature du prolétariat à un véritable État de droit, nous codifierons les statuts du PCUS pour lutter contre la corruption et les abus et démocratiser l'appareil du Parti afin que tous les membres puissent faire entendre leur voix. La collectivisation du Parti est la victoire du communisme."
 SOV_Analyse_COMECON_Efficency: "Analyser l'efficacité du COMECON"
 SOV_Analyse_COMECON_Efficency_desc: "Le COMECON a été créé par le camarade Staline en réponse au plan Marshall dirigé par les États-Unis, promouvant le commerce et une planification économique commune entre les États du bloc de l'Est. Malheureusement, ce système s'est révélé inefficace et est considéré par nombre de nos économistes comme une ponction sur le Trésor. Nous devons analyser ses échecs et restructurer le COMECON pour en faire un digne vaisseau de l'amitié des peuples."
 SOV_Recreate_the_Komintern: "Renaissance du Komintern"
 SOV_Recreate_the_Komintern_desc: "Après la formulation par Staline du « Socialisme dans un seul pays », l'Union soviétique s'est retirée de son objectif de propager la Révolution. C'était un mal nécessaire à l'époque : l'Union était faible et manquait de reconnaissance internationale. Maintenant que nous sommes une force avec laquelle il faut compter, nous n'avons plus aucune raison de céder au capitalisme. Le Komintern sera prêt à soutenir les travailleurs du monde entier partout où ils se soulèveront contre le Capital."
 SOV_Reorganise_the_Party_Status: "Réorganiser le statut du parti"
 SOV_Reorganise_the_Party_Status_desc: "Le Parti communiste a toujours été censé être une organisation de masse. Malheureusement, le Parti s'est déconnecté de la classe ouvrière, une situation contraire à la doctrine marxiste-léniniste. La liste du Parti sera élargie, ajoutant des millions de nouvelles voix au choeur de notre grand Parti communiste."
 SOV_Make_New_Legal_Frameworks: "Créer de nouveaux cadres juridiques"
 SOV_Make_New_Legal_Frameworks_desc: "L'appareil d'État soviétique a grand besoin d'être réformé. De nouveaux cadres juridiques seront créés pour définir clairement les pouvoirs et les devoirs des bureaucrates et des fonctionnaires et leur donner la marge de manoeuvre nécessaire pour s'acquitter au mieux de leurs fonctions."
 SOV_Start_the_program_of_Militsiya_Motorization: "Démarrer le programme de motorisation de la police"
 SOV_Start_the_program_of_Militsiya_Motorization_desc: "Les Militsiya sont responsables du maintien de l'ordre dans le pays, à l'instar des policiers des démocraties occidentales. Attribuer des voitures de police plus modernes aux miliciens facilitera grandement la lutte contre la criminalité et assurera la sécurité de nos rues. Quiconque vole le peuple soviétique ne s'en sortira pas."
 SOV_Create_the_Commission_on_studying_and_amnesty: "Créer la Commission d'études et d'amnistie"
 SOV_Create_the_Commission_on_studying_and_amnesty_desc: "La dernière série de purges de Staline avant sa retraite a envoyé un grand nombre de personnes dans les Goulags. Même s'il avait certainement raison d'expulser du Parti les capitalistes potentiels, notre population carcérale est déraisonnablement élevée. Le camarade Kaganovitch a proposé une amnistie générale pour de nombreux détenus du Goulag et une commission chargée d'étudier le cas de certains prisonniers plus en vue. Que personne ne dise que le Parti n'est pas miséricordieux."
 SOV_Begin_Internal_Bond_Repayment: "Commencer le remboursement des obligations internes"
 SOV_Begin_Internal_Bond_Repayment_desc: "Comme de nombreux pays, le gouvernement soviétique génère des revenus grâce à la vente d'obligations d'État. Cependant, cela entraîne une accumulation de dettes, dont une grande partie est due à nos propres citoyens. Nous devrions nous serrer la ceinture à court terme si cela signifie rembourser nos dettes et faire preuve de responsabilité financière envers le peuple."
 SOV_Make_Specialized_Education_Free: "Rendre l'enseignement spécialisé gratuit"
 SOV_Make_Specialized_Education_Free_desc: "\"Donnez-moi quatre ans pour enseigner aux enfants et la graine que j'ai semée ne sera jamais déracinée\".\n\n Les paroles du camarade Lénine sont plus que jamais d'actualité. À mesure que notre monde devient technologiquement plus avancé, notre système éducatif doit relever le défi. À compter d'aujourd'hui, toutes les écoles techniques et universités seront gratuites pour les étudiants qualifiés. Tout le monde a la possibilité d'apprendre en Union soviétique."
 SOV_Introduce_Peoples_Control_Committee: "Présenter le Comité de la Commission populaire de contrôle"
 SOV_Introduce_Peoples_Control_Committee_desc: "Le Comité de la Commission populaire de contrôle est une organisation semi-gouvernementale composée des masses soviétiques qui donnent de leur temps pour examiner la conduite des représentants du gouvernement. Bien que l'idée existe depuis 1920 sous une forme ou une autre, le camarade Kaganovitch a élargi son autorité. Les PCCC auront le pouvoir de réprimander, d'imposer des amendes ou même de porter plainte contre des fonctionnaires corrompus."
 SOV_Replace_Lysenko_System: "Remplacer le système Lysenko"
 SOV_Replace_Lysenko_System_desc: "À l'époque stalinienne, les théories excentriques du biologiste Trofim Lyssenko sur la génétique et l'agriculture ont été approuvées par l'État, les généticiens mendéliens traditionnels étant persécutés. Les faibles rendements agricoles au fil des années ont prouvé que le lysenkoïsme était au mieux un échec et au pire un charlatanisme avec notre compréhension actuelle de la science. Nous rejoindrons la communauté scientifique en matière de génétique et remettrons notre agriculture sur les rails."
 SOV_Refocus_Planning_Toward_Consumer_Goods_Output: "Recentrer la planification vers la production de biens de consommation"
 SOV_Refocus_Planning_Toward_Consumer_Goods_Output_desc: "La capacité industrielle soviétique s'est concentrée pour l'essentiel sur l'industrie lourde. Nécessaire lors des premières industrialisations et de la Grande Guerre Patriotique, notre économie est suffisamment en forme pour recentrer la production vers les biens de consommation. Le peuple soviétique jouira véritablement d'un paradis ouvrier et fera honte aux impérialistes."
 SOV_Introduce_Pension_for_all_Workers_Groups: "Introduire une pension pour tous les groupes de travailleurs"
 SOV_Introduce_Pension_for_all_Workers_Groups_desc: "L'article 120 de la Constitution soviétique prescrit une assurance sociale pour les personnes âgées, les malades et les personnes physiquement incapables de travailler. Conformément à la Constitution, les pensions de vieillesse seront étendues à toutes les catégories de travailleurs, quels que soient leurs compétences ou leur rôle."
 SOV_Reform_Gardening_and_livestock_Ownership: "Réforme du jardinage et de la propriété du bétail"
 SOV_Reform_Gardening_and_livestock_Ownership_desc: "Au cours du processus de collectivisation, les agriculteurs se sont vu attribuer de petites parcelles privées pour y installer leurs maisons. Les analyses de nos kolkhozes ont montré à plusieurs reprises que les parcelles privées sont devenues essentielles pour notre approvisionnement alimentaire. Bien qu'un retour à l'époque des koulaks soit hors de question, l'expansion des parcelles privées et du bétail améliorera le moral et le niveau de vie dans les fermes collectives."
 SOV_Create_Roadmap_for_Internal_Debt_Repayment: "Créer une feuille de route pour le remboursement de la dette interne"
 SOV_Create_Roadmap_for_Internal_Debt_Repayment_desc: "Notre remboursement initial de la dette intérieure était un bon début, mais nous devons établir un plan solide pour rembourser le reste de nos dettes à la population. Même si cela pourrait limiter nos dépenses dans d'autres affaires de l'État, garantir la solvabilité continue de notre système financier et la confiance de notre population vaut tous les prix."
 SOV_Principle_of_Budgetary_Responsability: "Principe de responsabilité budgétaire"
 SOV_Principle_of_Budgetary_Responsability_desc: "Le peuple soviétique ne peut pas dépenser plus d'argent qu'il n'en a, mais son gouvernement le peut. Le Parti, qui, selon les principes marxistes, est constitué des masses travailleuses, ne doit bénéficier d'aucun traitement spécial. Nous mettrons de l'ordre dans nos chéquiers et gouvernerons la nation d'une main ferme et responsable."
 SOV_Analyse_the_results_of_stalin_five_years_plan: "Analyser les résultats du dernier plan quinquennal"
 SOV_Analyse_the_results_of_stalin_five_years_plan_desc: "Le cinquième plan quinquennal fut le dernier à avoir lieu sous la direction de Staline, donnant la priorité à l'expansion de l'industrie lourde, aux infrastructures et à la réduction des coûts. Le camarade Kaganovitch a chargé le GOSPLAN d'analyser ses résultats et de formuler des recommandations sur la voie à suivre pour le prochain plan quinquennal."
 SOV_Focus_on_application_of_Leninist_Principles: "Focus sur l'application des principes léninistes"
 SOV_Focus_on_application_of_Leninist_Principles_desc: "Le marxisme-léninisme est le marxisme mis en pratique, la science qui guide notre chemin vers le communisme. Staline était un fidèle serviteur de l'enseignement léniniste, tout comme le camarade Kaganovitch. Les rangs du parti doivent lire et relire les théories de Lénine et les appliquer dans leur travail quotidien."
 SOV_Maintain_Unity_of_Central_Comittee_and_Party_Apparatus: "Maintenir l'unité du Comité central et de l'appareil du Parti"
 SOV_Maintain_Unity_of_Central_Comittee_and_Party_Apparatus_desc: "L'appareil du Parti est une énorme machine dirigée par un très petit Comité central. Le principe léniniste du centralisme démocratique doit être maintenu si l'on veut que le Parti prospère. Le Comité central et les rangs du Parti penseront d'une seule voix, parleront d'une seule voix et oeuvreront vers un seul objectif."
 SOV_XXIth_CPSU_Congress: "XXIe Congrès du PCUS"
 SOV_XXIth_CPSU_Congress_desc: "Le 21e Congrès du PCUS sera le premier sous la direction du secrétaire général Kaganovitch. Il a proposé un nouveau programme de réforme politique et sociale à ratifier par le Soviet suprême, axé sur la construction d'une société meilleure pour le citoyen soviétique commun. Une nouvelle ère du socialisme approche et le Parti tout entier est prêt à la réaliser pleinement."
 SOV_Introduce_People_Control_Into_Law_Enforcement: "Introduire la Commission populaire de contrôle dans l'application de la loi"
 SOV_Introduce_People_Control_Into_Law_Enforcement_desc: "Les Militisya soviétiques ont pour but de protéger le peuple du crime. Il est donc totalement inacceptable que certains membres de cette organisation soient eux-mêmes des escrocs, abusant de la confiance du public et de leur autorité à des fins personnelles. Tout comme la Commission populaire de contrôle examine l'appareil du Parti, nous devons également donner au peuple le droit d'exiger des comptes des forces de l'ordre."
 SOV_Strengthen_Procurator_Office_And_Expand_PPC_Cooperation: "Renforcer le Bureau du Procureur et étendre la coopération avec le PCC"
 SOV_Strengthen_Procurator_Office_And_Expand_PPC_Cooperation_desc: "Conscient du principe du contrôle populaire sur l'application de la loi, le PCC sera habilité à déférer les actes répréhensibles des miliciens aux procureurs. Les procureurs recevront à leur tour davantage de fonds pour éradiquer la criminalité et la corruption de notre patrie socialiste."
 SOV_Improve_Militsoners_Training_and_Equipment: "Améliorer la formation et l'équipement des militaires"
 SOV_Improve_Militsoners_Training_and_Equipment_desc: "La Militsiya a manqué à ses devoirs de lutte contre la criminalité et de protection du peuple soviétique. Le camarade Kaganovitch a ordonné que la Militisiya ait accès à toutes les armes, véhicules et équipements dont elle a besoin pour maintenir la paix. Les miliciens nouveaux et actuels seront également soumis à des normes de formation et de discipline plus strictes, afin de garantir qu'ils sont dignes de la confiance que nous leur accordons."
 SOV_Hire_More_Rural_Militsioners: "Embaucher davantage de militants ruraux"
 SOV_Hire_More_Rural_Militsioners_desc: "La Militsiya est en grande partie une force de police urbaine, laissant nos zones rurales vulnérables à la criminalité. Nous formerons de nouveaux miliciens issus des zones rurales pour mieux contrôler les régions les moins peuplées du pays."
 SOV_Strengthen_High_Level_Party_Disciplines: "Renforcer la discipline de parti à haut niveau"
 SOV_Strengthen_High_Level_Party_Disciplines_desc: "Les plus hauts échelons de notre Parti disposent des pouvoirs les plus élevés, mais un grand pouvoir implique de grandes responsabilités. La discipline, le dévouement et l'honnêteté doivent être tenus au coeur de tous ceux à qui le peuple accorde une telle confiance. Quiconque abuse de ces fonctions doit faire face à toute la justice socialiste."
 SOV_Introduction_of_Peoples_Control_into_Education: "Introduction de la Commission populaire de contrôle dans l'éducation"
 SOV_Introduction_of_Peoples_Control_into_Education_desc: "La Commission populaire de contrôle a un grand intérêt à améliorer notre système éducatif, après tout, bon nombre de ses membres sont eux-mêmes des mères et des pères. Le PPC aura le pouvoir d'examiner nos écoles et de garantir que nos enfants ne reçoivent que la meilleure éducation soviétique."
 SOV_Fund_Expansion_of_Elementary_and_Medium_Schools: "Financer l'expansion des écoles primaires et secondaires"
 SOV_Fund_Expansion_of_Elementary_and_Medium_Schools_desc: "L'accès à l'éducation n'est pas encore égal dans toutes les régions de l'Union, et de nombreux domaines restent mal desservis par le système scolaire. De nouvelles écoles primaires et secondaires seront construites pour offrir un enseignement primaire à la jeunesse de notre pays dans toutes les régions de la Patrie. Aucun enfant ne sera laissé pour compte." #Comrade George W. Bush approves
 SOV_Expand_Pedagogy_Education_Schools: "Développer les écoles d'enseignement pédagogique"
 SOV_Expand_Pedagogy_Education_Schools_desc: "Un réseau scolaire élargi nécessitera davantage d'enseignants. De nouvelles académies d'enseignants seront construites pour former une nouvelle génération d'éducateurs aux dernières innovations pédagogiques. L'éducation sera la voie vers le communisme !"
 SOV_Expand_numbers_of_Technical_Students: "Augmenter le nombre d'étudiants techniques"
 SOV_Expand_numbers_of_Technical_Students_desc: "Les domaines de la science et de l'ingénierie ont connu des progrès sans précédent au cours du siècle dernier. Une nouvelle génération d'industries, d'électronique et d'informatique aura besoin d'une nouvelle génération de scientifiques et d'ingénieurs pour nous maintenir dans la mêlée avec les impérialistes. Tous les étudiants qui démontrent des compétences en mathématiques et en sciences devraient bénéficier de toutes les possibilités offertes par l'État pour suivre une formation dans les disciplines techniques."
 SOV_Expand_numbers_of_Medical_Students: "Augmenter le nombre d'étudiants en médecine"
 SOV_Expand_numbers_of_Medical_Students_desc: "Le système de santé soviétique a besoin d'être réformé et est à la traîne des puissances impérialistes. Les étudiants qui démontrent des compétences et un intérêt pour la médecine devraient avoir toutes les chances dont dispose l'État pour recevoir une formation en sciences médicales." #I. AM. A. SURGEON!
 SOV_Overhaul_Rural_Education: "Réviser l'éducation rurale"
 SOV_Overhaul_Rural_Education_desc: "Le camarade Lénine a fait de l'éducation des femmes et de la paysannerie une priorité du nouvel État soviétique. Nous devons honorer son héritage et réformer notre système éducatif pour répondre aux besoins des citoyens ruraux afin qu'ils puissent profiter d'un monde agricole de plus en plus technique."
 SOV_Introduction_of_Peoples_Control_in_the_Soviet_Healthcare: "Introduction de la Commission populaire de contrôle des soins de santé soviétiques"
 SOV_Introduction_of_Peoples_Control_in_the_Soviet_Healthcare_desc: "La Commission populaire de contrôle doit être mise au travail pour examiner l'état de notre système de santé. De nombreux hôpitaux manquent d'équipements adéquats, les médecins ne prennent pas leurs fonctions au sérieux et les hôpitaux restent mal administrés. Comment pouvons-nous tolérer de telles choses alors que notre propre constitution consacre le droit aux soins de santé ?"
 SOV_Expand_Medical_Research_Facilities: "Agrandir les installations de recherche médicale"
 SOV_Expand_Medical_Research_Facilities_desc: "La science médicale soviétique est depuis de nombreuses années à la traîne des impérialistes. Le camarade Kaganovitch comprend que le peuple soviétique mérite mieux. Nous mettrons nos meilleurs esprits médicaux au service de la création de nouveaux médicaments et équipements, afin que le peuple soviétique puisse même vaincre la maladie."
 SOV_Expand_Medical_Equipment_Production_Facilities: "Agrandir les installations de production d'équipements médicaux"
 SOV_Expand_Medical_Equipment_Production_Facilities_desc: "Les progrès médicaux sont inutiles sans les moyens de produire des médicaments. Nous mettrons nos ingénieurs au travail sur de nouvelles installations de production médicale et créerons une véritable industrie médicale."
 SOV_Increase_Funding_For_Urban_Healthcare: "Augmenter le financement des soins de santé urbains"
 SOV_Increase_Funding_For_Urban_Healthcare_desc: "Nos centres urbains abritent une grande partie de notre population et ont besoin d'hôpitaux dignes des villes modernes. Nous étendrons les réseaux hospitaliers dans les grandes villes de l'Union, fournirons des équipements modernes et développerons le service national d'ambulance."
 SOV_Kickstart_Rural_Healthcare: "Démarrez les soins de santé ruraux"
 SOV_Kickstart_Rural_Healthcare_desc: "Les soins de santé en milieu rural représentent un défi en soi, car il y a moins d'infrastructures pour des hôpitaux avancés ou une réponse rapide aux urgences médicales. Cela ne signifie pas que nous ne pouvons pas affecter davantage de médecins dans les régions rurales, ni construire davantage de cliniques rurales. Tout le monde dans notre pays mérite de bons soins de santé."
 SOV_XXIIth_CPSU_Congress: "XXIe Congrès du PCUS"
 SOV_XXIIth_CPSU_Congress_desc: "Le 22e Congrès du PCUS est en session et le camarade Kaganovitch a un ambitieux programme de réforme politique. Il nous rappelle qu'être communiste, c'est être révolutionnaire, et fait l'éloge de la jeunesse du Komsomol, qui sera la prochaine génération de notre Parti. En outre, le camarade Kaganovitch a l'intention de réaliser toute l'étendue de la démocratie soviétique, en impliquant davantage le peuple dans toutes les affaires du gouvernement. Ne nous contentons pas du statu quo, mais progressons toujours vers le but ultime du communisme !"
 SOV_Draw_A_Plan_of_Komsomol_Reform: "Dessinez un plan de réforme du Komsomol"
 SOV_Draw_A_Plan_of_Komsomol_Reform_desc: "La Ligue des jeunes communistes léninistes de toute l'Union, ou « Komsomol » en abrégé, est l'association de jeunesse du Parti communiste. Même si ses membres ne font pas encore partie du PCUS, ils constituent les rangs de ses générations futures. Le Komsomol sera réformé en une organisation véritablement digne de former les communistes du futur."
 SOV_Focus_Komsomol_Ideological_Education: "Focus sur l'éducation idéologique du Komsomol"
 SOV_Focus_Komsomol_Ideological_Education_desc: "L'éducation a toujours été au premier plan de l'agenda communiste. Le camarade Lénine lui-même a lancé une campagne très réussie pour éradiquer l'analphabétisme. Mais pour être communiste, il faut bien connaître les théories du marxisme-léninisme. Nous ne pouvons pas risquer que les communistes du futur ignorent l'enseignement léniniste ou, pire encore, succombent aux tentations du capitalisme. Tous les Komsomolets connaissent par coeur les oeuvres de Marx, Engels, Lénine et Staline."
 SOV_Raise_Powers_and_Responsabilities_of_Komsorgs: "Augmenter les pouvoirs et les responsabilités des Komsorgs"
 SOV_Raise_Powers_and_Responsabilities_of_Komsorgs_desc: "Comment pouvons-nous faire du Komsomol le terrain de formation de nos futurs dirigeants si on ne leur donne pas la chance de devenir des dirigeants ? Les Komsorgs se verront attribuer davantage d'autorité et de responsabilités dans la gestion quotidienne du Komsomol, préparant ainsi notre jeunesse à défendre la démocratie soviétique."
 SOV_Raise_Wages_in_Komsomol_Construction_Groups: "Augmenter les salaires dans les groupes de construction du Komsomol"
 SOV_Raise_Wages_in_Komsomol_Construction_Groups_desc: "Même si peu de gens oseraient en parler, les groupes de construction du Komsomol sont plutôt mal payés pour le travail précieux qu'ils accomplissent pour l'État soviétique. Nous ne sommes pas des capitalistes et ces jeunes bâtisseurs du communisme seront équitablement rémunérés pour leur travail."
 SOV_Support_for_Komsomol_Members_Getting_High_and_Technical_Educations: "Soutien aux membres du Komsomol pour l'obtention d'une formation supérieure et technique"
 SOV_Support_for_Komsomol_Members_Getting_High_and_Technical_Educations_desc: "L'Union soviétique connaît une pénurie chronique de main-d'oeuvre : nous avons beaucoup d'emplois pour notre peuple, mais personne pour les occuper. En encourageant les membres du Komsomol à poursuivre des études universitaires ou techniques, nous pouvons former une nouvelle génération de professionnels prêts à servir l'Union soviétique."
 SOV_Increase_Lower_Ranks_Responsabilities_to_weed_out_Fellow_Travelers: "Augmenter les responsabilités des rangs inférieurs pour éliminer les autres voyageurs"
 SOV_Increase_Lower_Ranks_Responsabilities_to_weed_out_Fellow_Travelers_desc: "De nombreux jeunes, bien qu'intelligents et capables, rejoignent le Komsomol simplement pour obtenir ce poste tant vanté au Parti et les avantages qui en découlent, sans être véritablement engagés dans la cause communiste. Chacun devra faire sa part et les Komsomoltsy qui se soustraient à leurs devoirs seront exclus de l'organisation."
 SOV_Introduce_Voting_For_Head_of_Komsomol: "Introduire le vote pour le chef du Komsomol"
 SOV_Introduce_Voting_For_Head_of_Komsomol_desc: "Contrairement aux soi-disant « démocraties » occidentales, la démocratie soviétique couvre toutes les facettes de la vie, du lieu de travail aux organes du Parti. En permettant à nos membres du Komsomol d'élire le chef de l'organisation, nous pouvons élever une génération familière et pleinement engagée dans la cause de la démocratie soviétique."
 SOV_Introduce_Peoples_Control_into_CPSU_Regional_Work: "Introduire la Commission populaire de contrôle dans le travail régional du PCUS"
 SOV_Introduce_Peoples_Control_into_CPSU_Regional_Work_desc: "La Commission populaire de contrôle s'est jusqu'ici concentrée sur les structures nationales des partis, mais les branches régionales et républicaines du Parti communiste doivent également être soumises au contrôle populaire. Nous ne pouvons permettre la corruption ou l'incompétence à aucun niveau de gouvernement, de peur de perdre de vue la voie qui mène au communisme."
 SOV_Establish_Multimembers_Deputy_Districts: "Établir des districts adjoints multinominaux"
 SOV_Establish_Multimembers_Deputy_Districts_desc: "Il n'y a pas de démocratie sans socialisme, et pas de socialisme sans démocratie. Conformément à ce principe, certaines circonscriptions du Soviet suprême devraient se voir attribuer plusieurs députés, afin que leurs populations les plus nombreuses soient équitablement représentées dans les rangs du Parti." #not sure if this is correct, someone fluent in Marx-ese please verify
 SOV_Give_Verhovny_Soviet_power_to_decide_the_GENSEC_By_Voting: "Que le Soviet suprême vote pour le secrétaire général"
 SOV_Give_Verhovny_Soviet_power_to_decide_the_GENSEC_By_Voting_desc: "Le secrétaire général est actuellement élu parmi les membres du Politburo, le plus petit organe qui gouverne l'Union soviétique lorsque le Soviet suprême n'est pas en session. Donner ce pouvoir au Soviet suprême lui-même garantira que les hauts gradés de notre Parti ne se transformeront pas en une nouvelle bourgeoisie, mais resteront responsables devant le Parti et le peuple dans leur ensemble."
 SOV_Introduce_Legal_Term_Limits: "Introduire des limites de durée légale"
 SOV_Introduce_Legal_Term_Limits_desc: "Le principe de la dictature du prolétariat a nécessité que la direction du Parti serve le prolétariat sans transitions régulières de pouvoir. Le camarade Staline lui-même a exercé pendant plus de trois décennies le rôle de secrétaire général du Parti. Cependant, maintenant que nous avons atteint une forme développée de socialisme, nous pouvons limiter la durée du mandat des postes de direction au sein du Parti, y compris le camarade Kaganovitch, et introduire du sang frais dans les rangs."
 SOV_Peoples_Control_in_Reigonal_Shop_work: "Commission populaire de contrôle du travail dans les ateliers régionaux"
 SOV_Peoples_Control_in_Reigonal_Shop_work_desc: "La Commission populaire de contrôle est le héros méconnu de la démocratie soviétique. Dans toute l'Union, des millions de volontaires parmi la population scrutent les activités des bureaux locaux et régionaux du Parti, garantissant que les fonctionnaires corrompus et les saboteurs soient rapidement rendus justice. Leur autorité devrait également s'étendre aux ateliers régionaux afin que les travailleurs puissent véritablement protéger les moyens de production contre d'éventuels capitalistes parmi les dirigeants."
 SOV_Expand_Refrigirators_Production: "Augmenter la production de réfrigérateurs"
 SOV_Expand_Refrigirators_Production_desc: "En Occident, même les familles de travailleurs les plus pauvres peuvent se permettre d'avoir un réfrigérateur chez elles, mais le plus souvent, cette nécessité de la vie moderne se retrouve limitée aux foyers des apparatchiks. Dans le cadre d'un programme plus vaste d'investissement dans les biens de consommation, il faut veiller tout particulièrement à ce que chaque foyer soviétique dispose d'un nombre suffisant de réfrigérateurs."
 SOV_Create_The_Okean_Fish_Shop_Network: "Créer le réseau de poissonnerie « Okean »"
 SOV_Create_The_Okean_Fish_Shop_Network_desc: "La chaîne de marchés aux poissons « Okean » servira de société d'État pour la vente de tous les poissons et fruits de mer dans toute l'Union soviétique."
 SOV_Expand_Rural_Shop_Network: "Élargir le réseau de magasins ruraux"
 SOV_Expand_Rural_Shop_Network_desc: "De nombreuses régions rurales de notre patrie ont peu ou pas accès aux épiceries et sont donc plus exposées au risque d'insécurité alimentaire. Nous augmenterons le nombre et la qualité des magasins dans les zones rurales afin que tous les citoyens soviétiques aient accès à suffisamment de nourriture pour leurs familles."
 SOV_Overhaul_of_Shops_logistics_Network: "Refonte du réseau logistique des magasins"
 SOV_Overhaul_of_Shops_logistics_Network_desc: "Même si nous détestons l'admettre, les longues files d'attente et les pénuries chroniques sont devenues un incontournable de l'expérience d'achat soviétique. Le fier ouvrier soviétique ne devrait pas être récompensé de ses efforts en devant acheter du pain le mardi, des saucisses le vendredi et une nouvelle radio l'année prochaine. Nous rationaliserons notre réseau logistique de magasins, punirons sévèrement toute forme de corruption ou de favoritisme dans les rangs et augmenterons l'offre et la qualité des produits disponibles lorsque cela est possible."
 SOV_XXIIIth_CPSU_Congress: "XXIIIe Congrès du PCUS"
 SOV_XXIIIth_CPSU_Congress_desc: "En introduisant une limitation du nombre de mandats au poste de secrétaire général, le camarade Kaganovitch a pris la noble décision de démissionner de son poste de secrétaire général et de permettre au Soviet suprême d'élire son remplaçant lors du prochain congrès du Parti. Son leadership nous manquera beaucoup, mais il a clairement fait savoir qu'il ne s'accorderait pas de traitement de faveur."
 SOV_Decrease_The_Military_Numbers: "Diminuer les effectifs militaires"
 SOV_Decrease_The_Military_Numbers_desc: "L'armée soviétique, et l'armée tsariste avant elle, se sont souvent appuyées sur leur nombre pour vaincre leurs ennemis. Cela a peut-être fonctionné à l'époque des mousquets et des balles, ou même pendant la Grande Guerre patriotique, mais les guerres d'aujourd'hui sont menées avec des armes capables d'anéantir des villes entières. Plutôt qu'une bande de conscrits, l'armée soviétique doit devenir une force professionnelle hautement entraînée, entièrement dévouée à son devoir d'épée et de bouclier de la révolution."
 SOV_Expand_the_NCO_Ranks: "Élargissez les rangs des sous-officiers"
 SOV_Expand_the_NCO_Ranks_desc: "Actuellement, les sous-officiers ont peu d'autorité dans l'Armée rouge, n'étant guère plus que des soldats appelés en fin de service, ou pire encore, de vieux praporshchiks utilisant leur pseudo-autorité pour intimider les soldats pour qu'ils deviennent leurs serviteurs. Les Américains, quant à eux, forment leurs sous-officiers pour qu'ils deviennent des leaders, chargés de décider de la meilleure manière d'exécuter les ordres de leurs officiers. Il est peut-être sage d'élargir et de former nos rangs de sous-officiers pour qu'ils remplissent le même objectif."
 SOV_Create_Fortified_Region_Far_East: "Créer une région fortifiée Extrême-Orient"
 SOV_Create_Fortified_Region_Far_East_desc: "L'Extrême-Orient n'en abrite pas beaucoup. Il abrite cependant notre flotte du Pacifique et est vulnérable aux attaques de l'Amérique et de ses alliés dans le Pacifique. Si nous entrions en guerre contre les impérialistes, nous pourrions très bien marcher vers le Rhin, mais les Américains et leurs chiens de poche japonais nous poignarderaient dans le dos. Nous devons établir une forte présence militaire ici."
 SOV_Fortify_Vladivostok: "Fortifier Vladivostok"
 SOV_Fortify_Vladivostok_desc: "Vladivostok abrite la flotte du Pacifique, l'épée et le bouclier de l'Extrême-Orient soviétique. Même si la majeure partie de notre armée est concentrée sur l'OTAN à l'ouest, nous laissons nos positions cruciales à l'est vulnérables à une frappe impérialiste. Vladivostok doit être rendu imperméable à toute invasion à tout prix."
 SOV_Protect_the_Kurils: "Protégez les Kouriles"
 SOV_Protect_the_Kurils_desc: "Le Japon n'a jamais formellement reconnu notre souveraineté sur les îles Kouriles, malgré leur défaite face à nous en 1945. S'il avait l'idée de reprendre « leurs » îles par la force, nous devons avoir une présence navale suffisamment importante dans la région pour dissuader toute tentative d'invasion."
 SOV_Build_up_the_Kamchatka_Naval_Base: "Construire la base navale du Kamtchatka"
 SOV_Build_up_the_Kamchatka_Naval_Base_desc: "Le Kamtchatka se trouve à l'extrême pointe de la patrie soviétique. Son emplacement isolé en fait un emplacement privilégié pour une base sous-marine de pointe pour notre flotte du Pacifique, nous permettant non seulement de défendre nos eaux territoriales, mais également de frapper le coeur des États-Unis."
 SOV_Establish_the_Ohotsk_Sea_Defensive_Perimeter: "Établir le périmètre défensif de la mer d'Okhotsk"
 SOV_Establish_the_Ohotsk_Sea_Defensive_Perimeter_desc: "La mer d'Okhotsk fait partie de droit de nos eaux territoriales, mais reste vulnérable aux moyens navals américains et japonais. Un réseau de défenses côtières et de stations radar le maintiendra à l'abri de tout invité indésirable."
 SOV_Develop_New_Anti_ship_Missiles: "Développer de nouveaux missiles antinavires"
 SOV_Develop_New_Anti_ship_Missiles_desc: "Le missile a jusqu'à présent trouvé son utilité contre des cibles terrestres et aériennes, mais qu'en est-il de la mer ? Le missile antinavire est une nouvelle technologie prometteuse contre laquelle les marines impérialistes n'ont aucune défense. Nous n'avons aucune excuse pour ne pas investir dans des armes aussi précieuses."
 SOV_Create_Fortified_Region_North: "Créer une région fortifiée Nord"
 SOV_Create_Fortified_Region_North_desc: "Les régions du nord de l'Union soviétique s'étendent de la puissante ville de Leningrad, berceau de la Révolution, jusqu'aux étendues glaciales de la mer de Barents. Elle abrite également deux de nos flottes navales, la Flotte du Nord et la Flotte de la Baltique. Un réseau étroitement intégré de moyens terrestres, aériens et navals est nécessaire pour dissuader l'Occident de remettre en question notre présence dans les mers du Nord."
 SOV_Prepare_Finnish_Defense_measures: "Préparer les mesures de défense finlandaises"
 SOV_Prepare_Finnish_Defense_measures_desc: "Le gouvernement finlandais entretient peut-être des relations amicales avec nous, mais sa réhabilitation des criminels de guerre et des agresseurs du peuple soviétique prouve qu'on ne peut pas lui faire confiance. Une présence militaire plus importante doit être établie près de nos frontières terrestres et maritimes avec les Finlandais au cas où ils oublieraient leur place."
 SOV_Establish_new_garrisons_on_the_Baltic_Coast: "Établir de nouvelles garnisons sur la côte baltique"
 SOV_Establish_new_garrisons_on_the_Baltic_Coast_desc: "La flotte baltique est en grande partie basée à Kaliningrad, mais il existe d'autres sites clés sur la côte baltique, comme la ville de Riga. De nouvelles bases militaires seront construites et davantage de troupes seront affectées dans la région pour protéger les pays baltes soviétiques."
 SOV_Expand_the_bases_in_the_Barents_Sea: "Agrandir les bases dans la mer de Barents"
 SOV_Expand_the_bases_in_the_Barents_Sea_desc: "La mer glaciale de Barents est le terrain de jeu de notre flotte du Nord, même si sa portée s'étend bien plus loin. Bien que la plupart des îles du nord soient inhospitalières aux établissements humains permanents, certaines n'ayant été découvertes que dans les années 1920, certaines stations de surveillance météorologique et radar pourraient nous aider à garder un oeil sur l'activité de l'OTAN."
 SOV_Build_Fortifications_in_Murmansk: "Construire des fortifications à Mourmansk"
 SOV_Build_Fortifications_in_Murmansk_desc: "Le port de Mourmansk abrite notre flotte du Nord, essentielle à notre nombre croissant de sous-marins à longue portée. Cependant, Mourmansk elle-même est vulnérable aux attaques aériennes et navales, notamment de la part des moyens de l'OTAN stationnés dans la Norvège voisine. Un réseau de défenses antinavires et de nouveaux équipements antiaériens contribueraient grandement à protéger notre avant-poste nordique."
 SOV_Expand_Missile_Defense_System_in_Kaliningrad: "Développer le système de défense antimissile à Kaliningrad"
 SOV_Expand_Missile_Defense_System_in_Kaliningrad_desc: "Kaliningrad est l'une de nos bases les plus importantes sur la mer Baltique et, grâce à sa proximité avec l'Ouest, elle sera sûrement l'un des premiers endroits vers lesquels les avions occidentaux se dirigeront en cas de guerre. Kaliningrad sera un bastion provocateur contre les impérialistes, armé jusqu'aux dents des meilleurs missiles anti-navires et anti-aériens de notre arsenal."
 SOV_Favourize_Troops_Mobility: "Favoriser la mobilité des troupes"
 SOV_Favourize_Troops_Mobility_desc: "L'Union soviétique est le plus grand pays du monde et sa défense n'est pas une tâche facile. Le projet américain « Interstate » a inspiré nos esprits militaires. Les gars du GOSPLAN pourraient se plaindre du prix à payer, mais une armée mobile est une nécessité pour défendre la Révolution de Berlin à Vladivostok."
 SOV_Request_new_Artillery_Systems: "Demander de nouveaux systèmes d'artillerie"
 SOV_Request_new_Artillery_Systems_desc: "Des vagues d'artillerie après vagues ont renvoyé les Allemands vers Berlin lors de la dernière guerre. Un arsenal mis à jour, complété par des pièces à longue portée et des canons automoteurs, renverra sûrement l'OTAN vers Washington lors de la prochaine guerre."
 SOV_Extend_Interceptors_Production_chain: "Étendre la chaîne de production des intercepteurs"
 SOV_Extend_Interceptors_Production_chain_desc: "La stratégie nucléaire de l'OTAN s'appuie sur des flottes de bombardiers à réaction à longue portée et à haute altitude comme le B-52 et l'Avro Vulcan pour percer nos défenses aériennes. Construire davantage d'intercepteurs sera essentiel pour protéger la patrie d'une frappe nucléaire préventive."
 SOV_Create_Fortified_Region_South: "Créer une région fortifiée sud"
 SOV_Create_Fortified_Region_South_desc: "Les régions du sud-ouest de notre pays sont diversifiées en termes de terrain, de population et d'industries. De la ville héroïque reconstruite de Stalingrad aux côtes de Crimée en passant par le pétrole toujours crucial de l'Azerbaïdjan, la patrie serait confrontée au désastre si nous la laissions comme un ventre mou pour nos ennemis."
 SOV_Build_Nuclear_Bunkers_in_the_Caucasus: "Construire des bunkers nucléaires dans le Caucase"
 SOV_Build_Nuclear_Bunkers_in_the_Caucasus_desc: "Les montagnes du Caucase sont hautement défendables et constitueraient une tâche ardue à conquérir pour tout ennemi. Cela le rend parfait pour construire des réseaux d'abris antiatomiques hautement protégés en cas de guerre nucléaire."
 SOV_Expand_Moldova_Bunkers_Network: "Élargissez le réseau de bunkers moldaves"
 SOV_Expand_Moldova_Bunkers_Network_desc: "Les défenses de la Moldavie sont... Pour le moins manquantes. Avec quelques fonds supplémentaires, nous pouvons construire un réseau respectable de bunkers pour protéger nos troupes et nos civils essentiels contre les attaques conventionnelles et nucléaires."
 SOV_Modernize_Crimean_Coastal_Defense: "Moderniser les défenses côtières de Crimée"
 SOV_Modernize_Crimean_Coastal_Defense_desc: "La Crimée est au coeur de notre contrôle de la mer Noire. La plupart de nos défenses anti-navires et anti-aériennes étant désormais obsolètes, Sébastopol est vulnérable à une attaque des forces de l'OTAN, tout comme elle l'était par l'Allemagne pendant la Grande Guerre patriotique. La flotte de la mer Noire, fierté de la marine soviétique, ne bénéficiera que de la meilleure protection."
 SOV_Protect_the_Black_Sea_Touristic_Coast: "Protégez la côte de la mer Noire"
 SOV_Protect_the_Black_Sea_Touristic_Coast_desc: "La côte de la mer Noire possède certaines des stations balnéaires et des sanatoriums les plus raffinés de la mère patrie dont nos travailleurs peuvent profiter, mais elle n'est absolument pas protégée contre d'éventuelles frappes aériennes ou invasions. De nouvelles défenses anti-aériennes et des casernes pour les troupes stationnées sur les côtes feront de ce paradis de paix un enfer pour nos ennemis en guerre."
 SOV_Boost_Nuclear_Delivry_Systems: "Boostez les systèmes de livraison nucléaire"
 SOV_Boost_Nuclear_Delivry_Systems_desc: "Notre arsenal nucléaire est suffisamment important pour détruire le monde plusieurs fois. En revanche, notre infrastructure d'armes nucléaires ne l'est pas. Aucun effort ne doit être épargné pour amener nos systèmes de missiles et de silos au niveau de ceux de l'Occident et être prêts à frapper à tout moment."
 SOV_Create_Fortified_District_Central: "Créer un quartier central fortifié"
 SOV_Create_Fortified_District_Central_desc: "En cas de guerre, la Russie centrale est vulnérable aux attaques terrestres car elle n'est en aucun cas fortifiée. Des régions comme Smolensk, Briansk, Koursk et Belgorod constitueraient la première ligne de défense de Moscou si l'invasion venait de l'Ouest. La création d'un district fortifié dans ces oblasts garantira que nos coeurs industriels et politiques seront prêts à tout."
 SOV_Build_More_Nuclear_Bunkers_in_the_Moscow_Area: "Construire davantage de bunkers nucléaires dans la région de Moscou"
 SOV_Build_More_Nuclear_Bunkers_in_the_Moscow_Area_desc: "Moscou est notre capitale, le coeur battant de la patrie soviétique. S'il meurt, notre patrie pourrait très bien mourir avec lui. Si la guerre nucléaire devient réalité, nous serons prêts. Un vaste réseau d'abris antiatomiques et de bunkers sera construit pour protéger nos représentants du gouvernement et d'autres résidents importants de Moscou, garantissant ainsi la survie de la patrie."
 SOV_Boost_Western_Regions_Defensive_Missiles_Silos: "Renforcez les silos de missiles défensifs de la RSS occidentale"
 SOV_Boost_Western_Regions_Defensive_Missiles_Silos_desc: "Lors de l'invasion nazie en 1941, la Biélorussie et l'Ukraine furent les premières à tomber face à l'avancée allemande. Nous n'étions pas préparés, laissant la porte de notre patrie grande ouverte. Si la guerre devait à nouveau atteindre nos frontières, nous ne pourrions pas répéter deux fois la même erreur. Un réseau d'armes nucléaires tactiques dans la région constituera un puissant moyen de dissuasion contre tout envahisseur étranger."
 SOV_Protect_Central_Asian_Republics_Airspace: "Protéger l'espace aérien d'Asie centrale"
 SOV_Protect_Central_Asian_Republics_Airspace_desc: "Les républiques d'Asie centrale abritent désormais une industrie et un secteur de haute technologie en croissance rapide. Nous ne pouvons plus traiter ces terres comme des déserts vides. Même si protéger une zone aussi vaste ne sera pas une tâche facile, nous ne pouvons pas laisser nos ennemis considérer un seul centimètre du territoire soviétique comme vulnérable."
 SOV_Expand_Urals_and_Siberian_Military_Infrastructures: "Développer l'infrastructure militaire de l'Oural et de la Sibérie"
 SOV_Expand_Urals_and_Siberian_Military_Infrastructures_desc: "L'Oural et la Sibérie sont vastes et, bien que peu peuplés, sont riches en ressources naturelles. Un programme ambitieux de construction de chemins de fer et de routes à l'usage express de l'armée, de nouvelles défenses aériennes et un réseau de silos nucléaires secrets assureront la sécurité même jusqu'aux confins les plus éloignés de notre patrie."
 SOV_Improve_Ground_Based_Air_Defence_Network: "Améliorer le réseau de défense aérienne au sol"
 SOV_Improve_Ground_Based_Air_Defence_Network_desc: "L'histoire de l'aviation est celle d'une concurrence constante, et nos adversaires occidentaux nous ont donné plus qu'un égal dans le domaine de l'aviation militaire. La seule façon de réellement protéger notre patrie est de créer une force de défense aérienne sans précédent. Si quelqu'un réussit à traverser l'armée de l'air soviétique, un SAM sera la dernière chose qu'il ne verra jamais."
