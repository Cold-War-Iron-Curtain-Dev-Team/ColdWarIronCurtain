 SOV_STL.1.t: "Arrestation de Vassili Staline"
 SOV_STL.1.desc: "Vassili Staline, le quatrième fils du défunt dirigeant Joseph Staline, est une épine dans notre pied depuis la mort de son père. Peu de temps après la mort de Staline, Vassili, ivre de rage, affirma que son père avait été empoisonné. Même si, heureusement, cette allégation est sans fondement et n'a pas été diffusée en dehors des limites des plus hautes sphères de l'État, Vasily est resté irrégulier et représente une responsabilité générale envers le Parti. Après avoir rejeté les offres de diriger une région militaire, Vasily a récemment rencontré des diplomates étrangers dans un restaurant, ce qui nous a donné l'occasion d'arrêter Vasily et de le faire taire avant qu'il n'embarrasse davantage l'État. Vasily a déjà été arrêté et accusé de dénigrement des dirigeants de l'Union soviétique, de propagande anti-soviétique et de négligence criminelle, et condamné à huit ans de prison. Même s'il est regrettable qu'on en arrive là, un procès rapide sous un pseudonyme sans défense pour Vasily serait dans le meilleur intérêt de notre gouvernement et contribuerait au maintien de l'ordre public."
 SOV_STL.1.a: "Cet imbécile ne nous dérangera plus."
 SOV_STL.2.t: "Beria fait allusion au réformisme"
 SOV_STL.2.a: "Liberté !"
 SOV_STL.2.desc: "Lors d'une récente réunion du Présidium, le premier secrétaire Beria a surpris plusieurs membres en signalant son soutien à une réforme significative du système, de l'économie et de la politique étrangère soviétiques. Ces allusions à un engagement plus poussé avec l'OTAN et à une libéralisation économique ont sonné l'inquiétude des dirigeants les plus conservateurs du parti, d'autant plus que les rumeurs de nouvelles purges contre les ennemis de Beria sont devenues abondantes ces derniers jours. Alors que les alliés de Beria continuent d'être promus à des niveaux plus élevés au sein du parti, les tensions se sont accrues et pourraient se diriger vers un point de rupture dans les mois à venir. Les rapports du MVD ont également noté une augmentation significative du sentiment antigouvernemental de la part de l'Armée rouge et ont souligné la nécessité d'accroître la surveillance des officiers supérieurs et des vétérans de la Grande Guerre patriotique afin d'atténuer les conflits potentiels avec les forces armées."
 SOV_STL.3.t: "Beria soulève la question de la garantie de la stabilité et de la sécurité de l'État"
 SOV_STL.3.desc: "Alors que les tensions continuent de monter au sein du parti et de l'armée, le premier secrétaire Beria a soulevé la question de la garantie de la stabilité et de la sécurité de l'État lors d'une récente réunion du Présidium. Plusieurs questions ont été abordées tout au long de la réunion, notamment la nécessité d'assurer la loyauté de l'Armée rouge et de chercher à saper les éléments subversifs au sein du corps des officiers. Des inquiétudes ont également été soulevées quant à l'augmentation des taux de criminalité suite à la libération des détenus des camps de travaux forcés. Cependant, la question la plus importante discutée concerne les éléments subversifs et traîtres au sein des hauts échelons de la direction du parti. À la fin de la réunion enflammée, les officiers du MVD ont arrêté à la hâte les membres du Présidium Lazar Kaganovitch et Nikita Khrouchtchev. Tous deux ont été accusés de nombreux crimes, notamment de trahison passible de la peine de mort, et attendent actuellement leur procès. "
 SOV_STL.3.a: "A bas les staliniens !"
 SOV_STL.4.t: "Les grandes épreuves de Beria"
 SOV_STL.4.desc: "La mort du dirigeant soviétique de longue date Joseph Staline a créé un vide de pouvoir en Union soviétique qui a été manipulé par le ministre de l'Intérieur et ancien chef du NKVD, Lavrenti Beria. Cela a été une surprise majeure pour la communauté internationale, en particulier le changement rapide de Beria vers une position plus réformiste. Cependant, certaines choses ne changent jamais : des informations ont commencé à arriver faisant état de disparitions et d'exécutions de diverses personnalités notables du parti qui s'étaient opposées à son accession au pouvoir. Nikita Khrouchtchev et le vice-premier ministre Lazar Kaganovitch, notables du parti, ont été arrêtés pour trahison et autres accusations subversives et condamnés à mort. Bien qu'aucune confirmation n'ait été notée dans un sens ou dans l'autre, les rumeurs sur la disparition de Gueorgui Joukov ont abondé et ont provoqué un malaise important en Union soviétique. Le temps nous dira si Beria pourra pleinement consolider le pouvoir et mettre en oeuvre sa vision de l'Union ou si l'opposition pourra reprendre le contrôle de la nation."
 SOV_STL.4.a: "Inquiétant."
 SOV_STL.5.t: "Le problème du culte de la personnalité de Staline"
 SOV_STL.5.desc: "L'un des développements les plus controversés au cours du mandat de Staline a été le développement d'un culte de la personnalité autour du défunt dirigeant. Tout au long du règne de Staline, un vaste culte de la personnalité s'est développé autour de lui. Avec sa mort, nous devons maintenant faire face aux retombées et à l'héritage de ce culte de la personnalité. Certains notables du parti, comme l'ancien directeur adjoint de l'Agitprop, Piotr Pospelov, ont déjà fermement condamné la personnalité et le culte et ont appelé à la mise en oeuvre de vastes mesures de déstalinisation. Le pouvoir investi en Staline étant désormais réparti dans une structure de direction plus collective, nous avons désormais l'opportunité de lutter contre le culte perçu de l'individu. Cependant, aller trop loin dans cette approche comporte des risques majeurs. Même si le mouvement communiste international au sens large soutiendra sûrement les mouvements contre l'idée des cultes de la personnalité, attaquer et dénigrer directement l'héritage de Staline provoquera presque certainement des tensions majeures aux niveaux national et international et menacera notre leadership quasi incontesté du monde socialiste."
 SOV_STL.5.a: "Il était assez problématique."
 SOV_STL.6.t: "[GetMonth] Plénum de [GetYear]"
 SOV_STL.6.desc: "Depuis la mort de Staline, les tensions au sein du parti concernant la direction du parti et de l'État se sont intensifiées, notamment entre le premier secrétaire Nikia Khrouchtchev et le premier ministre Georgy Malenkov. Une prochaine réunion plénière du Soviet suprême fournira à chaque camp l'occasion de remporter une victoire décisive contre Khrouchtchev ou Malenkov. Des rumeurs ont déjà spéculé que Khrouchtchev soutiendrait Nikolaï Boulganine pour remplacer Malenkov au poste de Premier ministre, tandis que les alliés de Malenkov ont signalé leur désir de faire retirer Khrouchtchev du poste de Premier secrétaire. Le remplacement de Malenkov par Boulganine marquerait probablement la fin de l'opposition interne à Khrouchtchev, tandis que la destitution de Khrouchtchev marquerait probablement la fin de la série de réformes et de changements politiques de Khrouchtchev. Dans les deux cas, l'avenir de l'Union sera certainement façonné dans les années à venir. Comment devrions-nous procéder ?"
 SOV_STL.6.b: "Suivons la proposition de Boulganine, c'est Khrouchtchev !"
 SOV_STL.6.a: "Nous faisons confiance à Malenkov pour diriger l'Union !"
 SOV_STL.7.t: "[GetNewspaperHeader][SOV.GetLeader] Visite la Chine"
 SOV_STL.7.desc: "Le dirigeant soviétique [SOV.GetLeader] a récemment terminé sa visite en République populaire de Chine. Cela fait suite à des rapports faisant état de rumeurs de tensions croissantes entre les deux nations socialistes. Ces tensions seraient nées d'une perception d'exploitation de la Chine par l'Union soviétique et de la position moins conflictuelle des nouveaux dirigeants soviétiques à l'égard de Washington. Cependant, le dirigeant soviétique [SOV.GetLeader] semble avoir réussi à rétablir les relations entre les deux nations en établissant de nouveaux accords commerciaux, une reconnaissance formelle de l'injustice économique de Staline envers la RPC, quinze projets de développement industriel et des échanges de techniciens et de conseillers politiques, tandis que des ouvriers chinois étaient envoyés pour combler la pénurie de travailleurs manuels en Sibérie. Avec le potentiel de nouvelles réformes en Union soviétique et les tensions au sein du bloc entre des dirigeants davantage staliniens tels qu'Enver Hoxha et des modérés à Moscou, le temps nous dira si ce rapprochement est voué à l'échec ou s'il marquera le début d'une nouvelle ère de relations soviéto-chinoises."
 SOV_STL.7.a: "Une amitié construite pour durer !"
 SOV_STL.8.t: "[GetNewspaperHeader]Déclaration de Belgrade"
 SOV_STL.8.desc: "Le dirigeant soviétique [SOV.GetLeader] et le maréchal [YUG.GetLeader] ont signé aujourd'hui à Belgrade une déclaration commune historique. La Déclaration de Belgrade représente un rapprochement majeur entre les deux nations socialistes. L'Union soviétique a notamment garanti la non-ingérence dans les affaires intérieures de la Yougoslavie et légitimé le droit d'interpréter d'autres formes de développement socialiste dans différents pays. Cela survient après près d'une décennie de relations tendues entre les deux pays en raison de la dispute entre Tito et Staline en 1948, qui a conduit à un renforcement des relations et de l'engagement diplomatique entre les États-Unis et la Yougoslavie, et notamment entre la Yougoslavie et les pays de l'OTAN dans les Balkans. Il s'agit d'une victoire diplomatique majeure pour le dirigeant soviétique [SOV.GetLeader] et pourrait dissuader la Yougoslavie de poursuivre sa collaboration diplomatique avec l'OTAN."
 SOV_STL.8.a: "Développement intéressant."
 SOV_STL.9.t: "[GetNewspaperHeader]Moscou établit des liens avec l'Allemagne de l'Ouest"
 SOV_STL.9.desc: "L'Union soviétique n'a plus de liens avec la moitié occidentale de l'Allemagne depuis la division de l'Allemagne au lendemain de la Seconde Guerre mondiale. Des représentants diplomatiques de l'Union soviétique et de l'Allemagne de l'Ouest ont récemment confirmé que Moscou avait récemment établi des liens avec Bonn. Cela survient alors que [SOV.GetLeader] cherche à réduire les tensions avec l'Occident et à poursuivre les négociations diplomatiques avec les États d'Europe occidentale. Cependant, l'établissement de relations n'a pas conduit ni l'Allemagne de l'Ouest ni l'Allemagne de l'Est à réfuter leurs affirmations selon lesquelles elles seraient le seul gouvernement légitime ou résoudraient le problème actuel de Berlin. Malheureusement, les tensions persistantes entre les deux blocs et la politique de la corde raide géopolitique continueront d'empêcher une réunification de l'Allemagne. Les critiques conservateurs du Premier ministre [WGR.GetLeader] ont qualifié cette décision de trahison de la doctrine Hallstein."
 SOV_STL.9.a: "Cela pourrait-il conduire à la Réunification ?"
 SOV_STL.11.t: "Le débat agricole"
 SOV_STL.11.desc: "L'une des questions clés discutées récemment au Présidium est celle du développement agricole. Compte tenu des problèmes historiques de pénurie alimentaire dans les territoires composant l'Union soviétique, il est de la plus haute importance d'augmenter considérablement la production agricole de l'Union soviétique afin d'atténuer les pénuries alimentaires qui frappent la population soviétique. Tandis que certains ont proposé de se lancer dans une expansion massive des terres cultivées, notamment sur la rive droite de la Volga, dans le nord du Caucase, en Sibérie occidentale et au nord du Kazakhstan. Cependant, cette proposition a été présentée face à l'opposition du premier secrétaire Malenkov et d'autres membres éminents du Présidium. Au lieu de cela, le secrétaire Malenkov a proposé une extension de ses réformes antérieures qui, selon Malenkov, stimuleraient les récoltes agricoles dans le coeur agricole soviétique. Les réformes agricoles antérieures de Malenkov, largement saluées, comprenaient l'augmentation des prix d'achat payés par l'État pour les livraisons des fermes collectives, la réduction des impôts et l'encouragement des parcelles paysannes individuelles. Poursuivre ces mesures tout en investissant dans le développement des sciences agricoles et des machines semble être le nouveau plan agricole de l'ère Malenkov."
 SOV_STL.11.a: "Suivons le plan du camarade Malenkov !"
 SOV_STL.11.b: "Pourquoi ne pas essayer le plan Khrouchtchev ?"
 SOV_STL.12.t: "Le débat agricole"
 SOV_STL.12.desc: "L'une des questions clés discutées récemment au Présidium est celle du développement agricole. Compte tenu des problèmes historiques de pénurie alimentaire dans les territoires composant l'Union soviétique, il est de la plus haute importance d'augmenter considérablement la production agricole de l'Union soviétique afin d'atténuer les pénuries alimentaires qui frappent la population soviétique. La proposition du Premier secrétaire Khrouchtchev mettrait l'accent sur le labour et la culture de 13 millions d'hectares (130 000 km2) de terres auparavant incultes d'ici 1956. Les terres ciblées incluraient des zones sur la rive droite de la Volga, dans le nord du Caucase, en Sibérie occidentale et au nord du Kazakhstan. Molotov, Malenkov, Kaganovitch et d'autres membres dirigeants du PCUS ont exprimé leur opposition à la proposition, affirmant que le plan n'était pas réalisable d'un point de vue économique ou logistique et qu'il serait préférable de se concentrer sur les régions déjà cultivées. Cependant, Khrouchtchev a insisté sur la mise en culture d'énormes quantités de nouvelles terres comme seul moyen d'obtenir une augmentation significative des rendements agricoles dans un court laps de temps. "
 SOV_STL.12.b: "Suivons le plan du camarade Khrouchtchev !"
 SOV_STL.12.a: "Pourquoi ne pas essayer le plan Malenkov ?"
 SOV_STL.13.t: "Béria exécuté"
 SOV_STL.13.desc: "Après la mort de Staline, presque personne n'était aussi puissant que Lavrenti Beria. Cependant, la chute de Beria s'est produite rapidement : lors d'une réunion du Présidium en juin, Nikita Khrouchtchev a mené une embuscade contre Beria, ce qui a conduit à son arrestation pour trahison et espionnage. Pour garantir que les alliés de Beria au sein des services de sécurité ne puissent pas faire éclater Beria ou exercer des représailles sur d'autres membres du Présidium, les forces militaires sous le commandement de Joukov ont directement arrêté Beria et ont procédé à l'arrestation et à l'exécution d'un certain nombre de loyalistes de Beria dans les services de sécurité. Beria et ses alliés ont été jugés par une session extraordinaire de la Cour suprême de l'Union soviétique fin décembre, sans avocat ni droit d'appel. Le maréchal Ivan Konev, en tant que président du tribunal, a déclaré Beria coupable de trahison en raison de ses prétendus contacts avec le gouvernement nazi pour rechercher des pourparlers de paix et de son prétendu soutien à la cession de certains territoires conquis lors de la Grande Guerre patriotique afin de normaliser les relations diplomatiques. Le tribunal a également déclaré Beria coupable de terrorisme en raison de sa participation aux purges de 1941 au sein de l'Armée rouge et d'activités contre-révolutionnaires en raison de ses actions pendant la guerre civile russe en Azerbaïdjan. Beria a été exécuté par balle immédiatement après le procès mettant fin à l'un des hommes les plus célèbres de l'époque."
 SOV_STL.13.a: "Cela clôt un sombre chapitre de l'histoire soviétique."
 SOV_STL.14.t: "Ryumin exécuté"
 SOV_STL.14.desc: "Mikhaïl Ryimine, ancien chef adjoint du ministère de la Sécurité d'État, a été exécuté aujourd'hui à l'issue d'un procès expéditif. L'ascension et la chute de Ryumin ont été des montagnes russes. En 1950, lors d'un interrogatoire du professeur Yakov Gilyarievich Etinger, un éminent cardiologue juif âgé qui avait soigné deux membres éminents du PCUS décédés d'une maladie cardiaque et avait tenu en privé des remarques critiques à l'égard du régime. Ryumin a tenté de le forcer à avouer le meurtre d'Andrei Zhdanov et d'Alexandre Shcherbakov. Cet événement a été à l'origine du complot des médecins, désormais dénoncé comme une fabrication. Après de nombreux autres entretiens intenses et mauvais traitements infligés par Ryumin, Etinger est décédé. Avant cela, Ryumin avait été averti par ses supérieurs de céder par crainte de la santé d'Etinger. Faisant face à de nouvelles sanctions, Ryumin s'est adressé directement à Staline et a accusé Abakumov et d'autres membres du personnel de sécurité de ne pas avoir enquêté sur le complot des médecins, ce qui a conduit à l'emprisonnement d'Abakumov et à une nouvelle élévation du poste de Ryumin. Cependant, en 1952, Staline fit limoger Ryumin pour incompétence flagrante, après la mort de Staline. Ryumin fut arrêté pour sa complicité dans la fabrication du complot des médecins menant à son exécution rapide."
 SOV_STL.14.a: "Justice rendue."
 SOV_STL.15.t: "Abamukov exécuté"
 SOV_STL.15.desc: "Viktor Abakumov, ancien chef du SMERSH et ministre de la Sécurité d'État, a été exécuté aujourd'hui. Abakumov avait été démis de ses fonctions et arrêté en 1951, accusé de ne pas avoir enquêté sur le complot des médecins. On aurait pu supposer que, étant donné que le complot des médecins avait été rejeté après la mort de Staline, Abakumov aurait été libéré par la suite. Cependant, après la mort de Staline, Lavrenty Beria a pu reprendre le contrôle de l'appareil de sécurité et accuser Abamukov d'autres crimes d'une crédibilité douteuse. Maintenant, étant donné la chute du pouvoir de Beria et son exécution, on aurait pu supposer qu'Abakumov aurait été libéré à ce stade. Cependant, à la suite de cela, Abakumov a également été décrit comme un complice des crimes de Beria. Le dernier clou dans le clou métaphorique et littéral d'Abakumov dans le cercueil fut son rôle dans la fabrication de l'affaire de Leningrad, qui cherchait à accuser de trahison divers membres du parti basés à Leningrad, en particulier ceux qui sont devenus célèbres pendant le siège de Leningrad."
 SOV_STL.15.a: "Intéressant."
 SOV_STL.16.t: "Commission Shatalin"
 SOV_STL.16.desc: "Le premier secrétaire Malenkov a récemment créé une commission dirigée par le célèbre fonctionnaire du parti Nikolaï Chataline. Shatalin, un allié de longue date de Malenkov qui a accédé au poste de secrétaire du Comité central du Parti communiste de l'Union soviétique à la suite de la mort de Staline grâce au soutien de Malenkov. Sahtalin a réussi à jouer habilement dans la lutte de pouvoir entre Khrouchtchev et Malenkov et on lui attribue l'aide de Malenkov dans son éviction de Khrouchtchev au début de la décennie. La Commission Shatalin a été chargée d'enquêter sur la manière dont il était possible de mener des répressions massives contre les membres et candidats du Parti élus au 17e Congrès du Parti communiste de toute l'Union. Shatalin a récemment soumis le rapport final de la commission au Présidium, le rapport modérément critique à l'égard de Staline et fortement axé sur la nécessité de lutter contre le « culte de l'individu » a suscité une controverse notable au sein du Présidium. Cela dit, le Premier secrétaire Malenkov a manifesté son soutien au rapport final et a appelé Chataline à commencer à préparer la rédaction d'un discours sur le sujet pour le prochain 20e Congrès du Parti communiste de l'Union soviétique."
 SOV_STL.16.a: "Vive le camarade Malenkov !"
 SOV_STL.17.t: "Commission Pospelov"
 SOV_STL.17.desc: "Le premier secrétaire Khrouchtchev a récemment créé une commission dirigée par le célèbre fonctionnaire du parti Piotr Pospelov. Pospelov, autrefois chef adjoint de l'Agitprop et allié de Staline, a rapidement décidé de soutenir Khrouchtchev dans la lutte pour le pouvoir qui a suivi au lendemain de la mort de Staline. Cependant, Pospelov en a surpris beaucoup en devenant l'un des premiers partisans notables de la déstalinisation quelques mois après la mort de Staline. La Commission Pospelov a été chargée d'enquêter sur la manière dont il était possible de mener des répressions massives contre les membres et candidats du Parti élus au 17e Congrès du Parti communiste de toute l'Union. Pospelov a récemment soumis le rapport final de la commission au Présidium, le rapport très critique à l'égard de Staline et incitant à déployer des efforts majeurs pour condamner davantage Staline et réhabiliter les membres purgés au cours de son mandat a provoqué une tempête de controverses au sein du Présidium. Cela dit, le Premier secrétaire Khrouchtchev a manifesté son soutien au rapport final et a appelé Pospelov à commencer à préparer la rédaction d'un discours sur le sujet pour le prochain 20e Congrès du Parti communiste de l'Union soviétique."
 SOV_STL.17.a: "Vive le camarade Khrouchtchev !"
 SOV_STL.18.t: "État de l'agriculture"
 SOV_STL.18.desc: "Alors que l'année 1956 touche à sa fin, la campagne des Terres Vierges semble être sur le point de devenir un véritable couronnement dans l'histoire du développement agricole. Alors que l'enthousiasme pour le programme s'était détérioré après une performance lamentable en 1955, la récolte de 1956 s'est avérée être la plus réussie de toute la campagne des Terres Vierges à ce jour et la plus importante de l'histoire soviétique. La production céréalière des régions des Terres Vierges a augmenté de 180 % par rapport à la moyenne de 1949-1953 et de 90 % par rapport à la moyenne de 1954-1955. En 1956, la production céréalière de l'ensemble de l'Union soviétique était de 50 % supérieure à la moyenne de 1949-1953. Compte tenu de cette récolte incroyable, le Premier secrétaire Khrouchtchev a effectué une tournée dans le nord du Kazakhstan pour remettre des médailles aux agriculteurs de la région des Terres Vierges. Cela dit, les agriculteurs ont averti que la récolte record pourrait ne pas être reproductible dans les années à venir et que le climat et la qualité des sols dans la région entraîneraient probablement des changements considérables dans les taux de récolte dans les années à venir."
 SOV_STL.18.a: "Le premier secrétaire Khrouchtchev a toujours raison !"
 Beria_Arriest.1.d: "Le chef du NKVD, Lavrenti Beria, semblait autrefois en mesure de prendre les rênes de l'Union soviétique après la mort de Staline. Cependant, ses intrigues échoueraient car ses rivaux avaient une longueur d'avance. Lors d'une réunion avec ses proches conseillers, les forces militaires contourneraient le NKVD et arrêteraient Beria et ses collaborateurs. Avec l'une des figures les plus sombres de l'ère stalinienne en prison, ce qui attend l'avenir de l'Union soviétique reste indécis, car de nombreuses personnalités exercent encore une grande influence sur le Politburo."
 SOV_Amendments_to_the_law_on_labour_collectives: "Amendements à la loi \"sur les collectifs de travail\""
 SOV_Amendments_to_the_law_on_labour_collectives_desc: "L'adoption d'amendements à la loi \"Sur les collectifs de travail\" a formalisé les possibilités, clarifié le rôle du collectif de travail dans la prise de décision et lui a donné davantage de possibilités administratives pour influencer la gestion de l'entreprise et exercer ses pouvoirs légaux."
 SOV_Start_Small_experiment: "Démarrer l'expérience \"Petite\""
 SOV_Start_Small_experiment_desc: "Parallèlement à la mise en oeuvre des domaines d'activité prévus par la résolution du Comité central du PCUS et du Conseil des ministres de l'URSS n° 814 « Sur les mesures visant à accélérer le progrès scientifique et technologique dans l'économie nationale », où des mesures supplémentaires ont été identifiées pour stimuler le développement et la mise en oeuvre de nouveaux équipements et technologies, une expérience sera menée dans les entreprises de Léningrad, qui consiste à améliorer la rémunération des ingénieurs et des techniciens. Les principales associations de production de Léningrad ont été choisies comme base de l'expérience. Le but de l'expérience est d'atteindre les objectifs prévus pour le développement et la mise en oeuvre de nouveaux équipements et technologies par un plus petit nombre d'ingénieurs et de techniciens, tout en stimulant leur travail grâce aux fonds salariaux économisés."
 SOV_Start_Big_experiment: "Lancer une \"grande\" expérience"
 SOV_Start_Big_experiment_desc: "Conformément à la résolution du Comité central du PCUS et du Conseil des ministres de l'URSS n° 659 \"Sur les mesures supplémentaires visant à étendre les droits des associations de production (entreprises) de l'industrie en matière de planification et d'activités économiques et à renforcer leur responsabilité à l'égard des résultats du travail\", une expérience économique aura lieu au ministère de la Construction de machines lourdes de l'URSS, au ministère de l'Industrie électrique de l'URSS, au ministère de l'Industrie alimentaire de la RSS d'Ukraine, au ministère de l'Industrie légère de la RSS de Biélorussie et au ministère de l'Industrie locale de la Lituanie. RSS. Le but de l'expérience est de tester comment les entreprises fonctionneront dans des conditions d'autofinancement, sans tutelle mesquine de la part des ministères. Les entreprises auront la possibilité d'utiliser de manière indépendante une partie des fonds du fonds uni (tous ministériels) pour le développement de la science et de la technologie pour réaliser, de leur propre initiative, des travaux de conception visant à créer une nouvelle technologie et à compenser l'augmentation des coûts au cours de son développement, ainsi que des droits élargis de dépenses des fonds de masse salariale et des fonds d'incitation matérielle pour établir des primes sur les salaires et des tarifs pour les hautes qualifications et les résultats de travail obtenus pour toutes les catégories d'employés."
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment: "Commission Spéciale pour la Direction de l'Expérience Économique"
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment_desc: "La Commission spéciale pour la direction de l'expérience économique s'occupe de la formation et du maintien des conditions appropriées pour l'expérience que nous avons projetée."
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment_Improved: "Commission Spéciale pour la Direction de l'Expérience Économique"
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment_Improved_desc: "La Commission spéciale pour la direction de l'expérience économique s'occupe de la formation et du maintien des conditions appropriées pour l'expérience que nous avons projetée."
