 SOV_Decree_No_745: "Décret n° 745 « Sur des mesures supplémentaires visant à renforcer la discipline du travail »"
 SOV_Decree_No_745_desc: "Compte tenu des propositions des travailleurs, afin de renforcer davantage la discipline du travail et de réduire la rotation du personnel, le Conseil des ministres de l'URSS et le Conseil central des syndicats de l'ensemble des syndicats adoptent le décret n° 745, qui exige : d'améliorer l'équilibre des plans, de l'approvisionnement matériel et technique, d'assurer la création d'autres conditions économiques et organisationnelles pour le travail ininterrompu et hautement productif des collectifs de travail, d'accroître leur initiative et leur responsabilité pour la réalisation des objectifs et obligations prévus ; examiner de manière critique l'état du travail et la discipline de production, prendre des mesures spécifiques pour la renforcer, introduire plus activement des formes avancées d'organisation et de stimulation du travail, la comptabilité analytique de brigade, le paiement basé sur les résultats finaux et l'utilisation du coefficient de participation au travail ; être strictement guidé par le principe d'un salaire égal pour un travail égal, ne pas permettre une surestimation déraisonnable du montant des incitations matérielles afin d'attirer les travailleurs loin d'autres entreprises. Appliquer plus largement le système de paie non anticipée, en tenant compte de l'avis des collectifs de travail, et là où cela est opportun et possible. Améliorer constamment les services culturels et communautaires pour les travailleurs, la protection et la sécurité du travail, et réduire de toutes les manières possibles le travail manuel, peu qualifié et physique pénible. Considérer comme une violation flagrante de la discipline du travail le fait de se présenter au travail en état d'ébriété ou de boire de l'alcool sur le lieu de travail. Pour lutter contre ces phénomènes, accroître la responsabilité disciplinaire et financière des travailleurs et des employés."
 SOV_Decree_No_744: "Décret n° 744 « Sur l'intensification des travaux visant à renforcer la discipline du travail socialiste »"
 SOV_Decree_No_744_desc: "Certains ouvriers, kolkhoziens et employés ne travaillent pas avec un dévouement total, ne valorisent pas les intérêts du collectif et autorisent l'absentéisme, les retards et les cas d'ivresse. Les fainéants et les absents se sentent souvent à l'aise ; leurs salaires et autres avantages sont comparables à ceux des travailleurs consciencieux. Les ministères, départements et directeurs économiques ne créent pas les conditions organisationnelles et économiques nécessaires dans les entreprises individuelles, les chantiers de construction, les fermes collectives et les fermes d'État pour un travail normal et performant. Les déficiences dans la planification, la logistique et l'organisation de la production entraînent des temps d'arrêt et des travaux intempestifs, des heures supplémentaires et le non-respect des objectifs et obligations prévus, affectant négativement la discipline et, en fin de compte, le taux de croissance de la productivité du travail. Certains chefs d'entreprise, organisations de partis et syndicats se réconcilient avec le faible niveau de discipline du travail, cachent les faits de mauvaise gestion et ne prennent pas toutes les mesures en leur pouvoir pour rétablir l'ordre dans la production. Par le décret n° 744, tout en appliquant des incitations matérielles et morales au travail désintéressé, il est nécessaire en même temps d'éradiquer résolument les faits d'attitude conciliante envers les contrevenants à la discipline du travail et de la production, d'utiliser plus efficacement les mesures d'influence publique, les normes de la législation en vigueur à cet effet. Les violations de la discipline du travail doivent être considérées comme un manquement à l'obligation de travailler consciencieusement, établie par la Constitution de l'URSS. Les questions de l'état de la discipline du travail et des mesures visant à la renforcer, les cas d'absentéisme et d'autres violations pour l'impact public approprié sur les contrevenants devraient être constamment évoqués pour discussion par les collectifs de travail, les réunions de brigades, de chantiers, de fermes, d'ateliers, des questions devraient être soulevées devant l'administration sur la responsabilisation de ces personnes conformément à la législation en vigueur."
