 # Stalin-era foreign policy goals (judged from 14 May 1955, last check at the 20th Party Congress)
 SOV_Eastern_Europe_Secured: "Europe de l'Est sécurisée"
 SOV_Eastern_Europe_Secured_desc: "Les démocraties populaires, de la Baltique à l'Adriatique, sont unies à l'Union Soviétique. Le tampon acheté avec le sang de la Grande Guerre Patriotique a tenu.\n\n§YObjectif :§! atteint automatiquement si tous les alliés d'Europe de l'Est font partie de notre faction à tout moment après le §Yle 14 mai 1955§!. Vérifié une dernière fois lors de la tenue du §Y20e Congrès du Parti§!."
 SOV_Western_Europe_divided: "L'Europe occidentale divisée"
 SOV_Western_Europe_divided_desc: "Les impérialistes n'ont pas réussi à lier l'ensemble de l'Europe occidentale sous un seul haut commandement américain. Un Occident divisé ne peut pas marcher vers l'Est.\n\n§YObjectif :§! atteint automatiquement si au moins l'un des pays suivants : la France, la Grande-Bretagne, l'Allemagne de l'Ouest ou l'Italie se trouve en dehors de l'alliance américaine à tout moment après le §Yle 14 mai 1955§!. Vérifié une dernière fois lors de la tenue du §Y20e Congrès du Parti§!."
 SOV_Establish_Eastern_Communism: "Établir le communisme oriental"
 SOV_Establish_Eastern_Communism_desc: "D'Oulan-Bator à Hanoï, les révolutions que nous avons armées et conseillées ont prévalu. Le socialisme détient désormais l'Est.\n\n§YObjectif :§! atteint automatiquement si les gouvernements communistes d'Asie détiennent leurs capitales à tout moment après le §Yle 14 mai 1955§!. Vérifié une dernière fois lors de la tenue du §Y20e Congrès du Parti§!."
 SOV_prevent_communist_deviations: "Prévenir les déviations communistes"
 SOV_prevent_communist_deviations_desc: "Belgrade est revenue au bercail et Pékin ne s'est pas écarté. Il existe un camp socialiste, et Moscou le mène.\n\n§YObjectif :§! atteint automatiquement si la Yougoslavie est dans notre faction et que ni la Yougoslavie ni la Chine n'ont rompu la ligne à aucun moment après le §Yle 14 mai 1955§!. Vérifié une dernière fois lors de la tenue du §Y20e Congrès du Parti§!."
 SOV_Avoid_direct_conflict: "Évitez les conflits directs"
 SOV_Avoid_direct_conflict_desc: "Nous avons combattu les impérialistes partout et ne les avons combattus nulle part. L'Union s'est reconstruite en paix.\n\n§YObjectif :§! atteint automatiquement si nous ne sommes pas en guerre avec les États-Unis, la Grande-Bretagne, la France ou l'Allemagne de l'Ouest à tout moment après le §Yle 14 mai 1955§!. Vérifié une dernière fois lors de la tenue du §Y20e Congrès du Parti§!."
 # Stalin interior & political line (1949-1953)
 SOV_Stalin_Campaign_Against_Rootless_Cosmopolitans: "La campagne contre les cosmopolites sans racines"
 SOV_Stalin_Campaign_Against_Rootless_Cosmopolitans_desc: "La Pravda a nommé l'ennemi : les critiques, les érudits et les artistes qui s'inclinent devant l'Occident, dont un nombre disproportionné de Juifs. Des réunions ont lieu, des aveux sont extorqués, des carrières se terminent. La campagne enseignera à l'intelligentsia que le patriotisme signifie le silence."
 SOV_Stalin_Seventieth_Birthday: "Le soixante-dixième anniversaire de Staline"
 SOV_Stalin_Seventieth_Birthday_desc: "Le 21 décembre 1949, le monde socialiste tout entier célèbre le camarade Staline. Tout en s'opposant au début à une célébration de ce type, le Vozhd a finalement été convaincu lorsqu'on lui a dit que l'événement pouvait être utilisé pour rassembler les mouvements communistes du monde entier. Aujourd'hui, Mao Zedong arrive à Moscou, un portrait de Staline est suspendu à un ballon au-dessus du Kremlin et des cadeaux provenant de tous les coins du camp remplissent un musée. Le culte de la personnalité n'a jamais été aussi haut."
 SOV_Stalin_Restore_the_Death_Penalty: "Rétablir la peine de mort"
 SOV_Stalin_Restore_the_Death_Penalty_desc: "Abolie en 1947, la peine capitale revient le 12 janvier 1950 pour les traîtres, espions et saboteurs. Peu de doutes pour qui le décret a été rédigé : les hommes de l'affaire de Léningrad sont déjà dans les cellules du MGB."
 SOV_Stalin_Arrest_Abakumov: "Arrêter Abakumov"
 SOV_Stalin_Arrest_Abakumov_desc: "En juillet 1951, une dénonciation parvient à Staline : le ministre de la Sécurité d'État, Viktor Abakumov, cache une conspiration sioniste. Abakumov est arrêté dans sa propre prison et Semyon Ignatiev, un homme du parti, reprend les organes, avec l'ordre de retrouver le complot manqué par Abakumov."
 SOV_Stalin_Denounce_Molotov_and_Mikoyan: "Dénoncer Molotov et Mikoyan"
 SOV_Stalin_Denounce_Molotov_and_Mikoyan_desc: "Lors du plénum qui a suivi le Congrès, le secrétaire général Staline s'est tourné vers la critique de certains de ses plus anciens compagnons. Molotov, longtemps considéré comme le bras droit de Staline, est accusé d'avoir capitulé face aux impérialistes en raison de certaines erreurs de politique étrangère, notamment en matière de reconnaissance d'Israël. Mikoyan du déviationnisme de droite. Si leur place au sein du parti ne fait aucun doute, aucun d'eux n'a été nommé au nouveau Bureau du Présidium."
 SOV_Stalin_Purge_the_Inner_Circle: "Lutte dans le cercle intérieur"
 SOV_Stalin_Purge_the_Inner_Circle_desc: "Le MVD de Beria purge désormais systématiquement le cercle restreint de Staline. Le général Vlasik, chef de sa garde du corps depuis vingt-cinq ans, est arrêté en décembre 1952, et Poskrebyshev, son secrétaire depuis les années vingt, est licencié. Bien qu'il ne soit pas intervenu, Staline ne serait pas convaincu de leur culpabilité et commencerait à se méfier."
 SOV_pres_hook_presidium_tt: "Le Politburo est rebaptisé §YPrésidium du Comité central§!."
 SOV_pres_hook_cosmopolitans_tt: "§YMikhaïl Suslov§!: relation avec le leader §G+10§!"
 SOV_pres_hook_abakumov_tt: "§YSemyon Ignatiev§! remplace §YViktor Abakumov§! en tant que ministre §Y, MGB§!.\n§YLavrentiy Beria§!: relation avec le leader §R-15§!"
 SOV_pres_hook_leningrad_tt: "§YNikolai Voznesensky§!: relation avec le leader §R-100§!\n§YAlexeï Kossyguine§!: relation avec le leader §R-20§!\n§YGeorgy Malenkov§!: relation avec le leader §G+10§!"
 SOV_pres_hook_molotov_mikoyan_tt: "§YViatcheslav Molotov§!: relation avec le leader §R-2§!\n§YAnastas Mikoyan§!: relation avec le leader §R-30§!"
