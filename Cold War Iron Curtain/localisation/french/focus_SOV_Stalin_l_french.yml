 SOV_WGR.1.d: "Depuis; Première Direction Générale, Ministère de la Sécurité de l'État\nÀ ; Secrétaire général Staline\n\nSujet ; Les élections ouest-allemandes de 1949 et les menaces contre la fraternité socialiste\n\nLa Première Direction générale, principalement responsable du renseignement extérieur, a examiné et surveillé de près la campagne des premières élections en République fédérale d'Allemagne, qui devraient avoir lieu avant la fin de 1949. Trois partis sont principalement en lice ; l'Union chrétienne-démocrate (CDU), dirigée par le maire de Cologne Konrad Adenauer ; le Parti social-démocrate (SPD), dirigé par Kurt Schumacher ; et le Parti libéral-démocrate (FDP), dirigé par Franz Blucher. Cependant, le Parti communiste allemand reste un candidat viable aux élections ; dirigé par l'éminent communiste allemand Max Reimann.\n\nLa Première Direction Générale a proposé un certain nombre de propositions pour faire pencher le résultat des élections ouest-allemandes en notre faveur, notamment l'envoi de davantage d'agents du MGB en Allemagne de l'Ouest, l'envoi d'une aide financière au KPD et le trucage des votes en faveur du KPD. Nous espérons que Reimann adhérera à la politique soviétique à l'avenir et que ces mesures d'ingérence électorale garantiront notre succès, tout en déstabilisant le bloc impérialiste occidental.\n\nSIGNÉ\nViktor Abakumov\nChef de la Première Direction du Comité de Sécurité de l'État"
 SOV_WGR.2.d: "De ; Branche du renseignement du G-2, armée américaine en Europe, autorités d'occupation alliées\nÀ ; Gouvernement provisoire de la République fédérale d'Allemagne\n\nSujet ; Menaces envers la sécurité des élections fédérales de 1949\n\nLes actions récentes de l'URSS et de ses États satellites ont révélé une vulnérabilité majeure dans la sécurité des prochaines élections parlementaires en République fédérale. Des fuites récentes de nos agents derrière le rideau de fer ainsi qu'en République fédérale ont révélé des complots présumés visant à faire pencher les résultats des élections en faveur de l'URSS en truquant les votes en faveur du Parti communiste allemand, ou KPD, dirigé par le célèbre communiste Max Reimann. Nos agents ont également signalé une augmentation marquée du nombre d'agents du MGB, ainsi qu'une propagande pro-KPD dans les grandes villes allemandes.\n\nLes effets de cette falsification électorale pourraient être catastrophiques ; Si l'Allemagne devient communiste, cela affectera non seulement la sécurité de l'OTAN et de l'Europe occidentale, mais aussi l'équilibre des pouvoirs à l'échelle mondiale.\n\nLa condamnation immédiate des ingérences électorales et l'arrestation des agents du MGB, ainsi qu'un renforcement de la sécurité électorale, devraient garantir des élections sûres et démocratiques pour la République fédérale.\n\nSIGNÉ\nGénéral Lucius D.Clay\nGénéral commandant de l'armée américaine en Europe"
