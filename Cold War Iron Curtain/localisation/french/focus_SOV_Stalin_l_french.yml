 soviet_industry.3.t: "Construire de nouveaux chemins de fer"
 soviet_industry.3.desc: "L'appareil de planification de l'État a autorisé la construction de nouvelles voies ferrées dans le cadre de notre plan industriel ; cependant, nous disposons de nombreuses options quant à l'emplacement du rail. La Sibérie a été lancée comme idée ; mais il est en grande partie vide et le rail pourrait être un gaspillage. Les pays baltes ont été proposés, mais là encore, leur utilisation a été contestée. Enfin, l'Asie centrale a été proposée, comprenant la RSS kazakhe, la RSS kryghize, la RSS turkmène, la RSS tadjike et la RSS d'Ouzbékistan ; et contribuerait certainement à la mobilité interne, ainsi qu'au développement industriel. Où ira le rail ?"
 soviet_industry.3.a: "Relier la Sibérie est une nécessité absolue."
 soviet_industry.3.b: "Investir dans les pays baltes nous ouvrira de nombreuses opportunités."
 soviet_industry.3.c: "L'Asie centrale est une proposition solide."
 soviet_industry.2.t: "Éliminer les goulots d'étranglement des infrastructures"
 soviet_industry.2.desc: "Des goulets d'étranglement en matière d'infrastructures existent partout dans l'Union, mais nous sommes obligés de choisir une seule région à résoudre. Les pays baltes ont très peu d'infrastructures mais cette région ne nous est pas très bénéfique ; La Biélorussie est une région riche et prospère, la Russie est la plus grande RSS et est confrontée à des problèmes d'infrastructures, et enfin, il y a la RSS de Géorgie, patrie de Staline, qui pourrait également avoir besoin de réparations d'infrastructures. Où iront les solutions ?"
 soviet_industry.2.a: "Les pays baltes disposent de très peu d'infrastructures, ce qui devrait être une priorité."
 soviet_industry.2.b: "La Biélorussie est une région riche et prospère ; de bonnes infrastructures sont nécessaires."
 soviet_industry.2.c: "La Russie est confrontée à des problèmes d'infrastructure, et il est essentiel de les résoudre."
 soviet_industry.2.d: "La Géorgie constituera un terrain d'essai intéressant pour nos projets futurs."
 soviet_industry.2.e: "Réparer l'infrastructure en Russie ou en Géorgie"
 soviet_industry.2.f: "Réparer les infrastructures en Biélorussie ou dans les pays baltes"
 soviet_industry.1.t: "Développement de l'industrie lourde"
 soviet_industry.1.a: "Développer l'industrie en RSS d'Ukraine."
 soviet_industry.1.b: "L'industrie doit rester dans la RSFS russe."
 soviet_industry.1.c: "Déplacer l'industrie lourde vers la RSS kazakhe."
 soviet_industry.1.d: "Déplacer l'industrie lourde vers la RSS tadjike."
 soviet_indudstry.e: "Déplacer l'industrie lourde vers l'Asie centrale."
 soviet_indudstry.f: "Déplacez l'industrie lourde vers l'Ukraine ou la Russie."
 soviet_industry.1.desc: "En développant notre industrie lourde après la Grande Guerre Patriotique, notre appareil de planification d'État nous a proposé plusieurs choix. Nous pourrions développer l'industrie dans la RSS d'Ukraine, connue comme le « grenier de l'Union », fournissant la majorité des céréales à l'État ; ou bien l'industrie pourrait rester dans la SFSR russe, offrant ainsi davantage d'emplois aux Russes de souche. Une alternative nouvelle et inattendue est également apparue ; déplacer l'industrie lourde vers l'Asie centrale, soit dans la RSS kazakhe, soit dans la RSS tadjike, qui disposent toutes deux d'espaces et de ressources. Où va l'industrie ?"
