l_french:
 illegitimate_government:0 "Gouvernement illégitime"
 illegitimate_government1:0 "Gouvernement illégitime"
 egy_corruption_tt:0 "§RLa corruption commence à apparaître dans notre gouvernement§!"
 egysud.tt.1:0 "§YL'indépendance du Soudan se décidera selon le calendrier britannique§!"
 EGY_The_Mad_King:0 "Le roi fou"
 EGY_The_Mad_King_desc:0 "Farouk est indéniablement un homme très charmant, mais il est aussi capricieux et irresponsable. Il est immensément riche et adore jouer, et est avare et kleptomane. S'il veut quelque chose, il le prendra. Il a volé non seulement ses sujets, mais aussi Churchill. Même avec les femmes, il semble préférer les épouses d'autres hommes, et il n'accepte pas un refus. S'il y avait sept péchés capitaux, on disait qu'il en trouverait un huitième."
 EGY_The_State_of_Foriegn_Affairs:0 "L'état des affaires étrangères"
 EGY_The_State_of_Foriegn_Affairs_desc:0 "Un nouvel ordre mondial est en train d'émerger, avec un État hostile juste au-delà de nos frontières, il est temps de régler la situation de nos affaires étrangères."
 EGY_The_Egyptian_Armed_Forces:0 "Les forces armées égyptiennes"
 EGY_The_Egyptian_Armed_Forces_desc:0 "Les forces armées égyptiennes sont perçues comme arriérées et incompétentes. Nous devons nous tourner vers nos forces armées pour résoudre ces problèmes."
 EGY_Lessons_from_the_Nakba:0 "Leçons de la Nakba"
 EGY_Lessons_from_the_Nakba_desc:0 "La guerre israélo-arabe de 1948 nous a montré les faiblesses de notre armée. Il faut maintenant les réparer pour éviter une nouvelle humiliation."
 EGY_The_Egyptian_Airforce:0 "L'armée de l'air égyptienne"
 EGY_The_Egyptian_Airforce_desc:0 "L'armée de l'air égyptienne est pratiquement inexistante. Si nous voulons rivaliser avec d'autres pays, nous devons réorganiser et moderniser notre force aérienne."
 EGY_Puchase_British_Jets:0 "Achetez des jets britanniques"
 EGY_Puchase_British_Jets_desc:0 "Nous n'avons pas les capacités nécessaires pour concevoir et produire nos propres avions à réaction modernes, nous devrions donc acheter des avions britanniques pour poursuivre la modernisation de l'armée de l'air."
 EGY_Recover_our_Losses:0 "Récupérer nos pertes"
 EGY_Recover_our_Losses_desc:0 "Nous devons récupérer nos pertes suite à la perte dévastatrice et humiliante contre Israël."
 EGY_Czechoslovakian_Arms_Deal:0 "Accord sur les armes avec la Tchécoslovaquie"
 EGY_Czechoslovakian_Arms_Deal_desc:0 "Les Américains et les Britanniques refusent de nous donner des armes qui pourraient nous donner un avantage sur notre voisin. Si l'Occident ne veut pas nous armer, peut-être que les communistes le feront."
 EGY_Expand_Air:0 "Agrandir les installations aéroportuaires"
 EGY_Expand_Air_desc:0 "Les bases aériennes du Caire sont vieillissantes et mal entretenues. Nous devons agrandir les bases aériennes pour accueillir notre future force aérienne."
 EGY_Parachutes:0 "75e bataillon de parachutistes"
 EGY_Parachutes_desc:0 "-"
 EGY_Ballistic:0 "Programme de missiles balistiques"
 EGY_Ballistic_desc:0 "-"
 EGY_The_Egyptian_Army:0 "L'armée égyptienne"
 EGY_The_Egyptian_Army_desc:0 "L'armée égyptienne est criblée d'incompétence et d'une vieille façon de penser. La modernisation et la revitalisation de l'armée sont nécessaires pour rivaliser avec nos voisins."
 EGY_A_Political_Army:0 "Recruter d'anciens officiers de la Wehrmacht"
 EGY_A_Political_Army_desc:0 "L'armée a cruellement besoin d'être restructurée. Si nous ajoutons des officiers et des commandants loyaux à l'armée, nous créerons une force loyale."
 EGY_Fortification_Initiatives:0 "Achetez des modèles de fusils suédois"
 EGY_Fortification_Initiatives_desc:0 "Une autre guerre avec Israël est inévitable. La construction de fortifications et d'installations militaires nous donnera un avantage dans les conflits à venir."
 EGY_Field_Marshall_Abdel_Hakim_Amer:0 "Le maréchal Abdel Hakim Amer"
 EGY_Field_Marshall_Abdel_Hakim_Amer_desc:0 "Le dernier changement nécessaire pour débarrasser notre armée de l'incompétence est de lui attribuer un maréchal compétent. Abdel Hakim Amer est prêt pour la tâche qui l'attend"
 EGY_Purchase_Modern_Infantry_Equipment:0 "Importer des armes"
 EGY_Purchase_Modern_Infantry_Equipment_desc:0 "Beaucoup de nos armes sont des restes de la Seconde Guerre mondiale, nous devrions acheter des armes à feu modernes pour avoir une armée bien équipée."
 EGY_American_Arms_Deal:0 "Accord sur les armes égypto-américain"
 EGY_American_Arms_Deal_desc:0 "-"
 EGY_Czech_Arms_Deal:0 "Accord sur les armes égypto-tchécoslovaque"
 EGY_Czech_Arms_Deal_desc:0 "-"
 EGY_The_Egyptian_Navy:0 "La marine égyptienne"
 EGY_The_Egyptian_Navy_desc:0 "Notre marine n'est composée que de vieux restes britanniques. Il est impossible de protéger efficacement nos côtes et nos eaux sans modernisation. Il est désormais temps pour les marines de procéder à une refonte."
 EGY_Begin_Naval_Armament_Campaign:0 "Agrandir les installations navales"
 EGY_Begin_Naval_Armament_Campaign_desc:0 "Nous devons commencer à moderniser notre marine en construisant des installations pour produire de nouveaux navires. Cela ouvre la possibilité de construire une marine vaste et moderne."
 EGY_Purchase_Ibrahim_el_Awal:0 "Achat Ibrahim el Awal"
 EGY_Purchase_Ibrahim_el_Awal_desc:0 "Chaque marine possède un vaisseau amiral. Nous devons acheter une merveille moderne pour lancer l'expansion et la modernisation de notre marine."
 EGY_Amphibious_Training:0 "Entraînement amphibie"
 EGY_Amphibious_Training_desc:0 "La guerre mondiale a prouvé la nécessité de disposer des capacités nécessaires pour débarquer sur les côtes ennemies. Nous devons former nos troupes sur ces éléments essentiels de la guerre moderne."
 EGY_The_Straits_of_Tiran:0 "Agrandir les installations du détroit de Tiran"
 EGY_The_Straits_of_Tiran_desc:0 "Le détroit de Tiran doit être fortifié afin que nous soyons prêts à faire face à une attaque israélienne."
 EGY_Ban_All_Red_Cars:0 "Interdire toutes les voitures rouges"
 EGY_Ban_All_Red_Cars_desc:0 "Le roi aime les voitures rouges et les courses, mais déteste quand la police interfère avec sa conduite. Il a donc décidé d'interdire toutes les voitures rouges pour que la police sache que c'est lui qui conduit."
 EGY_Endemic_Corruption:0 "Corruption endémique"
 EGY_Endemic_Corruption_desc:0 "En raison des dépenses et des décisions irrationnelles du roi, la corruption commence à se former au sein de la nation."
 EGY_The_Ghali_Affair:0 "L'affaire Ghali"
 EGY_The_Ghali_Affair_desc:0 "La Princesse Fathia, soeur cadette du Roi Farouk a scandalisé la nation en épousant son amant Riyad Ghali en Amérique, le Roi doit maintenant réagir à cette transgression..."
 EGY_The_Kitchen_Cabinet:0 "Fête en France"
 EGY_The_Kitchen_Cabinet_desc:0 "Le roi doit organiser une grande fête en France. Pourquoi? Parce qu'il est le roi."
 EGY_The_Visit_to_France:0 "Visite en France"
 EGY_The_Visit_to_France_desc:0 "Le roi a décidé qu'il devait se rendre en France pour des raisons diplomatiques, quelles qu'elles soient."
 EGY_Cancel_the_Anglo_Egyptian_Treaty_of_1936:0 "Annuler le traité anglo-égyptien de 1936"
 EGY_Cancel_the_Anglo_Egyptian_Treaty_of_1936_desc:0 "Malgré notre indépendance formelle en 1922, les Britanniques ont exercé une influence démesurée sur notre Royaume. Le traité de 1936 a été signé par crainte de l'impérialisme italien. En conséquence, nous n'avons pas pu supprimer complètement l'influence britannique. L'abrogation du traité serait un bon premier pas vers nous débarrasser définitivement du contrôle britannique."
 EGY_Growing_Discontent:0 "Mécontentement croissant"
 EGY_Growing_Discontent_desc:0 "Avec la folie croissante du roi et la détérioration des conditions de vie des gens ordinaires, la popularité du roi diminue chaque jour. Bientôt, quelqu'un pourrait même tenter de le renverser."
 EGY_The_King_of_Egypt_and_Sudan:0 "Le roi d'Egypte et du Soudan"
 EGY_The_King_of_Egypt_and_Sudan_desc:0 "Le Soudan fait partie intégrante de l'Égypte depuis que Mohammed Ali l'a conquis dans les années 1820 et devrait le rester. Actuellement, le Soudan est une copropriété partagée avec les Britanniques, nous devrions affirmer nos revendications sur la région en l'adoptant formellement dans le titre royal du roi. Vive le roi d'Egypte et du Soudan !"
 EGY_Black_Saturday:0 "Samedi noir"
 EGY_Black_Saturday_desc:0 "Toutes les décisions corrompues et égoïstes prises par le roi ont créé une bombe prête à exploser. L'étincelle qui a déclenché l'explosion est survenue lorsque 50 policiers auxiliaires égyptiens ont été tués par les troupes d'occupation au cours d'une bataille à sens unique. La manifestation s'est rapidement transformée en émeutes violentes qui se sont transformées en anti-gouvernementales. Est-ce la fin du royaume d'Egypte ?"
 EGY_The_Egyptian_Revolution:0 "La révolution égyptienne"
 EGY_The_Egyptian_Revolution_desc:0 "Profitant des émeutes et de l'instabilité, les Officiers Libres ont fomenté un coup d'État contre le roi Farouk. La réussite du coup d'État marque la fin de l'ancien ordre égyptien et ouvre la voie à une nouvelle République."
 EGY_Establish_the_RCC:0 "Créer le RCC"
 EGY_Establish_the_RCC_desc:0 "Le Conseil de commandement de la révolution doit être créé pour guider la révolution et éviter une séparation des factions de l'intérieur"
 EGY_Sideline_Pro_Soviet_Officers:0 "Officiers pro-soviétiques en marge"
 EGY_Sideline_Pro_Soviet_Officers_desc:0 "Les officiers pro-soviétiques ne sont qu'un handicap. Pour garantir une transition pacifique, nous devons freiner l'influence communiste."
 EGY_Abolish_the_1923_Constitution:0 "Abolir la Constitution de 1923"
 EGY_Abolish_the_1923_Constitution_desc:0 "La constitution de 1923 est ancienne et corrompue, elle n'a été élaborée que pour calmer l'opinion publique. Nous devons maintenant abolir l'ancienne constitution pour commencer à en rédiger une nouvelle."
 EGY_Agrarian_Reform_Law:0 "Loi sur la réforme agraire"
 EGY_Agrarian_Reform_Law_desc:0 "La mise en oeuvre d'une loi de réforme agraire nous permettra de gagner le soutien populaire du grand public et d'augmenter la production, réduisant ainsi la dépendance à l'égard de l'aide étrangère et des importations."
 EGY_Exile_Farouk:0 "Exilé Farouk"
 EGY_Exile_Farouk_desc:0 "Le roi Farouk doit être exilé. Le tuer entraînerait une condamnation internationale de notre cause et pourrait provoquer une intervention des Britanniques."
 EGY_Declare_the_Three_Year_Transitional_Period:0 "Déclarer la période de transition de trois ans"
 EGY_Declare_the_Three_Year_Transitional_Period_desc:0 "Le passage d'un royaume à une république nécessitera une période de transition de trois ans pour garantir un transfert de pouvoir fluide et stable."
 EGY_The_Anglo_Egyptian_Sudan:0 "Le Soudan anglo-égyptien"
 EGY_The_Anglo_Egyptian_Sudan_desc:0 "Le statut du Soudan anglo-égyptien doit être décidé. Nous pouvons exiger l'annexion du Soudan ou laisser le Soudan exister en tant que sa propre république souveraine."
 EGY_Push_for_Annexation:0 "Pousser en faveur de l'annexion"
 EGY_Push_for_Annexation_desc:0 "Nous devons faire pression sur les Britanniques pour qu'ils nous autorisent l'annexion du Soudan."
 EGY_Full_Annexation:0 "Annexion totale"
 EGY_Full_Annexation_desc:0 "Tout le Soudan est la propriété légitime du roi. Nous devons annexer entièrement le Soudan pour contrôler pleinement ce qui nous revient de droit."
 EGY_Arrest_the_Free_Officers:0 "Arrêter les officiers libres"
 EGY_Arrest_the_Free_Officers_desc:0 "L'organisation des traîtres connue sous le nom de Mouvement des Officiers Libres a tenté de renverser notre gouvernement légitime. Cependant, les conspirateurs ont été vaincus et le coup d'État éliminé, notre grand roi Farouk étant censé avoir lui-même tué au moins 16 traîtres, même si malheureusement l'un des principaux dirigeants de la tentative de coup d'État, Gamal Abdel Nasser, s'est échappé."
 EGY_Political_Crackdown:0 "Répression politique"
 EGY_Political_Crackdown_desc:0 "Le Mouvement des Officiers Libres était une organisation politique d'officiers subalternes et d'autres personnalités nationalistes au sein de l'armée. Cela a prouvé la déloyauté des organisations politiques non alignées sur le roi. Ces dissidents potentiels doivent être arrêtés avant de pouvoir tenter un autre coup d'État."
 EGY_Begin_the_Purges:0 "Commencer les purges"
 EGY_Begin_the_Purges_desc:0 "Les assaillants ont peut-être été vaincus mais il y a encore dans notre pays des sympathisants envers les conspirateurs, nous devons éliminer ces traîtres pour rétablir l'ordre dans le Royaume."
 EGY_Absolute_Monarchism:0 "Monarchisme absolu"
 EGY_Absolute_Monarchism_desc:0 "Le roi est choisi par Dieu et Dieu seul, pourquoi devrait-il adhérer à des constitutions arbitraires ou à des limitations de son pouvoir. Le roi gouvernera désormais par décret sans restriction de son pouvoir comme les monarques absolus d'autrefois."
 EGY_Dissolve_Parliament:0 "Dissoudre le Parlement"
 EGY_Dissolve_Parliament_desc:0 "Sa Majesté Farouk I Alawiyya Par la grâce de Dieu, le roi d'Égypte et du Soudan a décrété que le Parlement serait désormais dissous et les élections publiques suspendues."
 EGY_Strengthen_Western_Ties:0 "Renforcer les liens avec l'Occident"
 EGY_Strengthen_Western_Ties_desc:0 "Les Britanniques soutiennent depuis longtemps notre monarchie, mais malgré nos récents différends au sujet du Soudan et de Suez, nous devrions continuer à entretenir des liens étroits avec eux et à tendre la main aux Américains également."
 EGY_Ban_Radical_Movements:0 "Interdire les mouvements radicaux"
 EGY_Ban_Radical_Movements_desc:0 "Le Mouvement des Officiers Libres et sa tentative de coup d'État ont bénéficié du soutien d'autres groupes radicaux qui cherchent à mettre fin à la monarchie. Le gouvernement a rédigé un nouveau décret qui interdirait toutes les activités politiques jugées dangereuses pour la stabilité du Royaume. Il ne reste plus qu'à obtenir l'approbation royale."
 EGY_Partition_of_Sudan:0 "Partition du Soudan"
 EGY_Partition_of_Sudan_desc:0 "La partition du Soudan empêchera une instabilité future et nous donnera le contrôle du nord, plus favorable aux Arabes."
 EGY_Execute_Nasser:0 "Exécuter Nasser"
 EGY_Execute_Nasser_desc:0 "Nasser n'était qu'un traître qui tentait de prendre le pouvoir en Égypte par un coup d'État. Nasser doit être exécuté pour le punir de ses crimes et pour servir d'avertissement aux autres factions perfides en Égypte."
 EGY_American_Military_Advisors:0 "Conseillers militaires américains"
 EGY_American_Military_Advisors_desc:0 "Nos officiers militaires se sont révélés indignes de confiance et dangereux, nous devrions implorer les Américains de nous aider à conseiller une nouvelle génération d'officiers plus fidèles au roi."
 EGY_Encourage_Tourism:0 "Encourager le tourisme"
 EGY_Encourage_Tourism_desc:0 "Suite à nos récentes ouvertures vers l'Ouest, nous avons commencé à constater un nouvel afflux de touristes, et plus important encore, de leur argent. Nous devrions encourager cette tendance et lancer un programme d'incitations pour la création de nouvelles entreprises centrées sur le tourisme."
 EGY_Invest_in_Infrastructure:0 "Investir dans les infrastructures"
 EGY_Invest_in_Infrastructure_desc:0 "Une grande partie de notre grand Royaume existe encore dans des conditions que beaucoup considéreraient comme préindustrielles, nous devrions investir dans les infrastructures pour encourager l'activité économique et attirer les investissements."
 EGY_Restructure_the_Royal_Military:0 "Restructurer l'armée royale"
 EGY_Restructure_the_Royal_Military_desc:0 ""
 EGY_Encourage_Western_Casinoes:0 "Encouragez les casinos occidentaux"
 EGY_Encourage_Western_Casinoes_desc:0 "Il est bien connu que notre roi aime les belles choses de la vie et, même si beaucoup lui ont reproché cela, cela lui a également donné un aperçu précieux de l'importance des entreprises que certains pourraient considérer comme... immorales et il cherche maintenant à encourager les investissements de ces établissements en Égypte, uniquement pour les avantages économiques bien sûr."
 EGY_The_Republic_of_Sudan:0 "La République du Soudan"
 EGY_The_Republic_of_Sudan_desc:0 "Le Soudan devrait devenir sa propre république souveraine, ce qui nous épargnerait les futurs problèmes qui se seraient produits si nous avions conservé le contrôle du Soudan."
 EGY_The_Suez_Situation:0 "La situation de Suez"
 EGY_The_Suez_Situation_desc:0 "Le canal a été construit par les Égyptiens mais est entre des mains étrangères. D'innombrables Égyptiens sont morts en construisant le canal, mais ce sont les Britanniques et les Français qui en récoltent les bénéfices. Si nous voulons reprendre le contrôle de notre nation et obtenir la voie navigable stratégiquement précieuse, nous devons reprendre le contrôle"
 EGY_Abrogate_the_1936_Treaty:0 "Abroger le traité anglo-égyptien de 1936"
 EGY_Abrogate_the_1936_Treaty_desc:0 "L'Empire britannique a été affaibli par la guerre. Si nous reprenons le canal par la force, ils ne pourront pas nous arrêter. Nous reprendrons le canal par tous les moyens nécessaires."
 EGY_Negotiate_with_Britain:0 "Négocier avec la Grande-Bretagne"
 EGY_Negotiate_with_Britain_desc:0 "Nous ne pouvons pas nous permettre une guerre avec les Britanniques à propos du canal. Si nous voulons conserver de bonnes relations avec les Britanniques et l'Occident, nous devons négocier une cession pacifique du canal de Suez."
 EGY_The_Gaza_Strip:0 "La bande de Gaza"
 EGY_The_Gaza_Strip_desc:0 "Après l'humiliation à laquelle nous avons été confrontés après la guerre israélo-arabe de 1948, nous avons conservé le contrôle de la bande de Gaza."
 EGY_Dissolve_the_Palestinian_Government:0 "Dissoudre le gouvernement palestinien"
 EGY_Dissolve_the_Palestinian_Government_desc:0 ""
 EGY_Abolish_the_Monarchy:0 "Abolir la monarchie"
 EGY_Abolish_the_Monarchy_desc:0 "L'ancienne monarchie sera abolie et une nouvelle république laïque naîtra de ses cendres."
 EGY_Ban_All_Parties:0 "Interdire toutes les fêtes"
 EGY_Ban_All_Parties_desc:0 "Tous les partis seront interdits afin d'assurer une transition pacifique et d'éviter toute instabilité qui pourrait résulter d'un changement de gouvernement après les élections."
 EGY_Establish_the_Liberation_Rally:0 "Créer le Rassemblement de Libération"
 EGY_Establish_the_Liberation_Rally_desc:0 "Un rassemblement de libération sera organisé pour célébrer la libération du peuple égyptien de l'ancienne monarchie corrompue et contrôlée par les Britanniques."
 EGY_A_New_Constitution:0 "Une nouvelle constitution"
 EGY_A_New_Constitution_desc:0 "Il est maintenant temps d'élaborer une nouvelle constitution moderne pour guider l'Égypte sur la voie de devenir une puissance moderne."
 EGY_Secular_Values:0 "Valeurs laïques"
 EGY_Secular_Values_desc:0 "Nous devons adopter des valeurs laïques au sein de notre gouvernement si nous voulons être un pays moderne et respecté."
 EGY_Trials_for_the_Royalist_Officers:0 "Procès des officiers royalistes"
 EGY_Trials_for_the_Royalist_Officers_desc:0 "Il y a encore des fidèles à l'ancienne monarchie au sein de l'armée ; si nous voulons consolider la révolution, il faut les purger de nos rangs."
 EGY_Ikhwan_Rioting:0 "Émeutes d'Ikhwan"
 EGY_Ikhwan_Rioting_desc:0 "Suite à de nombreuses politiques laïques, la population la plus conservatrice et islamiste a commencé à se soulever contre le nouveau gouvernement."
 EGY_Ban_the_Ikhwan:0 "Interdire l'Ikhwan"
 EGY_Ban_the_Ikhwan_desc:0 "Nous devons interdire les Ikhwan pour limiter leur dangereuse influence au sein du gouvernement et en Égypte dans son ensemble."
 EGY_Conflicts_in_the_RCC:0 "Conflits au sein du RCC"
 EGY_Conflicts_in_the_RCC_desc:0 "Le Conseil de commandement de la révolution est divisé sur la direction que devraient prendre le gouvernement et l'Égypte. Nous devons attendre et voir ce qui se passe."
 EGY_Naguib_Consolidates_Power:0 "Naguib consolide son pouvoir"
 EGY_Naguib_Consolidates_Power_desc:0 "Mohamed Naguib, leader de la révolution contre le roi corrompu Farouk et président du gouvernement de transition, a réussi à déjouer Nasser et à consolider son pouvoir. La transition vers la démocratie peut maintenant commencer."
 EGY_Nasser_Consolidates_Power:0 "Nasser consolide son pouvoir"
 EGY_Nasser_Consolidates_Power_desc:0 "Le colonel Gamal Abdel Nasser a toujours été le plus charismatique du groupe. Avec la consolidation du pouvoir de Nasser, l'Égypte s'orientera dans une direction panarabe et anti-israélienne."
 EGY_Kahlid_Mohieddin_Coup:0 "Coup d'État de Kahlid Mohieddin"
 EGY_Kahlid_Mohieddin_Coup_desc:0 "Kahlid Mohieddin, frustré par Nasser et Naguib, a décidé de prendre sur lui de mettre fin à la lutte pour le pouvoir entre les deux. Désormais aux commandes du RCC, Mohieddin peut établir un véritable État pour le peuple et diriger la révolution prolétarienne du monde arabe."
 EGY_Establish_Tagammu:0 "Établir Tagammu"
 EGY_Establish_Tagammu_desc:0 "Notre grand leader Kahlid Mohieddin a adopté le marxisme après ses études universitaires, bien qu'il n'ait jamais officiellement rejoint le Parti communiste égyptien avant la révolution. Maintenant qu'il a pris le pouvoir et que le peuple a pris le contrôle, le RCC devrait être dissous et toutes les activités politiques doivent être réunies sous le nouveau Parti unioniste national progressiste (également appelé Tagammu)."
 EGY_Strengthen_Soviet_Ties:0 "Renforcer les liens soviétiques"
 EGY_Strengthen_Soviet_Ties_desc:0 "Notre position au sein du monde arabe est encore précaire et si nous voulons survivre, nous devons tendre la main aux autres nations, l'Union soviétique, en tant que leader du monde communiste, est le premier choix évident."
 EGY_Merger_with_the_Communist_Party:0 "Fusion avec les liens communistes"
 EGY_Merger_with_the_Communist_Party_desc:0 "Depuis 1921, le mouvement communiste égyptien est fracturé et faible. Maintenant que le peuple contrôle l'État égyptien, nous devrions fusionner ces différentes factions dans le nouveau Parti et travailler ensemble pour la Révolution ouvrière."
 EGY_Reconstruction_of_Cairo:0 "Reconstruction du Caire"
 EGY_Reconstruction_of_Cairo_desc:0 "Le Caire est la capitale de l'Égypte et, à la grande honte du gouvernement, elle n'est pas à la hauteur des normes d'autres grandes villes comme Paris ou Londres. Nous devrions lancer un projet à grande échelle pour moderniser et agrandir la ville."
 EGY_City_Economics:0 "Économie de la ville"
 EGY_City_Economics_desc:0 "Les villes ont toujours été la poule aux oeufs d'or de tout État. Si nous souhaitons récolter des récompenses encore plus importantes, nous devons investir dans les entreprises au sein des villes et encourager la croissance économique."
 EGY_The_Modern_Pharoah:0 "Le pharaon moderne"
 EGY_The_Modern_Pharoah_desc:0 "Le roi Farouk a réussi à consolider son règne et à prouver qu'il est là pour rester."
 EGY_Soviet_Military_Coopeation:0 "Coopération militaire soviétique"
 EGY_Soviet_Military_Coopeation_desc:0 "Les dirigeants soviétiques ont proposé d'aider à former et à assister nos militaires, nous devons accepter leur aide pour atteindre les normes de la guerre moderne."
 EGY_Align_with_the_Warsaw_Pact:0 "S'aligner sur le Pacte de Varsovie"
 EGY_Align_with_the_Warsaw_Pact_desc:0 "L'Occident n'est pas disposé à nous soutenir contre la menace israélienne. Il est donc temps de s'aligner sur le Pacte de Varsovie pour freiner les influences occidentales et impérialistes en Égypte et dans le monde arabe dans son ensemble."
 EGY_Sponsor_Fedayeen_Activities:0 "Parrainez les Fedayin palestiniens"
 EGY_Sponsor_Fedayeen_Activities_desc:0 "Nous devons parrainer nos frères palestiniens en armant les Fedayin pour perturber les opérations israéliennes en Palestine."
 EGY_Expand_Womens_Rights:0 "Développer les droits des femmes"
 EGY_Expand_Womens_Rights_desc:0 "Une Égypte moderne nécessite des politiques modernes. L'Égypte doit défendre les droits des femmes et devenir l'un des États progressistes du Moyen-Orient."
 EGY_Establish_Secret_Police:0 "Créer une force de police secrète"
 EGY_Establish_Secret_Police_desc:0 "C'est une triste vérité que le peuple égyptien n'a pas encore pleinement soutenu notre nouveau gouvernement et certains appellent même au renversement de notre grand leader et à la destruction du parti. Afin d'empêcher ces subversifs de miner le pays, nous devons établir un service de sécurité spécial pour les éliminer avant qu'ils ne puissent laver le cerveau du peuple."
 EGY_Nationalize_Foriegn_Assets:0 "Nationaliser les avoirs étrangers"
 EGY_Nationalize_Foriegn_Assets_desc:0 "Les étrangers exploitent notre peuple depuis trop longtemps, il est temps d'expulser l'influence de ces parasites capitalistes et de s'emparer de leurs actifs au profit de l'État (et du peuple)."
 EGY_Student_Radicalization:0 "Radicalisation étudiante"
 EGY_Student_Radicalization_desc:0 ""
 EGY_Enforce_State_Atheism:0 "Appliquer l'athéisme d'État"
 EGY_Enforce_State_Atheism_desc:0 "La religion n'a rien fait d'autre que retenir le peuple égyptien par la peur et la superstition. Nous devons adopter l'athéisme imposé par l'État pour progresser vers l'avenir."
 EGY_Reduce_Censorship:0 "Réduire la censure"
 EGY_Reduce_Censorship_desc:0 "La presse a toujours entretenu une relation d'amour et de haine avec les gouvernements. Afin d'empêcher des éléments antidémocratiques de diffuser leur message, la presse a dû être censurée, mais cela n'est plus nécessaire et la liberté de la presse peut être restaurée."
 EGY_Repeal_Political_Bans:0 "Abroger les interdictions politiques"
 EGY_Repeal_Political_Bans_desc:0 "Une fois notre pouvoir assuré et la révolution stabilisée, les mesures autoritaires utilisées pour empêcher un contre-coup d'État peuvent être levées et nous pouvons sérieusement démarrer le processus démocratique."
 EGY_Guided_Democracy:0 "Démocratie guidée"
 EGY_Guided_Democracy_desc:0 "Même si le président Naguib a veillé à ce que les principes démocratiques survivent en Égypte, certains cherchent toujours à déstabiliser le pays. Afin de protéger la démocratie encore jeune, nous devons veiller à ce que les citoyens soient guidés dans la bonne direction."
 EGY_The_Road_to_Democracy:0 "La route vers la démocratie"
 EGY_The_Road_to_Democracy_desc:0 "Mohamed Naguib, leader de la révolution de 52 et premier président égyptien, a apporté la démocratie à notre grande nation et même si le chemin à parcourir est encore long et ardu, nous pouvons être assurés qu'il sera démocratique."
 EGY_Establish_Political_Rights:0 "Établir les droits politiques"
 EGY_Establish_Political_Rights_desc:0 "La démocratie n'étant plus menacée, nous pouvons inscrire dans la loi les droits acquis par la révolution. "
 EGY_Western_Rappoachment:0 "Rapprochement occidental"
 EGY_Western_Rappoachment_desc:0 "Depuis la Révolution, les relations avec l'Occident sont pour le moins tendues. Nous devrions chercher à réparer nos relations endommagées et en établir de nouvelles avec les grandes démocraties occidentales."
 EGY_Tolerate_the_Ilkwhan:0 "Tolérer l'Ikhwan"
 EGY_Tolerate_the_Ilkwhan_desc:0 "Les Frères musulmans d'Égypte (également connus sous le nom d'Ikhwan) constituent depuis des années une force politique majeure en Égypte et, avec la chute de la monarchie, leur influence s'est encore accrue. Malgré leur soutien à la révolution, ils se sont opposés à nos efforts visant à laïciser le pays. Si nous levons l'interdiction de leurs activités et les introduisons dans le processus démocratique, nous pouvons isoler les membres les plus radicaux des Frères musulmans et les empêcher de déstabiliser le pays."
 EGY_Hold_Elections:0 "Tenir des élections"
 EGY_Hold_Elections_desc:0 "Le moment est venu de tenir notre promesse d'amener la démocratie en Égypte, aux élections !"
 EGY_Naguib_Victory:0 "Victoire de Naguib"
 EGY_Naguib_Victory_desc:0 "Mohamed Naguib, leader de la révolution et premier président de la nouvelle république, s'est révélé être un leader capable et digne de confiance et le peuple a choisi qu'il continue à diriger le pays. "
 EGY_Ilkwhan_Victory:0 "Victoire d'Ikhwan"
 EGY_Ilkwhan_Victory_desc:0 "Les Frères musulmans exercent une influence en Égypte depuis leur création en 1928. Malgré les efforts déployés par la monarchie et le Mouvement des officiers libres pour réprimer l'organisation, ils ont continué à être les principaux défenseurs d'une Égypte islamique et ont remporté la victoire aux récentes élections. Cependant, les Frères musulmans sont divisés entre les modérés qui prônent une démocratie guidée par les principes islamiques et les extrémistes qui cherchent à établir un État pleinement islamique en Égypte."
 EGY_Establish_Sharia_Law:0 "Établir la charia"
 EGY_Establish_Sharia_Law_desc:0 "Alors que les partisans de la ligne dure et les modérés s'affrontent sur de nombreuses questions, celui sur lequel ils peuvent tous deux s'entendre est l'intégration de la charia dans le code juridique égyptien et la création de tribunaux de la charia afin d'aider les autorités laïques à faire respecter la loi islamique."
 EGY_Mobilize_the_Secret_Apparatus:0 "Mobiliser l'appareil secret"
 EGY_Mobilize_the_Secret_Apparatus_desc:0 "Ce qu'on appelle l'Appareil Secret constitue une force paramilitaire importante pour la Confrérie depuis l'époque de la Monarchie. Maintenant que l'Égypte s'oriente vers un avenir islamique, ils devraient être mobilisés pour défendre le gouvernement islamique."
 EGY_Promote_Islamic_Morality:0 "Promouvoir la moralité islamique"
 EGY_Promote_Islamic_Morality_desc:0 "La moralité de notre peuple est tout aussi importante que toute réforme ou loi gouvernementale. Nous devons promouvoir les valeurs et les enseignements islamiques dans les écoles et les institutions publiques afin d'encourager un comportement moral parmi les citoyens"
 EGY_Sayyid_Qutb:0 "Sayyid Qutb"
 EGY_Sayyid_Qutb_desc:0 "Le peuple a parlé et malgré les efforts de sécularisation du RCC, il a prouvé à tous que le peuple égyptien est islamique de part en part. Les partisans de la ligne dure dirigés par Sayyid Qutb sont devenus les vainqueurs de la lutte pour le pouvoir au sein des Frères musulmans et le processus de transformation de l'Égypte en un véritable État islamique peut maintenant commencer."
 EGY_Condemn_the_Zionist_Threat:0 "Condamner la menace sioniste"
 EGY_Condemn_the_Zionist_Threat_desc:0 "Nous devons condamner la menace sioniste au-delà de nos frontières car elle constitue un État illégitime."
 EGY_Persecute_Religous_Minorities:0 "Persécuter les minorités religieuses"
 EGY_Persecute_Religous_Minorities_desc:0 "Il est regrettable qu'il y ait encore en Égypte des gens qui rejettent les enseignements de l'Islam et des Frères musulmans. Afin de parvenir à une société pure, ces éléments non islamiques doivent être purgés et les dissensions religieuses éliminées."
 EGY_Repeal_Secular_Reforms:0 "Abroger les réformes laïques"
 EGY_Repeal_Secular_Reforms_desc:0 "Les réformes laïques du RCC et du président Naguib ont été le principal point d'opposition des Frères musulmans après la Révolution. Maintenant que le peuple a manifesté son désir d'une Égypte islamique, ces réformes devraient être abrogées et l'Islam devrait prendre la place qui lui revient en tant que principe directeur de notre nation."
 EGY_Hassan_al_Hudaybi:0 "Hassan Al Hudaybi"
 EGY_Hassan_al_Hudaybi_desc:0 "La faction modérée des Frères musulmans dirigée par Hassan Al Hudaybi, le chef officiel des Frères musulmans, a remporté les élections. Hudaybi, critique de longue date des tendances violentes des Frères musulmans et partisan d'une transition plus pacifique et démocratique vers une société islamique, a gagné la sympathie et le soutien du peuple et surmonté l'opposition interne au sein des Frères musulmans et est sorti victorieux de la lutte pour le pouvoir avec les partisans de la ligne dure et peut désormais entamer la transformation de l'Égypte en une véritable République islamique."
 EGY_Crush_Israel:0 "Écraser Israël"
 EGY_Crush_Israel_desc:0 "L'expérience de l'État sioniste illégitime dure depuis assez longtemps. Il est temps de reprendre la Palestine et d'écraser Israël."
 EGY_Du_at_la_Qudat:0 "Du à la Qudat"
 EGY_Du_at_la_Qudat_desc:0 "Le président Hudaybi a enfin publié son traité sur la mise en oeuvre de la loi islamique au sein de la société. Le soi-disant Du at la Qudat (Prêcheurs, pas juges) réfute les éléments les plus radicaux au sein de la Confrérie et critique les pratiques des autres gouvernements musulmans pour leur politique et dénonce la pratique du takfir, ou déclarer un musulman incroyant, et déclare que la profession de foi en l'Islam est suffisante pour être musulman et que commettre un péché ne fait pas de quelqu'un un apostat. Sans jamais faire directement référence à Sayyid Qutb, nombreux sont ceux qui ont souligné les implications de la dénonciation des pratiques et tactiques spécifiques employées par Qutb et les partisans de la ligne dure."
 EGY_Moderate_Reforms:0 "Des réformes modérées"
 EGY_Moderate_Reforms_desc:0 "Même si l'Islam doit être la base de la politique et de la loi en Égypte, cela ne signifie pas que nous devons persécuter les autres religions, en particulier les peuples du livre. Nos réformes devraient garantir la protection de ces minorités et garantir la liberté de religion, même sous un gouvernement islamique."
 EGY_Democratic_Islamism:0 "Islam démocratique"
 EGY_Democratic_Islamism_desc:0 "L'Islam est fondamentalement une religion démocratique et le gouvernement devrait refléter cela. Le Coran enseigne que la consultation (Shura) et le consensus (Ijma) sont essentiels aux fonctions de gouvernance et que les libertés et les droits (al-hurriyya et al-huqquq al-shar'iyya) doivent être garantis. Cela devrait également garantir la stabilité et la popularité de notre gouvernement."
 EGY_Support_Small_Buisness:0 "Soutenir les petites entreprises"
 EGY_Support_Small_Buisness_desc:0 "La classe marchande a toujours été importante dans l'Islam et la tradition islamique, le Prophète lui-même était initialement un marchand. En suivant cet esprit, nous devons soutenir les petites entreprises et les commerçants de notre pays et garantir leur protection contre l'influence du gouvernement."
 EGY_Increase_Healthcare_Access:0 "Augmenter l'accès aux soins de santé"
 EGY_Increase_Healthcare_Access_desc:0 "Notre population souffre toujours du manque d'accès aux soins de santé. Le moment est venu de garantir que chacun puisse recevoir un traitement approprié en cas de maladie ou de blessure."
 EGY_Water_Infrastructure:0 "Infrastructures hydrauliques"
 EGY_Water_Infrastructure_desc:0 "Le Nil est l'élément vital de l'Égypte depuis l'époque des pharaons ; le gouvernement devrait améliorer les infrastructures qui l'entourent pour mieux tirer profit de cet important fleuve."
 EGY_Western_Investment:0 "Investissements occidentaux"
 EGY_Western_Investment_desc:0 "L'Occident exploite depuis longtemps le peuple égyptien, mais nous sommes désormais une démocratie forte et indépendante, libre de toute influence étrangère. Nous devrions à nouveau attirer des investissements des pays occidentaux, mais cette fois à nos conditions."
 EGY_Exile_the_Jewish_Population:0 "Exiler la population juive"
 EGY_Exile_the_Jewish_Population_desc:0 "La population juive doit être exilée si nous voulons maintenir la stabilité à l'intérieur de nos frontières."
 EGY_Economic_Growth:0 "Croissance économique"
 EGY_Economic_Growth_desc:0 "Les réformes de Nasser portent leurs fruits alors que l'économie a commencé à croître. Nous devrions utiliser cette prospérité."
 EGY_Increase_Access_to_Healthcare:0 "Augmenter l'accès aux soins de santé"
 EGY_Increase_Access_to_Healthcare_desc:0 "Tout Égyptien ayant besoin de soins de santé devrait pouvoir y accéder. Nous devons accroître l'accès aux soins de santé, même pour les Égyptiens les plus pauvres."
 EGY_Golden_Era_of_Egyptian_Culture:0 "L'ère d'or de la culture égyptienne"
 EGY_Golden_Era_of_Egyptian_Culture_desc:0 "La liberté culturelle accordée par le gouvernement a marqué le début d'un âge d'or pour la culture et le cinéma égyptiens."
 EGY_Helwan_Steel_Works:0 "Aciéries Helwan"
 EGY_Helwan_Steel_Works_desc:0 "Grâce à l'aciérie d'Helwan, nous pourrons augmenter massivement la production d'acier. Nous serons ainsi moins dépendants des importations d'acier étrangères."
 EGY_Constitutional_Reform:0 "Réformes constitutionnelles"
 EGY_Constitutional_Reform_desc:0 "Nous devons réformer la constitution pour l'adapter à la situation en constante évolution de l'Égypte. Si la Constitution veut rester moderne, elle doit être réformée."
 EGY_Establish_the_National_Union:0 "Créer le syndicat national"
 EGY_Establish_the_National_Union_desc:0 "Pour freiner l'influence communiste et obtenir plus de soutien de la gauche, nous créerons une union nationale."
 EGY_Secure_Funding_for_the_Aswan_Dam:0 "Financement sécurisé pour le barrage d'Assouan"
 EGY_Secure_Funding_for_the_Aswan_Dam_desc:0 "Si l'Égypte veut moderniser et augmenter sa production agricole, le barrage d'Assouan doit être construit. Trouver des investissements étrangers et des prêts pour financer la construction du barrage destiné à fournir de l'eau et de l'électricité au peuple égyptien est donc de la plus haute importance."
 EGY_Expand_Affordable_Housing:0 "Développer le logement abordable"
 EGY_Expand_Affordable_Housing_desc:0 "Nous devons développer nos logements abordables pour loger la population égyptienne croissante et réduire le nombre de sans-abrisme"
 EGY_Nationalization_Programs:0 "Programmes de nationalisation"
 EGY_Nationalization_Programs_desc:0 "La nationalisation des entreprises étrangères profitera non seulement au gouvernement mais aussi à la population. Avec ces campagnes de nationalisation, nous pourrons financer nos réformes et nos programmes publics."
 EGY_Formation_of_the_UAR:0 "Formation de l'UAR"
 EGY_Formation_of_the_UAR_desc:0 "Nous devons unir tous les peuples arabes sous un même drapeau et un seul pays. La formation de la RAU marquera le début de l'unification des Arabes et constituera une marque de l'histoire qui unira enfin un peuple longtemps divisé. La formation de la RAU modifiera l'équilibre des pouvoirs au Moyen-Orient en notre faveur."
 EGY_Surplus_Soviet_Supplies:0 "Excédent de fournitures soviétiques"
 EGY_Surplus_Soviet_Supplies_desc:0 "Les Soviétiques disposent d'un énorme surplus de fournitures qui pourraient financer et équiper notre armée. La réception de ces fournitures nous préparera au chemin à parcourir"
 1_EGY_tt:0 "Abdel Hakim Amer deviendra maréchal"
 2_egy_tt:0 "Sa Majesté le Roi Farouk se rendra en France pour des raisons diplomatiques"
 3_egy_tt:0 "Toutes les voitures rouges seront interdites"
 EGY_construct_a_spy_network:0 "Créer un service de sécurité de l'État"
 EGY_construct_a_spy_network_desc:0 "Les traîtres et les subversifs étant trop répandus au sein de la société égyptienne, le roi a approuvé la création d'un nouveau service de sécurité royal pour défendre l'institution de la monarchie."
 EGY_guarantee_high_living_for_friends:0 "Garantir un niveau de vie élevé à vos amis"
 EGY_guarantee_high_living_for_friends_desc:0 "Pourquoi ne pas récompenser vos amis en leur offrant un niveau de vie supérieur à celui du commun ? Ils vous ont été fidèles, comme vous vous en souvenez."
 EGY_fund_oil_barons:0 "Fonds pour les barons du pétrole"
 EGY_fund_oil_barons_desc:0 "Certaines des relations du roi Farouk sont celles d'importants barons du pétrole, nous devrions investir dans leurs opérations en signe de soutien du gouvernement et afin d'augmenter la production pétrolière."
 EGY_build_up_the_army:0 "Développez l'armée"
 EGY_build_up_the_army_desc:0 "Avec le retrait des officiers déloyaux et la loyauté des militaires assurée, le roi Farouk a décidé de se lancer dans un programme d'expansion militaire pour la gloire du roi et du pays."
 EGY_stop_communism:0 "Réprimer les organisations communistes"
 EGY_stop_communism_desc:0 "De toutes les forces politiques égyptiennes appelant à la déposition de la monarchie, les communistes ont été les plus bruyants ces dernières années. Même si les agences de renseignement n'ont pas été en mesure de confirmer le soutien de Moscou dans leurs efforts, nous devrions néanmoins intensifier nos efforts pour réprimer cette idéologie dangereuse."
 EGY_military_parade:0 "Organiser un défilé militaire"
 EGY_military_parade_desc:0 "Notre armée est désormais l'une des plus modernes et des plus puissantes du monde arabe. Nous devrions organiser un défilé militaire au Caire pour montrer notre puissance au monde et à tous les dissidents potentiels du pays."
 EGY_fund_healthcare:0 "Financer de meilleurs soins de santé"
 EGY_fund_healthcare_desc:0 "Le bien-être de nos citoyens doit passer avant tout, le nouveau monarque a présenté un projet de loi au Parlement visant à accroître l'accès et la qualité des soins de santé au sein du royaume."
 EGY_farouk_leads_troops:0 "Maréchal Farouk"
 EGY_farouk_leads_troops_desc:0 "Comme les pharaons d'autrefois, Sa Majesté dirigera ses troupes en personne. Le roi ne devrait-il pas affirmer son commandement dans l'armée ?"
 EGY_farouk_clique:0 "Clique Farouk"
 EGY_farouk_clique_desc:0 "En raison de la tendance de Farouk à donner d'énormes sommes d'argent à ses amis, nous commençons maintenant à voir se former autour de Farouk une clique organisée qui contrôle la majeure partie du pays."
 EGY_improve_lives_with_church:0 "Autoriser l'aide des missionnaires"
 EGY_improve_lives_with_church_desc:0 "Le parti Wafd a toujours accepté les personnes de toutes origines religieuses et confessions. Grâce à notre approche plus tolérante et libérale de la religion, les missionnaires occidentaux ont commencé à établir des installations médicales et des programmes d'assistance pour les pauvres. En reconnaissant officiellement ces missionnaires et en leur apportant le soutien du gouvernement, nous pouvons assurer le bien-être de nos citoyens."
 EGY_labour_negotations:0 "Tenir les promesses du travail"
 EGY_labour_negotiations_desc:0 "Afin de remporter la victoire aux élections, nous avons fait des promesses aux syndicats et aux organisations de travailleurs. Même si certains membres du parti peuvent qualifier cela de socialisme, si nous voulons leur soutien continu, nous devons tenir nos promesses et accroître le pouvoir des travailleurs et l'adhésion syndicale."
 EGY_wafd_victory:0 "Victoire du Wafd"
 EGY_wafd_victory_desc:0 "Le parti Wafd s'était attiré le ressentiment des dirigeants révolutionnaires et du peuple pour sa collaboration avec l'ancienne monarchie et les Britanniques. Mais avec la transition vers la démocratie, leurs politiques libérales ont de nouveau gagné du terrain et ils ont acquis juste assez de popularité pour remporter la victoire aux élections."
 EGY_sell_farouks_posessions:0 "Vendre les possessions des rois"
 EGY_sell_farouks_posessions_desc:0 "Vendre les biens du roi Farouk nous rapportera de l'argent supplémentaire et prouvera au peuple égyptien que le gouvernement de la nouvelle république sera différent de la monarchie corrompue et contrôlée par les Britanniques."
 EGY_Align_with_moscow:0 "S'aligner sur Moscou"
 EGY_Align_with_moscow_desc:0 "L'Union soviétique a prouvé qu'elle était le leader du mouvement prolétarien à travers le monde et notre plus grand bienfaiteur. Nous devons formaliser notre alignement avec l'Union soviétique et travailler ensemble pour libérer les travailleurs du monde."
 EGY_give_land_to_peasents:0 "Donner des terres aux paysans"
 EGY_give_land_to_peasents_desc:0 "Une grande partie des revendications des opposants au roi Farouk portent sur la redistribution des terres aux paysans. Non seulement cela augmenterait la productivité et le bonheur du peuple, mais notre monarque avisé pourrait également utiliser cela comme un moyen de diminuer la richesse et l'influence des rivaux potentiels de son pouvoir. "
 EGY_replace_farouk:0 "Remplacer Farouk"
 EGY_replace_farouk_desc:0 "Farouk s'est révélé incapable d'unifier et de diriger le peuple égyptien. Il doit être remplacé par un leader plus sensé (ou contrôlable)."
 EGY_limited_reforms:0 "Des réformes limitées"
 EGY_limited_reforms_desc:0 "Malgré la prospérité et la paix que notre grand roi a apportées au pays, certains critiquent encore le roi Farouk comme étant corrompu et incompétent. Même si la répression et la censure sont toujours des moyens rapides de mettre fin à ces notions traîtres, cette stratégie ne peut aller que jusqu'à un certain point. Le roi, dans son ultime sagesse, a jugé nécessaire de mettre en oeuvre des réformes limitées pour améliorer la vie de la population et créer un gouvernement plus efficace et plus proactif."
 EGY_improve_worker_rights:0 "Améliorer les droits des travailleurs"
 EGY_improve_worker_rights_desc:0 "Les syndicats et les organisations de travailleurs sont interdits depuis longtemps dans le royaume, mais les syndicats clandestins et les mouvements ouvriers se sont révélés être un terrain fertile pour le sentiment communiste. Même si cela pourrait contrarier certains alliés et amis du roi, Farouk est assez sage pour comprendre qu'en levant les restrictions imposées aux syndicats et en leur permettant d'opérer au grand jour, cela permettrait une meilleure surveillance de leurs activités et drainerait tout soutien potentiel aux mouvements communistes."
 EGY_reduce_kings_spending:0 "Réduire les dépenses du roi"
 EGY_reduce_kings_spending_desc:0 "Le roi a appris une certaine humilité et a décidé de réduire ses dépenses. Une amélioration à coup sûr."
 EGY_force_british_to_leave:0 "Forcer les Britanniques à partir"
 EGY_force_british_to_leave_desc:0 "Nous avons toléré les Britanniques depuis bien trop longtemps, alors que les forces militaires toujours présentes dans la région, apparemment pour protéger le canal de Suez, ont dépassé leur accueil et il est temps pour eux de partir."
 EGY_encorage_egyptian_identitety:0 "Encourager l'identité égyptienne"
 EGY_encorage_egyptian_identitety_desc:0 "L'Égypte n'est pas un autre pays arabe. L'Égypte a sa propre fière histoire que le peuple doit connaître."
 EGY_fate_of_nasser:0 "Le destin de Nasser"
 EGY_fate_of_nasser_desc:0 "Nasser ne cherchait qu'à prendre le pouvoir. Maintenant que ses ambitions ont été freinées, nous devons décider du sort de Nasser et de l'avenir de l'Égypte"
 EGY_economic_boom:0 "Joyau du Nil"
 EGY_economic_boom_desc:0 "Grâce à la sage gestion du roi Farouk, l'économie a connu ces dernières semaines une augmentation massive des investissements et des dépenses, conduisant à une plus grande richesse."
 EGY_reform_the_parlament:0 "Réformer le Parlement"
 EGY_reform_the_parlament_desc:0 "L'ancien roi a dissous le Parlement pour assurer son règne. Cependant, une fois qu'il est à l'écart, nous devrions le réformer pour donner la foi aux gens."
 EGY_reform_blueshirts:0 "Réformer les chemises bleues"
 EGY_reform_blueshirts_desc:0 "Les Chemises bleues étaient l'aile jeunesse de notre parti. Cependant, auparavant, au lieu de capitaliser sur le caractère populaire des mouvements de jeunesse, nous essayions plutôt de placer les Chemises bleues à leur propre échelon dans la hiérarchie descendante du Wafd, en présentant aux membres des uniformes, des insignes et un salut standard. Cette fois, nous ferons les choses différemment et les transformerons en une véritable organisation de jeunesse."
 EGY_fate_of_farouk:0 "Le destin de l'ancien roi"
 EGY_fate_of_farouk_desc:0 "Nous n'avons pas vérifié si le King allait bien depuis un moment. Nous devrions voir ce qui lui est arrivé maintenant."
 EGY_oppose_red_menace:0 "S'opposer à la menace rouge"
 EGY_oppose_red_menace_desc:0 "Les communistes de l'Est ne valent pas mieux que les impérialistes de l'Ouest. Les Rouges cherchent à renverser notre nouveau gouvernement libéral ; ils doivent être exclus de notre nation si l'on veut que la démocratie et la liberté survivent."
 EGY_limit_israels_influence:0 "Limiter l'influence israélienne"
 EGY_limit_israels_influence_desc:0 "Comme une vérole, les influences sionistes devraient être contenues et empêchées de se propager davantage. Le docteur Egypt sait mieux."
 EGY_a_new_party:0 "Nouvelle fête Wafd"
 EGY_a_new_party_desc:0 "Nous nous sommes enfin débarrassés de notre ancienne réputation de collaboration avec la monarchie et les Britanniques, et nos politiques libérales ont prouvé notre engagement en faveur du bien-être du peuple. L'ancien parti est mort et le nouveau parti Wafd est devenu une voix importante en Égypte."
 EGY_oppose_the_british:0 "S'opposer aux Britanniques"
 EGY_oppose_the_british_desc:0 "Malgré notre volonté antérieure de coopérer avec les Britanniques sous la monarchie, ce n'était que pour pouvoir répondre aux besoins de l'époque. Maintenant que la monarchie a disparu, nous pouvons adopter une position plus dure contre les Britanniques et prouver notre loyauté envers la nation et le peuple égyptiens. "
 fawzia_faud:0 "Fawzia Faud"
 UAR_Establishment_Of_The_UAR:0 "Création de la République Arabe Unie"
 UAR_Disband_the_Syrian_Parliament:0 "Dissoudre le Parlement syrien"
 UAR_Allow_the_Syrian_Baathist_Party:0 "Permettez au parti baathiste syrien"
 UAR_Ban_all_Syrian_Parties:0 "Interdire tous les partis syriens"
 UAR_Form_a_new_National_Assembly:0 "Former une nouvelle Assemblée nationale"
 UAR_Form_The_Syrian_Tripartite_Comitee:0 "Former le Comité tripartite syrien"
 UAR_Prevent_Syrian_Officials_from_Getting_Power:0 "Empêcher les responsables syriens d'accéder au pouvoir"
 UAR_Neutralize_Important_Syrian_Opposition_Figure:0 "Neutraliser une importante figure de l'opposition syrienne"
 UAR_Start_Implementing_the_Egyptian_Land_Reform_In_Syria:0 "Commencer à mettre en oeuvre la réforme agraire égyptienne en Syrie"
 UAR_Restrict_Syrian_Communist_Influence:0 "Restreindre l'influence communiste syrienne"
 UAR_Delegate_Egyptians_to_Administrate_Syria:0 "Déléguer les Égyptiens pour administrer la Syrie"
 UAR_Block_Saudi_Bedouin_Funding:0 "Bloquer le financement saoudo-bédouin"
 UAR_An_United_Arab_Republic:0 "Une République arabe « unie »"
 soviet_technical_advisors_PRC:0 "Conseillers techniques soviétiques"
 peoples_democracy:0 "Démocratie populaire"
 EGY_free_press:0 "Presse gratuite"
 EGY_free_press_desc:0 "La presse a toujours été hostile aux gouvernements du monde entier, mais elle constitue néanmoins une institution importante pour la survie des principes démocratiques. Nous devons garantir la liberté de la presse, même si cela signifie que certaines personnes seront influencées contre nous."
 EGY_educate_the_masses:0 "Programmes d'alphabétisation"
 EGY_educate_the_masses_desc:0 "L'éducation selon l'ONU est un droit humain, le peuple égyptien souffre depuis longtemps du manque d'éducation et de l'analphabétisme. Le monarque a proposé un nouveau programme de dépenses éducatives pour garantir que tous les citoyens du Royaume aient accès à l'éducation et la première étape vers cet objectif consiste à promouvoir l'alphabétisation."
 EGY_emplyment_opportunities:0 "Programme pour petites entreprises"
 EGY_emplyment_opportunities_desc:0 "Le boom économique amorcé sous l'ancien roi Farouk a eu pour conséquence malheureuse d'abandonner de nombreuses petites entreprises au profit des grandes entreprises. Nous devrions lancer un programme de prêts à faible taux d'intérêt et d'investissements dans les petites entreprises afin qu'elles puissent être compétitives."
 EGY_rural_development:0 "Développement rural"
 EGY_rural_development_desc:0 "Une grande partie de notre pays et de son agriculture dépendent du Nil et des quelques sources d'eau du désert. Afin de tirer pleinement parti de ces régions rurales, elles ont besoin d'investissements pour s'étendre et se développer selon les normes modernes."
 EGY_root_out_corruption:0 "Éradiquer la corruption"
 EGY_root_out_corruption_desc:0 "L'ancien roi Farouk était bien connu pour avoir doté les bureaux politiques de copains et de courtisans pendant son règne et pour avoir laissé la corruption sévir. Si nous souhaitons créer un gouvernement transparent et responsable, il faut s'attaquer à ce problème."
 EGY_direct_rule_from_cairo:0 "Règle directe depuis le Caire"
 EGY_direct_rule_from_cairo_desc:0 "Le Soudan a toujours été un territoire égyptien légitime sous occupation britannique. Alors que les négociations sur le statut futur de la région commencent à tourner en notre faveur, nous devrions faire pression pour une annexion totale au Royaume intégré au système provincial royal."
 EGY_defend_against_others:0 "Défendre notre terre"
 EGY_defend_against_others_desc:0 "L'Égypte est le seul bastion du véritable socialisme dans le monde arabe et est entourée d'ennemis. Nous devons commencer à construire des défenses et des fortifications pour dissuader les puissances impérialistes de toute invasion. "
 rulc_egy_tt:0 "Débloque l'objectif d'annexion du Soudan"
 EGY_stable_for_now:0 "Stable pour l'instant"
 EGY_stable_for_now_desc:0 "Grâce aux sages réformes instituées par Farouk, les gens sont désormais beaucoup plus heureux et leur vie s'est considérablement améliorée. Les appels au renversement du gouvernement ont diminué, les travailleurs mécontents ne se plaignent plus des heures de travail et les menaces de mort n'apparaissent plus par courrier !"
 EGY_more_democratic_nation:0 "La démocratie, enfin"
 EGY_more_democratic_nation_desc:0 "Même si la monarchie demeure une institution importante dans la gouvernance et l'unité du pays, la corruption et les excès du roi Farouk à l'époque de son règne absolu ont montré la folie de permettre à une seule personne le pouvoir absolu. Sous le nouveau monarque, un gouvernement véritablement constitutionnel et démocratique règne désormais et l'Égypte peut véritablement se considérer comme le phare de la liberté dans le monde arabe."
 EGY_spread_to_libya:0 "Soutenez les communistes libyens"
 EGY_spread_to_libya_desc:0 "Nos camarades en Libye restent sous le régime despotique de la monarchie Senussi, nous devons fournir une aide pour aider le peuple libyen à se libérer."
 EGY_support_israel_communists:0 "Soutenez les communistes israéliens"
 EGY_support_israel_communists_desc:0 "Malgré notre inimitié historique envers l'État d'Israël, nous ne haïssons pas le peuple israélien. Notre grand leader comprend que le peuple israélien est toujours nos frères et soeurs et qu'il a été égaré par les mensonges et la propagande capitalistes. Si nous voulons apaiser la haine entre nous, nous devons soutenir le peuple israélien dans la création d'un État socialiste."
 EGY_arab_socialism:0 "Socialisme à caractéristiques arabes"
 EGY_arab_socialism_desc:0 "Le peuple arabe n'est pas adapté au socialisme de style soviétique. Nous devons tracer notre propre voie dans le cadre d'un nouveau socialisme arabe qui fonctionnera pour nous."
 EGY_red_officers:0 "Orientation militaire soviétique"
 EGY_red_officers_desc:0 "Nos officiers sont encore jeunes et inexpérimentés, nous devrions demander aux officiers soviétiques de nous conseiller en cas de guerre."

 EGY_replace_old_officials:0 "Remplacer les politiciens corrompus"
 EGY_replace_old_officials_desc:0 "Les membres corrompus des élites politiques ont prouvé qu'ils font partie du problème et qu'ils ne constituent jamais la solution. Leur remplacement est nécessaire pour nettoyer notre politique de la corruption."
 EGY_better_relations_with_israel:0 "Améliorer les relations avec Israël"
 EGY_better_relations_with_israel_desc:0 "Un nouveau roi est une nouvelle direction pour notre politique étrangère. Nous pouvons commencer par le changement en améliorant les relations bilatérales avec Israël."
 EGY_closen_with_usa:0 "Des liens plus étroits avec les États-Unis"
 EGY_closen_with_usa_desc:0 "La proximité avec les États-Unis permettra certainement de les protéger du communisme et de prouver que nous sommes un allié valable."
 EGY_finalize_corruption_reforms:0 "Finaliser les réformes anti-corruption"
 EGY_finalize_corruption_reforms_desc:0 "Nos réformes contre la corruption touchent à leur fin. À partir de là, une nouvelle Égypte pour le peuple ouvrira la voie."
 
