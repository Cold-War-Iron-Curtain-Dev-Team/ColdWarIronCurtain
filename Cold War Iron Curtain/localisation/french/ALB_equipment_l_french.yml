 #Albanian Air Force
 
 ALB_fighter_equipment_0:0 "Force aérienne d'Ushtria Popullore Shqiptare"
 ALB_fighter_equipment_0_short:0 "UPShAF"
 ALB_fighter_equipment_0_desc:0 "L'armée de l'air de l'UPSh a été fondée en avril 1952 et comptait 11 000 hommes. La mission de l'armée de l'air était de repousser l'ennemi aux frontières du pays et de défendre l'espace aérien national. En 1970, l'UPSh est passé des avions de fabrication soviétique aux avions chinois, que les Albanais n'utiliseront que pendant une courte période avant l'effondrement des relations entre l'Albanie et les Chinois, ce qui a rendu la maintenance encore plus difficile car l'UPSh s'appuyait sur des spécialistes soviétiques/chinois plus expérimentés en technologie militaire."

 ALB_fighter_equipment_1:0 "Yakolev Yak-3"
 ALB_fighter_equipment_1_short:0 "Yak-3"
 ALB_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant des pilotes que du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers déployés par tous les combattants pendant la guerre, son rapport puissance/poids élevé lui a conféré d'excellentes performances et il s'est avéré être un formidable chasseur de chiens."
 ALB_fighter_equipment_2:0 "Lavotchkine La-7"
 ALB_fighter_equipment_2_short:0 "La-7"
 ALB_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de combat soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau de conception de Lavochkin. Il s'agissait d'un développement et d'un perfectionnement du Lavochkin La-5, et du dernier d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 ALB_fighter_equipment_3:0 "Yakovlev Yak-9P"
 ALB_fighter_equipment_3_short:0 "Yak-9P"
 ALB_fighter_equipment_3_desc:0 "Cet avion était la dernière et la plus avancée version du chasseur Yak-9, qui est devenu le summum du développement parmi les chasseurs à moteur à pistons d'A. S. Yakovlev. Le Yak-9P (Produit P) apparu en 1946 était une modification du chasseur Yak-9U de construction composite. Contrairement à son prédécesseur, il avait des ailes entièrement métalliques avec des pointes elliptiques. À cette époque, la fabrication d'alliages d'aluminium à haute résistance était établie en Union soviétique, simplifiant ainsi l'exploitation des avions et augmentant leur durée de vie."

 ALB_jet_multirole_equipment_1:0 "Yakovlev Yak-23"
 ALB_jet_multirole_equipment_1_short:0 "Yak-23"
 ALB_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 ALB_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 ALB_jet_multirole_equipment_2_short:0 "MiG-15"
 ALB_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 ALB_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 ALB_jet_multirole_equipment_3_short:0 "MiG-17"
 ALB_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 ALB_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 ALB_jet_multirole_equipment_4_short:0 "MiG-19"
 ALB_jet_multirole_equipment_5:0 "Shenyang F-6"
 ALB_jet_multirole_equipment_5_short:0 "F-6"
 ALB_jet_multirole_equipment_6:0 "Chengdu F-7"
 ALB_jet_multirole_equipment_6_short:0 "F-7"
 ALB_jet_multirole_equipment_7:0 "Chengdu F-7A"
 ALB_jet_multirole_equipment_7_short:0 "F-7A"
 ALB_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-21bis"
 ALB_jet_multirole_equipment_8_short:0 "MiG-21bis"
 ALB_jet_multirole_equipment_8_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis destinés à la PVO (Force de défense aérienne) soviétique étaient équipés du système Lazur GCI, tandis que ceux destinés à l'armée de l'air soviétique étaient équipés du système Polyot ILS."


 ALB_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 ALB_heavy_fighter_equipment_1_short:0 "Yak-9" 
 
 ALB_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 ALB_jet_interceptor_equipment_1_desc:0 "Le Yak-17 a été exposé publiquement pour la première fois lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Touchino. En fonctionnement, le Yak-17 présentait la plupart des mêmes défauts que son prédécesseur, notamment une vitesse et une autonomie relativement faibles, et un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. D'un autre côté, sa manipulation était très simple et similaire à celle des chasseurs à hélices populaires tels que le Yak-3 et le Yak-9. Cela en faisait une excellente machine de transition vers les chasseurs à réaction."
 ALB_jet_interceptor_equipment_1_short:0 "Yak-17"
 #ALB_jet_interceptor_equipment_2:0 "Lavochkin La-15"
 #ALB_jet_interceptor_equipment_2_desc:0 "The Lavochkin La-15 Fantail was introduced to the Soviet Air Force in 1949. While technologically the aircraft was superior to the MiG-15, the lower manufacture cost of the MiG-15 meant that it was favored. The aircraft never saw combat and only limited deployment. The 235 aircraft that were manufactured were decommissioned by 1953. They were stripped of their engines and used in nuclear weapons testing."
 #ALB_jet_interceptor_equipment_2_short:0 "La-15"
