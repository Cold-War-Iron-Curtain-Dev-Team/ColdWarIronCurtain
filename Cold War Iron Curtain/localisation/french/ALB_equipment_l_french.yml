 ALB_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 ALB_jet_interceptor_equipment_3_short:0 "MiG-17PF" 
 
