 ALB_mbt_equipment_2:0 "T-54"
 ALB_mbt_equipment_2_short:0 "T-54"
 ALB_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Conçu en 1946 par KMBD, il est équipé d'un canon rayé de 100 mm et d'un blindage à épaisseur variable, de 60 à 205 mm. Son moteur diesel V12 de 38,88 litres et sa suspension à barres de torsion lui permettent d'atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées à travers le monde, il a été produit dans tout le bloc soviétique et a participé à tous les conflits qui y ont été liés."
 ALB_mbt_equipment_3:0 "T-55"
 ALB_mbt_equipment_3_short:0 "T-55"
 ALB_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
