 ALB_fighter_equipment_0:0 "Force aérienne d'Ushtria Popullore Shqiptare"
 ALB_fighter_equipment_0_short:0 "UPShAF"
 ALB_fighter_equipment_0_desc:0 "L'armée de l'air de l'UPSh fut fondée en avril 1952 et comptait 11 000 hommes. Sa mission était de repousser l'ennemi aux frontières du pays et de défendre l'espace aérien national. En 1970, l'UPSh remplaça ses avions soviétiques par des appareils chinois, que les Albanais n'utilisèrent que brièvement avant la rupture des relations diplomatiques entre l'Albanie et la Chine. Cette rupture rendit la maintenance encore plus difficile, l'UPSh dépendant alors de spécialistes soviétiques et chinois plus expérimentés en matière de technologie militaire."
 ALB_fighter_equipment_1:0 "Yakolev Yak-3"
 ALB_fighter_equipment_1_short:0 "Yak-3"
 ALB_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié des pilotes comme du personnel au sol. Figurant parmi les chasseurs les plus petits et les plus légers engagés par les belligérants durant le conflit, son rapport poids/puissance élevé lui conférait d'excellentes performances et il s'avéra un redoutable adversaire en combat aérien rapproché."
 ALB_fighter_equipment_2:0 "Lavochkin La-7"
 ALB_fighter_equipment_2_short:0 "La-7"
 ALB_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de chasse monoplace soviétique à moteur à pistons, développé pendant la Seconde Guerre mondiale par le bureau d'études Lavochkin. Il s'agissait d'une évolution et d'un perfectionnement du Lavochkin La-5, et du dernier modèle d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 ALB_fighter_equipment_3:0 "Yakovlev Yak-9P"
 ALB_fighter_equipment_3_short:0 "Yak-9P"
 ALB_fighter_equipment_3_desc:0 "Cet appareil était la dernière et la plus aboutie des versions du chasseur Yak-9, qui représentait le summum du développement des chasseurs à moteur à pistons d'A. S. Yakovlev. Le Yak-9P (Produit P), apparu en 1946, était une version modifiée du chasseur Yak-9U, construite en matériaux composites. Contrairement à son prédécesseur, il était doté d'ailes entièrement métalliques à extrémités elliptiques. À cette époque, la production d'alliages d'aluminium à haute résistance était bien établie en Union soviétique, ce qui simplifiait l'utilisation de l'appareil et augmentait sa durée de vie."
 ALB_jet_multirole_equipment_1:0 "Yakovlev Yak-23"
 ALB_jet_multirole_equipment_1_short:0 "Yak-23"
 ALB_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 ALB_jet_multirole_equipment_2_desc:0 "Le Mikoyan-Gourevitch MiG-15 Fagot, sans doute l'un des chasseurs les plus emblématiques de la Guerre froide, entra en service en 1947. Dès son introduction en service lors de la guerre de Corée, il participa à de nombreux conflits, où il se révéla un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une portion de la frontière sino-coréenne fut surnommée « l'allée des MiG » en raison de leur présence massive dans la région. Plus de 18 000 MiG-15 furent construits et utilisés par de nombreuses nations, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils furent retirés du service dans les années 1950, certains sont encore en service au sein de l'armée de l'air nord-coréenne."
 ALB_jet_multirole_equipment_2_short:0 "MiG-15"
 ALB_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 ALB_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot, le MiG-17 Fresco fut produit à plus de 10 000 exemplaires à partir de 1952. Construit sous licence par l'Armée de l'air chinoise (PLAAF) sous la désignation Shenyang J-5, il fut utilisé par une vingtaine de nations en Afrique, en Europe et en Asie. Son baptême du feu eut lieu en 1958, lors d'affrontements entre des MiG chinois et des F-86 Sabre nationalistes chinois au-dessus du détroit de Taïwan. Cependant, le MiG-17 fut principalement engagé pendant la guerre du Vietnam par l'Armée de l'air nord-coréenne (NVAF) et l'Armée de l'air chinoise (PLAAF), où il remporta 28 victoires aériennes. Son succès fut tel qu'il tint tête aux chasseurs supersoniques américains Phantom II, bien plus modernes, durant ce même conflit. Le MiG-17 fut généralement retiré du service dans les années 1970, mais il demeure en service, de manière limitée, dans certains pays africains et en Corée du Nord."
 ALB_jet_multirole_equipment_3_short:0 "MiG-17"
 ALB_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 ALB_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de série soviétique capable d'atteindre des vitesses supersoniques en vol horizontal. Le North American F-100 Super Sabre, un chasseur américain comparable de la série « Century Series », était également présent, bien que le MiG-19 ait principalement combattu au-dessus du Nord-Vietnam face aux McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes."
 ALB_jet_multirole_equipment_4_short:0 "MiG-19"
 ALB_jet_multirole_equipment_5:0 "Shenyang F-6"
 ALB_jet_multirole_equipment_5_short:0 "F-6"
