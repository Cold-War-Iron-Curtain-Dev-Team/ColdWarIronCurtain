 ALB_jet_multirole_equipment_7:0 "Chengdu F-7A"
 ALB_jet_multirole_equipment_7_short:0 "F-7A"
 ALB_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-21bis"
 ALB_jet_multirole_equipment_8_short:0 "MiG-21bis"
 ALB_jet_multirole_equipment_8_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres améliorations par rapport aux modèles précédents."
 ALB_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 ALB_heavy_fighter_equipment_1_short:0 "Yak-9"
 ALB_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 ALB_jet_interceptor_equipment_1_desc:0 "Le Yak-17 fut présenté au public pour la première fois lors des Journées de l'aviation soviétique de 1949, sur l'aérodrome de Tushino. En service, il présentait la plupart des défauts de son prédécesseur, notamment une vitesse et une autonomie relativement faibles, ainsi qu'un moteur peu fiable (toujours dérivé du Junkers Jumo 004 allemand) dont le démarrage était complexe. En revanche, son pilotage était très simple et comparable à celui de chasseurs à hélices populaires tels que le Yak-3 et le Yak-9. Cela en faisait un excellent appareil de transition vers les chasseurs à réaction."
 ALB_jet_interceptor_equipment_1_short:0 "Yak-17"
 ALB_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 ALB_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tous temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
