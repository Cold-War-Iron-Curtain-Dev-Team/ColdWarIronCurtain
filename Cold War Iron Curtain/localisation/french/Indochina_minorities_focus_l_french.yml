 # === CCC Focus Tree extracted from VIE_focus_l_english.yml ===
 CCC_Accept_Reunification: "Un Vietnam unifié"
 CCC_Accept_Reunification_desc: "La Cochinchine accepte de rejoindre l'État vietnamien de Bao-Dai, mettant ainsi fin à la question de l'autonomie du Sud."

 CCC_Xu_Namky: "Xu Nam-Ky"
 CCC_Xu_Namky_desc: "La Cochinchine affirme son identité méridionale et refuse de se laisser absorber par un Vietnam dominé par le Nord."

 CCC_Prepare_Annexation: "Préparation du transfert"
 CCC_Prepare_Annexation_desc: "Des préparatifs administratifs sont en cours pour transférer la gouvernance cochinchine sous l'autorité de Saigon."

 CCC_Declare_Independence: "Indépendance de la République Nam-Ky"
 CCC_Declare_Independence_desc: "Le Vietnam a lancé son ultimatum. Nous le rejetons. Nam-Ky tracera sa propre voie."

 CCC_CuongDe_Voyage: "Passage de Cuong-De"
 CCC_CuongDe_Voyage_desc: "Le prince Cuong-De, longtemps exilé au Japon, passe par la Cochinchine. Sa présence galvanise les nationalistes du Sud."

 CCC_Secular_vs_CaoDai: "La laïcité ou le Cao-Dai ?"
 CCC_Secular_vs_CaoDai_desc: "Alors que la visite de Cuong-De attise les passions politiques, les dirigeants cochinchinois doivent choisir entre une orientation nationaliste laïque et courtiser l'establishment religieux Cao-Dai."

 CCC_Destroy_Bandits: "Effacer le Delta"
 CCC_Destroy_Bandits_desc: "Les réseaux criminels Binh-Xuyen continuent de déstabiliser le delta du Mékong. En travaillant aux côtés de Saigon, nous les éliminerons."

 CCC_NgoDinh_Bros: "Les frères Ngo Dinh"
 CCC_NgoDinh_Bros_desc: "La famille Ngo Dinh, d'influents nationalistes catholiques de Hué, pourraient être de puissants alliés politiques. Nous vous proposons une offre de coopération."

 CCC_Hijack_QuocGia_cause: "Les vrais nationalistes"
 CCC_Hijack_QuocGia_cause_desc: "Saigon prétend représenter tout le Vietnam, mais nous sommes les véritables héritiers de la cause Quoc-Gia. La Cochinchine se positionnera comme le centre légitime du nationalisme vietnamien."

 CCC_Delay_Reunification_Attempts: "Retarder la pression de la réunification"
 CCC_Delay_Reunification_Attempts_desc: "Les appels à la réunification de Saigon peuvent être détournés. Nous allons bloquer, négocier et construire notre État indépendant avant qu'une décision finale ne nous soit imposée."

 CCC_Formalize_NamKy_Culture: "Codifier la culture Nam-Ky"
 CCC_Formalize_NamKy_Culture_desc: "Nam-Ky a une culture distincte façonnée par le delta du Mékong, le colonialisme français et des siècles de migration vers le sud. Nous formaliserons cette identité comme fondement de notre État."

 CCC_Codify_NamKy_Language: "La langue du sud"
 CCC_Codify_NamKy_Language_desc: "Le dialecte du sud du Vietnam véhicule depuis des générations un sens que les bureaucrates de Hanoï ne parlent pas. Nous codifions notre langue comme une marque d'indépendance."

 CCC_Intensify_AntiBacKyism: "Contre le Nord"
 CCC_Intensify_AntiBacKyism_desc: "Il faut résister à l'influence nord-vietnamienne. Culture du Sud, valeurs du Sud et gouvernance du Sud - pas domination du Nord."

 CCC_Seek_US_Recognition: "Rechercher la reconnaissance américaine"
 CCC_Seek_US_Recognition_desc: "Les États-Unis, se méfiant de l'expansion communiste en Asie du Sud-Est, pourraient être favorables à un État anticommuniste indépendant dans le sud."

 CCC_Finish_NhonDao_Constitution: "La Constitution NhonDao"
 CCC_Finish_NhonDao_Constitution_desc: "La Cochinchine rédige une constitution humaniste fondée sur les principes de NhonDao - une identité sud-vietnamienne distincte à la fois du royalisme de Saigon et du communisme de Hanoï."

 CCC_National_Identity_Question: "Qui sommes-nous ?"
 CCC_National_Identity_Question_desc: "La Cochinchine doit décider : sommes-nous une nation Nam-Ky distincte ou les véritables héritiers du nationalisme vietnamien ?"

 CCC_End_Saigon_Strikes: "Mettre fin aux grèves de Saigon"
 CCC_End_Saigon_Strikes_desc: "Les troubles ouvriers à Saigon menacent la stabilité. Le gouvernement tente de résoudre les grèves avant qu'elles ne se transforment en crise politique."

 CCC_Maintain_Xuan_Junta: "La junte perdure"
 CCC_Maintain_Xuan_Junta_desc: "Le gouvernement militaire du général Nguyen Van Xuan offre la stabilité dont la Cochinchine a besoin. La junte restera au pouvoir."

 CCC_Host_Elections: "Un vote pour le Sud"
 CCC_Host_Elections_desc: "Les élections légitimeront l'indépendance de la Cochinchine et bâtiront un mandat populaire. La démocratie, aussi fragile soit-elle, est notre voie à suivre."

 CCC_Intensify_AntiCommunism: "Sécurité anticommuniste"
 CCC_Intensify_AntiCommunism_desc: "L'infiltration communiste est une menace constante. L'appareil sécuritaire sera renforcé pour expulser les sympathisants du Viet-Minh et protéger l'État."

 CCC_Maintain_French_Ties: "Maintenir les liens avec la France"
 CCC_Maintain_French_Ties_desc: "La France reste un puissant mécène. Le maintien de liens étroits avec Paris apporte des investissements économiques, un soutien militaire et une protection diplomatique."

 CCC_End_TranVanOn: "Justice pour Tran-Van-On"
 CCC_End_TranVanOn_desc: "La mort en 1950 du leader étudiant Tran Van On lors d'une manifestation reste une blessure dans la politique cochinchine. Le gouvernement répond aux griefs qui ont déclenché les troubles."

 CCC_Undermine_VietMinh: "Saper le Viet-Minh"
 CCC_Undermine_VietMinh_desc: "Les cellules Viet-Minh opèrent dans tout le sud. Les opérations de contre-espionnage, les incitations à la défection et la police de proximité éroderont leur influence."

 CCC_Promote_Francophilia: "Un héritage culturel français"
 CCC_Promote_Francophilia_desc: "La langue, le droit et la culture françaises ont façonné la société cochinchine. Plutôt que de ressentir du ressentiment envers cet héritage, nous l'accepterons comme une source de distinction nationale."

 CCC_Suppress_BinhXuyen: "Supprimer le Binh-Xuyen"
 CCC_Suppress_BinhXuyen_desc: "Le syndicat criminel Binh-Xuyen contrôle la pègre de Saigon et extorque l'État. Leurs opérations sur notre territoire doivent cesser."

 CCC_Embrace_NhonDao: "Embrassez Nhon-Dao"
 CCC_Embrace_NhonDao_desc: "La philosophie humaniste de Nhon-Dao propose une troisième voie entre le libéralisme occidental et le communisme oriental - une voie typiquement vietnamienne pour un État typiquement méridional."

 CCC_HoiDong_TuVan_Power: "Renforcez le pouvoir du Hoi-Dong Tu-Van"
 CCC_HoiDong_TuVan_Power_desc: "Le Hoi-Dong Tu-Van, le conseil consultatif de Cochinchine, se verra accorder des pouvoirs élargis. Cet organe consultatif fait le lien entre la gouvernance militaire et la représentation civile."

 CCC_Intensify_QuanQuan: "Renforcer le Quan-Quan"
 CCC_Intensify_QuanQuan_desc: "Les forces armées cochinchines nécessitent des investissements importants. Un recrutement accru et de nouveaux équipements permettront de construire une armée capable de défendre notre indépendance."

 CCC_Modernize_Mandarin_Bureaucracy: "Réformer la bureaucratie mandarine"
 CCC_Modernize_Mandarin_Bureaucracy_desc: "L'ancien système mandarin, relique de l'époque impériale, doit être modernisé. La promotion basée sur le mérite, la rationalisation de l'administration et la réduction de la corruption renforceront l'État."
