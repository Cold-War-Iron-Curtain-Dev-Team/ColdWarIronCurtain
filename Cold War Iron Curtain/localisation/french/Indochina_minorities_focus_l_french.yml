 MEO_fortifying_the_border:0 "Fortifier la frontière"
 MEO_fortifying_the_border_desc:0 "Sera ajouté"
 MEO_receive_aids_from_pla:0 "Recevoir l'aide du PLA"
 MEO_receive_aids_from_pla_desc:0 "sera ajouté"
 MEO_prepare_operations_against_the_sip_song_tai:0 "Préparer les opérations contre le Sip Song Tai"
 MEO_prepare_operations_against_the_sip_song_tai_desc:0 "sera ajouté"
 MEO_approvethehoangfamilystakeover:0 "Approuver le rachat par la famille Hoang"
 MEO_stay_the_course:0 "Gardez le cap"
 MEO_stay_the_course_desc:0 "Le soulèvement est passé et la maison Hoang n'a pas pris le plateau. Quels que soient ses défauts, le pacte conclu avec Hanoï pendant la résistance a permis à Dong Van de traverser des saisons pires que celle-ci, et les hommes qui l'ont conclu sont toujours en vie pour le défendre. Nous ne changerons rien, ne promettreons rien et ne provoquerons personne - et nous montrerons aux cols que les hauts plateaux peuvent être gouvernés sans couronne et sans guerre."
 MEO_approvethehoangfamilystakeover_desc:0 "sera ajouté"
 MEO_accept_the_unification_with_vietnam:0 "Accepter l'unification avec le Vietnam"
 MEO_accept_the_unification_with_vietnam_desc:0 "sera ajouté"
 MEO_creation_of_the_autonomous_zone_of_thaimeo:0 "Création de la Zone Autonome de Tai-Meo"
 MEO_creation_of_the_autonomous_zone_of_thaimeo_desc:0 "sera ajouté"
 MEO_struggle_for_meo_independence:0 "Lutte pour l'indépendance de Meo"
 MEO_struggle_for_meo_independence_desc:0 "sera ajouté"
 MEO_question_of_national_autonomy:0 "La question de notre autonomie nationale"
 MEO_question_of_national_autonomy_desc:0 "La guerre dans le delta est décidée et la question du Nord avec elle. Tôt ou tard, Hanoï devra dire clairement ce que seront les hauts plateaux : une région qui se gouverne elle-même sous le drapeau de la république, ou des provinces administrées comme les autres. Nous préférons poser la question nous-mêmes, alors que nos milices détiennent encore les laissez-passer et que notre réponse a encore du poids, plutôt que d'attendre qu'un ministère y réponde à notre place.\n\n§YHanoï décidera, et sa réponse déterminera la route que prendra le plateau.§!"
 MEO_the_duong_trung_nhan_revolt:0 "La révolte de Duong Trung Nhan"
 MEO_the_duong_trung_nhan_revolt_desc:0 "La colonie tient depuis quatre ans, et quatre années ont été suffisamment longues pour que ses ennemis se regroupent. Duong Trung Nhan a rassemblé les notables mécontents, les passeurs frontaliers et les bandes Tho phi en un seul mouvement, et cette fois, le roi tribal Duong revendique sa propre couronne Hmong plutôt que celle d'un autre homme. Le plateau doit choisir entre l'aménagement dont il dispose et celui qui lui est proposé."
 MEO_combat_the_duong_trung_nhan_revolt:0 "Combattre la révolte de Duong Trung Nhan"
 MEO_combat_the_duong_trung_nhan_revolt_desc:0 "sera ajouté"
 MEO_solidify_ho_chi_minh_thought:0 "Solidifier la pensée de Hô Chi Minh"
 MEO_solidify_ho_chi_minh_thought_desc:0 "sera ajouté"
 MEO_permitpavnsreinforcements:0 "Permettre les renforts du PAVN"
 MEO_permitpavnsreinforcements_desc:0 "sera ajouté"
 MEO_proclaim_duong_trung_nhan_as_king_of_the_meo:0 "Proclamer Duong Trung Nhan comme roi des Meo"
 MEO_proclaim_duong_trung_nhan_as_king_of_the_meo_desc:0 "Le soulèvement de 1959 a ouvert la voie au roi tribal Duong pour abandonner la colonie communiste vietnamienne, prendre la couronne qui a été refusée à sa famille pendant trois générations et restaurer une monarchie Hmong dans les hauts plateaux."
