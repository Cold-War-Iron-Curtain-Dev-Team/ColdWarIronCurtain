l_french:
 cwu.1.t:0 "Un soulèvement à Berlin !"
 cwu.1.d:0 "Aujourd'hui, les travailleurs des usines de la RDA ont lancé une manifestation pour de meilleures conditions de travail et de meilleurs salaires. La situation a vite empiré et les manifestants ont pris les armes et ont déclaré que la RDA serait dissoute et réunifiée avec la FGR. Le gouvernement de la RDA est encore en train de décider quoi faire contre la rébellion."
 cwu.1.a:0 "Combattez les traîtres capitalistes"
 cwu.1.b:0 "Cédez à leurs demandes"
cwu.2.t:0 "[GetNewspaperHeader]Un soulèvement en Allemagne de l'Est"
 cwu.2.d:0 "Aujourd'hui, la radio du secteur américain, basée à Berlin-Ouest, a fait part au monde de la nouvelle des manifestations en Allemagne de l'Est. Ils ont rapporté que les travailleurs des usines de l'Allemagne de l'Est avaient arrêté de travailler et se sont mis en grève pour des réformes démocratiques et la réunification avec l'Allemagne de l'Ouest. Les armées est-allemande et soviétique ont rapidement combattu les manifestants et les rebelles démocrates n'ont plus été vus depuis."
 cwu.2.a:0 "Une révolution !"
 cwu.2.b:0 "Une rébellion dans le Pacte ?"
 cwu.2.desc:0 "Aujourd'hui, la radio du secteur américain, basée à Berlin-Ouest, a fait part au monde de la nouvelle des manifestations en Allemagne de l'Est. Ils ont rapporté que les travailleurs des usines de l'Allemagne de l'Est avaient arrêté de travailler et se sont mis en grève pour des réformes démocratiques et la réunification avec l'Allemagne de l'Ouest. La RDA s'est conformée et a accepté de commencer bientôt à adopter des formes démocratiques. Ils ont également convenu d'entamer des négociations avec l'Allemagne de l'Ouest sur la création d'un État unifié. Le gouvernement soviétique a déclaré que cela n'arriverait pas et que tous les dirigeants est-allemands qui soutiennent le gouvernement communiste ripostent. Une guerre civile va sûrement bientôt éclater."
 cwu.4.t:0 "Un soulèvement à Poznan !"
 cwu.4.d:0 "Aujourd'hui, les travailleurs d'une usine sidérurgique de Poznan se sont mis en grève pour réclamer de meilleures réformes au sein du gouvernement. La nouvelle s'est vite répandue et maintenant d'autres manifestants ont rejoint la grève et même la résistance anticommuniste, le Klub Krzywego Kola (Club de la roue biaisée) se sont armés ainsi que les manifestants pour se soulever contre le gouvernement communiste polonais pour avoir trahi le peuple et s'être incliné devant les Soviétiques plutôt que devant l'Occident."
 cwu.4.a:0 "Déployer un corps de sécurité interne"
 cwu.4.b:0 "Cédez à leurs demandes"
cwu.5.t:0 "[GetNewspaperHeader]Un soulèvement en Pologne"
 cwu.5.d:0 "Aujourd'hui, les métallurgistes polonais de Poznan ont fait grève et se sont prononcés en faveur de réformes démocratiques et de la dissolution du gouvernement communiste. Des groupes rebelles anticommunistes locaux ont armé les manifestants et se sont joints à la rébellion. Les Polonais déployèrent bientôt le Corps de sécurité intérieure et les Soviétiques envoyèrent l'armée pour faire face à eux. Le bilan de la bataille s'élevait entre 57 et des centaines de personnes. Les Polonais et les Soviétiques ont déclaré que tout sentiment anticommuniste devait être réprimé."
 cwu.5.a:0 "Une révolution !"
 cwu.5.b:0 "Une autre rébellion dans le Pacte de Varsovie ?"
 cwu.5.desc:0 "Aujourd'hui, les métallurgistes polonais de Poznan ont fait grève et se sont prononcés en faveur de réformes démocratiques et de la dissolution du gouvernement communiste. Des groupes rebelles anticommunistes locaux ont armé les manifestants et se sont joints à la rébellion. Les communistes polonais se sont vite rendu compte que le système communiste ne fonctionnait pas et ont commencé à signer des réformes démocratiques. Les sympathisants communistes soviétiques et polonais ont déclaré que cela signifiait la guerre contre la nouvelle République polonaise."
 cwu.7.t:0 "Un soulèvement à Budapest !"
 cwu.7.d:0 "Les manifestants se sont rassemblés à l'extérieur de Budapest, affirmant qu'ils veulent des réformes démocratiques, que la Hongrie rejoigne l'ONU et que la liberté est pour tous. Cependant, la protestation est devenue violente après qu'une station de radio locale a été attaquée parce qu'elle voulait diffuser leur révolution. Que devrait faire le gouvernement hongrois ?"
 cwu.7.a:0 "Déployer l'armée et demander l'intervention soviétique"
 cwu.7.b:0 "Lancer des réformes démocratiques"
cwu.8.t:0 "[GetNewspaperHeader]Un soulèvement en Hongrie"
 cwu.8.d:0 "Plus tôt cette semaine, un groupe massif de manifestants a demandé que le gouvernement hongrois mette en oeuvre des réformes démocratiques, que la Hongrie soit admise à l'ONU et que la liberté pour tous soit assurée. Le gouvernement hongrois a répondu non et a demandé que les protestations cessent. Les manifestations n'ont pas commencé et n'ont fait qu'empirer. Les villes autour de la Hongrie ont choisi leur camp entre la Hongrie démocratique et la Hongrie communiste. L'armée hongroise a été déployée aux côtés de l'armée soviétique."
 cwu.8.a:0 "Une révolution !"
 cwu.8.b:0 "Combien y en aura-t-il ?"
 cwu.8.desc:0 "Plus tôt cette semaine, un groupe massif de manifestants a demandé que le gouvernement hongrois mette en oeuvre des réformes démocratiques, que la Hongrie soit admise à l'ONU et que la liberté pour tous soit assurée. Le gouvernement hongrois était divisé sur cette question, mais les réformes démocratiques ont commencé et la dissolution du gouvernement communiste a commencé. Le gouvernement soviétique a déclaré qu'il ne tolérerait pas une telle situation et que le Pacte de Varsovie devait intervenir. Il semble qu'une guerre civile éclate bientôt en Hongrie."
 cwu.10.t:0 "Un soulèvement à Prague !"
 cwu.10.d:0 "Une révolution a éclaté à Prague. Ils ont déclaré vouloir davantage de réformes démocratiques et le renversement du gouvernement communiste. Le gouvernement est partagé quant à la décision et nous devrions décider quoi faire."
 cwu.10.a:0 "Retirez les traîtres du gouvernement !"
 cwu.10.b:0 "Signez les réformes démocratiques"
cwu.11.t:0 "[GetNewspaperHeader]Une révolution en Tchécoslovaquie ?"
 cwu.11.d:0 "Hier soir, les forces du Pacte de Varsovie ont franchi la frontière tchécoslovaque. L'opération Danube est entrée en vigueur et 200 000 soldats et responsables du Pacte de Varsovie, accompagnés de 2 000 chars, ont traversé la frontière et envahi la Tchécoslovaquie. Alexander Dubcek a été destitué et est désormais remplacé par Gustáv Husák à la tête du parti. Les rebelles ont été dispersés et tentent de se rallier pour ralentir les envahisseurs. Une révolution a commencé à Prague et va bientôt s'étendre."
 cwu.11.a:0 "Révolution!"
 cwu.11.b:0 "Combien y aura-t-il encore de révolutions ?"
 cwu.11.desc:0 "Hier soir, les forces du Pacte de Varsovie ont franchi la frontière tchécoslovaque. L'opération Danube est entrée en vigueur et 200 000 soldats et responsables du Pacte de Varsovie, accompagnés de 2 000 chars, ont traversé la frontière et envahi la Tchécoslovaquie. Alexander Dubcek a déclaré au peuple de lutter contre les envahisseurs communistes et a ordonné aux militaires de tirer sur les envahisseurs. La Tchécoslovaquie a été renversée et une guerre civile a éclaté entre un gouvernement démocratique et un gouvernement communiste. L'invasion transformera probablement la Tchécoslovaquie en zone de guerre."
 cwu.13.t:0 "Manifestations à Gdansk !"
 cwu.13.d:0 "Après une mauvaise année de récolte, les prix des denrées alimentaires ont grimpé en flèche. Les manifestants polonais ont déclaré que cela ne fonctionnerait pas tant que les prix des denrées alimentaires ne baisseraient pas. Ils réclament désormais des réformes démocratiques et le retrait du leader. Que devons-nous faire ?"
 cwu.13.a:0 "Déployer l'armée et la milice populaire"
 cwu.13.b:0 "Suivez les demandes"
cwu.14.t:0 "[GetNewspaperHeader]Grandes manifestations en Pologne"
 cwu.14.d:0 "Il y a quelques jours, des manifestants se sont rassemblés dans les villes du nord de la Pologne pour protester contre le fait que le gouvernement polonais ne peut pas faire augmenter les prix des denrées alimentaires après une mauvaise récolte. Cela a provoqué des protestations en faveur de réformes au sein du gouvernement. Les Polonais ont envoyé l'armée et la milice populaire pour faire face aux manifestants. Des combats sporadiques ont éclaté et les rebelles polonais semblent presque vaincus."
 cwu.14.a:0 "La Pologne n'est pas encore perdue."
 cwu.14.b:0 "J'espère qu'il y aura bientôt la paix."
 cwu.14.desc:0 "Il y a quelques jours, des manifestants se sont rassemblés dans les villes du nord de la Pologne pour protester contre le fait que le gouvernement polonais ne peut pas faire augmenter les prix des denrées alimentaires après une mauvaise récolte. Cela a provoqué des protestations en faveur de réformes au sein du gouvernement. Le gouvernement polonais a accepté et a commencé à élaborer de nouvelles réformes démocratiques. Les membres du Parti communiste n'étaient pas d'accord et ont appelé les Polonais à mettre fin à toutes les réformes."
 cwu.16.t:0 "Un soulèvement à Zagreb !"
 cwu.16.d:0 "Les nationalistes croates se sont rassemblés à Zagreb pour réclamer davantage de libertés politiques et économiques pour la nation autonome de Croatie. Les nationalistes sont devenus violents ces derniers jours et les rumeurs d'une révolution se multiplient. Que devons-nous faire ?"
 cwu.16.a:0 "Déployez l'armée!"
 cwu.16.b:0 "Permettre à la nation croate de se former"
cwu.17.t:0 "[GetNewspaperHeader]Un soulèvement en Yougoslavie"
 cwu.17.d:0 "Il y a quelques jours, les nationalistes croates s'étaient rassemblés à Zagreb pour réclamer davantage de libertés politiques et économiques pour la Croatie. Cela éclata rapidement lorsque des nationalistes attaquèrent une garnison yougoslave dans la ville. L'armée yougoslave a été déployée et les nationalistes ripostent. Que va-t-il se passer en Yougoslavie ?"
 cwu.17.a:0 "La rébellion sera réprimée."
 cwu.17.b:0 " Est-ce que cela va s'étendre aux autres États ?"
 cwu.17.desc:0 "Il y a quelques jours, les nationalistes croates s'étaient rassemblés à Zagreb pour réclamer davantage de libertés politiques et économiques pour la Croatie. Le gouvernement yougoslave accorda bientôt une Croatie indépendante. C'est une nouvelle ère pour la région des Balkans. La Croatie a désormais le choix. Suivre la Yougoslavie et devenir un État satellite, ou se tourner vers l'Occident pour devenir une nation démocratique. Quoi qu'il arrive, la région changera sûrement."
 cwu.19.t:0 "Un soulèvement au Kosovo !"
 cwu.19.d:0 "Depuis quelques semaines, des étudiants de la province autonome du Kosovo manifestent pour les libertés au Kosovo. Cela a amené les manifestants à devenir plus nationalistes et à réclamer un État indépendant au Kosovo. Des rumeurs parlent d'une révolution si nous ne faisons rien. Que devons-nous faire ?"
 cwu.19.a:0 "Arrêtez cette rébellion !"
 cwu.19.b:0 "Accordez-leur de plus grandes libertés."
cwu.20.t:0 "[GetNewspaperHeader]Un soulèvement au Kosovo"
 cwu.20.d:0 "Depuis quelques semaines, des étudiants de la province autonome du Kosovo manifestent pour les libertés au Kosovo. Cela a amené les manifestants à devenir plus nationalistes et à réclamer un État indépendant au Kosovo. Après quelques appels supplémentaires à l'indépendance, le gouvernement yougoslave en a eu assez et a envoyé l'armée pour résoudre le problème. Les rebelles sont en plein désarroi et la rébellion semble bientôt terminée."
 cwu.20.a:0 "Nous devons garder le pays uni."
 cwu.20.b:0 "Y aura-t-il d'autres révolutions ?"
 cwu.20.desc:0 "Depuis quelques semaines, des étudiants de la province autonome du Kosovo manifestent pour les libertés au Kosovo. Cela a amené les manifestants à devenir plus nationalistes et à réclamer un État indépendant au Kosovo. Il y avait même des rumeurs de révolution. Cela a amené le gouvernement yougoslave à accorder au Kosovo le statut d'État indépendant. Le gouvernement kosovar a désormais la possibilité de choisir sa propre voie. Que va-t-il se passer ?"
 cwu.22.t:0 "Un soulèvement en Slovénie !"
 cwu.22.d:0 "Après un mauvais trimestre économique, nous avons eu du mal à relancer notre économie. Les travailleurs slovènes se sont mis en grève, ce qui a aggravé la situation. L'État autonome de Slovénie est en proie à des troubles croissants et une rébellion semble possible. Que devons-nous faire face à la crise ?"
 cwu.22.a:0 "Déployer les garnisons yougoslaves"
 cwu.22.b:0 "Accordez-leur « l'indépendance»"
cwu.23.t:0 "[GetNewspaperHeader]Un soulèvement en Slovénie"
 cwu.23.d:0 "Après un mauvais trimestre économique pour la Yougoslavie, la Yougoslavie a eu du mal à se redresser. Les travailleurs slovènes se sont mis en grève, ce qui a aggravé la situation. L'État autonome de Slovénie est devenu instable et un groupe de nationalistes appelant à l'indépendance a pris le pouvoir. Ils ont déclaré leur indépendance de la Yougoslavie, mais l'armée yougoslave a repoussé la rébellion en quelques jours."
 cwu.23.a:0 "Ce pays devrait rester uni."
 cwu.23.b:0 "Les Balkans sont une autre poudrière."
 cwu.23.desc:0 "Après un mauvais trimestre économique pour la Yougoslavie, la Yougoslavie a eu du mal à se redresser. Les travailleurs slovènes se sont mis en grève, ce qui a aggravé la situation. L'État autonome de Slovénie est devenu instable et un groupe de nationalistes appelant à l'indépendance a pris le pouvoir. Ils ont déclaré leur indépendance de la Yougoslavie, et les Yougoslaves ne peuvent pas se permettre une crise économique ni une rébellion. Ils ont accordé l'indépendance à la Slovénie. La Slovénie a désormais le choix entre se tourner vers l'Ouest, vers l'Est ou suivre ses anciens dirigeants yougoslaves."
 cwu.25.t:0 "Soulèvements communistes"
 cwu.25.d:0 "Une deuxième urgence malaise a commencé en Malaisie après que les rebelles communistes ont obtenu davantage de soutien de la part des nations communistes. Ils ont gagné une partie du territoire et progressent. Nous avons besoin d'un nouveau groupe de travail du Commonwealth pour nous aider. Nous réprimerons à nouveau cette rébellion."
 cwu.25.a:0 "Battons-nous"
cwu.26.t:0 "[GetNewspaperHeader]La deuxième urgence malaisienne"
 cwu.26.d:0 "Une deuxième urgence malaise a commencé en Malaisie après que les rebelles communistes ont obtenu davantage de soutien de la part des nations communistes. Ils ont gagné une partie du territoire et progressent. Il se peut qu'un nouveau groupe de travail du Commonwealth puisse vous aider."
 cwu.26.a:0 "Le combat est la réponse"
 cwu.26.b:0 "Le communisme en hausse ?"
 smk.1.d:0 "Les habitants des Moluques ont toujours été résistants à la domination de Java. Cependant, face à une instabilité croissante, le sud des Moluques a déclaré son indépendance sous le nom de République des Moluques du Sud. Comment allons-nous gérer cela ?"
 smk.1.b:0 "Accepter leur indépendance"
