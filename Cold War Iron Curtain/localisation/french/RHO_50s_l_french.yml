 ###CHARACTER DESC###
 POLITICS_GODFREY_HUGGINS_DESC: "Godfrey Huggins était un leader, un héros et sans aucun doute une figure notable de la Rhodésie.\n\nHuggins est né à « Dane Cottage » sur Knoll Road à Bexley, dans le nord du Kent, en Angleterre. Il était le deuxième enfant et le fils aîné d'un agent de change. La famille a ensuite déménagé à « Shore House », une propriété construite par son père à Sevenoaks, une ville située à 27 miles de Londres. Huggins a fait ses études à Brunswick House, une école préparatoire à Hove, puis a fréquenté Sutherland House, une autre école similaire à Folkestone.\n\nIl entra en politique en 1924 en tant que membre du parti de Rhodésie et fut élu sans opposition dans la circonscription de Salisbury Nord à l'Assemblée législative de Rhodésie du Sud de la colonie autonome nouvellement créée. En 1932, il rompt avec le gouvernement du Parti Rhodésie, dirigé par Howard Unwin Moffat, lorsqu'il introduit une mesure visant à réduire les salaires de la fonction publique de 10 %. Cette réduction était particulièrement impopulaire dans la circonscription de Huggins, qui comptait un nombre important de fonctionnaires. Incapable de voter contre le gouvernement sans provoquer des élections générales anticipées - ce qu'il voulait éviter puisqu'une élection était déjà prévue pour l'année suivante - Huggins a voté pour le projet de loi. Le lendemain, il a traversé le parquet pour rejoindre le Parti réformiste nouvellement formé, qui l'a nommé chef de l'opposition. Bien que le Parti réformiste soit perçu par beaucoup en Rhodésie comme un parti de gauche, Huggins présente un Cabinet prudemment conservateur après avoir pris le pouvoir en 1933.\n\nCependant, le gouverneur par intérim a refusé de dissoudre l'Assemblée, affirmant qu'il lui restait de nombreuses années de mandat et que le gouvernement n'avait pas été vaincu. Huggins a persuadé la majorité de l'exécutif du Parti réformiste de suspendre la constitution du parti pour permettre la formation d'un gouvernement national le 17 septembre. Il a ensuite formé le Parti uni avec Fynn et a demandé une seconde fois une dissolution basée sur le changement d'alignement du parti. Cette fois, le gouverneur par intérim a accepté."
 ###IDEAS###
 RHO_Booming_Economy: "Une économie en plein essor"
 RHO_Booming_Economy_desc: "La fin de la Seconde Guerre mondiale a entraîné une augmentation remarquable de la production économique et de la productivité en Rhodésie du Sud. Contrairement à de nombreux pays lourdement touchés par la guerre, la Rhodésie du Sud a été largement épargnée par un conflit direct, ce qui a permis à son économie de prospérer pendant cette période.\n\nUn nombre important de Rhodésiens se sont portés volontaires pour servir à divers titres sur le front occidental. Même si bon nombre de ces personnes courageuses sont rentrées chez elles après la guerre, leurs expériences et leurs sacrifices ont contribué à susciter un sentiment de fierté et de résilience au sein de la nation. Malheureusement, on ne peut pas en dire autant de nombreux autres pays qui ont subi des pertes et des perturbations dévastatrices pendant la guerre."
