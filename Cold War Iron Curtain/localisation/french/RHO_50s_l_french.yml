 Rhodesia_Political_Situation_category: "La situation politique rhodésienne"
 Rhodesia_Political_Situation_category_desc: "\n\n\n\n\n£Rhodesia_Political_1\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nNominalement un [ROOT.GetGovernmentTypes], le [ROOT.GetName] a été créé en 1923 par la British South African Company. Lors d'un référendum de 1922, les Rhodésiens du Sud ont choisi un gouvernement responsable au sein de l'Empire britannique plutôt que l'incorporation dans l'Union sud-africaine.\n\nDepuis lors, la Rhodésie a été gouvernée comme n'importe quelle autre colonie du Royaume-Uni, le monde entier étant désormais plongé dans une guerre froide. L'alignement politique de la Rhodésie changera à l'avenir, pour le meilleur ou pour le pire."
