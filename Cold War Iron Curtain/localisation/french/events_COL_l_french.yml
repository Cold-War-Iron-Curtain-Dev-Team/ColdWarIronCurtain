l_french:


  COL_COUP.1.t:0 "Les libéraux préparent un coup d'État !"
  COL_COUP.1.d:0 "Des rapports ont commencé à faire état de rencontres clandestines entre intellectuels libéraux, officiers militaires désillusionnés et envoyés étrangers. Ce qui a commencé comme une dissidence discrète s'est transformé en un mouvement coordonné. Des tracts prônant une réforme constitutionnelle sont distribués dans l'ombre et des émissions anonymes appellent au rétablissement de la démocratie. Le gouvernement regarde avec inquiétude alors que les couloirs du pouvoir tremblent d'incertitude. Un coup d'État, autrefois impensable, semble désormais inévitable."
  COL_COUP.1.a:0 "CERTAINEMENT PAS!"

  COL_COUP.2.t:0 "Ospina Pérez a dissous le Congrès !"
  COL_COUP.2.d:0 "Les libéraux, qui détenaient un contrôle majoritaire au Congrès, ont entamé une procédure de destitution contre la présidente Ospina Pérez. En réponse, Ospina Pérez a dissous le Congrès, créant une dictature conservatrice."
  COL_COUP.2.a:0 "CERTAINEMENT PAS!"




  COL_Vio.1.t:0 "Révolte des libéraux et des communistes !"
  COL_Vio.1.d:0 "Jorge Elicer Gaitan était le candidat libéral préféré, considéré comme le vainqueur le plus probable des élections, jusqu'à son assassinat aujourd'hui. Des émeutes et des pillages ont éclaté, faisant une centaine de morts dans le chaos à Bogota. Connu sous le nom de « Bogotazo », le gouvernement conservateur a immédiatement imputé la responsabilité aux communistes colombiens. Les habitants des campagnes ont commencé à prendre les armes suite au chaos qui régnait dans la capitale, provoquant une guerre civile qui a duré une décennie."
  COL_Vio.1.a:0 "Chaos en Colombie ! Partisans à la campagne !"
  COL_Vio.1.b:0 "Non, nous sommes des libéraux !"
  COL_Vio.1.c:0 "Unissez-vous et combattez ! Nos camarades !"
  
  COL_Vio.2.t:0 "Capitaine de l'Armée de l'Air Alfredo Silva !"
  COL_Vio.2.d:0 "Le Parti libéral a décidé d'organiser un coup d'État militaire, prévu pour le 25 novembre 1949. Cependant, de nombreux membres du parti ont décidé que ce n'était pas une bonne idée et l'ont annulé. Un conspirateur, le capitaine de l'armée de l'air Alfredo Silva, de la ville de Villavicencio, n'a pas été informé de l'abandon du projet et l'a exécuté. Après avoir rallié la garnison de Villavicencio, il désarme la police et prend le contrôle de la ville."
  COL_Vio.2.a:0 "Récupérez-le dès que possible !"
 



  COL_POW.1.t:0 "Le raid a été effectué avec succès !" 
  COL_POW.1.d:0 "Waouh !"
  COL_POW.1.a:0 "Battez les adversaires !"
