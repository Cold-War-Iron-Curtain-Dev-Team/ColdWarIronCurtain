l_french:
 ISR_ben_gurion_tenure:0 "Mandat de Ben Gourion"
 ISR_ben_gurion_tenure_desc:0 "David Ben Gourion, leader de longue date du mouvement sioniste, a été élu Premier ministre pour diriger le pays à travers ces premières années tumultueuses de l'indépendance. "
 ISR_establish_the_mossad:0 "Créer le Mossad"
 ISR_establish_the_mossad_desc:0 "Beaucoup cherchent à saper et à détruire l'État juif de l'intérieur et de l'extérieur. Nous avons besoin d'une agence dédiée à empêcher que cela se produise."
 ISR_establish_the_chief_rabbinate_of_israel:0 "Établir le Grand Rabbinat d'Israël"
 ISR_establish_the_chief_rabbinate_of_israel_desc:0 "Cela fait longtemps que nous n'avons pas établi une institution nationale centralisée pour observer les affaires religieuses juives et le Rabbinat deviendra cette institution."
 ISR_the_egyptian_fedayeen_border_issues:0 "Les problèmes frontaliers entre l'Égypte et les Fedayin"
 ISR_the_israeli_kalkalah:0 "La Kalkalah israélienne"
 ISR_the_israeli_kalkalah_desc:0 "La Kalkalah israélienne, ou économie israélienne, doit être révisée. Notre pays est déchiré par la guerre et des terres vides mais arables et nous devons en tirer le meilleur parti."
 ISR_the_israeli_defense_forces:0 "Les Forces de défense israéliennes"
 ISR_the_israeli_defense_forces_desc:0 "L'armée israélienne est composée des meilleurs membres des nombreux combattants de la liberté qui ont combattu pour l'autodétermination juive sur la Terre d'Israël et qui assurent la protection du nouvel État juif."
 ISR_the_question_of_jerusalem:0 "La question de Jérusalem"
 ISR_the_question_of_jerusalem_desc:0 "Maintenant que nous contrôlons la majeure partie de Jérusalem, il est temps d'y déplacer notre capitale pour rappeler au monde et à notre peuple que le coeur de l'histoire juive est et a toujours été à Sion et à Jérusalem."
 ISR_expand_the_arba_nekudot:0 "Développez l'Arba Nekudot"
 ISR_expand_the_arba_nekudot_desc:0 "L'expansion de l'Arba Nekudot ou des « Quatre Points » est vitale pour renforcer nos relations avec le monde religieux douteux qui ne fait toujours pas confiance au mouvement sioniste. Nous devons leur montrer notre meilleure volonté de les intégrer dans la nouvelle société israélienne."
 ISR_the_israeli_navy:0 "La marine israélienne"
 ISR_the_israeli_navy_desc:0 "La marine israélienne a été créée pour protéger nos eaux d'Eliat à Haïfa."
 ISR_shoah_reparations_department:0 "Département des Réparations de la Shoah"
 ISR_shoah_reparations_department_desc:0 "Ce qui a été fait à notre peuple lors de la Shoah, de l'Holocauste, est impardonnable. Nombreux sont ceux qui réclament des représailles face à l'impunité généralisée dont jouissent ceux qui ont échappé à la justice. Israël doit attirer sur lui la colère de notre peuple, où qu'il se trouve."
 ISR_become_a_un_member:0 "Devenez membre de l'ONU"
 ISR_become_a_un_member_desc:0 "Nous sommes un État légitime comme les autres et méritons un siège aux Nations Unies."
 ISR_deal_with_the_olim_crisis:0 "Faire face à la crise des Olim"
 ISR_deal_with_the_olim_crisis_desc:0 "Les Olim, également appelés immigrants, arrivent en masse en Israël. Notre pays ne peut pas accueillir autant de réfugiés venant de toute l'Afrique du Nord et des pays musulmans et notre société pourrait s'effondrer."
 ISR_form_the_histadrut:0 "Former la Histadrout"
 ISR_form_the_histadrut_desc:0 "L'Histadrout est l'Union la plus grande et la plus puissante d'Israël. Créée en accord avec le Mapai, l'Union veillera à ce que chaque Israélien qui travaille dur soit correctement représenté" 
 ISR_increase_state_oversight_of_kibbutzim:0 "Renforcer la surveillance de l'État sur les kibboutzim"
 ISR_increase_state_oversight_of_kibbutzim_desc:0 "Maintenant qu'il a centralisé les syndicats, il est temps d'exercer une certaine surveillance sur le mouvement des kibboutz. Leur autonomie est trop grande et leur production agricole pourrait bénéficier à la société israélienne dans son ensemble."
 ISR_promote_the_kibbutzim:0 "Promouvoir les kibboutzim"
 ISR_promote_the_kibbutzim_desc:0 "Le mouvement des Kibboutzim est une idée vitale et centrale de la fondation d'Israël. Afin de rendre cette terre prospère, nous devons la racheter de ses déficiences passées pour en faire une terre fertile, et les kibboutzim peuvent nous aider à nous rapprocher de cet idéal."
 ISR_the_shuna_negotiations:0 "Les négociations Shuna"
 ISR_offer_cooperation_to_king_abdullah:0 "Offrir sa coopération au roi Abdallah"
 ISR_the_corridors_idea:0 "L'idée des couloirs"
 ISR_the_tsena_decree:0 "Le décret Tsena"
 ISR_the_tsena_decree_desc:0 "Tsena, ou Austérité, sera une période d'ajustements économiques et sociaux que notre pays devra traverser afin de résoudre le problème des nombreux Olim venus en Terre d'Israël."
 ISR_the_muzan_policy:0 "La politique de Muzan"
 ISR_the_muzan_policy_desc:0 "Muzan ou Balance est une politique visant à briser le marché noir tout en l'autorisant en même temps. Notre objectif n'est pas de les étouffer mais en même temps de maintenir une régulation ferme de notre économie."
 ISR_permit_the_shuk_shuchor:0 "Autoriser le Shuk Shuchor"
 ISR_permit_the_shuk_shuchor_desc:0 "Le Shuk Shuchor, ou marché noir, a profité à notre peuple pendant la lutte pour l'indépendance. Maintenant, cela peut nous être bénéfique si nous le laissons simplement se frayer un chemin dans notre économie pour remplacer certains des problèmes que cette période Tsena apportera." 
 ISR_empower_the_mateh_lemilhama_bashuk:0 "Autonomisez le Mateh LeMilhama Beshuk"
 ISR_establish_regional_offices:0 "Créer des bureaux régionaux"
 ISR_operation_magic_carpet:0 "Opération Tapis Magique"
 ISR_ministry_of_aliyah:0 "Ministère de l'Aliya"
 ISR_support_the_jewish_agency_for_israel:0 "Soutenez l'Agence Juive pour Israël"
 ISR_the_law_of_return:0 "La loi du retour"
 ISR_the_law_of_return_desc:0 "La Loi du Retour offrira aux membres de la diaspora juive un chemin facile vers la citoyenneté israélienne."
 ISR_operation_ezrah_and_nehemiah:0 "Opération Ezrah et Néhémie"
 ISR_reinforce_the_secular_nature:0 "Renforcer la nature laïque"
 ISR_protect_the_status_quo:0 "Protéger le statu quo"
 ISR_abolish_the_millet_system:0 "Abolir le système du millet"
 ISR_allow_businesses_during_shabbat:0 "Autoriser les entreprises pendant le Shabbat"
 ISR_end_subsidizes_to_yeshivot:0 "Mettre fin aux subventions aux Yeshivot"
 ISR_develop_bnei_brak:0 "Développer Bnei Brak"
 ISR_develop_bnei_brak_desc:0 "Pour éviter que les Haredim ne s'emparent de cette ville, nous devons la développer avec des investissements et une promotion concis."
 ISR_grant_autonomy_to_bnei_brak:0 "Accorder l'autonomie à Bnei Brak"
 ISR_grant_autonomy_to_bnei_brak_desc:0 "Nous devons accorder une autonomie aux haredim de Bnei Brak pour qu'ils puissent gérer eux-mêmes leurs problèmes."
 ISR_force_haredim_into_the_workforce:0 "Forcer les haredim à entrer sur le marché du travail"
 ISR_reinforce_the_millet_system:0 "Renforcer le système Millet"
 ISR_reinforce_the_millet_system_desc:0 "Le système Millet, établi par le Ottomans pour permettre aux groupes religieux de décider de leurs propres affaires, continuera à être un système important pour notre pays."
 ISR_secularize_public_life_for_the_hiloni:0 "Séculariser la vie publique pour les Hiloni"
 ISR_secularize_public_life_for_the_hiloni_desc:0 "Les Hiloni en ont assez des railleries de la vie religieuse. Nous garderons la vie urbaine aussi laïque que possible."
 ISR_the_question_of_jewish_conversion:0 "La question de la conversion juive"
 ISR_the_question_of_jewish_conversion_desc:0 "La conversion juive doit être un processus strict observé par le rabbinat et l'orthodoxie juive."
 ISR_maintain_a_united_rabbinate:0 "Maintenir un rabbinat uni"
 ISR_maintain_a_united_rabbinate_desc:0 "Pourquoi perdre notre temps avec différents rabbinats alors que là-bas nous sommes tous juifs ?" 
 ISR_make_ashkenazim_and_sephardim_rabbinates:0 "Créer des rabbinats ashkénazes et sépharades"
 ISR_make_ashkenazim_and_sephardim_rabbinates_desc:0 "Les Séfaradim ont besoin que leurs propres traditions soient suivies ainsi que les Ashkénazes, soyons clairs."
 ISR_establish_the_sherut_leumi:0 "Établir le Sherut Leumi"
 ISR_establish_the_sherut_leumi_desc:0 "La clémence en matière de conscription militaire ne doit pas signifier que les jeunes de notre pays ne peuvent pas aider leur pays de différentes manières. La création du service national remplacera la conscription des Israéliens religieux et handicapés et leur permettra de se porter volontaires dans d'autres secteurs de la société."
 ISR_create_the_ministry_of_jewish_identity:0 "Créer le ministère de l'Identité juive"
 ISR_create_the_ministry_of_jewish_identity_desc:0 "Créer un ministère chargé de protéger l'identité juive contre l'effacement, l'assimilation ou l'élimination sera de la plus haute importance pour notre peuple."
 ISR_sanctify_observance_of_shabbat:0 "Sanctifier l'observance du Chabbat"
 ISR_sanctify_observance_of_shabbat_desc:0 "Chaque vendredi soir, nous nous asseyons ensemble pour savourer un repas somptueux et ne travaillons pas comme D.ieu l'a ordonné aux Juifs du mont Sinaï, jusqu'au coucher du soleil du samedi. Il est de notre devoir de le sanctifier par la loi dans tout Israël."
 ISR_women_rights_and_halacha:0 "Droits des femmes et Halacha"
 ISR_women_rights_and_halacha_desc:0 "Les femmes ont des droits égaux dans notre société, comme le prévoit la Torah. Cependant, les femmes et les hommes ont des rôles différents dans la société qui doivent être inscrits dans notre propre tradition juridique."
 ISR_the_halachic_laws_definition_of_jew:0 "La définition halakhique du juif"
 ISR_the_halachic_laws_definition_of_jew_desc:0 "Seuls les Juifs qui peuvent prouver leur judéité par leur lignée maternelle peuvent retourner en Terre d'Israël."
 ISR_the_nuremberg_laws_definition_of_jew:0 "La définition du juif dans les lois de Nuremberg"
 ISR_the_nuremberg_laws_definition_of_jew_desc:0 "Même si les haredim sont en désaccord avec nous, les lois de Nuremberg constituent une menace pour nous tous. Si vous êtes suffisamment juif pour être tué pour cela, vous êtes suffisamment juif pour vivre dans la sécurité d'Israël."
 ISR_exempt_religious_women_from_conscription:0 "Exonérer les religieuses de la conscription"
 ISR_exempt_religious_women_from_conscription_desc:0 "Les religieuses s'opposent fermement à l'idée de la conscription car elle relève de la responsabilité des hommes. Donnons-leur un peu d'espace."
 ISR_basic_law_on_the_jewish_state:0 "Loi fondamentale sur l'État juif"
 ISR_basic_law_on_the_jewish_state_desc:0 "Nous devons adopter une nouvelle loi fondamentale constitutionnelle pour comprendre le véritable objectif de notre pays. Sommes-nous le pays des Juifs ou la patrie des Juifs ?"
 ISR_the_british_proposal_on_the_sinai:0 "La proposition britannique sur le Sinaï"
 ISR_the_tripartite_alliance:0 "L'Alliance tripartite"
