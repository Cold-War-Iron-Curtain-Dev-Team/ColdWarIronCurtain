 ISR_buy_french_surplus:0 "Acheter le surplus français"
 ISR_especialize_in_small_conflicts_doctrine:0 "Spécialisé dans la doctrine des petits conflits"
 ISR_lessons_from_the_independence_war:0 "Les leçons de la guerre d'indépendance"
 ISR_standarize_the_uzi:0 "Standardiser l'Uzi"
 ISR_standarize_the_uzi_desc:0 "La mitraillette du major Uziel Gal est de toute beauté, chaque soldat de Tsahal devrait en être équipé."
 ISR_remembering_masada:0 "En souvenir de Massada"
 ISR_remembering_masada_desc:0 "Si nous devons oublier Massada, nous oublierons le peuple d'Israël. Massada ne se reproduira plus jamais."
