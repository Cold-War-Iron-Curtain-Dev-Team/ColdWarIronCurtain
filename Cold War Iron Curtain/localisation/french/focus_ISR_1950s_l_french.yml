 ISR_ensure_jordanian_neutrality:0 "Assurer la neutralité jordanienne"
 ISR_launch_an_attack_in_the_sinai:0 "Lancez une attaque sur le Sinaï"
 ISR_operation_kadesh:0 "Opération Kadesh"
 ISR_enforce_neutrality_in_the_suez_crisis:0 "Faire respecter la neutralité dans la crise de Suez"
 ISR_impose_our_terms_on_the_crisis:0 "Imposer nos conditions face à la crise"
 ISR_pursue_peace_with_egypt:0 "Poursuivre la paix avec l'Égypte"
 ISR_suppress_arab_capabilities_in_gaza:0 "Supprimer les capacités arabes à Gaza"
 ISR_answer_to_international_pressure:0 "Réponse à la pression internationale"
 ISR_strengthen_the_tripartite_position:0 "Renforcer la position tripartite"
 ISR_the_suez_ceasefire:0 "Le cessez-le-feu de Suez"
 ISR_create_the_city_of_ofakim:0 "Créer la ville d'Ofakim"
 ISR_create_the_city_of_ofakim_desc:0 "Ofakim sera une grande ville de développement pour améliorer davantage la vie dans le Néguev et favoriser un avenir dans lequel le Néguev sera un centre de la vie israélienne."
 ISR_establish_the_israeli_atomic_commission:0 "Créer la Commission atomique israélienne"
 ISR_barilan_university:0 "Université Bar-Ilan"
 ISR_barilan_university_desc:0 "Bar-Ilan sera une université qui mélangera notre tradition ancienne et l'érudition de la science moderne pour renforcer notre identité nationale."
 ISR_planned_city_of_dimona:0 "Ville planifiée de Dimona"
 ISR_planned_city_of_dimona_desc:0 "Dimona sera à l'avant-garde du développement du Néguev et sera un pilier important de nos projets pour le Néguev."
 ISR_form_tel_aviv_university:0 "Former l'Université de Tel Aviv"
 ISR_form_tel_aviv_university_desc:0 "Il est temps que les trois plus grandes académies d'enseignement supérieur de Tel-Aviv s'unissent véritablement pour créer une grande université de renommée pour notre pays." 
 ISR_expand_national_telephone_lines:0 "Développer les lignes téléphoniques nationales"
 ISR_reorganize_old_railway_lines:0 "Réorganiser les anciennes lignes de chemin de fer"
 ISR_reorganize_old_railway_lines_desc:0 "De nombreux anciens chemins de fer étaient conçus pour se rendre dans les grandes villes de Jérusalem ou d'Hébron, d'autres étaient destinés à l'Égypte. Aujourd'hui, nombre de ces lignes n'ont aucun sens compte tenu de la composition de notre pays et il est temps de l'adapter à nos besoins actuels."
 ISR_subsidize_egged_bus_corporation:0 "Subventionner Egged Bus Corporation"
 ISR_subsidize_egged_bus_corporation_desc:0 "Egged Bus Corporation soutiendra l'afflux massif de trafic et facilitera le transport des citoyens d'un point à l'autre du pays."
