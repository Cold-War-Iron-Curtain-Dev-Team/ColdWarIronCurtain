 Higuys_Republic_tt2: "[GetGovernmentTypesDesc]"



 GOV_TYPE_FED_SEM_DESC: "£GovTypes_Federal_Semi_Presidential_pic\n\n\n\n\n\n\n\n\nParfois appelées « système exécutif à double :, les républiques fédérales semi-présidentielles ont un président, un premier ministre et un cabinet qui existent indépendamment les uns des autres, le premier ministre et le cabinet étant responsables de la législature de l'État, avec une autorité diversifiée entre les autorités centrales et régionales. Bien qu'il y ait souvent plus de freins et contrepoids que la plupart des gouvernements, cela brouille également les pistes autour de la responsabilité du gouvernement..."
 GOV_TYPE_DUUMVIRATE_DESC: "£GovTypes_Direct_Indirect_pic\n\n\n\n\n\n\n\n\nComme leur nom l'indique, les gouvernements mixtes directs-indirects combinent des éléments de la démocratie directe, permettant aux citoyens de voter directement sur les lois et les politiques, tout en permettant aux élus de prendre des décisions au nom du peuple."
 GOV_TYPE_ETHNO_NAT_DESC: "Même si elles n'ont pas de politique étendue et définie, les organisations armées ethniques opèrent largement selon les valeurs de l'ethno-nationalisme. Même si les politiques peuvent varier d'un État à l'autre, elles fonctionnent largement selon l'idée de ségrégation ou d'extermination des ethnies étrangères de leurs territoires respectifs."
 GOV_TYPE_REP_DESC: "Un système de gouvernement républicain où le pouvoir est divisé entre un gouvernement central, dirigé par un président élu bipartite doté du pouvoir exécutif, et des gouvernements régionaux. Même si cela ne se limite pas strictement aux gouvernements libéraux occidentaux, la plupart des républiques présidentielles fédérales sont souvent des démocraties libérales."
 GOV_TYPE_COM_DESC: "Il défend toujours les valeurs fondamentales du marxiste-léninisme et croit en la nécessité d'une révolution communiste en deux étapes. Les républiques fédérales marxistes-léninistes maintiennent toujours un parti d'avant-garde organisé autour du centralisme démocratique, mais son autorité gouvernementale sera divisée entre les gouvernements centraux et régionaux. La mesure dans laquelle les gouvernements régionaux peuvent adopter une politique indépendante varie d'un État à l'autre."
 GOV_TYPE_REV_DESC: "Bien qu'ils n'adhèrent pas à une idéologie ou à une philosophie politique spécifique, les régimes révolutionnaires provisoires sont des dictatures établies au milieu ou après une révolution réussie dans le but de consolider l'autorité des révolutionnaires et d'utiliser cette autorité pour organiser un nouveau gouvernement."
 GOV_TYPE_BRM_DESC: "Comme la plupart des républiques, les républiques indépendantes ont un exécutif élu par la législature, mais une fois élus, ils ne peuvent pas être destitués par un vote de censure, et il y a peu, voire aucun, de freins et contrepoids juridiques pour le chef de l'État. Mais fondamentalement, les républiques indépendantes sont des démocraties fonctionnelles."
 GOV_TYPE_MAO_DESC: "Suivre les enseignements de feu Mao Zedong et, en tant que tel, est prédominant dans les pays non industrialisés, car il élève l'importance d'un « Front uni » de classes progressistes pour diriger l'avant-garde, plutôt que d'une simple avant-garde dirigée par un parti. Dans une République maoïste unitaire, le pouvoir repose en grande partie entre les mains d'une seule autorité centrale."
 GOV_TYPE_COM_2_DESC: "Une république marxiste-léniniste unitaire est une forme de gouvernement dans laquelle l'État est organisé comme une entité unique, avec tous les pouvoirs concentrés dans le gouvernement central. Dans ce système, le gouvernement s'appuie sur les principes du marxisme-léninisme, qui mettent l'accent sur le rôle de la classe ouvrière et la nécessité d'un État fort et centralisé pour"
 GOV_TYPE_VTC_2_DESC: "£GovTypes_Ecclesiastical_Theocracy_pic\n\n\n\n\n\n\n\n\nBien qu'il s'agisse d'un système de gouvernance très ancien, les monarchies ecclésiastiques élues croient en la large autorité d'un monarque, mais elles accordent également une importance et une nécessité aux autorités religieuses pour déterminer à la fois les questions d'État et l'élection du chef de l'État."
 GOV_TYPE_CROWN_DESC: "Pleinement reconnues avec la montée de l'absolutisme aux XVe et XVIe siècles, les monarchies absolues héréditaires ne détiennent souvent pas de constitution, ni même de droits et libertés protégés pour leurs citoyens. Bien qu'il existe des codes de lois, la pleine autorité sur toutes les questions d'État est entre les mains exclusives d'un monarque héréditaire."
 GOV_TYPE_ISLAM_CROWN_DESC: "Un ajout théocratique à la monarchie héréditaire absolue traditionnelle, ils sont fonctionnellement presque identiques. Cependant, ce qui distingue une monarchie islamique héréditaire est le rôle de la loi et de la philosophie islamiques dans la gouvernance de l'État, du droit et de la conduite des monarques eux-mêmes."
 GOV_TYPE_CROWN_EU_DESC: "S'écartant des monarques absolus, les monarchies constitutionnelles, comme leur nom l'indique, ont une constitution nationale et disposent d'un large éventail de freins et contrepoids juridiques, tant chez les dirigeants élus que dans la monarchie. Le pouvoir est généralement, mais pas toujours, partagé entre un monarque et un chef élu, le rôle du monarque dans les affaires d'État étant assez limité. Les monarchies constitutionnelles unitaires ont une autorité concentrée sur un seul gouvernement central."
 GOV_TYPE_FED_MON_DESC: "S'écartant des monarques absolus, les monarchies constitutionnelles, comme leur nom l'indique, ont une constitution nationale et disposent d'un large éventail de freins et contrepoids juridiques, tant chez les dirigeants élus que dans la monarchie. Le pouvoir est généralement, mais pas toujours, partagé entre un monarque et un chef élu, le rôle du monarque dans les affaires d'État étant assez limité. Les monarchies constitutionnelles fédérales ont une autorité partagée entre un gouvernement central et des autorités régionales."
 GOV_TYPE_REP_PARL_DESC: "Les républiques parlementaires ont un chef d'État choisi ou nommé par une législature et ils sont également tenus responsables. Le chef de l'État dans un système parlementaire complet est souvent distinct du chef du gouvernement, remplissant des rôles principalement apolitiques et cérémoniaux. Dans une République parlementaire unitaire, l'autorité gouvernementale repose au sein d'un seul gouvernement central."
 GOV_TYPE_VTC_DESC: "Bien qu'il s'agisse d'un système de gouvernance très ancien, les monarchies électives théocratiques croient en la large autorité d'un monarque, mais elles accordent également une importance et une nécessité aux autorités religieuses pour déterminer à la fois les questions d'État et l'élection du chef de l'État."
 GOV_TYPE_ANR_DESC: "Les diarchies, ou duumvirats, sont des États ou des systèmes dirigés par deux individus exerçant une autorité égale (du moins sur le papier). Cependant, au sein d'une Principauté Constitutionnelle Diarchique, les Diarchs sont souvent de naissance noble et sont redevables à une constitution nationale."
 GOV_TYPE_SWI_DESC: "Les systèmes directifs favorisent les gouvernements dirigés par un petit groupe de personnes, appelés collectivement règle du Directoire, et tous exercent de manière égale l'autorité des chefs d'État. Dans une république directoire, ces personnes sont souvent élues et la question de savoir si leur mandat est limité varie d'un État à l'autre. Au sein d'une République fédérale directrice, les pouvoirs sont encore plus diversifiés entre les autorités régionales."
 GOV_TYPE_FED_PARL_DESC: "Les républiques parlementaires ont un chef d'État choisi ou nommé par une législature et ils sont également tenus responsables. Le chef de l'État dans un système parlementaire complet est souvent distinct du chef du gouvernement, remplissant des rôles principalement apolitiques et cérémoniaux. Dans une République parlementaire fédérale, l'autorité gouvernementale est diversifiée entre un gouvernement central et des autorités régionales."
 GOV_TYPE_SEM_REP_DESC: "Parfois appelées « système exécutif à double :, les républiques fédérales semi-présidentielles ont un président, un premier ministre et un cabinet qui existent indépendamment les uns des autres, le premier ministre et le cabinet étant responsables de la législature de l'État. Tout en maintenant plus de freins et de contrepoids que la plupart des gouvernements, cela brouille également les cartes concernant la responsabilité du gouvernement..."
 GOV_TYPE_JUNTA_DESC: "Les gouvernements provisoires sont des formes temporaires de gouvernement, servant souvent de point de transition entre les régimes ou de transition d'un gouvernement de son état d'avant la révolution à son état d'après-révolution. Les gouvernements militaires provisoires varient énormément d'un État à l'autre. Certains maintiendront l'ordre civil et maintiendront simplement la paix, tandis que d'autres tenteront de confier directement et de manière permanente le contrôle politique aux militaires. Il n'est pas non plus entièrement garanti que l'armée quitte le pouvoir après la fin de la période provisoire."
 GOV_TYPE_COLONIAL_DESC: "Imposés par une puissance étrangère, généralement (mais pas toujours) hors du continent, les habitants ont souvent peu ou pas d'influence ou de contrôle sur le gouvernement ou sur tout aspect du paysage politique ou juridique de l'État. Les administrations coloniales sont rarement les mêmes et la politique repose entièrement entre les mains de la puissance étrangère qui a établi l'administration."
 GOV_TYPE_PROV_GOV_DESC: "Les gouvernements provisoires sont des formes temporaires de gouvernement, servant souvent de point de transition entre les régimes ou de transition d'un gouvernement de son état d'avant la révolution à son état d'après-révolution. L'une des formes les plus civiles de gouvernement provisoire, le gouvernement intérimaire est souvent encore une administration civile et sert de transition idéalement pacifique entre deux formes de gouvernement différentes, sans perturber la vie quotidienne des citoyens de l'État."
 GOV_TYPE_SPR_DESC: "Forme de dictature totalitaire, il n'y a souvent pas de lien unique entre les États fascistes dans leur façon de fonctionner. Des opinions souvent douteuses sur les entités religieuses. Tout ce qui compte fondamentalement pour une dictature fasciste est le contrôle total et écrasant du chef de l'État et la référence totale soit à l'État, soit aux idéaux imposés par l'État. Les droits des citoyens, les positions sur les minorités ethniques, entre autres sujets, sont souvent le simple caprice du dictateur."
 GOV_TYPE_UN_MANDATE_DESC: "Forme de gouvernement temporaire, un territoire sous tutelle des Nations Unies est établi et directement gouverné par les Nations Unies elles-mêmes. Celles-ci existent principalement pour servir de période de transition pour maintenir la paix et empêcher une violence écrasante lorsqu'un État ou une région est réorganisé en un nouveau gouvernement pacifique ou se prépare à être transféré vers un État plus stable."
 GOV_TYPE_UNITARY_PRES_DESC: "Un système de gouvernement républicain où le pouvoir est confié à un gouvernement central unique, dirigé par un président élu bipartite et doté du pouvoir exécutif. Bien qu'elles ne soient pas strictement limitées aux gouvernements libéraux occidentaux, la plupart des républiques présidentielles unitaires sont souvent des démocraties libérales."
 GOV_TYPE_ISLAM_DESC: "Alors que l'autorité d'un chef d'État ou des autorités laïques est souvent douteuse, au sein d'une théocratie islamique unitaire repose principalement sur le clergé. Les lois, les codes de conduite et les politiques sociales sont déterminés, débattus et établis exclusivement à travers le prisme du droit et de la théologie islamiques. Au sein d'une théocratie islamique unitaire, l'autorité repose au sein d'une seule autorité théocratique."
 GOV_TYPE_SEM_MON_DESC: "Situées entre l'absolu et le constitutionnel, les monarchies semi-constitutionnelles possèdent une constitution et un corps législatif élu ou nommé, mais la Couronne n'est en aucun cas liée par l'une ou l'autre. Le monarque conserve un véritable pouvoir exécutif et se réserve le droit de nommer et de révoquer le chef du gouvernement, de dissoudre le corps législatif ou de gouverner par décret si ses conclusions s'avèrent gênantes. La question de savoir si un tel État deviendra une véritable monarchie constitutionnelle ou s'effondrera à nouveau dans l'absolutisme dépend moins du document lui-même que du caractère de la personne qui porte la couronne."
 GOV_TYPE_UNK_DESC: "On ne sait pas comment fonctionne cet État, mais il fonctionne quand même. Peut-être que plus il fonctionnera ainsi, plus il recevra un nom s'il s'avère suffisamment efficace."
 GOV_TYPE_ZONE_DESC: "L'identité du chef de l'État et la manière dont l'État est dirigé dépendent entièrement des autorités qui soutiennent son existence. Ces gouvernements existent exclusivement comme une forme de transition, souvent après une guerre ou une période de troubles internes profonds et d'effusions de sang, pour assurer soit une transition pacifique du pouvoir, soit pour garantir l'arrivée au pouvoir d'autorités spécifiques, soutenues par les puissances étrangères qui dirigent l'administration."
 GOV_TYPE_ISLAM_REPUBLIC_DESC: "Une République cléricale islamique est constituée de gouvernements dirigés par des religieux nommés tout en conservant une certaine forme de représentants civils traditionnels, bien qu'ils puissent avoir leur mot à dire dans la gouvernance quotidienne, ils sont toujours subordonnés à la volonté des juristes islamistes et à la charia"