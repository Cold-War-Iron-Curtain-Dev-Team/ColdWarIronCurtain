 ##unifying Arab League
 UNITY_DESC_0:0 "Des siècles d'humiliation, d'assujettissement et de division n'ont fait que renforcer notre détermination à nous unir. Seul un avenir uni peut assurer le sort du peuple arabe "
 UNITY_DESC_1:0 "Les résolutions suivantes seront débloquées en fonction de l'humeur actuelle du monde arabe. Alors que l'opinion publique commence à s'unifier, des lois plus importantes peuvent être adoptées. Le processus peut être lancé en poursuivant la première résolution disponible sur le chemin de l'unification."
 UNITY_DESC_2:0 "L'union conduirait à l'obsolescence de la Ligue arabe, et donc à sa dissolution officielle. Toutes les nations qui ne voteront pas pour s'unir seront exclues de la fraternité du peuple arabe en tant qu'États traîtres, et seront traitées plus tard...\n Cependant, nous pouvons tenter un compromis plus acceptable consistant à créer formellement une faction pour la sécurité et la prospérité du monde arabe."

