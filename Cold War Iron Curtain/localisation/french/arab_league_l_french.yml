 ## events

 ##align with superpower
 ARAB_LEAGUE_RESOLUTION.0.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour s'aligner sur la sphère [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.0.d:0 "\nAprès des mois de négociations avec les autorités [arab_league_nation_global_target.GetAdjective], la Ligue arabe a voté en faveur d'un pas commun vers un avenir prospère. Le vote a eu lieu après plusieurs semaines de témoignages, de débats et d'argumentations sur la résolution. Les représentants des pays [arab_league_nation_global_target.GetAdjective] recherchent une coopération plus étroite avec la Ligue arabe, ouvrant la voie à des liens politiques, économiques et militaires plus solides. La bonne volonté dans les relations durera au moins quelques années, ou jusqu'au prochain incident majeur... "
 ARAB_LEAGUE_RESOLUTION.01.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour s'aligner sur la sphère [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.01.d:0 "\nAprès des mois de négociations avec nos autorités, la Ligue arabe a voté en faveur d'un pas commun vers un avenir prospère. Le vote a eu lieu après plusieurs semaines de témoignages, de débats et d'argumentations sur la résolution. Les représentants de la Ligue arabe recherchent une coopération plus étroite avec notre nation, ouvrant la voie à des liens politiques, économiques et militaires plus solides. La bonne volonté dans les relations durera au moins quelques années, ou jusqu'au prochain incident majeur... "
 ARAB_LEAGUE_RESOLUTION.1.d:0 "Lors d'une récente session de la Ligue arabe, notre nation a été ouvertement condamnée pour violations des droits de l'homme dans une résolution. Cette action nuit grandement à notre image internationale et à notre tourisme. Plus important encore, cela donne aux ennemis et aux opposants de l'État le pouvoir d'agir de manière plus flagrante à mesure que la surveillance mondiale s'intensifie sur nos actions. Certains hauts responsables du gouvernement estiment que la résolution devrait servir de signal d'alarme et que nous devons agir pour rassurer la communauté internationale et notre peuple sur le fait que notre nation est une nation de justice. Un autre groupe de hauts responsables affirme que le vote de la Ligue arabe était le résultat de la propagande et potentiellement d'un dangereux complot interne contre nous. Ils affirment que nous ne devons pas arrêter nos politiques nécessaires, mais que nous pouvons certainement travailler à les cacher davantage aux yeux du public."

 ##condemn colonialism
 ARAB_LEAGUE_RESOLUTION.2.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour condamner le colonialisme [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.2.d:0 "\nLa Ligue arabe a adopté une résolution puissante condamnant le colonialisme du [arab_league_nation_global_target.GetAdjective]. Au cours des débats qui ont eu lieu avant le vote, de nombreux membres ont souligné que le droit à l'autodétermination est un principe vital de la Charte de la Ligue arabe et que le [arab_league_nation_global_target.GetAdjective] n'a pas réussi à offrir à ses sujets coloniaux aucune voie vers la liberté ou leur statut futur. De nombreux membres n'ont pas été impressionnés par les contre-arguments présentés, et il semble que la plupart des membres soient convaincus que [arab_league_nation_global_target.GetAdjective] n'a pas réussi à offrir à ses colonies un droit de parole suffisant sur son administration ou son avenir politique. Les représentants du [arab_league_nation_global_target.GetAdjective] ont refusé de faire une déclaration officielle alors qu'ils quittaient la Ligue arabe pour consulter leurs dirigeants. Le vote est considéré comme une victoire majeure pour les militants anticoloniaux du monde entier."
 ARAB_LEAGUE_RESOLUTION.3.d:0 "Une récente résolution de la Ligue arabe a condamné les possessions coloniales de notre nation. La résolution de la Ligue arabe n'a pas reconnu tout ce que nous avons apporté dans ces domaines en termes de sécurité, d'éducation et d'économie, mais quelle que soit la résolution, elle porte un coup dur à notre image internationale. Il ne fait aucun doute que les mécréants et les éléments malavisés des colonies seront encouragés à nous frapper ou à nous embarrasser davantage. Nous pouvons certainement maintenir notre politique et notre présence dans les colonies, mais au risque de nouvelles sanctions de la Ligue arabe. Plusieurs hauts responsables militaires et coloniaux n'ont pas tardé à marquer leur préférence pour cette option. Ou nous pouvons envisager la possibilité de préparer des plans de décolonisation, pour contrer l'attention internationale négative à notre égard. Certains hauts responsables estiment qu'il est possible de libérer ces États et de maintenir une forte influence, même si cela ne peut être garanti."

 ## contain foreign influence
 ARAB_LEAGUE_RESOLUTION.4.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour contenir l'influence [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.4.d:0 "\nUne nouvelle résolution adoptée par la Ligue arabe a formellement informé [arab_league_nation_global_target.GetAdjective] qu'elle ne devait plus accroître ses ressources pour acquérir une influence sur d'autres États. De nombreux membres ont fait valoir que les activités du [arab_league_nation_global_target.GetAdjective] conduisaient à la déstabilisation, à des difficultés économiques et risquaient de menacer la souveraineté d'un trop grand nombre d'États. Beaucoup ont semblé convaincus par les discussions selon lesquelles les actions des [arab_league_nation_global_target.GetAdjective] s'apparentaient à la production d'un nouveau type de colonialisme, caché aux yeux du public. Après le vote, plusieurs représentants ont souligné que les pratiques du [arab_league_nation_global_target.GetAdjective] étaient néfastes et que ne pas agir risquerait de ramener le monde à une situation de concurrence mondiale violente."

 ## ban diplomats
 ARAB_LEAGUE_RESOLUTION.5.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour geler [arab_league_nation_global_target.GetAdjective] les avoirs nationaux"
 ARAB_LEAGUE_RESOLUTION.5.d:0 "\nAprès de longs débats, la Ligue arabe a voté le gel des avoirs nationaux du [arab_league_nation_global_target.GetAdjective]. Les membres de la Ligue arabe ont déterminé que le gouvernement des [arab_league_nation_global_target.GetAdjective] utilisait ses fonds de manière inappropriée, au détriment de la communauté mondiale et de ses peuples. C'est un coup dur pour le gouvernement des [arab_league_nation_global_target.GetAdjective]. Après le vote, son représentant a déclaré à la presse que les résultats étaient non seulement décevants mais représentaient un recul par rapport aux normes internationales concernant la souveraineté des États individuels. Le représentant a prédit qu'un tel vote conduirait à de nouvelles atteintes aux droits des nations et de leurs peuples. D'autres pays ont publié des déclarations affirmant que [arab_league_nation_global_target.GetAdjective] violait tellement de normes acceptables que le résultat était inévitable."

 ##demand Arab states
 ARAB_LEAGUE_RESOLUTION.6.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour sanctionner des personnalités [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.6.d:0 "\nLa Ligue arabe a voté pour sanctionner des personnalités éminentes au sein de [arab_league_nation_global_target.GetAdjective]. Ces individus sont accusés d'une litanie de crimes et de corruption. La Ligue arabe espère que les sanctions feront pression sur le gouvernement des [arab_league_nation_global_target.GetAdjective] pour qu'il arrête ou détienne ces personnes. Le vote a été salué par de nombreux médias qui ont considéré que le vote ciblait les principaux auteurs et ne punissait pas une société entière ni même un gouvernement. Faisant écho à ce thème, un éminent diplomate a déclaré aux médias que les sanctions visent à aider les habitants des [arab_league_nation_global_target.GetAdjective] à faire le ménage et à réaliser leurs aspirations. Aucune des personnes sanctionnées n'a souhaité faire de déclaration à ce sujet."

 ##Arab trade sanctions
 ARAB_LEAGUE_RESOLUTION.7.t:0 "[GetNewspaperHeader]La Ligue arabe vote en faveur de sanctions commerciales [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.7.d:0 "\nÀ la suite d'un débat âprement controversé, la Ligue arabe a voté en faveur d'importantes sanctions commerciales contre [arab_league_nation_global_target.GetName]. La résolution a souligné les violations continues des normes établies et les mauvais comportements du gouvernement [arab_league_nation_global_target.GetName] dans le texte de la résolution. Plusieurs diplomates se sont empressés de dire aux médias que les sanctions ne visent pas à nuire à la population, mais qu'elles doivent être mises en oeuvre afin de contrôler les actions du [arab_league_nation_global_target.GetName]. Le gouvernement du [arab_league_nation_global_target.GetName] serait très mécontent de cette résolution, accusant une conspiration internationale et informant sa population qu'elle était victime et victime d'intimidation de la part de la Ligue arabe."

 ##denounce internationally
 ARAB_LEAGUE_RESOLUTION.8.t:0 "[GetNewspaperHeader]La Ligue arabe vote en faveur d'une interdiction du commerce des armes [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.8.d:0 "\nLa Ligue arabe a adopté une nouvelle résolution interdisant l'achat d'armes par le gouvernement du [arab_league_nation_global_target.GetName]. De nombreux États membres ont souscrit à l'argument selon lequel les armes acquises par le [arab_league_nation_global_target.GetName] étaient bien supérieures à ce dont il avait besoin. En outre, les États membres ont estimé que le [arab_league_nation_global_target.GetName] détournait les ressources nécessaires pour aider leurs populations face à leur accumulation excessive et menaçante d'armes. La Ligue arabe a finalement conclu qu'elle devait agir pour empêcher le [arab_league_nation_global_target.GetName] de déstabiliser davantage la communauté internationale. Les représentants du [arab_league_nation_global_target.GetName] ont publié une brève déclaration condamnant la résolution comme une violation de la souveraineté et une attaque directe contre la capacité de la nation à se défendre."

 ##enact oil embargo
 ARAB_LEAGUE_RESOLUTION.9.t:0 "[GetNewspaperHeader]Les Nations Unies appellent à la fin du programme nucléaire [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.9.d:0 "\nLa Ligue arabe a adopté une résolution appelant à [arab_league_nation_global_target.GetName] pour mettre fin à son programme nucléaire. Au cours du débat sur la résolution, plusieurs pays ont souligné la menace existentielle que représentent ces armes nucléaires non seulement pour la région mais pour le monde. Les représentants du [arab_league_nation_global_target.GetName] ont insisté sur le fait qu'ils ont le droit de rechercher et de développer toutes les technologies nécessaires au progrès et à la protection du peuple. Il a ajouté que la résolution de la Ligue arabe témoigne des préjugés et de l'hypocrisie de l'organisation, mais qu'elle prévoit de publier une réponse formelle après avoir consulté les hauts dirigeants. D'autres diplomates ont rejeté de telles affirmations, soulignant que les risques étaient évidents pour le monde entier et que ne pas agir aurait été en soi une grave erreur."

 ##request Arab loans
 ARAB_LEAGUE_RESOLUTION.10.t:0 "[GetNewspaperHeader]Les Nations Unies appellent au retrait des armes de destruction massive de [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.10.d:0 "\nUn débat enflammé s'est terminé par l'adoption par la Ligue arabe d'une résolution exigeant que [arab_league_nation_global_target.GetName] retire toutes ses armes de destruction massive. Des diplomates de plusieurs États ont affirmé que [arab_league_nation_global_target.GetName] ne disposait pas des procédures de commandement et de contrôle appropriées, de la retenue et de la justification nécessaires pour produire, détenir ou utiliser de telles armes. La résolution de la Ligue arabe a souligné que le retrait de ces armes renforcerait les perspectives de paix dans la région et réduirait la possibilité d'un conflit armé. Le principal représentant des [arab_league_nation_global_target.GetName] a affirmé que le débat et le vote avaient été organisés simplement pour humilier sa nation. Il a déclaré qu'une réponse officielle serait reçue dès son retour chez lui pour consulter les hauts dirigeants."
 ARAB_LEAGUE_RESOLUTION.11.d:0 "La Ligue arabe a voté une résolution exigeant que nous suspendions notre programme nucléaire et que le programme soit placé sous la supervision de la Ligue arabe. Lors des débats sur la résolution, il est clair que la communauté internationale ne nous fait pas confiance pour utiliser de telles armes. Nous pouvons accepter la résolution et entamer un processus de dénucléarisation. Cela couperait le souffle à nos opposants et montrerait que nous sommes un membre responsable de la communauté internationale. Cela réduirait également le risque d'escalade. Cependant, certains hauts responsables et officiers militaires notent que la nation a sacrifié d'immenses richesses, vies et ressources pour établir une dissuasion nucléaire. Dénucléariser serait une insulte à la nation et la rendrait vulnérable. Ils craignent également que la résolution de la Ligue arabe ne soit qu'un stratagème visant à retirer les armes nucléaires en prévision d'une invasion de nos ennemis."
 ARAB_LEAGUE_RESOLUTION.12.d:0 "Une résolution récemment adoptée par la Ligue arabe exige que nous suspendions et mettions fin à notre programme d'armes chimiques. Il ressort clairement du vote que la communauté internationale considère notre programme comme une menace grave et que son refus pourrait entraîner de nouvelles actions de la part de la Ligue arabe. Accepter la résolution et entamer le processus mettrait sans aucun doute fin à toute escalade et certains responsables notent que moralement, il pourrait être judicieux de retirer ces armes par tous les moyens. Cependant, d'autres responsables, notamment militaires, nous exhortent à ne pas céder, car ces armes sont destinées à la protection nationale et constituent une question interne. Pour eux, la Ligue arabe n'a pas le droit de dicter ce qu'un État souverain peut faire sur le plan interne."

 ##request control of state

 ##declare peacekeeping mission

 ##request Arab intervention
 ARAB_LEAGUE_RESOLUTION.13.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour le retour de [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.13.d:0 "\nConstituant un revers majeur pour le [arab_league_state_owner_global_target.GetName], la Ligue arabe a voté pour le retour du [arab_league_state_global_target.GetName]. Lors du débat de principe, de nombreux députés ont exprimé leur malaise face aux informations faisant état de troubles et de tensions au sein du territoire. Ils ont convenu que la volonté du peuple était pour le retour des [arab_league_state_global_target.GetName]. Le secrétaire général a fait écho à ce sentiment après l'adoption de la résolution, déclarant que le retour du [arab_league_state_global_target.GetName] contribuerait grandement à résoudre les tensions et la violence dans la région. Il reste à voir si cette dernière action de la Ligue arabe pourra se poursuivre [arab_league_state_owner_global_target.GetName] pour restituer [arab_league_state_global_target.GetName] à la communauté mondiale."
 
 ##embargo Arab state
 ARAB_LEAGUE_RESOLUTION.14.t:0 "[GetNewspaperHeader]La Ligue arabe nous appelle à abandonner le contrôle de [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.14.d:0 "\nLa Ligue arabe a récemment adopté une résolution exigeant que nous renoncions à notre contrôle sur [arab_league_state_global_target.GetName]. Il s'agit d'une condamnation cinglante de la part de l'organisme mondial et représente un défi majeur pour notre gouvernement. Certains pensent que nous devrions obéir à la demande de la Ligue arabe, car cela achèterait la bonne volonté internationale et changerait le discours négatif contre notre nation. Ils notent également qu'un refus peut présenter un risque pour notre sécurité nationale. D'autres, cependant, soutiennent qu'accepter la résolution serait perçu comme une trahison par notre peuple et que le gouvernement pourrait ne pas y survivre. En outre, ils rejettent l'idée que la Ligue arabe puisse même nous imposer une telle exigence. Nous devons décider d'accepter la résolution ou de la rejeter."
 
 
 ##remove embargo Arab state
 ARAB_LEAGUE_RESOLUTION.15.t:0 "[GetNewspaperHeader]La Ligue arabe déploie des soldats de la paix [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.15.d:0 "\nLa Ligue arabe a autorisé le déploiement de soldats de maintien de la paix à [arab_league_nation_global_target.GetName]. Les Casques bleus devraient réduire les tensions et la violence dans la région et préserver la paix. Les membres qui ont approuvé la mesure ont déclaré que les Casques bleus agiraient comme l'avant-garde de la paix et de la stabilité. Plusieurs membres ont annoncé leur intérêt pour l'envoi de soldats de la paix, mais le nombre réel de pays participant à la mission Peacekeeper n'a pas encore été annoncé. Même si de nombreux journaux des pays du [arab_league_nation_global_target.GetName] ont salué ce déploiement, certains craignent que les forces de la Ligue arabe ne représentent une menace pour l'indépendance de la nation et n'auraient pas dû être autorisées."
 
 ##send monetary aid
 ARAB_LEAGUE_RESOLUTION.16.t:0 "[GetNewspaperHeader]La Ligue arabe lance un effort de médiation en [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.16.d:0 "\nLa Ligue arabe a approuvé l'envoi d'une délégation de haut niveau pour aider à résoudre les problèmes en [arab_league_nation_global_target.GetName]. La délégation de la Ligue arabe sera dirigée par un diplomate chevronné possédant une connaissance approfondie de la situation. Le groupe devrait partir dès qu'il aura reçu l'autorisation officielle de voyager. Les diplomates familiers avec la situation estiment que cet effort de médiation, mené par un groupe neutre, pourrait offrir le meilleur espoir de résoudre la situation. Le dernier effort de médiation est largement salué, mais avec des attentes aussi élevées, de nombreux diplomates suggèrent qu'un échec pourrait être désastreux."
 
 ##send research aid
 ARAB_LEAGUE_RESOLUTION.17.d:0 "La Ligue arabe nous a demandé de mettre un terme aux hostilités et d'accepter un cessez-le-feu. La Ligue arabe promet qu'elle veillera à ce qu'un cessez-le-feu entre en vigueur qui préserverait les lignes de bataille actuelles et ne verrait pas notre ennemi tenter de manipuler la situation sur les lignes de front à son avantage avant les pourparlers de paix. Nous devons consulter les hauts responsables militaires et de la défense pour connaître leur évaluation quant à savoir si nous devons ou non continuer à nous battre."
 
 ##release nation
 ARAB_LEAGUE_RESOLUTION.18.t:0 "[GetNewspaperHeader]Cessez-le-feu Accepté par [FROM.GetName] et [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.18.d:0 "\n[FROM.GetName] et [arab_league_nation_global_target.GetName] ont accepté un cessez-le-feu sous les auspices de la Ligue arabe. Une force d'observation de la Ligue arabe devrait bientôt arriver pour préserver la ligne de cessez-le-feu. Le secrétaire général de la Ligue arabe espère que les deux parties utiliseront le cessez-le-feu pour relancer les pourparlers de paix et résoudre enfin tous les problèmes en suspens. Les deux gouvernements concernés ont publié des déclarations saluant le rôle de la Ligue arabe dans la facilitation du cessez-le-feu. Bien que la Ligue arabe salue son rôle dans le cessez-le-feu, certains diplomates ont déclaré en privé aux médias qu'ils estimaient que le cessez-le-feu avait mis trop de temps à se mettre en place."
  
 ##increase session length
 ARAB_LEAGUE_RESOLUTION.19.t:0 "[GetNewspaperHeader][FROM.GetName] Rejette les négociations de paix"
 ARAB_LEAGUE_RESOLUTION.19.d:0 "\nLa Ligue arabe a rapporté que [FROM.GetName] avait refusé d'accepter les offres de négociations de paix. Les principaux diplomates de la Ligue arabe ont souligné leur déception face à ce refus, soulignant que le statut de la Ligue arabe en tant qu'organisme neutre et mondial en aurait fait un partenaire idéal pour les négociations de paix. Le Conseil de sécurité devrait discuter de ce nouveau développement lors de sa prochaine session. Avec ce rejet, on craint de plus en plus que le conflit ne fasse que s'aggraver et que la Ligue arabe ne dispose pas de l'influence nécessaire pour réaliser les aspirations de ses fondateurs."
 
 ##reset session
 ARAB_LEAGUE_RESOLUTION.20.d:0 "\nLors d'un vote serré, la Ligue arabe a autorisé une intervention militaire en [arab_league_nation_global_target.GetName]. Après le vote, le secrétaire général a noté que la nature désastreuse de la situation sur le terrain rendait la décision d'intervenir inévitable et nécessaire. Plusieurs États ont déjà exprimé leur intérêt à apporter leur soutien à la nouvelle mission, mais la Ligue arabe n'a pas encore fourni de chiffres exacts sur le nombre de forces qui seront déployées et depuis quel pays. Au sein du [arab_league_nation_global_target.GetName], nombreux sont ceux qui saluent la décision de la Ligue arabe et espèrent qu'elle contribuera à assurer la sécurité et la stabilité nécessaires à une paix durable. Certains éléments du [arab_league_nation_global_target.GetName] s'opposent au déploiement de la Ligue arabe, le considérant comme une intervention étrangère. La Ligue arabe devra faire preuve de prudence, mais les espoirs de succès sont grands."
 
 ##establish the Azad zone
 ARAB_LEAGUE_RESOLUTION.21.t:0 "[GetNewspaperHeader]La Ligue arabe lance une intervention contre [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.21.d:0 "\nLors d'un vote solennel, la Ligue arabe a autorisé une intervention militaire en [arab_league_nation_global_target.GetName]. Après le vote, le secrétaire général a noté que ce n'était ni le but ni le souhait de l'organisation, mais que la situation s'était tellement détériorée qu'il n'y avait pas d'autre choix. D'autres diplomates de la Ligue arabe ont été plus francs, déclarant que la situation avec [arab_league_nation_global_target.GetName] avait atteint un point de non-retour et qu'une intervention était inévitable. On ignore actuellement quelles nations dirigeront l'intervention et en quel nombre. Le gouvernement des [arab_league_nation_global_target.GetName] n'a pas publié de déclaration officielle, mais les analystes estiment qu'il sera probablement provocateur et peu susceptible de se retirer ou de céder à la pression internationale."
 
 
 ##establish research sharing
 ARAB_LEAGUE_RESOLUTION.22.d:0 "Une récente résolution de la Ligue arabe appelle à la formation d'une coalition pour aider à imposer la paix dans une région troublée. Certains dans la presse locale nous exhortent à rejoindre la coalition pour montrer notre solidarité et notre soutien à la paix internationale. Au sein de l'armée, certains officiers sont également favorables à cette idée, considérant une telle coalition comme un moyen de tester à la fois les troupes et le matériel sur le terrain. Cependant, il existe également une opposition, certains médias affirmant que nous devrions rester à l'écart des affaires des autres nations. En outre, au sein de l'armée, un autre groupe soutient que la participation à une telle force met des vies en danger et dépense des ressources sans aucun gain tangible. C'est un choix difficile à faire pour nous."

 ##attempt to shift league HQ
 ARAB_LEAGUE_RESOLUTION.23.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour assouplir les sanctions commerciales [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.23.d:0 "\nLa Ligue arabe a voté la levée des sanctions commerciales étendues le [arab_league_nation_global_target.GetName]. Le Conseil de sécurité a noté que [arab_league_nation_global_target.GetName] avait fait de grands progrès pour mettre fin aux pratiques qui ont contraint la Ligue arabe à appliquer initialement des sanctions commerciales. Le secrétaire général, en réponse au vote, a souligné que l'organisation n'était pas destinée à punir les États et a espéré que ce vote aiderait les [arab_league_nation_global_target.GetName] à revenir en tant que membre de la communauté mondiale. Le représentant des [arab_league_nation_global_target.GetName] a salué la décision et a déclaré que ce dernier vote jouerait un rôle important dans la normalisation des relations."
 
 ##form Arab parliament
 ARAB_LEAGUE_RESOLUTION.24.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour assouplir l'interdiction du commerce des armes [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.24.d:0 "\nLa Ligue arabe a adopté une résolution levant l'embargo sur les armes imposé le [arab_league_nation_global_target.GetName]. Le Conseil de sécurité a estimé que les raisons de l'interdiction des armes n'étaient plus justifiables et que l'attitude du gouvernement en [arab_league_nation_global_target.GetName] avait été assez réceptive ces derniers temps. Le secrétaire général a fait des remarques et a souligné que l'organisation ne ressentait plus la menace. Il a ajouté son espoir que le gouvernement du [arab_league_nation_global_target.GetName] poursuivra les mesures positives qu'il a initiées. Certains diplomates ont fait écho à ces déclarations, affirmant que les sanctions sont souvent un dernier recours et qu'une fois qu'ils ont constaté des changements positifs, il y avait peu de désir de maintenir les sanctions. Cependant, en privé, certains représentants ont fait part de leur crainte que la levée des sanctions ne finisse par déclencher une course aux armements dans la région."
 
 ##reform pan Arabism
 ARAB_LEAGUE_RESOLUTION.25.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour la liberté [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.25.d:0 "\nLa Ligue arabe a voté pour accorder la liberté à la communauté [arab_league_nation_global_target.GetAdjective]. Le vote a eu lieu après un débat animé sur la question, mais une fois adopté, tous les délégués ont eu le sentiment qu'un événement d'importance historique venait de se produire. Le secrétaire général a félicité les États membres pour avoir voté et débattu de la résolution. Dans ses remarques, il a souligné que le droit à l'autodétermination est un élément essentiel non seulement de la charte de la Ligue arabe, mais aussi de presque toutes les nations. L'adoption de la résolution montre que la communauté internationale reste attachée aux idéaux et aux aspirations de tous les peuples du monde."
 
 
 ##strengthen league unity
 ARAB_LEAGUE_RESOLUTION.26.t:0 "La Ligue arabe appelle à la liberté [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.26.d:0 "\nDans un développement significatif, la Ligue arabe a adopté une résolution appelant à la liberté du [arab_league_nation_global_target.GetAdjective] peuple. La Ligue arabe a souligné l'importance de l'autodétermination et a appelé à son application dans ce cas. Avant que la résolution ne soit adoptée, un débat intense a eu lieu, de nombreux membres craignant qu'une telle résolution ne constitue une ingérence directe dans la souveraineté d'une nation. Ils ont estimé qu'un tel précédent laisserait de nombreux États membres vulnérables à des résolutions similaires et, pour cette raison, ils n'ont pas voulu voter pour la résolution. Cependant, les votes nécessaires pour adopter la résolution ont finalement été recueillis. En dehors de la Ligue arabe, des foules de partisans et de membres de la communauté [arab_league_nation_global_target.GetAdjective] auraient applaudi avec joie. Cependant, le temps nous dira si cette résolution sera acceptée."
 
 
 ##rally support for unification
 ARAB_LEAGUE_RESOLUTION.27.t:0 "[GetNewspaperHeader][FROM.GetName] Rejette les appels à la liberté [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.27.d:0 "\nLe gouvernement du [FROM.GetName] a fermement rejeté la résolution de la Ligue arabe appelant à l'indépendance de la communauté [arab_league_nation_global_target.GetAdjective]. Dans un communiqué, ils ont affirmé que la Ligue arabe n'avait ni compétence ni droit de dicter leurs affaires intérieures. Accepter la résolution de la Ligue arabe aurait non seulement sacrifié leur souveraineté, mais aurait également créé un dangereux précédent. Le communiqué souligne également que la résolution et la campagne internationale sont probablement une conspiration internationale destinée à détruire l'unité et la force des [FROM.GetName]. Cette déclaration de défi a été accueillie froidement par la Ligue arabe, le secrétaire général exprimant sa grave déception. Le Conseil de sécurité discutera probablement de la question lors de sa prochaine session."
 
 
 ##form the Arab front / super event
 ARAB_LEAGUE_RESOLUTION.28.t:0 "[GetNewspaperHeader]La libération de [FROM.GetAdjective] [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.28.d:0 "\nLa communauté [FROM.GetAdjective] a obtenu officiellement son indépendance par [arab_league_nation_global_target.GetName]. Cela fait suite à une récente résolution de la Ligue arabe appelant à la libération des [FROM.GetAdjective] peuples. Le gouvernement du [arab_league_nation_global_target.GetName] a publié une très brève déclaration disant qu'il avait choisi de se conformer à la résolution de la Ligue arabe, non pas par peur ou par pression, mais parce qu'il avait également conclu que cette voie était la meilleure pour assurer la paix. À la Ligue arabe, les principaux diplomates ont été enthousiasmés par cette évolution, la qualifiant d'une des grandes expressions de l'autodétermination de ces derniers temps. La presse internationale semble largement convaincue que ce résultat est le meilleur pour établir une paix durable."

 ##unite the league / super event
 ARAB_LEAGUE_RESOLUTION.29.t:0 "[GetNewspaperHeader]Résolution rejetée par la Ligue arabe"
 ARAB_LEAGUE_RESOLUTION.29.d:0 "\nLe [ARAB_LEAGUE_SELECTION_BUTTON_3]a été largement battu à la Ligue arabe après un débat tendu. Les analystes estiment que la résolution manquait de soutien de la part des principaux États arabes et que ceux qui s'y opposaient ont réussi à faire valoir que les inconvénients potentiels d'une telle résolution l'emportaient sur toute conséquence positive. Même si l'échec de l'adoption de la résolution a suscité une certaine déception, de nombreux diplomates ont été satisfaits du fait qu'à la Ligue arabe, la communauté arabe ait pu discuter, débattre, puis voter. Un tel scénario aurait semblé presque impossible jusqu'à une époque récente."
 ARAB_LEAGUE_RESOLUTION.30.d:0 "\nUne résolution récente, [ARAB_LEAGUE_SELECTION_BUTTON_3], a fait l'objet du veto d'un membre permanent du Conseil de sécurité de la Ligue arabe. Le veto est critiqué par certains représentants qui notent qu'il a mis fin à tout espoir de mener à bien un débat sur la résolution et de parvenir à un consensus. D'autres critiquent le veto comme étant un stratagème politique destiné à protéger un État ami. Cependant, certains pays ont exprimé leur soutien au veto, accusant la résolution initiale d'être politiquement motivée dès le départ. Cela rendait le veto non seulement inévitable, mais aussi la bonne décision. Quoi qu'il en soit, la résolution est effectivement morte."

 ###misc 
 ARAB_LEAGUE_RESOLUTION.90.t:0 "[GetNewspaperHeader][arab_league_nation_global_target.GetName] Rejette l'appel de la Ligue arabe à la dénucléarisation"
 ARAB_LEAGUE_RESOLUTION.91.t:0 "[GetNewspaperHeader]Dénucléarisation en [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.100.t:0 "[GetNewspaperHeader][arab_league_nation_global_target.GetName] Rejette l'appel de la Ligue arabe au retrait des armes de destruction massive"
 ARAB_LEAGUE_RESOLUTION.101.t:0 "[GetNewspaperHeader][arab_league_nation_global_target.GetName] Démantèle ses armes de destruction massive"
 ARAB_LEAGUE_RESOLUTION.131.t:0 "[GetNewspaperHeader][arab_league_state_owner_global_target.GetName] Refuse de revenir [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.132.t:0 "[GetNewspaperHeader][arab_league_state_owner_global_target.GetName] Accepte de revenir [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.30.t:0 "[GetNewspaperHeader][ARAB_LEAGUE_SELECTION_BUTTON_3] Veto"

 ARAB_LEAGUE_RESOLUTION.90.d:0 "\nLe gouvernement des [arab_league_nation_global_target.GetName] a rejeté avec défi la résolution récemment adoptée par la Ligue arabe appelant à la dénucléarisation. Dans sa réponse officielle, le gouvernement a insisté sur le fait que la résolution violait sa souveraineté et que la Ligue arabe n'avait pas le droit de dicter quelles technologies pouvaient ou non être exploitées pour le bien de la nation. Ils ont conclu en déclarant qu'aucune organisation ou puissance étrangère ne peut dicter ses exigences au peuple. Le secrétaire général de la Ligue arabe n'a pas eu de réponse immédiate, mais les puissances mondiales se bousculent pour trouver une réponse appropriée à cette dernière provocation."
 ARAB_LEAGUE_RESOLUTION.91.d:0 "\nAujourd'hui, la joie était répandue parmi les diplomates et les dirigeants de la Ligue arabe. Cela fait suite à l'annonce selon laquelle [arab_league_nation_global_target.GetName] avait accepté de mettre fin à son programme nucléaire et de démanteler toutes les armes nucléaires. Une équipe de spécialistes de la Ligue arabe devrait être dépêchée pour superviser le processus. De nombreux dirigeants mondiaux ont publié des déclarations saluant le [arab_league_nation_global_target.GetName] pour sa décision de mettre la paix et la stabilité mondiales au premier plan. En effet, les représentants des [arab_league_nation_global_target.GetName] ont déjà indiqué qu'ils s'attendaient à de meilleures relations et à des bénéfices de la part de la communauté mondiale suite à son adhésion à la résolution de la Ligue arabe."
 ARAB_LEAGUE_RESOLUTION.100.d:0 "\nDans une réponse laconique, le gouvernement du [arab_league_nation_global_target.GetName] a complètement rejeté la résolution de la Ligue arabe appelant au retrait de toutes ses armes de destruction massive. [arab_league_nation_global_target.GetName] soutient qu'accepter une telle demande compromettrait leur sécurité et leur souveraineté. Ils ont condamné la Ligue arabe comme étant moralement en faillite et comme une marionnette au service des intérêts étrangers. Le secrétaire général de la Ligue arabe a exprimé sa frustration face à cette déclaration. Un diplomate de premier plan n'a pas été surpris par la réponse, affirmant qu'elle montrait exactement pourquoi la communauté internationale avait décidé d'agir de manière décisive. Le Conseil de sécurité abordera probablement la question lors de sa prochaine session."
 ARAB_LEAGUE_RESOLUTION.101.d:0 "\nLa Ligue arabe a le plaisir d'annoncer que le gouvernement du [GetNewspaperHeader][arab_league_nation_global_target.GetName] a récemment informé le Conseil de sécurité de son intention de mettre fin et de détruire ses armes de destruction massive. Ceci fait suite à un récent vote de la Ligue arabe exigeant la fin du programme. Le secrétaire général de la Ligue arabe a félicité les dirigeants des [GetNewspaperHeader][arab_league_nation_global_target.GetName] pour avoir pris la bonne décision en faveur de la paix mondiale. Dans une déclaration distincte, un porte-parole de [GetNewspaperHeader][arab_league_nation_global_target.GetName] a confirmé qu'il mettrait fin au programme, mais a insisté sur le fait que ses actions n'étaient pas motivées par la peur ou l'intimidation. Au lieu de cela, il a été conçu en tenant compte des désirs de son peuple. La presse internationale n'a pas tari d'éloges sur ces récents événements et sur la crédibilité qu'ils confèrent à la Ligue arabe en tant qu'organisation proactive en faveur de la paix mondiale."
 ARAB_LEAGUE_RESOLUTION.131.d:0 "\n[arab_league_state_owner_global_target.GetName] a défié la Ligue arabe et la communauté internationale en refusant de revenir [arab_league_state_global_target.GetName]. La décision de refuser a déclenché des protestations de colère dans la zone contestée et en dehors de la Ligue arabe, les partisans de la résolution exigeant que des mesures soient prises. Dans sa déclaration, le gouvernement des [arab_league_state_owner_global_target.GetName] a déclaré que la résolution de la Ligue arabe constituait une ingérence directe dans ses affaires intérieures et était illégale. Il a ajouté que toute décision concernant sa terre sacrée et son peuple serait prise par la nation et non par des puissances étrangères s'immisçant dans les affaires des autres. Le Conseil de sécurité de la Ligue arabe devrait réagir à ces derniers développements lors de sa prochaine session."
 ARAB_LEAGUE_RESOLUTION.132.d:0 "\nDans ce qui est salué comme une victoire majeure pour la paix mondiale, [arab_league_state_global_target.GetName] a accepté de revenir [arab_league_state_global_target.GetName]. Le gouvernement des [arab_league_state_global_target.GetName] a déclaré qu'il était une nation responsable et qu'il accepterait la volonté de la communauté mondiale. Il a insisté sur le fait que la décision avait été prise non par pression ou par peur, mais par respect. Le secrétaire général de la Ligue arabe a salué cette décision et a exhorté toutes les nations à tirer les leçons de cet exemple. De nombreux journaux du monde entier ont publié des articles élogieux faisant l'éloge de la Ligue arabe et de sa capacité à apporter des changements en faveur de la paix et de la stabilité mondiales. Cependant, certains diplomates ont exprimé en privé leurs inquiétudes quant au fait que certains pays pourraient désormais tenter de manipuler la Ligue arabe pour atteindre leurs objectifs territoriaux."
 
 ###GUI actions
 ARAB_LEAGUE_RESOLUTION.506.t:0 "\nUne menace de sanction"
 ARAB_LEAGUE_RESOLUTION.506.d:0 "\nUn développement inquiétant s'est produit : [from.GetName] nous a menacé de sanctions si nous n'acceptions pas leurs propositions. Pouvons-nous nous permettre d'ignorer leurs menaces, ou allons-nous nous soumettre à leurs demandes et les laisser diriger tout le monde ?"
 ARAB_LEAGUE_RESOLUTION.507.t:0 "\nUne sanction de menace"
 ARAB_LEAGUE_RESOLUTION.507.d:0 "\nNotre manoeuvre a été rejetée et [from.GetName] a refusé de se soumettre à nos exigences. Comment procédons-nous ?"
 ARAB_LEAGUE_RESOLUTION.508.t:0 "\nProposition d'accord de défense mutuelle"
 ARAB_LEAGUE_RESOLUTION.508.d:0 "\nQue cela nous intéresse ou non, il est encourageant que [from.GetName] cherche à signer un traité défensif avec nous, dans l'assurance mutuelle d'une aide militaire."
 ARAB_LEAGUE_RESOLUTION.509.t:0 "\nCorruption découverte !"
 ARAB_LEAGUE_RESOLUTION.509.d:0 "\nIl semble que [from.GetName] fasse peu de cas de nos fonctionnaires, car ils ont cherché à les détourner de pots-de-vin. Nous ne pouvons pas laisser cela tel quel."
 
 
 