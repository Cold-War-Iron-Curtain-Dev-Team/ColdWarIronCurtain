l_french:
summerolympics.1.d:0 "Les Jeux de la XVe Olympiade se sont déroulés la semaine dernière à Helsinki, en Finlande, alors que des dizaines d'athlètes viennent montrer leurs capacités dans les sports d'été. Helsinki a été choisie pour accueillir les Jeux de la XIIe Olympiade de 1940 après que Tokyo ne pouvait plus les accueillir en raison de la Seconde Guerre mondiale. Même alors, Helsinki n'a pas pu l'accueillir après cela en raison de la Seconde Guerre mondiale et les Jeux olympiques d'été de 1940 ont été annulés. C'est la ville la plus au nord qui accueille les Jeux olympiques d'été. Les États-Unis arrivent en 1ère place avec 76 médailles, l'URSS suit avec 71 médailles en 2ème place et la Hongrie en 3ème avec 42 médailles. Les prochains Jeux olympiques d'été auront lieu à Melbourne, en Australie, en 1956."
summerolympics.2.d:0 "Les Jeux de la XVIe Olympiade ont eu lieu la semaine dernière à Melbourne, en Australie. L'Australie n'a pas encore accueilli de jeux olympiques et c'est la première fois. Des centaines d'athlètes sont venus du monde entier dans la ville la plus méridionale pour accueillir les Jeux olympiques d'été. L'Égypte, l'Irak et le Liban ont protesté ou boycotté ces Jeux olympiques d'été en réponse à la crise de Suez. Les Pays-Bas, le Cambodge, l'Espagne et la Suisse ont tous protesté ou boycotté ces Jeux olympiques également en raison de l'implication des Soviétiques dans la révolution hongroise et sans aucune conséquence de celle-ci. L'URSS a remporté la première place avec 98 médailles, les États-Unis deuxième avec 74 médailles et l'Australie troisième avec 35 médailles. Il est annoncé que les prochains Jeux olympiques d'été auront lieu à Rome, en Italie, en 1960."
summerolympics.3.d:0 "Les Jeux de la XVIIe Olympiade ont eu lieu à Rome, en Italie, la semaine dernière. C'est la première fois que les Jeux olympiques d'été se déroulent à Rome. Rome accueillait à l'origine les Jeux olympiques d'été de 1908, mais en raison de l'éruption du Vésuve, elle a refusé de les accueillir. L'Italie a accueilli les VIIes Jeux Olympiques d'hiver il y a seulement 4 ans, en 1956. Abebe Bikila, d'Éthiopie, est devenu le premier champion olympique africain noir après avoir remporté le marathon olympique. Cassius Clay a également remporté la boxe masculine et remporté une médaille d'or pour les États-Unis. L'URSS a remporté un nombre incroyable de 103 médailles, les États-Unis étant deuxièmes avec 71 médailles et l'Italie troisième avec 36 médailles. Les prochains Jeux olympiques d'été auront lieu à Tokyo, au Japon, en 1964."
summerolympics.4.d:0 "Les Jeux de la XVIIe Olympiade ont eu lieu à Tokyo, au Japon, la semaine dernière, alors que des milliers de personnes ont pu observer leurs athlètes faire de leur mieux. Tokyo avait été initialement sélectionnée pour accueillir les Jeux de la XIIe Olympiade de 1940, mais en raison de la Seconde Guerre mondiale, les Jeux olympiques d'été de 1940 ont été déplacés à Helsinki. Les Jeux olympiques d'été de 1940 n'ont toujours pas eu lieu à Helsinki après que la Seconde Guerre mondiale ait atteint la Finlande et ont finalement été annulés. Après 15 ans, les Jeux olympiques d'été sont de retour à Tokyo. Les Jeux olympiques d'été de Tokyo ont connu un grand succès puisque des millions de personnes les ont regardés dans le monde entier. Il y a eu une certaine controverse autour de la RPC, de la RPDC et de l'Indonésie avec GANFEO et ces 3 pays ont donc protesté ou boycotté ces Jeux olympiques. Les États-Unis ont remporté la première place avec 96 médailles, l'URSS la deuxième avec 96 médailles et le Japon la troisième avec 29 médailles. Les prochains Jeux olympiques d'été auraient lieu à Mexico, au Mexique, en 1968."
summerolympics.5.d:0 "Les Jeux de la XIX Olympiade ont eu lieu à Mexico. C'est la première fois que les Jeux Olympiques ont lieu dans un pays d'Amérique latine ou dans un pays hispanophone. Les Jeux olympiques étaient en état d'alerte alors que le Mexique était le théâtre de manifestations et d'émeutes massives. Dix jours avant le début des Jeux olympiques d'été, les étudiants se sont rassemblés sur la Plaza de las Tres Culturas à Tlatelolco pour réclamer davantage de droits civils et démocratiques. Le gouvernement a ordonné la dispersion du rassemblement et a envoyé 5 000 soldats et 200 chars sur la place. Des centaines d'étudiants ont été tués et des centaines d'autres ont été blessés et arrêtés. Une autre controverse concerne les athlètes américains, Tommie Smith et John Carlos, qui sont montés sur le podium lors de la cérémonie de remise des médailles, portant des chaussettes noires, sans chaussures ni insignes des droits civiques. Ils ont ensuite baissé la tête et chacun a levé d'un air de défi un poing ganté de noir pendant que le Star Spangled Banner était joué, en solidarité avec le Black Freedom Movement aux États-Unis. Les États-Unis ont remporté la première place avec un nombre incroyable de 107 médailles, l'URSS la deuxième place avec 91 médailles et le Japon la troisième avec 25 médailles. Les prochains Jeux olympiques d'été auront lieu à Munich, en République fédérale d'Allemagne, en 1972."
summerolympics.6.d:0 "Les Jeux de la XXe Olympiade ont eu lieu la semaine dernière à Munich, en RFA. Les Jeux olympiques d'été de 1916 devaient initialement avoir lieu à Berlin, en Allemagne, mais en raison de la Première Guerre mondiale, les Jeux olympiques d'été de cette année-là ont été annulés. Vingt ans plus tard, l'Allemagne accueillera les Jeux olympiques d'été de 1936 à Berlin. C'est désormais la deuxième fois que l'Allemagne accueille les Jeux olympiques d'été. Ces Jeux olympiques étaient populaires et des millions de personnes les regardaient dans le monde entier. Cependant, ces Jeux olympiques ont été éclipsés par l'enlèvement et la prise en otage de 11 athlètes israéliens par une organisation terroriste palestinienne connue sous le nom de Septembre Noir. La police locale a tenté de les secourir, mais l'opération a échoué et les 11 otages ont été tués et un policier a été tué dans la fusillade. L'URSS a gagné la 1ère place car il lui manquait 100 médailles en remportant seulement 99 médailles. Les États-Unis et la République démocratique allemande obtiennent les 2e et 3e places. Les États-Unis ont remporté 94 médailles et la RDA 66 médailles. Il a été annoncé que les prochains Jeux olympiques d'été se dérouleraient à Montréal, au Canada, en 1976."
summerolympics.7.d:0 "Les Jeux de la XXIe Olympiade ont eu lieu à Montréal, au Canada, pendant une semaine. C'est la première fois qu'un jeu olympique a lieu au Canada. Les États-Unis avaient ce que les gens appellent la plus grande équipe de boxe puisque des noms comme Sugar Ray Leonard, Michael Spinks, Howard Davis Jr., Leon Spinks et Leon Randolph ont tous remporté des médailles d'or en boxe masculine. 29 pays africains ont protesté ou boycotté ces Jeux olympiques après que le CIO ait refusé d'interdire à la Nouvelle-Zélande d'y participer après son implication en Afrique du Sud. La République de Chine a également protesté ou boycotté parce que le CIO avait qualifié la RPC de Chine. L'URSS a remporté la première place avec un nombre incroyable de 125 médailles, les États-Unis ont remporté 94 médailles et la RDA est arrivée en troisième position avec 90 médailles. Les prochains Jeux olympiques d'été auront lieu à Moscou, en URSS, en 1980."
summerolympics.8.d:0 "Les Jeux de la XXIIe Olympiade ont eu lieu cette semaine à Moscou, en URSS. Il s'agissait des premiers Jeux Olympiques organisés en Europe de l'Est et des premiers Jeux Olympiques organisés dans un pays de langue slave. Il s'agissait également des premiers Jeux Olympiques organisés dans un pays socialiste. Cependant, plus de 66 pays ont protesté ou boycotté ces Jeux olympiques d'été en raison de l'agression soviétique au Moyen-Orient et de leur agression contre l'Afghanistan. L'URSS a gagné la 1ère place avec 195 médailles, la RDA a remporté 126 médailles et la Bulgarie est arrivée 3ème avec 41 médailles. Les prochains Jeux olympiques d'été auront lieu à Los Angeles, aux États-Unis, en 1984. On craint un nouveau boycott massif, cette fois-ci, de la part de l'Europe de l'Est et de l'URSS."
summerolympics.9.d:0 "Les Jeux de la XXIIe Olympiade se sont déroulés la semaine dernière à Los Angeles, aux États-Unis. C'était la deuxième fois que les Jeux olympiques se déroulaient à Los Angeles après les Jeux de la Xe Olympiade de 1932. Il y a eu une énorme controverse autour de ces Jeux olympiques d'été alors que 18 pays allant de l'Europe de l'Est à l'Asie du Sud-Est et aux Caraïbes ont protesté ou boycotté ces Jeux olympiques d'été en guise de contre-manifestation et de boycott des 66 pays qui ont protesté et boycotté les Jeux de la XXIIe Olympiade de 1980. Au lieu de cela, les pays boycottés organiseront leur propre événement multisports appelé Jeux de l'amitié à Moscou le mois prochain. Les États-Unis sont arrivés à la première place avec un nombre incroyable de 174 médailles remportées, la RFA est arrivée en deuxième position avec 59 médailles et la Roumanie est arrivée en troisième position avec 53 médailles. Les prochains Jeux olympiques d'été auront lieu à Séoul, en République de Corée, en 1988. Cette fois-ci, on craint un nouveau boycott et le CIO a déclaré qu'il ferait de son mieux pour parvenir à un accord entre les deux parties."
summerolympics.10.d:0 "Les Jeux de la XXIVe Olympiade se sont déroulés à Séoul, en République de Corée, la semaine dernière. C'était la première fois que les Jeux olympiques avaient lieu dans la péninsule coréenne. Ces Jeux olympiques d'été ont été protestés ou boycottés par la RPDC, Cuba, l'Éthiopie, l'Albanie et les Seychelles parce que le CIO avait choisi Séoul comme ville hôte. Heureusement, il n'y a pas eu de protestation massive ou de boycott comme lors des Jeux olympiques d'été de 1980 et 1984. L'URSS est arrivée en première position avec 132 médailles, la RDA en deuxième position avec 102 médailles et les États-Unis en troisième position avec 94 médailles. Les prochains Jeux olympiques d'été auront lieu à Barcelone, en Espagne, en 1992."
summerolympics.11.d:0 "Les Jeux de la XXVe Olympiade se sont déroulés à Barcelone, en Espagne, ces deux dernières semaines. Il s'agit des premiers Jeux olympiques d'été organisés pour l'Espagne et sans aucune protestation ni boycott. L'équipe masculine américaine de basket-ball a remporté l'or et s'appelle la « Dream Team » composée de Michael Jordan, Larry Bird, Magic Johnson et d'autres. L'équipe unifiée est arrivée à la première place avec 112 médailles, tandis que les États-Unis sont arrivés à la deuxième place avec 108 médailles. La RFA arrive 3ème avec 82 médailles remportées. Les prochains Jeux olympiques d'été auront lieu à Atlanta, aux États-Unis, en 1996."
summerolympics.12.d:0 "Les Jeux de la XXVIe Olympiade se sont déroulés à Atlanta, aux États-Unis, ces deux dernières semaines. Ces Jeux olympiques sont aussi spéciaux que les Jeux de la I Olympiade commencés il y a 100 ans à Athènes, en Grèce. L'Amérique a maintenant accueilli 6 Jeux olympiques avec les Jeux de la IIIe Olympiade de 1904 à Saint-Louis, les IIIes Jeux olympiques d'hiver de 1932 à Lake Placid, les Jeux de la Xe Olympiade de 1932 à Los Angeles, les VIIIes Jeux olympiques d'hiver de 1960, les XIIIe Jeux olympiques d'hiver de 1980 à Lake Placid et les XVe Jeux olympiques d'hiver de 1984 à Los Angeles. Cependant, le 27 juillet, une bombe artisanale a explosé au Parc olympique du Centenaire. 2 personnes sont mortes et 111 ont été blessées. Aucun suspect n'a été trouvé. Les États-Unis sont arrivés premiers avec 101 médailles, l'Allemagne 2ème avec 65 médailles et les Russes 3ème avec 63 médailles. Les prochains Jeux olympiques d'été auront lieu à Sydney, en Australie, en 2000."
summerolympics.13.d:0 "Les Jeux de la XXVIIe Olympiade se sont déroulés à Sydney, en Australie, ces deux dernières semaines. C'était la deuxième fois que l'Australie accueillait les Jeux olympiques d'été après les Jeux de la XVIe Olympiade de 1956. Ces Jeux olympiques d'été sont les premiers du nouveau millénaire. Les États-Unis sont arrivés à la première place avec 97 médailles, la Russie à la deuxième place avec 88 médailles et la République populaire de Chine à la troisième place avec 59 médailles. Les prochains Jeux olympiques d'été auront lieu à Athènes, en Grèce, en 2004."
summerolympics.14.d:0 "Les Jeux de la XXVIIe Olympiade se sont déroulés à Athènes, en Grèce, ces deux dernières semaines. La dernière fois que la Grèce a accueilli les Jeux olympiques, c'était lors des Jeux de la Ie Olympiade de 1896 à Athènes. Plus de 301 événements se sont déroulés avec des milliers d'athlètes d'autres pays. Les États-Unis sont arrivés premiers avec 102 médailles, la Russie deuxième avec 92 médailles et la République populaire de Chine troisième avec 63 médailles. Il a été annoncé que les prochains Jeux olympiques d'été se tiendraient à Pékin, en RPC, en 2008."
summerolympics.15.d:0 "Les Jeux de la XXIXe Olympiade se sont déroulés à Pékin, en RPC, ces deux dernières semaines. C'est la première fois que la RPC accueille un événement olympique. Ces Jeux olympiques ont été les Jeux olympiques les plus regardés jusqu'à présent, avec 4,7 milliards de personnes du monde entier. La RPC est arrivée à la première place avec 110 médailles, les États-Unis à la deuxième place avec 102 et la Russie à la troisième place avec 60 médailles. Il a été annoncé que les prochains Jeux olympiques d'été se tiendraient à Londres, au Royaume-Uni, en 2012."
summerolympics.16.d:0 "Les Jeux de la XXXe Olympiade se sont déroulés à Londres, au Royaume-Uni, au cours des deux dernières semaines, alors que des millions de personnes dans le monde ont regardé leurs athlètes faire de leur mieux. C'est la troisième fois que les Jeux olympiques se déroulent à Londres et c'est actuellement la seule ville à accueillir trois Jeux olympiques. Les Jeux de la XIIIe Olympiade de 1944 devaient initialement avoir lieu à Londres, mais en raison des combats de la Seconde Guerre mondiale, les jeux ont été annulés. Londres accueillerait alors les Jeux de la XIVe Olympiade de 1948 et serait les premiers Jeux olympiques d'été dans un monde d'après la Seconde Guerre mondiale. Usain Bolt de Jamaïque a remporté l'or et est devenu l'homme le plus rapide du monde avec 44,72 km/h (27,8 mph). Les États-Unis ont obtenu la première place avec 103 médailles, la RPC la deuxième avec 91 médailles et le Royaume-Uni la troisième avec 65 médailles. Les prochains Jeux olympiques d'été auront lieu à Rio de Janeiro, au Brésil, en 2016."
summerolympics.17.d:0 "Les Jeux de la XXXIe Olympiade se sont déroulés à Rio de Janeiro, au Brésil, ces deux dernières semaines. Il s'agit de la première organisation olympique organisée par le Brésil et également des premiers Jeux olympiques organisés en Amérique du Sud. Plus de 10 000 athlètes ont participé aux Jeux olympiques de cette année. Les États-Unis ont obtenu la première place avec 121 médailles, le Royaume-Uni la deuxième avec 67 médailles et la RPC la troisième avec 65 médailles. Il a été annoncé que les prochains Jeux olympiques d'été se tiendraient à nouveau à Tokyo, au Japon, en 2020."