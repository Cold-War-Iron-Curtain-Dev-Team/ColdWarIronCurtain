#Events
 smk.3.t: "PROCLAMATION DE L'INDÉPENDANCE DES MOLUQUES DU SUD"
 smk.3.d: "Afin de répondre à la véritable volonté, aux demandes et aux désirs du peuple des Moluques du Sud, nous proclamons par la présente l'INDÉPENDANCE DES MOLUQUES DU SUD, de facto et de jure, sous la forme d'une République, séparée de toutes relations de dépendance vis-à-vis de l'État d'Indonésie orientale et de la République des États-Unis d'Indonésie (R.I.S.). Au motif que N.I.T. N'est plus en mesure de maintenir sa position d'État constituant conformément aux règles encore en vigueur de la Charte de Denpasar, ainsi qu'à la décision du Conseil des Moluques du Sud du 11 mars 1947, tandis que le R.I.S. A déjà agi en contradiction avec les décisions du K.M.B. (Table ronde) et sa propre Constitution.\n\nAmbon, le 25 avril 1950\n\nGouvernement des Moluques du Sud"
 smk.3.a: "J.H. Manuhutu"
 smk.4.t: "Un autre jour, un autre problème"
 smk.4.d: "Nous avons reçu un rapport détaillé du gouvernement récemment établi des Moluques du Sud, qui a sollicité notre soutien dans son conflit en cours avec l'Indonésie. Cette situation est critique, car l'administration des Moluques du Sud s'efforce d'affirmer son indépendance et de maintenir sa souveraineté face aux pressions militaires et politiques de l'Indonésie. Ils croient que notre aide pourrait être cruciale dans leur lutte.\n\nIl est essentiel de reconnaître que le choix que nous ferons concernant cette demande aura des implications importantes pour nos relations diplomatiques. Soutenir les Moluques du Sud pourrait renforcer nos liens avec eux et nous positionner comme un allié clé. À l'inverse, cela pourrait mettre à rude épreuve nos relations avec l'Indonésie."
 smk.4.a: "Donnons le feu vert à cela..."
 smk.4.b: "Nous ne devrions pas compromettre nos relations avec l'Indonésie !"
 smk.7.t: "Les États-Unis ont décrété un cessez-le-feu !"
 smk.9.t: "Envoi d'une délégation à Ambon"
