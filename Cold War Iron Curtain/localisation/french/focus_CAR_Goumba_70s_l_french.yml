l_french: 

 CAR_70s_Create_the_Patriotic_Front_for_Progress:0 "Créer le FPP"
 CAR_70s_Create_the_Patriotic_Front_for_Progress_desc:0 "Le FPP, ou Front Patriotique pour le Progrès, est nécessaire pour consolider le parti et la popularité de Goumba."
 CAR_70s_No_Elections:0 "Pas d'élections"
 CAR_70s_No_Elections_desc:0 "Cela ne sert à rien d'organiser des élections. Nos fonctionnaires décideront eux-mêmes."
 CAR_70s_Maoist_Dictatorship:0 "Dictature maoïste"
 CAR_70s_Maoist_Dictatorship_desc:0 "Goumba a l'expérience de la mobilisation populaire. Il mobilisera à nouveau le peuple."
 CAR_70s_Central_African_Peoples_Republic:0 "République populaire centrafricaine"
 CAR_70s_Central_African_Peoples_Republic_desc:0 "Déclarons la nouvelle République."
 CAR_70s_Neo_Stalinism:0 "Néostalinisme"
 CAR_70s_Neo_Stalinism_desc:0 "Notre objectif doit être l'industrialisation immédiate."
 CAR_70s_Return_to_the_Farms_and_Fields:0 "Retour aux fermes et aux champs"
 CAR_70s_Return_to_the_Farms_and_Fields_desc:0 "Nous devons d'abord donner la priorité à nos collaborateurs."
 CAR_70s_Industrialize_as_One_Nation:0 "Industrialiser comme une seule nation"
 CAR_70s_Industrialize_as_One_Nation_desc:0 "Notre nation avance toujours."
 CAR_70s_Purges:0 "Purger"
 CAR_70s_Purges_desc:0 "Nous avons parmi nous des indésirables."
 CAR_70s_Cultural_Revolution:0 "Révolution culturelle"
 CAR_70s_Cultural_Revolution_desc:0 "Nos anciennes et nouvelles pratiques doivent être abandonnées. Ils sont décadents et ne méritent pas notre peuple."
 CAR_70s_Envoy_to_PRC:0 "Envoyé en Chine"
 CAR_70s_Envoy_to_PRC_desc:0 "Nous devons voir comment l'État de Mao a mené ses réformes."
 CAR_70s_Our_Stance:0 "Notre position"
 CAR_70s_Our_Stance_desc:0 "Nous ne devons jamais hésiter quant à nos objectifs ou à nos convictions."
 CAR_70s_PRC_Aid:0 "Aide chinoise"
 CAR_70s_PRC_Aid_desc:0 "Nous devons faire appel à l'aide de nos frères."
 CAR_70s_Progressive_Dictatorship:0 "Dictature progressiste"
 CAR_70s_Progressive_Dictatorship_desc:0 "Notre premier objectif devrait être de faire progresser notre pays, et non une idéologie communiste peu connue."
 CAR_70s_Patriotic_Front_for_Progress:0 "Front pour le progrès"
 CAR_70s_Patriotic_Front_for_Progress_desc:0 "Faisons valoir que nous sommes un front, pas un parti, et que notre premier objectif est de faire progresser le pays."
 CAR_70s_Technocracy:0 "Technocratie"
 CAR_70s_Technocracy_desc:0 "Nous devons créer des cercles d'individus talentueux."
 CAR_70s_Industrialize_the_People:0 "Industrialiser les gens"
 CAR_70s_Industrialize_the_People_desc:0 "Nous devons oeuvrer à l'amélioration de la situation de notre peuple et à l'augmentation de notre PIB."
 CAR_70s_Teach_the_People:0 "Enseigner au peuple"
 CAR_70s_Teach_the_People_desc:0 "Nous devons augmenter notre taux d'alphabétisation !"
 CAR_70s_Envoy_to_the_USSR:0 "Envoyé en URSS"
 CAR_70s_Envoy_to_the_USSR_desc:0 "Travaillons ensemble avec le pays qui nous comprend le mieux."
 CAR_70s_Establish_a_Politurbo:0 "Créer un Politburo"
 CAR_70s_Establish_a_Politurbo_desc:0 "Nous devons créer un gouvernement collectif."
 CAR_70s_Influence_our_Neghbors:0 "Influencer nos voisins"
 CAR_70s_Influence_our_Neghbors_desc:0 "Le communisme doit s'étendre à toute l'Afrique. C'est un front de la guerre froide."
 CAR_70s_Pan_Africanism:0 "Panafricanisme"
 CAR_70s_Pan_Africanism_desc:0 "Nous devons encourager l'union éventuelle de tous les États africains en un seul."
 CAR_70s_The_Party_Line:0 "La ligne du parti"
 CAR_70s_The_Party_Line_desc:0 "Nous devons nous en tenir au conservatisme. Un changement radical ne nous mènera nulle part."
 CAR_70s_Mission_to_the_USSR:0 "Sommet de Bangui"
 CAR_70s_Mission_to_the_USSR_desc:0 "Invitons nos bienfaiteurs communistes."
 CAR_70s_Tempered_Industrialization:0 "Industrialisation tempérée"
 CAR_70s_Tempered_Industrialization_desc:0 "Notre industrialisation ne doit pas être trop rapide. Il doit tenir compte des conditions locales."
 CAR_70s_Get_Rid_of_Tradition:0 "Débarrassez-vous de la tradition"
 CAR_70s_Get_Rid_of_Tradition_desc:0 "La tradition n'aide personne dans ce pays."
 CAR_70s_Khruschyovke:0 "Khrouchtchevke"
 CAR_70s_Khruschyovke_desc:0 "Nous devons construire des maisons pour les gens. Prenons l'exemple de l'URSS et construisons de grands immeubles d'habitation."
 CAR_70s_Time_for_Elections:0 "L'heure des élections"
 CAR_70s_Time_for_Elections_desc:0 "La crise nationale est terminée. Rétablissons la démocratie."
 CAR_70s_Ban_MESAN:0 "Interdire MESAN"
 CAR_70s_Ban_MESAN_desc:0 "MESAN a prouvé qu'il ne pouvait pas se comporter correctement. Ils ne peuvent plus avoir aucun pouvoir."
 CAR_70s_FPP_Victory:0 "Victoire du FPP"
 CAR_70s_FPP_Victory_desc:0 "Le Front Patriotique pour le Progrès remporte les élections !"
 CAR_70s_Social_Democracy:0 "Social-démocratie"
 CAR_70s_Social_Democracy_desc:0 "Nous nous efforçons d'augmenter les capacités de l'homme ordinaire à travers la démocratie et le socialisme !"
 CAR_70s_Who_The_People_Are:0 "Qui sont les gens"
 CAR_70s_Who_The_People_Are_desc:0 "Nous devons faire appel à tous les segments de notre population."
 CAR_70s_Teachers_and_Researchers:0 "Enseignants et chercheurs"
 CAR_70s_Teachers_and_Researchers_desc:0 "Les enseignants constituent l'épine dorsale de notre pays et lui permettent de prospérer. Les chercheurs ouvrent la voie."
 CAR_70s_The_Farmers:0 "Les agriculteurs"
 CAR_70s_The_Farmers_desc:0 "Aidons nos agriculteurs, les gens qui nourrissent notre pays."
 CAR_70s_The_Workers:0 "Les ouvriers"
 CAR_70s_The_Workers_desc:0 "Notre petite industrie doit être encouragée. Nous encouragerons les avantages d'être un travailleur."
 CAR_70s_The_People:0 "Le peuple"
 CAR_70s_The_People_desc:0 "Notre politique consistant à favoriser le peuple d'abord ne doit pas être oubliée."
 CAR_70s_Allow_MESAN:0 "Autoriser MESAN"
 CAR_70s_Allow_MESAN_desc:0 "MESAN ne devrait pas être criminalisé pour les échecs de quelques-uns de ses principaux dirigeants."
 CAR_70s_Moderate_Victory:0 "Victoire modérée"
 CAR_70s_Moderate_Victory_desc:0 "Un nouveau mouvement centriste a pris le commandement de notre pays, un mouvement qui connaît la tromperie de MESAN."
 CAR_70s_Free_Trade:0 "Libre-échange"
 CAR_70s_Free_Trade_desc:0 "Le principe fondateur de la République doit être la concurrence et l'interdépendance."
 CAR_70s_Privitzation:0 "Privatisation"
 CAR_70s_Privitzation_desc:0 "La frénésie de nationalisation de Goumba était inutile. Libérons ces actifs au profit de l'industrie privée."
 CAR_70s_Political_Union_with_Chad:0 "Union politique avec le Tchad"
 CAR_70s_Political_Union_with_Chad_desc:0 "Nous devrions nous connecter avec notre voisin du Nord. Proposons un syndicat."
 CAR_70s_Customs_Union_with_Chad:0 "Union douanière avec le Tchad"
 CAR_70s_Customs_Union_with_Chad_desc:0 "Forts de notre union politique, nous devrions également créer une union douanière entre nos deux économies. Notre bois fera le commerce de l'uranium du Nord."
 CAR_70s_Ride_Capitalism_to_the_Future:0 "Roulez le capitalisme vers le futur"
 CAR_70s_Ride_Capitalism_to_the_Future_desc:0 "Nous attirerons les investissements grâce à nos marchés compétitifs."
 CAR_70s_Western_Imports:0 "Importations occidentales"
 CAR_70s_Western_Imports_desc:0 "Le protectionnisme de Goumba n'a fait que nous appauvrir. Rendons-nous plus riches."
 CAR_70s_Government_Stability:0 "Stabilité du gouvernement"
 CAR_70s_Government_Stability_desc:0 "Nous devons veiller à ce qu'il n'y ait plus de coups d'État. Les hommes forts doivent être éliminés."
 CAR_70s_French_Aid:0 "Aide française"
 CAR_70s_French_Aid_desc:0 "Les Français sont satisfaits du fonctionnement de notre démocratie. Ils nous enverront sûrement des cadeaux."
 CAR_70s_MESAN_Victory:0 "Victoire de MESAN"
 CAR_70s_MESAN_Victory_desc:0 "Étonnamment, MESAN a remporté les élections ! C'est sans précédent."
 CAR_70s_Renovate_Dackos_Reputation:0 "Rénover la réputation de Dacko"
 CAR_70s_Renovate_Dackos_Reputation_desc:0 "Dacko doit être vu comme un fervent anticommuniste qui a tenté de protéger cette nation de Goumba."
 CAR_70s_Justify_the_Coup:0 "Justifiez le coup d'État"
 CAR_70s_Justify_the_Coup_desc:0 "Le coup d'État n'était que la volonté du peuple."
 CAR_70s_Exile_Dacko:0 "Exiler Dacko"
 CAR_70s_Exile_Dacko_desc:0 "Notre gouvernement s'est effondré ! Bokassa, l'un des leaders du coup d'État, a pris le commandement de l'ensemble du gouvernement en exilant son homologue David Dacko."
 CAR_70s_Bokassa_the_Leader:0 "Bokassa le chef"
 CAR_70s_Bokassa_the_Leader_desc:0 "C'est le moment pour Bokassa de briller."
 CAR_70s_African_Communism:0 "Afrocommunisme"
 CAR_70s_African_Communism_desc:0 "À mesure que nos réformes entrent en vigueur, nous devons consolider qui nous sommes. Nous sommes communistes et nous attendrons le bon moment pour étendre notre pouvoir."
 CAR_70s_Foster_Specialists:0 "Spécialistes d'accueil"
 CAR_70s_Foster_Specialists_desc:0 "Tous les types de spécialistes sont nécessaires. Les architectes, les médecins et les planificateurs économiques devraient être encouragés."
 CAR_70s_Envoy_to_Yugoslavia:0 "Envoyé en Yougoslavie"
 CAR_70s_Envoy_to_Yugoslavia_desc:0 "Envoyons un envoyé auprès des Yougoslaves, des gens qui essaient de suivre la même ligne que nous."
 CAR_70s_Between_Two_Systems:0 "Entre deux systèmes"
 CAR_70s_Between_Two_Systems_desc:0 "Nous ne pouvons nous aligner ni sur les États-Unis ni sur l'URSS. Nous devons franchir la frontière entre démocratie et communisme."
 CAR_70s_Join_Non_Aligned_Movement:0 "Rejoignez le mouvement des non-alignés"
 CAR_70s_Join_Non_Aligned_Movement_desc:0 "Nous devons consolider notre neutralité."
 CAR_70s_Bide_Our_Time:0 "Attendez notre heure"
 CAR_70s_Bide_Our_Time_desc:0 "Notre type de socialisme doit attendre que le temps se répande."
 CAR_70s_Workers_Standards:0 "Normes des travailleurs"
 CAR_70s_Workers_Standards_desc:0 "Augmentons le salaire minimum et réduisons les heures de travail. Cela sera payant."
 CAR_70s_Films_for_the_People:0 "Des films pour le peuple"
 CAR_70s_Films_for_the_People_desc:0 "Les films sont un outil polyvalent pour créer l'amour pour notre régime. Qu'il s'agisse de films soviétiques ou de films locaux, cela renforcera notre position auprès du peuple."
 CAR_70s_Limited_Privatization:0 "Privatisation limitée"
 CAR_70s_Limited_Privatization_desc:0 "Une économie dirigée par l'État ne fait que concentrer le pouvoir. Nous devons permettre aux gens de faire ce qu'ils veulent."
 CAR_70s_Workers_Councils:0 "Conseils ouvriers"
 CAR_70s_Workers_Councils_desc:0 "Les conseils de travailleurs sont la fusion ultime du socialisme et de la démocratie."
 CAR_70s_Democracy_goumba:0 "Démocratie rajeunie"
 CAR_70s_Democracy_goumba_desc:0 "Nous ne pouvons désormais plus être qualifiés de communistes. Nous avons montré notre véritable neutralité."
 CAR_70s_Refuse_to_Bow_to_Neocolonialism:0 "Refusez de vous plier au néocolonialisme"
 CAR_70s_Refuse_to_Bow_to_Neocolonialism_desc:0 "Les Français n'ont pas leur mot à dire dans notre État. Les Britanniques non plus. Nous ne pouvons pas céder aux étrangers."
 CAR_70s_Socialism_with_a_Human_Face:0 "Le socialisme à visage humain"
 CAR_70s_Socialism_with_a_Human_Face_desc:0 "Notre peuple croit au socialisme. On peut le dire sans mentir."
