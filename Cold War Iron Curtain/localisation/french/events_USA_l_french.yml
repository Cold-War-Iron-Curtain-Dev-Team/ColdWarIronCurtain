usa_flavor.4.d:0 "Aujourd'hui marque la sortie du film \"Ils tirent sur les chevaux, n'est-ce pas ?\" basé sur un roman du même nom de 1935 d'Horace McCoy.\n\nRéalisé par Charlie Chaplin et mettant en vedette son fils aux côtés d'une jeune Marilyn Monroe dans un marathon de danse de l'époque de la Grande Dépression, essayant de survivre. Le film a reçu des critiques mitigées et connaît toujours des difficultés au box-office, même malgré la menace des purges hollywoodiennes et de la chasse aux sorcières communiste.\n\nParmi le public, il reste un succès retentissant, résumant parfaitement l'histoire et les idéaux du roman écrit il y a plus de 20 ans."
usa_flavor.3.d:0 "Des changements révolutionnaires dans le monde de la bande dessinée.\n\nCe matin, dans un communiqué commun publié dans leur magazine respectif, les deux géants de l'industrie ont annoncé qu'ils fusionneraient la semaine prochaine pour former Epic Comics.\n\nLes deux éditeurs connaissaient des difficultés économiques suite aux récentes restrictions imposées par le président Kefauver. La bande dessinée présentait une couverture mettant en vedette l'icône de National, Superman, combattant Captain America d'Atlas et intitulée \"L'événement qui modifiera l'histoire pour toujours!\"\n\nNous ne savons pas encore comment cette fusion affectera l'industrie de la bande dessinée, mais comme les ventes en précommande du prochain numéro montent en flèche et au grand dam du président Kefauver, cela pourrait bien être le début d'un regain d'intérêt pour le genre des super-héros au sein de la jeunesse américaine."
usa_flavor.2.d:0 "Célèbre cryptographe, mathématicien et ingénieur, Claude Shannon a publié un article intitulé « Théorie de la communication des systèmes secrets » dans le Bell System Technical Journal. L'article est une version déclassifiée d'un rapport qu'il a soumis en 1945, alors qu'il était cryptographe pour le gouvernement des États-Unis pendant la guerre. L'article offre la preuve que tous les chiffres théoriques incassables doivent répondre aux mêmes exigences que la technique de cryptage appelée tampon à usage unique. Shannon discute également de la cryptographie du point de vue de la théorie de l'information, un domaine dans lequel il est un pionnier. Bien que peu connu, cet article constitue le texte fondateur de la cryptographie moderne."
PBSUCCESS.50.d:0 "Le régime de gauche du Guatemala a consolidé son contrôle sur le pays et institué des mesures draconiennes pour freiner la dissidence et organiser de nouvelles nationalisations d'entreprises étrangères dans le pays, en particulier United Fruit Company, une société américaine vitale. La CIA a répondu avec l'opération PBSuccess, qui visait à établir des émissions de radio et à semer la peur et la panique parmi la population guatémaltèque. Dans cet environnement chaotique, l'armée guatémaltèque, avec ses dirigeants pro-américains et anticommunistes, serait en mesure de rallier même les officiers pro-gouvernementaux pour intervenir et mettre fin au régime de Jacob Arbenz. Cependant, ce plan a échoué. Une fois que la nouvelle d'un déploiement soviétique imminent a été divulguée, le président a pu ordonner à l'armée américaine d'envahir le Guatemala pour restaurer la démocratie et protéger les citoyens et les biens américains dans le pays, avec le soutien du peuple américain."
#Watergate and Agnew Event Chains
watergate.1.d:0 "Le président Nixon a ordonné à son procureur général John Mitchell de devenir président du nouveau Comité pour la réélection du président (CRP). Mitchell a démissionné de son poste au cabinet et supervisera le CPR. Le CPR rassemble de hauts partisans financiers, des alliés politiques et des conseillers du président pour assurer sa réélection. Le conseiller présidentiel John Dean et l'agent à la retraite du FBI Gordon Liddy jouent un rôle clé dans l'organisation. On s'attend à ce qu'ils tiennent le président au courant et l'aident à orienter des actions spécifiques. L'organisation s'efforcera de collecter des fonds pour la campagne, de la diriger plus efficacement, d'enquêter et de contrer les tactiques du Parti démocrate. Les opposants au Président appellent déjà le CRP du nom insultant de CREEP."
watergate.2.d:0 "Lors d'une récente réunion de haut niveau du Comité pour la réélection du président (CRP), l'ancien agent du FBI Gordon Liddy a proposé une vaste campagne d'espionnage contre le Parti démocrate. Le président du CPR, John Mitchell, a rejeté l'idée comme étant irréaliste. Lors d'une réunion ultérieure, Liddy a proposé une version beaucoup plus atténuée du plan, appelant à une mise sur écoute et à une photographie des documents de campagne au siège national du Parti démocrate. Mitchell et le conseiller présidentiel John Dean doivent déterminer s'ils doivent approuver la proposition, car le président ne peut pas en être informé. Ou s'ils devaient le rejeter et espérer que le CRP puisse remporter le parti sans informations privilégiées. Liddy a ajouté qu'il prévoyait de faire appel au consultant de la Maison Blanche et ancien agent de la CIA, Howard Hunt, un agent expérimenté, pour mettre en oeuvre le plan."
watergate_alt.1.d:0 "Après avoir reçu l'approbation et un financement clandestin du Comité pour la réélection du président (CRP), Gordon Liddy et John Dean ont travaillé pour constituer une équipe. Liddy a fait appel à Howard Hunt qui a réuni une équipe d'anciens agents de la CIA et du FBI. L'équipe a pénétré par effraction au siège national du Parti démocrate situé dans le complexe du Watergate à Washington D.C. Sans être détectée, l'équipe a pu mettre sur écoute les téléphones du président du Parti démocrate et de son principal conseiller. En raison de contraintes de temps, peu de photos des documents de campagne ont été prises. Cependant, les écoutes téléphoniques ont fourni des renseignements inestimables au CRP. Ils ont appris des détails sur le financement électoral du Parti démocrate, ses stratégies et ses priorités de financement, permettant au CRP de contrer et de prendre l'avantage dans plusieurs États. Avec cet avantage électoral, le CRP est confiant dans la victoire du président Nixon. L'équipe qui a réalisé l'écoute électronique sera rémunérée sur les fonds de la campagne pour un travail bien fait."
watergate.3.d:0 "Après avoir reçu l'approbation et un financement clandestin du Comité pour la réélection du président (CRP), Gordon Liddy et John Dean ont travaillé pour constituer une équipe. Liddy a fait appel à Howard Hunt qui a réuni une équipe d'anciens agents de la CIA et du FBI. L'équipe a pénétré par effraction au siège national du Parti démocrate situé dans le complexe du Watergate à Washington D.C. Sans être détectée, l'équipe a pu mettre sur écoute les téléphones du président du Parti démocrate et de son principal conseiller. Cependant, l'écoute électronique du président a échoué et un deuxième cambriolage a dû être effectué. Cette fois, un agent de sécurité a remarqué du ruban adhésif sur les portes, éveillant finalement ses soupçons. Il a appelé la police et les agents n'ont pas été prévenus car leur gardien n'a pas remarqué que les policiers en civil entraient dans le bâtiment. Par la suite, les cinq agents présents dans le bâtiment ont été arrêtés par la police. La presse locale enquête déjà sur cette bizarre effraction."
watergate.4.d:0 "Des membres éminents du Comité de réélection du président (CRP) et le conseiller présidentiel John Dean ont informé le président Nixon de l'opération bâclée du Watergate. Le président Nixon est particulièrement préoccupé car la police a trouvé les coordonnées de Howard Hunt parmi les agents arrêtés. Hunt est un consultant en sécurité bien connu de la Maison Blanche, donc la révélation de son implication va éveiller les soupçons. Le président est enclin à se joindre à la majorité des personnes présentes à la réunion pour initier une dissimulation immédiate et un déni de l'implication du CRP ou de la Maison Blanche. L'avantage serait d'éviter que cela ne devienne un scénario électoral. L'autre option consiste simplement à admettre le rôle du CRP dans le vol, à en imputer la responsabilité aux membres trop enthousiastes du groupe et à les renvoyer de l'administration. Cela préserverait le président mais pourrait s'avérer coûteux pour l'élection."
watergate.5.d:0 "L'un des premiers problèmes auxquels se heurte la dissimulation est de préserver l'affirmation publique selon laquelle le Comité pour la réélection du président (CRP) n'a pas été impliqué dans le cambriolage du Watergate. Le président du CRP, l'ancien procureur général John Mitchell, est particulièrement préoccupé par le sort de son épouse Martha Mitchell. Martha s'est fait un nom en tant que mondaine au franc-parler public. Elle a acquis une notoriété grâce à sa tendance à appeler les journalistes en buvant. Martha est actuellement en Californie, mais John Mitchell a informé les responsables de l'administration Nixon que lorsqu'elle découvrira les détails du Watergate, elle se rendra compte de l'implication du CRP, car l'un des hommes arrêtés était un ancien garde du corps de la famille. Son garde du corps Steve King est en place et il faut décider si on doit essayer de la garder silencieuse pendant au moins une semaine pour limiter une boule de neige médiatique autour du Watergate. L'autre option est de la laisser tranquille et de simplement minimiser ses déclarations en les qualifiant d'excentriques."
watergate.6.d:0 "L'administration Nixon a ordonné au garde du corps de Martha Mitchell, l'ancien agent du FBI Steve King, de la maintenir détenue en Californie et de la couper des médias et du téléphone. Cependant, elle a réussi à découvrir les détails du Watergate et a finalement appelé un ami journaliste. Elle a déclaré qu'elle divorcerait de son mari à moins qu'il ne quitte l'administration Nixon en raison de son rôle dans le cambriolage. L'appel a été interrompu par King qui a coupé la ligne téléphonique. Malgré l'intérêt des médias pour sa situation, ils ne sont pas parvenus à la joindre pendant une semaine. Lorsqu'ils l'ont fait, elle a affirmé avoir été détenue contre sa volonté et fortement droguée pour l'empêcher de parler aux médias. Cependant, ses affirmations ont transformé son histoire en une plaisanterie pour de nombreuses personnes dans le pays. Parmi les plus fervents partisans de Nixon, les affirmations selon lesquelles elle aurait été détenue de force et droguée semblent tirées par les cheveux, malgré les preuves matérielles qu'elle a montrées aux journalistes."
watergate.7.d:0 "Depuis que l'affaire du Watergate a été médiatisée, le Washington Post s'est particulièrement consacré à enquêter sur les liens potentiels avec la Maison Blanche. Les journalistes Bob Woodward et Carl Bernstein prennent la tête de l'affaire, développant les sources de la Maison Blanche et enquêtant sur l'origine de l'argent donné aux cambrioleurs capturés. Les hauts responsables de l'administration ont reconnu très tôt à quel point le Post était concentré sur son enquête et ont proposé deux manières de les gérer. La première consiste à discréditer activement et à cibler le Washington Post en le accusant de partialité et de colporter de fausses allégations. La plupart des autres médias ne semblent pas intéressés par le Watergate, se concentrant davantage sur la campagne électorale et nombreux sont ceux qui soutiendraient nos allégations. L'autre approche serait d'ignorer le journal et de le laisser agir, cela démontrerait notre insouciance et pourrait pousser le journal à considérer que ses enquêtes ne sont peut-être pas aussi révolutionnaires qu'il le pense."
watergate.8.d:0 "Wright Patman, membre du Congrès de longue date et président du comité bancaire, a conclu son enquête sur le Watergate. Patman a entrepris l'enquête en étudiant les billets de cent dollars impliqués dans le paiement des cambrioleurs et en essayant d'en retracer l'origine. Cependant, la Maison Blanche a lancé une campagne de déni, affirmant que l'enquête était politiquement motivée. Le leader de la minorité parlementaire, Gerald Ford, a joué un rôle majeur en entravant l'enquête, bloquant ses tentatives d'assigner des responsables de la Maison Blanche, ce qui a conduit à une enquête incomplète. D'autres démocrates ont également refusé d'aider Patman, estimant que son enquête entravait la campagne électorale et laissait le parti exposé à des accusations de motivation politique. Bien que Patman n'ait pas réussi à trouver l'origine de l'argent, le Washington Post et d'autres enquêteurs du Sénat étudient désormais la piste de l'argent afin de trouver un lien entre la Maison Blanche et le Watergate."
watergate.9.d:0 "Le juge Sirica a récemment condamné les clairons du Watergate reconnus coupables devant le tribunal. Certains ont plaidé coupable tandis que d'autres ont été reconnus coupables. Même si la Maison Blanche espérait que la condamnation définitive marquerait la fin de l'intérêt porté à cette affaire, il semble que l'intérêt des médias n'ait fait que s'accroître. Au cours du procès, des détails ont été révélés sur la piste financière des cambrioleurs provenant de la commission pour la réélection du président. Cela a accru l'intérêt du public pour cette affaire et a poussé les médias à enquêter sur le rôle du président Nixon dans le cambriolage du Watergate. De plus, le procès a révélé la participation de Howard Hunt et de Gordon Liddy. Tous deux sont d'anciens agents du renseignement ayant des liens connus avec la Maison Blanche. Il semble que l'enquête et l'intérêt des médias s'intensifient rapidement."
watergate.10.d:0 "Alors que la condamnation des cambrioleurs du Watergate ne fait que conduire à davantage d'enquêtes médiatiques et gouvernementales sur l'implication de la Maison Blanche, le président a rencontré ses principaux conseillers pour planifier la prochaine étape. Le président et certains de ses conseillers sont enclins à lancer une purge pour éliminer ceux qui ont procédé à la dissimulation initiale. Essentiellement, le plan consisterait à dissimuler la dissimulation et à mettre fin aux spéculations sur l'implication de Nixon dans le Watergate. L'autre groupe de conseillers affirme qu'en licenciant ces fonctionnaires ou en les déplaçant, cela ne fera qu'éveiller les soupçons, accroître le soutien du public aux enquêtes du Congrès et donner l'impression que la Maison Blanche est coupable. Au lieu de cela, ils suggèrent que tout le monde reste sur place et que la Maison Blanche ignore le reste des spéculations médiatiques."
watergate.11.d:0 "Le Sénat a récemment voté à une écrasante majorité en faveur de la création d'une commission du Watergate chargée d'enquêter sur le scandale du Watergate sous différents angles. De hauts responsables de la Maison Blanche, dont John Dean, ont témoigné, augmentant la pression sur la Maison Blanche. Interrogé, l'assistant de la Maison Blanche, Alexander Butterfield, a révélé que la Maison Blanche disposait d'un système d'enregistrement sur bande. Le procureur spécial du Watergate, Archibald Cox, a rapidement assigné les enregistrements à comparaître. Le président Nixon a invoqué des préoccupations en matière de sécurité nationale et de privilège exécutif et a refusé. Cox doit maintenant décider s'il acceptera cet argument de la Maison Blanche, mettant ainsi fin à l'enquête, ou s'il refusera de retirer l'assignation à comparaître. L'intérêt du Congrès et du peuple américain semble être la diffusion des enregistrements."
watergate.12.d:0 "Le refus du procureur spécial Archibald Cox de retirer son assignation à comparaître concernant les enregistrements de la Maison Blanche a atteint un point d'ébullition. Le président Nixon a proposé vendredi un compromis selon lequel le sénateur Stennis écouterait et transcrirait les enregistrements pour le procureur spécial. Cependant, Cox a refusé et le lendemain, Nixon a ordonné au procureur général de le licencier. Le procureur général a refusé, promettant au Congrès qu'il n'interviendrait pas et a démissionné. On a alors demandé au procureur général adjoint de licencier Cox, mais lui aussi a refusé et a démissionné. Cela a laissé le choix au solliciteur général qui a accédé à la demande de congédiement d'Archibald Cox. Le président Nixon a alors tenté de démanteler l'enquête, mais les démissions et les licenciements ont alimenté la colère du public, du Congrès et de la justice à l'égard de la Maison Blanche. Un nouveau procureur spécial, Léon Jaworski, sera alors choisi. La Maison Blanche espère qu'il limitera son enquête et ne l'élargira pas comme Cox a tenté de le faire."
watergate.13.d:0 "La question de la diffusion des bandes n'a pas pris fin avec le licenciement d'Archibald Cox en tant que procureur spécial. Son remplaçant, Leon Jaworski, a fini par suivre son prédécesseur et n'a pas bouclé l'enquête comme l'espérait le président Nixon. Au lieu de cela, la question de la diffusion des enregistrements de la Maison Blanche a été portée devant la Cour suprême. Dans une défaite retentissante pour le président, la Cour a voté contre Nixon et ses allégations de privilège exécutif et a ordonné la communication des enregistrements au procureur spécial. La Maison Blanche s'est conformée et les enregistrements initiaux ont révélé que Nixon approuvait la dissimulation et les plans de John Dean pour payer les participants au Watergate. Cependant, les enregistrements ne révèlent pas si le président Nixon était au courant des gains dès le début ou même du complot avant qu'il ne se produise. Quoi qu'il en soit, la sortie des cassettes est un coup dur pour Nixon et son équipe."
watergate.14.d:0 "La Maison Blanche a discrètement diffusé une cassette inédite datant de quelques jours seulement après le cambriolage. Dans l'enregistrement, le président Nixon apprend comment les cambrioleurs sont payés par sa campagne et approuve les plans de dissimulation. Il accepte de dire à la CIA de contacter le FBI pour arrêter leur enquête car le président ne pouvait pas prédire leur enquête. Beaucoup soutiennent que cette discussion indique une implication directe de Nixon dans le scandale du Watergate et une tentative directe d'interférer dans l'enquête. Pour sa défense, la Maison Blanche note que la CIA a conclu à juste titre que l'effraction ne constituait pas une menace pour la sécurité nationale et que le président Nixon a finalement ordonné au FBI de mener une enquête approfondie. Quoi qu'il en soit, la preuve évidente de l'implication du président Nixon dans la dissimulation dès les premiers jours a brisé sa position politique et sa légitimité."
watergate.15.d:0 "La diffusion de la cassette Smoking Gun ainsi que les autres actions du président Nixon et de son équipe ont conduit une délégation de dirigeants du Congrès à rendre visite au président. De hauts dirigeants républicains du Congrès ont informé le président qu'ils s'attendaient à ce que les trois articles de mise en accusation soient facilement adoptés par la Chambre et le Sénat. Les dirigeants républicains ont déclaré que le président serait à peine en mesure d'obtenir un quart des voix à la Chambre et que sa situation au Sénat était pire. Les sondages ont également indiqué que l'opinion publique s'était également retournée contre le président et qu'il lui restait deux choix. La première consiste à démissionner et à éviter l'humiliation d'un vote de destitution et d'un procès au Sénat. L'autre option est de refuser, de rester au pouvoir et d'être expulsé du pouvoir par la force. Peut-être que le peuple américain viendra le soutenir face à la colère du Congrès."
watergate.26.d:0 "Dans un discours télévisé à l'échelle nationale, le président Nixon a annoncé son intention de démissionner de son poste de président. Nixon a déclaré regretter de ne pas terminer son mandat. Il a déclaré que sa démission était dans le meilleur intérêt de la nation. Il espérait que sa décision aiderait l'Amérique à surmonter la controverse du Watergate et à guérir le pays. Le lendemain, Nixon et sa famille font leurs adieux au personnel de la Maison Blanche. Ils sont ensuite sortis en hélicoptère vers Andrews AFB avant d'être transportés par avion vers leur domicile en Californie. Après des années de polémiques et de révélations choquantes, la tumultueuse présidence touche à sa fin."
watergate.16.d:0 "La stratégie du président Nixon pour rester au pouvoir malgré la perte du soutien du Congrès s'est soldée par un échec. Le peuple américain ne s'est pas rallié au président Nixon et les deux chambres du Congrès l'ont rapidement condamné pour les trois chefs d'accusation dans ses articles de mise en accusation. Le président sera officiellement démis de ses fonctions et fera désormais l'objet de poursuites. Beaucoup pensent que son successeur pardonnera probablement Nixon, même si rien ne garantit que cela se produira. Le président a déclaré qu'il respectait les actions du Congrès et qu'il entamerait les préparatifs pour quitter ses fonctions dès que possible."
watergate.17.d:0 "\nLe président Nixon n'étant plus en fonction, le vice-président Spiro Agnew a prêté serment de président. Le président Agnew a récemment survécu à son propre scandale de corruption et a pu conserver son poste. Le politicien populaire du Maryland et vétéran de la Seconde Guerre mondiale espère pouvoir unir le peuple américain et mener une nouvelle campagne d'unité nationale. Nixon avait choisi Agnew comme candidat à la vice-présidence en raison de ses perspectives politiques centristes et il semble maintenant que le pays aura besoin de quelqu'un comme lui pour restaurer le prestige de l'exécutif et faire adopter une législation."
watergate.18.d:0 "\nLe président Nixon n'étant plus en fonction, le vice-président Gerald Ford a prêté serment de président. Le président Ford, un ancien membre modéré du Congrès, a succédé à Spiro Agnew, qui avait démissionné à la suite d'allégations de corruption, à la vice-présidence. Nixon a choisi Ford en raison de sa loyauté envers le parti et de sa réputation impeccable dans les deux allées du Congrès. Le président Ford a indiqué à ses amis qu'il prévoyait d'amener une présidence de guérison nationale et de restaurer la confiance dans le bureau et dans le Parti républicain. Reste à savoir s'il y parviendra."
watergate.19.d:0 "Le président Nixon n'étant plus en fonction, le président de la Chambre, Carl Albert, a prêté serment de président. Bien que le président de la Chambre soit le troisième à la présidence, le bureau du vice-président est actuellement vide. L'ancien vice-président Spiro Agnew avait récemment démissionné en raison d'allégations de corruption, sans rapport avec le scandale du Watergate. Le poste n'avait pas été pourvu en raison de l'obstruction démocrate lors des audiences de confirmation de la vice-présidence. Les retards étaient tels que Nixon n'a pas pu confirmer un vice-président à temps pour sa démission. Dans un geste sans précédent, la présidence a été confiée pour la première fois au président de la Chambre. Les républicains sont particulièrement indignés car le président est un démocrate et ils accusent les démocrates de ralentir les audiences de confirmation pour voler la présidence. Le président Albert estime que le pays a besoin d'un fervent défenseur de la loi et de la constitution, et c'est ce qu'il était."
watergate.25.d:0 "Une récente enquête menée par le procureur américain du Maryland sur la corruption dans le comté de Baltimore a récemment pris une tournure dramatique. Bien qu'Agnew ait occupé un poste dans le comté pour la dernière fois il y a des années et qu'il ait dépassé le délai de prescription, l'un des accusés a affirmé avoir versé des pots-de-vin à Agnew après qu'il soit devenu vice-président. Le président Nixon a rencontré Agnew pour discuter des accusations, qu'Agnew a catégoriquement niées. Agnew s'est également adressé aux médias et a déclaré publiquement sa totale innocence face aux accusations. Il a déclaré que tout l'argent qu'il recevait était destiné à des contributions à la campagne et rien d'autre. Cependant, les médias et le procureur restent concentrés sur l'enquête sur Agnew et tentent de dissimuler et de prouver les accusations portées contre lui."
watergate.20.d:0 "Alors que l'enquête contre le vice-président Spiro Agnew s'intensifie, il a décidé de rendre visite au président de la Chambre, Carl Albert, pour discuter si son statut de vice-président le protège des poursuites. L'administration Nixon a discrètement informé Agnew que si les allégations étaient fondées ou s'avéraient trop distrayantes, il devrait envisager de faire ce qu'il fallait et de démissionner. Le président Albert pourrait dire à Agnew que le Congrès pourrait le protéger contre des poursuites. Cependant, le président Albert, un constitutionnaliste profondément dévoué, sait que le Congrès a effectivement enquêté sur le vice-président au début du XIXe siècle, ce qui constituerait un précédent que le Congrès pourrait utiliser. Il a déclaré que le Congrès n'avait pas le droit d'interférer avec les tribunaux. Si le démocrate Albert dit à Agnew qu'il pourrait être inculpé, Agnew devra démissionner, sinon Agnew pourra essayer de rester."
watergate.21.d:0 "Après des discussions avec le président de la Chambre et la pression croissante des médias, le vice-président Agnew a décidé de démissionner. Même après avoir récemment parlé devant un large public en Californie et proclamé son innocence. Il est également parvenu à un accord avec le procureur et a accepté un accord de plaidoyer dans lequel il ne purgerait pas de peine de prison mais devra plaider sans contestation et payer une amende. En réponse, le président Nixon a écrit une lettre dans laquelle il félicitait l'ancien vice-président pour son immense patriotisme et sa loyauté envers les États-Unis. Il a déclaré que la démission avait pour but de protéger le pays et d'éliminer les distractions au sein de l'exécutif. Les membres du Congrès ont été choqués par la nouvelle et le président Nixon espère que le Congrès confirmera rapidement un nouveau vice-président."
watergate.22.d:0 "\nSuite à la démission du vice-président, la Maison Blanche a proposé au Congrès de confirmer Gerald Ford au poste de vice-président. Le choix de Ford semble être judicieux, car il s'agit d'un modéré connu doté d'une excellente réputation d'intégrité. Cependant, lors des premières auditions, certains démocrates ont souligné le rôle joué par Ford dans l'arrêt du comité Patman. Jusqu'à présent, Ford n'a pas nié son rôle dans le ralentissement de cette enquête, affirmant que cela faisait partie de ses fonctions en tant que minorité à la Chambre. Les représentants démocrates ont adressé une proposition au président de la Chambre, Carl Albert. Ils peuvent prolonger les audiences dans un avenir prévisible. Sans vice-président, Albert quitterait la Maison Blanche si Nixon démissionnait. Cependant, Albert, un constitutionnaliste strict, est déchiré par cette idée et estime que c'est peut-être un crime moral de ne pas confirmer Ford. Il sait toutefois qu'il devra peut-être prendre des mesures drastiques pour défendre l'intérêt national."
brown_v_board.2.d:0 "La Cour suprême a rendu une décision historique dans l'affaire Brown c. Conseil de l'éducation. Le tribunal a invalidé la doctrine de la séparation mais de l'égalité et a voté à l'unanimité que la ségrégation raciale des enfants dans les écoles publiques est inconstitutionnelle. Le tribunal a estimé que même s'il n'y avait pas de différence de qualité, l'existence d'installations séparées était intrinsèquement inégale et en violation du quatorzième amendement. Dans cette affaire, Oliver Brown a intenté une action en justice contre le conseil scolaire de Topeka pour avoir refusé de permettre à sa fille de fréquenter une école blanche de haute qualité et géographiquement plus proche d'une école noire plus éloignée. La décision de justice exige désormais que toutes les écoles commencent immédiatement l'intégration et supprime toute protection juridique contre la ségrégation. La NAACP et les militants des droits civiques sont ravis de cette décision, tandis que les politiciens blancs du Sud, favorables à la ségrégation, expriment déjà leur indignation face à cette décision."
intervene_in_cuban_elections_desc:0 "Nous pouvons choisir d'intervenir ou non dans les prochaines élections cubaines, pour obtenir le résultat souhaité et ainsi maintenir l'ordre dans les Amériques."
usa.6.t:0 "Le problème cubain"
usa.6.d:0 "L'élection présidentielle à Cuba devrait avoir lieu prochainement. Les sondages semblent cependant montrer un fort soutien aux candidats de gauche. Si cela devait se produire, Cuba pourrait alors tomber lentement sous le communisme. En tant que telle, la CIA suggère que nous utilisions notre pouvoir pour influencer les élections en faveur d'un candidat plus approprié."
usa.1.d:0 "Depuis 1959, Eisenhower écrit sa dernière déclaration au public. Aujourd'hui, il l'a finalement tenu.\nLe discours était \"un moment solennel dans une époque décidément insolente\", mettant en garde une nation \"étourdie par la prospérité, entichée de jeunesse et de glamour, et visant de plus en plus la vie facile\". Bien qu'il soit un homme politique d'origine militaire et le seul général à avoir été élu président au XXe siècle, il a mis en garde la nation contre l'influence corruptrice de ce qu'il décrit comme le « complexe militaro-industriel ». Il a également exprimé sa plus grande inquiétude quant à la corruption du processus scientifique dans le cadre de cette centralisation des financements au sein du gouvernement fédéral."
usa.2.d:0 "Dans Hernandez c. Texas, 347 U.S. 475, la Cour suprême, dans un arrêt rédigé par le juge Earl Warren, a statué que les Américains d'origine mexicaine et tous les autres groupes de nationalité aux États-Unis bénéficiaient d'une protection égale en vertu du 14e amendement de la Constitution américaine. Il s'agissait de la première affaire dans laquelle des avocats américano-mexicains comparaissaient devant la Cour suprême des États-Unis. Cette décision est considérée comme une extension de la protection aux groupes minoritaires du pays et une reconnaissance du fait que des groupes autres que les Noirs pourraient faire l'objet de discrimination."
usa.700.t:0 "Aidez la RPC"
usa.700.d:0 "La RPC a demandé notre aide dans ses efforts. Devons-nous intervenir et les aider ?"
usa.700.a:0 "Oui bien sûr!"
usa.700.b:0 "Non, pourquoi devrions-nous le faire ?"
usa.701.t:0 "L'unification de l'Autriche"
usa.701.d:0 "Le peuple autrichien veut redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Est-ce qu'on permet cela ?"
usa.701.a:0 "Oui bien sûr!"
usa.701.b:0 "Non, nous gardons la terre."
usa.702.t:0 "Accepter la RPC à l'ONU"
usa.702.d:0 "La Cour suprême a rendu une décision historique dans l'affaire Brown c. Conseil de l'éducation. Le tribunal a invalidé la doctrine de la séparation mais de l'égalité et a voté à l'unanimité que la ségrégation raciale des enfants dans les écoles publiques est inconstitutionnelle. Le tribunal a estimé que même s'il n'y avait pas de différence de qualité, l'existence d'installations séparées était intrinsèquement inégale et en violation du quatorzième amendement. Dans cette affaire, Oliver Brown a intenté une action en justice contre le conseil scolaire de Topeka pour avoir refusé de permettre à sa fille de fréquenter une école blanche de haute qualité et géographiquement plus proche d'une école noire plus éloignée. La décision de justice exige désormais que toutes les écoles commencent immédiatement l'intégration et supprime toute protection juridique contre la ségrégation. La NAACP et les militants des droits civiques sont ravis de cette décision, tandis que les politiciens blancs du Sud, favorables à la ségrégation, expriment déjà leur indignation face à cette décision."

CIA_60s.1.d:0 "Hier soir, le 30 mai, la Chevrolet Bel Air d'El Jefe a été interceptée par un véhicule rempli d'hommes armés alors qu'elle était en route vers San Cristobal depuis Saint-Domingue. Le véhicule s'est arrêté derrière la voiture de Trujillo sur l'autoroute déserte et l'a suivi avant d'ouvrir le feu avec des carabines M1 fournies par la CIA. Alors que la voiture endommagée de Trujillo était immobilisée sur l'accotement de l'autoroute par son chauffeur, le véhicule contenant les hommes armés s'est arrêté devant elle, lui bloquant la route. Une fusillade intense, quoique unilatérale, s'est ensuivie entre les hommes armés et un Trujillo armé accompagné de son chauffeur. Finalement blessé, Trujillo a tenté de s'échapper de sa voiture criblée de balles pour être abattu au milieu de la rue. Les hommes armés ont ensuite emballé son corps dans leur véhicule et sont partis à toute vitesse dans la nuit, laissant derrière eux les décombres et le sang à la police locale."
CIA_60s.2.d:0 "Avec la poursuite de notre programme non-interventionniste envers la gauche qui dicte notre politique étrangère, la CIA a jugé nécessaire de destituer le président de l'Équateur, José Velasco. La CIA n'était parvenue à cette conclusion qu'après la résistance obstinée et l'opposition de Velasco à la politique américaine de rupture des liens avec Cuba communiste et de répression des activités communistes et de gauche dans son pays. La CIA a infiltré la structure des formations politiques en Équateur sur tous les niveaux politiques, détournant tous les citoyens du soutien aux communistes cubains et aux opinions anti-américaines. Elle a également commencé la surveillance électronique des fréquences sensibles en Équateur. Une fois toutes les informations essentielles requises acquises, la CIA a procédé au retrait de Velasco du bureau du président équatorien. Avec la force de l'armée équatorienne aux côtés de la CIA, Velasco n'a eu d'autre choix que d'abandonner le pouvoir. Velasco a été remplacé par son vice-président, Carlos Arosemena, un personnage plus indulgent envers la politique américaine."
Wallace.1.d:0 "Au lendemain de l'élection très controversée du président [USA.GetLeader]à la plus haute fonction des États-Unis, le nouvel élu a affirmé que l'ordre régnerait dans ses États-Unis. Le président [USA.GetLeader] a adopté un décret déclarant la loi martiale dans les zones urbaines, citant ce qu'il a qualifié de « déplorable épidémie criminelle causée par la déségrégation et les pinkos impies ». Dans le même discours, il s'est vanté d'avoir « mis un terme aux criminels », déclarant en outre que « faire intervenir les forces armées des États-Unis est le moyen le plus sûr d'étouffer les activités illicites perpétrées par ces communistes et ces indésirables anti-américains »."
usa.cubaninter:0 "Nous lançons le processus qui influencera les prochaines élections cubaines."
intervene_in_cuban_elections:0 "Intervenez dans les élections cubaines\"0 \"La République populaire de Chine veut être reconnue à l'ONU. La République de Chine est devenue très faible après la guerre civile, nous devons donc désormais soutenir la nation la plus grande et la plus forte, à savoir la République populaire de Chine."
usa.702.a:0 "Oui bien sûr!"
usa.702.b:0 "Non, ils resteront dehors."
swf.100.t:0 "Le président Nixon assassiné !"
swf.100.d:0 "Des informations arrivent selon lesquelles le président Richard Nixon des États-Unis d'Amérique a été assassiné hier par une bombe placée sous la limousine présidentielle. Lors du défilé présidentiel à Washington, D.C., la limousine a explosé vers 22 h 34, Washington n'a pas tardé à blâmer d'éventuels agents russes du KGB et l'URSS a été tout aussi prompte à nier les allégations en déclarant que « ce n'est pas notre problème si la population américaine n'aime pas l'impérialisme capitaliste ». Le vice-président Henry Cabot Lodge III a immédiatement prêté serment."
swf.101.t:0 "le 35ème président des USA assassiné !"
swf.101.d:0 "John F. Kennedy, le 35e président des États-Unis, a été assassiné hier, à 12h30. À Dallas, au Texas, alors qu'il circulait dans un cortège présidentiel à Dealey Plaza. Kennedy roulait avec sa femme Jacqueline, le gouverneur du Texas John Connally et l'épouse de Connally, Nellie, et a été mortellement abattu par l'ancien marine américain Lee Harvey Oswald. Une enquête de dix mois menée par la Commission Warren, de novembre 1963 à septembre 1964, a conclu qu'Oswald avait agi seul en tirant sur Kennedy et que Jack Ruby avait également agi seul lorsqu'il avait tué Oswald avant de pouvoir être jugé. La mort de Kennedy marquait le quatrième (après ceux de Lincoln, Garfield et McKinley) et le plus récent assassinat d'un président américain. Le vice-président Lyndon B. Johnson devint automatiquement président à la mort de Kennedy."
civil_rights.2.t:0 "[GetNewspaperHeader]La loi sur les droits civiques fait l'objet d'obstruction et des troubles au Congrès"
civil_rights.2.d:0 "Même si les majorités des deux partis ont voté pour le projet de loi, il y a eu des exceptions notables. Bien qu'il soit opposé à la ségrégation forcée, le sénateur républicain Barry Goldwater de l'Arizona a voté contre le projet de loi, en faisant remarquer : « Vous ne pouvez pas légiférer sur la moralité ». Goldwater avait soutenu les tentatives précédentes visant à adopter une législation sur les droits civiques en 1957 et 1960 ainsi que le 24e amendement interdisant la capitation. Il a déclaré que la raison de son opposition au projet de loi de 1964 était le titre II, qui, à son avis, violait la liberté individuelle et les droits des États. Les démocrates et les républicains des États du Sud se sont opposés au projet de loi et ont mené une obstruction systématique de 83 jours, sans succès, y compris les sénateurs Albert Gore, Sr. (Démocrate-TN) et J. William Fulbright (Démocrate-AR), ainsi que le sénateur Robert Byrd (Démocrate-WV), qui a personnellement fait de l'obstruction pendant 14 heures d'affilée."
civil_rights.3.t:0 "[GetNewspaperHeader]La loi sur les droits civiques est adoptée ! congrès en crise !"
civil_rights.3.d:0 " Plusieurs sénateurs d'États du Sud se sont soulevés et ont fermement protesté contre l'adoption et la signature du projet de loi sur les droits civils, plongeant l'ensemble du congrès dans le chaos. Les sénateurs ont commencé à appeler à une sécession des États-Unis, déclarant que \"cela ne fait pas partie de notre vision en tant que pays\". Pour tenter d'apaiser les tensions au Sénat, le président a ordonné la fermeture de plusieurs institutions et organisations gouvernementales. Plusieurs États du sud appellent à un référendum. La loi martiale a été déclarée dans les États du sud en question sur ordre du président."
civil_rights.4.t:0 "[GetNewspaperHeader]Les tensions croissantes s'avèrent trop lourdes pour le Congrès"
civil_rights.5.t:0 "[GetNewspaperHeader]Loi sur les droits civiques signée !"
civil_rights.5.d:0 "Le 2 juillet 1964, le 88e Congrès des États-Unis a adopté la loi sur les droits civils, qui entre en vigueur immédiatement et interdit la discrimination fondée sur la race, la couleur, la religion, le sexe ou l'origine nationale. Il interdit l'application inégale des exigences d'inscription des électeurs, la ségrégation raciale dans les écoles, l'emploi et les lieux publics. Cependant, le projet de loi divise et met en danger un changement à long terme du soutien démographique des deux partis. Le président s'est rendu compte que soutenir ce projet de loi risquait de perdre le soutien écrasant du Sud au Parti démocrate. Le procureur général Robert Kennedy et le vice-président Johnson avaient fait pression pour l'introduction d'une législation sur les droits civiques. Johnson a déclaré à l'assistant de Kennedy, Ted Sorensen, que \"je sais que les risques sont grands et que nous pourrions perdre le Sud, mais ce genre d'États pourrait être perdu de toute façon\"."
civil_rights.6.t:0 "[GetNewspaperHeader]La grande marche sur Washington"
civil_rights.6.d:0 "Le mercredi 28 août 1963, 200 000 à 300 000 personnes ont marché sur Washington, on estime que 75 à 80 % des manifestants étaient noirs. La marche était l'un des plus grands rassemblements politiques en faveur des droits de l'homme dans l'histoire des États-Unis, et le but de la marche était de défendre les droits civils et économiques des Afro-Américains. Lors de la marche, Martin Luther King Jr., debout devant le Lincoln Memorial, a prononcé son discours historique « J'ai un rêve » dans lequel il a appelé à la fin du racisme. Après la marche, les intervenants se sont rendus à la Maison Blanche pour une brève discussion du projet de loi sur les droits civiques avec le président Kennedy. Kennedy avait regardé le discours de King à la télévision et avait été très impressionné. La marche est considérée comme un « triomphe de la protestation organisée » et Kennedy a estimé qu'il s'agissait d'une victoire pour lui, renforçant ainsi les chances de faire adopter son projet de loi sur les droits civiques."
civil_rights.7.t:0 "[GetNewspaperHeader]Les marches de Selma à Montgomery"
civil_rights.7.d:0 "Le long de l'autoroute de 54 milles reliant Selma, en Alabama, à Montgomery, la capitale de l'État, trois marches de protestation ont eu lieu du 7 au 25 mars 1965. La première marche a eu lieu le 7 mars 1965, organisée localement par Bevel, Amelia Boynton et d'autres. Les soldats de l'État et les membres du comté ont attaqué les manifestants non armés avec des matraques et des gaz lacrymogènes après qu'ils aient franchi la limite du comté, et l'événement est devenu connu sous le nom de Bloody Sunday. La deuxième marche a eu lieu le 9 mars. Les soldats, la police et les manifestants se sont affrontés à l'extrémité du pont, mais lorsque les soldats se sont écartés pour les laisser passer, King a ramené les manifestants à l'église, obéissant à une injonction fédérale tout en cherchant la protection du tribunal fédéral pour la marche. La troisième marche a débuté le 21 mars. Protégés par 1 900 membres de la Garde nationale de l'Alabama sous commandement fédéral et par de nombreux agents du FBI et des maréchaux fédéraux, les marcheurs parcouraient en moyenne 16 km par jour le long de la route 80 des États-Unis, atteignant Montgomery le 24 mars et le Capitole de l'État de l'Alabama le 25 mars."
taft.1.t:0 "Isolationnisme ou internationalisme ?"
taft.1.d:0 "Dans le cadre d'une de mes promesses électorales, j'ai promis de retirer les États-Unis de l'OTAN et de réduire leur intervention dans le monde. Nous devons moins intervenir dans le monde et revenir à notre état isolationniste comme avant la Seconde Guerre mondiale. Cependant, cela pourrait rendre l'Europe vulnérable aux hordes du communisme et donner à l'URSS un monde ouvert pour propager ses idéaux communistes. Si nous restons isolationnistes, nous espérons que nous ne serons pas entraînés dans une Troisième Guerre mondiale. Quelle devrait être la politique étrangère américaine ?"
taft.1.a:0 "L'isolationnisme est nécessaire à la paix."
taft.1.b:0 "Le communisme est devenu une trop grande menace. L'internationalisme est nécessaire."
taft.2.t:0 "[GetNewspaperHeader]Les États-Unis annoncent la fin de leur adhésion à l'OTAN."
taft.2.d:0 "Les États-Unis ont annoncé aujourd'hui leur retrait du commandement de l'OTAN et leur adhésion. Le président Taft a déclaré qu'il ne souhaitait plus intervenir dans les affaires étrangères et faire ce qui est le mieux pour le peuple américain. Taft a également déclaré qu'il souhaitait inaugurer une nouvelle ère de prospérité américaine qui s'accompagnerait d'un isolationnisme. D'autres membres de l'OTAN sont choqués et se réunissent désormais en conseil d'urgence pour discuter de l'avenir de l'OTAN et du monde libre. L'URSS a déclaré qu'elle souhaitait le meilleur pour les États-Unis et a également déclaré que sa politique isolationniste aiderait le monde."
taft.2.a:0 "Qu'arrivera-t-il au monde libre ?"
usa.500.d:0 "La campagne de terreur de Mark Essex contre la police de la Nouvelle-Orléans a culminé le 7 janvier avec un déchaînement de 11 heures à l'hôtel Howard Johnson sur Loyola Avenue, où il a tué sept personnes, dont trois policiers, et en a blessé huit. Une semaine plus tôt, il avait tué deux autres policiers et en avait blessé un. Il a échappé à la police pendant une semaine jusqu'à ce qu'il blesse un épicier de Gert Town, puis se dirige vers le Howard Johnson's. La fusillade d'Essex s'est terminée sur le toit de l'hôtel, où il est mort avec 200 blessures par balle."
usa.501.d:0 "Meurtre massif de civils vietnamiens non armés par les troupes américaines au Sud-Vietnam ! Plus tôt ce matin, environ 100 soldats américains sont arrivés pour une mission de recherche et de destruction visant à traquer les guérilleros du Viet Cong. Au lieu de cela, ils trouvèrent un village tranquille peuplé principalement de femmes, d'enfants et de personnes âgées. Ce qui suivit fut un terrible massacre. Les soldats américains ont systématiquement rassemblé et massacré les villageois terrifiés et non armés, violant les femmes et incendiant les maisons en cours de route. Avant la fin de la journée, 504 villageois vietnamiens ont été tués dans ce qui a été surnommé le massacre de My Lai, du nom de l'un des hameaux de Son My."
castle_bravo.1A:0 "Castle Bravo est le premier test de conception d'armes thermonucléaires à haut rendement mené par les États-Unis sur l'atoll de Bikini, aux Îles Marshall, dans le cadre de l'opération Castle. L'appareil était le dispositif nucléaire le plus puissant déclenché par les États-Unis et sa première arme thermonucléaire alimentée au deutérure de lithium. La production de Castle Bravo était de 15 mégatonnes de TNT, soit 2,5 fois les 6,0 mégatonnes prévues, en raison de réactions supplémentaires imprévues impliquant le 7Li, qui ont conduit à la contamination radioactive inattendue des zones à l'est de l'atoll de Bikini."
USA_70s_The_CIA:0 "Opérations de la CIA"
cia.20.d:0 "Des nouvelles inquiétantes sont arrivées des États-Unis. Une série de projets secrets, et parfois illégaux, menés par le Federal Bureau of Investigation (FBI) des États-Unis visant à surveiller, infiltrer, discréditer et perturber les organisations politiques nationales ont été découverts par un divulgateur inconnu. Les dossiers du FBI montrent que les ressources de COINTELPRO ciblaient des groupes et des individus que le FBI jugeait subversifs, notamment le Parti communiste américain, les organisateurs de la guerre du Vietnam, les militants du mouvement des droits civiques ou du mouvement Black Power, les organisations féministes, les mouvements indépendantistes (tels que les groupes indépendantistes portoricains comme les Young Lords) et diverses organisations qui faisaient partie de la Nouvelle Gauche au sens large. Le programme ciblait également des groupes suprémacistes blancs, notamment le Ku Klux Klan, et des groupes nationalistes, notamment les républicains irlandais et les exilés cubains."
USAkorea.4.d:0 "Le président Harry S. Truman a relevé le général Douglas MacArthur de ses nombreuses fonctions militaires, au premier rang desquelles commandant suprême des puissances alliées et commandant en chef des forces américaines en Extrême-Orient. Truman a exigé que MacArthur remette ses commandements au lieutenant-général Matthew Ridgway, invoquant son incapacité à apporter son soutien sans réserve aux politiques du gouvernement américain et des Nations Unies dans les questions liées à ses fonctions officielles."
cultural_events.1.d:0 "Ce soir du 5 avril 1980 marque le dernier épisode du célèbre drame policier qui se déroule à Honolulu, Hawaï. Hawaii Five-O, un célèbre drame policier, détient désormais le titre de drame policier le plus ancien avec la diffusion de l'Ep. 279 - « Malheur à Wo Fat » mettant fin aux histoires du capitaine-détective Steve McGarrett, Danny Williams, Chin Ho Kelly, Kono Kalakaua et Duke Lukela."
cultural_events.2.d:0 "Aujourd'hui, la ville de New York a du mal à se ressaisir après les deux jours de panne d'électricité qui ont duré du 13 au 14 juillet. À commencer par la combinaison d'un coup de foudre et d'une surcharge d'une centrale nucléaire qui a conduit à la panne du plus grand générateur de New York et à la chute de la ville entière. Le courant n'ayant été rétabli que tard le lendemain, des jeunes sont entrés par effraction dans les magasins en utilisant des voitures, affectant gravement Crown Heights et Bushwick, avec de nombreux cas d'incendie criminel qui en ont affligé beaucoup."
cultural_events.3.d:0 "Aujourd'hui, un rassemblement du Klu Klux Klan basé en Caroline du Sud a été attaqué par 500 hommes de Lumbee après que James Cole, le chef du KKK dans la région, ait lancé une campagne d'intimidation contre les Lumbee après avoir obtenu une reconnaissance fédérale limitée. Après que le KKK se soit installé dans le champ d'un fermier sympathique, les hommes de Lumbee ont encerclé le KKK et ont commencé à crier et à attaquer le KKK tout en tirant sur les hommes du Klan, les hommes du Klan ont tenté de riposter mais ont échoué et se sont retrouvés avec 4 hommes du Klan blessés et les autres s'enfuyant, laissant leur famille, leur système de sonorisation et une croix éteinte. Les députés et les shérifs du comté de Roberson ont interrompu la célébration près du Lumbee avec des grenades lacrymogènes."
book_releases.1.d:0 "Le 8 juin 1949, George Orwell publie le roman dystopique 1984. Situé dans la lointaine année 1984, il se concentre sur trois États mégalithiques et leur guerre constante et changeante les uns contre les autres et contre leur propre peuple. Au début des années 1950, le Royaume-Uni est impliqué dans une troisième guerre mondiale, impliquant cette fois des armes nucléaires comme celles utilisées contre le Japon en 1945. La Grande-Bretagne tombe dans la guerre civile, avec le parti socialiste anglais autoritaire, ou Ingsoc, qui en sort victorieux. Dans un État autoritaire, les pensées sont contrôlées, l'histoire est révisée et le culte de la personnalité du Big Brother moustachu règne en maître."
kef.2.d:0 "L'âge d'or de la bande dessinée aux États-Unis a duré de 1938 à 1945 et sa fin a été marquée par le fort déclin des bandes dessinées de super-héros. De nouveaux genres, tels que les bandes dessinées policières et d'horreur, ont suscité l'indignation avec des allégations selon lesquelles ces bandes dessinées inspireraient des comportements illégaux chez les mineurs, connus sous le nom de délinquance juvénile. Le sous-comité sénatorial américain sur la délinquance juvénile a été chargé par le Sénat d'enquêter sur ces allégations. Les fameuses audiences sur la bande dessinée ont eu lieu les 21, 22 et 4 juin 1954 et ont eu un effet profond sur l'avenir de la bande dessinée, le goût des images graphiques dans les bandes dessinées étant remis en question. La publication du livre « Séduction des innocents » a galvanisé l'opinion publique contre les bandes dessinées et a donné à l'industrie une couverture médiatique défavorable, les forçant effectivement à adopter le Code de la bande dessinée, s'autocensurant et entraînant une censure sévère, voire l'annulation de nombreuses séries de bandes dessinées de longue date. Les conséquences de cette situation ne se font pas encore pleinement sentir, mais il est déjà clair qu'il s'agit d'un coup dévastateur pour l'industrie américaine de la bande dessinée, déjà en difficulté."
little_rock.1.d:0 "Après l'affaire Brown vs Board, l'Association nationale pour l'avancement des personnes de couleur a inscrit neuf étudiants afro-américains à l'école secondaire centrale de Little Rock. Minnijean Brown, Elizabeth Eckford, Ernest Green, Thelma Mothershed, Melba Pattillo, Gloria Ray, Terrence Roberts, Jefferson Thomas et Carlotta Walls sont rapidement devenus connus sous le nom de Little Rock Nine. Le gouverneur Orval Faubus de l'Arkansas a appelé la Garde nationale pour les empêcher d'y assister et des images de leur sort ont été diffusées dans les médias du monde entier, attirant une attention internationale majeure. Après que la Garde a été démis de ses fonctions à la suite d'une action en justice et que la police a pris le relais, des émeutes et des manifestations massives les ont forcées à expulser les étudiants. Suite à cela, le président Eisenhower a pris la décision capitale de déployer 1 200 hommes de la 101e division aéroportée pour garantir que les étudiants soient présents en toute sécurité. Malgré un harcèlement constant tout au long de l'année, cette tournure des événements représente une avancée significative dans les efforts de déségrégation à travers les États-Unis"
kef.10.d:0 "Un nombre massif d'arrestations et d'enquêtes ont été menées aujourd'hui, alors que le gouvernement fédéral a déclaré une répression nationale contre les jeunes délinquants, citant l'augmentation rapide des crimes liés aux jeunes au cours de la dernière décennie. Selon le ministère de la Justice, le nombre de crimes commis par des jeunes s'est exacerbé au fil des ans. En tant que tel, l'ordre public ne peut être maintenu et les jeunes délinquants ont été traités laxistement par le système judiciaire. Les organisations de défense des droits civiques condamnent cet acte, car il porte atteinte aux droits de la jeunesse et est très sujet aux abus."
kef.7.d:0 "L'American Medical Association est aujourd'hui sous le feu des critiques, alors que des rapports récents circulent selon lesquels ses donateurs, pour la plupart de grandes sociétés pharmaceutiques et d'équipement médical, ont influencé ses politiques et ses programmes de lobbying, les rendant complices de scandales de corruption et de conflits d'intérêts. Le scandale, impliquant les plus hauts échelons de l'organisation, a récemment reçu d'énormes sommes de dons, la moitié va à eux-mêmes et l'autre moitié à l'organisation, en échange de faveurs et d'influence dans la politique de l'organisation. L'American Medical Association n'a pas encore répondu, mais les observateurs affirment que cela aurait des conséquences considérables à l'avenir."
kef.3.d:0 "Le président des États-Unis, Estes Kefauver, a récemment été salué par diverses organisations de défense des droits civiques, alors qu'il se lance dans une campagne massive en faveur des droits civiques, appelant à l'autonomisation des minorités et à leur intégration dans la société américaine. Dans un discours privilégié, Kefauver a déclaré qu'il est de l'obligation du peuple américain de traiter tout le monde de manière égale, sans distinction de race, de religion, de sexualité et d'autres aspects, et de juger les gens uniquement sur leur caractère plutôt que sur la couleur de leur peau. Cela a cependant suscité des réactions négatives de la part de divers groupes suprémacistes blancs à travers le pays, condamnant ses actions et exigeant une rétractation immédiate."
sab_army_mc.1.d:0 "Les audiences McCarthy ont été suspendues jusqu'à nouvel ordre aujourd'hui, en raison de preuves récentes démontrant l'incompétence de divers responsables militaires lors de ces audiences, ne leur donnant pratiquement aucun droit de juger Joseph McCarthy, l'un des sénateurs les plus éminents de Washington qui a fait l'objet d'une controverse pour avoir divulgué des documents relatifs à de présumés responsables communistes au sein du gouvernement américain. Cette évolution est une victoire majeure pour le sénateur, car il peut enfin poursuivre sa soi-disant « croisade contre le communisme », une expression inventée par ses différents partisans. Les observateurs affirment que si McCarthy poursuivait cette croisade, nous nous retrouverions non seulement face à une Amérique plus anticommuniste, mais aussi à une Amérique plus antidémocratique."
cultural_events.9.d:0 "La communauté mondiale a assisté aujourd'hui au décès de l'un de ses grands protecteurs méconnus : le cryptographe anglais Alan Turing a été retrouvé mort dans ce qui semble être un acte de suicide ; Le docteur Turing, 41 ans, est considéré comme l'ancêtre de l'informatique moderne et a joué un rôle non négligeable dans le déchiffrement d'« Enigma », les codes nombril allemands nazis, un rôle clé qui a aidé l'effort de guerre allié dans la bataille de l'Atlantique, entre autres ; On pense qu'il est potentiellement responsable du sauvetage de plus de 14 millions de vies et même du raccourcissement de deux ans de la durée de la Seconde Guerre mondiale. Le gouvernement britannique a rapidement pris ses distances avec la mort de Turing, cependant, les lois homosexuelles des îles britanniques étant ce qu'elles sont, Turing a été contraint d'être jugé pour le crime d'être homosexuel et le cryptographe a été condamné à la castration chimique moins de dix ans avant son décès prématuré.\nQuelle que soit la controverse qui a hanté Turing dans sa vie comme dans sa mort, on se souviendra de lui comme du fer de lance au coeur de la machine de guerre de l'Axe et comme une figure centrale pour sauver la Grande-Bretagne, l'Europe et, bien sûr, le monde du fascisme et de la tyrannie."
kef.8.d:0 "Dans un discours enflammé devant le congrès, le président américain Estes Kefauver a publiquement dénoncé le Manifeste du Sud. Signé en mars 1956 en réponse à l'affaire Brown contre Board, il constitue la principale base de l'opposition du Sud aux efforts fédéraux de déségrégation de plus en plus persistants. Son discours a suscité des réactions allant des éloges aux accusations de trahison, même de la part de membres de son propre parti démocrate. Avec l'engagement du président en faveur de la déségrégation, les tensions avec ceux qui prônent le maintien du statu quo se sont considérablement accrues. Kefauver lui-même fait désormais face à une large opposition de la part des influences Dixiecrat au sein de son parti, bien que cela soit partiellement compensé par le soutien croissant des sympathisants du mouvement des droits civiques. Une chose est sûre, cependant, c'est que le processus de déségrégation de la société américaine a été considérablement accéléré par ces développements - et le Sud devra peut-être embrasser le vent du changement qui souffle sur lui."
phi_events.2.d:0 "La violence et les troubles civils sévissent à Manille et dans l'ensemble de l'archipel philippin, alors que divers militants étudiants, groupes civiques et factions d'opposition, dont la plupart ont des liens directs avec le Parti communiste des Philippines, organisent des manifestations et des protestations condamnant le régime du président Ferdinand Marcos et de ses supposés maîtres américains. Des informations ont circulé selon lesquelles ces manifestations ont rapidement dégénéré en violences à grande échelle, car ces manifestants ont déjà attaqué divers quartiers gouvernementaux, tels que Mendiola, qui se trouve à proximité du palais de Malacañang, la résidence officielle du président, et de l'ambassade américaine, qui, selon les militants, est de facto le siège du pouvoir aux Philippines. En réponse à de tels actes de violence, le président Ferdinand Marcos a mobilisé la police philippine et, si nécessaire, a dispersé violemment les manifestations. Avec l'augmentation rapide des troubles civils et la menace communiste qui touche le monde universitaire, les observateurs prédisent que le gouvernement Marcos mettra en place des mesures radicales pour réprimer la rébellion et la menace communiste."
phi_events.3.d:0 "Le 23 septembre 1972, le président Ferdinand Marcos vient de signer la Proclamation n°1081, proclamation présidentielle déclarant la loi martiale dans tout l'archipel philippin. Selon le président Marcos, la loi martiale a été déclarée en raison du déclin de l'ordre public, ainsi que de la menace toujours croissante du communisme qui a pris rapidement de l'ampleur, affirmant qu'ils étaient dans les derniers travaux d'un soulèvement révolutionnaire contre son gouvernement. Les groupes d'opposition affirment cependant que la grande majorité des attaques terroristes subies par les Philippines ont été orchestrées par le cercle restreint de généraux militaires du président pour semer la peur et la terreur au sein de la population, donnant ainsi une légitimité à sa déclaration. Néanmoins, la mise en oeuvre de la loi martiale a été rapide, avec les Forces armées des Philippines ou AFP, capables de sécuriser les zones stratégiques préjudiciables au régime de Marcos, et la mise en oeuvre des « ordres généraux » placés dans la proclamation. Les observateurs sont mitigés dans leur réaction à cette déclaration, certains sympathisant avec le gouvernement, tandis que d'autres le critiquent, croyant au récit de l'opposition."
kef.9.d:0 "Dans le cadre d'une décision décisive du président Kefauver, le processus de nomination des candidats démocrates a été radicalement modifié pour accroître l'efficacité de la manière dont les candidats démocrates à la présidentielle sont sélectionnés. Traditionnellement, les candidats étaient sélectionnés principalement en secret par les chefs de parti, ce qui aboutissait parfois à la sélection de candidats qui ne s'étaient jamais présentés comme délégués à une élection primaire. Le Président a proposé des lignes directrices sur la manière dont les candidats devraient être sélectionnés, modernisant rapidement le processus de nomination pour prendre en compte la volonté du peuple et obligeant effectivement les États à sélectionner leurs délégués via des primaires présidentielles. Le résultat de cette réforme est que les électeurs démocrates ont un rôle beaucoup plus important dans le résultat qu'auparavant, et cette décision a retiré une part importante du pouvoir des mains de politiciens puissants au profit du peuple. Il est désormais clair que les futurs candidats démocrates représenteront la volonté du peuple. Reste à savoir si cela aura un effet sur les prochaines élections."
#adlai
adlai_civil.1.d:0 "La Cour suprême des États-Unis a rendu l'affaire historique Brown vs Board. Lors d'un vote unanime des neuf membres du tribunal, ils ont convenu que l'éducation séparée des races était inconstitutionnelle, écrasant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait bloqué les lois sur la ségrégation. L'affaire a commencé par un recours collectif intenté contre le Conseil de l'Éducation par la ville de Topeka au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour suprême. Leur décision a provoqué de grands troubles dans le sud, étant considérée comme une menace pour leur ordre traditionnel. Dans un geste choquant de la part du président Adlai Stevenson, il a refusé d'appliquer la loi et a déclaré qu'il avait l'intention de permettre à toutes les écoles qui souhaitent maintenir la ségrégation éducative de le faire. Cette décision a suscité une grande indignation de la part des éléments libéraux au sein du Parti démocrate et des appels dispersés à la destitution du président ont été lancés. Cependant, il semble peu probable qu'un de ces appels aboutisse, et la position du Sud ainsi que celle du mouvement ségrégationniste ont été considérablement renforcées."
truman_civil.1.d:0 "La Cour suprême des États-Unis, sous la direction du juge en chef Earl Warren, a rendu l'affaire historique Brown vs Board. Lors d'un vote unanime des neuf membres du tribunal, ils ont convenu que l'éducation séparée des races était inconstitutionnelle, écrasant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait bloqué les lois sur la ségrégation. L'affaire a commencé par un recours collectif intenté contre le Conseil de l'Éducation par la ville de Topeka au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour suprême. Leur décision a provoqué de grands troubles dans les États du sud, considérée comme une menace pour leur ordre traditionnel. Le président Truman a toujours été connu pour être en faveur des droits civiques, ayant adopté la toute première loi déségrégant l'armée en 1948. Sans surprise, Truman a annoncé devant le congrès son intention d'appliquer immédiatement cette décision dans tout le pays. Même si elle a provoqué des troubles considérables dans le sud, la résistance réelle a été limitée. Malgré les appels épars en faveur de sa destitution par les Dixiecrates au sein du Parti démocrate, aucune base solide d'opposition ne s'est formée."
truman_civil.2.d:0 "La Cour suprême des États-Unis, sous la direction du juge en chef Earl Warren, a rendu l'affaire historique Brown vs Board. Lors d'un vote unanime des neuf membres du tribunal, ils ont convenu que l'éducation séparée des races était inconstitutionnelle, écrasant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait bloqué les lois sur la ségrégation. L'affaire a commencé par un recours collectif intenté contre le Conseil de l'Éducation par la ville de Topeka au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour suprême. Leur décision a provoqué de grands troubles dans les États du sud, considérée comme une menace pour leur ordre traditionnel. Le président Harriman a toujours été connu pour être en faveur des droits civiques, ayant adopté la toute première loi déségrégant l'armée en 1948. Sans surprise, Harriman a annoncé devant le congrès son intention d'appliquer immédiatement cette décision dans tout le pays. Même si elle a provoqué des troubles considérables dans le sud, la résistance réelle a été limitée. Malgré les appels épars en faveur de sa destitution par les Dixiecrates au sein du Parti démocrate, aucune base solide d'opposition ne s'est formée."
kef.6.d:0 "Aux États-Unis, la Food and Drug Administration a été fondée en 1906 pour promouvoir la santé publique à travers la réglementation de la sécurité alimentaire et de divers instruments médicaux. Alors que les lois relatives à la santé publique sont constamment mises à jour, les appels à donner plus de pouvoir à la FDA se sont intensifiés depuis la fin de la Seconde Guerre mondiale, et après l'élection de Kefauver à la présidence, il s'est montré quelque peu disposé à mettre en oeuvre des réformes pour étendre davantage le pouvoir de la FDA. Récemment, le président a proposé une législation visant à étendre radicalement l'autorité de la FDA en matière de santé publique, et aujourd'hui les changements ont été officiellement ratifiés par le Congrès. Avec l'entrée en vigueur du projet de loi dans les prochains jours, les changements seront probablement un facteur majeur dans la lutte en cours pour l'amélioration de la santé publique, même si ces changements ont suscité des critiques de la part de ceux qui s'opposent à ce qu'ils perçoivent comme une trop grande intervention du gouvernement dans la vie des citoyens américains."
kef.4.d:0 "La Cour suprême des États-Unis, sous la direction du juge en chef Earl Warren, a rendu l'affaire historique Brown vs Board. Lors d'un vote unanime des neuf membres du tribunal, ils ont convenu que l'éducation séparée des races était inconstitutionnelle, écrasant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait bloqué les lois sur la ségrégation. L'affaire a commencé par un recours collectif intenté contre le Conseil de l'Éducation par la ville de Topeka au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour suprême. Leur décision a provoqué de grands troubles dans le sud, étant considérée comme une menace pour leur ordre traditionnel. Le président Kefauver a toujours été connu comme un défenseur des droits civiques et, un jour seulement après que la décision a été rendue, il a annoncé devant le Congrès son intention de « maintenir la décision autant que possible ». Bien qu'il ne s'agisse que d'un bref discours, ce discours représente une avancée majeure pour le mouvement des droits civiques aux États-Unis et semble être un tournant décisif pour la ségrégation en Amérique."
kef.1.d:0 "Dans un discours enflammé devant le congrès, le président américain Estes Kefauver a officiellement déclaré la guerre à la mafia italo-américaine, s'engageant à l'extirper et à « rétablir l'ordre » dans les villes américaines. Avant son accession à la présidence, Kefauver a présidé des audiences en 1950 qui ont attiré l'attention du pays sur le problème croissant du crime organisé, et après son élection à la présidence, beaucoup s'attendaient à ce qu'il intente une action en justice concernant cette question. Jusqu'à présent, la mafia a rencontré relativement peu d'opposition de la part des forces de l'ordre dans la construction de son empire criminel, mais il semble désormais que cela va bientôt changer. Les réactions au discours du président ont été variées. Plusieurs membres du Congrès ont même suggéré qu'il serait peut-être trop difficile d'éradiquer complètement la mafia bien établie et ne ferait qu'engendrer davantage de conflits, de colère et de dégâts au sein des communautés urbaines. Quelles que soient les conséquences, cette initiative ambitieuse aura des conséquences importantes à long terme sur la vie de nombreuses personnes, mais il reste imprévisible si ces tentatives porteront leurs fruits."
adlai_civil.2.d:0 "De nombreux électeurs conservateurs du Sud se sont séparés du Parti démocrate en 1948 pour former le Parti Dixiecrat. Après une mauvaise performance aux élections de 1948, beaucoup revinrent aux Démocrates, provoquant la fin des Dixiecrates. Suite à l'élection du président Adlai Stevenson, de nombreux anciens dixiecrates ont été enhardis par sa politique pro-ségrégationniste et leur influence au sein du parti s'est rapidement développée. Tout au long de son mandat, des Dixiecrates plus virulents ont ouvertement plaidé pour que le président prenne des mesures supplémentaires pour protéger les traditions du Sud et garantir le respect des lois Jim Crow dans le sud. Les récentes pressions exercées sur le président par les Dixiecrates au sein du parti se sont intensifiées, provoquant des problèmes internes pour le président et le poussant à agir. En réponse à ces pressions, il a annoncé son intention de faire respecter les lois Jim Crow dans les États du sud. Cette décision a suscité des protestations parmi les partisans des droits civiques et beaucoup ont exprimé leurs inquiétudes quant aux implications sur le traitement des Afro-Américains dans le sud. Alors que le président s'est plié aux intérêts du Dixiecrat, il semble que le mouvement de déségrégation ait subi un revers majeur."

