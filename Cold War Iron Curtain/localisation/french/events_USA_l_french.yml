Shanghai_Communique.1.t:0 "À travers le Pacifique"
Shanghai_Communique.1.d:0 "Bien que nous ayons eu des interactions amicales limitées avec [PRC.GetNameDef] depuis la fin de la guerre civile chinoise, nos plus hauts diplomates ont pu ouvrir des voies diplomatiques entre [PRC.GetNameDef] et [PAK.GetNameDef]. La plupart des présidents ont adopté une position anticommuniste forte depuis la montée du Pacte de Varsovie de Staline et même dès la guerre civile russe, mais il s'agit d'une opportunité sans précédent d'améliorer nos relations avec les [PRC.GetLeader] et de nous permettre de nous concentrer sur nos autres ennemis."
Shanghai_Communique.2.t:0 "À travers le Pacifique"
Shanghai_Communique.2.d:0 "[USA.GetNameDef] a proposé une mission diplomatique à notre humble nation dirigée par nul autre que le Président [USA.GetLeader]! Cela pourrait être monumental pour la diplomatie entre nos nations opposées, ainsi que pour notre statut international ! Cependant, nous pouvons aussi profiter de cette occasion pour priver ces capitalistes de l'heure de la journée."
Shanghai_Communique.3.t:0 "De l'autre côté du Pacifique : la Chine accepte !"
Shanghai_Communique.3.d:0 "Bien que nos nations aient eu des différends dans le passé, [PRC.GetLeader] a accepté notre mission sur leurs terres ! Des plans sont déjà en cours pour que le président [USA.GetLeader] se rende à Shanghai et rencontre le président."
Shanghai_Communique.4.t:0 "De l'autre côté du Pacifique - La Chine décline !"
Shanghai_Communique.4.d:0 "Le président [PRC.GetLeader] a décliné sans équivoque notre demande de mission diplomatique ! Il semble que nos différences passées étaient trop lourdes à supporter."
Shanghai_Communique.5.t:0 "Un Américain à Shanghai"
Shanghai_Communique.5.d:0 "Après une brève escale à Hawaï et à Guam, le président [USA.GetLeader] a atterri à Shanghai ! Le président a été accueilli par une garde d'honneur militaire et une petite foule par une journée grise d'hiver. Même si l'on s'attendait à peu de choses, le président s'est montré un peu déçu par l'absence de « milliers de personnes dans une foule enthousiaste » après la fin de décennies de diplomatie hostile."
Shanghai_Communique.6.t:0 "[GetNewspaperHeader]Un Américain à Shanghai"
Shanghai_Communique.6.d:0 "Après des décennies de diplomatie hostile, [USA.GetNameDef] et [PRC.GetNameDef] ont entamé le long processus de réconciliation. Le président [USA.GetLeader] a atterri à Shanghai dans le cadre d'une mission diplomatique d'une semaine visant à normaliser leurs relations et à discuter des problèmes entre leurs nations. Le monde regarde avec impatience ces géants politiques s'asseoir à la table de réunion"
Shanghai_Communique.7.t:0 "Une rencontre avec le président"
Shanghai_Communique.7.d:0 "Le président [USA.GetLeader] s'approche de Pékin dans le cadre de son voyage dans notre humble nation. Même si nous pouvons garder cela amical et apolitique, une partie des conditions de la visite était une discussion sur les relations diplomatiques entre nos nations souveraines."
Shanghai_Communique.8.t:0 "Une rencontre avec le président"
Shanghai_Communique.8.d:0 "Après une semaine de voyage vers le nord depuis Shanghai le long de la côte chinoise, le président [USA.GetLeader] est enfin arrivé à Pékin. Presque aussitôt que le président américain est arrivé, le président [PRC.GetLeader] l'a convoqué pour une brève réunion à l'hôtel Jinjiang. Lors de leur réunion, le président a dit timidement au président : \"Je crois que notre vieil ami [CHI.GetLeader] n'approuverait pas cela.\" Bien que cette réunion ait été brève, son importance pour faire progresser la diplomatie entre les démocraties occidentales et les États communistes de l'Est est indéniable. Dans le cadre de cette réunion, ces dirigeants mondiaux ont tenté de normaliser leurs relations. Les sujets abordés comprenaient un accord visant à éviter l'hégémonie dans la région Asie-Pacifique, ainsi que la reconnaissance de la politique d'une seule Chine."
Shanghai_Communique.9.t:0 "Rencontre avec le président - Les États-Unis sont d'accord"
Shanghai_Communique.9.d:0 "Le président [USA.GetLeader] a accepté nos conditions, acceptant d'éviter l'hégémonie et reconnaissant notre gouvernement comme le véritable gouvernement de la Chine !"
Shanghai_Communique.10.t:0 "Rencontre avec le président - Les États-Unis sont d'accord"
Shanghai_Communique.10.d:0 "Le président [USA.GetLeader] a accepté certaines de nos conditions. Le président a accepté d'éviter toute hégémonie dans la région, mais refuse de reconnaître que nous sommes légitimement propriétaires de l'île capricieuse de Taiwan."
Shanghai_Communique.11.t:0 "Rencontre avec le président - Les États-Unis ne sont pas d'accord"
Shanghai_Communique.11.d:0 "Le président [USA.GetLeader] a semblé secoué, puis en colère en entendant nos conditions. Le Président a rejeté toute chance de réconciliation entre nos deux nations, déclarant qu'ils n'abandonneraient jamais [CHI.GetNameDef], surtout à la demande d'une nation étrangère."
Shanghai_Communique.12.t:0 "Le communiqué de Shanghai"
Shanghai_Communique.12.d:0 "Dans le cadre d'une visite en cours à [PRC.GetNameDef], [USA.GetLeader] a rencontré [PRC.GetLeader] afin d'aplanir le conflit diplomatique et d'assurer la paix entre les deux nations. Cela a abouti à un communiqué signé de paix et de compréhension par les deux dirigeants. Ils ont déclaré dans cette déclaration commune qu'il n'y aura pas de lutte pour l'hégémonie entre les nations et que [USA.GetNameDef] reconnaît la politique d'une seule Chine - ce qui signifie effectivement qu'il ne reconnaît plus la nation de [CHI.GetNameDef]. Il s'agit d'un moment décisif dans les relations entre l'Ouest et l'Est, et cela signifie sûrement de bonnes choses pour l'avenir."
Shanghai_Communique.13.t:0 "Le communiqué de Shanghai"
Shanghai_Communique.13.d:0 "Dans le cadre d'une visite en cours à [PRC.GetNameDef], [USA.GetLeader] a rencontré [PRC.GetLeader] afin d'aplanir le conflit diplomatique et d'assurer la paix entre les deux nations. Bien qu'il y ait eu quelques difficultés dans les négociations, les deux pays ont publié un communiqué signé affirmant qu'il n'y aura pas de lutte pour l'hégémonie entre les deux nations dans le Pacifique. Cependant, le [USA.GetNameDef] a refusé de reconnaître la politique d'une seule Chine. Avec cette annonce, le président [USA.GetLeader] a précisé devant un [PRC.GetLeader]mécontent, déclarant que « notre nation restera fidèle à ses alliés, contre vents et marées ». Même si cela ne semble pas être le résultat souhaité par le [PRC.GetNameDef], il s'agit néanmoins d'un moment décisif dans les relations entre l'Est et l'Ouest, et d'un bref moment de réconciliation."
Shanghai_Communique.14.t:0 "Le communiqué de Shanghai"
Shanghai_Communique.14.d:0 "Dans le cadre d'une visite en cours à [PRC.GetNameDef], [USA.GetLeader] a rencontré [PRC.GetLeader] afin d'aplanir le conflit diplomatique et d'assurer la paix entre les deux nations. Cependant, les choses ont rapidement tourné au vinaigre lorsque le président a mentionné son malaise quant à la reconnaissance de la politique d'une seule Chine, qui reconnaîtrait les revendications des [PRC.GetNameDef]sur les [CHI.GetNameDef]. Bouleversé par ce malaise, [PRC.GetLeader] a mis fin aux négociations dans la colère, affirmant que cela constituait en soi un défi à leur souveraineté et à leur hégémonie dans le Pacifique, et que le refus de reconnaître leur politique était un refus de reconnaître leur nation. La visite de [USA.GetLeader]se poursuivra, mais un air de tension a remplacé le ton autrefois joyeux."
Shanghai_Communique.15.t:0 "Le grand négociateur"
Shanghai_Communique.15.d:0 "Le président [USA.GetLeader] est revenu à [USA.GetNameDef] après ce qui a été déclaré triomphe de la diplomatie par les journaux du monde démocratique. Alors que le président [USA.GetLeader] a commencé à réparer la fracture massive entre la diplomatie des deux nations, nous ne pouvons qu'espérer des accords entre nos deux grandes nations."
Shanghai_Communique.16.t:0 "La cordialité enfin"
Shanghai_Communique.16.d:0 "Le président [USA.GetLeader] est revenu à [USA.GetNameDef] suite à ce que beaucoup considèrent comme un premier pas dans la bonne direction vers la réparation des relations avec [PRC.GetNameDef]. Même si un long voyage nous attend, nous pouvons enfin cesser de nous inquiéter de la menace du [PRC.GetNameDef]."
Shanghai_Communique.17.t:0 "Échecs de la diplomatie"
Shanghai_Communique.17.d:0 "Le retour du président [USA.GetLeader]à [USA.GetNameDef] a eu un air sombre. Bien que le président soit allé au [PRC.GetNameDef] dans un but diplomatique, il est revenu les mains vides après sa contestation des mandats du [PRC.GetLeader]. Nos relations sont désormais plus hostiles que jamais."

Department_of_Energy.1.d:0 "Le gouvernement fédéral a récemment approuvé la création d'un ministère de l'Énergie. Il s'agira d'un poste du Cabinet qui vise à consolider les différents programmes énergétiques du gouvernement fédéral avec les responsabilités de défense liées au programme nucléaire. Pendant des années, la politique énergétique, en particulier la recherche, a été entravée par un manque de concentration dû aux différents programmes et agences impliqués. Plus important encore, le programme nucléaire a également manqué de coordination, notamment en termes de conception, de production et de recherche. Avec le ministère de l'Énergie, tous ces programmes et politiques seront coordonnés, et le gouvernement espère une grande amélioration de l'efficacité avec laquelle les États-Unis seront capables de développer de nouvelles technologies énergétiques et de les mettre en oeuvre dans tout le pays."
Abolish_JCNAE.1.d:0 "Le Comité mixte du Congrès américain sur l'énergie atomique a été officiellement aboli. À son apogée, le comité avait compétence sur tous les projets de loi et règlements liés aux aspects militaires et civils de l'énergie nucléaire. Il bénéficiait également d'un veto législatif unique qui lui permettait de peser sur la prise de décision exécutive en matière de politique nucléaire. En effet, il était considéré comme l'un des comités du Congrès les plus puissants de l'histoire américaine. Cependant, ces dernières années, sa compétence et sa surveillance ont été considérablement réduites du fait que d'autres comités du Sénat et du Congrès ont assumé la surveillance de l'énergie nucléaire civile. En outre, l'Environmental Protection Agency et la création de la Nuclear Regulatory Commission ont également rendu le comité de plus en plus redondant. C'est en gardant ces facteurs à l'esprit que le comité a été formellement aboli aujourd'hui, ce que beaucoup considèrent comme une victoire du pouvoir exécutif et de ses efforts visant à consolider la politique nucléaire au sein du pouvoir exécutif." #Abolishment of the Joint Committee on Nuclear on Atomic Energy
Ford.5.d:0 "Le président Gerald Ford a annoncé aujourd'hui que Nelson Rockefeller, ancien gouverneur de New York, était son candidat à la vice-présidence. La décision de choisir Rockefeller a suscité une réaction immédiate parmi les républicains conservateurs qui estimaient que le président Ford trahissait les valeurs du parti en choisissant un républicain libéral. En effet, les audiences de confirmation du Congrès devraient être éprouvantes, car même les démocrates conservateurs devraient poser des questions difficiles. Cependant, sa confirmation devrait finalement être obtenue. Lors de son annonce, le président Ford a souligné l'expérience de Rockefeller en tant que dirigeant et ses antécédents en matière de mise en oeuvre réussie de politiques. Les observateurs notent que Rockefeller pourrait s'avérer être un atout électoral majeur pour Ford lors de la prochaine élection présidentielle. Rockefeller peut attirer le soutien de communautés traditionnellement opposées aux républicains conservateurs et son inclusion au poste de vice-président élargira l'attrait de Ford."
Ford.6.d:0 "Le président Gerald Ford a annoncé aujourd'hui devant le Congrès que la plus grande menace qui pèse sur le pays était l'inflation. Il a annoncé le lancement d'une nouvelle campagne appelée Whip Inflation Now (WIN), un mouvement volontaire rassemblant les citoyens américains pour lutter contre l'inflation chez eux, en coordination avec ses mesures publiques de contrôle de l'inflation. Le président Ford a déclaré qu'il accueillerait également favorablement les lettres des Américains contenant des suggestions sur le contrôle des dépenses intérieures. La Maison Blanche a annoncé plus tard que ceux qui participent à WIN devraient porter des épinglettes et des chemises avec l'inscription WIN en signe de solidarité. En outre, ce programme s'inscrit dans la conviction qu'il appartient aux citoyens privés de travailler avec le gouvernement pour résoudre la crise inflationniste actuelle, et non à un gouvernement plus important. La réaction initiale à WIN a été ridiculisée par de nombreux Américains et les opposants au président manipulent le logo pour le transformer en critiques à l'égard du président."
Ford.7.d:0 "Dans un discours télévisé à l'échelle nationale, le nouveau président Gerald Ford a annoncé qu'il graciait l'ancien président Richard Nixon. Le président Ford a déclaré que les États-Unis devaient aller de l'avant et se remettre des récentes controverses et que la seule manière d'y mettre un terme était par la grâce présidentielle. L'ancien président Nixon a démissionné à la suite du scandale du Watergate et de la récente publication d'enregistrements compromettants de la Maison Blanche. La décision de gracier le président Nixon n'a pas été bien accueillie. Les opposants accusent Ford de collusion avec Nixon pour s'élever au rang de président tandis que d'autres suggèrent que Nixon aurait dû faire face aux conséquences de ses actes. Les observateurs politiques notent que la réputation du président Ford en tant qu'intermédiaire honnête sera affectée par cette décision. Cependant, les partisans du président insistent sur le fait que sa décision n'était pas le résultat d'un accord politique mais qu'il s'agissait d'une chose moralement correcte à faire et qu'il acceptera la réaction politique afin de guérir la nation."
Albert.1.d:0 "Le président Carl Albert a annoncé qu'il confirmerait la nomination de Gerald Ford au poste de vice-président. La décision de conserver un vice-président républicain est considérée comme un acte de conciliation compte tenu des circonstances extraordinaires qui ont conduit à l'entrée en fonction du président Albert. Gerald Ford est considéré comme un républicain modéré doté d'un fort caractère moral que les démocrates et les républicains respectent tous deux. Le président Albert a déclaré qu'il était impatient de travailler en étroite collaboration avec le vice-président Ford. Même si la presse a largement soutenu la décision du président Albert, des grognements se sont fait jour parmi les démocrates qui craignent que le vice-président Ford, un ami proche de l'ancien président Richard Nixon, n'utilise sa position pour saper les poursuites engagées contre lui."
Albert.2.d:0 "Le procès de l'ancien président Richard Nixon s'est terminé par sa condamnation plus tôt dans la journée. Alors qu'il était au pouvoir, l'ancien président Nixon a mené une conspiration visant à pénétrer par effraction dans les bureaux du Parti démocrate au Watergate et a ensuite contribué à la dissimulation. Le président Carl Albert, qui en tant que président de la Chambre a contribué à faire avancer l'enquête du Congrès, a salué la décision du tribunal. Il a déclaré qu'aucun homme n'est au-dessus des lois et que tous les hommes sont responsables de leurs actes. Le président Albert a déclaré qu'une fois le procès terminé, il espère que la nation pourra enfin guérir et passer à un avenir meilleur et à un gouvernement plus transparent. De nombreux Américains, même partisans de l'ancien président, partagent ce sentiment de responsabilité."
Agnew.1.d:0 "Le président Spiro Agnew a annoncé la nomination de George Romney au poste de vice-président des États-Unis. Romney était autrefois un candidat sérieux à la présidence et était considéré comme un rival politique de Nixon, bien qu'il ait rejoint sa première administration. En tant que gouverneur, Romney a réussi à recueillir le soutien des cols bleus du Michigan et son appel aux familles de travailleurs est considéré par de nombreux membres du Parti républicain comme un atout pour la prochaine élection présidentielle. Le vice-président Romney était également très habile à travailler avec les démocrates, ce que le président Spiro considère également comme un atout majeur dans sa tentative de mettre en oeuvre sa politique au Congrès. Bien que cela ne soit pas le choix des Républicains plus conservateurs, nombreux sont ceux qui, à travers le pays, ont exprimé leur satisfaction à l'égard du nouveau vice-président."
Agnew.2.d:0 "Dans un discours télévisé à l'échelle nationale, le nouveau président Spiro Agnew a annoncé qu'il graciait l'ancien président Richard Nixon. Le président Agnew a déclaré que les États-Unis devaient aller de l'avant et se remettre des récentes controverses et que la seule façon d'y mettre fin était par la grâce présidentielle. L'ancien président Nixon a démissionné à la suite du scandale du Watergate et de la récente publication d'enregistrements compromettants de la Maison Blanche. La décision de gracier le président Nixon n'a pas été bien accueillie. Les opposants accusent Agnew de collusion avec Nixon pour s'élever au rang de président tandis que d'autres suggèrent que Nixon aurait dû faire face aux conséquences de ses actes. Les observateurs politiques notent que la réputation du président Agnew sera ternie en raison de ses relations étroites avec Nixon. Cependant, les partisans du président insistent sur le fait que sa décision n'était pas le résultat d'un accord politique mais qu'il s'agissait d'une chose moralement correcte à faire et qu'il acceptera la réaction politique afin de guérir la nation."
Amnesty.1.d:0 "Les États-Unis ont annoncé un programme visant à offrir une amnistie à ceux qui ont évité d'être enrôlés dans les forces armées. Lors des récents conflits, un certain nombre d'Américains ont choisi de fuir les États-Unis ou de se cacher pour éviter leur service militaire obligatoire. Beaucoup de ceux qui ont évité la conscription ou ont déserté ont affirmé l'avoir fait par conviction morale ou par conviction qu'ils ne pouvaient pas soutenir des actions militaires. Le nouveau programme accordera une amnistie à ceux qui ont évité le projet s'ils en font la demande auprès du gouvernement. Cette politique est considérée comme un compromis. Même si les réfractaires ne seront pas directement punis, en demandant l'amnistie, ils admettent néanmoins leur culpabilité. La nouvelle politique est sans aucun doute un compromis, mais le gouvernement estime qu'elle est essentielle pour résoudre le problème des réfractaires et ramener ces hommes dans leurs familles."
ERA.5.d:0 "\nBien que initialement proposé à la fin des années 1920, l'Amendement pour l'égalité des droits (ERA) a finalement été ratifié dans la Constitution des États-Unis d'Amérique. L'ERA met fin à toutes les distinctions juridiques entre hommes et femmes, notamment en termes de divorce, de propriété et d'emploi. Les partisans du projet de loi affirment désormais que les femmes américaines bénéficieront enfin de tous les droits légaux des hommes et ne seront plus des citoyennes de seconde zone. Cependant, un certain nombre de femmes de la classe moyenne se sont opposées à l'ERA, car elle érode les rôles traditionnels de genre, menace les droits des mères en cas de divorce et ouvre la porte à la conscription des femmes pour le service militaire. Ils ont qualifié l'ERA de parodie et font campagne pour que les États s'opposent à la ratification de l'amendement dans leurs législatures. Indépendamment de cette opposition, l'ERA a été adoptée avec succès, et de grandes foules de partisans auraient accueilli la nouvelle avec jubilation à travers le pays."
USA_Marijuana.1.d:0 "Les États-Unis ont officiellement approuvé la décriminalisation de la marijuana. La drogue a longtemps été associée à la contre-culture et a été la cible d'intenses mesures de répression policière. Cependant, beaucoup ont commencé à affirmer qu'une telle orientation nuisait aux enquêtes sur des crimes plus graves ou au ciblage de drogues plus nocives aux États-Unis. Cela a été renforcé par des articles récents suggérant que l'impact de la marijuana n'était pas très différent de celui du tabagisme ou de la consommation d'alcool. En outre, de nombreux États ont fait valoir que les bénéfices potentiels provenant des taxes sur la marijuana pourraient apporter d'énormes sommes d'argent au gouvernement. Ces arguments ont tous contribué à convaincre le gouvernement de décriminaliser la drogue. Cependant, certains opposants affirment que cette décision finira par nuire au peuple américain, car les partisans de la décriminalisation ont minimisé les conséquences négatives que la légalisation entraînerait."
Clark_Amendment.1.d:0 "La violence en Angola a vu de nombreux acteurs étrangers s'impliquer en soutenant les différentes factions qui luttent toutes pour le contrôle. Les États-Unis ont également aidé les groupes anticommunistes sur le terrain avec une aide militaire. Cependant, de récents rapports et révélations concernant des incidents de violations des droits de l'homme et de massacres de civils ont incité le Congrès à agir. Le sénateur Dick Clark a adopté un amendement à la loi sur le contrôle des exportations d'armes, appelé Amendement Clark, qui interdit aux États-Unis d'offrir une aide aux groupes privés angolais impliqués dans des opérations militaires. L'Amendement Clark a rendu furieux les partisans anticommunistes qui estiment que le soutien à ces groupes est un intérêt américain vital. Cependant, de nombreux Américains soutiennent également cet acte et estiment que les États-Unis ne devraient pas contribuer à perpétuer la violence continue en Angola."
ELS_COUP.1.d:0 "Le gouvernement salvadorien s'est révélé largement inefficace dans sa lutte contre les inégalités économiques et l'influence croissante de l'extrême gauche. Cela a abouti à une coalition entre des officiers militaires modérés et des civils qui ont lancé un coup d'État pour renverser le gouvernement et mettre au pouvoir une junte civilo-militaire, connue sous le nom de Junte gouvernementale révolutionnaire (JRG). La junte bénéficie du soutien des États-Unis qui craignent une prise de pouvoir communiste. La junte a lancé une politique de réformes modérées pour apaiser la population et une répression brutale contre ce qu'elle identifie comme la gauche communiste. Cependant, la montée de la violence et la montée des escadrons de la mort soutenus par le gouvernement ont considérablement affaibli le programme de réforme et la résistance, notamment dans les campagnes, s'accroît."
ELS_COUP.2.d:0 "L'escalade de la violence au Salvador a pris une tournure plus sombre lorsque la nouvelle est apparue selon laquelle des hommes armés avaient assassiné le bien-aimé archevêque Oscar Romero alors qu'il terminait un sermon. Aucun groupe n'a revendiqué la responsabilité, mais l'assassinat éhonté d'un militant des droits de l'homme, d'un ecclésiastique et d'un défenseur des pauvres, a choqué et mis en colère de nombreuses personnes dans le pays. Beaucoup pointent du doigt soit la junte gouvernementale révolutionnaire au pouvoir, soit un escadron de la mort qui lui est associé. On pense que Romero a été tué pour son soutien aux droits de l'homme et pour ses récents appels aux troupes salvadoriennes à désobéir aux ordres qui violent les droits de l'homme. Le gouvernement a nié toute responsabilité et affirme qu'il s'agit d'une conséquence tragique de l'escalade de la violence des deux côtés et que personne ne peut être blâmé. L'Église catholique exigerait une enquête internationale approfondie sur ce meurtre."
Ford.10.d:0 "Les membres du prestigieux petit-déjeuner annuel des hôtes ont invité le président Ford à prendre la parole après que le gouverneur démocrate de Californie ait refusé de s'engager pour l'événement. Considérant le potentiel de galvanisation des partisans dans l'État en vue de la prochaine élection présidentielle, le président Ford est arrivé pour prendre la parole lors de l'événement. Lynette Fromme, ancienne membre de la famille Manson, est également arrivée à l'événement armée d'un pistolet. Fromme avait récemment entendu parler de la façon dont la pollution menaçait de détruire l'environnement, en particulier les séquoias de Californie. L'adepte du célèbre tueur en série a décidé de tuer le président et de montrer à l'establishment le sérieux de la cause environnementale. Après l'événement, le président Ford a commencé à traverser un parc jusqu'à la California State House pour rencontrer les principaux dirigeants politiques californiens. En approchant, Fromme s'est approché à quelques mètres du président Ford. Elle a levé le pistolet et l'a pointé sur le président..."
Ford.11.d:0 "Lorsque Fromme a appuyé sur la gâchette, un clic a été entendu car il s'est avéré que l'assassin n'avait pas réussi à mettre une balle dans l'arme. L'agent des services secrets Larry Buendorf a plaqué Fromme au sol alors qu'elle se moquait de la chance qu'elle ne puisse pas accomplir sa tâche. Le président Ford n'a pas semblé perturbé par l'événement et a poursuivi son programme de la journée. De nombreux Américains ont applaudi le président pour son courage face à la mort. Le président lui-même a déclaré qu'il l'avait vue lever l'arme mais qu'il ne considérait pas la menace comme sérieuse, surtout après l'arrestation de Fromme. À son retour à la Maison Blanche, Ford a été accueilli par sa famille en liesse et aurait pris un congé. Fromme devrait être jugée pour sa tentative d'assassinat. Le FBI enquête pour savoir si le célèbre tueur en série Charlie Manson a joué un rôle dans les actions de son ancien disciple."
Ford.12.d:0 "Lorsque Fromme a appuyé sur la gâchette, une balle a touché le président Gerald Ford à la poitrine. Le président a été transporté d'urgence à l'hôpital local tandis que les services secrets ont arrêté Fromme. Fromme a été entendu crier que ceux qui tuent la Terre Mère en subiront les conséquences. En quelques heures, le président a été déclaré mort. La nouvelle de cet assassinat a provoqué une onde de choc à travers le pays et le monde. Le président Ford jouit depuis longtemps d'une réputation d'intégrité et d'honnêteté et les déclarations de condoléances ont déjà commencé à affluer. Des foules de personnes en deuil attendraient devant la Maison Blanche. À l'échelle internationale, de nombreux pays seraient également choqués et incertains quant à ce que l'avenir réserve aux États-Unis. Le vice-président Rockefeller a prêté serment en privé alors que le nouveau président et la nation attendent son nouvel avenir."

Allende.1.d:0 "Lorsque le président Salvador Allende a pris le pouvoir au Chili, son régime a annoncé le début d'une nouvelle expérience socialiste en Amérique du Sud. Depuis son arrivée au pouvoir, il a fait face à des critiques de la Cour suprême et à une résolution du Congrès appelant l'armée à agir. Le président Allende a souligné que ces efforts étaient des tentatives antidémocratiques visant à supprimer le choix démocratique du peuple. Beaucoup dans le pays soupçonnent que ces efforts sont influencés par la CIA qui cherche désespérément à voir le socialisme échouer au Chili. Cependant, tôt ce matin, une crise plus grave est apparue lorsque la nouvelle est arrivée dans la capitale que la marine avait pris le contrôle de Valparaiso. Le président Allende apprend désormais que les troupes armées s'emparent de certains sites de la capitale et que les stations de radio ont été bombardées par l'armée de l'air. Un véritable coup d'État semble être en cours et le président Allende doit agir rapidement. Les prochaines heures détermineront l'avenir du Chili."
Allende.2.d:0 "Lorsque la nouvelle parvint au président Allende selon laquelle la marine s'était emparée de Valparaiso, il chercha à contacter ses officiers supérieurs. Il ne pouvait pas les atteindre et craignait que les putschistes n'aient arrêté les officiers supérieurs. Cependant, il s'est avéré que les officiers supérieurs, à l'exception du chef de la Marine qui a été arrêté, étaient à la tête de la tentative de coup d'État et lorsque le président Allende s'en est rendu compte, il était trop tard. Les putschistes ont exigé la démission, mais le président Allende a refusé car il était le président élu du Chili. Au lieu de cela, les troupes armées ont tenté de s'emparer du palais présidentiel, mais se sont heurtées à la résistance des combattants fidèles de la milice socialiste. Alors que les forces militaires se rapprochaient, Allende s'est adressé à la nation, déclarant qu'il ne légitimerait pas le coup d'État et qu'il ne serait pas un outil pour le nouveau régime. Peu de temps après que le nouveau gouvernement militaire a annoncé le suicide du président Allende. Après une brève lutte, le Chili est désormais sous le contrôle de l'armée."
Allende.3.d:0 "Lorsque la nouvelle du coup d'État est parvenue au président Allende, il a craint que les putschistes n'aient arrêté ses officiers supérieurs, car il ne pouvait pas les contacter. Cependant, il s'est avéré que les officiers supérieurs, à l'exception de l'amiral Montero, étaient à la tête de la tentative de coup d'État. Mais les putschistes n'ont pas réussi à arrêter l'amiral Montero, qui a réussi à rétablir son contrôle sur la marine. Alors que les soldats commençaient à occuper des sites clés dans la capitale, la nouvelle arriva que la marine de Valparaiso avait rendu la ville à l'autorité gouvernementale. La confusion qui a suivi a ralenti l'intervention militaire et certains commandants régionaux ont renoncé au complot. Quelques heures plus tard, une tentative de prise du palais présidentiel s'est soldée par un échec, car un grand nombre de milices pro-Allende ont réussi à renforcer le palais pour empêcher l'attaque. Peu de temps après, les putschistes se sont rendus et ont ordonné à leurs forces de se retirer. Le président Allende s'est adressé à la nation, annonçant que le régime démocratique avait triomphé de la tyrannie et du complot."
War_Powers.1.d:0 "Le Congrès des États-Unis a annulé le veto présidentiel et a adopté une résolution sur les pouvoirs de guerre ou une loi sur les pouvoirs de guerre. La nouvelle loi vise à contrôler le pouvoir exécutif en exigeant que le président obtienne l'approbation du Congrès pour toute action militaire. De nombreux membres du Congrès saluent cet acte comme une victoire pour la démocratie et un moyen de garantir qu'aucun président ne puisse utiliser la force militaire pour son propre agenda ou ses propres intérêts. En général, le projet de loi bénéficie d'un large soutien du public, mais la Maison Blanche a noté que dans un monde où les circonstances évoluent si rapidement, la nouvelle loi entravera la capacité des États-Unis à agir efficacement. Les observateurs du projet de loi notent que la loi comporte des failles potentielles et que le temps nous dira si le président peut réellement être défié en temps de crise."

NIC_USA.1.d:0 "Le Front sandiniste de libération nationale est né de la fusion de plusieurs groupes de jeunes et d'étudiants sur les campus universitaires. Le parti épouse de plus en plus une idéologie socialiste en opposition à la famille Somoza au pouvoir. Pour de nombreux Nicaraguayens, le régime Somoza a entraîné des difficultés économiques, une répression politique et une politique de capitulation face aux exigences des États-Unis. Les sandinistes ont gagné en popularité ces dernières années en raison d'une corruption flagrante et de l'incapacité du gouvernement à faire face au récent tremblement de terre. Le groupe a fait campagne pour des salaires plus élevés et a lancé plusieurs raids contre la famille Somoza et ses partisans. Les États-Unis voient avec une suspicion croissante la montée de cette organisation de gauche et soutiennent le gouvernement nicaraguayen dans ses efforts pour faire face à la menace."
NIC_USA.2.d:0 "La montée du Front sandiniste de libération nationale socialiste et sa campagne d'enlèvements et de troubles ont provoqué la colère du gouvernement nicaraguayen dirigé par le dirigeant de longue date Anastasio Somoza. La famille Somoza elle-même dirigeait le pays depuis la dernière intervention militaire américaine et bénéficiait depuis des décennies de l'aide des États-Unis. Le gouvernement nicaraguayen a lancé une campagne brutale de meurtres et de répression pour apaiser les troubles, appelée politique de siège, mais cela n'a pas mis fin aux troubles. En fait, l'ampleur de la violence a choqué les États-Unis et, bien qu'ils s'opposent aux sandinistes comme régime alternatif, il a été décidé de suspendre l'aide américaine au gouvernement nicaraguayen et à Somoza. Le régime de Somoza n'a pas tardé à qualifier cette décision de trahison envers un allié anticommuniste, mais les États-Unis insistent sur le fait qu'ils ne peuvent pas soutenir les violations flagrantes des droits humains perpétrées au Nicaragua."
NIC_USA.3.d:0 "Suite à la campagne d'enlèvements du Front sandiniste de libération nationale socialiste contre le gouvernement nicaraguayen, son dirigeant a décidé de lancer une politique de siège. Le dictateur nicaraguayen de longue date Anastasio Somoza a mobilisé sa Garde nationale formée par les Américains pour mener une campagne d'exécutions extrajudiciaires, de violence, de censure de la presse et d'intimidation visant à cibler les gauchistes à travers le pays et à empêcher les informations de fuir à l'étranger. Bien que de nombreux pays aient déjà condamné cette politique au motif qu'elle perpétue les violations des droits de l'homme, le gouvernement des États-Unis a décidé d'approuver la politique de siège. Le gouvernement américain ne peut pas prendre le risque que les sandinistes socialistes accèdent au pouvoir et éliminent un allié clé des États-Unis. En effet, un responsable américain a déclaré aux médias que le gouvernement nicaraguayen se défendait ainsi que son peuple contre la terreur communiste, indiquant ainsi son soutien au régime de Somoza."
NIC_USA.4.d:0 "Pedro Chamorro était rédacteur en chef du journal populaire La Prensa, fondateur d'un parti pro-démocratie et parent de deux anciens présidents nicaraguayens. Un groupe d'hommes armés s'est arrêté à Chamorro dans une voiture et a ouvert le feu, tuant Chamorro. Sa mort a suscité l'indignation dans tout le pays, l'opposition accusant le gouvernement du dictateur Anastasio Somoza d'être responsable de cet assassinat. Lors de ses funérailles, des dizaines de milliers de personnes sont descendues dans la rue, provoquant des violences et des émeutes visant le régime de Somoza. Une grève générale a également entraîné la fermeture de la plupart des entreprises pendant plusieurs jours. Le régime de Somoza a blâmé un homme d'affaires local mécontent des critiques de La Prensa, mais la plupart des gens tiennent le gouvernement pour responsable."
NIC_USA.5.d:0 "Le président Anastasio Somoza a officiellement démissionné de son poste de président du Nicaragua. Lui et sa famille auraient déjà fui, et beaucoup soupçonnent qu'ils fuient avec des millions de dollars en biens publics. La chute du régime de Somoza a vu les forces du Front sandiniste de libération nationale entrer dans la capitale. Un nouveau régime socialiste dirigé par les sandinistes devrait prendre le pouvoir puisque leurs forces contrôlent actuellement la quasi-totalité du pays. L'incapacité de Somoza à faire des compromis sur les demandes de réformes, à s'attaquer aux inégalités économiques qui durent depuis des décennies et son recours à la répression ont facilité leur chute. Beaucoup au Nicaragua ne pleurent pas la chute de la famille Somoza, mais il existe une incertitude quant à ce que l'avenir du Nicaragua réserve."
USA_NIC_WAR.1.d:0 "L'armée américaine a envahi le Nicaragua. Il s'agit de la première action militaire directe au Nicaragua depuis le retrait des États-Unis du pays en 1933. La montée du Front sandiniste de libération nationale socialiste a menacé de transformer le Nicaragua en un État socialiste. Pour les États-Unis, avoir un gouvernement socialiste si proche de la zone continentale des États-Unis et en mesure de propager l'agitation socialiste parmi ses voisins est considéré comme inacceptable. L'armée américaine a déclaré que son objectif était de sauver le peuple du Nicaragua d'un régime oppressif. Il a ajouté qu'il espérait être bien accueilli par la population et qu'il ne s'attendait pas à une forte résistance. Dans les États voisins de la région, nombreux sont ceux qui sont descendus dans la rue pour protester contre l'action militaire américaine. Certains craignent que l'intervention américaine ne soit un retour à la diplomatie américaine de la canonnière du début du XXe siècle."
contra.1.d:0 "Le nouveau gouvernement sandiniste a lancé un programme de réformes socialistes pour l'amélioration de la société nicaraguayenne. Il y a cependant ceux de l'ancien régime qui résistent au changement. Pendant des décennies, ces personnes ont profité de la corruption et de l'exploitation. En plus de cela, les États-Unis organisent ouvertement ces factions en militants armés afin de détruire la volonté des Nicaraguayens. Ces militants se font appeler Contras et mènent des opérations contre notre gouvernement sandiniste. Nos propres sources nous disent que les Contras sont en train d'être unifiés par des agences de renseignement étrangères et que leur objectif est de détruire le socialisme au Nicaragua. À mesure que les Contras mènent de plus en plus d'opérations, ils obtiennent davantage de soutien de la part de leurs sympathisants et suscitent de plus en plus la peur dans le coeur de nombreux Nicaraguayens."
contra.2.d:0 "L'effondrement du régime de Somoza et la montée des sandinistes socialistes ont marqué une transformation radicale de la gouvernance au Nicaragua. Les sandinistes avaient initialement promis de respecter la démocratie et de mettre fin aux disparités économiques au sein de la société. Cependant, plusieurs factions nicaraguayennes se méfient des sandinistes et pensent qu'ils construisent plutôt une société communiste. Ces factions se sont organisées en groupes militants appelés Contras qui lancent des attaques contre les sandinistes. Les Contras se composent de trois groupes principaux : d'anciens partisans du régime de Somoza, des anticommunistes et des combattants anti-Somozan qui estiment que les sandinistes leur ont menti après leur prise de pouvoir. On dit que la CIA unifie ces groupes Contra et soutient les factions anti-sandinistes au Nicaragua. Beaucoup craignent que la montée des Contras ne conduise à une guerre civile et à la violence."
USA_NIC.50.d:0 "Pour la première fois depuis le début des années 1930, les marines américains ont débarqué en force à Managua, la capitale nicaraguayenne. Le gouvernement américain avait déclaré que les marines se concentreraient sur la protection de l'ambassade et de l'aéroport, mais des rapports en provenance de Managua indiquent qu'ils sont déployés aux principaux points de contrôle militaires. Ce déploiement soutient grandement le président nicaraguayen Anastasio Somoza alors qu'il lutte pour maintenir le pouvoir contre les rebelles socialistes du Front sandiniste de libération nationale. Les combattants sandinistes ont fait des progrès, mais avec le déploiement américain, nombreux sont ceux qui s'attendent à ce que le vent tourne. Le président Somoza a mené une campagne brutale contre les sandinistes, faisant face à une condamnation internationale généralisée pour ses violations des droits de l'homme, mais les États-Unis continuent de se présenter systématiquement à ses côtés comme un rempart anticommuniste essentiel."

AST_CIA.1.d:0 "L'actuel gouvernement du Parti travailliste australien, dirigé par le Premier ministre Gough Whitlam, a tiré la sonnette d'alarme auprès de notre gouvernement. Le Premier ministre Whitlam a laissé entendre qu'il envisagerait la possibilité de fermer les bases militaires américaines en Australie. Un tel scénario serait dévastateur pour nos intérêts dans le Pacifique Sud. La CIA a cependant une solution potentielle. Ils pensent que l'actuel gouverneur général australien, Sir John Kerr, est sensible et comprend l'importance d'une présence militaire américaine. L'un de nos agents approchera le gouverneur général et lui demandera d'utiliser son pouvoir constitutionnel pour destituer le faible gouvernement Whitlam et non seulement mettre fin à l'impasse politique en Australie, mais aussi contribuer à la défense mondiale contre l'influence communiste."
AST_CIA.2.d:0 "L'actuel gouvernement du Parti travailliste australien, dirigé par le Premier ministre Gough Whitlam, a tiré la sonnette d'alarme auprès de notre gouvernement. Le Premier ministre Whitlam a laissé entendre qu'il envisagerait la possibilité de fermer les bases militaires américaines en Australie. Un tel scénario serait dévastateur pour nos intérêts dans le Pacifique Sud. Nous avons récemment dépêché un agent pour demander au gouverneur général, Sir John Kerr, d'utiliser son pouvoir constitutionnel pour destituer le gouvernement. Cela aiderait à résoudre les problèmes politiques actuels qui affligent l'Australie et protégerait nos bases. Cependant, cette tentative d'obtenir le soutien du gouverneur général a échoué car celui-ci a décidé de ne pas limoger le gouvernement."
AST_CIA.3.d:0 "Fait choquant, la crise politique en Australie s'est traduite par le limogeage spectaculaire du parti travailliste du Premier ministre Gough Whitlam. Bien que Whitman et l'opposition semblaient sur le point de parvenir à un compromis, le gouverneur général a plutôt décidé de prendre la mesure drastique de destituer le gouvernement. La décision du gouverneur général correspond certainement aux intérêts des États-Unis et à leurs craintes que Whitman ait l'intention de retirer les bases militaires américaines du pays. La CIA s'attribue en privé le mérite d'avoir convaincu le gouverneur général d'agir. Les Australiens seraient stupéfaits par ces actions et craignent pour l'avenir démocratique du pays. Cependant, le nouveau gouvernement insiste sur le fait qu'il organisera prochainement des élections et mettra fin aux récentes troubles politiques."

#Additional 60s Events
#News Events
Diem_Coup.1.d:0 "Le président du Sud-Vietnam Ngo Dinh Diem et son frère Ngo Dinh Nhu ont été brutalement assassinés lors d'un coup d'État militaire lancé par des officiers nationalistes. Catholique profondément dévoué, le régime Diem a eu du mal ces dernières années à faire face aux guérilleros communistes opérant dans les campagnes et à la résistance de la population majoritairement bouddhiste. Les bouddhistes qui protestaient contre les politiques discriminatoires du gouvernement Diem ont essuyé des tirs militaires. Après que les putschistes militaires aient isolé Diem des forces loyalistes, ils ont attaqué sa résidence, capturant finalement Diem et son frère qui tentaient de fuir. Malgré les garanties des généraux et des États-Unis que Diem bénéficierait d'un passage sûr hors du pays, lors de son transport vers le quartier général militaire, Diem et son frère ont été frappés à la baïonnette et abattus par un officier subalterne. De nombreux membres de la nouvelle junte au pouvoir ont condamné cet acte, mais on ne sait toujours pas si le meurtre était accidentel ou ordonné par la junte pour conserver le pouvoir."
PRC_UN.1.d:0 "\nL'Assemblée générale des Nations Unies a adopté la résolution 2578. 74 nations ont voté pour ; 35 nations ont voté contre ; 17 nations se sont abstenues. La résolution 2578 reconnaît la République populaire de Chine comme le représentant légitime de la Chine auprès des Nations Unies. La résolution 2578 donne à la République populaire de Chine le statut de membre de l'ONU et transfère le siège permanent de la République de Chine au Conseil de sécurité des Nations Unies à la République populaire de Chine. La résolution expulse également le représentant de Chiang Kai-shek et révoque le statut de membre de l'ONU de la République de Chine. La République de Chine a constamment critiqué la résolution 2578 comme étant illégale, car l'expulsion d'un membre de l'ONU nécessite la recommandation du Conseil de sécurité et ne peut avoir lieu que si une nation a violé de manière persistante les principes du présent chapitre conformément à l'article 6 du chapitre 2 de la Charte des Nations Unies."
PRC_UN.2.d:0 "Lors de la 22e Assemblée générale des Nations Unies, les États-Unis ont opposé leur veto à la résolution 2578, qui reconnaîtrait la République populaire de Chine comme représentant légitime de la Chine. Le représentant des États-Unis à l'ONU, George H.W. Bush, a déclaré que la résolution 2578 était illégale, puisque l'expulsion d'un membre de l'ONU nécessite la recommandation du Conseil de sécurité et ne peut avoir lieu que si une nation a violé de manière persistante les principes du présent chapitre conformément à l'article 6 du chapitre 2 de la Charte des Nations Unies. George H.W Bush a également déclaré qu'il avait proposé un projet de résolution 2578 qui accorderait à la République populaire de Chine à la fois le statut de membre de l'ONU et le siège permanent de la République de Chine au Conseil de sécurité de l'ONU, mais la République de Chine conserverait son droit de représentation à l'ONU, mais ce projet a été rejeté par l'Assemblée générale de l'ONU."
USA_Secret_War.1.d:0 "Le blocus de la côte vietnamienne a pratiquement stoppé toute contrebande d'armes et de fournitures vers les guérilleros communistes du Sud-Vietnam. En réponse, les Nord-Vietnamiens élargirent les opérations du 559e groupe de transport qui avait établi une série de pistes du Nord-Vietnam au Sud-Vietnam. La route s'appelait la piste Ho Chi Minh et s'étendait du Vietnam jusqu'à certaines parties du Laos et du Cambodge. Les efforts des États-Unis pour pousser les gouvernements cambodgien et laotien à interrompre ces lignes d'approvisionnement ont échoué. Frustré par l'infiltration croissante de combattants au Sud-Vietnam, le gouvernement américain a décidé de lancer une campagne de bombardements. L'opération vise à cibler les forces, les installations et les routes d'approvisionnement nord-vietnamiennes au Cambodge et au Laos. Cette opération élargit considérablement la guerre du Vietnam, mais les décideurs américains estiment que la puissance aérienne peut grandement entraver les efforts nord-vietnamiens et immobiliser les forces nord-vietnamiennes qui autrement se dirigeraient vers le sud."

#Country Events
usa_flavor.1.d:0 "Des informations affluent de New York, des appels de journalistes concernant le Stonewall Inn, un bar du Greenwich Village de la ville, qui sert de refuge à la communauté gay, lesbienne et transgenre de la ville. Malgré la fréquence à laquelle nous effectuons des descentes dans les bars gays, ils ripostent désormais. Deux femmes transgenres de couleur, Marsha P. Johnson et Sylvia Rivera, auraient résisté à leur arrestation et jeté la première bouteille (ou brique ou pierre) sur les flics, respectivement. La foule croissante à l'extérieur a forcé le groupe d'origine du raid du NYPD à se barricader, les émeutiers à l'extérieur les bombardant d'objets et essayant de s'enfoncer à l'intérieur. Finalement, peu après 4 heures du matin, les choses se sont calmées. Étonnamment, personne n'est mort ou n'a été grièvement blessé lors de la première nuit des émeutes, même si quelques policiers ont signalé des blessures.\n\nBien qu'il ait été démoli par nos officiers, le Stonewall Inn a ouvert ses portes avant la tombée de la nuit la nuit suivante. Une fois de plus, la police a été appelée pour rétablir l'ordre, notamment un groupe encore plus important d'agents du TPF, qui ont frappé et gazé les membres de la foule. Cela a continué jusqu'aux petites heures du matin, lorsque la foule s'est dispersée.\n\nDe plus en plus de partisans se sont manifestés, scandant des slogans tels que « le pouvoir gay » et « nous vaincrons ». Au cours des nuits suivantes, les militants gays ont continué à se rassembler près du Stonewall, profitant de l'occasion pour diffuser des informations et construire la communauté qui alimenterait la croissance du mouvement pour les droits des homosexuels. Même si les policiers sont également revenus, l'ambiance était moins conflictuelle, des escarmouches isolées remplaçant les émeutes à grande échelle du week-end."

USA_Rhodesia.2.d:0 "\nAlors que l'Union soviétique et ses clients à travers l'Afrique provoquent des troubles et prennent le pouvoir dans différents endroits, la Rhodésie suscite un regain d'intérêt. Depuis que la Rhodésie a déclaré son indépendance unilatérale, les États-Unis ont soutenu leur allié britannique en coupant les liens et en instaurant des sanctions jusqu'à ce que la Rhodésie accepte le principe du gouvernement majoritaire. Cependant, les Rhodésiens possèdent des minéraux précieux et mènent une guerre contre plusieurs groupes militants prétendant lutter pour l'indépendance. Cependant, leur idéologie de gauche laisse entendre que ces groupes pourraient simplement être des atouts soviétiques. L'Afrique du Sud et le Portugal refusent d'appliquer les sanctions, permettant ainsi aux Rhodésiens d'en contourner l'impact sur le pays. Récemment, les renseignements américains, les intérêts commerciaux et les suprémacistes blancs ont commencé à utiliser l'Afrique du Sud pour se lancer dans le commerce et la vente d'armes avec les Rhodésiens. Bien que cela soit contraire à la politique officielle et flagrant, Washington a jusqu'à présent refusé de combler cette lacune, indiquant une approbation tacite."
USA_Rhodesia.1.d:0 "À Washington, on croit de plus en plus que les nombreux mouvements indépendants de gauche opérant en Afrique sont des fronts communistes. Ces groupes tentent de se présenter comme des combattants de la liberté, mais ils ne font que préparer le terrain pour l'avenir lorsqu'ils se transforment en États communistes totalitaires. Des pays comme la Rhodésie, autrefois vilipendés pour leur position ferme contre de tels groupes, sont désormais décrits comme un refuge anticommuniste en Afrique. Les partisans de la Rhodésie font pression sur la Maison Blanche pour qu'elle ignore la propagande communiste et reconnaisse la Rhodésie. Ils souhaitent que la Rhodésie reçoive le soutien nécessaire pour poursuivre sa résistance au communisme. Lorsque ces partisans insistent sur la politique raciale rhodésienne, ils déclarent souvent qu'il s'agit d'une question interne aux Rhodésiens, mais qu'elle peut être modifiée au fil du temps avec l'aide des États-Unis."
SOVUSA.1.d:0 "Les États-Unis, par l'intermédiaire d'un émissaire secret, ont proposé de rejoindre l'Union soviétique et de vaincre la RPC. Les Américains affirment que le gouvernement chinois s'est révélé imprévisible, violent et source de troubles à travers le monde. Même s'ils disposent d'un nombre et de ressources considérables, un effort commun devrait aboutir. Certains hauts dirigeants du parti souhaitent accepter la proposition, affirmant que la puissance navale et aérienne américaine, en particulier, pourrait assurer une victoire rapide sur Pékin. D'autres craignent que l'implication des États-Unis ne limite nos options d'après-guerre, car les Américains insisteront pour que leur régime fantoche à Taiwan prenne le pouvoir après la guerre. Un tel scénario pourrait être dévastateur pour nos intérêts en Asie."
SOVUSA.2.d:0 "Nous avons récemment proposé à l'URSS d'unir nos forces et de vaincre la RPC. Le régime communiste de Pékin constitue depuis longtemps une menace pour nos intérêts dans la région et, plus important encore, soutenir un régime communiste pour en détruire un autre ne ferait que servir nos intérêts. Cependant, l'Union Soviétique nous a fait savoir qu'elle ne pouvait pas accepter notre proposition. Bien qu'ils n'aient pas donné de raisons, il semble que cela soit probablement dû à leurs craintes que l'implication américaine ne limite leurs options d'après-guerre et peut-être qu'ils ne voulaient pas que leurs militaires travaillent en étroite collaboration avec les nôtres. Il s'agit d'un résultat décevant, mais on peut s'y attendre compte tenu des ambitions manifestes du communisme mondial."
SOVUSA.3.d:0 " Nous avons récemment proposé à l'URSS d'unir nos forces et de vaincre la RPC. Le régime communiste de Pékin constitue depuis longtemps une menace pour nos intérêts dans la région et, plus important encore, soutenir un régime communiste pour en détruire un autre ne ferait que servir nos intérêts. Après avoir examiné les propositions, les Soviétiques ont répondu qu'ils acceptaient la proposition. La nouvelle a été accueillie avec enthousiasme à la Maison Blanche, qui a rapidement ordonné au Pentagone de préparer le déploiement de troupes et de moyens. De hauts responsables du cabinet ont déjà pris contact avec leurs homologues soviétiques ainsi qu'avec des hauts responsables militaires. Des traducteurs russes sont transférés d'autres départements vers le Pentagone pour contribuer à cet effort. L'Amérique a atteint son objectif et compte punir la RPC et affirmer ses intérêts en Asie."
SOVUSA.4.d:0 "Au grand choc de leurs propres populations, les États-Unis et l'Union soviétique ont annoncé qu'ils commençaient des actions militaires contre la Chine. Les deux pays ont cité la brutalité du gouvernement de Pékin et son implication dans l'agitation mondiale. Des informations font déjà état du franchissement de la frontière par les forces terrestres soviétiques et des rumeurs d'attaques américaines arrivent également. L'étendue de la coopération militaire entre les deux pays est inconnue, même si les deux parties communiquent étroitement. Certains suggèrent que ce contact vise à garantir qu'aucune des parties ne cible accidentellement l'autre. À Pékin, le gouvernement s'est montré provocateur, affirmant que la Chine était confrontée à une lutte nationale contre l'impérialisme, mais que contrairement aux luttes précédentes, le peuple était prêt. Les forces chinoises se mobilisent et les marches progouvernementales encouragent la résistance et les volontaires pour l'armée. Alors que les trois États les plus puissants sont désormais en guerre, de nombreuses personnes à travers le monde craignent les conséquences d'un tel conflit."
USA_COUP.1.d:0 "Le fondateur de l'Indonésie et dirigeant de longue date, le président Sukarno, a cédé le pouvoir au général Suharto. Il semble que l'armée indonésienne ait forcé Sukarno à abandonner le pouvoir à la suite d'une série d'assassinats contre des chefs militaires indonésiens par un mystérieux nouveau groupe militant communiste. Les militants ont tenté de forcer Sukarno à approuver leurs actions, mais il a refusé et alors que l'armée réprimait les militants radicaux, Sukarno a été démis de ses fonctions. Suharto a imputé l'attaque des militants à une tentative de coup d'État communiste et a ordonné une répression contre le parti communiste indonésien. Il semble que la répression soit violente, avec des rapports faisant état de meurtres et de violents combats entre unités militaires et communistes. Le gouvernement arrête également des milliers de communistes présumés à travers le pays. Il semble que le nouveau gouvernement militaire indonésien s'efforce d'éliminer le communisme de la vie politique. Les États-Unis offrent des renseignements et une aide militaire pour soutenir le gouvernement dans sa campagne anticommuniste."
latam_coup.1.d:0 "Après des mois de troubles sociaux, notamment entre le président et les mineurs, l'armée bolivienne est intervenue et a renversé le gouvernement. Le vice-président René Barrientos a dirigé les efforts et a pris le pouvoir avec le soutien militaire. Beaucoup en Bolivie suggèrent que le coup d'État s'est produit avec le soutien américain. Ceux qui croient à cette théorie soulignent que les États-Unis ont des intérêts économiques dans le pays et sont de plus en plus préoccupés par les troubles politiques. Dans cette optique, l'Amérique craignait un soulèvement ou un changement politique vers le communisme et encourageait le coup d'État militaire. Le gouvernement américain, pour sa part, a accueilli le nouveau régime comme une force stabilisatrice et a ignoré les questions sur une éventuelle implication dans le coup d'État."
CIA_60s.3.d:0 "Le mandat tumultueux du président Julio Arosemena Monroy à la présidence de l'Équateur s'est terminé par un coup d'État militaire. La nouvelle junte militaire s'est déclarée opposée au communisme et à sa récente propagation en Amérique latine. Les opposants au coup d'État et les gauchistes sont détenus et la junte promet d'initier des réformes visant à atténuer les problèmes économiques et politiques actuels qui affligent l'Équateur. Le président Monroy avait lancé des réformes mais s'est heurté à des problèmes avec l'armée et le pouvoir législatif en faisant ouvertement l'éloge des mouvements de gauche. Récemment, il a commencé à critiquer la politique régionale des États-Unis et à insulter son ambassadeur. Beaucoup dans le pays pensent que ces dernières actions ont poussé les Américains à approuver discrètement l'action militaire."


#Needs Coded
Paris_Peace.1.d:0 "Les Accords de paix de Paris ont été signés entre les États-Unis, le Nord-Vietnam, le Sud-Vietnam et les forces rebelles du Sud-Vietnam. Les États-Unis n'ont pas tardé à qualifier cet accord de paix durable pour tous dans la région. Les États-Unis ont accepté de retirer toutes leurs forces du Vietnam, du Cambodge et du Laos, en plus de lever le blocus du Nord-Vietnam. Le Nord-Vietnam libérera ses prisonniers américains et promettra de ne plus envoyer de troupes ni d'armes aux rebelles du Sud-Vietnam. Les Nord-Vietnamiens et leurs alliés sont autorisés à rester sur leurs territoires au Sud-Vietnam où ils établiront des lignes de cessez-le-feu avec le gouvernement de Saigon. La réaction du Sud-Vietnam au traité a été très négative, beaucoup qualifiant d'inacceptable l'autorisation des infiltrations nord-vietnamiennes dans le Sud et accusant les États-Unis d'avoir contraint le gouvernement à accepter ses termes pour faciliter leur retrait de la région."
Camp_David.1.d:0 "Après près de deux semaines d'intenses négociations, les dirigeants égyptiens et israéliens ont signé un traité de paix global sur la pelouse de la Maison Blanche. Le gouvernement américain a été le fer de lance de cet effort récent suite au récent dégel des relations égypto-israéliennes. Les négociations, qui ont duré deux semaines, se sont déroulées lors de la retraite présidentielle à Camp David. Deux documents ont été signés par les deux dirigeants. L'un d'eux offrait un cadre à la paix régionale, appelant à une zone palestinienne autonome en Cisjordanie et à Gaza. L'autre document était bien plus complet et résolvait des décennies de tensions entre l'Égypte et Israël. Le Sinaï sera restitué à l'Égypte en échange de garanties de sécurité, de reconnaissance d'Israël et de relations diplomatiques normalisées. Malgré les éloges de la communauté internationale, les États arabes et les Palestiniens ont réagi avec colère. Ils ont accusé l'Égypte de trahir l'unité arabe et ont été particulièrement critiques à l'égard du premier document car il avait été rédigé sans consultation des autres États arabes de la région ou des Palestiniens."
Vietnam_War_2.1.d:0 "Les États-Unis ont signé les Accords de Paris avec la ferme intention de les appliquer jusqu'au bout et de s'engager dans un esprit de paix avec toutes les factions. Cependant, il est clair que les Nord-Vietnamiens et leurs alliés ont profité de notre honneur et ne respectent pas l'accord. C'est pour cette raison que les États-Unis ont décidé de lancer de nouvelles opérations militaires. Tant que les communistes continueront à subvertir le peuple innocent du Sud-Vietnam, les États-Unis ne pourront rester les bras croisés. Le peuple américain ne soutient peut-être pas entièrement nos actions, mais l'Amérique a une obligation et un devoir envers le peuple vietnamien. Nous ne nous arrêterons pas tant que les communistes n'arrêteront pas leur agression insensée."
SEATO.4.d:0 "Suite aux récents succès sur le champ de bataille contre les forces communistes, le siège de l'OTASE a annoncé une augmentation de son nombre de membres. L'OTASE est apparue dans les années 1950 en tant qu'organisation régionale destinée à faciliter les liens culturels, commerciaux et militaires entre les nations soucieuses d'empêcher la propagation du communisme dans la région. Les nations impliquées dans le conflit d'Indochine sont restées en grande partie à l'écart en raison de leurs propres accords internationaux empêchant leur adhésion, mais plusieurs d'entre elles l'ont rejoint en tant qu'observateurs. Ces États observateurs ont maintenant annoncé leur intention de rejoindre l'organisation alors que les États-Unis se sont engagés à renforcer l'organisation et ont promis que l'OTASE serait l'avant-garde des forces anticommunistes dans la région."
SEATO.5.d:0 "L'OTASE est apparue dans les années 1950 en tant qu'organisation régionale destinée à faciliter les liens culturels, commerciaux et militaires entre les nations soucieuses d'empêcher la propagation du communisme dans la région. Ces dernières années, l'organisation a décliné car certains membres ont refusé de s'impliquer au Vietnam et l'organisation n'a pas réussi à attirer de nombreux pays d'Asie du Sud-Est. Face à la détérioration de la situation au Vietnam et à la forte diminution de l'implication américaine, il a été décidé de dissoudre officiellement le groupe car celui-ci n'a plus d'objectif clair. Même si l'OTASE n'a pas été à la hauteur de son potentiel militaire et ne fonctionnera plus, les liens régionaux qu'elle a favorisés constitueront l'héritage durable de l'organisation."
US_Taiwan.10.d:0 "Suite au récent dégel des relations entre les États-Unis et la RPC, le gouvernement américain a annoncé qu'il suspendrait toute aide à Taiwan, avec effet immédiat. Le gouvernement américain invoque l'évolution de la situation régionale et la volonté de ne pas contribuer à attiser les tensions dans la région. Il est significatif que l'Amérique considère désormais le conflit de Taiwan comme une question interne qui doit être réglée par les deux gouvernements. Cette annonce a déjà provoqué la colère du Congrès et l'indignation des médias américains, beaucoup qualifiant cette décision de trahison envers un allié anticommuniste fidèle. Cependant, le gouvernement américain insiste sur le fait que cette décision est dans le meilleur intérêt du pays et ne vise pas à apaiser un État étranger."
USA_Afghanistan.1.d:0 "Les États-Unis condamnent fermement les récentes actions militaires entreprises par l'Union soviétique en Afghanistan. Ils qualifient l'invasion soviétique d'illégale, de violation du peuple afghan et d'attaque contre la paix mondiale. A Washington, l'ambassadeur soviétique fut convoqué à la Maison Blanche où il reçut une protestation officielle. On s'attendait à une réponse forte des États-Unis, mais on ne sait pas encore si cela entraînera une quelconque implication dans le conflit en cours. Le secrétaire d'État a déjà appelé ses homologues de la région, qui ont également exprimé leur inquiétude face à l'action soviétique. En réponse, le gouvernement soviétique a déclaré qu'il avait agi dans l'intérêt du peuple afghan et à l'invitation de son gouvernement."
Grain_Embargo.1.d:0 "Dans le cadre d'une escalade de la réponse américaine à l'invasion de l'Afghanistan, les États-Unis ont annoncé qu'ils imposeraient un embargo sur toutes les exportations de céréales vers l'Union soviétique. Les États-Unis espèrent que l'embargo entraînera des pénuries en Union soviétique qui pousseront la population à forcer le gouvernement à arrêter ses opérations. Bien que cette décision soit applaudie partout aux États-Unis, de nombreux experts estiment que les Soviétiques seront capables de trouver des sources alternatives et d'en atténuer les effets. Le gouvernement américain affirme que cette décision s'inscrit dans le cadre d'une campagne diplomatique multiforme visant à pousser les Soviétiques à mettre fin à leur implication en Afghanistan."
US_Olympics.1.d:0 "Dans le cadre de son approche multiforme de protestation et de contestation diplomatique contre l'invasion soviétique de l'Afghanistan, l'Amérique a annoncé qu'elle boycotterait les Jeux olympiques de 1980 qui se dérouleraient à Moscou. En outre, les États-Unis ont demandé à tous leurs alliés et nations favorables à la paix mondiale de se joindre à eux dans le boycott. Presque immédiatement, plusieurs États ont exprimé leur intérêt à soutenir cette démarche. L'idée de boycotter les jeux est venue de dissidents soviétiques qui estimaient qu'une telle action démontrerait une détermination mondiale contre l'agression soviétique. Bien que cette décision ait reçu un premier soutien international et national, nombreux sont ceux qui, dans le pays, estiment que le sport devrait être séparé de la politique. En outre, des diplomates de certains pays ont déclaré en privé aux médias qu'ils estimaient qu'une telle démarche serait un geste vide de sens et qu'ils n'avaient pas l'intention de se joindre au boycott."
Sandinista.1.d:0 "Le gouvernement américain a publiquement dénoncé les sandinistes du Nicaragua pour leurs tactiques brutales et leurs outrages contre le peuple nicaraguayen. Les États-Unis ont souligné que l'Amérique centrale présentait depuis longtemps un intérêt pour le pays et que les Américains cherchaient depuis longtemps à aider sa population au fil des ans. Les sandinistes représentent une menace existentielle pour le peuple nicaraguayen et ses valeurs. La ferme condamnation des États-Unis a fait craindre une plus grande implication américaine au Nicaragua, même si les forces anti-sandinistes du pays saluent cette annonce. En réponse, les sandinistes ont déclaré qu'ils se battaient pour les paysans et les travailleurs du Nicaragua et qu'ils ne céderaient pas aux pressions impérialistes."
Khomenei_Assasinated.1.d:0 "Dans le cadre d'une escalade de la répression brutale déclenchée par le Shah d'Iran contre les dissidents du pays, l'ayatollah Ruhollah Khomeini a été assassiné. Ce critique de longue date du Shah avait fui le pays des années plus tôt et était devenu un symbole de l'opposition au Shah. Les détails de l'assassinat sont encore vagues, mais la faute est déjà portée sur le Shah et sa police secrète, la SAVAK. La mort de Khomeini sera un coup dur pour l'opposition. Des vagues de protestations de dissidents iraniens et de partisans de Khomeiny ont déjà lieu en Europe, en Iran et dans les États voisins. La faute sur le Shah s'est étendue à son allié les États-Unis, beaucoup pensant que le SAVAK a agi en collaboration avec la CIA. Le gouvernement américain est jusqu'à présent resté silencieux face à cette nouvelle, même si beaucoup pensent que la récente répression contre les dissidents n'a eu lieu qu'avec la bénédiction des États-Unis."
Oil_Embargo.79.d:0 "La production pétrolière iranienne a fortement diminué suite aux troubles qui continuent de secouer le pays. À cette pression s'ajoutent les grèves constantes qui frappent les industries pétrolières iraniennes. Cela a conduit à une panique mondiale en ce qui concerne l'approvisionnement énergétique. À cette incertitude s'ajoute l'annonce récente du gouvernement américain selon lequel il imposera un embargo sur le pétrole iranien dans un avenir prévisible en raison de son mépris continu des normes internationales et de son hostilité envers les États-Unis. Le président a souligné que ces mesures puniraient l'Iran et que des dispositions avaient été prises pour atténuer leurs effets sur les États-Unis. Toutefois, l'annonce a alimenté davantage de panique chez les consommateurs, ce qui nuit à la croissance économique et fait monter le prix du pétrole. Le gouvernement iranien a qualifié cette dernière annonce de geste vide de sens de la part des États-Unis."
USA_Rhodesia.3.d:0 "Dans une décision controversée, le gouvernement américain a annoncé qu'il reconnaîtrait l'indépendance de la Rhodésie. Comme beaucoup d'autres pays, les États-Unis avaient auparavant refusé de reconnaître la Rhodésie en raison de leur politique raciale et de leur déclaration unilatérale d'indépendance vis-à-vis de leur alliée, la Grande-Bretagne. Cependant, la montée du communisme en Afrique a conduit à une nouvelle évaluation de la part des décideurs politiques américains. Ils estiment que soutenir des régimes anticommunistes efficaces sur le continent sera le moyen le plus efficace de mettre fin au communisme. La Rhodésie, en particulier, a été exceptionnellement efficace pour résister aux armées de guérilla de gauche malgré le manque d'accès à l'aide ou aux armes occidentales. Les lois controversées sur la race rhodésienne doivent désormais être ignorées et traitées comme une affaire interne de la Rhodésie. Cependant, cette annonce a provoqué des protestations de colère aux États-Unis et à l'étranger. Beaucoup condamnent la politique raciale et considèrent les rebelles comme des combattants de la liberté et non comme des communistes. L'ampleur du soutien américain à la Rhodésie n'est pas encore connue."
USA_Portugal.1.d:0 "Dans le cadre d'un nouveau changement de politique américaine envers l'Afrique, les États-Unis se sont engagés à faire tout ce qui est en leur pouvoir pour préserver la position portugaise en Afrique. De nombreux décideurs américains considèrent désormais le nombre croissant de forces de guérilla de gauche luttant pour l'indépendance comme des forces essentiellement communistes déterminées à transformer le continent en communiste. Perdre ces zones, ces populations et ces ressources au profit du monde communiste pourrait potentiellement paralyser la position américaine sur la scène internationale. Les Portugais et leurs alliés comptent parmi les forces les plus efficaces sur le terrain pour lutter contre ces groupes, ce qui a conduit les États-Unis à les soutenir et à modifier leur position sur la décolonisation en Afrique. Le nouveau changement de politique entraîne des réactions négatives au niveau international et national. Beaucoup assimilent la nouvelle politique à un soutien actif contre la décolonisation et à l'approbation de la discrimination raciale, ce qui finira par isoler l'Amérique au niveau international."

#Iranian Hostage Crisis
IHC.1.d:0 "Dans une escalade sans précédent, des centaines d'étudiants iraniens ont pris le contrôle de l'ambassade des États-Unis à Téhéran. Après une brève lutte, l'ambassadeur se rendit. Le personnel de l'ambassade et les marines avaient les yeux bandés et ont défilé devant les caméras des médias. L'ayatollah Ruhollah Khomeini a approuvé la prise de pouvoir et les otages sont détenus par ses partisans. Les États-Unis et de nombreux autres États n'ont pas tardé à condamner cette violation du droit international. Jusqu'à présent, les preneurs d'otages exigent que le Shah d'Iran soit renvoyé des États-Unis, où il a demandé l'asile et où il suit un traitement médical. Les preneurs d'otages ont également saisi des documents de l'ambassade qu'ils envisagent de rendre publics pour démontrer l'implication américaine dans les crimes du Shah."
IHC.5.d:0 "Alors que nous étudions nos options pour affronter l'Iran, il a été décidé que les futures opérations militaires se feraient uniquement avec l'aide de l'OTAN. Au siège de l'OTAN, les Américains ont activé l'article 5 stipulant que l'attaque contre leur ambassade était une attaque contre le territoire souverain américain. De nombreux membres de l'OTAN ont exprimé leur soutien aux États-Unis dans cette période difficile. À Washington, il existe un large consensus selon lequel si l'Amérique doit agir, elle doit le faire avec ses alliés les plus proches. Si l'OTAN ne peut pas aider, cela signifierait que l'ensemble du dispositif de sécurité américain est en faillite. S'il s'agit d'une guerre, l'Amérique s'y lancera avec ou sans le soutien de ses alliés les plus proches."
IHC.10.d:0 "Les États-Unis d'Amérique ont annoncé que leurs forces quitteraient leurs bases dans la région pour neutraliser rapidement le gouvernement iranien. Le président américain a informé le peuple américain que la cause était juste et que laisser l'Iran impuni après qu'il ait ignoré l'ultimatum affaiblirait le pays et amènerait les amis des États-Unis à remettre en question la conviction américaine. Le Président a cité les violations des lois internationales et les atteintes aux droits de l'homme pour justifier une action militaire. L'Amérique promet de rétablir un gouvernement juste et adéquat pour le peuple iranien. Bien que l'invasion semble se dérouler jusqu'à présent comme prévu, la taille de l'Iran et sa population font craindre qu'une présence américaine importante ne provoque des troubles et des défis majeurs. Les militants iraniens opposés au nouveau régime coopéreraient avec les services de renseignement américains pour faciliter l'invasion."
IHC.15.d:0 "Alors que les négociations sur les otages sont au point mort en raison des exigences iraniennes excessives et de leur manque de marge de manoeuvre, le président a été approché en vue d'une solution militaire à la crise. Les forces spéciales et les agences de renseignement américaines déclarent savoir que les otages sont toujours détenus à l'ambassade et proposent une opération qui permettrait de sauver chirurgicalement les otages et n'impliquerait pas une attaque militaire totale contre l'Iran. Le plan implique que les forces américaines établissent un aérodrome en Iran comme base de rassemblement. Une fois cela établi, près d'une centaine de soldats des forces spéciales arriveront et lanceront un assaut aérien sur l'ambassade. Une fois les otages libérés, ils seront évacués d'Iran par avion avec nos forces. Bien qu'il s'agisse d'une opération complexe, l'armée semble confiante et affirme qu'elle ne provoquera probablement pas un conflit plus large."
IHC.16.d:0 "Le peuple américain a été ravi d'apprendre la nouvelle du sauvetage réussi des otages américains en Iran. Malgré quelques problèmes mineurs de carburant, l'opération américaine de deux nuits a réussi à établir dans un premier temps une base aérienne en Iran, à partir de laquelle les forces spéciales américaines ont volé en hélicoptère pour attaquer l'ambassade et sauver les otages. L'assaut s'est déroulé comme prévu, avec une résistance iranienne beaucoup plus légère que prévu, il semble qu'ils ignoraient complètement qu'une telle opération pouvait même être menée. Il n'y a pas de victimes connues, mais les nouvelles sont encore précoces. L'erreur iranienne a été de garder les otages ensemble, ce qui a rendu l'opération possible. Les tentatives militaires iraniennes pour intercepter les raiders ont échoué car l'aérodrome américain temporaire était vide depuis longtemps au moment où ils les ont atteints. L'opération est une immense victoire pour les forces spéciales américaines et montre que l'Amérique ne tolérera pas de subir un chantage de la part d'un État ou d'une organisation, quel que soit l'endroit où ils se trouvent."
IHC.17.d:0 "La Maison Blanche a annoncé que sa tentative de libérer les otages américains détenus en Iran avait échoué. Bien que les détails soient encore à déterminer, il semble que des militaires américains aient perdu la vie, même si les otages restent indemnes. La mission avait été annulée après que la phase initiale de l'opération se soit soldée par un désastre. Bien que la piste d'atterrissage ait été établie en Iran, il y a eu des problèmes de carburant et des conditions météorologiques qui ont entraîné l'écrasement d'au moins un avion de transport et un hélicoptère. Les forces restantes ont été évacuées frénétiquement et plusieurs avions ont été abandonnés. Aucun personnel n'a été perdu dans les combats ennemis et l'Iran considère déjà l'échec de l'opération comme un signe de Dieu. On dit que le peuple américain est découragé par cette nouvelle et que le moral de l'armée en a pris un coup. En Iran, les otages sont désormais dispersés à travers le pays pour éviter qu'une tentative similaire ne se produise."
IHC.20.d:0 "Le peuple américain a suivi de près l'évolution de la situation depuis que des foules d'étudiants iraniens ont pris en otage le personnel de l'ambassade américaine à Téhéran. Après une longue épreuve, le gouvernement iranien a officiellement libéré les otages, leur permettant de quitter le pays par avion. Après avoir effectué plusieurs arrêts en cours de route, pour permettre au personnel médical militaire de vérifier leur état de santé, les Américains libérés ont atterri sur un aérodrome militaire à New York. Les anciens otages ont ensuite été transportés en bus à l'hôtel Thayer de l'Académie militaire des États-Unis à West Point. Tout au long du trajet, des foules d'Américains ont acclamé les anciens otages. Après trois jours, ils seront emmenés à New York pour un défilé de téléscripteurs. Les familles des anciens otages jubilent de retrouver leurs proches. Pour le gouvernement américain, il y a une satisfaction et un soupir de soulagement que la situation ait enfin été résolue avec le retour sain et sauf des otages."

#IHC Country Events
IHC.2.d:0 "L'Iran a officiellement ouvert des négociations avec les États-Unis au sujet des otages de l'ambassade américaine dont ils disposent. A travers le Panama, ils ont officiellement demandé le retour du Shah pour faire face à ses crimes contre le peuple iranien. Le gouvernement américain a refusé pour des raisons humanitaires, invoquant son état de santé fragile et les traitements médicaux en cours. Il est demandé aux Iraniens de s'excuser pour leurs précédentes ingérences dans les affaires intérieures iraniennes et pour le dégel des fonds publics iraniens détenus par les États-Unis. Pour les Américains, même si la libération du Shah n'est pas sur la table, ils sont prêts à négocier davantage sur les autres demandes, y compris la création éventuelle d'une commission chargée d'enquêter sur l'implication américaine dans les affaires iraniennes. Cependant, les preneurs d'otages semblent très dévoués et il semble peu probable que le gouvernement iranien puisse même faire un compromis sur leurs demandes."
IHC.3.d:0 "La récente provocation iranienne et la prise d'otages de l'ambassade des États-Unis ont indigné le peuple américain. En conséquence, le gouvernement américain a décidé qu'il ne récompenserait pas une violation aussi gratuite du droit international et de la souveraineté américaine. Il a exclu toute négociation avec l'Iran et a lancé un ultimatum exigeant la libération inconditionnelle des otages. En réponse, la réaction des étudiants iraniens qui détenaient l'otage a été un défi clair. Cependant, on ne sait pas si le gouvernement sera aussi provocant à l'égard du délai. De nombreux Américains applaudissent la position ferme du gouvernement, même si nombreux sont ceux qui préviennent qu'une position aussi agressive pourrait faire courir des risques bien plus grands aux otages."
IHC.4.d:0 "Le gouvernement américain a récemment envoyé une proposition à notre gouvernement. Ils nous ont demandé de rejoindre un pacte anti-iranien et de les aider à renverser le nouveau régime de Téhéran. En échange, ils ont proposé de retirer tout leur soutien à l'opposition afghane combattant nos forces en Afghanistan. Certains de nos conseillers suggèrent que l'offre pourrait être fructueuse. Mettre fin à la résistance afghane constituerait un énorme bénéfice et la nature théocratique du nouveau régime pourrait constituer une menace pour notre propre population musulmane. D'autres conseillers notent cependant que le nouveau régime semble jusqu'à présent vouloir des relations cordiales et que le régime précédent a longtemps été une épine dans notre pied. Remplacer le régime actuel par un autre régime pro-américain pourrait finir par constituer une menace plus grande pour nos intérêts que l'opposition afghane ne pourrait jamais l'espérer. Il faut bien réfléchir à cette proposition américaine."

#VFX Program Event Chain
VFX.1.d:0 "Le concept des effets visuels, notre Navy Fighter Experiment, a débuté en 1968 lorsque Grumman a soumis une proposition d'avion non sollicitée. Intéressé par cela, le chef des opérations navales a recommandé qu'une étude soit réalisée pour déterminer la faisabilité de la conception des VFX. L'étude est arrivée à la conclusion que la conception du nouveau chasseur était réalisable et la Marine a procédé à la définition du contrat. Cinq sociétés ont soumis leurs conceptions, des sociétés telles que Grumman, General Dynamics, Vought, McDonnell Douglas et North American Rockwell. Quelle période passionnante pour être concepteur d'avions ! Nous choisirons deux finalistes et choisirons parmi eux. Nous voulons un avion avec un équipage de deux personnes, un puissant radar de contrôle d'armes embarqué, une capacité de combat air-air à longue portée (plus de 100 milles), ce doit être un intercepteur bimoteur et avoir une vitesse de pointe de Mach 2,2. Il devrait également disposer d'un M61 Vulcan et pouvoir transporter six AIM-54 ou six AIM-7 et quatre AIM-9."
VFX.2.d:0 "Après de nombreuses conceptions intéressantes de la part de nombreuses entreprises, nous nous sommes réduits à deux fabricants. Soit le contrat revient à McDonnell Douglas, célèbre créateur du F-4 Phantom, un avion extrêmement fiable que nous avons utilisé au Vietnam, soit nous attribuons le contrat à Grumman, avec son design révolutionnaire 303. Il y a eu une certaine pression au sein de la Marine pour que McDonnell Douglas soit choisi, car il y a certainement un certain parti pris à leur égard en ce qui concerne l'aviation navale. Grumman n'est pas connu pour fabriquer d'excellents chasseurs à réaction, encore moins d'intercepteurs depuis qu'ils ont fabriqué le F9F Panther, et c'est une variante améliorée du Cougar."
VFX.3.d:0 "Nous avons choisi Grumman pour le concours VFX et leur attribuerons le contrat pour la production de notre nouvel intercepteur, le F-14. Le travail de Grumman sur les effets visuels a commencé avec l'étude du concept \"303\". Malgré son implication dans l'échec du F-111B du concours TFX, Grumman a utilisé son expérience dans la construction d'avions pour créer le design qui a fini par remporter le concours. Le modèle 303 était disponible dans un certain nombre de variantes différentes, à la fois fixes et battantes. L'avion est équipé de deux turboréacteurs à double flux General Electric, il est capable d'atteindre Mach 2,34, peut transporter une incroyable charge utile d'armes air-air et répond à tous nos critères."
VFX.4.d:0 "Nous avons choisi McDonnell Douglas pour le contrat de notre nouvel intercepteur, le F-14. McDonnell Douglas a proposé probablement la conception VFX la plus ambitieuse. Comme trois des quatre autres modèles, leur proposition comportait des ailes à géométrie variable. Ils ont également incorporé des canards dans la conception, ainsi qu'une double queue. Les ailes étaient montées bas sur l'avion, tandis que les moteurs dominaient le fuselage. Le fuselage était plutôt carré et non aérodynamique, il offrait un grand espace pour monter des missiles. La proposition ambitieuse a gagné en faveur en raison de la bonne maniabilité attendue à laquelle se prêtaient les canards et les twin-tails. Le design était l'un des deux designs finalistes sélectionnés pour un développement ultérieur et, à la fin, McDonnell Douglas s'est imposé face à Grumman."

#US Architectural events
usanews.2.d:0 "Juste après l'achèvement récent du World Trade Center à New York, le nouveau bâtiment le plus haut du monde, la Sears Tower, a été achevé au centre-ville de Chicago. Créée par l'architecte Bruce Graham et l'ingénieur en structure Fazlur Rahman Khan, la structure intègre une conception nouvelle et révolutionnaire incorporant neuf bâtiments carrés, ou « tubes », regroupés dans une matrice carrée de 3 x 3 avec une circonférence de 225 pieds. Se terminant au sommet du 108e étage, battant le record du monde du World Trade Center à 1 450 pieds de hauteur. Étonnamment en avance sur leur temps dans l'ère actuelle du génie civil, les États-Unis et l'équipe de Graham et Khan ont reçu de nombreux éloges internationaux, Khan en particulier étant salué pour sa mise en oeuvre ingénieuse de sa « conception tubulaire », recevant de nombreuses commandes pour sa mise en oeuvre à l'étranger."
power_pack.1.d:0 "Les États-Unis sont intervenus dans la guerre civile dominicaine en cours. Au moins trois brigades de troupes de combat, appuyées par des éléments aéroportés, ont atterri tôt dans la matinée à la base aérienne de San Isidro. Ils ont rapidement progressé jusqu'à Saint-Domingue où l'armée américaine a confirmé avoir établi avec succès une zone de sécurité internationale couvrant les ambassades et leurs environs pour le compte de l'Organisation des États américains (OEA). Les Américains soutiennent que l'intervention était nécessaire pour faciliter l'évacuation des ressortissants étrangers et protéger le processus de paix de l'OEA dans le pays. De nombreux Dominicains sont indignés par ce qu'ils considèrent comme une intervention étrangère, et beaucoup soulignent que l'opération américaine a renforcé la faction loyaliste et repoussé l'avancée des forces rebelles constitutionnalistes dans la région. Dans toute la région, des manifestations anti-américaines ont lieu, beaucoup les dénonçant comme un retour à la diplomatie de la canonnière du début du XXe siècle."

Woodstock.1.d:0 "L'Exposition du Verseau : le festival 3 jours de paix et de musique s'est récemment terminé. L'événement a vu 400 000 hippies descendre dans une ferme laitière située au sud-ouest de Woodstock, New York. Malgré des pluies sporadiques, trente-deux actes se sont produits. Bien que les grands médias aient largement ignoré l'événement, il est perçu comme un événement déterminant pour le mouvement contre-culturel en plein essor. Les participants ont été observés en train d'adopter des drogues psychédéliques, de la marijuana et de l'amour libre. La nouvelle de ce qui s'est passé à Woodstock, comme l'événement est communément connu, se répand dans les cercles hippies du pays. Les hippies et ceux qui s'intéressent à la contre-culture prévoient déjà de nouveaux événements pour transmettre l'esprit de Woodstock au reste du pays."

#Truman's Death
swf.3.d:0 "Le président Truman est décédé lors d'une intervention chirurgicale à l'hôpital général Walter Reed après un échange de tirs à Blair House. Truman a séjourné à la Blair House car la Maison Blanche était en cours de rénovation. Deux hommes armés ont été aperçus entrant dans le bâtiment après un échange de tirs. Le président Truman et ses agents ont tenté de s'échapper, mais se sont heurtés aux deux hommes armés. 3 officiers et 3 agents ont été tués et plusieurs blessés. Le président Truman a été abattu et transporté à l'hôpital, mais est décédé lors d'une opération. L'un des hommes armés a été tué dans la fusillade et l'autre a été capturé. Le tireur tué a été identifié comme étant Griselio Torresola. L'autre tireur a été capturé et identifié comme étant Oscar Collazo. Le motif derrière cette tentative d'assassinat était que ces hommes armés étaient des nationalistes portoricains qui voulaient que Porto Rico soit libéré de l'impérialisme américain et voulaient marquer un point en tuant le président américain. La nation est en deuil aujourd'hui. Le vice-président Alben W. Barkley a prêté serment pour devenir le 34e président des États-Unis d'Amérique."
swf.2.d:0 "Le président Truman était à la Maison Blair pendant la rénovation de la Maison Blanche. 2 hommes armés sont arrivés et ont commencé à ouvrir le feu. Un policier a été tué dans l'échange de tirs et quelques-uns ont été blessés. Le président Truman va bien et n'a pas été blessé. 1 des hommes armés a été tué dans les combats. Il a été identifié comme étant Griselio Torresola. L'autre tireur a été capturé et identifié comme étant Oscar Collazo. Le motif derrière cette tentative d'assassinat était que ces hommes armés étaient des nationalistes portoricains qui voulaient que Porto Rico soit libéré de l'impérialisme américain et voulaient marquer un point en tuant le président américain. Heureusement, le président Truman va bien."

Harriman.1.d:0 "Le président William Harriman a annoncé une nouvelle refonte de sa politique étrangère. Le Président a réitéré la nécessité de faire face à la menace du communisme par le confinement et la sécurité collective. Dans sa déclaration, le président a annoncé que des efforts seraient déployés pour consolider les alliés existants et nouer des contacts avec de nouveaux amis potentiels. Il a déclaré que pour mettre l'accent sur le confinement, les États-Unis devaient garantir la force économique et militaire de leurs alliés de première ligne. Diplomate de carrière, de nombreux analystes ne sont pas surpris car le président nourrit depuis longtemps des soupçons à l'égard de l'Union soviétique."
Harriman.2.d:0 "La Maison Blanche a annoncé le début de sa nouvelle campagne Arts et Sciences. Développée par le président Harriman, la campagne appelle à un plus grand investissement et à une plus grande promotion des arts et des sciences à travers le pays. Le président, dans un communiqué, a noté que les États-Unis étaient à la traîne par rapport aux autres puissances mondiales, y compris celles des États hostiles dans ces domaines, et que ce n'est qu'en renouvelant l'intérêt, en particulier chez les jeunes, que les États-Unis pourront atteindre leur plein potentiel. La campagne ne verra pas seulement des encouragements et de la publicité, mais aussi une augmentation des bourses d'études pour stimuler le développement des étudiants."
Liberal_Republican.1.d:0 "Les républicains libéraux réapparaissent aux États-Unis. Ils offrent une alternative progressiste aux machines politiques démocrates traditionnelles pour les Américains mal à l'aise avec une politique sociale ou fiscale conservatrice. Cette résurgence est motivée par une nouvelle vague de soutien aux libéraux-républicains au sein de leur base traditionnelle du Midwest et du Nord-Est. On rapporte également que d'autres États voient davantage de démocrates du centre et de républicains conservateurs frustrés se tourner vers les candidats républicains libéraux. Cela reflète une attirance croissante de l'opinion publique américaine vers le centre politique plutôt que vers la gauche ou la droite."
Dewey_Mafia.1.d:0 "Le président Thomas Dewey a salué les inculpations annoncées par le FBI et d'autres organismes chargés de l'application des lois qui ciblent les principales organisations mafieuses à travers le pays. Ces poursuites interviennent quelques mois seulement après que le président a ordonné aux forces de l'ordre fédérales de se concentrer sur la lutte contre le crime organisé dans le pays. Cette focalisation sur la mafia ne choque pas grand monde puisque le président s'est fait connaître pour la première fois lorsqu'il a agi en tant que procureur fédéral contre les principaux chefs de la mafia dans les années 1930. Bien que le président soit largement salué, certains craignent qu'il risque des représailles violentes ou un effondrement de l'ordre public si ces organisations s'engagent dans des guerres intestines alors que les chefs de la foule sont chassés des rues. Malgré ces inquiétudes, le Président a promis de poursuivre ses efforts."
Dewey.10.d:0 "Les premiers succès du président Thomas Dewey ont donné un nouveau souffle à l'aile modérée du Parti républicain, souvent qualifiée d'establishment de l'Est. Ces dernières années, les républicains conservateurs ont accusé cette aile du parti de promouvoir des politiques sociales et économiques contraires et d'utiliser leur richesse pour manipuler le parti national afin de promouvoir leurs candidats. Les conservateurs avaient affirmé qu'il n'y avait pas grand-chose qui séparait leurs candidats des démocrates et que les conservateurs n'étaient pas motivés à voter. Cependant, la victoire du président Dewey contredit ces critiques. La base de l'establishment de l'Est, assiégée lors des récents cycles électoraux, semble désormais revitalisée et s'organise fortement derrière le président pour l'aider à mettre en oeuvre son programme national."
nixon_early.1.d:0 "Le président Richard Nixon a appelé les agences fédérales et les procureurs à enquêter sur les activités du Ku Klux Klan. Le président a qualifié d'intolérables les récents rapports faisant état de violences raciales et de foules de membres du Klan ciblant les Afro-Américains et de défi direct pour l'État. Il a notamment souligné la nouvelle selon laquelle des membres du Ku Klux Klan avaient agressé un musicien noir se produisant sur scène en Alabama. Le président a déclaré que tous les Américains sont autorisés à croire ce qu'ils veulent, mais que le recours à la violence et l'organisation de milices non autorisées sont contraires aux normes sociétales et doivent être combattus. Le président n'exclut pas de déployer des agents fédéraux sur le terrain pour affronter directement le Klan."
Nixon_early.2.d:0 "Le président Richard Nixon a envoyé un message au Congrès concernant son point de vue sur les Affaires indiennes. Le président a exprimé son opposition à la politique actuelle de licenciement à l'égard des Amérindiens. Le président a noté que cette politique enlevait le pouvoir d'action des Amérindiens et imposait des lois impopulaires à ces communautés. Il s'est également opposé au fait que le gouvernement fédéral ait une telle autorité sur toute population du pays. Au lieu de cela, le président Nixon a appelé le Congrès à restaurer l'autodétermination des communautés amérindiennes et à leur permettre de se gouverner et d'administrer elles-mêmes. La note demande au Congrès d'annuler une série de lois adoptées au cours des dernières décennies restreignant l'autonomie des Amérindiens. Bien qu'il y ait une certaine opposition de la part de certains dirigeants du Congrès, la note est déjà largement saluée par les communautés amérindiennes qui se plaignent depuis longtemps de leur manque d'indépendance et de leur assimilation forcée par le gouvernement américain."
Stassen.10.d:0 "L'énergique président Harold Stassen a continué de consolider sa domination politique sur le Parti républicain en faisant retirer des républicains conservateurs clés de différents postes, tant au sein du gouvernement que dans la direction du parti national. Cela marque le déclin continu de l'aile conservatrice du parti, qui semblait récemment prête à supplanter les ailes modérées et libérales du Parti républicain. La victoire du président Stassen a donné du pouvoir à ses partisans et lui a donné le capital politique nécessaire pour neutraliser la menace conservatrice. Le président semble prêt à mettre en oeuvre sa vision pour le pays avec le soutien étroit de son parti."
Stassen.1.d:0 "Le président Harold Stassen a achevé la dernière étape d'une vaste campagne auprès des communautés agricoles rurales pour consolider les votes. Le président, fils d'un agriculteur du Minnesota, cherche à consolider et à étendre sa base. Il a répondu aux préoccupations concernant les excès du gouvernement en promettant de toujours mettre en oeuvre un bon gouvernement, et non un gouvernement qui soutient des politiques comme celles de l'opposition. Au cours de sa campagne électorale, le président a vanté son bilan impeccable en tant que gouverneur et pourquoi il a reçu un soutien massif de la part des agriculteurs, soulignant que ce qu'il a fait pour aider les agriculteurs du Minnesota, il le fera pour aider les agriculteurs d'Amérique."
Stassen.6.d:0 "Lors d'un vote serré, le Congrès a approuvé le plan de revenu de base universel défendu par le président Harold Stassen. Le plan fournira aux chômeurs et mères célibataires de deux enfants ou plus un revenu fixe chaque mois. Le président a fait valoir avec succès que ce projet de loi réduirait la pauvreté et protégerait les plus vulnérables d'Amérique. L'adoption de cette loi est saluée par les journaux progressistes qui estiment que le président Stassen a démontré son engagement dans la lutte contre la pauvreté. Cependant, des journaux plus conservateurs condamnent ouvertement cette loi, car elle oblige les contribuables à suppléer et à encourager la délinquance et l'amoralité grandissantes parmi les jeunes. Quoi qu'il en soit, le président insiste sur le fait que le projet de loi renforcera et bénéficiera à tous les Américains, en particulier aux enfants les plus vulnérables."
Stassen.5.d:0 "Dans sa démarche la plus audacieuse à ce jour, le président Harold Stassen a proposé un plan de revenu de base universel pour les mères célibataires au chômage aux États-Unis. Dans le cadre de ce plan, plus de cent dollars par mois seront envoyés aux mères célibataires de deux enfants ou plus qui sont au chômage. Le président a déclaré que son plan lutterait contre la pauvreté, soutiendrait les plus vulnérables et contribuerait à garantir que ces enfants reçoivent des soins de meilleure qualité. L'opposition devrait être féroce de la part des membres des deux partis. Certains qualifient cette proposition de dépense extravagante qui récompense les mauvaises décisions, tandis que d'autres craignent qu'elle n'encourage un comportement amoral parmi les jeunes femmes du pays. Le président ne se laisse pas décourager et mise une grande partie de son capital politique sur l'adoption du projet de loi."
Stassen.7.d:0 "Lors d'un vote serré, le Congrès a rejeté le plan de revenu de base universel défendu par le président Harold Stassen. Le plan aurait fourni aux chômeurs et mères célibataires de deux enfants ou plus un revenu fixe chaque mois. Le président a fait valoir que ce projet de loi réduirait la pauvreté et protégerait les plus vulnérables d'Amérique. Le rejet de la loi est salué par les journaux conservateurs qui estiment que le président Stassen a cherché à saper les principes fiscaux fondamentaux et la moralité américaine. Les journaux les plus progressistes ont émis des réactions mitigées, certains félicitant le président d'avoir tenté de faire adopter le projet de loi tandis que d'autres prétendaient que le projet de loi n'en faisait pas assez pour résoudre les problèmes. De son côté, le Président a publié un communiqué exprimant sa déception. De nombreux analystes estiment que le président aura besoin de temps pour regagner un soutien politique après avoir subi cette défaite majeure."
Martin.1.d:0 "Le président Edward Martin a officiellement lancé une nouvelle campagne visant à étendre le droit de vote des républicains dans les États du sud. Le Président a noté qu'au cours des dernières décennies, le Parti démocrate avait adopté une série de lois étatiques et locales qui ont effectivement privé de leurs droits une grande partie de la population et ont assuré leur pouvoir politique dans ces États. Le président espère que sa campagne amènera davantage de sudistes sur les listes électorales et fera pression sur les autorités pour qu'elles mettent fin aux mesures restrictives. De nombreux journaux notent que le président cherche essentiellement à inscrire davantage d'Afro-Américains sur les listes électorales et à consolider l'alignement des républicains sur les droits civiques. Les journaux du Sud et certains journaux conservateurs critiquent le président pour son ingérence dans les affaires des communautés locales."
Martin.5.d:0 "Le président Edward Martin, dans une déclaration ferme, a ouvertement condamné les irrégularités électorales dans les États du sud. Le président a noté que les décennies de domination démocrate dans ces États étaient en grande partie dues à une politique systématique des responsables étatiques et locaux visant à ériger des frontières qui empêchent de nombreux habitants du sud, en particulier les populations minoritaires et les plus pauvres, de voter. Il a demandé que ces obstacles soient supprimés dans l'intérêt de la démocratie. Le président est de plus en plus salué par les groupes de défense des droits civiques et de nombreux républicains félicitent discrètement le président pour ses efforts visant à briser le bastion démocrate dans le sud. Certains pensent cependant que le président pourrait finir par s'aliéner certains des éléments les plus conservateurs de la base républicaine."
Halleck.1.d:0 "Le président Charles Halleck a rencontré les principaux dirigeants républicains et membres du Congrès. À l'issue de la réunion, le Président a publié une liste de nouvelles nominations à des postes dans l'administration et le gouvernement. D'après cette liste, le président Halleck semble construire une coalition conservatrice de soutien au sein du Parti républicain. Cela indique un virage du parti vers son aile conservatrice et pourrait marquer une nouvelle transition politique pour le pays. Ce changement a amené de nombreux démocrates et certains républicains modérés à exprimer en privé leur inquiétude quant à la direction que prend le président."
Halleck.10.d:0 "Dans un changement radical, le président Charles Halleck a exprimé son rejet du consensus keynésien. Il a soutenu que les principes économiques établis par John Keynes dans les années 1930 ne sont plus efficaces dans l'économie mondiale actuelle. Il a souligné l'inflation, les budgets alourdis et l'augmentation de la dette nationale comme des signes de l'échec de l'approche économique d'après-guerre. Le président Halleck a soutenu que le pays devait poursuivre son développement vers le libre marché et retirer le gouvernement de l'économie. L'adoption d'une économie conservatrice indique en outre l'influence conservatrice sur le président et le Parti républicain."
Halleck.9.d:0 "Le président Halleck a proposé des lois et des politiques fiscales pour renforcer le dollar et le protéger. Il a souligné que le dollar était menacé d'inflation et de baisse de valeur en raison des dépenses gouvernementales. Il a proposé que la Réserve fédérale concentre ses efforts sur la garantie d'un dollar sain et fasse preuve de transparence pour garantir la sécurité budgétaire du dollar. Les propositions indiquent que le président poursuivra sa quête d'une économie de marché plus conservatrice pour les États-Unis."
MacArthur.1.d:0 "Le président Douglas MacArthur a appelé le Congrès à abroger la loi nationale sur les armes à feu. Le projet de loi initialement adopté dans les années 1930 visait à réglementer l'acquisition de certaines armes à feu. La loi oblige les propriétaires d'armes à feu à s'enregistrer et à payer une taxe. Le président a noté que la loi visait à freiner la violence des gangs de l'époque de la prohibition, mais que la menace avait disparu depuis longtemps. Le président affirme que la taxe et les exigences ont rendu la possession d'armes à feu prohibitive et ont finalement nui aux fabricants américains. Plus important encore, cela entrave grandement la capacité des Américains à exercer leurs droits liés au deuxième amendement. Le président estime qu'il est dans le meilleur intérêt des Américains d'abroger la loi et, plus important encore, l'augmentation de la disponibilité des armes à feu bénéficiera à la sécurité nationale des États-Unis."
MacArthur.2.d:0 "Lors d'une récente conférence de presse, le président Douglas MacArthur a appelé à une augmentation spectaculaire des prestations versées aux anciens combattants. Le président a déclaré qu'il connaissait personnellement les sacrifices et le dévouement du combattant américain. Il a ajouté qu'il était du devoir du peuple et du gouvernement américains de veiller à ce que ces hommes soient correctement pris en charge. Il a noté que les incidents liés au chômage des anciens combattants lui rappelaient les hommes de la Bonus Army de la Première Guerre mondiale. Il a déclaré que le gouvernement doit agir maintenant pour garantir qu'un événement similaire ne se reproduise pas lorsque les soldats américains sont invités à agir contre des anciens combattants désespérés, incapables de subvenir à leurs besoins ou à ceux de leurs familles."
Macarthur.100.d:0 "Le président Douglas MacArthur a prononcé un discours d'adieu au Congrès. Dans son discours de réflexion, le président MacArthur a souligné qu'au cours de sa longue carrière militaire et politique, il avait vu le monde changer à plusieurs reprises. Il a informé le Congrès que tout au long de son illustre carrière, il avait simplement cherché à accomplir son devoir. Il a déclaré que même si son temps était compté, il passerait ses dernières années à penser à son service aux États-Unis et dans les forces armées. Le discours a été largement salué comme une modeste sortie d'un géant militaire et politique."
MacArthur.5:0 "Le président Douglas MacArthur a tenu une réunion de haut niveau des hauts responsables des forces de l'ordre fédérales. À l'issue de la réunion, le président a annoncé qu'il avait décidé de s'en prendre directement au Ku Klux Klan. Il a accusé l'organisation de perpétuer la violence et les troubles dans le sud des États-Unis. Il a déclaré que tout le poids du gouvernement fédéral serait exercé contre le groupe jusqu'à ce qu'il soit extirpé et détruit. De nombreux journaux ont salué la position ferme adoptée par le président contre ce que beaucoup considèrent comme un groupe haineux. Les journaux du Sud ont condamné cette action, la qualifiant de prétexte à l'ingérence fédérale dans les affaires intérieures des États."
MacArthur.5.d:0 "Le président Douglas MacArthur a tenu une réunion de haut niveau des hauts responsables des forces de l'ordre fédérales. À l'issue de la réunion, le président a annoncé qu'il avait décidé de s'en prendre directement au Ku Klux Klan. Il a accusé l'organisation de perpétuer la violence et les troubles dans le sud des États-Unis. Il a déclaré que tout le poids du gouvernement fédéral serait exercé contre le groupe jusqu'à ce qu'il soit extirpé et détruit. De nombreux journaux ont salué la position ferme adoptée par le président contre ce que beaucoup considèrent comme un groupe haineux. Les journaux du Sud ont condamné cette action, la qualifiant de prétexte à l'ingérence fédérale dans les affaires intérieures des États."
MacArthur.6.d:0 "Le président Douglas MacArthur a annoncé qu'il mobiliserait toutes les forces du gouvernement fédéral contre le Ku Klux Klan. Le groupe haineux a gagné en notoriété ces dernières années en raison de ses actes de violence visant les Afro-Américains et les groupes de défense des droits civiques. Les attaques récentes et très médiatisées attribuées au groupe ont attiré l'attention du président qui considère le groupe comme une insurrection contre le gouvernement des États-Unis. Cette décision est largement applaudie par les Américains intéressés par le rétablissement de l'ordre public. Cependant, de nombreux responsables des États du Sud ont condamné cette action, la qualifiant d'excès de portée fédérale et affirmant qu'ils étaient plus que capables de s'occuper du groupe."
MacArthurCivilRights.1.d:0 "Le président Douglas MacArthur a déclaré son soutien à l'élargissement du droit de vote dans le Sud et à la fin de la législation nationale et locale qui restreint le droit de vote des Afro-Américains et des Blancs les plus pauvres. Le président a ajouté que de telles lois sont inconstitutionnelles et visent les droits fondamentaux des citoyens américains. Il a également ajouté que ces lois représentaient une menace pour les États-Unis et qu'il était prêt à utiliser tout le pouvoir du gouvernement fédéral pour garantir la protection des droits des citoyens."
MacArthurCivilRights.2.d:0 "Le gouverneur de l'Arkansas, Orval Faubus, a récemment intensifié son opposition à la récente décision de la Cour suprême en ordonnant aux unités de la Garde nationale de l'Arkansas d'empêcher les étudiants noirs d'intégrer le lycée central de Little Rock. La Cour suprême a jugé la ségrégation inconstitutionnelle et ordonné l'intégration de toutes les écoles. Ces derniers jours, le président Douglas MacArthur a durement réagi à ce qu'il appelle un défi direct au gouvernement fédéral en déployant des troupes aéroportées d'élite dans la ville. Une loi martiale sévère a été déclarée et les troupes de la Garde nationale ont été désarmées de force. Alors que les troupes protégeaient les élèves fréquentant les écoles, les foules anti-intégration ont défié les règles de la loi martiale, ce qui a conduit à de violents affrontements avec les soldats. Selon certaines informations, un certain nombre de manifestants ont été blessés et tués au cours de cette action fédérale énergique."
MacArthurCivilRights.5.d:0 "Le président Douglas MacArthur a ordonné la déclaration de la loi martiale dans tous les États de Dixie. Le président a noté que bon nombre de ces anciens États confédérés ont refusé, résisté ou traîné les pieds dans la mise en oeuvre des lois sur les droits civiques et des récentes décisions de la Cour fédérale. En tant que tels, les autorités de l'État se sont soustraites à leurs responsabilités envers la nation et les citoyens des États-Unis. Le président fédéralisera les unités de la Garde nationale, déploiera des unités militaires et fera appel aux agences fédérales pour superviser la mise en oeuvre de toutes les lois. Le président a ajouté que les mesures seraient temporaires et qu'une fois que l'on pourrait faire confiance à ces États pour s'acquitter de leurs responsabilités, les mesures seraient levées. La nouvelle a choqué le pays, certains condamnant l'approche autoritaire tandis que d'autres y voient la première étape vers l'achèvement définitif de la reconstruction."
Russel_Court_Packing.2.d:0 "Les États-Unis sont embourbés dans un débat suite au dévoilement d'un nouveau projet du président Richard Russell visant à ajouter des juges à la Cour suprême. Même si les conservateurs du Congrès semblent enthousiasmés par cette perspective, des éléments plus libéraux condamnent le président pour avoir cherché à politiser le système judiciaire au profit de ses propres éléments. Les analystes prédisent que le président devra faire face à une bataille difficile au Congrès. Il s'agira de savoir quel camp pourra amener le plus de modérés à son côté."
Russel_Court_Packing.3.d:0 "Le président Richard Russell s'est félicité de l'annonce selon laquelle le Congrès avait adopté sa proposition visant à augmenter le nombre de juges à la Cour suprême. Le président a annoncé qu'il enverrait très prochainement les noms des candidats à la cour. Le Président a qualifié le vote de victoire pour la démocratie et de rétablissement du pouvoir judiciaire dans le rôle qui lui est assigné. Les opposants à cette loi l'ont condamnée comme un simple acte du président cherchant à consolider son autorité sur le pouvoir judiciaire. De nombreux journaux libéraux affirment que la nouvelle loi marque une défaite majeure pour la démocratie dans le pays. Les conservateurs de tout le pays sont ravis de la nouvelle et croient que leur point de vue sera enfin entendu."
Russel_Court_Packing.4.d:0 "Le Congrès n'a pas réussi à adopter une récente proposition du président Richard Russell visant à ajouter des juges à la Cour suprême. Le président et ses alliés du Congrès n'ont pas réussi à rallier suffisamment d'électeurs, notamment parmi les membres du Congrès les plus modérés. Le président a exprimé sa déception face au vote, le qualifiant de revers pour le peuple américain. Avec cet échec, le président a dépensé une grande partie de son capital politique et devra regagner son soutien. Le résultat est un revers majeur pour les conservateurs aux États-Unis."
Southern_Manifesto_Russel.2.d:0 "Le président Richard Russell a prononcé un discours sur le Manifeste du Sud récemment dévoilé. Le document, signé presque exclusivement par des sénateurs et membres du Congrès démocrates des États du Sud et par deux républicains, condamne les récentes décisions de la Cour suprême appelant à l'intégration des écoles et autres lieux publics. Le président a apporté son soutien au document et affirme que la Cour suprême a outrepassé sa compétence en se prononçant sur l'intégration. Il a appelé le tribunal à respecter la façon dont les Américains souhaitent vivre. Le document note que la constitution ne traite pas de l'intégration ou de l'éducation et que le tribunal a dépassé ses limites. Bien que de nombreux journaux du Sud soutiennent le document, la réaction à travers le pays a été largement négative, beaucoup accusant le président de favoriser ouvertement les sudistes blancs."
Russel.5.d:0 "Le président Richard Russell a salué l'annulation réussie de la décision de la Cour suprême dans l'affaire Brown V. Conseil de l'éducation. Le président a déclaré que la décision initiale était clairement un excès judiciaire et que son raisonnement reposait sur des bases fragiles. Il a salué le retour à la raison judiciaire et la protection des Américains pour qu'ils puissent contrôler leurs propres affaires, notamment l'éducation des enfants. La décision initiale appelait à l'intégration des écoles ségréguées après avoir déterminé que les enfants afro-américains étaient privés de ces écoles. Ce renversement est largement condamné par les journaux libéraux et les militants des droits civiques qui accusent le président d'utiliser les ressources de l'exécutif et du gouvernement fédéral pour priver les efforts visant à mettre fin à la discrimination raciale dans le sud."
Russel.4.d:0 "Le président Richard Russell a déclaré son soutien sans équivoque au gouverneur de l'Arkansas, Orval Faubus. Le gouverneur a refusé de se conformer à la récente décision de la Cour suprême dans l'affaire Brown V. Conseil de l'éducation. Le jugement a déclaré la ségrégation inconstitutionnelle et a appelé à l'intégration des écoles. Dans une escalade, le gouverneur a ordonné à la Garde nationale de l'Arkansas d'empêcher les étudiants noirs de fréquenter le lycée central de Little Rock. Le président faisait face à des pressions pour mettre en oeuvre l'ordonnance du tribunal fédéral, car beaucoup accusent le gouverneur de contester l'autorité fédérale. Cependant, dans ses remarques, le président a non seulement soutenu le gouverneur, mais a également exclu tout effort visant à utiliser les ressources fédérales. Il a déclaré qu'il ne pouvait moralement pas donner suite à une décision qu'il jugeait inconstitutionnelle."
Southern_Manifesto_Russel.1.d:0 "Le président Richard Russell a prononcé un discours sur le Manifeste du Sud récemment dévoilé. Le document, signé presque exclusivement par des sénateurs et membres du Congrès démocrates des États du Sud et par deux républicains, condamne les récentes décisions de la Cour suprême appelant à l'intégration des écoles et autres lieux publics. Le président a apporté son soutien au document et affirme que la Cour suprême a outrepassé sa compétence en se prononçant sur l'intégration. Il a appelé le tribunal à respecter la façon dont les Américains souhaitent vivre. Le document note que la constitution ne traite pas de l'intégration ou de l'éducation et que le tribunal a dépassé ses limites. Bien que de nombreux journaux du Sud soutiennent le document, la réaction à travers le pays a été largement négative, beaucoup accusant le président de favoriser ouvertement les sudistes blancs."
Russel_Court_Packing.1.d:0 "Le président Richard Russell a dévoilé son projet d'ajouter des juges à la Cour suprême. Le président a fait valoir que la Cour a actuellement besoin de plus de juges pour mieux refléter le pays et garantir que trop de pouvoir ne soit pas détenu par une poignée de juges. Il a déclaré que le tribunal actuel est inamovible et hautement politisé. La proposition reçoit un accueil mitigé. De nombreux journaux conservateurs soutiennent le président et son initiative, mais des journaux plus libéraux la qualifient de tentative pure et simple de transformer le système judiciaire en une institution conservatrice."
Brown_v_Board.10.d:0 "Le président Richard Russell a fermement condamné la récente décision historique de la Cour suprême dans l'affaire Brown V. Conseil de l'éducation. La Cour suprême a statué que l'idée d'un système séparé mais égal était inconstitutionnelle et a ordonné que toutes les écoles soient intégrées. Bien que la décision soit largement saluée par les Afro-Américains et les partisans des droits civiques, l'opposition du président est considérée comme sans précédent. Le président a déclaré que les tribunaux avaient outrepassé leur mandat et interféraient dans le mode de vie américain. Il a également souligné que la décision du tribunal visant à forcer la majorité à acquiescer aux minorités créait un mauvais précédent pour l'avenir. Lorsqu'on lui a demandé s'il ferait appel aux ministères fédéraux pour mettre en oeuvre la décision, le président a déclaré qu'il n'avait pas l'intention de le faire."
MacArthurCivilRights.3.d:0 "Le président Douglas MacArthur a réagi avec force aux récents efforts du gouverneur de l'Arkansas pour déployer les forces de la Garde nationale de l'État afin d'empêcher l'intégration des écoles de l'Arkansas. Cela allait au mépris d'une récente ordonnance d'un tribunal fédéral appelant à la fin de l'intégration. Des troupes aéroportées d'élite furent rapidement déployées en Arkansas où elles désarmèrent la Garde nationale et appliquèrent la loi martiale. Les efforts des pro-ségrégationnistes pour organiser des manifestations et bloquer les routes ont été durement interrompus par des informations faisant état de morts. Le président a fortement affirmé l'autorité fédérale dans cette crise."
MacArthurCivilRights.4.d:0 "Le président Douglas MacArthur a ordonné la déclaration de la loi martiale dans tous les États de Dixie. Le président a noté que bon nombre de ces anciens États confédérés ont refusé, résisté ou traîné les pieds dans la mise en oeuvre des lois sur les droits civiques et des récentes décisions de la Cour fédérale. En tant que tels, les autorités de l'État se sont soustraites à leurs responsabilités envers la nation et les citoyens des États-Unis. Le président fédéralisera les unités de la Garde nationale, déploiera des unités militaires et fera appel aux agences fédérales pour superviser la mise en oeuvre de toutes les lois. De nombreux pays font l'éloge des alliés américains à l'étranger tandis que les opposants aux États-Unis estiment que ces actions témoignent de la fragilité du système américain."
MacArthurCivilRights.6.d:0 "La déclaration de la loi martiale dans les États du sud a provoqué une réaction négative de la part des dixiecrates, tant au Congrès qu'au niveau des États. De nombreux sénateurs, dirigeants du Congrès et gouverneurs ont condamné les actions du président. Ils ont qualifié la loi martiale d'inconstitutionnelle. En réponse, le président Douglas MacArthur a ordonné au FBI d'arrêter de nombreux hauts dirigeants du Dixiecrat pour incitation aux troubles. Le président a ajouté que les arrestations faciliteraient la mise en oeuvre des lois fédérales. Bien que cette action soit saluée par certains, de nombreux journaux remettent en question la légalité et l'approche autoritaire adoptée par le président."
Moderate_Hero_Wallace.1.d:0 "George Wallace a remporté la récente primaire du poste de gouverneur démocrate en Alabama. Il est pratiquement assuré de remporter les prochaines élections. Wallace s'est présenté sur un programme modéré, avec le soutien de la NAACP. Son adversaire, John Patterson, dirigeait une plateforme pro-ségrégationniste et aurait, selon les rumeurs, le plein soutien du Ku Klux Klan. Cependant, avant les élections, il a été arrêté par le FBI pour ses liens avec l'organisation et ses efforts visant à empêcher l'application des lois fédérales sur les droits civils. Beaucoup félicitent Wallace et sa victoire est présentée comme un signe de changement dans la politique du Sud."
Warren_HC.1.d:0 "Le président Earl Warren a récemment terminé une longue tournée dans des États clés pour vanter ses projets de soins de santé universels pour tous les Américains. Au cours de sa tournée, le président a parlé de l'importance d'offrir à tous les Américains des chances égales de bénéficier des grands progrès des sciences médicales. Dans de nombreux discours, il a rappelé aux Américains que les militaires de retour de la Seconde Guerre mondiale étaient confrontés à de nombreuses difficultés, notamment aux frais médicaux. Il a souligné que si les États-Unis avaient bénéficié d'un système de santé universel, ces soldats auraient été protégés et n'auraient pas dû faire face à des dépenses qui les pèsent encore aujourd'hui. Les opposants au projet soutiennent qu'il est financièrement irréalisable et qu'il imposerait d'immenses charges au public américain pour le financer. Ils pensent également que le projet de loi entravera également l'innovation médicale. Le Congrès devrait voter prochainement."
Warren_HC.2.d:0 "Victoire politique majeure, le Congrès des États-Unis a approuvé le plan de soins de santé universels du président Earl Warren. Le président a dépensé beaucoup de temps et de capital politique pour garantir l'adoption du projet de loi qui garantira à tous les citoyens américains l'accès aux services médicaux. Le vote a été serré et les opposants ont ensuite continué à mettre en garde contre les coûts financiers, mais le président se serait montré ravi. Dans une déclaration faite après le vote, le président Warren a indiqué qu'il n'avait pas réussi à obtenir un vote similaire en tant que gouverneur, mais qu'il pouvait désormais tenir sa promesse envers les familles confrontées à d'horribles charges financières dues aux frais médicaux. Cette loi est sans précédent aux États-Unis et de nombreux journaux expriment à la fois leur soutien et leur condamnation à la nouvelle loi."
Warren_HC.3.d:0 "Coup dur politiquement majeur, le Congrès américain n'a pas réussi à approuver le plan de soins de santé universels du président Earl Warren. Le président a dépensé beaucoup de temps et de capital politique pour garantir l'adoption du projet de loi qui aurait garanti à tous les citoyens américains l'accès aux services médicaux. Cependant, les inquiétudes concernant le prix et la portée excessive du gouvernement étaient trop fortes. Le président a publié une déclaration exprimant sa frustration face à cet échec. Il a noté que dans les décennies à venir, les dépenses médicales ne feraient que devenir plus compliquées et plus lourdes pour les familles et que le Congrès avait agi en fonction de préoccupations à court terme. De nombreux journaux nationaux étaient divisés sur cette loi, et certains éditoriaux forts louent la loi et condamnent le Congrès."


Dem_Eisenhower.10.d:0 "Le président Dwight Eisenhower s'est entretenu avec les principaux dirigeants du parti démocrate du Sud. La réunion a eu lieu alors que le président cherche à maintenir l'unité du Parti démocrate. Les démocrates du Sud s'éloignent de plus en plus du reste du parti sur la question des droits civiques. De nombreux médias qualifient la faction des démocrates du Sud de « Dixiecrates ». Les Dixiecrats soutiennent la ségrégation et s'opposent aux efforts fédéraux visant à faire respecter les droits civiques dans les États du sud. Le président Eisenhower cherchera probablement à apaiser les craintes de voir le Congrès adopter des lois ciblant certaines pratiques, mais il soulignera probablement que les décisions de justice seront appliquées par le gouvernement fédéral. Le Parti démocrate espère que les négociations réduiront au minimum les tensions et renforceront la loyauté du parti pour les prochaines élections, le président Eisenhower étant très respecté dans le sud."
#rfk assassination
usa.19684.d:0 "Après s'être adressé à ses partisans peu après minuit dans la salle de bal Embassy de l'hôtel Ambassador au sujet des résultats des primaires de Californie et du Dakota du Sud, le sénateur Kennedy avait prévu de traverser la salle de bal pour se rendre à une deuxième réunion avec les travailleurs et les partisans de la campagne, mais la presse a demandé une conférence de presse impromptue. L'assistant de campagne Frank Dutton a informé le personnel de sécurité, dirigé par l'agent à la retraite du Federal Bureau of Investigation William Barry, du changement prévu, mais des inquiétudes ont été soulevées quant à la sécurité de la zone ainsi que sur le désir du sénateur Kennedy de se connecter avec ses partisans et de les rencontrer dans un cadre plus informel. Comment devons-nous procéder ?"
usa.19685.d:0 "Dans une tournure choquante des événements ce soir, le candidat à la présidentielle et sénateur Robert Kennedy, frère du président assassiné John F. Kennedy, a été abattu alors qu'il s'adressait à la presse sur les résultats des primaires de Californie et du Dakota du Sud dans la salle de bal Embassy de l'hôtel Ambassador. Le tireur, Sirhan Sirhan, palestino-américain, a été appréhendé. Bien que le motif reste à être confirmé, des suggestions ont été émises selon lesquelles cela pourrait être lié au fort historique de soutien de Kennedy à Israël. Le sénateur Kennedy a été emmené à l'hôpital voisin du Bon Samaritain et est malheureusement décédé plusieurs heures après son arrivée. L'assassinat a également donné lieu à une multiplication des appels lancés aux services secrets pour qu'ils protègent les principaux candidats à la présidentielle. Il reste à voir comment cela affectera la campagne présidentielle en cours, et les États-Unis sont une fois de plus en deuil après qu'un autre assassinat inutile ait coûté la vie à un dirigeant éminent et inspirant."
usa.19686.d:0 "Dans une tournure choquante des événements ce soir, le candidat à la présidentielle et sénateur Robert Kennedy, frère du président assassiné John F. Kennedy, a failli être abattu alors qu'il s'adressait à la presse sur les résultats des primaires de Californie et du Dakota du Sud dans la salle de bal Embassy de l'hôtel Ambassador. Le garde du corps du sénateur, William Barry, a sauté devant Kennedy, prenant lui-même la balle tandis que d'autres personnes dans le public appréhendaient le tireur, Sirhan Sirhan. Même si le motif n'a pas encore été confirmé, des suggestions ont été émises selon lesquelles cela pourrait être lié au fort historique de soutien de Kennedy à Israël. L'assassinat a également donné lieu à une multiplication des appels lancés aux services secrets pour qu'ils protègent les principaux candidats à la présidentielle. Il reste à voir comment cela affectera la campagne présidentielle en cours. Cela dit, la population américaine peut pousser un soupir de soulagement en sachant que, pour une fois, l'une de ses personnalités n'a pas été à nouveau frappée inutilement."

USA_Spratley.1.d:0 "Récemment, l'US Air Force (USAF) a pris contact avec notre roi Morton I. Une délégation dirigée par l'USAF a rencontré le roi Morton I pour discuter des possibilités stratégiques d'établir une base de l'US Air Force dans l'archipel. La réunion visait à aborder les intérêts mutuels en matière de coopération régionale en matière de sécurité et de défense, reconnaissant la position cruciale du Royaume en mer de Chine méridionale. Même si les détails des négociations restent confidentiels, nous resterons prudents, méfiants face aux intentions douteuses des États-Unis et à la menace potentielle du néocolonialisme."
USA_Spratley.2.d:0 "Récemment, l'armée de l'air américaine a pris contact avec le roi Morton I de la Maison Meads, monarque régnant du Royaume de l'humanité dans les îles Spratly du Maroc-Songhrati, pour discuter de la création d'une base de l'armée de l'air américaine. Bien qu'il ait souligné les avantages mutuels pour la sécurité régionale, le Royaume de l'Humanité a rejeté la proposition, invoquant des préoccupations concernant la souveraineté et l'influence étrangère. En réponse, la marine américaine prépare des plans pour occuper les îles afin de garantir nos intérêts stratégiques en mer de Chine méridionale. Nos analystes ont souligné l'importance de maintenir un passage maritime sûr en mer de Chine méridionale ; nous devrons décider de notre prochaine ligne d'action."
USA_Spratley.3.d:0 "Récemment, l'armée de l'air américaine a négocié avec succès avec le roi Morton I de la maison Meads, monarque régnant du royaume de l'humanité dans les îles Spratly du Maroc-Songhrati, pour établir une base de l'armée de l'air américaine. Le roi Morton Ier a accepté d'héberger la base militaire, reconnaissant les avantages mutuels pour la coopération régionale en matière de sécurité et de défense. Notre gouvernement a exprimé sa gratitude pour ce partenariat stratégique, soulignant son importance pour renforcer la stabilité et la sécurité en mer de Chine méridionale. Les préparatifs pour l'établissement de la base sont actuellement en cours, ce qui marque une avancée significative dans notre influence dans la région."
USA_Spratley.4.d:0 "Dans une tournure dévastatrice des événements, le Corps des Marines des États-Unis, soutenu par la flotte du Pacifique, envahit Southwark, la capitale du Royaume de l'Humanité, après que le roi Morton Ier eut fermement refusé d'autoriser l'établissement d'une base militaire américaine. L'action militaire soudaine et agressive a submergé les défenses locales et le roi Morton Ier a été arrêté au milieu du chaos. Le Royaume de l'humanité a condamné l'invasion comme un acte d'agression injuste, soulignant la violation de sa souveraineté et la menace qui pèse sur son indépendance. Le peuple du Royaume de l'Humanité est désormais confronté à un avenir incertain sous l'ombre d'une occupation militaire étrangère."
USA_Spratley.5.d:0 "Récemment, plusieurs journalistes ont rapporté que la marine américaine avait commencé à occuper les îles Spratly après que le roi Morton Ier de la maison Meads, dirigeant de la micro-nation non reconnue du « Royaume de l'humanité », ait refusé d'héberger une base militaire américaine. La réponse américaine rapide a impliqué plusieurs navires de guerre et un déploiement rapide de personnel naval sur des îles clés qui n'ont rencontré aucune résistance.\n\nCette décision radicale a suscité l'indignation du régime communiste basé à Hanoï et de l'État du Vietnam basé à Saigon, qui ont tous deux déclaré qu'il s'agissait d'une grave violation de leur souveraineté et d'une escalade de la guerre d'Indochine en cours. Les Mead ont demandé aux Nations Unies de réagir, en vain, tandis que l'Amérique insiste sur le fait que leur raisonnement est de lutter contre les pirates et de mettre fin à la colonisation illégale de la mer de Chine méridionale pour garantir des passages internationaux plus sûrs."
USA_50s_FP_Reach_Out_to_the_Meads:0 "À la rencontre des Meads"
USA_50s_FP_Reach_Out_to_the_Meads_desc:0 "Notre administration et nos forces armées souhaitent établir des contacts avec la dynastie Meads, née aux États-Unis et dirigeante du « Royaume de l'humanité » dans les îles Spratly. Nos analystes visent à explorer la possibilité de créer une petite base militaire dans la Micronation pour surveiller et contrôler les activités maritimes en mer de Chine méridionale, renforçant ainsi la stabilité régionale et les capacités de notre flotte du Pacifique."

PATCO_strike.1.d:0 "Plus tôt dans l'année, la PATCO (Professional Air Traffic Controllers Organization) et la Federal Aviation Administration (FAA) ont entamé des négociations pour un nouveau contrat. Malheureusement, PATCO a rejeté la contre-offre la plus récente de la FAA et a déclaré une grève après que la FAA a imposé la contre-proposition. Le principal problème de PATCO avec le nouveau contrat est que les heures de travail n'ont pas été réduites à 32 heures, ce qu'ils citent comme un problème de sécurité et le refus de l'administration d'élargir davantage le financement des retraites. D'autres revendications ont également été formulées, notamment en termes d'augmentation des salaires généraux. La grève affaiblira le trafic aérien, la logistique et le commerce au sein du pays et nuira à une économie déjà confrontée à des difficultés économiques. Cela dit, les employés fédéraux ne sont pas autorisés à faire grève en vertu du titre 5 du Code des États-Unis, ce qui en fait une grève illégale. Cela nous laisse plusieurs options. D'un côté, nous pourrions reprendre les négociations et proposer un compromis sur les demandes moins flagrantes de la PATCO tout en continuant à ignorer la question des heures de travail, nous pourrions carrément capituler face à leurs revendications, ou, plus radicalement, la déclarer grève illégale et forcer tous les grévistes à retourner immédiatement au travail ou à renoncer à leur emploi. Comment devons-nous procéder ?"
PATCO_strike.2.d:0 "Le président [USA.GetLeader] a invoqué le titre 5 du Code des États-Unis et a déclaré la grève de PATCO illégale, exigeant en outre que tous les grévistes retournent au travail dans les 48 heures sous peine d'être licenciés immédiatement. Le président a cité le serment prêté par ces employés : « Je ne participe à aucune grève contre le gouvernement des États-Unis ou contre un de ses organismes, et je ne participerai pas à une telle grève en tant qu'employé du gouvernement des États-Unis ou d'un de ses organismes. » tout en justifiant sa décision. Une décision d'urgence des tribunaux a également noté que les travailleurs devaient retourner au travail immédiatement et a déclaré le président de PATCO, Robert Poli, coupable d'outrage au tribunal. Après le délai de 48 heures, le président a autorisé le licenciement de presque tous 12 000 grévistes restants et leur a interdit tout futur emploi au gouvernement."
PATCO_strike.3.d:0 "Le président de la PATCO, Robert Poli, a annoncé la fin de la grève des contrôleurs aériens après des négociations fructueuses avec l'administration pour répondre à certaines des préoccupations du syndicat. Même si les heures de travail, une revendication clé de la PATCO, n'ont pas été réduites, de nouvelles augmentations de salaire et des avantages supplémentaires ont été accordés en échange de l'abandon par la PATCO de ses exigences en matière d'heures de travail. Le service aérien devrait redémarrer sous peu, mais les conséquences politiques de cette décision ne sont pas claires pour le moment. Cependant, des voix conservatrices ont fustigé cette décision, la qualifiant de capitulation face à un syndicat corrompu menant une grève illégale, étant donné le titre du Code américain interdisant les grèves parmi les employés du gouvernement fédéral. Les entreprises américaines ont également exprimé leurs inquiétudes quant à la possibilité que cette décision entraîne des troubles sociaux plus importants dans un avenir proche, à mesure que les contrats expirent."
PATCO_strike.4.d:0 "Dans un geste surprenant, le président [USA.GetLeader] a accédé aux demandes de la PATCO concernant une réduction des heures de travail, des augmentations de salaire supplémentaires et des investissements supplémentaires dans les retraites des contrôleurs aériens. Cela a abouti à une reprise rapide du service aérien. Cependant, cette décision s'est révélée controversée au sein de la population en général, de nombreux électeurs, en particulier dans le Sud et dans d'autres États où la présence des syndicats est limitée, désapprouvant fortement la motion. Les dirigeants et militants républicains ont également critiqué cette décision, la qualifiant d'ignorance flagrante de la loi américaine, étant donné que la grève était illégale en vertu du titre 5 du Code des États-Unis. Les syndicats ont salué cette décision, le président ayant rejeté les appels au licenciement des travailleurs et s'est engagé à redoubler d'efforts en faveur de la justice économique dans le pays lors des prochaines négociations dans les secteurs clés."
#anthem stuff
US_Anthem.1.d: "Bien que la bannière étoilée ait été officiellement adoptée comme hymne national en 1931, dans les années 1960, le symbole qu'elle représentait était remis en question par beaucoup. À mesure que le mouvement pour les droits civiques prenait de l'ampleur et que la lutte pour l'égalité devenait plus visible, un nombre croissant d'Américains ont commencé à participer à ce qui est devenu connu sous le nom de « protestation de l'hymne ». Il ne s'agissait pas simplement de la chanson elle-même, mais plutôt de ce qu'elle représentait : un décalage entre les idéaux de liberté et de justice proclamés par l'hymne et la réalité à laquelle sont confrontées les communautés minoritaires à travers le pays.\n\nCes manifestations, souvent silencieuses mais puissantes, ont servi de forme de résistance et d'appel à la nation pour qu'elle tienne ses promesses fondatrices. La question persiste désormais : notre hymne actuel reflète-t-il toujours qui nous sommes - ou qui nous aspirons à être ? Devrions-nous envisager d'adopter une nouvelle chanson nationale, qui résonnerait plus profondément avec les diverses voix de l'Amérique, et espérer qu'un tel changement pourrait aider à combler le fossé grandissant dans notre société ?"
#ComradeSVN Stuff
USAIDS.1.d:0 "Des médecins de New York et de San Francisco ont commencé à signaler des cas isolés d'un trouble immunitaire rare qui semble toucher principalement les jeunes hommes. Les victimes ont tendance à présenter des infections inhabituelles, des cancers et un déficit immunitaire extrême. La maladie n'a pas encore de nom et, avec des cas encore sporadiques, peu d'attention du public a été accordée à cette tendance émergente."
USAIDS.2.d:0 "Les rapports faisant état d'une maladie mortelle jusqu'alors non identifiée se multiplient rapidement. La maladie, désormais appelée syndrome d'immunodéficience acquise, se propage dans plusieurs communautés, notamment parmi les hommes homosexuels, les consommateurs de drogues intraveineuses et les hémophiles. L'inquiétude du public augmente et le manque profond d'informations sur la maladie est endémique, ce qui conduit à un mécontentement encore plus grand."
USAIDS.3.d:0 "Alors que l'administration maintient sa politique actuelle d'inaction fédérale face au nombre croissant de morts dus à l'épidémie de sida, des groupes d'activistes tels que ACT UP ont émergé pour exiger une réponse du gouvernement. Ces organisations organisent des manifestations, distribuent du matériel pédagogique et collectent des fonds pour la recherche médicale. Les contre-manifestations et les organisations contre les communautés homosexuelles, que certains considèrent comme la cause de l'épidémie, sont également de plus en plus courantes, alors que la pression s'accentue sur Washington pour qu'il prenne la crise au sérieux."
USALAriots.1.d:0 "Une vidéo personnelle a été diffusée montrant des policiers de Los Angeles frappant l'automobiliste afro-américain Rodney King à la suite d'une poursuite à grande vitesse. Les images ont été diffusées à l'échelle nationale, attirant l'attention du public sur les pratiques de la police à Los Angeles. Les policiers impliqués ont été inculpés et le procès devrait s'ouvrir dans les mois à venir."
USALARiots.2.d:0 "Un jury de l'État de Californie a rendu un verdict dans l'affaire Rodney King, acquittant les agents du LAPD inculpés. En réponse, d'importants troubles civils se sont développés à Los Angeles. Des incendies se sont déclarés, des propriétés commerciales ont été endommagées et les services d'urgence ont du mal à maintenir l'ordre. Le gouverneur de Californie a demandé l'aide du gouvernement fédéral."
USA_VIE.1.t:0 "Rapport confidentiel : Réévaluation stratégique de la situation indochinoise"
USA_VIE.1.d:0 "Objet : Changement de politique et options stratégiques en Indochine\n\nLes développements récents ont conduit à une réévaluation de la politique des États-Unis à l'égard du conflit en cours en Indochine. Notre corps diplomatique, nos conseillers militaires et nos planificateurs stratégiques se sont réunis pour explorer d'autres pistes d'action visant à stabiliser la région et à mettre fin aux hostilités. Ces mesures proposées mettent l'accent sur la priorité accordée aux intérêts et au bien-être de la population indochinoise, ce qui pourrait s'écarter du cadre d'alliance traditionnel avec le gouvernement français.\n\nLes réactions préliminaires à ce réalignement politique sont mitigées. D'une part, l'approche a été approuvée en raison de sa focalisation pragmatique sur les intérêts autochtones et la stabilité régionale à long terme. À l'inverse, des inquiétudes ont été exprimées quant à la détérioration potentielle des relations diplomatiques avec Paris et au risque d'une expansion communiste accélérée en l'absence d'une influence française soutenue.\n\nLa situation reste complexe et fluide. Il est néanmoins impératif que les États-Unis maintiennent leur engagement à soutenir le peuple indochinois par des moyens viables et efficaces."
USA_VIE.1.a:0 "Même si les implications sont préoccupantes, les États-Unis restent déterminés à aider la population indochinoise à assurer son avenir."
USA_VIE.2.t:0 "Dossier sur le prince Cuong-de"
USA_VIE.2.d:0 "De récents rapports des services de renseignement ont mis en lumière la tentative de coup d'État en cours menée par le prince Cuong-de contre le régime Bao-dai au Vietnam. Cuong-de, un révolutionnaire vietnamien ayant un historique de collaboration avec les forces d'occupation japonaises, a attiré l'attention des responsables américains après son engagement diplomatique avec l'Organisation Phuc-Viet. Cette évolution a suscité la colère de la police secrète de Bao-dai, connue sous le nom de « Xac-Te ».\n\nLa Xac-Te, un service de police secret et insaisissable, a été créée sous l'administration coloniale française dans les années 1920. Depuis 1948, des rumeurs sur un éventuel coup d'État de Cuong-de circulent, même si les preuves concrètes restent rares.\n\nLe mécontentement croissant face aux efforts anticommunistes inefficaces de Bao-dai a alimenté les appels au sein de certains cercles américains pour apporter un soutien secret à la faction de Cuong-de. Les rapports suggèrent que le mouvement de Cuong-de bénéficie d'un plus grand soutien populaire et fait preuve de capacités organisationnelles plus fortes que le gouvernement chancelant de Bao-dai. Beaucoup y voient une opportunité de sauver et de stabiliser l'ordre démocratique en détérioration en Asie du Sud-Est."
USA_VIE.2.a:0 "Nous espérons que De aura plus de succès que Dai !"
USA_VIE.2.b:0 "Il ne faut pas mettre les Français en colère ! Le Vietnam reste dans leur sphère d'influence."
USA_VIE.3.t:0 "Les États-Unis soutiennent notre cause !"
USA_VIE.3.d:0 "Aujourd'hui, un ambassadeur américain a réussi à établir des contacts avec des représentants de l'organisation Phuc-Quoc à Cho-lon, confirmant ainsi le soutien politique et militaire à notre cause. Grâce à cette connexion, un canal de communication officiel a été assuré directement avec les dirigeants de Cuong-de à Tokyo.\n\nLa réunion a été brève et discrète pour éviter d'être détectée par la police secrète Xac-Te de Bao-dai, mais plusieurs accords clés ont été conclus : les États-Unis soutiendront clandestinement le prochain coup d'État de Cuong-de et reconnaîtront officiellement le nouveau régime comme une force stabilisatrice engagée dans la décommunisation en Indochine. Par conséquent, les États-Unis retireront leur soutien et leur reconnaissance au gouvernement de Bao-dai.\n\nEn outre, des responsables américains ont confirmé leur intention de se réunir prochainement pour poursuivre les discussions sur l'assistance militaire et l'aide financière à notre cause."
USA_VIE.3.a:0 "Heureux d'être en affaires avec vous!"
USA_VIE.4.t:0 "Soutenir le jeune gouvernement Dan-Quoc : une nouvelle voie pour le Vietnam"
USA_VIE.4.d:0 "Avec l'ascension de l'empereur Nam-Hung (prince Cuong-de) sous le système unique « Dan-Vuong », les États-Unis reconnaissent une rare opportunité de stabiliser le Vietnam grâce à un régime progressiste et modernisateur. Contrairement aux idées fausses sur l'autocratie, le gouvernement de Cuong-de promeut un mélange innovant de tridémisme, de socialisme et de monarchisme - un modèle de « collaboration entre le roi et le peuple » visant l'industrialisation, l'égalité des sexes et la modernisation culturelle.\n\nCe « Royaume éclairé » prône la collaboration de classe pour vaincre le néo-impérialisme et le capitalisme, prônant la solidarité pan-asiatique contre la domination étrangère. La structure politique, avec un monarque élu et une législature parlementaire, signale une fusion prometteuse de tradition et de démocratie.\n\nLe soutien de Washington à Nam-Hung vise à favoriser la stabilité en Asie du Sud-Est en soutenant un gouvernement engagé en faveur du progressisme et de la coopération régionale, freinant potentiellement l'expansion communiste tout en faisant progresser les intérêts américains dans la région."
USA_VIE.4.a:0 "Nous sommes aux côtés de l'empereur Nam-Hung et du gouvernement du Jeune Dan-Quoc dans la construction d'un Vietnam moderne et uni."
USA_VIE.5.t:0 "Relance de l'équipe OSS Deer"
USA_VIE.5.d:0 "En 1945, l'équipe OSS Deer est déployée en Indochine française pour perturber les opérations japonaises et soutenir la résistance locale. L'équipe a travaillé en étroite collaboration avec Ho Chi Minh et Vo Nguyen Giap, fournissant une formation vitale, une aide médicale et un soutien logistique aux guérilleros du Viet Minh. Leur collaboration a abouti à des victoires communes contre les forces japonaises, les Américains et le Viet Minh combattant en compagnons d'armes. Même si l'équipe Deer est partie peu après la capitulation du Japon, les liens tissés au début n'ont pas été oubliés. Frustrée par le refus de la France d'intégrer son commandement indochinois à l'OTAN, l'administration Truman a autorisé le rétablissement de l'équipe Deer pour renouveler son soutien au gouvernement de Ho. Les États-Unis proposent désormais une reconnaissance formelle et une aide militaire à Hô Chi Minh, sous réserve de son acceptation d'un système démocratique multipartite. Cette alliance pragmatique reflète une sympathie croissante au sein de l'administration Truman et du Parti démocrate pour la cause nationaliste de Ho et offre une chance de stabiliser l'Indochine tout en luttant contre le colonialisme et l'influence soviétique. Cette décision marque un pari délicat mais nécessaire, ravivant un partenariat historique dans l'espoir de façonner un avenir démocratique pour l'Asie du Sud-Est."
USA_VIE.5.a:0 "Hô Chi Minh doit conduire le Vietnam vers la démocratie."
USA_VIE.6.t:0 "Des liens renouvelés et difficiles avec les Américains"
USA_VIE.6.d:0 "En 1945, l'équipe OSS Deer se tenait aux côtés de nos forces du Viet Minh, compagnons d'armes contre les impérialistes japonais. Leur aide en matière de formation, de médicaments et de logistique a renforcé la force de notre lutte révolutionnaire dirigée par notre Parti, véritable avant-garde de la libération du peuple vietnamien.\n\nAujourd'hui, plus d'une décennie plus tard, les Américains reviennent - non pas en tant qu'alliés de la révolution populaire, mais avec des conditions exigeant que notre Parti abandonne ses principes et adopte un système multipartite dicté par des intérêts étrangers. Même si leur aide militaire et leur reconnaissance peuvent offrir un avantage temporaire contre les oppresseurs coloniaux, le prix à payer est un compromis dangereux pour l'indépendance et la voie socialiste pour lesquelles notre Parti s'est battu sans relâche.\n\nLa détermination de notre Parti reste ferme : l'indépendance et le socialisme, libérés des liens impérialistes, doivent être le destin du Vietnam. La route est périlleuse, mais la volonté du peuple, dirigée par notre Parti, ne sera pas brisée."
USA_VIE.6.a:0 "Notre lutte est pour une véritable indépendance et un socialisme véritable, et non pour des marionnettes étrangères et des promesses creuses."
USA_VIE.6.b:0 "Nous avons accepté l'aide et le soutien du gouvernement progressiste américain."
USA_VIE.7.t:0 "Hô Chi Minh rejette la proposition américaine"
USA_VIE.7.d:0 "Malgré les ouvertures diplomatiques, Hô Chi Minh a décliné l'offre des États-Unis de soutenir son gouvernement en échange de l'adoption d'un système démocratique multipartite. Ho reste attaché à sa vision d'un Vietnam unifié et dirigé par les communistes et considère la proposition comme incompatible avec ses objectifs révolutionnaires.\n\nCe rejet complique la politique américaine en Indochine, laissant à l'administration Truman et à ses alliés moins d'options pour contrer l'influence coloniale française et la sphère soviétique en expansion. Le Parti démocrate est confronté à des divisions internes sur la manière de procéder, tandis que le risque d'une plus grande instabilité et d'une consolidation communiste dans la région augmente."
USA_VIE.7.a:0 "Un revers - Mais nous devons rester vigilants face à l'expansion communiste."
USA_VIE.8.t:0 "Hô Chi Minh accepte la proposition américaine"
USA_VIE.8.d:0 "Après de longues négociations, Hô Chi Minh a officiellement accepté la proposition des États-Unis d'adopter un système démocratique multipartite. En échange, les États-Unis fourniront une aide militaire et reconnaîtront leur gouvernement comme l'autorité légitime du Vietnam. Cette évolution inattendue signale un réalignement potentiel en Asie du Sud-Est, offrant une rare opportunité d'unir les intérêts nationalistes et démocratiques contre l'extrémisme colonial et communiste.\n\nL'administration Truman et les dirigeants du Parti démocrate ont accueilli favorablement ce compromis pragmatique, espérant qu'il stabilisera la région et limitera l'influence soviétique. Cependant, des inquiétudes subsistent quant au véritable engagement de Ho en faveur du pluralisme démocratique et aux défis posés par les intérêts coloniaux français bien ancrés."
USA_VIE.8.a:0 "Un nouveau chapitre plein d'espoir : l'avenir du Vietnam pourrait encore être démocratique et libre."
USA_VIE.9.t:0 "[GetNewspaperHeader]Washington reconnaît Hô Chi Minh"
USA_VIE_CuongDe_Installation.1.t:0 "Intervention américaine : Cuong-De installé au Sud-Vietnam"
USA_VIE_CuongDe_Installation.1.d:0 "Dans une démarche audacieuse et controversée, les États-Unis ont orchestré avec succès l'installation du prince Cuong-De à la tête du Sud-Vietnam, annulant ainsi le régime Bao-Dai qui était auparavant au pouvoir. Cette intervention représente un changement significatif dans la politique américaine envers l'Indochine, donnant la priorité à ce que Washington considère comme un leadership anticommuniste plus efficace.\n\nL'accession au pouvoir de Cuong-De a suscité des réactions mitigées. Les partisans soutiennent que ses références révolutionnaires pan-asiatiques et ses capacités organisationnelles le rendent mieux adapté pour lutter contre l'expansion communiste que l'inefficace administration Bao-Dai. Cependant, cette décision a profondément irrité la France, qui considère cette intervention comme un défi direct à son influence coloniale dans la région.\n\nLe gouvernement français a condamné l'action américaine comme une ingérence injustifiée dans sa sphère d'influence, menaçant de mettre à rude épreuve l'alliance de l'OTAN. Pendant ce temps, le nouveau gouvernement de Cuong-De est confronté au défi de consolider le pouvoir tout en naviguant dans le réseau complexe de la politique régionale et en maintenant le soutien américain.\n\nCette évolution marque l'ouverture d'un nouveau chapitre dans le conflit indochinois, dans lequel les intérêts américains s'écartent de plus en plus des objectifs coloniaux français, ce qui pourrait remodeler l'ensemble du paysage géopolitique de l'Asie du Sud-Est."
USA_VIE_CuongDe_Installation.1.a:0 "Cuong-De mènera le Vietnam à la victoire."

USA_VIE_CuongDe_Installation.2.t:0 "Soutien américain au régime de Cuong-De"
USA_VIE_CuongDe_Installation.2.d:0 "Les États-Unis ont apporté une aide militaire et économique significative à notre gouvernement du prince Cuong-De. Les responsables américains ont reconnu l'importance stratégique de soutenir un leadership fort et unifié au Sud-Vietnam, capable de contrer efficacement l'expansion communiste dans la région.\n\nCe soutien prend la forme d'équipements militaires, d'aide financière et d'une coopération diplomatique accrue. Les Américains ont fourni des quantités substantielles d'infanterie et d'équipement motorisé, ainsi qu'une aide économique pour aider à stabiliser notre pays. De plus, ils ont accru leur influence dans nos affaires, témoignant d'un engagement plus profond envers notre cause.\n\nCe partenariat renforce notre position tant au niveau national qu'international, nous fournissant les ressources nécessaires pour maintenir la stabilité et poursuivre nos objectifs d'unité et d'indépendance nationales."
USA_VIE_CuongDe_Installation.2.a:0 "Nous apprécions le soutien américain."

USA_VIN_Reunification.1.t:0 "Le chemin vers la réunification"
USA_VIN_Reunification.1.d:0 "Le Nord-Vietnam ayant adopté des réformes démocratiques et établi des relations positives avec les États-Unis, les conditions sont désormais réunies pour une réunification pacifique du Vietnam. Le gouvernement américain estime qu'un Vietnam unifié sous une gouvernance démocratique servirait de force stabilisatrice en Asie du Sud-Est et de rempart contre une nouvelle expansion communiste.\n\nNotre corps diplomatique a été en contact avec des représentants du Nord-Vietnam et les premières discussions suggèrent que le gouvernement de Hô Chi Minh est ouvert à l'idée d'une réunification dans un cadre démocratique. Cela représente une opportunité historique de mettre fin à la division du Vietnam et de créer une nation unique et prospère.\n\nToutefois, ce processus nécessitera une négociation et une coordination minutieuses. Nous devons veiller à ce que la réunification respecte la volonté du peuple vietnamien tout en préservant les principes démocratiques et les intérêts américains dans la région."
USA_VIN_Reunification.1.a:0 "Commencez le processus de réunification."

USA_VIN_Reunification.2.t:0 "Le Nord-Vietnam accepte la proposition de réunification"
USA_VIN_Reunification.2.d:0 "Une excellente nouvelle est arrivée de Hanoï. Le gouvernement du Nord-Vietnam, sous la direction de Hô Chi Minh, a officiellement accepté notre proposition de réunification. Cela marque une étape importante dans nos efforts diplomatiques et représente une étape majeure vers la fin de la division du Vietnam.\n\nLes dirigeants nord-vietnamiens ont exprimé leur volonté de travailler avec les États-Unis pour faciliter une transition pacifique. Ils comprennent que la réunification dans un cadre démocratique nécessitera une planification et une coordination minutieuses, mais ils sont engagés dans le processus.\n\nNous devons désormais nous coordonner avec le Nord et le Sud-Vietnam pour assurer une transition en douceur. La réunification se poursuivra probablement avec le Nord-Vietnam comme principale entité administrative, compte tenu de sa structure organisationnelle plus solide et des réformes démocratiques qu'il a mises en oeuvre."
USA_VIN_Reunification.2.a:0 "Procéder à la planification de la réunification."

USA_VIN_Reunification.3.t:0 "Coordonner les efforts de réunification"
USA_VIN_Reunification.3.d:0 "Nos équipes diplomatiques travaillent désormais en étroite collaboration avec le Nord et le Sud-Vietnam pour coordonner le processus de réunification. Le cadre de la réunification est en train d'être établi, le Nord-Vietnam étant appelé à servir de principale entité administrative de la nation unifiée.\n\nCe processus implique des négociations complexes concernant la gouvernance, l'intégration économique et la future structure politique d'un Vietnam unifié. Les États-Unis sont déterminés à garantir que la réunification se déroule sans heurts et que les principes démocratiques soient maintenus tout au long de la transition.\n\nNous faisons de bons progrès et toutes les parties semblent déterminées à mener à bien ce processus."
USA_VIN_Reunification.3.a:0 "Poursuivre les efforts de coordination."

USA_VIN_Reunification.4.t:0 "La réponse du Sud-Vietnam à la réunification"
USA_VIN_Reunification.4.d:0 "Le gouvernement du Sud-Vietnam s'est vu présenter une proposition de réunification sous la direction du Nord-Vietnam. Il s'agit d'une décision capitale qui déterminera l'avenir de notre nation.\n\nCertains membres du gouvernement y voient une opportunité de parvenir enfin à l'unité nationale et de mettre fin à une division de longue date. Ils considèrent les réformes démocratiques au Nord-Vietnam comme un signe positif et estiment que la réunification pourrait apporter stabilité et prospérité.\n\nCependant, d'autres se montrent plus prudents, inquiets de la perte d'autonomie et des défis potentiels de l'intégration. La décision appartient à nos dirigeants, et le choix que nous ferons façonnera le destin du Vietnam pour les générations à venir."
USA_VIN_Reunification.4.a:0 "Acceptez la réunification sous le Nord-Vietnam."
USA_VIN_Reunification.4.b:0 "Résistez à la proposition de réunification."

USA_VIN_Reunification.5.t:0 "La réunification commence"
USA_VIN_Reunification.5.d:0 "La réunification du Vietnam a officiellement commencé. Avec l'acceptation du Sud-Vietnam, le processus d'intégration des deux nations est désormais en cours. Le Nord-Vietnam, avec sa structure organisationnelle plus solide et ses réformes démocratiques, servira de fondement à l'État vietnamien unifié.\n\nLes territoires du Sud-Vietnam sont transférés sous l'administration nord-vietnamienne et le processus d'intégration politique et économique commence. Il s'agit d'un moment historique pour le peuple vietnamien, marquant la fin de décennies de division et le début d'une nouvelle nation unifiée.\n\nLes États-Unis continuent de soutenir ce processus, reconnaissant l'importance d'un Vietnam stable et démocratique en Asie du Sud-Est. Nous sommes déterminés à garantir que la réunification se déroule sans heurts et que les droits et intérêts de tous les Vietnamiens soient protégés."
USA_VIN_Reunification.5.a:0 "Une nouvelle ère commence pour le Vietnam."

USA_VIN_Reunification.6.t:0 "Réunification forcée"
USA_VIN_Reunification.6.d:0 "Malgré la résistance initiale du Sud-Vietnam, le processus de réunification se poursuit. Les États-Unis, en coordination avec le Nord-Vietnam, ont déterminé que la réunification était nécessaire à la stabilité régionale et aux intérêts à long terme du peuple vietnamien.\n\nBien que certains habitants du Sud-Vietnam puissent résister à ce changement, la dynamique vers la réunification est imparable. Les territoires du Sud-Vietnam sont intégrés à l'État nord-vietnamien et le gouvernement unifié est en train d'être établi.\n\nCe processus peut se heurter à certains défis et résistances, mais l'objectif ultime d'un Vietnam uni et démocratique reste primordial. Les États-Unis continueront de soutenir le gouvernement réunifié alors qu'il consolide son contrôle et oeuvre à la construction d'une nation stable et prospère."
USA_VIN_Reunification.6.a:0 "La réunification doit se poursuivre."

USA_VIN_Reunification.7.t:0 "Les États-Unis reconnaissent le Vietnam unifié"
USA_VIN_Reunification.7.d:0 "Les États-Unis ont officiellement reconnu le Vietnam nouvellement réunifié comme une nation souveraine et démocratique. Cette reconnaissance s'accompagne d'un engagement à soutenir le gouvernement unifié alors qu'il consolide son contrôle et oeuvre à la construction d'un État stable et prospère.\n\nNous avons conclu un pacte de non-agression avec le Vietnam et travaillons au renforcement des liens diplomatiques et économiques. Le gouvernement américain considère le Vietnam réunifié comme un partenaire important en Asie du Sud-Est et un allié clé dans la lutte contre l'expansion communiste.\n\nCette reconnaissance marque un nouveau chapitre dans les relations américano-vietnamiennes, basé sur le respect mutuel, des valeurs démocratiques partagées et des intérêts stratégiques communs."
USA_VIN_Reunification.7.a:0 "Un partenariat solide commence."

USA_VIN_Reunification.8.t:0 "Le Vietnam réunifié sous une gouvernance démocratique"
USA_VIN_Reunification.8.d:0 "La réunification du Vietnam est désormais achevée. La nation a été unifiée sous un gouvernement démocratique, le Nord-Vietnam servant de fondement au nouvel État. La capitale a été établie à Hanoï et le processus d'intégration politique et économique est en bonne voie.\n\nLe Vietnam unifié a adopté un système social-démocrate, s'éloignant de son ancienne orientation communiste. Cette transition reflète les réformes démocratiques mises en oeuvre lors du processus de réunification et l'influence du soutien américain.\n\nLe peuple vietnamien est désormais confronté au défi de construire une nation unifiée, mais il le fait avec le soutien des États-Unis et la promesse d'un avenir démocratique et prospère. Cet exploit historique marque la fin du conflit indochinois et le début d'une nouvelle ère pour le Vietnam."
USA_VIN_Reunification.8.a:0 "Le Vietnam est enfin unifié."
USA_VIE.9.d:0 "Washington, [?global.date.GetDateStringNoHourLong] - L'administration Truman a étendu sa reconnaissance diplomatique et son assistance militaire au gouvernement de Hô Chi Minh à Hanoï, clôturant quatre années au cours desquelles les États-Unis ont contribué à financer la guerre française contre le même homme. L'annonce a été faite depuis la Maison Blanche, et l'ambassade de France n'a pas été prévenue à l'avance.\n\nLes responsables déclarent que cette reconnaissance fait suite à l'engagement d'Ho Chi Minh d'ouvrir la République démocratique du Vietnam à un système multipartite. Ils sont moins réticents que d'habitude sur la deuxième raison. La France a refusé de placer son commandement indochinois sous l'OTAN, et Washington a conclu qu'une guerre qu'elle finance et qu'elle ne dirige pas n'est pas une guerre qui vaut la peine d'être financée. Les chancelleries européennes ont accueilli la nouvelle avec inquiétude ; Les mouvements anticoloniaux de Jakarta au Caire l'ont interprété comme le règlement d'un débat qu'ils espéraient perdre.\n\nOn ne saura pas avant un certain temps ce que vaut cette entreprise, et les hommes qui l'ont négociée le concèdent officieusement. Le pays reste divisé, le corps expéditionnaire reste sur le terrain et les États-Unis ont garanti un gouvernement qu'une partie substantielle de leur propre Congrès considère comme communiste, quel que soit le nom qu'ils se donnent désormais."
USA_VIE.9.a:0 "Washington a changé de camp."
USA_VIE.10.t:0 "Choc à Paris : les États-Unis soutiennent Hô Chi Minh"
USA_VIE.10.d:0 "Notre gouvernement français à Paris a exprimé son profond choc et sa consternation face à l'annonce récente selon laquelle les États-Unis ont officiellement reconnu et promis de soutenir militairement le régime de Ho Chi Minh au Nord-Vietnam. Cette alliance inattendue est considérée comme un défi direct à la souveraineté française et aux efforts visant à maintenir le contrôle de l'Indochine.\n\nLes responsables français préviennent que la décision de Washington porte atteinte à des décennies d'administration coloniale et menace d'enhardir les insurgés communistes dans toute la région. Le gouvernement français mobilise la voie diplomatique pour protester contre cette ingérence et prépare des plans d'urgence pour contrer l'influence croissante du Viet Minh et de ses nouveaux patrons américains.\n\nL'alliance a également fait craindre au sein de l'establishment politique français une instabilité accrue et une éventuelle escalade du conflit en Asie du Sud-Est, compliquant encore davantage les relations entre Paris et Washington."
USA_VIE.10.a:0 "Ce pari téméraire américain met en danger notre avenir en Indochine et notre honneur national."
USA_VIE.11.t:0 "Les États-Unis rejettent notre demande"
USA_VIE.11.d:0 "Des nouvelles décevantes sont arrivées de Washington. Après mûre réflexion, les États-Unis ont décidé de décliner notre demande de soutien dans notre lutte contre les forces communistes. Même si les Américains reconnaissent la menace à laquelle nous sommes confrontés, leur administration a déterminé qu'une participation directe au conflit indochinois n'était pas dans leur intérêt stratégique immédiat.\n\nCe rejet constitue un revers important pour nos efforts diplomatiques. Nous avions espéré que les États-Unis reconnaîtraient l'importance de soutenir un gouvernement anticommuniste en Asie du Sud-Est et fourniraient l'aide dont nous avons besoin pour défendre notre souveraineté. Sans le soutien américain, nous devons compter davantage sur nos propres ressources et continuer à rechercher d'autres voies d'aide internationale.\n\nNos relations avec les États-Unis risquent d'être tendues par cette décision, mais nous devons rester concentrés sur notre lutte pour l'indépendance et la stabilité, que nous bénéficiions ou non du soutien américain."
USA_VIE.11.a:0 "Nous devons poursuivre notre lutte sans le soutien américain."
USA_VIE.12.t:0 "Les États-Unis s'engagent au Sud-Vietnam"
USA_VIE.12.d:0 "Une excellente nouvelle est arrivée à notre gouvernement ! Les États-Unis se sont officiellement engagés à soutenir notre lutte pour l'indépendance et la stabilité. Washington s'est engagé à fournir une assistance pour nous aider à nous défendre contre l'agression communiste et à construire un Vietnam plus fort et plus prospère.\n\nCet engagement des Américains représente une victoire significative pour nos efforts diplomatiques. Avec le soutien américain, nous pouvons désormais mieux équiper nos forces, renforcer notre économie et résister fermement aux menaces auxquelles nous sommes confrontés. Le partenariat entre nos nations sera crucial pour garantir un Vietnam libre et indépendant."
USA_VIE.12.a:0 "Les Américains sont à nos côtés !"
USA_VIE.13.t:0 "Le Sud-Vietnam autorise l'intervention américaine"
USA_VIE.13.d:0 "L'État du Vietnam a officiellement autorisé l'intervention militaire américaine dans son conflit, exigeant une implication directe des États-Unis contre les forces communistes. Cette autorisation représente une escalade significative dans notre engagement en faveur de la défense du Sud-Vietnam.\n\nAvec cette autorisation, nous sommes désormais pleinement engagés à soutenir la lutte du Sud-Vietnam. Nos forces peuvent désormais opérer directement dans le conflit, en fournissant un soutien aérien, des forces terrestres et une assistance militaire complète. Cette décision nous enferme dans un engagement à long terme en faveur de la défense du Vietnam, mais elle offre également l'opportunité de contrer de manière décisive l'expansion communiste en Asie du Sud-Est.\n\nL'engagement est désormais irrévocable : nous serons aux côtés du Sud-Vietnam jusqu'à la victoire ou jusqu'à ce que nos objectifs stratégiques soient atteints."
USA_VIE.13.a:0 "Nous sommes désormais pleinement engagés dans la défense du Sud-Vietnam."
##Military stuff ig
USAF.1.d:0 "L'armée des États-Unis trouve ses origines dans l'armée continentale, formée le 14 juin 1775 pendant la guerre d'indépendance américaine. Dirigée par George Washington, cette première force a surmonté de graves pénuries et des divisions internes pour assurer son indépendance vis-à-vis de la Grande-Bretagne, jetant ainsi les bases d'une tradition militaire nationale.\n\nTout au long du XIXe siècle, l'armée américaine a étendu sa présence aux frontières, a combattu lors de la guerre de 1812 et a remporté la victoire lors de la guerre américano-mexicaine (1846-1848). La guerre civile a marqué une période de transformation, alors que la mobilisation de masse, la guerre industrielle et l'évolution tactique ont transformé l'armée en une force de combat moderne.\n\nAu XXe siècle, l'armée avait commencé à projeter sa puissance à l'échelle mondiale. Au cours de la Première Guerre mondiale, elle a déployé plus d'un million d'hommes en Europe, contribuant ainsi à faire pencher la balance contre les puissances centrales. Entre les guerres, les budgets limités et la politique isolationniste ont ralenti la modernisation, mais des réformes clés et la planification de la guerre ont jeté les bases d'une expansion future.\n\nLa Seconde Guerre mondiale a propulsé l'armée américaine au rang de superpuissance mondiale. Combattant à travers l'Europe, l'Afrique du Nord et le Pacifique, elle a exécuté des opérations massives du jour J jusqu'aux Philippines, menant la victoire alliée. En 1945, elle était devenue la force terrestre la plus avancée technologiquement et la plus performante sur le plan logistique de l'histoire.\n\nAujourd'hui, en 1949, alors que les tensions de la Guerre froide s'accentuent et que des alliances comme l'OTAN prennent forme, l'armée américaine se prépare à une nouvelle ère, non seulement de guerre, mais aussi de dissuasion mondiale, de reconstruction et de diplomatie militaire dans un monde divisé."
USAF.2.d:0 "Le Corps des Marines des États-Unis a été fondé le 10 novembre 1775 à Tun Tavern, à Philadelphie, en tant que force d'infanterie navale chargée de la sécurité à bord des navires et des raids amphibies. Des guerres barbaresques aux côtes de Tripoli, les Marines ont acquis très tôt une réputation de discipline, d'audace et d'assaut acharné.\n\nTout au long du XIXe siècle, le Corps des Marines a servi dans presque tous les conflits américains, en combattant dans la guerre américano-mexicaine, la guerre civile et les interventions à l'étranger au cours de ce que l'on appelle les « guerres de la banane », où il a affiné ses compétences en matière de guerre expéditionnaire, de tactiques de petites unités et de déploiements rapides dans des pays étrangers.\n\nLa Première Guerre mondiale a vu les Marines se distinguer au bois Belleau (1918), où ils ont stoppé l'avancée allemande et se sont forgés une réputation légendaire de troupes de choc. L'entre-deux-guerres a été consacrée à l'élaboration de nouvelles doctrines amphibies qui deviendront décisives dans le prochain conflit mondial.\n\nAu cours de la Seconde Guerre mondiale, le Corps des Marines est devenu la pointe de la lance du théâtre du Pacifique. De Guadalcanal à Iwo Jima et Okinawa, les Marines ont pris d'assaut les plages sous le feu, maîtrisant l'art brutal de l'assaut amphibie. Leur courage, leur adaptabilité et leur détermination farouche en ont fait une force d'élite respectée à la fois par les alliés et les ennemis.\n\nEn 1949, le Corps des Marines des États-Unis se présente comme une force spécialisée et renforcée, conçue pour un déploiement rapide et une guerre amphibie. À l'aube de la guerre froide, les Marines se préparent à combattre sur n'importe quel rivage, sous n'importe quel climat, partout où les intérêts américains sont menacés."
USAF.3.d:0 "La marine américaine trouve ses origines dans la marine continentale, créée en 1775 pour harceler les navires britanniques pendant la guerre d'indépendance américaine. Bien que dissoute après l'indépendance, une force navale permanente fut rétablie en 1794 pour lutter contre la piraterie et protéger le commerce américain.\n\nAu XIXe siècle, la marine américaine est passée d'une force de défense côtière à une puissance maritime. Elle a joué un rôle central dans la guerre de 1812, bloquant la Confédération pendant la guerre civile et affirmant les intérêts américains à l'étranger pendant la guerre hispano-américaine, sécurisant ainsi les principales possessions du Pacifique et des Caraïbes.\n\nLe début du XXe siècle a été marqué par une nouvelle expansion, avec la « Grande Flotte Blanche » du président Theodore Roosevelt, signalant l'arrivée de l'Amérique en tant que force navale mondiale. Au cours de la Première Guerre mondiale, la marine était l'une des plus importantes au monde, jouant un rôle crucial dans l'escorte des convois et le maintien du contrôle maritime.\n\nLa Seconde Guerre mondiale a transformé la marine américaine en un monstre. À Pearl Harbor, elle a été prise au dépourvu, mais elle a rapidement rebondi. Des flottes de porte-avions massives, des sous-marins de pointe et une logistique supérieure ont permis à la Marine de faire reculer les avancées japonaises à travers le Pacifique. Les batailles à Midway, dans le golfe de Leyte et à Okinawa confirmèrent la domination de la Marine, tandis que dans l'Atlantique, elle maintenait les lignes de ravitaillement ouvertes contre la menace des sous-marins.\n\nEn 1949, la marine américaine est devenue le maître incontesté des mers. Avec ses porte-avions, ses ambitions nucléaires et sa portée mondiale, elle constitue désormais le pivot de la projection de la puissance américaine dans un monde de plus en plus bipolaire\n\n."
USAF.4.d:0 "Les origines de la puissance aérienne américaine remontent à la division aéronautique de l'US Army Signal Corps en 1907 et aux exploits audacieux des aviateurs de la Première Guerre mondiale. Bien que de taille modeste, ces premières unités ont jeté les bases d'une doctrine de l'aviation militaire qui connaîtrait une croissance exponentielle au cours des décennies à venir.\n\nAu cours de l'entre-deux-guerres, l'US Army Air Corps a plaidé en faveur d'un bombardement stratégique et d'une stratégie aérienne indépendante, même si les budgets restaient serrés et que le soutien du public à une branche aérienne distincte était limité. Des visionnaires comme Billy Mitchell ont poussé l'idée que les guerres futures se décideraient dans le ciel.\n\nLa Seconde Guerre mondiale leur a donné raison. L'armée de l'air américaine (USAAF), créée en 1941, est devenue l'une des armes aériennes les plus puissantes au monde. Avec d'énormes flottes de bombardiers comme les B-17 et B-29 et des chasseurs légendaires comme le P-51 Mustang, la puissance aérienne américaine a contribué à paralyser l'industrie de l'Axe, à soutenir les opérations au sol et, finalement, à porter les frappes atomiques qui ont mis fin à la guerre du Pacifique.\n\nEn 1947, la National Security Act a reconnu l'importance stratégique de la suprématie aérienne en établissant l'armée de l'air américaine en tant que branche de service distincte et indépendante. Aujourd'hui, en 1949, alors que les tensions avec l'Union soviétique montent, l'USAF est chargée non seulement de défendre le ciel américain, mais aussi de projeter une puissance de dissuasion à travers le monde, armée de bombardiers, d'avions à réaction et d'une doctrine façonnée par la guerre mondiale."
#LA Riots
USALARiots_news.1.d:0 "En réponse dramatique à l'escalade de la violence, l'armée américaine a déployé plus de 4 000 soldats fédéraux armés pour aider les autorités locales à rétablir l'ordre dans Los Angeles. Cette décision fait suite à plusieurs jours d'intenses émeutes, pillages et incendies criminels qui ont éclaté après l'acquittement controversé de quatre agents du LAPD accusés du passage à tabac brutal de Rodney King.\n\nLes troubles, qui ont commencé dans le centre-sud de Los Angeles, se sont rapidement propagés à toute la ville, faisant plus de 60 morts, des milliers de blessés et causant d'importants dégâts matériels. La police locale et la Garde nationale de Californie ont eu du mal à contenir le chaos, ce qui a incité le gouverneur Pete Wilson à demander une intervention fédérale.\n\nLe président a autorisé le déploiement tard hier soir, envoyant des Marines et des soldats américains dans la ville. Les troupes sont arrivées à bord de véhicules blindés, imposant des couvre-feux et sécurisant les zones clés dans le but de stabiliser la situation."

#Recognizing Diem's government
USA_DiemRecog.1.t:0 "Un gouvernement à Saigon"
USA_DiemRecog.1.d_referendum:0 "Les résultats du référendum du 23 octobre ont été télégraphiés à Washington, et l'ambassade a joint une note nous demandant de ne pas répéter ce chiffre en public. Ngo-Dinh-Diem aurait obtenu 98,9 pour cent des voix contre Bao-Dai. A Saigon même, on lui attribue plus de bulletins de vote qu'il n'y a d'électeurs inscrits.\n\nPersonne au ministère ne se fait d'illusion sur ce qui s'est passé. La question qui se pose à nous n'est pas de savoir si le décompte était honnête mais si l'homme qu'il a installé mérite d'être reconnu - et là-dessus, la réponse est la même depuis deux ans. Bao-Dai gouvernait depuis une villa à Cannes. Diem gouverne depuis le palais Doc-Lap, a brisé les sectes qui découpaient le delta en fiefs et a dit aux Français en face que leurs droits issus de traités prenaient fin avec leur guerre.\n\nLa recommandation est une lettre de félicitations du président, une reconnaissance formelle de la République du Vietnam et une déclaration publique selon laquelle la mission d'aide se poursuit sans interruption. Cela sera lu à Hanoï comme une déclaration selon laquelle la partition est permanente, et ils n'auront pas tort."
USA_DiemRecog.1.d_premier:0 "Ngo-Dinh-Diem dirige le sud du Vietnam. Il est arrivé sans parti, sans armée et sans argent, et il a dépensé tous les mois depuis qu'il les a acquis aux dépens de ceux qui les détenaient : les sectes, le palais, la Sûreté et, plus d'une fois, nos propres conseillers.\n\nL'ambassade estime qu'il est impossible de travailler avec lui et impossible de le remplacer. Il n'existe dans le Sud aucune autre personnalité de réputation nationale qui ne soit ni un client français, ni un serviteur de Bao-Dai, ni en prison ; et les cadres Viet-Minh du delta n'attendent pas poliment que nous regardions.\n\nLa recommandation est une reconnaissance formelle de son gouvernement, une lettre du président et la mission d'aide permanente. Cela nous engage envers lui. C'est là le point."
USA_DiemRecog.1.a:0 "Étendre la reconnaissance et pérenniser la mission humanitaire."
USA_DiemRecog.2.t:0 "Washington nous reconnaît"
USA_DiemRecog.2.d:0 "Le billet américain est arrivé au Doc-Lap Palace avant le billet français, ce qui est en soi le message. Il offre les félicitations du président, sa reconnaissance formelle et, dans le paragraphe qui compte, la confirmation que la mission d'aide et le groupe d'assistance militaire se poursuivront de manière permanente plutôt qu'à la demande de Paris.\n\nPour la première fois, le gouvernement de Saigon a un patron étranger qui traite directement avec lui plutôt que par l'intermédiaire du Haut-Commissaire. Les hommes qui ont passé une décennie à insister sur le fait que l'indépendance vietnamienne était un cadeau français à distribuer en plusieurs versements ont été discrètement contournés.\n\nIl y aura un prix pour cela, et il sera présenté plus tard. Pour l'instant, le palais a ce qu'il lui fallait : la garantie américaine, par écrit, qui nous est adressée."
USA_DiemRecog.2.a:0 "Ce sont les Américains qui traitent avec nous maintenant, pas avec Paris."
USA_DiemRecog.100.t:0 "[GetNewspaperHeader]Les États-Unis reconnaissent le gouvernement de Saigon"
USA_DiemRecog.100.d:0 "Les États-Unis ont accordé une reconnaissance diplomatique formelle au gouvernement de Ngo-Dinh-Diem, accompagnée d'une lettre de félicitations du président et de la confirmation que l'assistance économique et militaire américaine se poursuivra de manière permanente.\n\nCette annonce met fin à des mois de spéculations à Paris et à Saigon sur la question de savoir si Washington continuerait à faire passer sa politique indochine par les institutions françaises. Ce ne sera pas le cas. L'aide américaine, qui passait auparavant par le Haut-commissariat français, sera désormais livrée directement au gouvernement vietnamien - un changement de plomberie qui équivaut à un changement de souveraineté.\n\nLa réponse de Hanoï a été immédiate et prévisible. Les émissions de radio du Nord décrivent cette reconnaissance comme le moment où les États-Unis ont pris la position que la France avait quittée et comme la preuve que la partition convenue à Genève n'a jamais été conçue pour être temporaire."
USA_DiemRecog.100.a:0 "Les Américains ont choisi leurs Vietnamiens."

#Backing the French coup against Diem
USA_DiemCoup.1.t:0 "Washington ne s'y opposera pas"
USA_DiemCoup.1.d:0 "L'ambassadeur américain s'est rendu au Quai d'Orsay cet après-midi et, dans un langage soigneusement choisi pour ne rien engager sur papier, a indiqué que le gouvernement américain considérerait un changement de direction à Saigon comme une question interne vietnamienne.\n\nL'implication n'est pas subtile. Washington a été la seule chose qui se dresse entre Diem et les officiers qui veulent son départ ; Le général Hinh a un commandement militaire et un grief, les Binh-Xuyen ont la police de Saigon et beaucoup d'argent, et tous deux attendent précisément ce signal. Il est maintenant donné et il ne le sera pas deux fois.\n\nEn revanche : la Quatrième République a passé huit ans et fait cent mille victimes à apprendre ce qui arrive aux gouvernements français qui pénètrent en Indochine. Si l'opération échoue, la France sera blâmée sur trois continents, et les Américains n'auront rien dit que quiconque puisse citer."
USA_DiemCoup.1.a:0 "Les officiers ont leur garantie. Laissez-les bouger."
USA_DiemCoup.1.b:0 "La France ne sera pas l'instrument de Washington dans une affaire aussi sale."
USA_DiemCoup.2.t:0 "Le mouvement des généraux"
USA_DiemCoup.2.d:0 "Cela a commencé avant l'aube avec le central téléphonique et la station de radio, c'est ainsi que tout commence toujours. Les blindés de l'Armée nationale vietnamienne sont dans les rues autour du palais Doc-Lap, les Binh-Xuyen ont jeté un cordon sur Cholon et les officiers ont publié un communiqué annonçant la tenue d'un conseil militaire provisoire et le rétablissement de bonnes relations avec la France.\n\nCe qu'ils n'ont pas fait, c'est prendre le palais. La garde présidentielle est intacte, les bataillons loyalistes n'ont pas répondu aux convocations à la caserne et les Américains, qui, il y a trois jours, étaient la seule certitude dans les calculs de ce gouvernement, n'ont rien dit du tout.\n\nOn demande au président s'il doit négocier les conditions ou ordonner aux loyalistes d'entrer dans la ville. Nous n'aurons pas le temps de demander deux fois."
USA_DiemCoup.2.a:0 "Le palais ne peut pas tenir. Les conditions seront acceptées."
USA_DiemCoup.2.b:0 "Faites entrer les loyalistes. Laissez les officiers s'expliquer devant le pays."
USA_DiemCoup.3.t:0 "Paris décline"
USA_DiemCoup.3.d:0 "La réponse du Quai d'Orsay est polie, longue et entièrement négative. La France, explique-t-elle, n'a aucune envie de s'impliquer dans les arrangements politiques internes de l'État vietnamien et aurait de toute façon du mal à expliquer à sa propre Assemblée nationale pourquoi elle s'est engagée dans une telle implication sur suggestion américaine.\n\nLa lecture de l'ambassade est que Paris a parfaitement compris l'offre et l'a déclinée pour la raison évidente : quoi qu'il en soit, ce qui s'ensuivrait serait un coup d'État français soutenu par une promesse américaine que personne ne pourrait produire par écrit, et la facture arriverait adressée à la France seule.\n\nDiem reste donc, et il en saura dans la semaine : le Quai d'Orsay fuit comme une passoire et a toutes les raisons de vouloir qu'il le sache."
USA_DiemCoup.3.a:0 "Ensuite, nous nous retrouvons avec l'homme que nous avons."
USA_DiemCoup.4.t:0 "Les chutes du palais"
USA_DiemCoup.4.d:0 "Saigon a un conseil militaire, la France a retrouvé ses droits issus de traités et les États-Unis ont un État client qui appartient à quelqu'un d'autre. Le trafic par câble depuis l'ambassade est inhabituellement court.\n\nLes hommes qui dirigent désormais le Sud étaient des officiers français avant d'être vietnamiens et n'ont pas l'intention de prétendre le contraire. Tous les arguments avancés par le ministère depuis quatre ans - selon lesquels la guerre en Indochine était une guerre contre le communisme plutôt qu'une guerre pour l'empire, et que les nationalistes et les Américains voulaient la même chose - ont été retirés en une seule matinée par notre propre décision.\n\nHanoï s'est vu confier, de manière complète et gratuite, le dossier qu'il tente de défendre depuis 1946. Les cadres du delta n'auront pas à en inventer un mot."
USA_DiemCoup.4.a:0 "Nous avons acheté une colonie française et avons appelé cela le confinement."
USA_DiemCoup.5.t:0 "Le palais détient"
USA_DiemCoup.5.d:0 "Les bataillons loyalistes sont entrés dans Saigon aux premières lueurs du jour et le coup d'État a été terminé à midi. Hinh est à bord d'un avion pour la France, le cordon Binh-Xuyen a été brisé par l'artillerie et Ngo-Dinh-Diem décrit à la radio l'affaire comme une conspiration étrangère contre l'indépendance vietnamienne.\n\nIl ne nous a pas nommés. Il n'en a pas besoin. L'ambassadeur rapporte que le palais sait depuis quelques jours exactement qui a dit à Paris qu'il pouvait procéder, et que l'attitude du président lors de leur dernière entrevue était celle d'un homme qui range quelque chose pour un usage ultérieur.\n\nNous avons dépensé le crédit de quatre ans, sans réussir à le destituer et l'avons laissé au pouvoir en sachant précisément ce que nous avions tenté. Il n'existe aucune version des cinq prochaines années dans laquelle cela ne nous coûtera pas cher."
USA_DiemCoup.5.a:0 "Il a survécu et il sait qui a payé pour cela."
USA_DiemCoup.100.t:0 "[GetNewspaperHeader]Le Conseil militaire prend le pouvoir à Saigon"
USA_DiemCoup.100.d:0 "Un conseil militaire provisoire a pris le pouvoir à Saigon suite à une opération lancée avant l'aube par des unités de l'Armée nationale vietnamienne de concert avec les forces de Binh-Xuyen. Ngo-Dinh-Diem a été démis de ses fonctions. Le premier communiqué du Conseil annonce le rétablissement de relations normales avec l'Union française.\n\nLe gouvernement français a nié toute implication. Le démenti a été reçu avec le sérieux qu'il mérite ; les officiers qui ont mené l'opération étaient des officiers de l'armée française, et le communiqué a été rédigé dans un français que la presse vietnamienne a eu la méchanceté de qualifier de courant.\n\nWashington s'est contenté de constater que le changement de gouvernement est une affaire interne vietnamienne. Les observateurs d'Asie du Sud-Est ont tiré la conclusion évidente sur ce que les États-Unis savaient et sur le moment où ils ont décidé de ne pas s'y opposer, et c'est à Hanoï que l'on tire le plus fort cette conclusion, où l'affaire est déjà décrite comme le jour où l'anticolonialisme américain a été discrètement enterré à Saigon."
USA_DiemCoup.100.a:0 "Les généraux ont Saigon et Paris a les généraux."
