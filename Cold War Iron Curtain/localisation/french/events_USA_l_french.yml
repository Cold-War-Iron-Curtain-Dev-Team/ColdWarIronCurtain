 usa_flavor.83.a:0 "C'est en effet inquiétant"
 usa_flavor.4.d:0 "Aujourd'hui marque la sortie du film *\"They Shoot Horses, Don't They?\"* adapté du roman de 1935 du même nom écrit par Horace McCoy.\n\nRéalisé par Charlie Chaplin et mettant en vedette son fils aux côtés de la jeune Marilyn Monroe, le film plonge dans une marathoniade de danse de l'ère de la Grande Dépression, où les participants luttent pour survivre. Le film a reçu des critiques partagées et peine encore au box-office, malgré la menace des purges hollywoodiennes et des chasses aux sorcières communistes.\n\nCependant, auprès du public, il demeure un franc succès, capturant parfaitement l'histoire et les idéaux du roman écrit plus de 20 ans plus tôt."
 usa_flavor.3.d:0 "Des changements révolutionnaires dans le monde de la bande dessinée.\n\nCe matin, dans une déclaration conjointe dans leurs magazines respectifs, les deux géants de l'industrie ont annoncé leur fusion dans Epic Comics dès la semaine prochaine.\n\nLes deux éditeurs traversaient des difficultés économiques après les récentes restrictions imposées par le président Kefauver. La couverture dévoilée montre l'icône de National, Superman, affrontant le Captain America d'Atlas, accompagnée du titre \"L'événement qui changera l'histoire à jamais !\"\n\nNous ne savons pas encore comment cette fusion affectera l'industrie de la bande dessinée, mais avec les précommandes pour le prochain numéro qui explosent et au grand mécontentement du président Kefauver, cela pourrait bien marquer le début d'un renouveau de l'intérêt pour le genre des super-héros auprès de la jeunesse américaine."
 usa_flavor.2.d:0 "Le célèbre cryptographe, mathématicien et ingénieur, Claude Shannon, a publié un article intitulé *\"Communication Theory of Secrecy Systems\"* dans le *Bell System Technical Journal*. Cet article est une version déclassifiée d'un rapport qu'il avait soumis en 1945, alors qu'il servait comme cryptographe pour le gouvernement des États-Unis pendant la guerre. Dans cet article, Shannon prouve que tous les chiffres théoriquement incassables doivent respecter les mêmes exigences que la technique de chiffrement appelée *one-time pad* (pad de chiffrement à usage unique). Il aborde également la cryptographie sous l'angle de la théorie de l'information, un domaine dans lequel il est un pionnier. Bien que peu connu, cet article constitue le texte fondateur de la cryptographie moderne."
 PBSUCCESS.50.d:0 "Le régime de gauche au Guatemala a consolidé son contrôle sur le pays et instauré des mesures draconiennes pour réprimer les dissidences tout en mettant en place une nationalisation accrue des entreprises étrangères, notamment la United Fruit Company, une entreprise américaine essentielle. En réponse, la CIA a lancé l'opération PBSuccess, visant à établir des émissions radio et à instiller la peur et la panique parmi la population guatémaltèque. Dans cet environnement chaotique, l'armée guatémaltèque, sous une direction pro-américaine et anti-communiste, aurait pu rallier même les officiers pro-gouvernementaux pour intervenir et mettre fin au régime de Jacob Arbenz. Cependant, ce plan a échoué. Une fois que des informations ont été divulguées concernant un déploiement soviétique imminent, le président a pu ordonner à l'armée des États-Unis d'envahir le Guatemala pour rétablir la démocratie et protéger les citoyens et les biens américains dans le pays, avec le soutien du peuple américain."
 watergate.1.d:0 "Le président Nixon a chargé son procureur général, John Mitchell, de devenir le président du nouveau Comité pour la Réélection du Président (CRP). Mitchell a démissionné de son poste au sein du cabinet et supervisera désormais le CRP. Ce comité réunit des soutiens financiers de haut niveau, des alliés politiques et des conseillers du président afin d'assurer sa réélection. Le conseiller présidentiel John Dean et l'agent retraité du FBI Gordon Liddy jouent un rôle clé au sein de l'organisation. On s'attend à ce qu'ils maintiennent le président informé et l'aident à diriger des actions spécifiques. L'organisation se concentrera sur la collecte de fonds pour la campagne, en dirigeant ces fonds plus efficacement, en enquêtant et en contrant les tactiques du Parti démocrate. Les opposants au président appellent déjà le CRP par le nom insultant de CREEP."
 watergate.2.d:0 "Lors d'une récente réunion de haut niveau du Comité pour la Réélection du Président (CRP), l'ancien agent du FBI Gordon Liddy a proposé une vaste campagne d'espionnage contre le Parti démocrate. Le président du CRP, John Mitchell, a rejeté l'idée comme irréaliste. Lors d'une réunion suivante, Liddy a proposé une version beaucoup plus modérée du plan, suggérant l'installation de micros et la prise de photos de documents de campagne au Quartier général national du Parti démocrate. Mitchell et le conseiller présidentiel John Dean doivent maintenant décider s'ils doivent approuver cette proposition, car le président ne peut pas en être informé, ou s'ils doivent la rejeter et faire confiance au CRP pour remporter la réélection sans recourir à des informations internes. Liddy a ajouté qu'il comptait faire appel au consultant de la Maison Blanche et ancien agent de la CIA, Howard Hunt, un opérateur expérimenté, pour mettre en œuvre le plan."
 watergate_alt.1.d:0 "Après avoir obtenu l'approbation et un financement clandestin du Comité pour la Réélection du Président (CRP), Gordon Liddy et John Dean ont travaillé à la mise en place d'une équipe. Liddy a fait appel à Howard Hunt, qui a réuni une équipe d'anciens agents de la CIA et du FBI. L'équipe a pénétré dans le Quartier général national du Parti démocrate situé dans le complexe du Watergate à Washington D.C. Sans être détectée, l'équipe a réussi à installer des dispositifs d'écoute sur les téléphones du président du Parti démocrate et de son principal conseiller. En raison de contraintes de temps, peu de photos de documents de campagne ont été prises. Cependant, les écoutes téléphoniques ont fourni des informations précieuses pour le CRP. Elles ont permis de découvrir des détails sur le financement électoral du Parti démocrate, ses stratégies et ses priorités financières, permettant ainsi au CRP de contrer ces éléments et de tirer parti de cette situation dans plusieurs États. Grâce à cet avantage électoral, le CRP est confiant dans la victoire de Nixon. L'équipe qui a mené l'opération sera rémunérée à partir des fonds de campagne pour son travail accompli avec succès."
 watergate.3.d:0 "Après avoir obtenu l'approbation et un financement clandestin du Comité pour la Réélection du Président (CRP), Gordon Liddy et John Dean ont travaillé à la mise en place d'une équipe. Liddy a fait appel à Howard Hunt, qui a réuni une équipe d'anciens agents de la CIA et du FBI. L'équipe a pénétré dans le Quartier général national du Parti démocrate situé dans le complexe du Watergate à Washington D.C. Sans être détectée, l'équipe a réussi à installer des dispositifs d'écoute sur les téléphones du président du Parti démocrate et de son principal conseiller. Cependant, l'écoute du président a échoué, et une seconde intrusion a été nécessaire. Cette fois, un agent de sécurité a remarqué du ruban adhésif sur les portes, ce qui a éveillé ses soupçons. Il a appelé la police et les opérateurs n'ont pas été avertis, car leur guetteur n'avait pas remarqué les policiers en civil entrer dans le bâtiment. Par la suite, les cinq opérateurs présents dans le bâtiment ont été arrêtés par la police. La presse locale enquête déjà sur cette étrange intrusion."
 watergate.4.d:0 "Les membres seniors du Comité pour la Réélection du Président (CRP) et le conseiller présidentiel John Dean ont informé le président Nixon de l'échec de l'opération au Watergate. Le président Nixon est particulièrement préoccupé, car la police a retrouvé des informations de contact pour Howard Hunt parmi les opérateurs arrêtés. Hunt étant un consultant en sécurité bien connu à la Maison Blanche, la révélation de son implication pourrait susciter des soupçons. Le président est enclin à suivre l'avis de la majorité des participants à la réunion, qui suggèrent de lancer immédiatement une couverture et de nier toute implication du CRP ou de la Maison Blanche. L'avantage de cette option serait d'éviter que l'incident ne devienne un sujet de campagne. L'autre option consiste à admettre simplement le rôle du CRP dans l'intrusion, en accusant des membres trop enthousiastes du groupe et en les écartant de l'administration. Cette solution préserverait le président, mais pourrait coûter cher pour les élections."
 watergate.5.d:0 "L'une des premières questions auxquelles fait face la tentative de dissimulation est de maintenir l'affirmation publique selon laquelle le Comité pour la Réélection du Président (CRP) n'était pas impliqué dans le cambriolage du Watergate. Le président du CRP, l'ancien procureur général John Mitchell, est particulièrement préoccupé par sa femme, Martha Mitchell. Martha s'est fait un nom en tant que socialite publique et extravertie. Elle est devenue célèbre pour sa tendance à appeler des journalistes lorsqu'elle avait bu. Martha se trouve actuellement en Californie, mais John Mitchell a informé les responsables de l'administration Nixon que lorsqu'elle découvrirait les détails de l'affaire Watergate, elle se rendrait compte de l'implication du CRP, car l'un des hommes arrêtés était un ancien garde du corps de la famille. Son garde du corps, Steve King, est en place et nous devons décider si nous devons essayer de la garder silencieuse pendant au moins une semaine afin de limiter l'effet boule de neige médiatique sur l'affaire Watergate. L'autre option est de la laisser s'exprimer et de minimiser ses déclarations en les qualifiant d'excentriques."
 watergate.6.d:0 "L'administration Nixon a ordonné au garde du corps de Martha Mitchell, l'ex-agent du FBI Steve King, de la garder détenue en Californie, la coupant ainsi des médias et du téléphone. Cependant, elle réussit à découvrir des détails sur l'affaire du Watergate et appela finalement un journaliste ami. Elle déclara qu'elle divorcerait de son mari, à moins qu'il ne quitte l'administration Nixon en raison de leur implication dans le cambriolage. L'appel fut interrompu par King qui déchira la ligne téléphonique. Malgré l'intérêt médiatique pour sa situation, les journalistes ne réussirent pas à la contacter pendant une semaine. Lorsqu'ils parvinrent enfin à la joindre, elle affirma avoir été retenue contre sa volonté et lourdement droguée pour l'empêcher de parler aux médias. Cependant, ses accusations ont fait de son histoire une farce pour beaucoup dans le pays. Parmi les plus fervents partisans de Nixon, les affirmations d'avoir été détenue de force et droguée semblent tirées par les cheveux, malgré les preuves physiques qu'elle a montrées aux journalistes."
 watergate.7.d:0 "Depuis que l'affaire du cambriolage du Watergate a été rendue publique, le Washington Post s'est particulièrement investi dans l'enquête sur les éventuelles connexions avec la Maison-Blanche. Les journalistes Bob Woodward et Carl Bernstein mènent l'enquête, développant des sources au sein de la Maison-Blanche et cherchant à comprendre l'origine de l'argent donné aux cambrioleurs capturés. Les responsables de l'administration ont rapidement compris à quel point le Post se concentrait sur cette enquête et ont proposé deux stratégies pour y faire face. La première consiste à discréditer activement et à cibler le Washington Post en l'accusant de partialité et de propager de fausses allégations. La plupart des autres médias semblent désintéressés par l'affaire du Watergate, se concentrant davantage sur la campagne électorale, et beaucoup d'entre eux soutiendraient nos accusations. L'autre approche serait d'ignorer le journal et de le laisser continuer son enquête. Cela démontrerait notre manque de préoccupations et pourrait pousser le Post à remettre en question la pertinence de ses investigations, les incitant à penser que celles-ci ne sont pas aussi révolutionnaires qu'ils le croient."
 watergate.8.d:0 "Le représentant de longue date Wright Patman, président du comité bancaire, a conclu son enquête sur le Watergate. Patman s'était attaqué à l'enquête en étudiant les billets de cent dollars utilisés pour payer les cambrioleurs et en tentant de retracer leur origine. Cependant, la Maison-Blanche a lancé une campagne de démenti, affirmant que l'enquête était politiquement motivée. Le leader républicain de la minorité à la Chambre, Gerald Ford, a joué un rôle majeur dans l'obstruction de l'enquête, bloquant les tentatives de subpoena des responsables de la Maison-Blanche, ce qui a conduit à une enquête incomplète. D'autres démocrates ont également refusé d'aider Patman, estimant que son enquête nuisait à la campagne électorale et laissait le parti vulnérable aux accusations de motivation politique. Bien que Patman n'ait pas réussi à trouver l'origine de l'argent, le Washington Post et d'autres enquêteurs sénatoriaux poursuivent désormais la piste de l'argent afin de trouver une connexion entre la Maison-Blanche et le Watergate."
 watergate.9.d:0 "Le juge Sirica a récemment prononcé la sentence des cinq cambrioleurs du Watergate condamnés. Certains ont plaidé coupable, tandis que d'autres ont été reconnus coupables. Bien que la Maison-Blanche espérait que la sentence finale marquerait la fin de l'intérêt pour l'affaire, il semble que l'attention des médias n'ait fait qu'augmenter. Au cours du procès, des détails sont apparus sur la piste de l'argent provenant du Comité pour la Réélection du Président, menant jusqu'aux cambrioleurs. Cela a amplifié l'intérêt public pour l'affaire et a poussé les médias à enquêter sur le rôle que le président Nixon aurait pu jouer dans le cambriolage du Watergate. De plus, le procès a révélé la participation de Howard Hunt et Gordon Liddy, deux anciens agents de renseignement ayant des liens connus avec la Maison-Blanche. Il semble que l'enquête et l'intérêt des médias s'intensifient rapidement."
 watergate.10.d:0 "Avec la condamnation des cambrioleurs de Watergate, ce qui n'a fait qu'augmenter les enquêtes médiatiques et gouvernementales sur l'implication de la Maison Blanche, le Président a rencontré ses conseillers principaux pour planifier sa prochaine action. Le Président et certains de ses conseillers sont enclins à initier une purge pour éliminer ceux qui ont fait le premier cover-up. Essentiellement, le plan serait de couvrir le cover-up et de mettre fin aux spéculations sur l'implication de Nixon dans Watergate. L'autre groupe de conseillers soutient qu'en licenciant ces responsables ou en les déplaçant, cela ne ferait qu'attiser les soupçons, augmenter le soutien public aux enquêtes parlementaires et faire paraître la Maison Blanche coupable. Au lieu de cela, ils suggèrent de maintenir tout le monde en place et de laisser la Maison Blanche traverser le reste des spéculations médiatiques."
 watergate.11.d:0 "Le Sénat a récemment voté massivement pour établir un comité Watergate afin d'enquêter sur le scandale de Watergate sous différents angles. Des hauts responsables de la Maison Blanche, dont John Dean, ont témoigné, ce qui exerce une pression croissante sur la Maison Blanche. Sous questionnement, l'assistant de la Maison Blanche, Alexander Butterfield, a révélé que la Maison Blanche disposait d'un système d'enregistrement des conversations. Le procureur spécial pour l'affaire Watergate, Archibald Cox, a rapidement lancé une citation à comparaître pour obtenir les enregistrements. Le Président Nixon a invoqué des préoccupations de sécurité nationale et le privilège exécutif pour refuser. Maintenant, Cox doit décider s'il accepte cet argument de la Maison Blanche, ce qui mettrait essentiellement fin à l'enquête, ou s'il refuse de retirer la citation à comparaître. L'intérêt du Congrès et du peuple américain semble résider dans la libération des enregistrements."
 watergate.12.d:0 "Le refus du procureur spécial Archibald Cox de retirer sa citation à comparaître pour les enregistrements de la Maison Blanche a atteint un point de rupture. Le vendredi, le Président Nixon a proposé un compromis selon lequel le sénateur Stennis écouterait et transcrirait les enregistrements pour le procureur spécial. Cependant, Cox a refusé et le lendemain, Nixon a donné l'ordre au procureur général de le licencier. Le procureur général a refusé, ayant promis au Congrès qu'il n'interférerait pas, et a démissionné. Le procureur général adjoint a ensuite été prié de licencier Cox, et lui aussi a refusé et démissionné. Cela a laissé le soin au procureur général suppléant, qui a exécuté la demande de licencier Archibald Cox. Le Président Nixon a ensuite tenté de démanteler l'enquête, mais les démissions et le licenciement ont alimenté la colère du public, du Congrès et du pouvoir judiciaire à l'encontre de la Maison Blanche. Un nouveau procureur spécial, Leon Jaworski, sera désigné à la place. La Maison Blanche espère qu'il limitera son enquête et ne l'étendra pas comme Cox a tenté de le faire."
 watergate.13.d:0 "La question de la diffusion des enregistrements n'a pas pris fin avec le licenciement d'Archibald Cox en tant que procureur spécial. Son remplaçant, Leon Jaworski, a fini par suivre les traces de son prédécesseur et n'a pas mis fin à l'enquête comme l'espérait le Président Nixon. Au lieu de cela, la question de la divulgation des enregistrements de la Maison Blanche a été portée devant la Cour suprême. Dans une défaite retentissante pour le Président, la Cour a voté contre Nixon et ses revendications de privilège exécutif, ordonnant la divulgation des enregistrements au procureur spécial. La Maison Blanche s'est conformée, et les premiers enregistrements ont révélé que Nixon avait approuvé le camouflage ainsi que les plans de John Dean pour soudoyer les participants du Watergate. Cependant, les enregistrements ne révèlent pas si le Président Nixon était au courant des paiements depuis le début ou même du complot avant qu'il n'ait lieu. Quoi qu'il en soit, la divulgation des enregistrements constitue un coup dur pour Nixon et son équipe."
 watergate.14.d:0 "La Maison Blanche a discrètement publié un enregistrement jusque-là inédit datant de seulement quelques jours après le cambriolage. Dans cet enregistrement, le Président Nixon apprend comment les cambrioleurs sont payés par sa campagne et approuve les plans de dissimulation. Il accepte de dire à la CIA de contacter le FBI pour stopper leur enquête, car le Président ne pouvait pas prévoir la direction de cette enquête. Beaucoup affirment que cette discussion indique une implication directe de Nixon dans le scandale du Watergate et une tentative directe d'interférer dans l'enquête. En défense, la Maison Blanche note que la CIA a correctement conclu que le cambriolage ne constituait pas une menace pour la sécurité nationale et que le Président Nixon a finalement ordonné au FBI de mener une enquête approfondie. Quoi qu'il en soit, la preuve claire de l'implication de Nixon dans la dissimulation dès les premiers jours a démantelé sa position politique et sa légitimité."
 watergate.15.d:0 "La publication de l'enregistrement de la « preuve irréfutable », ainsi que les autres actions du Président Nixon et de son équipe, ont conduit une délégation de leaders du Congrès à rencontrer le Président. Les dirigeants républicains du Congrès ont informé le Président qu'ils s'attendaient à ce que les trois articles de mise en accusation passent facilement à la Chambre et au Sénat. Les leaders républicains ont déclaré que le Président aurait à peine un quart des voix à la Chambre et que sa situation au Sénat était encore pire. Les sondages ont également montré que le public s'était retourné contre le Président. Il ne lui reste plus que deux options. La première est de démissionner et d'éviter l'humiliation d'un vote de mise en accusation et d'un procès au Sénat. L'autre option est de refuser, de rester au pouvoir et d'être évincé de force, espérant peut-être que le peuple américain finira par le soutenir alors qu'il fait face à la colère du Congrès."
 watergate.26.d:0 "Dans une allocution télévisée en direct, le président Nixon annonça son intention de démissionner de ses fonctions. Nixon exprima ses regrets de ne pas pouvoir terminer son mandat. Il précisa que sa démission était dans le meilleur intérêt de la nation. Il espérait que sa décision aiderait l'Amérique à surmonter la controverse du Watergate et à guérir le pays. Le lendemain, Nixon et sa famille firent leurs adieux au personnel de la Maison Blanche. Ils partirent ensuite en hélicoptère vers la base aérienne d'Andrews avant d'être transportés en avion vers leur domicile en Californie. Après des années de controverses et de révélations choquantes, la présidence tumultueuse de Nixon arrivait à son terme."
 watergate.16.d:0 "Le pari du président Nixon de rester en fonction malgré la perte de soutien du Congrès s'est soldé par un échec. Le peuple américain ne s'est pas rallié derrière Nixon et les deux chambres du Congrès l'ont rapidement reconnu coupable sur les trois chefs d'accusation de ses articles de mise en accusation. Le président sera officiellement destitué et sera désormais susceptible d'être poursuivi en justice. Beaucoup estiment que son successeur devrait probablement lui accorder une grâce, bien qu'il n'y ait aucune garantie que cela se produise. Le président a déclaré qu'il respectait les actions du Congrès et qu'il commencerait les préparatifs pour quitter ses fonctions dès que possible."
 watergate.17.d:0 "\nAvec le départ du président Nixon, le vice-président Spiro Agnew a prêté serment en tant que président des États-Unis. Agnew a récemment survécu à son propre scandale de corruption et a réussi à conserver son poste. Ce populaire homme politique du Maryland et vétéran de la Seconde Guerre mondiale espère pouvoir unir le peuple américain et lancer une nouvelle campagne de réconciliation nationale. Nixon avait choisi Agnew comme colistier en raison de son positionnement politique centriste, et il semble désormais que le pays ait besoin de quelqu'un comme lui pour restaurer le prestige de l'exécutif et faire adopter des lois."
 watergate.18.d:0 "\nAvec le départ du président Nixon, le vice-président Gerald Ford a prêté serment en tant que président des États-Unis. Le président Ford, un ancien député modéré, a remplacé Spiro Agnew à la vice-présidence après que ce dernier ait démissionné suite à des allégations de corruption. Nixon avait choisi Ford en raison de sa loyauté envers le parti et de sa réputation irréprochable des deux côtés du Congrès. Le président Ford a indiqué à ses amis qu'il comptait mener une présidence axée sur la réconciliation nationale et restaurer la confiance dans la fonction présidentielle ainsi que dans le Parti républicain. Reste à savoir s'il réussira à accomplir cet objectif."
 watergate.19.d:0 "Avec le départ du président Nixon, le président de la Chambre des représentants, Carl Albert, a prêté serment en tant que président des États-Unis. Bien que le président de la Chambre soit troisième dans l'ordre de succession à la présidence, le poste de vice-président est actuellement vacant. L'ancien vice-président, Spiro Agnew, a récemment démissionné en raison d'allégations de corruption, non liées au scandale du Watergate. Ce poste n'a pas été pourvu en raison de l'obstruction démocrate lors des auditions de confirmation du vice-président. Les retards étaient tels que Nixon n'a pas pu confirmer un vice-président avant sa démission. Dans un mouvement sans précédent, la présidence est, pour la première fois, allée au président de la Chambre. Les républicains sont particulièrement indignés, car le président de la Chambre est un démocrate, et les républicains accusent les démocrates d'avoir ralenti les auditions de confirmation pour « voler » la présidence. Le président Albert estime que le pays a besoin d'un fort défenseur de la loi et de la Constitution, et qu'il est celui-là."
 watergate.25.d:0 "Une récente enquête menée par l'avocat américain du Maryland sur la corruption dans le comté de Baltimore a pris un tournant dramatique récemment. Bien qu'Agnew n'ait occupé un poste dans le comté depuis des années et que les accusations soient désormais hors du cadre de la prescription, l'un des accusés a affirmé avoir versé des pots-de-vin à Agnew après qu'il soit devenu vice-président. Le président Nixon a rencontré Agnew pour discuter des accusations, que ce dernier a fermement niées. Agnew s'est également rendu dans les médias et a publiquement proclamé son innocence totale face aux charges. Il a précisé que l'argent qu'il avait reçu était destiné à des contributions de campagne et rien d'autre. Cependant, les médias et le procureur restent concentrés sur l'enquête concernant Agnew, cherchant à découvrir et prouver les accusations à son encontre."
 watergate.20.d:0 "Avec l'enquête contre le vice-président Spiro Agnew qui s'intensifie, il a décidé de rendre visite au président de la Chambre des représentants, Carl Albert, pour discuter de savoir si son statut de vice-président le protège de toute poursuite judiciaire. L'administration Nixon a discrètement informé Agnew que si les accusations étaient fondées ou trop gênantes, il devrait envisager de démissionner. Le président de la Chambre, Albert, pourrait dire à Agnew que le Congrès pourrait le protéger de poursuites, mais Albert, un constitutionnaliste profondément dévoué, sait que le Congrès a déjà enquêté sur un vice-président au début du XIXe siècle, ce qui constituerait un précédent que le Congrès pourrait utiliser. Il a expliqué que le Congrès n'a pas le droit d'interférer avec les tribunaux. Si Albert, un démocrate, dit à Agnew qu'il pourrait être inculpé, Agnew devra démissionner, sinon il pourra essayer de rester en poste."
 watergate.21.d:0 "Après des discussions avec le président de la Chambre des représentants et une pression croissante de la part des médias, le vice-président Agnew a décidé de démissionner. Même après avoir récemment pris la parole devant un large public en Californie et proclamé son innocence, il a accepté un accord de plaidoyer avec le procureur, selon lequel il n'écoperait pas de peine de prison mais devrait plaider nolo contendere (sans contestation) et payer une amende. En réponse, le président Nixon a écrit une lettre dans laquelle il a salué l'ancien vice-président pour son immense patriotisme et sa loyauté envers les États-Unis. Il a précisé que la démission avait été prise dans le but de protéger le pays et d'éliminer les distractions au sein de l'exécutif. Les membres du Congrès ont été choqués par cette nouvelle, et le président Nixon espère que le processus de confirmation d'un nouveau vice-président se déroulera rapidement."
 watergate.22.d:0 "\nSuite à la démission du vice-président, la Maison Blanche a proposé Gerald Ford au Congrès pour être confirmé en tant que vice-président. Le choix de Ford semble être une décision judicieuse, car il est un modéré bien connu, avec une excellente réputation d'intégrité. Cependant, lors des premières auditions, certains démocrates ont évoqué le rôle que Ford a joué pour bloquer le comité Patman. Jusqu'à présent, Ford n'a pas nié son rôle dans le ralentissement de cette enquête, précisant que cela faisait partie de ses fonctions en tant que chef de la minorité à la Chambre des représentants. Des représentants démocrates se sont approchés du président de la Chambre, Carl Albert, avec une proposition. Ils peuvent prolonger les auditions indéfiniment. Sans vice-président, cela laisserait la Maison Blanche à Albert si Nixon démissionne. Cependant, Albert, un constitutionnaliste strict, est déchiré par cette idée et estime qu'il serait peut-être immoral de ne pas confirmer Ford. Pourtant, il sait qu'il pourrait être contraint de prendre des mesures radicales pour l'intérêt national."
 intervene_in_cuban_elections_desc:0 "Nous pouvons choisir d’intervenir ou non dans les prochaines élections cubaines, pour obtenir le résultat que nous souhaitons et ainsi maintenir l’ordre dans les Amériques."
 usa.6.t:0 "Le problème cubain"
 usa.6.d:0 "L'élection présidentielle à Cuba est imminente. Les sondages semblent toutefois afficher un fort soutien aux candidats de gauche. Si cela devait se produire, Cuba pourrait lentement sombrer dans le communisme. La CIA suggère donc que nous utilisions notre pouvoir pour influencer le résultat des élections en faveur d'un candidat plus approprié."
 usa.1.d:0 "Depuis 1959, Eisenhower écrivait sa déclaration finale au public. Aujourd'hui, il l'a enfin prononcée. \nLe discours a été \"un moment solennel dans une époque résolument peu solennelle\", avertissant une nation \"euphorique de prospérité, éprise de jeunesse et de glamour, et visant de plus en plus à la vie facile\". Malgré son parcours politique avec une formation militaire et étant le seul général à avoir été élu président au 20e siècle, il a averti la nation concernant l'influence corrompue de ce qu'il a qualifié de « complexe militaro-industriel ». Il a également exprimé ses plus vives préoccupations concernant la corruption du processus scientifique en tant que partie de cette centralisation des financements au sein du gouvernement fédéral."
 usa.2.d:0 "Dans l'affaire Hernandez v. Texas, 347 U.S. 475, la Cour suprême, dans un jugement rédigé par le juge Earl Warren, a statué que les Américains d'origine mexicaine et tous les autres groupes nationaux aux États-Unis bénéficiaient de la protection égale en vertu du 14e amendement de la Constitution des États-Unis. Il s'agissait du premier cas où des avocats d'origine mexicaine plaidaient devant la Cour suprême des États-Unis. Cette décision est considérée comme une extension de la protection accordée aux groupes minoritaires au sein du pays et comme une reconnaissance que d'autres groupes que les Afro-Américains pouvaient également faire l'objet de discriminations."
 usa.700.t:0 "Aider la RPC"
 usa.700.d:0 "La RPC a sollicité notre aide. Devrions-nous intervenir pour l'aider ?"
 usa.700.a:0 "Oui bien sûr !"
 usa.700.b:0 "Non, pourquoi devrions-nous le faire ?"
 usa.701.t:0 "L'unification de l'Autriche"
 usa.701.d:0 "Le peuple autrichien souhaite redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Allons-nous l'accepter ?"
 usa.701.a:0 "Oui bien sûr !"
 usa.701.b:0 "Non, nous gardons le territoire."
 usa.702.t:0 "Accepter la RPC à l'ONU"
 usa.702.d:0 "La Cour suprême a rendu une décision historique dans l'affaire Brown v. Board of Education. La Cour a rejeté la doctrine \"séparée mais égale\" et a voté à l'unanimité que la ségrégation raciale des enfants dans les écoles publiques était inconstitutionnelle. La Cour a estimé que, même si la qualité des installations était identique, le fait que les établissements soient séparés était intrinsèquement inégal et en violation du quatorzième amendement. Dans cette affaire, Oliver Brown avait déposé une plainte contre le conseil scolaire de Topeka pour avoir refusé de permettre à sa fille d'assister à l'école pour blancs, de qualité supérieure et géographiquement plus proche, au lieu de l'école noire plus éloignée. L'arrêt de la Cour exige désormais que toutes les écoles commencent immédiatement à s'intégrer et supprime toute protection légale de la ségrégation. La NAACP et les militants des droits civiques se réjouissent de cette décision, tandis que les politiciens du Sud, partisans de la ségrégation, expriment déjà leur indignation face à cette décision."
 CIA_60s.1.d:0 "La nuit dernière, le 30 mai, la Chevrolet Bel Air d'El Jefe a été interceptée par un véhicule rempli d'hommes armés alors qu'elle se dirigeait vers San Cristobal depuis Saint-Domingue. Le véhicule s'est arrêté derrière la voiture de Trujillo sur l'autoroute déserte et l'a suivie avant d'ouvrir le feu avec des carabines M1 fournies par la CIA. Alors que la voiture endommagée de Trujillo était immobilisée sur le bas-côté par son chauffeur, le véhicule contenant les hommes armés s'est interposé devant elle, lui bloquant la route. Un échange de tirs intense, quoique à sens unique, s'est ensuivi entre les hommes armés et un Trujillo armé accompagné de son chauffeur. Finalement blessé, Trujillo a tenté de s'échapper de sa voiture criblée de balles, mais a été abattu en pleine rue. Les hommes armés ont ensuite entassé son corps dans leur véhicule et ont filé dans la nuit, laissant derrière eux l'épave et le sang que la police locale a dû retrouver."
 CIA_60s.2.d:0 "Avec la poursuite de notre agenda non-interventionniste, où la politique étrangère est dictée par l'opposition à la gauche, la CIA a jugé nécessaire de destituer le président de l'Équateur, José Velasco. La CIA en est arrivée à cette conclusion après la résistance obstinée de Velasco et son opposition à la politique des États-Unis visant à rompre les liens avec Cuba communiste et à réprimer les activités de gauche et communistes à l'intérieur du pays. La CIA a infiltré la structure des organisations politiques en Équateur, allant de l'extrême gauche à l'extrême droite, incitant tous les citoyens à se détourner du soutien aux communistes à Cuba et des opinions anti-américaines. Elle a également commencé à surveiller électroniquement les fréquences sensibles en Équateur. Une fois toutes les informations nécessaires acquises, la CIA est passée à l'action pour évincer Velasco du poste de président équatorien. Avec le soutien de l'armée équatorienne, Velasco n'a eu d'autre choix que de céder le pouvoir. Velasco a été remplacé par son vice-président, Carlos Arosemena, une figure plus conciliante envers les politiques américaines."
 Wallace.1.d:0 "Dans le sillage du président très controversé [USA.GetLeader] élu à la plus haute fonction des États-Unis, le nouveau responsable élu a affirmé que l'ordre régnerait dans son pays. Le Président [USA.GetLeader] a promulgué un décret instaurant la loi martiale dans les zones urbaines, évoquant ce qu'il a qualifié d'« épidémie criminelle déplorable causée par la déségrégation et les gauchistes impies ». Dans le même discours, il s'est vanté d'avoir « fixé la limite avec la criminalité », affirmant par ailleurs que « l'intervention des forces armées américaines est le moyen le plus sûr de mettre fin aux activités illicites perpétrées par ces communistes et ces indésirables anti-américains »."
 usa.cubaninter:0 "Nous entamons le processus pour influencer les prochaines élections cubaines."
 intervene_in_cuban_elections:0 "Intervenir dans les élections cubaines"
 usa.702.a:0 "Oui bien sûr !"
 usa.702.b:0 "Non, ils resteront dehors."
 swf.100.t:0 "Le président Nixon assassiné !"
 swf.100.d:0 "Les rapports font état que le président Richard Nixon des États-Unis d'Amérique a été assassiné hier par une bombe placée sous la limousine présidentielle. Alors qu'il défilait à Washington, D.C., la limousine a explosé vers 22h34. Washington a rapidement pointé du doigt de possibles agents du KGB russe, et l'URSS n'a pas tardé à démentir les allégations en déclarant que \"ce n'est pas notre problème si la population américaine n'aime pas l'impérialisme capitaliste\". Le vice-président Henry Cabot Lodge III a immédiatement prêté serment et est devenu le nouveau président."
 swf.101.t:0 "Le 35e président des États-Unis assassiné !"
 swf.101.d:0 "John F. Kennedy, le 35e président des États-Unis, a été assassiné hier à 12h30 à Dallas, au Texas, alors qu'il circulait dans un cortège présidentiel à Dealey Plaza. Kennedy était accompagné de son épouse Jacqueline, du gouverneur du Texas John Connally et de l'épouse de Connally, Nellie, lorsqu'il a été mortellement abattu par l'ancien Marine américain Lee Harvey Oswald. Une enquête de dix mois menée par la Commission Warren, de novembre 1963 à septembre 1964, a conclu qu'Oswald avait agi seul pour tuer Kennedy, et que Jack Ruby avait également agi seul lorsqu'il a tué Oswald avant qu'il ne puisse être jugé. La mort de Kennedy a marqué le quatrième (après ceux de Lincoln, Garfield et McKinley) et le plus récent assassinat d'un président américain. Le vice-président Lyndon B. Johnson est devenu président automatiquement après la mort de Kennedy."
 civil_rights.2.t:0 "[GetNewspaperHeader]La loi sur les droits civiques fait l'objet d'obstruction et des troubles au Congrès"
 civil_rights.2.d:0 "Bien que des majorités des deux partis aient voté en faveur du projet de loi, il y a eu des exceptions notables. Bien qu'il s'oppose à la ségrégation forcée, le sénateur républicain Barry Goldwater de l'Arizona a voté contre le projet de loi, déclarant : \"On ne peut pas légiférer la moralité.\" Goldwater avait soutenu des tentatives précédentes d'adopter une législation sur les droits civiques en 1957 et 1960 ainsi que le 24e amendement interdisant la taxe de vote. Il a expliqué que la raison de son opposition au projet de loi de 1964 était le titre II, qui, selon lui, violait la liberté individuelle et les droits des États. Des démocrates et républicains des États du Sud se sont opposés au projet de loi et ont mené un filibuster infructueux de 83 jours, comprenant les sénateurs Albert Gore, Sr. (D-TN) et J. William Fulbright (D-AR), ainsi que le sénateur Robert Byrd (D-WV), qui a personnellement filibusté pendant 14 heures d'affilée."
 civil_rights.3.t:0 "[GetNewspaperHeader]La loi sur les droits civiques est adoptée ! Le Congrès est en pleine crise !"
 civil_rights.3.d:0 "Plusieurs sénateurs des États du Sud se sont enflammés et ont fermement protesté contre l'adoption et la signature du projet de loi sur les droits civiques, plongeant l'ensemble du Congrès dans le chaos. Des sénateurs ont commencé à appeler à une sécession des États-Unis, déclarant que \"ce n'est pas notre vision en tant que nation\". Tentant de réduire les tensions au Sénat, le Président a ordonné la fermeture de plusieurs institutions et organisations gouvernementales. Plusieurs États du Sud réclament un référendum. La loi martiale a été déclarée dans les États du Sud concernés par ordre du Président."
 civil_rights.4.t:0 "[GetNewspaperHeader]Les tensions croissantes s'avèrent trop fortes pour le Congrès"
 civil_rights.4.d:0 "La combinaison de l'adoption du projet de loi intransigeant, de la fermeture forcée du gouvernement par ordre du Président, des rivalités croissantes, des insultes et des malentendus, ainsi que de la loi martiale imposée par le Président, a conduit plusieurs États du Sud à annoncer officiellement leur intention de faire sécession des États-Unis d'Amérique. Ils ont déclaré que \"ce n'est pas notre vision américaine, et ce n'est pas notre président légitime. Un président ne doit pas agir comme un dictateur, et c'est exactement ce que nous avons.\" Le Président a tenté de lancer des appels à des solutions pacifiques et des négociations, mais les États sécessionnistes ont refusé de répondre, voire de l'écouter. Plusieurs sénateurs ont été vus en train de quitter le Congrès. Le niveau d'alerte des forces armées a été élevé, et l'ensemble de la Garde nationale et de l'armée a été mobilisé."
 civil_rights.5.t:0 "[GetNewspaperHeader]La loi sur les droits civiques a été signée !"
 civil_rights.5.d:0 "Le 2 juillet 1964, le 88e Congrès des États-Unis a adopté la loi sur les droits civils, qui est entrée en vigueur immédiatement. Elle interdit la discrimination fondée sur la race, la couleur, la religion, le sexe ou l'origine nationale. Elle prohibe l'application inégale des exigences d'enregistrement des électeurs, la ségrégation raciale dans les écoles, l'emploi et les lieux publics. Cependant, ce projet de loi divise et met en danger un changement à long terme dans le soutien démographique des deux partis. Le Président a réalisé que soutenir ce projet de loi risquerait de faire perdre au Parti Démocrate le soutien écrasant du Sud. Tant le procureur général Robert Kennedy que le vice-président Johnson avaient plaidé en faveur de l'introduction de la législation sur les droits civils. Johnson a dit à l'aide de Kennedy, Ted Sorensen, \"Je sais que les risques sont grands et que nous pourrions perdre le Sud, mais ces États pourraient de toute façon être perdus.\""
 civil_rights.6.t:0 "[GetNewspaperHeader]La Grande Marche sur Washington"
 civil_rights.6.d:0 "Le mercredi 28 août 1963, entre 200 000 et 300 000 personnes ont défilé à Washington, avec une estimation indiquant que 75 à 80 % des manifestants étaient noirs. La marche a été l'un des plus grands rassemblements politiques pour les droits humains dans l'histoire des États-Unis, et son objectif était de plaider en faveur des droits civils et économiques des Afro-Américains. Lors de la marche, Martin Luther King Jr., debout devant le Lincoln Memorial, a prononcé son discours historique \"I Have a Dream\", dans lequel il a appelé à la fin du racisme. Après la marche, les orateurs se sont rendus à la Maison Blanche pour une brève discussion avec le président Kennedy concernant la législation sur les droits civils proposée. Kennedy avait regardé le discours de King à la télévision et en avait été très impressionné. La marche est considérée comme un \"triomphe du protestation bien gérée\" et Kennedy a estimé qu'il s'agissait également d'une victoire pour lui, renforçant ainsi les chances de son projet de loi sur les droits civils."
 civil_rights.7.t:0 "[GetNewspaperHeader]Les marches de Selma à Montgomery"
 civil_rights.7.d:0 "Le long de la route de 54 miles entre Selma, Alabama, et la capitale de l'État, Montgomery, trois marches de protestation ont eu lieu du 7 au 25 mars 1965. La première marche a eu lieu le 7 mars 1965, organisée localement par Bevel, Amelia Boynton et d'autres. Les policiers d'État et les membres de la milice du comté ont attaqué les manifestants non armés avec des matraques et des gaz lacrymogènes après qu'ils aient franchi la ligne du comté, et l'événement est devenu connu sous le nom de \"Bloody Sunday\" (Dimanche sanglant). La deuxième marche a eu lieu le 9 mars. Les policiers, les forces de l'ordre et les manifestants se sont affrontés à l'extrémité du pont du comté, mais lorsque les policiers se sont écartés pour les laisser passer, King a conduit les manifestants de retour à l'église, obéissant à une injonction fédérale tout en recherchant une protection judiciaire fédérale pour la marche. La troisième marche a commencé le 21 mars. Protégés par 1 900 membres de la Garde nationale de l'Alabama sous commandement fédéral, ainsi que de nombreux agents du FBI et marshals fédéraux, les manifestants ont parcouru en moyenne 10 miles (16 km) par jour le long de la route américaine 80, atteignant Montgomery le 24 mars et le Capitole de l'Alabama le 25 mars."
 tonkin.1.t:0 "[GetNewspaperHeader]L'USS Maddox attaqué !"
 tonkin.1.d:0 "Le 2 août 1964, dans le golfe du Tonkin, le destroyer USS Maddox, alors qu'il effectuait une mission de renseignement sur signaux dans le cadre des opérations DESOTO, a été poursuivi par trois vedettes-torpilleurs de la marine nord-vietnamienne du 135e escadron de torpilleurs. Le Maddox a tiré trois tirs de sommation, puis les vedettes nord-vietnamiennes ont attaqué avec des torpilles et des tirs de mitrailleuses. Le Maddox a tiré plus de 280 obus de 3 et 5 pouces lors d'un combat naval. Un avion américain a été endommagé, trois vedettes-torpilleurs nord-vietnamiennes ont été endommagées, et quatre marins nord-vietnamiens ont été tués, six autres blessés. Aucun casualty américain n'a été rapporté. Le 4 août, une autre patrouille DESOTO au large de la côte nord-vietnamienne a été lancée par le Maddox et le Turner Joy, afin de \"montrer le drapeau\" après le premier incident. Lors d'une soirée et d'une matinée marquées par un temps tumultueux et une mer agitée, les destroyers ont reçu des signaux radar, sonar et radio qu'ils ont interprétés comme l'indication d'une nouvelle attaque de la marine nord-vietnamienne. Malgré la déclaration de la Marine américaine selon laquelle deux vedettes-torpilleurs attaquantes auraient été coulées, aucune épave, aucun corps de marins nord-vietnamiens, ni aucune autre preuve physique n'a été retrouvée sur le lieu de l'engagement présumé."
 taft.1.t:0 "Isolationnisme ou internationalisme ?"
 taft.1.d:0 "Dans le cadre de l'une de mes promesses de campagne, j'ai promis de retirer les États-Unis de l'OTAN et de réduire notre intervention dans le monde. Nous devons intervenir moins dans le monde et revenir à notre état isolationniste, comme avant la Seconde Guerre mondiale. Cependant, cela pourrait rendre l'Europe vulnérable aux hordes de communisme et permettrait à l'URSS d'avoir un monde ouvert pour diffuser ses idéaux communistes. Si nous restons isolationnistes, nous espérons ne pas être entraînés dans une Troisième Guerre mondiale. Quelle devrait être la politique étrangère des États-Unis ?"
 taft.1.a:0 "L'isolationnisme est nécessaire pour la paix."
 taft.1.b:0 "Le communisme est devenu une menace trop grande. L'internationalisme est nécessaire."
 taft.2.t:0 "[GetNewspaperHeader]Les États-Unis annoncent la fin de leur adhésion à l’OTAN."
 taft.2.d:0 "Les États-Unis ont annoncé aujourd'hui leur retrait du commandement de l'OTAN et de leur adhésion à l'alliance. Le président Taft a déclaré qu'il ne souhaitait plus intervenir dans les affaires étrangères et qu'il voulait faire ce qui est le mieux pour le peuple américain. Taft a également affirmé qu'il souhaitait inaugurer une nouvelle ère de prospérité pour l'Amérique qui viendrait avec l'isolationnisme. D'autres membres de l'OTAN sont choqués et se réunissent en conseil d'urgence pour discuter de l'avenir de l'OTAN et du monde libre. L'URSS a déclaré qu'elle souhaitait le meilleur pour les États-Unis et a également affirmé que leurs politiques isolationnistes aideraient le monde."
 taft.2.a:0 "Qu’adviendra-t-il du monde libre ?"
 usa.500.d:0 "La campagne de terreur de Mark Essex contre la police de La Nouvelle-Orléans a culminé le 7 janvier par un déchaînement de violence de 11 heures à l'hôtel Howard Johnson sur l'avenue Loyola, où il a tué sept personnes, dont trois policiers, et en a blessé huit autres. Une semaine plus tôt, il avait tué deux autres policiers et en avait blessé un. Il a échappé à la police pendant une semaine avant de blesser un épicier de Gert Town, puis de se diriger vers l'hôtel Howard Johnson. La fusillade d'Essex a pris fin sur le toit de l'hôtel, où il est mort avec 200 blessures par balles."
 usa.501.d:0 "Meurtre de masse de civils vietnamiens non armés par les troupes américaines au Sud-Vietnam ! Plus tôt ce matin, une centaine de soldats américains sont arrivés en mission de recherche et de destruction pour traquer les guérilleros du Viêt-Cong. Ils ont trouvé un village paisible, peuplé principalement de femmes, d'enfants et de personnes âgées. S'en est suivi un terrible massacre. Les soldats américains ont systématiquement rassemblé et massacré les villageois terrifiés et non armés, violant les femmes et incendiant les maisons sur leur passage. Avant la fin de la journée, 504 villageois vietnamiens ont été tués dans ce que l'on a appelé le massacre de My Lai, du nom d'un des hameaux de Son My."
 castle_bravo.1A:0 "Le test Castle Bravo est le premier essai de conception d'arme thermonucléaire à haut rendement mené par les États-Unis au Bikini Atoll, dans les îles Marshall, dans le cadre de l'Opération Castle. L'appareil était le dispositif nucléaire le plus puissant jamais fait exploser par les États-Unis et la première arme thermonucléaire alimentée au deutérium-lithium. Le rendement de Castle Bravo était de 15 mégatonnes de TNT, soit 2,5 fois plus que les 6,0 mégatonnes prévues, en raison de réactions supplémentaires imprévues impliquant du lithium-7, ce qui a conduit à une contamination radioactive inattendue des zones à l'est du Bikini Atoll."
 mccarthy.1.t:0 "Ennemis intérieurs"
 mccarthy.1.a:0 "Inquiétant"
 USA_70s_The_CIA:0 "Opérations de la CIA"
 cia.20.d:0 "Des nouvelles inquiétantes sont parvenues des États-Unis. Une série de projets secrets, parfois illégaux, menés par le Federal Bureau of Investigation (FBI) visant à surveiller, infiltrer, discréditer et perturber des organisations politiques nationales a été découverte par un informateur inconnu. Les archives de le FBI montrent que les ressources du programme COINTELPRO ont ciblé des groupes et des individus jugés subversifs par le FBI, y compris le Parti communiste des États-Unis, les organisateurs anti-guerre du Vietnam, les militants du mouvement des droits civiques ou du mouvement Black Power, les organisations féministes, les mouvements d'indépendance (tels que les groupes indépendantistes portoricains comme les Young Lords), et une variété d'organisations faisant partie de la Nouvelle Gauche. Le programme a également ciblé des groupes suprémacistes blancs, y compris le Ku Klux Klan, ainsi que des groupes nationalistes, notamment les républicains irlandais et les exilés cubains."
 USAkorea.4.d:0 "Le président Harry S. Truman a relevé le général Douglas MacArthur de ses nombreuses fonctions militaires, principalement celle de commandant suprême des puissances alliées et de commandant en chef des forces américaines en Extrême-Orient. Truman a exigé que MacArthur remette ses fonctions au lieutenant-général Matthew Ridgway, invoquant son incapacité à soutenir pleinement les politiques du gouvernement des États-Unis et des Nations Unies en ce qui concerne ses devoirs officiels."
 cultural_events.1.d:0 "Ce soir, le 5 avril 1980, marque le dernier épisode du célèbre drame policier se déroulant à Honolulu, Hawaï. Hawaii Five-O, un drame policier renommé, détient désormais le titre de série policière la plus longue avec la diffusion de l'épisode 279 - 'Woe to Wo Fat', mettant fin aux aventures du capitaine détective Steve McGarrett, Danny Williams, Chin Ho Kelly, Kono Kalakaua et Duke Lukela."
 cultural_events.2.d:0 "Aujourd'hui, New York City peine à se remettre du Blackout de deux jours qui a frappé la ville du 13 au 14 juillet. Tout a commencé par une combinaison de foudre et une surcharge d'une centrale nucléaire qui a provoqué la panne du plus grand générateur de la ville, plongeant ainsi toute la ville dans l'obscurité. Avec l'électricité n'ayant été rétablie que tard le lendemain, de jeunes individus ont profité de la situation pour piller des magasins en utilisant des voitures, affectant lourdement les quartiers de Crown Heights et Bushwick, où de nombreux cas d'incendies criminels ont été rapportés."
 cultural_events.3.d:0 "Aujourd'hui, un rassemblement du Ku Klux Klan, basé en Caroline du Sud, a été attaqué par 500 membres de la communauté Lumbee après que James Cole, le chef du KKK dans la région, eut lancé une campagne d'intimidation contre les membres de la communauté Lumbee après avoir obtenu une reconnaissance fédérale limitée. Après que le KKK se soit installé dans le champ d'un fermier sympathisant, les membres de la communauté Lumbee l'ont encerclé et ont commencé à hurler et à l'attaquer tout en tirant sur les membres du Klan. Ces derniers ont tenté de riposter, mais en vain. Quatre membres du Klan ont été blessés et les autres ont pris la fuite, abandonnant leurs familles, leur système de sonorisation et une croix éteinte. Les adjoints du comté de Roberson et les shérifs ont interrompu la célébration près de la communauté Lumbee à coups de grenades lacrymogènes."
 book_releases.1.d:0 "Le 8 juin 1949, George Orwell publia son roman dystopique Nineteen Eighty-Four. Situé dans l'année lointaine de 1984, le récit se concentre sur trois États mégalithiques et leur guerre constante et changeante les uns contre les autres et contre leurs propres peuples. Au début des années 1950, le Royaume-Uni est impliqué dans une troisième guerre mondiale, cette fois avec l'utilisation d'armes nucléaires, comme celles utilisées sur le Japon en 1945. La Grande-Bretagne tombe en guerre civile, et le Parti socialiste autoritaire anglais, ou Ingsoc, en sort victorieux. Dans cet État autoritaire, les pensées sont surveillées, l'histoire est révisée, et un culte de la personnalité autour du moustachu Big Brother règne en maître."
 kef.2.d:0 "L'Âge d'Or des bandes dessinées aux États-Unis a duré de 1938 à 1945, et à la fin de cette période, on a assisté à un déclin prononcé des bandes dessinées de super-héros. De nouveaux genres, tels que les bandes dessinées de crime et d'horreur, ont suscité l'indignation, avec des accusations selon lesquelles ces bandes dessinées inspireraient des comportements illégaux chez les mineurs, un phénomène connu sous le nom de délinquance juvénile. Le Sous-comité du Sénat sur la délinquance juvénile a été chargé par le Sénat d'enquêter sur ces allégations. Les célèbres audiences sur les bandes dessinées ont eu lieu les 21 et 22 avril ainsi que le 4 juin 1954, et ont eu un impact profond sur l'avenir des bandes dessinées, remettant en question l'usage d'images graphiques dans les comics. La publication du livre *Seduction of the Innocent* a galvanisé l'opinion publique contre les bandes dessinées et a donné à l'industrie une couverture médiatique défavorable, la forçant effectivement à adopter le Comics Code Authority, instaurant ainsi une forme d'auto-censure qui a entraîné la censure sévère voire l'annulation de nombreuses séries de comics bien établies. Les conséquences de cela ne sont pas encore entièrement ressenties, mais il est déjà évident que cela constitue un coup dévastateur pour l'industrie américaine de la bande dessinée, déjà en difficulté."
 little_rock.1.d:0 "L'Âge d'Or des bandes dessinées aux États-Unis a duré de 1938 à 1945, et à la fin de cette période, on a assisté à un déclin prononcé des bandes dessinées de super-héros. De nouveaux genres, tels que les bandes dessinées de crime et d'horreur, ont suscité l'indignation, avec des accusations selon lesquelles ces bandes dessinées inspireraient des comportements illégaux chez les mineurs, un phénomène connu sous le nom de délinquance juvénile. Le Sous-comité du Sénat sur la délinquance juvénile a été chargé par le Sénat d'enquêter sur ces allégations. Les célèbres audiences sur les bandes dessinées ont eu lieu les 21 et 22 avril ainsi que le 4 juin 1954, et ont eu un impact profond sur l'avenir des bandes dessinées, remettant en question l'usage d'images graphiques dans les comics. La publication du livre *Seduction of the Innocent* a galvanisé l'opinion publique contre les bandes dessinées et a donné à l'industrie une couverture médiatique défavorable, la forçant effectivement à adopter le Comics Code Authority, instaurant ainsi une forme d'auto-censure qui a entraîné la censure sévère voire l'annulation de nombreuses séries de comics bien établies. Les conséquences de cela ne sont pas encore entièrement ressenties, mais il est déjà évident que cela constitue un coup dévastateur pour l'industrie américaine de la bande dessinée, déjà en difficulté."
 kef.10.d:0 "Aujourd'hui, un grand nombre d'arrestations et d'enquêtes ont eu lieu, alors que le gouvernement fédéral a déclaré une répression nationale contre les délinquants juvéniles, citant l'augmentation rapide des crimes liés aux jeunes au cours de la dernière décennie. Selon le Département de la Justice, le nombre de crimes commis par des jeunes a considérablement augmenté au fil des ans. En conséquence, l'ordre public ne peut plus être maintenu, et les délinquants juvéniles ont été traités de manière trop indulgente par le système judiciaire. Les organisations de défense des droits civils condamnent cet acte, le considérant comme une atteinte aux droits des jeunes, et soulignant qu'il est très susceptible d'être abusé."
 kef.7.d:0 "L'American Medical Association (AMA) est sous le feu des critiques aujourd'hui, après que des rapports récents aient révélé que ses donateurs, principalement de grandes entreprises pharmaceutiques et de matériel médical, ont influencé ses politiques et ses agendas de lobbying, la rendant complice dans un scandale de corruption et de conflits d'intérêts. Le scandale, impliquant les plus hauts responsables de l'organisation, fait état de sommes considérables de dons reçus, dont la moitié est destinée à l'organisation et l'autre à leurs propres intérêts personnels, en échange de faveurs et d'influence sur les politiques de l'AMA. L'American Medical Association n'a pas encore répondu, mais les observateurs estiment que cette affaire aura des conséquences considérables à l'avenir."
 kef.3.d:0 "Le président des États-Unis, Estes Kefauver, a récemment été salué par diverses organisations de défense des droits civiques, alors qu'il lance une vaste campagne en faveur des droits civiques, appelant à l'autonomisation des minorités et à leur intégration dans la société américaine. Dans un discours important, Kefauver a affirmé qu'il était de l'obligation du peuple américain de traiter tout le monde de manière égale, indépendamment de la race, de la religion, de la sexualité et d'autres aspects, et de juger les individus uniquement en fonction de leur caractère plutôt que de la couleur de leur peau. Cependant, cette initiative a suscité des réactions négatives de la part de divers groupes suprémacistes blancs à travers le pays, qui ont condamné ses actions et exigé une rétractation immédiate."
 sab_army_mc.1.d:0 "Les auditions McCarthy ont été suspendues jusqu'à nouvel ordre aujourd'hui, après que de nouvelles preuves aient montré l'incompétence de divers responsables militaires lors de ces auditions, ce qui leur retire pratiquement le droit de juger Joseph McCarthy, l'un des sénateurs les plus influents de Washington, qui est devenu une figure controversée après avoir révélé des documents concernant des responsables communistes présumés au sein du gouvernement américain. Ce développement constitue une grande victoire pour le sénateur, qui peut enfin poursuivre sa soi-disant « croisade contre le communisme », une expression popularisée par ses nombreux partisans. Les observateurs affirment que si McCarthy poursuit cette croisade, nous assisterons à une Amérique non seulement plus anti-communiste, mais également plus antidémocratique."
 cultural_events.9.d:0 "La communauté internationale a assisté aujourd'hui au décès de l'un de ses grands protecteurs méconnus : le cryptographe anglais Alan Turing a été retrouvé mort dans ce qui semble être un suicide. Le docteur Turing, 41 ans, est considéré comme le père de l'informatique moderne et a joué un rôle non négligeable dans le décryptage d'« Enigma », les codes nazis allemands, un rôle clé qui a contribué à l'effort de guerre allié lors de la bataille de l'Atlantique, entre autres. Il est soupçonné d'avoir potentiellement sauvé plus de 14 millions de vies et même raccourci la durée de la Seconde Guerre mondiale de deux ans. Le gouvernement britannique a rapidement pris ses distances avec la mort de Turing. Cependant, les lois sur l'homosexualité dans les îles britanniques étant ce qu'elles sont, Turing avait été contraint de comparaître pour le crime d'homosexualité et le cryptographe avait été condamné à la castration chimique moins de dix ans avant son décès prématuré. \nQuelle que soit la controverse qui a hanté Turing de son vivant, dans sa mort, il restera dans les mémoires comme le fer de lance de la machine de guerre de l'Axe et une figure essentielle dans le sauvetage de la Grande-Bretagne, de l'Europe et, en fait, du monde du fascisme et de la tyrannie."
 kef.8.d:0 "Dans un discours enflammé devant le Congrès, le président américain Estes Kefauver a publiquement dénoncé le Manifeste du Sud. Signé en mars 1956 en réponse à l'arrêt Brown vs Board, il constitue la principale base de l'opposition sudiste aux efforts fédéraux de plus en plus persistants en faveur de la déségrégation. Son discours a suscité des réactions allant des éloges aux accusations de trahison, même de la part de membres de son propre parti démocrate. Avec le président s'engageant pleinement en faveur de la déségrégation, les tensions avec ceux qui militent pour le maintien du statu quo ont considérablement augmenté. Kefauver lui-même fait désormais face à une opposition généralisée de la part des influences dixiecrates au sein de son parti, bien que cette opposition soit partiellement compensée par un soutien croissant de la part de ceux qui sympathisent avec le mouvement pour les droits civiques. Une chose est cependant certaine : le processus de déségrégation de la société américaine a été considérablement accéléré par ces développements, et le Sud pourrait bien devoir accepter les vents du changement qui soufflent dans leur direction."
 phi_events.2.d:0 "La violence et les troubles civils font rage à Manille et dans l'ensemble de l'archipel des Philippines, alors que divers militants étudiants, groupes civiques et factions d'opposition, dont la plupart ont des liens directs avec le Parti Communiste des Philippines, ont organisé des manifestations et des protestations condamnant le régime du président Ferdinand Marcos et ses supposés maîtres américains. Des rapports ont circulé selon lesquels ces manifestations ont rapidement dégénéré en violences à grande échelle, les manifestants ayant déjà attaqué divers quartiers gouvernementaux, tels que Mendiola, situé à proximité du palais présidentiel de Malacañang et de l'ambassade américaine, qui, selon les militants, est le siège de pouvoir de facto aux Philippines. En réponse à ces actes de violence, le président Ferdinand Marcos a mobilisé la Constabulary philippine et a violemment dispersé les manifestations, si nécessaire. Avec l'augmentation rapide des troubles civils, ainsi que la menace communiste qui touche désormais le milieu universitaire, les observateurs prévoient que le gouvernement de Marcos instaurera des mesures radicales pour réprimer la rébellion et la menace communiste."
 phi_events.3.d:0 "Le 23 septembre 1972, le président Ferdinand Marcos a signé la Proclamation n° 1081, une proclamation présidentielle déclarant la loi martiale sur l'ensemble de l'archipel philippin. Selon le président Marcos, la loi martiale a été déclarée en raison de la dégradation de l'ordre et de la loi, ainsi que de la menace croissante du communisme qui a pris un essor rapide, affirmant qu'ils sont sur le point de mener une insurrection révolutionnaire contre son gouvernement. Cependant, les groupes d'opposition affirment que la grande majorité des attaques terroristes subies par les Philippines ont été orchestrées par le cercle intime des généraux militaires du président afin de semer la peur et la terreur parmi la population, légitimant ainsi sa déclaration. Néanmoins, la mise en œuvre de la loi martiale a été rapide, les forces armées des Philippines (AFP) ayant pu sécuriser les zones stratégiques essentielles au régime de Marcos, et la mise en place des \"ordres généraux\" stipulés dans la proclamation. Les réactions à cette déclaration sont partagées, certains sympathisant avec le gouvernement, tandis que d'autres la critiquent, croyant en la version de l'opposition."
 kef.9.d:0 "Dans un mouvement décisif, le président Kefauver a radicalement modifié le processus de nomination des candidats démocrates afin d'accroître l'efficacité de la manière dont les candidats à la présidence démocrate sont sélectionnés. Traditionnellement, les candidats étaient choisis principalement en secret par les dirigeants du parti, ce qui aboutissait parfois à la sélection de candidats n'ayant jamais été délégués lors d'une élection primaire. Le président a proposé des lignes directrices sur la manière dont les candidats devraient être sélectionnés, modernisant rapidement le processus de nomination pour tenir compte de la volonté du peuple, et forçant effectivement les États à sélectionner leurs délégués via des primaires présidentielles. Le résultat de cette réforme est que les électeurs démocrates ont désormais un rôle beaucoup plus important dans le résultat qu'auparavant, et ce changement a retiré une part importante du pouvoir des mains des politiciens influents pour le mettre entre celles du peuple. Il est maintenant évident que les futurs candidats démocrates représenteront la volonté du peuple. Reste à voir si cela aura un impact sur les élections à venir."
 adlai_civil.1.d:0 "La Cour Suprême des États-Unis a rendu sa décision historique dans l'affaire Brown contre Board. Par un vote unanime de ses neuf membres, la Cour a estimé que l'éducation séparée des races était inconstitutionnelle, annulant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait validé les lois de ségrégation. L'affaire a commencé par une action collective déposée contre le Conseil de l'Éducation par la ville de Topeka au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour Suprême. Leur décision a provoqué un grand bouleversement dans le sud des États-Unis, perçue comme une menace pour leur ordre traditionnel. Dans un mouvement choquant, le président Adlai Stevenson a refusé de faire appliquer la décision et a déclaré qu'il permettrait à toute école souhaitant maintenir la ségrégation éducative de le faire. Cette décision a suscité une grande indignation au sein des éléments libéraux du Parti démocrate, et des appels dispersés à l'impeachment du président ont été lancés. Cependant, il semble peu probable que ces appels aboutissent, et la position du Sud, ainsi que celle du mouvement ségrégationniste, a été considérablement renforcée."
 truman_civil.1.d:0 "La Cour Suprême des États-Unis, sous la direction du juge en chef Earl Warren, a rendu sa décision historique dans l'affaire Brown contre Board. Par un vote unanime de ses neuf membres, la Cour a estimé que l'éducation séparée des races était inconstitutionnelle, annulant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait validé les lois de ségrégation. L'affaire a commencé par une action collective déposée contre le Conseil de l'Éducation par la ville de Topeka, au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour Suprême. Leur décision a provoqué un grand bouleversement dans les États du sud, perçue comme une menace pour leur ordre traditionnel. Le président Truman a toujours été favorable aux droits civiques, ayant adopté la toute première législation sur la déségrégation de l'armée en 1948. Il n'est donc pas surprenant que Truman ait annoncé devant le Congrès son intention d'appliquer immédiatement la décision dans tout le pays. Bien que cette décision ait provoqué une grande agitation dans le Sud, la résistance réelle a été limitée. Malgré les appels éparpillés à son impeachment de la part des Dixiecrats au sein du Parti démocrate, aucune base solide d'opposition ne s'est formée."
 truman_civil.2.d:0 "La Cour Suprême des États-Unis, sous la direction du juge en chef Earl Warren, a rendu sa décision historique dans l'affaire Brown contre Board. Par un vote unanime de ses neuf membres, la Cour a jugé que l'éducation séparée des races était inconstitutionnelle, annulant ainsi l'affaire Plessy contre Ferguson de 1897 qui avait validé les lois de ségrégation. L'affaire a commencé par une action collective déposée contre le Conseil de l'Éducation par la ville de Topeka, au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour Suprême. Leur décision a provoqué un grand bouleversement dans les États du sud, perçue comme une menace pour leur ordre traditionnel. Le président Harriman a toujours été favorable aux droits civiques, ayant adopté la toute première législation sur la déségrégation de l'armée en 1948. Il n'est donc pas surprenant que Harriman ait annoncé devant le Congrès son intention d'appliquer immédiatement la décision dans tout le pays. Bien que cette décision ait provoqué une grande agitation dans le Sud, la résistance réelle a été limitée. Malgré les appels éparpillés à son impeachment de la part des Dixiecrats au sein du Parti démocrate, aucune base solide d'opposition ne s'est formée."
 kef.6.d:0 "Aux États-Unis, la Food and Drug Administration (FDA) a été fondée en 1906 pour promouvoir la santé publique en régulant la sécurité alimentaire et divers instruments médicaux. Avec des lois relatives à la santé publique constamment mises à jour, les appels à renforcer les pouvoirs de la FDA se sont intensifiés depuis la fin de la Seconde Guerre mondiale, et après l'élection de Kefauver à la présidence, il a semblé quelque peu disposé à mettre en œuvre des réformes pour élargir l'autorité de la FDA. Récemment, le président a proposé une législation pour élargir radicalement les pouvoirs de la FDA dans les affaires de santé publique, et aujourd'hui, les changements ont été officiellement ratifiés par le Congrès. Avec l'entrée en vigueur de la loi dans les prochains jours, ces modifications seront probablement un facteur majeur dans la lutte continue pour l'amélioration de la santé publique, bien que ces changements aient suscité des critiques de la part de ceux qui s'opposent à ce qu'ils perçoivent comme une trop grande intervention du gouvernement dans la vie des citoyens américains."
 kef.4.d:0 "La Cour suprême des États-Unis, sous la direction du juge en chef Earl Warren, a rendu la décision historique dans l'affaire Brown contre le Board of Education. Par un vote unanime des neuf membres de la cour, il a été décidé que l'éducation séparée des races était inconstitutionnelle, annulant ainsi l'arrêt Plessy v. Ferguson de 1897, qui validait les lois sur la ségrégation. L'affaire a débuté par une action collective intentée contre le Board of Education de la ville de Topeka, au Kansas, représentée par Oliver Brown, et a rapidement été examinée par la Cour suprême. Leur décision a provoqué un grand bouleversement dans le sud des États-Unis, perçue comme une menace pour l'ordre traditionnel. Le président Kefauver, toujours connu comme un défenseur des droits civiques, a annoncé, seulement un jour après que l'arrêt ait été rendu, devant le Congrès, ses intentions de « soutenir la décision dans la mesure du possible ». Bien que son discours ait été bref, cela marque une avancée majeure pour le mouvement des droits civiques aux États-Unis et semble être un tournant décisif pour la ségrégation en Amérique."
 kef.1.d:0 "Dans un discours enflammé devant le Congrès, le président américain Estes Kefauver a officiellement déclaré la guerre à la mafia italo-américaine, jurant de l'exterminer et de « restaurer l'ordre » dans les villes américaines. Avant son accession à la présidence, Kefauver avait présidé les auditions de 1950 qui ont attiré l'attention nationale sur le problème croissant du crime organisé, et après son élection, beaucoup s'attendaient à ce qu'il prenne des mesures juridiques concernant cette question. Jusqu'à présent, la mafia a fait face à relativement peu d'opposition de la part des forces de l'ordre dans la construction de son empire criminel, mais il semble que cela soit sur le point de changer. Les réactions au discours du président ont été variées. Plusieurs membres du Congrès ont même suggéré qu'il pourrait être trop difficile d'éradiquer complètement la mafia bien établie et que cela ne ferait qu'entraîner davantage de conflits, de colère et de dégâts au sein des communautés urbaines. Quelle que soit l'issue, cette démarche ambitieuse aura des conséquences à long terme sur la vie de nombreux citoyens, mais il reste incertain de savoir si ces tentatives aboutiront."
 adlai_civil.2.d:0 "De nombreux électeurs conservateurs du Sud s'étaient séparés du Parti démocrate en 1948 pour former le Parti Dixiecrat. Après une mauvaise performance lors des élections de 1948, beaucoup sont revenus au sein des démocrates, ce qui a entraîné la fin des Dixiecrats. Après l'élection du président Adlai Stevenson, de nombreux anciens Dixiecrats ont été renforcés par ses politiques pro-ségrégationnistes et leur influence au sein du parti a rapidement augmenté. Tout au long de son mandat, des Dixiecrats de plus en plus vocaux ont ouvertement exhorté le président à prendre des mesures supplémentaires pour protéger les traditions du Sud et garantir le maintien des lois Jim Crow dans le Sud. La pression récente exercée sur le président par les Dixiecrats au sein du parti s'est intensifiée, créant des tensions internes pour le président et le poussant à agir. En réponse à cette pression, il a annoncé son intention de maintenir les lois Jim Crow dans les États du Sud. Cette décision a provoqué des manifestations parmi les partisans des droits civiques et beaucoup ont exprimé leurs préoccupations concernant les conséquences sur le traitement des Afro-Américains dans le Sud. Avec le président se pliant aux intérêts des Dixiecrats, il semble que le mouvement de déségrégation ait subi un revers majeur."
