 Shanghai_Communique.1.t:0 "De l'autre côté du Pacifique"
 Shanghai_Communique.1.d:0 "Bien que nous ayons eu des interactions amicales limitées avec [PRC.GetNameDef] depuis la fin de la guerre civile chinoise, nos meilleurs diplomates ont pu ouvrir des canaux diplomatiques pour [PRC.GetNameDef] à travers [PAK.GetNameDef] . La plupart des présidents ont adopté une position anticommuniste ferme depuis la montée du Pacte de Varsovie de Staline et même depuis la guerre civile russe, mais il s'agit d'une occasion sans précédent de paver les relations avec [PRC.GetLeader] et nous permet de nous concentrer sur nos autres ennemis."
 Shanghai_Communique.2.t:0 "De l'autre côté du Pacifique"
 Shanghai_Communique.2.d:0 "[USA.GetNameDef] a proposé une mission diplomatique à notre humble nation dirigée par nul autre que le président [USA.GetLeader]! Cela pourrait être capital pour la diplomatie entre nos nations opposées, ainsi que pour notre statut international ! Cependant, nous pouvons aussi profiter de cette occasion pour priver ces capitalistes de leur temps."
 Shanghai_Communique.3.t:0 "De l'autre côté du Pacifique - La Chine accepte !"
 Shanghai_Communique.3.d:0 "Bien que nos nations aient eu leurs différences dans le passé, [PRC.GetLeader] a accepté notre mission sur leurs terres ! Les plans sont déjà en cours pour le président [USA.GetLeader] de prendre l'avion pour Shanghai et de rencontrer le président."
 Shanghai_Communique.4.t:0 "De l’autre côté du Pacifique – la Chine décline !"
 Shanghai_Communique.4.d:0 "Président [PRC.GetLeader] a catégoriquement décliné notre demande d'envoi d'une mission diplomatique ! Il semble que nos divergences passées aient été trop lourdes à porter."
 Shanghai_Communique.5.t:0 "Un Américain à Shanghai"
 Shanghai_Communique.5.d:0 "Après une brève escale à Hawaï et à Guam, le président [USA.GetLeader] a atterri à Shanghai ! Le président a été accueilli par une garde d'honneur militaire et une petite foule par une journée d'hiver grise. Malgré les attentes modestes, le président a exprimé une pointe de déception face à l'absence de « milliers de personnes dans la foule en liesse » après des décennies de diplomatie hostile."
 Shanghai_Communique.6.t:0 "[GetNewspaperHeader]Un Américain à Shanghai"
 Shanghai_Communique.6.d:0 "Après des décennies de diplomatie hostile, [USA.GetNameDef] et [PRC.GetNameDef] ont entamé le long processus de réconciliation. Le Président [USA.GetLeader] a atterri à Shanghai dans le cadre d'une mission diplomatique d'une semaine visant à normaliser leurs relations et à discuter des enjeux entre leurs pays. Le monde entier retient son souffle tandis que ces géants politiques s'assoient à la table des négociations."
 Shanghai_Communique.7.t:0 "Une rencontre avec le Président"
 Shanghai_Communique.7.d:0 "Le Président [USA.GetLeader] se rend à Pékin dans le cadre de son voyage dans notre humble pays. Bien que nous puissions maintenir un climat amical et apolitique, une partie des conditions de cette visite était une discussion sur les relations diplomatiques entre nos nations souveraines."
 Shanghai_Communique.8.t:0 "Une rencontre avec le président"
 Shanghai_Communique.8.d:0 "Après une semaine de voyage vers le nord depuis Shanghai le long de la côte chinoise, le président [USA.GetLeader] est enfin arrivé à Pékin. Presque aussitôt après l'arrivée du président américain, le président [PRC.GetLeader] le convoqua pour une brève réunion à l'hôtel Jinjiang. Lors de leur rencontre, le président déclara timidement au président : « Je crois que notre vieil ami [CHI.GetLeader] ne pourra pas approuver cela. Bien que cette réunion ait été brève, son importance pour la promotion de la diplomatie entre les démocraties occidentales et les États communistes de l'Est est indéniable. Dans le cadre de cette réunion, ces dirigeants mondiaux ont tenté de normaliser leurs relations. Les sujets abordés comprenaient un accord visant à éviter l'hégémonie dans la région Asie-Pacifique, ainsi que la reconnaissance de la politique d'une seule Chine."
 Shanghai_Communique.9.t:0 "Rencontre avec le président : les États-Unis acceptent"
 Shanghai_Communique.9.d:0 "Le président [USA.GetLeader] a accepté nos conditions, acceptant d’éviter l’hégémonie et reconnaissant notre gouvernement comme le véritable gouvernement de la Chine !"
 Shanghai_Communique.10.t:0 "Rencontre avec le président : les États-Unis acceptent"
 Shanghai_Communique.10.d:0 "Le Président [USA.GetLeader] a accepté certaines de nos conditions. Le président a accepté d'éviter l'hégémonie dans la région, mais refuse de reconnaître notre droit de propriété sur l'île rebelle de Taïwan."
 Shanghai_Communique.11.t:0 "Rencontre avec le président : les États-Unis ne sont pas d'accord"
 Shanghai_Communique.11.d:0 "Le président [USA.GetLeader] semblait bouleversé, puis furieux en entendant nos conditions. Le président a rejeté toute possibilité de réconciliation entre nos deux nations, affirmant qu'il n'abandonnerait jamais [CHI.GetNameDef], notamment à la demande d’une nation étrangère."
 Shanghai_Communique.12.t:0 "Le communiqué de Shanghai"
 Shanghai_Communique.12.d:0 "Dans le cadre d'une visite en cours en [PRC.GetNameDef] , [USA.GetLeader] a rencontré [PRC.GetLeader] Afin d'aplanir le conflit diplomatique et d'assurer la paix entre les deux nations, les deux dirigeants ont signé un communiqué de paix et d'entente. Ils ont affirmé dans cette déclaration commune qu'il n'y aurait pas de lutte pour l'hégémonie entre les deux nations et que [USA.GetNameDef] reconnaît la politique d'une seule Chine - ce qui signifie concrètement qu'elle ne reconnaît plus la nation de [CHI.GetNameDef]. Il s’agit d’un moment décisif dans les relations entre l’Occident et l’Orient, et cela présage certainement de bonnes choses pour l’avenir."
 Shanghai_Communique.13.t:0 "Le communiqué de Shanghai"
 Shanghai_Communique.13.d:0 "Dans le cadre d'une visite en cours en [PRC.GetNameDef] , [USA.GetLeader] a rencontré [PRC.GetLeader] afin d'aplanir le conflit diplomatique et d'assurer la paix entre les deux nations. Malgré quelques difficultés dans les négociations, les deux pays ont publié un communiqué signé stipulant qu'il n'y aura pas de lutte pour l'hégémonie dans le Pacifique. Cependant, [USA.GetNameDef] a refusé de reconnaître la politique d'une seule Chine. Avec cette annonce, le président [USA.GetLeader] a développé plus en détail devant un public mécontent que la [PRC.GetLeader] , affirmait que « notre nation restera fidèle à ses alliés, contre vents et marées ». Bien que cela ne semble pas être le cas [PRC.GetNameDef] le résultat souhaité est atteint, il s’agit néanmoins d’un tournant dans les relations entre l’Est et l’Ouest, et d’un bref moment de réconciliation."
 Shanghai_Communique.14.t:0 "Le communiqué de Shanghai"
 Shanghai_Communique.14.d:0 "Dans le cadre d'une visite en cours en [PRC.GetNameDef] , [USA.GetLeader]a rencontré [PRC.GetLeader] afin d'aplanir le conflit diplomatique et d'assurer la paix entre les deux nations. Cependant, la situation a rapidement dérapé lorsque le président a exprimé son malaise à l'idée de reconnaître la politique d'une seule Chine, qui reconnaîtrait les revendications de la [PRC.GetNameDef] sur [CHI.GetNameDef] . Bouleversé par ce malaise, [PRC.GetLeader] a mit fin aux négociations avec colère, affirmant que cela constituait en soi un défi à leur souveraineté et à leur hégémonie dans le Pacifique, et qu'un refus de reconnaître leur politique était un refus de reconnaître leur nation. La visite de [USA.GetLeader] se poursuivra, mais un air de tension qui a remplacé le ton autrefois joyeux."
 Shanghai_Communique.15.t:0 "Le Grand Négociateur"
 Shanghai_Communique.15.d:0 "Le président [USA.GetLeader] est retourné aux [USA.GetNameDef] suite à ce qui a été qualifié de triomphe de la diplomatie par la presse au sein du monde démocratique. En tant que président [USA.GetLeader] a commencé à réparer la fracture massive entre la diplomatie des deux nations, nous ne pouvons qu'espérer des accords entre nos deux grandes nations."
 Shanghai_Communique.16.t:0 "Enfin la cordialité"
 Shanghai_Communique.16.d:0 "Le président [USA.GetLeader] est retourné aux [USA.GetNameDef] suivant ce que beaucoup considèrent comme un premier pas dans la bonne direction pour réparer les relations avec la [PRC.GetNameDef] . Même si nous avons un long chemin à parcourir, nous pouvons enfin cesser de nous inquiéter de la menace de la [PRC.GetNameDef]."
 Shanghai_Communique.17.t:0 "Les échecs de la diplomatie"
 Shanghai_Communique.17.d:0 "Le président [USA.GetLeader] retourne aux [USA.GetNameDef] avec un air sombre. Bien que le président soit allé en [PRC.GetNameDef] avec pour objectif la diplomatie, il est revenu bredouille après avoir contesté les conditions de [PRC.GetLeader]. Nos relations sont désormais aussi hostiles que jamais."
 Department_of_Energy.1.d:0 "Le gouvernement fédéral a récemment approuvé la création d'un Département de l'Énergie. Il s'agira d'un poste au sein du cabinet et a pour objectif de consolider les divers programmes énergétiques à travers le gouvernement fédéral, ainsi que les responsabilités liées au programme nucléaire de défense. Pendant des années, la politique énergétique, en particulier la recherche, a été freinée par un manque de concentration en raison des différents programmes et agences impliqués. Plus significativement, le programme nucléaire a également été mal coordonné, notamment en termes de conception, de production et de recherche. Avec la création du Département de l'Énergie, tous ces programmes et politiques seront coordonnés, et le gouvernement prévoit une grande amélioration de l'efficacité avec laquelle les États-Unis développeront de nouvelles technologies énergétiques et les mettront en œuvre à travers le pays."
 Abolish_JCNAE.1.d:0 "Le Comité conjoint sur l'énergie atomique du Congrès des États-Unis a été officiellement aboli. À son apogée, le comité avait compétence sur tous les projets de loi et régulations concernant les aspects militaires et civils de l'énergie nucléaire. Il bénéficiait également d'un droit de veto législatif unique qui lui permettait d'avoir une voix dans la prise de décision exécutive en matière de politique nucléaire. En effet, il était considéré comme l'un des comités les plus puissants de l'histoire du Congrès américain. Cependant, au cours des dernières années, sa compétence et sa surveillance avaient été considérablement réduites, d'autres comités du Sénat et du Congrès prenant en charge la supervision de l'énergie nucléaire civile. De plus, la création de l'Agence de protection de l'environnement (EPA) et de la Commission de régulation nucléaire ont rendu le comité de plus en plus redondant. Compte tenu de ces facteurs, le comité a été formellement aboli aujourd'hui, ce qui est perçu par beaucoup comme une victoire pour le pouvoir exécutif et ses efforts pour consolider la politique nucléaire au sein de l'exécutif."
 Ford.5.d:0 "Le président Gerald Ford a annoncé aujourd'hui la nomination de Nelson Rockefeller, l'ancien gouverneur de New York, en tant que candidat à la vice-présidence. Cette décision a immédiatement suscité des réactions négatives parmi les républicains conservateurs, qui estiment que le président Ford trahit les valeurs du parti en choisissant un républicain libéral. En effet, les auditions de confirmation au Congrès devraient être difficiles, certains démocrates conservateurs étant également attendus pour poser des questions difficiles. Cependant, sa confirmation devrait, en fin de compte, être obtenue. Lors de son annonce, le président Ford a souligné l'expérience exécutive de Rockefeller et son bilan de mise en œuvre réussie des politiques. Les observateurs notent que Rockefeller pourrait se révéler être un atout électoral majeur pour Ford lors des prochaines élections présidentielles. Rockefeller peut attirer le soutien de communautés traditionnellement opposées aux républicains conservateurs, et sa nomination à la vice-présidence élargira l'attrait de Ford."
 Ford.6.d:0 "Le président Gerald Ford a annoncé aujourd'hui devant le Congrès que la plus grande menace pesant sur le pays était l'inflation. Il a lancé une nouvelle campagne appelée Whip Inflation Now (WIN), un mouvement volontaire visant à inciter les citoyens américains à s'unir pour combattre l'inflation à la maison, en coordination avec ses mesures publiques de contrôle de l'inflation. Le président Ford a déclaré qu'il accueillerait également les lettres des Américains proposant des idées pour limiter les dépenses à domicile. La Maison Blanche a ensuite annoncé que ceux qui participent à WIN devraient porter des badges et des chemises avec \"WIN\" écrit dessus pour montrer leur solidarité. De plus, ce programme s'inscrit dans la conviction qu'il revient aux citoyens privés de collaborer avec le gouvernement pour résoudre la crise de l'inflation actuelle, et non à un gouvernement plus grand. Les réactions initiales à WIN ont été moqueuses de la part de nombreux Américains, et les opposants au président manipulent le logo pour en faire des critiques à son égard."
 Ford.7.d:0 "Lors d'une allocution télévisée nationale, le président nouvellement nommé Gerald Ford a annoncé qu'il accordait une grâce présidentielle à l'ancien président Richard Nixon. Le président Ford a expliqué que les États-Unis devaient aller de l'avant et se réconcilier après les récentes controverses, et que le seul moyen de tourner la page était par une grâce présidentielle. L'ancien président Nixon avait démissionné en raison du scandale du Watergate et de la récente divulgation d'enregistrements compromettants de la Maison Blanche. La décision de pardonner le président Nixon n'a pas été bien reçue. Les opposants accusent Ford d'avoir collusionné avec Nixon pour s'élever à la présidence, tandis que d'autres estiment que Nixon aurait dû faire face aux conséquences de ses actions. Les observateurs politiques soulignent que la réputation de Ford en tant que négociateur honnête pourrait être ternie par cette décision. Cependant, les partisans du président insistent sur le fait que sa décision n'était pas le résultat d'un accord politique, mais qu'elle représentait la chose moralement correcte à faire, et qu'il acceptait la réaction politique pour guérir la nation."
 Albert.1.d:0 "Le président Carl Albert a annoncé qu'il confirmerait la nomination de Gerald Ford en tant que vice-président. La décision de maintenir un vice-président républicain est considérée comme un acte conciliatoire, étant donné les circonstances exceptionnelles qui ont conduit le président Albert à assumer ses fonctions. Gerald Ford est perçu comme un républicain modéré, doté d'un fort caractère moral, respecté tant par les démocrates que par les républicains. Le président Albert a déclaré qu'il se réjouissait de travailler en étroite collaboration avec le vice-président Ford. Bien que la presse soutienne largement la décision du président Albert, des murmures se font entendre parmi les démocrates, qui craignent que le vice-président Ford, un proche ami de l'ex-président Richard Nixon, n'utilise sa position pour saper les procédures en cours contre ce dernier."
 Albert.2.d:0 "Le procès de l'ex-président Richard Nixon s'est conclu aujourd'hui par sa condamnation. Alors qu'il était en fonction, l'ex-président Nixon a dirigé une conspiration visant à pénétrer dans les bureaux du Parti démocrate à Watergate, avant de participer à la dissimulation de l'affaire. Le président Carl Albert, qui en tant que président de la Chambre des représentants avait poussé à l'ouverture de l'enquête parlementaire, a salué la décision du tribunal. Il a déclaré qu'aucun homme n'était au-dessus de la loi et que chacun était responsable de ses actes. Le président Albert a exprimé l'espoir qu'avec la fin du procès, la nation puisse enfin guérir et aller de l'avant vers un avenir plus lumineux et un gouvernement plus transparent. De nombreux Américains, même certains partisans de l'ex-président, partagent ce sentiment de responsabilité."
 Agnew.1.d:0 "Le président Spiro Agnew a annoncé la nomination de George Romney en tant que vice-président des États-Unis. Romney, ancien candidat à la présidence et perçu comme un rival politique de Nixon, avait cependant rejoint la première administration de Nixon. En tant que gouverneur, Romney a réussi à obtenir le soutien des classes populaires du Michigan, et son attrait auprès des familles ouvrières est vu par beaucoup au sein du Parti républicain comme un atout pour les prochaines élections présidentielles. Le vice-président Romney a également montré une grande capacité à travailler avec les démocrates, une qualité que le président Spiro considère comme un atout majeur alors qu’il tente de mettre en œuvre des politiques au sein du Congrès. Bien que sa nomination ne soit pas du goût des républicains les plus conservateurs, de nombreuses personnes à travers le pays ont exprimé leur satisfaction face à ce nouveau vice-président."
 Agnew.2.d:0 "Dans une allocution télévisée diffusée à l'échelle nationale, le président nouvellement investi Spiro Agnew a annoncé qu'il accordait une grâce présidentielle à l'ancien président Richard Nixon. Le président Agnew a déclaré que les États-Unis devaient aller de l'avant et guérir des controverses récentes, et que la seule façon d'y parvenir était à travers la grâce présidentielle. L'ancien président Nixon avait démissionné en raison du scandale du Watergate et de la récente divulgation d'enregistrements compromettants de la Maison Blanche. Cette décision de gracier Nixon n'a pas été bien accueillie. Les opposants accusent Agnew de collusion avec Nixon pour s'élever au poste de président, tandis que d'autres estiment que Nixon aurait dû faire face aux conséquences de ses actes. Les observateurs politiques notent que la réputation du président Agnew sera ternie en raison de sa relation étroite avec Nixon. Cependant, les partisans du président insistent sur le fait que sa décision n'était pas le résultat d'un accord politique, mais qu'il s'agissait de la chose moralement juste à faire, et qu'il accepterait le contrecoup politique afin de guérir la nation."
 Amnesty.1.d:0 "Les États-Unis ont annoncé un programme offrant l'amnistie à ceux qui ont évité d'être enrôlés dans les forces armées. Au cours des récents conflits, un certain nombre d'Américains ont choisi de fuir le pays ou de se cacher pour éviter leur service militaire obligatoire. Beaucoup de ceux qui ont évité la conscription ou déserté ont affirmé l'avoir fait par conviction morale ou par la croyance qu'ils ne pouvaient pas soutenir les actions militaires. Le nouveau programme offrira l'amnistie à ceux qui ont évité la conscription s'ils en font la demande auprès du gouvernement. Cette politique est vue comme un compromis. Bien que les déserteurs ne soient pas directement punis, en demandant l'amnistie, ils admettent néanmoins leur culpabilité. La nouvelle politique est sans doute un compromis, mais le gouvernement estime qu'elle est essentielle pour résoudre la question des déserteurs et permettre à ces hommes de retrouver leurs familles."
 ERA.5.d:0 "\nBien que proposée pour la première fois à la fin des années 1920, l'Amendement sur les Droits Égaux (ERA) a finalement été ratifié dans la Constitution des États-Unis d'Amérique. L'ERA met fin à toutes les distinctions légales entre les hommes et les femmes, en particulier en ce qui concerne le divorce, la propriété et l'emploi. Les partisans du projet de loi soutiennent désormais que les femmes américaines jouiront enfin de tous les droits légaux des hommes et ne seront plus des citoyennes de seconde classe. Cependant, un certain nombre de femmes de la classe moyenne se sont opposées à l'ERA, arguant qu'il érodait les rôles traditionnels de genre, menaçait les droits des mères dans les affaires de divorce et ouvrait la voie à la conscription des femmes pour le service militaire. Elles ont qualifié l'ERA de calamité et mènent une campagne pour que les États s'opposent à la ratification de l'amendement dans leurs législatures. Malgré cette opposition, l'ERA a été adopté avec succès, et de grandes foules de partisans sont censées accueillir jubilatoirement la nouvelle à travers tout le pays."
 USA_Marijuana.1.d:0 "Les États-Unis ont officiellement approuvé la décriminalisation de la marijuana. Cette drogue a longtemps été associée à la contre-culture et a été une cible de répressions policières intenses. Cependant, de nombreuses voix ont commencé à affirmer qu'une telle focalisation détournait l'attention de l'enquête sur des crimes plus graves ou de la lutte contre des drogues plus nocives aux États-Unis. Ces arguments ont été renforcés par des articles récents suggérant que l'impact de la marijuana n'était pas beaucoup plus nocif que la consommation de tabac ou d'alcool. De plus, de nombreux États ont fait valoir que les revenus fiscaux générés par la vente de marijuana pourraient apporter d'énormes bénéfices au gouvernement. Tous ces arguments ont conduit le gouvernement à décriminaliser la drogue. Toutefois, des opposants soutiennent que cette décision finira par nuire au peuple américain, affirmant que les partisans de la décriminalisation ont minimisé les conséquences négatives que la légalisation pourrait entraîner."
 Clark_Amendment.1.d:0 "La violence en Angola a conduit plusieurs acteurs étrangers à s'impliquer en soutenant les différentes factions qui se battent pour le contrôle du pays. Les États-Unis ont également apporté leur aide aux groupes anti-communistes sur le terrain, notamment par le biais d'une aide militaire. Cependant, des rapports récents et des révélations concernant des violations des droits de l'homme et des massacres de civils ont incité le Congrès à agir. Le sénateur Dick Clark a fait adopter un amendement à la loi sur le contrôle des exportations d'armements, appelé l'amendement Clark, qui interdit aux États-Unis de fournir une aide à des groupes privés angolais impliqués dans des opérations militaires. L'amendement Clark a suscité la colère des partisans de l'anti-communisme, qui estiment que le soutien à ces groupes constitue un intérêt stratégique vital pour les États-Unis. Cependant, de nombreux Américains soutiennent cet acte, estimant que les États-Unis ne devraient pas contribuer à perpétuer la violence en Angola."
 ELS_COUP.1.d:0 "Le gouvernement du Salvador a prouvé son inefficacité face aux inégalités économiques et à l'influence croissante de l'extrême gauche. Cela a conduit à une coalition entre des officiers militaires modérés et des civils, qui ont lancé un coup d'État pour renverser le gouvernement et mettre en place une junte civile-militaire, connue sous le nom de Junte de Gouvernement Révolutionnaire (JGR). La junte bénéficie du soutien des États-Unis, qui craignent une prise de pouvoir communiste. La junte a lancé une série de réformes modérées pour apaiser la population, tout en réprimant brutalement ce qu'elle identifie comme la gauche communiste. Cependant, l'escalade de la violence et la montée des escadrons de la mort soutenus par le gouvernement ont considérablement affaibli le programme de réformes, et la résistance, en particulier dans les zones rurales, est en augmentation."
 ELS_COUP.2.d:0 "L'escalade de la violence au Salvador a pris une tournure plus sombre lorsque des nouvelles ont émergé faisant état de l'assassinat de l'archevêque bien-aimé Oscar Romero, alors qu'il terminait un sermon. Aucun groupe n'a revendiqué la responsabilité, mais l'assassinat audacieux de cet activiste des droits de l'homme, homme d'Église et défenseur des pauvres, a choqué et révolté de nombreux habitants du pays. Beaucoup pointent du doigt soit la junte de gouvernement révolutionnaire au pouvoir, soit un escadron de la mort associé à celle-ci. On pense que Romero a été tué en raison de son soutien aux droits de l'homme et de ses récentes demandes incitant les troupes salvadoriennes à désobéir aux ordres qui violent les droits humains. Le gouvernement a nié toute responsabilité, affirmant qu'il s'agissait d'une conséquence tragique de l'escalade de la violence des deux côtés et que personne ne pouvait être tenu responsable. L'Église catholique aurait exigé une enquête internationale complète sur le meurtre."
 Ford.10.d:0 "Les membres du prestigieux Host Breakfast annuel ont invité le président Ford à prendre la parole après le refus du gouverneur démocrate de Californie de s'engager pour l'événement. Voulant galvaniser les partisans de l'État en vue de la prochaine élection présidentielle, le président Ford est venu s'adresser à l'événement. Lynette Fromme, ancienne membre de la famille Manson, est également arrivée armée d'un pistolet. Mme Fromme avait récemment lu que la pollution menaçait de détruire l'environnement, en particulier les séquoias de Californie. Cette adepte du célèbre tueur en série a décidé de tuer le président et de montrer à l'establishment le sérieux de la cause environnementale. Après l'événement, le président Ford a traversé un parc en direction du Capitole de Californie pour rencontrer les principaux dirigeants politiques californiens. À son approche, Mme Fromme s'est approchée à quelques mètres du président Ford. Elle a levé le pistolet et l'a pointé sur le président…"
 Ford.11.d:0 "Lorsque Fromme appuya sur la détente, un clic se fit entendre, car l'assassin n'avait pas réussi à mettre une cartouche dans l'arme. L'agent des Services Secrets Larry Buendorf maîtrisa Fromme au sol, alors qu'elle riait de la chance qu'elle avait eue de ne pas avoir pu mener à bien son geste. Le président Ford sembla impassible face à l'incident et poursuivit son programme pour la journée. De nombreux Américains applaudissent le président pour son courage face à la mort. Le président lui-même déclara qu'il l'avait vue lever l'arme, mais qu'il ne considérait pas la menace comme sérieuse, surtout après que Fromme ait été interpellée. À son retour à la Maison-Blanche, Ford a été accueilli par sa famille joyeuse et il est dit qu'il prendra un peu de temps pour se reposer. Fromme devrait être jugée pour sa tentative d'assassinat. Le FBI enquête pour savoir si le tristement célèbre tueur en série Charlie Manson a joué un rôle quelconque dans les actions de son ancienne disciple."
 Ford.12.d:0 "Lorsque Fromme appuya sur la détente, une balle atteignit le président Gerald Ford en plein cœur. Le président fut rapidement transporté à l'hôpital local, tandis que les agents des Services Secrets prenaient Fromme en garde à vue. On a entendu Fromme crier que ceux qui tuent la mère Terre en subiraient les conséquences. Quelques heures plus tard, le président fut déclaré mort. La nouvelle de l'assassinat a choqué le pays et le monde entier. Le président Ford jouissait d'une réputation de grandeur et d'intégrité, et des messages de condoléances ont commencé à affluer. Des foules de personnes en deuil sont attendues devant la Maison-Blanche. À l'international, de nombreuses nations sont également choquées et incertaines de ce que l'avenir réserve aux États-Unis. Le vice-président Rockefeller a prêté serment en privé en tant que nouveau président, et la nation attend son avenir."
 Allende.1.d:0 "Lorsque le président Salvador Allende prit le pouvoir au Chili, son régime annonça le début d'une nouvelle expérience socialiste pour l'Amérique du Sud. Depuis son accession au pouvoir, il a dû faire face aux critiques de la Cour suprême et à une résolution du Congrès appelant l'armée à intervenir. Le président Allende souligna que ces efforts étaient des tentatives antidémocratiques visant à annuler le choix démocratique du peuple. Beaucoup dans le pays soupçonnent que ces efforts sont influencés par la CIA, qui cherche désespérément à voir l'échec du socialisme au Chili. Cependant, ce matin, une crise plus grave a éclaté lorsque la nouvelle est parvenue à la capitale indiquant que la marine avait pris le contrôle de Valparaíso. Le président Allende reçoit maintenant des informations selon lesquelles des troupes armées saisissent des positions à travers la capitale et que des stations de radio ont été bombardées par l'Air Force. Un coup d'État à grande échelle semble en cours et le président Allende doit agir rapidement. Les prochaines heures détermineront l'avenir du Chili."
 Allende.2.d:0 "Lorsque la nouvelle parvint au président Allende que la marine avait pris le contrôle de Valparaíso, il tenta de contacter ses officiers militaires supérieurs. Il ne parvint pas à les joindre et craignait que les meneurs du coup d'État aient détenu ces hauts responsables. Cependant, il s'avéra que les officiers supérieurs, à l'exception du chef de la marine qui avait été arrêté, étaient eux-mêmes à la tête de la tentative de coup d'État. Lorsque le président Allende réalisa cela, il était déjà trop tard. Les chefs du coup d'État exigèrent sa démission, mais le président Allende refusa, soulignant qu'il était le président élu du Chili. En réponse, des troupes armées tentèrent de prendre d'assaut le palais présidentiel, mais elles rencontrèrent la résistance des milices socialistes loyales. Alors que les forces militaires se rapprochaient, Allende s'adressa à la nation, affirmant qu'il ne légitimerait pas le coup d'État et qu'il ne servirait pas de marionnette pour le nouveau régime. Peu de temps après, le nouveau gouvernement militaire annonça que le président Allende s'était suicidé. Après une brève lutte, le Chili est désormais sous le contrôle de l'armée."
 Allende.3.d:0 "Lorsque la nouvelle du coup d'État parvint au président Allende, il craignait que les chefs du coup n'aient détenu ses officiers militaires supérieurs, car il ne parvenait pas à les joindre. Cependant, il s'avéra que les officiers supérieurs, à l'exception de l'amiral Montero, étaient à la tête de la tentative de coup. Mais les conspirateurs échouèrent à arrêter l'amiral Montero, qui réussit à reprendre le contrôle de la marine. Alors que des soldats commençaient à occuper des sites stratégiques à travers la capitale, la nouvelle parvint que la marine à Valparaíso avait restitué la ville à l'autorité gouvernementale. La confusion qui en résulta ralentit l'avancée des militaires et certains commandants régionaux se retirèrent du complot. Une tentative, quelques heures plus tard, de saisir le Palais présidentiel échoua, grâce à l'intervention d'une grande force de miliciens pro-Allende qui purent renforcer la défense du Palais contre l'attaque. Peu de temps après, les chefs du coup d'État se rendirent et ordonnèrent à leurs forces de se retirer. Le président Allende s'adressa alors à la nation, annonçant que le régime démocratique avait triomphé sur la tyrannie et la conspiration."
 War_Powers.1.d:0 "Le Congrès des États-Unis a annulé le veto présidentiel et a adopté une Résolution sur les pouvoirs de guerre, ou la Loi sur les pouvoirs de guerre. La nouvelle loi vise à limiter le pouvoir exécutif en exigeant que le président obtienne l'approbation du Congrès pour toute action militaire. Beaucoup au Congrès saluent cette loi comme une victoire pour la démocratie et un moyen de s'assurer qu'aucun président ne puisse utiliser la force militaire pour ses propres intérêts ou objectifs. En général, le projet de loi bénéficie d'un large soutien public, mais la Maison Blanche a fait remarquer que, dans un monde aux circonstances en constante évolution, cette nouvelle loi entravera la capacité des États-Unis à agir efficacement. Les observateurs de la loi soulignent que cette dernière présente des failles potentielles, et seul le temps dira si le président pourra réellement être mis au défi en période de crise."
 NIC_USA.1.d:0 "Le Front Sandiniste de Libération Nationale est né de la fusion de plusieurs groupes de jeunesse et d'étudiants au sein des campus universitaires. Le parti adopte de plus en plus une idéologie socialiste en opposition à la famille Somoza au pouvoir. Pour de nombreux Nicaraguayens, le régime Somoza a conduit à des difficultés économiques, à la répression politique et à une politique de soumission aux exigences des États-Unis. Les Sandinistes ont gagné en popularité ces dernières années en raison de la corruption flagrante et de l'incapacité du gouvernement à faire face à un récent désastre causé par un tremblement de terre. Le groupe a mené des campagnes pour des salaires plus élevés et a lancé plusieurs raids contre la famille Somoza et ses partisans. Les États-Unis voient l'ascension de cette organisation de gauche avec de plus en plus de suspicion et soutiennent le gouvernement nicaraguayen dans ses efforts pour faire face à cette menace."
 NIC_USA.2.d:0 "L'essor du Front Sandiniste de Libération Nationale socialiste et de sa campagne de kidnappings et d'agitation a indigné le gouvernement nicaraguayen dirigé par le dirigeant de longue date Anastasio Somoza. La famille Somoza elle-même dirige le pays depuis la dernière intervention militaire américaine et a bénéficié pendant des décennies de l'aide des États-Unis. Le gouvernement nicaraguayen a lancé une campagne brutale de tueries et de répression pour étouffer les troubles, appelée la politique du Siège, mais cela n'a pas mis fin à l'agitation. En fait, l'ampleur de la violence a choqué les États-Unis et, bien qu'ils s'opposent aux Sandinistes en tant que régime alternatif, ils ont décidé de suspendre l'aide américaine au gouvernement nicaraguayen et à Somoza. Le régime de Somoza a rapidement qualifié cette décision de trahison d'un allié anti-communiste, mais les États-Unis insistent sur le fait qu'ils ne peuvent pas soutenir les graves violations des droits de l'homme en cours au Nicaragua."
 NIC_USA.3.d:0 "À la suite de la campagne de kidnapping menée par le Front Sandiniste de Libération Nationale socialiste contre le gouvernement nicaraguayen, son dirigeant a décidé de lancer une politique de siège. Le dictateur nicaraguayen de longue date, Anastasio Somoza, a déployé sa Garde nationale, formée par les Américains, pour mener une campagne de meurtres extrajudiciaires, de violence, de censure de la presse et d’intimidation visant à cibler les gauchistes à travers le pays et à empêcher les nouvelles de fuiter à l’étranger. Bien que de nombreuses nations aient déjà condamné cette politique comme perpétuant des violations des droits de l’homme, le gouvernement des États-Unis a décidé de soutenir la politique du siège. Le gouvernement américain ne peut pas risquer que les socialistes sandinistes prennent le pouvoir et éliminent un allié clé des États-Unis. En effet, un responsable américain a déclaré aux médias que le gouvernement nicaraguayen se défendait contre le terrorisme communiste, indiquant ainsi son soutien au régime de Somoza."
 NIC_USA.4.d:0 "Pedro Chamorro, rédacteur en chef du célèbre journal La Prensa, fondateur d'un parti pro-démocratie, et parent de deux anciens présidents nicaraguayens, a été assassiné par un groupe de tireurs qui l'ont attaqué en voiture. Sa mort a provoqué un tollé à travers le pays, l'opposition accusant le gouvernement du dictateur Anastasio Somoza d'être responsable de cet assassinat. Lors de ses funérailles, des dizaines de milliers de personnes ont envahi les rues, ce qui a conduit à des violences et des émeutes ciblant le régime de Somoza. Une grève générale a également paralysé la plupart des entreprises pendant plusieurs jours. Le régime de Somoza a mis la faute sur un homme d'affaires local mécontent des critiques émises par La Prensa, mais la majorité des Nicaraguayens tient le gouvernement responsable de cette tragédie."
 NIC_USA.5.d:0 "Le président Anastasio Somoza a officiellement démissionné de ses fonctions de président du Nicaragua. Lui et sa famille auraient déjà pris la fuite, avec de nombreux soupçons concernant le départ du pays avec des millions de dollars en biens de l'État. La chute du régime Somoza a permis aux forces du Front Sandiniste de Libération Nationale (FSLN) d'entrer dans la capitale. Un nouveau régime socialiste sous les Sandinistes devrait prendre le pouvoir, leurs forces contrôlant actuellement presque l'ensemble du pays. L'incapacité de Somoza à répondre aux demandes de réformes, à traiter les inégalités économiques de longue date et à mettre fin à la répression a facilité sa chute. Nombreux sont ceux au Nicaragua qui ne pleurent pas la fin de la famille Somoza, mais l'avenir du pays reste incertain."
 USA_NIC_WAR.1.d:0 "Les États-Unis ont envahi le Nicaragua. Il s'agit de la première action militaire directe dans le pays depuis le retrait des États-Unis en 1933. L'ascension du Front Sandiniste de Libération Nationale (FSLN), un groupe socialiste, menace de transformer le Nicaragua en un État socialiste. Pour les États-Unis, avoir un gouvernement socialiste aussi proche du continent américain et en position de propager des troubles socialistes à travers ses voisins est inacceptable. L'armée américaine a déclaré que son objectif était de sauver le peuple nicaraguayen d'un régime oppressif. Elle a ajouté qu'elle s'attendait à être bien accueillie par la population et ne prévoyait pas de résistance importante. Dans les États voisins, de nombreuses personnes sont descendues dans les rues pour protester contre l'intervention militaire américaine. Des craintes se font entendre que cette intervention américaine soit un retour à la diplomatie de canon des États-Unis au début du XXe siècle."
 contra.1.d:0 "Le nouveau gouvernement sandiniste a lancé un programme de réformes socialistes pour améliorer la société nicaraguayenne. Cependant, il existe des personnes de l'ancien régime qui résistent au changement. Pendant des décennies, ces individus ont profité de la corruption et de l'exploitation. De plus, les États-Unis organisent ouvertement ces factions en militants armés dans le but de détruire la volonté du peuple nicaraguayen. Ces militants se font appeler les Contras et mènent des opérations contre notre gouvernement sandiniste. Nos propres sources nous indiquent que les Contras sont unifiés par des agences de renseignement étrangères, et leur objectif est de détruire le socialisme au Nicaragua. À mesure que les Contras mènent davantage d'opérations, ils gagnent du soutien auprès de leurs sympathisants et suscitent de plus en plus la peur dans le cœur de nombreux Nicaraguayens."
 contra.2.d:0 "L'effondrement du régime Somoza et l'ascension des Sandinistes ont marqué une transformation radicale de la gouvernance au Nicaragua. Les Sandinistes avaient initialement promis de respecter la démocratie et de mettre fin aux disparités économiques au sein de la société. Cependant, plusieurs factions de Nicaraguayens sont devenues méfiantes à l'égard des Sandinistes, estimant qu'ils étaient en train de construire une société communiste. Ces factions se sont organisées en groupes militants appelés les Contras, qui lancent des attaques contre les Sandinistes. Les Contras se composent de trois groupes principaux : les anciens partisans du régime Somoza, les anti-communistes et les combattants anti-Somoza qui estiment avoir été trahis par les Sandinistes après leur prise de pouvoir. La CIA aurait unifié ces groupes Contra et soutient les factions anti-Sandinistes au Nicaragua. Beaucoup craignent que la montée des Contras ne conduise à une guerre civile et à la violence."
 USA_NIC.50.d:0 "Pour la première fois depuis le début des années 1930, des marines américains ont débarqué en force dans la capitale nicaraguayenne, Managua. Le gouvernement américain a déclaré que les marines seraient principalement chargés de protéger l'ambassade et l'aéroport, mais des rapports en provenance de Managua indiquent qu'ils sont déployés à des points de contrôle militaires stratégiques. Ce déploiement renforce considérablement le président nicaraguayen Anastasio Somoza, qui peine à maintenir son pouvoir face aux rebelles du Front sandiniste de libération nationale. Les combattants sandinistes avaient fait des progrès, mais avec le déploiement américain, beaucoup s'attendent à ce que la situation tourne en faveur de Somoza. Le président Somoza mène une campagne brutale contre les Sandinistes, suscitant une condamnation internationale généralisée pour les violations des droits de l'homme, mais les États-Unis continuent de le soutenir de manière constante en tant que rempart essentiel contre le communisme."
 AST_CIA.1.d:0 "L'actuel gouvernement travailliste australien du Premier ministre Gough Whitlam a tiré la sonnette d'alarme auprès de notre gouvernement. Ce dernier a suggéré d'envisager la fermeture des bases militaires américaines en Australie. Un tel scénario serait dévastateur pour nos intérêts dans le Pacifique Sud. La CIA a cependant une solution potentielle. Elle estime que l'actuel gouverneur général australien, Sir John Kerr, est sensible à l'importance d'une présence militaire américaine. L'un de nos agents contactera le gouverneur général et lui demandera d'user de son pouvoir constitutionnel pour destituer le gouvernement Whitlam, affaibli, et ainsi non seulement mettre fin à l'impasse politique en Australie, mais aussi contribuer à la défense mondiale contre l'influence communiste."
 AST_CIA.2.d:0 "L'actuel gouvernement travailliste australien du Premier ministre Gough Whitlam a tiré la sonnette d'alarme auprès de notre gouvernement. Ce dernier a suggéré d'envisager la fermeture des bases militaires américaines en Australie. Un tel scénario serait dévastateur pour nos intérêts dans le Pacifique Sud. Nous avons récemment dépêché un agent pour demander au gouverneur général, Sir John Kerr, d'user de son pouvoir constitutionnel pour destituer le gouvernement. Cela contribuerait à résoudre les problèmes politiques qui affligent actuellement l'Australie et à protéger nos bases. Cependant, cette tentative d'obtenir le soutien du gouverneur général a échoué, celui-ci ayant décidé de ne pas destituer le gouvernement."
 AST_CIA.3.d:0 "Dans un événement choquant, la crise politique en Australie a dégénéré en la destitution spectaculaire du Premier ministre travailliste Gough Whitlam, au pouvoir. Bien que Whitman et l'opposition semblaient proches d'un compromis, le gouverneur général a préféré prendre la mesure radicale de limoger le gouvernement. Cette décision sert certainement les intérêts des États-Unis et leurs craintes que Whitman n'ait l'intention de retirer les bases militaires américaines du pays. La CIA s'attribue en privé le mérite d'avoir convaincu le gouverneur général d'agir. Les Australiens seraient stupéfaits par ces actions et craindraient pour l'avenir démocratique du pays. Cependant, le nouveau gouvernement insiste sur le fait qu'il organisera prochainement des élections et mettra fin aux récentes turbulences politiques."
 Diem_Coup.1.d:0 "Le président du Sud-Vietnam, Ngo Dinh Diem, et son frère, Ngo Dinh Nhu, furent brutalement assassinés lors d'un coup d'État militaire perpétré par des officiers nationalistes. Catholique profondément fervent, le régime de Diem peinait ces dernières années à faire face aux guérillas communistes opérant dans les campagnes et à la résistance de la population majoritairement bouddhiste. Les bouddhistes protestant contre les politiques discriminatoires du gouvernement de Diem essuyèrent des tirs militaires. Après avoir isolé Diem des forces loyalistes, les putschistes militaires attaquèrent sa résidence et finirent par capturer Diem et son frère qui tentaient de fuir. Malgré les garanties des généraux et des États-Unis selon lesquelles Diem serait autorisé à quitter le pays en toute sécurité, alors qu'il était transporté au quartier général militaire, Diem et son frère furent tués à la baïonnette par un officier subalterne. De nombreux membres de la nouvelle junte au pouvoir condamnèrent cet acte, mais on ignore encore si le meurtre était accidentel ou ordonné par la junte pour se maintenir au pouvoir."
 PRC_UN.1.d:0 "\nL'Assemblée générale des Nations Unies a adopté la résolution 2578. 74 pays ont voté pour, 35 contre et 17 abstentions. La résolution 2578 reconnaît la République populaire de Chine comme son représentant légitime auprès des Nations Unies. Elle lui accorde le statut de membre de l'ONU et lui transfère son siège permanent au Conseil de sécurité. Elle expulse également le représentant de Tchang Kaï-chek et révoque le statut de membre de la République de Chine auprès de l'ONU. La République de Chine a constamment critiqué la résolution 2578, la jugeant illégale, car l'expulsion d'un membre de l'ONU requiert la recommandation du Conseil de sécurité et ne peut intervenir que si une nation a violé de manière persistante les principes du présent chapitre, conformément à l'article 6 du chapitre 2 de la Charte des Nations Unies."
 PRC_UN.2.d:0 "Lors de la 22e Assemblée générale des Nations Unies, les États-Unis ont opposé leur veto à la résolution 2578, qui reconnaissait la République populaire de Chine comme représentant légitime de la Chine. Le représentant des États-Unis à l'ONU, George H.W. Bush, a déclaré que la résolution 2578 était illégale, car l'expulsion d'un membre de l'ONU nécessite la recommandation du Conseil de sécurité et ne peut avoir lieu que si une nation a violé de manière persistante les principes du présent chapitre, conformément à l'article 6 du chapitre 2 de la Charte des Nations Unies. George H.W. Bush a également déclaré avoir proposé un projet de résolution 2578 qui accorderait à la République populaire de Chine le statut de membre de l'ONU et un siège permanent au Conseil de sécurité, tout en conservant son droit de représentation à l'ONU. Cependant, ce projet a été rejeté par l'Assemblée générale des Nations Unies."
 USA_Secret_War.1.d:0 "Le blocus des côtes vietnamiennes a pratiquement mis fin à toute contrebande d'armes et de fournitures destinées aux guérilleros communistes du Sud-Vietnam. En réponse, les Nord-Vietnamiens ont étendu les opérations du 559e Groupe de transport, qui avait établi une série de pistes reliant le Nord-Vietnam au Sud-Vietnam. Cette déroute, appelée la piste Hô Chi Minh, s'étendait du Vietnam à certaines régions du Laos et du Cambodge. Les efforts des États-Unis pour inciter les gouvernements cambodgien et laotien à interrompre ces lignes d'approvisionnement ont échoué. Frustré par l'infiltration croissante de combattants au Sud-Vietnam, le gouvernement américain a décidé de lancer une campagne de bombardements. L'opération vise à cibler les forces, les installations et les voies d'approvisionnement nord-vietnamiennes au Cambodge et au Laos. Cette opération a considérablement étendu la guerre du Vietnam, mais les décideurs américains estiment que la puissance aérienne peut fortement entraver les efforts nord-vietnamiens et immobiliser les forces nord-vietnamiennes qui, autrement, se dirigeraient vers le sud."
 usa_flavor.1.d:0 "Des rapports affluents de New York, des appels de journalistes au sujet du Stonewall Inn, un bar du quartier de Greenwich Village, qui sert de refuge à la communauté gay, lesbienne et transgenre de la ville. Malgré le nombre fréquent de raids que nous effectuons dans les bars gays, ils se battent maintenant. Deux femmes transgenres de couleur, Marsha P. Johnson et Sylvia Rivera, auraient résisté à leur arrestation et lancé la première bouteille (ou brique ou pierre) sur les policiers, respectivement. La foule grandissante à l'extérieur força le groupe initial de la police de New York à se barricader, les émeutiers leur lançant des objets et tentant de pénétrer à l'intérieur. Finalement, après 4 heures du matin, les choses se calmèrent. Étonnamment, personne n'est mort ni grièvement blessé lors de la première nuit des émeutes, bien que quelques policiers aient rapporté des blessures.\n\nMalgré le fait que notre police ait dévasté le Stonewall Inn, le bar a rouvert avant la tombée de la nuit le jour suivant. Encore une fois, la police a été appelée pour rétablir l'ordre, avec un groupe encore plus grand d'officiers de la TPF, qui ont battu et gazé les membres de la foule. Cela a continué jusqu'aux premières heures du matin, lorsque la foule s'est dispersée.\n\nDe plus en plus de partisans sont arrivés, scandant des slogans comme \"gay power\" et \"we shall overcome\". Au cours des nuits suivantes, les militants gays ont continué à se rassembler près du Stonewall, profitant de ce moment pour diffuser des informations et construire la communauté qui alimenterait la croissance du mouvement pour les droits des gays. Bien que les policiers soient également revenus, l'ambiance était moins confrontée, avec des escarmouches isolées remplaçant les grandes émeutes du week-end."
 USA_Rhodesia.2.d:0 "\nAlors que l'Union soviétique et ses alliés à travers l'Afrique provoquent des troubles et prennent le pouvoir en différents endroits, la Rhodésie suscite un regain d'intérêt. Depuis que la Rhodésie a proclamé son indépendance unilatérale, les États-Unis ont soutenu leur allié britannique en coupant les ponts et en imposant des sanctions jusqu'à ce que la Rhodésie accepte le principe de la majorité. Cependant, les Rhodésiens possèdent des minerais précieux et mènent une guerre contre de multiples groupes militants prétendant lutter pour l'indépendance. Cependant, leur idéologie de gauche laisse penser que ces groupes pourraient n'être que des agents soviétiques. L'Afrique du Sud et le Portugal refusent d'appliquer les sanctions, permettant aux Rhodésiens de contourner leur impact sur le pays. Récemment, les services de renseignement américains, des intérêts commerciaux et des suprémacistes blancs ont commencé à utiliser l'Afrique du Sud pour commercer et vendre des armes avec la Rhodésie. Bien que cela soit contraire à la politique officielle et flagrant, Washington a jusqu'à présent refusé de combler cette lacune, laissant entendre une approbation tacite."
 USA_Rhodesia.1.d:0 "À Washington, on croit de plus en plus que les nombreux mouvements indépendantistes de gauche opérant en Afrique sont des façades communistes. Ces groupes tentent de se présenter comme des combattants de la liberté, mais ils ne font que préparer le terrain pour l'avenir lorsqu'ils se transformeront en États communistes totalitaires. Des nations comme la Rhodésie, autrefois vilipendées pour leur fermeté face à ces groupes, sont aujourd'hui présentées comme un bastion anticommuniste en Afrique. Les partisans de la Rhodésie font pression sur la Maison Blanche pour qu'elle ignore la propagande communiste et reconnaisse la Rhodésie. Ils souhaitent que la Rhodésie reçoive le soutien nécessaire pour poursuivre sa résistance au communisme. Lorsqu'on les presse d'intervenir sur la politique raciale rhodésienne, ces défenseurs affirment souvent qu'il s'agit d'une affaire interne aux Rhodésiens, mais qu'elle peut être modifiée avec le temps avec l'aide des États-Unis."
 SOVUSA.1.d:0 "Les États-Unis, par l'intermédiaire d'un émissaire secret, ont proposé de rejoindre l'Union soviétique et de vaincre la RPC. Les Américains affirment que le gouvernement chinois s'est révélé imprévisible, violent et source de troubles dans le monde entier. Malgré leurs effectifs et leurs ressources considérables, une action conjointe devrait être couronnée de succès. Certains hauts dirigeants du parti souhaitent accepter la proposition, affirmant que la puissance navale et aérienne américaine, en particulier, pourrait assurer une victoire rapide sur Pékin. D'autres craignent que l'implication des États-Unis ne limite nos options d'après-guerre, car les Américains insisteront pour que leur régime fantoche à Taïwan prenne le pouvoir après la guerre. Un tel scénario pourrait être dévastateur pour nos intérêts en Asie."
 SOVUSA.2.d:0 "Nous avons récemment proposé à l'URSS d'unir nos forces pour vaincre la RPC. Le régime communiste de Pékin menace depuis longtemps nos intérêts dans la région et, plus important encore, soutenir un régime communiste pour en détruire un autre ne servirait que nos intérêts. Cependant, l'Union soviétique nous a fait savoir qu'elle ne pouvait accepter notre proposition. Bien qu'elle n'ait pas donné de raisons, il semble que cela soit probablement dû à ses craintes que l'implication américaine ne limite ses options d'après-guerre et qu'elle ne souhaitait peut-être pas une collaboration étroite de ses armées avec les nôtres. C'est un résultat décevant, mais prévisible compte tenu des ambitions démesurées du communisme mondial."
 SOVUSA.3.d:0 "Nous avons récemment proposé à l'URSS d'unir nos forces pour vaincre la RPC. Le régime communiste de Pékin menace depuis longtemps nos intérêts dans la région et, plus important encore, soutenir un régime communiste pour en détruire un autre ne ferait que servir nos intérêts. Après avoir examiné les propositions, les Soviétiques ont répondu qu'ils les acceptaient. La nouvelle a été accueillie avec enthousiasme à la Maison Blanche, qui a rapidement ordonné au Pentagone de préparer le déploiement de troupes et de moyens. De hauts responsables du cabinet ont déjà pris contact avec leurs homologues soviétiques, ainsi qu'avec des hauts gradés de l'armée. Des traducteurs russes d'autres ministères sont transférés au Pentagone pour contribuer à cet effort. L'Amérique a atteint son objectif et se réjouit de punir la RPC et de faire valoir ses intérêts en Asie."
 SOVUSA.4.d:0 "À la grande surprise de leurs populations respectives, les États-Unis et l'Union soviétique ont annoncé le lancement d'actions militaires contre la Chine. Les deux pays ont évoqué la brutalité du gouvernement de Pékin et son implication dans les troubles mondiaux. Des informations ont déjà circulé concernant le franchissement de la frontière par des forces terrestres soviétiques, et des rumeurs d'attaques américaines circulent. L'étendue de la coopération militaire entre les deux pays est inconnue, bien que les deux parties communiquent étroitement. Certains suggèrent que ces contacts visent à garantir qu'aucun des deux camps ne prenne l'autre pour cible accidentellement. À Pékin, le gouvernement s'est montré provocateur, affirmant que la Chine était confrontée à une lutte nationale contre l'impérialisme. Mais contrairement aux luttes précédentes, la population est prête. Les forces chinoises se mobilisent et les manifestations pro-gouvernementales encouragent la résistance et le recrutement de volontaires. Alors que les trois États les plus puissants sont désormais en guerre, nombreux sont ceux à travers le monde qui craignent les conséquences d'un tel conflit."
 USA_COUP.1.d:0 "Le fondateur de l'Indonésie et dirigeant de longue date, le président Soekarno, a cédé le pouvoir au général Suharto. Il semble que l'armée indonésienne ait contraint Soekarno à abandonner le pouvoir à la suite d'une série d'assassinats de dirigeants militaires indonésiens par un mystérieux nouveau groupe militant communiste. Ces derniers ont tenté de forcer Soekarno à approuver leurs actions, mais il a refusé. Face à la répression militaire contre les militants radicaux, Soekarno a été destitué. Soeharto a qualifié l'attaque des militants de tentative de coup d'État communiste et a ordonné une répression contre le parti communiste indonésien. Cette répression semble violente, avec des rapports faisant état de meurtres et de violents combats entre unités militaires et communistes. Le gouvernement arrête également des milliers de communistes présumés à travers le pays. Il semble que le nouveau gouvernement militaire indonésien s'attache à éliminer le communisme de la vie politique. Les États-Unis offrent une aide militaire et des services de renseignement pour soutenir le gouvernement dans sa campagne anticommuniste."
 latam_coup.1.d:0 "Après des mois de troubles sociaux, notamment entre le président et les mineurs, l'armée bolivienne est intervenue et a renversé le gouvernement. Le vice-président, René Barrientos, a mené l'opération et a pris le pouvoir avec le soutien de l'armée. Nombreux sont ceux en Bolivie qui suggèrent que le coup d'État a eu lieu avec le soutien des États-Unis. Ceux qui croient à cette théorie soulignent que les États-Unis ont des intérêts économiques dans le pays et étaient de plus en plus préoccupés par les troubles politiques. Dans ce contexte, les États-Unis craignaient un soulèvement ou un basculement politique vers le communisme et ont encouragé le coup d'État militaire. Le gouvernement américain, pour sa part, a accueilli le nouveau régime comme une force stabilisatrice et a ignoré les questions sur une éventuelle implication dans le coup d'État."
 CIA_60s.3.d:0 "Le mandat tumultueux du président Julio Arosemena Monroy à la présidence de l'Équateur s'est achevé par un coup d'État militaire. La nouvelle junte militaire a déclaré son opposition au communisme et à sa récente expansion en Amérique latine. Les opposants au coup d'État et les gauchistes sont détenus et la junte promet d'engager des réformes visant à atténuer les problèmes économiques et politiques qui frappent actuellement l'Équateur. Le président Monroy avait lancé des réformes, mais s'est attiré des ennuis avec l'armée et le pouvoir législatif en faisant ouvertement l'éloge des mouvements de gauche. Il a récemment commencé à critiquer la politique régionale des États-Unis et a insulté son ambassadeur. Nombreux sont ceux qui pensent que ces dernières actions ont poussé les Américains à approuver discrètement l'intervention militaire."
 Paris_Peace.1.d:0 "Les accords de paix de Paris ont été signés entre les États-Unis, le Nord-Vietnam, le Sud-Vietnam et les forces rebelles du Sud-Vietnam. Les États-Unis ont rapidement qualifié cet accord de paix durable pour tous les habitants de la région. Ils ont accepté de retirer toutes leurs forces du Vietnam, du Cambodge et du Laos, et de lever le blocus imposé au Nord-Vietnam. Le Nord-Vietnam libérera ses prisonniers américains et s'engagera à ne plus envoyer de troupes ni d'armes aux rebelles du Sud-Vietnam. Les Nord-Vietnamiens et leurs alliés sont autorisés à rester sur leurs territoires au Sud-Vietnam, où ils établiront des lignes de cessez-le-feu avec le gouvernement de Saïgon. La réaction du Sud-Vietnam au traité a été très négative, beaucoup jugeant inacceptable l'entrée d'infiltrations nord-vietnamiennes au Sud et accusant les États-Unis d'avoir contraint le gouvernement à accepter ses conditions afin de faciliter leur retrait de la région."
 Camp_David.1.d:0 "Après près de deux semaines d'intenses négociations, les dirigeants égyptien et israélien ont signé un traité de paix global à la Maison Blanche. Le gouvernement américain a été le fer de lance de cette initiative récente, suite au récent dégel des relations égypto-israéliennes. Ces négociations, qui ont duré deux semaines, se sont déroulées lors de la résidence présidentielle de Camp David. Deux documents ont été signés par les deux dirigeants. L'un offrait un cadre pour la paix régionale, appelant à la création d'une zone palestinienne autonome en Cisjordanie et à Gaza. L'autre document, beaucoup plus complet, a mis fin à des décennies de tensions entre l'Égypte et Israël. Le Sinaï sera restitué à l'Égypte en échange de garanties de sécurité, de la reconnaissance d'Israël et de la normalisation des relations diplomatiques. Malgré les éloges de la communauté internationale, les États arabes et les Palestiniens ont réagi avec colère. Ils ont accusé l'Égypte de trahir l'unité arabe et ont particulièrement critiqué le premier document, car il a été rédigé sans consultation des autres États arabes de la région ni des Palestiniens."
 Vietnam_War_2.1.d:0 "Les États-Unis ont signé les Accords de Paris avec la ferme intention de les respecter jusqu'au bout et de s'engager dans un esprit de paix avec toutes les factions. Cependant, il est clair que les Nord-Vietnamiens et leurs alliés ont abusé de notre honneur et ne respectent pas les accords. De ce fait, les États-Unis ont décidé de lancer de nouvelles opérations militaires. Tant que les communistes continueront de subvertir le peuple innocent du Sud-Vietnam, les États-Unis ne pourront rester les bras croisés. Le peuple américain ne soutiendra peut-être pas pleinement nos actions, mais l'Amérique a une obligation et un devoir envers le peuple vietnamien. Nous ne nous arrêterons pas tant que les communistes ne mettront pas fin à leur agression insensée."
 SEATO.4.d:0 "Suite aux récents succès remportés sur le champ de bataille contre les forces communistes, le siège de l'OTASE a annoncé l'élargissement de son effectif. L'OTASE est née dans les années 1950 en tant qu'organisation régionale destinée à faciliter les liens culturels, commerciaux et militaires entre les nations soucieuses d'empêcher la propagation du communisme dans la région. Les pays impliqués dans le conflit indochinois se sont largement tenus à l'écart, leurs propres accords internationaux les empêchant d'y adhérer. Cependant, plusieurs d'entre eux ont adhéré en tant qu'observateurs. Ces États observateurs ont maintenant annoncé leur intention de rejoindre l'organisation, les États-Unis s'étant engagés à la renforcer et promettant que l'OTASE serait l'avant-garde des forces anticommunistes dans la région."
 SEATO.5.d:0 "L'OTASE est née dans les années 1950 en tant qu'organisation régionale destinée à faciliter les liens culturels, commerciaux et militaires entre les nations soucieuses d'empêcher la propagation du communisme dans la région. Ces dernières années, l'organisation a connu un déclin, certains membres refusant de s'impliquer au Vietnam et n'ayant pas réussi à attirer de nombreux pays d'Asie du Sud-Est. Face à la détérioration de la situation au Vietnam et à la diminution de l'implication américaine, il a été décidé de dissoudre officiellement le groupe, car il n'avait plus de raison d'être. Bien que l'OTASE n'ait pas atteint son potentiel militaire et ne soit plus opérationnelle, les liens régionaux qu'elle a favorisés constitueront l'héritage durable de l'organisation."
 US_Taiwan.10.d:0 "Suite au récent dégel des relations entre les États-Unis et la RPC, le gouvernement américain a annoncé la suspension immédiate de toute aide à Taïwan. Il invoque l'évolution de la situation régionale et sa volonté de ne pas contribuer à l'exacerbation des tensions dans la région. Il est significatif que l'Amérique considère désormais le conflit taïwanais comme une affaire interne devant être réglée par les deux gouvernements. Cette annonce a déjà suscité la colère du Congrès et l'indignation des médias américains, nombreux étant ceux qui qualifient cette décision de trahison envers un allié fidèle et anticommuniste. Cependant, le gouvernement américain insiste sur le fait que cette décision est dans l'intérêt du pays et non dans le but d'apaiser un État étranger."
 USA_Afghanistan.1.d:0 "Les États-Unis condamnent fermement les récentes actions militaires menées par l'Union soviétique en Afghanistan. Ils qualifient l'invasion soviétique d'illégale, de violation du peuple afghan et d'atteinte à la paix mondiale. À Washington, l'ambassadeur soviétique a été convoqué à la Maison-Blanche où il a reçu une protestation officielle. La réponse ferme des États-Unis était attendue, mais on ignore actuellement si elle entraînera une quelconque implication dans le conflit en cours. Le secrétaire d'État a déjà appelé ses homologues de la région, qui ont également exprimé leur inquiétude face à l'action soviétique. Le gouvernement soviétique a réagi en déclarant avoir agi dans l'intérêt du peuple afghan et à l'invitation de son gouvernement."
 Grain_Embargo.1.d:0 "Dans une escalade de la riposte américaine à l'invasion de l'Afghanistan, les États-Unis ont annoncé un embargo sur toutes les exportations de céréales vers l'Union soviétique. Ils espèrent que cet embargo entraînera des pénuries en Union soviétique, poussant ainsi la population à forcer le gouvernement à cesser ses opérations. Bien que cette décision soit saluée partout aux États-Unis, de nombreux experts estiment que les Soviétiques parviendront à trouver d'autres sources d'approvisionnement et à en atténuer les effets. Le gouvernement américain affirme que cette décision s'inscrit dans le cadre d'une campagne diplomatique multiforme visant à contraindre les Soviétiques à mettre fin à leur intervention en Afghanistan."
 US_Olympics.1.d:0 "Dans le cadre de leur démarche multiforme de protestation et de contestation diplomatique contre l'invasion soviétique de l'Afghanistan, les États-Unis ont annoncé leur boycott des Jeux olympiques de 1980, qui se tiendront à Moscou. De plus, les États-Unis ont appelé tous leurs alliés et les nations favorables à la paix mondiale à se joindre à eux dans ce boycott. Presque immédiatement, plusieurs États ont manifesté leur intérêt à soutenir cette initiative. L'idée de boycotter les Jeux est née de dissidents soviétiques, qui estimaient qu'une telle action témoignerait de la détermination mondiale contre l'agression soviétique. Bien que cette initiative ait initialement reçu un soutien international et national, nombreux sont ceux qui, dans le pays, estiment que le sport devrait être séparé de la politique. Par ailleurs, des diplomates de certains pays ont confié en privé aux médias qu'ils estimaient qu'une telle initiative serait un geste creux et qu'ils n'envisageaient pas de se joindre au boycott."
 Sandinista.1.d:0 "Le gouvernement américain a publiquement dénoncé les sandinistes du Nicaragua pour leurs tactiques brutales et leurs exactions contre le peuple nicaraguayen. Les États-Unis ont souligné que l'Amérique centrale intéresse depuis longtemps le pays et que les Américains cherchent depuis des années à aider son peuple. Les sandinistes représentent une menace existentielle pour le peuple nicaraguayen et ses valeurs. La ferme condamnation des États-Unis a fait craindre une plus grande implication américaine au Nicaragua, bien que les forces anti-sandinistes du pays se soient réjouies de cette annonce. En réponse, les sandinistes ont déclaré qu'ils se battaient pour les paysans et les travailleurs du Nicaragua et qu'ils ne céderaient pas aux pressions impérialistes."
 Khomenei_Assasinated.1.d:0 "Dans une escalade de la répression brutale menée par le Shah d'Iran contre les dissidents du pays, l'ayatollah Ruhollah Khomeini a été assassiné. Ce critique de longue date du Shah avait fui le pays des années auparavant et était devenu un symbole de l'opposition au Shah. Les détails de l'assassinat restent flous, mais la responsabilité est déjà imputée au Shah et à sa police secrète, la SAVAK. La mort de Khomeini portera un coup dur à l'opposition. Des vagues de protestations de dissidents iraniens et de partisans de Khomeini se multiplient déjà en Europe, en Iran et dans les pays voisins. La responsabilité du Shah s'est étendue à son allié, les États-Unis, beaucoup pensant que la SAVAK a agi de concert avec la CIA. Le gouvernement américain est resté jusqu'à présent silencieux sur cette information, même si beaucoup pensent que la récente répression contre les dissidents n'a eu lieu qu'avec la bénédiction des États-Unis."
 Oil_Embargo.79.d:0 "La production pétrolière iranienne a fortement diminué suite aux troubles qui continuent de secouer le pays. À cette pression s'ajoutent les grèves incessantes qui frappent les industries pétrolières iraniennes. Cela a provoqué une panique mondiale concernant l'approvisionnement énergétique. À cette incertitude s'ajoute l'annonce récente du gouvernement américain d'un embarquement sur le pétrole iranien pour une durée indéterminée, en raison de son mépris persistant des normes internationales et de son hostilité envers les États-Unis. Le président a souligné que ces mesures puniraient l'Iran et que des dispositions avaient été prises pour en atténuer les effets sur les États-Unis. Cependant, cette annonce a alimenté la panique des consommateurs, ce qui nuit à la croissance économique et fait grimper les prix du pétrole. Le gouvernement iranien a qualifié cette dernière annonce de geste creux de la part des États-Unis."
 USA_Rhodesia.3.d:0 "Dans une décision controversée, le gouvernement américain a annoncé sa reconnaissance de l'indépendance de la Rhodésie. Comme de nombreux autres pays, les États-Unis avaient auparavant refusé de reconnaître la Rhodésie en raison de ses politiques raciales et de sa déclaration unilatérale d'indépendance vis-à-vis de son allié, la Grande-Bretagne. Cependant, la montée du communisme en Afrique a conduit les décideurs politiques américains à une nouvelle évaluation. Ils estiment que soutenir des régimes anticommunistes efficaces sur le continent sera le moyen le plus efficace de mettre fin au communisme. La Rhodésie, en particulier, a résisté avec une efficacité exceptionnelle aux armées de guérilla de gauche, malgré un accès limité à l'aide et aux armes occidentales. Les lois raciales controversées rhodésiennes doivent désormais être ignorées et traitées comme une affaire intérieure de la Rhodésie. Cependant, cette annonce a provoqué de vives protestations aux États-Unis et à l'étranger. Nombreux sont ceux qui condamnent ces politiques raciales et considèrent les rebelles comme des combattants de la liberté, et non comme des communistes. L'ampleur du soutien américain à la Rhodésie est encore inconnue."
 USA_Portugal.1.d:0 "Dans le cadre d'un nouveau virage de la politique américaine envers l'Afrique, les États-Unis se sont engagés à tout mettre en œuvre pour préserver la position portugaise en Afrique. De nombreux décideurs politiques américains considèrent désormais le nombre croissant de guérillas de gauche luttant pour l'indépendance comme des forces communistes résolues à imposer le communisme sur le continent. Perdre ces régions, ces populations et ces ressources au profit du monde communiste pourrait potentiellement affaiblir la position américaine sur la scène internationale. Les Portugais et leurs alliés comptent parmi les forces les plus efficaces sur le terrain pour lutter contre ces groupes, ce qui a conduit les États-Unis à les soutenir et à modifier leur position sur la décolonisation en Afrique. Ce nouveau virage politique suscite des réactions négatives aux niveaux national et international. Nombreux sont ceux qui y voient un soutien actif à la décolonisation et une approbation de la discrimination raciale, ce qui finira par isoler l'Amérique sur la scène internationale."
 IHC.1.d:0 "Dans une escalade sans précédent, des centaines d'étudiants iraniens ont pris le contrôle de l'ambassade des États-Unis à Téhéran. Après une brève lutte, l'ambassadeur s'est rendu. Le personnel de l'ambassade et les marines ont eu les yeux bandés et ont été exhibés devant les caméras des médias. L'ayatollah Ruhollah Khomeini a approuvé la prise de contrôle et les otages sont détenus par ses partisans. Les États-Unis et de nombreux autres États ont rapidement condamné cette violation du droit international. Jusqu'à présent, les preneurs d'otages exigent le retour du Shah d'Iran des États-Unis, où il a demandé l'asile et suit un traitement médical. Ils ont également saisi des documents de l'ambassade qu'ils prévoient de rendre publics afin de démontrer l'implication américaine dans les crimes du Shah."
 IHC.5.d:0 "Alors que nous examinons nos options pour affronter l'Iran, il a été décidé que les futures opérations militaires se dérouleraient uniquement avec l'aide de l'OTAN. Au siège de l'OTAN, les Américains ont activé l'article 5, déclarant que l'attaque contre leur ambassade constituait une attaque contre leur territoire souverain. De nombreux membres de l'OTAN ont exprimé leur soutien aux États-Unis en cette période difficile. À Washington, un large consensus existe : si l'Amérique doit agir, elle doit le faire avec ses plus proches alliés. Si l'OTAN ne peut intervenir, cela signifierait que l'ensemble du dispositif de sécurité américain est en faillite. Si l'Amérique entre en guerre, elle y participera avec ou sans le soutien de ses plus proches alliés."
 IHC.10.d:0 "Les États-Unis ont annoncé le retrait de leurs forces des bases de la région afin de neutraliser rapidement le gouvernement iranien. Le président américain a informé le peuple américain que la cause était juste et que laisser l'Iran impuni après avoir ignoré l'ultimatum affaiblirait le pays et amènerait les alliés des États-Unis à remettre en question la conviction américaine. Le président a invoqué les violations du droit international et les atteintes aux droits de l'homme pour justifier une action militaire. L'Amérique promet de rétablir un gouvernement juste et digne pour le peuple iranien. Bien que l'invasion semble se dérouler comme prévu jusqu'à présent, la taille de l'Iran et sa population font craindre qu'une forte présence américaine ne provoque des troubles et des difficultés majeurs. Des militants iraniens opposés au nouveau régime coopéreraient avec les services de renseignement américains pour faciliter l'invasion."
 IHC.15.d:0 "Alors que les négociations sur la prise d'otages piétinent en raison des exigences excessives de l'Iran et de son manque de marge de manœuvre, le président a été approché pour une solution militaire à la crise. Les forces spéciales et les services de renseignement américains affirment savoir que les otages sont toujours détenus à l'ambassade et proposent une opération de sauvetage chirurgicale, sans agression militaire de grande envergure contre l'Iran. Le plan prévoit l'installation par les forces américaines d'un aérodrome en Iran comme base de transit. Une fois celui-ci établi, près d'une centaine de soldats des forces spéciales arriveront et lanceront un assaut aérien contre l'ambassade. Une fois les otages libérés, ils seront évacués d'Iran avec nos forces. Malgré la complexité de l'opération, l'armée semble confiante et affirme qu'elle ne risque pas de provoquer un conflit plus large."
 IHC.16.d:0 "Le peuple américain a été ravi d'apprendre la libération réussie des otages américains en Iran. Malgré quelques problèmes mineurs de carburant, l'opération américaine de deux nuits a permis d'établir une base aérienne en Iran, d'où les forces spéciales américaines ont décollé en hélicoptère pour attaquer l'ambassade et libérer les otages. L'assaut s'est déroulé comme prévu, la résistance iranienne étant bien plus faible que prévu, et il semble que les Américains ignoraient totalement la possibilité d'une telle opération. On ne connaît aucune victime, mais la nouvelle est encore prématurée. L'erreur iranienne a été de maintenir les otages ensemble, ce qui a rendu l'opération possible. Les tentatives militaires iraniennes d'intercepter les assaillants ont échoué, l'aérodrome américain temporaire étant vide depuis longtemps lorsqu'ils les ont rejoints. Cette opération est une immense victoire pour les forces spéciales américaines et démontre que l'Amérique ne tolérera aucun chantage de la part d'un État ou d'une organisation, où qu'ils se trouvent."
 IHC.17.d:0 "La Maison Blanche a annoncé l'échec d'une tentative de libération des otages américains détenus en Iran. Bien que les détails restent à déterminer, il semble que des militaires américains aient perdu la vie, tandis que les otages sont indemnes. La mission avait été annulée après la catastrophe de la phase initiale de l'opération. Bien que la piste d'atterrissage ait été établie en Iran, des problèmes de carburant et des conditions météorologiques défavorables ont entraîné le crash d'au moins un avion de transport et d'un hélicoptère. Les forces restantes ont été évacuées dans la précipitation et plusieurs avions ont été abandonnés. Aucun membre du personnel n'a été perdu au combat ennemi et l'Iran qualifie déjà cet échec de signe divin. Le peuple américain serait découragé par cette nouvelle et le moral des militaires en aurait pris un coup. En Iran, les otages sont actuellement dispersés à travers le pays afin d'éviter qu'une telle tentative ne se reproduise."
 IHC.20.d:0 "Le peuple américain suit de près l'évolution de la situation depuis que des foules d'étudiants iraniens ont pris en otage le personnel de l'ambassade américaine à Téhéran. Après une longue épreuve, le gouvernement iranien a officiellement libéré les otages, les autorisant à quitter le pays par avion. Après plusieurs escales en cours de route pour permettre au personnel médical militaire de vérifier leur état de santé, les Américains libérés ont atterri sur un aérodrome militaire de New York. Les anciens otages ont ensuite été conduits en bus à l'hôtel Thayer de l'Académie militaire américaine de West Point. Tout au long du trajet, une foule d'Américains les a acclamés. Trois jours plus tard, ils seront conduits à New York pour un défilé de rue. Les familles des anciens otages jubilent de retrouver leurs proches. Pour le gouvernement américain, c'est une satisfaction et un soulagement que la situation soit enfin résolue et que les otages soient revenus sains et saufs."
 IHC.2.d:0 "L'Iran a officiellement ouvert des négociations avec les États-Unis concernant les otages de l'ambassade américaine. Par l'intermédiaire du Panama, ils ont officiellement demandé le retour du Shah pour répondre de ses crimes contre le peuple iranien. Le gouvernement américain a refusé pour des raisons humanitaires, invoquant son état de santé fragile et la poursuite de ses traitements médicaux. Les Iraniens sont priés de présenter des excuses américaines pour leurs précédentes ingérences dans les affaires intérieures iraniennes et de débloquer les fonds publics iraniens détenus par les États-Unis. Pour les Américains, bien que la libération du Shah ne soit pas à l'ordre du jour, ils sont prêts à négocier davantage sur d'autres demandes, notamment la création éventuelle d'une commission d'enquête sur l'implication américaine dans les affaires iraniennes. Cependant, les preneurs d'otages semblent très déterminés et il est peu probable que le gouvernement iranien parvienne à faire un compromis sur leurs demandes."
 IHC.3.d:0 "La récente provocation iranienne et la prise d'otages à l'ambassade des États-Unis ont indigné le peuple américain. En conséquence, le gouvernement américain a décidé de ne pas récompenser une violation aussi flagrante du droit international et de la souveraineté américaine. Il a exclu toute négociation avec l'Iran et a lancé un ultimatum exigeant la libération inconditionnelle des otages. En réponse, les étudiants iraniens qui détiennent l'otage ont réagi avec une ferme défiance. On ignore cependant si le gouvernement respectera la date butoir. De nombreux Américains saluent la fermeté du gouvernement, même si beaucoup mettent en garde contre une telle agressivité qui pourrait exposer les otages à des risques bien plus importants."
 IHC.4.d:0 "Le gouvernement américain a récemment soumis une proposition à notre gouvernement. Il nous a demandé d'adhérer à un pacte anti-iranien et de l'aider à renverser le nouveau régime de Téhéran. En échange, il a proposé de retirer tout soutien à l'opposition afghane qui combat nos forces en Afghanistan. Certains de nos conseillers suggèrent que cette offre pourrait être fructueuse. Mettre fin à la résistance afghane constituerait un avantage considérable, et la nature théocratique du nouveau régime pourrait constituer une menace pour notre propre population musulmane. D'autres conseillers, cependant, soulignent que le nouveau régime semble jusqu'à présent rechercher des relations cordiales et que le régime précédent a longtemps été une source de tensions pour nous. Remplacer le régime actuel par un autre régime pro-américain pourrait finir par représenter une menace plus grande pour nos intérêts que l'opposition afghane ne pourrait jamais l'espérer. Nous devons examiner attentivement cette proposition américaine."
 VFX.1.d:0 "Le concept de VFX, notre expérimentation sur les chasseurs de la Marine, a vu le jour en 1968, lorsque Grumman a soumis une proposition d'avion spontanée. Intéressé par cette proposition, le chef des opérations navales a recommandé une étude de faisabilité du VFX. L'étude a conclu à la faisabilité du nouveau chasseur et la Marine a alors lancé la définition du contrat. Cinq entreprises ont soumis leurs projets, dont Grumman, General Dynamics, Vought, McDonnell Douglas et North American Rockwell. Quelle époque passionnante pour un concepteur d'avions ! Nous choisirons deux finalistes parmi lesquels nous ferons notre choix. Nous souhaitons un avion avec un équipage de deux personnes, équipé d'un puissant radar de contrôle d'armes embarqué, capable de mener des combats aériens à longue portée (plus de 160 km), un intercepteur bimoteur et une vitesse maximale de Mach 2,2. Il devrait également être équipé d'un moteur Vulcan M61 et pouvoir emporter six AIM-54 ou six AIM-7 et quatre AIM-9."
 VFX.2.d:0 "Après de nombreux projets intéressants proposés par de nombreuses entreprises, nous avons retenu deux constructeurs : soit le contrat est attribué à McDonnell Douglas, célèbre créateur du F-4 Phantom, un avion extrêmement fiable que nous avons utilisé pendant la guerre du Vietnam, soit à Grumman, avec son modèle révolutionnaire 303. La Marine a exercé des pressions pour que McDonnell Douglas soit choisi, car il existe un certain parti pris en leur faveur en matière d'aéronavale. Grumman n'est pas réputé pour la fabrication de chasseurs à réaction de qualité, et encore moins d'intercepteurs, depuis le F9F Panther et sa version améliorée, le Cougar."
 VFX.3.d:0 "Nous avons choisi Grumman pour le concours d'effets spéciaux et lui confierons la production de notre nouvel intercepteur, le F-14. Le travail de Grumman sur le concours d'effets spéciaux a débuté par l'étude du concept « 303 ». Malgré son implication dans l'échec du F-111B du concours TFX, Grumman a mis à profit son expérience en construction aéronautique pour créer le modèle qui a finalement remporté le concours. Le modèle 303 était disponible en plusieurs versions, à voilure fixe et à voilure tournante. L'avion est équipé de deux turboréacteurs à postcombustion General Electric, atteint Mach 2,34, peut emporter une charge utile d'armes air-air exceptionnelle et répond à tous nos critères."
 VFX.4.d:0 "Nous avons choisi McDonnell Douglas pour le contrat de notre nouvel intercepteur, le F-14. McDonnell Douglas a proposé le concept d'effets visuels probablement le plus ambitieux. Comme trois des quatre autres, sa proposition comportait des ailes à géométrie variable. Elle intégrait également des ailerons canards et un empennage double. Les ailes étaient montées bas sur l'appareil, tandis que les moteurs dominaient le fuselage. Plutôt carré et peu aérodynamique, ce fuselage offrait un large espace pour le montage de missiles. Cette proposition ambitieuse a été plébiscitée grâce à la bonne maniabilité attendue des ailerons canards et des empennages doubles. Ce concept était l'un des deux finalistes sélectionnés pour un développement ultérieur, et au final, McDonnell Douglas l'a emporté sur Grumman."
 usanews.2.d:0 "Après le World Trade Center récemment achevé à New York, la Sears Tower, le plus haut gratte-ciel du monde, a été inaugurée dans le centre-ville de Chicago. Fruit de l'imagination de l'architecte Bruce Graham et de l'ingénieur en structures Fazlur Rahman Khan, cette structure intègre un design nouveau et révolutionnaire composé de neuf bâtiments carrés, ou « tubes », regroupés dans un carré de 3 x 3 cm de circonférence. Les neuf tubes qui composent la structure s'élèveraient jusqu'au 50e étage, où les tubes nord-ouest et sud-ouest atteindraient un plateau, les tubes nord-est et sud-est s'arrêteraient au 66e étage, les tubes nord, est et sud au 90e étage, et les tubes ouest et central se termineraient au 108e étage, pulvérisant ainsi le record du monde du World Trade Center, qui culminait à 448 mètres. Étonnamment en avance sur leur temps dans l'ère actuelle du génie civil, les États-Unis et l'équipe de Graham et Khan ont reçu de nombreux éloges internationaux, Khan en particulier étant loué pour sa mise en œuvre ingénieuse de sa « conception tubulaire », recevant de nombreuses commandes pour sa mise en œuvre à l'étranger."
 power_pack.1.d:0 "Les États-Unis sont intervenus dans la guerre civile dominicaine. Au moins trois brigades de troupes de combat, appuyées par des éléments aéroportés, ont débarqué aux premières heures de la matinée à la base aérienne de San Isidro. Elles ont rapidement progressé jusqu'à Saint-Domingue, où l'armée américaine a confirmé avoir établi avec succès une zone de sécurité internationale couvrant les ambassades et leurs environs pour l'Organisation des États américains (OEA). Les Américains affirment que cette intervention était nécessaire pour faciliter l'évacuation des ressortissants étrangers et protéger le processus de paix de l'OEA dans le pays. De nombreux Dominicains sont indignés par ce qu'ils considèrent comme une intervention étrangère, nombre d'entre eux soulignant que l'opération américaine a renforcé la faction loyaliste et repoussé l'avancée des forces rebelles constitutionnalistes dans la région. Des manifestations antiaméricaines se sont produites dans toute la région, beaucoup dénonçant un retour à la diplomatie de la canonnière du début du XXe siècle."
 Woodstock.1.d:0 "Le festival Aquarian Exposition : 3 jours de paix et de musique s'est récemment terminé. 400 000 hippies se sont rassemblés dans une ferme laitière située au sud-ouest de Woodstock, dans l'État de New York. Malgré des pluies sporadiques, trente-deux artistes se sont produits. Bien que largement ignoré par les médias grand public, l'événement est perçu comme un événement marquant pour le mouvement contre-culturel naissant. On a pu observer les participants s'adonner aux drogues psychédéliques, au cannabis et à l'amour libre. La nouvelle de ce qui s'est passé à Woodstock, comme on appelle communément l'événement, se répand dans les cercles hippies du pays. Hippies et personnes intéressées par la contre-culture planifient déjà de nouveaux événements pour diffuser l'esprit de Woodstock dans le reste du pays."
 swf.3.d:0 "Le président Truman est décédé lors d'une opération chirurgicale à l'hôpital général Walter Reed après une fusillade à Blair House. Il séjournait à Blair House en raison des travaux de rénovation de la Maison Blanche. Deux hommes armés ont été aperçus entrant dans le bâtiment après une fusillade. Le président Truman et ses agents ont tenté de s'échapper, mais se sont heurtés aux deux hommes armés. Trois officiers et trois agents ont été tués et plusieurs autres blessés. Le président Truman a été blessé par balle et transporté à l'hôpital, mais il est décédé lors de l'opération. L'un des hommes armés a été tué dans la fusillade et l'autre a été capturé. L'homme tué a été identifié comme Griselio Torresola. L'autre homme armé a été capturé et identifié comme Oscar Collazo. Le mobile de cette tentative d'assassinat était que ces hommes armés étaient des nationalistes portoricains qui souhaitaient libérer Porto Rico de l'impérialisme américain et voulaient marquer un point en tuant le président américain. La nation est en deuil aujourd'hui. Le vice-président Alben W. Barkley a prêté serment et est devenu le 34e président des États-Unis d'Amérique."
 swf.2.d:0 "Le président Truman était à Blair House pendant la rénovation de la Maison Blanche. Deux hommes armés sont arrivés et ont ouvert le feu. Un policier a été tué dans la fusillade et plusieurs autres ont été blessés. Le président Truman va bien et n'a pas été blessé. L'un des hommes armés a été tué dans les affrontements. Il a été identifié comme Griselio Torresola. L'autre homme armé a été capturé et identifié comme étant Oscar Collazo. Le mobile de cette tentative d'assassinat était que ces hommes armés étaient des nationalistes portoricains qui souhaitaient libérer Porto Rico de l'impérialisme américain et voulaient marquer un point en tuant le président des États-Unis. Heureusement, le président Truman va bien."
 Harriman.1.d:0 "Le président William Harriman a annoncé une nouvelle refonte de sa politique étrangère. Il a réitéré la nécessité de faire face à la menace communiste par l'endiguement et la sécurité collective. Dans sa déclaration, il a annoncé que des efforts seraient déployés pour consolider les alliés existants et nouer des contacts avec de nouveaux amis potentiels. Il a déclaré qu'une forte concentration sur l'endiguement exigeait que les États-Unis garantissent la puissance économique et militaire de leurs alliés de première ligne. Diplomate de carrière, de nombreux analystes ne sont pas surpris, car le président nourrit depuis longtemps des soupçons à l'égard de l'Union soviétique."
 Harriman.2.d:0 "La Maison Blanche a annoncé le lancement de sa nouvelle campagne Arts et Sciences. Développée par le président Harriman, cette campagne appelle à un investissement et une promotion accrus dans les arts et les sciences à travers le pays. Dans un communiqué, le président a souligné que les États-Unis prenaient du retard par rapport aux autres puissances mondiales, y compris celles d'États hostiles, dans ces domaines et que seul un regain d'intérêt, notamment auprès des jeunes, permettra aux États-Unis d'atteindre leur plein potentiel. Cette campagne bénéficiera non seulement d'encouragements et de publicité, mais aussi d'une augmentation des bourses d'études pour favoriser le développement des étudiants."
 Liberal_Republican.1.d:0 "Les Républicains Libéraux connaissent un regain de popularité aux États-Unis. Ils offrent une alternative progressiste aux appareils politiques démocrates traditionnels aux Américains réticents aux politiques sociales ou budgétaires conservatrices. Ce regain de popularité est porté par un regain de soutien des Républicains Libéraux au sein de leur base traditionnelle du Midwest et du Nord-Est. On rapporte également que dans d'autres États, davantage de Démocrates centristes et de Républicains conservateurs frustrés se tournent vers les candidats Républicains Libéraux. Cela reflète un attrait croissant de l'opinion publique américaine pour le centre politique, au détriment de la gauche ou de la droite."
 Dewey_Mafia.1.d:0 "Le président Thomas Dewey a salué les récentes inculpations annoncées par le FBI et d'autres forces de l'ordre visant les principales organisations mafieuses du pays. Ces poursuites interviennent quelques mois seulement après que le président a ordonné aux forces de l'ordre fédérales de se concentrer sur le démantèlement de l'ensemble du crime organisé dans le pays. Cette focalisation sur la mafia ne surprend personne, car le président s'est d'abord fait connaître en tant que procureur fédéral contre d'importants chefs de la mafia dans les années 1930. Bien que le président soit largement salué, certains craignent qu'il ne subisse de violentes représailles ou ne provoque un effondrement de l'ordre public si ces organisations sombrent dans des guerres de territoire, les chefs de la mafia étant écartés des rues. Malgré ces inquiétudes, le président a promis de poursuivre ses efforts."
 Dewey.10.d:0 "Les premiers succès du président Thomas Dewey ont redynamisé l'aile modérée du Parti républicain, souvent qualifiée d'« establishment de l'Est ». Ces dernières années, les républicains conservateurs ont accusé cette aile du parti de promouvoir des politiques sociales et économiques contraires à la Constitution et d'utiliser leur fortune pour manipuler le parti national et promouvoir leurs candidats. Les conservateurs affirmaient que leurs candidats étaient peu différenciés des démocrates et qu'ils n'étaient pas motivés à voter. Cependant, la victoire du président Dewey a contredit ces critiques. La base de l'establishment de l'Est, assiégée lors des récents cycles électoraux, semble désormais revitalisée et s'organise solidement derrière le président pour l'aider à mettre en œuvre son programme national."
 nixon_early.1.d:0 "Le président Richard Nixon a demandé aux agences fédérales et aux procureurs d'enquêter sur les activités du Ku Klux Klan. Il a qualifié d'intolérables et de défi direct à l'État les récentes informations faisant état de violences raciales et de groupes de membres du Ku Klux Klan ciblant les Afro-Américains. Il a notamment souligné l'agression d'un musicien noir sur scène en Alabama par des membres du Ku Klux Klan. Le président a déclaré que tous les Américains avaient le droit de croire ce qu'ils voulaient, mais que le recours à la violence et l'organisation de milices non autorisées étaient contraires aux normes sociales et devaient être réprimés. Le président n'a pas exclu le déploiement d'agents fédéraux sur le terrain pour affronter directement le Ku Klux Klan."
 Nixon_early.2.d:0 "Le président Richard Nixon a adressé un message au Congrès pour exprimer sa position concernant les affaires indiennes. Il a exprimé son opposition à la politique actuelle de suppression des droits des Amérindiens. Il a souligné que cette politique privait les Amérindiens de leur autonomie et imposait à ces communautés des lois impopulaires. Il s'opposait également à ce que le gouvernement fédéral exerce une telle autorité sur toute population du pays. Au lieu de cela, le président Nixon a appelé le Congrès à restaurer l'autodétermination des communautés amérindiennes et à leur permettre de se gouverner et de s'administrer elles-mêmes. La note demande au Congrès d'annuler une série de lois adoptées ces dernières décennies restreignant l'autonomie des Amérindiens. Malgré une certaine opposition de la part de certains dirigeants du Congrès, la note est déjà largement saluée par les communautés amérindiennes qui se plaignent depuis longtemps de leur manque d'indépendance et de leur assimilation forcée par le gouvernement américain."
 Stassen.10.d:0 "Le dynamique président Harold Stassen a continué de consolider sa domination politique sur le Parti républicain en faisant licencier des républicains conservateurs clés de différents postes, tant au gouvernement qu'à la direction du parti. Cela témoigne du déclin continu de l'aile conservatrice du parti, qui semblait récemment sur le point de supplanter les ailes modérée et libérale du Parti républicain. La victoire du président Stassen a renforcé ses partisans et lui a donné le capital politique nécessaire pour neutraliser la menace conservatrice. Le président semble prêt à mettre en œuvre sa vision pour le pays, avec le soutien étroit de son parti."
 Stassen.1.d:0 "Le président Harold Stassen a conclu la dernière étape d'une vaste campagne électorale auprès des communautés rurales agricoles pour consolider ses votes. Fils d'agriculteur du Minnesota, le président cherche à consolider et à élargir sa base électorale. Il a répondu aux inquiétudes concernant les excès du gouvernement en promettant de toujours mettre en œuvre un gouvernement de qualité, et non un gouvernement soutenant des politiques comme celles de l'opposition. Lors de ses passages de campagne, le président a vanté son bilan impeccable en tant que gouverneur et expliqué pourquoi il a bénéficié d'un soutien massif des agriculteurs, soulignant que ce qu'il a fait pour les agriculteurs du Minnesota, il le fera également pour les agriculteurs américains."
 Stassen.6.d:0 "Lors d'un vote serré, le Congrès a approuvé le projet de revenu universel de base défendu par le président Harold Stassen. Ce projet de loi fournira aux mères célibataires de deux enfants ou plus, au chômage, un revenu mensuel fixe. Le président a démontré avec succès que ce projet de loi réduirait la pauvreté et protégerait les plus vulnérables aux États-Unis. L'adoption de la loi est saluée par les journaux progressistes, qui estiment que le président Stassen a démontré son engagement dans la lutte contre la pauvreté. Des journaux plus conservateurs, en revanche, condamnent ouvertement la loi, affirmant qu'elle oblige les contribuables à financer et à encourager la délinquance et l'amoralité croissantes chez les jeunes. Quoi qu'il en soit, le président insiste sur le fait que ce projet de loi renforcera et bénéficiera à tous les Américains, en particulier aux enfants les plus vulnérables."
 Stassen.5.d:0 "Dans sa décision la plus audacieuse à ce jour, le président Harold Stassen a proposé un plan de revenu de base universel pour les mères célibataires au chômage aux États-Unis. Ce plan permettra de verser plus de cent dollars par mois aux mères célibataires de deux enfants ou plus, sans emploi. Le président a déclaré que son plan lutterait contre la pauvreté, soutiendrait les plus vulnérables et contribuerait à garantir à ces enfants une prise en charge de meilleure qualité. L'opposition devrait être farouche, tant au sein des deux partis que des partis. Certains qualifient cette proposition de dépense extravagante qui récompense les mauvaises décisions, tandis que d'autres craignent qu'elle n'encourage les comportements immoraux chez les jeunes femmes du pays. Le président ne se laisse pas décourager et mise une grande partie de son capital politique sur l'adoption du projet de loi."
 Stassen.7.d:0 "Lors d'un vote serré, le Congrès a rejeté le projet de revenu de base universel défendu par le président Harold Stassen. Ce projet aurait permis aux mères célibataires de deux enfants ou plus, au chômage, de bénéficier d'un revenu mensuel fixe. Le président a soutenu que ce projet de loi réduirait la pauvreté et protégerait les plus vulnérables aux États-Unis. Ce rejet est salué par les journaux conservateurs, qui estiment que le président Stassen a cherché à saper les principes fondamentaux de la fiscalité et de la morale américaine. Les journaux plus progressistes ont émis des réactions mitigées, certains félicitant le président pour ses efforts visant à faire adopter le projet de loi, tandis que d'autres affirment qu'il ne répond pas suffisamment aux enjeux. De son côté, le président a publié une déclaration exprimant sa déception. De nombreux analystes estiment qu'il aura besoin de temps pour reconstruire son soutien politique après cette défaite majeure."
 Martin.1.d:0 "Le président Edward Martin a officiellement lancé une nouvelle campagne visant à élargir le droit de vote des républicains dans les États du Sud. Il a rappelé que le Parti démocrate avait, ces dernières décennies, promulgué une série de lois étatiques et locales qui ont privé de leurs droits une grande partie de la population et ont ainsi consolidé son pouvoir politique dans ces États. Le président espère que sa campagne incitera davantage de Sudistes à s'inscrire sur les listes électorales et fera pression sur les autorités pour qu'elles mettent fin aux mesures restrictives. De nombreux journaux soulignent que le président cherche essentiellement à inscrire davantage d'Afro-Américains sur les listes électorales et à consolider l'adhésion des républicains aux droits civiques. Les journaux du Sud et certains journaux conservateurs critiquent l'ingérence du président dans les affaires des collectivités locales."
 Martin.5.d:0 "Dans une déclaration ferme, le président Edward Martin a ouvertement condamné les irrégularités électorales dans les États du Sud. Il a souligné que les décennies de domination démocrate dans ces États étaient en grande partie dues à une politique systématique des autorités étatiques et locales visant à ériger des frontières qui empêchent de nombreux Sudistes, en particulier les minorités et les populations les plus pauvres, de voter. Il a appelé à la suppression de ces obstacles au nom de la démocratie. Le président est de plus en plus salué par les groupes de défense des droits civiques, et de nombreux républicains le félicitent discrètement pour ses efforts visant à briser l'emprise démocrate dans le Sud. Certains pensent cependant que le président risque de s'aliéner une partie des éléments les plus conservateurs de la base républicaine."
 Halleck.1.d:0 "Le président Charles Halleck a rencontré les principaux dirigeants républicains et des membres du Congrès. À l'issue de cette rencontre, il a publié une liste de nouvelles nominations à des postes au sein de l'administration et du gouvernement. Cette liste laisse penser que le président Halleck est en train de constituer une coalition conservatrice au sein du Parti républicain. Cela témoigne d'un glissement du parti vers son aile conservatrice et pourrait marquer une nouvelle transition politique pour le pays. Ce changement a conduit de nombreux démocrates et certains républicains modérés à exprimer en privé leurs inquiétudes quant à la direction que prend le président."
 Halleck.10.d:0 "Dans un revirement radical, le président Charles Halleck a exprimé son rejet du consensus keynésien. Il a affirmé que les principes économiques établis par John Keynes dans les années 1930 n'étaient plus efficaces dans l'économie mondiale actuelle. Il a souligné l'échec de l'approche économique d'après-guerre en raison de l'inflation, des budgets trop lourds et de la dette nationale croissante. Le président Halleck a soutenu que le pays devait s'engager davantage dans le libre marché et retirer l'État de l'économie. L'adoption d'une économie conservatrice témoigne également de l'influence conservatrice sur le président et le Parti républicain."
 Halleck.9.d:0 "Le président Halleck a proposé des mesures législatives et budgétaires visant à renforcer et à protéger le dollar. Il a souligné que le dollar était menacé d'inflation et de dépréciation en raison des dépenses publiques. Il a suggéré que la Réserve fédérale concentre ses efforts sur la stabilité du dollar et la transparence afin de garantir sa sécurité budgétaire. Ces propositions indiquent que le président poursuivra sa quête d'une économie de marché plus conservatrice et plus libre aux États-Unis."
 MacArthur.1.d:0 "Le président Douglas MacArthur a appelé le Congrès à abroger la loi nationale sur les armes à feu. Adoptée initialement dans les années 1930, cette loi visait à réglementer l'acquisition de certaines armes à feu. Elle oblige les propriétaires d'armes à feu à s'enregistrer et à payer une taxe. Le président a souligné que cette loi visait à freiner la violence des gangs de l'époque de la prohibition, mais que la menace était depuis longtemps écartée. Il affirme que cette taxe et ces exigences ont rendu la possession d'armes à feu excessivement coûteuse et ont finalement porté préjudice aux fabricants américains. Plus grave encore, elles entravent considérablement l'exercice des droits garantis par le Deuxième Amendement. Le président estime qu'il est dans l'intérêt des Américains d'abroger cette loi et, plus important encore, qu'une plus grande disponibilité des armes à feu contribuera à la sécurité nationale des États-Unis."
 MacArthur.2.d:0 "Lors d'une récente conférence de presse, le président Douglas MacArthur a appelé à une augmentation drastique des prestations aux anciens combattants. Il a déclaré connaître de près les sacrifices et le dévouement des combattants américains. Il a ajouté qu'il était du devoir du peuple et du gouvernement américains de veiller à ce que ces hommes soient correctement pris en charge. Il a souligné que les cas de chômage des anciens combattants lui rappelaient les hommes de la Bonus Army de la Première Guerre mondiale. Il a déclaré que le gouvernement devait agir maintenant pour éviter qu'un événement similaire ne se reproduise, où des soldats américains seraient appelés à intervenir contre des anciens combattants désespérés, incapables de subvenir à leurs besoins ou à ceux de leur famille."
 Macarthur.100.d:0 "Le président Douglas MacArthur a prononcé un discours d'adieu devant le Congrès. Dans son discours de réflexion, il a rappelé qu'au cours de sa longue carrière militaire et politique, il avait vu le monde changer à plusieurs reprises. Il a informé le Congrès que, tout au long de son illustre carrière, il avait simplement cherché à accomplir son devoir. Il a déclaré que, même si son temps était compté, il passerait ses dernières années à penser à son service aux États-Unis et aux forces armées. Ce discours a été largement salué, qualifiant de départ modeste d'un géant militaire et politique."
 MacArthur.5:0 "Le président Douglas MacArthur a tenu une réunion de haut niveau avec les hauts responsables fédéraux chargés de l'application de la loi. À l'issue de cette réunion, le président a annoncé sa décision de cibler directement le Ku Klux Klan. Il a accusé l'organisation de perpétuer la violence et les troubles dans le Sud des États-Unis. Il a déclaré que le gouvernement fédéral exercerait toute sa pression contre le groupe jusqu'à son éradication et sa destruction. De nombreux journaux ont salué la fermeté du président face à ce que beaucoup perçoivent comme un groupe haineux. Les journaux du Sud ont condamné cette action, la qualifiant de prétexte à une ingérence fédérale dans les affaires intérieures des États."
 MacArthur.5.d:0 "Le président Douglas MacArthur a tenu une réunion de haut niveau avec les hauts responsables fédéraux chargés de l'application de la loi. À l'issue de cette réunion, le président a annoncé sa décision de cibler directement le Ku Klux Klan. Il a accusé l'organisation de perpétuer la violence et les troubles dans le Sud des États-Unis. Il a déclaré que le gouvernement fédéral exercerait toute sa pression contre le groupe jusqu'à son éradication et sa destruction. De nombreux journaux ont salué la fermeté du président face à ce que beaucoup perçoivent comme un groupe haineux. Les journaux du Sud ont condamné cette action, la qualifiant de prétexte à une ingérence fédérale dans les affaires intérieures des États."
 MacArthur.6.d:0 "Le président Douglas MacArthur a annoncé qu'il déploierait toute la puissance du gouvernement fédéral contre le Ku Klux Klan. Ce groupe haineux a gagné en notoriété ces dernières années pour ses actes de violence visant les Afro-Américains et les groupes de défense des droits civiques. De récentes attaques très médiatisées attribuées au groupe ont attiré l'attention du président, qui le considère comme une insurrection contre le gouvernement américain. Cette initiative est largement saluée par les Américains soucieux du rétablissement de l'ordre public. Cependant, de nombreux responsables des États du Sud ont condamné cette action, la qualifiant d'outrepassement de pouvoir fédéral et affirmant qu'ils étaient parfaitement capables de gérer le groupe."
 MacArthurCivilRights.1.d:0 "Le président Douglas MacArthur a exprimé son soutien à l'élargissement du droit de vote dans le Sud et à la suppression des lois étatiques et locales restreignant le droit de vote des Afro-Américains et des Blancs les plus défavorisés. Le président a ajouté que ces lois étaient inconstitutionnelles et portaient atteinte aux droits fondamentaux des citoyens américains. Il a également ajouté que ces lois représentaient une menace pour les États-Unis et qu'il était prêt à mobiliser tous les pouvoirs du gouvernement fédéral pour garantir la protection des droits des citoyens."
 MacArthurCivilRights.2.d:0 "Le gouverneur de l'Arkansas, Orval Faubus, a récemment intensifié son opposition à la récente décision de la Cour suprême en ordonnant aux unités de la Garde nationale de l'Arkansas d'empêcher les élèves noirs d'intégrer le lycée central de Little Rock. La Cour suprême avait jugé la ségrégation inconstitutionnelle et ordonné l'intégration de tous les établissements. Ces derniers jours, le président Douglas MacArthur a réagi avec fermeté à ce qu'il a qualifié de défi direct au gouvernement fédéral en déployant des troupes aéroportées d'élite dans la ville. Une loi martiale sévère a été déclarée et les troupes de la Garde nationale ont été désarmées de force. Alors que les troupes protégeaient les élèves scolarisés, des foules opposées à l'intégration ont bravé les règles de la loi martiale, provoquant de violents affrontements avec les soldats. Selon certaines informations, plusieurs manifestants auraient été blessés et tués lors de cette action fédérale musclée."
 MacArthurCivilRights.5.d:0 "Le président Douglas MacArthur a décrété la loi martiale dans les États du Dixie. Il a souligné que nombre de ces anciens États confédérés ont refusé, résisté ou tardé à appliquer les lois sur les droits civiques et les récentes décisions des tribunaux fédéraux. De ce fait, les autorités des États ont failli à leurs responsabilités envers la nation et les citoyens des États-Unis. Le président fédéralisera les unités de la Garde nationale, déploiera des unités militaires et fera appel à des agences fédérales pour superviser l'application de toutes les lois. Il a ajouté que ces mesures seraient temporaires et qu'elles seraient levées une fois que ces États seraient dignes de confiance pour assumer leurs responsabilités. Cette nouvelle a choqué le pays, certains condamnant cette approche autoritaire, tandis que d'autres y voient la première étape vers l'achèvement définitif de la reconstruction."
 Russel_Court_Packing.2.d:0 "Les États-Unis sont plongés dans un débat houleux suite à la présentation par le président Richard Russell d'un nouveau projet visant à ajouter des juges à la Cour suprême. Si les conservateurs du Congrès semblent enthousiasmés par cette perspective, des éléments plus progressistes condamnent le président pour sa volonté de politiser le pouvoir judiciaire à son profit. Les analystes prédisent que le président devra mener une bataille difficile au Congrès. La question se posera : quel camp saura rallier le plus de modérés ?"
 Russel_Court_Packing.3.d:0 "Le président Richard Russell s'est réjoui de l'adoption par le Congrès de sa proposition d'augmentation du nombre de juges à la Cour suprême. Il a annoncé qu'il communiquerait prochainement les noms des candidats à la Cour. Il a qualifié ce vote de victoire pour la démocratie et de rétablissement du pouvoir judiciaire dans son rôle initial. Les opposants à la loi l'ont condamnée, la qualifiant de pure tentative du président de consolider son autorité sur le pouvoir judiciaire. De nombreux journaux progressistes affirment que cette nouvelle marque une défaite majeure pour la démocratie dans le pays. Les conservateurs de tout le pays se réjouissent de cette nouvelle et sont convaincus que leur point de vue sera enfin entendu."
 Russel_Court_Packing.4.d:0 "Le Congrès n'a pas réussi à adopter une récente proposition du président Richard Russell visant à ajouter des juges à la Cour suprême. Le président et ses alliés au Congrès n'ont pas réussi à rallier suffisamment d'électeurs, notamment parmi les plus modérés. Le président a exprimé sa déception face à ce vote, le qualifiant de revers pour le peuple américain. Avec cet échec, le président a épuisé une grande partie de son capital politique et devra reconstruire son soutien. Il en résulte un revers majeur pour les conservateurs américains."
 Southern_Manifesto_Russel.2.d:0 "Le président Richard Russell a prononcé un discours sur le Manifeste du Sud, récemment dévoilé. Ce document, signé presque exclusivement par des sénateurs et des députés démocrates des États du Sud et deux républicains, condamne les récentes décisions de la Cour suprême appelant à l'intégration des écoles et autres lieux publics. Le président a apporté son soutien au document et affirme que la Cour suprême a outrepassé sa compétence en statuant sur l'intégration. Il a appelé la Cour à respecter le mode de vie des Américains. Le document souligne que la Constitution ne traite ni de l'intégration ni de l'éducation et que la Cour a outrepassé ses limites. Bien que de nombreux journaux du Sud soutiennent le document, les réactions à travers le pays ont été largement négatives, beaucoup accusant le président de favoriser ouvertement les Sudistes blancs."
 Russel.5.d:0 "Le président Richard Russell a salué l'annulation de la décision de la Cour suprême dans l'affaire Brown contre le Conseil de l'éducation. Il a déclaré que la décision initiale constituait clairement un excès de pouvoir judiciaire et que son raisonnement reposait sur des bases fragiles. Il a salué le retour à la raison judiciaire et la protection des Américains dans leur droit de contrôler leurs propres affaires, en particulier l'éducation de leurs enfants. La décision initiale avait appelé à l'intégration des écoles ségréguées après avoir constaté que les enfants afro-américains étaient défavorisés par ces écoles. Cette annulation est largement condamnée par les journaux progressistes et les militants des droits civiques, qui accusent le président d'utiliser les ressources de l'exécutif et du gouvernement fédéral pour entraver les efforts visant à mettre fin à la discrimination raciale dans le Sud."
 Russel.4.d:0 "Le président Richard Russell a exprimé son soutien sans équivoque au gouverneur de l'Arkansas, Orval Faubus. Ce dernier a refusé de se conformer à la récente décision de la Cour suprême dans l'affaire Brown contre le Conseil scolaire. Cette décision a déclaré la ségrégation inconstitutionnelle et a appelé à l'intégration des écoles. Dans une situation d'escalade, le gouverneur a ordonné à la Garde nationale de l'Arkansas d'empêcher les élèves noirs de fréquenter le lycée central de Little Rock. Le président subissait des pressions pour appliquer la décision de la Cour fédérale, de nombreuses personnes accusant le gouverneur de défier l'autorité fédérale. Cependant, dans son discours, le président a non seulement soutenu le gouverneur, mais a également exclu toute tentative d'utilisation des ressources fédérales. Il a déclaré qu'il ne pouvait moralement pas agir sur la base d'une décision qu'il jugeait inconstitutionnelle."
 Southern_Manifesto_Russel.1.d:0 "Le président Richard Russell a prononcé un discours sur le Manifeste du Sud, récemment dévoilé. Ce document, signé presque exclusivement par des sénateurs et des députés démocrates des États du Sud et deux républicains, condamne les récentes décisions de la Cour suprême appelant à l'intégration des écoles et autres lieux publics. Le président a apporté son soutien au document et affirme que la Cour suprême a outrepassé sa compétence en statuant sur l'intégration. Il a appelé la Cour à respecter le mode de vie des Américains. Le document souligne que la Constitution ne traite ni de l'intégration ni de l'éducation et que la Cour a outrepassé ses limites. Bien que de nombreux journaux du Sud soutiennent le document, les réactions à travers le pays ont été largement négatives, beaucoup accusant le président de favoriser ouvertement les Sudistes blancs."
 Russel_Court_Packing.1.d:0 "Le président Richard Russell a dévoilé son projet d'ajouter des juges à la Cour suprême. Il a fait valoir que la Cour avait actuellement besoin de davantage de juges pour mieux refléter le pays et éviter qu'une poignée de juges ne détienne trop de pouvoir. Il a déclaré que la Cour actuelle était inamovible et hautement politisée. La proposition reçoit un accueil mitigé. De nombreux journaux conservateurs soutiennent le président et son initiative, tandis que des journaux plus progressistes la qualifient de tentative flagrante de transformer le pouvoir judiciaire en une institution conservatrice."
 Brown_v_Board.10.d:0 "Le président Richard Russell a vivement condamné la récente décision historique de la Cour suprême dans l'affaire Brown contre le Conseil de l'éducation. La Cour suprême a jugé inconstitutionnelle la notion de « séparés mais égaux » et a ordonné l'intégration de toutes les écoles. Bien que cette décision soit largement saluée par les Afro-Américains et les défenseurs des droits civiques, l'opposition du président est perçue comme sans précédent. Le président a déclaré que les tribunaux avaient outrepassé leur mandat et s'ingéraient dans le mode de vie américain. Il a également souligné que la décision de la Cour de contraindre la majorité à accepter les minorités créait un précédent néfaste pour l'avenir. Interrogé sur son intention de recourir aux ministères fédéraux pour mettre en œuvre cette décision, le président a répondu qu'il n'en avait aucune intention."
 MacArthurCivilRights.3.d:0 "Le président Douglas MacArthur a réagi avec force aux récentes tentatives du gouverneur de l'Arkansas de déployer la Garde nationale pour empêcher l'intégration des écoles de l'Arkansas. Cette mesure constituait un défi à une récente décision d'un tribunal fédéral exigeant la fin de l'intégration. Des troupes aéroportées d'élite ont été rapidement déployées en Arkansas, où elles ont désarmé la Garde nationale et instauré la loi martiale. Les manifestations et les blocages de routes organisés par les partisans de la ségrégation ont été brutalement réprimés, et des décès ont été signalés. Le président a fermement affirmé l'autorité fédérale dans cette crise."
 MacArthurCivilRights.4.d:0 "Le président Douglas MacArthur a décrété la loi martiale dans les États du Dixie. Il a souligné que nombre de ces anciens États confédérés ont refusé, résisté ou tardé à appliquer les lois sur les droits civiques et les récentes décisions des tribunaux fédéraux. De ce fait, les autorités des États ont failli à leurs responsabilités envers la nation et les citoyens des États-Unis. Le président fédéralisera les unités de la Garde nationale, déploiera des unités militaires et utilisera les agences fédérales pour superviser l'application de toutes les lois. De nombreux pays louent les alliés des États-Unis à l'étranger, tandis que leurs opposants estiment que ces actions témoignent de la fragilité du système américain."
 MacArthurCivilRights.6.d:0 "La déclaration de la loi martiale dans les États du Sud a suscité une réaction négative de la part des Dixiecrats, tant au Congrès qu'au niveau des États. De nombreux sénateurs, dirigeants du Congrès et gouverneurs ont condamné les actions du président, les qualifiant d'inconstitutionnelles. En réponse, le président Douglas MacArthur a ordonné au FBI d'arrêter de nombreux hauts dirigeants des Dixiecrats pour incitation aux troubles. Le président a ajouté que ces arrestations faciliteraient l'application des lois fédérales. Bien que cette mesure soit saluée par certains, de nombreux journaux remettent en question la légalité et la politique autoritaire du président."
 Moderate_Hero_Wallace.1.d:0 "George Wallace a remporté la récente primaire démocrate pour le poste de gouverneur en Alabama. Il est quasiment assuré de remporter les prochaines élections. Wallace a fait campagne sur un programme modéré, avec le soutien de la NAACP. Son adversaire, John Patterson, défendait un programme ségrégationniste et, selon la rumeur, bénéficiait du soutien total du Ku Klux Klan. Cependant, avant les élections, il a été arrêté par le FBI pour ses liens avec cette organisation et ses efforts visant à entraver l'application des lois fédérales sur les droits civiques. Nombreux sont ceux qui louent Wallace et sa victoire est présentée comme un signe de changement dans la politique du Sud."
 Warren_HC.1.d:0 "Le président Earl Warren a récemment terminé une longue tournée dans les États clés pour promouvoir son projet de couverture santé universelle pour tous les Américains. Au cours de sa tournée, le président a insisté sur l'importance d'offrir à tous les Américains des chances égales de bénéficier des avancées majeures des sciences médicales. Dans de nombreuses allocutions, il a rappelé aux Américains que les militaires de retour de la Seconde Guerre mondiale étaient confrontés à de nombreuses difficultés, notamment en matière de frais médicaux. Il a souligné que si les États-Unis avaient bénéficié d'une couverture santé universelle, ces soldats auraient été protégés et n'auraient pas à supporter les dépenses qui les accablent encore aujourd'hui. Les opposants au projet affirment qu'il est financièrement irréalisable et qu'il imposerait une charge financière considérable aux Américains. Ils estiment également que le projet de loi freinera l'innovation médicale. Le Congrès devrait se prononcer prochainement."
 Warren_HC.2.d:0 "Lors d'une victoire politique majeure, le Congrès américain a approuvé le plan de santé universel du président Earl Warren. Le président avait investi beaucoup de temps et d'argent politique pour faire adopter ce projet de loi qui garantira à tous les citoyens américains l'accès aux services médicaux. Le vote a été serré et, par la suite, ses opposants ont continué à mettre en garde contre les coûts financiers. Cependant, le président semble ravi. Dans une déclaration faite après le vote, le président Warren a indiqué qu'il n'avait pas réussi à faire adopter un vote similaire en tant que gouverneur, mais qu'il pouvait désormais tenir sa promesse envers les familles confrontées à d'énormes difficultés financières en raison des frais médicaux. Cette loi est sans précédent aux États-Unis et de nombreux journaux la soutiennent et la condamnent à la fois."
 Warren_HC.3.d:0 "Le Congrès américain a subi un revers politique majeur en refusant d'approuver le projet de loi sur la santé universelle du président Earl Warren. Ce dernier avait consacré beaucoup de temps et d'argent politique à l'adoption de ce projet de loi, qui aurait permis à tous les citoyens américains d'accéder aux services médicaux. Cependant, les inquiétudes concernant le coût et les excès de pouvoir du gouvernement étaient trop fortes. Le président a publié une déclaration exprimant sa frustration face à cet échec. Il a souligné que les dépenses médicales ne feraient que s'aggraver et peser davantage sur les familles au cours des prochaines décennies, et que le Congrès avait agi par souci de court terme. De nombreux journaux nationaux étaient divisés sur cette loi, et de nombreux éditoriaux véhéments la saluaient tout en la condamnant."
 Dem_Eisenhower.10.d:0 "Le président Dwight Eisenhower s'est entretenu avec les principaux dirigeants du Parti démocrate du Sud. Cette rencontre a eu lieu alors que le président cherche à préserver l'unité du Parti démocrate. Les démocrates du Sud se sont de plus en plus éloignés du reste du parti sur la question des droits civiques. Nombreux sont les médias qui qualifient cette faction de « Dixiecrats ». Ces derniers prônent la ségrégation et s'opposent aux efforts fédéraux visant à faire respecter les droits civiques dans les États du Sud. Le président Eisenhower cherchera probablement à apaiser les craintes d'une adoption par le Congrès de lois ciblant certaines pratiques, tout en soulignant que les décisions de justice seront appliquées par le gouvernement fédéral. Le Parti démocrate espère que ces discussions permettront au moins d'apaiser les tensions et de consolider la loyauté envers le parti en vue des prochaines élections, le président Eisenhower jouissant d'une grande estime dans le Sud."
 usa.19684.d:0 "Après s'être adressé à ses partisans peu après minuit dans la salle de bal Embassy de l'hôtel Ambassador au sujet des résultats des primaires de Californie et du Dakota du Sud, le sénateur Kennedy avait prévu de traverser la salle de bal pour se rendre à une deuxième réunion avec ses collaborateurs et ses partisans. Cependant, la presse a demandé une conférence de presse impromptue. Frank Dutton, assistant de campagne, a informé le service de sécurité, dirigé par l'agent retraité du FBI William Barry, du changement prévu. Cependant, des inquiétudes ont été soulevées quant à la sécurité de la zone, ainsi qu'au souhait du sénateur Kennedy de rencontrer ses partisans dans un cadre plus informel. Comment procéder ?"
 usa.19685.d:0 "Ce soir, le sénateur Robert Kennedy, candidat à la présidence et frère du président assassiné John F. Kennedy, a été abattu alors qu'il s'adressait à la presse pour annoncer les résultats des primaires de Californie et du Dakota du Sud, dans la salle de bal de l'hôtel Ambassador. Le tireur, Sirhan Sirhan, un Palestinien-Américain, a été appréhendé. Bien que le mobile reste à confirmer, certains suggèrent qu'il pourrait être lié au soutien historique de Kennedy à Israël. Le sénateur Kennedy a été transporté à l'hôpital Good Samaritan voisin et est malheureusement décédé quelques heures après son arrivée. Cet assassinat a également suscité de nombreuses demandes de protection des principaux candidats à la présidentielle par les services secrets. L'impact de cet assassinat sur la campagne présidentielle en cours reste à déterminer, et les États-Unis sont une fois de plus en deuil après un nouvel assassinat inutile qui a coûté la vie à un dirigeant éminent et inspirant."
 usa.19686.d:0 "Ce soir, par un retournement de situation choquant, le candidat à la présidence et sénateur Robert Kennedy, frère du président assassiné John F. Kennedy, a failli être abattu alors qu'il s'adressait à la presse pour annoncer les résultats des primaires de Californie et du Dakota du Sud, dans la salle de bal de l'hôtel Ambassador. Le garde du corps du sénateur, William Barry, s'est jeté devant Kennedy et a reçu la balle, tandis que d'autres personnes dans l'assistance appréhendaient le tireur, Sirhan Sirhan. Bien que le mobile de l'assassinat reste à confirmer, des rumeurs suggèrent qu'il pourrait être lié au soutien historique de Kennedy à Israël. Cet assassinat a également suscité de plus en plus d'appels aux services secrets pour qu'ils protègent les principaux candidats à la présidentielle. L'impact de cet assassinat sur la campagne présidentielle reste à déterminer. Cela dit, le peuple américain peut pousser un soupir de soulagement en sachant que, pour une fois, l'une de ses figures de proue n'a pas été abattue inutilement."
 USA_Spratley.1.d:0 "Récemment, l'armée de l'air américaine (USAF) a pris contact avec le roi Morton Ier. Une délégation dirigée par l'USAF l'a rencontré pour discuter des possibilités stratégiques d'établir une base aérienne américaine dans l'archipel. Cette rencontre visait à aborder les intérêts communs en matière de sécurité régionale et de coopération en matière de défense, reconnaissant la position cruciale du Royaume en mer de Chine méridionale. Bien que les détails des négociations restent confidentiels, nous resterons prudents, méfiants face aux intentions douteuses des États-Unis et à la menace potentielle du néocolonialisme."
 USA_Spratley.2.d:0 "Récemment, l'armée de l'air américaine a pris contact avec le roi Morton Ier de la Maison de Meads, monarque régnant du Royaume de l'Humanité dans les îles Spratlys moroc-songhrati, afin de discuter de l'établissement d'une base aérienne américaine. Malgré les avantages mutuels pour la sécurité régionale évoqués, le Royaume de l'Humanité a rejeté la proposition, invoquant des préoccupations concernant la souveraineté et l'influence étrangère. En réponse, la marine américaine prépare des plans d'occupation des îles afin de protéger nos intérêts stratégiques en mer de Chine méridionale. Nos analystes ont souligné l'importance de maintenir un passage maritime sûr en mer de Chine méridionale ; nous devrons décider de la suite des opérations."
 USA_Spratley.3.d:0 "Récemment, l'armée de l'air américaine a négocié avec succès avec le roi Morton Ier de la Maison de Meads, monarque régnant du Royaume de l'Humanité dans les îles Spratlys moroc-songhrati, l'établissement d'une base militaire américaine. Le roi Morton Ier a accepté d'accueillir la base militaire, reconnaissant les avantages mutuels pour la sécurité régionale et la coopération en matière de défense. Notre gouvernement a exprimé sa gratitude pour ce partenariat stratégique, soulignant son importance pour le renforcement de la stabilité et de la sécurité en mer de Chine méridionale. Les préparatifs pour l'établissement de la base sont actuellement en cours, marquant une avancée significative pour notre influence dans la région."
 USA_Spratley.4.d:0 "Dans un retournement de situation dévastateur, le Corps des Marines des États-Unis, soutenu par la flotte du Pacifique, envahit Southwark, capitale du Royaume de l'Humanité, après que le roi Morton Ier eut fermement refusé l'établissement d'une base militaire américaine. Cette action militaire soudaine et agressive déborda les défenses locales, et le roi Morton Ier fut arrêté au milieu du chaos. Le Royaume de l'Humanité condamna l'invasion, la qualifiant d'acte d'agression injuste, soulignant la violation de sa souveraineté et la menace qui pesait sur son indépendance. Le peuple du Royaume de l'Humanité est désormais confronté à un avenir incertain, sous l'ombre d'une occupation militaire étrangère."
 USA_Spratley.5.d:0 "Récemment, plusieurs journalistes ont rapporté que la marine américaine avait commencé à occuper les îles Spratly après que le roi Morton Ier de la Maison Mead, souverain de la micro-nation non reconnue « Royaume de l'Humanité », eut refusé d'accueillir une base militaire américaine. La réponse américaine, rapide, a impliqué plusieurs navires de guerre et un déploiement rapide de personnel naval sur des îles clés, sans rencontrer de résistance.\n\nCette mesure radicale a suscité l'indignation du régime communiste basé à Hanoï et de l'État vietnamien basé à Saïgon, qui ont tous deux déclaré qu'il s'agissait d'une grave violation de leur souveraineté et d'une escalade de la guerre d'Indochine en cours. Les Mead ont sollicité en vain une réaction des Nations Unies, tandis que les États-Unis insistent sur le fait que leur objectif est de lutter contre les pirates et de mettre fin à la colonisation illégale de la mer de Chine méridionale afin de garantir des passages internationaux plus sûrs."
 USA_50s_FP_Reach_Out_to_the_Meads:0 "Tendre la main vers les prairies"
 USA_50s_FP_Reach_Out_to_the_Meads_desc:0 "Notre administration et nos forces armées souhaitent établir des contacts avec la dynastie américaine des Meads, souveraine du « Royaume de l'Humanité » dans les îles Spratly. Nos analystes envisagent d'explorer la possibilité d'établir une petite base militaire dans la micronation afin de surveiller et de contrôler les activités maritimes en mer de Chine méridionale, renforçant ainsi la stabilité régionale et les capacités de notre flotte du Pacifique."
 PATCO_strike.1.d:0 "Plus tôt cette année, la PATCO (Professional Air Traffic Controllers Organization) et la Federal Aviation Administration (FAA) ont entamé des négociations pour un nouveau contrat. Malheureusement, la PATCO a rejeté la dernière contre-offre de la FAA et a déclaré la grève après que celle-ci a appliqué la contre-proposition. Le principal problème de la PATCO avec le nouveau contrat réside dans le fait que le temps de travail n'a pas été réduit à 32 heures, ce qu'elle invoque comme un problème de sécurité et le refus de l'administration d'augmenter davantage le financement des retraites. D'autres revendications ont également été formulées, notamment en matière d'augmentation des salaires. La grève affaiblira le trafic aérien, la logistique et le commerce du pays et portera préjudice à une économie déjà en difficulté. Cela dit, le Titre 5 du Code des États-Unis interdit aux fonctionnaires fédéraux de faire grève, ce qui en fait une grève illégale. De nombreuses options s'offrent donc à nous. D'un côté, nous pourrions reprendre les négociations et proposer un compromis sur les revendications les moins graves de la PATCO tout en continuant d'ignorer la question des horaires de travail ; de l'autre, nous pourrions capituler catégoriquement devant leurs revendications, ou, plus radicalement, déclarer la grève illégale et contraindre tous les grévistes à reprendre le travail immédiatement, sous peine de perdre leur emploi. Comment procéder ?"
 PATCO_strike.2.d:0 "Le président [USA.GetLeader] a invoqué le Titre 5 du Code des États-Unis et déclaré illégale la grève de la PATCO, exigeant en outre que tous les grévistes reprennent le travail dans les 48 heures sous peine de licenciement immédiat. Le Président a cité le serment prêté par ces employés : « Je ne participe à aucune grève contre le gouvernement des États-Unis ou l'une de ses agences, et je n'y participerai pas tant que je serai employé du gouvernement des États-Unis ou de l'une de ses agences. » pour justifier sa décision. Une décision d'urgence des tribunaux a également indiqué que les travailleurs devaient reprendre le travail immédiatement et a déclaré le président de la PATCO, Robert Poli, coupable d'outrage au tribunal. Passé le délai de 48 heures, le Président a autorisé le licenciement des près de 12 000 grévistes restants et leur a interdit tout emploi futur au sein de la fonction publique."
 PATCO_strike.3.d:0 "Le président de la PATCO, Robert Poli, a annoncé la fin de la grève des contrôleurs aériens après l'aboutissement des négociations avec l'administration afin de répondre à certaines préoccupations du syndicat. Si les horaires de travail, une revendication clé de la PATCO, n'ont pas été réduits, de nouvelles augmentations de salaire et des avantages sociaux supplémentaires ont été accordés en échange de l'abandon de cette revendication. Le service aérien devrait reprendre prochainement, mais les conséquences politiques de cette décision restent incertaines pour le moment. Cependant, des voix conservatrices ont fustigé cette décision, la qualifiant de capitulation face à un syndicat corrompu menant une grève illégale, compte tenu du Code des États-Unis interdisant les grèves parmi les fonctionnaires fédéraux. Les entreprises américaines ont également exprimé leurs inquiétudes quant au risque que cette décision puisse engendrer des conflits sociaux plus importants à court terme, à l'expiration des contrats."
 PATCO_strike.4.d:0 "Dans un geste surprenant, le président [USA.GetLeader] a cédé aux demandes de la PATCO concernant une réduction du temps de travail, des augmentations salariales supplémentaires et un investissement supplémentaire dans les retraites des contrôleurs aériens. Cela a permis une reprise rapide du service aérien. Cependant, cette décision a suscité la controverse au sein de la population, de nombreux électeurs, notamment dans le Sud et dans d'autres États où la présence syndicale est limitée, la désapprouvant fermement. Les dirigeants et militants républicains ont également dénoncé cette décision, la jugeant clairement contraire au droit américain, la grève étant illégale en vertu du Titre 5 du Code des États-Unis. Les syndicats ont salué cette décision, le président rejetant les appels au licenciement des travailleurs et s'engageant à redoubler d'efforts pour la justice économique dans le pays lors des prochaines négociations dans des secteurs clés."