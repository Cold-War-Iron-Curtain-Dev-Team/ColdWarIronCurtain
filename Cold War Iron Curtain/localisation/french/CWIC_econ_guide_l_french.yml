 cwic_econ_guide_button_tt:0 "§YGuide de l'économie§!\nUn petit guide de cette fenêtre : ce que signifient les chiffres et que faire en cas de problème."
 cwic_domestic_pool_tt:0 "§YPrêteurs commerciaux nationaux§!\nVos propres banques prêtent à partir d'un pool financé par vos §YOffice Parks§!.\n\nParcs de bureaux : §Y[?office_park_total|0]§!\nChaque parc prend en charge §Y10B§!, fois §Y[?office_park_tech|2]§! de la technologie bureautique\nLimite du pool : §Y$[?outcrowding_limit|1]B§!\nDisponible maintenant : §C$[?available_liquidity|2]B§!\n\nL'emprunt fait baisser la réserve. En dessous de la limite, il se recharge chaque mois de §Y3,5%§!-§Y6,5%§! de la limite, plus rapide pour les petites piscines. Construisez des parcs de bureaux pour emprunter davantage à la maison."

 cwic_econ_guide.close:0 "Fermer le guide"
 cwic_econ_guide.back:0 "Retour au contenu"

 cwic_econ_guide.1.t:0 "Guide de l'économie"
 cwic_econ_guide.1.d:0 "Chaque pays fonctionne avec un budget. Chaque mois, les impôts et autres revenus entrent, les dépenses et les remboursements de dettes sortent, et la différence atterrit dans votre trésor. La fenêtre Finance Internationale montre comment cela se passe et vous donne les outils pour le piloter.\n\nVous n'avez pas besoin de tout gérer. Surveillez trois choses : le §YSolde budgétaire§! dans la barre supérieure, l'inflation mensuelle et l'alerte de crise. Lorsque l'un d'eux tourne mal, ce guide vous indique où chercher.\n\nChoisissez un sujet."
 cwic_econ_guide.1.a:0 "Lire l'aperçu financier"
 cwic_econ_guide.1.b:0 "Impôts et dépenses"
 cwic_econ_guide.1.c:0 "Inflation et marché noir"
 cwic_econ_guide.1.e:0 "Crises économiques"
 cwic_econ_guide.1.f:0 "Emprunts et dettes"
 cwic_econ_guide.1.g:0 "Politique économique et capitaux étrangers"

 cwic_econ_guide.2.t:0 "Lire l'aperçu financier"
 cwic_econ_guide.2.d:0 "§YLe système économique§! (en haut à gauche) est le type d'économie que vous dirigez. Il définit les taxes, politiques et conversions qui vous sont ouvertes.\n\n§YLa cote de crédit§! (la lettre en haut à droite) va de §GAAA§! jusqu'à §RD§!. Une meilleure note signifie un taux d'intérêt inférieur §Y§! sur les nouveaux prêts. À §YB§! ou pire, vous êtes en crise de crédit.\n\n§YLe graphique du PIB§! est la taille de votre économie. Une ligne descendante est une contraction.\n\n§YLe graphique dette-PIB§! représente votre dette par rapport à l'économie. L'augmentation de la dette est une bonne chose alors que le PIB croît plus rapidement ; cela devient un problème lorsque les paiements commencent à grignoter le budget."

 cwic_econ_guide.3.t:0 "Impôts et dépenses"
 cwic_econ_guide.3.d:0 "L'onglet §YPolitique fiscale§! contient les curseurs. Chaque changement coûte §Y15§! de puissance politique.\n\n§YLes impôts§! sont répartis en quatre tranches, de la classe inférieure jusqu'à la classe supérieure, par paliers de §Y5%§!. Des impôts plus élevés rapportent plus d'argent mais peuvent ralentir l'économie.\n\n§YLes dépenses§! couvrent les services civils (soins de santé, protection sociale, éducation, police, services publics) et militaires (armée, marine, force aérienne, forces stratégiques, espace). Chacun coûte de l'argent chaque mois.\n\nSi vous dépensez plus que ce que vous gagnez, votre trésorerie s'épuise. Lorsqu'il est épuisé, le gouvernement emprunte automatiquement auprès de n'importe quel prêteur ayant de l'argent en réserve. C'est pratique mais cela ajoute de la dette. Un déficit supérieur à §Y4%§! du PIB provoque une crise budgétaire.\n\nRègle générale : maintenez le solde budgétaire dans la barre supérieure proche de zéro ou positif en temps de paix, et acceptez un déficit uniquement pour les guerres et les grands programmes de construction."

 cwic_econ_guide.4.t:0 "Inflation et marché noir"
 cwic_econ_guide.4.d:0 "§YL'inflation mensuelle§! correspond à la vitesse à laquelle les prix augmentent. Un peu, c'est normal. Au-dessus de §Y0,75%§! par mois (environ 9% par an), cela devient une crise inflationniste.\n\n§YLa pression du marché noir§! représente la part des échanges commerciaux qui échappent à l'économie officielle. Au-dessus de §Y25%§!, cela compte également comme une crise inflationniste.\n\nLes deux se trouvent sur la page §YCrisis View§!, et les outils se trouvent sur la page §YPolitique économique§! :\n- §YL'impression monétaire§! remplit le trésor mais augmente l'inflation et la pression du marché noir.\n- Le §Yresserrement monétaire§!, le §Ycontrôle des capitaux§!, le §Ycontrôle des prix§! et le §Ydouble taux de change§! ont réduit l'inflation. La plupart augmentent chaque mois la pression du marché noir et la productivité des coûts, donc soulevez-les une fois l'inflation maîtrisée.\n- §YRaids§!, une §YCampagne d'application§! ou une §YAmnesty§! réduisent la pression du marché noir.\n- §YRéforme monétaire§! est la réinitialisation d'urgence.\n\nPassez la souris sur n'importe quel bouton pour voir son coût et ses effets exacts avant de cliquer."

 cwic_econ_guide.5.t:0 "Crises économiques"
 cwic_econ_guide.5.d:0 "Une crise commence lorsqu'une partie de l'économie franchit une ligne de danger : trop de déficit, trop d'inflation, pas assez d'électricité, pas assez de nourriture, etc. Chaque crise a une gravité de §YFaible§! à §RExtrême§! et donne des sanctions qui augmentent avec elle.\n\nLorsqu'une crise est active, l'alerte de crise §R§! apparaît dans la barre supérieure. Cliquez dessus pour ouvrir la vue de crise §Y§!. Faites un clic droit dessus pour le masquer jusqu'à ce qu'une nouvelle crise commence ou qu'elle s'aggrave.\n\nDu point de vue de la crise, §YCrises actives§! vous font du mal maintenant et §YCrises potentielles§! sont ce qui pourrait arriver ensuite. Survolez une crise active pour voir :\n- qu'est-ce qui rendrait les choses pires,\n- ses sanctions en vigueur,\n- §YLeviers recommandés§!: ce que vous pouvez faire à ce sujet.\n\nDeux crises ou plus peuvent former ensemble une crise composée §Y§!, comme la stagflation ou le piège de la dette. Mettez fin à l'une des crises à partir desquelles elle est construite et la crise complexe prendra également fin."

 cwic_econ_guide.6.t:0 "Emprunts et dettes"
 cwic_econ_guide.6.d:0 "L'onglet §YEmprunter§! répertorie qui vous prêtera et à quelles conditions.\n\n§YLes prêteurs commerciaux nationaux§! sont vos propres banques. Le montant qu'ils peuvent prêter dépend de vos §YOffice Parks§!: chaque parc ajoute §Y10B§! au pool. Survolez leur ligne pour les détails.\n\n§YLes créanciers privés§! et autres prêteurs étrangers ont leurs propres limites. Votre cote de crédit §Y§! définit les intérêts que vous payez partout.\n\nL'onglet §YDettes actuelles§! répertorie chaque prêt, ce que vous devez encore et le paiement mensuel.\n\nLa dette est un outil, pas un échec. Cela devient dangereux lorsque les paiements dépassent §Y5%§! du PIB (une crise budgétaire), lorsque le Trésor ne peut pas couvrir les paiements de ce mois (une crise du crédit) ou lorsque les prêteurs vous excluent. Empruntez pour des choses qui font croître l'économie et remboursez la dette les bonnes années."

 cwic_econ_guide.7.t:0 "Politique économique et capitaux étrangers"
 cwic_econ_guide.7.d:0 "Ouvrez l'onglet §YEmprunt§!, puis appuyez sur §YPolitique économique§! au même endroit pour accéder à cette page.\n\n§YLes marchés monétaires§! et §Yet les changes§! contiennent les outils de l'inflation, des devises et du marché noir. La bande colorée sur chaque bouton est son type : §Bbleu§! s'agrandit, §Oorange§! restreint, §Yjaune§! est un changement structurel, §Rrouge§! est drastique et §ggris§! annule une mesure antérieure.\n\n§YLe système économique§! vous permet de vous convertir à une économie rentière, pétrolière ou normale lorsque vous êtes admissible.\n\n§YForeign Capital§! invite les entreprises étrangères à investir, secteur par secteur. Appuyez sur §YParcourez§! sur un secteur, choisissez une entreprise et payez §Y25§! Pouvoir politique pour l'inviter ou §Y50§! pour une concession. Environ un mois plus tard, l'entreprise répond avec un événement. Chaque entreprise qui s'installe augmente le niveau de présence du secteur et ajoute son propre bonus. Les économies planifiées doivent d'abord §Yautoriser les concessions étrangères§!. Trop de pressions de nationalisation font fuir les entreprises.\n\nLes pays qui luttent contre une insurrection voient une fenêtre réduite jusqu'à la fin de l'insurrection."
