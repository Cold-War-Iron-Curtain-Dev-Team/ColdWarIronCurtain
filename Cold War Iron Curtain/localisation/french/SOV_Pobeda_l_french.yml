l_french:
 veday.1.d:0 "Deux décennies se sont écoulées depuis que l'Union soviétique a joué un rôle décisif dans la défaite de l'Allemagne nazie, assurant ainsi la paix pour l'Europe et le monde. La Grande Guerre patriotique, qui a coûté la vie à des millions de personnes, reste un chapitre déterminant de l'histoire soviétique — un récit de sacrifice, de résilience et de triomphe ultime.\n\nAujourd'hui, l'Union soviétique est reconstruite et plus forte que jamais. Ses villes, autrefois dévastées par la guerre, ont été restaurées, ses industries stimulent le progrès et son peuple reste résolu dans son engagement en faveur de la paix et de la sécurité. À travers le pays, des cérémonies rendent hommage aux héros qui ont combattu sur les lignes de front et à ceux qui ont travaillé sur le front intérieur pour atteindre la victoire.\n\nAlors que le monde réfléchit à ce triste anniversaire historique, l'Union soviétique réaffirme son engagement en faveur de la paix internationale, veillant à ce que les sacrifices du passé ne soient jamais vains. L'esprit de la victoire perdure."
 veday.2.d:0 "Moscou se tient dans une fierté solennelle alors que l'Union soviétique marque quatre décennies depuis le triomphe de 1945. La Place Rouge, cœur de la nation, est remplie des images et des sons à la fois du souvenir et de la force indéfectible.\n\nLa parade militaire avance avec précision, mettant en valeur la puissance des Forces armées soviétiques — soldats, chars et porte-missiles passent devant le Mausolée de Lénine, un témoignage de la puissance qui a protégé la paix depuis la fin de la Grande Guerre patriotique. Au-dessus, les avions soviétiques rugissent dans le ciel, rappelant au monde que l'Armée soviétique reste toujours vigilante.\n\nCependant, au cœur de cette célébration, ce sont les vétérans. Avec leurs médailles brillant sous le soleil de mai, ils défilent fièrement, leurs sacrifices honorés par les foules acclamantes et les jeunes membres du Komsomol qui portent leur héritage vers l'avenir.\n\nAlors que des feux d'artifice illuminent les tours du Kremlin, une vérité demeure : la victoire de 1945 n'était pas simplement un moment dans l'histoire — elle est le fondement de l'avenir inébranlable de l'Union soviétique."
 veday.3.d:0 "Moscou se tient fière alors que l'Union soviétique marque quarante-cinq ans depuis le triomphe de 1945. La Place Rouge est remplie des images et des sons de l'histoire et de la puissance — soldats en marche, le grondement des tanks, et le rugissement des avions soviétiques qui survolent le ciel. La parade militaire avance en parfaite synchronisation, rappelant au monde que l'Armée soviétique reste forte et vigilante.\n\nAu cœur de la célébration, les vétérans de la Grande Guerre patriotique défilent une fois de plus, leurs poitrines ornées de médailles, leurs visages reflétant à la fois la fierté et le souvenir. Les foules les acclament, sachant que sans leur sacrifice, il n'y aurait pas d'Union soviétique aujourd'hui.\n\nAlors que les dernières formations défilent et que les feux d'artifice illuminent le Kremlin, le message est clair : la victoire de 1945 n'est pas simplement un souvenir — elle est un héritage vivant, et la force de l'Union soviétique perdure."
 veday.4.d:0 "Trente ans après le triomphe de 1945, Moscou se dresse au cœur d'une célébration à la fois solennelle et pleine d'espoir. Cette année, la Place Rouge n'est pas remplie du grondement des tanks ni du pas des soldats, mais des voix de la jeunesse et de la présence indéfectible de ceux qui ont assuré la victoire.\n\nDes dizaines de milliers de membres du Komsomol envahissent les rues, portant des bannières rouges et des portraits des héros tombés. Ils marchent aux côtés des vétérans, ces hommes et femmes qui ont autrefois pris d'assaut Berlin, leurs médailles brillant sous le soleil de mai. Les chants de la victoire résonnent dans la ville tandis que les jeunes s'engagent à porter en avant les idéaux de ceux qui les ont précédés.\n\nLe soir, alors que les tours du Kremlin brillent contre le ciel nocturne et que les feux d'artifice illuminent Moscou, un symbole apparaît : les sacrifices du passé n'ont pas été vains et l'avenir reste fermement entre les mains du peuple soviétique."
 veday.5.d:0 "Vingt-cinq ans se sont écoulés depuis que les canons de la Grande Guerre patriotique se sont tus, marquant la victoire décisive de l'Union soviétique sur le fascisme. En cette occasion solennelle mais triomphante, le peuple soviétique rend hommage aux millions de personnes qui ont donné leur vie pour assurer la paix, la liberté et l'avenir du socialisme.\n\nDe Moscou à Vladivostok, la nation s'unit dans le souvenir. Les vétérans, leurs poitrines ornées de médailles, défilent une fois de plus sur la Place Rouge, tandis que les nouvelles générations les regardent avec fierté. Les villes autrefois réduites en ruines se dressent maintenant fièrement, symboles de la résilience et de la force de l'Union soviétique. L'Armée soviétique, toujours vigilante, veille à ce que les horreurs de la guerre ne reviennent jamais sur le sol soviétique.\n\nTandis que le monde change, une vérité demeure : l'Union soviétique se dresse comme un bastion de paix et de progrès, à jamais façonnée par le courage de ceux qui ont combattu et remporté la plus grande bataille de l'histoire."