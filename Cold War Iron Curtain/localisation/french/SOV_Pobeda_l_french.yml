l_french:

veday.1.d:0 "Deux décennies se sont écoulées depuis que l'Union soviétique a joué un rôle décisif dans la défaite de l'Allemagne nazie, assurant ainsi la paix en Europe et dans le monde. La Grande Guerre patriotique, qui a coûté la vie à des millions de personnes, reste un chapitre déterminant de l'histoire soviétique : un chapitre de sacrifice, de résilience et de triomphe ultime.\n\nAujourd'hui, l'Union soviétique est reconstruite et plus forte que jamais. Ses villes, autrefois dévastées par la guerre, ont été restaurées, ses industries sont le moteur du progrès et sa population reste fidèle à son engagement en faveur de la paix et de la sécurité. Partout au pays, des cérémonies honorent les héros qui ont combattu sur les lignes de front et ceux qui ont travaillé dur sur le front intérieur pour remporter la victoire.\n\nAlors que le monde réfléchit à cet anniversaire historique, l'Union soviétique réaffirme son attachement à la paix internationale, garantissant que les sacrifices du passé ne seront jamais vains. L'esprit de victoire perdure."
veday.2.d:0 "Moscou est fière d'elle alors que l'Union soviétique célèbre les quatre décennies qui se sont écoulées depuis le triomphe de 1945. La Place Rouge, le coeur de la nation, est remplie d'images et de sons à la fois de souvenir et de force inébranlable.\n\nLe défilé militaire avance avec précision, mettant en valeur la puissance des forces armées soviétiques : soldats, chars et porteurs de missiles passent devant le mausolée de Lénine, témoignage de la puissance qui a sauvegardé la paix depuis la fin de la Grande Guerre patriotique. Ci-dessus, des avions soviétiques rugissent dans le ciel, rappelant au monde que l'armée soviétique reste toujours vigilante.\n\nPourtant, les anciens combattants sont au coeur de cette célébration. Avec leurs médailles scintillant sous le soleil de mai, ils marchent fièrement, leurs sacrifices étant honorés par la foule enthousiaste et les jeunes membres du Komsomol qui perpétuent leur héritage.\n\nAlors que les feux d'artifice illuminent les tours du Kremlin, une vérité demeure : la victoire de 1945 n'est pas qu'un moment de l'histoire : elle constitue le fondement de l'avenir inébranlable de l'Union soviétique."
veday.3.d:0 "Moscou est fière alors que l'Union soviétique célèbre les quarante-cinq ans de son triomphe de 1945. La Place Rouge est remplie d'images et de sons de l'histoire et du pouvoir : des soldats en marche, le grondement des chars et le rugissement des avions soviétiques survolant la ville. Le défilé militaire se déroule à l'unisson, rappelant au monde que l'armée soviétique reste forte et vigilante.\n\nAu coeur de la célébration, les vétérans de la Grande Guerre Patriotique défilent à nouveau, la poitrine ornée de médailles, le visage reflétant à la fois la fierté et la mémoire. La foule les acclame, sachant que sans leur sacrifice, il n'y aurait pas d'Union soviétique aujourd'hui.\n\nAlors que les formations finales passent et que les feux d'artifice illuminent le Kremlin, le message est clair : la victoire de 1945 n'est pas seulement un souvenir : c'est un héritage vivant, et la force de l'Union soviétique perdure."
veday.4.d:0 "Trente ans après le triomphe de 1945, Moscou se trouve au coeur d'une célébration solennelle mais pleine d'espoir. Cette année, la Place Rouge n'est pas remplie du grondement des chars ou de la marche des soldats, mais des voix de la jeunesse et de la présence inébranlable de ceux qui ont assuré la victoire.\n\nDes dizaines de milliers de membres du Komsomol envahissent les rues, brandissant des banderoles rouges et des portraits de héros tombés au combat. Ils marchent aux côtés d'anciens combattants, ces mêmes hommes et femmes qui ont jadis pris d'assaut Berlin, leurs médailles scintillant sous le soleil de mai. Les chants de victoire résonnent dans la ville tandis que les jeunes s'engagent à perpétuer les idéaux de ceux qui les ont précédés.\n\nLe soir, alors que les tours du Kremlin brillent sur le ciel nocturne et que des feux d'artifice illuminent Moscou, symbole que les sacrifices du passé n'ont pas été vains et que l'avenir reste fermement entre les mains du peuple soviétique."
veday.5.d:0 "Vingt-cinq ans se sont écoulés depuis que les armes de la Grande Guerre patriotique se sont tues, marquant la victoire décisive de l'Union soviétique sur le fascisme. En cette occasion solennelle mais triomphale, le peuple soviétique rend hommage aux millions de personnes qui ont donné leur vie pour garantir la paix, la liberté et l'avenir du socialisme.\n\nDe Moscou à Vladivostok, la nation s'unit dans le souvenir. Les anciens combattants, la poitrine ornée de médailles, défilent à nouveau sur la Place Rouge, sous le regard fier des nouvelles générations. Les villes autrefois réduites en décombres se dressent désormais haut, symboles de la résilience et de la force de l'Union soviétique. L'armée soviétique, toujours vigilante, veille à ce que les horreurs de la guerre ne reviennent jamais sur le sol soviétique.\n\nAlors que le monde change, une vérité demeure : l'Union soviétique demeure un bastion de paix et de progrès, façonné à jamais par le courage de ceux qui ont combattu et gagné la plus grande bataille de l'histoire."