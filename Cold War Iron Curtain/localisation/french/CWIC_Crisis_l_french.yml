### CROP FAILURE
 cwic_crisis_crop_failure_low:0 "Mauvaise récolte"
 cwic_crisis_crop_failure_low_desc:0 "La production agricole a diminué, réduisant ainsi l'approvisionnement alimentaire."

 cwic_crisis_crop_failure_medium:0 "Crise agricole"
 cwic_crisis_crop_failure_medium_desc:0 "Des pertes de récoltes importantes ont un impact sur la production alimentaire et la stabilité économique."

 cwic_crisis_crop_failure_high:0 "Mauvaise récolte grave"
 cwic_crisis_crop_failure_high_desc:0 "Des pertes agricoles majeures perturbent les systèmes alimentaires et la productivité."

 cwic_crisis_crop_failure_extreme:0 "Effondrement agricole"
 cwic_crisis_crop_failure_extreme_desc:0 "La production agricole s'est effondrée, ce qui a eu de graves conséquences sur l'économie et la société."


### FOOD / FAMINE
 cwic_crisis_food_security_famine_low:0 "Pénuries alimentaires"
 cwic_crisis_food_security_famine_low_desc:0 "Les pressions sur l'approvisionnement alimentaire commencent à affecter la stabilité et la consommation."

 cwic_crisis_food_security_famine_medium:0 "Crise alimentaire"
 cwic_crisis_food_security_famine_medium_desc:0 "Les pénuries alimentaires réduisent la productivité et accroissent l'instabilité."

 cwic_crisis_food_security_famine_high:0 "Conditions de famine"
 cwic_crisis_food_security_famine_high_desc:0 "De graves pénuries alimentaires ont un impact sur la main-d'oeuvre et la stabilité nationale."

 cwic_crisis_food_security_famine_extreme:0 "Catastrophe de famine"
 cwic_crisis_food_security_famine_extreme_desc:0 "La famine généralisée a des effets dévastateurs sur la productivité, la stabilité et la santé de la population."

### CREDIT
 cwic_crisis_financial_credit_low:0 "Resserrement du crédit"
 cwic_crisis_financial_credit_low_desc:0 "L'accès au capital devient de plus en plus limité, ce qui ralentit les investissements."

 cwic_crisis_financial_credit_medium:0 "Crise du crédit"
 cwic_crisis_financial_credit_medium_desc:0 "Les prêts restreints réduisent l'activité économique et l'expansion industrielle."

 cwic_crisis_financial_credit_high:0 "Crise financière"
 cwic_crisis_financial_credit_high_desc:0 "Le système financier est mis à rude épreuve, limitant considérablement l'accès au capital."

 cwic_crisis_financial_credit_extreme:0 "Effondrement financier"
 cwic_crisis_financial_credit_extreme_desc:0 "Les marchés du crédit se sont effondrés, paralysant les investissements et la stabilité économique."

 ### DEBT TRAP
 cwic_compound_debt_trap_low:0 "Augmentation du fardeau de la dette"
 cwic_compound_debt_trap_low_desc:0 "L'endettement croissant commence à limiter l'investissement et la flexibilité économique."

 cwic_compound_debt_trap_medium:0 "Piège de la dette"
 cwic_compound_debt_trap_medium_desc:0 "Les coûts du service de la dette limitent la politique économique et réduisent le potentiel de croissance à long terme."

 cwic_compound_debt_trap_high:0 "Un grave piège de la dette"
 cwic_compound_debt_trap_high_desc:0 "Le fardeau élevé de la dette évince les investissements et affaiblit la stabilité économique."

 cwic_compound_debt_trap_extreme:0 "Crise de la dette"
 cwic_compound_debt_trap_extreme_desc:0 "Des niveaux d'endettement insoutenables paralysent la gestion économique et restreignent toutes les options politiques."

### COLLAPSE SPIRAL
 cwic_compound_collapse_spiral_low:0 "Souche systémique"
 cwic_compound_collapse_spiral_low_desc:0 "De multiples pressions commencent à interagir, affaiblissant la gouvernance et les performances économiques."

 cwic_compound_collapse_spiral_medium:0 "Boucle de rétroaction de crise"
 cwic_compound_collapse_spiral_medium_desc:0 "Les crises interconnectées se renforcent mutuellement, accélérant le déclin économique."

 cwic_compound_collapse_spiral_high:0 "Spirale d'effondrement"
 cwic_compound_collapse_spiral_high_desc:0 "Les systèmes économiques, politiques et sociaux se détériorent ensemble, aggravant l'instabilité."

 cwic_compound_collapse_spiral_extreme:0 "Effondrement systémique"
 cwic_compound_collapse_spiral_extreme_desc:0 "L'État et l'économie connaissent un échec en cascade, les institutions et la productivité s'effondrant rapidement."

 ### ENERGY-INDUSTRIAL SHOCK
 cwic_compound_energy_industrial_shock_low:0 "Souche énergétique industrielle"
 cwic_compound_energy_industrial_shock_low_desc:0 "Les contraintes énergétiques commencent à limiter la production et l'efficacité industrielles."

 cwic_compound_energy_industrial_shock_medium:0 "Perturbation énergétique et industrielle"
 cwic_compound_energy_industrial_shock_medium_desc:0 "Les pénuries d'énergie perturbent la production industrielle et ralentissent l'activité économique."

 cwic_compound_energy_industrial_shock_high:0 "Grave choc énergétique et industriel"
 cwic_compound_energy_industrial_shock_high_desc:0 "Les contraintes énergétiques majeures réduisent considérablement la capacité industrielle et la productivité."

 cwic_compound_energy_industrial_shock_extreme:0 "Panne industrielle"
 cwic_compound_energy_industrial_shock_extreme_desc:0 "Les pannes énergétiques paralysent la production industrielle et stoppent l'activité économique dans tous les secteurs."


### FAMINE SPIRAL
 cwic_compound_famine_spiral_low:0 "Souche du système alimentaire"
 cwic_compound_famine_spiral_low_desc:0 "Les pénuries alimentaires commencent à réduire la productivité et la stabilité."

 cwic_compound_famine_spiral_medium:0 "Spirale de crise alimentaire"
 cwic_compound_famine_spiral_medium_desc:0 "Les pénuries alimentaires renforcent le déclin économique et affaiblissent la productivité de la main-d'oeuvre."

 cwic_compound_famine_spiral_high:0 "Spirale de famine"
 cwic_compound_famine_spiral_high_desc:0 "De graves pénuries alimentaires génèrent l'instabilité, réduisant la capacité de main-d'oeuvre et la production économique."

 cwic_compound_famine_spiral_extreme:0 "Catastrophe de famine"
 cwic_compound_famine_spiral_extreme_desc:0 "La famine généralisée ravage la population, effondrant la productivité et la stabilité économique."

 ### AUSTERITY TRAP
 cwic_compound_austerity_trap_low:0 "Resserrement budgétaire"
 cwic_compound_austerity_trap_low_desc:0 "Les réductions des dépenses commencent à ralentir la croissance et à réduire la productivité."

 cwic_compound_austerity_trap_medium:0 "Mesures d'austérité"
 cwic_compound_austerity_trap_medium_desc:0 "Les efforts visant à réduire les déficits suppriment l'activité économique et les investissements."

 cwic_compound_austerity_trap_high:0 "Piège de l'austérité"
 cwic_compound_austerity_trap_high_desc:0 "Le resserrement budgétaire renforce la stagnation économique, limitant le potentiel de reprise."

 cwic_compound_austerity_trap_extreme:0 "Une austérité enracinée"
 cwic_compound_austerity_trap_extreme_desc:0 "Une austérité sévère a paralysé la croissance, réduisant la productivité et la résilience économique."