l_french:
### GOVERNANCE
 cwic_crisis_governance_institutional_low:0 "Faiblesse institutionnelle"
 cwic_crisis_governance_institutional_low_desc:0 "Les institutions gouvernementales montrent des signes d'inefficacité et d'instabilité."

 cwic_crisis_governance_institutional_medium:0 "Crise de gouvernance"
 cwic_crisis_governance_institutional_medium_desc:0 "Le dysfonctionnement institutionnel affaiblit la gestion économique et la capacité de l'État."

 cwic_crisis_governance_institutional_high:0 "Grave rupture de gouvernance"
 cwic_crisis_governance_institutional_high_desc:0 "Les institutions publiques ne parviennent pas à gérer efficacement l'économie et à maintenir la stabilité."

 cwic_crisis_governance_institutional_extreme:0 "Effondrement de l'État"
 cwic_crisis_governance_institutional_extreme_desc:0 "L'échec institutionnel a paralysé la gouvernance, compromettant gravement la stabilité économique et politique."


 cwic_crisis_trade_external_shock_low:0 "Choc du commerce extérieur"
 cwic_crisis_trade_external_shock_low_desc:0 "Les perturbations commerciales commencent à affecter les performances économiques."

 cwic_crisis_trade_external_shock_medium:0 "Perturbation du commerce"
 cwic_crisis_trade_external_shock_medium_desc:0 "La réduction des flux commerciaux affaiblit la productivité et la production industrielle."

 cwic_crisis_trade_external_shock_high:0 "Grave choc commercial"
 cwic_crisis_trade_external_shock_high_desc:0 "Les perturbations commerciales majeures nuisent considérablement à l'activité économique."

 cwic_crisis_trade_external_shock_extreme:0 "Effondrement du commerce"
 cwic_crisis_trade_external_shock_extreme_desc:0 "Le système de commerce extérieur s'est effondré, mettant gravement à mal l'économie."

 cwic_governance_stress_t1:0 "Gouvernance Stress I"
 cwic_governance_stress_t1_desc:0 "La pression des entreprises étrangères commence à mettre à rude épreuve les institutions nationales."

 cwic_governance_stress_t2:0 "Gouvernance stress II"
 cwic_governance_stress_t2_desc:0 "La captation des élites et les réactions négatives locales affaiblissent l'État."

 cwic_governance_stress_t3:0 "Gouvernance Stress III"
 cwic_governance_stress_t3_desc:0 "L'influence des entreprises et les réactions négatives des industries extractives produisent un déclin visible de la gouvernance."

 cwic_governance_stress_t4:0 "Gouvernance Stress IV"
 cwic_governance_stress_t4_desc:0 "L'autorité politique est soumise à de fortes pressions du fait de la pénétration des entreprises et des réactions négatives de la société."

 cwic_governance_stress_t5:0 "Gouvernance Stress V"
 cwic_governance_stress_t5_desc:0 "L'État entre dans une crise de légitimité provoquée par l'influence étrangère et les troubles intérieurs."

 cwic_crisis_fiscal_low:0 "Stress budgétaire"
 cwic_crisis_fiscal_low_desc:0 "Les finances publiques se resserrent alors que les recettes peinent à suivre le rythme des dépenses. La pression budgétaire commence à affecter l'investissement public et la flexibilité politique."

 cwic_crisis_fiscal_medium:0 "Pression budgétaire"
 cwic_crisis_fiscal_medium_desc:0 "L'État est de plus en plus contraint par sa situation budgétaire. Les obligations croissantes et la diminution de la flexibilité budgétaire commencent à éroder la confiance économique."

 cwic_crisis_fiscal_high:0 "Grave crise budgétaire"
 cwic_crisis_fiscal_high_desc:0 "Les finances publiques sont soumises à de fortes pressions. L'investissement et le développement ralentissent alors que le gouvernement lutte pour maintenir la stabilité budgétaire."

 cwic_crisis_fiscal_extreme:0 "Répartition budgétaire"
 cwic_crisis_fiscal_extreme_desc:0 "L'État est confronté à une profonde crise financière. Les pressions sur les dépenses publiques, le fardeau de la dette et la faible capacité de recettes paralysent la capacité du gouvernement à gérer l'économie."


 cwic_crisis_economic_contraction_low:0 "Ralentissement économique"
 cwic_crisis_economic_contraction_low_desc:0 "L'activité économique a commencé à ralentir. Les entreprises sont prudentes et les investissements s'affaiblissent, même si l'économie dans son ensemble reste fonctionnelle."

 cwic_crisis_economic_contraction_medium:0 "Contraction économique"
 cwic_crisis_economic_contraction_medium_desc:0 "L'économie se contracte à mesure que les investissements diminuent et que la productivité s'affaiblit. Les conditions d'emploi se détériorent."

 cwic_crisis_economic_contraction_high:0 "Grave récession"
 cwic_crisis_economic_contraction_high_desc:0 "La production et l'emploi diminuent rapidement. La confiance économique s'est érodée, aggravant la contraction."

 cwic_crisis_economic_contraction_extreme:0 "Effondrement économique"
 cwic_crisis_economic_contraction_extreme_desc:0 "L'économie est en chute libre. L'investissement, l'emploi et la productivité s'effondrent sous de fortes pressions structurelles."


 cwic_crisis_inflation_low:0 "Inflation en hausse"
 cwic_crisis_inflation_low_desc:0 "Les prix augmentent dans l'ensemble de l'économie, exerçant une pression croissante sur les ménages et les entreprises."

 cwic_crisis_inflation_medium:0 "Pression inflationniste"
 cwic_crisis_inflation_medium_desc:0 "L'inflation se propage à travers les salaires et les prix à la consommation. La stabilité économique est de plus en plus menacée."

 cwic_crisis_inflation_high:0 "Inflation sévère"
 cwic_crisis_inflation_high_desc:0 "L'inflation rapide fausse l'activité économique et érode le pouvoir d'achat."

 cwic_crisis_inflation_extreme:0 "Inflation galopante"
 cwic_crisis_inflation_extreme_desc:0 "L'économie est déstabilisée par une inflation galopante. Les prix accélèrent plus vite que les salaires et les investissements productifs."


 cwic_crisis_deflation_low:0 "Dérive déflationniste"
 cwic_crisis_deflation_low_desc:0 "Les prix commencent à baisser. Même si les consommateurs en profitent à court terme, les entreprises deviennent prudentes."

 cwic_crisis_deflation_medium:0 "Pression déflationniste"
 cwic_crisis_deflation_medium_desc:0 "La baisse des prix affaiblit les investissements et ralentit l'activité économique."

 cwic_crisis_deflation_high:0 "Déflation sévère"
 cwic_crisis_deflation_high_desc:0 "Les entreprises réduisent les salaires et les investissements à mesure que la déflation se propage à l'ensemble de l'économie."

 cwic_crisis_deflation_extreme:0 "Spirale déflationniste"
 cwic_crisis_deflation_extreme_desc:0 "L'économie est piégée dans un cycle destructeur de baisse des prix, d'effondrement des investissements et d'affaiblissement de la production."


 cwic_crisis_energy_low:0 "Stress lié à l'approvisionnement énergétique"
 cwic_crisis_energy_low_desc:0 "Les approvisionnements en énergie se resserrent, augmentant les coûts et réduisant l'efficacité industrielle."

 cwic_crisis_energy_medium:0 "Pénuries d'énergie"
 cwic_crisis_energy_medium_desc:0 "Les contraintes énergétiques commencent à perturber la production industrielle et l'activité économique."

 cwic_crisis_energy_high:0 "Grave crise énergétique"
 cwic_crisis_energy_high_desc:0 "Les pénuries d'énergie perturbent la production dans l'ensemble de l'économie et ralentissent le développement."

 cwic_crisis_energy_extreme:0 "Panne du système énergétique"
 cwic_crisis_energy_extreme_desc:0 "De graves perturbations énergétiques paralysent la production industrielle et la stabilité économique."


 cwic_compound_stagflation_low:0 "Stagflation"
 cwic_compound_stagflation_low_desc:0 "L'inflation et la stagnation se renforcent désormais mutuellement. Les prix continuent d'augmenter alors même que la croissance ralentit et que l'investissement s'affaiblit."

 cwic_compound_stagflation_medium:0 "Stagflation enracinée"
 cwic_compound_stagflation_medium_desc:0 "L'économie est prise entre pressions inflationnistes et croissance faible. L'investissement productif s'essouffle tandis que la hausse des coûts continue de saper la stabilité."

 cwic_compound_stagflation_high:0 "Stagflation sévère"
 cwic_compound_stagflation_high_desc:0 "Une inflation persistante se heurte à une profonde faiblesse économique. La confiance s'effondre alors que l'État peine à restaurer soit la croissance, soit la stabilité des prix."

 cwic_compound_stagflation_extreme:0 "Répartition stagflationniste"
 cwic_compound_stagflation_extreme_desc:0 "L'économie est piégée dans un mélange destructeur d'inflation, de stagnation et de baisse de productivité. La reprise est de plus en plus difficile sans changement structurel majeur."


 cwic_compound_capital_flight_low:0 "Fuite des capitaux"
 cwic_compound_capital_flight_low_desc:0 "Les investisseurs commencent à déplacer leurs capitaux à l'étranger à mesure que la confiance dans l'économie nationale s'affaiblit."

 cwic_compound_capital_flight_medium:0 "Fuite croissante des capitaux"
 cwic_compound_capital_flight_medium_desc:0 "Les sorties de capitaux affaiblissent l'investissement, ralentissent la construction et accroissent l'instabilité économique."

 cwic_compound_capital_flight_high:0 "Fuite sévère des capitaux"
 cwic_compound_capital_flight_high_desc:0 "Les sorties de capitaux à grande échelle sapent la confiance économique et privent le pays des fonds nécessaires à sa reprise."

 cwic_compound_capital_flight_extreme:0 "Évacuation financière"
 cwic_compound_capital_flight_extreme_desc:0 "Les capitaux fuient le pays à un rythme dévastateur, paralysant les investissements, la productivité et la confiance du public dans l'économie."


 cwic_compound_resource_curse_low:0 "Malédiction des ressources"
 cwic_compound_resource_curse_low_desc:0 "La dépendance à l'égard des revenus extractifs commence à fausser l'économie dans son ensemble et à décourager la diversification."

 cwic_compound_resource_curse_medium:0 "Malédiction des ressources enracinée"
 cwic_compound_resource_curse_medium_desc:0 "La dépendance à l'égard des rentes liées aux ressources affaiblit la diversification productive, ralentit l'innovation et renforce les distorsions économiques."

 cwic_compound_resource_curse_high:0 "Malédiction sévère des ressources"
 cwic_compound_resource_curse_high_desc:0 "L'économie est perturbée par la dépendance extractive. La diversification, la recherche et le développement stable sont tous compromis."

 cwic_compound_resource_curse_extreme:0 "Crise de dépendance extractive"
 cwic_compound_resource_curse_extreme_desc:0 "La dépendance aux ressources est devenue une crise structurelle. La croissance est faussée, les institutions s'affaiblissent et le développement à long terme est sacrifié au profit des rentes extractives."


 cwic_compound_militarized_economy_lock_in_low:0 "Économie militarisée"
 cwic_compound_militarized_economy_lock_in_low_desc:0 "L'économie est de plus en plus orientée vers les besoins militaires au détriment de l'efficacité civile."

 cwic_compound_militarized_economy_lock_in_medium:0 "Verrouillage économique militarisé"
 cwic_compound_militarized_economy_lock_in_medium_desc:0 "Les priorités militaires évincent les investissements civils, la recherche et le développement économique en général."

 cwic_compound_militarized_economy_lock_in_high:0 "Un confinement militarisé sévère"
 cwic_compound_militarized_economy_lock_in_high_desc:0 "L'État est devenu profondément dépendant de la production et de la mobilisation militaires, ce qui affaiblit la productivité civile et la résilience économique à long terme."

 cwic_compound_militarized_economy_lock_in_extreme:0 "Économie de guerre permanente"
 cwic_compound_militarized_economy_lock_in_extreme_desc:0 "L'économie est enfermée dans une orientation militaire extrême. Le développement civil, l'innovation et le niveau de vie sont tous sacrifiés pour soutenir la militarisation."

