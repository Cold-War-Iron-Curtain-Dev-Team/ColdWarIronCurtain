 prc.50.d:0 "Mao Zedong a annoncé aujourd'hui à Pékin qu'il démissionnerait aujourd'hui de son poste de Premier ministre de la République populaire de Chine. Il a déclaré qu'il était temps de prendre sa retraite et qu'il souhaitait passer plus de temps avec les gens. Certains partisans de Mao ont déclaré qu'il avait été contraint de démissionner après certaines de ses réformes parce qu'il était trop radical. Ils traqueraient les anti-maoïstes jusqu'à ce que la Chine redevienne pure. Le prochain dirigeant du peuple chinois sera annoncé prochainement."
 prc.85.d:0 "Deng Xiaoping a été démis de ses fonctions de vice-président du Parti communiste chinois et d'autres fonctions politiques. Mao Zedong a déclaré dans son discours d'aujourd'hui que Deng a été emprisonné pour être contre-révolutionnaire et pour son rôle dans ses actes antigouvernementaux contre la direction du Parti. La campagne de Mao Zedong contre les réformistes et les anti-maoïstes se poursuit dans le cadre de sa « Révolution culturelle ». Beaucoup ont applaudi tandis que Mao poursuivait son discours et la destitution de Deng. De nombreux critiques de Mao ont déclaré que Deng avait été démis de ses fonctions uniquement parce qu'il était un critique de Mao et qu'il souhaitait une Chine plus libérale. La révolution culturelle de Mao se poursuit alors que la Chine revient à elle-même."
 prc.75.d:0 "Lin Biao, l'un de nos plus proches alliés et généraux, s'est écrasé et est mort alors qu'il tentait de faire défection en URSS. Il semble qu'il était le chef du projet 571. Le projet 571 est le nom de code de notre leader bien-aimé, Mao Zedong, qui serait assassiné et ensuite un coup d'État serait lancé contre la direction du Parti. N'importe laquelle des forces pro-Mao serait supprimée ou exécutée. Cependant, plusieurs de nos responsables ont découvert le complot et ont tenté de l'arrêter. Il s'est échappé avec sa famille, mais alors qu'il survolait la Mongolie, il s'est écrasé en raison d'un dysfonctionnement de carburant. Avec les rapports trouvés dans son bureau selon lesquels les Soviétiques proposent de soutenir son coup d'État et son leadership, cela nous amène à nous demander si les Soviétiques sont vraiment de notre côté. Nous devons être à l'affût de nouvelles dissidences au sein de notre gouvernement."
 prc.86.d:0 "Liu Shaqoi a été emprisonné par Mao Zedong après que Mao Zedong a déclaré dans un autre discours que Shaqoi avait été arrêté pour trahison envers le gouvernement et le parti. Mao a déclaré que Shaqoi était un partisan du capitalisme et voulait saper le peuple chinois pour son propre bien. Shaqoi a également été accusé de soutenir des actes de terrorisme contre le gouvernement chinois. De nombreux critiques de Mao ont déclaré que c'était une autre façon pour Mao d'acquérir plus de pouvoir et d'éliminer toute opposition à son encontre. Mao a révélé que ses politiques de « révolution culturelle » se poursuivraient et s'intensifieraient pour éliminer tous les traîtres au sein du gouvernement. "

