 generic.1.t:0 "[FROM.GetName] veut nous annexer !"
 generic.1.d:0 "[FROM.GetNameDef] a l'intention d'annexer tout notre territoire pour son profit personnel. Les laissons-nous détruire la culture et l'histoire de notre pays en s'incorporant ou devons-nous riposter pour protéger notre pays et notre peuple ?"
 generic.1.a:0 "La paix par-dessus tout."
 generic.1.b:0 "Nous allons nous battre !"
 generic.2.t:0 "[FROM.GetName] nous invite dans sa faction"
 generic.2.d:0 "[FROM.GetNameDef] veut que nous rejoignions leur faction. Nous pourrions combiner nos forces et lutter contre un ennemi commun."
 generic.2.a:0 "Nous sommes solidaires."
 generic.2.b:0 "Non merci."
 generic.3.t:0 "[FROM.GetName] rejoint notre faction"
 generic.3.d:0 "[FROM.GetNameDef] nous a rejoint et nous sommes désormais unis."
 generic.3.a:0 "Nous sommes solidaires."
 generic.4.t:0 "[FROM.GetName] a refusé notre invitation"
 generic.4.d:0 "[FROM.GetNameDef] ne veut pas rejoindre notre faction."
 generic.4.a:0 "C'est une triste journée."
 generic.5.t:0 "[FROM.GetName] veut unir les pays"
 generic.5.d:0 "[FROM.GetNameDef] veut que nous rejoignions leur pays et que nous nous unissions sous un drapeau commun."
 generic.5.a:0 "Unification!"
 generic.5.b:0 "Non merci."
 generic.6.t:0 "[FROM.GetName] rejoint le pays"
 generic.6.d:0 "[FROM.GetNameDef] fait désormais partie de notre pays."
 generic.6.a:0 "Très bien."
 generic.7.t:0 "[FROM.GetName] refusé notre offre"
 generic.7.d:0 "[FROM.GetNameDef] ne veut pas unifier nos pays."
 generic.7.a:0 "C'est une triste journée."
 generic.8.t:0 "[FROM.GetName] veut rejoindre notre faction"
 generic.8.d:0 "[FROM.GetNameDef] veut que nous unissions nos efforts et devenions membre de notre faction."
 generic.8.a:0 "Ils peuvent adhérer."
 generic.8.b:0 "Non, ils restent dehors."
 generic.9.t:0 "[FROM.GetName] nous a permis de nous joindre"
 generic.9.d:0 "[FROM.GetNameDef] nous a permis de devenir membre de leur faction."
 generic.9.a:0 "Nous combattrons sous le même drapeau."
 generic.10.t:0 "[FROM.GetName] refusé"
 generic.10.d:0 "[FROM.GetNameDef] ne veut pas que nous fassions partie de leur faction."
 generic.10.a:0 "Honte."
 generic.19.t:0 "[FROM.GetName] propose le partage de licence"
 generic.19.d:0 "[FROM.GetNameDef] l'offre est de partager des licences de production."
 generic.19.a:0 "Bien sûr!"
 generic.19.b:0 "Non merci."
 generic.20.t:0 "[FROM.GetName] partage de licence accepté"
 generic.20.d:0 "[FROM.GetNameDef] accepté de partager des licences de production avec nous."
 generic.20.a:0 "Très bien!"
 generic.21.t:0 "[FROM.GetName] partage de licence refusé"
 generic.21.d:0 "[FROM.GetNameDef] ne veut pas partager ses licences de production avec nous."
 generic.21.a:0 "Triste..."
 generic.22.t:0 "[From.GetName] veut rejoindre l'OTAN"
 generic.22.d:0 "[From.GetNameDef] j'aimerais rejoindre l'Alliance défensive de l'OTAN et combattre à nos côtés au cas où l'un de nos membres serait attaqué. Nous les défendrons également lorsqu'ils seront victimes d'une agression."
 generic.22.a:0 "Nous les acceptons."
 generic.22.b:0 "Nous devons les rejeter pour des raisons stratégiques."
 generic.23.t:0 "[From.GetName] accepté notre demande"
 generic.23.d:0 "[From.GetNameDef] a accepté notre demande d'adhésion à l'OTAN. Nous sommes désormais à leurs côtés."
 generic.23.a:0 "Super!"
 generic.24.t:0 "[From.GetName] a rejeté notre demande"
 generic.24.d:0 "[From.GetNameDef] a rejeté notre demande d'adhésion à l'OTAN."
 generic.24.b:0 "Non! Pourquoi?"

 
