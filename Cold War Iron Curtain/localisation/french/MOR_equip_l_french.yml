 MOR_mechanized_heavy_equipment_6_short:0 "AIFV-A1-B-C25"
 MOR_mechanized_heavy_equipment_6_desc:0 " Variante mise à jour de l'AIFV d'origine en suspension de service dans l'armée belge similaire au M113A1-B (similaire au M113A2), un système NBC et un système d'extinction d'incendie au halon."
