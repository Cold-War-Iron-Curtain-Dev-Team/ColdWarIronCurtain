##Infantry Equipment

 MOR_infantry_equipment_0:0 "MAS-36"
 MOR_infantry_equipment_0_short:0 "MAS-36"
 MOR_infantry_equipment_0_desc:0 "Le MAS-36 est un fusil à verrou conçu en 1927 chambré dans une cartouche française de 7,62x54 mm, et a été adopté par l'armée française en 1936 en remplacement des fusils de service Berthier et Lebel. Il a été utilisé en nombre limité pendant la Seconde Guerre mondiale, mais en raison de la production de masse après la fin de la guerre, il a été utilisé dans de nombreux conflits impliquant de nombreuses nations différentes. Les fusils produits après la Seconde Guerre mondiale ont connu quelques améliorations en termes d'ergonomie. Il a même vu quelques variantes qui ont vu l'ajout d'une grenade à fusil amovible et d'un modèle de tireur d'élite. On s'attendait à ce qu'il ne s'agisse que d'un fusil provisoire, construit sur des machines pouvant être utilisées pour construire les fusils à chargement automatique prévus"

 MOR_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 MOR_infantry_equipment_1_short:0 "FN FAL"
 MOR_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. En raison de sa prévalence et de son utilisation répandue parmi les armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le titre de « bras droit du monde libre »."

 MOR_infantry_equipment_2:0 "Pistolet ROMARM Mitraliera modèle 1963/1965"
 MOR_infantry_equipment_2_short:0 "PM md.63/65"
 MOR_infantry_equipment_2_desc:0 "Le Pistol Mitraliera modèle 1963/1965 (en abrégé PM md. 63 ou simplement md. 63) est un fusil d'assaut roumain de 7,62x39 mm. Développé à la fin des années 1950, le PM md. 63 était un dérivé de l'AKM soviétique produit sous licence."

 MOR_infantry_equipment_3:0 "Valmet M76"
 MOR_infantry_equipment_3_short:0 "M76"
 MOR_infantry_equipment_3_desc:0 "version du récepteur en acier estampé, qui ressemble au RK 62 avec des meubles en plastique de style plus récent, mais comporte un récepteur plus léger. Le poids total du RK 62 76 est de 3,27 kg. Contrairement à l'AK-47 et à l'AKM, les pièces internes sont entièrement interchangeables entre le RK 62 et le RK 62 76, la seule différence étant le récepteur."

 MOR_infantry_equipment_4:0 "Beretta AR70/90"
 MOR_infantry_equipment_4_short:0 "AR70/90"
 MOR_infantry_equipment_4_desc:0 "Le Beretta AR70/90 est un fusil à gaz chambré pour la cartouche OTAN de 5,56 × 45 mm et est le fusil de service standard des forces armées italiennes. L'arme est également conçue pour être équipée d'une grenade à fusil et possède des viseurs de grenade. La série AR se décline en de nombreuses variantes telles que l'AR90, avec une crosse pliable en fil, destinée aux parachutistes. "

##MOR tanks

 MOR_lt_equipment_1:0 "Renault R35"
 MOR_lt_equipment_1_short:0 "R35"
 MOR_lt_equipment_2:0 "Lévrier M8"
 MOR_lt_equipment_2_short:0 "Lévrier M8"
 MOR_lt_equipment_3:0 "AMX-13/75"
 MOR_lt_equipment_3_short:0 "AMX-13/75"
 MOR_lt_equipment_4:0 "Saurer-Werk SK-105A1 Kurassier"
 MOR_lt_equipment_4_short:0 "SK-105A1 Kurassier"
 MOR_lt_equipment_5:0 "AMX-10RC"
 MOR_lt_equipment_5_short:0 "AMX-10RC"
 MOR_lt_equipment_5_desc:0 "L'AMX 10RC est un véhicule de reconnaissance à roues de poids moyen armé d'un canon de 105 mm. Le véhicule, fourni par Nexter Systems, est en service dans l'armée française depuis 1980. Il nécessite un équipage de 4 personnes pour piloter le véhicule et pèse environ 15 tonnes."
 
 #MOR_lt_equipment_6:0 "Abdallah Al Faris Company Al Fahd Al Fahd AF-40-80-2"
 #MOR_lt_equipment_6_short:0 "Al Fahd AFRV"

 #MOR_mbt_equipment_0:0 "M4A3 Sherman"
 #MOR_mbt_equipment_0_short:0 "M4A3 Sherman"
 #MOR_mbt_equipment_1:0 ""
 #MOR_mbt_equipment_1_short:0 ""
 MOR_mbt_equipment_2:0 "T-54"
 MOR_mbt_equipment_2_short:0 "T-54"
 MOR_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 MOR_mbt_equipment_3:0 "T-55"
 MOR_mbt_equipment_3_short:0 "T-55"
 MOR_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 MOR_mbt_equipment_4:0 "Char de combat à chenilles complète : canon de 90 mm, M48"
 MOR_mbt_equipment_4_short:0 "M48 Patton"
 MOR_mbt_equipment_4_desc:0 "Le M48 Patton est un CCP conçu par le Département des munitions de l'armée américaine en 1953. Le M48 est doté d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Le moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents avec un système d'injection de carburant léger et est suralimenté. Il a une autonomie de fonctionnement hors route de 160 milles et de 300 milles sur route. Il peut rouler sur route à 30 mph, mais atteint 20 mph hors route grâce au moteur, à la transmission et aux chenilles améliorés. Il a servi de char principal pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton mais il s'agit d'un tout nouveau design avec de nouveaux mécanismes internes. Il est utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la Garde nationale exploitaient et entretenaient encore des M48 jusqu'à la fin des années 80."
 MOR_mbt_equipment_5:0 "Char de combat à chenilles complète : canon de 105 mm, M60"
 MOR_mbt_equipment_5_short:0 "M60 Patton"
 MOR_mbt_equipment_5_desc:0 "Le M60 Patton est un CCP conçu par le département des munitions de l'armée américaine en 1960. Il a été utilisé lors de la guerre du Yom Kippour, de l'invasion de la Grenade, du Yémen et du Liban. Il possède un blindage d'environ 220 mm et porte un canon principal de 105 mm. Il utilisait généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Le moteur est un moteur V12 biturbo amélioré qui peut se déplacer à peu près à la même vitesse que le M48. Cependant, malgré un poids légèrement supérieur à celui du M48, le M60 peut se déplacer à peu près à la même vitesse et sur la même différence. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie et compte ainsi environ 4 variantes. Cela signifiait une augmentation du blindage, du poids et une amélioration de la fiabilité."
 #MOR_mbt_equipment_6:0 ""
 #MOR_mbt_equipment_6_short:0 ""
 #MOR_mbt_equipment_6_desc:0 ""
 MOR_mbt_equipment_7:0 "T-72B"
 MOR_mbt_equipment_7_short:0 "T-72B"
 MOR_mbt_equipment_7_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 MOR_mbt_equipment_8:0 "Char de combat à chenilles complètes : canon de 120 mm, M1A1SA"
 MOR_mbt_equipment_8_short:0 "M1A1SA Abrams"
