 ADR_jet_CAS_equipment_1:0 "Iliouchine IL-10M"
 #ADR_jet_CAS_equipment_1_desc:0 ""
 ADR_jet_CAS_equipment_1_short:0 "IL-10M"
 ADR_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 ADR_jet_CAS_equipment_2_desc:0 "Conversion de chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 ADR_jet_CAS_equipment_2_short:0 "MiG-17bis"
 ADR_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 ADR_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue en dalle entièrement mobile. Equipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il y avait des dispositions pour un pack de fusées non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957 modifié pour permettre le transport de quatre nacelles de fusée."
 ADR_jet_CAS_equipment_3_short:0 "MiG-19S"
 ADR_jet_CAS_equipment_4:0 "Soukhoï Su-7B"
 ADR_jet_CAS_equipment_4_desc:0 "La variante bombardier du Su-7 Fitter-A a volé pour la première fois en mars 1959, puis est entrée en service en 1961. Il deviendra le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B ont été construits, dont beaucoup ont été exportés. L'avion était relativement populaire à l'étranger et servait dans 10 pays. Il a connu un service étendu dans les forces aériennes indiennes et égyptiennes. L'avion reste en service limité en Corée du Nord."
 ADR_jet_CAS_equipment_4_short:0 "Su-7B"
 ADR_jet_CAS_equipment_5:0 "Sukhoï Su-7BKL"
 ADR_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de la colonne vertébrale du fuselage, réservoirs de carburant installés dans les ailes, points d'attache « humides » sous les ailes pour transporter des réservoirs de carburant externes, capables de transporter des bombes nucléaires tactiques."
 ADR_jet_CAS_equipment_5_short:0 "Su-7BKL"
 ADR_jet_CAS_equipment_6:0 "Soukhoï Su-20"
 ADR_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était un développement ultérieur de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers le bloc de l'Est, les forces aériennes arabes et sud-américaines. Le Su-17 a amélioré presque tous les aspects de son prédécesseur, notamment les capteurs, les performances de vol, la charge utile, la portée et le balayage variable des ailes. De 1969 à 1990, 2 867 avions ont été produits et utilisés dans 30 pays, dont 6 utilisent encore l'avion aujourd'hui."
 ADR_jet_CAS_equipment_6_short:0 "Su-20"
 ADR_jet_CAS_equipment_7:0 "Mikoyan-Gourevitch MiG-27M"
 ADR_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes en flèche variable. L'avion est basé sur le MiG-23 mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. De 1970 à 1986, 1 075 avions ont été produits. Le MiG-27 a été utilisé au cours des dernières étapes des guerres soviéto-afghanes et de Kargil. L'avion reste en service limité avec l'Inde et le Kazakhstan."
 ADR_jet_CAS_equipment_7_short:0 "MiG-27M"
 
 ADR_jet_CAS_equipment_8:0 "Soukhoï Su-25K"
 ADR_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. L'avion a effectué son vol inaugural en 1975 et a été introduit en 1981. Depuis 1978, plus de 1 000 avions ont été produits. C'était un avion particulièrement populaire à l'étranger, vendu dans 29 pays. Pour cette raison, le Su-25 a été impliqué dans plusieurs conflits, notamment la guerre soviétique en Afghanistan, l'Iran-Irak et la guerre du Golfe. L'avion reste aujourd'hui en service dans tous les pays d'exportation."
 ADR_jet_CAS_equipment_8_short:0 "Su-25K"

 ADR_cas_stealth_equipment_1:0 "Sukhoï Su-25SM"
 ADR_cas_stealth_equipment_1_short:0 "Su-25SM"
 ADR_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau « abordable » pour le Su-25, conçu par l'armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau du Su-25T et du Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations de l'avionique et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM « Bars » du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle du Su-25 de base et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans celle-ci."

 ADR_jet_tac_bomber_equipment_1:0 "Iliouchine Il-22"
 ADR_jet_tac_bomber_equipment_1_short:0 "Il-22"
 ADR_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il utilisait quatre turboréacteurs Lyulka TR-1 transportés sur de courts pylônes horizontaux devant et sous l'aile. Les moteurs n'atteignaient pas leurs valeurs de poussée nominales et leur consommation de carburant était plus élevée que prévue. Ces problèmes signifiaient que l'avion ne pouvait pas atteindre les performances requises et il fut annulé le 22 septembre 1947."
 ADR_jet_tac_bomber_equipment_2:0 "Iliouchine Il-28"
 ADR_jet_tac_bomber_equipment_2_short:0 "Il-28"
 ADR_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à entrer en production à grande échelle, l'Il-28, lors de son introduction en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été progressivement retirés du service soviétique dans les années 1980, de nombreux avions de ce type sont encore en service aujourd'hui. Le nom de rapport USAF/DoD est Type 27, tandis que le nom de code OTAN est Beagle."
 ADR_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 ADR_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 ADR_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme un avion de combat à ailes en flèche introduit en 1960. Les variantes du bombardier Yak-28, connues sous leur nom de code OTAN Brewer, avaient des moteurs montés sur une nacelle, similaires à la lampe de poche Yak-25 à partir de laquelle il a été développé. Avec cela et l'aile en flèche, c'était un avion hautement subsonique, capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de principal bombardier léger de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, tous étant retirés en 1992."
 ADR_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 ADR_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 ADR_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne \"Initsiativa-2\" Radar de cartographie au sol à 360 degrés ainsi qu'un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs au sol"
 ADR_jet_tac_bomber_equipment_5:0 "Mikoyan-Guérivitch MiG-25RBT"
 ADR_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 ADR_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier de reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 ADR_jet_tac_bomber_equipment_6:0 "Soukhoï Su-24"
 ADR_jet_tac_bomber_equipment_6_short:0 "Su-24"
 ADR_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours utilisé aujourd'hui. Les caractéristiques incluent ses ailes variables et son corps pointu. Il peut équiper jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en conservant une vitesse stable. Cet avion est connu sous son nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement actif comme chasseur-bombardier pour les anciens pays du camp de l'Est."
 ADR_jet_tac_bomber_equipment_7:0 "Soukhoï Su-24"
 ADR_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 ADR_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était un développement ultérieur du Su-24 à partir du moment où le type initial est entré en service. L'une des principales caractéristiques du Su-24M est l'inclusion d'une capacité de ravitaillement en vol avec une sonde de ravitaillement rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, permettant au type d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 #ADR_jet_tac_bomber_equipment_8:0 "Sukhoi Su-34"
 #ADR_jet_tac_bomber_equipment_8_short:0 "Su-34"
 #ADR_jet_tac_bomber_equipment_8_desc:0 "An attacker developed based on the Su-27 with a tandem seat cockpit. It exhibits top class maneuverability for an attacker, with its agile movements competing aggressively with fighters of the same class. Thicker armor also increases its survival rate. The NATO codename is the "Fullback". Assuming attack missions over an extended period of time, the rear section of pilot seats has a basin and a simple kitchen."
 

