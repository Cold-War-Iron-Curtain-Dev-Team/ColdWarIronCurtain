 ADR_jet_multirole_equipment_1:0 "Mikoyan-Gourevitch MiG-9"
 ADR_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo a été le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948. Il a été utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 avions furent produits, uniquement par l'URSS. Les derniers MiG 9 furent mis hors service par la RPC en 1951."
 ADR_jet_multirole_equipment_1_short:0 "MiG-9"
 ADR_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 ADR_jet_multirole_equipment_2_desc:0 "Peut-être l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des Américains F-86 Sabre et F9F Panther. Une section de la frontière sino-coréenne a été surnommée MiG Alley en raison de sa présence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Même si la plupart des avions ont été mis hors service dans les années 1950, certains restent toujours en service dans l'armée de l'air nord-coréenne."
 ADR_jet_multirole_equipment_2_short:0 "MiG-15"
 ADR_jet_multirole_equipment_3:0 "Mikoyan-Gourevitch MiG-17"
 ADR_jet_multirole_equipment_3_desc:0 "Un successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence par la PLAAF sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, répartis en Afrique, en Europe et en Asie. Son premier déploiement de combat a eu lieu en 1958, lorsque les MiG de la RPC se sont affrontés avec les F-86 Sabres nationalistes chinois au-dessus du détroit de Taiwan. Cependant, le MiG-17 a été principalement utilisé dans la guerre du Vietnam avec la NVAF et la PLAAF où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même résisté aux chasseurs supersoniques américains Phantom II, beaucoup plus modernes, de la guerre du Vietnam. Le MiG-17 a été généralement mis hors service dans les années 1970, alors qu'il reste encore en service limité dans certains pays africains et en Corée du Nord."
 ADR_jet_multirole_equipment_3_short:0 "MiG-17"
 ADR_jet_multirole_equipment_4:0 "Mikoyan-Gourevitch MiG-19"
 ADR_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de production soviétique capable d'atteindre des vitesses supersoniques en vol en palier. Un chasseur américain comparable de la « Century Series » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les plus modernes McDonnell Douglas F-4 Phantom II et le Republic F-105 Thunderchief au-dessus du Nord-Vietnam."
 ADR_jet_multirole_equipment_4_short:0 "MiG-19"
 ADR_jet_multirole_equipment_5:0 "Mikoyan-Gourevitch MiG-21F-13"
 ADR_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles au-delà de la portée visuelle et un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, un nombre particulièrement important ayant été construit sous licence en Chine et en Inde. Plus de 11 000 exemplaires ont été construits et servent dans plus de 60 pays répartis sur 5 continents. Au cours de leur durée de vie, les MiG-21 ont réalisé 240 attaques aériennes. Le MiG-21 a servi dans de nombreux conflits, notamment au Vietnam (où il a connu d'énormes succès), dans la guerre indo-pakistanaise de 1971, dans la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il reste en service après plus de 6 décennies."
 ADR_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 ADR_jet_multirole_equipment_6:0 "Mikoyan-Gourevitch MiG-21PF"
 ADR_jet_multirole_equipment_6_desc:0 "Version de production de l'intercepteur tous temps. Ceux-ci étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T (alias RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 pour permettre l'utilisation de l'AAM à faisceaux RS-2US (alias K-5MS) en plus du K-13 à recherche IR."
 ADR_jet_multirole_equipment_6_short:0 "MiG-21PF"
 ADR_jet_multirole_equipment_7:0 "Mikoyan-Gourevitch MiG-23M"
 ADR_jet_multirole_equipment_7_desc:0 "le MiG-23 a été le premier chasseur soviétique à disposer d'un radar de surveillance et d'abattage et l'un des premiers à être armé de missiles au-delà de la portée visuelle. La production a commencé en 1969 et a atteint un grand nombre avec plus de 5 000 avions construits, ce qui en fait l'avion à voilure variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service limité auprès de certains clients exportateurs."
 ADR_jet_multirole_equipment_7_short:0 "MiG-23M"
 ADR_jet_multirole_equipment_8:0 "Mikoyan-Gourevitch MiG-23ML"
 ADR_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment la solidité et la fiabilité de la cellule, les performances du moteur, la maniabilité et les performances du radar. Une refonte considérable de la cellule a été réalisée, aboutissant au MiG-23ML."
 ADR_jet_multirole_equipment_8_short:0 "MiG-23ML"
 ADR_jet_multirole_equipment_9:0 "Mikoyan-Gourevitch MiG-23MLD"
 ADR_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de la mise à niveau était d'améliorer la maniabilité, en particulier lors d'une AoA élevée, ce qui a été identifié comme le principal défaut du MiG-23M/ML. Le boom de Pitot était équipé de générateurs de vortex, et les racines entaillées du bord d'attaque de l'aile étaient en « dents de scie » pour agir également comme générateurs de vortex. Le système de commande de vol incorporait le dispositif d'arrêt de manche synthétique/limiteur de signaux SOS-3-4."
 ADR_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 ADR_jet_multirole_equipment_10:0 "Mikoyan-Gourevitch MiG-29A"
 ADR_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le Mikoyan Design Bureau. C'était le premier chasseur de 4e génération à entrer en service en URSS et dans le bloc de l'Est. Intégrant une avionique améliorée et des capacités radar considérablement améliorées. Les premiers MiG-29 ont été utilisés comme entraîneurs par le Pacte de Varsovie avec des exportations limitées vers l'Inde mais avaient une utilisation limitée au combat. Le MiG-29 deviendra plus tard la base de variantes largement produites telles que le MiG-29S, le MiG-29M et le MiG-35."
 ADR_jet_multirole_equipment_10_short:0 "MiG-29A"

 ADR_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 ADR_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 ADR_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une révision du MiG-29 de base. Il a acquis une capacité multirôle plus robuste grâce à une utilisation améliorée d'armes air-air et air-sol de haute précision. Il présentait également une portée de combat considérablement accrue, grâce à une augmentation de sa capacité de carburant interne.[5]Quelques changements ont eu lieu au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger aluminium-lithium pour augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été révisée, les persiennes d'admission supérieures ont été supprimées pour laisser la place à plus de carburant dans les LERX, des tamis à mailles ont été introduits pour éviter les dommages causés par des corps étrangers (FOD) et les dimensions d'entrée ont été agrandies pour un débit d'air plus élevé."
 
 ADR_jet_light_equipment_1:0 "Yakovlev Yak-18"
 ADR_jet_light_equipment_1_short:0 "Yak-18"
 ADR_jet_light_equipment_2:0 "Mikoyan-Gourevitch MiG-15UTI"
 ADR_jet_light_equipment_2_short:0 "MiG-15UTI"
 ADR_jet_light_equipment_3:0 "L-29 Delfin"
