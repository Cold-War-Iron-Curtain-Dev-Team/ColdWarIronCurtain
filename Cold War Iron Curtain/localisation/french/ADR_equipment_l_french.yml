 ADR_recon_equipment_0:0 "Tupolev Tu-2R"
 ADR_recon_equipment_0_short:0 "Tu-2R"
 ADR_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 ADR_jet_recon_equipment_0:0 "Mikoyan-Gourevitch MiG-15Rbis"
 ADR_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 ADR_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé le développement d'une variante de reconnaissance de première ligne du MiG-15 avec une caméra AFA-BA/40, qui fournit une largeur de levé en bande de 0,9 à 4,5 km avec une longueur de route de photographie de 90 à 450 km à des altitudes de 2 000 à 10 000 m. Un seul canon NR-23 a été installé sur l'avion. Pour augmenter la portée du scout, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur \"Barium-M\" et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur la machine."
 ADR_jet_recon_equipment_1:0 "Mikoyan-Gourevitch MiG-25RB"
 ADR_jet_recon_equipment_1_short:0 "MiG-25RB"
 ADR_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les tests ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. Le matériel photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station d'interférence radio active SPS-141"
 ADR_jet_recon_equipment_2:0 "Sukhoï Su-24MR"
 ADR_jet_recon_equipment_2_short:0 "Su-24MR"
 ADR_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi de terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, la caméra TV « Aist-M » (« Cigogne »), le radar aéroporté latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et l'infrarouge « Zima » (« Hiver »). Système de reconnaissance. D'autres capteurs sont transportés sous forme de pod."
 
 ADR_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière réduit avec une verrière de vision panoramique. Sa structure métallique plus légère permettait une charge de carburant et un armement accrus par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en faisait l'un des chasseurs soviétiques les plus produits de la Seconde Guerre mondiale."
 ADR_heavy_fighter_equipment_2_desc:0 "Développement ultérieur du Pe-2, le Pe-3 était un avion de combat de nuit dédié lors de son introduction en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi un chemin comparable à ceux empruntés par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et bien que la seule usine responsable de la construction de ce type ait été évacuée à la suite de la bataille, le Pe-3 a été utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 ADR_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une évolution du La-9 « Fritz » pour créer un chasseur d'escorte à longue portée. L'avion était équipé de pneus plus gros pour s'adapter à l'augmentation du poids et aux commodités pour les longs vols, comme un rembourrage accru du siège, des accoudoirs et un urinoir. De plus, une suite complète de radionavigation a été installée. Sans surprise, les performances de combat avec une pleine charge de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances augmentaient également. Les pilotes de La-11 en service soviétique et plus tard chinois serviraient dans la défense aérienne, abattant des Mustangs et des avions d'attaque de construction américaine pendant la guerre de Corée. Son nom de rapport à l'OTAN est Fang."

 ADR_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 ADR_jet_interceptor_equipment_1_desc:0 "Le Yak-17 a été exposé publiquement pour la première fois lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Touchino. En fonctionnement, le Yak-17 présentait la plupart des mêmes défauts que son prédécesseur, notamment une vitesse et une autonomie relativement faibles, et un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. D'un autre côté, sa manipulation était très simple et similaire à celle des chasseurs à hélices populaires tels que le Yak-3 et le Yak-9. Cela en faisait une excellente machine de transition vers les chasseurs à réaction."
 ADR_jet_interceptor_equipment_1_short:0 "Yak-17"
 ADR_jet_interceptor_equipment_2:0 "Lavotchkine La-15"
 ADR_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que technologiquement l'avion soit supérieur au MiG-15, le coût de fabrication inférieur du MiG-15 signifiait qu'il était favorisé. L'avion n'a jamais participé à des combats et n'a eu qu'un déploiement limité. Les 235 avions fabriqués ont été mis hors service en 1953. Ils ont été démontés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 ADR_jet_interceptor_equipment_2_short:0 "La-15"
 ADR_jet_interceptor_equipment_3:0 "Mikoyan-Gourevitch MiG-17PF"
 ADR_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 ADR_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 #ADR_jet_interceptor_equipment_4:0 "Sukhoi Su-9"
 #ADR_jet_interceptor_equipment_4_desc:0 "The Sukhoi Su-9 Fishpot was a delta winged Soviet all-weather interceptor developed in the 1950's. The Su-9 made its first complete flight on the 24th of June 1956, entering service 3 years later in 1959. The aircraft was exclusively operated by the 894th Fighter Aviation Regiment of the Soviet Air Force and never saw active combat. The last of the 1150 aircraft manufactured left service in 1979"
 #ADR_jet_interceptor_equipment_4_short:0 "Su-9"
 #ADR_jet_interceptor_equipment_5:0 "Sukhoi Su-11"
 #ADR_jet_interceptor_equipment_5_desc:0 "The Su-11 was an upgraded version of the Sukhoi Su-9 ('Fishpot') interceptor, which had been developed in parallel with the OKB's swept wing Su-7 fighter bomber. Recognizing the Su-9's fundamental limitations, Sukhoi began work on the Su-11."
 #ADR_jet_interceptor_equipment_5_short:0 "Su-11"
 #ADR_jet_interceptor_equipment_6:0 "Sukhoi Su-15"
 #ADR_jet_interceptor_equipment_6_desc:0 "The Sukhoi Su-15 Flagon A was a twinjet interceptor developed by the Soviet Union in the 1960s. The aircraft made its first flight in mid-1962 and, 3 years later entered service with the Soviet Air Force in 1965. From 1965-1979 1290 aircraft were produced. The aircraft also saw service in the Ukrainian Air Force and limited, emergency service in the Russian Air Force. It was officially retired from service in 1996."
 #ADR_jet_interceptor_equipment_6_short:0 "Su-15"
 #ADR_jet_interceptor_equipment_7:0 "Mikoyan-Gurevich MiG-25P"
 #ADR_jet_interceptor_equipment_7_desc:0 "The Mikoyan-Gurevich MiG-25 Foxbat is perhaps, one of the most influential Soviet Aircraft in history. The first MiG-25 prototype took flight in early 1964, officially entering service in 1970. Throughout its lifetime over 1150 aircraft were constructed and sold to numerous nations, including Syria, Iraq and India. The aircraft was designed to rapidly intercept extreme high altitude aircraft like the U-2 and B-58 with blistering speed. The aircraft gave the Soviet Union far superior control over their own, remote airspace than any time before. It is still in limited service with the Russian Air Force today."
 #ADR_jet_interceptor_equipment_7_short:0 "MiG-25P"
 #ADR_jet_interceptor_equipment_8:0 "Mikoyan-Gurevich MiG-31"
 #ADR_jet_interceptor_equipment_8_desc:0 "The MiG-31 Foxhound is the direct successor to the MiG-25 and was designed as a comprehensive replacement. The aircraft shares most design elements with the MiG-25 featuring mostly internal changes. The MiG-31 has 2 seats and superior sensors and engines, the cockpit was also modernized to support a heads-up display and newer air-to-air missile systems. From 1975-1994 519 MiG-31s were produced. It remains in service with the Russian Air Force and Kazakhstan Air Force. It one of the fastest combat aircraft in service today."
 #ADR_jet_interceptor_equipment_8_short:0 "MiG-31"
 #ADR_jet_interceptor_equipment_9:0 "Sukhoi Su-27S"
 #ADR_jet_interceptor_equipment_9_desc:0 "The Su-27S Flanker B is the initial production variant of the Soviet designed Sukhoi Su-27 fighter. The aircraft was intended as the direct competitor to the F-14 Tomcat and F-15 Eagle. After making its maiden flight in 1977 it entered service later in 1985. It's primary role was long range air defense against American B-1 and B-52 bombers, also to provide long-range escort for Soviet intercontinental strategic bombers. So far 809 aircraft have been produced, which still see service in the Russian Air Force. Other operators include: Indonesia, Ukraine, Vietnam and China (Designated J-11), among others. The aircraft will remain in service for the foreseeable future."
 #ADR_jet_interceptor_equipment_9_short:0 "Su-27S"

