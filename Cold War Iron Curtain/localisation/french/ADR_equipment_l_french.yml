#Austria

 ADR_infantry_equipment_0:0 "Mousqueton 98 kurz"
 ADR_infantry_equipment_0_short:0 "Mousqueton 98k"
 ADR_infantry_equipment_0_desc:0 "Un fusil à verrou emblématique adopté par la Wehrmacht en 1935 comme fusil de service standard. C'était l'un des derniers développements de la longue lignée de fusils militaires Mauser. Bien que complété par des fusils semi-automatiques et entièrement automatiques pendant la Seconde Guerre mondiale, il est resté le principal fusil de service allemand jusqu'à la fin de la guerre en 1945. Malgré le nombre croissant de fusils semi-automatiques et entièrement automatiques, le Kar98k continue d'être utilisé des deux côtés du rideau de fer."

 ADR_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 ADR_infantry_equipment_1_short:0 "AK-47"
 ADR_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 ADR_infantry_equipment_2:0 "Avtomat Kalachnikova Modernizirovanniy"
 ADR_infantry_equipment_2_short:0 "AKM"
 ADR_infantry_equipment_2_desc:0 "L'AKM est une variante modernisée de l'AK47 développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'armée soviétique en 1959. Une grande partie de l'arme a été optimisée et repensée pour répondre aux besoins de l'armée en cours de modernisation. De nombreuses pièces ont été simplifiées pour la production en série et le récepteur en acier fraisé a été remplacé par un emboutissage en acier en forme de U pour améliorer les taux de production. L'arme était également beaucoup plus légère grâce aux simplifications réduisant son poids. D'environ 30 %. De plus, l'arme a été renforcée pour la rendre plus solide et des rails de guidage ont été ajoutés pour améliorer le mouvement du porte-boulon. L'AKM a été utilisé immédiatement et partout par de nombreux pays communistes et fabriqué pour les conflits pendant toute sa durée de vie. Notamment lors de l'invasion de la Tchécoslovaquie, où il a été utilisé par les deux camps."

 ADR_infantry_equipment_3:0 "Pistolet-maschinen Avtomat Kalachnikova-74N"
 ADR_infantry_equipment_3_short:0 "MPi-AK-74N"
 ADR_infantry_equipment_3_desc:0 "En 1981, la DDR a acquis une licence pour fabriquer l'AK-74, après quoi plusieurs modifications ont été apportées à l'arme. Le nouvel échantillon a été indexé MPi AK-74N. Les changements consistaient en la fabrication d'une nouvelle crosse et d'un nouveau devant, en plastique gris-bleu (moins souvent brun foncé). La crosse avait une structure pointillée caractéristique. La variante avec une crosse pliable a reçu la variante MPi AKS-74N. Le fusil d'assaut MPi AK-74NK a également été développé, doté d'un canon raccourci."
 
 ADR_infantry_equipment_4:0 "Pistolet-machine KM-90"
 ADR_infantry_equipment_4_short:0 "MPi-90"
 ADR_infantry_equipment_4_desc:0 "La création du Wieger MPi-90 est la tentative de l'Allemagne de l'Est de développer son propre système d'armes légères, indépendant de l'Union soviétique, mais basé sur l'AK-74 chambré pour 5,56x45 mm OTAN."
 

 ########## NEW ADR ARMOR
 ADR_lt_equipment_1:0 "Steyr ADGZ"
 ADR_lt_equipment_1_short:0 "ADGZ"
 ADR_lt_equipment_2:0 "T-70"
 ADR_lt_equipment_2_short:0 "T-70"
 ADR_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et l'a terminé en 1942. Au cours des deux années de fabrication, 8 300 exemplaires ont été produits. Le char avait un canon beaucoup plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 ADR_lt_equipment_3:0 "PT-76"
 ADR_lt_equipment_3_short:0 "PT-76"
 ADR_lt_equipment_3_desc:0 "Le PT76 est un char léger amphibie soviétique et a été largement exporté dans le monde entier. Il a été conçu par N Shashmyrin et Zh Kotin en 1951 et environ 12 000 unités ont été fabriquées. Il nécessite un équipage de 3 hommes et un moteur V6 six cylindres en ligne avec une vitesse de 44 km/h et peut nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique et à tendance soviétique et, en tant que tel, a joué un rôle de reconnaissance dans pratiquement tous les conflits des nations de la sphère soviétique. Cependant, il est encore utilisé aujourd'hui dans de nombreux pays en raison de sa célèbre fiabilité et de sa facilité d'entretien."
 ADR_lt_equipment_4:0 "PT-76B modèle 4"
 ADR_lt_equipment_4_short:0 "PT-76B"
 ADR_lt_equipment_4_desc:0 "PT-76 armé du canon de char rayé D-56TS de 76,2 mm (frein de bouche à double chicane, éjecteur de cartouche, extracteur de fumée et système de stabilisation à 2 axes STP-2P 'Zarya'),[4] le système de protection NBC PAZ (protivo-atomnaya zashchita), un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, une filtration-ventilation système, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1 800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 ADR_lt_equipment_5:0 "BRM-1K"
 ADR_lt_equipment_5_short:0 "BRM-1K"
 ADR_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule de reconnaissance d'origine soviétique de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les itinéraires et détecter les formations ennemies."
 ADR_lt_equipment_6:0 "BRM-3K"
 ADR_lt_equipment_6_short:0 "BRM-3K"
 ADR_lt_equipment_6_desc:0 "Le BRM-3K Rys a été développé au début des années 1990. Il était destiné à compléter et remplacer le véhicule de reconnaissance BRM-1K. Il est basé sur le châssis du véhicule de combat d'infanterie BMP-3. Bien que le BRM-3K ait été officiellement accepté par l'armée russe en 1995, il est encore en production à faible cadence."

 ADR_mbt_equipment_0:0 "Panzerkampfwagen IV"
 ADR_mbt_equipment_0_short:0 "PanzerIV"
 ADR_mbt_equipment_1:0 "T-34-85M"
 ADR_mbt_equipment_1_short:0 "T-34-85M"
 ADR_mbt_equipment_2:0 "T-54"
 ADR_mbt_equipment_2_short:0 "T-54"
 ADR_mbt_equipment_2_desc:0 "Le char T-54 était le char le plus produit de l'histoire. Le char a été conçu en 1946 par KMBD. Le char lui-même utilise un canon rayé de 100 mm et possède différentes épaisseurs de blindage allant de 205 mm à 60 mm. Le moteur lui-même est un moteur diesel V-12 de 38,88 litres et le réservoir utilise une suspension à barre de torsion et était capable d'atteindre des vitesses allant jusqu'à 48 km/h. Le char lui-même a été utilisé dans plus de 50 armées à travers le monde et a été produit dans toute la sphère soviétique et dans tous ses conflits. "
 ADR_mbt_equipment_3:0 "T-55"
 ADR_mbt_equipment_3_short:0 "T-55"
 ADR_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L'OKB-520 a modifié la conception du T-55 en améliorant la protection NBC, en lui donnant un moteur plus optimisé, en améliorant la forme de la tourelle et en ajoutant même davantage d'équipements auxiliaires tels qu'un contrôle de tir et une optique améliorés. De plus, le T-55 utilisait plus souvent le 12,7 DShK HMG tandis que le T-54 utilisait le canon 7,62 SGMT, ce qui lui accordait plus de puissance de feu mais l'empêchait de transporter plus de munitions. Le T-55 a été utilisé dans autant d'armées et a généralement été témoin de tous les conflits que le T-54 a vus. "
 ADR_mbt_equipment_4:0 "T-62"
 ADR_mbt_equipment_4_short:0 "T-62"
 ADR_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Le T-62 utilise un canon à canon lisse et possède un blindage légèrement plus épais. Le canon principal a également été augmenté à 115 mm. Il a été initialement commandé par l'Union soviétique dans le but d'améliorer sa puissance de feu et le bureau d'études OKB-520 a terminé le projet vers 1960. Bien qu'il s'agisse d'une amélioration, la production n'a pas été abandonnée car son coût était nominalement plus élevé que celui du T-55. Plus de 22 700 T-62 ont été fabriqués et ont été le théâtre de nombreux combats dans toute la sphère soviétique, mais surtout au Moyen-Orient. Ses améliorations ont montré une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique. "
 ADR_mbt_equipment_5:0 "T-62M"
 ADR_mbt_equipment_5_short:0 "T-62M"
 #ADR_mbt_equipment_5_desc:0 ""
 ADR_mbt_equipment_6:0 "T-72"
 ADR_mbt_equipment_6_short:0 "T-72"
 ADR_mbt_equipment_6_desc:0 "Le T-72 est un CCP soviétique créé comme une nouvelle génération de chars, principalement pour remplacer le T-62 et son homologue coûteux, le T-64. Il coûtait presque la moitié du prix du T-64 et comportait de vastes améliorations. Sa conception a été achevée en 1973 par Leonid Venediktov et a montré des capacités incroyables. Le canon et le blindage étaient toujours respectivement de 125 mm et composites, mais avec une conception beaucoup plus économique et plus facile à produire. Le moteur est un V-12 de 780 ch qui pourrait être ultérieurement réaménagé avec une conception de 1 130 ch. Le char pouvait atteindre une mobilité incroyable, atteignant des vitesses de 80 km/h et pouvait mieux s'adapter aux terrains plus difficiles que le T-64. Il a été utilisé dans tous les conflits de la sphère soviétique, contrairement au T-64, et y a également fait preuve d'incroyables capacités. Le char a également été largement utilisé dans des conflits hors de la sphère africaine, au Moyen-Orient et en Indochine."
 ADR_mbt_equipment_7:0 "T-72M1"
 ADR_mbt_equipment_7_short:0 "T-72M1"
