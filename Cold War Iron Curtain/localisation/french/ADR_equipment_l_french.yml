 ADR_fighter_equipment_3_short:0 "Ta 152"
 ADR_jet_multirole_equipment_1:0 "Mikoyan-Gurevich MiG-9"
 ADR_jet_multirole_equipment_1_desc:0 "The MiG-9 Fargo was the first Mikoyan designed jet aircraft of the post WW2 era. Introduced in 1948. It saw limited combat and training use during the Chinese Civil War and Korean War. In total 610 aircraft were produced, solely by the USSR. The final MiG 9's were decommissioned by the PRC in 1951."
 ADR_jet_multirole_equipment_1_short:0 "MiG-9"
 ADR_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 ADR_jet_multirole_equipment_2_desc:0 "Perhaps one of the most iconic fighters of the Cold War, the Mikoyan-Gurevich MiG-15 Fagot entered service in 1947. The MiG-15 was involved in many conflicts since its introduction in the Korean War, where it proved a worthy adversary to the American F-86 Sabre and F9F Panther. A section of the Korean-Chinese border was nicknamed MiG Alley because of their prevalence in the area. Over 18 000 MiG-15s were built and used by many nations, most notably the USSR and Eastern Bloc nations. While most aircraft were decommissioned in the 1950's, some still remain in service with the North Korean Air Force."
 ADR_jet_multirole_equipment_2_short:0 "MiG-15"
 ADR_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 ADR_jet_multirole_equipment_3_desc:0 "A direct successor to the MiG-15 Fagot. Over 10 000 MiG-17 Fresco were produced from 1952. The MiG-17 was license built in the PLAAF as the Shenyang J-5. In total 20 nations used the MiG-17, spanning Africa, Europe and Asia. Its first combat deployment was in 1958, when PRC MiGs clashed with Nationalist Chinese F-86 Sabres over the Taiwan Strait. However, the MiG-17 primarily saw use in the Vietnam war with the NVAF and PLAAF were it scored 28 aerial victories. The MiG-17 was so successful that it even held its own against the much more modern, supersonic American Phantom II fighters of the Vietnam war. The MiG-17 was generally decommissioned in the 1970's, while it still remains in limited service in some African nations and North Korea."
 ADR_jet_multirole_equipment_3_short:0 "MiG-17"
 ADR_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 ADR_jet_multirole_equipment_4_desc:0 "The MiG-19 was the first Soviet production aircraft capable of supersonic speeds in level flight. A comparable U.S. \"Century Series\" fighter was the North American F-100 Super Sabre, although the MiG-19 primarily fought against the more modern McDonnell Douglas F-4 Phantom II and Republic F-105 Thunderchief over North Vietnam."
 ADR_jet_multirole_equipment_4_short:0 "MiG-19"
 ADR_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 ADR_jet_multirole_equipment_5_desc:0 "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 ADR_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 ADR_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 ADR_jet_multirole_equipment_6_desc:0 "Production version of the all-weather interceptor. These were powered by the R11F2-300 turbojet and, starting with the seventh production batch, fitted with the RP-21 radar (the first six batches used the older TsD-30T radar (aka RP-9-21). Further, the weapons control system was modified from that of the F-13 to allow use of the RS-2US (aka K-5MS) beam-riding AAM in addition to the IR-seeking K-13."
 ADR_jet_multirole_equipment_6_short:0 "MiG-21PF"
 ADR_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 ADR_jet_multirole_equipment_7_desc:0 "the MiG-23 was the first Soviet fighter to field a look-down/shoot-down radar and one of the first to be armed with beyond-visual-range missiles. Production started in 1969 and reached large numbers with over 5,000 aircraft built, making it the most produced variable-sweep wing aircraft in history. Today the MiG-23 remains in limited service with some export customers."
 ADR_jet_multirole_equipment_7_short:0 "MiG-23M"
 ADR_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 ADR_jet_multirole_equipment_8_desc:0 "The early \"Flogger\" variants had a number of design shortcomings, including airframe strength and reliability, engine performance, maneuverability and radar performance. A considerable redesign of the airframe was conducted, resulting in the MiG-23ML."
 ADR_jet_multirole_equipment_8_short:0 "MiG-23ML"
 ADR_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 ADR_jet_multirole_equipment_9_desc:0 "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 ADR_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 ADR_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 ADR_jet_multirole_equipment_10_desc:0 "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 ADR_jet_multirole_equipment_10_short:0 "MiG-29A"
 ADR_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 ADR_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 ADR_mr_stealth_fighter_equipment_1_desc:0 "The MiG-29M/M2 aircraft is a revision of the basic MiG-29. It achieved a more robust multi-role capability with enhanced use of air-to-air and air-to-ground high-precision weapons. It also featured a considerably increased combat range, owing to an increase in its internal fuel capacity.[5]A few changes took place during the aircraft's development. The redesigned airframe was constructed from a lightweight Aluminium-lithium alloy to increase the thrust-to-weight ratio. The air intake ramps' geometry was revised, the upper intake louvers were removed to make way for more fuel in the LERXs, mesh screens introduced to prevent foreign object damage (FOD) and inlet dimensions were enlarged for higher airflow."
 ADR_jet_light_equipment_1:0 "Yakovlev Yak-18"
 ADR_jet_light_equipment_1_short:0 "Yak-18"
 ADR_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 ADR_jet_light_equipment_2_short:0 "MiG-15UTI"
 ADR_jet_light_equipment_3:0 "L-29 Delfin"
 ADR_jet_light_equipment_3_short:0 "L-29 Delfin"
 ADR_jet_light_equipment_4:0 "Aero L-39 Albatros"
 ADR_jet_light_equipment_4_short:0 "L-39 Albatros"
 ADR_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 ADR_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 ADR_recon_equipment_0:0 "Tupolev Tu-2R"
 ADR_recon_equipment_0_short:0 "Tu-2R"
 ADR_recon_equipment_0_desc:0 "Reconnaissance version of the Tu-2."
 ADR_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 ADR_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 ADR_jet_recon_equipment_0_desc:0 "In April 25, 1950 the OKB MiG started development a MiG-15 front-line reconnaissance variant with an AFA-BA/40 camera, which provides a strip survey width from 0.9 to 4.5 km with the length of the photographing route from 90 to 450 km at altitudes from 2000 to 10000m. Only one NR-23 cannon was installed on the aircraft. To increase the scout's range, D4-50 locks were subsequently installed on the beams, allowing 600-liter fuel tanks of improved shape to be suspended under the wing. In addition, a transponder \"Barium-M\" and additional 2 liter oxygen cylinder was installed on the machine."
 ADR_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-25RB"
 ADR_jet_recon_equipment_1_short:0 "MiG-25RB"
 ADR_jet_recon_equipment_1_desc:0 "MiG-25RB - single-seat all-altitude operational reconnaissance aircraft - bomber. Testing was completed in December 1970. The aircraft was equipped with 2-4 general reconnaissance cameras A-70M and one topographic AFA-E/10. The photographic equipment was housed in five compartments located at the bottom of the forward fuselage. a SIGINT station called SPS-4A or B 'Virage' was also installed, operating in different frequency ranges. Special equipment - active radio interference station SPS-141"
 ADR_jet_recon_equipment_2:0 "Sukhoi Su-24MR"
 ADR_jet_recon_equipment_2_short:0 "Su-24MR"
 ADR_jet_recon_equipment_2_desc:0 "Dedicated tactical reconnaissance variant. The Su-24MR retains much of the Su-24M's navigation suite, including the terrain-following radar, but deletes the Orion-A attack radar, the laser/TV system, and the cannon in favor of two panoramic camera installations, 'Aist-M' ('Stork') TV camera, RDS-BO 'Shtik' ('Bayonet') side-looking airborne radar (SLAR), and 'Zima' ('Winter') infrared reconnaissance system. Other sensors are carried in pod form."
 ADR_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 ADR_heavy_fighter_equipment_1_short:0 "Yak-9"
 ADR_heavy_fighter_equipment_1_desc:0 "The Yak-9 had a cut down rear fuselage with an all-around vision canopy. Its lighter metal structure allowed for an increased fuel load and armament over previous models build from wood. The Yak-9 was manoeuvrable at high-speed at low and medium altitudes and easy to control, which made it one of most produced Soviet fighters of World War II."
 ADR_heavy_fighter_equipment_2:0 "Petlyakov Pe-3"
 ADR_heavy_fighter_equipment_2_short:0 "Pe-3"
 ADR_heavy_fighter_equipment_2_desc:0 "A further development from the Pe-2, the Pe-3 was a dedicated night-fighter aircraft when introduced in 1941, the same year as its stablemate, the Pe-2. Its design and use followed a comparable path to those taken by the German Luftwaffe with the Junkers Ju 88 and the British Royal Air Force with the De Havilland Mosquito. Used with distinction during the Battle of Moscow, and despite the sole factory responsible for building the type being evacuated as a result of the battle, the Pe-3 was used throughout the conflict, with later production runs dedicated to building reconnaissance variants of the type."
 ADR_heavy_fighter_equipment_3:0 "Lavochkin La-11"
 ADR_heavy_fighter_equipment_3_short:0 "La-11"
 ADR_heavy_fighter_equipment_3_desc:0 "Developed in 1947, after WWII ended, the La-11 was a further development of the La-9 'Fritz' to create a long-range escort fighter. The aircraft was fitted with larger tires to accommodate the increased weight and amenities for long flights such as increased padding in the seat, armrests, and a urinal. In addition, a full radio navigation suite was installed. Not surprisingly, combat performance with a full fuel load suffered. However, as the fuel load approached that of La-9, so did the performance. La-11 pilots in Soviet and later Chinese service would serve in air defense, shooting down American-built Mustangs and attack aircraft during the Korean War. Its NATO reporting name is Fang."
 ADR_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 ADR_jet_interceptor_equipment_1_desc:0 "The Yak-17 was first publicly displayed at the Soviet Aviation Day of 1949, at Tushino Airfield. In operation, the Yak-17 had most of the same faults as its predecessor, including relatively low speed and range, and an unreliable engine (still based upon the German Junkers Jumo 004) with a complicated starting procedure. On the other hand, its handling was very simple, and similar to popular propeller fighters such as the Yak-3 and Yak-9. This made it an excellent transitional machine to jet fighters."
 ADR_jet_interceptor_equipment_1_short:0 "Yak-17"
 ADR_jet_interceptor_equipment_2:0 "Lavochkin La-15"
 ADR_jet_interceptor_equipment_2_desc:0 "The Lavochkin La-15 Fantail was introduced to the Soviet Air Force in 1949. While technologically the aircraft was superior to the MiG-15, the lower manufacture cost of the MiG-15 meant that it was favored. The aircraft never saw combat and only limited deployment. The 235 aircraft that were manufactured were decommissioned by 1953. They were stripped of their engines and used in nuclear weapons testing."
 ADR_jet_interceptor_equipment_2_short:0 "La-15"
 ADR_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 ADR_jet_interceptor_equipment_3_desc:0 "All-weather fighter-interceptor version equipped with Izumrud radar, 3 x 23 mm NR-23 cannons and VK-1F engine"
 ADR_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 ADR_CAS_equipment_1:0 "Focke-Wulf Fw 58 Weihe"
 ADR_CAS_equipment_1_short:0 "Fw 58 Weihe"
 ADR_CAS_equipment_2:0 "Junkers Ju 87 G 'Kanonenvogel'"
 ADR_CAS_equipment_2_short:0 "Ju 87 G 'Kanonenvogel'"
 ADR_CAS_equipment_3:0 "Henschel Hs 129"
 ADR_CAS_equipment_3_short:0 "Hs 129"
 ADR_jet_CAS_equipment_1:0 "Ilyushin IL-10M"
 ADR_jet_CAS_equipment_1_short:0 "IL-10M"
 ADR_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 ADR_jet_CAS_equipment_2_desc:0 "Fighter-bomber conversion, fitted to carry unguided rockets and bombs."
 ADR_jet_CAS_equipment_2_short:0 "MiG-17bis"
 ADR_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 ADR_jet_CAS_equipment_3_desc:0 "Fighter-Bomber version with all-moving slab tail. Equipped with Svod long-range navigation receiver and armed with three 30 mm NR-30 cannons. Had provisions for an ORO-32K rocket unguided rocket pack or a FAB-250 bomb under each wing, and from 1957 modified to allow four rocket pods to be carried."
 ADR_jet_CAS_equipment_3_short:0 "MiG-19S"
 ADR_jet_CAS_equipment_4:0 "Sukhoi Su-7B"
 ADR_jet_CAS_equipment_4_desc:0 "The bomber variant of the Su-7 Fitter-A first flew in March of 1959, later entering service in 1961. It would go on to be the primary Soviet ground attack aircraft of the 1960's. From 1957-1972 over 1400 Su-7Bs were constructed, many of which were exported. The aircraft was relatively popular overseas seeing service 10 nations. It saw extensive service in both the Indian and Egyptian Air Forces. The aircraft remains in limited service in North Korea."
 ADR_jet_CAS_equipment_4_short:0 "Su-7B"
 ADR_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 ADR_jet_CAS_equipment_5_desc:0 "Upgraded AL-7F-1 engine, upgraded fuel system with external piping on either side of the fuselage spine, fuel tanks installed in the wings, 'wet' underwing hardpoints for carrying external fuel tanks, capable of carrying tactical nuclear bombs."
 ADR_jet_CAS_equipment_5_short:0 "Su-7BKL"
 ADR_jet_CAS_equipment_6:0 "Sukhoi Su-20"
 ADR_jet_CAS_equipment_6_desc:0 "The Sukhoi Su-17 Fitter-C was a further development of the Soviet Su-7B ground attack aircraft. The Su-17 was widely exported to the Eastern Bloc, Arab and South American Air Forces. The Su-17 improved upon almost all aspects of its predecessor including sensors, flight performance, payload, range and variable wing sweep. From 1969 to 1990 2867 aircraft were produced and used in 30 nations, 6 that still use the aircraft today."
 ADR_jet_CAS_equipment_6_short:0 "Su-20"
 ADR_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-27M"
 ADR_jet_CAS_equipment_7_desc:0 "The MiG-27 Flogger is a Soviet variable swept wing ground attack aircraft. The aircraft is based on the MiG-23 but optimized for ground attack. Unlike the MiG-23 the MiG-27 did not see widespread use outside the USSR. From 1970-1986 1075 aircraft were produced. The MiG-27 was used during the later stages of the Soviet-Afghan and Kargil Wars. The aircraft remains in limited service with India and Kazakhstan."
 ADR_jet_CAS_equipment_7_short:0 "MiG-27M"
 ADR_jet_CAS_equipment_8:0 "Sukhoi Su-25K"
 ADR_jet_CAS_equipment_8_desc:0 "The Sukhoi Su-25 Frogfoot is a twin-engine ground attack aircraft developed in the Soviet union. The aircraft completed its maiden flight in 1975 and was introduced in 1981. Since 1978 over 1000 aircraft have been produced. It was particularly popular aircraft overseas, being sold to 29 countries. Because of this the Su-25 has been involved in several conflicts, notably the Soviet Afghan, Iran-Iraq and Gulf Wars. The aircraft remains in service with all export countries today."
 ADR_jet_CAS_equipment_8_short:0 "Su-25K"
 ADR_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 ADR_cas_stealth_equipment_1_short:0 "Su-25SM"
 ADR_cas_stealth_equipment_1_desc:0 "The Su-25SM (Stroyevoy Modernizirovannyi) is an \"affordable\" upgrade programme for the Su-25, conceived by the Russian Air Force in 2000. The programme stems from the attempted Su-25T and Su-25TM upgrades, which were evaluated and labeled as over-sophisticated and expensive. The SM upgrade incorporates avionics enhancements and airframe refurbishment to extend the Frogfoot's service life by up to 500 flight hours or 5 years. The Su-25SM's all-new PRnK-25SM \"Bars\" navigation/attack suite is built around the BTsVM-90 digital computer system, originally planned for the Su-25TM upgrade programme. Navigation and attack precision provided by the new suite is three times better of the baseline Su-25 and is reported to be within 15m using satellite correction and 200m without it."
 ADR_jet_tac_bomber_equipment_1:0 "Ilyushin Il-22"
 ADR_jet_tac_bomber_equipment_1_short:0 "Il-22"
 ADR_jet_tac_bomber_equipment_1_desc:0 "The Ilyushin Il-22 was the first Soviet jet-engined bomber to fly. It used four Lyulka TR-1 turbojets carried on short horizontal pylons ahead and below the wing. The engines did not meet their designed thrust ratings and their fuel consumption was higher than planned. These problems meant that the aircraft could not reach its required performance and it was cancelled on 22 September 1947."
 ADR_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 ADR_jet_tac_bomber_equipment_2_short:0 "Il-28"
 ADR_jet_tac_bomber_equipment_2_desc:0 "The Il-28 was a turbojet medium bomber developed immediately after the end of the Second World War for the Soviet Air Force. The first jet bomber to enter large-scale production, the Il-28, when introduced in 1950 served in many of the major conflicts of the Cold War, from Vietnam and the Soviet-Afghan War, to the Suez Conflict and the Biafra War. Even after being phased out of Soviet service by the 1980s, many aircraft of this type still enjoy service to this day. The USAF/DoD reporting name is Type 27, while the NATO codename is Beagle."
 ADR_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 ADR_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 ADR_jet_tac_bomber_equipment_3_desc:0 "The Yak-28 was developed as a swept-wing combat aircraft introduced in 1960. The Yak-28 bomber variants, known by their NATO codename Brewer, had pod-mounted engines, similar to the Yak-25 Flashlight it was developed from. With this and the swept wing, it was a high-subsonic aircraft, that could reach transonic speeds at high altitude. It served as the primary light bomber of the Soviet Air Force, and was largely in use by Russia, Belarus and Turkmenistan after the fall of the Soviet Union, all being retired by 1992."
 ADR_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 ADR_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 ADR_jet_tac_bomber_equipment_4_desc:0 "Improved version with the internal targeting system \"Initsiativa-2\" 360-degree ground-mapping radar alongside a ground-controlled targeting system using triangulation from ground-based transmitter sites"
 ADR_jet_tac_bomber_equipment_5:0 "Mikoyan-Guerevich MiG-25RBT"
 ADR_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 ADR_jet_tac_bomber_equipment_5_desc:0 "The MiG-25RBS is a single-seat reconnaissance-bomber derivative of the MiG-25R, fitted with improved reconnaissance systems and a Peleng automatic bombing system. The aircraft can carry a bombload of eight 500 kg (1,102 lb) bombs."
 ADR_jet_tac_bomber_equipment_6:0 "Sukhoi Su-24"
 ADR_jet_tac_bomber_equipment_6_short:0 "Su-24"
 ADR_jet_tac_bomber_equipment_6_desc:0 "A large fighter bomber developed by the Soviet Union in the 1960s which is still in use today. Characteristics include its variable wings and sharp body. It can equip up to 8,000 kg of weapons and is capable of launching various types of air to ground missiles while maintaining a stable speed. This aircraft is known by its NATO codename, \"Fencer.\" Together with its successor, the Su-34, it is currently active as a fighter bomber for the former Eastern camp countries."
 ADR_jet_tac_bomber_equipment_7:0 "Sukhoi Su-24"
 ADR_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 ADR_jet_tac_bomber_equipment_7_desc:0 "Entering service in 1983, the Su-24M was a further development of the Su-24 from the moment the initial type entered service. One of the major features included in the Su-24M is the inclusion of inflight refueling capability with a retractable refueling probe, a new internal navigation system and the Kaira-24 laser designator, allowing the type to utilize precision-guided bombs. Its known by the west as the Fencer-D."
