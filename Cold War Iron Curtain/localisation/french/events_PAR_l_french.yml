l_french:
par.1:0 "Depuis des mois, des tensions couvaient au sein de l'élite dirigeante du Paraguay. Le président Federico Chaves, autrefois une figure stabilisatrice, était devenu de plus en plus assiégé à mesure que les divisions entre factions au sein du parti Colorado s'approfondissaient et que les relations avec le haut commandement militaire se détérioraient. Divers groupes au sein du gouvernement - les conservateurs de la ligne dure, l'armée et les réformistes Epifanistas - ont tous cherché à façonner l'avenir du Paraguay, mais leurs intérêts étaient souvent contradictoires.\n\nLe 3 mai 1954, une série d'événements déclenche une rapide réaction en chaîne. L'arrestation du colonel Candia, ordonnée par le lieutenant-colonel Néstor Ferreira, a accru les soupçons de complot de toutes parts. Dans la soirée du 4 mai, la tension régnait dans les rues d'Asunción, alors que les rumeurs d'une action militaire décisive se répandaient dans la capitale. À 20 heures, des coups de feu ont éclaté alors que les commandos d'élite du bataillon 40, dirigés par Mario Ortega, ont pris d'assaut le quartier général de la police. Les forces gouvernementales ont tenté de résister, mais les combats ont été rapides et brutaux. Le chef de la police, Roberto Pettit, a été abattu lors de l'agression et, bien qu'il ait été transporté d'urgence à l'hôpital, ses blessures se sont révélées mortelles.\n\nAlors que la situation devenait incontrôlable, Chaves, conscient de la gravité du moment, s'est enfui au Collège militaire Francisco López, cherchant refuge et une dernière chance de renverser la situation en sa faveur. Ce qui se passera ensuite définira l'avenir du Paraguay."
par.2:0 "Cela faisait des mois que l'écriture était sur le mur. Bien qu'il ait accédé au pouvoir avec le soutien de l'armée et du parti, Felipe Molas López s'est retrouvé de plus en plus isolé alors que son administration peinait à tenir ses promesses. Son ancien allié, Federico Chaves, a conspiré contre lui et le conseil d'administration du parti Colorado a perdu confiance en son leadership. Dans la nuit du [GetDate], la junte s'est réunie en session extraordinaire. Le vote a été décisif - 14 pour, 3 contre - Molas López a dû partir. Une délégation, comprenant ses propres ministres, est arrivée à la résidence présidentielle pour présenter sa revendication : démissionner ou être destituée.\nAcculé et abandonné, Molas López n'a eu d'autre choix que de signer sa démission au petit matin. Le gouvernement allait bientôt annoncer ses échecs, son incapacité à unifier le parti, à restaurer les institutions ou à maintenir l'ordre public."
par.3.t:0 "Les élections [GetYear]"
par.3:0 "Avec le retrait du pouvoir de Felipe Molas López, le Parti Colorado a convoqué des élections pour confirmer officiellement Federico Chaves comme président et pourvoir les sièges au Parlement. Cependant, le Parti Colorado étant la seule organisation politique légale, l'élection n'est qu'une simple formalité. Aucun candidat de l'opposition n'a été autorisé à se présenter et Chaves ne rencontre aucune opposition.\nLes candidats soutenus par l'État ont obtenu tous les sièges parlementaires sans contestation, et les résultats officiels confirment Chaves comme président jusqu'en 1953. Le gouvernement présente les résultats comme une réaffirmation de l'unité nationale sous la direction du parti, mais il ne fait aucun doute que le système est construit pour maintenir toute opposition hors du pouvoir.\nSon pouvoir étant désormais légitimé, Chaves doit se concentrer sur la stabilisation de l'économie et la gestion des factions croissantes au sein du parti Colorado. La question n'est pas de savoir s'il détient le pouvoir, mais combien de temps il pourra maintenir l'unité du parti derrière lui."
par.3.a:0 "Chaves assure sa présidence"
par.4.t:0 "[GetNewspaperHeader]Une façade démocratique ?"
par.4:0 "Dans une démarche saluée par les responsables gouvernementaux comme un tournant pour l'unité nationale, le président Felipe Molas López a introduit une série de mesures visant à restaurer les institutions démocratiques et à favoriser la réconciliation. Parmi ces initiatives les plus significatives figure l'amnistie accordée aux prisonniers politiques et aux révolutionnaires impliqués dans la guerre civile de 1947, y compris ceux impliqués dans le soulèvement de l'Escuela Militar. L'administration a présenté cela comme une étape vers la guérison des blessures du passé qui tourmentent depuis longtemps la politique paraguayenne.\nCependant, tous ne sont pas convaincus. Alors que le gouvernement présente ces actions comme faisant partie d'un effort plus large visant à reconstruire les normes démocratiques, les sceptiques estiment qu'un véritable changement politique reste insaisissable. Certains voient dans l'amnistie un geste purement symbolique. D'autres se demandent si ces réformes marquent le début d'une nouvelle ère politique - ou simplement un ajustement temporaire avant que le pouvoir ne se consolide inévitablement à nouveau. Alors que les luttes politiques menacent sa brève présidence, Molas emprunte un chemin fragile. Reste à savoir s'il favorise une véritable démocratisation ou un intermède passager dans la tourmente du Paraguay. Pour l'instant, le gouvernement projette une réforme. Mais on pourrait se demander combien de temps ?"
par.4.a:0 "Un pas en avant ?"
par.5.t:0 "Une marine sans côte"
par.5:0 "Bien qu'il soit un pays enclavé, le Paraguay possède une tradition navale étonnamment forte, un héritage qui remonte à la guerre de la Triple Alliance et à la dépendance stratégique du pays à l'égard de ses routes fluviales. Avec un accès à l'océan Atlantique via le système fluvial Paraguay-Paraná, le pays a maintenu une force navale petite mais compétente, chargée de patrouiller ses voies navigables, de sécuriser les routes commerciales et d'assurer la mobilité logistique le long du plus grand réseau fluvial d'Amérique du Sud. Les officiers de la marine paraguayenne continuent de s'entraîner à la guerre amphibie et aux opérations fluviales, garantissant ainsi que la Marina de Guerra reste une force pertinente malgré ses limites géographiques. Bien que le pays ne dispose pas d'une flotte hauturière, son expérience des opérations fluviales et de la technologie maritime lui permet de maintenir une force hautement spécialisée adaptée aux défis uniques de la guerre navale intérieure."
par.5.a:0 "Une marine sans océan reste une marine"
par.6.t:0 "Choisir notre partenaire pétrochimique"
par.6:0 "Après des mois de planification et de négociation, le gouvernement a finalisé le processus d'appel d'offres pour la construction d'une nouvelle raffinerie pétrochimique près d'Asunción, un projet qui marquera une avancée majeure dans les secteurs industriel et énergétique du Paraguay. Face à la demande croissante de carburant et au besoin croissant de capacités de raffinage nationales, il est crucial de trouver le bon partenaire pour la stabilité économique et le développement à long terme. Après un examen approfondi, deux prétendants finaux ont émergé :\n\n§YEsso (Standard Oil of New Jersey)§,, leader mondial de la production et du raffinage du pétrole, propose une technologie et une efficacité modernes, avec le soutien des marchés internationaux.\n\nYacimientos §YPetrolíferos Fiscales (YPF)§, La compagnie pétrolière publique argentine présente une opportunité de coopération régionale et d'intégration économique, renforçant les liens en Amérique du Sud.\n\nChaque choix a des implications à long terme pour l'économie, l'industrie et le paysage diplomatique du Paraguay. Le moment est venu pour le gouvernement de prendre sa décision finale."
par.6.a:0 "Nous faisons confiance à l'expertise et à la portée mondiale d'Esso."
par.6.b:0 "YPF est le choix naturel pour la coopération régionale."
par.7.t:0 "[GetNewspaperHeader]Le Paraguay se tient aux côtés du monde libre"
par.7:0 "Dans une déclaration officielle publiée aujourd'hui, le président Federico Chaves a réaffirmé l'engagement du Paraguay envers la stabilité internationale en déclarant son soutien aux efforts des Nations Unies en Corée. Cette annonce souligne la solidarité du Paraguay avec le monde libre dans ce que les responsables gouvernementaux décrivent comme « une lutte cruciale pour préserver la paix et la sécurité ».\nBien que les détails exacts ne soient pas divulgués, des sources diplomatiques suggèrent que des discussions ont eu lieu concernant le rôle du Paraguay dans le conflit en cours, les responsables soulignant l'importance de se tenir aux côtés des nations alliées dans les moments d'incertitude mondiale. À Washington, la déclaration a été bien accueillie, l'ambassadeur américain déclarant qu'« elle met en évidence le rôle croissant du Paraguay en tant que partenaire apprécié sur la scène internationale ».\nAu niveau national, la décision a été largement approuvée, les responsables gouvernementaux et les personnalités du parti au pouvoir la saluant comme une étape nécessaire pour sauvegarder les intérêts nationaux et nouer des liens plus étroits avec les principaux alliés. Même si une petite minorité exprime discrètement son scepticisme quant à l'implication du Paraguay dans des conflits lointains, ses voix restent largement ignorées face à la position ferme du gouvernement."
par.7.a:0 "Symbolique ou pas, le message est ce qui compte."
par.8.t:0 "Les négociations Paraguay-Brésil"
par.8:0 "Une délégation paraguayenne est arrivée à Rio de Janeiro pour discuter de deux questions de longue date : le différend frontalier sur le fleuve Apa et l'importante dette du Paraguay envers le Brésil. Les négociateurs brésiliens proposent un compromis : si le Paraguay reconnaît formellement les revendications brésiliennes mineures le long du fleuve Apa, le Brésil restructurera la dette restante, allégeant ainsi considérablement le fardeau financier du Paraguay. Cependant, cette proposition est controversée au sein du parti Colorado au pouvoir, où les partisans de la ligne dure s'opposent à toute concession territoriale. Le président Chaves doit maintenant décider : le Paraguay doit-il accepter les conditions du Brésil pour obtenir un soulagement économique au prix de conflits politiques internes, ou devons-nous rejeter toute concession, préservant la souveraineté mais maintenant les difficultés économiques ?"
par.8.a:0 "Recherchez un accord équilibré."
par.8.b:0 "Défendre à tout prix la souveraineté paraguayenne !"
par.9.t:0 "[GetNewspaperHeader]Chaves conclut un accord historique avec le Brésil !"
par.9:0 "Dans le cadre d'une victoire décisive pour la diplomatie paraguayenne, notre gouvernement a réussi à négocier un nouvel accord avec le Brésil, ouvrant une ère de coopération et de soulagement économique. Les discussions à Rio de Janeiro se sont conclues par la reconnaissance par le Brésil de l'engagement du Paraguay en faveur de la stabilité régionale, ce qui a conduit à une restructuration de nos obligations financières. Cette réalisation permettra à notre pays de se concentrer sur la croissance et la prospérité sans le fardeau d'une dette écrasante.\nLes responsables gouvernementaux ont salué le résultat, soulignant les avantages de garantir la stabilité économique tout en renforçant les liens diplomatiques avec notre puissant voisin. Le président Chaves a réaffirmé son engagement à protéger les intérêts du Paraguay, en veillant à ce que notre nation continue sur la voie du progrès.\nAlors qu'une poignée de voix réactionnaires au sein du Parti Colorado ont exprimé leurs inquiétudes concernant des ajustements territoriaux mineurs, la grande majorité reconnaît cet accord comme une étape prudente vers l'assurance d'un Paraguay plus fort pour les générations futures."
par.9.a:0 "Nous sommes aujourd'hui plus forts que jamais."
par.10.t:0 "[GetNewspaperHeader]Le président Chaves défend la souveraineté du Paraguay !"
par.10:0 "Dans une position audacieuse et patriotique, le gouvernement paraguayen a défendu notre souveraineté nationale lors des récentes négociations avec le Brésil. Refusant de céder aux pressions extérieures, notre délégation a clairement indiqué que l'intégrité territoriale du Paraguay n'est pas à vendre.\nLe gouvernement Chaves reste déterminé à défendre chaque centimètre carré de notre patrie, démontrant au monde que le Paraguay ne vacillera jamais face aux demandes étrangères. Même si les discussions avec le Brésil se sont terminées sans concessions, les voies diplomatiques restent ouvertes et le Paraguay continuera de rechercher des partenariats justes et équitables selon ses propres conditions.\nPartout au pays, le Parti Colorado et les citoyens patriotes ont salué cette décision comme un triomphe de la dignité nationale. Certains commentateurs étrangers ont suggéré que cette position pourrait compliquer les questions économiques, mais les vrais Paraguayens savent que la souveraineté passe avant tout. Le peuple est uni, inébranlable dans son soutien à une nation forte et indépendante."
par.10.a:0 "Vive le Paraguay !"
par.11.t:0 "Nomination d'Epifanio Méndez"
par.11:0 "Le président Chaves a finalisé la nomination d'Epifanio Méndez Fleitas à la tête de la Banque centrale du Paraguay, une décision qui marque un changement majeur dans la politique économique et l'influence politique au sein du Parti Colorado. Contrairement à de nombreux membres de l'élite politique paraguayenne, Méndez Fleitas est issu d'un milieu modeste et paysan. Loyaliste engagé du Colorado, il s'est fait connaître pour la première fois en 1941, en organisant des activités clandestines du parti sous le règne de Higinio Morínigo. Au fil des années, il s'est révélé être un survivant politique impitoyable : il a dirigé le journal La Razón pour dénoncer ses rivaux, organisé un soulèvement armé en 1948, puis joué un rôle clé dans le coup d'État de 1949 qui a restauré l'unité du parti et porté Felipe Molas López au pouvoir. Sa loyauté envers Chaves a été récompensée par le poste de chef de la police à seulement 32 ans.\n\nAujourd'hui, en tant que président de la Banque centrale, Méndez Fleitas a une nouvelle ambition : la transformation économique. Il envisage un système financier fort, dirigé par l'État, qui donne la priorité au développement national et à une coopération plus étroite avec le gouvernement péroniste argentin. Cependant, son ascension rapide et sa politique radicale ont déjà commencé à alarmer les factions conservatrices au sein du parti et de l'armée. Ils craignent que son approche populiste, ses liens avec l'étranger et son influence personnelle croissante ne constituent une menace pour l'équilibre politique du Paraguay. Pour l'instant, Chaves maintient sa décision, estimant que Méndez est l'homme idéal pour faire avancer l'économie du Paraguay. Mais ses ennemis au sein du parti surveillent de près."
par.11.a:0 "En avant alors"
par.12.t:0 "La réélection de Federico Chaves"
par.12:0 "Les résultats officiels sont connus : le président Federico Chaves a été réélu avec 100 % des voix, avec 224 788 voix en faveur du parti Colorado. En l'absence de partis d'opposition autorisés, les élections servent de démonstration de l'unité nationale sous la direction du parti. Les résultats ont été célébrés dans tout le pays, alors que les Paraguayens réaffirment leur soutien à Chaves et à sa vision de l'avenir de la nation. À Asunción, les responsables du gouvernement ont salué l'efficacité et l'ordre du processus électoral, garantissant que la démocratie continue de fonctionner de la manière qui sert le mieux le peuple.\nAlors que les critiques étrangers considèrent l'élection comme une formalité, au Paraguay, le parti Colorado reste le seul gardien de la stabilité et du progrès nationaux. Chaves a obtenu un nouveau mandat pour poursuivre la politique de son administration, garantissant que le Paraguay reste fort, uni et inébranlable dans sa direction."
par.12.a:0 "Une victoire triomphale pour nous."
par.13.t:0 "Le discours du président Chaves"
par.13:0 "Devant un rassemblement de responsables du Parti Colorado et de partisans du gouvernement, le président Federico Chaves a prononcé un discours énergique réaffirmant la primauté de la gouvernance civile au Paraguay. Debout à la tribune, flanqué de ministres clés et d'alliés réformateurs, Chaves a parlé du rôle historique du parti dans l'orientation de la nation et de la nécessité de renforcer les institutions civiles plutôt que l'influence militaire.\n\n\"Le destin du Paraguay a toujours été forgé par la discipline, l'unité et une croyance inébranlable dans le progrès. Notre grande nation se trouve à la croisée des chemins, et nous devons décider si nous devons emprunter la voie de la stabilité et du développement, ou risquer notre avenir en cédant à des forces qui placeraient l'ambition militaire avant l'intérêt national.\"\n\nLa salle a éclaté sous les applaudissements lorsque Chaves a félicité les forces armées pour leur dévouement à la sécurité nationale, tout en mettant subtilement en garde contre toute ingérence politique. Il a souligné que c'est le parti, et non les généraux, qui doit être la force directrice du Paraguay, garantissant que la nation avance sous une direction forte et légitime. Mais à l'extérieur de l'hémicycle, les réactions ont été plus partagées. Certains membres de la vieille garde du Colorado ont acquiescé, voyant en Chaves un leader déterminé à garantir l'héritage du parti. D'autres, notamment parmi les personnalités militaires, sont restés silencieux, leurs expressions illisibles.\nPour l'instant, Chaves a clairement exprimé sa position, mais dans l'ombre, une opposition à sa vision pourrait déjà se former."
par.13.a:0 "L'avenir sera décidé par le parti, pas par les casernes."
par.14.t:0 "[GetNewspaperHeader]Les réformes constitutionnelles de Chaves échouent"
par.14:0 "Dans un effort de modernisation de la gouvernance du Paraguay, le président Federico Chaves a introduit une série d'amendements constitutionnels visant à renforcer le régime civil et à réformer les institutions gouvernementales. Cependant, malgré l'insistance de l'administration sur la nécessité d'un changement, l'initiative s'est heurtée à une forte résistance de la part du parti Colorado et de l'establishment militaire.\nBien que présentés publiquement comme une étape vers le progrès national, les critiques au sein du parti au pouvoir ont discrètement soutenu que les amendements déstabiliseraient la structure politique du Paraguay, en accordant trop de pouvoir à l'exécutif au détriment des institutions traditionnelles. L'armée, se méfiant de toute tentative visant à réduire son influence, a refusé son soutien, retardant encore davantage les réformes.\nFace à une opposition écrasante, le gouvernement a abandonné la proposition, ce qui constitue un rare revers pour l'administration Chaves. Malgré cela, les responsables insistent sur le fait que le Paraguay reste attaché à la stabilité et à l'unité sous la direction du Parti Colorado."
par.14.a:0 "Certaines idées doivent attendre leur heure."
par.15.t:0 "Méndez Fleitas démis de ses fonctions"
par.15:0 "Epifanio Méndez Fleitas, figure clé de la direction économique du Paraguay et membre influent du groupe Democráticos, a officiellement démissionné de son poste de président de la Banque centrale. Son départ fait suite à la pression croissante des forces armées et des élites économiques rurales, qui l'ont accusé de politiques économiques malavisées et d'excès politiques. Le refus de Méndez d'approuver la hausse des prix du boeuf, une exigence de la puissante Asociación Rural del Paraguay, a fait de lui une cible d'exclusion, car sa position était considérée comme une menace pour les profits agricoles. Dans le même temps, les officiers militaires, sceptiques quant à ses tendances pro-péronistes, ont vu une opportunité d'écarter du pouvoir un personnage de plus en plus gênant. Les déclarations officielles du gouvernement soulignent que Méndez a démissionné volontairement, mais dans les cercles politiques, peu de gens croient que c'était vraiment son choix. Depuis, il a été transféré dans sa ville natale de San Pedro del Paraná, loin des luttes politiques d'Asunción. Alors que le paysage politique du Paraguay évolue, beaucoup se demandent si sa destitution était simplement un changement administratif ou le premier signe d'un plus grand réalignement du pouvoir."
par.15.a:0 "Une décision nécessaire pour la stabilité."
par.17.t:0 "[GetNewspaperHeader]Le gouvernement publie une déclaration sur les événements récents"
par.17:0 "À la suite des événements du 4 mai, la direction du Parti Colorado et les autorités militaires ont publié une déclaration réaffirmant l'engagement du Paraguay en faveur de la stabilité, de l'ordre et de l'unité nationale. Le communiqué précise que l'ancien président Federico Chaves avait tenté de saper l'unité du parti, obligeant les chefs militaires à intervenir afin de prévenir les troubles et de sauvegarder l'avenir de la nation. Le gouvernement a également abordé le rôle du lieutenant-colonel Néstor Ferreira, dont l'implication dans les affaires politiques a été citée comme une force perturbatrice ayant directement interféré dans la gouvernance du parti. Pour assurer une transition en douceur et restaurer la légitimité politique, le gouvernement a annoncé que de nouvelles élections présidentielles auraient lieu dans les semaines à venir. Le Parti Colorado se réunira bientôt pour sélectionner un candidat capable d'unir la nation et de faire avancer le Paraguay.\n\nLa direction du Parti Colorado, désormais dirigée par Tomás Romero Pereira, a appelé à l'unité et au calme, garantissant au peuple paraguayen que la transition du pouvoir se déroule sans heurts. Bien que la déclaration présente un message clair et décisif, les véritables motivations du coup d'État restent un sujet de discussion discrète parmi les initiés politiques."
par.17.a:0 "Qui prendra la tête ?"
par.18.t:0 "L'élection présidentielle de 1954"
par.18:0 "Avec le Parti Colorado uni derrière un seul candidat, l'élection présidentielle de 1954 s'est conclue avec la victoire du général Alfredo Stroessner à la présidence sans opposition. L'élection s'est déroulée dans le calme et l'efficacité, avec des résultats officiels montrant 236 191 voix en faveur de Stroessner, soit 100 % des suffrages exprimés. Dans son discours de remerciement, Stroessner a réaffirmé son engagement en faveur de la paix, de la justice et du bien-être social pour tous les Paraguayens patriotes. Il s'est engagé à respecter les engagements internationaux du Paraguay et à poursuivre une politique fraternelle de coopération avec les pays voisins, tout en exaltant les principes et l'héritage du Parti Colorado en tant que force directrice de la stabilité nationale.\n\nMême si le processus a été salué par les responsables comme une démonstration d'unité et d'ordre, des observateurs extérieurs notent que l'absence de tout candidat de l'opposition a limité l'importance de l'élection elle-même. Néanmoins, avec le soutien du parti et de l'armée, la présidence de Stroessner est désormais officiellement confirmée. Pour l'instant, le Paraguay avance sous un leadership fort, mais l'avenir reste incertain : Stroessner gouvernera-t-il en tant que figure de transition, ou a-t-il de plus grandes ambitions ?"
par.18.a:0 "Le parti le remplacera sûrement bientôt."
par.19.t:0 "Succès du coup d'État"
par.19:0 "Alors que les tirs diminuaient dans les rues d'Asunción, le président Federico Chaves est arrivé au Collège militaire Francisco López, cherchant refuge et une dernière opportunité de sauver sa présidence. Il n'était entouré que d'une poignée de collaborateurs de confiance, son gouvernement s'effondrant autour de lui. Le siège de la police était tombé, l'armée ne répondait plus à ses ordres et les putschistes contrôlaient des quartiers clés de la capitale. Il pensait néanmoins que s'il parvenait à influencer les dirigeants militaires de l'académie, il pourrait y avoir un moyen de conserver le pouvoir.\n\nEn convoquant le général Marcial Samaniego, Chaves fit une proposition désespérée : il le nommerait commandant de l'armée paraguayenne, lui accordant ainsi une large autorité sur les forces armées du pays. Avec une telle position, Samaniego pourrait rétablir l'ordre et écraser la rébellion. Cependant, Chaves n'a pas réalisé l'étendue de son isolement - Samaniego s'était déjà aligné sur le général Alfredo Stroessner et les putschistes. Au lieu d'accepter l'offre, Samaniego a ordonné l'arrestation immédiate de Chaves, s'assurant que les derniers vestiges de son autorité disparaissent en un instant.\n\nLe 5 mai, la direction du Parti Colorado s'est réunie en session d'urgence, demandant officiellement la démission de Chaves. Sans voie à suivre et sans alliés, il a démissionné de la présidence, mettant ainsi fin à son règne. À sa place, le président du Parti Colorado, Tomás Romero Pereira, a prêté serment en tant que président par intérim, une solution temporaire destinée à restaurer la stabilité en attendant qu'un leader permanent puisse être choisi. Cependant, en arrière-plan, il était clair que Stroessner, l'homme qui avait orchestré une grande partie du coup d'État, était désormais la figure la plus puissante du Paraguay."
par.19.a:0 "Une nouvelle ère avait commencé."
par.20.t:0 "Chaves obtient un soutien crucial"
par.20:0 "Alors que les coups de feu résonnaient à Asunción, le président Federico Chaves s'est enfui vers le Collège militaire Francisco López, cherchant refuge et une dernière chance de renverser la tendance. Il savait que son seul espoir résidait dans la mobilisation d'un soutien suffisant de la part de l'armée et de la direction du parti pour résister au coup d'État. À l'intérieur de l'académie, il affronte le général Marcial Samaniego, lui offrant le poste de commandant de l'armée paraguayenne dans un ultime effort pour s'assurer sa loyauté. Samaniego, cependant, hésita : ses liens avec le général Stroessner et les putschistes étaient bien connus.\n\nAlors que le sort de Chaves semblait scellé, des renforts commencèrent à arriver. Des officiers loyalistes, dirigés par le colonel Néstor Ferreira et soutenus par les Epifanistas, se sont dépêchés pour défendre le gouvernement. La nouvelle s'est répandue parmi les unités militaires et bientôt, les factions de la vieille garde du parti Colorado, craignant l'influence croissante de Stroessner, ont mis tout leur poids derrière Chaves. Le vent a commencé à tourner. À mesure que la nuit avançait, les forces loyalistes se sont emparées de lieux clés, empêchant ainsi de nouvelles tentatives de coup d'État. Face à une résistance croissante et réalisant que ses forces n'étaient plus unifiées, Stroessner fut contraint de battre en retraite, avec les officiers qui l'avaient soutenu. Alors que certains ont été capturés ou se sont cachés, Stroessner lui-même a réussi à échapper à l'arrestation, se retirant de la capitale pour reconsidérer ses prochaines étapes.\n\nLe 5 mai, le coup d'État avait échoué. Chaves est resté au pouvoir, mais la crise a révélé à quel point sa position était précaire. L'armée n'était plus entièrement sous son contrôle et des factions au sein du Parti Colorado avaient été révélées comme étant prêtes à se retourner contre lui. Pendant ce temps, Stroessner, bien que vaincu, n'avait pas été éliminé. Sa retraite n'était que temporaire, et ceux qui l'avaient suivi n'oublieraient pas leur tentative de s'emparer si facilement du pouvoir. Pour l'instant, il restait dans l'ombre, attendant la prochaine opportunité."
par.20.a:0 "Pour l'instant, Chaves a survécu."
par.21.t:0 "[GetNewspaperHeader]Méndez Fleitas revient à la Banque centrale"
par.21:0 "Stroessner a confirmé le retour d'Epifanio Méndez Fleitas à la présidence de la Banque centrale, marquant une étape clé dans les efforts de l'administration visant à renforcer la politique économique nationale. Méndez Fleitas, défenseur de longue date de la modernisation économique et de la stabilité financière, occupait ce poste avant son départ sous Chaves. Les responsables ont souligné que l'expertise de Méndez Fleitas en matière de planification financière et de politique monétaire sera cruciale pour guider l'avenir économique du pays.\nOutre son retour à la Banque centrale, Méndez Fleitas a également pris la direction de La Unión, un journal important qui devrait jouer un rôle clé dans le soutien au message de stabilité et de progrès du gouvernement. Entre-temps, le major Virgilio Candia a été nommé commandant de la cavalerie, renforçant ainsi la réorganisation en cours des forces de sécurité nationale pour assurer le maintien de l'ordre.\nDes sources gouvernementales ont souligné que ces changements s'inscrivent dans le cadre d'un effort plus large d'unification du pays, réunissant des personnalités clés qui contribueront au développement du Paraguay dans cette nouvelle ère. L'administration reste déterminée à renforcer les institutions nationales et à favoriser une croissance économique continue sous une direction ferme et stable."
par.21.a:0 "Une main ferme revient pour guider l'économie."
par.22.t:0 "La lutte pour le pouvoir"
par.22:0 "Depuis des mois, les tensions couvaient au sein du Parti Colorado, et elles ont maintenant atteint leur point de rupture. Ce qui avait commencé comme une rivalité entre le président Stroessner et Epifanio Méndez Fleitas s'était transformé en une lutte existentielle pour le contrôle du parti - et du pays lui-même. La Reencuentro d'octobre avait pour but d'unifier le parti après le coup d'État contre Juan Perón en Argentine, mais elle n'a fait qu'approfondir le fossé entre les factions du régime. Méndez Fleitas, qui comptait depuis longtemps sur le soutien argentin, s'est soudainement retrouvé politiquement vulnérable. Le nouveau gouvernement de Buenos Aires, dirigé par le général Pedro Eugenio Aramburu, l'avait abandonné, faisant plutôt pression sur Stroessner pour qu'il purge les Epifanistas des postes de pouvoir.\nDans le même temps, les élites économiques du Paraguay, en particulier l'industrie du bois, ont vu une opportunité de renverser Méndez une fois pour toutes. L'Asociación de Madereros del Paraguay, dont Méndez s'était opposé aux intérêts en tant que chef de la Banque centrale, s'était alignée sur Stroessner, lui apportant un soutien financier et politique. Cette nouvelle alliance signifiait que Stroessner bénéficiait désormais du soutien de l'armée, de la vieille garde du parti, de l'oligarchie et même du gouvernement argentin - une coalition presque insurmontable contre Méndez Fleitas.\nPourtant Méndez n'était pas dépourvu de sa propre base de pouvoir. Son contrôle sur la Banque centrale lui a donné un levier économique, tandis que son journal, La Unión, était devenu la publication progouvernementale la plus importante, lui permettant de façonner la perception du public. Il avait également cultivé une faction loyaliste au sein de l'armée, comprenant le major Virgilio Candia, commandant de la cavalerie, ainsi que des officiers toujours irrités par l'influence croissante de Stroessner. Fin décembre 1955, les deux hommes savaient que la confrontation était inévitable. La question était de savoir qui frapperait en premier."
par.22.a:0 "Méndez a mal calculé - Stroessner agit de manière décisive."
par.22.b:0 "Les Epifanistas agissent les premiers."
par.23.t:0 "[GetNewspaperHeader]Méndez Fleitas de nouveau démis de ses fonctions ?"
par.23:0 "Dans une démarche visant à garantir le maintien de la stabilité et de l'efficacité institutionnelle, le gouvernement a confirmé le départ d'Epifanio Méndez Fleitas de son poste de président de la Banque centrale. Les responsables ont déclaré que cette décision faisait partie d'ajustements administratifs de routine. Bien qu'aucune raison officielle n'ait été fournie pour ce changement, des rumeurs au sein des cercles politiques suggèrent que Méndez Fleitas avait accumulé une influence significative, conduisant à des désaccords internes au sein du parti Colorado. Ses relations étroites au sein de l'armée et son rôle dans l'orientation économique du Paraguay ont fait de lui une figure importante mais controversée ces derniers mois.\nCette annonce fait suite à des informations faisant état de récents troubles au sein de la cavalerie, où un groupe d'officiers a été démis de ses fonctions après des allégations de mauvaise conduite. Le gouvernement a assuré au public que ces développements étaient des incidents isolés et que la stabilité nationale restait pleinement assurée. Même si le futur rôle de Méndez Fleitas n'a pas été officiellement confirmé, des sources diplomatiques suggèrent qu'il pourrait bientôt être nommé à un poste à l'étranger, potentiellement comme ambassadeur en Espagne. Les responsables ont refusé de commenter ces informations."
par.23.a:0 "Adiós, comme on dit en Espagne."
par.24.t:0 "Méndez Fleitas se voit refuser l'entrée au Paraguay"
par.24:0 "Depuis des mois, Epifanio Méndez Fleitas est ambassadeur du Paraguay en Espagne, suite à sa réaffectation de la Banque centrale. Alors que le gouvernement a soutenu que sa nomination était une nomination diplomatique de routine, les observateurs politiques ont noté que cela l'éloignait commodément des affaires intérieures à une époque de tensions croissantes au sein du parti Colorado.\n\nAujourd'hui, les événements récents ont ramené son nom sur le devant de la scène nationale. En mars 1956, Méndez Fleitas apprit que son père était tombé gravement malade. Sans perdre de temps, il a pris un vol pour le Paraguay, accompagné de sa famille, avec l'intention de rentrer chez lui. Cependant, lorsque son avion a atterri à Rio de Janeiro, il a été accueilli par des responsables de l'ambassade du Paraguay, qui l'ont informé qu'il ne serait pas autorisé à rentrer dans le pays. Bien qu'aucune raison officielle n'ait été donnée, la décision interdit effectivement à Méndez de revenir à la politique paraguayenne, renforçant les spéculations selon lesquelles sa nomination diplomatique n'était guère plus qu'un exil tranquille.\n\nSans issue, Méndez a depuis quitté le Brésil, avec l'intention de s'installer en exil politique en Uruguay. Son retrait inattendu du pays a alimenté les discussions entre les factions du parti, mais pour l'instant, les responsables du gouvernement ont refusé de commenter davantage, affirmant seulement que le Paraguay restait attaché à la stabilité et à l'unité."
par.24.a:0 "Telle est la politique."
par.25.t:0 "Méndez Fleitas rallie l'opposition à Stroessner"
par.25:0 "Alors que les tensions au sein du Parti Colorado atteignent un point de rupture, Epifanio Méndez Fleitas a pris son parti. N'étant plus disposé à rester les bras croisés alors que le président Stroessner consolide son pouvoir, Méndez a rallié une large coalition de dissidents du parti, d'officiers militaires et de partisans civils pour défier le régime. L'effondrement du gouvernement de Perón en Argentine a laissé les Epifanistas politiquement vulnérables, mais au lieu de battre en retraite, Méndez a travaillé sans relâche pour construire une opposition unie au Paraguay. Des personnalités clés de la vieille garde du parti Colorado, frustrées par l'autoritarisme croissant de Stroessner, ont uni leurs forces avec les factions réformistes, formant un front puissant déterminé à restaurer la direction du parti entre les mains des civils. L'armée, autrefois entièrement alignée sur Stroessner, est désormais divisée. Même si le major Virgilio Candia et d'autres officiers loyalistes restent attachés à Méndez, Stroessner jouit toujours de la loyauté d'une grande partie du haut commandement. Le risque d'une confrontation ouverte entre les deux factions augmente de jour en jour. Les forces d'opposition étant désormais fermement en place, la confrontation est inévitable. La question n'est plus de savoir si Méndez défiera Stroessner, mais dans combien de temps."
par.25.a:0 "Des temps incertains."
par.26.t:0 "Revuelta Unitaria"
par.26:0 "Le moment des comptes est arrivé. Avec Epifanio Méndez Fleitas qui a réussi à rallier l'opposition au président Stroessner, le fragile équilibre politique au Paraguay s'est effondré dans une confrontation ouverte. La Revuelta Unitaria, un coup d'État mené par Méndez et ses alliés, est désormais en marche, visant à renverser le régime soutenu par l'armée de Stroessner et à redonner au parti Colorado une direction civile. Le soulèvement commence avant l'aube, avec des officiers épifanistes coordonnant une offensive pour s'emparer des principaux bâtiments gouvernementaux et des casernes militaires à Asunción. La division de cavalerie du major Virgilio Candia se déplace rapidement à travers la capitale, sécurisant les routes vitales et coupant les unités militaires encore fidèles à Stroessner. Le siège du journal La Unión, aujourd'hui porte-parole de la révolution, diffuse une déclaration annonçant la formation d'un nouveau gouvernement, appelant le peuple à soutenir le mouvement.\n\nDes combats éclatent près du ministère de l'Intérieur, où les forces de sécurité de Stroessner tentent de maintenir leurs positions face à l'avancée des forces de Méndez. Des coups de feu retentissent dans les rues alors que les unités de police loyalistes, prises entre les ordres du régime et une opposition écrasante, commencent à faire défection en grand nombre. Pendant ce temps, au commandement général de l'armée, les officiers supérieurs restent divisés, ne sachant pas s'ils doivent résister ou s'aligner sur le pouvoir croissant de Méndez. Le coup d'État atteint son paroxysme lorsque les forces de Méndez encerclent la résidence présidentielle, coupant toutes les voies de fuite. Les communications sont coupées et une grande partie de l'armée faisant défection ou refusant d'intervenir, Stroessner se retrouve de plus en plus isolé. Ses dernières forces loyalistes tentent de monter une défense, mais alors que les véhicules blindés de la division de cavalerie franchissent les portes du complexe, il devient clair que la bataille est perdue.\n\nAlors que le soleil se lève sur Asunción, les derniers coups de feu se transforment en silence. Méndez Fleitas est victorieux, entouré de ses alliés, alors que les restes du régime de Stroessner capitulent. Les ondes radio, autrefois contrôlées par le gouvernement, véhiculent désormais un message simple mais décisif :\n\n\"Le peuple du Paraguay a récupéré son avenir. L'ère du régime militaire est révolue.\""
par.26.a:0 "Vive la révolution !"
par.27.t:0 "Ynsfrán prend le contrôle des affaires internes"
par.27:0 "La nomination d'Edgar Ynsfrán au poste de ministre de l'Intérieur marque un tournant nouveau et radical pour le régime Stroessner. Nationaliste farouche et l'une des figures les plus extrémistes du Parti Colorado, la vision d'Ynsfrán pour le Paraguay va au-delà du simple autoritarisme : il envisage un État à parti unique entièrement militarisé, où la pureté idéologique et le contrôle total définissent la politique nationale. Stroniste d'extrême droite, favorable au corporatisme fasciste, Ynsfrán s'est longtemps entouré de groupes paramilitaires radicaux et de forces de l'ordre dures. Son séjour à Guión Rojo et ses liens étroits avec les exilés européens d'extrême droite ont fait de lui un personnage clé qui a facilité l'arrivée des criminels de guerre nazis en fuite.\n\nSous sa direction, le ministère de l'Intérieur a rapidement étendu son influence. Les opérations de surveillance contre les subversifs présumés se sont intensifiées, les dissidents politiques sont traqués de manière plus agressive que jamais et les structures paramilitaires du parti sont renforcées. Ynsfrán a ouvertement déclaré que « le plus grand danger pour la nation est la complaisance », exhortant le gouvernement à éliminer toutes les menaces à l'unité du Paraguay, par tous les moyens nécessaires.\n\nAu sein du Parti Colorado, les réactions sont mitigées. Alors que beaucoup saluent sa position dure comme une étape nécessaire vers la sécurisation du régime, d'autres craignent que son extrémisme puisse déstabiliser l'équilibre des pouvoirs au sein du gouvernement. Même certains au sein de l'armée sont inquiets, se méfiant des ambitions incontrôlées d'Ynsfrán et des éléments de plus en plus radicaux au sein de son entourage. Ce qui est clair, cependant, c'est que Stroessner a désormais nommé l'une de ses personnalités les plus dangereuses et les plus fidèles à la tête de la sécurité intérieure du Paraguay. Avec Ynsfrán au pouvoir, il n'y aura aucune place pour l'opposition, aucune tolérance pour la faiblesse et aucune limite à ce que le régime fera pour se préserver."
par.27.a:0 "Une étape nécessaire à l'ordre et à la stabilité."
par.28.t:0 "Les élections générales de 1958"
par.28:0 "Le 9 février 1958, les Paraguayens se sont rendus aux urnes, ce que le gouvernement a proclamé comme une réaffirmation de l'unité nationale. Cependant, le Parti Colorado restant la seule organisation politique légale, l'élection n'était guère plus qu'une démonstration formelle de la domination continue du président Alfredo Stroessner.\n\nLe régime a soigneusement chorégraphié les débats, levant temporairement l'état de siège pour la journée avant de le rétablir rapidement une fois le vote terminé. Les résultats officiels n'ont laissé aucune place à la surprise : Stroessner a été réélu sans opposition, obtenant ainsi un nouveau mandat de cinq ans avec le plein soutien de l'appareil d'État. De même, les 60 sièges de la Chambre des députés ont été attribués sans contestation à l'ANR-PC. Lors d'un acte cérémonial, Stroessner a voté au Colegio San José d'Asunción, accompagné de hauts responsables, dont son ministre de l'Intérieur, Edgar Ynsfrán.\n\nAlors que les médias gouvernementaux ont salué l'élection comme un triomphe de la démocratie paraguayenne, les observateurs extérieurs et les personnalités de l'opposition - dont beaucoup croupissent aujourd'hui en exil ou en prison - connaissaient la réalité. Aucune opposition organisée n'étant autorisée à y participer, le concours n'était qu'une étape supplémentaire dans le renforcement de l'emprise de Stroessner sur l'avenir politique du Paraguay. L'État reste fermement sous le contrôle du parti Colorado, la présidence et le corps législatif étant soumis au régime du parti unique. Ce qui reste incertain, c'est combien de temps le contrôle de Stroessner restera incontesté, ou si des fissures pourraient commencer à se former dans la structure toujours croissante de son État autoritaire."
par.28.a:0 "Encore une victoire du parti et de la nation."
par.29.t:0 "Début de la grève générale de 1958"
par.29:0 "Des troubles ont éclaté dans tout le Paraguay lorsque la Confederación Paraguaya de Trabajadores a lancé la première grève générale nationale de l'histoire du pays. Avec des milliers de travailleurs mobilisés sous la bannière des augmentations de salaires, des libertés politiques et des réformes économiques, le mouvement a pris le gouvernement par surprise.\n\nLe moment choisi pour cette frappe n'est pas une coïncidence : elle survient au milieu d'une lutte de pouvoir croissante au sein du parti Colorado au pouvoir, entre la faction civile dirigée par Epifanio Méndez Fleitas et la direction soutenue par l'armée du président Alfredo Stroessner. Le CPT étant étroitement aligné sur Méndez Fleitas, de nombreux membres du gouvernement considèrent la grève comme une manoeuvre politique directe plutôt que comme une protestation purement économique.\n\nMalgré la pression de l'État, le mouvement de grève a rapidement pris de l'ampleur. Des comités favorables à la grève se sont formés à travers le pays et Acción Católica a ouvertement exprimé son soutien à la cause. Environ 10 000 travailleurs se sont rassemblés pour une réunion de masse au siège du CPT à Asunción, où un comité de grève de quatre membres a été élu. La nation retient désormais son souffle, attendant la réponse du gouvernement."
par.29.a:0 "L'État doit agir."
par.30.t:0 "[GetNewspaperHeader]Le gouvernement rétablit l'ordre après les pourparlers"
par.30:0 "Après une brève période d'incertitude, le gouvernement a réussi à gérer la crise de la grève générale grâce à une combinaison de négociations stratégiques et d'actions décisives. Initialement, le président Alfredo Stroessner avait proposé une augmentation de salaire de 15 %, démontrant la volonté de l'administration de répondre à des préoccupations raisonnables. Cependant, des éléments extrémistes au sein de la Confederación Paraguaya de Trabajadores ont rejeté la proposition, indiquant clairement que leurs objectifs dépassaient les questions économiques.\n\nLe dialogue étant épuisé, les autorités ont pris les mesures rapides et nécessaires pour restaurer la stabilité. Les rassemblements non autorisés ont été dispersés et les forces de sécurité ont procédé à l'arrestation des responsables de la prolongation des troubles. Le siège du CPT a été sécurisé et ses dirigeants placés en détention pour empêcher toute nouvelle agitation. Le peuple paraguayen peut désormais retourner au travail en sachant que la nation reste résolue dans sa quête de stabilité et de prospérité."
par.30.a:0 "Le Paraguay reste fort et uni."
par.31.t:0 "[GetNewspaperHeader]Une action rapide du gouvernement écrase la grève"
par.31:0 "Faisant preuve de leadership, le gouvernement a agi de manière décisive pour empêcher que les récents troubles ouvriers ne se transforment en une menace encore plus grande pour la stabilité nationale. La soi-disant grève générale ayant été déclarée illégale, les forces de sécurité ont agi rapidement pour neutraliser les agitateurs responsables de l'incitation au désordre.\n\nAux premières heures du lendemain, les forces de l'ordre, appuyées par des militaires, avaient réussi à disperser les rassemblements et à sécuriser le siège de la Confederación Paraguaya de Trabajadores. Plus de 200 éléments radicaux, dont des organisateurs clés de la grève, ont été arrêtés. Même les personnalités qui bénéficiaient auparavant de l'immunité parlementaire n'étaient pas exemptées de l'application de l'ordre.\n\nLa situation étant pleinement sous contrôle, le gouvernement réaffirme son engagement à maintenir la discipline et l'unité nationale. Le peuple paraguayen peut être assuré qu'aucune tentative de déstabilisation de l'État ne sera tolérée. L'ère du chaos est révolue : le Paraguay avance plus fort que jamais."
par.31.a:0 "L'État ne négocie pas avec le chaos."
par.32.t:0 "[GetNewspaperHeader]Une nouvelle ère pour le Paraguay ?"
par.32:0 "Dans une démarche qui a surpris de nombreux cercles politiques, le président Alfredo Stroessner a annoncé une vaste série de réformes visant à moderniser le paysage politique du Paraguay. Dans une déclaration faite plus tôt cette semaine, le gouvernement a confirmé la levée de l'état de siège de longue date, le retour des exilés de l'opposition et la fin de la censure de la presse, marquant ce que les responsables décrivent comme le début d'une nouvelle ère d'ouverture politique.\nEn outre, la libération des prisonniers politiques a été ordonnée et le gouvernement s'est engagé à rédiger une nouvelle Constitution pour remplacer la charte obsolète de 1940.\n\nSi de nombreux membres du Parti Colorado au pouvoir ont accueilli favorablement cette nouvelle orientation, d'autres restent sceptiques. Pourtant, pour les personnalités de l'opposition - dont beaucoup ont passé des années en exil ou en prison, les réformes représentent une opportunité tant attendue de réintégrer l'arène politique. Pour l'instant, le Paraguay se trouve à la croisée des chemins. Reste à savoir si cette libéralisation constitue une transformation durable ou une concession temporaire, mais une chose est sûre : le paysage politique du pays est en train de changer."
par.32.a:0 "Une étape nécessaire vers l'unité nationale."
par.33.t:0 "Document 809"
par.33:0 "Une pétition de routine de deux pages, portant la cote Document 809. Tapée, tamponnée et signée par trois hauts magistrats, elle certifiait qu'un certain José Mengele avait rempli toutes les conditions légales pour la citoyenneté paraguayenne. Ses bailleurs de fonds - Werner Jung et Alejandro von Eckstein, expatriés bien connus, ont attesté de sa bonne moralité et de sa solvabilité financière. Le document contenait au moins un mensonge évident : selon lequel Mengele résidait au Paraguay depuis cinq ans. Pourtant, aucune objection n'a été soulevée. La demande a été rapidement approuvée.\n\nPour le ministre de l'Intérieur Edgar Ynsfrán, il s'agissait simplement d'une autre question administrative. Son bureau, chargé depuis longtemps de réglementer l'immigration et d'accorder la résidence à ceux jugés « utiles » au développement du Paraguay, avait supervisé d'innombrables cas de ce type. Que ce José Mengele ait choisi de s'installer dans le pays n'inquiétait pas beaucoup, du moins pas officiellement.\n\nCependant, au-delà des couloirs du gouvernement, de légers murmures se sont répandus dans les cercles diplomatiques. Certains observateurs étrangers soupçonnaient que ce nouveau citoyen paraguayen était plus qu'il ne le paraissait. Pour les rares personnes qui avaient entendu ce nom auparavant, il sonnait avec une sinistre familiarité. Pourtant, aucune preuve solide n'a émergé, aucune enquête officielle n'a été ouverte. Dans les archives, le document 809 a été classé, un nom parmi des milliers. Pour l'instant, l'affaire est close."
par.33.a:0 "Juste un autre morceau de paperasse."
par.34.t:0 "[GetNewspaperHeader] Fredesvinda Vall entre sous les projecteurs"
par.34:0 "Jusqu'à récemment, peu de Paraguayens connaissaient le nom de Fredesvinda Vall. En tant qu'épouse du président Epifanio Méndez Fleitas, elle était restée totalement en dehors de la politique. Aujourd'hui, suite à une transformation soudaine, elle est devenue une figure nationale, défendant les droits des femmes et la protection sociale. Sa première apparition majeure a eu lieu récemment sur la Plaza Uruguaya d'Asunción, où elle a déclaré : « Les femmes paraguayennes ont toujours fait avancer cette nation - elles doivent désormais avoir leur mot à dire sur son avenir ». La réponse a été massive, avec des appels croissants en faveur d'un élargissement de l'éducation, des droits du travail et de la protection sociale des femmes.\nAlors que beaucoup la célèbrent comme un symbole de progrès, les factions conservatrices au sein du Parti Colorado sont inquiètes. Les chefs militaires, déjà sceptiques quant au populisme de Méndez, voient désormais l'influence croissante de Vall comme un nouvel écart par rapport à la tradition. Pourtant, le président semble pleinement déterminé à l'élever davantage. Reste à savoir si l'ascension de Vall est le signe d'un changement durable ou d'une expérience éphémère de politique populiste, mais une chose est sûre : elle n'est plus seulement l'épouse du président."
par.34.a:0 "Une nouvelle ère pour les femmes paraguayennes ?"
par.35.t:0 "Les élections générales de 1958"
par.35:0 "Pour la première fois depuis plus d'une décennie, les Paraguayens se sont rendus aux urnes lors d'élections véritablement contestées. Avec la levée de l'interdiction des partis d'opposition par le président Epifanio Méndez Fleitas, les élections de 1958 ont marqué le retour de la démocratie multipartite. Le parti Colorado au pouvoir, dirigé par Méndez, a été confronté à son défi le plus important face au Parti libéral renaissant dirigé par Ernesto Gavilán, qui a fait campagne sur des promesses de libéralisation économique et de fin de l'interventionnisme de l'État.\n\nLa participation a été élevée, avec un enthousiasme profond dans tout le pays. Alors que les Colorados mettaient l'accent sur la stabilité, les réformes sociales et la souveraineté nationale, les libéraux faisaient appel aux élites d'affaires et à ceux qui se méfiaient des politiques populistes de Méndez. Les rapports indiquent que les zones rurales ont massivement soutenu Méndez, tandis que les centres urbains ont vu une plus forte performance en faveur de Gavilán. Alors que les derniers bulletins de vote sont comptés, le Paraguay se trouve à la croisée des chemins. Le mouvement de Méndez obtiendra-t-il son mandat, ou l'opposition provoquera-t-elle une surprise ?"
par.35.a:0 "Méndez gagne, garantissant sa vision pour le Paraguay."
par.35.b:0 "Les libéraux réalisent des gains inattendus."
par.36.t:0 "Émeutes étudiantes d'Asunción"
par.36:0 "Les troubles ont pris de l'ampleur dans le centre-ville d'Asunción alors que les étudiants, furieux de la hausse soudaine des tarifs des bus, sont descendus dans les rues. Ce qui avait commencé comme une manifestation pacifique a dégénéré en chaos, avec près de 100 personnes blessées au milieu d'affrontements avec la police et de vandalisme dispersé dans les magasins locaux. Les rapports suggèrent que certains manifestants ont lancé des pierres et érigé des barricades de fortune, tandis que les autorités ont répondu avec des gaz lacrymogènes et des matraques. L'émeute, alimentée par le mécontentement économique et l'espoir éphémère de la récente libéralisation, a ébranlé la capitale. Enhardi par la tourmente, le Parlement a exigé la démission du ministre de l'Intérieur Edgar Ynsfrán, mettant ainsi à l'épreuve l'emprise du général Stroessner sur le pouvoir. Alors que la situation est au bord du gouffre, le gouvernement doit agir de manière décisive pour réaffirmer son contrôle."
par.36.a:0 "C'est la faute de l'expérience libérale"
par.37.t:0 "Dissolution de la Chambre des Représentants"
par.37:0 "Les tensions ont atteint un point de rupture lorsque la Chambre des députés, enhardie par la brève libéralisation, a voté à une courte majorité pour condamner la réponse brutale de la police aux émeutes d'Asunción et a exigé la démission du ministre de l'Intérieur, Edgar Ynsfrán. Représentant clé du régime du général Stroessner, Ynsfrán exerçait un contrôle impitoyable sur la sécurité intérieure, supervisant un réseau de répression qui comprenait le harcèlement, la terrorisation et même le meurtre des familles des opposants. Cette contestation législative frappa au coeur de l'autorité de Stroessner, un coup qu'il ne put tolérer. Dans un geste rapide et décisif, il a dissous la Chambre des représentants et l'ensemble du corps législatif, faisant taire toute apparence d'opposition. Pour consolider son emprise, Stroessner a réimposé l'état de siège, rétablissant ses pouvoirs d'urgence pour arrêter et détenir des individus indéfiniment sans procès, interdire les rassemblements publics et écraser la dissidence d'une main de fer. Les troupes de cavalerie ont marché sur Asunción, occupant les rues clés et les places publiques pour apaiser de nouveaux troubles, leur présence rappelant brutalement la domination militaire. Dans les jours qui ont suivi, environ 300 dissidents, dont beaucoup appartenaient au Parti Colorado lui-même, ont été arrêtés, leur sort scellé par des arrestations ou un exil forcé. Cet acte de répression, cohérent avec le recours prolongé de Stroessner aux escadrons de la mort, à l'emprisonnement politique et à la censure, a marqué un retour à un régime autoritaire inflexible, laissant le printemps démocratique du Paraguay en ruines."
par.37.a:0 "Ô printemps, tu ne reviendras plus."
par.38.t:0 "[GetNewspaperHeader]Méndez dissout le parti Colorado"
par.38:0 "Dans un tremblement de terre politique qui a secoué Asunción, le président Epifanio Méndez Fleitas a signé un décret dissolvant officiellement l'Association nationale républicaine - le Parti Colorado. Pendant des générations, l'ANR a été la force politique dominante, et souvent la seule, au Paraguay. Dans un discours national, Méndez a déclaré qu'il s'agissait d'une institution « pourrie de l'intérieur », incapable de réforme et irrémédiablement liée à l'héritage de l'autoritarisme et des hommes forts militaires.\n\nA sa place, le Président a annoncé la formation d'un nouveau mouvement politique : le §YPartido Nacionalista Revolucionario§!. Selon les porte-parole du gouvernement, le PNR sera un « véritable parti populiste », bâti sur les réformes sociales du gouvernement Méndez et libéré du bagage corrompu de la vieille garde.\n\nCette décision a provoqué un profond schisme. Alors que les partisans du président le saluent comme une rupture courageuse et nécessaire avec le passé, les restes de l'ancien leadership du Colorado ont condamné cette décision comme une prise de pouvoir illégale. Le fondement politique du pays étant désormais fracturé, le Paraguay entre dans une période de profonde incertitude. La question qui préoccupe tout le monde est de savoir si ce nouveau parti pourra unir le peuple, ou s'il aura simplement plongé la nation dans une nouvelle crise politique."
par.38.a:0 "L'époque ancienne est véritablement révolue."
par.39.t:0 "[GetNewspaperHeader]Le Paraguay entre dans une nouvelle ère constitutionnelle"
par.39:0 "Après des mois de débats, l'Assemblée constituante a officiellement promulgué une nouvelle Constitution pour le Paraguay, remplaçant la charte autoritaire de 1940 qui a défini le cadre juridique du pays pendant près de deux décennies. Le nouveau document, défendu par le président Epifanio Méndez Fleitas, marque un changement fondamental dans la gouvernance paraguayenne.\n\nLes responsables gouvernementaux ont souligné les dispositions clés de la charte, qui incluent l'établissement formel de la suprématie civile sur l'armée, de solides protections pour les partis politiques et les libertés civiles, et la consécration juridique des récentes réformes sociales de l'administration, y compris de nouveaux droits pour les travailleurs. Dans un discours célébrant sa ratification, le président Méndez l'a qualifié de « acte de naissance d'un Paraguay nouveau et démocratique, libéré de l'ombre du despotisme ».\n\nLa réaction du public a été une large célébration, car beaucoup y voient la pierre angulaire de la transition démocratique du pays. Même si certains critiques conservateurs ont exprimé en privé leur inquiétude quant au fait que la nouvelle constitution va trop loin dans le démantèlement des structures étatiques traditionnelles, leurs voix ont été largement étouffées par la vague d'optimisme."
par.39.a:0 "Une nouvelle charte pour une nouvelle nation."
par.40.t:0 "Les dossiers d'Asunción"
par.40:0 "Le changement de gouvernement a apporté une nouvelle directive au ministère de l'Intérieur. Pendant des décennies, les politiques d'immigration laxistes du Paraguay et les fonctionnaires sympathiques ont permis aux expatriés européens au passé... Troublant de trouver refuge à l'intérieur de nos frontières. Cela a longtemps été un embarras discret, qui entrave notre réputation internationale.\n\nLe président Gavilán, cherchant à aligner fermement le Paraguay sur l'Occident démocratique, a autorisé une révision complète de tous les permis de séjour accordés à des personnes douteuses depuis la fin de la Grande Guerre. Cette campagne antifasciste est un signal clair ; notre nouvelle démocratie libérale ne sera pas un refuge pour les restes de la tyrannie. Le ministère de l'Intérieur coopérera avec les agences internationales pour identifier et expulser ceux qui ont falsifié leurs antécédents ou qui sont recherchés pour des crimes passés."
par.40.a:0 "Notre nation doit être un membre respectable du monde libre."
par.41.t:0 "[GetNewspaperHeader]Le Paraguay adopte une grande constitution libérale"
par.41:0 "L'assemblée constituante, convoquée par le gouvernement libéral, a officiellement ratifié la Grande Constitution libérale, remplaçant la charte désuète de 1940. Le président Ernesto Gavilán, qui a défendu la nouvelle charte, l'a saluée comme un cadre moderne essentiel pour une nouvelle ère de prospérité paraguayenne.\nContrairement à la précédente, les pierres angulaires de la nouvelle constitution sont la défense à toute épreuve de la propriété privée, l'indépendance du pouvoir judiciaire et la stricte limitation du pouvoir de l'État dans l'économie. Les responsables ont souligné que la charte garantit la libre entreprise et est spécifiquement conçue pour attirer les investissements étrangers nécessaires à la modernisation nationale.\nDans un discours prononcé après la ratification, le président Gavilán a déclaré que la constitution était « une garantie permanente que le Paraguay serait une nation de lois, et non d'hommes forts, et un phare de la démocratie de libre marché en Amérique du Sud ». La nouvelle charte a suscité un enthousiasme généralisé de la part du monde des affaires et des observateurs internationaux, qui y voient une étape essentielle vers la stabilité. Alors que certains restes populistes du gouvernement précédent l'ont dénoncé comme un renversement du progrès social, l'administration insiste sur le fait que c'est la seule voie vers une véritable prospérité à long terme."
par.41.a:0 "Les bases de la prospérité sont posées."
par.42.t:0 "Le plan de réforme judiciaire"
par.42:0 "Le nouveau gouvernement libéral a lancé l'une de ses réformes les plus fondamentales et les plus difficiles : la refonte du système judiciaire national. Pendant des décennies, sous le contrôle absolu du parti Colorado, les tribunaux n'étaient guère plus qu'une extension de l'exécutif, approuvant les décrets politiques et dispensant du favoritisme plutôt que de la justice. Ce système est incompatible avec notre vision d'une démocratie stable et libre de marché.\n\nLe président Gavilán a autorisé un « Plan formel de réforme judiciaire », établissant une commission chargée d'examiner les références et les liens politiques des juges en exercice. L'objectif est de créer un système judiciaire indépendant digne de confiance pour faire respecter les contrats et protéger les droits de propriété - une condition préalable non négociable pour attirer les investissements étrangers. Il s'agit cependant d'une attaque directe contre le pouvoir bien établi de la vieille bureaucratie du Colorado, et elle se heurtera à une résistance silencieuse et ferme."
par.42.a:0 "L'État de droit sera notre nouveau fondement."
par.43.t:0 "Un partenariat pour la prospérité"
par.43:0 "Les Accords d'Asunción ont été officiellement ratifiés, consolidant ainsi notre nouveau partenariat avec les États-Unis. Au-delà des garanties de défense mutuelle, l'accord comprend un volet économique important : un plan d'aide américain destiné à relancer notre modernisation. Nos partenaires américains ont demandé l'avis de notre gouvernement sur la destination de ces fonds initiaux.\n\nDeux écoles de pensée ont émergé au sein du cabinet. La première plaide en faveur d'une voie industrielle traditionnelle : utiliser les fonds pour construire de nouvelles §Yusines de fabrication§!, créant ainsi des emplois immédiats et une base industrielle tangible. La seconde faction, plus prospective, estime qu'il faut contourner cette étape et investir directement dans une économie moderne et qualifiée en développant §Ycentres techniques et administratifs§!. Cela jetterait les bases d'un avenir dans le domaine de la finance, de la recherche avancée et des services de haut niveau."
par.43.a:0 "Une nation se construit sur l'industrie."
par.43.b:0 "Nous devons regarder vers l'avenir."
par.44.t:0 "Commission de revue des activités passées"
par.44:0 "Avec l'autorité de la Présidence, notre gouvernement a officiellement convoqué la « Commission d'examen des activités passées ». Son mandat est clair : ouvrir les archives et enquêter sur des décennies de violence politique, de corruption et de criminalité d'État sous le régime du parti Colorado. La cible principale est le « Guión Rojo », dont les activités paramilitaires ont longtemps été qualifiées de terrorisme sanctionné par l'État.\n\nC'est une étape monumentale. Pour la première fois, nous choisissons l'État de droit plutôt que la convenance politique. Cependant, la vieille garde du Colorado reste puissante, ancrée dans l'armée, les campagnes et la bureaucratie. Cette enquête ne sera pas un simple examen administratif; ce sera une guerre politique."
par.44.a:0 "Il ne faut pas broncher. La justice doit être rendue."
par.45.t:0 "Une crise à la campagne"
par.45:0 "Les premières assignations à comparaître de la Commission ont été envoyées et la réaction a été rapide et sévère. Dans l'intérieur rural, où la loyauté du Colorado est absolue, les propriétaires fonciers et les *caudillos* locaux ont dénoncé l'enquête comme un « complot urbain libéral » contre le véritable peuple du Paraguay. Les camions de ravitaillement vers Asunción sont « retardés » et les rapports de nos agents préviennent que les anciens réseaux de Guión Rojo ne font pas seulement l'objet d'une enquête, ils sont réactivés en signe de protestation.\n\nL'armée, déjà méfiante à l'égard de notre gouvernement, prévient que cela déstabilise la nation. Nous sommes à la croisée des chemins : soit nous pouvons intensifier l'escalade et briser la résistance, soit nous pouvons réduire l'enquête pour apaiser la situation."
par.45.a:0 "C'est une insurrection. Doublez la sécurité de la Commission."
par.45.b:0 "Nous ne pouvons pas risquer une guerre civile. Limitez l'enquête à quelques chiffres de bas niveau."
par.46.t:0 "La justice est rendue"
par.47.t:0 "Une paix difficile"
par.46:0 "La répression du gouvernement a été couronnée de succès. La résistance rurale s'est effondrée et la Commission a pu achever son travail sans compromis. Le rapport final constitue un acte d'accusation accablant contre toute la vieille garde du Colorado. Des arrestations de haut niveau ont eu lieu, le Guión Rojo est brisé et le message est clair : personne n'est au-dessus des lois. Nous avons payé un prix élevé pour la stabilité, mais nous nous sommes achetés un gouvernement véritablement propre."
par.47.d:0 "La décision du gouvernement de réduire l'enquête a rétabli l'ordre. Les *caudillos* ruraux ont annulé leurs manifestations et la stabilité est revenue. Cependant, le rapport final de la Commission n'est que l'ombre de ce qu'il aurait pu être. Quelques paramilitaires de bas niveau ont été désignés boucs émissaires, mais les hauts responsables du parti et les élites corrompues qui ont orchestré les crimes restent intacts. Nous avons évité une crise, mais au prix d'une véritable justice."
par.46.a:0 "Une nouvelle ère juste pour le Paraguay."
par.47.a:0 "Un prix nécessaire à la stabilité."