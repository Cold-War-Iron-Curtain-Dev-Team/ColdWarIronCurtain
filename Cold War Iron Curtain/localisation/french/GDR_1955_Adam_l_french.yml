 GDR_Prime_Minister_Wilhelm_Adam: "Premier ministre Wilhelm Adam"
 GDR_Prime_Minister_Wilhelm_Adam_desc: "Wilhelm Adam a été élu prochain Premier ministre ; nous devrions légitimer son ascension par une cérémonie formelle d'intronisation."
 GDR_Useful_Idiots_No_More: "Fini les idiots utiles"
 GDR_Useful_Idiots_No_More_desc: "Il est temps de clarifier nos intentions ; nous cherchons à réhabiliter la nation allemande et, pour ce faire, nous prendrons le contrôle de l'appareil d'État et ferons le nécessaire pour atteindre nos objectifs."
 GDR_Reverse_Military_Purges_of_Former_Wehrmacht_Members: "Inverser les purges de la Wehrmacht"
 GDR_Reverse_Military_Purges_of_Former_Wehrmacht_Members_desc: "Même si nous comprenons le raisonnement derrière ces purges, la vérité qui dérange est que nos meilleurs soldats et commandants sont d'anciens membres de la Wehrmacht. Nous devrions plutôt travailler à leur intégration dans la Volksarmee."
 GDR_Rehabilitate_Members_of_the_League_of_German_Officers: "Réhabiliter les membres de la Ligue des officiers allemands"
 GDR_Rehabilitate_Members_of_the_League_of_German_Officers_desc: "La Ligue des officiers allemands était une organisation anti-nazie pour les soldats allemands créée par le général Walther Kurt von Seydlitz-Kurzbach. Nous devrions intégrer autant de membres de cette organisation que possible dans nos rangs."
 GDR_Sideline_Spanish_Civil_War_Veterans: "Anciens combattants de la guerre civile espagnole en marge"
 GDR_Sideline_Spanish_Civil_War_Veterans_desc: "Nous nous concentrons sur les soldats qui ont combattu pour l'Allemagne, et non sur ceux qui sont partis à l'aventure en Espagne."
 GDR_Decry_Western_Cultural_Decadence: "Décrier la décadence culturelle occidentale"
 GDR_Decry_Western_Cultural_Decadence_desc: "Regardez vers l'Ouest et vous ne verrez que la stagnation de la nation allemande, c'est honteux ! Nous devons rappeler à notre peuple que ce sont nos valeurs qui nous défendent contre cette décadence croissante."
 GDR_Stack_the_Stasi: "Empilez la Stasi"
 GDR_Stack_the_Stasi_desc: "Pour garantir la coopération de la population et des agences gouvernementales, nous veillerons à ce que la Stasi ne soit composée que des hommes les plus loyaux."
 GDR_Reapproriate_Imperial_Symbols: "Se réapproprier les symboles impériaux"
 GDR_Reapproriate_Imperial_Symbols_desc: "L'histoire allemande est vieille de plusieurs milliers d'années, bien plus longue que le règne mégalomane de Guillaume II ou le régime destructeur d'Hitler. Nous ne pouvons permettre que les fiers symboles de la nation allemande soient écartés simplement à cause des règnes courts et désagréables de ces hommes."
 GDR_The_Polish_Opportunity: "L'opportunité polonaise"
 GDR_The_Polish_Opportunity_desc: "La Pologne est actuellement confrontée à une vague de troubles sociaux. Nous pourrions peut-être profiter de leurs malheurs pour récupérer une partie des terres allemandes légitimement perdues après la guerre."
 GDR_Request_Seydlitz_to_be_Repatriated: "Demander le rapatriement de Seydlitz"
 GDR_Request_Seydlitz_to_be_Repatriated_desc: "Le général Walther Kurt von Seydlitz-Kurzbach a traversé deux guerres mondiales, la bataille de Stalingrad, et a survécu à la collaboration avec l'URSS contre Hitler. Nous avons besoin de cet homme dans notre armée."
 GDR_Appoint_Seydlitz_as_Marshal_of_the_German_Democratic_Republic: "Nommer Seydlitz comme maréchal de la RDA"
 GDR_Appoint_Seydlitz_as_Marshal_of_the_German_Democratic_Republic_desc: "Maintenant que von Seydlitz-Kurzbach a été rapatrié et réhabilité, il est temps de le nommer officiellement maréchal de la RDA."
 GDR_Review_the_Expropriation_of_Industry: "Examiner l'expropriation de l'industrie"
 GDR_Review_the_Expropriation_of_Industry_desc: "En guise de « réparations » pour la guerre d'Hitler, une grande partie de notre industrie a été expédiée vers l'Union Soviétique pour y être utilisée. Nous devons trouver un moyen d'inverser cette situation."
 GDR_Reinstate_Former_Nazi_Era_Bureacrats: "Réintégrer les anciens bureaucrates de l'ère nazie"
 GDR_Reinstate_Former_Nazi_Era_Bureacrats_desc: "Il y a beaucoup à dire sur le régime nazi, mais on ne peut nier l'efficacité de son appareil d'État. Ceux que nous jugeons suffisamment dignes et réhabilités pour servir la RDA seront utilisés à bon escient."
 GDR_Repair_the_Potsdamer_Stadtschloss: "Réparer le château municipal de Potsdam"
 GDR_Repair_the_Potsdamer_Stadtschloss_desc: "Le palais municipal de Potsdam était autrefois la résidence d'hiver des électeurs HRE, des rois de Prusse et des empereurs allemands. Malheureusement, la guerre a laissé en ruines ce symbole autrefois fier de l'Allemagne. Il faut la restaurer comme nous avons restauré l'Allemagne !"
 GDR_For_the_Preservation_of_Germany: "Pour la préservation de l'Allemagne"
 GDR_For_the_Preservation_of_Germany_desc: "Le XXe siècle a été cruel pour l'Allemagne ; nous avons perdu nos terres, d'innombrables vies et notre fierté nationale. Quoi qu'il nous arrive à l'avenir, l'indépendance de la nation allemande doit être préservée."
 GDR_Commeorate_Operation_Valkyrie: "Commémorez l'Opération Valkyrie"
 GDR_Commeorate_Operation_Valkyrie_desc: "L'opération Valkyrie était un plan audacieux visant à assassiner Adolf Hitler et à purger les dirigeants nazis. Même si cette tentative a finalement échoué, ceux qui ont risqué et donné leur vie pour le salut de l'Allemagne méritent qu'on se souvienne de ceux-là."
 GDR_Promote_Small_Business: "Promouvoir les petites entreprises"
 GDR_Promote_Small_Business_desc: "Les petites entreprises se sont avérées être la force économique de nombreuses grandes nations. Plus nous en avons, plus l'État allemand est fort !"
 GDR_Reconcile_with_the_EKD: "Se réconcilier avec l'EKD"
 GDR_Reconcile_with_the_EKD_desc: "L'Église évangélique et le gouvernement n'ont pas eu les meilleures relations au cours de la dernière décennie. Il est temps de se réconcilier et de travailler avec eux pour le bien du peuple allemand."
