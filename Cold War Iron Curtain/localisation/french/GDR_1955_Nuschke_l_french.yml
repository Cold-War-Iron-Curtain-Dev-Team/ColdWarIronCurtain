l_french: 

 GDR_Prime_Minister_Nuschke_55: "Premier ministre Nuschke"
 GDR_Prime_Minister_Nuschke_55_desc: "Otto Nuschke a assuré la direction de la RDA ; nous pouvons désormais nous concentrer sur l'adoption des réformes proposées."
 GDR_The_Internal_Party_Debate: "Le débat interne du parti"
 GDR_The_Internal_Party_Debate_desc: "Le Parti est à la croisée des chemins ; certains pensent que nous devons suivre les principes du socialisme tandis que d'autres insistent sur le fait que nous devons nous concentrer sur les idéaux de la démocratie chrétienne. Nous ne pouvons rien faire tant que ce problème n'est pas résolu."
 GDR_Embrace_Christian_Realism: "Adoptez le réalisme chrétien"
 GDR_Embrace_Christian_Realism_desc: "La nature humaine ne nous permet pas de créer la société chrétienne parfaite et idéale sur Terre, mais cela ne veut pas dire que nous ne devrions pas essayer. Adopter le réalisme chrétien est notre première étape. "
 GDR_Respect_the_EKD: "Respectez l'EKD"
 GDR_Respect_the_EKD_desc: "Nous respecterons l'autonomie de l'Église évangélique en Allemagne, rassurant ainsi le peuple sur le fait que sa foi n'est pas cooptée par l'État."
 GDR_Co_Opt_the_EKD: "Coopter l'EKD"
 GDR_Co_Opt_the_EKD_desc: "Grâce au contrôle de l'Église évangélique, nous pourrons garantir que nos idées se propagent correctement dans toute l'Allemagne. La population pourrait toutefois contester le contrôle de l'État sur ces institutions."
 GDR_Cut_Church_Taxes: "Réduire les impôts de l'Église"
 GDR_Cut_Church_Taxes_desc: "Le lourd fardeau fiscal qui pèse sur les églises vise à limiter leur financement et donc leur capacité à diffuser la bonne parole. Cela se termine maintenant."
 GDR_Amend_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights: "Modifier les lois sur la protection de la mère et de l'enfance"
 GDR_Amend_The_Law_on_Maternal_and_Child_Protection_and_Womens_Rights_desc: "La Bible nous enseigne à respecter nos femmes, mais en même temps que leur responsabilité consiste à prendre soin de nos enfants. Les lois qui compromettent ou découragent cela doivent être abrogées."
 GDR_Allow_Church_Schools: "Autoriser les écoles paroissiales"
 GDR_Allow_Church_Schools_desc: "Nous abrogerons les lois qui interdisent aux établissements d'enseignement religieux de fonctionner dans notre pays. Cela allégera les charges de l'État et promouvra nos convictions auprès des jeunes générations."
 GDR_Investigate_Earlier_Party_Purges: "Enquêter sur les purges antérieures du parti"
 GDR_Investigate_Earlier_Party_Purges_desc: "Les purges des administrations précédentes devraient faire l'objet d'une enquête. Si une injustice a été commise, elle doit être réparée."
 GDR_The_Death_of_Nuschke: "La mort de Nuschke"
 GDR_The_Death_of_Nuschke_desc: "Le Premier ministre Nuschke n'est pas un jeune homme et sa santé s'est récemment détériorée. Nous devons nous préparer pour savoir qui prendra les rênes du gouvernement après son départ."
 GDR_Prime_Minister_Luitpold_Steidle: "Premier ministre Luitpold Steidle"
 GDR_Prime_Minister_Luitpold_Steidle_desc: "Bien qu'il fasse partie de la minorité catholique, Luitpold Steidle est fidèle aux idées de notre mouvement. Il sera notre prochain leader."
 GDR_Prime_Minister_August_Bach: "Premier ministre August Bach"
 GDR_Prime_Minister_August_Bach_desc: "August Bach est fidèle à la fois au socialisme et à nos principes chrétiens. Il sera notre prochain leader."
 GDR_Launch_Party_Reforms: "Lancement des réformes du parti"
 GDR_Launch_Party_Reforms_desc: "Avec l'investiture officielle de notre nouveau Premier ministre, il est temps de lancer une série de réformes au sein du Parti pour assurer la longévité de notre gouvernement et le bien-être du peuple allemand."
 GDR_Building_Public_Support: "Bâtir le soutien du public"
 GDR_Building_Public_Support_desc: "Sans le soutien du peuple, un gouvernement est voué à l'échec. Nous rassurerons la population sur le fait que notre administration travaille dans son meilleur intérêt."
 GDR_Concessions_to_the_Middle_Class: "Concessions à la classe moyenne"
 GDR_Concessions_to_the_Middle_Class_desc: "La classe moyenne s'irrite des quotas de travail élevés et des conditions de vie difficiles. Nous allégerons leur fardeau et, en retour, rassemblerons du soutien pour notre cause."
 GDR_Introduce_Limited_Market_Socalist_Reforms: "Introduire des réformes socialistes de marché limitées"
 GDR_Introduce_Limited_Market_Socalist_Reforms_desc: "Certaines réformes socialistes seront revues, modifiées et mises en oeuvre pour créer un modèle économique équilibré."
 GDR_Condemn_the_Crusaders_of_Capital: "Condamner les croisés du capital"
 GDR_Condemn_the_Crusaders_of_Capital_desc: "L'Occident a trop d'amour pour l'argent et la propriété, pas assez d'amour pour Dieu et le don. Les sociétés fondées sur ces principes ne peuvent pas survivre."
 GDR_A_Review_of_the_Planned_Economy: "Un examen de l'économie planifiée"
 GDR_A_Review_of_the_Planned_Economy_desc: "Il est temps de réfléchir sérieusement aux avantages et aux inconvénients du modèle économique envisagé."
 GDR_Increase_Access_to_Farm_Machinery_for_Small_Landowners: "Augmenter l'accès aux machines agricoles"
 GDR_Increase_Access_to_Farm_Machinery_for_Small_Landowners_desc: "Notre agriculture est tout aussi importante que nos industries. En augmentant l'accès à de nouvelles machines agricoles, nous rendrons les agriculteurs heureux et augmenterons la production alimentaire."
 GDR_Reduce_Middle_Class_Taxxes: "Réduire les impôts de la classe moyenne"
 GDR_Reduce_Middle_Class_Taxxes_desc: "On ne peut pas s'attendre à ce que la classe moyenne supporte une charge fiscale aussi lourde et dispose de suffisamment d'argent pour subvenir à ses besoins."
