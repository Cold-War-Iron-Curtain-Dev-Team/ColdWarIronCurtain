 #LAO infantry equipment
 
 LAO_infantry_equipment_0:0 "Mosin wz. 91/30"
 LAO_infantry_equipment_0_short:0 "Mosine"
 LAO_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et basé sur un modèle importé de France. En 1889, le GAU (Ministère de la Défense de l'Empire russe) acquiert le Lebel-1886 auprès de la France et cherche à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été embauchés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer et ont produit le Mosin Nagant après une longue série d'essais et de prototypes. En 1891, le système à verrou de conception de Mosin fut mis en production. Le fusil a un temps de démontage long mais se distingue par sa grande précision. Il a été largement utilisé lors de la guerre russo-japonaise, de la Première Guerre mondiale, de la guerre civile au sein de l'Empire russe qui a conduit à la formation de l'Union soviétique, de la Seconde Guerre mondiale et de nombreux conflits mondiaux."

 LAO_infantry_equipment_1:0 "Avtomat Kalachnikova 1947"
 LAO_infantry_equipment_1_short:0 "AK-47"
 LAO_infantry_equipment_1_desc:0 "L'AK47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais n'a été mis en service actif qu'en 1948, date à laquelle la version à crosse fixe a été envoyée en production. Au début de 1949, l'AK47 fut accepté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Avec un piston à gaz à longue course, un sélecteur/sécurité, un mécanisme de déclenchement et de chambrage automatisé, ainsi que d'autres améliorations de la conception globale, l'AK47 constituait une vaste mise à niveau du SKS. L'AK47 sera, pendant de nombreuses années, considérée comme l'une des armes les plus fiables et les plus faciles à entretenir, à manipuler et à apprendre au monde."

 LAO_infantry_equipment_2:0 "Fusil d'assaut ZB-63"
 LAO_infantry_equipment_2_short:0 "ZB-63"
 LAO_infantry_equipment_2_desc:0 "Le ZB-63 est un fusil d'assaut automatique conçu par l'Arsenal du gouvernement de la RPC en 1963. Il a été utilisé au Vietnam, au Cambodge, en Afghanistan, au Kosovo et aux Touareg. L'arme comporte un mécanisme interne similaire à celui de l'AK et un mécanisme externe et un boîtier similaires à ceux du SKS. Cela permet à l'arme de faire un compromis entre la portée et la puissance de feu automatique, ce qui la rend comparable à un ZB-56 à longue portée. L'arme a une portée de tir efficace deux fois supérieure à celle du SKS et une cadence de tir légèrement supérieure à celle du ZB-56. L'arme est très fiable et son prix est modeste. Au cours des 10 années de fabrication, plus d'un million de fusils ont été fabriqués."

 LAO_infantry_equipment_3:0 "Fusil d'assaut ZB-81"
 LAO_infantry_equipment_3_short:0 "ZB-81"
 LAO_infantry_equipment_3_desc:0 "Le ZB-81 est un fusil d'assaut automatique qui peut être modifié en une variété d'armes conçues par Norinco en 1981. Il a été témoin de tous les conflits sino-chinois depuis sa création, notamment la guerre sino-vietnamienne, l'Afghanistan et le Sri Lanka. Le ZB-81 est une amélioration basée sur le ZB-63 mais n'a pas la même portée efficace. L'arme elle-même a plus de puissance de feu que le ZB-63 et intègre une variété d'éléments du Dragunov, du SKS et de l'AK47. De plus, sa durée de vie est plus longue que l'AK47. De plus, l'arme prend en charge les fixations sous le canon."

 LAO_infantry_equipment_4:0 "Fusil automatique QBZ-95"
 LAO_infantry_equipment_4_short:0 "QBZ-95"
 LAO_infantry_equipment_4_desc:0 "Le QBZ-95 est un fusil bullpup léger automatique moderne conçu par Duo Yingxian en 1991. L'arme a été utilisée au Pakistan et en Birmanie. Le QBZ-95 présente une portée similaire à celle du ZB-81 mais avec une puissance de feu bien plus élevée et une cadence de tir plus élevée. L'arme a été conçue pour remplacer le ZB-81 par un mécanisme bullpup permettant de raccourcir le fusil et de faciliter son rechargement. Le fusil utilise des matériaux polymères pour sa structure, un boulon rotatif et possède un piston à course courte. Il résiste à la corrosion et aux intempéries, ce qui le rend bien adapté à une utilisation sur des terrains extrêmes."
