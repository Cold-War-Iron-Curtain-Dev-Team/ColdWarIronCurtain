l_english:
 get_super_event_title: "-"
 SUPER_EVENT_FIRST_MAFIA_WAR_DESC: "Эта наша жизнь, это замечательная жизнь. Если ты можешь прожить жизнь вот так и выйти сухим из воды, эй, это здорово. Но это очень, очень непредсказуемо. Есть так много способов, которыми вы можете облажаться.\n-Пол «Большой Поли» Кастеллано"
 SUPER_EVENT_PRESIDENT_ROBERTSON_DESC: "Феминистская повестка дня не о равных правах для женщин. Речь идет о социалистическом, антисемейном политическом движении, которое побуждает женщин бросать мужей, убивать детей, заниматься колдовством, уничтожать капитализм и становиться лесбиянками.\n-Пэт Робертсон"
 SUPER_EVENT_PRESIDENT_MCGOVERN_1984_DESC: "Высший патриотизм — это не слепое принятие официальной политики, а любовь к своей стране, достаточно глубокая, чтобы призвать ее к более высокому стандарту.\n-Джордж Макговерн"
 SUPER_EVENT_PRESIDENT_TED_KENNEDY_DESC: "Для всех тех, чьи заботы были нашей заботой, работа продолжается, дело продолжается, надежда все еще жива, и мечта никогда не умрет.\n-Эдвард Кеннеди"
 SUPER_EVENT_PRESIDENT_JESSE_JACKSON_DESC: "Наше время пришло. Страдание воспитывает характер. Характер порождает веру. В конце концов, вера не разочарует.\n-Джесси Джексон"
 SUPER_EVENT_PRESIDENT_TRUMP_88_DESC: "Я принимал трудные решения, всегда ориентируясь на результат. Возможно, пришло время управлять Америкой как бизнесом.\n-Дональд Трамп"
 SUPER_EVENT_PRESIDENT_CLINTON_84_DESC: "В Америке нет ничего плохого, чего нельзя было бы вылечить тем, что с Америкой правильно.\n-Билл Клинтон"
 SUPER_EVENT_PRESIDENT_RUMSFELD_DESC: "Есть известные известные. Это то, что мы знаем, что мы знаем. Есть известные неизвестные. То есть есть вещи, о которых мы знаем, что не знаем. Но есть и неизвестные неизвестные. Есть вещи, о которых мы не знаем, что мы не знаем.\n-Дональд Рамсфелд"
 SUPER_EVENT_PRESIDENT_BROOKE_DESC: "Я всегда верил, что будет афроамериканский президент. Это было то, о чем я мечтал, думал, но, конечно, не верил, что это произойдет в моей жизни..\n-Эдвард Брук"
 SUPER_EVENT_PRESIDENT_INOYUE_DESC: "Великая нация предала принципы, которые сделали ее великой, и тем самым стала заложницей захватчиков заложников.\n-Дэниел Иноуэ"
 SUPER_EVENT_PRESIDENT_GLENN_DESC: "Если и есть что-то, чему я научился за годы, проведенные на этой планете, так это тому, что самые счастливые и наиболее состоявшиеся люди, которых я знал, — это те, кто посвятил себя чему-то большему и более глубокому, чем просто собственные интересы.\n-Джон Гленн"
 SUPER_EVENT_PRESIDENT_HART_DESC: "Следуй за мной. Мне все равно. Если кто-то хочет повесить на меня хвост, пожалуйста. Им было бы очень скучно.\n-Гэри Харт"
 SUPER_EVENT_PRESIDENT_DUKAKIS_DESC: "Наша величайшая сила исходит не от того, чем мы обладаем, а от того, во что мы верим; не от того, что у нас есть, а от того, кто мы есть.\n-Майкл Дукакис"
 SUPER_EVENT_PRESIDENT_BRADLEY_DESC: "Единственное, что мешает вам осуществить свою мечту, это вы сами.\n-Том Брэдли"
 SUPER_EVENT_PRESIDENT_BUSH_SR_DESC: "Никакая проблема, созданная человеком, не является слишком серьезной, чтобы ее можно было преодолеть с помощью человеческой изобретательности, человеческой энергии и неутомимой надежды человеческого духа.\n-Джордж Герберт Уокер Буш"
 SUPER_EVENT_PRESIDENT_MONDALE_DESC: "Мы верим в прочное, справедливое, сострадательное и полное надежд будущее. Вот почему я в политике. Вот почему я баллотируюсь в президенты.\n-Уолтер Мондейл"
 SUPER_EVENT_PRESIDENT_ANDERSON_INDEPENDENT_DESC: "Пришло время перестать говорить американскому народу только то, что он хочет, чтобы он услышал, и начать откровенно говорить о жертвах, которые мы все должны принести.\n-Джон Байард Андерсон"
 SUPER_EVENT_PRESIDENT_ANDERSON_GOP_DESC: "Единственный способ сделать это — снизить налоги, сбалансировать бюджет и увеличить военные расходы — это использовать зеркала, и это то, что для этого потребуется.\n-Джон Байард Андерсон"
 SUPER_EVENT_PRESIDENT_GINGRICH_DESC: "Мой стиль — оставаться в наступлении: идти на риск, очень быстро восстанавливаться после ошибки, но продолжать двигаться вперед.\n-Ньют Гингрич"
 SUPER_EVENT_CULTURAL_REVOLUTION_DESC: "В идеологической сфере не может быть мирного сосуществования. Мирное сосуществование развращает.\n-Цзян Цин"
 SUPER_EVENT_BANGLADESH_LIBERATION_DESC: "Я дал вам независимость, теперь идите и сохраните ее.\n-Муджибур Рахман"
 SUPER_EVENT_PAKISTAN_1971_VICTORY_DESC: "Да, есть обстоятельства, когда кровавое подавление правомерно и оправдано.\n-Зульфикар Али Бхутто"
 SUPER_EVENT_ASIAN_LIBERATION_WAR_DESC: "Хорошие бойцы древности сначала ставили себя вне возможности поражения, а затем ждали возможности победить врага.\n-Сунь Цзы"
 SUPER_EVENT_SMILING_BUDDHA_DESC: "Теперь я стал смертью, разрушителем миров.\n-Бхагавадгита"
 SUPER_EVENT_INDIA_62_VICTORY_DESC: "Те, кто готов умереть за любую причину, редко терпят поражение.\n-Джавахарлал Неру"
 SUPER_EVENT_PRC_62_VICTORY_DESC: "Войну можно отменить только войной, а чтобы избавиться от ружья, надо взяться за ружье.\n-Мао Цзэдун"
 SUPER_EVENT_PAKISTAN_65_VICTORY_DESC: "Аллах даровал пакистанской армии возможность продемонстрировать свои таланты и навыки.\n-Мухаммед Айюб Хан"
 SUPER_EVENT_INDIA_65_VICTORY_DESC: "Мы должны храбро сражаться за мир, как мы сражались на войне.\n-Лал Бахадур Шастри"
 SUPER_EVENT_CHINESE_ANARCHY_DESC: "Все под небом в полном хаосе; ситуация отличная.\n-Мао Цзэдун"
 SUPER_EVENT_PROJECT_NATIONAL_GLORY_DESC: "Мы живем настоящим, мечтаем о будущем и узнаём вечные истины из прошлого.\n-Чан Кайши"
 SUPER_EVENT_CMC_WW3_DESC: "Третий ангел вострубил, и большая звезда, горящая подобно светильнику, упала с неба на треть рек и на источники вод, имя звезде Полынь.\n-Откровение 8:10-11"
 SUPER_EVENT_FORD_PRESIDENCY_DESC: "Правительство, достаточно большое и сильное, чтобы дать вам всё, что вы требуете, достаточно велико для того, чтобы забрать всё, что у вас есть.\n-Джеральд Форд"
 SUPER_EVENT_PRESIDENT_EARLY_REAGAN_DESC: "У нас с вами свидание с судьбой. Мы сохраним для наших детей эту последнюю лучшую надежду человека на земле или приговорим их на первый шаг в тысячу лет тьмы.\n-Рональд Рейган"
 SUPER_EVENT_PRESIDENT_EARLY_NIXON_DESC: "Поражение не убивает человека, когда уходит – да. Человеку не конец, когда он побежден. Он закончил, когда уходит.\n-Ричард Никсон"
 SUPER_EVENT_PRESIDENT_ROCKEFELLER_DESC: "Куда бы мы ни посмотрели на эту Землю, возможности обретают форму среди проблем.\n-Нельсон Рокфеллер"
 SUPER_EVENT_PRESIDENT_AGNEW_DESC: "Свобода слова бесполезна без свободы мысли.\n-Спиро Агню"
 SUPER_EVENT_PRESIDENT_HALLECK_DESC: "Американцы должны снова жить так, как Бог хотел, чтобы мы жили, а не как какой-то бюрократ из Вашингтона ... хотел бы, чтобы мы жили.\n-Чарльз Халлек"
 SUPER_EVENT_PRESIDENT_MUSKIE_DESC: "У вас есть право, данное вам Богом, выгонять правительство без колебаний.\n-Эдмунд Сикстус Маски"
 SUPER_EVENT_BERLIN_WALL_DESC: "Берлин – это яйца Запада в нашей руке. Когда мне что-то нужно, я сжимаю Берлин\n-Никита Хрущев"
 SUPER_EVENT_MAO_DEATH_DESC: "Если бы Мао умер в 1956 году, его достижения были бы бессмертными. Если бы он умер в 1966 году, он все еще был бы великим человеком, но с недостатком. Но он умер в 1976 году. Увы, что можно сказать?\n-Чэнь Юнь"
 SUPER_EVENT_PRESIDENT_WARREN_DESC: "Если это осознанная ошибка, а не сделанная на эмоциях, не беспокойтесь об этом, именно поэтому мы учимся.\n-Эрл Уоррен"
 SUPER_EVENT_PRESIDENT_STASSEN_DESC: "Тот, кто разжигает огонь нетерпимости в Америке, разжигает огонь под своим домом.\n-Харольд Стассен"
 SUPER_EVENT_PRESIDENT_DEWEY_DESC: "Нам не нужно бояться будущего, оно будет в наших руках..\n-Томас Эдмунд Дьюи"
 SUPER_EVENT_PRESIDENT_HARRIMAN_DESC: "Никакая внешняя политика не будет успешной, если за ней не стоит американский народ. И если Конгресс этого не поймет. И пока Конгресс этого не поймет, американский народ этого не поймет.\n-Аверелл Гарриман"
 SUPER_EVENT_PRESIDENT_MARTIN_DESC: "После многих лет жизни в самых холодных реалиях я все еще верю, что человек пожинает то, что сеет, и что сеять добро - лучшее из всех вложений.\n-Джозеф Мартин"
 SUPER_EVENT_IRAQI_REVOLUTION_DESC: "Люди, я сын народа. Я клянусь перед Богом, что пожертвую собой ради вас. Я отдам свою жизнь за защиту иракского народа.\n-Абдель Керим Касем"
 SUPER_EVENT_TURKISH_INVASION_DESC: "Каждый навязывает свою систему, насколько может дойти его армия.\n-Иосиф Сталин"
 SUPER_EVENT_SOVIET_MOON_LANDING_DESC: "Первый искусственный спутник Земли на орбите был назван Спутник. Первым живым существом в космосе была Лайка. Первая ракета на Луну несла красный флаг. Первая фотография обратной стороны Луны была сделана советским фотоаппаратом. Если в этом году на орбите Земли будет вращаться человек, его имя будет Иван.\n-Джон Ф. Кеннеди"
 SUPER_EVENT_SPUTNIK_DESC: "Запуск первых двух советских спутников уже перебросил прочный мост с земли в космос, и путь к звездам открыт.\n-Сергей Королев"
 SUPER_EVENT_NIXON_RESIGNATION_DESC: "У вас больше нет Никсона, потому что, господа, это моя последняя пресс-конференция.\n-Ричард Никсон"
 SUPER_EVENT_RFK_PRESIDENCY_DESC: "Каждый раз, когда человек отстаивает идеал, или действует, чтобы улучшить судьбу других, или борется с несправедливостью, он посылает крошечную рябь надежды, пересекая друг друга из миллиона различных центров энергии и дерзко создавая эту рябь. Это поток, который может смести самые могущественные стены угнетения и сопротивления.\n-Роберт Ф. Кеннеди"
 SUPER_EVENT_HUNGARIAN_REV_CRUSHED_DESC: "Жизнь - это только долгое и горькое самоубийство, и только вера может превратить это самоубийство в жертву.\n-Ференц Лист"
 SUPER_EVENT_HUNGARIAN_REV_SUCCESS_DESC: "Меня учили, что путь прогресса не был ни быстрым, ни легким.\n-Мария Склодовская-Кюри"
 SUPER_EVENT_PRESIDENT_JFK_DESC: "Не спрашивайте, что ваша страна может сделать для вас, спрашивайте, что вы можете сделать для своей страны.\n-Джон Ф. Кеннеди"
 SUPER_EVENT_EGYPTIAN_REVOLUTION_DESC: "Из нашей нынешней ситуации больше нет выхода, кроме как проложить дорогу к нашей цели, насильственно и с применением силы, через море крови и под пылающим огнем горизонта\n-Гамаль Абдель Насер"
 SUPER_EVENT_FAROUK_TRIUMPHANT_DESC: "Весь мир восстает. Скоро останется только пять королей - король Англии, король пик, король треф, король червей и король бубен.\n-Фарук I"
 SUPER_EVENT_WOODSTOCK_DESC: "С годами Вудсток прославился и романтизировался и стал событием, символизирующим Утопию. Это последняя страница нашей коллективной памяти об эпохе невинности. Потом все стало ужасно и уже никогда не будет как раньше.\n-Ли Ань"
 SUPER_EVENT_STALIN_DEATH_DESC: "После моей смерти на мою могилу нанесут кучу мусора, но ветер истории безжалостно развеет её.\n-Иосиф Сталин"
 SUPER_EVENT_MOON_LANDING_DESC: "Мы решили отправиться на Луну в этом десятилетии и заняться другими делами не потому, что они легкие, а потому, что они трудны, потому что эта цель послужит для организации и измерения лучших из наших энергий и навыков, потому что эта задача - единственное, что мы готовы принять.\n-Джон Ф. Кеннеди"
 SUPER_EVENT_PRESIDENT_WALLACE_DESC: "Во имя величайших людей, которые когда-либо ступали на эту землю, я провожу черту в прахе и бросаю перчатку перед ногами тирании, и я говорю: сегрегация сейчас, сегрегация завтра и сегрегация навсегда.\n-Джордж Уоллес"
 SUPER_EVENT_PRESIDENT_RUSSELL_DESC: "Если нам придется начать все сначала с другими Адамом и Евой, я хочу, чтобы они были американцами, а не русскими.\n-Ричард Бревард Рассел младший"
 SUPER_EVENT_PRESIDENT_MACARTHUR_DESC: "Я беспокоюсь за безопасность нашей великой нации; не столько из-за угрозы извне, сколько из-за коварных сил, действующих изнутри.\n-Дуглас Макартур"
 SUPER_EVENT_GERMAN_REUNIFICATION_DDR_DESC: "Победа трудящихся над эксплуататорами и рабовладельцами есть в то же время победоносная освободительная борьба немецкого народа.\n-Вальтер Ульбрихт"
 SUPER_EVENT_KOREAN_WAR_KPA_VICTORY_DESC: "Мой Бог - не кто иной, как народ. Только народные массы всеведущи, всемогущи и всесильны на земле. Поэтому мой жизненный девиз таков: «Мой Бог - не кто иной, как народ. Только народные массы всеведущи, всемогущи и всесильны на земле. Поэтому мой девиз на всю жизнь: «Народ - мой Бог».\nКим Ир Сен"
 SUPER_EVENT_KOREAN_WAR_DESC: "Мы против линии компромисса с империализмом. В то же время мы не можем мириться с практикой только кричать что мы против империализма.\n-Ким Ир Сен"
 SUPER_EVENT_KOREAN_WAR_NUCLEAR_DESC: "Война - это жестокость. Нет смысла пытаться ее реформировать. Чем жестче это будет, тем скорее все закончится.\n-Уильям Текумсе Шерман"
 SUPER_EVENT_CASTLE_BRAVO_DESC: "Я думаю, что самый важный посыл, который мы могли бы вынести Касл Браво, - это то, насколько он представляет собой высокомерие.\n-Алекс Веллерштейн."
 SUPER_EVENT_TSAR_BOMBA_DESC: "Пусть будет побольше кукурузы и побольше мяса и пусть вообще не будет водородных бомб.\n-Никита Хрущев"
 SUPER_EVENT_JFK_ASSASINATION_DESC: "Я говорю, что убийство абстрактно. Вы нажимаете на курок и после этого ничего не понимаете в происходящем.\n-Жан-Поль Сартр"
 SUPER_EVENT_SINO_SOVIET_WAR_DESC: "Кто наши враги и кто наши друзья? Это первый и главный вопрос революции, а также первый и главный вопрос великой культурной революции.\n\n-Мао Цзэдун"
 SUPER_EVENT_VIETNAM_WAR_DESC: "Если душа Америки полностью отравится, часть вскрытия должна быть проведена во Вьетнаме. Его невозможно спасти, пока он разрушает надежды людей во всем мире.\n\n-Мартин Лютер Кинг"
 SUPER_EVENT_SAMSON_OPTION_DESC: "Samson said, \"Let me die with the Philistines!\" Then he pushed with all his might, and down came the temple on the rulers and all the people in it. Thus he killed many more when he died than while he lived.\n\nJudges 16:30"
 SUPER_EVENT_ANGOLAN_CIVIL_WAR_DESC: "Эта история прекрасно известна. Уже много лет империалисты, когда они поняли, что однажды эта колония может быть освобождена, они начали организовывать свои движения. Провинция Кабинда богата нефтью. Это одна из причин, по которой империалисты хотят иметь власть над Анголой. Они организовали FNLA, используя людей из ЦРУ.\n-Фидель Кастро"
 SUPER_EVENT_CUBAN_REVOLUTION_DESC: "Первый долг революционеров - сказать правду. Обманывание людей, продвижение иллюзий всегда приводит к худшим последствиям, и я считаю, что людей следует предостеречь от чрезмерного оптимизма. Как Красная Армия выиграла войну? Говоря правду. Как диктатура проиграла войну? Обманывая солдат.\n-Фидель Кастро"
 SUPER_EVENT_PORTUGESE_COLONIAL_WAR_DESC: "Организация Объединенных Наций бесполезна ... и пагубна. Это земля, которая расцветает демагогией с кучей новорожденных стран, лишенных каких-либо традиций.\n\n-Антониу ди Оливейра Салазар"
 SUPER_EVENT_RHODESIAN_UDI_DESC: "Я бы сказал, что колониализм - прекрасная вещь. Он распространил цивилизацию в Африку. До этого у них не было ни письменности, ни колеса, как мы его знаем, ни школ, ни больниц, ни даже нормальной одежды.\n\n-Ян Смит"
 SUPER_EVENT_VIETNAM_WITHDRAWL_DESC: "Ибо сейчас более чем когда-либо кажется очевидным, что кровавый опыт Вьетнама закончится тупиком. Сказать, что сегодня мы близки к победе, - значит верить в доказательства оптимистов, которые ошибались в прошлом.\n\n-Уолтер Кронкайт"
 SUPER_EVENT_YEAR_ZERO_DESC: "Я не присоединился к движению сопротивления, чтобы убивать людей, убивать нацию. Посмотри на меня сейчас. Я дикарь? Моя совесть чиста.\n\n-Пол Пот"
 SUPER_EVENT_SIMBA_REBELLION_DESC: "Есть старая конголезская пословица, что если достаточно долго наблюдать за рекой Конго, тела врагов в конце концов проплывут мимо. Касавубу наблюдал за рекой Конго в качестве президента последние пять лет, за это время мимо проплыли четыре премьер-министра.\n-«Бешеный Майк» Хоар"
 SUPER_EVENT_SOVIET_AFGHAN_WAR_DESC: "Мы не подталкивали русских к вмешательству, но мы сознательно увеличили вероятность того, что они... Эта секретная операция была отличной идеей. Это имело эффект втягивания Советов в афганскую ловушку... В тот день, когда Советы официально пересекли границу, я написал президенту Картеру: 'Теперь у нас есть возможность дать Советскому Союзу его войну во Вьетнаме.'\n-Збигнев Казимеж Бжезинский"
 SUPER_EVENT_CONGO_CRISIS_DESC: "Без достоинства нет свободы, без справедливости нет достоинства, а без независимости нет свободных людей.\n\n-Патрис Лумумба"
 SUPER_EVENT_STEVENSON_52_DESC: "Трагедия наших дней - это атмосфера страха, в которой мы живем, а страх порождает репрессии. Слишком часто зловещие угрозы биллю о правах, свободе разума прикрываются патриотическим плащом антикоммунизма.\n-Эдлай Эвинг Стивенсон II"
 Super_Event_Eisenhower_Presidency_desc: "Каждое изготовленное орудие, каждый спущенный на воду военный корабль, каждая выпущенная ракета означает в конечном итоге кражу у тех, кто голоден и не накормлен, у тех, кто замерз и не одет. Этот мир оружия не тратит одни деньги... Это вообще не образ жизни в полном смысле слова. Под облаками войны человечество висит на железном кресте.\n-Дуайт Дэвид Эйзенхауэр"
 SUPER_EVENT_KEFVAUER_52_DESC: "Либерализм означает разумные усилия, направленные на то, чтобы политическое и экономическое развитие нашей страны соответствовало обязанностям, исходящим от атомного века. Это означает расширение использования наших ресурсов для общего блага, решение проблемы поддержания демократических принципов и свободного конкурентного предпринимательства в дни Большого бизнеса, больших союзов и большого правительства.\n-Эстес Кефовер"
 SUPER_EVENT_HASHEMITE_TWILIGHT_DESC: "Кто бы ни подумал остановить восстание до того, как оно достигнет своей цели, я дам ему десять пуль в грудь.\n\n-Ясир Арафат"
 SUPER_EVENT_ARABIAN_REVOLUTION_DESC: "Одно из самых сильных естественных доказательств глупости наследственного права королей состоит в том, что природа не одобряет его, иначе она не стала бы так часто превращать это в насмешку, давая человечеству осла вместо льва.\n\n-Томас Пейн"
 SUPER_EVENT_BIDEN_VICTORY_DESC: "Никаких фундаментальных социальных изменений не происходит просто потому, что правительство действует. Это потому, что гражданское общество, сознание страны, начинает расти и требовать - требовать - требовать изменений.\n\n-Джо Байден"
 SUPER_EVENT_NIXON_VICTORY_DESC: "Холодная война не тает; он горит смертельным жаром. Коммунизм не спит; это как всегда: заговоры, интриги, работа, борьба.\n-Ричард Никсон"
 SUPER_EVENT_MCGOVERN_DESC: "Мне по уши надоели старики, выдумывающие войны для молодых людей.\n-Джордж Макговерн"
 Super_Event_LBJ_Presidency_desc: "Задача следующего полувека состоит в том, хватит ли у нас мудрости использовать это богатство для обогащения и улучшения нашей национальной жизни, а также для улучшения качества нашей американской цивилизации ...\n-Линдон Бэйнс Джонсон"
 Super_Event_President_Jerry_Brown_desc: "Мои принципы просты. Защитить Землю, служить людям и исследовать Вселенную\n-Джерри Браун"
 Super_Event_Carter_Presidency_desc: "У меня одна жизнь и один шанс сделать что-то значимым ... Моя вера требует, чтобы я делал все, что могу, где бы я ни находился, когда я могу, так долго, как могу, со всем, что у меня есть, чтобы попытаться изменить ситуацию к лучшему.\n-Джимми Картер"
 Super_Event_Reagan_Presidency_desc: "Свобода всегда находится на расстоянии не более одного поколения от исчезновения. Мы не передали его нашим детям с кровотоком. За это нужно бороться и защищать, чтобы они делали то же самое.\n-Рональд Рейган"
 Super_Event_Goldwater_Presidency_desc: "Экстремизм в защиту свободы - не порок. А умеренность в стремлении к справедливости - не добродетель.\n-Барри Голдуотер"
 Super_Event_Humphrey_Presidency_desc: "Когда-то было сказано, что моральное испытание правительства состоит в том, как оно обращается с теми, кто находится на заре жизни, с детьми; с теми, кто находится на закате жизни, старики; и с теми, кто находится в тени жизни, больным, нуждающимся и инвалидам.\n-Hubert Humphrey"
 Super_Event_chernobyl_desc: "На Чернобыльской АЭС произошла авария. Был поврежден один из ядерных реакторов. Последствия аварии устраняются. Всем пострадавшим была оказана помощь. Создана следственная комиссия."
 Super_Event_Shanghai_Defence_desc: "Взлет или падение Шанхая означает рождение или смерть всей нации.\n-Чан Кайши"
 Super_Event_Red_Finland_desc: "Communism is not something to brag about. Only work and action show what we are like. Being a communist in deed and not just in word has not been easy in this country and will not be easy in the future.\n-Ville Pessi, former general secretary of SKP"
 GFX_SPEVNT_Nixon_Elected_TEXT: "Американская мечта не приходит к тем, кто засыпает."
 GFX_SPEVNT_JFK_Elected_TEXT: "Изменение - это закон жизни. А те, кто смотрит только в прошлое или настоящее, наверняка упустят будущее."
 GFX_SPEVNT_Humphrey_Elected_TEXT: "Итак, это испытание, которое мы должны сами себе поставить; не маршировать в одиночку, а маршировать так, чтобы другие захотели присоединиться к нам."
 GFX_SPEVNT_Wallace_Elected_TEXT: "После долгих молитвенных размышлений я чувствую, что должен сказать, что поднялся на свою последнюю политическую гору."
 GFX_SPEVNT_Lyndon_Elected_TEXT: "Мы одна нация и один народ. Наша судьба как нации и наше будущее как народа зависят не от одного гражданина, а от всех граждан."
 GFX_SPEVNT_Korean_war_TEXT: "У нас только что была Мировая война..."
 GFX_SPEVNT_Korean_war_USA_TEXT: "Корея - маленькая страна, расположенная за тысячи километров, но то, что там происходит, важно для каждого американца."
 GFX_SPEVNT_premier_khrushchev_TEXT: "Нравится вам это или нет, но история на нашей стороне. Мы вас похороним!"
 GFX_EU_FUNDED_TEXT: "В Европе не будет мира, если государства восстановят себя на основе национального суверенитета, что будет иметь последствия для политики престижа и экономической защиты... Страны Европы в отдельности недостаточно сильны, чтобы гарантировать процветание и социальное развитие своим народам. Поэтому государства Европы должны образовать федерацию или европейское образование, которое превратит их в общую экономическую единицу."