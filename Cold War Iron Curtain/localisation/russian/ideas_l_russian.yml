 Gustaf_V: "Густав V"
 Gustaf_V_desc: "Оскар Густав Адольф является королем Швеции с 1907 года. Раннее правление Густава ознаменовалось укреплением парламентского правления в Швеции, хотя в преддверии Первой мировой войны он отправил в отставку либерального премьер-министра Карла Стааффа в 1914 году, заменив его своим собственным номинальным главой Яльмаром Хаммаршельдом на большую часть войны. Однако после того, как либералы и социал-демократы получили парламентское большинство при преемнике Стааффа, Нильсе Эдене, он позволил Эдену сформировать новое правительство, которое де-факто лишило монархию всех виртуальных полномочий и ввело всеобщее и равное избирательное право, в том числе для женщин, к 1919 году. Полностью подчиняясь принципам парламентской демократии, он оставался популярной фигурой в течение оставшегося 31 года своего правления, хотя и не полностью лишился влияния - во время Второй мировой войны он якобы убеждал коалиционное правительство Пера Альбина Ханссона принять просьбы нацистской Германии о материально-технической поддержке, отказ от которых мог спровоцировать вторжение. Он был первым шведским королем со времен Высокого Средневековья, который не проводил коронации и, следовательно, никогда не носил корону, традиция продолжается и по сей день."
