 why_we_fight_focus: "Почему мы боремся"
 partisan_suppression_focus: "Партизанское подавление"
 imperial_austerity_idea: "Имперская строгость"
 student_mobilization_idea: "Мобилизация студентов"
 spiritual_mobilization_idea: "Духовная мобилизация"
 spiritual_mobilization_idea_desc: ""Роскошь - наш враг!"Благодаря бережливости, гигиене и трудолюбию, возведенным в ранг национальных добродетелей, на военные нужды выделяется больше рабочей силы."
 office_of_strategic_services: "Управление стратегических служб"
 office_of_strategic_services_desc: "§LУправление стратегических служб (УСС) - это разведывательное управление Соединенных Штатов, созданное во время Второй мировой войны, которое было разведывательным управлением военного времени и предшественником Центрального разведывательного управления (ЦРУ).§!"
 nkvd: "НКВД"
 nkvd_desc: "§LНКВД, Народный Комиссариат внутренних дел был правоохранительным органом Советского Союза, который непосредственно осуществлял верховенство власти Всесоюзной Коммунистической партии. В его задачи входила также охрана советских границ и шпионаж, который включал политические убийства за рубежом, оказание влияния на иностранные правительства и проведение сталинской политики в рамках коммунистических движений в других странах.§!"
 nkvd_2: "НКВД"
 nkvd_2_desc: "§LНКВД, Народный Комиссариат внутренних дел был правоохранительным органом Советского Союза, который непосредственно осуществлял верховенство власти Всесоюзной Коммунистической партии. В его задачи входила также охрана советских границ и шпионаж, который включал политические убийства за рубежом, оказание влияния на иностранные правительства и проведение сталинской политики в рамках коммунистических движений в других странах.§!"
 idea_political_correctness: "Политическая корректность"
 idea_political_correctness_desc: "Люди, которые мыслят правильно, гораздо труднее поддаются влиянию со стороны иностранных держав."
 imperial_glory_idea: "Имперская слава"
 warrior_traditions_idea: "Воинские традиции"
 for_the_emperor_idea: "За императора!"
 indian_independence_promised_idea: "Обещанная независимость Индии"
 war_bonds_focus: "Военные облигации"
 liberty_ships_focus: "Корабли свободы"
 air_war_plans_division_focus: "Отдел воздушных планов войны"
 air_war_plans_division_focus_desc: "Только благодаря господству в воздухе державы оси будут побеждены. Долгосрочные планы по производству и развертыванию истребителей и стратегических бомбардировщиков делают это не только возможным, но и достижимым."
 air_support_focus: "Воздушная поддержка"
 strategic_bombing_focus: "Стратегическая бомбардировка"
 escort_effort_focus: "Развитие эскорт"
 comintern_influence: "Влияние Коминтерна"
 progress_cult_focus: "Культ прогресса"
 socialist_science_focus: "Социалистическая наука"
 peoples_commissariat_focus: "Народный комиссариат оборонной промышленности"
 home_of_revolution: "Дом Революции и Победителей Великой Отечественной войны"
 home_of_revolution_desc: "Товарищи, с поражением подлых троцкистов и нашей славной победой в войне мы можем сосредоточиться на нашей истинной цели-социализме в одной стране. Мы построим здесь, в Советском Союзе, Великую социалистическую утопию, и весь остальной мир неизбежно примет ее."
 en_svensk_tiger: "Шведский Тигр"
 en_svensk_tiger_desc: "Если Швеция будет подобна тигру на охоте, то те, кто шпионит за нами, не должны знать, что мы делаем. В это время конфликтов и раздоров патриотический долг каждого шведа-хранить молчание."
 state_shintoism: "Государственный синтоизм"
 state_shintoism_desc: "После Реставрации Мэйдзи мы стремились использовать поклонение в синтоистских святилищах для поощрения имперской лояльности и помощи в национальном строительстве. Это позволило нам построить страну, которая готова многим пожертвовать во имя государства."
 vittoria_mutilata: "Изуродованная Победа"
 vittoria_mutilata_desc: "§LНаши союзники предали Италию и нанесли нам удар в спину, когда нарушили лондонский пакт. Мы пожертвовали так много крови ради их победы, а они в свою очередь отказали нам в том, что было нашим по праву. Теперь Италия возьмет свою судьбу в собственные руки и добьется справедливости.§!"
 stiff_upper_lip: "Британский стоицизм"
 stiff_upper_lip_desc: "Если ты можешь держать голову когда все вокруг тебя\nтеряют их и обвиняют в этом вас,\nесли вы можете встретиться с триумфом и катастрофой\nи относиться к этим двум самозванцам точно так же\nкак ваша земля и все, что в ней находится,\nи что еще важнее - ты станешь мужчиной, сын мой."
 trotskyite_plot: "Троцкистский заговор?"
 trotskyite_plot_desc: "Паранойя и патологическое недоверие, проистекающие из старой борьбы за власть, влияют на руководство этой страны."
 trotskyite_plot_purged: "Троцкистский заговор завершён?"
 trotskyite_plot_purged_desc: "Несмотря на чистки, страх предательства остается."
