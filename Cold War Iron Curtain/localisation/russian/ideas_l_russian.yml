 home_of_the_free: "Дом свободы"
 home_of_the_free_desc: "США считают себя бастионом и, возможно, даже колыбелью демократии и свободы. Какими бы они ни были, их ценности трудно скомпрометировать, какими бы заманчивыми ни казались некоторые возможности."
