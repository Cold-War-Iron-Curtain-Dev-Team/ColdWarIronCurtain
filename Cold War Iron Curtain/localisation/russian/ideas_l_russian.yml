 banana_republic_desc: "Термин, придуманный американским писателем Уильямом Сидни Портером, "банановая республика" описывает политически нестабильное государство с экономикой, зависящей от экспорта ограниченных ресурсов. Как правило, в банановой республике существует общество крайне стратифицированных социальных классов, обычно это крупный обнищавший рабочий класс и правящая плутократия, состоящая из деловых, политических и военных элит этого общества."
