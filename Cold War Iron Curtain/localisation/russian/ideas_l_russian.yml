 sisu: "Sisu"
 sisu_desc: "Важная особенность финского национального характера, одно из национальных слов-символов Финляндии. Сису представляет сложное, амбивалентное сочетание выдержки, упорства, переходящего в упрямство, выносливости, стойкости, настойчивости, мужества, смелости и прямолинейности."
 great_depression: "Великая депрессия"
 great_depression_desc: "Хотя Великая Депрессия и является общемировым явлением, она началась с краха фондового рынка в Соединенных Штатах и привела к резкому росту безработицы и падению налоговых поступлений. Американскому народу и его правительству есть о чем беспокоиться, не ввязываясь в очередную войну."
 new_deal: "Новая сделка"
 new_deal_desc: "Комплекс политики и программ, инициированных Франклином Д. Рузвельтом, реакция на трудности, перенесенные во время the."
 wilkies_new_deal: "Новый курс Уилки"
 wilkies_new_deal_desc: "Хотя Уэнделл Уилки выступил против некоторых предложений Рузвельта по расширению нового курса, некоторые аспекты были поддержаны и сохранены новым президентом."
