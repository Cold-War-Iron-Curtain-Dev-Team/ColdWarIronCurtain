 internationalism: "Интернационализм"
 internationalism_desc: "Мы твердо верим, что идеология распространяется через национальные границы, и не чувствуем себя ограниченными в пересечении этих границ сами."
 combined_bomber_offensive: "Комбинированное бомбардировочное наступление"
 the_long_lance: "Длинное копье"
 the_long_lance_desc: "§LТорпеда Type-93, обычно называемая длинным копьем, была самой совершенной торпедой того времени. Он был разработан Японией и никогда по-настоящему не соответствовал западу, давая маленьким кораблям эффективный способ ранить большие, более бронированные военные корабли на расстоянии.§!"
