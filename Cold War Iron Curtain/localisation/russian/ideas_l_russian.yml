 jim_jones: "Джим Джонс"
 jim_jones_desc: "Лидер Храма Народов, Джонс - харизматический лидер, который сочетает в себе элементы христианства с коммунистическими и социалистическими идеями, а также подчеркивает расовое равенство."
 fascist_influence: "Фашистское влияние"
 fascist_influence_desc: "Фашистское давление сделало фашизм очень популярным, и страна склонна объединяться с другими фашистами."
 communist_influence: "Коммунистическое влияние"
 communist_influence_desc: "Коммунистическое давление сделало коммунизм очень популярным, и страна восприимчива к объединению с другими коммунистами."
 democratic_influence: "Демократическое влияние"
 democratic_influence_desc: "Демократическое давление сделало демократию очень популярной, и страна склонна объединяться с другими демократами."
 soviet_german_friendship: "Советско-германская дружба"
 soviet_german_friendship_desc: "Германский Рейх и Советский Союз объединились в дружбе против разлагающегося Запада."
 sour_loser: "Полный неудачник"
 sour_loser_desc: "Горечь поражения в Великой войне доминирует в политике этой нации."
 hasta_siempre_comandante: "Hasta Siempre, Comandante!"
 hasta_siempre_comandante_desc: "Мы победили революцию и освободили народ Кубы!"
 sugar_crisis: "Сахарный кризис"
 revolutionary_plot: "Революционный заговор"
 revolutionary_plot_desc: "Коммунисты планируют свергнуть действующее правительство."
 porsche: "Porsche"
 porsche_desc: "Porsche предпочитает танки с тяжелой броней."
 Krauss_Maffei: "Krauss-Maffei Werke"
 Krauss_Maffei_desc: "Kraus-Maffei Werke производит преимущественно поезда, троллейбусы и автобусы для внутреннего и внешнего рынков. Позже начали работать над знаменитыми танками Leopard 1 и 2."
 henschel: "Henschel"
 henschel_desc: "Henschel отвечал за все серийно выпускаемые модели "Тигра", танки, которые после того, как были решены ранние проблемы надежности, показали замечательные результаты."
 GER_MAN: "MAN"
 GER_MAN_desc: "Наиболее известный танк "Пантера", MAN также участвовал в разработке и производстве более ранних моделей танков."
 rheinmetall: "Rheinmetall"
 rheinmetall_desc: "Rheinmetall проектирует и строит все типы больших пушек и пушек."
 mauser: "Mauser"
 mauser_desc: "Mauser проектирует и производит все виды стрелкового оружия."
 ig_faben: "IG Farben"
 ig_faben_desc: "IG Farben очень заинтересованы в промышленных исследованиях."
 messerschmitt: "Messerschmitt"
 messerschmitt_desc: "Messerschmitt фокусируется на разработке легких самолетов, таких как истребители."
 focke_wulf: "Focke Wulf"
 focke_wulf_desc: "Focke Wulf проявляет особый интерес к проектированию средних самолетов, таких как тяжелые истребители."
 junkers: "Junkers"
 junkers_desc: "Junkers наиболее известен тем, что разработал пикирующий бомбардировщик Stuka."
 todt: "Фриц Тодт"
 todt_desc: "Немецкий инженер, был основателем компании Todt. Он увеличит скорость строительства гражданских промышленных объектов."
 speer: "Альберт Шпеер"
 speer_desc: "Немецкий архитектор, который был министром вооружений и военного производства с 1942 по 1945 год. Его назначение, которое часто приписывают "оружейному чуду", повысит эффективность промышленности."
 raeder: "Эрих Редер"
 raeder_desc: "Немецкий адмирал, который выступал за использование традиционных надводных кораблей и флота в качестве доктрины."
 donitz: "Карл Дёниц"
 donitz_desc: "Немецкий адмирал с любовью к подводным лодкам и доктрине торговой блокады."
 goering: "Герман Геринг"
 goering_desc: "Великий военный ас, который стал одним из главных сторонников Гитлера."
 walther_wever: "Вальтер Вевер"
 walther_wever_desc: "Командующим Люфтваффе до Второй мировой войны. Он был ранним сторонником теории стратегических бомбардировок."
 ritter_von_greim: "Роберт фон Грейм"
 ritter_von_greim_desc: "Сторонник тактического запрета."
 ernst_udet: "Эрнст Удет"
 ernst_udet_desc: "Оказал большое влияние на внедрение методов пикирования, а также пикирующего бомбардировщика Stuka."
 werner_von_fritsch: "Ве́рнер фон Фрич"
 werner_von_fritsch_desc: "Генерал старой гвардии, предпочитает сосредоточиться на пехоте."
 ludwig_beck: "Людвиг Бек"
 ludwig_beck_desc: "Особый акцент на поставках."
 franz_halder: "Франц Гальдер"
 franz_halder_desc: "Верит в ударную мощь артиллерии в атаке."
 heinz_guderian: "Гейнц Гудериан"
 wilhelm_keitel: "Вильгельм Кейтель"
 wilhelm_keitel_desc: "Генерал старой гвардии, предпочитает пехоту. Недостаток мастерства он восполняет преданностью."
 ferdinand_schorner: "Фердинанд Шёрнер"
 ferdinand_schorner_desc: "Искусен в обороне и сражениях в холодных погодных условиях."
 general_staff: "Генеральный штаб"
 general_staff_desc: "Германский Генеральный штаб отвечал за непрерывное изучение всех аспектов войны, включая составление и пересмотр планов мобилизации или кампании. Это способствовало повышению уровня организации в армии."
 v_weapons: "Оружие Мести"
 v_weapons_desc: "Дальнобойные ракеты были бы идеальным оружием мести против наших врагов."
 hermann_gortz: "Херманн Гёрц"
 hermann_gortz_desc: "§HХерманн Гёрц§! опытный немецкий шпион."
 elyesa_bazna: "Эльяс Базна"
 elyesa_bazna_desc: "§HЭльяс Базна§! широко известен под своим кодовым именем Цицерон."
 marina_lee: "Марина Ли"
 marina_lee_desc: "§HМарина Ли§! балерина, которая специализируется на краже планов сражений."
 german_advisors: "Немецкие военные советники"
 german_advisors_desc: "Немецкая военная миссия во главе с Александром фон Фалькенхаузеном находится в Китае, и ее советники помогают нам привести нашу армию к западным стандартам."
