 neutrality_idea: "Нейтральная внешняя политика"
 neutrality_idea_desc: "Нейтралитет иногда рассматривается как трусливая позиция, но эта нация верит, что когда пыль осядет, те, кто не встал на чью-то сторону, могут оказаться в лучшем положении, чем те, кто встал на ее сторону."
 anti_soviet_pact: "Антисоветский пакт"
 anti_soviet_pact_refused_call: "Отказался соблюдать антисоветский пакт"
 anti_soviet_pact_refused_call_desc: "Этот народ не соблюдал антисоветский пакт, когда его призывали к войне. Это заставило народ усомниться в действующей власти и подстегнуло рост числа сторонников коммунистов."
 anti_soviet_pact_desc: "Если на одну из стран пакта нападет Советский Союз, все остальные страны-участницы будут призваны к войне. Членом уже воюющего с Советским Союзом государства не назовешь."
