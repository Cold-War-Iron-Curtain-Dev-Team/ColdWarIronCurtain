 LAO_infantry_equipment_0:0 "Мосин ко. 91/30"
 LAO_infantry_equipment_0_short:0 "Мосин"
 LAO_infantry_equipment_0_desc:0 "Мосин-Наган - Русская винтовка с продольно-скользящим затвором, использовавшаяся в Российской империи и созданная на основе конструкции, импортированной из Франции. В 1889 году МОРИ (Министерство обороны Российской империи) приобрело у Франции винтовку Лебеля-1886 и попыталось усовершенствовать ее конструкцию. Министерство наняло различных русских ученых и инженеров под руководством капитана Сергея Мосина и Леона Нагана для усовершенствования конструкции, и после долгих испытаний и создания опытных образцов был создан Наган Мосина. В 91-м году 1891 года винтовка Мосина была запущена в производство. Винтовка имеет длительное время разборки, но отличается высокой точностью стрельбы. Она широко использовалась в Русско-японской войне, Первой мировой войне, гражданской войне в Российской империи, которая привела к образованию Советского Союза, Второй мировой войне и многочисленных мировых конфликтах."
 LAO_infantry_equipment_1:0 "Автомат Калашникова 1947"
 LAO_infantry_equipment_1_short:0 "AK-47"
 LAO_infantry_equipment_1_desc:0 "AK47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длино-ходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. На протяжении многих лет АК47 будет считаться одним из самых надежных и простых в обслуживании, обращении и изучении оружием в мире."
 LAO_infantry_equipment_2:0 "Штурмовая винтовка ZB-63"
 LAO_infantry_equipment_2_short:0 "ZB-63"
 LAO_infantry_equipment_2_desc:0 "ZB-63 - автоматическая штурмовая винтовка, разработанная правительственным арсеналом КНР в 1963 году. Он принимал участие в боевых действиях во Вьетнаме, Камбодже, Афганистане, Косово и Туареге. Оружие имеет внутренний механизм, аналогичный АК, и внешний механизм и корпус, аналогичные СКС. Это позволяет оружию найти компромисс между дальностью и мощностью автоматического огня, что делает его сравнимым с дальнобойным ZB-56. Дальность стрельбы в два раза выше, чем у СКС, а скорострельность несколько выше, чем у ZB-56. Оружие очень надежно и имеет небольшую цену. За 10 лет производства было выпущено более 1 миллиона винтовок."
 LAO_infantry_equipment_3:0 "Штурмовая винтовка ZB-81"
 LAO_infantry_equipment_3_short:0 "ZB-81"
 LAO_infantry_equipment_3_desc:0 "ZB-81 - это автоматическая штурмовая винтовка, которая может быть модифицирована в различные виды оружия, разработанная компанией Norinco в 1981 году. С момента своего появления она побывала во всех китайских конфликтах, включая китайско-вьетнамскую войну, Афганистан и Шри-Ланку. ZB-81 является усовершенствованной моделью ZB-63, но не имеет такой же эффективной дальности стрельбы. Само оружие обладает большей огневой мощью, чем ZB-63, и включает в себя различные элементы от автоматов Драгунова, СКС и АК47. Кроме того, срок службы оружия больше, чем у АК47. Кроме того, оружие поддерживает подствольное навесное оборудование."
 LAO_infantry_equipment_4:0 "Автоматическая винтовка QBZ-95"
 LAO_infantry_equipment_4_short:0 "QBZ-95"
 LAO_infantry_equipment_4_desc:0 "QBZ-95 - это современная автоматическая легкая винтовка типа булл-пап, разработанная Дуо Инсянем в 1991 году. Оружие использовалось в Пакистане и Бирме. QBZ-95 имеет дальность стрельбы, аналогичную ZB-81, но значительно большую огневую мощь и более высокую скорострельность. Оружие было разработано для замены ZB-81 с механизмом буллпап, чтобы укоротить винтовку и облегчить ее перезарядку. В конструкции винтовки использованы полимерные материалы, поворотный затвор и короткоходный поршень. Она устойчива к коррозии и атмосферным воздействиям, что делает ее хорошо подходящей для использования в экстремальных условиях."