l_russian:
 pol_desc_ulbcricht: "§YПервый секретарь Социалистической единой партии Германии, председатель Государственного совета, председатель Совета национальной обороны§!\nРожденный в бедной семье в Лейпциге, Саксония, Вальтер провел детство вполне нормальным для низших слоев Саксонии того времени. Уолтер посещал начальную школу в течение восьми лет своего официального образования, а затем перевел образование на изучение присоединения и ремесленничества. Оба родителя Ульбрихта были членами СДПГ (Социал-демократической партии), которую Вальтер впоследствии зарегистрировал в 1912 году. Впечатлительный подросток Ульбрихт радикализировал свои взгляды до такой степени, что вступил в Коммунистическую партию Германии после того, как дважды дезертировал из армии во время Великой войны. После войны Ульбрихт был избран в Центральный комитет партии. Видеть большевизацию Коммунистической партии, а также реорганизацию ее в оперативную ячейку. Вальтеру предстояло стать важным членом партии, и в конце концов он был избран в Рейхстаг в качестве представителя коммунистической партии. Когда Адольф Гитлер пришел к власти в Германии, Ульбрихт бежал из страны, чтобы жить за границей, работая в качестве агента КПД, строго преследуя Трокситов и других уклонистов. Ульбрихт вернулся в Восточную оккупированную Германию в 1945 году, чтобы помочь в восстановлении КПД и последующем слиянии с СДПГ, чтобы сформировать SED (Социалистическую партию единства). К 1949 году с созданием РДР Уолтер был назначен заместителем премьер-министра государства и создал должность генерального секретаря в администрации. После смерти пика в 1960 году Уолтер быстро консолидировал власть и устранил всех своих противников, гарантируя, что десталинизация не произойдет в РДР. До открытия Берлинской стены власть Ульбрихта над экономикой была мало либерализована с массовым наблюдением за населением Восточной Германии. Через восемь лет после смерти Сталина Ульбрихт, по-видимому, остается последним человеком в блоке, который продолжает принимать сталинизацию. Остается открытым вопрос, что об этом подумает новое руководство Союза."
 pol_desc_stalin: "§YГенеральный секретарь Коммунистической партии Советского Союза, Председатель Совета Министров Советского Союза, Верховный Главнокомандующий советскими вооруженными силами§!\nХотя некоторые могут считать его диктатором, нельзя отрицать его достижений. Всего за два десятилетия ему удалось превратить Союз из крестьянского общества в промышленную и военную сверхдержаву."
 RAKOSI_DESC: "§YГенеральный секретарь Венгерской рабочей Народной партии§!\nМатьяш Ракоши, выросший в сербской еврейской семье из четырех человек, вырос в Аде, Сербия (тогда Австро-Венгрия). Проживая довольно скромную жизнь вместе со своими четырьмя братьями и сестрами и родителями, семья Матьяша переехала в Венгрию. В свои двадцать с лишним лет Ракоши принял социал-демократию, а позже стал сторонником коммунизма. Ракоши считал, что атеизм является основной ценностью коммунистического дела, в конечном итоге осуждая его личную еврейскую веру. Служа в австро-венгерской армии во время великой войны, Ракоши был взят в плен в русской армии. В 1918 году Ракоши вернулся в Венгрию как убежденный коммунист, выполнявший комиссарские обязанности в недолгом венгерском коммунистическом режиме Бела Куна. Матьяш был вынужден бежать в Москву из-за контрреволюции в Венгрии, и в 1924 году был отправлен обратно в Венгрию для реорганизации коммунистической партии в стране. Вслед за многочисленными арестами венгерскими властями и возможным пожизненным заключением в 1934 году. Будучи главой Коммунистической партии Венгрии в изгнании, Ракоши должен был вернуться на родину в 1944 году в сопровождении советских войск. В конце концов Ракоши стал секретарем венгерской коммунистической партии и был разоблачен как убежденный сталинист. Пока Сталин остается секретарем, Матьяш Ракоши останется у власти столько, сколько будет сочтено необходимым."
 pol_desc_khrushchev: "§YПервый секретарь ЦК Коммунистической партии Советского Союза, председатель Бюро Центрального комитета Российской Федерации, Председатель Совета Министров Советского Союза, Председатель Президиума ЦК Коммунистической партии Советского Союза.§!\nНикита Хрущев родился в бедной крестьянской семье недалеко от украинской границы. Он провел свои юношеские годы, работая металлистом на Юзовке. Первая мировая война радикализировала Хрущева, который стал рабочим лидером, и он в конечном счете присоединился к большевикам, поскольку служил политическим комиссаром во время гражданской войны в России. После войны он начал стремительный рост внутри коммунистической партии на Украине, поступил в школу и вскоре поселился в Москве. Сталинские чистки способствовали его возвышению. Он вернулся в армию во время Второй мировой войны и на протяжении всей войны служил на всех основных фронтах. После войны он резко очистил Украину и начал агрессивную кампанию по восстановлению экономики, которая вызвала голод, но оживила промышленность. Сталин в конце концов отозвал Хрущева в Москву, где он наблюдал за строительными проектами и вступил во внутренний круг. После смерти Иосифа Сталина Хрущев вступил в союз с ключевыми военными и политбюро лидерами и перехитрил избранного преемника, Георгия Маленкова и бывшего шпионского мастера Лаврентия Берия. Находясь у власти, Хрущев стремится укрепить свою власть над партией и поставить Советский Союз на путь марксистско-ленинской идеологии."
 pol_desc_pieck: "Пик был одним из ведущих коммунистов Веймарской республики. После прихода Гитлера к власти он эмигрировал в Прагу, затем в Париж, а затем в Москву. Сталин ему глубоко доверяет."
 pol_desc_konrad: "Конрад Герман Йозеф Аденауэр по прозвищу \"Der Alte\" (старейшина) является набожным христианином и основателем Христианского демократического союза Deutschlands. Его политика демонстрирует сильную приверженность широкому видению рыночной либеральной демократии и антикоммунизма. Считая, что прочный мир может быть достигнут только через Единую Европу, он глубоко привержен европейскому сотрудничеству, ориентированной на Запад внешней политике и восстановлению позиций Западной Германии на мировой арене."
 pol_desc_minh: "§YПредседатель Центрального комитета Рабочей партии Вьетнама, президент Демократической Республики Вьетнам§!\nСын имперского магистрата Хо Ши Мина с юности поступил во французские школы. В конце концов он ушел из дома, чтобы работать поваром на кораблях, посетив Францию, Великобританию и Соединенные Штаты. Это подвергло его многим идеям, и во Франции он стал убежденным социалистом. Его усилия по представлению вьетнамского права на самоопределение после Первой мировой войны были проигнорированы союзниками, что еще больше радикализировало Минь, который вскоре переехал в Москву для обучения. Он стал агентом Коминтерна, вернувшись во Вьетнам в 1941 году, чтобы возглавить антиколониальное движение во Вьетнаме. Во время войны он укрепил свою политическую власть над соперниками и освободил большую часть страны от японской оккупации. Однако после войны он снова был проигнорирован западными союзниками, которые позволили Франции вновь оккупировать Вьетнам. Теперь Хо Ши Мин возобновил освободительную борьбу с широкой коммунистической помощью. Рассматриваемая как национальный герой, Франция теперь борется за сдерживание Вьетминь и растущую популярность Хо Ши Мина."
 desc_leader_marulanda: "Прозванный "Tirofijo", Сурешот, Маруланда принял коммунистические идеи во время La Violencia, беспорядков после убийства Хорхе Элисера Гайтана, кандидата от Либеральной партии."
 pol_desc_un: "Это государство контролируется ООН через специальный комитет."
 POLITICS_MAO_ZEDONG_DESC: "§YПредседатель Коммунистической партии Китая, председатель Центральной военной Комиссии, Председатель Китайской Народной Республики, почетный председатель Национального комитета КПКК§!\nМао Цзэдун, более известный как председатель Мао, является отцом-основателем китайской народной республики. Спорная фигура, безусловно, Мао считается одной из самых важных фигур в мире. Он также известен как политический теоретик, военный стратег, поэт и провидец. Сторонники приписывают ему изгнание империализма из Китая, его модернизацию и превращение в мировую державу, улучшение положения женщин, улучшение образования и здравоохранения, а также увеличение продолжительности жизни. И наоборот, его режим называют автократическим и тоталитарным, осуждая за массовые репрессии и уничтожение религиозных и культурных памятников и памятников культуры."
 legacy_of_the_reich: "Наследие Рейха"
 PRC_the_dying_man: "the dying man"
 PRC_A_member_of_the_Central_Military_Commission: "member of the Central Military Commission"
 PRC_leader_of_the_party_and_state: "the leader of the party and state"
 PRC_a_member_of_the_revolutionaries_and_rebels: "a member of the revolutionaries and rebels"
 POLITICS_CHE_DESC: "Эрнесто, более известный как Че, - популярный марксист, революционер, врач, писатель, партизан, дипломат и военный теоретик."
 POLITICS_DE_GAULLE_DESC: "Шарль де Голль вырос в академической и патриотической французской семье. Несмотря на свое увлечение чтением и философией, он решил стать офицером французской армии. Вскоре после его назначения началась Первая Мировая Война, и он проявил свой характер, выиграв несколько сражений, но закончив войну военнопленным. В межвоенный период де Голль стал ведущим военным мыслителем, опубликовав несколько влиятельных работ по маневренной войне, которые в значительной степени игнорировались высшими французскими командирами. Во время Второй мировой войны Патриот де Голль бежал в Лондон до капитуляции Франции в 1940 году. Он осудил капитуляцию и продолжил войну как лидер Свободной Франции. В конечном счете, он управлял Францией после ее освобождения от оси и французского правительства Виши. Он наблюдал за возрождением Французской Республики после войны, но ушел в отставку в 1946 году из-за политических разногласий. С тех пор он писал свои мемуары и спокойно наблюдал за развитием событий во Франции со стороны. В то время как Франция борется с деколонизацией и политической нестабильностью, многие во Франции смотрят на де Голля как на потенциального спасителя."
 POL_TRUMAN: "Когда Франклин Д. Рузвельт умер в 1945 году, Трумэн занял пост президента и провел свою страну через заключительные этапы Второй мировой войны. После окончания войны с применением ядерного оружия Трумэн предпринял попытку остановить советскую экспансию и занялся интернационалистской внешней политикой, отказавшись от изоляционизма."
 POL_EISENHOWER: "Дуайт Эйзенхауэр вырос страстным исследователем природы в своем родном Канзасе. В конце концов он поступил в Военную академию Вест-Пойнта и окончил ее в 1912 году. Во время Первой мировой войны он руководил подготовкой тысяч людей, впечатляя многих своими организаторскими способностями. В межвоенный период Эйзенхауэр служил под началом ряда высоко ценимых американских генералов, которые преподали много уроков молодому офицеру. Этот опыт оказался решающим во время Второй мировой войны, когда он быстро поднялся до Верховного Главнокомандующего союзниками в Европе. Он руководил операциями союзников от вторжения в Северную Африку до окончательного вторжения союзников в Германию. Его способность ставить нужных людей на ключевые посты, управлять личностями и организаторские способности позволили ему руководить одним из крупнейших военных командований в мировой истории. После войны он возглавил американскую оккупацию Германии, став верховным главнокомандующим НАТО в 1950 году. После своей отставки в 1952 году чрезвычайно популярный генерал решил принять участие в президентских выборах 1952 года, чтобы попытаться руководить Соединенными Штатами в этот решающий период истории."
 POLITICS_JOHN_XXIII_DESC: "Папа Иоанн XXIII - 261-й Папа Римский. Он увлечен своей работой и твердо верит в равенство."
 POLITICS_KEKKONEN_DESC: "Урхо Калева Кекконен - 3-я самая популярная, уважаемая и узнаваемая фигура в финской политической истории. Будучи президентом, Кекконен продолжал активную политику нейтралитета, в рамках которой Финляндия сохраняла свою независимость, сохраняя при этом хорошие отношения и обширную торговлю как с членами НАТО, так и с членами Варшавского договора.в дополнение к своей обширной политической карьере, Кекконен был известен как писатель. Он славно писал юмористические, информативные колонки для журнала Suomen Kuvalehti под несколькими псевдонимами, даже во время своего президентства."
 POLITICS_KLEMENT_GOTTWALD_DESC: "§YПредседатель Коммунистической партии Чехословакии, 5-й президент Чехословакии§!\n Детство Клемента, родившегося незаконнорожденным сыном у обедневшего крестьянина в деревне Геролтице, Австро-Венгрия-Моравия, было совершенно непривилегированным, Клемент провел детство в полном одиночестве. В возрасте 12 лет Клемент был отправлен в Вену учиться столярному делу и краснодеревщику. Во время учебы в Вене Клемент начал посещать социал-демократические молодежные собрания, в конце концов присоединившись к движению. Готвальд служил в Австро-Венгерской армии, однако в 1918 году дезертировал к русским. Клемент вернулся в новообразованную Чехословацкую республику, где вступил в Чехословацкую Социал-демократическую партию. В 1921 году ЦСР стала коммунистической партией Чехословакии (КСЧ ). К 1925 году Готвальд был избран в Центральный комитет КСЧ и переехал в Прагу, позже став генеральным секретарем партии. На протяжении всей немецкой оккупации Чехословакии Клемент неоднократно выступал в эфире чешского подпольного движения из Советского Союза. В 1946 году Клемент Готвальд стал председателем КСЧ и премьером Третьей Республики Чехословакии. Недавно Клемент сменил прежнего президента и укрепил свои позиции у власти, пообещав новое видение процветания и порядка для народа Чехословакии."
 POLITICS_ATTLEE_DESC: "Родившийся в семье среднего класса в Лондоне, Клемент Эттли вступил в политику в 1919 году и стал лидером Лейбористской партии в 1935 году. Во время Второй мировой войны он был призван в коалиционное правительство Уинстона Черчилля, в частности, занимал должность заместителя премьер-министра с 1942 по 1945 год. Когда на пике войны в Европе были назначены всеобщие выборы, Эттли привел Лейбористскую партию к неожиданной уверенной победе. Печально известный своей прямотой, относительно спокойный человек, тем не менее, был очень искусен в быстрых, решительных действиях. Его стиль руководства был коллективным, но как только премьер - министр позволял своему кабинету высказывать свое мнение, он быстро принимал решения с военной точностью."
 POLITICS_HENRIQ_DESC: "Анри Кёй, сельский врач из центрального французского департамента Коррез, начал свою политическую карьеру в 1914 году, когда был избран представителем Корреза в Национальном Собрании. С 1924 года он был членом почти каждого кабинета вплоть до Второй мировой войны, перейдя от сельского хозяйства к общественному здравоохранению, почте и телеграфу, а также общественным работам. В 1943 году он присоединился к свободным французским силам Шарля де Голля в Лондоне, а после войны вернулся в Национальное Собрание. Он всегда был членом Радикальной партии."
 POLITICS_ZONGREN_DESC: "Бывший военачальник Гуанси, Цзунжэнь теперь является гоминьдановским военачальником и президентом Китая."
 POLITICS_ILLSUNG_DESC: "§YПремьер-министр КНДР, генеральный секретарь Рабочей партии Кореи, верховный главнокомандующий Корейской народной армией, депутат Верховного народного собрания§!\nКим был сыном родителей, которые бежали в Маньчжурию в детстве, чтобы избежать японского господства в Корее. Он посещал начальную школу в Маньчжурии и, будучи еще студентом, вступил в коммунистическую молодежную организацию. Он присоединился к Корейскому партизанскому сопротивлению против японской оккупации где-то в 1930-х гг. Во время Второй мировой войны Ким возглавлял корейский контингент в качестве майора Советской Армии. После капитуляции Японии в 1945 году Корея была фактически разделена между оккупированной советами северной половиной и поддерживаемой США южной половиной. В это время Ким вернулся вместе с другими корейцами, прошедшими советскую подготовку, чтобы создать коммунистическое Временное правительство под эгидой СССР в том, что станет Северной Кореей."
 POLITICS_DF_MALAN_DESC: "Даниэль Франсуа Малан родился 22 мая 1874 года в Рибек-Уэсе, Капская колония. Он получил степень бакалавра музыки и естественных наук в колледже Виктории в Стелленбосе, после чего поступил в Стелленбосскую семинарию, чтобы обучаться в качестве священника в голландской Реформатской церкви. Наряду с изучением теологии, он получил степень магистра философии в колледже Виктории. Малан покинул Южную Африку в 1900 году, чтобы получить степень доктора богословия в Утрехтском университете, которую он получил в 1905 году.\nМалан вернулся в Южную Африку, где был рукоположен в сан священника голландской Реформатской церкви и в течение шести месяцев служил помощником священника в Гейдельберге, Трансвааль.\nУчастие Малана в политике началось вскоре после образования НП в 1914 году и было впервые избрано в парламент в 1918 году. Малан выступал против участия Южной Африки во Второй мировой войне, которая была непопулярна среди африканского населения. Это помогло ему укрепить свои политические позиции и в конечном счете помогло ему победить объединенную партию на выборах 1948 года.\n§HЛичность:§! Будучи убежденным сторонником африканского национализма, он считает важным, чтобы африканеры утверждали себя как Единое национальное сообщество перед лицом британской культурной, политической и экономической гегемонии. Наряду с этим он решительно поддерживает правление меньшинства в Южной Африке и сделает все возможное, чтобы сохранить его таким образом."
 POLITICS_STRIJDOM_DESC: "Африканер-националист и бывший член Бродербонда, Стриждом долгое время был политическим носителем в националистической партии и хочет продлить апартеид"
 POLITICS_VERWOERD_DESC: "Африканский националист, главный редактор Die Transvaler, Хендрик Вервурд полон решимости продлить апартеид и защитить африканский народ"
 POLITICS_IAN_SMITH_DESC: "Уроженец Родезии, Смит работал политиком, фермером и летчиком-истребителем. Во время Второй мировой войны он служил летчиком-истребителем Королевских ВВС. Авиакатастрофа в Египте нанесла изнурительные раны лица и тела, которые остаются заметными до конца его жизни; после реабилитации он служил в Европе, где был сбит и сражался с итальянскими партизанами. Он основал ферму в своем родном городе в 1948 году и в том же году стал членом парламента от Селукве—в 29 лет, самым молодым депутатом в истории страны."
 POLITICS_ANASTASIO_SOMOZA_GARCIA_DESC: "Даже по латиноамериканским стандартам Гарсия коррумпированный человек. Все высокие посты и имущество были распределены между диктатором и его родственниками, и он руководит страной, как своей личной компанией. Он также построил помпезные особняки как в Никарагуа, так и за рубежом, коллекционирует дорогие автомобили и драгоценности и не одевается ни во что меньше 10 000 долларов."
 POLITICS_SOMOZA_DEBAYLE_DESC: "Луис Анастасио Сомоса Дебайл родился 18 ноября 1922 года в Леоне как старший сын Анастасио Сомосы Гарсии. В возрасте 14 лет он был направлен в Военную академию Ласалля в Окдейле, штат Нью-Йорк, и получил звание капитана национальной гвардии. Впоследствии он учился в Калифорнийском Университете штата Луизиана и Университете штата Мэриленд. Вернувшись в Никарагуа, Луис Сомоса к 1950 году быстро дослужился до полковника Национальной гвардии. Затем он ушел в отставку, баллотировался в депутаты от националистической Либеральной партии (НЛП), был избран президентом Конгресса в начале 1956 года и первым назначил себя преемником президента, если его отец умрет. Политически он более мягок, чем его отец. Под его руководством он планирует провести несколько осторожных реформ."
 POLITICS_FRANCISCO_FRANCO_DESC: "§YКаудильо Испании, президент правительства Испании§!\nФрансиско Франко родился в Эль-Ферроле в 1892 году и был кадровым военным, который поднимался по служебной лестнице до середины 1930-х гг. Франко присоединился к растущему повстанческому движению и вскоре возглавил восстание против левого республиканского правительства и взял под свой контроль страну после Гражданской войны в Испании. После сохранения нейтралитета нации во время Второй мировой войны Франко теперь поддерживается остальной частью Запада из-за его антикоммунистических взглядов. После войны он стал чем-то вроде символа фашизма во всем мире. Несмотря на то, что он столкнулся с негативной реакцией за его "белый террор", очищающий республиканцев, недавние реформы Франко привели к экономическому росту, сделав его достаточно популярным, чтобы поддерживать стабильный режим по всей стране."
 POLITICS_Blanche_DESC: "§HПрошлое: Полицейский и несостоявшийся политик.§!\n\nЭжен Ней Тербланш родился 31 января 1941 года в Вентерсдорпе, провинция Трансвааль. Он учился в Лаерскуле Вентерсдорп и Хоэр Фолькскуле в Потчефструме, поступив в университет в 1962 году. Еще учась в школе, он рано проявил свои политические пристрастия, основав культурную организацию Jong Afrikanerharte.\nПосле школы он поступил на службу в южноафриканскую полицию, и первоначально его направили в Юго-Западную Африку. По возвращении в Южную Африку он стал прапорщиком в специальном Гвардейском подразделении, которое было приписано к членам Кабинета Министров.\nВ конце 1960-х годов он все больше радикализировался, и после четырех лет службы в южноафриканской полиции он ушел в отставку, чтобы продолжить карьеру в политике, безуспешно баллотируясь на местный пост в Гейдельберге в качестве члена крайне правой партии Herstigte Nasionale. Стремясь к более радикальной партии, он основал африканскую Weerstandsbeweging в 1973 году.\n§HЛичность:§! Будучи харизматичным человеком, Эжен знает, как привлечь людей на свою сторону. Потеряв надежду на демократические перемены, он решил принять политику насилия, чтобы сохранить правление южноафриканского меньшинства."
 POL_JONAS_SAVIMBI: "§HПрошлое: Лидер повстанцев.§!\nЖонаш Мальейру Савимби родился 3 августа 1934 года в Мунханго, провинция Бие. Получив гораздо больше образования, чем большинство ангольцев, он учился в нескольких миссионерских школах и университетах. Благодаря кенийскому националисту Савимби решил заняться политикой, сначала в Национальном фронте освобождения Анголы, а затем в своем собственном движении-Национальном союзе за полную независимость Анголы.\n§HЛичность:§! Яростный антикоммунист и антиколониалист, Савимби был описан как естественный политик, динамичный, харизматичный и первоклассный оратор. Его редко можно увидеть без боевой формы."
 Khorloogiin_Choibalsan_DESC: "Чойбалсан родился 8 февраля 1895 года в Ачит-Бейсине. После бегства из местного буддийского монастыря Сан-Бейсын-Хюре в возрасте 18 лет он стал тесно связан с Россией, обучаясь в школе русско-монгольских переводчиков при российском консульстве и гимназии в Иркутске. Он был одной из главных фигур в народной революции 1921 года. Постепенно завоевывая поддержку, он стал лидером Монголии в 1930-х годах."
 POLITICS_HAILE_SELASSIE_DESC: "§YПобедившим Львом из колена Иудейского, Его Императорского Величества Хайле Селассие I, Негуса Нагаст (Царь царей) Эфиопии, Избранник Бога§!\nЛай Тафари Маконнен, Хайле Селассие (его позднее дали царственное имя Гиз, примерно означающее «Сила Троицы») был коронован Негуса Негаст 2 ноября 1930 года, после смерти императрицы Зевдиту. Во время Второй итало-эфиопской войны и последующей оккупации Эфиопии во время Второй мировой войны Хайле Селассие сделал Эфиопию активным членом Лиги Наций, а затем возглавил правительство в изгнании в Лондоне. Хейл Селассие считает модернизатором своих сторонников, что Эфиопия должна открыться для внешнего мира. После прихода к власти Селассие организовала вступление Эфиопии в Лигу наций, и в 1945 году Эфиопия была одним из основателей Организации Объединенных Наций. В то время как большая часть Эфиопии неграмотна и не имеет большого мнения о делах своей нации, среди интеллигенции и студенческой молодежи, напротив, высказывается широкий спектр критики в адрес Императора. Эти критики считают Хайле Селассие автократом, который не смог покончить с огромной и опустошающей бедностью, принесенной архаичной феодальной системой, которая контролирует большую часть народа страны."
 POLITICS_NGUEMA_DESC: "Франсиско Масиас Нгема, родившийся в Рио-Муни, испанская Гвинея, в сельской местности, не является типичным лидером африканской независимости. В возрасте восьми лет Нгема видел, как его отец (местный колдун) был забит до смерти испанским колониальным администратором за то, что он просил улучшить условия труда на плантациях. О Нгеме почти ничего не слышно в более широком Панафриканском и антиимпериалистическом сообществе, но известно, что она живет в безвестности и изоляции. Храня национальную казну в своем личном поместье с большим парком спортивных автомобилей, Нгема вряд ли привлечет иностранное признание. Личные интересы Нгемы заключаются в использовании психоактивных, галлюциногенных местных растений и сборе голов своих врагов в алфавитно организованном отсеке склада. Перекрыв дороги, ведущие из Экваториальной Гвинеи, и приказав казнить всех, кто нарушает произвольные, бессмысленные законы, Франсиско Масиас Нгема может стать величайшим лидером двадцатого века."
 POLITICS_SYNGMAN_RHEE_DESC: "Ли Сын Ман стал Президентом Республики Корея в 1948 году. Обратившись в христианство, Ли провел много лет, выступая за независимость Кореи в Соединенных Штатах и на международных конференциях. Он провел десятилетия за пределами Кореи, но после окончания Второй мировой войны вернулся на родину. Его знакомство с Соединенными Штатами позволило ему заручиться их поддержкой в своей предвыборной кампании на пост президента, и многие консервативные корейские националисты присоединились к его делу. Ярый антикоммунист, Ри отказывается вести переговоры с Севером. С тех пор как он стал президентом, он руководил кампанией репрессий против коммунистов, а также всеми формами несогласия с его правлением."
 POLITICS_SOCARRAS_DESC: "Будучи политически активным со студенческих лет, Сокаррас участвовал в свержении кубинского диктатора Херардо Мачадо в 1933 году. После непродолжительного изгнания во время последовавших волнений он вернулся на Кубу и к 1940 году стал сенатором. Он был премьер-министром с 1945 по 1947 год, а в 1948 году был избран первым президентом Кубы, родившимся после обретения независимости. Будучи политиком-центристом, Сокаррас активно противостоит антидемократическим силам, будь то левые или правые, и стремится восстановить общественное доверие к демократии. Его усилия по реформированию экономики и борьбе с организованной преступностью пока имели ограниченный успех. Однако, будучи верующим в демократию, Сокаррас все еще верит, что кубинская демократия решит растущие внутренние проблемы страны."
 POLITICS_ROBERT_MUGABE_DESC: "Роберт Мугабе вырос в бедной миссионерской общине в Южной Родезии в 1920-30-е гг. Именно во время университетской стипендии в Южной Африке он впервые глубоко погрузился в африканскую националистическую идеологию. К 1960 году он вступил в Национальную Демократическую партию (НДП), чтобы подтолкнуть англичан к тому, чтобы дать Родезии большинство. После того, как лидер партии НДП Джошуа Нкомо потерпел неудачу и согласился принять правление белого меньшинства, Мугабе вместе со многими другими членами был разгневан. К концу 1961 года НДП была запрещена, и Мугабе вступил в Африканский Народный союз Зимбабве (ЗАПУ) в качестве генерального секретаря. Выборы на родезийском фронте жесткой линии привели к всплеску расовых волнений, поскольку африканские националисты разочаровались в перспективе вмешательства Великобритании или согласия белых родезийцев предоставить равные конституционные права африканцам. К 1963 году Мугабе вместе с ведущими лидерами ЗАПУ были заключены в тюрьму за произнесенные ими речи. После одностороннего провозглашения независимости родезийским фронтом в 1965 году Мугабе и его союзники поощряли вооруженное сопротивление режиму как единственный способ добиться господства большинства. В отличие от других лидеров САПУ, которых Родезийское правительство либо подкупило, либо запугало, Мугабе всегда придерживался своей позиции в отношении правления большинства. К 1969 году он стал президентом ЗАПУ в знак признания его преданности и лидерства."
 POLITICS_KWAME_NKRUMAH_DESC: "Рожденный в бедной, неграмотной семье в сельской деревне в самом сердце Ганы, Кваме Нкрума до мозга костей является человеком, который борется за угнетенных. Получив образование в Нью-Йорке, Филадельфии и Лондоне, Нкрума окружил себя наиболее проницательными и преобладающими африканскими националистами, поскольку он вырос, чтобы развить свою собственную панафриканскую философию. Прежде чем войти в политику, Нкрума приобрел известность в колонии Золотого Берега как организатор профсоюзов; ответ на ненужное колониальное угнетение после послевоенной инфляции. Став заметным в колониальном собрании Золотого Берега в течение 40-х годов, он был вынужден создать свою собственную политическую партию, Народную партию Конвента в 1949 году. Несмотря на всеобщее уважение в странах третьего мира, Кваме Нкрума рассматривается как непосредственная угроза как британскому империализму, так и американской гегемонии, что делает его очень могущественным врагом..."
 POLITICS_MUAMMAR_QADDAFI_DESC: "§YПолковник Каддафи, Братский лидер и проводник революции в Ливии§!\nМуаммар Мохаммед Абу Миньяр аль-Каддафи, родившийся бедуином в районе Сирта, или чаще: полковник Каддафи, является молодым Насеристом, готовым во всем подражать египетским свободным офицерам. Радикализированный Радио Каира и его взаимодействием с другими студентами в его подростковом образовании, аль-Каддафи организовал революционную военную клику молодых офицеров в Бенгази. Теперь фактический лидер Ливии полковник Каддафи находится в конфликте с Советом революционного командования, который он помог создать. Либо он утвердит свой контроль и продолжит свои планы по модернизации Ливии, либо внешние силы, лояльные предыдущему режиму Сенусси, положат конец этой "революции", которую он так эстетически обосновал."
 POLITICS_IDRIS_DESC: "§YЕго величество Мухаммад Идрис ибн Мухаммад аль-Махди ас-Сенусси, Эмир Киренаики, Эмир Триполитании, глава Ордена Сенусси§!\nРодившийся в конце XIX века в региональном центре ордена Сенусси, Идрис полностью лишен энтузиазма в отношении своей роли в управлении или руководстве. Взяв на себя роль главы Ордена во время итальянского вторжения в Ливию в 1913 году, Идрис изначально был смелым и стойким лидером, поскольку он боролся против итальянцев и других соседних псевдогосударств, добиваясь союза с Великобританией. При итальянском Королевстве Идрис возглавлял де-факто независимое государство в Киренаике, пока давление фашистской Италии не убедило его сослать себя в Египет. После Второй мировой войны Идрис признан эмиром Киренаики, и различные союзные державы пытаются поддержать его как короля объединенной Ливии, в то время как другие хотят разделить весь регион под британским, итальянским и французским контролем. Независимо от того, что происходит, его ясный Идрис благоволит народу Киренаики и Сенуситской элите над любой другой группой ливийского общества."
 POLITICS_MACARTHUR_DESC: "Генерал Дуглас Макартур был одним из самых титулованных и высокопоставленных офицеров Соединенных Штатов. Он был самым молодым американским генерал-майором, генералом армии и фельдмаршалом Филиппин. Во время Второй мировой войны он руководил американской кампанией на Тихом океане против императорской Японии, приняв капитуляцию Японии в 1945 году. Благодаря своей военной службе и глубокой привязанности к Дальнему Востоку он стал верховным главнокомандующим союзными войсками в Японии. Он управлял Японией через императора с 1945 года для осуществления союзнических целей в Японии. Он защитил императора от военных преступлений и очистил Японию от милитаристов. Он реформировал правительство и добился принятия либеральных практик и прав, кульминацией чего стал в 1947 году новый японский парламент. По мере того как десятилетие подходит к концу, Япония, похоже, почти готова присоединиться к международному сообществу."
 POLITICS_SOKOLOVKSY_DESC: "§YМаршал Советского Союза§!\nМаршал Василий Соколовский прославился во время битвы за Москву в 1941 году. С их помощью он занял ключевые командные посты до конца войны и помог спланировать многие успешные операции, включая битву за Берлин. В 1946 году Соколовский принял командование советской военной администрацией в Германии, помогая контролировать развитие местной Социалистической Партии единства Германии как главной коммунистической партии в контролируемой Советским Союзом Германии. В 1948 году Соколовский вышел из Союзного Контрольного совета, фактически прекратив межпарламентское сотрудничество по вопросу немецкой оккупации. Это усилило напряженность в Европе между Советским Союзом и его бывшими союзниками в военное время на Западе. Соколовский по-прежнему сопротивляется любому предполагаемому вмешательству союзников и следит за дальнейшим развитием местного коммунизма на своей территории."
 POLITICS_EINAUDI_DESC: "Итальянский либеральный президент Луиджи Энауди был избран президентом в 1948 году. У него долгая и блестящая карьера интеллектуала, экономиста и ученого. Он выступал против подъема фашизма и бежал из Италии во время Второй мировой войны, вернувшись в 1943 году после перемирия. После окончания войны он возглавил Банк Италии и руководил кабинетом министров, прежде чем занять пост президента. Президент Энауди стремится продолжать стабилизировать послевоенную экономику Италии и симпатизирует идеям либерального европейского федерализма."
 POLITICS_TITO_DESC: "Сын большой крестьянской семьи, Иосип Броз Тито рос в больших трудностях и бедности. Он провел свои ранние годы, работая на различных фабриках по всей Австро-Венгерской империи. Во время Первой мировой войны русские захватили его в плен, но во время русской революции он покинул свой лагерь военнопленных и активно участвовал в революции. Его опыт подготовил Тито, когда он вернулся домой, чтобы агитировать за коммунистические беспорядки против югославской монархии. Несмотря на аресты и безработицу, Тито стал ведущим членом партии, пережив югославские и советские чистки. Тито приобрел мировую известность во время Второй мировой войны, когда он привел югославских партизан к окончательной победе над немецкими оккупационными войсками. Он получил признание союзников и использовал свое положение признанного премьер-министра для восстановления Югославии под его полным контролем в 1945 году. Он отменил монархию и очистил страну от некоммунистов. В послевоенные годы между Тито и Сталиным нарастала напряженность в вопросе о направлении развития коммунистического мира. К 1948 году два лидера разделились, и Тито начал новую серию чисток против сталинистов, чтобы укрепить свой контроль над страной, поскольку власть все больше находится в его руках или у его ближайших сторонников."
 POLITICS_ALILAH_DESC: "Старший брат Иракского короля Фейсала I и наследник Хашимитского Королевства Хиджаз. После завоевания саудовцами Хиджаза в 1925 году принц Абд аль-Ллах вместе со своим отцом отправился в Ирак, чтобы присоединиться к Фейсалу I. После смерти короля Гази в 1939 году он стал регентом своего четырехлетнего племянника Фейсала II. с момента вступления в должность регента он по существу правил Ираком, с тех пор его лояльность к трону была абсолютной, поскольку он стремился укрепить монархию, поддержать британские цели в регионе и назначить лидеров, лояльных трону. Однако после провластного переворота в 1941 году ему пришлось бежать из Ирака вместе с Фейсалом II. британцы быстро разгромили переворот и восстановили Хашимитов. Принц Абд аль-Ллах продолжает трудную задачу поддержания Хашимитского правления в глубоко разделенном королевстве, где все чаще сталкиваются течения различных идеологий, этнических групп и языков."
 POLITICS_FAROUK_DESC: "В 1936 году король Фарук I унаследовал трон после смерти своего отца в 1936 году. Шестнадцатилетний мальчик вырос в роскоши и почти полном одиночестве в королевском дворце. Его раннее правление началось с большой надежды, когда он объехал свою страну и пообещал принести облегчение бедному населению Египта. Его отсутствие политической воли в сочетании с Вафд и британцами, активно мешавшими ему, привело к тому, что Фарук потерял интерес к управлению страной. Первоначальная доброжелательность, которой он добился, в значительной степени рассеялась во время Второй мировой войны, поскольку массовое военное присутствие союзников привело к стремительному росту инфляции, которая оставила многих египтян в ужасном состоянии. Его усилия во время войны использовать египетское сотрудничество для достижения полной независимости привели к тому, что британские военные окружили дворец, чтобы заставить его капитулировать перед британскими требованиями. После войны ему не удалось договориться о том, кто будет управлять Суданом, он не смог добиться полного вывода британских войск и привел Египет к военному поражению в арабо-израильской войне 1948 года. Его декадентский образ жизни-ночные азартные игры и распутство в сочетании с недавними неудачами-поколебали доверие людей к его руководству. Несмотря на то, что он известен своим обаянием и умственными способностями, до сих пор царь не смог или не захотел внести изменения, которых все больше требуют египтяне."
 POLITICS_SOFOULIS_DESC: "Первоначально получивший образование археолога Софуилс уволился и вступил в парламент своего родного Самоса. Добившись присоединения Самоса к Греции после Первой Балканской войны, он вошел в греческий парламент и служил министром в правительстве Салоник, которое выступало против короля Константина I. В 1924 году он стал главой Центристской Либеральной партии и премьер-министром в первый из трех раз. В бурные межвоенные годы Софулис был источником умеренности и компромисса, способным установить отношения по всему политическому спектру. Во время Второй мировой войны он был ненадолго задержан немцами во время их оккупации Греции, но отказался поддержать Фронт национального освобождения из-за его связи с коммунизмом. После Второй мировой войны Sofouils предложил избежать гражданской войны, хотя эти усилия были безуспешными. В 1947 году он вернулся на пост премьер-министра в третий раз и в настоящее время возглавляет греческое правительство против демократической армии Греции."
 POLITICS_NASSER_DESC: "Подрастая, Гамаль Абдель Насер постоянно переезжал из-за работы своего отца почтовым служащим. Это знакомство со многими аспектами египетской жизни и огромным неравенством в богатстве в обществе оказало на него глубокое влияние. В самом начале Насер читал египетские националистические стихи, книги и участвовал в антиправительственных акциях протеста, полностью принимая египетский национализм. Несмотря на свое известное полицейское прошлое как агитатора, он поступил в Королевскую Военную академию с надеждой пойти по стопам великих революционеров истории. Во время обучения он связался с единомышленниками-националистами и создал тесную сеть благодаря своей способности очаровывать и общаться с людьми. Эта сеть превратилась в подпольную антимонархическую ассоциацию свободных офицеров в 1949 году. Два события подтолкнули Насера и его товарищей-националистов на революционный путь. Одним из них было британское запугивание короля Фарука I в 1942 году, это событие продемонстрировало Насеру бессилие монархии перед лицом колониализма. Во-вторых, полная военная неудача Египта во время арабо-израильской войны 1948 года. Насер и его офицеры чувствовали, что бойцы Египта сражались храбро, но были разочарованы неисправным оборудованием, царским равнодушием и плохой подготовкой со стороны царя. После этих событий Насер работал над тем, чтобы Ассоциация свободных офицеров была готова выступить против правительства, когда придет время. Успешная революция положит конец почти двухвековой династии Мухаммеда Али в Египте и сломит господство элиты в обществе. Насер быстро выделился среди свободных офицеров своей способностью разговаривать со средним египтянином, своей природной харизмой и страстной верой в светлое будущее народа Египта."
 POLITICS_KENYATTA_DESC: "Этнический кикуйю, Джомо Кеньятта родился в небольшой усадьбе в Центральном Кикуйулэнде, скорее всего, в 1890-х гг. став политически активным в 1920-х гг., Кеньятта путешествовал по британской Восточной Африке на мотоцикле, приняв христианство и развивая стойкую антиколониалистскую точку зрения, когда он стал свидетелем страданий и неэффективности колониализма, принесенного в регион. Прожив в Британии и подружившись с более радикальными элементами британской Лейбористской партии, Кениата отправился в Москву вместе с Джорджем Падмором, где его все больше радикализировали антиимпериалистические настроения. Будучи писателями для британской Коммунистической партии, Кениата и Падмор покинули Советский Союз в знак протеста против упразднения "международного профсоюзного комитета негритянских рабочих". Однако Кениата становился все более умеренным и более политически консервативным после своего образования в области экономики и фенотики, сохраняя при этом свои Панафриканские и антиимпериалистические корни. Джомо Кеньятта вернулся в Кению в 1940-х годах, где он утвердился в качестве бесспорного лидера кенийского Африканского Союза. Будучи заключенным в тюрьму во время восстания Мау-Мау за свою политическую деятельность, Кениата открыто осуждал любые формы гражданского неповиновения или незаконные действия против колониального режима. Теперь, когда он освободился от своего незаконного тюремного заключения, Джомо Кениата полон решимости привести Кению к будущему экономического и социального процветания."
 POLITICS_PARLIMENT_DESC: "§YЭта территория управляется непосредственно парламентом и не имеет специальной комиссии"
 POLITICS_SHUKRI_AL_QUWATLI_DESC: "Президент Шукри аль-Куватли любим своими соотечественниками за то, что принес долгожданную независимость от французского мандата. Зная, как французы пытаются обуздать сирийский путь к независимости, он по-прежнему настороженно относится к Западу и следит за тем, чтобы сирийская независимость была обеспечена."
 POLITICS_HUSNI_AL_ZAIM_DESC: "Генерал Хусни Аль-Заим захватил власть в результате военного переворота у демократически избранного, но антизападного президента Шукри аль-Куватли. Вскоре после вступления в должность он согласился с западными интересами в стране и начал переговоры о прекращении огня с Израилем. Хотя он представляет себя как силу модернизации и западных ценностей, список врагов растет быстрее, чем досягаемость света Дяди Сэма."
 POLITICS_ADIB_SHISHAKLI_DESC: "Генерал Адиб Шишакли и его союзники по ССНП свергли Аль-Заима в отместку за предательство последнего перед ССНП, передав Антуна Сааде в Ливан для казни. После казни предательского и продажного генерала Шишакли дипломатично сохранил ориентацию Сирии на Запад, но проявил бескомпромиссность по отношению к сионизму. Однако не похоже, что он держал уроки своего предшественника близко к сердцу, поскольку враги окружают кресло президента."
 POLITICS_ABDALILAH_DESC: "Старший брат Иракского короля Фейсала I и наследник Хашимитского Королевства Хиджаз. После завоевания саудовцами Хиджаза в 1925 году принц Абд аль-Ллах вместе со своим отцом отправился в Ирак, чтобы присоединиться к Фейсалу I. После смерти короля Гази в 1939 году он стал регентом своего четырехлетнего племянника Фейсала II. с момента вступления в должность регента он по существу правил Ираком, с тех пор его лояльность к трону была абсолютной, поскольку он стремился укрепить монархию, поддержать британские цели в регионе и назначить лидеров, лояльных трону. Однако после провластного переворота в 1941 году ему пришлось бежать из Ирака вместе с Фейсалом II. британцы быстро разгромили переворот и восстановили Хашимитов. Сирийцы, симпатизировавшие монархии, в конце концов предложили ему корону арабского королевства Сирии, и он с готовностью согласился. Восстановление монархии было отпраздновано, но некоторые сирийцы возмущены правлением иностранного монарха, лояльного западному миру."
 POLITICS_HAFEZ_AL_ASSAD_DESC: "В исправительном движении генерал Хафез аль-Асад захватил президентство Сирии, очистив левых радикалов от партии Баас. Вскоре после этого он начал осуществлять корректирующее движение, чтобы отменить разрушительные изменения своего предшественника и построить устойчивую социалистическую модель для Сирии. Его президентство особенно привлекло на политическую арену алавитов-шиитские ответвления, родом из Леванта. Как и следовало ожидать, когда его возвышение сравнивали с "евреем, ставшим царем" или "неприкасаемым, ставшим Махараджей", суннитское большинство, симпатизирующее Братьям-мусульманам, начало возмущаться им и баасистским секуляризмом. Нелояльность близких к дому его честолюбивых братьев требует от него высокого внимания, чтобы обеспечить себе президентство. Его собственное честолюбие, поскольку у власти находится Сирия, состоит в том, чтобы сделать ее ключевым игроком в арабском мире и на Ближнем Востоке."
 POLITICS_BASHAR_AL_ASSAD_DESC: "Восхождение доктора Башара Асада на пост президента было наименее ожидаемым для внешнего мира. На самом деле после смерти своего старшего брата Басселя Хафез сразу же обратил внимание на своего второго сына. В течение последующих шести лет подготовка преемника велась, начиная с возвращения из Лондона и резко обрывая его аспирантуру по офтальмологии. Он был ознакомлен с военным аппаратом, а затем получил полномочия на участие Сирии в Ливане. Кроме того, он стал лицом антикоррупционного движения в правительстве и возглавил сирийское компьютерное общество. Мир с удивлением смотрит на то, как сын Хафеза возглавит сирийское государство."
 POLITICS_LEE_KUAN_YEW_DESC: "Что касается Ли Куан Ю, то он не ожидал изгнания Сингапура из Малайзии, но этническая напряженность между китайцами и малайцами заставила его протянуть руку независимости. Теперь лидер города-государства, во всех отношениях карликового по сравнению с соседями, он знает, что Сингапуру предстоит нелегкий путь. Однако это не остановит Ли, поскольку он сделает все, чтобы превратить страну из третьего мира в первый мир."
 POLITICS_PHILP_MITCHELL_DESC: "Карьерный колониальный администратор, Филип Митчелл присоединился к колониальной службе в начале 1910-х годов в Центральной Африке. После службы с королевскими африканскими винтовками в Первой мировой войне он принял другие назначения, прежде чем стать губернатором Уганды в 1935 году. Он курировал политические и экономические реформы, прежде чем присоединиться к военным усилиям во Второй мировой войне. он будет курировать управление итальянскими колониальными землями, захваченными союзными войсками. После того, как он служил губернатором Фиджи с 1942 по 1944 год, опытная африканская колониальная рука вернулась на континент, чтобы занять пост губернатора Кении, где он остается в этой роли. Усталый человек, близящийся к концу выдающейся карьеры, Митчелл остается верующим в колониальную миссию. Он придерживается патерналистского взгляда на колониальных подданных, но верит в возможное самоуправление. Однако многие из этих колониальных подданных проявляют все большее нетерпение в связи с медленными темпами перемен."
 POLITICS_DESC_NEHRU: "Известен детям Индии как"дядя Неру". леворадикальный националист из Индийского национального конгресса, названный преемником покойного Мохандаса Ганди, был провозглашен первым премьер-министром Союза Индии и после столетия отчаянной борьбы за независимость от Британской империи. приветливый старший государственный деятель, наконец-то получивший награду за свою многолетнюю службу народу Индии, наметил курс, ведущий бывшее колониальное государство в новую эру процветания и реформ.хотя его неспособность договориться с исламским населением Индии в конечном итоге привела к потере Северной Индии новым Пакистаном, о чем многие индийцы продолжают горестно скорбеть, будущее самой Индии под руководством Неру и его планы по созданию новой республики в Индии быстро приближаются, никто не может отрицать, что Индия не могла бы просить более квалифицированного лидера для преобразования нации Индии в просвещенную гегемонию Западной Азии."
 POLITICS_Kefauver_DESC: "Кэри Эстес Кефаувер родился в 1903 году в Мэдисонвилле, штат Теннесси. Кефаувер учился в Университете Теннесси и получил степень бакалавра искусств в 1924 году. Он был нападающим и охранником в своей футбольной команде колледжа. Он преподавал математику и тренировал футбол в средней школе Хот-Спрингс, штат Арканзас, в течение года, прежде чем перейти в Йельскую юридическую школу, где он получил степень бакалавра.Диплом с отличием в 1927 году. Движимый своей ролью адвоката в "Чаттануга Ньюс", Кефаувер заинтересовался местной политикой и добился избрания в Сенат штата Теннесси в 1938 году. Он проиграл, но в 1939 году провел два месяца в качестве финансового и налогового комиссара при вновь избранном губернаторе Прентисе Купере. Когда в 1939 году умер конгрессмен Сэм Д. Макрейнольдс из 3-го округа Теннесси, в который входила Чаттануга, Кефаувер был избран его преемником в Палате представителей. С 1950 по 1951 год он возглавлял специальный комитет Сената США по расследованию преступлений в сфере межгосударственной торговли, который расследовал организованную преступность, пересекавшую государственные границы Соединенных Штатов."
 POLITICS_JDMOBUTU_DESC: "Жозеф-Дезире Мобуту, или, говоря более небрежно, Джо Мобуту, - это честолюбивый молодой военачальник, поднявшийся по служебной лестнице в колониальных войсках. Мобуту может быть харизматичным и жизнерадостным в некоторых ситуациях, но полностью убийственным и психопатичным в других, он совершенно непредсказуем, что сделало его очень полезным в качестве бесстрастного, эгоцентричного, индегинального коллаборациониста в colonial force publique под Бельгией. В независимом Конго, свободном от своих старых хозяев, этот молодой офицер мог бы показать себя слишком амбициозным, поскольку теперь он может обнаружить, что манипулирует еще более могущественными внешними элементами, такими как ЦРУ или Всемирный банк..."
 POLITICS_MOBUTU_SESE_SEKO_DESC: "После укрепления своей власти Мобуту Сесе Секо утвердился как душа бесспорного диктатора Конго-Киншасы или, как его теперь называют, Заира. Живя в роскоши в государстве рантье Конго, Мобуту проводит время, отдыхая на своей частной яхте, плавающей вверх по реке Конго с европейскими королевскими особами и американскими бизнесменами. В своей программе "Authenticité"(аутентифицировать конголезский национализм) Мобуту попытался культурно Африканизировать народ и государство Заира с помощью строгой юридической силы. Запрет на христианские имена, принуждение населения к принятию новых, санкционированных государством, и запрет на любое использование западной одежды показывают быстрые результаты. Эти инициаторы африканизации укрепили его сторонников в народном движении революции. И наоборот, иностранные наблюдатели и большое количество конголезских эмигрантов очень критично относятся к Мобуту в ответ на его широко распространенные открыто представленные нарушения прав человека."
 POLITICS_LAMUMBA_DESC: "Патрис Ламумба, родившийся на маленькой ферме в Касаи, хочет только двух вещей-чтобы бельгийцы покинули Конго и чтобы свобода с достоинством пришла к его народу. Как и многие конголезцы, Патрис Ламумба привык ежедневно пользоваться тремя-четырьмя языками и, будучи знатоком французского языка, Ламумба интересовался литературой выдающихся французских мыслителей эпохи Просвещения. Однако быть коммивояжером пива, который писал поэзию неполный рабочий день, было недостаточно удовлетворительно для Ламумбы, и в 1958 году он основал свою политическую партию Национального конголезского движения. Ламумба показал себя достойным представителем своей партии на панафриканской Всеафриканской народной конференции в Аккрасе, где он произвел впечатление на Кваме Нкруму своим умом и четкими планами независимости своей нации. Как и Нкрума, Ламумба основывал свою партию на Панафриканских убеждениях и хотел создать новую конголезскую идентичность, лишенную этнического фаворитизма. Выступая от имени своей партии на бельгийских круглых столах, Ламумба победил на общенациональных выборах, состоявшихся за месяц до обретения независимости. Теперь, находясь у власти, Ламумба оказался в политической борьбе за власть между президентом страны Джозефом Каса-Вубу. Власть премьер-министра и президента плохо определена в Конституции, и разногласия между консервативным федералистом Каса-Вубу и левым централистом Ламумбой могут привести правительство к параличу."
 POLITICS_TSHOMBE_DESC: "Сын бизнесмена, Моисе Тшомбе унаследовал сеть магазинов general good в провинции Катанга в 1950-х гг. вовлекшись в политику, Тшомбе основал свою собственную политическую партию Confédération des associations tribales du Katanga (CONAKAT) в 1958 году. Основываясь на Катангском национализме, федерализме и общем согласии с Бельгией и европейцами, партия Тшомбе заняла третье место на всеобщих выборах 1960 года в Конго до обретения независимости. Однако после того, как МНК отрезала КОНАКАТУ место в кабинете министров, Моисе Тшомбе объявил свои соглашения с конголезским правительством недействительными, объявив о создании независимой Катанги и выходе из состава Республики."
 paasikivi_desc: "Юхо Кусти Паасикиви, урожденный Юхан Гюстаф Хелльстен, родился 27 ноября 1870 года в приходе Коски в уезде Хяме. Отец Юхо был торговцем тканями августом Хелльстеном, а мать-Каролиной Вильгельминой. Его мать умерла, когда Юхо было всего четыре года. Отец отдал его в финскоязычный нормальный лицей в Хямеенлинне, где Юхо был лучшим в своем классе. К сожалению, отец Хси умер, когда Юхо было 14 лет. В старших классах он Финнизировал свое имя. Он превратился в независимого и даже упрямого молодого человека. В более поздней жизни приземленный реализм, осторожность и пессимизм заняли центральное место в его характере, все еще сопровождаясь сильным кипучим темпераментом.\nОн занялся политикой в начале 1900-х годов вместе с движением Фенноменов. Паасикиви был членом парламента от финской Партии в 1907-1909 и 1910-1913 годах. Он был членом Сената 1908-1909 годов, начальником финансового отдела. В 1914 году Паасикиви покинул пост члена парламента и ушел из общественной жизни. Он стал главным генеральным директором банка Kansallis-Osake-Pankki (KOP), сохранив эту должность до 1934 года. Он вернулся в политику в 1934 году, сначала в качестве посланника в Швеции и Советском Союзе. Позже он стал премьер-министром с 1944 по 1946 год, когда стал президентом."
 pol_muhammad_abdel: "Мухаммад Абдель Монейм Бейефенди - нынешний монарх Египта. Его отец Аббас II был правящим хедивом, и поэтому Мухаммад Абдул Монейм стал наследником после рождения и получил титул наследного принца. В молодом возрасте его отправили учиться во Фрибург, Швейцария. После вступления Османской империи в Первую мировую войну его отец Аббас II был свергнут Великобританией за поддержку османов в войне. Его отца сменил на троне его дядя Хусейн Камель, минуя Мухаммада Абдул Монейма, который теперь был понижен по линии преемственности. Он был назначен Его Высочеством в 1922 году. Он был президентом Египетского олимпийского комитета с 1934 по 1938 год. После свержения Фарука II Монейм был коронован под именем Мухаммад Абдель I."
 pol_naguib: "19 февраля 1901 года Нагиб родился как Мохамед Нагиб Юсеф Котп Элькашлан в Хартуме, Англо-Египетский Судан. Поскольку Нагиб происходил из рода офицеров, для него было вполне естественно пойти по этому пути. Таким образом, он вступил в армию в 1918 году, когда подходила к концу Первая мировая война.\n\nНагиб отличился во время поражения Египта во время арабо-израильской войны 1948 года, и пресса приветствовала его. как герой войны; однако Нагиб не был \"заметным общественным деятелем\" и не самым известным египетским офицером. Тем не менее, он заинтересовал «Свободных офицеров» во главе с полковником Гамалем Абдель Насером. Поскольку большинство Свободных офицеров были молодыми и, Насер хотел, чтобы с ними был Нагиб, чтобы повысить авторитет группы. В 1952 году «Свободные офицеры» помогли Нагибу победить на выборах президента клуба офицеров в противовес человеку, которого поддерживал король Фарук. В июле 1952 года «Свободные офицеры» начали египетскую революцию 1952 года, совершив государственный переворот с целью свергнуть короля Фарука. Нагиб был назначен сначала главнокомандующим армией, чтобы держать вооруженные силы твердо позади переворота младших офицеров. Нагиб не был членом исполнительного комитета «Свободных офицеров», и он впервые узнал о перевороте через несколько часов после того, как он начался, когда его разбудил телефонный звонок и сообщил ему, что переворот начался. В египетской культуре возраст уважается, и, будучи 51-летним, Нагиб пользовался большим уважением, чем Насер, которому было 34 года. Доброжелательная и веселая личность Нагиуба заставила его казаться обнадеживающей фигурой для египетского народа, а не Насера ​​и других свободных офицеров, которые были полностью неизвестны публике до переворота.\n\nТеперь, возглавляя Египет, он надеется увидеть скорейшее возвращение к конституционному правлению без ненужного насилия."
 Sindermann_DESC: "Хорст Зиндерманн родился 5 сентября 1915 года в традиционной семье в Дрездене. В 1929 году он присоединился к Kommunistischer Jugendverband Deutschlands (KJVD), а в 1932 году стал местным чиновником в Дрездене. После прихода к власти нацистского режима он был арестован и приговорен к восьми месяцам тюремного заключения за незаконную политическую деятельность. В сентябре 1934 года он стал политическим директором Дрезденского отделения KJVD. В марте 1935 года его снова арестовали за попытку государственной измены, пытали и поместили в одиночную камеру на шесть лет в тюрьме Вальдхайм. В 1941 году его перевели под охрану в несколько концентрационных лагерей: сначала в Заксенхаузен, затем в Маутхаузен в Верхней Австрии и, наконец, в Эбензее, пока его не освободила армия США в 1945 году.\nПосле войны он вернулся в Саксонию и присоединился к СЕПГ. В 1963 году он стал членом Центрального комитета, а в 1967 - членом Политбюро."
 pol_desc_dewey: "Томас Эдмунд Дьюи родился 24 марта 1902 года в Овоссо, штат Мичиган. Он энергичный американский прокурор, чья успешная карьера в борьбе с рэкетом принесла ему три срока на посту губернатора Нью-Йорка. Давний лидер республиканцев, он был кандидатом в президенты от своей партии в 1944 и 1948 годах, но проиграл на обоих выборах.\nБудучи прокурором Нью-Йорка и окружным прокурором в 1930-х и начале 1940-х годов, Дьюи неустанно пытался обуздать власть Американской мафии и организованной преступности в целом. Наиболее известен тот факт, что в 1936 году он успешно преследовал вора в законе мафиози Чарльза Лучано по обвинению в принуждении к проституции. Лучано был приговорен к тюремному заключению на срок от 30 до 50 лет. Он также преследовал и осудил Вакси Гордона, другого известного гангстера и бутлегера из Нью-Йорка, по обвинению в уклонении от уплаты налогов. Дьюи почти удалось также задержать еврейского мафиози Датча Шульца, но Шульц был убит в 1935 году в результате нападения, заказанного самой Комиссией; он не подчинился приказу Комиссии, запрещавшему ему совершать покушение на жизнь Дьюи. Дьюи возглавлял умеренную фракцию Республиканской партии в 1940-х и 1950-х годах в оппозиции к консервативному сенатору от Огайо Роберту А. Тафту. Дьюи был защитником профессионального и делового сообщества северо-востока США. Эта группа состояла из интернационалистов, которые выступали за борьбу Организации Объединенных Наций и холодной войны против коммунизма и Советского Союза, и она поддерживала большинство реформ социального обеспечения Нового курса, проведенных во время правления демократа Франклина Д. Рузвельта."
 POLITICS_JOHN_STUART_MACPHERSON_DESC: "§YСамый выдающийся кавалер ордена Святого Михаила и Святого Георгия, сэр!§!\nДжон Стюарт Макферсон - шотландец до костей, родился и получил образование в Эдинбурге, сражался в Первой мировой войне за горцев Аргайл и Сазерленд. Назначенный губернатором колонии и протектората Нигерии в 1948 году, Макферсон является сторонником африканизации системы государственной службы и создания новой конституции, которая позволила бы официальному участию местных партий в законодательном органе колонии, и постепенной эволюции конституции, которая позволила бы более поздние адаптации федерализма."
 POLITICS_JAMES_WILSON_ROBERTSON_DESC: "§YСамый выдающийся кавалер ордена Святого Михаила и Святого Георгия, сэр§!\nШотландец, как и его предшественник, Джеймс Уилсон Робертсон не имеет большой политической роли. Типичный британский администратор, он был назначен губернатором Нигерии из-за своей успешной карьеры, поскольку Нигерия считается более простым губернаторством с системой в основном местных государственных служащих. Теперь когда колониализм в Нигерии подходит к концу, Робертсон, вероятно, просто надеется, что их независимость не оставит ему никакой бумажной волокиты..."
 POLITICS_ABUBAKAR_TAFAWA_BALEWA_DESC: "§YАльхаджи Достопочтенный, премьер-министр, сэр§!\nАбубакар Тафава Балева - наполовину фулани, наполовину гере мусульманского вероисповедания, выросший в дворянской семье, где он получил образование в школе только с английским языком обучения вместе с другими видными северными нигерийцами, такими как Ахмаду Белло (нынешний губернатор Северного региона). Будучи отличником и очень опытным оратором на английском языке, арабском языке и нескольких региональных диалектах, Балева каждые каникулы преодолевал пешком и в повозке более четырехсот километров из своей школы. Позже, получив еще одно образование в Лондонском университете, он вернулся в Нигерию в качестве учителя, где познакомился с видным молодым нигерийским социалистом Амину Кано. Абубакар Тафава Балева работал с Ахмедом Белло над формированием Конгресса северных народов как официальной политической партии, где они станут доминирующей группой в нигерийском колониальном законодательном собрании. Как и многие северные элиты, Балева не решался получить независимость Нигерии. В то время как Балева и его коллеги заявили, что это произошло из-за необразованного характера не хауса-фулани, которые не имеют равного уровня избирательных прав, интеллигенция происхождения йоруба и игбо утверждала, что это были аргументы, подобные аргументам британцев и французов против колониализма. Необоснованны, основаны на покровительственном отношении к интеллигентным состоявшимся политическим активистам, а также на попытке сохранить личный интерес."
 POLITICS_CHUKWUMA_KADUNA_NZEOGWU_DESC: "§YПодполковник§!\nПатрик Чуквума «Кадуна» Нзеогву - этнический игбо, родившийся в северном городе Кадуна, от которого он получил свое прозвище из-за своей близости к городу. Набожный католик, трезвенник, некурящий, воздерживающийся от наркотиков и проведения времени с женщинами, Нзеогву — профессиональный солдат, если таковой когда-либо был. Вступив в 1950-е годы в Королевские африканские пограничные войска, где он служил в Гане, он получил обширное военное образование в Британской Королевской военной академии в Сандхерсте. Когда он вернулся в Нигерию, он служил офицером во время кризиса в Конго и с тех пор работает инструктором. Планы Нзеогву по перевороту начались с небольшого внутреннего круга молодых офицеров с университетским образованием, из которых сформулировали план национальной революции нации. Нзеогву, будучи военным инструктором, имел личное время, чтобы сформировать скрытую лояльность у солдат, которых он принял, и с несколькими другими офицерами, делающими то же самое одновременно, казалось, что их план воплотится в жизнь. Их первоначальные цели - взять столицы Северного и Западного регионов, а затем Лагос, федеральную столицу. Однако, после захвата северной столицы Кадуны и уничтожения главного учреждения хауса-фулани, другие попытки захвата провалились, и теперь Нзеогву остался в неопределенной ситуации..."
 POLITICS_JOHNSON_AGUIYI_IRONSI_DESC: "§YГенерал-майор,кавалер Королевского Викторианского ордена, Самый выдающийся орден Британской империи§!\n Томас Умуннакве Агуйи-Иронси, этнический игбо, присоединился к Королевским западноафриканским пограничным силам в возрасте 18 лет и быстро преуспел в колониальной военной структуре. Став первым коренным нигерийцем, превысившим звание майора, Агуйи-Иронси сделал себе имя в стране, будучи известным в диаспоре игбо. Возглавив контингент Нигерии во время кризиса в Конго, а затем возглавив все командование Организации Объединенных Наций на закате конфликта, он стал известен во всей Африке, и в 1965 году генерал К. Б. Уэлби-Эверард передал командование нигерийскими вооруженными силами, что ознаменовало полную африканизацию Нигерийской армии. Когда Патрик Чуквума Нзеогву возглавил фактический крах федерального правительства, убив весь северный истеблишмент, Агуйи-Иронси договорился о капитуляции Нзеогву, что привело к его заключению в тюрьму, а Агуйи Иронси получил полный контроль над правительством, когда президент Ннамди Азикиве отказался продолжать гражданскую политику. Подозрительно, что Нзеогву и Агуйи-Иронси оба имеют происхождение от игбо, что подпитывает северные теории заговора о том, что генерал позволил Нзеогву совершить революцию, чтобы его приход к власти был оправдан этим кризисным моментом. Хотя это может быть безосновательным заговором, основанным на настроениях против игбо, существует некоторое доверие, учитывая, что Ннамди Азикиве (также выходец из игбо) удачно спланировал отпуск во время переворота пяти крупных держав."
 POLITICS_TUNJI_OTEGBEYE_DESC: "§YСекретарь Социалистической партии рабочих и фермеров Нигерии, доктор медицинских наук.§!\n Родившийся в 1925 году, Иеремия Олатунджи Отегбей или для краткости Тунджи Отегбей, вырос в семье йоруба выше среднего класса в Иларо, где с самого начала он был одаренным учеником, превосходя своих одногодок в государственном университете Ибадана и заканчивая свое образование в университете Лондона. Во время своего пребывания в Лондоне Отегбей становился все более политически радикальным, поскольку он стал частью Нигерийского союза и Союза западноафриканских студентов в своем университете. Поклоняясь Владимиру Ленину и, в частности, Иосифу Сталину, он стал невероятно фанатичным ортодоксальным марксистом-ленинцем, отстаивавшим такие позиции в частых речах, которые он произносил в Лондоне. Вернувшись в Нигерию в 50-е годы, он сделал себе имя как организатор профсоюзов, а также лидер студенческих протестов, во время которых он стал национальной звездой, когда возглавил протесты против англо-нигерийского пакта об обороне и убийства Патриса Ламумбы. В 1963 году он основал Социалистическую партию рабочих и фермеров Нигерии, которая стала видной марксистско-ленинской партией в Нигерии. Когда он увидел, с какой легкостью молодые офицеры с университетским образованием могут свергнуть истеблишмент Нигерии при тщательном планировании, он начал глубокий заговор с участием тех, кто участвовал в его университетских движениях. После тайного основания Нигерийской освободительной армии он смог начать накапливать оружие от Москвы до тех пор, пока в конечном итоге не захватит военную хунту Агуйи-Иронси."
 POLITICS_YAKUBU_GOWON_DESC: "§YГенерал, начальник штаба армии, глава государства Нигерия§!\nЯкубу Говон, или Джек Говон, как некоторые его называют, — этнический нга из маленькой деревни недалеко от плато Джос. В школе Говон был отличным спортсменом, хотя и преуспел еще дальше в военной структуре, где он стал самым молодым полковником страны, когда руководил своим подразделением во время кризиса в Конго. Благодаря успеху Говона в качестве офицера, он станет одним из самых образованных в военном отношении служащих вооруженных сил, поскольку он прошел обучение в нескольких престижных военных академиях Соединенного Королевства. Это оказалось чрезвычайно удачным обстоятельством для него, когда произошел переворот пяти майоров и последовавший за ним контрпереворот Агийи-Иронси. Он только что вернулся из Объединенного штабного колледжа в Латимере, Великобритания, что удерживало его от любых плановых расстрелов северян. После Северного контрпереворота, когда Муртала Мухаммед и его сообщники были убеждены не преуспевать на севере, а вместо этого бороться за сохранение целостности Нигерии, они поняли, что мусульманский генерал хауса, захвативший страну, значительно обострит этническую напряженность в стране. Вот где Якубу Говон стал идеальным кандидатом в качестве доверенного северянина без политической осведомленности или участия в предыдущих переворотах, который был христианином не хауса. Однако то, что хунта навязывает эту руководящую роль, вызывает у Говона две проблемы. Во-первых, у него нет опыта управления или политики, но второе его больше беспокоит. Если хунта Мурталы Мухаммада может подарить ему главу государства, она точно так же может его и отнять..."
 POLITICS_NNAMDI_AZIKIWE_DESC: "§YДостопочтенный, ПК, премьер-министр Нигерии, д-р§!\nНнамди Бенджамин Азикиве, или, как его чаще называют «Зик», является этническим игбо, родившимся в 1904 году в районе хауса, штата Нигер. В юности карьера отца Зика отправляла его по стране, где он мог свободно владеть языком и понимать культуру игбо, йоруба и хауса почти на равном уровне, что, несомненно, имеет решающее значение для его панафриканской и паннигерийской идентичности, которую он разовьет. После окончания средней школы он в конце концов отправился в Вирджинию в 1920-х годах, где ему пришлось столкнуться с несправедливостью законов Джима Кроу и банальной расовой ненавистью, характерной для южных Соединенных Штатов. Находясь под сильным влиянием идей гарвейизма, панафриканизма и афроамериканского активизма, он вел колонки в Baltimore Afro-American, Philadelphia Tribune и Associated Negro Press. После того, как он получил степень бакалавра политических наук и одновременно получил степень магистра антропологии и религии, он вернулся в Нигерию в 30-х годах, где основал свою собственную влиятельную панафриканскую и антиколониальную газету, которая иногда привлекала внимание властей. Начав политику в 1940-х годах, он основал Национальный совет Нигерии и Камеруна (NCNC) и стал частью колониального законодательного собрания в 50-х годах, а затем стал губернатором Восточного региона Нигерии в 1954 году. Партия только поставила его на церемониальную роль президента при Балеве, Зик стал более успешным после перехода Агийи-Иронси к гражданскому правительству и новых всеобщих выборов. Находясь у власти, Зик полон решимости положить конец этническому конфликту в Нигерии с помощью идей панафриканизма."
 POLITICS_CHIKE_OBI_DESC: "§YПремьер-министр Нигерии д-р.§!\nЧике Оби, родившийся в 1920-х годах, — эксцентричный ученый, титан в области математики, но, прежде всего, идеолог. В начале жизни Оби оказался лучшим студентом в Западной Африке, быстро получив стипендию в колониальном правительстве, что привело его в Кембриджский университет, Массачусетский технологический институт и Лондонский университет. Будучи первым нигерийцем, получившим докторскую степень по математике, он написал статьи, которые стали влиятельными в этой области во всем мире. Однако, когда ему было около 20 лет, он не довольствовался тем, что оставался исключительно в интеллектуальных способностях, и вместо этого основал свою собственную партию, Динамическую партию, которая стала одной из первых нигерийских партий в колонии, имевших формальный идеологический манифест. Чике Оби не является ортодоксальным панафриканистом, а вместо этого является сторонником совершенно новой кемалистской идеологии. Основные цели его партии - объединение африканских стран с обеспечением союзов по всему миру, которые они будут использовать для борьбы с империализмом после быстрой милитаризации страны с упором на партизанскую тактику. Даже дойдя до того, что назвал своего первого сына Мустафой, Оби следует кемализму. Первоначально формируя коалицию с NCNC в первом правительстве страны, после перехода Агийи-Иронси к гражданскому правлению Динамическая партия приобрела умеренную популярность в стране из-за его обещания положить конец этническому конфликту в Нигерии посредством кемализма."
 POLITICS_C_ODUMEGWU_OJUKWU_DESC: "§YГенерал, президент Биафры§!\nЧуквуэмека Одумегву Оджукву, или его прозвище «Эмека», вырос в роскоши и стал одним из самых богатых бизнесменов Нигерии, а в юности проводил время за учебниками и лекциями за границей, поскольку в конечном итоге получил степень магистра истории в Оксфордском университете. Родившись с серебряной ложкой во рту, Эмека чувствовал недовольство и хотел отправиться в путь и сделать себе имя, а намерения отца не определяли его место в обществе. Он присоединился к Королевским западноафриканским пограничным войскам вскоре после возвращения в Нигерию, а его отец дергал за ниточки губернатора Макферсона, чтобы убедиться, что он останется на изнурительной должности унтер-офицера, надеясь, что он откажется от цели. Однако он выдержал это, в конце концов пройдя комиссию в 1958 году, а затем несколько раз продвигался по службе в новых нигерийских вооруженных силах. Во время переворота пяти майоров Эмека остался верен Агийи-Иронси и стал назначенным военным губернатором Восточного региона. Во время северного контрпереворота в Восточном регионе практически не было успеха против Оджукву, и были попытки договориться о сохранении военной иерархии и не допустить, чтобы национальная хунта попала в лагерь северных фаворитов. Однако не было заключено никаких соглашений, которые по существу привели бы к противостоянию между Говоном и Оджукву (оба имели одинаковое воинское звание), и когда все обещания, данные в Абурийских соглашениях, развалились, у Оджукву не было другого выбора, кроме как объявить «Республику Биафра». Находясь в международной изоляции за пределами некоторых малых народов и тайной помощи Франции, Эмека полна решимости привести игбо к процветанию в войне за независимость..."
 POLITICS_ISAAC_ADAKA_BORO_DESC: "§YГлава добровольческих сил дельты Нигера, президент Республики дельты Нигера, майор§!\nИсаак Джаспер Адака Боро родился в самом сердце дельты Нигера, где он получил степень бакалавра химии, а затем присоединился к нигерийским вооруженным силам, став офицером. Он был обречен на активную деятельность, поскольку он сформировал свои собственные студенческие протестные союзы, которые в конечном итоге привели к рождению Волонтерских сил дельты Нигера, личного ополчения для улучшения и справедливости своего народа иджо. Исаак Адака Боро является пионером в защите прав меньшинств в Нигерии, поскольку он твердо убежден, что его этническая группа иджау в дельте Нигера всегда находится под пятой народов хауса, йоруба и игбо. Исаак Адака Боро больше не позволит своему народу страдать, его единственный выход - продемонстрировать всему миру, как его народ относится к своему угнетению..."
 POLITICS_NSMC_DESC: "§YВысший военный совет Нигерии — это военная хунта, которую возглавляют Муртала Мухаммад и Олусегун Обасанджо, а также Хасан Кацина, Джозеф Эдет Акинвале Вей, Мухаммаду Бухари и Теофилус Данджума."
 POLITICS_GASTON_EYSKENS_DESC: "§YЕго Превосходительство премьер-министр Бельгии, кавалер ордена Леопольда II§!\nГастон Франсуа Мари, виконт Эйскенс, родился в апреле 1905 года в Лиере, пригороде Антверпена. Учась в Католическом университете Левена, он получил степень магистра и доктора наук, а также степень магистра наук в Колумбийском университете в Нью-Йорке. В 1931 году Эйскенс стал деканом экономического факультета Лёвенского университета. В 1930-е годы Эйскенс был начальником штаба министров CSP Эдмонда Руббенса и Филипа Ван Исакера. В 1939 году Эйскенс был избран в Палату представителей Бельгии, оставаясь на этом посту до середины 1960-х годов. В 1945 и 1947-1949 годах Эйскенс был министром финансов в кабинетах Ахилла ван Акера и Поля-Анри Спаака, премьер-министров-социалистов. Его лидерство знаменует собой коалицию христианских демократов и либералов во главе с CSP."
 POLITICS_PAUL_HENRI_SPAAK_DESC: "§YЕго Превосходительство, премьер-министр Бельгии, член Королевской академии, Великий кордон ордена Леопольда, кавалер Большого креста ордена Короны§!\nПоль-Анри Шарль Спаак родился в январе 1899 года в Схарбеке, Бельгия, в влиятельной семье Спаак; его мать была первой женщиной-сенатором Бельгии, а его дядя, Поль-Эмиль Янсон, был премьер-министром с 1937 по 1938 год. Во время Первой мировой войны Спаак попытался присоединиться к бельгийской армии, но был захвачен немецкими войсками и стал военнопленным. После войны Спаак поступил в Свободный университет Брюсселя, изучал право и прославился тем, что защищал коммунистов. Вступив в Бельгийскую лейбористскую партию в 1920 году, Поль-Анри стал министром иностранных дел в 1935 году при кабинете своего дяди. С мая 1938 года по февраль 1939 года Спаак был премьер-министром, проведя ряд прогрессивных реформ. После немецкого вторжения в Бельгию в 1940 году Спаак бежал в Лондон, став после войны министром иностранных дел Ахилла ван Акера и Камиллы Хюисманс. В 1946 году Спаак ненадолго был премьер-министром в течение трех недель, а затем снова стал премьер-министром в 1947–1949 годах. За пределами Бельгии Спаак приобрел международную известность как дипломат, став первым председателем Генеральной Ассамблеи Организации Объединенных Наций в 1945 году и в том же году подписав Таможенный союз Бенилюкса. Известный как «мистер Европа» в более поздние годы Спаак принимал активное участие в создании Европейского объединения угля и стали, Европейского экономического сообщества, а также был вторым генеральным секретарем Организации Североатлантического договора; и известен как один из основоположников современного Европейского Союза."
 POLITICS_ACHILLE_VAN_ACKER_DESC: "§YЕго Превосходительство, премьер-министр Бельгии, государственный министр, Великий кордон ордена Леопольда, кавалер Большого креста ордена Короны, кавалер ордена Леопольда II§!\nАкилле Оноре ван Акер родился в семье рабочего в Брюгге, Бельгия, в 1898 году, был младшим из 12 детей и посещал школу только до 11 лет. В начале Первой мировой войны ван Акеру было отказано в службе в бельгийской армии из-за астигматизма, работал на черных работах, встречался с солдатами и участвовал в социалистической политике. После войны он вернулся в Брюгге, вступив в Бельгийскую лейбористскую партию и в городской совет в 1926 году, а год спустя стал членом Палаты представителей Бельгии. Во время немецкого вторжения в Бельгию в 1940 году Бельгийская лейбористская партия была распущена, и ван Акер ушел в подполье, став главой Бельгийской социалистической партии после освобождения в 1944 году. Дважды став премьер-министром в 1945 и 1946 годах, ван Акер продвинулся вперед в социальной сфере и в сфере законодательства о безопасности, но просуществовал недолго из-за кризиса Королевского вопроса в 1950 году."
 POLITICS_JOSEPH_PHOLIEN_DESC: "§YЕго Превосходительство, премьер-министр Бельгии, Круа де Герр, государственный министр, великий офицер ордена Леопольда, кавалер Большого креста ордена Короны, кавалер Большого креста ордена Леопольда II.§!\nЖозеф Кловис Луи Мари Эммануэль Фольен родился в январе 1884 года в Льеже. Изучив философию в Университете Сент-Луиса и право в Свободном университете Брюсселя, Фольен получил докторскую степень и работал на премьер-министра Делакруа, прежде чем стать юристом. В 1926 году он был избран в муниципальный совет Эльсены, а с 1936 года стал членом Сената Бельгии в качестве члена CSP. С 1938 по 1939 год Фольен был министром юстиции в кабинете Поля-Анри Спаака и был арестован немецкими оккупационными властями в 1940 году. После войны он был избран вице-президентом Сената в 1946 году"
 POLITICS_JEAN_DUVIEUSART_DESC: "§YЕго Превосходительство премьер-министр Бельгии§!\nЖан-Пьер Дювьесар родился в апреле 1900 года в городе Фран-ле-Госселис, Бельгия. Посещая Колледж дес Перес Иезуитов в Шарлеруа, он изучал право, политологию и социальные науки, получив степень доктора юридических наук в Католическом университете Лувена. Дювьесар начал свою политическую карьеру в качестве члена CSP и мэра своего родного города Фрасн с 1927 по 1947 год. Кроме того, Жан был членом провинциального совета с 1933 по 1936 год, членом Палаты депутатов с 1944 года и сенатором с 1949 года. С марта 1947 года по июнь 1950 года Дювьесар занимал пост министра экономики и средних классов. в правительствах Поля-Анри Спаака и Гастона Эйскенса. В разгар королевского вопроса и роспуска предыдущего правительства принц-регент Бельгии Карл попросил Дювьесара сформировать кабинет."
 POLITICS_JEAN_VAN_HOUTTE_DESC: "§YЕго Превосходительство, премьер-министр Бельгии, барон фон Хаутте, государственный министр, президент Королевской академии, кавалер ордена Леопольда, кавалер Большого креста ордена Короны.§!\nЖан Мари Джозеф ван Хаутте родился в марте 1907 года в Генте, Бельгия. Изучив право и получив степень доктора юридических наук, он работал нотариусом, а также стал профессором права в университетах Гента и Льежа. Ван Хаутт представлял Христианско-социальную партию с 1949 года, когда он стал сенатором. Ван Хаутт служил в кабинетах Жана Дювьесара и Жозефа Фольена в качестве министра финансов, прежде чем его попросили сформировать правительство после того, как последний премьер-министр ушел в отставку перед лицом отречения королевской семьи."
 POLITICS_MAX_BUSET_DESC: "§YЕго Превосходительство, премьер-министр Бельгии, председатель Бельгийской социалистической партии, кавалер ордена Леопольда, великий офицер ордена Леопольда.§!\nМакс Бюсет родился в январе 1896 года в Файт-ле-Менаж, Бельгия, в семье рабочего. Получив степень в области экономики и социальных наук в Свободном университете Брюсселя, Бюсет стал учителем, прежде чем заняться политикой в качестве члена Палаты депутатов, представляющего округ Туин. После Второй мировой войны Бюсет был избран президентом и лидером Бельгийской социалистической партии и был известен как ярый противник Поля-Анри Спаака."
 POLITICS_JULIEN_LAHAUT_DESC: "§YТоварищ Генеральный секретарь Бельгийской коммунистической партии"
