l_russian:
 truman_speech_category: "Обращения президента Трумэна к нации"
 truman_speech_category_desc: "После поражения фашизма возникает другая угроза — экспансия коммунизма. Президент Трумэн выступает за свободные нации, чтобы защищать свободу и бороться против коммунистической агрессии."
 truman_address_korean_war: "Обращение по Корейской войне"
 truman_address_korean_war_desc: "В воскресенье, 25 июня, коммунистические силы напали на Республику Корея. Это нападение ясно показало, вне всякого сомнения, что международное коммунистическое движение готово использовать вооруженное вторжение для завоевания независимых наций. Такой акт агрессии создает вполне реальную угрозу безопасности всех свободных наций. Коммунистическое вторжение было предпринято большими силами с применением самолетов, танков и артиллерии. Масштабы нападения и скорость, с которой оно было предпринято, совершенно ясно показывают, что оно было спланировано задолго до этого. Пятьдесят две из 59 стран, являющихся членами Организации Объединенных Наций, поддержали действия, предпринятые Советом Безопасности для восстановления мира в Корее. Под флагом ООН создано единое командование для всех сил членов ООН, воюющих в Корее. Генерал Дуглас Макартур командует этими объединенными силами. Быстрые действия Организации Объединенных Наций по подавлению беззаконной агрессии и незамедлительный ответ на эти действия со стороны свободных народов всего мира станут важной вехой в долгом поиске человечеством верховенства права между государствами. Кроме того, тот факт, что коммунистические силы вторглись в Корею, является предупреждением о том, что подобные акты агрессии могут иметь место и в других частях мира. Свободные нации должны быть начеку против такого рода скрытых нападений."
 truman_dismiss_macarthur: "Объявить причину увольнения Дугласа МакАртура"
 truman_dissmiss_macarthur_desc: "Я считаю, что мы должны попытаться ограничить войну в Корее по следующим жизненно важным причинам: убедиться, что драгоценные жизни наших воинов не потрачены впустую; следить за тем, чтобы безопасность нашей страны и свободного мира не подвергалась ненужной опасности; и предотвратить третью мировую войну. Ряд событий показал, что генерал Макартур не согласен с такой политикой. Поэтому я счел необходимым освободить от должности генерала Макартура, чтобы не было никаких сомнений или путаницы в отношении истинной цели и цели нашей политики. С глубочайшим личным сожалением я оказался вынужден предпринять этот шаг. Генерал Макартур — один из наших величайших военачальников. Но дело мира во всем мире гораздо важнее любого человека. Смена командования на Дальнем Востоке не означает никаких перемен в политике Соединенных Штатов. Мы продолжим борьбу в Корее энергично и решительно, чтобы довести войну до скорейшего и успешного завершения. Новый командир, генерал-лейтенант Мэтью Риджуэй, уже продемонстрировал, что обладает прекрасными качествами военного лидера, необходимыми для выполнения этой задачи. Эта война может начаться, если коммунистические правители этого захотят. Но эта нация и ее союзники не будут нести ответственность за ее приход. Мы не хотим расширять конфликт. Мы приложим все усилия, чтобы предотвратить эту катастрофу. И при этом мы знаем, что следуем великим принципам мира, свободы и справедливости."
 truman_against_communism: "Выступить против коммунистической агрессии"
 truman_against_communism_desc: "Свободный мир должен иметь вооруженную силу, свободный мир должен иметь ее сейчас! Не в резерве, не потом, а сейчас! Как ваш президент, я говорю вам, что опасности в других частях мира так же велики, как и в Корее. Ежедневно на мой стол приходят отчеты о советских военных приготовлениях по всему миру, и если кто-то из вас сможет увидеть эти отчеты и получить ту же информацию, вы откажетесь от любых мыслей о том, что опасность миновала. Мы не можем подвести себя, что бы ни происходило в Корее. У нас должны быть люди, корабли, самолеты, танки и бомбы наготове для любой чрезвычайной ситуации, и если они у нас есть, мы должны их использовать!"
 truman_speech_congress: "Выступить перед Конгрессом"
 cancel_berlin_airlift: "Отмена Берлинского авиаперелета"
 cancel_berlin_airlift_desc: "Берлинский воздушный транспорт оказался дорогостоящим и неэффективным. Советы не уступят ни пяди, поскольку это касается не их, а законного германского правительства! Давайте покончим с этим."
 truman_speech_congress_desc: "Нашей целью является мир, не мир любой ценой, а мир, основанный на свободе и справедливости. Этот 1952 год является критическим годом в усилиях по обороне всего свободного мира. Если мы споткнемся, мы можем потерять все наши достижения. Угроза мировой войны все еще очень реальна. У нас был один Перл-Харбор, давайте не будем снова застигнуты врасплох. Наше правительство больше всех других не может мириться с нечестностью среди государственных служащих. Я намерен добиться того, чтобы федеральные служащие, виновные в неправомерных действиях, понесли за это наказание. Давайте идти вперед, уповая на Бога мира, чтобы достичь цели, к которой мы стремимся."
 cancel_berlin_blockade: "Отменить блокаду Берлина"
 annex_west_berlin: "Аннексировать Западный Берлин"
 maintain_airlift: "Поддерживать берлинские воздушные перелеты"
 suspend_deutsche_mark: "Недавно приостановлена продажа Западной немецкой марки"
 annex_west_berlin_desc: "Теперь, когда Берлин стал вольным городом, было бы разумно включить его в состав ГДР!"
 cancel_berlin_blockade_desc: "Товарищ Сталин счел мудрым снять блокаду Берлина! Мы надеемся, что эти усилия, направленные на достижение мира и взаимопонимания, будут восприняты как знаки мира, исходящие от Советского Союза!"
