 fuel_silo_plural: "Стратегические запасы топлива"
 fossil_fuel_powerplant_desc: "Эта электростанция сжигает §R-1§! £resources_strip|1 "
 renewable_powerplant_desc: "Эта электростанция не требует ресурсов."
 nuclear_powerplant_desc: "Эта электростанция потребляет §R-1§! £resources_strip|6"
 fusion_powerplant_desc: "Эта очень дорогая электростанция производит огромное количество возобновляемой энергии"
 civilian_air_base_desc: "Гражданские аэропорты обеспечивают поддержку коммерческим и офисным паркам. Стройте в областях с большим количеством офисов."
 state_infrastructure_desc: "Областная инфраструктура увеличивает объем производства ресурсов и снабжение войск [Stats updated monthly].\n§G+7%§! §YРесурсы§!\n§G+200%§! §YСнабжение§!\n§GИногда можно обнаружить скрытые залежи ресурсов§!\n§GИсследовательские инфраструктурные проекты для повышения максимального уровня!§!"
 water_infrastructure_desc: "Водопровод обеспечивает бонусы для сельскохозяйственного производства. Нужен 1 уровень для полного производства §YАгро-индустриального комплекса§! £resources_strip|3  \nКаждый уровень §Yводопровода§! даёт §G+25%§! §Yагро-индустриального комплекса§! £resources_strip|3 ."
 agri_industrial_complex_desc: "Этот комплекс обеспечивает государство продовольствием. Больше продовольствия в плодородных землях.\nТребуется 1 уровень §Yводопровода§! чтобы произвести £resources_strip|3 !\nИмеет следующее пр-во продовольствия в зависимости от плодородности земли:\n§YЗнойные горы§! = §G0.5§!£resources_strip|3 \n§YПолупустыня или Тундра§! = §G1§!£resources_strip|3 \n§YПустыня или Горы§! = §G2§!£resources_strip|3 \n§YБереговая§! = §G3§!£resources_strip|3 \n§YУмеренный§! = §G4§!£resources_strip|3\n§YТропический§! = §G6§!£resources_strip|3\n"
 office_park_desc: "Стоит §R-1§! £resources_strip|7 , §R-1§! £resources_strip|2 и §R-1§! £resources_strip|1 . Офисы дают большие объемы дохода, но не дают промышленного производства. Хорошо для оплаты государственных услуг и повышения доходов далеко за пределами того, что обеспечивает только промышленность. Кроме того, затраты меньше, чем в промышленности."
 fuel_silo_desc: "[100,000 единиц топлива] Огромный стратегический запас топлива для хранения большого количества пригодного для использования нефтехимического топлива. Эти сооружения обычно строятся на заброшенных рудниках или в больших искусственных бункерах."
 steel_factory_desc: "Стоит -1 £resources_strip|7 и -1 £resources_strip|1 чтобы очистить руду"
 tungsten_factory_desc: "Использует -3 £resources_strip|7 и -1 £resources_strip|5 для извлечения редкоземельных металлов из общераспространенных руд "
