  #LOGISTICS 
 national_logistical_supercomputer: "Отчет о спросе на ресурсы НЛСК"
 national_logistical_supercomputer_desc: "Национальная логистическая суперкомпьютерная сеть сообщает об общем спросе на национальные ресурсы. Потребляемые ресурсы распределяются следующим образом: §R$VALUE|Y0=$§!"
 petrochemicals_logistic_center: "Логистический центр нефтехимии"
 petrochemicals_logistic_center_desc: "§YРасчет потребления и производства нефтехимической продукции один раз в месяц.§!\nУправляет логистическими системами страны по ископаемому топливу включая нефтепроводы и поставки."
 construction_registry_office: "Офис строительства"
 construction_registry_office_desc: "§YРасчет расхода и производства строительного металла один раз в месяц.§!\nУправление строительного офиса организует национальное зонирование и регулирование строительства. Также управляет законами о промышленных рабочих местах и строительными инспекциями."
 construction_permits_office: "Бюро выдачи разрешений на строительство"
 construction_permits_office_desc: "§YРасчет потребления и производства легких металлов один раз в месяц.§!\nУправление разрешений на строительство аналогично офису строительства за исключением того, что оно утверждает разрешения на строительство и занимается коммерческими активами."
 energy_department_supercomputer: "Суперкомпьютер министерства энергетики"
 energy_department_supercomputer_desc: "§YРасчет потребления и производства электроэнергии один раз в месяц.§!\nСуперкомпьютер Министерства энергетики управляет национальной энергосистемой и обеспечивает хорошее техническое обслуживание электростанций."
 nuclear_materiel_supplier: "Поставщик ядерных материалов"
 nuclear_materiel_supplier_desc: "§YРасчет потребления и производства ядерных материалов один раз в месяц.§!\n Поставщик ядерных материалов - это военная организация, которая защищает и распределяет ядерные материалы по всем гражданским и военным объектам, которые в них нуждаются."
 rare_material_broker: "Брокер редкоземельных металлов"
 rare_material_broker_desc: "§YРасчет потребления и производства редкоземельных элементов один раз в месяц.§!\nБрокер редкоземельных металлов - это сеть логистических компаний, банков и горнодобывающих компаний, которые управляют поставками редких материалов в страну."
 farm_pulse: "Агро-индустриальная логистическая сеть"
 farm_pulse_desc: "§YРассчитывает производство продуктов питания один раз в месяц.§!\nАгро-индустриальная логистическая сеть управляет всеми элементами производства и переработки пищевых продуктов и поставляет их. АИЛ также управляет национальными системами очистки воды."
 Food_Need_Pulse: "Агро-Дилерская сеть"
 Food_Need_Pulse_desc: "§YРасчет потребления продуктов питания один раз в месяц.§!\nАгро-дилерская сеть - это децентрализованная система сельскохозяйственных интересов, которая управляет продажей и распределением продовольствия по всей стране."
  
