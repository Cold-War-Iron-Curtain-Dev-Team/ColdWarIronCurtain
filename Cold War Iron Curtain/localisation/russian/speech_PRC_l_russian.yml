l_english:
 mao_speech_category: "Обращение Председателя Мао к народу"
 mao_speech_category_desc: "Наш Председатель Мао делает много для нашего\nкитайского народа и защищает его от\nреакционеров и империалистов. \n\nМы твердо верим, что должны бороться с\nимпериалистами до окончательной победы и до тех пор,\nпока глобальная революция не освободит пролетариат\nвсего мира."
 mao_speech_korea: "Председатель Мао выступает против Соединенных Штатов в Корейской войне"
 mao_speech_korea_desc: "Как долго будет продолжаться эта война? Давайте не будем об этом думать. Пусть Трумэн и Эйзенхауэр или те президенты, которые придут после них, это сами решают. Мы будем сражаться, пока они этого хотят, пока не будет одержана полная победа."
 mao_speech_form_prc: ""
 mao_speech_form_prc_desc: "Китайская Народная Республика и ее Центральное Народное Правительство сегодня официально были созданы! Наше правительство является единственным законным органом власти в этой стране. Любые иностранные правительства, которые готовы соблюдать принципы равенства, совместного получения выгод и уважение территориального суверенитета могут установить дипломатические отношения с нашим государством."