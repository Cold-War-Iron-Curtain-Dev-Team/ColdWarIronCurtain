l_russian:
 mao_speech_category: "Обращение председателя Мао к народу"
 mao_speech_category_desc: "Наш председатель Мао много сделал для нашего\nкитайского народа и защищает китайский народ от\nреакционеров и империалистов. \n\nМы твердо верим, что должны бороться с\nимпериалистами до окончательной победы и до тех пор ,\nпока глобальная революция не освободит пролетариат\nвсего мира."
 mao_speech_korea: "Председатель Мао выступает против Соединенных Штатов в связи с Корейской войной"
 mao_speech_korea_desc: "Как долго будет продолжаться эта война? Давайте не будем об этом думать. Пусть Трумэн и Эйзенхауэр или будущий президент это сами решают. Мы будем сражаться, пока они этого хотят, пока не будет одержана полная победа."
 mao_speech_form_prc: "Провозгласить Китайскую Народную Республику"
 mao_speech_form_prc_desc: "Китайская Народная Республика, Центральное Народное Правительство созданы сегодня! Наше правительство является единственно законным правительством народа по всей стране. Любые иностранные правительства, которые готовы соблюдать принципы равенства, совместного получения выгод и уважения территориального суверенитета могут установить дипломатические отношения с нашим правительством."
