 EGY_utility_helicopter_equipment_7_desc:0 "Лопасти несущего винта улучшенной конструкции с широким хордом, двигатели T700-GE-701D (максимальная мощность 2000 л.с. или 1500 кВт каждый), коробка передач повышенной прочности, компьютер Integrated Vehicle Health Management System (IVHMS), новая стеклянная кабина пилота."
 
