 EGY_transport_plane_equipment_5_desc:0 "De Havilland Canada DHC-5 Buffalo - это транспортный турбовинтовой самолет короткого взлета и посадки, разработанный на базе более ранней модели DHC-4 Caribou с поршневым двигателем. Самолет обладает исключительными характеристиками и способен взлетать на расстояния, значительно меньшие, чем это удается большинству легких самолетов. "
