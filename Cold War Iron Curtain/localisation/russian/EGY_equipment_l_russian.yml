 #Легкий истребитель
 EGY_jet_light_equipment_1:0 "Яковлев Як-11"
 EGY_jet_light_equipment_1_short:0 "Як-11"
 EGY_jet_light_equipment_2:0 "Hispano HA-200"
 EGY_jet_light_equipment_2_short:0 "HA-200"
 EGY_jet_light_equipment_2_desc:0 "Hispano HA-200 Saeta - двухместный реактивный перспективный учебно-тренировочный самолет, разработанный и выпускавшийся испанской авиастроительной компанией Hispano Aviación. Он стал первым испанским самолетом с реактивной силовой установкой."
 EGY_jet_light_equipment_3:0 "L-29 Delfin"
 EGY_jet_light_equipment_3_short:0 "L-29 Delfin"
 EGY_jet_light_equipment_3_desc:0 "Aero L-29 Delfín (англ. Dolphin, отчетное название НАТО: Maya) - реактивный учебно-боевой самолет, разработанный и выпускаемый чехословацкой авиастроительной компанией Aero Vodochody. В ходе реализации программы было выпущено более 3000 учебно-тренировочных самолетов L-29 Delfin. По имеющимся данным, около 2000 из них было поставлено в Советский Союз, где они использовались в качестве стандартных учебно-тренировочных самолетов для советских ВВС."
 EGY_jet_light_equipment_4:0 "Aero L-39 Albatros"
 EGY_jet_light_equipment_4_short:0 "L-39 Albatros"
 EGY_jet_light_equipment_4_desc:0 "Aero L-39 Albatros - высокоэффективный реактивный учебно-тренировочный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах как замена Aero L-29 Delfín в качестве основного учебно-тренировочного самолета. Это был первый учебно-тренировочный самолет, оснащенный турбовентиляторной силовой установкой. В качестве военного учебно-тренировочного самолета он экспортировался во многие страны."
 EGY_jet_light_equipment_5:0 "PAC Karakorum-8" 
 EGY_jet_light_equipment_5_short:0 "Karakorum-8"
 EGY_jet_light_equipment_5_desc:0 "Hongdu JL-8 (Nanchang JL-8), также известный как Karakorum-8 или сокращенно K-8, - двухместный промежуточный реактивный учебно-тренировочный и легкий ударный самолет, разработанный в Китайской Народной Республике компанией China Nanchang Aircraft Manufacturing Corporation. Пакистан также является сопартнером этого проекта. Основным подрядчиком является компания Hongdu Aviation Industry Corporation. Его экспортный вариант, K-8 Karakorum, производится совместно с Пакистанским авиационным комплексом для ВВС Пакистана."

