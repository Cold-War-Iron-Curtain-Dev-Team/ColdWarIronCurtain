 EGY_jet_strat_bomber_equipment_1:0 "Туполев Ту-16"
 EGY_jet_strat_bomber_equipment_1_short:0 "Ту-16"
 EGY_jet_strat_bomber_equipment_1_desc:0 "Ту-16 - двухмоторный стратегический бомбардировщик, разработанный в 1952 году и ставший одним из первых стратегических бомбардировщиков с реактивным двигателем, поступивших на вооружение советских ВВС. Он имел стреловидную компоновку крыла и оснащался двумя турбореактивными двигателями Микулина АМ-3, расположенными в корневых частях крыла. Он мог нести до 9000 кг (20 000 фунтов) боеприпасов, включая ядерное оружие и ФАБ-9000 - бомбу массой 9000 кг, по мощности аналогичную британской бомбе Grand Slam. Известный на Западе как Badger, этот тип прослужил всю холодную войну и был снят с вооружения в 1993 году. Китайский вариант H-6, построенный по лицензии, остается на вооружении ВВС НОАК в качестве фронтового стратегического бомбардировщика." 
 
