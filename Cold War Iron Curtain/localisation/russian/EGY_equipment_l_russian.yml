 EGY_jet_tac_bomber_equipment_2:0 "Ил-28"
 EGY_jet_tac_bomber_equipment_2_short:0 "Ил-28"
 EGY_jet_tac_bomber_equipment_2_desc:0 "Ил-28 - турбореактивный средний бомбардировщик, разработанный сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, поступивший в крупносерийное производство, Ил-28 после появления в 1950 г. участвовал во многих крупных конфликтах "холодной войны" - от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. Даже после снятия с вооружения в 1980-х годах многие самолеты этого типа продолжают эксплуатироваться и по сей день. Отчетное название ВВС США/МО США - Type 27, кодовое название НАТО - Beagle."
 EGY_jet_tac_bomber_equipment_3:0 "Ил-28П"
 EGY_jet_tac_bomber_equipment_3_short:0 "Ил-28П"
 EGY_jet_tac_bomber_equipment_3_desc:0 "Ил-28 - турбореактивный средний бомбардировщик, разработанный сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, поступивший в крупносерийное производство, Ил-28 с 1950 г. участвовал во многих крупных конфликтах "холодной войны" - от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. Даже после снятия с вооружения в 1980-х годах многие самолеты этого типа продолжают эксплуатироваться и по сей день. В отчетах ВВС и Министерства обороны США он значится как Type 27, а кодовое название НАТО - Beagle."
 
 #Стратегический бомбардировщик
 EGY_strat_bomber_equipment_1:0 "Handley Page Halifax"
 EGY_strat_bomber_equipment_1_short:0 "Halifax"
 EGY_strat_bomber_equipment_2:0 "Avro Lancaster"
 EGY_strat_bomber_equipment_2_short:0 "Lancaster"
