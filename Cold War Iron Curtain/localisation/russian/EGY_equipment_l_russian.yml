 #Attack
 EGY_attack_helicopter_equipment_3:0 "Мил Ми-25"
 EGY_attack_helicopter_equipment_3_short:0 "Мил Ми-25"
 EGY_attack_helicopter_equipment_3_desc:0 "Экспортный вариант Ми-24Д. (Hind-D) Ми-24Д был разработан как более лучший боевой вертолёт, чем предыдущие варианты. Он поступил в производство в 1973 году. Ми-24Д имеет перепроектированный передний фюзеляж с двумя отдельными кабинами для летчика и наводчика. Он вооружен одним 12,7-мм четырехствольным пулеметом Як-Б в носовой части. Он также может нести четыре 57-мм ракетные установки, четыре противотанковые ракеты SACLOS 9M17 Phalanga (значительное усовершенствование по сравнению с системой MCLOS на Ми-24А), а также бомбы и другое вооружение."
 EGY_attack_helicopter_equipment_4:0 "McDonnell Douglas AH-64D Apache"
 EGY_attack_helicopter_equipment_4_short:0 "AH-64D Apache"
 EGY_attack_helicopter_equipment_4_desc:0 "Гордость армии США, помимо превосходной маневренности, этот вариант поставляется без радара Longbow, вместо этого его можно назвать "Longbowless Delta". Несмотря на отсутствие этой радиолокационной системы, он все равно является полностью модернизированным вариантом."

