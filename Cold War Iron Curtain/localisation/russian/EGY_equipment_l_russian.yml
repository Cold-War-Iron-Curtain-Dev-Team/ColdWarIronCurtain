 EGY_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 EGY_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 EGY_naval_helicopter_equipment_3_desc:0 "Представленный в начале 1960-х годов в качестве замены вертолета SH-34 Seabat, SH-2 (первоначальное обозначение HU2K) стал первым противолодочным вертолетом, способным размещаться на американских кораблях, помимо авианосцев. Такая мобильность продлила карьеру "морского пришельца", и появились его модернизированные варианты. Вариант, изображенный в игре, - это вариант "D", первоначальный противолодочный вариант."
 EGY_naval_helicopter_equipment_4:0 "Westland Sea King Mk.47"
 EGY_naval_helicopter_equipment_4_short:0 "Sea King Mk.47"
 EGY_naval_helicopter_equipment_5:0 "Kaman SH-2G Super Seasprite"
 EGY_naval_helicopter_equipment_5_short:0 "SH-2G Super Seasprite"
 EGY_naval_helicopter_equipment_5_desc:0 "Kaman SH-2G Super Seasprite - американский вертолет корабельного базирования, обладающий противолодочным и противоповерхностным потенциалом, включая загоризонтное наведение на цель. Этот вертолет расширяет и увеличивает возможности корабельных датчиков и оружия против нескольких типов вражеских угроз, включая подводные лодки всех типов, надводные корабли и патрульные корабли, которые могут быть вооружены противокорабельными ракетами. Изначально самолет был разработан для ВМС США в 1980-х годах как модернизированная версия более старого самолета Kaman SH-2 Seasprite."
