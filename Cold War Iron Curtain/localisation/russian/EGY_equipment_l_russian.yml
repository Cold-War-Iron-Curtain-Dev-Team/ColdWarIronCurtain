 #Оружие пехоты
 EGY_infantry_equipment_0:0 "Short Magazine Lee-Enfield Rifle, No. 4 Mk I"
 EGY_infantry_equipment_0_short:0 "SMLE No. 4"
 EGY_infantry_equipment_0_desc:0 "Lee-Enfield - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным оружием Британской империи и стран Содружества в первой половине XX века. С 1895 по 1957 год она являлась штатной винтовкой британской армии. Во время Второй мировой войны винтовка активно использовалась в войсках Великобритании и стран Содружества, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий. Австралия и Индия сохранили и производили SMLE Mk III* в качестве стандартной винтовки во время конфликта, и эта винтовка оставалась на вооружении австралийских войск вплоть до Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 SLR."

 EGY_infantry_equipment_1:0 "Maadi Hakim"
 EGY_infantry_equipment_1_short:0 "Maadi Hakim"
 EGY_infantry_equipment_1_desc:0 "Hakim Rifle" - газоотводная полуавтоматическая винтовка. Первоначально она была разработана в Швеции и выпускалась под обозначением Ag m/42 для шведской армии. Впоследствии оснастка и конструкция были проданы Египту, и винтовка Hakim производилась там в 1950-х и начале 1960-х годов."

 EGY_infantry_equipment_2:0 "Maadi Misr"
 EGY_infantry_equipment_2_short:0 "Maadi Misr"
 EGY_infantry_equipment_2_desc:0 "Misr является копией российского АКМ. Автомат Misr имеет деревянный или откидной приклад. АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Тимофеевичем Калашниковым в конце 1950-х годов и поступивший на вооружение Советской Армии в 1959 году."

 EGY_infantry_equipment_3:0 "Maadi ARM"
 EGY_infantry_equipment_3_short:0 "Maadi ARM"
 EGY_infantry_equipment_3_desc:0 "Maadi ARM - египетская лицензионная копия российского автомата АКМ. АКМ представляет собой модернизированный вариант автомата АК47, разработанный Михаилом Тимофеевичем Калашниковым в конце 1950-х годов и поступивший на вооружение Советской Армии в 1959 году."

 EGY_infantry_equipment_4:0 "Автомат Калашникова 101"
 EGY_infantry_equipment_4_short:0 "AK-101"
 EGY_infantry_equipment_4_desc:0 "АК-101 - автомат Калашникова. АК-101 разработан для мирового экспортного рынка под патрон 5,56х45 мм стандарта НАТО. АК-101 предназначен для тех, кто ищет оружие, сочетающее в себе логистическую совместимость и привычность патрона 5,56×45 мм НАТО с надежностью автомата Калашникова. Конструкция автомата аналогична АК-74."
 
 #Танки
 EGY_lt_equipment_1:0 "Carro Armato M13/40"
 EGY_lt_equipment_1_short:0 "M13/40"
 EGY_lt_equipment_2:0 "M22 Locust"
 EGY_lt_equipment_2_short:0 "M22 Locust"
 EGY_lt_equipment_3:0 "PT-76"
 EGY_lt_equipment_3_short:0 "PT-76"
 EGY_lt_equipment_3_desc:0 "ПТ-76 - советский легкий танк-амфибия, активно экспортировавшийся по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 г. и был выпущен в количестве около 12 000 единиц. Он рассчитан на экипаж из 3 человек и оснащен прямым шестицилиндровым двигателем V6, развивает скорость 44 км/ч и может плавать со скоростью 10 км/ч. Он поставлялся на экспорт в различные страны советского пространства и страны, поддерживающие СССР, и в этом качестве принимал участие практически во всех конфликтах стран советского пространства. Однако благодаря своей известной надежности и простоте обслуживания он до сих пор используется многими странами."
 EGY_lt_equipment_4:0 "PT-76B Model 4"
 EGY_lt_equipment_4_short:0 "PT-76B"
 EGY_lt_equipment_4_desc:0 "ПТ-76 вооружен 76-мм нарезной танковой пушкой Д-56ТС. 2 мм нарезной танковой пушкой (дульный тормоз с двумя перегородками, выбрасыватель патронов, дымоуловитель и двухосевая система стабилизации СТП-2П "Заря"), системой противотанковой защиты ПАЗ, автоматической системой пожаротушения, улучшенным прицелом ТШК-2-66, фильтровентиляционной системой, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный дизель водяного охлаждения V-6B мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для установки которых пришлось несколько изменить форму брони. "

