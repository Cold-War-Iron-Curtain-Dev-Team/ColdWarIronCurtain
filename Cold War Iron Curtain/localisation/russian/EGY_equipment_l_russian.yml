 EGY_jet_CAS_equipment_4:0 "Сухой Су-7Б"
 EGY_jet_CAS_equipment_4_desc:0 "Бомбардировочный вариант Су-7 "Фиттер-А" впервые поднялся в воздух в марте 1959 года, а затем поступил на вооружение в 1961 году. В дальнейшем он стал основным советским ударным самолетом 1960-х годов. В 1957-1972 гг. было построено более 1400 Су-7Б, многие из которых были поставлены на экспорт. Самолет был довольно популярен за рубежом, где его использовали 10 стран. В частности, он активно использовался в ВВС Индии и Египта. Самолет продолжает ограниченно эксплуатироваться в Северной Корее."
 EGY_jet_CAS_equipment_4_short:0 "Су-7B"
 EGY_jet_CAS_equipment_5:0 "Сухой Су-7БМК"
 EGY_jet_CAS_equipment_5_short:0 "Су-7БМК" 
 EGY_jet_CAS_equipment_5_desc:0 "Модернизированный двигатель АЛ-7Ф-1, модернизированная топливная система с внешними трубопроводами по обе стороны от хребта фюзеляжа, топливные баки, установленные в крыльях, "мокрые" подкрыльевые жесткие точки для установки внешних топливных баков, способен нести тактические ядерные бомбы."
 EGY_jet_CAS_equipment_6:0 "Dassault Mirage 5SDD"
 EGY_jet_CAS_equipment_6_short:0 "Mirage 5SDD"
 EGY_jet_CAS_equipment_6_desc:0 "Dassault Mirage 5 - сверхзвуковой ударный самолет, разработанный во Франции компанией Dassault Aviation и производимый во Франции и ряде других стран по лицензии. Он был создан на базе популярного истребителя Mirage III компании Dassault."
 EGY_jet_CAS_equipment_7:0 "Dassault Mirage 5E2"
 EGY_jet_CAS_equipment_7_short:0 "Mirage 5E2"
 EGY_jet_CAS_equipment_7_desc:0 "Dassault Mirage 5 - сверхзвуковой ударный самолет, разработанный во Франции компанией Dassault Aviation и производимый во Франции и ряде других стран по лицензии. Он был создан на базе популярного истребителя Mirage III компании Dassault."
