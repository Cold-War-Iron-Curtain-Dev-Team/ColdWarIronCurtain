 EGY_fighter_equipment_0:0 "Египетские ВВС"
 EGY_fighter_equipment_0_short:0 "Египетские ВВС"
 EGY_fighter_equipment_0_'desc:0 "ВВС Египта (EAF) (El Qūwāt El Gawīyä El Maṣrīya) - авиационное подразделение вооруженных сил Египта, отвечает за все задачи воздушной обороны и эксплуатирует все военные самолеты, включая те, которые используются для поддержки египетской армии, египетского флота и египетских сил ПВО." 
 EGY_fighter_equipment_1:0 "Hawker Hurricane Mk.I"
 EGY_fighter_equipment_1_short:0 "Hurricane Mk.I"
 EGY_fighter_equipment_2:0 "Supermarine Spitfire F Mk.Vb"
 EGY_fighter_equipment_2_short:0 "Spitfire F Mk.Vb"
 EGY_fighter_equipment_3:0 "Supermarine Spitfire F Mk.IX"
 EGY_fighter_equipment_3_short:0 " Spitfire F Mk.IX"

 EGY_jet_multirole_equipment_1:0 "Supermarine Spitfire F Mk.22"
 EGY_jet_multirole_equipment_1_short:0 "Spitfire F Mk.22" 
 EGY_jet_multirole_equipment_2:0 "Микоян-Гуревич МиГ-15"
 EGY_jet_multirole_equipment_2_desc:0 "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах, начиная с Корейской войны, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы получил прозвище "Аллея МиГов" из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые из них до сих пор остаются на вооружении ВВС Северной Кореи."
 EGY_jet_multirole_equipment_2_short:0 "МиГ-15"
 EGY_jet_multirole_equipment_3_short:0 "МиГ-17"
 EGY_jet_multirole_equipment_4:0 "Микоян-Гуревич МиГ-19"
 EGY_jet_multirole_equipment_4_desc:0 "МиГ-19 - первый советский серийный самолет, способный развивать сверхзвуковую скорость в ровном полете. Сопоставим по силе американским истребителем был F-100 Super Sabre, хотя МиГ-19 в основном боролся с более современными McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 EGY_jet_multirole_equipment_4_short:0 "МиГ-19"
 EGY_jet_multirole_equipment_5:0 "Микоян-Гуревич МиГ-21Ф-13"
 EGY_jet_multirole_equipment_5_desc:0 "МиГ-21 Fishbed считается одним из самых ранних советских истребителей третьего поколения, оснащенным ракетами дальнего радиуса действия и импульсной РЛС. МиГ-21 - самый производимый сверхзвуковой самолет в истории, особенно большое количество было построено в Китае и Индии по лицензии. Всего было построено более 11 000 самолетов, которые служили более чем в 60 странах на 5 континентах. За время эксплуатации МиГ-21 совершил 240 воздушных побед. МиГ-21 участвовал во многих конфликтах, в том числе во Вьетнаме (где добился огромных успехов), в индийско-пакистанской войне 1971 г., в ирано-иракской войне и во многих более мелких конфликтах. Он остается на вооружении более 6 десятилетий."
 EGY_jet_multirole_equipment_5_short:0 "МиГ-21F-13"
 EGY_jet_multirole_equipment_6:0 "Микоян-Гуревич МиГ-21ПФ"
 EGY_jet_multirole_equipment_6_desc:0 "Серийный вариант всепогодного перехватчика. На них устанавливался турбореактивный двигатель Р11Ф2-300, а начиная с седьмой партии - РЛС РП-21 (на первых шести партиях использовалась более старая РЛС ЦД-30Т (она же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую ЗУР РС-2УС (она же К-5МС) в дополнение к ИК-цели К-13."
 EGY_jet_multirole_equipment_6_short:0 "МиГ-21ПФ"
 EGY_jet_multirole_equipment_7:0 "Микоян-Гуревич МиГ-23Б"
 EGY_jet_multirole_equipment_7_short:0 "МиГ-23Б"
 EGY_jet_multirole_equipment_7_desc:0 "МиГ-23 стал первым советским истребителем, оснащенным радиолокационной станцией "обзорный-снижающий", и одним из первых, вооруженным ракетами повышенной дальности. Его производство началось в 1969 г. и достигло больших объемов - было построено более 5000 самолетов, что сделало его самым производимым самолетом с изменяемой стреловидностью крыла в истории. Сегодня МиГ-23 остается в ограниченном количестве на вооружении некоторых экспортных заказчиков."
 EGY_jet_multirole_equipment_8:0 "General Dynamics F-16A Fighting Falcon"
 EGY_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 EGY_jet_multirole_equipment_8_desc:0 "Тяговитый, легкий истребитель с хорошо сбалансированной маневренностью и устойчивостью. Он имеет исключительно легкий и аэродинамичный корпус со смешанным крылом и, хотя является одномоторным самолетом, оснащен мощным двигателем. Прозванный "Боевым соколом", он благодаря своей относительно низкой стоимости и высокой мощности получил широкое распространение в ВВС всего мира. На сегодняшний день выпущено более 4 000 экземпляров этой самой продаваемой модели."
 EGY_jet_multirole_equipment_9:0 "Dassault Mirage 2000EM"
 EGY_jet_multirole_equipment_9_short:0 "Mirage 2000EM"
 EGY_jet_multirole_equipment_9_desc:0 "Египет стал первым экспортным заказчиком Mirage 2000, заказав в декабре 1981 года 20 самолетов. Заказ стоимостью 890 млн. долл. включал 16 одноместных Mirage 2000EM и четыре двухместных Mirage 2000BM, а также опционы еще на 20 самолетов. Самолеты были поставлены в период с июня 1986 г. по январь 1988 г.."
 EGY_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Fighting Falcon"
 EGY_jet_multirole_equipment_10_short:0 "F-16C Block 25"
 EGY_jet_multirole_equipment_10_desc:0 "Первый подвариант F-16C, на нем был установлен новый радар и улучшена система управления огнем, а также интегрированы системы передачи данных для улучшения возможностей ночной атаки. Представленный в 1984 году, вариант F-16C B25 сослужил хорошую службу во время войны в Персидском заливе."

 EGY_mr_stealth_fighter_equipment_1:0 "Микоян МиГ-29М"
 EGY_mr_stealth_fighter_equipment_1_short:0 "МиГ-29М"
 EGY_mr_stealth_fighter_equipment_1_desc:0 "Самолет МиГ-29М/М2 является модификацией базового МиГ-29. Он получил более мощный многоцелевой потенциал за счет более широкого применения высокоточного оружия класса "воздух-воздух" и "воздух-земля". Кроме того, значительно увеличилась дальность полета за счет увеличения внутреннего запаса топлива. В процессе разработки в самолет было внесено несколько изменений. Модернизированный планер был изготовлен из легкого алюминиево-литиевого сплава, что позволило увеличить соотношение тяги и веса. Была изменена геометрия рампы воздухозаборника, убраны верхние решетки воздухозаборника для увеличения объема топлива в LERX, введены сетчатые экраны для предотвращения повреждения посторонними предметами (FOD), увеличены размеры воздухозаборника для увеличения расхода воздуха."
 
