l_russian:
 DDR_60s_A_New_German_Identity: "Новая немецкая идентичность"
 DDR_60s_A_New_German_Identity_desc: "Мы создали процветающее немецкое социалистическое государство. Пришло время развивать нашу социалистическую немецкую идентичность!"
 DDR_60s_The_Nationale_Volksarmee: "Национальная народная армия"
 DDR_60s_The_Republikflucht_Crisis: "Кризис переселения"
 DDR_60s_The_Republikflucht_Crisis_desc: "С тех пор, как Красная Армия освободила нашу страну от ига фашизма, многие наши граждане уезжают на загнивающий Запад. Мы должны остановить это! Мы начнем ужесточать наши законы об эмиграции и публично осудим ФРГ. Это даст нам некоторое время, чтобы придумать лучшее решение"
 DDR_60s_The_Seven_Year_Plan: "Семилетний план"
 DDR_60s_The_Seven_Year_Plan_desc: "После многих трудностей, с которыми мы столкнулись при разработке Второго пятилетнего плана, правительство решило заменить его семилетним планом. Целью этого нового плана будет достижение или даже превышение западногерманского производства на душу населения!"
 DDR_60s_The_Neues_Okonomisches_System: "Новая экономическая система"
 DDR_60s_The_Neues_Okonomisches_System_desc: "Теперь, когда подготовка завершена, мы можем приступить к новой экономической политике, разработанной нашим мудрым генеральным секретарем Вальтером Ульбрихтом. Благодаря этому мы сократим отходы сырья и избавимся от устаревшей системы пятилетних планов, которую мы привыкли использовать. Великий день для рабочего класса!"
 DDR_60s_The_Liberalization_Experiment: "Эксперимент по либерализации"
 DDR_60s_The_Liberalization_Experiment_desc: "Мы проведем небольшой эксперимент. Мы ослабим некоторые ограничения, такие как бит-музыка, фильмы и шоу, критикующие правительство"
 DDR_60s_Sponsor_Beat_Music: "Спонсировать бит-музыку"
 DDR_60s_Sponsor_Beat_Music_desc: "Времена старой классической музыки прошли, молодежь сегодня слушает новый жанр, который получил распространение в последнее время. На бит-музыку до сих пор в нашей стране в основном смотрят свысока. Но для нашего эксперимента по либерализации мы попробуем поощрить такую музыку"
 DDR_60s_Ban_Beat_Music: "Запретить бит-музыку"
 DDR_60s_Ban_Beat_Music_desc: "Эксперимент по поощрению бит-музыки привел к обратным результатам. Как бы мы ни пытались регулировать музыку, она вышла из-под контроля, и теперь даже наши собственные группы берут пример с Запада и идут против нас. Однако есть планы подготовить новый музыкальный стиль, который устроит государство и понравится молодежи"
 DDR_60s_Expand_the_Chemical_Industry: "Расширение химической промышленности"
 DDR_60s_Expand_the_Chemical_Industry_desc: "Одним из первых шагов в нашем семилетнем плане должно стать расширение нашей химической промышленности. Благодаря этому мы смогли бы получить излишки, которые мы могли бы продать другим членам Варшавского договора, и использовать вновь приобретенные химикаты, используя их в производстве потребительских товаров"
 DDR_60s_Invest_in_the_Electric_Power_Industry: "Инвестировать в электроэнергию"
 DDR_60s_Invest_in_the_Electric_Power_Industry_desc: "Мы должны сосредоточиться на производстве нашей электроэнергии. Наши работники и граждане нуждаются в электроэнергии, чтобы сесть после долгого рабочего дня и просто расслабиться под мелодии радио или программу по телевизору, так и наша промышленность нуждается в электричестве для функционирования. Вот почему мы построим новую электростанцию на ископаемом топливе и промышленный парк для наблюдения за ней!"
 DDR_60s_Autonomy_to_Factory_Managers: "Автономия для заводских менеджеров"
 DDR_60s_Autonomy_to_Factory_Managers_desc: "Даже если мы не допустим частную собственность на заводы и промышленность, мы должны понимать, что мы не можем управлять каждым отдельным заводом в нашей стране. Вот почему мы должны предоставить заводским менеджерам больше автономии в управлении фабрикой, не предавая идеалов марксизма-ленинизма и не поддаваясь коррумпированным капиталистическим идеалам"
 DDR_60s_Profit_Bassed_Results: "Результаты, основанные на прибыли"
 DDR_60s_Profit_Bassed_Results_desc: "Мы уже некоторое время сталкиваемся с серьезной нехваткой рабочей силы. И теперь мы должны решить, как бороться с этим дефицитом. Первый шаг - сосредоточиться на том, чтобы сделать наши отрасли более прибыльными. Хотя и не так, как это делают капиталисты и работают с рабочим классом, вместо этого мы будем стремиться улучшить жизнь работников и повысить эффективность, тем самым увеличивая объем производства и прибыль"
 DDR_60s_Allow_Films_Critical_of_the_Government: "Разрешить фильмы с критикой правительства"
 DDR_60s_Allow_Films_Critical_of_the_Government_desc: "Чтобы показать, что мы можем быть открыты для общественности, мы примем закон, позволяющий фильмам критиковать наше правительство. Кто знает? Возможно, мы даже осуществим некоторые реформы, основанные на критике"
 DDR_60s_Organize_a_Music_Talent_Competition: "Организовать конкурс музыкальных талантов"
 DDR_60s_Organize_a_Music_Talent_Competition_desc: "Чтобы помочь нашей стране найти правильный вид новой музыки, в которую мы должны инвестировать, мы организуем Конкурс музыкальных талантов, где люди смогут проявить свои музыкальные таланты. Может быть, это поможет нам найти музыкальный жанр, который мы ищем?"
 DDR_60s_For_the_Defense_of_Decency_and_Morality: "Защита порядочности и нравственности"
 DDR_60s_For_the_Defense_of_Decency_and_Morality_desc: "Как бы мы ни пытались открыться либерализации, все это только обернулось против государства. Поскольку все больше и больше голосов в партии становятся громче, на данный момент у нас нет другого выбора, кроме как завершить эксперимент по либерализации и отменить некоторые из проведенных нами реформ"
 DDR_60s_Complete_Agricultural_Collectivization: "Полная сельскохозяйственная коллективизация"
 DDR_60s_Complete_Agricultural_Collectivization_desc: "Вот уже несколько лет мы проводим коллективизацию наших ферм. Теперь пришло время закончить коллективизацию и получить ее плоды!"
 DDR_60s_Demolish_Prominent_Churches: "Церковь - это коррумпированный и мерзкий культ. Мы только все больше и больше разделяемся из-за разных религий. Пришло время прекратить это. Мы будем применять жесткие меры в отношении церквей. Рабочему не нужно молиться Богу, если государство находится рядом, чтобы исполнить их молитвы!"
 DDR_60s_Demolish_Prominent_Churches_desc: "Церковь - это коррумпированный и мерзкий культ. Мы только все больше и больше разделяемся из-за разных религий. Теперь этому конец. Мы будем применять репрессии против известных церквей. Рабочему не нужно молиться Богу, если государство рядом, чтобы исполнить их молитвы!"
 DDR_60s_Der_Jugend_Vertrauen_und_Verantwortung: "Союз Свободной Немецкой Молодёжи"
 DDR_60s_Der_Jugend_Vertrauen_und_Verantwortung_desc: "Мы должны решить, что делать с нашей молодежной организацией ССНМ. Некоторые говорят, что мы должны реформировать его, чтобы сделать более привлекательным для молодежи, но другие говорят, что это противоречило бы социалистической идеологической обработке. Что нам следует делать?"
 DDR_60s_Reform_the_FDJ: "Реформировать ССНМ"
 DDR_60s_Reform_the_FDJ_desc: "ССНМ был основан после Второй мировой войны, его целью была борьба с оставшимися фашистскими настроениями. Но теперь нам нужно реформировать ССНМ. Членство в ССНМ уже некоторое время сокращается, молодежь просто не чувствует, что ССНМ достаточно интересен, чтобы быть его частью. Нам нужно это изменить!"
 DDR_60s_Replace_Hardline_FDJ_Officials: "Заменить руководство ССНМ"
 DDR_60s_Replace_Hardline_FDJ_Officials_desc: "Как бы мы ни были благодарны за то, что до сих пор делали чиновники ССНМ, мы не можем оставить их в руководстве. Если позволить им контролировать ситуацию, это позволило бы старым сталинским традициям остаться в организации, обучая молодежь неправильной морали. Их нужно заменить!"
 DDR_60s_Retain_FDJ_Leadership: "Сохранить лидеров CCНМ"
 DDR_60s_Retain_FDJ_Leadership_desc: "Несмотря на то, что мы обещали реформы, мы не должны заменять руководство, которое до сих пор руководит организацией. Ветераны организации, которые помогли зайти так далеко, не должны быть просто выброшены и понижены в должности. Уважайте старших!"
 DDR_60s_Seek_Soviet_Credits: "Попросить кредит у СССР"
 DDR_60s_Seek_Soviet_Credits_desc: "Нам нужны деньги которые мы сможем инвестировать в расширение нашей промышленности, мы отправим одного из наших дипломатов и министра промышленности в Кремль, чтобы убедить их финансировать наше промышленное развитие!"
 DDR_60s_Increase_Machine_Exports: "Увеличить экспорт машин"
 DDR_60s_Increase_Machine_Exports_desc: "Семилетний план, похоже, уже показывает первые результаты нашей напряженной работы! Благодаря нашему расширению у нас теперь большой избыток машин, которые нам не нужны. Мы продадим их нашим друзьям по Варшавскому Блоку, помогая им в их нуждах и получая прибыль!"
 DDR_60s_Empower_the_Technocrats: "Расширение прав и возможностей технократов"
 DDR_60s_Empower_the_Technocrats_desc: "Наука - одно из самых замечательных творений, которые есть у человечества. Благодаря науке мы превратились из существ, живущих в пещерах, в трудолюбивую армию рабочих, врачей, учителей и военнослужащих. Вместо пещер мы теперь живем в отапливаемых квартирах, которые созданы для того, чтобы обеспечить удовлетворение наших основных потребностей. Но с 1940-х годов многие наши ученые либо бежали из страны, либо были убиты или захвачены в плен. Вот почему мы должны приложить все усилия для увеличения расходов на новые школы, финансирование изобретений и помочь создать следующее поколение ученых, которые сделают жизнь рабочего класса лучше, чем когда-либо!"
 DDR_60s_Exploit_the_Altmark_Gas_Field: "Эксплуатировать газовое месторождение Альтмарк"
 DDR_60s_Exploit_the_Altmark_Gas_Field_desc: "Было обнаружено газовое месторождение Альтмарк с огромными запасами природного газа в нашей провинции Магденбург. Мы немедленно установим установку для добычи и начнем добычу природного газа!"
 DDR_60s_Organize_the_1964_Deutschlandtreffen: "Организовать Национальную молодежную конференцию Германии 1964 года"
 DDR_60s_Organize_the_1964_Deutschlandtreffen_desc: "Пришло время официально провести нашу Национальную молодежную конференцию Германии 1964 года! В период проведения конференции мы организуем множество мероприятий, чтобы показать, насколько широко распространена популярность наших пионерских групп"
 DDR_60s_Establish_DT_64_Radio: "Установить радио DT-64"
 DDR_60s_Establish_DT_64_Radio_desc: "Мы создадим новую радиостанцию под названием DT-64! Эта радиостанция будет транслировать новости, развлечения и даже западную музыку. Если мы не можем победить Запад с помощью наших пушек, мы разнесем их в пух и прах нашими идеями!"
 DDR_60s_Organize_Open_Political_Debates: "Организовать открытые политические дебаты"
 DDR_60s_Organize_Open_Political_Debates_desc: "По мере реформирования ССНМ мы будем внедрять новое правило. Отныне будет разрешено открыто обсуждать политику в дебатах, говорить о том, что молодежь и народ хотели бы, чтобы государство изменило или внедрило, и при этом не бояться репрессий"
 DDR_60s_The_Failure_of_the_FDJ_Program: "Сбой программы ССНМ"
 DDR_60s_The_Failure_of_the_FDJ_Program_desc: "Как бы мы ни пытались провести некоторые реформы, старая гвардия всегда была на нашей стороне. И этот раз не стал исключением. Предложение предоставить Комиссии по делам молодежи постоянные места в ССНМ, чтобы начать проводить либерализующие реформы, программа теперь признана провальной"
 DDR_60s_Respond_to_Mass_Crop_Failure: "Реагировать на массовый неурожай"
 DDR_60s_Respond_to_Mass_Crop_Failure_desc: "Последние отчеты показывают, что из-за плохой погоды наш последний урожай довольно плох. Вот почему мы немедленно увеличим финансирование сельскохозяйственных предприятий и построим новый комплекс, единственная цель которого - обеспечить рабочий класс хлебом"
 DDR_60s_The_Failure_of_the_Main_Economic_Task: "Провал основной экономической реформы"
 DDR_60s_The_Failure_of_the_Main_Economic_Task_desc: "Несмотря на то, что мы были полны надежд и энергии, цель семилетнего плана не могла быть достигнута. Мы просто пока не можем догнать западную индустрию. Это не значит, что мы просто сдадимся! Отныне мы будем ставить перед собой более реалистичные цели, но мы сохраним нашу цель победить Запад"
 DDR_60s_Respond_To_Western_Trade_Threats: "Ответ на западные торговые угрозы"
 DDR_60s_Respond_To_Western_Trade_Threats_desc: "Запад, напуганный нашей растущей промышленной мощью, теперь начал угрожать нам проблемами с торговлей. Мы немедленно отреагируем на это!"
 DDR_60s_Construct_the_Antifascist_Defence_Rampart: "Построить антизападная оборонительная стена"
 DDR_60s_Construct_the_Antifascist_Defence_Rampart_desc: "Пришло время приступить к нашему плану по уничтожению части Западной Германии в Берлине. Мы построим в нашей части Берлина стену из бетона, поставим охрану, сторожевые вышки и поместим ее под постоянное наблюдение. Наши граждане больше не смогут просто ехать на Запад и предавать социализм! Мы расскажем общественности, как остановить пропаганду и западных шпионов от того, чтобы они так легко проникали в нашу страну. Но на самом деле это будет сделано для того, чтобы помешать Западу получить нашу рабочую силу"
 DDR_60s_A_New_Reality: "Новая реальность"
 DDR_60s_A_New_Reality_desc: "Теперь это медленно оседает в сознании людей. Они не могут просто так перебежать на Запад и предать свою Родину. Теперь они должны приспособиться к своему единственному дому"
 DDR_60s_Consolidate_Agrarian_Collectives: "Консолидировать аграрные коллективы"
 DDR_60s_Consolidate_Agrarian_Collectives_desc: "Для дальнейшего увеличения производства продуктов питания и овощей необходимо начать объединение аграрных коллективов, что повысит эффективность и снизит нагрузку на сельское хозяйство"
 DDR_60s_The_Movement_Restriction_Decree: "Постановление об ограничении передвижения"
 DDR_60s_The_Movement_Restriction_Decree_desc: "Теперь, когда мы убедились, что нелегальная иммиграция на Запад невозможна, пришло время сосредоточиться и на законных путях. Мы примем новый Указ об ограничении передвижения. Это значительно усложнит поездки между Востоком и Западом, очевидно, за некоторыми исключениями для пожилых людей, навещающих свои семьи, или если кто-то путешествует по рабочим причинам"
 DDR_60s_Investigate_Libermans_Proposals: "Расследовать предложения Либермана"
 DDR_60s_Investigate_Libermans_Proposals_desc: "Поскольку мы начинаем менять политику в нашей стране, мы получили срочное сообщение из Советского Союза. Они рекомендуют нам ознакомиться с обзором одного из их выдающихся экономистов Евсея Либермана. Мы посмотрим и проанализируем, есть ли что-то, что мы могли бы использовать для нашей собственной страны"
 DDR_60s_Consider_Civilian_Economic_Shift: "Рассмотреть план гражданской экономическй реформы"
 DDR_60s_Consider_Civilian_Economic_Shift_desc: "Мы изучили отчет Либермана и нашли несколько интересных аспектов, которые мы могли бы адаптировать к нашей собственной экономике. Один из них заключается в том, чтобы сместить нашу экономику в большей степени в сторону гражданской направленности. Мы проведём реформу, построив несколько новых индустриальных парков"
 DDR_60s_Launch_Aktion_Storfreimachung: "Усилить Aktion Storfreimachung"
 DDR_60s_Launch_Aktion_Storfreimachung_desc: "Сегодня мы начинаем Aktion Störfreimachung. Операция, целью которой является сокращение импорта в нашу страну с Запада. Мы больше не будем нуждаться в дешевой американской или французской электронике и одежде. Отныне все будет производиться либо непосредственно в нашей стране, либо импортироваться от одного из наших многочисленных друзей из Варшавского договора!"
 DDR_60s_Increase_Television_Ownership: "Сделать телевизоры доступнее"
 DDR_60s_Increase_Television_Ownership_desc: "По мере того, как радио все больше и больше замирает, все больше людей начинают покупать телевизор. Эта новая технология, над совершенствованием которой мы работали в течение последних нескольких лет, быстро начала приобретать все большую популярность среди наших граждан. Вот почему мы будем стремиться увеличить долю владения телевизорами за счет быстрого увеличения телевизионного производства и увеличения финансирования исследований для его дальнейшего совершенствования "
 DDR_60s_Increase_Car_Ownership: "Сделать доступнее автомобили"
 DDR_60s_Increase_Car_Ownership_desc: "Рабочий-социалист не просто хочет остаться в столице и испытать социализм в самом разгаре только в одном городе! Нет! Он хочет увидеть остальную нацию и ее социалистические достижения! Мы учтем эти пожелания и увеличим производство автомобилей, тем самым увеличив количество владельцев автомобилей!"
 DDR_60s_Abosrbing_the_Grenzganger_into_the_Labor_Force: "Превращение Гренцгангер в восточногерманскую рабочую силу"
 DDR_60s_Abosrbing_the_Grenzganger_into_the_Labor_Force_desc: "Гренцгангер - это термин, обозначающий людей, которые работают в Западной Германии, но живут либо в нашей Демократической Республике у стены, либо во внешних квартирах Советской зоны. Поскольку мы теперь перекрыли легкий проход на Запад, мы будем использовать этих граждан в качестве нашей собственной рабочей силы"
 DDR_60s_Promote_Socialist_Patriotism: "Пропагандировать социалистический патриотизм"
 DDR_60s_Promote_Socialist_Patriotism_desc: "Рабочий-социалист должен гордиться тем, чего он и рабочий класс достигли при социализме! Мы начнем пропагандировать социалистический патриотизм, покрывая улицы патриотическими плакатами и исполняя патриотическую музыку и шоу по телевидению и радио!"
 DDR_60s_Drop_Aktion_Storfreimachung: "Отменить программу борьбы с импортом и увеличения производства"
 DDR_60s_Drop_Aktion_Storfreimachung_desc: "Как бы мы ни старались, мы просто не можем выжить только за счет импорта и производства продуктов из других социалистических стран. Мы прекратим действие нашего плана и снова начнем импортировать некоторые товары с Запада"
 DDR_60s_Escalate_Aktion_Storfreimachung: "Продолжить программу борьбы с импортом и увеличения производства"
 DDR_60s_Escalate_Aktion_Storfreimachung_desc: "Наш план борьбы с импортом имел большой успех! Мы не только показали Западу, что нам не нужна их продукция, но и что мы можем противостоять их экономическим угрозам! С таким огромным успехом мы будем наращивать производство еще больше!"
 DDR_60s_The_Luftstreitkrafte: "Военно-воздушные силы ГДР"
 DDR_60s_S_125_Surface_to_Air_Missiles: "Ракеты S-125 класса "Земля-воздух""
 DDR_60s_Mil_Mi_2_Helicoptors: "Вертолеты Ми-2"
 DDR_60s_Soviet_Sukhoi_Su_17: "Советский самолёт Су-17"
 DDR_60s_Import_MiG_23s: "Импорт МиГ-23"
 DDR_60s_Soviet_BMPs: "Советские БМП"
 DDR_Soviet_BTR_60s: "Советский БТР-60"
 DDR_60s_R_17_Elbrus_Missiles: "Ракеты Р-17 Эльбрус"
 DDR_60s_The_T_72: "Танк Т-72"
 DDR_60s_The_Volksmarine: "Народные Военно-Морские Войска ГДР"
  
 DDR_60s_The_Landstreitkrafte: "Сухопутные войска ГДР"
 DDR_60s_Landing_Craft_Modernization: "Модернизация десантных кораблей"
 DDR_60s_P_15_Termit_Missiles: "Ракеты P-15 Термит"
 DDR_60s_Hai_III_Klasse_Submarines: "Подводные лодки класса ХАИ-3"
 DDR_60s_Increase_Coastal_Defenses: "Увеличить береговую оборону"
 DDR_60s_Decriminalize_Homosexuality: "Декриминализировать гомосексуальность"
 DDR_60s_Decriminalize_Homosexuality_desc: "С момента основания нашего государства у нас все еще действуют законы нацистской эпохи, которые криминализировали гомосексуальность. Наше государство никогда не применяло их. Но теперь было решено принять закон о легализации гомосексуальности! Мы также не рассматриваем это как болезнь. Не говоря уже о его нерепродуктивности. Основа социализма заключается в том, что все равны. И почему мы должны нарушать эти принципы только потому, что товарищу нравится другой товарищ мужского пола?"
 DDR_60s_Soviet_Oil_Pipelines: "Советские нефтепроводы"
 DDR_60s_Soviet_Oil_Pipelines_desc: "Поскольку мы продолжаем наблюдать за ростом нашей промышленной мощи, мы получили интересное сообщение из Кремля. За наши усилия по предоставлению рабочим новых рабочих мест и демонстрации того, насколько успешным может быть социализм, они предложили расширить нефтепроводы одного из наших городов! Мы, конечно, с благодарностью приняли этот подарок и немедленно начнем строительные работы в нашем промышленном городе Лейпциг!"
 DDR_60s_Apply_for_Further_Soviet_Funding: "Подать заявку на дальнейшее советское финансирование"
 DDR_60s_Apply_for_Further_Soviet_Funding_desc: "Мы далеко продвинулись в нашем семилетнем плане, но он еще не выполнен полностью! Мы попросим у Советского Союза больше денег, чтобы продолжать расширять нашу промышленность и показать прогнившему капиталистическому Западу, что социалистический рабочий может превзойти их коррумпированные методы!"
 DDR_60s_Expand_Metalworking_Production: "Расширить производство металлообработки"
 DDR_60s_Expand_Metalworking_Production_desc: "Металлообрабатывающая промышленность является одной из самых важных отраслей в нашей стране. Даже если Запад обладает большим количеством природных ресурсов, у нас есть большое количество строительного материала, который можно использовать для строительства жилья для рабочих и их семей! Не говоря уже о том, что мы можем построить несколько литейных цехов, которые обеспечат простого рабочего всеми инструментами, необходимыми ему для удовлетворения потребностей своей страны!"
 DDR_60s_Prepare_the_Neues_Okonomisches_System: "Подготовьте новую экономическую систему"
 DDR_60s_Prepare_the_Neues_Okonomisches_System_desc: "По мере того, как наш семилетний план медленно подходит к концу, появляется еще одна экономическая возможность. Наш мудрый генеральный секретарь Вальтер Ульбрихт ввел политику новой экономической системы, которую он назвал "Новая экономическая система планирования и управления" или сокращенно НЭСПУ. Его цель - заменить систему пятилетних планов, которую наше государство использует с 1951 года. Его цель также состоит в том, чтобы повысить эффективность централизованного планирования, сократить потери сырья, повысить механизацию и, что наиболее важно, создать систему, в которой качество имеет большее значение, чем количество"
 DDR_60s_Mass_Prison_Releases: "Массовые освобождения из тюрем"
 DDR_60s_Mass_Prison_Releases_desc: "Мы инициируем массовое освобождение заключенных, которые были заключены за мелкие преступления, включая политических заключенных. Это должно ослабить напряженность и дать нам экономический толчок"
 DDR_60s_The_Defense_Law: "Закон об обороне"
 DDR_60s_The_Defense_Law_desc: "Наша нация всегда находится в опасности вражеского нападения с Запада. Вот почему мы должны принять Закон об обороне. Этот закон создаст резерв войск, чтобы быть готовыми защитить нашу Республику в случае вражеского нападения, а также увеличит производство оружия. Солдат не может сражаться без винтовки и патронов к винтовке!"
 DDR_60s_Launch_the_Production_Drive: "Запуск производственного диска"
 DDR_60s_Launch_the_Production_Drive_desc: "Рабочие на фабриках выполняют самую важную работу в стране. Они - винтики, которые помогают нашей социалистической машине продолжать функционировать! И мы должны дать им это понять, показав гражданам, как усердно работают наши работники, тем самым создавая стимулы для производства, которые будут еще более эффективными для нашей нации!"
 DDR_60s_The_Downfall_of_Khruschev: "Свержение Хрущева"
 DDR_60s_The_Downfall_of_Khruschev_desc: "Важные новости дошли до нас сегодня прямо из Кремля. Бывший лидер Советского Союза Никита Хрущев был вынужден уйти со своего поста и позволить кому-то новому взять на себя руководство Советским Союзом. Наша реакция на это неоднозначна"
 DDR_60s_Ulbrichts_Falling_out_from_Moscow: "Ульбрихт свергнут со своего поста!"
 DDR_60s_Ulbrichts_Falling_out_from_Moscow_desc: "В последнее время все больше партийных чиновников замечают, что генеральный секретарь Ульбрихт все больше отдаляется от Москвы. Чтобы не повредить нашим отношениям с Кремлем, мы решили сместить Ульбрихта и заменить его новым кандидатом"
 DDR_60s_First_Secretary_Sindermann: "Генеральный секретарь Зиндерман"
 DDR_60s_First_Secretary_Sindermann_desc: "Несмотря на то, что многие думали, что Хонеккер наверняка займет пост первого генерального секретаря, его сопернику Хорсту Зиндерманну удалось выиграть битву за власть и стать первым секретарем СЕПГ!"
 DDR_60s_First_Secretary_Honecker: "Генеральный секретарь Хонеккер"
 DDR_60s_First_Secretary_Honecker_desc: "После успешной победы над своим соперником Зиндерманом в борьбе за власть за должность, Хонеккер сегодня был назначен первым секретарем СЕПГ"
 DDR_60s_The_Ulbricht_Doctrine: "Доктрина Ульбрихта"
 DDR_60s_The_Ulbricht_Doctrine_desc: "Наш лидер Вальтер Ульбрихт обнародует сегодня новую доктрину, чтобы попытаться добиться большей легитимности нашего государства для стран Запада. "Доктрина Ульбрихта", как на нее ссылались, просто гласит, что дипломатические отношения могут существовать только в том случае, если оба государства взаимно признают легитимность своих государств"
 DDR_60s_Mutual_Assitance_Treaties_with_Eastern_Neghbors: "Договоры о взаимопомощи с восточными соседями"
 DDR_60s_Mutual_Assitance_Treaties_with_Eastern_Neghbors_desc: "Мы не можем зависеть только от того, что Советский Союз всегда будет поддерживать рост нашей экономики и защищать наш народ. Вот почему мы подпишем договоры о взаимопомощи с нашими восточными соседями"
 DDR_60s_Campaign_for_COMECON_Self_Reliance: "Проект самообеспечения СЭВ"
 DDR_60s_Campaign_for_COMECON_Self_Reliance_desc: "Теперь, когда у нас есть поддержка наших восточных соседей, мы направим запрос Советскому Союзу с просьбой о большей самостоятельности и интеграции в СЭВ"
 DDR_60s_Ratify_the_Arrangement: "Ратифицировать соглашение"
 DDR_60s_Ratify_the_Arrangement_desc: "Теперь, когда условия нового соглашения обсуждены, все, что теперь осталось сделать, это сесть за стол переговоров с советскими дипломатами и ратифицировать это соглашение!"
 DDR_60s_Rally_Against_Western_Aggression: "Митинг против западной агрессии"
 DDR_60s_Rally_Against_Western_Aggression_desc: "Наш первый секретарь Вальтер Ульбрихт сегодня осудил вмешательство Западной Германии и НАТО в дела нашей страны. Он обвинил Запад в усилении напряженности и отрицании суверенитета нашей страны."
 DDR_60s_Solidify_the_Power_of_the_SED: "Укреплять мощь СЭД"
 DDR_60s_Solidify_the_Power_of_the_SED_desc: "Одной из важных частей новой конституции должно стать укрепление власти СЕПГ. Только нашей партии удалось объединить людей из стольких разных партий"
 DDR_60s_Hold_a_Constutituonal_Reffernedum: "Провести конституционный референдум"
 DDR_60s_Hold_a_Constutituonal_Reffernedum_desc: "Сегодня народ Германской Демократической Республики приходит на избирательные участки, чтобы проголосовать за конституционный референдум, который мы недавно ввели. Если он будет принят, это утвердит ГДР как сильную социалистическую нацию и покажет желание народа и его приверженность социализму!"
 DDR_60s_Investigate_Constitutional_Reform: "Продумать конституционную реформу"
 DDR_60s_Investigate_Constitutional_Reform_desc: "Было сочтено, что наша Конституция нуждается в референдуме, чтобы определить, какие ее аспекты следует обновить и изменить"
 DDR_60s_Implement_Flexible_Pricing: "Внедрить гибкое ценообразование"
 DDR_60s_Implement_Flexible_Pricing_desc: "В отличие от чертовых капиталистов, мы хотим, чтобы наши клиенты и продавцы пришли к соглашению о том, какой должна быть конечная цена продукта. В соответствии с этой политикой продавец и клиент могут вести переговоры о цене до тех пор, пока не будет достигнуто соглашение."
 DDR_60s_Increase_Consumer_Prices: "Повышение потребительских цен"
 DDR_60s_Increase_Consumer_Prices_desc: "Некоторые голоса в нашем правительстве недавно предложили повысить цены на потребительские товары. Даже при том, что это, вероятно, дало бы нам повышение прибыи, это также привело бы к повышению уровня инфляции. Но это все еще вариант, если государству действительно нужны деньги"
 DDR_60s_Close_Unprofitable_Factories: "Закрыть убыточные фабрики"
 DDR_60s_Close_Unprofitable_Factories_desc: "Как бы мы ни поддерживали рост нашей промышленности и не позволяли рабочему найти свое место на работе своей мечты, некоторые фабрики просто не приносят достаточной прибыли, чтобы считаться достаточно ценными, чтобы оставаться открытыми. Мы закроем эти убыточные заводы и вместо этого вложим эти деньги во что-нибудь более прибыльное"
 DDR_60s_The_Economic_System_of_Socialism: "Экономическая система социализма"
 DDR_60s_The_Economic_System_of_Socialism_desc: "Настало время инициировать новую экономическую систему социализма! Рабочие будут ликовать на улицах, а Запад будет благоговеть перед тем, насколько эффективной будет эта новая система! Эта новая система гарантирует, что наша промышленность будет оставаться продуктивной и действенной! Ура рабочему классу и да здравствует наша Демократическая Республика!"
 DDR_60s_Return_to_Central_Planning: "Возврат к централизованному планированию"
 DDR_60s_Return_to_Central_Planning_desc: "Индустрия, которую Ульбрихт оставил позади, мягко говоря, в беспорядке. Мы начнем усилия по реорганизации отрасли, вернемся к централизованному планированию и вернем себе контроль, прежде чем ситуация выйдет из-под контроля"
 DDR_60s_Increase_Living_Standards: "Повысить уровень жизни"
 DDR_60s_Increase_Living_Standards_desc: "Как мы можем называть себя социалистами, если мы позволяем рабочему классу жить в ужасных условиях? Мы позаботимся о том, чтобы у наших гражданских лиц был наилучший из возможных уровень жизни!"
 DDR_60s_Housing_Expansion: "Увеличение количества жилья"
 DDR_60s_Housing_Expansion_desc: "Как мы можем допустить, чтобы в нашей стране были рабочие, которые вынуждены спать на улицах, потому что жилья на всех не хватает?! Мы не будем бездействовать! По всей стране будут построены новые жилые кварталы, гарантирующие, что ни одному мужчине, женщине или ребенку больше никогда не придется спать на улице"
 DDR_60s_Invest_in_Public_Transport: "Инвестировать в общественный транспорт"
 DDR_60s_Invest_in_Public_Transport_desc: "Не каждый может владеть автомобилем, поэтому необходим общественный транспорт. Быстрый, дешевый и эффективный способ доставить работника из дома на фабрику и в конце рабочего дня обратно домой, и, может быть, в бар по выходным!"
 DDR_60s_Toe_Moscows_Line: "Политическая линия Москвы"
 DDR_60s_Toe_Moscows_Line_desc: "Теперь, когда Ульбрихта не стало, мы должны подтвердить нашу приверженность социализму и объявить, что мы друзья Советского Союза и никогда не подумаем о его предательстве!"
 DDR_60s_Emphasize_Abgrenzung: "Подчеркнуть Разграничение"
 DDR_60s_Emphasize_Abgrenzung_desc: "Наш первый секретарь счел, что сейчас самое подходящее время подчеркнуть Разграничение. Эта политика будет направлена на то, чтобы разжечь революционный пыл в наших гражданах, научив их, где находятся границы и как они должны относиться к своей стране!"
 DDR_60s_Consumer_Socialism: "Потребительский социализм"
 DDR_60s_Consumer_Socialism_desc: "В отличие от капиталистического Запада, все наши потребители являются частью рабочего класса. Это гарантирует, что продаваемый продукт будет самого высокого качества и прослужит без поломок долгие годы!"
 DDR_60s_Unity_of_Economic_and_Social_Policy: "Единство экономической и социальной политики"
 DDR_60s_Unity_of_Economic_and_Social_Policy_desc: "У нашего секретаря была одна цель с тех пор, как он пришел к власти. С тех пор как мы попытались конкурировать с Западом с бывшим генеральным секретарем Ульбрихтом, он счел это неразумным. Вместо этого он теперь объявил, что мы будем стремиться к построению истинно социалистического общества и рабочего класса вместо этого, для улучшения положения рабочих и государства"
 DDR_60s_Increase_Technocratic_Emphasis: "Усилить технократический акцент"
 DDR_60s_Increase_Technocratic_Emphasis_desc: "Теперь, когда Зиндерманн находится у власти, одним из его первых действий является усиление акцента на технологии, смещение акцента в сторону увеличения расходов на исследования и строительство новых лабораторий"
 DDR_60s_Liberal_Economic_Reforms: "Либеральные экономические реформы"
 DDR_60s_Liberal_Economic_Reforms_desc: "Несмотря на то, что Ульбрихт, возможно, кое-что сделал правильно в экономике, он совершил гораздо больше ошибок. Мы исправим эти ошибки и либерализуем экономику, вернувшись к пятилетним планам"
 DDR_60s_Increase_Funding_for-the_Sciences: "Увеличить финансирование науки"
 DDR_60s_Increase_Funding_for-the_Sciences_desc: "Наука продвинула нас далеко с тех пор, как было основано наше государство. Мы были бы безумцами, если бы не предоставили дополнительное финансирование нашему исследовательскому отделу, чтобы дать им ресурсы, необходимые для того, чтобы привести нас в будущее, и оставить Запад в пыли!"
 DDR_60s_Seek_Independent_Course: "Искать независимый курс"
 DDR_60s_Seek_Independent_Course_desc: "В последнее время наш новый первый секретарь значительно отдаляется от наших союзников в Москве, а теперь объявляет другим членам партии, что отныне мы будем стремиться к более независимому пути развития"
 DDR_60s_Allow_Limited_Private_Economic_Activity: "Разрешить ограниченную частную экономическую деятельность"
 DDR_60s_Allow_Limited_Private_Economic_Activity_desc: "Даже если в правительстве поднимется шум, обвиняющий нас в предательстве социалистических ценностей, нам нужно разрешить некоторую частную собственность, чтобы помочь нашей экономике продолжать расти"
 DDR_60s_Improve_Access_to_Consumer_Goods: "Улучшить доступ к потребительским товарам"
 DDR_60s_Improve_Access_to_Consumer_Goods_desc: "Самый простой способ привлечь больше денег в нашу экономику - это увеличить доступ к потребительским товарам для наших граждан. Делая больше предметов роскоши доступными для простых людей, мы поможем нашей экономике значительно вырасти!"
 DDR_60s_Boost_Agitprop_Production: "Усилить работу агитпропа"
 DDR_60s_Boost_Agitprop_Production_desc: "Агитпроп распространяет наши идеи. Это сделано для того, чтобы поднять моральный дух рабочих и сделать правильными их взгляды на партию и государство. Кто-то может назвать это пропагандой, но мы рассматриваем это просто как наш способ показать рабочим, какими патриотами они должны быть за то, чего они достигли в нашем социалистическом государстве!"
 DDR_60s_Combat_Inflation: "Борьба с инфляцией"
 DDR_60s_Combat_Inflation_desc: "Мы не можем позволить инфляции выйти из-под контроля. Страны могут быть такими богатыми, какими они когда-либо хотели быть, благодаря печатанию денег, но если инфляция станет слишком высокой, это может обрушить даже самую сильную из экономик. Мы немедленно приступим к действиям по борьбе с инфляцией!"
 DDR_60s_Reject_Moscows_Demands_for_Western_Talks: "Отклонить требования Москвы о переговорах с Западом"
 DDR_60s_Reject_Moscows_Demands_for_Western_Talks_desc: "Москва подталкивает нас к тому, чтобы быть более открытыми для общения с западным миром. Но мы отказываемся! Мы не будем преклоняться перед западными капиталистами и останемся верны нашим социалистическим идеалам. Мы публично отвергнем советское требование и будем настаивать на том, что если мы решим вести переговоры с Западом, то это будет на наших условиях"
 DDR_German_Soviet_Economic_Agreement_Negotiations: "Переговоры по германо-советскому экономическому сотрудничеству"
 DDR_German_Soviet_Economic_Agreement_Negotiations_desc: "Наша следующая повестка дня - отправить наших дипломатов в Кремль и попытаться договориться о новом германо-советском экономическом соглашении, поскольку предыдущее предложило много выгодных условий для Советского Союза и, таким образом, замедлило наш экономический прогресс"
 DDR_60s_Refuse_Proposed_Soviet_Restrictions: "Отклонить предложенные советские условия"
 DDR_60s_Refuse_Proposed_Soviet_Restrictions_desc: "Как бы мы ни были благодарны СССР за помощь в создании немецкого социалистического государства, мы просто не можем согласиться с этими условиями! Мы отправим сообщение советским дипломатам с просбой, принять наши условия!"
 DDR_60s_Reject_Apels_Concerns: "Отклонить опасения Эриха Апеля"
 DDR_60s_Reject_Apels_Concerns_desc: "Один из наших чиновников в экономической комиссии протестует против нашего решения принять советские условия. Но наш аргумент за принятие договоренностей заключается в том, что его несогласие не оправдано. Советский Союз всегда был нашим другом, и мы не должны портить наши отношения из-за одного маленького договора"
 DDR_60s_Empower_the_Poiturbo_Youth_Commission: "Наделить полномочиями молодежную комиссию Политбюро"
 DDR_60s_Empower_the_Poiturbo_Youth_Commission_desc: "СЕПГ решила продолжить широкие реформы ССНМ, назначив членов Комиссии Политбюро по делам молодежи на постоянные должности в ССНМ, предоставив им должности в ключевых правительственных органах"
 DDR_60s_Subsidize_Unprofitable_Industries: "Субсидировать убыточные отрасли"
 DDR_60s_Subsidize_Unprofitable_Industries_desc: "Некоторые из наших отраслей, возможно, переживают трудные времена, производя не так много, как мы бы хотели. Но мы не можем просто уподобиться коррумпированному Западу и закрыть их, потому что они не соответствуют определенной квоте! Социализма должен поддержать эти отрасли, пока они не встанут на ноги. Потому что это соответствует социалистическим идеям!"
 DDR_60s_Rase_Salaries: "Повысить заработную плату"
 DDR_60s_Rase_Salaries_desc: "Чтобы помочь бороться с нехваткой рабочей силы, с которой мы сталкиваемся уже некоторое время, предлагается повысить заработную плату работникам. Это должно помочь привлечь новых работников на заводы и постепенно победить нехватку рабочей силы, и в конечном итоге избавивится от нее раз и навсегда!"
 DDR_60s_Uberholen_ohne_Einzuholen: "Опережать, а не догонять"
 DDR_60s_Uberholen_ohne_Einzuholen_desc: "Хотя некоторые в нашем правительстве могут сказать, что мы должны выбрать более безопасный путь сбалансированного роста, у нас есть идея получше. Мы запустим новую кампанию под названием "Опережать, а не догонять!" Мы будем стремиться значительно увеличить наш рост, в конечном итоге в кратчайшие сроки превзойти западные страны!"
 DDR_60s_Balanced_Growth: "Сбалансированный рост"
 DDR_60s_Balanced_Growth_desc: "Поскольку мы начинаем думать о том, как продолжить наши экономические реформы, некоторые в правительстве предлагают, чтобы мы не слишком рисковали в нашей цели превзойти Запад и вместо этого придерживались сбалансированной стратегии роста. Таким образом, мы не будем рисковать получить больше долгов и по-прежнему будем уверены, что наша экономика процветает. Мы сделаем это, заняв немного денег у наших товарищей по Варшавскому договору, и используем эти деньги для сильного развития нашей промышленности!"
 DDR_60s_Increase_Consumer_Goods_Production: "Увеличить производство потребительских товаров"
 DDR_60s_Increase_Consumer_Goods_Production_desc: "Один из самых безопасных способов привлечь немного внимания к нашей промышленности - увеличить производство товаров для обычного потребителя. Тостеры, духовки, радиоприемники и телевизоры. Все, что может понадобиться рабочему, будет произведено и готово для того, чтобы он мог получить это!"
 DDR_60s_Invest_in_Light_Industry: "Инвестировать в легкую промышленность"
 DDR_60s_Invest_in_Light_Industry_desc: "Теперь, когда мы увеличили производство потребительских товаров, пришло время также инвестировать в легкую промышленность. Без легкой промышленности, как еще мы могли бы быть уверены, что рабочий класс накормлен и одет? Таким образом, строительство нового индустриального парка должно быть завершено, наша цель - удовлетворить потребности рабочего класса"
 DDR_60s_Modernize_the_Steel_Plants: "Модернизация сталелитейных заводов"
 DDR_60s_Modernize_the_Steel_Plants_desc: "Некоторые из наших сталелитейных заводов уже сильно устарели. Некоторые из них все еще используют машины и инструменты, которые были оставлены здесь СССР, не говоря уже даже о некоторых машинах, которые каким-то образом пережили Вторую мировую войну. Это не может продолжаться дольше! Начнется немедленная модернизация, которая вернет металлургическим заводам былую славу!"
 DDR_60s_Build_New_Auto_Plants: "Построить новые автозаводы"
 DDR_60s_Build_New_Auto_Plants_desc: "Поскольку мы создаем все больше и больше промышленности и продолжаем расти как нация, нам нужно убедиться, что у простого человека и рабочего класса в целом есть возможность купить машину. Вот почему мы начинаем строительство новых автомобильных заводов"
 DDR_60s_Prioritize_Machine_Tool_Modernization: "Приоритет - модернизация станков"
 DDR_60s_Prioritize_Machine_Tool_Modernization_desc: "Хотя некоторые в партии хотели бы, чтобы мы инвестировали в автоматизацию, это просто не стоило бы времени и затрат. Вместо этого мы будем уделять приоритетное внимание модернизации наших станков"
 DDR_60s_Construct_New_Plants: "Построить новые заводы и фабрики"
 DDR_60s_Construct_New_Plants_desc: "Теперь, когда мы обеспечили необходимое нам финансирование, начнется строительство новых промышленных предприятий, что откроет больше новых рабочих мест и поможет нашей растущей промышленности развиваться сильнее, чем Запад мог себе представить!"
 DDR_60s_Emphasize_Electronics_Development: "Финансировать исследования в области электроники"
 DDR_60s_Emphasize_Electronics_Development_desc: "Отдел Молекулярной Электроники в Дрездене - это сердце наших исследований в области микроэлектроники. При большем финансировании они могли бы создавать технологии, превосходящию западные!"
 DDR_60s_Increase_Foriegn_Borrowing: "Занять больше денег"
 DDR_60s_Increase_Foriegn_Borrowing_desc: "Мы займем больше денег у наших братьев-марксистов и используем их, чтобы ускорить наш прогресс, показав этим весси, чего может достичь рабочий, если раскрыть весь его потенциал!"
 DDR_60s_Study_Automation_Technologies: "Автоматизация промышленности"
 DDR_60s_Study_Automation_Technologies_desc: "Идея автоматизированной промышленности была мечтой многих членов партии. Теперь, с разрешения Генерального секретаря, мы увеличим финансирование и поддержку этого исследования по автоматизации, доказав Западу, что социализм - это не какая-то захолустная экономическая система, где мы все еще используем методы 1940-х годов!"
 DDR_60s_Modernize_the_Chemical_Industry: "Модернизация химической промышленности"
 DDR_60s_Modernize_the_Chemical_Industry_desc: "Следующим шагом мы должны сосредоточиться на модернизации наших химических заводов. Некоторое время назад, когда мы расширяли химическую промышленность, мы знали, что в какой-то момент нам нужно будет разобраться со старыми технологиями. Новое оборудование, новые правила техники безопасности и новые машины будут использоваться для обеспечения безопасности химических заводов для рабочих и дальнейшего развития и процветания"
 The_German_Democratic_Republic_Military_Investment: "Военные инвестиции Германской Демократической Республики"
 The_Eastern_Bloc: "Восточный блок"
