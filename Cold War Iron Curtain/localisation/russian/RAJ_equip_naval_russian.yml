 # Корпуса подводных лодок #

 RAJ_sub_hull_small_single_2:0 "Sindhughosh-class"
 RAJ_sub_hull_small_single_2_short:0 "Sindhughosh-class"
 RAJ_sub_hull_small_single_2_desc:0 "Проект 877 "Палтус" (Sindhughosh) - класс дизельно-электрических ударных подводных лодок".
 
 RAJ_sub_hull_small_single_3:0 "Shishumar-class"
 RAJ_sub_hull_small_single_3_short:0 "Shishumar-class"
 RAJ_sub_hull_small_single_3_desc:0 "Корабли класса "Shishumar" - дизельно-электрические ударные подводные лодки, находящиеся в настоящее время на вооружении ВМС Индии. Эти подводные лодки являются индийским вариантом подводных лодок типа 209, разработанных немецкой верфью Howaldtswerke-Deutsche Werft (HDW) под внутренним обозначением Type 1500. Первые два корабля были построены HDW в Киле, остальные - на верфи Mazagon Dock Limited (MDL) в Мумбаи по соглашению о передаче технологий. Подводные лодки были введены в эксплуатацию в период с 1986 по 1994 год. Водоизмещение подводных лодок в надводном положении составляет 1660 т, скорость - 22 узла (41 км/ч), боевой состав - 40 человек, включая восемь офицеров."
 
 RAJ_sub_hull_small_single_4:0 "Scorpene-class"
 RAJ_sub_hull_small_single_4_short: "Scorpene-class"
 RAJ_sub_hull_small_single_4_desc:0 ""


 
 RAJ_sub_hull_large_single_1:0 "Kalvari-class"
 RAJ_sub_hull_large_single_1_short:0 "Kalvari-class"
 RAJ_sub_hull_large_single_1_desc:0 "Подводные лодки класса "Kalvari" были первыми подводными лодками, поступившими на вооружение ВМС Индии. Они представляли собой варианты ранних советских подводных лодок класса "Foxtrot". В составе ВМС Индии служили четыре лодки этого класса. Еще четыре варианта более позднего класса "Foxtrot" были приняты на вооружение как класс "Vela". INS Kursura сохранилась в качестве музея на пляже Миссии Рамакришны в Висакхапатнаме. Парус головного судна, INS Kalvari, также выставлен в городском музее Висакхапатнама".
 
 RAJ_sub_hull_large_single_2:0 "Vela-class"
 RAJ_sub_hull_large_single_2_short:0 "Vela-class"
 RAJ_sub_hull_large_single_2_desc:0 "Подводные лодки класса Vela ВМС Индии являлись вариантами поздних советских подводных лодок класса "Фокстрот". Последняя лодка этого класса была выведена из состава ВМС Индии в декабре 2010 года. Планируется, что INS Vagli будет сохранена в качестве музея в штате Тамилнад, однако этот процесс был сопряжен с проблемами и в настоящее время приостановлен."
 
 RAJ_sub_hull_large_single_3:0 "Charlie-class"
 RAJ_sub_hull_large_single_3_short:0 "Charlie-class"
 RAJ_sub_hull_large_single_3_desc:0 ""
 
 RAJ_sub_hull_large_single_4:0 "Akula-class"
 RAJ_sub_hull_large_single_4_short:0 "Akula-class"
 RAJ_sub_hull_large_single_4_desc:0 ""

 
 RAJ_sub_hull_large_double_3:0 "Arihant-class"
 RAJ_sub_hull_large_double_3_short:0 "Arihant-class"
 RAJ_sub_hull_large_double_3_desc:0 "Класс "Arihant" (в переводе с санскрита - "Истребитель врагов") - класс атомных подводных лодок с баллистическими ракетами, строящихся для ВМС Индии. Они были разработаны в рамках проекта Advanced Technology Vessel (ATV) стоимостью ₹90 000 крор (13 млрд. долл. США) по проектированию и строительству атомных подводных лодок. Эти корабли классифицируются Индией как ударные атомные подводные лодки стратегического назначения. Головной корабль класса, INS Arihant, был спущен на воду в 2009 г., и после продолжительных ходовых испытаний его ввод в эксплуатацию был подтвержден в августе 2016 г. Arihant - первая подводная лодка с баллистическими ракетами, построенная страной, не являющейся одним из пяти постоянных членов Совета Безопасности ООН."
 
 # Авианосцы
 
 RAJ_carrier_hull_1:0 "Majestic-class"
 RAJ_carrier_hull_1_short:0 "Majestic-class"
 RAJ_carrier_hull_1_desc:0 "INS Vikrant - авианосец класса Majestic ВМС Индии. Корабль был заложен как HMS Hercules для Британского Королевского флота во время Второй мировой войны, но после ее окончания строительство было приостановлено. Индия приобрела недостроенный авианосец в 1957 году, а строительство было завершено в 1961 году. Vikrant был введен в строй в качестве первого авианосца ВМС Индии и сыграл ключевую роль в обеспечении морской блокады Восточного Пакистана во время индо-пакистанской войны 1971 года."
 
 RAJ_carrier_hull_2:0 "Centaur-class"
 RAJ_carrier_hull_2_short:0 "Centaur-class"
 RAJ_carrier_hull_2_desc:0 "INS Viraat - авианосец класса "Centaur" ВМС Индии. INS Viraat был флагманом ВМС Индии до ввода в строй в 2013 году INS Vikramaditya. Корабль был достроен и введен в эксплуатацию в 1959 г. как HMS Hermes Королевского флота, а в 1984 г. выведен из эксплуатации. В 1987 году он был продан Индии. INS Viraat был введен в состав ВМС Индии 12 мая 1987 г. и прослужил почти 30 лет".
 
 RAJ_carrier_hull_3:0 "Kiev-class"
 RAJ_carrier_hull_3_short:0 "Kiev-class"
 RAJ_carrier_hull_3_desc:0 "INS Vikramaditya - модифицированный авианосец класса "Kiev" и флагман ВМС Индии, вступивший в строй в 2013 г. Первоначально построенный как "Баку" и введенный в эксплуатацию в 1987 г., авианосец служил в ВМФ СССР, а затем в ВМФ России (как "Адмирал Горшков"), после чего был выведен из эксплуатации в 1996 году. После многолетних переговоров 20 января 2004 г. авианосец был приобретен Индией по окончательной цене 2,35 млрд. долл. Корабль успешно прошел ходовые испытания в июле 2013 г.[23] и авиационные испытания в сентябре 2013 г. Ввод в эксплуатацию состоялся 16 ноября 2013 г. на торжественной церемонии в Северодвинске (Россия). 14 июня 2014 года премьер-министр Индии официально ввел INS Vikramaditya в состав ВМС Индии и посвятил его нации."
 
 RAJ_carrier_hull_4:0 "Проект 71"
 RAJ_carrier_hull_4_short:0 "Проект 71"
 RAJ_carrier_hull_4_desc:0 "INS Vikrant, также известный как Indigenous Aircraft Carrier 1 (IAC-1), - авианосец, построенный на верфи Cochin Shipyard в Кочи, штат Керала, для ВМС Индии. Это первый авианосец, построенный в Индии. Название Vikrant (санскр. vikrānta, буквально "шаг за пределы") означает "отважный". Девиз корабля - Jayema Sam Yudhi Sprdhah, взятый из Ригведы 1.8.3, который можно перевести как "Я побеждаю тех, кто сражается против меня".
 
 
 RAJ_carrier_hull_super_4:0 "Vishal-class"
 RAJ_carrier_hull_super_4_short:0 "Vishal-class"
 RAJ_carrier_hull_super_4_desc:0 "INS Vishal, также известный как Indigenous Aircraft Carrier 2 (IAC-2), - планируемый авианосец, который должен быть построен компанией Cochin Shipyard Limited для ВМС Индии. Он должен стать вторым авианосцем, построенным в Индии после INS Vikrant (IAC-1). Предлагаемый проект второго авианосца будет представлять собой новую конструкцию, отличающуюся от "Викранта" значительными изменениями, в том числе увеличением водоизмещения. Рассматривается также возможность использования электромагнитной системы запуска летательных аппаратов (EMALS) CATOBAR. Его название Vishal в переводе с санскрита означает "гигант"."
 
 # Боевые корабли
 
 RAJ_battle_hull_light_0:0 "Leander-class"
 RAJ_battle_hull_light_0_short:0 "Leander-class"
 RAJ_battle_hull_light_0_desc:0 "В 1948 году был продан ВМС Индии и вновь введен в строй как INS Delhi. Списан на слом в 1978 г.".
 
 RAJ_battle_hull_light_1:0 "Fiji-class"
 RAJ_battle_hull_light_1_short:0 "Fiji-class"
 RAJ_battle_hull_light_1_desc:0 "INS Mysore - легкий крейсер британской постройки (класс "Fiji"). Он был передан из состава ВМС Великобритании в 1957 году. Прослужив 28 лет, крейсер был выведен из эксплуатации в 1985 году."
 
 RAJ_battle_hull_light_2:0 "Rajput-class"
 RAJ_battle_hull_light_2_short:0 "Rajput-class"
 RAJ_battle_hull_light_2_desc:0 "Управляемые ракетные эсминцы класса "Rajput", построенные для ВМС Индии, являются модифицированными версиями советских эсминцев класса "Кашин". Они также известны как эсминцы класса "Кашин-II". Корабли были построены в бывшем Советском Союзе после значительных доработок индийской стороной проекта "Кашин". Они включали в себя замену вертолетной площадки в первоначальном проекте на полетный лифт, а также значительные изменения в электронике и боевых системах. В 1980-х годах для экспорта в Индию было построено пять машин. В настоящее время все корабли входят в состав Восточного военно-морского командования".
 
 RAJ_battle_hull_light_3:0 "Delhi-class"
 RAJ_battle_hull_light_3_short:0 "Delhi-class"
 RAJ_battle_hull_light_3_desc:0 "Класс Delhi описывается как растянутый класс Rajput с некоторыми элементами от фрегатов класса Godavari- и эсминцев класса "Современный". Носовая воронка расположена по левому борту, а кормовая - по правому. Силовая установка состоит из двух газотурбинных установок "Зоря-Машпроект" М36Э, приводящих в движение два гребных винта управляемого шага. Каждая газотурбинная установка состоит из двух реверсивных газовых турбин ДТ-59, соединенных с редуктором РГ-54 в комбинированную газо-газовую систему, и размещается в отдельном машинном отделении. Корабли оборудованы для работы в условиях ядерного, биологического и химического оружия. Корабли класса Delhi- оснащены флагманскими средствами, что позволяет им выполнять функции командного пункта в составе оперативных групп. INS Mysore оснащен более совершенными системами кондиционирования воздуха, что позволяет устранить проблемы с теплоотдачей, возникшие при эксплуатации INS Delhi".
 
 RAJ_battle_hull_light_4:0 "Kolkata-class"
 RAJ_battle_hull_light_4_short:0 "Kolkata-class"
 RAJ_battle_hull_light_4_desc:0 "Эсминцы класса "Kolkata" (проект 15А) - это класс эсминцев с управляемыми ракетами класса "стелс", построенных для ВМС Индии. Класс состоит из трех кораблей - Kolkata, Kochi и Chennai, построенных индийской компанией Mazagon Dock Limited (MDL), и является самым большим эсминцем, который будет эксплуатироваться ВМС Индии. Из-за задержек в строительстве и ходовых испытаниях первоначальная дата ввода в строй первого корабля класса была перенесена с 2010 на 2014 год".
 
 RAJ_screen_hull_medium_0:0 "Bathurst-class"
 RAJ_screen_hull_medium_0_short:0 "Bathurst-class"
 RAJ_screen_hull_medium_0_desc:0 ""
 
 RAJ_screen_hull_medium_1:0 "Flower-class"
 RAJ_screen_hull_medium_1_short:0 "Flower-class"
 RAJ_screen_hull_medium_1_desc:0 ""
 
 RAJ_screen_hull_medium_2:0 "Khukri-class"
 RAJ_screen_hull_medium_2_short:0 "Khukri-class"
 RAJ_screen_hull_medium_2_desc:0 "Корветы класса Khukri - это класс корветов, предназначенных для замены устаревших корветов класса Petya II ВМС Индии. Первые два корабля были заказаны в декабре 1983 года, остальные - в 1985 году. Около 65% корабля - отечественного производства. Дизельные двигатели были собраны в Индии по лицензии Kirloskar Group".
 
 RAJ_screen_hull_medium_3:0 "Kora-class"
 RAJ_screen_hull_medium_3_short:0 "Kora-class"
 RAJ_screen_hull_medium_3_desc:0 "Корветы класса "Kora" - 1350-тонные корветы с управляемыми ракетами, состоящие на вооружении ВМС Индии. Четыре корабля были построены на верфи Garden Reach Shipbuilders and Engineers (GRSE) и оснащены оборудованием на верфи Mazagon Dock Limited (MDL)".
 
 RAJ_screen_hull_medium_4:0 "Kamorta-class"
 RAJ_screen_hull_medium_4_short:0 "Kamorta-class"
 RAJ_screen_hull_medium_4_desc:0 "Корветы класса "Kamorta" или "Проект 28" - класс противолодочных стелс-корветов, находящихся в настоящее время на вооружении ВМС Индии. Построенные на заводе Garden Reach Shipbuilders & Engineers (GRSE) в Калькутте, они являются первыми противолодочными стелс-корветами, построенными в Индии."
 
 RAJ_screen_hull_heavy_0:0 "River-class"
 RAJ_screen_hull_heavy_0_short:0 "River-class"
 RAJ_screen_hull_heavy_0_desc:0 ""
 
 RAJ_screen_hull_heavy_1:0 "Nilgiri-class"
 RAJ_screen_hull_heavy_1_short:0 "Nilgiri-class"
 RAJ_screen_hull_heavy_1_desc:0 ""
 
 RAJ_screen_hull_heavy_2:0 "Brahmaputra-class"
 RAJ_screen_hull_heavy_2_short:0 "Brahmaputra-class"
 RAJ_screen_hull_heavy_2_desc:0 "Фрегаты класса "Brahmaputra" (тип 16А или проект 16А) - управляемые ракетные фрегаты ВМС Индии, спроектированные и построенные в Индии. Они являются усовершенствованием класса Godavari, имеют водоизмещение 3850 т. и длину 126 м. (413 футов). Несмотря на схожесть корпуса и размеров, внутри корабли классов Brahmaputra и Godavari имеют различную конфигурацию, вооружение и возможности. В составе ВМС Индии служат 3 корабля этого класса".
 
 RAJ_screen_hull_heavy_3:0 "Talwar-class"
 RAJ_screen_hull_heavy_3_short:0 "Talwar-class"
 RAJ_screen_hull_heavy_3_desc:0 "Фрегаты класса Talwar или проект 11356 - класс фрегатов с управляемыми ракетами класса "стелс", спроектированных и построенных Россией для ВМС Индии. Фрегаты класса Talwar являются усовершенствованной версией фрегатов класса Krivak III (проект 1135), используемых Береговой охраной России. В дальнейшем проект был доработан как фрегат класса "Адмирал Григорович" для ВМФ России. Шесть кораблей были построены двумя партиями в период с 1999 по 2013 год. Первая партия кораблей была спроектирована КБ "Северное" и построена Балтийским заводом, вторая - судостроительным заводом "Янтарь". Предшественники фрегатов класса Brahmaputra, фрегаты класса Talwar, как утверждается, обладают полубесшумными характеристиками и более совершенным вооружением. В настоящее время ВМС Индии располагают шестью такими кораблями, еще 4 находятся в стадии строительства, в том числе 2 - на индийской верфи, в качестве которой была выбрана верфь в Гоа."
 
 RAJ_screen_hull_heavy_4:0 "Shivalik-class"
 RAJ_screen_hull_heavy_4_short:0 "Shivalik-class"
 RAJ_screen_hull_heavy_4_desc:0 "Класс Shivalik или Project 17 - класс многоцелевых стелс-фрегатов, состоящих на вооружении ВМС Индии. Это первые боевые корабли класса "стелс", построенные в Индии. По сравнению с предшествующими фрегатами класса Talwar они обладали лучшими характеристиками скрытности и наземными атакующими возможностями. Всего в период с 2000 по 2010 гг. было построено три корабля, и к 2012 г. все три корабля были введены в строй. Класс Shivalik, а также семь фрегатов проекта 17А, разрабатываемых на его основе, по прогнозам, станут основными фрегатами ВМС Индии в первой половине XXI века. Все корабли класса были построены компанией Mazagon Dock Limited. Класс и головной корабль названы в честь холмов Шивалик. Последующие корабли класса также названы в честь горных хребтов Индии".
 