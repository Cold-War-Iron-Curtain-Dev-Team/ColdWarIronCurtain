 KLFA_insurgency_options.1.d: "Некоторые из наших спецагентов, у которых есть родственники, работающие в сельском хозяйстве, сумели проникнуть в Мау-Мау незамеченными. Теперь они смогут получать много информации изнутри организации, главным образом благодаря семейному доверию. Мы сможем отслеживать передвижения противника и готовиться к отражению крупных атак. Однако СДА ожидает, что члены их семей будут помилованы после того, как мятеж будет подавлен.\nЭтот успех будет иметь глубокие позитивные последствия и защитит нашу нацию"
 KLFA_insurgency_options.2.d: "Наши спецагенты пытались проникнуть в Мау-Мау через членов семьи, которые работают в сельском хозяйстве, но это привело к ужасным последствиям. Агентов СДА схватили, допросили или убили. Кроме того, некоторые агенты избрали семью вместо страны и дали им информацию о наших операциях по борьбе с повстанцами.\nЭта неудача - пятно на нашем послужном списке и будет иметь значительные последствия."
 KLFA_insurgency_options.3.d: "Серия рейдов по городам и сёлам, где размещалась сухопутная армия повстанцев, увенчалась оглушительным успехом. Сотни вражеских повстанцев лежат мертвыми в своих домах, а их имущество захвачено государством. Мы забрали их оружие и снаряжение для себя. Продажа с аукциона имущества ныне покойных повстанцев также принесет значительный уровень дохода, большая часть которого, вероятно, пойдет на стимулирование исполнительной власти.\nЭтот успех ослабит их будущие операции и снизит их свирепость."
 KLFA_insurgency_options.4.d: "Попытка совершить рейд на вражеские позиции в сельских городах с использованием полиции привела к обратным результатам. Многие местные повстанцы имели связи с нашей полицией и нанесли удар в спину лоялистским офицерам. В настоящее время существует бесчисленное множество небольших городов и деревень, которые полностью контролируются вражескими повстанцами и находятся вне контроля правительства. Кроме того, враг теперь контролирует больший запас оружия и оружия из предательских полицейских участков.\nЭта неудача ослабит наши попытки бороться с ними в этом регионе и, вероятно, увеличит их свирепость."
 KLFA_insurgency_options.5.d: "Легкие реактивные бомбардировщики сумели уничтожить множество известных повстанцам плацдармов и тренировочных площадок в дикой местности. В дополнение к запугиванию потенциальных рекрутов, эти взрывы вызвали утечку мозгов в Мау-Мау, поскольку многие инструктора были убиты, это привело к нехватке способных инструкторов в рядах Мау-Мау. Сочетание эффекта утечки мозгов и эффекта устрашения, это скорее всего, не позволит противнику поддерживать интенсивность своих атак.\nПротивник теперь будет менее боеспособен и будет менее агрессивен в будущем."
 KLFA_insurgency_options.6.d: "Наши легкие реактивные самолёты нацеливались на ложные цели. Противник устроил засаду против наших самолётов и сбил их, когда они целились в дешёвые приманки. Потеря этих самолетов в АО позволит противнику быть более смелым, стать более агрессивным и начать атаки, которые обычно можно было бы предотвратить с помощью воздушной поддержки.\nЭта неудача ослабит способность армии бороться с повстанцами и предотвращать нападения, делая их более агрессивными."
 KLFA_insurgency_options.10.d: "\nПосле многих лет борьбы Мау-Мау были подавлены, и те немногие их сторонники, слишком боятся восстать снова. Кенийское восстание, которое желало положить конец колониальному правлению, было подавлено колониальными войсками и официально окончилось захватом лидера повстанцев, фельдмаршала Стэнли Матенджа.\nБританские колониальные чиновники опубликовали заявление, что они положили конец восстанию в Кении, которая вероятно, останется под британским правлением в течение очень длительного периода времени. Правда это или нет, еще предстоит выяснить, поскольку многие жители Кении все еще имеют серьезные проблемы с колониальной политикой, и в будущем это может привести к необратимым последствиям.\nКак бы то ни было, Мау-Мау были уничтожены, и единственное, что остается несомненным в будущем, - это то, жители Кении больше не вступят в Мау-Мау."
 KLFA_insurgency_options.11.d: "После долгих лет борьбы Мау-Мау успешно свёрг британское колониальное правление и достиг своих целей. Кенийское восстание, которое стремилось положить конец колониальному правлению, успешно вытеснило колониальных лоялистов и достигло своих целей. Колониальные гарнизоны были уничтожены, британские лоялисты изгнаны или убиты, а солдаты армии Мау-Мау возвращаются на свои фермы.\nЛидер Мау-Мау, фельдмаршал Стэнли Матендж, объявил на пресс-конференции, что это принесёт новую эру, независимости Африки от колониального гнета и обещает дать Кении “все, чего она заслуживает и в чем ей было отказано”.\nУспех Мау-Мау ознаменует новую главу в истории Кении и нанесет удар по Британской империи."
