 uia_decisions: "£UIA_Icon Украинская Повстанческая армия"
 uia_decisions_desc: "£UIA_Icon Украинская Повстанческая армия\nОснована в 1942, УПА воевала против фашистских захватчиков, Красной армии, и даже против Польского подпольного государства, всё это в попытках создать независимое и ориентированное на Германию украинское государство. Хотя очаги сопротивления все еще существуют в Карпатах, основная часть националистической военизированной группировки официально раздавлена сапогом Красной армии, и НКВД работает над тем, чтобы искоренить тех не многих, кто состоит в УПА.\n\n Текущая сила: [?ukranian_insurgency|R]%\n Текущий выбранный регион: [?root.current_country_state_decision.GetName]"
