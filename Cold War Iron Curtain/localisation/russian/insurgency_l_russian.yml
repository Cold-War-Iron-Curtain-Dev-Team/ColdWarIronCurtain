 The_Evian_Accords: "Эвианские соглашения"
 FLN_insurgency_options.0.d: "Празднование Дня Всех Святых в Алжире было прервано резнёй повстанцев совершивших набеги на французов. ФНО (Фронт национального освобождения) взял на себя полную ответственность за это и передаёт список своих требований, которые включают полную независимость и вывод всех французских войск из региона.\n\nФранцузское правительство отрицает легитимность ФНО и, как ожидается, увеличит французское военное присутствие в регионе."
 FLN_insurgency_options.1.d: "Некоторые из наших спецагентов имеют контакты в исламском религиозном сообществе и добиваются расположения, чтобы войти в более религиозно набожные секты ФНО. Теперь они смогут получать много информации из самой организации. Мы сможем отслеживать передвижения противника и готовиться к отражению крупных операций с этой выгодой. СДА, настоял на том, чтобы спецагенты и члены их семей были помилованы после того, как мятеж будет подавлен.\nЭтот успех будет иметь глубокие позитивные последствия и защитит нашу нацию"
 FLN_insurgency_options.2.d: "Наши спецагенты пытались проникнуть в ФНО через свои контакты в религиозной общине, но это привело к ужасным последствиям. Агенты СДА были схвачены, допрошены или убиты. Кроме того, некоторые агенты предпочли Алжир и предоставили им информацию о наших операциях по борьбе с повстанцами.\nЭта неудача - пятно на нашем послужном списке и это будет иметь заметные последствия."
 FLN_insurgency_options.3.d: "Серия рейдов в города, в которых расположены опорные пункты ФНО, увенчалась оглушительным успехом. Тысячи вражеских повстанцев погибли на своих базах, а их имущество захвачено французским колониальным командованием. Мы забрали их оружие и снаряжение для себя. Эти стратегические запасы, которые они потеряли, дорого им обойдутся и негативно повлияют на будущие операции ФНО.\nЭтот успех ослабит их будущие операции и снизит их свирепость."
 FLN_insurgency_options.4.d: "Попытка совершить налет на вражеские позиции в городах с использованием колониальных военных средств привела к обратному результату. Вражеские опорные пункты были слишком укреплены и смогли отразить атаки и расширить свой контроль. В настоящее время существует бесчисленное множество городских кварталов, которые полностью контролируются вражескими солдатами и не находятся под колониальным контролем. Кроме того, противник теперь контролирует большой запас оружия и боеприпасов от разгромленных или погибших солдат.\nЭта неудача ослабит наши попытки бороться с ними в этом регионе и, вероятно, увеличит их свирепость."
 FLN_insurgency_options.5.d: "Легкие реактивные бомбардировщики сумели уничтожить многочисленные известные районы снабжения и подготовки солдат ФНО в сельских районах. В дополнение к запугиванию потенциальных рекрутов, эти взрывы вызвали утечку мозгов в ФНО, поскольку многие инструктора были убиты, что привело к нехватке способных инструкторов в рядах ФНО. Сочетание эффекта утечки мозгов и эффекта устрашения, скорее всего, не позволит противнику поддерживать интенсивность своих атак.\nПротивник теперь будет менее боеспособен и будет менее агрессивен в будущем."
 FLN_insurgency_options.6.d: "Наши легкие реактивные самолеты были нацелены на хорошо охраняемые районы обучения и снабжения в сельских районах, контролируемых ФНО. Значительное присутствие ПВО противника нанесло удар по нашим самолетам и уничтожило их прежде, чем они смогли нанести удар.. Потеря этих самолетов в АО позволит противнику быть более смелым и воспользоваться возможностью стать более агрессивным и начать атаки, которые обычно можно было бы предотвратить с помощью воздушной поддержки.\nЭта неудача ослабит способность армии бороться с повстанцами и предотвращать нападения, делая их более агрессивными."
 FLN_insurgency_options.10.d: "По прошествии бесчисленных лет алжирский Фронт национального освобождения пал, его остатки были разбросаны, а поддержка уменьшилась. Французское правительство провозгласило победу над ФНО и восстановило полный контроль над регионом. Несмотря на угасание огней революции, регион останется нестабильным в результате войны. Что будет с Алжиром в будущем - неизвестно. Однако ясно одно: Алжир останется французским."
 FLN_insurgency_options.11.d: "Алжирские военные одержали решительную победу над французскими войсками в столице и вынудили их отступить. После затянувшейся серии сражений и многочисленных стратегических побед алжирская ФНО захватила большинство французских военных опорных пунктов и заставила французское правительство заплатить высокую цену за оккупацию Алжира. В результате этой победы и бесчисленных провалов французов на фронте ожидается, что Алжир в военном отношении обеспечит свою независимость от Франции и добьется победы на своих собственных условиях."
 FLN_insurgency_options.15.d: "После многих лет бесконечной борьбы и конфликтов Алжирское и французское правительства согласились подписать окончательные Эвианские соглашения. Этот договор не только официально закрепит прекращение огня между двумя странами, но и организует кооперативный обмен между двумя странами.\n\nЭти договоренности будут гарантировать суверенитет и самоопределение алжирского правительства и гарантировать защиту, недискриминацию и имущественные права алжирских граждан. Кроме того, Алжир получит помощь от Франции для содействия экономическому росту страны. Соглашения также идут на компромисс с французским правительством, чтобы позволить Франции сохранить первенство над сахарскими запасами нефти, защиту нескольких национальных и этнических групп и ряд других преимуществ."
 War_Exhaustion_Modifier: "Истощение от войны"
 UPC_decisions: "Война в Бамилеке"
 UPC_decisions_desc: "£UPC_icon СНК (Союз народов Камеруна) это камерунские мятежники, которые стремится к национальному суверенитету и социалистическому строю. СНК очень сложен, под ним находится множество разнообразных военных структур, но он никоим образом не дезорганизован. СНК начал военные действия после того, как он был официально запрещен как партия французским колониальным комиссариатом, и его беспорядки были подавлены. СНК также очень агрессивен и не очень хорошо переносит инакомыслие среди своих рядов или населения. Восстание в значительной степени опирается на поддержку коренной этнической группы Бамилеке и имеет связи с Китайской Народной Республикой, которая обеспечивает их вооружением\n\n Текущая сила: [?CMR.UPC_insurgency|R]%"
