 KURD_SIX_DAY.1.d: "Правительство Курдистана столкнулось с потенциальным шансом. Поскольку Дамаск ведет войну против Израиля, его граница с Курдистаном практически не защищена. Старшие военные командиры считают, что курдские силы могут быстро освободить исторические курдские земли Хасака и укрепить их задолго до того, как сирийцы смогут контратаковать. Даже если сирийцы откажутся принять сложившуюся ситуацию, конфликт в Израиле и его последствия помешают Сирии направить подавляющие силы в Хасаку. Военное командование считает, что сирийцы в конечном итоге просто смирятся с ситуацией. Другие члены кабинета министров предупреждают, что такая военная авантюра приведет к отчуждению всех соседних государств со значительным курдским населением и рискует оставить страну в дипломатической изоляции. Однако среди населения существует сильное желание, заключающееся в объединении всего курдского народа."
 KURD_SIX_DAY.2.d: "Вооруженные силы Курдистана успешно пересекли границу и заняли Хасах. Сирийские пограничники были слишком малочисленны, чтобы оказать эффективное сопротивление, и противники потерпели поражение. По мере продвижения курдских войск их встречали местные курды, которые толпами приходили приветствовать своих освободителей. Курдское правительство после обретения независимости установило связи с этими общинами, и это окупилось. Поскольку Хасака оккупирована, а курдские войска окопались, сирийское правительство объявило, что не будет оспаривать это действие. Она объявила Курдистан предателями веры и предателями своих действий, но добавила, что борьба с сионизмом является главной целью сирийского народа. Правительство Курдистана объявило, что оно успешно освободило сирийских курдов и находится на пути к объединению всех курдов. Соседи Курдистана не были впечатлены такими заявлениями и осудили эту акцию."
 KURD_SIX_DAY.3.d: "Когда военные Курдистана начали свое внезапное вторжение в Хасах, они рассчитали, что Сирийское сопротивление будет минимальным из-за продолжающейся войны с Израилем. Однако это оказалось просчетом, так как сирийское сопротивление остановило продвижение курдов. Хотя многие сирийские курды вышли поддержать своих освободителей, Сирийское сопротивление вдохновило некурдских жителей открыто присоединиться к сопротивлению. Поскольку ситуация затягивается, правительство Курдистана объявило, что оно уйдет из Хасаки, но добавило, что никогда не забудет свою священную миссию по объединению всех курдов. Многие сирийские курды, опасаясь репрессий, эвакуируются вместе с этими силами, подчеркивая провал операции. Сирийское правительство ликовало в своем ответе, заявляя, что они сорвали предательский заговор курдов. Они добавили, что этот успех в Хасаке отражает победоносный дух сирийского народа и его неизбежное шествие к победе над всеми врагами."
 Iraqi_Kurdish_War_First: "Первая Иракско-Курдская война"
 Iraqi_Kurdish_War_First_desc: "После иракской революции новое правительство стремилось тесно сотрудничать с курдскими лидерами, которые когда-то воевали против прежнего правительства. Это привело к союзу между демократической партией Курдистана (ДПК) и иракским правительством. Однако в последние годы иракское правительство отказалось принять требования автономии. Это привело к вражде, и после того, как ДПК разгромила про-иракские племена и изгнали иракских правительственных чиновников из Курдистана, Багдад развернул свои войска. Сейчас иракское правительство ведет борьбу с курдскими партизанами за статус Курдистана.\n\nТекущий статус:\n[IRQ.GetNameDef]: [?IRQ.KURD_insurgency] победных очков\n[KUR.GetNameDef]: [?KUR.KURD_insurgency] победных очков\n\nЕжемесячное иностранное финансирование для [KUR.GetNameDef]: [?KUR.global_kurd_funding] миллионов\n\nПримечание: первая сторона набравшая 1000 победных очков выиграет этот конфликт"
 Rawanduz_Campaign.1.d: "Война в Курдистане шла не так, как рассчитывало иракское правительство. Несмотря на превосходящую огневую мощь и большую численность войск, иракские войска часто оказывались в тупике из-за партизанской тактики демократической партией Курдистана (ДПК). Они хорошо знали местность и пользовались поддержкой местных жителей. Иракские военные решили начать массированную операцию в Равандузе, чтобы сокрушить ДПК и повернуть ход событий против повстанцев. Обеспечение безопасности Равандуза разрушит огромную базу снабжения для ДПК и поможет иракцам перекрыть поставки в ДПК, поступающие из-за рубежа. Иракское правительство уверено, что если оно направит достаточно большие силы, то враг не сможет оказать сопротивление. План предусматривает, что девять иракских бригад разделятся на две части и сделают большие клещи, чтобы заманить в ловушку и уничтожить курдских повстанцев"
 Rawanduz_Campaign.2.d: "Сегодня до Багдада дошли катастрофические Новости об иракских военных операциях во время кампании в Равандузе. Хотя наступление шло хорошо, за последние два дня до нас дошли новости о том, что целая бригада наших войск была уничтожена курдскими повстанцами из демократической партией Курдистан (ДПК). Командир бригады решил разбить лагерь в долине между горой Хандрин и горой Зозик. Однако ему не удалось установить посты в окрестных холмах и горах, чем и воспользовались курдские боевики. Используя эти высоты, они уничтожили бригаду, нанеся тысячи потерь и захватив в плен тысячи солдат. Выжившие, как говорят, дезертировали. Это поражение сломило боевой дух наших атакующих сил, и был отдан приказ остановить наступление. Кампания в Равандузе стала унизительным поражением, и мало кто когда-либо забудет катастрофу, которая была битвой при горе Хандрин."
 Rawanduz_Campaign.3.d: "Иракский командир Равандузской кампании связался по радио с Багдадом, чтобы объявить об успехе тактики клещей. Несколько тысяч курдских бойцов были пойманы в ловушку, и наши войска смогли окружить и уничтожить их с их подавляющим превосходством в огневой мощи и людях. Этой победой мы очистили регион от курдских повстанцев и, что еще важнее, отрезали им доступ к иностранной помощи. Ход войны изменился в нашу пользу. Теперь курдские бойцы должны бороться, чтобы восстановить свои потери и пополнить свои запасы. Правительство уже объявило, что будет вручать ряд наград в знак признания этого наступления, а также доверие к иракским военным возросло."
 Iraqi_Kurdish_War.11.d: "Иракское правительство и демократическая партия Курдистана официально подписали соглашение о прекращении боевых действий. Иракцы согласились признать Курдистан независимым государством. После подписания договора последние колонны иракских войск покинули границы Курдистана. Несмотря на серию наступательных операций и ожесточенные бои, бойцы вышли победителями. Иракским военным мешало плохое руководство и опора на солдат-срочников, немотивированных воевать на враждебной им земле. В отличие от этого, боевики были высоко мотивированы и сражались на своих собственных землях, успешно мобилизуя поддержку и используя местность против иракцев. Хотя первоначальным мотивом для ДПК была автономия, насильственный иракский ответ и крупные победы убедили ДПК вместо этого отвоевать свою независимость. Курдистан присоединяется к миру как новая нация и пообещал стать родиной для курдов всего региона."
 Iraqi_Kurdish_War.0.d: "После иракской революции новое правительство примирилось с популярным курдским лидером и мятежником Мустафой Барзани. Вскоре Барзани возглавил демократическую партию Курдистана (ДПК), выступавшую за автономию, как и обещало иракское правительство. Иракское правительство забеспокоилось по этому поводу, так как она поддержала волнения среди курдов из-за отказа получить автономию. Попытка иракского правительства использовать соперничающие курдские племена для разгрома Барзани закончилась неудачей, и вскоре иракские правительственные чиновники были изгнаны из Курдистана. Иракцы мобилизовали своих военных и вернулись в Курдистан. Быстро вступив в интенсивные бои с ДПК, которая растопила свои силы в горах и городах, чтобы вести длительную партизанскую войну против иракского правительства. Иракское правительство теперь должно иметь дело с врагом, действующим в труднодоступной местности и имеющим сильную местную поддержку."
 Iraqi_Kurdish_War.12.d: "Демократическая партия Курдистана (ДПК) в течение многих лет сопротивлялась иракским военным наступлениям и последовательно требовала признания курдской автономии от Багдада. Иракское правительство наконец признало, что оно потерпело неудачу в уничтожении ДПК или утверждении своего господства в Курдистане, и подписало соглашение с ДПК, гарантирующее автономию Курдистана. Когда автономия Курдистана будет обеспечена, правительство объявило, что оно начнет процесс восстановления Курдистана. Иракское правительство стремилось преуменьшить свой проигрыш перед курдскими требованиями, заявив, что новое соглашение отражает стремление к миру среди иракцев и демонстрирует всему миру приверженность Ирака национальному примирению. Иракское правительство добавило, что соглашение было заключено не между иракцами и курдами, а между иракскими братьями. Несмотря на эти заявления, на международном уровне соглашение рассматривается как победа ДПК против иракского правительства."
 Iraqi_Kurdish_War.10.d: "Демократическая партия Курдистана (ДПК) подписала соглашение о капитуляции перед иракским правительством. Война началась с изгнания иракских чиновников после подавления попытки про-иракских курдов утвердить власть в Курдистане. В результате возникшего конфликта иракские военные развернули крупные наступательные операции, чтобы изгнать и разгромить ДПК. После серии успешных операций, ДПК вскоре поняла, что ситуация была безнадежной и согласилась сдаться. В своём заявлении иракское правительство отметило, что его победа демонстрирует доминирование, профессионализм и рвение иракских военных. Что еще более важно, она объединяет Ирак и показывает всему миру, что иракское единство никогда не может быть оспорено с помощью таких опосредованных групп, как ДПК. Эти боевые действия закончились в пользу Ирака. Однако есть много тех, кто опасается, что если правительство вернёт свою жесткую политику в Курдистан, то в будущем оно рискует подтолкнуть Курдов к новому восстанию."
 KUR_Insurgency_Options.1.d: "Вчера наши бойцы успешно совершили атаку на иракскую военную базу. В то время как большая часть иракских войск проводила крупномасштабную зачистку, наши войска легко выскользнули и атаковали базу, с которой они действовали. Присутствующие иракские войска почти не оказывали сопротивления, большинство из них либо бежали, либо сдавались, поскольку наши люди быстро захватили базу. Мы уничтожили оборудование, захватили документы, припасы и оружие. Все это будет способствовать нашей борьбе и вселит страх в иракских солдат срочной службы, которых Багдад направил против нас. Командир наших бойцов, ведя бойцов обратно в их безопасное место, и сумел даже устроить засаду на небольшой отряд иракских войск, который слишком далеко отошёл от основных сил."
 KUR_Insurgency_Options.2.d: "В недавней катастрофе погиб один из наших командиров. Он провёл разведку иракского аванпоста неподалёку от своего района. Пост, по-видимому, был слабо укомплектован и предназначался как наблюдательный пункт. Его удаленность от основных иракских сил заставила командира думать, что иракцы допустили тактическую ошибку, и он мог бы справиться с ними без особых усилий. Однако, когда его войска двинулись на штурм аванпоста, они не нашли испуганных иракских солдат-срочников, вместо этого аванпост был укомплектован иракскими коммандос лёгкой пехоты. Они удерживали свои позиции и наносили нашим войскам тяжёлые потери. Нашим людям удалось отступить, но тяжёлые потери и неудачный налёт снизили боевой дух в секторе. Осмелевшие иракские коммандос теперь патрулируют район открыто."
 KUR_Insurgency_Options.5.d: "Наши люди внедрённые ко врагу, действовавшие в большой деревне, вчера успешно взорвали здание иракского правительства. Отважные бойцы заметили, что здание недостаточно охраняется, и в течение ночи сумели разместить внутри взрывчатку. Взрыв уже привел к тому, что иракские правительственные служащие в этом городе бежали обратно в Багдад или оставались дома. Мы должны продолжать демонстрировать народу Курдистана, что мы не потерпим вмешательства иракского правительства. Иракское правительство уже пытается вернуть этих чиновников и утверждет, что они держат ситуацию в Курдистане по контролем, но наши действия подчеркивают ложность подобных утверждений."
 KUR_Insurgency_Options.6.d: "Наши люди внедрённые ко врагу были вчера окружены иракской армией. Они планировали разбомбить здание, которое использовалось армией в качестве базы в одном из крупных городов. Однако иракцы подозревали, что их опрашивают несколько наших людей, и когда наши диверсанты вернулись, чтобы заложить взрывчатку, они были задержаны иракцами. Эти люди были быстро преданы военному суду. Кроме того, иракцы подчеркивают, сколько взрывчатки они захватили, и заявляют, что им наплевать на курдских мирных жителей, которые были бы убиты в этом районе. Эта негативная пропаганда вредит нашему делу."
 KUR_Insurgency_Options.3.d: "Иракская армия состоит из призывников и плохо подготовленных офицеров. Они также приходят из-за пределов Курдистана и не знают людей или местности. Это выгодно нашей группе, поскольку наше разведывательное крыло недавно начало операцию по отправке курдов для оказания переводческих услуг иракским силам в районе операций. Они выдают себя за членов про-правительственных племён, а иракская армия пока ничего не знает. Наши люди уже сообщают превосходную информацию о численности, передвижениях и тактике иракских войск. Взамен наши люди предоставляют им старую информацию и посылают иракские формирования в операции зачистки, которые помогают облегчить передвижение нашего личного состава по сильно укрепленным районам."
 KUR_Insurgency_Options.4.d: "Иракская армия состоит из призывников и плохо подготовленных офицеров. Они также приходят из-за пределов Курдистана и не знают людей или местности. Это выгодно нашей группе, поскольку наше разведывательное крыло недавно начало операцию по отправке курдов для оказания переводческих услуг иракским силам в районе операций. Они выдают себя за представителей про-правительственных племён, однако операция оказалась провальной. Среди иракских войск в этом районе был офицер разведки с опытом работы в Курдистане. Он понял эту уловку и после серии тестов смог изгнать наших шпионов из подразделения, в котором они служили. Это затруднило сбор разведданных, и информация, которую они получили от лазутчиков, несомненно, предупредит другие иракские формирования о нашей тактике проникновения и проникать к ним станет труднее."
 IRQ_Insurgency_Options.1.d: "Вчера наш полк легкой пехоты одержал впечатляющую победу над бойцами ДПК. В то время как соседние войска проводили операцию зачистки, лёгкая пехота обнаружила доказательства того, что группа курдских боевиков выскользнула. Они проследили за ними до небольшого лагеря и приступили к штурму. Враг был не готов к нашей атаки, и наши люди наносили им потери и взяли пленных. Выжившие отступали в страхе. Мы получили новые разведданные и захватили оружие противника, штаб определит от кого они его получили. Этот успех заставил некоторых в высшем командовании усомниться в использовании больших соединений для зачисток и вместо этого использовать меньшие подразделения с более подготовленным персоналом."
 IRQ_Insurgency_Options.2.d: "Наша разведка определила аванпост на горном посту. Командир на земле думал, что пост выглядит маленьким, и верил, что тотальная атака обеспечит безопасность позиции и вселит страх во врага. Однако это оказалось совсем не так, так как наши люди двигались к блокпосту снизу, а противник наносил огромные потери со своих возвышенных позиций. Многие из наших солдат потеряли самообладание и начали разбегаться, когда стало ясно, что штурм провалился. Неудача демонстрирует недостаточную тактическую осведомлённость командиров и подчёркивает трудности использования больших сил призывников в таких операциях."
 IRQ_Insurgency_Options.5.d: "Вчера иракские ВВС успешно разбомбили несколько вражеских деревень, которые подозревались в том, что они являются базами. Они использовали недавно приобретенные напалмовые боеприпасы, чтобы полностью опустошить позиции противника и продемонстрировать подавляющую мощь наших сил. Из-за вражеских операций в этом районе было ясно, что деревни поддерживали и принимали бойцов на близлежащих холмах. Предыдущие попытки добраться до деревень с наземными войсками закончились неудачей. Самолет-разведчик отметил, что объекты обстрела были в значительной степени уничтожены бомбардировками, и отметил, что операция успешна. Атакующие операции противника в этом районе заметно сократились. Местные курды теперь будут менее склонны поддерживать ДПК и моральный дух среди противника был ослаблен."
 IRQ_Insurgency_Options.6.d: "Вчера иракские ВВС разбомбили вражескую позицию, на которой предположительно находились курды. Самолёты использовали недавно приобретённые напалмовые боеприпасы, чтобы полностью уничтожить позиции противника и продемонстрировать подавляющую мощь наших сил. После взрыва прибыл наземный патруль, но его встретили враждебные толпы противника. Очевидно, наши пилоты выбрали не тот объект и попали в район, контролируемый про-правительственными курдами. Эти жители деревни гневно отреагировали на наших людей и похоже мы потеряли поддержку среди местного населения, что будет препятствовать будущим операциям в этом районе."
 IRQ_Insurgency_Options.3.d: "ДПК уже давно считают наших военных некомпетентными и неспособными с точки зрения личного состава и тактики. Однако наши спецслужбы уже давно занимаются операциями по проникновению во вражеский тыл и сбору разведданных. Недавно один из наших разведчиков успешно реализовал политику присоединения про-иракских курдских сторонников к местным бандформированиям. До сих пор операция была успешной, и они обеспечивают нас разведданными о тактике, оборудовании, ситуации снабжения и даже поддержке, которую местные боевики получают от наших иностранных врагов. Более успешные операции, подобные этой, позволят нам подорвать и в конечном счете искоренить все бандформирования в Ираке."
 IRQ_Insurgency_Options.4.d: "ДПК уже давно считают наших военных некомпетентными и неспособными с точки зрения личного состава и тактики. Однако наши спецслужбы уже давно занимаются операциями по проникновению во вражеский тыл и сбору разведданных. Недавно один из наших разведчиков успешно реализовал политику присоединения про-иракских курдских сторонников к местным бандформированиям. Операция имела большой успех, однако местный военачальник решил действовать непосредственно на основе этих разведданных и начал серию успешных операций в своем районе. Хотя командир получил повышение, его вопиющее пренебрежение в попытке защитить наши позиции вызвало подозрения ДПК, и они захватили наших лазутчиков. Мы не просто потеряли ключевые источники разведданных но теперь ДПК узнают как мы проникли к ним в тыл и будущие такие же операции будет намного сложнее осуществить."
