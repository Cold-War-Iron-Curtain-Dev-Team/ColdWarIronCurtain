 Yemeni_Coup.1.d: "Борьба между фракцией Насера и королевской фракцией в Йемене привела к попытке государственного переворота со стороны военных офицеров Насера. Ночью начальник дворцовой охраны полковник Абдулла Саллал успешно организовал вооруженные формирования в столице Йемена - Сане. Они захватили радиостанцию, ключевые правительственные здания и начали вооруженное нападение на королевский дворец, чтобы захватить или убить правителя Йемена Мухаммеда аль-Бадра. После короткой, но ожесточенной борьбы королевские силы в столице потерпели поражение. Полковник Саллал объявил, что Йемен будет Республикой, возглавляемой революционной группой офицеров, которая модернизирует Йемен по линии Насера. Египет уже поддержал этот режим. Хотя новый режим объявил Аль-Бадра мертвым, до Саны дошли новости о том, что аль-Бадр собирает поддержку племён и, как говорят, движется в сторону Саудовской Аравии, чтобы мобилизовать сторонников."
 UAR_Insurgency_Options.1.d: "Вдоль одной из главных транспортных магистралей, где мы установили военный пост, наши войска заметили подозрительное перемещение людей в соседнюю деревню. Когда мы подтвердили присутствие роялистов, мы отправили туда подразделение. Они открыли шквальный огонь, чтобы шокировать противника, а затем пехота атаковала деревню. Атака была успешной, так как королевская банда боевиков была разбита. Мы захватили оружие, припасы и документы в деревне. Наша огневая мощь и опыт повысили репутацию среди местных жителей, и они будут знать, что не стоит бросать вызов нашему присутствию. Эти операции помогут нам обезопасить основные транспортные пути и подавить сопротивление."
 UAR_Insurgency_Options.2.d: "Амбициозный, но глупый офицер решил вывести своих людей за пределы нашей оперативной базы к ближайшему горному перевалу, чтобы нацелиться на предполагаемую концентрацию вражеских солдат. Он не стремился собрать больше разведданных или вызвать огонь поддержки, а вместо этого его атака привела его войска в ловушку роялистов. Вражеским силам удалось устроить засаду на наших людей, атаковать их с разных сторон и отбросить нас назад. Потери и поражения, которые понесли наши войска, подорвали наш боевой дух."
 UAR_Insurgency_Options.5.d: "Один из наших разведывательных самолетов, патрулировавших границу с Саудовской Аравией, обнаружил скопление боевиков, двигавшихся в Йемен. Затем несколько модифицированных штурмовиков обстреляли и разбомбили предполагаемые силы роялистов. Мы послали туда патруль, и они подтвердили, что операция прошла успешно, а роялисты были нейтрализованы. Наши силы в Йемене действуют далеко от нашей базы и не имеют тяжелого наземного вооружения. К счастью авиация выступила в качестве эффективной замены нашей армии."
 UAR_Insurgency_Options.6.d: "Один из наших разведывательных самолетов, патрулировавших границу с Саудовской Аравией, обнаружил небольшое скопление боевиков, базировавшихся вблизи границы. Затем несколько модифицированных штурмовиков обстреляли и разбомбили предполагаемые силы роялистов. Однако, когда мы послали патруль, чтобы исследовать это место, мы обнаружили, что это были силы наших йеменских союзников. Естественно, многие в Йемене возмущены нашей ошибкой, и пошли слухи, что мы намеренно напали на этих людей. К сожалению, это был несчастный случай, мы не знали о развертывании небольшого отряда для перехвата лазутчиков с границы. Доверие к нашей авиации было подорвано этой неудачей."
 UAR_Insurgency_Options.3.d: "Роялисты и их союзники полагаются на нашу неграмотность и подкуп, чтобы поддерживать свои силы и боевые операции. В их рядах есть люди, особенно среди племён, которых легко убедить поддержать нас. Наши разведчики успешно убедили вождя роялистского племени свести к минимуму активность роялистских повстанцев на его землях и предоставить нам разведданные о роялистских операциях. Он сделал это в обмен на финансовую помощь и строительство школ и больниц на своей земле. С этой помощью мы значительно ослабили силы врага."
 UAR_Insurgency_Options.4.d: "Роялисты и их союзники полагаются на нашу неграмотность и подкуп, чтобы поддерживать свои силы и боевые операции. В их рядах есть люди, особенно среди племён, которых легко убедить поддержать нас. Наши разведчики обратились к вождю роялистского племени, и он согласился предоставить разведданные и снизить активность роялистов в обмен на большие суммы денег. Мы регулярно платили и получали разведданные. Однако недавно мы обнаружили, что разведданные, которые он давал, часто были фальшивыми или отвлекали наши силы, поскольку роялисты проводили операции более эффективно. Очевидно, вождь племени обманул нас, собирая с нас деньги и продолжая работать против наших сил. Операция по вербовке его для сбора разведданных провалилась."
 YEM_Insurgency_Options.1.d: "Наши войска обнаружили в этом районе племя, которое сражалось с роялистами и предлагало им убежище. Один из наших отрядов выдвинулся ночью на позиции, чтобы знать где прячуться повстанцы. Утром бойцы роялистов попали в ловушку и были уничтожены устроенной нами засадой. Эта победа не только снизила активность роялистов в этом районе и подняла боевой дух, но и позволила нашим войскам разгромить племя, поскольку мы имели явные доказательства что они поддерживались роялистами."
 YEM_Insurgency_Options.2.d: "Операция, которая заключалась в уничтожении лагеря роялистов, позорно провалилась. Наши войска получили разведданные о расположенном неподалеку лагере роялистов, и мы направили туда войска для атаки. Однако командиру не удалось заручиться поддержкой местного шейха, и маршрут, который он выбрал, оказался очень труднопроходимым. Это значительно замедлило продвижение наших войск, и роялисты увидели, как мы приближаемся. Несмотря на то, что наше подразделение открыло огонь, уже было ясно, что у нас больше нет элемента внезапности, командир двинулся дальше и в определенный момент столкнулся с большой вражеской засадой. Мы понесли потери и были вынуждены отступить. Боевой дух в этом районе упал и теперь некоторые войска неохотно покидают свои аванпосты."
 YEM_Insurgency_Options.5.d: "Гордость нашей новой нации - это современные ВВС, которые мы строим. Мы приобрели самолеты у дружественных государств, которые также обучили наших пилотов, чтобы быстро поднять их в небо. В ходе недавней успешной операции нашим летчикам удалось разбомбить предполагаемую деревню роялистов. Воздушная разведка ранее установила, что в деревне была собрана артиллерия и другое тяжелое вооружение. Когда патруль отправился к их лагерю, они подтвердили уничтожение тяжелой техники и захватили документы роялистов, которые бежали после успешного удара. Операция подняла боевой дух наших Вооруженных сил."
 YEM_Insurgency_Options.6.d: "Гордость нашей новой нации - это современные ВВС, которые мы строим. Мы приобрели самолеты у дружественных государств, которые также обучили наших пилотов, чтобы быстро поднять их в небо. В недавней операции, похоже, наши быстро обученные пилоты совершили ошибку. Одна из наших баз у ключевого перекрёстка дорог попала под сильный вражеский огонь. Мы послали несколько истребителей, чтобы разбомбить и заставить атакующих роялистов отступить, однако, похоже, пилоты были не готовы к этой миссии. Ни одна из их бомб не попала в противника, и те немногие бомбардировки, которые они делали, были направлены против наших собственных сил. Роялисты уже описывают некомпетентность наших ВВС, и это событие ударило по нашему моральному духу. Мы немедленно пошлём пилотов на дополнительную подготовку."
 YEM_Insurgency_Options.3.d: "По мере того как роялисты продолжают свою кампанию, племенные вожди и старейшины, которые поддерживают их, постепенно осознают, что пока они сражаются, их монарх живет за счет их пожертвований. Они также знают о реформах и достижениях, которые мы им предлагаем, и в недавней разведывательной операции мы использовали это в своих интересах. Наши агенты убедили старшего вождя племени прекратить поддерживать повстанцев и поддержать наши усилия в обмен на помощь в целях развития для его народа. Вождь племени сообщил нам о местных жителях поддерживающих роялистов, тактике и стратегии. С этой информацией мы выбъем роялистов, присутствующих в этом районе."
 YEM_Insurgency_Options.4.d: "По мере того как роялисты продолжают свою кампанию, племенные вожди и старейшины, которые поддерживают их, постепенно осознают, что пока они сражаются, их монарх живет за счет их пожертвований. Они также знают о реформах и достижениях, которые мы им предлагаем, и в недавней разведывательной операции мы использовали это в своих интересах. Наши агенты убедили королевского советника начать посылать нам информацию о тактике, моральном состоянии и стратегии роялистов. Однако, как оказалось, советник убедил наших агентов, что они должны предать республику и присоединиться к делу роялистов. Работая сообща, они давали нам ложную информацию, ослабляя наши силы, и прежде чем их агенты окончательно сбежали, они украли много документов. Эта попытка приобрести разведывательные активы среди роялистов потерпела неудачу."
 MUK_Insurgency_Options.1.d: "Один из наших племенных союзников, знакомый с этим районом, сумел возглавить группу наших бойцов, чтобы атаковать республиканскую военную базу с неохраняемой стороны. Войска на базе предполагали, что местность настолько сурова, что никто не попытается проникнуть с этой стороны, но наши войска смогли там пройти и начали штурм базы. Мы нанесли им потери, захватили оружие, припасы, боеприпасы и быстро отступили с минимальными потерями. Республиканцы и их союзники в страхе прячутся на своих базах."
 MUK_Insurgency_Options.2.d: "Дерзкая операция обернулась поражением, когда один из наших командиров обнаружил колонну республиканских машин, движущуюся по дороге. Для нападения на колонну была устроена засада, однако командир, отвечающий за засаду, не является подготовленным офицером. Он был сыном очень уважаемого вождя племени, и его засада была ужасно сплапирована. Вражеские машины легко выдержали атаку и контратаковали. Наши войска понесли тяжелые потери, а враг наоборот почти не понёс потерь. Неудача подорвала моральный дух наших солдат, некоторые из которых теперь смотрят на своих лидеров с недоверием."
 MUK_Insurgency_Options.5.d: "Республиканцы и, без сомнения, их иностранные друзья создали аэродром вблизи ключевого региона конфликта. В течение ночи наши войска использовали маршруты, предоставленные местными союзниками, чтобы установить минометы и другие артиллерийские орудия за пределами базы. Незадолго до утра наши орудия открыли огонь, обрушив дождь из артснарядов на базу в течение нескольких минут, прежде чем мы быстро отступили. Люди сообщили, что слышали взрывы и видели поднимающийся дым, когда они уходили. В результате нападения были уничтожены несколько складов горючего и боеприпасов, а также, как мы полагаем, часть ценного оборудования, хотя республиканцы в этом не признались."
 MUK_Insurgency_Options.6.d: "Попытка перебросить несколько минометов и легкой артиллерии на республиканский военный блокпост закончилась неудачей. Судя по всему, за маршрутом наших войск следил противник, и когда минометные расчеты приблизились к своим позициям, чтобы нацелиться на блокпост, они попали в засаду республиканских сил. Мы понесли некоторые потери, но что еще более важно, республиканцы захватили несколько наших минометов. Эта неудача подорвала моральный дух среди солдат и вызвала опасения, что местное племя могло предупредить врага, что мы будем использовать этот маршрут."
 MUK_Insurgency_Options.3.d: "Несправедливый захват власти республиканцами тяжким бременем лег на плечи офицеров, которые не принимали непосредственное участия в перевороте. Хотя они служили республике, некоторые все еще серьезно относятся к своим клятвам верности монархии. Мы успешно обратились к офицеру среднего звена, и он согласился предоставить нам ценную информацию о передвижении войск, моральном состоянии и стратегии в обмен на повышение, как только мы вернемся к власти. До сих пор мы получили ценную разведданную, а также распространяем дезинформацию внутри республиканских сил, что делает операцию очень успешной."
 MUK_Insurgency_Options.4.d: "Несправедливый захват власти республиканцами тяжким бременем лег на плечи офицеров, которые не принимали непосредственного участия в перевороте. Хотя они служили республике, некоторые все еще серьезно относятся к своим клятвам верности монархии. Однако недавняя разведывательная операция по превращению республиканского офицера в информатора закончилась провалом. Наш агент успешно взял у него разведданные, однако офицер, по-видимому, уже находился под подозрением у своих командиров. Разведданные, которые мы получили, были фальшивыми, и мы действовали по ним, подтверждая их подозрения. Наш агент и офицер были задержаны, и мы опасаемся, что еще несколько информаторов могут быть перевербованы в ближайшие дни."
 NYCW.1.d: "Насеровский переворот в Сане не был полностью успешным. Полковник Абдулла Саллал и его товарищи - свободные офицеры стремились превратить Йемен в республику и покончить с монархией во время переворота. Хотя они захватили столицу, захватили другие крупные города и объявили о своей программе модернизации Йемена, им не удалось нейтрализовать йеменского монарха Мухаммеда аль-Бадра. Аль-Бадр бежал из дворца, когда Насеровские войска атаковали его, и он смог собрать большое сельское племенное население, чтобы поддержать его. Теперь, когда его друзья примкнули к нему, аль-Бадр решил начать партизанскую войну при поддержке антинасеровских организаций, чтобы свергнуть Саллала, который провозгласил себя президентом Йемена. Если свободные офицеры и президент Саллал добьются своего видения Йемена, им придется иметь дело с роялистской угрозой."
 NYCW.10.d: "\nСтратегия обеспечения безопасности границ, контроля над линиями снабжения и умиротворения роялистских племен оказалась в конечном счете успешной для республиканского правительства. Роялисты в значительной степени опирались на традиционную базу поддержки монархии - сельские племена Йемена. Охрана границ отрезала роялистов от получения помощи от других арабских монархических государств. Контроль над ключевыми транспортными путями и путями снабжения позволил республиканцам наблюдать за передвижением противника и в конечном счете подорвать способность роялистов свободно передвигаться. Наконец, программа умиротворения привела к развитию сельских районов и заставила ряд промонархических племен перейти на сторону республиканцев. В конечном счете победа подтверждает Арабскую националистическую идеологию и революционный пыл развязанный в Южной Аравии теперь имеет базу для расширения."
 NYCW.11.d: "Когда последние остатки республиканских сил сдались командирам роялистов, Мухаммед аль-Бадр вернулся в столицу страны - Сану. Он прибыл сюда впервые после республиканского переворота, который изгнал его из столицы и развязал войну. Его войска провели ряд успешных операций, чтобы окончательно разгромить свободных офицеров Йемена и восстановить его правление. Хотя республиканцы контролировали города и имели доступ к современному оружию, аль-Бадр оказался искусным в мобилизации поддержки сельских жителей для своего дела, и его знание местности и людей оказалось решающим в их кампаниях. С подавлением республиканского дела многие считают, что Насеровское влияние в Йемене может вскоре исчезнуть."
 North_Yemen_Civil_War_decisions: "Гражданская война в северном Йемене"
 North_Yemen_Civil_War_decisions_desc: "The struggle between the conservative monarchies and the revolutionary fervor of Arab nationalism has led to conflict across the region. In Yemen this tension saw Arab nationalist officers, inspired by the Free Officers of Egypt, attempt to seize control of the country and end the monarchy in a coup. The coup succeeded in declaring Yemen a republic, but the Yemeni monarch escaped to the countryside where he rallied the rural tribes and his supporters. The royalists then started a civil war and is waging a guerilla campaign against the republican government. The Yemen Civil War is a microcosm of the wider ideological conflict engulfing the Arab World.\n\nТекущий статус:\n[YEM.GetNameDef]: [?YEM.YEMEN_insurgency] победных очков\n[CSA.GetNameDef]: [?CSA.YEMEN_insurgency] победных очков\n\nЕжемесячное иностранное финансирование для [CSA.GetNameDef]: [?CSA.global_muk_funding] миллионов\n\nПримечание: первая сторона набравшая 1000 победных очков выиграет этот конфликт"
