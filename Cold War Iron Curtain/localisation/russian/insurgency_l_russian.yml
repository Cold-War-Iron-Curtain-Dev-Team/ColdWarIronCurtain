 FLN_decisions: "£FLN_Icon Фронт национального освобождения"
 FLN_decisions_desc: "£FLN_Icon ФНО (Фронт национального освобождения) это алжирская националистическая партия, которая стремится к полной независимости от Франции. ФНО является воинствующей отколовшейся группой от Движения за торжество демократии и придерживается строгого подхода к борьбе с инакомыслием и французским правлением. Хотя независимость в подавляющем большинстве поддерживается по всему Алжиру, есть значительное число алжирцев, которые выступают против этой группы.\n\n Текущая сила: [?FLN_insurgency|R]%\n Текущий штраф истощения от войны: [?War_Exhaustion|R%]\n Текущий выбранный регион: [?fln_current_country_state_decision.GetName]"
 The_Algerian_National_Liberation_Front_Uprising: "Конец Французскому Алжиру"
