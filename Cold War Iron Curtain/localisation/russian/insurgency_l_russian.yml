 UPC_insurgency_options.1.d: "Некоторые из наших спецагентов проникли в ряды СНК, выдавая себя за социалистических рабочих, у которых ранили или убили семью в рез-те французского колониального правления. Теперь они смогут получать много информации из самой организации. Мы сможем отслеживать передвижения противника и готовиться к отражению крупных атак.\nЭтот успех будет иметь глубокие позитивные последствия и защитит нашу нацию"
 UPC_insurgency_options.2.d: "Наши спецагенты пытались проникнуть в СНК, выдавая себя за социалистов, у которых есть раненые или погибшие родственники, но это привело к ужасным последствиям. СНК пожелал встретиться с оставшимися в живых членами их семей для вербовки. Легенда провалилась, и агенты были убиты или допрошены. Кроме того, некоторые агенты сами стали социалистами и дали им информацию о наших операциях по борьбе с повстанцами.\nЭта неудача - пятно на нашем послужном списке и будет иметь заметные последствия."
 UPC_insurgency_options.3.d: "Серия рейдов по городам, где расположены опорные пункты СНК, увенчалась оглушительным успехом. Тысячи вражеских повстанцев лежат мертвыми в своих оперативных центрах, а их имущество захвачено французским колониальным командованием. Мы забрали их оружие и снаряжение для себя, и все украденное у них теперь конфисковано. Эти стратегические запасы, которые они потеряли, дорого им обойдутся и негативно повлияют на будущие операции СНК.\nЭтот успех ослабит их будущие операции и снизит их свирепость."
 UPC_insurgency_options.4.d: "При попытке рейда городов, наша армия потерпела крах. Вражеские позиции были слишком укреплены и были в состоянии отразить атаки и контратаковать гарнизоныы, которые начали атаки. В настоящее время существует бесчисленное множество гарнизонов, которые полностью контролируются вражескими повстанцами и находятся вне колониального контроля. Кроме того, противник теперь контролирует больший запас оружия и оружия от разгромленных или погибших солдат.\nЭта неудача ослабит наши попытки бороться с ними в этом регионе и, вероятно, увеличит их свирепость."
 UPC_insurgency_options.5.d: "Лёгкие реактивные бомбардировщики сумели уничтожить многочисленные известные районы снабжения и подготовки солдат СНК в отдаленных районах. В дополнение к запугиванию потенциальных рекрутов, эти взрывы вызвали утечку мозгов внутри СНК, поскольку многие инструктора были убиты, что привело к нехватке способных инструкторов в рядах СНК. Сочетание эффекта утечки мозгов и эффекта устрашения, скорее всего, не позволит противнику поддерживать интенсивность своих атак.\nПротивник теперь будет менее боеспособен и будет менее агрессивен в будущем."
 UPC_insurgency_options.6.d: "Наши лёгкие реактивные самолёты нацелены на сильно защищенные районы обучения и снабжения в отдаленных районах, контролируемых СНК. Значительное присутствие ПВО противника нанесло удар по нашим самолётам и уничтожило их прежде, чем они смогли нанести удар. Потеря этих самолетов в АО позволит противнику быть более смелым и воспользоваться возможностью стать более агрессивным и начать атаки, которые обычно можно было бы предотвратить с помощью воздушной поддержки.\nЭта неудача ослабит способность армии бороться с повстанцами и предотвращать нападения, делая их более агрессивными."
 UPC_insurgency_options.0.d: "Союз народов Камеруна (СНК) опубликовал свою декларацию независимости, в Дуале и Яунде вспыхнули беспорядки в поддержку независимости. Хотя французские колониальные власти подавили беспорядки и запретили СНК, союз начал вооруженную борьбу против французов. Эта эскалация вооруженного сопротивления положила конец более чем шестилетней напряженности между СНК и французскими колониальными властями. Французские официальные лица пытались ограничить влияние СНК, подавляя голосование и отвергая попытки переговоров о мирном переходе к независимости, но эта тактика только подтолкнула СНК к войне. Что касается СНК, то, несмотря на то, что в его руководстве были люди, глубоко связанные с французской культурой и образованием, под руководством Ум Ниобе они пошли по более революционному пути. Это оттолкнуло буржуазных камерунцев, которые все еще смотрят на Францию и отвергают призыв СНК к сопротивлению. Они предпочитают добиваться независимости в рамках колониальной системы."
 UPC_insurgency_options.10.d: "\nКампания французских военных по созданию миротворческих зон и разгрому повстанческого Союза народов Камеруна (СНК) отодвинула боевые действия на Запад от Бамилеке. В первой камерунской зоне умиротворения, население было поставлено под усиленный надзор в специально отведенных лагерях. Эти усилия привели к тому, что многие лидеры СНК были схвачены и убиты, но аналогичные усилия на Западе не увенчались полным успехом. Решение Франции предоставить Камеруну независимость не положило конец конфликту, поскольку СНК продолжал сопротивляться тому, что он считал французским марионеточным государством, со своих баз на Западе. Новое правительство Камеруна продолжало полагаться на французскую военную поддержку, продолжая жестокую кампанию по борьбе с повстанцами, которая привела к опустошению многих деревень Бамилеке. Недавнее убийство еще одного высокопоставленного лидера повстанцев, по-видимому, сломило хребет сопротивления, поскольку Камерун, похоже, наконец-то победил повстанцев."
 UPC_insurgency_options.11.d: "Французы и их камерунские союзники сегодня признали независимость Бамилеке. То, что первоначально начиналось как антиколониальная борьба, превратилось в борьбу за независимость народа Бамилеке. И французы, и камерунцы проводили политику создания зон умиротворения, чтобы контролировать и искоренять мятежников. Эти усилия в районе Бамилеке привели к изоляции бойцов Союза народов Камеруна (СНК) от остальной части Камеруна, но сохранили их тесную связь с местным населением Бамилеке. Союз с боевиками и элитой Бамилеке обеспечил французам и их камерунским союзникам успех в разгроме СНК. Многие из Бамилеке, по-видимому, удовлетворены своей новой нацией и поддерживают политику реконструкции и социализма. Однако есть и такие элементы, которые считают Бамилеке законным правительством Камеруна и желают продолжить борьбу, как только страна восстановит себя."
 UPC_insurgency_options.15.d: "Многочисленные правозащитные организации и государства подали серьезные жалобы на французское правительство и его действия в камерунской войне за независимость. Французское правительство, как утверждается, уничтожало целые деревни, включая не восставших гражданских лиц.\n\nНеизвестно, сколько мирных жителей было убито в этих деревнях, поскольку записи не велись должным образом, и неизвестно, сколько бежало или избежало нападений французских колониальных сил. На данный момент существует огромное количество свидетельств против французского правительства и многие члены международного сообщества призывают к действиям против французского правительства."
 SSU_insurgency_options.1.d: "Суданское правительство и вооруженные силы разделены на враждующие группировки, которые постоянно действуют друг против друга. Одна из этих группировок вступила с нами в контакт и заявила, что в ее интересах ослабить усилия правительственных войск против наших войск. Один из наших оперативников начал обмениваться информацией с высокопоставленным суданским военным чиновником из этой группировки. Он уже обменивается разведданными о позициях войск, боевом духе и тактических подходах, и эта информация окажется бесценной для нас."
 SSU_insurgency_options.2.d: "Стремясь заполучить местного информатора в составе правительственных сил Судана, мы попросили дезертира из ВС Судана сменить свою личность и присоединиться к местному проправительственному ополчению. С его прежним знанием военного дела мы надеялись, что он быстро поднимется в ополчении и предоставит необходимую информацию для наших сил. Однако, похоже, он был идентифицирован правительственными войсками, которые сумели убедить его действовать как двойной агент. Мы поняли это после того, как наши силы в этом районе потерпели ряд неудач, и прежде чем мы смогли действовать против него, он уже привел правительственного агента, чтобы захватить оперативников, которые возглавляли эту попытку проникновения. Противник получил ценные разведданные и значительно ослабил влияние Аньяня в этом районе."
 SSU_insurgency_options.3.d: "Ночью был совершен налет на военный лагерь местного суданского правительства. Наши войска возглавлял дезертир из ВС Судана, который понимал, как будет защищен лагерь. Противник выглядел плохо подготовленным и дезорганизованным, что позволило нашим людям быстро прорвать оборону. Операция по облегчению нанесла некоторые потери противнику, многие из них просто бежали, но что более важно, мы захватили оружие и боеприпасы, которые важны для нас."
 SSU_insurgency_options.4.d: "Суданскому правительству удалось отбить атаку наших войск. Хотя у наших людей был элемент внезапности, похоже, что их заметили, когда они готовились к штурму. Это позволило их офицеру собрать небольшой отряд вражеских истребителей, и они быстро нас контратаковали. Шок от действий противника заставил наших бойцов отступать. Мы понесли потери, и некоторые наши люди попали в плен, что значительно повысило боевой дух противника в этом районе."
 SSU_insurgency_options.5.d: "В стратегически важном районе наши силы заметили, что суданские правительственные войска в течение дня охраняли контрольно-пропускной пункт на ключевом перекрестке. Жителей и туристов останавливали и проверяли в надежде воспрепятствовать дислокации наших войск. В ответ на это местный командир успешно заложил взрывчатку на этом месте ночью, когда правительственные войска прибыли утром, взрывчатка сработала, заставив правительственные войска отступить и покинуть этот район, подняв наш боевой дух и репутацию среди народа."
 SSU_insurgency_options.6.d: "Наши сторонники определили местный полицейский участок в небольшой деревне, где задерживаются некоторые из наших местных боевиков и сторонников. Мы планировали разбомбить периметр, чтобы нанести урон вражеским силам, охраняющим объект, и, возможно, позволить некоторым задержанным людям сбежать. Однако мы недооценили бдительность противника, и двое наших людей были захвачены при попытке заложить взрывчатку. Правительство устроило большое шоу из их ареста и показало местным жителям бомбы, утверждая, что мы нацелились на гражданских лиц, нанеся ущерб нашей репутации в этом районе."
 SUD_insurgency_options.1.d: "Аньянья пронизана фракционностью и дезорганизацией. Наши разведчики и военные офицеры определили регионального лидера Аньяни, который был недоволен делом и заинтересован в переходе к нам. Прежде чем мы приведем его к нам, мы используем его для сбора разведданных и информации об операциях против нас. С помощью этого успешного внедрения мы надеемся полностью искоренить и разрушить влияние повстанцев в регионе."
 SUD_insurgency_options.2.d: "Учитывая разнообразие Южного Судана, временами нашим силам было легко сплотиться и собрать местных ополченцев, чтобы поддержать наши усилия по сохранению единства Судана. Группа разведчиков попыталась захватить одного из местных ополченцев и отправить его в действующую в этом районе армию Ананьи. Он предоставит разведданные, которые позволят нашим людям уничтожить мятежников и задержать их главных сторонников. Однако эта операция оказалась неудачной, так как наш разведчик, похоже, дезертировал. Плохо спланированные нашими агентами действия привели к тому, что перебежчик опознал некоторых наших местных сторонников в деревне, и боевикам Аньяньи удалось нацелиться на этих людей и захватить оружие из местного арсенала."
 SUD_insurgency_options.3.d: "Сторонник армии Ананьи, сельчанин был выслежен местным милиционером в местном лагере. Получив эти сведения, местный военачальник повел наши войска на штурм лагеря повстанцев Аньяньи. Операция оказалась очень успешной, так как база была застана врасплох. Хотя несколько мятежников скрылись в глубине леса, мы нанесли им потери и взяли многих бойцов в плен. Что еще более важно, большая часть лагерных припасов и оружия была захвачена, что, несомненно, ослабит любые военные операции повстанцев в этом районе."
 SUD_insurgency_options.4.d: "Офицер, который, как мы подозреваем, искал быстрой славы, чтобы добиться повышения, завёл своих людей во вражескую ловушку. Южный Судан - обширная страна, и командир решил начать ночное наступление на предполагаемый лагерь Аньяньи глубоко в лугах. Люди были плохо подготовлены и легко замечены врагом. Вместо того чтобы нанести удар по вражескому лагерю, наши войска попали в засаду противника, в результате чего мы понесли потери. Что еще более унизительно, некоторые люди были даже захвачены повстанцами. Эта неудача снизила моральный дух, и региональный командующий опасается, что правительственные войска в этом районе могут быть уничтожены, если повстанцы нападут."
 SUD_insurgency_options.5.d: "ВВС восполнили недостаток современного оборудования, модифицировав имеющиеся самолеты для выполнения функций разведывательных и самолётов воздушной поддержки. Изобретательность наших сил оказалась хороша, когда наш модифицированный самолет заметил лагерь повстанцев с воздуха. Лётчик вступил в бой и поразил противника. Когда наши войска прибыли в лагерь, они обнаружили, что Аньянья оставила раненных, своё оружие, продовольствие и документы. Трусливые мятежники несомненно будут бояться воздуха а новости о нашем превосходстве в небе подняли боевой дух."
 SUD_insurgency_options.6.d: "ВВС восполнили недостаток современного оборудования, модифицировав имеющиеся самолеты для выполнения функций разведывательных и самолётов воздушной поддержки. Однако, несмотря на модификации самолётов и самоотверженность наших лётчиков, недавняя операция закончилась крупным провалом. Самолёт, выполнявший местное патрулирование, заметил группу солдат Ананьи, пилот отреагировал и сбросил на противника несколько бомб. Однако, как выяснилось, пилот сбил группу мигрирующих соплеменников, мы пока не уверены в жертвах. Этот несчастный случай не только укрепил силы противника в этом районе, но и уменьшил нашу репутацию в этом регионе."
 SSU_insurgency_options.10.d: "Независимость Судана ознаменовалась насильственным объединением Северного и Южного Судана. В администрации и армии нового государства доминировали северяне. Это привело к росту напряженности, поскольку южане вскоре почувствовали себя подавленными новым правительством. Серия мятежей и протестов на юге привела к тому, что повстанческая армия под названием Аньянья сформировалась из дезертиров и повстанческих сил. После ряда столкновений между суданским правительством и Аньяньей возник жестокий конфликт на истощение. Чтобы положить конец гражданской войне и положить конец дорогостоящему тупику, суданское правительство и повстанцы подписали соглашение в Аддис-Абебе. Автономия Южного Судана будет гарантирована в суданском конфликте, что, как мы надеемся, положит конец длительному насилию, преследующему страну."
 SSU_insurgency_options.11.d: "Независимость Судана ознаменовалась насильственным объединением Северного и Южного Судана. В администрации и армии нового государства доминировали северяне. Это привело к росту напряженности, поскольку южане вскоре почувствовали себя подавленными новым правительством. Серия мятежей и протестов на юге привела к тому, что повстанческая армия под названием Аньянья сформировалась из дезертиров и повстанческих сил. Хотя Аньянья стремилась использовать фракции внутри суданского правительства и военных, они в конечном счете потерпели неудачу. Суданские военные сумели преодолеть свои проблемы и скоординировали свои усилия против повстанцев. Вскоре силы Аньяньи были перехитрены и разбиты суданскими правительственными войсками. Когда военная победа будет обеспечена, время покажет, сможет ли Судан политически объединить страну."
 SSU_insurgency_options.12.d: "Независимость Судана ознаменовалась насильственным объединением Северного и Южного Судана. В администрации и армии нового государства доминировали северяне. Это привело к росту напряженности, поскольку южане вскоре почувствовали себя подавленными новым правительством. Серия мятежей и протестов на юге привела к тому, что повстанческая армия под названием Аньянья сформировалась из дезертиров и повстанческих сил. Аньянья смогла завербовать многочисленные группировки внутри суданских вооруженных сил для достижения ошеломляющих побед. После серии успешных кампаний по всему Южному Судану суданские вооруженные силы вскоре были изгнаны с этой земли, оставив этот район свободным для Аньяньи, чтобы установить политическое господство над населением. Обеспечив себе военную и политическую победу, суданское правительство признало Южный Судан независимым государством."
 SSU_insurgency_options.15.d: "Начиная с 1955 года, вскоре после провозглашения независимости страны, в Южном Судане постоянно происходили беспорядки, но неорганизованные. Теперь появились сообщения о том, что в Южном Судане возникли более крупные, более организованные повстанческие ячейки, называющие себя Аньянья. Аньянья стремятся к независимости от Судана и решительно выступает против центрального правительства. Разъяренная маргинализацией и навязыванием мусульманского господства немусульманским группам периферии, Ананья не успокоится до тех пор, пока Южный Судан не освободится от господства Северного большинства.\n\nСуданское правительство отрицает обвинения в маргинализации и мобилизует свои силы для подавления восстания. Уже сейчас в Южном Судане происходят бесчисленные столкновения, и другие общины меньшинств в Голубом Ниле и в Нубийских горах поддерживают повстанцевs.\n\nПо имеющимся сведениям, Аньянью активно поддерживают соседские и в подавляющем большинстве христианские государства Уганда и Эфиопия."
 Sudan_Civil_War_decisions: "Гражданская война в Судане"
 Sudan_Civil_War_decisions_desc: "Разъярённые маргинализацией и господством мусульманского большинства над немусульманским населением, Аньянья восстаёт против суданского правительства, чтобы обеспечить себе независимость. Аньянья желают независимости Южного Судана, в то время как правительство Судана желает сохранить контроль над Южным Суданом и предотвратить отделение. Эта война не только приобрела религиозный и культурный смысл, усиливая растущую напряженность между ближневосточными исламскими государствами и неисламскими государствами на Ближнем Востоке и его периферии. Из-за этих факторов война стала частью более крупного конфликта между этими странами и, таким образом, также является опосредованной войной между неарабскими государствами в регионе, такими как Израиль, Эфиопия и Республика Конго против Объединенной Арабской Республики, Ливии и других арабских государств, в то время как эти государства снабжают каждую из своих сторон, другие государства, такие как Уганда, выжидают, взвешивая свои варианты, какую сторону наиболее выгодно поддержать."
 Jebel_Adkhar_War_decisions: "£Muscat_Icon Война Джебель-Ахдар£Imamate_Oman_icon"
 Jebel_Adkhar_War_decisions_desc: "Султанат Омана был проинформирован, что автономный Имамат Оман может обладать огромными запасами, которые помогут модернизировать и преобразовать страну. Англичане стремятся изучить потенциальные резервы и обещают оказать техническую и военную помощь. Имамат ответил на это вторжение организацией партизанского сопротивления против султана. Их поддерживают антиимпериалистические арабские националисты и Саудовская Аравия, которые заинтересованы в Оманской нефти, ради собственных нефтяных интересов.\n\nТекущий статус:\n[OMA.GetNameDef]: [?OMA.OMAN_insurgency] Победных очков\n[SMI.GetNameDef]: [?SMI.OMAN_insurgency] Победных очков\n\nЕжемесячные иностранные вложения [SMI.GetNameDef]: [?SMI.global_smi_funding] миллионов\n\nПримечание: первая сторона, набравшая 1000 победных очков, выиграет этот конфликт"
 SMI_Jebel_Adkhar.1.d: "Местный шейх, преданный нашему делу, успешно сумел убедить агентов, преданных султану, что он хочет помочь им. Он успешно стал их местным информатором, но втайне он работает на нас. Враг даёт ему жизненно важную информацию, которую он передает нам, и он подорвает их силы изнутри. Эта успешная операция улучшила наше влияние в этом районе, и мы надеемся повторить этот успех в других местах."
 SMI_Jebel_Adkhar.2.d: "Местный шейх, преданный нашему делу, успешно сумел убедить агентов, преданных султану, что он хочет помочь им. Он успешно стал их местным информатором. Мы надеялись, что он поможет нам, но оказалось, что он был завербован султаном и его Британскими хозяевами. Шейх успешно помог врагу выкорчевать наших сторонников и помешать действиям наших бойцов. Наше влияние в этом районе было подорвано этой неудачной попыткой проникнуть к султану."
 SMI_Jebel_Adkhar.3.d: "Султан и его преспешники - не более чем английские марионетки. Во время недавней операции наши бойцы легко прорвались через военный блокпост и напали на солдат. Мы наносили потери, захватывали оружие, и многие из выживших просто бросали свое оружие и сбегали. С ликвидацией этого аванпоста мы смогли гораздо более свободно перемещать людей и оружие, поскольку силы султана, похоже, не хотят рисковать, возвращаясь к нему. Эта операция подняла боевой дух среди наших солдат, так как распространились слухи, что среди погибших был британский офицер."
 SMI_Jebel_Adkhar.4.d: "Наш глупый предводитель решил повести своих людей в атаку на королевский аванпост, который, как он полагал, будет слабо защищён. Однако, начав атаку, противник держался стойко и открыл ответный огонь, повергнув наших людей в смятение. Похоже, что врага поддерживали британские советники, и они быстро справились с нашей атакой. Такие неудачи только снизят наш моральный дух и заставит людей неохотно выполнять будущие операции."
 SMI_Jebel_Adkhar.5.d: "Сегодня был уничтожен вражеский броневик, проезжавший через один из наших городов. Число жертв неизвестно, но появились слухи, что среди погибших был старший офицер или даже британский солдат. Наша команда видела, как машина остановилась, и ей удалось заложить в нее взрывчатку. Операция прошла с большим успехом и показывает, что мы повысили нашу изощренность в тактике."
 SMI_Jebel_Adkhar.6.d: "В одной из наших деревень мы провалили попытку заложить взрывчатку. Солдаты были задержаны со взрывчаткой и доставлены на допрос. К несчастью для нас, эти люди предали нескольких наших местных информаторов, и они также были задержаны. Наше присутствие в деревне было в значительной степени искоренено. Наши люди не умеют проводить такие операцию и такой провал можно было предвидеть, но это отрицательно повлияло на моральный дух в этом регионе."
 OMA_Jebel_Adkhar.1.d: "Внутренние районы Омана исторически принадлежат Имамату Оман. Однако их упорство препятствовало усилиям султана обеспечивать единство и развитие этого региона. Наши разведчики выявили несколько шейхов во внутренних районах, которые были бы готовы стать нашими информаторами в обмен на финансовую помощь. В ходе недавней операции нам удалось обратить одного из этих шейхов на свою сторону, и разведданные, которые он предоставил, позволили нашим силам перехватить вражеские передвижения, сорвать их операции и выявить сторонников Имамата в этом районе. Такие успехи помогут нам сломить их бессмысленное сопротивление."
 OMA_Jebel_Adkhar.2.d: "Внутренние районы Омана исторически принадлежат Имамату Оман. Однако их упорство препятствовало усилиям султана обеспечивать единство и развитие этого региона. Наши разведчики выявили несколько шейхов во внутренних районах, которые были бы готовы стать нашими информаторами в обмен на финансовую помощь. Однако в недавней попытке убедить Шейха присоединиться к нам, наш разведчик был обманут, так как мы были дезинформированы. Из-за этого наши люди впустую потратили свои силы и это позволило врагу нанести несколько смелых ударов. Когда мы поняли, что нас обманывают, они уже нанесли нам потери, и теперь Имамат в этом районе значительно повысил свою репутацию."
 OMA_Jebel_Adkhar.3.d: "Подразделение оманских солдат, при поддержке британских военных советников, обнаружили, что несколько бойцов Имамата собираются в деревне, расположенной недалеко от места разведки. Эти бойцы, несомненно, планируют атаковать наших разведчиков, но дерзкая атака, спланированная британскими офицерами, увидев, как наши войска штурмуют город, захватили или убили повстанцев и прекратили угрозу. Эта операция подняла боевой дух наших войск и расширила сотрудничество между нами и англичанами."
 OMA_Jebel_Adkhar.4.d: "Самой большой проблемой, стоящей перед Королевской армией Омана, является ведение боевых действий против повстанцев, к которой мало кто из наших солдат и офицеров готовился. Британские советники очень помогали нам, но их не хватало, что привело к нескольким неудачам, таким как недавняя операция по штурму холмистой местности, где по нашим данным должен был быть плацдармом Имамата. Наши войска попали в засаду ещё до того, как достигли этого места, и после того, как понесли потери, многие просто отступили. Британцы оценили операцию и назвали причины неудачи - неспособность правильно спланировать её, легко обнаруживаемую из-за очевидного маршрута, и отсутствие эффективного руководства. Эта неудачная операция ослабила боевой дух наших войск."
 OMA_Jebel_Adkhar.5.d: "Королевские ВВС, базирующиеся в Омане, были направлены группой САС для нападения на предполагаемый лагерь повстанцев. После бомбардировки наши солдаты вошли в предполагаемый лагерь и обнаружили, что силы Имамата покинули этот район, понеся потери среди солдат, оружия и припасов из-за устрашающей бомбардировки. Операция, без сомнения, снизила моральный дух противников."
 OMA_Jebel_Adkhar.6.d: "Королевские ВВС были важнейшей поддержкой для наших операций во внутренних районах страны. Они выявляли вражеские скопления, уничтожали вражеские позиции и оказывали поддержку нашей армии в случае нападения. Однако в ходе недавней операции Королевские ВВС выявили концентрацию повстанческих войск и выдвинули свою бомбардировщики, которые утверждали, что уничтожили повстанцев. Однако, когда наши войска двинулись вперед, уверенные, что с угрозой покончено, они попали в засаду, понеся потери. Неудавшаяся бомбардировочная миссия понизила моральный дух и поставила вопрос о том, можем ли мы доверять заявлениям Королевских ВВС об успешном выполнении операций и разведданных."
 OMA_Jebel_Adkhar.10.d: "Имамат Оман начал свое сопротивление султану после того, как почувствовал, что их автономия была нарушена. Они также верили, что будущая нефтеразведка принесёт султану и британцам богатство этого района. Несмотря на их сопротивление и партизанскую тактику, султан Омана одержал победу и объявил, что Имамат Омана теперь интегрирован в его султанат. Успех султана был во многом обусловлен помощью, которую он получал от нефтяных компаний и британского правительства. Британские советники и Королевские ВВС проявили решительность, позволив плохо вооруженным военным султана одержать победу."
 OMA_Jebel_Adkhar.11.d: "Имамат Омана начал свое сопротивление султану после того, как почувствовал, что их автономия была нарушена. Они также верили, что будущая разведка нефти принесет султану и британцам богатство этого района. Сопротивление и партизанская тактика оказались эффективной против плохо вооруженных военных султана. Несмотря на поддержку британских советников и Королевских ВВС, султан не смог подавить мятежников. Действительно, успешное сопротивление вдохновило других арабских националистов и антиимпериалистов по всему Оману на сочувствие повстанцам. Как только силы Имамата начали действовать в пределах Султаната Оман, эти сторонники присоединились к борцам Имамата, и в конечном итоге султан был свергнут. С этой победой Имамат Оман взял под свой контроль страну, и арабы по всему региону видят в этом победу над международным империализмом."
 OMA_Jebel_Adkhar.12.d: "Султанат Омана, британское правительство и международные нефтяные компании стремились исследовать внутренние районы Омана в поисках нефти. Однако автономный Имамат Омана сопротивлялся любым усилиям, которые он воспринимал как нарушение своей автономии. При поддержке британцев султан решил послать солдат для захвата ключевых районов и районов с нефтью, чтобы определить весь потенциал региона. Это привело к первоначальному захвату султаном земель Имамата. Однако в последнее время силы Оманского султана сталкиваются с партизанскими ударами со стороны бойцов, лояльных Имамату, превращая конфликт в вооруженную борьбу за внутренние районы Омана и контроль над его природными ресурсами. Британцы поддерживают султана в то время как арабские националисты и конкурирующие арабские нефтяные государства поддерживают Имамат в его борьбе против султана."
