 UIA_insurgency_options.1.d: "Один из наших внутренних спецагентов успешно внедрился в УПА, и его информация для нас невероятна ценна. Мы получили беспрецедентное количество разведданных и сеть конфиденциальных информаторов, которые помогут нам в борьбе с УПА. Наша сеть уже обнаружила бесчисленные склады снабжения и способна провалить их атакующие операции, что серьезно ослабляет способность УПА наносить ущерб нашей стране.\nЭтот успех будет иметь глубокие позитивные последствия и защитит наш народ."
 UIA_insurgency_options.2.d: "После провала внедрения нашего спецагента в УПА, мятежники исправили уязвимых точки в своём движении, улучшила процесс проверки и стала более устойчивой в целом. Кроме того, несмотря на сопротивление нашего агента, они смогли узнать больше о нас из его слов и в ближайшие дни могут попытаться использовать эту информацию для атаки на милицию и гарнизоны. Эта неудача - пятно на нашем послужном списке и это будет иметь значительные последствия."
 UIA_insurgency_options.3.d: "Жесткое подавление деятельности УПА привело к поразительному успеху. Наши силы милиции были более чем готовы уничтожить врага и застали его врасплох. Мы захватили бесчисленное количество взрывчатки, оборудования и убили многих оперативников УПА. Кроме того, рейд предоставил нам большое количество информации, так как они не смогли уничтожить её вовремя.\nЭтот успех ослабит их деятельность и снизит их свирепость."
 UIA_insurgency_options.4.d: "УПА знала, что мы идём. Они либо эвакуировали свои объекты, оставив ловушки, готовые взорваться, когда полиция проникнет глубоко внутрь, либо устроили засады против нашей полиции. Это не только привело к серьезному провалу, но враг даже предпринял контратаки против наших полицейских участков и начал оппортунистические атаки ради захвата снаряжения, когда наши офицеры были заняты или мертвы. УПА теперь значительно лучше вооружена и способна к будущим атакам в этом районе. В настоящее время мы направили подкрепление полиции из близлежащих районов и даже назначили солдат для патрулирования, чтобы поддержать теперь ослабленные советские войска.\nЭта неудача ослабит наши попытки бороться с ними в этом районе и, вероятно, увеличит их свирепость."
 UIA_insurgency_options.5.d: "После нескольких разведывательных походов и бесчисленных часов подготовки мы, наконец, нанесли бомбовые удары по отдаленным объектам УПА. От абрикосовых ферм до домов повстанцев, возможности их ополчения были значительно ослаблены. Наши удары сровняли с землей их базы, совершавшие оппортунистические вылазки против конвоев снабжения, уничтожавшие плацдармы и выбивавщие из строя наши отдаленные базы. УПА сейчас значительно слабее и отсутствие этих удаленных объектов ослабит их сеть ячеек работающих между городами.\nПротивник теперь будет менее боеспособен и будет менее агрессивен в будущем."
 UIA_insurgency_options.6.d: "Мало того, что наши разведданные были неверными, мы уничтожили большое количество объектов-ловушек, ещё и каким-то образом они сумели уничтожить некоторое имущество нашей собственной страны. Сторожевые посты и конвои снабжения нашей армии были дезориентированы и уничтожены. Судя по тому, что говорит наш директор разведки, враг снабжал наших секретных информаторов дезинформацией. В будущем нам, возможно, придется лучше координировать свои действия с армией, чтобы гарантировать, что если мы потерпим неудачу, это не приведет к огню по своим.\nЭта неудача ослабит способность нашей армии бороться с повстанцами и предотвращать нападения, делая их более агрессивными."
 UIA_insurgency_options.10.d: "Красная армия с гордостью объявила о полном уничтожении УПА (Украинской Повстанческой Армии). После многих лет борьбы, УПА была полностью уничтожена после того, как последний удар по остаткам УПА уничтожил сбежавшего, оставшегося лидера и уничтожил то немногое имущество, которое у них осталось. Погибло так много воинствующих сторонников независимости Украины, что УПА вряд ли сможет возродиться.\nНа пресс-конференции руководитель газеты Правда с гордостью заявил, что это должно служить предостережением всем тем, кто выступает против трудящихся Советского Союза и его народа.\nУкраинские лоялисты, которые помогали нам в борьбе, а также неназванные спецагенты будут награждены за их самопожертвование и службу Советскому Союзу."
 UIA_insurgency_options.11.d: "После жестокой партизанской войны и уничтожения важнейших авиабаз Красной армии УПА (Украинская повстанческая армия) с гордостью объявила, что после многих лет боевых действий Украина свободна. УПА учредило независимое правительство и изгнало всех иностранных чиновников и лоялистские элементы из этого района. Тысячи украинских националистов выстроились на улицах, чтобы отпраздновать создание независимого государства.\nНа пресс-конференции лидеры повстанцев заявили, что это должно послужить примером для всех революционеров во всех странах, что ни одна страна не является слишком сильнейшей, чтобы противостоять ей, и что все, кто стремится к независимости от тирании своих правителей, должны встать и бороться.\nУкраинские лоялисты и внутренние спецагенты КГБ были зверски казнены, а ключевые бойцы УПА вознаграждены."
 Mau_Mau_decisions: "£Mau_Mau_Icon Кенийская армия земли и свободы"
 Mau_Mau_decisions_desc: "£Mau_Mau_Icon  Кенийская армия земли и свободы (КАЗС) или Мау-Мау - это организация Кикуйю и других мелких этнических групп, которые стали нелояльными и лишенными избирательных прав с британским колониальным белым поселением в Кении. Хотя эти группы слабо связаны друг с другом, нельзя недооценивать их мотивы и жестокое сопротивление. Убийство Чейфа Варухиу и других пробританских деятелей, а также белых поселенцев привело нашего губернатора к объявлению чрезвычайного положения в стране. Соединенное Королевство сделает все возможное для проведения эффективной и безжалостной кампании по борьбе с повстанцами.\n\n Текущая сила: [?kenyan_insurgency|R]%\n Текущий выбранный регион: [?kna_current_country_state_decision.GetName]"
 The_Kenyan_Land_and_Freedom_Army_Uprising: "Конец Колониальному пр-ву Кении"
 Liquidate_The_Kenyan_Land_and_Freedom_Army: "Конец восстанию Мау-Мау"
