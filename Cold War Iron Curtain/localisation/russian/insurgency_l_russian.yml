 operation_boost_uia_desc: "Послать взрывчатку, боеприпасы и экипировку антисоветским украинским повстанцам в надежде усилить их сопротивление. Предоставление этих поставок украинским повстанцам позволит им проводить более масштабные операции против Советского Союза и дестабилизировать его деятельность в этом районе. Это значительно усилит мятеж в этом районе и немного ослабит Советский Союз.\n\nЭто позволит увеличить численность Украинской Повстанческой Армии на 5%\nБудет стоить $2 Миллиона"
