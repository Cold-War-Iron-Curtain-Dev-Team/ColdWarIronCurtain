 ERI_Eritrean_War.1.d: "По мере того как угнетение Эритреи продолжается, многие христиане в наших землях всё чаще выбирают ту или иную сторону. Эти сторонники первоначально опасались мусульманского господства, но теперь видят, что независимая Эритрея предпочтительнее нынешнего иностранного режима. Эфиопы также отчаянно нуждаются в местной помощи и в прошлом полагались на христиан. Мы использовали это в своих интересах в недавней операции, когда несколько христианских сторонников присоединились к правительству Эфиопии в качестве вспомогательного персонала на важных административных и военных объектах. До сих пор эти люди предоставляли разведданные относительно Эфиопской стратегии, политики и передвижения войск."
 ERI_Eritrean_War.2.d: "По мере того как угнетение Эритреи продолжается, многие христиане в наших землях всё чаще выбирают ту или иную сторону. Эти сторонники первоначально опасались мусульманского господства, но теперь видят, что независимая Эритрея предпочтительнее нынешнего иностранного режима. Однако, похоже, нас обманули, так как попытка разместить несколько христианских сторонников в Эфиопии закончилась неудачей. Похоже, один из этих людей быстро сдался и начал нас дезинформировать, заставляя нас тратить ресурсы впустую или посылать людей на суицидальные задания. Как только мы разгадали его двойную игру, он повёл своих эфиопских кураторов арестовывать других наших агентов, что сделало операцию крупным провалом в сборе разведданных."
 ERI_Eritrean_War.3.d: "Когда патруль эфиопских войск прибыл в военный лагерь, наш командир успешно устроил засаду на них, атаковав с разных сторон. Эфиопские войска понесли потери, а выжившие отступили. Наши люди смогли войти и быстро захватить брошенное оружие и боеприпасы, прежде чем уйти. К тому времени, когда эфиопские военные смогли собрать достаточно большие силы, чтобы дать отпор, наши бойцы были уже дома."
 ERI_Eritrean_War.4.d: "Наш чересчур самоуверенный командир допустил роковую ошибку. В ходе недавних столкновений его люди атаковали несколько полицейских КПП, легко отгоняя войска и захватывая их оружие. Однако он решил атаковать военный блокпост, и его дерзкий прорыв оставил его людей незащищенными. Эфиопские войска не сразу покинули свои позиции, но удержали их и нанесли тяжелые потери нашим людям. Хотя командир утверждал, что нанёс противнику еще больше потерь, очевидно, что попытка атаки была ошибкой."
 ERI_Eritrean_War.5.d: "Эфиопские оккупанты нанесли сегодня серьезный удар после того, как группа наших сторонников взорвала муниципальное здание в городе. Это сооружение было построено после Эфиопской оккупации, и многие эфиопы, привлечённые к оккупации, пользовались этим зданием. Жертвы пока неизвестны, но нападение уже привело к тому, что некоторые эфиопы, проживающие в городе, начали готовиться к отъезду. Этим успехом мы показали, что наш народ не потерпит иностранной оккупации."
 ERI_Eritrean_War.6.d: "Попытка терракта на эфиопской военной базе закончились полным провалом. Наши люди думали, что смогут проникнуть на базу из плохо освещенного участка периметра, но, оказавшись внутри, они были немедленно захвачены патрулём. Мы ожидаем, что эфиопы казнят наших людей и объявят о своём успехе. Провал этой миссии ослабил моральный дух и подорвал нашу репутацию среди населения, поскольку мы утверждали, что наши люди никогда не будут захвачены в плен."
 ETH_Eritrean_War.1.d: "Исторически сложилось так, что многие эритрейские кланы долгое время соперничали друг с другом, и даже первоначальное движение за независимость было охвачено многочисленными междоусобицами. Хотя повстанцы теперь кажутся гораздо более сплочёнными, эти старые соперничества сохранились. Чтобы воспользоваться этим преимуществом, наши разведчики недавно обратились к клану, который жаждет занять более высокое положение в повстанческом движении. Они согласились предоставить нам ценные разведданные о своем сопернике и подорвать деятельность этого клана в обмен на финансы и доступ к образованию и здравоохранению за рубежом. С этой информацией мы успешно выкорчевали повстанцев из ключевого района. Клан также согласился с тем, что он будет выступать за урегулирование конфликта и сведет к минимуму повстанческую деятельность в своих районах."
 ETH_Eritrean_War.2.d: "Исторически сложилось так, что многие эритрейские кланы долгое время соперничали друг с другом, и даже первоначальное движение за независимость было охвачено многочисленными междоусобицами. Хотя повстанцы теперь кажутся гораздо более сплоченными, эти старые соперничества сохранились. Мы попытались провести операцию, в ходе которой наши разведчики обратились к клану с предложением денег и доступа к здравоохранению и образованию за рубежом. Взамен клан даст нам жизненно важную информацию о своих соперниках и гарантирует, что они уменьшат активность повстанцев по мере того, как они станут более значимыми. Однако эта недавняя операция оказалась неудачной, клан взял с нас наличные деньги, а затем захватил наших оперативников. Мы полагаем, что их усиленно допрашивают, и опасаемся, что некоторые из наших людей в лагере могут выдадать важную информацию."
 ETH_Eritrean_War.3.d: "Эритрейцы продолжают трусливо наносить удары и прятаться среди гражданского населения. Однако в недавней операции наш смелый офицер одержал победу в битве. Командир опознал деревню, в которой засели повстанцы, и в ходе авианалёта, начал артобстрел, когда пехота атаковала. Шок от нападения подавил любую попытку сопротивления, и деревня была быстро очищена от мятежников. Столкнувшись с мощью эфиопской армии, эритрейские бойцы не имеют никаких шансов."
 ETH_Eritrean_War.4.d: "Подразделение наших войск решило напасть на предполагаемый лагерь эритрейских повстанцев. Соединенные Штаты решили использовать грузовики, чтобы застать врага врасплох. Однако эритрейцы, по-видимому, были готовы к нашему подходу. Солдаты наткнулись на минное поле, и им пришлось наступать пешком. К тому времени противник был извещён о наших планах и окопался. Мы понесли тяжелые потери, даже не дойдя до лагеря. Однако когда мы пришли враг уже отступил и забрал всё своё снаряжение с собой, что сделало атаку дорогостоящей ошибкой."
 ETH_Eritrean_War.5.d: "Эритрейцы всё чаще совершают безнаказанные действия, и это идет нам на пользу. Истребитель ВВС заметил большое скопление людей и машин. Мы определили их как конвой повстанцев, и группа истребителей, модифицированных для бомбардировок, ударила по конвою. Ущерб был огромным, и когда патруль прибыл на место, они обнаружили, что мы уничтожили конвой, перевозивший солдат и тяжёлое вооружение. Перехват этого конвоя поможет нашим войскам в их усилие по вытеснению эритрейских повстанцев."
 ETH_Eritrean_War.6.d: "Армейское подразделение сообщило, что по ним открыли огонь с опорного пункта эритрейских повстанцев и обратились за поддержкой с воздуха. Мы отправили истребители, которые поразили заявленную цель, однако, похоже, бомбы упали на пустынное поле и уничтожили гражданскую сельскохозяйственную технику. Сообщений о жертвах нет, а если и есть, то вряд ли это повстанцы. Мы подозреваем, что подразделение, которое сообщило о стрельбе, возможно, услышало громкий шум с самой фермы и запаниковало, к счастью, их координаты не попали в саму ферму. Эта операция оказалась пустой тратой ресурсов и мятежники распространяли слухи о том что наши войска бомбят призраков."
 ERI_Eritrean_War.10.d: "После односторонней аннексии Эритреи Эфиопией Фронт освобождения Эритреи (ФОЭ) превратился в главную антиэфиопскую и Эритрейскую националистическую группу. Они боролись с оккупацией первоначально устаревшим оружием или самодельным оружием, но со временем приобрели более совершенное оружие и лучшую тактику. Тем не менее, несмотря на их усилия, эфиопским военным удалось не только противостоять их партизанской тактике, но и после ряда побед они в значительной степени ослабили ФОЭ. Сопротивление по всей Эритрее в значительной степени прекратилось, и уличные беспорядки тоже прекратились. Похоже, народ Эритреи признает, что Эфиопия останется на их земле, и сопротивление только влечет за собой новые наказания. Предстоит выяснить, сможет ли Эфиопия превратить военную оккупацию в надлежащий административный район. Неспособность сделать это может привести к новым беспорядкам в будущем, но на данный момент Эфиопия сокрушила ФОЭ."
 ERI_Eritrean_War.11.d: "После многих лет борьбы, сначала с итальянским колониализмом, затем с британской оккупацией и, наконец, с эфиопским владычеством, народ Эритреи наконец может стать независимым. Под руководством Фронта освобождения Эритреи (ФОЭ) эритрейский народ преодолел свои внутренние конфликты, чтобы объединиться под предлогом свержения эфиопского владычества. Это было достигнуто после ряда военных побед и признания эфиопским правительством того факта, что продолжение войны не приведет к победе. Теперь, когда Эритрея заняла свое место в качестве независимого государства, многие будут наблюдать, вернётся ли фракционность, которая поражает это движение, в полную силу."
 ERI_Eritrean_War.15.d: "Народ Эритреи долгое время возмущался тем, как Эфиопия захватила контроль над их землей после того, как итальянские колониалисты были отстранены от власти. Насаждение эфиопских обычаев и органов управления рассматривалось как фундаментальная угроза Эритрейскому образу жизни. Раннее движение за независимость Эритреи было пронизано внутренними распрями, но после аннексии эти кланы и фракции теперь должны объединиться во Фронт освобождения Эритреи (ФОЭ). Война началась с битвы при Адале. Группа эритрейских бойцов сопротивления, плохо вооруженных и без надлежащего руководства, сумела разгромить и изгнать эфиопских полицейских и военнослужащих из Адаля. Многие эритрейцы сейчас активно присоединиться к ФОЭ, но эфиопское правительство также мобилизует свои собственные силы для борьбы с беспорядками."
 Eritrean_War: "£ELF_Icon Эритрейская война за независимость £ETH_Icon"
 Eritrean_War_desc: "Эритрейцы думали, что колониализм закончится после Второй Мировой Войны и итальянского колониализма. Однако англичане взяли эту территорию под свой протекторат. После этого он был объявлен частью Эфиопии, но эфиопское правительство в конечном итоге просто аннексировало Эритрею. Это решение побудило эритрейцев, особенно их мусульманское население, присоединиться к Фронту освобождения Эритреи и оказать военное сопротивление тем, кого они считают эфиопскими оккупантами. Эфиопия рассматривает Эритрею как естественную часть своей территории и полна решимости положить конец сопротивлению.\n\nТекущий статус:\nThe [ETH.GetName]: [?ETH.ERITREA_insurgency] победных очков\n[ERI.GetName]: [?ERI.ERITREA_insurgency] победных очков\n\nЕжемесячное иностранное финансирование для [ERI.GetNameDef]: [?ERI.global_eri_funding] миллионов\nЕжемесячное иностранное финансирование для [ETH.GetNameDef]: [?ETH.global_eth_funding] миллионов\n\nПримечание: первая сторона набравшая 3000 победных очков выиграет этот конфликт"
