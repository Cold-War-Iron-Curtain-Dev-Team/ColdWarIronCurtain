 SYR_Polit_4: "Присоединиться к ОАР"
 SYR_Polit_4_desc: "Постоянные перевороты сделали страну уязвимой. Мы должны объединиться под руководством сильного лидера, который победил западные державы в Суэцком кризисе, даже если для этого придется пожертвовать своей независимостью"
 SYR_Polit_5: "Сирия прежде всего"
 SYR_Polit_5_desc: "Несмотря на предложение Насера, мы должны оставаться независимыми"
 SYR_Polit_6: "Вырваться"
 SYR_Polit_6_desc: "Понятно, панарабизм Насера на практике не сработал, Сирия лучше быть независимой"
 SYR_Polit_7: "Расширить Багдадскую железную дорогу"
 SYR_Polit_7_desc: "Мы должны улучшить нашу инфраструктуру, расширив существующую железную дорогу от Багдада до Алеппо, чтобы соединить ее также с Дамаском"
