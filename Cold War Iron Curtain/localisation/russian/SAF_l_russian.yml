 SAF_d_f_malan_desc: "Даниэль Франсуа Малан был в политике с 1914 года, когда он вступил в Nasionale Party. Для него важно, чтобы африканеры утверждали себя как единое национальное сообщество перед лицом британской культурной, политической и экономической гегемонии. Африканское единство было его доминирующей темой на протяжении всей его политической карьеры."
