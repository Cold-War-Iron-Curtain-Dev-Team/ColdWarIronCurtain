 fin_valpo: "Валпо"
 fin_valpo_desc: "Валпо была руководимой коммунистами охранной организацией с 1945 по 1948 год, когда она была очищена и заменена финской полицией безопасности. С коммунистами в правительстве, вице-президент может снова организовать её. На этот раз ей будет предоставлено больше полномочий для самостоятельной борьбы с фашистскими элементами в Финляндии."
