 wartsila: "Wärtsilä Oyj Abp"
 wartsila_desc: "Вяртсиля является крупнейшей судостроительной компанией Финляндии."
 kansainhuolto: "Kansanhuoltoministeriö"
 kansainhuolto_desc: "Kansanhuoltoministeriö (Министерство общественного благосостояния) работа не из легких. Оно существует для того, чтобы обеспечить людям средства к существованию в чрезвычайных ситуациях, контролируя экономику и нормирование. С момента своего основания в 1939 году нормирование действует и влияет на такие продукты, как сахар и кофе. Поэтому неудивительно, что они не многим нравятся. Потребители жалуются на скудные суммы, которые дают им продовольственные карточки, а производители жалуются на то, что у них слишком много берут."
 paris_paris_treaty_FIN: "Парижский мирный договор 1947 года"
 paris_paris_treaty_FIN_desc: "Состояние войны закончилось в 1947 году в Финляндии Парижским мирным договором и выходом Союзного надзорного органа, Liittoutuneiden valvontakomissio. Он утверждает, что Московское перемирие законно и подтверждает территориальные потери Финляндии. Он также вводит военные ограничения, такие как запрет всех ракет, подводных лодок и морских пехотинцев. Он ограничивает военно-воздушные силы максимумом 60 боевых самолетов и запрет на про-во бомбардировщиков. Наконец договор запрещает Финляндии владеть ядерным оружием."
 heroin_epidemic: "Героиновая эпидемия"
 heroin_epidemic_desc: "С 1930-х годов финны употребляли больше всего героина в мире. Чрезмерно употреблявшиеся в обеих войнах, многие ветераны возвращались домой с серьезной зависимостью. Даже находясь далеко от штаб-квартиры ООН в Нью-Йорке, люди задавались вопросом, как это возможно, что Финляндия - страна с населением в четыре миллиона человек - могла потреблять столько героина за один год в конце 1940-х годов, сколько другие страны потребляют в среднем за четверть века. В 1946 году, например, 99 кг героина отпускаемого по рецепту потреблялось в Финляндии. Несколько холодная реакция заключалась просто в том, что героина требовалось больше по соображениям общественного здравоохранения. Однако отношение меняется, и вскоре этой маленькой нации придется что-то делать с эпидемией, которая ее преследует."
