 artillery_equipment_1: "Буксируемая артиллерия I"
 artillery_equipment_1_short: "Артиллерия I"
 artillery_equipment_1_desc: "Артиллерия относится к оружию большого калибра, такому как пушки и гаубицы, которыми управляют расчеты, которые могут выстреливать снаряды дальше чем стрелковое оружие."
