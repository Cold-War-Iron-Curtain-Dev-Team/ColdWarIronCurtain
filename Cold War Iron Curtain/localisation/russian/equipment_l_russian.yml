  ##### EQUIPMENT DESCRIPTIONS ##### 
  
  #####INFANTRY EQUIPMENT##### 
  #PLATOON KITS 
 infantry_equipment: "Пехотное снаряжение"
 infantry_equipment_desc: "Оружие, используемое пехотными батальонами. Включает в себя винтовки, легкие пулеметы, минометы, специальное оружие, противотанковые или противовоздушные ракеты и все другое оружие, используемое пехотой, наряду с униформой, броней, орудиями и т.д.\n\n Также включает в себя комплекты ЗИП для моторизованных и механизированных батальонов, минометы, тяжелые пулеметы и т.д."
  
  #COMPANY KITS 
 support_equipment: "Дополнительное снаряжение"
 support_equipment_desc: "Дополнительное снаряжение - это абстракция для оборудования, используемого персоналом не-боевого подразделения, или в качестве основного оборудования, которое недостаточно для создания совершенно новой производственной линии. Он может включать в себя все: от полевых больниц и расходных материалов до сигнального оборудования. Сюда также могут входить улучшения для батальонов прямого боя, таких как командное оборудование с компанией связи и т. Д."
  
  #####FIRE SUPPORT###### 
  #ARTY 
 light_artillery_equipment: "Легкая буксируемая артиллерия"
 light_artillery_equipment_short: "Легкая артиллерия"
 light_artillery_equipment_desc: "Легкая артиллерия - самая легкий вид артиллерии. Легкая артиллерия наносит меньше урона, чем средняя артиллерия, и менее эффективна при наступательных маневрах, чем тяжелая артиллерия. Тем не менее, она способна реагировать на злоумышленников с его большей мобильностью и охранять большую область с его большими числами. Легкая артиллерия может включать тяжелые минометы, обычно не используемые пехотными батальонами, или легкие артиллерийские орудия."
 light_sp_artillery_equipment: "Легкая самоходная артиллерийская установка"
 light_sp_artillery_equipment_short: "Легкая САУ"
 light_sp_artillery_equipment_desc: "Легкая артиллерия - самая легкий вид артиллерии. Легкая артиллерия наносит меньше урона, чем средняя артиллерия, и менее эффективна при наступательных маневрах, чем тяжелая артиллерия. Тем не менее, она способна реагировать на злоумышленников с его большей мобильностью и охранять большую область с его большими числами. Легкая артиллерия может включать тяжелые минометы, обычно не используемые пехотными батальонами, или легкие артиллерийские орудия."
  
 artillery_equipment: "Средняя буксируемая артиллерия"
 artillery_equipment_short: "Средняя артиллерия"
 artillery_equipment_desc: "Средняя артиллерия является промежуточным звеном для артиллерии. Не очень подвижный, как легкая артиллерия, и без урона, как у тяжелой артиллерии. Средняя артиллерия служит звеном, которое может нанести больше урона, чем легкая артиллерия, но имеет лучшие защитные возможности, чем тяжелая."
 sp_artillery_equipment: "Средняя самоходная артиллерийская установка"
 sp_artillery_equipment_short: "Средняя САУ"
 sp_artillery_equipment_desc: "Средняя артиллерия является промежуточным звеном для артиллерии. Не очень подвижный, как легкая артиллерия, и без урона, как у тяжелой артиллерии. Средняя артиллерия служит звеном, которое может нанести больше урона, чем легкая артиллерия, но имеет лучшие защитные возможности, чем тяжелая."
  
 heavy_artillery_equipment: "Тяжелая буксируемая артиллерия"
 heavy_artillery_equipment_short: "Тяжелая артиллерия"
 heavy_artillery_equipment_desc: "Тяжелая артиллерия - это тяжелые артиллерийские орудия большой дальности поражения. Обычно используемая для укрепления, тяжелая артиллерия лучше всего подходит для нападения, но дает плохие защитные преимущества из-за своего небольшого количества и стационарного характера."
 heavy_sp_artillery_equipment: "Тяжелая самоходная артиллерийская установка"
 heavy_sp_artillery_equipment_short: "Тяжелая САУ"
 heavy_sp_artillery_equipment_desc: "Тяжелая артиллерия - это тяжелые артиллерийские орудия большой дальности поражения. Обычно используемая для укрепления, тяжелая артиллерия лучше всего подходит для нападения, но дает плохие защитные преимущества из-за своего небольшого количества и стационарного характера."
  
 motorized_rocket_equipment: "Реактивная система залпового огня"
 motorized_rocket_equipment_short: "Ракетная артиллерия"
 motorized_rocket_equipment_desc: "Ракетная артиллерия является артиллерийской системой, которые выпускают большое количество ракет, чтобы покрыть большую область. Эти ракеты по отдельности очень неточны но выпуская их залпом можно ими нанести огромный урон."
  
  #AA 
 auto_cannon_equipment: "Буксируемая противовоздушная автопушка"
 auto_cannon_equipment_short: "Автопушка"
 auto_cannon_equipment_desc: "Автопушки - это скорострельные орудия с большой дальностью поражения. Они имеют исключительно высокую скорострельность и эффективны против ближних воздушных целей. Автопушки могут также иметь ограниченную эффективность по отношению к наземным целям, но им не хватает эффективности для борьбы с пехотой."
 spaag_equipment: "Зенитная самоходная установка"
 spaag_equipment_short: "ЗСУ"
 spaag_equipment_desc: "Зенитная самоходная установка - это самоходные мобильные автоматические пушки, используемые для обеспечения быстрой огневой поддержки или для поражения ближних воздушных целей."
  
 sam_carrier_equipment: "Тактическая ЗРК"
 sam_carrier_equipment_short: "ЗРК"
 sam_carrier_equipment_desc: "Ракеты "земля-воздух" - это самонаводящиеся ракеты позволяющие поражать воздушные цели, хотя носители этих ракет, которые вы строите и развертываете с дивизиями, являются только носителями. Воздушные цели быстро движутся, их трудно поражать, и они находятся на большом расстоянии от наземных войск. Именно по этой причине для поражения этих целей требуются самокорректирующиеся ракеты."
  
  
  #AT 
 direct_fire_gun_equipment: "Буксируемое орудия для стрельбы прямой наводкой"
 direct_fire_gun_equipment_short: "Орудия для стрельбы прямой наводкой"
 direct_fire_gun_equipment_desc: "Орудия для стрельбы прямой наводкой в своей основной форме представляют собой танковые пушки без танков. Они обычно используются против бронированных или больших целей. Они также прилично недорогие."
 medium_tank_destroyer_equipment: "Самоходная артиллерийская установка [Tank Destroyer]"
 medium_tank_destroyer_equipment_short: "Истребитель танков"
 medium_tank_destroyer_equipment_desc: "Истребители танков - это боевые бронированные машины, вооруженные противотанковым орудием. Они существуют, как следует из названия, для уничтожения бронированных боевых машин."
  
 atgm_equipment: "Противотанковая управляемая ракета"
 atgm_equipment_short: "ПТУР"
 atgm_equipment_desc: "Противотанковые управляемые ракеты - это управляемые ракеты, используемые для уничтожения танков. ПТУР имеют очень большую дальность и точность, но уязвимы для поражения контрмерами. Заметным преимуществом ПТУР является их относительно низкая стоимость. Тем не менее, большинство современных или модернизированных танков оснащены активными контрмерами или пассивной защитой, и поэтому устаревшие ПТУРы обычно хороши только для поражения неправильно оснащенных танков или транспортных средств, не имеющих защиты от ПТУР."
 atgm_carrier_equipment: "Носитель ПТУР"
 atgm_carrier_equipment_short: "Носитель ПТУР"
 atgm_carrier_equipment_desc: "Носитель ПТУР - это транспортные средства, оснащенные противотанковыми управляемыми ракетами. Как правило, это легкие и быстрые транспортные средства, которые поражают транспортные средства, используя разрушительные ПТУР. Хотя бронированные боевые машины могут также поставляться с ПТУР, носители обычно дешевле, и дешевле оборудовать устаревшие БТР или вспомогательные транспортные средства, чтобы стать носителями ПТУР."
  
  #####COMBAT VEHICLES##### 
  #INFANTRY VEHICLES 
  
 motorized_equipment: "Автотранспорт"
 motorized_equipment_short: "Грузовики"
 motorized_equipment_desc: "Военный автотранспорт является высокопроизводительными относительно экономичными транспортными средствами, предназначенные для перевозки грузов и войск. Жизненно важен для любого военного и составляет основу логистики и транспорта пехоты."
  
 mechanized_equipment: "Легкая механизация"
 mechanized_equipment_short: "Легкая механизация"
 mechanized_equipment_desc: "Легкая механизация - это бронетранспортеры, которые обычно вооружены крупнокалиберными пулеметами или небольшими автопушками. Эти машины могут обеспечить лучшую защиту для пехоты и обеспечить небольшое количество огневой мощи самостоятельно."
  
 mechanized_heavy_equipment: "Тяжелая механизация"
 mechanized_heavy_equipment_short: "БМП"
 mechanized_heavy_equipment_desc: "БМП представляют собой гусеничные бронетранспортеры, которые обычно вооружены башнями, чтобы обеспечить огневую мощь для пехотных взводов в бою. БМП могут выступать в качестве промежуточного звена между боевыми машинами и пехотой, поскольку они обеспечивают большую огневую мощь наряду с транспортировкой войск."
  
 mechanized_marine_equipment: "Машины-амфибии"
 mechanized_marine_equipment_short: "Амфибия"
 mechanized_marine_equipment_desc: "Машины-амфибии - это десантные машины, которые могут пересекать водоемы, обеспечивая таким образом пехоту транспортом для переправ."
  
  #ARMORED COMBAT VEHICLES 
 lt_equipment: "Легкий танк / бронированная разведывательная машина"
 lt_equipment_short: "Легкий танк"
 lt_equipment_desc: "Легкие танки - это легкие бронированные боевые машины, которые выполняют комбинированную роль атаки и разведки. Легче, чем средний танк, легкие танки способны быстро реагировать на ситуации в бою и, как правило, первыми пытаются вступить в бой с передовыми отрядами.\n\n Бронированные разведывательные машины являются машинами разведки, оснащенными орудием. Они, как правило, являются амфибиями и используются воздушно-десантными частями, морскими пехотинцами или армиями с малыми бюджетами в качестве легких бронированных боевых машин в прямом бою."
  
 mbt_equipment: "Средний танк / Основной боевой танк"
 mbt_equipment_short: "ОБТ"
 mbt_equipment_desc: "Средние танки - это боевые машины со средней броней, которые выполняют роль наступательной атаки. С менее толстой броней, чем у тяжелого танка, но более быстрые, средние танки являются наиболее способной единицей для нанесения урона и нападений, так как тяжелых танков слишком мало и они слишком медленные, в то время как у легких танков нет необходимой огневой мощи.\n\n Основные боевые танки – боевые бронированные машины с огневой мощью тяжелого танка, броней сверхтяжелого танка, скоростью легкого танка и размером со средний танк. По сути, они выступают в качестве окончательной оптимизации конструкции боевой бронированной машины и обеспечивают верный источник боевой мощи."
  
 ht_equipment: "Тяжелый танк"
 ht_equipment_short: "Тяжелый танк"
 ht_equipment_desc: "Тяжелые танки выполняют роль атаки против фортификации. Тяжелые танки очень хорошо бронированы и устойчивы к большинству ПТО, которое спокойно пробивает другие танки. Тяжелые танки медленные и дорогие, но имеют большие орудия и имеют очень прочную броню, что делает их идеальными для борьбы с хорошо укрепленными позициями. Тяжелые танки в конечном итоге канут в историю, поскольку основные боевые танки будут включать огневую мощь тяжелых танков в более компактном корпусе."
  
 sht_equipment: "Сверхтяжёлый танк/Ядерный танк"
 sht_equipment_short: "Сверхтяжёлый танк"
 sht_equipment_desc: "Сверхтяжелые танки являются второй по величине бронированной боевой машиной, когда-либо разработанной и самой большой из когда-либо производимых. Сверхтяжелые танки имеют самую толстую броню, с самыми большими гусеницами, с самыми большими орудиями, и предназначены для того, чтобы служить, уничтожая вражеские укрепления и танки с помощью огневой мощи. Они редко использовались, орудие требовало прямой видимости, а тяжелая артиллерия или бомбы эффективнее уничтожали те же цели.\n\nЯдерный танк - это горячая мечта об оружии, в котором ядерные двигатели помещаются в супер тяжелые танки, обеспечивающие невероятную скорость с неограниченной автономией. Ядерные танки никогда серьезно не рассматривались за пределами закрытых экспериментов Советским Союзом и Соединенными Штатами и никогда не участвовали в боевых действиях."
  
  #####HELICOPTERS##### 
  
 cargo_helicopter_equipment: "Грузовой вертолёт"
 cargo_helicopter_equipment_short: "Грузовой вертолёт"
 cargo_helicopter_equipment_desc: "Грузовые вертолеты - это чрезвычайно тяжелые, большие вертолеты, используемые для перевозки грузов, больших транспортных средств или больших групп солдат в районы операций и обратно. Это большие цели, поэтому редко рекомендуется вводить их непосредственно в бой,лишь при необходимости."
  
 attack_helicopter_equipment: "Ударный вертолёт"
 attack_helicopter_equipment_short: "Ударный вертолёт"
 attack_helicopter_equipment_desc: "Ударные вертолеты - это невероятно мощное оружие, способное поддерживать войска будучи в воздухе над вражескими подразделениями и наносить прямой ракетный удар или атаку ПТУРом. В них трудно попасть, и большинство армий обеспечивают даже устаревшие ударные вертолеты современными контрмерами, поскольку они относительно недороги."
  
 scout_helicopter_equipment: "Разведывательный/Легкий ударный вертолет"
 scout_helicopter_equipment_short: "Разведывательный вертолет"
 scout_helicopter_equipment_desc: "Вертолеты-разведчики - это вертолеты, используемые для разведки, они чрезвычайно мобильныи чрезвычайно полезны против повстанцев.\n\nЛегкие ударные вертолеты обладают значительно меньшей огневой мощью и живучестью, чем ударные вертолеты, но тем не менее являются также довольно опасными. Они обычно поставляются с одним набором ракетных блоков, орудий или ПТУР, чтобы выполнять роль огневой поддержки танков или пехоты."
  
 utility_helicopter_equipment: "Многоцелевой вертолёт"
 utility_helicopter_equipment_short: "Многоцелевой вертолёт"
 utility_helicopter_equipment_desc: "Многоцелевые вертолеты - это универсальные вертолеты, которые обеспечивают транспортировку войск в районах боевых действий, оказывают поддержку и могут перевозить грузы. Также они также могут быть оснащены оружием для обеспечения боевой поддержки пехоты, которую они перевозят"
  
 naval_helicopter_equipment_short: "Вертолет для борьбы с подводными лодками"
 naval_helicopter_equipment_desc: "Вертолеты для борьбы с подводными лодками - это вертолеты, оснащенные противолодочными ракетами. Они очень полезны в морской войне и имеют решающее значение для борьбы с военно-морскими целями."
  
  #####DRONES##### 
  
 cas_uav_equipment: "Боевой беспилотный летательный аппарат"
 cas_uav_equipment_short: "БПЛА"
 cas_uav_equipment_desc: "БПЛА - это беспилотники, используемые для дистанционных ударов по вражеским частям и структурам. Они относительно дешевы по сравнению с пилотируемыми самолетами и могут производиться в большом количестве. Однако они гораздо более уязвимы для, чем пилотируемые самолеты, и не могут быть приспособлены для противодействия всем формам помех, поскольку им необходимо установить удаленное соединение. Хотя это может нарушить операции, особенно для более ранних БПЛА, которые могут даже разбиться, более поздние БПЛА имеют ограниченную автономную способность и могут либо пытаться атаковать или атаковать цели, ранее отмеченные наземными войсками, либо возвращаться на базу."
 naval_uav_equipment: "Морской боевой беспилотный летательный аппарат"
 naval_uav_equipment_short: "Морской БПЛА"
 naval_uav_equipment_desc: "Морские беспилотные летательные аппараты - это беспилотники, используемые для морской войны, и они чрезвычайно полезны для разведки или доставки легких ПКР противнику."
  
  #####LIGHT PLANES##### 
  
 fighter_equipment: "Многоцелевой истребитель"
 fighter_equipment_short: "Многоцелевой истребитель"
 fighter_equipment_desc: "Многоцелевые истребители - это универсальные самолеты, которые могут выполнять различные цели.Они являются высокоэффективными самолетами и могут защищать себя в воздухе, а также наносить урон наземным целям."
 cv_fighter_equipment: "Многоцелевой палубный истребитель"
 cv_fighter_equipment_short: "Многоцелевой палубный истребитель"
 cv_fighter_equipment_desc: "Многоцелевые истребители - это универсальные самолеты, которые могут выполнять различные цели.Они являются высокоэффективными самолетами и могут защищать себя в воздухе, а также наносить урон наземным целям."
 cv_fighter: "Многоцелевой палубный истребитель"
  
 heavy_fighter_equipment: "Перехватчик"
 heavy_fighter_equipment_short: "Перехватчик"
 heavy_fighter_equipment_desc: "Перехватчики являются чисто истребителями, которые специализируются на уничтожении воздушных целей противника. Они узкоспециализированы и проворны и являются лучшим вариантом для уничтожения бомбардировщиков или самолетов противника и срыва миссий."
 heavy_fighter: "Перехватчик"
 heavy_fighter_highmach_equipment: "Сверхзвуковой перехватчик"
 heavy_fighter_highmach_equipment_short: "Сверхзвуковой перехватчик"
 heavy_fighter_highmach_equipment_desc: "Сверхзвуковые перехватчики - это чрезвычайно скоростные самолеты-перехватчики, у которых высокий расход топлива и мощные двигатели для достижения невероятно высоких скоростей. Благодаря своим ЛТХ они могут быстро поражать вражеские воздушные цели с очень большого расстояния."
  
 CAS_equipment: "Штурмовик"
 CAS_equipment_short: "Штурмовик"
 CAS_equipment_desc: "Штурмовиком являются самолеты, которые специализируются на атаке наземных подразделений. Они несут большю полезную нагрузку и наносят большрй урон наземным подразделениям противника. Они также могут прорваться через вражеские укрепления для поддержки наступательных операций."
 cas: "Штурмовик"
 cv_CAS_equipment: "Палубный штурмовик"
 cv_CAS_equipment_short: "Палубный штурмовик"
 cv_CAS_equipment_desc: "Палубным штурмовиком являются самолеты, которые специализируются на атаке наземных подразделений. Палубный штурмовик несет противокорабельные ракеты и может поддерживать морские сражения и наносить большой урон вражескому флоту, если они не готовы."
 cv_cas: "Палубный штурмовик"
  
 jump_jet_equipment: "СВВП"
 jump_jet_equipment_short: "Самолёт вертикального взлёта и посадки"
 jump_jet_equipment_desc: "СВВП (Самолёт вертикального взлёта и посадки) - это реактивные самолеты, способные выполнять вертикальный взлет/посадку на месте. Они, как правило, высокотехнологичны и очень полезны в качестве морских самолетов, так как многие из них могут быть установлены на верхней палубе и взлетать вертикально, вместо того, чтобы взлетать с ВПП авианосца."
 jump_jet: "СВВП"
  
 jet_light_equipment: "Лёгкий реактивный самолёт"
 jet_light_equipment_short: "Лёгкий реактивный самолёт"
 jet_light_equipment_desc: "Легкие самолеты могут быть оснащены ракетами класса "воздух-воздух" ближнего радиуса действия и иметь полезную нагрузку для легких ударов или выполнять функции разведки. Это очень эффективный самолет, но очень хрупкий. Легкие реактивные самолеты, как правило, применимы только против повстанцев."
 jet_light: "Лёгкий реактивный самолёт"
  
 scout_plane_equipment: "Самолёт-разведчик"
 scout_plane_equipment_short: "Самолёт-разведчик"
 scout_plane_equipment_desc: "Самолеты-разведчики - это самолеты, специализирующиеся на разведке / разведке. Вместо того, чтобы сражаться, они собирают информацию о вражеских подразделениях."
 scout_plane: "Самолёт-разведчик"
  
  #####HEAVY PLANES##### 
  
 nav_bomber_equipment: "Морской бомбардировщик"
 nav_bomber_equipment_short: "Морской бомбардировщик"
 nav_bomber_equipment_desc: "Морские бомбардировщики - это самолеты, которые специализируются на бомбардировках вражеских кораблей с исключительно больших высот. Они могут наносить удары по портам или бомбить флот в море, нанося серьезный урон кораблям противника."
 nav_bomber: "Морской бомбардировщик"
  
 tac_bomber_equipment: "Многоцелевой истребитель/тактический бомбардировщик"
 tac_bomber_equipment_short: "Тактический бомбардировщик"
 tac_bomber_equipment_desc: "Тактические бомбардировщики - это легкие бомбардировщики, которые могут выполнять боевые задачи и атаковать стратегические военные цели. ."
 tac_bomber: "Тактический бомбардировщик"
 stealth_tactical_bomber_equipment: "Незаметный многоцелевой истребитель/тактический бомбардировщик"
 stealth_tactical_bomber_equipment_short: "Незаметный тактический бомбардировщик"
 stealth_tactical_bomber_equipment_desc: "Незаметный многоцелевой истребитель - это маневренный легкий самолет, использующий передовые технологии малозаметности и способный выполнять боевые задачи и атаковать стратегические военные цели. Они могут доставлять тяжелые грузы и выходить за линии огня ПВО раньше, чем штурмовики."
 stealth_tactical_bomber: "Незаметный многоцелевой истребитель/тактический бомбардировщик"
  
 transport_plane_equipment: "Транспортный самолет"
 transport_plane_equipment_short: "Транспортный самолет"
 transport_plane_equipment_desc: "Транспортные самолеты - это самолеты снабжения, которые могут поставлять припасы военным и имеют жизненно важное значение для линий снабжения любой армии. Они также могут сбрасывать десант для атаки в тылу врага."
 transport_plane: "Транспортный самолет"
  
 strat_bomber_equipment: "Стратегический бомбардировщик"
 strat_bomber_equipment_short: "Стратегический бомбардировщик"
 strat_bomber_equipment_desc: "Стратегические бомбардировщики — это сверхтяжелые самолеты, которые летают на больших высотах и несут чрезвычайно тяжелую полезную нагрузку для уничтожения стратегических целей. Они более чем способны уничтожить огромное количество заводов, бункеров, электростанций или других стратегических объектов."
 strat_bomber: "Стратегический бомбардировщик"
 mach2stratbomber_equipment: "Высокоскоростной стратегический бомбардировщик"
 mach2stratbomber_equipment_short: "Высокоскоростной стратегический бомбардировщик"
 mach2stratbomber_equipment_desc: "Стратегические бомбардировщики — это сверхтяжелые самолеты, которые летают на больших высотах и несут чрезвычайно тяжелую полезную нагрузку для уничтожения стратегических целей. Они более чем способны уничтожить огромное количество заводов, бункеров, электростанций и других стратегических целей.\nВысокоскоростные стратегические бомбардировщики двигаются со скоростью, намного превышающей скорость звука, и могут атаковать цели, находящиеся дальше. Эта невероятная сверхзвуковая скорость позволяет им избегать конфликтов."
 mach2stratbomber: "Высокоскоростной стратегический бомбардировщик"
 mach3stratbomber_equipment: "Сверхзвуковой стратегический бомбардировщик"
 mach3stratbomber_equipment_short: "Сверхзвуковой стратегический бомбардировщик"
 mach3stratbomber_equipment_desc: "Стратегические бомбардировщики — это сверхтяжелые самолеты, которые летают на больших высотах и несут чрезвычайно тяжелую полезную нагрузку для уничтожения стратегических целей. Они более чем способны уничтожить огромное количество заводов, бункеров, электростанций и других стратегических целей.\nСверхзвуковые стратегические бомбардировщики — это самые быстрые бомбардировщики, которые технологически возможны, жертвуя всем, что они могут, чтобы двигаться на экстремальных скоростях. Это позволяет им быть безумно живучими и проводить точечные атаки в любом месте на вражеской территории, сея хаос и уклоняясь от противовоздушной обороны."
 mach3stratbomber: "Сверхзвуковой стратегический бомбардировщик"
 nuclearstratbomber_equipment: "Ядерный стратегический бомбардировщик"
 nuclearstratbomber_equipment_short: "Ядерный стратегический бомбардировщик"
 nuclearstratbomber_equipment_desc: "Стратегические бомбардировщики — это сверхтяжелые самолеты, которые летают на больших высотах и несут чрезвычайно тяжелую полезную нагрузку для уничтожения стратегических целей. Они более чем способны уничтожить огромное количество заводов, бункеров, электростанций и других стратегических целей.\nЯдерные стратегические бомбардировщики — это уникальные самолеты, оснащенные ядерным реактором и электрическими двигателями. Ядерные стратегические бомбардировщики обладают практически неограниченной автономией и могут атаковать любую точку мира, не приземляясь. Пока они несут ядерное топливо и экипаж жив, эти самолеты могут оставаться в воздухе."
 nuclearstratbomber: "Ядерный стратегический бомбардировщик"
  
