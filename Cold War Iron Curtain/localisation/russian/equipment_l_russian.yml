 screen_hull_medium_desc: "Фрегаты - это эскортные корабли среднего размера. Они отлично подходят для патрулирования, тесной поддержки на берегу и они очень быстры. Они имеют легкое вооружение, и поэтому торпеды часто являются их наиболее важным преиуществом."
  
 destroyer: "Эсминец [Фронтовой]"
 screen_hull_heavy: "Эсминец [Фронтовой]"
 destroyer_short: "Эсминец"
 screen_hull_heavy_short: "Эсминец"
 destroyer_desc: "Эсминцы - это корабли, которые отлично подходят для защиты других кораблей от подводных лодок и являются основным средним звеном с точки зрения современной огневой мощи, особенно потому, что они являются наименее дорогими кораблями, которые могут разместить значительное количество ПКР и имеют довольно большой корпус."
 screen_hull_heavy_desc: "Эсминцы - это корабли, которые отлично подходят для защиты других кораблей от подводных лодок и являются основным средним звеном с точки зрения современной огневой мощи, особенно потому, что они являются наименее дорогими кораблями, которые могут разместить значительное количество ПКР и имеют довольно большой корпус."
  
 cruiser: "Крейсер [Линейный]"
 battle_hull_light: "Авианосцы"
