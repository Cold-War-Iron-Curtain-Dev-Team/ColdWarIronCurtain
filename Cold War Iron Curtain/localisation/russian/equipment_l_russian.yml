 medium_tank_destroyer_equipment_1: "Истребитель танков I"
 medium_tank_destroyer_equipment_1_short: "Истребитель танков I"
 medium_tank_destroyer_equipment_1_desc: "Истребители танков - это боевые бронированные машины, вооруженные пушкой прямой наводки, специализирующейся на противотанковых средствах. Они существуют, как следует из названия, для искоренения боевых бронированных машин. Мобильные артиллерийские системы - это орудия прямой наводки, слишком тяжелые для БРЭМ, установленные на шасси, слишком легкие для ОБТ. Мобильные артиллерийские системы обычно выполняют непосредственную боевую роль, хотя редко поражают танки напрямую."
