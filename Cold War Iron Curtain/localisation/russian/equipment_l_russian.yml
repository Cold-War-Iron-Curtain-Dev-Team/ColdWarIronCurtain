 heavy_artillery_equipment_1: "Тяжелая артиллерия I"
 heavy_artillery_equipment_1_short: "Тяжелая артиллерия I"
 heavy_artillery_equipment_1_desc: "Тяжелая артиллерия — это тяжелое артиллерийское орудие дальнего действия, способное вести огонь тяжелыми снарядами на очень большое расстояние. Обычно используемая против укреплений, тяжелая артиллерия лучше всего подходит для нападения, но дает плохие оборонительные преимущества из-за своей малочисленности и стационарного характера."
