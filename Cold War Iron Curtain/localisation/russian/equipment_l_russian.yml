 sp_artillery_equipment_1: "Самоходная артиллерийская установка I"
 sp_artillery_equipment_1_short: "САУ I"
 sp_artillery_equipment_1_desc: "Средняя артиллерия - это стандартная золотая середина для артиллерии. Не очень мобильна, как легкая артиллерия, и не наносит урон, как тяжелая артиллерия. Средняя артиллерия служит промежуточным звеном, которое может нанести больше урона, чем легкая артиллерия, но имеет лучшие защитные возможности, чем тяжелая."
