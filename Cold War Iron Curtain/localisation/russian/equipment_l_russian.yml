 heavy_sp_artillery_equipment_4_desc: "Тяжелая артиллерия — это тяжелое артиллерийское орудие дальнего действия, способное вести огонь тяжелыми снарядами на очень большое расстояние. Обычно используемая против укреплений, тяжелая артиллерия лучше всего подходит для нападения, но дает плохие оборонительные преимущества из-за своей малочисленности и стационарного характера."
 heavy_sp_artillery_equipment_5: "Тяжелая самоходная артиллерийская установка V"
 heavy_sp_artillery_equipment_5_short: "Тяжелая САУ V"
 heavy_sp_artillery_equipment_5_desc: "Тяжелая артиллерия — это тяжелое артиллерийское орудие дальнего действия, способное вести огонь тяжелыми снарядами на очень большое расстояние. Обычно используемая против укреплений, тяжелая артиллерия лучше всего подходит для нападения, но дает плохие оборонительные преимущества из-за своей малочисленности и стационарного характера."
  
 direct_fire_gun_equipment_1: "Орудие стрельбы прямой наводкой I"
 direct_fire_gun_equipment_1_short: "Орудие стрельбы прямой наводкой I"
 direct_fire_gun_equipment_1_desc: "Орудия прямой наводки в своей основной форме представляют собой танковые пушки без танков. Они обычно используются против бронированных или крупных целей при размещении на стационарной площадке. Они также прилично недороги."
