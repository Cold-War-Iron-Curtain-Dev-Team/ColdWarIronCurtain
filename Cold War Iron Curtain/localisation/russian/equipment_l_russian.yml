  #####INFANTRY 
  
 infantry_equipment_0: "Пехотное вооружение штурмовых отрядов времен ВМВ"
 infantry_equipment_0_short: "Снаряжение спецназа I"
 infantry_equipment_0_desc: "Снаряжение, состоящее из пехотного снаряжения и огнестрельного оружия времен ВМВ. Состоящие в основном из винтовок, автоматов, легких пулеметов и другого оружия времен ВМВ."
 infantry_equipment_1: "Пехотное вооружение штурмовых отрядов после ВМВ"
 infantry_equipment_1_short: "Снаряжение спецназа II"
 infantry_equipment_1_desc: "Улучшенное снаряжение, состоящее из огнестрельного оружия, которое было разработано в доктрине поздней и послевоенной истории. Почти все включенное оружие является автоматическим, а его конструкции созданы на основе уроков, извлеченных из войны. Значительно дороже, чем снаряжение периода ВМВ, но гораздо лучше."
 infantry_equipment_2: "Пехотное вооружение штурмовых отрядов атомной эры"
 infantry_equipment_2_short: "Снаряжение спецназа III"
 infantry_equipment_2_desc: "Пехотная техника и огнестрельное оружие, разработанные в соответствии с доктринами атомной войны. Многие из этих комплектов поставляются с гораздо более высоким уровнем огневой мощи, чем огнестрельное оружие предыдущего поколения."
 infantry_equipment_3: "Оптимизированное огнестрельное оружие и пехотное снаряжение"
 infantry_equipment_3_short: "Снаряжение спецназа IV"
 infantry_equipment_3_desc: "Оптимизированное оружие, созданное на основе оружия и техники атомной эры, которое решает многие проблемы предыдущего поколения."
 infantry_equipment_4: "Современное огнестрельное оружие и пехотное снаряжение"
 infantry_equipment_4_short: "Снаряжение спецназа V"
 infantry_equipment_4_desc: "Современное огнестрельное оружие и пехотное снаряжение. Эти комплекты вооружения созданы для высокопрофессиональной армии."
  
  ###SP FORCES### 
  
 special_operations: "Специальные операции"
 special_operations_short: "Специальные операции"
 special_operations_desc: "Операции, проводимые специально назначенными, обученными и оснащенными силами, часто с использованием нетрадиционных методов."
  
  ###DESERT 
  
 desert_warfare_1: "Тактика войны в пустыне"
 desert_warfare_1_short: "Тактика войны в пустыне"
 desert_warfare_1_desc: "Пустыня — суровая среда, требующая специальной тактики и подготовки, чтобы войска оставались эффективными. Требует обновленной тактики."
 desert_warfare_2: "Снаряжение для войны в пустыне"
 desert_warfare_2_short: "Снаряжение для войны в пустыне"
 desert_warfare_2_desc: "Специализированное боевое снаряжение в пустыне позволит войскам оставаться более эффективными в суровых условиях."
 infantry_desert_warfare_2_tt: "§GВключает возможность "Запроса пустынного снаряжения""!"
 desert_warfare_3: "Современная тактика войны в пустыне"
 desert_warfare_3_short: "Современная тактика войны в пустыне"
 desert_warfare_3_desc: "Просто выжить в пустыне недостаточно. Войска должны поддерживать боевую готовность и мобильность в условиях пустыни. Требуется модернизированная тактика."
 desert_warfare_4: "Современное снаряжение для войны в пустыне"
 desert_warfare_4_short: "Современное снаряжение для войны в пустыне"
 desert_warfare_4_desc: "Обновленная и модернизированная фильтрация воды, камуфляж, маскировка и специализированное инженерное оборудование повысят эффективность войск, ведущих боевые действия в условиях пустыни."
  
 ABILITY_REQUISITION_HEAT_GEAR: "Требовать пустынную форму"
 ABILITY_REQUISITION_HEAT_GEAR_DESC: "Ощутимо ускоряет адаптацию к жаркому климату"
  
 ABILITY_REQUISITION_WINTER_GEAR: "Требовать зимнюю форму"
 ABILITY_REQUISITION_WINTER_GEAR_DESC: "Ощутимо ускоряет адаптацию к холодному климату"
  
  ###LAND 
  
 army_sp_forces_1: "Армейский спецназ"
 army_sp_forces_1_short: "Армейский спецназ"
 army_sp_forces_1_desc: "Позволяет обучать подразделения армейского спецназа для поддержки регулярных или специализированных войск в бою."
 army_sp_forces_2: "Специальные разведывательные операции"
 army_sp_forces_2_short: "СР операции"
 army_sp_forces_2_desc: "Специализированные разведывательные подразделения создаются для получения разведывательной информации из тыла противника."
 army_sp_forces_3: "Ударная поддержка"
 army_sp_forces_3_short: "Ударная поддержка"
 army_sp_forces_3_desc: "Силы специального назначения получают лучшее оборудование для связи, чтобы координировать артиллерийские удары или огонь из тыла врага."
 army_sp_forces_4: "Передовые специальные разведывательные операции"
 army_sp_forces_4_short: "Передовые СР операции"
 army_sp_forces_4_desc: "Силы специального назначения получают более совершенное оборудование связи, чтобы координировать артиллерийские и воздушные удары или совместные обстрелы из тыла врага."
 army_sp_forces_5: "Внешняя внутренняя защита"
 army_sp_forces_5_short: "FDI"
 army_sp_forces_5_desc: "Чтобы улучшить подготовку, операторы спецподразделений из разных родов войск или даже из государственных учреждений тренируются добывать, чтобы иметь возможность действовать вместе более эффективно."
 army_sp_forces_6: "Разведывательная поддержка"
 army_sp_forces_6_short: "Разведывательная поддержка"
 army_sp_forces_6_desc: "Операторы спецподразделений встроены в регулярные разведывательные отделы, чтобы улучшить поток информации, поступающей от тайных сил, действующих в тылу."
 army_sp_forces_7: "Контртеррористические тактики"
 army_sp_forces_7_short: "Контртеррористические тактики"
 army_sp_forces_7_desc: "Подразделения военного спецназа обучаются контртеррористическим операциям, чтобы более эффективно действовать на родной земле."
  
  ###MOUNTAIN 
  
 mountain_warfare_1: "Горная война"
 mountain_warfare_1_short: "Горная война"
 mountain_warfare_1_desc: "Позволяет обучать специализированную горную пехоту боевым действиям в гористой местности."
 mountain_warfare_2: "Снаряжение/тактики горной войны"
 mountain_warfare_2_short: "Снаряжение/тактики горной войны"
 mountain_warfare_2_desc: "Позволяет обучать подразделения горных рейнджеров для поддержки регулярных или специализированных войск в бою."
 mountain_warfare_3: "Снаряжение/тактики арктической войны"
 mountain_warfare_3_short: "Снаряжение/тактики арктической войны"
 mountain_warfare_3_desc: "Для более эффективной работы в экстремально холодных погодных условиях закупается дополнительное боевое оборудование в Арктике."
 infantry_mountain_warfare_3_tt: "§GОткрывает возможность "Запросить снаряжение для зимней войны"!"
 mountain_warfare_4: "Передовое снаряжение/тактики арктической войны"
 mountain_warfare_4_short: "Передовое снаряжение/тактики арктической войны"
 mountain_warfare_4_desc: "Введена концепция горных лидеров и более совершенное снаряжение, чтобы войска могли более эффективно работать в горных условиях."
 mountain_warfare_5: "Продвинутое снаряжение/тактики арктической войны"
 mountain_warfare_5_short: "Продвинутое снаряжение/тактики арктической войны"
 mountain_warfare_5_desc: "Современное боевое оборудование в Арктике закупается для более эффективной работы в экстремально холодных погодных условиях."
 mountain_warfare_6: "Современное снаряжение/тактики арктической войны"
 mountain_warfare_6_short: "Современное снаряжение/тактики арктической войны"
 mountain_warfare_6_desc: "Концепция горных лидеров расширяется, и войскам вводится более современное снаряжение для более эффективной работы в суровых горных или холодных погодных условиях."
  
  
  ###AMPHIBIOUS WARFARE 
  
 amphibious_warfare_1: "Морской десант"
 amphibious_warfare_1_short: "Морской десант"
 amphibious_warfare_1_desc: "Позволяет обучать специализированную морскую пехоту или пехоту, специально обученную для использования десантных операций."
 amphibious_warfare_2: "Приморский бой"
 amphibious_warfare_2_short: "Приморский бой"
 amphibious_warfare_2_desc: "Подразделения морской пехоты получают дополнительный опыт в боях вблизи берега."
 amphibious_warfare_3: "Глубокая пробивка"
 amphibious_warfare_3_short: "Глубокая пробивка"
 amphibious_warfare_3_desc: "На амфибиях устанавливаются дополнительные возможности преодоления глубокого брода."
 amphibious_warfare_4: "Тактики крупномасштабного вторжения"
 amphibious_warfare_4_short: "Тактики крупномасштабного вторжения"
 amphibious_warfare_4_desc: "Специализированные штабные офицеры морской пехоты включаются в состав десантных кораблей ВМФ для координации высадки войск и их потребностей в снабжении."
 amphibious_warfare_4_tt: "Включает возможность §Yпланирования морских высадок§!"
 amphibious_warfare_5: "Современная глубокая пробивка"
 amphibious_warfare_5_short: "Современная глубокая пробивка"
 amphibious_warfare_5_desc: "На амфибиях устанавливается более эффективное оборудование для преодоления бродов, позволяющее работать даже в более влажных условиях."
 amphibious_warfare_6: "Современные тактики крупномасштабного вторжения"
 amphibious_warfare_6_short: "Современные тактики крупномасштабного вторжения"
 amphibious_warfare_6_desc: "В состав десантной оперативной группы включены специализированные штабные офицеры, чтобы в дальнейшем координировать поток снабжения на плацдарм, используя, по возможности, не только десантные средства, но и вертолеты."
  
 IC_ABILITY_FASTER_NAVAL_PLANNING: "Планирования морских высадок"
 IC_ABILITY_FASTER_NAVAL_PLANNING_DESC: "Быстрое планирование морского вторжения"
  
  ###LC 
  
 landing_craft_1: "Штурмовой десантный корабль типа LCA"
 landing_craft_1_short: "LCA"
 landing_craft_1_desc: "Базовый десантно-штурмовой корабль, используемый для высадки войск, которые смогут создать плацдарм."
 landing_craft_2: "Десантные суда типа LCI"
 landing_craft_2_short: "LCI"
 landing_craft_2_desc: "Более мощные пехотные десантные корабли, используемые для высадки войск, которые смогут обеспечить плацдарм."
 landing_craft_3: "Десантные катера типа LCM"
 landing_craft_3_short: "LCM"
 landing_craft_3_desc: "Большой десантный корабль, способный высаживать не только десант, но и бронетехнику, обеспечивающий большую огневую мощь для захвата плацдарма."
 landing_craft_4: "Десантный корабль на воздушной подушке I"
 landing_craft_4_short: "ДКВП I"
 landing_craft_4_desc: "Базовые десантные корабли на воздушной подушке часто быстрее и способны преодолевать многие препятствия, которые не могут классические десантные корабли."
 landing_craft_5: "Десантный корабль на воздушной подушке II"
 landing_craft_5_short: "ДКВП II"
 landing_craft_5_desc: "Более крупные и быстрые десантные корабли на воздушной подушке, способные высадить больше войск, техники и припасов в посадочной площадке."
 landing_craft_6: "Десантный корабль на воздушной подушке III"
 landing_craft_6_short: "ДКВП III"
 landing_craft_6_desc: "Еще более крупные десантные корабли на воздушной подушке, способные высаживать на плацдарм не только войска, технику и припасы, но и бронетехнику."
  
  ##FROGMEN 
  
 combat_divers_1: "Скрытные тактики десантной инфильтрации"
 combat_divers_1_short: "Скрытные тактики десантной инфильтрации"
 combat_divers_1_desc: "Позволяет обучать подразделения морского спецназа для поддержки регулярных или специализированных войск в бою."
 combat_divers_2: "Команды подводных диверсантов"
 combat_divers_2_short: "UDT"
 combat_divers_2_desc: "Военно-морской спецназ расширяет свою подготовку за счет подводного сноса объектов, создавая специализированные группы водолазов, способных проводить разведывательные операции или устранять препятствия и взрывчатые вещества перед высадкой морского десанта."
 combat_divers_3: "Тактики десантной разведки"
 combat_divers_3_short: "Тактики десантной разведки"
 combat_divers_3_desc: "Усовершенствованные разведывательные операции водолазов перед высадкой морского десанта позволяют войскам должным образом подготовиться к высадке противника и найти слабые места в обороне."
 combat_divers_4: "Продвинутые тактики десантной разведки"
 combat_divers_4_short: "Продвинутые тактики десантной разведки"
 combat_divers_4_desc: "Используя более эффективное оборудование, такое как ребризеры и небольшие плоты, разведывательные подразделения и водолазы могут подобраться даже близко к силам противника, не будучи обнаруженными."
 combat_divers_5: "Подводное огнестрельное оружие"
 combat_divers_5_short: "Подводное огнестрельное оружие"
 combat_divers_5_desc: "Подводное огнестрельное оружие позволяет водолазам защищать себя в случае, если их укрытие раскрыто или противоборствующие силы используют собственных водолазов для противодействия разведывательным операциям."
 combat_divers_6: "Современные тактики десантной инфильтрации"
 combat_divers_6_short: "Современные тактики десантной инфильтрации"
 combat_divers_6_desc: "Водолазы не только попытаются провести разведывательную операцию, но также попытаются проникнуть на слабые или незащищенные позиции в районе высадки, чтобы создать замешательство в рядах противника до того, как произойдет основная высадка."
  
  ##AIRBORNE 
  
 airborne_operations_1: "Воздушно-десантные операции"
 airborne_operations_1_short: "Воздушно-десантные операции"
 airborne_operations_1_desc: "Позволяет обучать специализированную воздушно-десантную или парашютную пехоту для воздушно-десантных операций."
 airborne_operations_2: "Тактика защиты плацдарма приземления"
 airborne_operations_2_short: "Тактика защиты плацдарма приземления"
 airborne_operations_2_desc: "Воздушный плацдарм, мало чем отличающийся от наземного плацдарма, представляет собой передовую позицию, которая ранее была обеспечена воздушно-десантными войсками и позволяет подкреплениям, технике и транспортным средствам высаживаться без сопротивления."
 airborne_operations_3: "Доставка техники авиацией"
 airborne_operations_3_short: "Доставка техники авиацией"
 airborne_operations_3_desc: "Позволяет использовать бортовые ББМ. Боевые бронированные машины, перевозимые по воздуху, могут повысить огневую мощь легких пехотных воздушно-десантных сил."
 airborne_operations_4: "Высотные прыжки с парашютом I"
 airborne_operations_4_short: "Высотные прыжки с парашютом"
 airborne_operations_4_desc: "Тактика использования парашюта с большой высоты и низким открытием позволяет небольшим подразделениям спецназа проникать в зону приземления с меньшими шансами на обнаружение."
 airborne_operations_5: "Высотные прыжки с парашютом II"
 airborne_operations_5_short: "Высотные прыжки с парашютом"
 airborne_operations_5_desc: "Тактика высотного парашюта с высоким открытием позволяет отряду хорошо обученных спецназовцев высадиться в районе и, используя свои парашюты, приблизиться к району, где должна состояться операция."
 airborne_operations_6: "Современные тактики вертикального охвата"
 airborne_operations_6_short: "Современные тактики вертикального охвата"
 airborne_operations_6_desc: "Обновленная тактика для современной эпохи позволяет воздушно-десантным, а также аэромобильным силам окружать противника с помощью транспортных самолетов или вертолетов."
  
  ##AIR ASSAULT 
  
 air_assault_operations_1: "Воздушно-десантные операции"
 air_assault_operations_1_short: "Воздушно-десантные операции"
 air_assault_operations_1_desc: "Позволяет обучать специализированные аэромобильные пехотные подразделения, использующие вертолеты для передвижения по полю боя."
 air_assault_operations_2: "Тактика вертикального охвата"
 air_assault_operations_2_short: "Тактика вертикального охвата"
 air_assault_operations_2_desc: "Обновленная тактика вертикального охвата с вертолета позволяет аеромобильной пехоте быстро перемещаться вокруг сил противника, чтобы потенциально окружить их."
 air_assault_operations_3: "Продвинутые воздушно-десантные операции"
 air_assault_operations_3_short: "Продвинутые воздушно-десантные операции"
 air_assault_operations_3_desc: "Еще более совершенная тактика вертикального охвата с вертолетов позволяет аэромобильной пехоте быстро перемещаться вокруг группировки противника, а за счет передового авиационного перевооружения и точек дозаправки дольше оставаться в бою."
  
  ##COVERT 
  
 cover_air_operations_1: "Тактика скрытной глубокой разведки"
 cover_air_operations_1_short: "Тактика скрытной глубокой разведки"
 cover_air_operations_1_desc: "Позволяет обучать подразделения специального назначения ВДВ для поддержки регулярных или специализированных войск в бою."
 cover_air_operations_2: "Передовой контроль над воздушным движением"
 cover_air_operations_2_short: "FAC"
 cover_air_operations_2_desc: "Передовые авиадиспетчеры, состоящие из операторов спецназа, встроены в разведывательные подразделения для обеспечения прямой связи с самолетами непосредственной поддержки."
 cover_air_operations_3: "Поисково-спасательный отряд"
 cover_air_operations_3_short: "CSAR"
 cover_air_operations_3_desc: "Операторы боевых поисково-спасательных служб обучены выполнять поиск пропавших без вести или раненых с высоким риском, часто под огнем противника."
 cover_air_operations_4: "Современная тактика дальнего десантирования"
 cover_air_operations_4_short: "Современная тактика дальнего десантирования"
 cover_air_operations_4_desc: "Группы вертолетов продолжат летать в тыл врага, чтобы ввести подразделения, рейнджеров или специальные силы, которые могут нанести ущерб в тылу врага."
 cover_air_operations_5: "Современный поисково-спасательный отряд"
 cover_air_operations_5_short: "CSAR II"
 cover_air_operations_5_desc: "Операторы боевых поисково-спасательных служб обучены выполнять поиск пропавших без вести или раненых с высоким риском, часто под огнем противника."
  
  ##Tactics-Training 
  
 sf_tactics_training_1: "Передовая подготовка и тактика"
 sf_tactics_training_1_short: "Передовая подготовка и тактика"
 sf_tactics_training_1_desc: "Интенсивные программы обучения, направленные на развитие личных навыков и упражнений."
 sf_tactics_training_2: "Обучение нетрадиционным военным операциям"
 sf_tactics_training_2_short: "Обучение нетрадиционным военным операциям"
 sf_tactics_training_2_desc: "Силы нетрадиционных боевых действий проходят дополнительную подготовку по планированию и проведению операции."
 sf_tactics_training_3: "Усовершенствованная боевая подготовка спецназа для боев в городе"
 sf_tactics_training_3_short: "Тренировки SFAUC"
 sf_tactics_training_3_desc: "Силы специального назначения проходят продвинутую городскую боевую подготовку, совершенствуя свои навыки в городских условиях."
  
 b_commando_1: "Тренировка для улучшения навыков спецназа"
 b_commando_1_short: "Тренировка для улучшения навыков спецназа"
 b_commando_1_desc: "Дополнительные обучающие программы вводятся для того, чтобы улучшить базовые навыки оператора спецподразделения, когда речь идет о тактике или выживании."
 b_commando_2: "Продвинутая тренировка выживания, уклонения, сопротивления и побега"
 b_commando_2_short: "Продвинутая тренировка SERE"
 b_commando_2_desc: "Спецназовцы проходят углубленную подготовку SERE, чтобы повысить собственные шансы в случае окружения."
 b_commando_3: "Тренировка для улучшения навыков спецназа II"
 b_commando_3_short: "Тренировка для улучшения навыков спецназа II"
 b_commando_3_desc: "Активизируются программы по улучшению тактики, личных навыков и тренировок, а также по выживанию, чтобы повысить летальность подразделений спецназа."
 b_commando_4: "Подготовка технологического шпионажа"
 b_commando_4_short: "Подготовка технологического шпионажа"
 b_commando_4_desc: "Подразделения спецназа обучены собирать информацию цифровой криминалистики и защищать ноутбуки, компьютеры и другие устройства, чтобы увеличить количество разведывательных данных, которые они могут получить от противоборствующих сил."
  
 b_commando_1_tt: "§RВзаимоисключающий§! с §YРасширенная программа набора спецназа§!"
 b_commando_3_tt: "§RВзаимоисключающий§! с §YРасширенная программа набора спецназа§!"
  
 i_infantry_1: "Расширенная программа набора спецназа"
 i_infantry_1_short: "Расширенная программа набора спецназа"
 i_infantry_1_desc: "Запускаются дополнительные кампании по набору, чтобы найти более способных людей для пополнения рядов элитных сил."
 i_infantry_2: "Тренировка выживанию, уклонению, сопротивлению и побегу"
 i_infantry_2_short: "Тренировка SERE"
 i_infantry_2_desc: "Выживание, уклонение, сопротивление и побег (SERE) — это учебная программа, наиболее известная под своим военным аббревиатурой. Она готовит военнослужащих к выживанию и возвращению с честью в сценариях выживания."
 i_infantry_3: "Обширная программа набора спецназа"
 i_infantry_3_short: "Обширная программа набора спецназа"
 i_infantry_3_desc: "Большие усилия прилагаются к кампаниям по поиску дополнительного состава для пополнения рядов элитных сил."
 i_infantry_4: "Сокращенная программа обучения спецназа"
 i_infantry_4_short: "Сокращенная программа обучения спецназа"
 i_infantry_4_desc: "Программы спецназа укорачиваются, чтобы получить более способный состав в полевых условиях."
  
 i_infantry_1_tt: "§RВзаимоисключающий§! с §YТренировка для улучшения навыков спецназа§!"
 i_infantry_3_tt: "§RВзаимоисключающий§! с §YТренировка для улучшения навыков спецназа§!"
  
 tank_armor_upgrade: "Броня"
 tank_armor_upgrade_desc: "Если броня выше, чем могут пробить ваши враги – это огромное преимущество для ваших дивизий. Но, вероятно, броня замедлит вас."
 tank_gun_upgrade: "Главное орудие"
 tank_gun_upgrade_desc: "Важно иметь орудие, которое без проблем пробивает броню противника."
 tank_aa_upgrade: "Противовоздушное вооружение"
 tank_aa_upgrade_desc: "Убедитесь, что наше пво способно сбивать новейшие самолеты противника."
 tank_at_upgrade: "Противотанковое вооружение"
 tank_at_upgrade_desc: "Убедитесь, что наше противотанковое вооружение может пробить новейшие танки противника."
 tank_art_upgrade: "Артиллерийское вооружение"
 tank_art_upgrade_desc: "Убедитесь, что наша самоходная артиллерия имеет высокую огневую мощь, которая уничтожит любых врагов без брони."
 tank_reliability_upgrade: "Надежность"
 tank_reliability_upgrade_desc: "Повышение надежности приводит к уменьшению количества поломанных танков, которые вам необходимо заменить."
 tank_engine_upgrade: "Двигатель"
 tank_engine_upgrade_desc: "Большая мобильность дает тактические и стратегические преимущества."
 ship_gun_upgrade: "Орудие"
 ship_gun_upgrade_desc: "Важно иметь орудие, которое без проблем пробивает броню противника."
 ship_torpedo_upgrade: "Торпеда"
 ship_torpedo_upgrade_desc: "Торпеда - весомый аргумент, запускаемый малыми кораблями, находящимися на расстоянии. С высокой вероятностью могут нанести множество урона."
 ship_armor_upgrade: "Броня"
 ship_armor_upgrade_desc: "Больше брони для защиты вашего корабля спасут от огня противника"
 carrier_armor_upgrade: "Броня"
 carrier_armor_upgrade_desc: "Больше брони для защиты вашего корабля спасут от огня противника"
 ship_engine_upgrade: "Двигатель"
 ship_engine_upgrade_desc: "Корабль с более мощным двигателем может быстрее сближаться с своим противникам в бою"
 ship_reliability_upgrade: "Надежность"
 ship_reliability_upgrade_desc: "Корабль с высокой надежностью менее подвержен критическим ударам, которые могут нанести огромный ущерб кораблю без хорошо продуманной конструкции."
 ship_anti_air_upgrade: "ПВО"
 ship_anti_air_upgrade_desc: "Чем больше ПВО, тем больше самолетов противника сбито!"
 ship_ASW_upgrade: "Противосубмаринная война"
 ship_ASW_upgrade_desc: "Оружие против подводных лодок важно для обнаружения и уничтожения подводных лодок."
 destroyer_engine_upgrade: "Двигатель"
 destroyer_engine_upgrade_desc: "Корабль с более мощным двигателем может быстрее сближаться с своим противникам в бою"
 sub_engine_upgrade: "Двигатель"
 sub_engine_upgrade_desc: "Корабль с более мощным двигателем может быстрее сближаться с своим противникам в бою"
 sub_stealth_upgrade: "Скрытность"
 sub_stealth_upgrade_desc: "Самая большая сила подводных лодок - это их способность оставаться незамеченными и наносить удары только тогда, когда у них есть преимущество."
 sub_torpedo_upgrade: "Торпеда"
 sub_torpedo_upgrade_desc: "Торпеда - весомый аргумент, запускаемый малыми кораблями, находящимися на расстоянии. С высокой вероятностью могут нанести множество урона."
 ship_deckspace_upgrade: "Палубное пространство"
 ship_deckspace_upgrade_desc: "Больше места для перевозки и запуска самолетов с авианосца"
 plane_gun_upgrade: "Оружие"
 plane_gun_upgrade_desc: "Лучшее оружие, чтобы сражаться с другими самолетами"
 cv_plane_gun_upgrade: "Оружие"
 cv_plane_gun_upgrade_desc: "Лучшее оружие, чтобы сражаться с другими самолетами"
 plane_engine_upgrade: "Двигатель"
 plane_engine_upgrade_desc: "Более высокая скорость дает самолету преимущество в позиционировании и выборе цели. Важно для перехватчиков."
 plane_range_upgrade: "Дальность"
 plane_range_upgrade_desc: "Самолет с большей дальностью полета может достичь более стратегических областей для бомбардировки"
 cv_plane_range_upgrade: "Дальность"
 cv_plane_range_upgrade_desc: "Самолет с большей дальностью полета может достичь больше стратегических областей для бомбардировки"
 plane_reliability_upgrade: "Надежность"
 plane_reliability_upgrade_desc: "Самолет с низкой надежностью может попасть в аварию во время полета"
 plane_naval_upgrade: "Атака"
 plane_naval_upgrade_desc: "Больше несущей способности противокорабельного оружия."
 cv_plane_naval_upgrade: "Атака"
 cv_plane_naval_upgrade_desc: "Больше несущей способности противокорабельного оружия."
 plane_bomb_upgrade: "Бомбардировка"
 plane_bomb_upgrade_desc: "Большой бомбовый отсек для доставки большей полезной нагрузки."
 plane_tac_bomb_upgrade: "Бомбардировка"
 plane_tac_bomb_upgrade_desc: "Большой бомбовый отсек для доставки большей полезной нагрузки."
 plane_cas_upgrade: "Атака"
 plane_cas_upgrade_desc: "Улучшает атаку по наземным целям"
