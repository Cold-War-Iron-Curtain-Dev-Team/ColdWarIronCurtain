 light_artillery_equipment_1: "Легкая артиллерия I"
 light_artillery_equipment_1_short: "Легкая артиллерия I"
 light_artillery_equipment_1_desc: "Легкая артиллерия - самый легкий вид артиллерии. Легкая артиллерия наносит меньше урона, чем средняя артиллерия, и менее эффективна при наступательных маневрах, чем тяжелая артиллерия. Тем не менее, она легкая и способен реагировать на нападающих своей большей мобильностью и защищать большую территорию своим большим количеством. Легкая артиллерия может включать тяжелые минометы, обычно не используемые пехотными батальонами или легкими артиллерийскими орудиями."
