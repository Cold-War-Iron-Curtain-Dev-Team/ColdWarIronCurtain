 rocket_artillery_equipment_1: "Буксируемая ракетная артиллерия"
 rocket_artillery_equipment_1_short: "Ракетная артиллерия"
 rocket_artillery_equipment_1_desc: "Ракетная артиллерия менее точна и имеет более низкую устойчивую скорострельность, чем батареи традиционных артиллерийских орудий. Тем не менее, они имеют возможность одновременно поражать цель несколькими ракетами с разрушительным эффектом."
  
 motorized_rocket_equipment_1: "Реактивная система залпового огня I"
 motorized_rocket_equipment_1_short: "РСЗО I"
 motorized_rocket_equipment_1_desc: "Реактивная артиллерия включает в себя артиллерийские системы, которые стреляют большими залпами ракет, чтобы поразить цель. Эти ракеты по отдельности очень неточны, но, стреляя залпами, они могут полностью накрыть область и нанести серьезный урон."
