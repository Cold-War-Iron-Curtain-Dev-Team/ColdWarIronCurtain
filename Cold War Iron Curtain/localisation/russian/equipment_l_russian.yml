 battleship: "Линкор [Линейный]"
 battleship_short: "Линкор"
 battleship_desc: "Battleships are very large battle line ships that are extremely heavily armed and pack concentrated firepower. Battleships weren't seriously considered for production throughout the cold war because they are excessively large and concentrate far too much firepower and resources on a singular target."
 battle_hull_heavy: "Линкор [Линейный]"
 battle_hull_heavy_short: "Линкор"
 battle_hull_heavy_desc: "Battleships are very large battle line ships that are extremely heavily armed and pack concentrated firepower. Battleships weren't seriously considered for production throughout the cold war because they are excessively large and concentrate far too much firepower and resources on a singular target."
  
 carrier: "Авианосец"
 carrier_short: "Авианосец"
 carrier_desc: "Авианосцы - это плавающие аэродромы. Они несут многочисленные самолеты, которые могут быть использованы для военно-морского или наземного боя и чрезвычайно полезны в качестве силовой проекции или наступательного оружия."
 carrier_hull: "Авианосец"
 carrier_hull_short: "Авианосец"
 carrier_hull_desc: "Авианосцы - это плавающие аэродромы. Они несут многочисленные самолеты, которые могут быть использованы для военно-морского или наземного боя и чрезвычайно полезны в качестве силовой проекции или наступательного оружия."
  
 helicarrier: "Легкий/вертоленосец"
 helicarrier_short: "Легкий/вертоленосец"
 helicarrier_desc: "Легкие авианосцы - это плавающие аэродромы. Они могут быть более многочисленными, чем крупные авианосцы, и часто используются меньшими державами.\nВертоленосцы - это авианосцы, несущие вертолеты. Они несут большое их количество, которые могут служить различным целям в зависимости от типа вертолетов."
 carrier_hull_light: "Легкий/вертленосец"
 carrier_hull_light_short: "Легкий/вертоленосец"
 carrier_hull_light_desc: "Легкие авианосцы - это плавающие аэродромы. Они могут быть более многочисленными, чем крупные авианосцы, и часто используются меньшими державами.\nВертоленосцы - это авианосцы, несущие вертолеты. Они несут большое их количество, которые могут служить различным целям в зависимости от типа вертолетов."
  
 supercarrier: "Тяжелый авианосец"
 supercarrier_short: "Тяжелый авианосец"
 supercarrier_desc: "Тяжелые авианосцы - это массивные авианосцы. Они несут большое количество самолетов, которые могут быть использованы для морского или наземного боя и играют важную роль в защитной проекции сверхдержавы. Кроме того, они могут быть приспособлены, чтобы стать плавающими ракетными шахтами."
 carrier_hull_large: "Тяжелый авианосец"
 carrier_hull_large_short: "Тяжелый авианосец"
 carrier_hull_large_desc: "Тяжелые авианосцы - это массивные авианосцы. Они несут большое количество самолетов, которые могут быть использованы для морского или наземного боя и играют важную роль в защитной проекции сверхдержавы. Кроме того, они могут быть приспособлены, чтобы стать плавающими ракетными шахтами"
  
 attack_submarine: "Многоцелевая подводная лодка"
 attack_submarine_short: "Многоцелевая ПЛ"
 attack_submarine_desc: "Многоцелевая подводная лодка - это подводные лодки, которые специализируются на морской войне. Они могут быть охотниками глубин океанов."
  
 ballistic_submarine: "Баллистическая подводная лодка"
 ballistic_submarine_short: "Баллистическая ПЛ"
 ballistic_submarine_desc: "Баллистические подводные лодки - это подводные лодки, которые несут ракеты. Они могут использовать их против морских или наземных целей и оказаться козырем в рукаве во время ядерной войны."
  
 sub_hull_small_single: "Малая подводная лодка"
 sub_hull_large_single: "Средняя подводная лодка"
 sub_hull_large_double: "Огромная подводная лодка"
 sub_hull_small_single_short: "Малая ПЛ"
 sub_hull_large_single_short: "Средняя ПЛ"
 sub_hull_large_double_short: "Огромная ПЛ"
 sub_hull_small_single_desc: "Маленькие подводные лодки могут выполнять только атакующие роли."
 sub_hull_large_single_desc: "Средние подводные лодки могут выполнять ударные, баллистические или иные удары."
 sub_hull_large_double_desc: "Огромные подводные лодки могут нести большое количество баллистических ракет и почти всегда являются атомными подводными лодками."
  
