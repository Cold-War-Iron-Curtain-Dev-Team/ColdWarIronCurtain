 screen_hull_light_desc: "Корветы - это легкие эскортные корабли, которые выполняют множество узкоспециализированных задач. Они часто оснащены очень легким оружием и чрезвычайно маневренны."
  
 frigate: "Фрегат [Фронтовой]"
 screen_hull_medium: "Линейные корабли"
 frigate_short: "Фрегат"
 screen_hull_medium_short: "Фрегат"
