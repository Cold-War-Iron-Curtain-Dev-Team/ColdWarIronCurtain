  ##### MISSILES ##### 
  
 cruisemissile_equipment: "Крылатая ракета"
 cruisemissile_equipment_short: "Крылатая ракета"
 cruisemissile_equipment_desc: "Крылатые ракеты — это ракеты средней дальности, которые могут преодолевать большие расстояния. Крылатые ракеты могут поражать стратегические или боевые цели.\nСейчас я объясню, как они находят свои цели.\n\nРакета всегда знает, где она находится. Она знает это, потому что знает, где ее нет. Вычитая, где она есть, из того, где ее нет, из того, где она есть (в зависимости от того, что больше), она получает разницу или отклонение. Подсистема наведения использует отклонения для генерации корректирующих команд для перевода ракеты из положения, в котором она находится, в положение, в котором ее нет, и при достижении положения, в котором ее не было, теперь она находится. Следовательно, положение, в котором оно есть, теперь является положением, которого оно не было, и отсюда следует, что положение, в котором оно было, теперь является положением, которого оно не имеет. В том случае, если положение, в котором она находится, не совпадает с положением, в котором она не была, система приобрела изменение, которое представляет собой разницу между тем, где находится ракета, и тем, где ее не было. Если отклонение считается значительным фактором, оно также может быть скорректировано GEA. Однако ракета также должна знать, где она находится. Сценарий компьютера наведения ракеты работает следующим образом. Поскольку вариант изменил часть информации, полученной ракетой, неизвестно, где именно она находится. Однако он уверен, где его нет, в пределах разумного, и он знает, где он был. Теперь он вычитает, где он должен быть, из того, где его не было, или наоборот, и, дифференцируя это из алгебраической суммы того, где он не должен быть и где он был, он может получить отклонение и его вариацию. , что называется ошибкой"
  
 slbm_equipment: "Баллистические ракета подводных лодок"
 slbm_equipment_short: "БРПЛ"
 slbm_equipment_desc: "БРПЛ - это баллистическое ядерное оружие, запускаемое с подводных лодок, это очень опасное оружие, которое может нанести огромный ущерб и имеет дополнительное преимущество, заключающееся в том, что противнику трудно его отслеживать или определять местонахождение."
  
 srbm_equipment: "Баллистическая ракета малой дальности"
 srbm_equipment_short: "БРМД"
 srbm_equipment_desc: "БРМД - это тактическое баллистическое ядерное оружие малой дальности наземного базирования, которое может быть запущено с наземных носителей. Они чрезвычайно разрушительны и могут использоваться в битвах, чтобы поддержать их и уничтожить всю общую территорию вражеских войск."
  
 irbm_equipment: "Баллистическая ракета средней дальности"
 irbm_equipment_short: "БРСД"
 irbm_equipment_desc: "БРСД представляют собой тактические ядерные баллистические ракеты наземного базирования средней дальности, предназначенные для поражения тактических или стратегических целей. Они очень точны и ведут огонь с довольно больших расстояний, чтобы уничтожить вражеские укрепления или позиции вблизи линии фронта."
  
 icbm_equipment: "Межконтинентальная баллистическая ракета"
 icbm_equipment_short: "МБР"
 icbm_equipment_desc: "Межконтинентальные баллистические ракеты — это стратегические баллистические ядерные ракеты дальнего действия, которые превосходно наносят огромные повреждения стратегическим целям и облучают районы. Межконтинентальные баллистические ракеты легко могут быть разрушительными для любого или любого объекта, на который они нацеливаются."
  
  ##### FEVER DREAMS ##### 
  
 coup_equipment_desc: "Читер. Не могу поверить, что ты сделал это. Когда ты скачал мод, ты выглядел как приличный человек. Какое плохое суждение о тебе я сделал."
  
 aerosub_equipment: "Летающая подводная лодка"
 aerosub_equipment_short: "Летающая подводная лодка"
 aerosub_equipment_desc: "Летающая подводная лодка представляет собой военно-морской бомбардировщик-амфибию, способный погружаться под воду, чтобы уклоняться от зенитного огня противника и повышать скрытность. Используя воздушное или морское прикрытие, летающая подводная лодка более защищена при значительных затратах и компромиссе с характеристиками."
  
 suicide_craft_equipment: "Самолет-снаряд"
 suicide_craft_equipment_short: "Самолет-снаряд"
 suicide_craft_equipment_desc: "Вооруженные тяжелой взрывчаткой и дверью, которая не может открыться после того, как она заперта, самолеты-смертники являются чрезвычайно опасными самолетами, в которых самолет летит прямо на вражескую позицию и взрывается при ударе. Крылатые ракеты совершенно устарели и бесполезны, если только армия, использующая их, не имеет минимальных ресурсов и доступа к взрывчатке, старым самолетам и фанатикам."
  
  #Trains 
 train_equipment_short: "Поезд времен ВМВ"
 train_equipment_: "Поезд времен Второй Мировой Войны"
 train_equipment_1_short: "Поезд времен ВМВ"
 train_equipment_1: "Поезд времен Второй Мировой Войны"
 train_equipment_1_desc: "Паровоз оставался на сегодняшний день самым распространенным типом локомотивов вплоть до окончания Второй мировой войны. Паровозы менее эффективны, чем современные дизельные и электрические локомотивы, и для их эксплуатации и обслуживания требуется значительно больше рабочей силы, но они умудряются оставаться актуальными почти 100 лет и по сей день."
  
 train_equipment_2_short: "Улучшенный поезд"
 train_equipment_2: "Улучшенный дизель-электрический поезд"
 train_equipment_2_desc: "Дизель-электрические локомотивы" - это тепловозы с электрической передачей. Дизельный двигатель приводит в действие либо электрический генератор постоянного тока, либо электрический генератор-выпрямитель переменного тока, выход которого обеспечивает питание тяговых двигателей, приводящих локомотив в движение. Между дизелем и колесами нет механической связи. Подавляющее большинство тепловозов сегодня являются дизель-электрическими."
  
 train_equipment_3_short: "Современный поезд"
 train_equipment_3: "Современный газотурбинный поезд"
 train_equipment_3_desc: "Газотурбинный локомотив - это локомотив с двигателем внутреннего сгорания, состоящий из газовой турбины. Двигатели внутреннего сгорания требуют наличия трансмиссии для приведения колес в движение. Двигатель должен продолжать работать, когда локомотив остановлен. Газотурбинные механические локомотивы используют механическую передачу для передачи мощности газовых турбин на колеса."
  
