l_russian:
 submarine: "Подводная лодка"
 submarine_desc: "Подводные лодки используют скрытность и мощные торпеды для уничтожения вражеских конвоев."
 light_cruiser: "Легкий крейсер"
 light_cruiser_desc: "Легкий крейсер. Его основная задача - защищать крупные корабли от вражеских легких кораблей, но также может выпускать мощные торпеды, которые могут повредить крупные корабли."
 battle_cruiser: "Линейный крейсер"
 battle_cruiser_desc: "Крупный боевой корабль, часто с наступательными способностями, близкими к линкорам, но с более слабой броней, необходимой для более высокой скорости."
 convoy: "Конвой"
 convoy_desc: "Конвои, используемые для международной торговли товарами и ресурсами. Также используется для переправки войск и для выполнения морских вторжений."
 sh_battleship: "Сверхтяжёлый линкор"
 sh_battleship_desc: "Самый большой  боевой корабль с самыми крупными стволами и самой крепкой броней, которую можно найти. Такое дорогое вложение заслуживает надлежащей поддержки меньших судов эскорта."
 light_airframe: "Легкий планер"
 light_airframe_desc: "Планер - основа самолета"
 medium_airframe: "Средний планер"
 medium_airframe_desc: "Планер - основа самолета"
 heavy_airframe: "Тяжелый планер"
 heavy_airframe_desc: "Планер - основа самолета"
 jet_engines: "Реактивные двигатели"
 JET_ENGINES_SPECIAL: "Разработка новых реактивных двигателей является базой для эволюции реактивных самолетов. Это должно быть исследовано, прежде чем вы сможете исследовать современные самолеты"
 jet_engines_desc: "Прорыв в двигательной технике. Реактивный двигатель позволит создать самолет совершенно нового поколения."
