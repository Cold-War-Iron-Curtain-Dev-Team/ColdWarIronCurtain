l_english:
 POLITICS_ISMET_INONU_DESC: "Подобно Мустафе Кемалю до него, старшего государственного деятеля в Анкаре почитают за то, что он хитро и дипломатично удержал народ Турции от Второй мировой войны только до последнего года конфликта, надеясь избавить бывшее сердце Османской империи от той же смерти и рецессии, поставившей империю на колени. Теперь, когда силы Оси на западе умиротворены, Инёну стоит в изоляции от своих союзников на западе, а с ростом радикализма соседей Турции на юге и надвигающейся угрозой новой пролетарской империи, таящейся за Черным морем. на плечи мудрого турецкого ветерана ложится задача идите по узкому пути поддержания дисциплины и развития турецкого государства в условиях растущей нестабильности на Ближнем Востоке."
