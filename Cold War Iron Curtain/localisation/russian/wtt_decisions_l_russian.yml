l_english:
 prospect_for_resources: "Разработка операций по добыче ресурсов"
 prospect_for_resources_desc: "Существует множество операций по сбору ресурсов, которые могут быть расширены. За определенную цену эти регионы могут удерживать больший объем ресурсов, а регионы, которые когда-то были бесплодными или испытывали нехватку ресурсов, могут стать продуктивными.§RПотратив больше денег, чем у вас есть, вы получите долг с высокими процентами§!\n\nТекущий запас [?CurrentMoney|§+§=2§!§!]B"
 renewable_energy_project: "(ЭЛЕКТРИЧЕСТВО)(§C$360§!) Возобновляемые источники энергии"
 renewable_energy_project_desc: "Инициировать и финансировать проект по преобразованию 5 электростанций на ископаемом топливе в возобновляемые электростанции. Электростанция на возобнавляемых источниках будет построена с использованием объектов старой электростанции на ископаемом топливе.\n\nСтоимость §R5§! §YФабрик§! на §Y215§! дней и §Y60M§!"
 fusion_energy_project: "(ЭЛЕКТРИЧЕСТВО)(§C$4000§!) Проект термоядерного реактора Токамак"
 fusion_energy_project_desc: "Начать строительство термоядерного реактора Токамак, чтобы обеспечить страну огромным количеством возобновляемой энергии.\n\nСтоимость §R10§! §YФабрик§! на §Y10§! лет и §YB§!"
 fusion_energy_project_wtt: "(ЭЛЕКТРИЧЕСТВО)(§C$4000§!) Проект термоядерного реактора Токамак"
 fusion_energy_project_wtt_desc: "Начать строительство термоядерного реактора Токамак, чтобы обеспечить страну огромным количеством возобновляемой энергии.\n\nСтоимость §R10§! §YФабрик§! на §Y10§! лет и §YB§!"
 tungsten_arizona_I_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Редкоземельные металлы в горе Леммон"
 tungsten_arizona_I_develop_desc: "С появлением новых горных инструментов, почти невидимые редкоземельные металлы, содержащиеся в горе Леммон, наконец-то могут быть добыты."
 steel_arizona_I_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) MAGMA Разрешение на строительство медных рудников"
 steel_arizona_I_develop_desc: "Для расширения добычи меди в Аризоне мы дадим разрешение на расширение MAGMAтических рудников и начнем эксплуатировать этот ценный строительный материал."
 steel_arizona_I_developed: "MAGMA Разрешено"
 steel_arizona_II_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) MAGMA Медный рудник в Сан Мануэль"
 steel_arizona_II_develop_desc: "Шахта Сан-Мануэля, как оказалось, содержит значительно больше меди, чем казалось. Строительство крупного рудника и плавильного завода близ Сан-Мануэля окажет большую поддержку нашей добывающей промышленности."
 steel_arizona_II_developed: "MAGMA Разрешено"
 steel_arizona_III_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) MAGMA Разведка северных медных рудников"
 steel_arizona_III_develop_desc: "В северной части штата есть еще много медных жил в отдаленных регионах, которые были открыты во время строительства инфраструктуры. Мы должны начать строить разведочные шахты и расширять те, которые имеют значительные запасы."
 steel_arizona_III_developed: "MAGMA Разрешено"
 steel_arizona_IV_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Рудник Моренси"
 steel_arizona_IV_develop_desc: "Рудник Моренси - это огромный открытый медный рудник в Южной Аризоне. Инвестируя в этот рудник, производство меди в Аризоне значительно улучшится."
 steel_arizona_V_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Помочь медному руднику Рэй"
 steel_arizona_V_develop_desc: "На руднике Рэй в округе Пинал сосредоточены источники медной руды. Было бы целесообразно финансово помочь шахте Рэй, чтобы они могли прокапать дальше, и найти больше меди."
 steel_magma_I_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) MAGMA Экспансия в Нью-Мексико"
 steel_magma_I_develop_desc: "Компания MAGMA добилась заметных успехов на разведочных рудниках в северной Аризоне. Они просят разрешения на экспансию в Нью-Мексико"
 petrochemicals_texas_I_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Полное обследование ресурсов Техаса"
 petrochemicals_texas_I_develop_desc: "Техасский нефтяной бум принес в страну огромные запасы нефти и огромные богатства. Полная разведка штата может позволить нам найти ещё нефтяных пластов и возможно других ресурсов."
 petrochemicals_texas_II_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Нефтяные месторождения в Биг-Бенд"
 petrochemicals_texas_II_develop_desc: "Согласно данным развдки, в Биг-Бенде имеются огромные неиспользованные запасы нефти."
 petrochemicals_texas_III_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) ConocoPhillips/ExxonMobil нефтепровод"
 petrochemicals_texas_III_develop_desc: "Несмотря на дороговизну, масштабный нефтепровод, спонсируемый двойными усилиями Conoco и Exxon, значительно улучшил бы нашу добычу нефти."
 petrochemicals_texas_IV_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Разведочные нефтяные месторождения"
 petrochemicals_texas_IV_develop_desc: "Для того чтобы найти больше месторождений, нам необходимо провести разведочные работы по добыче нефти и расширить те, в которых больше нефти, чем предполагалось."
 petrochemicals_texas_V_develop: "(НЕФТЕПРОДУКТЫ) Техасский сланцевый гидроразрыв пласта"
 petrochemicals_texas_V_develop_desc: "С технологией добычи сланца большой мощности, доступной нам сейчас, мы можем начать гидроразрыв пласта для огромных месторождений нефти."
 steel_texas_I_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Возродить техасские железные рудники"
 steel_texas_I_develop_desc: "После Второй мировой войны многие техасские железные рудники столкнулись с молчаливыми, но смертельно опасными проблемами управления и истощения запасов. Однако эти вопросы были быстро решены с появлением новых месторождений. Железо-добывающие компании Техаса смогли перейти на новые, только что найденные месторождения."
 steel_texas_II_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) TexasSteelProcessing и компания Corpus Christi"
 steel_texas_II_develop_desc: "Создание и обеспечение таких компаний, как Texas Steel Processing и Corpus Christi, улучшило бы собственные возможности Техаса по обработке стали и расширение железных рудников."
 aluminium_texas_I_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Возродить Техасские рудники легких металлов"
 aluminium_texas_I_develop_desc: "Многие техасские горнодобывающие компании обнаружили, что их шахты истощены после войны, и находили проблемы в расширении за счет новых источников. Однако Техасская разведка позволила бы этим шахтам найти новые источники ресурсов."
 petrochemicals_texas_I_developed: "Отчет Техасской разведки ресурсов"
 steel_texas_I_developed: "Отчет Техасской разведки ресурсов"
 petrochemicals_texas_II_developed: "Отчет Техасской разведки ресурсов"
 petrochemicals_texas_III_developed: "Отчет Техасской разведки ресурсов"
 petrochemicals_texas_IV_developed: "Отчет Техасской разведки ресурсов"
 tungsten_california_I_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Шахта на Маунтин-Пасс"
 tungsten_california_I_develop_desc: "Один урановый разведчик совсем недавно обнаружил странную аномалию вблизи Маунтин-Пасс в Калифорнии. После осмотра места раскопок выяснилось, что там находится огромное, массивное месторождение неуловимых редкоземельных металлов. Это потенциально один из самых богатых и крупных редкоземельных месторождений!"
 tungsten_california_I_developed: "Шахта Маунтин-Пасс"
 tungsten_california_II_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Гидрометаллургический завод на Маунтин-Пасс"
 tungsten_california_II_develop_desc: "Переработка стала критическим узким местом в производстве редкоземельных элементов на шахте Маунтин-Пасс. Нам нужно инвестировать в строительство гидрометаллургического завода, чтобы продолжать получать регулярную продукцию с рудника!"
 tungsten_california_II_developed: " Шахта Маунтин-Пасс"
 tungsten_california_III_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Поставлять больше воды на горный перевал"
 tungsten_california_III_develop_desc: "Гидрометаллургический завод Маунтин-Пасс перерабатывает огромное количество руды, поступающее из шахты Маунтин-Пасс. Однако ему не хватает воды, чтобы работать с полной эффективностью и продолжать расширяться. Нам необходимо улучшить водную инфраструктуру на месте, чтобы мы могли продолжать эксплуатировать этот ценный ресурс."
 tungsten_california_III_developed: "Шахта Маунтин-Пасс"
 tungsten_california_IV_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Расширить шахту Маунтин-Пасс"
 tungsten_california_IV_develop_desc: "Нам нужно расширить шахту Маунтин-Пасс в горах и использовать богатые ресурсы, скрытые в недрах гор."
 tungsten_california_IV_developed: "Шахта Маунтин-Пасс"
 tungsten_california_V_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Калифорнийский завод по переработке электронных отходов"
 tungsten_california_V_develop_desc: "С массовым увеличением внедрения электроники и их быстрой заменой, они становяться токсичными отходами. Нам нужно построить завод по переработке электронных отходов чтобы утилизировать большую часть этого материала."
 tungsten_california_V_developed: "Переработка электронных отходов на Маунтин-Пасс"
 petrochemicals_california_I_develop: "СЕ РЕСУРСЫ)(§C$360§!) Полная разведка урана в Калифорнии"
 petrochemicals_california_I_develop_desc: "Калифорния богата различными рудами и минералами. Мы должны начать поиск месторождений урана в регионе, чтобы получить его ресурсы."
 petrochemicals_california_I_developed: "Отчет о разведке в Калифорнии"
 petrochemicals_california_II_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Строительство NGCC нефтепровода в Калифорнии"
 petrochemicals_california_II_develop_desc: "Мы обнаружили огромные залежи, растянувшиеся по всему штату. Мы должны построить нефтепровод NGCC, чтобы выйти на месторождения нефти и природного газа по всему штату!"
 petrochemicals_california_II_developed: "Отчет о разведке в Калифорнии"
 petrochemicals_california_III_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Разрешения на гидроразрыв пласта в Калифорнии"
 petrochemicals_california_III_develop_desc: "У нас сейчас большая мощность добычи сланца. Мы должны начать экспериментальные процессы гидроразрыва пласта, чтобы использовать эти обширные месторождения природного газа и нефти. §RНадеемся, ничего страшного не случится§!"
 steel_california_I_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Калифорнийские горные железные рудники"
 steel_california_I_develop_desc: "В горах Калифорнии обнаружено большое количество мелких богатых жил. Когда у нас будет технология, способная получить доступ к этим регионам, мы сможем начать добычу полезных ископаемых."
 aluminium_california_I_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Залежи бокситов в Керне"
 aluminium_california_I_develop_desc: "Наша разведка обнаружила многочисленные месторождения бокситов в южной части штата в городе Керн. Мы должны создать место для добычи полезных ископаемых, чтобы добывать их."
 steel_nevada_I_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Отдаленная открытая шахта в Неваде"
 steel_nevada_I_develop_desc: "Инфраструктурные проекты открыли новый, богатый источник железа, свинца и хрома, который может быть извлечен через большой открытый карьер. Этот процесс, однако, требует ковшовых колесных экскаваторов и эффективный водопровод для добычи полезных ископаемых в этом регионе."
 aluminium_idaho_I_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Серебряные рудники Кер д'Алена"
 aluminium_idaho_I_develop_desc: "Район Кер-д'Ален в штате Айдахо заполнен огромным количеством серебра. Настолько, что в рудниках этого округа содержится больше серебра, чем во всех остальных штатах вместе взятых."
 petrochemicals_wyoming_I_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Урегулировать угольные споры в Вайоминге"
 petrochemicals_wyoming_I_develop_desc: "Добыча угля в Вайоминге является одним из крупнейших угольных предприятий страны. В настоящее время существует бесчисленное множество споров между профсоюзами, промышленниками, подрядчиками и многими другими по поводу условий труда и прав на добычу полезных ископаемых. Это потребует много политических переговоров и работы, но эти вопросы должны быть решены."
 tungsten_nebraska_I_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) NioCorp Одобрить титановый рудник в Элк-Крик"
 tungsten_nebraska_I_develop_desc: "Разрешить NioCorp строительство рудников титана/ниобия/скандия в Элк-Крике для получения доступа к особо ценным и редким материалам в округе Джонсон."
 tungsten_south_dakota_I_develop: "(РЕДКОЗЕМЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Расширить шахту Хоустейк"
 tungsten_south_dakota_I_develop_desc: "Шахта Хоустейк, самая глубокая золотая жила в Северной Америке, прекратила добычу в 1943-1945 годах из-за ограничительного приказа L-208 от Совета по военному производству. Теперь, когда война закончилась, пришло время решить ограничительный порядок и начать расширять шахту."
 petrochemicals_kansas_I_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Наделить Канзас нефтепроводами"
 petrochemicals_kansas_I_develop_desc: "Добыча нефти и природного газа в Канзасе была невероятным благом для страны. Их нефтяные и газовые месторождения в настоящее время серьезно нуждаются в нефтепроводах, чтобы они могли использовать новые топливохранилища."
 steel_pennsylvania_I_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Создать литейный мегарайон в Питтсбурге"
 steel_pennsylvania_I_develop_desc: "Питтсбург уже давно является крупным источником для сталелитейных заводов в США. Однако спрос и потребность руды в стране растёт. С началом Холодной войны и требованиями военных мы должны начать крупный проект, который будет поддерживать разведку ресурсов по всей стране.\n§GПриведёт ко многим проектам разведки ресурсов§!"
 steel_pennsylvania_I_developed: "Литейный мегарайон в Питтсбурге"
 steel_pittsburgh_I_developed: "Литейный мегарайон в Питтсбурге"
 metals_pittsburgh_I_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Модернизировать железные дороги Восточного побережья"
 metals_pittsburgh_I_develop_desc: "Чтобы начать эксплуатировать огромные неиспользованные богатства этого региона, нам необходимо построить и организовать мощную логистическую линию, ведущую прямо в Питсбург. Этот проект будет очень дорогим, но §Gпозволит разведывать новые месторождения по всей восточной части США§!"
 metals_pittsburg_I_developed: "Pittsburgh Foundry Megadistrict"
 metals_pittsburgh_ohio_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Железные и свинцовые рудники Кливленда"
 metals_pittsburgh_ohio_develop_desc: "Исходя из нашего проекта в Питтсбурге-де-Ротте-Рамбле, мы можем начать строительство железных и свинцовых рудников для использования в качестве строительных металлов для оружия и зданий."
 metals_pittsburgh_indiana_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Магниевый карьер Южной Индианы"
 metals_pittsburgh_indiana_develop_desc: "Большие жилы магния в Южной Индиане могут быть выплавлены в сплавы для использования в строительстве самолетов и различных потребительских товаров."
 metals_pittsburgh_kentucky_develop: "(ЯДЕРНЫЕ МАТЕРИАЛЫ)(§C$360§!) Плутоний в Кентукки"
 metals_pittsburgh_kentucky_develop_desc: "Источник плутония в Кентукки, вероятно, является одной из самых ценных находок всего этого проекта и является большим благом для ядерных программ нашей страны. Наличие местного источника плутония обеспечивает наилучшие цены и прямой контроль над его разработкой."
 metals_pittsburgh_tennessee_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Построить железный рудник Рок-Касл"
 metals_pittsburgh_tennessee_develop_desc: "Рок-Касл в округе Тригг, штат Кентукки, является местом с богатой жилой железной руды, которая не была добыта из-за серьезных земельных споров с региональными землевладельцами. Нам нужно захватить земли с выдающимися владениями и построить там железный рудник. Мы даже добавим небольшое историческое место для Старого Рок-Касла, который был сожжен во время Гражданской войны."
 metals_pittsburgh_georgia_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Построить железный рудник в округе Форсайт"
 metals_pittsburgh_georgia_develop_desc: "Наши разведчики нашли очень глубокую железную жилу в округе Форсайт. Это будет нелегко, но нам нужно построить железный рудник с глубоким стволом, чтобы использовать этот ресурс."
 metals_pittsburgh_alabama_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Бокситный карьер в Таскалузе"
 metals_pittsburgh_alabama_develop_desc: "Боксит - это разновидность породы, содержащей неплавленный алюминий. Наши искатели едва не упустили этот источник бокситов близ Тускалузы. С нашей новообретенной логистической сетью, ведущей в Питтсбург, мы можем плавить первичный Боксит в алюминий."
 metals_pittsburgh_michigan_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Свинцовый рудник во Флинте"
 metals_pittsburgh_michigan_develop_desc: "Мы нашли огромный источник свинца недалеко от Флинта, штат Мичиган. Мы можем легко подключиться к этому свинцовому месторождению, но нам придется переместить городской источник воды в другое место, поскольку он необходим шахте. Есть еще один хороший источник поблизости, который должен быть хорош для города, однако, это может вызвать некоторые проблемы."
 metals_pittsburgh_newyork_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Бокситный карьер Олбани"
 metals_pittsburgh_newyork_develop_desc: "Город Олбани, расположен очень близко к источнику бокситов (первичного алюминия). Мы можем построить большой открытый карьер рядом с городом."
 metals_pittsburgh_maryland_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Угольные шахты/Кислотные дренажи в окр. Аллегани и Гарретт"
 metals_pittsburgh_maryland_develop_desc: "В округах Аллегани и Гарретт ведутся богатые наземные угледобывающие операции, которые производят огромное количество угля. Однако есть также много заброшенных шахт и кислотных дренажей. Мы можем расширить шахты и построить новые в Аллегани и Гарретте, но нам нужно пересмотреть старые шахты с современным оборудованием, а также очистить кислотные стоки, угрожающие здоровью и жизни нашим рабочим и природе."
 metals_pittsburgh_virginia_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Угольные шахты в Вирджинии"
 metals_pittsburgh_virginia_develop_desc: "Угольные шахты в Вирджинии уже более ста лет являются основой промышленности нашей страны. Однако после войны для них наступили тяжелые времена. Поэтому мы должны приложить усилия, чтобы возродить их и вернуть наш источник угля."
 metals_pittsburgh_westvirginia_develop: "(НЕФТЕПРОДУКТЫ)(§C$360§!) Угольная разведка в Западной Вирджинии"
 metals_pittsburgh_westvirginia_develop_desc: "Угольные шахты Западной Вирджинии почти истощены, и шахтеры и промышленники штата ищут новые источники угля для добычи. Содействие этим усилиям позволит им вернуться к работе!"
 steel_florida_I_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Оценка отчётов разведки"
 steel_florida_I_develop_desc: "С появлением ковшовых колесных экскаваторов некоторые песчаные шахты во Флориде начали добывать больше ресурсов, чем когда-либо. Однако некоторые шахты, такие как Джанха, начали сообщать о странных примесях в своих песках. Мы должны оценить эти отчеты, чтобы выяснить, есть ли там что-нибудь полезное."
 steel_florida_I_developed: "Отчёт о разведке во Флориде"
 steel_florida_II_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Фильтры железа в шахте Джанха"
 steel_florida_II_developed: "Пески в глубине шахт Джанха чрезвычайно богаты железистыми отложениями. Мы можем инвестировать в фильтры железа для извлечения отложений и извлекать из них ресурсы."
 aluminium_florida_I_develop: "(ЛЁГКИЕ МЕТАЛЛЫ)(§C$360§!) Аллюминиевые фильтры для шахт Стюарт"
 aluminium_florida_I_develop_desc: "Пески в глубине песчано-гравийных шахт Стюарта необычайно богаты алюминиевыми отложениями. Мы должны поставиить фильтры для удаления алюминия, чтобы он не мешал операциям по добыче высокодрагоценного гравия."
 steel_odessa_I_develop: "(СТРОИТЕЛЬНЫЕ МЕТАЛЛЫ)(§C$360§!) Одесский железорудный карьер"
 steel_odessa_I_develop_desc: "Добыча Кокины (форма камня) в Одессе открыла источник железной руды рядом с их работой. Мы можем открыть железный рудник и сталелитейный завод поблизости в Кишиневе, чтобы переработать его и решить проблему безработицы в городе."
 aluminium_chukotka_I_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Обзор отдаленного месторождения Купол"
 aluminium_chukotka_I_develop_desc: "Купол - это экспериментальная попытка начать сбор золота и серебра из отдаленного, пустынного, враждебного места на Чукотке. Проект будет сильно давить на технологические требования и потребует больших инвестиций, но в долгосрочной перспективе мы получим серебрянные и золотые рудники."
 aluminium_chukotka_I_developed: "Развитие месторождения Купол"
 aluminium_chukotka_II_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Снабжение шахты в Куполе"
 aluminium_chukotka_II_develop_desc: "Нам нужно построить региональный запас топлива и построить соответствующие водные объекты для поддержки проекта удалённой добычи в Куполе, иначе шахта не будет работать в полной мере."
 aluminium_chukotka_II_developed: "Развитие месторождения Купол"
 aluminium_chukotka_III_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Построить геотермальную электростанцию и теплообменник в Куполе"
 aluminium_chukotka_III_develop_desc: "Чтобы обеспечить шахту экономически эффективной электроэнергией и теплом в Куполе мы должны построить геотермальную станцию и городской теплообменник и так мы решим проблемы с теплом."
 aluminium_chukotka_III_developed: "Развитие месторождения Купол"
 aluminium_chukotka_IV_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Гидрометаллургический завод в Куполе"
 aluminium_chukotka_IV_develop_desc: "Чтобы лучше освоить богатые руды Купола, нам нужно построить гидрометаллургический завод."
 aluminium_chukotka_IV_developed: "Развитие месторождения Купол"
 aluminium_chukotka_V_develop: "(ВСЕ РЕСУРСЫ)(§C$360§!) Снабдить шахты Купола новым оборудованием"
 aluminium_chukotka_V_develop_desc: "Мы можем еще больше расширить шахты в Куполе, поставляя им модернизированное горное оборудование для получения большего доступа к золоту и серебру внутри страны'."
 aluminium_chukotka_V_developed: "Развитие месторождения Купол"
 fusion.0.t: "[Root.GetName] завершён термоядерный реактор Токамак!"
 fusion.0.d: "В анналах каждой цивилизации наступает время, когда величайшие проблемы решаются с помощью самых радикальных решений. Было ли это обещанием неограниченного количества пищи через сельское хозяйство или обещанием беспрепятственного передвижения, предлагаемого колесом. Сегодняшняя колоссальная проблема увеличения потребления энергии и расширения промышленного производства имеет место быть. Поскольку экономическое желание потреблять и удовлетворять потребности каждого человека превысило несущую способность нашей планеты, учёные [Root.GetName] после десятилетий исследований и тяжелой работы, после миллионов человеко-часов и миллиардов долларов, достигли мечты о том, чтобы вечно управлять миром, не тратя и так заканчивающиеся ресурсы планеты и не становясь зависимыми от капризов природы. Народ [Root.GetName] радовался достижениям своей нации в области ядерного синтеза! Благодаря обмену знаниями и опытом с остальными народами мира, несомненно, многие страны вскоре пойдут по их стопам. Эти национальные и международные усилия приведут нас к тому дню, когда наш рост и рост планеты станут единым целым. На спинах дешёвой, доступной и вездесущей энергии."
 fusion.0.a: "Началась новая эра в истории!"
 fusion.1.t: "Термоядерный реактор Токамак завершён!"
 fusion.1.d: "Наша страна завершила строительство ещё одного термоядерного реактора Токамак и готова приступить к реализации ещё одного проекта!"
 fusion.1.a: "Отлично"
