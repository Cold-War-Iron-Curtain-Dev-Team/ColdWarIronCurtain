 GER_austro_hungarian_empire: "Австро-Венгрия"
 GER_case_anton_category: "Операция «Антон»"
 GER_case_anton_category_desc: "Создание режима Виши во Франции преследовало своей целью защиту французских колоний и французского флота от Союзников. Однако эта договоренность может быть в любой момент расторгнута: у нас готов план насильственной реинтеграции Вишистской Франции и стремительного прорыва к базе французского флота в Тулоне."
 GER_case_anton: "Проведение операции «Антон»"
 GER_case_anton_desc: "Марионеточный режим во Франции более не отвечает нашим целям. [Root.GetName] немедленно начнет интеграцию территорий; кроме того, если поспешить, мы можем даже завладеть остатками французского флота."
 GER_case_anton_tt: "Аннексия Вишистской Франции за 7 дней и захват французского флота.\n\n§RФранция сможет затопить флот, если немецкие войска не дойдут до Тулона за 2 дня!§!\n"
 GER_case_red: "План «Рот»"
 GER_operation_marita: "Операция «Марита»"
 political_actions: "Политические действия"
 anti_fascist_raids: "Антифашистские рейды"
 anti_fascist_raids_desc: "Мы должны разобраться с фашистскими элементами у себя дома ради долгосрочной стабильности в стране. Фашистское влияние настолько велико, что рискует стать потенциальной проблемой для правительства."
 anti_democratic_raids: "Антидемократические рейды"
 anti_democratic_raids_desc: "Мы должны разобраться с демократическими элементами у себя дома ради долгосрочной стабильности в стране. Влияние демократов настолько велико, что рискует стать потенциальной проблемой для правительства."
 anti_communist_raids: "Антикоммунистические рейды"
 anti_communist_raids_desc: "Мы должны разобраться с коммунистическими элементами у себя дома ради долгосрочной стабильности в стране. Влияние коммунистов настолько велико, что рискует стать потенциальной проблемой для правительства."
 object_to_attaches: "Протесты против атташе"
 object_to_attaches_desc: "Наши враги получают военную помощь из-за рубежа! Мы должны выразить решительный протест и потребовать отзыва любых атташе."
 infrastructure_building_slot: "Региональная промышленная интеграция"
 infrastructure_building_slot_flag: "Еще не получена дополнительная стройплощадка от инфраструктуры."
 war_building_slot: "Передача земель под промышленность"
 war_building_slot_flag: "Еще не получена дополнительная стройплощадка от передачи земель."
 special_projects: "Специальные проекты"
 CHI_xian_fired: "Китайские лидеры приглашены в Сянь"
 JAP_intervene_in_china_level_down: "Снижение уровня интервенции в Китае"
 JAP_china_step_up_war_effort: "Эскалация военного конфликта в Китае"
 JAP_ichi_go: "Операция «Ити-Го»"
 JAP_ichi_go_desc: "Война близится к завершению. Предприняв решительные меры для финального рывка, мы сможем быстро покончить с этим конфликтом. Если нам не удастся одержать победу в течение ближайшего года, мы столкнемся с ростом внутренней нестабильности, когда население устанет от продолжающейся войны..."
 JAP_conquer_china: "Захват Китая"
 JAP_release_korea: "Независимость Кореи"
 JAP_southern_expansion: "Экспансия на юг"
 JAP_sue_for_peace_CHI: "Предложить условия капитуляции государству [From.GetNameDef]"
 JAP_sue_for_peace_TT: "§YЯпония§! и ее субъекты не контролируют ни одну из континентальных национальных территорий §YКитая§! или §YКореи§!."
 JAP_sue_for_peace_CHI_desc: "Мы потеряли материковый плацдарм. Генштаб считает, что возвращение утраченных позиций маловероятно; правительство предлагает начать обсуждение условий, при которых мы хотя бы сможем сохранить контроль над островами."
 JAP_sue_for_peace_MAN: "Предложить условия капитуляции лидеру [From.GetNameDef]"
 JAP_sue_for_peace_MAN_desc: "Мы потеряли материковый плацдарм. Генштаб считает, что возвращение утраченных позиций маловероятно; правительство предлагает начать обсуждение условий, при которых мы хотя бы сможем сохранить контроль над островами."
 JAP_sue_for_peace_nuke: "Безоговорочная капитуляция"
 JAP_sue_for_peace_nuke_desc: "Наш противник применил новую необычайно безжалостную бомбу. Ход войны складывается не в нашу пользу. Нужно собраться и приготовиться к немыслимому."
 JAP_sue_for_peace_nuke_mission: "Ядерный удар по Японии"
 JAP_sue_for_peace_nuke_mission_desc: "Успешные испытания ядерного оружия открывают нам альтернативный путь, который позволит обойтись без полномасштабного вторжения. Военная разведка предполагает, что два последовательных ядерных удара по Японскому архипелагу вынудят их командование к безоговорочной капитуляции."
 JAP_request_soviet_support: "Попросить поддержку со стороны Советского Союза"
 JAP_request_soviet_support_desc: "В нашей гражданской войне нам требуется поддержка, и наиболее вероятный помощник - это Советский Союз на севере. Возможно, стоит даже обменять юг Сахалина на группу добровольческих советских дивизий."
 JAP_nuke_1: "Нанесен первый ядерный удар по Японии"
 JAP_nuke_2: "Нанесен второй ядерный удар по Японии"
 foreign_politics: "Внешняя политика"
 JAP_pressure_france: "Потребовать Индокитай"
 JAP_break_the_london_naval_treaty: "Разрыв Лондонского морского соглашения"
 JAP_break_the_london_naval_treaty_desc: "Оскорбительные условия Лондонского морского соглашения представляют угрозу безопасности нашей нации. Мы должны построить флот, способный дать отпор любой нации, рискнувшей посягнуть на то, что принадлежит нам по праву."
 JAP_tora_tora_tora: "Тора! Тора! Тора!"
 JAP_tora_tora_tora_desc: "Пришло время первого удара. После него мы должны быстро использовать полученное преимущество, чтобы вывести наших врагов из игры, прежде чем они смогут сориентироваться."
 JAP_war_with_soviet_union: "Объявление войны СССР"
 JAP_war_with_soviet_union_desc: "Наши европейские союзники подписали с Советским Союзом пакт о ненападении. Но война не может ждать: мы должны держать курс на конфликт с коммунистами, даже если наши союзники отвернутся от нас."
 institute_press_censorship_fascist_state: "Цензура прессы"
 institute_press_censorship_fascist_state_desc: "В это опасное время мы не можем позволить, чтобы выражения недовольства вносили раскол в наш народ. Ограничение свободы прессы необходимо для того, чтобы никто не смог заглушить голос истины."
