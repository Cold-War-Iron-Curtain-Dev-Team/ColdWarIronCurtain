 SOV_hold_leningrad: "Удержание Ленинграда"
 SOV_hold_moscow: "Удержание Москвы"
 SOV_seize_manchuria: "Захват Маньчжурии"
 SOV_seize_manchuria_desc: "В результате гражданской войны в Японии [MAN.GetName] более не находится под властью японцев. Это уникальнейшая возможность установить на этой территории власть Советов."
 SOV_return_manchuria: "Возвращение Маньчжурии"
 SOV_return_manchuria_desc: "Вы вернем Маньчжурию единственному легитимному народному режиму в Китае."
 fascism_on_the_rise: "Фашизм на подъеме"
 fascism_on_the_rise_desc: "Некоторые политики начинают открыто и публично высказываться в пользу фашистской идеологии; их поддерживает все большая часть населения. Путь к фашизму открыт - осталось лишь решить, будет ли переход мирным или силовым."
 prepare_for_fascist_civil_war: "Подготовка к гражданской войне"
 prepare_for_fascist_civil_war_desc: "У нас нет времени на постепенное изменение мировоззрения населения. Мы должны быстро разрешить этот вопрос, даже если такое решение будет стоить кому-то жизни. В отличие от мирного референдума, гражданская война нанесет сокрушительный удар по армии, промышленности и инфраструктуре нашей страны, но быстрее решит проблему и позволит нам в дальнейшем активнее навязывать свою волю."
 expand_civil_fascism_support: "Расширение гражданской поддержки"
 expand_civil_fascism_support_desc: "Мы должны бороться за рост поддержки среди населения и стимулировать граждан на открытую критику курса, проводимого действующим правительством. Чем сильнее расшатаны позиции власти, чем чаще вспыхивают гражданские беспорядки, тем проще нам будет добиться поставленной цели. Это особенно верно в том случае, если нашей целью является не законная передача власти, а... более жесткая смена режима."
 army_support_for_fascist_civil_war: "Расширение военной поддержки"
 army_support_for_fascist_civil_war_desc: "Без полноценной поддержки вооруженных сил можно оставить все надежды на победу в вооруженной идеологической борьбе. Мы должны гарантировать лояльность хотя бы нескольких тщательно отобранных подразделений."
 army_support_TT: "Каждый раз, когда увеличивается поддержка армии, сила вашей фракции в гражданской войне возрастает на 10% вплоть до максимума, равного 70%.\n"
 ensure_general_loyalty_for_fascist_civil_war: "Лояльность низшего офицерского состава"
 ensure_general_loyalty_for_fascist_civil_war_desc: "Вполне вероятно, что некоторые генералы втайне поддерживают фашистскую идеологию. Нужно выявить их и заручиться их поддержкой прежде, чем начнется конфликт."
 ensure_marshal_loyalty_for_fascist_civil_war: "Лояльность верховного командования"
 ensure_marshal_loyalty_for_fascist_civil_war_desc: "Вполне вероятно, что некоторые фельдмаршалы втайне поддерживают фашистскую идеологию. Нужно выявить их и заручиться их поддержкой прежде, чем начнется конфликт."
 siphon_equipment_stockpiles_for_fascist_civil_war: "Переброска снаряжения"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc: "Мы можем обеспечить себя небольшим арсеналом на будущее, прибегнув к хищениям со складов."
 formulate_surprise_attack_plan_for_fascist_civil_war: "Подготовка плана внезапного нападения"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc: "Наш враг не имеет ни малейшего представления, что его ждет. Мы должны гарантировать, что подобное положение вещей сохранится, и наиболее полно использовать фактор внезапности в наших планах."
 formulate_surprise_attack_plan_for_civil_war_tt: "План внезапного нападения дает +25% к атаке всех дивизий на национальной территории в течение 30 дней.\n"
 ignite_the_fascist_civil_war: "Разжигание гражданской войны"
 ignite_the_fascist_civil_war_desc: "Момент настал. Все необходимые приготовления проведены. Пути назад нет."
 rebuild_the_nation_fascism: "Возрождение нации"
 rebuild_the_nation_fascism_desc: "Гражданская война завершилась. Теперь мы должны восстановить нашу разрушенную страну."
 open_up_political_discourse_fascism: "Начало политических дебатов"
 open_up_political_discourse_fascism_desc: "Мы должны начать работу по примирению конфликтующих точек зрения в нашем правительстве. Возможно, со временем это даст нам возможность мирным образом изменить политический строй нашей державы."
 discredit_government_fascism: "Дискредитация правительства"
 discredit_government_fascism_desc: "Обратив внимание людей на многочисленные недостатки текущего правительства, мы можем подвести их к мысли об идеологической причине сложившейся ситуации."
 hold_the_fascist_national_referendum: "Проведение всенародного референдума"
 hold_the_fascist_national_referendum_desc: "Заручившись достаточной поддержкой, мы можем провести референдум об изменении политического строя без излишнего кровопролития."
 democratic_on_the_rise: "Прогрессивизм на подъеме"
 democratic_on_the_rise_desc: "Некоторые политики начинают открыто и публично высказываться в пользу прогрессивизма; их поддерживает все большая часть населения. Путь к прогрессивизму открыт - осталось лишь решить, будет ли переход мирным или силовым."
 prepare_for_democratic_civil_war: "Подготовка к гражданской войне"
 prepare_for_democratic_civil_war_desc: "У нас нет времени на постепенное изменение мировоззрения населения. Мы должны быстро разрешить этот вопрос, даже если такое решение будет стоить кому-то жизни. В отличие от мирного референдума, гражданская война нанесет сокрушительный удар по армии, промышленности и инфраструктуре нашей страны, но быстрее решит проблему и позволит нам в дальнейшем активнее навязывать свою волю."
 expand_civil_democratic_support: "Расширение гражданской поддержки"
 expand_civil_democratic_support_desc: "Мы должны бороться за рост поддержки среди населения и стимулировать граждан на открытую критику курса, проводимого действующим правительством. Чем сильнее расшатаны позиции власти, чем чаще вспыхивают гражданские беспорядки, тем проще нам будет добиться поставленной цели. Это особенно верно в том случае, если нашей целью является не законная передача власти, а... более жесткая смена режима."
 army_support_for_democratic_civil_war: "Расширение военной поддержки"
 army_support_for_democratic_civil_war_desc: "Без полноценной поддержки вооруженных сил можно оставить все надежды на победу в идеологической борьбе. Мы должны гарантировать лояльность хотя бы нескольких тщательно отобранных подразделений."
 ensure_general_loyalty_for_democratic_civil_war: "Лояльность низшего офицерского состава"
 ensure_general_loyalty_for_democratic_civil_war_desc: "Вполне вероятно, что некоторые генералы втайне поддерживают прогрессивизм. Нужно выявить их и заручиться их поддержкой прежде, чем начнется конфликт."
 ensure_marshal_loyalty_for_democratic_civil_war: "Лояльность верховного командования"
