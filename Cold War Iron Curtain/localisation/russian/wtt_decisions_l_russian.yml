 PRC_return_manchuria_communist_desc: "Японские империалисты отняли Маньчжурию у её полноправного владельца, свободного народа Китая. Поскольку теперь наши японские товарищи сбросили режим угнетателей, мы можем обратиться к ним с просьбой вернуть Маньчжурию китайцам."
