 GER_reichskommissariat_belgien_nordfrankreich: "Рейхскомиссариат Бельгия и Северная Франция"
 GER_reichskommissariat_ostland: "Рейхскомиссариат Остланд"
 GER_reichskommissariat_ukraine: "Рейхскомиссариат Украина"
 reinstate_wilhelm_iv_succession_rights: "Право наследования для принца Вильгельма"
 reinstate_wilhelm_iv_succession_rights_desc: "Сын кайзера Вильгельма III был вынужден отказаться от права на престол из-за решения жениться без благословления Вильгельма II, бывшего в тот момент главой семьи. После того, как эта роль перешла к Вильгельму III, он может убедить своего отца поддержать возвращение принцу права наследования."
 reinstate_wilhelm_iv_succession_rights_tt: "Порядок наследования изменён.\n"
 modernize_the_succession_laws: "Модернизация законов престолонаследия"
 modernize_the_succession_laws_desc: "У сына кайзера, которому предстоит стать Вильгельмом IV, всего лишь две дочери. Мы должны гарантировать передачу престола его наследникам; необходимо изменить законы, чтобы позволить принцессе Фелиците взойти на престол."
 modernize_the_succession_laws_tt: "Женщины могут наследовать трон.\n"
 request_restoration_of_british_titles: "Требование возвращения британских титулов"
 request_restoration_of_british_titles_desc: "В 1917 году парламент Великобритании проголосовал за лишение королевской семьи и княжеских родов Германии британских титулов пэров и королевских титулов. Теперь мы союзники и поддерживаем прекрасные отношения - быть может, настало время отменить это решение."
 hindenburg_destroyed_tt: "«Гинденбург» §YНЕ§! уничтожен.\n"
 request_restoration_of_british_titles_tt: "Это, несомненно, приведёт к не имеющим прецедентов благоприятным последствиям...\n"
 GER_request_polish_war_participation: "Потребовать от Польши участия в войне"
 GER_request_polish_war_participation_desc: "Поскольку мы находимся в состоянии войны с государством [SOV.GetName], мы требуем разрешения нашим войскам пройти по [POL.GetAdjective] территории. Мы поклялись защищать Польшу, и потому вполне естественно, что она должна присоединиться к нам в этом конфликте."
 GER_reform_austro_hungarian_empire: "Возрождение Австро-Венгерской империи"
 GER_reform_austro_hungarian_empire_tt: "Требование к правопреемникам Австро-Венгрии воссоздать империю.\n§RЕсли они согласятся, вы вступите во все войны, которые они ведут!§!\n"
 GER_barbarossa_mission: "21-я директива фюрера"
 emergency_factory_conversion_defensive: "Вынужденная конверсия фабрик"
 emergency_factory_conversion_defensive_desc: "Фронт отчаянно нуждается в новых поставках. Нужно срочно перепрофилировать наши заводы на производство оружия и боевой техники."
 emergency_factory_conversion_offensive: "Вынужденная конверсия фабрик"
 emergency_factory_conversion_offensive_desc: "Нашим войскам жизненно необходимо новое оружие. Чтобы победить в войне, нам нужны новые заводы, которые обеспечат нас вооружением."
 demolish_enemy_fortifications: "Уничтожение вражеских укреплений"
 dismantle_maginot: "Уничтожение линии Мажино"
 propaganda_efforts: "Пропаганда"
 war_propaganda: "Военная пропаганда"
 war_propaganda_desc: "Мир вокруг нас пылает, но наша страна не готова к войне. Мы должны призвать народ взять в руки оружие и встать на защиту родины."
 desperate_defense: "Отчаянная оборона"
 desperate_defense_desc: "Отступать больше некуда. Нашим войскам придется окопаться и держать рубежи всеми силами."
 war_bonds: "Облигации военного займа"
 war_bonds_desc: "Военная экономика нуждается в новых ресурсах. Военный заем обеспечит нас ими."
 CHI_lessons_of_war: "Уроки войны"
 CHI_bolster_our_ranks: "Усиление наших рядов"
 CHI_industrial_evacuations_from_beijing: "Эвакуация промышленности из Пекина"
 GER_barbarossa_mission_desc: "«Германские вооруженные силы должны быть готовы разбить Советскую Россию в ходе кратковременной кампании. Основные силы русских сухопутных войск должны быть уничтожены в смелых операциях танковых крыльев»."
 USA_war_measures: "Меры военного времени"
 USA_homeland_defense: "Чрезвычайный акт о защите родины"
 USA_homeland_defense_desc: "Враги ступили на землю нашей гордой нации. Американский народ должен собраться с силами и оттеснить захватчиков обратно в море."
 USA_aid_britain: "Помощь Британии"
 USA_establish_personal_communication_with_former_naval_person: "Контакт с бывшим морским офицером"
 USA_establish_personal_communication_with_former_naval_person_desc: "[ENG.GetName] теперь под руководством нового первого министра. Нам следует начать с ним диалог, чтобы лучше подготовить и скоординировать наше неизбежное вступление в войну."
 USA_battle_domestic_isolationism: "Борьба с изоляционизмом"
 USA_battle_domestic_isolationism_desc: "Если сторонники изоляционизма одержат верх, мы потеряем всякую возможность противостоять внешним угрозам. Ради собственного блага нам следует начать борьбу с изоляционистской риторикой."
 USA_emergency_arms_deliveries: "Экстренные поставки вооружения"
 USA_emergency_arms_deliveries_desc: "Франция пала; Великобритания осталась один на один с агрессором, с трудом защищая свои берега от вторжения. Британцы, однако, своей пламенной риторикой продолжают демонстрировать свою готовность сражаться. Во имя демократии мы должны сделать всё, что в наших силах, чтобы дать им возможность защитить свою свободу."
 USA_arsenal_of_democracy_decision: "Арсенал демократии"
 USA_arsenal_of_democracy_decision_desc: "Пусть мы пока предпочитаем держаться в стороне от конфликта, мы все же можем поддержать наших друзей, предоставив им новый арсенал. Нужно помочь нашему народу понять, почему эта мера необходима."
 USA_women_in_the_workforce: "Клепальщица Рози"
 USA_women_in_the_workforce_desc: "Умеешь пользоваться электрическим миксером? Тогда справишься и со сверлильным станком. В годы войны более шести миллионов американских женщин работали на фабриках, заводах и стройплощадках, навсегда доказав, что справляются с работой не хуже мужчин."
 CAN_women_in_the_workforce: "Ронни, девушка с пулеметом Bren"
 CAN_women_in_the_workforce_desc:0 "Ronnie says: \"Ronnie says: \"Keep 'em Coming!\" Когда наши мужчины служат в армии, бремя военного производства ложится на плечи женщин нашей страны. За время войны 800 000 канадских женщин заняли места тех, кто ушел в армию, навсегда доказав, что женщины могут выполнять работу так же хорошо, как и мужчины."
