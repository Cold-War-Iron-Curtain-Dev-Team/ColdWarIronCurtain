 liberate_kenya: "Освобождение Кении"
 liberate_kenya_desc: "Это займет 6 месяцев."
 hold_fight_on_the_beaches_speech: "Речь «Мы будем сражаться на пляжах»"
 hold_fight_on_the_beaches_speech_desc: "«Мы пойдем до конца, мы будем биться во Франции, мы будем биться на морях и океанах, мы будем биться с растущей уверенностью и растущей силой в воздухе, мы будем защищать наш Остров, чего бы это нам ни стоило, мы будем биться на пляжах, мы будем биться на местах высадки, мы будем биться в полях, на улицах, мы будем биться на холмах, мы никогда не сдадимся...»"
 fight_on_the_beaches_speech: "Речь «Мы будем биться на пляжах»"
 operation_fork: "Операция «Форк»"
 operation_fork_desc: "Исландия, недавно получившая независимость, занимает стратегически важное положение на севере Атлантики, а после захвата Норвегии оказалась под угрозой вторжения. Мы должны опередить врагов и оккупировать Исландию самостоятельно, чтобы не допустить захвата стратегических баз и новых угроз нашим конвоям. Под нашей защитой Исландия будет в безопасности."
 invade_ireland: "Вторжение в Ирландию"
 invade_ireland_desc: "Мы должны любыми способами обеспечить безопасность морских конвоев. Пусть для многих вторжение в Ирландию кажется недопустимым, это может оказаться единственным способом получить доступ к необходимым аэродромам."
 macdonald_proposal: "Предложение Макдональда"
 macdonald_proposal_desc: "Мы должны любыми способами обеспечить безопасность морских конвоев. Для этого нам необходимы ирландские порты и авиабазы. Мы предложим Северную Ирландию в обмен на немедленное вступление Ирландии в войну на нашей стороне."
 hold_blood_toil_tears_sweat_speech: "Речь «Кровь, пот и слёзы»"
 hold_blood_toil_tears_sweat_speech_desc: "«Я не могу предложить ничего, кроме крови, тяжелого труда, слез и пота. [...]Вы спросите, какова наша политика? Я отвечу: вести войну на море, суше и в воздухе, со всей нашей мощью и со всей той силой, которую Бог может даровать нам; вести войну против чудовищной тирании, равной которой никогда не было в мрачном и скорбном перечне человеческих преступлений. Такова наша политика. Вы спрашиваете, какова наша цель? Я могу ответить одним словом: победа – победа любой ценой, победа, несмотря на все ужасы; победа, независимо от того, насколько долог и тернист может оказаться к ней путь; без победы мы не выживем»."
 blood_toil_tears_sweat_speech: "Речь «Кровь, пот и слезы»"
 hold_this_was_their_finest_hour_speech: "Речь «Их звёздный час»"
 hold_this_was_their_finest_hour_speech_desc: "«Поэтому обратимся к выполнению своего долга и будем держаться так, чтобы, если Британской империи и ее Содружеству наций суждено будет просуществовать еще тысячу лет, то и тогда, через тысячу лет, люди могли сказать: это был их звездный час»."
 this_was_their_finest_hour_speech: "Речь «Их звездный час»"
 mers_el_kebir_raid: "Операция «Катапульта»"
 mers_el_kebir_raid_desc: "Французский флот находится в руках вишистского режима. Нельзя допустить, чтобы он был передан Германии. Сколь бы это ни было мерзко, мы вынуждены требовать от наших бывших союзников капитуляции под угрозой уничтожения."
 FRA_vichy_france: "Вишистская Франция"
 FRA_scuttle_the_fleet: "Затопление флота"
 FRA_scuttle_the_fleet_desc: "Иностранные державы пытаются силой завладеть нашим флотом. Этого нельзя допустить: затопим корабли сами!"
 FRA_case_anton_mission: "Проводится операция «Антон»"
 case_anton: "Операция «Антон»"
 FRA_case_anton_mission_tt: "Аннексии удалось избежать."
 war_measures: "Меры военного времени"
 women_in_the_workforce: "Женский труд"
 women_in_the_workforce_desc: "Мужчины отправляются на войну, и тысячи женщин занимают их места на фабриках и заводах, поддерживая работу военной промышленности."
 scientist_refuge: "Иммиграция ученых"
 scientist_refuge_desc: "Текущий политический климат в Европе заставил многих ученых покинуть родину. Часть из них ожидают визы для въезда в нашу страну. Если мы примем их, это положительно скажется на развитии науки, но вызовет недовольство тех, кто считает, что мы не должны вмешиваться во внутренние проблемы других стран."
 give_refuge_ger: "Принять немецких ученых"
 give_refuge_ita: "Принять итальянских ученых"
 operations: "Операции"
 GER_military_buildup: "Подготовка к военным действиям"
 GER_weserubung_sud: "Везерюбунг-Зюд"
 GER_weserubung_sud_desc: "Чтобы как следует подготовиться к вторжению в Норвегию, мы должны сначала захватить Данию."
 GER_weserubung_nord: "Везерюбунг-Норд"
 GER_weserubung_nord_desc: "Норвегия является стратегически важным регионом. По ней может ударить любой враг, который не хочет, чтобы мы закупали сталь в Швеции. Мы не позволим нашим противникам создать базы в этом регионе."
 GER_case_yellow_netherlands: "План «Гельб» - Нидерланды"
 GER_case_yellow_netherlands_desc: "Нападение на Бельгию заставит нас иметь дело с чересчур узким фронтом. Нужно включить в план операции также и Нидерланды, чтобы не повторить ошибки 1914 года."
 GER_case_yellow_belgium_luxembourg: "План «Гельб» - Бельгия и Люксембург"
 GER_case_yellow_belgium_luxembourg_desc: "Атака на линию Мажино - настоящее самоубийство. Мы обойдем основную часть укреплений с севера, пройдя через Арденны."
 GER_polish_ultimatum: "Ультиматум Польше"
 SOV_industry_relocation: "Эвакуация промышленности"
 SOV_relocate_industry_from_moscow: "Эвакуация промышленности из Москвы"
 SOV_relocate_industry_from_moscow_desc: "Эвакуация тяжелого машиностроения из Москвы на Урал - процесс нелегкий, но он необходим, чтобы обезопасить нашу военную промышленность."
 SOV_relocate_industry_from_moscow_tt: "§RЭти эффекты требуют контроля над Москвой к тому времени, когда срок решения закончится.§!"
 SOV_relocate_industry_from_leningrad: "Эвакуация промышленности из Ленинграда"
 SOV_relocate_industry_from_leningrad_desc: "Эвакуация тяжелого машиностроения из Ленинграда на Урал - процесс нелегкий, но он необходим, чтобы обезопасить нашу военную промышленность."
 SOV_relocate_industry_from_leningrad_tt: "§RЭти эффекты требуют контроля над Ленинградом к тому времени, когда срок решения закончится.§!"
 SOV_relocate_industry_from_smolensk: "Эвакуация промышленности из Смоленска"
 SOV_relocate_industry_from_smolensk_desc: "Эвакуация тяжелого машиностроения из Смоленска на Урал - процесс нелегкий, но он необходим, чтобы обезопасить нашу военную промышленность."
