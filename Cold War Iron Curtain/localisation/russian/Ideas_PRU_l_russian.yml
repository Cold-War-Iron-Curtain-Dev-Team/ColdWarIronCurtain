l_russian:
 improve_peruvian_production: "Улучшение перуанского производства"
 improve_peruvian_production_desc: "После того, как мы сфокусировались на индустрмм, мы наконец-то модернизируем наше производство. Теперь перуанцы будут много работать в военной промышленности. Для перуанской нации."
 bolognesi_memories: "Воспоминания Болоньези"
 bolognesi_memories_desc: "Полковник Франсиско Болоньези - это образ доблестного героя, который до конца сражается за перуанскую нацию, поэтому мы должны помнить о его героических действиях."
 A_New_Peruvian_Ejercito: "Новая перуанская армия"
 A_New_Peruvian_Ejercito_desc: "С новой организованной и подготовленной армией мы готовы к будущей войне, наши отважные солдаты будут защищать перуанскую нацию до конца."
  
