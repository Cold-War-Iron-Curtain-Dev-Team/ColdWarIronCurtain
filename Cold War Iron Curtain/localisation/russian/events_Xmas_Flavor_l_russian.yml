l_russian:
  Xmas.1.d:0 "Программа слежения за Санта Клаусом со стороны Командования воздушно-космической обороны Северной Америки началась 24 декабря 1955 года, когда номер телефона командного центра континентальной противовоздушной обороны NORAD (CONAD) был случайно напечатан на рекламе универмага Sears, предлагавшего телефонные звонки Санте. В центре CONAD в Колорадо-Спрингс начали звонить телефоны, даже через страшный красный телефон, куда поступали команды от вышестоящих инстанций. Увидев потенциальную пиар-кампанию, полковник Гарри Шоуп и CONAD начали "отслеживать" Санту и распространять информацию о его местонахождении среди детей по всему миру. Сегодня НОРАД продолжает эту традицию, осуществляя "слежение" через Интернет, и люди во всем мире по-прежнему могут узнать местонахождение Санты с точностью до минуты!"
  Xmas.2.d:0 "В Советском Союзе Новый год стал подлинно национальным праздником, заменившим Рождество. Этому предшествовала отмена Рождества в 1929 году. Новый год впервые отмечался в 1935 году. Старые атрибуты Рождества были секуляризированы - Дед Мороз, елка и подарки под ней. В 1937 году у Деда Мороза появился обязательный спутник - Снегурочка. В советское время также появились свои атрибуты Нового года: мандарины, салат "Оливье", удар Кремлевских курантов, во время которого нужно загадать желание, и праздничное обращение руководителя государства к гражданам. В Российской империи в новогоднюю ночь устраивались балы, в советское время их заменили концерты и застолья "Огонек", которые сопровождаются традиционными песнями, такими как "В лесу родилася йолочка" и "Пять минут"."
  Xmas.3.d:0 "Рождество в Белом доме в Вашингтоне, округ Колумбия, всегда было традицией каждого президента. Наиболее важной является рождественская елка в Белом доме, впервые неофициально использованная в 1850-х годах, но не продолжавшаяся до 1961 года, когда Жаклин Кеннеди выбрала елку и использовала тему Щелкунчика. Чаще всего елку выбирают из штата Северная Каролина, ее дарит Национальная ассоциация рождественских елок, и она выставляется в Голубой комнате Белого дома. Елка высотой около 18 футов каждый год украшается в определенной тематике, причем украшения часто приносят школьники, военнослужащие или пациенты больниц. Эта традиция, сохраняющаяся и по сей день, является проверенной временем и олицетворяет американский дух в праздничный сезон".
  Xmas.4.d:0 "Отходя от традиционных живых елок, в середине 1950-х годов появилась первая искусственная разновидность - недолговечная алюминиевая елка, ставшая чрезвычайно популярной в 1960-х годах в Соединенных Штатах. Известная под названием "Эверглем", компания Aluminum Specialty Company в Манитовеке, штат Висконсин, производила более миллиона алюминиевых елок в год. Конец алюминиевой рождественской елки можно приписать премьере фильма "Рождество Чарли Брауна" (A Charlie Brown Christmas) в 1965 году, в котором елки были изображены как символ чрезмерной коммерциализации Рождества. Оставаясь и по сей день заброшенной культурной иконой или пылясь в подвалах, алюминиевая елка представляет собой временное увлечение в американской культуре."
  Xmas.5.d:0 "Возможно, самой любопытной рождественской традицией во всем мире являются рождественские лекции Королевского института Великобритании. Начатая в 1825 году как способ продвижения организованного образования в области науки, традиция презентаций научных явлений продолжает жить, начав транслироваться по телевидению в 1965 году на канале BBC. Такие деятели, как Майкл Фарадей, Карл Саган и Дэвид Аттенборо, читали лекции, делая науку интересной для публики в праздничный сезон."
 