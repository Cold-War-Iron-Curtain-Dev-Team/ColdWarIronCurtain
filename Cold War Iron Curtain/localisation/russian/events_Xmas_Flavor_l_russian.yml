 Xmas.1.d:0 "Программа слежения за Санта-Клаусом Североамериканского командования воздушно-космической обороны (NORAD) началась 24 декабря 1955 года, когда номер телефона командного центра континентальной противовоздушной обороны (CONAD) был случайно вписан в рекламу универмага Sears, предлагавшего на тот момент позвонить Санте. В результате в CONAD в Колорадо-Спрингс начали поступать звонки от детей, в том числе и на красный телефон, по которому передавались приказы от высших инстанций. Поняв, что это может стать отличной кампанией по связям с общественностью, полковник Гарри Шоуп и его команда решили начать \"отслеживать\" Санту и делиться информацией о его местоположении с детьми по всему миру. Сегодня NORAD продолжает эту традицию, предоставляя онлайн-трекинг, и люди по всему миру могут, позвонив, узнать место с точностью до минуты, где сейчас пролетает Санта."
 Xmas.2.d:0 "В Советском Союзе Новый год стал подлинно национальным праздником, фактически заменив Рождество. Это произошло после отмены Рождества в 1929 году, и первый советский Новый год был отмечен в 1935 году. Традиции Рождества были секуляризированы — появился Дед Мороз, елка и подарки под ней. В 1937 году к Деду Морозу присоединилась его обязательная спутница — Снегурочка. Советский Новый год приобрел свои уникальные атрибуты, такие как мандарины, салат \"Оливье\", удар Кремлевских курантов, который сопровождался загадыванием желания, а также праздничное обращение руководителя страны. В Российской империи в новогоднюю ночь устраивались балы, а в советское время их заменил \"Голубой огонек\", который сопровождался исполнением традиционных песен, таких как \"В лесу родилась елочка\" и \"Пять минут\"."
 Xmas.3.d:0 "Рождество в Белом доме в Вашингтоне всегда было важной традицией для каждого президента. Наиболее значимой частью этого праздника является рождественская елка, впервые неофициально установленная в 1850-х годах, но ставшая постоянным гостем лишь в 1961 году, когда Жаклин Кеннеди выбрала ее и тему из \"Щелкунчика\" в качестве традиционных рождественских атрибутов. Елку, как правило, выбирается в штате Северная Каролина и предоставляется Национальной ассоциацией рождественских елок. Она выставляется в Голубой комнате Белого дома. Каждый год, достигающую высоты в около 18 футов елку наряжают в определенной тематике, а украшения часто приносят школьники, военнослужащие или пациенты больниц. Эта традиция, сохраняющаяся и по сей день, олицетворяет американский дух праздников и является уже укоренившейся в обществе традицией."
 Xmas.4.d:0 "В отличие от традиционных живых рождественских елок, в середине 1950-х годов появилась первая искусственная альтернатива — алюминиевая рождественская елка. Она стала чрезвычайно популярной в 1960-х годах в США. Компания Aluminum Specialty Company из города Манитовок, штат Висконсин, производила более миллиона таких в год, и использовала название \"Evergleam\" для этого бренда. Закат алюминиевых рождественских елок пришелся на 1965 году, когда в фильме \"Рождество Чарли Брауна\" они были изображены как символ чрезмерной коммерциализации праздника. Алюминиевые елки, ставшие культовой забытой деталью американской культуры, теперь часто оказываются пылящимися в подвалах, символизируя непродолжительную забаву."
 Xmas.5.d:0 "Одной из самых необычных рождественских традиций в мире являются рождественские лекции Королевского института Великобритании. Эта традиция, зародившаяся в 1825 году как способ популяризации научного образования, сохраняется и сегодня. С 1965 года лекции транслируются на канале Би-би-си, привлекая внимание широкой аудитории. Среди лекторов были такие выдающиеся ученые и популяризаторы науки, как Майкл Фарадей, Карл Саган и Дэвид Аттенборо, превращая сложные научные доводы в увлекательное рождественское приключение."