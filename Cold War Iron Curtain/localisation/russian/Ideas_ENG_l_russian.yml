l_russian:
 NHS_idea: "Национальная Служба Здравоохранения"
 NHS_idea_desc: "НЦЗ, образованная в 1948 году, представляет собой программу, предназначенную для предоставления доступного медицинского обслуживания всем гражданам Британии, будь то бедные, старики или инвалиды."
 HighMilitarism: "Высокий уровень милитаризма"
 HighMilitarism_desc: "Чтобы обезопасить Британию от постоянно растущей угрозы коммунизма, необходима дальнейшая мобилизация населения и экономики страны."
 lowmilitarism: "Низкий уровень милитаризма"
 lowmilitarism_desc: "В то время как коммунизм крепнет с каждым днем, мы должны бороться с этим не путем запугивания, а путем демонстрации превосходства нашего общества. Наш народ сохранит свои свободы, как бы ни угрожал ему коммунизм."
 God_Save_Empress: "Боже, храни короля!"
 God_Save_Empress_desc: "С возрождением Империи и ее централизацией, миллионы наших граждан вновь зажглись патриотизмом и теперь стекаются в вербовочные центры, чтобы сражаться за короля и страну."
 RuleBritannia: "Правь, Британния!"
 RuleBritannia_desc: "Правь Британия! правь Британия морями!"
 EURATOM: "ЕВРОАТОМ"
 britain_nuke_sharing: "Содружество Совместного Использования Ядерного Оружия"
 National_Economic_Development_Council: "Национальный совет по экономическому развитию"
 british_advisors: "Британские Советники"
 ENG_queen_elizabeth: "Елизавета II"
 ENG_queen_elizabeth_desc: "Елизавета Александра Мария из Виндзорского дома, официально известная как Елизавета II, является королевой Соединенного Королевства и ее Королевств Содружества. Она была коронована 2 июля 1953 года. Роль королевы не обходится без определенных обязанностей. Ее личность является ярким примером для нашей великой нации."
