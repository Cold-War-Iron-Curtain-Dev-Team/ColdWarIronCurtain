 ### Iceland 
  
 ICE_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но. 4 Mk I"
 ICE_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 ICE_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и эта винтовка оставалась на вооружении австралийских войск до Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 SLR"
  
 ICE_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 ICE_infantry_equipment_1_short: "FN FAL"
 ICE_infantry_equipment_1_desc: "FN FAL является одним из самых производимых пистолетов в истории. Благодаря своей распространенности и широкому использованию среди военных многих стран НАТО и стран первого мира во время холодной войны, он получил название \"Правая рука свободного мира\"."
  
 ICE_infantry_equipment_2: "Heckler & Koch G3"
 ICE_infantry_equipment_2_short: "G3"
  
 ICE_infantry_equipment_3: "Kongsberg Våpenfabrikk AG-3"
 ICE_infantry_equipment_3_short: "AG-3"
  
 ICE_infantry_equipment_4: "Diemaco C8"
 ICE_infantry_equipment_4_short: "C8"
 ICE_infantry_equipment_4_desc: "Карабины Diemaco C8 - это варианты карабинов семейства C7, механически и эстетически очень похожие на Colt 653. Первоначально Colt производил C8 для канадских сил как Colt Модель 725. C8 имеет ствол длиной 368 мм (14,5 дюйма) с профилем A1, как у карабина Colt Модель 653 M16A1"
  
