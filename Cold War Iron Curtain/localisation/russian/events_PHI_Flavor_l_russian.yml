 PHI_Flavor.1.d: "Из Манилы поступают сообщения о том, что президент Филиппин Рамон Магсайсай погиб в результате авиакатастрофы на острове Себу, что было подтверждено местными властями. Магсайсай, известный своим партизанским движением против японских войск в 40-е годы и ярыми антикоммунистическими взглядами, был поляризующей фигурой в филиппинском правительстве. Местные жители в Себу были допрошены властями, показавшими, что самолет филиппинского президента С-47 врезался в гору Пинатубо ранним утром. Перед смертельным исходом из Себу, чтобы вернуться в Манилу, Магсайсай должен был выступить с речами в трех учебных заведениях острова. Согласно сообщениям, 36 из 56 находившихся на борту погибли в результате крушения. По оценкам филиппинских и международных экспертов, сроки расследования могут составлять от пяти до семи месяцев."
