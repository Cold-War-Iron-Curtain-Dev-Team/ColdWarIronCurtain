  #Huks Insurgency Decisions 
 Huks_Insurgency_Decisions: "Решения повстанцев Хукбалахапа"
 Huks_Insurgency_Decisions_desc: "Во время Второй мировой войны социалистические и коммунистические активисты сформировали крестьянскую партизанскую армию под названием Hukbalahap или Huks для борьбы с оккупационными японскими войсками. Несмотря на то, что филиппинское правительство подняло много бойцов и сыграло определенную роль в освобождении Филиппин, оно активно стремилось насильственно разоружить хуков, арестовать их членов и отказывается принимать избранных ими кандидатов в правительство. Ссылаясь на продолжающийся отказ правительства прекратить репрессии или решить проблемы крестьян, эскадрильи Гукса вновь активизировались, чтобы вести партизанскую революционную войну против правительства.\n\nСила Hukbalahap: [?ROOT.huks_insurgency]%"
  
 HUK_insurgency_options.1.d: "С тех пор как хуки начали свою кампанию против правительства, они начали жестокие нападения на проправительственных жителей деревни и чиновников. Террористические нападения, в частности, настроили многих людей против них, в том числе среди крестьян, за которых, как утверждают хуки, они сражаются. Наши разведчики недавно завербовали небольшую сеть сочувствующих крестьянам в этом районе, которые предоставили нам имена известных деревенских жителей, поддерживающих врага, а также расположение эскадрилий Хука в этом районе. С этой информацией мы смогли развернуть батальонную боевую группу, чтобы искоренить мятежников, задержать их сторонников и занять про-повстанческие деревни. Новые операции, подобные этой, обеспечат конец этим мятежникам."
 HUK_insurgency_options.2.d: "С тех пор как хуки начали свою кампанию против правительства, они начали жестокие нападения на проправительственных жителей деревни и чиновников. Террористические нападения, в частности, настроили многих людей против них, в том числе среди крестьян, за которых, как утверждают хуки, они сражаются. Наши разведчики недавно завербовали небольшую сеть сочувствующих крестьянам в этом районе, которые предоставили нам имена известных деревенских жителей, поддерживающих врага, а также расположение эскадрилий Хука в этом районе. С этой информацией Боевая группа батальона двинулась в атаку на повстанцев, захватила их сторонников и заняла вражеские деревни. Однако наши войска столкнулись с засадами при столкновении с повстанцами, и задержанные крестьяне оказались либо проправительственными, либо нейтральными. Что еще более важно, оккупированные деревни также были нейтральными. Похоже, информаторы работали на хуков, и операция закончилась только укреплением поддержки хуков в этом районе."
 HUK_insurgency_options.3.d: "Боевая группа батальона (BCT) идентифицировала повстанцев-хуков, нацелившихся на деревни в этом районе. Войска смогли идентифицировать деревню, используемую в качестве базы. После того, как местность была должным образом разведана, командующий перевел войска на позиции. Когда был отдан приказ, деревня подверглась нападению. Эскадрилью Хуков легко было выкорчевать и уничтожить. Деревенские постройки, использовавшиеся повстанцами, также были разрушены, чтобы наказать их сторонников. Кроме того, БКТ захватил вражеское оружие, документы и припасы. Командир БКТ проделал отличную работу, используя свое подразделение для нейтрализации сил противника. Стратегия использования этих единиц меньшего размера, безусловно, приносит свои плоды."
 HUK_insurgency_options.4.d: "Батальонная боевая группа (BCT), действующая в районе с несколькими эскадрильями Huk, попыталась начать операцию зачистки, чтобы очистить повстанцев от боевиков. Тем не менее, командующий распределил свои силы немного тоньше, чтобы покрыть больше территории, и повстанцы, искусные в партизанской войне из-за их опыта против японцев, воспользовались этим. Нам не удалось уничтожить ни одного повстанца, и некоторые из тех, кто был слишком изолирован, попали во вражеские засады. Силы БКТ вернулись на свою базу, но провал операции повредил моральный дух и поколебал доверие солдат к своим офицерам. Что еще более важно, боевики Хук в этом районе действуют более открыто, чем раньше."
 HUK_insurgency_options.5.d: "Наши Военно-воздушные силы стремятся продемонстрировать свои возможности после реформ, начатых после окончания Второй мировой войны и японской оккупации. Недавно в одной из местных деревень был обнаружен командный центр повстанцев Хук. ВВС направили несколько истребителей, которые нанесли ближний авиаудар, нацеливаясь на повстанцев вокруг деревни и самого командного центра. Перехваченные сообщения подтверждают, что мы уничтожили центр, включая старшего лидера повстанцев. Боевики повстанцев в деревне также понесли потери, мы надеемся, что это помешает этой эскадрилье продолжать действовать против наших сил. Это был крупный успех для ВВС."
 HUK_insurgency_options.6.d: "Наши ВВС стремятся продемонстрировать свои возможности после реформ, начатых после окончания Второй мировой войны и японской оккупации. Была обнаружена повстанческая эскадрилья Хука, действовавшая вблизи деревни. ВВС направили несколько истребителей, которые нанесли удар по деревне и окрестностям предполагаемых боевиков. Однако, хотя удары были успешными, похоже, что бойцов Хук в то время в этом районе не было. Вместо этого самолеты в конечном итоге попали в деревню и случайно нацелились на жителей деревни. Известие о забастовке оттолкнуло деревни в этом районе и помогло вражеской пропаганде, что мы не заботимся о крестьянах, это, несомненно, будет стимулом для хуков, которые теперь получат больше общественной поддержки и рекрутов."
  
 HUK_insurgency_options.10.d: "Хуки показали свою истинную личность как бандиты и головорезы с их жестокими нападениями на безоружные деревни и террористическими убийствами. Эти операции начали настраивать против них народ и, что еще важнее, крестьян, среди которых они прятались. Наши собственные силы вначале допустили несколько ошибок в подходе, но со временем боевые группы батальонов адаптировали свою тактику и все больше избегали отчуждения людей. Мы начали уничтожать многие эскадрильи хука и отталкивать их от крестьян, загоняя в изолированные джунгли. Наконец, мы смогли организовать крупное наступление против оставшихся сил хуков, разгромив их по частям и захватив в плен их старших руководителей. На данный момент хаки больше не являются сплоченной силой, и старшие лидеры, которых мы захватили, согласились сдаться нашим силам. Это великая победа филиппинского правительства и народа."
 HUK_insurgency_options.11.d: "Во время Второй мировой войны Хукбалахап были одной из крупнейших антияпонских партизанских сил в стране. Несмотря на их заслуги, правительство при поддержке американцев решило принудительно разоружить гуков, и это заставило их объявить правительству войну за права крестьян. Попытки правительства подавить мятежников с помощью военных действий закончились неудачей, поскольку эскадрильи Хук оказались весьма искусными в борьбе с обычной тактикой. Кроме того, некоторые грубые действия правительственных войск только оттолкнули крестьян, которые все больше и больше симпатизировали делу Гук. Со временем, по мере роста общественной поддержки, ряды хуков расширялись, а деревенские протесты значительно поредели. Когда люди в городе присоединились к протестам, позиция правительства оказалась несостоятельной, и они недавно объявили, что капитулируют перед Хукбалахапом и их требованиями прав крестьян."
  
