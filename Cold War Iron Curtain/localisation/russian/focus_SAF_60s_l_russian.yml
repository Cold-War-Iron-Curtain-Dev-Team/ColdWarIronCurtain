 saf_news.1.d: "Южноафриканская полиция попала под пристальное внимание властей после того, как появились новости о том, что полицейские открыли огонь по толпе протестующих. Толпа протестовала против законов, принятых правительством белого меньшинства Южной Африки, когда полиция встревожилась и начала стрелять в протестующую толпу. Подкрепления и слезоточивый газ были использованы в попытках рассеять толпу, но это только привело к тому, что протестующие стали более жестокими. Протестующие бросали камни и совершили несколько драк, прежде чем произошла резня в Шарпвилле, как ее окрестили. В результате чего погибло 249 человек - 29 из них дети. Мировые лидеры и международные организации уже выступили с осуждением Национальной партии ЮАР и ее продолжающегося использования апартеида"
 saf_news.200.d: "Сегодня скончался Хендрик Вервуд, президент Южной Африки, которого многие считают основателем апартеида. В 2:15 по местному времени неизвестный помощник депутата нанес президенту четыре удара ножом. Президента срочно доставили в больницу где он скончался от ранений. Президент ранее пережил покушение на убийство, но на этот раз, несмотря на помощь подготовленных медиков, ему не так повезло. \nВервуд во время своего пребывания на посту президента создал Южноафриканскую Республику, подчеркивая англофобию и изоляционизм, чтобы придать доверие своему режиму. Его действия привели к отстранению сборной ЮАР от многих спортивных соревнований. В свой первый срок он также столкнулся с критикой Организации Объединенных Наций и их санкций. Во время его правления был создан южноафриканский военно-промышленный комплекс. Кроме того, он, возможно, создал южноафриканскую программу ядерного и биологического оружия, но это пока не подтверждено.\nОднако многие сомневаются, что это будет концом апартеида."
