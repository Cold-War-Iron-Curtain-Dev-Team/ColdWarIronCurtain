l_russian:
 cubamc.1.d: "Белый дом дал указание Пентагону начать развертывание эскадрилий ядерных ракет Юпитер в Италии и Турции. Развертывание в Италии защитит от коммунистической агрессии со стороны советского блока. Ракеты в Турции будут защищать южный фланг НАТО от подавляющей советской агрессии. Итальянское и турецкое правительства согласились на развертывание после встреч один на один с американскими дипломатами. Ракеты Юпитер - это баллистические ракеты средней дальности, и их развертывание вызывает большую озабоченность со стороны Советского Союза. Москва считает, что ракеты являются первым ударным оружием, которое размещают так близко к советской территории, чтобы сократить их потенциальное время реагирования в случае войны. Для американского правительства это развертывание призвано поддержать союзников НАТО, которые живут в постоянном страхе перед потенциальной советской агрессией."
 cubamc.2.d: "Размещение американских ядерных ракет Юпитер в Турции и Италии является прямой угрозой стабильности и обороноспособности Советского народа. Высшее военное руководство и премьер-министр Никита Хрущев разработали план секретного размещения советских ракет на Кубе под названием операция «Анадырь». Это восстановило бы стратегический баланс и заставило бы американцев дважды подумать о том, чтобы размещать ракеты вблизи наших границ. Чтобы заложить основу для этого, мы должны заручиться сотрудничеством Кубы и её лидера президента Фиделя Кастро. Глава наших ракетных войск стратегического назначения маршал Сергей Бирюзов направляется в Гавану и просит поддержку Кубы."
 cubamc.3.d: "Маршал Сергей Бирюзов провёл первые переговоры с кубинским лидером Фиделем Кастро. Он рассказал о планируемом тайном размещении наших войск на острове и призвал к сотрудничеству. Кастро иногда с энтузиазмом относился к этому предложению, говоря, что это накажет американцев за их агрессию по отношению к кубинскому народу. Однако он выразил опасение, что принятие размещения такого оружия сделает его советской марионеткой и повредит делу революции в Америке. Вместо размещения ракет Кастро предложил контрпредложение, в котором Советский Союз заключит оборонный союз с Кубой. Это гарантировало бы кубинцам независимость от дальнейшей американской агрессии и унизило бы их за неспособность подавить Кубинскую революцию. Мы должны поручить Бирюзову настоять на развертывании ракет, иначе мы можем принять контрпредложение."
 cubamc.4.d: "Наши представители вежливо отклонили кубинское контрпредложение, мы объяснили, что Соединенные Штаты уже знают о тесных отношениях между нашими народами. Затем мы вновь заявили о своем намерении разместить стратегические ракеты на Кубе. Такое действие не только унизило бы американцев, но и прочно поставило бы их в то положение, в которое они поставили кубинский народ своими постоянными угрозами вторжения. После некоторого размышления мы рады сообщить, что президент Фидель Кастро согласился и объявил, что Куба будет тепло приветствовать советское развертывание. С полученным одобрением уже разрабатываются планы загрузки грузовых судов строительным оборудованием, вооружением и личным составом, чтобы мы могли быстро ввести ракеты в эксплуатацию. Наше первое развёртывание, скорее всего, займет месяц."
 cubamc.5.d: "Наши представители вежливо отклонили кубинское контрпредложение, мы объяснили, что Соединенные Штаты уже знают о тесных отношениях между нашими народами. Затем мы вновь заявили о своем намерении разместить стратегические ракеты на Кубе. Такое действие не только унизило бы американцев, но и прочно поставило бы их в то положение, в которое они поставили кубинский народ своими постоянными угрозами вторжения. К сожалению, президент Фидель Кастро снова отказался. Он настаивал на том, что лучшим способом продвижения вперед было бы подписание оборонительного союза. Он выразил опасение, что если секретное размещение современного советского оружия будет обнаружено, американцы поймут наши намерения. Это было бы катастрофой для дела революции в Америке. Понятно, что кубинцы не помогут нам в операции Анадырь. Мы должны решить, подпишем ли мы альянс, что повредит положению Соединенных Штатов в регионе, или просто скажем кубинцам, что мы подумаем и закончим переговоры."
 cubamc.6.d: "Сегодня в Гаване высокопоставленные представители Советского Союза подписали оборонительный союз с кубинским правительством во главе с президентом Фиделем Кастро. Договор гарантирует, что обе страны встанут на защиту друг друга в случае агрессии. Соглашение изображается и рассматривается как прямой ответ Соединенным Штатам. Президент Кастро в своем выступлении отметил, что договор показывает, насколько глубоко советский народ заботится об угнетенных народах мира. Советское правительство опубликовало свое собственное заявление, в котором заявило, что оно никогда не оставит народ Кубы и будет продолжать помогать его революционному пути. В Соединенных Штатах газеты критиковали Белый дом за то, что он уступил Кубу коммунистическому блоку, и высказывали опасения, что кубинцы могут расширить свои дестабилизирующие усилия по всему региону. Аналитики также утверждают, что договор напрямую бросает вызов заветной доктрине Монро, которая объявляет Западное полушарие частью американской сферы влияния."
 cubamc.7.d: "Грузовые суда из Советского Союза, перевозившие войска, инженеров, руководителей и тяжелую технику, недавно приземлились на Кубе. Двигаясь тайно, они уже приступили к модернизации кубинских аэродромов и подготовке стартовых площадок для размещения баллистических ракет. Кадры, отобранные для этого задания, являются одними из лучших и наиболее лояльных во всем Советском Союзе. Мы не ожидаем, что американцы узнают о нашей деятельности из разведывательных источников на острове. База и ракетные экипажи охраняются крупными советскими силами, а ВВС также развернули истребители для усиления противовоздушной обороны объектов."
 cubamc.8.d: "ЦРУ проводило регулярные воздушные разведывательные полеты над Кубой, дабы определить намерения Советского Союза в данном регионе. Однако в последнее время эти полеты были прекращены из-за риска международных инцидентов и прибытия современных советских ЗРК для кубинских военных. Разведывательный полет ВМС недавно заметил советский грузовой корабль, который, по-видимому, перевозил ящики с советскими авиационными деталями на Кубу. Кроме того, разведданные указывали на размещение на Кубе объектов ЗРК по образцу тех, которые были созданы для защиты советских ядерных ракетных объектов. С этой информацией были возобновлены полеты самолетов-разведчиков, находящихся под контролем ВВС. Последующие фотографии были проанализированы, и были идентифицированы советские ядерные ракетные пусковые площадки. Президент был вскоре проинформирован, и он немедленно созвал заседание Исполнительного Комитета Совета национальной безопасности, чтобы сформулировать ответ. Для многих в правительстве советское ядерное развертывание на Кубе было сродни размещению ядерного оружия на американской земле."
 cubamc.9.d: "Президент Кеннеди созвал ИСПОЛнительный КОМитет совета национальной безопасности (исполком), чтобы изучить фотографии сделанные на Кубе и принять решение об ответных мерах. Все члены совета согласились, что решение должно быть принято как можно скорее. В конце концов, у президента Кеннеди было три варианта. Его первый доклад, представленный Объединенным комитетом начальников штабов, предусматривал немедленное нанесение авиаударов по сотням целей, а затем вторжение на Кубу. Президент отметил, что такой вариант, скорее всего, приведет к взятию Берлина Советами и ослаблению НАТО. Второй вариант, одобренный большинством членов совета, заключался бы в установлении блокады для предотвращения поступления на остров новых наступательных вооружений. Наконец, появилась возможность не отвечать. Некоторые члены комитета считали, что советская дислокация была слишком мала, чтобы нарушить баланс сил, и превратить её в проблему которая вызовет ненужную панику, подбодрившую советы."
  
 cubamc.10.d: "В новостях из Гаваны говорится, что американские самолеты бомбят объекты и инфраструктуру по всему острову. Они явно нацелены на наши строительные площадки и кубинскую оборонную инфраструктуру. Американский флот мобилизуется, и кубинцы ожидают скорого вторжения на Кубу. Уже ходят слухи, что на острове действуют американские десантники или спецназ. Президент Кубы Фидель Кастро срочно обратился к нам за помощью. Мы должны принять решение об адекватном ответе. Один из вариантов состоит в том, чтобы полностью поддержать Кубу и начать полное ядерное возмездие против Соединенных Штатов, которое опустошило бы обе наши страны. Второй вариант мог бы заключаться в том, чтобы разрешить нашим силам, уже находящимся на Кубе, вступить в бой с силами вторжения, что было бы более ограниченным ответом, но уменьшило бы риск ядерного обмена. Наши силы в сочетании с кубинцами могут переломить ход сражения. Наконец, мы можем сократить наши потери и сообщить президенту Кастро, что мы не будем препятствовать вторжению."
 cubamc.11.d: "Войска Соединенных Штатов и их союзников в Западном Берлине сдались советским военным. Американское командование приняло это решение, чтобы предотвратить гибель мирных жителей и сопротивление оказалось бы бессмысленным, и привело к гибели наших солдат. Советский захват Берлина - это ответ на вторжение Соединенных Штатов на Кубу. Советы утверждали, что их действия были оправданы, поскольку они обеспечивали свою собственную сферу влияния, как это делала Америка на Кубе. Американские союзники в Европе, как говорят, кипят от злости по поводу этой новости, и многие обвиняют безрассудные действия Соединенных Штатов в отношении Кубы в том, что они спровоцировали эту последнюю советскую акцию. Неизвестно, как отреагируют Соединенные Штаты, когда и планируют ли советы вернуть сдавшиеся войска. Многие в Европе опасаются, что ситуация перерастает в новую мировую войну."
 cubamc.12.d: "Военно-морской флот сообщил Белому дому, что блокада Кубы продолжается. Чтобы уменьшить эскалацию насилия или дать советам повод к эскалации, Госдепартамент смог добиться одобрения блокады не как акта войны, а как оборонительной меры для защиты Западного полушария. Это было сделано путем получения одобрения от Организации Американских Государств и обещания, что блокада предназначена только для предотвращения прибытия наступательных вооружений на остров в соответствии с условиями Рио-де-жанейрского договора 1947 года. Кроме того, мы предъявили ультиматум Советскому правительству, что наша блокада не прекратится до тех пор, пока все наступательные советские ракеты не будут выведены с острова."
  
 cubamc.13.d: "\nАмериканский народ был ошеломлен этим вечером, когда президент Джон Ф. Кеннеди сообщил нации о развёртывании советских ядерных ракет на острове Куба. В своем выступлении Кеннеди отметил, что любая ядерная ракета, запущенная с Кубы против любого государства в Западном полушарии, будет рассматриваться Советским Союзом как прямое нападение на Соединенные Штаты. Президент также сообщил о своем плане создания того, что он назвал карантином Кубы. Он заявил, что любые корабли, обнаруженные с наступательным оружием, не будут допущенны к Кубе. Он добавил, что военно-морской флот Соединенных Штатов будет осуществлять этот карантин из международных вод. Он подчеркнул, что карантин не остановит импорт предметов первой необходимости или невоенных товаров. Американские войска по всему миру также мобилизуются."
 cubamc.14.d: "Американцы узнали подробности операции Анадырь и знают, что мы намерены разместить ядерные ракеты на Кубе. Их недавнее объявление блокады и ультиматум нашему правительству о выводе ракет показывают, что операция больше не является секретом. У нас уже есть грузовые суда, направляющиеся на Кубу с оружием, и американская блокада вполне может стать первым шагом к серьезной эскалации конфликта. Руководство решило отдать приказ нашим силам на Кубе готовиться к вторжению, и наш посол сообщит президенту Кастро, что американцы знают, что у нас уже есть ракеты на острове, и он должен подготовить свои собственные силы."
 cubamc.15.d: "Ясно, что американский флот намерен взять на абордаж и осмотреть все наши корабли, поскольку они уже поднялись на борт и осмотрели судно из Ливана. Американский флот уже двигает свои корабли в направлении наших приближающихся грузовых судов. Капитаны наших кораблей отчаянно нуждаются в приказах. Мы должны решить, хотим ли мы, чтобы корабли заняли позицию и попытались договориться с американцами, или же мы должны продвигаться вперед, бросая вызов блокаде. Если мы пойдем по второму варианту, то за грузовыми судами будут пристально следить наши подводные лодки в этом районе. Напряженность продолжает нарастать по мере того, как советские войска по всему миру находятся в состоянии повышенной боевой готовности."
 cubamc.16.d: "После напряженных переговоров между Москвой и Вашингтоном, Белый дом получил твердое предложение от премьера Никиты Хрущева. Советский лидер пообещал вывести все ядерное оружие с Кубы при условии, что мы выведем наши ядерные ракеты из Турции и пообещаем не вторгаться на Кубу. Услышав это предложение, многие в администрации немедленно настояли на том, чтобы мы отвергли его и потребовали безоговорочного вывода советских войск. Для них советское предложение показывает слабость. Однако президент и его ближайшие советники, похоже, склонны согласиться на эту сделку, война на Кубе будет дорогостоящей, а ракеты в Турции в значительной степени устарели. По существу, Соединенные Штаты ничего не потеряют и достигнут своих целей, в то время как Советы смогут сохранить лицо на международном уровне. Однако не президент должен решать, какую позицию он займет, на волоске находятся жизни миллионов людей."
 cubamc.17.d: "До премьер-министра Никиты Хрущева и его первых лиц дошла весть о том, что американское правительство приняло его предложение прекратить Карибский кризис. Мало кто из присутствующих мог скрыть радость и облегчение от того, что решение было найдено. Советские военные уже получили указание вывести войска с Кубы и отозвать грузовые суда, направляющиеся на остров. Согласие американцев вывести свои ракеты из Турции приветствуется как стратегическая победа. Что еще более важно, добившись от американцев гарантии не вторгаться на Кубу, мы обеспечили себе Кубинскую революцию. Президент Фидель Кастро действительно выразил некоторое разочарование по поводу этого результата, но вскоре он поймет, что это был лучший результат."
 cubamc.18.d: "После напряженных двух недель, в течение которых мир затаил дыхание, Кубинский ракетный кризис подошел к концу. Соединенные Штаты и Советский Союз смогли договориться о том, что Советский Союз демонтирует и выведет свои ядерные силы с Кубы. Взамен Соединенные Штаты пообещали уважать суверенитет и права Кубы. Многие рассматривают это соглашение как победу Соединенных Штатов, хотя ходят слухи, что американское правительство, возможно, пошло на другие уступки в отношении развертывания своих ядерных сил. Несмотря на это, американский народ хвалит президента за его твердое руководство во время кризиса. В Советском Союзе они, по-видимому, были напряженными среди Политбюро, поскольку многие члены считали, что кризис не должен был достичь стадии перемирия."
 cubamc.19.d: "Мы получили известие, что американское правительство отвергло наши разумные предложения и требует безоговорочного вывода нашего ядерного оружия с Кубы. Высшее военное руководство говорит, что теперь у нас есть только два варианта. Во-первых, признать провал кубинского проекта и начать процесс вывода наших войск, к счастью, это не будет сложным процессом. Однако это было бы разрушительной дипломатической неудачей для нас. Другой вариант - приказать нашим конвоям двигаться дальше и попытаться прорваться через блокаду. Это может снова оказать давление на американцев, и они решат, хотят они войны или нет. Решение за нами, на кону будущее мировой революции."
 cubamc.20.d: "Теперь, когда стало известно, что Советский Союз начнет демонтаж и вывод всех своих ядерных сил с Кубы, весь Мир вздохнул с облегчением. Соединенные Штаты настаивают на том, что никакого соглашения не было достигнуто, и Советы решили принять правильное решение. Новости о выводе советских войск с Кубы были встречены американскими союзниками с похвалой, в то время как социалистические государства, как сообщается, очень разгневаны явной капитуляцией Советского Союза перед американскими требованиями. Кубинское правительство, как говорят, подавлено выводом советских войск, и Фидель Кастро в ярости, что Советы, по-видимому, покинули кубинскую нацию. Толпы людей появились в городах по всей Америке, чтобы отпраздновать сильное лидерство президента на протяжении всего кризиса."
 cubamc.21.d: "Пентагон сообщил Белому дому, что советские грузовые суда, вероятно, несущие наступательное оружие, пытаются пересечь блокаду. Наши военные корабли сделали строгие предупреждения, но конвои игнорируют их. Мы должны принять решающее решение, приказать нашим кораблям открыть огонь и нейтрализовать советские суда или отступить и пропустить их. Некоторые члены кабинета министров отмечают, что советское присутствие и ядерное оружие вряд ли окажут влияние на стратегический баланс, и мы должны отступить, а не рисковать гарантированным ядерным уничтожением. Другие, особенно военачальники, призывают наши силы осуществить блокаду и продемонстрировать серьезность наших намеренний, открыв огонь по неподчиняющимся судам. Необходимо принять решение."
 cubamc.22.d: "Когда советские суда прошли через военно-морской карантин Соединенных Штатов и прибыли на Кубу под шум фанфар, стало ясно, что американская политика провалилась. Соединенные Штаты ранее предупреждали, что любые суда, нарушающие их карантин, будут подвергаться риску насильственного захвата или обстрела, но этого не произошло. Военно-морские силы, поддерживающие карантин, уже возвращаются на свои базы. В Национальном обращении американский президент заявил, что он приказал кораблям отступить, чтобы сохранить мир и предотвратить гибель миллионов невинных людей. Он обвинил советы в том, что они играют с судьбой мира. Советы же, напротив, заявили, что Соединенные Штаты прекратили свое незаконное пиратство и что советское присутствие на Кубе призвано защитить маленькое островное государство, которое уже столкнулось с американской агрессией. На международном уровне советы рассматриваются как победители в кубинском ракетном кризисе и, как ожидается, расширят свое присутствие в регионе, поскольку мир возвращается с края пропасти."
 cubamc.23.d: "По сообщениям наших грузовых судов, направляющихся к Кубе, американские военные корабли ведут огонь по этим судам. У кораблей практически нет вооружения, и американцы, похоже, стреляют, чтобы остановить суда, а не уничтожить их, чтобы осмотреть их груз. Однако наши подводные лодки, сопровождающие корабли, приближаются, чтобы вступить в бой с американскими Военно-морскими кораблями. Американцы не заботятся ни о безопасности мира, ни о наших людях, и мы отдали приказ подводным лодкам защищать грузовые суда любой ценой. Надеюсь с элементом неожиданности наши суда одержат верх."
 cubamc.24.d: "Сообщения из Гаваны свидетельствуют о том, что у берегов Кубы произошли ядерные взрывы. Они появились после того, как стало известно, что военные корабли ВМС США ведут активные боевые действия против советских военно-морских судов, включая подводные лодки. Представитель Пентагона обратился с докладом, что советские подводные лодки, вооруженные ядерными торпедами, опрометчиво запустили их по американским кораблям, применяющим карантин, одобренный организацией американских государств. Он не располагал информацией о потерях или потерях ни одной из сторон. В Москве советские власти заявили, что американские военно-морские суда начали неспровоцированную атаку на невооруженные грузовые суда, вынудив советские подводные лодки ответить силой. Массовый хаос спускается в городах по всему миру, поскольку растут опасения полномасштабного ядерного уничтожения."
 cubamc.25.d: "На встрече с Объединенным комитетом начальников штабов, старшими членами Кабинета министров и высшими советниками президент Соединенных Штатов оказывается в ситуации, которой он отчаянно хотел избежать. Нельзя оставить без ответа вопрос о применении советским флотом ядерного оружия против американских кораблей. Есть некоторые призывы к эквивалентному ядерному удару по советским кораблям, но высшее военное руководство настаивает, что такой подход только даст советам больше времени и возможностей для поражения американских целей. Президент соглашается и отдает приказ Соединенным Штатам развязать полное ядерное возмездие, чтобы гарантировать, что Советский Союз больше не сможет угрожать миру. Он также приказал стране выполнить протоколы по ядерной обороне и подготовиться к катастрофическим человеческим жертвам. Настроение было мрачным, но все присутствующие понимали, что другого выхода нет."
  
 cubamc.26.d: "Высшее военное командование сообщило Политбюро, что американцы ответили полномасштабным ядерным ударом. Время политиканства или взвешенных ответов прошло. Военачальники отметили, что, несмотря на неизбежные разрушения, ожидающие огромные территории страны, мы все еще обладаем средствами, чтобы наказать их за агрессию. Затем советский премьер приказал ракетным войскам стратегического назначения подготовить и начать собственное полномасштабное наступление. Если американцы решили уничтожить советскую нацию, они столкнутся с такой же гибелью. Не было никакой радости или обсуждения, когда был отдан приказ, только мрачное осознание того, что каждый выполнил свой долг, и это был единственный выход."
 cubamc.27.d: "Прибывшая советская делегация настаивала на том, чтобы мы приняли их планы по размещению стратегических ракет на нашем острове. Они хотят сделать это тайно и утверждают, что это было бы более значимым действием, чем публичный договор об обороне, как мы предлагали. Если мы согласимся на Советскую просьбу, это укрепит наши связи и продемонстрирует искренность нашего народа. Кроме того, развертывание таких систем вооружений, даже тайно, вероятно, дало бы нам преимущества договора об обороне, но избежало бы американского контроля и вмешательства, которые, несомненно, последовали бы, если бы был подписан официальный договор. Однако, если бы американцы обнаружили это тайно развернутое оружие, они бы изобразили нас как советскую марионетку, задев нашу революционную репутацию. Мы должны решить либо согласиться на секретное размещение стратегических ракет, либо сообщить делегации, что мы хотим заключить договор о взаимной обороне."
 cubamc.28.d: "После интенсивной и обширной кампании воздушных бомбардировок, направленной на нейтрализацию советских ракетных объектов и Кубинской обороны, Соединенные Штаты объявили о высадке своих войск на Кубе. Соединенные Штаты стремятся нейтрализовать кубинское правительство и обеспечить, чтобы его народ и земля не использовались в качестве стартовой площадки для нанесения неисчислимых разрушений американскому народу. Советское правительство, как говорят, формулирует ответ, в то время как остается неизвестным, сколько жертв они или кубинцы получили в первых бомбардировках. Кубинский лидер Фидель Кастро демонстративно заявил, что его войска окажут сопротивление, и призвал всех кубинцев присоединиться к обороне острова от империалистической агрессии. Соединенные Штаты считают, что им пришлось действовать после обнаружения секретных советских ядерных ракетных объектов, строящихся на Кубе, которая находится менее чем в ста милях от американской земли."
 cubamc.29.d: "Когда американская незрелость подняла свою уродливую голову над ситуацией на Кубе и они заявили, что мы вмешались в их сферу влияния, мы решили ответить им тем же. Оккупированный союзниками Берлин находится в самом сердце социалистического мира и тем самым вмешивается в сферу нашего влияния. Недавно мы дали указание местным командирам оккупировать и выселить оккупационные войска из их района Берлина. К счастью, вражеские командиры поняли свое положение и отступили без насилия. Мы репатриируем их обратно на территорию НАТО. Взятие Берлина хорошо воспринимается народом, и союзники Соединенных Штатов по НАТО, как сообщается, разъярены тем, что американский авантюризм привел к падению оккупированного союзниками Берлина."
  
