l_russian:
  
 ROM_ww_capitals: "Крейсер типа "Элизабета""
 ROM_ww_capitals_short: "Крейсер типа "Элизабета""
 ROM_ww_capitals_desc: "Крейсер (Крейсер) типа "Элизабета"."
  
 ROM_battle_hull_light_0: "Легкий крейсер типа "Vifor""
 ROM_battle_hull_light_0_short: "Тип легкого крейсера "Vifor""
 ROM_battle_hull_light_0_desc: "Легкие крейсера (Разрушители) типа "Вифор" были возвращены в Румынию 12 октября 1945 года, где им вернули их прежние названия. Затем сестры были приписаны к эскадре эсминцев до начала капитального ремонта. Когда дивизия эсминцев была переименована в 418-ю дивизию эсминцев в 1952 году, Мэрэшти был переименован в D12. Корабль продолжал служить до апреля 1961 года, когда был выведен из эксплуатации и впоследствии выведен из эксплуатации."
  
 ROM_battle_hull_light_4: "Вертолетный крейсер проекта 999"
 ROM_battle_hull_light_4_short: "Вертолетный крейсер проекта 999"
 ROM_battle_hull_light_4_desc: "Вертолетный крейсер (Crucisatoare uşor Portelicopter) проекта 999. Строительство военного корабля началось 1 марта 1978 года на военной верфи 2 Мая в Мангалии. В 1984 году начались ходовые испытания. Военный корабль был первоначально классифицирован коммунистическим правительством как легкий крейсер и получил название Мунтения, в честь исторической провинции Румынии. Николае Чаушеску сам окрестил корабль 2 августа 1986 года. Крейсер был полностью румынским проектом, за исключением вооружения, которое было лицензионным или советского происхождения. Военный корабль имел чрезмерный верхний вес, что вызывало проблемы с устойчивостью даже в спокойных водах."
  
 ROM_screen_hull_heavy_0: "Тип "Regele Ferdinand""
 ROM_screen_hull_heavy_0_short: "Тип "Regele Ferdinand""
 ROM_screen_hull_heavy_0_desc: "Эсминцы (Distrugatoare) типа "Regele Ferdinand" В 1946 году, после реконструкции, были включены в состав румынского военно-морского флота под тем же названием Smeul. С 1954 года назначается Е-1. Исключен из состава флота в 1958-1959 годах. Разобран в 1960 году."
 ROM_screen_hull_heavy_1: "Корвет проекта 204E"
 ROM_screen_hull_heavy_1_short: "Корвет проекта 204E"
 ROM_screen_hull_heavy_1_desc: "Корвет проекта 204E (кодовое обозначение НАТО - "Поти"). Эти корабли были первыми советскими военными кораблями с газотурбинными двигателями; два винта были установлены в туннелях для обеспечения очень малой осадки. Сдвоенная 57-мм (2 дюйма) орудийная установка обеспечивала самооборону. 5 декабря 1968 года переведен в Румынию, где поступил на службу в Военно-морской флот в 1968 году."
 ROM_screen_hull_heavy_2: "Корвет проекта 1048"
 ROM_screen_hull_heavy_2_short: "Корвет проекта 1048"
 ROM_screen_hull_heavy_2_desc: "Адмирал Петре Барбуняну-корвет класса проект 1048 (кодовое обозначение НАТО - "Тетал I"). Базировался на фрегате советского военно-морского флота класса "Кони", но спроектирован в Румынии в меньших размерах, хотя и сохранил свою роль противолодочной обороны (противолодочной обороны). Они включили в свою конструкцию советское оружие и сенсоры. Суда этого класса имеют полное водоизмещение 1440 тонн (1420 длинных тонн) и длину 92,4 метра (303 фута 2 дюйма) с балкой 11,7 м (38 футов 5 дюймов) и осадкой 3 м (9 футов 10 дюймов). Корабли приводятся в действие четырьмя дизельными двигателями, приводящими в движение четыре вала, создающие 15 000 киловатт (20 000 л. с.)."
 ROM_screen_hull_heavy_3: "Корвет проекта 1048M"
 ROM_screen_hull_heavy_3_short: "Корвет проекта 1048M"
 ROM_screen_hull_heavy_3_desc: "Контр-адмирал Юстатиу Себастьян-корвет класса проект 1048М (кодовое обозначение НАТО - "Тетал II") - серия из двух корветов, используемых румынскими военно-морскими силами для несения службы в Черном море. Они имеют водоизмещение 1385 тонн, вертолет в кормовой части, а в качестве основного вооружения 76-мм пушку, торпедные аппараты и противолодочные ракетные установки."
 #ROM_screen_hull_heavy_4: "Type 22 frigate"
 #ROM_screen_hull_heavy_4_short: "Type 22 frigate"
 #ROM_screen_hull_heavy_4_desc: "Regele Ferdinand is a Type 22 frigate of the Romanian Naval Forces, formerly a Royal Navy ship named HMS Coventry. She was originally intended to be named Boadicea but was named Coventry in honour of the previous Coventry, a Type 42 destroyer sunk in the Falklands War. Following service in the Royal Navy she was sold to the Romanian Navy in 2003."
  
 ROM_screen_hull_medium_0: "Тип эсминцев "Vifor""
 ROM_screen_hull_medium_0_short: "Тип эсминцев "Vifor""
 ROM_screen_hull_medium_0_desc: "Эсминцы (Торпедоаре) типа "Вифор" 12 октября 1945 года возвращены в Румынию,исключены из состава ВМФ СССР 6 ноября 1945 года, модернизированы в 1946 году, введены в состав ВМФ Румынии в 1946 году как эсминец (Торпедорул), с 1948 года как эскортный корабль (Эскорторул), исключены в 1959 году и демонтированы на металл в 1960 году."
 ROM_screen_hull_medium_1: "Эсминцы типа "Налука""
 ROM_screen_hull_medium_1_short: "Тип эсминцев "Naluca""
 ROM_screen_hull_medium_1_desc: "Эсминцы (торпедоносцы) типа "Налука". 12 октября 1945 года вернулся в Румынию, исключен из состава ВМФ СССР 6 ноября 1945 года, модернизирован в 1946 году, введен в состав ВМФ Румынии в 1946 году как эсминец (Торпедорул), с 1948 года как эскортный корабль (Эскорторул), исключен в 1959 году и разобран на металл в 1962 году."
 ROM_screen_hull_medium_2: "Проект 122bis II серия"
 ROM_screen_hull_medium_2_short: "Проект 122bis II серия"
 ROM_screen_hull_medium_2_desc: "Сбит судостроительным заводом № 340 в Зеленодольске 10 сентября 1954 года, спущен на воду 13 ноября 1954 года, введен в состав Черноморского флота ВМФ СССР 11 мая 1955 года, исключен 10 ноября 1955 года и 10 ноября 1955 года передан Румынии, где вошел в состав ВМФ 24 декабря 1955 года в Мангалии."
 ROM_screen_hull_medium_3: "Проект 1241RE"
 ROM_screen_hull_medium_3_short: "Проект 1241RE"
 ROM_screen_hull_medium_3_desc: "Ракетные корабли (Nave Purtatoare de Rachete) проекта 1241RE (кодовое обозначение НАТО - "Тарантул I"). Заложен судостроительным заводом "Вымпел" в Андропове (с 1989 года Рыбинск), спущен на воду, временно введен в состав Черноморского флота ВМФ СССР 28 декабря 1989 года для испытаний и последующей передачи Румынии, исключен из состава ВМФ СССР и передан Румынии 12 сентября 1990 года, где был введен в состав ВМФ 12 января 1992 года."
 ROM_screen_hull_medium_4: "Проект 883/3"
 ROM_screen_hull_medium_4_short: "Проект 883/3"
 ROM_screen_hull_medium_4_desc: "Эскортные корабли (Escortoare) проекта 883/3 (обозначение по коду НАТО - "Croitor")."
  
  
  # Submarine Hulls # 
  
 ROM_sub_hull_ww: "Тип подводной лодки "Дельфинул""
 ROM_sub_hull_ww_short: "Тип подводной лодки "Дельфинул""
 ROM_sub_hull_ww_desc: "Подводная лодка (Submarinul) типа "Дельфинул". Заложен верфью Cantieri Navali del Quarnaro в Фиуме в 1927 году для румынского военно-морского флота с запланированной датой поставки 7 декабря 1928 года, спущен на воду 22 июня 1930 года. 2 октября 1945 года он был возвращен Румынии в Галац и представлен как подводная лодка (Submarinul), исключенная из состава румынского флота 1 января 1958 года, а в 1959 году разрезанная на металл."
  
 ROM_sub_hull_small_single_0: "Подводная лодка проекта 298"
 ROM_sub_hull_small_single_0_short: "Подводная лодка проекта 298"
 ROM_sub_hull_small_single_0_desc: "Заложен" Santierul Naval Galati" в Галати в 1938 году, спущен на воду 5 мая 1941 года. 24 июня 1951 года он был возвращен Румынии и представлен как подводная лодка (Submarinul), сброшенная в 1959 году и разрезанная на металл."
  
 ROM_sub_hull_small_single_3: "Дельфинул"
 ROM_sub_hull_small_single_3_short: "Дельфинул"
 ROM_sub_hull_small_single_3_desc: "Дельфинул" ("Дельфин")-подводная лодка класса "Кило" румынских военно-морских сил. Он был сдан в эксплуатацию в августе 1985 года."
  
  
 ROM_sub_hull_large_single_0: "Проект S2 "Marsuinul""
 ROM_sub_hull_large_single_0_short: "Проект S2 "Marsuinul""
 ROM_sub_hull_large_single_0_desc: "Заложен" Santierul Naval Galati" в Галаце в 1938 году, спущен на воду 25 мая 1941 года, вошел в состав румынского флота в сентябре 1943 года, с 12 января 1949 года средняя подводная лодка."
  
  
  
  
