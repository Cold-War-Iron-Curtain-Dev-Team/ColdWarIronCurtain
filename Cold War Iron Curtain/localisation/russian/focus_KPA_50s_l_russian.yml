l_english:
 KPA_The_Stalinization_of_North_Korea: "Сталинизация Северной Кореи"
 KPA_The_Stalinization_of_North_Korea_desc: "Товарищ Сталин потратил десятилетия на искоренение контрреволюционных тенденций и обеспечение правильной социалистической доктрины и дисциплины. Мы принесем этот социализм народу и государству."
 KPA_Establish_Room_35: "Создать Комнату 35"
 KPA_Establish_Room_35_desc: "Центральный комитет признает необходимость улучшения координации наблюдения, как внутреннего, так и внешнего. Для достижения этой цели будет создан Департамент связи, также известный как Комната 35."
 KPA_Premier_Kim_il_Sung: "Премьер Ким Ир Сен"
 KPA_Premier_Kim_il_Sung_desc: "Верховное Народное Собрание подтвердило лидерство борца за свободу и революционера Ким Ир Сена. По мере укрепления своей власти лидер обещает осуществить социализм и освободить всю Корею."
 KPA_The_Korean_Peoples_Army: "Корейская Народная Армия"
 KPA_The_Korean_Peoples_Army_desc: "Бывшие корейские освободительные группы и партизанские отряды расформировываются и преобразуются в Корейскую народную армию для эффективной защиты революции от внешних и внутренних угроз. Для завершения этого перехода в профессиональные вооруженные силы потребуются новые учебные центры, доктрины и оборудование."
 KPA_The_Three_Year_Plan: "Трехлетний план"
 KPA_The_Three_Year_Plan_desc: "После разрушительного конфликта с глобальным империализмом партия объявила о трехлетнем плане восстановления. Народ Кореи построит базу для вечного роста."
 KPA_Launch_the_First_Five_Year_Plan: "Начало первого пятилетнего плана"
 KPA_Launch_the_First_Five_Year_Plan_desc: "После успешного восстановления государства партия теперь может руководить производством и развитием, чтобы вести людей к будущему процветания и единства при социализме."
 KPA_Emulate_Soviet_Culture: "Подражать советской культуре"
 KPA_Emulate_Soviet_Culture_desc: "Советский Союз — самое мощное и развитое социалистическое государство. Его партия преобразовала отсталое, суеверное население, чему мы можем научиться на этом примере."
 KPA_Enforce_State_Atheism: "Навязать государственный атеизм"
 KPA_Enforce_State_Atheism_desc: "Религия веками использовалась для эксплуатации корейских крестьян и рабочих. Партия больше не будет навязывать атеизм и просвещать людей, чтобы способствовать их развитию как истинных социалистов."
 KPA_Crackdown_on_Nationalist_Christians: "Преследование христиан-националистов"
 KPA_Crackdown_on_Nationalist_Christians_desc: "Корейские христиане долгое время ассоциировались с антияпонским колониализмом. Однако эти последователи должны принять истинно социалистическую идентичность. Христианство укоренено в американцах и других врагах революции."
 KPA_Rebuild_Pyeongyang_Steel_Production: "Восстановление производства стали в Пхенъяне"
 KPA_Rebuild_Pyeongyang_Steel_Production_desc: "Империалистические бомбардировщики получали особое удовольствие, разрушая расцветающую сталелитейную промышленность в Пхеньяне. Партия возглавит усилия по восстановлению этого производства до довоенного уровня."
 KPA_Rehabilitate_the_Coal_Sector: "Восстановить угольный сектор"
 KPA_Rehabilitate_the_Coal_Sector_desc: "Наше государство богато многими природными ресурсами, особенно углем. Усилия империалистических бомбардировщиков и спрос на солдат привели к резкому упадку в угольном секторе. Распределение рабочих и восстановление местной администрации восстановит уголь как основной ресурс."
 KPA_Increase_Machine_Tools_Production: "Увеличение производства станков"
 KPA_Increase_Machine_Tools_Production_desc: "Преданность, лояльность и способности корейского работника не имеют себе равных. Однако для выполнения производственных планов и быстрого развития государства необходимо сделать новый упор на увеличение станков и повышение производительности."
 KPA_Expand_the_Taian_Electric_Appliances_Factory: "Расширение фабрики электробытовой техники в Тайане"
 KPA_Expand_the_Taian_Electric_Appliances_Factory_desc: "Наш совет по планированию определил Taian Electric Appliance Factory как площадку, способную к быстрому расширению. Спрос на его товары растет по мере роста экономики, и поэтому его необходимо расширять, чтобы удовлетворить этот спрос."
 KPA_Embrace_Socialist_Realism: "Принятие социалистического реализма"
 KPA_Embrace_Socialist_Realism_desc: "Наши художники и скульпторы будут ориентироваться на социалистический реализм. Необходимо показать, что пролетариат принимает коммунистические ценности, чтобы прививать людям социалистические ценности."
 KPA_Establish_The_Writers_Union: "Создать Союз писателей"
 KPA_Establish_The_Writers_Union_desc: "Партия признает значение литературы для просвещения людей по вопросам социализма и революционного процесса. Должен быть создан Союз корейских писателей. Его председатель будет определять, какая литература должна быть опубликована и какие писатели пользуются покровительством государства."
 KPA_Promote_Russian_Language_Educaiton: "Содействовать изучению русского языка"
 KPA_Promote_Russian_Language_Educaiton_desc: "Советский Союз остается важным другом и образцом социалистического развития. В целях более эффективного обучения партия поручила соответствующим ведомствам содействовать обучению и овладению русским языком."
 KPA_Purge_the_Japanese_Collaborationist_Bureacracy: "Чистка японской коллаборационистской бюрократии"
 KPA_Purge_the_Japanese_Collaborationist_Bureacracy_desc: "Было много корейцев, тесно сотрудничавших с японским колониальным режимом. Они заявляют, что имеют необходимые административные знания необходимы для управления, однако нам не нужны эти империалистические практики."
 KPA_Establish_the_Political_Security_Agency: "Создать Агентство политической безопасности"
 KPA_Establish_the_Political_Security_Agency_desc: "Государству угрожают предатели внутри партии и в народе. Чтобы искоренить эту угрозу и защитить партию, будет создана новая организация под названием Агентство политической безопасности."
 KPA_Establish_Collective_Farms: "Создать колхозы"
 KPA_Establish_Collective_Farms_desc: "Сельское хозяйство является важной составляющей нашей экономики. В целях улучшения производства и перехода к социалистической экономике по всей стране будут созданы колхозы."
 KPA_Modernize_Fertilizer_Production: "Модернизация производства удобрений"
 KPA_Modernize_Fertilizer_Production_desc: "Наши фермеры продолжают полагаться на архаичные методы производства, особенно в сельском хозяйстве. Мы будем использовать наши ресурсы для производства современных удобрений для развития сельского хозяйства."
 KPA_Co_Opt_Non_Communist_Partie: "Скооперировать не коммунистические партии"
 KPA_Co_Opt_Non_Communist_Partie_desc: "Не коммунистические партии, к которым сейчас относятся терпимо, должны быть кооптированы и объединены в партию единым фронтом. Это обеспечивает легитимность и позволяет распространять революционную идеологию."
 KPA_Infilitrate_the_Democratic_Party: "Проникнуть в Демократическую партию"
 KPA_Infilitrate_the_Democratic_Party_desc: "Демократическая партия, несмотря на свою антиколониальную историю, тесно связана с христианами и в прошлом демонстрировала антикоммунистические тенденции. Мы поставим членов и агентов партии, чтобы они более внимательно следили за партией и искореняли реакционные элементы внутри нее."
 KPA_Expand_Farm_Production: "Расширение сельскохозяйственного производства"
 KPA_Expand_Farm_Production_desc: "Жестокие империалистические поджигатели войны работали над уничтожением нашего сельского хозяйства во время войны. Они стремились уморить голодом наш народ. Мы удвоим наши усилия, чтобы не только восстановить сельское хозяйство, но и расширить его."
 KPA_Major_Chinee_Financial_Grants: "Основные финансовые гранты Китая"
 KPA_Major_Chinee_Financial_Grants_desc: "Наши братья-социалисты в Китае предложили нам крупные финансовые гранты. Это финансирование будет иметь большое значение для нашего восстановления после войны с империалистами."
 KPA_Increase_Irrigation_Networks: "Увеличение ирригационных сетей"
 KPA_Increase_Irrigation_Networks_desc: "По мере того, как партия работает над восстановлением государства и его сельского хозяйства, растет понимание того, что расширение наших ирригационных сетей способствует увеличению сельскохозяйственного производства."
 KPA_Establish_the_Sangnong_Mine: "Создание шахты Сангнонг"
 KPA_Establish_the_Sangnong_Mine_desc: "Геодезисты обнаружили большое месторождение золота и других полезных ископаемых в провинции Южный Хамгён. Рудник Сангонг будет эффективно добывать эти ресурсы на благо народа и государства."
 KPA_Mass_Rural_Investments: "Массовые инвестиции в сельское хозяйство"
 KPA_Mass_Rural_Investments_desc: "Партия определила костяк экономики среди крестьян и сельской местности. Чтобы поддержать это, партия начнет масштабные инвестиции для поддержки экономического роста в сельской местности."
 KPA_Invest_in_the_Chongjin_Textile_Mill: "Инвестиции в текстильную фабрику Чхонджин"
 KPA_Invest_in_the_Chongjin_Textile_Mill_desc: "Чтобы поднять экономику, необходимо приложить усилия для создания промышленной базы. Текстильная фабрика в Чхонджине находится в идеальном состоянии для расширения."
 KPA_Increase_Workers_Pay: "Повышение заработной платы рабочих"
 KPA_Increase_Workers_Pay_desc: "Чтобы поощрить и вознаградить наших рабочих, партия повысит их заработную плату. Эта новая инициатива поможет подтолкнуть наших работников к достижению производственных целей."
 KPA_Subsidize_the_Chondoist_Chongu_Party: "Субсидии для Партии молодых друзей небесного пути"
 KPA_Subsidize_the_Chondoist_Chongu_Party_desc: "Чондоистская партия Чонгу имеет сильную антиимпериалистическую репутацию, и, чтобы поощрить их поддержку единого фронта, мы будем субсидировать их деятельность."
 KPA_Reaffirm_The_United_Front: "Подтвердить единый фронт"
 KPA_Reaffirm_The_United_Front_desc: "Партия инициирует ряд программ, чтобы публично продемонстрировать силу нашего единого фронта. Это отражает всеобщую поддержку партии и нашей легитимности."
 KPA_Expand_the_Democratic_Youth_League_of_Korea: "Развитие Демократической молодежной лиги Кореи"
 KPA_Expand_the_Democratic_Youth_League_of_Korea_desc: "Партия учредила Демократическую лигу молодежи Кореи, чтобы молодежному крылу обеспечивать социалистическую идеологическую обработку. С твердым единым фронтом организация может быть значительно расширена."
 KPA_An_Asian_Peoples_Democracy: "Демократия азиатских народов"
 KPA_An_Asian_Peoples_Democracy_desc: "Наши усилия по политической консолидации и созданию подлинно социалистического государства приносят свои плоды. Корейская Народно-Демократическая Республика стала подлинно азиатской народной демократией."
 KPA_Purge_the_Domestic_Faction: "Очистить внутреннюю фракцию"
 KPA_Purge_the_Domestic_Faction_desc: "Внутренняя фракция имеет долгую антиимпериалистическую историю, однако они по-прежнему связаны с Сеулом и идеологически скомпрометированы. Эта расходящаяся фракция должна быть очищена."
 KPA_Integrate_the_intelligentsia: "Интегрировать интеллигенцию"
 KPA_Integrate_the_intelligentsia_desc: "Партия и государство должны быть верховными, чтобы должным образом вести народ к процветанию и социализму. Для этого должна быть интегрирована высшая интеллигенция."
 KPA_Establish_the_Korean_Workers_Party: "Создание Корейской партии рабочих"
 KPA_Establish_the_Korean_Workers_Party_desc: "Мы начнем слияние Народной партии Кореи и создадим единую Корейскую рабочую партию для участия в следующем съезде."
 KPA_The_Fatherland_Liberation_War: "Отечественно-освободительная война"
 KPA_The_Fatherland_Liberation_War_desc: "Все корейские народы требуют свободы. Пришло время Корейской народной партии свергнуть марионеточный режим на юге и объединить Корею."
 KPA_Launch_Sweeping_Purges: "Начало масштабных чисток"
 KPA_Launch_Sweeping_Purges_desc: "Государство находится в опасном положении. Враги государства окружают партию. Мы должны работать быстро, чтобы искоренить все угрозы."
 KPA_The_Structure_of_The_Workers_Party: "Структура партии рабочих"
 KPA_The_Structure_of_The_Workers_Party_desc: "Чтобы усилить революцию, партия должна быть сильной. Мы начали реформы и начали чистку партии от контрреволюционных элементов. Мы должны решить, каковы следующие шаги."
 KPA_Reverse_the_Purges: "Отменить чистки"
 KPA_Reverse_the_Purges_desc: "Партия признает, что ее недавние чистки, к сожалению, ослабили Рабочую партию. Мы должны реабилитировать некоторых из членов, чтобы восстановить демократическую партию."
 KPA_Emulate_the_Soviet_Model: "Подражать советской модели"
 KPA_Emulate_the_Soviet_Model_desc: "Рабочая партия должна принять модель советской партии и работать над созданием элитарной, дисциплинированной партии."
 KPA_Execute_Cho_man_sik: "Казнить Чо Ман Сика"
 KPA_Execute_Cho_man_sik_desc: "Чо Ман Сик долгие годы был слабым звеном в партии. Его приверженность ненасилию только ослабили нашу позицию. Его отказ по-настоящему принять социализм делает его опасной угрозой, которую необходимо устранить."
 KPA_Launch_New_Show_Trials: "Запустить новые демонстрационные испытания"
 KPA_Launch_New_Show_Trials_desc: "Мы готовим новую серию публичных процессов по устранению врагов народа. Эти судебные процессы будут хорошо освещены и поднимут доверие народа к государству."
 KPA_Finding_a_Scapegoat: "В поисках козла отпущения"
 KPA_Finding_a_Scapegoat_desc: "Нельзя винить партию и доблестный народ ни в каких недостатках прошедшей войны. Мы должны разыскивать, разоблачать и уничтожать врагов народа."
 KPA_Criticize_The_Inability_of_the_Domestic_Faction: "Критиковать неспособность внутренней фракции"
 KPA_Criticize_The_Inability_of_the_Domestic_Faction_desc: "Внутренняя фракция обещала распространить социализм по всей Корее, но их неудачи очевидны. Они должны быть разоблачены и подвергнуты критике."
 KPA_Purge_Southern_Communists: "Чистка южных коммунистов"
 KPA_Purge_Southern_Communists_desc: "Коммунисты Юга годами давали смелые обещания. Тем не менее, там провалы были явно выявлены. Это указывает на то, что они не преданы революции и с ними нужно разобраться."
 KPA_Korean_Peoples_Army_Airforce: "ВВС Корейской Народной Армии"
 KPA_Korean_Peoples_Army_Airforce_desc: "Военно-воздушные силы Корейской народной армии защитят наше небо от капиталистических врагов. Ядром этих сил будет Корейское авиационное общество."
 KPA_Request_Yak_18s: "Запросить Як-18"
 KPA_Request_Yak_18s_desc: "ВВС Корейской Народной Армии нуждаются в бомбардировщиках для поддержки наших сухопутных войск в полевых условиях. Советский Як-18 соответствует этой потребности, мы будем просить предоставить эти самолеты."
 KPA_Blame_Yanan_Generals_for_Disaster: "Обвинить генералов Янаня в катастрофе"
 KPA_Blame_Yanan_Generals_for_Disaster_desc: "Трудности войны не могут быть виной партии или народа. Наоборот, это явно вина янаньских генералов. Эти подготовленные китайцами офицеры некомпетентны и должны быть уволены."
 KPA_Empower_the_State_Security_Apparatus: "Уполномочить аппарат государственной безопасности"
 KPA_Empower_the_State_Security_Apparatus_desc: "Аппарат государственной безопасности должен быть дополнительно усилен новыми полномочиями, чтобы искоренить скрытых врагов."
 KPA_Arrest_Pak_Hon-yong: "Арестовать Пак Хон Ёна"
 KPA_Arrest_Pak_Hon-yong_desc: "Видный член партии Пак Хон Ён оказался предателем революции. Его усилия по организации революционеров на юге явно потерпели неудачу, и его отсутствие влияния отражает отсутствие у него рвения. Хотя Запад и Советы могут противостоять действиям, мы не можем скомпрометировать революцию."
 KPA_Import_Soviet_Lavochkin_La_9s: "Импорт Ла-9"
 KPA_Import_Soviet_Lavochkin_La_9s_desc: "Нашим ВВС нужны истребители, чтобы защищать небо и обучать больше пилотов. Советский Ла-9 соответствует потребностям наших сил, и мы будем запрашивать истребители из Советского Союза."
 KPA_Soviet_MiG_15s: "МиГ-15"
 KPA_Soviet_MiG_15s_desc: "Воздушные технологии быстро расширяются, ВВС необходимо вступить в реактивную эру, чтобы эффективно справляться с любыми возможными угрозами. Советский МиГ-15 идеально подходит для наших нужд."
 KPA_MiG_21s: "МиГ-21"
 KPA_MiG_21s_desc: "Наши эксперты ВВС считают, что наличие сверхзвуковых реактивных истребителей необходимо для создания современного воздушного флота. С этими самолетами мы можем противостоять любой угрозе. Советы предоставят эти самолеты."
 KPA_The_Korean_Peoples_Army_Ground_Force: "Сухопутные войска Корейской народной армии"
 KPA_The_Korean_Peoples_Army_Ground_Force_desc: "Сухопутные войска Корейской народной армии представляют собой объединение нескольких групп сопротивления и вооруженных коммунистических банд, которые должны быть преобразованы в современные вооруженные силы."
 KPA_Soviet_T_34_85s: "T-34-85"
 KPA_Soviet_T_34_85s_desc: "Бронетанковые силы позволят нашим войскам быстро продвигаться в бою. Это крайне важно, если мы хотим освободить Корею и победить марионеточный режим. Советские Т-34-85 то что надо."
 KPA_Soviet_Weapon_Shipments: "Поставки советского оружия"
 KPA_Soviet_Weapon_Shipments_desc: "Советский Союз дал понять, что предоставит пехотное вооружение, чтобы наша армия была хорошо укомплектована и готова к будущим операциям."
 KPA_Import_the_PT_76: "Импорт ПТ-76"
 KPA_Import_the_PT_76_desc: "Ландшафт Кореи и наша потребность в быстром наступлении означают, что нам нужно больше бронетехники. Советский ПТ-76 отвечает нашим требованиям."
 KPA_The_Type_58_Assault_Rifle: "Винтовка Type 58"
 KPA_The_Type_58_Assault_Rifle_desc: "Наши ведущие военные эксперты признают, что нашим войскам нужна современная штурмовая винтовка, чтобы противостоять угрозам и побеждать наших врагов. Тип 58 - идеальное оружие."
 KPA_The_Korean_Peoples_Navy: "Корейский народный флот"
 KPA_The_Korean_Peoples_Navy_desc: "Корейский народный флот начинался как Морские силы безопасности. Для достижения наших целей наши военно-морские силы должны быть быстро расширены."
 KPA_Increase_Naval_Landing_Capabilitites: "Увеличение возможностей высадки на море"
 KPA_Increase_Naval_Landing_Capabilitites_desc: "Наша военно-морская доктрина требует способности быстро перебрасывать людей и технику вдоль побережья быстрыми атаками. Мы будем проводить больше учений и укреплять наши возможности."
 KPA_Establish_Naval_Training_Academies: "Создать военно-морские учебные академии"
 KPA_Establish_Naval_Training_Academies_desc: "Нам нужен обученный персонал, способный выполнять сложные операции. Для содействия этому развитию будут созданы новые учебные школы и академии."
 KPA_Expand_the_Wonsan_Naval_Base: "Расширить военно-морскую базу Вонсан"
 KPA_Expand_the_Wonsan_Naval_Base_desc: "Сильный флот нуждается в мощной базе для действий. Военно-морская база Вонсон — идеальное место для расширения."
 KPA_Projects_613_Submarines: "Подводная лодка пр.613"
 KPA_Projects_613_Submarines_desc: "Наше военно-морское руководство признает необходимость современного подводного флота для ведения боевых действий. Эту потребность удовлетворят советские дизельные подводные лодки проекта 613."
 KPA_Expand_the_Personality_Cult: "Расширить культ личности"
 KPA_Expand_the_Personality_Cult_desc: "Мы должны расширять преданность и признание лидера. Это укрепит преданность людей государству и будет способствовать увеличению производства."
 KPA_Purge_Ho_ka_i: "Убрать Хо Га И"
 KPA_Purge_Ho_ka_i_desc: "Хо Га И был высокопоставленным членом партии. Однако он проявил склонность к чрезмерному послушанию и преданности Советскому Союзу. Его отстранение от должности необходимо."
 KPA_An_Elite_Communist_Party: "Элитная коммунистическая партия"
 KPA_An_Elite_Communist_Party_desc: "Серия чисток в партии привела к искоренению неэффективных членов и угроз государству. Теперь мы элитная партия."
 KPA_The_Rehabilitation_of_the_Workers_Party: "Реабилитация Партии рабочих"
 KPA_The_Rehabilitation_of_the_Workers_Party_desc: "После ряда необходимых корректировок внутри Рабочей партии она, наконец, вернулась к своей надлежащей эффективности и функционированию."
 KPA_Rebuild_Hydroelctric_Dams: "Восстановить плотины гидроэлектростанций"
 KPA_Rebuild_Hydroelctric_Dams_desc: "Империалисты стремились уморить народ голодом, разрушая жизненно важные плотины гидроэлектростанций. Мы начнем программу восстановления этих объектов."
 KPA_Electrify_the_Cooperatives: "Электрифицировать кооперативы"
 KPA_Electrify_the_Cooperatives_desc: "Партия определила ключевые проблемы, влияющие на развитие и рост нашего аграрного сектора. Новая кампания по электрификации кооперативов позволит увеличить производственные мощности."
 KPA_Complete_the_Currency_Reform: "Завершить валютную реформу"
 KPA_Complete_the_Currency_Reform_desc: "Центральному банку необходимо реформировать нашу валюту. Вона заменит иену и не будет зависеть ни от какой марионеточной или империалистической валюты. Реформы будут включать привязку нашей валюты к советскому рублю."
 KPA_The_Death_of_Stalin: "Смерть Сталина"
 KPA_The_Death_of_Stalin_desc: "Советский лидер Иосиф Сталин был столпом социализма и революции. После его смерти социалистический мир будет внимательно следить за тем, продолжит ли новое советское руководство путь, проложенный Сталиным, или проложит новый, расходящийся путь."
 KPA_Execute_Ho_ka_i: "Казнить Хо Га И"
 KPA_Execute_Ho_ka_i_desc: "Хо Га И продолжает проявлять чрезмерное почтение к Советскому Союзу, а не к партии. Похоже, что Советы встали на расходящийся идеологический путь.С  Хо Га И со мной нужно разобраться."
 KPA_Execute_Pak_Hon-yong: "Казнить Пак Хон Ён"
 KPA_Execute_Pak_Hon-yong_desc: "Предательства и неудачи Пак Хон Ёна стоили корейскому народу большого счастья и жизни многих революционеров. За эти преступления есть только одно справедливое наказание."
 KPA_The_August_Faction_Incident: "Августовский инцидент в партии"
 KPA_The_August_Faction_Incident_desc: "Недавняя смена власти в Москве активизировала прокитайских и просоветских партийных лидеров. В настоящее время существует заговор с целью смены руководства партии..."
 KPA_Execute_Pak_Il-u: "Казнить Пак Иль-у"
 KPA_Execute_Pak_Il-u_desc: "Фракция Янань продемонстрировала недостаток способностей и революционной приверженности. Пак Иль-у, видный лидер этой фракции, без сомнения, является главной причиной этих неудач, и партия должна действовать, чтобы устранить эту опасность для революции."
 KPA_Tour_the_Eastern_Bloc: "Тур по Восточному блоку"
 KPA_Tour_the_Eastern_Bloc_desc: "Планируется, что Великий лидер и ключевые официальные лица будут путешествовать по странам Восточного блока. Они будут укреплять идеологическую поддержку среди расходящихся взглядов на социализм, возникающих среди коммунистических государств."
 KPA_A_New_Milestone_in_the_International_Workers_Movement_and_the_Might_of_Proletariat: "Новая веха в международном рабочем движении и мощи пролетариата"
 KPA_A_New_Milestone_in_the_International_Workers_Movement_and_the_Might_of_Proletariat_desc: "В главной партийной газете будет опубликована статья «Новая веха в международном рабочем движении и могущество пролетариата», в которой излагается мнение Великого Вождя о необходимости помнить социалистами о многих великих заслугах покойного товарища Сталина."
 KPA_The_Second_Arduous_March: "Второй Трудный Марш"
 KPA_The_Second_Arduous_March_desc: "Фракции внутри партии, лояльные внешним силам, добивались незаконного смещения Великого лидера. С ними нужно разобраться."
 KPA_Purge_the_Yanan_Faction: "Чистка фракции Яньаня"
 KPA_Purge_the_Yanan_Faction_desc: "Яньаньская фракция уже давно зарекомендовала себя как инструмент китайского влияния. Чтобы партия и государство выжили, эти враги и инструменты иностранных интересов должны быть устранены."
 KPA_Purge_the_Soviet_Faction: "Чистка фракции Советов"
 KPA_Purge_the_Soviet_Faction_desc: "Советская фракция оказалась столь же предательской, сколь и расходящейся Москва. Давно пора убрать эту фракцию."
 KPA_The_Guerila_Faction_Triumphant: "Триумф партизанской группировки"
 KPA_The_Guerila_Faction_Triumphant_desc: "С фракционной борьбой разбираются, партизанская фракция является авангардом партии."
 KPA_Reduce_Soviet_Influence: "Снижение советского влияния"
 KPA_Reduce_Soviet_Influence_desc: "Советы продолжают идти по расходящемуся идеологическому пути, мы должны уменьшить их влияние, чтобы защитить революцию."
 KPA_Condemn_Foriegn_Cultural_Influenes: "Осудить иностранное культурное влияние"
 KPA_Condemn_Foriegn_Cultural_Influenes_desc: "В корейской культуре есть все элементы для процветания, мира и стабильности. Внешние влияния должны быть очищены."
 KPA_Empower_Han_Sorya: "Усилить Хан Соль Я"
 KPA_Empower_Han_Sorya_desc: "Хан Соря — талантливый писатель и министр образования. Он будет возвышен и принесет большую эффективность партии."
 KPA_Decrease_Russian_Language_Education: "Сократить обучение русского языка"
 KPA_Decrease_Russian_Language_Education_desc: "Угроза расхождения идеологической мысли с Советским Союзом требует сделать шаг в сторону от курсов русского языка."
 KPA_The_Consolidaiton_of_Power: "Консолидация власти"
 KPA_The_Consolidaiton_of_Power_desc: ""
 KPA_Dismiss_Han_Sorya: "Уволить Хан Соль Я"
 KPA_Dismiss_Han_Sorya_desc: "Хан Соль Я был главным сторонником старого руководства. Он должен быть уволен с поста министра образования."
 KPA_Purge_the_Guerila_Faction: "Чистка партизанской группировки"
 KPA_Purge_the_Guerila_Faction_desc: "Партизанская фракция занималась реакционным культом героев. Они мешают революции и должны быть очищены."
 KPA_Dismantle_the_Personality_Cult: "Демонтаж культа личности"
 KPA_Dismantle_the_Personality_Cult_desc: ""
 KPA_Increase_Chinese_Cultural_Influences: "Повышение культурного влияния Китая"
 KPA_Increase_Chinese_Cultural_Influences_desc: "Китайская революция предлагает много параллелей с нашей собственной борьбой, мы можем многому у них научиться."
 KPA_Encourage_Chinese_Language_Education: "Поощрение обучения китайскому языку"
 KPA_Encourage_Chinese_Language_Education_desc: "Чтобы максимизировать то, чему мы можем научиться у наших китайских братьев-революционеров, необходимо уделять больше внимания урокам китайского языка."
 KPA_Rehabilitate_Purged_Soviet_Korean_Writers: "Реабилитация советских корейских писателей"
 KPA_Rehabilitate_Purged_Soviet_Korean_Writers_desc: "Некоторые из наших ведущих писателей подверглись чистке за связи с Советским Союзом, однако эти писатели многое сделали для партии и будут реабилитированы."
 KPA_Purge_Kim_Loyalists: "Чистка лоялистов Кима"
 KPA_Purge_Kim_Loyalists_desc: "Бывший генеральный секретарь отказался править на основе консенсуса и продвигал некомпетентных подхалимов. Эти люди должны быть сняты с постов, на которые они никогда не подходили."
 KPA_Embrace_Destalinization: "Принятие десталинизации"
 KPA_Embrace_Destalinization_desc: "Партия должна оставаться приверженной революционному пути и следовать за Советским Союзом в искоренении прежней практики, ослаблявшей революцию."
 KPA_General_Secretary_Choe_Chang-ik: "Генеральный секретарь Чоу Чанг-ик"
 KPA_General_Secretary_Choe_Chang-ik_desc: "Чхве Чанг-ик обладает соответствующими навыками и революционной репутацией, чтобы вести партию на основе консенсуса."
 KPA_Promote_Kims_Supporters: "Продвигать сторонников Кима"
 KPA_Promote_Kims_Supporters_desc: "Ближайшие союзники Великого Вождя должны быть поставлены на руководящие должности для более эффективного осуществления социализма."
 KPA_Establishing_Juche: "Установление режима Чучхе"
 KPA_Establishing_Juche_desc: "Идеология чучхе призывает государство и народ стать полностью самостоятельными и сильными для достижения социализма."
