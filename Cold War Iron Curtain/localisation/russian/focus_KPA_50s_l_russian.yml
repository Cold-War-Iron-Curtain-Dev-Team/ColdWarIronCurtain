 PWK.1.d: "Корейская рабочая партия была официально объявлена после слияния Рабочей партии Северной Кореи с Рабочей партией Южной Кореи. Этот последний акт продолжает консолидацию коммунистического руководства вокруг Ким Ир Сена. Это произошло после того, как недавний партийный съезд объявил Северную Корею оплотом демократии и одобрил конституцию, устанавливающую независимую, объединенную Корею со столицей в Сеуле. С одной стороной, похоже, Северная Корея завершает свои усилия по созданию основы для объединения Корейского полуострова под коммунистическим режимом."
 PWK.2.d: "Наблюдатели от Северокорейской народной армии (КНА) с обеспокоенностью отмечают недавнее формирование культа личности и разветвленную структуру наблюдения внутри сил. Культ, по-видимому, сосредоточен на Ким Ир Сене, а политические деятели, как говорят, очень активны в обеспечении как лояльности, так и просвещения в области марксизма-ленинизма. Отвергая такую критику, высокопоставленный северокорейский чиновник заявил, что КНА трансформируется в дисциплинированную революционную силу, преданную народу. И не сила, порабощенная диктатором или купленная империалистическими деньгами."
 KPA_Purge.3.d: "В Пхеньяне казнили корейского националиста Чо Ман Сика. Ярый националист, многие считали его потенциальным соперником за власть в Северной Корее. Его казнь рассматривается как победа Ким Ир Сена и его сторонников. Чо Ман Сик изо всех сил пытался утвердиться после Второй мировой войны, и его отказ принять опеку над Корейским полуостровом стоил ему любой потенциальной советской поддержки. Чо Ман Сик был хорошо известен своей приверженностью ненасильственному сопротивлению японскому правлению, но его отказ принять советские идеалы привел к его задержанию и, в конечном итоге, казни."
 KPA_Purge.4.d: "В качестве публичного упрека распространились слухи, что Ким Ир Сен считает генералов, обученных китайскими коммунистами, ответственными за недавние военные неудачи. Это открытый вызов фракции Яньаня, которая состоит из прокитайских коммунистических корейских лидеров. Группа имеет прочные связи с китайскими коммунистами и доминирует в военном руководстве. Ожидается, что после этой критики Ким произведет чистку этих генералов и заменит их своими сторонниками. Говорят, что коммунистическое руководство Китая недовольно ситуацией."
 KPA_Purge.5.d: "Сообщения из Северной Кореи указывают на то, что Хо Га И умер от болезни, хотя неофициальные сообщения предполагают, что он, возможно, был казнен. Это серьезный удар по просоветской фракции внутри коммунистической партии. Хо Га И, советский кореец, стал известен после Второй мировой войны, когда Советы назвали его ключевым организатором. Он работал в тесном сотрудничестве с Ким Ир Сеном над устранением врагов партии и консолидацией власти, однако недавно между ними произошел конфликт. Говорят, что Ким обвинил своего бывшего союзника в стремлении превратить Северную Корею в миниатюрный Советский Союз и в том, что он сосредоточен исключительно на личной славе. Его казнь указывает на то, что Хо Га И и его фракция, вероятно, проиграли последний приступ внутренней борьбы между коммунистическим руководством Северной Кореи."
 KPA_Purge.7.d: "Несмотря на просьбы Соединенных Штатов и Советского Союза, правительство Северной Кореи объявило, что они казнили Пак Хон Ёна за шпионаж. Пак Хон Ён долгое время был сторонником коммунистического движения в оккупированной Японией Корее, хотя в конечном итоге он скрывался до окончания Второй мировой войны. В конце концов он основал коммунистическую партию в Южной Корее, хотя в конечном итоге был изгнан из страны. В Северной Корее он помог объединить корейский коммунизм под руководством Ким Ир Сена и получил высокий пост благодаря своему влиянию в Южной Корее. Однако Корейская война стала свидетелем массового подавления южнокорейских коммунистов, что привело к массовым репрессиям и депортациям. Поскольку его позиция ослаблена, а военная победа маловероятна, Пак Хон Ён не обладал большим политическим влиянием, и Ким Ир Сен с легкостью добился его ликвидации, стремясь обеспечить полную власть над корейским коммунизмом."
 August_Faction.2.d: "Недавняя борьба за власть против Ким Ир Сена закончилась неудачей. Высокопоставленные лидеры просоветских и прокитайских фракций корейского коммунистического руководства попытались отстранить Кима от власти. Они планировали противостоять Киму на следующем крупном заседании ЦК и критиковать его за то, что он не исправил свой стиль руководства после волны десталинизации, захлестнувшей коммунистический мир. Ким Ир Сен, по всей видимости, обнаружил заговор и перевернул дело своих соперников. Сначала он отложил встречу на месяц и набил публику своими сторонниками. Когда началась критика, сторонники Кима перекричали критиков, сорвав заговор. Впоследствии многие просоветские и прокитайские коммунистические лидеры были арестованы. Ким Ир Сен объявил о планах новой чистки, что указывает на то, что ему, возможно, наконец удастся сломить все соперничающие фракции внутри партии."
 August_Faction.3.d: "Десталинизация охватила коммунистический мир. Эти коммунистические лидеры по-прежнему привержены сталинизму, особенно культу личности и консолидации лидерства в отдельности. Просоветские и прокитайские коммунистические лидеры под руководством Чхве Чан Ика согласились противостоять Ким Ир Сену во время следующего крупного партийного собрания. Когда Ким открыл собрание для открытой дискуссии, Че Чан Ик начал публичное осуждение Кима и его консолидации власти. Ким Ир Сен, будучи неподготовленным, попытался закончить встречу, но потерял контроль. В конце концов, Центральный комитет проголосовал за то, чтобы сместить Кима за его неудавшееся руководство и заменить его новым Генеральным секретарем Чхве Чан Иком. Попытки Ким Ир Сена консолидировать власть и устранить соперничающие фракции внутри партии полностью провалились."
 KPA_Purge.9.d: "Правительство Северной Кореи объявило о казни Пак Иль У. Бывший министр внутренних дел считался влиятельным членом прокитайской фракции Яньаня в коммунистической партии Северной Кореи. Ожидается, что его ликвидация вызовет критику со стороны китайских коммунистов, но это указывает на продолжающийся упадок фракции Яньаня. Многие аналитики считают эту последнюю чистку признаком того, что Ким Ир Сен продолжает консолидировать власть вокруг себя."
 KPA_FOR.1.d: "Генеральный секретарь Северной Кореи Ким Ир Сен недавно завершил визит в страны восточного блока СССР. Поездка укрепляет легитимность северокорейского режима и помогает ему стать крупным игроком в коммунистическом мире. Северокорейский лидер посетил многих политических лидеров вместе с ключевыми промышленными и сельскохозяйственными экспертами. Ожидается, что Северная Корея расширит свои связи с этими государствами и поможет экономике Северной Кореи продолжить социалистическое развитие. Поездка также укрепила связи с Москвой."
 KPA_POL.5.d: "Ким Ир Сен, проявив редкое неповиновение, резко отреагировал на недавнюю политику десталинизации, проводимую из Москвы. Северокорейский генсек осуждает то, что он называет ревизионизмом и отходом от марксизма-ленинизма и социалистического развития. Что еще более важно, Ким Ир Сен объявил о своей поддержке китайской оппозиции новой советской политике. Это знаменует собой серьезный сдвиг, поскольку ранее Северная Корея считалась тесно связанной с Советским Союзом."
 KPA_Purge.8.d: "Коммунистическая партия Северной Кореи продолжила встряску с сообщениями о том, что фракция Капсана в настоящее время изгоняется из партии. Это следует за отстранением Ким Ир Сена от власти просоветскими и прокитайскими фракциями. Фракция Капсана состоит из бывших антияпонских корейских партизан, которые были тесно связаны с Кимом. С их удалением возможность контрпереворота в поддержку Кима значительно снижается. Новое руководство Северной Кореи, вероятно, продолжит укреплять свою власть над партией и государством."
 PWK.20.d: "Коммунистическая партия Северной Кореи объявила о новой программе очищения нации от культа личности. Руководство партии отметило, что предыдущие лидеры сошли с социалистического пути, превознося отдельного лидера над потребностями нации или самой партии. Он также добавил, что новая программа проложит путь для Северной Кореи к твердому коллективному лидерству и большей национальной стабильности по мере продолжения процветания социализма."
 Juche.1.d: "Лидер Северной Кореи Ким Ир Сен начал формулировать новую национальную идеологию для народа Северной Кореи под названием Чучхе. Он призвал Северную Корею завершить преобразование нации в марксистское государство, основанное на потребностях корейского народа. Чучхе призывает Северную Корею стать полностью самостоятельной и независимой на трех уровнях. Через Чучхе Северная Корея добьется политической независимости, а также экономической и оборонной самообеспеченности. В последующих публикациях правительство утверждало, что новая идеология возникла у Ким Ир Сена и его опыта работы с антияпонскими движениями в 1930-х годах."
 KPA_Purge.1.d: "Внутренняя фракция была подвергнута жесткой чистке партией после сообщений об их антимарксистских тенденциях и стремлении к власти. Эти бывшие антияпонские боевики были прочно связаны с Сеулом, но их идеологические неудачи не позволили им позволить социализму процветать в оккупированной Корее. Они тратили больше времени на заговоры о власти, чем на поддержку революционного рвения всех корейцев. Их устранение укрепит партию и поможет укрепить революционные действия."
 KPA_POL.1.d: "Центральный Комитет провел оживленные дебаты о будущем партии. Одна группа партийных лидеров предполагает, что партия должна очистить себя и сосредоточить членство среди элитных кадров, как и советская коммунистическая партия. Они утверждают, что такая структура поможет государству лучше организовать установление марксизма-ленинизма в стране. Другая группа, состоящая в основном из корейцев, прошедших курс обучения социализму в Китае и СССР, утверждает, что Северной Корее нужна массовая партия для более непосредственного распространения марксизма-ленинизма в массы. Те, кто выступают за массовую вечеринку, утверждают, что люди должны взаимодействовать напрямую."
 KPA_POL.2.d: "Внутренняя фракция была публично осуждена Центральным Комитетом. Внутренняя фракция давно претендовала на большое влияние среди южных марксистов, но их попытки поднять массовое восстание в поддержку революции не увенчались успехом. Внутреннюю фракцию обвиняют в том, что она преувеличивает свое влияние и отвлекается на контрреволюционные желания вместо того, чтобы подпитывать революционный пыл. Их неудача - большое пятно на миссии объединения и независимости при социализме."
 KPA_POL.3.d: "Правительство объявило об увольнении этих членов в партии. Южане не справились со своей миссией по поддержке национальной революции. Они также успокоились и сосредоточились на личных достижениях, а не на улучшении партии. Устранение этих неудач и контрреволюционеров обеспечит силу партии. Новые, более революционные и преданные участники заменят удаленных. О новых акциях будет объявлено в ближайшие дни."
 KPA_Purge.6.d: "Пак Хон Ён был арестован за преступления против народа. Он представляет руководство южных коммунистов и обещал разжечь беспорядки на юге в поддержку наших национально-освободительных усилий. Однако он полностью потерпел неудачу в этих усилиях. Это связано с его недостатком приверженности и сосредоточенности на достижении личной славы и достижений. Его арест знаменует собой большое завоевание революции и первый шаг к возвращению революции в нужное русло."
 KPA_Purge.2.d: "Хо Га И был убран со всех своих партийных постов. Его обвиняют в подрыве корейской революции и в том, что он агент иностранных спецслужб, особенно Советского Союза. Северокорейское государство должно сосредоточиться на своей независимости и революционных преобразованиях. Устранение Хо Га И и его замена членами партии, совершенными исключительно в интересах Кореи, только укрепят партию в это критическое время."
 August_Faction.4.d: "Во время недавнего пленарного заседания Центрального комитета некоторые коварные члены партии попытались осудить председателя Ким Ир Сена. Они стремились вызвать смену руководства. К счастью, лояльные члены партии встали и осудили эгоистично стремящихся к личной власти членов партии. Попытка разоблачения провалилась, и партийное руководство осталось неизменным. По окончании встречи лидер объявил о планах очистить партию от внутренних врагов."
 August_Faction.5.d: "Во время недавнего пленарного заседания Центрального комитета некоторые члены партии успешно осудили председателя Ким Ир Сена за его отклонение от социалистического пути. Эта ошеломляющая атака разоблачила Кима и привела к партийным дебатам, в ходе которых было объявлено об отстранении председателя Кима от его руководящих должностей. Будет объявлено новое партийное руководство, и они уже пообещали положить конец культу личности и принести коллективное правление руководству. Это изменение уже хорошо принимается за рубежом, поскольку Советское правительство выразило свою поддержку народу Северной Кореи."
 Han_Sorya.3.d: "Хан Соль Я был снят с поста министра образования Центральным комитетом. Правительство заявило, что Соль Я стал приверженцем культа личности и резко отклонился от истинного марксизма-ленинизма. Его устранение оживит идеологическое воспитание людей и устранит сохраняющиеся последствия ядовитого культа личности, поддерживаемого предыдущим руководством."
 Han_Sorya.2.d: "Хан Соль Я стал великим поборником революции в Северной Корее. Одаренный писатель посвятил свои усилия в качестве министра образования не только идеологическому развитию всех корейцев, но и занялся очисткой языка от иностранного влияния. Он особенно предан Лидеру, и его произведения прославляют и подчеркивают удивительные успехи, достигнутые за последние годы. Что еще более важно, он сыграл ценную роль в формировании того, как правительство может объяснить и оправдать свою идеологию полностью независимого корейского государства."
 Han_Sorya.1.d: "Хан Соль Я был назначен главой недавно созданного Союза корейских писателей. Одаренный писатель долгое время был доверенным лицом Лидера и на протяжении многих лет играл важную роль в выражении идеологии государства народу. Что еще более важно, он успешно очистил корейский язык от иностранного и капиталистического влияния. Ожидается, что с его новой должностью он будет более эффективно направлять не только образование корейцев, но и развитие литературы, чтобы лучше отражать истинную преданность корейского народа партии и лидеру."
 August_Faction.1.d: "Недавние события в Москве оживил просоветские и прокитайские фракции внутри партии. Они считают, что Ким Ир Сен движется по контрреволюционному пути, особенно с его культом личности и тем, что они считают серией корыстных чисток. Они разработали план противостояния Киму на следующем заседании Центрального комитета и публичного осуждения его политики, направленной на смену руководства. Председатель Ким Ир Сен слышал слухи о заговоре, но не слышал подробностей. У него есть выбор заполнить предстоящую встречу своими сторонниками, чтобы защитить себя или нет. Если он решит не приводить своих сторонников, это покажет его силу партии."
