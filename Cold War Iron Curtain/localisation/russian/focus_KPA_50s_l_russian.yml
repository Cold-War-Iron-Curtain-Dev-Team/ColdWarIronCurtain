 KPA_Soviet_Korean_Cooperation: "Советско-корейское сотрудничество"
 KPA_Ask_Stalin_for_Support: "Запросить у Сталина поддержку"
 KPA_Foster_A_Revolution: "Поощрение революции"
 KPA_Unify_the_Peninsula: "Объединить полуостров"
 KPA_Comrade_Ho_Ka_I: "Товарищ Хо Ка-и"
 KPA_Appoint_Pak_Chong_ae: "Назначить Пак Чжон-э"
 KPA_Korean_Communism: "Корейский коммунизм"
 KPA_Korean_Communism_desc: "Наш коммунизм основан на низовом уровне как его видит Ким Ир Сен, наш лидер и бывший лидер Временного правительства Северной Кореи. Идеи нашего лидера укрепляют нас."
 KPA_Empower_the_Domestic_Faction: "Расширение прав и возможностей отечественной партии"
 KPA_Comrade_Pak_Hon_Yong: "Товарищ Пак Хон Йонг"
 KPA_Comrade_Kim_Won_Bong: "Товарищ Ким Вон Бонг"
 KPA_Democratic_Revolution: "Демократическая революция"
 KPA_Organize_Local_Elections: "Организовать местные выборы"
 KPA_Empower_the_Korean_National_Revolutionary_Party: "Расширение прав корейской национально-революционной партии"
 KPA_Reach_out_to_the_Americans: "Связаться с Америкой"
 KPA_Amity_with_the_Soviets: "Дружба с Советами"
 KPA_Open_the_Border: "Открыть границу"
 KPA_Empower_the_Guerilas: "Расширение прав  бывших партизан"
 KPA_Empower_the_Guerilas_desc: "Мы должны работать с людьми, которые боролись за независимость Кореи от Японии."
 KPA_Initiate_the_Kim_Cult: "Начало культа Кима"
 KPA_Initiate_the_Kim_Cult_desc: "Надо выучить, что Ким Ир Сен является отцом нашей нации, любимым партизанским борцом против японцев и Солнцем нашей страны."
 KPA_Juche: "Чучхе"
 KPA_Independent_Korea: "Независимая Корея"
 KPA_Begin_Purges: "Начало чисток"
 KPA_Oust_the_Southerners: "Вытеснение южан"
 KPA_Oust_the_Soviets: "Изгнание Советов"
 KPA_Songun: "Сонгун"
 KPA_Songun_desc: "Военные должны быть основой в нашем государстве, поскольку они являются авангардом коммунизма."
 KPA_Korean_Peoples_Army: "Корейская Народная Армия"
 KPA_Korean_Peoples_Army_desc: "Нам нужно создать новую армию, которая будет охранять народ."
 KPA_Oust_the_Pro_Chinese: "Изгнание прокитайских партий"
 KPA_Nationalize_Military_Industry: "Национализация военной промышленности"
 KPA_Nationalize_Military_Industry_desc: "Мы должны подчеркнуть господство наших военных во всем. Давайте начнем с экономики"
 KPA_Push_to_Busan: "Удар по Пусану"
 KPA_Chinese_Armed_Divisions: "Китайские бронетанковые дивизии"
 KPA_Ready_for_War: "Готовы к войне!"
 KPA_Ready_for_War_desc: "Под руководством КНА и нашего лидера Кима мы готовы ко всему."
 KPA_Ask_Soviets_for_Endorsement: "Запрос поддержки СССР"
 KPA_Ask_Soviets_for_Endorsement_desc: "Нам нужно понять, как Советы относятся к нам."
 KPA_Soviet_Armed_Divisions: "Советские бронетанковые дивизии"
 KPA_Ideological_Fanaticism: "Идеологический фанатизм"
 KPA_Ask_Mao_for_Endorsement: "Запрос поддержки Мао"
 KPA_Peoples_Industry_2: "Народная промышленность 2"
 KPA_Nationalize_the_Railways: "Национализация Ж/Д путей"
 KPA_Peoples_Industry: "Народная промышленность"
 KPA_Pyongan_Industrial_Area: "Промышленная зона Пхёнган"
 KPA_First_Five_Year_Plan: "Первая пятилетка"
 KPA_Wonsan_Industrial_Area: "Промышленная зона Вонсан"
 KPA_Haeju_Shipyards: "Верфи в Хэчжу"
 KPA_Second_Five_Year_Plan: "Вторая пятилетка"
 KPA_One_Korea_Under_Kim: "Единая Корея под Кимом"
 KPA_North_South_Leadership_Conferences: "Конференция лидеров Севера и Юга"
