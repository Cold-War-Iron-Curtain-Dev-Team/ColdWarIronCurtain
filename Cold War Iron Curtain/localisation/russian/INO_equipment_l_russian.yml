l_english:
 INO_infantry_equipment_0: "U.S. rifle, caliber .30, M1"
 INO_infantry_equipment_0_short: "M1 Garand"
 INO_infantry_equipment_0_desc: "M1 Garand - это парадное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Garand - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Это одна из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Оно стало символичным и до сих пор используется современными учебными командами в США.."
 INO_infantry_equipment_1: "Автомат Калашникова 1947"
 INO_infantry_equipment_1_short: "AK-47"
 INO_infantry_equipment_1_desc: "АК47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Тимофеевичем Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. В течение многих лет АК47 считался одним из самых надежных и простых в обслуживании, обращении и освоении оружием в мире."
 INO_infantry_equipment_2: "Bandung Weapons Factory SP-1"
 INO_infantry_equipment_2_short: "Bandung SP-1"
 INO_infantry_equipment_2_desc: "Лицензионная версия пистолета Beretta BM-59, выпускавшаяся Бандунгским оружейным заводом под обозначением SP-1"
 INO_infantry_equipment_3: "Rifle, Caliber 5.56 mm, M16A1"
 INO_infantry_equipment_3_short: "M16A1"
 INO_infantry_equipment_3_desc: "Армия США XM16E1 - это, по сути, то же оружие, что и M16, с добавлением переднего упора и соответствующих вырезов в затворной раме. В 1967 году была завершена разработка серийной модели M16A1, которая выпускалась до 1982 года. Для решения проблем, возникших в ходе испытаний XM16E1, на смену трехштырьковому подавителю вспышки XM16E1, который зацеплялся за ветки и листья, пришел закрытый подавитель вспышки в виде птичьей клетки. После многочисленных проблем в полевых условиях были внесены и другие изменения. Были разработаны и выпущены комплекты для чистки, а также введены стволы с хромированными каморами, а позднее - с цельнолитыми стволами."
 INO_infantry_equipment_4: "PT Pindad Senapan Serbu 1"
 INO_infantry_equipment_4_short: "Pindad SS1"
 INO_infantry_equipment_4_desc: "SS1, сокращенно Senapan Serbu 1, что означает «штурмовая винтовка 1», является стандартной штурмовой винтовкой вооруженных сил и национальной полиции Индонезии. Винтовка создана на базе винтовки FN FNC, но модифицирована с учетом требований эргономики и тропических условий."
 INS_infantry_equipment_0: "U.S. rifle, caliber .30, M1"
 INS_infantry_equipment_0_short: "M1 Garand"
 INS_infantry_equipment_0_desc: "M1 Garand - это парадное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Garand - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Это одна из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Оно стало символичным и до сих пор используется современными учебными командами в США.."
 INS_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 INS_infantry_equipment_1_short: "FN FAL"
 INS_infantry_equipment_1_desc: "FN FAL - один из самых производимых пистолетов в истории. Из-за его распространенности и широкого использования в вооруженных силах многих стран НАТО и стран первого мира во время холодной войны ему было присвоено звание \"Правая рука свободного мира\"."
 INS_infantry_equipment_2: "FN Fal polymer"
 INS_infantry_equipment_2_short: "FN Fal(p)"
 INS_infantry_equipment_2_desc: "FN FAL - один из самых производимых пистолетов в истории. Из-за его распространенности и широкого использования в вооруженных силах многих стран НАТО и стран первого мира во время холодной войны ему было присвоено звание \"Правая рука свободного мира\"."
 WPA_infantry_equipment_0: "U.S. rifle, caliber .30, M1"
 WPA_infantry_equipment_0_short: "M1 Garand"
 WPA_infantry_equipment_0_desc: "M1 Garand - это парадное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Garand - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Это одна из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Оно стало символичным и до сих пор используется современными учебными командами в США.."
