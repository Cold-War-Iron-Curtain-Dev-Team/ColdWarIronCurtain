 INO_jet_multirole_equipment_2: "МиГ-15"
 INO_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 \"Фагот\" Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления в Корейской войне, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые из них все еще остаются на вооружении ВВС Северной Кореи."
 INO_jet_multirole_equipment_2_short: "МиГ-15"
 INO_jet_multirole_equipment_3: "МиГ-17"
 INO_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 \"Фагот\". С 1952 года было произведено более 10 000 МиГ-17 \"Фреско\". МиГ-17 был построен по лицензии в ВВС НОАК как Shenyang J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabres над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе НВАФ и НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял гораздо более современным сверхзвуковым американским истребителям Phantom II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно используется в некоторых африканских странах и Северной Корее."
 INO_jet_multirole_equipment_3_short: "МиГ-17"
 INO_jet_multirole_equipment_4: "МиГ-19"
 INO_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в ровном полете. Сравнимым американским истребителем \"Century Series\" был North American F-100 Super Sabre, хотя МиГ-19 в основном боролся с более современными McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 INO_jet_multirole_equipment_4_short: "МиГ-19"
 INO_jet_multirole_equipment_5: "МиГ-21F-13"
 INO_jet_multirole_equipment_5_desc: "МиГ-21 Fishbed считается одним из самых ранних советских истребителей третьего поколения, оснащенным ракетами дальнего радиуса действия и импульсным радаром. МиГ-21 является самым производимым сверхзвуковым самолетом в истории, особенно большое количество было построено в Китае и Индии по лицензии. Всего было построено более 11 000 самолетов, которые служат в более чем 60 странах на 5 континентах. За время своей службы МиГ-21 совершил 240 воздушных убийств. МиГ-21 участвовал во многих конфликтах, включая Вьетнам (где он добился огромных успехов), индийско-пакистанскую войну 1971 года, ирано-иракскую войну и множество более мелких конфликтов. Он остается на вооружении более 6 десятилетий."
 INO_jet_multirole_equipment_5_short: "МиГ-21F-13"
 INO_jet_multirole_equipment_8: "Northrop F-5E Tiger II"
 INO_jet_multirole_equipment_8_short: "В 1970 году компания Northrop выиграла конкурс International Fighter Aircraft (IFA) на замену F-5A с лучшими характеристиками в воздухе против таких самолетов, как советский МиГ-21. Получившийся самолет, первоначально известный как F-5A-21, впоследствии стал F-5E. Он имел более мощные (5000 фунтов на фут) двигатели General Electric J85-21, удлиненный и увеличенный фюзеляж, вмещающий больше топлива. Крылья были оснащены увеличенными удлинителями передней кромки, что позволило увеличить площадь крыла и улучшить маневренность."
 INO_jet_multirole_equipment_9: "General Dynamics F-16A Block 15 OCU (Operating Capability Upgrades) Fighting Falcon"
 INO_jet_multirole_equipment_9_short: "F-16A Block 15 OCU"
 INO_jet_multirole_equipment_9_desc: "Первое серьезное изменение в F-16, самолет Block 15 отличался более крупными горизонтальными стабилизаторами, добавлением двух жестких точек на подбородочном отверстии, новым радаром и увеличенной емкостью для подкрыльевых пилонов. Этот вариант также получил современную радиостанцию ультравысокой частоты (УВЧ). Этот вариант является самым многочисленным среди вариантов F-16."
 INO_jet_multirole_equipment_10: "General Dynamics F-16C Block 50"
 INO_jet_multirole_equipment_10_short: "F-16C Block 50"
 INO_mr_stealth_fighter_equipment_1: "Су-30МКМ2"
 INO_mr_stealth_fighter_equipment_1_short: "Су-30МКМ2"
 INO_mr_stealth_fighter_equipment_1_desc: "Сухой Су-30МКМ (условное обозначение НАТО; Flanker-H) - сверхманевренный истребитель Королевских ВВС Малайзии. Это вариант истребителей серии Су-30, имеющий множество значительных усовершенствований по сравнению с первоначальным экспортным вариантом Су-30МК."
 INO_jet_interceptor_equipment_9: "Су-27СK"
 INO_jet_interceptor_equipment_9_desc: "Су-27С Flanker B - это первоначальный серийный вариант советского истребителя Су-27. Самолет задумывался как прямой конкурент F-14 Tomcat и F-15 Eagle. После первого полета в 1977 году он поступил на вооружение в 1985 году. Его основной задачей была дальняя противовоздушная оборона против американских бомбардировщиков B-1 и B-52, а также дальнее сопровождение советских межконтинентальных стратегических бомбардировщиков. К настоящему времени было произведено 809 самолетов, которые до сих пор состоят на вооружении ВВС России. К числу других эксплуатантов относятся: Индонезия, Украина, Вьетнам, Китай (обозначение J-11) и другие. В обозримом будущем самолеты останутся в строю."
 INO_jet_interceptor_equipment_9_short: "Су-27СK"
 INO_CAS_equipment_1: "Fokker C.X Series I"
 INO_CAS_equipment_1_short: "Fokker C.X"
 INO_CAS_equipment_1_desc: "Fokker C.X был первоначально разработан для Королевской голландской армии Ост-Индии, чтобы заменить Fokker C.V. Как и все самолеты Fokker того времени, он имел смешанную конструкцию: деревянные конструкции крыльев и сварной каркас из стальных труб, покрытый алюминиевыми пластинами в передней части самолета и тканью в задней части. Прототип был построен в 1934 году с двигателем Rolls-Royce Kestrel V. "
 INO_CAS_equipment_2: "Curtiss P-40K Warhawk"
 INO_CAS_equipment_2_short: "P-40K Warhawk"
 INO_CAS_equipment_3: "Mitsubishi Ki-51"
 INO_CAS_equipment_3_short: "Ki-51"
 INO_CAS_equipment_4: "Douglas A-26C Invader"
 INO_CAS_equipment_4_short: "A-26C Invader"
 INO_CAS_equipment_4_desc: "Douglas A-26 Invader - американский двухмоторный легкий бомбардировщик и штурмовик. Построенный компанией Douglas Aircraft Company во время Второй мировой войны, Invader также использовался во время нескольких крупных конфликтов холодной войны."
 INO_jet_CAS_equipment_1: "North American AT-16 Harvard"
 INO_jet_CAS_equipment_1_short: "AT-16 Harvard"
 INO_jet_CAS_equipment_1_desc: "Вооруженный вариант самолета North American T-6 Harvard. AT-16 мог быть вооружен ракетными установками, бомбами и пулеметными установками для выполнения задач ближней авиационной поддержки."
 INO_jet_light_equipment_1: "North American T-6G Texan"
 INO_jet_light_equipment_1_short: "T-6G Texan"
 INO_jet_light_equipment_1_desc: "Ранние модели AT-6/T-6, перестроенные в 1949-1953 гг. с улучшенной компоновкой кабины, увеличенным запасом топлива, управляемым хвостовым колесом, обновленными радиостанциями и 600-сильным двигателем R-1340-AN-1. Идентифицируются по упрощенному каркасу козырька. 2068 модифицированный."
 INO_jet_light_equipment_2: "МиГ-15УТИ"
 INO_jet_light_equipment_2_short: "МиГ-15УТИ"
 INO_jet_light_equipment_2_desc: "6 апреля 1949 года коллективу ОКБ-155 было официально поручено разработать учебно-тренировочный вариант истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен на заводе № 1 в марте-мае 1949 года. Кабина инструктора на УТИ МиГ-15 была размещена за счет уменьшения первого фюзеляжного топливного бака. Обе герметичные кабины были оборудованы катапультными креслами и фонарями пиромеханического сброса.  Специальное оборудование машины состояло из автоматического пушечного прицела АСП-1Н, приемопередающей радиостанции РСИ-6К, радиокомпаса с маркером РПКО-10М, переговорного устройства СПУ-2М, кислородного прибора КП-14 и фотоаппарата АФА-ИМ. Вооружение состояло из одной 23-мм пушки НР-23 с боекомплектом 80 патронов и одного пулемета УБК-Э с боекомплектом 150 патронов."
 INO_jet_light_equipment_3: "L-29 Delfin"
 INO_jet_light_equipment_3_short: "L-29 Delfin"
 INO_jet_light_equipment_3_desc: "Aero L-29 Delfín (на английском языке - Dolphin, по классификации НАТО - Maya) - военный реактивный учебно-тренировочный самолет, разработанный и произведенный чехословацкой авиастроительной компанией Aero Vodochody. В ходе реализации программы было произведено более 3000 учебно-тренировочных самолетов L-29 Delfin. Из них около 2 000, как сообщается, были поставлены в Советский Союз, где они использовались в качестве стандартного учебно-тренировочного самолета для советских ВВС."
 INO_jet_light_equipment_4: "North American Rockwell OV-10A Bronco"
 INO_jet_light_equipment_4_short: "OV-10A Bronco"
 INO_jet_light_equipment_4_desc: "North American Rockwell OV-10 Bronco - американский двухместный турбовинтовой легкий штурмовик и самолет наблюдения. Он был разработан в 1960-х годах как специальный самолет для борьбы с повстанцами (COIN), и одной из его основных задач было управление передовым воздушным пространством (FAC). Он может нести до 3 200 фунтов внешних боеприпасов, внутренние грузы, такие как десантники или носилки, и находиться в воздухе в течение трех и более часов."
 INO_jet_light_equipment_5: "British Aerospace Hawk 209"
 INO_jet_light_equipment_5_short: "Hawk 209"
 INO_jet_light_equipment_5_desc: "British Aerospace Hawk 200 - одноместный однодвигательный легкий многоцелевой истребитель, предназначенный для противовоздушной обороны, противодействия воздушному нападению, борьбы с кораблями, перехвата, ближней воздушной поддержки и наземной атаки."
 INO_recon_equipment_0: "North American F-6D Mustang"
 INO_recon_equipment_0_short: "F-6D Mustang"
 INO_recon_equipment_0_desc: "Разведывательная версия P-51D Mustang."
 INO_jet_recon_equipment_0: "МиГ-15бис"
 INO_jet_recon_equipment_0_short: "МиГ-15бис"
 INO_jet_recon_equipment_1: "МиГ-21Ф-13"
 INO_jet_recon_equipment_1_short: "МиГ-21Ф-13"
 INO_jet_recon_equipment_2: "General Dynamics F-16A Block 15 OCU (Operating Capability Upgrades) Fighting Falcon Recce"
 INO_jet_recon_equipment_2_short: "F-16A Block 15 Recce"
 INO_tac_bomber_equipment_0: "Yokosuka K5Y 'aka-tombo'"
 INO_tac_bomber_equipment_0_short: "K5Y 'aka-tombo'"
 INO_tac_bomber_equipment_1: "Martin Model 166"
 INO_tac_bomber_equipment_1_short: "Model 166"
 INO_tac_bomber_equipment_2: "North American B-25C Mitchell"
 INO_tac_bomber_equipment_2_short: "B-25C Mitchell"
 INO_tac_bomber_equipment_2_desc: "B-25 - это двухмоторный средний бомбардировщик, представленный в 1941 году. Использовался многими военно-воздушными силами во время Второй мировой войны, а также служил на всех театрах военных действий, где применялась авиация. Наиболее известным его использованием стал рейд Дулиттла, первая успешная кампания воздушной бомбардировки материковой части Японии во время войны. Его прозвище - \"Митчелл\", по имени генерал-майора Билли Митчелла, пионера американской военной авиации."
 INO_tac_bomber_equipment_3: "North American B-25J Mitchell"
 INO_tac_bomber_equipment_3_short: "B-25J Mitchell"
 INO_jet_tac_bomber_equipment_2: "Ил-28"
 INO_jet_tac_bomber_equipment_2_short: "Ил-28"
 INO_jet_tac_bomber_equipment_2_desc: "Ил-28 - турбореактивный средний бомбардировщик, разработанный сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, запущенный в крупносерийное производство, Ил-28, представленный в 1950 году, участвовал во многих крупных конфликтах холодной войны, от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. Даже после снятия с вооружения СССР к 1980-м годам, многие самолеты этого типа продолжают служить и по сей день. Отчетное название ВВС США и Министерства обороны - Тип 27, кодовое название НАТО - Beagle."
 INO_jet_strat_bomber_equipment_1: "Ту-16KС1"
 INO_jet_strat_bomber_equipment_1_short: "Ту-16KС1"
 INO_jet_strat_bomber_equipment_1_desc: "Ту-16 - двухмоторный стратегический бомбардировщик, разработанный в 1952 году и ставший одним из первых стратегических бомбардировщиков с реактивным двигателем, поступивших на вооружение советских ВВС. Он имел стреловидную конфигурацию крыла и оснащался двумя турбореактивными двигателями Микулина АМ-3 в корневых частях крыла. Он мог нести до 9000 кг (20 000 фунтов) боеприпасов, включая ядерное оружие и ФАБ-9000 - бомбу весом 9000 кг, по мощности аналогичную британской бомбе \"Гранд Слэм\". Известный на Западе как \"Барсук\", этот тип служил на протяжении всей холодной войны и был снят с вооружения в 1993 году. Китайский вариант H-6, построенный по лицензии, остается в строю в качестве фронтового стратегического бомбардировщика ВВС НОАК."
