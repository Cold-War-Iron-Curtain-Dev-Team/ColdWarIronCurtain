 INO_mechanized_marine_equipment_3: "БТР-50PM"
 INO_mechanized_marine_equipment_3_short: "БТР-50PM"
 INO_mechanized_marine_equipment_3_desc: "БТР-50ПМ (модификация Palawa) - версия, используемая индонезийской морской пехотой (Korps Marinir), оснащенная радиостанциями AN/VRC-64 и PRC-33 вместо 10-RT, новой тормозной системой, пулеметом FN MAG вместо PKT и двигателем Detroit Diesel 6V92T вместо оригинального V-6V."
 INO_mechanized_marine_equipment_4: "VAL M113 Arisgator"
 INO_mechanized_marine_equipment_4_short: "VAL Arisgator"
 INO_mechanized_marine_equipment_4_desc: "Arisgator - гусеничная машина-амфибия, разработанная компанией A.R.I.S. Co. для итальянских амфибийных сил на базе M113. В нем использовались кессоны корпуса для плавучести и гребные винты. В виде набора он стоит 1/5 от AAV7"
 INO_mechanized_marine_equipment_5: "PT PAL БТР-50P(M)"
 INO_mechanized_marine_equipment_5_short: "БТР-50P(M"
 INO_mechanized_marine_equipment_5_desc: "Модернизированная версия, разработанная компанией PT PAL Indonesia в сотрудничестве с PT Pindad. Эта машина имеет новую носовую часть, приподнятую заднюю часть корпуса и двигатель мощностью 270 л.с. Пустой вес составляет 12 750 кг, а боевой вес - 14 900 кг. Транспортная вместимость составляет 3 + 14 военнослужащих."
