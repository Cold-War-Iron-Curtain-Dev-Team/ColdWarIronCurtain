 INO_lt_equipment_3: "ПT-76"
 INO_lt_equipment_3_short: "ПT-76"
 INO_lt_equipment_3_desc: "ПT-76 - советский легкий танк-амфибия, который активно экспортировался по всему миру. Он был разработан Н Шашмыриным и Ж Котиным в 1951 году, и было произведено около 12 000 единиц. Он требует экипажа из 3 человек, имеет прямой шестицилиндровый двигатель V6, развивает скорость 44 км/ч и может плавать со скоростью 10 км/ч. Он экспортировался в различные страны советской сферы и страны, склоняющиеся к советской власти, и в качестве такового участвовал в разведке практически во всех конфликтах стран советской сферы. Однако, благодаря своей известной надежности и простоте обслуживания, он до сих пор используется многими странами."
