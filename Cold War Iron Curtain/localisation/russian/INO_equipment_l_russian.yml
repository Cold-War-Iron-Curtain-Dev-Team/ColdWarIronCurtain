 WPA_infantry_equipment_2_desc: "FN FAL - один из самых производимых пистолетов в истории. Из-за его распространенности и широкого использования в вооруженных силах многих стран НАТО и стран первого мира во время холодной войны ему было присвоено звание \"Правая рука свободного мира\"."
 INO_lt_equipment_1: "M3 Stuart"
