 INO_motorized_equipment_3: "REO M35A1 6x6"
 INO_motorized_equipment_3_short: "M35A1 6x6"
 INO_motorized_equipment_3_desc: "M35 - это 2,5-тонный грузовик с колесной формулой 6х6, разработанный компанией REO в 1944 году. Он широко использовался во всех конфликтах США с 1950-1988 гг. M35 использует двигатель OA-331 с 5-ступенчатой/2-диапазонной коробкой передач и балочными мостами на рессорной подвеске. Он может перевозить груз весом 5000 фунтов. Он может двигаться со скоростью 58 миль в час на протяжении 300 миль и имеет расход топлива 8 миль/гал. Он широко использовался США и многими их союзниками по всему миру. Он был построен, чтобы заменить GMC CCKW после войны и обеспечить более мощный и быстрый автомобиль. "
