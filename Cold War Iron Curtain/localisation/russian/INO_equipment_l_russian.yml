 WPA_CAS_equipment_3: "Hawker Tempest"
 WPA_CAS_equipment_3_short: "Tempest"
 WPA_CAS_equipment_3_desc: "Hawker Tempest - британский истребитель, который использовался в основном Королевскими военно-воздушными силами (RAF) во время Второй мировой войны. Tempest, первоначально известный как Typhoon II, был улучшенным производным Hawker Typhoon."
