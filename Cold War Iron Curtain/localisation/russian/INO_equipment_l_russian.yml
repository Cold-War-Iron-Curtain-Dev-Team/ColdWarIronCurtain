 INS_tac_bomber_equipment_2: "North American B-25C Mitchell"
 INS_tac_bomber_equipment_2_short: "B-25C Mitchell"
 INS_tac_bomber_equipment_2_desc: "B-25 - это двухмоторный средний бомбардировщик, представленный в 1941 году. Использовался многими военно-воздушными силами во время Второй мировой войны, а также служил на всех театрах военных действий, где применялась авиация. Наиболее известным его использованием стал рейд Дулиттла, первая успешная кампания воздушной бомбардировки материковой части Японии во время войны. Его прозвище - \"Митчелл\", по имени генерал-майора Билли Митчелла, пионера американской военной авиации."
