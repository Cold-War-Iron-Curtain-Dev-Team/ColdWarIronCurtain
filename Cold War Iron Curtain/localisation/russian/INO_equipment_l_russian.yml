 INO_attack_helicopter_equipment_4: "Ми-35П"
 INO_attack_helicopter_equipment_4_short: "Ми-35П"
 INO_attack_helicopter_equipment_4_desc: "Первоначально являясь базовой экспортной версией советского Ми-24П, этот вариант был модернизирован в соответствии с новым общим стандартом модернизации Ми-24. Ми-35П получил обзорно-прицельную систему ОПС-24Н-1Л с длинноволновым матричным тепловизором третьего поколения, телевизионной камерой и лазерным дальномером. В кабине экипажа модернизированного вертолета установлена пилотажно-навигационная система КНЭИ-24Э-1 с многофункциональным дисплеем. Цифровая система пилотирования ПКВ-8-35 повышает маневренность и устойчивость вертолета. Модернизированный вертолет также оснащен обновленной системой целеуказания ПрВК-24-2, которая позволяет использовать противотанковые управляемые ракеты 9М127-1 \"Атака-ВМ\" и систему радиоэлектронного противодействия L370 \"Витебск\" или ее экспортный вариант \"Президент-С\"."
 INO_attack_helicopter_equipment_5: "McDonnell Douglas AH-64E Guardian"
 INO_attack_helicopter_equipment_5_short: "AH-64E Guardian"
 INO_attack_helicopter_equipment_5_desc: "AH-64E имеет улучшенную цифровую связь, объединенную тактическую систему распределения информации, более мощные двигатели T700-GE-701D с модернизированной коробкой передач для увеличения мощности, возможность управления беспилотными летательными аппаратами (БПЛА), полную возможность IFR и улучшенное шасси. Новые композитные лопасти ротора, испытания которых успешно завершились в 2004 году, увеличивают крейсерскую скорость, скороподъемность и грузоподъемность."
 INS_CAS_equipment_1: "Fokker C.X Series I"
 INS_CAS_equipment_1_short: "Fokker C.X"
 INS_CAS_equipment_1_desc: "Fokker C.X был первоначально разработан для Королевской голландской армии Ост-Индии, чтобы заменить Fokker C.V. Как и все самолеты Fokker того времени, он имел смешанную конструкцию: деревянные конструкции крыльев и сварной каркас из стальных труб, покрытый алюминиевыми пластинами в передней части самолета и тканью в задней части. Прототип был построен в 1934 году с двигателем Rolls-Royce Kestrel V. "
 INS_CAS_equipment_2: "Curtiss P-40K Warhawk"
 INS_CAS_equipment_2_short: "P-40K Warhawk"
 INS_CAS_equipment_3: "Curtiss P-40N Kittyhawk"
 INS_CAS_equipment_3_short: "P-40N Kittyhawk"
 INS_CAS_equipment_3_desc: "P-40 - это одномоторный цельнометаллический истребитель, разработанный в 1938 году и представлявший собой модифицированную версию P-36 Hawk. Во время Второй мировой войны этот тип использовался многими союзными державами и, несмотря на то, что он уступал более поздним P-47 и P-51, служил на передовой до самого конца войны. 200 пилотов союзников из 7 различных стран, включая США, страны Британского Содружества и Советский Союз, стали асами на P-40. Несмотря на различия в обозначениях для стран Содружества и Советского Союза, официальное прозвище на службе в США - \"Warhawk.\""
 INS_CAS_equipment_4: "Douglas A-26C Invader"
 INS_CAS_equipment_4_short: "A-26C Invader"
 INS_CAS_equipment_4_desc: "Douglas A-26 Invader - американский двухмоторный легкий бомбардировщик и штурмовик. Построенный компанией Douglas Aircraft Company во время Второй мировой войны, Invader также использовался во время нескольких крупных конфликтов холодной войны."
