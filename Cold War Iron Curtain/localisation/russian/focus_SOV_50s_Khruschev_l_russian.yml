l_english:
 Tblisi.1.d: "Хрущевская политика десталинизации начнет разрушать культ личности, сформировавшийся вокруг тоталитарного режима еще при его жизни, но не все это одобрят. Многие стали видеть в Сталине национального героя, который отважно вел коммунистический мир против зла держав Оси и имперских угнетателей. Сталин остается особенно популярным в своем родном регионе Грузии, где Хрущев становится все более непопулярным из-за своих антисталинских реформ. Речь Хрущева за закрытыми дверями на XX съезде, в которой он выступал против Сталина и его грузинских сторонников, только еще больше вызовет разочарование. В отместку, 4 марта, грузины собирались вокруг памятника Сталину, чтобы оплакать третью годовщину его смерти. В ближайшие дни организованное движение протеста против Хрущева начнет набирать большую силу, поскольку тысячи людей выйдут на улицы. Вскоре ситуация изменилась, и многие грузинские националисты стали призывать к полному отделению Грузии от Советского Союза. Местные власти Грузии совершенно ошарашены и ждут указаний из Москвы."
 destalinization.3.d: "После почти 6 дней парализующих беспорядков в Грузинской ССР Москва, наконец, восстановила полный контроль над регионом. После напряженного противостояния с местными милицейскими силами были посланы военные для разгона толпы. Ситуация будет развиваться таким образом, когда правительство арестует гражданскую делегацию, а протестующие пойдут на штурм военных и полиции, чтобы спасти их. Советские танки ворвутся на площадь Ленина вслед за войсковыми батальонами, которые без колебаний расстреляют толпу боевыми патронами. К 10 марта протестующие были арестованы и убиты в массовом порядке, а сотни других исчезли в середине ночи. Порядок восстановлен, но легитимность Хрущева и его руководства теперь под вопросом."
 malenkov_resign.1.d: "После смерти Лаврентия Берии на премьера Георгия Маленкова очень быстро стали оказывать давление, чтобы он ушел в отставку. Хрущев и остальные члены Политбюро быстро осудили Маленкова за его тесную связь с Берией и готовность предавать других ради политической выгоды. Не имея особого выбора в этом вопросе, он объявил бы о своей отставке в феврале 1955 года. После этого он вернется в качестве постоянного члена Политбюро недовольным. С этого, наконец, может начаться новое руководство Советского Союза."
 Failing_Health_System_5: "Недоработанная система здравоохранения"
 Failing_Health_System_4: "Некачественная система здравоохранения"
 Failing_Health_System_3: "Плохо финансируемая система Здравоохранения"
 Failing_Health_System_2: "План восстановления системы здравоохранения"
 Failing_Health_System_1: "Лучшая системы здравоохранения"
 Beria_Arriest.1.d: "Глава НКВД Лаврентий Берия, по-видимому, когда-то был в состоянии взять власть в Советском Союзе после смерти Сталина. Однако его интриги потерпят неудачу, поскольку его соперники были на шаг впереди. Во время встречи с его ближайшими советниками военные силы должны были обойти НКВД и арестовать Берию и его пособников. Вскоре после этого импровизированный судебный процесс в отсутствие защитника признал бы Берию виновным в предательских действиях в координации с Лондоном и терроризме против государства. Берия и шесть его соратников были быстро расстреляны, а их останки сожжены. Когда одна из самых мрачных фигур сталинской эпохи похоронена, что ждет будущее Советского Союза, остается не ясным, поскольку многие фигуры все еще имеют большое влияние на Политбюро."
 KHRUSCHEV_The_Khruschev_Thaw: "Хрущевская оттепель"
 KHRUSCHEV_The_Khruschev_Thaw_desc: "Наш новый первый секретарь Никита Хрущев объявил новый период \"Десталинизации\", назвав внешнюю и внутреннюю политику нашего недавно ушедшего лидера слишком жестокой. Хрущев хочет увеличить права и свободы для нашего народа и уменьшить разрыв в отношениях между Востоком и Западом."
 KHRUSCHEV_Resume_Heavy_Industry_Priority: "Вернуться к развитию тяжелой промышленности"
 KHRUSCHEV_Resume_Heavy_Industry_Priority_desc: "В последние несколько лет мы сосредоточились на развитии гражданской промышленности и сельского хозяйства, но нам также необходимо поддерживать производство военного вооружения, сейчас это необходимо больше, чем когда-либо."
 KHRUSCHEV_Consolidate_Khruschevs_Hold_on_Power: "Укрепить власть Хрущева"
 KHRUSCHEV_Consolidate_Khruschevs_Hold_on_Power_desc: "Приход к власти Хрущёвка  был серьезно оспорен другими высокопоставленными членами партии, в первую очередь ныне покойным Лаврентием Берией, и это до сих пор не доказано. Нам нужны объединить усилия, чтобы укрепить место Хрущева на вершине Советского Союза.."
 KHRUSCHEV_The_Soviet_Armed_Forces: "Советские вооруженные силы"
 KHRUSCHEV_The_Soviet_Armed_Forces_desc: "В то время как наши Вооруженные Силы продолжали развиваться при товарище Сталине, он проявлял слишком большой личный интерес ко многим вещам, что приводило к... любопытным проектам, таким как летающая подводная лодка. Нам нужно решить, будет ли наш подход таким же или же он  будет более традиционным."
 KHRUSCHEV_Tackle_the_Housing_Crisis: "Решить жилищный кризис"
 KHRUSCHEV_Tackle_the_Housing_Crisis_desc: "Наше население очень быстро растет, но наша городская жилая инфраструктура не приспособлена к такому буму. Нам нужно построить больше квартир что бы хватило всем семьям нашей страны."
 KHRUSCHEV_The_Khrushchevka: "Хрущевка"
 KHRUSCHEV_The_Khrushchevka_desc: "Хрущевки - это советские типовые панельные дома которые являются частью проекта государственного планового строительства, они будет строиться по всему Советскому Союзу и будут доступные для людей всех слоев общества, эти дома должны улучшить среднее качество жизни в нашей стране."
 KHRUSCHEV_Expand_City_Limits: "Расширить границы города"
 KHRUSCHEV_Expand_City_Limits_desc: "Расширение границ города - это простой способ стимулировать строительство новых домов и переселить людей из сельских районов в городские."
 KHRUSCHEV_Every_Man_a_Room_Every_Family_a_House: "Каждому человеку -комната, а семье - квартира"
 KHRUSCHEV_Every_Man_a_Room_Every_Family_a_House_desc: "Наша работа по расширению жилищного фонда идет хорошо, но нам все еще нужно наращивать ее, если мы хотим, чтобы у всех наших людей было место к они могут жить."
 KHRUSCHEV_Every_Man_a_Room_Every_Family_a_House_TT: "Добавить §G1§! Создание слота для штатов с более чем 1 миллионом человек"
 KHRUSCHEV_Khrushchevite_Architecture: "Хрущевская архитектура"
 KHRUSCHEV_Khrushchevite_Architecture_desc: "С появлением современных панельных зданий новый стиль архитектуры сформировался на ходу и почти случайно. Несмотря на то, что он не кричащий и не какой-то особенный, хрущевский стиль делает свою работу, обеспечивая жильем население своей страны."
 KHRUSCHEV_Guarentee_Right_to_Work: "Гарантия законного права на труд"
 KHRUSCHEV_Guarentee_Right_to_Work_desc: "Мысль о том, что некоторые наши граждане могут голодать без работы, абсурдна и не имеет места в нашей стране. Мы должны обеспечить, чтобы каждый имел право и место для работы. "
 KHRUSCHEV_Allow_Small_Scale_Syndicalism: "Позволить мелкомасштабный синдикализм"
 KHRUSCHEV_Allow_Small_Scale_Syndicalism_desc: "Хотя мы можем не согласиться с применением синдикалистских концепций к нашему обществу в целом, они имеют свои преимущества для небольших слоёв население, особенно в сельскохозяйственном секторе."
 KHRUSCHEV_Reduce_Legal_Working_Hours: "Сократить рабочие часы"
 KHRUSCHEV_Reduce_Legal_Working_Hours_desc: "На данный момент наши рабочие могут проводить на работе до 14 часов в день. Хотя это, очевидно, дает нам больше ресурсов, это снижает моральный дух население и эффективность выполняемей работы. Снижение допустимого лимита рабочего времени, безусловно, даст нам признательность со стороны широких масс население, но также снизит нашу прибыль."
 KHRUSCHEV_Increase_Kosomols_Funding: "Увеличить финансирование комсомола"
 KHRUSCHEV_Increase_Kosomols_Funding_desc: "Комсомол, или Всесоюзный ленинский коммунистический союз молодёжи - это политическая молодежная организация, призванная воспитывать нашу молодёжь. Увеличивая финансирование комсомола мы можем улучшить его программы и методы работы. "
 KHRUSCHEV_Develop_the_Soviet_Spirit: "Воспитать советский дух "
 KHRUSCHEV_Develop_the_Soviet_Spirit_desc: "Национальный боевой дух никогда не был выше после нашей славной победы в Великой Отечественной войне. Мы должны воспользоваться этим чувством патриотического рвения и воспитать в нашем народе постоянную гордость за свою страну."
 KHRUSCHEV_Promote_an_Atheltic_Culture: "Пропаганда спорта"
 KHRUSCHEV_Promote_an_Atheltic_Culture_desc: "Продвижение спорта в массы будет иметь для нас 2 основных преимущества. Первая - это наличие национальных сборных, которые демонстрируют наше мастерство на мировой арене. Во-вторых, больше  людей среди молодёжи  будут в хорошей физической  форме."
 KHRUSCHEV_Komsomolets_Propaganda_Programs: "Пропагандистские программы комсомола"
 KHRUSCHEV_Komsomolets_Propaganda_Programs_desc: "Комсомол, или комсомольцы, проявляют недостаточно энтузиазма по отношению к Советскому Союзу и его программам, даже несмотря на наши прежние усилия. Это означает, что мы должны усилить нашу пропаганду, направленную на них."
 KHRUSCHEV_Ready_for_Labour_and_Defence_of_the_USSR: "Готов к труду и обороне СССР"
 KHRUSCHEV_Ready_for_Labour_and_Defence_of_the_USSR_desc: "агитационные работы последних лет окупились, и теперь, как никогда, наш народ готов служить своей стране, будь то на фронте или на заводе."
 KHRUSCHEV_Working_Class_Propaganda_Campaigns: "Программа пропаганды среди рабочего класса"
 KHRUSCHEV_Working_Class_Propaganda_Campaigns_desc: "Нам нужна пропагандистская работа, ориентированная на наш огромный рабочий класс, чтобы гарантировать мощь нашего строя и укрепить национальную стабильность."
 KHRUSCHEV_Raise_Workers_Pensions: ""
 KHRUSCHEV_Raise_Workers_Pensions_desc: "Наши героические труженики являются основой Советского Союза, поэтому заслуживают должного уважения. Повышение их пенсий станет важным шагом, чтобы показать, насколько мы ценим их труд и усилия."
 KHRUSCHEV_Lower_Retirement_Limit: "Снижение пенсионного возраста"
 KHRUSCHEV_Lower_Retirement_Limit_desc: "Многие из наших пожилых товарищей не годятся для работы и все же не могут выйти на пенсию. Эти законы в своё время были приняты не для того, чтобы навредить нашему народу, а для того, чтобы каждый выполнял свою долю работы на благо родины. Поэтому мы должны внести в них поправки."
 KHRUSCHEV_Educational_and_Health_Investments: "Инвестиции в образование и здравоохранение"
 KHRUSCHEV_Educational_and_Health_Investments_desc: "И уровень образования, и уровень здравоохранения недостаточно развиты в сельской местности. Нам нужно вложить в них серьезные деньги, если мы хотим это исправить."
 KHRUSCHEV_Improve_Suburban_Hygene_Standards: "Улучшение санитарных нормы в областных районах"
 KHRUSCHEV_Improve_Suburban_Hygene_Standards_desc: "Наши областные коммунальные службы и санитарные службы нуждаются в серьезной модернизации, так как в большинстве пригородов уровень гигиены отвратительно низок."
 KHRUSCHEV_Expand_Immunization_Campaign: "Расширить кампанию вакцинации"
 KHRUSCHEV_Expand_Immunization_Campaign_desc: "Вакцинация - относительно новая область нашей науки. Пришло время оставить смертельные болезни в прошлом и привить наших граждан."
 KHRUSCHEV_Extend_Healthcare_Coverage_to_General_Practitioners: "Расширить медицинскую страховку для врачей общей практики"
 KHRUSCHEV_Extend_Healthcare_Coverage_to_General_Practitioners_desc: "В настоящее время только специализированные врачи или те, кто работает в государственных больницах, могут предложить своим пациентам медицинскую помощь. Это не имеет большого смысла и контрпродуктивно, поэтому мы должны решить эту проблему."
 KHRUSCHEV_Properly_Fund_Hospitals: "Надлежащим образом финансировать больницы"
 KHRUSCHEV_Properly_Fund_Hospitals_desc: "Хотя мы не страдаем от нехватки больниц или больничных коек, мы страдаем от прискорбной нехватки финансирования больниц, что затрудняет работу системы здравоохранение. Мы должны дать нашим больницам то, что им необходимо, чего бы это нам это не стоило."
 KHRUSCHEV_Promote_Professionalizing_Education: "Способствовать повышению уровня образования"
 KHRUSCHEV_Promote_Professionalizing_Education_desc: "Мы должны улучшить систему школьного образование. Более конкретно, нам нужно увеличить количество профильных школ (школы которые специализируются на определенной профессии), и продвигать их среди населения."
 KHRUSCHEV_Extend_Compulsory_School_Attendence: "Расширить школьную программу"
 KHRUSCHEV_Extend_Compulsory_School_Attendence_desc: "Увеличив время пребывания наших молодых товарищей в школе и установив обязательное посещение школы для всех советских детей, мы дадим большему числу нашей молодежи лучшее и всестороннее образование.."
 KHRUSCHEV_Sharpen_Medical_Education_Programs: "Заострить внимание на уровне медицинского образование"
 KHRUSCHEV_Sharpen_Medical_Education_Programs_desc: "Развивая и совершенствуя программу медицинского образование, мы сделаем наших врачей и медсестер более компетентными и эффективными специалистами."
 KHRUSCHEV_Raise_Produciton_Quotas: "Повысить квоты на добычу сырья"
 KHRUSCHEV_Raise_Produciton_Quotas_desc: "Сутки короткие, работы много, а рабочие ленивы. Мы должны это исправить. У наших рабочих достаточно времени, чтобы производить вдвое больше, чем сейчас."
 KHRUSCHEV_Increase_Machine_Tool_Production: "Расширение станкостроительного производства"
 KHRUSCHEV_Increase_Machine_Tool_Production_desc: "Увеличение станкостроительного производства не только облегчит производство большего количества инструментов, но и позволит нам строить больше различных комплексов и создавать более совершенное оборудование."
 KHRUSCHEV_Dniepr_and_Volga_Dam_Works: "Запуск Днепрогэс"
 KHRUSCHEV_Dniepr_and_Volga_Dam_Works_desc: "После восстановления разрушенных плотин после Второй мировой войны пришло время перейти к новым проектам по использованию могучих рек Западной России. Новая ГЭС на Волге и Днепре принесут нам колоссальную выгоду."
 KHRUSCHEV_Ukranian_Industrial_Expansion: "Экспансия Украинской промышленности"
 KHRUSCHEV_Ukranian_Industrial_Expansion_desc: "Промышленность Украины является одной из лучших в Советском Союзе и находится в процессе восстановления после великой отечественной войны . Мы должны вкладывать в них средства, чтобы ускорить этот процесс."
 KHRUSCHEV_Expand_the_Siberian_Railways: "Расширить железнодорожное строительство Сибири"
 KHRUSCHEV_Expand_the_Siberian_Railways_desc: "Часто единственное, что связывает города и провинции в замерзших просторах Сибири, -  это железные дороги, и они плохо развиты. Нам нужно расширить строительство и улучшить Сибирские железные дороги."
 KHRUSCHEV_Complete_the_Sixth_Five_Year_Plan: "Завершить шестую пятилетку"
 KHRUSCHEV_Complete_the_Sixth_Five_Year_Plan_desc: "Шестая пятилетка дала потрясающие результаты. Мы восстановили, переоснастили и расширили промышленность и производственную мощь нашей страны. Пришло время завершить программы плана и двигаться дальше в будущее."
 KHRUSCHEV_Declare_Lysenkos_Theories_Quackery: "Объявить теории Лысенко бредом"
 KHRUSCHEV_Declare_Lysenkos_Theories_Quackery_desc: "Наши прежние сельскохозяйственные практики и теории основывались на работах некоего Трофима Лысенко. Недавно наши ученые доказали, что его работа была не более чем лженаукой, и почти все, во что он верил, было бредом. Пришло время заняться делом и покинуть тонущий корабль."
 KHRUSCHEV_Heavily_Emphasize_Agriculture: "Акцент на сельском хозяйстве"
 KHRUSCHEV_Heavily_Emphasize_Agriculture_desc: "Наш народ слишком долго голодал. Еще до того, как нацистская угроза пронеслась по нашим землям и сожгла наши поля, снабжение продовольствием было проблемой, и, безусловно, сейчас. Пришло время покончить с этим."
 KHRUSCHEV_The_Virgin_Lands_Campaign: "Освоение целины"
 KHRUSCHEV_The_Virgin_Lands_Campaign_desc: "Кампания по разработке целины направлена на использование ранее нетронутых земель для сельского хозяйства. Это расширит наши возможности по производству продуктов питания и их хранению."
 KHRUSCHEV_Create_New_Sovkhozes: "Создавать новые совхозы"
 KHRUSCHEV_Create_New_Sovkhozes_desc: "Совхозы, или государственные хозяйства, жизненно важны для нас. Создание большего количества из них будет только пользой для нас."
 KHRUSCHEV_Reassert_Agricultural_Prices: "Проработка цен на сельхоз продукцию"
 KHRUSCHEV_Reassert_Agricultural_Prices_desc: "Восстановив контроль над ценами в сельскохозяйственном секторе мы защитим наших колхозников и обеспечим всем справедливый сбыт их товара."
 KHRUSCHEV_Inaugurate_the_Seventh_Five_Year_Plan: "Торжественное открытие седьмой пятилетки"
 KHRUSCHEV_Inaugurate_the_Seventh_Five_Year_Plan_desc: "Седьмой пятилетний план определит экономическую направленность и перспективы СССР на следующие пять лет. Наши люди усердно работали и представили Н. С. Хрущеву комплексный пакет, в котором подробно описывался большой перечень мероприятий, предпринятых во всех отраслях промышленности, во всех регионах нашей страны."
 KHRUSCHEV_Replace_Old_Coal_Trains: "Заменить старые угольные составы"
 KHRUSCHEV_Replace_Old_Coal_Trains_desc: "Угольных шахт у нас много, так что добывать уголь не проблема. Однако наши поезда, идущие от шахт до заводов и городов, устарели, ненадежны и подвержены авариям. Замена их является необходимостью."
 KHRUSCHEV_Increase_Oil_Investments: "Увеличение инвестиций в добычу нефти"
 KHRUSCHEV_Increase_Oil_Investments_desc: "По мере развития экономики, нефть становится все более важной и необходимой для нашего развития. У нас на Кавказе большие резервы, и не имеет смысла их более игнорировать."
 KHRUSCHEV_Engage_Railway_Improvements: "Модернизация железных дорог"
 KHRUSCHEV_Engage_Railway_Improvements_desc: "Мы начали модернизировать и обновлять наши железнодорожные системы, железнодорожные пути и вагоны, но нам еще предстоит проделать большую работу, если мы хотим иметь хорошую инфраструктуру."
 KHRUSCHEV_Further_Infrastructure_Efforts: "Продолжение модернизаций инфроструктурны"
 KHRUSCHEV_Further_Infrastructure_Efforts_desc: "Постоянное улучшение железнодорожной инфраструктуры важно для единства нашей страны, это улучшит нашу экономику и качество жизни на местах, а также позволит быстрее передислоцировать дивизии и их снабжение."
 KHRUSCHEV_Modernize_Gas_Facilities: "Модернизация заправочных станций"
 KHRUSCHEV_Modernize_Gas_Facilities_desc: "Все больше и больше наших людей ездят на автомобилях, все больше и больше сырья, промышленных товаров и даже военной техники перевозится грузовиками. Все эти транспортные средства нуждаются в бензине, а для этого требуется больше заправочных станций. "
 KHRUSCHEV_Create_a_Large_Petro_Chemical_Industry: "Создать крупную нефтехимическую отрасль"
 KHRUSCHEV_Create_a_Large_Petro_Chemical_Industry_desc: "Наша страна, особенно Кавказский регион, обладает обилием природных нефтяных месторождений, но все же в наших интересах строить и поддерживать новые нефтехимические заводы и предприятия"
 KHRUSCHEV_Expand_Chemicals_Production_Beyond_the_Ural: "Расширить химическую промышленость за Уралом"
 KHRUSCHEV_Expand_Chemicals_Production_Beyond_the_Ural_desc: "Уральский хребет-это огромный разделительный барьер в нашей стране, отделяющий западную Россию от Сибири. Несмотря на неразвитость, регион за Уралом богат минеральными и сырьевыми ресурсами и заслуживает развития как естественной, так и синтетической химической промышленности."
 KHRUSCHEV_Pipeline_Network_Expansion: "Расширить нефтепровод"
 KHRUSCHEV_Pipeline_Network_Expansion_desc: "Если нефть - это жизненная сила механизированной экономики, то наша трубопроводная сеть-это ее артерии. Нефть может течь только там, где есть трубопроводы, поэтому расширение нашей сети будет жизненно важно для благосостояния нашей экономики."
 KHRUSCHEV_Restore_The_Prominence_of_the_Communist_Party: "Реабилитировать авторитет Компартии"
 KHRUSCHEV_Restore_The_Prominence_of_the_Communist_Party_desc: "Особенно в последние годы жизни товарищ Сталин взялся за то, чтобы отодвинуть Партию на второй план. Настало время вернуть Коммунистической партии ее законное место в нашем обществе."
 KHRUSCHEV_Reactivate_the_CPSU_Apparatus: "Реабилитация аппарата КПСС"
 KHRUSCHEV_Reactivate_the_CPSU_Apparatus_desc: "Сталин не только отодвинул партию в сторону, но и закрыл партийный аппарат, еще больше снизив его значение и влияние. Мы должны его реанимировать для укрепления власти партийной верхушки."
 KHRUSCHEV_Put_Beria_on_Trial: "Отдать Берию под суд"
 KHRUSCHEV_Put_Beria_on_Trial_desc: "Лаврентий Берия, предатель и змей, бывший глава НКВД, использовал свое положение в заговоре против нас, партии и народа. Есть слухи, что он даже радовался смерти товарища Сталина! Наглость этой свиньи не имеет границ! Суд слишком хорош для него! Тем не менее, мы должны его судить, пусть этот суд будет импровизированным или сфальсифицированным, нужно показать народу легитимность нашей новый власти."
 KHRUSCHEV_Revitilize_Party_Activity: "Расширить партийную работу"
 KHRUSCHEV_Revitilize_Party_Activity_desc: "Различные попытки привлечь общества к партийной работе всё сложнее что плохо для людей и для нас. Нам нужно реабилитировать репутацию КПСС не только для увеличение доверия среди народа, но и для привлечение новых молодых амбициозных кадров."
 KHRUSCHEV_Seek_the_Approval_of_The_Central_Committee: "Добиваться одобрения ЦК"
 KHRUSCHEV_Seek_the_Approval_of_The_Central_Committee_desc: "За исключением Хрущева, Центральный комитет является самой влиятельной и могущественной организацией в СССР. Нам понадобится их одобрение, если мы хотим достичь чего-то существенного."
 KHRUSCHEV_Gain_Lower_Membership_Support: "Низкая поддержка партии"
 KHRUSCHEV_Gain_Lower_Membership_Support_desc: "Наша поддержка исходит от обеспеченных граждан, которые довольны существующим положением вещей. Мы должны убедить низшие слои нашего населения в том, что партия нашей страны учитывает и их интересы."
 KHRUSCHEV_Assert_Khruschevs_Legitimacy: "Отстаивать легитимность власти Хрущева"
 KHRUSCHEV_Assert_Khruschevs_Legitimacy_desc: "Теперь, когда мы укрепили Коммунистическую партию и вернули ей ее законное положение, ясно, что наш новый Лидер, Никита Хрущев, останется здесь, так как является наиболее компетентным человеком для этой работы. Мы должны убедится в том что наше население придерживается такой же точки зрение."
 KHRUSCHEV_Renounce_Stalins_Ways: "Отказаться от Cталинского пути"
 KHRUSCHEV_Renounce_Stalins_Ways_desc: "Товарищ Сталин требовал абсолютной преданности, настолько абсолютной, что она душила. Наш новый лидер не требует ничего подобного. Он просто добрый и очень хороший человек, который только хочет быть любимым своим народом."
 KHRUSCHEV_Criticize_the_Lenningrad_Affair: "Раскритиковать ленинградское дело"
 KHRUSCHEV_Criticize_the_Lenningrad_Affair_desc: "Ленинградское дело - это серия судебных процессов в конце 1940-х в начале 1950-х годов против партийных и государственных руководителей в основном обвинявшийся в коррупции. Но Н.С. Хрущёв считает это дело грязным  инцидентом, спровоцированным параноидальным стареющим и больным на голову лидером, подозревавшим всех в Союзе в заговоре с целью его убийства. По этой причине партия принимает решение что нужно оставить это позади и дистанцироваться от этого."
 KHRUSCHEV_Clear_Out_the_Gulags: "Ликвидировать ГУЛАГи"
 KHRUSCHEV_Clear_Out_the_Gulags_desc: "Большое количество политзаключенных находятся в ГУЛАГе. Закрытие его упростит нашу бюрократию, уменьшит наши расходы и позволит увеличить доверия к нашей власти."
 KHRUSCHEV_Restore_Public_Order_and_Legality: "Восстановить общественный порядок"
 KHRUSCHEV_Restore_Public_Order_and_Legality_desc: "Из-за нашей недавней политики \"десталинизации\" многие из сторонников нашего бывшего лидера бунтуют на улицах, особенно после того, как мы решили переименовать города, названные его именем, в частности Сталино и Сталинград, в их оригинальные названия. Нам необходимо сейчас восстановить порядок.."
 KHRUSCHEV_Ensure_Moderate_Support: "Обеспечить поддержку партий населением "
 KHRUSCHEV_Ensure_Moderate_Support_desc: "Хотя они, возможно, и не самые заметные но сторонники умеренной позиций составляют большую часть общественного мнения в Советском Союзе , и мы обязаны заручиться их поддержкой любыми возможными способами.."
 KHRUSCHEV_Establish_a_New_Diplomatic_Stance: "Новый дипломатический курс"
 KHRUSCHEV_Establish_a_New_Diplomatic_Stance_desc: "Возможно наша новая дипломатия покажется западу более мягкой, превратив Железный занавес в проволочную ограду. Но внешность обманчива. Может быть, мы и не отправим сейчас войска туда куда следовало бы отправить, но мы все равно будем бороться за коммунизм по всему миру."
 KHRUSCHEV_Push_for_the_Hydrogen_Bomb: "Подтолкнуть процесс создания водородной бомбы"
 KHRUSCHEV_Push_for_the_Hydrogen_Bomb_desc: "Если мы хотим что бы Американцы серьёзно относились к нашим угрозам, мы должны быть в состоянии нанести такой же ущерб, как и они. А для этого нам нужна водородная бомба, новейшая разработка в области технологии ядерного вооружения."
 KHRUSCHEV_Establish_the_Strategic_Missle_Forces: "Создание РВСН"
 KHRUSCHEV_Establish_the_Strategic_Missle_Forces_desc: "По мере роста наших ракет нам нужна более организованная и централизованная структура для контроля за распределением, обслуживанием и, в случае необходимости, запуском их."
 KHRUSCHEV_Heavily_Fund_Ballistic_Programs: "Активно финансировать баллистическую программу"
 KHRUSCHEV_Heavily_Fund_Ballistic_Programs_desc: "Вкладывая большое количество денег в баллистические исследования, мы можем извлечь выгоду из созданных из а этого технологии применяя их к  пулям, снарядам, ракетам - всего, что имеет баллистическую траекторию.."
 KHRUSCHEV_Create_the_Soviet_Space_Program: "Создание советской космической программы"
 KHRUSCHEV_Create_the_Soviet_Space_Program_desc: "С развитием ракетных технологии, кажется, что космос - последний рубеж - наконец-то в пределах нашей досягаемости. Теперь у нас есть возможность, впервые в истории, послать туда что-то из нашей атмосферы. Нам нужно только выяснить, как."
 KHRUSCHEV_Build_the_Baikonur_Cosmodrome: "Начать строительство космодрома Байконур"
 KHRUSCHEV_Build_the_Baikonur_Cosmodrome_desc: "Строительство крупного объекта, способного создавать и поддерживать запуски наших ракет, является абсолютной необходимостью. Байконур, отдаленная казахская степь, - идеальное место."
 KHRUSCHEV_Persue_Civil_Nuclear_Research: "Начать исследования мирного атома"
 KHRUSCHEV_Persue_Civil_Nuclear_Research_desc: "Несмотря на то, что наше внимание было в основном сосредоточено на его разрушительном применении, ядерная физика и в целом эта отрасль науки также имеет гражданское применение. В частности, возможность создать, невероятно мощный источник энергии."
 KHRUSCHEV_Stimulate_Scientific_Competition: "Содействовать конкуренции в науке"
 KHRUSCHEV_Stimulate_Scientific_Competition_desc: "Стимулируя научную конкуренцию, мы будем поощрять наших исследователей к созданию более инновационных проектов, с предполагаемым результатом улучшения технических характеристик, новых достижений и снижения затрат."
 KHRUSCHEV_Fill_the_Missle_Gap: "Закрыть брешь в ракетостроении"
 KHRUSCHEV_Fill_the_Missle_Gap_desc: "Благодаря своей преимуществу в этой области американцы имеют большие возможности в быстром строительстве ракет. Опять же, если мы хотим, чтобы нас воспринимали всерьез, мы должны иметь возможность опередить их."
 KHRUSCHEV_Boost_Electronics_Research_and_Development: "Ускорить исследования и разработку в области электроники"
 KHRUSCHEV_Boost_Electronics_Research_and_Development_desc: "С каждым днём электроника играет всю большую роль в жизни наших учёных, инженеров и экономистов нашей страны. По этой причине нам нужно еще больше сосредоточить наши исследования в этой области."
 KHRUSCHEV_Compete_with_American_Scientists: "Конкурировать с американскими учеными"
 KHRUSCHEV_Compete_with_American_Scientists_desc: "Наши недавние научно-исследовательские работы окупились, и наши блестящие и перспективные умы работают вместе с нашими признанными лидерами, чтобы привести советскую науку в новую эпоху, лучшую эпоху, в которой мы можем конкурировать с американским империализмом и побеждать его."
 KHRUSCHEV_Establish_the_KGB: "Создать КГБ"
 KHRUSCHEV_Establish_the_KGB_desc: "КГБ - Комитет государственной безопасности - это наш ответ ЦРУ. Он будет стремиться распространить наши интересы и идеологии далеко за пределами нашей страны, подавлять внутренних диссидентов и, наоборот, сеять инакомыслие на землях наших врагов."
 KHRUSCHEV_Fund_Latin_American_Communist_Movements: "Создать фонд для латиноамериканских коммунистических движений"
 KHRUSCHEV_Fund_Latin_American_Communist_Movements_desc: "В настоящее время Латинская Америка является очагом коммунистов и коммунистических движений, и в наших интересах финансировать эти группы и раздувать пламя революции в Западном полушарии."
 KHRUSCHEV_Help_FARC: "Помочь «ФАРК»"
 KHRUSCHEV_Help_FARC_desc: "В Южной Америке коммунистические повстанцы ФАРК ведут борьбу за выживание коммунизма в Колумбии против капиталистического режима старого порядка. Мы должны помочь им всем, чем сможем."
 KHRUSCHEV_Befriend_Castros_Regime: "Подружиться с Фиделем Кастро"
 KHRUSCHEV_Befriend_Castros_Regime_desc: "Фидель Кастро, новый лидер Кубы, является хорошим потенциальным союзником. Американцы не признали его власть,  дружба с ним сейчас дала бы нам стратегические порты и базы в пределах досягаемости США.."
 KHRUSCHEV_Integrate_Cuba_into_the_Eastern_Bloc: "Интеграция Кубы в Восточный блок"
 KHRUSCHEV_Integrate_Cuba_into_the_Eastern_Bloc_desc: "Теперь, когда у нас есть более тесные связи с Фиделем Кастро, пришло время полностью интегрировать Кубу в наши структуры экономического и военного сотрудничества - Варшавский договор и СЭВ. "
 KHRUSCHEV_Deploy_Ballistic_Forces_to_Cuba: "Развертывание баллистических ракет на Кубе"
 KHRUSCHEV_Deploy_Ballistic_Forces_to_Cuba_desc: "Кубинские авиабазы предоставляют нам возможность, которой у нас никогда не было раньше, - стартовую платформу всего в нескольких милях от побережья Флориды и в пределах досягаемости даже самых маленьких ядерных ракет. Мы должны воспользоваться этим и использовать это как рычаг против американцев."
 KHRUSCHEV_Fund_Nasserist_Egypt: "Создание фонда для Насеристов в Египта"
 KHRUSCHEV_Fund_Nasserist_Egypt_desc: "Хотя Насер, возможно, не так склонен к коммунизму, как нам бы хотелось, он не реакционная западная марионетка, как шах и эти выскочки-евреи. Помощь ему даст нам плацдарм на Ближнем Востоке, который мы сможем использовать в своих интересах."
 KHRUSCHEV_Invest_in_Burma: "Инвестировать в Бирму"
 KHRUSCHEV_Invest_in_Burma_desc: "Бирма-страна слаборазвитая, но они все равно наши братья по оружию в борьбе с капитализмом, и для этого мы обеспечим денежное финансирование их промышленности и народа."
 KHRUSCHEV_Arm_Algerian_Rebels: "Вооружить Алжирских повстанцев"
 KHRUSCHEV_Arm_Algerian_Rebels_desc: "Вооружая и поддерживая алжирских повстанцев, мы можем еще больше ослабить хватку империалистических держав в Африке."
 KHRUSCHEV_Aid_the_Congolese_Insurgency: "Помощь Конголезским повстанцам"
 KHRUSCHEV_Aid_the_Congolese_Insurgency_desc: "Бельгийцы долгое время угнетали, подавляли и подавляли коренное конголезское население Центральной Африки, и они восстали против своих сюзеренов. Нам нужно послать им помощь."
 KHRUSCHEV_Strengthen_Influence_in_Occidental_French_Africa: "Усилить влияние в западной части французской Африки"
 KHRUSCHEV_Strengthen_Influence_in_Occidental_French_Africa_desc: "Укрепляя наши усилия по контролю над политикой в странах Африки к югу от Сахары, мы можем расширить нашу сферу влияния, одновременно ослабляя французов."
 KHRUSCHEV_The_Soviet_Airforce: "Советские ВВС"
 KHRUSCHEV_The_Soviet_Airforce_desc: "Наши военно-воздушные силы начали стремительно продвигаться вперед, вводя реактивные самолеты во все районы операций для выполнения любых задач, которые нам могут потребоваться, но мы не можем останавливаться на достигнутом. Мы должны продолжать развивать нашу технологию реактивного и воздушного оружия."
 KHRUSCHEV_Research_High_Speed_Bombers: "Исследовать высокоскоростные бомбардировщики"
 KHRUSCHEV_Research_High_Speed_Bombers_desc: "Основным недостатком больших стратегических бомбардировщиков является их скорость. Они очень медленные. Таким образом, если мы сможем спроектировать и разработать скоростной бомбардировщик, способный преодолеть звуковой барьер, это даст нашим бомбардировщикам большую власть над противовоздушными позициями и перехватчиками."
 KHRUSCHEV_Restart_the_Flying_Submarine_Program: "Перезапустить программу аэростатов"
 KHRUSCHEV_Restart_the_Flying_Submarine_Program_desc: "Летающая подводная лодка. Что еще можно сказать? Это эпично. Это великолепно. Это чертова летающая подводная лодка."
 KHRUSCHEV_Invest_in_Traditional_Aircraft: "Инвестировать в традиционную авиацию"
 KHRUSCHEV_Invest_in_Traditional_Aircraft_desc: "Летающие подводные лодки? Пфф. Что за идиотская идея. Это никогда не будет актуальным. Сосредоточимся на - традиционных самолетах - гораздо предпочтительнее безрассудных проектов, которые впустую тратят наше время и деньги."
 KHRUSCHEV_Increase_Aircraft_Production: "Увеличить производство реактивных самолётов"
 KHRUSCHEV_Increase_Aircraft_Production_desc: "Если мы хотим контролировать небо в крупномасштабной войне, нам нужно больше самолетов, чтобы защитить или захватить его. Необходимо наращивать производство реактивных самолетов."
 KHRUSCHEV_The_Tu_114_Propaganda_Campaign: "Рекламная кампания Ту-114"
 KHRUSCHEV_The_Tu_114_Propaganda_Campaign_desc: "Ту-114 - это совершенно новая конструкция, которую можно использовать как пассажирский лайнер или дальний бомбардировщик. Полеты Ту-114 по всему миру принесут нам признание и принесут некоторую известность нашим инженерам."
 KHRUSCHEV_Indian_Arms_Deals: "Военная сделка с Индией"
 KHRUSCHEV_Indian_Arms_Deals_desc: "Индийское правительство обратилось к нам и хотело бы купить у нас оружие для поддержки своих молодых военных в обмен на крупные инвестиции в наш гражданский сектор и некоторую наличность. Это хорошая идея."
 KHRUSCHEV_Adopt_the_MiG_15: "Принять на вооружение Миг-15"
 KHRUSCHEV_Adopt_the_MiG_15_desc: "Миг-15 - это топовая, передовая, многоцелевая конструкция, и принятие ее на вооружение наших ВВС святое дело."
 KHRUSCHEV_Invest_in_Recon_Drone_Initiatives: "Инвестировать в беспилотные аппараты"
 KHRUSCHEV_Invest_in_Recon_Drone_Initiatives_desc: "Наши лучшие инженеры-аэродинамики начали изучать беспилотную лётную технику, способную фотографировать и докладывать командованию разведывательные данные. В случае успеха эти беспилотники станут революционными и крайне полезными для наших вооруженных сил."
 KHRUSCHEV_Focus_on_Jet_Interceptors: "Сосредоточьтесь на реактивных истребителях-перехватчиках"
 KHRUSCHEV_Focus_on_Jet_Interceptors_desc: "Сосредоточение внимания на перехватчиках, которые созданы для скорости, но также могут выполнять более сложные маневры с высокой перегрузкой, Это предпочтительнее чем перехватчики с высоким числом Маха."
 KHRUSCHEV_Prioritize_High_Speed_Interceptors: "Приоритет на высокоскоростные перехватчики"
 KHRUSCHEV_Prioritize_High_Speed_Interceptors_desc: "У нас всегда есть многоцелевые и близкие самолеты воздушной поддержки для выполнения задач, не связанных с перехватом. Наши перехватчики должны быть исключительно перехватчиками, причем лучшими из лучших."
 KHRUSCHEV_The_Soviet_Army: "Советская армия"
 KHRUSCHEV_The_Soviet_Army_desc: "Наша армия постоянно растет, но размеры это еще не все. Нам нужны современные технологии, чтобы снабжать наших солдат, если они хотят иметь шанс сражаться на равных или превосходить противника."
 KHRUSCHEV_Adopt_the_AKM: "Принять АКМ"
 KHRUSCHEV_Adopt_the_AKM_desc: "АКМ - еще одна революционная разработка гениального изобретателя Михаила Калашникова, Героя Советского Союза. Усовершенствованная конструкция АК-47, это вращающийся затвор и газовая перезарядка, снижающие нагрузку на стрелка и позволяющие ему сосредоточиться на противнике.."
 KHRUSCHEV_Modernize_Surface_to_Air_Missles: "Модернизировать ракеты класса «Земля-воздух»"
 KHRUSCHEV_Modernize_Surface_to_Air_Missles_desc: "ЗРК - это будущее противовоздушного оружия. Используя радары и ракеты, а не человеческую оценку и зенитные снаряды, они намного более эффективны и действенны. При этом нам все еще нужно убедиться, что наш проекты смогут реализовать не только в теории."
 KHRUSCHEV_Invest_in_the_T55: "Инвестировать в Т-55"
 KHRUSCHEV_Invest_in_the_T55_desc: "Т-55 будет новым основным боевым танком нашего танкового корпуса, и на момент его разработки он является одним из лучших в мире. Хорошая идея - вложить значительные средства в его производство, чтобы быстрее распространять его среди наших войск.."
 KHRUSCHEV_Advanced_ATGM_Designs: "Усовершенствовать ПТУР"
 KHRUSCHEV_Advanced_ATGM_Designs_desc: "По мере совершенствования танков совершенствуется и наше противотанковое оружие. Противотанковые управляемые ракеты - это новые Panzerschrecks и базуки, и мы не должны отставать в этой области. Нам необходимо создавать современные конструкции, способные уничтожить любую американскую технику.."
 KHRUSCHEV_The_BMP: "БМП"
 KHRUSCHEV_The_BMP_desc: "БМП-1, боевая машина пехоты-1 (БМП), предоставит нашим войскам новый вид бронетранспортера, который придаст им большую гибкость, чем когда-либо прежде. Сочетая в себе функцию бронетранспортера с более тяжелой броней легкого танка, он позволит нашим войскам действовать в большей безопасности даже в условиях ядерных и химических атак."
 KHRUSCHEV_Reinforce_Ties_within_the_Socialist_World: "Укрепление связей внутри Социалистического лагеря"
 KHRUSCHEV_Reinforce_Ties_within_the_Socialist_World_desc: "Наши собратья-коммунисты и социалисты-это все, что у нас есть в продолжающемся конфликте с капиталистическим и империалистическим Западом. Сейчас, как никогда, мы должны держаться вместе и подтвердить нашу преданность друг другу."
 KHRUSCHEV_Promote_Softer_Leadership_in_the_Eastern_Bloc: "Проводить мягкую политику в Восточном блоке"
 KHRUSCHEV_Promote_Softer_Leadership_in_the_Eastern_Bloc_desc: "Наша сфера часто изображается Западом как лишенная жизни и творчества, задушенная красной угрозой. И хотя это не более чем грязная ложь и клевета, наша нация, а также наши друзья могли бы использовать некоторую поддержку и, возможно, даже большую свободу выражения для нашего народа.."
 KHRUSCHEV_Consolidate_Soviet_Supremacy: "Закрепить Советское превосходство"
 KHRUSCHEV_Consolidate_Soviet_Supremacy_desc: "Ясно, что мы контролируем Социалистический мир. У нас самые сильные вооруженные силы и самое сильное влияние в ООН. Мы должны воспользоваться этим и сплотить наших \"друзей\" в единое целое."
 KHRUSCHEV_Allow_Liberalization_Throughout_the_Bloc: "Позволить либеральную политику во всем блоке"
 KHRUSCHEV_Allow_Liberalization_Throughout_the_Bloc_desc: "Возможно, небольшое ослабление сталинских репрессий необходимо, если мы хотим продолжать пользоваться поддержкой нашего народа. Позволить себе немного более либеральные мысли и речи не повредит, верно? Совсем чуть-чуть."
 KHRUSCHEV_The_Soviet_Navy: "Советский флот"
 KHRUSCHEV_The_Soviet_Navy_desc: "Мы действительно добились некоторого прогресса в модернизации нашего флота между концом Второй мировой войны и тем, где мы находимся сейчас, но этого все еще недостаточно. Сейчас наш подводный флот скромен по сравнению с американским.."
 KHRUSCHEV_Project_627_Kit: "Пакет проекта 627"
 KHRUSCHEV_Project_627_Kit_desc: "Проект 627-это новая современная подводная лодка большой дальности, которая, как предполагается, способна запускать баллистические ракеты, что дает нашим силам серьёзное стратегическое преимущество в сдерживании противника и радиусе полета ракет."
 KHRUSCHEV_Project_672: "Проект 627"
 KHRUSCHEV_Project_672_desc: "Проект 672 схож по концепции с проектом 627, но отличается по нескольким ключевым направлениям, таким как его предназначение и технологические характеристики. Впрочем, заглянуть в него тоже будет полезно."
 KHRUSCHEV_Kotlin_Class_Destroyer: "Эсминец класса Котлин"
 KHRUSCHEV_Kotlin_Class_Destroyer_desc: "Эсминец класса \"Котлин\" станет главной эскортной и экранной платформой нашего флота, когда будет завершена первая партия. Он представляет собой большой скачок вперед для нашего надводного флота и дает нам корабль наравне с американскими эсминцами."
 KHRUSCHEV_Ka_25_Naval_Helicoptor: "Морской вертолет Ка-25"
 KHRUSCHEV_Ka_25_Naval_Helicoptor_desc: "Вертолет Ка-25 - это первый шаг в новом направлении нашей воздушной морской войны. Он предлагает лучший способ разведки и уничтожения вражеских подводных лодок, и может быть запущен даже с наших самых незначительных по размеру кораблей."
 KHRUSCHEV_Grozny_Class_Destroyer: "Эсминец класса Грозный"
 KHRUSCHEV_Grozny_Class_Destroyer_desc: "Наши инженеры привлекли наше внимание к радикально новой конструкции крейсера, который, вместо того, чтобы сосредоточиться на традиционных миссиях поддержки, будет нести смертоносные противокорабельные ракеты которые послужат хорошим подарок для наших врагов."
 KHRUSCHEV_Refine_COMECON: "Улучшить работу СЭВ"
 KHRUSCHEV_Refine_COMECON_desc: "СЭВ - это полезная организация, которая упрощает экономическое сотрудничество Восточного блока, но она сама нуждается в некоторой оптимизации."
 KHRUSCHEV_Create_Permanent_Sectoral_Commissions: "Создать постоянные отраслевые комиссии"
 KHRUSCHEV_Create_Permanent_Sectoral_Commissions_desc: "Создание постоянных комиссий по надзору за различными проектами и регионами членов СЭВ будет способствовать повышению эффективности наших мер и действий."
 KHRUSCHEV_Establish_a_CMEA_Secretariat: "Создать Секретариат СЭВ"
 KHRUSCHEV_Establish_a_CMEA_Secretariat_desc: "Нам нужна должность во главе Совета по экономической взаимопомощи, желательно одного из наших людей, чтобы помочь организовать и контролировать СЭВ."
 KHRUSCHEV_Boost_the_Polish_Economy: "Стимулировать Польскоую экономику"
 KHRUSCHEV_Boost_the_Polish_Economy_desc: "Польская экономика находится в стагнации с момента своего освобождения в 1945 году. Поскольку это один из самых крупных членов нашей сферы, было бы разумно им помочь."
 KHRUSCHEV_Increase_East_German_Trade: "Расширить Восточногерманскую торговлю"
 KHRUSCHEV_Increase_East_German_Trade_desc: "Восточная Германия обладает одними из крупнейших месторождений ресурсов и производственными базами в СЭВ и остро нуждается в деньгах, поэтому мы можем принести пользу нам, приобретая их продукцию, а им - предоставляя всё им необходимые."
 KHRUSCHEV_Develop_Black_Sea_Exchanges: "Развитие ЧЭС"
 KHRUSCHEV_Develop_Black_Sea_Exchanges_desc: "Чёрное море почти со всех сторон окружено нами или дружественными нам странами, и, тем не менее, через него проходит очень мало торговых потоков. Мы должны облегчить прохождение товаров через него."
 KHRUSCHEV_Give_Loans_to_Hungary_and_Czechoslovakia: "Выдать кредиты Венгрии и Чехословакии"
 KHRUSCHEV_Give_Loans_to_Hungary_and_Czechoslovakia_desc: "Кажется, что все наши союзники все время отчаянно нуждаются в деньгах. Это расстраивает, но их дружба важнее, чем нашии резервы."
 KHRUSCHEV_Develop_Intrabloc_Tourism: "Развитие туризма стран ОВД"
 KHRUSCHEV_Develop_Intrabloc_Tourism_desc: "По всей Восточной Европе есть множество красивых мест, как природных, так и созданных руками человека, и, поощряя граждан из всех регионов путешествовать и тратить деньги в других странах, мы можем стимулировать экономику всех стран-членов СЭВ."
 KHRUSCHEV_The_Berlin_Gamble: "Берлинская авантюра"
 KHRUSCHEV_The_Berlin_Gamble_desc: "Статус Берлина-это вопрос, который должен быть решен в нашу пользу, и быстро. Американцы отказываются сдавать свой последний бастион капитализма на Востоке, но Западный Берлин представляет серьезную угрозу нашей безопасности. Пришло время покончить со статусом - кво, и потребовать вывод всех сил НАТО из Берлина для полной аннексией Восточной Германией."
 KHRUSCHEV_Promote_Intergenerational_Cohabitation_and_Solidarity: "Солидарность поколений"
 KHRUSCHEV_Promote_Intergenerational_Cohabitation_and_Solidarity_desc: "В нашей стране существует разрыв поколений между теми, кто воевал, страдал и жертвовал в Великой Отечественной войне, и их детьми, которые знают только мир, пусть и хрупкий. Мы должны помогать эти двум поколения найти общий язык, какими бы разными они не были."
 KHRUSCHEV_Equalize_Wages: "Уравнять зарплаты"
 KHRUSCHEV_Equalize_Wages_desc: "Мужчины и женщины имеют одинаковые возможности трудоустройства в СССР, но кажется, что мужчины зарабатывают больше денег, выполняя одинаковый объем работы, что абсурдно. Нам необходимо обеспечить равную оплату труда во всей нашей стране."
 KHRUSCHEV_Control_Renting_and_Heating_Prices: "Контроль цен на коммунальные платежи"
 KHRUSCHEV_Control_Renting_and_Heating_Prices_desc: "Поскольку стоимость аренды жилья и расходы на отопление растут, многие из бедных людей в нашей стране изо всех сил пытаются сохранить свои дома. Контролируя цены и снижая их, мы можем уберечь наших граждан от участия остаться на улице."
 KHRUSCHEV_Regionalize_Economic_Decision_Process: "Региональная экономическая политика"
 KHRUSCHEV_Regionalize_Economic_Decision_Process_desc: "Наша страна слишком велика, чтобы мы могли проводить единую экономическую политику, которой должны придерживаться все регионы. Мы должны разбить наши постановления по регионам, чтобы лучше контролировать каждый регион нашей страны."
 KHRUSCHEV_Mobilize_Women_and_Soliders_in_the_Workforce: "Коллективизация военных и женщин"
 KHRUSCHEV_Mobilize_Women_and_Soliders_in_the_Workforce_desc: "Теперь, когда мы находимся в состоянии мира, нам необходимо укрепить нашу квалифицированную рабочую силу для улучшения нашей гражданской промышленности и услуг. Это поможет солдатам и женщинам получить работу на заводах."
 KHRUSCHEV_Comfort_for_the_People: "Улучшение комфорта для людей"
 KHRUSCHEV_Comfort_for_the_People_desc: "Мы, как нация, испытываем критическую нехватку потребительских товаров и предметов роскоши. Наши люди могут покупать еду и одежду, и немногим больше. Мы хотим, чтобы наши люди жили в комфорте, поэтому мы должны мобилизовать наши усилия, чтобы изменить это положение дел."
 KHRUSCHEV_Encourage_Growth_of_the_Automobile_Industry: "Стимулировать рост автомобильной промышленности"
 KHRUSCHEV_Encourage_Growth_of_the_Automobile_Industry_desc: "Автомобили и автобусы важны для современного гражданского общества. Это факт. Лошади и повозки устарели, и мы больше не должны ими пользоваться."
 KHRUSCHEV_Enhance_Synthetic_Fiber_Production: "Расширить производство синтетических волокон"
 KHRUSCHEV_Enhance_Synthetic_Fiber_Production_desc: "Улучшая производство искусственных волокон и тканей, мы можем сократить нашу потребность в экспорте из зарубежных стран и стать более самодостаточными.."
 KHRUSCHEV_Expand_Mineral_Fertilizer_Output: "Расширить производство минеральных удобрений"
 KHRUSCHEV_Expand_Mineral_Fertilizer_Output_desc: "Мы должны увеличить количество производимых минеральных удобрений, чтобы наши совхозы и колхозы могли их использовать и быть более продуктивными, что дало бы импульс нашему сельскому хозяйству.."
 KHRUSCHEV_The_Fate_of_the_Economic_Thaw: "Новая экономическая программа"
 KHRUSCHEV_The_Fate_of_the_Economic_Thaw_desc: "До сих пор наша экономическая политика и реформы, модернизация творила чудеса для нашего общества и отраслей промышленности. Давайте превратим эту волну процветания в длительный экономический подъем."
 KHRUSCHEV_Modernize_Obsolete_Machine_Tools: "Модернизация устаревших станков"
 KHRUSCHEV_Modernize_Obsolete_Machine_Tools_desc: "Слишком многие наши фабричные рабочие вынуждены использовать старые станки, которые могли существовать еще до Второй мировой войны. Это снижает их производительность и, следовательно, всю нашу цепочку поставок, поэтому эту ситуацию необходимо изменить.."
 KHRUSCHEV_Increase_Mechanization_of_Industry: "Повысить механизацию промышленности"
 KHRUSCHEV_Increase_Mechanization_of_Industry_desc: "Повышая уровень нашей промышленной механизации, мы можем дать нашим заводам большой прирост производительности и эффективности."
 KHRUSCHEV_Launch_Engineer_Training_Programs: "Запуск программы подготовки инженеров"
 KHRUSCHEV_Launch_Engineer_Training_Programs_desc: "В нашей стране существует большая нехватка инженеров, что вредит нашему промышленному прогрессу и техническому прогрессу, поэтому, создавая специализированные учебные заведения, мы можем изменить это."
 KHRUSCHEV_Lift_Heaviest_Tax_Burdens_on_Farmers: "Снизить налоги для сельского хозяйства"
 KHRUSCHEV_Lift_Heaviest_Tax_Burdens_on_Farmers_desc: "Нашим колхозникам пришлось страдать из-за непомерно высоких налогов, как на их продукцию, так и на их доходы, и в результате многие из них испытывают финансовые трудности. Нам нужно снизить налоги."
 KHRUSCHEV_Rationalized_Seed_Production: "Рационализировать семеноводство"
 KHRUSCHEV_Rationalized_Seed_Production_desc: "Наше семеноводство повсюду. Некоторые производители даже не ленятся проверять, какие семена они распространяют, и в то время как другие не делают этого, их качество семян ужасное. Мы должны исправить это немедленно."
 KHRUSCHEV_Supply_Farmers_with_New_Machinery: "Обеспечить фермеров новой техникой"
 KHRUSCHEV_Supply_Farmers_with_New_Machinery_desc: "Многие наши фермеры до сих пор пашут на волах и собирают урожай вручную. Это отнимает много времени и неэффективно для них, а также плохо для нас, потому что им требуется больше времени, чтобы доставлять продукты на рынок. Предоставляя фермерам машины и современное оборудование, мы можем это изменить."
 KHRUSCHEV_Open_Up_New_Fields: "Создать новые поля"
 KHRUSCHEV_Open_Up_New_Fields_desc: "Расчищая землю под новые поля и подготавливая их к посевам, мы можем ускорить сельскохозяйственный процесс и увеличить производство продовольствия."
 KHRUSCHEV_Establish_Agrarian_Banks: "Создать аграрные банки"
 KHRUSCHEV_Establish_Agrarian_Banks_desc: "Нашим фермерам нужен надежный, дружественный банк, к которому можно обратиться за кредитом в трудную минуту, что для них случается часто. Создание специальных аграрных банков заполнит дыру в нашей экономике."
 KHRUSCHEV_Further_Tax_Reliefs_on_Private_Plots: "Дополнительные налоговые льготы на частные участки"
 KHRUSCHEV_Further_Tax_Reliefs_on_Private_Plots_desc: "Мы и раньше давали нашим аграриям некоторые налоговые льготы, но факты показали, что этого недостаточно. Мы должны пойти дальше в оказании им помощи."
 KHRUSCHEV_Decentralize_Agricultural_Management: "Децентрализировать управление сельским хозяйством"
 KHRUSCHEV_Decentralize_Agricultural_Management_desc: "Децентрализовав управление сельским хозяйством, мы можем помочь нашим аграриям быстрее получать припасы и доставлять продукты питания с еще большей легкостью."
 KHRUSCHEV_Raise_Over_the_Quota_Rewards: "Повышение квот"
 KHRUSCHEV_Raise_Over_the_Quota_Rewards_desc: "Наша сельскохозяйственная промышленность основана на системе квот, которая устанавливает количество продовольствия, которое каждая ферма должна производить каждый год. Чтобы стимулировать колхозы быть более эффективными, мы должны увеличить премию за превышение квоты."
 KHRUSCHEV_Erase_Kolkhozy_Long_Term_Debts: "Простить Колхозам долгосрочные долги"
 KHRUSCHEV_Erase_Kolkhozy_Long_Term_Debts_desc: "Колхозы - это колхозы, которые наше правительство создало, чтобы обеспечить нашим людям больше продуктов питания. К сожалению, большинству из них требуется значительная кредитная помощь, в следчтивии того что они имеют большие долги. Мы должны стереть этот долг, чтобы помочь им."
 KHRUSCHEV_Expand_Central_Asian_Cotton_Fields: "Расширить центрально-азиатские хлопковые поля"
 KHRUSCHEV_Expand_Central_Asian_Cotton_Fields_desc: "На равнинах и степях Средней Азии, особенно вокруг Аральского моря, находятся обширные поля хлопка. Мы должны расширять их и эксплуатировать дальше, чтобы принести выгоду нашей экспортной экономике."
 KHRUSCHEV_Favor_Polyculture: "Признание Поликультуры"
 KHRUSCHEV_Favor_Polyculture_desc: "Поликультура - это форма сельского хозяйства , в которой более одного вид выращивается одновременно и в одном месте, имитируя разнообразие природных экосистем, - была доказана нашими учеными как крайне здравая и продуктивная теория, и мы должны принять её на вооружение ."
 KHRUSCHEV_Dig_the_Karakum_Canal: "Прорыть Каракумский канал"
 KHRUSCHEV_Dig_the_Karakum_Canal_desc: "После завершения строительства Каракумский канал станет одним из крупнейших в мире и будет ежегодно пропускать через себя 13 кубических километров воды из реки Амударья через пустыню Каракумы в Туркменистане."
 KHRUSCHEV_Preserve_Traditional_Agriculture: "Сохранить традиционное С/Х"
 KHRUSCHEV_Preserve_Traditional_Agriculture_desc: "Несмотря на всю нашу модернизацию в области сельского хозяйства, все еще есть место для традиционных практик, особенно в более сельских районах."
 KHRUSCHEV_Grant_Larger_Autonomy_to_Kolkhozes: "Дать колхозам полную самостоятельность"
 KHRUSCHEV_Grant_Larger_Autonomy_to_Kolkhozes_desc: "Колхозы, хотя и ответственные перед государством, должны быть наделены большей автономией, чтобы каждый мог определить методы, которые лучше всего подходит для него."
 KHRUSCHEV_Establish_Local_Food_Networks: "Создать местные продовольственные сети"
 KHRUSCHEV_Establish_Local_Food_Networks_desc: "Каждый отдельный маленький регион нашей страны зависит от получения пищи из далекого и отдаленного региона, что плохо для всех участников. Мы должны создать небольшие, полунезависимые продовольственные сети."
 KHRUSCHEV_Favor_Quality_Farmland: "Благосклонность к качественным сельскохозяйственным угодьям"
 KHRUSCHEV_Favor_Quality_Farmland_desc: "До сих пор количество над качеством было нашим руководящим принципом. Чем больше земли, тем лучше, независимо от врожденной способности поддерживать жизнь растений и рост урожая. Это неразумно и непродуктивно, и должно быть изменено."
 KHRUSCHEV_Create_Massive_Agricultural_Complexes: "Создать большие сельскохозяйственные комплексы"
 KHRUSCHEV_Create_Massive_Agricultural_Complexes_desc: "У нас есть огромные участки земли, и было бы стыдно тратить их впустую. Большие, разросшиеся сельскохозяйственные комплексы-лучший способ достичь нашей цели сельскохозяйственной самодостаточности."
 KHRUSCHEV_Expand_Storage_Facilities: "Расширить складские помещение"
 KHRUSCHEV_Expand_Storage_Facilities_desc: "Мы создаем больше пищи, и это хорошо, но у нас не хватает мест, чтобы хранить ее, а это так... не так хорошо. Очевидно, что эта ситуация должна измениться как можно скорее."
 KHRUSCHEV_Large_Scale_Maize_Production: "Крупномасштабное засевание кукурузой"
 KHRUSCHEV_Large_Scale_Maize_Production_desc: "Кукуруза-чудесное растение. Оно живучие, может расти где угодно и невероятно сытное. Таким образом, это идеальная культура для того что бы прокормить народ."
 KHRUSCHEV_Encourage_Higher_Quotas: "Дать более высокие квоты С/Х"
 KHRUSCHEV_Encourage_Higher_Quotas_desc: "Наши колхозы трудятся не покладая рук, но этого недостаточно. Мы дали им передышку и помощь, а теперь пришло время отплатить им той же монетой."
 KHRUSCHEV_Promote_Agrarian_Propaganda: "Аграрная пропаганда"
 KHRUSCHEV_Promote_Agrarian_Propaganda_desc: "Мы должны дать нашим людям знать, насколько мы продвинулись в этом направлении, чтобы они могли быть уверены, что не останутся голодными."
 KHRUSCHEV_Expand_Fertilizer_Usa: "Расширить использование удобрений"
 KHRUSCHEV_Expand_Fertilizer_Usa_desc: "Расширяя применение удобрений, мы увеличим производительность и эффективность наших аграриев."
 KHRUSCHEV_Crackdown_on_the_Black_Market: "Разогнать черный рынок"
 KHRUSCHEV_Crackdown_on_the_Black_Market_desc: "Черный рынок и соответствующий ему преступный мир живы и здоровы, угрозы разъедают наше общество. Мы должны остановить это."
 KHRUSCHEV_Finalize_Agricultural_Collectivization: "Завершить С/Х коллективизацию"
 KHRUSCHEV_Finalize_Agricultural_Collectivization_desc: "Пришло время закончить то, что начали наши предшественники. Сельское хозяйство жизненно важно для здоровья нашего Союза, и поэтому оно должно полностью контролироваться правительством и управляться колхозами."
 KHRUSCHEV_A_Responsible_Agrarian_Socialism: "Сознательный аграрный социализм"
 KHRUSCHEV_A_Responsible_Agrarian_Socialism_desc: "Все наши усилия окупаются, и наш сельскохозяйственный сектор, наконец, восстанавливается. Надеюсь, что мы не сбавим темпов."
 KHRUSCHEV_Overtax_Remaining_Private_Livestock: "Налог на частный скот"
 KHRUSCHEV_Overtax_Remaining_Private_Livestock_desc: "Хотя большая часть нашего поголовья находится в коллективном владении, некоторые упрямые владельцы держат скот. Возможно, чрезмерные и жесткие налоги за владение этими животными помогут их убедить в обратном."
 KHRUSCHEV_Forbid_Urban_Meat_Production: "Запретить производство мяса в городах"
 KHRUSCHEV_Forbid_Urban_Meat_Production_desc: "Городское производство мяса сделает наши прекрасные города грязными и источающими запах крови и смерти. Наша партия приняла решение что это неприемлемо нас и нашего народа ."
 KHRUSCHEV_Transfer_Livestock_Ownership_to_Kolkhozy: "Передача животноводческой собственности в колхозы"
 KHRUSCHEV_Transfer_Livestock_Ownership_to_Kolkhozy_desc: "Домашний скот, как и растения и зерновые культуры, жизненно важен для нашего народа, и поэтому его нельзя доверить отдельным фермерам только для их личной выгоды."
 KHRUSCHEV_Allow_Small_Private_Flocks: "Разрешить небольшие частные стада"
 KHRUSCHEV_Allow_Small_Private_Flocks_desc: "В идеале все стада должны были бы принадлежать государству, но мы понимаем, что этого будет трудно достичь. Людям будет разрешено владеть домашним скотом, хотя и в меньшем количестве, чем раньше."
 KHRUSCHEV_Encourage_Private_Vegetable_Gardens: "Поощрять частные огороды"
 KHRUSCHEV_Encourage_Private_Vegetable_Gardens_desc: "Если каждый будет выращивать свои овощи, наши аграрии смогут сосредоточиться на действительно важной культуре - Кукурузе."
 KHRUSCHEV_Increase_Domestic_Food_Production: "Увеличить собственное производство продуктов питания"
 KHRUSCHEV_Increase_Domestic_Food_Production_desc: "Наши местные фермеры не производят достаточно кукурузы. Это не согласуется с сельскохозяйственными взглядами Хрущева, согласно которым кукуруза является приоритетом номер один, поэтому нам нужно заставить их производить больше кукурузы и только кукурузу."
 KHRUSCHEV_Regulate_Ailments_Prices: "Регулировать цены"
 KHRUSCHEV_Regulate_Ailments_Prices_desc: "В настоящее время рынок лекарств имеет высокий спрос и низкое предложение, что приводит к резкому росту цен даже на самые простые лекарства. Мы должны регулировать рынок, чтобы наши люди могли быть здоровыми.. "
 KHRUSCHEV_Integrate_the_Informal_Economy: "Интеграция теневой экономики"
 KHRUSCHEV_Integrate_the_Informal_Economy_desc: "Существует коммерция, которая работает \"вне государства\" или через бартер. Это изжило себя, и это также выводит деньги из нашей экономики, поэтому мы должны поглотить этот теневой сектор экономики и чем раньше тем луче."
 KHRUSCHEV_Allow_Farmers_to_Buy_Their_Own_Material: "Разрешить колхозникам покупать свой собственный товар"
 KHRUSCHEV_Allow_Farmers_to_Buy_Their_Own_Material_desc: "Иногда человек, выращивающий кукурузу, знает, что ему нужно для производства кукурузы, больше, чем человек, который говорит ему делать это кукурузу. Мы должны позволить производителям кукурузы покупать собственное оборудование для выращивания кукурузы."
 KHRUSCHEV_Abolish_Machine_Tractor_Stations: "Упразднить МТС"
 KHRUSCHEV_Abolish_Machine_Tractor_Stations_desc: "МТС-это государственные предприятия по владению и обслуживанию сельскохозяйственной техники, используемой в колхозах. Это казалось хорошей идеей, но приводит к однобокому и несправедливому распределению машин для производителей кукурузы, поэтой приичине мы должны их отменить."
 KHRUSCHEV_Increase_Fodder_Production: "Увеличить производство кормов для скота"
 KHRUSCHEV_Increase_Fodder_Production_desc: "К сожалению, мы не можем выращивать только кукурузу. Нашим животным тоже нужно что-то есть, и они едят много. Нам нужно увеличить производство корма для животных, чтобы наши животные не умирали от голода."
 KHRUSCHEV_Improve_Slaughterhouse_Facilities: "Модернизировать оборудование скотобоень"
 KHRUSCHEV_Improve_Slaughterhouse_Facilities_desc: "Спрос и предложение на мясо высоки, но у нас есть проблемы с превращением мяса живых животных во что-то более вкусное из-за небольшого количества скотобойни. Нам нужно больше выдять помещений для скотобойн, если наши люди хотят добавлять в кукурузу немного белка."
 KHRUSCHEV_Favor_Livestock_Multiplication: "Способствовать размножению скота"
 KHRUSCHEV_Favor_Livestock_Multiplication_desc: "Вместо того, чтобы использовать существующие стада для производства мяса или молочных продуктов, мы собираемся сосредоточить их на размножение для увелечение поголовия. Пока наши граждане не смогут есть молоко с кукурузой сейчас,но они это смогут сделать позже."
 KHRUSCHEV_Replace_Hostile_Officials: "Заменить неудобных чиновников"
 KHRUSCHEV_Replace_Hostile_Officials_desc: "Верхние эшелоны власти заполнены пережитками Сталина и, что еще хуже, сторонниками Берии. Мы должны обеспечить поддержку нашим сторонникам и продвинуть их на эти посты.."
 KHRUSCHEV_Force_Malenkovs_Resignation: "Отправить в отставку Маленкова"
 KHRUSCHEV_Force_Malenkovs_Resignation_desc: "Товарищ Маленков представляет угрозу безопасности нашего нового строя. Он всегда был близок с Берией, и ходят слухи, что он сотрудничал с ним, чтобы захватить власть после смерти Сталина. Ему нужно уйти."
 KHRUSCHEV_XXth_Congress_of_the_CPSU: ""
 KHRUSCHEV_XXth_Congress_of_the_CPSU_desc: "Теперь, когда наше положение прочно и в партии состоят только наши сторонники, пришло время вновь созвать съезд КПСС, который состоится уже в свой 20-й раз..."
 KHRUSCHEV_Reduce_Criminal_Sentences: "Смягчение уголовных наказаний"
 KHRUSCHEV_Reduce_Criminal_Sentences_desc: "При Сталине люди могли получать суровые наказания даже за мелкие преступления. Это понизило моральный дух наших людей и привело к потере доверия в сторону власти. Нам нужно показать, что мы стремимся к истинной справедливости, независимо от того, хотим мы этого на самом деле или нет."
 KHRUSCHEV_Remove_Monuments_to_Stalin: ""
 KHRUSCHEV_Remove_Monuments_to_Stalin_desc: "Памятники и статуэтки товарищу Сталину установлены по всему СССР, в немалой степени благодаря его собственным усилиям. Мы не хотим, чтобы наши люди обожествляли его. Он мертв, а значит нам нужно, чтобы вместо него они любили нас. В связи с этим мы, к сожалению, вынуждены избавиться от некоторых из этих почестей."
 KHRUSCHEV_Reveal_the_Factitious_Doctors_Plot: "Пересмотреть Дело врачей"
 KHRUSCHEV_Reveal_the_Factitious_Doctors_Plot_desc: "Дело врачей - это кукурузная каша, которую варил старый параноик Сталин, будучи у смертного одра, пребывая в состоянии полнейшей лихорадки. В результате, все выдающиеся московские врачи - большинство из них евреи, абсолютно невиновные - были казнены. Это выставляет правительство не в лучшем свете, а в Москве с этих пор не осталось врачей. Мы должны заверить общественность о своем непричастии к этому делу."
 KHRUSCHEV_Gain_the_Backing_of_the_Red_Army: ""
 KHRUSCHEV_Gain_the_Backing_of_the_Red_Army_desc: "Красная Армия имеет большое влияние в современной советской политике, о чем свидетельствует огромная помощь маршала Жукова в нашем приходе к власти. Однако нам необходимо заручиться поддержкой остальных частей армии, если мы действительно хотим чувствовать себя в безопасности."
 KHRUSCHEV_Loosen_Freedom_of_Speach_Restrictions: ""
 KHRUSCHEV_Loosen_Freedom_of_Speach_Restrictions_desc: ""
 KHRUSCHEV_Promote_Limited_Cultural_Liberalization: ""
 KHRUSCHEV_Promote_Limited_Cultural_Liberalization_desc: "На протяжении многих лет мы пытались создать и сохранить единую советскую социалистическую культуру и образ мыслей, но, несмотря на разнообразие нашего Союза, в некоторых регионах это не очень хорошо прижилось. Мы должны позволить им сохранить свои старые обычаи и даже позволить этим культурам процветать дальше."
 KHRUSCHEV_Counter_the_Anti_Party_Group: ""
 KHRUSCHEV_Counter_the_Anti_Party_Group_desc: "Антипартийная группа, верная своему названию, выступает против господства Никиты Хрущева в КПСС и осуждает его. Возглавляемые Маленковым, министром иностранных дел Дмитрием Шепиловым и высокопоставленным чиновником Лазарем Кагановичем, они планируют отстранить нашего любимого лидера от власти. К счастью, мы заранее узнали об этом заговоре и можем предотвратить эту жалкую попытку."
 KHRUSCHEV_Ensure_Khrushchevs_Socialism_Existence: ""
 KHRUSCHEV_Ensure_Khrushchevs_Socialism_Existence_desc: "Теперь для всех совершенно очевидно, что Никита Хрущев не только останется на своем посту, но и является истинным социалистом и достойным лидером нашего великого Союза. Он, несомненно, будет крепко держать штурвал СССР на протяжении долгих лет и направлять государство в нужное русло."
 KHRUSCHEV_Crackdown_on_the_Russian_Orthodox_Church: ""
 KHRUSCHEV_Crackdown_on_the_Russian_Orthodox_Church_desc: "Русская православная церковь на протяжении многих лет была для нас только занозой в боку, распространяя опиум для масс и подвергая наших людей идеологической обработке. Пришло время им узнать их место."
 KHRUSCHEV_Exile_Clergymen: ""
 KHRUSCHEV_Exile_Clergymen_desc: "Некоторые священники-выскочки отказались смягчить свою религиозную риторику, поэтому мы будем вынуждены ужесточить наши ответные меры. Пребывание в Сибири должно точно сотворить с ними \"божественное\" чудо."
 KHRUSCHEV_Close_Monasteries: ""
 KHRUSCHEV_Close_Monasteries_desc: "Монастыри - это не что иное, как центры массовой пропаганды и идеологической обработки, исходя из чего к ним следует относиться соответствующим образом. Мы не можем допустить, чтобы такие опасные учреждения оставались открытыми народу."
 KHRUSCHEV_Imprison_Religous_Leaders: "Заключить в тюрьмы разных религиозных лидеров"
 KHRUSCHEV_Imprison_Religous_Leaders_desc: "Заключив в тюрьму важных религиозных деятелей - иудеев, христиан, кого угодно - мы отрубим голову змею, который медленно обвивается вокруг шеи нашего народа."
 KHRUSCHEV_Open_Psychiatric_Asylums_for_Opponents: ""
 KHRUSCHEV_Open_Psychiatric_Asylums_for_Opponents_desc: "Удобный способ избавиться от религиозных и политических оппонентов состоит в том, чтобы назначенный государством психиатр пометил их как клинически невменяемых и отправил в психиатрическую лечебницу на длительный срок."
 KHRUSCHEV_End_Cultural_Indulgences: "Покончить с культурными послаблениями"
 KHRUSCHEV_End_Cultural_Indulgences_desc: "Наши испытания обновленной политики культурной либерализации провалились. Народ воспользовался этим щедрым даром, чтобы опорочить наше правительство, очернить нацию и опозорить нашего лидера перед всем миром. Если они не захотят воспользоваться нашими потугами разумно, второго шанса у них не будет."
 KHRUSCHEV_Renewed_Communist_Power_and_Ideals: ""
 KHRUSCHEV_Renewed_Communist_Power_and_Ideals_desc: "Когда наши политические и идеологические соперники убраны с дороги, а патриотический пыл и прославление коммунизма охватывает нацию, нас станут поддерживать огромные ликующие толпы наших граждан, которых мы можем использовать в предстоящей битве за судьбу человечества."
 KHRUSCHEV_Appoint_Molotov_Ambassador_of_Mongolia: "Назначить Молотова послом в Монголии"
 KHRUSCHEV_Appoint_Molotov_Ambassador_of_Mongolia_desc: "Молотов уже не глава правительства, но он по прежнему опасен для нас. Мы не можем просто казнить или сослать его, так как он его любят в народе, но один предприимчивый чиновник предложил следующее - сделать его послом СССР в Монголии. По сути, это по-своему напоминает изгнание, так как ему придется прожить в этой далекой степи большую часть оставшихся ему дней."
 KHRUSCHEV_Exile_Kaganovitch_and_Shepilov_Beyond_the_Urals: ""
 KHRUSCHEV_Exile_Kaganovitch_and_Shepilov_Beyond_the_Urals_desc: "Каганович и Шепилов заслуживают худшего, чем ссылка, за свою роль в неудавшемся перевороте Антипартийной группы, но пока что они отделались только легким испугом. Мы надеемся, что им понравится их увлекательное путешествие в Сибирь!"
 KHRUSCHEV_Limit_Public_Officials_Terms: ""
 KHRUSCHEV_Limit_Public_Officials_Terms_desc: "Слишком много старых, узколобых партийных чиновников пытаются цепляться за свои места в партии и тянут вниз наши усилия по модернизации Советского Союза. Установление ограничений по срокам пребывания их на госслужбе даст нам возможность их устранять, пускай медленно, но лучше уж поздно, чем никогда."
 KHRUSCHEV_Prepare_a_New_Generation_of_Cadres: "Подготовка нового поколения кадров"
 KHRUSCHEV_Prepare_a_New_Generation_of_Cadres_desc: "Теперь, когда мы начали устранять старых чиновников, нам нужны новые и энергичные члены партии им на замену. К счастью, наши бравые комсомольцы более чем готовы принять на себя ответственное бремя служения Советскому Союзу."
 KHRUSCHEV_Supply_the_Democratic_Republic_of_Vietnam: ""
 KHRUSCHEV_Supply_the_Democratic_Republic_of_Vietnam_desc: "Северные вьетнамцы долгое время боролись за свое выживание против империалистического Старого света, и, несмотря на свое отставание по технологиям, добились впечатляющих результатов. Представить только, что они могут сделать, если им дать современные самолеты и оборудование!"
 KHRUSCHEV_State_Visit_to_Jakarta: "Официальный визит в Джакарту"
 KHRUSCHEV_State_Visit_to_Jakarta_desc: "Мы с большим интересом наблюдали за карьерой нового индонезийского правительства и их лидера Сукарно, и решили, что они будут достойным союзником в юго-восточной части Тихого океана. Официальный визит нашего премьера будет иметь большое значение для укрепления наших отношений."
 KHRUSCHEV_Subsidize_the_Kim_Regime: "Субсидировать режим Кима"
 KHRUSCHEV_Subsidize_the_Kim_Regime_desc: "Ким Ир Сену удавалось провести свою страну и народ через все невзгоды как в мирное, так и в военное время, и доказать, что он может обладать всеми качествами великого и харизматичного лидера. Поэтому, мы должны помочь удержать его режим на плаву."
 KHRUSCHEV_Depose_Kim_il_Sung: ""
 KHRUSCHEV_Depose_Kim_il_Sung_desc: "Ким Ир Сен потерпел поражение в Корейской войне, позволив НАТО закрепиться на востоке, и с тех пор не смог добиться ничего, кроме ещё больших неудач. Кажется, ему пора уйти."
 KHRUSCHEV_Expand_Indochinese_Guerilla_Operations: "Расширить партизанские операции в Индокитае"
 KHRUSCHEV_Expand_Indochinese_Guerilla_Operations_desc: "Вьетконговцы и Красные кхмеры уже проводят успешные партизанские операции против капиталистов, но это не значит, что они не нуждаются в помощи. Советское оружие и наши советники очень помогли бы им в их стремлении к свободе."
 KHRUSCHEV_Reach_Out_to_Thai_Communists: ""
 KHRUSCHEV_Reach_Out_to_Thai_Communist_desc: "Хотя Таиланд оказывает поддержку Западу в борьбе с Вьетконгом и другими борцами за свободу в Индокитае, внутри страны также есть значительное количество сторонников коммунистов. Это может представлять собой возможность, которую мы могли бы использовать в своих интересах."
 KHRUSCHEV_Repress_Hungarian_Counter_Revolutionaries: ""
 KHRUSCHEV_Repress_Hungarian_Counter_Revolutionaries_desc: "Венгерская Народная Республика переживает серьезные внутренние волнения, поскольку контрреволюционеры пытаются захватить контроль над ее правительством. Эти предатели должны быть подавлены любой ценой, чтобы сохранить стабильность и безопасность страны."
 KHRUSCHEV_Condemn_Hoxha: ""
 KHRUSCHEV_Condemn_Hoxha_desc: "Энвер Ходжа, албанский лидер, очень слаб для того, чтобы справиться с текущим кризисом. Нам нужно ясно выразить наше недовольство им всему Восточному блоку."
 KHRUSCHEV_Reconcile_with_Tito: ""
 KHRUSCHEV_Reconcile_with_Tito_desc: "Наши мелкие ссоры с маршалом Тито затянулись. Как товарищ-социалист, он наш друг, как бы сильно мы ни расходились с ним во мнениях."
 KHRUSCHEV_Cut_Ties_with_Mao: ""
 KHRUSCHEV_Cut_Ties_with_Mao_desc: "Диаметрально противоположным Тито является Мао. Он жаден до власти, агрессивен и представляет угрозу нашей безопасности на Востоке. К сожалению, теперь наши дороги с китайцами должны разойтись."
 KHRUSCHEV_Form_the_Warsaw_Pact: ""
 KHRUSCHEV_Form_the_Warsaw_Pact_desc: "Структура Коминтерна устарела, особенно по сравнению с неумолимо растущей силой НАТО. Пришло время преобразовать наш альянс, дать ему новый старт и встретиться с новыми реалиями лицом к лицу уже под флагом Варшавского договора."
 KHRUSCHEV_Improve_Mobile_AA: "Модернизировать мобильные подразделения ПВО"
 KHRUSCHEV_Improve_Mobile_AA_desc: ""
 KHRUSCHEV_Project_659: ""
 KHRUSCHEV_Project_659_desc: "Подводные лодки проекта 659 будут самыми современными атомными подлодками, оснащенными нашими крылатыми ракетами. Эти подводные лодки способные отправиться практически в любое место земного шара для выполнения поставленных ей боевых задач."