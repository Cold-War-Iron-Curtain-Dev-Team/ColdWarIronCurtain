l_russian:
 gaulle_speech_category: "Публичное выступление генерала Шарля де Голля"
 gaulle_speech_category_desc: "Генерал де Голль сделал много великих дел для нашей нации, он вел нашу нацию на борьбу с нацистами и хочет, чтобы Франция была более сильной и свободной от иностранного влияния, его речи всегда поднимают моральный дух французского народа."
 speak_on_may_first: "Публичное выступление 1 мая 1950"
 speak_on_may_first_desc: "О возрождении Франции сегодня в расплавленном мире, среди всех призывов к ненависти или к слабости, среди всех противоположных интересов, которые смутили меня и моих товарищей, скажем, в стране ничто не имеет значения, кроме восстановления единства. Прежде всего благодаря социальной гармонией, мы уверены, что к массе французов, которые уже присоединились к нам, не говоря уже о многих тех, кто сначала не слышал, как мы говорим, или отказываются следовать за нами, мы говрим - рабочие прежде всего с вами. Я хочу построить новую Францию, во-первых, в том, что касается главного вопроса, который главенствует над всем, что находится в глубине всей драмы нашего времени, я хочу сказать, что это вопрос о условиях рабочих."
