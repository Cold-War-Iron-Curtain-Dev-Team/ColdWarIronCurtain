 mrtnews.1.d: "С тех пор, как Мавритания взяла под свой контроль южную часть того, что было Испанской Сахарой ​​через Мадридские соглашения в 1975 году, в стране происходили бедствия . Первоначальная армия Мавритании в 3000 солдат была совершенно неспособна защитить свои внутренние границы от постоянных набегов Фронта ПОЛИСАРИО, которые нанесли ущерб стране после того, как повстанцы взяли под свой контроль главный источник национального дохода: железные рудники Зуэрата. Фактически, единственное, что удерживало эту пустынную страну, было вмешательство французских ВВС, которые даже тогда изо всех сил пытались остановить наступление на столицу Нуакшот. В условиях массовых беспорядков в вооруженных силах, где арабы и берберы в значительной степени симпатизировали сахарским повстанцам, а черные солдаты с юга рассматривали это как внутриарабский конфликт из своих интересов, переворот недовольных и антивоенных офицеров был неизбежен. Мавритания не только эвакуировала из ранее контролируемой регионе Западной Сахары, но и объявила о признании своей независимости"