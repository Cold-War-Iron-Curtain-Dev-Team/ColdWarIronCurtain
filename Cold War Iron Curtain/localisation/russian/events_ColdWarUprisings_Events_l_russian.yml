l_russian:
 cwu.1.t: "Берлинское восстание!"
 cwu.1.d: "Сегодня фабричные рабочие по всей ГДР начали протестовать за улучшение условий труда и повышение заработной платы. Вскоре ситуация ухудшилась, и теперь протестующие взялись за оружие и объявили, что ГДР должна быть распущена и воссоединена с ФРГ. Правительство ГДР все еще решает, что делать против восстания."
 cwu.1.a: "Дайте отпор капиталистическим предателям"
 cwu.1.b: "Мы пойдём на уступки"
 cwu.2.t: "[GetNewspaperHeader]Восстание в Восточной Германии"
 cwu.2.d: "Сегодня сообщение о протестах в Восточной Германии было объявлено всему миру Западно-Берлинским радио в американском секторе. Они сообщили, что рабочие на фабриках вокруг Восточной Германии прекратили работу и объявили забастовку за демократические реформы и воссоединение с Западной Германией. Восточногерманская и советская армии вскоре вступили в бой с протестующими и с тех пор никаких признаков демократических повстанцев не было видно."
 cwu.2.a: "Революция!"
 cwu.2.b: "Восстание в восточном блоке?"
 cwu.2.desc: "Сегодня сообщение о протестах в Восточной Германии было объявлено всему миру Западно-Берлинским радио в американском секторе. Они сообщили, что рабочие на фабриках вокруг Восточной Германии прекратили работу и объявили забастовку за демократические реформы и воссоединение с Западной Германией. ГДР подчинилась и согласилась вскоре перейти к демократическим формам правления. Они также договорились начать переговоры с Западной Германией о создании единого государства. Советское правительство заявило, что этого не произойдет и что все восточногерманское руководство, поддерживающее социалистическое правительство, будет сопротивляться. Гражданская война наверняка скоро начнется."
 cwu.4.t: "Познанский июнь!"
 cwu.4.d: "Сегодня рабочие одного из сталелитейных заводов в Познани объявили забастовку в поддержку демократических реформ в правительстве. Вскоре об этом стало известно, и теперь другие протестующие присоединились к забастовке, и даже антикоммунистическое сопротивление, клуб Кшивого Кола (клуб Перекосившегося колеса) вооружились и протестующие поднялись против польского социалистического правительства за предательство народа."
 cwu.4.a: "Развернуть корпус внутренней безопасности"
 cwu.4.b: "Уступить их требованиям"
 cwu.5.t: "[GetNewspaperHeader]Восстание в Польше"
 cwu.5.d: "Сегодня польские металлисты в Познани объявили забастовку и выступили за демократические реформы и роспуск коммунистического правительства. Местные антикоммунистические повстанческие группы вооружили протестующих и присоединились к восстанию. Вскоре поляки развернули корпус внутренней безопасности, и советы послали туда армию, чтобы справиться с ними. Число погибших в восстании составляло, по официальным данным, 57 человек. Польские и Советские власти заявили, что любые антикоммунистические настроения должны быть подавлены."
 cwu.5.a: "Революция!"
 cwu.5.b: "Ещё одно восстание Восточном блоке?"
 cwu.5.desc: "Сегодня польские металлисты в Познани объявили забастовку и выступили за демократические реформы и роспуск коммунистического правительства. Местные антикоммунистические повстанческие группы вооружили протестующих и присоединились к восстанию. Польские коммунисты вскоре поняли, что коммунистическая система не работает, и начали подписывать демократические реформы. Советские и Польские коммунисты, чувствующие битву, заявили, что это означает войну против новой Польской республики."
 cwu.7.t: "Восстание в Будапеште!"
 cwu.7.d: "Протестующие собрались возле Будапешта, протестуя за демократические реформы, вступления Венгрии в ООН, и что свободу для всех. Однако протест принял вооружённый характер после того, как местная радиостанция подверглась нападению повстанцев. Что же делать Венгерскому правительству?"
 cwu.7.a: "Разверните армию и попросите Советского вмешательство"
 cwu.7.b: "Примите демократические реформы"
 cwu.8.t: "[GetNewspaperHeader]Венгерское восстание"
 cwu.8.d: "Ранее на этой неделе группа протестующих потребовала, чтобы Венгерское правительство провело демократические реформы, вступила в ООН. Венгерское правительство ответило отказом. Протесты не прекратились, а только усилились. Города по всей Венгрии выбрали ту или иную сторону, чтобы быть с демократической Венгрией или коммунистической Венгрией. Венгерская армия была развернута вместе с Советской Армией."
 cwu.8.a: "Революция!"
 cwu.8.b: "А сколько их будет?"
 cwu.8.desc: "Ранее на этой неделе группа протестующих потребовала, чтобы Венгерское правительство провело демократические реформы, вступила в ООН. Венгерское правительство было разделено в этом вопросе, но начались демократические реформы и роспуск коммунистического правительства. Советское правительство заявило, что оно не потерпит этого и что Варшавский договор должен вмешаться. Похоже, в Венгрии скоро начнется гражданская война."
 cwu.10.t: "Пражское востание!"
 cwu.10.d: "В Праге вспыхнула революция. Они заявили, что хотят демократических реформ и свержения коммунистического правительства. Правительство неоднозначно относится к этому решению и мы должны решить что делать дальше."
 cwu.10.a: "Уберите предателей из правительства!"
 cwu.10.b: "Согласиться с демократическими реформами"
 cwu.11.t: "[GetNewspaperHeader]Революция в Чехословакии?"
 cwu.11.d: "Прошлой ночью войска Варшавского договора пересекли границу Чехословакии. Операция "Дунай" началась, и 200 000 военнослужащих и офицеров стран Варшавского договора при поддержке 2000 танков пересекли границу и вторглись в Чехословакию. Александр Дубчек был свергнут и теперь заменен Густавом Гусаком в качестве нового лидера. Повстанцы были рассеяны и пытаются сплотиться, чтобы замедлить захватчиков.."
 cwu.11.a: "Революция!"
 cwu.11.b: "Сколько еще будет революций?"
 cwu.11.desc: "Прошлой ночью войска Варшавского договора пересекли границу Чехословакии. Операция "Дунай" началась, и 200 000 военнослужащих и офицеров стран Варшавского договора при поддержке 2000 танков пересекли границу и вторглись в Чехословакию. Александр Дубчек объявил народу о необходимости дать отпор коммунистическим захватчикам и приказал военным открыть огонь по захватчикам. Чехословакия была разделена, и разразилась гражданская война между демократическим правительством и коммунистическим правительством. Вторжение скорее всего превратит Чехословакию в зону боевых действий."
 cwu.13.t: "Протесты в Гданьске!"
 cwu.13.d: "После неурожайного года цены на продовольствие взлетели до небес. Польские протестующие заявили, что не будут работать до тех пор, пока не будут снижены цены на продовольствие. Теперь они претендовали на демократические реформы и смещение лидера. Что же нам делать?"
 cwu.13.a: "Развернуть армию и народную милицию"
 cwu.13.b: "Последуйте их требованиями"
 cwu.14.t: "[GetNewspaperHeader]Огромные протесты в Польше"
 cwu.14.d: "Несколько дней назад протестующие собрались в городах на севере Польши, протестуя против того, что польское правительство не может снизить цены на продовольствие после плохого урожая. Это вызвало протесты за реформы в правительстве. Поляки послали туда армию и народную милицию, чтобы разобраться с протестующими. Вспыхнули спорадические бои, и польские повстанцы, похоже, почти потерпели поражение."
 cwu.14.a: "Польша еще не потеряна."
 cwu.14.b: "Надеемся на скорый мир."
 cwu.14.desc: "Несколько дней назад протестующие собрались в городах на севере Польши, протестуя против того, что польское правительство не может снизить цены на продовольствие после плохого урожая. Это вызвало протесты протестующих за реформы в правительстве. Польское правительство согласилось и приступило к разработке новых демократических реформ. Члены компартии не согласились и призвали поляков прекратить все реформы."
 cwu.16.t: "Восстание в Загребе!"
 cwu.16.d: "Хорватские националисты собрались в Загребе, желая получить больше политических и экономических свобод для автономной нации Хорватии. За последние несколько дней националисты стали более жестокими, и слухи о революции растут. Что же нам делать?"
 cwu.16.a: "Разверните армию!"
 cwu.16.b: "Позвольте Хорватии сформироваться"
 cwu.17.t: "[GetNewspaperHeader]Восстание в Югославии"
 cwu.17.d: "Несколько дней назад хорватские националисты собрались в Загребе, желая получить больше политических и экономических свобод для Хорватии. Конфликт вскоре разгорелся, когда некоторые националисты напали на югославский гарнизон в городе. Югославская армия была развернута, и националисты отбиваются. Что будет происходить в Югославии?"
 cwu.17.a: "Восстание будет подавлено."
 cwu.17.b: " Распространится ли это на другие регионы?"
 cwu.17.desc: "Несколько дней назад хорватские националисты собрались в Загребе, желая получить больше политических и экономических свобод для Хорватии. Югославское правительство вскоре предоставило независимость Хорватии. Это новая эпоха для Балканского региона. Теперь у Хорватии есть выбор. Последовать за Югославией и стать государством-сателлитом или повернуть на Запад, чтобы стать демократической нацией. Что бы ни случилось, это наверняка изменит Балканский регион."
 cwu.19.t: "Восстание в Косово!"
 cwu.19.d: "В течение последних нескольких недель студенты по всему автономному краю Косово протестовали за большую автономию Косово. Это привело к тому, что протестующие стали более националистичными и призывают к созданию независимого государства Косово. Ходят слухи о революции, если мы ничего не предпримем. Что же нам делать?"
 cwu.19.a: "Остановить беспорядки!"
 cwu.19.b: "Предоставьте им больше свободы."
 cwu.20.t: "[GetNewspaperHeader]Восстание в Косово"
 cwu.20.d: "В течение последних нескольких недель студенты по всему автономному краю Косово протестовали за большую автономию Косово. Это привело к тому, что протестующие стали более националистичными и призывают к созданию независимого государства Косово. После еще нескольких призывов к независимости югославское правительство решило, что этого достаточно, и направило армию для решения этой проблемы. Мятежники находятся в смятении, и восстание, похоже, скоро закончится."
 cwu.20.a: "Страна должна быть едина."
 cwu.20.b: "Произойдет ли еще больше революций?"
 cwu.20.desc: "В течение последних нескольких недель студенты по всему автономному краю Косово протестовали за большую автономию в Косово. Это привело к тому, что протестующие стали более националистичными и призывают к созданию независимого государства Косово. Ходили даже слухи о революции. Это заставило югославское правительство признать Косово независимым государством. Теперь у косовского правительства есть шанс выбрать свой собственный путь. Что же будет дальше?"
 cwu.22.t: "Восстание в Словении!"
 cwu.22.d: "После неудачных действий в экономике у нас наступили трудные времена для нашей экономики. Словенские рабочие объявили забастовку, что еще больше усугубило ситуацию. В автономном государстве Словения нарастают волнения, и восстание, похоже, вполне возможно. Что же нам делать с этим кризисом?"
 cwu.22.a: "Развернуть Югославский гарнизон"
 cwu.22.b: "Предоставить им независимость'"
 cwu.23.t: "[GetNewspaperHeader]Восстание в Словении"
 cwu.23.d: "После неудачных действий в экономике у нас наступили трудные времена для нашей экономики. Словенские рабочие объявили забастовку, что еще больше усугубило ситуацию. Автономное Государство Словения горело в беспорядках, и группа националистов, призывающих к независимости, набирала силу. Они провозгласили независимость от Югославии, но Югославская армия отбросила восстание в течение нескольких дней."
 cwu.23.a: "Эта страна должна быть едина."
 cwu.23.b: "Балканы - это еще одна пороховая бочка."
 cwu.23.desc: "После неудачных действий в экономике у нас наступили трудные времена для нашей экономики. Словенские рабочие объявили забастовку, что еще больше усугубило ситуацию. Автономное Государство Словения горело в беспорядках, и группа националистов, призывающих к независимости, набирала силу. Они провозгласили независимость от Югославии, а югославы не могут позволить себе экономический кризис и восстание. Они предоставили независимость Словении. Теперь у Словении есть выбор: идти на Запад, Восток или следовать за своими некогда югославскими лидерами."
 cwu.25.t: "Коммунистические восстания"
 cwu.25.d: "Вторая чрезвычайная ситуация в Малайзии началась в Малайе после того, как повстанцы получили большую поддержку от коммунистических стран. Они захватили часть сельской местности и продвигаются вперед. Нам нужна новая оперативная группа из Содружества, чтобы помочь нам. Мы снова подавим это восстание."
 cwu.25.a: "Давайте сражаться"
 cwu.26.t: "[GetNewspaperHeader]Вторая чрезвычайная ситуация в Малайзии"
 cwu.26.d: "Вторая чрезвычайная ситуация в Малайзии началась в Малайе после того, как повстанцы получили большую поддержку от коммунистических стран. Они захватили часть сельской местности и продвигаются вперед. Там может быть новая целевая группа из Содружества, чтобы помочь."
 cwu.26.a: "Борьба - это ответ"
 cwu.26.b: "Подъём коммунизма?"
 smk.1.t: "Южно-Молуккское Восстания"
 smk.1.d: "Жители Молуккских островов всегда сопротивлялись правлению с Явы. Однако с ростом нестабильности юг Молуккских островов провозгласил независимость в качестве Республики Южного Малуку. Как мы будем с этим справляться?"
 smk.1.a: "Сражаться!"
 smk.1.b: "Согласиться с независимостью"
