l_russian:
 VICTORY_POINTS_3893: "Эдирин"
 CHI_KMT.0.d: "Недавно были внесены поправки во Временные положения, принятые для помощи правительству в подавлении коммунистического мятежа. Первый набор Временных положений был принят для приостановки действия некоторых политических и гражданских свобод, чтобы усилить действия государства против коммунистов и предотвратить проникновение коммунистов. Поскольку фронт на данный момент стабилизировался, Национальное собрание проголосовало за внесение поправок во Временные положения, продление срока их действия и адаптацию своих полномочий в соответствии с текущей ситуацией. Благодаря новым положениям президент [CHI.GetLeader] теперь может более эффективно восстановить государственную власть на восстановленных территориях и искоренить любую коммунистическую пятую колонну."
 CHI_KMT.1.d: "Гоминьдан стоит на распутье. В последние годы он пережил войну с Японией и массовое возрождение коммунистов, чуть не свергнувшее режим. Многие в партии сейчас говорят, что настал подходящий момент для начала реформ и изменения курса партии. Они обвиняют военное положение, централизацию и авторитарную тактику в причинах процветания Японии и коммунистов. Больше демократизации и свобод укрепит государство и сделает так, что никакая враждебная идеология или сила не смогут процветать в республике. Однако в партии есть хедлайнеры, которые не согласны и утверждают, что только благодаря централизации и военному положению республика стала достаточно сильной, чтобы противостоять угрозам. Они утверждают, что Китай должен продолжать идти по этому пути, чтобы завершить свою независимость и объединение. Президент [CHI.GetLeader] должен принять решение о реформе или сохранении курса."
 CHI_TIB.0.d: "Далай-лама провозгласил свою независимость и управляет Тибетом с 1912 года. Китайская Республика в прошлом щедро предлагала Далай-ламе его исторические титулы и приносила извинения за любые эксцессы в период Цин, однако он отказывается взаимодействовать с нами. Мы утверждаем, что суверенитет над Тибетом принадлежит Китаю, но Далай-лама продолжает отрицать это и в прошлом вел переговоры о территории без нашего разрешения. Настало время для того, чтобы навязать резолюцию по Тибету и решить раз и навсегда его отношения с республикой."
 KMT_MIL.1.d: "Группа старших офицеров представила свой отчет о боевых возможностях, материально-техническом обеспечении и организации Национально-революционной армии. В отчете освещаются жалобы солдат на плохое материально-техническое обеспечение и неравные графики оплаты труда. Он также указал на проблемы, связанные с плохим руководством среди офицеров и недостаточной подготовкой солдат. Без реформ Национально-революционная армия рискует еще больше упасть. Нынешняя структура также поощряет организацию клик и территориальность, и это также должно быть реформировано. Национальное руководство решило действовать в соответствии с отчетом и инициирует ряд реформ для решения этих проблем и укрепления национальной обороны."
 KMT_NUCLEAR.1.d: "Президент [CHI.GetLeader] курировал открытие нового Института исследований ядерной энергии. Это знаменует собой новый акцент правительства на потенциале ядерных технологий. Китайское правительство надеется, что ядерная энергия может сыграть важную роль в удовлетворении будущих потребностей в энергии по мере развития всего Китая. Однако институт также рассмотрит частные разработки ядерного оружия. Вопрос будет заключаться в том, стремится ли Китай разработать такое оружие самостоятельно или обратится за помощью к американцам. Если бы мы разработали его самостоятельно, мы бы полностью контролировали такое оружие, но это может занять много времени. Привлечение американцев ускорило бы разработку, но ограничило бы нашу независимость и способность адаптировать программу к нашей ситуации. Мы должны решить, какой путь выбрать, поскольку коммунисты, несомненно, разрабатывают свою собственную бомбу."
 CHI_INDO.0.d: "Во время последней войны японцы захватили Индокитай у французов и установили там жестокий режим. Однако вьетнамское сопротивление упорно боролось сначала с французами, а затем с японцами, часто используя Китай в качестве своей основной базы. В конце войны Китай оккупировал северный Вьетнам, пока не вернулись французы. Франция теперь стремится восстановить свою довоенную колонию, но теперь сталкивается с восстанием Вьет-Куока. У нас прочные связи с Вьетнамом, и многие его фракции используют нашу землю в качестве баз или центров снабжения. Мы должны решить либо поддержать французов, чтобы ни одна коммунистическая вьетнамская фракция не стала доминирующей, либо поддержать антифранцузских вьетнамских националистов и добиться победы некоммунистов."
 CHI_BANDIT.0.d: "Хаос войны и гражданской войны сделал сельскую местность и изолированные города жертвами бандитов. Многие из них представляют собой воинские части дизертировавших или вооруженных ополченцев, разоряющих сельскую местность. Эти бандиты совершают немыслимые преступления против путешественников и совершают набеги на товары, движущиеся по дорогам. Правительству Гоминьдана придется справиться с этим кризисом, чтобы возобновить внутреннюю торговлю и лучше объединить страну. Многие крестьяне обращаются за защитой от бандитов к местным военачальникам, а не к правительству. Если проблему бандитов не решить, народная поддержка и экономика быстро ослабнут."
 CHI_VIN.0.d: "В рамках нашей политики поддержки антиколониального Вьеткуока наши агенты разведки начали тайно убивать офицеров Вьетминя. Коммунистический Вьетминь - еще одна крупная антиколониальная вьетнамская партия, и они конкурируют с Вьеткуоком за легитимность и вербовку. Удаление их офицеров помешает им набирать больше бойцов или создавать организованные банды бойцов. Вьеткуок должен иметь возможность лучше вербовать и представлять себя как настоящую партию за независимость Вьетнама. Вьетминь, похоже, не знает о нашей причастности к убийствам."
 CHI_VIN.1.d: "За последние недели несколько наших офицеров были убиты, в основном на наших базах вдоль китайской границы. Расследование продолжается, но вероятными виновниками, по-видимому, являются либо французы, либо китайцы, либо вьеткуокцы. Французы рассматривают нас как главную угрозу, но они не так хорошо зарекомендовали себя в регионе. Китайцы являются яростными антикоммунистами, но поддерживают антиколониальное дело. Вьеткуок заявляют, что являются нашими товарищами и желают вместе сражаться против французов, но, похоже, неспособны на такие изощренные операции. Тем не менее, удаление наших офицеров ослабляет нашу вербовку и боевую эффективность. Придется внимательно следить за ситуацией."
 KMT_LAND_REFORM.0.d: "Одной из самых больших проблем, стоящих перед Китайской Республикой с первых дней ее существования, была земельная реформа. В предполагаемой неспособности сломить власть землевладельцев и предоставить возможности крестьянам долгое время обвиняли крестьянские волнения и популярность коммунистов. Неспособность провести широкомасштабную земельную реформу также обвиняют в слабом экономическом развитии, поскольку Китай по-прежнему не достигает своего истинного сельскохозяйственного потенциала. Тем не менее, арендодатели предлагают политическую и финансовую поддержку правительству, и ослабление их власти может привести к расширению прав и возможностей тех групп, которые часто выступают против Гоминьдана. Правительство должно решить либо инициировать полномасштабную земельную реформу, чтобы решить проблему, либо предложить более скромный план реформы, чтобы обеспечить помощь крестьянам, не вызывая при этом отчуждения могущественных классов помещиков."
 KMT_REFORM.1.d: "Был создан новый Центральный комитет по реформе, чтобы лучше направлять будущее политическое развитие республики и реформировать Гоминьдан. Новый комитет избежит некомпетентности и коррупции предыдущих исполнительных комитетов, поощряя образованных, молодых, высоко мотивированных членов партии возглавить усилия и оживить партию. Неизвестно, какая фракция партии будет доминировать в комитете и республике. Чан Кайши — проверенный лидер, обещающий и впредь придерживаться своего жесткого подхода к централизации государства и подавлению политического инакомыслия. Ли Цзунжэнь, военачальник и соперник Чана, предлагает более демократическое видение Китая с большим количеством гражданских свобод. Знаменитый генерал Сунь Лижэнь верит в масштабные партийные реформы и ориентацию внешней политики и государственных структур на США."
 TIBET_KMT.100.d: "Китайская Республика признает, что Панчен-лама, духовно уступающий только Далай-ламе, все чаще стремится к более заметной политической роли. Говорят, что Панчен-лама командует собственными верными вооруженными силами и ищет помощи извне. Китайское правительство готово предложить своим войскам оружие, обучение и средства при условии, что в случае, если Далай-лама откажется признать суверенитет Китая, он будет действовать. Это ставит Далай-ламу в затруднительное положение, поскольку теперь ясно, что он рискует вызвать потенциальное восстание или переворот, если не будет следовать диктату Китая."
 TIBET_KMT.4.d: "Китайская Республика потребовала, чтобы мы признали их суверенитет над нашими землями. Китайцы обещают, что будут уважать наше нынешнее правительство и администрацию, но хотят контролировать нашу внешнюю политику и оборону. Если мы не примем это требование, мы рискуем явными или скрытыми попытками изменить свое мнение. Но у нас будет шанс сохранить нашу независимость. Если мы согласимся, мы сохраним определенную степень автономии и свободы действий, однако со временем китайцы могут попытаться напрямую оккупировать Тибет."
 TIBET_KMT.20.d: "Далай-лама получил сообщения о том, что основные дороги и стратегические перекрестки блокируются вооруженными людьми. Похоже, что Панчен-лама, уступающий только самому Далай-ламе с точки зрения духовной значимости, готовит переворот. Это прямая реакция на наше решение не признавать суверенитет Китая, и мы подозреваем, что китайцы призывают Панчен-ламу действовать. Что касается Панчен-ламы, то он выразил стремление к большему политическому авторитету, и, похоже, именно это ему и обещают китайцы. Он также организовал своих бойцов и, несомненно, использует их в этой попытке государственного переворота. Наши сторонники в Лхасе готовятся к ответу, но неясно, остановим ли мы переворот."
 KMT_MIL.2.d: "Бюро расследований юстиции является главным разведывательным органом республики. Он находится в прямом подчинении исполнительного комитета, но недавняя война с Японией и коммунистами выявила его слабости. Иногда организация оказывается склонной к коррупции и взяточничеству. Наземная разведка также была слабой, поскольку организация изо всех сил пыталась собрать информацию о коммунистическом проникновении и движениях. Реализуется новый план реформ для повышения уровня подготовки, улучшения организации и повышения заработной платы для поднятия морального духа. Что еще более важно, влияние офицеров будет ограничено, чтобы улучшить способность JIB расследовать военные дела."
 KMT_MIL.3.d: "Реформы и расследования в вооруженных силах Китайской Республики показывают, что ряд высокопоставленных офицеров идеологически скомпрометированы или склонны к коррупции. Исполнительное руководство должно решить, как действовать дальше. Некоторые выступают за то, чтобы провести большую чистку, чтобы убрать этих нерадивых офицеров с важных постов. Такие решительные действия могут оттолкнуть военных и повлиять на моральный дух в краткосрочной перспективе, но имеют долгосрочные преимущества. Другим возможным решением была бы отправка этих офицеров на трудные или изолированные посты, особенно на границе. Эти офицеры больше не смогут негативно влиять на оборону и не смогут получить более высокие звания. Если пойти по этому пути, институциональное воздействие на армию уменьшится, но положительный эффект будет не таким сильным, как при массовой чистке."
 KMT_MIL.4.d: "Исполнительное руководство решило направить к границе тех офицеров, которые были признаны идеологически скомпрометированными, коррумпированными или неподходящими в военном отношении. Это не позволит этим офицерам занимать важные руководящие должности и часто будет изолировано от формирования военных клик. Этим пограничным позициям не хватает многих удобств или славы, которые можно найти в других должностях. Теперь эти офицеры обнаружат, что их пути продвижения по службе заблокированы, и ожидается, что многие из них в конечном итоге уйдут в отставку. Перемещение этих офицеров на границу поможет нам обуздать коррупцию и неэффективность, открывая путь к власти более компетентным и патриотически настроенным офицерам."
 KMT_MIL.5.d: "Президент [CHI.GetLeader] приказал военным, полиции и разведывательным органам начать массовые аресты офицеров, признанных идеологически скомпрометированными, политически коррумпированными или преступно некомпетентными для своего положения. Этот массовый арест военных офицеров открывает много вакансий и вызовет беспокойство в армии. Однако путь на более высокие должности для более молодых, патриотичных и компетентных офицеров теперь открыт. Этот период арестов и чисток, несомненно, вызовет панику и организационные проблемы в вооруженных силах, но как только он закончится, защита Китайской Республики станет намного сильнее."
 KMT_MIL.6.d: "Похоже, что чистки военных офицеров правительством Китайской Республики подходят к концу. Недавно была задержана, предана суду и осуждена последняя группа офицеров. Многие аналитики считают, что китайским военным потребуется время, чтобы восстановить боевой дух и стабильность в своих рядах. Однако правительство уверено, что как только новоиспеченные офицеры приобретут уверенность и опыт, военный потенциал республики станет намного сильнее, чем раньше. Есть также уверенность, что чистки укажут молодым офицерам и тем, кто поступает в военные академии, на то, что они должны быть профессионалами и преданными нации."
 FRA_KMT.1.d: "Китайская Республика в частном порядке обратилась к нашему правительству с просьбой о сотрудничестве в области ядерных технологий, включая создание оружия. Китайцы отмечают, что имеют доступ к ядерным материалам и строят разветвленную инфраструктуру. Однако им нужны французские знания и опыт в ядерной области. Китай находится в жизненно важном регионе и сталкивается с серьезными угрозами со стороны коммунистических соседей. Если мы поддержим Китай, мы сможем усилить антикоммунизм в регионе и утвердить свое влияние в Китае. Такие отношения могли бы помочь защитить наши собственные интересы в регионе. Однако поддержка китайцев может оттолкнуть Советы и американцев. Другая проблема заключается в том, что некоторые консультанты задаются вопросом, стоят ли выгоды того, что китайцам нужно от нас."
 FRA_KMT.2.d: "Французское правительство заявило, что поможет нам в наших усилиях по развитию нашей ядерной программы. Это станет большим подспорьем в наших усилиях по созданию ядерного сдерживания. Что еще более важно, мы не будем обязаны Соединенным Штатам, и отношения с Францией будут гораздо более конструктивными. Мы можем предложить Франции доступ к ядерным материалам для их собственных программ. Наши высокопоставленные представители атомной отрасли планируют в ближайшие дни посетить Париж, чтобы навестить своих коллег."
 FRA_KMT.3.d: "Французское правительство отклонило наше предложение о ядерном сотрудничестве. Они, видимо, не видят выгод от совместного предприятия и согласования интересов между нашими государствами. Мы не знаем, вызвано ли решение Франции страхом перед иностранными последствиями или прямыми угрозами со стороны других держав. В любом случае, это их потеря, и народ Китая продолжит свой путь к ядерному сдерживанию. Правительство удвоит свои усилия по поддержке ученых и объектов, занимающихся продвижением китайских ядерных технологий."
 KMT_Sinification.0.d: "Китайская Республика начала активизацию своей кампании китаизации. Правительство давно стремится укрепить национальное единство, распространяя китайскую культуру и язык во всех общинах. В частном порядке один чиновник сказал, что все люди должны стать китайцами или покинуть страну и что дни варваров прошли. Кампания сталкивается с сопротивлением, особенно в приграничных провинциях Китая, которые часто не являются этническими китайцами или следуют своим собственным культурным или религиозным традициям. Правительство, похоже, не слишком обеспокоено негативной реакцией некитайцев."
 KMT_VICTORY_TERROR.0.d: "Правительство Китайской Республики недавно начало кампанию по искоренению инакомыслия и угроз государству. Полиция и другие государственные органы уже начали расследования в отношении политиков, писателей, активистов и представителей интеллигенции, обвиняемых либо в сочувствии, либо в открытой поддержке врагов государства. В частности, в центре внимания оказались сторонники коммунистов и криминальные элементы. Многие правозащитники выражают обеспокоенность тем, что это новое подавление инакомыслия представляет собой «белый террор» и будет использоваться для подавления любой угрозы правящей партии за счет личных или политических прав."
 KMT_CULTS.0.d: "Китайская Республика решила узаконить тайные культы, которые процветают в сельских районах Китая. Эти квазирелигиозные и культурные движения существовали веками. Многие из самых мощных восстаний в истории Китая произошли из-за этих культов. В последние десятилетия из этих групп в эпоху полевых командиров и гражданской войны формировались местные силы самообороны. Китайское правительство считает, что, узаконив эти группы, оно принесет эти силы самообороны и стабильность, обеспечиваемую этими группами, в поддержку государства. Однако есть опасения, что такие группы могут использовать эту легитимацию для расширения своего влияния под защитой государства."
 KMT_CULTS.1.d: "Китайская Республика решила подавить и ликвидировать тайные культы и общества, которые процветают в сельских районах Китая. Хотя эти группы существовали веками, в последние десятилетия они начали формировать местные силы самообороны среди всеобщего беспредела эпохи полевых командиров и гражданской войны. Нацелившись на эти группы, китайское правительство рискует столкнуться с кризисом правопорядка, пока не сможет установить присутствие в этих районах. Другие опасаются, что эти культы могут даже превратиться в разбойников и еще больше подорвать закон и порядок. Тем не менее, этот шаг свидетельствует о твердой приверженности китайского государства установлению своего контроля над страной."
 KMT_SHOW_TRIALS.1.d: "В Китайской Республике проходит серия массовых публичных судебных процессов. Японские военнопленные времен Второй китайско-японской войны и коммунистические активисты, обвиняемые в преступлениях во время гражданской войны, предстанут перед открытым судом. Правительство освещает эти судебные процессы по всей стране, и есть первые признаки того, что суды осудят всех обвиняемых. Правительство стремится продемонстрировать силу Китайской Республики и обеспечить справедливость китайскому народу. Оппоненты правительства и международные наблюдатели осуждают судебные процессы как чисто шоу и политический театр."
 KMT_LAND_REFORM.1.d: "Неожиданным решением Китайская Республика приняла новый всеобъемлющий Закон о земельной реформе, призванный уменьшить подавляющую власть помещиков и предоставить крестьянам новые возможности. На протяжении десятилетий правящий Гоминьдан устанавливал прочные связи с сельскими помещиками, и в течение многих лет его неспособность поддержать земельную реформу оказалась выгодной для коммунистов. Правительство надеется, что его приверженность земельной реформе вызовет расположение крестьян к государству и вычеркнет коммунистов из богатого резерва рекрутов для их повстанческих операций."
 KMT_LAND_REFORM.2.d: "Китайская Республика приняла новый Закон о земельной реформе, который, по утверждению правительства, знаменует драматическую победу крестьян Китая. Однако, несмотря на их заявления о проведении крупных реформ, многие местные и международные наблюдатели утверждают, что реформы минимальны. У помещиков остается много лазеек, и крестьяне не заметят резких перемен в своем положении. Похоже, что правительство не желает терять свою традиционную поддержку помещиков, которые оказывают государству экономическую и политическую поддержку."
 CHI_MARTIAL_LAW.0.d: "Китайская Республика объявила об отмене военного положения в стране. Это часть крупных реформ в правящей партии Гоминьдана. Реформаторы твердо убеждены, что восстановление конституционных и демократических прав ослабит инакомыслие и поддержку населением региональных лидеров или коммунистов-лазутчиков. Подобные реформы, вероятно, будут продолжены, несмотря на критику со стороны части старой гвардии в партии, что такие реформы и демократизация могут привести к потере контроля и инакомыслию. Решение об отмене военного положения широко приветствуется по всей стране."
 CHI_MARTIAL_LAW.1.d: "Китайская Республика приняла закон, делающий действующее в стране военное положение постоянным. Это крупная победа старой гвардии Гоминьдана, которая долгое время выступала против реформаторов, выступающих за восстановление прав или демократических практик. Они утверждают, что такие реформы сделают Китай слабым и уязвимым перед угрозой региональных полевых командиров и коммунистического влияния. Правительство Китая считает, что продолжение военного положения сохранит силу государства, остановит внутреннее инакомыслие и поможет обуздать влияние враждебных идеологий или наций."
 TIBET_KMT.3.d: "Китайская Республика решительно осудила Далай-ламу за неприкрытую узурпацию суверенитета Китая. Китайское правительство утверждает, что Далай-лама незаконно уступил территорию и вел иностранные дела без разрешения Китая, который является сувереном. Китайцы призывают Далай-ламу прекратить свои провокации и подтвердить свою лояльность Китаю, отметив, что он должен оценить, сколько автономии и уважения он получает от республики."
 TIBET_KMT.10.d: "К удивлению многих наблюдателей, Китайская Республика подписала соглашение с Тибетом, признающее его независимость. Китайское правительство заявило, что считает, что территория была завоевана деспотичной империей Цин, и новое демократическое китайское государство не может удержать территорию, захваченную из тщеславия императора. Тибетское правительство во главе с Далай-ламой похвалило президента [CHI.GetLeader] за его умелое руководство и пообещало новую эру мира между двумя государствами. Многие наблюдатели считают, что Китай стремится установить дружеские отношения с Тибетом и сохранить его в качестве буферного государства с Южной Азией.."
 TIBET_KMT.5.d: "К удивлению многих наблюдателей, Китайская Республика подписала соглашение с Тибетом, признающее его независимость. Китайское правительство заявило, что считает, что территория была завоевана деспотичной империей Цин, и новое демократическое китайское государство не может удержать территорию, захваченную из тщеславия императора. Тибетское правительство во главе с Далай-ламой похвалило президента [CHI.GetLeader] за его умелое руководство и пообещало новую эру мира между двумя государствами. Многие наблюдатели считают, что Китай стремится установить дружеские отношения с Тибетом и сохранить его в качестве буферного государства с Южной Азией."
 TIBET_KMT.6.d: "Далай-лама объявил, что Тибет является суверенной частью Китайской Республики, и он не является главой государства. Это знаменует собой принятие Далай-ламой требований Китая о том, чтобы он признал суверенитет республики и прекратил любые попытки заключить договоры или уступить территории своей собственной властью. Далай-лама, вероятно, согласился после того, как получил заверения в том, что китайцы предоставят Тибету огромную автономию и сохранят за нынешним правительством управление территорией для Китая. Некоторые наблюдатели считают, что опасения военного вмешательства или восстания, спонсируемого Китаем, также были факторами, подтолкнувшими Тибет к согласию с требованиями Китая."
 TIBET_KMT.21.d: "Дали-лама был свергнут в результате недавнего переворота, организованного Панчен-ламой. Панчен-лама, второе духовное лицо Далай-ламы, в течение многих лет питал желание усилить политическое влияние. Похоже, верные ему вооруженные войска смогли обезопасить ключевые перевалы и города, включая въезды в Лхасу. Поскольку единственным выходом была гражданская война, Далай-лама решил вместо этого приказать своим сторонникам отступить. Новое тибетское правительство объявило, что примет суверенитет Китая при условии, что Тибет сохранит свою автономию. Многие международные наблюдатели считают, что Панчен-лама пользовался поддержкой и даже оружием Китайской Республики."
 TIBET_KMT.22.d: "Попытка переворота сместить Дали-ламу в Тибете закончилась неудачей. Бойцы, верные Панчен-ламе, духовно второму после Далай-ламы, стремились захватить контроль над стратегически важными городами, перевалами и входами в Лхасу, чтобы добиться быстрой капитуляции Далай-ламы. Однако сторонники Далай-ламы сорвали попытки захватить районы вокруг Лхасы, и Панчен-лама вскоре обнаружил, что его сторонники тают, как только группы сторонников Далай-ламы пришли бросить им вызов. В заявлении Далай-лама заявил, что остановил прокитайскую попытку захватить власть, и пообещал, что не пойдет на компромисс в отношении независимости своей страны. Китайская Республика отрицала свою причастность, хотя появилось несколько фотографий, на которых боевики Панчен-ламы вооружены китайскими винтовками."
 TIBET_KMT.11.d: "Новое соглашение было достигнуто между Китайской Республикой и Индией. Многие из предыдущих споров были сняты после того, как Китайская Республика признала независимость Тибета. Ранее Китай заявлял о своем суверенитете над Тибетом и считал себя сувереном, определяющим границу между Индией и Тибетом. Поскольку Тибет признан независимым, китайская граница с Индией намного меньше и меньше спорных вопросов. После непродолжительных переговоров обе стороны смогли подписать соглашение об официальном урегулировании своей границы. Как китайское, так и индийское правительство выразили надежду, что новое урегулирование послужит толчком к возобновлению дружбы между крупнейшими демократиями Азии."
 CHI_SEATO.1.d: "Китайская Республика согласилась присоединиться к Организации Юго-Восточного договора (СЕАТО) с целью расширения сотрудничества между государствами-членами и борьбы с коммунистическим влиянием в регионе. Для китайского правительства присоединение к группе расширит его региональную роль и даст ему доступ к местным союзникам, поскольку оно стремится координировать антикоммунистическую деятельность в Азии. Китайское правительство выразило свое воодушевление по поводу участия в следующем саммите СЕАТО. Соединенные Штаты особенно рады присоединению Китая, поскольку это придает организации большую легитимность. Советский Союз и региональные коммунистические партии осуждают эту акцию и обвиняют СЕАТО в том, что она является империалистическим фронтом. Члены оппозиции в частном порядке выразили средствам массовой информации свои опасения по поводу того, что СЕАТО может принести мало материальных выгод и сделать Китай более крупной мишенью для международного коммунизма."
 TIBET_KMT.15.d: "Далай-лама, лидер Тибета, призвал международное сообщество защитить страну после сообщений о том, что Китайская Республика начала вторжение. Сообщается, что китайские войска направляются в Тибет с целью установления китайского контроля. Китайское правительство утверждает, что оно не начинает вторжение, а вместо этого предпринимает локальные действия по восстановлению контроля над провинцией. Китайцы утверждают, что Далай-лама является автономным администратором, но его недавние заявления о независимости и усилия по территориальным переговорам являются явным нарушением, и он должен быть привлечен к ответственности. Китайцы настаивают на том, что все усилия по мирному урегулированию были отклонены Далай-ламой, и надеются быстро восстановить закон и порядок для народа Тайваня."
 TIBET_KMT.16.d: "После недавнего вторжения в Тибет Китайской Республики традиционная тибетская аристократия оказалась перед арестом или обвинением. Эта аристократия долгое время была основным источником легитимности, членства и власти для Далай-ламы и его правительства. Решение Китая нацелиться на эту группу и ослабить ее в экономическом и военном отношении должно разрушить базу поддержки старого правительства. Если Далай-лама и его союзники потеряют базу местной поддержки, это укрепит усилия китайского правительства по созданию более послушного тибетского государства. Что еще более важно, китайские чиновники, прибывшие в Тибет, также будут защищены от местной конкуренции. Говорят, что несколько тибетских аристократов бежали в сторону Непала, Индии и Бирмы."
 TIBET_KMT.105.d: "После успешного переворота Панчен-ламы против Далай-ламы Тибет подписал соглашение с Китайской Республикой. Тибет станет частью Китая и будет называться Тибетским автономным районом. Китайское правительство пообещало оказать поддержку Панчен-ламе, в том числе предоставить ему обширную политическую власть в обмен на подчинение его правительства суверенитету Китая. Тибетское и китайское правительства настаивают на том, что администрация и управление Тибетом останутся в основном прежними, однако Тибет больше не сможет проводить внешнюю политику или полностью контролировать свои вооруженные силы."
 CC_CLIQUE_FALL.0.d: "В рамках недавних политических реформ и демократизации в Китайской Республике президент [CHI.GetLeader] подписал новый закон, возвращающий ряд полномочий Законодательному юаню. Законодательный юань, когда-то являвшийся штампом для правящего Гоминьдана, начал проводить гораздо больше дебатов и принимать законы без указаний исполнительного совета. Наблюдатели считают, что новые реформы превращают Законодательный юань в более мощный политический институт и контролируют исполнительную власть в Китайской Республике."
 CC_CLIQUE_FALL.1.d: "Клика КЦ в Гоминьдане пережила значительное падение своего влияния и власти в Китайской Республике. Многим из его видных лидеров предъявлены обвинения в коррупции или они сняты с ключевых постов. В сообщениях СМИ освещаются некоторые военные и политические неудачи лидеров клики CC за последние несколько десятилетий. Клика CC представляет правое крыло Гоминьдана и зарекомендовала себя как яростная антикоммунистическая и антияпонская организация. Однако новые реформы демократизации открыли позиции для других групп, и многие реформаторы рассматривают клику ЦК как старую гвардию, которую необходимо заменить, если Китай хочет процветать. Реформаторы надеются, что ослабление клики ЦК позволит осуществить плавный переход к демократии. Лидеры клики КЦ предупреждают, что быстрые реформы приведут к нестабильности и плохому управлению."
 KMT_Atoms.1.d: "Китайская Республика объявила о своем полном согласии и поддержке программы «Атом для мира», инициированной Соединенными Штатами. «Атом во имя мира» — это программа, которая побуждает страны узнавать о рисках и преимуществах ядерных технологий. Программа предоставляет поддержку в области образования и техническую помощь в разработке ядерных реакторов. Китайское правительство считает, что программа поможет ему обучать ученых-ядерщиков и разрабатывать собственные ядерные технологии, чтобы лучше удовлетворять свои потребности в энергии, поскольку оно смотрит в светлое будущее. Региональные коммунистические партии критикуют эту программу как тайное средство, позволяющее Китаю приобретать средства для производства ядерного оружия, и обвиняют Соединенные Штаты в поддержке ядерного оснащения Восточной Азии."
 CHI_INDO.10.d: "Китайская Республика наглядно продемонстрировала свою профранцузскую позицию в отношении Индокитая, начав серию военных операций против позиций Вьетминя вдоль китайской границы с Вьетнамом. Китайцы разместили в регионе сотни тысяч военнослужащих во время Второй мировой войны и хорошо осведомлены о позициях вьетнамских националистов. Китайское правительство утверждает, что его силы нацелены на коммунистический Вьетминь, и его операции направлены на предотвращение распространения коммунизма в регионе. В ответ на критику в том, что он поддерживает империализм, китайцы отметили, что отказ от нападения на Вьетминь только гарантирует, что вьетнамский народ заменит угнетение колониализма рабством коммунизма. Говорят, что Вьетминь оправился от этих ударов."
 ROC_VICTORY.1.d: "Советский Союз и его союзник Монголия недавно вмешались в гражданскую войну в Китае, чтобы предотвратить полный крах Китайской Народной Республики (КНР), когда она изо всех сил пыталась сдержать Китайскую Республику. После ожесточенных боев было установлено прекращение огня. Монголия взяла под свой контроль Внутреннюю Монголию, назвав ее буферной зоной от китайской агрессии. В то же время КНР при поддержке СССР установила контроль в Пекине, его окрестностях и Маньчжурии. На западе Синьцзян присоединился к Восточному Туркестану. Остальная часть Китая, включая большую часть его промышленной базы и этнического ханьского населения, находится под контролем Китайской Республики. Непростое прекращение огня в настоящее время соблюдается, но ожидается, что обе стороны восстановят свои арсеналы и планируют будущее разрешение конфликта в свою пользу."
 ROC_CLIQUE.15.d: "Усилия по восстановлению внутренней стабильности и гармонии в Китайской Республике, похоже, терпят неудачу, поскольку против правительства восстали несколько военных клик. Эти военные клики напоминают то, что наблюдалось в период полководцев, когда военачальники формировали лояльные силы во главе с офицерами, имеющими схожие профессиональные, культурные или территориальные корни. Многие в Китае заявляют, что начался Второй период военачальников, и есть опасения по поводу возможной гражданской войны, политической нестабильности или нарушения закона и порядка. Китайское правительство заявляет, что ситуация будет урегулирована быстро, и Китай не станет жертвой каких-либо полевых командиров."
 ROC_CLIQUE.16.d: "Цзяо Юйлу, бывший коммунист, вернулся к своим корням лидера культа, провозгласив себя наследником империи Мин. Его заявление поддерживают популярное Общество Красного Копья и другие культы, посвященные восстановлению династии Мин. Возвращение полевых командиров и рост общественного недоверия привели к всплеску популярности таких групп, которые организуют местные силы самообороны для борьбы с полевыми командирами, бандитами и теми, кого считают коррумпированными государственными чиновниками. Претендент на Мин хочет свергнуть Китайскую Республику, чтобы восстановить имперское правление, утверждая, что республике не хватает небесного мандата, а Китаю нужна новая династия. Китайскому правительству придется восстановить общественное доверие и быстро отреагировать, прежде чем это монархическое движение станет слишком сильным."
 ROC_CLIQUE.1.d: "Могущественная хунаньская клика восстала против республики. Эти военные офицеры, ссылаясь на репрессивные действия правительства и вмешательство в местные дела, хотят большей автономии и сокращения централизованной власти. Китайское правительство гневно осудило восстание, приказав всем верным офицерам в Хунани оставаться верными республике, хотя, похоже, их призыв в значительной степени игнорируется. Известно, что хунаньские офицеры установили связи с коммунистами в 1920-х и 1930-х годах. Китайское правительство опасается, что хунаньская клика может использовать эти контакты и пригласить коммунистов для военной помощи, но в конечном итоге отдаст регион врагу."
 ROC_CLIQUE.2.d: "Клика Нинся Ма восстала против республики. Эти офицеры с запада, в основном мусульмане, ссылаются на репрессивные действия правительства и вмешательство в дела граждан. Они хотят большей автономии и уменьшенной централизованной власти. Китайское правительство гневно осудило восстание, приказав всем верным офицерам в Нинся оставаться верными республике, хотя, похоже, их призыв в значительной степени игнорируется. Китайское правительство захочет действовать быстро, поскольку любое восстание на западе всегда чревато риском вызвать либо более широкое исламское восстание, либо дать возможность враждебным соседям расширить свое влияние в одном из приграничных районов Китая."
 ROC_CLIQUE.3.d: "Новая клика Гуанси восстала против республики. Одна из самых могущественных клик в 1920-х и 1930-х годах, ее восстание вызывает большую обеспокоенность китайского правительства. Клика поднимается из-за централизации усилий и реформ, нацеленных на клики и старую гвардию республики. Китайское правительство обвиняет восставших офицеров в том, что они действуют из личных интересов, и призывает всех лояльных офицеров оставаться верными республике. Китайское правительство будет стремиться действовать быстро, поскольку Гуанси является основным населением и экономической базой Китая."
 ROC_CLIQUE.4.d: "Клика Цинхай Ма западного Китая восстала против республики. Его лидеры называют чрезмерную централизацию и угнетение культурных прав наряду с автономией основной причиной своих беспорядков. Китайское правительство призвало всех офицеров оставаться лояльными и осудило клику за стремление остановить развитие Китая. Китайское правительство будет стремиться действовать быстро, поскольку Цинхай находится недалеко от спорных границ, и уже есть опасения, что офицеры повстанцев могут попытаться заключить союз с внешним или внутренним врагом республики."
 ROC_CLIQUE.5.d: "Шаньсийская клика восстала против республики. В качестве основных причин восстания его лидеры называют чрезмерную централизацию и реформы, направленные на слом существующей военной организации. Китайское правительство обвиняет клику в милитаризме и призывает всех офицеров оставаться верными государству. Китайское правительство будет стремиться действовать быстро, чтобы подавить другие восстания и быстро навести порядок в Шаньси. Шаньси находится близко к коммунистам, и есть опасения, что местные и иностранные агитаторы-коммунисты могут попытаться использовать этот конфликт для расширения своего влияния."
 ROC_CLIQUE.6.d: "Синьцзянская клика восстала против республики. Эти офицеры с запада, в основном мусульмане, ссылаются на репрессивные действия правительства и вмешательство в дела граждан. Они хотят большей автономии и уменьшенной централизованной власти. Китайское правительство гневно осудило восстание, приказав всем лояльным офицерам в Синьцзяне оставаться верными республике, хотя, похоже, их призыв в значительной степени игнорируется. Китайское правительство захочет действовать быстро, поскольку любое восстание на западе всегда чревато риском вызвать либо более широкое исламское восстание, либо дать возможность враждебным соседям расширить свое влияние в одном из приграничных районов Китая. Отмечается, что в прошлом клика имела тесные связи с Советами."
 ROC_CLIQUE.7.d: "Юньнаньская клика восстала против Республики. В качестве основных причин восстания его лидеры называют чрезмерную централизацию и реформы, направленные на изменение существующей военной структуры страны. Китайское правительство обвиняет клику в военачальничестве и призывает всех офицеров оставаться лояльными. Китайское правительство будет стремиться задавать вопросы быстро, поскольку Юньнань является стратегически важной провинцией и имеет доступ к нескольким иностранным государствам, которые могут попытаться использовать восстание в своих интересах."
 ROC_CLIQUE.100.d: "Самопровозглашенный минский император Китая Цзяо Юйлу и его коалиция ополченцев и культистов положили конец второму периоду военачальников. Харизматичный бывший коммунист смог использовать гнев и разочарование сельских китайских крестьян, которые устали от постоянной борьбы между Гоминьданом, коммунистами и полевыми командирами. Возвращение полевых командиров стало последней каплей для многих, кто опасался, что их прибытие приведет к новым лишениям и бандитизму. С победой Цзяо Юйлу Китайская Республика оказывается на грани либо объединения сил и восстановления династии Мин, либо уничтожения."
 ROC_CLIQUE.101.d: "Второй период военачальников в Китае подошел к концу. Возвращение к военачальникам было горько воспринято многими крестьянами, которые увидели возвращение к бандитизму, нестабильности и насилию после многих лет войны. Многие теперь надеются, что клики наконец исчезнут навсегда. Китайское правительство теперь должно работать над восстановлением не только нанесенного физического ущерба, но и восстановить доверие китайского народа. На международном уровне все чаще звучат призывы и давление на правительство, чтобы оно инициировало новую политику, чтобы предотвратить повторение такой ситуации."
 ROC_CLIQUE.102.d: "Китайская Народная Республика (КНР) объявила, что ее силы завершили Второй период полководцев. КНР заявила, что коррумпированная и недееспособная республика привела Китай на грань распада и разорения. Затем он похвалил крестьян и народ за восстание с Народно-освободительной армией, чтобы смести коррумпированных полевых командиров и некомпетентных республиканских провинциальных и национальных чиновников. В заключение КНР объявила о программе, направленной на обеспечение развития, процветания и модернизации крестьян, которыми десятилетиями пренебрегали и эксплуатировали."
 ROC_CLIQUE.103.d: "Второй период военачальников в Китае подошел к концу. Возвращение к военачальникам было горько воспринято многими крестьянами, которые увидели возвращение к бандитизму, нестабильности и насилию после многих лет войны. Многие теперь надеются, что клики наконец исчезнут навсегда. Китайской Республике удалось воссоединить страну, несмотря на угрозу со стороны ополченцев, полевых командиров, коммунистов и сект. Китайское правительство теперь должно работать над восстановлением не только нанесенного физического ущерба, но и восстановить доверие китайского народа. Президент [CHI.GetLeader] пообещал построить сильную республику и привести Китай к его великой судьбе."
 ROC_SOV.1.d: "Советы потребовали, чтобы мы объявили об одностороннем прекращении огня в Азиатской освободительной войне. Независимо от наших территориальных приобретений или потерь, Советы также просили довоенного статус-кво территории, вовлеченной во время войны, фактически установив наши старые границы. Это оказалось спорным вопросом не только в нашей стране, но и в штаб-квартире наших врагов, а также в Совете Безопасности Организации Объединенных Наций. Как мы должны двигаться отсюда?"
  
