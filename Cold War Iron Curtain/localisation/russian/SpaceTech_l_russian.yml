l_russian:
  
 # Spacecraft Construction 
 space_folder: "Конструкция и двигатель космического аппарата"
 space_folder_desc: "Постоянное развитие конструкций и двигателей космических аппаратов имеет важное значение для создания и продвижения космической программы."
 woodmetal_frames: "Каркас корабля из дерева/металла"
 woodmetal_frames_short: "Каркас из дерева/металла"
 woodmetal_frames_desc: "Ракеты первого поколения создавались из деревянных и металлических каркасов, особенно немецкие ракеты времен Второй мировой войны. По мере приближения ракет к стратосфере и за ее пределы, требуются более совершенные материалы."
 pressure_vessel1: "2-4 метровые фюзеляжи"
 pressure_vessel1_short: "2-4 метровые фюзеляжи ракет"
 pressure_vessel1_desc: "У нас есть возможность изготавливать фюзеляжи ракет диаметром 2-4 метра. Небольшой размер ограничивает полезную нагрузку и тягу."
 stainless_steel: "Нержавеющая сталь"
 stainless_steel_desc: "Нержавеющая сталь - это сплав, предотвращающий возникновение ржавчины. Он увеличивает прочность стали, устойчивость к коррозии и температуру плавления. Однако вес ограничивает возможности его применения."
 continuous_pressurization: "Непрерывное повышение давления"
 continuous_pressurization_short: "Непрерывное давление"
 continuous_pressurization_desc: "Требуется для хранения топлива в космическом вакууме. Необходимо для космических путешествий и может повысить категорию космического корабля. Без этого двигателям было бы сложно работать вне атмосферы Земли."
 pressure_vessel2: "4-8 метровые фюзеляжи ракет"
 pressure_vessel2_short: "4-8 метровые фюзеляжи"
 pressure_vessel2_desc: "У нас есть возможность изготавливать фюзеляжи ракет диаметром 4-8 метров. Более крупные ракеты улучшат характеристики, полезную нагрузку и мощность наших ракет."
 common_bulkhead: "Смежные перегородки"
 common_bulkhead_desc: "Общая перегородка позволяет хранить кислород и водород бок о бок. Это помогает уменьшить вес и сложность космических кораблей, повысить полезную нагрузку и производительность."
 balloon_tanks: "Шарообразные баки"
 balloon_tanks_desc: "Тип топливного бака для разгонной ступени. Цилиндрическая конструкция не использует внутренний каркас и сохраняет форму. Это значительно увеличивает летно-технические характеристики космического корабля."
 pressure_vessel3: "8-12 метровые фюзеляжи ракет"
 pressure_vessel3_short: "8-12 метровые фюзеляжи"
 pressure_vessel3_desc: "У нас есть возможность изготавливать фюзеляжи ракет диаметром 8-12 метров. Более крупные ракеты улучшат характеристики, полезную нагрузку и мощность наших ракет."
 advanced_plumbing: "Продвинутая связь"
 advanced_plumbing_desc: "Мы разработали современную трубопроводную систему, чтобы обеспечить безопасный, экологичный и герметичный труюопровод для входа в атмосферу, а также  для решения проблем, связанных с пилотируемыми космическими полетами и устойчивостью космических кораблей."
 anti_slosh_baffles: "Противоскользящие / вихревые перегородки"
 anti_slosh_baffles_short: "Вихревые перегородки"
 anti_slosh_baffles_desc: "Брызги жидкости могут быть очень опасны с точки зрения их воздействия во время запуска или полета. Анти-брызговые перегородки сводят к минимуму случаи брызг, чтобы избежать значительного изменения динамики системы."
 pressure_vessel4: "12-16 метровые фюзеляжи ракет"
 pressure_vessel4_short: "12-16 метровые фюзеляжи"
 pressure_vessel4_desc: "У нас есть возможность изготавливать фюзеляжи ракет диаметром 12-16 метров. Более крупные ракеты улучшат характеристики, полезную нагрузку и мощность наших ракет."
 titanium_frame: "Титановый каркас"
 titanium_frame_short: "Титановый каркас"
 titanium_frame_desc: "Прочный металл с очень высокой температурой плавления, способный выдержать влияние среды во время космических путешествий. Он такой же прочный, как сталь, но легче, давая все преимущества стали, но с более высокой производительностью."
 temperature_control: "Контроль температуры корпуса"
 temperature_control_short: "Температурный контроль"
 temperature_control_desc: "Эта разработка позволяет точно контролировать температуру в топливных баках. Это позволяет использовать различные, более эффективные элементы или смеси, которые могут значительно улучшить мощность, характеристики и топливную эффективность космических аппаратов."
 pressure_vessel5: "16-24 метровые фюзеляжи ракет"
 pressure_vessel5_short: "16-24 метровые фюзеляжи"
 pressure_vessel5_desc: "У нас есть возможность изготавливать фюзеляжи ракет диаметром 16-24 метра. Более крупные ракеты улучшат характеристики, полезную нагрузку и мощность наших ракет, улучшая возможности для межпланетных путешествий."
 carbon_fiber: "Композиты из углеродного волокна"
 carbon_fiber_short: "Углеродное волокно"
 carbon_fiber_desc: "Эти композиты являются материалом огромной прочности, температурной устойчивости и, что более важно, их легкий вес дает им существенное преимущество перед традиционными металлами. Однако, в отличие от металлов, у них нет четкого предела выносливости."
 external_tanks: "Внешние топливные баки"
 external_tanks_desc: "Эти топливные баки могут быть прикреплены к космическому кораблю снаружи и безопасно выброшены после запуска. Эти резервуары потенциально могут быть использованы повторно. Это сокращает расходы, поддерживает космический корабль во время запуска и позволяет увеличить полезную нагрузку и возможности космического корабля."
 pressure_vessel6: "24-30 метровые фюзеляжи ракет"
 pressure_vessel6_short: "24-30 метровые фюзеляжи"
 pressure_vessel6_desc: "У нас есть возможность изготавливать фюзеляжи ракет диаметром 24-30 метров. Более крупные ракеты улучшат характеристики, полезную нагрузку и мощность наших ракет, улучшая возможности для межпланетных путешествий."
 aluminum_lithium: "Литиевые сплавы"
 aluminum_lithium_desc: "Этот сплав отличается прочностью и непревзойденными аэродинамическими характеристиками. Хотя он не такой прочный, как сталь или титан, он намного легче, что позволяет использовать большую полезную нагрузку и даёт больше возможностей для космических кораблей."
 lightweight_tanks: "Сверхлегкие баки"
 lightweight_tanks_desc: "Эти баки из более легкого сплава прикреплены к космическому кораблю снаружи. Они обеспечивают все те же преимущества, что и внешние топливные баки, но значительно легче, что увеличивает полезную нагрузку и характеристики космического корабля."
 carbon_fiber2: "Сегменты из композитов"
 carbon_fiber2_desc: "Эти углеродные волокна перенаправляются к внутренней части волокна, что делает их намного прочнее, чем раньше, и смягчает недостаток прочности по сравнению с более тяжелыми альтернативами. Это позволяет получить более прочную структуру, но сохранить небольшой вес."
 helium_pressurization: "Герметизация гелия"
 helium_pressurization_desc: "Гелий предлагает более безопасный способ герметизации топливных баков. Он также намного легче и уменьшает необходимый объем, что увеличивает полезную нагрузку космического корабля."
 orbital_construction: "Орбитальное строительство кораблей"
 orbital_construction_short: "Орбитальное строительство"
 orbital_construction_desc: "По сути, верфь в космосе, где строятся космические корабли. Постройка космических кораблей с орбиты значительно снизила бы затраты и необходимость космических запусков. Многие рассматривают это развитие как ключевой шаг в массовом освоении космоса. Эти объекты могут также ремонтировать поврежденные шаттлы или спутники."
  
 # Propulsion 
 liquid_propellant: "Ракета на жидком топливе"
 liquid_propellant_short: "Жидкостная ракета"
 liquid_propellant_desc: "Ракета с использованием жидкого топлива - химического вещества или смеси двух химических веществ. Оно позволяет уменьшить объем резервуаров, что делает его идеальной ракетой для запуска спутников или космических кораблей, хотя и является механически сложной."
 solid_propellant: "Ракета на твердом топливе"
 solid_propellant_short: "Твердотопливная ракета"
 solid_propellant_desc: "Ракета на твердом топливе, используемая для запуска спутников или космических кораблей. Несмотря на более низкие характеристики по сравнению с жидким ракетным топливом, оно может храниться в течение более длительных периодов времени и обеспечивает высокую надежность при запуске."
 hybrid_propellant: "Ракета на гибридном топливе"
 hybrid_propellant_short: "Гибриднотопливная ракета"
 hybrid_propellant_desc: "Ракета, которая использует две фазы ракетного топлива, твердое и жидкое. Это позволяет избавиться от низких характеристик твердотопливных ракет и от механической сложности жидкостных ракет. В случае аварии её будет проще обезвредить."
 nuclear_pulse_propulsion: "Ядерный импульсный двигатель"
 nuclear_pulse_propulsion_short: "Ядерный и. двигатель"
 nuclear_pulse_propulsion_desc: "Тип силовой установки, в которой используется серия направленных ядерных взрывов. Это чрезвычайно мощная двигательная установка, при этом с должным образом защищенным экипажем."
 cryogenic_rocket: "Криогенная ракета"
 cryogenic_rocket_desc: "Ракета, использующая криогенное топливо и окислители для создания высокоэффективных двигателей. Они позволяют хранить газ в жидкой форме, сохраняя низкий вес топлива и позволяя совершать космические полеты."
 solid_core_rocket: "Твердотопливная ядерная тепловая ракета"
 solid_core_rocket_short: "Ядерная ракета"
 solid_core_rocket_desc: "Использует тепло ядерной реакции в качестве топлива вместо химического вещества, что приводит к большей эффективности и способности увеличить полезную нагрузку космического корабля в три-четыре раза."
 pebble_core_rocket: "Ядерная тепловая ракета с твердым ядром из гальки"
 pebble_core_rocket_short: "Галечное ядро"
 pebble_core_rocket_desc: "Если в ракете с твердым ядром используется твердый блок топлива, то в ракете с галечным ядром используется много маленьких сферических топливных элементов для увеличения площади поверхности и увеличения теплового потока для производства энергии. Он не только мощнее, но и безопаснее при запуске."
 dual_mode_rocket: "Ракета с двойным двигателем"
 dual_mode_rocket_short: "Двухрежимная ракета"
 dual_mode_rocket_desc: "Сочетает в себе двухкомпонентные и монотопливные ракеты, позволяя использовать преимущества обеих конструкций в миссии. Космический корабль может выполнять маневры с высокой тягой с двухкомпонентным топливом, прежде чем переключиться на экономичное монотопливо на оставшуюся часть полета."
 liquid_core_rocket: "Ядерная тепловая ракета с жидким ядром"
 liquid_core_rocket_short: "Жидкое ядро"
 liquid_core_rocket_desc: "Ядерный двигатель на жидких фазированных делящихся элементах. Преимущество системы в том, что она позволяет получить очень высокий удельный импульс, что значительно увеличивает эффективность использования топлива."
 fission_fragment: "Осколочное деление"
 fission_fragment_desc: "Этот тип ракетного двигателя напрямую принимает продукты ядерного деления для толчков, вместо того, чтобы использовать отдельную жидкость для использования в качестве массы для ускорения. Это резко увеличивает удельный импульс системы."
 tripropellant_rocket: "Трехкомпонентная ракета"
 tripropellant_rocket_desc: "Ракета, в которой используются три топлива, дающие одни из самых высоких зафиксированных удельных импульсов. Она сохраняет высокие возможности, избегая при этом экологических проблем, связанных с ядерными ракетами и недостатком мощности электрических ракет."
 droplet_core_rocket: "Ядерная тепловая ракета с капельным ядром"
 droplet_core_rocket_short: "Капельное ядро"
 droplet_core_rocket_desc: "Двигатель впрыскивает жидкий уран в активную зону в виде капель, чтобы привести реактор к максимальной выработке энергии. Это значительно увеличивает удельные импульсы и может значительно сократить время длительных космических путешествий."
 closed_core_rocket: "Ядерная тепловая ракета с газовым ядром замкнутого цикла"
 closed_core_rocket_short: "Замкнутый цикл"
 closed_core_rocket_desc: "Одна из основных проблем, связанных с конструкциями ядерных ракет, - это их воздействие на окружающую среду. Ракета замкнутого цикла предотвращает утечку радиации, работает при экстремальных температурах и по своим характеристикам намного превосходит большинство ракет на химическом топливе."
 variable_thrust_rocket: "Ракета с регулируемой тягой"
 variable_thrust_rocket_short: "Регулируемая тяга"
 variable_thrust_rocket_desc: "Конструкция твердотопливной ракеты, которая позволяет ракетам ускоряться или замедляться в зависимости от целей миссии. Возможность управления ускорением имеет много преимуществ для космических кораблей и позволяет выполнять широкий спектр новых миссий в космосе."
 nuclear_pulse_propulsion2: "Ядерный импульсный парус"
 nuclear_pulse_propulsion2_short: "Ядерный парус"
 nuclear_pulse_propulsion2_desc: "Использует ядерную импульсную двигательную установку с прикрепленным перед ней большим спинакерным парусом. Парус улавливает больше взрывных импульсов, увеличивая удельный импульс, уменьшая вес и увеличивая грузоподъемность."
 open_core_rocket: "Ядерная тепловая ракета открытого цикла с газовым ядром"
 open_core_rocket_short: "Ракета открытого цикла"
 open_core_rocket_desc: "Ракета, которая приводится в движение жидкостью газового реактора деления. Он способен производить удельные импульсы и мощную тягу для межпланетных путешествий."
 dusty_fission_fragment: "Пылеобразный осколок деления плазмы"
 dusty_fission_fragment_short: "Деление плазмы"
 dusty_fission_fragment_desc: "Ядерный реактор, вырабатывающий электричество за счет замедления ионного пучка продуктов деления. Пылеобразная плазма увеличивает площадь поверхности для эффективного кодирования излучения. Его эффективность может достигать девяноста процентов."
 precooled_rocket_engines: "Ракетные двигатели с предварительным охлаждением воздуха"
 precooled_rocket_engines_short: "Предварительное охлаждение"
 precooled_rocket_engines_desc: "Ракета единого парогазового цикла с двумя режимами работы. Это позволяет космическому аппарату с двигателем выполнять одноступенчатый выход на орбиту. Такая возможность многократного использования снижает затраты и расход материалов."
  
 # Power Generation 
 mercury_batteries: "Космические аккамуляторы с оксидом ртути"
 mercury_batteries_short: "Оксиднортутные батареи"
 mercury_batteries_desc: "Популярный аккумулятор и источник питания для портативных электронных устройств. Он не перезаряжаемый, но способен выдерживать космический запуск и вибрацию при выходе на орбиту."
 nickel_batteries: "Космические никель-кадмиевые аккумуляторы"
 nickel_batteries_short: "Никель-кадмиевые батареи"
 nickel_batteries_desc: "Перезаряжаемый аккумулятор в котором используется никель. Они используются для портативных инструментов, фонариков и другого электронного оборудования. Они способны выдерживать акселерацию и вибрацию космических путешествий."
 hydrogen_cells: "Водородно-кислородные топливные элементы"
 hydrogen_cells_short: "Водородно-кислородные"
 hydrogen_cells_desc: "Водородно-кислородные элементы являются одними из самых экономичных топливных элементов. Они производят воду, тепло и электричество. Производят меньше загрязнения, чем другие источники, и могут эффективно обеспечивать питание спутников и космических капсул."
 radioisotope_generators: "Радиоизотопные термоэлектрические генераторы"
 radioisotope_generators_short: "Радиоизотопные генераторы"
 radioisotope_generators_desc: "Ядерная батарея, превращающая распад радиоактивного вещества в электричество. Может использоваться как эффективный и экономичный источник энергии для спутников или космических зондов."
 solar_panels: "Солнечные панели"
 solar_panels_desc: "Это преобразование света (от солнца) в электричество с помощью полупроводниковых материалов. Для космических аппаратов и спутников, эта экономичная технология может запускать датчики, телеметрию и может выступать в качестве двигателя."
 tracking_solar_panels: "Отслеживающие солнечные панели"
 tracking_solar_panels_short: "Отслеживающие панели"
 tracking_solar_panels_desc: "Позволяет солнечным панелям отслеживать движение солнца, увеличивая количество производимой энергии. Обеспечивает более эффективное использование солнечной энергии на космических кораблях."
 lithium_batteries: "Космические литий-ионные аккумуляторы"
 lithium_batteries_short: "Литий-ионные батареи"
 lithium_batteries_desc: "Более совершенная перезаряжаемая батарея, которая может более эффективно питать портативную электронику и небольшие электрические машины, используемые для космических миссий. Способен работать в экстремальных условиях."
 methane_fuel_cells: "Метановые топливные элементы высокой плотности"
 methane_fuel_cells_short: "Метановые элементы"
 methane_fuel_cells_desc: "Модернизация водородных топливных элементов, метановые топливные элементы преобразуют энергию непосредственно из метана, не превращая ее сначала в водород. Это значительно увеличивает количество энергии, вырабатываемой для питания спутников или космических капсул."
  
 # Data Transmission 
 directional_antenna: "Направленная антенна"
 directional_antenna_desc: "Антенна, которая излучает или принимает сигнал в определенном направлении и снижает помехи от других источников. Они имеют решающее значение для зондов дальнего космоса и наземных радиоантенн."
 sstv_transmission: "Передача изображения"
 sstv_transmission_desc: "Метод ранней передачи изображений с использованием радио для передачи или приема статических изображений. Очень важно чтобы космические корабли могли передавать изображения с космических аппаратов, чтобы передавать изображения на Землю."
 geosynchronous_network: "Сеть геосинхронной релейной связи"
 geosynchronous_network_short: "Геосинхронная сеть"
 geosynchronous_network_desc: "Сеть связи, которая взаимодействует через геосинхронные спутники или с ними. Эти спутники вращаются с той же скоростью, что и Земля. Сеть легко отслеживать с поверхности, что сокращает расходы, и у них есть возможности для глобальных телевизионных трансляций, сбора разведданных и прогнозов погоды."
 broadband_internet: "Космический широкополосный интернет"
 broadband_internet_short: "Широкополосный интернет"
 broadband_internet_desc: "Широкополосная передача данных способна передавать одновременно несколько сигналов и типов трафика. Это обеспечивает быструю связь между несколькими пользователями, более высокое качество и большую пропускную способность данных."
 laser_communications: "Лазерная космическая связь"
 laser_communications_short: "Лазерная связь"
 laser_communications_desc: "Обеспечивает оптическую связь используя свет в космосе для передачи данных между спутниками и с земли в космос. Это обеспечивает беспроводную связь и передачу больших объемов данных через многие тысячи километров."
