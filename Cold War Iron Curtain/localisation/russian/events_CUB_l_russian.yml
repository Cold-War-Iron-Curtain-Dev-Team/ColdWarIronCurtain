l_english:
 cuba.2.t: "Американо-Кубинское Соглашение о Защите"
 cuba.2.d: "После Второй мировой войны страны пытаются выбрать сторону между коммунистами и капиталистами. Куба решила искать защиты у Соединенных Штатов Америки."
 cuba.2.a: "Америка защитит нас от коммунистов"
 cuba.3.t: "Генерал Батиста возвращается к власти на Кубе!"
 cuba.3.d: "Фульхенсио Батиста ранее уже был у власти на Кубе. На этот раз он участвовал в президентских выборах, но, понимая, что у него нет шансов победить на них, при поддержке армии устроил переворот и вновь захватил власть на Кубе."
 cuba.3.a: "Батиста это наш ключ к спасению."
 cuba.4.t: "Коммунистическая Революция"
 cuba.4.d: "Было ли это намеренно или нет. Коммунисты захватывают кубинское правительство и устанавливают свой собственный режим. Их лидер - Фидель Кастро, он стал лидером Кубы после тяжелой революции. Его поддерживали его брат Рауль Кастро и их товарищ Че Гевара."
 cuba.4.a: "Фидель - человек из народа."
 cuba.5.t: "Формирование Карибский Союза"
 cuba.5.d: "Быть членом НАТО слишком рискованно. Куба не хочет участвовать в полномасштабной войне, но хочет иметь союзников. Она по-прежнему будет поддерживать тесные отношения с США, но будет держать с ними некоторую дистанцию."
 cuba.5.a: "Сформировать Союз"
 cuba.6.t: "Присоединение в НАТО"
 cuba.6.d: "Война неизбежна, верно? Присоединение к Американцам означает, что мы сможем быстрее уничтожить коммунистов."
 cuba.6.a: "Вступить в НАТО"
 cuba.7.t: "Присоединение в ОВД"
 cuba.7.d: "Война неизбежна, верно? Присоединение к Советам будет означать, что мы сможем быстрее уничтожить грязных капиталистов."
 cuba.7.a: "Присоединиться в ОВД"
 cuba.8.t: "Испанский Альянс"
 cuba.8.d: "Кубинцы этнически и культурно являются испанцами, и пришло время показать нашу лояльность Испании и сформировать с ней альянс."
 cuba.8.a: "Сформировать Альянс!"
 cuba.9.t: "Советско-Кубинское соглашение о защите"
 cuba.9.d: "После Второй мировой войны страны пытаются выбрать сторону между коммунистами и капиталистами. Куба решила искать защиты у Советов."
 cuba.9.a: "Россия защитит нас от капиталистических свиней."
 cuba.10.t: "Запрет Выборов"
 cuba.10.d: "Фульхенсио Батиста настолько отчаянно пытался сохранить за собой роль лидера, что запретил проведение публичных выборов."
 cuba.10.a: "Ну... это явно не к счастью."
 cuba.11.t: "Кубинский Ракетный Кризис"
 cuba.11.d: "16 октября 1962 года Советский Союз разместил свои ракеты на берегу Кубы. Напряженность усилилась из-за ракеты в Турции, которая имела общую границу с Советским Союзом. Обе сверхдержавы в настоящее время разрешают этот кризис, но сейчас кажется, что ядерный взрыв завершит этот кризис."
 cuba.11.a: "О-о-о..."
 cuba.12.t: "Торговое Эмбарго"
 cuba.12.d: "Чтобы максимально подавить Кубу и ее экономику, США ввели торговый запрет, эмбарго, на все кубинские товары, а также попытались ввести тарифы на другие страны, торгующие с Кубой."
 cuba.12.a: "Вы, должно быть, шутите"
 cuba.13.t: "Приглашение стран с Кариб"
 cuba.13.d: "Пытаясь расширить свой союз, Куба приглашает Доминиканскую Республику, а также Гаити."
 cuba.13.a: "Будем надеяться, что они согласятся"
 cuba.14.t: "Приглашение стран с Материка"
 cuba.14.d: "Пытаясь расширить союз, Куба приглашает страны Центральной Америки."
 cuba.14.a: "Будем надеяться, что они примут"
 cuba.15.t: "Ограничение Ком-Партии"
 cuba.15.d: "Коммунистическая партия растет. Батиста пытается уничтожить их, ограничивая их, но это только завоевывает их поддержку."
 cuba.15.a: "Смерть коммунистам"
 cuba.16.t: "Антиимпериалистическая Пропаганда"
 cuba.16.d: "Мы не можем позволить странам эксплуатировать наших товарищей. Мы должны показать людям, как на самом деле выглядит колониализм."
 cuba.16.a: "Смерть империалистическим Свиньям"
 cuba.17.t: "Поддержка восстания в Конго"
 cuba.17.d: "Мы должны освободить наших товарищей в Конго. Они должны разорвать цепи империализма!"
 cuba.17.a: "Освободить Конго"
 cuba.18.t: "Поддержка восстания в Конго"
 cuba.18.d: "Мы должны освободить наших товарищей в Конго. Они должны разорвать цепи империализма!"
 cuba.18.a: "Освободить Конго"
 cuba.19.t: "Порабощение Кариб"
 cuba.19.d: "Мы должны распространить наше демократическое влияние на весь Карибский бассейн."
 cuba.19.a: "Да... больше власти"
 cuba.20.t: "Восстановление после Сахарного Кризиса"
 cuba.20.d: "Наша страна находится в кризисе. Мы нанесли ущерб нашей экономике, экспортируя слишком много сахара."
 cuba.20.a: "Ну и Ладно"
 cuba.21.t: "Поддержка Греческого Восстания"
 cuba.21.d: "Греция испытывает большие трудности, так как их страна разделена идеологически. Коммунисты начали революцию против фашистского правительства, поддерживаемого США."
 cuba.21.a: "Смерть Коммунистам!"
 cuba.22.t: "Расширение Промышленности на Материк"
 cuba.22.d: "Пришло время расширить нашу промышленность и влияние за пределы нашего острова и на земли Америки."
 cuba.22.a: "Мы должны расширяться!"
 cuba.23.t: "Кубино-Американский пакт"
 cuba.23.d: "Куба решила заключить соглашение. США отдадут территорию Пуэрто-Рико в обмен на оборудование и ресурсы."
 cuba.23.a: "Мы должны расширяться!"
 cuba.24.t: "Пой Революция!"
 cuba.24.d: "Че Гевара, ведущий военный эксперт кубинской революции поддержал революцию в Боливии. Кубинское правительство решило послать помощь коммунистам."
 cuba.24.a: "Поддержать Коммунистов"
 cuba.1000.t: "Запрос тюрьмы Гуантанамо"
 cuba.1000.d: "Прошло слишком много времени с тех пор, как Куба была полностью воссоединена, как по духу, так и по Родине. Это должно стать одним из величайших достижений Кубы в прошлом веке."
 cuba.1000.a: "Да, Пожалуйста!"
 cuba.1000.b: "США должны оставаться рядом."
 cuba.1001.t: "Восстание Посадасов"
 cuba.1001.d: "Мы получили сообщения о попытке переворота, предпринятой троцкистской Партидо Обреро Революсьонарио во главе с Хуаном Посадасом. Состоящие из нескольких сотен рабочих, они готовы атаковать Гавану и захватить власть. К несчастью для них, наша превосходящая армия готова подавить их попытку и сделать так, чтобы они не вернулись."
 cuba.1001.a: "Раздавим Их Как Мух!"
 cuba.1001.b: "Ядерные Космические Дельфины? Я в предвкушении."
 cuba.3000.t: "Битва за Горный Хребет Сьерра"
 cuba.3000.d: "Это наша последняя борьба, которая решит судьбу Кубы и ее народа. Все в руках одной руки и одного человека."
 cuba.3000.a: "Второй День Освобождения"
 cuba.3000.b: "Великая Победа Батисты"
 cuba.3001.t: "Кубинский Диктатор Бежит из Страны"
 cuba.3001.d: "Президент Кубы Фульхенсио Батиста, который два дня назад угрожал выйти на поле боя, чтобы поднять боевой дух своих людей, накануне передумал и отрекся от престола. Оставив кубинскую хунту в беспорядке, он заказал билет на рейс в Доминиканскую Республику."
 cuba.3001.a: "Трус"
 cuba.3002.t: "Успешная Революция"
 cuba.3002.d: "Победа в наших руках, сегодняшний день будет известен как 2-е Великое освобождение Кубы от империализма!"
 cuba.3002.a: "Интересное развитие..."
 cuba.3004.t: "Гаванские достопримечательности"
 cuba.3004.d: "Странные огни были замечены в соседней Гаване, жители близлежащих городов уже сгруппировались возле этого района, чтобы осмотреть это странное зрелище."
 cuba.3004.a: "Это просто Американский Самолет!"
 cuba.3004.b: "Может быть, это что-то другое..."
 cuba.3005.t: "Временное Кубинское Правительство"
 cuba.3005.d: "Чтобы стабилизировать Кубу, необходимо установить меры между демократическими идеалами и Временным правительством."
 cuba.3005.a: "Удар под дых Капиталистическим Свиньям"
 cuba.3006.t: "Памятная Ночь"
 cuba.3006.d: "Настоящая демократия недостижима без того, чтобы вместе с ней не были принесены в жертву границы общества. Мир может быть не готов к этому, но Куба будет с нашими товарищами дельфинами."
 cuba.3006.a: "Viva Posadas"
 cuba.3010.t: "Консолидация Власти"
 cuba.3010.d: "Сегодня над занавесками Карибского моря опустилась тьма, Фульхенсио Батиста получил президентские полномочия."
 cuba.3010.a: "Относительно"
 cuba.3011.t: "Слухи в Вооруженных Силах"
 cuba.3011.d: "После гибели революции Соединенным Штатам Америки, возможно, придется перестроить Кубу, чтобы та стала больше и сильнее."
 cuba.3012.t: "Антибатистский Переворот, Поддержанный Американцами"
 cuba.3012.d: "Режиму Батисты наконец-то пришел конец, Куба в течение нескольких лет может находиться под контролем американцев, однако она будет жить в обществе, свободном от коммунизма и радикальных идеалов."
 bay_of_pigs.1.t: "«Залив Свиней»"
 bay_of_pigs.1.d: "Куба, порог под американским прицелом, была брошена в затруднительное положение как социалистами, так и радикальными реакционерами. Это наш долг со времен испано-американской войны - защищать Карибы и Америку."
 bay_of_pigs.1.a: "Ведется Осада..."
 bay_of_pigs.3.t: "[GetNewspaperHeader]Возникший Хаос"
 bay_of_pigs.3.d: "Влияние Америки на кубинскую политику радикально изменило страну для многих целей. Независимо от того, возобладает ли социализм или радикальные реакционеры возьмут в свои руки славную Кубу, оба вида революции все равно достигнут своих целей."
 bay_of_pigs.4.t: "[GetNewspaperHeader]Куба в Руинах"
 bay_of_pigs.4.d: "Пока Кубинцы-Американцы сражаются на берегу залива, кубинцы оплакивают смерть членов семьи, сражающихся против своих социалистических угнетателей. Многие взяли в руки оружие против леворадикальной угрозы. Кубинцы повсюду выражают различные мнения о катастрофе, происходящей на Кубе, но в зависимости от результата Куба будет идти по пути свободы или Индоктринации."
 Cubatourism.1: "Благодаря своему расположению Куба уже давно является популярным местом отдыха для туристов, принимая в начале 20-го века больше туристов, чем любое другое место в Карибском бассейне. Хотя эта бурно развивающаяся индустрия была сильно подорвана Великой депрессией и Второй Мировой, туризм на маленьком острове снова процветает, поскольку люди приезжают сюда, чтобы снять стресс и насладиться безмятежностью острова. Однако не все спокойно на острове, поскольку за кулисами нарастает социальная напряженность, а коренное население острова становится все более недовольным все более коррумпированным и авторитарным правительством."
 CubaRepression.2: "Кубинское правительство раздумывает, пригласить ли Меера Лански в Гавану. Лански - печально известная фигура, имеющая тесные связи с американской мафией. За последние несколько десятилетий он играл важную роль в руководстве деятельностью мафии в Гаване, принося миллионные инвестиции. Кубинское правительство надеется, что, пригласив его, они смогут договориться о прибыльных отелях и казино, а также о большом притоке денежных инвестиций. Кубинское правительство может сделать Лански предложение, которое гарантирует прибыль в обмен на выплаты правительству, чтобы обеспечить Кубе значительный запас наличных на случай чрезвычайной ситуации. Заключение такой сделки обеспечит большую потенциальную прибыль и развитие, но риск присутствия крупной организованной преступности из Америки оттолкнет кубинцев и, возможно, правительство Соединенных Штатов. Кроме того, необходимо учитывать влияние этих инвесторов на кубинскую политику, поскольку, почувствовав угрозу, мафия может прибегнуть к подкупу или насилию в отношении кубинских чиновников, что может только подогреть оппозицию к правительству."
 CubaRepression.4.d: "В погоне за созданием самого большого казино за пределами Лас-Вегаса американский бизнесмен по имени Меер Лански заказал строительство грандиозного казино в нашей столице Гаване! В нем запланированы сотни комнат, и каждая из них даже будет оснащена кондиционером! Это, несомненно, привлечет больше туристов и поможет сделать Кубу домом для каждого приезжего. Пусть Ривьера Карибского моря Сияет!"
 CubaRepression.5: "Президент Фульхенсио Батиста и его Партия Прогрессивных Действий победили на выборах 1954 года на Кубе. Батиста объединил три кубинские партии, и во время избирательной кампании многие оппозиционные кандидаты выбыли из гонки. Лидеры оппозиции, включая бывших президентов, утверждали, что их сторонники подвергались террору со стороны режима Батисты. Некоторые партии приняли участие в выборах в обмен на гарантии режима Батисты, но большинство оппозиционных партий бойкотировали результаты выборов. В выборах приняли участие менее пятидесяти процентов избирателей, что говорит о том, что бойкот был эффективным. Выборы были призваны узаконить Батисту после его возвращения к власти в результате военного переворота, но, похоже, это не удалось. Результаты выборов заставили тех, кто выступал против Батисты, но не поддерживал революционеров, ведущих вооруженное сопротивление с гор, теперь начать больше симпатизировать революционным повстанцам. Выборы не смогли узаконить его режим, и теперь даже нейтральные кубинцы считают режим Батисты скорее диктатурой."
 CubaRepression.6: "Президент Кубы Фульхенсио Батиста сорвал попытку переворота, предпринятыю сотнями военных во главе с полковником Рамоном Баркином. Полковник Баркин, профессиональный офицер, как говорят, был расстроен тем, что Батиста превратил Кубу из демократического государства в диктаторское. Он убедил ряд офицеров-единомышленников присоединиться к его делу, но не смог свергнуть Батисту. Президент Батиста смог заручиться поддержкой рядового состава, но явная поддержка Батисты со стороны США убедила многих не присоединяться к перевороту. Полковник Баркин был схвачен и в настоящее время ожидает военного трибунала вместе со своими соучастниками. Хотя президент Батиста выжил, его офицерский корпус, особенно профессиональные офицеры, подверглись чистке, и есть опасения, что Антибатистские повстанческие силы могут воспользоваться ситуацией. Эта попытка свидетельствует о том, что по мере укрепления своего контроля Батиста все чаще подталкивает свою оппозицию к более драматическим действиям. Хотя переворот и сорван, многие задержаны, ожидается, что президент Батиста расширит чистку армии и выкорчует профессиональных офицеров, которые могут разделять взгляды полковника Баркина."
 CubaRepression.7: "Президент Кубы Фульхенсио Батиста объявил, что он приостанавливает действие кубинской конституции 1940 года. Президент Батиста сделал этот шаг, чтобы укрепить свое правление, и, приостановив действие конституции, он положил конец многим ее прогрессивным гарантиям. Это позволит его режиму более свободно подавлять все более активную оппозицию. Кроме того, элитные кубинские землевладельцы и бизнесмены приветствуют прекращение действия некоторых прав для рабочих, которые, как они долгое время утверждали, перекрывали им воздух. Однако, хотя Батиста может привлечь больше поддержки элиты, крестьяне и рабочие, как говорят, очень недовольны и боятся ограничения своих прав. Кроме того, это действие еще больше усиливает аргументы противников Батисты, которые указывают, что это действие доказывает их убеждение, что военный переворот, вернувший Батисту к власти, произошел только для удовлетворения его собственных политических целей. Многие теперь согласны с тем, что переворот был совершен не для спасения страны, а для того, чтобы спасти Батисту от политического поражения на предстоящих выборах."
 CubaSterling.2.d: "Президент Стерлинг продолжил свои усилия по разрешению кризиса на Кубе, объявив о новой крупной политике. Он предложил кубинским революционным повстанцам, многие из которых действуют в горах, всеобщую амнистию. Все повстанцы, желающие прекратить конфликт, могут прийти на любой правительственный полицейский или военный пост, сдать оружие, пообещать не поднимать мятеж в будущем, а затем вернуться домой. Президент Стерлинг надеется, что массовая амнистия ослабит решимость и сократит ряды повстанцев, предложив тем, кто уже не так предан своему делу, возможность уйти, не опасаясь возмездия правительства. Эта акция также продемонстрирует готовность президента Стерлинга к разумному взаимодействию со всеми сторонами. Конечно, есть элементы, особенно среди более ярых антикоммунистов в правительственном лагере, которые не являются поклонниками амнистии и опасаются, что повстанцы могут просто распространиться по Кубе или просто вернуться к войне после того, как решат проблемы у себя дома. Тем не менее, в Гаване ощущается оптимизм в связи с этим новым подходом."
 CubaAguero.1.d: "Президент Кубы Андрес Агуэро официально попросил Соединенные Штаты вмешаться и положить конец продолжающимся беспорядкам, охватившим островное государство. Кубинские революционеры, действующие в горах вместе со своими сторонниками в городах, ведут жестокое наступление на кубинское правительство. Президент Агуэро обратился с данной просьбой к послу США в Гаване и добавил, что если американцы не вмешаются, его страна станет уязвимой для радикальных коммунистов, возглавляющих беспорядки. Президент добавил, что помимо идеологической угрозы, которую представляют собой повстанцы, Куба уже давно является излюбленным местом для американских приезжих, а также американских инвестиций. Падение кубинской демократической системы может привести к тому, что многие американцы потеряют бизнес и инвестиции. Президент Агуэро надеется, что Соединенные Штаты будут убеждены, и его осажденное правительство сможет воспользоваться поддержкой своего могущественного северного соседа, чтобы переломить ход событий в борьбе с революционными силами, которые, похоже, растут почти ежедневно."
 CubaSterling.1.d: "Посол США на Кубе прибыл в Белый дом с важным посланием от президента Стерлинга, лидера Кубы. Президент Стерлинг срочно передал в письме для президента свою потребность в том, чтобы Соединенные Штаты выступили в качестве посредника для разрешения текущих политических волнений, охвативших его страну. Многие кубинцы разочаровались в несовершенной демократической системе, которая, как представляется, расширяет возможности элиты Кубы за счет трудового блока. Кроме того, представители элиты, включая иностранных инвесторов, как говорят, разочарованы президентской политической платформой Стерлинга. Президент Стерлинг сталкивается с угрозой как со стороны революционеров, выступающих за изменение правительственной системы, так и со стороны военных или политиков, опасающихся, что военный или политический переворот сместит его и еще больше подтолкнет Кубу на путь диктатуры. Он надеется, что если Соединенные Штаты согласятся выступить в качестве посредника, он сможет вести переговоры и решать стоящие перед Кубой проблемы с позиции силы и легитимности."
 CubaRepression.10.d: "Поскольку ситуация с безопасностью ухудшается с каждым днем, кубинское правительство объявило, что отложит предстоящие выборы. В последние недели революционные повстанцы призвали к всеобщей забастовке, активизировали нападения и провели кампанию бомбардировок городов, чтобы попытаться предотвратить выборы. Президент Батиста решил отложить выборы, но пообещал, что они состоятся, так как Куба не будет подвергаться шантажу со стороны коммунистических головорезов. Решение отложить выборы привело к еще большему разочарованию режимом Батисты, так как многие кубинцы теперь все больше считают, что демократическая система полностью превратилась в диктатуру. Повстанцы, как говорят, также рады тому, что их способность взывать к борьбе городское население и широкую общественность возросла до такого масштаба. Кубинские военные, как говорят, активизируют свои собственные операции, чтобы не допустить дальнейшей отсрочки выборов, поскольку выборы нужны режиму Батисты, чтобы доказать свои конституционные полномочия населению, которое все больше скептически относится к тому, есть ли на Кубе вообще конституционный закон."
 M267_insurgency_options.1.d: "Один из наших специальных внутренних агентов успешно внедрился в M267, и информационный прирост невероятен. Мы получили беспрецедентное количество данных и сеть конфиденциальных информаторов, которые помогут нам в борьбе с кубинскими повстанцами. Наша сеть уже обнаружила бесчисленные склады снабжения и способна ликвидировать бесчисленные операции, серьезно ослабив способность M267 нанести ущерб нашей стране.\nЭтот успех будет иметь глубокие положительные последствия и защитит нашу нацию."
 M267_insurgency_options.2.d: "После провала попытки нашего специального внутреннего агента проникнуть в M267, Они исправили несколько уязвимых мест в своих операциях, улучшили процесс проверки и стали более устойчивыми в целом. Кроме того, хотя наш агент сопротивлялся допросу, они смогли узнать больше о нас из его действий и в ближайшие дни могут попытаться использовать эти методы против целей более низкого уровня, таких как полицейские участки и гарнизоны.\nЭта неудача является пятном на нашем послужном списке и будет иметь заметные последствия..."
 M267_insurgency_options.3.d: "Жесткое подавление операций M267 привело к поразительному успеху. Наши войска были более чем готовы к борьбе с врагом и застали его врасплох. Мы изъяли бесчисленное количество взрывчатки, оборудования и убили многих оперативников M267. Кроме того, в результате рейда мы получили большое количество разведданных, так как они не смогли уничтожить их вовремя.\nЭтот успех ослабит их будущие операции и снизит их свирепость."
 M267_insurgency_options.4.d: "M267 знали, что мы придем. Они либо эвакуировались со своих объектов, оставив там ловушки, которые должны были взорваться, когда полиция проникнет внутрь, либо организовали засады против нашей полиции. Это не только привело к серьезному поражению, но противник даже организовывал контратаки на наши полицейские участки и проводил оппортунистические атаки с захватом снабжения, пока наши офицеры были заняты или погибали. Теперь M267 гораздо лучше вооружен и способен к будущим атакам в этом районе. На данный момент мы послали подкрепление полиции из соседних районов и даже назначили солдат в патрули, чтобы поддержать ослабленные правительственные силы.\nЭта неудача ослабит наши попытки бороться с ними в этом районе и, вероятно, усилит их свирепость."
 M267_insurgency_options.5.d: "После нескольких разведок и бесчисленных часов подготовки, мы, наконец, начали наносить удары по удаленным объектам M267. От абрикосовых ферм до современных домов на берегу моря, объекты их ополчения были значительно ослаблены. Наши удары сравняли с землей тренировочные базы, нанесли оппортунистические удары по конвоям снабжения, уничтожили плацдармы и в целом вывели из строя удаленные базы. M267 теперь намного слабее, и отсутствие этих удаленных объектов отключит их сеть ячеек, действующих между городами.\nВраг теперь будет менее способен совершать атаки и будет менее агрессивным в будущем."
 M267_insurgency_options.6.d: "Мало того, что наша разведка была неверной, мало того, что мы уничтожили бесчисленное количество объектов, не являющихся целями, так мы еще каким-то образом умудрились уничтожить некоторые из активов нашей собственной страны. Охранные посты и поезда снабжения нашей собственной армии были разрушены в результате неверной диверсии. По словам нашего директора разведки, враг снабжал наших конфиденциальных информаторов дезинформацией. В будущем нам, возможно, придется лучше координировать свои действия с армией, чтобы в случае неудачи не возник дружественный огонь.\nЭта неудача ослабит способность армии бороться с повстанцами и предотвращать нападения, делая их более агрессивными."
 Cuban_Revolution.1.d: "Фидель Кастро и его революционные повстанцы недавно начали серию атак против режима Фульхенсио Батисты. Правительственные войска, защищавшие режим, оказались практически неэффективными, поскольку повстанцы одержали победу над ними. Многие называют коррупцию режима Батисты, продвижение политических офицеров над профессиональными и популярность повстанцев причинами, по которым кубинские военные не в состоянии остановить повстанцев. Батиста, бывший кубинский вождь, который доминировал в кубинской политике с конца 1930-х годов, бежал из страны вместе со своей семьей на следующий день, за ним последовали многие его ближайшие советники, старшие министры и чиновники. Они забрали с собой огромное состояние, исчисляемое сотнями миллионов, награбленное у правительства или собранное за годы пребывания у власти. По мере распространения новостей, повстанцы больше не сталкиваются с военным сопротивлением, и жители Гаваны ожидают прибытия Кастро и его повстанцев. На улицах Гаваны уже вспыхнули большие вечеринки, так как многие кубинцы празднуют конец Батисты."
 Cuban_Revolution.10.d: "В горах Сьерра-Маэстра на Кубе последние остатки кубинской революционной группы под названием «Движение 26 июля» уничтожаются или сдаются кубинским военным. Повстанцы начали свое вооруженное восстание против режима Фульхенсио Батисты, поскольку считали, что с его коррупцией и господством над кубинской демократической системой можно покончить только путем вооруженного сопротивления. Группу возглавлял Фидель Кастро и другие молодые люди, которые считали революцию единственным путем прогресса Кубы и прекращения постоянной нестабильности, которая преследовала Кубу с момента обретения независимости. Однако, в конечном итоге, группа не смогла сместить Батисту или заручиться достаточной национальной поддержкой, чтобы угрожать его режиму. Батиста успешно объединил свои силы против повстанцев и, наконец, сумел сломить их. Эта победа пробудила Батисту, который теперь считает свой режим надежным, и многие кубинцы опасаются, что вскоре он может просто открыто заменить демократический режим на свою диктатуру. Время покажет, закончится ли революционный пыл, развязанный «Движением 26 июля», с его поражением или же он теперь станет постоянной чертой кубинской политической жизни."