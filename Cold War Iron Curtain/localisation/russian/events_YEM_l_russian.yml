  #Yemen 1950s Events 
 MagicCarpet.1.d: "Газеты по всему миру опубликовали информацию об операции "Волшебный капет", которая привела к успешной эвакуации еврейской общины из Йемена в Израиль. В 1949 году имам Йемена согласился отпустить свою еврейскую общину с условием, что их имущество будет конфисковано. С этим одобрением израильское, американское и британское правительства направили в Аден транспортные самолеты. В течение следующего года в Израиль были доставлены 49 000 йеменских, 1500 аденских и 2000 саудовских евреев. Это представляло практически всю еврейскую общину региона и стало большим достижением для израильского государства, поскольку оно спасло еврейскую общину, находящуюся в опасности. После появления Израиля в 1947 году еврейская община в Йемене страдала от массовых беспорядков и грабежей. Кроме того, имам Йемена ввел политику высоких налогов и жесткую экономическую политику по отношению к еврейской общине. Многие в Израиле теперь считают, что долг государства-защищать все еврейские общины и предоставлять убежище, когда это необходимо."
 Yem.14.d: "Имам Йемена Ахмед бин Яхья публично назначил своего старшего сына, принца Мухаммада аль-Бадра, наследным принцем. Решение имама Ахмеда вызвало гнев многих в правительстве, особенно среди братьев имама. Они считают, что один из них заслуживает унаследовать титул, а принц аль-Бадр слишком младший, чтобы стать наследным принцем. Кроме того, считается, что молодой принц аль-Бадр симпатизирует арабской националистической риторике, и ожидается, что он будет использовать свое положение для дальнейшего вовлечения Йемена в арабский мир. Традиционалистские йеменские чиновники и королевские особы, как говорят, обеспокоены взглядами принца и надеются, что он поймет, что арабский национализм представляет опасность для монархии и ее многовекового авторитета как политического и религиозного института. Принц аль-Бадр, как говорят, считает, что его интерес к арабским националистам обеспечит более светлое будущее для Йемена, и он сможет контролировать такие силы внутри страны."
 Yem.13.d: "Мохаммад аль-Бадр сегодня перешел от наследного принца к имаму Йемена после успешного переворота против своего отца. Переворот развернулся после того, как имам Ахмад бин Яхья, отец аль-Бадра, отправился в Италию, чтобы пройти несколько месяцев лечения. Слухи о его здоровье подпитывали спекуляции, и принц аль-Бадр использовал свое положение регента для проведения радикальных реформ в стране, включая создание парламентского комитета. Следуя советам арабских националистических офицеров и чиновников, принц аль-Бадр также пригласил египетских экспертов для модернизации йеменской государственной, военной и экономической деятельности. Несколько крупных племен восстали против такого поворота событий, что привело к открытому конфликту. Возвращение имама Ахмада едва не повернуло ход событий против аль-Бадра, но молодой принц сумел удержаться и разбил племена, пытавшиеся восстановить своего отца. Теперь, когда его правление было обеспечено, Мохаммад аль-Бадр наконец короновал себя, и традиционное руководство в Йемене опасается, что революционные силы, выпущенные на свободу, вскоре поглотят всю нацию. Для имама аль-Бадра его реформы и принятие на себя руководства означают непрерывный прогресс Йемена к модернизации и возрождению йеменского народа."
 Yem.10.d: "Йеменское правительство объявило, что оно аннулировало Договор о дружбе и торговле, заключенный им с Советским Союзом. Первоначальный договор установил зарождающиеся торговые связи и взаимное признание обеих стран, но недавние усилия по возобновлению договора и расширению дипломатических контактов теперь закончились. Многие считают, что это решение знаменует собой явную победу традиционалистов и племенных элит в Йемене над реформистами и арабскими националистическими фракциями в правительстве. Традиционалисты считали, что усиление влияния левых идей и революционных идеологий грозит трансформацией и распадом йеменского общества. Однако эта неудача может побудить реформистов искать альтернативные методы утверждения своей повестки дня, в том числе путем восстания или общественных беспорядков. Однако йеменское правительство, как говорят, уверено, что такой результат крайне маловероятен, и если возникнут какие-либо беспорядки, правительство позаботится о ситуации. Говорят, что арабские националистические партии и государства во всех регионах рассматривают свои варианты оказания помощи своим союзникам в Йемене."
 Yem.12.d: "Абдулла Яхья Хамид ад-дин, брат недавно свергнутого имама, был официально коронован в Йемене. Имам Абдулла теперь командует йеменским государством при поддержке армии во главе с лейтенантом Дж. Полковник Ахмед аль-Талайя. Переворот произошел после решения Ахмеда бин Яхьи, бывшего имама, назначить наследным принцем своего сына, принца Мухаммеда аль-Бадра. Ведущие либералы и умеренные реформаторы обратились к Ахмеду аль-Талайе с просьбой обеспечить, чтобы аль-Бадр не занял трон. Аль-Талайя и его группа сторонников решили, что Абдулла Яхья будет лучшим кандидатом на пост имама, поскольку он был более авторитетным и менее непредсказуемым, чем принц аль-Бадр. В день переворота войска аль-Талайи окружили королевский дворец в Таизе, требуя, чтобы имам Ахмед уступил свой пост брату. Имам Ахмед в конце концов согласился, поскольку контратака не состоялась. После коронации имам Абдулла принял клятвы верности от ведущих племенных вождей, хотя многие до сих пор симпатизируют его предшественнику. Кроме того, есть опасения, что имам Абдулла не сможет сохранить власть над лейтенантом Дж. Полковник аль-Талайя и находящиеся во дворце сторонники принца аль-Бадра по-прежнему представляют серьезную угрозу. Перед имамом Абдуллой стоит трудная и деликатная задача в его усилиях по восстановлению стабильности в своем царстве."
 Yem.20.d: "Имам Ахмед бин Яхья заявил о своем желании продолжить поиски своей династии для создания Великого Йемена. Видение состоит в том, чтобы увидеть восстановление Йемена, охватывающего территории государства Расулидов XIII века. Отец имама Ахмеда консолидировал довольно много земель, но был заблокирован британским Аденом и Аденским протекторатом. Кроме того, северная экспансия Йемена была остановлена наступлением Саудовской Аравии в 1920-х годах. Имам Ахмед продолжал амбиции своего отца и открыто призывал к тому, чтобы Великий Йемен стал миссией для всего йеменского народа. Британцы все больше обеспокоены риторикой имама, поскольку незначительные пограничные стычки на спорной йеменско-аденской границе, похоже, усилились. Эти стремления к Великому Йемену помогли укрепить политическое влияние и роль имама, но его действия нанесли ущерб связям с Великобританией и вызвали некоторую тревогу в йеменском правительстве, что чрезмерно усердные офицеры могут попытаться добиться решения с помощью оружия."
 Aden.1.d: "Сегодня в Адене массы демонстрантов вышли на улицы, чтобы потребовать прекращения британского колониального правления в Йемене. Многие считают, что продолжающаяся колониальная оккупация задержала неизбежное объединение йеменского народа. Британские власти остаются твердыми в своей позиции и обвиняют в беспорядках провокации, исходящие из соседнего Йемена, и рост арабских националистических настроений в регионе. Англичане находились в Адене и его окрестностях с 1839 года. Аден предлагает британцам стратегическое присутствие в регионе. Лондон в настоящее время разделен на два лагеря. Один из них утверждает, что сохранение своих владений в регионе поможет укрепить статус Великобритании как мировой державы и регионального участника. Для них протесты являются подтверждением того, что Британия должна остаться, чтобы предотвратить падение региона во враждебное йеменское государство. Однако другой лагерь рассматривает британское присутствие как истощение ограниченных национальных ресурсов и пятно на положении Великобритании в регионе. Они, без сомнения, укажут на эти протесты как на еще одно доказательство того, что территория непригодна. Несмотря на это, протесты подчеркивают растущее волнение в регионе."
 UAS.1.d: "В качестве еще одного крупного успеха для движения панарабизма и арабского национализма Йемен присоединился к Объединенной Арабской Республике (ОАР), чтобы сформировать Объединенные Арабские Государства (ОАС). В отличие от федеративного соглашения ОАР между Египтом и Сирией, ОАС является конфедерацией, и Йемен сохраняет свой суверенитет. В последние годы Йемен обратился за помощью к Египту в качестве противовеса Саудовской Аравии и для того, чтобы бросить вызов британцам в Адене. В Йемене молодые офицеры и чиновники приветствовали новость о том, что Йемен движется к современности. Кроме того, они считают, что Йемен теперь имеет место в более широком арабском мире. Однако более традиционные лидеры чувствуют себя неуютно, поскольку революционный характер ОАР противоречит тому, как лидеры управляли Йеменом на протяжении веков. Что еще более важно, они опасаются, что египтяне и сирийцы могут вскоре наводнить и разрушить йеменский образ жизни. В ОАР новость была хорошо воспринята, но есть и опасения. Примет ли Йемен возможную интеграцию и сможет ли ОАР действительно поддержать объем средств, оборудования и персонала, необходимых для развития Йемена. Вместо того чтобы выделять такие ресурсы так далеко от ОАР, не будут ли эти инвестиции более эффективными внутри страны? Несмотря на эти опасения, ОАР и йеменское руководство непреклонны в том, что ОАС станет маяком развития и роста для арабского мира."
 Yem.5.d: "лейтенант. Полковник Ахмед Яхья Аль-Талайя был одним из тех высокопоставленных йеменских чиновников, которые видели в сыне имама, принце Бадре, опасность для Йемена, если он займет трон. Принц Бадр, как известно, симпатизировал радикальным арабским националистам, и многие считали, что брат имама был бы лучшим наследником. Аль-Талайя вступил в заговор против имама и его наследника. Аль-Талайя, старший командующий армией, возглавил переворот, чтобы восстановить порядок в Йемене. Возглавив группу единомышленников и верных ему солдат, Аль-Талайя окружил королевский дворец в Таизе и, оказавшись у власти, решил не казнить имама Ахмеда, а вместо этого потребовал от него отречения в пользу своего брата. Переворот в конечном счете провалился, так как лоялистские племена во главе с принцем Бадром получили известие о попытке и прибыли, чтобы разогнать ее. Как только имам Ахмед взял власть в свои руки, он немедленно приказал казнить Аль-Талайю и офицеров, которые поддерживали его в Таизе. Lt. Говорили, что полковник Аль-Талайя проявил неповиновение и не раскаялся в своих действиях после быстрого завершения суда и смирился со своей судьбой."
 Yem.6.d: "После неудавшегося переворота против имама Ахмеда йеменский правитель быстро казнил военных офицеров и их лидера в Таизе, где произошла попытка переворота. Вместо этого он решил сослать в Хаджу двух своих братьев, принца Абдаллу и принца Аббаса. Лидеры переворота потребовали от имама Ахмеда отречения в пользу одного из этих двух братьев, и ясно, что оба были вовлечены в заговор. Хотя принц Абдалла и принц Аббас были лишены своих статусов и живут в изгнании, имам Ахмед решил завершить свою чистку. Выяснилось, что из-за их роли в попытке переворота оба бывших высокопоставленных члена королевской семьи были казнены в Хадже. Учитывая более ранние казни в Таизе военных офицеров, участвовавших в перевороте, эти последние казни знаменуют собой окончательные репрессии имама Ахмеда против его врагов. Многие говорят, что казни были проведены, чтобы обеспечить положение принца Бадра, старшего сына имама Ахмеда. Особенно учитывая, что принцы уже потеряли свои титулы и находились под пристальным наблюдением."
 Yem.15.d: "Восстание 1959 года против имама Ахмеда в конечном счете провалилось, поскольку его сыну не хватило политических навыков и убежденности, чтобы захватить власть у своего отца, который проходил лечение в Италии. Слухи о его плохом здоровье подпитывали усилия принца Бадра по реформированию государства в духе арабских националистов и усиливали волнения среди племен. Однако, как только имам Ахмед вернулся, он быстро восстановил контроль над правительством и приказал своим сторонникам сокрушить племена, которые подняли восстание и захватили территории без разрешения. Силы имама Ахмеда успешно восстановили порядок и подавили восстания вокруг своих главных центров восстания-Таиза и Саны. Племена вокруг Таиза были особенно враждебны имаму Ахмеду во время восстания, и в наказание он решил изгнать их лидеров из Таиза. Наказание не только показывает пример того, что ждет врагов Имана, но и защищает королевский дворец в Таизе от будущих заговоров."
 Yem.16.d: "Во время регентства принца Бадра он стремился купить поддержку своим арабским националистическим реформам, предлагая племенным лидерам большую автономию, оружие и наличные деньги. Принц Бадр надеялся, что успокоение племен подорвет основные средства вооруженной силы, доступные тем, кто выступал против его реформ. Кроме того, он стремился использовать некоторые племена для подавления своих противников. Однако многие племена использовали эту свободу, чтобы свести старые счеты и посеять хаос в районах по всей стране, настроив общественное мнение против принца Бадра. Как только имам Ахмед вернулся в Йемен из Италии, реформы были быстро остановлены, а лоялисты жестоко восстановили порядок в Йемене. Для племен, которые взяли наличные деньги у его сына, имам Ахмед послал им пустые мешки, чтобы вернуть деньги и товары, данные. Если племенные вожди подчинятся имаму и вернут то, что они никогда не должны были принять, они будут возвращены на видное место, однако любой племенной лидер, который потерпит неудачу, столкнется с гневом имама. Ожидается, что многие из них выполнят это требование, хотя некоторые племенные лидеры, как говорят, уже отказались, и ожидаемые репрессии имама послужат примером его дальнейшего абсолютного контроля над Йеменом."
 fight_against_the_imperialist1: "Борьба с империалистами"
