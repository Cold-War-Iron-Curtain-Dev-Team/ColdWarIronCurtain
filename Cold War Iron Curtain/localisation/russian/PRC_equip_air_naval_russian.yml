l_english:
 PRC_carrier_hull_2:0 "Киев-класс"
 PRC_carrier_hull_2_short:0 "Киев-класс"
 PRC_carrier_hull_2_desc:0 "Китай приобрел бывшие советские авианосцы класса \"Киев \"\"Минск\" в 1995 году и \"Киев\" в 2000 году. \"Минск\" вместе со своим родственным кораблем \"Новороссийск\" первоначально был продан Южной Корее в 1995 году на слом, но из-за возражений экологов в 1998 году \"Минск\" был перепродан Китаю, чтобы там его разобрать. Киев также был продан Китаю в 2000 году Россией с контрактным требованием о его демонтаже."
 PRC_carrier_hull_3:0 "Тип 001"
 PRC_carrier_hull_3_short:0 "Тип 001"
 PRC_carrier_hull_3_desc:0 "Ляонин-китайский авианосец типа 001. Первый авианосец, введенный в состав надводных сил Военно-морского флота Народно-освободительной армии, первоначально был классифицирован как учебный корабль, предназначенный для того, чтобы позволить военно-морскому флоту экспериментировать, тренироваться и знакомиться с операциями авианосца. Первоначально заложенный в 1985 году для ВМФ СССР как авианесущий крейсер класса \"Кузнецов \"\"Рига\", он был спущен на воду 4 декабря 1988 года и переименован в 1990 году в \"Варяг\"."
 PRC_carrier_hull_4:0 "Тип 002"
 PRC_carrier_hull_4_short:0 "Тип 002"
 PRC_carrier_hull_4_desc:0 "Шаньдун-китайский авианосец первого поколения.Это второй авианосец страны после завершения строительства \"Ляонина\" и первый, построенный внутри страны. \"Шаньдун\" первоначально был обозначен как авианосец типа 001А во время разработки, но был окончательно доработан как тип 002 при вводе в эксплуатацию. Шаньдун, как и его предшественник, использует более простую систему запуска и восстановления \"короткий взлет, но задержанное восстановление\" (STOBAR). Будущие китайские авианосцы, такие как авианосец типа 003, планируется использовать электромагнитную систему запуска самолетов (EMALS), которая позволяет запускать более тяжелые и более совершенные самолеты, такие как Shenyang J-31 или Chengdu J-20."
 PRC_carrier_hull_light_2:0 "Класс Majestic"
 PRC_carrier_hull_light_2_short:0 "Класс Majestic"
 PRC_carrier_hull_light_2_desc:0 "Китай приобрел списанный авианосец Королевского австралийского флота HMAS Melbourne, когда он был продан Китайской Объединенной судостроительной компании для буксировки в Китай и разбит на металлолом. Перед отплытием корабля в Китай \" РАН \"снял с\" Мельбурна \" все электронное оборудование и оружие и приварил рули в неподвижное положение, чтобы его нельзя было снова активировать. Однако ее паровая катапульта, тормозное оборудование и зеркальная посадочная система не были сняты. В то время мало кто из западных экспертов ожидал, что китайское правительство попытается разработать авианосцы в будущем."
 PRC_carrier_hull_light_3:0 "Тип 075"
 PRC_carrier_hull_light_3_short:0 "Тип 075"
 PRC_carrier_hull_light_3_desc:0 "Десантный вертолетный док типа 075 (отчетное название НАТО Десантный вертолет класса \"Юшен\" штурмовой)–это класс китайских десантных штурмовых кораблей, строящихся судостроительной компанией Hudong-Zhonghua. Вертолетный док типа 075-это десантно-штурмовое судно нового поколения, гораздо более крупное, чем аналогичные корабли, ранее построенные для военно-морского флота НОАК. Тип 075 дал бы китайскому военно-морскому флоту возможность запускать различные типы вертолетов для атаки военно-морских судов, сухопутных войск противника или подводных лодок. Корабли также смогут развернуть десантные корабли и войска, а также разместить командование и управление операциями."
 PRC_carrier_hull_light_4:0 "Тип 076"
 PRC_carrier_hull_light_4_short:0 "Тип 076"
 PRC_carrier_hull_light_4_desc:0 "Десантный вертолетный док типа 076 относится к классу китайских десантных десантных кораблей. Тип 076 является более крупным и более способным преемником типа 075. Его часто описывают как беспилотный носитель с основным набором беспилотных летательных аппаратов, возможно, включая конструкцию летающего крыла, аналогичную Hongdu GJ-11. Тип 076, скорее всего, будет иметь полетную палубу во всю длину и возможность управлять самолетами с неподвижным крылом с системой катапульты EMALS и тормозным механизмом. Корабль будет иметь затопляемую колодезную палубу и авиационные подъемники грузоподъемностью 30 тонн."
 PRC_carrier_hull_super_3:0 "Тип 003"
 PRC_carrier_hull_super_3_short:0 "Тип 003"
 PRC_carrier_hull_super_3_desc:0 "Проект перспективного российского многоцелевого тяжелого авианосца. Корабль предназначен для выполнения различных задач в дальней океанской зоне, сможет наносить удары по наземным и морским целям противника с использованием собственного вооружения и авиации воздушно-десантной авиагруппы, кроме того, он сможет обеспечивать ПВО средствами воздушно-десантной ПВО и авиагруппы, обеспечивать боевую устойчивость и ПВО корабельных группировок, а также обеспечивать поддержку десанта."
 PRC_carrier_hull_super_4:0 "Тип 004"
 PRC_carrier_hull_super_4_short:0 "Тип 004"
 PRC_carrier_hull_super_4_desc:0 "Авианосец типа 004 является планируемым авианосцем программы авианосцев Военно-морского флота Народно-освободительной армии. Предполагается, что он станет повторением предыдущего авианосца типа 003 и, как и тип 003, будет иметь интегрированную электрическую двигательную установку, которая позволит работать электромагнитным пусковым катапультам. В отличие от обычного типа 003, Тип 004 будет больше, а также первым китайским авианосцем, оснащенным ядерным морским двигателем, и может генерировать достаточно электроэнергии для питания лазерного оружия и рельсовых пушек, находящихся в настоящее время в стадии разработки."
 PRC_battle_hull_light_0:0 "Чунг Кинг"
 PRC_battle_hull_light_0_short:0 "Чунг Кинг"
 PRC_battle_hull_light_0_desc:0 "Бывший британский легкий крейсер HMS Aurora класса Arethusa, предназначенный для операций в составе эскадры, ближней разведки и противодействия эсминцам. Он был передан в конце 40-х годов ХХ века Китайской Республике, где затонул во время военных действий. Он был поднят Китайской Народной Республикой и в начале 1950-х годов был разработан план реконструкции крейсера с заменой вооружения и оборудования на советские образцы."
 PRC_battle_hull_light_3:0 "Проект 956-EM"
 PRC_battle_hull_light_3_short:0 "Проект 956-EM"
 PRC_battle_hull_light_3_desc:0 "Тип эсминцев третьего поколения, глубокая модернизация эсминцев проекта 956. Эсминцы проекта 956Е были построены на верфи \"Северная Верфь\" по заказу Военно-морских сил Народно-освободительной Армии Китайской Народной Республики."
 PRC_battle_hull_light_4:0 "Тип 055"
 PRC_battle_hull_light_4_short:0 "Тип 055"
 PRC_battle_hull_light_4_desc:0 "Эсминец типа 055 (крейсер класса НАТО/OSD Renhai)-это класс малозаметных управляемых ракетных эсминцев, строящихся для надводных сил Военно-морского флота Народно-освободительной армии Китая. Это многоцелевая конструкция; сочетание датчиков и оружия предполагает главную роль противовоздушной обороны района, с возможностями противолодочной войны, превосходящими предыдущие китайские надводные боевые действия. Основным вооружением являются ракеты, перевозимые в 112 универсальных вертикальных пусковых ячейках (ВЛ); 64 ячейки в носовой части и 48 ячеек в кормовой. Та же модель VLS используется на эсминце типа 052D, который, как полагают, является реализацией стандарта GJB 5860-2006. Скорее всего, используется самый длинный вариант с 9-метровыми ячейками. Ожидается, что тип 055 будет нести ракеты класса \"земля-воздух\" HHQ-9, противокорабельные крылатые ракеты YJ-18, крылатые ракеты наземного базирования CJ-10 и противолодочные торпеды ракетного базирования при поступлении на вооружение. Потенциально более крупные ячейки могут также нести противокорабельные баллистические ракеты."
 PRC_screen_hull_medium_0:0 "Аньшаньский тип"
 PRC_screen_hull_medium_0_short:0 "Аньшаньский тип"
 PRC_screen_hull_medium_0_desc:0 "Тип Аньшань - эсминцы Народно-освободительной армии Китая, представлявшие собой четыре советских эсминца проекта 7, приобретенных китайским правительством у СССР в 1954-55 годах. Корабли стали первыми эсминцами на эффективной службе ВМС НОАК, заложили основу для дальнейшего развития этого типа кораблей в китайском коммунистическом флоте и получили символическое название - \"четыре небесных стража\"."
 PRC_screen_hull_medium_1:0 "Тип 053K"
 PRC_screen_hull_medium_1_short:0 "Тип 053K"
 PRC_screen_hull_medium_1_desc:0 "Фрегаты типа 053 (НАТО Цзянху, Цзянхвей и Цзяндун) составляли костяк китайских фрегатных сил плана с 1977 года до недавнего времени. Все они были получены в результате попытки создать лучший дизайн, чем в 1950-х годах Riga-Classype 065 Chengdu и его модифицированная копия Type 065 jiangnan. Тот же институт № 701 (Ухань) разработал Тип 053К (Конг, что означает “противовоздушная оборона”) как производную от типа 065 по просьбе Адмиралтейства в середине 1960-х годов. Они были специально приспособлены для сопровождения новых эсминцев класса \"Люда\" типа 051."
 PRC_screen_hull_medium_2:0 "Тип 053H2G фрегат"
 PRC_screen_hull_medium_2_short:0 "Тип 053H2G"
 PRC_screen_hull_medium_2_desc:0 "Тип 053H2G (кодовое название НАТО Цзянхвей I) - китайские фрегаты, поступившие на вооружение надводных сил Военно-морского флота Народно-освободительной армии в 1990-х годах. Они были более поздними вариантами семейства фрегатов типа 053 и были первыми многоцелевыми фрегатами ПЛАНА. Только 4 единицы были построены до того, как этот класс был заменен более способным типом 053H3 Цзянхвей II class."
 PRC_screen_hull_medium_3:0 "Тип 053H3 фрегат"
 PRC_screen_hull_medium_3_short:0 "Тип 053H3"
 PRC_screen_hull_medium_3_desc:0 "Тип 053H3 (кодовое название НАТО Цзянхвей II) - китайские фрегаты, поступившие на вооружение надводных сил Военно-морского флота Народно-освободительной армии. Тип 053H2G был немного больше, чем тип 053H2, и оснащен ракетами класса \"земля-воздух\" HQ-61B (SAM). Однако HQ-61 оказался неудовлетворительным, и класс был быстро заменен типом 053H3, который был улучшенным типом 053H2G, оснащенным ЗРК HQ-7. HQ-7 был китайской версией французского R330 Sea Crotale."
 PRC_screen_hull_medium_4:0 "Тип 054 фрегат"
 PRC_screen_hull_medium_4_short:0 "Тип 054"
 PRC_screen_hull_medium_4_desc:0 "Фрегат типа 054 (кодовое название НАТО Jiangkai I)-китайский многоцелевой военный корабль, который был введен в эксплуатацию в составе надводных сил Военно-морского флота Народно-освободительной армии. Тип 054 имеет скрытую конструкцию корпуса с наклонными поверхностями, радиопоглощающими материалами и уменьшенным загромождением надстройки. Основным противокорабельным вооружением были противокорабельные крылатые ракеты YJ-83 морского базирования в двух четырехячеечных пусковых установках. Он сохранил ЗРК HQ-7, улучшенную версию французского Crotale, от предыдущего типа 053H3; У HQ-7 имелась готовая к стрельбе 8-элементная пусковая установка, 16 из которых хранились в автоматическом перезарядчике. Защита на ближней дистанции была улучшена с помощью четырех турелей АК-630 CIWS. Была установлена 100-мм главная пушка, также основанная на французской конструкции."
 PRC_screen_hull_heavy_0:0 "Проект 051"
 PRC_screen_hull_heavy_0_short:0 "Проект 051"
 PRC_screen_hull_heavy_0_desc:0 "Китайские эсминцы проекта 051 (обозначение НАТО - эсминцы класса Luda) стали первым типом боевых кораблей, построенных полностью в Китае. Проект базировался на советских эсминцах проекта 41 и частично проекта 56, но с перевооружением противокорабельными крылатыми ракетами вместо торпед."
 PRC_screen_hull_heavy_1:0 "Проект 051H"
 PRC_screen_hull_heavy_1_short:0 "Проект 051H"
 PRC_screen_hull_heavy_1_desc:0 "Модернизация кораблей проекта 51. При этом артиллерийское вооружение в кормовой части демонтировали, а вместо него установили вертолетную площадку и ангар для двух вертолетов вместе с соответствующим оборудованием и авиационными боеприпасами. Авиагруппа состояла из двух легких вертолетов Z-9, строящихся в Китае по французской лицензии."
 PRC_screen_hull_heavy_2:0 "Тип 052 Luhu-класс"
 PRC_screen_hull_heavy_2_short:0 "Тип 052 Luhu-класс"
 PRC_screen_hull_heavy_2_desc:0 "Тип 052 Luhu-класс-один из первых современных многоцелевых управляемых ракетных эсминцев, построенных Китаем. Китайские военные корабли исторически ограничивали свои операции районом, охватываемым их наземной авиацией, из-за отсутствия обороноспособности флота. Чтобы исправить эту тенденцию, эсминцы Luhu (и меньший фрегат класса Цзянхвей) были оснащены ЗРК HQ-7, что дает им гораздо лучшие возможности ПВО, чем другие предыдущие китайские проекты, хотя они все еще ограничены в пределах визуальной дальности (WVR)."
 PRC_screen_hull_heavy_3:0 "Тип 052C"
 PRC_screen_hull_heavy_3_short:0 "Тип 052C"
 PRC_screen_hull_heavy_3_desc:0 "Эсминец типа 052C (эсминец НАТО/OSD Luyang II-класс) - это класс управляемых ракетных эсминцев в составе надводных сил Военно-морского флота Народно-освободительной армии Китая (ПЛАН). Тип 052C ввел в эксплуатацию как фиксированную активную электронно-сканирующую решетку (AESA) радара, так и вертикально запущенные ракеты класса \"земля-воздух\", что сделало его первым боевым кораблем ПЛАНА с возможностью ПВО района. Основная пушка-100 - мм (4 дюйма) PJ-87. Пушка страдала от заклинивания и, возможно, повлияла на решение принять другое оружие для эсминца типа 052D. Оружие имеет скорострельность 25 выстрелов в минуту. Ближняя оборона обеспечивается двумя семиствольными 30-мм (1,2 дюйма) CIWS типа 730, один из которых установлен перед мостиком, а другой-на крыше ангара. Каждая пушка имеет максимальную скорострельность 4200 выстрелов в минуту."
 PRC_screen_hull_heavy_4:0 "Тип 052D"
 PRC_screen_hull_heavy_4_short:0 "Тип 052D"
 PRC_screen_hull_heavy_4_desc:0 "Эсминец типа 052D (НАТО/OSD Luyang III-класс destroyer) - это класс управляемых ракетных эсминцев в составе надводных сил Военно-морского флота Народно-освободительной армии Китая. Тип 052D является более крупным вариантом типа 052C; Тип 052D использует канистровую, а не револьверную вертикальную пусковую систему (VLS) и имеет плоскую активную электронно-сканирующую решетку (AESA) радара. Новый VLS не ограничивается ракетами класса \"земля-воздух\", что делает тип 052D первым специализированным многоцелевым эсминцем Китая."
 PRC_sub_hull_small_single_0:0 "M-класс"
 PRC_sub_hull_small_single_0_short:0 "подводные лодки класса М"
 PRC_sub_hull_small_single_0_desc:0 "Две подводные лодки ранних серий этого класса, наряду с двумя советскими подводными лодками класса S (S-52 и S-53) и двумя подводными лодками класса \"Щука\" (по лизингу S-121 и S-123), были проданы Китайской Народной Республике в июне 1954 года в качестве основы подводных сил Военно-морского флота Народно-освободительной Армии. Обе подводные лодки класса М и С были проданы Китаю, а еще две серии М-XV этого класса (М-278 и М-279) были проданы Китаю несколькими годами позже. Четыре подлодки класса М, купленные Китаем, были переименованы в National Defense № 21, 22, 23 (ex M-278) и 24 (ex M-279) соответственно."
 PRC_sub_hull_small_single_1:0 "Тип 033"
 PRC_sub_hull_small_single_1_short:0 "Тип 033 “Ухань”"
 PRC_sub_hull_small_single_1_desc:0 "Подводные лодки типа 033 производились в Китае с 1962 по 1984 год. Китайский тип 033 включает в себя некоторые улучшения по сравнению с оригинальной конструкцией 633 (031), включая снижение уровня шума до менее чем 20 дБ. Гидроакустическая система на борту также была обновлена: советский ГАЗ был заменен китайским гидролокатором H/SQ2-262A."
 PRC_sub_hull_small_single_2:0 "Класс кило"
 PRC_sub_hull_small_single_2_short:0 "Класс кило 877 Платус"
 PRC_sub_hull_small_single_2_desc:0 "Проект 877 Платус, относится к классу дизель-электрических ударных подводных лодок."
 PRC_sub_hull_small_single_3:0 "Тип 039"
 PRC_sub_hull_small_single_3_short:0 "Type 039 “Песня”"
 PRC_sub_hull_small_single_3_desc:0 "-класс дизель-электрических подводных лодок Военно-морского флота Народно-освободительной армии. Этот класс является первой дизель-электрической подводной лодкой, полностью разработанной в Китае, а также первой китайской дизель-электрической подводной лодкой, использующей современную каплевидную форму корпуса. Основным оружием для типа 039 является 533-мм торпеда Ю-4 местного производства, пассивная самонаводящаяся 40-узловая (74 км/ч) торпеда на базе САЭТ-50 и примерно сопоставимая с САЭТ-60. Наземные цели могут быть атакованы на расстоянии до 15 км. Торпеды с проводным наведением Ю-6 могут также использоваться для наведения на подводные лодки. "
 PRC_sub_hull_small_single_4:0 "Тип 041"
 PRC_sub_hull_small_single_4_short: "Тип 041 “Юань”"
 PRC_sub_hull_small_single_4_desc:0 "Юань-класс имеет шесть 533-мм (21 дюйм) торпедных аппаратов. Они могут быть использованы для запуска местных торпед, таких как Ю-6, а также торпед российского производства. Предполагается, что он будет оснащен сверхзвуковым YJ-18. Генеральным конструктором системы запуска торпед и ракет является Сунь Чжуо. Считается также, что тип 041 способен запускать противокорабельные ракеты серии YJ-8X (C-80X). Ракета использует инерциальное + терминальное активное радиолокационное наведение. Он несет 165-килограммовую (364 фунта) замедленную полубронебойную осколочно-фугасную боеголовку с максимальной дальностью действия 80-120 км (50-75 миль) и скоростью 0,9 Маха."
 PRC_sub_hull_large_single_0:0 "Тип 03"
 PRC_sub_hull_large_single_0_short:0 "Тип 03 “Виски”"
 PRC_sub_hull_large_single_0_desc:0 "Класс “Виски” (советское обозначение Projekt 613) был одним из тех, которые были предложены Китаю в попытке поддержать этот ПЛАН, прежде чем китайско-советский раскол 1960 года прервал многие дальнейшие передачи и совместные работы. В рамках первоначальной сделки пять из этих подводных лодок должны были быть отправлены в Китай, в то время как запчасти и оборудование, а также советники были отправлены для сборки еще 21. Эти локальные копии назывались “Тип 03”."
 PRC_sub_hull_large_single_1:0 "Тип 035"
 PRC_sub_hull_large_single_1_short:0 "Type 035 “Мин”"
 PRC_sub_hull_large_single_1_desc:0 "Подводные лодки типа \"Мин\", или типа 035 (ES5 в экспортном варианте), которые к началу 2000-х гг. Было построено 23 единицы, по численности они составляют основу группировки подводных лодок с обычными силовыми установками ВМФ Китая и являются дальнейшим развитием советского типа \"Ромео\", разработанного в 1950-х годах."
 PRC_sub_hull_large_single_2:0 "Тип 091"
 PRC_sub_hull_large_single_2_short:0 "Тип 091 “Хан”"
 PRC_sub_hull_large_single_2_desc:0 "Тип 091 (китайское обозначение: 09-I; отчетное название НАТО: Han класс) - атомная ударная подводная лодка первого поколения производства Китая. Это была первая атомная подводная лодка, использованная подводными силами Военно-морского флота Народно-освободительной армии. Они имеют шесть 533-мм (21 дюйм) торпедных аппаратов и несут 20 торпед. В качестве альтернативы они могут нести 36 мин в своих трубах. Он способен стрелять подводными вариантами противокорабельной ракеты С-801, а также целым рядом отечественных и российских торпед или мин."
 PRC_sub_hull_large_single_3:0 "Тип 093"
 PRC_sub_hull_large_single_3_short:0 "Тип 093 “Шан”"
 PRC_sub_hull_large_single_3_desc:0 "Тип 093 (китайское обозначение: 09-III; отчетное название НАТО: Шан класс)-это класс атомных ударных подводных лодок второго поколения, развернутых Военно-морскими подводными силами Народно-освободительной армии Китая. Тип 093 вооружен шестью торпедными аппаратами; сообщается о конфликте относительно того, являются ли они 553-мм (21,8 дюйма) или 650-мм (26 дюймов) трубами. Говорят, что тип 093 вооружен противокорабельными ракетами YJ-12 или YJ-82. Противокорабельные крылатые ракеты также могут быть будущими вариантами."
 PRC_sub_hull_large_single_4:0 "Тип 095"
 PRC_sub_hull_large_single_4_short:0 "Тип 095 “Шуи”"
 PRC_sub_hull_large_single_4_desc:0 "Тип 095 (китайское обозначение: 09-V, отчетное название НАТО: Шуи класс) - класс атомных ударных подводных лодок третьего поколения для Военно-морского флота Народно-освободительной армии Китая (ПЛАН). Предполагалось, что подводные лодки типа 095 имеют существенно уменьшенную акустическую сигнатуру в пределах улучшенного типа корпуса. По сравнению с Типом 093, Тип 095 будет иметь более совершенный ядерный реактор, трубы VLS и большее количество передовых датчиков, таких как новый активный/пассивный фланговый гидролокатор и низкочастотный и высокочастотный буксируемый гидролокатор."
 PRC_sub_hull_large_double_0:0 "Тип 031"
 PRC_sub_hull_large_double_0_short:0 "Тип 031"
 PRC_sub_hull_large_double_0_desc:0 "Китайская подводная лодка Гольф-класса, построенная в Даляне между 1960 и 1966 годами, после получения технических данных от СССР в 1959 году. Китай не закупал БРПЛ, и поэтому тип 6631 был оснащен имитационными системами и в основном использовался для обучения. Первоначально с вымпелом № 1101, впоследствии он был изменен на 200 в 1967 году. Второй блок должен был быть построен и поставлен СССР (вымпел № К-208), но из-за китайско-советского раскола большая часть бортового оборудования не была поставлена, и лодка была использована в качестве образца для реверс-инжиниринга для достройки первого блока, поступившего на вооружение Китая в августе 1966 года."
 PRC_sub_hull_large_double_1:0 "Тип 092"
 PRC_sub_hull_large_double_1_short:0 "Тип 092 “Ксиа”"
 PRC_sub_hull_large_double_1_desc:0 "Подводная лодка типа 092 (китайское обозначение: 09-II; отчетное название НАТО: Ксиа класс) была первой атомной подводной лодкой с баллистическими ракетами (SSBN), развернутой подводными силами Военно-морского флота Народно-освободительной армии, и первой SSBN, спроектированной и построенной в Азии."
 PRC_sub_hull_large_double_2:0 "Тип 094"
 PRC_sub_hull_large_double_2_short:0 "Тип 094 “Джин”"
 PRC_sub_hull_large_double_2_desc:0 "Тип 094 (китайское обозначение: 09-IV; отчетное название НАТО: Джин класс) - это класс подводных лодок с баллистическими ракетами, разработанных Китаем для подводных сил Военно-морского флота Народно-освободительной армии. Тип 094 вооружен 12 БРПЛ JL-2, каждая из которых имеет расчетную дальность полета 7400 км (4600 миль). Каждая ракета несет одну боеголовку. Тип 094 и JL-2-это первый надежный ядерный сдерживающий фактор Китая морского базирования."
 PRC_sub_hull_large_double_3:0 "Тип 096"
 PRC_sub_hull_large_double_3_short:0 "Тип 096 “Тонг”"
 PRC_sub_hull_large_double_3_desc:0 ""