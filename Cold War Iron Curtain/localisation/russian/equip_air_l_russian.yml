 JAP_jet_interceptor_equipment_4:0 "Lockheed F-104A Starfighter"
 JAP_jet_interceptor_equipment_4_short:0 "F-104A Starfighter"
 JAP_jet_interceptor_equipment_5:0 "Mitsubishi F-104J Starfighter"
