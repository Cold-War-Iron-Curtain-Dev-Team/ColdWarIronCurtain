 #PRC_stealth_strategic_bomber_equipment_1_desc:0 "Land-attack cruise missile carrier armed with two missiles, built in the 1990s. No internal bomb bay or defensive armament."
 PRC_stealth_strategic_bomber_equipment_2:0 "Xian H-20"
 PRC_stealth_strategic_bomber_equipment_2_short:0 "H-20"
 PRC_stealth_strategic_bomber_equipment_2_desc:0 "The Xian H-20 is a projected subsonic stealth bomber design of the People's Liberation Army Air Force. It is referred to as a strategic project by the People's Liberation Army. The H-20 will be the first dedicated strategic bomber developed by China."

 #PRC_mach6stratbomber_equipment_1:0 "WU-14"
 #PRC_mach6stratbomber_equipment_1_short:0 "WU-14"
 #PRC_mach6stratbomber_equipment_1_desc:0 "The DF-ZF, designated by Pentagon as the WU-14, is a hypersonic missile delivery vehicle that has been flight-tested by China seven times, on 9 January, 7 August and 2 December 2014; 7 June and 27 November 2015; in April 2016 and twice in November 2017. The system is operational as of 2019."

