 #ATGM
 atgm_equipment_0:0 "Противотанковая Управляемая Ракета I"
 atgm_equipment_0_short:0 "ПТУР I"
 atgm_equipment_0_desc:0 "Ранняя противотанковая управляемая ракета с оптическим наведением на цель."
 atgm_equipment_1:0 "Противотанковая Управляемая Ракета II"
 atgm_equipment_1_short:0 "ПТУР II"
 atgm_equipment_1_desc:0 "Усовершенствованная противотанковая управляемая ракета с оптическим наведением на цель и более крупной боеголовкой."
 atgm_equipment_2:0 "Противотанковая Управляемая Ракета III"
 atgm_equipment_2_short:0 "ПТУР III"
 atgm_equipment_2_desc:0 "Противотанковая управляемая ракета с более совершенной системой наведения, осуществляющая оптическое наведение на цель, оснащенная более совершенной боеголовкой."
 atgm_equipment_3:0 "Противотанковая Управляемая Ракета IV"
 atgm_equipment_3_short:0 "ПТУР IV"
 atgm_equipment_3_desc:0 "Усовершенствованный противотанковый ракетный комплекс с электрооптическим или проводным наведением и большой боеголовкой."
 atgm_equipment_4:0 "Противотанковая Управляемая Ракета V"
 atgm_equipment_4_short:0 "ПТУР V"
 atgm_equipment_4_desc:0 "Усовершенствованный электрооптический, лазерный или проводной противотанковый ракетный комплекс с превосходной бронебойной боеголовкой."
 atgm_equipment_5:0 "Противотанковая Управляемая Ракета VI"
 atgm_equipment_5_short:0 "ПТУР VI"
 atgm_equipment_5_desc:0 "Современный электрооптический, лазерный или проводной противотанковый ракетный комплекс с превосходной бронебойной боеголовкой."
 
 #ATGM Carrier
 atgm_carrier_equipment_0:0 "Палубная Противотанковая Управляемая Ракета I"
 atgm_carrier_equipment_0_short:0 "Палубный ПТУР I"
 atgm_carrier_equipment_0_desc:0 "Ранняя палубная машина, вооруженная противотанковыми управляемыми ракетами."
 atgm_carrier_equipment_1:0 "Палубная Противотанковая Управляемая Ракета II"
 atgm_carrier_equipment_1_short:0 "Палубный ПТУР II"
 atgm_carrier_equipment_1_desc:0 "Автомобиль, вооруженный усовершенствованной противотанковой управляемой ракетой."
 atgm_carrier_equipment_2:0 "Палубная Противотанковая Управляемая Ракета III"
 atgm_carrier_equipment_2_short:0 "Палубный ПТУР I"
 atgm_carrier_equipment_2_desc:0 "Палубная машина, вооруженная тяжелой противотанковой управляемой ракетой."
 atgm_carrier_equipment_3:0 "Палубная Противотанковая Управляемая Ракета IV"
 atgm_carrier_equipment_3_short:0 "Палубный ПТУР I"
 atgm_carrier_equipment_3_desc:0 "Современная противотанковая управляемая ракета, установленная на транспортном средстве с хорошей подвижностью."
 atgm_carrier_equipment_4:0 "Палубная Противотанковая Управляемая Ракета V"
 atgm_carrier_equipment_4_short:0 "Палубный ПТУР I"
 atgm_carrier_equipment_4_desc:0 "Современный противотанковый управляемый ракетный комплекс, устанавливаемый на транспортное средство с хорошей подвижностью."

 #Cruise Missile
 cruisemissile_equipment_0:0 "Крылатая Ракета Наземного Нападения I"
 cruisemissile_equipment_0_short:0 "Крылатая Ракета I"
 cruisemissile_equipment_0_desc:0 "Крылатая ракета первого поколения КРНП или крылатая ракета наземного базирования, созданная на основе немецких разработок времен Второй мировой войны."
 cruisemissile_equipment_1:0 "Крылатая Ракета Наземного Нападения II"
 cruisemissile_equipment_1_short:0 "Крылатая Ракета II"
 cruisemissile_equipment_1_desc:0 "КРНП второго поколения или крылатая ракета наземного базирования с большей полезной нагрузкой."
 cruisemissile_equipment_2:0 "Крылатая Ракета Наземного Нападения III"
 cruisemissile_equipment_2_short:0 "Крылатая Ракета III"
 cruisemissile_equipment_2_desc:0 "КРНП третьего поколения или крылатая ракета наземного нападения с повышенной скоростью."
 cruisemissile_equipment_3:0 "Крылатая Ракета Наземного Нападения IV"
 cruisemissile_equipment_3_short:0 "Крылатая Ракета IV"
 cruisemissile_equipment_3_desc:0 "КРНП четвертого поколения или крылатая ракета наземного нападения с высокой скоростью, хорошей полезной нагрузкой и способностью распознавать движущуюся цель."
 cruisemissile_equipment_4:0 "Крылатая Ракета Наземного Нападения V"
 cruisemissile_equipment_4_short:0 "Крылатая Ракета V"
 cruisemissile_equipment_4_desc:0 "КРНП пятого поколения или крылатая ракета наземного нападения с радаром слежения за местностью."
 cruisemissile_equipment_5:0 "Крылатая Ракета Наземного Нападения VI"
 cruisemissile_equipment_5_short:0 "Крылатая Ракета VI"
 cruisemissile_equipment_5_desc:0 "КРНП пятого поколения или крылатая ракета наземного нападения, оснащенная радаром слежения за местностью и способная уклоняться от наступающего огня."
 cruisemissile_equipment_6:0 "Крылатая Ракета Наземного Нападения VI"
 cruisemissile_equipment_6_short:0 "Крылатая Ракета VI"
 cruisemissile_equipment_6_desc:0 "Современная КРНП или крылатая ракета наземного нападения с радаром слежения за местностью, способностью уклоняться от наступающего огня и точной стрельбой."

 #SLBM
 slbm_equipment_1:0 "БРПЛ I"
 slbm_equipment_1_short:0 "БРПЛ I"
 slbm_equipment_1_desc:0 "Ранняя баллистическая ракетная система, запускаемая с подводных лодок, основанная на истечении сроков эксплуатации, которые были запущены сразу после окончания Второй мировой войны."
 slbm_equipment_2:0 "БРПЛ II"
 slbm_equipment_2_short:0 "БРПЛ II"
 slbm_equipment_2_desc:0 "БРПЛ - это баллистические ракеты подводного базирования. Баллистическая ракета, способная запускаться с подводных лодок. Современные варианты обычно несут несколько независимых головных частей (РГЧ ИН), каждая из которых несет ядерную боеголовку и позволяет одной запущенной ракете поразить несколько целей. Баллистические ракеты, запускаемые с подводных лодок, действуют иначе, чем крылатые ракеты, запускаемые с подводных лодок."
 slbm_equipment_3:0 "БРПЛ III"
 slbm_equipment_3_short:0 "БРПЛ III"
 slbm_equipment_3_desc:0 "БРПЛ - это баллистические ракеты подводного базирования. Баллистическая ракета, способная запускаться с подводных лодок. Современные варианты обычно несут несколько независимых головных частей (РГЧ ИН), каждая из которых несет ядерную боеголовку и позволяет одной запущенной ракете поразить несколько целей. Баллистические ракеты, запускаемые с подводных лодок, действуют иначе, чем крылатые ракеты, запускаемые с подводных лодок."
