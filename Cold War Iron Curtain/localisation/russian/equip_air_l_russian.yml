 PRC_mr_stealth_fighter_equipment_1:0 "Chengdu J-10A"
 PRC_mr_stealth_fighter_equipment_1_short:0 "J-10A"
 PRC_mr_stealth_fighter_equipment_1_desc:0 "The Chengdu J-10 is a medium-weight, single-engine, multirole combat aircraft capable of all-weather operations, configured with a delta wing and canard design, with fly-by-wire flight controls, and produced jointly by the Chengdu Aircraft Corporation (CAC) for the People's Liberation Army Air Force (PLAAF) and Pakistan Air Force (PAF). The J-10 is mainly designed for air-to-air combat, but can also perform strike missions."

