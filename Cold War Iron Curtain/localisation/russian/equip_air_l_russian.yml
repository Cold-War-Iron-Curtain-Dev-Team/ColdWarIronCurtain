 ENG_fighter_equipment_0:0 "Royal Air Force"
 ENG_fighter_equipment_0_short:0 "RAF"
 ENG_fighter_equipment_0_desc:0 "The Royal Air Force (RAF) is the United Kingdom's air and space force. It was formed towards the end of the First World War on 1 April 1918, becoming the first independent air force in the world, by regrouping the Royal Flying Corps (RFC) and the Royal Naval Air Service (RNAS). Following the Allied victory over the Central Powers in 1918, the RAF emerged as the largest air force in the world at the time. Since its formation, the RAF has taken a significant role in British military history. In particular, it played a large part in the Second World War where it fought its most famous campaign, the Battle of Britain."

