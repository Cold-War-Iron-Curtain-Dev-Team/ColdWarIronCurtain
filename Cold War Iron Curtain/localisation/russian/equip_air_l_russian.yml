 PRC_irbm_equipment_4:0 "Dong Feng-3"
 PRC_irbm_equipment_4_short:0 "DF-3"
 PRC_irbm_equipment_4_desc:0 "The DF-3 is often considered China's first "domestic" intermediate-range ballistic missile (IRBM). The common ICBM design was greatly influenced by the Soviet R-14 Chusovaya missile and the first stage engine itself was a direct copy of the С.2.1100/С.2.1150 La-350 booster engine developed by Aleksei Isaev at OKB-2 (NII-88)." 
 PRC_irbm_equipment_5:0 "Dong Feng-4"
 PRC_irbm_equipment_5_short:0 "DF-4"
 PRC_irbm_equipment_5_desc:0 "The Dong Feng 4 or DF-4 is a first-generation two-stage Chinese intercontinental ballistic missile with liquid fuel."
 # PRC_irbm_equipment_6:0 ""
 # PRC_irbm_equipment_6_short:0 ""
 # PRC_irbm_equipment_6_desc:0 ""
 PRC_irbm_equipment_7:0 "DF-16"
 PRC_irbm_equipment_7_short:0 "DF-16"
 PRC_irbm_equipment_7_desc:0 "The DF-16 is a new-model missile that has a longer range than the DF-15 (between 800–1,000 km (500–620 mi))."
 PRC_irbm_equipment_8:0 "DF-25"
 PRC_irbm_equipment_8_short:0 "DF-25"
 PRC_irbm_equipment_8_desc:0 "The DF-25 was a mobile-launch, two-stage, solid-fuel IRBM with a range of 3,200 kilometres (2,000 mi). Development was allegedly cancelled in 1996. The U.S. Department of Defense in its 2013 report to Congress on China's military developments made no mention of the DF-25 as a missile in service."

