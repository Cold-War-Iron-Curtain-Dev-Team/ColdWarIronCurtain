 #CAS
 jet_cas:0 "Реактивный Штурмовик"
 jet_CAS_equipment:0 "Реактивный Штурмовик"
 jet_CAS_equipment_1:0 "Реактивный Штурмовик I"
 jet_CAS_equipment_1_short:0 "Реакт. Штурм. I"
 jet_CAS_equipment_1_desc:0 "Легкий ударный самолет с боеприпасами класса "воздух-земля" со специальным заданием по ближней воздушной поддержке наземных войск."
 jet_CAS_equipment_2:0 "Реактивный Штурмовик II"
 jet_CAS_equipment_2_short:0 "Реакт. Штурм. II"
 jet_CAS_equipment_2_desc:0 "Обновленный легкий ударный самолет с боеприпасами класса "воздух-земля" со специальным заданием по ближней воздушной поддержке наземных войск."
 jet_CAS_equipment_3:0 "Реактивный Штурмовик III"
 jet_CAS_equipment_3_short:0 "Реакт. Штурм. III"
 jet_CAS_equipment_3_desc:0 "Штурмовик второго поколения со специальными возможностями "воздух-земля"."
 jet_CAS_equipment_4:0 "Реактивный Штурмовик IV"
 jet_CAS_equipment_4_short:0 "Реакт. Штурм. IV"
 jet_CAS_equipment_4_desc:0 "Штурмовик третьего поколения с расширенными возможностями "воздух-земля" и базовыми навигационными и ударными системами."
 jet_CAS_equipment_5:0 "Реактивный Штурмовик V"
 jet_CAS_equipment_5_short:0 "Реакт. Штурм. V"
 jet_CAS_equipment_5_desc:0 "Штурмовик третьего поколения с расширенными возможностями класса "воздух-земля" и обновленными системами навигации и захвата целей."
 jet_CAS_equipment_6:0 "Реактивный Штурмовик VI"
 jet_CAS_equipment_6_short:0 "Реакт. Штурм. VI"
 jet_CAS_equipment_6_desc:0 "Штурмовик третьего поколения с усовершенствованными навигационными системами и системами захвата целей, включая базовые ФЛИР и лазерные целеуказатели."
 jet_CAS_equipment_7:0 "Реактивный Штурмовик VII"
 jet_CAS_equipment_7_short:0 "Реакт. Штурм. VII"
 jet_CAS_equipment_7_desc:0 "Штурмовик четвертого поколения с расширенными возможностями, включая лазерные целеуказатели, системы определения местоположения GPS и Электродистанционную систему управления."
 jet_CAS_equipment_8:0 "Реактивный Штурмовик VIII"
 jet_CAS_equipment_8_short:0 "Реакт. Штурм. VIII"
 jet_CAS_equipment_8_desc:0 "Четвертое поколение плюс Штурмовик с расширенным вооружением и увеличенными возможностями, включая лазерные целеуказатели, системы GPS определения местоположения Электродистанционное управление и усовершенствованное ФЛИР и оборудование для ночного полета."

 cas_stealth_equipment_1:0 "Стелс Штурмовик"
 cas_stealth_equipment_1_short:0 "Стелс Штурм."
 cas_stealth_equipment_1_desc:0 "Штурмовик пятого или пятого минус поколения, интегрирующий стелс-компоненты для снижения заметности и радиолокационного сечения."

 #Light Jet
 jet_light_equipment_1:0 "Легкий Реактивный Самолет 1 Поколения"
 jet_light_equipment_1_short:0 "Легк. Реакт. Самолет 1 Пок."
 jet_light_equipment_1_desc:0 "Легкий самолет первого поколения, часто тесно связанный с учебными самолетами, предназначенный для выполнения легких ударных задач или задач противовоздушной обороны."
 jet_light_equipment_2:0 "Легкий Реактивный Самолет 2 Поколения"
 jet_light_equipment_2_short:0 "Легк.  Реакт. Самолет 2 Пок."
 jet_light_equipment_2_desc:0 "Второе поколение легких самолетов, часто тесно связанное с учебными самолетами для использования в легких ударных или противовоздушных миссиях."
 jet_light_equipment_3:0 "Легкий Реактивный Самолет 3 Поколения"
 jet_light_equipment_3_short:0 "Легк.  Реакт. Самолет 3 Пок."
 jet_light_equipment_3_desc:0 "Третье поколение легких тактических самолетов, дешевых в производстве, но оснащенных легким вооружением для выполнения задач класса "воздух-воздух" и "воздух-земля"."
 jet_light_equipment_4:0 "Легкий Реактивный Самолет 3++ Поколения"
 jet_light_equipment_4_short:0 "Легк.  Реакт. Самолет 3++ Пок."
 jet_light_equipment_4_desc:0 "Третье поколение плюс легкие тактические самолеты, дешевые в производстве, но способные с легким вооружением выполнять задачи класса "воздух-воздух" и "воздух-земля"."
 jet_light_equipment_5:0 "Легкий Реактивный Самолет 4+ Поколения"
 jet_light_equipment_5_short:0 "Легк.  Реакт. Самолет 4+ Пок."
 jet_light_equipment_5_desc:0 "Четвертое плюс поколение легких самолетов с мощными сенсорами и радарами, вооруженных легким оружием для выполнения задач класса "воздух-воздух" и "воздух-земля"."

 #Multirole
 jet_multirole_equipment:0 "Многоцелевой Истребитель"
 jet_multirole_equipment_1:0 "Многоцелевой Истребитель 1 Поколения"
 jet_multirole_equipment_1_short:0 "Многоцелевой 1 Пок."
 jet_multirole_equipment_1_desc:0 "Предыдущие увеличения скорости меркнут по сравнению с появлением первых реактивных истребителей. Хотя нам еще предстоит узнать, как лучше строить самолеты для этих двигателей, обычные истребители не могут конкурировать с ними."
 jet_multirole_equipment_2:0 "Многоцелевой Истребитель 1+ Поколения"
 jet_multirole_equipment_2_short:0 "Многоцелевой 1+ Пок."
 jet_multirole_equipment_2_desc:0 "Введение стреловидного крыла позволило достичь трансзвуковых скоростей, но управляемость на таких скоростях все еще часто ограничена. Эти самолеты, как правило, были нацелены на борьбу за превосходство в воздухе."
 jet_multirole_equipment_3:0 "Многоцелевой Истребитель 2 Поколения"
 jet_multirole_equipment_3_short:0 "Многоцелевой 2 Пок."
 jet_multirole_equipment_3_desc:0 "Корейская Война 1950-1953 гг. заставила пересмотреть взгляды. Оружие оказалось непригодным на таких высоких скоростях, а необходимость в многоцелевых возможностях поддержки на поле боя была открыта заново. Появившиеся после войны типы перехватчиков использовали форсажные двигатели для достижения скорости 2 Маха, а радары и инфракрасные самонаводящиеся ракеты значительно повысили их точность и огневую мощь."
 jet_multirole_equipment_4:0 "Многоцелевой Истребитель 2+ Поколения"
 jet_multirole_equipment_4_short:0 "Многоцелевой 2+ Пок."
 jet_multirole_equipment_4_desc:0 "Дальнейшее расширение возможностей потребуется для самолетов второго поколения, требующих более многоцелевого подхода. Дополнительные жесткие точки, заострение крыльев и первое внедрение конструкций дельтавидного крыла."
 jet_multirole_equipment_5:0 "Многоцелевой Истребитель 3 Поколения"
 jet_multirole_equipment_5_short:0 "Многоцелевой 3 Пок."
 jet_multirole_equipment_5_desc:0 "Истребители следующего поколения с самого начала разрабатывались как многоцелевые. Они должны были нести широкий спектр оружия и других боеприпасов, таких как ракеты класса "воздух-земля" и бомбы с лазерным наведением, а также быть способными осуществлять перехват в воздухе за пределами визуальной дальности. Их вспомогательная авионика включала импульсно-доплеровский радар, системы целеуказания вне зоны видимости и предупреждения о пересечении местности."
 jet_multirole_equipment_6:0 "Многоцелевой Истребитель 3+ Поколения"
 jet_multirole_equipment_6_short:0 "Многоцелевой 3+ Пок."
 jet_multirole_equipment_6_desc:0 "Появление более экономичных турбовентиляторных двигателей привело к увеличению дальности полета и времени вылета, в то время как увеличение тяги могло лишь частично обеспечить лучшие характеристики и маневренность в диапазоне скоростей. В попытке примирить эти противоположности некоторые конструкторы прибегли к изменяемой геометрии или векторной тяге."
 jet_multirole_equipment_7:0 "Многоцелевой Истребитель 3++ Поколения"
 jet_multirole_equipment_7_short:0 "Многоцелевой 3++ Пок."
 jet_multirole_equipment_7_desc:0 "Дальнейшее расширение крыльев с изменяемой геометрией, дальнейшее увеличение дальности полета и совершенствование радаров и системы управления огнем, чтобы идти в ногу с быстрым технологическим прогрессом в направлении четвертого поколения истребителей."
 jet_multirole_equipment_8:0 "Многоцелевой Истребитель 4 Поколения"
 jet_multirole_equipment_8_short:0 "Многоцелевой 4 Пок."
 jet_multirole_equipment_8_desc:0 "После неоднозначных успехов многоцелевого поколения разрабатывались передовые технологии, такие как беспилотные самолеты, композитные материалы, соотношение тяги к массе больше единицы, гиперманевренность, передовая цифровая авионика и датчики, такие как синтетический радар и инфракрасный поиск и слежение, а также стелс."
 jet_multirole_equipment_9:0 "Многоцелевой Истребитель 4+ Поколения"
 jet_multirole_equipment_9_short:0 "Многоцелевой 4+ Пок."
 jet_multirole_equipment_9_desc:0 "Поскольку предыдущее поколение появилось по частям, конструкторы вернулись к истребителю в первую очередь, но с ролями поддержки, намеченными в качестве ожидаемых разработок. Еще более экстремальная маневренность с, соответственно, усиленными выхлопными соплами для вифинга (векторизации в полете вперед) и управления маневрированием на больших углах атаки."
 jet_multirole_equipment_10:0 "Многоцелевой Истребитель 4++ Поколения"
 jet_multirole_equipment_10_short:0 "Многоцелевой 4++ Пок."
 jet_multirole_equipment_10_desc:0 "Более поздние варианты этих и других самолетов постепенно улучшали свои характерные технологии и все больше внедряли некоторые аспекты технологий друг друга, а также перенимали некоторые новые технологии пятого поколения, такие как цифровая связь высокой емкости. Эти истребители максимально приближены к полностью цифровым и передовым самолетам без передовых стелс-характеристик."
 
 mr_stealth_fighter_equipment_1:0 "Многоцелевой Истребитель 5 Поколения"
 mr_stealth_fighter_equipment_1_short:0 "Многоцелевой 5 Пок."
 mr_stealth_fighter_equipment_1_desc:0 "Появившееся в первые десятилетия 21-го века поколение современных истребителей стало известно как пятое поколение. Определяющие характеристики истребителя пятого поколения не являются общепризнанными, и не каждый тип пятого поколения обязательно обладает всеми этими характеристиками. Некоторые поколения включают в себя более пяти, предшествующих появлению нового поколения."

 #Interceptor
 jet_interceptor:0 "Истребитель Завоевания Превосходства в Воздухе"
 jet_interceptor_equipment:0 "Истребитель Завоевания Превосходства в Воздухе"
 jet_interceptor_equipment_1:0 "Истребитель Завоевания Превосходства в Воздухе 1 Поколения"
 jet_interceptor_equipment_1_short:0 "ИЗПВ 1 Пок."
 jet_interceptor_equipment_1_desc:0 "Предыдущие увеличения скорости меркнут по сравнению с появлением перехватчиков. Хотя нам еще предстоит узнать, как лучше строить самолеты для этих двигателей, обычные перехватчики не могут конкурировать с ними."
 jet_interceptor_equipment_2:0 "Истребитель Завоевания Превосходства в Воздухе 1+ Поколения"
 jet_interceptor_equipment_2_short:0 "ИЗПВ 1+ Пок."
 jet_interceptor_equipment_2_desc:0 "Введение стреловидного крыла позволило достичь трансзвуковых скоростей, но управляемость на таких скоростях все еще часто ограничена. Эти самолеты, как правило, были нацелены на борьбу за превосходство в воздухе."
 jet_interceptor_equipment_3:0 "Истребитель Завоевания Превосходства в Воздухе 2 Поколения"
 jet_interceptor_equipment_3_short:0 "ИЗПВ 2 Пок."
 jet_interceptor_equipment_3_desc:0 "Корейская Война 1950-1953 гг. заставила пересмотреть взгляды. Оружие оказалось непригодным на таких высоких скоростях, а необходимость в многоцелевых возможностях поддержки на поле боя была открыта заново. Появившиеся после войны типы перехватчиков использовали форсажные двигатели для достижения скорости 2 Маха, а радары и инфракрасные самонаводящиеся ракеты значительно повысили их точность и огневую мощь."
 jet_interceptor_equipment_4:0 "Истребитель Завоевания Превосходства в Воздухе 2+ Поколения"
 jet_interceptor_equipment_4_short:0 "ИЗПВ 2+ Пок."
 jet_interceptor_equipment_4_desc:0 "Дальнейшее расширение возможностей потребовалось бы от самолетов второго поколения. Дополнительные жесткие точки, заострение крыльев и первое внедрение дельтавидных конструкций крыльев начнут становиться нормой."
 jet_interceptor_equipment_5:0 "Истребитель Завоевания Превосходства в Воздухе 3 Поколения"
 jet_interceptor_equipment_5_short:0 "ИЗПВ 3 Пок."
 jet_interceptor_equipment_5_desc:0 "Следующее поколение перехватчиков большой дальности. Предполагалось, что они будут нести широкий спектр вооружения и других боеприпасов, таких как ракеты класса "воздух-воздух", и возможность прицеливания за пределами визуальной дальности. Их вспомогательная авионика включала импульсно-доплеровский радар, системы прицеливания вне видимости и предупреждения о пересечении местности."
 jet_interceptor_equipment_6:0 "Истребитель Завоевания Превосходства в Воздухе 3+ Поколения"
 jet_interceptor_equipment_6_short:0 "ИЗПВ 3+ Пок."
 jet_interceptor_equipment_6_desc:0 "Появление более экономичных турбовентиляторных двигателей привело к увеличению дальности полета и времени вылета, в то время как увеличение тяги могло лишь частично обеспечить лучшие характеристики и маневренность в диапазоне скоростей. В попытке примирить эти противоположности некоторые конструкторы прибегли к изменяемой геометрии или векторной тяге."
 jet_interceptor_equipment_7:0 "Истребитель Завоевания Превосходства в Воздухе 3++ Поколения"
 jet_interceptor_equipment_7_short:0 "ИЗПВ 3++ Пок."
 jet_interceptor_equipment_7_desc:0 "Дальнейшее расширение крыльев с изменяемой геометрией, дальнейшее увеличение дальности полета и совершенствование радаров и системы управления огнем, чтобы идти в ногу с быстрым технологическим прогрессом в направлении четвертого поколения истребителей."
 jet_interceptor_equipment_8:0 "Истребитель Завоевания Превосходства в Воздухе 4 Поколения"
 jet_interceptor_equipment_8_short:0 "ИЗПВ 4 Пок."
 jet_interceptor_equipment_8_desc:0 "После неоднозначного успеха предыдущего поколения перехватчиков разрабатывались передовые технологии, такие как беспилотные летательные аппараты, композитные материалы, соотношение тяги к массе больше единицы, гиперманевренность, передовая цифровая авионика и датчики, такие как синтетический радар и инфракрасный поиск и слежение, а также стелс."
 jet_interceptor_equipment_9:0 "Истребитель Завоевания Превосходства в Воздухе 4+ Поколения"
 jet_interceptor_equipment_9_short:0 "ИЗПВ 4+ Пок."
 jet_interceptor_equipment_9_desc:0 "Поскольку предыдущее поколение появилось по частям, конструкторы вернулись к истребителю в первую очередь, но с ролями поддержки, намеченными в качестве ожидаемых разработок. Еще более экстремальная маневренность с, соответственно, усиленными выхлопными соплами для вифинга (векторизации в полете вперед) и управления маневрированием на больших углах атаки."

 stealth_fighter_equipment_1:0 "Истребитель Завоевания Превосходства в Воздухе 5 Поколения"
 stealth_fighter_equipment_1_short:0 "ИЗПВ 5 Пок."
 stealth_fighter_equipment_1_desc:0 "Появившееся в первые десятилетия 21 века поколение современных самолетов-перехватчиков стало известно как пятое поколение. Определяющие характеристики перехватчиков пятого поколения не являются общепризнанными, и не каждый тип пятого поколения обязательно обладает всеми этими характеристиками. Некоторые поколения включают более пяти, ведущих к появлению нового поколения."
 
 #High-Mach Interceptor
 high_mach_jet_interceptor_equipment_1:0 "Высокоскоростной Реактивный Перехватчик I"
 high_mach_jet_interceptor_equipment_1_short:0 "ВС Перехватчик I"
 high_mach_jet_interceptor_equipment_1_desc:0 "С учетом того, что вражеские самолеты-бомбардировщики предпочитают летать все выше и выше, чтобы доставить боеприпасы, требуется новый тип самолета-перехватчика, летающего выше и быстрее, чем раньше." 
 high_mach_jet_interceptor_equipment_2:0 "Высокоскоростной Реактивный Перехватчик II"
 high_mach_jet_interceptor_equipment_2_short:0 "ВС Перехватчик II"
 high_mach_jet_interceptor_equipment_2_desc:0 "Способный развивать скорость 2+ Маха, еще более скоростной высотный перехватчик, разработанный специально для защиты от дальних высоколетящих бомбардировщиков." 
 high_mach_jet_interceptor_equipment_3:0 "Высокоскоростной Реактивный Перехватчик III"
 high_mach_jet_interceptor_equipment_3_short:0 "ВС Перехватчик III"
 high_mach_jet_interceptor_equipment_3_desc:0 "Высотный перехватчик, способный развивать скорость 3 Маха. разработанный специально для оборонительной роли перехвата против атакующего самолета противника, особенно бомбардировщиков и разведывательных самолетов. Самолеты этого типа иногда называют скоростными перехватчиками." 
 high_mach_jet_interceptor_equipment_4:0 "Высокоскоростной Реактивный Перехватчик IV"
 high_mach_jet_interceptor_equipment_4_short:0 "ВС Перехватчик IV"
 high_mach_jet_interceptor_equipment_4_desc:0 "Высотный перехватчик, способный развивать скорость 3+ Маха. разработанный специально для оборонительной роли перехвата против атакующего самолета противника, особенно бомбардировщиков и разведывательных самолетов. Самолеты этого типа иногда называют усовершенствованными высокоскоростными перехватчиками." 

 #Recon Plane
 recon_equipment_0:0 "Самолет-Разведчик I"
 recon_equipment_0_short:0 "Самолет-РазведчикI"
 recon_equipment_0_desc:0 "Возможность обследовать поле боя с воздуха - это ключевая возможность, которая появилась уже во время Первой мировой войны. Вторая мировая война расширила эту возможность, создав специальные легкие самолеты, способные наблюдать за полем боя в течение длительного времени."
 jet_recon_equipment_0:0 "Самолет-Разведчик II"
 jet_recon_equipment_0_short:0 "Самолет-Разведчик II"
 jet_recon_equipment_0_desc:0 "С вступлением разведывательных самолетов в эпоху реактивных самолетов требуется более высокая производительность, более длительное время нахождения в воздухе и лучшая видимость."
 jet_recon_equipment_1:0 "Самолет-Разведчик III"
 jet_recon_equipment_1_short:0 "Самолет-Разведчик III"
 jet_recon_equipment_1_desc:0 "Предназначенные для высокоскоростных и низковысотных операций, самолеты этого типа имеют установленные в носовой части камеры, способные быстро составить карту местности."
 jet_recon_equipment_2:0 "Самолет-Разведчик IV"
 jet_recon_equipment_2_short:0 "Самолет-Разведчик IV"
 jet_recon_equipment_2_desc:0 "Имея общие черты с многоцелевыми самолетами своего времени, эти самолеты имеют либо встроенные камеры в носовой части, либо возможность установки разведывательной капсулы, способной картографировать местность."

 #CV Multirole
 cv_jet_multirole_equipment:0 "Палубный Многоцелевой Истребитель"
 cv_jet_multirole_equipment_1:0 "Палубный Многоцелевой Истребитель 1 Поколения"
