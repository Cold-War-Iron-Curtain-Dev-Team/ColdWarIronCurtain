#Soviet Missile Forces

 SOV_slbm_equipment_1:0 "Р-11ФМ Шквал"
 SOV_slbm_equipment_1_short:0 "Р-11ФМ Шквал"
 SOV_slbm_equipment_1_desc:0 "Р-11ФМ - это военно-морской вариант ракеты Р-11 Земля, обозначение НАТО Scud-A. Впервые она была испытана на стартовой площадке в Капустином Яру в 1955 году и запущена с подводной лодки проекта 611 (класса Зулус) в том же году. Ракета была принята на вооружение в 1959 году, известна как система запуска Д-1 и стала первой в мире БРПЛ. За время эксплуатации она была запущена в общей сложности 77 раз, из которых 59 были успешными. Она была полностью снята с вооружения в 1963 году."
 SOV_slbm_equipment_2:0 "Р-13"
 SOV_slbm_equipment_2_short:0 "Р-13"
 SOV_slbm_equipment_2_desc:0 "Р-13 стала заменой Р-11ФМ и была принята к разработке Ракетным конструкторским бюро Макаева в 1955 году. Окончательные технические характеристики были утверждены в начале 1956 года, а на вооружение Р-13 поступила в 1961 году. Sark была первой советской БРПЛ, на которой для изменения курса, помимо хвостового оперения, использовались верньерные движители, что повышало устойчивость, аэродинамику и дальность полета. Р-13 могла преодолевать 600 км и нести боеголовку мощностью до 2 мегатонн. Она была снята с вооружения в 1975 году."
 SOV_slbm_equipment_3:0 "Р-21"
 SOV_slbm_equipment_3_short:0 "Р-21"
 SOV_slbm_equipment_3_desc:0 "Р-21 была первой советской ракетой, которую можно было запускать с погруженной подводной лодки. Ее разработка началась в 1958 году, а успешные полеты состоялись 2 года спустя. Р-21 имела более чем в два раза большую дальность по сравнению со своими предшественниками - 1650 км, и могла нести боеголовку мощностью 800 кт. Впервые представленный в 1963 году, он был снят с вооружения в 1987 году."
 SOV_slbm_equipment_4:0 "Р-27"
 SOV_slbm_equipment_4_short:0 "Р-27"
 SOV_slbm_equipment_4_desc:0 "Р-27 был очень похож на Р-21 по конструкции и целям. Поступившая на вооружение всего через 5 лет после Р-21, в 1968 году, она отличалась значительным увеличением характеристик и возможностей, имея дальность действия 2400 км и боеголовку мощностью 1 мегатонна. В итоге было произведено 1800 ракет, и в 1990 году она была снята с вооружения."
 SOV_slbm_equipment_5:0 "Р-29"
 SOV_slbm_equipment_5_short:0 "Р-29"
 SOV_slbm_equipment_5_desc:0 "Р-29 была первой современной БРПЛ, поступившей на вооружение советского ВМФ. Она была принята на вооружение в 1974 году, имела в 3 раза большую дальность по сравнению с Р-27 - 7700 км, и могла нести более мощную боеголовку, превышающую 1 мегатонну. Они используются и сегодня, и неизвестное их количество в настоящее время находится на борту российских подводных лодок."
 SOV_slbm_equipment_6:0 "Р-29РМ Скиф"
 SOV_slbm_equipment_6_short:0 "Р-29РМ Скиф"
 SOV_slbm_equipment_6_desc:0 "Р-29РМ был разработан после Р-29, но с другой целью. Хотя она имела гораздо меньшую полезную нагрузку - 4 боеголовки по 100 кт в ЗУР, она имела большую дальность 8800 км, и на 1 подводную лодку можно было установить больше. Однако, в отличие от Р-29, она была снята с вооружения в 2010 году."
 SOV_slbm_equipment_7:0 "Р-39"
 SOV_slbm_equipment_7_short:0 "Р-39"
 SOV_slbm_equipment_7_desc:0 "Р-39 начали разрабатывать в начале 1970-х годов, первоначальные испытания прошли в 1979 году, а развертывание состоялось в 1983 году. На момент полного развертывания на вооружении находилось 120 ракет, каждая из которых несла 10 боеголовок мощностью 150 кт, а дальность полета составляла 8300 км. В соответствии с условиями СНВ I и II, они постепенно начали уничтожаться, начиная с 1996 года, и последняя Р-39 была выведена из эксплуатации в 2004 году."
 
 SOV_irbm_equipment_1:0 "Р-5 Победа"
 SOV_irbm_equipment_1_short:0 "Р-5 Победа"
 SOV_irbm_equipment_1_desc:0 "Р-5 была первой советской попыткой создания театральной баллистической ракеты, или БРСД. Вариант Р-5, который был фактически произведен, был Р-5М, которая стала первой ядерной ракетой, развернутой СССР. Она имела дальность 1200 км и могла нести термоядерную боеголовку мощностью до 1 мегатонны. Впервые она была распространена в мае 1956 года, а в конце 1959 года была установлена на авиабазах Восточной Германии. Всего к моменту снятия с вооружения в 1967 году было произведено 48 пусковых установок и 200 ракет."
 SOV_irbm_equipment_2:0 "Р-12 Двина"
 SOV_irbm_equipment_2_short:0 "Р-12 Двина"
 SOV_irbm_equipment_2_desc:0 "Р-12, преемница Р-5, была одной из самых производимых советских ракет времен холодной войны (было произведено 2335 ракет) и обеспечивала большую часть советской наступательной ракетной угрозы для Западной Европы. Р-12 была впервые произведена в октябре 1958 года и поступила на вооружение в 1959 году. Она имела максимальную дальность 2080 км и могла нести термоядерную боеголовку мощностью до 2,3 мегатонны. Размещение Р-12 на Кубе положило начало Кубинскому ракетному кризису в 1963 году."
 SOV_irbm_equipment_3:0 "Р-14 Чусовая"
 SOV_irbm_equipment_3_short:0 "Р-14 Чусовая"
 SOV_irbm_equipment_3_desc:0 "Премьер-министр СССР разрешил разработку Р-14 2 июля 1958 года, а летные испытания были завершены в конце 1961 года. Версия ракеты-носителя Силос была утверждена в мае 1960 года и завершила испытания в начале 1962 года. Чусовая имела дальность 4500 км и могла нести боеголовку мощностью до 2,3 мегатонны. Она была принята на вооружение в апреле 1961 года, а последние 6 ракет были списаны в 1989 году после заключения договора с США."
 SOV_irbm_equipment_4:0 "РТ-15"
 SOV_irbm_equipment_4_desc:0 "РТ-15 была ранней советской попыткой создания более мобильной БРСД, и была разработана для запуска с шасси T-10. Предполагалось, что это будет система быстрого запуска с максимальной дальностью 2500 км, способная нести боеголовку мощностью 1 Мт. Однако она так и не была принята на вооружение, и только 1 батальон использовал ее из-за неисправной электроники и слабой системы поддержки запуска."
 SOV_irbm_equipment_4_short:0 "РТ-15"
 SOV_irbm_equipment_5:0 "РСД-10 Пионер"
 SOV_irbm_equipment_5_short:0 "РСД-10 Пионер"
 SOV_irbm_equipment_5_desc:0 "Разработка РСД-10 началась в 1966 году, а первоначальный проект был одобрен в 1968 году. Предназначенная для замены или дополнения ракет Р-12 и Р-14, она была впервые развернута в 1976 году и была распространена по всему Варшавскому договору, поскольку РСД-10 была первой советской ракетой, способной наносить хирургические удары по небольшим целям. В конечном итоге было произведено более 650 ракет, каждая из которых имела дальность 5500 км и могла нести боеголовку мощностью до 1,6 Мт, а позднее - и реактивную боеголовку. Все они были уничтожены в соответствии с Договором о ядерных силах средней дальности 1991 года."
 SOV_irbm_equipment_6:0 "РТ-21M Темп 2С"
 SOV_irbm_equipment_6_short:0 "РТ-21M Темп 2С "
 SOV_irbm_equipment_6_desc:0 "Хотя технически классифицируется НАТО как МБР, РТ-21M имела меньшую дальность, чем большинство других, а также небольшую боеголовку, максимальная мощность которой достигала 1 мегатонны. Она базировалась на мобильной пусковой установке и была спроектирована и разработана примерно в то же время, что и РСД-10. Однако из-за всех договоров, связанных с ядерным оружием в конце 20-го века, программа так и не была реализована, и к середине 1980-х годов весь проект был списан."
 SOV_irbm_equipment_7:0 "РСД-10 Пионер 3"
 SOV_irbm_equipment_7_short:0 "РСД-10 Пионер 3"
 SOV_irbm_equipment_7_desc:0 "РСД-10 Пионер 3 - это улучшенный вариант оригинального РСД-10. Наибольший прогресс произошел в максимальной дальности действия РСД-10 3, которая увеличилась на 2000 км с 5500 до 7500. Разработанная в конце 1970-х годов, она была впервые принята на вооружение Советской Армии в 1980 году и несла тройную ядерную боеголовку РГЧ ИН мощностью до 50 Кт каждая. Пионер-3 постигла та же участь, что и оригинал, после заключения Договора о ядерных силах средней дальности."
 
 SOV_srbm_equipment_1:0 "Р-1 Волга"
 SOV_srbm_equipment_1_short:0 "Р-1 Волга"
 SOV_srbm_equipment_1_desc:0 "Р-1 Волга был ничем иным, как прославленной ракетой В-2. Она была произведена и разработана теми же немецкими учеными, которые создали В-2, поскольку они были захвачены Советами, когда Красная Армия захватила главный завод по производству В-2. Причина, по которой Советы хотели получить копию В-2, заключалась скорее в изучении техники и процессов, связанных с созданием ракет, чем в реальной тактической ценности Р-1. Производство было лично санкционировано Сталиным (как и все остальные ракеты в свое время) в 1947 году, а Scunner поступил на вооружение в ноябре 1950 года."
 SOV_srbm_equipment_2:0 "Р-2"
 SOV_srbm_equipment_2_short:0 "Р-2"
 SOV_srbm_equipment_2_desc:0 "Р-2 был серьезной модернизацией по сравнению с Р-1. Во-первых, дальность полета была увеличена более чем в два раза, до 600 км. Кроме того, у него был более прочный корпус, меньше вибраций благодаря стальному хвостовому оперению, и, несмотря на то, что он был почти в два раза тяжелее Р-1, он был таким же точным, благодаря усовершенствованиям в радиоуправлении. Первые испытания прошли в конце 1949 года, а в 1951 году он был принят на вооружение, но массовое распространение получил только через 2 года. Р-2 был последней прямой немецкой подделкой, поскольку Советы теперь имели достаточно опыта для создания своих собственных конструкций. "
 SOV_srbm_equipment_3:0 "Р-11 Шквал A"
 SOV_srbm_equipment_3_short:0 "Р-11 Шквал A"
 SOV_srbm_equipment_3_desc:0 "Р-11 была разработана на основе варианта В-2 Wasserfall (противовоздушная), но не была прямым подражанием. В июле 1955 года первый вариант Р-11 был принят на вооружение Советской Армии. Однако Р-11М, окончательный вариант Р-11, способный нести ядерную боеголовку, был принят на вооружение 3 года спустя, в 1958 году. При наличии боеголовки максимальная дальность стрельбы составляла 170 км. В результате она запускалась в основном с мобильных ударных платформ (модифицированные шасси ИС-2)."
 SOV_srbm_equipment_4:0 "Р-17 Шквал B"
 SOV_srbm_equipment_4_short:0 "Р-17 Шквал B"
 SOV_srbm_equipment_4_desc:0 "Шквал B была самой запускаемой и одной из самых производимых (более 7000 единиц) ракет Холодной войны. Впервые разработанная в 1959 году, она поступила на вооружение в 1964 году. Она была значительно усовершенствована по сравнению с предыдущей ракетой Р-11, могла лететь дальше, на 300 км, и нести все, что угодно - от ядерной боеголовки до баллона с VX и бомбы HE. Р-17 широко использовался на Ближнем Востоке, особенно в войне Йом Киппур и ирано-иракской войне. Он был снят с вооружения СССР/России уже довольно давно, но некоторые, например, Северная Корея, все еще используют его. "
 SOV_srbm_equipment_5:0 "ОТР-22 Темп С"
 SOV_srbm_equipment_5_short:0 "ОТР-22 Темп С"
 SOV_srbm_equipment_5_desc:0 "ОТР-22 Темп С был улучшенным вариантом ТР-1 Темп. По своей концепции он был похож на Scud-B и использовал ту же ракету-носитель, но широкого производства не получил. Он поступил на вооружение в 1968 году и имел максимальную дальность 900 км и одну боеголовку мощностью 500 кт. Она была снята с вооружения в 1989 году."
 SOV_srbm_equipment_6:0 "ОТР-21 Точка А"
 SOV_srbm_equipment_6_short:0 "ОТР-21 Точка А"
 SOV_srbm_equipment_6_desc:0 "ОТР-21 была мобильной пусковой установкой, предназначенной для использования вместе с регулярной пехотной дивизией для нанесения точных ударов по важным объектам противника, таким как мосты или командные центры, что отличало ее от предыдущих БРСД. Максимальная дальность стрельбы составляла 70 км, а боеголовка мощностью 100 кт могла быть заменена на химическое, фугасное или осколочное оружие; оба этих фактора ясно показывают ее тактическое назначение. Она поступила на вооружение в 1975 году, и все 3 ее варианта используются до сих пор. "
 SOV_srbm_equipment_7:0 "ОТР-23 Ока"
 SOV_srbm_equipment_7_short:0 "ОТР-23 Ока"
 SOV_srbm_equipment_7_desc:0 "ОТР-23 был разработан для замены устаревшего на тот момент Scud-B к концу холодной войны. Он был разработан в середине 70-х годов и поступил на вооружение в 1979 году. Его дальность действия составляла 500 км, что было меньше, чем у Scud, но он был гораздо более точным и нес большую боеголовку. Он был запрещен Договором о ядерных силах средней дальности 1991 года."
 SOV_srbm_equipment_8:0 "ОТР-21 Точка Б"
 SOV_srbm_equipment_8_short:0 "ОТР-21 Точка Б"
 SOV_srbm_equipment_8_short_desc:0 "ОТР-21 "Точка-Б" был улучшенной версией "Точки-А". Впервые разработанный в 1986 году, он поступил на вооружение в 1989 году. Улучшенное топливо позволило увеличить максимальную дальность стрельбы до 120 км, но она несла ту же боеголовку и в остальном служила той же цели, что и Точка-А. Она все еще находится на вооружении сегодня."
 SOV_srbm_equipment_9:0 "9К720 Искандер"
 SOV_srbm_equipment_9_short:0 "9К720 Искандер"
 SOV_srbm_equipment_9_desc:0 "9K720 был разработан для замены ОТР-21 где-то к началу 2020 года. Разработка началась в 1986 году и продолжалась, не затронутая распадом Советского Союза, поскольку первые запуски состоялись в 1996 году. Новейшая версия Искандер-М имеет дальность 500 км и может нести любую ядерную или иную боеголовку весом до 700 кг. Большая часть российской армии в настоящее время использует 9К720, но некоторые старые системы Точка-Б остались."
 
 SOV_icbm_equipment_1:0 "Р-9 Десна"
 SOV_icbm_equipment_1_short:0 "Р-9 Десна"
 SOV_icbm_equipment_1_desc:0 "Р-9 Десна была двухступенчатой МБР, разработанной в 1959 году и впервые испытанной в 1961 году. Ракета, способная доставить 1600 кг полезной нагрузки/5 Мт боеголовки на расстояние около 11 000 км, была не только очень точной, но и гораздо более полезной в тактическом отношении для Советского Союза, поскольку она могла быть заправлена топливом и готова к запуску менее чем за 20 минут. Впервые она поступила на вооружение в 1964 году и использовалась 3 наземными полками и 1 полком шахтного базирования. К 1976 году все Р-9 были сняты с вооружения."
 SOV_icbm_equipment_2:0 "РТ-2 Дикий"
 SOV_icbm_equipment_2_short:0 "РТ-2 Дикий"
 SOV_icbm_equipment_2_desc:0 "РТ-2 Дикий была трехступенчатой МБР, сравнимой с американской «Минитмен». Она завершила летные испытания в начале 1966 года и поступила на вооружение в 1968 году. Она имела дальность полета 10 186 км и оснащалась одной боеголовкой мощностью 600 кт. Всего было построено около 100 ракет, а RT-2 была снята с вооружения в 1976 году вместе с оставшимися Р-9."
 SOV_icbm_equipment_3:0 "Р-36M Сатана"
 SOV_icbm_equipment_3_short:0 "Р-36M Сатана"
 SOV_icbm_equipment_3_desc:0 "Р-36М была значительно улучшенной и гораздо более смертоносной версией Р-36. Двухступенчатая МБР, способная пролететь 16000 км, она могла нести 10 и более боеголовок, а благодаря своей конструкции, быстрому времени перезарядки и большому количеству возвращаемых аппаратов, давала Советам преимущество в возможностях первого удара. Разработка Р-36М началась в конце 1970-х годов, и к моменту распада СССР насчитывалось 308 пусковых шахт для этой ракеты, каждая из которых вмещала не менее 2 боеголовок. Некоторые Р-36М находятся в эксплуатации и сегодня."
 SOV_icbm_equipment_4:0 "РТ-23 Молодец"
 SOV_icbm_equipment_4_short:0 "РТ-23 Молодец"
 SOV_icbm_equipment_4_desc:0 "РТ-23 была разработана как система оружия с несколькими пусковыми платформами, способная вести огонь из бункера и вагона. Она проходила испытания в начале 80-х годов и была принята на вооружение в 1987 году. Дальность действия РТ-23 составляла 11000 км, и она могла нести 10 реактивных снарядов РГЧ ИН мощностью 550 кт. В сентябре 1991 года было развернуто около 90 ракет, а когда Советский Союз распался, производство было закрыто."
 SOV_icbm_equipment_5:0 "РТ-2ПМ2 Тополь-М"
 SOV_icbm_equipment_5_short:0 "РТ-2ПМ2 Тополь-М"
 SOV_icbm_equipment_5_desc:0 "РТ-2ПМ2 - один из последних проектов МБР, находящихся на вооружении России, и первая российская ракета, произведенная после распада Советского Союза. Разработанная в конце 1980-х годов в ответ на американскую стратегическую оборонную инициативу, она окончательно вошла в эксплуатацию в 1998 году. Трехступенчатая, РТ-2ПМ2 имеет максимальную дальность 11500 км и боеголовку мощностью 1 мегатонна. В настоящее время развернуто около 90 единиц"..
 
 SOV_cruisemissile_equipment_0:0 "Челомей 14Кх"
 SOV_cruisemissile_equipment_0_short:0 "Челомей 14Кх"
 SOV_cruisemissile_equipment_0_desc:0 "В октябре 1944 года, будучи озабоченным ракетами В-1 и В-2, Сталин поручил Владимиру Челомею исследовать и разработать аналогичное оружие. Первой попыткой Челомея был переделанный В-1 под названием 10Кх, оснащенный тем же двигателем, что и В-1. 14КХ была пересмотренной и улучшенной версией, со стабилизаторами и крыльями, а также более совершенной общей конструкцией и большим радиусом действия."
 SOV_cruisemissile_equipment_1:0 "Челомей 18Кх"
 SOV_cruisemissile_equipment_1_short:0 "Челомей 18Кх"
 SOV_cruisemissile_equipment_1_desc:0 "Ракета 18Кх была более поздней в линейке ракет Челомея. Когда она была произведена, она имела те же улучшения, что и 14Кх, что и 10Кх. Она могла лететь дальше, имела большую боеголовку, была более стабильной и имела более мощный двигатель Д-6. Однако это все еще была очень ранняя и рудиментарная разработка в области крылатых ракет."
 SOV_cruisemissile_equipment_2:0 "Ла-350 Буря"
 SOV_cruisemissile_equipment_2_short:0 "Ла-350 Буря"
 SOV_cruisemissile_equipment_2_desc:0 "Буря - сверхзвуковая межконтинентальная крылатая ракета, разработанная в 1954 году. Она могла развивать скорость 6000 км на скорости 3 маха с небольшой боеголовкой размером с бомбу, работая на двухступенчатом двигателе, состоящем из ракетного ускорителя и реактивного двигателя. Однако проект был отменен в 1960 году из-за преимуществ ИК- и МБР, а именно большей простоты и относительной неуязвимости для перехвата, которыми Ла-350 не обладала."
 SOV_cruisemissile_equipment_3:0 "РСС-40 Буран"
 SOV_cruisemissile_equipment_3_short:0 "РСС-40 Буран"
 SOV_cruisemissile_equipment_3_desc:0 "Буран был межконтинентальной крылатой ракетой, схожей по концепции с Ла-350, и фактически разрабатывался параллельно с Бурей, получив разрешение через несколько недель после Ла-350. Она имела больший радиус действия, более высокую максимальную скорость и могла нести большую боеголовку, но ее постигла та же участь, что и Ла-350, когда она была отменена в ноябре 1957 года."
 SOV_cruisemissile_equipment_4:0 "Радуга РК-55"
 SOV_cruisemissile_equipment_4_short:0 "Радуга РК-55"
 SOV_cruisemissile_equipment_4_desc:0 "РК-55 - крылатая ракета наземного и подводного базирования, способная нести ядерную боеголовку. Впервые разработанная в конце 1960-х годов, РК-55 прошла испытательные полеты в 1976 году. В 1987 году, когда она должна была поступить на вооружение, она была запрещена в соответствии с положениями Договора о ядерных силах средней дальности. По сообщениям из современных источников, она была переделана в обычное оружие и до сих пор используется на подводных лодках."
 SOV_cruisemissile_equipment_5:0 "3М-54 Калибр"
 SOV_cruisemissile_equipment_5_short:0 "3М-54 Калибр"
 SOV_cruisemissile_equipment_5_desc:0 "3M-54 - чрезвычайно универсальная сверхзвуковая крылатая ракета. Она может запускаться с земли, с воздуха, с надводных кораблей и подводных лодок, и сегодня широко используется российскими военными. Впервые разработанная в конце 1980-х годов, ракета 3М-54 поступила на вооружение в 1994 году. Она имеет дальность 660 км и может нести до 500 кг ядерного или обычного оружия."
 SOV_cruisemissile_equipment_6:0 "3М22 Циркон"
 SOV_cruisemissile_equipment_6_short:0 "3M22 Циркон"
 SOV_cruisemissile_equipment_6_desc:0 "3М22 - это противокорабельная гиперзвуковая крылатая ракета с реактивным двигателем, проходящая испытания в России. Прототипы впервые были запущены в 2012 году с самолета Ту-22М3, а в 2016 году - с наземной платформы. В 2019 году Владимир Путин заявил, что она способна развивать скорость 9 Махов. Считается, что ее дальность полета составляет около 500 км, и она способна нести боеголовку весом до 400 кг."
 
