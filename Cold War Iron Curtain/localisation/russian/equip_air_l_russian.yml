 SPR_heavy_fighter_equipment_3:0 "Локхид P-38L «Лайтнинг»"
 SPR_heavy_fighter_equipment_3_short:0 "P-38L «Лайтнинг»"
 SPR_heavy_fighter_equipment_3_desc:0 "Двухместный самолет с поршневым двигателем, созданный с упором на скорость и тяжелое вооружение. Во время Второй мировой войны его скорость использовалась во многих атаках над Тихим океаном, в результате которых было уничтожено множество японских самолетов. Благодаря своей характерной форме он получил название "der Gabelschwanz-Teufel" или "вилохвостый дьявол" в Германии и "Ni hikouki, ippairotto" или "два самолета, один пилот" в Японии. Он также известен как «Лайтнинг»."

 SPR_jet_multirole_equipment_1:0 "Hispano Aviación HA-1112-M1L Buchon"
 SPR_jet_multirole_equipment_1_short:0 "HA-1112-M1L Buchon"
 SPR_jet_multirole_equipment_2:0 "Норт Американ F-86A «Сейбр»"
 SPR_jet_multirole_equipment_2_short:0 "F-86A «Сейбр»"
 SPR_jet_multirole_equipment_2_desc:0 "F-86 - реактивный истребитель со стреловидным крылом, разработанный и представленный в конце 1940-х годов на основе исследований, захваченных у немцев. Конструкция самолета обеспечивала ему трансзвуковые скорости и высокую маневренность, что позволило ему справиться со своим знаменитым конкурентом - МиГ-15. Официально известный как «Сейбр» или «Сейбрджет», F-86, а также его канадский и австралийский варианты, вместе взятые, стали самыми производимыми западными истребителями в истории авиации."
 SPR_jet_multirole_equipment_3:0 "Норт Американ F-86F «Сейбр»"
 SPR_jet_multirole_equipment_3_short:0 "F-86F «Сейбр»"
 SPR_jet_multirole_equipment_3_desc:0 "Улучшенная система управления полетом и "цельноповоротный хвост" (Эта система сменилась на полностью силовое управление с "искусственным ощущением", встроенным в органы управления самолета, чтобы придать пилоту усилия на стике, которые были еще обычными, но достаточно легкими для превосходного боевого управления). «Сейбр» F имели значительно улучшенную скоростную маневренность в сочетании с более высокой посадочной скоростью - более 145 миль/ч (233 км/ч)."
 SPR_jet_multirole_equipment_4:0 "Норт Американ F-86F-30 «Сейбр»"
 SPR_jet_multirole_equipment_4_short:0 "F-86F-30 «Сейбр»"
 SPR_jet_multirole_equipment_4_desc:0 "Дальнейшее совершенствование «Сейбра»  F-86F с целью повышения ее боевой эффективности против новых самолетов, оснащенных форсажной камерой, путем оснащения их жесткими точками и направляющими для запуска ракет AIM-9B Sidewinders."
 SPR_jet_multirole_equipment_5:0 "Локхид F-104G «Старфайтер»"
 SPR_jet_multirole_equipment_5_short:0 "F-104G «Старфайтер»"
 SPR_jet_multirole_equipment_6:0 "Макдоннел-Дуглас F-4C «Фантом» II"
 SPR_jet_multirole_equipment_6_short:0 "F-4C «Фантом» II"
 SPR_jet_multirole_equipment_7:0 "Дассо «Мираж» F1CE"
 SPR_jet_multirole_equipment_7_short:0 "«Мираж» F1CE"
 SPR_jet_multirole_equipment_8:0 "Дассо «Мираж» F1EE"
 SPR_jet_multirole_equipment_8_short:0 "«Мираж» F1EE"
 SPR_jet_multirole_equipment_9:0 "Макдоннел-Дуглас F/A-18 «Хорнет»"
 SPR_jet_multirole_equipment_9_short:0 " F/A-18 «Хорнет»"
 SPR_jet_multirole_equipment_9_desc:0 "F/A-18 «Хорнет» компании McDonnell Douglas - двухдвигательный сверхзвуковой всепогодный многоцелевой боевой самолет, предназначенный как для истребительной, так и для ударной авиации (отсюда и обозначение F/A). Разработанный компаниями McDonnell Douglas (ныне входит в состав Boeing) и Northrop(ныне входит в состав Northrop Grumman), F/A-18 был создан на базе YF-17 последней в 1970-х годах для использования в ВМС и морской пехоте США. Кроме того, «Хорнет» используется в ВВС ряда других стран, а ранее - в летно-демонстрационной эскадрилье ВМС США "Голубые Ангелы". "
 SPR_jet_multirole_equipment_10:0 "Макдоннел-Дуглас EF-18 «Хорнет»"
 SPR_jet_multirole_equipment_10_short:0 "EF-18 «Хорнет»"
 SPR_jet_multirole_equipment_10_desc:0 "Испанские «Хорнеты» работают как всепогодный перехватчик 60% времени и как всепогодный дневной/ночной штурмовик остальное время. В случае войны каждая из фронтовых эскадрилий будет выполнять основную роль: 121-й эскадрилье поручена тактическая авиационная поддержка и морские операции; 151-й и 122-й - всепогодный перехват и воздушный бой; 152-й - SEAD."

 SPR_mr_stealth_fighter_equipment_1:0 "Еврофайтер EF-2000 Тайфун"
 SPR_mr_stealth_fighter_equipment_1_short:0 "EF-2000 Тайфун"

 SPR_cv_mr_stealth_fighter_equipment_1:0 "Локхид Мартин F-35C «Лайтнинг» II"
 SPR_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C «Лайтнинг» II"
 SPR_cv_mr_stealth_fighter_equipment_1_desc:0 "F-35C - это вариант самолета семейства F-35 «Лайтнинг» II компании Локхид Мартин с катапультным взлетом и аварийным приводнением (CATOBAR), предназначенный в основном для базирования на авианосцах. Разработка программы F-35 началась в 1992 г., а вариант С поднялся в воздух уже в 2010 г. и менее чем через четыре года начал эксплуатироваться с авианосцев. По сравнению со своими собратьями, вариант C отличается более крупными крыльями со складывающимися секциями законцовок крыла."
 
 SPR_jump_stealth_equipment_1:0 "Локхид Мартин F-35B «Лайтнинг» II"
 SPR_jump_stealth_equipment_1_short:0 "F-35B «Лайтнинг» II"
 SPR_jump_stealth_equipment_1_desc:0 "Многоцелевой истребитель, созданный по проекту JSF (Joint Strike Fighter). Этот стелс-истребитель способен применять различные виды вооружений в бою "воздух-воздух" и "земля-земля", однако стоимость его закупки более приемлема, чем у F-22A. В соответствии с его назначением существует несколько типов истребителей. Тип "В", используемый Корпусом морской пехоты США, совместим с системой ОВВП(обычный взлет/вертикальная посадка). Его прозвище - «Лайтнинг» II."
 
