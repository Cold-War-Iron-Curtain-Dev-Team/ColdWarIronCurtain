 DEN_recon_equipment_0_short:0 "Spitfire PR.XI"
 DEN_recon_equipment_0_desc:0 "Photo reconnaissance variant of the venerable Supermarine Spitfire armed with cameras."
 DEN_jet_recon_equipment_0:0 "Lockheed RT-33A Shooting Star"
 DEN_jet_recon_equipment_0_short:0 "RT-33A Shooting Star"
 DEN_jet_recon_equipment_0_desc:0 "RT-33A modified before delivery as a single-seat reconnaissance variant; 85 built, mainly for export under the Military Assistance Program."
 DEN_jet_recon_equipment_1:0 "SAAB RF-35 Draken"
 DEN_jet_recon_equipment_1_short:0 "RF-35 Draken"
 DEN_jet_recon_equipment_1_desc:0 "Single-seat reconnaissance version of the Swedish Draken for the Royal Danish Air Force armed with cameras."
 DEN_jet_recon_equipment_2:0 "Lockheed RF-16A Fighting Falcon"
 DEN_jet_recon_equipment_2_short:0 "RF-16A Fighting Falcon"
 DEN_jet_recon_equipment_2_desc:0 "The designation RF-16A is used, though, by the Royal Danish Air Force. In early 1994, 10 Danish F-16A were redesignated as RF-16A tactical recce aircraft, replacing the RF-35 Drakens withdrawn at the end of 1993. As a temporary measure they were originally fitted with the Drakens' optical cameras and electro-optical (E-O) sensors repackaged in a Per Udsen 'Red Baron' recce pod, which were replaced a few years later by Per Udsen's Modular Reconnaissance Pod (MRP)."

 DEN_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 DEN_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 DEN_mr_stealth_fighter_equipment_1_desc:0 "The F-35A is the conventional takeoff and landing (CTOL) variant of Lockheed Martin's F-35 Lightning II family. The F-35 program began development in 1992, with the A variant taking to the skies in late 2006 and dropping its first bombs less than six years later. The A variant is the smallest and lightest variant of F-35 and is primarily intended to replace the F-16 Fighting Falcon."

