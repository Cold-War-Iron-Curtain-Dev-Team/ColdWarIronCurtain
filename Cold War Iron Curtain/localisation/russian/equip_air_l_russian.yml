 #Man-portable UAV
 SOV_mp_uav_1:0 "ЭНИКС T10E Элерон-1"
 SOV_mp_uav_1_short:0 "Элерон-1"
 SOV_mp_uav_1_desc:0 "Система дистанционного мониторинга T10 Элерон-1 предназначена для дистанционного наблюдения с воздуха за объектами, включая сооружения, дороги, мосты, транспортные средства, нефте- и газопроводы, линии электропередач, отдельные лица, группы людей."
 SOV_mp_uav_2:0 "ЭНИКС T23E Элерон-3"
 SOV_mp_uav_2_short:0 "Элерон-3"
 SOV_mp_uav_2_desc:0 "Система дистанционного наблюдения T23E 'Элерон-3' предназначена для мониторинга наземных ситуаций. Система автономна и может использоваться с неподготовленных в инженерном отношении площадок в простых погодных условиях, при скорости ветра до 10 м/с, в дневное время, при температуре от минус 20 до плюс 40 градусов и влажности 98%."

 #UAV CAS
 SOV_cas_uav_equipment_1:0 "Туполев Ту-300 Коршун-У"
 SOV_cas_uav_equipment_1_short:0 "Ту-300"
 SOV_cas_uav_equipment_1_desc:0 "Разработка началась в 1982 году, бюро Туполева спроектировало аппарат, используя элементы разведывательного БПЛА предыдущего поколения."
 SOV_cas_uav_equipment_2:0 "Транзас Дозор-3"
 SOV_cas_uav_equipment_2_short:0 "Дозор"
 SOV_cas_uav_equipment_2_desc:0 "Система Дозор-3 относится к классу тяжелых средневысотных БПЛА с большой продолжительностью полета, используемых для патрулирования сухопутных и морских границ и разведки, мониторинга объектов и территорий."
 SOV_cas_uav_equipment_3:0 "Микоян Скат"
 SOV_cas_uav_equipment_3_short:0 "Скат"
 SOV_cas_uav_equipment_3_desc:0 "Микоян Скат- разведывательный и ударный беспилотный летательный аппарат. Упор был сделан на малозаметность, поэтому беспилотник был разработан в конфигурации летающего крыла, в форме треугольника, с использованием композитных материалов и с вооружением, спрятанным в двух внутренних отсеках для оружия."
 
 #Naval CAS
 SOV_naval_uav_equipment_1:0 "Яковлев Пчела-1Т" 
 SOV_naval_uav_equipment_1_short:0 "Пчела-1Т"
 SOV_naval_uav_equipment_1_desc:0 "Яковлев Пчела-1T" - беспилотный летательный аппарат (БПЛА), произведенный российским КБ Яковлева. Первый полет состоялся в 1990 году. Основное назначение - наблюдение и контроль в боевых условиях с передачей видеоизображения. Является частью комплекса наблюдения Строй-П. Другие варианты применения и использования включают целеуказание и в качестве учебной мишени. Запуск Пчелы осуществляется с помощью двух твердотопливных ракетных двигателей, а возвращение - с помощью парашюта."
 SOV_naval_uav_equipment_2:0 "Яковлев Пчела-1M"
 SOV_naval_uav_equipment_2_short:0 "Пчела-1М"
 SOV_naval_uav_equipment_2_desc:0 "Модифицированная версия БПЛА Пчела-1Т с новой авионикой для комплекса Строй-ПМ."
 SOV_naval_uav_equipment_3:0 "Яковлев Пчела-1К"
 SOV_naval_uav_equipment_3_short:0 "Пчела-1К"
 SOV_naval_uav_equipment_3_desc:0 "Модификация Пчела-1М, с установкой высотного двигателя и улучшенного бортового оборудования для работы в условиях недостаточной освещенности."

