 YUG_jet_multirole_equipment_1:0 "Ikarus S-49"
 YUG_jet_multirole_equipment_1_short:0 "S-49"
 YUG_jet_multirole_equipment_1_desc:0 "The Ikarus S-49 was a Yugoslav single-seat, single-engine fighter aircraft built for the Yugoslav Air Force shortly after World War II. Following the Tito–Stalin Split in 1948, the RV i PVO was left with an aircraft inventory consisting of mostly Soviet aircraft. Unable to acquire new aircraft or spare parts for its existing fleet, the RV i PVO turned to its domestic aviation industry in order to create an indigenous design to fulfill the need for additional aircraft." 
 YUG_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 YUG_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 YUG_jet_multirole_equipment_3:0 "North American F-86E Sabre"
 YUG_jet_multirole_equipment_3_short:0 "F-86E Sabre"
 YUG_jet_multirole_equipment_4:0 "North American F-86H Sabre"
 YUG_jet_multirole_equipment_4_short:0 "F-86H Sabre"
 YUG_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 YUG_jet_multirole_equipment_5_desc:0 "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 YUG_jet_multirole_equipment_5_short:0 "L-12"
 YUG_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PFM"
 YUG_jet_multirole_equipment_6_desc:0 "East German designed MiG-21 updated with RP-21 radars."
 YUG_jet_multirole_equipment_6_short:0 "L-14"
 YUG_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-21M "
 YUG_jet_multirole_equipment_7_desc:0 "Export variant of the MiG-21S with two major differences the RP-22 radar of the MiG-21S was substituted with the older RP-21MA radar, and featured a built-in GSh-23L cannon instead of a cannon pod. In the air-to-air role it could only carry the R-3S IR-seeking AAM on its four pylons, as the SARH variant, the R-3R, was not cleared for export."
 YUG_jet_multirole_equipment_7_short:0 "L-15"
 YUG_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-21bis"
 YUG_jet_multirole_equipment_8_desc:0 "The ultimate development of the MiG-21, fitted with the Tumanskiy R25-300 turbojet engine and a great number of other advances over previous types."
 YUG_jet_multirole_equipment_8_short:0 "L-17"
 YUG_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-21bis-K"
 #YUG_jet_multirole_equipment_9_desc:0 ""
 YUG_jet_multirole_equipment_9_short:0 "L-17K"
 YUG_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29"
 YUG_jet_multirole_equipment_10_desc:0 "Yugoslavia was the first European country outside the Soviet Union to operate the MiG-29"
 YUG_jet_multirole_equipment_10_short:0 "L-18"
 
 YUG_mr_stealth_fighter_equipment_1:0 "SOKO L-19 Novi Avion"
 YUG_mr_stealth_fighter_equipment_1_short:0 "L-19"
 YUG_mr_stealth_fighter_equipment_1_desc:0 "The Novi Avion (New Aeroplane) was a fourth generation multi-role combat aircraft programme that was to be built by Yugoslav aircraft manufacturer SOKO. The Avion featured a cropped delta-canard configuration and was to be capable of achieving supersonic speeds under a combat configuration. The Avion shared several areas of commonality with French company Dassault Aviation's Rafale fighter aircraft; France had provided considerable technical assistance to Yugoslavia during the course of the Avion programme." 

