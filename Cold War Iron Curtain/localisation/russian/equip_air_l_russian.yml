 #IRBM
 irbm_equipment_1:0 "БРСД I"
 irbm_equipment_1_short:0 "БРСД I"
 irbm_equipment_1_desc:0 "БРСД - это баллистические ракеты средней дальности с дальностью полета 3 000-5 500 км, находящиеся между баллистической ракетой почти средней дальности (БРПСД) и межконтинентальной баллистической ракетой (МБР). Классификация баллистических ракет по дальности сделана в основном для удобства; в принципе, разница между малоэффективной МБР и высокоэффективной МБР очень мала, поскольку уменьшение массы полезной нагрузки может увеличить дальность сверх порога МБР."
