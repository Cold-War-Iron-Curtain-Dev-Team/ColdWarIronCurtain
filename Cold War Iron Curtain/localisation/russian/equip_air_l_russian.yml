 #ISR_stealth_tactical_bomber_equipment_1_short:0 "F-117A Nighthawk"
 #ISR_stealth_tactical_bomber_equipment_1_desc:0 "The first ever stealth attacker, specialized for secret bombing runs. As the design is focused entirely on stealth capabilities the aircraft is lacking in speed and maneuverability. On the flipside, however, remaining off enemy radar allows it to use guided bombs to perform pinpoint strikes. It has a unique shape comprised of plane surfaces and a special paint job in order to reflect and absorb radar waves. Known as the 'Nighthawk', it gained recognition during the 1991 Gulf War for flying more than 1200 sorties without a single one of the aircraft being shot down."
