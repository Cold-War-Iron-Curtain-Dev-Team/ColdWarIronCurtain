 #Missiles

 USA_slbm_equipment_1:0 "UGM-19 Юпитер S"
 USA_slbm_equipment_1_short:0 "Юпитер S"
 USA_slbm_equipment_1_desc:0 "UGM-19 - это запускаемый с подводной лодки вариант ракеты PGM-19, используемой армией США. Благодаря своей короткой, приземистой форме, 'Юпитер S' мог легко устанавливаться на надводные корабли и подводные лодки."
 USA_slbm_equipment_2:0 "UGM-27A Поларис"
 USA_slbm_equipment_2_short:0 "Поларис A"
 USA_slbm_equipment_2_desc:0 "Представленная в 1961 году, UGM-27A была заменой ракеты Юпитер в качестве БРПЛ. Двухступенчатая ракета с ядерной головкой, 'Поларис' предназначалась для контрудара второго удара (поскольку КЭП была недостаточно хороша для контрудара первого удара) как часть вклада ВМС в арсенал ядерного оружия США, заменив крылатую ракету SSM-N-8 Regulus."
 USA_slbm_equipment_3:0 "UGM-27B Поларис"
 USA_slbm_equipment_3_short:0 "Поларис B"
 USA_slbm_equipment_3_desc:0 "Также известный как 'Поларис А-2', этот модернизированный вариант UGB-27 был оснащен новой ядерной боеголовкой W-47, которая увеличивала мощность взрыва. Однако проблемы с механическим вооружением и предохранителем привели к тому, что срок службы этой ракеты закончился, и она была быстро заменена на UGM-27C."
 USA_slbm_equipment_4:0 "UGM-27C Поларис"
 USA_slbm_equipment_4_short:0 "Поларис C"
 USA_slbm_equipment_4_desc:0 "Также известная как 'Поларис А-3', эта версия заменила более раннюю W-47 на W-58, ядерную боеголовку, которая функционирует как Разделяющаяся головная часть с блоками индивидуального наведения, разделяясь на три отдельные боеголовки, которые могут доставить 200 кт полезной нагрузки каждая, или могут быть сохранены вместе для теоретической мощности в 1 мегатонну. Для защиты электронных систем ракеты от воздействия ядерного электромагнитного импульса на активном участке было применено ограниченное упрочнение."
 USA_slbm_equipment_5:0 "UGM-73 Посейдон"
 USA_slbm_equipment_5_short:0 "Посейдон"
 USA_slbm_equipment_5_desc:0 "UGM-73 - это двухступенчатая твердотопливная БРПЛ с ракетным двигателем, которая заменила более раннюю Поларис в 1971-72 годах. Оснащенный 10-14 боеголовками W-68 мощностью 40-50 кт, 'Посейдон' был ракетой с MIRV, способной нести большую полезную нагрузку и улучшенной точностью по сравнению со своим непосредственным предшественником, и был наиболее оснащенной единицей на американских атомных подводных лодках с баллистическими ракетами в течение 70-х и 80-х годов."
 USA_slbm_equipment_6:0 "UGM-96 Трайдент I"
 USA_slbm_equipment_6_short:0 "Трайдент I"
 USA_slbm_equipment_6_desc:0 "UGM-96 была разработана в 1979 году как преемница БРПЛ Посейдон. Это трехступенчатая твердотопливная ракета, оснащенная восемью ядерными боеголовками W-76, каждая из которых обладает мощностью около 100 кт, что в пять раз превышает мощность бомбы Толстяк, разрушившей Нагасаки. 'Трайдент I' оставался на вооружении до полного снятия с вооружения в 2005 году."
 USA_slbm_equipment_7:0 "UGM-133 Трайдент II"
 USA_slbm_equipment_7_short:0 "Трайдент II"
 USA_slbm_equipment_7_desc:0 "Современная ракета, используемая подводными лодками ВМС США, UGM-133 - это мощное оружие, с которым необходимо считаться. Имея дальность более 7500 миль (12 000 км) и будучи оснащенной 8-14 ракетами либо W-76, которые использовались на ее предшественнице, либо более разрушительной W-88 с ядерной мощностью 425 кт, 'Трайдент II' будет оставаться грозным средством сдерживания для Соединенных Штатов в обозримом будущем."
 
 USA_irbm_equipment_1:0 "PGM-17 Тор"
 USA_irbm_equipment_1_short:0 "Тор"
 USA_irbm_equipment_1_desc:0 "Первая оперативная баллистическая ракета, используемая ВВС США, PGM-17 (первоначальное обозначение - SM-75) была разработана в 1956 году из опасений советской разработки ракет большой дальности. Типовые боеголовки имели мощность 1,44 мегатонны, что делало их очень мощным оружием. Хотя они были сняты с вооружения в 1963 году, 'Тор' мог быть вновь активирован в мгновение ока, чтобы поразить цель подобно молнии."
 USA_irbm_equipment_2:0 "PGM-19 Юпитер  A"
 USA_irbm_equipment_2_short:0 "Юпитер А"
 USA_irbm_equipment_2_desc:0 "PGM-19 была первой баллистической ракетой средней дальности с ядерной головкой, использовавшейся ВВС США. Первоначально разработанная для армии и флота США, ракета сохранила приземистую форму для использования на подводных лодках, несмотря на то, что ВМС в конечном итоге предпочли разработать ракету Поларис. 'Юпитер', названный в честь римского царя богов, будет оснащен ядерной боеголовкой мощностью 1,1 мегатонны."
 USA_irbm_equipment_3:0 "PGM-19 Юпитер C"
 USA_irbm_equipment_3_short:0 "Юпитер C"
 USA_irbm_equipment_3_desc:0 "Представленный в 1958 году как модернизация PGM-19A, 'Юпитер-С' был разработан с удлиненным фюзеляжем, чтобы позволить использовать несколько твердотопливных ракет. Хотя он использовался для испытаний повторного входа отработанных ракет, он был перепрофилирован в БРСД."
 USA_irbm_equipment_4_short:0 "Юнона I"
 USA_irbm_equipment_4_desc:0 "Разработанная на основе Юпитера-С, 'Юнона' (названная в честь римской царицы богов) взяла модель Юпитера-С и включила четвертую ступень, которая была установлена поверх "трубы" третьей ступени и запускалась после выгорания третьей ступени для увеличения полезной нагрузки. Эта система была использована для запуска спутников, и именно она вывела в космос первый американский спутник 'Эксплорер-1'. В качестве МБР включенная четвертая ступень увеличила бы дальность полета ядерного боезаряда (который, скорее всего, был бы таким же, как у более раннего Юпитера) примерно до 2000 км или ~1250 миль)."
 USA_irbm_equipment_5:0 "PGM-19E Юнона II"
 USA_irbm_equipment_5_short:0 "Юнона II"
 USA_irbm_equipment_5_desc:0 "Юнона II является дальнейшим развитием Юнона I, хотя в отличие от своего предшественника, он берет пример с модели Юпитер-A, от которой Юнона II использует ракеты первой ступени. Для второй, третьей и четвертой ступеней используется ракетная платформа, заимствованная из ракетного комплекса MGM-29 «Редстоун». Использовалась в качестве стартовых платформ для более поздних спутников Эксплорер, а также Pioneer 4 (первый американский спутник, сошедший с околоземной орбиты и ставший первым успешным лунным зондом), гипотетическая версия в качестве баллистической ракеты может иметь дальность до ~2500 км (~1550 км)."
 USA_irbm_equipment_6:0 "MGM-31C Першинг II"
 USA_irbm_equipment_6_short:0 "Першинг II"
 USA_irbm_equipment_6_desc:0 "Поступившая на вооружение в 1983 году, ракета MGM-31C была разработана как модернизация ракет Першинг I и Першинг Ia, что послужило причиной ее обозначения как 'Першинг II' (Першинг была названа в честь Джона Дж. Першинга, одного из двух человек в звании "генерала армий" или шестизвездочного генерала). Он был оснащен боеголовкой, которая могла переключаться от 5 кт до 80 кт."
 USA_irbm_equipment_7:0 "MGM-31D Першинг III"
 USA_irbm_equipment_7_short:0 "Першинг III"
 USA_irbm_equipment_7_desc:0 "Разработанный как продолжение системы Першинг, 'Першинг III' был четырехступенчатой версией весом 25 000 фунтов (11 000 кг), которая должна была заменить LGM-118 «Пискипер». В связи с ограничениями, предусмотренными Договором о сокращении стратегических вооружений. Она должна была запускаться с модифицированных пусковых установок M1003 - третьей модификации для третьего типа ракет 'Першинг'."
 USA_irbm_equipment_8:0 "MGM-31E Першинг II уменьшенной дальности"
 USA_irbm_equipment_8_short:0 "Першинг II УД"
 USA_irbm_equipment_8_desc:0 "Модифицированная версия более раннего MGM-31C, вариант 'E' был разработан с учетом меньшей дальности, чтобы соответствовать Договору о ядерных силах средней дальности (ЯСД). По сравнению с Першинг II и III, Першинг уменьшенной дальности имел бы оперативный радиус действия ~1200 км (745 миль), что меньше, чем 1770 км (1100 миль)."
 
 USA_srbm_equipment_1:0 "Гермес B-1"
 USA_srbm_equipment_1_short:0 "Гермес"
 USA_srbm_equipment_1_desc:0 "Разработанный в ответ на ракетные атаки нацистской Германии в Европе, Гермес был задуман как испытательный проект, который в конечном итоге стал родоначальником американской ракетной программы. Названный в честь греческого бога-посланника, вариант 'Гермес' B представлял собой крылатую ракету с реактивной тягой со скоростью 4 Маха. Он получил обозначения SSM-G-9 и SSM-A-9."
 USA_srbm_equipment_2:0 "MGM-5 Капрал"
 USA_srbm_equipment_2_short:0 "Капрал"
 USA_srbm_equipment_2_desc:0 "MGM-5 была первой управляемой ракетой Соединенных Штатов, которой было разрешено нести ядерную боеголовку. Тактическая баллистическая ракета 'Капрал' была баллистической ракетой малой дальности с радиусом действия 75 морских миль (140 км). В дополнение к ядерной боеголовке (которая будет введена позже в его карьере), может также оснащаться обычной фугасной ракетой."
 USA_srbm_equipment_3:0 "PGM-11 Редстоун"
 USA_srbm_equipment_3_short:0 "Редстоун"
 USA_srbm_equipment_3_desc:0 "Первая оперативная баллистическая ракета, используемая армией США, PGM-11 (первоначально SSM-G-14 в 1950 году, SSM-A-14 в 1951 году, и M8 и M9 в 1955 году) была прямым потомком нацистской ракеты V-2, разработанной немецкими инженерами-ракетчиками, прибывшими в США в результате Операция «Скрепка». Редстоун, названная в честь одноименного арсенала в Хантсвилле, штат Алабама, где она была разработана, была ракетой малой дальности, которая служила для активной обороны Западной Европы во время холодной войны. Она также была первой ракетой, оснащенной ядерной боеголовкой."
 USA_srbm_equipment_4:0 "MGM-18 Лакросс"
 USA_srbm_equipment_4_short:0 "Лакросс"
 USA_srbm_equipment_4_desc:0 "Тактическое баллистическое оружие малой дальности, предназначенное для непосредственной поддержки наземных войск, MGM-18 было представлено в 1959 году, когда ракета еще находилась на стадии разработки. Хотя она может быть оснащена ядерной боеголовкой HE или 1,5-10 килотонн, проблемы с надежностью, трудности с системой наведения и ее восприимчивость к ECM привели к снятию 'Лакросса' с вооружения несколько лет спустя."
 USA_srbm_equipment_5:0 "MGM-29 Сержант"
 USA_srbm_equipment_5_short:0 "Сержант"
 USA_srbm_equipment_5_desc:0 "Еще один продукт Редстоунского арсенала, MGM-29 был представлен в 1962 году как замена MGM-5 Corporal. Прозванная 'Сержант', эта ракета стала последней ракетой своего типа, названной в честь званий военнослужащих армии США. Помимо ядерной боеголовки мощностью 200 килотонн, MGM-29 может быть оснащена фугасными, биологическими и химическими боеголовками."
 USA_srbm_equipment_6:0 "MGM-31A Першинг 1"
 USA_srbm_equipment_6_short:0 "Першинг 1"
 USA_srbm_equipment_6_desc:0 "MGM-31 была первой в серии баллистических ракет, которая впоследствии стала непрерывной серией баллистических ракет длительного действия, состоящих на вооружении армии США. Принятая на вооружение в 1963 году, MGM-31A была разработана как преемница ракеты Редстоун и первоначально обозначалась как 'Редстоун-S', а затем перешла на обозначение 'Першинг I'. Она была оснащена ядерной боеголовкой мощностью 60-400 килотонн."
 USA_srbm_equipment_7:0 "MGM-52 Лэнс"
 USA_srbm_equipment_7_short:0 "Лэнс"
 USA_srbm_equipment_7_desc:0 "Развернутый в 1972 году, MGM-52 был усовершенствован по сравнению с MGM-29 Сержант, который он заменил, с повышенной точностью и мобильностью. Его полезной нагрузкой была либо ядерная боеголовка W70 (с мощностью от 1 до 100 килотонн), либо фугасная боеголовка с кумулятивным зарядом для подрыва бункеров, либо боеголовка M251 с взрывчатыми суббоеприпасами для роли Stand-Off Dispenser. Имея в своем распоряжении такие универсальные боеголовки, 'Лэнс', безусловно, сможет прорвать оборону противника и проложить путь для продвижения войск."
 USA_srbm_equipment_8:0 "MGM-140A ATACMS Блок I"
 USA_srbm_equipment_8_short:0 "ATACMS Блок I"
 USA_srbm_equipment_8_desc:0 "MGM-140 (первоначально M39) была представлена в 1991 году в качестве замены более ранней MGM-52 Lance в роли обычной БРМД. MGM-140A может запускаться из системы M270 MLRS и содержит боеголовку, несущую до 950 взрывчатых суббоеприпасов с дальностью 80 миль (128 км). Официально известна как ATACMS, сокращение от 'Army TACtical Missile System'."
 USA_srbm_equipment_9:0 "MGM-164 ATACMS Блок II"
 USA_srbm_equipment_9_short:0 "ATACMS Блок II"
 USA_srbm_equipment_9_desc:0 "Первоначально обозначавшийся M39A3, а позднее MGM-140C, MGM-164 является обозначением второго поколения ракет ATACMS. Разработанная во второй половине 1990-х и начале 2000-х годов, ракета должна была оснащаться противотанковыми суббоеприпасами Brilliant, придающими оружию смертоносную мощь против танков времен холодной войны, используемых в эпоху после холодной войны."
 
 USA_icbm_equipment_1:0 "LGM-30A Минитмен I"
 USA_icbm_equipment_1_short:0 "Минитмен I"
 USA_icbm_equipment_1_desc:0 "Ракета LGM-30A (ранее SM-80) была представлена в 1962 году для роли ядерного сдерживания, угрожая Советскому Союзу мощным ответным контрударом, если Соединенные Штаты будут атакованы первыми. Однако из-за наличия у ВМС ракеты Поларис ВВС США было разрешено продолжить разработку ракеты, повысив ее точность. Прозвище 'Минитмен' она получила потому, что, подобно титулованной легкой пехоте времен американской революционной войны, ракета была разработана для мгновенного запуска."
 USA_icbm_equipment_2:0 "LGM-30G Минитмен III"
 USA_icbm_equipment_2_short:0 "Минитмен III"
 USA_icbm_equipment_2_desc:0 "LGM-30G была окончательным развитием платформы МБР Минитмен. После принятия на вооружение в 1972 году это была первая ракетная платформа с боеголовкой MIRV. Боеголовка состояла из трех ядерных боеголовок W62, каждая из которых имела мощность 170 кТ, по сравнению с предшественницей W56 мощностью 1,2 МТ. По состоянию на 2019 год 'Минитмен III' является единственной МБР наземного базирования, находящейся в настоящее время на вооружении США."
 USA_icbm_equipment_3:0 "LGM-70B Минитмен IV"
 USA_icbm_equipment_3_short:0 "Минитмен IV"
 USA_icbm_equipment_3_desc:0 "LGM-70B была дальнейшим развитием платформ Минитмен II. Эти ракеты были оснащены усовершенствованными радиопередатчиками, перешедшими от системы аварийной ракетной связи (САРС), использовавшейся на аналогичных ракетах LEM-70A. Ракета, в свою очередь, будет использоваться как авангард первого удара или удара возмездия, давая команду другим подразделениям SAC по ходу движения, позволяя запускать другие ракеты в быстрой последовательности."
 USA_icbm_equipment_4:0 "LGM-118A Пискипер"
 USA_icbm_equipment_4_short:0 "Пискипер"
 USA_icbm_equipment_4_desc:0 "Представленная в 1986 году как часть проекта президента Рейгана 'Звездные Войны', ракета LGM-118A (также известная как ракета MX) была разработана для того, чтобы позволить США выдержать внезапную атаку советского МБР-флота и затем начать контратаку. Это была ракета MIRV, способная нести 10 ядерных боеголовок W87 мощностью 300 кт в головной части. Однако в связи с договором СНВ-2 (несмотря на то, что Соединенные Штаты так и не ратифицировали этот договор) и тем, что Минитмен может нести одиночные боеголовки гораздо дешевле, 'Пискипер' был снят с вооружения. Его компоненты будут использованы частной фирмой для разработки гражданской расходуемой пусковой системы 'Минотавр IV.'"
 USA_icbm_equipment_5:0 "MGM-134 Midgetman"
 USA_icbm_equipment_5_short:0 "Midgetman"
 USA_icbm_equipment_5_desc:0 "Разработанная в 1991 году в сумерках холодной войны, MGM-134 была разработана как необходимость в малой МБР, которая может быть запущена с дорожных транспортных средств, из-за растущей угрозы советских подводных лодок, которые могли запустить МБР с побережья и лишить США возможности ответного удара. Оснащенная ядерной боеголовкой мощностью 475 кТ, 'Midgetman' будет запускаться с мобильной пусковой установки Hard Mobile Launcher, способной быть защищенной от радиации."

 USA_cruisemissile_equipment_0:0 "JB-2 Лун"
 USA_cruisemissile_equipment_0_short:0 "JB-2 Лун"
 USA_cruisemissile_equipment_0_desc:0 "JB-2 была американской копией немецкой летающей бомбы V-1. Разработанная в 1944 году, она первоначально предназначалась для использования во время Операции «Даунфол», вторжения союзников в Японию. Но из-за применения атомного оружия 'Лун' так и не был использован в бою. Несмотря на это, JB-2 сыграет важную роль в развитии тактических ракетных систем класса "земля-земля"."
 USA_cruisemissile_equipment_1:0 "MGM-1 Матадор"
 USA_cruisemissile_equipment_1_short:0 "MGM-1 Матадор"
 USA_cruisemissile_equipment_1_desc:0 "MGM-1 (первоначально SSM-A-1 в 1949 году, бомбардировщик B-61 по обозначению ВВС США, и TM-61 в 1955 году), была первой крылатой ракетой американской разработки, поступившей на вооружение в 1952 году. Схожая по концепции со своим предшественником, JB-2 Лун, и немецкой V-1, она включала радиокоманду, позволявшую корректировать курс в полете, что позволяло поддерживать точность на больших расстояниях, чем баллистические ракеты. Она может быть оснащена ядерной боеголовкой мощностью от 1 до 120 килотонн, но существуют и варианты с фугасными боеголовками. Ее прозвище - Матадор."
 USA_cruisemissile_equipment_2:0 "SM-62 Снарк"
 USA_cruisemissile_equipment_2_short:0 "SM-62 Снарк"
 USA_cruisemissile_equipment_2_desc:0 "Крылатая ракета межконтинентальной дальности SM-62 (первоначально SSM-A-3 и B-62) - это реактивная ракета с дальностью полета 5500 морских миль (10 200 км), самая дальнобойная крылатая ракета, когда-либо развернутая Соединенными Штатами. Разработанная в качестве временного средства сдерживания, пока МБР находились в стадии разработки, Снарк (названная в честь вымышленного животного из книги Льюиса Кэрролла "Охота на Снарка") должна была быть снята с вооружения, как только МБР будут развернуты в достаточной степени."
 USA_cruisemissile_equipment_3:0 "MGM-13 Мэйс"
 USA_cruisemissile_equipment_3_short:0 "MGM-13 Мэйс"
 USA_cruisemissile_equipment_3_desc:0 "Разработанная в 1956 году как усовершенствование и преемник MGM-1, ракета MGM-13 (первоначально TM-76) могла достигать трансзвуковых скоростей с дальностью от 540 до 1300 миль в зависимости от высоты полета ракеты. В ее системы была интегрирована система сопоставления с радиолокационной картой, позволявшая корректировать курс, если местность не совпадала с фильмом местности для поражения цели. Прозванная 'Мэйс', MGM-13 будет служить в качестве ракеты сдерживания и крылатой ракеты, пока ее не заменят MGM-31 Першинг и BGM-109 соответственно."
 USA_cruisemissile_equipment_4:0 "BGM-109G Грифон"
 USA_cruisemissile_equipment_4_short:0 "BGM-109G Грифон"
 USA_cruisemissile_equipment_4_desc:0 "BGM-109G была заменой более ранней ракеты Mace и была разработана на основе запускаемой с корабля ракеты Томагавк. Принятая на вооружение в 1983 году, BGM-109G была разработана в качестве противодействия мобильной ракете SS-20 Сейбр, используемой Советским Союзом. Оснащенная ядерной боеголовкой W84 переменной мощности (с мощностью в диапазоне 0,2-150 кт), эта ракета, наряду с линейкой БРСД и БРМД Першинг, стала причиной того, что Советский Союз охотнее подписал Договор о ядерных силах средней дальности (ЯСД). Хотя она также известна как крылатая ракета наземного базирования (КРНБ), ее официальное обозначение и прозвище - BGM-109G Грифон."
 USA_cruisemissile_equipment_5:0 "AGM-129 ACM"
 USA_cruisemissile_equipment_5_short:0 "ACM"
 USA_cruisemissile_equipment_5_desc:0 "Представленная в 1990 году, AGM-129 ACM (сокращение от Advanced Cruise Missile) была малозаметной крылатой ракетой воздушного базирования, которую несли исключительно стратегические бомбардировщики ВВС США B-52H «Стратофортресс». Ее разработка была вызвана опасениями, что AGM-86 будет трудно пробить будущие системы ПВО. Хотя ракета способна нести ядерную боеголовку W80 (как и ее предшественница, с мощностью 5-150 кт), вариант 'C' этой ракеты имеет обычную фугасную боеголовку."
 USA_cruisemissile_equipment_6:0 "AGM-158 JASSM"
 USA_cruisemissile_equipment_6_short:0 "JASSM"
 USA_cruisemissile_equipment_6_desc:0 "AGM-158 представляет собой вершину технологии крылатых ракет. Переняв у AGM-129 потребность в малозаметной, автономной ракете воздушного базирования, AGM-158, представленная в 2009 году, способна запускаться с различных современных боевых самолетов, от истребителей F-35 и F-15E до бомбардировщиков B-52H и B-1B. Получившая обозначение JASSM (Joint Air-to-Surface Standoff Missile), AGM-158 отличается от большинства крылатых ракет тем, что не обладает ядерным потенциалом, являясь исключительно крылатой ракетой с обычной боеголовкой."

 USA_coastalmissile_equipment_3:0 "BGM-84A Гарпун"
 USA_coastalmissile_equipment_3_short:0 "BGM-84A Гарпун"
 USA_coastalmissile_equipment_4:0 "BGM-84C Гарпун"
 USA_coastalmissile_equipment_4_short:0 "BGM-84C Гарпун"
 USA_coastalmissile_equipment_5:0 "BGM-109B TASM"
 USA_coastalmissile_equipment_5_short:0 "BGM-109B TASM"
 
 #Helicopter

 USA_naval_helicopter_equipment_1:0 "Piasecki HUP-2S Retriever"
 USA_naval_helicopter_equipment_1_short:0 "HUP-2S Retriever"
 USA_naval_helicopter_equipment_1_desc:0 "Версия HUP-2 для противолодочной войны, оснащенная гидролокатором погружения. Piasecki HUP Retriever/H-25 Army Mule - компактный вертолет общего назначения с одним радиальным двигателем и двумя перекрывающимися тандемными несущими винтами, разработанный компанией Piasecki Helicopter Corporation из Мортона, штат Пенсильвания. Разработанный по спецификации ВМС США, вертолет производился с 1949 по 1954 год, а также использовался армией США и иностранными военно-морскими силами."
 USA_naval_helicopter_equipment_2:0 "Сикорский HSS-1 «Сибат»"
 USA_naval_helicopter_equipment_2_short:0 "HSS-1 «Сибат»"
 USA_naval_helicopter_equipment_2_desc:0 "HSS - противолодочный вариант S-58 компании Sikorsky, модернизированная версия S-55 (и военного H-19 Chickasaw). Он имел меньшую носовую часть, но хвостовую часть фюзеляжа и шасси, а не 4-х стоечную схему, как у предшественника. Позже переименованный в SH-34G, противолодочные варианты этого вертолета получили официальное прозвище «Сибат»."
 USA_naval_helicopter_equipment_3:0 "Каман SH-2D «Сиспрайт»"
 USA_naval_helicopter_equipment_3_short:0 "SH-2D «Сиспрайт»"
 USA_naval_helicopter_equipment_3_desc:0 "Представленный в начале 1960-х годов в качестве замены SH-34 «Сибат», SH-2 (первоначальное обозначение HU2K) стал первым противолодочным вертолетом, способным размещаться на американских судах, помимо авианосцев. Эта портативность продлила карьеру «Сиспрайт», и существовали модернизированные варианты. Вариант, изображенный на игре, - это вариант "D", первоначальный противолодочный вариант."
 USA_naval_helicopter_equipment_4:0 "Сикорский SH-3A «Си Кинг»"
 USA_naval_helicopter_equipment_4_short:0 "SH-3A «Си Кинг»"
 USA_naval_helicopter_equipment_4_desc:0 "Разработанный на основе гражданского вертолета Сикорский S-61, SH-3 (первоначальное обозначение HSS-2) является двухдвигательным вертолетом ПЛО. Это был первый в мире вертолет-амфибия, способный взлетать как с суши, так и с моря. Наряду со своим современником «Сиспрайт», это был один из первых вертолетов ПЛО с турбовальными двигателями. Помимо задач ПЛО, SH-3 также выполнял функции поисково-спасательного вертолета (ПСВ), транспортного вертолета, вертолета медицинской эвакуации и вертолета раннего предупреждения, а несколько вертолетов использовались в качестве "Marine One" - официального вертолета для перевозки президентов США. Именно по этой причине он получил прозвище ««Си Кинг»», самый универсальный вертолет в мире."
 USA_naval_helicopter_equipment_5:0 "Сикорский SH-60B «Сихок»"
 USA_naval_helicopter_equipment_5_short:0 "SH-60B «Сихок»"
 USA_naval_helicopter_equipment_5_desc:0 "SH-60 - это вариант вертолета UH-60 Блэкхок армии США, разработанный ВМС США. (Несмотря на замену более ранней модели «Си Кинг», SH-60 не имеет возможности десантирования, но сохраняет способность SH-2 садиться на любой американский корабль, способный разместить вертолеты. Способный выполнять многие из тех же функций, что и SH-3, «Сихок» представляет собой будущее вертолетной авиации ВМС США."
 USA_naval_helicopter_equipment_6:0 "Сикорский SH-60F «Сихок»"
 USA_naval_helicopter_equipment_6_short:0 "SH-60F «Сихок»"
 USA_naval_helicopter_equipment_6_desc:0 "SH-60F в первую очередь служил основным противолодочным самолетом (ПЛС) авианосной боевой группы. Вертолет охотился за подводными лодками с помощью погружного гидролокатора AQS-13F и нес 6-трубную установку для запуска сонобуев. SH-60F получил неофициальное название «Оушенхок». SH-60F может нести торпеды Mk 46, Mk 50 или Mk 54 в качестве наступательного оружия, а для самообороны у него есть выбор установленных на фюзеляже пулеметов, включая M60D, M240D и GAU-16 (калибр .50)."
 USA_naval_helicopter_equipment_7:0 "Сикорский MH-60R «Сихок»"
 USA_naval_helicopter_equipment_7_short:0 "MH-60R «Сихок»"
 USA_naval_helicopter_equipment_7_desc:0 "MH-60R «Сихок» - это модернизированная версия SH-60 «Сихок». Разработанный в 1993 году, MH-60R был спроектирован таким образом, чтобы объединить характеристики более ранних SH-60B и SH-60F. Его датчики включают в себя пакет ASE, MTS-FLIR, многорежимный радар AN/APS-147/IFF, усовершенствованный канал передачи данных воздушного флота и более совершенный активный гидролокатор воздушного базирования. Это, в сочетании с улучшенной системой вооружения (позволяющей нести усовершенствованную торпеду Mk 54 и ракеты AGM-114 «Хеллфайр»), позволяет «Сихоку» проявлять большую гибкость в противокорабельных и десантно-штурмовых операциях."

 USA_attack_helicopter_equipment_1:0 "Белл AH-1G «Кобра»"
 USA_attack_helicopter_equipment_1_short:0 "AH-1G «Кобра»"
 USA_attack_helicopter_equipment_1_desc:0 "Первоначально представленный в 1966 году в качестве временного ударного вертолета, AH-1 (разработанный с некоторой совместимостью с UH-1 Хьюи Ирокез) использовался в тех же ролях, для которых предназначался AH-56 во время своего цикла разработки. Он часто использовался в соединениях "охотник-убийца", роль "убийцы" для "охотника" выполнял OH-6 Кайюс, оба из которых с большим отличием служили во Вьетнамской войне. Хотя официальное прозвище «Кобра», существуют и другие прозвища, включая «ХьюиКобра» и «Снэйк»."
 USA_attack_helicopter_equipment_2:0 "Белл AH-1S «Кобра»"
 USA_attack_helicopter_equipment_2_short:0 "AH-1S «Кобра»"
 USA_attack_helicopter_equipment_2_desc:0 "Базовый AH-1S - это AH-1Q, модернизированный турбовальным двигателем T53-L-703 мощностью 1800 л.с. (1300 кВт). AH-1S оснащен ракетной подсистемой M65 TOW/«Кобра», M65 Telescopic Sight Unit (TSU) и M73 Reflex sight."
 USA_attack_helicopter_equipment_3:0 "Хьюз AH-64A «Апач»"
 USA_attack_helicopter_equipment_3_short:0 "AH-64A «Апач»"
 USA_attack_helicopter_equipment_3_desc:0 "Представленный в 1986 году в качестве замены AH-1 на вооружении армии США, AH-64 является одним из наиболее известных ударных вертолетов в мире. Он оснащен установленным в носовой части комплектом датчиков для захвата целей и системами ночного видения. Типичным (и известным) боекомплектом вертолета является 30-мм пушка Chain, установленная между шасси, и четыре стойки на крыльях для установки ракет «Гидра» и противотанковых ракет AGM-114 «Хеллфайр». Прозванный «Апач», AH-64 представляет собой вершину вертолетной авиации."
 USA_attack_helicopter_equipment_4:0 "Макдоннелл-Дуглас AH-64D «Апач Лонгбоу»"
 USA_attack_helicopter_equipment_4_short:0 "AH-64D «Апач Лонгбоу»"
 USA_attack_helicopter_equipment_4_desc:0 "Гордость армии США, помимо превосходной маневренности, радар Лонгбоу, установленный над основным ротором, повышает его способность использовать ракеты в любую погоду. Из-за вышеупомянутого радара он получил прозвище «Апач Лонгбоу»."
 USA_attack_helicopter_equipment_5:0 "Макдоннелл-Дуглас AH-64E «Апач Гардиан»"
 USA_attack_helicopter_equipment_5_short:0 "AH-64E «Апач Гардиан»"
 USA_attack_helicopter_equipment_5_desc:0 "AH-64E отличается улучшенной цифровой связью, объединенной системой распределения тактической информации, более мощными двигателями T700-GE-701D с модернизированной трансмиссией переднего редуктора для увеличения мощности, возможностью управления беспилотными летательными аппаратами (БПЛА), полной возможностью IFR и улучшенным шасси. Новые композитные лопасти ротора, испытания которых успешно завершились в 2004 году, увеличивают крейсерскую скорость, скороподъемность и грузоподъемность."
 
 USA_scout_helicopter_equipment_1:0 "Хьюз OH-6 «Кайюс»"
 USA_scout_helicopter_equipment_1_short:0 "OH-6 «Кайюс»"
 USA_scout_helicopter_equipment_1_desc:0 "Разработанный в 1960 году, OH-6 был создан в рамках проекта "Легкий Вертолет Наблюдения" (ЛВН) для наблюдения, эвакуации раненых, перевозки персонала и легких атак. Проект Хьюза стал успешным из одиннадцати других конкурирующих проектов. Он должен был заменить O-1 Bird Dog в роли наблюдателя, когда Министерство обороны США распорядилось передать все самолеты ВВС США. Отличившись во время войны во Вьетнаме, OH-6 продемонстрировал ценность вертолетов наблюдения в качестве поддержки ударных вертолетов, таких как AH-1, или наземных сил для поражения противника. Официально известный как «Кайюс» (в честь коренного американского племени с тихоокеанского северо-запада), пилоты дали ему прозвище 'Ловн' в честь программы, которая его породила."
 USA_scout_helicopter_equipment_2:0 "Белл OH-58A «Кайова»"
 USA_scout_helicopter_equipment_2_short:0 "OH-58A «Кайова»"
 USA_scout_helicopter_equipment_2_desc:0 "Представленный в 1969 году во время разгара войны во Вьетнаме, OH-58 был 4-местным вертолетом, примечательной особенностью которого было то, что, несмотря на наличие двух пилотов, органы управления пилотом на левом сиденье могут быть сняты для перевозки пассажира впереди. Во время войны во Вьетнаме его вооружение состояло из одного минигана M134 или гранатомета M129. После войны OH-58 получил множество модификаций, включая модернизацию двигателя (доведя его до уровня более позднего OH-58C), тепловизионную систему, пакет связи для правоохранительных органов, улучшенное навигационное оборудование и высокую проходимость. Эти модернизированные варианты "Kiowa" (названные в честь коренного американского племени, проживающего в штатах Монтана и Колорадо) будут участвовать в антинаркотических операциях RAID Национальной гвардии."
 USA_scout_helicopter_equipment_3:0 "Белл OH-58D «Кайова»"
 USA_scout_helicopter_equipment_3_short:0 "OH-58D «Кайова»"
 USA_scout_helicopter_equipment_3_desc:0 "Модернизированный вариант D «Кайова» был результатом программы усовершенствования армейских вертолетов (УАВ). Он получил такие характеристики, как модернизированную трансмиссию и двигатель для полетов на предельно низкой высоте, а также уникальную конфигурацию четырехлопастного несущего винта, которая позволила вертолету быть намного тише других вертолетов, в особенности своих предшественников. На вертолете OH-58D появился отличительный мачтовый прицел (ОМП) над несущим винтом, а также кабина со смешанным остеклением, где традиционные приборы обозначены как "резервные" для аварийного использования."
 USA_scout_helicopter_equipment_4:0 "MD Вертолеты AH-6J «Литтл Берд»"
 USA_scout_helicopter_equipment_4_short:0 "AH-6J «Литтл Берд»"
 USA_scout_helicopter_equipment_4_desc:0 "MH-6 «Литтл Берд» (прозвище «Убийственное Яйцо») и его ударный вариант, AH-6, - легкие вертолеты, используемые для специальных операций в армии США. Первоначально они были основаны на модифицированном OH-6A, позже на базе MD 500E с одним пятилопастным несущим винтом. Новейшая версия, MH-6M, основана на MD 530F и имеет один шестилопастный несущий винт и четырехлопастный хвостовой винт."
 USA_scout_helicopter_equipment_5:0 "Eurocopter UH-72 Lakota"
 USA_scout_helicopter_equipment_5_short:0 "UH-72 Lakota"
 USA_scout_helicopter_equipment_5_desc:0 "UH-72 предназначен для выполнения целого ряда задач, от общей поддержки и медицинской эвакуации (МЕДЭВАК) до восстановления персонала и операций по борьбе с наркотиками. Планируется, что они заменят UH-1 и OH-58A/C, которые являются более старыми легкими вертолетами общего назначения, и вытеснят другие типы, используемые в стране, в основном те, которые находятся на вооружении Национальной гвардии армии. UH-72 закупается как коммерческий готовый продукт (КГП), что упрощает логистическую поддержку флота".

 USA_utility_helicopter_equipment_1:0 "Сикорский H-34 «Чоктау»"
 USA_utility_helicopter_equipment_1_short:0 "H-34 «Чоктау»"
 USA_utility_helicopter_equipment_1_desc:0 "Сикорский H-34 (фирменное обозначение S-58, обозначение ВМС HUS) - военный вертолет с поршневым двигателем, первоначально разработанный как противолодочный (ПЛВ), но позже перепрофилированный в средний транспортный. Он стал последним вертолетом с поршневым двигателем, который эксплуатировался Корпусом морской пехоты США, поскольку все вертолеты с тех пор использовали турбинные двигатели. На службе в ВМС (как UH-34) он известен как «Сихорс», а армейские варианты (как CH-34) получили название «Чоктау»."
 USA_utility_helicopter_equipment_2:0 "Белл UH-1A «Ирокез»"
 USA_utility_helicopter_equipment_2_short:0 "UH-1A «Ирокез»"
 USA_utility_helicopter_equipment_2_desc:0 "Первый представитель серии вертолетов, известной как «Хьюи» (названной по первоначальному обозначению HU-1 до 1962 года), UH-1A является военным вариантом модели вертолета Bell 204, представленного в 1959 году. Это был первый вертолет, поступивший на вооружение любого подразделения вооруженных сил США с турбинным двигателем. Он стал одним из самых распространенных вертолетов, символом участия Америки в войне во Вьетнаме. Хотя неофициально его называют «Хьюи», его официальное прозвище - «Ирокез»."
 USA_utility_helicopter_equipment_3:0 "Белл UH-1D «Ирокез»"
 USA_utility_helicopter_equipment_3_short:0 "UH-1D «Ирокез»"
 USA_utility_helicopter_equipment_3_desc:0 "Представленный в 1963 году, UH-1D является военным вариантом модели Bell 205. Он был разработан с удлиненным фюзеляжем, чтобы он мог служить в первую очередь как перевозчик войск, чтобы заменить более ранний CH-34 Choctaw на вооружении армии США. Было построено 2000 таких вариантов 'Ирокез D', многие из которых были переоборудованы под стандарт UH-1H с модернизированным и более мощным двигателем."
 USA_utility_helicopter_equipment_4:0 "Белл UH-1N «Твин Хьюи»"
 USA_utility_helicopter_equipment_4_short:0 "UH-1N «Твин Хьюи»"
 USA_utility_helicopter_equipment_4_desc:0 "Впервые представленный в 1970 году, UH-1N был еще одним членом расширенного семейства «Хьюи», на этот раз разработанным на основе UH-1H, хотя в отличие от UH-1A и UH-1D, вариант N должен был породить свою гражданскую версию, Bell 212. Основной ротор приводится в движение двумя турбовальными двигателями, которые вращают один выходной вал. В случае отказа одного из двигателей оставшийся двигатель может выдавать 671 кВт (900 л.с.) в течение 30 минут или 571 кВт (765 л.с.), что позволяет UH-1N поддерживать крейсерские характеристики при максимальном весе. Это был один из немногих вариантов «Ирокеза», который не использовался армией США, а стал стандартом для морской пехоты. Двухмоторная компоновка дала ему неофициальное прозвище «Твин Хьюи»."
 USA_utility_helicopter_equipment_5:0 "Сикорский UH-60A «Блэк Хоук»"
 USA_utility_helicopter_equipment_5_short:0 "UH-60A «Блэк Хоук»"
 USA_utility_helicopter_equipment_5_desc:0 "Поступивший на вооружение в 1979 году, UH-60A стал преемником UH-1 в качестве платформы для вертолетов общего назначения армии США. Разработанный на базе гражданского вертолета S-70, UH-60A мог перевозить до 15 человек (4 члена экипажа и до 11 экипированных военнослужащих). Названный в честь вождя коренного американского племени саук, «Блэк Хоук» принимал участие в боевых действиях во время конфликтов в Гренаде, Панаме, Ираке, Сомали, на Балканах, в Афганистане и других районах Ближнего Востока."
 USA_utility_helicopter_equipment_6:0 "Сикорский UH-60L «Блэк Хоук»"
 USA_utility_helicopter_equipment_6_short:0 "UH-60L «Блэк Хоук»"
 USA_utility_helicopter_equipment_6_desc:0 "Являясь модернизацией UH-60A, вариант L «Блэк Хоук» имеет модернизированные двигатели, улучшенную долговечную коробку передач и обновленную систему управления полетом. Представленный в 1990 году, UH-60L является основным вариантом утилитарного вертолета H-60, который в настоящее время состоит на вооружении армии США, с учетом того, что этот тип используется для замены UH-1N в ВВС США."
 USA_utility_helicopter_equipment_7:0 "Сикорский UH-60M «Блэк Хоук»"
 USA_utility_helicopter_equipment_7_short:0 "UH-60M «Блэк Хоук»"
 USA_utility_helicopter_equipment_7_desc:0 "Улучшенная конструкция широкохордных лопастей ротора, двигатели T700-GE-701D (максимальная мощность 2000 л.с. или 1500 кВт каждый), коробка передач повышенной прочности, компьютер интегрированной системы управления здоровьем транспортного средства (КИСУЗТС) и новая стеклянная кабина."

 USA_cargo_helicopter_equipment_1:0 "Боинг CH-47A «Чинук»"
 USA_cargo_helicopter_equipment_1_short:0 "CH-47A «Чинук»"
 USA_cargo_helicopter_equipment_1_desc:0 "CH-47 (первоначально HC-1B) - двухдвигательный вертолет с двумя несущими винтами, один из самых тяжелых вертолетов Запада. Заменивший CH-37 «Мохаве», CH-47 имеет несколько способов погрузки различных грузов, включая несколько дверей по всему фюзеляжу, широкую погрузочную рампу, расположенную в задней части фюзеляжа, и в общей сложности три внешних вентральных грузовых крюка для перевозки подвешенных грузов. На момент появления в 1962 году это был самый быстрый вертолет среди своих современников, и в настоящее время он по-прежнему считается одним из самых быстрых вертолетов в арсенале армии США. Название «Чинук» происходит от имени коренного американского народа чинук, проживающего на территории современного штата Вашингтон."
 USA_cargo_helicopter_equipment_2:0 "Сикорский CH-53A Sea Stallion"
 USA_cargo_helicopter_equipment_2_short:0 "CH-53A Sea Stallion"
 USA_cargo_helicopter_equipment_2_desc:0 "В октябре 1967 года Корпус морской пехоты США выдвинул требование о создании вертолета с грузоподъемностью в 1,8 раза больше, чем у CH-53D, который мог бы размещаться на боевых кораблях амфибийной авиации. ВМС США и армия США в то время также нуждались в подобных вертолетах. До появления этого требования компания Sikorsky работала над усовершенствованием вертолета CH-53D под фирменным обозначением "S-80", оснащенным третьим турбовальным двигателем и более мощной системой несущих винтов. Сикорский предложил проект S-80 морской пехоте в 1968 году. Морской пехоте понравилась идея, поскольку она обещала быстро предоставить хорошее решение, и она профинансировала разработку испытательного вертолета для оценки. Первый контракт на производство был заключен в 1978 году, а в феврале 1981 года вертолет поступил на вооружение."
 USA_cargo_helicopter_equipment_3:0 "Боинг CH-47D «Чинук»"
 USA_cargo_helicopter_equipment_3_short:0 "CH-47D «Чинук»"
 USA_cargo_helicopter_equipment_3_desc:0 "CH-47D имеет тот же планер, что и более ранние модели, основное отличие заключается в установке более мощных двигателей. Ранние CH-47D первоначально оснащались двумя двигателями T55-L-712, наиболее распространенным двигателем является более поздний T55-GA-714A. Благодаря трехкрюковой грузовой системе CH-47D может перевозить тяжелые грузы внутри и до 26 000 фунтов (12 000 кг) снаружи (например, 40-футовые или 12-метровые контейнеры). Впервые он был принят на вооружение в 1979 году. В штурмовых операциях он часто служит основным средством перемещения 155-мм гаубицы M198, сопровождающей 30 боеприпасов и экипаж из 11 человек."
 USA_cargo_helicopter_equipment_4:0 "СикорскийCH-53E Super Stallion"
 USA_cargo_helicopter_equipment_4_short:0 "CH-53E Super Stallion"
 USA_cargo_helicopter_equipment_4_desc:0 "В октябре 1967 года Корпус морской пехоты США выдвинул требование о создании вертолета с грузоподъемностью в 1,8 раза больше, чем у CH-53D, который мог бы размещаться на боевых кораблях амфибийной авиации. ВМС США и армия США в то время также нуждались в подобных вертолетах. До появления этого требования компания Sikorsky работала над усовершенствованием вертолета CH-53D под фирменным обозначением "S-80", оснащенным третьим турбовальным двигателем и более мощной системой несущих винтов. Сикорский предложил проект S-80 морской пехоте в 1968 году. Морской пехоте понравилась идея, поскольку она обещала быстро предоставить хорошее решение, и она профинансировала разработку испытательного вертолета для оценки. Первый контракт на производство был заключен в 1978 году, а в феврале 1981 года вертолет поступил на вооружение."
 USA_cargo_helicopter_equipment_5:0 "Боинг CH-47D «Чинук» Блок II"
 USA_cargo_helicopter_equipment_5_short:0 "CH-47D Блок II"
 USA_cargo_helicopter_equipment_5_desc:0 "CH-47D модернизирован с усовершенствованной авионикой, приборами GPS и повышением живучести. Почти все старые "Чинуки" были модернизированы до этого стандарта."
 USA_cargo_helicopter_equipment_6:0 "Боинг CH-47F «Чинук»"
 USA_cargo_helicopter_equipment_6_short:0 "CH-47F «Чинук»"
 USA_cargo_helicopter_equipment_6_desc:0 "В 2001 году первый CH-47F, модернизированный CH-47D, совершил свой первый полет; первая серийная модель выкатилась 15 июня 2006 года на заводе компании Boeing в Ридли-Парке, штат Пенсильвания, и впервые поднялась в воздух 23 октября 2006 года. Модернизация включает в себя двигатели Honeywell мощностью 4 868 валов (3 630 кВт) и планер самолета, имеющий более цельную конструкцию для снижения требований к техническому обслуживанию. Фрезерованная конструкция снижает вибрацию, а также потребности в осмотре и ремонте, и устраняет точки изгиба для увеличения срока службы."

 ########### SOV
 SOV_fighter_equipment_0:0 "Военно-Воздушные Силы"
 SOV_fighter_equipment_0_short:0 "ВВС"
 SOV_fighter_equipment_0_desc:0 "Советские ВВС были одними из военно-воздушных сил Советского Союза. Другими были Советские войска противовоздушной обороны. Военно-воздушные силы были сформированы из компонентов Императорской русской воздушной службы в 1917 году и подверглись наибольшему испытанию во время Второй мировой войны. Они также участвовали в Корейской войне и были расформированы вместе с Советским Союзом в 1991-92 годах. Имущество бывших советских ВВС впоследствии было разделено на несколько военно-воздушных сил бывших советских республик, включая новые ВВС России. Ее песней стал "Марш Летчиков"."

 SOV_fighter_equipment_1:0 "Яковлев Як-3"
 SOV_fighter_equipment_1_short:0 "Як-3"
 SOV_fighter_equipment_1_desc:0 "Яковлев Як-3 был одномоторным, одноместным советским истребителем времен Второй мировой войны. Прочный и простой в обслуживании, он очень нравился как пилотам, так и наземному экипажу. Один из самых маленьких и легких боевых истребителей, принятых на вооружение во время войны, его высокое отношение мощности к весу обеспечило ему отличные характеристики, и он оказался грозным истребителем собак."
 SOV_fighter_equipment_2:0 "Лавочкин Ла-7"
 SOV_fighter_equipment_2_short:0 "Ла-7"
 SOV_fighter_equipment_2_desc:0 "Лавочкин Ла-7 - советский одноместный истребитель с поршневым двигателем, разработанный во время Второй мировой войны в ОКБ Лавочкина. Он был развитием и усовершенствованием Ла-5, и последним в семействе самолетов, начавшемся с ЛаГГ-1 в 1938 году."
 SOV_fighter_equipment_3:0 "Лавочкин Ла-9"
 SOV_fighter_equipment_3_short:0 "Ла-9"
 SOV_fighter_equipment_3_desc:0 "Ла-9 представляет собой дальнейшее развитие прототипа Лавочкина Ла-126. Первый прототип, получивший обозначение Ла-130, был закончен в 1946 году. Сходство со знаменитым Лавочкиным Ла-7 было лишь поверхностным - новый истребитель имел цельнометаллическую конструкцию и крыло ламинарного типа. Снижение веса за счет исключения из конструкции планера дерева позволило значительно увеличить запас топлива и установить четырехпушечное вооружение. Имитационные бои показали, что Ла-130 был на равных с Ла-7, но уступал Яковлеву Як-3 в горизонтальной плоскости. Новый истребитель, получивший официальное обозначение Ла-9, поступил в производство в августе 1946 года. Всего к концу производства в 1948 году было построено 1 559 самолетов."

 SOV_jet_multirole_equipment_1:0 "Микоян-Гуревич МиГ-9"
 SOV_jet_multirole_equipment_1_desc:0 "МиГ-9 Fargo был первым реактивным самолетом Микояна, разработанным после Второй мировой войны. Он был представлен в 1948 году. Он имел ограниченное боевое и учебное применение во время гражданской войны в Китае и войны в Корее. Всего было произведено 610 самолетов, причем исключительно в СССР. Последние МиГ-9 были списаны КНР в 1951 году."
 SOV_jet_multirole_equipment_1_short:0 "МиГ-9"
 SOV_jet_multirole_equipment_2:0 "Микоян-Гуревич МиГ-15"
 SOV_jet_multirole_equipment_2_desc:0 "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 Fagot Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления на вооружении в Корейской войне, где он оказался достойным противником американских F-86 «Сейбр» и F9F «Пантера». Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые из них все еще остаются на вооружении ВВС Северной Кореи."
 SOV_jet_multirole_equipment_2_short:0 "МиГ-15"
 SOV_jet_multirole_equipment_3:0 "Микоян-Гуревич МиГ-17"
 SOV_jet_multirole_equipment_3_desc:0 "Прямой преемник МиГ-15 Fagot. Более 10 000 МиГ-17 Fresco было произведено с 1952 года. МиГ-17 был лицензионно построен в ВВС НОАК как Шэньян J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 «Сейбрс» над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе ВВС НОАК и ВВС НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял более современным сверхзвуковым американским истребителям «Фантом» II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно эксплуатируется в некоторых африканских странах и Северной Корее."
 SOV_jet_multirole_equipment_3_short:0 "МиГ-17"
 SOV_jet_multirole_equipment_4:0 "Микоян-Гуревич МиГ-19"
 SOV_jet_multirole_equipment_4_desc:0 "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в ровном полете. Сопоставимым американским истребителем "Century Series" был североамериканский F-100 «Супер Сейбр», хотя МиГ-19 в основном боролся с более современными Макдоннелл-Дуглас F-4 «Фантом» II и Рипаблик F-105 «Тандерчиф» над Северным Вьетнамом."
 SOV_jet_multirole_equipment_4_short:0 "МиГ-19"
 SOV_jet_multirole_equipment_5:0 "Микоян-Гуревич МиГ-21Ф-13"
 SOV_jet_multirole_equipment_5_desc:0 "МиГ-21 Fishbed считается одним из самых ранних советских истребителей третьего поколения, оснащенным ракетами дальнего радиуса действия и импульсным радаром. МиГ-21 является самым производимым сверхзвуковым самолетом в истории, особенно большое количество было построено в Китае и Индии по лицензии. Всего было построено более 11 000 самолетов, которые служат в более чем 60 странах на 5 континентах. За время своей службы МиГ-21 совершил 240 воздушных убийств. МиГ-21 участвовал во многих конфликтах, включая Вьетнам (где он добился огромных успехов), индийско-пакистанскую войну 1971 года, ирано-иракскую войну и множество более мелких конфликтов. Он остается на вооружении более 6 десятилетий."
 SOV_jet_multirole_equipment_5_short:0 "МиГ-21Ф-13"
 SOV_jet_multirole_equipment_6:0 "Микоян-Гуревич МиГ-21ПФ"
 SOV_jet_multirole_equipment_6_desc:0 "Серийная версия всепогодного перехватчика. Они оснащались турбореактивными двигателями Р11Ф2-300 и, начиная с седьмой партии, оснащались РЛС РП-21 (на первых шести партиях использовалась более старая РЛС ЦД-30Т (она же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую АУ РС-2УС (она же К-5МС) в дополнение к К-13 с ИК-целью."
 SOV_jet_multirole_equipment_6_short:0 "МиГ-21ПФ"
 SOV_jet_multirole_equipment_7:0 "Микоян-Гуревич МиГ-23М"
 SOV_jet_multirole_equipment_7_desc:0 "МиГ-23 был первым советским истребителем, оснащенным радаром "взгляд вниз/снижение" и одним из первых, вооруженным ракетами дальнего радиуса действия. Производство началось в 1969 году и достигло больших объемов - было построено более 5 000 самолетов, что сделало его самым производимым самолетом с изменяемой стреловидностью крыла в истории. Сегодня МиГ-23 остается в ограниченном количестве на вооружении некоторых экспортных заказчиков."
 SOV_jet_multirole_equipment_7_short:0 "МиГ-23М"
 SOV_jet_multirole_equipment_8:0 "Микоян-Гуревич МиГ-23МЛ"
 SOV_jet_multirole_equipment_8_desc:0 "Ранние варианты МиГ-23МЛ имели ряд конструктивных недостатков, включая прочность и надежность планера, мощность двигателя, маневренность и радиолокационные характеристики. Была проведена значительная переработка планера, в результате чего появился МиГ-23МЛ."
 SOV_jet_multirole_equipment_8_short:0 "МиГ-23МЛ"
 SOV_jet_multirole_equipment_9:0 "Микоян-Гуревич МиГ-23МЛД"
 SOV_jet_multirole_equipment_9_desc:0 "МиГ-23МЛД был окончательным вариантом истребителя МиГ-23. Основным направлением модернизации было улучшение маневренности, особенно на больших углах атаки, что было признано главным недостатком МиГ-23М/МЛ. Стрела Пито была оснащена вихревыми генераторами, а зазубренные корни передней кромки крыла были "пилообразными" и также служили вихревыми генераторами. Система управления полетом включала в себя синтетическое устройство "стик-стоп"/ограничитель сигналов SOS-3-4."
 SOV_jet_multirole_equipment_9_short:0 "МиГ-23МЛД"
 SOV_jet_multirole_equipment_10:0 "Микоян-Гуревич МиГ-29А"
 SOV_jet_multirole_equipment_10_desc:0 "МиГ-29 Fulcrum A был первоначально разработан ОКБ Микояна. Это был первый истребитель 4-го поколения, поступивший на вооружение СССР и стран Восточного блока. В нем была установлена усовершенствованная авионика и значительно расширены возможности радара. Первые МиГ-29 использовались в качестве учебно-тренировочных самолетов в странах Варшавского договора и поставлялись на экспорт в Индию, но имели ограниченное боевое применение. Впоследствии МиГ-29 стал базой для широко производимых вариантов, таких как МиГ-29С, МиГ-29М и МиГ-35."
 SOV_jet_multirole_equipment_10_short:0 "МиГ-29А"

 SOV_mr_stealth_fighter_equipment_1:0 "Микоян МиГ-29М"
 SOV_mr_stealth_fighter_equipment_1_short:0 "МиГ-29М"
 SOV_mr_stealth_fighter_equipment_1_desc:0 "Самолет МиГ-29М/М2 является модификацией базового МиГ-29. Он получил более мощные многоцелевые возможности за счет более широкого применения высокоточного оружия класса "воздух-воздух" и "воздух-земля". Он также отличался значительно увеличенной дальностью полета за счет увеличения внутреннего запаса топлива. В ходе разработки самолета было внесено несколько изменений. Переработанный планер был изготовлен из легкого алюминиево-литиевого сплава для увеличения тяговооруженности. Геометрия рампы воздухозаборника была изменена, верхние жалюзи воздухозаборника были удалены, чтобы освободить место для большего количества топлива в LERX, были введены сетчатые экраны для предотвращения повреждения посторонними предметами (ППП), а размеры впускных отверстий были увеличены для увеличения потока воздуха."
 
 SOV_jet_light_equipment_1:0 "Микоян-Гуревич МиГ-9УТИ"
 SOV_jet_light_equipment_1_short:0 "МиГ-9УТИ"
 SOV_jet_light_equipment_1_desc:0 "Для обеспечения подготовки летного состава боевой части истребителей ВВС коллективу ОКБ-155, возглавляемому А.И. Микояном, была поручена разработка двухместной модификации самолета МиГ-9. Работы по новой модификации МиГ-9 в ОКБ-155 начались в июле 1946 года. Предварительный проект "двойки" был готов к концу октября, и в соответствии с графиком проектирования и постройки самолета, утвержденным Микояном 26 августа, первый опытный образец был выкачен на аэродром. намеченный на 20 декабря 1946 года."
 SOV_jet_light_equipment_2:0 "Микоян-Гуревич МиГ-15УТИ"
 SOV_jet_light_equipment_2_short:0 "МиГ-15УТИ"
 SOV_jet_light_equipment_2_desc:0 "6 апреля 1949 года коллективу ОКБ-155 было официально поручено разработать учебно-тренировочный вариант истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен заводом № 1 в марте-мае 1949 года. Кабина инструктора на УТИ МиГ-15 была размещена за счет уменьшения первого фюзеляжного топливного бака. Обе герметичные кабины были оборудованы катапультными креслами и фонарями пиромеханического сброса.  Специальное оборудование машины состояло из автоматического пушечного прицела АСП-1Н, приемопередающей радиостанции РСИ-6К, радиокомпаса с маркером РПКО-10М, переговорного устройства СПУ-2М, кислородного прибора КП-14 и фотоаппарата АФА-ИМ. Вооружение состояло из одной 23-мм пушки НР-23 с боекомплектом 80 патронов и одного пулемета УБК-Э с боекомплектом 150 патронов."
 SOV_jet_light_equipment_3:0 "Л-29 «Дельфин»"
 SOV_jet_light_equipment_3_short:0 "Л-29 «Дельфин»"
 SOV_jet_light_equipment_3_desc:0 "Аэро Л-29 «Дельфин» - военный реактивный учебно-тренировочный самолет, разработанный и производимый чехословацкой авиационной компанией Aero Vodochody. В ходе реализации программы было произведено более 3000 учебно-тренировочных самолетов Л-29 «Дельфин». Из них около 2 000 были поставлены в Советский Союз, где они использовались в качестве стандартного учебно-тренировочного самолета для советских ВВС."
 SOV_jet_light_equipment_4:0 "Аэро Л-39 «Альбатрос»"
 SOV_jet_light_equipment_4_short:0 "Л-39  «Альбатрос»"
 SOV_jet_light_equipment_4_desc:0 "Аэро Л-39 «Альбатрос» - это высокоэффективный реактивный учебно-тренировочный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах как замена Аэро Л-29 «Дельфин» в качестве основного учебного самолета. Это был первый учебно-тренировочный самолет, оснащенный турбовентиляторной силовой установкой. Этот тип экспортировался во многие страны в качестве военного учебно-тренировочного самолета."
 SOV_jet_light_equipment_5:0 "Аэро Л-39ЗА «Альбатрос»"
 SOV_jet_light_equipment_5_short:0 "Л-39ЗА «Альбатрос»"
 SOV_jet_light_equipment_5_desc:0 "Значительно модернизированный Л-39 для вооруженной подготовки и легких атак, с более прочным шасси, большей полезной нагрузкой и, в частности, с возможностью установки 23-миллиметровой двухствольной пушки GSh-23L, закрепленной в конформной капсуле под кабиной пилота, с магазином на 150 патронов внутри планера."

 SOV_recon_equipment_0:0 "Туполев Ту-2Р"
 SOV_recon_equipment_0_short:0 "Ту-2Р"
 SOV_recon_equipment_0_desc:0 "Разведывательная версия Ту-2."
 SOV_jet_recon_equipment_0:0 "Микоян-Гуревич МиГ-15Рбис"
 SOV_jet_recon_equipment_0_short:0 "МиГ-15Рбис"
 SOV_jet_recon_equipment_0_desc:0 "В 25 апреля 1950 года ОКБ МиГ начало разработку фронтового разведывательного варианта МиГ-15 с фотоаппаратом АФА-БА/40, обеспечивающего съемку полосы шириной от 0,9 до 4,5 км при длине маршрута фотографирования от 90 до 450 км на высотах от 2000 до 10000м. На самолете была установлена только одна пушка НР-23. Для увеличения дальности полета разведчика впоследствии на балках были установлены замки Д4-50, что позволило подвесить под крылом 600-литровые топливные баки улучшенной формы. Кроме того, на машине был установлен транспондер 'Барий-М' и дополнительный 2-литровый кислородный баллон."
 SOV_jet_recon_equipment_1:0 "Микоян-Гуревич МиГ-25РБ"
 SOV_jet_recon_equipment_1_short:0 "МиГ-25РБ"
 SOV_jet_recon_equipment_1_desc:0 "МиГ-25РБ - одноместный всевысотный оперативный самолет-разведчик - бомбардировщик. Испытания были завершены в декабре 1970 года. Самолет был оснащен 2-4 фотоаппаратами общей разведки А-70М и одним топографическим АФА-Э/10. Фотографическое оборудование размещалось в пяти отсеках, расположенных в нижней части носовой части фюзеляжа. Также была установлена станция SIGINT под названием SPS-4A или B 'Virage', работающая в различных частотных диапазонах. Специальное оборудование - станция активных радиопомех СПС-141."
 SOV_jet_recon_equipment_2:0 "Сухой Су-24МР"
 SOV_jet_recon_equipment_2_short:0 "Су-24МР"
 SOV_jet_recon_equipment_2_desc:0 "Специализированный тактический разведывательный вариант. Су-24МР сохраняет большую часть навигационного комплекса Су-24М, включая радар слежения за местностью, но исключает ударный радар 'Орион-А', лазерную/телевизионную систему и пушку в пользу двух панорамных камер, телекамеры 'Аист-М', РДС-БО 'Штык' РЛС бокового обзора и инфракрасной системы разведки 'Зима'. Другие датчики размещаются в капсулах."
 
 SOV_heavy_fighter_equipment_1:0 "Яковлев Як-9"
 SOV_heavy_fighter_equipment_1_short:0 "Як-9"
 SOV_heavy_fighter_equipment_1_desc:0 "Як-9 имел укороченный задний фюзеляж с козырьком кругового обзора. Его более легкая металлическая конструкция позволяла увеличить запас топлива и вооружение по сравнению с предыдущими моделями, построенными из дерева. Як-9 был маневренным на высокой скорости на малых и средних высотах и легким в управлении, что сделало его одним из самых производимых советских истребителей Второй мировой войны."
 SOV_heavy_fighter_equipment_2:0 "Петляков Пе-3"
 SOV_heavy_fighter_equipment_2_short:0 "Пе-3"
 SOV_heavy_fighter_equipment_2_desc:0 "Являясь дальнейшим развитием Пе-2, Пе-3 был специализированным ночным истребителем, когда был представлен в 1941 году, в том же году, что и его собрат Пе-2. Его конструкция и применение были сопоставимы с теми, которые использовали немецкие Люфтваффе с Юнкерс Ю 88 и британские Королевские ВВС с De Havilland Mosquito. Пе-3 с отличием использовался во время битвы за Москву, и несмотря на то, что единственный завод, отвечавший за постройку этого типа, был эвакуирован в результате битвы, он использовался на протяжении всего конфликта, а более поздние производственные партии были направлены на создание разведывательных вариантов этого типа."
 SOV_heavy_fighter_equipment_3:0 "Лавочкин Ла-11"
 SOV_heavy_fighter_equipment_3_short:0 "Ла-11"
 SOV_heavy_fighter_equipment_3_desc:0 "Разработанный в 1947 году, после окончания Второй мировой войны, Ла-11 был дальнейшим развитием Ла-9 'Фриц' для создания дальнего истребителя сопровождения. Самолет был оснащен большими шинами, чтобы выдержать возросший вес, и удобствами для длительных полетов, такими как увеличенная обивка сиденья, подлокотники и писсуар. Кроме того, был установлен полный радионавигационный комплекс. Неудивительно, что боевые характеристики с полным запасом топлива ухудшились. Однако по мере того, как загрузка топливом приближалась к показателям Ла-9, улучшались и характеристики. Пилоты Ла-11 на советской, а затем и китайской службе служили в ПВО, сбивая американские «Мустанги» и штурмовики во время Корейской войны. По классификации НАТО его название - Fang."

 SOV_jet_interceptor_equipment_1:0 "Яковлев Як-17"
 SOV_jet_interceptor_equipment_1_desc:0 "Впервые Як-17 был публично показан на Дне советской авиации в 1949 году на Тушинском аэродроме. В эксплуатации Як-17 имел большинство тех же недостатков, что и его предшественник, включая относительно низкую скорость и дальность полета, ненадежный двигатель (все еще основанный на немецком Юнкерс Jumo 004) со сложной процедурой запуска. С другой стороны, его управление было очень простым и схожим с популярными винтовыми истребителями, такими как Як-3 и Як-9. Это сделало его отличной переходной машиной к реактивным истребителям."
 SOV_jet_interceptor_equipment_1_short:0 "Як-17"
 SOV_jet_interceptor_equipment_2:0 "Лавочкин Ла-15"
 SOV_jet_interceptor_equipment_2_desc:0 "Лавочкин Ла-15 Fantail был принят на вооружение советских ВВС в 1949 году. Хотя технологически самолет превосходил МиГ-15, из-за более низкой стоимости производства предпочтение было отдано МиГ-15. Самолет ни разу не участвовал в боевых действиях и применялся лишь в ограниченных масштабах. 235 самолетов, которые были произведены, были списаны к 1953 году. С них сняли двигатели и использовали для испытаний ядерного оружия."
 SOV_jet_interceptor_equipment_2_short:0 "Ла-15"
 SOV_jet_interceptor_equipment_3:0 "Микоян-Гуревич МиГ-17ПФ"
 SOV_jet_interceptor_equipment_3_desc:0 "Всепогодный истребитель-перехватчик, оснащенный РЛС «Изумруд», 3 х 23 мм пушками НР-23 и двигателем ВК-1Ф."
 SOV_jet_interceptor_equipment_3_short:0 "МиГ-17ПФ"
 SOV_jet_interceptor_equipment_4:0 "Сухой Су-9"
 SOV_jet_interceptor_equipment_4_desc:0 "Сухой Су-9 Fishpot был дельтакрылым советским всепогодным перехватчиком, разработанным в 1950-х годах. Су-9 совершил свой первый полет 24 июня 1956 года и поступил на вооружение 3 года спустя в 1959 году. Самолет эксплуатировался исключительно в 894-м истребительном авиационном полку советских ВВС и никогда не участвовал в активных боевых действиях. Последний из 1150 выпущенных самолетов покинул строй в 1979 году."
 SOV_jet_interceptor_equipment_4_short:0 "Су-9"
 SOV_jet_interceptor_equipment_5:0 "Сухой Су-11"
 SOV_jet_interceptor_equipment_5_desc:0 "Су-11 был модернизированной версией перехватчика Су-9 ('Fishpot'), который разрабатывался параллельно с истребителем-бомбардировщиком Су-7 со стреловидным крылом ОКБ. Признав фундаментальные ограничения Су-9, компания Сухой начала работу над Су-11."
 SOV_jet_interceptor_equipment_5_short:0 "Су-11"
 SOV_jet_interceptor_equipment_6:0 "Сухой Су-15"
 SOV_jet_interceptor_equipment_6_desc:0 "Сухой Су-15 Flagon A - двухреактивный перехватчик, разработанный Советским Союзом в 1960-х годах. Самолет совершил первый полет в середине 1962 года и через 3 года поступил на вооружение советских ВВС в 1965 году. В 1965-1979 годах было произведено 1290 самолетов. Самолет также использовался в ВВС Украины и ограниченно, в чрезвычайных ситуациях, в ВВС России. Он был официально снят с вооружения в 1996 году."
 SOV_jet_interceptor_equipment_6_short:0 "Су-15"
 SOV_jet_interceptor_equipment_7:0 "Микоян-Гуревич МиГ-25П"
 SOV_jet_interceptor_equipment_7_desc:0 "Микоян-Гуревич МиГ-25 Foxbat - пожалуй, один из самых влиятельных советских самолетов в истории. Первый прототип МиГ-25 поднялся в воздух в начале 1964 года, а официально поступил на вооружение в 1970 году. В течение всего срока службы было построено более 1150 самолетов, которые были проданы многим странам, включая Сирию, Ирак и Индию. Самолет был разработан для быстрого перехвата таких сверхвысотных самолетов, как U-2 и B-58, с молниеносной скоростью. Этот самолет обеспечил Советскому Союзу гораздо более высокий контроль над собственным удаленным воздушным пространством, чем когда-либо прежде. Он и сегодня ограниченно используется в ВВС России."
 SOV_jet_interceptor_equipment_7_short:0 "МиГ-25П"
 SOV_jet_interceptor_equipment_8:0 "Микоян-Гуревич МиГ-31"
 SOV_jet_interceptor_equipment_8_desc:0 "МиГ-31 Foxhound является прямым преемником МиГ-25 и был разработан как комплексная замена. Самолет разделяет большинство элементов конструкции с МиГ-25, но имеет в основном внутренние изменения. МиГ-31 имеет 2 кресла, более совершенные датчики и двигатели, кабина пилота также была модернизирована для поддержки головного дисплея и более новых ракетных систем "воздух-воздух". В 1975-1994 годах было произведено 519 самолетов МиГ-31. Он по-прежнему состоит на вооружении ВВС России и ВВС Казахстана. Это один из самых быстрых боевых самолетов, находящихся сегодня на вооружении."
 SOV_jet_interceptor_equipment_8_short:0 "МиГ-31"
 SOV_jet_interceptor_equipment_9:0 "Сухой Су-27С"
 SOV_jet_interceptor_equipment_9_desc:0 "Су-27С Flanker B - первоначальный серийный вариант советского истребителя Су-27. Самолет задумывался как прямой конкурент F-14 «Томкэт» и F-15 «Игл». После первого полета в 1977 году он поступил на вооружение в 1985 году. Его основной задачей была дальняя противовоздушная оборона против американских бомбардировщиков B-1 и B-52, а также дальнее сопровождение советских межконтинентальных стратегических бомбардировщиков. К настоящему времени было произведено 809 самолетов, которые до сих пор состоят на вооружении ВВС России. Среди других эксплуатантов - Индонезия, Украина, Вьетнам, Китай (обозначение J-11) и др. Самолеты останутся на вооружении в обозримом будущем."
 SOV_jet_interceptor_equipment_9_short:0 "Су-27С"

 #SOV_stealth_fighter_equipment_1:0 "Sukhoi Su-57"
 #SOV_stealth_fighter_equipment_1_desc:0 "The Su-57 was created based on the plans for the PAK-FA (The acronym meaning Perspektivny Aviatsionny Kompleks Frontovoy Aviatsii, Russian for "Prospective Airborne Complex of Frontline Aviation"). It has very high stealth capabilities, and represents the culmination of Russian Air Force technology. Featuring prominent maneuverability due to a thrust vectoring nozzle and excellent stealth against radar, it boasts top class aerial combat capabilities."
 #SOV_stealth_fighter_equipment_1_short:0 "Su-57"
 SOV_stealth_fighter_equipment_1:0 "Микоян-Гуревич МиГ 1.44 МФИ"
 SOV_stealth_fighter_equipment_1_desc:0 "Проект Микояна 1.44/1.42(N 1) был демонстратором технологии многоцелевого истребителя, разработанного конструкторским бюро Микояна. Он был разработан для советского проекта МФИ (Многофункциональный фронтовой истребитель) для программы И-90 ("истребитель 1990-х годов"), ответа на американский перспективный тактический истребитель (ATF). MFI должен был включать в себя многие характеристики истребителя пятого поколения, такие как сверхманевренность, сверхкрутизна, передовая авионика, а также определенная степень снижения радиолокационной заметности."
 SOV_stealth_fighter_equipment_1_short:0 "МиГ 1.44 МФИ"

 SOV_high_mach_jet_interceptor_equipment_1:0 "Яковлев Як-25"
 SOV_high_mach_jet_interceptor_equipment_1_short:0 "Як-25"
 SOV_high_mach_jet_interceptor_equipment_1_desc:0 "" 
 SOV_high_mach_jet_interceptor_equipment_2:0 "Яковлев Як-28P"
 SOV_high_mach_jet_interceptor_equipment_2_short:0 "Як-28P"
 SOV_high_mach_jet_interceptor_equipment_2_desc:0 "В 1960 году на базе Як-27К и Як-28 был создан новый двухместный сверхзвуковой перехватчик Як-28П. Он предназначался для борьбы с воздушными целями на малых и средних высотах в широком диапазоне скоростей, днем и ночью, в любую погоду. Самолет был оснащен комплексом вооружения К-8М-1, состоявшим из двух ракет Р-8М-1 с тепловизионным и полуактивным радиолокационными искателями и радиолокационной станции Орел-Д. Пушки установлены не были"..
 SOV_high_mach_jet_interceptor_equipment_3:0 "Микоян-Гуревич Е-152А"
 SOV_high_mach_jet_interceptor_equipment_3_short:0 "E-152A"
 SOV_high_mach_jet_interceptor_equipment_3_desc:0 "Всепогодный перехватчик Е-152А был построен в конце 1950-х годов. Он имел силовую установку из 2 серийных двигателей R11F-300 с максимальной тягой 3880 кг каждый и форсажной камерой 5740 кг. Вооружение состояло из системы перехвата "Ураган-5", состоящей из РЛС 'ЦП-1' и ракеты К-9. На самолете Е-152А вычислитель СРП и автопилот были сопряжены с РЛС ЦП." 
 SOV_high_mach_jet_interceptor_equipment_4:0 "Микоян-Гуревич Е-152М"
 SOV_high_mach_jet_interceptor_equipment_4_short:0 "E-152M"
 SOV_high_mach_jet_interceptor_equipment_4_desc:0 "Закрытие программы испытаний ракеты К-9 привело к прекращению полетов на Е-152-2. Было принято решение переоборудовать самолет в новую версию E-152M в 1961 году. Самолет был рассчитан на установку одного двигателя Р15В-300 с тягой без форсажа 6480 кг и с форсажем 10210 кг." 
 #SOV_high_mach_jet_interceptor_equipment_4:0 "Tupolev Tu-148" #By years and technology should be tier 5 - Tu-128 must be in the same year what Tu-28
 #SOV_high_mach_jet_interceptor_equipment_4_short:0 "Tu-148"
 #SOV_high_mach_jet_interceptor_equipment_4_desc:0 "" 
 
 SOV_CAS_equipment_1:0 "Кочерыгин ЛБШ Штурмовик"
 SOV_CAS_equipment_1_short:0 "ЛБШ Штурмовик"
 SOV_CAS_equipment_1_desc:0 "ЛБШ Кочерыгина - это низкокрылый моноплан смешанной деревянной и металлической конструкции, разработанный в 1939 году Сергеем Александровичем Кочерыгиным. Несмотря на малую мощность, этот самолет CAS обладал впечатляющей для своего времени огневой мощью: 2 крыльевые 20-мм пушки, 2 крыльевые 7,62-мм пушки HMG и 600 кг (1300 фунтов) бомбовой нагрузки, с задним расположением 7,62-мм пушки HMG для обороны. Хотя первоначально советские ВВС приняли его к производству, это решение вскоре было отменено, и вместо него в производство пошли истребители И-28 и Як-1. Это был первый советский Штурмовик с названием 'Штурмовик'."
 SOV_CAS_equipment_2:0 "Ильюшин Ил-2 Штурмовик"
 SOV_CAS_equipment_2_short:0 "Ил-2 Штурмовик"
 SOV_CAS_equipment_2_desc:0 "Ильюша, Горбун, Летающий танк, Летающий Пехотинец - вот некоторые из многочисленных прозвищ, данных Ил-2, фактически являющемуся лицом советских ВВС Второй мировой войны. Созданный в 1941 году, Ил-2 был штурмовиком, который вместе со своим преемником Ил-10 стал самым производимым боевым самолетом в истории авиации, причем только Ил-2 было выпущено 36 183 единицы. Самолет Ил-2 сыграл решающую роль на Восточном фронте. Несмотря на неточность бомбовых и ракетных ударов, его общая прочность делала его чрезвычайно эффективным в отражении всех, кроме крупных зенитных орудий высокого калибра, что позволило ему получить название Летающий Танк. Известный как Штурмовик, его более позднее название по классификации НАТО - Bark."
 SOV_CAS_equipment_3:0 "Ил-10"
 SOV_CAS_equipment_3_short:0 "Ил-10"
 SOV_CAS_equipment_3_desc:0 "Разработанный на основе Ил-2 Штурмовик, Ил-10 был спроектирован с целью устранения многих недостатков Ил-2. Основной целью было увеличение скорости и маневренности на малых высотах, главным образом для уклонения от малокалиберной зенитной артиллерии, которая была основной угрозой для штурмовиков. Вступив в строй в январе 1945 года, Ил-10 принял участие в некоторых из последних боевых операций в Европе, а также во время короткого советского вмешательства в Тихоокеанскую войну. К моменту снятия Ил-10 с вооружения в 1956 году, ВВС сместили акцент с чистого Штурмовика и наземных штурмовиков на истребители-бомбардировщики. Его условное наименование в НАТО - Beast."
 SOV_CAS_equipment_4:0 "Ил-16"
 SOV_CAS_equipment_4_short:0 "Ил-16"
 SOV_CAS_equipment_4_desc:0 "Ил-16 является окончательным развитием штурмовика. По сути, он был уменьшенной версией Ил-10, но был оснащен новым двигателем Микулина АМ-43НВ с расчетом на то, что он будет быстрее и маневреннее своего предшественника. Для испытаний было построено три самолета, но из-за непредвиденных проблем с двигателем, которые не удалось устранить, проект был отменен."
 
 SOV_jet_CAS_equipment_1:0 "Ильюшин Ил-10М"
 SOV_jet_CAS_equipment_1_desc:0 "Яковлев Як-23 Флора" - советский штурмовик, представленный в 1949 году. Самолет был развитием реактивного истребителя Як-15. Як-23 в основном экспортировался в страны Варшавского договора, где он оставался на вооружении до конца 1950-х годов."
 SOV_jet_CAS_equipment_1_short:0 "Ил-10M"
 SOV_jet_CAS_equipment_2:0 "Микоян-Гуревич МиГ-17АС"
 SOV_jet_CAS_equipment_2_desc:0 "Переоборудование истребителя-бомбардировщика, оснащенного возможностью нести неуправляемые ракеты и бомбы."
 SOV_jet_CAS_equipment_2_short:0 "МиГ-17АС"
 SOV_jet_CAS_equipment_3:0 "Микоян-Гуревич МиГ-19С"
 SOV_jet_CAS_equipment_3_desc:0 "Истребитель-бомбардировщик версии с цельноповоротным хвостом. Оснащен навигационным приемником дальнего действия "Свод" и вооружен тремя 30-мм пушками НР-30. Под каждым крылом размещалась неуправляемая ракета ОРО-32К или бомба ФАБ-250, а с 1957 года модифицирована для переноски четырех ракетных капсул."
 SOV_jet_CAS_equipment_3_short:0 "МиГ-19С"
 SOV_jet_CAS_equipment_4:0 "Сухой Су-7Б"
 SOV_jet_CAS_equipment_4_desc:0 "Бомбардировочный вариант Су-7 Fitter-A впервые поднялся в воздух в марте 1959 года и поступил на вооружение в 1961 году. В дальнейшем он стал основным советским штурмовиком 1960-х годов. В 1957-1972 годах было построено более 1400 самолетов Су-7Б, многие из которых были поставлены на экспорт. Самолет был относительно популярен за рубежом, где он служил в 10 странах. Он активно использовался в ВВС Индии и Египта. Самолет продолжает ограниченно эксплуатироваться в Северной Корее."
 SOV_jet_CAS_equipment_4_short:0 "Су-7Б"
 SOV_jet_CAS_equipment_5:0 "Сухой Су-7БКЛ"
 SOV_jet_CAS_equipment_5_desc:0 "Модернизированный двигатель АЛ-7Ф-1, модернизированная топливная система с внешними трубопроводами по обе стороны от хребта фюзеляжа, топливные баки, установленные в крыльях, "мокрые" подкрыльевые жесткие точки для установки внешних топливных баков, способен нести тактические ядерные бомбы."
 SOV_jet_CAS_equipment_5_short:0 "Су-7БКЛ"
 SOV_jet_CAS_equipment_6:0 "Сухой Су-17М"
 SOV_jet_CAS_equipment_6_desc:0 "Сухой Су-17 Fitter-C был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских стран и Южной Америки. Су-17 улучшил практически все аспекты своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено 2867 самолетов, которые использовались в 30 странах, 6 из которых используют самолет и сегодня."
 SOV_jet_CAS_equipment_6_short:0 "Су-17M"
 SOV_jet_CAS_equipment_7:0 "Микоян-Гуревич МиГ-27М"
 SOV_jet_CAS_equipment_7_desc:0 "МиГ-27 Flogger - советский штурмовик с изменяемой стреловидностью крыла. Самолет создан на базе МиГ-23, но оптимизирован для атаки с земли. В отличие от МиГ-23, МиГ-27 не получил широкого применения за пределами СССР. В 1970-1986 годах было произведено 1075 самолетов. МиГ-27 использовался на поздних этапах советско-афганской и Каргильской войн. Самолет продолжает ограниченно использоваться в Индии и Казахстане."
 SOV_jet_CAS_equipment_7_short:0 "Миг-27М"
 SOV_jet_CAS_equipment_8:0 "Сухой Су-25"
 SOV_jet_CAS_equipment_8_desc:0 "Сухой Су-25 Frogfoot - двухмоторный штурмовик, разработанный в Советском Союзе. Самолет совершил первый полет в 1975 году и был представлен в 1981 году. С 1978 года было произведено более 1000 самолетов. Самолет был особенно популярен за рубежом, он был продан в 29 стран. Благодаря этому Су-25 участвовал в нескольких конфликтах, в частности, в советско-афганской, ирано-иракской и войне в Персидском заливе. Сегодня самолет остается на вооружении всех стран-экспортеров."
 SOV_jet_CAS_equipment_8_short:0 "Су-25"

 #SOV_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 #SOV_cas_stealth_equipment_1_short:0 "Su-25SM"
 #SOV_cas_stealth_equipment_1_desc:0 "The Su-25SM (Stroyevoy Modernizirovannyi) is an "affordable" upgrade programme for the Su-25, conceived by the Russian Air Force in 2000. The programme stems from the attempted Su-25T and Su-25TM upgrades, which were evaluated and labeled as over-sophisticated and expensive. The SM upgrade incorporates avionics enhancements and airframe refurbishment to extend the Frogfoot's service life by up to 500 flight hours or 5 years. The Su-25SM's all-new PRnK-25SM "Bars" navigation/attack suite is built around the BTsVM-90 digital computer system, originally planned for the Su-25TM upgrade programme. Navigation and attack precision provided by the new suite is three times better of the baseline Su-25 and is reported to be within 15m using satellite correction and 200m without it."
 SOV_cas_stealth_equipment_1:0 "Сухой Су-39"
 SOV_cas_stealth_equipment_1_short:0 "Су-39"
 SOV_cas_stealth_equipment_1_desc:0 "Су-25Т второго поколения, Су-25ТМ (также обозначаемый Су-39), был разработан с улучшенными навигационными и ударными системами, и лучшей живучестью. При сохранении встроенного Шквала Су-25Т, он может нести РЛС "Копье" в контейнере под фюзеляжем, которая используется для поражения воздушных целей (ракетами РВВ-АЕ/Р-77), а также кораблей (противокорабельными ракетами Х-31 и Х-35)."


 SOV_nav_bomber_equipment_1:0 "Ильюшин Ил-4Т"
 SOV_nav_bomber_equipment_1_short:0 "Ил-4Т"
 SOV_nav_bomber_equipment_1_desc:0 "Первоначально известный как ДБ-3Ф, Ил-4 был способным средним бомбардировщиком, с дальностью, необходимой для выполнения даже стратегических бомбардировочных миссий. Модифицированная версия ДБ-3 имела новые двигатели и усиленную спинную турель (7,62-мм пулемет ШКАС был заменен на 12,7-мм пулемет УБТ). Некоторые серии имели деревянные внешние крылья и передние фюзеляжи для экономии металла, и на протяжении всего производства двигатели и топливные баки модернизировались для улучшения характеристик при сохранении прежней дальности полета. Однако, из-за дополнительного веса, двигатели оказались недостаточно мощными, и поэтому самолет был медленнее своего непосредственного предшественника. Его условное наименование по классификации НАТО - Bob."
 SOV_nav_bomber_equipment_2:0 "Туполев Ту-2Т"
 SOV_nav_bomber_equipment_2_short:0 "Ту-2Т"
 SOV_nav_bomber_equipment_2_desc:0 "Ту-2Т (прототип версии АНТ-62Т) был вариантом торпедоносца-бомбардировщика Ту-2, разработанным на основе варианта Ту-2Д. Решение использовать эту платформу для этой роли, вероятно, связано с благосклонностью экипажей к Ту-2, несмотря на то, что он был вторым по значимости бомбардировщиком советских ВВС во время Второй мировой войны (первым был Пе-2). Этот вариант будет служить у летчиков советской морской авиации на сумеречных этапах Второй мировой войны, а также в течение большей части послевоенного периода. Как и его родственник из ВВС, его условное обозначение в НАТО - 'Bat'."
 SOV_nav_bomber_equipment_3:0 "Ил-6"
 SOV_nav_bomber_equipment_3_short:0 "Ил-6"
 SOV_nav_bomber_equipment_3_desc:0 "Ил-6 является дальнейшим развитием дальнего бомбардировщика-торпедоносца Ил-4 Bob. Изначально предназначенный для замены Ил-4, Ил-6 имел гораздо большую дальность полета с дизельными двигателями, экономящими топливо. Он должен был иметь оборонительное вооружение из пяти 20-мм пушек. Однако летные испытания показали, что самолет плохо управляем на больших весах и малых скоростях, что затрудняет посадку. Кроме того, двигатели не могли запускаться при низких температурах и медленно реагировали на движение дроссельной заслонки. Несмотря на различные попытки усовершенствования, дальнейшие разработки были прекращены к 1944 году."
 SOV_nav_bomber_equipment_4:0 "Бериев Бе-6"
 SOV_nav_bomber_equipment_4_short:0 "Бе-6"
 SOV_nav_bomber_equipment_4_desc:0 "Бе-6 - летающая лодка производства КБ Бериева, впервые поднявшаяся в воздух в 1949 году. Он был способен выполнять широкий спектр задач. В дополнение к своей основной роли морского патруля и морской разведки, Бе-6 также использовался в патрулировании прибрежных районов и линий снабжения, в минных постановках, в качестве торпедоносца, среднего бомбардировщика и транспортного самолета. Его отчетное название USAF/NATO - Тип 34, а кодовое название НАТО - Madge."
 SOV_nav_bomber_equipment_5:0 "Бериев Бе-10"
 SOV_nav_bomber_equipment_5_short:0 "Бе-10"
 SOV_nav_bomber_equipment_5_desc:0 "Бе-10, также известный как Изделие М, был летающей лодкой с турбореактивным двигателем, разработанной Советским Союзом в 1956 году. Разработанный как патрульный бомбардировщик, Бе-10 был печально известен своей сложностью в управлении и страдал от усталости металла из-за напряжения планера во время высокоскоростных взлетов и посадок, а также из-за коррозии. Поэтому этот тип был быстро заменен на более поздний Бе-12 Mail. Известный на Западе как Mallow, модифицированный гражданский подвариант, M-10 был известен тем, что в 1961 году Международная Федерация Авиации (Fédération aéronautique internationale) установила 12 мировых рекордов."
 SOV_nav_bomber_equipment_6:0 "Бериев Бе-12Н Чайка"
 SOV_nav_bomber_equipment_6_short:0 "Бе-12Н Чайка"
 SOV_nav_bomber_equipment_6_desc:0 "Бе-12 был разработан в 1960 году как преемник и замена Бе-6 Madge и Бе-10 Mallow, и был разработан как противолодочный и морской патрульный самолет. В отличие от своего непосредственного предшественника с турбореактивным двигателем, Be-12 был турбовинтовым самолетом, а также имел убирающееся шасси, что придавало самолету способность к амфибийной посадке. Модернизированный вариант N был оснащен новыми датчиками, авионикой, поисково-атакующей системой «Нарцисс» и датчиком обнаружения магнитных аномалий (ОМА). Известный на местном уровне как "Чайка", его отчетное название НАТО - Mail."
 SOV_nav_bomber_equipment_7:0 "Туполев Ту-142"
 SOV_nav_bomber_equipment_7_short:0 "Ту-142"
 SOV_nav_bomber_equipment_7_desc:0 "Туполев Ту-142 - советский/российский морской разведывательный самолет и самолет противолодочной обороны (ПЛО), созданный на базе турбовинтового стратегического бомбардировщика Ту-95. Специализированный вариант самолета связи, получивший обозначение Ту-142МР, предназначался для обеспечения дальней связи с советскими подводными лодками с баллистическими ракетами. Ту-142 был разработан в ОКБ Туполева и производился Куйбышевским авиационным и Таганрогским машиностроительным заводами с 1968 по 1994 год. Ту-142 ранее эксплуатировался в ВМФ СССР и ВВС Украины, в настоящее время Ту-142 состоит на вооружении ВМФ России."
 SOV_nav_bomber_equipment_8:0 "Ил-38Н"
 SOV_nav_bomber_equipment_8_short:0 "Ил-38Н"
 SOV_nav_bomber_equipment_8_desc:0 "Ил-38 является адаптацией четырехмоторного турбовинтового самолета Ил-18 для использования в качестве морского патрульного самолета для советского военно-морского флота. Он отвечал требованиям по противодействию американским подводным лодкам с баллистическими ракетами. Ил-38Н - современная версия, иногда называемая Ил-38СД за «Морской Дракон», который представляет собой новую систему поиска и слежения. Версия для ВМФ России оснащена системой «Новелла» P-38. «Новелла» P-38 способна находить воздушные цели на дальности до 90 километров и сопровождать надводные объекты в радиусе 320 километров, может одновременно отслеживать 32 надводные и подводные цели."

 SOV_aerosub_0:0 "Летающая Подводная Лодка ЛПЛ им. Ушакова"
 SOV_aerosub_0_short:0 "ЛПЛ Аэролодка"
 SOV_aerosub_0_Desc:0 "В межвоенный период Советский Союз начал изучать военно-морские концепции и проводить большое количество экспериментов, чтобы попытаться революционизировать морскую борьбу. Перед самой Второй мировой войной Борис Ушаков из Военно-морской инженерной академии имени Дзержинского предложил концепцию летающей подводной лодки - морского бомбардировщика, который мог погружаться под воду или всплывать по желанию для проведения морских бомбардировочных операций. Проект неоднократно поднимался Ушаковым в последующие годы и, в конце концов, в 1938 году был рассмотрен в менее серьезном качестве. Значительная сложность конструкции оказалась непомерно высокой, и в итоге в 1939 году проект был отменен. Однако в 1943 году Лаврентий Берия возродил проект, и в 1947 году было проведено первое испытание. В 1953 году проект был отменен Хрущевым из-за его непрактичности и того, что прогресс практически отсутствовал, поскольку он даже не мог нормально летать."
 
 SOV_tac_bomber_equipment_0:0 "Ильюшин ДБ-3"
 SOV_tac_bomber_equipment_0_short:0 "ДБ-3"
 SOV_tac_bomber_equipment_0_desc:0 "ДБ-3 - двухмоторный низкокрылый бомбардировщик, поступивший на вооружение советских ВВС в 1936 году. Несмотря на то, что карьера в советских вооруженных силах была в основном спокойной, этот тип служил в Китае, в составе ВВС националистического Китая во время Второй китайско-японской войны. Он также стал первым советским бомбардировщиком, совершившим налет на столицу Германии Берлин в первые месяцы Восточного фронта Второй мировой войны. Обозначение ДБ является сокращением от Дальний Бомбардировщик, что означает дальний бомбардировщик."
 SOV_tac_bomber_equipment_1:0 "Ильюшин ДБ-3М"
 SOV_tac_bomber_equipment_1_short:0 "ДБ-3М"
 SOV_tac_bomber_equipment_1_desc:0 "Первая серьезная модернизация ДБ-3."
 SOV_tac_bomber_equipment_2:0 "Петляков Пе-2Б"
 SOV_tac_bomber_equipment_2_short:0 "Пе-2Б"
 SOV_tac_bomber_equipment_2_desc:0 "Петляков Пе-2 - советский двухмоторный пикирующий бомбардировщик, использовавшийся во время Второй мировой войны. Один из выдающихся тактических штурмовиков войны, он также успешно применялся в качестве тяжелого истребителя, ночного истребителя (вариант Пе-3) и разведчика. Во многих отношениях он напоминал деревянный британский de Havilland Mosquito. Пе-2 был численно самым важным советским бомбардировщиком Второй мировой войны, на пике своего развития он составлял 75% советских двухмоторных бомбардировщиков."
 SOV_tac_bomber_equipment_3:0 "Туполев Ту-2"
 SOV_tac_bomber_equipment_3_short:0 "Ту-2"
 SOV_tac_bomber_equipment_3_desc:0 "Ту-2 - двухмоторный скоростной дневной бомбардировщик, разработанный в 1941 году. Он был разработан в качестве советского ответа на средний бомбардировщик Юнкерс Ju-88 и отвечал требованиям к скоростному бомбардировщику или пикирующему бомбардировщику с большой внутренней бомбовой нагрузкой и скоростью, аналогичной скорости одноместного истребителя. Он достаточно хорошо справился с поставленной задачей, и появились варианты торпедоносца, разведчика и тяжелого истребителя, сыгравшие ключевую роль в последних наступлениях советских войск во Второй мировой войне. Послевоенное обозначение в НАТО - Bat."

 SOV_jet_tac_bomber_equipment_1:0 "Ил-22"
 SOV_jet_tac_bomber_equipment_1_short:0 "Ил-22"
 SOV_jet_tac_bomber_equipment_1_desc:0 "Ил-22 был первым советским бомбардировщиком с реактивным двигателем. Он использовал четыре турбореактивных двигателя Люлька ТР-1, установленных на коротких горизонтальных пилонах впереди и под крылом. Двигатели не соответствовали проектной тяге, а расход топлива был выше запланированного. Эти проблемы привели к тому, что самолет не смог достичь требуемых характеристик, и 22 сентября 1947 года он был снят с производства."
 SOV_jet_tac_bomber_equipment_2:0 "Ильюшин Ил-28"
 SOV_jet_tac_bomber_equipment_2_short:0 "Ил-28"
 SOV_jet_tac_bomber_equipment_2_desc:0 "Ил-28 - турбореактивный средний бомбардировщик, разработанный сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, запущенный в крупносерийное производство, Ил-28, представленный в 1950 году, участвовал во многих крупных конфликтах холодной войны, от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. Даже после снятия с вооружения СССР к 1980-м годам, многие самолеты этого типа продолжают служить и по сей день. Отчетное название ВВС США и Министерства обороны - Тип 27, кодовое название НАТО - Beagle."
 SOV_jet_tac_bomber_equipment_3:0 "Яковлев Як-28Б"
 SOV_jet_tac_bomber_equipment_3_short:0 "Як-28Б"
 SOV_jet_tac_bomber_equipment_3_desc:0 "Як-28 был разработан как боевой самолет со стреловидным крылом, представленный в 1960 году. Варианты бомбардировщика Як-28, известные под кодовым названием НАТО Brewer, имели двигатели, установленные в капсулах, аналогично Як-25 Flashlight, на базе которого он был разработан. Благодаря этому и стреловидному крылу, самолет имел высокую дозвуковую скорость и мог достигать трансзвуковых скоростей на большой высоте. Он служил в качестве основного легкого бомбардировщика советских ВВС, и в основном использовался Россией, Беларусью и Туркменистаном после распада Советского Союза, все они были сняты с вооружения к 1992 году."
 SOV_jet_tac_bomber_equipment_4:0 "Яковлев Як-28И"
 SOV_jet_tac_bomber_equipment_4_short:0 "Як-28И"
 SOV_jet_tac_bomber_equipment_4_desc:0 "Улучшенная версия с внутренней системой целеуказания «Инициатива-2» 360-градусный наземный картографический радар наряду с наземной управляемой системой целеуказания с использованием триангуляции от наземных передатчиков"
 SOV_jet_tac_bomber_equipment_5:0 "Микоян-Гуревич МиГ-25РБТ"
 SOV_jet_tac_bomber_equipment_5_short:0 "МиГ-25РБС"
 SOV_jet_tac_bomber_equipment_5_desc:0 "МиГ-25РБС - одноместный разведчик-бомбардировщик, производный от МиГ-25Р, оснащенный усовершенствованными системами разведки и автоматической бомбардировочной системой "Пеленг". Самолет может нести бомбовую нагрузку из восьми бомб весом 500 кг (1 102 фунта)."
 SOV_jet_tac_bomber_equipment_6:0 "Сухой Су-24"
 SOV_jet_tac_bomber_equipment_6_short:0 "Су-24"
 SOV_jet_tac_bomber_equipment_6_desc:0 "Большой истребитель-бомбардировщик, разработанный Советским Союзом в 1960-х годах и используемый по сей день. Характерными особенностями являются изменяемые крылья и острый корпус. Он может оснащаться до 8 000 кг вооружения и способен запускать различные типы ракет класса "воздух-земля", сохраняя при этом стабильную скорость. Этот самолет известен под кодовым названием НАТО Fencer. Вместе со своим преемником, Су-34, он в настоящее время активно используется в качестве истребителя-бомбардировщика в странах бывшего Восточного лагеря."
 SOV_jet_tac_bomber_equipment_7:0 "Сухой Су-24М"
 SOV_jet_tac_bomber_equipment_7_short:0 "Су-24М"
 SOV_jet_tac_bomber_equipment_7_desc:0 "Поступивший на вооружение в 1983 году, Су-24М был дальнейшим развитием Су-24 с момента поступления на вооружение первоначального типа. Одной из основных особенностей Су-24М является возможность дозаправки в полете с помощью выдвижного заправочного зонда, новая внутренняя навигационная система и лазерный целеуказатель «Кайра-24», позволяющий использовать бомбы с точным наведением. На Западе он известен как Fencer-D."
 SOV_jet_tac_bomber_equipment_8:0 "Сухой Су-34"
 SOV_jet_tac_bomber_equipment_8_short:0 "Су-34"
 SOV_jet_tac_bomber_equipment_8_desc:0 "Штурмовик, разработанный на базе Су-27 с кабиной с двумя креслами. Обладает маневренностью высшего класса для штурмовика, своими маневренными движениями агрессивно конкурируя с истребителями того же класса. Более толстая броня также повышает его выживаемость. Кодовое название НАТО - Fullback. При выполнении штурмовых миссий в течение длительного периода времени в задней секции пилотских кресел располагается тазик и простая кухня."
 
 SOV_strat_bomber_equipment_1:0 "Петляков Пе-8"
 SOV_strat_bomber_equipment_1_short:0 "Пе-8"
 SOV_strat_bomber_equipment_1_desc:0 "Советский тяжелый бомбардировщик, разработанный до Второй мировой войны, Пе-8 (первоначально ТБ-7, название изменено в честь Владимира Петлякова после его смерти в 1942 году) был единственным четырехмоторным бомбардировщиком, разработанным во время войны. Выпущенный в ограниченном количестве, он использовался для бомбардировки Берлина в августе 1941 года. Он также использовался для так называемых "моральных рейдов", призванных поднять дух советского народа путем выявления уязвимых мест Оси. Однако его основной задачей было нанесение ночных ударов по немецким аэродромам, железнодорожным станциям и другим объектам в тылу. Поскольку эти самолеты поднимали боевой дух, немецкие люфтваффе часто выбирали их в качестве мишени, и большое их количество было уничтожено в ходе Великой Отечественной войны. После войны они служили в основном как транспортники до конца 1950-х годов."
 SOV_strat_bomber_equipment_2:0 "Ил-4"
 SOV_strat_bomber_equipment_2_short:0 "Ил-4"
 SOV_strat_bomber_equipment_2_desc:0 "Хотя Ил-4 был только средним бомбардировщиком, он имел достаточную дальность для использования в стратегических миссиях. Использование бомбардировщиков в этой роли не было приоритетным для ВВС, но, тем не менее, Ил-4 использовался в нескольких дальних бомбардировочных рейдах на Берлин в 1941 году. Большинство из них использовались в миссиях на гораздо меньшие расстояния, часто добавляя еще 1000 кг (2204 фунта) бомб под крыльями, в дополнение к внутреннему 2500 кг (5512 фунтов)."
 SOV_strat_bomber_equipment_3:0 "Туполев Ту-4"
 SOV_strat_bomber_equipment_3_short:0 "Ту-4"
 SOV_strat_bomber_equipment_3_desc:0 "Ту-4 - это реверсивная конструкция на базе американского B-29 Superfortress, разработанная в связи с необходимостью Иосифа Сталина иметь стратегический бомбардировщик с возможностями, аналогичными американскому бомбардировщику, выигравшему войну. Несмотря на отказ США предоставить B-29 по ленд-лизу, четыре B-29 упали на советской территории, и этого было достаточно, чтобы начать процесс реинжиниринга. Несмотря на многочисленные трудности (приобретение деталей, эквивалентных или превосходящих детали американской разработки, переход с имперской на метрическую систему и т.д.), первый полет Ту-4 и его вступление в строй стали достаточным поводом для паники США и Великобритании, первой из многих во время холодной войны. Однако срок его службы был недолгим, и к середине 1960-х годов он был заменен реактивными бомбардировщиками. Его условное наименование в НАТО - Bull."

 SOV_jet_strat_bomber_equipment_1:0 "Туполев Ту-16"
 SOV_jet_strat_bomber_equipment_1_short:0 "Ту-16"
 SOV_jet_strat_bomber_equipment_1_desc:0 "Ту-16 - двухмоторный стратегический бомбардировщик, разработанный в 1952 году и ставший одним из первых стратегических бомбардировщиков с реактивным двигателем, поступивших на вооружение советских ВВС. Он имел стреловидную конфигурацию крыла и оснащался двумя турбореактивными двигателями Микулина АМ-3 в корневых частях крыла. Он мог нести до 9000 кг (20 000 фунтов) боеприпасов, включая ядерное оружие и ФАБ-9000 - бомбу весом 9000 кг, по мощности аналогичную британской бомбе «Гранд Слэм». Известный на Западе как Badger, этот тип служил на протяжении всей холодной войны и был снят с вооружения в 1993 году. Китайский вариант H-6, построенный по лицензии, остается в строю в качестве передового стратегического бомбардировщика ВВС НОАК." 
 SOV_jet_strat_bomber_equipment_2:0 "Молот Мясищева МЯ-3М"
 SOV_jet_strat_bomber_equipment_2_short:0 "M-3M Молот "
 SOV_jet_strat_bomber_equipment_2_desc:0 "Мя-4 (или М-4, обозначение Мясищева 2М) - четырехмоторный стратегический бомбардировщик, поступивший на вооружение в 1956 году. Этот бомбардировщик обладал большой дальностью полета и мог наносить удары по целям непосредственно на американском материке с российских баз, хотя это был полет в один конец. Несмотря на это, а также другие тактики выборочной дезинформации, привели западных политиков и разведывательные службы в панику, что привело к строительству большего количества самолетов B-47 «Стратоджет» и недавно появившегося B-52 «Стратофортресс». Русские официально прозвали его Молот, в то время как НАТО присвоило ему кодовое название Bison, а ВВС США обозначили его Тип 37." 
 SOV_jet_strat_bomber_equipment_3:0 "Туполев Ту-95М"
 SOV_jet_strat_bomber_equipment_3_short:0 "Ту-95М"
 SOV_jet_strat_bomber_equipment_3_desc:0 "Если когда-либо существовал бомбардировщик, который можно было бы назвать лицом советских бомбардировочных сил, то это был бы Ту-95. Ту-95, представленный в 1956 году, является единственным винтомоторным стратегическим бомбардировщиком, который до сих пор находится в эксплуатации. Это один из самых громких военных самолетов, поскольку лопасти винта движутся быстрее скорости звука. Как и американский B-52 «Стратофортресс», бомбардировщик, с которым часто сравнивают Ту-95. Планируется, что Ту-95 останется на вооружении российской авиации до 2040-х годов. Для Запада вполне уместно, что самолету, являющемуся синонимом советской империи, присвоено кодовое имя Bear."
 SOV_jet_strat_bomber_equipment_4:0 "Туполев Ту-95КД"
 SOV_jet_strat_bomber_equipment_4_short:0 "Ту-95КД"
 SOV_jet_strat_bomber_equipment_4_desc:0 "Эта версия Ту-95 получила модернизацию бортового оборудования, предназначенную для перевозки управляемых ракет типа Х-20 "воздух-поверхность"." 
 SOV_jet_strat_bomber_equipment_5:0 "Туполев Ту-95МС"
 SOV_jet_strat_bomber_equipment_5_short:0 "Ту-95МС"
 SOV_jet_strat_bomber_equipment_5_desc:0 "Совершенно новая платформа-носитель крылатых ракет на базе планера Ту-142. Этот вариант стал стартовой платформой крылатой ракеты Х-55 "Радуга" и запущен в серийное производство в 1981 году. Известен в НАТО как Bear-H, а американские военные некоторое время в 1980-х годах называли его Ту-142, прежде чем стало известно его истинное обозначение."

 SOV_mach2stratbomber_equipment_1:0 "Туполев Ту-22"
 SOV_mach2stratbomber_equipment_1_short:0 "Ту-22"
 SOV_mach2stratbomber_equipment_1_desc:0 "Первый сверхзвуковой бомбардировщик, запущенный в производство в Советском Союзе, Ту-22 поступил на вооружение советских ВВС в 1962 году. Выпущенный в небольшом количестве (было построено 311 самолетов), этот тип оказался разочарованием, не имея межконтинентальной дальности, которая ожидалась от такого бомбардировщика. Несмотря на это, Ту-22 модернизировался на протяжении всего срока службы, и в настоящее время используется в качестве пусковой платформы для противокорабельной ракеты большой дальности Х-22. Его кодовое название в НАТО - Blinder."
 SOV_mach2stratbomber_equipment_2:0 "Туполев Ту-22М2"
 SOV_mach2stratbomber_equipment_2_short:0 "Ту-22М2"
 SOV_mach2stratbomber_equipment_2_desc:0 "Ту-22М2 является дальнейшим развитием Ту-22 Blinder. Ту-22М, первоначально обозначавшийся как Ту-26, использовался как советскими ВВС (в качестве стратегического бомбардировщика, заменив Ту-22 Blinder), так и советской морской авиацией (в качестве морского патрульного самолета). Когда его обнаружили американские войска, это вызвало шок на Западе, тем более что премьер Хрущев, по слухам, заявил, что МБР сделают бомбардировщики устаревшими. Вариант Ту-22М2, о котором идет речь, был первым серийным вариантом, с двигателями и воздухозаборниками в стиле F-4 Phantom, которые обеспечили самолету максимальную скорость 1,65 Маха. По состоянию на 2014 год более 100 Ту-22М2 Blinder-B находятся на вооружении ВВС России."
 SOV_mach2stratbomber_equipment_3:0 "Туполев Ту-22М3"
 SOV_mach2stratbomber_equipment_3_short:0 "Ту-22М3"
 SOV_mach2stratbomber_equipment_3_desc:0 "Более поздний Ту-22М3, который впервые полетел в 1977 году, введен в эксплуатацию в 1983 году и официально поступил на вооружение в 1989 году, имел новые двигатели НК-25 значительно большей мощности, клиновидные впускные рампы, аналогичные МиГ-25, крылья с большей максимальной стреловидностью и переделанную носовую часть, в которой разместились новая навигационно-штурмовая РЛС «Алмаз ПНА» (Планета Носитель, изд. 030А) и навигационно-штурмовой комплекс НК-45, обеспечивающий значительно улучшенный полет на малых высотах. "
 SOV_mach3stratbomber_equipment_1:0 "Сухой T-4M Сотка"
 SOV_mach3stratbomber_equipment_1_short:0 "T-4M Сотка"
 SOV_mach3stratbomber_equipment_1_desc:0 "Т-4М был дальнейшим макетным проектом оригинального Т-4, разработанным на основе американского XB-70 «Валькирия». Т-4М был разработан с крыльями изменяемой геометрии и увеличенными предкрылками, но при этом сохранил фюзеляж и конструкцию двигателя Т-4. Предполагается, что максимальная скорость T-4M будет составлять 3 Маха, а крейсерская скорость - 2,8 Маха."
 SOV_mach6stratbomber_equipment_1:0 "Сухой T-4МС"
 SOV_mach6stratbomber_equipment_1_short:0 "T-4МС"
 SOV_mach6stratbomber_equipment_1_desc:0 "Полная и тотальная переделка высокомашинного стратегического бомбардировщика Т-4М. е ОКБ Сухого приступило к разработке принципиально нового стратегического двухрежимного самолета Т-4МС на основе опыта, полученного при создании Т-4 Сотка. На нем планировалось установить те же силовые установки, бортовые системы и оборудование."

 SOV_nuclearstratbomber_equipment_1:0 "Туполев Ту-119"
 SOV_nuclearstratbomber_equipment_1_short:0 "Ту-119"
 SOV_nuclearstratbomber_equipment_1_desc:0 "Ту-119 был разработкой стратегического бомбардировщика с ядерным двигателем, созданного на основе Ту-95 после использования исследовательского самолета (Ту-95ЛМЛ). Тип должен был оснащаться двумя ядерными двигателями на борту (использующими энергию от тепла, вырабатываемого бортовым ядерным реактором) и двумя турбовинтовыми двигателями на керосине на борту." 
 SOV_nuclearstratbomber_equipment_2:0 "Мясищев М-60"
 SOV_nuclearstratbomber_equipment_2_short:0 "М-60"
 SOV_nuclearstratbomber_equipment_2_desc:0 "М-60 был проектом Мясищева для стратегического бомбардировщика с ядерной силовой установкой, основанного на проекте стратегического бомбардировщика М-50 Bounder. Он должен был оснащаться четырьмя турбореактивными двигателями без форсажа в конфигурации, аналогичной Ту-119: два внутренних двигателя, работающие от ядерного реактора, и два внешних двигателя, работающие на керосине. Из-за опасений нанесения ущерба окружающей среде в результате казусов или аварий и перерасхода средств проект был бы прекращен."
 
 SOV_stealth_tactical_bomber_equipment_1:0 "Сухой Су-24БМ"
 SOV_stealth_tactical_bomber_equipment_1_short:0 "Су-24БМ"
 SOV_stealth_tactical_bomber_equipment_1_desc:0 "В 1979 году в Сарове началась работа над гораздо более крупной разработкой Су-24М, которая имела внутренний отсек для вооружения, способный вместить большинство вооружений, предназначенных для использования на новом самолете. Известный в ОКБ как Т-6БМ (Большая модификация или большая модификация), а в W S как Су-24БМ, это был гораздо более крупный, но более скрытный самолет, чем Су-24."
 #SOV_stealth_tactical_bomber_equipment_2:0 "Sukhoi Su-34M"
 #SOV_stealth_tactical_bomber_equipment_2_short:0 "Su-34M"
 #SOV_stealth_tactical_bomber_equipment_2_desc:0 "Modernized version Su-34. According to reports, this upgrade will seriously affect almost all of the aircraft's avionics. The radar, sight, communication system will be improved. The range of "smart" bombs and missiles that the bomber can use will be significantly expanded. EW capabilities will also be expanded with introduction of new hardpoints."

 SOV_stealth_strategic_bomber_equipment_1:0 "Туполев Ту-160"
 SOV_stealth_strategic_bomber_equipment_1_short:0 "Ту-160"
 SOV_stealth_strategic_bomber_equipment_1_desc:0 "Туполев Ту-160 - сверхзвуковой тяжелый стратегический бомбардировщик с изменяемой стреловидностью крыла, разработанный КБ Туполева в Советском Союзе в 1970-х годах. Это самый большой и самый тяжелый сверхзвуковой военный самолет со скоростью 2+ Маха из когда-либо построенных, а по общей длине он уступает лишь экспериментальному XB-70 «Валькирия». По состоянию на 2021 год, это самый большой и тяжелый боевой самолет, самый быстрый бомбардировщик, находящийся в эксплуатации, и самый большой и тяжелый самолет с крылом изменяемой стреловидности из когда-либо летавших."
 #SOV_stealth_strategic_bomber_equipment_2:0 "Tupolev Tu-160M2"
 #SOV_stealth_strategic_bomber_equipment_2_short:0 "Tu-160M2"
 #SOV_stealth_strategic_bomber_equipment_2_desc:0 "Highly upgraded version featuring low observable coatings, new more powerful and efficient engines giving it greater operational range, new avionics, electronics, glass cockpit, communications and control systems, and a number of weapons, as well as improved thrust and unrefueled range. It will also have a new defensive system protecting it from missiles."
 SOV_stealth_strategic_bomber_equipment_2:0 "Туполев ПАК ДА"
 SOV_stealth_strategic_bomber_equipment_2_short:0 "ПАК ДА"
 SOV_stealth_strategic_bomber_equipment_2_desc:0 "ПАК ДА (аббревиатура, означающая Перспективный авиационный комплекс дальней авиации, или перспективный авиационный комплекс дальней авиации) - предполагаемый российский стратегический бомбардировщик нового поколения, разрабатываемый для ВВС России. Ожидается, что стратегический бомбардировщик класса "Стелс" ПАК ДА поступит на вооружение в 2025-30 годах, а первый самолет будет поставлен в период между 2020 и 2023 годами, с целью замены бомбардировщиков Ту-95 'Bear' и Ту-160 'Blackjack'."

