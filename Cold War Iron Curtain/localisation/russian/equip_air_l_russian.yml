 #ICBM
 icbm_equipment_1:0 "МБР I"
 icbm_equipment_1_short:0 "МБР I"
 icbm_equipment_1_desc:0 "МБР - это баллистические ракеты межконтинентальной дальности. Это базовый вариант, который может даже поразить цель."
 icbm_equipment_2:0 "МБР II"
 icbm_equipment_2_short:0 "МБР II"
 icbm_equipment_2_desc:0 "МБР - это баллистические ракеты межконтинентальной дальности. Этот вариант был значительно усовершенствован."
 icbm_equipment_3:0 "МБР III"
 icbm_equipment_3_short:0 "МБР III"
 icbm_equipment_3_desc:0 "МБР - это баллистические ракеты межконтинентальной дальности. Этот вариант обладает большей дальностью и мощностью, чем предыдущий."
 icbm_equipment_4:0 "МБР IV"
 icbm_equipment_4_short:0 "МБР IV"
 icbm_equipment_4_desc:0 "МБР - это баллистические ракеты межконтинентальной дальности. Этот вариант имеет большую полезную нагрузку и способен применять базовые маневры уклонения в фазе терминального удара."
 icbm_equipment_5:0 "МБР V"
 icbm_equipment_5_short:0 "МБР V"
 icbm_equipment_5_desc:0 "МБР - это баллистические ракеты межконтинентальной дальности. Этот вариант дальнего радиуса действия имеет большую полезную нагрузку и способен применять передовые маневры уклонения в фазе конечного удара."

 ###Helicopter###

 #Attack Helicopter
 attack_helicopter_equipment_1:0 "Ударный Вертолет I"
 attack_helicopter_equipment_1_short:0 "Ударный Вертолет I"
 attack_helicopter_equipment_1_desc:0 "Первые ударные вертолеты или боевые корабли с базовым вооружением из пулеметов, авиационных пушек или ракет обладают непревзойденной способностью к зависанию и превосходной устойчивостью над полем боя."
 attack_helicopter_equipment_2:0 "Ударный Вертолет II"
 attack_helicopter_equipment_2_short:0 "Ударный Вертолет II"
 attack_helicopter_equipment_2_desc:0 "Более зрелая конструкция вертолета, вооруженного специально разработанной и специально изготовленной цепной пушкой и крыльями для размещения ракетных капсул, топливных баков или дополнительного вооружения. Возможно, будут включены даже противотанковые ракеты?"
 attack_helicopter_equipment_3:0 "Ударный Вертолет III"
 attack_helicopter_equipment_3_short:0 "Ударный Вертолет III"
 attack_helicopter_equipment_3_desc:0 "Усовершенствованная конструкция вертолетов с несколькими двигателями на случай отказа двигателя и более высокими характеристиками по сравнению с предшественниками. Теперь вертолеты вооружены различными боеприпасами, такими как ракеты, реактивные снаряды, пушки."
 attack_helicopter_equipment_4:0 "Ударный Вертолет VI"
 attack_helicopter_equipment_4_short:0 "Ударный Вертолет VI"
 attack_helicopter_equipment_4_desc:0 "Усовершенствованная конструкция вертолета с новыми головными дисплеями, полуцифровой кабиной и вооруженная радарами управления огнем для обнаружения противостоящих сил. Возможность стрельбы из всплывающей стрелковой установки позволяет ему вести огонь даже из-за укрытия."
 attack_helicopter_equipment_5:0 "Ударный Вертолет V"
 attack_helicopter_equipment_5_short:0 "Ударный Вертолет V"
 attack_helicopter_equipment_5_desc:0 "Современный вертолет, оснащенный современными цифровыми и сетевыми системами, передовыми дисплеями и системами связи, позволяет ему превосходить все, что было до него. Он оснащен передовыми системами вооружения, ракетами с лазерным наведением, а его сетевые возможности позволяют ему легко интегрироваться с дружественными наземными силами или другими системами вооружения."

 #Scout Helicopter
 scout_helicopter_equipment_1:0 "Разведчик/Легкий Ударный I"
 scout_helicopter_equipment_1_short:0 "Разведчик/Легкий Ударный Вертолет I"
 scout_helicopter_equipment_1_desc:0 "Легкий и маневренный вертолет-разведчик для поиска и разведки позиций противника."
 scout_helicopter_equipment_2:0 "Разведчик/Легкий Ударный II"
 scout_helicopter_equipment_2_short:0 "Разведчик/Легкий Ударный Вертолет II"
 scout_helicopter_equipment_2_desc:0 "Легкий и маневренный вертолет-разведчик для поиска и разведки позиций противника. Благодаря легкому вооружению он способен к самообороне."
 scout_helicopter_equipment_3:0 "Разведчик/Легкий Ударный III"
 scout_helicopter_equipment_3_short:0 "Разведчик/Легкий Ударный Вертолетr III"
 scout_helicopter_equipment_3_desc:0 "Легкий и маневренный вертолет-разведчик, вооруженный ракетами, реактивными снарядами или пушками, может вести разведку силами дружественных наземных войск."
 scout_helicopter_equipment_4:0 "Разведчик/Легкий Ударный VI"
 scout_helicopter_equipment_4_short:0 "Разведчик/Легкий Ударный Вертолет VI"
 scout_helicopter_equipment_4_desc:0 "Современный вертолет-разведчик, оснащенный разнообразным вооружением и цифровыми приборами, может пронестись над полем боя и с помощью своих дисплеев и ФЛИР-камер быстрее и быстрее обнаружить позиции противника."
 scout_helicopter_equipment_5:0 "Разведчик/Легкий Ударный V"
 scout_helicopter_equipment_5_short:0 "Разведчик/Легкий Ударный Вертолет V"
 scout_helicopter_equipment_5_desc:0 "Отличный современный вертолет-разведчик, вооруженный до зубов смертоносным оружием и оснащенный ФЛИР-дисплеями и радарными системами, чтобы разведать силы противника еще до того, как он узнает о присутствии вертолета-разведчика."

 #Naval Helicopter
 naval_helicopter_equipment:0 "Морской Противолодочный Вертолет"
 naval_helicopter_equipment_1:0 "Морской Противолодочный Вертолет I"
 naval_helicopter_equipment_1_short:0 "Противолодочный Вертолет I"
 naval_helicopter_equipment_1_desc:0 "Ранний противолодочный вертолет с установленной системой гидролокатора погружения для поиска подводных лодок."
 naval_helicopter_equipment_2:0 "Морской Противолодочный Вертолет II"
 naval_helicopter_equipment_2_short:0 "Противолодочный Вертолет II"
 naval_helicopter_equipment_2_desc:0 "Усовершенствованный ранний противолодочный вертолет с установленным гидролокатором погружения для поиска подводных лодок и возможностью поражения их торпедами."
 naval_helicopter_equipment_3:0 "Морской Противолодочный Вертолет III"
 naval_helicopter_equipment_3_short:0 "Противолодочный Вертолет III"
 naval_helicopter_equipment_3_desc:0 "Усовершенствованный противолодочный вертолет с увеличенным временем нахождения в воздухе, установленным гидролокатором погружения для поиска подводных лодок и возможностью поражать их торпедами."
 naval_helicopter_equipment_4:0 "Морской Противолодочный Вертолет IV"
 naval_helicopter_equipment_4_short:0 "Противолодочный Вертолет IV"
 naval_helicopter_equipment_4_desc:0 "Большой противолодочный вертолет с увеличенным временем нахождения в воздухе, установленным гидролокатором погружения для поиска подводных лодок и возможностью поражать их торпедами."
 naval_helicopter_equipment_5:0 "Морской Противолодочный Вертолет V"
 naval_helicopter_equipment_5_short:0 "Противолодочный Вертолет V"
 naval_helicopter_equipment_5_desc:0 "Усовершенствованный большой противолодочный вертолет с увеличенным временем нахождения в воздухе, установленным гидролокатором погружения для поиска подводных лодок и возможностью поражать их торпедами."
 naval_helicopter_equipment_6:0 "Морской Противолодочный Вертолет VI"
 naval_helicopter_equipment_6_short:0 "Противолодочный Вертолет VI"
 naval_helicopter_equipment_6_desc:0 "Современный противолодочный вертолет с длительным временем нахождения в воздухе, усовершенствованной системой гидролокатора погружения, установленной для поиска подводных лодок, и возможностью поражать их торпедами."
 naval_helicopter_equipment_7:0 "Морской Противолодочный Вертолет VII"
 naval_helicopter_equipment_7_short:0 "Противолодочный Вертолет VII"
 naval_helicopter_equipment_7_desc:0 "Современный противолодочный вертолет с длительным временем нахождения в воздухе, установленной передовой гидролокационной системой погружения для поиска подводных лодок и возможностью поражения их торпедами."
 
 ###UAV###

 uav:0 "Беспилотный Летательный Аппарат"
 uav_short:0 "БПЛА"
 uav_desc:0 "Хотя применение беспилотников не является чем-то новым, это первое поколение беспилотных летательных аппаратов с более длительным временем нахождения в воздухе и более совершенными датчиками является первой действительно способной платформой для наблюдения и вооружения, развернутой в широком масштабе. Это открывает двери для новых возможностей."

 #Man-portable UAV
 mp_uav_1_short:0 "Разведывательный БПЛА I"
