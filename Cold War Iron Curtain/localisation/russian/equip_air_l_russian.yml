 FRA_cv_mr_stealth_fighter_equipment_1:0 "Дассо «Рафале» M вариант F3-R"
 FRA_cv_mr_stealth_fighter_equipment_1_short:0 "«Рафале» M"
 FRA_cv_mr_stealth_fighter_equipment_1_desc:0 "То же, что и «Рафале» C F3-R, но в варианте носителя для морской авиации Франции, который поступил на вооружение в 2001 году. Для эксплуатации на авианосцах модель M имеет усиленный планер, более длинную носовую опору шасси, обеспечивающую более высокую посадку, увеличенное хвостовое оперение между двигателями, а также встроенную посадочную лестницу. В результате «Рафале» M весит на 500 кг (1100 фунтов) больше, чем «Рафале» C. Это единственный неамериканский истребитель, допущенный к эксплуатации с палуб американских авианосцев с использованием катапульт и их подъемных устройств, что было продемонстрировано в 2008 году, когда шесть «Рафале» из Flottille 12F приняли участие в учениях по взаимодействию с авианосцем USS Theodore Roosevelt Carrier Air Wing."
 
