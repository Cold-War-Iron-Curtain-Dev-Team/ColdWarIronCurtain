 cas_uav_equipment_1_desc:0 "Беспилотный боевой летательный аппарат первого поколения. Это поколение отличается мощными сенсорами и ограниченным вооружением."
 cas_uav_equipment_2:0 "Ударный Дрон II"
 cas_uav_equipment_2_short:0 "Ударный Дрон II"
 cas_uav_equipment_2_desc:0 "Беспилотный боевой летательный аппарат второго поколения. Это поколение отличается еще большим количеством датчиков и мощным вооружением."
 cas_uav_equipment_3:0 "Ударный Дрон III"
 cas_uav_equipment_3_short:0 "Ударный Дрон III"
 cas_uav_equipment_3_desc:0 "Беспилотный боевой летательный аппарат третьего поколения. Это поколение отличается еще большим количеством датчиков, значительной боевой нагрузкой и возможностями радиоэлектронной борьбы."
 
