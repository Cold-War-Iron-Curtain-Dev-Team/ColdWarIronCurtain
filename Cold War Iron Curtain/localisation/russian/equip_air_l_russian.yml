 PRC_slbm_equipment_6:0 "Ju Lang-1"
 PRC_slbm_equipment_6_short:0 "JL-1"
 PRC_slbm_equipment_6_desc:0 "The Julang-1 was China's first generation nuclear submarine-launched ballistic missile (SLBM). According to a US Department of Defense report in 2011, the operational status of the JL-1 was questionable."
 PRC_slbm_equipment_7:0 "Ju lang-2"
 PRC_slbm_equipment_7_short:0 "JL-2"
 PRC_slbm_equipment_7_desc:0 "The JL-2 is a Chinese second-generation intercontinental-range submarine-launched ballistic missile (SLBM) deployed on the People's Liberation Army Navy's (PLAN) Type 094 submarines."

