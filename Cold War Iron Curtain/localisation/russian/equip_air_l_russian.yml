 NOR_CAS_equipment_1_short:0 "DH.82 Tiger Moth"
 NOR_CAS_equipment_2:0 "Caproni Ca.310"
 NOR_CAS_equipment_2_short:0 "Ca.310"
 NOR_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Late"
 NOR_CAS_equipment_3_short:0 "Typhoon Mk.Ib/Late"
 NOR_CAS_equipment_3_desc:0 "The Hawker Typhoon was a British fighter bomber aircraft primarily used by the Royal Air Force (RAF) in the Second World War. The Typhoon Mk.Ib/Late, was an improved derivative of the earlier Hawker Typhoons featuring a new bubble canopy."
 NOR_CAS_equipment_4:0 "Hawker Tempest Mk.II"
 NOR_CAS_equipment_4_short:0 "Tempest Mk.II"
 NOR_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 NOR_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 NOR_jet_CAS_equipment_1_desc:0 "The F-84 was designed as a day-time fighter-bomber aircraft set to replace the earlier P-47 Thunderbolt. Despite entering service in 1947, the Thunderjet was plagued by many problems. So much so, that until the introduction of the 'D' Variant in 1949, the F-84 was very nearly cancelled. The type served as the primary strike aircraft for the U.S. Air Force during the Korean War, and was the first fighter aircraft used by the USAF's demonstration team, the 'Thunderbirds.' It is perhaps for that reason why 'Thunderjet' would be a fitting name for the type."
 NOR_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 NOR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 NOR_jet_CAS_equipment_2_desc:0 "The F-84 was designed as a day-time fighter-bomber aircraft set to replace the earlier P-47 Thunderbolt. Despite entering service in 1947, the Thunderjet was plagued by many problems. So much so, that until the introduction of the 'D' Variant in 1949, the F-84 was very nearly cancelled. The type served as the primary strike aircraft for the U.S. Air Force during the Korean War, and was the first fighter aircraft used by the USAF's demonstration team, the 'Thunderbirds.' It is perhaps for that reason why 'Thunderjet' would be a fitting name for the type."
 NOR_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 NOR_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 NOR_jet_CAS_equipment_3_desc:0 "Developed from the earlier F-84 Thunderjet, the F-84F was a swept-wing variant of the fighter-bomber was designed to bring the type closer to the performance of the much vaunted F-86 Sabre. Despite improved capabilities compared to its straight winged predecessor, it still had the same flaws in takeoff performance while having poor stability and control. The type would serve in a limited capacity throughout its life, serving until 1971. Its nickname is 'Thunderstreak.'"

 NOR_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 NOR_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 NOR_jet_light_equipment_2:0 "de Havilland Vampire FB.6"
 NOR_jet_light_equipment_2_short:0 "Vampire FB.6"
 NOR_jet_light_equipment_2_desc:0 ""
 NOR_jet_light_equipment_3:0 "Northrop F-5A Freedom Fighter"
 NOR_jet_light_equipment_3_short:0 "F-5A Freedom Fighter"
 NOR_jet_light_equipment_3_desc:0 "The F-5A has been developed as a light fighter aircraft meant mostly for export. It is lighter and cheaper to produce than most other modern fighters making it ideal as a fill in for short range fighter squadrons. Despite this, the type proved quite nimble, and was the closest aircraft to compete with the Soviet MiG-21 'Fishbed.' Because it was used with the majority of America's allies during the height of the Cold War, it was befittingly called 'Freedom Fighter.'"
 NOR_jet_light_equipment_4:0 "Northrop F-5B Freedom Fighter"
 NOR_jet_light_equipment_4_short:0 "F-5B Freedom Fighter"
 NOR_jet_light_equipment_4_desc:0 "The American Northrop F-5B Freedom Fighter aircraft in use by the Royal Norwegian Airforco. Primarily used as a lead-in trainer for other multirole jet aircraft it did have hardpoints for ordinance available."
 NOR_jet_light_equipment_5:0 "Northrop F-5A Freedom Fighter PUFF"
 NOR_jet_light_equipment_5_short:0 "F-5A PUFF"
 NOR_jet_light_equipment_5_desc:0 "The Norwegian F-5A's received a series of upgrades across their service, to include compatibility with guided air-to-surface missiles (such as Maverick and Shrike), the installation of ECM systems, and improvements to avionics. The F-5A PUFF is a SEAD capable variant."

 NOR_recon_equipment_0:0 "Supermarine Spitfire PR.XI"
 NOR_recon_equipment_0_short:0 "Spitfire PR.XI"
 NOR_recon_equipment_0_desc:0 "Photo reconnaissance variant of the venerable Supermarine Spitfire armed with cameras."
 NOR_jet_recon_equipment_0:0 "Lockheed RT-33A Shooting Star"
 NOR_jet_recon_equipment_0_short:0 "RT-33A Shooting Star"
 NOR_jet_recon_equipment_0_desc:0 "RT-33A modified before delivery as a single-seat reconnaissance variant; 85 built, mainly for export under the Military Assistance Program."
 NOR_jet_recon_equipment_1:0 "Northrop RF-5A Freedom Fighter"
 NOR_jet_recon_equipment_1_short:0 "RF-5A Freedom Fighter"
 NOR_jet_recon_equipment_1_desc:0 "Single-seat reconnaissance version for the Norwegian Armed Forces armed with cameras."
 NOR_jet_recon_equipment_2:0 "Lockheed RF-16AM Fighting Falcon"
 NOR_jet_recon_equipment_2_short:0 "RF-16AM Fighting Falcon"
 NOR_jet_recon_equipment_2_desc:0 "The designation RF-16A is used, though, by the Royal Danish Air Force. In early 1994, 10 Danish F-16A were redesignated as RF-16A tactical recce aircraft, replacing the RF-35 Drakens withdrawn at the end of 1993. As a temporary measure they were originally fitted with the Drakens' optical cameras and electro-optical (E-O) sensors repackaged in a Per Udsen 'Red Baron' recce pod, which were replaced a few years later by Per Udsen's Modular Reconnaissance Pod (MRP)."

