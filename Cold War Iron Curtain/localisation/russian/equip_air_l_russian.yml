 POR_jet_light_equipment_5_desc:0 "The Luftwaffe decided to use the Alpha Jet mainly in the light strike role, preferring to continue flight training in the southwestern United States on American trainer types instead of performing training in Germany, although Germany also used Alpha Jets based at Beja, Portugal for weapons training."

