#Soviet naval aviation
 SOV_cv_CAS_equipment_1:0 "Поликарпов Р-5Т"
 SOV_cv_CAS_equipment_1_short:0 "Р-5T"
 SOV_cv_CAS_equipment_1_desc:0 "Одноместный торпедоносец-бомбардировщик с раздельным шасси, позволяющим нести под фюзеляжем торпеду или 250-500 кг бомбу. Облетан в 1934 году, серия из 50 построена к 1935 году. Экипаж из двух человек для разведывательных задач."
 SOV_cv_CAS_equipment_2:0 "Ильюшин Ил-2Т Штурмовик"
 SOV_cv_CAS_equipment_2_short:0 "Ил-2Т Штурмовик"
 SOV_cv_CAS_equipment_2_desc:0 "Ил-2Т - это торпедно-бомбардировочный вариант знаменитого штурмовика Ил-2 Штурмовик. Для снижения веса, чтобы самолет мог летать, две 23-мм пушки ВЯ-23 на крыльях были сняты. Таким образом, самолет мог быть оснащен одной торпедой калибра 45 см (18"). Хотя эта конструкция так и не была воплощена в жизнь, торпедоносцы не были неизвестной идеей, поскольку Ил-2М3 были модифицированы для установки торпедных аппаратов во время Крымской и Кавказской кампаний Второй мировой войны."
 SOV_cv_CAS_equipment_3:0 "Ил-10Т"
 SOV_cv_CAS_equipment_3_short:0 "Ил-10T"
 SOV_cv_CAS_equipment_3_desc:0 "Этот вариант торпедоносца-бомбардировщика Ил-10 был разработан после окончания военных действий в Европе и Маньчжурии, в отличие от Ил-10, от которого он произошел. За исключением короткого участия в поддержке Северной Кореи во время Корейской войны, Ил-10Т вел относительно мирную жизнь, и был снят с вооружения к 1953 году в пользу истребителей-бомбардировщиков берегового базирования, таких как Су-7 Fitter."

 SOV_cv_jet_CAS_equipment_1:0 "Ил-10МТ"
 SOV_cv_jet_CAS_equipment_1_short:0 "Ил-10MT"
 SOV_cv_jet_CAS_equipment_1_desc:0 "Улучшенный вариант торпедоносца-бомбардировщика Ил-10Т. Ил-10 был разработан после окончания военных действий в Европе и Маньчжурии, в отличие от Ил-10, от которого он произошел. За исключением короткого участия в поддержке Северной Кореи во время Корейской войны, Ил-10Т вел относительно мирную жизнь, и был снят с вооружения к 1953 году в пользу истребителей-бомбардировщиков берегового базирования, таких как Су-7 Fitter." 
 SOV_cv_jet_CAS_equipment_2:0 "Ильюшин Ил-20"
 SOV_cv_jet_CAS_equipment_2_short:0 "Ил-20"
 SOV_cv_jet_CAS_equipment_2_desc:0 "Ил-20 был советским прототипом тяжелобронированного штурмовика для замены Ил-10. Он отличался рядом инновационных концепций, включая кабину пилота, установленную на верхней части двигателя, непосредственно за винтом, и крыльевую автопушку, которая могла быть отрегулирована на земле для стрельбы в горизонтальном положении или опущена на 23°, чтобы позволить самолету обстреливать наземные цели, оставаясь в ровном полете. Однако он был медленнее Ил-10, а его двигатель М-47 оказался проблемным в ходе летных испытаний в 1948-49 годах. Он не был запущен в производство. Летчики-испытатели называли самолет Горбач."
 SOV_cv_jet_CAS_equipment_3:0 "Ильюшин Ил-40Т"
 SOV_cv_jet_CAS_equipment_3_short:0 "Ил-40T"
 SOV_cv_jet_CAS_equipment_3_desc:0 "Ильюшин Ил-40 (по классификации НАТО - Brawny) - двухместный советский бронированный штурмовик с реактивным двигателем. Первый прототип полетел в 1953 году и был очень успешным, за исключением случаев, когда он стрелял из пушек, так как газы их сгорания нарушали воздушный поток в двигатели и вызывали их вспышку или зависание."
 SOV_cv_jet_CAS_equipment_4:0 "Туполев Ту-91"
 SOV_cv_jet_CAS_equipment_4_short:0 "Ту-91"
 SOV_cv_jet_CAS_equipment_4_desc:0 "Туполев Ту-91 (по классификации НАТО - Boot) - советский штурмовик-носитель. На консолях установлены две неподвижные 23-мм пушки по 200 снарядов на ствол, дистанционно управляемая кормовая пушечная установка ДК-15 с пушкой АМ-23; бомбовое вооружение - 1 х ФАБ-1500 или 3 х ФАБ-500 или 6 х ФАБ-250 или 12 х ФАБ-100; противолодочные бомбы калибром 500 кг или 100 кг." 
 SOV_cv_jet_CAS_equipment_5:0 "Туполев Ту-91М"
 SOV_cv_jet_CAS_equipment_5_short:0 "Ту-91M"
 SOV_cv_jet_CAS_equipment_5_desc:0 "Модернизированный вариант Туполева Ту-91. Советский штурмовик-носитель. На консолях установлены две неподвижные 23-мм пушки по 200 снарядов на ствол, дистанционно управляемая кормовая пушечная установка ДК-15 с пушкой АМ-23; бомбовое вооружение - 1 х ФАБ-1500 или 3 х ФАБ-500 или 6 х ФАБ-250 или 12 х ФАБ-100; противолодочные бомбы калибром 500 кг или 100 кг."
 SOV_cv_jet_CAS_equipment_6:0 "Сухой Су-7К"
 SOV_cv_jet_CAS_equipment_6_short:0 "Су-7K"
 SOV_cv_jet_CAS_equipment_6_desc:0 "Носимый вариант устаревшего истребителя-бомбардировщика Сухой Су-7 для использования в советской морской авиации."
 SOV_cv_jet_CAS_equipment_7:0 "Сухой Су-17МКГ"
 SOV_cv_jet_CAS_equipment_7_short:0 "Су-17МКГ"
 SOV_cv_jet_CAS_equipment_7_desc:0 "Вариант Су-17М для советской морской авиации. Он служил испытательным стендом для ракет Х-25 (AS-10 'Karen') и Х-29 (AS-14 "Kedge")."
 SOV_cv_jet_CAS_equipment_8:0 "Микоян-Гуревич МиГ-23АБ"
 SOV_cv_jet_CAS_equipment_8_short:0 "МиГ-23АБ"
 SOV_cv_jet_CAS_equipment_8_desc:0 "Многоцелевой вариант на базе МиГ-23К, планировалось три подварианта - МиГ-23АИ (истребитель), МиГ-23АБ (штурмовик) и МиГ-23АР (разведчик). Вариант был отменен по той же причине, что и МиГ-23К."
 SOV_cv_jet_CAS_equipment_9:0 "Микоян-Гуревич МиГ-27К"
 SOV_cv_jet_CAS_equipment_9_short:0 "МиГ-27K"
 SOV_cv_jet_CAS_equipment_9_desc:0 "МиГ-27К был самым совершенным советским вариантом, с лазерным целеуказателем и совместимостью с электрооптическим оружием с телевизионным наведением. Он нес пушку ГШ-6-30. Официально не являлся вариантом для базирования на авианосцах, но благодаря стреловидному крылу мог быть приспособлен для такой роли."
 SOV_cv_jet_CAS_equipment_10:0 "Сухой Су-25УТГ"
 SOV_cv_jet_CAS_equipment_10_short:0 "Су-25УТГ"
 SOV_cv_jet_CAS_equipment_10_desc:0 "Су-25УТГ (Учебно-тренировочный с Гаком) - вариант Су-25УБ, предназначенный для обучения пилотов взлету и посадке на имитируемую на суше палубу авианосца, с наклонным участком трамплина и тросами-разрядниками. Первый самолет совершил полет в сентябре 1988 года, всего было произведено около 10 самолетов. Примерно половина осталась на вооружении России после 1991 года; они использовались на единственном российском авианосце Адмирал Кузнецов. Этого небольшого количества самолетов было недостаточно для удовлетворения потребностей в подготовке авианосной авиагруппы России, поэтому несколько Су-25УБ были переоборудованы в Су-25УТГ."

 SOV_cv_fighter_equipment_1:0 "Авиация Военно-Морского Флота"
 SOV_cv_fighter_equipment_1_short:0 "АВ-МФ"
 SOV_cv_fighter_equipment_1_desc:0 "Советская морская авиация (АВ-МФ или Авиация военно-морского флота, дословно "авиация военно-морского флота") - это военно-морская авиация ВМФ СССР. Морская авиация - это авиация ВМФ СССР во время Второй мировой войны. Эти авиационные части обеспечивали воздушную поддержку Военно-Морского Флота СССР на театрах военных действий в Баренцевом, Балтийском и Черном морях, а также советского военно-морского отряда в Охотском море."
 SOV_cv_fighter_equipment_2:0 "Яковлев Як-7УТИ"
 SOV_cv_fighter_equipment_2_short:0 "Як-7УТИ"
 SOV_cv_fighter_equipment_2_desc:0 "Як-7УТИ изначально разрабатывался как двухместный учебный самолет для подготовки будущих советских пилотов. Но этот тип можно было хорошо адаптировать для операций на авианосцах, используя схему двойного управления, чтобы гарантировать, что если один пилот устанет, другой сможет работать так же хорошо. Этот тип мог выполнять функции противовоздушной обороны авианосца от нацистской немецкой, а затем и американской авиации."
 SOV_cv_fighter_equipment_3:0 "Яковлев Як-9УТ"
 SOV_cv_fighter_equipment_3_short:0 "Як-9УТ"
 SOV_cv_fighter_equipment_3_desc:0 "Як-9У (ВК-107) вооружен 1 × 37 мм (1,5 дюйма) пушкой Нудельмана Н-37 с 30 снарядами и 2 × 20 мм (0,79 дюйма) пушками Березина Б-20 с 120 снарядами каждая, что дает общую массу секундного взрыва 6 кг (13 фунтов). Как и Як-9ТК, он мог быть переоборудован для замены Н-37 на 20-мм (0,79 дюйма) Б-20, 23-мм (0,91 дюйма) НС-23 или 45-мм (1,8 дюйма) Н-45. Серийные самолеты по умолчанию несли пушку НС-23 вместо пушки Н-37."

 SOV_cv_jet_multirole_equipment_1:0 "Яковлев Як-15"
 SOV_cv_jet_multirole_equipment_1_short:0 "Як-15"
 SOV_cv_jet_multirole_equipment_1_desc:0 "Яковлев Як-15 - советский турбореактивный истребитель первого поколения, разработанный ОКБ Яковлева сразу после Второй мировой войны. В качестве основного фюзеляжа использовался поршневой истребитель Яковлева Як-3, модифицированный для установки переделанного немецкого двигателя Юнкерс Jumo 004."
 SOV_cv_jet_multirole_equipment_2:0 "Микоян-Гуревич МиГ-15К"
 SOV_cv_jet_multirole_equipment_2_short:0 "МиГ-15К"
 SOV_cv_jet_multirole_equipment_2_desc:0 "Мореходная версия истребителя второго поколения МиГ-15 для советской морской авиации."
 SOV_cv_jet_multirole_equipment_3:0 "Микоян-Гуревич МиГ-17К"
 SOV_cv_jet_multirole_equipment_3_short:0 "МиГ-17К"
 SOV_cv_jet_multirole_equipment_3_desc:0 "Предлагаемый носимый вариант МиГ-17."
 SOV_cv_jet_multirole_equipment_4:0 "Микоян-Гуревич МиГ-19К"
 SOV_cv_jet_multirole_equipment_4_short:0 "МиГ-19К"
 SOV_cv_jet_multirole_equipment_4_desc:0 "Предлагаемый палубный истребитель ВМФ СССР. Ракетно-бомбовое вооружение включало четыре балочных держателя БД-3-56, на которые можно было подвесить две 250-кг бомбы. Ближе к фюзеляжу, за нишами шасси, монтировались пилоны для блоков ОРО-57К с 57-мм НУРСами АРС-57."
 SOV_cv_jet_multirole_equipment_5:0 "Микоян-Гуревич МиГ-19СК"
 SOV_cv_jet_multirole_equipment_5_short:0 "МиГ-19СК"
 SOV_cv_jet_multirole_equipment_5_desc:0 "Модернизированный истребитель МиГ-19К с новой авионикой и улучшенными характеристиками двигателя."
 SOV_cv_jet_multirole_equipment_6:0 "Микоян-Гуревич МиГ-21К"
 SOV_cv_jet_multirole_equipment_6_short:0 "МиГ-21К"
 SOV_cv_jet_multirole_equipment_6_desc:0 "Предлагаемый носимый вариант МиГ-21."
 SOV_cv_jet_multirole_equipment_7:0 "Микоян-Гуревич МиГ-23К"
 SOV_cv_jet_multirole_equipment_7_short:0 "МиГ-23К"
 SOV_cv_jet_multirole_equipment_7_desc:0 "МиГ-23А "Молния" - палубный вариант истребителя МиГ-23 был разработан в ОКБ А.И. Микояна. Истребитель авианосного базирования должен был отличаться от серийного МиГ-23М новым остеклением кабины с приподнятым креслом пилота для лучшего обзора, а также неубирающейся штангой для дозаправки в воздухе. Для обеспечения посадки на палубу самолет получит усиленное шасси и тормозной крюк в хвостовой части - последнее требовало замены одного большого вентрального гребня на два малых, а также увеличения площади киля."
 SOV_cv_jet_multirole_equipment_8:0 "Микоян-Гуревич МиГ-23АИ"
 SOV_cv_jet_multirole_equipment_8_short:0 "МиГ-23АИ"
 SOV_cv_jet_multirole_equipment_8_desc:0 "Многоцелевой вариант на базе МиГ-23К, планировался в трех подвариантах МиГ-23АИ (истребитель), МиГ-23АБ (штурмовик) и МиГ-23АР (разведчик). Вариант был отменен по той же причине, что и МиГ-23К."
 SOV_cv_jet_multirole_equipment_9:0 "Сухой Су-27К"
 SOV_cv_jet_multirole_equipment_9_short:0 "Су-27К"
 SOV_cv_jet_multirole_equipment_9_desc:0 "Сухой Су-33 - всепогодный двухмоторный истребитель авиационного базирования, разработанный компанией Сухой и произведенный Комсомольским-на-Амуре авиационным производственным объединением, созданный на базе Су-27 и первоначально известный как Су-27К. По сравнению с Су-27, Су-33 имеет усиленное шасси и конструкцию, складывающиеся крылья и стабилизаторы - все для эксплуатации на авианосце. У Су-33 есть предкрылки, а его крылья больше, чем у Су-27, для увеличения подъемной силы. Су-33 имеет модернизированные двигатели и сдвоенное носовое колесо, а также возможность дозаправки в воздухе."
 SOV_cv_jet_multirole_equipment_10:0 "Микоян-Гуревич МиГ-29К"
 SOV_cv_jet_multirole_equipment_10_short:0 "МиГ-29К"
 SOV_cv_jet_multirole_equipment_10_desc:0 "Программа МиГ-29К была возрождена в ответ на решение ВМС Индии приобрести бывший советский авианосец "Адмирал Горшков" в 2004 году. Когда "Адмирал Горшков" входил в состав советского флота, он был гибридом авианосца/крейсера, использующего самолеты вертикального взлета; поэтому палуба была переоборудована взлетной рампой и тросами разрядников для эксплуатации МиГ-29К. Самолет имеет увеличенное и складывающееся крыло, разрядный крюк и защищенный от коррозии усиленный фюзеляж."

 SOV_cv_mr_stealth_fighter_equipment_1:0 "Су-27КМ"
 SOV_cv_mr_stealth_fighter_equipment_1_short:0 "Су-27КМ"
 SOV_cv_mr_stealth_fighter_equipment_1_desc:0 " В 1988 году был подготовлен эскизный проект перспективного истребителя Су-27КМ ("Корабль, модернизированный"). Он базировался на проекте С.32, но позиционировался иначе. Чтобы не смущать заказчика излишней новизной, его подавали как глубокую модернизацию существующего Су-27К (будущего Су-33)."

 SOV_jump_jet_equipment_1:0 "Яковлев Як-36"
 SOV_jump_jet_equipment_1_short:0 "Як-36"
 SOV_jump_jet_equipment_1_desc:0 "Як-36 (также известный как Изделие V) был первой советской попыткой создания боевого самолета вертикального взлета и посадки (ВВП). Было построено четыре предсерийных демонстратора технологии. Первый полет состоялся в сентябре 1963 года, а в начале 1966 года самолет совершил первый полный полет от вертикального взлета до вертикальной посадки. Самолет был продемонстрирован общественности к 50-летию Октябрьской революции. После получения многообещающих результатов по программе Як-36, был дан зеленый свет следующему этапу разработки - Як-38. Известен под натовским отчетным названием Freehand."
 SOV_jump_jet_equipment_2:0 "Яковлев Як-38"
 SOV_jump_jet_equipment_2_short:0 "Як-38"
 SOV_jump_jet_equipment_2_desc:0 "Як-38 был разработан на основе Як-36 (и в результате получил первоначальное обозначение Як-36М), хотя эти два самолета имели мало общего. Это был единственный действующий истребитель ВВП советской морской авиации и первый самолет с фиксированным крылом, базирующийся на авианосце. Як-38 служил почти исключительно на авианосце класса Киев, поступившем на вооружение в 1976 году. Самолет не имел активного боевого применения, но однажды перехватил американские самолеты с корабля U.S.S. Enterprise над Аравийским морем. Кодовое название НАТО - Forger-A."
 SOV_jump_jet_equipment_3:0 "Яковлев Як-38М"
 SOV_jump_jet_equipment_3_short:0 "Як-38M"
 SOV_jump_jet_equipment_3_desc:0 "Як-38М был улучшенной версией Як-38, имея дополнительные 1000 кг (2200 фунтов) максимальной взлетной массы и усиление подкрыльевых пилонов для перевозки 2000 фунтов (910 кг) вооружения. Як-38М поступил на вооружение советской военно-морской авиации. Несмотря на модернизацию конструкции, Forger все еще был недостаточно мощным и в итоге оказался разочаровывающим. Тип был снят с вооружения после распада Советского Союза в 1991 году."
 SOV_jump_jet_equipment_4:0 "Яковлев Як-41"
 SOV_jump_jet_equipment_4_short:0 "Як-41"
 SOV_jump_jet_equipment_4_desc:0 "Яковлев Як-141, также известный как Як-41, - советский сверхзвуковой истребитель вертикального взлёта/посадки (ВВП), разработанный компанией Яковлев. Самолет должен был стать полноценной заменой Як-38 Forger и был способен к устойчивому сверхзвуковому полету и паритету с советскими истребителями наземного базирования. Самолет совершил первый полет в начале 1987 года, а первый парящий полет - в 1989 году. В 1991 году была успешно выполнена первая вертикальная морская посадка. Несмотря на многообещающие перспективы, программа Фристайл была отменена в августе 1991 года из-за отсутствия финансирования."

 SOV_jump_stealth_equipment_1:0 "Яковлев Як-43"
 SOV_jump_stealth_equipment_1_short:0 "Як-43"
 SOV_jump_stealth_equipment_1_desc:0 "Як-43 - советский истребитель ВВП (вертикального взлета и посадки), разработанный по программе (Легкий Фронтовой Истребитель/ЛФИ) как наземная версия злополучного самолета Яковлев Як-141 Фристайл, который не дошел до производства в результате распада Советского Союза. Как и Як-141, Як-43 должен был иметь только один основной двигатель, а также два специальных двигателя вертикального взлета. К сожалению, как и Як-141, он тоже так и не был доведен до производства, также отчасти из-за распада Советского Союза."
 
