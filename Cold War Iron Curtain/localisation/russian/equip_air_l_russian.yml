 mp_uav_2_short:0 "Разведывательный БПЛА II"
 mp_uav_2:0 "Разведывательный Беспилотный Летательный Аппарат II"
 mp_uav_2_desc:0 "Беспилотный летательный аппарат второго поколения с ручным запуском, используемый в разведывательных целях."

 #UAV CAS
 cas_uav_equipment_1:0 "Ударный Дрон I"
