 FRA_jet_CAS_equipment_1:0 "Рипаблик F-84E «Тандерджет»"
 FRA_jet_CAS_equipment_1_short:0 "F-84E «Тандерджет»"
 FRA_jet_CAS_equipment_1_desc:0 "F-84 был разработан как дневной истребитель-бомбардировщик, призванный заменить более ранний P-47 Thunderbolt. Несмотря на то, что «Тандерджет» поступил на вооружение в 1947 г., с ним было связано множество проблем. Настолько, что до появления в 1949 г. варианта 'D' F-84 был практически снят с производства. Этот тип служил основным ударным самолетом ВВС США во время Корейской войны и был первым истребителем, использовавшимся демонстрационной группой ВВС США «Тандербердс». Возможно, именно поэтому «Тандерджет» является подходящим названием для этого типа."
 FRA_jet_CAS_equipment_2:0 "Дассо MD.454 «Мистэр» IVA"
 FRA_jet_CAS_equipment_2_short:0 "«Мистэр» IVA"
 FRA_jet_CAS_equipment_2_desc:0 "Дассо MD.454 «Мистэр» IV - французский истребитель-бомбардировщик 1950-х годов, первый трансзвуковой самолет, поступивший на вооружение ВВС Франции. Он использовался в крупномасштабных боевых действиях в составе ВВС Израиля во время Шестидневной войны 1967 года."
 FRA_jet_CAS_equipment_3:0 "Рипаблик F-84F «Тандерстрик»"
 FRA_jet_CAS_equipment_3_short:0 "F-84F «Тандерстрик»"
 FRA_jet_CAS_equipment_3_desc:0 "Разработанный на базе более раннего F-84 «Тандерджет», F-84F был вариантом истребителя-бомбардировщика со стреловидным крылом, призванным приблизить этот тип к характеристикам широко известного F-86 «Сейбр». Несмотря на улучшенные возможности по сравнению с прямокрылым предшественником, он все еще имел те же недостатки во взлетных характеристиках, а также плохую устойчивость и управляемость. В течение всего срока службы этот самолет прослужил до 1971 года. Его прозвище «Тандерстрик»."
