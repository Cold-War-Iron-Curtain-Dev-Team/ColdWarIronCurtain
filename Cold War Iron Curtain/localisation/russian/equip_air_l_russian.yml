 FRA_high_mach_jet_interceptor_equipment_1:0 "Sud-Ouest SO.6020 Espadon"
 FRA_high_mach_jet_interceptor_equipment_1_short:0 "SO.6020 Espadon"
 FRA_high_mach_jet_interceptor_equipment_1_desc:0 "Sud-Ouest SO.6020 Espadon (Swordfish) - французский послевоенный прототип перехватчика, разработанный и построенный компанией SNCASO в конце 1940-х годов. ВВС Франции (Armée de l'Air) сочли проект неудачным, несмотря на установление некоторых рекордов, и отменили планы по его принятию на вооружение в 1951 году. Было построено всего четыре самолета, которые впоследствии были модифицированы для использования в качестве испытательных стендов для смешанной программы SNCASO SO.9000 Trident с ракетным и турбореактивным двигателями." 
 FRA_high_mach_jet_interceptor_equipment_2:0 "SNCASO SO.9000 Trident"
 FRA_high_mach_jet_interceptor_equipment_2_short:0 "SO.9000 Trident"
 FRA_high_mach_jet_interceptor_equipment_2_desc:0 "SNCASO SO.9000 Trident - французский самолет-перехватчик смешанной конструкции, созданный авиастроительной компанией SNCASO в 1950-х годах. В конце 1940-х годов в рамках более широких усилий по восстановлению французской военной мощи и обеспечению Франции новыми передовыми образцами отечественного производства в компанию SNCASO был направлен запрос на создание сверхзвукового самолета-перехватчика точечной обороны для оснащения ВВС Франции." 
 FRA_high_mach_jet_interceptor_equipment_3:0 "Nord 1500 Griffon"
 FRA_high_mach_jet_interceptor_equipment_3_short:0 "N.1500 Griffon"
 FRA_high_mach_jet_interceptor_equipment_3_desc:0 "Nord 1500 Griffon - экспериментальный самолет-перехватчик с реактивным двигателем, разработанный и построенный французской государственной авиастроительной компанией Nord Aviation. Griffon разрабатывался как продолжение сверхзвукового исследовательского самолета Nord Gerfaut со скоростью 2 Маха. Разработка самолета началась после получения в 1953 г. письма о намерениях на поставку пары невооруженных исследовательских самолетов. В конструкции была использована инновационная компоновка с двумя турбореактивными двигателями, первый из которых использовался для взлета и набора скорости, достаточной для запуска второго." 
 #FRA_high_mach_jet_interceptor_equipment_4:0 "Dassault Mirage G8"
 #FRA_high_mach_jet_interceptor_equipment_4_short:0 "Mirage G8"
 #FRA_high_mach_jet_interceptor_equipment_4_desc:0 "The Dassault Mirage G was a French two-seat twinjet variable-geometry prototype fighter, built by Dassault Aviation in the late 1960s. The G8 was built as a dedicated interceptor. The type was further developed into the twin-engine Mirage G4 and G8 variants as a multi-role jet fighter capable of both interception and nuclear strike missions. Although Dassault built and flew prototypes, the entire programme was terminated in the 1970s without the aircraft entering production."

