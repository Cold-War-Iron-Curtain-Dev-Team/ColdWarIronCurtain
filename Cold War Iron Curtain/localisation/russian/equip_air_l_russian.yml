 ############USA - WW2
 
 USA_fighter_equipment_1:0 "Кертисс P-40 «Уорхок»"
 USA_fighter_equipment_1_short:0 "P-40 «Уорхок»"
 USA_fighter_equipment_1_desc:0 "P-40 - одномоторный цельнометаллический истребитель, разработанный в 1938 году и представлявший собой модифицированную версию P-36 «Хок». Во время Второй мировой войны этот тип использовался многими союзными державами и, несмотря на то, что он уступал более поздним P-47 и P-51, служил на передовой до самого конца войны. 200 пилотов союзников из 7 различных стран, включая США, страны Британского Содружества и Советский Союз, стали асами на P-40. Несмотря на различия в обозначениях для стран Содружества и Советского Союза, официальное прозвище на службе в США - «Уорхок»."
 USA_fighter_equipment_2:0 "Рипаблик F-47 «Тандерболт»"
 USA_fighter_equipment_2_short:0 "F-47 «Тандерболт»"
 USA_fighter_equipment_2_desc:0 "P-47 был дальнейшим развитием самолетов Северского (предшественника Рипаблик ) P-35 и Рипаблик P-43 Лэнсер. Несмотря на то, что первоначально он разрабатывался как истребитель превосходства в воздухе. Славу P-47 принесла способность нести тяжелую бомбовую нагрузку, положив начало наследию компании в разработке штурмовиков. Во время Второй мировой войны этот тип использовался во многих союзных странах и продолжал использоваться после войны, причем некоторые утверждают, что именно этот тип, а не P-51 «Мустанг», должен был использоваться в Корее. Его прозвище «Тандерболт» - первое в современной системе наименований Республики. Был переименован в F-47 в 1948 году."
 USA_fighter_equipment_3:0 "Норт Американ F-51D «Мустанг»"
 USA_fighter_equipment_3_short:0 "F-51D «Мустанг»"
 USA_fighter_equipment_3_desc:0 "P-51 считается одним из лучших истребителей в истории авиации. Разработан компанией North American Aviation. Тип поступил на вооружение в 1942 году. Первоначально использовался в качестве тактического разведывательного самолета, но с появлением варианта "D" стал известен как первый в мире истребитель воздушного господства, обеспечивая сопровождение американских и союзных бомбардировщиков во время самых известных бомбардировочных кампаний на европейском театре военных действий, уничтожив за время войны почти 5 000 самолетов. Получивший позднее обозначение F-51, он с отличием служил в качестве Штурмовика во время Корейской войны, а «Мустанг», рабочая лошадка ВВС США, продолжал служить до 1968 года."

 USA_heavy_fighter_equipment_1:0 "Локхид P-38 «Лайтнинг»"
 USA_heavy_fighter_equipment_1_short:0 "P-38 «Лайтнинг»"
 USA_heavy_fighter_equipment_1_desc:0 "Самолет с двумя поршневыми двигателями, разработанный с упором на скорость и тяжелое вооружение. Во время Второй мировой войны его скорость использовалась во многих атаках над Тихим океаном, уничтожив множество японских самолетов. Благодаря своей характерной форме он получил название 'der Gabelschwanz-Teufel' или 'вилохвостый дьявол', в Германии и 'Ni hikouki, ippairotto' или 'два самолета, один пилот' в Японии. Он также известен как «Лайтнинг»."
 USA_heavy_fighter_equipment_2:0 "Нортроп P-61 «Блэк Уидоу»"
 USA_heavy_fighter_equipment_2_short:0 "F-61 «Блэк Уидоу»"
 USA_heavy_fighter_equipment_2_desc:0 "P-61, как и P-38 до него, представляет собой двухместный самолет, разработанный в 1944 году. Это был первый американский ночной истребитель, оснащенный радаром (еще одна первая разработка) для отслеживания бомбардировщиков и других целей и их перехвата в ночных и неблагоприятных погодных условиях. В сочетании с четырьмя 20-мм пушками Hispano, P-61 (позже F-61), прозванный 'Черной Вдовой' в честь печально известного американского паука, является таким же смертоносным, как и следует из его названия."
 USA_heavy_fighter_equipment_3:0 "Норт Американ F-82 «Твин Мустанг»"
 USA_heavy_fighter_equipment_3_short:0 " F-82 «Твин Мустанг»"
 USA_heavy_fighter_equipment_3_desc:0 "Первоначально разработанный как дальний истребитель сопровождения для Второй мировой войны, P-82 был представлен в 1946 году, слишком поздно для участия в конфликте. Разработанный на основе почитаемого P-51, P-82 (позже F-82) использовался в качестве замены P-61 «Блэк Уидоу» и был оснащен радаром для поддержки Стратегического командования ВВС. Поскольку планер самолета похож на 2 собранных P-51, ему дали прозвище «Твин Мустанг»."

 USA_strat_bomber_equipment_1:0 "Боинг B-17 «Летающая крепость»"
 USA_strat_bomber_equipment_1_short:0 "B-17 «Летающая крепость»"
 USA_strat_bomber_equipment_1_desc:0 "B-17 - четырехмоторный стратегический бомбардировщик, разработанный в середине 1930-х годов для Воздушного корпуса армии США. Он был третьим по производству бомбардировщиком во Второй мировой войне и с отличием служил на европейском театре конфликта, отвечая за бомбардировочные кампании в Германии с баз в Южной Англии и Италии. Его мощное оборонительное вооружение вполне уместно для самолета, прозванного «Летающей крепостью»."
 USA_strat_bomber_equipment_2:0 "Консолидейтед B-24 «Либерейтор»"
 USA_strat_bomber_equipment_2_short:0 "B-24 «Либерейтор»"
 USA_strat_bomber_equipment_2_desc:0 "B-24 был разработан в 1941 году как дальний тяжелый бомбардировщик для ВВС армии США. Несмотря на способность нести большую бомбовую нагрузку в сочетании с высокой крейсерской скоростью, он был относительно сложен в управлении на малых высотах и имел более низкий эксплуатационный потолок, чем B-17. Тем не менее, «Либерейтор» был предпочтителен для Генерального штаба США и стал самым производимым бомбардировщиком во Второй мировой войне. Как и B-17, он хорошо зарекомендовал себя на европейском театре во время бомбардировочной кампании Германии, но также с отличием служил и на тихоокеанском театре."
 USA_strat_bomber_equipment_3:0 "Боинг B-29 «Суперкрепость»"
 USA_strat_bomber_equipment_3_short:0 "B-29 «Суперкрепость»"
 USA_strat_bomber_equipment_3_desc:0 "B-29 - четырехмоторный бомбардировщик с винтовым двигателем, представленный в 1944 году. Это был самый дорогостоящий проект вооружений, когда-либо закупавшийся во время войны, превышавший даже стоимость программы ядерного оружия США того времени. Разработанный как высотный стратегический бомбардировщик, он нашел применение в качестве низколетящего ночного зажигательного бомбардировщика, совершая огневые налеты на Японию. Однако слава «Суперкрепости» связана со сбросом атомных бомб на Хиросиму и Нагасаки, что способствовало окончанию войны. Модернизированные варианты (включая переименованный B-50) продолжали использоваться в качестве стратегического бомбардировщика во время Корейской войны, а затем были сняты с вооружения в начале 1950-х годов."

 USA_tac_bomber_equipment_0:0 "Дуглас B-18 «Боло»"
 USA_tac_bomber_equipment_0_short:0 "B-18 «Боло»"
 USA_tac_bomber_equipment_0_desc:0 "B-18, представленный в 1936 году, был средним бомбардировщиком, разработанным для замены более раннего Мартин B-10. Хотя на момент своего появления он был вполне приличным. В 1940 году он быстро устарел и был переведен в разряд противолодочных и транспортных самолетов. Несмотря на это, «Боло» получил известность как первый американский самолет, потопивший немецкую подводную лодку во время Второй мировой войны."
 USA_tac_bomber_equipment_1:0 "Дуглас B-23 «Дракон»"
 USA_tac_bomber_equipment_1_short:0 "B-23 «Дракон»"
 USA_tac_bomber_equipment_1_desc:0 "Разработанный как усовершенствованный преемник B-18 «Боло», B-23 был быстрее, нес более тяжелую бомбовую нагрузку и оборонительное вооружение. Однако «Дракон» все еще уступал своим современникам B-25 и B-26, и во время Второй мировой войны его в основном использовали в качестве учебного самолета."
 USA_tac_bomber_equipment_2:0 "Норт Американ B-25 «Митчелл»"
 USA_tac_bomber_equipment_2_short:0 "B-25 «Митчелл»"
 USA_tac_bomber_equipment_2_desc:0 "B-25 - двухмоторный средний бомбардировщик, представленный в 1941 году. Использовался многими военно-воздушными силами во время Второй мировой войны, а также служил на всех театрах военных действий, где применялась авиация. Наиболее известным его использованием стал рейд Дулиттла, первая успешная кампания воздушной бомбардировки материковой части Японии во время войны. Его прозвище - «Митчелл», по имени генерал-майора Билли Митчелла, пионера военной авиации США."
 USA_tac_bomber_equipment_3:0 "Мартин B-26 «Мародер»"
 USA_tac_bomber_equipment_3_short:0 "B-26 «Мародер»"
 USA_tac_bomber_equipment_3_desc:0 "B-26 был разработан в 1941 году как средний бомбардировщик параллельно с B-25. Изначально этот самолет был сложным в управлении, его прозвали 'Вдоводел' из-за большого количества случаев, когда пилоты, обучавшиеся на этом типе, разбивались и погибали. Однако после внесения изменений и надлежащего обучения пилотов, он оказался способным тактическим бомбардировщиком, служившим в Западной Европе, а также на Тихоокеанском и Средиземноморском театрах Второй мировой войны. Прозванный «Мародером», этот тип был снят с вооружения в 1947 году, до того, как ВВС были отделены от армии (это послужило причиной того, что A-26 «Инвэйдер» ненадолго стал называться B-26)."

 USA_nav_bomber_equipment_1:0 "Консолидейтед PBY-1 «Каталина»"
 USA_nav_bomber_equipment_1_short:0 "PBY-1"
 USA_nav_bomber_equipment_1_desc:0 "Первоначальный серийный вариант с двумя двигателями R-1830-64 мощностью 900 л.с. Консолидейтед PBY «Каталина» - летающая лодка и самолет-амфибия, выпускавшийся в 1930-х и 1940-х годах. На канадской службе он был известен как Canso. Это был один из самых широко используемых гидросамолетов Второй мировой войны. «Каталины» служили во всех родах войск вооруженных сил США, а также в ВВС и ВМС многих других стран. Последние военные PBY служили до 1980-х годов. По состоянию на 2021 год, спустя 86 лет после первого полета, самолет продолжает летать в качестве водного бомбардировщика (или воздушного танкера) в воздушных операциях по тушению пожаров в некоторых частях мира. Ни один из них не остается на военной службе. "
 USA_nav_bomber_equipment_2:1 "Консолидейтед PBY-5 «Каталина»"
 USA_nav_bomber_equipment_2_short:1 "PBY-5"
 USA_nav_bomber_equipment_2_desc:0 "Консолидейтед PBY «Каталина» - летающая лодка и самолет-амфибия, выпускавшийся в 1930-х и 1940-х годах. На канадской службе он был известен как Canso. Это был один из самых широко используемых гидросамолетов Второй мировой войны. «Каталины» служили во всех родах войск вооруженных сил США, а также в ВВС и ВМС многих других стран. Последние военные PBY служили до 1980-х годов. По состоянию на 2021 год, спустя 86 лет после первого полета, самолет продолжает летать в качестве водного бомбардировщика (или воздушного танкера) в воздушных операциях по тушению пожаров в некоторых частях мира. Ни один из них не остается на военной службе. "
 USA_nav_bomber_equipment_3:0 "Консолидейтед PB4Y-2 Privateer"
 USA_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 USA_nav_bomber_equipment_3_desc:0 "Консолидейтед PB4Y-2 Privateer - американский патрульный бомбардировщик ВМС США времен Второй мировой войны и Корейской войны, созданный на базе Консолидейтед «Либерейтор»."

 USA_cv_CAS_equipment_1:0 "Нортроп BT"
 USA_cv_CAS_equipment_1_short:0 "Нортроп BT"
 USA_cv_CAS_equipment_1_desc:0 "Нортроп BT был разработан в 1935 году, когда Northrop была дочерней компанией Douglas Aircraft Corporation. Первый самолет с фиксированным трехколесным шасси, совершивший посадку на авианосец, этот тип был разработан компанией Дуглас позже и стал пикирующим бомбардировщиком SBD «Даунтлесс»."
 USA_CAS_equipment_2:0 "Дуглас А-20 «Хэвок»"
 USA_CAS_equipment_2_short:0 "А-20 «Хэвок»"
 USA_CAS_equipment_2_desc:0 "A-20, прозванный 'Хэвоком', был представлен в 1941 году как легкий бомбардировщик и штурмовик. Служивший в США и Содружестве, он получил известность благодаря службе в ВВС и ВМФ Советского Союза, которые получили две трети вариантов A-20B и множество моделей G и H. Модифицированные более скорострельными 7,62-мм пулеметами и пушкой переднего расположения, эти типы с отличием служили на Восточном фронте против немецких танков и были самым многочисленным бомбардировщиком иностранного производства, использовавшимся советскими ВВС во Второй мировой войне. Истребительные варианты также обозначались как P-70."
 USA_CAS_equipment_3:0 "Норт Американ A-36 «Апач»"
 USA_CAS_equipment_3_short:0 "A-36 «Апач»"
 USA_CAS_equipment_3_desc:0 "A-36 был разработан как наземный вариант знаменитого P-51 «Мустанг». Пикирующий бомбардировщик, он хорошо показал себя в Северной Африке, Средиземноморье, Италии и на китайско-бирманско-индийском фронте Второй мировой войны. Известен своими характерными прямоугольными воздушными тормозами на концах крыльев. «Апач», названный в честь коренного американского племени, оказался смертельно опасным за свою короткую карьеру, прослужив с 1942 года до списания в конце войны в 1945 году."

 USA_CAS_equipment_4:0 "Дуглас A-26 «Инвэйдер»"
 USA_CAS_equipment_4_short:0 "A-26 «Инвэйдер»"
 USA_CAS_equipment_4_desc:0 "A-26 - двухмоторный быстрый штурмовик, разработанный на основе и предназначенный для замены A-20 Havoc. Представленный в 1943 году, «Инвэйдер» служил в ВВС армии США во время Второй мировой войны, атакуя японские позиции в Голландской Ост-Индии и на Филиппинах, а также в Европе во время кампаний в долине реки По в Северной Италии. Они продолжили службу в Корее, участвуя в бомбардировочных миссиях против Кореи, и стали первым самолетом, совершившим вылет в этом конфликте. «Инвэйдер» продолжил свою карьеру во Вьетнаме, поддерживая операции ЦРУ в Лаосе против сил Вьетконга. Пройдя через три войны, «Инвэйдер» доказал свою силу и показал, на что способен штурмовик."
 USA_cv_CAS_equipment_4:0 "Дуглас AD «Скайрейдер»"
 USA_cv_CAS_equipment_4_short:0 "Дуглас AD «Скайрейдер»"
 USA_cv_CAS_equipment_4_desc:0 "Дуглас AD - надежный быстроходный штурмовик авианосного базирования. Первоначально разработанный как торпедоносец и пикирующий бомбардировщик, AD (первоначально BT2D) поступил на вооружение в 1946 году и с отличием проявил себя во время Корейской войны, став основным штурмовиком ВМС и морской пехоты США. Несмотря на то, что большинство винтомоторных самолетов после Корейского конфликта были сняты с вооружения, переименованный A-1 остался в строю и сыграл ключевую роль в качестве самолета ближней авиационной поддержки, а «Скайрейдер» с отличием прослужил до конца американского участия во Вьетнаме."

 #USA_cv_nav_bomber_equipment_1:0 "Douglas TBD Devastator"
 #USA_cv_nav_bomber_equipment_1_short:0 "TBD Devastator"
 #USA_cv_nav_bomber_equipment_1_desc:0 "When the TBD entered service in 1937, it was still largely considered one of the best torpedo bombers when introduced. However despite enjoying some successes in the early war, by the time of the Japanese attack on Pearl Harbor, the 'Devastator' was woefully obsolete, and was proven as such by the time of the Battle of Midway, when nearly the entire force of Devastators used in the battle was wiped out. Although later attributed to poor air cover and defects in the torpedo it normally carried. The TBD was phased out of active duty immediately after the battle, and withdrawn from service outright by 1944."
 #USA_cv_nav_bomber_equipment_2:0 "Grumman TBF-1C Avenger"
 #USA_cv_nav_bomber_equipment_2_short:0 "TBF-1C Avenger"
 #USA_cv_nav_bomber_equipment_2_desc:0 "The TBF-1C variant of the 'Avenger' improved on the original TBF-1 design by making provisions for two wing-mounted 12.7mm (.50 cal) Machine Guns and wing-mounted fuel tanks which doubled the aircraft's range and forward attack power."
 #USA_cv_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 #USA_cv_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 #USA_cv_nav_bomber_equipment_3_desc:0 "The Consolidated PB4Y-2 Privateer is an American World War II and Korean War era patrol bomber of the United States Navy derived from the Consolidated B-24 Liberator."

 USA_CAS_equipment_1:0 "Нортроп A-17"
 USA_CAS_equipment_1_short:0 "A-17"
 USA_CAS_equipment_1_desc:0 "A-17 был двухместным монопланом, одномоторным штурмовиком, разработанным в 1935 году на основе Нортроп Гамма 2F. Надежный, популярный самолет. Этот тип служил в качестве самолета берегового патрулирования для вражеских подразделений, которые могли пересечь Панамский канал на ранних этапах Второй мировой войны после Перл-Харбора, и использовался в утилитарном качестве до списания в 1944 году."
 USA_cv_CAS_equipment_2:0 "Дуглас SBD-2 «Даунтлесс»"
 USA_cv_CAS_equipment_2_short:0 "SBD-2 «Даунтлесс»"
 USA_cv_CAS_equipment_2_desc:0 "SBD-2 был разработан как самолет-разведчик и пикирующий бомбардировщик в 1940 году и был основным самолетом своего типа для ВМС США. «Даунтлесс», уже способный пикирующий бомбардировщик, был усовершенствован в варианте "-2" с другим вооружением и увеличенным запасом топлива, но был лишь незначительным недостатком по сравнению с более поздними моделями. Варианты USAAF называли его A-24 «Бэнши»."
 USA_cv_CAS_equipment_3:0 "Кертисс SB2C-1s «Хэллдайвер»"
 USA_cv_CAS_equipment_3_short:0 "SB2C-1s «Хэллдайвер»"
 USA_cv_CAS_equipment_3_desc:0 "Заменивший SBD «Даунтлесс», SB2C, представленный в 1942 году, был намного быстрее, чем SBD, который он заменил, но это был сложный в управлении самолет, получивший унизительное прозвище "SOB, 2nd Class". Несмотря на это и на язвительный отчет, который навсегда омрачит наследие компании Curtiss Aircraft Company, «Хэллдайвер» имел прекрасные боевые характеристики на протяжении всей Тихоокеанской войны. В варианте USAAF его называли A-25 «Шрайк»".

 USA_cv_fighter_equipment_0:0 "Грумман FF 'Фифи'"
 USA_cv_fighter_equipment_0_short:0 "FF 'Фифи'"
 USA_cv_fighter_equipment_0_desc:0 "Представленный в 1933 году, Грумман FF был первым законченным проектом компании для ВМС США. Получивший неофициальное прозвище 'Фифи' (по обозначению FF), Грумман FF хорошо служил в качестве раннего биплана, способного нести авианосцы, на протяжении 30-х годов, прежде чем был снят с производства в 1940 году."
 USA_cv_fighter_equipment_1:0 "Грумман F3F"
 USA_cv_fighter_equipment_1_short:0 "F3F"
 USA_cv_fighter_equipment_1_desc:0 "Грумман F3F, представленный в 1936 году, стал последним бипланным истребителем, поставленным в ВМС США и вообще в любое подразделение американских вооруженных сил. Несмотря на свою короткую службу (снят с вооружения в 1941 году и снят с вооружения в целом к 1943 году), это был достаточно способный самолет, последний в эпохе монопланных самолетов, которые станут будущим истребителей."
 USA_cv_fighter_equipment_2:0 "Воут F4U-5 «Корсар»"
 USA_cv_fighter_equipment_2_short:0 "F4U-5 «Корсар»"
 USA_cv_fighter_equipment_2_desc:0 "Воут F4U «Корсар»- американский истребитель, который принимал участие в основном во Второй мировой и Корейской войнах. Разработанный и первоначально производившийся компанией Chance Vought, «Корсар» вскоре стал пользоваться большим спросом; дополнительные контракты на производство были заключены с Goodyear, чьи «Корсары» получили обозначение FG, и Brewster, получивший обозначение F3A. «Корсар» был разработан и эксплуатировался как самолет авианосного базирования и поступил на вооружение ВМС США в большом количестве в конце 1944 и начале 1945 года. Он быстро стал одним из самых способных истребителей-бомбардировщиков авианосного базирования времен Второй мировой войны."
 USA_cv_fighter_equipment_3:0 "Грумман F8F «Бэркэт»"
 USA_cv_fighter_equipment_3_short:0 "F8F «Бэркэт»"
 USA_cv_fighter_equipment_3_desc:0 "Грумман F8F «Бэркэт» - американский одномоторный истребитель авианосного базирования, представленный в конце Второй мировой войны. В середине XX века он служил в ВМС США, Корпусе морской пехоты США и ВВС других стран. Это был последний истребитель компании Grumman Aircraft с поршневым двигателем."
 
 ############USA Cold War

 USA_cv_mr_stealth_fighter_equipment_1:0 "Локхид Мартин F-35C «Лайтнинг II»"
 USA_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C «Лайтнинг II»"
 USA_cv_mr_stealth_fighter_equipment_1_desc:0 "F-35C - это вариант самолета семейства F-35 «Лайтнинг» II компании Lockheed Martin с Катапультным Взлетом и Задержкой Восстановления (КВЗВ), предназначенный в основном для развертывания на авианосце. Программа F-35 начала разрабатываться в 1992 году, а вариант С был поднят в воздух уже в 2010 году и эксплуатировался с авианосцев менее чем через четыре года. По сравнению со своими собратьями, вариант С отличается более крупными крыльями со складывающимися секциями законцовок крыла."
 
 USA_jump_stealth_equipment_1:0 "Локхид Мартин F-35B «Лайтнинг II»"
 USA_jump_stealth_equipment_1_short:0 "F-35B «Лайтнинг II»"
 USA_jump_stealth_equipment_1_desc:0 "Многоцелевой истребитель, созданный по проекту СУИ (Совместный Ударный Истребитель). Хотя он способен применять разнообразное оружие в бою воздух-воздух и земля-земля, стоимость закупки этого стелс-истребителя более приемлема, чем F-22A. В соответствии с его полезностью, существует несколько типов. Тип 'B', используемый Корпусом морской пехоты США, совместим с КВВП (короткий взлет/вертикальная посадка). Его прозвище - «Лайтнинг II»."
 
 USA_cas_stealth_equipment_1:0 "Фэйрчайлд Рипаблик A-10 «Тандерболт» II"
 USA_cas_stealth_equipment_1_short:0 "A-10C «Тандерболт» II"
 USA_cas_stealth_equipment_1_desc:0 "Вариант C самолета A-10 «Тандерболт» II был разработан в 2005 году в результате программы модернизации Precision Engagement. Используя опыт, полученный от прототипа YA-10B, A-10C оснащен модернизированной системой управления огнем, комплектом ECM и возможностями прицеливания "умных" бомб. Модуль идентификации "друг-враг" и комплекс связи также были обновлены и модернизированы. Отчасти благодаря своим результатам в недавней истории и политическому давлению, A-10, вероятно, продолжит нести боевую службу в ВВС США в обозримом будущем."

 #USA_cas_stealth_equipment_1:0 "General Atomics Predator-C Avenger"
 #USA_cas_stealth_equipment_1_short:0 "Predator-C Avenger"
 #USA_cas_stealth_equipment_1_desc:0 "The General Atomics Avenger is an unmanned combat air vehicle designed with stealth features and the same weapons capabilities as the older MQ-9 Reaper. The Avenger's first flight was in 2009, with carrier and extended range variants introduced in 2010 and 2016 respectively. Unlike the previous Predator and Reaper UAVs, the Avenger is powered by a turbofan engine."
 
 USA_mr_stealth_fighter_equipment_1:0 "Локхид Мартин F-35A «Лайтнинг II»"
 USA_mr_stealth_fighter_equipment_1_short:0 "F-35A «Лайтнинг II»"
 USA_mr_stealth_fighter_equipment_1_desc:0 "F-35A - это вариант истребителя с обычным взлетом и посадкой семейства F-35 «Лайтнинг» II компании Lockheed Martin. Разработка программы F-35 началась в 1992 году, а вариант А поднялся в небо в конце 2006 года и сбросил первые бомбы менее чем через шесть лет. Вариант А является самым маленьким и легким вариантом F-35 и в первую очередь предназначен для замены F-16 Fighting Falcon."
 
 USA_jet_multirole_equipment_1:0 "Локхид F-80 «Шутинг Стар»"
 USA_jet_multirole_equipment_1_short:0 "F-80A «Шутинг Стар»"
 USA_jet_multirole_equipment_1_desc:0 "Первый реактивный истребитель, эксплуатировавшийся ВВС армии США (позднее ВВС США). Он был первым и единственным американским реактивным самолетом, вступившим в строй в последние дни Второй мировой войны. Этот тип положил начало эпохе реактивных самолетов в США, поскольку его прямокрылая конструкция широко использовалась в качестве дневного истребителя и истребителя-бомбардировщика во время Корейской войны под названием F-80. Прозванный «Шутинг Стар», F-80 представлял собой первую вершину американской авиации."
 USA_jet_multirole_equipment_2:0 "Норт Американ F-86A «Сейбр»"
 USA_jet_multirole_equipment_2_short:0 "F-86A «Сейбр»"
 USA_jet_multirole_equipment_2_desc:0 "F-86 - это истребитель со стреловидным крылом, разработанный и представленный в конце 1940-х годов на основе исследований, захваченных немцами. Конструкция самолета позволяла ему развивать трансзвуковую скорость и высокую маневренность, что позволило ему справиться со своим знаменитым соперником МиГ-15. Официально известный как «Сейбр» или «Сейбрджет», F-86, а также его канадский и австралийский варианты, вместе взятые, стали самым производимым западным истребителем в истории авиации."
 USA_jet_multirole_equipment_3:0 "Норт Американ F-86F «Сейбр»"
 USA_jet_multirole_equipment_3_short:0 "F-86F «Сейбр»"
 USA_jet_multirole_equipment_3_desc:0 "Улучшенная система управления полетом и "полностью летающий хвост" (Эта система изменилась на полностью силовое управление с "искусственным ощущением", встроенным в органы управления самолета, чтобы дать пилоту усилия на стике, которые все еще были обычными, но достаточно легкими для превосходного боевого управления). «Сейбр» F имели значительно улучшенную скоростную маневренность в сочетании с более высокой посадочной скоростью - более 145 миль/ч (233 км/ч)."
 USA_jet_multirole_equipment_4:0 "Норт Американ F-100 «Супер Сейбр»"
 USA_jet_multirole_equipment_4_short:0 "F-100 «Супер Сейбр»"
 USA_jet_multirole_equipment_4_desc:0 "Первый реактивный истребитель, способный развивать сверхзвуковую скорость в ровном полете, F-100 был способным многоцелевым самолетом, предназначенным для встречи с противником лоб в лоб. Разработанный на основе F-86 «Сейбр», F-100 получил прозвище «Супер Сейбр», но также получил прозвище «Хун» из-за своего назначения в ВВС США в то время. Этот тип служил во Вьетнаме в качестве истребителя-бомбардировщика и был первым, который использовался в роли подавления ПВО противника, известной как Дикая Ласка."
 USA_jet_multirole_equipment_5:0 "Макдоннелл-Дуглас F-4C «Фантом II»"
 USA_jet_multirole_equipment_5_short:0 "F-4C Phantom II"
 USA_jet_multirole_equipment_5_desc:0 "Программа F-4 является одним из самых успешных проектов истребителей на сегодняшний день. Она была настолько успешной, что ВВС США выбрали этот тип в качестве замены Конвэр F-106 «Дельта Дарт». Двухместный всепогодный тактический истребитель, штурмовой вариант для ВВС США; поддерживал широкий спектр вооружений, включая AIM-4 Falcon, AGM-12 Bullpup и ядерное оружие; более широкие шины основных колес привели к характерным выпуклостям крыла; двигатели J79-GE-15 с возможностью запуска патронами; дозаправка через штангу вместо заправки через зонд и дрогу; радар AN/APQ-100; дублирование органов управления полетом в задней кабине."
 USA_jet_multirole_equipment_6:0 "Макдоннелл-Дуглас F-4D «Фантом II»"
 USA_jet_multirole_equipment_6_short:0 "F-4D «Фантом II»"
 USA_jet_multirole_equipment_6_desc:0 "F-4C с обновленной авионикой и радаром AN/APQ-109."
 USA_jet_multirole_equipment_7:0 "Макдоннелл-Дуглас F-4E «Фантом II»"
 USA_jet_multirole_equipment_7_short:0 "F-4E «Фантом II»"
 USA_jet_multirole_equipment_7_desc:0 "Версия для ВВС США со встроенной пушкой M61 «Вулкан» в удлиненном носу RF-4C, радаром AN/APQ-120 с меньшим поперечным сечением для размещения пушки, двигателями J79-GE-17 с тягой на форсаже 17 900 фунтов (79,379 кН) каждый. В рамках программы Agile Eagle самолеты поздних серий оснащались передними кромковыми планками для улучшения маневренности в ущерб максимальной скорости. Начиная с Block 53, самолеты получили возможность установки AGM-65 Maverick и бездымные двигатели J79-GE-17C или -17E. Первый полет 1 августа 1965 года. Самый многочисленный вариант Phantom; построено 1 370 единиц."
 USA_jet_multirole_equipment_8:0 "Дженерал Дайнэмикс F-16A Fighting Falcon"
 USA_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 USA_jet_multirole_equipment_8_desc:0 "Тяговитый, легкий истребитель с хорошо сбалансированной маневренностью и устойчивостью. Он имеет исключительно легкий и аэродинамичный корпус со смешанным крылом, и хотя это одномоторный самолет, он оснащен мощным двигателем. Прозванный "Боевым соколом", его относительно низкая стоимость и высокая мощность стали причиной того, что он был принят на вооружение ВВС по всему миру. На сегодняшний день выпущено более 4 000 экземпляров этой самой продаваемой модели."
 USA_jet_multirole_equipment_9:0 "Дженерал Дайнэмикс F-16A Блок 15 Fighting Falcon"
 USA_jet_multirole_equipment_9_short:0 "F-16A Блок 15"
 USA_jet_multirole_equipment_9_desc:0 "Первое серьезное изменение в F-16, самолет Block 15 отличался более крупными горизонтальными стабилизаторами, добавлением двух жестких точек к подбородочному отверстию, новым радаром и увеличенной емкостью для подкрыльевых пилонов. Этот вариант также получил современную радиостанцию ультравысокой частоты (УВЧ). Этот вариант является самым многочисленным среди вариантов F-16."
 USA_jet_multirole_equipment_10:0 "Дженерал Дайнэмикс F-16C Блок 25 Fighting Falcon"
 USA_jet_multirole_equipment_10_short:0 "F-16C Блок 25"
 USA_jet_multirole_equipment_10_desc:0 "Первый блок-вариант для F-16C, был оснащен новым радаром и улучшенной системой управления огнем, а также интегрированными системами передачи данных для улучшения возможностей ночной атаки. Представленный в 1984 году, вариант F-16C B25 сослужит большую службу во время войны в Персидском заливе."
 #USA_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 40/42 Fighting Falcon"
 #USA_jet_multirole_equipment_10_short:0 "F-16C Block 40/42"
 #USA_jet_multirole_equipment_10_desc:0 "The Block 40/42 sub-variant was the first to utilize the Low Altitude Navigation and Targeting Infrared for Night pod, also known as LANTIRN. In addition, the undercarriage was strengthened and slightly lengthened to accommodate this new avionics package. The Block 40/42 would also be capable of using Precision-Guided Bombs and Stand-Off Dispensers. As a result, the aircraft was unofficially designated as F-16CG and given the unofficial nickname of 'Night Falcon.'"
 
 USA_jet_interceptor_equipment_1:0 "Локхид F-94 «Старфайр»"
 USA_jet_interceptor_equipment_1_short:0 "F-94 «Старфайр»"
 USA_jet_interceptor_equipment_1_desc:0 "Разработанный на основе  F-80 «Шутинг стар», F-94 был разработан как замена винтомоторным F-61 «Блэк Уидоу» и F-82 «Твин Мустанг» тяжелым ночным истребителям. Первоначально оснащенный пушечным вооружением (четыре, а позже восемь 12,7-мм пулеметов), он был заменен на полностью ракетное вооружение, запускаемое из внутренних отсеков. Прозванный «Старфайр», он стал первым крупным реактивным перехватчиком в истории ВВС США."
 USA_jet_interceptor_equipment_2:0 "Норт Американ F-86D «Сейбр Дог»"
 USA_jet_interceptor_equipment_2_short:0 "F-86D «Сейбр Дог»"
 USA_jet_interceptor_equipment_2_desc:0 "Разработанный как всепогодный перехватчик, F-86D (первоначально обозначавшийся F-95) взял потрясающие характеристики F-86 «Сейбрджет» и улучшил их, добавив радар (придав варианту характерный носовой радар), более длинный фюзеляж и более мощный форсажный двигатель. Первоначально самолет был оснащен внутренним отсеком для запуска ракет для перехвата бомбардировщиков, но более поздние варианты «Сейбр Дог» стали оснащаться пушками."
 USA_jet_interceptor_equipment_3:0 "Нортроп F-89 «Скорпион»"
 USA_jet_interceptor_equipment_3_short:0 "F-89 «Скорпион»"
 USA_jet_interceptor_equipment_3_desc:0 "F-89 (первоначально P-89) - всепогодный перехватчик, с самого начала предназначенный для этой роли, когда он поступил на вооружение в 1954 году. Первоначально он оснащался пушечным вооружением, но в серийной версии от него отказались в пользу ракетного вооружения. Позже "Скорпион" получит дополнительное острие с внедрением ракетного вооружения, став первым реактивным самолетом, использующим такое вооружение."
 USA_jet_interceptor_equipment_4:0 "Конвэр F-102A «Дельта Дэггер»"
 USA_jet_interceptor_equipment_4_short:0 "F-102A «Дельта Дэггер»"
 USA_jet_interceptor_equipment_4_desc:0 "Первый дельтакрылый истребитель США, F-102 был первым сверхзвуковым истребителем, используемым ВВС США, способным развивать скорость в 1 Мах. Он был разработан как перехватчик и убийца бомбардировщиков, заменив F-89 «Скорпион», и был способен сбивать вражеские самолеты бортовыми ракетами и ракетами из внутреннего отсека, став первым истребителем с такой конструкцией. «Дельта Дэггер» будет служить в первые периоды войны во Вьетнаме в качестве самолета сопровождения бомбардировщиков и штурмовика."
 USA_jet_interceptor_equipment_5:0 "Макдоннелл F-101B Voodoo"
 USA_jet_interceptor_equipment_5_short:0 "F-101B Voodoo"
 USA_jet_interceptor_equipment_5_desc:0 "F-101, представленный в 1957 году, был первоначально разработан как истребитель сопровождения дальних бомбардировщиков или истребитель проникновения для Стратегического воздушного командования ВВС США. (Это изменилось, когда он стал истребителем-бомбардировщиком с ядерным потенциалом для Тактического воздушного командования (TAC). 'Voodoo' имел большой радиус действия. С баз в Западной Германии он мог наносить удары по любой стране Варшавского договора и проникать на глубину до 500 миль (800 км) непосредственно на советскую территорию."
 USA_jet_interceptor_equipment_6:0 "Конвэр F-106A «Дельта Дарт»"
 USA_jet_interceptor_equipment_6_short:0 "F-106A «Дельта Дарт»"
 USA_jet_interceptor_equipment_6_desc:0 "F-106 был дальнейшим развитием F-102 «Дельта Дэггер». Представленный в 1959 году, F-106, как и его предшественник, не был оснащен бортовым оружием, и поэтому для поражения вражеских бомбардировщиков полагался на ракеты. Он был оснащен инфракрасной ракетой AIM-4 и одной ракетой AIM-26 с ядерной головкой. Прозванный "Алтимейт Интерсептор", «Дельта Дарт» нес свое вооружение во внутреннем отсеке - конструктивная особенность, которая не использовалась на истребителях до 5-го поколения реактивных истребителей."
 USA_jet_interceptor_equipment_7:0 "Норт Американ F-106A «Сикс Шутер»"
 USA_jet_interceptor_equipment_7_short:0 "F-106A «Сикс Шутер»"
 USA_jet_interceptor_equipment_7_desc:0 "После принятия на вооружение F-106 был постепенно модернизирован: улучшена авионика, модифицировано крыло с заметным коническим изгибом, установлена инфракрасная система поиска и слежения, обтекаемые сверхзвуковые крыльевые баки, которые практически не ухудшали общие характеристики самолета, улучшены приборы, а также такие функции, как емкость для дозаправки в полете и крюк для аварийной посадки. Проект «Сикс Шутер» добавил возможность установки пушки M61 «Вулкан» и оптического прицела."
 USA_jet_interceptor_equipment_8:0 "Макдоннелл-Дуглас F-15A «Игл»"
 USA_jet_interceptor_equipment_8_short:0 "F-15A «Игл»"
 USA_jet_interceptor_equipment_8_desc:0 "Передовой истребитель воздушного превосходства, оснащенный жесткими точками для множества систем вооружения и передовой авионикой, способный вступить в бой с самыми современными истребителями противника. Всепогодный крупномасштабный истребитель. Обладает феноменальной максимальной скоростью даже среди истребителей, на его борту размещено огромное количество боеприпасов. Прозванный «Игл», он имеет настолько высокий уровень устойчивости, что является рекордсменом по восстановлению после потери крыла в бою."
 USA_jet_interceptor_equipment_9:0 "Макдоннелл-Дуглас F-15C «Игл»"
 USA_jet_interceptor_equipment_9_short:0 "F-15C «Игл»"
 USA_jet_interceptor_equipment_9_desc:0 "Модернизированная версия всепогодной, превосходной в воздухе платформы F-15, вариант "C" оснащен улучшенным радаром, который может отслеживать до дюжины вражеских самолетов в любое время, а также способен одновременно поражать половину из них. Этот тип использовался во множестве стран за пределами США, от Саудовской Аравии до Израиля, и является более распространенным вариантом «Игл», сохранившим свой звездный послужной список."

 USA_high_mach_jet_interceptor_equipment_1:0 "Локхид F-90"
 USA_high_mach_jet_interceptor_equipment_1_short:0 "F-90"
 USA_high_mach_jet_interceptor_equipment_1_desc:0 "Локхид XF-90 был создан в ответ на требование ВВС США о создании истребителя дальнего проникновения и сопровождения бомбардировщиков. По такому же требованию был создан Макдоннелл XF-88 Voodoo. Компания Lockheed получила контракт на два прототипа XP-90 (переименованных в XF-90 в 1948 году)."
 USA_high_mach_jet_interceptor_equipment_2:0 "Локхид F-104 «Старфайтер»"
 USA_high_mach_jet_interceptor_equipment_2_short:0 "F-104 «Старфайтер»"
 USA_high_mach_jet_interceptor_equipment_2_desc:0 "F-104 был разработан в результате желания пилота иметь простой, небольшой самолет, который мог бы похвастаться отличными характеристиками. В результате появился этот самолет, который стал одним из первых самолетов-перехватчиков со скоростью 2 Маха, состоящих на вооружении армии США. «Старфайтер» установил множество рекордов скорости и высоты полета, но был омрачен политическими разногласиями и низкой живучестью, что дало ему еще одно прозвище - 'Вдоводел'."
 USA_high_mach_jet_interceptor_equipment_3:0 "Норт Американ F-108 «Рапира»"
 USA_high_mach_jet_interceptor_equipment_3_short:0 "F-108 «Рапира»"
 USA_high_mach_jet_interceptor_equipment_3_desc:0 "F-108 - высокоскоростной перехватчик и первый самолет в своем типе, оснащенный ракетой дальнего радиуса действия AIM-47 Falcon. Способный развивать скорость в 3 Маха, «Рапира» стал бы вершиной американских сил сдерживания перехвата до появления F-12 «Чёрный Дрозд»."
 USA_high_mach_jet_interceptor_equipment_4:0 "Локхид F-12B «Чёрный Дрозд»"
 USA_high_mach_jet_interceptor_equipment_4_short:0 "F-12B «Чёрный Дрозд»"
 USA_high_mach_jet_interceptor_equipment_4_desc:0 "F-12 - высокосверхзвуковой стратосферный самолет-перехватчик, предназначенный для относительно легкого перехвата бомбардировщиков, находящихся либо на большой высоте, либо на высокой скорости. Самолет оснащен тремя ракетами AIM-47 Falcon дальнего радиуса действия класса "воздух-воздух", что позволяет ему поражать цели до того, как вражеский бомбардировщик успеет выпустить полезную нагрузку. Его черная рама и возможности полета оправдывают его прозвище «Чёрный Дрозд». Впоследствии этот тип породил более известный стратегический разведывательный самолет SR-71."
 
 USA_jet_CAS_equipment_1:0 "Рипаблик F-84E «Тандерджет»"
 USA_jet_CAS_equipment_1_short:0 "F-84E «Тандерджет»"
 USA_jet_CAS_equipment_1_desc:0 "F-84 был разработан как дневной истребитель-бомбардировщик, призванный заменить более ранний P-47 «Тандерболт». Несмотря на поступление на вооружение в 1947 году, «Тандерджет» столкнулся с множеством проблем. Настолько, что до появления варианта 'D' в 1949 году, F-84 был практически снят с производства. Этот тип служил основным ударным самолетом ВВС США во время Корейской войны и был первым истребителем, который использовался демонстрационной командой ВВС США «Тандердбердс». Возможно, именно по этой причине «Тандерджет» было бы подходящим названием для этого типа."
 USA_jet_CAS_equipment_2:0 "Рипаблик F-84G «Тандерджет»"
 USA_jet_CAS_equipment_2_short:0 "F-84G «Тандерджет»"
 USA_jet_CAS_equipment_2_desc:0 "F-84 был разработан как дневной истребитель-бомбардировщик, призванный заменить более ранний P-47 «Тандерболт». Несмотря на то, что «Тандерджет» поступил на вооружение в 1947 году, он столкнулся с множеством проблем. Настолько, что до появления варианта 'D' в 1949 году, F-84 был практически снят с производства. Этот тип служил основным ударным самолетом ВВС США во время Корейской войны и был первым истребителем, который использовался демонстрационной командой ВВС США «Тандердбердс». Возможно, именно по этой причине «Тандерджет» было бы подходящим названием для этого типа".
 USA_jet_CAS_equipment_3:0 "Рипаблик F-84F «Тандерстрик»"
 USA_jet_CAS_equipment_3_short:0 "F-84F «Тандерстрик»"
 USA_jet_CAS_equipment_3_desc:0 "Разработанный на основе более раннего F-84 «Тандерджет», F-84F был вариантом истребителя-бомбардировщика со стреловидным крылом, призванным приблизить этот тип к характеристикам широко известного F-86 «Сейбр». Несмотря на улучшенные возможности по сравнению со своим прямокрылым предшественником, он все еще имел те же недостатки во взлетных характеристиках при плохой устойчивости и управлении. На протяжении всего срока службы этот тип служил в ограниченном качестве, прослужив до 1971 года. Его прозвище - «Тандерстрик»."
 USA_jet_CAS_equipment_4:0 "Рипаблик F-105D «Тандерчиф»"
 USA_jet_CAS_equipment_4_short:0 "F-105D «Тандерчиф»"
 USA_jet_CAS_equipment_4_desc:0 "Используемый исключительно ВВС США, F-105 является сверхзвуковым истребителем-бомбардировщиком со среловидным крылом, изначально разработанным как штурмовик с ядерным потенциалом. На момент своего появления в 1955 году он был самым большим одномоторным одноместным боевым самолетом в истории. Во время войны во Вьетнаме он служил в качестве основного штурмовика ВВС США и совершил более 20 000 вылетов, как в одноместном варианте, так и в двухместном для подавления ПВО противника. В соответствии с принятыми в компании Republic Aviation правилами присвоения названий, его прозвище - «Тандерчиф»."
 USA_jet_CAS_equipment_5:0 "Рипаблик F-105D «Тандерчиф» 'Лук Элайк'"
 USA_jet_CAS_equipment_5_short:0 "F-105D 'Лук Элайк'"
 USA_jet_CAS_equipment_5_desc:0 "Модернизация 'Лук Элайк' увеличила грузоподъемность самолета с четырех до шестнадцати обычных 750-фунтовых (340 кг) бомб на подкрыльевых и фюзеляжных центральных стойках и добавила оборудование для запуска ракет "воздух-земля" AGM-12 «Булпап»."
 USA_jet_CAS_equipment_6:0 "LTV A-7D «Корсар» II"
 USA_jet_CAS_equipment_6_short:0 "A-7D «Корсар» II"
 USA_jet_CAS_equipment_6_desc:0 "Версия, построенная для ВВС США, с одним турбовентилятором Allison TF41-A-1 и одной 20-мм ротационной пушкой M61 «Вулкан»; навигационный радар AN/APN-153 в ранних моделях заменен на навигационный радар AN/APN-185, радар слежения за местностью AN/APQ-116 в ранних A-7B/C заменен на радар слежения за местностью AN/APQ-126."
 USA_jet_CAS_equipment_7:0 "Фэйрчайлд Рипаблик A-10A «Тандерболт» II"
 USA_jet_CAS_equipment_7_short:0 "A-10A «Тандерболт» II"
 USA_jet_CAS_equipment_7_desc:0 "Тяжело вооруженный штурмовик, обеспечивающий наземную поддержку с близкого расстояния, используя подавляющую огневую мощь и выносливость. Имеет широкий выбор вооружения, включая 30-мм пулеметы, бомбы и ракеты, обеспечивая превосходные возможности для атаки с воздуха на землю. Обладая высокой устойчивостью на низких скоростях, он специализируется на продолжительной и точной зачистке местности в ходе одной атаки. Известный как «Тандерболт» II (и названный в честь самолета P-47 «Тандерболт»), он отличается прямым крылом, прочным на малых скоростях, а его высокорасположенный двигатель и усиленная броня защищают его от контратак с земли."
 USA_jet_CAS_equipment_8:0 "Фэйрчайлд Рипаблик A-10A «Тандерболт» II 'LASTE'"
 USA_jet_CAS_equipment_8_short:0 "A-10A «Тандерболт» II 'LASTE'"
 USA_jet_CAS_equipment_8_desc:0 "В начале своего существования A-10 начал получать модернизацию Low-Altitude Safety and Targeting Enhancement (LASTE), которая обеспечила компьютеризированное оборудование для наведения оружия, автопилот и систему предупреждения столкновений с землей. Позже система LASTE была модернизирована с помощью интегрированного компьютера управления полетом и огнем."

 #LIGHT JETS
 
 USA_jet_light_equipment_1:0 "Локхид T-33 «Шутинг Стар»"
 USA_jet_light_equipment_1_short:0 "T-33 «Шутинг Стар»"
 USA_jet_light_equipment_1_desc:0 "Локхид T-33 «Шутинг Стар» (или T-Bird) - дозвуковой американский реактивный учебно-тренировочный самолет. Он был произведен компанией Lockheed и совершил свой первый полет в 1948 году. T-33 был разработан на базе Локхид P-80/F-80, начиная с TP-80C/TF-80C, затем получил обозначение T-33A."
 
 USA_jet_light_equipment_2:0 "Норт Американ FJ-2 «Фьюри»"
 USA_jet_light_equipment_2_short:0 "FJ-2 «Фьюри»"
 USA_jet_light_equipment_2_desc:0 "Норт Американ FJ-2 и FJ-3 «Фьюри» - серия истребителей со стреловидным крылом, способных нести авианосцы, для ВМС и Корпуса морской пехоты США. FJ-2 был создан в результате попытки модернизации F-86 «Сейбр» ВВС США. Эти самолеты отличаются складными крыльями и более длинной носовой посадочной стойкой, предназначенной для увеличения угла атаки при старте и для размещения более длинного олео для поглощения удара при жесткой посадке на палубу авианосца."

 USA_jet_light_equipment_3:0 "Нортроп F-5A «Фридом Файтер»"
 USA_jet_light_equipment_3_short:0 "F-5A «Фридом Файтер»"
 USA_jet_light_equipment_3_desc:0 "F-5A был разработан как легкий истребитель, предназначенный в основном для экспорта. Он легче и дешевле в производстве, чем большинство других современных истребителей, что делает его идеальным вариантом для эскадрилий истребителей малой дальности. Несмотря на это, тип оказался довольно проворным, и был ближайшим самолетом, способным конкурировать с советским МиГ-21 'Fishbed'. Поскольку в разгар холодной войны он использовался большинством союзников Америки, его справедливо называли "Истребитель Свободы"."

 USA_jet_light_equipment_4:0 "Норт Американ Рокуэлл OV-10A «Бронко»"
 USA_jet_light_equipment_4_short:0 "OV-10A «Бронко»"
 USA_jet_light_equipment_4_desc:0 "Норт Американ Рокуэлл OV-10 «Бронко» - американский двухместный турбовинтовой легкий штурмовик и самолет наблюдения. Он был разработан в 1960-х годах как специальный самолет для борьбы с повстанцами, и одной из его основных задач было управление воздушным движением. Он может нести до 3200 фунтов внешних боеприпасов, внутренних грузов, таких как десантники или носилки, и находиться в воздухе в течение трех и более часов."

 USA_jet_light_equipment_5:0 "Норт Американ Рокуэлл OV-10D «Бронко»"
 USA_jet_light_equipment_5_short:0 "OV-10D «Бронко»"
 USA_jet_light_equipment_5_desc:0 "Второе поколение «Бронко», разработанное по программе NOGS. Модель D представляла собой сильно модифицированный планер OV-10A, на котором была установлена инфракрасная система ночного видения переднего обзора с камерой на турели под удлиненным носом, визуально отличающимся от короткого закругленного носа модели A. Модель D также имела более мощные двигатели и более мощные двигатели. Модель D также имеет более мощные двигатели и большие стеклопластиковые пропеллеры. Другими заметными внешними отличиями являются дозаторы зевак, установленные в середине стрелы, и выхлопные трубы с инфракрасным подавлением (которые смешивают выхлоп с более холодным воздухом для уменьшения теплового излучения самолета)."

###Bombers

 USA_nav_bomber_equipment_4:0 "Локхид P2V «Нептун»"
 USA_nav_bomber_equipment_4_short:0 "P2V-2 «Нептун»"
 USA_nav_bomber_equipment_4_desc:0 "P2V был морским патрульным и противолодочным самолетом, разработанным для замены PV-1 «Вентура» и PV-2 Harpoon времен Второй мировой войны. Представленный в 1947 году для ВМС США, он фактически являлся самолетом наземного базирования, и P2V, позднее получивший обозначение P-2 после 1962 года, никогда не совершал посадку на авианосец, но небольшое количество было переоборудовано для этого, и был развернут с авианосцев в качестве промежуточных ядерных бомбардировщиков, которые должны были приземлиться на берег или в канаву, подобно бомбардировщикам, использовавшимся в рейде Дулиттла во время Второй мировой войны. Его прозвище - «Нептун» в честь римского бога моря."
 USA_nav_bomber_equipment_5:0 "Локхид P2V-7 «Нептун»"
 USA_nav_bomber_equipment_5_short:0 "P2V-7 «Нептун»"
 USA_nav_bomber_equipment_5_desc:0 "Последний вариант «Нептун», произведенный компанией Lockheed, с двигателями R-3350-32W и J-34. Оснащен крыльевыми баками меньшего сопротивления, поисковым радаром AN/APS-20 в обновленном радиокозырьке и выпуклым козырьком кабины. Ранние самолеты оснащались оборонительными пушечными башнями, но они были сняты, как и на P2V-5."
 USA_nav_bomber_equipment_6:0 "Локхид P-3 «Орион»"
 USA_nav_bomber_equipment_6_short:0 "P-3A «Орион»"
 USA_nav_bomber_equipment_6_desc:0 "P-3A (первоначальное обозначение P3V), созданный на базе авиалайнера Локхид L-188 «Электра», был разработан как замена более ранним P-2 «Нептун»и P-5 «Марлин» в роли морского патруля и наземной противолодочной обороны (ПЛО). Он имеет внутренний бомбоотсек для торпед воздушного базирования, а также подкрыльевые пилоны для множества видов вооружения, включая противокорабельные ракеты большой дальности, ракеты класса "воздух-земля", мины и глубинные бомбы. Кроме того, на хвосте у него установлен детектор магнитных аномалий для обнаружения подводных лодок с помощью магнитного поля Земли. Имея в своем распоряжении такие средства и продолжая выполнять свою роль с момента своего появления в 1962 году, самолет вполне уместно прозвали «Орион». Охотник за вражескими судами."
 USA_nav_bomber_equipment_7:0 "Локхид P-3C «Орион»"
 USA_nav_bomber_equipment_7_short:0 "P-3C «Орион»"
 USA_nav_bomber_equipment_7_desc:0 "P-3C имел новый комплекс ASW и бортовой компьютер с измененной внутренней компоновкой. Внешне P-3C имел электрически управляемую входную лестницу; небольшую антенну на плавнике; загружаемые извне желоба для сонобуев; и три небольших окна в кормовой правой части (одно окно перед аварийным выходом в крыле и два в кормовой части). На самолетах первоначального производства носовая камера располагалась на нижней части радиолокационного обтекателя. На более поздних самолетах вместо носовой камеры была установлена выдвижная турель IRDS. Начиная с начала 1980-х годов существующие носовые камеры были переоборудованы турелями IRDS. Ранние модели были также известны как P-3C "Baseline" или самолеты без обновлений. Позже все самолеты были дооснащены двойными инерциальными навигационными системами LTN-72."
 USA_nav_bomber_equipment_8:0 "Боинг P-8 «Посейдон»"
 USA_nav_bomber_equipment_8_short:0 "P-8 «Посейдон»"
 USA_nav_bomber_equipment_8_desc:0 "Первоначально известный как многоцелевой морской самолет (MMA), P-8 был разработан как замена устаревшему P-3 Orion. Разработанный на базе авиалайнера нового поколения Boeing 737, P-8 был предназначен для противолодочной борьбы и морского патрулирования. Кроме того, он может выполнять функции электронной поддержки, используя способность самозащиты раннего предупреждения (ССРП). С момента своего появления в 2013 году, "Посейдон" занимает свое место в качестве нового морского царя, поскольку его варианты находятся на вооружении в США, Великобритании, Индии и Австралии."
 
 #USA_cv_nav_bomber_equipment_4:0 "Martin AM Mauler"
 #USA_cv_nav_bomber_equipment_4_short:0 "AM Mauler"
 #USA_cv_nav_bomber_equipment_4_desc:0 "Originally designated the BTM, the AM was a single-seat torpedo bomber, the first of its kind in aviation history. The Mauler is faster and lighter than contemporary bombers at the time and needed 1/3 of the crew members than the typical torpedo bomber of its day. With a bomb load of over 10,500 lbs (4800 kg), it could carry more ordinance than many of its predecessors and contemporaries alike. However, the AM, nicknamed the 'Mauler' was probably overly stable, being described as 'heavy handling' and difficult to land on an aircraft carrier. As a result, it only had a short service carrier, operating on frontline units in the Atlantic for two years before being replaced with the AD-1 Skyraider."
 #USA_cv_nav_bomber_equipment_5:0 "Grumman AF Guardian"
 #USA_cv_nav_bomber_equipment_5_short:0 "AF Guardian"
 #USA_cv_nav_bomber_equipment_5_desc:0 "The AF 'Guardian' (originally designated TB3F) is the first purpose-built Anti-Submarine Warfare aircraft to enter service with the U.S. Navy. Because it was originally designed as a Torpedo Bomber and thus could not fit all its ASW equipment into the frame, two variants were developed, the AF-2W which was equipped with a search radar, and the AF-2S, which carried various weapons such as torpedoes, depth charges, bombs or rockets."
 #USA_cv_nav_bomber_equipment_6:0 "Grumman S-2 Tracker"
 #USA_cv_nav_bomber_equipment_6_short:0 "S-2 Tracker"
 #USA_cv_nav_bomber_equipment_6_desc:0 "The S-2 (formerly S2J) took the lessons learned from the Guardian and applied them to a single airframe with two turboprop engines and foldable wings. Introduced first in 1952, the 'Tracker', alongside it's EW variant, the E-1 Tracer and Transport craft, the C-1 Trader, served in the U.S. Navy into the 1970s and 80s."
 #USA_cv_nav_bomber_equipment_7:0 "Lockheed S-3 Viking"
 #USA_cv_nav_bomber_equipment_7_short:0 "S-3 Viking"
 #USA_cv_nav_bomber_equipment_7_desc:0 "The S-3 was the successor and replacement for the earlier S-2 Tracker in the role of Anti-Submarine Warfare. Entering service in 1974, the type was one of the first to introduce a higher degree of systems integration, not seen in either it's predecessor, nor the land-based P-3 Orion. As a result, the aircraft could utilize a crew of four compared to the Orion's 12. In addition, it was one of the first aircraft to utilize an auxiliary power unit, allowing the craft to start relatively unassisted. Nicknamed the 'Viking,' The S-3 provided a mainstay in carrier-based Anti-Surface Warfare during its time in service."
 #USA_cv_nav_bomber_equipment_8:0 "Boeing F/A-18F Super Hornet"
 #USA_cv_nav_bomber_equipment_8_short:0 "F/A-18F Super Hornet"
 #USA_cv_nav_bomber_equipment_8_desc:0 "A versatile carrier-based fighter capable of providing support for aircraft, ground forces, and ships. With better maneuverability at medium speeds than high-speed fighters, it is effective in air raids. Nicknamed 'Super Hornet,' the craft is an improved F-Type."
 
 USA_jet_tac_bomber_equipment_1:0 "Норт Америкэн B-45 «Торнадо»"
 USA_jet_tac_bomber_equipment_1_short:0 "B-45 «Торнадо»"
 USA_jet_tac_bomber_equipment_1_desc:0 "Первый оперативный бомбардировщик ВВС США с реактивным двигателем, «Торнадо» - это среднеразмерный бомбардировщик с реактивным двигателем, способный обеспечить поддержку на поле боя, а также дальнюю разведку. В течение нескольких лет он будет играть важную роль в системе ядерного сдерживания Америки, прежде чем его вытеснит B-47 «Стратоджет»."
 USA_jet_tac_bomber_equipment_2:0 "Мартин B-57 «Канберра»"
 USA_jet_tac_bomber_equipment_2_short:0 "B-57 «Канберра»"
 USA_jet_tac_bomber_equipment_2_desc:0 "«Канберра» - это американская версия одноименного английского электрического бомбардировщика. Он идеально подходит для тактических ударов и разведки. Его снятие с вооружения в 1980-х годах ознаменовало конец эры тактических бомбардировщиков."
 USA_jet_tac_bomber_equipment_3:0 "Дуглас B-66 «Дестройер»"
 USA_jet_tac_bomber_equipment_3_short:0 "B-66 «Дестройер»"
 USA_jet_tac_bomber_equipment_3_desc:0 "Созданный на основе A-3 «Скайуорриор» ВМС США, «Дестройер» служил легким бомбардировщиком, заменившим A-26 «Инвэйдер». Среди изменений по сравнению с аналогом ВМС - добавление катапультируемых кресел. Как и его флотский аналог, он также выполнял функции разведчика и самолета радиоэлектронной борьбы."
 USA_jet_tac_bomber_equipment_4:0 "Дженерал Дайнэмикс F-111A «Аардварк»"
 USA_jet_tac_bomber_equipment_4_short:0 "F-111A «Аардварк»"
 USA_jet_tac_bomber_equipment_4_desc:0 "«Аардварк» - это сверхзвуковой самолет-перехватчик, оснащенный радаром, ориентированным на местность, усовершенствованными турбовентиляторными двигателями с дожиганием и крыльями изменяемой стреловидности. Это позволяет наносить высокоскоростные удары на малой высоте в глубине вражеской территории."
 USA_jet_tac_bomber_equipment_5:0 "Дженерал Дайнэмикс F-111E «Аардварк»"
 USA_jet_tac_bomber_equipment_5_short:0 "F-111E «Аардварк»"
 USA_jet_tac_bomber_equipment_5_desc:0 "Разработанный как промежуточный вариант для F-111D, вариант E является последней модернизацией платформы «Аардварк» и имеет усовершенствованные воздухозаборники и обновленный комплекс авионики."
 USA_jet_tac_bomber_equipment_6:0 "Дженерал Дайнэмикс F-111F «Аардварк»"
 USA_jet_tac_bomber_equipment_6_short:0 "F-111F «Аардварк»"
 USA_jet_tac_bomber_equipment_6_desc:0 "Считающийся самым совершенным вариантом «Аардварк», вариант F отличается модернизацией воздухозаборников и авионики, а также усовершенствованной технологией FLIR и лазерного целеуказателя и более дешевым куполом радара. Эти дополнения сделали самолет способным использовать высокоточные управляемые боеприпасы."
 USA_jet_tac_bomber_equipment_7:0 "Макдоннелл-Дуглас F-15E «Страйк Игл»"
 USA_jet_tac_bomber_equipment_7_short:0 "F-15E «Страйк Игл»"
 USA_jet_tac_bomber_equipment_7_desc:0 "Истребитель-бомбардировщик с боевыми возможностями F-15C "воздух-воздух" и дополнительными возможностями "воздух-земля". Он может быть оснащен разнообразным вооружением, включая зенитные, наземные, многоцелевые ракеты и авиабомбы, и способен действовать в различных ситуациях. Называемый «Страйк Игл», внешне почти не отличающийся от F-15C, он обладает различными усовершенствованиями для атаки с земли."
 USA_jet_tac_bomber_equipment_8:0 "Боинг F-15E «Эдвенсед Игл»"
 USA_jet_tac_bomber_equipment_8_short:0 "F-15E «Эдвенсед Игл»"
 USA_jet_tac_bomber_equipment_8_desc:0 "Вариант F-15 «Эдвенсед Игл» является модернизированным по сравнению с предыдущими моделями, поскольку он имеет две дополнительные подкрыльевые точки крепления оружия (увеличив их количество с девяти до одиннадцати); возможность установки кабины с дисплеем большой площади; управление по схеме fly-by-wire; радар Raytheon AN/APG-82(V)1 или AN/APG-63(V)3 с активной электронно-сканирующей решеткой (ЭСР); двигатели General Electric General Electric F110-129; цифровые объединенные шлемофонные системы наведения в обеих кабинах; и цифровая система радиоэлектронной борьбы среди других усовершенствований."
 
 USA_jet_strat_bomber_equipment_1:0 "Конвэр B-36 «Миротворец»"
 USA_jet_strat_bomber_equipment_1_short:0 "B-36 «Миротворец»"
 USA_jet_strat_bomber_equipment_1_desc:0 "B-36 был самым большим бомбардировщиком с винтовым двигателем, когда-либо поступавшим на вооружение в 1948 году. Его огромные размеры означали, что без модификаций рамы или бомбы он мог нести любую ядерную бомбу, имевшуюся в арсенале Соединенных Штатов на тот момент. Однако с появлением реактивных самолетов на вооружении этот тип был быстро заменен на B-47 и B-52. Вопреки распространенному мнению, B-36 не имеет официального прозвища, но компания и многие ее пилоты, которым нравился этот тип, называли его «Миротворец»."
 USA_jet_strat_bomber_equipment_2:0 "Боинг B-47 «Стратоджет»"
 USA_jet_strat_bomber_equipment_2_short:0 "B-47 «Стратоджет»"
 USA_jet_strat_bomber_equipment_2_desc:0 "B-47, названный «Стратоджетом», - это шестимоторный дозвуковой бомбардировщик, который летает на большой высоте, чтобы избежать вражеских перехватчиков. Благодаря двигателям, расположенным в гондолах под стреловидным крылом, B-47 стал главным новшеством в конструкции боевых самолетов после Второй мировой войны и внес вклад в развитие современных реактивных авиалайнеров."
 USA_jet_strat_bomber_equipment_3:0 "Боинг B-52D «Стратофортресс»"
 USA_jet_strat_bomber_equipment_3_short:0 "B-52D «Стратофортресс»" 
 USA_jet_strat_bomber_equipment_3_desc:0 "B-52 - это большой дозвуковой бомбардировщик большой дальности, способный выполнять длительные миссии над территорией противника. Благодаря превосходным характеристикам на высоких дозвуковых скоростях и относительно низким эксплуатационным расходам, «Стратофортресс» оставался на вооружении, несмотря на появление более поздних, более совершенных самолетов."
 USA_jet_strat_bomber_equipment_4:0 "Боинг B-52G «Стратофортресс»"
 USA_jet_strat_bomber_equipment_4_short:0 "B-52G «Стратофортресс»"
 USA_jet_strat_bomber_equipment_4_desc:0 "Вариант G самолета B-52 отличается модернизированной электроникой и авионикой, а также большей полезной нагрузкой. Этот вариант также отличается большей дальностью полета благодаря изменению конструкции рамы для увеличения объема топлива. Благодаря этой и другим модернизациям, «Стратофортресс» будет работать в качестве выдающейся бомбардировочной платформы вплоть до 2050-х годов."
 USA_jet_strat_bomber_equipment_5:0 "Боинг B-52H"
 USA_jet_strat_bomber_equipment_5_short:0 "B-52H «Стратофортресс»"
 USA_jet_strat_bomber_equipment_5_desc:0 "B-52H имел тот же экипаж и структурные изменения, что и B-52G. Наиболее значительной модернизацией был переход на турбовентиляторные двигатели TF33-P-3, которые, несмотря на первоначальные проблемы с надежностью (исправленные к 1964 году в рамках программы Hot Fan), обеспечивали значительно лучшие характеристики и экономию топлива, чем турбореактивные двигатели J57. ECM и авионика были обновлены, была установлена новая система управления огнем, а заднее оборонительное вооружение было заменено пулеметами на 20-мм пушку M61 «Вулкан»."
 
 USA_mach2stratbomber_equipment_1:0 "Конвэр B-58 «Хаслер»"
 USA_mach2stratbomber_equipment_1_short:0 "B-58 «Хаслер»"
 USA_mach2stratbomber_equipment_1_desc:0 "«Хаслер» - дельтакрылый сверхзвуковой бомбардировщик. Хотя он не может сравниться по полезной нагрузке с более крупными бомбардировщиками, он компенсирует это огромной скоростью."
 USA_mach2stratbomber_equipment_2:0 "Рокуэлл B-1 «Лансер»"
 USA_mach2stratbomber_equipment_2_short:0 "B-1A «Лансер»"
 USA_mach2stratbomber_equipment_2_desc:0 "B-1 был впервые задуман в 1960-х годах как платформа, которая сочетала бы скорость 2 Маха B-58 «Хаслер» с дальностью и полезной нагрузкой B-52, и в конечном итоге должна была заменить оба бомбардировщика. После длительных исследований компания Rockwell International (ныне часть компании Boeing) выиграла конкурс на разработку того, что в итоге стало B-1A. Эта версия обладала максимальной скоростью 2,2 Маха на большой высоте и способностью летать на большие расстояния со скоростью 0,85 Маха на очень низкой высоте."
 USA_mach2stratbomber_equipment_3:0 "Рокуэлл B-1B «Лансер»"
 USA_mach2stratbomber_equipment_3_short:0 "B-1B «Лансер»"
 USA_mach2stratbomber_equipment_3_desc:0 "Несмотря на то, что B-1B «Лансер» был медленнее, чем более ранний A, он имел больший запас топлива и возможность размещения внешней бомбовой нагрузки в дополнение к внутреннему бомбоотсеку. Кроме того, B-1B имеет улучшенный комплекс радиоэлектронной борьбы и был перепроектирован с уменьшенным поперечным сечением радара, что позволило быть более трудным для обнаружения, несмотря на снижение скорости."
 USA_mach3stratbomber_equipment_1:0 "Норт Американ B-70 «Валькирия»"
 USA_mach3stratbomber_equipment_1_short:0 "B-70 «Валькирия»"
 USA_mach3stratbomber_equipment_1_desc:0 "B-70 - стратегический бомбардировщик, способный развивать скорость 3 Маха, предназначенный для нанесения ядерных ударов с глубоким проникновением. Разработанный в 1950-х годах, B-70 был предназначен для замены B-52 и был спроектирован для сверхскоростного полета на скорости 3 Маха - технология, которая не была повторена до F-22 почти полвека спустя. Прозванный «Валькирией», B-70 стал катализатором будущих сверхзвуковых бомбардировщиков."
 USA_mach6stratbomber_equipment_1:0 "Локхид Мартин SR-72"
 USA_mach6stratbomber_equipment_1_short:0 "SR-72"
 USA_mach6stratbomber_equipment_1_desc:0 "Высокоскоростной стратегический бомбардировщик, SR-72 был первоначально разработан как замена стратегического разведывательного самолета SR-71 «Чёрный Дрозд». В отличие от «Чёрного Дрозда», SR-72 является чрезвычайно маневренным для скоростного самолета и способен нести большое количество боеприпасов."

 USA_nuclearstratbomber_equipment_1:0 "Конвэр NB-36H «Крусейдер»"
 USA_nuclearstratbomber_equipment_1_short:0 "NB-36H «Крусейдер»"
 USA_nuclearstratbomber_equipment_1_desc:0 "Разработанный в рамках программы Разработки Авиационного Ядерного Двигателя (РАЯД), NB-36H был первым стратегическим бомбардировщиком с ядерной силовой установкой, разработанным для ВВС США. Модификации по сравнению с B-36 Peacemaker включали новую секцию пилотской кабины, обшитую свинцом и резиной, а также свинцовое стекло для предотвращения заражения пилотов. Самолет был оснащен 1-мегаваттным реактором с воздушным охлаждением, весом 35 000 фунтов (16 000 кг), который был подвешен на крюке в среднем бомбоотсеке для удобства погрузки и выгрузки, когда он не находится в полете. Несмотря на отмену в 1961 году по причинам безопасности, «Крусейдер» дал НАСА представление о методах работы с жидкими металлами и плавлеными солями, что помогло в разработке ядерных генераторов и реакторов." 
 USA_nuclearstratbomber_equipment_2:0 "Боинг XB-37B"
 USA_nuclearstratbomber_equipment_2_short:0 "XB-37B"
 USA_nuclearstratbomber_equipment_2_desc:0 "Модифицированный вариант орбитального испытательного корабля X-37B (ОИК). Многоразовый роботизированный орбитальный космический корабль многоразового использования. Этот автономный корабль имеет внутреннюю возможность запуска крылатых ракет или бомб из вращающегося внутреннего оружейного отсека. Этот вариант оснащен ядерным двигателем, обеспечивающим ему практически неограниченное время полета."

 USA_cv_jet_CAS_equipment_1:0 "Дуглас A-1 «Скайрейдер»"
 USA_cv_jet_CAS_equipment_1_short:0 "AD-1 «Скайрейдер»"
 USA_cv_jet_CAS_equipment_1_desc:0 "Дуглас A-1 «Скайрейдер» (ранее AD «Скайрейдер») - американский одноместный штурмовик, состоявший на вооружении с конца 1940-х до начала 1980-х годов. «Скайрейдер» имел удивительно долгую и успешную карьеру; он стал анахронизмом с поршневым двигателем и винтом в эпоху реактивных самолетов и получил прозвище «Спад»."
 USA_cv_jet_CAS_equipment_2:0 "Дуглас AD-4 «Скайрейдер»"
 USA_cv_jet_CAS_equipment_2_short:0 "AD-4 «Скайрейдер»"
 USA_cv_jet_CAS_equipment_2_desc:0 "Усиленное шасси, улучшенный радар, компас G-2, противогазовый костюм, четыре 20-мм (0,79 дюйма) пушки и 14 ракетных установок Aero, способен нести до 50 фунтов (23 кг) бомб."
 USA_cv_jet_CAS_equipment_3:0 "Дуглас A-3B «Скайуорриор»"
 USA_cv_jet_CAS_equipment_3_short:0 "A-3B «Скайуорриор»"
 USA_cv_jet_CAS_equipment_3_desc:0 "Окончательная серийная версия бомбардировщика, с более прочным планером, более мощными двигателями, немного большей площадью крыла (812 футов²/75 м² против 779 футов²/72 м²), с возможностью дозаправки в полете для роли танкера. Последний 21 построенный самолет имел новую систему бомбометания AN/ASB-7, измененную носовую часть; удалена хвостовая турель в пользу установки радиоэлектронной борьбы."
 USA_cv_jet_CAS_equipment_4:0 "Дуглас A-4B «Скайхок»"
 USA_cv_jet_CAS_equipment_4_short:0 "A-4B «Скайхок»"
 USA_cv_jet_CAS_equipment_4_desc:0 "A-4B - одномоторный легкий штурмовик, способный нести такую же бомбовую нагрузку, как и B-17, несмотря на меньшую раму. С момента своего появления в 1954 году он служил во многих ВВС и ВМС, за 60 с лишним лет службы претерпел множество модификаций и модернизаций и продолжает служить во многих странах по сей день. Его прозвище - «Скайхок»."
 USA_cv_jet_CAS_equipment_5:0 "Дуглас A-4E «Скайхок»"
 USA_cv_jet_CAS_equipment_5_short:0 "A-4E «Скайхок»"
 USA_cv_jet_CAS_equipment_5_desc:0 "Значительная модернизация, включая новый двигатель Pratt & Whitney J52-P-6A с тягой 8 400 фунтов (37 кН), усиленный планер с двумя дополнительными пилонами вооружения (всего пять), улучшенную авионику с TACAN, доплеровским навигационным радаром, радарным высотомером, компьютером для метания бомб и системой низковысотного бомбометания AJB-3A. Многие из них позже были модернизированы двигателями J52-P-8, развивающими тягу 9 300 фунтов (41 кН)."
 USA_cv_jet_CAS_equipment_6:0 "Грумман A-6A «Интрудер»"
 USA_cv_jet_CAS_equipment_6_short:0 "A-6A «Интрудер»"
 USA_cv_jet_CAS_equipment_6_desc:0 "Всепогодный самолет авианосного базирования, оснащенный весьма совершенными для своего времени электронными системами. Он был разработан для того, чтобы позволить ему летать низко над вражеской территорией и использовать набор оружия для нанесения критического удара. Его прозвище - «Интрудер». Он также имел множество других прозвищ, связанных с его большой передней и тонкой задней частью, включая "Головастик" и "Собачий Корабль"."
 USA_cv_jet_CAS_equipment_7:0 "LTV A-7 «Корсар» II"
 USA_cv_jet_CAS_equipment_7_short:0 "A-7 «Корсар» II"
 USA_cv_jet_CAS_equipment_7_desc:0 "Разработанный на основе F-8 «Крусейдер», "Корсар II" (названный в честь F4U «Корсар») является одноместным, дозвуковым и базирующимся на авианосце легким штурмовиком с большей полезной нагрузкой и дальностью полета, чем A-4 «Скайхок», который он заменил. Позже он будет служить в ВВС США, заменив почтенные A-1 «Скайрейдер» и F-100 «Супер Сейбр», став одним из немногих штурмовиков, служивших и в ВМС, и в ВВС."
 USA_cv_jet_CAS_equipment_8:0 "Грумман A-6E «Интрудер»"
 USA_cv_jet_CAS_equipment_8_short:0 "A-6E «Интрудер»"
 USA_cv_jet_CAS_equipment_8_desc:0 "Окончательная версия штурмовика "Интрудер" со значительно усовершенствованными навигационными и атакующими системами. Прежние отдельные радары поиска и слежения (управления огнем) A-6A/B/C были заменены единым многорежимным радаром Norden AN/APQ-148, а бортовые компьютеры - более сложной и надежной системой."
 USA_cv_jet_CAS_equipment_9:0 "Грумман A-6E «Интрудер» УСУО"
 USA_cv_jet_CAS_equipment_9_short:0 "A-6E «Интрудер» УСУО"
 USA_cv_jet_CAS_equipment_9_desc:0 "В 1980-х годах самолеты A-6E «Интрудер» были переоборудованы в версию A-6E УСУО (Усовершенствование Системы Управления Оружием) для добавления дополнительных возможностей вооружения. Это добавило возможность нести и наводить на цель некоторые виды высокоточного управляемого оружия первого поколения, такие как ракеты AGM-84 Harpoon и AGM-123 Skipper. В конечном итоге самолет УСУО был модифицирован, чтобы иметь ограниченную возможность использовать ракету AGM-84E SLAM для наземного удара. Поскольку ракеты Harpoon и SLAM имели общие интерфейсы связи, самолеты УСУО могли нести и запускать ракеты SLAM, но для их наведения на цель требовался находящийся рядом A-6E SWIP."
 USA_cv_jet_CAS_equipment_10:0 "Макдоннелл-Дуглас F/A-18B «Хорнет»"
 USA_cv_jet_CAS_equipment_10_short:0 "F/A-18B «Хорнет»"
 USA_cv_jet_CAS_equipment_10_desc:0 "Разработанный на основе прототипа YF-17 Cobra ВВС США, «Хорнет» является представителем нового поколения универсальных самолетов, которые сочетают в себе новые достижения в компьютерных технологиях с высокой скоростью и маневренностью для создания непревзойденных боевых характеристик. Из-за ограниченного количества самолетов, которые может вместить авианосец, «Хорнет» был разработан как многоцелевой самолет, способный выполнять задачи как "воздух-воздух", так и "воздух-земля". B - это двухместный штурмовик."
 #USA_cv_jet_CAS_equipment_9:0 "A heavily upgraded A-6, sharing the Pratt & Whitney J52 turbojets with the F/A-18C Hornet. Upgrades also include avionics improvements, MFDs, the AN/APQ-173 RADAR and ability to equip the AIM-120 AMRAAM AA missile."
 #USA_cv_jet_CAS_equipment_9_short:0 "A-6F Intruder II"
 #USA_cv_jet_CAS_equipment_9_desc:0 "Grumman A-6F Intruder II"
 #USA_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18C Hornet"
 #USA_cv_jet_CAS_equipment_10_short:0 "F/A-18C Hornet"
 #USA_cv_jet_CAS_equipment_10_desc:0 "The single-seat C variant of the 'Hornet' came as a result of a block upgrade in 1987. This upgrade came in the form of a new synthetic aperture ground mapping radar system for tracking targets in low-visibility conditions. New avionics, such as a thermal navigation pod, forward looking infrared array (FLIR), night-vision goggles and two full-color multi-function displays (MFD) allow the aircraft to perform superbly in nighttime attacks. It also was capable of carrying newer types of ordinance, including the AMRAAM Medium-Range Air-to-Air Missile, and Precision Guided Bombs."

 USA_cv_jet_multirole_equipment_1:0 "Макдоннелл-Дуглас F2H «Бэнши»"
 USA_cv_jet_multirole_equipment_1_short:0 "F2H «Бэнши»"
 USA_cv_jet_multirole_equipment_1_desc:0 "Макдоннелл F2H «Бэнши» - одноместный истребитель авианосного базирования, состоявший на вооружении ВМС США и Корпуса морской пехоты США с 1948 по 1961 год. Это был один из основных американских истребителей, использовавшихся во время Корейской войны, и единственный истребитель с реактивным двигателем, принятый на вооружение Королевским канадским флотом."
 USA_cv_jet_multirole_equipment_2:0 "Грумман F9F «Пантера»"
 USA_cv_jet_multirole_equipment_2_short:0 "F9F «Пантера»"
 USA_cv_jet_multirole_equipment_2_desc:0 "F9F был первоначально задуман как прямокрылый реактивный самолет для авианосцев, представленный в 1949 году. Один из первых реактивных самолетов ВМС США, способных нести авианосцы, он был основным штурмовиком ВМС США и КМП США во время Корейской войны, совершив 78 000 вылетов, и ему приписывают первое воздушное убийство истребителя ВМС США во время войны. Его прочная рама позволяла ему выдерживать наземные штурмовые операции даже перед лицом огня АА. F9F (позднее переименованный в F-9) также служил в "Голубых Ангелах", став первым реактивным самолетом, использовавшимся командой. Следуя традиции компании Grumman называть самолеты в честь больших кошек, самолет стал известен как «Пантера»."
 USA_cv_jet_multirole_equipment_3:0 "Макдоннелл F3H «Демон»"
 USA_cv_jet_multirole_equipment_3_short:0 "F3H «Демон»"
 USA_cv_jet_multirole_equipment_3_desc:0 "F3H был дозвуковым истребителем со стреловидным крылом, который на протяжении всей своей карьеры испытывал множество проблем. Первоначально предназначавшийся для двигателя J40, проблемы с конструкцией прототипа привели к отказу от него, и F3H получил в качестве замены двигатель меньшей мощности. Несмотря на свои проблемы, «Демон» был способным всепогодным перехватчиком с хорошим для своего времени обзором. Первоначально он был вооружен только четырьмя 20-мм пушками, но более поздний вариант был оснащен первыми моделями того, что стало инфракрасной ракетой AIM-9 «Сайдуайндер» В соответствии с принятыми в компании Макдоннелл правилами присвоения названий, его официальное прозвище - «Демон»."
 USA_cv_jet_multirole_equipment_4:0 "Воут F-8 «Крусейдер»"
 USA_cv_jet_multirole_equipment_4_short:0 "F-8 «Крусейдер»"
 USA_cv_jet_multirole_equipment_4_desc:0 "Одномоторный сверхзвуковой истребитель F-8 (первоначально известный как F8U) был разработан для ближней противовоздушной обороны флота. Самолет несет большую полезную нагрузку боеприпасами, чем F11F «Тайгер» или F7U «Абордажная Сабля» (последний пришел ему на смену), а также способен функционировать в качестве быстрой платформы для фоторазведки. Прозванный «Крусейдер», он был одним из истребителей воздушного превосходства, сохранивших внутреннее пушечное вооружение ко времени войны во Вьетнаме, что дало ему еще одно прозвище - "Последний Стрелок"."
 USA_cv_jet_multirole_equipment_5:0 "Макдоннелл-Дуглас F-4B «Фантом» II"
 USA_cv_jet_multirole_equipment_5_short:0 "F-4B «Фантом» II"
 USA_cv_jet_multirole_equipment_5_desc:0 "Двухместный всепогодный истребитель авианосного базирования и штурмовик для ВМС и Корпуса морской пехоты США. Двигатели J79-GE-8A или -8B с тягой на форсаже 16 950 фунтов (75,4 кН) каждый. Называемый «Фантом» II (и названный в честь FH «Фантом», F-4 «Фантом» II был первым самолетом, совместно используемым тремя видами вооруженных сил США - ВМС, морской пехотой и ВВС."
 USA_cv_jet_multirole_equipment_6:0 "Макдоннелл-Дуглас F-4J «Фантом» II"
 USA_cv_jet_multirole_equipment_6_short:0 "F-4J «Фантом» II"
 USA_cv_jet_multirole_equipment_6_desc:0 "Улучшенная версия F-4B для ВМС и Корпуса морской пехоты США, с акцентом на улучшение боевых возможностей класса "воздух-воздух", которые включают; двигатели J79-GE-10 с 17 844 фунт-фут (79. 374 кН) тяги на форсаже каждый, импульсно-доплеровский радар AN/APG-59 в сочетании с системой управления огнем AN/AWG-10 для возможности сбивания с земли, увеличенные основные колеса шасси, что привело к выпуклости крыла, аналогичной F-4C, реечное хвостовое оперение, элероны отклоняются на 16,5° при выпуске шасси и закрылков для снижения посадочной скорости, катапультные кресла с нулевым вылетом, расширенные возможности для атаки с земли, отсутствие датчика IRST в носовой части."
 USA_cv_jet_multirole_equipment_7:0 "Макдоннелл-Дуглас F-4N «Фантом» II"
 USA_cv_jet_multirole_equipment_7_short:0 "F-4N «Фантом» II"
 USA_cv_jet_multirole_equipment_7_desc:0 "F-4B, модернизированный по проекту Bee Line, те же аэродинамические улучшения, что и у F-4J, бездымные двигатели и усиленный планер."
 USA_cv_jet_multirole_equipment_8:0 "Грумман F-14B «Томкэт»"
 USA_cv_jet_multirole_equipment_8_short:0 "F-14A «Томкэт»"
 USA_cv_jet_multirole_equipment_8_desc:0 "Большой истребитель авианосного базирования, призванный заменить F-4 в качестве основного средства ПВО флота. Он имеет изменяемые крылья, которые могут автоматически менять угол наклона даже во время полета, что обеспечивает как высокую скорость в скоростных диапазонах, так и высокую маневренность в низкоскоростных диапазонах. Он также оснащен ракетами большой дальности, которые могут сбивать приближающихся противников на значительном расстоянии. Известен как «Томкэт»."
 USA_cv_jet_multirole_equipment_9:0 "Грумман F-14B «Томкэт»"
 USA_cv_jet_multirole_equipment_9_short:0 "F-14B «Томкэт»"
 USA_cv_jet_multirole_equipment_9_desc:0 "Вариант корабельного истребителя F-14A, созданный путем серьезной модернизации, включающей замену двигателя. Основные улучшения включают устранение проблем с двигателем, увеличение тяги и пересмотр авионики. В 90-х годах были проведены дальнейшие модификации, призванные продлить срок службы самолета и обеспечить дополнительные возможности для нанесения ударов "воздух-поверхность". Этот модифицированный F-14 также используется для высокоскоростных тактических атак на большие расстояния. Он известен как «Томкэт», то же самое, что и тип А. Когда F-14 модифицирован для бомбометания, он неофициально также известен как «Бомбкэт»."
 USA_cv_jet_multirole_equipment_10:0 "Макдоннелл-Дуглас F/A-18A «Хорнет»"
 USA_cv_jet_multirole_equipment_10_short:0 "F/A-18A «Хорнет»"
 USA_cv_jet_multirole_equipment_10_desc:0 "Разработанный на основе прототипа YF-17 Cobra ВВС США, "Хорнет" является представителем нового поколения универсальных самолетов, которые сочетают в себе новые достижения компьютерных технологий с высокой скоростью и маневренностью для создания непревзойденных боевых характеристик. Из-за ограниченного количества самолетов, которые может вместить авианосец, "Hornet" был разработан как многоцелевой самолет, способный выполнять задачи как "воздух-воздух", так и "воздух-земля"."
 #USA_cv_jet_multirole_equipment_9:0 "Grumman F-14D Super Tomcat"
 #USA_cv_jet_multirole_equipment_9_short:0 "F-14D Super Tomcat"
 #USA_cv_jet_multirole_equipment_9_desc:0 "A revision of the F-14, which has come to characterize carrier-based fighters, known as the 'Super Tomcat'. While maintaining the stable maneuverability offered by the digitally controlled variable sweep wing and the capability to neutralize multiple incoming targets at long range, it is also outfitted with a new onboard radar and engine."
 #USA_cv_jet_multirole_equipment_10:0 "Boeing F/A-18E Super Hornet"
 #USA_cv_jet_multirole_equipment_10_short:0 "F/A-18E Super Hornet"
 #USA_cv_jet_multirole_equipment_10_desc:0 "Whether it's air-to-air or air-to-ground, this carrier-based fighter is capable of handling a wide variety of missions. An easy-to-handle aircraft that boasts stable maneuverability at any speed. Equipped with long-range attack weapons, it's well-suited for preemptive attacks. Nicknamed the 'Super Hornet'."
  
 USA_stealth_tactical_bomber_equipment_1:0 "Локхид F-117A «Ночной Ястреб»"
 USA_stealth_tactical_bomber_equipment_1_short:0 "F-117A «Ночной Ястреб»"
 USA_stealth_tactical_bomber_equipment_1_desc:0 "Первый в истории стелс-штурмовик, специализированный для секретных бомбардировок. Поскольку конструкция полностью сфокусирована на стелс-возможностях, самолету не хватает скорости и маневренности. Однако, с другой стороны, то, что он остается вне поля зрения вражеских радаров, позволяет ему использовать управляемые бомбы для нанесения точных ударов. Он имеет уникальную форму, состоящую из плоских поверхностей и специальной окраски для отражения и поглощения радиолокационных волн. Известный как «Ночной Ястреб», он получил признание во время войны в Персидском заливе в 1991 году, совершив более 1200 вылетов без единого сбитого самолета."
 USA_stealth_tactical_bomber_equipment__2:0 "Локхид Мартин FB-22 «Страйк Раптор»"
 USA_stealth_tactical_bomber_equipment_2_short:0 "FB-22 «Страйк Раптор»"
 USA_stealth_tactical_bomber_equipment_2_desc:0 "Локхид Мартин FB-22 был предложенным стелс-бомбардировщиком, который должен был поступить на вооружение ВВС США. Его конструкция была заимствована у F-22 «Раптор». FB-22 был отменен после Четырехгодичного оборонного обзора 2006 года. Дальность полета была увеличена почти в три раза - с 600 миль (970 км) до более чем 1 600 миль (2 600 км), которая могла быть увеличена за счет внешних топливных баков. Это перевело самолет в категорию регионального бомбардировщика, сравнимого с F-111."

 USA_stealth_strategic_bomber_equipment_1:0 "Нортроп Грумман B-2 «Дух»"
 USA_stealth_strategic_bomber_equipment_1_short:0 "B-2 «Дух»"
 USA_stealth_strategic_bomber_equipment_1_desc:0 "Невидимый стратегический бомбардировщик, способный проникать на территорию противника, не будучи обнаруженным радарами, и проводить крупномасштабные бомбардировочные рейды. Это самолет с летающим крылом, у него нет хвоста, что затрудняет его обнаружение радарами. Его маневренные характеристики были заменены на повышенную скрытность, поэтому он может более безопасно проникать в сети радаров. Количество произведенных самолетов крайне мало, поэтому каждому отдельному самолету присваивается уникальное имя, состоящее из прозвища «Дух» и названия географической территории."
 USA_stealth_strategic_bomber_equipment_2:0 "Нортроп Грумман B-21 «Рейдер»"
 USA_stealth_strategic_bomber_equipment_2_short:0 "B-21 «Рейдер»"
 USA_stealth_strategic_bomber_equipment_2_desc:0 "Разработанный на основе опыта, полученного от B-2 «Дух», B-21, как часть программы дальнего ударного бомбардировщика (ДУБ), должен быть очень дальним, стелс-стратегическим бомбардировщиком для ВВС США, способным доставлять обычное или термоядерное оружие. Как и его предшественник, «Рейдер» представляет собой бомбардировщик с летающими крыльями, что повышает эффективность стелса для более безопасного проникновения в сети радаров."

 USA_stealth_fighter_equipment_1:0 "Локхид Мартин F-22A «Раптор»"
 USA_stealth_fighter_equipment_1_short:0 "F-22A «Раптор»"
 USA_stealth_fighter_equipment_1_desc:0 "Этот превосходный стелс-истребитель является гордостью вооруженных сил США. Помимо летных характеристик, он обладает первоклассными разгонными характеристиками и двумерным отклоняющим соплом, которое также придает ему выдающуюся маневренность. Его способность к упреждающему удару, называемая "первый взгляд, первый выстрел, первое убийство", подходит для самолета с именем «Раптор», хозяина неба."
 USA_cv_stealth_fighter_equipment_1:0 "Локхид Мартин F-22N «Си Раптор»"
 USA_cv_stealth_fighter_equipment_1_short:0 "F-22N «Си Раптор»"
 USA_cv_stealth_fighter_equipment_1_desc:0 "Названный «Си Раптор», F-22N является вариантом «Раптора», базирующимся на авианосце, и обладает теми же возможностями, что и сухопутный F-22A. Разработанный для ВМС США, F-22N имеет возможность короткого взлета, что позволяет использовать его для операций на авианосце. Высокоэффективные ракеты позволяют ему наносить удары из-за пределов досягаемости самолетов противника. F-22N идеально приспособлен для выполнения боевых задач в воздухе и противовоздушной обороны флота, он является мощным истребителем упреждающего действия."
 
 USA_jump_jet_equipment_1:0 "Хокер Сидли AV-8A «Харриер»"
 USA_jump_jet_equipment_1_short:0 "AV-8A «Харриер»"
 USA_jump_jet_equipment_1_desc:0 "Этот штурмовик был разработан, чтобы сделать ВВП (вертикальный взлет и посадка) реальностью. Он имеет уникальную конструкцию с высоко расположенными крыльями и четырьмя вращающимися соплами. Это позволяет ему действовать в ограниченных пространствах, таких как легкие авианосцы и небольшие аэродромы. Самолет широко известен как «Харриер». Разработанный в Великобритании AV-8A известен в Великобритании как Harrier Mk. 50 и функционировал аналогично самолетам «Харриер» GR.1 Королевских ВВС."
 USA_jump_jet_equipment_2:0 "Хокер Сидли AV-8C «Харриер»"
 USA_jump_jet_equipment_2_short:0 "AV-8C «Харриер»"
 USA_jump_jet_equipment_2_desc:0 "Вариант 'C' является модернизированной версией AV-8A, и функционирует с системами, аналогичными «Харриер» GR.3, с новым оборудованием ECM и инерциальной навигационной системой."
 USA_jump_jet_equipment_3:0 "Макдоннелл-Дуглас AV-8B «Харриер» II"
 USA_jump_jet_equipment_3_short:0 "AV-8B «Харриер» II"
 USA_jump_jet_equipment_3_desc:0 "«Харриер» II - совместный англо-американский проект, разработанный компанией McDonnell Douglas совместно с British Aerospace. Находясь на службе в Корпусе морской пехоты США с 1985 года, «Харриер» II считался важным инструментом во многих конфликтах Америки последнего времени."
 USA_jump_jet_equipment_4:0 "Макдоннелл-Дуглас AV-8B «Харриер» II Плюс"
 USA_jump_jet_equipment_4_short:0 "AV-8B «Харриер» II Плюс"
 USA_jump_jet_equipment_4_desc:0 "Являясь модернизацией AV-8B в середине срока службы, AV-8B Плюс оснащен модернизированным двигателем, радарной системой и инфракрасной камерой, что делает его очень успешным в качестве ночного штурмовика."

 USA_recon_equipment_0:0 "Stinson L-5 Сентинел"
 USA_recon_equipment_0_short:0 "L-5 Сентинел"
 USA_recon_equipment_0_desc:0 "Stinson L-5 Сентинел был связным самолетом времен Второй мировой войны, который использовался всеми видами вооруженных сил США и Королевскими ВВС Великобритании. Он производился компанией Stinson Aircraft Company. Наряду с Stinson L-1 Vigilant, L-5 был единственным американским связным самолетом времен Второй мировой войны, который был создан специально для военных целей и не имел гражданского аналога. Все остальные военные связные самолеты, принятые на вооружение во время Второй мировой войны, были слегка модифицированными гражданскими моделями "off-the-shelf"."
 USA_jet_recon_equipment_0:0 "Норт Американ RF-86 «Сейбр»"
 USA_jet_recon_equipment_0_short:0 "RF-86 «Сейбр»"
 USA_jet_recon_equipment_0_desc:0 "Конверсии F-86 с тремя камерами для разведки"
 USA_jet_recon_equipment_1:0 "Макдоннелл-Дуглас RF-4C «Фантом» II"
 USA_jet_recon_equipment_1_short:0 "RF-4C «Фантом» II"
 USA_jet_recon_equipment_1_desc:0 "Всепогодный тактический разведывательный вариант для ВВС США, радар AN/APQ-99 (позже AN/APQ-172). Оснащен аналогично RF-4B, но с более широким выбором вариантов установки камер, включая центральную капсулу для гигантской камеры HIAC-1 LOROP (Long Range Oblique Photography), способной делать снимки высокого разрешения объектов на расстоянии 100 миль (160 км). Многие самолеты были переоборудованы с более просторным выпуклым обтекаемым носом."
 USA_jet_recon_equipment_2:0 "Локхид Мартин F-16C Блок 30 Recce"
 USA_jet_recon_equipment_2_short:0 "F-16C Блок 30 Recce"
 USA_jet_recon_equipment_2_desc:0 "Первым разведывательным вариантом был F-16D ВВС США, экспериментально сконфигурированный в 1986 году с центральной многосенсорной капсулой типа "ванна". В 1988 году ВВС США решили заменить устаревший парк RF-4C Phantom на F-16C Block 30, оснащенные центральным блоком Advanced Tactical Airborne Reconnaissance System (ATARS) компании Control Data Corporation, который мог нести различные датчики. Однако проблемы с программой ATARS привели к тому, что в июне 1993 года ВВС США отказались от нее. В середине 1990-х годов ВВС США экспериментировали с рядом конструкций центральных разведывательных капсул, начиная с прототипа - электрооптической капсулы 1 (EO-1). Первый полет F-16 с прототипом TARS состоялся 26 августа 1995 года, а 27 сентября 1996 года ВВС США разместили первый серийный заказ на эти капсулы." 
 
 USA_transport_plane_equipment_1:0 "Дуглас C-47 «Скайтрэйн»"
 USA_transport_plane_equipment_1_short:0 "C-47 «Скайтрэйн»"
 USA_transport_plane_equipment_1_desc:0 "Разработанный на основе авиалайнера Дуглас DC-3, когда он впервые полетел в 1941 году, C-47 был квинтэссенцией транспортного самолета, используемого союзниками. Во время Второй мировой войны вооруженные силы многих стран использовали C-47 и модифицированные DC-3 для перевозки войск, грузов и раненых. Для войны было построено более 10 000 единиц, как C-47, так и военно-морской вариант R4D (позже C-117), и многие «Скайтрэйны» использовались не только для перевозки войск и грузов, но и в поисково-спасательных операциях, а во время войны во Вьетнаме - в качестве первых артиллерийских кораблей."
 USA_transport_plane_equipment_2:0 "Дуглас C-54 «Скаймастер»"
 USA_transport_plane_equipment_2_short:0 "C-54 «Скаймастер»"
 USA_transport_plane_equipment_2_desc:0 "Как и C-47 до него, C-54 был разработан на основе авиалайнера Дуглас, на этот раз DC-4. Появившийся в 1942 году, C-54 выполнял роль грузового транспорта, а также перевозил важных VIP-персон, став одним из первых самолетов, перевозивших президента США (но не первым самолетом, получившим обозначение Air Force One). Однако слава «Скаймастер» пришла к нему благодаря тому, что именно этот тип использовался для перевозки угля и продовольствия в Западный Берлин во время знаменитого Берлинского воздушного перехода. Военно-морские варианты были известны как R5D."
 USA_transport_plane_equipment_3:0 "Дуглас C-124 «Глоубмастер» II"
 USA_transport_plane_equipment_3_short:0 "C-124 «Глоубмастер» II"
 USA_transport_plane_equipment_3_desc:0 "C-124 был основным тяжелым транспортным средством Военно-воздушной транспортной службы (ВВТС) ВВС США в 1950-х и начале 1960-х годов, пока на вооружение не поступил Локхид C-141 «Старлифтер». До 1974 года он служил в подразделениях резерва ВВС и Национальной гвардии ВВС, которые были сформированы ВВТС, а затем Военным воздушно-транспортным командованием (ВТК)."
 USA_transport_plane_equipment_4:0 "Локхид C-130 «Геркулес»"
 USA_transport_plane_equipment_4_short:0 "C-130 «Геркулес»"
 USA_transport_plane_equipment_4_desc:0 "Разработанный в 1954 году, C-130 - это транспорт, способный использовать неподготовленные взлетно-посадочные полосы для взлета и посадки, что делает его удобной рамой для перевозки войск и грузов, а также для медицинской эвакуации. Но что делает этот самолет достойным своего прозвища «Геркулес», так это то, что было разработано несколько подвариантов для различных функций, начиная от Gunship (AC-130 Спуки & Спектр), управления беспилотниками (DC-130), постановки помех и PSYOPS (EC-130 Compass Call) и заканчивая разведкой погоды (WC-130). Поистине универсальная машина, заслужившая свое прозвище."
 USA_transport_plane_equipment_5:0 "Локхид C-141 «Старлифтер»"
 USA_transport_plane_equipment_5_short:0 "C-141 «Старлифтер»"
 USA_transport_plane_equipment_5_desc:0 "Разработанный для замены C-124 Globemaster II и C-133 Cargomaster, C-141 поступил на вооружение в 1965 году в Военно-воздушную транспортную службу (ВВТС), ее преемницу - Военное командование воздушных перевозок (КВП) и, наконец, Командование воздушной мобильности (КВМ) ВВС США. За более чем 40 лет службы он принимал участие во многих операциях США по всему миру, служил в зонах боевых действий как во Вьетнаме, так и в Израиле."
 USA_transport_plane_equipment_6:0 "Макдоннелл-Дуглас C-5A «Гэлэкси»"
 USA_transport_plane_equipment_6_short:0 "C-5A «Гэлэкси»"
 USA_transport_plane_equipment_6_desc:0 "Локхид C-5 «Гэлэкси» - это большой военно-транспортный самолет, первоначально разработанный и построенный компанией Lockheed, а в настоящее время обслуживается и модернизируется ее преемником, компанией Lockheed Martin. Он предоставляет ВВС США (USAF) тяжелый стратегический воздушный транспорт межконтинентальной дальности, способный перевозить габаритные и негабаритные грузы, включая все сертифицированные воздушные грузы. «Гэлэкси» имеет много сходств с более компактным Локхид C-141 Starlifter и более поздним Боинг C-17 «Глоубмастер» III. C-5 является одним из самых больших военных самолетов в мире."
 USA_transport_plane_equipment_7:0 "Макдоннелл-Дуглас C-5B «Гэлэкси»"
 USA_transport_plane_equipment_7_short:0 "C-5B «Гэлэкси»"
 USA_transport_plane_equipment_7_desc:0 "C-5B - это улучшенная версия C-5A. Он вобрал в себя все модификации и усовершенствования, внесенные в C-5A, с улучшенными крыльями, упрощенным шасси, модернизированными турбовентиляторными двигателями TF-39-GE-1C и обновленной авионикой."
 USA_transport_plane_equipment_8:0 "Боинг C-17A «Глоубмастер» III"
 USA_transport_plane_equipment_8_short:0 "C-17A «Глоубмастер» III"
 USA_transport_plane_equipment_8_desc:0 "Представленный в 1995 году, C-17 стал третьим самолетом в своем семействе, носящим имя «Глоубмастер» Выполняя функции как стратегического, так и тактического воздушного транспорта, С-17 заменил С-141 и освободил многие функции, выполняемые С-5 (делегировав этому типу роль внеразмерного грузового транспорта). Находясь на вооружении 8 стран, «Глоубмастер» III будет продолжать служить нуждам американских вооруженных сил еще долгие годы."
 USA_transport_plane_equipment_9:0 "Боинг C-17A «Глоубмастер» III Блок 21"
 USA_transport_plane_equipment_9_short:0 "C-17A Блок 21"
 USA_transport_plane_equipment_9_desc:0 "Это обновление программного/аппаратного обеспечения представляло собой значительное улучшение усовершенствованной бортовой системы генерации инертного газа (БСГИГ II), нового метеорологического радара, улучшенной системы стоек стабилизатора и другой авионики."
 USA_transport_plane_equipment_10:0 "Боинг C-17A «Глоубмастер» III"
 USA_transport_plane_equipment_10_short:0 "C-17A Блок 21"
 USA_transport_plane_equipment_10_desc:0 "Это обновление программного/аппаратного обеспечения представляло собой значительное улучшение усовершенствованной бортовой системы генерации инертного газа (БСГИГ II), нового метеорологического радара, улучшенной системы стоек стабилизатора и другой авионики."

