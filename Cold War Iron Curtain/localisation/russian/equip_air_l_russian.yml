 FRA_jet_strat_bomber_equipment_3:0 "Сюд Авиасьон «Супер Вотур»"
 FRA_jet_strat_bomber_equipment_3_short:0 "«Супер Вотур»"
 FRA_jet_strat_bomber_equipment_3_desc:0 "В то время как требование к новому бомбардировщику в конечном итоге привело к выбору, разработке и производству бомбардировщика Дассо «Мираж» IV, компания Сюд Авиасьон также решила ответить на это требование, подготовив свое собственное предложение по производству предполагаемого «Супер Вотур». По мнению авиационного автора Билла Ганстона, не построенный "растянутый" вариант «Супер Вотур» должен был обладать увеличенным боевым радиусом в 1700 миль, а также способностью развивать скорость не менее 0,9 Маха."

