 cv_jet_multirole_equipment_3_short:0 "Палубн. Многоцелевой 2 Пок."
 cv_jet_multirole_equipment_3_desc:0 "Корейская война 1950-1953 гг. заставила пересмотреть взгляды. Оружие оказалось непригодным на таких высоких скоростях, а необходимость в многоцелевых возможностях поддержки на поле боя была открыта заново. Появившиеся после войны типы перехватчиков использовали форсажные двигатели для достижения скорости 2 Маха, а радары и инфракрасные самонаводящиеся ракеты значительно повысили их точность и огневую мощь."
 cv_jet_multirole_equipment_4:0 "Палубный Многоцелевой Истребитель 2+ Поколения"
 cv_jet_multirole_equipment_4_short:0 "Палубн. Многоцелевой 2+ Пок."
 cv_jet_multirole_equipment_4_desc:0 "Дальнейшее расширение возможностей потребуется для военно-морских самолетов второго поколения, требующих более многоцелевого подхода. Дополнительные жесткие точки, заострение крыльев и первое внедрение конструкций дельтавидного крыла." 
 cv_jet_multirole_equipment_5:0 "Палубный Многоцелевой Истребитель 3 Поколения"
 cv_jet_multirole_equipment_5_short:0 "Палубн. Многоцелевой 3 Пок."
 cv_jet_multirole_equipment_5_desc:0 "Следующее поколение перехватчиков большой дальности. Предполагалось, что они будут нести широкий спектр вооружения и других боеприпасов, таких как ракеты класса "воздух-воздух", и возможность прицеливания за пределами визуальной дальности. Их вспомогательная авионика включала импульсно-доплеровский радар, системы прицеливания вне видимости и предупреждения о пересечении местности."
 cv_jet_multirole_equipment_6:0 "Палубный Многоцелевой Истребитель 3+ Поколения"
 cv_jet_multirole_equipment_6_short:0 "Палубн. Многоцелевой 3+ Пок."
 cv_jet_multirole_equipment_6_desc:0 "Появление более экономичных турбовентиляторных двигателей привело к увеличению дальности полета и времени вылета, в то время как увеличение тяги могло лишь частично обеспечить лучшие характеристики и маневренность в диапазоне скоростей. В попытке примирить эти противоположности некоторые конструкторы прибегли к изменяемой геометрии или векторной тяге."
 cv_jet_multirole_equipment_7:0 "Палубный Многоцелевой Истребитель 3++ Поколения"
 cv_jet_multirole_equipment_7_short:0 "Палубн. Многоцелевой 3++ Пок."
 cv_jet_multirole_equipment_7_desc:0 "Дальнейшее расширение крыльев с изменяемой геометрией, дальнейшее увеличение дальности полета и совершенствование радаров и системы управления огнем, чтобы идти в ногу с быстрым технологическим прогрессом в направлении четвертого поколения военно-морских истребителей."
 cv_jet_multirole_equipment_8:0 "Палубный Многоцелевой Истребитель 4 Поколения"
 cv_jet_multirole_equipment_8_short:0 "Палубн. Многоцелевой 4 Пок."
 cv_jet_multirole_equipment_8_desc:0 "После неоднозначного успеха предыдущего поколения перехватчиков разрабатывались передовые технологии, такие как беспилотные летательные аппараты, композитные материалы, соотношение тяги к массе больше единицы, гиперманевренность, передовая цифровая авионика и датчики, такие как синтетический радар и инфракрасный поиск и слежение, а также стелс."
 cv_jet_multirole_equipment_9:0 "Палубный Многоцелевой Истребитель 4+ Поколения"
 cv_jet_multirole_equipment_9_short:0 "Палубн. Многоцелевой 4+ Пок."
 cv_jet_multirole_equipment_9_desc:0 "Поскольку предыдущее поколение появилось по частям, конструкторы вернулись к истребителю в первую очередь, но с ролями поддержки, намеченными в качестве ожидаемых разработок. Еще более экстремальная маневренность с, соответственно, усиленными выхлопными соплами для вифинга (векторизации в полете вперед) и управления маневрированием на больших углах атаки."
 cv_jet_multirole_equipment_10:0 "Палубный Многоцелевой Истребитель 4++ Поколения"
 cv_jet_multirole_equipment_10_short:0 "Палубн. Многоцелевой 4++ Пок."
 cv_jet_multirole_equipment_10_desc:0 "Более поздние варианты этих и других самолетов постепенно улучшали свои характерные технологии и все больше внедряли некоторые аспекты технологий друг друга, а также перенимали некоторые новые технологии пятого поколения, такие как цифровая связь высокой емкости. Эти истребители максимально приближены к полностью цифровым и передовым самолетам без передовых стелс-характеристик."
 
 cv_mr_stealth_fighter_equipment_1:0 "Палубный Многоцелевой Истребитель 5 Поколения"
 cv_mr_stealth_fighter_equipment_1_short:0 "Палубн. Многоцелевой 5 Пок."
 cv_mr_stealth_fighter_equipment_1__desc:0 "Появившееся в первые десятилетия 21-го века поколение передовых самолетов авианосного базирования стало известно как пятое поколение. Определяющие характеристики перехватчиков пятого поколения не являются общепризнанными, и не каждый тип пятого поколения обязательно обладает всеми этими характеристиками. Некоторые поколения включают в себя более пяти, ведущих к появлению нового поколения."


 #CV CAS
 cv_jet_CAS_equipment_1:0 "Палубный Реактивный Штурмовик I"
 cv_jet_CAS_equipment_1_short:0 "Палубн. Реакт. Штурм. I"
 cv_jet_CAS_equipment_1_desc:0 "Морской легкий ударный самолет с боеприпасами класса "воздух-земля" с конкретной задачей ближней воздушной поддержки наземных войск и возможностями "воздух-корабль"." 
 cv_jet_CAS_equipment_2:0 "Палубный Реактивный Штурмовик II"
 cv_jet_CAS_equipment_2_short:0 "Палубн. Реакт. Штурм. II"
 cv_jet_CAS_equipment_2_desc:0 "Обновленный морской легкий ударный самолет с боеприпасами класса "воздух-земля" с конкретной задачей ближней воздушной поддержки наземных войск и возможностями противовоздушной обороны кораблей." 
 cv_jet_CAS_equipment_3:0 "Палубный Реактивный Штурмовик III"
 cv_jet_CAS_equipment_3_short:0 "Палубн. Реакт. Штурм. III"
 cv_jet_CAS_equipment_3_desc:0 "Второе поколение военно-морских самолетов ближней авиационной поддержки со специальными возможностями "воздух-земля" и "воздух-корабль"." 
 cv_jet_CAS_equipment_4:0 "Палубный Реактивный Штурмовик IV"
 cv_jet_CAS_equipment_4_short:0 "Палубн. Реакт. Штурм. IV"
 cv_jet_CAS_equipment_4_desc:0 "Второе поколение плюс военно-морской самолет ближней авиационной поддержки с выделенными возможностями "воздух-земля" и "воздух-корабль" и обновленной летной механикой." 
 cv_jet_CAS_equipment_5:0 "Палубный Реактивный Штурмовик V"
 cv_jet_CAS_equipment_5_short:0 "Палубн. Реакт. Штурм. V"
 cv_jet_CAS_equipment_5_desc:0 "Самолет ближней авиационной поддержки третьего поколения с расширенными возможностями "воздух-земля" и "воздух-корабль", базовыми навигационными и ударными системами." 
 cv_jet_CAS_equipment_6:0 "Палубный Реактивный Штурмовик VI"
 cv_jet_CAS_equipment_6_short:0 "Палубн. Реакт. Штурм. VI"
 cv_jet_CAS_equipment_6_desc:0 "Третье поколение военно-морских самолетов ближней авиационной поддержки с расширенными возможностями "воздух-земля" и "воздух-корабль", обновленной базой данных, системами навигации и захвата целей." 
 cv_jet_CAS_equipment_7:0 "Палубный Реактивный Штурмовик VII"
 cv_jet_CAS_equipment_7_short:0 "Палубн. Реакт. Штурм. VII"
 cv_jet_CAS_equipment_7_desc:0 "Третье поколение плюс военно-морской самолет ближней авиационной поддержки с расширенными возможностями "воздух-земля" и "воздух-корабль", системами навигации и захвата целей, включая базовые ФЛИР и лазерные целеуказатели." 
 cv_jet_CAS_equipment_8:0 "Палубный Реактивный Штурмовик VIII"
 cv_jet_CAS_equipment_8_short:0 "Палубн. Реакт. Штурм. VIII"
 cv_jet_CAS_equipment_8_desc:0 "Четвертое поколение военно-морских самолетов ближней авиационной поддержки с расширенными возможностями, включая лазерные целеуказатели, системы определения местоположения GPS и Электродистанционную систему управления." 
 cv_jet_CAS_equipment_9:0 "Палубный Реактивный Штурмовик IX"
 cv_jet_CAS_equipment_9_short:0 "Палубн. Реакт. Штурм. IX"
 cv_jet_CAS_equipment_9_desc:0 "Четвертое поколение плюс самолет ближней авиационной поддержки с расширенным вооружением и увеличенными возможностями, включая лазерные целеуказатели, системы GPS определения местоположения Электродистанционное управление и усовершенствованное ФЛИР и оборудование для ночного полета." 
 cv_jet_CAS_equipment_10:0 "Палубный Реактивный Штурмовик X"
 cv_jet_CAS_equipment_10_short:0 "Палубн. Реакт. Штурм. X"
 cv_jet_CAS_equipment_10_desc:0 "Морской самолет ближней авиационной поддержки четвертого поколения плюс плюс с еще более расширенным вооружением и увеличенными возможностями, включая лазерные целеуказатели, системы определения местоположения GPS, Электродистанционную систему управления и базовый стелс."

 #ВВП Jet
 jump_jet_equipment_1:0 "Истребитель ВВП I"
 jump_jet_equipment_1_short:0 "Истребитель ВВП I"
 jump_jet_equipment_1_desc:0 "Представляя новую форму самолета, самолет вертикального взлета и посадки (ВВП) - это самолет, который может зависать, взлетать и садиться вертикально, не опираясь на взлетно-посадочную полосу."
 jump_jet_equipment_2:0 "Истребитель ВВП II"
 jump_jet_equipment_2_short:0 "Истребитель ВВП II"
 jump_jet_equipment_2_desc:0 "Обновленный самолет вертикального взлета и посадки с более стандартизированными деталями, способный стать основой морской авиации и даже наземной поддержки."
 jump_jet_equipment_3:0 "Истребитель ВВП III"
 jump_jet_equipment_3_short:0 "Истребитель ВВП III"
 jump_jet_equipment_3_desc:0 "Самолет вертикального взлета и посадки второго поколения. Летает с большей боевой нагрузкой и большим запасом топлива."
 jump_jet_equipment_4:0 "Истребитель ВВП IV"
 jump_jet_equipment_4_short:0 "Истребитель ВВП IV"
 jump_jet_equipment_4_desc:0 "Второе поколение плюс самолеты вертикального взлета и посадки с более совершенной авионикой."
  
 jump_stealth_equipment_1:0 "Реактивный Стелс ВВП"
 jump_stealth_equipment_1_short:0 "Реакт. Стелс ВВП"
 jump_stealth_equipment_1_desc:0 "Самолет вертикального взлета и посадки, оснащенный стелс-компонентами, уменьшающими его радиолокационное сечение, и способный оснащаться более тяжелым вооружением благодаря более совершенной конструкции двигателя."

 ###HEAVY AIRCRAFT###

 #Naval Bomber
 nav_bomber_equipment_4:0 "Морской Бомбардировщик IV"
 nav_bomber_equipment_4_short:0 "Морск. Бомбардировщик IV"
 nav_bomber_equipment_4_desc:0 "Морской Патрульный бомбардировщик после Второй мировой войны, оснащенный оборудованием для поиска и поражения торпедами подводных лодок и кораблей." 
 nav_bomber_equipment_5:0 "Морской Бомбардировщик V"
 nav_bomber_equipment_5_short:0 "Морск. Бомбардировщик V"
 nav_bomber_equipment_5_desc:0 "Усовершенствованный морской патрульный бомбардировщик, оснащенный для поиска и поражения торпедами подводных лодок и кораблей."
 nav_bomber_equipment_6:0 "Морской Бомбардировщик VI"
 nav_bomber_equipment_6_short:0 "Морск. Бомбардировщик VI"
 nav_bomber_equipment_6_desc:0 "Усовершенствованный морской патрульный бомбардировщик с превосходной гидролокационной и радиолокационной системами, оснащенный для поиска и поражения подводных лодок и кораблей торпедами и ракетами класса "воздух-земля"."
 nav_bomber_equipment_7:0 "Морской Бомбардировщик VII"
 nav_bomber_equipment_7_short:0 "Морск. Бомбардировщик VII"
 nav_bomber_equipment_6_desc:0 "Современный морской патрульный бомбардировщик с отличной гидролокационной и радиолокационной системами, оснащенный для поиска и поражения подводных лодок и кораблей торпедами и ракетами класса "воздух-земля"."
 nav_bomber_equipment_8:0 "Морской Бомбардировщик VIII"
 nav_bomber_equipment_8_short:0 "Морск. Бомбардировщик VIII"
 nav_bomber_equipment_8_desc:0 "Современный морской патрульный бомбардировщик с передовыми гидролокационными и радиолокационными системами, оснащенный для поиска и поражения подводных лодок и кораблей передовыми торпедами и ракетами класса "воздух-земля"."

 #Tactical Bomber 
 jet_tac_bomber_equipment_1:0 "Реактивный Тактический Бомбардировщик I"
 jet_tac_bomber_equipment_1_short:0 "Реакт. Такт. Бомбардировщик I"
 jet_tac_bomber_equipment_1_desc:0 "Тактический бомбардировщик первого поколения с реактивным двигателем позволяет увеличить скорость и бомбовую нагрузку."
 jet_tac_bomber_equipment_2:0 "Реактивный Тактический Бомбардировщик II"
 jet_tac_bomber_equipment_2_short:0 "Реакт. Такт. Бомбардировщик II"
 jet_tac_bomber_equipment_2_desc:0 "Тактический бомбардировщик второго поколения с реактивным двигателем и стреловидной конструкцией крыла, что еще больше увеличивает скорость."
 jet_tac_bomber_equipment_3:0 "Реактивный Тактический Бомбардировщик III"
 jet_tac_bomber_equipment_3_short:0 "Реакт. Такт. Бомбардировщик III"
 jet_tac_bomber_equipment_3_desc:0 "Тактический бомбардировщик третьего поколения с реактивным двигателем, со стреловидным крылом, повышенной вместимостью боеприпасов и улучшенными навигационными приборами."
 jet_tac_bomber_equipment_4:0 "Штурмовик I"
 jet_tac_bomber_equipment_4_short:0 "Штурмовик I"
 jet_tac_bomber_equipment_4_desc:0 "Штурмовик - это тип ударного самолета, который действует далеко за линией фронта противника, с явным намерением перехватить военные цели противника, в первую очередь те, которые связаны с логистикой. Часто летают на высокой скорости и низко над землей."
 jet_tac_bomber_equipment_5:0 "Штурмовик II"
 jet_tac_bomber_equipment_5_short:0 "Штурмовик II"
 jet_tac_bomber_equipment_5_desc:0 "Усовершенствованный Штурмовик со стреловидной конструкцией, позволяющей развивать большую скорость на малой высоте, способный нести широкий спектр боеприпасов."
 jet_tac_bomber_equipment_6:0 "Штурмовик III"
 jet_tac_bomber_equipment_6_short:0 "Штурмовик III"
 jet_tac_bomber_equipment_6_desc:0 "Дальний передовой Штурмовик со стреловидным крылом, позволяющим развивать большую скорость на малой высоте и способным нести широкий спектр боеприпасов."
 jet_tac_bomber_equipment_7:0 "Штурмовик IV"
 jet_tac_bomber_equipment_7_short:0 "Штурмовик IV"
 jet_tac_bomber_equipment_7_desc:0 "Современные перехватчики часто имеют общие детали или планер с многоцелевыми истребителями или перехватчиками. Они могут выглядеть как обычный истребитель, но иметь невероятное количество точек крепления для выполнения ударной задачи."
 jet_tac_bomber_equipment_8:0 "Штурмовик V"
 jet_tac_bomber_equipment_8_short:0 "Штурмовик V"
 jet_tac_bomber_equipment_8_desc:0 "Современный Штурмовик с современной системой управления и цифровой кабиной пилота, имеющий низкое радиолокационное сечение и большое количество точек крепления для выполнения своих задач."

 #Stealth Tactical Bomber
 stealth_tactical_bomber_equipment_1:0 "Стелс-перехватчик I"
 stealth_tactical_bomber_equipment_1_short:0 "Стелс-перехватчик I"
 stealth_tactical_bomber_equipment_1_desc:0 "Стелс-перехватчик первого поколения с хорошими средствами снижения радиолокационной заметности и внутренним бомбоотсеком может поразить цель, не будучи замеченным."
 stealth_tactical_bomber_equipment_2:0 "Стелс-перехватчик II"
 stealth_tactical_bomber_equipment_2_short:0 "Стелс-перехватчик II"
 stealth_tactical_bomber_equipment_2_desc:0 "Стелс-перехватчик второго поколения с современным стелс-покрытием, чрезвычайно низким радиолокационным сечением и увеличенной внутренней емкостью для боеприпасов."

 #Strategic Bomber
 jet_strat_bomber_equipment_1:0 "Реактивный Стратегический Бомбардировщик I"
 jet_strat_bomber_equipment_1_short:0 "Реакт. Страт. Бомбардировщик I" 
 jet_strat_bomber_equipment_1_desc:0 "Первое поколение стратегических бомбардировщиков с прямым крылом с реактивным или турбовинтовым двигателем, вооруженных обычными бомбами или ядерными боеприпасами."
 jet_strat_bomber_equipment_2:0 "Реактивный Стратегический Бомбардировщик II"
 jet_strat_bomber_equipment_2_short:0 "Реакт. Страт. Бомбардировщик II" 
 jet_strat_bomber_equipment_2_desc:0 "Первое поколение стратегических бомбардировщиков со стреловидным крылом с реактивным или турбовинтовым двигателем, с увеличенной скоростью и повышенной бомбовой мощностью для обычных или ядерных боеприпасов."
 jet_strat_bomber_equipment_3:0 "Реактивный Стратегический Бомбардировщик III"
 jet_strat_bomber_equipment_3_short:0 "Реакт. Страт. Бомбардировщик III" 
 jet_strat_bomber_equipment_3_desc:0 "Второе поколение стратегических бомбардировщиков со стреловидным крылом с реактивным или турбовинтовым двигателем, летающих выше и на большие расстояния, чем те, что появились раньше."
 jet_strat_bomber_equipment_4:0 "Реактивный Стратегический Бомбардировщик IV"
 jet_strat_bomber_equipment_4_short:0 "Реакт. Страт. Бомбардировщик IV"
 jet_strat_bomber_equipment_4_desc:0 "Третье поколение стратегических бомбардировщиков с реактивным или турбовинтовым двигателем, вооруженных обычными ракетами свободного падения или раннего крейсерского класса и соответствующими необходимыми системами наведения."
 jet_strat_bomber_equipment_5:0 "Реактивный Стратегический Бомбардировщик V"
 jet_strat_bomber_equipment_5_short:0 "Реакт. Страт. Бомбардировщик V"
 jet_strat_bomber_equipment_5_desc:0 "Четвертое поколение стратегических бомбардировщиков с реактивным двигателем, с ранними Электродистанционными системами, обновленными системами наведения и более совершенным потенциалом крылатых ракет."
 
 #Mach 2 Strategic Bomber
 mach2stratbomber_equipment_1:0 "Стратегический Бомбардировщик 2 Маха"
 mach2stratbomber_equipment_1_short:0 "Страт. Бомбардировщик 2.М"
 mach2stratbomber_equipment_1_desc:0 "С появлением высоколетящих и очень способных перехватчиков и базовых зенитных ракет бомбардировщики должны летать не только выше, но и быстрее, чем раньше."
 mach2stratbomber_equipment_2:0 "Стратегический Бомбардировщик 2 Маха II"
 mach2stratbomber_equipment_2_short:0 "Страт. Бомбардировщик 2.М II"
 mach2stratbomber_equipment_2_desc:0 "Стратегический бомбардировщик с числом Маха 2+, способный летать еще быстрее, с новыми навигационными приборами, позволяющими лететь над землей, чтобы доставить свой смертоносный боеприпас на цель."
 mach2stratbomber_equipment_3:0 "Стратегический Бомбардировщик 2 Маха III"
 mach2stratbomber_equipment_3_short:0 "Страт. Бомбардировщик 2.М III"
 mach2stratbomber_equipment_3_desc:0 "Стратегический бомбардировщик с числом Маха 2+, способный летать еще быстрее, с современными приборами на базе GPS, позволяющими летать над землей, с Электродистанционной системой, обеспечивающей оперативность."
 
 #Mach 3 Strategic Bomber
 mach3stratbomber_equipment_1:0 "Стратегический Бомбардировщик 3 Маха"
 mach3stratbomber_equipment_1_short:0 "Страт. Бомбардировщик 3.М"
 mach3stratbomber_equipment_1_desc:0 "Стратегический бомбардировщик, способный летать со скоростью Маха 3 даже быстрее, чем его сородичи со скоростью Маха 2, но требующий передовых технологий и дорогостоящих ресурсов для строительства."

 #Mach 6 Strategic Bomber
 mach6stratbomber_equipment_1:0 "Стратегический Бомбардировщик 6 Маха"
 mach6stratbomber_equipment_1_short:0 "Страт. Бомбардировщик 6.М"
 mach6stratbomber_equipment_1_desc:0 "Стратегический бомбардировщик, способный летать со скоростью Маха 6, летит на околосуборбитальной орбите, чтобы уменьшить трение. Этот почти космический корабль по своей конструкции является невероятно передовой технологией и невероятно дорог в строительстве и обслуживании."
 
 #Nuclear-Powered Strategic Bomber
 nuclearstratbomber_equipment_1:0 "Ядерный Стратегический Бомбардировщик I"
 nuclearstratbomber_equipment_1_short:0 "Ядерн. Страт. Бомбардировщик I"
 nuclearstratbomber_equipment_1_desc:0 "Самолет с ядерной силовой установкой - это концепция самолета, который должен работать на ядерной энергии. Предполагалось создать реактивный двигатель, который бы нагревал сжатый воздух теплом от деления, а не теплом от сжигания топлива. Во время холодной войны Соединенные Штаты и Советский Союз исследовали бомбардировщики с ядерной силовой установкой, обладающие большей выносливостью." 
 nuclearstratbomber_equipment_2:0 "Ядерный Стратегический Бомбардировщик II"
 nuclearstratbomber_equipment_2_short:0 "Ядерн. Страт. Бомбардировщик II"
 nuclearstratbomber_equipment_2_desc:0 "Современная попытка создания самолета с ядерной силовой установкой с намерением почти постоянно находиться в воздухе. Из-за необходимой защиты реактора такие самолеты невероятно дороги в эксплуатации."  

 #Stealth Strategic Bomber
 stealth_strategic_bomber_equipment:0 "Стелс Бомбардировщик"
 stealth_strategic_bomber_equipment_1:0 "Стратегический Стелс Бомбардировщик I"
 stealth_strategic_bomber_equipment_1_short:0 "Стелс Бомбардировщик I"
 stealth_strategic_bomber_equipment_1_desc:0 "Стратегический стелс бомбардировщик первого поколения, оснащенный передовой конструкцией и стелс-покрытием, чтобы иметь возможность проникать вглубь вражеской территории без обнаружения."
 stealth_strategic_bomber_equipment_2:0 "Стратегический Стелс Бомбардировщик II"
 stealth_strategic_bomber_equipment_2_short:0 "Стелс Бомбардировщик II"
 stealth_strategic_bomber_equipment_2_desc:0 "Стратегический стелс бомбардировщик второго поколения, оснащенный усовершенствованной конструкцией и стелс-покрытием для того, чтобы иметь возможность проникать вглубь вражеской территории без обнаружения."

 #Transport Plane
 transport_plane_equipment_2:0 "Транспортный Самолет II"
 transport_plane_equipment_2_short:0 "Транспортный Самолет II"
 transport_plane_equipment_2_desc:0 "По мере расширения Второй мировой войны к середине 1940-х годов спрос на транспортные самолеты большей грузоподъемности привел к созданию более крупных самолетов, способных перевозить больше войск и оборудования." 
 transport_plane_equipment_3:0 "Транспортный Самолет III"
 transport_plane_equipment_3_short:0 "Транспортный Самолет III"
 transport_plane_equipment_3_desc:0 "После Второй мировой войны конструкция транспортных самолетов позволила создать более мощные двигатели, что позволило самолетам начала 1950-х годов перевозить еще больше грузов, оборудования и войск."
 transport_plane_equipment_4:0 "Транспортный Самолет IV"
 transport_plane_equipment_4_short:0 "Транспортный Самолет IV"
 transport_plane_equipment_4_desc:0 "Эпоха после Корейской Войны ускорила разработку самолетов, что позволило турбовинтовым самолетам по-настоящему проявить себя в качестве больших перевозчиков грузов и оборудования."
 transport_plane_equipment_5:0 "Транспортный Самолет V"
 transport_plane_equipment_5_short:0 "Транспортный Самолет V"
 transport_plane_equipment_5_desc:0 "В середине 1960-х годов появляются транспортные самолеты с реактивным двигателем и увеличивается дальность полета больших грузовых самолетов. Небо буквально стало пределом."
 transport_plane_equipment_6:0 "Транспортный Самолет VI"
 transport_plane_equipment_6_short:0 "Транспортный Самолет VI"
 transport_plane_equipment_6_desc:0 "Дальнейшая доступность больших коммерческих двигателей позволит большим грузовым самолетам стать еще больше. Кроме того, в эти тяжелые грузовики внедряются новые инновационные элементы дизайна."
 transport_plane_equipment_7:0 "Транспортный Самолет VII"
 transport_plane_equipment_7_short:0 "Транспортный Самолет VII"
 transport_plane_equipment_7_desc:0 "При полномасштабном внедрении Электродистанционных систем и добавлении больших топливных баков и возможности использования зондов для дозаправки в полете на этих больших грузовых самолетах их дальность полета становится практически неограниченной."
 transport_plane_equipment_8:0 "Транспортный Самолет VIII"
 transport_plane_equipment_8_short:0 "Транспортный Самолет VIII"
 transport_plane_equipment_8_desc:0 "Еще более мощные двигатели для больших транспортных самолетов означают, что аэромобильность достигает своего пика. Целые бригады могут быть переброшены лишь горсткой грузовых самолетов этой эпохи."
 transport_plane_equipment_9:0 "Транспортный Самолет IX"
 transport_plane_equipment_9_short:0 "Транспортный Самолет IX"
 transport_plane_equipment_9_desc:0 "Полностью цифровые кабины становятся нормой для этих больших грузовых самолетов. Электродистанционной системы достигли такого уровня, что полеты на большие расстояния для этих самолетов, а также их растущая маневренность стали обычным делом."
 transport_plane_equipment_10:0 "Транспортный Самолет X"
 transport_plane_equipment_10_short:0 "Транспортный Самолет X"
 transport_plane_equipment_10_desc:0 "Современный воздушный транспорт с большой грузоподъемностью, скоростью, возможностью дозаправки в полете и способностью летать на больших высотах делает весь мир доступным для этих современных транспортных самолетов."

