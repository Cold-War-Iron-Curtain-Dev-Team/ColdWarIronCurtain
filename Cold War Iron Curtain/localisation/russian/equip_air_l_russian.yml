 #UAV CAS
 USA_cas_uav_equipment_1:0 "General Atomics RQ-1 «Хищник»"
 USA_cas_uav_equipment_1_short:0 "RQ-1 «Хищник»"
 #USA_cas_uav_equipment_1_desc:0 ""
 USA_cas_uav_equipment_2:0 "General Atomics MQ-1A «Хищник»"
 USA_cas_uav_equipment_2_short:0 "MQ-1A «Хищник»"
