 FRA_jet_light_equipment_1:0 "Локхид T-33 «Шутинг Стар»"
 FRA_jet_light_equipment_1_short:0 "T-33 «Шутинг Стар»"
 FRA_jet_light_equipment_1_desc:0 "Локхид T-33 «Шутинг Стар» (или «Ти-берд») - дозвуковой американский реактивный учебно-тренировочный самолет. Он производился компанией Lockheed и совершил свой первый полет в 1948 году. T-33 был разработан на базе Lockheed P-80/F-80, начиная с TP-80C/TF-80C, затем получил обозначение T-33A."
