 BEL_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Late"
 BEL_CAS_equipment_3_short:0 "Typhoon Mk.Ib/Late"
 BEL_CAS_equipment_3_desc:0 "The Hawker Typhoon was a British fighter bomber aircraft primarily used by the Royal Air Force (RAF) in the Second World War. The Typhoon Mk.Ib/Late, was an improved derivative of the earlier Hawker Typhoons featuring a new bubble canopy."
 BEL_CAS_equipment_4:0 "Hawker Tempest Mk.II"
 BEL_CAS_equipment_4_short:0 "Tempest Mk.II"
 BEL_jet_CAS_equipment_1:0 "SABCA F-84E Thunderjet"
 BEL_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 BEL_jet_CAS_equipment_1_desc:0 "The F-84 was designed as a day-time fighter-bomber aircraft set to replace the earlier P-47 Thunderbolt. Despite entering service in 1947, the Thunderjet was plagued by many problems. So much so, that until the introduction of the 'D' Variant in 1949, the F-84 was very nearly cancelled. The type served as the primary strike aircraft for the U.S. Air Force during the Korean War, and was the first fighter aircraft used by the USAF's demonstration team, the 'Thunderbirds.' It is perhaps for that reason why 'Thunderjet' would be a fitting name for the type."
 BEL_jet_CAS_equipment_2:0 "SABCA F-84G Thunderjet"
 BEL_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 BEL_jet_CAS_equipment_2_desc:0 "The F-84 was designed as a day-time fighter-bomber aircraft set to replace the earlier P-47 Thunderbolt. Despite entering service in 1947, the Thunderjet was plagued by many problems. So much so, that until the introduction of the 'D' Variant in 1949, the F-84 was very nearly cancelled. The type served as the primary strike aircraft for the U.S. Air Force during the Korean War, and was the first fighter aircraft used by the USAF's demonstration team, the 'Thunderbirds.' It is perhaps for that reason why 'Thunderjet' would be a fitting name for the type."
 BEL_jet_CAS_equipment_3:0 "SABCA F-84F Thunderstreak"
 BEL_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 BEL_jet_CAS_equipment_3_desc:0 "Developed from the earlier F-84 Thunderjet, the F-84F was a swept-wing variant of the fighter-bomber was designed to bring the type closer to the performance of the much vaunted F-86 Sabre. Despite improved capabilities compared to its straight winged predecessor, it still had the same flaws in takeoff performance while having poor stability and control. The type would serve in a limited capacity throughout its life, serving until 1971. Its nickname is 'Thunderstreak.'"
 BEL_jet_CAS_equipment_6:0 "SABCA Mirage 5BA"
 BEL_jet_CAS_equipment_6_short:0 "Mirage 5BA"
 BEL_jet_CAS_equipment_6_desc:0 "he Dassault Mirage 5 is a supersonic attack aircraft designed in France by Dassault Aviation, and manufactured in France and a number of other countries under license. It was derived from Dassault's popular Mirage III fighter."
 
