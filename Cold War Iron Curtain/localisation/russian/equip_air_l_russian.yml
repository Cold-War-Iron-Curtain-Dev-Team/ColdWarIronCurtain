 BEL_jet_recon_equipment_0:0 "Piper L-21 Super Cub"
 BEL_jet_recon_equipment_0_short:0 "L-21 Super Cub"
 BEL_jet_recon_equipment_0_desc:0 "The Piper L-21 Super Cub is a two-seat, single-engine monoplane. Introduced in 1949 by Piper Aircraft, it was developed from the Piper PA-11."
 BEL_jet_recon_equipment_1:0 "SABCA RF-104G Starfighter"
 BEL_jet_recon_equipment_1_short:0 "RF-104G Starfighter"
 BEL_jet_recon_equipment_1_desc:0 "The RF-104G was a tactical reconnaissance model based on the F-104G, usually with three KS-67A cameras mounted in the forward fuselage in place of the internal cannon. Many of the 189 built were subsequently reconfigured to the F-104G standard"
 BEL_jet_recon_equipment_2:0 "SABCA Mirage 5BR"
