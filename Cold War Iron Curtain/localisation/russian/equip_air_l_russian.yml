 YUG_fighter_equipment_0:0 "Yugoslav Air Force and Air Defence"
 YUG_fighter_equipment_0_short:0 "RV i PVO"
 YUG_fighter_equipment_0_desc:0 "The Air Force and Air Defence was one of three branches of the Yugoslav People's Army, the Yugoslav military. Commonly referred-to as the Yugoslav Air Force, at its height it was among the largest in Europe."

 YUG_fighter_equipment_1:0 "Ikarus IK-2"
 YUG_fighter_equipment_1_short:0 "IK-2"
 YUG_fighter_equipment_2:0 "Supermarine Spitfire F Mk.V"
