 FRA_united_left: "Союз левых"
 FRA_united_left_desc: "Левые снова едины!"
 FRA_60s_The_Algeirs_Coup_desc: "Недавняя пресс-конференция, посвященная будущему Алжира, усилила напряженность в отношениях между франкоалжирцами и коренным арабским народом. Пропаганда де Голля, направленная на деколонизацию, основанная на том факте, что Алжир только истощал французскую нацию в течение последних многих лет, была встречена страхом со стороны этнических французов, которые создали себе жизнь по всему Средиземноморью. Вполне возможно, что выдающиеся черноногие попытаются удержаться у власти даже без нашего присутствия в стране. Если Франция возьмет на себя обязательство уйти из Алжира, образовавшийся вакуум власти может быть использован командирами, выступающими против деколонизации."
