 france_junta.1.d: "Сегодня, на площади Бастилии, бывший президент и предатель Республики Шарль де Голль, приговоренный к казни, был помещен на гильотину на публичное обозрение народом. Его последними словами были \"Во имя Франции я приказываю верному народу использовать все средства, я говорю, все средства чтобы противостоять тирании и блокировать дорогу везде и всюду этим предателям! Не дайте им прибрать нашу Родину, не дайте им прибрать нашу Францию!\" "
 france_junta.2.d: "Ранним утром, на Площади Согласия, всё руководство социалистических и коммунистических партий было хладнокровно расстреляно. Перед террором пали в том числе две важнейшие фигуры левого движения - депутат и кандидат в президенты Франсуа Миттеран и генеральный секретарь Коммунистической партии Морис Торез."
