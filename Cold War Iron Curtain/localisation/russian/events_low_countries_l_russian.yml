l_english:
 northseaflood.1.d: "31 января 1953 года на Британские острова и страны Бенилюкса обрушился мощный шторм, вызвавший катастрофическое наводнение. В результате погибли 2551 человек, большинство — в Нидерландах и Бельгии. Высота воды достигла 18,4 фута (около 5,6 метра) над уровнем моря, затопив 527 квадратных миль (1365 квадратных километров) голландских сельскохозяйственных угодий. Прорыв многочисленных дамб и волноломов вынудил эвакуировать 70 000 человек. Для спасательных операций были задействованы вертолеты армии США, а Красный Крест получил огромный поток пожертвований. Катастрофа подтолкнула власти к разработке масштабного проекта \"Работы в дельте\", направленного на защиту устьев крупных рек и предотвращение подобных трагедий в будущем."
 northseaflood.2.d: "Штормовой нагон воды вызвал крупнейшее наводнение в нашей истории, разрушив основные защитные сооружения на побережье. Это привело к масштабным затоплениям в регионах Зеландии и Южной Голландии. Несмотря на предупреждения администрации Рейксватерштата, многие жилые дома не были своевременно оповещены, из-за чего наводнение стало для некоторых неожиданным и трагическим. В результате погибли 1836 человек, десятки тысяч остались без крова. Затоплено 9% сельскохозяйственных угодий страны, погибли десятки тысяч голов скота, разрушены тысячи зданий. Эта катастрофа нанесла серьезный удар по восстановлению страны после Второй мировой войны."
 northseaflood.3.d: "На восточном побережье произошло масштабное наводнение, унесшее жизни сотен людей от Кента до восточной Шотландии. Хотя последствия не столь разрушительны, как в соседних странах за Ла-Маншем, ущерб остается значительным. Это одно из самых сильных наводнений в современной истории: десятки тысяч людей лишились жилья, а восстановление потребует скоординированных усилий. В парламенте уже обсуждаются меры по предотвращению подобных катастроф в будущем."
 northseaflood.4.d: "Фламандцы только начинают оправляться от потрясения, вызванного этим неожиданным стихийным бедствием. Наши дамбы возле Антверпена были прорваны и полностью разрушены, нанеся ущерб всему побережью северо-восточной Фландрии. Однако, к счастью, в нашей стране погибло не так много людей по сравнению с Нидерландами и Соединенным Королевством, и наш ущерб также вряд ли можно сравнить, поэтому восстановление не создаст для нас больших трудностей."