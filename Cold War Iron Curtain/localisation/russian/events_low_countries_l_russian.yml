l_russian:
 northseaflood.1.d: "31 января 1953 года на Британские острова и Нидерланды обрушился сильный шторм, вызвавший наводнение и серьезный ущерб. Унесший жизни 2551 человек, в основном в Нидерландах и Бельгии, шторм вызвал наводнения на высоте 18,4 фута над уровнем моря, в результате чего 527 квадратных миль голландских сельскохозяйственных угодий оказались под водой. Многие дамбы или волноломы были прорваны, в результате чего 70 000 человек были эвакуированы. Армия США направила вертолеты для помощи в спасении, а Красный Крест переполнен пожертвованиями. Были и другие разговоры о проекте, известном как Delta Works, для защиты устьев крупных рек и предотвращения повторения трагедии такого масштаба."
 northseaflood.2.d: "Штормовой нагон привел к сильнейшему наводнению в нашей жизни, так как все наши основные морские укрепления рухнули, вызвав массовые наводнения в Зеландии и Южной Голландии. Несмотря на предупреждения местного Рейксватерштата, отчеты не сообщали о том, что жилые дома в стране не были предупреждены, что привело к неожиданной препятствующей волне наводнения, в результате которого погибли 1836 человек и десятки тысяч остались без крова и перемещенных лиц. 9% сельскохозяйственных угодий нашей страны затоплено, десятки тысяч скота убиты и десятки тысяч зданий разрушены, это будет ударом по зубам во время нашей реконструкции после Второй мировой войны."
 northseaflood.3.d: "Массовое наводнение произошло на нашем восточном побережье, когда волны от Кента до восточной Шотландии унесли жизни сотен людей. Хотя мы  и не так сильно пострадал, как наш сосед по ту сторону ла-Манша, его нельзя недооценивать. Это самое страшное наводнение в этой главе истории, десятки тысяч людей были вынуждены покинуть свои дома, и нам понадобятся согласованные усилия для возмещения ущерба. В парламенте уже ведутся переговоры о предотвращении повторения подобной катастрофы."
 northseaflood.4.d: "Фламандцы только что среагировали на немедленный шок от этого неожиданного стихийного бедствия. Наши дамбы возле Антверпена были полностью прорваны и разрушены, нанеся ущерб всему побережью северо-восточной Фландрии. Однако, к счастью, в нашей стране умерло очень мало людей по сравнению с Нидерландами и Великобританией, и наши убытки также вряд ли сопоставимы, поэтому наше выздоровление будет далеко не таким трудным."
