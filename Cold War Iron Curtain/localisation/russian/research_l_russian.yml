 management_XI_A_desc: ""
 management_XI_B: "Принятая доктрина оптимизации по Парето"
 management_XI_B_desc: ""
  
  #Production efficiency 
 production_efficiency_I: "Порошковое покрытие"
 production_efficiency_I_desc: "Чтобы предотвратить ржавление и истирание, порошковое покрытие используется для "окраски" промышленных машин. Порошок наносится электростатически, а затем термореактивно с образованием защитного слоя. Промышленные порошковые покрытия производят более толстые, прочные, гладкие покрытия, чем жидкие покрытия, и отверждаются гораздо быстрее. Разрабатывая порошковое покрытие, металлическое оборудование и изделия могут быть защищены от коррозии и истирания гораздо лучше, чем при использовании традиционных красок."
 production_efficiency_II: "Полу-ручной конвейер"
 production_efficiency_II_desc: "Способ создания Мебиуса (1 всплыл на поверхность 3D-объекта) транспортера на полу-скручивания один конец. Это приводит к тому, что конвейерные ленты служат гораздо дольше, поскольку вся площадь поверхности ленты непрерывно изнашивается вместо того, чтобы одна сторона использовалась в нетканой ленте. Это предотвращает несчастные случаи, поломки и уменьшает количество аварий и замен, необходимых в конвейерных лентах, что делает производство более упорядоченным и улучшает производственный процесс."
 production_efficiency_III: "Новые методы сварки"
 production_efficiency_III_desc: "Совершенствование методов сварки является важной частью производства. Создание новых методов и материалов для установки металлов и делать это более экономически эффективно и быстро уменьшает узкие места в производстве и повышает общую производительность при одновременном снижении затрат. Кроме того, улучшение сварки повышает качество и долговечность как изделий, так и оборудования."
 production_efficiency_IV: "Формовка песка Disa"
 production_efficiency_IV_desc: "Литье в песок является важным процессом в производстве и используется для изготовления металлических корпусов. В песчаном литье песок используется в качестве материала формы для металлических отливок и легко удаляется, а не с помощью металлического или пластикового литья, которое труднее удалить. Вот почему многие неполированные металлические предметы имеют шероховатую поверхность. Однако формирование песчаных форм может быть длительным процессом. Метод литья песка Disa-это автоматизированный, быстрый процесс для создания больших объемов песчаных форм для производств"
 production_efficiency_V: "Полностью пластиковая конвейерная лента"
 production_efficiency_V_desc: "По мере продвижения пластмассовых материалов их применение расширяется. С более сильными, более прочными пластмассами приходит способность создавать полностью пластиковые конвейерные ленты, которые легче обслуживаются и гораздо более долговечны, чем традиционные тканевые ленты. Пластиковые конвейерные ленты также легче чистить и иногда дешевле заменять и производить."
 production_efficiency_VI: "Автоматизированное производство"
 production_efficiency_VI_desc: "Автоматизированное производство - это использование информационной системы [то есть компьютера] для управления производством. Помощь в производстве с помощью программного обеспечения CAM значительно облегчает управление, производство и хранение и позволяет компьютерной системе быстро приспосабливаться к множеству различных спецификаций. Точность кулачка обеспечивает большую гибкость в изменении производства, более высокую точность для более качественных продуктов и сокращение отходов за счет использования только необходимого количества материала и даже снижения энергопотребления."
 production_efficiency_VII: "Компьютерно-интегрированные производства"
 production_efficiency_VII_desc: "Полностью интегрированное компьютерное производство является продолжением автоматизированного производства. Полностью интегрированные системы измеряют, записывают и контролируют каждый участок производственной операции. При таком уровне контроля весь производственный процесс может управляться и оптимизироваться в отношении каждой другой секции производственной линии."
 production_efficiency_VIII: "Усовершенствованная лазерная гравировка"
 production_efficiency_VIII_desc: "Лазерная гравировка - это использование лазеров для маркировки объекта или оставления лазерного отпечатка. Хотя лазерная маркировка и лазерная гравировка использовались и раньше, разработка технологии маркировки металлических объектов серийными номерами или данными позволяет лучше управлять логистикой и обеспечивает большую долговечность, чем маркировка краской или порошком. Кроме того, лазеры не изнашиваются, так как они не используют инструментальные биты, которые контактируют с гравировальной поверхностью."
 production_efficiency_IX: "Холодное газодинамическое напыление"
 production_efficiency_IX_desc: "Холодное напыление-это метод нанесения покрытия, при котором сверхзвуковые газовые струи распыляют поверхность и ударяют, приводя к адгезии на поверхности. Этот способ нанесения покрытия значительно быстрее предыдущих и позволяет быстрее и проще изготавливать поверхности изделий или деталей машин. Он также является более энергоэффективным и может также собирать и повторно использовать частицы, которые пропускают, а также повышать общую безопасность на рабочем месте."
 production_efficiency_X: "Базовая 3D-печать"
 production_efficiency_X_desc: "3D-печать - это процесс, при котором жидкие или порошковые материалы затвердевают, образуя твердый объект. Это в первую очередь используется в промышленности для создания термореактивных полимерных моделей и создания пластиковых объектов. Этот метод более эффективен и менее расточителен, чем пластиковое формование, и может быть особенно полезен при создании медицинских объектов, таких как имплантаты или сменные зубные коронки."
 industry_production_efficiency_tt: "Дает §G+5%§! дохода от §YПроизводственный парк§!\n"
  
  #Industrial robots 
 industrial_robots_I: "Heavy-Lifting Robots"
 industrial_robots_I_desc: "Robots are machines capable of carrying out complex actions that can be autonomous or semi-autonomous. Early industrial robotics revolutionized industry by allowing machines to perform jobs that would normally be dangerous to humans and at a vastly faster rate. By developing the hydraulic and control schemes to enable automated performance of repetitive tasks, factories can reach far more productive levels with less workers and perform tasks that were previously difficult."
 industrial_robots_II: "Articulating-Arm Robotics"
 industrial_robots_II_desc: "Further improving the strength and dexterity of robotics, jointed robotic arms that can perform even more complex tasks can be created. By doing this, robotic arms can bend and reach more areas and perform more complicated tasks, further reducing the number of staff required and making it easier for factories to produce more at a faster rate."
 industrial_robots_III: "Computer-Controlled Robots"
 industrial_robots_III_desc: "Computer-controlled robots or \"CAM-integrated robotics\" are robots that can be actively reprogrammed through a factory's CAM network and controlled remotely. Doing this increases the amount of control operators have over automated assembly lines and allows for more flexible assembly lines that can import robotics programs and rapidly pick up and change jobs."
 industrial_robots_IV: "Fully Robotic Assembly Lines"
 industrial_robots_IV_desc: "Designing manufacturing robotic equipment variants and designs enables larger levels of products to be created. By expanding the family of robotics and creating equipment that can match up a multitude of designs can allow entire assembly lines to become entirely automated."
 industrial_robots_V: "Manufacturing Artificial Intelligence"
 industrial_robots_V_desc: "Artificial Intelligence and dynamic autonomous actions allow robotics to react to changes in the environment and greatly improve safety. Any sort of system malfunction or misalignment could previously cause a cascade of situations that resulted in serious damage to machinery, but giving robotic equipment the ability to react and perform basic judgements in the situation allow them to react properly. This can also be used to automatically test for and detect quality flaws and defects in products."
  
