 software_XVI_desc: ""
  
  #Radar 
 radar_0: "Послевоенный радар"
 radar_I: "Верхушка Доплеровских лучей"
 radar_II: "Моноимпульсный радар"
 radar_III: "Загоризонтный радиолокатор"
 radar_IV: "«PAVE PAWS» (фазированная решетка)"
 radar_V: "Активная фазированная антенная решётка (Радар «Жираф»)"
 radar_VI: "Импульсный доплеровский радар"
 radar_VII: "Устойчивая к помехам радиолокационная технология"
 radar_0_desc: "На протяжении Второй мировой войны было сделано много достижений в области радиолокации. В самом начале радар просто использовал радиолокационное обнаружение, которое было очень грубым и неэффективным. Это в конечном итоге было заточено для создания дециметрового радара, который мог бы обнаруживать приближающиеся самолеты с более отдаленного расстояния и делать это более точно. В конце концов, дециметровый радар был удлинен до сантиметра, чтобы обеспечить обнаружение радаров на больших расстояниях. С целью удлинения радиолокационных волн производится значительное повышение прочности резонаторного магнетрона. Резонаторный магнетрон - это высокомощная вакуумная трубка, используемая для генерации микроволн и превращения их в радиоволны. Он был сделан сильнее, чем когда-либо, и мог создавать очень мощные сантиметровые лучи."
 radar_I_desc: "Доплеровская заточка Луча - это метод обработки радиолокационных сигналов в радиолокационное изображение. Используя синтетическую апертуру, движение антенны РЛС обеспечивает более высокое пространственное разрешение, чем обычные радиолокационные станции сканирования Пучков. SAR определяет 3D-массив элементов сцены, используя отдачу от луча. С помощью этого массива SAR запускает алгоритмы и вычисления, чтобы определить точное изображение того, что он сканирует."
 radar_II_desc: "Моноимпульсный радар-это радиолокационная система, которая кодирует свой радиосигнал на разных уровнях, поэтому, когда луч отскакивает назад, он обеспечивает высокоточные данные, основанные на том, как возвращаются различные импульсы. Поскольку радиосигнал использует дополнительное кодирование, он способен излучать только 1 импульс для получения точных данных, отсюда и название "монопульс"."
 radar_III_desc: "Загоризонтный радар-это радар, который передает мощный коротковолновый сигнал, который достигает за горизонт, отражаясь от ионосферы в небе, чтобы ударить по земле над горизонтом, а затем снова вернуться в небо и к антеннам радара. Это позволяет OtH обнаруживать цели за препятствиями и на чрезвычайно больших расстояниях."
 radar_IV_desc: "PAVE PAWS-это высокоразвитая твердотельная радиолокационная система с фазированной антенной решеткой, разработанная для обнаружения и характеристики атак баллистических ракет. PAVE PAWS был первоначально создан в США как ответ на атаки баллистических ракет с подводными ракетами и состоит из массивных массивов скрещенных дипольных элементов, которые дают невероятный уровень детализации покрытия."
 radar_V_desc: "AESA (giraffe radar)-это компактная радиолокационная система быстрого развертывания, которая может устанавливаться на транспортные средства или патрульные беспилотники и связываться с большой территорией. AESA оптимизирована для поиска, маркировки и мониторинга воздушных судов в определенном районе и связи по большой сети для поддержания осведомленности на большой территории."
 radar_VI_desc: ""
