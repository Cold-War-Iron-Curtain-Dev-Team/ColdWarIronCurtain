  #Logistics 
 logistics_I: "Эффективная грузоперевозка по воздуху"
 logistics_I_desc: "Более легкие контейнеры и стандартизированные механизмы крепления контейнеров повышают скорость погрузки и разгрузки авиагрузов."
 logistics_II: "Укладка на паллеты"
 logistics_II_desc: "Размещение всего груза на поддонах, которые легко перемещаются с помощью вилочных погрузчиков и грузовых кранов, дает нам большую гибкость в отношении того, какой груз мы можем отправить и куда."
 logistics_III: "Модульная ведомость материалов"
 logistics_III_desc: "Модульная спецификация [спецификация материала] - это спецификация планирования, которая позволяет изменять сложные продукты, имеющие дополнительные функции, по требованию для производства на заводе. При замене различных компонентов друг на друга на модульном продукте можно легко изготовить на заказ больше вариантов одного и того же продукта для удовлетворения различных потребностей."
 logistics_IV_A: "Потребление на основе производства планирования ресурсов"
 logistics_IV_A_desc: "Основанные планы планирования производственных ресурсов с использованием текущих и будущих показателей продаж для того, чтобы производить потенциально необходимые продукты заранее, экономя время и быстро удовлетворяя спрос. Однако существуют неточности в MRP на основе потребления, которые приводят к расточительству, основанному на неточных прогнозах, что может стоить ресурсов и привести к расточительству. Иногда MRP на основе потребления имеет катастрофические провалы прогнозов, которые приводят к ликвидации или массовым отходам."
 logistics_IV_B: "Планирование производственных ресурсов по запросу"
 logistics_IV_B_desc: "Планирование производственных ресурсов производства по требованию строится на основе непосредственных потребностей и не создает продукт до тех пор, пока он не будет заказан. Делая это, предотвращаются отходы и экономятся ресурсы и активное заводское время. Это, однако, приводит к увеличению времени ожидания и оказывает большее давление на коммерцию, чтобы планировать на индивидуальном уровне свои собственные продукты или в большей степени полагаться на заказ клиента заранее. Производство до востребования часто может привести к дефициту или отставанию заказов, но предотвращает расточительство ресурсов."
 logistics_V_A: "Основанная на грузовиках контейнерная стандартизация"
 logistics_V_A_desc: "Стандартизация контейнеров на базе грузовых автомобилей-это стандартизация интермодальных перевозок на базе грузовых автомобилей. В то время как все интермодальные перевозки стандартизированы, выбор этой технологии представляет собой акцент на логистике грузовых автомобилей и инновациях. Сосредоточение внимания на логистике на базе грузовых автомобилей приводит к более легким перевозкам внутри города, позволяя создать больше местной промышленности из упрощенных городских логистических и инфраструктурных сетей, но оставляет инновации в железнодорожных сетях позади, делая общую производительность от междугородной торговли или сельской промышленности более трудной."
 logistics_V_B: "Стандартизация контейнеров на основе поездов"
 logistics_V_B_desc: "Стандартизация контейнерных перевозок на основе поездов - это стандартизация интермодальных перевозок на основе поездов. В то время как все интермодальные перевозки стандартизированы, выбор этой технологии представляет собой акцент на железнодорожной логистике и инновациях. Сосредоточение внимания на железнодорожной логистике приводит к облегчению междугородних перевозок и улучшению промышленного потенциала сельских районов, но делает внутригородскую логистику более дорогостоящей, что приводит к более сложной и трудной в управлении городской инфраструктуре."
 logistics_VI: "Универсальный код продукта"
 logistics_VI_desc: "Универсальный код продукта [UPC] - это система штрих-кодов, которая позволяет быстро идентифицировать и отслеживать торговые товары. В дополнение к отслеживанию, штрих-код позволяет быстро проверить продукцию в точке продажи."
 logistics_VI_A: "Сверхтяжелые нефтяные терминалы"
 logistics_VI_A_desc: ""
 logistics_VII_A: "Дифференциациальное преимущество стратегической информационной системы"
 logistics_VII_A_desc: "Преимущество дифференциации SIS [strategic information system] - это информационная система, которая фокусируется на том, чтобы быть более универсальной и способной достичь большего в более широком спектре областей, а не обеспечивать конкурентоспособную, более низкую стоимость. Основываясь на теории дифференцированного преимущества Портера, DS_SIS стремится создать дифференциальное преимущество на рынке через уникальность."
 logistics_VII_B: "Конкурентное преимущество стратегической информационной системы"
 logistics_VIII_A: "Упор на перевозках внутри самолетов"
 logistics_VIII_A_desc: "Брюшные грузовые самолеты - это грузовые самолеты, которые хранят груз в брюхе самолета и хранят только груз. Эти типы самолетов не могут перевозить пассажиров и, как таковые, не так универсальны, как комбинированные самолеты. Сосредоточившись на развитии грузовых воздушных судов с животом, воздушные перевозки могут быть значительно улучшены по мере того, как промышленные воздушные перевозки становятся более эффективными.это приводит к производству полностью сегрегированных авиалайнеров, которые чисто перевозят пассажиров."
 logistics_VIII_B: "Упор на комбинированных воздушных судах"
 logistics_VIII_B_desc: "Комбинированные самолеты - это самолеты, которые могут быть быстро модифицированы для перевозки пассажиров, грузов или того и другого одновременно. Они обычно имеют рельсы, где сиденья могут быть установлены или удалены, и спроектированы с негабаритными боковыми грузовыми дверями. Эти самолеты могут быть изготовлены в массовом порядке и служить нескольким целям, а также позволяют самолетам обслуживать грузовые перевозки и авиалинии.\nЭто приводит в первую очередь к производству комбинированных самолетов."
 logistics_IX: "Современные козловые краны"
 logistics_IX_desc: "Козловой кран - это большой кран, используемый для обработки контейнеров. Портальные краны дока управляют морской логистикой, в то время как портальные краны железнодорожного вокзала управляют погрузкой и разгрузкой поездов. Современные конструкции козловых кранов способны обрабатывать интермодальные контейнеры с более высокой скоростью, удерживать больший вес и работать полуавтоматически за счет использования компьютерной поддержки."
 logistics_X: "Управление цепочками поставок"
 logistics_X_desc: "В то время как управление цепочками поставок было создано во время Второй мировой войны, чтобы сделать более эффективную систему закупок и оптимизировать логистику, современные потребности и технологические усовершенствования требуют еще большего уровня логистического контроля и управления. Организуя контракты и квоты и создавая более формализованные и упорядоченные макропланируемые инфраструктурные сети, можно удовлетворить потребности современного мира и вывести промышленность на более высокий уровень."
