 ww_pc: "Компьютер ВМВ"
 ww_pc_desc: "До и во время Второй мировой войны было создано множество протокомпьютерных изобретений. Механические компьютеры уступили место электронным вычислительным машинам, использующим вакуумные трубки. Эти компьютеры могли бы выполнять повторяющиеся и простые задачи, чтобы облегчить работу исследователей и инженеров. Эти компьютеры имеют очень ограниченную вычислительную мощность и могут выполнять только простые задачи, но являются важнейшими ступенями эволюции общества и технологий."
 radio: "Радио ВМВ"
 radio_desc: "Радио-это устройство, которое использует электромагнитные волны энергии для передачи и приема данных через пространство. Когда радиоволны ударяют по электрическому проводнику, в нем создается переменный ток. Этот ток может быть прочитан и переведен в читаемые данные. Информация в волнах может быть извлечена из этого потока и переведена. Использование радиоприемников позволяет передавать информацию по воздуху и позволяет осуществлять дистанционную связь. Кроме того, различные модуляции, основанные на амплитуде, угле, частоте или фазе, могут считываться по разным каналам, что позволяет нескольким радиостанциям использовать одно и то же воздушное пространство для передачи информации."
 egg_desc: "Сделано Polarace & Schorle & Theodore & Starfoth"
  
  #Hardware 
