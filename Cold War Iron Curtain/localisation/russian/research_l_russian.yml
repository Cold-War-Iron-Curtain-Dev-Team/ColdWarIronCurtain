  #LOGISTICS 
 tech_logistics_company: "Снабжение I; Рота снабжения"
 tech_logistics_company_desc: "Тыловые корпуса-это специально выделенные небоевые кадры, которые обеспечивают снабжение и провизию армии. Один из самых важных элементов армии, логистический корпус обеспечивает армию боеприпасами, провизией и запасными частями, чтобы она могла продолжать боевые действия. Кроме того, специализированные корпуса и офицеры управляют сетями и сокращают отходы, что может значительно помочь снизить общее потребление."
 tech_logistics_company2: "Снабжение II; Сопровождение конвоев"
 tech_logistics_company2_desc: "Логистические конвои являются главными мишенями для агентов по проникновению и операций в тылу врага. Оценивая риски и обеспечивая безопасность линий снабжения с помощью патрулей и конвоев, можно защитить запасы и сохранить ценные запасы, которые обычно уничтожаются, что еще больше снижает общее потребление."
 tech_logistics_company3: "Снабжение III; Стандартизация поставок"
 tech_logistics_company3_desc: "Различные производители или регионы обычно имеют свои собственные способы хранения и маркировки провизии. Это может стать серьезным бременем для материально-технического обеспечения корпуса. Таким образом, важно разработать национальный стандартизированный каталог военных запасов, чтобы облегчить управление ими офицерам снабжения."
 tech_logistics_company4: "Снабжение IV; Легкие/компактные контейнеры"
 tech_logistics_company4_desc: "Вес-это серьезная проблема в логистике. Транспортные средства могут перевозить только такой вес и даже все еще имеют ограничения на объем содержимого, которое они могут перевозить. Создавая легкие, прочные, компактные контейнеры, можно быстрее и эффективнее отгружать больше топлива."
 tech_logistics_company5: "Снабжение V; Внедорожная рота снабжения"
 tech_logistics_company5_desc: "Вы не можете всегда полагаться на использование инфраструктуры и дорог вашего врага. Они могут быть уничтожены в результате действия выжженной земли или вообще не существовать. На этой ноте вы не всегда можете рассчитывать на то, что ваша собственная инфраструктура не будет разрушена или даже не будет существовать. Важно, чтобы транспортные средства снабжения и логисты могли передвигаться по бездорожью и находить новые пути для улучшения движения."
 tech_logistics_company6: "Снабжение VI; Эффективная доставка воздухом"
 tech_logistics_company6_desc: "Воздушные миссии и десантные поставки могут быть потеряны, уничтожены, захвачены врагом или партизанами или даже занять большое количество топлива для доставки. Пересмотрев планы десантирования и сами парашюты, воздушные миссии могут доставлять необходимое снабжение в более короткие сроки."
 tech_logistics_company7: "Снабжение VII; Автомобили большой вместимости"
 tech_logistics_company7_desc: "Когда все методы управления и протоколы были полностью оптимизированы, единственное, что осталось сделать, это просто сделать транспортные средства сильнее, эффективнее и удерживать больше. Вот и все, что от него требуется."
  
