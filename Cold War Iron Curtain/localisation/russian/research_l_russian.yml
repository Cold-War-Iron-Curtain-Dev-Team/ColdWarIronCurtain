 consumer_electronics_VI: "Смартфоны"
 consumer_electronics_VII: "Информационная эра"
 consumer_electronics_VIII: "Эргономичная бытовая электроника"
 consumer_electronics_X: "Семейные роботы XX Corp"
 consumer_electronics_I_desc: "Базовая Бытовая электроника представляет собой массовое развертывание ранних электронных систем для коммерческих и личных потребителей. Эти базовые электронные устройства не только обеспечивают лучшее качество жизни, но и прокладывают путь к тому, чтобы общество в целом стало более продуктивным. Ранние коммерческие приложения включают в себя телевизоры улучшенного качества, коммерческие приборы для расчета финансов и бесчисленные базовые электронные системы, которые помогают в коммерческой производительности и личном качестве."
 #consumer_electronics_II_desc: "Cellular Phones are mobile devices used to communicate wirelessly. They can communicate over long distances and be used to make international phone calls via satellite far beyond the range of regular landlines. Cellular phones greatly aid in interoperability nationally and abroad and bolster commercial incomes. Additionally, personally available consumer cellular phones improve the QoL."
 consumer_electronics_III_desc: "Персональные компьютеры-одно из самых важных достижений в истории человечества. Персональные компьютеры невероятно полезны для любых целей. Разработка персональных потребительских компьютеров для коммерческих и личных целей является огромным благом для общества. В коммерческом плане персональные компьютеры революционизируют коммерческую логистику, производительность офисов и финансовых услуг, Бизнес-планирование, коммуникацию и заключение сделок и многое другое. Кроме того, персональные компьютеры произвели революцию в образовании и медицине, обеспечив лучшее качество жизни."
 consumer_electronics_IV_desc: "Современная бытовая электроника представляет собой новую эру электроники, в которой универсальность и потенциальное применение электроники становятся универсальными. На данный момент бытовая электроника может быть использована практически для любых целей. Эта технология представляет собой разработку программ и компьютеров, которые могут быть использованы для любых целей и практически в каждом бизнесе и учреждении. Именно в этот момент персональные компьютеры используются повсеместно в обществе (при условии, что ваше общество может себе это позволить)."
 consumer_electronics_V_desc: "Передовая Бытовая электроника представляет собой эру электроники, где доступность электроники выходит за рамки возможностей компьютеров практически в каждом домашнем хозяйстве первого мира. Именно на этом уровне электроника становится повсеместно используемой в результате ее доступности. Кроме того, существуют многочисленные усовершенствования существующих приложений и систем, которые позволяют применять эти компьютеры для более широкого спектра элементов."
 consumer_electronics_VI_desc: "Информационная эра потребительской электроники представляет собой эпоху, когда электроника постоянно совершенствуется в эргономике и находит исследовательские приложения. Именно на этом этапе компьютерные системы становятся более удобными для пользователя, чем когда-либо прежде, и дают толчок к улучшению качества жизни. В течение следующего десятилетия потребительская электроника будет исследовательской и инновационной, пытаясь решить проблемы, о которых люди не знали, и заполнить потребности, о которых они никогда не знали. Начиная со смартфонов и заканчивая потоковыми сервисами, потребительская электроника 2000-2010 годов ознаменует собой истинное начало информационной эры ™ ."
 consumer_electronics_X_desc: "XX Inc., производитель Little Helper, известен своими продуктами робототехники. Сделанный из первозданной белизны, гладких линий и коротких, но эффективных ног, маленький помощник был рожден, чтобы помогать людям! В Little Helper встроены различные функции. От охранной сигнализации и домашней системы мониторинга до приготовления кофе и управления светом-здесь есть все, что нужно дому! Если бы маленький помощник обладал способностью к эмоциям, он мог бы очень гордиться собой за то, что помогает людям."
 consumer_electronics_stfu_tt: "§G+15%§! §YOffice Park§! Доход"
  
  #Coms 
 coms_I: "Современные стационарные телефоны"
 coms_II: "Спутниковая связь"
 coms_III: "Набор номера"
 coms_IV: "2G"
 coms_V: "3G"
 coms_VI: "4G LTE"
 coms_VII: "Волоконная оптика"
 coms_VIII: "5G"
 coms_I_desc: "Телефоны претерпели значительные усовершенствования с момента их первого создания Александром Грэхемом Беллом в 1870-х гг. В 1878 г. в США открылась первая коммерческая телефонная станция США. В 1915 году был сделан первый междугородный телефонный звонок от побережья до побережья. К 1930-м и 40-м годам использование телефона стало обычным явлением во всем развитом мире и использовалось широко и часто. Вскоре после войны телефоны достигли такого уровня, что практически любой человек мог позвонить кому угодно, и телефон был очень широко доступен. К началу 50-х годов телефоны стали более надежными и могли общаться быстрее, чем когда-либо."
 coms_II_desc: "В начале 60-х годов началась первая частная космическая программа. Эта программа, спонсируемая AT&T, Bell Telephone Labs и французской национальной PTT, была предназначена для создания первого массива спутниковой связи. 22 ноября 1963 года ретранслятор НАСА-1 передал первый транстихоокеанский сигнал. signal.It пройдут годы, прежде чем будет построено достаточное количество спутников и ретрансляторов для широкого коммерческого использования. Однако первыми разработчиками этой новой технологии станут военные, разведывательные службы и руководители предприятий. Непрерывные инвестиции и быстрое увеличение числа пользователей привели к тому, что проект спутниковой связи смог продолжаться и охватывать все большее число людей."
 coms_III_desc: "Метод доступа в интернет и передачи данных, который использует коммутируемые телефонные сети общего пользования для установления соединения путем набора телефонного номера интернет-провайдера на линии. Затем эти данные передаются поставщику интернет-услуг по телефонной линии. Модем кодирует и декодирует информацию в аудиосигналы и из них для передачи данных. Коммутируемые соединения очень эффективны, так как они нуждаются только в инфраструктуре телефонной сети для передачи информации. Dialup способен передавать ~50 кб/с."
 coms_IV_desc: "2-е поколение сотовой технологии. Сети 2G гораздо более способны к сложному шифрованию и способны передавать больше данных. 2G позволил беспроводной связи стать заметно более эффективной, чем dialup, достигая скорости около ~250 Кбит / с. Для достижения этих скоростей 2G требует более мощного беспроводного оборудования, высокоэффективных беспроводных протоколов, а с внедрением 2G EDGE позже приходит кодирование 8PSK и стандартизация домена с коммутацией каналов."
 coms_V_desc: "3-е поколение сотовых технологий. Сети 3G имеют гораздо более сильную проникающую способность по сравнению с 2G и в результате могут достигать более дальних длин. Сети 3G могут достигать скорости ~3 Мбит / с. подобно созданию 2G, 3G требует более мощного коммуникационного оборудования."
 coms_VI_desc: "4-е поколение сотовых технологий и вершина прогресса в области коммуникаций, которая позволяет использовать потоковые сервисы, высокоскоростной интернет и интеллектуальные сети. Сети 4G могут достигать скорости ~12,5-125мб / С, что является важным оборотом для высокоскоростных сетей большой емкости. Long Term Evolution (LTE) - это технический стандарт беспроводной широкополосной связи, который увеличивает скорость связи."
 coms_VII_desc: ""
 coms_VIII_desc: "Представьте себе это. Вы играете в Splatoon 3, наслаждаясь сверхбыстрым интернетом и без задержек с вашей новой башней 5G. Внезапно ты становишься ребенком. Теперь ты-кальмар. Ты ребенок, ты кальмар, ты ребенок, ты кальмар. Ты мутируешь, выходя из-под контроля!"
  
  ##CWIC INDUSTRY 
 ww_production: "Производство времен ВМВ"
 ww_production_desc: "Во время Второй мировой войны промышленный потенциал и производительность были прижаты, чтобы улучшить выпуск продукции во время войны. Основные достижения были достигнуты в области логистических сетей и промышленных организаций. Были организованы многочисленные логистические сети и формализованы транспортные связи. Многие страны, непосредственно участвовавшие во Второй мировой войне, формализовали транспортные связи и сделали приоритетом предотвращение узких мест в перевозках."
 ww_oil: "Материология времен ВМВ"
 ww_oil_desc: "Во время Второй мировой войны были различные улучшения в металлургии и разработке лучших сплавов в рамках военных инноваций. Алюминиевые сплавы, которые были созданы во время Второй мировой войны, позволили самолетам сохранить легкость, а также повысить долговечность в бою. Соотношение сталь: углерод также было оптимизировано во время Второй мировой войны, что позволило получить лучшие материалы. Кроме того, многие страны приняли стандартизированные таблицы и данные по материалам, а некоторым странам даже было предложено официально оформить исследования в рамках проектов по материалам."
 ww_construction: "Строительство времен ВМВ"
 ww_construction_desc: "Давление Второй мировой войны привело к развитию различных методов управления строительством, которые привели к повышению уровня эффективности на месте. Наиболее заметным улучшением практики строительства на местах стала широко распространенная стандартизация многих различных методов строительства и широко распространенный обмен строительными технологиями и механизмами."
  
  #Chemistry 
 chemistry_I: "Химическая спектроскопия"
 chemistry_I_desc: "Спектроскопия-это метод химического анализа, который использует инфракрасную, электромагнитную визуализацию, рентгеновскую спектроскопию или массовые распады для определения молекулярного состава конкретного соединения и его деталей. Используя эти методы в лаборатории, образец может быть проанализирован для обеспечения качества в промышленном химическом процессе или для определения химического состава неидентифицированного химического вещества."
 chemistry_II: "Фурье-спектроскопия"
 chemistry_II_desc: "Метод преобразования Фурье - это метод измерения, с помощью которого проводится спектроскопия. Используя измерения во временной или пространственной областях, все формы спектроскопии улучшаются и становятся более точными с помощью этого метода.метод преобразования Фурье преобразует необработанные данные из спектроскопического измерения в фактический спектр, который может быть проанализирован более легко."
 chemistry_III: "Стереоселективные реакции окисления"
 chemistry_III_desc: "Стереохимия-это раздел органической химии, который имеет дело со стереоконфигурациями в молекуле. Стереоконфигурации - это специфические способы, которыми располагаются совершенно разные участки в соединении молекулы. Различные конфигурации одной и той же молекулы имеют одинаковую молекулярную структуру и компоненты, но совершенно разные формы в результате различных порядков, в которых расположены сложные соединения."
 chemistry_IV: "Фуллерены и теоретические наноматериалы"
 chemistry_IV_desc: "Фуллерен - это макромолекула, состоящая из атомов углерода, образующих полую клетку. Фуллерены используются в качестве систем доставки лекарств в организм, в качестве смазочных материалов или катализаторов.\nНаноматериалы - это высокоразвитые материалы, которые теоретически должны быть изготовлены с использованием нанотехнологий. Без доступа к нанотехнологиям, эти материалы должны были бы быть произведены по крайней цене, но все еще имеют редкое применение в суперкомпьютерах, науке или чрезвычайно передовых высокотехнологичных товарах."
 chemistry_V: "Углеродные нанотрубки"
 chemistry_V_desc: "Углеродные нанотрубки, такие как графен, представляют собой канальцы атомов углерода, которые образуют макромолекулы, подобные фуллеренам, но в форме трубки вместо сферических полых клеток. Графен является одним из самых прочных материалов, известных человеку, но также очень трудно производить en mass. Они используются в высокоразвитых компьютерах, военной технике и передовых промышленных процессах в небольших количествах для заполнения рабочих мест, которые не могут быть заполнены никаким другим материалом."
 chemistry_VI: "Жидкокристаллические дисплеи (LCD)"
 chemistry_VI_desc: ""
 chemistry_VII: "Зеленая химия"
 chemistry_VII_desc: ""
 industry_chemistry_tt: "Дает §G+15%§! §YГидрометаллургическим заводам§!\n"
  
  #Plastics 
 plastics_I: "Полипропилен"
 plastics_I_desc: "Полипропилен-это термопластик, который частично кристаллизуется и используется в деталях машин, упаковке и товарах широкого потребления. Это чистый углеводород, который не содержит других материалов и строится с помощью цепной полимеризации. Полипропилен также имеет более высокую температуру плавления, чем предыдущие пластмассы, что делает его значительно более пригодным для использования синтетическим материалом, чем предыдущие поколения."
 plastics_II: "Кевлар"
 plastics_II_desc: "Кевлар-это термостойкое синтетическое волокно, которое обычно известно как очень прочное и используется в пуленепробиваемых и ударопрочных жилетах. Он имеет чрезвычайно высокую прочность на растяжение и малый вес с отношением прочности к весу в 5 раз больше, чем сталь. Он также может использоваться в навигационном режиме или в потребительских приложениях. Кевлар синтезируется из нескольких различных промежуточных мономеров в реакции конденсации и производит соляную кислоту в качестве побочного продукта."
 plastics_III: "Полиарилэфирэфиркетон"
 plastics_III_desc: "Полиарилэфиркетон [PEEK] - это органический термопластик, используемый в машиностроении. Он очень прочен и используется при изготовлении поршней, насосов, подшипников, компрессорных пластин, электрической изоляции и медицинских имплантатов. Материал получают путем ступенчатой полимеризации с использованием катализатора и 4-4-дифторбензофенона и гидрохинона. Его нужно проводить примерно при 300 градусах Цельсия."
 industry_plastics_III_tt: "Industrial Park §G-10% £resources_strip|5 Office Park §G-10% £resources_strip|2 §!"
 plastics_IV: "Пластиковые полупроводники"
 plastics_IV_desc: "Полупроводники исторически изготавливались из хрупких материалов на основе кремния. Однако полимерные полупроводники могут образовывать гораздо более прочные и гибкие основы для электроники, а также гораздо дешевле и легче. Они сделаны из сложных тонко собранных полимеров, расположенных таким образом, что вместо одного неэлектрического полимера возникают электрические свойства. Эти проводники также более эффективны и, как таковые, снижают общее энергопотребление в устройствах, которые их используют."
 plastics_V: "Этилен тетрафторэтилен (ETFE)"
 plastics_V_desc: ""
 plastics_VI: "Органические полимеры (Биопластик)"
 plastics_VI_desc: ""
 plastics_VII: "Углеродные армирующие полимеры"
 plastics_VII_desc: ""
 industry_plastics_VI_tt: "Industrial Park §G-10% £resources_strip|1 Consumption§!"
 industry_plastics_tt: " Дает §G+15%§! §YНефтехимическим заводам§!\n"
  
  #Materials 
 materials_I: "Титановые сплавы"
 materials_I_desc: "Титановые сплавы - это металлургические смеси титана и других металлов. Они обладают высокой прочностью на растяжение и экстремальной коррозионной и атмосферостойкостью. Титан сам по себе, хотя и прочный, является хрупким металлом. С добавлением других металлов, таких как ванадий или алюминий, он может сохранить большую часть своей прочности, но также получить пластичность. Хотя он не применим для строительства или несущих конструкций, он используется в самолетах, космических аппаратах, медицинских устройствах, транспортных средствах и бытовой электронике."
 materials_II: "Термополированное стекло"
 materials_II_desc: "Форма стекла, созданная плавающим расплавленным стеклом на расплавленных металлах, таких как олово. Это придает ему равномерную толщину. Однородность делает его более подходящим для коммерческого и промышленного использования в оптике и большинстве форм строительства. Практически все стекло, используемое в современную эпоху, - это флоат-стекло, потому что его изготовление недорого, так как это просто натриево-известковое стекло, образованное на небольших количествах расплавленных дешевых металлов с низкой температурой плавления, таких как олово. Кроме того, флоат-стекло может быть дополнительно обработано для создания армированного или матового стекла."
 materials_III: "Керамические матричные композиты"
 industry_materials_III_tt: "§YЛитейный округ§! §G-10% £resources_strip|7 потребления§!"
 materials_III_desc: ""
 materials_IV: "Металлические матричные композиты"
 industry_materials_IV_tt: "§YЛитейный округ§! §G-10% £resources_strip|1 потребления§!"
 materials_IV_desc: "Композиты с металлической матрицей - это композитные материалы с 2 или более компонентами. Иногда металлические матричные композиты формируются с другими материалами в сочетании с металлом. ММК обычно используются в высокопроизводительных режущих инструментах из карбида вольфрама, броне, дисковых тормозах, автомобильных деталях, научном и лабораторном оборудовании и могут быть объединены с графеном для создания очень мощных электронных модулей для дорогостоящего электронного оборудования."
 materials_V: "Нанокомпозиты"
 materials_V_desc: "Нанокомпозиты - это материалы, использующие наночастицы в сочетании с другими матричными композитами. Эти добавки приводят к невероятным улучшениям механической прочности и проводимости, что делает матрицы способными достигать еще больших результатов с тем, в чем они используются. Это позволяет электронике, промышленному и коммерческому оборудованию, а также военным системам достигать более высоких уровней производительности с лучшими матрицами."
 materials_VI: "Пенометалл"
 materials_VI_desc: ""
 materials_VII: "Электрически очищенные металлы"
 materials_VII_desc: ""
 materials_VIII: "Автоматический выбор состава материала"
 materials_VIII_desc: ""
  
 industry_materials_tt: "Дает §G+15%§! §YЛитейный округ§!\n"
  
  #Civil engineering 
 civil_engineering_I: "Предварительно напряжённый железобетон"
 civil_engineering_I_desc: "Бетон всегда испытывал трудности при работе с большими нагрузками и напряжениями современных строительных проектов. Как таковая, она в конечном счете была усилена. Однако есть еще много проектов, которые все еще слишком требовательны к бетону, чтобы справиться с ними. Предварительно напряженный бетон был разработан, чтобы позволить бетону быть усиленным еще больше. В предварительно напряженном бетоне высокопрочные стальные сухожилия напряжены [или "сжаты"], и сам бетон укладывается поверх этого, чтобы сформировать предварительно напряженные бетонные секции."
 civil_engineering_II: "Метод основных тонких элементов"
 civil_engineering_II_desc: "Метод тонких элементов [МКЭ] - это математический метод решения инженерных и физических задач в таких областях, как структурный анализ, теплопередача, поток жидкости и электромагнитный потенциал. Для решения задач с помощью МКЭ большие задачи делятся на небольшие задачи, известные как “конечные элементы”. Разделяя таким образом большие инженерные задачи, их можно решать быстрее и точнее, а также выявлять конкретные мелкие проблемные области."
 civil_engineering_III: "Метод последовательной добычи"
 civil_engineering_III_desc: "Метод последовательных раскопок [SEM] - это метод создания и проектирования туннелей. Геологическая прочность камня используется максимально для снижения затрат. Контролируя деформацию грунта при прокладке туннеля и имея опору, деформирующую нагрузку, естественная прочность камня используется в меру своих возможностей. Туннель последовательно выкапывается и поддерживается с каждой проблемой, анализируемой по пути, чтобы обеспечить адаптацию к горным условиям по мере их изменения."
 civil_engineering_IV: "Современные структурные теории"
 civil_engineering_IV_desc: "По мере усложнения конструкций необходимо совершенствовать основные концепции, лежащие в основе решения инженерных задач. С появлением современных структурных теорий, упрощающих расчеты, таких как теория оболочечных мембран, которая утверждает, что тонкие цилиндрические оболочки имеют незначительное механическое движение, и новые формулы для более эффективного расчета мембранных и сдвиговых сил, можно решить больше инженерных проблем за более короткий промежуток времени"
 civil_engineering_V: "Щебёночно-мастичный асфальтобетон"
 civil_engineering_V_desc: "Форма дорожного покрытия, которая устойчива к деформации и очень долговечна. SMA состоит из агрегатного содержимого, которое образует внутренний каменный скелет. Сам каменный каркас сделан из асфальта, общего наполнителя, такого как пластмассы, резина, клеи и волокна. Каменный каркас обеспечивает больший контакт камня с камнем, чем обычные асфальты, что приводит к более высокой прочности связующего и меньшему количеству воздушных пустот."
 civil_engineering_VI: "Структурная пучковая система труб"
 civil_engineering_VI_desc: "Пучковая трубчатая структурная система, также известная как поколение 4 или “Тип 4” башенной структурной системы. это способ возведения больших башен в колоннах. Некоторые колонны короче других и расположены дальше друг от друга и помогают поддерживать большие колонны внутри одной и той же башни. Это помогает небоскребам становиться прочнее и противостоять боковым силам. Это также позволяет башням принимать различные формы, отличные от коробок, чтобы быть эффективными экономически и структурно, что делает города менее уродливыми."
 civil_engineering_VII: "Продвинутый вычислительный анализ"
 civil_engineering_VII_desc: "Со все более сложными структурами и системами инженерные проблемы становятся все более сложными. Даже с такими упрощениями, как усовершенствованные мембранные и структурные теории, система трубных Пучков, тонкие элементы и другие методы, которые делают конструкцию более модульной и простой в обработке, потребности современного мира становятся все более сложными. В конце концов проблемы становятся слишком утомительными для инженеров, чтобы решать их без посторонней помощи."
 civil_engineering_VIII: "Конструкционная сталь высокого качества"
 civil_engineering_VIII_desc: "Кислородное сталеплавильное производство создает более качественную конструкционную сталь, чем прежние методы.Кислородные печи выдувают большое количество чистого кислорода в расплавленный чугун и металлолом и завершают его загрузку быстрее, чем мартеновские методы.До 350 метрических тонн железа и лома стали могут быть преобразованы в высококачественную сталь менее чем за час. Кроме того, это значительно снижает стоимость стали и делает систему более устойчивой за счет сокращения воздушных отходов и повышения энергоэффективности системы."
 civil_engineering_IX: "Мощенная опалубка"
 civil_engineering_IX_desc: "Vетод, с помощью которого дороги прокладываются непрерывно. Используя современные машины для рассыпки/разбрасывания, PCC или асфальтовая масса вытягиваются непрерывно, чтобы обеспечить более последовательную конструкцию, которая производится быстрее. После этого асфальтоукладчик стяжает излишки и сглаживает структуру и, возможно, размещает подкрепления по мере движения.таким образом, техническое обслуживание дорог может выполняться быстрее, а тонкие тротуары могут быть сделаны с большей скоростью."
 civil_engineering_X: "Крупномасштабное использование систем КАД"
 civil_engineering_X_desc: "Когда впервые были разработаны вычислительные инструменты, их потенциал и возможности были быстро продемонстрированы. Развитие современных средств компьютерного проектирования и их широкомасштабное внедрение приводит к массовому повышению эффективности архитектурного и инженерного проектирования. Эти инструменты помогают при макро-обработке повторяющихся задач, поставляются с компьютерными средствами для решения сложных задач и другими инструментами, которые приводят к повышению эффективности."
 civil_engineering_XI: "Подвижная конструкция"
 civil_engineering_XI_desc: ""
 civil_engineering_XII: "Облачное интегрированное конструирование"
 civil_engineering_XII_desc: ""
 civil_engineering_XIII: "«Умная» конструкция"
 civil_engineering_XIII_desc: ""
 civil_engineering_XIV: "Устойчивое строительство"
 civil_engineering_XIV_desc: ""
 civil_engineering_XV: "Быстрая деконсрукция"
 civil_engineering_XV_desc: ""
  
  
  #Excavation 
 excavation_I: "Крупные карьеры"
 excavation_I_desc: "Примерно в 1950-х годах были разработаны новые методы добычи и оборудование, позволяющие собирать камень или гравий в больших карьерах. Современные гусеничные машины и вскрышное оборудование были созданы специально для того, чтобы обеспечить массовую добычу и модульные размеры котлованов. Создание модульных ярусов, которые, как планируется, позволят оборудованию перемещаться вверх и вниз по карьерам с относительно быстрыми темпами со стандартизированными склонами и внутренними логистическими системами и ретрансляторами, позволит более крупным карьерам оставаться эффективными."
 excavation_II: "Экстракторы ковшовых колес"
 excavation_II_desc: "Экстракторы ковшового колеса - это части тяжелого наземного горного оборудования, которые добавляют несколько ковшей экстрактора к колесу, которые откладывают свои грузы на дорожку, когда они копают. Эти экстракторы непрерывно черпают материал по мере вращения колеса и способны вырезать вертикальные секции в яме. Они очень эффективны при уборке или удалении сыпучего материала.на сегодняшний день ковшовые колесные экстракторы являются самыми тяжелыми наземными транспортными средствами, когда-либо производившимися."
 excavation_III: "Добыча на горных вершинах"
 excavation_III_desc: "Добыча полезных ископаемых с удалением горных вершин-это метод поверхностной добычи полезных ископаемых на вершине или гребне горы. При удалении вскрышных пород с вершины или гребня создается достаточно большое ровное пространство, которое может быть заминировано вниз. Со временем все больше вскрышных пород удаляется с краев пластов, чтобы позволить более глубокие ямы с вершин гор. Этот метод позволяет открытым способом добывать богатые ресурсы, которые были подняты сейсмическим образованием гор, без необходимости создания глубоких шахт для их добычи."
 excavation_IV: "Конвейеры в карьерах"
 excavation_IV_desc: ""
 excavation_V: "Дистанционное бурение"
 excavation_V_desc: ""
 excavation_VI: "Бурение с термическим расщеплением"
 excavation_VI_desc: ""
 excavation_VII: "Автономное снаряжение/Шахтное охлаждение"
 excavation_VII_desc: ""
 industry_excavation_tt: "§G+10%§! £resources_strip|1 £resources_strip|2 £resources_strip|4 £resources_strip|5 £resources_strip|6 §YResource Gathering Efficiency§!"
  
  #Agriculture 
 industry_agriculture_tt: "§G+15%§! §YАгропромышленный Комплекс§! £resources_strip|3 и доход\n"
 agriculture_I: "Хелаты"
 agriculture_I_desc: "Хелатирование-это связывание органических ионов и молекул с ионами металлов. Он включает в себя множественные координатные связи между лигандом и центральным атомом металла. Хелаты очень полезны для обеспечения пищевых добавок. В сельском хозяйстве хелаты используются для приготовления сложных удобрений и доставки важных микроэлементов растениям для улучшения их здоровья и питания. Это значительно улучшает сельскохозяйственную продукцию, так как предыдущие удобрения не обеспечивали растения металлическими микроэлементами."
 agriculture_II: "Широкое применение пестицидов"
 agriculture_II_desc: "\n\nВредители часто создают проблемы для фермеров, поскольку они потребляют урожай. Были приняты различные методы для уменьшения проблем с вредителями, такие как ограждение или использование ароматических репеллентов. Однако они не смогли остановить всех вредителей.принимая яды, которые мало влияют на человека, но смертельны для насекомых-вредителей, и внедряя их в больших масштабах, многие колонии насекомых, живущие вблизи ферм, могут быть отбракованы.\n\n§R Это гораздо лучшая альтернатива напалмированию дикой природы, но она была подвергнута критике как далеко не такая крутая."
 agriculture_III: "Почва без обработки"
 agriculture_III_desc: "Устойчивый метод ведения сельского хозяйства, при котором почва не разрушается и не переворачивается при обработке почвы. Это значительно уменьшает эрозию почвы и улучшает срок службы почвы. Однако в этом методе необходимо применять несколько методов. Покровные культуры должны бороться с сорняками, а сами поля должны быть ротированы. Дерновые водостоки должны быть установлены для предотвращения роста оврагов, изношенных водой оврагов. Сельскохозяйственная техника должна проводить сеялку прямого посева. Излишки остатков необходимо регулярно удалять."
 agriculture_IV: "Современное сельскохозяйственное оборудование"
 agriculture_IV_desc: ""
 agriculture_V: "Спутниковое отслеживание урожая"
 agriculture_V_desc: "Спутниковое слежение за посевами - это спектральный мониторинг развития сельскохозяйственных культур. Сведения о развитии сельскохозяйственных культур индексируются и вводятся в данные, которые могут быть обработаны вручную или автоматически, чтобы обеспечить возможность в режиме реального времени реагировать на проблемы со здоровьем сельскохозяйственных культур и диагностировать их."
 agriculture_VI: "ГМО"
 agriculture_VI_desc: "Организмы (микроорганизмы, растения, животные), геном которых был искусственно и целенаправленно изменен ( модифицирован) введением определенных генов другого живого организма, методами генной инженерии."
