  #Infrastructure 
 ww_infra: "Инфстрактура ВМВ"
 ww_infra_desc: "Фундаментальные проекты и форматы инфраструктуры между войнами и Второй мировой войной. Включает в себя широкий спектр железнодорожных и автомобильных систем, составляющих основные логистические системы и основы городской водной инфраструктуры."
 inframanagement_I: "Городское планирование"
 inframanagement_II: "Современная инфраструктура"
 inframanagement_III: "Планирование промышленного пространства"
 inframanagement_IV: "Усовершенствования организации инфраструктуры"
 inframanagement_V: "Устойчивые дорожные материалы"
 inframanagement_VI: "Улучшенное обслуживание инфраструктуры"
 inframanagement_VII: "Компактные города"
 industry_inframanagement_VII_tt: "Ключевые технологии в §CРазвертывание умных городов§!!"
 inframanagement_VIII: "Социально-экологические инициативы"
 industry_inframanagement_VIII_tt: "§G-7.5%§! £environmental_strip §YEnvironmental Externalities§! §BСКОРО§!"
 inframanagement_I_desc: "Городское планирование - это процесс планирования расширения или улучшения городской среды. Включает в себя тщательное управление и системы, предназначенные для разделения строительных специализаций на резиденции, торговлю, промышленность или любой гибрид вышеперечисленного. Градостроительство стремится разместить здания в районе, где они могут наиболее эффективно функционировать друг с другом, и обеспечить специализированную инфраструктуру для поддержки предприятий в этой области.\nЭта технология представляет собой фундаментальные послевоенные системы городского планирования, которые адаптируются к потребностям современной промышленности, выходящим за рамки базовых систем городского планирования индустриальной эпохи. Значительно помогает будущему расширению инфраструктуры."
 inframanagement_II_desc: "Современное оборудование для строительства инфраструктуры необходимо для строительства все более сложных инфраструктурных сетей атомной эры. Высокопрочные гидравлические системы, подъемные скребки, гидравлические бульдозеры, трубоукладчики, гидравлические мостовые мельницы и бесчисленное множество других тяжелых транспортных средств необходимы для строительства инфраструктуры атомной эры в разумные сроки. Как правило, эта технология представляет собой переход от кабельно-центрических систем к гидравлике."
 inframanagement_III_desc: "Помимо градостроительства, конкретное планирование промышленных пространств и организация их таким образом, чтобы всем отраслям промышленности в районе было легко работать, хранить товары и получать поставки, могут значительно улучшить строительство промышленной инфраструктуры и повысить пропускную способность промышленности. Специально спланированные пространства для текущей и будущей промышленной инфраструктуры прокладывают путь для легкого улучшения и расширения промышленных пространств."
 inframanagement_IV_desc: "Общее улучшение управления инфраструктурой. Это предполагает внедрение более совершенных методов управления и организации, увеличение числа классификаций дорог и совершенствование систем и протоколов для использования приводов. Эти организационные усовершенствования обычно принимаются во внимание для того, чтобы городские планировщики могли лучше использовать местность и облегчить модернизацию/техническое обслуживание."
 inframanagement_V_desc: "Устойчивые и прочные дорожные материалы снижают затраты на строительство и содержание дорог, а также важны для того, чтобы выдерживать вес тяжелого промышленного транспорта. Кроме того, устойчивые дорожные материалы легче перерабатывать после фрезерования, что еще больше снижает затраты на техническое обслуживание и строительство. Более низкое время и затраты на строительство/техническое обслуживание означают, что строительные бригады и государственные служащие могут тратить больше времени на расширение существующей инфраструктуры или, по крайней мере, тратить меньше времени на работу, что, мягко говоря, приветствуется."
 inframanagement_VI_desc: "Улучшение обслуживания инфраструктуры с помощью более совершенных процедур и оборудования облегчает обслуживание и строительство больших объемов инфраструктуры. Включает в себя такие достижения оборудования, как эргономичное управление, высокоскоростное оборудование, мощные современные двигатели, гибридное многоцелевое оборудование, интеграцию электроники и современную гидравлику. Процедурные усовершенствования включают в себя улучшение планирования ремонтных работ и дистанционного мониторинга."
 inframanagement_VII_desc: ""
 inframanagement_VIII_desc: "Инициативы, направленные на улучшение социального положения городского образа жизни. Существует множество психологических и социальных проблем, которые могут возникнуть в процессе развития города. Изолированные общины, отсутствие вовлеченности, проблемы молодежи, банды, плохие отношения с полицией, которые могут возникнуть в результате злоупотребления властью или других причин, и другие ситуации могут быть решены с помощью социальных инициатив для решения социальных проблем, с которыми сталкиваются эти общины. Даже без нерешенных проблем социальные инициативы могут улучшить уже сложившиеся сообщества и упреждающе решать проблемы до того, как они станут проблемой. Больше регенерации и модернизации зданий для лучшего энергосбережения и водосбережения, контроля за бурыми месторождениями (заброшенными участками, которые представляют проблемы загрязнения), лучшего управления отходами и множества других улучшений, способствующих устойчивому развитию."
 infrastate_I: "Современные железные дороги"
 infrastate_II: "Магистрали"
 infrastate_III: "Инфраструктура особого назначения"
 infrastate_IV: "Скоростные железные дороги"
 infrastate_V: "Промышленные скоростные автомагистрали с контролируемым доступом"
 infrastate_VI: "Поезда на магнитной подушке"
 infrastate_VII: "Вакуумный поезд/Компактные пути"
 infrastate_I_desc: "Дизель-электрические двигатели, послевоенные гидравлические системы и системы железнодорожной инфраструктуры большой мощности значительно повышают мощность и эффективность железных дорог. Дизель-электрические двигатели используют дизельные двигатели для привода генератора постоянного или переменного тока для питания тягового двигателя и повышения скорости и топливной экономичности поездов. Кроме того, усовершенствование железных дорог с помощью железнодорожного оборудования, оптимизированного для быстрой погрузки и разгрузки поездов, сводит к минимуму количество времени, которое поезда на оживленных линиях должны проводить на станции, и позволяет им сделать больше."
 infrastate_II_desc: "Исключительно широкие магистрали с регулируемым доступом, предназначенные для высокоскоростного автомобильного движения и позволяющие промышленному, коммерческому, гражданскому или правительственному транспорту пересекать большие участки суши. Артериальные автострады позволяют дорогам с высокой пропускной способностью доставлять трафик к ним через коллекторные дороги, которые позволяют движению ускоряться и сливаться с артериальными автострадами или покидать их. Правильное планирование и математика имеют решающее значение, поскольку магистральные автострады, которые не предоставляют достаточного пространства для коллекторных дорог, могут вызвать проблемы безопасности, в то время как чрезмерно большие коллекторные дороги могут просто тратить пространство и деньги и, в силу их природы и интенсивного использования, вызывать проблемы с обслуживанием."
 infrastate_III_desc: "Стихийные бедствия, войны, чрезвычайные ситуации и бесчисленные другие проблемы могут привлечь подкрепление службы издалека. Создание инфраструктуры ограниченного доступа может позволить полиции, пожарным, аварийным, военным или другим транспортным средствам реагировать на ситуации более оперативно, не вступая в прямую конкуренцию с потенциально паникующими гражданскими транспортными средствами. Инфраструктура особой ситуации может позволить полицейским подкреплениям прибывать в другие города более оперативно, пожарным или аварийным службам реагировать более быстро, военному снабжению улучшаться, среди прочих улучшений. Кроме того, эта инфраструктура, как правило, может использоваться всеми государственными перевозчиками для любых целей, которые правительство сочтет необходимыми."
 infrastate_IV_desc: "Высокоскоростная железная дорога (ВЖД) работает значительно быстрее, чем традиционные железные дороги. ВЖД использует интегрированную систему специализированного подвижного состава и выделенных путей для движения со скоростью свыше 200 километров в час (120 миль в час). Широко известные как скоростные поезда, высокоскоростные железные дороги позволяют промышленным предприятиям осуществлять доставку в короткие сроки на очень большие расстояния или перевозить пассажиров в рекордные сроки, чтобы повысить производительность и легко справляться с аварийными или экспресс-поставками, не полагаясь на более дорогие экспресс-рейсы. Кроме того, поезда HSR могут быть более экономичными и даже полностью электрическими, что позволяет им снизить зависимость от ископаемого топлива в стране."
 infrastate_V_desc: "Фактически являясь гибридом между магистральными дорогами и магистральными автострадами, промышленные скоростные дороги с регулируемым доступом специализируются на удовлетворении потребностей промышленного движения и позволяют RGO или отраслям промышленности перевозить продукцию через большие площади без необходимости делить путь с меньшим движением или менее профессиональными водителями. Кроме того, более предсказуемое движение сводит к минимуму пробки, вызванные неустойчивыми или нетерпеливыми непрофессиональными водителями, что обеспечивает более стабильные сроки доставки."
 infrastate_VI_desc: "MAGLEV  используют магниты для отталкивания и выталкивания поезда с рельсов и имеют другой набор для перемещения надземного поезда вперед, эффективно создавая поезд без трения, который может двигаться с экстремальными скоростями по полностью электрифицированной линии. Они чрезвычайно быстры, бесшумны, плавны и имеют значительно лучшую тормозную систему. Система MAGLEV настолько мощна, что единственным практическим ограничением для линий MAGLEV является безопасность пассажиров и проводника, которых она перевозит, и количество энергии, которое она использует. Хотя в будущем могут быть использованы удаленные системы, в которых ограничением станет скорость, с которой магнит может двигаться, и система может стабилизировать сам поезд."
 infrastate_VII_desc: "Vactrains-это линии магнитного поля, которые значительно более энергоэффективны и могут двигаться с гораздо более высокими скоростями, преодолевая сопротивление, просто заставляя поезд двигаться в вакуумном туннеле. Чтобы воспользоваться преимуществами более высоких скоростей, вагоны должны быть дистанционно управляемыми, не содержать пассажиров и быть отделены от традиционных пассажирских поездов на магнитной подвеске, которые должны ограничивать свои скорости для безопасности пассажиров или просто работать на отдельных линиях метро на более низких скоростях, чтобы избежать узких мест в дистанционно управляемых грузовых вагонах.\nКомпактные пути-это технологически продвинутые системы автострад, которые разумно управляют и направляют движение и могут включать электронные системы наведения и мониторинга, чтобы консультировать как самостоятельное движение, так и ручное движение, а также избегать пробок или перенаправлять трафик, чтобы избежать скоплений."
 inframunicipal_I: "Артериальные магистрали"
 inframunicipal_II: "Магистральные дороги"
 inframunicipal_III: "Передовые системы общественного транспорта"
 inframunicipal_IV: "Пересечения с высокой пропускной способностью"
 inframunicipal_V: "Трехмерное планирование муниципальной инфраструктуры"
 inframunicipal_VI: "Интеллектуальная транспортная система"
 inframunicipal_VII: "Массовый быстрый транзит"
 inframunicipal_VIII: "Устойчивые инициативы общественного транспорта"
 inframunicipal_I_desc: "Высокоскоростные внутригородские транспортные системы высокой пропускной способности, предназначенные для облегчения междугородних поездок в крупных городах и улучшения времени поездок на работу и коммерческой логистики. Магистральные магистрали снабжены коллекторными дорогами, которые питают движение к магистральным магистралям и от них, позволяя транспортным средствам ускоряться или покидать район. Кроме того, магистральные магистрали в значительной степени помогают аварийным службам, которые могут преодолевать большие расстояния за короткое время, особенно пожарным, которые могут быстро реагировать на промышленные пожары или широко распространенные пожары, которые вытягивают ресурсы из нескольких станций."
 inframunicipal_II_desc: "Дороги, которые специализируются на обслуживании тяжелых промышленных перевозок, таких как грузовые автомобили, имеют более широкие полосы движения и построены специально для обслуживания тяжелых коммерческих и промышленных логистических перевозок. Магистральные магистральные дороги оптимизируют городскую логистику и позволяют промышленным предприятиям более оперативно снабжать друг друга или транспортировать товары из междугородних транзитных узлов в промышленность, торговлю или обратно. Магистральные магистральные дороги также могут значительно помочь почтовой системе, поскольку наличие этих специализированных дорог позволяет постсортировочным предприятиям легче перемещать грузы по городу в соответствии с согласованными графиками."
 inframunicipal_III_desc: "Широкий ассортимент различных систем общественного транспорта и усовершенствований, усовершенствованные системы общественного транспорта включают в себя усовершенствования существующих систем общественного транспорта или новые системы. Высокоскоростные метрополитены,автобусы большой вместимости, монорельсовые дороги, современные паромы и канатные дороги, а также потенциально даже экспериментальные системы общественного транспорта в подавляющем большинстве случаев сокращают время поездок и существенно увеличивают пропускную способность. Кроме того, продвинутые системы общественного транспорта могут создать петлю обратной связи, в которой лучший и более дешевый доступ к вариантам поездок на работу приводит к меньшему трафику, что приводит к более эффективному передвижению на работу и к общей экономии на транспорте, что обеспечивает больший доход и, таким образом, приводит к большему количеству общественного транспорта и т. д., создавая постепенный рост систем общественного транспорта."
 inframunicipal_IV_desc: "Наличие высокопроизводительных перекрестков и блоков свободного потока значительно сокращает время в пути и снижает затраты за счет сокращения времени на остановках и неровностей времени в пути. Правильное управление муниципальными дорогами и организация их таким образом, чтобы направлять движение транспорта во избежание перекрестков, уменьшает проблемы с движением в городе, а также может уменьшить использование дуэлей. Он также может повысить производительность труда и повысить качество жизни за счет уменьшения скоплений трафика."
 inframunicipal_V_desc: "Высокоразвитая система для повышения общего уровня автомобильного и железнодорожного пространства в пределах города. Она включает в себя все: от надземных или подземных грузовых железных дорог, подземных магистральных дорог, подземных надземных переходов, нескольких городских слоев, позволяющих подземным магистралям экономить пространство над землей для высокоскоростного движения на большие расстояния, подземных служебных дорог для мусора или аварийных служб, чтобы сократить труднодоступный надземный городской трафик, среди прочего. 3D-планирование муниципальной инфраструктуры может в значительной степени позволить городским планировщикам преодолеть ограничения рельефа и пространства и обеспечить легкий выход из сложных инфраструктурных вопросов. Однако это чрезвычайно дорого и может создать проблемы для навигации, возлагая огромное бремя на планировщиков."
 inframunicipal_VI_desc: "Широкий термин для обозначения городской инфраструктуры информационной эпохи. Она включает в себя передовые навигационные системы, интеллектуальные конструкции для автомобильных и железнодорожных дорог, информационные системы общественного транспорта, которые быстрее, эффективнее и имеют большую пропускную способность. Инфраструктура умного города может разумно взаимодействовать с системами наведения, позволяющими водителям избегать движения и эффективно направлять водителей таким образом, чтобы избежать перегруженности ближайших дорог, гораздо эффективнее направлять аварийные службы, улучшить время в пути и снизить общий трафик."
 inframunicipal_VII_desc: "Массовые системы быстрого транзита обычно относятся к разделенным по классам системам тяжелого железнодорожного метрополитена. В этом контексте МРТ относится к высокоскоростным, высокопроизводительным метрополитенам с разделенными железнодорожными системами, которые могут непрерывно двигаться к месту назначения на высоких скоростях к своим исходным точкам. Эти системы MRT доставляют большие объемы пассажиров с более коротким временем в пути, чем нескоростные транзитные системы. Большинство систем МРТ работают над землей, но некоторые из них являются подземными линиями.\nИнформационный общественный транспорт относится к многочисленным достижениям общественного транспорта, сделанным в современную эпоху. Более удобные системы общественного транспорта и автобусы, системы повышенной пропускной способности, более эффективные схемы общественного транспорта и многие другие общие достижения, которые включают широкое внедрение дорогостоящих, но высокоэффективных систем или транспортных средств."
 inframunicipal_VIII_desc: "Инициативы в области устойчивого общественного транспорта способствуют обеспечению устойчивости и долгосрочной экономической эффективности систем общественного транспорта. Обратите внимание, что экономическая эффективность не обязательно означает сокращение государственных расходов, но общие расходы горожан и стоимость жизни снижаются. Эти инициативы могут включать в себя отмену тарифов для стимулирования использования общественного транспорта с целью снижения городского потребления топлива и требований к техническому обслуживанию частных транспортных средств (таким образом, экономя деньги и повышая покупательную способность), а также содействие экологической устойчивости. Другие инициативы включают в себя топливосберегающие транспортные средства и сокращение энергетических/водных отходов в инфраструктуре общественного транспорта."
  
  ####Armor Tree Desc 
 arm_sht_desc: "Эти бегемоты почти неразрушимы, но их использование также очень ограничено."
 arm_ht_desc: "Тяжелый танк\n Тяжелые танки защищены почти от всех видов оружия, но их полезность ограничена низкой мобильностью.\n\nБронированная Инженерная Машина\n Эти тяжелые транспортные средства выполняют особые функции, такие как развертывание мостов, преодоление препятствий и перемещение земли для поддержки механизированных сил."
 arm_mt_desc: "ОБТ\n Основные боевые танки балансируют между броней и огневой мощью тяжелых танков и подвижностью легких танков.\n\nСАУ\n Самоходная артиллерия способна наносить значительный урон на расстоянии как пехоте, так и легкобронированной технике."
 arm_lt_desc: "Броня легких танков не выдерживает попаданий более крупных орудий, но может защитить от стрелкового оружия. Легкие танки значительно более мобильны, чем их более тяжелые аналоги."
 arm_mech_desc: "БТР\n Бронетранспортеры обеспечивают пехоте повышенную мобильность и защиту.\n\nБМП\n Боевые машины пехоты менее мобильны, чем БТРы, но приносят на поле боя более тяжелое вооружение и броню.\n\nБМД\n Эти специализированные БТРы оборудованы для воздушного развертывания.\n\nПТРК\n современное армейское решение проблемы угрозы ОБТ. Ракеты чрезвычайно мощны против бронированных целей, но их противотанковая эффективность ограничена.\n\nРазведывательная машина\n Небольшие и шустрые машины строились для разведки местности и оценки состава сил противника. Они не приспособлены для ведения боевых действий на передовой."
 arm_mot_desc: "Грузовики\n Грузовики обеспечивают пехоте гораздо большую стратегическую мобильность, но в остальном они не представляют никакой существенной, непосредственной боевой ценности.\n\nРакетная артиллерия\n Ракетная артиллерия, предназначенная для борьбы с пехотой, наносит очень мало урона по бронированным целям."
 arm_amph_desc: "Амфибии компромисс между легкими и тяжелыми механизированными транспортами, с улучшенной способностью к десантированию."
  
