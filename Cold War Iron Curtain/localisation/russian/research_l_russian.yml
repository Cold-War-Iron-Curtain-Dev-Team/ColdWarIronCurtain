 hardware_XVI: "Сложенные фишки"
 hardware_I_desc: "Магнитная запись-это основной компонент магнитной памяти сердечника. Магнитная запись использует переключаемый магнит для переключения намагниченных элементов в намагниченной среде, чтобы создать энергонезависимую память. Ранние магнитные запоминающие устройства не считались коммерчески осуществимыми из-за их очень малых возможностей и скорости, с которой магнитный полюс должен перемещаться по диску."
 hardware_II_desc: "Память на магнитных сердечниках-одна из самых ранних форм оперативной памяти. Сердечник использует крошечные магнитные кольца с огромным количеством проводов, продетых нитку для чтения и записи информации. Каждый сердечник может содержать один бит информации и будет намагничен в том или ином направлении, чтобы хранить 1 или ноль. Это позволило временно хранить данные для чрезвычайно быстрого доступа и модификации, то же самое, что оперативная память используется сегодня. Он не может быть использован в качестве общего хранилища данных, потому что он чрезвычайно громоздок по сравнению с устройствами хранения данных, а также намного дороже бита, как и оперативная память сегодня."
 hardware_III_desc: "Впервые изобретенный IBM в 1956 году, жесткий диск был быстро принят в качестве основного цифрового устройства хранения данных. Жесткий диск-это форма хранения данных, которая использует магнитное хранилище для чтения и правки цифровых данных. Диск использует быстро вращающийся диск, покрытый магнитным материалом. Магнитные головки могут изменять и считывать данные на диске во время его вращения. Жесткие диски могут хранить в подавляющем большинстве больше данных, чем предыдущие формы цифрового хранения."
 hardware_IV_desc: "Компьютерные вспомогательные устройства-это такие элементы, как клавиатура, мышь, экран и т. д. Компьютерные вспомогательные устройства существуют в примитивной форме до исследования этого вопроса. По мере того как компьютеры становятся все меньше и меньше, в конце концов они достигают точки, где основные вспомогательные устройства становятся более важными. Эти компьютеры оснащены поддержкой динамических экранов, улучшенными и стандартизированными клавиатурами, а также улучшенным звуковым оборудованием для изменения и считывания звуковых данных. Эти вспомогательные средства прокладывают путь для более широкого применения вычислительной техники."
 hardware_V_desc: "В то время как создание новых форм аппаратного обеспечения повышает универсальность компьютера, необходимо также оптимизировать существующие системы. Оптимизация конструкции и драйверов для систем, таких как материнская плата или звуковая карта, улучшает возможности всех других систем вокруг нее и позволяет им развиваться до дальнейших высот."
 hardware_VI_desc: "Оперативная память (ОЗУ)-это форма хранения данных, которая имеет огромную скорость чтения-записи и используется для запуска программ. Без оперативной памяти программы будут работать значительно медленнее и могут не позволить считывать или записывать данные за одинаковое время относительно физического местоположения данных. Оперативная память содержит схемы мультиплексирования и демультиплексирования (схемы, объединяющие несколько цифровых сигналов в один общий сигнал) для подключения линий передачи данных к адресуемому хранилищу и позволяющие программам легко получать доступ к данным и изменять их."
 hardware_VII_desc: "Современные компьютерные вспомогательные устройства, такие как оптимизированная механическая клавиатура, оптимизированная трекбольная мышь, созданы именно для этого; оптимизированные версии вспомогательных устройств предыдущего поколения. Обеспечивая лучшее качество звука и простое и доступное использование, эти вспомогательные устройства повышают производительность и делают их более доступными для широкой публики. Кроме того, улучшение вспомогательных устройств прокладывает путь для компактных съемных дисков хранения данных."
 hardware_VIII_desc: "Цифровое оптическое хранилище данных - это форма хранения данных, которая использует лазеры для хранения и извлечения данных из оптических сред. Эти лазеры являются маломощными лучами для чтения и записи данных на оптический носитель и позволяют создавать такие вещи, как компакт-диски, которые могут хранить значительно больше данных, чем дискета, и обеспечивают более высокий уровень переносимости данных."
 hardware_IX_desc: "Модульность компонентов - это стандартизация соединений и коммуникаций внутри системы, позволяющая компонентам от нескольких производителей или проектировщиков работать совместно. Модульность компонентов не только позволяет деталям от нескольких проектировщиков работать вместе, но и обеспечивает более высокий уровень гибкости и готовой замены и модернизации компьютерных деталей без необходимости замены всей компьютерной системы."
 hardware_X_desc: "Усовершенствованный жесткий диск использует тонкопленочные магниторезистивные головки на ударных 2,5-дюймовых жестких дисках, которые могут достигать ~7200 оборотов в минуту и хранить несколько GBs в одном диске. Усовершенствованный жесткий диск является более надежным и хранит значительно большие уровни данных, чем когда-либо прежде, позволяя более высокий уровень коммерческого и промышленного применения."
 hardware_XI_desc: "Графический процессор (GPU)-это компьютерный процессор, который специализируется на быстрых математических вычислениях с целью визуализации изображений и разгрузки графоемких задач, таких как САПР, от центрального процессора, чтобы освободить вычислительную мощность центрального процессора. Графический процессор эффективно действует как дополнительный процессор со специализированной задачей, оптимизированной для одной цели с архитектурой параллельной обработки, позволяющей ему выполнять несколько вычислений одновременно. Процессор, однако, требует нескольких процессоров для выполнения вычислений параллельно, но имеет большую тактовую частоту, чем графический процессор."
 hardware_XII_desc: "Современные вспомогательные устройства, такие как низкопрофильные клавиатуры, оптическая мышь, блокнот для рисования или устройства объемного звучания, построены таким образом, чтобы быть эргономичными и отзывчивыми к пользователю. Современные вспомогательные устройства также могут поставляться с пользовательскими функциями, такими как настраиваемые дополнительные кнопки мыши. Разработка этих вспомогательных средств повысит производительность и позволит решать более точные задачи в промышленности, торговле, военной и потребительской практике."
 hardware_XIII_desc: "Флэш-накопитель (SSD) - это форма оптического хранения данных, которая не использует движущихся частей. Твердотельные накопители используют флэш-память для хранения данных в небольших блоках, называемых блоками, хранящимися на чипе флэш-памяти. Флэш-память заметно лучше, чем дисковая, потому что она более надежна из-за отсутствия движущихся частей и считывает/записывает в подавляющем большинстве случаев быстрее, чем жесткий диск. Кроме того, флэш-накопители гораздо компактнее и потребляют меньше энергии. Твердотельные накопители особенно полезны для военных целей, поскольку они лучше защищают данные, менее подвержены повреждениям от перемещения, могут быстрее получать доступ к данным и более энергоэффективны."
 hardware_XIV_desc: "Интерфейс хост-контроллера энергонезависимой памяти"
