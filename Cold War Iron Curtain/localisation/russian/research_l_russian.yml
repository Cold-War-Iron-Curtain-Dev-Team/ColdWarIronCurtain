 iw_armored_vehicles: "Модели бронетехники"
 iw_armored_vehicles_desc: "Абсолютные базовые основы мобильной войны и моделей военной техники."
 armor_iw_armored_vehicles_tt: "§YОТКРЫВАЕТ СПОСОБНОСТЬ ИССЛЕДОВАНИЯ ТРАНСПОРТНЫХ СРЕДСТВ§!"
  
  
  ##CWIC Support Companies 
  
 support_tech: "Технология поддержки"
 engineers_tech: "Инженерные технологии"
  
 hospital_tech: "Полевые госпитали"
 logistics_tech: "Рота снабжения"
 recon_tech: "Рота разведки"
 signal_company_tech: "Командование и связь"
  
 combat_support: "Боевая поддержка"
 combat_support_desc: "Роты боевой поддержки - это роты, которые выполняют полупрямую роль в боевых действиях. Хотя они и не находятся в тылу, они выполняют функции, которые обычно связаны с самим боем, но не с прямым фронтовым боем. Роты боевой поддержки должны быть готовы принять участие в боевых действиях, но оптимально не вступать непосредственно в бой. Прежде чем создавать роты боевой поддержки, необходимо разработать базовые комплекты оборудования и прочные комплекты, чтобы эти роты могли быть готовы к поддержке фронтовых войск."
 combat_service_support: "Боевые службы поддержки"
 combat_service_support_desc: "Роты боевой службы - это роты, которые не играют никакой непосредственной роли в боевых действиях и не годятся для ведения боевых действий. Они остаются далеко за линией фронта и не принимают прямого или косвенного участия в самих боевых действиях. Хотя это не означает, что они не должны быть рядом с фронтом, поскольку медицинские компании все еще должны быть доступны для оказания медицинской помощи раненым солдатам, а ремонтные компании могут выполнять полевые ремонты. Прежде чем создавать роты боевой службы, необходимо разработать основы для переносных полевых конструкций, таких как палатки, прицепы и компоненты фургонов."
  
  #RECON 
  
 tech_recon: "Поддержка I; Разведчики"
 tech_recon_desc: "Разведчики-это самая простая форма разведчика. Задача разведчика состоит в том, чтобы найти вражеские позиции и информацию о силе и численности противника, а затем передать их обратно союзным войскам. Разведчики патрулируют районы и получают сведения о позициях противника. Разведчики нуждаются в простом коммуникационном оборудовании, оптике и легком снаряжении."
 tech_recon2: "Поддержка II; Наблюдатели"
 tech_recon2_desc: "Наблюдатели-это разведывательные подразделения, которые поддерживают передовые позиции в активных боевых действиях. Наблюдатели сохраняют информацию о вражеских подразделениях и предоставляют важные сведения о вражеских атаках, передвижениях и позициях, чтобы союзники могли принять соответствующие меры и отреагировать на них. Наблюдатели нуждаются в более дорогом коммуникационном оборудовании и легком боевом снаряжении, чтобы защитить себя."
 tech_recon3: "Поддержка III; Корректировщики"
 tech_recon3_desc: "Корректировщики - это наблюдатели, которые назначаются конкретным боевым элементам и предоставляют подробную информацию о потенциальных целях в активном бою. Корректировщики получают цели и передают эту информацию своим назначенным элементам, чтобы вступить в бой или рассмотреть возможность вступления в бой. Корректировщикам требуются улучшенные средства связи, оптика и системы координат для передачи точных сведений о местоположении противника."
 tech_recon4: "Поддержка IV; Элитная разведка"
 tech_recon4_desc: "Разведывательные силы являются важными элементами в армии. Из-за их природы важно сохранить их жизнь и живучесть в бою. Вводя более продвинутый режим боевой подготовки и выживания, разведывательные силы могут выживать в течение более длительных периодов времени и становиться устойчивыми к засадам и внезапным ударам."
 tech_recon5: "Поддержка V; Современные застрельщики"
 tech_recon5_desc: "Стрелки-это продвинутая форма разведчиков. Исторически стрелками были легкие пехотинцы, которые действовали как Авангард на позиции союзников, преследовали врагов и прикрывали вражеские позиции. В современном бою многие из этих стрелков были выведены из строя или имеют минимальную живучесть. Разрабатывая оружие и системы, которые могут обеспечить изматывающий огонь и избежать сложных ситуаций, роль стрелка может быть выполнена в современном бою."
 tech_recon6: "Поддержка VI; Полевые шпионы"
 tech_recon6_desc: "Полевые шпионы-это армейские шпионские элементы, которые маскируются под вражеские подразделения или гражданских лиц, чтобы избежать обнаружения. Они действуют не как часть разведывательного агентства, а скорее как часть армии, передавая активные местоположения противнику, обычно в городских войнах, где им легче всего находиться на позиции. Полевым шпионам для работы требуется скрытое и скрытное оборудование, такое как компактные радиоприемники или модифицированные гражданские телефоны."
 tech_recon7: "Поддержка VII; Глубокая разведка"
 tech_recon7_desc: "Глубокая разведка - это высокоразвитая операция, в которой разведывательные элементы позиционируют себя далеко за линией фронта, чтобы передавать информацию. Такого рода тактика глубокого проникновения требует огромных уровней испытаний для разработки и, как правило, требует, чтобы подразделения скрывались и пропускали врага. Оборудование и методы маскировки, а также тактика проникновения трудно создать, но они чрезвычайно полезны, поскольку они могут предоставить самую глубокую информацию, которая не может быть получена обычными разведывательными элементами."
  
  #MECH RECON 
  
 tech_mech_recon: "Механизированная поддержка I; Разведчики на автотранспорте"
 tech_mech_recon_desc: "Разведчики-это самая простая форма разведчика. Задача разведчика состоит в том, чтобы найти вражеские позиции и информацию о силе и численности противника, а затем передать их обратно союзным войскам. Разведчики патрулируют районы и получают сведения о позициях противника. Разведчики нуждаются в простом коммуникационном оборудовании, оптике и легком снаряжении. Моторизованные разведчики используют быстро движущиеся, прилично бронированные машины для более быстрого патрулирования районов."
 tech_mech_recon2: "Механизированная поддержка II; Передовые наблюдатели"
 tech_mech_recon2_desc: "Наблюдатели-это разведывательные подразделения, которые поддерживают передовые позиции в активных боевых действиях. Наблюдатели сохраняют информацию о вражеских подразделениях и предоставляют важные сведения о вражеских атаках, передвижениях и позициях, чтобы союзники могли принять соответствующие меры и отреагировать на них. Наблюдатели нуждаются в более дорогом коммуникационном оборудовании и легком боевом снаряжении, чтобы защитить себя. Передовые наблюдатели используют оборудование, такое как вертолеты или разведывательные машины, чтобы поддерживать лучшую визуальную картину."
 tech_mech_recon3: "Механизированная поддержка III; Корректировщики на БТР"
 tech_mech_recon3_desc: "Корректировщики - это наблюдатели, которые назначаются конкретным боевым элементам и предоставляют подробную информацию о потенциальных целях в активном бою. Корректировщики получают цели и передают эту информацию своим назначенным элементам, чтобы вступить в бой или рассмотреть возможность вступления в бой. Корректировщики нуждаются в лучшей связи, оптике и системах координат, чтобы передавать точные данные о местоположении противника. Механизированные корректировщики используют тяжелую бронетехнику с сильной оптикой для захвата целей."
 tech_mech_recon4: "Механизированная поддержка IV; Отряды особого назначения"
 tech_mech_recon4_desc: "Разведывательные силы являются важными элементами в армии. Из-за их природы важно сохранить их жизнь и живучесть в бою. Вводя более продвинутый режим боевой подготовки и выживания, разведывательные силы могут выживать в течение более длительных периодов времени и становиться устойчивыми к засадам и внезапным ударам. Разработка дорогостоящих высококлассных разведывательных машин может еще больше повысить живучесть разведчиков."
 tech_mech_recon5: "Механизированная поддержка V; Современные продвинутые застрельщики"
 tech_mech_recon5_desc: "Стрелки-это продвинутая форма разведчиков. Исторически стрелками были легкие пехотинцы, которые действовали как Авангард на позиции союзников, преследовали врагов и прикрывали вражеские позиции. В современном бою многие из этих стрелков были выведены из строя или имеют минимальную живучесть. Разрабатывая оружие и системы, которые могут обеспечить изматывающий огонь и избежать сложных ситуаций, роль стрелка может быть выполнена в современном бою. Оснащение разведывательных танков дымовыми завесами и современными дозаторами мякины может значительно помочь в их способности беспокоить противника и выживать при ответном огне."
 tech_mech_recon6: "Механизированная поддержка VI; Продвинутые полевые шпионы"
 tech_mech_recon6_desc: "Полевые шпионы-это армейские шпионские элементы, которые маскируются под вражеские подразделения или гражданских лиц, чтобы избежать обнаружения. Они действуют не как часть разведывательного агентства, а скорее как часть армии, передавая активные местоположения противнику, обычно в городских войнах, где им легче всего находиться на позиции. Полевым шпионам для работы требуется скрытое и скрытное оборудование, такое как компактные радиоприемники или модифицированные гражданские телефоны. Используя гражданскую технику, полевые шпионы могут быстрее проникать на городские и сельские позиции и потенциально смешиваться с ними."
 tech_mech_recon7: "Механизированная поддержка VII; Мобильная глубокая разведка"
 tech_mech_recon7_desc: "Глубокая проводная разведка - это высокоразвитая операция, в которой разведывательные элементы позиционируют себя далеко за линией фронта, чтобы передавать информацию. Такого рода тактика глубокого проникновения требует огромных уровней испытаний для разработки и, как правило, требует, чтобы подразделения скрывались и пропускали врага. Оборудование и методы маскировки, а также тактика проникновения трудно создать, но они чрезвычайно полезны, поскольку они могут предоставить самую глубокую информацию, которая не может быть получена обычными разведывательными элементами."
  
  #Engineers 
  
 tech_engineers: "Инженеры I; Отряд инженеров"
 tech_engineers_desc: "Самая основная форма боевых инженеров. Защитники выполняют основную задачу по строительству окопов и созданию оборонительных сооружений, расчистке путей и созданию базовых лагерей. Защитники нуждаются в основных инструментах, таких как лопаты и топоры, основные фортификационные наборы и мины."
 tech_engineers2: "Инженеры II; Саперы"
 tech_engineers2_desc: "Саперы-это еще одно название боевых инженеров. Саперы используются для более прямых боевых задач, таких как прорыв укреплений и проведение встречных операций по разминированию минных полей и препятствий. Саперам требуются разрывные заряды, бризантные взрывчатые вещества, оборудование для расчистки минных полей, огнеметы, болторезы и другое оборудование, необходимое для противодействия укреплениям."
 tech_engineers3: "Инженеры III; Мостоукладчики"
 tech_engineers3_desc: "Боевые инженеры, которые используют мостовое оборудование для помощи в переправах через реки. Эти инженеры строят мосты из местных материалов, таких как бревна или выкладывают камень, чтобы сделать импровизированные мосты. Этот процесс может быть долгим и трудным, чтобы сделать вручную, и в больших дивизиях полагается на инженеров-мостовиков, чтобы быть бригадирами для других солдат, чтобы построить мосты. Для выполнения этой работы мостовикам требуются топоры или каменные режущие инструменты, веревки и наборы для наведения мостов."
 tech_engineers4: "Инженеры IV; Поддержка в джунглях"
 tech_engineers4_desc: "Джунглеры-это боевые инженеры, которые расчищают участки джунглей с помощью дефолиантов или огня, а также улучшенных инструментов для создания укреплений джунглей. Это помогает вести боевые действия и позволяет боевым инженерам обеспечить важное преимущество в трудной обстановке джунглей. Однако большая часть разработок джанглеров уходит в методы и теории ведения войны в джунглях, в результате чего они не помогают никаким другим боевым средам."
 tech_engineers5: "Инженеры V; Боевые инженеры"
 tech_engineers5_desc: "Боевые инженеры, возможно, должны играть более непосредственную роль в бою. В какой-то момент им нужно построить передовые передовые базы в пределах "горячих зон". Боевые инженеры должны уметь создавать укрепления и передовые базы в чрезвычайно короткие сроки и с высоким качеством. Это требует еще более совершенного индивидуального оборудования, быстрого поезда снабжения, который может доставить все необходимые материалы, и более прочного снаряжения для поддержания в опасных зонах."
 tech_engineers6: "Инженеры VI; Первопроходцы"
 tech_engineers6_desc: "Пионеры-это боевые инженеры, которые могут взять на себя любую окружающую среду и любой региональный вызов в мире. Они-способные инженеры, которые владеют всем, что вы можете послать им. Они используют универсальные, легкие инструменты и оборудование для строительства укреплений, облегчения передвижения или прорыва вражеских укреплений."
 tech_engineers7: "Инженеры VII; Инженеры в городских боях/Полевые инженеры"
 tech_engineers7_desc: "Городские военные инженеры-это эволюция боевого инженера и сапера. Инженеры городской войны являются специалистами в области городской войны и способны возводить передовые укрепления и сооружения в городских условиях. Они могут не только повысить боеспособность войск в городских условиях, но и справиться с опасностями, возникающими в результате военных действий, такими как завалы, открытые электрические провода, токсичные наводнения и т. д. Эти ребята делают городскую войну чуть менее адом для ваших войск и проявлением самого Вечного огня для врага.полевые инженеры - это эволюция защитников. Полевые инженеры специализируются на возведении улучшенных сооружений, оборонительных сооружений и расчистке путей. Используя более развитое оборудование, полевые инженеры способны расчищать пути быстрее и строить быстрее, чем когда-либо прежде."
  
  #ARMORED ENGINEERS 
  
 tech_armor_engineers: "Механизированные инженеры I; Отряд инженеров на автотранспорте"
 tech_armor_engineers_desc: "Защитники - это самая основная форма боевых инженеров. Защитники выполняют основную задачу по строительству окопов и созданию оборонительных сооружений, расчистке путей и созданию базовых лагерей. Защитники нуждаются в основных инструментах, таких как лопаты и топоры, основные фортификационные наборы и мины. Моторизованные защитники используют строительные машины и грузовики снабжения, чтобы помочь своим укреплениям."
 tech_armor_engineers2: "Механизированные инженеры II; Саперы на БТР"
 tech_armor_engineers2_desc: "Саперы-это еще одно название для боевого инженера. В этот момент саперы используются для более прямых боевых задач, таких как прорыв укреплений и проведение встречных операций по расчистке минных полей и препятствий. Саперам требуются разрывные заряды, бризантные взрывчатые вещества, оборудование для расчистки минных полей, огнеметы, болторезы и другое оборудование, необходимое для противодействия укреплениям. Механизированные саперы используют машины для разрушения бункеров и грузовики снабжения, чтобы помочь своим атакам и лучше поддержать основных нападающих."
 tech_armor_engineers3: "Механизированные инженеры III; Мостоукладчики на БТР"
 tech_armor_engineers3_desc: "Мостовики - это боевые инженеры, которые используют мостовое оборудование для помощи в переправах через реки. Эти инженеры строят мосты из местных материалов, таких как бревна или выкладывают камень, чтобы сделать импровизированные мосты. Этот процесс может быть долгим и трудным, чтобы сделать вручную, и в больших дивизиях полагается на инженеров-мостовиков, чтобы быть бригадирами для других солдат, чтобы построить мосты. Для выполнения этой работы мостовикам требуются топоры или каменные режущие инструменты, веревки и наборы для наведения мостов. Механизированные мостовики используют специальные мостовые машины, чтобы быстрее строить мосты в полевых условиях."
 tech_armor_engineers4: "Механизированные инженеры IV; Продвинутая поддержка в джунглях"
 tech_armor_engineers4_desc: "Джунглеры-это боевые инженеры, которые расчищают участки джунглей с помощью дефолиантов или огня, а также улучшенных инструментов для создания укреплений джунглей. Это помогает вести боевые действия и позволяет боевым инженерам обеспечить важное преимущество в трудной обстановке джунглей. Однако большая часть разработок джанглеров уходит в технику и теорию ведения войны в джунглях. Продвинутые Джунглеры используют большие бульдозеры, машины для расчистки леса, огнеметные танки и дефолиантные вертолеты, чтобы лучше обеспечить поддержку другим войскам или победить другие силы, пытающиеся использовать джунгли в своих интересах."
 tech_armor_engineers5: "Механизированные инженеры V; Боевые инженеры на бронетехнике"
 tech_armor_engineers5_desc: "Боевые инженеры-это инженеры, которые играют более непосредственную роль в бою. Они строят передовые передовые базы в пределах "горячих зон". Боевые инженеры должны уметь создавать укрепления и передовые базы в чрезвычайно короткие сроки и с высоким качеством. Это требует еще более совершенного индивидуального оборудования, быстрого поезда снабжения, который может доставить все необходимые материалы, и более прочного снаряжения для поддержания в опасных зонах. Бронированные боевые инженеры используют тяжелую бронетехнику и инженерные танки для того, чтобы лучше защитить себя в городской среде и сражаться в осадной обстановке"
 tech_armor_engineers6: "Механизированные инженеры VI; Первопроходцы на автотранспорте"
 tech_armor_engineers6_desc: "Пионеры-это боевые инженеры, которые могут взять на себя любую окружающую среду и любой региональный вызов в мире. Они-способные инженеры, которые владеют всем, что вы можете послать им. Они используют универсальные, легкие инструменты и оборудование для строительства укреплений, облегчения передвижения или прорыва вражеских укреплений. Моторизованные пионеры используют современные строительные машины и транспортные средства снабжения, чтобы выполнять свою работу быстрее и с лучшими результатами, чем пионеры, которые не имеют доступа к тяжелой технике."
 tech_armor_engineers7: "Механизированные инженеры VII; Мобильные инженеры в городских боях/Полевые инженеры"
 tech_armor_engineers7_desc: "Городские военные инженеры-это эволюция боевого инженера и сапера. Инженеры городской войны являются специалистами в области городской войны и способны возводить передовые укрепления и сооружения в городских условиях. Они могут не только повысить боеспособность войск в городских условиях, но и справиться с опасностями, возникающими в результате военных действий, такими как завалы, открытые электрические провода, токсичные наводнения и т. д. Эти ребята делают городскую войну чуть менее адом для ваших войск и проявлением самого Вечного огня для врага. Мобильные инженеры городской войны используют тяжелую бронетехнику и инженерные танки, чтобы устранить опасности и обеспечить лучшую поддержку во время городских осад.полевые инженеры - это эволюция защитников. Полевые инженеры специализируются на возведении улучшенных сооружений, оборонительных сооружений и расчистке путей. Используя более развитое оборудование, полевые инженеры способны расчищать пути быстрее и строить быстрее, чем когда-либо прежде. Мобильные полевые инженеры используют очистные машины, вертолеты, строительные машины, инженерные танки и многие другие наборы современного оборудования, чтобы выполнять свою работу лучше, чем полевые инженеры, которым не хватает этого оборудования."
  
  #HOSPITAL 
 tech_field_hospital: "Медики I; Мед. рота"
 tech_field_hospital_desc: "Медицинские роты - это вспомогательные роты, состоящие из медицинского персонала, включая полевых хирургов, боевых медиков, медсестер и так далее. Они заботятся о здоровье и благополучии солдат в полевых условиях. Самые простые медицинские компании просто оснащают медицинский персонал легким оборудованием и дают ему подготовку и дисциплину, чтобы справиться с ужасами войны. Нет необходимости обучать их работать под давлением и ограничениями во времени, потому что медицинский персонал всегда должен так работать."
 tech_field_hospital2: "Медики II; Полевые госпитали"
 tech_field_hospital2_desc: "Создание передвижных полевых госпиталей значительно облегчает оказание помощи раненым. Нетрудоспособные солдаты, доставленные в полевые госпитали, где установлено медицинское оборудование, имеют гораздо больше шансов выжить, чем медики, пытающиеся залатать их, когда в них стреляют в грязи. Полевые госпитали должны иметь легкое оборудование и бронированные полевые машины скорой помощи, чтобы быть портативными с армией и восстанавливать солдат во время активных боевых действий."
 tech_field_hospital3: "Медики III; Переносное медицинское снаряжение"
 tech_field_hospital3_desc: "В то время как наличие массивных машин и полных больничных коек с мониторами может быть отличным способом спасти жизни, кирпичные больницы, к сожалению, не транспортабельны. Создание легких, портативных вариантов медицинского оборудования, найденного в госпиталях, позволяет полевым госпиталям более точно соответствовать своим постоянным аналогам и в дальнейшем помогать жизни солдат."
 tech_field_hospital4: "Медики IV; Продвинутая физио/психологическая обработка"
 tech_field_hospital4_desc: "Естественно, это помогает быть здоровым, когда ваша жизнь находится на линии, и это облегчает работу врача и дает больше шансов на выживание. С помощью медицинских исследований медицинские компании могут контролировать и улучшать физическое и психическое здоровье солдат в полевых условиях, чтобы гарантировать, что у них есть сильные кости, мышцы, иммунная система и разум, чтобы они могли лучше пережить травму медицинских травм в бою."
 tech_field_hospital5: "Медики V; Военные медицинские исследования"
 tech_field_hospital5_desc: "Гражданским врачам и медицинским исследователям (надеюсь) не приходится сталкиваться с огромным количеством пациентов, регулярно получающих тяжелые боевые травмы. Именно по этой причине искусство боевой медицины обретает научное понимание только тогда, когда идет война или страна крайне нестабильна. Хотя, если страна нестабильна, вряд ли найдется так много врачей с хорошо финансируемыми больницами. Поэтому целесообразно привлекать медицинских исследователей, которые могут изучать и создавать новые методы и медицинские материалы для борьбы с боевыми травмами."
 tech_field_hospital6: "Медики VI; Военные психиатры"
 tech_field_hospital6_desc: "Не все, кто выведен из строя в армии, убиты или ранены. Жестокий и адский характер войны оставляет многих солдат с ПТСР. Это несчастное государство оставляет ветеранов немощными или неспособными вернуться к гражданской жизни и продолжать службу в армии. Военные психиатры существуют для оказания помощи психически травмированным солдатам и позволяют им продолжать службу в армии или быть уволенными и иметь возможность мирно вернуться к гражданской жизни с минимальными или никакими психиатрическими проблемами или триггерами ПТСР."
 tech_field_hospital7: "Медики VII; Военная травматология"
 tech_field_hospital7_desc: "Логическое завершение CIMR, травматология включает в себя специализированное оборудование для борьбы с экстремальными травмами и стабилизации тяжелых физиологических проблем, связанных с серьезной травмой. Это, в сочетании с необходимостью легкой, компактной медицины в войне толкает медицинскую изобретательность на край. Это включает в себя временные искусственные органы, выполняющие простые задачи, высокоэффективные анестетики, высокоразвитые вспомогательные средства и миниатюрное оборудование травматологического отделения. Военная травматология может вернуть солдат, которые считались бы обреченными в прежние годы, обратно с края."
  
