  #SRAAM 
  
 aam_short_range_0: "Радиолокационная ракета класса «воздух-воздух»"
 aam_short_range_0_short: "Радиолокационное наведение ракеты"
 aam_short_range_0_desc: "Первые практические ракеты класса "воздух-воздух" использовали радиолокационный луч для поиска своих целей. Ракета использует хвостовой приемник для полета вниз по центру радиолуча, направленного на цель запускающим самолетом."
 aam_short_range_1: "Ракета ИК наведения класса «воздух-воздух»"
 aam_short_range_1_short: "Ракета ИК наведения"
 aam_short_range_1_desc: "Инфракрасные прицельные искатели используют щелевую вращающуюся прицельную сетку перед одноканальным детектором для определения углового положения цели относительно ракеты. Затем ракету можно направить на удар, используя закон наведения, такой как порпортированная навигация. Однако ранние ИК-детекторы могут фиксироваться только на выхлопах двигателя и должны запускаться с задней стороны, что ограничивает их эффективность."
 aam_short_range_2: "Универсальная ИК-ракета класса «воздух-воздух»"
 aam_short_range_2_short: "Универсальная ИК-ракета"
 aam_short_range_2_desc: "Достижения в области технологии полупроводниковых детекторов с охлаждаемым ИК-излучением позволяют ИК-искателям идентифицировать самолет-мишень со всех углов, а не только сзади."
 aam_short_range_3: "Инфракрасная головка самонаведения"
 aam_short_range_3_short: "Инфракрасная головка самонаведения"
 aam_short_range_3_desc: "Инфракрасные матрицы фокальной плоскости заменяют одноканальные инфракрасные искатели детекторами, которые ближе приближаются к камере. Вместо того чтобы использовать один пиксель и вращающуюся сетку для определения углового положения цели, FPA-это широкоугольная тепловизионная камера, способная идентифицировать цели на основе формы, размера и эксплуатационных характеристик. FPA-основанные искатели предлагают улучшенную дальность действия и устойчивость к контрмерам."
 aam_short_range_4: "Продвинутая ракета класса «воздух-воздух»"
 aam_short_range_4_short: "Продвинутая ракета"
 aam_short_range_4_desc: "Ракеты с высоким дальним прицелом могут быть направлены на цель перед запуском с помощью нашлемного прицела, что исключает необходимость наведения пускового самолета на цель. После запуска ракета использует бортовую инерциальную навигационную систему для поворота в указанном направлении, а затем получает цель один раз на курсе."
 aam_short_range_5: "ИК ракета с каналами передачи данных воздух-воздух"
 aam_short_range_5_short: "Каналы передачи данных"
 aam_short_range_5_desc: "Добавление каналов передачи данных еще больше расширяет диапазон действия инфракрасных ракет класса "воздух-воздух", позволяя им поражать цели, которые в настоящее время не находятся внутри их целевой оболочки, обеспечивая наведение на основе других датчиков до тех пор, пока бортовой искатель не сможет обнаружить цель."
  
  #LRAAM 
  
 aam_long_range_0: "Полуактивная радиолокационная ракета самонаведения с коническим сканированием"
 aam_long_range_0_short: "Полуактивный радар"
 aam_long_range_0_desc: "Полуактивный радар самонаведения ракеты домой на радаре стартового самолета возвращается отскочил от цели. В сочетании с коническим сканирующим искателем ракета может рассчитать относительную угловую скорость и направление движения для достижения цели."
 aam_long_range_1: "Ранняя активная радиолокационная ракета «воздух-воздух»"
 aam_long_range_1_short: "Ранняя радиолокационная ракета"
 aam_long_range_1_desc: "Активное радиолокационное самонаведение наводит на ракету весь радиолокационный комплекс, отслеживая цель с помощью собственных радиолокационных излучений ракеты. Однако ранние активные радиолокационные системы самонаведения были большими и энергозатратными, что относило их только к самым крупным ракетам."
 aam_long_range_2: "Инвертированная моноимпульсная полуактивная ракета класса «воздух-воздух»"
 aam_long_range_2_short: "Моноимпульсная полуактивная ракета"
 aam_long_range_2_desc: "Обратные Моноимпульсные искатели заменяют вращающийся конический Искатель в ранних ракетах SARH пеленгационным подходом, основанным на дифференциальной поляризации двух радиолокационных возвратов. При одновременной передаче двух сигналов от осветительной РЛС с двумя различными поляризациями можно однозначно определить угловое положение цели относительно искателя. Кроме того, наземные возвраты могут быть отфильтрованы, что позволяет вести поиск и сбивать цели."
 aam_long_range_3: "Современная активная радиолокационная ракета «воздух-воздух»"
 aam_long_range_3_short: "Современная радиолокационная ракета"
 aam_long_range_3_desc: "Достижения в области микроволновых интегральных схем позволяют миниатюризировать активные радиолокационные самонаводящиеся искатели в традиционные оболочки ракет средней дальности. В свою очередь, это позволяет пускающим самолетам вести огонь своими ракетами и отворачиваться от цели, а не обеспечивать непрерывное освещение, как в случае с SARH."
 aam_long_range_4: "Ракета «воздух-воздух» с переменной передачей данных"
 aam_long_range_4_short: "Ракета с переменной передачей данных"
 aam_long_range_4_desc: "Ракеты переменной канальные представляют собой смесь традиционных ракетных и прямоточных воздушно-реактивных двигателей. Клапанный твердотопливный ракетный двигатель производит богатый топливом выхлоп, который затем подается в полость сгорания, питаемую от внешнего воздушного потока. Регулируя клапан, можно модулировать расход топлива и, следовательно, тягу, обеспечивая лучшую удельную импульсную и траекторную способность по сравнению с традиционными ракетами."
  
