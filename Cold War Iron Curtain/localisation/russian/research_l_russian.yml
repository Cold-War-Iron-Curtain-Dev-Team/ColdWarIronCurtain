 software_XIV: "Облачные вычисления"
 software_XV: "Системы искусственного интеллекта"
 software_XVI: "Высокоэффективные драйверы"
 software_I_desc: "В то время как механические вычисления, возможно, сыграли важную роль на раннем этапе в оказании помощи исследователям и инженерам до и во время Второй мировой войны, сложные потребности растущего мира привели к необходимости разработки компьютеров, выходящих за рамки того, что они могли бы сделать просто с помощью шестеренок и предустановленных вычислений. Ранние вычислительные теории привели к развитию ранних электронных компьютеров, которые в большей или меньшей степени выполняли ту же роль с аналогичными возможностями, что и механические компьютеры, но таким образом, что позволили им взять на себя значительно более крупные задачи и создать первые крупные компьютеры."
 software_II_desc: "Предустановленное Программирование ранних компьютеров оставляло желать лучшего и позволяло компьютерам брать на себя только узкоспециализированные задачи с трудно собранными программами. Двоичные языки программирования позволяют компьютерам решать значительно большее разнообразие задач, а также обеспечивают более высокий уровень доступности вычислений."
 software_III_desc: "Язык программирования высокого уровня - это язык программирования, который абстрагируется от двоичных деталей самой обработки компьютера. Они читают естественный язык [т. е. add_research_slot = 50] и превращают его в обрабатываемый элемент. Это позволяет программировать их на макроуровне без необходимости индивидуально назначать неабстрагированные элементы для обработки данных."
 software_IV_desc: "Алгоритм quicksort - это эффективный алгоритм сортировки, разработанный Тони Хоаром в 1959 году, который систематически помещает элементы в организованный массив. Он используется для сортировки данных в компьютере и превзошел предыдущие алгоритмы сортировки, такие как merge sort и heapsort. Сортировка является чрезвычайно распространенным процессом, проводимым в компьютерном программном обеспечении, и поэтому она должна быть высокоэффективной, а плохо созданный алгоритм сортировки может привести к неоправданно большим нагрузкам на обработку. Quicksort все еще используется сегодня, потому что это просто хорошо."
 software_V_desc: "Коммутация пакетов-это метод группировки цифровых данных sata и передачи их по цифровой сети. Они возглавляются заголовком,а сами данные находятся в полезной нагрузке, которая следует за заголовком. Заголовок осуществляет навигацию по сети в соответствии с размещенными в ней данными. Это позволяет данным перемещаться по очень сложным сетям, где есть несколько хостов для достижения и различные узлы данных для перемещения между ними. Однако есть несколько проблем, таких как потеря пакетов, которые влияют на сети коммутации пакетов. Беспроводная передача [недоступна на момент исследования этого вопроса] и перегрузка сети могут привести к тому, что пакеты не достигнут места назначения и будут потеряны. Протокол управления передачей - это интернет-протокол, который обеспечивает точную передачу данных и определяет, когда пакеты теряются, чтобы он мог повторить попытку или исправить ошибки."
 software_VI_desc: "Вычислительная гидродинамика (CFD) - это часть механики жидкости, которая использует численный анализ для решения задач с потоком жидкости. Это программное обеспечение позволяет компьютерам моделировать свободный поток жидкостей и газов. Это очень сложное программное обеспечение значительно выигрывает от сильных компьютеров и может позволить инженерам моделировать множество различных проблем, связанных с аэродинамикой, жидкостями, погодой и т. д. Задачи CFD в основном опираются на уравнения Навье-Стокса, определяющие однофазные потоки жидкости."
 software_VII_desc: "Со временем стали возможны модульные, крупномасштабные, массово-параллельные суперкомпьютеры. В результате конструктивных усовершенствований и улучшения административных областей и внутренних протоколов массово-параллельные суперкомпьютеры могут стать огромными по размерам. Эти суперкомпьютеры могут быть использованы для хранения или резервного копирования большего количества данных, чем раньше, и обрабатывать больше, чем ранние модели. Поскольку их ценность и назначение ограничены одним пространством, эти суперкомпьютеры обычно хранятся под землей в условиях крайней безопасности, и только проверенный персонал может работать с ними физически."
 software_VIII_desc: "Открытая архитектура-это тип архитектуры программного обеспечения, который позволяет легко обмениваться программным обеспечением, устанавливать и обновлять его. Наличие открытой архитектуры домашней компьютерной системы позволяет большому количеству систем свободно приспосабливаться к любому новому виду программного обеспечения, которое может быть разработано на ее операционной системе."
 software_IX_desc: "Автоматизированное рисование [САПР] - это использование компьютерных систем для помощи в создании дизайна. Программное обеспечение САПР значительно упрощает проектирование и значительно повышает производительность и качество. Он также может обеспечить легкий доступ к базам данных, коммуникационным инструментам, макросам и другим инструментам для дальнейшего облегчения процесса проектирования. Программное обеспечение САПР может быть использовано для проектирования многих различных вещей, включая машины, архитектуру, электронику и т. д. С помощью автоматизированного производства САПР может непосредственно позволить машинам точно выполнять проекты с предельной точностью и эффективностью."
 software_X_desc: "64-битные вычисления - это использование 64-битной архитектуры в компьютерах. Каждый 1 или 0 в двоичном языке занимает 1 бит. В 64-разрядной архитектуре 64 бита располагаются в один адрес памяти, который является ссылкой на определенную ячейку памяти, используемую на программном и аппаратном уровнях. Что делает 64-битные системы особенными, так это то, что 64-битные компьютеры имеют целочисленный предел 9,223,372,036,854,775,807, в то время как 32-битные системы ограничены примерно 2,147 миллиардами. Это позволяет системе хранить и обрабатывать гораздо больше уникальных переменных, чем когда-либо прежде. Сегодня существуют более простые программы, которые все еще используют 32-разрядную версию, но многие программы должны использовать 64-разрядную архитектуру из-за их абсолютной сложности."
 software_XI_desc: "Многопоточность-это способность процессора обеспечивать одновременное выполнение нескольких потоков. Многопоточность увеличила использование одного ядра за счет использования параллелизма на уровне потоков и параллелизма на уровне инструкций. Это обеспечивает больший уровень гибкости при многозадачности независимо от того, используется ли одно ядро или несколько ядер.хотя одновременная многопоточность существует с 1968 года и развернута в течение нескольких лет после этого, эта технология представляет собой оптимизацию многопоточных протоколов и внедрение протоколов для защиты от нескольких потоков, совместно использующих аппаратные ресурсы, такие как кэши, и высокий уровень эффективности."
 software_XII_desc: "Разработка военно-логистического программного обеспечения значительно облегчает работу главного военного штаба и позволяет повысить уровень надежности в крупных военно-логистических сетях и организации сложных цепочек поставок в массовом масштабе. Это программное обеспечение может позволить офицерам снабжения вводить заказы в цифровом виде и улучшает связь в сложных сетях. Кроме того, это программное обеспечение может облегчить сортировку и расстановку приоритетов поставок, а также помогает автоматически находить аномалии в линиях поставок."
 software_XIII_desc: "3-е поколение программного обеспечения отладки программного обеспечения имеет многочисленные улучшения по сравнению с предыдущими поколениями. 3-е поколение имеет несколько преимуществ по сравнению с предыдущими поколениями, включая оптимизационную сортировку и проактивную отладку памяти, которые могут активно находить ошибки повреждения памяти и выявлять процессы, использующие аномальные объемы системных ресурсов. Это программное обеспечение проложит путь для разработки гораздо более сложных программ и значительно поможет в разработке программного обеспечения."
