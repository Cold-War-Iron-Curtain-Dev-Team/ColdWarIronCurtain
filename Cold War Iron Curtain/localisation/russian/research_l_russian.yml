  #MP 
 tech_military_police: "Военная полиция I; Рота военной полиции"
 tech_military_police_desc: "Военная полиция-это специальный Офицерский корпус, который поддерживает порядок внутри дивизии, а также обеспечивает безопасность в зоне боевых действий. Война по самой своей природе разрушительна. Правительственные чиновники, полицейские и оперативники Службы безопасности являются естественными целями и воюющими сторонами в конфликте, поэтому военная полиция должна поддерживать порядок и подавлять мятеж. Базовая военная полиция не является более продвинутой или отличной от обычных полицейских сил, за исключением большей боевой подготовки и способности устанавливать удары в незнакомой зоне."
 tech_military_police2: "Военная полиция II; Борьба с повстанцами"
 tech_military_police2_desc: "Повстанцы и партизаны могут быть чрезвычайно опасны для военной операции и создавать проблемы на стратегическом уровне. От саботажа до засады, чтобы обеспечить противника информацией, любой может стать повстанцем. Возможность охотиться на повстанцев и партизан и подавлять мятеж в зоне боевых действий-это критическая операция. Оружие и огнестрельное оружие должны быть конфискованы, милицейские ячейки должны быть найдены и уничтожены, а сами оперативники должны быть ликвидированы. Поэтому необходимо производить специальную технику и военизированные варианты милицейской техники, планировать протоколы по пресечению."
 tech_military_police3: "Военная полиция III; Борьба с беспорядками"
 tech_military_police3_desc: "Помимо ополченческих ячеек, дезорганизованные беспорядки могут также возникать из-за восстания населения, которое не имеет представления о партизанской войне или теории сопротивления. Хотя беспорядки и не так опасны, как полностью организованная милицейская ячейка, они могут вызвать серьезные беспорядки, помешать доступу к ресурсам и промышленности и сплотить поддержку партизан. Поэтому необходимо контролировать и подавлять беспорядки. Однако применение смертоносной силы сдвига, хотя и легко и эффективно, только радикализирует местное население и выполняет первоначальную цель бунта. Таким образом, разработка военных методов борьбы с беспорядками для поддержания порядка и подавления демонстраций имеет жизненно важное значение."
 support_tech_military_police3_tt: "§YСнижает вероятность успешного бунта на оккупированной территории за счет§! §G-35%§!"
 tech_military_police4: "Военная полиция IV; Рота помощи жертвам войны"
 tech_military_police4_desc: "Недостаточно просто подавлять сопротивление и умиротворять население. Мирное сопротивление всегда возможно и может быть проблематичным. Кроме того, разрушение сдвига, вызванное войной, может привести к тому, что партизаны образуют ячейки. Предоставление военной помощи является благоразумным по многим причинам. Военная помощь помогает региону быстрее восстанавливаться во время и после войны. Военная помощь помогает поддерживать богатство и развитие, которые в противном случае были бы потеряны. Военная помощь ускоряет восстановление. Наконец, предоставление военной помощи может выиграть самую важную войну из всех. Война сердец и умов."
 tech_military_police5: "Военная полиция V; Операции по поддержанию мира"
 tech_military_police5_desc: "Миротворчество - это активная мера по предотвращению восстаний и уменьшению разрушений. Миротворческие операции обычно включают подготовку новых местных сил безопасности для обеспечения соблюдения закона и восстановления нормальной жизни. Порядок и стабильность-величайшие методы умиротворения. Миротворчество требует, чтобы военная полиция была обучена создавать местную безопасность и ветеринарию для людей, которые не станут проблемами, чтобы стать этими оперативниками безопасности. Кроме того, он требует создания логистических линий для обеспечения безопасности, чтобы можно было установить ритмы безопасности."
 tech_military_police6: "Военная полиция VI; Меметическое подавление"
 tech_military_police6_desc: "Завоевание сердец и умов с помощью военной помощи и миротворчества-это хорошие способы предотвратить мятеж. Впрочем, не все в этом убеждены, особенно патриоты и демагоги. Поэтому необходимо использовать страх как инструмент подавления других людей. Однако этот страх не может быть устранен таким образом, чтобы он мешал оказанию военной помощи или поддержанию мира. Военные репортеры, пропаганда, меметическая война и идеологические дебаты и другие подобные методы-это способы посеять сомнения среди оккупированного населения."
 tech_military_police7: "Военная полиция VII; Современное нелетальное оружие и тактика"
 tech_military_police7_desc: "Нелетальная тактика и оружие использовались на заре человеческой цивилизации и, естественно, являются частью оккупации. Однако борьба с бытовыми преступлениями-это совсем другая игра, нежели борьба с повстанцами. Чтобы лучше контролировать население, а не вызывать сопротивление и обеспечивать психологическое подавление, необходимо создать новые методы выведения из строя. Инвестирование больших сумм в разработку нелетального оружия, химикатов, обучение и оборудование окупится, позволив меньшему количеству войск оказывать большее подавляющее воздействие."
  
  #SIGNAL 
 tech_signal_company: "Рота связи I; Командование и контроль"
 tech_signal_company_desc: "Роты связи поддерживают организацию и связь внутри подразделения и за его пределами. Используя средства связи, сигнальные роты могут помочь командованию и управлению дивизией и дать ей возможность реагировать на ситуации лучше, чем раньше. Командование и управление требует специалистов по сигналам и коммуникационному оборудованию."
 tech_signal_company2: "Рота связи II; Связь, командование и контроль"
 tech_signal_company2_desc: "С3 означает связь, командование и управление. С внедрением С3 подразделения теперь могут взаимодействовать друг с другом и динамично реагировать на вражеские передвижения и прорывы и реагировать соответствующим образом. C3 требует, чтобы специалисты по сигналам были интегрированы во все подразделения во многих различных областях для передачи информации и обеспечения большей осведомленности."
 tech_signal_company3: "Рота связи III; Совместимость"
 tech_signal_company3_desc: "Интероперабельность-это прогресс С3. Интероперабельность - это продвижение доктрин в области коммуникации и прямых усилий между боевыми элементами. Таким образом, боевые элементы могут общаться друг с другом без необходимости в сигнальной связи и могут помогать друг другу по собственной инициативе."
 tech_signal_company4: "Рота связи IV; Шпионаж, наблюдение, сбор данных и разведка"
 tech_signal_company4_desc: "ISTAR означает разведку, наблюдение, обнаружение целей и рекогносцировку. Это активная коммуникация между элементами разведки и всеми участниками коммуникационной сети. Истар позволяет элементам разведку, чтобы передать информацию к остальной части подразделения с высокой эффективностью. Это также позволяет разведывательным элементам помогать в предоставлении информации для борьбы с элементами, которые в ней нуждаются."
 tech_signal_company5: "Рота связи V; Интеграция современной информационной системы"
 tech_signal_company5_desc: "Современная интеграция информационных систем [MISI] - это интеграция современных систем информации, таких как портативные компьютеры, чтобы помочь в тактическом управлении. С помощью MISI можно установить беспрецедентный уровень прямого тактического контроля между командным составом и действующими боевыми элементами. МИСИ позволяет проводить консультации между опытными старшими офицерами и офицерами низшего звена для повышения боевого и тактического потенциала."
 tech_signal_company6: "Рота связи VI; Личные связи"
 tech_signal_company6_desc: "Личная связь - это часть коммуникационного оборудования, предоставляемая почти всем лицам в подразделении "а". Это может также позволить поддерживать связь, поскольку выведение из строя специалиста по сигналам не обязательно означает конец связи. Разработка персональных средств связи требует миниатюризации коммуникационного оборудования и протоколов для отключения работоспособности скомпрометированного оборудования."
 tech_signal_company7: "Рота связи VII; ОВЕРЛОРД"
 tech_signal_company7_desc: "ОВЕРЛОРД-это теоретический Боевой интерфейс, который еще не был полностью реализован ни одной страной из-за огромных затрат на разработку необходимого программного обеспечения, его поддержание и обновление. ОВЕРЛОРД создает интерфейс, созданный и обновленный командным составом на основе непрерывных отчетов разведки и поступающей информации. Это позволяет достичь невиданного ранее уровня оперативной совместимости, связи и командования, который позволяет практически всем войскам получать информацию о близлежащих войсках и избегать конфликтов, с которыми они не могут справиться, в то же время точно вступая в бой с противником, с которым они могут это сделать. До тех пор, пока кто-то знает о присутствии врага, и связь все еще находится в сети, каждый может знать об этом."
  
  #MAINTENANCE 
 tech_maintenance_company: "Ремонтная рота I; Армейские механики"
 tech_maintenance_company_desc: "Ремонтные компании-это специализированные небоевые подразделения, специализирующиеся на техническом обслуживании и ремонте военного вооружения и техники. В то время как большая часть рутинной чистки и технического обслуживания может быть выполнена солдатами, которые управляют оружием и оборудованием, специальные механики могут выполнять эту работу более эффективно и избавить большую часть усилий от самих солдат, чтобы они могли сосредоточиться на других вещах. Механика - это самый простой, но один из самых важных элементов ремонтной компании."
 tech_maintenance_company2: "Ремонтная рота II; Менеджмент"
 tech_maintenance_company2_desc: "Управление техническим обслуживанием и военные бригадиры имеют решающее значение для эффективности ремонтных компаний. Реализуя стратегии и политику управления на местах, они способны значительно повысить скорость и эффективность проведения ремонтных работ и технического обслуживания."
 tech_maintenance_company3: "Ремонтная рота III; Улучшенные инструменты и снаряжение"
 tech_maintenance_company3_desc: "Создание новых инструментов и оборудования, специализирующихся на техническом обслуживании и ремонте, значительно поможет компаниям по техническому обслуживанию. Надежное или автоматизированное оборудование облегчит работу механиков."
 tech_maintenance_company4: "Ремонтная рота IV; Дальнейшее улучшение инструментов и снаряжения"
 tech_maintenance_company4_desc: "Дальнейшая оптимизация инструментов, чтобы сделать их более надежными и простыми в обращении, еще больше способствует полевому ремонту и регулярному техническому обслуживанию."
 tech_maintenance_company5: "Ремонтная рота V; Универсальные запчасти"
 tech_maintenance_company5_desc: "На войне нередко можно встретить ремонтные компании, у которых заканчиваются компоненты или запасные части. Части, которые повреждены или разрушены, очень непоследовательны и непредсказуемы из-за характера боя. Именно по этой причине желательно иметь запасы дополнительных универсальных деталей и ремонтных комплектов, которые предназначены только для временного применения. Благодаря интенсивным усилиям по развитию и инвестициям эти комплекты и детали могут быть созданы для ремонта в полевых условиях, чтобы держать транспортные средства и оружие в бою достаточно долго, чтобы они могли получить постоянный ремонт."
 tech_maintenance_company6: "Ремонтная рота VI; Дивизионные механики"
 tech_maintenance_company6_desc: "Самые тяжелые ремонтные ситуации могут возникнуть в пылу перестрелки. Танки могут быть уничтожены, транспортные средства могут быть расстреляны, и различные другие формы повреждений могут произойти. Полевые ремонты всегда были трудной задачей и всегда были неотложными. Обучая механиков работать быстрее и под сильным давлением, они могут проводить эти ремонтные работы более эффективно и возвращать свои машины в бой."
 tech_maintenance_company7: "Ремонтная рота VII; Цифровые руководства"
 tech_maintenance_company7_desc: "Снабдив наших боевых механиков портативными устройствами, содержащими информацию о том, над чем они работают, Они могут достичь невиданного ранее уровня эффективности."
  
