  #Management 
 management_I: "Комплексное обслуживание оборудования (TPM)"
 management_I_desc: "ТПМ - это организация и систематизация поддержания производства и повышения его качества. Основная цель TPM заключается в обеспечении того, чтобы производительность промышленного подразделения поддерживалась за счет скромных инвестиций в техническое обслуживание и совершенствование. для того чтобы установить режим TPM, необходимы специальные команды технического обслуживания, и ресурсы должны регулярно инвестироваться для увеличения объема производства."
 management_II: "Профилактическое обслуживание"
 management_II_desc: "Профилактическое техническое обслуживание является ключевым аспектом TPM, в котором техническое обслуживание и проверки проводятся заранее, прежде чем произойдет поломка. Благодаря систематическому контролю, выявлению и исправлению отказов в нерабочее время работа проводится во избежание поломок или неисправностей. Разработка ТЧ требует разработки режима, специальных ремонтных бригад и инструментов, а также системы обучения, позволяющей ремонтникам заблаговременно обнаруживать потенциальные неисправности или износ."
 management_III_A: "Периодическое обслуживание"
 management_III_A_desc: "Периодическое техническое обслуживание - это сокращение режима TPM, запланированного на основе расчетного срока службы машин или деталей. Исходя из тенденций, инспекции планируются и проводятся периодически и не так обширны, как прогнозное техническое обслуживание, поскольку это приводит к менее частым проверкам. Периодическое техническое обслуживание снижает общие затраты, но имеет меньшую производительность и более частые отказы из-за менее интенсивного и регулярного технического обслуживания."
 management_III_B: "Прогнозное обслуживание"
 management_III_B_desc: "Прогнозное техническое обслуживание - это расширение режима TPM, запланированное на основе состояния оборудования. Прогнозное техническое обслуживание - это расширение числа проверок, регулярно проводимых на машинах и обслуживающих оборудование всякий раз, когда оно показывает признаки износа, усталости или потенциального отказа. Прогнозное обслуживание является более дорогостоящим, поскольку требует расширения режима TPM, но более эффективно предотвращает сбои и поддерживает производительность."
 management_IV: "Сотовое производство"
 management_IV_desc: "Цель клеточного производства состоит в том, чтобы сделать большое разнообразие подобных продуктов за короткий промежуток времени. Каждая "ячейка “производит один промежуточный продукт через 1 или более машин и перемещает эти промежуточные продукты в другую” ячейку" машин, которые создают другую контрольную точку. В формате ячейки, одна ячейка должна быть изменена или модифицирована [или в некоторых случаях, просто перемещена в ячейку alt], чтобы изменить всю производственную линию."
 management_V_A: "Введение «Точно в срок»"
 management_V_A_desc: "Это когда фабрика стремится использовать только то, что ей нужно для продукта, чтобы сократить отходы и минимизировать время ожидания между каждой стадией производства. В системе JIT товары не складируются, и новые логистические заказы делаются сразу же после поступления входных товаров. В результате складирование сводится к минимуму, отходы значительно сокращаются, ликвидация производится реже, а затраты сокращаются. JIT также стремится сократить буферы или избыточный персонал, чтобы повысить эффективность."
 management_V_B: "Улучшение «Точно в срок»"
 management_V_B_desc: "Когда завод стремится создать буферы и иметь дополнительные уровни запасов и персонала, чтобы предотвратить потери производительности в результате логистических зависаний, ошибок или неисправных входов. Система JIC стремится предотвратить проблемы или зависания в производстве, поддерживая запасы необходимых товаров и делая заказы, как только определенные части становятся близки к тому, чтобы стать низкими."
 management_VI: "Общее управление качеством"
 management_VI_desc: "Попытка улучшить способности работника на рабочем месте. Это делается с помощью стимулов, заслуг и усовершенствованных методов управления. Благодаря совершенствованию рабочих процессов, качество продукции и услуг в целом улучшается, как и производительность труда. Кросс-функциональные команды могут быть собраны специально для решения насущных проблем качества, активное участие руководства в обучении становится политикой, а меритократическое вознаграждение предоставляется лицам, которые работают на более высоком уровне, чем их сверстники."
 management_IV_A: "Охрана труда и менеджмент здоровья"
 management_IV_A_desc: ""
 management_VII_A: "Постоянная работа в прогрессе"
 management_VII_A_desc: "Постоянная работа в процессе-это гибридная двухтактная производственная система. ConWIP поддерживает постоянное количество” незавершенных " продуктов на производственной линии с помощью отдельных карт, установленных на каждом уровне производственной линии."
 management_VII_B: "Быстрое производство"
 management_VII_B_desc: "Гибридная двухтактная производственная система. Производство быстрого реагирования поддерживает короткие сроки выполнения заказа между продуктами, уменьшая задержку между инициированием и выполнением производственного процесса. Благодаря внедрению методов, которые приводят к сокращению сроков выполнения заказа, повышается производительность и снижаются затраты."
 management_VIII: "Модель зрелости интеграции"
 management_VIII_desc: "Интеграция модели зрелости потенциала - это модель развития, в которой многие практики и политики в производстве формализуются и оптимизируются, а специальные практики заменяются постоянными. Эта модель предназначена для разработки и совершенствования предыдущей и будущей управленческой политики и оказания помощи в развитии производственного процесса путем превращения регулярно проводимых специальных практик в формальную политику и их оценки для дальнейшей оптимизации."
 management_IX: "Бережное производство"
 management_X: "Гибкое производство"
