  #Encryption 
 enc_I: "Электронная система шифрования"
 enc_II: "Улучшенная электронная система шифрования"
 enc_III: "56-битное шифрование DES"
 enc_IV: "Брандмауэр"
 enc_V: "Антивирусное программное обеспечение"
 enc_VI: "Системы обнаружения и предотвращения вторжений"
 enc_VII: "Прокси"
 enc_VIII: "Постквантовая криптография"
 enc_IX: "Алгоритмы активной самообороны"
 enc_IX_short: "ААС"
 enc_I_desc: "С созданием электронных средств связи всегда существовала необходимость в электронном шифровании сообщений и их расшифровке. Была создана первая электронная шифровальная система KW-26. Он использовал более 800 ядер и 50 схем драйверов вакуумных ламп для создания зашифрованных сообщений с использованием логики магнитных сердечников. Цифровая система шифрования позволила ему создавать сообщения, более зашифрованные, чем когда-либо прежде."
 enc_II_desc: "Для того чтобы лучше шифровать информацию, необходимо внести многочисленные усовершенствования в систему электронного шифрования. Необходимо добавить больше комбинаций, чтобы предотвратить вероятность того, что машина будет использовать одну и ту же карту несколько раз. Необходимо принять дополнительные меры для предотвращения доступа к машине. Кроме того, к зашифрованным сообщениям необходимо добавить дополнительные слои."
 enc_III_desc: "DES - это первый созданный общедоступный стандарт шифрования. DES был создан в 1975 году компанией IBM. DES - это алгоритм системного ключа, то есть он использует один и тот же ключ как для шифрования, так и для дешифрования. Пока ключ хранится в секрете между двумя сторонами, шифрование является очень безопасным. Если ключ угадывается с помощью длительной и трудоемкой атаки грубой силы, или если ключ быстро похищается с помощью вредоносных программ, то сообщения могут быть расшифрованы. DES очень защищен от дифференциального криптоанализа, потому что ключи шифрования хранятся в секрете и уникальны, но уязвимы против взлома bruteforce."
 enc_IV_desc: "Брандмауэр-это система сетевой безопасности, которая отслеживает и контролирует входящий и исходящий сетевой трафик на основе правил безопасности. Брандмауэры могут эффективно предотвращать передачу информации из системы вредоносными программами, которые заразили систему, или предотвращать несанкционированный доступ в систему."
 enc_V_desc: "С появлением вредоносного программного обеспечения возникает необходимость в динамическом подходе к защите от общей уязвимости. В то время как уязвимости могут быть исправлены, бесконечная холодная война уязвимостей против эксплойтов ставит шифровальщика в серьезное невыгодное положение. Динамические антивирусы предназначены для прямого блокирования известных сигнатур вредоносных программ или эвристического блокирования подозрительной активности программного обеспечения. Это позволяет защитникам опережать угрозы, создавая более продвинутые антивирусы и антивирусные программы."
 enc_VI_desc: "Просто реактивно бороться с вирусами и известными вредоносными сигнатурами недостаточно. По мере того как программное обеспечение становится все более распространенным и мир становится все более сетевым, опасности продолжают возрастать. Эвристическое антивирусное программное обеспечение является проактивным и может пытаться искать вредоносные действия на компьютере и реагировать на нарушения безопасности без предварительного знания функций вредоносной программы."
 enc_VII_desc: ""
 enc_VIII_desc: "ПКК"
  
  #Decryption 
 decryption_I: "Электронная расшифровка"
 decryption_II: "Дифференциальный анализ"
 decryption_III: "Грубое дешифрование"
 decryption_IV: "Удаленный взлом"
 decryption_V: "Вредоносные программы/Шпионские программы"
 decryption_VI: "Наборы эксплойтов"
 decryption_VII: "SYN-флуд"
 decryption_VIII: "Квантовая расшифровка"
 decryption_IX: "Активные алгоритмы глубокого нарушения логики"
 decryption_IX_short: "Алгоритмы взлома ADL"
 decryption_I_desc: "Хотя первые электронные системы шифрования были более сложными, чем когда-либо прежде, их можно было победить. Если ключ был когда-либо повторно использован, то 2 потока зашифрованных сообщений можно было сравнить и расшифровать, автоматически выяснив логику машины с помощью повторного использования ключа атаки. Бит-листинг-это еще одна атака, которая опирается на уже известную часть сообщения. Если зашифрованные сообщения следуют определенному формату, то в качестве базы легко использовать известную информацию."
 decryption_II_desc: "Метод атаки, при котором пары открытого и зашифрованного текста используются в криптологической системе для обнаружения ключа. Для этого требуется доступ к входам и выходам открытого и зашифрованного текста. Вводя различные сообщения и сравнивая их с зашифрованным текстом, ключ шифрования может быть обнаружен и использован против желаемой зашифрованной информации."
 decryption_III_desc: "Грубая сила, как следует из названия, является чрезвычайно упрощенным и простым методом дешифровки. Просто попытавшись найти любое возможное решение или ключ, пока вы не получите решение с огромной вычислительной мощностью, зашифрованное сообщение может быть расшифровано. Он может быть использован практически на всех криптосистемах при условии, что имеется достаточная вычислительная мощность. Однако по мере того, как шифрование становится все более совершенным, это может в конечном итоге стать невозможным, поскольку более высокие уровни шифрования могут потребовать больше вычислительной мощности, чем разумно доступно."
 decryption_IV_desc: "Взлом имеет множество определений, но здесь он ссылается на получение несанкционированного доступа к компьютерной системе с помощью программного обеспечения. Удаленное получение доступа к системам путем использования уязвимостей в программном обеспечении может позволить хакеру скомпрометировать сеть и получить доступ к данным, уничтожить их или манипулировать ими в защищенной сети."
 decryption_V_desc: "Вредоносное ПО - это любая программа со злым умыслом, а шпионское ПО-это любая программа, которая неохотно собирает информацию от хоста. хотя попытка собрать информацию от хоста косвенно через расшифровку сообщений полезна, она становится неосуществимой, поскольку современная криптография становится слишком продвинутой. Вместо этого, принимая меры по удаленному устранению уязвимостей в программном обеспечении, желательно получить прямой доступ к незашифрованной информации. Кроме того, создание вредоносных программ или шпионских программ для заражения хоста с помощью уязвимостей или ловушек может открыть бэкдоры сами по себе."
 decryption_VI_desc: "Набор эксплойтов-это набор эксплойтов для уязвимостей, организованных в массивный каталог, действующий как хранилище. Наборы эксплойтов содержат огромное количество эксплойтов практически для всех уязвимостей практически во всех версиях практически всего программного обеспечения, предназначенного создателем набора эксплойтов. Это позволяет создателю вредоносного ПО или хакеру просто создать вредоносное ПО, которое они хотят, и прикрепить функциональный эксплойт. Все, что нужно знать создателю вредоносных программ, - это программное обеспечение и версии программного обеспечения, которое использует целевой компьютер, и они могут просматривать набор эксплойтов. Если создатели набора эксплойтов нашли уязвимость и сделали эксплойт, создателю вредоносного ПО просто нужно подключить его и подвергнуть его воздействию на целевой компьютер. Принадлежащие правительству наборы могут хранить уязвимости в секрете годами, пока они не захотят начать массированную атаку."
 decryption_VII_desc: ""
 decryption_VIII_desc: ""
  
