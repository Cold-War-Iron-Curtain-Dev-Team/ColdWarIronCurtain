 AIR_TITLE_CAS: "Штурмовая\nавиация"
 AIR_TITLE_FIGHTER: "Истребитель"
 AIR_TITLE_NAV: "Морской\nбомбардировщик"
 AIR_TITLE_HEAVY_FIGHTER: "Тяжелый\nистребитель"
 AIR_TITLE_MEDIUM_BOMBER: "Тактический\nбомбардировщик"
 AIR_TITLE_STRAT_BOMBER: "Стратегический\nбомбардировщик"
  
  ##CWIC Aircraft 
  
 fighter_light: "Легкие истребители"
 fighter_multirole: "Многоцелевые истребители"
 fighter_multirole: "Многоцелевые истребители"
 fighter_vtol: "Истребители вертикального взлета и посадки"
 fighter_interceptor: "Истребители завоевания превосходства в воздухе"
 tactical_bomber: "Тактические бомбардировщики"
 bomber_strategic: "Стратегические бомбардировщики"
 transport_air: "Транспортные самолеты"
 naval_bomber: "Морские бомбардировщики"
 cas_bomber: "Штурмовики"
  
  ##Vanilla Air Doctrines 
  
 TITLE_BATTLEFIELD_SUPPORT: "Боевая поддержка с воздуха"
 TITLE_OPERATIONAL_INTEGRITY: "Оперативное взаимодействие"
 TITLE_STRATEGIC_DESTRUCTION: "Стратегическое разрушение"
  
  ##CWIC Air Doctrines 
  
 air_doctrine_versatile: "Доктрина авиационной универсальности"
 air_doctrine_versatile_desc: "Эта доктрина фокусируется на чистой эффективности задания и готовности адаптироваться к любой ситуации без учета каких-либо конкретных стратегических интересов. Это дерево будет содержать множество преимуществ, которые сосредоточены на равностороннем и последовательном бою независимо от условий."
 air_doctrine_systemic: "Доктрина стратегических бомбардировок"
 air_doctrine_systemic_desc: "Эта доктрина направлена на улучшение стратегического потенциала военно-воздушных сил и их способности бомбить вражеские цели. Усиливая разрушительные возможности бомбардировщиков и улучшая их живучесть, они могут выполнять миссии с высоким риском без превосходства в трудных ситуациях."
 air_doctrine_integral: "Доктрина тактической целосности"
 air_doctrine_integral_desc: "В то время как стратегические операции могут обеспечить ключевые преимущества, армия настолько сильна, насколько ее самое слабое звено. Убедившись, что мы сильны и неукротимы на оперативном и тактическом уровне, мы можем полностью сокрушить врага."
  
 air_doctrine_versatile_tt: "§RВзаимоисключающий§! с §YДоктрина стратегических бомбардировок§! и §YДоктрина тактической целосности§!"
 air_doctrine_systemic_tt: "§RВзаимоисключающий§! с §YДоктрина авиационной универсальности§! и §YДоктрина тактической целосности§!"
 air_doctrine_integral_tt: "§RВзаимоисключающий§! с §YДоктрина авиационной универсальности§! и §YДоктрина стратегических бомбардировок§!"
  
  #Versatile Air Doctrine# 
  
 air_doctrine_versatile_1a: "Ночные операции"
 air_doctrine_versatile_1a_desc: "Обучение наших пилотов действовать и идентифицировать друг-или-враг в условиях низкой освещенности позволит им иметь больший успех во время ночных операций, давая большую гибкость в отношении того, когда операции могут быть проведены. Кроме того, эта тренировка может также помочь во время плохих погодных условий, когда видимость низкая."
 air_doctrine_versatile_1b: "Метеорологические сети"
 air_doctrine_versatile_1b_desc: "Оптимально было бы не начинать операции в неблагоприятную погоду. Однако война непредсказуема, и нам иногда приходится иметь дело с действиями в неблагоприятных условиях. Чтобы лучше справиться с этим, метеорологическая сеть, предназначенная для прогнозирования погоды и предоставления ключевой информации, лучше всего справляется с ней."
 air_doctrine_versatile_2: "Радионавигационный контроль"
 air_doctrine_versatile_2_desc: "Мы можем инвестировать значительные средства в методы аэронавигационной навигации, чтобы повысить эффективность полетов наших ВВС и расширить возможности наших навигационных команд в управлении полетами."
 air_doctrine_versatile_3a: "Расширенные учебные эскадрильи"
 air_doctrine_versatile_3a_desc: "Учебные эскадрильи - это подразделения, которые специализируются на подготовке ВВС и обучают новых пилотов, как правильно выполнять свои операции. Расширяя возможности эскадрилий и создавая более надежный режим, мы можем позволить нашим воздушным крыльям быть более подготовленными к бою и ускорить учения."
 air_doctrine_versatile_3b: "Экстренное обучение"
 air_doctrine_versatile_3b_desc: "В нашем тренировочном режиме отсутствует надлежащая подготовка к чрезвычайным ситуациям. Наши пилоты должны научиться справляться с отказами двигателей или погодными повреждениями с жестокой эффективностью."
 air_doctrine_versatile_4: "Приспосабливающиеся образования"
 air_doctrine_versatile_4_desc: "Наши реактивные соединения должны быть гибкими и позволять нашим пилотам адаптироваться к боевым ситуациям."
 air_doctrine_versatile_5a: "Высотный перехват"
 air_doctrine_versatile_5a_desc: "Разработка тактики миссии по сближению и перехвату врагов, летящих на большой высоте, может позволить нам нанести им удар еще до того, как они достигнут своей цели!"
 air_doctrine_versatile_5b: "Универсальные морские операции"
 air_doctrine_versatile_5b_desc: "С развитием новых технологий и военно-морской тактики наши военно-морские бомбардировщики будут сталкиваться с различными проблемами в своих миссиях. Разработка разнообразного набора тактик для борьбы с уникальными военно-морскими формированиями будет иметь большое значение."
 air_doctrine_versatile_5c: "Высотная точная бомбардировка"
 air_doctrine_versatile_5c_desc: "Чтобы избежать вражеского зенитного огня и перехвата, мы должны быть способны проводить высотные операции с нашими стратегическими бомбардировщиками. Высокоточные бомбардировочные вычислительные технологии могут позволить нам поражать вражеские цели с очень большой высоты, позволяя летать на большой высоте в середине операции."
 air_doctrine_versatile_5d: "Маскировка местности"
 air_doctrine_versatile_5d_desc: "Чтобы уклониться от противника и не дать ему легко снять наши интердикторы, мы должны использовать местность, чтобы замаскировать их приближение и избежать вражеского перехвата."
 air_doctrine_versatile_6a: "Соединения перехватчиков"
 air_doctrine_versatile_6a_desc: "[NEEDS DESCRIPTION]"
 air_doctrine_versatile_6b: "Облачность/обледенение"
 air_doctrine_versatile_6b_desc: "Вместо того, чтобы позволить облакам мешать, мы можем использовать их в качестве местности, отмечая новую эволюцию воздухоплавательной тактики. Оснащая наши самолеты противообледенительной техникой, они могут использовать облака и погодные элементы в наших интересах и либо использовать их для побега, либо для засады противника!"
 air_doctrine_versatile_6c: "Сверхзвуковая бомбардировка на малых высотах"
 air_doctrine_versatile_6c_desc: "Хотя бомбардировка в воздухе безопаснее, чем бомбардировка в воздухе в воздухе, бомбардировка в воздухе также может быть поражена врагами на расстоянии. Однако маловысотные сверхзвуковые бомбардировки иногда могут быть более безопасными, если местность ограничивает углы перехвата. Конечно, это всецело зависит от уникальной обстановки, и в зависимости от АО следует рассматривать как высокоточное бомбометание, так и низковысотные сверхзвуковые удары."
 air_doctrine_versatile_6d: "Тактика уклонения"
 air_doctrine_versatile_6d_desc: "Тактика уклонения и маневры могут значительно повысить живучесть наших самолетов"
 air_doctrine_versatile_7a: "Энергичная борьба"
 air_doctrine_versatile_7a_desc: "Энергетический бой-это очень сложный в освоении метод воздушного боя, требующий большой подготовки и обычно предполагающий поддержание пилотом высоких скоростей в бою."
 air_doctrine_versatile_7b: "Многоцелевой оппортунизм"
 air_doctrine_versatile_7b_desc: "Одним из преимуществ использования многоцелевых истребителей является их способность поражать как наземные, так и воздушные цели. Это позволяет каждому самолету своевременно нанести удар, когда они находятся в подходящий момент для атаки, не беспокоясь о том, что специализированные cas находятся в этом районе. Обучение пилотов, как использовать эти возможности, позволяет нам получить максимальную отдачу от наших мультиролей."
 air_doctrine_versatile_8: "Алгоритм прогнозирующей блокировки"
 air_doctrine_versatile_8_desc: "Используя прогностические алгоритмы, наши ракеты могут попытаться вернуться и нацелиться на цели, которые они потеряли, пока их не удастся вернуть. Таким образом, враг находится в еще большей опасности в облаках, потому что мы все еще можем искать их, даже если они не могут видеть нас."
 air_doctrine_versatile_9a: "Маневры реактивных истребителя"
 air_doctrine_versatile_9a_desc: "Бой всегда может преподнести сюрпризы. Реактивные истребители - это отзывчивые методы борьбы с неожиданными ситуациями."
 air_doctrine_versatile_9b: "Запрет"
 air_doctrine_versatile_9b_desc: "Бомбардировка вражеских подразделений снабжения или подрыв их на пути к вражеским войскам с помощью перехвата дает огромные преимущества нашим наземным подразделениям в бою и обеспечивает крупную награду за контроль над небом, достаточный для нанесения ударов по врагам далеко за их линией фронта."
 air_doctrine_versatile_10: "Программа обучения офицеров авиации"
 air_doctrine_versatile_10_desc: "Чтобы наши военно-воздушные силы были максимально адаптивными, мы будем обучать наших офицеров авиации по широкому учебному плану, чтобы они были всесторонне развиты и могли адаптироваться к любой ситуации."
  
  #Systemic Air Doctrine# 
  
 air_doctrine_systemic_1a: "Современная тактика эскорта бомбардировщиков"
 air_doctrine_systemic_1a_desc: "Раньше самолеты летали в строю чуть впереди бомбардировщиков и пытались вступить в бой с врагами, двигавшимися на перехват. Однако в век управляемых ракет мы должны перестроить наши соединения и методы защиты бомбардировщиков, оставив их далеко позади вне зоны досягаемости и имея крейсерские перехватчики, готовые вступить в бой с пятнистыми врагами."
 air_doctrine_systemic_1b: "Координация между бомбардировщиками"
 air_doctrine_systemic_1b_desc: "Наши бомбардировщики должны координировать свои действия друг с другом и с разведывательными самолетами, чтобы более эффективно обнаруживать и поражать цели бомбардировки и наносить удары по возможным целям."
 air_doctrine_systemic_2a: "Самолеты - разведчики"
 air_doctrine_systemic_2a_desc: "Нам нужно координировать усилия по обнаружению объектов обнаружения или перехвата противника на пути к цели, чтобы наши бомбардировщики могли подойти ближе, прежде чем их обнаружат. А скоординированные усилия между малозаметными разведывательными кораблями или разведывательными наземными элементами значительно снизят видимость наших бомбардировщиков."
 air_doctrine_systemic_2b: "Специальная полезная нагрузка"
 air_doctrine_systemic_2b_desc: "Знание-это половина успеха. Другая половина-это крайнее насилие. Создание запасов бомб, специализирующихся на уничтожении конкретных целей (то есть более мягкие цели получают более взрывоопасные бомбы, в то время как более жесткие цели нуждаются в форменных) и планирование наших миссий соответственно позволят нашим бомбардировщикам максимизировать урон!"
 air_doctrine_systemic_3: "Воздушные сети"
 air_doctrine_systemic_3_desc: "Чтобы помочь обнаружению вражеских истребителей-перехватчиков, мы должны создать массовые информационные сети, которые собирают информацию о вражеских воздушных позициях. Эти организованные усилия позволят повысить эффективность миссии."
 air_doctrine_systemic_4a: "Тактика против ВМФ"
 air_doctrine_systemic_4a_desc: "Флоты эволюционировали, и способ работы кораблей изменился. Принятие ЗРК и изменение военно-морских доктрин означают, что мы должны переосмыслить то, как мы проводим военно-морские бомбардировочные операции. Создание соединений и методов сокращения флотов и нанесения ударов по целям, которые могут поражать нас с расстояния в несколько километров, имеет решающее значение для успеха наших военно-морских бомбардировок."
 air_doctrine_systemic_4b: "Метеорологические сети"
 air_doctrine_systemic_4b_desc: "Оптимально было бы не начинать операции в неблагоприятную погоду. Однако война непредсказуема, и нам иногда приходится иметь дело с действиями в неблагоприятных условиях. Чтобы лучше справиться с этим, метеорологическая сеть, предназначенная для прогнозирования погоды и предоставления ключевой информации, лучше всего справляется с ней."
 air_doctrine_systemic_5a1: "Большие ПКР"
 air_doctrine_systemic_5a1_desc: "Наше внимание к бомбардировщикам привело к прогрессу в области АСМ. Мы должны отдавать приоритет усовершенствованным боеголовкам, приводящим к более тяжелым повреждениям."
 air_doctrine_systemic_5a2: "Улучшенные двигатели"
 air_doctrine_systemic_5a2_desc: "Наше внимание к бомбардировщикам привело к прогрессу в области АСМ. Мы должны уделять приоритетное внимание усовершенствованным двигателям и подвижности ракет для повышения точности."
 air_doctrine_systemic_5b1: "Сеть тактических операций"
 air_doctrine_systemic_5b1_desc: "Хотя мы можем сосредоточиться на стратегических операциях, мы можем и должны использовать наши обширные сети для поддержки наземных операций на тактическом уровне, чтобы диверсифицировать наши возможности."
 air_doctrine_systemic_5b2: "Сеть стратегических операций"
 air_doctrine_systemic_5b2_desc: "Мы сосредоточены на стратегических операциях и будем продолжать это делать. Создавая стратегическую оборонительную сеть, мы позволяем себе более эффективно выполнять задачи перехвата и срывать воздушные операции противника."
 air_doctrine_systemic_6a1: "Насыщение атаки"
 air_doctrine_systemic_6a1_desc: "С нашими более тяжелыми полезными нагрузками мы можем массировать атаки насыщения против вражеских флотов и подавлять их оборонительные возможности, что приводит к более общей выживаемости против атак наших морских бомбардировщиков."
 air_doctrine_systemic_6a2: "Дальние атаки"
 air_doctrine_systemic_6a2_desc: "С нашей большей дальностью действия, более точной полезной нагрузкой, мы можем наносить удары по вражеским кораблям с более дальнего расстояния и пытаться избегать вражеских перехватчиков / средств обороны все вместе, что приводит к большей живучести против атак наших военно-морских бомбардировщиков."
 air_doctrine_systemic_6b1: "Приоритет поддержки войск"
 air_doctrine_systemic_6b1_desc: "Система управления полетами и стратегическая сеть должны уделять приоритетное внимание элементам задач вспомогательной поддержки, а не элементам задач превосходства для повышения эффективности тактических операций."
 air_doctrine_systemic_6b2: "Установка приоритетов заданий"
 air_doctrine_systemic_6b2_desc: "Управление полетами и стратегическая сеть должны уделять приоритетное внимание элементам задачи содействия превосходству перед элементами задачи поддержки для повышения эффективности стратегической миссии."
 air_doctrine_systemic_7a: "Полностью интегрированная система разведки бомбардировщиками"
 air_doctrine_systemic_7a_desc: "Создание полностью интегрированной и оптимизированной системы разведки для обнаружения и картографирования вражеских патрулей перед бомбардировочными полетами предотвратит обнаружение наших бомбардировщиков до тех пор, пока не станет слишком поздно."
 air_doctrine_systemic_7b: "Высотные самолеты-разведчики"
 air_doctrine_systemic_7b_desc: "Высотные разведывательные самолеты с высоким махом имеют очень много применений. Используя их для разведки перед морскими бомбардировочными миссиями и составления карт вражеских морских патрулей, наши бомбардировщики могут приблизиться, использовать больше возможностей и пережить больше миссий."
 air_doctrine_systemic_7c: "Использование радарных технологий для стратегической бомбардировки"
 air_doctrine_systemic_7c_desc: "Предоставляя нашим стратегическим бомбардировочным элементам специальные самолеты-радары, мы гораздо более способны защитить их от приближающихся перехватчиков."
 air_doctrine_systemic_7d: "Использование технологий разведки для стратегической бомбардировки"
 air_doctrine_systemic_7d_desc: "Предоставление нашим стратегическим бомбардировочным разведывательным элементам разведывательных самолетов может позволить им более эффективно отслеживать и обнаруживать цели и наносить больший урон."
 air_doctrine_systemic_8a: "Плановые проверки авиабазы"
 air_doctrine_systemic_8a_desc: "Регулярно планируя инспекции авиабаз, мы можем сократить количество аварий, выявляя и устраняя проблемы, ошибки и неэффективность в операциях технического обслуживания на месте."
 air_doctrine_systemic_8b: "Сети поиска и спасения"
 air_doctrine_systemic_8b_desc: "Чтобы предотвратить потерю опытных пилотов после авиакатастрофы, необходимо создать организованную поисково-спасательную систему с использованием стратегических ресурсов управления полетами."
 air_doctrine_systemic_9a: "Дистанционная война"
 air_doctrine_systemic_9a_desc: "Дроны и беспилотные транспортные средства - это путь будущего. Наша стратегическая сеть идеально подходит для дистанционного управления ударными элементами БПЛА и с помощью некоторых упражнений может разработать впечатляющую тактику удара беспилотника, которую вы не можете сделать с пилотируемыми самолетами."
 air_doctrine_systemic_9a_tt: "§CУдаленная война позволяет§!§Y Атака БПЛА§!§C противоповстанческая операция§!"
 air_doctrine_systemic_9b: "Удары для противостояния"
 air_doctrine_systemic_9b_desc: "С нашей обширной стратегической сетью мы можем атаковать цели далеко за пределами их эффективной дальности и уклоняться от оборонительного огня."
 air_doctrine_systemic_10: "Стратегическое отслеживание"
 air_doctrine_systemic_10_desc: "Отслеживание элементов вражеских истребителей с момента их обнаружения позволит нам не быть застигнутыми врасплох во время бомбардировок."
  
 air_doctrine_systemic_5a1_tt: "§RВзаимоисключающий§! с §YУлучшенные двигатели§!"
 air_doctrine_systemic_5a2_tt: "§RВзаимоисключающий§! с §YБольшие ПКР§!"
 air_doctrine_systemic_5b1_tt: "§RВзаимоисключающий§! с §YСеть стратегических операций§!"
 air_doctrine_systemic_5b2_tt: "§RВзаимоисключающий§! с §YСеть тактическихак операций§!"
  
  #Integral Air Doctrine# 
  
 air_doctrine_integral_1a: "Массированные соединения реактивных самолетов"
 air_doctrine_integral_1a_desc: "Использование массированных реактивных соединений и патрулей позволит нам более эффективно обнаруживать и атаковать вражеские перехватчики."
 air_doctrine_integral_1b: "Фронтовая авиация"
 air_doctrine_integral_1b_desc: "Использование фронтовой авиации в прорывах и интеграция их в атаки на фронте значительно улучшает наши возможности поддержки с воздуха. Благодаря тесной координации с сухопутными войсками и опасным ударам с близкого расстояния мы можем поддерживать динамику на поле боя."
 air_doctrine_integral_2a1: "Приоритет обороны"
 air_doctrine_integral_2a1_desc: "Наши самолеты должны маневрировать, чтобы остаться в живых. Они должны избегать ненужных рисков и, как правило, стараться остаться в живых."
 air_doctrine_integral_2a2: "Приоритет наступления"
 air_doctrine_integral_2a2_desc: "Чтобы выиграть войну, мы должны идти на жертвы. Продолжая наступление и настойчиво ища цели, мы значительно улучшим наши боевые возможности, даже если это будет означать несколько потерь."
 air_doctrine_integral_2b1: "Авангард атакующей авиации"
 air_doctrine_integral_2b1_desc: "Помимо поддержки войск, наши самолеты должны находить возможности для нанесения острых ударов, создавать потенциальные точки прорыва и помогать наземным силам."
 air_doctrine_integral_2b2: "Вторая линия атакующей авиации"
 air_doctrine_integral_2b2_desc: "Хотя лобовые атаки с помощью самолетов могут быть плодотворными, наши самолеты должны уделять приоритетное внимание удержанию рубежей и защите от вражеских наступлений, прежде всего."
 air_doctrine_integral_3a1: "Раннее предупреждение в воздухе"
 air_doctrine_integral_3a1_desc: "Использование дешевых самолетов или специальных наземных элементов для патрулирования неба и разметки вражеских воздушных наступлений защитит наши войска и даст нам больше шансов обнаружить вражеские подразделения превосходства в воздухе."
 air_doctrine_integral_3a2: "Помеха истребителям"
 air_doctrine_integral_3a2_desc: "[НУЖНА ИНФА]"
 air_doctrine_integral_3b1: "Дозаправка в воздухе"
 air_doctrine_integral_3b1_desc: "Операция передачи топлива с одного летательного аппарата на другой во время полёта."
 air_doctrine_integral_3b2: "Насыщение атаки"
 air_doctrine_integral_3b2_desc: "С нашими более тяжелыми полезными нагрузками мы можем массировать атаки насыщения против вражеских флотов и подавлять их оборонительные возможности, что приводит к более общей выживаемости против атак наших морских бомбардировщиков."
 air_doctrine_integral_4a: "Высокоскоросные маневры"
 air_doctrine_integral_4a_desc: "Высокоскоросные маневры - это маневры, выполняемые на низких скоростях с большими углами атаки и предназначенные для того, чтобы обойти врагов на более низких скоростях. Эти маневры могут помочь преодолеть более скоростных врагов с большей ловкостью."
 air_doctrine_integral_4b: "«Бродячие» станции"
 air_doctrine_integral_4b_desc: "[НУЖНА ИНФА]"
 air_doctrine_integral_5: "Тяжелые полевые операции (Единицы быстрого развертывания)"
 air_doctrine_integral_5_desc: "Создание передовых авиабаз с использованием подразделений быстрого развертывания позволяет армии создавать своевременные, поспешно созданные авиабазы и избегать проблем, возникающих из-за вражеских авиационных подразделений или скоординированных артиллерийских ударов, наносящих ущерб хорошо установленным полям."
 air_doctrine_integral_6a: "Достоинства воздушных соединений"
 air_doctrine_integral_6a_desc: "Награждение заслуг и продвижение по службе хорошо работающих воздушных крыльев-отличный способ поощрять координацию команды и взаимопомощь среди подразделения, что значительно вознаграждает сплоченность."
 air_doctrine_integral_6b: "Заслуженные звенья"
 air_doctrine_integral_6b_desc: "Награждение за заслуги и продвижение по службе хорошо зарекомендовавших себя пилотов - отличный способ поощрить честолюбие и наградить мастерство."
 air_doctrine_integral_7a: "Поощрительные стимулы авиакрыльям"
 air_doctrine_integral_7a_desc: "Предоставление стимулов и вознаграждений хорошо выполняющим воздушным крыльям, таким как приоритет улучшения и более качественное оборудование, позволит нам получить максимальную отдачу от этих квалифицированных подразделений в командных усилиях, таких как миссии перехвата."
 air_doctrine_integral_7b: "Тактики реактивных штурмовиков"
 air_doctrine_integral_7b_desc: "Разработанная советами тактика реактивных штурмовиков представляет собой большой комплекс маневров и тактик наземной поддержки, предназначенных для повышения эффективности и летальности операций наземной поддержки."
 air_doctrine_integral_7c: "Поощрительные стимулы пилотам"
 air_doctrine_integral_7c_desc: "Предоставление стимулов и вознаграждений хорошо работающим летчикам, таких как приоритет улучшения и более высокое качество оборудования, позволит нам получить максимальную отдачу от этих квалифицированных подразделений в индивидуальных усилиях, таких как вспомогательные миссии."
 air_doctrine_integral_8a: "Сосредоточение на земле"
 air_doctrine_integral_8a_desc: "Комбинируя массированные формирования, наземные атаки насыщения поражают фокусы в линиях противника с огромной свирепостью и сокрушают оборону АА противника, чтобы создать небольшие потенциальные точки прорыва, которые будут использоваться наземными силами."
 air_doctrine_integral_8b: "высокоинтенсивные операции"
 air_doctrine_integral_8b_desc: "Использование полей грубого продвижения (нет, не "продвинутого", пожалуйста, перестаньте говорить, что это опечатка) позволяет воздушным частям поддерживать высокий уровень давления, поскольку они могут быть быстро размещены ближе к полю боя для более короткого времени полета."
 air_doctrine_integral_8c: "Воздушно-наземные объединенные отряды"
 air_doctrine_integral_8c_desc: "Интеграция воздушного боя с общевойсковыми атаками помогает гарантировать, что как воздушные, так и наземные подразделения в наступлении с большей вероятностью выживут и добьются успеха."
 air_doctrine_integral_9a: "Дальнее сопровождение"
 air_doctrine_integral_9a_desc: "Во время атак насыщения самолеты дальнего сопровождения отстают от самолетов CAS и остаются начеку для вражеских перехватчиков, которые могут попытаться сорвать миссию."
 air_doctrine_integral_9b: "Тактика мобильных подразделений быстрого развертывания"
 air_doctrine_integral_9b_desc: "Мобильные подразделения быстрого развертывания, интегрированные в наземные подразделения и координирующие свои действия с ними, более способны создавать более безопасные труднодоступные районы, поддерживая высокий уровень связи с наземными офицерами и постоянно информируя их об изменениях на фронте."
 air_doctrine_integral_9c: "Первенство ВВС"
 air_doctrine_integral_9c_desc: "Когда ситуация становится критической и воздушные подразделения подвергаются риску, сухопутные войска во время общевойсковых атак должны отдавать приоритет угрозам воздушным подразделениям, а не наземным подразделениям."
 air_doctrine_integral_10a: "Каналы передачи данных"
 air_doctrine_integral_10a_desc: "Создание каналов передачи данных "воздух-воздух" между элементами внутри массированных патрулей перехватчиков улучшит взаимодействие и обеспечит более точные данные для каждого отдельного самолета."
 air_doctrine_integral_10b: "Активное слежение с воздуха"
 air_doctrine_integral_10b_desc: "Активное отслеживание наземных целей и поддержание высокого уровня обмена данными между войсками, нуждающимися в поддержке с воздуха, и элементами КАС позволит нашим КАС наносить удары более эффективно и точно."
  
