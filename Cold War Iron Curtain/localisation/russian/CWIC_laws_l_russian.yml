 edict_services_project_transit: "Узловой общественный транспорт"
 edict_services_project_transit_desc: "Узловые программы общественного транспорта - это обширные системы общественного транспорта, которые обеспечивают непрерывный транспорт по городу. Узловые сети не требуют предварительного планирования пассажирами и, как правило, взимают плату непосредственно с налога, чтобы способствовать использованию общественного транспорта. Вам не нужно беспокоиться, если поезда будут ходить вовремя, если поезда ходят все время."
