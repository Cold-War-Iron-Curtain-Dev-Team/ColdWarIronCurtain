 ReligionChristianity: "Христианство"
 ReligionChristianity_desc: "Христианство - это авраамическая монотеистическая религия, основанная на учении Иисуса. Христиане верят, что Иисус - Христос, мессия, предсказанный в Танахе. После обращения римского императора религия стала доминирующей верой как в Западной, так и в Восточной Римской империи. На протяжении веков христианство подвергалось расколам, но оно стало доминирующей религией в Европе и соседних регионах. Приход колониализма и миссий прозелитизма распространил веру по всему миру, сделав христианство самой большой верой и самой распространенной верой на планете."
 ReligionChristianityCatholic: "Католичество (Христианство)"
 ReligionChristianityProtestant: "Протестантство (Христианство)"
 ReligionChristianityOrthodox: "Православие (Христианство)"
 ReligionChristianityOriental: "Восточное православие (Христианство)"
 ReligionChristianityCatholic_desc: "Католицизм - крупнейшая христианская конфессия, возглавляемая епископом Рима, известным как Папа. Церковь расположена в Ватикане, в Риме. Католики считают, что их церковь была основана Иисусом, а ее епископы являются преемниками апостолов. Церковь и ее последователи продолжают придерживаться традиционных церковных обычаев и следовать духовенству под руководством Папы. Сегодня католицизм присутствует почти в каждой стране, и, хотя церкви не хватает политического влияния ее ранних дней, она остается огромным влиянием на своих последователей, особенно в Европе и Южной Америке."
 ReligionChristianityProtestant_desc: "Под протестантизмом понимается ряд религиозных движений, возникших в XVI веке во время Реформации. Его основатели не соглашались с католической доктриной, особенно в отношении светских полномочий церкви, роли ее духовенства и некоторых религиозных обрядов. Протестантская церковь стремилась распространить местные знания Библии и положить конец тому, что они считали суеверными практиками католической церкви. Сегодня существует множество различных протестантских церквей, и их последователи в большом количестве присутствуют в Западной Европе и США."
 ReligionChristianityOrthodox_desc: "Православная церковь считает себя церковью апостольского преемства и считает, что Римско-католическая церковь Папы покинула церковь во время Великого раскола 1054 года. Раскол произошел из-за споров о статусе папского первенства и изменений в толкованиях, которые Папа пытался навязать. Православная Церковь - это не одна церковь, а совокупность церквей в общем, поэтому у каждой церкви разные лидеры и разные литургические традиции. У церкви есть последователи на Балканах, в Восточной Европе и Средиземноморье. Несмотря на подъем ислама и недавнего коммунизма в Восточной Европе, усилия верующих внутри стран и диаспоры позволяют сопротивляться режимам."
 ReligionChristianityOriental_desc: "Восточная Православная Церковь отличается от других деноминацей доктрины, что сам Иисус Христос имеет особую природу, в отличие от человеческой и божественной, как это было сделано на Халеседонском соборе. Восточное православие сформировало историю Армении, Египта, Ассирии, Восточной Африки и даже Кералы в Индии. Восточная Православная Церковь - это не одна церковь, а совокупность церквей в общем, поэтому у каждой церкви разные лидеры и разные литургические традиции."
 ReligionJudaic: "Иудаизм"
 ReligionJudaic_desc: "Иудаизм - первая и самая старая авраамическая монотеистическая религия. Его часто считают этнической религией, и ее приверженцы являются потомками израильтян бронзового века. Последователи иудаизма обычно придерживаются устных традиций, Танаха и других традиционных писаний. Авраам считается первым евреем, и из его родословной возникла еврейская община. Многие последователи описывают иудаизм как выражение завета, заключенного Богом с израильтянами и их потомками. На протяжении веков еврейские общины распространились по всему миру, особенно в Европе и на Ближнем Востоке, играя ведущую роль в развитии науки, социальных теорий и торговли. Однако, как вечное меньшинство, они столкнулись с периодами интенсивных преследований, а в последнее время - с геноцидом в Европе. Израиль - единое еврейское государство, но общины еврейской диаспоры продолжают существовать по всему миру."
 ReligionJudaism: "Иудаизм"
 ReligionJudaism_desc: "Существует множество интерпретаций религиозных текстов, устных традиций и практик веры. Эта кажущаяся гибкость идентичности связана с этнической религиозной природой веры. Как правило, почти все последователи иудаизма считают себя потомками Авраама. Хотя большинство иудейских религиозных обрядов может выполнять последователь, юридические вопросы и толкования обычно адресованы религиозным ученым, называемым раввинами, которые предоставляют своим последователям руководство и знания. В последнее время появление национализма, секуляризма и рационализма привело к появлению новых интерпретаций и появлению конгрегаций. Хотя Израиль является еврейским государством, еврейская диаспора продолжает существовать и процветать по всему миру. Однако общины, остающиеся в Восточной Европе, на Ближнем Востоке и в Африке, действительно подвергаются преследованиям."
 ReligionIslamic: "Исламизм"
 ReligionIslamic_desc: "Ислам появился в седьмом веке и является новейшей авраамической монотеистической верой. Его последователи, называемые мусульманами, верят в абсолютное верховенство Бога, переведенное Аллаху на арабский язык. Они верят, что последним пророком Бога был Мухаммад, открывший Коран, который мусульмане считают нефильтрованными словами Бога. Несмотря на раскол в отношении того, кто унаследовал политическую власть после смерти Мухаммеда, ислам быстро рос, будь то конфликты, торговля, мистики или миссионеры. Сегодня ислам присутствует по всему миру, но особенно распространен на Ближнем Востоке, в Азии, Африке и некоторых частях Европы. Европейский империализм видел большую часть исламского мира колонизированной. С началом деколонизации многие мусульманские общества должны обсудить, являются ли возвращение к традиционным обычаям или стремление к модернизации ключом к обеспечению защиты и здоровья их обществ."
 ReligionIslamSunni: "Суннизм (Исламизм)"
 ReligionIslamShia: "Шиизм (Исламизм)"
 ReligionIslamIbadi: "Ибади (Исламизм)"
 ReligionIslamSunni_desc: "Самая крупная конфессия ислама в мире. Как и все мусульмане, они должны следовать пяти столпам ислама, которые считаются основой веры. Здесь нет официального духовенства, многие мусульмане-сунниты часто обращаются к религиозным ученым за советом по духовности, жизни и закону. Юридические аргументы и решения религиоведов основаны на Коране, хадисах и доводах. Суннитский ислам возник во время ожесточенных конфликтов по поводу того, кто станет преемником Мухаммеда. Сегодня обе конфессии установили разные правовые нормы. В настоящее время подавляющее большинство мусульман во всем мире являются суннитами, и в целом они составляют самое многочисленное мусульманское население во всех мусульманских государствах, кроме Ирана. В Сирии, Ливане и Ираке их нет в подавляющем большинстве."
 ReligionIslamShia_desc: "Вторая по величине конфессия ислама в мире. Его истоки лежат в спорах о том, кто станет преемником Мухаммеда после его смерти. Шииты, в отличие от суннитов, считали наследование несправедливым и почитали убитых Али и Хусейна как мучеников. Хотя обе конфессии признают важность пяти столпов и верховенства Корана, правовые решения ученых-шиитов расходятся с суннитскими юридическими школами. Кроме того, у шиитов-двунадесятников есть официальное духовенство, состоящее из ученых разных рангов, которые выносят решения и руководят сообществом. Мусульмане-шииты составляют явное большинство в Иране и большинство в Ираке, но составляют значительное меньшинство на Ближнем Востоке и в Южной Азии."
 ReligionIslamIbadi_desc: "Ибадийский ислам, хотя и гораздо меньшая по численности конфессия, возможно, является самой старой конфессией из все еще действующих. Ибадийский ислам возник всего через двадцать лет после смерти Мухаммеда как оппозиция третьему халифу. Конфликты с более поздними халифами привели к изгнанию секты во внутренние районы современного Омана. В конце концов Ибадис сформировал избранного имамата в стране. Хотя и суннитские, и шиитские ученые относятся к группе подозрительно, их практики и верования очень похожи, хотя у них есть доктринальные различия как с суннитами, так и с шиитами. Ибади составляют большинство населения только в Омане, однако, есть общины Ибади в Северной Африке."
 ReligionBuddhism: "Буддизм"
 ReligionBuddhism_desc: "Буддизм состоит из множества различных традиций, практик и верований, основанных на учении Будды, философа пятого века до нашей эры. Его истоки восходят к Индии, но в последующие века он распространился по Азии. Буддийские верования часто ориентированы на преодоление страдания и бесконечный цикл перевоплощений через достижение духовного блаженства через Нирвану или следование путем состояния Будды. Есть несколько основных ветвей веры, которые обычно разделены географией. Несмотря на рост различных религий и колониализм в последние годы, буддизм остается очень влиятельной и популярной религией."
 ReligionBuddhismVajrayana: "Ваджраяна (Буддизм)"
 ReligionBuddhismMahayana: "Махаяна (Буддизм)"
 ReligionBuddhismThereveda: "Тхеравада (Буддизм)"
 ReligionBuddhismVajrayana_desc: "Традиция Ваджраяны началась со средневековых индийских адептов. Их основные тексты - буддийские тантры. Духовная цель практикующих Ваджраяну - достичь просветления, следуя путем состояния Будды. Они верят, что тантры - самый эффективный способ достижения духовных целей. Он имеет сходство с традициями Махаяны и использует их тексты. Однако, в отличие от других буддийских традиций, Ваджраяна не требует от практикующих изгонять негативные чувства, такие как жадность или ненависть, а вместо этого использовать их на своем пути к просветлению. Ваджраяна прочно обосновалась в Гималаях, Тибете, Монголии и некоторых частях восточной России."
 ReligionBuddhismMahayana_desc: "Крупнейшая традиция буддизма, ее последователи ищут просветления путем Бодхисаттвы на благо всего человечества. Последователи Махаяны верят, что просветление доступно каждому за жизнь. Традиция восходит к первому веку нашей эры. Последователи Махаяны не привязаны к каким-либо конкретным доктринам, текстам или практикам. Его учение достаточно разнообразно, чтобы в нем можно было учить множество различных форм. Это особенно распространено в Восточной Азии, Китае и Вьетнаме."
 ReligionBuddhismThereveda_desc: "Тхеравада - старейшая традиция буддизма, которая все еще существует, ее истоки восходят примерно к третьему веку до нашей эры. Его последователи сохранили свои тексты в сборнике под названием Палийский канон, который является старейшим и единственным сборником учений Будды в его оригинальном тексте, существующим сегодня. Пали, классический индийский язык, является священным языком его последователей. Его доктрины основаны на Палийском каноне и разделяются с другими основными буддийскими традициями, хотя последователи Тхеравады подчеркивают необходимость полного очищения человека, ищущего просветления, от нечистых импульсов или эмоций. Исторически традиция распространилась на Шри-Ланку, откуда миссионеры путешествовали по Юго-Восточной Азии. Сегодня Шри-Ланка и большая часть Юго-Восточной Азии являются основными землями последователей Тхеравады."
 ReligionEastern: "Восточная философия"
 ReligionEastern_desc: "Восточная философия относится к доктринам и идеям, которые веками разрабатывались мыслителями Китая, Японии и Индии, среди прочих. Эти различные идеи смешались и эволюционировали во взаимодействиях и сыграли важную роль в развитии идей на азиатском континенте. Приход западной философии и колониализма открыто бросил вызов этим идеям и заставил многих найти способы совместить некоторые из этих идей со своими традиционными верованиями."
 ReligionShinto: "Синтоизм (Восточная)"
 ReligionTraditionalEastern: "Традиционная религия (Восточная)"
 ReligionConfucian: "Конфуцианство (Восточная)"
 ReligionShinto_desc: "Синтоизм часто называют политеистической религией Японии, которая возникла из различных верований и практик, развившихся на острове с доисторических времен. Последователи синтоизма практикуют различные фестивали и традиции в честь своих предков и общины. Приход и популярность буддизма заставили японское общество синкретизировать два верования, чтобы приспособить его к людям. Однако в девятнадцатом веке японское государство открыто контролировало религию и ее доктрину, устранив все буддийское влияние на синтоизм и сделав его соблюдение обязательным. Правительство стремилось использовать синтоизм не как религию, а как философию, способствующую национальному единству и патриотизму. Государственный синтоизм был распущен после Второй мировой войны, но многих японских лидеров все еще привлекает возможность включения синтоизма для возрождения нации."
 ReligionTraditionalEastern_desc: "Восточные религии - это те, которые возникли в Восточной, Южной и Юго-Восточной Азии. Они основаны на различных культурных, философских и временных периодах по сравнению с религиями, возникшими на Западе или в Африке. Из-за населения и разнообразия Азии эти религии в целом были адаптируемыми и распространились среди многих групп населения. Недавнее появление западной религии и философии в периоды индустриализации и колониализма заставило эти религии отреагировать и адаптироваться, чтобы сохранить свое влияние."
 ReligionConfucian_desc: "Конфуцианство - это сложная система поведения и мышления, которая возникла в учении китайского философа Конфуция в шестом веке до нашей эры. Практики конфуцианства стремятся к единству человека с Небом. Этого можно достичь только тогда, когда человек осознает свою человечность и построит стабильное общество и семью. На протяжении веков китайские династии исповедовали конфуцианство и сильно полагались на его учения для обучения бюрократии. Однако появление западной мощи в конечном итоге подтолкнуло правительство к тому, чтобы запретить студентам изучать конфуцианство в пользу западных специальностей. Несмотря на упадок государственной религии, ее философские принципы по-прежнему оказывают большое влияние не только на Китай, но и на Восточную Азию в целом."
 ReligionIndoiranian: "Индоиранская"
 ReligionIndoiranian_desc: "Говорят, что индоарийский народ мигрировал на Индийский субконтинент из степей тысячи лет назад. Они принесли языки и культурную самобытность, которая распространилась на все районы, в которых они жили. Сегодня можно увидеть, что их потомки и лингвистическое наследие связывают народы из Центральной Азии от Ирана до Бенгалии и Шри-Ланки. Благодаря этим общим языковым и культурным практикам они также адаптировались к местным религиозным обычаям территорий, в которых они поселились."
 ReligionHindu: "Индуизм (Индоиранская)"
 ReligionSikh: "Сикхизм (Индоиранская)"
 ReligionJain: "Джайнизм (Индоиранская)"
 ReligionTraditionalIranian: "Зороастризм (Индоиранская)"
 ReligionHindu_desc: "Индуизм сам по себе не является отдельной религией, а синтезом всех различных религий и традиций Древней Индии. Индоарийские ведические племена сыграли важную роль в индуистском синтезе, и на протяжении веков способность индуизма адаптировать и синтезировать различные верования позволила ему развиваться, в конечном итоге вытеснив буддизм в качестве основной религии в Индии. Приход ислама, а затем и западный колониализм поставили перед индуизмом новые вызовы, поскольку эти религии были открытыми вызовами синкретической природе индуизма. Движение за реформы в девятнадцатом веке привело к возрождению индуизма, которое продолжается и по сей день, оно подтолкнуло религию к тому, чтобы больше сосредоточиться на идее о том, что божественное можно найти в каждом человеке, и побудило индусов подходить к социальным проблемам с модернистским подходом. Индуистское население можно увидеть по всей Азии, но наиболее заметно в Южной Азии, особенно в Индии."
 ReligionSikh_desc: "Сикхизм, одна из самых молодых религий на планете, возник в конце пятнадцатого века в Южной Азии. Религия основана на учении Гуру Нанака и девяти Гуру, пришедших ему на смену. Сикхские верования и священные писания сосредоточены на вере и размышлении об имени единого творца, божественном единстве всех людей и вере в жизнь ради справедливости, мира и честности. Наряду с этими убеждениями существует отрицание того, что любая вера действительно может знать абсолютную истину. Религия определяется как находящаяся под сильным влиянием индуистских и мусульманских религиозных традиций, и, несмотря на интенсивные преследования, особенно со стороны Империи Великих Моголов, ей удалось вырасти за счет обращения как индуистов, так и мусульман. Эти периоды преследований вызвали развитие в вере сложной воинской традиции. Сегодня сикхизм распространен по всей Южной Азии, но наиболее сконцентрирован в Пенджабе."
 ReligionJain_desc: "Джайнизм - древняя индийская религия, последователи которой изучают два текста, Агамы и Парамагамы. Джайны верят в несколько религиозных идей, включая ненасилие, честное поведение, аскетизм и непривязанность. Многие из его верований связаны с элементами индуизма. Последователи джайнизма также дают пять обетов, в которых клянутся, среди прочего, соблюдать принципы ненасилия и аскетизма. Строгая пацифистская религия имеет несколько миллионов преданных последователей, в основном в Индии, хотя небольшие общины джайнов присутствуют по всей Азии."
 ReligionTraditionalIranian_desc: "Зороастризм - одна из старейших религий на планете. Его последователи верят в учение древнеиранского пророка Зороастра. Сторонники этой веры верят в дуалистическую космологию добра и зла, которая в конечном итоге приведет к поражению зла. Основной текст веры - Авеста. Религия выросла под покровительством великих персидских династий древности. Александр Великий вытеснил веру, но Парфянская империя возродила ее. Однако с приходом ислама число зороастрийцев сильно сократилось из-за обращения, а иногда и подавления. Несмотря на это, в Иране и в небольших общинах Южной Азии все еще практикуют зороастрийцы."
 ReligionNoreligion: "Без религии"
 ReligionNoreligion_desc: "На протяжении всей истории большинство народов верили или жили в соответствии с определенным религиозным мировоззрением. Однако в последние столетия наблюдался рост новых научных теорий и философий, которые поставили под вопрос принятие любой религиозной идентичности. Возникновение индивидуальных прав, секуляризм, новые технологии в путешествиях и знание других верований - все это в совокупности позволяет людям идентифицировать себя как нерелигиозные. Это привело к развитию множества способов взглянуть на мир или установить духовную связь с ним."
 ReligionIrreligious: "Нерелигиозный (Не религиозный)"
 ReligionAtheist: "Атеизм (Не религиозный)"
 ReligionIrreligious_desc: "Это мировоззрение состоит из индивидов, которые безразличны к религии в целом, или индивидов, которые считают, что человеческий разум неспособен понять, существует ли высшая сила или нет. Эти мировоззрения уходят корнями в секуляризм и связанные с ним дискуссии, которые возникли в эпоху Просвещения в Европе. Тем не менее, ученые могут проследить элементы этих идей в философах и трудах людей со всего мира и во все времена. Современные писатели предполагают, что эти писатели не могли открыто заявить о своем понимании мира, опасаясь того, как общество в целом отнесется к ним."
 ReligionAtheist_desc: "Атеизм - это неверие в какие-либо божества. На протяжении всей истории такое убеждение часто было очень опасным, и любой, кто придерживался этого взгляда, обычно скрывал его. Хотя его присутствие можно обнаружить еще в древней Южной Азии и Греции. Эпоха Просвещения предоставила возможность атеистам, наконец, появиться и сформулировать свои убеждения. Появление научных достижений и вера в достоверность науки также подтолкнула многих к принятию атеизма. Коммунизм твердо поддерживает атеизм, и его рост в последнее время привел к тому, что атеизм широко пропагандировался многими коммунистическими государствами и партиями."
 ReligionEsoteric: "Эзотерика"
 ReligionEsoteric_desc: "Эзотеризм - это изучение различных религиозных, философских или научных текстов для поиска скрытых или более глубоких значений. Некоторые изучают эти тексты или философию, чтобы найти скрытый смысл или связь между ними. Другие стремятся найти доказательства магии или мира за пределами того, что можно увидеть в физических науках. Наконец, последователи этих философий стремятся получить более высокие знания или исследовать идеи и концепции, игнорируемые основным направлением."
 ReligionStatist: "Статизм (Эзотерика)"
 ReligionCultistSafe: "Культивирование космополитизма (Эзотерика)"
 ReligionCultistFatal: "Культивирование воинственности (Эзотерика)"
 ReligionTraditionalAfrican: "Коренные африканцы (Эзотерика)"
 ReligionTraditionalAmerican: "Коренные американцы (Эзотерика)"
 ReligionTraditionalOceanic: "Аборигены Океании (Эзотерика)"
 ReligionMessianic: "Фурри (Эзотерика)"
 ReligionOther: "Незначительная / Другое (Эзотерика)"
 ReligionStatist_desc: "Из-за государственной пропаганды и государственного контроля ряд граждан в данном государстве считают своего политического лидера фигурой почти религиозного значения. Идея о том, что политическому главе либо поклоняются, либо рассматривают его как небесную фигуру, не нова. В Восточной Азии это делалось широко, особенно в китайских и японских императорских династиях. В Европе многие монархи узаконили свое правление как волю Бога и свое присутствие как предписано с небес. Достижения в области технологий и появление современных государственных институтов позволили распространить такие идеи среди граждан различными путями."
 ReligionCultistSafe_desc: "Культы - это группа людей с общим набором убеждений, которые противоречат установленной власти. Этим авторитетом, среди прочего, может быть основная религия, политический авторитет или общественные нормы. Члены этих культов могут исповедовать различные верования или религии, но они не распространяют насилие среди своих членов или общества в целом. Хотя многие местные сообщества могут найти такие группы отчуждающими и даже расстраивающими, отсутствие в них насилия или вмешательства в жизнь общества в целом гарантирует, что группа не станет проблемой для государства или общества в целом. Однако их часто оставляют в изоляции, поэтому, если они действительно прибегают к насилию, об этом обычно не становится известно до тех пор, пока их действия не повлияют на общество в целом."
 ReligionCultistFatal_desc: "Культы - это группа людей с общим набором убеждений, которые противоречат установленной власти. Этим авторитетом, среди прочего, может быть основная религия, политический авторитет или общественные нормы. Члены этих культов исповедуют различные верования и распространяют насилие в той или иной форме внутри группы или в обществе в целом. Это приводит к столкновениям с местными властями и отчуждению от более широких слоев населения. Более опасно то, что идеи таких культов могут воздействовать на группы населения, которые могут действовать в соответствии с этими учениями, что делает эти типы культов очень опасными для полиции и государственных властей."
 ReligionTraditionalAfrican_desc: "Это относится к разнообразному набору верований, распространенных по всему континенту. Среди верований, обычно связанных с традиционными африканскими верованиями, есть вера в почитание мертвых, вера в духов, высшую силу и традиционные формы медицины, среди прочего. Исследователи полагают, что многие из этих верований возникли в Африке к югу от Сахары и на протяжении веков распространились по всему континенту. Из всех основных религий, исповедуемых на континенте, эти веры - единственные, которые возникли на самом континенте. Вера часто передается через устную традицию, а не через письменное Священное Писание."
 ReligionTraditionalAmerican_desc: "Они относятся к традиционным спиритуалистическим верованиям коренных народов Америки. Эти верования сильно различаются в зависимости от полушария, но многие верят в уважение к предкам и стремление к гармонии с природой. Хотя приход западного колониализма привел к религиозным преследованиям и болезням, опустошающим коренные народы, эти верования сохраняются и по сей день. Последователи узнают о вере не через Священные Писания, а через устную передачу знаний от одного поколения к другому."
 ReligionTraditionalOceanic_desc: "Религии и традиции Океании основаны на глубокой космологии и уходят корнями в ритуалы. Многие связывают дружелюбие, с которым первые исследователи были приняты народами региона, с этими религиозными ритуалами, которые часто призывали последователей ожидать новых прибытий. Несомненно, это следствие традиций мореплавания и островных культур региона. Хотя исследователи принесли новые религии, которые стали популярными среди людей, в последнее время местные жители возрождают традиционные практики или возвращаются к ним. Особенно ритуалы."
 ReligionMessianic_desc: "Фурри-центрические религии - это группа духовных верований, которые часто совпадают с религиями Нью Эйдж, но связаны с субкультурой Фурри. Существует множество духовных доктрин Фурри, таких как другие конфессии, связанные с Фурри, или квазирелигиозные фурри-стилисты, которые приняли эмоциональную / духовную связь с реальными, вымышленными или символическими животными. Подавляющее большинство этой группы являются космополитами, социальными и защитниками окружающей среды и придают большое значение искусству и эстетике."
 ReligionOther_desc: "Это традиции и религии, часто многовековой давности, возникшие среди небольших общин или в определенных географических пространствах. Часто изолированность таких сообществ, обусловленная либо их небольшим размером, либо географическими ограничениями, позволяет этим практикам продолжаться без помех со стороны более распространенных конфессий. По мере развития технологий и государств такие сообщества, вероятно, будут все больше подвергаться воздействию новых идей религии."
 ReligionChineseSalvationist: "Китайские спасенцы"
 ReligionChineseSalvationist_desc: "Под вероисповеданием китайских спасенцев понимается бесчисленное множество религиозных сект, сосредоточенных на идеях нравственной чистоты и спасения через следование учениям харизматичного человека. Многие считают эти секты четвертой важной исторической религиозной традицией Китая. Секты спасателей существуют по всему Китаю, но особенно на севере и северо-востоке. Хотя эти секты часто сталкиваются с подавлением со стороны государства, эти движения продолжают процветать, и почти каждое десятилетие появляются новые секты. Китайское государство исторически опасалось, что особенно амбициозный лидер секты спасенцев может стать источником восстания и беспорядков."
 ReligionZionistChristian: "Сионистские христиане"
 ReligionZionistChristian_desc: "Сионистские христианские церкви распространились на юге Африки в начале двадцатого века. Эта вера особенно популярна среди африканского населения, которое сочетает христианские верования и обычаи с традиционными африканскими религиями. Исцеление верой и духовные откровения - ключевая часть практикующих. Церкви примечательны своими церемониями и символическими ритуалами, часто с использованием специальной одежды и речного крещения. В некоторых церквях распространены большие службы под открытым небом с участием африканской музыки и танцев. Аналитики предсказывают, что по мере того, как вера все больше укореняется в африканских общинах, она может в конечном итоге стать основной христианской конфессией, исповедуемой на юге Африки."
 ReligionMessianicChristian: "Эта религия, основанная в Бельгийском Конго, основана на учении Симона Кимбангу, основавшего свою церковь в 1921 году. Это одна из немногих независимых церквей, основанных африканцами. Кимбангу, баптистский учитель, основал свою церковь и массовое движение после того, как прославился своей способностью чудесным образом исцелять людей и своим толкованием Библии. Хотя он был задержан бельгийскими властями, его церковь сохранилась и является одной из крупнейших церквей в Конго. Церковь имеет обширную иерархию и проповедует пуританский набор верований, включая отказ от насилия, танцев, табака, алкоголя и полигамии. Несмотря на попытки властей подавить церковь, популярность продолжает расти и предлагает строгую структуру, которой восхищаются многие жители Центральной Африки."
