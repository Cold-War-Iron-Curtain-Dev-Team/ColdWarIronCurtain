 policy_services_temp_0_desc: "Минимальное финансирование общегосударственных услуг, которых недостаточно для расширения технического обслуживания."
 policy_services_temp_1_desc: "Адекватное финансирование гос. услуг для населения. Только достаточной для небольших, необходимых расширений, но часто не удовлетворяющий требованиям по техническому обслуживанию и замене поврежденной инфраструктуры."
 policy_services_temp_2_desc: "Большой объем финансирования государственных услуг, который позволяет осуществлять плановую замену и расширение оборудования, а также покрывает все потребности в техническом обслуживании."
 policy_services_temp_3_desc: "Максимальный уровень финансирования государственных услуг, обеспечивающий полный охват общих государственных услуг и быстрое расширение государственной инфраструктуры."
