 edict_education_project_community: "Общинное начальное школьное образование"
 edict_education_project_community_desc: "Общее начальное школьное образование децентрализует системы начального образования, чтобы лучше соответствовать потребностям общества и предоставлять больше местных, уникальных программ для образования."
 edict_adult_education_project: "Специальное среднее образование"
 edict_adult_education_project_desc: "Специальное среднее образование фокусируется на улучшении общей остроты ума и творческого мышления при одновременном снижении стресса, а не на более широком общем образовании для снижения стресса и улучшения общего интеллекта при подготовке к специализированному образованию в техникуме."
 edict_education_project_artsubs: "Общий вспомогательный образовательный фонд"
 edict_education_project_artsubs_desc: "Специальный фонд для галерей, искусств, библиотек, музеев, исторических обществ и другой вспомогательной образовательной инфраструктуры."
 edict_education_project_agricolleges: "Сельскохозяйственные техникумы"
 edict_education_project_agricolleges_desc: "Специализированные сельскохозяйственные техникумы для подготовки сельскохозяйственных рабочих для агропромышленного комплекса."
 edict_education_program_rotc: "Программа милитаризации молодёжи"
 edict_education_program_rotc_desc: "Молодежные программы военного стиля, такие как КПОЗ, скауты или другие программы, направленные на улучшение дисциплины и здоровья молодежи, а также повышение уровня жизни населения, требующего компенсации."
 edict_education_program_faithschools: "Религиозные школы"
 edict_education_program_faithschools_desc: "Религиозные школы - это школы, основанные на принципах конкретной религии большинства в стране, которые учат ее ценностям. Религиозные школы могут значительно укрепить религию большинства в стране и продвигать ее общие добродетели в обществе."
