 policy_healthcare_temp_2_preserved_desc: "Ранее существовавшая сеть здравоохранения более высокого уровня все еще существует в стране до 2 лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Формальная система здравоохранения бесплатно§!"
