 policy_services_temp_2_preserved: "Ухудшение гос. услуг (Высокое финансирование)"
 policy_services_temp_3_preserved: "Ухудшение гос. услуг (Макс. финансирование)"
 policy_services_temp_1_preserved_desc: "Ранее существовавшая инфраструктура государственных услуг более высокого уровня все еще существует в стране вплоть до 2-х лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Базовое финансирование бесплатно§!"
