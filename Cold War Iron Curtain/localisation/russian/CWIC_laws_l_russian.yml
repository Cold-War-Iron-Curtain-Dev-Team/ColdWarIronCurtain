 policy_military_temp_1_desc: "Армия, состоящая в основном из резервистов с целью минимизации расходов"
 policy_military_temp_2_desc: "Армия, которая тратит только, чтобы защитить себя и сильно полагается на союзников"
 policy_military_temp_3_desc: "Большая армия, способная к контратакам или наступательным операциям"
 policy_military_temp_4_desc: "Хорошо укомплектованная армия, которая достаточно велика и хороша, чтобы возглавлять атаки и защищать другие страны"
 policy_military_temp_2_preserved: "Ухудшение Армейской Сети (Базовая структура)"
 policy_military_temp_3_preserved: "Ухудшение Армейской Сети (Систематизированная структура)"
 policy_military_temp_4_preserved: "Ухудшение Армейской Сети (Полностью сформированная армия)"
 policy_military_temp_2_preserved_desc: "Ранее существовавшие военные объекты/военные сети более высокого уровня все еще существуют в стране до 2 лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Базовая структура бесплатно§!"
 policy_military_temp_3_preserved_desc: "Ранее существовавшие военные объекты/военные сети более высокого уровня все еще существуют в стране до 2 лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Систематизированная структура бесплатно§§!"
 policy_military_temp_4_preserved_desc: "Ранее существовавшие военные объекты/военные сети более высокого уровня все еще существуют в стране до 2 лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Полностью сформированная армия бесплатно§§!"
 policy_welfare_temp_0: "Нет расходов"
 policy_welfare_temp_1: "Малые расходы"
 policy_welfare_temp_2: "Средние расходы"
 policy_welfare_temp_3: "Обширные расходы"
 policy_welfare_temp_4: "Высокие расходы"
 policy_welfare_temp_5: "Огромные расходы"
 policy_welfare_temp_0_desc: "Никаких государственных расходов на социальное обеспечение за исключением пенсионных выплат государственным служащим"
 policy_welfare_temp_1_desc: "Минимальные расходы, предусмотренные для общего выживания"
 policy_welfare_temp_2_desc: "Нормальные расходы, созданные для удовлетворения основных потребностей безработных, немощных и пожилых людей"
 policy_welfare_temp_3_desc: "Обширные расходы, обеспечивают всеобщее благосостояние. Включает в себя 3-месячное страхование по безработице, общие программы помощи, выплаты по социальному обеспечению и государственные пенсии"
 policy_welfare_temp_4_desc: "Высокие расходы, направленные непосредственно на борьбу с бедностью и предоставление существенных льгот широкому кругу лиц, включает в себя все вышеперечисленные и более крупные программы общей помощи, меры по борьбе с бедностью, универсальные положения по уходу за детьми и многое другое"
 policy_welfare_temp_5_desc: "Единовременная выплата всем гражданам страны, предназначенная для оптимизации и замены большинства систем социального обеспечения, но все еще включает в себя пособия по уходу за детьми, пенсии, страхование по безработице и общую помощь, хотя они и меньше, поскольку большинство расходов защищены платежами UBI"
 edict_welfare_project_mortgage: "Ипотечные субсидии"
 edict_welfare_project_mortgage_desc: "Программа государственных субсидий, направленная на снижение процентных ставок по ипотечным кредитам, увеличение числа домовладельцев и косвенную выгоду для жилищного сектора"
 edict_welfare_project_homelessness: "Облегчение жизни бездомным"
 edict_welfare_project_homelessness_desc: "Масштабная далеко идущая программа, направленная на борьбу со сложной проблемой бездомности. Предоставляет средства для бездомных, информационно-пропагандистские программы по борьбе с первопричинами, психологические услуги по борьбе с хронической бездомностью и психическими проблемами, а также широкий спектр жилищных проектов"
 edict_welfare_program_compulsorywork: "Обязательные работы для безработных"
 edict_welfare_program_compulsorywork_desc: "Рабочие программы, предоставляемые правительством для обеспечения искусственно заниженного уровня безработицы. Обеспечивает общие льготы для государственных служб, обеспечивает всеобщую профессиональную подготовку и опыт работы на рабочем месте, а также обеспечивает доход в обмен на общественную работу"
 policy_cpi_temp_0: "Местная"
 policy_cpi_temp_1: "Городская"
 policy_cpi_temp_2: "Федеральная"
 policy_cpi_temp_3: "Милитаризированная"
 policy_cpi_temp_4: "Массовая слежка"
 policy_cpi_temp_5: "Полный контроль"
 policy_cpi_temp_0_desc: "Минимальное финансирование полиции, которое обеспечивает достаточное количество судов и небольших миротворческих сил, в значительной степени полагающихся на суверенное принуждение граждан.\n\nНикакого разведывательного финансирования за пределами вооруженных сил."
 policy_cpi_temp_1_desc: "Столичные полицейские системы, включая патрули, спецназ реагирования, тюрьмы и более крупное финансирование судебных органов.\n\nСоздание иностранных наблюдателей."
 policy_cpi_temp_2_desc: "Создание правоохранительных органов, включая специальные следственные службы, силы по борьбе с терроризмом, специальные оперативные группы, отряды вице-президентов, независимые федеральные следственные службы и специализированные тюрьмы.\n\nСоздание шпионских агентств и сетей, занимающихся мониторингом и сбором разведывательной информации."
 policy_cpi_temp_3_desc: "Обширное финансирование, направленное на полную гражданскую защиту, всеобщую доступность правоохранительных служб, специальные программы, направленные на борьбу с регионами с высоким уровнем преступности, всеобщий охват, мониторинг камер, более крупное финансирование учреждений и дальнейшее специализированное содержание тюрем.\n\nКрупные суммы финансирования направлены на проникновение и манипулирование иностранными активами."
 policy_cpi_temp_4_desc: "Полный контроль за гражданским населением с полным охватом надзором, ведением учета и полным снятием ограничений на технологии, которые разрешено использовать гражданской защите.\n\nАгрессивная разведывательная программа, которая стремится обеспечить полное представление о глобальной ситуации и активное отслеживание всех иностранных активов, дружественных, нейтральных или враждебных."
 policy_cpi_temp_5_desc: "Экстремальные расходы и агрессивное финансирование программ гражданской защиты и контроля.\n\nЧрезмерное финансирование уже развернутых разведывательных сетей, чтобы не жалеть средств в погоне за интригами и иностранными манипуляциями."
 policy_cpi_temp_1_preserved: "Ухудшение сети гражданской защиты и разведки (Городская Полиция)"
 policy_cpi_temp_2_preserved: "Ухудшение сети гражданской защиты и разведки (Федеральные агенства)"
 policy_cpi_temp_3_preserved: "Ухудшение сети гражданской защиты и разведки (Милитаризированная Полиция)"
 policy_cpi_temp_4_preserved: "Ухудшение сети гражданской защиты и разведки (Массовая Слежка)"
 policy_cpi_temp_5_preserved: "Ухудшение сети гражданской защиты и разведки (Полицейское Государство)"
 policy_cpi_temp_1_preserved_desc: "Ранее существовавшие сети гражданской защиты и разведки более высокого уровня все еще существуют в стране вплоть до 2-х лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Городская Полиция бесплатно§!"
 policy_cpi_temp_2_preserved_desc: "Ранее существовавшие сети гражданской защиты и разведки более высокого уровня все еще существуют в стране вплоть до 2-х лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Федеральные агенства бесплатно§!"
 policy_cpi_temp_3_preserved_desc: "Ранее существовавшие сети гражданской защиты и разведки более высокого уровня все еще существуют в стране вплоть до 2-х лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Милитаризированная Полиция бесплатно§!"
 policy_cpi_temp_4_preserved_desc: "Ранее существовавшие сети гражданской защиты и разведки более высокого уровня все еще существуют в стране вплоть до 2-х лет после сокращения бюджета. За это время вы можете §YВернуться на уровень Массовая Слежка бесплатно§!"
