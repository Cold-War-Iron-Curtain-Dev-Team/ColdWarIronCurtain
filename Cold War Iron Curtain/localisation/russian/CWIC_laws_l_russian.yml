 pub_expansion_cooldown_desc: "В стране расширяется инфраструктура государственных услуг. В течение этого времени вы будете иметь §YУменьшенные преимущества§! равное половине разницы между политикой, которую вы обновили, и вашей предыдущей политикой.\nВы можете отменить расширение и вернуться к более низкому уровню финансирования до завершения 2-летнего процесса обновления без дополнительной платы. §YОбновление прогресса будет потерян и вы не будете возвращены§!"
 health_expansion_cooldown_desc: "В стране расширяются сети здравоохранения. В течение этого времени вы будете иметь §YУменьшенные преимущества§! равное половине разницы между политикой, которую вы обновили, и вашей предыдущей политикой.\nВы можете отменить расширение и вернуться к более низкому уровню финансирования до завершения 2-летнего процесса обновления без дополнительной платы. §YОбновление прогресс будет потерян и вы не будете возвращены§!"
 edu_expansion_cooldown_desc: "В стране расширяется образовательная и научно-исследовательская база. В течение этого времени вы будете иметь §YУменьшенные преимущества§! равное половине разницы между политикой, которую вы обновили, и вашей предыдущей политикой.\nВы можете отменить расширение и вернуться к более низкому уровню финансирования до завершения 2-летнего процесса обновления без дополнительной платы. §YОбновление прогресс будет потерян и вы не будете возвращены§!"
 mil_expansion_cooldown_desc: "В стране и на лицензированных территориях за рубежом расширяются военные объекты и сети связи/снабжения. В течение этого времени вы будете иметь §YУменьшенные преимущества§! равное половине разницы между политикой, которую вы обновили, и вашей предыдущей политикой.\nВы можете отменить расширение и вернуться к более низкому уровню финансирования до завершения 2-летнего процесса обновления без дополнительной платы. §YОбновление прогресс будет потерян и вы не будете возвращены§!"
 cpi_expansion_cooldown_desc: "В стране расширяются районы гражданской защиты/объекты и разведывательные сети/объекты. В течение этого времени вы будете иметь §YУменьшенные преимущества§! равное половине разницы между политикой, которую вы обновили, и вашей предыдущей политикой.\nВы можете отменить расширение и вернуться к более низкому уровню финансирования до завершения 2-летнего процесса обновления без дополнительной платы. §YОбновление прогресс будет потерян и вы не будете возвращены§!"
