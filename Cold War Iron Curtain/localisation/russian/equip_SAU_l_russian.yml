 SAU_light_tank_equipment_1:0 "Vickers Carden Loyd модель 1933 года"
 SAU_light_tank_equipment_1_short:0 "M1933"
 SAU_light_tank_equipment_1_desc:0 "Танкетки Carden Loyd были серией британских танкеток до Второй мировой войны, они стали классическим дизайном танкеток во всем мире, был поставлен по лицензии несколькими странами и стал основой нескольких проектов, произведенных в нескольких разных странах."
 SAU_light_tank_equipment_2:0 "Vickers Carden Loyd модель 1936 года"
 SAU_light_tank_equipment_2_short:0 "M18935"
 SAU_light_tank_equipment_2_desc:0 "Улучшен по сравнению с более поздней моделью Vickers Carden Loyd Model 1936 года; к существующему 0,303 был добавлен 0,5 дюймовый пулемет Виккерса. Это дало танку разумную противотанковую способность против других легких танков. Кроме того, была введена операционная система экипажа из трех человек. Увеличение численности экипажа существенно повлияло на эффективность работы танка и распределило нагрузку по техническому обслуживанию."
