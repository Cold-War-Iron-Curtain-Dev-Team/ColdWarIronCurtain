l_english:
 PRC_peoples_army: "Народная армия"
 china_capitualted: "Китай капитулировал"
 PRC_Communist_Army_arrives: "Мы могли бы наскрести несколько дивизий вместе в Пекине, чтобы бороться за нашу веру."
 prc.1.t: "Небольшое наращивание армии"
 prc.1.d: "Мы могли бы наскрести несколько дивизий вместе в Пекине, чтобы бороться за нашу веру."
 prc.1.a: "May they crush those nationalists!"
 prc.2.t: "PRC борется за Южную Корею"
 prc.2.d: "Теперь, когда мы выиграли войну против Северной Кореи, отдадим ли мы ее Южной Корее или оставим себе?"
 prc.2.a: "Давайте отдадим его обратно."
 prc.2.b: "Мы сохраним его!"
 prc.3.t: "КНР борется за Северную Корею"
 prc.3.d: "Теперь, когда мы выиграли войну против Южной Кореи, отдадим ли мы ее Северной Корее или оставим себе?"
 prc.3.a: "Давайте отдадим его обратно."
 prc.3.b: "Мы сохраним его!"
 PRC_revolution_reinforcement: "Мы могли бы мобилизовать некоторые дивизии внутри Китайской Республики, чтобы противостоять нашему врагу."
 prc.5.t: "Revolutionary aid from inside the Republic"
 prc.5.d: "Мы могли бы мобилизовать некоторые дивизии внутри Китайской Республики, чтобы противостоять нашему врагу."
 prc.5.a: "Именно то, что нам нужно!"
 prc_ussr_intervention: "Спросите у Советского союза! за помощью\n"
 prc_usa_intervention: "Спросите §YUSA§! за помощью\n"
 prc.6.t: "[GetNewspaperHeader]Они принимают нашу просьбу"
 prc.6.d: "Теперь мы получим 10000 единиц пехотной техники, чтобы помочь нам."
 prc.6.a: "Отлично!"
 prc.7.t: "[GetNewspaperHeader]Они отклонили нашу просьбу"
 prc.7.d: "Мы не получим 10000 единиц пехотной техники, которую мы запросили."
 prc.7.a: "Печальный день для нас."
 prc.8.t: "[GetNewspaperHeader]Они отклонили нашу просьбу"
 prc.8.d: "Мы не вступим в Варшавский договор, так как Советский Союз отклонил нашу просьбу."
 prc.8.a: "Печальный день для нас."
 prc.11.t: "КНР просит поддержки"
 prc.11.d: "Китайская Народная Республика просит нашей поддержки. Это напоминает Антикоминтерновский пакт, который нацисты заключили против России перед Второй мировой войной."
 prc.11.a: "Мы поддерживаем КНР"
 prc.11.b: "Мы поддерживаем СССР"
 prc.12.t: "Аннексия ETR"
 prc.12.d: "Народ из Восточно-Туркестанской Республики первоначально входил в состав Китая. Они начали свою собственную революцию против Китая, как и мы. Но они были частью нашей страны, поэтому они должны быть частью нашей страны снова."
 prc.12.a: "Аннексия войны"
 prc.13.t: "Аннексия со стороны КНР"
 prc.13.d: "Наш народ изначально был частью Китая. Мы начали нашу собственную революцию против Китая, как и они. Они хотят, чтобы мы снова стали частью Китая. Это означало бы их аннексию всей нашей территории. Что же нам делать?"
 prc.13.a: "Получить Аннексированный"
 prc.13.b: "Это означает еще одну войну!"
 prc.20.t: "Новый лидер для нас"
 prc.20.d: "Теперь, когда Народная Республика укрепила свою власть над материком, у нас есть уникальная возможность созвать партийный съезд и выдвинуть нового лидера для нашего нового Китая. Кандидатами являются: Мао Цзэдун, председатель партии; Лю Шаоци, политический комиссар и верховный главнокомандующий коммунистическими силами в Маньчжурии и на Севере; Чжоу Эньлай, министр иностранных дел и главный дипломат; Чэнь Юн, экономист и глава Центральной финансово - экономической комиссии. Конечно, мы могли бы просто оставить председателя Мао."
 prc.20.a: "Комиссар Лю возьмет мантию."
 prc.20.b: "Открой дверь на запад, выбери Чэня"
 prc.20.c: "Выбери реформиста Чжоу"
 prc.20.do: "Никакого конгресса! Вечный Вождь Мао!"
 CulRevPurge.1.d: "Председатель Мао и его сторонники использовали прямые разоблачения, целенаправленные статьи в партийных газетах и использование политических союзников для организации серии чисток против высокопоставленных членов Коммунистической партии Китая. Эти чистки устраняют умеренных, которые в последние годы приобрели известность, чтобы восстановить китайскую экономику и стабильность. Однако эти чистки необходимы для того, чтобы Мао и его сторонники взяли под свой контроль ключевые позиции и восстановили имидж Мао как истинного лидера революции в Китае. Те, кто подвергся чисткам, часто снимаются с политических постов и в более крайних случаях арестовываются за контрреволюционную деятельность."
 Enlais_Tour.1.d: "Видный китайский коммунистический лидер и бывший министр иностранных дел, премьер-министр Чжоу Эньлай отправился в мировое турне. Эньлай планирует посетить многие страны, особенно в Африке и на Ближнем Востоке, где он надеется продемонстрировать китайскую мощь и влияние. Эта поездка продемонстрирует, что Китай является глобальной силой и смотрит за пределы своих границ. Китайцы стремятся продемонстрировать свою поддержку революционной борьбе, ведущейся в настоящее время против реакционных и империалистических режимов. Еще одной важной задачей премьера является лоббирование поддержки среди вновь формирующихся независимых государств в целях укрепления поддержки Китая в Организации Объединенных Наций."
 PRCUN.1.d: "Деколонизация привела к появлению нового Третьего мира держав, в основном сосредоточенных в Африке и Азии. Эти государства обладают большим оптимизмом, молодостью и возможностями, которые Китай не может игнорировать. Что еще более важно, многие из этих государств добились независимости только благодаря революционным действиям против колониальных хозяев. Китайское правительство протягивает руки и лоббирует с этими правительствами, чтобы предложить свою поддержку КНР в Организации Объединенных Наций, где многие бывшие колониальные державы и Соединенные Штаты продолжают препятствовать передаче нам нашего законного места в мировом сообществе. Мы должны сплотить Третий мир и научить его лидеров поддерживать нас против империалистических махинаций в Организации Объединенных Наций."
 CulRev.11.d: "Под руководством молодежных лидеров и преданных партийных активистов миллионы книг вырываются из библиотек, культурных и религиозных центров, чтобы быть сожженными в общественных кострах. Книги, в которых обсуждаются контрреволюционные идеи, противоречащие указаниям Мао, исторические труды, религиозные тексты или произведения художественной литературы, прославляющие реакционное прошлое,-все эти произведения собираются для сожжения. Чтобы очистить Китай и очистить партию, необходимо прямое уничтожение прошлого и его нечистот. Мао учит, что для появления новой революционной литературы и искусства прошлое должно быть очищено и не должно мешать непрерывной революции. Всех, кто выступал против поджогов или пытался остановить сбор книг, задерживали и будут судить как реакционеров."
 CulRev.12.d: "Одним из главных камней преткновения на пути непрерывной революции и прекращения влияния реакционного прошлого является продолжающееся существование прославленных могил благородных и почитаемых вождей прошлого. Эти могилы становятся местами ложного поклонения и прославления, особенно людей, которые эксплуатировали и угнетали массы, чтобы достичь своей славы. По всей стране революционная молодежь выкапывает эти могилы и могилы, обличает останки и затем сжигает их. Разрушение пространства после этого, чтобы убедиться, что это ложное прославление прошлого удалено. Особенно примечателен налет на гробницы династии Мин, где были уничтожены останки императора Ваньли и его императриц. Археологические раскопки могил немедленно прекращаются, археологи, которые отказываются или жалуются на эти действия, задерживаются."
 CulRevPurge.4.d: "Религия долгое время удерживала народ Китая от подлинного принятия революции и подчинения ее принципам. Религия порождает суеверия и отнимает энергию и ресурсы у людей, которых она обманывает. Хотя буддийские и мусульманские религиозные объекты также являются основными целями, в центре внимания Красной гвардии и революционной молодежи были места конфуцианского знания и исторического значения. По всему Китаю осаждаются храмы Конфуция, в том числе храм Конфуция в Шаньдуне. Реликвии разбиваются, а письменные произведения и коллекции, многие бесценные, рвутся или сжигаются революционерами. Конфуцианские кладбища и другие места точно так же разграбляются, чтобы очистить Китай от его привязанности к реакционным старым путям, которые мешают охвату непрерывной революции."
 PLA_CulRev.1.d: "С революционным пылом, охватившим нацию, и деятельностью Красной гвардии, идущей без присмотра, в высших партийных руководителях рос страх, что ситуация обостряется. Председатель Мао, чувствуя это и растущий спор внутри партии по поводу радикальных революционеров и членов партии истеблишмента, желающих сохранить стабильность, попросил НОАК под руководством знаменитого военного лидера Линь Бяо развернуть и помочь левым. Хотя это подразумевало, что НОАК должна поддерживать радикалов, это не было явным, и вместо этого большинство подразделений НОАК начали поддерживать членов партии истеблишмента. Эти подразделения активно пресекают бесчинства Красной гвардии и обеспечивают, чтобы радикальная фракция в отдельных районах не получила доступа к тяжелому вооружению и не свергла местное партийное руководство."
 HyperCulRev.1.d: "По мере того как в Китае бушует Культурная революция, конфликт между радикальными фракциями внутри партии против более умеренного, устоявшегося партийного руководства сместился в пользу радикалов. Бывший президент Китая и в свое время второй по силе человек в Китае, Лю Шаоци был казнен. Хотя он председательствовал на совещании, которое положило начало Культурной революции, надеясь бороться с коррупцией и реформировать страну, Мао и его сторонники быстро взяли ее под контроль и организовали падение Шаоци и его арест. Его держали в суровых условиях, но многие в Китае ожидали, что его просто посадят. Его казнь за то, что он был тайным капиталистом и предателем, указывает на то, что радикалы укрепились, и является ударом по тем, кто в партии надеется, что будущая реабилитация Шаоци поможет продвинуть страну к прекращению насилия."
 HyperCulRev.2.d: "Дэн Сяопин, который помогал контролировать кампанию экономических реформ по смягчению экономического ущерба маоистов, был казнен правительством. Эта ошеломляющая новость указывает на то, что в руководстве Коммунистической партии Китая радикальные маоисты завоевывают известность среди членов партии истеблишмента. До этого заявления Дэн не был официально арестован, хотя вскоре после начала Культурной революции он стал мишенью Красной гвардии. Красногвардейцы считали его экономические реформы капиталистическими и выступали против Мао. В отличие от своего политического союзника Лю Шаоци, Дэн был только очищен от своих национальных позиций. Однако его очень быстро судили, осудили, а затем казнили. Хотя некоторые слухи предполагают, что Дэн просто был казнен эмоциональными красногвардейцами. Дэн все еще был тесно связан с некоторыми из оставшихся членов партии истеблишмента, которые теперь смотрят на свое будущее с серьезной озабоченностью после этого последнего заявления."
 HyperCulRev.5.d: "С казнью лидера докультурной революции Лю Шаоци вместе с молодым экономическим реформатором Дэн Сяопином позиции членов истеблишмента коммунистической партии оказались пронумерованными. После расстрелов мало кто высказывался или бросал вызов радикальному крылу партии от расширения революции. В последних новостях Коммунистическая партия Китая объявила, что очищает себя от консерватизма, и заявила, что среди последних, кто будет отстранен от национального правительства, - знаменитый государственный деятель Чжоу Эньлай. Энлай был основной частью партии с 1930-х годов и лицом правительства за рубежом. Он также был близок с казненным Дэном, и считается, что если бы он попытался сопротивляться, то рисковал бы столкнуться с той же участью Дэна и быть осужденным как партнер предателя. В настоящее время существует полная неопределенность в отношении того, кто или кто-либо в правительстве пытается смягчить или контролировать уровень насилия, который, как представляется, растет с каждым днем."
 HyperCulRev.6.d: "Последний император Китая Пуйи был убит красногвардейцами, которые вывели его на улицу, публично унизили за его имперское прошлое, а затем убили пожилого бывшего правителя Маньчжоу-Го. После окончания Второй мировой войны Советы удерживали Пуйи, прежде чем передать его под опеку Китая. Коммунистическая партия Китая отправила его в реабилитационный центр, где он в конце концов был реабилитирован и переехал в Пекин. Хотя он был убежденным сторонником коммунизма и представителем режима, красногвардейцы не считали его реформатором, тем более что его автобиография была опубликована на иностранных языках, считавшихся подозрительными, английском и французском. Старшие партийные лидеры, такие как Чжоу Эньлай, использовали свое влияние, чтобы защитить Пуйи, но с последней чисткой партийных лидеров истеблишмента его защита закончилась, и он быстро попал в Красную гвардию."
 PRC_Congress.1.d: "Недавно успешно завершился Девятый съезд Коммунистической партии Китая. Линь Бяо выступил с основным докладом перед ликующими делегатами, которые поддержали его похвалу непрерывной революции. Недавние чистки бывшего президента Лю Шаоци и его союзника Дэн Сяопина были подтверждены и одобрены, и делегаты были избраны. Радикальное крыло партии добилось значительных успехов с точки зрения представителей, особенно от Красной гвардии, и имело свои основные руководящие принципы, такие как непрерывная революция, закрепленные в конституции. Однако Линь Бяо оказался главным победителем, так как он был признан преемником Мао, а его сторонники в НОАК также получили много мест. Многие рассматривают эти два события как свидетельство того, что, хотя радикалы остаются сильными, их все еще можно контролировать и управлять ими, особенно НОАК."
 PRC_Congress.2.d: "Недавно завершился Девятый съезд Коммунистической партии Китая, и его результаты приветствуют ликующие толпы по всему Китаю. Конгресс утвердил непрерывную революцию и другие принципы Культурной революции как часть конституции. В обращении Мао Цзэдуна он пообещал, что Культурная революция будет продолжаться, и призвал всех трудящихся расширить ее масштабы и избавить Китай от реакционных и контрреволюционных сил. Конгресс высоко оценил быстрое правосудие в недавних казнях бывшего президента Лю Шаоци и его союзника Дэн Сяопина и подтвердил чистку Чжоу Эньлая как правильный курс. На съезде будут преобладать представители радикальных революционеров и Красной гвардии. Недавнее отстранение НОАК и чистка правящего крыла партии означали, что власть теперь почти полностью находится в руках партийных радикалов."
 PRC_Congress.3.d: "Недавно завершился Девятый съезд Коммунистической партии Китая. Конгресс ратифицировал и открыто одобрил реформы, начатые президентом Шаоци. Шаоци хвалили за его мудрое руководство и ум для улучшения жизни людей. Примечательно, что на выборах многие реформаторы и сторонники Шаоци получили места. Члены старой гвардии и более преданные маоисты не получили много мест после недавней чистки. Кроме того, военные места оставались ограниченными, что также отражало успех Шаоци в контроле над институтом. К концу партии стало ясно, что Шаоци по-прежнему твердо контролирует ситуацию, и его реформы были ратифицированы конституцией."
 BeijingSpring.1.d: "Неудачи Большого скачка вперед наряду с усилиями по прекращению политической изоляции привели к снижению влияния председателя Коммунистической партии Китая Мао Цзэдуна. Даже в высших эшелонах партии его революционная риторика утратила свое прежнее влияние. Воспользовавшись этим, президент Лю Шаоци выступил с реформистским видением страны. Он уже объявил о планах свернуть более радикальную маоистскую экономическую политику, чтобы помочь экономике восстановиться. Более того, он открыл правительство для публичной критики в ходе так называемой Пекинской весны. Китайским гражданам разрешено критиковать то, что им не нравится в правительстве, что отражает либерализацию общества. К чему приведет эта новая открытость, еще предстоит выяснить."
 ZhenbaoConflict.1.d: "Напряженность между Китайской Народной Республикой и Советским Союзом возросла еще больше, поскольку председатель Мао Цзэдун потребовал возвращения острова Чжэнбао, также известного как остров Даманский в Советском Союзе, и пересмотра Айгунского договора. Чжэнбао-это небольшой остров в реке Уссури, обозначающий нынешнюю границу Маньчжурии и Российской Внешней Маньчжурии. Россия приобрела Внешнюю Маньчжурию в годы упадка Цин, Западные державы и Российская империя навязали несколько \"Несправедливых договоров\".; Айгунский договор и Первая Пекинская конвенция предоставили ряд китайских уступок Западным державам и Российской империи, включая уступку России Внешней Маньчжурии, включая все острова на реке Уссури, включая остров Чжэнбао. Председатель Мао назвал эти договоры ничем иным, как вопиющим оппортунистическим империализмом, и заявил, что Советский Союз как враг империализма должен исправить оба договора. В последних новостях сообщалось, что и Народно-освободительная армия, и Советская армия мобилизовались на границе Чжэнбао, пока переговоры еще продолжаются. Многие опасаются, что переговоры пойдут на юг и потенциально вызовут полномасштабный конфликт между двумя державами."
 ZhenbaoConflict.10.d: "Шокирующим образом сегодня утром небольшая группа китайских солдат устроила засаду советским войскам, расположенным на Чжэнбао, и захватила остров. СМИ до сих пор называли этот инцидент \"Инцидентом Чжэнбао\". Очевидно, это нападение было ответом на отказ Генерального секретаря Хрущева подписать соглашение о передаче Чжэнбао Китайской Народной Республике. До сих пор Советы не ответили, и ни одна из сторон пока не прокомментировала или не ответила на инцидент. Многие опасаются, что это приведет к полномасштабной обычной войне между двумя сверхдержавами. Пугающе, что обе страны имеют доступ к ядерному оружию, которое может быть использовано друг против друга. Некоторые предполагают, что это будет просто пограничный конфликт, но не более того, другие предполагают, что он может стать катализатором ядерной войны между двумя сверхдержавами и закончиться опустошением и разрушением обеих наций."
 ZhenbaoConflict.30.d: "Генеральный секретарь Советского Союза объявил сегодня, что между его страной и Китайской Народной Республикой существует состояние войны. Незначительные стычки на границах Хэйлунцзяна и Синьцзяна побудили Советский Союз развернуть всю свою военную мощь против Китая. Сообщения показывают, что советские и китайские войска уже вступили в соприкосновение друг с другом вдоль границы, и дополнительные войска, снабжение и авиация устремляются к фронту. Хотя кто начал инцидент на острове Чжэнбао, остается несколько неясным, ясно лишь то, что обе стороны, похоже, полны решимости довести этот конфликт до самого горького конца. Некоторые наблюдатели опасаются, что на горизонте может появиться ядерный обмен, но даже если конфликт останется обычным, ясно, что ставки не меньше, чем моральное лидерство всего коммунистического мира."
 ZhenbaoConflict.25.d: "После нескольких дней ожесточенных боев за остров Чжэнбао советские и китайские войска договорились о прекращении огня. Советский Союз, по-видимому, ответил на китайский захват острова ограниченной контратакой механизированных сил, поддерживаемой значительным объемом артиллерийского огня. Столкновения на острове и вокруг него были в значительной степени нерешительными, и угроза эскалации сохранялась до тех пор, пока переговоры не были облегчены взаимными союзниками КНР и Советского Союза во всем коммунистическом мире. Условия перемирия не предусматривают территориальных изменений, Советы сохранят контроль над Чжэнбао. Обе стороны претендуют на победу в стычке, советские-из-за условий перемирия, а китайские-из-за ущерба, нанесенного советским войскам, и еще предстоит выяснить, как это повлияет на единство мирового коммунистического сообщества."
 ZhenbaoConflict.31.d: "После короткого, но интенсивного столкновения советских и китайских войск из-за спорного острова Чжэнбао Генеральный секретарь Советского Союза и премьер-министр Китая пришли к соглашению. Мирные переговоры завершились после того, как стало ясно, что советские войска не смогли или не захотели выбить китайские войска, оккупировавшие остров Чжэнбао. Политбюро выступило с заявлением, в котором признало, что различные договоры 19 века, определяющие китайско-российскую границу, являются недействительными, поскольку они были заключены между буржуазными правительствами, которые больше не представляют волю народа. Формулировка соглашения, по-видимому, является пустой попыткой сохранить лицо со стороны Советов после того, что, должно быть, было позорным поражением в Чжэнбао. Ожидается, что пересмотр границ пойдет на пользу Китаю, и способность Советского Союза возглавить коммунистический мир была серьезно поставлена под сомнение."
 Cultural_Rev.2.d: "Более формально известная как Цитаты из председателя Мао Цзэдуна, \"Маленькая красная книга\" быстро стала центром революционной риторики в [PRC.GetNameDef]. Безобидная красная книга содержит 267 собранных цитат из Мао Цзэдуна и пропагандирует идеи единства между партией и народными массами, исправления ошибочных идей и постоянной борьбы с имперскими и классовыми угнетателями. Наиболее примечательно, что Мао упоминает, что даже при социализме классовые враги все еще существуют, и они должны быть бесконечно очищены, чтобы обеспечить достижение социалистической мечты. Эта риторика постоянной \"культурной революции\" была принята близко к сердцу молодежью, читающей ее по всему Китаю. Вдохновленные рассказами своих родителей, бабушек и дедушек о Народной освободительной войне против Гоминьдана, студенты и солдаты берут факел революции от своих предшественников, чтобы осуществить эту мечту о еще более славной революции. Сейчас они выходят на улицы по всему Китаю в поддержку председателя Мао и его зажигательной красной книжечки."
 CulRevPurge.2.d: "Дэн Сяопин служил политическим комиссаром во время Гражданской войны и стал многообещающей восходящей звездой в Коммунистической партии Китая. Когда радикальная экономическая политика Мао оказалась пагубной, он тесно сотрудничал с президентом Лю Шаоци, чтобы провести экономические реформы, которые смягчили радикальные элементы предыдущей экономической политики. Однако с Культурной революцией и возрождением Мао Дэн оказался в опасной ситуации, поскольку Красная гвардия определила его как критика Мао. После ареста Шаоци Дэн столкнулся с более агрессивной враждебностью и нападениями Красной гвардии. Красная гвардия также напала на его детей и семью. Наконец, Дэн был осужден и отстранен от своих постов в национальном правительстве, хотя и не был арестован. Вместо этого Дэн будет работать как фабричный рабочий вдали от центральной политики."
 CulRevPurge.3.d: "Бывший президент Китая Лю Шаоци был арестован сегодня за то, что он был тайным капиталистом, работавшим, чтобы предать революцию и направить Китай к буржуазному обществу. Шаоци получил известность благодаря кампании экономических реформ, в ходе которой Китай смягчил более радикальные экономические теории Мао. Он также согласился с Мао в необходимости Культурной революции, чтобы искоренить коррупцию и покончить с чрезмерно централизованной бюрократической структурой. Однако вскоре после того, как он начал Культурную революцию, движение вышло из-под его контроля, и власть вернулась к Мао. Из-за его предыдущей критики Мао и его высокого положения в партии, Шаоци был ранней мишенью радикалов в партии, которые стали достаточно сильными, чтобы посадить его в тюрьму."
 HyperCulRev.3.d: "Отдаленные районы Синьцзяна и Тибета не только физически далеки от китайской родины, но и идеологически и культурно далеки. Народ там лишен революционного духа и цепляется за свою традиционную религиозную и культурную самобытность. Чтобы противостоять этому, Мао приказал Красной гвардии войти в эти провинции и начать их непрерывную революцию. Религиозные сайты и тексты станут мишенью. Ношение культурной одежды и отсталых обычаев также будет очищено от этих провинций. Любой, кто будет сопротивляться, будет арестован за реакционные мысли. Скоро с помощью Красной гвардии эти места снимут оковы своего прошлого и станут живым органом революции."
 HyperCulRev.4.d: "Советский Союз отказался от своей приверженности правильному революционному марксизму-ленинизму. Это привело к китайско-советскому расколу, и Культурная революция призвана обеспечить, чтобы революционное государство никогда не прекращалось. Благодаря нашим недавним успехам и расширению усилий по осуществлению непрерывной революции Коммунистическая партия Китая объявила о планах направить своих представителей в несколько восточноевропейских коммунистических государств для продвижения наших принципов и поддержки антиревизионистских фракций. Продолжающийся успех Культурной революции продолжает демонстрировать, что Китай находится в авангарде революционной политики и должен работать над тем, чтобы донести свое послание до трудящихся всего мира."
 BeijingSpring.5.d: "Мао Цзэдун и его сторонники, несмотря на их революционное рвение и большие достижения в создании партии в Китае, к сожалению, вызвали серьезные экономические трудности в последние годы. Хотя их намерения были самыми лучшими, они не смогли предвидеть последствий своих действий. Кроме того, они весьма недовольны недавним открытием публичного дискурса о государстве. Президент Шаоци запланировал реформы и действия, которые облегчат тяготы народа и лучше свяжут его с государством, эта маоистская старая гвардия стоит на пути. Чтобы решить этот вопрос, Шаоци объявил об увольнении маоистов по всей партии в ответ на их предыдущие неудачи и публичную критику. Эти чиновники будут лишены своих национальных назначений. Шаоци позаботился о том, чтобы сам Мао не стал мишенью или объектом прямой критики во время этой чистки."
 PRC_Japan.1.d: "В 1930-х годах китайско-японская война принесла невыразимые трудности народу Китая, опустошив города и унося миллионы жизней из-за насилия и голода. Раны от этого и предыдущих конфликтов не зажили. В последние недели по всему Китаю многие вышли на улицы, чтобы осудить Японию как американскую марионетку, стремящуюся свергнуть революцию и не раскаявшуюся в своих военных преступлениях против китайского народа. В соответствии с пожеланиями народа президент Шаоци объявил о депортации всех японских граждан из Китая, в том числе тех, кто остался после Второй мировой войны в составе Императорской японской армии. Даже если некоторые из них помогли нашему делу, это не компенсирует боль и страдания, которые пережил народ. Говорят, Токио в ярости от нашего решения. Китай также понизит рейтинг своей дипломатической миссии в Японии."
 BeijingSpring.2.d: "Коммунистическая партия Китая объявила, что немедленно отстранила Цзян Цин, жену Мао Цзэдуна, от занимаемых ею постов в национальной партии. Эта чистка подчеркивает, сколько власти президент Шаоци накопил за последнее время за счет Мао и его политических союзников. Цзян, бывшая актриса и художественный руководитель, возглавила кампанию по чистке нереволюционного искусства и средств массовой информации. Она выступает в качестве личного секретаря Мао и поддерживает прочные связи с его ближайшими политическими союзниками. В качестве причины своего отстранения от политики партия приводила новые свидетельства ее буржуазного прошлого, которые она скрывала от партии."
 BeijingSpring.4.d: "Линь Бяо-один из величайших военачальников НОАК, воевавший во всех конфликтах НОАК с 1925 по 1945 год. После окончания войны он был произведен в маршалы и в конце концов вступил в Политбюро, где заключил союз с Мао. Он остается очень популярным и уважаемым в НОАК. Для президента Шаоци это делает его опасной угрозой, поскольку НОАК может сорвать его реформы и вернуть маоистов к власти. Чтобы нейтрализовать эту угрозу, президент Шаоци заставил своих политических союзников в НОАК заявить, что Линь ищет власти для себя. С этим обвинением маршал был отстранен от своих политических постов до тех пор, пока не будет подтверждено решение по обвинениям. Смещение Линь Бяо позволит Шаоци выдвинуть своих сторонников в НОАК на более высокие посты и держать НОАК подальше от политической власти."
 BeijingSpring.6.d: "Дэн Сяопин недавно помог Центральному комитету опубликовать историю ранней Китайской коммунистической партии. Документ призван не только сохранить наследие Мао, но и одобрить реформы, инициированные президентом Шаоци. История утверждает, что достижения Мао огромны, особенно в первые десятилетия существования партии и в его военной тактике. Однако он отмечает, что были допущены и ошибки, хотя они и не умаляют его достижений. Документ также обвинял близких доверенных лиц Мао в том, что они направили его неправильно, и обвинял их в ошибках, которые он совершил, фактически освобождая Мао практически от любой прямой вины. Сам Дэн отметил, что Мао был на Семь Частей Хорош, На Три-Плох. Это иллюстрирует позицию партии, что Мао следует уважать и уважать, но что реформы и отход от его доктрины вполне приемлемы."
 Mao_Return.1.d: "Мао Цзэдун воспользовался недавним крахом общества, чтобы попытаться обратить вспять свою потерю власти! Несмотря на то, что он сохранил за собой председательство в КПК, одну из самых влиятельных ролей в [КНР.GetNameDef], Мао сохранил небольшое влияние после своего катастрофического Большого скачка вперед. Теперь оказывается, что риторика в его Маленькой Красной Книжке была инструментом, чтобы обратить это вспять, подстрекая армию молодых революционеров, которые будут цепляться за каждое его слово! Председатель уже обвинял ведущих членов КПК и правительства в контрреволюционерстве, стремящемся принести капиталистический упадок в Китай."
 Mao_Return.2.d: "Многие видные члены КПК открыто выступали против попытки Мао Цзэдуна вернуть себе власть внутри [PRC.GetNameDef]. Хотя Председатель стремится очистить партию от буржуазных элементов, они не видят иронии в своих возражениях."
 Mao_Return.3.d: "Подстрекаемые риторикой Маленькой Красной книги, солдаты и генералы Народно-освободительной армии выразили свою поддержку риторике председателя Мао и его возможному возвращению к власти!"
 Mao_Return.4.d: "После нескольких попыток использовать молодых и впечатлительных революционеров для восстановления власти председатель и бывший президент Мао Цзэдун был вынужден уйти в отставку руководством КПК. После катастрофического голода, последовавшего за его попыткой дать толчок китайской промышленности и сельскому хозяйству с Большим скачком вперед, Мао ушел с поста председателя Китайской Народной Республики и просто сохранил свой пост председателя Коммунистической партии Китая. Однако его роль в недавнем хаосе, вызванном молодыми выскочками, стала нападением на партию, а также на лидеров [PRC.GetNameDef], особенно на председателя [PRC.GetLeader]. Бывший председатель сейчас находится под постоянным домашним арестом в государственной резиденции в Пекине. Хотя его, несомненно, будут помнить как героическую фигуру в истории пролетариата, он проведет остаток своей жизни на обочине революции."
 ZhenbaoConflict.3.d: "Группа китайских солдат устроила засаду пограничникам КГБ, дислоцированным в Чжэнбао, и захватила остров. В политбюро царит хаос по поводу того, что следует предпринять в ответ. Многие выступали против любых крайних мер возмездия, таких как ядерный удар или что-либо еще, что могло бы привести к всеобщей войне. Большинство выступало за суровое возмездие, чтобы отобрать остров у китайцев. Некоторые члены предложили договор о передаче острова КНР, чтобы избежать кризиса. В то время как другие указывают, что позволить китайцам подорвать советскую власть может подорвать советскую власть над другими независимыми коммунистическими нациями. Некоторые из наиболее экстремистских Советов Политбюро утверждают, что это прекрасная возможность захватить Китай, позволив Советам стать единственным знаменем власти для коммунизма. Советские Вооруженные Силы также готовы к любому приказу о возмездии китайцам. Однако в конечном счете решение о том, что следует делать, остается за Генеральным секретарем."
 ZhenbaoConflict.2.d: "Наши солдаты в провинции Хэйлунцзян нанесли решительный удар. Немногочисленные и относительно легко оснащенные пограничники на острове Чжэнбао были захвачены врасплох, и спорный остров теперь находится под контролем Китая. Из того, что мы можем наблюдать, видно, что Политбюро находится в состоянии кратковременного паралича. Сторонники жесткой линии в советском правительстве, несомненно, рекомендуют эскалацию, возможно, даже крупную обычную или ядерную атаку, но есть также некоторые признаки того, что Советы могут быть готовы достичь урегулирования путем переговоров. Советские Вооруженные Силы поднялись по тревоге на своих дальневосточных территориях, и наши собственные силы готовы встретить их, если они выберут дальнейшую эскалацию. Удар, нанесенный Советам в Чжэнбао, может отразиться на всем коммунистическом мире, потенциально ослабив советский контроль над коммунистическим блоком."
 GLP.100.d: "План[PRC.GetLeader] по превращению [PRC.GetNameDef] из аграрного общества в вершину коммунистической мощи пошел не так, как предполагалось. С высокой целью превзойти империалистов в [англ.GetNameDef] всего за пятнадцать лет [PRC.GetLeader] объявила массовую коллективизацию промышленности и сельского хозяйства через дворовые чугунные печи и интенсивные государственные проекты по выращиванию сельскохозяйственных культур. Хотя на конференции, обсуждавшей эти планы в Лушане, практически не было никакой реакции на них, радикальные последствия для планов Председателя стали очевидны. Урожайность в первый год была значительно ниже, чем ожидалось, из-за перераспределения рабочих и катастрофических саранчовых роев, возникших в результате ошибочной кампании Четырех вредителей. Кроме того, эти более низкие урожаи были зафиксированы на рекордно высоких уровнях из-за страха перед контролем центральных властей, что означало, что несуществующий избыток зерна был взят у крестьян, которые нуждались в нем, чтобы выжить. В ходе выполнения плана более тридцати миллионов человек погибло по всей [КНР.GetNameDef], [КНР.Экономика ГетАдъектива рухнула, а враждебность к правительству достигла небывалого максимума."
 Cultural_Rev.4.d: "В мае 1966 года председатель Мао Цзэдун созвал \"расширенное заседание\" Политбюро, группы, курирующей КПК. В неожиданном движении сессия была нагружена маоистской политической риторикой классовой борьбы, а также нападками на нынешних и бывших партийных лидеров. Далее, 16 мая Мао выпустил документ с огульными заявлениями о том, что буржуазия проникла в \"Партию, правительство, армию и различные сферы культуры\", чтобы саботировать социалистическое дело и превратить диктатуру пролетариата в диктатуру буржуазии. Это уведомление всему Китаю представляется своего рода оправданием нападения на скрытых контрреволюционеров внутри Китая."
 Cultural_Rev.200.d: "Хотя несомненно, что председатель Мао имел благие намерения с его Большим скачком вперед, его пятилетний план закончился полной катастрофой. В своих попытках перестроить сельскохозяйственное и промышленное производство в молодом [КНР.getName] он нанес непоправимый ущерб нашей великой нации. Хотя правительство сделало все возможное, чтобы скрыть результаты его пагубной политики, возмущение массовым голодом, насилием и общим крахом экономики направлено на председателя. Хотя он уже был вынужден отказаться от своего \"Большого скачка\", многие в партии обсуждают вопрос о том, чтобы заставить Мао уйти с поста председателя [PRC.GetNameDef] и даже с поста председателя [PRC.GetRulingParty]. Хотя он доказал свои заслуги в Народной освободительной войне, его неудачи заставили нас действовать.\"#[He has proven himself incapable of leading China!] //Мао выгнали из кресла председателя КНР, а не КПК. Лю Шаоци становится лидером. Ведет к культурной революции."
 Cultural_Rev.1.d: "Цзян Цин, бывшая актриса и уважаемая супруга нашего славного лидера [PRC.GetLeader], утвердила контроль над Пекинской оперой. Эта устаревшая форма оперы, одна из последних пережитков упадочной династии Цин, проявила себя как феодальная и буржуазная, что должно быть искоренено, если мы хотим соответствовать новым стандартам пролетариата. Темы этих опер постоянно сменяются, чтобы обеспечить надлежащее утверждение революционных и современных идеалов. Восемь опер нового образца Цзян Цина повествуют о славной революционной борьбе с иностранными и классовыми врагами. Далее, они рассказывают истории о нашем лидере, прокладывающем путь к социализму в нашей великой стране. Это вдохновенное искусство насаждает наши идеалы в борьбе с буржуазией."
 Cultural_Rev.3.d: "После ухода председателя Мао Цзэдуна с поста председателя [PRC.GetNameDef] его бывший протеже Лю Шаоки взял на себя роль президента. Однако трения между двумя лидерами по поводу Большого скачка вперед достигли кульминации в массивных искрах, которые медленно разжигаются в ревущее пламя. Мао Цзэдун официально осудил президента Шаоци как классового врага, пытающегося направить революцию к капитализму, и таким образом лишил его всех ролей, избил и посадил под домашний арест за его преступления против народа Китая."
 PRC_Tibet.1.d: "Тибет перешел под власть китайской династии Цин в 1720 году после того, как китайские войска успешно изгнали войска Джунгарского ханства. После Синьхайской революции 1911 года они стали независимым государством. В то время, когда Политический Тибет получил фактическую независимость, его социально-экономические и политические системы напоминали средневековую Европу. Попытки 13-го Далай-ламы между 1913 и 1933 годами расширить и модернизировать тибетские вооруженные силы в конечном итоге потерпели неудачу, в основном из-за противодействия со стороны влиятельных аристократов и монахов. Тибетское правительство мало контактировало с другими правительствами мира в период своей фактической независимости, за некоторыми исключениями, особенно с Индией, Соединенным Королевством и Соединенными Штатами. Это оставило Тибет дипломатически изолированным и отрезанным до такой степени, что он не мог высказать свою позицию по вопросам, хорошо известным международному сообществу.Однако мы никогда не отказывались от нашего утверждения, что Тибет является частью Китая, и уже много лет ведем с ними переговоры. Но, возможно, пришло время быть более агрессивными, если мы хотим, чтобы они объединились."
 PRC_Tibet.2.d: "Китайская Народная Республика только что объявила о своей новой политике в отношении Тибета. В очень неожиданном заявлении председатель Мао Цзэдун объявил, что КНР не будет стремиться к объединению Тибета в Китай, вместо этого сосредоточив свое внимание в другом месте."
 PRC_Tibet.3.d: "Китайское правительство потребовало, чтобы мы объединились под их началом. Должны ли мы подчиниться?"
 PRC_Tibet.4.d: "Отличная новость председатель! Тибетское правительство согласилось присоединиться к нам при условии, что мы дадим им некоторую степень автономии в экономических вопросах. Это, конечно, не проблема, так как мы можем просто раздавить их, если они будут дрейфовать слишком далеко от нас."
 PRC_Tibet.5.d: "Тибет отказался от нашего щедрого предложения присоединиться к нам. Похоже, теперь мы должны ответить военной силой."
 PRC_Tibet.6.d: "Как и ожидалось, китайские войска полностью превосходят нас. Теперь они пришли с предложением мира, Соглашением из семнадцати пунктов. Это соглашение подтвердило бы суверенитет Китая над Тибетом, но позволило бы нам сохранить ограниченную автономию. Если мы не хотим быть уничтоженными, мы должны принять эту сделку."
 PRC_Tibet.7.d: "После некоторых неприятных слухов тысячи людей собрались в тибетской столице, чтобы защитить Далай-ламу. Однако вскоре это переросло в массовый протест против нас с требованиями покинуть Тибет. Поскольку к нам присоединяется все больше людей, мы должны решить, подавлять ли протесты или выполнять их требования."
 Red_Guard.1.d: "Молодежь поднялась! Вдохновленные риторикой Красной книжечки председателя Мао, орды школьников взяли на себя задачу очистить Китай от контрреволюционных элементов и сделать Его маоистским изнутри. Эти молодые люди нападают на все контрреволюционное. Критика маоистских пьес уже подвергалась нападкам, а школьные учителя даже подвергались запугиванию и нападкам из-за их лекций и прошлого в националистической армии. Хотя красногвардейцам оказывали сильное сопротивление многие элементы внутри Китая, они получили личную поддержку председателя Мао Цзэдуна."
 Red_Guard.2.d: "Красная гвардия снова оказалась в центре внимания! Революционная молодежь начала наступление на Старые обычаи, Старую культуру, Старые привычки и Старые идеи после редакционной статьи, поощряющей уничтожение этих антипролетарских идей в газете \"Жэньминь жибао\". В последние несколько недель Красная гвардия заставляла менять названия магазинов и улиц и нападала на всех, кто выступал против революции. Далее они начали кампанию массового уничтожения, уничтожая традиционную китайскую архитектуру, литературу, искусство, храмы и даже кладбища и императорские гробницы. Хотя видные чиновники вмешались, чтобы предотвратить продолжение кампании, была проделана огромная работа по подавлению притеснений прошлого."
 Red_Guard.3.d: "Красная гвардия столкнулась с устойчивым коллапсом после нескольких инцидентов. Несколько раз красногвардейцы оказывались в прямом и кровопролитном конфликте с Народно-освободительной армией, штурмуя районы НОАК при поддержке жены председателя Мао Цзян Цин. Молодежь продолжала штурмовать производственные районы и вступала в конфликт с фабричными рабочими и фермерами, которые хотели сохранить статус-кво. Конфликты в правительстве по поводу того, поддерживать или подавлять, еще больше усугубили путаницу, и теперь бывший единый фронт рухнул в фракционность и междоусобицы между различными фракциями."
 Red_Guard.4.d: "После объявления КПК студенческого радикализма контрреволюционным были предприняты шаги по подавлению Красной гвардии как с помощью политики, так и с помощью военной силы. Те молодые люди, которые принимали участие в революции, слышали из уст Председателя, что движение закончилось. Сейчас многие студенты отправляются в сельскую местность для перевоспитания и реабилитации через работу и сельскую бедность. Красная гвардия мертва."