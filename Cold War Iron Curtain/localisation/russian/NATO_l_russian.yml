l_russian:
 NATO.1.t: "[From.GetName] и НАТО"
 NATO.1.d: "[From.GetName] является членом НАТО. Если мы объявим им войну, они получат возможность призвать в войну других членов НАТО. Это означает, что вполне вероятно, что мы окажемся в состоянии войны с большинством членов НАТО."
 NATO.1.a: "Стоит учитывать"
 NATO.2.t: "Призывать НАТО к оружию?"
 NATO.2.d: "На нас напала иностранная держава. Как член НАТО, мы можем ссылаться на статью 5 договора, которая требует от других стран НАТО оказывать нам помощь."
 NATO.2.a: "Позвать НАТО"
 NATO.2.b: "Мы справимся с этим"
 NATO.3.t: "[From.GetName] зовет на помощь!"
 NATO.3.d: "[From.GetName] подверглась нападению со стороны другой страны, и они сослались на статью 5 НАТО. Это означает, что мы должны помочь им в их войне."
 NATO.3.a: "Мы должны помочь нашим союзникам!"
 NATO.3.b: "Может, не стоит вмешиваться?"
 NATO.4.t: "Демобилизация НАТО"
 NATO.4.d: "Теперь, когда угроза в адрес какого-либо члена НАТО устранена, военный альянс между этими странами может быть распущен. НАТО снова мобилизуется, если другой член будет находиться под угрозой нападения."
 NATO.4.a: "Ладно"
 NATO.5.t: "НАТО демобилизуется"
 NATO.5.d: "Теперь, когда угроза в адрес какого-либо члена НАТО устранена, военный альянс между этими странами может быть распущен. НАТО снова мобилизуется, если другой член будет находиться под угрозой нападения."
 NATO.5.a: "Ладно"
 NATO.6.t: "[GetNewspaperHeader][From.GetName] покидает НАТО"
 NATO.6.d: "Правительство [From.GetName] объявило, что будет покидать НАТО. Они заявили, что альянс больше не отвечает их потребностям, они больше не чувствуют себя комфортно, работая вместе со своими старыми союзниками."
 NATO.6.a: "Интересно"
 NATO.7.t: "[From.GetName] добивается членства в НАТО"
 NATO.7.d: "[From.GetName] проявила интерес к вступлению в НАТО. Им будет предоставлен план действий по вступлению в НАТО, после чего они должны будут получить одобрение от всех существующих членов НАТО, чтобы стать новым членом."
 NATO.7.a: "Новые союзники?"
 NATO.8.t: "[GetNewspaperHeader][From.GetName] вступает в НАТО"
 NATO.8.d: "[From.GetName] было принята в НАТО. Теперь она являются частью военного альянса, и она присоединятся к нему, чтобы защищать своих союзников, а их новые союзники готовы защищать их."
 NATO.8.a: "Интересно"
 NATO.20.t: "[From.GetName] исключён из НАТО"
 NATO.20.d: "После вероломного нападения на товарища по НАТО мы решили исключить [From.GetName]. Они заплатят за это. Мы вместе противостоим всем врагам, и даже бывшим союзникам!"
 NATO.20.a: "Хорошо"
 NATO.201.t: "[GetNewspaperHeader][This.GetName] исключён из НАТО"
 NATO.201.d: "При пугающем повороте событий, вооруженные силы [This.GetName] начали военное вторжение против [Prev.GetName] в не спровоцированной операции. \nВ свете этой недавней агрессии, коалиционные силы НАТО оперативно устранили [This.GetName] из Соглашения о международном альянсе, формально осуждая их за этот вопиющий акт агрессии; не только против [Prev.GetName], но и против стабильности всего западного мира!\n\nЖелезный занавес наичнает ржаветь..."
 NATO.201.a: "Тревожно"
  
 NUKE_LEVEL: "Потребуются месяцы, чтобы [?radiation] перестала влиять на это государство."
 INSURGENCY_LEVEL: "Мятежники в этом государстве имеют относительную военную силу [?insurgency_strength], после достижения 200, они могут восстать, а если удерживается на 0 или ниже в течение определенного периода времени, это может подавить движение."
  #### NATO #### 
 NATO_decisions: "Членство в НАТО"
 NATO_decisions_desc: "НАТО или Организация Североатлантического договора - это военный союз между несколькими странами Северной Америки и Европы."
 leave_NATO: "Покинуть НАТО"
 leave_NATO_desc: "Мы больше не заинтересованы в том, чтобы быть частью НАТО."
 become_NATO_aspirant: "Стать страной-кандидатом в НАТО"
 become_NATO_aspirant_desc: "Страны-кандидаты в НАТО - это государства, проявившие интерес к членству в НАТО. После того, как мы проявим интерес к НАТО, мы получим план действий по членству, который даст нам цели, которых мы должны достичь до того, как нам разрешат вступить. Как только цели будут достигнуты, мы сможем начать переговоры о вступлении, что потребует от нас одобрения всех существующих членов НАТО."
 finish_NATO_membership_action_plan: "Выполнить план действий по членству"
 finish_NATO_membership_action_plan_desc: "Завершив план действий по вступлению в НАТО, мы сможем начать переговоры о вступлении с существующими членами. Каждый существующий член НАТО должен одобрить нашу заявку. Наш статус останется в качестве заявителя в НАТО до тех пор, пока все члены не утвердят нашу заявку."
 ratify_country_accession: "Ратифицировать вступление [From.GetName] в НАТО"
 ratify_country_accession_desc: "[From.GetName] завершил свой план действий по членству. Теперь нам остается только вместе с другими членами НАТО ратифицировать их вступление, после чего они станут полноправными членами НАТО."
 join_NATO: "Вступить в НАТО"
 join_NATO_desc: "Все остальные члены НАТО ратифицировали наше вступление в НАТО. Теперь мы можем стать полноправным членом альянса."
 show_non_ratified_countries: "Показать не ратифицировавшие нас страны"
 show_non_ratified_countries_desc: "Здесь вы можете увидеть список стран, которые еще не ратифицировали наше вступление. Вы можете заставить страны ратифицировать ваше вступление, установив с ними более тесные отношения."
 call_nato_to_arms: "Призывать НАТО к оружию!"
 call_nato_to_arms_desc: "Мы атакованы иностранной державой. Теперь мы можем ссылаться на статью 5 договора НАТО, что означает, что наши союзники должны прийти на нашу защиту"
 nato_member: "Член НАТО"
  
