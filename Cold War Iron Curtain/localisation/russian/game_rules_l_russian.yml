 #ALB game rules
 ALB_ALBANIAN_SUBVERSION_AI: "@ALB @USA [1950-ые] Судьба Албании"
 RULE_OPTION_ALB_PIXIES_CRUSHED: "Албанский режим устоял"
 RULE_OPTION_ALB_PIXIES_CRUSHED_DESC: "Несмотря на вмешательство иностранных держав, правительство Албании остается невредимым и продолжает следовать своим прежним курсом."
 RULE_OPTION_ALB_ALBANIA_SUBVERTED: "Монархистский переворот"
 RULE_OPTION_ALB_ALBANIA_SUBVERTED_DESC: "С помощью американцев и британцев реакционным лазутчикам удается свергнуть правительство Ходжи и вернуть на трон свергнутого короля Зогу."

