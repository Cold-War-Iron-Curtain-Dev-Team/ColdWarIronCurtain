 RULE_OPTION_ENG_GAITSKELL_1959: "Hugh Gaitskell Wins"
 RULE_OPTION_ENG_GAITSKELL_1959_DESC: "Хью Гейтскелл и Лейбористская партия победит на выборах."
 
 #BEL game rules
 BEL_1949_ELECTIONS_RULE: "@BEL Выборы 1949 года"
 RULE_OPTION_BEL_CSP_1949: "Победа CSP"
 RULE_OPTION_BEL_CSP_1949_DESC: "CSP победит на выборах. В течение этого срока они сосредоточатся на подавлении нацистских пережитков в Бельгии."
 RULE_OPTION_BEL_BSP_1949: "Победа BSP"
 RULE_OPTION_BEL_BSP_1949_DESC: "BSP победит на выборах. В течение этого срока они сосредоточатся на социальной политике и рабочих движениях."
 BEL_FATE_OF_MONARCHY_RULE: "@BEL [1950-ые] Судьба монархии"
 RULE_OPTION_BEL_REFERENDUM_SUCCESS: "Референдум - Успех"
 RULE_OPTION_BEL_REFERENDUM_SUCCESS_DESC: "Правительство вынесет вопрос о монархии на референдум, который удастся провести с помощью фламандских монархистов."
 RULE_OPTION_BEL_REFERENDUM_FAILURE: "Референдум - Король блокирован валлонцами"
 RULE_OPTION_BEL_REFERENDUM_FAILURE_DESC: "Правительство вынесет вопрос о монархии на референдум. Хотя референдум пройдет, валлонская оппозиция не позволит королю приступить к исполнению своих обязанностей."
 RULE_OPTION_BEL_RETURN_IGNORE: "Король возвращается - забастовки игнорируются"
 RULE_OPTION_BEL_RETURN_IGNORE_DESC: "Король вернется в Бельгию без каких-либо задержек. Всеобщие забастовки против короля будут проигнорированы."
 RULE_OPTION_BEL_RETURN_NEGOTIATE: "Король возвращается - переговоры с бастующими ведутся"
 RULE_OPTION_BEL_RETURN_NEGOTIATE_DESC: "Король вернется в Бельгию без каких-либо задержек. Всеобщие забастовки против короля будут согласованы."
 BEL_1950_ELECTIONS_RULE: "@BEL Выборы 1950 года"
 RULE_OPTION_BEL_CSP_1950: "Победа CSP"
 RULE_OPTION_BEL_CSP_1950_DESC: "CSP победит на выборах. В течение этого срока они позволят королю вернуться к исполнению своих обязанностей; и в течение этого же срока у них будет три разных премьер-министра."
 RULE_OPTION_BEL_BSP_1950: "Победа BSP"
 RULE_OPTION_BEL_BSP_1950_DESC: "BSP победит на выборах. В течение этого срока они продолжат антироялизм и будут проводить социалистическую политику."
 #general strike rule
 BEL_1954_ELECTIONS_RULE: "@BEL Выборы 1954 года"
 RULE_OPTION_BEL_CSP_1954: "Победа CSP"
 RULE_OPTION_BEL_CSP_1954_DESC: "CSP победит на выборах. В течение этого срока они будут заниматься вопросами экономического спада и уделять особое внимание связям с Западом."
 RULE_OPTION_BEL_BSP_1954: "Победа BSP"
 RULE_OPTION_BEL_BSP_1954_DESC: "BSP победит на выборах. В течение этого срока они будут применять социал-демократическую политику."
 #school debate rule
 BEL_1958_ELECTIONS_RULE: "@BEL Выборы 1958 года"
 RULE_OPTION_BEL_CSP_1958: "Победа CSP"
 RULE_OPTION_BEL_CSP_1958_DESC: "CSP победит на выборах. В течение этого срока они сформируют коалицию с BSP, решая социальные проблемы."
 RULE_OPTION_BEL_BSP_1958: "Победа BSP"
 RULE_OPTION_BEL_BSP_1958_DESC: "BSP победит на выборах. В течение этого срока они будут уделять больше внимания ситуации в Конго."
 
 #WGR game rules
 WGR_1949_ELECTIONS: "@WGR Выборы 1949 года"
 WGR_1949_ELECTIONS_DESC: "После восстановления независимости Германии первые свободные выборы привлекают большое внимание как внутри страны, так и за рубежом."
 RULE_OPTION_WGR_ADENEUER_1949_HISTORICAL: "Аденауэр избран - все хорошо"
 RULE_OPTION_WGR_ADENEUER_1949_HISTORICAL_DESC: "Конрад Аденауэр будет избран. На него будет совершено покушение, которое приведет к запрету Социалистической партии Германии. \n§YЭто исторический путь.§"
 RULE_OPTION_WGR_ADENEUER_1949_ASSASSINATED: "Аденауэр избран - Убийство"
 RULE_OPTION_WGR_ADENEUER_1949_ASSASSINATED_DESC: "На пост президента будет избран Конрад Аденауэр. Впоследствии он будет убит, что позволит увеличить поддержку Социалистической партии Германии."
 RULE_OPTION_WGR_SCHUMACHER_1949_RESIGNS: "Шумахер избран - отставка"
 RULE_OPTION_WGR_SCHUMACHER_1949_RESIGNS_DESC: "Будет избран Курт Шумахер. Он откажется от сотрудничества с КПД и в итоге уйдет в отставку в пользу Олленхауэра."
 RULE_OPTION_WGR_SCHUMACHER_1949_SOCIALIST_UNITY: "Шумахер избран - SED"
 RULE_OPTION_WGR_SCHUMACHER_1949_SOCIALIST_UNITY_DESC: "На выборах будет избран Курт Шумахер. Он сформирует западногерманскую SED; чтобы позволить §YОбъединить Германию§! при §RСоциалистическом§! режиме."
 WGR_1953_ELECTIONS: "@WGR Выборы 1953 года"
 WGR_1953_ELECTIONS_DESC: "§YТребования:§! §RНЕ§! Западная SED \nСостоятся вторые всеобщие выборы, на которых больше внимания будет уделено дипломатии. "
 RULE_OPTION_WGR_ADENEUER_1953: "Аденауэр избран"
 RULE_OPTION_WGR_ADENEUER_1953_DESC: "§YТребования:§! Аденауэр переживает покушение \nНа этот пост будет избран Конрад Аденауэр. В течение этого срока он будет применять теории социального рынка.\n§YЭто исторический путь.§"
 RULE_OPTION_WGR_OLLENHAUER_1953: "Олленхауэр избран"
 RULE_OPTION_WGR_OLLENHAUER_1953_DESC: "На этот пост будет избран Эрих Олленхауэр. В течение этого срока он будет налаживать связи со странами Восточного блока."
 RULE_OPTION_WGR_REMER_1953: "Ремер избран"
 RULE_OPTION_WGR_REMER_1953_DESC: "§YТребования:§! Аденауэр погиб в покушении \nОтто Эрнст Ремер будет избран."
 WGR_1957_ELECTIONS: "@WGR Выборы 1957 года"
 RULE_OPTION_WGR_ADENEUER_1957_DROP_CLAIMS: "Аденауэр избран - Отказ от претензий"
 RULE_OPTION_WGR_ADENEUER_1957_DROP_CLAIMS_DESC: "§YТребования:§! Аденауэр выжил \nНа этот пост будет избран Конрад Аденауэр. В течение этого срока он признает потерю восточных территорий, восстановит связи с Польшей."
 RULE_OPTION_WGR_ADENEUER_1957_KEEP_CLAIMS: "Аденауэр избран - Поддержка претензии"
 RULE_OPTION_WGR_ADENEUER_1957_KEEP_CLAIMS_DESC: "§YТребования:§! Аденауэр выжил \nНа этот пост будет избран Конрад Аденауэр. В течение этого срока он будет поддерживать претензии на восточные территории, создавая напряженность."
 RULE_OPTION_WGR_OLLENHAUER_1957: "Олленхауэр избран"
 RULE_OPTION_WGR_OLLENHAUER_1957_DESC: "Эрих Олленхауэр будет избран. В течение этого срока он будет предлагать §Yобъединение Германии§! при §gнейтральном§! режиме."
 WGR_NAVAL_REESTABLISHMENT: "@WGR [1950-ые] Восстановление военно-морского флота"
 RULE_OPTION_WGR_DEFENSIVE_NAVY: "Оборонительный флот"
 RULE_OPTION_WGR_DEFENSIVE_NAVY_DESC: "Бундесмарине будет восстановлена на основе оборонительной доктрины с использованием подводных лодок и эсминцев."
 RULE_OPTION_WGR_NAVAL_SUPREMACY: "Доминирование ВМФ"
 RULE_OPTION_WGR_NAVAL_SUPREMACY_DESC: "Бундесмарине будет восстановлена с доктринами "голубой воды", ориентированными на капитальные корабли."
 WGR_JOIN_NATO_AI: "@WGR £GFX_game_rule_flags_NATO  Членство Западной Германии в НАТО"
 RULE_OPTION_WGR_JOIN_NATO_SUCCESS: "Западная Германия становится членом НАТО"
 RULE_OPTION_WGR_JOIN_NATO_SUCCESS_DESC: "Получив приглашение, Западная Германия вступит в Организацию Североатлантического договора в качестве ее члена."
 RULE_OPTION_WGR_JOIN_NATO_FAILURE: "Западная Германия остается в НАТО"
 RULE_OPTION_WGR_JOIN_NATO_FAILURE_DESC: "Получив приглашение в Организацию Североатлантического договора, Западная Германия откажется и останется вне этой организации, хотя может сохранить западную ориентацию."
 
 #DDR game rules
 DDR_EASTERN_CLAIMS: "£GFX_game_rule_flags_DDR   [1950-ые] Восточные претензии"
 RULE_OPTION_DDR_RENOUNCE_CLAIMS: "Отказ от претензий"
 RULE_OPTION_DDR_RENOUNCE_CLAIMS_DESC: "Правительство Восточной Германии признает потерю восточных территорий за Польшей и СССР; окончание дебатов.\n§YЭто исторический путь.§"
 RULE_OPTION_DDR_DEMAND_CLAIMS: "Предъявление претензий"
 RULE_OPTION_DDR_DEMAND_CLAIMS_DESC: "Правительство Восточной Германии обратится к Советскому Союзу с просьбой о возвращении утраченных немецких территорий в Польше."
 DDR_POST_STALIN_ROUTE: "£GFX_game_rule_flags_DDR   [1950-ые] Последствия Берлинского восстания"
 RULE_OPTION_DDR_SECRETARY_RAU: "Секретарь Рау"
 RULE_OPTION_DDR_SECRETARY_RAU_DESC: "Действующий секретарь Вальтер Ульбрихт будет освобожден от должности, а его место займет Генрих Рау. С этого момента Восточная Германия будет придерживаться ревизионистской политики."
 RULE_OPTION_DDR_SECRETARY_ZAISSER: "Секретарь Цайссер"
 RULE_OPTION_DDR_SECRETARY_ZAISSER_DESC: "Действующий секретарь Вальтер Ульбрихт будет освобожден от должности, а его место займет Вильгельм Цайссер. С этого момента Восточная Германия будет придерживаться ревизионистской политики."
 RULE_OPTION_DDR_SECRETARY_ULBRICHT: "Секретарь Ульбрихт"
 RULE_OPTION_DDR_SECRETARY_ULBRICHT_DESC: "Вальтер Ульбрихт сохранит свой контроль, проводя ограниченную десталинизацию и зачищая внутрипартийную оппозицию. \n§YЭто исторический путь.§"
 RULE_OPTION_DDR_SECRETARY_HARICH: "Секретарь Харих"
 RULE_OPTION_DDR_SECRETARY_HARICH_DESC: "Вольфганг Харих и его "группа Хариха" захватят власть в SED. Они проведут масштабную либерализацию Восточной Германии, создав возможность для объединения Германии при §Cлиберальном§! режиме."
 
 #YUG game rules
 YUG_DJILAS_PRESIDENCY: "@YUG [1950-ые] Президентство Джиласа"
 RULE_OPTION_YUG_DJILAS_CRITIQUE_ACCEPTED: "Тито принимает критику Джиласа"
 RULE_OPTION_YUG_DJILAS_CRITIQUE_ACCEPTED_DESC: "Тито будет поддерживать Джиласа. Следующие реформы приведут к либерализации Югославии в соответствии с западным подходом."
 RULE_OPTION_YUG_DJILAS_PURGED: "Тито отвергает критику Джиласа" 
 RULE_OPTION_YUG_DJILAS_PURGED_DESC: "Тито отвергнет критику Джиаса. Он освободит от должности президента Джиласа и сохранит нынешний провосточный нейтралитет.\n§YЭто исторический путь.§"
 
 #ALB game rules
 ALB_POST_STALIN_COURSE: "@ALB [1950-ые] III съезд Партии труда"
 RULE_OPTION_ALB_HOXHA_STAYS: "Ходжа остается"
 RULE_OPTION_ALB_HOXHA_STAYS_DESC: "Поскольку сторонники Энвера Ходжи занимают все больше позиций в партии, Ходжа сохранит свои позиции и вычистит все следы ревизионизма. Албания будет двигаться в сторону маоизма. \n§YЭто исторический путь.§"
 RULE_OPTION_ALB_HOXHA_PURGED: "Реабилитация Дзодзе"
 RULE_OPTION_ALB_HOXHA_PURGED_DESC: "Кочи Дзодзе будет реабилитирован посмертно. Затем последует чистка Энвера Ходжи и назначение Лири Белишовой генеральным секретарем. Албания останется в советской сфере."
 
 #BUL game rules
 BUL_POST_STALINIST_COURSE: "@BUL [1950-ые] Пост-сталинский курс"
 RULE_OPTION_BUL_CHERVENKOV: "Анти-ревизионизм"
 RULE_OPTION_BUL_CHERVENKOV_DESC: "Валько Червенков станет лидером после чистки Югова и Живкова. Он будет придерживаться антиревизионизма, расширяя связи с Ходжей и Мао."
 RULE_OPTION_BUL_YUGOV: "Советская линия"
 RULE_OPTION_BUL_YUGOV_DESC: "Антон Югов возглавит страну при советской поддержке. Он будет углублять связи с Советским Союзом. \n§YЭто исторический путь.§"
 
 #ROM game rules
 ROM_POLITICAL_INFIGHTING: "@ROM [1950-ые] Политическая борьба"
 RULE_OPTION_ROM_PURGE_MUSCOVITES: "Чистка московской фракции"
 RULE_OPTION_ROM_PURGE_MUSCOVITES_DESC: "Георге Георгиу-Деж будет отстранять от власти и чистить московскую фракцию, сохраняя государственный гнет. \n§YЭто исторический путь.§"
 RULE_OPTION_ROM_PURGE_SECRETARY: "Чистка Георгиу-Деж"
 RULE_OPTION_ROM_PURGE_SECRETARY_DESC: "Московская фракция свергнет Георге Георгиу-Дежа. Лидерство перейдет к Ане Паукер, придерживающейся более либертартарного и плюралистского подхода."
 ROM_POST_STALINIST_COURSE: "@ROM [1950-ые] Постсталинский курс"
 RULE_OPTION_ROM_DESOVIETIZATION: "Сохранение лидерства"
 RULE_OPTION_ROM_DESOVIETIZATION_DESC: "Нынешнее руководство сохранит свое лидерство. Они будут придерживаться более независимого от СССР подхода. \n§YЭто исторический путь.§"
 RULE_OPTION_ROM_DESTALINIZATION: "Румынская десталинизация"
 RULE_OPTION_ROM_DESTALINIZATION_DESC: "К руководству страной придет Мирон Константинеску. Он займет ревизионистскую позицию, углубляя связи с Советским Союзом."
 
 #HUN game rules
 HUN_HUNGARIAN_REVOLUTION: "@HUN [1950-ые] Венгерская революция"
 HUN_HUNGARIAN_REVOLUTION_DESC: "Следуя примерам польского и австрийского путей, Венгрия попытается пойти по пути отхода от коммунизма."
 RULE_OPTION_HUN_REVOLUTION_SUCCESSFUL: "@HUN Революция достигла успеха"
 RULE_OPTION_HUN_REVOLUTION_SUCCESSFUL_DESC: "Венгрия отделится от Восточного блока и объявит нейтралитет. Они установят титоистскую демократию."
 RULE_OPTION_HUN_REVOLUTION_CRUSHED: "@SOV Революция сокрушена"
 RULE_OPTION_HUN_REVOLUTION_CRUSHED_DESC: "Советский Союз восстановит порядок, организовав возвращение Яноша Кадара. Венгрия пойдет по пути жесткой линии. \n§YЭто исторический путь.§"
 
 #CZE game rules
 CZE_PRESIDIUM_ESTABLISHMENT: "@CZE [1950-ые] Учреждение Президиума"
 RULE_OPTION_CZE_GOTTWALD_PURGED: "Готвальд освобожден от должности"
 RULE_OPTION_CZE_GOTTWALD_PURGED_DESC: "Клемент Готвальд будет освобожден от должности. Рудольф Сланский возьмет на себя руководство Чехословакией, открывая экономические реформы."
 RULE_OPTION_CZE_SLANSKY_TRIALS: "Процесс Сланского"
 RULE_OPTION_CZE_SLANSKY_TRIALS_DESC: "Рудольф Сланский будет предан суду и подвергнется репрессиям. Статус-кво сохранится. \n§YЭто исторический путь.§"
 CZE_POST_STALIN_COURSE: "@CZE [1950-ые] Пост-сталинский курс"
 RULE_OPTION_CZE_SECRETARY_HUSAK: "Генеральный секретарь Гусак"
 RULE_OPTION_CZE_SECRETARY_HUSAK_DESC: "Генеральным секретарем будет назначен Густав Гусак. Он будет проводить умеренную либерализацию, оставаясь при этом в советской сфере. \nIf Gottwald was purged; Czechoslovakia will embrace destalinization."
 RULE_OPTION_CZE_SECRETARY_NOVOTNY: "Генеральный секретарь Новотный"
 RULE_OPTION_CZE_SECRETARY_NOVOTNY_DESC: "Генеральным секретарем будет назначен Антонин Новотный. Он продолжит сталинскую политику; продолжит путь Готвальда. \nIf Gottwald was purged; Czechoslovakia will embrace destalinization. \n§YЭто исторический путь.§"
 
 #POL game rules
 POL_POLISH_OCTOBER: "@POL [1950-ые] Польский октябрь"
 RULE_OPTION_POL_APPOINT_GOMULKA: "Секретарь Гомулка"
 RULE_OPTION_POL_APPOINT_GOMULKA_DESC: "Руководство страной перейдет к Владиславу Гомулке. Он введет ограниченные политические свободы и будет способствовать развитию связей с западным блоком при сохранении советских отношений. \n§YЭто исторический путь.§"
 RULE_OPTION_POL_APPOINT_ZAWADZKI: "Секретарь Завадский"
 RULE_OPTION_POL_APPOINT_ZAWADZKI_DESC: "К руководству страной придет Александр Завадский. Он подавит оппозицию, во второй раз арестует Гомулку и вернет сталинскую политику."
 
