 #PAK game rules
 PAK_RAWALPINDI_CONSPIRACY_AI: "@PAK [1950-ые] Заговор в Равалпинди"
 RULE_OPTION_PAK_RAWALPINDI_THWARTED: "Заговор сорван"
 RULE_OPTION_PAK_RAWALPINDI_THWARTED_DESC: "Равалпиндский заговор будет сорван, а его заговорщики арестованы. Нынешнее гражданское правительство устоит... На время. \n§YЭто исторический путь.§"
 RULE_OPTION_PAK_RAWALPINDI_SUCCESS: "Равалпиндская революция"
 RULE_OPTION_PAK_RAWALPINDI_SUCCESS_DESC: "Заговор в Равалпинди будет проигнорирован, что приведет к левому перевороту и установке власти §Rмарксистско-ленинистского§! правительства."
 PAK_1955_ELECTIONS: "@PAK Выборы 1955 года"
 PAK_1955_ELECTIONS_DESC: "§YТребования:§! §CЗаговор сорван§!\nУчитывая недавний Равалпиндский заговор, Пакистану необходима новая конституция, а выборы определят и новую конституцию, и правительство."
 PAK_TRIPLE_ALLIANCE: "Победа Тройственного Альянса"
 PAK_TRIPLE_ALLIANCE_DESC: "Тройственный Альянс победит на выборах."
 PAK_UNITED_FRONT: "Победа Объединенного Фронта"
 PAK_UNITED_FRONT_DESC: "Объединенный Фронт победит на выборах."
 PAK_JAMAAT_ISLAMI: "Победа Джамаат-и Ислами"
 PAK_JAMAAT_ISLAMI_DESC: "Джамаат-и Ислами победит на выборах."
 PAK_SHAHABUDDIN_COMMISSION_AI: "@PAK [1960-ые] Отчет комиссии Шахабуддина"
 RULE_OPTION_PAK_SHAHABUDDIN_REVISED: "Пересмотренный отчет принят"
 RULE_OPTION_PAK_SHAHABUDDIN_REVISED_DESC: "Отчет комиссии Шахабуддина будет пересмотрен с целью укрепления власти президента и запрета политических партий.\n\n§CАйюб Хан должен захватить контроль над правительством!§!"
 RULE_OPTION_PAK_SHAHABUDDIN_ACCEPTED: "Отчет полностью принят"
 RULE_OPTION_PAK_SHAHABUDDIN_ACCEPTED_DESC: "Отчет комиссии Шахабуддина будет принят без пересмотра. Это ускорит возвращение к демократии и укрепит демократические институты.\n\n§CАйюб Хан должен захватить контроль над правительством!§!"
 PAK_RAJ_KASHMIR_UNREST_AI: "@PAK @KAS @RAJ Беспорядки в Кашмире 1965 года"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_WAR: "@PAK @RAJ Вторая Кашмирская война"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_WAR_DESC: "Беспорядки в Кашмире, начавшиеся с кражи религиозной реликвии, используются Индией и Пакистаном как возможность утвердить свои позиции в регионе. В итоге мелкие стычки перерастают в полномасштабную войну на субконтиненте."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_REFERENDUM: "@PAK @UNS @RAJ Плебисцит ООН"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_REFERENDUM_DESC: "Беспорядки в Кашмире, начавшиеся с кражи религиозной реликвии, побуждают Индию и Пакистан обратиться в ООН с просьбой провести плебисцит в Кашмире, чтобы окончательно решить этот вопрос."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_COMMUNAL_PARTITION: "@PAK @RAJ Общинный раздел Кашмира"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_COMMUNAL_PARTITION_DESC: "Беспорядки в Кашмире, начавшиеся с кражи религиозной реликвии, подталкивают Индию и Пакистан к разделу Кашмира на религиозной почве с передачей Сринагара Пакистану."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_FORMALISE_STATUS_QUO: "@PAK @RAJ Статус-кво становится постоянным"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_FORMALISE_STATUS_QUO_DESC: "Беспорядки в Кашмире, начавшиеся с кражи религиозной реликвии, побуждают Индию и Пакистан окончательно официально оформить фактическое разделение Кашмира и превратить линию прекращения огня в постоянную границу."
 PAK_HISTORICAL_1965_ELECTION_AI: "@PAK Выборы 1965 года (Исторические)"
 PAK_HISTORICAL_1965_ELECTION_AI_DESC: "§YТребования:§! §CКомиссия Шахабуддина принята с изменениями§!\n"
 RULE_OPTION_PAK_HISTORICAL_1965_AYUB_KHAN: "Айюб Хан"
 RULE_OPTION_PAK_HISTORICAL_1965_AYUB_KHAN_DESC: "После пересмотра отчета комиссии Шахабуддина, §LАйюб Хан§! одерживает легкую победу на сфальсифицированных выборах 1965 года.."
 RULE_OPTION_PAK_HISTORICAL_1965_FATIMA_JINNAH: "Фатима Джинна"
 RULE_OPTION_PAK_HISTORICAL_1965_FATIMA_JINNAH_DESC: "Несмотря на пересмотр отчета комиссии Шахабуддина, §CФатиме Джинне и объединенной оппозиции§! удается одержать победу на выборах 1965 года и укрепить демократию в Пакистане."
 PAK_DEMOCRATIC_1965_ELECTION_AI: "@PAK Выборы 1965 года (Демократические)"
 PAK_DEMOCRATIC_1965_ELECTION_AI_DESC: "§YТребования:§! §CКомиссия Шахабуддина принята в полном объеме§! ИЛИ §CФатима Джинна избрана в выборах 1965 года§!\n"
 RULE_OPTION_PAK_DEMOCRATIC_1965_AYUB_KHAN: "Айюб Хан"
 RULE_OPTION_PAK_DEMOCRATIC_1965_AYUB_KHAN_DESC: "После того, как доклад комиссии Шахабуддина был полностью принят, §LАйюб Хан и центристская коалиция§! сумели одержать победу на выборах 1965 года."
 RULE_OPTION_PAK_DEMOCRATIC_1965_SHEIKH_MUJIB: "Шейх Муджибур Рахман"
 RULE_OPTION_PAK_DEMOCRATIC_1965_SHEIKH_MUJIB_DESC: "После того, как доклад комиссии Шахабуддина был полностью принят, §Rшейху Муджибуру Рахману и левым§! удалось одержать победу на выборах 1965 года."
 PAK_1970_ELECTION_AI: "@PAK Демократические выборы 1970 года"
 RULE_OPTION_PAK_1970_BHUTTO: "Зульфикар Али Бхутто"
 RULE_OPTION_PAK_1970_BHUTTO_DESC: "После ухода Айюб Хана из политики, §OЗульфикар Али Бхутто и левоцентристская партия§! подхватывают его мантию и добиваются победы на выборах 1970 года.\n\n§CТребуется Отчет комиссии Шахабуддина был полностью принят или Фатима Джинна победила на исторических выборах 1965 года!§!"
 RULE_OPTION_PAK_1970_SHEIKH_MUJIB: "Шейх Муджибур Рахман"
 RULE_OPTION_PAK_1970_SHEIKH_MUJIB_DESC: "Когда вопрос демократии, казалось бы, решен, §RШейх Муджибур Рахман и левые§! добиваются победы на выборах 1970 года. Тем не менее, §LМухаммед Зия-уль-Хак§! пытается совершить переворот, но верные солдаты и национальная популярность Рахмана предотвращают его.\n\n§CТребуется Отчет комиссии Шахабуддина был полностью принят или Фатима Джинна победила на исторических выборах 1965 года!§!"
 RULE_OPTION_PAK_1970_ZIA_COUP: "Переворот Мухаммеда Зия-уль-Хака"
 RULE_OPTION_PAK_1970_ZIA_COUP_DESC: "После победы §RШейха Муджибура Рахмана§! на выборах 1970 года, §LМухаммед Зия-уль-Хак§! начинает переворот, в ходе которого популярность Рахмана исключительно в Восточном Пакистане позволяет военным свободно перемещаться на Запад и успешно свергнуть правительство.\n\n§CТребуется Отчет комиссии Шахабуддина был полностью принят или Фатима Джинна победила на исторических выборах 1965 года!§!"
 PAK_1975_ELECTION_AI: "@PAK Демократические выборы 1975 года"
 RULE_OPTION_PAK_1975_BHUTTO: "Зульфикар Али Бхутто"
 RULE_OPTION_PAK_1975_BHUTTO_DESC: "После целого десятилетия демократии, §OЗульфикар Али Бхутто и левоцентристская партия§! сумели одержать победу на выборах 1975 года.\n\n§CТребуется Единый Пакистан и его демократизация, чтобы пережить последствия демократических выборов 1970 года!§!"
 RULE_OPTION_PAK_1975_SHEIKH_MUJIB: "Шейх Муджибур Рахман"
 RULE_OPTION_PAK_1975_SHEIKH_MUJIB_DESC: "После целого десятилетия демократии, §RШейх Муджибур Рахман и левые§! сумели одержать победу на выборах 1975 года.\n\n§CТребуется Единый Пакистан и его демократизация, чтобы пережить последствия демократических выборов 1970 года!§!"
 RULE_OPTION_PAK_1975_ELAHI: "Чаудри Захур Элахи"
 RULE_OPTION_PAK_1975_ELAHI_DESC: "После целого десятилетия демократии, §GЧаудри Захур Элахи и религиозные правые§! сумели одержать победу на выборах 1975 года.\n\n§CТребуется Единый Пакистан и его демократизация, чтобы пережить последствия демократических выборов 1970 года!§!"
 
 #FRA game rules
 FRA_50S_ELECTIONS: "@FRA Выборы 1951 года"
 RULE_OPTION_FRA_50S_HISTORICAL: "@FRA Победа Troisième Force"
 RULE_OPTION_FRA_50S_ELECTIONS_HISTORICAL_DESC: "Третья сила победит на выборах 1951 года и продолжит политику демократического социализма.\n§YЭто исторический путь.§"
 RULE_OPTION_FRA_COMMUNIST_PEACE: "£GFX_game_rule_flags_FRA_communism  Победа ПКФ"
 RULE_OPTION_FRA_COMMUNIST_PEACE_DESC: "Коммунистическая партия победит на выборах 1951 года, сформирует 5-ю республику и присоединит Францию к Восточному блоку."
 RULE_OPTION_FRA_COMMUNIST_WAR: "@FRA @ALE Победа ПКФ (Интервенция НАТО)" 
 RULE_OPTION_FRA_COMMUNIST_WAR_DESC: "Коммунистическая партия победит на выборах 1951 года. Не желая, чтобы ключевой союзник переметнулся на другую сторону и прорвал железный занавес, США мобилизуют НАТО и объявляют войну Франции."
 FRA_1953_ELECTIONS: "@FRA Выборы 1953 ГОДА"
 RULE_OPTION_FRA_SFIO_1953: "Победа SFIO"
 RULE_OPTION_FRA_SFIO_1953_DESC: "SFIO победит на выборах 1953 года. Они займут просоветскую позицию. \nЭто позволит отправить Жака Сустеля в Алжир."
 RULE_OPTION_FRA_RADICALS_1953: "Победа Радикальной Партии"
 RULE_OPTION_FRA_RADICALS_1953_DESC: "На выборах 1953 года победит Радикальная Партия. Они займут компромиссную позицию между профсоюзами и работодателями. \nЭто позволит прекратить огонь в Алжире."
 RULE_OPTION_FRA_CNIP_1953: "Победа CNIP"
 RULE_OPTION_FRA_CNIP_1953_DESC: "CNIP победит на выборах. Они будут занимать позицию поддержки работодателей. \nЭто позволит отправить Робера Лакоста в Алжир.\n§YЭто исторический путь.§"
 FRA_1958_CRISIS: "@FRA Кризис 1958 года"
 RULE_OPTION_FRA_GAULLE_RETURNS: "Возвращение де Голля"
 RULE_OPTION_FRA_GAULLE_RETURNS_DESC: "Шарль де Голль вмешивается в продолжающийся кризис, что позволяет ему захватить власть и основать Пятую Французскую Республику.\n§YЭто исторический путь.§"
 RULE_OPTION_FRA_ALGERIAN_COMPROMISE: "Алжирский компромисс"
 RULE_OPTION_FRA_ALGERIAN_COMPROMISE_DESC: "Шарль де Голль не возглавит правительство. Это заставит Францию искать компромисс с Алжиром, в конечном итоге покинув его."
 
 #KRD game rules
 KRD_DROUGHT_OUTCOME:0 "£GFX_game_rule_flags_KRD  [1950-ые] Великая засуха"
 KRD_DROUGHT_OUTCOME_DESC: "§YТребования:§! §CСоветский Союз проводит агрессивную внешнюю политику в 1950-ые.§!"
 RULE_OPTION_KRD_JOIN_TURKEY:0 "£GFX_game_rule_flags_SRT  Турецкая интеграция"
 RULE_OPTION_KRD_JOIN_TURKEY_DESC:0 "Получив совет Сефика Хюсню, курдское правительство решит воссоединиться с Турцией в качестве автономного государства, чтобы получить полную турецкую помощь и спасти курдский народ."
 RULE_OPTION_KRD_JOIN_SOVIET:0 "@SOV Добро пожаловать в Союз!"
 RULE_OPTION_KRD_JOIN_SOVIET_DESC:0 "Получив совет Сефика Хюсню, курдское правительство решит стать полноправной ССР и присоединиться к Советскому Союзу для борьбы с засухой с помощью других советских республик."
 RULE_OPTION_KRD_INDEPENDENT_RURAL:0 "@KUR Назад к основам"
 RULE_OPTION_KRD_INDEPENDENT_RURAL_DESC:0 "Курдское правительство проигнорирует совет Хюсню и будет держаться за мечту о нации. Впоследствии они откажутся от советской модели индустриализации и вернутся к аграрно-феодальной экономике, оставаясь верными Москве."
 RULE_OPTION_KRD_INDEPENDENT_INDUSTRIAL:0 "£GFX_game_rule_flags_KRD  Двойное падение"
 RULE_OPTION_KRD_INDEPENDENT_INDUSTRIAL_DESC:0 "Курдское правительство проигнорирует совет Хюсню и будет держаться за мечту о нации. После этого они продолжат быструю индустриализацию и столкнутся со второй засухой, а поиск решения станет вопросом выживания."
 
 #TRS game rules
 TRS_UNIFICATION: "@TRS [1954] Объединение Триеста"
 RULE_OPTION_TRS_HISTORICAL: "@TRS Лондонский меморандум"
 RULE_OPTION_TRS_HISTORICAL_DESC: "Италия и Югославия достигнут соглашения относительно Триеста и разделят территорию: зона А отойдет Италии, а зона Б - Югославии.\n§YЭто исторический путь.§"
 RULE_OPTION_TRS_ITALY: "@ITA Итальянский Триест"
 RULE_OPTION_TRS_ITALY_DESC: "Не удовлетворившись своей половиной, Италия будет настаивать на полной аннексии территории. Опасаясь вмешательства Великобритании и США на стороне Италии, Югославия отступит."
 RULE_OPTION_TRS_YUGO: "@YUG Югославский Триест"
 RULE_OPTION_TRS_YUGO_DESC: "Югославия заставит Италию отказаться от полного контроля над Триестом. Чтобы защитить мир на Адриатике, Италия уступит, и Триест окажется в руках Югославии."
 RULE_OPTION_TRS_WAR: "@ITA @YUG Война за Триест"
 RULE_OPTION_TRS_WAR_DESC: "Переговоры о статусе Триеста потерпят неудачу, и Европа станет свидетелем еще одной войны на Адриатике."
 
 #ITA game rules
 ITA_53_ELECTIONS: "@ITA Всеобщие выборы в Италии 1953 года"
 RULE_OPTION_ITA_53_ELECTIONS_HISTORICAL: "@ITA Победа Центристской коалиции - Пелла уходит в отставку"
 RULE_OPTION_ITA_53_ELECTIONS_HISTORICAL_DESC: "Широкая коалиция христианских демократов и либералов во главе с Джузеппе Пелла одержит победу на выборах 1953 года и постепенно усилит итальянских правых. После решения вопроса о Триесте Пелла уйдет в отставку и будет заменен на Марио Скельба. \n§YЭто исторический путь.§"
 RULE_OPTION_ITA_53_CENTER_RIGHT: "@ITA Победа Центристской коалиции - Центристско-правая коалиция"
 RULE_OPTION_ITA_53_CENTER_RIGHT_DESC: "Широкая коалиция христианских демократов и либералов во главе с Джузеппе Пелла одержит победу на выборах 1953 года и постепенно усилит итальянских правых. После решения вопроса о Триесте Пелла останется на своем посту и займет более правую позицию."
 RULE_OPTION_ITA_53_POPULAR_FRONT: "£GFX_game_rule_flags_ITA_communism  Победа народной демократии"
 RULE_OPTION_ITA_53_POPULAR_FRONT_DESC: "Народно-демократический фронт, коммунистическо-социалистическая коалиция победит на выборах 1953 года. После незначительного поражения на предыдущих выборах из-за влияния ЦРУ новое левое правительство выведет страну из НАТО и будет придерживаться сбалансированной политики между Востоком и Западом."
 ITA_58_ELECTIONS: "@ITA Всеобщие выборы в Италии 1958 года"
 RULE_OPTION_ITA_58_ELECTIONS_SOCIALIST: "Победа социалистов"
 RULE_OPTION_ITA_58_ELECTIONS_SOCIALIST_DESC: "Социалистическая ИСРП победит на выборах 1958 года. В течение этого срока они будут придерживаться более восточного дипломатического курса, занимая более нейтральную позицию."
 RULE_OPTION_ITA_58_ELECTIONS_FANFANI: "Fanfani Becomes Prime Minister"
 RULE_OPTION_ITA_58_ELECTIONS_FANFANI_DESC: "DC победит на выборах. В течение этого срока они будут придерживаться более центристского курса, балансируя между интересами правого и левого крыла.\n§YЭто исторический путь.§"
 RULE_OPTION_ITA_58_ELECTION_RIGHT_WING: "Победа правых"
 RULE_OPTION_ITA_58_ELECTION_RIGHT_WING_DESC: "MSI победит на выборах. В течение этого срока они будут придерживаться антилевого курса с евроскептицизмом, сохраняя при этом прозападную ориентацию."
 
 #EGY game rules
 EGY_EGYPTIAN_REVOLUTION: "@EGY £GFX_game_rule_flags_EGY_freeofficers   [1950-ые] Египетская революция"
 EGY_EGYPTIAN_REVOLUTION_DESC: ""
 RULE_OPTION_EGY_MONARCHY_OVERTHROWN: "£GFX_game_rule_flags_EGY_freeofficers   Монархия свергнута"
 RULE_OPTION_EGY_MONARCHY_OVERTHROWN_DESC: "Военные офицеры успешно осуществят переворот и возьмут власть в свои руки. Египетская монархия будет упразднена.\n§YЭто исторический путь.§"
 RULE_OPTION_EGY_REVOLUTION_CRASHED: "@EGY Революция раздавлена"
 RULE_OPTION_EGY_REVOLUTION_CRASHED_DESC: "Монархия сохранится, а мятежные офицеры будут арестованы. Монархия сохранит абсолютизм."
 EGY_FUTURE_OF_MONARCHY: "@EGY [1950-ые] Будущее монархии"
 EGY_FUTURE_OF_MONARCHY_DESC: "§YТребования:§! §CВоенный переворот провалился.§!"
 RULE_OPTION_EGY_MODERN_PHARAOH: "Современный фараон"
 RULE_OPTION_EGY_MODERN_PHARAOH_DESC: "Король Фарук закрепит свое абсолютистское правление, проведя лишь незначительные реформы."
 RULE_OPTION_EGY_KING_REPLACED: "Фарук низложен"
 RULE_OPTION_EGY_KING_REPLACED_DESC: "Король Фарук будет свергнут в пользу нового монарха. Абсолютизм будет отменен по мере восстановления демократических институтов."
 EGY_REVOLUTION_AFTERMATH: "£GFX_game_rule_flags_EGY_freeofficers  [1950-ые] Конфликт в RCC"
 EGY_REVOLUTION_AFTERMATH_DESC: "§YТребования:§! §CЕгипетская монархия свергнута.§!"
 RULE_OPTION_EGY_NASSER: "£GFX_game_rule_flags_UAR  Националистическая революция"
 RULE_OPTION_EGY_NASSER_DESC: "Гамаль Абдель Насер сместит Нагиба и станет президентом. Он будет работать над созданием панарабистской Объединенной Арабской Республики.\n§YЭто исторический путь.§"
 RULE_OPTION_EGY_NAGUIB: "£GFX_game_rule_flags_EGY_democracy  Демократическая революция"
 RULE_OPTION_EGY_NAGUIB_DESC: "Мохаммед Нагиб отвоюет контроль у Насера, отменит запрет на политические партии и проведет свободные выборы."
 RULE_OPTION_EGY_MOHIEDDIN: "£GFX_game_rule_flags_EGY_communism  Коммунистическая революция"
 RULE_OPTION_EGY_MOHIEDDIN_DESC: "В разгар борьбы Насера и Нагиба за власть Кахлид Мохиддин и группа леворадикальных офицеров совершают переворот в правительстве и устанавливают марксистский режим."
 EGY_REPUBLIC_ELECTION: "£GFX_game_rule_flags_EGY_democracy  [1950-ые] Первые выборы Республики"
 EGY_REPUBLIC_ELECTION_DESC: "§YТребования:§! §CМохаммед Нагиб консолидировал власть.§!"
 RULE_OPTION_EGY_NATIONALIST: "Победа Нагиба"
 RULE_OPTION_EGY_NATIONALIST_DESC: "Мохаммед Нагиб победит на выборах и медленно реформирует Египет в многопартийную демократию западного образца, одновременно восстанавливая отношения с другими демократическими странами."
 RULE_OPTION_EGY_DEMOCRATIC: "Победа реформированной Вафд"
 RULE_OPTION_EGY_DEMOCRATIC_DESC: "Реформированная партия Вафд победит на выборах. Чтобы избавиться от своей старой репутации, они займут антибританскую позицию и принесут в Египет классический либерализм."
 RULE_OPTION_EGY_ISLAMIC: "Победа умеренного Ихвана"
 RULE_OPTION_EGY_ISLAMIC_DESC: "Хасан аль-Худайби и умеренная фракция "Ихван" победят на выборах. Вместо радикальной чистки Египта от иррелигиозных элементов, правительство будет проводить политику, сочетающую исламское правление с демократическими принципами."
 RULE_OPTION_EGY_SALAFIST: "Победа радикального Ихвана"
 RULE_OPTION_EGY_SALAFIST_DESC: "На выборах победит радикальная фракция "Ихван" во главе с Сайидом Кутбом. Новое государство будет жестко преследовать религиозные меньшинства и сосредоточится на уничтожении еврейской нации."
 EGY_FATE_OF_SUDAN: "@EGY @ENG [1950-ые] Судьба Судана"
 EGY_FATE_OF_SUDAN_DESC: "Поскольку будущее Египта все больше и больше отдаляется от британцев, будущее англо-египетского Судана оказалось под вопросом."
 RULE_OPTION_EGY_EGYPTIAN_SUDAN: "@EGY Египетский Судан"
 RULE_OPTION_EGY_EGYPTIAN_SUDAN_DESC: "§YТребования:§! §CКороль Фарук - модернистский фараон§!\nСудан будет полностью аннексирован Египтом."
 RULE_OPTION_EGY_DIVIDED_SUDAN: "@EGY @SSU Раздел Судана"
 RULE_OPTION_EGY_DIVIDED_SUDAN_DESC: "Египет аннексирует северную половину Судана, а юг получит независимость."
 RULE_OPTION_EGY_INDEPENDENT_SUDAN: "£GFX_game_rule_flags_SUD_independence   Независимость Судана"
 RULE_OPTION_EGY_INDEPENDENT_SUDAN_DESC: "Египет и Великобритания договорятся о независимости Судана"
 
 #GRE game rules
 GRE_CIVIL_WAR: "@GRE @PDG [1950-ые] Гражданская война в Греции"
 GRE_CIVIL_WAR_DESC: "С единством греческого сопротивления покончено, поскольку продолжается гражданская война. Политическое устройство Греции находится под вопросом."
 RULE_OPTION_GRE_DEMOCRACY: "@GRE Победа правительства"
 RULE_OPTION_GRE_DEMOCRACY_DESC: "Коммунистическое восстание будет подавлено, а нынешняя конституционная монархия сохранится.\n§YЭто исторический путь.§"
 RULE_OPTION_GRE_COMMUNISM: "@PDG Победа коммунистов"
 RULE_OPTION_GRE_COMMUNISM_DESC: "ELAS войдет в Афины и установит коммунистическое правительство, присоединившись к Восточному блоку."
 GRE_1950_ELECTIONS: "@GRE Выборы 1950 года"
 GRE_1950_ELECTIONS_DESC: "§YТребования:§! §CПравительство победило в гражданской войне§!"
 RULE_OPTION_GRE_VENIZELOS: "Софоклис Венизелос"
 RULE_OPTION_GRE_VENIZELOS_DESC: "Софоклис Венизелос победит на выборах; Его позже сменит Николаос Пластирас. В течение этого срока он попытается сохранить венизелистскую группу в неприкосновенности."
 RULE_OPTION_GRE_TSALDARIS: "Константинос Цалдарис"
 RULE_OPTION_GRE_TSALDARIS_DESC: "Константинос Цалдарис победит на выборах. В течение этого срока он будет придерживаться консервативного курса при поддержке монархии."
 GRE_1951_ELECTIONS: "@GRE Выборы 1951 года"
 RULE_OPTION_GRE_PLASTIRAS_1951: "Николаос Пластирас"
 RULE_OPTION_GRE_PLASTIRAS_1951_DESC: "Николаос Пластирас победит на выборах. В течение этого срока он попытается примириться с левыми."
 RULE_OPTION_GRE_PAPAGOS_1951: "Александрос Папагос"
 RULE_OPTION_GRE_PAPAGOS_1951_DESC: "Александрос Папагос победит на выборах. В течение этого срока он изменит избирательную систему против левых.."
 GRE_1952_ELECTIONS: "@GRE Выборы 1952 года"
 RULE_OPTION_GRE_PLASTIRAS_1952: "Николаос Пластирас"
 RULE_OPTION_GRE_PLASTIRAS_1952_DESC: "Николаос Пластирас победит на выборах. В течение этого срока он восстановит закон 509, продолжив чистки коммунистов. После его смерти, место президента займет Софоклис Венизелос."
 RULE_OPTION_GRE_PAPAGOS_1952: "Александрос Папагос"
 RULE_OPTION_GRE_PAPAGOS_1952_DESC: "Александрос Папагос победит на выборах. В течение этого срока он отменит закон 509, позволив коммунистам вернуться на политическую сцену. После его смерти, место президента займет Константинос Караманлис."
 GRE_1956_ELECTIONS: "@GRE Выборы 1956 года"
 RULE_OPTION_GRE_KARAMANLIS_1956: "Константинос Караманлис"
 RULE_OPTION_GRE_KARAMANLIS_1956_DESC: "Константинос Караманлис победит на выборах. В течение этого срока он сосредоточится на привлечении иностранных инвестиций."
 RULE_OPTION_GRE_PAPANDREOU_1956: "Георгиос Папандреу"
 RULE_OPTION_GRE_PAPANDREOU_1956_DESC: "Георгиос Папандреу победит на выборах. В течение этого срока он отменит закон 511, положив конец притеснению коммунистов."
 GRE_1958_ELECTIONS: "@GRE Выборы 1958 года"
 RULE_OPTION_GRE_KARAMANLIS_1958: "Константинос Караманлис"
 RULE_OPTION_GRE_KARAMANLIS_1958_DESC: "Константинос Караманлис победит на выборах. В течение этого срока он будет принимать меры против левых и одновременно проводить индустриализацию Греции."
 RULE_OPTION_GRE_PAPANDREOU_1958: "Георгиос Папандреу"
 RULE_OPTION_GRE_PAPANDREOU_1958_DESC: "Георгиос Папандреу победит на выборах. В течение этого срока он введет в действие свой "Национальный экономический план"."
 GRE_JOIN_NATO_AI: "@GRE £GFX_game_rule_flags_NATO  Членство Греции в НАТО"
 RULE_OPTION_GRE_JOIN_NATO_SUCCESS: "Греция становится членом НАТО"
 RULE_OPTION_GRE_JOIN_NATO_SUCCESS_DESC: "После приглашения Греция вступит в Организацию Североатлантического договора в качестве члена альянса."
 RULE_OPTION_GRE_JOIN_NATO_FAILURE: "Греция не вступает в НАТО"
 RULE_OPTION_GRE_JOIN_NATO_FAILURE_DESC: "Когда Грецию пригласят в Организацию Североатлантического договора, она откажется и останется вне этой организации, хотя может сохранить западную ориентацию."
 
 #PDG game rules
 PDG_GREEK_CIVIL_WAR: "@PDG [1950-ые] Организация ELAS"
 PDG_GREEK_CIVIL_WAR_DESC: "Фронт национального освобождения отказался подчиниться реакционному правительству и ведет открытую войну против правительства. В настоящее время вопрос заключается в том, как ELAS должна быть организована."
 RULE_OPTION_HISTORICAL_PDG_AI: "Конвенциональная война"
 RULE_OPTION_HISTORICAL_PDG_AI_DESC: "Греческая демократическая армия продолжит войну с применением обычных видов вооружения. \n§YЭто исторический путь.§"
 RULE_OPTION_GUERILLA_PDG_AI: "Партизанская война"
 RULE_OPTION_GUERILLA_PDG_AI_DESC: "Греческая демократическая армия возьмет пример с освободительных войн и будет вести партизанскую войну."
 PDG_POST_STALIN_COURSE: "@PDG Пост-сталинский коммунизм в Греции"
 PDG_POST_STALIN_COURSE_DESC: "Сталин ушел из жизни; курс руководства в переломный момент находится под вопросом."
 RULE_OPTION_PDG_ZACHARIDIS_STAYS: "Захариадис остается у власти"
 RULE_OPTION_PDG_ZACHARIDIS_STAYS_DESC: "Никос Захариадис будет сохранять контроль. Он будет выступать против ревизионизма, одновременно придерживаясь маоистского курса."
 RULE_OPTION_PDG_KOLIGIANNIS_TAKES_OVER: "Колигианнис принимает руководство"
 RULE_OPTION_PDG_KOLIGIANNIS_TAKES_OVER_DESC: "Костас Колигианнис возьмет под контроль Грецию. Он будет следовать ревизионистской линии и поддерживать советскую ориентацию."
 RULE_OPTION_PDG_VAFEIADIS_TAKES_OVER: "Вафеадис принимает руководство"
 RULE_OPTION_PDG_VAFEIADIS_TAKES_OVER_DESC: "Маркос Вафеадис займет пост премьер-министра Греции. Сохраняя советскую ориентацию Греции, он будет придерживаться более либертарного курса."
 
 #BCP game rules
 BCP_FOREIGN_AI_BEHAVIOR: "@BCP [1950-ые] Бирманский коммунистический союз"
 RULE_OPTION_CHINESE_ALIGNMENT_BCP_AI: "Китайская ориентация"
 RULE_OPTION_CHINESE_ALIGNMENT_BCP_AI_DESC: "Бирманские коммунисты будут сотрудничать с Китаем под идеями маоизма. \n§YЭто исторический путь.§"
 RULE_OPTION_SOVIET_ALIGNMENT_BCP_AI: "Советская ориентация"
 RULE_OPTION_SOVIET_ALIGNMENT_BCP_AI_DESC: "Бирманские коммунисты будут сотрудничать с Советским Союзом."
 BCP_INTERNAL_AI_BEHAVIOR: "@BCP [1950-ые] Внутренние дела бирманской PLA"
 RULE_OPTION_POLITICAL_FORCE: "Сотрудничество с NUF"
 RULE_OPTION_POLITICAL_FORCE_DESC: "Бирманская коммунистическая партия сосредоточится на парламентских выборах, дистанцируясь от повстанческого движения."
 RULE_OPTION_LIBERATION_WAR_BCP_AI: "Освободительная война"
 RULE_OPTION_LIBERATION_WAR_BCP_AI_DESC: "Бирманская коммунистическая партия расставит приоритеты и усилит свое повстанческое движение. \n§YЭто исторический путь.§"
 
 #PER game rules
 PER_ELECTIONS_52: "@PER Выборы в Иране 1952 года"
 RULE_OPTION_HISTORICAL_MOSADDEGH_52: "Победа Национального фронта"
 RULE_OPTION_HISTORICAL_MOSADDEGH_52_DESC: "Мохаммад Мосаддык будет защищать свои позиции, а также продолжит политику национализма и внутренней независимости. \n§YЭто исторический путь.§"
 RULE_OPTION_PER_ROYALIST_52: "Победа роялистов"
 RULE_OPTION_HISTORICAL_PER_ROYALIST_52_DESC: "Роялистский священник Хасан Эмами победит на выборах. Будучи известным англофилом, он будет стремиться к улучшению отношений с Западом, пытаясь при этом снизить общий уровень беспорядков."
 PER_AJAX: "@PER Операция Аякс"
 PER_AJAX_DESC: "§YТребования:§! §CНациональный фронт победил на выборах 1952 года§!\nПосле того как Мосаддык национализировал нефтяные компании, западные державы сочли это враждебным шагом и попросили шаха свергнуть своего собственного премьер-министра."
 RULE_OPTION_HISTORICAL_PER_AJAX: "Шах соглашается"
 RULE_OPTION_HISTORICAL_PER_AJAX_DESC: "Шах согласится поддержать англо-американский переворот против Мосаддыка. \n§YЭто исторический путь.§"
 RULE_OPTION_SHAH_REFUSE: "Шах отказывает"
 RULE_OPTION_HISTORICAL_SHAH_REFUSE_DESC: "Шах встанет на сторону Мосаддыка и откажется поддержать переворот. В последующие недели тысячи клерикалов и шиитских экстремистов восстанут против светского правительства, свергнут династию Пехлеви и восстановят власть Каджари в виде исламистской монархии".
 PER_RIOTS: "@PER Беспорядки в Тегеране"
 PER_RIOTS_AI_DESC: "§YТребования:§! §CОперация "Аякс" начата.§!"
 RULE_OPTION_HISTORICAL_PER_RIOTS: "Монархия сохраняется"
 RULE_OPTION_HISTORICAL_PER_RIOTS_DESC: "Успех переворота приведет к укреплению монархического правления и возвращению шаха к власти.\n§YЭто исторический путь.§""
 RULE_OPTION_RIOTS_REPUBLIC: "Подавление переворота и массовых беспорядков"
 RULE_OPTION_RIOTS_REPUBLIC_DESC: "Преданный шахом, Мосаддык не сдается и любыми средствами побеждает переворот. Впоследствии он превратит Иран в республику и вычистит из общества экстремистские элементы."
 RULE_OPTION_RIOTS_TUDEH: "Туде приходит к власти"
 RULE_OPTION_RIOTS_TUDEH_DESC: "По мере нарастания беспорядков партия "Туде" при поддержке СССР и национальных меньшинств упраздняет монархию и создает однопартийное коммунистическое государство."
 PER_COMMUNISM_SPLIT: "£GFX_game_rule_flags_PER_communism  Будущее Иранской революции"
 PER_COMMUNISM_SPLIT_DESC: "§YТребования:§! §CЗахват власти "Туде" во время тегеранских беспорядков§!\n"
 RULE_OPTION_PER_SOVIET: "@SOV Советская ориентация"
 RULE_OPTION_PER_SOVIET_DESC: "Новое правительство Ирана встанет на сторону Советского Союза и восточного блока, обменяв свои северные территории на увеличение помощи СЭВ."
 RULE_OPTION_PER_YUGOSLAVIA: "@YUG Движение неприсоединения"
 RULE_OPTION_PER_YUGOSLAVIA_DESC: "Не доверяя экспансионистской политике Советского Союза в отношении Азербайджана, Иран примет решение о вступлении в Движение неприсоединения и будет стремиться к вооруженному нейтралитету."
 PER_GHARANI_COUP: "@PER [1950-ые] Переворот Гарани"
 PER_GHARANI_COUP_DESC: "§YТребования:§! §CМонархия сохраняется во время беспорядков в Тегеране§!.\n"
 RULE_OPTION_PER_GHARANI_COUP_FAIL: "Провал переворота"
 RULE_OPTION_PER_GHARANI_COUP_FAIL_DESC: "Попытка переворота Гарани не удастся, и он будет заключен в тюрьму. После этого Мосаддык будет казнен. \n§YЭто исторический путь.§"
 RULE_OPTION_PER_GHARANI_COUP_SUCCEED: "Успех переворота"
 RULE_OPTION_PER_GHARANI_COUP_SUCCEED_DESC: "Гарани успешно свергнет правительство. При этом монархия сохранится, Мосаддык будет освобожден и пройдут новые выборы."
 PER_GHARANI_COUP_AFTERMATH: "@PER [1950-ые] Советский гамбит"
 PER_GHARANI_COUP_AFTERMATH_DESC: "§YТребования:§! §CПереворот Гарани провалился§!.\nШах планирует подписать пакт о ненападении с Советским Союзом, против чего выступают США."
 RULE_OPTION_PER_ALIGN_AMERICA: "@PER @USA Американская ориентация"
 RULE_OPTION_PER_ALIGN_AMERICA_DESC: "На Шаха будет оказано давление, чтобы он присоединился к американской сфере, а затем признал Израиль. \n§YЭто исторический путь.§"
 RULE_OPTION_PER_IRANIAN_CIVIL_WAR: "@PER £GFX_game_rule_flags_PER_communism   £GFX_game_rule_flags_KRD   Гражданская война в Иране"
 RULE_OPTION_PER_IRANIAN_CIVIL_WAR_DESC: "Шах Реза Пехлеви будет убит. Несмотря на коронацию нового шаха Голам Резы Пехлеви, курды и коммунисты развязывают гражданскую войну."
 RULE_OPTION_PER_TUDEH_RETURNS: "£GFX_game_rule_flags_PER_communism   Возвращение Туде"
 RULE_OPTION_PER_TUDEH_RETURNS_DESC: "Шах Реза Пехлеви будет убит. Хаосом воспользуются коммунисты, которые быстро захватят власть."
 PER_1954_ELECTIONS: "@PER Выборы 1954 года"
 PER_1954_ELECTIONS_DESC: "§YТребования:§! §CМосаддык провозгласил республику.§!\n"
 RULE_OPTION_PER_MOSADDEGH_1954: "Победа национального фронта"
 RULE_OPTION_PER_MOSADDEGH_1954_DESC: "Национальный фронт победит на выборах. В течение этого срока они будут усиливать связи Ирана с Америкой."
 RULE_OPTION_PER_TOILERS_PARTY_1954: "Победа партии трудящихся"
 RULE_OPTION_PER_TOILERS_PARTY_1954_DESC: "Партия трудящихся победит на выборах. В течение этого срока они будут усиливать связи Ирана с Югославией."
 RULE_OPTION_PER_MOJAHEDS_1954: "Победа моджахедов"
 RULE_OPTION_PER_MOJAHEDS_1954_DESC: "Общество мусульманских моджахедов победит на выборах. В течение этого срока они будут внедрять законы шариата."
 PER_1958_ELECTIONS: "@PER Выборы 1958 года"
 PER_1958_ELECTIONS_DESC: "§YТребования:§! §CМоссадык провозгласил республику.§! OR §CУспех переворота Гарани§!.\n"
 RULE_OPTION_PER_MOSADDEGH_1958: "Победа национального фронта"
 RULE_OPTION_PER_MOSADDEGH_1958_DESC: "Национальный фронт победит на выборах."
 RULE_OPTION_PER_TOILERS_PARTY_1958: "Победа партии трудящихся"
 RULE_OPTION_PER_TOILERS_PARTY_1958_DESC: "Партия трудящихся победит на выборах."
 RULE_OPTION_PER_MOJAHEDS_1958: "Победа моджахедов"
 RULE_OPTION_PER_MOJAHEDS_1958_DESC: "Общество мусульманских моджахедов победит на выборах. В течение этого срока они отменят монархию в пользу исламской республики."
 
 #YAN game rules
 YAN_FAILURE_OUTCOME: "@YAN [1950-ые] Катастрофа в Юньнане"
 YAN_FAILURE_OUTCOME_DESC: "§YТребования:§! §C§RКоммунисты§! выиграли гражданскую войну в Китае§! И §CНаступление на Юньнань провалилось§!\n"
 RULE_OPTION_HISTORICAL_YAN_FAILURE: "@YAN Держать курс"
 RULE_OPTION_HISTORICAL_YAN_FAILURE_DESC: "После неудачного прорыва через Юньнань командование армией переходит к Лю Юаньлину. Мечта об освобождении Китая живет!\n§YЭто исторический путь.§"
 RULE_OPTION_YAN_SHAN_STATE: "£GFX_game_rule_flags_YAN_Shan  Государство Шан"
 RULE_OPTION_YAN_SHAN_STATE_DESC: "Потерпев неудачу в прорыве через Юньнань, генерал Ли Ми отделяется от Тайваня и сосредоточивается на создании шаньско-китайского государства под руководством Гоминьдана."
 
 #TUR game rules
 TUR_KURDISH_QUESTION: "@TUR £GFX_game_rule_flags_KRD   [1950-ые] Курдский вопрос в Турции"
 RULE_OPTION_MOUNTAIN_TURKS: "Горные турки"
 RULE_OPTION_MOUNTAIN_TURKS_DESC: "Турецкое правительство не желает мириться с самостоятельной курдской идентичностью, подавляя ее.\n§YЭто исторический путь.§"
 RULE_OPTION_KURDISH_TOLERATION: "Терпимость к курдам"
 RULE_OPTION_KURDISH_TOLERATION_DESC: "Турецкое правительство будет работать с местными лидерами и начнет терпимо относиться к курдской идентичности."
 TUR_1950_ELECTIONS: "@TUR Всеобщие выборы 1950 года"
 RULE_OPTION_CHP_1950: "Победа РНП"
 RULE_OPTION_CHP_1950_DESC: "Исмет Инёню и РНП сохранят лидерство. В течение этого срока они утвердят кемализм и сосредоточатся на развитии промышленности."
 RULE_OPTION_DP_1950: "Победа ДП"
 RULE_OPTION_DP_1950_DESC: "Аднан Мендерес и ДП победят на выборах. В течение этого срока они начнут отменять прежнюю политику РНП и сосредоточатся на развитии сельских районов. \n§YЭто исторический путь.§"
 TUR_1954_ELECTIONS: "@TUR Всеобщие выборы 1954 года"
 RULE_OPTION_CHP_1954: "Победа РНП"
 RULE_OPTION_CHP_1954_DESC: "Исмет Инёню и РНП победят на выборах. В течение этого срока они будут заниматься вопросами промышленного развития."
 RULE_OPTION_DP_1954: "Победа ДП"
 RULE_OPTION_DP_1954_DESC: "Аднан Мендерес и ДП победят на выборах. В течение этого срока они погрузятся в автократию. \n§YЭто исторический путь.§"
 TUR_1957_ELECTIONS: "@TUR Всеобщие выборы 1957 года"
 RULE_OPTION_CHP_1957: "Победа РНП"
 RULE_OPTION_CHP_1957_DESC: "Исмет Инёню и РНП победят на выборах. В течение этого срока они сосредоточатся на решении социальных и экономических вопросов."
 RULE_OPTION_DP_1957: "Победа ДП"
 RULE_OPTION_DP_1957_DESC: "Аднан Мендерес и ДП победят на выборах. В течение этого срока они погрузятся в автократию. \n§YЭто исторический путь.§"
 TUR_ISRAELI_RELATIONS: "@TUR @ISR [1950-ые] Отношения с Израилем"
 TUR_ISRAELI_RELATIONS_DESC: "Турция - первая страна с мусульманским большинством, признавшая Израиль. Однако отношения с Израилем станут проблемой для других арабских стран, как и наоборот."
 RULE_OPTION_ESTABLISH_LEGATION: "Учреждение посольства"
 RULE_OPTION_ESTABLISH_LEGATION_DESC: "Турция будет поддерживать и развивать отношения с Израилем, сохраняя теплые отношения с арабскими странами.\n§YЭто исторический путь.§"
 RULE_OPTION_RESCIND_RECOGNITION: "Отмена признания"
 RULE_OPTION_RESCIND_RECOGNITION_DESC: "Турция резко разорвет связи с Израилем, настроившись против него и укрепив отношения с арабскими странами."
 TUR_UAR_RELATIONS: "@TUR £GFX_game_rule_flags_UAR   [1950-ые] Турецкая реакция на ОАР"
 TUR_UAR_RELATIONS_DESC: "§YТребования:§! §CОбъединенная арабская республика.§!"
 RULE_OPTION_RECOGNIZE_UAR: "Признание ОАР"
 RULE_OPTION_RECOGNIZE_UAR_DESC: "Турция признает ОАР, что снимет возможную напряженность"
 RULE_OPTION_CLASH_UAR: "Принуждение к смене режима"
 RULE_OPTION_CLASH_UAR_DESC: "Турция будет оказывать давление на смену режима в Сирии."
 RULE_OPTION_ANNEX_NORTH_SYRIA: "Аннексия Северной Сирии"
 RULE_OPTION_ANNEX_NORTH_SYRIA_DESC: "Турция вторгнется в северные районы Сирии и аннексирует их в одностороннем порядке."
 TUR_JOIN_NATO_AI: "@TUR £GFX_game_rule_flags_NATO  Членство Турции в НАТО"
 RULE_OPTION_TUR_JOIN_NATO_SUCCESS: "Турция становится членом НАТО"
 RULE_OPTION_TUR_JOIN_NATO_SUCCESS_DESC: "После приглашения Турция вступит в Организацию Североатлантического договора в качестве члена альянса."
 RULE_OPTION_TUR_JOIN_NATO_FAILURE: "Турция не вступает НАТО"
 RULE_OPTION_TUR_JOIN_NATO_FAILURE_DESC: "Получив приглашение в Организацию Североатлантического договора, Турция откажется и останется вне этой организации, хотя, возможно, сохранит западную ориентацию."
 
 #SPR game rules
 SPR_POLITICAL_REFORMS: "@SPR [1950-ые] Политическое руководство"
 RULE_OPTION_SPR_POLITICS_LIBERAL: "Либеральные реформы"
 RULE_OPTION_SPR_POLITICS_LIBERAL_DESC: "Испания свернет фалангистскую политику и продолжит возрождать связи с западными демократиями, заручившись их сотрудничеством. \n§YЭто исторический путь.§"
 RULE_OPTION_SPR_POLITICS_FALANGE: "Назад к традициям"
 RULE_OPTION_SPR_POLITICS_FALANGE_DESC: "Исконные традиционалистские и фалангистские принципы франкистского движения будут сохранены и в современную эпоху."
 SPR_RETURN_OF_MOROCCO: "@SPR @MOR [1950-ые] Возвращение испанского Морокко"
 RULE_OPTION_RETURN_RIF: "Риф возвращен"
 RULE_OPTION_RETURN_RIF_DESC: "Испания согласится вернуть Риф, но откажется возвращать что-либо еще."
 RULE_OPTION_RETURN_IFNI: "Ифни и Риф возвращены"
 RULE_OPTION_RETURN_IFNI_DESC: "Испания согласится вернуть Риф и Ифни, но откажется возвращать все остальное."
 RULE_OPTION_RETURN_TARFAYA: "Риф и Тарфая возвращены"
 RULE_OPTION_RETURN_TARFAYA_DESC: "Испания согласится вернуть Риф и Тарфаю, но откажется возвращать все остальное."
 RULE_OPTION_RETURN_BOTH: "Все территории возвращены"
 RULE_OPTION_RETURN_BOTH_DESC: "Испания согласится вернуть все свои владения в Марокко, что положит конец испанскому владычеству.\n§YЭто исторический путь.§"
 
 #CHI game rules
 CHI_CHINESE_CIVIL_WAR: "@CHI @PRC [1950-ые] Гражданская война в Китае"
 CHI_CHINESE_CIVIL_WAR_DESC: "После поражения Японской империи возобновился и продолжается конфликт между центральным правительством во главе с Гоминьданом и Народно-освободительной армией коммунистов. Победитель в этой войне определит будущее всей Азии и всего мира."
 RULE_OPTION_CCW_KMT_VICTORY: "@CHI Победа Гоминьдана"
 RULE_OPTION_CCW_KMT_VICTORY_DESC: "Центральное правительство во главе с Гоминьданом переломит ход событий и нанесет поражение коммунистам. Советский Союз вмешается, чтобы спасти коммунистов и предотвратить их полное уничтожение, создав непростой мир, простирающийся от Цинхая до Пекина."
 RULE_OPTION_CCW_CCP_VICTORY: "@PRC Победа Коммунистической партии"
 RULE_OPTION_CCW_CCP_VICTORY_DESC: "Народно-освободительная армия разгромит центральное правительство, и будет провозглашена Китайская Народная Республика. Остатки Гоминьдана отступят на Тайвань и в Бирму.\n§YЭто исторический путь.§"
 #(defeated)
 CHI_DEFEAT_AFTERMATH: "@CHI [1950-ые] Последствия поражения"
 CHI_DEFEAT_AFTERMATH_DESC: "§YТребования:§! §C§RКоммунисты§! победили в гражданской войне в Китае§!\nМатерик оказался под властью коммунистов. Острота ситуации требует немедленного внимания."
 RULE_OPTION_CHI_TEMPORARY_PROVISIONS: "@CHI Временные положения"
 RULE_OPTION_CHI_TEMPORARY_PROVISIONS_DESC: "После потери материка правительство продлит срок действия военного положения, фактически установив на Тайване диктатуру. \n§YЭто исторический путь.§"
 RULE_OPTION_CHI_ABANDON_HOPE: "£GFX_game_rule_flags_ROC_formosa   Оставить надежду"
 RULE_OPTION_CHI_ABANDON_HOPE_DESC: "С потерей материка тайваньский народ восстанет и свергнет власть Гоминьдана, фактически провозгласив независимость от Китая."
 CHI_BATTLE_OF_HAINAN: "@CHI @PRC [1950-ые] Битва за Хайнань"
 CHI_BATTLE_OF_HAINAN_DESC: "§YТребования:§! §C§RКоммунисты§! победили в гражданской войне в Китае§!\nГоминьдан потерял материк; НОАК начала морскую операцию на Хайнане."
 RULE_OPTION_CHI_KMT_HAINAN: "@CHI Гоминьдан удерживает Хайнань"
 RULE_OPTION_CHI_KMT_HAINAN_DESC: "Несмотря на превосходство коммунистов, силы Гоминьдана будут удерживать Хайнань, фактически останавливая продвижение НОАК. Хайнань будет нелегким рубежом для Гоминьдана."
 RULE_OPTION_CHI_CCP_HAINAN: "@PRC НОАК захватывает Хайнань"
 RULE_OPTION_CHI_CCP_HAINAN_DESC: "Народно-освободительная армия успешно займет Хайнань и вытеснит гоминьдановцев к морю. Тайвань - последнее убежище для Гоминьдана. \n§YЭто исторический путь.§"
 CHI_SUN_LIREN_COUP: "@CHI [1950-ые] Переворот Сунь Лижэня"
 CHI_SUN_LIREN_COUP_DESC: "§YТребования:§! §CГоминьдановская диктатура на Тайване§!\nУ Чан Кайши развилась паранойя; возник заговор о военном перевороте."
 RULE_OPTION_CHI_COUP_FAILS: "Провал переворота"
 RULE_OPTION_CHI_COUP_FAILS_DESC: "Попытка Сунь Лижэня свергнуть Чана Кайши провалилась, и его диктатура будет продолжаться. \n§YЭто исторический путь.§"
 RULE_OPTION_CHI_COUP_SUCCEEDS: "Успех переворота"
 RULE_OPTION_CHI_COUP_SUCCEEDS_DESC: "Сунь Лижэнь успешно свергнет Чана Кайши и начнет постепенную демократизацию при поддержке Америки."
 CHI_TAIWAN_ELECTIONS_1954: "£GFX_game_rule_flags_ROC_formosa   Всеобщие выборы 1954 года на Тайване"
 CHI_TAIWAN_ELECTIONS_1954_DESC: "§YТребования:§! §CТайвань независим§!\n"
 RULE_OPTION_CHI_DPP_1954: "Победа демократической прогрессивной партии"
 RULE_OPTION_CHI_DPP_1954_DESC: "На выборах победят демократы-прогрессисты. В течение этого срока они будут реализовывать либеральную программу."
 RULE_OPTION_CHI_TCP_1954: "Победа Коммунистической партии Тайваня"
 RULE_OPTION_CHI_TCP_1954_DESC: "На выборах победят тайваньские коммунисты. В течение этого срока они установят связи с азиатскими коммунистами, несвязанными с Мао."
 RULE_OPTION_CHI_DEMSOC_1954: "Победа демократических социалистов"
 RULE_OPTION_CHI_DEMSOC_1954_DESC: "На выборах победят демократические социалисты. В течение этого срока они будут проводить социал-демократическую политику."
 CHI_TAIWAN_ELECTIONS_1958: "£GFX_game_rule_flags_ROC_formosa   Всеобщие выборы 1958 года на Тайване"
 CHI_TAIWAN_ELECTIONS_1958_DESC: "§YТребования:§! §CТайвань независим§!\n"
 RULE_OPTION_CHI_DPP_1958: "Победа демократической прогрессивной партии"
 RULE_OPTION_CHI_DPP_1958_DESC: "Демократические прогрессисты одержат победу на выборах. В течение этого срока они будут контактировать с другими региональными державами."
 RULE_OPTION_CHI_TCP_1958: "Победа Коммунистической партии Тайваня"
 RULE_OPTION_CHI_TCP_1958_DESC: "На выборах победят тайваньские коммунисты. В течение этого срока они войдут в СЭВ, отдалившись от Мао."
 RULE_OPTION_CHI_DEMSOC_1958: "Победа демократических социалистов"
 RULE_OPTION_CHI_DEMSOC_1958_DESC: "На выборах победят демократические социалисты. В течение этого срока они будут проводить социал-демократическую политику."
 #(victor)
 CHI_KUOMINTANG_REFORM: "@CHI [1950-ые] Реформа Гоминьдана"
 CHI_KUOMINTANG_REFORM_DESC: "§YТребования:§! §C§BГоминьдан§! победил в гражданской войне в Китае§!\nГоминьдан вытеснил коммунистов, однако политический курс начинается только сейчас. Самое важное, что партийное направление требует пересмотра."
 RULE_OPTION_CHI_KMT_REFORM: "Начало реформ"
 RULE_OPTION_CHI_KMT_REFORM_DESC: "Гоминьдановское руководство проведет масштабные политические и социальные реформы."
 RULE_OPTION_CHI_KMT_STATUS_QUO: "Преобладание статус-кво"
 RULE_OPTION_CHI_KMT_STATUS_QUO_DESC: "Руководство Гоминьдана сохранит нынешние принципы."
 CHI_NEW_PRESIDENT: "@CHI [1950-ые] Новый президент Китая"
 CHI_NEW_PRESIDENT_DESC: "§YТребования:§! §C§BГоминьдан§! победил в гражданской войне в Китае§!\nВ связи с проведением реформ будет создан Центральный комитет по реформам, который назначит следующего президента."
 RULE_OPTION_CHI_KMT_LI_ZONGREN: "Ли Цзунжэнь"
 RULE_OPTION_CHI_KMT_LI_ZONGREN_DESC: "Ли Цзунжэнь укрепит свое лидерство и будет назначен президентом. Он положит начало постепенной демократизации в Китае."
 RULE_OPTION_CHI_KMT_JIANG_JIESHI: "Чан Кайши"
 RULE_OPTION_CHI_KMT_JIANG_JIESHI_DESC: "Чан Кайши вернется к власти, так как будет вновь назначен президентом, продолжая свое длительное авторитарное правление"
 RULE_OPTION_CHI_KMT_SUN_LIREN: "Сунь Лижэнь"
 RULE_OPTION_CHI_KMT_SUN_LIREN_DESC: "Сунь Лижэнь будет назначен президентом и начнет более тесно сотрудничать с американцами."
 CHI_RETURN_TO_TIBET: "@CHI @TIB [1950-ые] Проблема Тибета"
 CHI_RETURN_TO_TIBET_DESC: "§YТребования:§! §C§BГоминьдан§! победил в гражданской войне в Китае§!\nПосле стабилизации ситуации в Китае неизбежно встанет вопрос о том, что будет с Тибетом."
 RULE_OPTION_CHI_STAGE_COUP: "@CHI @TIB Инсценировка переворота в Тибете"
 RULE_OPTION_CHI_STAGE_COUP_DESC: "Китай спровоцирует переворот, чтобы установить Панчен-ламу в качестве тибетского лидера и превратить Тибет в автономный регион в случае успеха."
 RULE_OPTION_CHI_LEAVE_TIBET: "@TIB Покинуть Тибет"
 RULE_OPTION_CHI_LEAVE_TIBET_DESC: "Китай признает независимость Тибета, положив конец спорам о суверенитете Тибета. Это позволит установить более теплые отношения с Индией."
 RULE_OPTION_CHI_INVADE_TIBET: "@CHI Вторжение в Тибет"
 RULE_OPTION_CHI_INVADE_TIBET_DESC: "Китай вторгнется в Тибет, чтобы восстановить китайский контроль; после этого будет проведена чистка традиционной аристократии."
 CHI_STANCE_ON_VIETNAM: "@CHI @VIE [1950-ые] Позиция Китая по отношению к Вьетнаму"
 CHI_STANCE_ON_VIETNAM_DESC: "§YТребования:§! §C§BГоминьдан§! победил в гражданской войне в Китае§!\nПосле победы китайского Гоминьдана над коммунистами китайское правительство займет позицию против коммунизма за рубежом, в которой Вьетнам не является исключением."
 RULE_OPTION_CHI_SUPPORT_FRENCH: "Поддержать Францию"
 RULE_OPTION_CHI_SUPPORT_FRENCH_DESC: "Китайское правительство будет напрямую поддерживать французов в борьбе с Вьетмином, применяя более решительный подход."
 RULE_OPTION_CHI_SUPPORT_VNQDD: "Поддержка VNQDD"
 RULE_OPTION_CHI_SUPPORT_VNQDD_DESC: "Китайское правительство будет поддерживать вьетнамский Гоминьдан как на севере, так и на юге страны, сохраняя при этом низкий уровень участия."
 
 #PRC game rules (victor)
 PRC_HUNDRED_FLOWERS_CAMPAIGN: "@PRC [1950-ые] Окончание кампании ста цветов"
 PRC_HUNDRED_FLOWERS_CAMPAIGN_DESC: "§YТребования:§! §C§RКоммунисты§! победили в гражданской войне в Китае§!\nРеализованный Мао Цзэдуном проект по выслушиванию критики вышел из-под контроля. В условиях нарастающей оппозиции партия вынуждена принимать меры."
 RULE_OPTION_PRC_RECTIFICATION: "Неудача - устранение"
 RULE_OPTION_PRC_RECTIFICATION_DESC: "Китай восстановит порядок, начав антиправую кампанию и вернувшись к статус-кво. \n§YЭто исторический путь.§"
 RULE_OPTION_PRC_DEMOCRATIZATION: "Успех - дальнейшее реформирование"
 RULE_OPTION_PRC_DEMOCRATIZATION_DESC: "Оппозиции удастся сместить Мао и начать предоставлять больше свобод. \nЭто может позволить объединиться с режимом на Тайване."
 PRC_TIBETAN_UPRISING: "@PRC @TIB [1950-ые] Тибетское восстание"
 PRC_TIBETAN_UPRISING_DESC: "§YТребования:§! §C§RКоммунисты§! победили в гражданской войне в Китае§!\nНесмотря на освобождение вместе с остальной частью Китая, в Тибете происходит восстание против коммунистического правления."
 RULE_OPTION_PRC_SUPPRESS_UPRISING: "@PRC Подавление восстания"
 RULE_OPTION_PRC_SUPPRESS_UPRISING_DESC: "Китай подавит восстание, изгнав при этом Далай-ламу.\n§YЭто исторический путь.§"
 RULE_OPTION_PRC_LEAVE_TIBET: "@TIB Покинуть Тибет"
 RULE_OPTION_PRC_LEAVE_TIBET_DESC: "Китай уступит восстанию и восстановит независимость Тибета."
 PRC_MAO_AND_LIU: "@PRC [1960-ые] Мао и Лю"
 PRC_MAO_AND_LIU_DESC: "После провала "Большого скачка" Мао вынужден уйти на второстепенную должность, и теперь во главе страны стоит Лю Шаоци. Но Мао планирует вернуться, и вопрос в том, удастся ли ему осуществить задуманное."
 RULE_OPTION_PRC_MAO_RETURNS: "Мао превзошел Лю"
 RULE_OPTION_PRC_MAO_RETURNS_DESC: "Мао Цзэдун вернется на руководящую должность. Это позволит Мао начать "культурную революцию" и впоследствии очистить страну от всех оппозиционеров.. \n§YЭто исторический путь.§"
 RULE_OPTION_PRC_MAO_RETIRES: "Лю превзошел Мао"
 RULE_OPTION_PRC_MAO_RETIRES_DESC: "Лю Шаоци вынудит Мао уйти на пенсию, прекратив его участие в жизни партии. Позднее председатель Лю начнет "Пекинскую весну", постепенно либерализуя обстановку.."
 PRC_SINO_INDIAN_CONFLICT: "@PRC @RAJ [1960-ые] Китайско-индийский конфликт"
 PRC_SINO_INDIAN_CONFLICT_DESC: "В условиях обострения отношений между Китаем и Индией конфликт назревает, но неизбежен ли он?"
 RULE_OPTION_PRC_INVADE_AKSAI_CHIN: "Вторжение в Аксайчин"
 RULE_OPTION_PRC_INVADE_AKSAI_CHIN_DESC: "Между Китаем и Индией произойдет серия пограничных войн. Эта война закончится китайской оккупацией и аннексией Аксайчина. \n§YЭто исторический путь.§"
 RULE_OPTION_PRC_STRIKE_A_THAW: "Урегулирование конфликта"
 RULE_OPTION_PRC_STRIKE_A_THAW_DESC: "Пограничный конфликт не будет обостряться, и он будет урегулирован с помощью договоров."
 PRC_SINO_SOVIET_CONFLICT: "@PRC @SOV [1960-ые] Китайско-советский конфликтt"
 PRC_SINO_SOVIET_CONFLICT_DESC: "Небольшой остров, называемый по-русски Даманский, а по-китайски Чжэньбао, является источником конфликта между Китаем и Советской Россией. Поскольку отношения между Китаем и Советским Союзом испортились, будущее острова остается неопределенным."
 RULE_OPTION_PRC_SETTLE_A_DEAL: "Урегулировать конфликт"
 RULE_OPTION_PRC_SETTLE_A_DEAL_DESC: "Конфликт будет урегулирован без кровопролития."
 RULE_OPTION_PRC_CEASEFIRE: "Конфликт заморожен"
 RULE_OPTION_PRC_CEASEFIRE_DESC: "Конфликт не будет длиться долго, но и твердого решения не будет. \n§YЭто исторический путь.§" 
 
 #PRC game rules (defeated)
 PRC_MANCHURIA_POST_STALIN: "£GFX_game_rule_flags_PRC_SOV_communism   [1950-ые] Пост-сталинская ориентация"
 PRC_MANCHURIA_POST_STALIN_DESC: "§YТребования:§! §C§BГоминьдан§! победил в гражданской войне в Китае§!\nВ условиях, когда китайские коммунисты находились под влиянием курса Сталина, Мао был вынужден уйти в отставку в пользу Ван Мина. Но поскольку Сталина больше нет, курс китайского руководства так же неопределен, как и остальных стран Восточного блока, присоединившихся к СССР."
 RULE_OPTION_PRC_WANG_MING_STAYS: "Ван Мин остается"
 RULE_OPTION_PRC_WANG_MING_STAYS_DESC: "Коммунистическая партия Китая будет придерживаться ревизионизма и поддерживать связи с Советским Союзом, очищаясь от Мао и его сторонников."
 RULE_OPTION_PRC_MAO_RETURNS_MANCHU: "Возвращение Мао Цзэдуна"
 RULE_OPTION_PRC_MAO_RETURNS_MANCHU_DESC: "Коммунистическая партия Китая откажется следовать ревизионизму, что позволит Мао Цзэдуну во второй раз отстранить Ван Мина от власти."
 PRC_MANCHURIA_POST_KHRUSHCHEV: "£GFX_game_rule_flags_PRC_SOV_communism   [1960-ые] Пост-Хрущевская ориентация"
 PRC_MANCHURIA_POST_KHRUSHCHEV_DESC: "Народное правительство держится, но в связи с очередной сменой советского руководства китайской компартии приходится снова выбирать новый курс."
 RULE_OPTION_PRC_LIBERAL_COMMUNISM: "Китайская весна"
 RULE_OPTION_PRC_LIBERAL_COMMUNISM_DESC: "Народное правительство возьмет либертарный курс под руководством Кай Фэна. Китайские коммунисты продолжат придерживаться советской линии."
 RULE_OPTION_PRC_ROLL_BACK_STATUS_QUO: "Свернуть либерализацию"
 RULE_OPTION_PRC_ROLL_BACK_STATUS_QUO_DESC: "Китайские усилия по либерализации страны будут свернуты, а поддерживающие их деятели - вычищены."
 
