 RULE_OPTION_NGA_INDEPENDENCE_AS_PLANNED: "Независимость в соответствии с планом"
 RULE_OPTION_NGA_INDEPENDENCE_AS_PLANNED_DESC: "§YТребования:§! §CКонституция Литтлтона действует§!\nНигерия будет достаточно стабильной для получения независимости. Будет предоставлена достаточная автономия по мере того, как колониальные бюрократы будут постепенно заменяться местными представителями."
 
