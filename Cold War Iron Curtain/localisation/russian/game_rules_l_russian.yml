 #CUB game rules
 CUB_1958_ELECTIONS_RULE: "@CUB Президентские выборы 1958 года"
 RULE_OPTION_CUB_AGUERO_1958: "Победа Агуэро"
 RULE_OPTION_CUB_AGUERO_1958_DESC: "Президентом будет избран Андрес Агуэро. Он создаст контрпарамилитарные формирования и обратится за американской поддержкой для разгрома Движения 26 июля."
 RULE_OPTION_CUB_STERLING_1958: "Победа Стерлинга"
 RULE_OPTION_CUB_STERLING_1958_DESC: "Карлос Стерлинг будет избран президентом. Он восстановит политические свободы и будет добиваться американской поддержки для заключения мира с Движением 26 июля."
 RULE_OPTION_CUB_REVOLUTION: "Кубинская революция"
 RULE_OPTION_CUB_REVOLUTION_DESC: "Фидель Кастро и Движение 26 июля свергнут режим Батисты.\n§YЭто исторический путь.§"
 
 #DOM game rules
 DOM_1957_ELECTIONS_RULE: "@DOM Президентские выборы 1957 года"
 RULE_OPTION_DOM_TRUJILLO_1957: "Победа Эктор Трухильо"
 RULE_OPTION_DOM_TRUJILLO_1957_DESC: "Президентом будет избран Эктор Трухильо, брат Рафаэля Трухильо. Семья Трухильо продолжит контролировать Доминиканскую Республику.\n§YЭто исторический путь.§"
 RULE_OPTION_DOM_BALAGUER_1957: "Победа Хоакина Балагуэра"
 RULE_OPTION_DOM_BALAGUER_1957_DESC: "Президентом будет избран Хоакин Балагуэр. Семья Трухильо будет отстранена от власти, а вместо нее будет установлен однопартийный режим."
 DOM_ANTIHAITIANISMO_RULE: "@DOM [1950-ые] Антигаитянство"
 RULE_OPTION_DOM_CONTINUE_ANTIHAITIANISMO: "Придерживаться курса"
 RULE_OPTION_DOM_CONTINUE_ANTIHAITIANISMO_DESC: "Антигаитянство продолжается, наряду с культурным подавлением гаитян и дипломатической напряженностью в отношениях с Гаити."
 RULE_OPTION_DOM_SLOW_DOWN_ANTIHAITIANISMO: "Замедление курса"
 RULE_OPTION_DOM_SLOW_DOWN_ANTIHAITIANISMO_DESC: "Антигаитянство будет замедлено; обеспечение культурной защиты гаитян с помощью государственного визита на Гаити."
 
 #ENG game rules
 ENG_1950_ELECTIONS: "@ENG Выборы 1950 года"
 RULE_OPTION_ENG_ATLEE_1950: "Клемент Эттли побеждает"
 RULE_OPTION_ENG_ATLEE_1950_DESC: "Клемент Эттли победит на выборах. В течение этого срока он сосредоточится на развитии военной промышленности.\n§YЭто исторический путь.§"
 RULE_OPTION_ENG_BEVAN_1950: "Победа Эньюрина Бивена"
 RULE_OPTION_ENG_BEVAN_1950_DESC: "Эньюрин Бивен победит на выборах. В течение этого срока он проведет значительные левые реформы, которые в конечном итоге приведут к внеочередным выборам."
 ENG_1959_ELECTIONS: "@ENG Выборы 1959 года"
 ENG_1959_ELECTIONS_DESC: ""
 RULE_OPTION_ENG_MACMILLAN_1959: "Гарольд Макмиллан победил"
 RULE_OPTION_ENG_MACMILLAN_1959_DESC: "Гарольд Макмиллан и Консервативная партия победит на выборах.\n§YЭто исторический путь.§"
 RULE_OPTION_ENG_GRIMOND_1959: "Джо Гримонд побеждает"
