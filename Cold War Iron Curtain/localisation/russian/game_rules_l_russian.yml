 JOR_KING_TALAL_QUESTION_DESC: ""
 RULE_OPTION_JOR_TALAL_ABDICATES: "Талал отрекается от престола"
 RULE_OPTION_JOR_TALAL_ABDICATES_DESC: "Король Талал будет вынужден отречься от престола, и королевство перейдет к его наследнику Хусейну. \n§YЭто исторический путь.§"
 RULE_OPTION_JOR_TALAL_STAYS: "Талал отстается на престоле"
 RULE_OPTION_JOR_TALAL_STAYS_DESC: "Король Талал продолжит правление, несмотря на свою болезнь. Он будет придерживаться либерального курса в политике Иордании."
 JOR_FREE_OFFICERS_COUP_AI: "@JOR [1950-ые] Военный переворот офицеров в Иордании"
 JOR_FREE_OFFICERS_COUP_AI_DESC: "§YТребования:§! §CТалал отрекается от престола§!\n"
 RULE_OPTION_JOR_FREE_OFFICERS_THWARTED: "Попытка переворота провалилась"
 RULE_OPTION_JOR_FREE_OFFICERS_THWARTED_DESC: "Прежде чем переворот успевает начаться всерьез, его лидеры подадут в отставку, а король Хусейн укрепляет свое правление над страной. \n§YЭто исторический путь.§"
 RULE_OPTION_JOR_FREE_OFFICERS_SUCCESS: "Иорданская революция"
 RULE_OPTION_JOR_FREE_OFFICERS_SUCCESS_DESC: "Король Хусейн игнорирует признаки готовящегося переворота, тем самым позволяя военным офицерам успешно свергнуть иорданскую монархию и установить республику."
 
