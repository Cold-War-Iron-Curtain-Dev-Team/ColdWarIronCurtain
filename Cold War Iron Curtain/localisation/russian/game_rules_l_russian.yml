 #USA game rules
 USA_STANCE_ON_VIETNAM: "@USA @VIE @VIN [1950-ые] Американская позиция по Вьетнаму"
 USA_STANCE_ON_VIETNAM_DESC: "Женевские соглашения требуют проведения референдума по объединению как в Северном, так и в Южном Вьетнаме. Однако не все поддерживают референдум". 
 RULE_OPTION_USA_ALLOW_FREE_ELECTIONS: "@USA @VIE @VIN Разрешить свободные выборы"
 RULE_OPTION_USA_ALLOW_FREE_ELECTIONS_DESC: "§YРаботает:§! §РНОТ§! §Южный Вьетнам наложил вето на референдум§!\nАмерика окажет давление на правительство Южного Вьетнама, чтобы оно провело референдум, который будет успешным и позволит §Вьетнаму объединиться§!".
 RULE_OPTION_USA_ALLOW_RIGGED_ELECTIONS: "@USA @VIE Разрешить фальсификацию выборов"
 RULE_OPTION_USA_ALLOW_RIGGED_ELECTIONS_DESC: "§YРаботает:§! §РНОТ§! §Южный Вьетнам наложил вето на референдум§!\nАмерика будет давить на правительство Южного Вьетнама, чтобы оно провело референдум, который провалится из-за фальсификации выборов."
 RULE_OPTION_USA_BLOCK_ELECTIONS: "@USA @VIE Блокировать выборы"
 RULE_OPTION_USA_BLOCK_ELECTIONS_DESC: "Америка поддержит отказ Южного Вьетнама от проведения референдума; и начнет операцию "Переход к свободе". \n§YЭто исторический путь.§!"

 #SOV game rules
 SOV_FOREIGN_AI_BEHAVIOR: "@SOV [1950-ые] Советская внешняя политика"
 RULE_OPTION_FOREIGN_HISTORICAL_SOV_AI_DESC: "Советская внешняя политика будет следовать принципу реальной политики и избегать открытой конфронтации.\n§YЭто исторический путь.§"
