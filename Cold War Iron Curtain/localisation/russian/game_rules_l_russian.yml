 RULE_OPTION_INTERNAL_BERIA_SOV_AI: "Берия сменяет Сталина"
 RULE_OPTION_INTERNAL_BERIA_SOV_AI_DESC: "К власти придет Лаврентий Берия, а Георгий Маленков станет его подставным лицом."
 RULE_OPTION_INTERNAL_STALIN_SOV_AI: "Сталин выживает"
