 RULE_OPTION_SWE_COALITION_VICTORY_1952_DESC: "Гражданская коалиция победит на выборах. В течение этого срока они будут проводить либеральную политику."
 SWE_1956_ELECTIONS: "@SWE 1956 Elections"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1956: "Победа SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1956_DESC: "Социал-демократы победит на выборах. \n§YЭто исторический путь.§"
 RULE_OPTION_SWE_COALITION_VICTORY_1956: "Победа Коалиции"
 RULE_OPTION_SWE_COALITION_VICTORY_1956_DESC: "Гражданская коалиция победит на выборах."
 SWE_1958_ELECTIONS: "@SWE 1958 Elections"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1958: "SAP Победа"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1958_DESC: "Социал-демократы победит на выборах. \n§YЭто исторический путь.§"
 RULE_OPTION_SWE_COALITION_VICTORY_1958: "Победа Коалиции"
 RULE_OPTION_SWE_COALITION_VICTORY_1958_DESC: "Гражданская коалиция победит на выборах."
 SWE_NUCLEAR_QUESTION_50: "@SWE [1950-ые] Ядерный вопрос"
 RULE_OPTION_SWE_SWEDISH_NUKES: "Шведская ядерная программа"
 RULE_OPTION_SWE_SWEDISH_NUKES_DESC: "Шведская ядерная программа будет продолжена. \n§YЭто исторический путь.§"
 RULE_OPTION_SWE_AMERICAN_NUKES: "Американская поддержка ядерной программы"
 RULE_OPTION_SWE_AMERICAN_NUKES_DESC: "Шведская ядерная программа будет пользоваться американской поддержкой и согласованностью."
 RULE_OPTION_SWE_TERMINATE_NUCLEAR_PROGRAM: "Конец ядерной программы"
 RULE_OPTION_SWE_TERMINATE_NUCLEAR_PROGRAM_DESC: "Шведская ядерная программа будет прекращена. Швеция выступит за нераспространение ядерного вооружения."
 
 #FIN game rules
 FIN_1950_ELECTIONS: "@FIN Выборы 1950 года"
 RULE_OPTION_FIN_PAASIKIVI_1950: "Паасикиви избран"
 RULE_OPTION_FIN_PAASIKIVI_1950_DESC: "Юхо Кусти Паасикиви победит на выборах. \n§YЭто исторический путь.§"
 RULE_OPTION_FIN_PEKKALA_KUUSINEN: "Пеккала избран - преемник Куусинен"
 RULE_OPTION_FIN_PEKKALA_KUUSINEN_DESC: "Мауно Пеккала победит на выборах. После смерти его сменит Куусинен, который будет сотрудничать с Советами."
 RULE_OPTION_FIN_PEKKALA_KILPI: "Пеккала избран - Килпи Куусинен"
 RULE_OPTION_FIN_PEKKALA_KILPI_DESC: "Мауно Пеккала победит на выборах. Килпи сменит его после смерти."
 FIN_1956_ELECTIONS: "@FIN Выборы 1956 года"
 RULE_OPTION_FIN_KEKKONEN_1956: "Кекконен избран"
 RULE_OPTION_FIN_KEKKONEN_1956_DESC: "Урхо Кекконен победит на выборах. В течение этого срока он будет заниматься вопросами экономического развития. \n§YЭто исторический путь.§"
 RULE_OPTION_FIN_FAGERHOLM_1956: "Фагерхольм избран" 
 RULE_OPTION_FIN_FAGERHOLM_1956_DESC: "Карл-Август Фагерхольм победит на выборах. В течение этого срока он сосредоточится на политической атмосфере, в основном прозападной."
 RULE_OPTION_FIN_PAASIKIVI_KUUSINEN: "Паасикиви избран - преемник Куусинен"
 RULE_OPTION_FIN_PAASIKIVI_KUUSINEN_DESC: "§YТребования:§! Куусинен выбран преемником Пеккалой\nЮхо Кусти Паасикиви победит на выборах. После смерти его сменит Куусинен, который будет придерживаться левого курса."
 RULE_OPTION_FIN_PAASIKIVI_KEKKONEN: "Паасикиви избран - преемник Кекконен"
 RULE_OPTION_FIN_PAASIKIVI_KEKKONEN_DESC: "Юхо Кусти Паасикиви победит на выборах. После смерти его сменит Кекконен, который сосредоточится на вопросах экономического развития."
 FIN_RETURN_OF_PORKKALA: "@FIN @SOV [1950-ые] Возвращение базы Порккала"
 RULE_OPTION_FIN_PORKKALA_RETURNED: "@FIN Порккала возвращена" 
 RULE_OPTION_FIN_PORKKALA_RETURNED_DESC: "Советский Союз передаст базу Порккала Финляндии. \n§YЭто исторический путь.§"
 RULE_OPTION_FIN_PORKKALA_KEPT: "@SOV Советы сохраняют за собой базу Порккала"
 RULE_OPTION_FIN_PORKKALA_KEPT_DESC: "Советский Союз сохранит базу Порккала."
 
 #ETR game rules
 ETR_GOVERNANCE: "@SIK [1950-ые] Курс Восточного Туркестана"
 ETR_GOVERNANCE_DESC: "Вторая Восточно-Туркестанская республика существует с момента возобновления гражданской войны в Китае, но пока стороны решают свои судьбы, Восточный Туркестан тоже определяют свою дальнейшую судьбу."
 RULE_OPTION_ETR_JOIN_PRC: "@PRC Присоединение к Китайской Народной Республике"
 RULE_OPTION_ETR_JOIN_PRC_DESC: "По мере продвижения коммунистов по Китаю уйгурское правительство будет стремиться присоединиться к Китайской Народной Республике. \n§YЭто исторический путь.§"
 RULE_OPTION_ETR_COMMUNIST_INDEPENDENCE: "@SIK Независимый коммунизм"
 RULE_OPTION_ETR_COMMUNIST_INDEPENDENCE_DESC: "Ахметжан Касыми сохранит свою власть и независимость Восточного Туркестана."
 RULE_OPTION_ETR_KMT_YULBARS: "@CHI Юлбарс-хан берет власть в свои руки"
 RULE_OPTION_ETR_KMT_YULBARS_DESC: "Юлбарс-хан захватит власть в стране. С приходом к власти в Китае коммунистов Юлбарс превратит Синьцзян в республиканское государство."
 RULE_OPTION_ETR_KMT_REVCOM: "@CHI Руководство Революционного комитета"
 RULE_OPTION_ETR_KMT_REVCOM_DESC: "К власти придет Революционный комитет китайского Гоминьдана. Как левое крыло Гоминьдана, они будут отстаивать независимость от компартии, но и симпатий к правому крылу Гоминьдана у них не будет."
 RULE_OPTION_ETR_ISLAMIST: "@SAU Исламисты приходят к власти"
 RULE_OPTION_ETR_ISLAMIST_DESC: "Элихан Тор возьмет на себя руководство страной. Он будет проводить в Восточном Туркестане исламистскую политику с законами шариата."
 
 #MON game rules
 MON_SINO_MONGOLIAN_NEGOTIATIONS: "@MON @PRC [1950-ые] Китайско-монгольские переговоры"
 MON_SINO_MONGOLIAN_NEGOTIATIONS_DESC: "Когда две соседние страны находятся под властью компартий, то рано или поздно должны состояться важные переговоры."
 RULE_OPTION_MON_JOIN_PRC: "@PRC Присоединение к Китайской Народной Республике"
 RULE_OPTION_MON_JOIN_PRC_DESC: "Because Mongolian request to join USSR is rejected; a same offer will be made to PRC; which will be accepted."
 RULE_OPTION_MON_INNER_MONGOLIA: "@MEN Встречное предложение Внутренней Монголии"
 RULE_OPTION_MON_INNER_MONGOLIA_DESC: "Вместо присоединения Монголии к Китаю Внешняя Монголия будет передана Монгольской республике."
 RULE_OPTION_MON_NEGOTIATIONS_FAIL: "@MON Провал переговоров"
 RULE_OPTION_MON_NEGOTIATIONS_FAIL_DESC: "Переговоры не дадут никаких результатов. Это приведет к тому, что монгольская политика будет направлена на защиту от Китая."
 MON_DESTALINIZATION_IN_MONGOLIA: "@MON [1950-ые] Десталинизация Монголии"
 MON_DESTALINIZATION_IN_MONGOLIA_DESC: "Смерть Сталина отразилась и на Монголии. Несмотря на уход Чойбалсана, влияние сталинизма в Монголии по-прежнему сильно, что является предметом дискуссий выбора нового политического курса."
 RULE_OPTION_MON_DAMBA_PURGED: "Дамба освобожден от должности"
 RULE_OPTION_MON_DAMBA_PURGED_DESC: "Юмжагийн Цэдэнбал освободит от должности Дашийна Дамбу. Цэдэнбал сохранит статус-кво с просоветской ориентацией.\n§YЭто исторический путь.§"
 RULE_OPTION_MON_TSEDENBAL_PURGED: "Цэдэнбал освобожден от должности"
 RULE_OPTION_MON_TSEDENBAL_PURGED_DESC: "Дашийн Дамба допросит  Юмжагийн Цэдэнбала. Дамба будет продвигать десталинизацию и обеспечивать геополитическую независимость между Советами и Китаем."
 
 #KOR/KPA game rules
 KOR_KOREAN_WAR: "@KOR @KPA Корейская война"
 KOR_KOREAN_WAR_DESC: "С одобрения Москвы и Пекина Северная Корея начала внезапное вторжение в Южную. Эта война склонит чашу весов в Азии, а значит, будет иметь такое же значение, как гражданские войны в Китае и Индокитае."
 RULE_OPTION_KOR_TOTAL_NORTH_VICTORY: "@KPA Полная победа Севера"
 RULE_OPTION_KOR_TOTAL_NORTH_VICTORY_DESC: "Северная Корея одержит верх над силами врага и разгромит Южную Корею, объединив полуостров. \nТакой исход позволит побежденным §RCCP§! §Yначать вторжение§! с победой §BKMT§!."
 RULE_OPTION_KOR_CEASEFIRE: "@KOR @KPA Прекращение огня"
 RULE_OPTION_KOR_CEASEFIRE_DESC: "Из-за неспособности участников установить господство, Корейская война закончится перемирием, лишь с небольшими изменениями границ.\n§YЭто исторический путь.§"
 RULE_OPTION_KOR_TOTAL_SOUTH_VICTORY: "@KOR Полная победа Юга"
 RULE_OPTION_KOR_TOTAL_SOUTH_VICTORY_DESC: "Северная Корея полностью провалит наступление, и их неудача позволит южным войскам двигаться без сопротивления, объединяя полуостров."
 KPA_AUGUST_FACTION_INCIDENT: "@KPA [1950-ые] Августовский инцидент"
 KPA_AUGUST_FACTION_INCIDENT_DESC: "Ким Ир Сен упорно продолжает следовать чучхе и сталинизму; небольшая группа заговорщиков готовит заговор с целью свержения Кима."
 RULE_OPTION_KPA_ARDUOUS_MARCH: "Второй тяжёлый марш"
 RULE_OPTION_KPA_ARDUOUS_MARCH_DESC: "Заговорщики потерпят неудачу. Ким укрепит свою власть в партии и государстве, избавлясь от советского и китайского влияния и их союзничества.\n§YЭто исторический путь.§"
 RULE_OPTION_KPA_KIM_PURGED: "Ким низложен"
 RULE_OPTION_KPA_KIM_PURGED_DESC: "Ким Ир Сен будет свергнут. К руководству КНДР придет Чо Чан Ик, который очистит страну от чучхе и его последователей и проведет десталинизацию."
 KOR_1952_ELECTIONS: "@KOR Выборы 1952 года"
 KOR_1952_ELECTIONS_DESC: "Поскольку воспоминания о войне еще свежи, выборы 1952 года, безусловно, будут важны для Кореи, так как война сделала их очень важными для выбора будущего курса Кореи."
 RULE_OPTION_KOR_RHEE_1952: "Ли Сын Ман"
 RULE_OPTION_KOR_RHEE_1952_DESC: "Ли Сын Ман будет переизбран на новый срок. В течение этого срока он продолжит свою проамериканскую диктатуру, следуя ильминизму и подавляя левые настроения.\n§YЭто исторический путь.§"
 RULE_OPTION_KOR_CHONG_1952: "Чо Бон Ам"
 RULE_OPTION_KOR_CHONG_1952_DESC: "На этот пост будет избран Чо Бон Ам. В течение этого срока он будет проводить более демократическую политику и прекратит подавление левых настроений.
 RULE_OPTION_KOR_YI_1952: "Йи Си Ен"
 RULE_OPTION_KOR_YI_1952_DESC: "На этот пост будет избран Ий Си Ен. В течение этого срока он будет придерживаться более традиционалистского курса, восстанавливая корейскую монархию."
 KOR_1956_ELECTIONS: "@KOR Выборы 1956 года"
 RULE_OPTION_KOR_RHEE_1956: "Ли Сын Ман"
 RULE_OPTION_KOR_RHEE_1956_DESC: "На этот пост будет избран Ли Сын Ман. В течение этого срока он будет использовать авторитарные методы, нанося ущерб демократии.\n§YЭто исторический путь.§"
 RULE_OPTION_KOR_CHONG_1956: "Чо Бон Ам"
 RULE_OPTION_KOR_CHONG_1956_DESC: "На этот пост будет избран Чо Бон Ам. В течение этого срока он введет в действие социальные программы и попытается договориться об §YОбъединении Кореи§!."
 RULE_OPTION_KOR_CHANG_1956: "Чан Мён"
 RULE_OPTION_KOR_CHANG_1956_DESC: "На этот пост будет избран Чан Мён. В течение этого срока он будет придерживаться умеренного и центристского курса, отходя от наследия Ли Сын Мана."
 
 #JAP game rules
 JAP_REESTABLISHMENT: "@JAP [1950-ые] Восстановление Японии"
 JAP_REESTABLISHMENT_DESC: "Американская оккупация завершена, но для Японии важен путь восстановления страны"
 RULE_OPTION_JAP_SAN_FRANCISCO: "£GFX_game_rule_flags_JAP   Сан-Францисский договор"
 RULE_OPTION_JAP_SAN_FRANCISCO_DESC: "Американская оккупация завершится подписанием японской делегацией Сан-Францисского договора; Будет обговорено восстановление независимости Японии, но с разоружением.\n§YЭто исторический путь.§"
 RULE_OPTION_JAP_EMPIRE: "£GFX_game_rule_flags_JAP_fascism   Возвращение Империи"
 RULE_OPTION_JAP_EMPIRE_DESC: "Националистический заговор приведет к перевороту. Старый режим вернется вместе с большинством проводимых им политик, однако конечным результатом станет установление демократии."
 JAP_1952_ELECTIONS: "£GFX_game_rule_flags_JAP   Выборы 1952 года"
 JAP_1952_ELECTIONS_DESC: "В связи с восстановлением независимости Японии состоятся первые свободные выборы со времен старого режима."
 RULE_OPTION_JAP_COMMUNIST_1952: "Победа JCP"
 RULE_OPTION_JAP_COMMUNIST_1952_DESC: "На выборах победит Японская коммунистическая партия. В течение этого срока они заставят императора Хирохито уйти в отставку в пользу Акихито, сохранив при этом конституционную монархию."
 RULE_OPTION_JAP_SOCIALIST_LEFT_1952: "Победа левых социалистов"
 RULE_OPTION_JAP_SOCIALIST_LEFT_1952_DESC: "Партия левых социалистов победит на выборах. В течение этого срока они будут налаживать связи с Советским Союзом."
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1952: "Победа правых социалистов"
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1952_DESC: "Партия правых социалистов победит на выборах. В течение этого срока они будут углублять связи с американцами."
 RULE_OPTION_JAP_LIBERAL_1952: "Победа либералов"
 RULE_OPTION_JAP_LIBERAL_1952_DESC: "Либеральная партия победит на выборах. В течение этого срока они будут реализовывать принципы своего лидера Сигэру Ёсида.\n§YЭто исторический путь.§"
 RULE_OPTION_JAP_KASHINTO_1952: "Победа Кашинто"
 RULE_OPTION_JAP_KASHINTO_1952_DESC: "Кашинто победит на выборах. В течение этого срока они начнут перевооружение."
 JAP_1953_ELECTIONS: "£GFX_game_rule_flags_JAP   Выборы 1953 года"
 RULE_OPTION_JAP_COMMUNIST_1953: "Победа JCP"
 RULE_OPTION_JAP_COMMUNIST_1953_DESC: "Японская коммунистическая партия победит на выборах. В течение этого срока они заставят императора Хирохито уйти в отставку в пользу Акихито, сохранив при этом конституционную монархию."
 RULE_OPTION_JAP_SOCIALIST_LEFT_1953: "Победа левых социалистов"
 RULE_OPTION_JAP_SOCIALIST_LEFT_1953_DESC: "Партия левых социалистов победит на выборах. В течение этого срока они будут налаживать связи с Советским Союзом."
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1953: "Победа правых социалистов"
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1953_DESC: "Партия правых социалистов победит на выборах. В течение этого срока они будут углублять связи с американцами."
 RULE_OPTION_JAP_LIBERAL_1953: "Победа либералов"
 RULE_OPTION_JAP_LIBERAL_1953_DESC: "Либеральная партия победит на выборах. В течение этого срока они будут реализовывать принципы своего лидера Сигэру Ёсида.\n§YЭто исторический путь.§"
 RULE_OPTION_JAP_KASHINTO_1953: "Победа Кашинто"
 RULE_OPTION_JAP_KASHINTO_1953_DESC: "Кашинто победит на выборах. В течение этого срока они начнут перевооружение."
 JAP_1955_ELECTIONS: "£GFX_game_rule_flags_JAP   Выборы 1955 года"
 RULE_OPTION_JAP_COMMUNIST_1955: "Победа JCP"
 RULE_OPTION_JAP_COMMUNIST_1955_DESC: "Японская коммунистическая партия победит на выборах."
 RULE_OPTION_JAP_SOCIALIST_1955: "Победа социалистов"
 RULE_OPTION_JAP_SOCIALIST_1955_DESC: "Социалистическая партия победит на выборах."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_1955: "Победа либеральных демократов"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_1955_DESC: "Либеральная демократическая партия победит на выборах."
 JAP_1958_ELECTIONS: "£GFX_game_rule_flags_JAP   Выборы 1958 года"
 RULE_OPTION_JAP_COMMUNIST_1958: "Победа JCP"
 RULE_OPTION_JAP_COMMUNIST_1958_DESC: "Японская коммунистическая партия победит на выборах."
 RULE_OPTION_JAP_SOCIALIST_1958: "Победа социалистов"
 RULE_OPTION_JAP_SOCIALIST_1958_DESC: "Социалистическая партия победит на выборах."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_ISHIBASHI_1958: "Победа LDP - Исибаси остается"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_ISHIBASHI_1958_DESC: "Либерально-демократическая партия победит на выборах. Премьер-министр Исибаси сохранит свой пост."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_KISHI_1958: "Победа LDP - Киси становится премьер-министром"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_KISHI_1958_DESC: "Либерально-демократическая партия победит на выборах. Позже Киси Нобусукэ станет премьер-министром. \n§YЭто исторический путь.§"
 
 #VIN game rules:
 VIN_15_PLENUM: "@VIN [1950-ые] XV Пленум"
 VIN_15_PLENUM_DESC: "По мере развития Северного Вьетнама и оказания помощи лаосским коммунистам Коммунистическая партия Вьетнама должна решить вопрос о назначении генерального секретаря."
 RULE_OPTION_VIN_VO_NGUYEN_GIAP: "Во Нгуен Гиап"
 RULE_OPTION_VIN_VO_NGUYEN_GIAP_DESC: "Пост генерального секретаря займет Во Нгуен Гиап. Он будет проводить либертарную политику с просоветским уклоном."
 RULE_OPTION_VIN_LE_DUAN: "Ле Дуань"
 RULE_OPTION_VIN_LE_DUAN_DESC: "Ле Дуань займет пост генерального секретаря. Он отменит прежнюю либеральную политику и начнет снабжение Вьетконга, развязав войну. \n§YЭто исторический путь.§"
 RULE_OPTION_VIN_TRUONG_CHINH: "Чыонг Тинь"
 RULE_OPTION_VIN_TRUONG_CHINH_DESC: "Чыонг Чинь займет пост генерального секретаря. Он будет проводить маоистскую политику, так как является ярым сторонником Мао, поддерживать отношения Вьетнама с Китаем."
 
 #VIE game rules:
 VIE_SECT_CRISIS: "@VIE [1950-ые] Политический кризис Зьема"
 VIE_SECT_CRISIS_DESC: "Поскольку Нго Динь Зьем проводит в жизнь прокатолическую политику, внутри страны сохраняется большая напряженность. Разрешение этого кризиса крайне необходимо."
 RULE_OPTION_VIE_NGO_DINH_DIEM: "Зьем остается"
 RULE_OPTION_VIE_NGO_DINH_DIEM_DESC: "Нго Динь Зьем сохранит свой курс. Монархия будет упразднена в пользу республиканской диктатуры. \n§YЭто исторический путь.§"
 RULE_OPTION_VIE_UNITED_FRONT: "Объединенный фронт приходит к власти"
 RULE_OPTION_VIE_UNITED_FRONT_DESC: "Широкая коалиция политической оппозиции свергнет Зьема, ослабив напряженность и либерализовав атмосферу."
 VIE_1956_ELECTIONS: "@VIE Выборы 1956 года"
 VIE_1956_ELECTIONS_DESC: "Учитывая, что политический кризис все еще является недавним событием, выборы 1956 года, как ожидается, станут важным вопросом в политике Вьетнама."
 RULE_OPTION_VIE_VIET_QUOC_1956: "Победа Viet Quoc"
 RULE_OPTION_VIE_VIET_QUOC_1956_DESC: "Viet Nam Quoc Dan Dang победит на выборах. В течение этого срока они будут осуществлять "Три народных принципа", подавляя коммунистическую деятельность."
 RULE_OPTION_VIE_DAI_VIET_1956: "Победа Dai Viet"
 RULE_OPTION_VIE_DAI_VIET_1956_DESC: "Dai Viet Quoc Dan Dang победит на выборах. В течение этого срока они сосредоточатся на консервативной политике."
 RULE_OPTION_VIE_COALITION_1956: "Победа национальной коалиции"
 RULE_OPTION_VIE_COALITION_1956_DESC: "Национальная коалиция победит на выборах. В течение этого срока они будут проводить националистическую политику; предложат переговоры о §YОбъединении Вьетнама§!."
 RULE_OPTION_VIE_CAN_LAO_1956: "Победа Can Lao"
 RULE_OPTION_VIE_CAN_LAO_1956_DESC: "Персоналистская рабоче-революционная партия победит на выборах. В течение этого срока они будут проводить католическую политику и следовать политике Зьема."
 
