 iree.1.d: "Вот и всеобщие выборы. Эти выборы являются первыми выборами после провозглашения Ирландской Республики 18 апреля 1949 года в соответствии с положениями Закона об Ирландской Республике 1948 года, который автоматически вынудил Ирландию выйти из Британского Содружества. Всеобщие выборы 1951 года вызваны рядом кризисов в Первом межпартийном правительстве, в первую очередь из-за схемы «Мать и дитя». Конечно, перед страной стоят и другие проблемы, такие как рост цен и проблемы с платежным балансом. Два фермерских ТД прекратили поддержку правительства из-за роста цен на молоко. Когда бюллетени закрыты и голоса подсчитаны, люди с нетерпением ждут результатов."
 iree.2.d: "Вот и всеобщие выборы. Выборы были вызваны потерей абсолютного большинства правящей партией в Dáil. Вместо того, чтобы быть отвергнутыми на голосовании в Dáil, они решили назначить всеобщие выборы и позволить людям решать."
 iree.3.d: "Вот и всеобщие выборы. Выборы 1957 г. были спровоцированы кризисом торгового баланса и реакцией на него правительства. В результате они решили убрать Dáil и предоставить решение народу. Кампания велась в основном по экономическим вопросам и положению на Севере. На севере ИРА начала операцию «Урожай», которая получила широкую поддержку на юге. Шинн Фейн была перестроена и реорганизована Пэдди МакЛоганом в партию и выставляло на выборы воздержавшихся кандидатов."
 ire.2.d: "Когда в 1939 году началась Вторая мировая война, Ирландия официально объявила чрезвычайное положение 2-го числа. Сентябрь 1939 г. На следующий день был принят Закон о чрезвычайных полномочиях. Это дало новые полномочия правительству Ирландии на время Второй мировой войны. Было введено нормирование продуктов питания, одежды и бензина, и всем в Ирландии были представлены продовольственные книжки. Одними из наиболее важных продуктов питания, которые были нормированы во время и после войны в Ирландии, были чай, сахар, масло и мука. Хлеб был нормирован в 1942 году. Табак, мыло и одежда также были нормированы. В отличие от Британии, яйца и мясо не были нормированы.\nБензин также был нормирован. Официальная надбавка для простых людей с автомобилями составляла восемь галлонов в месяц до 10 л.с., 12 галлонов в месяц для автомобилей 10 - 16 л.с. Врачи, священники и ветеринары также получали дополнительное пособие.\n\nЗакон о чрезвычайных полномочиях был отменен 2 сентября 1946 года. Однако многие его части остались в силе, включая нормирование. Теперь, спустя 6 лет, нормирование официально закончилось."
 ire.3.d: "На протяжении 1920-х, 1930-х и 1940-х годов ни одна специально построенная студия не способствовала круглогодичному производству фильмов в Ирландии. Чтобы исправить это, деловой консорциум, частично финансируемый из США, в 1955 году начал строительство студии в голливудском стиле к югу от города Дублин. После завершения строительства, Ардмор Студиос открыла свои двери в [GetDate].\nРасположенная на десяти акрах земли в 12 милях к югу от Дублина, студия предлагает первую возможность для ирландских кинематографистов снимать в помещении круглый год.\nУже ходят слухи, что адаптация пьесы Уолтера Макена \"Дом - герой\", с Макеном в главной роли и режиссером Филдером Куком, лауреатом премии Эмми, будет первым фильмом студии.\n\nПредставитель студии дал нам такой комментарий: \n\n\n \"До открытия студии Ирландия ограничивалась съемками на месте, которые представляли собой лишь небольшую часть готового фильма. После открытия Ardmore Studios - и с Эмметом Далтоном и Луисом Эллиманом в качестве управляющих директоров - международные кинематографисты, несомненно, начнут рассматривать Уиклоу как привлекательное место для съемок.\""