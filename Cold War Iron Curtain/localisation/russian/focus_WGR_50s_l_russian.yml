l_english:
 WGR_founding_the_BGS: "Основать Федеральную пограничную службу"
 WGR_founding_the_BGS_desc: "Bundesgrenzschutz (Федеральная пограничная служба) была основана 16 марта 1951 года. BGS была военизированной организацией, которой было поручено патрулировать границу."
 wgr_spawn_bgs1: "§YСоздать 4 единицы BGS§!"
 WGR_Reinforce_the_BGS: "Усилить BGS"
 WGR_Reinforce_the_BGS_desc: "19 июня 1953 г. утвержденная численность BGS увеличилась с 10 000 человек до 20 000 человек."
 wgr_spawn_bgs2: "§YСоздать 3 единицы BGS§!"
 WGR_Reunification_of_the_Reich: "Воссоединение Германии"
 WGR_Reunification_of_the_Reich_desc: "Раскол немецкого народа был незаконным и несправедливым. Теперь мы имеем достаточно поддержки со стороны жителей ГДР, чтобы добиться полного восстановления Германии"
 WGR_annex_saarland: "Аннексировать Саар"
 WGR_annex_saarland_desc: "Еще более оскорбительным, чем все остальные территориальные захваты так называемых держав-победителей, является передача Саара под управление Франции. Так больше не может продолжаться!"
 WGR_Demand_Return_of_land_from_Poland: "Потребовать возврата исторических земель."
 WGR_Demand_Return_of_land_from_Poland_desc: "Большевики отдали Польше старые земли Пруссии. Мы уверены, что поляки поступят мудро, вернув старые немецкие дома назад в Германию."
 WGR_The_New_Kaiserreich: "Новый Кайзеррейх"
 WGR_The_New_Kaiserreich_desc: "Пришло время вернуть Германии былую славу! Мы провозглашаем новый Кайзеррейх!"
 WGR_Expedition_to_South_America: "Экспедиция в Южную Америку"
 WGR_Expedition_to_South_America_desc: "Недавно созданная \"Имперская разведка\" предпринимет экспедицию в Аргентину, чтобы проследить за старым слухом... "
 WGR_East_German_Revolution: "Революция в Восточной Германии"
 WGR_East_German_Revolution_desc: "Наши братья и сестры на востоке смотрят на нашу новообретенную националистическую гордость с завистью и обожанием. Нам нужно поддержать их, дав им то, с помощью чего они смогут присоединиться к нам."
 WGR_Political_Sovereignty: "Политический суверинитет"
 WGR_Political_Sovereignty_desc: "После успешной денацификации Германии, мы можем обратиться к оккупантам с петицией о том, чтобы немецкие дела были снова решены немецким народом."
 WGR_True_Democracy: "Истинная демократия"
 WGR_True_Democracy_desc: "Германия намерена не повторять ошибки прошлого. Мы останемся верны демократическим ценностям."
 WGR_Ridding_the_Fascists: "Избавиться от фашистов"
 WGR_Ridding_the_Fascists_desc: "Есть только одни виновники поражения Германии: Гитлер и его сторонники. Мы выследим каждого из них и заставим поверить в демократию."
 WGR_Founding_the_Bundeswhr: "Основание Бундесвера"
 WGR_Founding_the_Bundeswhr_desc: "Бундесвер станет новой военной опорой нашей страны, которая позволит нам вновь взять оборону страны в свои руки."
 wgr_spawn_bundeswehr: "§YActivate 12 unequipped divisions and unlock division designs§!"
 WGR_Accept_the_Marshall_Plan: "Принять план Маршалла"
 WGR_Accept_the_Marshall_Plan_desc: "Американский план Маршалла - это фонд финансовой помощи, созданный для помощи в востановлении разрушенных стран Европы. Приняв его, мы сможет остановить процесс деиндустриализации."
 WGR_Formation_of_the_Luftwaffe: "Сформировать Люфтваффе"
 WGR_Formation_of_the_Luftwaffe_desc: "Современные и реорганизованные Люфтваффе призваны защищать воздушное пространство новой Германии. Если мы будем сотрудничать с НАТО или с Варшавским договором, то сможем закупить у них большое количество истребителей. "
 WGR_Disband_the_German_Mine_Sweeping_Administration: "Распустить GMSA"
 WGR_Disband_the_German_Mine_Sweeping_Administration_desc: "GMSA (Немецкое управление по разминированию) было сформировано из остатков Кригсмарине, чтобы очистить Северное море от морских мин. Из-за протестов СССР и общественного сопротивления, мы расформируем эту организацию."
 WGR_Ban_the_Communist: "Запретить коммунизм"
 WGR_Ban_the_Communist_desc: "Как бы ни были плохи наши оккупанты, очевидно, что нашим восточным братьям приходится еще хуже. Мы должны избавиться от коммунистов."
 WGR_Foreign_Tank_Requests: "Запрос иностранных танков"
 WGR_Foreign_Tank_Requests_desc: "У нас нету достаточной промышленности, чтобы вооружить нашу армию танками. Обратимся к США с просьбой о военной помощи."
 wgr_minus_1_bil_tooltip: "§YЭтот фокус удалит 1 миллиард долларов из вашей казны!§!"
 wgr_minus_4_bil_tooltip: "§YЭтот фокус удалит 4 миллиарда долларов из вашей казны!§!"
 wgr_minus_7_bil_tooltip: "§YЭтот фокус уберет из вашей казны 7 миллиардов долларов!§!"
 wgr_minus_15_bil_tooltip: "§YЭтот фокус уберет из вашей казны 15 миллиардов долларов!§!"
 wgr_minus_20_bil_tooltip: "§YЭтот фокус уберет из вашей казны 20 миллиардов долларов!§!"
 WGR_Foreign_APC_Request: "Запрос механизированной техники"
 WGR_Foreign_APC_Request_desc: "Наши механизированные войска не получают достаточного финансирования. Нам нужна военная помощь со стороны США, чтобы эффективно защищать свои границы."
 WGR_Foreign_Light_Tank_Requests: "Запрос легких танков"
 WGR_Foreign_Light_Tank_Requests_desc: "У нас недостаточно промышленных мощностей, чтобы вооружить армию легкими танками. Обратимся к США с просьбой о военной помощи."
 WGR_Funding_the_Bundeswehr: "Увеличить финансирование Бундесвера"
 WGR_Funding_the_Bundeswehr_desc: "Подтолкнем правительство к созданию \"Verteidigungshaushaltsbudget\", чтобы мы могли эффективно защищать наши границы."
 WGR_Leadership_Reforms: "Реформа генерального штаба"
 WGR_Leadership_Reforms_desc: "Реформируем генеральный штаб Бундесвера, чтобы повысить его эффективность"
 WGR_Heckler_Koch: "Heckler & Koch"
 WGR_Heckler_Koch_desc: "Компания, основанная тремя инженерами Mauser AG с чертежами оружия, которое удалось сохранить от уничтожения французами, HK быстро стала новым стандартом немецкого пехотного снаряжения."
 WGR_Continued_Reconstruction: "Продолжение восстановления"
 WGR_Continued_Reconstruction_desc: "Наши усилия по восстановлению не были приложены зря. Продолжим это дело, чтобы мы смогли выстоять против Советов."
 WGR_Computers_in_Industry: "Компьютеры в промышленности"
 WGR_Computers_in_Industry_desc: "Компьютеры становятся все более популярными на Западе. Пришло время наверстать упущенное."
 WGR_Expansion_of_Air_Defense: "Расширение противовоздушной обороны"
 WGR_Expansion_of_Air_Defense_desc: "Из-за угрозы Советской агрессии, мы должны обезопасить наши города от бомбардировок."
 WGR_Refresh_the_Elites: "Обновление элиты"
 WGR_Refresh_the_Elites_desc: "Пройдя через денацификацию, некоторые из наших бывших асов снова вернулись на службу."
 WGR_Buy_F86: "Buy F86's"
 WGR_Buy_F86_desc: ""
 WGR_Formation_of_the_Bundesmarine: "Сформировать Бундесмарине"
 WGR_Formation_of_the_Bundesmarine_desc: "Бундесмарине является преемником Кригсмарине, предназначенного для обороны наших морских районов."
 WGR_Sign_the_Pleven_Plan: "Подписать план Плевена"
 WGR_Sign_the_Pleven_Plan_desc: "Предложенный французом Рене Плевеном план предусматривал создание общеевропейской армии. Это должно было помешать Германии перевооружиться самостоятельно."
 WGR_Reactionary_Stance: "Reactionary Stance"
 WGR_Reactionary_Stance_desc: "Некоторые страны за рубежом все еще пребывают в смятении после войны. Мы должны помочь им."
 WGR_Ties_with_NATO: "Вступить в НАТО"
 WGR_Ties_with_NATO_desc: "Членство в НАТО поможет нам бороться с коммунизмом во всём мире."
 WGR_War_Reparations: "Военные репарации"
 WGR_War_Reparations_desc: "Выплата военных репараций позволит нам и нашим соседям избавиться от разрушений Второй мировой войны."
 WGR_Armoured_Use: "Новые танки"
 WGR_Armoured_Use_desc: "Мы начнем финансировать разработку новых танков."
 WGR_Focus_on_ATGMs: "Исследование ПТУР"
 WGR_Focus_on_ATGMs_desc: "Финансируя исследования ПТУР, мы сможем противостоять бронетанковым частям противника."
 WGR_Agility_over_Protection: "Скорость превосходит защиту"
 WGR_Agility_over_Protection_desc: "Уроки последней войны показали нам, что легкие, быстрые дивизии во многих ситуациях более полезны, чем неповоротливые стальные звери."
 WGR_Build_Military_Bases: "Построить военные базы"
 WGR_Build_Military_Bases_desc: "Как первая линия обороны против коммунистов, мы должны восстановить наши военные базы по всей стране."
 WGR_Lessons_From_WWII: "Уроки Второй мировой войны"
 WGR_Lessons_From_WWII_desc: "Вторая мировая война проложила путь многим новым военным доктринам и изобретениям."
 WGR_G3_Rifle: "Винтовка G3"
 WGR_G3_Rifle_desc: "Основанная на испанской винтовке CETME, Heckler & Koch G3 была закана Западной Германией в 1956 году. Она быстро станет стандартом вооружения."
 WGR_Reemergence_of_the_Luftwaffe: "Возрождение современного Люфтваффе"
 WGR_Reemergence_of_the_Luftwaffe_desc: "Разработка нового и современного подразделения Люфтваффе почти завершена."
 WGR_Ban_the_Witwenmacher: "Запрет \"Вдоводела\""
 WGR_Ban_the_Witwenmacher_desc: "\"F-104 Starfighter\" был назван \"вдоводелом\" в Германии после многих аварий из-за плохой конструкции самолета. Мы должны немедленно прекратить его использование."
 WGR_Re_open_the_Dockyards: "Использование старых верфей"
 WGR_Re_open_the_Dockyards_desc: "После многих месяцев восстановления мы наконец-то можем вновь открыть некоторые из наших бывших верфей. Наш новый флот уже строится."
 WGR_Re_Staff_the_Kiel_Naval_Base: "Восстановление Кильской военно-морской базы"
 WGR_Re_Staff_the_Kiel_Naval_Base_desc: "Крупнейшая военно-морская база Западной Германии, расположенная в Киле, вскоре вновь начнет функционировать."
 WGR_Join_the_European_Defense_Community: "Присоединиться к Европейскому оборонному сообществу"
 WGR_Join_the_European_Defense_Community_desc: "Мы завершили последние шаги, необходимые для формирования единого общеевропейского оборонного сообщества."
 WGR_Economic_Cooperation_with_Eastern_Block: "Экономическое сотрудничество с Восточным блоком"
 WGR_Economic_Cooperation_with_Eastern_Block_desc: "Несмотря на то, что осталось много недовольных ролью Германии во Второй мировой войне, нам нужно объединиться, чтобы восстановить наши города."
 WGR_Reinforcement_of_Govermment: "Усилить правительство"
 WGR_Reinforcement_of_Govermment_desc: "Мы будем укреплять наше независимое государство, чтобы обеспечить мир и процветание для всего континента."
 WGR_Reinforcing_Democracy: "Укрепление демократии"
 WGR_Reinforcing_Democracy_desc: "Демократические ценности, привнесенные американцами, являются выходом для Европы из цикла разрушения и войн."
 WGR_Operation_Xavier: "Операция \"Хавьер\""
 WGR_Operation_Xavier_desc: "Названная в честь француза Ксавье Валла, эта операция позволяет нам тайно возобновить антиеврейские настроения."
 WGR_American_German_Tank_Cooperation: "Американо-Германское танковое сотрудничество"
 WGR_American_German_Tank_Cooperation_desc: "Сотрудничество с производителями оружия в Баварии и Баден-Вюртемберге с американскими промышленными предприятиями в Техасе приведет к прорывам в области бронетехники."
 WGR_Franco_German_Tank_Cooperation: "Франко-Германское танковое сотрудничество"
 WGR_Franco_German_Tank_Cooperation_desc: "Сотрудничество производителей оружия в Рейне и Париже позволит добиться прорывов в тяжелой бронетехнике."
 WGR_Expanding_the_Bundeswehr: "Расширение состава Бундесвера"
 WGR_Expanding_the_Bundeswehr_desc: "Мы должны увеличить финансирование Бундесвера перед лицом перевооружения Восточной Германии и продолжающейся советской агрессии."
 WGR_Cooparate_with_Warsaw_pact: "Сотрудничество с Варшавским договором"
 WGR_Cooparate_with_Warsaw_pact_desc: "Новый европейский оборонный союз должен смотреть на Россию, а не на США. В конце концов, Москва ближе и злее Вашингтона."
 WGR_Stay_Neutral: "Сохранить нейтралитет"
 WGR_Stay_Neutral_desc: "Две самопровозглашенные \"сверхдержавы\" Россия и США могут вести свою холодную войну между собой! Европа занята восстановлением и не заинтересована в очередной мировой войне."
 WGR_Cooperate_with_NATO: "Сотрудничество с НАТО"
 WGR_Cooperate_with_NATO_desc: "НАТО - это естественный союзник Европы в борьбе с деспотизмом, коммунизмом и российской агрессией!"
 WGR_Gastarbeiters: "Иностранные наемные рабочие"
 WGR_Gastarbeiters_desc: "Многие миллионы немецких мужчин погибли в последней войне, и наша рабочая сила существенно сократилась. Мы должны найти дешевую рабочую силу из бедных стран."
 WGR_Basic_Law_Reforms: "Реформа конституции"
 WGR_Basic_Law_Reforms_desc: "Новая конституция - прочный фундамент для нашей молодой демократии, но любое здание, как и конституция, нуждаются в большем, чем просто в фундаменте."
 WGR_Bonn_Paris_Conventions: "Бонн-Парижский договор"
 WGR_Bonn_Paris_Conventions_desc: "Франция по-прежнему не доверяет нашей приверженности демократии и миру. Мы можем наводить мосты между нашими странами с помощью частых конференций."
 WGR_ODESSA: "ОДЕССА"
 WGR_ODESSA_desc: "Кодовое имя, данное американцами бывшим членам СС. Бегство известных эсэсовцев из Европы было расценено союзниками как миф. Они мало что знают..."
 WGR_Mechanized_Warfare: "Механизированная война"
 WGR_Mechanized_Warfare_desc: "С появлением военных действий в послевоенную эпоху мы должны улучшить наши исследования и разработки для механизированных войск и доктрин."
 WGR_Request_to_Join_NATO: "Просьба о вступлении в НАТО"
 WGR_Request_to_Join_NATO_desc: "После долгой перестройки пришло наше время присоединиться к демократическим, цивилизованным нациям Запада."
 WGR_Anti-Nazi_Sentiment: "Антифашистские настроения"
 WGR_Anti-Nazi_Sentiment_desc: "Нам нужно обновить наши учебники истории и финансировать новые документальные фильмы об ужасах Третьего Рейха. Фашизм будет уничтожен везде, где его найдут!"
 WGR_The_Ratlines: "Крысиные норы"
 WGR_The_Ratlines_desc: "Так назывались старые пути отхода многих бывших членов СС. Пришло время вернуться к этим маршрутам и связаться с некоторыми старыми друзьями..."
 WGR_Duty_to_Country: "Долг перед нашей страной"
 WGR_Duty_to_Country_desc: "Каждый человек служит либо в армии, либо работает столько, сколько может. Наша трудовая этика будет известна во всем мире."
 WGR_West_German_Army_controll: "Западно-германское армейское управление"
 WGR_West_German_Army_controll_desc: "Бундесвер существует не только для Германии, но и является частью нового Евройпейского оборонного союза."
 wgr_recall_generals: "§YОтзовать наших генералов на действующую службу!§!"
 WGR_Saarland_Invitation: "Возвращение Саара"
 WGR_Saarland_Invitation_desc: "Саар был официально приглашен обратно в нашу федерацию в качестве Бундесланда. Разумеется, в полном сотрудничестве с НАТО."
 WGR_Build_the_Spangdalhlem_air_base: "Построить базу \"Spangdahlem\""
 WGR_Build_the_Spangdalhlem_air_base_desc: "Мы выбрали хорошее место на нашей западной границе для постройки новой гигантской авиабазы."
 WGR_HIAG: "ХИАГ"
 WGR_HIAG_desc: "Ассоциация взаимопомощи бывших членов СС стремится исправить плохой имидж нацистов в Германии и за рубежом. Мы можем финансировать их усилия, чтобы еще больше повлиять на общественное мнение."
 WGR_Volks_Oath: "Клятва верности"
 WGR_Volks_Oath_desc: "Я клянусь верно служить Федеративной Республике Германии и доблестно защищать права и свободы немецкого народа, да поможет мне Бог."
 WGR_Gelobnis: "Присяга"
 WGR_Gelobnis_desc: "Я клянусь верно служить германскому правительству и доблестно защищать права и свободы нашей великой нации, да поможет мне Бог."
 WGR_Call_for_Great_Britain_to_Join: "Попросить Великобританию присоединиться"
 WGR_Call_for_Great_Britain_to_Join_desc: "Будучи естественным союзником нашей великой европейской армии, Великобритания должна присоединиться к нашим усилиям по защите свободы и мира."
 WGR_European_Political_Cooperation: "Европейское политическое сотрудничество"
 WGR_European_Political_Cooperation_desc: "Сотрудничество между нашими странами не должно ограничиваться только нашими вооруженными силами. Нам необходимо наладить прямые и регулярные международные переговоры."
 WGR_Form_the_ECSC: "Сформировать ЕОУС"
 WGR_Form_the_ECSC_desc: "Европейское объединение угля и стали было создано в 1952 году для регулирования и обеспечения доступа к общему европейскому рынку. Позже он будет преобразован в крупнейший политический проект в мире-Европейский Союз."
 WGR_Embrace_Nationalism: "Объятия Национализма"
 WGR_Embrace_Nationalism_desc: "Теперь мы официально заявляем о своей поддержке создания новой Национал-Социалистической партии в Германии."
 WGR_Why_we_Fight: "Почему мы сражаемся?"
 WGR_Why_we_Fight_desc: "Давайте напомним нашим людям о нынешнем политическом климате и о том, почему так важно, чтобы мы стояли на своем."
 WGR_Peoples_Army: "Народная армия"
 WGR_Peoples_Army_desc: "Сердце и душа каждой армии - это народ."
 WGR_Common_Foreign_and_Security_Policy: "CFPS"
 WGR_Common_Foreign_and_Security_Policy_desc: "Еще более тесное сотрудничество между нашими политиками для обеспечения того, чтобы все европейские границы были защищены от врагов."
 WGR_Make_the_European_Economic_community: "Европейское экономическое сообщество"
 WGR_Make_the_European_Economic_community_desc: "Созданное в 1957 году ЕЭС ознаменовало собой второй шаг еще более тесного экономического сотрудничества между европейцами. Позднее оно будет переименовано (и поглощено) в Европейский Союз."
 WGR_Protest_Foreign_Troop_Stationing: "Протест против размещения иностранных войск"
 WGR_Protest_Foreign_Troop_Stationing_desc: "Мы больше не можем терпеть, когда иностранные неоимпериалистические державы (а именно США) размещают свои войска по всему миру."
 WGR_Maastricht_Treaty: "Маастрихтский договор"
 WGR_Maastricht_Treaty_desc: "Подписав этот договор, мы согласны к интеграции в европейское сообщество, сотрудничеству в судебных делах между европейскими государствами и обеспечению общей политики в области безопасности и экономики."
 WGR_Berlin-Madrid_Alliance: "Альянс Берлин-Мадрид"
 WGR_Berlin-Madrid_Alliance_desc: "Альянс Берлин-Мадрид"
 WGR_Mobilizing_the_Reserves: "Мобилизовать резервы"
 WGR_Mobilizing_the_Reserves_desc: "Мы должны быть готовы к любым новым конфликтам."
 WGR_Common_Foreign_and_Security_Policy_1: "CFPS"
 WGR_Common_Foreign_and_Security_Policy_1_desc: "Общая внешняя политика и политика безопасности - это организованная, согласованная внешняя политика Европейского Союза, направленная главным образом на дипломатию и действия в области безопасности и обороны. "
 WGR_Forced_Mobilization: "Ускоренная мобилизация"
 WGR_Forced_Mobilization_desc: "На карту поставлена наша новая и суверенная страна! Такого понятия, как \"гражданский\", больше быть не может."
 WGR_Bundeswehr_Exercises: "Учения Бундесвера"
 WGR_Bundeswehr_Exercises_desc: "Военные учения для различных сценариев будут держать нас готовыми к любым неожиданностям. Хотя нашим соседям это может не понравиться."
 WGR_PzF_44: "PzF 44"
 WGR_PzF_44_desc: "Мы начнем разработку нашей новейшей противотанковой системы вооружения - PzF 44. Это будет наша первая отечественная противотанковая винтовка со времен Второй мировой войны."
 WGR_Expanding_the_Autobahn: "Расширение автобанов"
 WGR_Expanding_the_Autobahn_desc: "Первоначально созданный Гитлером для быстрой передислокации войск, Autobahn стал бесценным для гражданского транспорта."
 WGR_Nationalization_of_Noxdorf_Computers_AG: "Национализация компании Nixdorf Computers AG"
 WGR_Nationalization_of_Noxdorf_Computers_AG_desc: "Одна из крупнейших инновационных компаний в Западной Германии, Nixdorf Computers AG является ценным активом для наших научных усилий."
 WGR_Collection_of_Intellects: "Пригласить ученых"
 WGR_Collection_of_Intellects_desc: "Улучшение стабильности и продолжающееся восстановление Германии позволили нам обратить вспять утечку мозгов из-за Второй мировой войны."
 WGR_Enlist_Dornier: "Приватизировать Dornier"
 WGR_Enlist_Dornier_desc: "Один из старейших авиастроителей, открывший свои двери в 1914 году, Дорнье - это самый опытный авиастроитель."
 WGR_Request_NATO_CAS: "Запрос штурмовиков у НАТО"
 WGR_Request_NATO_CAS_desc: "Давайте обратимся за помощью к НАТО в разработке новейших штурмовиков."
 WGR_Research_Teams: "BAAINBw"
 WGR_Research_Teams_desc: "BAAINBw (Федеральное управление по оборудованию, информационным технологиям и технической поддержке Бундесвера) - это важнейшая научная отрасль вооруженных сил."
 WGR_National_Employment_Program: "Национальная программа занятости населения"
 WGR_National_Employment_Program_desc: "Внедрение сети благосостояния для наших людей позволяет нам быстрее обучать людей и управлять их реинтегрированием в рабочую силу, если они попали в трудные времена."
 WGR_The_Grand_Autobahn: "Великий Автобан"
 WGR_The_Grand_Autobahn_desc: "Соединение даже небольших городов с нашей обширной сетью многополосных скоростных дорог сделает Autobahn предметом зависти всего мира."
 WGR_Enlistment_of_Noxdorf_Computers_AG: "Национализация Nixdorf Computers AG"
 WGR_Enlistment_of_Noxdorf_Computers_AG_desc: "Мы передадим обширные контракты на строительство инфраструктуры передачи данных и радиолокационных постов компании Nixdorf AG."
 WGR_modern_Programming: "Современное программирование"
 WGR_modern_Programming_desc: "Сотрудничество с IT-талантами как на местном уровне, так и из-за рубежа позволит расширить наши возможности в новой области компьютерных наук."
 WGR_Merge_Dornier_and_Daimler-Benz: "Объединить Dornier и Daimler-Benz"
 WGR_Merge_Dornier_and_Daimler-Benz_desc: "Мы начнем слияние \"Daimler-Benz\" и авиационной компании \"Dornier\", а также создадим DASA, компанию \"Deutsche Aerospace Aktiengesellschaft\"."
 WGR_US_Production_Licenses: "Лицензии на производство самолётов"
 WGR_US_Production_Licenses_desc: "Несмотря на первоначальные проблемы со F-104 Stafighter, ясно, что сотрудничество с ВВС США может принести много пользы."
 WGR_Submarine_Designs: "Конструкции подводных лодок"
 WGR_Submarine_Designs_desc: "Наиболее эффективным способом защиты Балтийского моря без высокотехнологичных ракетных крейсеров являются подводные лодки."
 WGR_Fortifying_the_Border: "Укрепление границ"
 WGR_Fortifying_the_Border_desc: "Мы являемся предполагаемыми союзниками наших западных соседей, но изменения в мире происходят постоянно и быстро..."
 WGR_Krauss_Maffei_Tank_Factories: "Krauss Maffei Werke"
 WGR_Krauss_Maffei_Tank_Factories_desc: "Компания Kraus-Maffei Werke производит преимущественно поезда, троллейбусы и автобусы для внутреннего и внешнего рынков. Позже он начал работать над знаменитыми танками \"Леопард-1\" и \"Леопард-2\"."
 WGR_Synthetic_Production_Projects: "Проекты производства синтетических материалов"
 WGR_Synthetic_Production_Projects_desc: "Созданные химические компании, такие как BASF и Herbol, начали наращивать свое присутствие в южной Германии, тем самым расширяя наши промышленные возможности там."
 WGR_USA_Computers: "Американские компьютеры"
 WGR_USA_Computers_desc: "Чтобы продолжить наше научное развитие, мы должны получить помощь и оборудование от MIT и от компаний Силиконовой долины."
 WGR_Funding_of_New_Academies: "Финансирование академий"
 WGR_Funding_of_New_Academies_desc: "Хотя Германия всегда имела обширную сеть университетов, будут созданы новые и более специализированные академии для всех областей науки и промышленности, чтобы не отставать от спроса на квалифицированную рабочую силу."
 WGR_Form_the_Aerial_Safety_Administration: "Сформировать управление авиационной безопасности"
 WGR_Form_the_Aerial_Safety_Administration_desc: "С созданием новых и более быстрых самолетов, как гражданских, так и военных, потребность в регулировании возросла. Мы должны сформировать Управление по безопасности полетов, которое будет отвечать за безопасность."
 WGR_NATO_Air_Defense: "Противовоздушная оборона NATO"
 WGR_NATO_Air_Defense_desc: "Германия станет первым фронтом, если начнется новая война между сверхдержавами. НАТО необходимо признать эту проблему и защищать самую свободную Восточную нацию."
 WGR_Tank_Design_Competition: "Конкурс на проектирование танков"
 WGR_Tank_Design_Competition_desc: "В этом новом глобализованном мире мы больше не ограничиваемся только отечественными производителями. Посмотрим, кто может производить лучшие танки."
 WGR_Industrial_Expansion_Plans: "Планы по расширению промышленности"
 WGR_Industrial_Expansion_Plans_desc: "Ни США, ни Советский Союз не могут идти в ногу с обновленной индустриальной Германией. И все же нам еще есть куда расти."
 WGR_Expanding_the_Mines: "Расширение шахт"
 WGR_Expanding_the_Mines_desc: "У нас не так много природных ресурсов, но мы все равно можем увеличить добычу полезных ископаемых с помощью новых методов раскопок."
 WGR_Research_Agreements_with_US: "Исследовательские соглашения с США"
 WGR_Research_Agreements_with_US_desc: "Серия студенческих обменов и научно-исследовательских коллабораций будет строго привязывать нашу собственную технологию к престижным университетам Соединенных Штатов."
 WGR_Department_of_Rocketry: "Департамент ракетной техники"
 WGR_Department_of_Rocketry_desc: "Новые достижения в области баллистических ракет и систем целеуказания проявили необходимость создания специального отдела."
 WGR_Man_Engine_and_Machine: "Человек, двигатель и машина"
 WGR_Man_Engine_and_Machine_desc: "От разрушений Второй Великой войны мало что осталось. Мы вернулись, и вернулись по-настоящему. \"Сделано в Германии\" - это самая востребованная качественная печать в мире."
 WGR_More_Industry_in_Nordrhein-Westfalen: "Увеличить промышленность в Северном Рейн-Вестфалии"
 WGR_More_Industry_in_Nordrhein-Westfalen_desc: "Рурская Долина всегда была промышленным центром для всей Европы. Сейчас, когда на границе наконец установился мир и спрос на сырье высок, настало время снова инвестировать в этот регион."
 WGR_Basf: "BASF"
 WGR_Basf_desc: "Баденский анилиновый и содовый завод (BASF) является крупнейшим производителем химических веществ в мире, производя очень широкий спектр химических веществ как для военных, так и для гражданских целей."
 WGR_F-4_Phantom_Order: "Заказать F-4 Phantom"
 WGR_F-4_Phantom_Order_desc: "Несмотря на наши усилия по восстановлению нашей инфраструктуры и разработке новых бронированных машин, мы вновь обращаемся к ВВС США с просьбой предоставить нам авиационную новинку и оборудование. Возможно, они смогут снабдить нас такими знаниями о своем последнем перехватчике..."
 WGR_Reorganize_the_Navy: "Реорганизовать военно-морской флот"
 WGR_Reorganize_the_Navy_desc: "После многих реформ и больших усилий мы наконец можем похвастаться тем, что у нас снова есть действующий флот."
 WGR_Naval_Leadership_Reforms: "Реформы военно-морского руководства"
 WGR_Naval_Leadership_Reforms_desc: "Военно-морские академии породили новое поколение способных капитанов и адмиралов, не без помощи Великобритании."
 WGR_Berlin_Conferences: "Берлинские конференции"
 WGR_Berlin_Conferences_desc: "Мы начали приглашать многих бывших коллаборационистов и эмигрантов обратно в Берлин, чтобы обсудить будущее нашей великой нации."
 WGR_Duty_to_Conscience: "Долг перед совестью"
 WGR_Duty_to_Conscience_desc: "Долг каждого солдата - сражаться по своей совести и не подчиняться приказам, если они не соответствуют международному праву и человеческой порядочности."
 WGR_Duty_to_Serve: "Обязанность служить"
 WGR_Duty_to_Serve_desc: "Долг каждого солдата - беспрекословно следовать приказам своего начальства, какими бы они ни были. Стране нужны солдаты, а в войне мало места для брезгливых."
 WGR_Modern_Blitzkrieg: "Современный блицкриг"
 WGR_Modern_Blitzkrieg_desc: "Продолжая нашу знаменитую доктрину, современный блицкриг включает в себя использование ракет целеуказания, реактивного авиационного обеспечения и компьютерного тактического анализа."
 WGR_Training_of_the_Elites: "Подготовка элитных войск"
 WGR_Training_of_the_Elites_desc: "Стране нужны новые офицеры и генералы, не запятнанные неудачами своих предшественников."
 WGR_War_Plan_A: "Великий крестовый поход против коммунизма"
 WGR_War_Plan_A_desc: "Мы приступим к осуществлению наших планов аннексии и немедленного объединения Восточной Германии и исправим величайшее зло, причиненное Второй мировой войной."
 WGR_Buy_US_fighters: "Купить американские истребители"
 WGR_Buy_US_fighters_desc: "Наша промышленность и исследовательские группы серьезно пострадали, и на разработку наших собственных истребителей ушло бы слишком много времени. Мы должны попросить помощи у наших новых американских друзей."
 WGR_Develop_domestic_fighters: "Разработка отечественных истребителей"
 WGR_Develop_domestic_fighters_desc: "Опасно зависеть от кого бы то ни было, какими бы дружелюбными они сейчас ни были. Мы должны инвестировать в восстановление нашей авиационной промышленности."
 WGR_Independent_Luftwaffe: "Независимые Люфтваффе"
 WGR_Independent_Luftwaffe_desc: "Хотя предложение наших союзников звучит заманчиво, мы продолжим восстанавливать нашу промышленность, что обеспечит нам свободу и независимость."
 WGR_Buy_US_Ships: "Купить старые американские эсминцы"
 WGR_Buy_US_Ships_desc: "Нам нужны корабли для Бундесмарина как можно скорее. Лучший способ добиться этого - покупка у США, которые в настоящее время имеют гораздо больше кораблей, чем им нужно."
 WGR_Buy_UK_Ships: "Купить старые британские фрегаты"
 WGR_Buy_UK_Ships_desc: "Великобритания предлагает старые фрегаты для восстановления нашего флота. Они нужны нам для защиты наших прибрежных вод от советских подводных лодок!"
 WGR_Defensive_Navy: "Оборонительные Bundesmarine"
 WGR_Defensive_Navy_desc: "Задача нашего флота - защищать наши прибрежные воды от любых вторжений. Лучший способ добиться этого - это флот небольших кораблей при поддержке подводных лодок и вертолетов."
 WGR_Marineflieger: "Морская авиация"
 WGR_Marineflieger_desc: "Командование морской авиации это военно-морское воздушное подразделение Бундесмарине. Для защиты нашей береговой линии от любой более серьезной угрозы необходимо иметь морские бомбардировщики и вертолеты ПВО."
 WGR_Buy_New_Destroyers: "Купить новые эсминцы"
 WGR_Buy_New_Destroyers_desc: "Наши эсминцы стареют, и разработка новых обходится очень дорого. Мы должны купить их в Соединенных Штатах."
 WGR_Destroyer_Designs: "Модели эсминцев"
 WGR_Destroyer_Designs_desc: "Эсминцы - это самые большие корабли, которые мы можем себе позволить. Они обеспечат необходимую огневую мощь для борьбы с любыми меньшими кораблями, которые могут представлять для нас опасность."
 WGR_Frigate_Designs: "Модель фрегата"
 WGR_Frigate_Designs_desc: "Новые фрегаты дополнят остальную часть нашего флота и обеспечат защиту от вражеских подводных лодок, которые в противном случае могли бы действовать незамеченными."
 WGR_Naval_Exports: "Экспорт кораблей"
 WGR_Naval_Exports_desc: "Наши проекты оказались очень хорошими, и мы получаем заказы из нескольких небольших стран. Это позволило нашим компаниям увеличить производственные мощности, а также удешевить суда."
 WGR_Challange_Powers: "Бросьте вызов нашим ВМС"
 WGR_Challange_Powers_desc: "Если мы хотим проявить свое влияние и волю в мире, нам нужен сильный флот с достаточным радиусом действия. Это, вероятно, вызовет гнев других наций с сильными флотами."
 WGR_Carrier_Development: "Разработка палубной авиации"
 WGR_Carrier_Development_desc: "Первым делом в рамках нашей программы обновления Военно-морского флота необходимо начать разработку авианосцев и палубной авиации."
 WGR_Prepare_The_Doctrine: "Подготовить новые доктрины"
 WGR_Prepare_The_Doctrine_desc: "Новые корабли не принесут нам большой пользы, если у нас не будет подробных планов их эксплуатации. Мы должны посмотреть на морские сражения Второй Мировой Войны и поучиться у англичан."
 WGR_Design_Cruiser: "Разработать новый крейсер"
 WGR_Design_Cruiser_desc: "Нам не хватает тяжелой огневой мощи - нам нужно исследовать крейсер. (Это позволит исследовать современные крейсерские технологии без необходимости исследования старых крейсеров.)"
 WGR_Intervention: "Морские высадки"
 WGR_Intervention_desc: "Мы должны уметь отстаивать свои идеалы и интересы даже за рубежом."
 WGR_EDC_Navy_Cooperation: "Военно-морское сотрудничество"
 WGR_EDC_Navy_Cooperation_desc: "Если Европа хочет иметь хоть какой-то шанс конкурировать с военно-морскими сверхдержавами, она должна сотрудничать друг с другом."
 WGR_EDC_Naval_Industry: "Расширение военно-морской промышленности"
 WGR_EDC_Naval_Industry_desc: "Даже объединенная Европа все еще испытывает недостаток доков по сравнению с нашими конкурентами. Мы должны расширять нашу военно-морскую промышленность и верфи, чтобы поддерживать нашу оборону."
 WGR_Election_of_1953: "Выборы 1953 года"
 WGR_Election_of_1953_desc: "Сегодня день выборов во второй Бундестаг. На повестке дня - дальнейшее экономическое развитие Западной Германии, а также то, какие отношения мы будем иметь с восточными немцами."
 WGR_Election_of_1957: "Выборы 1957 года"
 WGR_Election_of_1957_desc: "Сегодня день выборов в третий Бундестаг. При гарантированной безопасности наши кандидаты будут находиться в трудном предвыборном сезоне, поскольку дебаты о будущем самой восточной границы Германии определят этот избирательный цикл."
 WGR_Otto_Remer: "Отто Эрнст Ремер"
 WGR_Otto_Remer_desc: "Социалистическая партия Рейха получила достаточно мест, чтобы получить большинство в Бундестаге. Отто Эрнст Ремер, бывший генерал-майор Второй мировой войны, станет новым канцлером Германии и намерен \"восстановить Фатерлянд\".'"
 WGR_crusade_on_left_parties: "Крестовый поход против левых"
 WGR_crusade_on_left_parties_desc: "Либералы, социалисты, коммунисты-неважно, какой ярлык они сами себе навешивают. Все эти низшие идеологии вредны для Рейха. Мы очистим истинную немецкую пшеницу от плесени."
 WGR_educational_propaganda: "Пропаганда образования"
 WGR_educational_propaganda_desc: "Первый шаг к восстановлению нашего законного места лежит в сердцах и умах нашего народа. Обучая их истории нашего народа и его свершениям, от Арминия до Карла Великого, от Фридриха Великого до Отто фон Бисмарка, мы привьем следующему поколению силу и гордость немецкого народа."
 SOV_Condemn_Western_Capitalism: "Осудить западный капитализм"
 SOV_Condemn_Western_Capitalism_desc: "Западный финансовый капитализм остается опасной угрозой, которую навязывают нам страны, обрекшие нас на эту участь. Новый Рейх не может и не потерпит, чтобы эти капиталисты держали нож, направленный нам в спину."
 WGR_Embrace_Strasserist_Economics: "Штрассеровская экономика"
 WGR_Embrace_Strasserist_Economics_desc: "Братья Штрассер были правы, отказавшись от капитализма ради социалистического государства, ради блага государства, а не ради народа, что привело к такой мерзости, как коммунизм. Мы должны применить идеи Штрассера на практике, если хотим укрепить государство."
 WGR_Expel_Religous_and_Political_Enemies: "Изгнать религиозных и политических соперников"
 WGR_Expel_Religous_and_Political_Enemies_desc: "Многие из вернувшихся немецких лидеров были выходцами из коррумпированной монархии или неумелого Веймарского правительства. Еще хуже те христианские и иудейские лидеры, которые вернулись. Мы должны любой ценой сохранить единство Германии. Изгнать этих предателей из наших земель!"
 WGR_Indoctrinate_the_Youth: "Воспитание молодёжи"
 WGR_Indoctrinate_the_Youth_desc: "Мы реформируем Лигу немецкой рабочей молодежи, чтобы преподавать наши учения и наши пути следующему поколению. Только таким образом мы можем гарантировать, что будущее Германии останется в руках немцев!"
 WGR_Election_of_1949: "Выборы 1949 года"
 WGR_Election_of_1949_desc: "Сегодня день выборов в первый Бундестаг. Это будут наши первые выборы с 1933 года. Тот, кого мы выберем, определит будущее новой федеративной республики."
 WGR_Konrad_Adenauer_49: "Конрад Аденауэр"
 WGR_Konrad_Adenauer_49_desc: "На первых выборах Христианско-Демократический Союз обеспечил себе большинство мест и сформирует коалицию с либеральными Свободными демократами и консервативной немецкой партией. Конрад Аденауэр, бывший мэр Кельна, будет исполнять обязанности нашего канцлера."
 WGR_Denounce_Denazification: "Осудить денацификацию"
 WGR_Denounce_Denazification_desc: "Продолжение процесса денацификации будет способствовать росту крайнего национализма среди миллионов людей, которые все еще поддерживают нацистский режим и угрожают навсегда исключить их из немецкой жизни. Поэтому мы должны осудить эту практику и предложить амнистию нацистским военным преступникам."
 WGR_Begin_Assasination_Plot: "Подготовка к убийству"
 WGR_Begin_Assasination_Plot_desc: "Мы планируем выплатить государству Израиль репарации за расходы по переселению многих европейских евреев, а также компенсацию за ущерб, причиненный предыдущими нацистскими практиками. Однако это, по-видимому, не принято многими, и есть те, кто готов остановить это любыми средствами..."
 WGR_Assassination_Failed: "Попытка покушения провалено"
 WGR_Assassination_Failed_desc: "Пакет, адресованный канцлеру Аденауэру, взорвался в штаб-квартире мюнхенской полиции, убив одного баварского полицейского. Хотя это были, скорее всего, элементы бывших израильских военизированных формирований. Мы будем держать этот вопрос в секрете, чтобы избежать роста антисемитизма."
 WGR_Assasination_of_Adenauer: "Убийство Конрада Аденауэра"
 WGR_Assasination_of_Adenauer_desc: "Пакет, адресованный канцлеру Аденауэру, взорвался в резиденции канцлера - Дворце Шаумбург. Трое были убиты, включая нашего канцлера. Людвиг Эрхард, занимавший пост министра экономики Аденауэра, станет его преемником."
 WGR_Currency_Reform: "Денежная реформа"
 WGR_Currency_Reform_desc: "Чтобы избежать ошибок прошлого, мы должны ввести немецкую марку в качестве замены рейхсмарки и Рентенмарки, а также отменить многие экономические меры нацистской эпохи, чтобы защитить ее от гиперинфляции и положить конец бартеру и системе черного рынка, созданной во время оккупации."
 WGR_Petersburg_Agreement: "Петербургское соглашение"
 WGR_Petersburg_Agreement_desc: "Подписав Петербургское соглашение, мы можем официально начать наш первый серьезный шаг к восстановлению нашего суверенитета и прекращению деиндустриализации."
 WGR_End_Denazificaiton: "Остановить денацификацию"
 WGR_End_Denazificaiton_desc: "Мы положим конец политике денацификации, которая, как оказалось, принесла больше вреда, чем пользы. Действительно, в международном сообществе мало кто встанет на нашу сторону в этом вопросе."
 WGR_Economic_Recovery: "Восстановление экономики"
 WGR_Economic_Recovery_desc: "В том, что мы назвали \"экономическое чудо\", наша экономика успешно восстала из пепла Второй мировой войны. Мы будем продолжать развивать нашу экономику, чтобы конкурировать с другими западными державами."
 WGR_Konrad_Adenauer_53: "Конрад Аденауэр"
 WGR_Konrad_Adenauer_53_desc: "Христианско-демократический Союз обеспечил себе большинство мест, но ему не хватило лишь одного места для получения однопартийного большинства. Таким образом, они сформируют коалицию со Свободными демократами. Нашим канцлером станет глава ХДС Конрад Аденауэр."
 WGR_Spandau_Seven: "Шпандауская семёрка"
 WGR_Spandau_Seven_desc: "Мы будем ходатайствовать об освобождении семерых в Шпандау, семи военных преступников, которые были осуждены в Нюрнберге и заключены в тюрьму Шпандау в Западном Берлине."
 WGR_Social_Market_Economy: "Социальная рыночная экономика"
 WGR_Social_Market_Economy_desc: "Мы создадим социально-экономическую модель, сочетающую в себе свободную рыночную экономическую систему и социальную политику, создающую как справедливую конкуренцию на рынке, так и государство всеобщего благосостояния. Таким образом, сочетается свободная инициатива и социальное обеспечение на основе конкурентной экономики."
 WGR_conservative_ventures: "Консервативные предприятия"
 WGR_conservative_ventures_desc: "Несмотря на принятие этой новой социально-экономической модели, мы должны сохранить для себя консервативные ценности, которые привели нас к нашим победам в прошлом."
 WGR_Continued_Economic_Development: "Продолжение экономического развития"
 WGR_Continued_Economic_Development_desc: "Наше дальнейшее экономическое развитие позволило нам теперь быть на одном уровне с нашими соседями. Безработица неуклонно снижается, заработная плата растет, а уровень жизни среднего немца значительно улучшился по сравнению с довоенной эпохой. Воистину это \"экономическое чудо\"."
 WGR_Konrad_Adenauer_57: "Конрад Аденауэр"
 WGR_Konrad_Adenauer_57_desc: "Христианско-Демократический Союз обеспечил себе явное большинство на выборах благодаря своей роли в укреплении экономики. Конрад Аденауэр, старший государственный деятель и глава ХДС, будет исполнять обязанности нашего канцлера."
 WGR_Return_of_Soviet_POWs: "Возвращение немецких военнопленных"
 WGR_Return_of_Soviet_POWs_desc: "Мы потребуем возвращения десяти тысяч немецких военнопленных, находящихся в настоящее время в заключении в Советском Союзе. В обмен мы будем готовы установить внешние отношения с коммунистической сверхдержавой."
 WGR_Pension_Reform: "Пенсионная реформа"
 WGR_Pension_Reform_desc: "Наше правительство приступит к внедрению усиленной пенсионной системы, которая обеспечит хорошую жизнь пенсионерам."
 WGR_Oder_Neisse_Controversy: "Линия Одер-Нейсе"
 WGR_Oder_Neisse_Controversy_desc: "После окончания Второй мировой войны Польша при поддержке СССР раздвинула восточные границы Германии, очертив их вдоль рек Одер и Нейсе. Наши национальные интересы на наши территории к востоку от этой линии вызвали споры с советами, польскими и западными союзниками."
 WGR_Recognize_the_Border: "Признать границы"
 WGR_Recognize_the_Border_desc: "Мы решили согласиться с требованиями западных держав и принять линию Одер-Нейсе в качестве нашей восточной границы, если Германия когда-нибудь воссоединится."
 WGR_Non_Aggression_Pact_with_Poland: "Пакт о ненападении с Польшей"
 WGR_Non_Aggression_Pact_with_Poland_desc: "Для того чтобы укрепить наше дело до обещания мира и уважения чужого территориального суверенитета, мы откроем диалог с Польшей и заверим ее, что не откажемся от статуса нашей общей границы."
 WGR_Kurt_Schumacher: "Курт Шумахер"
 WGR_Kurt_Schumacher_desc: "На первых выборах Социал-демократическая партия Германии обеспечила себе большинство мест на федеральных выборах и сформирует коалицию со Свободной демократической партией. Курт Шумахер, глава СДПГ, станет нашим первым послевоенным канцлером."
 WGR_Erich_Ollenhauer_53: "Эрих Олленхауэр"
 WGR_Erich_Ollenhauer_53_desc: "Социал-демократическая партия Германии обеспечила себе большинство мест на федеральных выборах. Они сформируют коалицию со Свободной демократической партией, чтобы добиться контроля большинства. Эрих Олленхауэр, сменивший покойного Курта Шумахера, станет нашим новым канцлером."
 WGR_Erich_Ollenhauer_57: "Эрих Олленхауэр"
 WGR_Erich_Ollenhauer_57_desc: "Социал-демократическая партия Германии обеспечила себе абсолютное большинство мест на федеральных выборах. Эрих Олленхауэр будет нашим новым канцлером."
 WGR_Treaty_of_Rome: "Римский договор"
 WGR_Treaty_of_Rome_desc: "Римский договор после его подписания позволит нам создать таможенный союз, Европейское экономическое сообщество (предшественник современного Европейского Союза), а вместе с ним и интегрировать нашу сильную экономику с экономикой других западноевропейских демократий."
 WGR_Strengthen_Executive_Powers: "Укрепление исполнительной власти"
 WGR_Strengthen_Executive_Powers_desc: "С Шумахером во главе мы можем начать планы по внесению изменений в Конституцию и усилению роли президента, официального главы государства Западной Германии"
 WGR_Establish_Relations_with_the_Eastern_Bloc: "Налаживание отношений с Восточным блоком"
 WGR_Establish_Relations_with_the_Eastern_Bloc_desc: "Укрепляя отношения с государствами Восточного блока, мы, как мы надеемся, сможем работать над созданием дорожной карты интеграции капиталистического Запада и коммунистического Востока."
 WGR_Ollenhauer_Plan: "План Олленхауэра"
 WGR_Ollenhauer_Plan_desc: "Мы будем призывать к созданию трансевропейского альянса безопасности вместо НАТО и Варшавского договора, в котором воссоединенная Германия, как мы надеемся, выступит в качестве равноправного партнера."
 WGR_Recognize_the_Oder_Neisse_Border: "Признать границу Одер-Нейсе"
 WGR_Recognize_the_Oder_Neisse_Border_desc: "До боли очевидно, что возвращение земель за линией Одер-Нейсе - это не что иное, как фантазия. В целях обеспечения отношений с Восточным блоком, мы признаем эту границу официальной."
 WGR_Reject_European_Cooperation: "Отказаться от Европейского сотрудничества"
 WGR_Reject_European_Cooperation_desc: "Сотрудничество с западными союзниками и их общеевропейскими институтами будет только способствовать укреплению их капиталистической позиции в отношении Германии и усилению контроля союзников над нашими делами. Мы не можем позволить этому продолжаться."
 WGR_Move_the_Capital_to_Frankfurt: "Переместить столицу в Франкфурт"
 WGR_Move_the_Capital_to_Frankfurt_desc: "Франкфурт был естественной столицей Германии на протяжении многих веков, а также родиной немецкой революции 1848 года. Поэтому было бы разумно перенести нашу столицу во Франкфурт."
 WGR_Encourage_Heavy_Industry: "Стимулирование тяжелой промышленности"
 WGR_Encourage_Heavy_Industry_desc: "Германия - это индустриальная держава, и независимо от того, хотят ли западные державы верить в это или нет, мы восстановим нашу промышленную мощь."
 WGR_Dirigisme_Directed_Growth: "Дирижизм"
 WGR_Dirigisme_Directed_Growth_desc: "Французы использовали дирижизм, который включал использование индикативного экономического планирования в дополнение к рыночному механизму и создание государственных предприятий в стратегических секторах. Возможно, было бы разумно реализовать эту стратегию в отношении нашей экономики."
 WGR_Establish_the_Social_Welfare_State: "Создание системы всеобщего благосостояния"
 WGR_Establish_the_Social_Welfare_State_desc: "С помощью доходов, полученных от программы дирижизма, мы можем начать перестраивать устаревшую систему социального обеспечения и лучше заботиться о наших гражданах."
 WGR_Soviet_Outreach: "Советская пропаганда"
 WGR_Soviet_Outreach_desc: "Агрессивная политика Запада нисколько не приблизит нас к воссоединению двух половин Германии. Настало время поощрять более дружественные отношения с советами в надежде, что мы сможем оставить в стороне наши разногласия как социалистические страны."
 WGR_Neutral_Unified_Germany: "Нейтральная единая Германия"
 WGR_Neutral_Unified_Germany_desc: "Мы будем вести переговоры с Москвой. Мы будем готовы вести переговоры о создании единого германского государства в обмен на полный и абсолютный нейтралитет во всех политических делах за рубежом."
 WGR_Reconstruction_of_Germany: "Реконструкция Германии"
 WGR_Reconstruction_of_Germany_desc: "Теперь, когда Германия воссоединилась, мы можем начать процесс исцеления и вернуть нашей стране былую славу."
 WGR_Continue_Denazificaiton: "Продолжить денацификацию"
 WGR_Continue_Denazificaiton_desc: "Нацисты и их сторонники совершили преступления как против народа, так и против моральной порядочности. Мы будем продолжать процедуру денацификации до тех пор, пока Германия не освободится от их злобы."
 WGR_Raids_on_formal_nazi_strongholds: "Рейды против нацистов"
 WGR_Raids_on_formal_nazi_strongholds_desc: "Несмотря на наши усилия и приверженность денацификации Германии, все еще существует много убежищ, где фанатичные последователи этого злого режима все еще исповедуют свои ненавистные вероучения. Мы должны проникнуть в эти крепости и уничтожить их."
 WGR_Nationalize_Heavy_Industry: "Национализивать тяжелую промышленность"
 WGR_Nationalize_Heavy_Industry_desc: "Владельцы многих немецких компаний несут ответственность за финансирование прихода нацистов к власти. Мы должны арестовать этих собственников и поставить эти компании под прямой контроль государства."
 WGR_Dirigisme_Economics: "Экономика дирижизма"
 WGR_Dirigisme_Economics_desc: "Теперь, когда мы поставили под свой контроль многие немецкие предприятия тяжелой промышленности, следующим шагом будет побуждение государственных и частных субъектов вести себя оптимально в экономической сфере. Это планирование должно стать ключом к восстановлению нашей истерзанной войной страны."
 WGR_Fate_of_the_KPD: "Судьба КПГ"
 WGR_Fate_of_the_KPD_desc: "С созданием Германской Демократической Республики Коммунистическая партия Германии превратилась в оболочку своего прежнего \"я\". Пришло время решить, что будет с этой умирающей политической партией."
 WGR_Marginalize_the_KPD: "Уменьшить влияние КПГ"
 WGR_Marginalize_the_KPD_desc: "Как сказал Шумахер, коммунисты в конечном счете-это не более чем \"краснолицые нацисты\". Мы будем работать над тем, чтобы убрать их влияние из Бундестага и работать в направлении социалистической Германии без них."
 WGR_Erich_Ollenhauer: "Олленхауэр берет власть в свои руки"
 WGR_Erich_Ollenhauer_desc: "Глава СДПГ Курт Шумахер неожиданно скончался. В результате СДПГ избрала своим преемником Эриха Олленхауэра, и он будет служить до конца срока пребывания Шумахера на посту канцлера."
 WGR_Merge_the_SPD_and_KPD: "Объединение СДПГ и КПГ"
 WGR_Merge_the_SPD_and_KPD_desc: "СДПГ и КПД имеют схожие цели, даже если у нас были разные взгляды на то, как их достичь. Давайте сольем эти две партии воедино и создадим на нашей родине настоящее социалистическое государство."
 WGR_A_Western_SED: "Восточная SED"
 WGR_A_Western_SED_desc: "Как восточные немцы объединили СДПГ и КПД в партию Социалистического единства, так и мы сами сделали то же самое. И точно так же, как это сделала Восточная SED, мы будем убирать другие политические партии и политические фракции. Мы сделаем Германию Единой под Красным Знаменем!"
 WGR_Marxist_Reunification: "Воссоединение социалистов"
 WGR_Marxist_Reunification_desc: "Поскольку Западная SED является единственной политической силой на Западе, возможно, пришло время объединить эти две половинки вместе."
 WGR_Ban_the_Socialist_Reich_Party: "Запрет Cоциалистической партии Рейха"
 WGR_Ban_the_Socialist_Reich_Party_desc: "Мы не можем допустить, чтобы антиеврейское поведение распространилось по всей Германии в результате недавнего покушения. Давайте обеспечим это, используя власть судов, чтобы запретить неонацистскую Социалистическую партию Рейха."
 WGR_Rise_of_the_Socialist_Reich_Party: "Подъем Социалистической партии Рейха"
 WGR_Rise_of_the_Socialist_Reich_Party_desc: "Совершенно очевидно, что Израиль спонсировал и санкционировал убийство нашего великого канцлера. Мы будем использовать эти антиеврейские настроения, чтобы предотвратить возвращение неонацистской политики."
 WGR_Keep_Remer: "Фюрер Эрнст Ремер"
 WGR_Keep_Remer_desc: "Генерал Ремер сделал очень много для того, чтобы обеспечить власть Рейха. В интересах Социалистической партии Рейха и самого Отечества решено сохранить его в качестве нового фюрера"
 WGR_Expelle_Backlash: "Выступить против СДПГ"
 WGR_Expelle_Backlash_desc: "Аденауэр пытается подписать пакт о ненападении с Польшей в обмен на признание границы Одер-Нейсе. Мы не можем этого допустить. Давайте обратимся к ХДС с петицией, что мы никогда больше не будем голосовать за них, если они продолжат свои планы."
 WGR_Condenm_Oder_Neisse_Border: "Осудить границу Одер-Нейсе"
 WGR_Condenm_Oder_Neisse_Border_desc: "В результате этих петиций и протестов мы примем требования изгнанного лобби и осудим границу Одер-Нейсе в ее нынешнем виде."