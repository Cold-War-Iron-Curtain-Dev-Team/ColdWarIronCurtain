 korean_war_devastation: "Разрушительная Корейская война"
 korean_war_devastation_tt: "Корейский полуостров будет страдать от крайнего количества физических разрушений с этим шагом, через несколько месяцев регион может лишиться надлежащей инфраструктуры для постоянного прогресса."
 Korean_War_Devastation_2_TT: "Из-за обширной бомбардировочной кампании американцев подавляющее большинство промышленных, инфраструктурных и сельскохозяйственных зданий было повреждено без ремонта. Кроме того, из-за бомбардировки плотин голод теперь неизбежен из-за массового затопления сельскохозяйственных угодий и вызванных этим неурожаев..."
 Firebombing_Devastation: "Огненное опустошение"
 korean_war_devastation.1.d: "Надежды северокорейцев на то, что китайская интервенция приведет к объединению Кореи, кажутся разбитыми, поскольку силы ООН остановили их продвижение. К сожалению для ООН, они сталкиваются с аналогичной проблемой, поскольку усилия по контратаке продолжают тормозиться, поскольку фронт становится все более статичным. До сих пор введение новых сил в Корейскую войну не удалось переломить ход событий, будь то первоначальное вмешательство ООН или китайцев. Руководство обеих сторон продолжает обещать прорыв, однако по мере того, как фронт укрепляется, конечным результатом, по-видимому, становится все большее насилие и опустошение, обрушивающиеся на народ Кореи и ее города."
 kwp_party_strength: "Сила рабочей партии Кореи"
 korean_war_devastation.2.d: "Соединенные Штаты начали массированную бомбардировку Северной Кореи. Командование ООН заявило, что бомбардировщики нацелены на северокорейские линии снабжения и промышленные центры. Они поспешили подчеркнуть, что бомбардировки призваны остановить неприкрытую агрессию Северной Кореи и помешать им продолжать наступательные операции. Северокорейское правительство в своем собственном заявлении осудило интенсивные бомбардировки, заявив, что они носят неизбирательный характер и приводят к массовым жертвам среди гражданского населения. В заявлении добавлялось, что взрывы являются признаком отчаяния Запада и что северокорейский народ продолжит свою священную миссию. Массированная кампания воздушных бомбардировок знаменует собой новую эскалацию конфликта в Восточной Азии."
 korean_war_devastation.3.d: "Трусливые империалистические собаки начали беспорядочные бомбардировки наших городов и дорог. Это, без сомнения, должно поколебать волю нашего народа и максимально увеличить пролитие невинной крови. Однако они недооценивают нашу решимость, и вместо того, чтобы ослабить людей, это только укрепит их преданность выполнению миссии. Наши военачальники предупреждают, что бомбардировки скажутся на снабжении войск и производстве оружия, но обещают, что народная армия будет продолжать упорствовать. Наши советники по иностранным делам отмечают, что взрывы указывают на отчаяние врага, и мы должны распространить информацию о вопиющей резне нашего народа, чтобы ослабить его решимость."
  
