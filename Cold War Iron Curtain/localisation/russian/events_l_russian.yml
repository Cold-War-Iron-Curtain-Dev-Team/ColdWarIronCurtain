l_russian:
 Currency.1.d: "Официальное сообщение, переданное Иорданским Хашимитским Королевством вместе с бывшими членами Трансиорданского совета, объявило о создании официальной национальной валюты. Иорданский динар должен заменить предыдущий палестинский фунт, реликтовую валюту предыдущей британской Палестинской администрации региона. С момента обретения Иорданией независимости в 1946 году идеи введения и создания национальной валюты были популярны среди всех политических кругов. В настоящее время в 1949 году действует временный 35 закон, принятие создания валюты была единогласно принята в Иордании. Ожидания от недавно сформированного Иорданского валютного совета предполагают, что Динар будет официально введен в действие к 1 июля 1950 года, официально прекратив прием устаревшей британской Палестинской валюты. Спецификации валюты в соответствии с иорданским валютным Советом предполагают номиналы монет: 1 , 5 , 10 , 20 , 50 и 100. Номиналы купюр: 1/2, 1, 5 ,10 , 50, и 50 динар. Еще раз мир может стать свидетелем рождения новой валюты."
  
 ace_promoted.1.t: "Летчик-ас получает повышение"
 ace_promoted.2.t: "Возвращение аса"
 ace_promoted.1.d: "Мало кто рискует собой так отчаянно, как отважные пилоты [Root.GetAdjective] ВВС. [From.GetName] [From.GetSurname], опытный пилот с позывным [From.GetCallsign], не просто возвращается без потерь из полетов над регионом [From.GetMissionRegion], но и одерживает убедительные победы в важнейших воздушных боях.\n\nСимвол истинного [Root.GetAdjective] мужества, [From.GetName] получает заслуженное повышение, с восторгом встречаемое публикой. Хотя для обычных людей война - скорее, ад, чем слава, герои необходимы, чтобы следовать их примеру."
 ace_promoted.1.d_major: "Мало кто рискует собой так отчаянно, как отважные пилоты [Root.GetAdjective] ВВС. [From.GetName] [From.GetSurname], опытный пилот с позывным [From.GetCallsign], не просто возвращается без потерь из полетов над регионом [From.GetMissionRegion], но и пилотирует свой самолет [From.GetWing] с необычайным мастерством. Недавний полет над регионом [From.GetMissionRegion] доказал, что [From.GetName] - это настоящий ас, чье участие в боевых действиях неоценимо.\n\nСимвол истинного [Root.GetAdjective] мужества, [From.GetName] получает вполне заслуженное повышение, с восторгом встречаемое публикой. Хотя для обычных людей война - скорее, ад, чем слава, герои необходимы, чтобы следовать их примеру."
 ace_promoted.1.a: "Смелость города берет."
 ace_died.1.t: "Гибель пилота [From.GetCallsign] над регионом [From.GetMissionRegion]"
 ace_died.1.d: "Самый известный в государстве [From.Owner.GetName] ас-[From.GetAceType] [From.GetFullName] погиб, выполняя ответственное задание над регионом [From.GetMissionRegion]. К несчастью, поскольку [From.GetCallsign] является кумиром миллионов, такая смерть не пройдет незамеченной и станет для народа тяжелым ударом.\n\nМы хотели бы найти способ скрыть это, но долгое отсутствие такой известной персоны, как [From.GetName], скоро вызвало бы подозрения. В конечном итоге, эта гибель - тоже часть великой легенды, которая надолго переживет все наши мелкие текущие невзгоды."
 ace_died.1.d_major: "Самый известный в государстве [From.Owner.GetName] ас-[From.GetAceType] [From.GetFullName] погиб при выполнении ответственного задания. Самолет [From.GetWingShort] был замечен пикирующим в клубах пламени над регионом [From.GetMissionRegion] после боя с противником. К несчастью, поскольку [From.GetCallsign] является кумиром миллионов, такая смерть не пройдет незамеченной и станет для народа тяжелым ударом.\n\nМы хотели бы найти способ скрыть это, но долгое отсутствие такой известной персоны, как [From.GetName], скоро вызвало бы подозрения. В конечном итоге, эта гибель - тоже часть великой легенды, которая надолго переживет все наши мелкие текущие невзгоды."
 ace_died.1.a: "Живая легенда - это еще лучше."
 ace_killed_by_ace.1.t: "[From.GetFullName] сбит асом с позывным [Prev.GetCallsign]"
 ace_killed_by_ace.1.d: "Пилоты, возвращавшиеся из региона [From.GetMissionRegion], сообщают, что эскадрилья [Prev.Owner.GetAdjective] самолетов, во главе которых был знаменитый ас с позывным [Prev.GetCallsign], нацелилась уничтожить [From.GetCallsign]. Сбив несколько вражеских самолетов и несколько раз увернувшись от [Prev.Owner.GetAdjective] огня, [From.GetCallsign] проиграл бой пилоту [Prev.GetCallsign], который сманеврировал более умело и прицельным попаданием пробил бак с горючим. Самолет [From.GetName] [From.GetSurname] загорелся и спикировал вниз над регионом [From.GetMissionRegion], объятый пламенем.\n\nМужество пилота [From.GetFullName] всегда было примером для многих. Гибель такого национального героя тяжело ударит по [From.Owner.GetAdjective] ВВС и станет тяжелой утратой для всей нашей нации. Пока мы скорбим, [Prev.Owner.GetName] чествует [Prev.GetFullName] как героя, и наша трагедия становится еще более горькой."
 ace_killed_by_ace.1.d_major: "Пилоты, возвращавшиеся из региона [From.GetMissionRegion], сообщают, что эскадрилья [Prev.Owner.GetAdjective] самолетов, во главе которых был знаменитый ас с позывным [Prev.GetCallsign], нацелилась уничтожить [From.GetCallsign]. Сбив несколько вражеских самолетов и несколько раз увернувшись от [Prev.Owner.GetAdjective] огня, [From.GetCallsign] потерпел поражение от [Prev.GetCallsign], который сманеврировал более умело и прицельным попаданием пробил бак с горючим. Самолет [From.GetName] [From.GetSurname] загорелся и спикировал вниз над регионом [From.GetMissionRegion], объятый пламенем.\n\n[From.GetFullName] всегда проявлял несравненное мужество и был примером для многих. Гибель такого национального героя тяжело ударит по [From.Owner.GetAdjective] ВВС и станет тяжелой утратой для всей нации. Пока мы скорбим, [Prev.Owner.GetName] чествует [Prev.GetFullName] как героя, и наша трагедия становится еще более горькой."
 ace_killed_by_ace.1.a: "Сокрушительная потеря для всех нас"
 ace_killed_other_ace.1.t: "[From.GetFullName] сбил аса с позывным [Prev.GetCallsign]"
 ace_killed_other_ace.1.d: "Последний полет над регионом [From.GetMissionRegion] обернулся большим успехом для [From.Owner.GetAdjective] ВВС по разным причинам. По донесениям стало известно о героизме, который проявил [From.GetFullName], одержав верх над [Prev.Owner.GetAdjective] пилотом по имени [Prev.GetName] [Prev.GetSurname] с позывным [Prev.GetCallsign]. [From.GetCallsign] использовал себя как приманку, чтобы [Prev.GetCallsign] угодил в ловушку и [From.Owner.GetAdjective] пилоты смогли уничтожить эскадрилью, которую он вел. [From.GetCallsign] обманным маневром сбил с толку [Prev.Owner.GetAdjective] самолеты и одним выстрелом одержал победу. [Prev.GetCallsign] сгорел над регионом [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным врагом, сбившим многих [From.Owner.GetAdjective] пилотов. Это великая победа, она показывает все величие наших героев и их подвигов."
 ace_killed_other_ace.1.d_major: "Последний полет над регионом [From.GetMissionRegion] обернулся большим успехом для [From.Owner.GetAdjective] ВВС по разным причинам. По донесениям стало известно о героизме, который проявил [From.GetFullName], одержав верх над [Prev.Owner.GetAdjective] пилотом по имени [Prev.GetName] [Prev.GetSurname] с позывным [Prev.GetCallsign]. [From.GetCallsign] использовал себя как приманку, чтобы [Prev.GetCallsign] угодил в ловушку и [From.Owner.GetAdjective] пилоты смогли уничтожить эскадрилью, которую он вел. [From.GetCallsign] обманным маневром сбил с толку [Prev.Owner.GetAdjective] самолеты и одним выстрелом одержал победу. [Prev.GetCallsign] сгорел над регионом [From.GetMissionRegion].\n\n[Prev.GetFullName] был грозным врагом, сбившим многих [From.Owner.GetAdjective] пилотов. Это великая победа, она показывает все величие наших героев и их подвигов."
 ace_killed_other_ace.1.a: "[From.Owner.GetName] не забудет такую победу!"
 aces_killed_each_other.1.t: "[From.GetFullName] погиб"
 aces_killed_each_other.1.d: "Выполняя последнее задание, наш знаменитый ас-[From.GetAceType] [From.GetFullname] сразился с пилотом по имени [Prev.GetFullName]. Расстреляв все боеприпасы и не имея возможности ускользнуть, [From.GetCallsign] сманеврировал, уходя от огня [Prev.Owner.GetAdjective] самолетов и пошел на таран против [Prev.GetCallsign].\n[From.GetCallsign] и [Prev.GetCallsign] погибли, их самолеты сгорели над регионом [From.GetMissionRegion].\n\nМы можем утешиться тем, что лучший [Prev.Owner.GetAdjective] ас [Prev.GetCallsign] больше не представляет для нас угрозы, но мы потеряли любимца публики и героя, вдохновлявшего весь [From.Owner.GetAdjective] народ."
 aces_killed_each_other.1.d_major: "Выполняя последнее задание, наш знаменитый ас-[From.GetAceType] [From.GetFullname] сразился с пилотом по имени [Prev.GetFullName]. Расстреляв все боеприпасы и не имея возможности ускользнуть, [From.GetCallsign] сманеврировал, уходя от огня [Prev.Owner.GetAdjective] самолетов и пошел на таран против [Prev.GetCallsign].\n[From.GetCallsign] и [Prev.GetCallsign] погибли, их самолеты сгорели над регионом [From.GetMissionRegion].\n\nМы можем утешиться тем, что лучший [Prev.Owner.GetAdjective] ас [Prev.GetCallsign] больше не представляет для нас угрозы, но мы потеряли любимца публики и героя, вдохновлявшего весь [From.Owner.GetAdjective] народ."
 aces_killed_each_other.1.a: "Огромная потеря для всех нас"
  
  
  
  ##### PARLIAMENT EVENTS ##### 
 RAC_POL.2.t: "[GetNewspaperHeader]Расовая война"
 RAC_POL.2.d: "Недавнее решение правительства лишить права и статуса этнических меньшинств привело к насилию по всей стране. Многие граждане, ободренные действиями правительства, рассматривают их как разрешение стрелять в районы и общины людей, на которых направлены действия правительства. Слухи о поджогах, убийствах и грабежах вызвали появление групп самообороны с обеих сторон. Эти организованные группы боевиков постоянно сталкиваются и стреляют друг в друга. Правительство, похоже, бессильно или не желает сдерживать волнения. В некоторых случаях местные полицейские силы взяли ситуацию под контроль, однако есть и такие случаи, когда полиция обвиняется в насилии. Единственный способ остановить насилие-это отменить недавнее законодательство или подождать, пока боевые действия не достигнут своего завершения."
 RAC_POL.2.a: "Улучшение расовой ситуации (450 полит. власти)"
 RAC_POL.2.b: "§YТРЕБУЕТСЯ 450 ПОЛИТИЧЕСКОЙ ВЛАСТИ ДЛЯ РЕШЕНИЯ§!"
 RAC_POL.2.c: "Отказаться от требований"
 RAC_POL.2.da: "ВЫИГРАЙТЕ РАСОВУЮ ВОЙНУ! ОТПРАВЬТЕ АРМИЮ! (650 полит. власти)"
 RAC_POL.2.e: "§YТРЕБУЕТСЯ 450 ПОЛИТИЧЕСКОЙ ВЛАСТИ ДЛЯ ПОБЕДЫ!"
 RAC_POL.2.f: "§YТРЕБУЕТСЯ ВОЕННАЯ ПОЛИЦИЯ III (Борьба с беспорядками) ЧТОБЫ ВЫЙГРАТЬ§!"
 RAC_POL.2.g: "§YТРЕБУЕТСЯ ВОЕННАЯ ПОЛИЦИЯ III (Борьба с беспорядками) И 600 ПОЛИТ. ВЛАСТИ ЧТОБЫ ВЫЙГРАТЬ§!"
  
 WOM_POL.2.t: "[GetNewspaperHeader]Протесты за права женщин"
 WOM_POL.2.d: "Столица была парализована сегодня, когда тысячи людей вышли на улицы, чтобы выразить протест за расширение прав женщин. Протестующие утверждают, что правительство долгое время игнорировало роль женщин в обществе, а отсутствие реформ в конечном счете ослабляет нацию и делает женщин уязвимыми. Успешный протест вызвал аналогичные события и в других городах. Протестующие также пригрозили расширить свои действия, включив в них более прямые действия, чтобы оказать давление на правительство, чтобы оно серьезно отнеслось к их требованиям.\n\nЕдинственный способ остановить протесты - это отменить недавнее законодательство или подождать, пока протесты не будут подавлены."
 WOM_POL.2.a: "Улучшение гендерной ситуации (450 полит. власти)"
 WOM_POL.2.b: "§YТРЕБУЕТСЯ 450 ПОЛИТИЧЕСКОЙ ВЛАСТИ ДЛЯ РЕШЕНИЯ§!"
 WOM_POL.2.c: "Отказаться от требований"
  
 SAGA_POL.2.t: "[GetNewspaperHeader]Марши за права ЛГБТ меньшинства"
 SAGA_POL.2.d: "В революционном развитии событий граждане собрались на марш за признание прав ЛГБТ меньшинств. Члены этого часто игнорируемого и угнетенного сообщества объединились с союзниками, чтобы оказать давление на правительство, чтобы оно приняло меры и модернизировало законы по этому вопросу. Марш прошел в столице. Его приветствуют как успех, и он был в основном мирным. Однако контрмарш, организованный рядом оппонентов, которые утверждали, что государство не должно идти на компромисс с моралью или чувствами большинства. Эти контрпротесты были меньше, чем основной марш. В других крупных городах и поселках планируется провести дополнительные марши, чтобы продемонстрировать, на сколько людей повлияют изменения законодательства или политики по этому вопросу.\n\nЕдинственный способ остановить протесты - это отменить недавнее законодательство или подождать, пока протесты не будут подавлены."
 SAGA_POL.2.a: "Улучшить ситуацию с ЛГБТ (450 полит. власти)"
 SAGA_POL.2.b: "§YТРЕБУЕТСЯ 450 ПОЛИТИЧЕСКОЙ ВЛАСТИ ДЛЯ РЕШЕНИЯ§!"
 SAGA_POL.2.c: "Отказаться от требований"
  
 UNION_POL.1.t: "[GetNewspaperHeader]Общенациональная рабочая забастовка"
 UNION_POL.1.d: "По всей стране проходит всеобщая забастовка рабочих, возмущенных новой политикой правительства, которая ограничивает права трудящихся. Оппоненты обвиняют правительство в том, что оно подкуплено работодателями и собственниками, стремящимися эксплуатировать рабочих для получения дополнительной прибыли. Наряду с промышленными и обслуживающими работниками многие магазины на крупных рынках также закрылись в знак солидарности. Представитель правительства отверг забастовку как слабый жест и настаивал на том, что действия правительства приведут к дальнейшему экономическому росту и в конечном итоге принесут пользу рабочим. Несмотря на Храброе лицо, правительство, безусловно, потрясено тем, как агрессивно рабочие отреагировали на новую политику.\n\nЕдинственный способ остановить протесты - это отменить недавнее законодательство или подождать, пока протесты не будут подавлены."
 UNION_POL.1.a: "Улучшить положение рабочих (450 полит. власти)"
 UNION_POL.1.b: "§YТРЕБУЕТСЯ 450 ПОЛИТИЧЕСКОЙ ВЛАСТИ ДЛЯ РЕШЕНИЯ§!"
 UNION_POL.1.c: "Отказаться от требований"
  
 REL_POL.1.t: "[GetNewspaperHeader]Массовые религиозные репрессии"
 REL_POL.1.d: "Религиозные чиновники, работающие с силами безопасности, обеспечивают соблюдение надлежащих религиозных предписаний, предоставляемых правительством. Правительство утверждает, что сила нации заключается в соответствии граждан истинной практике веры. Эти усилия привели к тому, что некоторые общины оказались под пристальным вниманием из-за их несоответствия требованиям. Что касается религий меньшинств, то они сталкиваются с ограничениями в том, как они публично представляют себя, а силы безопасности насильственно удаляют вывески или рекламу, которые считаются несовместимыми с нынешней политикой. Некоторые общины сопротивляются, сообщая о крупных столкновениях, поскольку есть опасения, что действия правительства направлены на разрушение региональной идентичности и многовековой религиозной практики. В других районах толпы восторженных сторонников правительства насильственно принуждают своих соседей к повиновению, что приводит к грабежам и жестокому насилию.\n\nЕдинственный способ остановить насилие - это согласиться на прекращение огня или подождать, пока язычники не будут отправлены в ад."
 REL_POL.1.a: "Согласиться на прекращение огня"
 REL_POL.1.c: "Отказаться от требований"
 REL_POL.4.t: "[GetNewspaperHeader]Массовые религиозные репрессии"
 REL_POL.4.d: "Силы безопасности по всей стране перемещали и захватывали молитвенные дома и имущество, принадлежащее религиозным группам по всей стране. Они обеспечивают, чтобы новая правительственная политика осуществлялась с минимальным вмешательством со стороны тех, кого они называют религиозными фанатиками. Многие религиозные лидеры также содержатся под стражей, чтобы лучше перевести население к более прагматичному и материальному пониманию мира. Однако эти решительные репрессии не увенчались успехом, поскольку многие религиозные граждане вместо этого вступили в столкновения с силами безопасности, требуя освободить захваченную собственность и освободить своих лидеров. В ряде случаев столкновения приводили к тому, что полиция стреляла в толпу, чтобы разогнать ее. В других частях страны правительственные здания и транспортные средства разграбляются или сжигаются теми, кто оскорблен новой политикой. Многие видят в новой политике угрозу самобытности народа и его наследию. Правительство уже развертывает дополнительные силы на фоне слухов о том, что военным, возможно, придется в конечном итоге восстановить порядок.\n\nЕдинственный способ остановить насилие - это согласиться на прекращение огня или подождать, пока фанатики не будут убиты."
 REL_POL.4.a: "Согласиться на прекращение огня"
 REL_POL.4.c: "Отказаться от требований"
 REL_POL.2.t: "[GetNewspaperHeader]Массовые религиозные протесты"
 REL_POL.2.d: "Новая правительственная инициатива, ограничивающая привилегии и статус религий меньшинств, вызвала гнев членов этих конфессий и их сторонников по всей стране. Толпы протестующих столкнулись с сторонниками правительственной инициативы, что привело к ожесточенным уличным столкновениям и открытым беспорядкам в крупных городах по всей стране. Противники этой политики обвиняют правительство в сектантстве и преследованиях. Сторонники правительства утверждают, что новая политика отражает чувства широкой общественности и что большинство не пойдет на уступки меньшинству. Представитель правительства призвал обе стороны к спокойствию, но заявил, что правительство по-прежнему привержено своей новой политике. До сих пор несколько крупных районов были сильно повреждены в результате насилия и беспорядков.\n\nЕдинственный способ остановить беспорядки - это согласиться отменить наше законодательство или подождать, пока еретики не поймут ошибочность своих взглядов."
 REL_POL.2.a: "Согласиться со сменой курса"
 REL_POL.2.c: "Отказаться от требований"
 REL_POL.3.t: "[GetNewspaperHeader]Протесты за права верующих"
 REL_POL.3.d: "Многие присоединились к протестам, проводившимся по всей стране, призывая к большей религиозной терпимости и большему секуляризму в государстве. Протестующие представляли самые разные группы и сообщества. Большая терпимость расширила бы участие религиозных меньшинств в стране, способствуя экономическому, социальному и политическому развитию государства. Многие протестующие даже утверждали, что секуляризм сохранит почтение и престиж веры. Включение его в правительство рискует запятнать его грехами и ошибками человека.\n\nЕдинственный способ остановить беспорядки — согласиться отменить наше законодательство или подождать, пока протестующие не сдадутся."
 REL_POL.3.a: "Согласиться со сменой курса"
 REL_POL.3.c: "Отказаться от требований"
