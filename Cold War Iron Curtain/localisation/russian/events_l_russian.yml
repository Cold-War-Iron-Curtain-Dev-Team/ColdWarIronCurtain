 generic.31.t: "Возникают расовые проблемы"
 generic.31.d: "Расовая напряженность в стране резко возросла. Геттоизация, массовое подавление, расизм и многие другие ситуации в стране создали бесчисленные проблемы и раздоры для этнических меньшинств."
 generic.31.a: "Ок"
 generic.32.t: "Расовые проблемы рассеиваются"
 generic.32.d: "После неустанного прогресса расовая напряженность и большинство расовых проблем в стране рассеялись, а этнические отношения нормализовались. Гетто начинают редеть, появляются новые возможности, и страна выглядит ярче, чем когда-либо."
 generic.32.a: "Та-дам!"
  
 election.2.t: "Всенародные выборы"
 election.2.d: "Сейчас проходят всенародные выборы, и голоса скоро будут подсчитаны. Все основные партии смотрят друг на друга, чтобы сформировать или антагонизировать правительство. Кто же победит?\n\n(Примечание разработчиков: правящая партия остаётся править, если она имеет 25% народной поддержки; не правящая партия становится правящей, если у них есть 25% или более народной поддержки. Если группа схожих партий по идеологии набирает до 25%, но ни одна из них по отдельности не будет обладать 25%, то они сформируют коалицию и будут править вместе.)\n§YНынешняя правящая партия§! - [GetRulingParty] ([GetRulingIdeology])\n§YПопулярность правящей партии§! - ([GetPartySupport]}"
  
