 BUL.15.d: "Растет разрыв между БКП и молодежью. Мы должны найти способ вдохновить больше политического участия для выживания партии и рабочего класса Болгарии. Многие реформисты в сентябрьистах считают, что надо расширять досуг пионеров. Такие предложения, как массовый импорт восточногерманских «киндерпанцеров», ежегодные походы в Сибирь и летние лагеря, были поддержаны реформистской фракцией сентябрьистов. На противоположном конце спектра бескомпромиссные червненковцы призвали к более решительным действиям. Они считают, что для поддержания участия молодежи в БКП необходимо убрать ненужные декадентские прибамбасы и ввести незначительную воинскую повинность. Этот план, если он будет реализован правильно, значительно расширит BCP и обеспечит дисциплину молодежи в будущем. У обоих вариантов есть сильные и слабые стороны, и мы должны выбрать один из них, пока молодежь не отвернулась навсегда."
 BUL.16.d: "Сегодня премьер-министр Болгарии Тодор Живков объявил о начале радикального набора экономических планов, сформулированных в Тезисах Живкова. Вдохновленные Никитой Хрущевым Тезисы Живкова обещают модернизировать все аспекты болгарской экономики, уделяя особое внимание оружию и добыче полезных ископаемых. Многие обеспокоены нереалистичными целями некоторых из этих планов и их пренебрежением к развитию сельского хозяйства, однако болгарское правительство заверило, что каждый план был тщательно продуман."
 BUL.17.d: ""
 BUL.18.d: "С завершением наших усилий по модернизации между планировщиками возник раскол. Некоторые считают, что мы должны продолжать червненковскую экономическую политику, в то время как другие считают, что либерализация необходима, чтобы идти в ногу с остальной Европой. Червненковцы утверждали, что ослабление тяжелой промышленности теперь будет способствовать самоуспокоенности пролетарских масс Болгарии. Воздержание от устаревшего потребительства в их глазах создаст условия для коммунизма. Им противостоят планировщики-реформисты-социалисты, которые считают, что без технологий и удобств современной нации болгарские рабочие устанут от коммунистического проекта и полностью откажутся от него. На этот раскол в наших рядах нет четкого ответа, и любой ответ может привести к абсолютному провалу или успеху."
 BUL.19.d: "Сегодня планировщики выступили с новой смелой экономической политикой Болгарии. Они предлагают каждому планировщику и политикам провести месяц, работая с рабочими, которых они руководят. Они считают, что этот план воссоединит БКП с болгарским рабочим классом и устранит растущую разобщенность, отмеченную Тезисами Живкова."
 BUL.20.d: "За последнее десятилетие болгарская экономика накопила огромное количество долгов. Если они не будут погашены до конца финансового года, кредиторы перестанут финансировать наши проекты, и мы не сможем продолжать существовать как социалистическая нация. Для выхода из этого кризиса необходима жесткая бюджетная реформа."
 BUL.21.d: ""
 BUL.22.d: "Служба внутренней безопасности сообщила нам, что многие военные и интеллигенция устали от нашей политики либерализации и желают вернуться к червненковскому жесткому марксизму. Из-за характера угрозы мы должны быть осторожны с размещением агентов, чтобы избежать подозрений. Многие специалисты по внутренней безопасности считают, что угроза исходит от идеологов и образованных городских лидеров. По их мнению, ликвидация этого растущего класса интеллигенции предотвратит распространение вредных идей среди нашего рабочего класса. Однако в последнее время все больше агентов находят доказательства вероломства в софийском военном гарнизоне. Доказательств предательства в Болгарской Народной Армии становится все больше. Они предупреждают, что без военной чистки Болгария рискует превратиться в фанатичную красную хунту."
 BUL.23.d: ""
 BUL.24.d: "Теперь, когда наша революция обеспечена внутренне, мы должны защитить болгарское государство от капиталистических захватчиков. Наши товарищи в Албании усердно трудились, сооружая укрепления, а наши братья в Китае скапливаются вдоль реки Амур. Тем не менее, чтобы обезопасить Болгарию, мы должны полагаться на силу атома. При малочисленности населения и границе с советской марионеткой наша единственная надежда на выживание — строительство ядерного устройства. До завершения все новости о таком устройстве должны храниться в строжайшем секрете."
 BUL.26.d: "Вдохновленный товарищем Хрущевым, премьер Живков разработал план быстрой индустриализации Болгарии. План предусматривает свертывание сельскохозяйственного развития в пользу тяжелой промышленности в военной и горнодобывающей промышленности. Благодаря напряженной работе Живков заверил нас, что Болгария станет промышленным центром на Балканах. Однако небольшое меньшинство планировщиков считает наши планы слишком амбициозными. По данным министерства сельского хозяйства, Болгария не может позволить себе длительное время пренебрегать сельским хозяйством. Несмотря на мелкие возражения, ожидается, что тезисы Живкова будут иметь полный успех."
 BUL.27.d: "Болгария объявила сегодня, что она сделает большой скачок вперед. Это заявление было сделано после широко распространенных слухов о первоначальном провале Тезисов Живкова. Похоже, что БКП удвоила ставку на быструю индустриализацию и теперь обещает, что болгарская экономика станет крупнейшей экономикой на Балканах. Это заявление вызвало осуждение со стороны многих стран, обеспокоенных полным коллапсом сельского хозяйства. Несмотря на опасения, все болгарское население уже мобилизовано и отправлено в сельскую местность для быстрого ускорения индустриализации."
 BUL.28.d: "Сегодня Тодор Живков объявил о спорном решении начать отмену многих законов против гомосексуализма. Это решение было принято после того, как 26 человек были арестованы за «девиантное поведение». Однако суды поверили их истории и, что шокирует, признали их невиновными. Вскоре после этого гомосексуальность был декриминализован, и теперь гражданские союзы признаны в соответствии с болгарским законодательством. Многие критиковали такое развитие событий, причем самой откровенной группой была православная церковь, которая в редких случаях пошла против линии партии. Несмотря на сопротивление, многие рады такому позитивному развитию болгарской культуры."
 BUL.29.d: "Минувшей ночью болгарские офицеры под командованием Ивана Горуни устроили переворот и свергли премьера Живкова. Горуня объявил об окончании режима Живкова и начале новой эры жесткой линии для Болгарии. Советы поспешили осудить переворот и потребовали отставки нового правительства и освобождения Живкова и его семьи целыми и невредимыми. Эти требования вряд ли будут выполнены, поскольку болгарские войска вытесняют советские гарнизоны по всей стране. Варшавский договор уже приведен в состояние повышенной готовности, и ходят слухи о возможной интервенции. Новое болгарское правительство предупредило, что любое вторжение на ее территорию приведет к всеобщей войне между народами."
 BUL.30.d: "Прошлой ночью изменнические офицеры Софийского гарнизона попытались оппортунистически отобрать власть у нашего народного правительства. Однако Служба внутренней безопасности уже несколько месяцев знала о перевороте, и все офицеры были арестованы до того, как удалось нанести ущерб. Иван Горуня, лидер переворота, задержан и в настоящее время допрошен. Этот переворот эффектно провалился, однако вскоре нас может ожидать еще один. По этой причине мы должны жестко расправиться с военными, чтобы обеспечить безопасность демократии наших народов."
 BUL.31.d: "Сегодня войска Варшавского договора пересекли болгарскую границу, пытаясь вернуть Болгарию в советский блок. Из-за открытой враждебности румын к другим войскам пакта вторжение должно было произойти с Черного моря. Советские и восточногерманские морские пехотинцы при поддержке Венгрии и Польши высадились в Варне и Бургасе, а чехословацкие войска установили плацдарм в Созопле. Объединенные армии Варшавского договора сначала встретили ожесточенное сопротивление на окраинах Сливена, однако после серии фланговых маневров Болгарская народная армия растаяла, и всего через 3 дня София была прорвана. Болгарское правительство было задержано и в настоящее время ожидает суда. Пока Запад по этому поводу хранит молчание, и вряд ли будут какие-то официальные заявления."
 BUL.31.d: "Сегодня войска Варшавского договора пересекли болгарскую границу, пытаясь вернуть Болгарию в советский блок. Из-за открытой враждебности румын к другим войскам пакта вторжение должно было произойти с Черного моря. Советские и восточногерманские морские пехотинцы при поддержке Венгрии и Польши высадились в Варне и Бургасе, а чехословацкие войска установили плацдарм в Созопле. Объединенные армии Варшавского договора сначала встретили ожесточенное сопротивление на окраинах Сливена, однако после серии фланговых маневров Болгарская народная армия растаяла, и всего через 3 дня София была прорвана. Болгарское правительство было задержано и в настоящее время ожидает суда. Пока Запад по этому поводу хранит молчание, и вряд ли будут какие-то официальные заявления."
