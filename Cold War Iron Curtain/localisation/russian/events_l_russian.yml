 usa.1000.t: "Выборы 1952: Кандидатура от Демократов"
 usa.1000.d: "Выборы 1952: Выдвижение кандидата от Демократической партии происходит сегодня, в то время как лидером является губернатор Иллинойса Адлай Стивенсон II, сенатор США Эстес Кефаувер, известный тем, что преследовал мафию в сенате. Ходят также слухи, что президент Трумэн может в последнюю минуту баллотироваться на переизбрание и перехватить эту кандидатуру...."
 usa.1000.a: "Адлай Стивенсон II"
 usa.1000.b: "Президент Трумэн"
 usa.1000.c: "Эстес Кефаувер"
 usa.1001.t: "Выборы 1952: Кандидатура от Республиканцев"
 usa.1001.d: "Выборы 1952: Выдвижение республиканцев происходит сегодня, после 20 лет отсутствия власти республиканцы надеются вернуть себе президентство, выдвижение до сих пор даже разделено между генералом Дуайтом Эйзенхауэром и известным изоляционистом сенатором Огайо Робертом Тафтом. Хотя формально генерал Макартур не участвует в гонке, у него также есть делегаты, чтобы поддержать его."
 usa.1001.a: "Дуайт Д. Эйзенхауэр"
 usa.1001.b: "Роберт Тафт"
 usa.1001.c: "Дуглас Макартур"
 usa.1002.t: "Выборы 1952: Кандидатура от Республиканцев"
 usa.1002.d: "Выборы 1952: Выдвижение республиканцев происходит сегодня, после 20 лет отсутствия власти республиканцы надеются вернуть себе президентство, выдвижение до сих пор даже разделено между генералом Дуайтом Эйзенхауэром и известным изоляционистом сенатором Огайо Робертом Тафтом. Хотя формально генерал Макартур не участвует в гонке, у него также есть делегаты, чтобы поддержать его."
  
