 notecrisis.1.t: "Финские выборы обернулись дурно"
 notecrisis.1.d: "Скоро в Финляндии пройдут выборы, и похоже, что наш дружественный Советскому Союзу союзник Урхо Кекконен проигрывает выборы Олави Хонке. Олвай Хонка - это истинный прозападник, который не будет считаться с нами и Варшавским Договором. Это может очень навредить нам, и Финляндия, возможно, будет втянута в НАТО. Будем ли мы что-нибудь делать с выборами, попробуем что-нибудь еще или просто оставим все это и будем надеяться, что он победит?"
 notecrisis.1.a: "Склоните выборы в пользу Кекконена."
 notecrisis.1.b: "Оставьте выборы в покое. Будь что будет."
 notecrisis.1.c: "Теперь в дело должны вмешаться советы. Отправить в Финляндию нашу ноту."
  
 notecrisis.2.t: "Финская нота"
 notecrisis.2.d: "Советы прислали нам новый договор. Они хотят обеспечить оборону обеих стран. Под этим они подразумевают открытие советской военно-морской базы Поррка рядом с Хельсинки, размещение советских вооружений и войск в Финляндии и обеспечение того, чтобы Финляндия оставалась в центре внимания СССР и Варшавского договора. Некоторые из наших советников говорят, что это может помочь нам стать лучшими союзниками с Востоком, но некоторые говорят, что это может повредить отношениям с Западом. Что мы ответим на ноту?"
 notecrisis.2.a: "Согласиться с нотой. Советы близки нам."
 notecrisis.2.b: "Отказаться от ноты. Мы останемся нейтральны."
  
 notecrisis.3.t: "Финляндия отказывает"
 notecrisis.3.d: "Финское правительство отклонило финскую ноту, заявив, что они хотят оставаться нейтральными. Это может заставить их повернуться к Западу. Финляндия - важная страна, которая должна быть нашим союзником. Что мы должны сделать в этом нотном кризисе?"
 notecrisis.3.a: "Финское правительство останеться нейтральным."
 notecrisis.3.b: "Мы попробовали дипломатический вариант. Теперь мы должны попробовать силовой вариант."
 notecrisis.3.c: "Мы будем вести с ними переговоры."
  
 notecrisis.4.t: "Советские войска пересекают границу Финляндии"
 notecrisis.4.d: "Советы ввели войска в нашу страну без нашего разрешения. Они оккупировали города вблизи советской границы и продвигаются все дальше и дальше. Советы заявили, что это делается для того, чтобы защитить нас от угроз Запада. Должны ли мы доверять им, или это угрожает нашей независимости как нации?"
 notecrisis.4.a: "Позвольте Советскому Союзу оккупировать нас. Мы станем их союзниками."
 notecrisis.4.b: "Это нарушение нашей независимости и акт войны. Предупредите военных открыть огонь по советам."
  
 notecrisis.5.t: "Переговоры в Хельсинки"
 notecrisis.5.d: "Советы послали в Хельсинки дипломата для переговоров по поводу финской ноты. Советы сказали, что если мы присоединимся к ним, то получим землю, потерянную из нашего прошлого. Запад сказал нам, чтобы мы не кланялись русскому медведю и оставались независимым государством. Восток сказал, что мы должны присоединиться к ним и быть вечными друзьями. Наш народ сказал, что он хочет быть нейтральным независимым государством. Мир наблюдает за нами сегодня, так что же мы решим?"
 notecrisis.5.a: "Мы станем союзниками СССР."
 notecrisis.5.b: "Мы станем советской республикой, частью СССР."
 notecrisis.5.c: "Мы станем частью СССР."
 notecrisis.5.e: "Мы останемся независимы."
  
 notecrisis.6.t: "Неудачные переговоры в Хельсинки"
 notecrisis.6.d: "Финны заявили, что не склонятся перед \"русским медведем\" и хотят быть независимым нейтральным государством. Это не соответствует нашим планам, и дипломатическое решение, похоже, потерпело неудачу. Все, что мы можем сделать, это военный вариант или просто оставить весь нотный кризис в покое."
 notecrisis.6.a: "Оставим нотный кризис в покое."
 notecrisis.6.b: "Военный вариант должен быть реализован. Готовьте войска."
  
 notecrisis.7.t: "Советско-Финские Реформы"
 notecrisis.7.d: "Финское правительство предоставило американским военным доступ в Финляндию. Похоже, они не хотят проиграть еще одну 2-ю Зимнюю войну. Они приняли правильное решение, и теперь пришло время сделать следующий шаг. Должны ли мы установить советское марионеточное государство в Финляндии, превратить Финляндию в ССР, полностью присоединить их к СССР, или просто позволить им быть нашим союзником и иметь наш военный доступ?"
 notecrisis.7.a: "Сообщите Финляндии о новой Финской Демократической Республике."
 notecrisis.7.b: "Пришло время Финляндии стать советской республикой. Сообщите им об этом."
 notecrisis.7.c: "Аннексировать Финляндию."
 notecrisis.7.e: "Оставь их в покое. Военного доступа нам будет вполне достаточно."
  
 notecrisis.8.t: "Советский Союз желает Коммунистическую Финляндию"
 notecrisis.8.d: "Советский Союз прислал нам новую ноту с просьбой создать новое коммунистическое правительство. Мы станем Финской Демократической Республикой. В этом есть своя выгода, так как мы будем союзниками СССР, и советы даже предложили землю, которая была отнята у нас во время 1-й Зимней войны. Хотя мы всегда были нейтральной страной. Что же нам делать?"
 notecrisis.8.a: "Да здравствует Финская Демократическая Республика!"
 notecrisis.8.b: "Мы всегда были нейтральны. Мы не изменимся."
  
 notecrisis.9.t: "Образована Финская Демократическая Республика!"
 notecrisis.9.d: "Финляндия решила последовать примеру коммунистического правительства и образовала Финскую Демократическую Республику. Мы сделали заявление для них, как для коммунистической нации, что мы дадим им часть земли, которую они потеряли раньше. У нас есть 3 варианта, как это сделать. Финляндия могла бы вернуть свои земли после Зимней войны в качестве компенсации за то, что они сформировали коммунистическое правительство. Мы могли бы также дать им их землю с тех времен, когда они были частью Российской Империи, что не даст им столько земли, но все же сделает их счастливыми. Мы также можем не отдавать им ни пяди своей земли."
 notecrisis.9.a: "Даруйте им землю, которую они потеряли в Зимней войне."
 notecrisis.9.b: "Даруйте им землю, которой они владели в составе Российской Империи."
 notecrisis.9.c: "Мы разве обещали землю? Я думаю, что мы потеряли договор, ну и ладно."
  
 notecrisis.10.t: "Финляндия отрицает советское правительство"
 notecrisis.10.d: "Финская республика заявила, что хочет быть нейтральным независимым государством. Это противоречит нашим планам с нотой. Каким должен быть наш следующий шаг?"
 notecrisis.10.a: "Нам придется сделать это силой."
 notecrisis.10.b: "Государственный переворот."
 notecrisis.10.c: "Тогда оставьте их в покое. Нам нужно сохранить военный доступ."
  
 notecrisis.11.t: "Советский Союз хочет, чтобы мы были ССР"
 notecrisis.11.d: "СССР обратился с просьбой присоединиться к ним в качестве Советской Социалистической Республики и позволить нам быть еще ближе к СССР. Мы войдем в состав СССР и все равно будем иметь какую-то автономию. Советы говорили, что ССР будет больше, чем наша нынешняя граница. Однако мы будем находиться под советским контролем, и некоторые советники опасаются, что любая культура финнов может быть стерта с лица земли. Что же нам делать?"
 notecrisis.11.a: "Мы будем величайшей ССР."
 notecrisis.11.b: "Мы беспокоимся о нашей культуре. Финляндия всегда будет финской."
  
 notecrisis.12.t: "Финляндия отрицает ССР"
 notecrisis.12.d: "Финская республика заявила, что хочет быть нейтральным независимым государством. Это противоречит нашим планам с запиской. У нас есть несколько вариантов, что делать дальше. Мы могли бы сделать их счастливыми и позволить остаться нейтральными или попытаться навязать его им. Каким должен быть наш следующий шаг?"
 notecrisis.12.a: "Мы оставим их независимыми."
 notecrisis.12.b: "Нам придется сделать это силой."
 notecrisis.12.c: "Государственный переворот."
  
 notecrisis.13.t: "Финляндия будет присоединена"
 notecrisis.13.d: "Советы надеются аннексировать нас себя, как мы когда-то были под Российской империей. Советы видят в этом возможность получить больше земли и стратегическую территорию Северной Европы. Однако некоторые из советников задаются вопросом, не будем ли мы преследоваться за нашу культуру и за то, что мы всегда остаемся изгоями Востока. Некоторые советники говорят, что это отличный способ иметь вечную дружбу с СССР. Что нам делать с этим?"
 notecrisis.13.a: "Мы будем рады встать под знамя советских рабочих!"
 notecrisis.13.b: "Мы не сотрем нашу страну. Мы выбираем свободу!"
  
 notecrisis.14.t: "Финляндия против аннексии"
 notecrisis.14.d: "Финны заявили, что их культура и образ жизни не сопоставимы с нашими. Они заявили, что они - независимое государство. Это идет вразрез с нашими планами. Каждый день в Финляндии усиливаются антисоветские настроения. Что нам делать?"
 notecrisis.14.a: "Пусть Финляндия живет."
 notecrisis.14.b: "Мирного решения не будет."
 notecrisis.14.c: "Время революции."
  
  
  #####################' 
  
 brazil.1.d: "Вторая половина десятилетия была разочаровывающей для Бразилии. После участия в военных действиях союзников общее мнение политической элиты состоит в том, что южноамериканский гигант был забыт своими союзниками на севере. В то время как США вливали деньги в экономику проигравших держав, Бразилия не могла получить одобрение на кредиты, которые не соответствовали затратам на военные действия, и, что еще хуже, региональный стратегический соперник, Аргентина, снова приветствовался в Вашингтоне, несмотря на то, что он сотрудничал с нацистским режимом и содержал военных преступников, бежавших из Германии. Это в сочетании с тусклым управлением генерала Эурико Гаспара Дутры, с примерами простого плохого планирования и управления, открыло путь для возвращения все еще популярного бывшего диктатора и «военного президента» Жетулиу Варгаса."
 brazil.2.d: "Это были тяжелые пять лет. Мир снова разделен, и на горизонте маячит угроза войны. Внутри страны политические разногласия могли разрушить страну в любой момент."
 brazil.3.d: "3 октября 1960 года население проголосовало за следующего президента Бразилии."
  
  ##################### 
  
 fra.5.t: "Ратификация Парижского договора"
 fra.5.d: "Европейское объединение угля и стали принесет нам много пользы и снова сблизит европейские страны после разрушительной войны."
 fra.8.t: "Ратификация Договора о Европейском оборонительном сообществе"
 fra.8.d: "Договор о создании Европейского оборонительного сообщества, также известный как Парижский договор, создаст Европейское оборонительное сообщество (ЕОС) с общеевропейскими оборонительными силами."
 fra.9.t: "Парижский договор не подписан"
 fra.10.t: "[GetNewspaperHeader][From.GetName] Создание ЕОС"
 fra.6.t: "Парижский договор не подписан"
 fra.6.d: ""
 fra.7.t: "[GetNewspaperHeader][From.GetName] Создание ЕОУС"
 fra.7.d: "Сегодня, [From.GetNameDef] было создано Европейское объединение угля и стали. Эти европейские страны будут работать вместе, чтобы расширить свою промышленность и поделиться материалами для восстановления после Второй мировой войны."
 fra.12.t: "[From.GetName] создает план Плевена"
 fra.12.d: "[From.GetNameDef] приглашает нас присоединиться к плану Плевена. Это военное сотрудничество между нами, европейскими странами."
 fra.13.t: "[From.GetName] подписал план Плевена"
 fra.13.d: "[From.GetNameDef] подписал план Плевена и присоединился к Военному сотрудничеству."
 fra.14.t: "[GetNewspaperHeader] Создание плана Плевена"
 fra.14.d: "Сегодня, [From.GetNameDef] учредил план Плевена, военное сотрудничество между европейскими странами для обмена знаниями и опытом."
 wgr.6.t: "[From.GetName] Создает ЕОС"
 wgr.6.d: "[From.GetNameDef] приглашает нас присоединиться к Европейскому оборонному союзу. Это военное сотрудничество между нами, европейскими странами, более сильное, чем Плевенский план. Его цель - контролировать перевооружение Западной Германии."
 wgr.7.t: "[From.GetName] присоединился к ЕОС"
 wgr.7.d: "[From.GetNameDef] присоединился к Европейскому оборонному союзу и Военному сотрудничеству"
 wgr.8.t: "[GetNewspaperHeader][From.GetName] создал ЕОС"
 wgr.8.d: "\nСегодня, [From.GetNameDef] создал Европейское оборонное союз, военное сотрудничество между европейскими странами для обмена знаниями, опытом и оборудованием. Это более сильный союз, чем план Плевена, целью которого является контроль над перевооружением Западной Германии."
  
