 #election.1.t: "Election"
 #election.1.d: "Public #elections are being held, and the votes will soon be counted. All major parties are looking at one another to form up or antagonize in government. Who could possibly win?\n\n(Developer's note: The ruling party can defend its title if it has 20% popular support; another party can take over if they have 30% or more popular support. Should all parties have below 20%, the Ruling Party will also win.)"
 #election.1.o1: "The Communists won."
 #election.1.o2: "The Socialists won."
 #election.1.o3: "The Democrats won."
 #election.1.o4: "The Centrists won."
 #election.1.o5: "The Liberals won."
 #election.1.o6: "The Trotskyists won."
 #election.1.o7: "The Conservatives won."
 #election.1.o8: "The Neutrals won."
 #election.1.o9: "The Nationalists won."
 #election.1.o10: "The Fascists won."
 #election.1.o11: "The Islamists won."
 #election.1.o12: "The Ruling Party has won."
 #election.1.o13: "The Absolute Monarchists won."
 #election.1.o14: "The Maoists won."
 #election.1.o15: "The Radical Shiaists won."
 #election.1.o16: "The Liberal Conservatives won."
 #election.1.o17: "The Judaists won."
