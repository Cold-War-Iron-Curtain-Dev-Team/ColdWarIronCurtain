 stability.31.t: "Ужесточение мер сработало"
 stability.31.desc: "Быстрый ответ доказал свою эффективность. Отряды полиции при поддержке местных патриотично настроенных добровольцев провели хорошо скоординированную операцию и посетили каждого уклоняющегося призывника. Большинство из них согласились явиться на призывной пункт, когда им сообщили о последствиях неявки. Высшее военное командование публично заявило, что любому явившемуся не будут предъявлены обвинения и его не накажут за уклонение в прошлом. И всё же некоторые призывники категорически отказались взять оружие, чтобы защищать свою страну, и были арестованы."
 stability.31.a: "Решительные действия предотвратили ухудшение ситуации."
 stability.32.t: "Беспорядки в связи с призывом"
 stability.32.desc: "Наши попытки разрешить ситуацию с помощью военной силы не увенчались успехом. Похоже, кто-то в администрации раскрыл детали планируемой операции, вслед за чем последовала незамедлительная реакция. Когда военная полиция и представители других правоохранительных органов попытались посетить уклонистов, путь им преградила разгневанная толпа, требующая положить конец войне и принудительной военной службе. В некоторых случаях между полицией и протестующими вспыхнули уличные сражения, приведшие к определённому количеству жертв, поскольку солдаты были вынуждены применить оружие для самозащиты.\n\nБаррикады были расчищены, погибшие похоронены, но столицу охватили мрачные настроения. Судя по докладам Военного министерства, количество призывников, являющихся для прохождения службы, не увеличилось. Многие в правительстве гадают, как долго мы сможем продолжать сражения в таких обстоятельствах."
 stability.32.a: "Эта ситуация, возможно, обернулась не в нашу пользу."
 stability.33.t: "Восстание призывников"
 stability.33.desc: "Наши попытки разрешить ситуацию с помощью военной силы не увенчались успехом. Похоже, кто-то в администрации раскрыл детали планируемой операции, вслед за чем последовала незамедлительная реакция. Когда военная полиция и представители других правоохранительных органов попытались посетить уклонистов, путь им преградила разгневанная толпа, требующая положить конец войне и принудительной военной службе. В некоторых случаях между полицией и протестующими вспыхнули уличные сражения, приведшие к определённому количеству жертв, поскольку солдаты были вынуждены применить оружие для самозащиты. \n\nСитуация быстро вышла из-под контроля, после того как толпа смяла ограждение и, взяв штурмом полицейские участки, вооружилась. В настоящее время в нескольких городах началось антиправительственное восстание. Любопытно, что восставшие, похоже, без труда находят добровольцев, готовых взять в руки оружие."
 stability.33.a: "Ага, значит, теперь они хотят сражаться?!"
 stability.34.t: "Реформы призыва оказались эффективными"
 stability.34.desc: "Социальные меры, принятые правительством в рамках более широкого процесса реформирования военного призыва, оказались на удивление популярными. Среди благоприятных нововведений часто упоминают увеличение жалования и более частые увольнения, но многие также называют новые правительственные программы по поддержке вдов и сирот. Всё меньше мужчин находят оправдания своему отказу взять в руки оружие ради защиты своей страны, и общественность перестала относиться к уклонистам благосклонно.\n\nВ последнее время даже наметилась тенденция поддерживать правительство, по мере того, как всё больше людей понимают, что под угрозой находится сам [Root.GetAdjective] образ жизни."
 stability.34.a: "Мудрое решение."
 stability.35.t: "591-й штрафной батальон"
 stability.35.desc: "Осознав всю серьёзность создавшегося положения, Высшее военное командование решило предпринять более суровые меры, призванные показать уклонистам, что с их нежеланием защищать свою страну никто мириться не будет. На рассвете военная полиция ворвалась в дома ряда предварительно выбранных лиц из тех, кто использовал своё влияние, чтобы помогать другим избежать призыва. Не дав одеться, их под вооружённой охраной отправили в казармы, чтобы сформировать отдельное войсковое подразделение и помешать распространению их идей среди других частей и подразделений. \n\nВесть об этом распространилась быстро, и, похоже, большинство тех, кто раньше считал, что можно просто проигнорировать повестку, изменили своё мнение. Призывные пункты по всей стране докладывают, что к ним всё чаще приходят люди с вопросом, каковы будут последствия для их «друзей», которые ранее пытались уклониться от призыва, но теперь решили явиться."
 stability.35.a: "Они ещё могут искупить свою вину."
 stability.36.t: "Протесты местной элиты"
 stability.36.desc: "Осознав всю серьёзность создавшегося положения, Высшее военное командование решило предпринять более суровые меры, призванные показать уклонистам, что с их нежеланием защищать свою страну никто мириться не будет. На рассвете военная полиция ворвалась в дома ряда предварительно выбранных лиц из тех, кто использовал своё влияние, чтобы помогать другим избежать призыва. Не дав одеться, их под вооружённой охраной отправили в казармы, где они узнали, что отныне несут военную службу. Но их родственники устроили целую кампанию по опротестованию этого решения. Военное министерство заваливают письмами и звонками как от простых рабочих, которые вдруг захотели, чтобы вернули их руководителей, так и от мелких служащих других министерств, требующих ответить, почему забрали тех, кто был занят в важных для обороны сферах. Похоже, что некоторые министры изменили своё отношение к войне — возможно, они опасаются за безопасность своих сыновей."
 stability.36.a: "Разве у них нет чувства долга?"
 stability.37.t: "«Мрачный, но священный долг»"
 stability.37.desc: "«Конечно же, я хочу жить. Я хочу получить образование, встретить девушку, завести семью, но если мы проиграем войну, я всё равно не смогу этого сделать. Поэтому я сражаюсь».\n\nЭто анонимное письмо, опубликованное во всех ведущих газетах, произвело настоящий фурор. Оно якобы написано от имени новобранца, который поначалу уклонялся от призыва, но потом понял, что должен спасать свою страну, и оно, очевидно, задело за живое тех, кто испытывал подобные сомнения. Призывные комиссии по всей стране докладывают об увеличении количества добровольцев, которые не могут дождаться, когда же их призовут, тогда как другие охотно отправляются защищать свою страну и свой образ жизни."
 stability.37.a: "Мы проследим, чтобы они не потеряли свои жизни зря."
 stability.38.t: "Расстрел труса"
 stability.38.desc: "«На рассвете его вывели и поставили у стены. Он отказался от последней сигареты, но согласился, чтобы ему завязали глаза. Его последним словом было извинение перед матерью за то, что он доставил ей столько страданий. Расстрельная команда целилась хорошо. Через несколько минут врач зафиксировал его смерть».\n\nНе имея возможности схватить и привлечь к ответственности всех уклонистов, власти решили устроить показательные аресты. Ввиду серьёзной обстановки Военное министерство постановило судить их по законам военного времени. Был вынесен ряд смертных приговоров, которые привели в исполнение расстрельные команды. Эти меры, по всей видимости, произвели надлежащее воздействие. Похоже, что всё больше людей предпочитают возможную гибель на поле боя бесславной смерти с клеймом труса."
 stability.38.a: "Жаль, что дошло до такого."
 stability.39.t: "Мученик во имя мира"
 stability.39.desc: "«На рассвете его вывели и поставили у стены. Он отказался от последней сигареты, но согласился, чтобы ему завязали глаза. Его последним словом было извинение перед матерью за то, что он доставил ей столько страданий. Расстрельная команда целилась хорошо. Через несколько минут врач зафиксировал его смерть».\n\nПубликация сообщения о казни уклониста, приговорённого к смерти, похоже, привела к противоположному эффекту. Вместо того, чтобы убедить людей являться на военную службу из страха перед последствиями отказа, она сделала из казнённых мучеников во имя мира. Сообщения об их смерти были отредактированы таким образом, чтобы выставить их в самом благоприятном свете. В крупных городах начались массовые демонстрации с требованиями прекращения войны. Военное министерство докладывает о получении писем от призывников с заявлениями о том, что они ни при каких обстоятельствах не пойдут на службу и не станут участниками подобных действий, разве что их самих поведут на казнь."
 stability.39.a: "Похоже, ситуация не улучшилась."
 stability.40.t: "Новый курс для государства [Root.GetNameDef]"
 stability.40.desc: "В своей речи, которая сегодня транслировалась по радио, [Root.GetLeader] объявил о так называемой «социальной революции». Целый час он описывал систему реформ, призванных коренным образом изменить общественную жизнь, обещая каждому вернувшемуся с фронта солдату возможность получить образование, хорошо оплачиваемую работу и щедрую пенсию. Он также рассказал о программе доступного жилья для молодых семей, которая должна начаться в первый же день после подписания перемирия. Похоже, эта речь оказала большое воздействие на настроение общества. С призывных пунктов по всей стране поступают сообщения, что всё больше новобранцев просят продлить им срок службы после окончания нынешнего военного конфликта, а другие требуют перевести их на фронт, чтобы получить дополнительные льготы."
 stability.40.a: "И как мы за всё это заплатим?.."
 strikes_event.1.t: "Порядок восстановлен"
 strikes_event.1.desc: "Высшее военное командование без малейшего промедления создало специальные отряды из солдат, проходящих подготовку или отпущенных в увольнение. Промаршировав мимо ворот заводов, эти отряды произвели надлежащий эффект. Забастовщики решили не усугублять конфликт и не идти на потенциально смертельный риск. Немногим попытавшимся договориться с солдатами не удалось найти с ними общий язык, поскольку солдаты спрашивали рабочих, почему они считают приемлемым отсиживаться в тылу и подводить сражающихся на фронте."
 strikes_event.1.a: "И правда, почему."
 strikes_event.2.t: "Кровавый понедельник"
 strikes_event.2.desc: "Высшее военное командование без малейшего промедления создало специальные отряды из солдат, проходящих подготовку или отпущенных в увольнение. Но доставить их в охваченные забастовками города оказалось труднее, чем предполагалось, поскольку бастующие перекрыли железнодорожные пути, и войскам пришлось идти пешком, что дало забастовщикам время на подготовку. Попытки расчистить дороги встречали активное сопротивление со стороны рабочих, забрасывающих солдат камнями и бутылками. \n\nВ некоторых случаях отряды открывали огонь для самозащиты, убив некоторое количество забастовщиков и ранив ещё больше. Это только разъярило толпу и сторонних наблюдателей, которые стали выкрикивать «Убийцы!». Общественное мнение в столице быстро склонилось на сторону бастующих. Ночью солдаты отступили, оставив баррикады нетронутыми.\n\nДальнейших попыток разрешить ситуацию силой предпринято не было. Забастовщики сохраняют контроль над заводами, работа на которых приостановлена."
 strikes_event.2.a: "Всё пошло не так, как было запланировано."
 strikes_event.3.t: "Герои производственного фронта"
 strikes_event.3.desc: "«Война промышленной эпохи – это не только марширующие дивизии и самолёты, сбрасывающие бомбы. И участвуют в ней не только солдаты, исполняющие свой долг и погибающие за свою страну. Такая война в первую очередь ведётся на фабриках и заводах. Оставить сборочный цех – всё равно что самовольно покинуть линию фронта. И победы в сборочных цехах должны праздноваться так же, как победы в сражениях».\n\nЧтобы выставить в максимально благоприятном свете труд рабочих на оружейных заводах и фабриках, были привлечены все доступные пропагандистские ресурсы. [Root.GetLeader] лично подписал указ о присвоении новой награды рабочим, перевыполнившим нормативы на 100%, и первые её обладатели отправились в поездку по всей стране, чтобы рассказать другим рабочим о своих методах.\n\nПохоже, многие бастующие пересмотрели своё отношение к забастовкам. Все остановившиеся ранее заводы возобновили выпуск продукции."
 strikes_event.3.a: "Все они герои."
 strikes_event.4.t: "Департамент военной продукции"
 strikes_event.4.desc: "Сегодня [Root.GetLeader] объявил о небольших изменениях в системе призыва. Исключения для квалифицированных рабочих отменяются, и теперь призыву на военную службу подлежат все. Одновременно с этим Военному министерству разрешено осуществлять непосредственный контроль над теми выпускающими военную продукцию заводами и фабриками, руководство которых не продемонстрировало надлежащей компетенции.\n\nВ охваченных забастовками городах это решение встретили с молчаливой покорностью, особенно заявление о том, что теперь отказ от работы равноценен отказу от выполнения приказа солдатом. Несмотря на всеобщий упадок духа среди рабочих, выпуск продукции возобновился."
 strikes_event.4.a: "Нужно было сделать это с самого начала."
 strikes_event.5.t: "Непокорная страна"
 strikes_event.5.desc: "Сегодня [Root.GetLeader] объявил о небольших изменениях в системе призыва. Исключения для квалифицированных рабочих отменяются, и теперь призыву на военную службу подлежат все. Одновременно с этим Военному министерству разрешено осуществлять непосредственный контроль над теми выпускающими военную продукцию заводами и фабриками, руководство которых не продемонстрировало надлежащей компетенции.\n\nВ охваченных забастовками городах это решение встретили смехом, особенно заявление о том, что теперь отказ от работы равноценен отказу от выполнения приказа солдатом. Полицейских, которым было поручено вручить повестки рабочим, прогнали с призывом вооружиться чем-то посолиднее, нежели бумаги и чернила."
 strikes_event.5.a: "Возможно, стоит последовать этому совету."
 strikes_event.6.t: "Полезные едоки"
 strikes_event.6.desc: "Не упоминая забастовки, [Root.GetLeader] сегодня заявил о том, что рабочим на выпускающих военную продукцию фабриках и заводах повысят нормы выдачи сахара, кофе и мяса. К сожалению, слухи о том, что будут выдавать шоколад, оказались ложными.\n\nЗачинщики продолжают призывать к забастовкам, но большинство рабочих, похоже, пришли к мысли, что лозунг «Мира и хлеба!» неисполним, и довольны тем, что им хотя бы дали хлеб."
 strikes_event.6.a: "Лучше бы им отработать своё содержание."
 strikes_event.7.t: "Операция «Чёрный дуб»"
 strikes_event.7.desc: "Соблюдая тишину и светомаскировку, дабы использовать фактор внезапности, на окраинах городов собрались войска. Когда солнце поднялось над горизонтом, и рабочие, дежурившие на баррикадах вокруг заводов, ожидали смену, на улицы городов вошли военные. Усталые рабочие не сумели оказать достойного сопротивления и быстро потерпели поражение. Оставив небольшой отряд для охраны пленников, войска прочесали улицы и арестовали всех из списка известных рабочих. К полудню военные полностью контролировали ситуацию в городах и установили комендантский час. Дальнейшего сопротивления не ожидается. Большинство рабочих скоро отпустят с условием возврата на производство, но зачинщики предстанут перед судом. Ожидается, что им вынесут смертные приговоры."
 strikes_event.7.a: "Порядок восстановлен"
 strikes_event.8.t: "Сражение на Дубовой улице"
 strikes_event.8.desc: "На окраинах городов были собраны войска, но плохая дисциплина, шум и отсутствие светомаскировки не позволили воспользоваться фактором внезапности. Когда военные вошли в город, рабочие уже были готовы встретить их и закидали камнями, остановив первую атаку. Вторая штыковая атака переросла в жестокие столкновения. Десятки раненых и умирающих остались на улицах.\n\nКомандиры отвели отряды для перегруппировки, а рабочие укрепили баррикады и вооружились подобранным оружием. Завтра ожидаются дальнейшие бои, но Высшее военное командование уже не верит в победу."
 strikes_event.8.a: "У нас быстро заканчиваются варианты."
 strikes_event.9.t: "Указ о защите прав рабочих"
 strikes_event.9.desc: "Ввиду нарастания напряжённости в столице [Root.GetLeader] объявил о принятии новых законов, защищающих права рабочих даже во время войны. Эти законы предусматривают щедрую оплату больничных, обязательное страхование от несчастных случаев, право на вступление в любой профсоюз и, впервые за всё время, право работающих женщин на отпуск по уходу за ребёнком после родов.\n\nХотя некоторые члены правительства и считают это полным поражением в противостоянии с забастовщиками, результаты говорят сами за себя: все заводы и фабрики вернулись к работе."
 strikes_event.9.a: "Остаётся надеяться, что этого будет достаточно."
 mutiny_event.1.t: "Мятеж остановлен"
 mutiny_event.1.desc: "Спустя несколько часов напряжённых переговоров у ворот казарм и в траншеях на линии фронта мятежу в армии был положен конец. Поняв, что в случае противостояния победы им не видать, мятежники быстро сдались. \n\nПосле этого осталось лишь решить их судьбу. Высшее военное командование проявило благоразумие и не стало подвергать виновных суровому наказанию. В качестве примера некоторых военных понизили в звании и перевели в другие части."
 mutiny_event.1.a: "Будем надеяться, что ничего подобного больше не произойдёт."
 mutiny_event.2.t: "Пустая угроза"
 mutiny_event.2.desc: "Попытки запугать мятежников и заставить их подчиниться не сработали, поскольку посланные для усмирения мятежа отряды не произвели впечатления на солдат. Применив полученные на фронте навыки, они быстро организовали оборону, прорвать которую удалось бы только с большими потерями. \n\nКомандиры верных частей отступили и ожидают дальнейших приказаний, но этот небольшой успех, вне всякого сомнения, укрепил решимость мятежников."
 mutiny_event.2.a: "Никто не мог этого предсказать."
 mutiny_event.3.t: "Ради чего мы сражаемся?"
 mutiny_event.3.desc: "«Нет ничего необычного в том, что солдат сомневается в целесообразности того, что он делает. Можно ли оправдать жертвы, которые мы требуем от вас? Вправе ли мы посылать вас на смерть ради цели, которую вы, возможно, не увидите?\n\nНам не повезло родиться в беспокойное время. Судьба решила так, что мы должны пойти на войну, чтобы защищать нашу свободу, наши дома, наш [Root.GetAdjective] образ жизни! Мы не выбирали эту войну, нам её навязали! Вы прекрасно знаете, что я не стал бы просить от вас ничего, на что не согласился бы сам, и я знаю, что вы сделаете всё возможное ради победы!»\n\n[Root.GetLeader] произнёс перед войсками речь, которая произвела необходимое впечатление и которую солдаты встретили возгласами одобрения, после чего, воодушевлённые, вернулись к своим обязанностям без лишних жалоб."
 mutiny_event.3.a: "Хорошая речь."
 mutiny_event.4.t: "Указ об измене в условиях военного времени"
 mutiny_event.4.desc: "Военное министерство старается не предавать огласке текущий мятеж в армии, подвергая цензуре письма, но скрыть правду не удаётся. Солдаты в увольнении быстро разнесли весть о том, что войска не желают продолжать ненужное кровопролитие.\n\nНе упоминая прямо о мятеже, [Root.GetLeader] сегодня заявил о том, что правительство разрабатывает закон, согласно которому нежелание воевать будет считаться изменой.\n\nВсем хорошо известно, какое наказание полагается за измену, и всё меньше людей поддерживают мятежников. Новости об этом, конечно, тоже быстро распространились. Не встречая поддержки, солдаты вернулись к своим обязанностям."
 mutiny_event.4.a: "Не нужно было об этом говорить."
 mutiny_event.5.t: "Попытка подавления не удалась"
 mutiny_event.5.desc: "Военное министерство старается не предавать огласке текущий мятеж в армии, подвергая цензуре письма, но скрыть правду не удаётся. Солдаты в увольнении быстро разнесли весть о том, что войска не желают продолжать ненужное кровопролитие.\n\nПопытки правительства обуздать мятежников провалились. Доклады тайной полиции говорят о том, что они пользуются широкой общественной поддержкой, вследствие чего их будет трудно изолировать и подавить."
 mutiny_event.5.a: "Неуважение к законам сильно тревожит."
 mutiny_event.6.t: "[Root.GetAdjective] предложение о перемирии"
 mutiny_event.6.desc: "[Root.GetLeader] заявил сегодня прессе, что его последняя мирная инициатива провалилась. Причин тому много, но последней каплей, по всей видимости, явилось [Root.GetAdjective] требование, чтобы враг полностью возместил весь нанесённый ущерб и публично признал, что войну развязал он.\n\nПротивник назвал наши разумные предложения требованием безоговорочной капитуляции. Он пообещал, что доведёт эту войну до победного конца. \n\nТеперь, когда неприятель, очевидно, больше не намерен выслушивать никаких предложений и желает во что бы то ни стало воевать дальше, призывы мятежников к мирным переговорам лишились смысла."
 mutiny_event.6.a: "Какая жалость."
 mutiny_event.7.t: "Попытка военного подавления удалась."
 mutiny_event.7.desc: "Несмотря на отдельные случаи сопротивления небольших групп мятежников, наша операция по подавлению бунта закончилась впечатляющим успехом. Полагаясь не столько на опыт, сколько на численность, верные правительству ополченцы окружили укрепления мятежников и предложили сдаться. Большинство солдат предпочло не использовать оружие против своих соотечественников. \n\nЗачинщики предстанут перед тайными трибуналами, но обычных солдат отошлют на фронт, перераспределив их по разным частям и подразделениям, чтобы они не образовали новые ячейки мятежников."
 mutiny_event.7.a: "Отлично!"
 mutiny_event.8.t: "Брат на брата"
 mutiny_event.8.desc: "Наши попытки предотвратить выборы, проводимые советами рабочих и солдат, только ухудшили обстановку до немыслимых пределов. Вместо того чтобы сдаться, мятежники создали временные советы, выбрали полевых командиров и организовали оборону на улицах.\n\nРаскол в армии теперь проходит по каждому подразделению и часто даже между членами одной семьи. [Root.GetNameDefCap] стоит на грани гражданской войны."
 mutiny_event.8.a: "Ситуация ухудшается."
 mutiny_event.9.t: "Новые офицеры"
 mutiny_event.9.desc: "Несмотря на сильное противодействие со стороны военных, каждое подразделение в [Root.GetAdjective] армии провело выборы командиров. Результаты очень удивили, поскольку выбраны были умелые солдаты с большим опытом боевых действий. Многие профессиональные офицеры до сих пор считают это личным оскорблением, но большинство солдат, вне всякого сомнения, поддерживают сложившуюся ситуацию."
 mutiny_event.9.a: "Это же не сработает, правда?"
 if_they_accept: "Если они согласятся:\n"
 generic.12.t: "[From.GetAdjective] диверсанты пытаются провести саботаж на Суэцком канале"
 generic.12.d: "Военная разведка докладывает, что [From.GetAdjective] диверсанты намерены использовать мощные подрывные заряды и затопленные корабли, чтобы осуществить саботаж на Суэцком канале. Если мы хотим остановить врага, то у нас мало времени."
 generic.12.a: "Мы не допустим этого!"
 generic.13.t: "[From.GetAdjective] диверсанты пытаются провести саботаж на Панамском канале"
 generic.13.d: "Военная разведка докладывает, что [From.GetAdjective] диверсанты намерены использовать мощные подрывные заряды и затопленные корабли, чтобы осуществить саботаж на Панамском канале. Если мы хотим остановить врага, то у нас мало времени."
 generic.14.t: "[From.GetName] заявляет официальный дипломатический протест"
 generic.14.d: "[From.GetAdjective] посланники предъявили нашему правительству дипломатический протест в связи с присутствием наших атташе в странах, с которыми их государство в настоящее время вовлечено в военный конфликт. Они требуют немедленного отзыва нашей военной миссии."
 generic.14.a: "Это разумное требование."
 generic.14.b: "Мы будем посылать своих атташе туда, куда захотим."
 generic.15.t: "[From.GetName] отзывает атташе"
 generic.15.d: "В ответ на наши требования государство [From.GetNameDef] отозвало свои военные миссии из враждебных нам стран."
 generic.16.t: "[From.GetName] не отзывает атташе"
 generic.16.d: "Несмотря на наши требования, государство [From.GetNameDef] отказалось отозвать свои военные миссии из враждебных нам стран, заявив, что «не наше дело вмешиваться в [From.GetAdjective] внутренние дела»."
 generic.16.a: "Мы разберёмся с этим."
 generic.17.t: "[From.GetName] заболевает!"
 generic.17.d: "Похоже, что [From.GetRank] [From.GetName] ощущает последствия своей самоотверженной службы государству [From.From.GetNameDef]. Плохой климат сказался на [From.GetHerHis] здоровье, и теперь [From.GetHerHim] потребуется некоторое время на то, чтобы прийти в себя. До выздоровления [From.GetSheHe] не сможет выполнять обязанности на должном уровне."
 generic.18.t: "[From.GetName] получает ранение"
 generic.18.d: "Похоже, что [From.GetRank] [From.GetName], с риском для жизни возглавив своих людей и успешно доведя сражение до победного конца, некоторое время не сможет выполнять обязанности на должном уровне - до тех пор, пока полностью не оправится от полученного ранения."
  
 spr.1.d: "С подписанием мадридского пакта испанское государство завершило свой период изоляции. В договоре, подписанном Испанией и Соединенными Штатами, Соединенные Штаты дадут Испании деньги, чтобы помочь улучшить свою военную и экономическую систему. В обмен на американскую помощь Испании, Испания согласилась разрешить США использовать землю для размещения военно-воздушных и военно-морских баз на испанской территории. Этот новый договор положил конец периоду в испанской истории после окончания Второй мировой войны, который был отмечен испанским изоляционизмом и ненавистью большинства стран за то, что они были фашистской и симпатизировали Гитлеризму. Пакт рассматривается как новое начало для Испании и как знак того, что мир начинает смотреть на Испанию в более позитивном свете."
 spr.2.d: "В речи, произнесенной [SPR.GetLeader], было объявлено, что Испания будет экспатриировать бывших нацистов, бежавших в Испанию."
 spr.3.d: "Как и планировалось, большинство старых чиновников теперь были сняты со своих постов и заменены новыми членами, оказывающими полную поддержку нашему режиму."
 spr.4.d: "Организация Объединенных Наций получила еще одно государство. Как объявил Даг Хаммаршельд, Испания была принята в качестве государства - члена ООН."
 spr.8.d: "Испания, которая недавно видела, как коммунисты свергли ее фашистского диктатора Франсиско Франко, теперь попросила нас защитить их. В обмен на это мы получим нового союзника в Иберии и огромный контроль над их страной."
  
 pru.3.d: "После переворота, оставившего Мануэля А. Одрию военным диктатором Перу, американский Народно-Революционный альянс был быстро объявлен вне закона, чтобы подавить оппозицию. Его лидер Виктор Рауль Хайя де ла Торре быстро стал мишенью, когда полиция ворвалась в его офис и обнаружила, что он полностью заброшен. Быстрое расследование показало, что де ла Торре удалось бежать в посольство Эквадора."
  
 cominplot.1.d: "В 1948 году Югославия была исключена из Коминформа из-за \"националистических элементов\" которым \"удалось в течение последних пяти-шести месяцев достичь доминирующего положения в руководстве\" в КПЮ. Изгнание фактически исключило Югославию из Международной ассоциации социалистических государств. После изгнания Тито подавлял тех, кто поддерживал резолюцию, называя их \"Коминформистами\". Теперь эти коминформисты стали лучше организовываться и начали формулировать план избавления от Тито и возвращения Югославии на правильный путь."
 cominplot.2.d: "После нескольких недель планирования коминформистам удалось убить Тито. Во время прогулки по площади Никола Пасич к Тито подошел мужчина и сделал два выстрела в его сторону из пистолета ТТ-33, причем одна пуля попала ему в шею, а другая - в левое легкое. Тито был срочно доставлен в больницу Войномедицинской академии в Банжице, где через 20 минут скончался. Нападавший, 24-летний Веселко Седлачек, был застрелен полицией и умер на месте происшествия."
 cominplot.3.d: "Вчера в Белграде был убит лидер Югославии Иосип Броз Тито. Во время прогулки по площади Николы Пасича в Белграде 24-летний Веселко Седлачек дважды выстрелил в Тито, попав ему в шею и левое легкое. Тито был немедленно доставлен в госпиталь Военно-Медицинской академии в районе Банжица в Белграде, где он скончался через 20 минут. Нападавший был застрелен на месте происшествия. Сейчас спецслужбы расследуют мотив этого убийства. Ходят слухи, что нападение было организовано просоветской группой, известной как Коминформ."
 cominplot.4.d: "Только что был убит грозный лидер УДБА Александр Ранкович. Когда он стоял возле штаб-квартиры УДБА, снайпер произвел выстрел в голову, убив его мгновенно. Преступнику удалось скрыться, но он оставил записку с указанием мотива преступления."
 cominplot.5.d: "Наше правительство подверглось нападению! Ранее сегодня недовольные Коминформ-повстанцы нанесли сильный и быстрый удар по зданию Капитолия в [YUG.Capital.GetName]. В точном ударе, повстанческие группы прорвались через скелет экипажа военных охранников, штурмуя здание, [YUG.GetLeader] был убит в настоящем блитцкриге. Теперь Коминформисты захватили власть и провозгласили новое правительство, объединившееся с Коминформом и [SOV.GetNameDef]."
 cominplot.6.d: "Очаги повстанцев, связанных с Коминформом, штурмовали здание югославского Капитолия в [YUG.Capital.GetName] сегодня рано утром. Со времени раскола между [SOV.GetNameDef] и [YUG.GetNameDef] в первые годы Холодной войны их отношения были напряжены. Теперь, когда предыдущее правительство было свергнуто точным ударом по югославскому Капитолию, [YUG.GetRulingParty] приступила к дальнейшему восстановлению отношений с Коминформом и Советским Союзом."
  
 cultural_events.5.d: "Сегодня, 11 сентября 1977 года, мы видим, как технология украшает дома некоторых сегодня с Atari 2600, домашней консолью, запускаемой по цене 199 долларов США на североамериканском рынке с двумя джойстиками и копией видеоигры \"Combat\" с восемью другими играми, доступными для покупки на данный момент."
 cultural_events.6.d: "В технологических новостях сегодня, 15 июля 1983 года, мы видим выпуск Famicom (семейного компьютера) от знаменитой компании Nintendo, вдохновителей Donkey Kong, которая стабильно продавалась на внутреннем рынке. Famicom поставляется с тремя играми Donkey Kong, Donkey Kong Jr. и Popeye, появились сообщения о ранних сбоях приставки из-за проблемы с чипсетом, это еще предстоит исправить."
 cultural_events.7.d: "\nЛинии длинны, и надежды высоки, поскольку сегодня, 18 октября 1985 года, Nintendo наконец выпустила свою игровую приставку Nintendo с переработанным корпусом по сравнению с ее японским кровным братом Famicom, выпущенным 2 годами ранее. Эта новая система выпускается с 17 играми, 10-Yard Fight, бейсболом, Clu Clu Land, Duck Hunt, Excitebike, Golf, Gyromite, Hogan’s Alley, Ice Climber, Kung Fu, Pinball, Soccer, Stack-Up, Tennis, Wild Gunman, Wrecking Crew, and Super Mario Bros."
 cultural_events.8.d: "Потерявшийся во времени солдат сдался после того, как местный житель Норио Судзуки убедил его сменить должность после того, как он связался со своим бывшим начальником, майором Есими Танигути. Майор Танигути вылетел вместе с Судзуки обратно в Лубанг, чтобы проинструктировать Хироо Оноду официально сдаться во Дворце Малаканьян. Он сдался вместе со своим мечом, действующей винтовкой Arisaka Type 99, 500 патронами и несколькими ручными гранатами, а также кинжалом, который дала ему мать. После убийства по меньшей мере 30 человек он был помилован президентом Фердинандом Маркосом."
 KOR_RAID.3.d: "Конфликт на Корейском полуострове достиг высших эшелонов южнокорейского правительства, поскольку Северная Корея безуспешно пыталась убить президента Пак Чон Хи в его личной резиденции \"Голубой дом\". Подразделение 124, самые престижные силы коммандос Северной Кореи, было выбрано самим Ким Ир Сеном для убийства Пака, чтобы Южная Корея в условиях кризиса руководства не смогла должным образом отреагировать на вторжение Северной Кореи. Однако рейд оказался неудачным, так как их план был преждевременно начат из-за неудачной встречи с местной полицией, за которой последовала быстрая реакция армии РК. Этот рейд является отражением того, как далеко пойдет северокорейский режим для достижения своих целей, и наблюдатели ожидают ответного удара аналогичного характера со стороны южнокорейского правительства."
  
 nic.1.d: "На нас обрушиваются очередные выборы. Выборы, конечно, несправедливы, так как Анастасио Сомоса Гарсия сфальсифицировал их в свою пользу, а это означает, что любые средства для демократической смены власти бесполезны. Однако это также возможность попытаться свергнуть Гарсию и восстановить надлежащую демократию. Что же это будет?"
 nic.2.d: "В Никарагуа демократическая оппозиция начала революцию против коррумпированного режима Анастасио Сомосы Гарсии. В своем выступлении по радио лидер революции Эмилиано Чаморро Бенард призвал всех взяться за оружие и вернуть страну от коррумпированного диктатора к демократии."
 nic.3.d: "Вскоре после того, как в Конституцию были внесены поправки, позволяющие Сомосе вновь баллотироваться на выборах, поэт Ригоберто Лопес Перес сумел проникнуть в партию, организованную лояльными кадрами, и выстрелил диктатору в грудь. Стражи порядка быстро ликвидировали стрелявшего. Выстрел не был смертельным, но тяжело ранил Гарсию. Сомоса был перевезен на соседний Панамский канал для проведения операции. Однако местные анестезиологи не учли особых потребностей страдающего избыточным весом и диабетом диктатора, и во время операции Сомоса впал в кому. Через пару дней он умер, передав власть своему сыну."
 nic.4.d: "Наш дорогой президент Луис Сомоса Дебайл перенес сердечный приступ и умер всего несколько минут назад. Родившись в 1922 году, он пережил возвышение своего отца как эффективного диктатора Никарагуа и занял пост президента после его убийства в 1956 году. Хотя в 1963 году он разрешил провести выборы и избрать нового президента, реальная власть по-прежнему находилась в руках его брата Анастасио Сомосы Дебайла. Несмотря на заявления иностранцев о безудержной коррупции и жестких ограничениях гражданских свобод, Сомоса правил более мягко, чем его отец, и сыграл ключевую роль в создании единого Центральноамериканского рынка. После его смерти по всей стране распространился большой оптимизм в отношении смены правительства, и Сандинистская повстанческая организация получила широкую народную поддержку. Однако Анастасио занял пост президента, и без какого-либо неожиданного сопротивления, похоже, династия Сомоса останется у власти в обозримом будущем."
  
 BUL.100.d: "Мы только что получили печальные известия из Москвы. Наш лидер Георгий Димитров только что скончался в подмосковном санатории Барвиха. По словам москвичей, несколько часов назад он пожаловался на плохое самочувствие и отправился отдыхать. Когда врачи пришли проверить его, они обнаружили, что он умер от сердечного приступа около 30 минут назад.\n\nНекоторые, однако, предполагают, что он был фактически отравлен приказом Сталина за его близость с Тито и его идей создания \"Балканской Федерации\". Государство, состоящее из Югославии и Болгарии, было бы слишком большим и независимым, чтобы его смогла контролировать Москва.\n\nКонечно, это всего лишь слухи, и мы ничего не можем доказать. Однако теперь мы должны назначить его преемника. Наш лучший кандидат - Валко Червенков, убежденный сторонник Сталина и его политики."
  
 Thai_Focus_6_desc: "Только что завершились 7-е всеобщие выборы. Это были дополнительные выборы членов Палаты представителей, основанные на количестве граждан в соответствии с переходными положениями Королевства. Число представителей в каждой провинции рассчитывается путем проведения 150 000 человек на 1 представителя, поскольку речь идет о дополнительных членах Палаты представителей. Поэтому выборы были проведены только в 19 провинциях, в результате чего был избран еще 21 член Палаты представителей из существующих 99 человек. Из общего числа 3 518 276 избирателей, имеющих право голоса, было 870 208 избирателей, что составляет 24,27%. Провинция с наибольшей активностью голосования была Сакон наконн, составив 45,12%, а Удонтхани с наименьшим количеством проголосовавших - 12,02%. Эти выборы также являются для нас чем-то историческим, поскольку впервые в Палату представителей Таиланда была избрана женщина Орапин Чайякан."
  
 KPA_Coup.1.d: "Мы получили срочные новости. Ведущие северокорейские деятели из советско-корейской фракции и Яньаньской фракции при поддержке Советского Союза и Китая пытаются свергнуть Ким Ир Сена. Ким Ир Сен узнал об этом плане по возвращении из Москвы и отреагировал, отложив пленум почти на месяц и используя дополнительное время для подготовки, подкупая и принуждая членов Центрального комитета и планируя поэтапный ответ. Когда пленум наконец открылся, Чхве Чан ИК выступил с речью, в которой критиковал Ким Ир Сена за концентрацию власти партии и государства в своих руках, а также критиковал линию партии за индустриализацию, игнорирующую массовый голод среди северокорейского народа. Юн Конг-Хум обвинил Ким Ир Сена в создании полицейского режима. Сторонники Ким Ир Сена кричали и ругали ораторов, делая их почти неслышными и разрушая их способность убеждать членов. Сторонники Ким Ир Сена обвинили оппозицию в том, что она антипартийна, и потребовали изгнать Юня из партии. Ким Ир Сен в ответ нейтрализовал нападение на него, пообещав начать перемены и умерить режим. Но достаточно ли этого для большинства? Или же Ким будет свергнут без всякой на то причины?"
  
  #####ENG - GREAT BRITAIN##### 
  ###1950s### 
 ENG_event.1.t: "Английская реконструкция завершена!"
 ENG_event.1.d: "После многих лет тяжелого труда и труда мы закончили наши строительные работы после Второй мировой войны. Наши усилия окупились, и наша экономика сейчас снова находится в процессе роста после войны."
 ENG_event.1.a: "Чудесные новости!"
 ENG_event.2.t: "Танганьика расформирована схема Граунднат"
 ENG_event.2.d: "Схема Граунднат Танганьики была расформирована после ее провала. ТГС была первоначально основана после Второй мировой войны как попытка уменьшить нехватку растительного масла в Великобритании и обеспечить рабочие места в Восточной Африке, обрабатывая широкие участки земли для выращивания арахиса. После огромных затрат и многочисленных неудач проект был окончательно свернут. Подавляющее большинство потенциальных восточноафриканских рабочих больше не смогут избежать нищеты и осядут в трущобах Дар-эс-Салама."
 ENG_event.2.a: "Ужасная потеря"
 ENG_event.3.t: "Война с Джебелем Ахдаром"
 ENG_event.3.d: "Наша нация взяла на себя инициативу нанести удар по Имамату Омана. Мы боремся за то, чтобы поддержать оккупацию Султана Саида Бен Таймура и контролировать внутренние районы Омана."
 ENG_event.3.a: "На войну!"
 ENG_event.4.t: "Речь Ветер перемен"
 ENG_event.4.d: "Британский премьер-министр [ROOT.GetLeader] обратился к парламенту Южной Африки с эпохальной речью, сигнализирующей о том, что Британия не намерена препятствовать независимости своих южных колоний. Эта речь была очень хорошо принята лидерами южных колоний и сторонниками деколонизации во всем мире. \n\nВ речи [ROOT.GetLeader] заявил: \"Ветер перемен дует по всему континенту и, нравится нам или нет, данный рост политического самосознания является объективным фактом.\" Кроме Того, [ROOT.GetLeader] выразил большое желание помочь и поощрять независимость этих колоний и стремится найти точки соприкосновения. Однако в дополнение к этому [ROOT.GetLeader] выразил желание найти общий язык и хочет, чтобы колонии защищали \"политические судьбы свободных людей, которым мы пытаемся придать силу на наших собственных территориях\" в отношении британских граждан."
 ENG_event.4.a: "Вдохновляющий"
 ENG_event.5.t: "Разгон Адена"
 ENG_event.5.d: "Мы приняли решение подавить восстание Радфана и приняли агрессивный подход к разрешению чрезвычайной ситуации в Адене. Советую вам принять меры по подавлению восстания в стране и наращиванию оккупационных сил."
 ENG_event.5.a: "Необходимая мера"
 ENG_event.6.t: "Уйти из Адена"
 ENG_event.6.d: "Мы приняли решение полностью уйти из Адена и капитулировать перед радфанским восстанием. У нас есть более важные дела, которыми нужно заняться в другом месте."
 ENG_event.6.a: "Необходимая мера"
 ENG_event.7.t: "Удерживать Персидский залив"
 ENG_event.7.d: "Мы приняли решение подавить восстания в Персидском заливе и приняли агрессивный подход к урегулированию чрезвычайной ситуации в Адене. Советую вам принять меры по подавлению восстания в стране и наращиванию оккупационных сил."
 ENG_event.7.a: "Мы не дадим им ни дюйма!"
 ENG_event.8.t: "Вывод войск из Персидского залива"
 ENG_event.8.d: "Мы приняли решение полностью выйти из Персидского залива и капитулировать перед местными властями. У нас есть более важные дела, которыми нужно заняться в другом месте."
 ENG_event.8.a: "Бесполезная борьба"
 ENG_event.9.t: "Кризис платёжного баланса"
 ENG_event.9.d: "Наша ситуация с платежным балансом переросла в полномасштабный кризис,который угрожает подорвать Стерлинговую зону. По мере ухудшения ситуации наши казначейские резервы будут истощаться, процентные ставки будут ухудшаться, наша валюта будет колебаться, и мы будем бороться за то, чтобы позволить себе импорт."
 ENG_event.9.a: "Ужасная ситуация"
 ENG_event.10.t: "Отмена смертной казни"
 ENG_event.10.d: "В знаковом законодательном решении британский парламент принял закон об убийстве [GetYear], чтобы объявить вне закона смертную казнь за убийство и заменить ее обязательным пожизненным заключением. С этого момента все смертные приговоры были заменены пожизненными. Однако Государственная измена, жестокое пиратство, поджоги на королевских верфях, военные преступления и шпионаж по-прежнему караются смертной казнью."
 ENG_event.10.a: "Прогресс"
 ENG_event.11.t: "Железнодорожная реформа исследована"
 ENG_event.11.d: "В целях сокращения расходов мы проводим масштабный аудит железнодорожной реформы, чтобы выявить ненужные расходы или потенциальные области для сокращения расходов, а также повысить общую эффективность проекта расширения и предотвратить перерасход средств."
 ENG_event.11.a: "Интересно"
 ENG_event.12.t: "Пчелиный топор"
 ENG_event.12.d: "Учитывая сложившиеся обстоятельства, очевидно, что расширение маршрутной сети и реструктуризация железных дорог нашей страны являются чрезмерно масштабными. Мы не можем позволить себе продолжать идти по этому пути, и нам придется значительно сократить его. Уже 55% станций и 30% запланированных миль маршрута будут сокращены, чтобы уменьшить масштаб проекта."
 ENG_event.12.a: "Необходимое сокращение расходов"
 ENG_event.13.t: "Ночь длинных ножей"
 ENG_event.13.d: "Премьер-министр Великобритании провел крупную кадровую перестановку в кабинете министров, рассорив многочисленных членов своего кабинета. Масштабы этой перестановки огромны и окажут глубокое влияние на британскую политику."
 ENG_event.13.a: "До свидания"
 ENG_event.14.t: "Вассальный трибунал"
 ENG_event.14.d: "Джон Вассал был разоблачен как советский шпион во время работы в Адмиралтействе. В агентствах Великобритании уже проводятся масштабные реформы в области безопасности и аудита, и Джона Вассала собираются судить за шпионаж, что грозит ему смертью."
 ENG_event.14.a: "Будет справедливость!"
 ENG_event.15.t: "Дело Профумо"
 ENG_event.15.d: "Джон Профумо и модель Кристин Килер были найдены в романе друг с другом. В результате этого инцидента Джон Профумо ушел из своей политической карьеры и будет заменен и, вероятно, не сможет вернуться в политику в ближайшее время в результате скандала."
 ENG_event.15.a: "Скадал!"
 ENG_event.16.t: "Операция Баннер"
 ENG_event.16.d: "Этнонационалистические конфликты вскипели в Северной Ирландии, поскольку боевые действия между британскими вооруженными силами, ирландскими республиканцами и Ольстерскими лоялистами стали несостоятельными. Мы должны немедленно принять меры для восстановления порядка!"
 ENG_event.16.a: "Тяжелая ситуация"
 ENG_event.17.t: "Начало переговоров по ЕЭС"
 ENG_event.17.d: "Британское правительство начало переговоры с Европейским экономическим сообществом о работе в направлении региональной экономической интеграции и сотрудничества между европейскими странами."
 ENG_event.17.a: "Шаг вперед для Европы!"
 ENG_event.18.t: "Кампания против евроскептицизма"
 ENG_event.18.d: "Несмотря на готовность государства сотрудничать с Европейским сообществом в целях укрепления единства, многие люди выступают против Европейской экономической интеграции по целому ряду сложных причин. Наше правительство приняло меры, чтобы бросить вызов критикам и провести кампанию против евроскептицизма ради британской экономической стабильности и европейского сотрудничества."
 ENG_event.18.a: "Великобритания останется с Европой навсегда!"
  
 WhitehallFederation.1.t: "Восточноафриканская Федерация"
 WhitehallFederation.1.d: "Многие страны Восточной Африки начали обретать независимость от Соединенного Королевства. Несколько глав государств этих стран выразили заинтересованность в создании единой унитарной Федерации, а лидер Танганьики даже предложил отложить независимость, чтобы помочь этому плану. \nПредлагаемые члены Кения, Танганьика, Уганда, Занзибар, Бурунди, Руанда и Южный Судан в настоящее время взвешивают свои варианты и могут приступить к разработке региональной конституции и началу движений за федерацию."
 WhitehallFederation.1.a: "Один народ - одна судьба"
 WhitehallFederation.2.t: "Центральноафриканская Федерация"
 WhitehallFederation.2.d: "Лидеры Родезии и Ньясаленда выразили заинтересованность в создании самоуправляемой Федерации в Южной Африке. Колонии обратились к Великобритании с просьбой рассмотреть вопрос о поддержке Федерации колоний и разработке конституции для защиты прав поселенцев и коренных африканцев в регионе."
 WhitehallFederation.2.a: "Давайте достигнем величия"
  
  
 ENG_nuclear.1.t: "Операция Ураган"
 ENG_nuclear.1.d: "Наше первое ядерное испытание имеет огромный успех! \nНаше первое атомное оружие успешно взорвалось на островах Монте-Белло близ Западной Австралии. \nВ настоящее время мы являемся третьей ядерной державой в мире."
 ENG_nuclear.1.a: "Большой успех!"
 ENG_nuclear.2.t: "Соглашение о взаимной обороне Великобритании"
 ENG_nuclear.2.d: "Сегодня Великобритания подписала с нами соглашение о взаимной обороне и согласилась на сотрудничество в области ядерного оружия. В рамках соглашения мы будем обмениваться ядерными материалами, технологиями и информацией. \nС этим соглашением мы, несомненно, получим преимущество перед Советским Союзом!"
 ENG_nuclear.2.a: "Теперь нас ничто не остановит!"
 ENG_nuclear.3.t: "Ядерная программа Содружества"
 ENG_nuclear.3.d: "В рамках далеко идущих усилий было подписано соглашение о ядерном сотрудничестве Содружества. Все страны Содружества будут помогать друг другу в ядерных исследованиях и обмениваться технологиями и информацией, чтобы лучше укрепить наши позиции в мире как ядерной державы."
 ENG_nuclear.3.a: "Общие знания, общая сила"
 ENG_nuclear.4.t: "Операция Захват"
 ENG_nuclear.4.d: "Операция Захват претерпела оглушительный успех! \nНаша нация теперь обладает термоядерным оружием и это укрепило наши позиции как великой державы в мире. \nНесмотря на первоначальные неудачи, мы продолжали наступать и успешно разработали водородную бомбу с мощностью 3 мегатонны т. э."
 ENG_nuclear.4.a: "Мы - могучи!"
 ENG_nuclear.5.t: "Великобритания завершает операцию Грейфер"
 ENG_nuclear.5.d: "Великобритания успешно провела термоядерное испытание и теперь вышла на мировую арену в качестве ядерной державы. Ожидается, что они вскоре начнут распространять ядерное оружие и будут вооружены в течение года."
 ENG_nuclear.5.a: "Историческое событие"
  
 ENG_RHO.1.t: "Великобритания осуждает Родезийское ОПН"
 ENG_RHO.1.d: "Великобритания осудила Родезийское ОПН, назвав его возмутительным и порожденным исключительно этническим конфликтом. Родезийское одностороннее провозглашение независимости гласит, что Родезия теперь является независимым суверенным государством и выступает против британских притязаний на неё."
 ENG_RHO.1.a: "Варвары"
 ENG_RHO.2.t: "Родезийские переговоры сорваны"
 ENG_RHO.2.d: "Переговоры между Родезией и Великобританией полностью провалились. Британское правительство не признает и не поддерживает Родезийское государство, а Родезийское государство не принимает условий признания, изложенных британским правительством."
 ENG_RHO.2.a: "Предсказуемый результат"
 ENG_RHO.3.t: "Признание Родезии"
 ENG_RHO.3.d: "Правительство Великобритании официально признало Родезию суверенным государством. После нескольких месяцев внутренних дебатов и переговоров с родезийским парламентом британский парламент официально принял историческое решение признать Родезию законным государством. \nУже сейчас наблюдается большая международная реакция со стороны стран с региональными интересами, причем многие страны либо признают Родезию, либо Зимбабве в качестве законного государства. Родезийское правительство и его сторонники высоко оценили и поблагодарили Великобританию за их политическую поддержку, в то время как противники родезийского государства осудили эту акцию, сославшись на недовольство политикой и действиями родезийского правительства. \nНезависимо от британского решения, конфликты в регионе из-за лидерства будут продолжаться, и будущее Родезии зависит от местных жителей Южной Центральной Африки."
 ENG_RHO.3.a: "Вставай, глас Родезии!"
  
 EFTA.1.t: "Invitation to the EFTA"
 EFTA.1.d: "We have received an invitation to the European Free Trade Association, §Ywould you like to accept?§!\nThe EFTA will increase exported resources by 5%, increase trade income by 25%, increase construction speed (especially for dockyards and state infrastructure), reduce overall research speed by 3% while increasing it by 15% for logistics and infrastructure, and grant 20% additional civilian and naval intel to all foreign nations."
 EFTA.1.a: "No"
 EFTA.1.b: "Yes"
 EFTA.2.t: "Formation of the EFTA"
 EFTA.2.d: "We have established the European Free Trade Association to bolster trade!"
 EFTA.2.a: "A Major Step Forward"
  
  ##### FRA FRANCE ##### 
  #1970# 
 FRA_event.1.t: "Конец Славного тридцатилетия"
 FRA_event.1.d: "В 1944 году Шарль де Голль ввел экономическую политику, известную как дирижизм. Дирижизм был фактически государственным руководством капиталистической экономики и привел к обширному периоду быстрого экономического роста и процветания страны. По прошествии 30 лет этот период подошел к концу, и французский экономический рост номинально прекратился."
 FRA_event.1.a: "Какие грандиозные 30 лет"
 FRA_event.2.t: "Французские маоисты арестованы"
 FRA_event.2.d: "[ROOT.GetLeader] поспособствовал тому чтобы, лидеры маоистов были арестованы, а маоистские группы во Франции ликвидируются. Прямо сейчас французская полиция и военные прочесывают страну, выслеживая беглых маоистов и расправляясь с их организациями."
 FRA_event.2.a: "Отправьте их в тюрьму!"
 FRA_event.3.t: "Расширение лагеря Larzac"
 FRA_event.3.d: "Расширение военного лагеря Larzac в настоящее время продолжается, но оно было встречено ожесточенным местным сопротивлением. Местные жители решительно выступают против расширения лагеря и начали занимать земли, купленные военными для расширения."
 FRA_event.3.a: "Такое поведение неприемлемо"
 FRA_event.4.t: "Франция покидает НАТО!"
 FRA_event.4.d: "Франция официально вышла из НАТО. [ROOT.GetLeader] сегодня официально объявил о выходе Франции из НАТО, сославшись на многочисленные претензии к организации и ее практике. Вывод войск вступает в силу немедленно, и Франция аннулировала все связанные с НАТО договоры со своей страной. Многочисленные лидеры во всем мире ошеломлены таким развитием событий, и эта акция вызвала неоднозначную реакцию со стороны разных стран. Несмотря на это, многие страны отказались от официальных заявлений в настоящее время. Потеря Франции как союзника НАТО означает, что НАТО будет значительно слабее в регионе и в мире в целом, поскольку военно-морской флот и ядерная энергетика Франции были важным основным элементом стратегической мощи организации."
 FRA_event.4.a: "Без комментариев"
 FRA_event.4.b: "Они имеют нашу поддержку"
 FRA_event.4.c: "Это достойное осуждения действие"
 FRA_event.5.t: "Франция проводит ядерное разоружение"
 FRA_event.5.d: "Наша нация сейчас находится в процессе ядерного разоружения. Мы закрываем атомные электростанции и отменяем все неэнергетические и научные ядерные проекты в стране."
 FRA_event.5.a: "Наконец-то"
 FRA_event.6.t: "Окончание атмосферных ядерных испытаний"
 FRA_event.6.d: "Под руководством [ROOT.GetLeader], теперь мы прекратили все атмосферные ядерные испытания в стране по множеству причин. После более чем десятилетних испытаний , наконец, настало время для Франции остановить испытания."
 FRA_event.6.a: "Вот и прекрасно!"
 FRA_event.7.t: "Поддержка ООП"
 FRA_event.7.d: "Мы начали оказывать поддержку Организации Освобождения Палестины и ее борьбе. Мы посылаем им денежную и материальную помощь в надежде поддержать их дело."
 FRA_event.7.a: "Хорошо их используйте"
 FRA_event.8.t: "Создание ОДФ"
 FRA_event.8.d: "Объединенный Демократический фронт был основан во Франции. Группа выступает против апартеида, институционального и системного расизма и поддерживает демократические реформы в Африке."
 FRA_event.8.a: "Ошеломляющее развитие событий"
  
 EEC.event.1.t: "Основание евро"
 EEC.event.1.d: "Европейское экономическое сообщество до сих пор было чрезвычайно успешным общим рынком в Европе и способствовало потрясающему уровню экономического роста и международному единству в Европейском сообществе. Пришло время создать единую валюту для ЕЭС, которая отныне будет называться евро."
 EEC.event.1.a: "Большое достижение"
 EEC.event.2.t: "Мы приняли евро"
 EEC.event.2.d: "Наша нация, будучи частью ЕЭС, решила принять Евро."
 EEC.event.2.a: "Замечательное развитие!"
 EEC.event.3.t: "Оставьте змею в туннеле"
 EEC.event.3.d: "После бесконечных дебатов и обширного анализа мы решили выступить против создания единой европейской валюты и будем бороться со змеей в туннеле."
 EEC.event.3.a: "В любом случае это была плохая идея"
 EEC.event.4.t: "Приглашение в ЕЭС"
 EEC.event.4.d: "Наша страна была приглашена на общий рынок Европейского Экономического Сообщества. \n§Хотите ли вы принять это предложение?§!"
 EEC.event.4.a: "Да"
 EEC.event.4.b: "Нет"
  
 EUROPE_space.1.t: "Создание Европейского космического агентства"
 EUROPE_space.1.d: "Европейское космическое агентство было официально создано с целью объединения многих различных европейских стран для создания международного космического агентства и содействия инновациям, связанным с космосом. Агентство также стремится содействовать сотрудничеству и обмену научными знаниями между членами агенства. \nПо их собственным словам, \"Целью ЕКА является обеспечение и поощрение исключительно в мирных целях сотрудничества между европейскими государствами в области космических исследований и технологий и их применения в космосе с целью их использования в научных целях.\""
 EUROPE_space.1.a: "Новый рассвет для человечества!"
 EUROPE_space.1.b: "Пустая трата времени!"
 EUROPE_space.1.c: "Они получат нашу прямую поддержку!"
  
  #####CZECH EVENTS##### 
 prague_spring.1.t: "Писатели дисциплинированы"
 prague_spring.1.d: "Летом Союз чехословацких писателей начал публиковать статьи с незначительной критикой партии и медленной реабилитацией чехословацких деятелей культуры. Эта критика дошла до того, что самый прокоммунистический журнал Литературные Новости стал выступать за то, чтобы литература больше не подтверждала партийную доктрину. Однако этот период осторожных высказываний в пользу реформы был свернут после недавнего заседания Коммунистической партии Чехословакии, на котором высшие руководители решили административно наказать конкретных писателей, выступавших за реформу. Партия также разместила несколько журналов под надзором Министерства культуры. Хотя партия действовала, многие в стране, особенно среди интеллектуального класса, говорят, что они все больше недовольны партией и ее подходом к обществу."
 prague_spring.1.a: "Писатели должны учиться"
  
 prague_spring.2.t: "Брежнев посещает Пражскую встречу"
 prague_spring.2.d: "Президент Антонин Новотный правил Чехословакией с авторитарной жилкой с тех пор, как стал первым секретарем Коммунистической партии Чехословакии (КПЧ). Однако в последние годы президент Новотный столкнулся с усиленной критикой внутри партии и в народе за свою практику. Чтобы подкрепить свою поддержку, президент Новотный попросил Леонида Брежнева принять участие в последнем заседании Центрального комитета в Праге. Однако на этой встрече Александр Дубчек, первый секретарь компартии Словакии, возглавил попытку занять пост первого секретаря КПЧ. Брежнев был удивлен тем, как много членов КПЧ повернулось против президента Новотного, и теперь сраженный президент спросил его мнение по этому вопросу. Товарищ Брежнев должен принять решение либо поддержать непопулярного и слабого президента Новотного, либо одобрить назначение Дубчека первым секретарем, что может объединить КПЧ и уменьшить волнения в обществе."
 prague_spring.2.a: "Вернуть Новотного"
 prague_spring.2.b: "Вернуть Дубчека"
  
 prague_spring.3.t: "Брежнев поддерживает Новотного"
 prague_spring.3.d: "Во время недавнего заседания Центрального Комитета президент Антонин Новотный столкнулся с острой критикой и утратой поддержки со стороны многих высших партийных руководителей. Затем эти критики попытались снять его с поста первого секретаря Коммунистической партии Чехословакии (КПЧ). Однако, чтобы противостоять такому сценарию, президент Новотный ранее призвал Генерального секретаря СССР Леонида Брежнева принять участие в совещании, чтобы защитить себя от таких нападок, и эта тактика оказалась успешной. Несмотря на настойчивые попытки убрать его, Брежнев решил поддержать президента Новотного и прекратил покушения. Президент Новотный остается первым секретарем КПЧ, а Чехословакия остается под его контролем. Однако многие в КПЧ и по всей стране, как говорят, расстроены этим вмешательством Москвы, и хотя Новотный пережил вызов, ему придется иметь дело с недовольством как среди народа, так и среди своей партии."
 prague_spring.3.a: "Новотный доволен"
  
 prague_spring.4.t: "Брежнев поддерживает Дубчека"
 prague_spring.4.d: "Во время недавнего заседания Центрального Комитета президент Антонин Новотный столкнулся с острой критикой и утратой поддержки со стороны многих высших партийных руководителей. Затем эти критики попытались снять его с поста первого секретаря Коммунистической партии Чехословакии (КПЧ). Однако, чтобы противостоять такому сценарию, президент Новотный ранее призвал Генерального секретаря СССР Леонида Брежнева принять участие в совещании, чтобы защитить себя от таких нападок, но эта тактика оказалась ошибкой. Товарищ Брежнев был ошеломлен уровнем недовольства и решил утвердить назначение Александра Дубчека новым первым секретарем. Хотя Дубчек сейчас контролирует КПЧ, Новотный останется президентом. Ожидается, что Дубчек постепенно возьмет под контроль партийный аппарат и выдвинет своих сторонников на ключевые посты."
 prague_spring.4.a: "Поздравляем товарища Дубчека"
  
 prague_spring.5.t: "Ответ на критику СМИ президента Новотного"
 prague_spring.5.d: "Назначение Александра Дубчека первым секретарем Коммунистической партии Чехословакии (КПЧ) привело к тому, что президент Антонин Новотный потерял большую часть своей политической власти в стране. Вскоре после назначения Дубчека, Эдуард Гольдштюкер стал председателем Союза чехословацких писателей и главным редактором ведущего журнала Литературные Новости. Недавно Гольдштюкер бросил вызов политике государственной цензуры, открыто критикуя политику президента Новотного в интервью национальному телевидению. Президент Новотный и его сторонники призвали Дубчека обеспечить соблюдение законов о цензуре и наказать Гольдштюкера. Тем не менее, другие члены партии призвали Дубчека разрешить эти критические замечания и поддерживать атмосферу открытости для народа. Они считают, что суровое применение законов о цензуре только оттолкнет людей."
 prague_spring.5.a: "Разрешить критику"
 prague_spring.5.b: "Применить цензуру!"
  
 prague_spring.6.t: "Конец цензурных законов"
 prague_spring.6.d: "Реакция на решение не подавлять публичную критику президента Антонина Новотного привела к более широким дискуссиям о политической реформе и открытости. Действительно, поддержка реформ и открытости привела к тому, что по всей стране появились общественные митинги в поддержку первого секретаря Александра Дубчека. Теперь Дубчек должен решить, начнет ли он процесс отмены строгих законов о цензуре или откатит общественное настроение, расправившись с этими публичными митингами и публикациями. Объявление о намерении отменить законы о цензуре обеспечит Дубчеку большую общественную поддержку, позволит ему проводить большую политику реформ в народе и укрепить своих сторонников в партии. Однако вместо того, чтобы разгонять эту новую открытость, это оттолкнет население и его собственных сторонников партии, но это, скорее всего, успокоит опасения Москвы и среди сторонников жесткой линии партии."
 prague_spring.6.a: "Начните заканчивать законы о цензуре"
 prague_spring.6.b: "Репрессии против реформаторов"
  
 prague_spring.7.t: "Президент Новотный уходит в отставку"
 prague_spring.7.d: "Недавнее решение Александра Дубчека, первого секретаря Коммунистической партии Чехословакии (КПЧ), начать отмену законов о цензуре сильно возмутило членов партии жесткой линии, включая президента Антонина Новотного, который объявил о своей отставке. Для Новотного и других сторонников жесткой линии в КПЧ открытие политического пространства и средств массовой информации наряду с другими реформами грозит разрушить единство партии и коммунистический порядок в Чехословакии. Впоследствии Дубчек предложил пост президента генералу Людвику свободе, и тот согласился. Президент "Свобода" объявил, что будет поддерживать усилия по реформированию, и его назначение высоко ценится по всей стране из-за его высокооплачиваемой военной карьеры. В политическом плане президент Свобода пережил послевоенные чистки и считается национальным героем среди чехов и словаков."
 prague_spring.7.a: "Народ приветствует нового президента"
  
 prague_spring.8.t: "Дубчек обнародовал программу действий"
 prague_spring.8.d: "В знаковом продвижении политики реформ первый секретарь Александр Дубчек объявил о начале того, что он называет программой действий. Программа предусматривает постепенную либерализацию Чехословакии путем расширения свободы печати, слова, передвижения. Экономическая реформа также обсуждается наряду с признанием того, что многопартийная политика может в конечном итоге вернуться в страну. Дубчек отметил, что прежняя коммунистическая политика не была ошибочной, поскольку она была необходима для прекращения буржуазного влияния и послевоенной нестабильности. Теперь Дубчек и реформаторы считают, что главной целью программы действий является социалистическое общество с позитивными отношениями с государством. Хотя Дубчек не критиковал коммунизм и заявил, что будет работать с другими коммунистическими партиями, Москва, как говорят, смотрит на эти события с большим подозрением. Они особенно обеспокоены заявлением Дубчека, что программа действий лучше адаптирует коммунизм к Чехословацкому обществу и предложит социализм с человеческим лицом."
 prague_spring.8.a: "Да здравствует социалистическое общество"
  
 prague_spring.9.t: "Восторженное Первомайское празднование"
 prague_spring.9.d: "Общественный энтузиазм и поддержка реформирующегося правительства в Чехословакии привели к тому, что рекордные толпы людей собрались по всей стране на ежегодное празднование Первомая. Коммунистическая партия Чехословакии (КПЧ) под руководством Первого секретаря Александра Дубчека в настоящее время пользуется широкой общественной поддержкой после запуска его программы действий. Многие в Чехословакии поддерживают новую открытость в публичном дискурсе и продолжение политических реформ. Сокращение цензурных законов и открытие политического пространства привели к беспрецедентному политическому участию. Хотя партия остается у власти и невероятно популярна, противники реформы и другие коммунистические государства обеспокоены тем, что со временем эти реформы приведут к возрождению некоммунистических партий в Чехословакии. Как бы то ни было, Пражская весна в самом разгаре, и люди наслаждаются ею."
 prague_spring.9.a: "Памятный Первомай"
  
 prague_spring.10.t: "Дубчек посещает Москву"
 prague_spring.10.d: "Первый секретарь Александр Дубчек недавно завершил официальный визит в Москву. Дубчек взял под эффективный контроль Чехословакию и Коммунистическую партию Чехословакии (КПЧ). Под его руководством он осуществлял надзор за либерализацией Чехословацкого общества в рамках своей реформистской программы действий. Хотя он изо всех сил старался подчеркнуть, что эта политика является естественным продолжением коммунистической идеологии, многие в Москве и во всем коммунистическом мире считают открытие общества серьезной угрозой. Они особенно обеспокоены тем, что Дубчек терпимо относится к дебатам о восстановлении некоммунистических партий в стране. Советское руководство подчеркнуло эти опасения Дубчеку, и после напряженной серии встреч Дубчек вернулся в Прагу. Хотя Дубчек заявил о визите как об обмене идеями, ясно, что связи между Чехословакией и Советским Союзом напряжены и советы будут внимательно следить за событиями."
 prague_spring.10.a: "В Москве сейчас особенно холодно"
  
 prague_spring.11.t: "Цензура официально отменена"
 prague_spring.11.d: "Первый секретарь Александр Дубчек после вступления в должность начал процесс ослабления цензурных законов. Эти усилия были высоко оценены по всей Чехословакии, и ее традиционно энергичные интеллектуальные круги были омоложены недавним открытием политического пространства. Сегодня процесс отмены законов о цензуре был официально завершен, и правительство объявило о прекращении цензуры в Чехословакии. Правительство быстро заметило, что отмена цензуры не означает анархию, а подтверждает коммунистическое развитие общества. Правительство не ожидает, что люди будут обсуждать разрушительные идеи или оспаривать дальнейшее развитие государства партией. Говорят, что послы других коммунистических государств выразили свои оговорки в связи с этим последним событием президенту Чехословакии."
 prague_spring.11.a: "Пусть люди говорят"
  
 prague_spring.12.t: "Публикация манифеста Вацулика"
 prague_spring.12.d: "Ведущий журналист Людвиг Вацулик недавно опубликовал манифест под названием Две тысячи слов, подписанный ведущими художниками и интеллектуалами. В манифесте утверждалось, что Коммунистическая партия Чехословакии (КПЧ) привела страну к упадку, и политика открытости должна продолжаться. Она призывала не к революции, а к большей демократизации общества под руководством КПЧ. Он также выступал за ускорение либерализации и восстановление дореволюционных социалистических партий. Манифест возмутил консервативную базу КПЧ, которая утверждает, что документ является следствием программы действий первого секретаря Александра Дубчека. Под огромным давлением консерваторов Дубчек и ведущие члены КПЧ быстро осудили этот документ, но его влияние, как говорят, вызвало озабоченность во всем европейском коммунистическом мире."
 prague_spring.12.a: "Мы осуждаем этот манифест"
  
 prague_spring.13.t: "Советские военные учения у границы"
 prague_spring.13.d: "В южной Германии, недалеко от чехословацкой границы, советские войска Варшавского договора проводят крупные военные учения. Газеты в Праге отмечали, что ВС Чехословакии не участвовали в учениях и что оно происходит до запланированных переговоров между Чехословацким и Советским правительством по поводу недавних либеральных реформ. Многие граждане обеспокоены тем, что учения являются генеральной репетицией советской интервенции, и заявляют, что правительство должно подготовиться к сопротивлению. Однако чехословацкое правительство не дало никаких указаний на то, что оно начнет какой-либо военный ответ, и в своем заявлении вновь подтвердило свою связь с Советским Союзом и его союзниками. Кроме того, советские военные офицеры также посещали страну в большем количестве. Советские военные визиты также рассматриваются как попытка Советов подготовиться и провести разведку на случай интервенции."
 prague_spring.13.a: "Нечего здесь смотреть"
  
 prague_spring.14.t: "Встреча с чехословацкими лидерами"
 prague_spring.14.d: "Высокопоставленные советские руководители, включая генерального секретаря Совета, встретились с первым секретарем Дубчеком и президентом Чехословакии Свободой. Советские лидеры призывали Чехословакию прекратить программу либерализации и подтвердить Московскую коммунистическую линию. Они отметили, что либерализация привела к росту движения, требующего многопартийных выборов и анархии. Они предполагают, что если порядок не будет восстановлен, то сам коммунизм может рухнуть на улицах Праги. Однако чехословацкие лидеры отмечали популярность своих программ и усиление популярности партии в народе. Вместо того чтобы капитулировать перед советскими требованиями, они предложили советам рассматривать их как образец для реформирования партии и возрождения поддержки коммунизма. Советский Генеральный секретарь должен принять решение либо осудить чехословацкую модель, либо вместо этого привезти её в Москву и инициировать небольшую либеральную программу реформ, чтобы проверить её обоснованность."
 prague_spring.14.a: "Принести либеральные реформы в Москву"
 prague_spring.14.b: "Bring liberal reforms to Moscow"
  
 prague_spring.15.t: "Итоги Советского совещания"
 prague_spring.15.d: "Высокопоставленные советские руководители встречались с высокопоставленными членами нашего правительства в Словакии в течение двух дней. Советские лидеры были весьма непреклонны в своей критике нашей программы действий и требовали, чтобы мы обратили вспять либерализацию. Они утверждали, что в стране царит анархия и наша партия не может контролировать распространение опасных идей. Наши лидеры защищали ее политику и настаивали на том, что наша либерализация является наилучшим подходом для Чехословакии. В конце концов, результат не мог быть достигнут, но ясно, что Советы требовали, чтобы мы прекратили наши реформы. Первый секретарь Александр Дубчек должен теперь решить, прекратить ли программу действий и уйти в отставку или продолжить процесс и отказаться от советских требований. Советский посол ждет нашего окончательного ответа на советские требования."
 prague_spring.15.a: "Отказаться от советских требований"
 prague_spring.15.b: "Принять советские требования"
  
 prague_spring.16.t: "Доктрина Брежнева и одобрение вторжения"
 prague_spring.16.d: "Генеральный секретарь Леонид Брежнев представил советскому руководству свою новую доктрину. Подробности планируется опубликовать в следующем месяце в газете Правда. Советский Союз решил, что любые угрозы социалистическому правлению в любых коммунистических государствах в пределах его влияния в Европе будут представлять собой угрозу, которая должна быть предотворощена. Опасные реформы в Чехословакии достигают анархического уровня, и Коммунистическая партия там находится на грани потери контроля. Брежнев получил письмо от консервативных коммунистов Чехословакии с просьбой о советской помощи. Посоветовавшись с лидерами Болгарии, Польши и Венгрии, Брежнев одобрил военное вторжение в Чехословакию для восстановления порядка. Вторжение станет первым примером брежневской доктрины в действии."
 prague_spring.16.a: "Вторжение начинается"
  
 prague_spring.17.t: "Вторжение в Чехословакию"
 prague_spring.17.d: "Ночью подавляющая военная сила четырех стран Варшавского договора, Советского Союза, Болгарии, Польши и Венгрии пересекла границу Чехословакии. Чехословацкое правительство приказало военным и народу не сопротивляться, и вооруженные силы остались в своих казармах. Советское правительство объявило, что оно вынуждено действовать после получения запросов от чехословацких коммунистов, которые опасались, что правительство ведет страну к катастрофе. Граждане Праги вышли протестовать против захватчиков, но в течение дня страна была оккупирована Варшавским договором. Однако население приняло участие в широкомасштабных ненасильственных акциях протеста против оккупационных войск. Ожидается, что начатые правительством реформы будут свернуты, а консервативные коммунисты восстановлены во власти. На международном уровне было много негативной реакции по поводу советского вторжения, даже среди некоторых коммунистических государств, которые рассматривают этот акт как нарушение суверенитета"
 prague_spring.17.a: "Весна подошла к концу"
  
 prague_spring.18.t: "Вторжение в Чехословакию"
 prague_spring.18.d: "Ночью подавляющая военная сила четырех стран Варшавского договора, Советского Союза, Болгарии, Польши и Венгрии пересекла границу Чехословакии. Чехословацкое правительство приказало военным и народу не сопротивляться, и вооруженные силы остались в своих казармах. Советское правительство объявило, что оно вынуждено действовать после получения запросов от чехословацких коммунистов, которые опасались, что правительство ведет страну к катастрофе. Граждане Праги вышли протестовать против захватчиков, но в течение дня страна была оккупирована Варшавским договором. Ожидается, что начатые правительством реформы будут свернуты, а консервативные коммунисты восстановлены во власти. Однако население приняло участие в широкомасштабных ненасильственных акциях протеста против оккупационных войск. Говорят, что реформаторы во главе с первым секретарем Александром Дубчеком ведут переговоры с советскими войсками и сотрудничают с ними. Похоже, Чехословацкий эксперимент с либерализмом подошел к концу."
 prague_spring.18.a: "Весна подошла к концу"
  
 prague_spring.19.t: "Цензура вновь введена"
 prague_spring.19.d: "После вторжения первый секретарь Александр Дубчек, который курировал либерализацию коммунистического правления, остался у власти, поскольку Советы не хотели превращать ненасильственные протесты в открытое восстание. Действительно, советы согласились на умеренный пакет ограниченных реформ, названный московскими протоколами. Однако Дубчек был вынужден вновь ввести цензуру в Чехословакии. Это решение теперь положило конец либерализации средств массовой информации и общественных собраний, которая оживила народ Праги в течение последних нескольких месяцев. Ведущие журналисты, писатели и интеллектуалы должны теперь вернуться к правительственной линии, иначе правительство может заставить их замолчать, уволить или арестовать. Консервативные коммунисты теперь прочно стоят у власти. Этот акт подтверждается Московским протоколом, в котором говорилось, что социализм в стране должен быть восстановлен в своем первоначальном виде."
 prague_spring.19.a: "Конец анархии, конец беспорядкам"
  
 prague_spring.20.t: "Чехословакия становится Федеративной Республикой"
 prague_spring.20.d: "Хотя Пражская весна внезапно закончилась после советского вторжения, одна из целей реформаторов была достигнута сегодня. Чехословакия официально стала Федеративной Республикой, восстановив то, что многие в Чехословакии считают своим демократическим наследием. Цензура остается, как и откат от многих более либеральных аспектов Пражской весны, однако Советский Союз уступил реформаторам. Советский Союз был в значительной степени удивлен ненасильственным сопротивлением, с которым они столкнулись после вторжения, и хотя восстановление социализма было основной целью, они согласились позволить эти ограниченные уступки народу Чехословакии."
 prague_spring.20.a: "Лучше что-то, чем ничего"
  
 prague_spring.21.t: "Дубчек заменен на посту первого секретаря"
 prague_spring.21.d: "Первый секретарь Александр Дубчек, архитектор либерализма и Пражской весны, сегодня был снят со своего поста. Хотя советы стремились положить конец его правлению после вторжения, количество ненасильственных протестов и искренняя поддержка его реформ заставили их вместо этого сохранить Дубчека у власти, хотя и под пристальным наблюдением. Он руководил восстановлением законов о цензуре и откатом своей программы действий, но теперь советы уверены, что могут отстранить его от власти. Его заменит жесткий коммунист Густав Гусак, который пользуется благами Москвы. Ожидается, что Гусак будет проводить более автократическую линию и обеспечит, чтобы силы открытости и либерализации, высвобожденные реформами Дубчека, не представляли дальнейшей угрозы коммунистическому правлению в стране. Говорят, что многие в Чехословакии опечалены смещением Дубчека."
 prague_spring.21.a: "До свидания и спасибо, Дубчек"
  
  ### SAF ### 
  
 SAF_event.1.t: "Саймонс-Таунское соглашение"
 SAF_event.1.d: "Колония Южной Африки официально подписала соглашение о военно-морском сотрудничестве с Великобританией, известное как Саймонс-Таунское соглашение. Королевский военно-морской флот передал свой военно-морской порт в Саймонс-Тауне южноафриканскому Военно-Морскому Флоту при условии, что он по-прежнему будет обслуживать флоты Королевского флота. Кроме того, соглашение также предоставило Южной Африке 6 противолодочных фрегатов, 10 береговых тральщиков и 4 катера береговой обороны. Саймонс-Таунское соглашение было основано на принципе защиты морских путей между Великобританией и Ближним Востоком и улучшения автономного военно-морского потенциала Южной Африки."
 SAF_event.1.a: "Какое замечательное соглашение"
  
 SAF_event.2.t: "Южно-Африканская Республика"
 SAF_event.2.d: "Наша страна сейчас находится на пути к республике. Наши бесконечные усилия по утверждению себя в качестве полнофункциональной республики, представляющей волю народа, продолжаются!"
 SAF_event.2.a: "Разные люди объединяются!"
  
 Namibia.1.t: "Намибийский вопрос"
 Namibia.1.d: "Во время Первой мировой войны южноафриканские войска свергли немецкую колониальную администрацию Намибии. После окончания войны был учрежден мандат. В последнее время давление на глобальную деколонизацию и национальное самоопределение вынудило нас ответить на Намибийский вопрос. Наши сегодняшние решения кардинально повлияют на жизнь каждого жителя Намибии."
 Namibia.1.a: "Время выбрать"
  
 Namibia.2.t: "Аннексия Намибии"
 Namibia.2.d: "Южная Африка решила полностью аннексировать Намибию. Когда правительство Южной Африки стало настаивать на принятии решения по Намибийскому вопросу, оно решило продлить свой мандат на неопределенный срок и настаивать на полной интеграции Намибии. Хотя некоторые считают эти действия несправедливыми, другие считают, что это естественный результат мандата. Как бы то ни было, оппозиция этой акции вряд ли долго будет молчать."
 Namibia.2.a: "Время покажет"
  
 Namibia.10.t: "Намибийская проблема доведена до ООН"
 Namibia.10.d: "Мы принесли Намибийский вопрос в ООН, чтобы помочь принять решение. ООН посоветовала нам предоставить Намибии независимость, заявив, что они имеют право на самоуправление."
 Namibia.10.a: "Предложить 10-летнюю опеку"
 Namibia.10.b: "Согласиться с решением"
  
 Namibia.11.t: "Южная Африка устанавливает 10-летнюю опеку"
 Namibia.11.d: "После дебатов с ООН правительство Южной Африки и Организация Объединенных Наций согласились с тем, что Намибия должна быть свободной и независимой после 10-летней опеки. В течение этих 10 лет Южная Африка сохранит свой мандат над Намибией до того, как произойдет деколонизация. Южная Африка утверждала, что Намибии следует потратить время на подготовку своего нового правительства, включая создание собственной парламентской системы и разработку Конституции, а не становиться независимой слишком быстро. Представители Организации Объединенных Наций согласились с тем, что это наилучший вариант, и была установлена опека.многие намибийцы считают, что южноафриканское правительство должно помочь развитию страны своими налоговыми долларами и взносами в это время, хотя это и не является обязательным в соответствии с соглашением ООН!"
 Namibia.11.a: "10 лет для подготовки"
  
 Namibia.12.t: "Независимая Намибия"
 Namibia.12.d: "После дебатов с ООН правительство Южной Африки и Организация Объединенных Наций согласились с тем, что Намибия должна немедленно стать независимой. С этого момента все административные активы переводятся из Намибии в Южную Африку, и ООН помогает Намибии создать переходное правительство до тех пор, пока они не смогут создать парламент, создать избирательные округа и разработать проект Конституции."
 Namibia.12.a: "Единство, Свобода, Справедливость"
  
 Namibia.13.t: "Намибия свободна"
 Namibia.13.d: "10-летняя опека закончилась, и Намибия официально является свободным, независимым, самоуправляющимся государством."
 Namibia.13.a: "Единство, Свобода, Справедливость"
  
 #  swe.5.d: "Folkhemmet is a political concept that describes the Swedish welfare state, usually viewed as midway between capitalism and socialism. The Social Democratic leaders Ernst Wigforss, Gustav Möller and Per Albin Hansson are considered the main architects of folkhemmet, with inspiration from the conservative Kjellén and the Danish Social Democrats C.V. Bramsnæs and Karl Kristian Steincke.\nPer Albin Hansson introduced the concept in 1928 saying that Sweden should become more like a \"good home\", this being marked by equality and mutual understanding. Hansson advocated that the traditional class society should then be replaced by folkhemmet. This concept came to include free and high quality education at all levels, free universal healthcare and many other social benefits."
  
 #Burkina Faso/Upper Volta 
 brk.1.d: "Jean-Baptiste Ouédraogo, has ruled Upper Volta since 1982 when he assumed the precidency after the 1982 Coup. More ideologically moderate than most of his comrades, Ouédraogo did not command much popular support and governed the country amid an unstable political climate. After prolonged dispute with Prime Minister Thomas Sankara culminated to purging of the several radicals, Ouedraogo was deposed in a coup led by Captain Blaise Compaoré, who made his close friend Sankara President. Sankara has promised to begin a period of societal transformation of the state."
 brk.2.d: "Проливийский капитан-десантник, который был уволен с поста премьер-министра Верхней Вольты в мае, захватил сегодня власть в западноафриканской стране в результате государственного переворота, в результате которого, как сообщается, погибли 13 человек и 15 получили ранения. Дипломаты в Верхней Вольте сообщили, что 6 раненых были французскими гражданами.Капитан Томас Шанкара, 35 лет, выступил по национальному радио, чтобы объявить о свержении правительства президента Жан-Батиста Уэдраого. Это был третий переворот в Верхней Вольте за три года, и он произошел за год до обещанного возвращения к гражданскому правлению.Капитан Шанкара был описан как "убежденный марксист-ленинец" и, как говорят, особенно популярен среди молодых жителей Верхнего Вольта. Он стал национальным героем в 1974 году, возглавив рейд в Мали во время короткой пограничной войны в том году."
 brk.3.d: "После свержения Ламизаны в 1980 году полковник Сае Зербо восстановил полное военное правление, завершившееся Ламизаной с президентскими и парламентскими выборами 1978 года. Поначалу его поддерживали профсоюзы и большая часть политической оппозиции, но вскоре он сделал их своими врагами. Создав хунту со многими радикальными членами, руководство Зербо становилось все более диктаторским. Он вновь запретил все политические партии и вновь объявил трудовые забастовки незаконными.Протесты в Нанти-Зербо становились все более частыми: в апреле прошли антиправительственные забастовки, в мае профсоюзы потребовали возвращения к конституционному правительству, а в сентябре были арестованы несколько видных профсоюзных и оппозиционных лидеров.Теперь прогрессивные и радикальные фракции внутри военного режима были сыты по горло Зербо.В столице начальник штаба армии полковник Габриэль Йорьян Соме и другие офицеры, называющие себя Советом народного спасения, двинулись свергать и арестовывать Зербо. Зербо был объявлен лживым демагогом, предавшим доверие своего народа.\Через два дня после переворота новая хунта назначила главой государства малоизвестного армейского врача майора доктора Жан-Батиста Уэдраого."
 brk.4.d: "Сангуле Ламизана правит Верхней Вольтой с момента своего переворота против Мориса Ямеого в 1966 году. Ламизана продолжал править страной как военный диктатор до президентских выборов в Верхнем Волтане в 1978 году, когда он был избран лидером гражданского режима. В течение 1970-х годов правительство Ламизаны столкнулось со многими проблемами, среди которых продолжающаяся оппозиция со стороны профсоюзов, появление новых политических оппозиционных групп, сильная засуха в Сахеле, растущее опустынивание и так далее. Потребность в иностранной помощи достигла рекордного уровня, составив в 1979 году целых 70% государственного бюджета.В феврале 1979 года крупнейшие профсоюзы начали новую кампанию против Ламизаны. В мае два видных лейбористских лидера были арестованы за подстрекательство к восстанию. Два месяца спустя Ламизана осудил требования юнионистов, призывая к национальному единству. К декабрю президент окончательно признает зависимость страны от западной помощи для выживания.Вскоре после этого полковник Сайе Зербо возглавил военный переворот, свергнув президента Ламизану. Переворот оказался и бескровным, и успешным. Спецназ, развернутый против бастующих рабочих, попытался совершить контрпереворот в поддержку Ламизаны, но не смог восстановить его в должности. Зербо - ветеран войны, бывший министр иностранных дел 1974-1976 годов, командир армейского полка в столице Уагадугу и глава военной разведки - приостановил действие конституции и учредил Военный комитет восстановления национального прогресса, состоящий из 31 члена хунты. Несколько членов хунты были молоды и радикальны, среди них будущие президенты Томас Шанкара и Блэз Компаоре. Среди тех слоев общества, которые поддерживали переворот, были люди мосси и католики Верхнего Волтана, две группы, отстраненные Ламизаной, хотя Зербо, как и его предшественник, был мусульманином Биссы."
 brk.5.d: "Мы добились независимости в 1960 году. Морис Ямеого создал однопартийную диктатуру, сделав свой собственный Демократический союз единственной легальной политической партией в стране. Оппозиционные партии, такие как Африканская партия перегруппировки, были либо объединены с ней, либо распущены.Правительство Ньямеого столкнется с обвинениями в неоколониализме, поскольку оно тесно сотрудничало с французским правительством. Жесткая политика президента и глубоко коррумпированное состояние его администрации сделали его чрезвычайно непопулярным. В 1964 году правительство сильно ограничило право рабочих на организацию и запретило трудовые забастовки, сделав сильные профсоюзы своими врагами. На президентских выборах в следующем году Ямеого был переизбран с предполагаемой 100-процентной поддержкой и явкой 98,4%. Парламентские выборы на следующий день официально показали 100% поддержку и 97,4% явки в пользу Демократического союза Вольта, но на самом деле массовое воздержание в знак протеста против президента и его партии имело место.30 декабря, после обострения экономических проблем, правительство объявило о новой жесткой экономии бюджета, массово урезав зарплаты бюджетникам и повысив налоги. На следующий день Денис Ямеого – министр внутренних дел и безопасности и сводный брат президента-применил грубую силу, чтобы разогнать собрание национального лейбористского руководства. В результате была объявлена всеобщая забастовка. 1 января 1966 года президент Ямеого объявил в стране чрезвычайное положение. 2 января он развернул войска во всех общественных зданиях и предостерег государственных служащих от участия во всеобщей забастовке. Наконец, 3 января началась всеобщая забастовка. Большие группы протестующих рабочих штурмовали штаб-квартиру правящей партии и Национальное собрание. Чрезвычайное положение и развертывание войск обернулись против правительства - рядовые солдаты отказались стрелять в протестующих. Короче говоря, вмешалось военное руководство. Подполковник Сангуле Ламизана, начальник штаба, захватил власть. Президент Морис Ямеого был вынужден уйти в отставку, а затем был заключен в тюрьму. На следующий день было организовано новое военное правительство, которое получило поддержку профсоюзов, прекративших всеобщую забастовку. Действие конституции было приостановлено, а Национальное собрание распущено. Был сформирован новый кабинет министров с семью военными чиновниками и четырьмя гражданскими лицами, Высший совет Вооруженных сил, во главе с Ламизаной. Был также создан Консультативный комитет, в состав которого вошли 46 членов, представляющих военные, политические партии, профсоюзы, религиозных лидеров и традиционные органы власти."
 brk.6.d: "Сегодня Томас Шанкара объявил о переименовании страны. В своей речи он заявил, что"Верхняя Вольта была колониальным названием не от нас, а от французского правительства, и потому что мы больше, чем просто место на реке Вольта". Новое избранное название - "Буркина-Фасо", что означает "страна честных людей"."
 MLA.1.d: "Вчера из Юго-Восточной Азии пришли шокирующие новости. Во второй раз за десять лет Сингапур сдался вражеским силам. На этот раз, однако, вместо восходящего солнца над колонией короны развевается малиновый флаг малазийских рабочих. Колония пала перед малазийскими повстанцами благодаря массированной атаке через Джохорскую прямую, поддерживаемой точечным артиллерийским огнем, который уничтожил статическую оборону Колонии. Храбро сражаясь, местный британский гарнизон не смог остановить красную волну, хлынувшую по улицам. Чин Пэн, лидер повстанцев, объявил этот новый город “столицей нашего храброго и трудолюбивого народа”. В то время как спорадические боевые действия продолжаются, вполне вероятно, что Сингапур никогда больше не увидит другого англосаксонского правления."
 MLA.2.d: "Сегодня завершается заключительная глава Малайской чрезвычайной ситуации, когда солнце светит над новым красным штатом. В блестящей партизанской кампании, организованной Малайской национальной народно-освободительной армией, смесь родезийских, южноафриканских и британских войск была неоднократно обойдена с флангов и загнана в джунгли коммунистами. Когда колониальное правительство оказалось в бегах, Народная Демократическая Республика Малайзия была провозглашена в новой столице-городе Чин Пэн. Хотя неизвестно, какую роль новое государство будет играть в регионе, многие беспокоятся, что социализм сейчас развязан по всей Юго-Восточной Азии."
 MLA.3.d: "Сегодня Народная Демократическая Республика Малайзия публично казнила сэра Джеральда Темплера расстрелом. Офицер и ветеран обеих мировых войн, он был одним из ключевых лидеров колониального режима и был обвинен малазийскими судами в преступлениях против человечности за использование химического оружия, концентрационные лагеря (называемые британской прессой новыми деревнями) и рукотворный голод, опустошивший малазийскую сельскую местность. Темплер был захвачен малазийскими повстанцами в битве за Сингапур при попытке к бегству. На международном уровне Соединенное Королевство выпустило заявление с требованием санкций ООН, однако маловероятно, что какие-либо действия будут предприняты."
 MLA.9.d: "Для Народной Демократической Республики Малайзии проходит исторический день, когда страна была объявлена на сто процентов секуляризованной. После жестокой кампании, организованной председателем Чин Пеном, не осталось ни одной мечети, храма или церкви. В то время как религиозные преследования являются одним из основных элементов коммунистического режима, Коммунистическая партия Малайзии, похоже, сделала еще один шаг вперед, не только сокрушив религиозное влияние, но и вычеркнув его из культуры и частной жизни. В то время как религия любого рода все еще технически легальна, публичная практика, распространение любого рода или владение текстами, считающимися “священными” коммунистической партией, являются незаконными и караются до пяти лет принудительных работ. Эта политика и многие подобные ей сдерживают распространение и обращение к религии любого рода, и вполне вероятно, что к концу десятилетия Малайзия станет полностью атеистическим государством."
 MLA.11.d: "Товарищи, после нашего храброго сопротивления японскому фашизму наши колониальные владыки вернулись на эту землю. Пока мы говорим, английские собаки грабят нашу деревню, морят голодом наших людей и эксплуатируют нашу нацию. С каждым днем плоды нашего труда крадутся и используются для укрепления колониального господства. Это наш последний шанс сбросить англичан в море. Если мы потерпим неудачу, наш гордый народ останется в оковах, но если мы добьемся успеха, вся Малайзия будет свободна от голода, страха и тирании."
 MLA.12.d: "Сегодня день гордости для трудящихся Малайзии. Мы изгнали англичан из Малайзии! Однако у наших колониальных правителей осталась последняя битва. Разведка предполагает, что королевская колония Сингапур недавно испытала приток вражеских войск. Если мы позволим этому маленькому острову получить еще какое-то подкрепление, британские и американские войска смогут начать крупное наступление на нашу страну. По этой причине председатель Пэн приказал захватить остров и как можно скорее поднять над городом красный флаг."
 MLA.15.d: "Товарищ Шамсия Факех, герой антибританской войны и министр пропаганды, написал председателю Пенгу, советуя провести радикальную реорганизацию Коммунистической партии Малайзии. Вместо прокитайского правительства с Чин Пеном во главе, Факэ рекомендовал нейтральное коллективное руководство с ним в качестве номинального руководителя. Она утверждает, что при коллективном руководстве Коммунистическая партия Малайзии может более эффективно преодолеть разрыв между этническими и религиозными группами, а также стремиться к тесным связям как с Москвой, так и с Пекином."
 MLA.16.d: "Антибританская война почти сломила сельское крестьянство. Колониальная депортация и химические бомбардировки разрушили способность Малайзии накормить голодный пролетариат. Мы должны действовать быстро, чтобы обеззаразить фермы и репатриировать квалифицированных фермеров."
 MLA.24.d: "Теперь, когда наша власть обеспечена, пришло время восстановить нашу великую нацию с нуля. Во время этого трусливого отступления британские и колониальные войска уничтожили все экономические активы, к которым они могли прикоснуться, пытаясь саботировать нашу реконструкцию. Поэтому мы должны строить Малайзию с нуля. Фермы должны быть обеззаражены, заводы должны быть восстановлены, а народ должен быть образован. У нас впереди много работы, товарищи, но с верой в председателя Пенга все возможно!"
 MLA.25.d: "Последние данные переписи населения показали, что уровень образования в Малайзии намного хуже, чем мы могли себе представить. Хотя у нас нет конкретных данных, вполне вероятно, что уровень грамотности в нашей новой стране составляет менее 30%. Если мы хотим перестроить и модернизировать, крестьяне должны быть образованными."
 MLA.26.d: "После сортировки обломков нашей недавно освобожденной нации мы обнаружили, что большая часть нашей промышленности была потеряна. Наш долг-спасти любое возможное оборудование, схемы и технические знания, оставленные позади, чтобы, надеюсь, собрать воедино какую-то промышленную базу."
 MLA.27.d: "Отдельные города и поселки сообщают о своей смертности с тех пор, как мы пришли к власти, и цифры ужасают. Мы можем с абсолютной уверенностью сказать, что примерно полтора миллиона человек (из примерно 7,5 миллионов населения) погибли от несчастных случаев на производстве, голода, болезней и пренебрежения. Председатель Пэн, ранее предлагавший буддийские учения с предупреждениями, был госпитализирован в Пекине после попытки самоубийства. Его точное состояние неизвестно, но вполне вероятно, что он полностью выздоровеет."
 MLA.19.d: "Впервые за месяц товарищ Пэн вышел из больницы, чтобы обратиться к центральному комитету. Неожиданно Пэн осудил свою веру в буддизм и поклялся отомстить учениям, которые, по его мнению, ослепили его от страданий нашей великой нации. Пэн предложил 6-фазный план очищения Малайзии от “великой лжи”."
 MLA.4.d: "Сегодня Далай-лама покинул свой дом в Тибете, чтобы посетить новое коммунистическое государство в Малайзии. Лидер буддийского мира был встречен большим парадом в столице страны с участием буддийских образов и военной мощи. В одном из интервью Далай-лама похвалил новое государство и его буддийского лидера Чин Пенга за то, что они принесли мир и процветание всему народу Малайзии. Несмотря на приглашение остаться в Малайзии навсегда, Далай-лама заявил, что, хотя новое малазийское государство навсегда займет место в его сердце, его истинным домом является Тибет."
 MLA.14.d: "Во время беспорядочного отступления с нашей земли многие британские летчики-бомбардировщики попали в плен. Эти пилоты бомбардировщиков были осуждены Национальным судом Малайзии за преступления против человечности. Все, что ждет, - это приговор. Многие считают, что единственный справедливый поступок-это смерть от расстрела. Эти пилоты несут ответственность за гибель сотен тысяч мирных жителей, и смерть может быть единственным справедливым наказанием. Другие, однако, считают, что лучшим наказанием будет послать пилотов к жертвам британских бомбардировок и заставить их возместить причиненный ими ущерб. Это могло бы в конечном итоге преподать им урок и, надеюсь, превратить их в лояльных членов партии. Наконец, все большее число граждан считает, что наша страна видела достаточно смертей. Убийство этих мальчиков никого не вернет, и лучший способ действия-залечить раны войны. Что же делать?"
 MLA.13.d: "Тунку Абдул Рахман, сотрудничавший как с британским колониальным правительством, так и с Японской империей, был захвачен. Змея предстала перед Национальным судом Малайзии и была признана виновной в государственной измене. Теперь мы должны приговорить его. Многие утверждают, что смертная казнь необходима, некоторые считают, что каторжные работы-это вариант, а некоторые считают, что судебное преследование-это пустая трата времени и только еще больше поляризует нацию. Что же делать?"
 MLA.20.d: "По специальному приказу: 897 все религиозные учреждения должны быть снесены вместе с любыми артефактами внутри. Завалы должны быть своевременно расчищены, и фундамент будет покрыт садами, парками и жилыми комплексами. Любые лица, пытающиеся оказать сопротивление, будут лишены свободы на срок до пяти лет. Любой человек, пытающийся причинить вред члену или членам команды подрывников, будет расстрелян на месте."
 MLA.5.d: "Сегодня из Малайзии пришли тревожные новости. Были подтверждены сообщения о том, что колониальные землевладельцы, оставленные отступающими британскими войсками, в настоящее время ликвидируются. Хотя точная цифра неизвестна, по оценкам, от 150 до 200 помещиков были казнены государством различными методами-от повешения до расстрела и даже публичного побивания камнями. Малазийское правительство заявило, что “хотя казни не приносят нам никакой радости, мы не можем допустить, чтобы преступления против малазийского народа оставались безнаказанными”. Похоже, что казни уже заканчиваются, но это, скорее всего, останется черным пятном на Народной Демократической Республике Малайзии."
 MLA.28.d: "Сегодня бывший герой антибританской войны в Малайзии Шамсия Факех публично казнен по обвинению в государственной измене. С момента основания коммунистического государства Факе упорно просил поддерживать хорошие отношения как с Советами, так и с красными китайцами, организовав плюралистическое социалистическое правительство. Однако по мере того, как отношения между народами испортились, утопическое чувство единства и компромисса Факе стало помехой для все более маоистской партии. Прошлой ночью был организован суд кенгуру, и в редком телевизионном событии Шамсия Факех был приговорен к смертной казни через расстрел. За казнью последовал председатель Чин Пэн, заявивший, что с немедленным вступлением в силу ККП (Коммунистическая партия Малайзии) больше не потерпит «реакционных уклонов в пролетарской революции» в своих рядах."
 MLA.29.d: "На прошлой неделе сбитые с толку граждане Таиланда проснулись и обнаружили триллионы банкнот, покрывающих всю страну. Хотя первоначально бедный тайский народ считал его благословением, резкое увеличение курса валюты почти в одночасье привело к падению стоимости тайского бата до исторического минимума. Хотя долговременный ущерб неизвестен, магазины по всей стране пусты, большая часть рабочей силы покинула свои посты из-за стагнации заработной платы, а осколки Патет Лао вспыхнули в сельской местности. В официальном заявлении правительство Таиланда обвинило Народно-Демократическую Республику Малайзия в саботаже их экономики и призвало к строгим санкциям ООН."
 MLA.30.d: "Сегодня знаменуется новая эра для народа Малайзии, поскольку председатель Пэн объявил о завершении строительства железнодорожной сети SA Ganapathy. Прорезая джунгли, горы и реки, железнодорожная сеть протяженностью 5000 миль соединяет все крупные города, порты, шахты и лесозаготовки с городом Чин Пэн. Помимо нового доступа к редким ресурсам, инфраструктура позволяет столь необходимой помощи и припасам доставляться в отдаленные деревни. Впервые жители Малайзии могут ездить на работу, как жители Запада, поскольку коммунистическое государство продолжает модернизироваться."
 MLA.31.d: "Новое движение поднялось из джунглей южного Таиланда. Сегодня члены КПТ (Коммунистическая партия Таиланда) во главе с подполковником Файомом Чуланонтом вместе с осколками Патет Лао и китайскими националистами совершили длительное шествие по стране и провозгласили независимый регион вокруг небольшого города Хатъяй на границе с Малайзией. Группа, именующая себя Tàiguó mínzú (тайская нация), представляет собой маоистскую повстанческую группу, посвятившую себя освобождению всего тайского народа. В то время как Королевские вооруженные силы Таиланда были мобилизованы, исследовательские атаки на партизан, поддерживаемых Малайзией, закончились катастрофой, что заставило многих поверить в то, что это новое государство останется здесь."
 MLA.32.d: "В связи с ростом китайско-советской напряженности Председатель Мао призвал нас отказаться от нашей системы двойного руководства, казнить Шамсию Факе и официально присоединиться к борьбе против советского культурного империализма. В то время как Чин Пэн стал враждебно относиться к интервенциям Хрущева в Восточной Европе, политика социалистического нейтралитета Факе привела богатства как Китая, так и Советского Союза в порты Малайзии. Советники также сообщили нам, что социалистический нейтралитет еще может сохраняться, если проявлять особую осторожность в будущих международных отношениях."
 MLA.33.d: "Председатель Пэн сообщил нам о своих намерениях по модернизации Малайзии. Хотя многие хотят выполнить эту задачу в одиночку, мало кто может отрицать необходимость внешнего финансирования. К счастью, нам дали два плана. Первый из СССР. Советское правительство обещало нам полный доступ к промышленным секретам, а также чрезвычайно щедрые торговые сделки с советскими ресурсами. Все, чего они хотят взамен, — это аренда порта Малакка на 50 лет, чтобы упростить торговлю в регионе. Второй из КНР. Товарищ Мао предложил лучших промышленных советников, а также полмиллиона лучших китайских рабочих помочь нам в модернизации. Все, что они просят взамен, это наша полная поддержка в дипломатических делах. Хотя оба заманчивы, мы можем выбрать только одно предложение."
 MLA.34.d: "Время пришло. Планы по каждому аспекту кампании модернизации завершены, миллионы наших рабочих мобилизованы, а поставки от наших союзников текут через наши порты. Осталось только дать добро."
 MLA.35.d: "В то время как инициатива массовой грамотности принесла нашей нации мудрость, возникла необходимость в дальнейшем расширении знаний малайзийского народа. Председатель Пэн потребовал, чтобы к 1975 году все жители Малайзии имели высшее образование. Чтобы выполнить эту просьбу, должны быть основаны университеты, охватывающие самые разные специальности, от математики до прикладной инженерии, необходимо взращивать новый энтузиазм к обучению и улучшать наше понимание языка."
 MLA.38.d: "Несмотря на британский империализм, японскую оккупацию и голод, наш народ выстоял. Коммунистической партии пора их наградить. У каждого гражданина нашей страны есть доступ к чистой воде, сухой постели и защите от насилия, но им нужно больше. Потребительские магазины часто пустуют, очереди за медицинской помощью часто растягиваются на целые кварталы, а нашим рабочим не хватает товаров, на которые можно было бы потратить повышающуюся заработную плату. Они должны быть исправлены, если мы хотим считаться современной нацией."
 MLA.36.d: "В настоящее время средний гражданин Малайзии потребляет всего 1250 калорий в день. Несмотря на то, что технически это «безопасно», любой спад производительности приведет к новому голоду в Малайзии. Если мы хотим сохранить нашу растущую промышленную базу, необходимо устранить все узкие места в сельском хозяйстве, добиться механизации, увеличить производство удобрений."
 MLA.39.d: "Теперь, когда наша страна стабилизировалась, мы можем начать использовать богатые ресурсы нашей страны. Шахты британского колониального правления теперь могут быть вновь открыты, и горняки могут вернуться к работе. Старатели, вернувшиеся из Перака и Теренггану, обнаружили большие залежи железа, меди и бокситов. Мы должны использовать эти богатства на благо и прогресс всех малазийцев."
 MLA.40.d: "Модернизировав нашу великую нацию, мы можем начать усилия по освобождению всей Юго-Восточной Азии. Чтобы помочь нашей борьбе, Mǎláixīyà Qíngbào Jú (Малайзийское разведывательное управление) было основано для сбора разведывательной информации, помощи в революционной деятельности и, при необходимости, для прямого участия в боевых действиях с реакционными силами по всему региону."
 MLA.41.d: "В течение почти двадцати лет бирманская гражданская война оставалась в застое. Фракция белого флага под руководством товарища Такина Тан Туна находится в постоянном кризисе, но бирманское правительство не в состоянии нанести решающий удар. И в китайских, и в наших собственных стратегических интересах увидеть, как эти революционеры преуспеют и создадут союзное государство. Победа здесь будет означать полное окружение Таиланда, а также выход в Бангладеш и Индию."
 MLA.42.d: "С начала 50-х годов патет-лао находятся в состоянии конфликта с французами, американцами и королевством Лаос. В интересах как лаосского пролетариата, так и нашей великой нации видеть в Лаосе социалистическое правительство. По этой причине мы должны начать отправку оружия и снаряжения, чтобы увеличить их шансы на победу."
 MLA.43.d: "Оперативники из нашего Таиланда сообщили о ситуации, созревшей для революции. Хотя в настоящее время КПТ (Коммунистическая партия Таиланда) представляет собой небольшую силу, она имеет доступ и связи со многими левыми и националистическими партизанскими группами в регионе. Кроме того, есть основания полагать, что Королевские вооруженные силы Таиланда симпатизируют маоистам. При твердом руководстве эти группы могут объединиться в единый кулак, способный сокрушить реакционную монархию. Мы считаем, что при достаточном внимании, финансировании и поставках к 1980 году в Таиланде может быть создано союзное социалистическое государство."
 MLA.44.d: "Ситуация в Камбодже... Интересная. Маоистские красные кхмеры под руководством Пол Пота в настоящее время ведут кровавую партизанскую войну против камбоджийской монархии. Хотя на бумаге мы поддерживаем борьбу Пол Пота против камбоджийских репрессий, оперативники и специалисты MQJ серьезно сомневаются в способности и интеллекте Пол Пота руководить своей страной в мирное время. Однако мы считаем, что, учитывая интеллект и шаткую ситуацию, Пол Пот может оказаться для нас ценной марионеткой."
 MLA.45.d: "Сеть предполагает, что ситуация в Южном Вьетнаме вводит в заблуждение. Американские войска вливаются в реакционный режим Дьема, но ясно, что воля обоих их народов сломлена. Пропаганда, репрессии и принудительная воинская повинность только подстегнули южновьетнамский пролетариат поднять оружие против империализма. Однако глупо думать, что победа во Вьетнаме обеспечена. Боевые линии меняются каждый день, и одно наступление может уничтожить весь прогресс в регионе. По этой причине мы считаем своим долгом вмешаться в конфликт."
 MLA.46.d: "Хотя первоначальные программы помощи были успешными, одна только наша промышленная база и рабочая сила не смогут склонить чашу весов в гражданской войне в Бирме. По этой причине мы должны запросить дополнительное участие Китая."
 MLA.47.d: "Товарищ Пэн пришел к нам с заманчивым предложением. В последние несколько месяцев наши малазийские товарищи все больше вкладывались в конфликт в Бирме. Хотя нашим южным товарищам очень повезло, они требуют больше материалов и приверженности от нашей великой нации. В то время как многие обеспокоены тем, что увязнут в Бирме, Пэн выразил стратегическую важность союзного государства в регионе. Что нам делать?"
 MLA.48.d: "Отличные новости из КНР. Пока мы говорим, китайская экономика готовится к длительному участию в гражданской войне в Бирме. Они наметили свою цель в течение следующих десяти месяцев ежедневно отправлять пятьдесят транспортных самолетов с оружием, советниками и рабочими. Эта увеличенная китайская помощь почти наверняка обеспечит победу в гражданской войне."
 MLA.49.d: "Неутешительные новости из КНР. В то время как товарищ Мао и КПК сочувствуют бирманской борьбе, они отказываются от любого участия в обозримом будущем на том основании, что хотят избежать вьетнамского сценария. Хотя это известие является препятствием для прогресса в гражданской войне, у наших товарищей в Бирме все еще есть надежда на победу."
 MLA.50.d: ""
 MLA.51.d: ""
 MLA.52.d: ""
 MLA.22.d: "Трагические новости приходят из Народно-Демократической Республики Малайзия. В то время как посторонние глаза были закрыты для нации, перебежчики говорят о недостроенных сломанных фабриках, разрушенных железнодорожных путях, голоде и репрессиях, невиданных со времен японской оккупации. Мало что известно о крошечной коммунистической стране, но многие считают, что амбициозная кампания председателя Пэна по модернизации провалилась. Есть много предсказанных причин полного экономического коллапса, однако самой большой из них, по-видимому, является ускоренное развитие промышленной базы и плохое производство стали, что привело к сбою в сельскохозяйственной инфраструктуре страны. Многие страны в ООН предлагали поставки зерна, однако ответа из Малайзии не последовало."
 MLA.58.d: "Сегодня коммунисты добились крупной победы в Азии. Давний союзник западного Таиланда официально пал перед коммунистическими партизанами. Через несколько дней после поражения роялистов Народная Республика Таиланд была основана под строгим маоистским однопартийным государством. Это событие стало шоком по обе стороны железного занавеса, и многие уже заявили о провале сдерживания США, когда коммунизм захлестнул Азию. В редком интервью с председателем Чуланоном революционер заявляет, что надеется «доказать правильность теории домино», поскольку Народно-освободительная армия Таиланда начинает мобилизацию на реакционных границах."
 MLA.59.d: "Шокирующие новости обрушились сегодня на красную Малайзию, поскольку давний лидер Чин Пэн был свергнут. Хотя непосредственное местонахождение Пэна неизвестно, большинство аналитиков считают, что новая ответственная группа, созданная реформистской фракцией, никуда не денется. Новая администрация уже заявила о своем намерении либерализовать коммунистическое государство и улучшить отношения с Западом. На данный момент будущее Малайзии неизвестно, поскольку страна движется вперед в новое десятилетие."
 MLA.61.d: "Сегодня лидеры Соединенного Королевства и Народно-Демократической Республики Малайзия встретились в Йоханнесбурге, Южная Африка. Хотя в прошлом между двумя странами были ледяные отношения, лидеры обеих стран считают, что пришло время прекратить боевые действия и начать сеять семена мира. Итоги этого саммита включают прекращение жестких санкций, возвращение военнопленных и гарантии неагрессии с обеих сторон. В то время как реакция международного сообщества была в основном положительной, Албания, КНДР и, в первую очередь, КНР подвергли саммит и все, за что он выступает, резкой критике. Несмотря на это осуждение, многие согласны с тем, что это важный шаг вперед в борьбе за глобальный мир."
 MLA.62.d: ""
 MLA.63.d: ""
 MLA.64.d: ""
 MLA.65.d: ""
 MLA.66.d: ""
 MLA.67.d: "Кампания по модернизации Chin Pens провалилась. Низкокачественные строительные материалы лишили некогда богатую нацию ее процветания. Теперь мы можем только собирать миры. Порядок должен быть восстановлен, фермы должны быть реконструированы, а промышленность должна быть свернута, если наша великая социалистическая нация выживет. Не все потеряно и наша нация выздоровеет."
 MLA.68.d: "Тост за малазийский пролетариат. С модернизированной нацией наши люди наслаждаются роскошью, о которой раньше не могли и мечтать. Водопровод внутри помещений, постоянный доступ к чистой воде и электричеству, дороги с твердым покрытием и доступное медицинское обслуживание — вот лишь некоторые из многих подарков, которыми КПМ наградила наш лояльный рабочий класс. Тем не менее, проблема остается. Наш впечатляющий рост привел к резкому падению цен практически на все товары. Хотя это может показаться крупной победой нашей великой нации, мы не смогли привести денежную массу в соответствие с этими новыми ценовыми изменениями. Из-за этой неудачи нацию охватила массовая нехватка. Мы должны быстро исправить эту ошибку, прежде чем мы рискуем потерять все."
 MLA.69.d: "Министерство внутренней безопасности пришло к нам с тревожными новостями. В течение последних шести месяцев ходили слухи о том, что умеренные внутри КПМ замышляют свергнуть председателя Пэна. По их мнению, Чин Пэн продемонстрировал себя неэффективным лидером, которого необходимо сместить, чтобы сохранить дух Малайзии. Что нужно сделать?"
 MLA.70.d: "Теперь, когда наша экономика стабилизировалась, мы можем начать освобождение Восточной Малайзии. В то время как высшее командование Национально-освободительных вооруженных сил советовало нам не прибегать к прямым действиям, MQJ сообщило нам, что материальные условия на наших оккупированных территориях созрели для революции. Малайзийцы за Южно-Китайским морем завидуют нашему процветанию, которое в сочетании с уже мятежными этническими меньшинствами может привести к революции в Восточной Малайзии. MQJ поощряет использование тактики террора против реакционных оккупантов при вооружении антиправительственных групп в рамках подготовки к любым предпринятым действиям. При хорошем руководстве, терпении и удаче мы, наконец, сможем полностью освободить нашу нацию."
 MLA.71.d: "Вечная слава повстанцам Восточной Малайзии. Одним ударом империалистические оккупанты были сметены в море. Объединение нашей нации позволит нам распространить наше влияние на южную часть Тихого океана и обеспечить мир и свободу нашему народу. Пока мы говорим, строительные отряды, военные советники и педагоги совершают путешествие через Южно-Китайское море, чтобы модернизировать сельскую местность и развивать социалистический дух наших восточных земель."
 MLA.72.d: ""
 MLA.77.d: "Советники в Камбодже сообщили нам, что красные кхмеры остро нуждаются в помощи. Хотя лаосцы поддерживают международную борьбу, присутствие США и Южного Вьетнама поставило революцию под угрозу. По этой причине мы потребовали полного вмешательства только что созданной Тайской Народной Республики."
 MLA.78.d: "К сожалению, Таиланд отклонил нашу просьбу о вмешательстве в гражданскую войну в Камбодже. Хотя они сочувствуют борьбе кхмеров, политическая нестабильность сделала молодую нацию уязвимой. Любое радикальное военное вмешательство, скорее всего, разрушит и без того слабое центральное правительство."
 MLA.79.d: ""
 MLA.80.d: "Министерство внутренней безопасности пришло к нам с тревожными новостями. В течение последних шести месяцев ходили слухи о том, что умеренные внутри КПМ замышляют свергнуть председателя Пэна. По их мнению, Чин Пэн продемонстрировал себя неэффективным лидером, которого необходимо сместить, чтобы сохранить дух Малайзии. Что нужно сделать?"
 PRC_SOV.10.d: "Сегодня степи Центральной Азии стали свидетелями самых масштабных и сложных военных учений. В учениях под кодовым названием «Восток-62» приняли участие Восточная Германия, Польша, Румыния, Чехословакия, Болгария, Советский Союз, Монголия, КНДР, Красный Китай, Вьетнам, Лаос и Венгрия. Хотя истинные намерения «Востока-62» неизвестны, широко распространено мнение, что его цель состояла в том, чтобы имитировать многонациональное наступление через плохо снабженную территорию. Хотя поначалу были проблемы с системными организационными проблемами и многочисленными случаями недопонимания, командиры на местах быстро восстановили порядок и двинулись вперед. Среди выдающихся моментов учений — неудавшаяся совместная советско-корейская высадка над Или, в результате которой погибло около 22 человек, и удивительная эффективность совместного восточногерманско-китайского десанта через озеро Зайсан."
 PRC_SOV.11.d: "Председатель Ван Мин объявил сегодня, что Китайская Народная Республика приступит к ряду либеральных реформ, направленных на улучшение экономики страны и благосостояние китайских рабочих. Известные политики включают амнистию для многих политических заключенных, рыночные реформы и большую свободу выражения мнений. Неизвестно, как далеко зайдут эти реформы, но ясно, что Китай вступает в новую эру."
 PRC_SOV.12.d: "С момента основания красного Китая СССР стал слишком напряженным и неорганизованным, пытаясь сохранить контроль над Евразией. Пытаясь снять напряжение, КНР объявила о выходе из Варшавского договора. Сильный советский партнер предложил заполнить советские гарнизоны по всей Азии и позволить им сосредоточиться на Европе. Хотя некоторые считают, что это признак социалистического разделения, Ван Мин и Хрущев заверили мир, что советско-китайский союз остается таким же крепким, как и прежде."
 PRC_SOV.13.d: "Недавно Народно-освободительная армия (НОАК) начала полномасштабное вторжение в Тибет. КПК утверждает, что это восстановление суверенитета Китая над страной. Этот акт агрессии был широко осужден, однако ни одна страна не предприняла никаких действий. Когда китайские войска войдут в тибетскую столицу, вполне вероятно, что Тибет будет полностью поглощен КНР."
 PRC_SOV.14.d: "С момента основания красного Китая СССР стал слишком напряженным и неорганизованным, пытаясь сохранить контроль над Евразией. Пытаясь снять напряжение, КНР объявила о выходе из Варшавского договора. Сильный советский партнер предложил заполнить советские гарнизоны по всей Азии и позволить им сосредоточиться на Европе. Хотя некоторые считают, что это признак социалистического разделения, Ван Мин и Хрущев заверили мир, что советско-китайский союз остается таким же крепким, как и прежде."
 PRC_SOV.15.d: "После успеха китайского эксперимента по либерализации КПК объявила о начале масштабных новых реформ, направленных на обеспечение большего экономического процветания и свободы китайскому рабочему. Эта новая волна реформ включает в себя установление 10-летнего срока председательства, дальнейшую экономическую либерализацию и политику разрядки в отношениях с СЕАТО и западным миром. Эти реформы, вероятно, коснутся Пекинского пакта, когда Азия начнет открываться."
 PRC_SOV.16.d: "Сегодня состоялась инаугурация Кай Фэна в качестве председателя Коммунистической партии Китая. Вдохновленный культурными и экономическими реформами Ван Мина, Фэн имеет смелые планы, такие как капитальный ремонт системы образования, дальнейшее открытие рынка и обеспечение более широкого участия рабочих в правительстве. Многие надеются на эту новую эру свободы для Китая, но другие опасаются, что эти реформы зашли слишком далеко."
 PRC_SOV.17.d: "Второй раз за десятилетие китайские войска переправляются через Ялу на территорию КНДР. На этот раз, однако, он должен избавиться от режима Кима. По мнению КПК, Ким Ир Сен стал мошенником-деспотом. Уже сейчас большое количество корейских солдат покинули свои посты и присоединились к вторжению, когда китайские танки беспрепятственно вошли в Пхеньян. Хотя точное местонахождение семьи Ким неизвестно, прокитайская администрация уже создана. Вполне вероятно, что в считанные дни порядок на Корейском полуострове будет восстановлен."
 PRC_SOV.18.d: "Сегодня члены Коммунистической партии Китая (КПК) объявили о создании Народного правительства Северного Китая. После сокрушительного поражения в Шанхайской битве коммунисты были отброшены в Маньчжурию, где только советское вмешательство в последнюю минуту спасло их от полного уничтожения. Народное правительство Северного Китая заявило о своей твердой верности марксистско-ленинской ортодоксии и щите уязвимой изнанке Дальнего Востока. Подобно Германии, Корее, Вьетнаму и Австрии, похоже, что Китай будет разделен по идеологическим признакам."
 PRC_SOV.20.d: "В результате к власти в Народном правительстве Северного Китая вернулся опальный революционер Мао Цзэдун. Когда-то обожаемый китайцами, Мао впал в немилость из-за своей неспособности защитить Китай. После отступления в Маньчжурию Мао был свергнут и заменен советской марионеткой. Однако теперь, когда советская администрация осматривала сталелитейный завод на реке Ялу, маоистские элементы НОАК блокировали Пекин и вновь назначили Мао председателем. Сообщения подтвердили, что свергнутый лидер Ван Мин был задержан и ожидает суда за преступления против китайского народа. Советы отказались сделать заявление, хотя ходят слухи, что вдоль Амура скапливаются танки."
 PRC_SOV.22.d: "Товарищи! Наш народ освободился под красным знаменем социализма. Тем не менее, наша работа только начинается. Пока мы говорим, фабрики, оставленные капиталистическими свиньями, становятся идолами, и голод охватывает деревню. Мы должны восстанавливать нацию по кирпичику, пока наш рабочий класс больше не будет бояться голода и отчуждения от труда."
 PRC_SOV.23: "Как и Советский Союз, большая часть Китая остается нетронутой человеком. Наши западные земли были бесплодны и опустошены. Однако товарищ Хрущев вдохновил нас превратить нашу страну в мощный сельскохозяйственный центр, сравнимый со степями Украины и великими равнинами Северной Америки."
 PRC_SOV.24: "С подписанием Пекинского пакта мы стали крепче стали. СEATO будет опасаться объединенной мощи Китая и его союзников, пока мы пронесемся по Азии. Как наши европейские товарищи остановят капитализм на своем континенте, так и мы остановим капитализм в Азии."
 PRC_SOV.25: "Недавние либеральные реформы в Китае закончились полным провалом. Наш когда-то сильный рабочий класс теперь становится жирным и послушным. Мы должны привести их в порядок и вернуться к нашим марксистско-ленинским корням."
 PRC_SOV.26: "Недавние либеральные реформы привели к полному успеху. Наш народ, когда-то больной Азии, стал континентальной сверхдержавой. Мы стоим наравне с Советским Союзом по ВВП и производительности труда. Однако сейчас не время останавливаться. Мы должны открыться еще больше и позволить богатству Китая расти дальше."
