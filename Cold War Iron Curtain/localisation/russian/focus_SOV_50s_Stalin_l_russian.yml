 STALIN_Heavy_Industry_Development_desc: "Хотя у нас есть крупные промышленные центры по всей стране, наши возможности по производству тяжелого оборудования и машин по-прежнему отстают от мощностей западных производителей, таких как США. Это можно изменить только совместными усилиями по развитию нашей машиностроительной отрасли."
 STALIN_The_Iron_Curtain_Diplomacy_desc: "Наша сфера влияния расширилась и охватывает всю Восточную Европу от Балтийского до Черного моря. Уинстон Черчилль, наш бывший союзник, назвал разрыв между нами и Западом «железным занавесом», признаком растущего разрыва между нашими личными целями. Он прав. Капиталисты должны познать свое место в мире или мы им покажем его."
 STALIN_Confirm_Stalins_Omnipotence_desc: "Наш славный товарищ Иосиф Сталин - личность невероятных масштабов, многие в СССР даже ставят его наравне с Богом. Под его взором люди живут и умирают, радуются и печалятся, работают и отдыхают. После всех великих прорывов и пережитых невзгод под его чутким руководством, мы должны признать, что он является самым эффективным правителем нашей родины за всю её историю."
 STALIN_The_Soviet_Armed_Forces_desc: "Наши вооруженные силы являются одними из самых мощных в мире, если говорить о размерах. Тем не менее, мы отстаем от Запада по уровню исследований и разработок в нескольких ключевых областях, прежде всего в реактивных технологиях и в военно-морском флоте."
  
 STALIN_Catch_Up_with_Western_Atomic_Research_desc: "Ядерная энергетика - как вооруженная, так и мирная - будет одним из решающих факторов в предстоящей борьбе за выживание, и мы не можем позволить себе оставаться позади Запада в этой области."
 STALIN_Utilize_German_Rocketry_Knowledge_desc: "Когда мы пронеслись по Германии в конце Великой Отечественной войны, мы захватили многих выдающихся немецких ученых, среди них есть несколько высококвалифицированных исследователей ракетных двигателей. Создав им все условия для работы, мы сможем расширить наши горизонты в ракетостроений."
 STALIN_Prioritize_Electronic_Developments_desc: "Каждый день на Западе в отделе электроники делаются новые успехи, и тем не менее во многих наших сельских районах отсутствуют элементарные энергетические объекты. Нам необходимо улучшить их инфраструктуру, а также идти в ногу с современными достижениями в области высоких технологий."
 STALIN_Aid_Ukranian_Reconstruction_desc: "Украина сильно пострадала от нацистов во время оккупации, и большая часть ее инфраструктуры была разрушена. Придется вложить много труда в её восстановление."
 STALIN_Rebuild_Ukranian_Agriculture_desc: "Нацисты во время войны разрушили много предприятий пищевой промышленности украинской республики, отправив в своё время её большую часть в третий рейх. Наши люди уже экономят продукты, поэтому нам необходимо вновь востановить селськое хозяйство УССР."
 STALIN_Rebuild_Destroyed_Dams_desc: "Многие плотины были разрушены во время войны, в результате чего многие деревни в окрестностях были разрушены, а плотины не могли обеспечивать эти регионы электроэнергией. Обе эти причины более чем достаточны для того, чтобы мы приступили к их ремонту."
 STALIN_Invest_in_the_Baltics_desc: "Балтийский регион сильно пострадал во время великой отечественной войны. Во время окупаций нацистами испытал на себе последствия политики выжженной земли. Необходимо вложить ресурсы в востоновление и развитие этих республик."
 STALIN_Rebuild_Stalingrad_desc: "В Сталинграде находятся могилы многих наших героев, место одного из переломных моментов Великой Отечественной войны. Однако все это не меняет того факата что это сейчас руйны, и нам неободимо восстановить как город так и промышленность."
 STALIN_Open_New_Metallurgy_Plants_desc: "Редкоземельные металлы становятся все более и более важными для производства высокотехнологичной электроники, современного оружия и транспортных средств. Расширение  и строительство новых предприятий по их добыче и производству даст нам улучшенную базу для дальнейшего технологического развития."
 STALIN_Complete_the_Don_Volga_Canal_desc: "Волгодонский канал — проект, жизненно важный для нашего сельскохозяйственного сектора на юге СССР, и завершив его, мы улучшим местную инфраструктуру и возможности развития и производства продуктов питания."
 STALIN_Repair_Mining_Pits_desc: "Востонавливая работу карьеров и промышленность в целом, мы можем увеличить экспорт и производство металла."
 STALIN_Eliminate_Infrastructure_Bottlenecks_desc: "Состояние наших дорог и общей инфраструктуры, хоть и являются полезным инструментом для замедления наступления супостатов, находится в плачевном состоянии, для торговли и развитие цепочек промышлености необходимио их строительство и модернизация."
 STALIN_Increase_Cement_Production_desc: "Цемент является жизненно необходимым материалом для строительства самых разных сооружений, от мостов и дорог до зданий и укреплений, и нам нужно его больше."
 STALIN_Build_New_Railways_desc: "Строительство новых железных дорог - хороший способ модернизации и развитие региональной инфраструктуры, а также упрощает транспортировку товаров и войск."
 STALIN_Connect_the_Union_desc: "Чтобы завершить наши новые промышленные и инфраструктурные проекты, мы должны создать обширную систему дорог и магистралей, которые соединят нашу огромную страну. От Ленинграда на Балтике до Севастополя на Черном море и до Владивостока на Дальнем Востоке, наш народ будут иметь свободу передвижения по своей родине."
  
 STALIN_Follow_the_Percentage_Agreements_desc: "На Ялтинской конференции мы договорились о пределах нашей сферы влияния. Хотя мы, несомненно, заслуживаем большего,мы должны быть ответственными за свои слова и не выходить за рамки наших договоренностей."
 STALIN_Abandon_Turkish_Claims_desc: "Одна из проблем, с которой мы пытались настаивать, - это вопрос о Турецких проливах, потому что владение ими дало бы нам полный доступ к Средиземному морю и океанам за его пределами. Однако это вне нашей сферы, поэтому нам следует отказаться от своих претензий."
 STALIN_Promote_Democratic_Route_to_Communism_desc: "Вместо того, чтобы заставлять наших соседей-демократов на северо-востоке присоединиться к нам, мы должны следовать демократическому процессу и продвигать различные коммунистические партии, чтобы помочь им победить на следующих национальных выборах."
 STALIN_Pressure_Yugoslavia_desc: "Маршал Тито и его союзники в Югославии отказываются интегрироваться в Коминтерн, несмотря на наше естественное сходство. Нам необходимо активизировать наших дипломатов, чтобы оказать на них давление."
 STALIN_Fund_the_PCF_and_PCI_desc: "Во Франции и Италии уже есть сильные коммунистические партии, но их душит политика правительства и радикальные атаки. Нам нужно поддерживать наших братьев за границей всеми возможными способами."
 STALIN_Gather_Intelligence_Via_Western_Spies_desc: "Отправляя шпионов в западные страны и превращая западных шпионов в собственных агентов, мы можем расширить наши возможности по сбору разведданных."
 STALIN_Aid_the_Greek_Loyalists_desc: "В Греции разразилась гражданская война, и коммунистические силы храбро сражаются перед лицом западного угнетения и интервенции. Мы знаем, что в Ялте договорились о наличии определенной сферы влияния, но мы не можем сидеть сложа руки и смотреть, как гаснет огонь революции."
 STALIN_Integrate_Greece_into_the_Eastern_Bloc_desc: "И вот греческая гражданская война подошла к концу, и пока коммунисты аплодируют нашей помощи, пришло время пригласить их в Коминформ, вместе с остальной восточной Европой."
 STALIN_Maintain_Push_for_Turkish_Regime_Change_desc: "Турецкое правительство пока что отклонило наши претензии на Проливы и надеется на поддержку Запада, но если мы сможем добиться смены режима, новое правительство просто даст нам то, что мы хотим."
 STALIN_Redraw_Bosphorous_Borders_desc: "Теперь, когда у нас есть дружественная Турция, мы можем перерисовать границы (можно сказать, покрасить карту) так, как захотим. У нас здесь две основные цели. Первым, естественно, является наш контроль над Турецкими проливами. Второй - это создание государства для угнетенных курдов в Турции."
 STALIN_An_Ultimatum_to_Yugoslavia_desc: "Наглые попытки Тито и Югославии игнорировать нас и наши просьбы зашли слишком далеко, и им пора присоединиться к нам или столкнуться с мощью Красной Армии."
 STALIN_Maintain_Berlin_Blockade_desc: "Американцы и британцы настаивают на том, чтобы мы прекратили нашу блокаду Западного Берлина и разрешили свободный проход продуктов питания и товаров в город. Это ерунда. Мы не уступим требованиям капитализма. Блокада будет продолжаться."
 STALIN_Cave_to_the_Western_Powers_desc: "С помощью Берлинского воздушного моста американцы продемонстрировали бесполезность блокады Западного Берлина, и пора уступить и позволить им перебрасывать грузы в город."
 STALIN_Allow_the_Foundation_of_a_German_State_for_Reperations_desc: "Территории Восточной Германии находились под нашим контролем с конца Второй мировой войны, как такие-себе территории при слабом временном правительстве. Пора начать процесс создания восточногерманского государства."
 STALIN_Deepen_COMECON_Collaboration_desc: "Наша организация СЭВ пока добилась небольшого успеха, но нам действительно нужно углубить наши связи с нашими восточноевропейскими союзниками, если мы хотим в полной мере пожинать плоды."
 STALIN_Invest_in_the_Czech_and_Polish_Economy_desc: "Чешская и польская экономики, не говоря уже об их земле и людях, были глубоко ранены нацистской оккупацией. Нам нужно помочь им восстановить их."
 STALIN_Aid_Balkan_Reconstruction_desc: "Балканы были домом для одних из самых ожесточенных партизанских боев за прошедшую войну, в результате чего инфраструктура там разрушена. Его нужно перестраивать."
 STALIN_Exploit_our_Eastern_Puppets_desc: "Члены Коминформа - наши союзники, которые потенциально могут стать частью нашей советской родины. Мы до сих пор не восстановились после войны, поэтому нам понадобятся их ресурсы и промышленность. Но как только мы наберём в экономической мощи, то обязательно займёмся и их экономикой, что несомненно сделает наши западные границы в Европе безопасней."
 STALIN_Increase_Ties_with_Mao_and_Kim_Il_Sung_desc: "Мао и Ким Ир Сен - наши главные союзники в борьбе за коммунизм на Дальнем Востоке, и нам необходимо укреплять наши связи с ними."
 STALIN_Support_Indochinese_Insurrections_desc: "Коренной индонезийский народ восстал против голландских империалистов. Наш долг - поддержать их."
 STALIN_The_Korean_War_desc: "В Корее война! Ким Ир Сен и его армия пересекли 38-ю параллель и наносят удар вглубь Южной Кореи. У нас есть 2 варианта: подождать и посмотреть, что произойдет, или сыграть более активную роль в обеспечении победы Севера."
 STALIN_Send_Military_Advisors_desc: "Прямое вмешательство на данном этапе может быть слишком рискованным, поэтому нам необходимо подготовить группы добровольцев из офицеров и рядового состава для помощи нашим корейским товарищам, а так же предоставить им некоторую материальную помощь разными видами вооружения. Нельзя допустить появления ещё одного плацдарма для ядерного оружия США."
 STALIN_Provide_Surplus_Tanks_and_Planes_desc: "КНДР, хотя и не испытывает недостатка в мужестве и доблести, остро нуждается в тяжелой броне и авиации, и мы с легкостью можем это обеспечить."
 STALIN_Send_Infantry_Equipment_desc: "Из-за ожесточенных боев северокорейская армия понесла большую потерю техники и нуждается в большем количестве орудий для продолжения войны. Они получат от нас все, что им нужно."
 STALIN_Establish_the_64th_Fighter_Aviation_Corps_desc: "64-й истребительный авиационный корпус будет специальной авиационной эскадрильей добровольцев в Северной Корее, которая сможет бороться с самолетами запада в небе."
 STALIN_Increase_Korean_Production_Capabilities_desc: "Помимо отправки орудий, танков и самолетов, мы также должны стремиться повысить способность Северной Кореи производить собственное оборудование и стать более самодостаточными."
  
 STALIN_Purge_Seditous_Reactionaries_desc: "Наш Советский Союз подрывают предательские реакционные агенты и капиталистические провокаторы. Нам необходимо принять серьезные меры, чтобы очистить их."
 STALIN_Denounce_Leningrads_Fair_Embezzlement_desc: "Отделение компартии в Ленинграде пропиталось коррупцией от самой верхушки до низов. Было получено большое количество фактов и доказательств вымогательства партийными кадрами крупных взяток и хищений денежных средств, выделенных на восстановление и развитие города."
 STALIN_Purge_the_Leningrad_Dissenters_desc: "Теперь, когда мы обладаем неоспоримыми доказательствами вины Ленинградских партийных чиновников во взяточничестве и расхищении народных средств, самое время нанести по ним стремительным удар и судить их по всей строгости закона, дабы не позволить им сбежать за границу безнаказанными."
 STALIN_Encourage_Anti_Semetism_desc: "Организованные группы евреев-сионистов создают нам немало политических и общественных проблем. Они целенаправленно проникают в партийные ячейки и занимают руководящие должности на заводах и других общественных предприятиях, находя в этом выгоду для своих сторонников. У них также немало друзей-сионистов в капиталистическом блоке, что несет значительную угрозу для внутренней безопасности страны. Эту проблему необходимо решить, пока они не нанесли нам серьёзного ущерба."
 STALIN_Dismantle_The_Jewish_Anti_Fascist_Committee_desc: "Изначально Еврейский антифашистский комитет был сформирован под предлогом распространения идей коммунизма и Советского Союза за границу среди других еврейских общин, но теперь становится ясно, каковы их истинные намерения. ЕАК - не что иное, как один из инструментов буржуазии для сбора секретной информации в СССР."
 STALIN_Secret_Trials_for_Jewish_Intellectuals_desc: "Наш лидер обратил внимание на то, что многие известные еврейские интеллигенты работают с западными шпионами, чтобы подорвать стабильность в Советском Союзе. Показательные судебные процессы вызовут слишком много негативной международной реакции, поэтому следует держать их в секрете."
 STALIN_Arrest_Treasonous_Doctors_desc: "МГБ получили сообщение о заговоре врачей-сионистов. Московские врачи-сионисты собираются отравить множество видных деятелей компартии СССР! Мы должны действовать прежде, чем они смогут осуществить этот план."
 STALIN_Force_Berias_Withdrawal_desc: "Мы столкнулись с множеством проблем в управлении исправительными лагерями из-за военной разрухи. Поэтому нам следует централизовать управление в Магадане и улучшить имеющиеся методы работы."
 STALIN_Purge_Mingrelians_from_the_Georgian_Party_desc: "В Мегрельской этнической группе крайне сильны националистические идеи, которые отражаются на работе партийного комитета Грузии. Мы должны найти на них управу и исключить националистов из партийной организации."
  
 STALIN_The_Soviet_Airforce_desc: "Наша авиация сыграла большую роль в победе в Великой Отечественной войне, поскольку наши бесстрашные авиаторы сокрушили Люфтваффе. Но наступила новая эра полета, на этот раз оснащенная реактивным двигателем, и мы должны прыгнуть в эту эру с полной отдачей."
 STALIN_Expand_MiG_15_Production_desc: "Массовое производство МиГ-15, одного из лучших реактивных истребителей, созданных на сегодняшний день нашими товарищами-учеными, творит чудеса с возможностями ВВС."
 STALIN_Develop_Sakhallin_Airfields_desc: "Сахалинские аэродромы — крупнейшие аэродромы на Дальнем Востоке, но все же они удручающе малы. Их расширение принесет нам большую пользу."
 STALIN_Develop_the_Tu_16_desc: "Ту-16 — это проект реактивного стратегического бомбардировщика, предложенный КБ Туполев, и он выглядит очень многообещающе. Мы должны утвердить дальнейшие исследования и разработку этого проекта."
 STALIN_Invest_in_Supersonic_Fighters_desc: "Сверхзвуковые истребители — это будущее боевых действий «воздух-воздух», и мы не можем позволить себе отставать в этой важной области."
  
 STALIN_The_Soviet_Army_desc: "Красная Армия разгромила Вермахт и поставила Берлин на колени, снискав нам вечную славу во Второй мировой войне. Однако мы не можем почивать на лаврах, поскольку война постоянно меняется, и мы также должны меняться."
 STALIN_Begin_Mass_Production_of_the_T54_desc: "Основной боевой танк Т-54 — это наш новейший ОБТ, который намного превосходит любой серийно выпускаемый американский танк. Распространение его по всей нашей армии увеличит наше технологическое превосходство над Западом."
 STALIN_Rapid_Adoption_of_the_AK47_desc: "АК-47 — новейшая блестящая разработка Михаила Калашникова, это красивая штурмовая винтовка с инновационным дизайном (и не только), но она всё еще дешевая в производстве. Мы должны начать производство этого оружия прямо сейчас."
 STALIN_Expand_the_VDV_desc: "ВДВ - это элитный десантно-штурмовой род войск. Хотя тактика и стратегия их использования все еще формируются, бойцов ВДВ всё же хорошо иметь под рукой."
 STALIN_Increase_Soviet_Air_Defense_Forces_desc: "В дополнение к нашим самолетам, за оборону нашего неба также отвечают наземные подразделения ПВО. Увеличение таких юнитов, в свою очередь, повысит нашу обороноспособность."
  
 STALIN_The_Soviet_Navy_desc: "Советский флот после войны отстал от западного как по количественному, так и по качественному показателю. Даже если исключить из сравнения американские авианосцы, то мы всё равно не сможем на равных противостоять им на море. И хоть основной упор Министерства Обороны идёт на армию и авиацию, мы не должны игнорировать нужды ВМС и нам необходимо начать проектирование и строительство современного надводного и подводного флота."
 STALIN_Project_30bis_desc: "Проект 30бис — это название для современного первоклассного эсминца, который значительно улучшит эскортные возможности нашего флота, и мы должны вложить в него значительные средства."
 STALIN_Modernize_the_Black_Sea_Shipyards_desc: "Несмотря на большое количество верфей в черном море, все они либо сильно пострадали от войны, либо устарели. Необходимо провести масштабную работу по их обновлению и расширению.."
 STALIN_Study_German_Submarine_Designs_desc: "Мы захватили довольно много немецких подводных лодок и исследователей, которые их проектировали, в конце Второй мировой войны. Изучая конструкции подводных лодок, мы можем улучшить наш собственный подводный флот."
 STALIN_Ramp_Up_Submarine_Production_desc: "Подводные лодки — наш единственный шанс нанести какой-либо ущерб западным кораблям, если мы когда-нибудь придем к конфликту. Мы должны убедиться, что наш флот соответствует поставленной задаче."
  
 STALIN_Chase_the_Industrial_Power_Dream_desc: "Мы давно преследовали мечту стать промышленным центром с полной экономической самодостаточностью и, благодаря нашим недавним усилиям, ближе, чем когда-либо, к достижению этой цели. Пришло время взять нашу судьбу в свои руки и наконец осуществить свои мечты."
 STALIN_Direct_Intervention_desc: "Мы не можем рисковать, что режим Ким Ир Сена рухнет под натиском НАТО. Здесь нельзя дурачиться. Прямое вмешательство намного предпочтительнее более пассивной роли."
 STALIN_Integration_of_the_Korean_Peninsula_desc: "Теперь, когда мы победили капиталистов в Корейской войне, пора КНДР присоединиться к нам и нашим союзникам в Коминформе."
 STALIN_Ensure_the_Survival_of_the_Kim_Regime_desc: "Война закончилась, и будет постыдно дать режиму Ким Ир Сена развалиться, сделав все наши вклады напрасными. Мы должны гарантировать выживание его правительства чтобы показать Западу с кем они имеют дело."
  
