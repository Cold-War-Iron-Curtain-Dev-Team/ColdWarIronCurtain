l_english:
 usa_announcement_category: "Объявление из Соединенных Штатов Америки"
 usa_announcement_category_desc: "Заявления от лидера Соединенных Штатов Америки"
 usa_address_korean_war: "Выступление Трумэна о Корейской войне"
 usa_address_korean_war_desc: "В воскресенье, 25 июня, коммунистические войска напали на Республику Корея. Это нападение показало, вне всякого сомнения, что международное коммунистическое движение готово использовать все методы для насаждения своей идеологии, включая вооруженное вторжение. Такой акт агрессии создает весьма реальную угрозу безопасности всех свободных стран. Коммунисты использовали всё что у них было, самолеты, танки и артиллерию. Масштаб атаки и скорость проведения операции,  говорят о том что она была спланирована заранее. Пятьдесят две из 59 стран, являющихся членами Организации Объединенных Наций, поддержали меры, принятые Советом безопасности для восстановления мира в Корее. Под флагом Организации Объединенных Наций было создано единое командование для всех сил Членов ООН, воюющих в Корее. Генерал Дуглас Макартур командует этими войсками. Кроме того, тот факт, что коммунисты вторглись в Корею, может говорить нам о том, что подобный акты агрессии может иметь место и в других частях мира. Свободные нации должны быть готовы отразить такого рода тайные нападения."
 prc_announcement_category: "Объявление из Китайской Народной Республики"
 prc_announcement_category_desc: "Заявление от руководителей Китайской Народной Республики."
 prc_address_korea_war: "Мао предлагает свою поддержку Северной Корее"
 prc_address_korea_war_desc: "Как долго будет продолжаться эта война? Давай не будем гадать. Пусть Трумэн и Эйзенхауэр или будущий президент решают сами. Но мы будем сражаться столько, сколько они захотят, пока не одержим полную победу.﻿"
 eng_announcement_category: "Объявление из Соединенного Королевства"
 eng_announcement_category_desc: "Заявления от лидера Соединенного Королевства Великобритании и Северной Ирландии."
 eng_address_korean_war: "Выступление Эттли о Корейской войне"
 eng_address_korean_war_desc: "Мы столкнулись с прямым вызовом авторитету Организации Объединенных Наций, был совершен акт агрессии. Если человек не очень хороший, то это не оправдывает человека, пытающегося убить его. Вы можете сказать, что Китай, не входит в Совет Безопасности. Но это не изменит сам факт агрессии. Более пятидесяти других стран поддерживают наше стремление сохранить мир во всем мире. Я совершенно уверен, что если мы победим, то это будет примером для всех тех кто подумает взяться за оружие. Мы остановим агрессоров!"
 usa_address_communism: "Трумэн выступает против коммунистической агрессии"
 usa_address_communism_desc: "Свободный мир должен быть готов взяться за оружие! Не держать всё в резерве, а быть готовыми уже сейчас! Как ваш президент, я говорю вам, что опасность в других частях мира так же велика, как и в Корее. Каждый день на мой стол приходят донесения о советских военных приготовлениях по всему миру, и если кто-то из вас увидит эти донесения и получит ту же информацию, вы откажетесь от всяких мыслей о том, что опасность миновала. Мы не можем подвести наших союзников в Корее. Мы должны иметь людей, корабли, самолеты, танки и бомбы наготове для любой чрезвычайной ситуации,и мы должны быть готовы использовать их!"
 prc_announce_formation: "Мао провозглашает Китайскую Народную Республику"
 prc_announce_formation_desc: "Китайская Народная Республика и Центральное народное правительство учреждены! Наше правительство-это единственное законное правительство народа во всей стране. Мы готовы установить дипломатические отношения с любыми иностранными правительствами, которые готовы соблюдать принципы равенства, совместного получения выгоды и уважения территориального суверенитета."
 eng_address_king_death: "Речь премьер-министра Черчилля о смерти короля Георга VI"
 eng_address_king_death_desc: "В эти последние месяцы король шел рядом со смертью, как будто смерть была его спутницей, знакомой, которую он узнавал и не боялся. В конце концов смерть пришла к нему. После счастливого солнечного дня он пожелал Спокойной ночи всем тем, кто любил его. Он заснул и не проснулся... Я, чья юность прошла в августейшей, неоспоримой славе Викторианской эпохи, испытываю трепет, вновь призывая молитву и гимн: Боже, храни Королеву!"