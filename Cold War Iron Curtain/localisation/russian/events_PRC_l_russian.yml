l_russian:
 PRC_Dispute.1.d: "Британская Индия вела переговоры о своих границах вдоль Гималаев с Тибетом и Китаем. После захвата Тибета КНР новый режим решил аннулировать многие из этих договоров, заявив, что тибетское правительство не имеет права вести переговоры по договорам. Строительство китайцами дорог и военных постов на спорных территориях вызвало резкие протесты со стороны Индии и развертывание войск. Напряженность сохраняется в Аксайчине и Северо-Восточном пограничном округе. В Аксайчине была установлена линия фактического контроля (ЛКК), отделяющая китайские войска от индийских, но недавно индийская армия начала проводить политику передового базирования. Однако конфликт перерос в полномасштабное пограничное столкновение, поскольку китайские войска начали окружать некоторые из этих постов, в то время как индийская армия, похоже, готова направить войска для охраны своих постов и спорного столкновения. По мере того как Индия и Китай направляют войска в зону конфликта, мир ждет, что из этого выйдет и не перерастет ли это пограничное насилие в более широкий конфликт"
 PRC_Dispute.2.d: "Китайское правительство объявило об одностороннем прекращении огня в конфликте с Индией после того, как оно вытеснило индийские войска со спорных территорий вдоль Гималаев. С самого начала конфликта передовые позиции индийской армии на спорных территориях не смогли изгнать китайские войска. Вместо этого индийские пограничные посты были перегружены, а индийские войска потерпели крах перед тактикой китайской инфильтрации. Нью-Дели отреагировал на случившееся шоком, а правительство Индии обратилось к западным державам с просьбой оказать помощь и предотвратить китайское вторжение. Хотя Китай, похоже, приостановил свои амбиции в отношении приграничных районов, Индия по-прежнему опасается, что эскалация может привести к полному военному краху. Вашингтон и Лондон проявляют одинаковую обеспокоенность коммунистической угрозой. Наблюдатели полагают, что Индия, скорее всего, получит помощь для восполнения своих потерь, но ее гордость уязвлена катастрофическими результатами. Военные лидеры в Пакистане, как говорят, с ликованием наблюдают за развитием событий."
 PRC_Dispute.3.d: "С 1945 года Народно-освободительная армия, казалось, была практически неудержима в достижении своих целей. Однако после просьбы китайского правительства о прекращении огня и переговоров с Индией стало ясно, что индийская армия одержала верх в недавнем пограничном конфликте в Гималаях. Индия, несомненно, будет стремиться защитить свои претензии и, скорее всего, преуспеет в этом, поскольку китайские войска, как утверждается, были вытеснены со спорных территорий. Передовая политика индийской армии оказалась весьма успешной. Индийские войска успешно устраивали засады на китайские войска в этом районе, а профессиональная подготовка и руководство, как утверждается, сыграли решающую роль в успехе Индии над тем, что западные наблюдатели считали "крестьянской армией". Внутри страны индийское правительство утвердило свою силу перед своим народом и показало всему миру, что Индии не нужно полагаться на иностранные державы, чтобы защитить себя от своих врагов. В Пекине предстоит еще многое осмыслить и проанализировать, хотя правительство успешно подавляет новости о военных неудачах среди населения."
 SINO_INDIA.10.d: "Опасная игра индийского правительства по вмешательству в дела Тибета и вводу своих войск на китайскую территорию получила достойный ответ. Попытка индийцев проникнуть на нашу границу и захватить Тибет привела к тому, что они превысили свои возможности. Наши закаленные в боях и патриотически настроенные войска использовали уроки горной войны, чтобы одолеть и уничтожить индийские силы на спорной территории. Профессиональные солдаты индийской армии доказали, что они - простые марионетки, преданные деньгам, а не стране, и были легко разгромлены нашими войсками. Овладев спорной территорией, мы объявили об одностороннем прекращении огня, наши силы смогли закрепить эту территорию, и мы объявили всему миру, как мы унизили нашего врага. Что еще более важно, пропаганда противника о том, что мы планируем генеральное вторжение, оказалась ложной. Однако, учитывая успех, мы должны подумать, хотим ли мы продолжать боевые действия в самой Индии, чтобы одержать крупную революционную победу. Или же нам следует придерживаться перемирия и просто завершить аннексию Аксайчина"
 SINO_INDIA.11.d: "После тяжелых боев с Индией на нашей гималайской границе пришло известие, что силы Народно-освободительной армии (НОАК) вытеснены со спорных территорий. В преддверии боевых действий коварные индийские войска ранее создали укрепленные позиции за нашими рубежами. С этих позиций противник успешно перехватывал пути снабжения и устраивал засады на войска, проходящие по нашей территории. Ободренные вероломным успехом, индийские войска бросились на подмогу, чтобы окончательно вытеснить нас со спорной территории. Индийское правительство объявило об успехе своих войск в захвате земель, на которые они претендовали. НОАК была унижена, и некоторые командиры уже говорят о том, что модель крестьянского солдата может оказаться нежизнеспособной теперь, когда Китай имеет обширные границы, которые нужно защищать. Возможно, необходимо повысить профессионализм индийской армии, чтобы в будущих конфликтах наши войска были способны реагировать на подобные инциденты на границе. Нам придется встретиться с индийским правительством и выслушать их требования к границе, надеюсь, что Тибет не пострадает в результате этих событий"
 SINO_INDIA.12.d: "Китайская агрессия началась с захвата Тибета. Коварные китайцы говорили о мире, но действовали с целью захвата наших земель. С Гималаев Китай мог бы разграбить наши земли, но наши силы одержали верх. Сегодня мы получили ноту от китайского правительства с просьбой о прекращении огня, чтобы остановить избиение своих войск, а также с просьбой о немедленном обсуждении вопроса о границе. Указание генерала Б.М. Каула о том, что армия должна проводить передовую политику по пресечению проникновения китайских войск, оказалось правильной стратегией. Наши профессиональные солдаты и офицеры выполнили поставленные задачи на отлично. Усилия китайских лазутчиков были пресечены нашими передовыми постами. Оценка армии, что китайские войска - это просто вооруженные крестьяне, не способные справиться с профессиональными солдатами, оказалась верной. Благодаря этой победе мы теперь можем диктовать границе ее правильные размеры. Китайцы больше не смогут игнорировать договоры и демаркации прошлого, и, что еще важнее, им придется вернуть незаконно захваченные ими кашмирские земли". В Нью-Дели ликующие толпы вышли на улицы, скандируя "Джай Хинд!" и осыпая цветами всех, кто был одет в военную форму. На военные базы по всей стране поступали сладости от благодарных граждан - независимая Индия продемонстрировала свой статус крупной державы."
 SINO_INDIA.13.d: "Индийское правительство получило ноту от китайского правительства о том, что оно объявило одностороннее прекращение огня в Аксайчине и Северо-Восточном пограничном округе. Китайские войска овладели почти всей спорной территорией, и сопротивление индийцев в спорной зоне практически полностью подавлено. Решение нашей армии начать передовую политику агрессивного патрулирования и создания постов за позициями китайских войск оказалось плохо продуманным. Тактика китайской инфильтрации позволила успешно изолировать и преодолеть многие из этих постов. Что еще более важно, индийские войска отправились в зону гималайских боев в летнем обмундировании и не имели достаточной разведки. Один из младших офицеров с горечью жаловался, что его подразделение вынуждено пользоваться местными туристическими картами, так как их собственные карты на эту территорию практически ничего не значат. По всей Индии ощущается страх перед дальнейшей китайской агрессией, а сама индийская армия должна задуматься над тем, что делать дальше. Несмотря на это, патриотизм остается на высоком уровне. Приоритетными задачами должны стать материально-техническое обеспечение и специальная подготовка войск, а многие офицеры считают, что вооруженные силы должны развивать свои доктрины, не ограничиваясь опытом Второй мировой войны. Хотя китайцы остановились и достигли своих целей, многие в Индии затаили дыхание, опасаясь дальнейшей китайской агрессии с целью воспользоваться военными неудачами Индии. Как минимум, мы находимся во власти китайских желаний на спорных землях"
 SINO.INDIA.T: "[GetNewspaperHeader] Китайско-Индийская война"
 PRC_Dispute.4.d: "Беды индийских военных и правительства продолжились, когда Народно-освободительная армия объявила о начале вторжения в Индию. По заявлению НОАК, ее целью является освобождение индийского народа от колониального гнета. Это кардинальное изменение ситуации, поскольку первоначально НОАК представляла конфликт как пограничный спор, и индийцы теперь опасаются, что волны китайских дивизий вскоре хлынут из Гималаев на индийские равнины. Ранее индийская армия пыталась оттеснить НОАК и закрепить свои притязания на спорной границе с Китаем, проводя политику создания небольших форпостов на спорных территориях. В Нью-Дели ощущается атмосфера страха, поскольку правительство приказало военным передислоцировать все свои силы для противостояния китайской угрозе. Однако в других крупных городах многие индийцы вышли на улицы, чтобы продемонстрировать свою поддержку военным, многие молодые люди пообещали противостоять китайцам."
 PRC.201.d: "Сегодня, согласно докладу караула. \nМао Цзэдун, бывший председатель Китайской Народной Республики, умер в своем родном городе Шаошань.\nХотя он и совершил несколько ошибок, он все же великий лидер.\nПосле произнесения посмертной речи по всей стране новый лидер КНР Лю Шаоци наконец объявил о своем решении кремировать его тело. В своей надгробной речи он эвфемистически прокомментировал "достоинства и недостатки" Мао, высоко оценил его вклад в освобождение Китая, но подверг резкой критике ошибочную экономическую и политическую политику Мао."
 PRC.202.d: "8 января 1976 года в Пекине скончался премьер Чжоу Эньлай, один из выдающихся руководителей Коммунистической партии Китая. Во время двухдневной церемонии прощания с телом тысячи жителей столицы пришли к Монументу народным героям, чтобы оплакать Чжоу Эньлая. По обеим сторонам улицы Чанъань толпились люди из всех слоев общества, а траурная процессия растянулась на десятки километров.\n На штаб-квартире ООН в Нью-Йорке были подняты полумачтовые флаги. После кремации тела, согласно желанию Чжоу, прах был развеян в водохранилище Миюнь, в реке Хайхэ в Тяньцзине и в устье Желтой реки."
 PRC.203.d: "28 июля 1976 г. в Фэннане, городе Таншань провинции Хэбэй, произошло землетрясение магнитудой 7,8, продолжавшееся около 23 секунд. Таншань, промышленный город с миллионным населением, сильно пострадал. Поскольку землетрясение произошло рано утром, а транспорт, связь, водоснабжение и электроснабжение города после землетрясения были прерваны, спасательные работы были затруднены. Согласно официальной статистике, в результате землетрясения погибло более 240000 человек и более 160000 получили серьезные ранения. \nПосле катастрофы китайское правительство немедленно направило войска и мобилизовало население всей страны для проведения мероприятий по ликвидации последствий катастрофы в Таншане, чтобы восстановить промышленное и сельскохозяйственное производство и жизненно важные коммуникации."
 PRC.204.d: "6 июля 1976 г. в Пекине в возрасте 90 лет скончался член постоянного комитета Политбюро ЦК КПК, вице-президент Чжу Дэ. Его смерть вновь вызвала глубокую скорбь и воспоминания народа всей страны после Чжоу Эньлая, а также нанесла очередной удар по Мао Цзэдуну.\n9 и 10 июля во Дворце культуры трудящихся в Пекине прошла церемония соболезнования товарищу Чжу Дэ. 11-го числа в Большом зале народных собраний состоялся митинг памяти. В нем приняли участие более 5000 руководителей партии и государства, а также представители всех слоев населения столицы. Хуа Гофэн выступил на собрании с посмертной речью"
 PRC.205.d: "После начала инцидента на острове Чжэньбао в 1969 году китайско-советские отношения упали до минимума. 21 марта Чжоу Эньлай созвал совещание с Хуан Юншэном, У Факсяном, Вэнь Юйчэном и Чэнь Силяном, командующим военным округом Шэньян, и соответствующими сотрудниками оперативного отдела Генерального штаба. Ввиду ситуации, когда советская армия могла бы насильственно оккупировать остров Чжэньбао, Чжоу Эньлай согласился усилить наши береговые силы и энергично развернуть их, чтобы дождаться завершения работ и подготовиться к последнему нападению.В то же время, в связи с просьбой Косыкина поговорить с Мао Цзэдуном и Чжоу Эньлаем по мобильному телефону, соответствующие ответственные лица Министерства иностранных дел были вызваны, чтобы согласиться дать ответ Отделению реанимации в Китае в форме меморандума: "с точки зрения нынешних отношений между Китай и Советский Союз, это больше не применимо к контактам по телефону. Если советскому правительству есть что сказать, пожалуйста, официально передайте это китайскому правительству по дипломатическим каналам. ' "
 PRC.206.d: "После того как бывшие президенты Лю Шаоци и Дэн Сяопин были репрессированы как капиталисты, Мао Цзэдун начал искать достаточно надежного преемника. Воспользовавшись случаем, Линь Бяо, руководивший повседневной работой Центральной военной комиссии, стал заискивать перед Мао Цзэдуном, активно участвовал в политической работе, расставлял доверенных лиц на различные посты и уничтожал политических врагов. На одиннадцатом пленуме ЦК КПК восьмого созыва Линь Бяо стал единственным заместителем председателя ЦК. Похоже, что Линь Бяо стал наиболее подходящим кандидатом на пост президента на девятом Всекитайском съезде КПК."
 PRC.207.d: "На девятом съезде КПК Мао Цзэдун предложил избрать Линь Бяо единственным заместителем председателя ЦК, и нет сомнений, что Линь Бяо был назначен единственным наследником.\nДовольно много партийных чиновников придерживаются различных мнений относительно стиля поведения Линь Бяо и результатов выборов.\nПоэтому отношение Чжоу Эньлая к Линь Бяо, как премьера Госсовета, также очень важно."
 prc.211.d: "Хотя на Девятом съезде КПК он был назначен единственным наследником, физическое состояние Линь Бяо становилось все более очевидным, давя на Мао шаг за шагом. \nВ октябре 1970 года при поддержке Линь Бяо и во главе с Линь Лигуо группа военных сформировала "объединенный флот" и ждала удобного случая для вооруженного переворота."
 prc.212.d: "Второе пленарное заседание ЦК КПК девятого созыва I: следует ли упразднить должность президента страны\nПосле свержения Лю Шаоци должность президента долгое время оставалась вакантной. На втором пленуме ЦК КПК девятого созыва Мао Цзэдун предложил ЦК внести изменения в Конституцию и предложил упразднить должность президента. Однако, исходя из реалистичного учета политической ситуации в стране, большинство членов ЦК КПК по-прежнему хотят сохранить пост президента и предлагают Мао Цзэдуна на пост президента, но Мао Цзэдун по-прежнему обладает непоколебимым авторитетом.\nВопрос о том, упразднять или нет пост президента, остается открытым."
 prc.213.d: "10. Второй пленум Центрального комитета КПК девятого созыва II: Три наречия\П Три наречия "гениальный", "творческий" и "всеобъемлющий" впервые появились в коммюнике Одиннадцатого пленума Центрального комитета КПК восьмого созыва в августе 1966 года. Как наследник, Линь Бяо скопировал эти три наречия, много раз публично пропагандировал "теорию гениальности" и утверждал, что председатель Мао был редким гением. Сам Мао испытывает сильное отвращение к этим трем наречиям и много раз предлагал их удалить. Однако У Факсянь настоял на том, чтобы снова включить в проект конституции три наречия, оценивающие Мао Цзэдуна "гениально, творчески и всесторонне", что намеренно вызвало оппозицию Чжан Чуньцяо, Каншэна и других. Развитие противоречий между двумя группами серьезно повлияло на внутрипартийное единство, вопрос о сохранении трех наречий также стал ключевым решением на собрании."
 prc.214.d: "Будучи основным членом группы Линь Бяо, Чэнь Бода создавал импульс для Линь Бяо на многих публичных мероприятиях. На втором пленуме ЦК КПК девятого созыва он, как помощник Линь Бяо, неоднократно выдвигал противоположные мнения Мао Цзэдуну, бросая вызов авторитету и проверяя предел его терпения. Давление, оказываемое на Мао кликой Линь Бяо, привело к тому, что Мао стал осведомлен об амбициях Линь Бяо. Чтобы избежать публичного раскола в партии, он, похоже, использовал публичную критику Чэнь Бода, чтобы предупредить Линь Бяо о том, что это хороший выбор."
 prc.215.d: "Второй Пленум ЦК КПК девятого созыва завершился благополучно. На заседании были единогласно приняты многие предложения, выдвинутые Линь Бяо. В соответствии с мнением Мао Цзэдуна пленум подверг критике Чжан Чуньцяо, Каншэна и других и распорядился о пересмотре статуса Линь Бяо в партии, его популярность и престиж достигли небывалой высоты."
 prc.218.d: "После раскрытия заговора Линь Бяо с целью организации вооруженного переворота он ранним утром 13 сентября 1971 г. на самолете "Trident 257" сбежал в Советский Союз. Однако из-за поспешного взлета в 02:30 ночи самолет неудачно приземлился на луг к северо-востоку от Вэньдуэрханя Монгольской Народной Республики, в результате чего Линь Бяо, Линь Лигуо, Е Цюнь и ещё девять человек погибли на месте. Большинство других членов группы Линь Бяо были арестованы или покончили жизнь самоубийством, а группа Линь Бяо была объявлена уничтоженной.\nПосле этого, в соответствии с указаниями центральных властей, посол Китая в Монголии Сюй Вэньи и другие отправились на место катастрофы для осмотра тела, похоронили тело на месте и вернулись домой с большим количеством фотографий, сделанных на месте происшествия, для отчета."
 prc.217.d: "После раскрытия заговора Линь Бяо с целью организации вооруженного переворота, ранним утром 13 сентября 1971 года он сбежал в Советский Союз на самолёте Trident 257. Однако из-за поспешного взлета в 02:30 ночи самолет не смог приземлиться на луг к северо-востоку от Вэньдуэрханя Монгольской Народной Республики, в результате чего Линь Бяо, Линь Лигуо, Е Цюнь и другие девять человек погибли на месте. Большинство других членов группы Линь Бяо были арестованы или покончили жизнь самоубийством, а группа Линь Бяо была объявлена уничтоженной.\nПосле этого, в соответствии с указаниями центральных властей, посол Китая в Монголии Сюй Вэньи и другие отправились на место катастрофы для осмотра тела, похоронили тело на месте и вернулись домой с большим количеством фотографий, сделанных на месте происшествия, для отчета."
