###Syria###

 SYR_1967_war_of_aggression:0 "Война сионистской агрессии"

 SYR_attack_galilee:0 "Спровоцировать сионистов в Галилее"

 SYR_1967.1.t:0 "Саботаж оружейного завода"
 SYR_1967.1.d:0 "С одной из наших фабрик поступили сообщения, что прошлой ночью произошел крупный пожар. Местные пожарные все еще борются с огнем, но уверены, что к концу дня они возьмут огонь под контроль. Ущерб, нанесенный заводу, по-видимому, был значительным, поскольку пожар, по-видимому, начался в складском помещении для легковоспламеняющихся химических веществ.\n\nРазведка начала тщательное расследование, чтобы выяснить, как пожар мог вспыхнуть, несмотря на самые строгие меры безопасности. Первые зацепки указывают на то, что поджог вполне возможен."  SYR_1967.1.a:0 "Кто бы мог сделать такую ​​вещь?"
 SYR_1967.1.a:0 "Кто бы мог это сделать?"
 SYR_1967.2.t:0 "Саботаж гражданского завода"
 SYR_1967.3.t:0 "Мост взорван"
 SYR_1967.3.d:0 "Где-то в течении дня артиллеристы обстреливали наш мост. Из-за продолжающихся обстрелов спасательные и восстановительные работы были затруднены.\n\nВоенная разведка направила группу для расследования непосредственно на месте.\n\nСвидетели сообщают, что видели, как с сирийской границы летят артиллерийские снаряды. Подтекст очевиден."
 SYR_1967.4.t:0 "Канал обстрелян"
 SYR_1967.4.d:0 "Где-то в течении дня артиллеристы обстреливали наши водный канал. Из-за продолжающихся обстрелов спасательные и восстановительные работы были затруднены.\n\nВоенная разведка направила группу для расследования непосредственно на месте.\n\nСвидетели сообщают, что видели, как с сирийской границы летят артиллерийские снаряды. Подтекст очевиден."
 SYR_1967.5.t:0 "Засада на патруль"
 SYR_1967.5.d:0 "Один из наших патрулей в Галилее так и не вернулся. Поисковая группа, работающая по пути патруля, обнаружила место стычки, с признаками того, что патруль был застигнут врасплох и уничтожен в жестокой рукопашной схватке.\n\nНеизвестно, понесли ли нападавшие какие-либо потери, но единственные найденные трупы принадлежат израильским солдатам.\n\nКажется, что их оставили намеренно, возможно, чтобы послать сообщение."

 SYR_1967.6.t:0 "Провокация удалась"
 SYR_1967.6.d:0 "Наши войска устроили саботаж на сионистской фабрике. Подробности о нанесенном ущербе весьма скудны, поскольку евреи объявили всю эту территорию запретной зоной.\n\nУже один этот факт должен говорить нам о том, что мы испытываем страх."
 SYR_1967.6.a:0 "Мы вселили страх в их сердца."
 SYR_1967.7.d:0 "Наша артиллерия сумела разбомбить дорогу в сионистских землях. Артиллерия сообщает, что путь был полностью разрушен. \n\n\Они позаботились о том, чтобы их видели местные жители, давая понять, что это было предупреждение уйти."
 SYR_1967.8.d:0 "Наша артиллерия сумела разбомбить дорогу в сионистских землях. Артиллерия сообщает, что путь был полностью разрушен. \n\n\Они позаботились о том, чтобы их видели местные жители, давая понять, что это было предупреждение уйти."
 SYR_1967.9.d:0 "Мы успешно устроили засаду и уничтожили сионистский патруль. Их тела были оставлены на месте преступления, чтобы убедиться, что паразиты получили правильное сообщение."
