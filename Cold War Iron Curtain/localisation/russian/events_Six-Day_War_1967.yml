l_english:
 SYR_1967_war_of_aggression:0 "Арабо-израильская война 1967 года"
 SYR_attack_galilee:0 "Атаковать Галилею"
 SYR_1967.1.t:0 "Диверсия на военном заводе"
 SYR_1967.1.d:0 "Прошлой ночью на одном из наших заводов произошел крупный пожар. Местные пожарные продолжают борьбу с огнем, но уверены, что смогут полностью его потушить к концу дня. По предварительным данным, ущерб значительный, поскольку возгорание началось в зоне хранения легковоспламеняющихся химикатов.  \n\nРазведка ведет тщательное расследование причин пожара, несмотря на строгие меры безопасности. Первые зацепки допускают возможность поджога."
 SYR_1967.1.a:0 ""
 SYR_1967.2.t:0 "Диверсия на гражданской фабрике"
 SYR_1967.3.t:0 "Взорванный мост"
 SYR_1967.3.d:0 "Где-то в течение дня наши дороги подверглись артиллерийскому обстрелу, что затруднило проведение спасательных операций. Из-за продолжающихся атак работы по ликвидации последствий оказались серьезно осложнены.  \n\nВоенная разведка направила группу для обследования района, как только обстановка стала безопасной, с целью установить источник огня.  \n\nМестные очевидцы утверждают, что видели артиллерийские снаряды, прилетавшие со стороны сирийской границы. Подтекст очевиден."
 SYR_1967.4.t:0 "Обстрелянный канал"
 SYR_1967.4.d:0 "В течение дня артиллерийскому обстрелу подверглись наши водопроводные каналы, что серьезно затруднило проведение спасательных работ. Из-за продолжающихся атак устранение последствий оказалось крайне сложным.  \n\nВоенная разведка направила группу для обследования территории, как только обстановка стала безопасной, чтобы установить источник огня.  \n\nМестные очевидцы сообщают, что артиллерийские снаряды прилетали со стороны сирийской границы. Подтекст очевиден."
 SYR_1967.5.t:0 ""
 SYR_1967.5.d:0 "Один из наших патрулей в Галилее не вышел на связь и не прибыл на место назначения. Поисковая группа, обследовавшая его маршрут, обнаружила следы ожесточенного боя. Все указывает на то, что патруль был застигнут врасплох и уничтожен в жестокой рукопашной схватке.\n\nПока неизвестно, понесли ли нападавшие потери, но на месте найдены только тела израильских солдат.\n\nСоздается впечатление, что они были оставлены преднамеренно - возможно, как зловещее послание."
 SYR_1967.6.t:0 ""
 SYR_1967.6.d:0 "Наши войска устроили диверсию на фабрике сионситов. Подробности о нанесенном ущербе весьма скудны, поскольку евреи объявили всю эту территорию запретной зоной.\n\nУже один этот факт должен говорить нам о том, что они начали нас бояться."
 SYR_1967.6.a:0 ""
 SYR_1967.7.d:0 "Наша артиллерия успешно нанесла удар по дороге на землях сионистов, полностью разрушив её.  \n\nПо словам военных, удар был нанесён демонстративно — так, чтобы его заметили местные жители, ясно давая понять: это предупреждение покинуть эти места."
 SYR_1967.8.d:0 "Наша артиллерия успешно нанесла удар по дороге на землях сионистов, полностью разрушив её.  \n\nПо словам военных, удар был нанесён демонстративно — так, чтобы его заметили местные жители, ясно давая понять: это предупреждение покинуть эти места."
 SYR_1967.9.d:0 "Мы успешно устроили засаду и уничтожили сионистский патруль. Их тела были оставлены на месте преступления, чтобы убедиться, что паразиты получили наше послание."