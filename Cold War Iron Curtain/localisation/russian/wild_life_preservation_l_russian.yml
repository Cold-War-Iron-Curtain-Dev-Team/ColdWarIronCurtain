l_english:
 kenyan_national_parks: "Кенийские национальные парки и заповедники"
 kenyan_national_parks_desc: "Начиная с 20-го века, важность уникальных экосистем Африки, как значимых и прекрасных аспектов биосферы и географии мира, стала очевидна. По мере того, как африканские страны получают независимость, коренные жители континента начинают приезжать в национальные парки, чтобы насладиться просмотром уникальной флоры и фауны, в том числе и национальными символами их страны. Таким образом, и у правительства, и у населения есть потребность в создании общественных заповедников и национальных парков, призванных защитить районы этого прекрасного континента. Национальные парки и заповедники могут служить хорошим источником дохода."
