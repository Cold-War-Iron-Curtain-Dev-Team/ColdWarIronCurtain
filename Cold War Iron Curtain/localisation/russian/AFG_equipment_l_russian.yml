  ### Jet CAS 
 AFG_jet_CAS_equipment_1: "Ильюшин Ил-10М"
 AFG_jet_CAS_equipment_1_desc: "Яковлев Як-23 "Флора" — штурмовик советской разработки, представленный в 1949 году. Самолет был развитием реактивного истребителя Як-15. Як-23 в основном экспортировался в страны Варшавского договора, где он оставался в службе до конца 1950-х годов."
 AFG_jet_CAS_equipment_1_short: "Ил-10М"
 AFG_jet_CAS_equipment_2: "Микоян-Гуревич МиГ-17бис"
 AFG_jet_CAS_equipment_2_desc: "Конверсия истребителя-бомбардировщика, оснащенного неуправляемыми ракетами и бомбами."
 AFG_jet_CAS_equipment_2_short: "МиГ-17бис"
 AFG_jet_CAS_equipment_3: "Микоян-Гуревич МиГ-19С"
 AFG_jet_CAS_equipment_3_desc: "Истребитель-бомбардировщик с цельноповоротным плитчатым хвостовым оперением. Оснащен приемником дальней навигации "Свод" и вооружен тремя 30-мм пушками НР-30. Предусмотрен для установки реактивной неуправляемой ракетной установки ОРО-32К или ФАБ-250. бомбы под каждым крылом, а с 1957 года модифицировали, чтобы можно было нести четыре ракетных блока."
 AFG_jet_CAS_equipment_3_short: "МиГ-19С"
 AFG_jet_CAS_equipment_4: "Сухой Су-7Б"
 AFG_jet_CAS_equipment_4_desc: "Бомбардировочный вариант Су-7 "Слесарь-А" впервые поднялся в воздух в марте 1959 г., позже поступил на вооружение в 1961 г. Он стал основным советским штурмовиком 1960-х гг. С 1957 по 1972 г. более 1400 самолетов. Были построены Су-7Б, многие из которых были экспортированы. Самолет был относительно популярен за границей, обслуживался в 10 странах. Он широко использовался как в ВВС Индии, так и в ВВС Египта. Самолет остается на ограниченной службе в Северной Корее."
 AFG_jet_CAS_equipment_4_short: "Су-7Б"
 AFG_jet_CAS_equipment_5: "Сухой Су-7БКЛ"
 AFG_jet_CAS_equipment_5_desc: "Модернизированный двигатель АЛ-7Ф-1, модернизированная топливная система с внешними трубопроводами по обеим сторонам хребта фюзеляжа, топливные баки установлены в крыльях, "мокрые" подкрыльевые узлы подвески для подвесных топливных баков, способные нести тактические ядерные бомбы ."
 AFG_jet_CAS_equipment_5_short: "Су-7БКЛ"
 AFG_jet_CAS_equipment_6: "Сухой Су-22М4"
 AFG_jet_CAS_equipment_6_short: "Су-22М4"
 AFG_jet_CAS_equipment_6_desc: "Сухой Су-17 Фиттер-С был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских стран и Южной Америки. Усовершенствованный Су-17 почти во всех аспектах своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено и использовалось 2867 самолетов в 30 странах, 6 из которых используют эти самолеты до сих пор."
 AFG_jet_CAS_equipment_7: "Сухой Су-22М4К"
 AFG_jet_CAS_equipment_7_short: "Су-22М4К"
 AFG_jet_CAS_equipment_7_desc: "Сухой Су-17 Фиттер-С был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС Восточного блока, арабских и южноамериканских ВВС. Улучшенный Су-17 почти во всех аспектах своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено и использовалось 2867 самолетов в 30 странах, 6 из которых используют этот самолет до сих пор."
 AFG_jet_CAS_equipment_8: "Сухой Су-25"
 AFG_jet_CAS_equipment_8_desc: "Сухой Су-25 "Лягушка" - двухмоторный штурмовик, разработанный в Советском Союзе. Самолет совершил свой первый полет в 1975 году и был введен в эксплуатацию в 1981 году. С 1978 года было произведено более 1000 самолетов. популярный за рубежом самолет, который продается в 29 стран. Из-за этого Су-25 участвовал в нескольких конфликтах, в частности, в советско-афганской, ирано-иракской войнах и войнах в Персидском заливе. Сегодня самолет остается на вооружении всех стран-экспортеров."
 AFG_jet_CAS_equipment_8_short: "Су-25"
  
  
  
