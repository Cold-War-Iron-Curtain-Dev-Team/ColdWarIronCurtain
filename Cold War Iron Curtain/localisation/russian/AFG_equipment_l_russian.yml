 ##Afghan Air Forces 
 AFG_fighter_equipment_0: "ВВС Афганистана"
 AFG_fighter_equipment_0_short: "ВВС"
 AFG_fighter_equipment_0_desc: "Королевские ВВС Афганистана были созданы в 1921 году при правлении короля Амануллы и значительно модернизированы королем Захир-шахом в 1960-х годах. В 1980-х годах Советский Союз создал афганские ВВС, сначала пытаясь победить моджахедам и в надежде, что мощная афганская авиация сохранит просоветское правительство Мохаммада Наджибуллы."
  
 AFG_fighter_equipment_1: "Яколев Як-3"
 AFG_fighter_equipment_1_short: "Як-3"
 AFG_fighter_equipment_1_desc: "Яковлев Як-3 был одномоторным одноместным советским истребителем времен Второй мировой войны. Надежный и простой в обслуживании, он очень понравился как пилотам, так и наземному персоналу. Один из самых маленьких и легких боевых истребителей, имевшихся на вооружении. любым бойцом во время войны, его высокое отношение мощности к весу давало ему отличные характеристики, и он оказался грозным воздушным истребителем."
 AFG_fighter_equipment_2: "Лавочкин Ла-7"
 AFG_fighter_equipment_2_short: "Ла-7"
 AFG_fighter_equipment_2_desc: "Лавочкин Ла-7 — поршневой одноместный советский истребитель, разработанный во время Великой Отечественной войны ОКБ Лавочкина. Он был развитием и усовершенствованием Лавочкина Ла-5 и последним в семействе самолетов, начавшееся с ЛаГГ-1 в 1938 году."
 AFG_fighter_equipment_3: "Лавочкин Ла-9"
 AFG_fighter_equipment_3_short: "Ла-9"
 AFG_fighter_equipment_3_desc: "Ла-9 представляет собой дальнейшее развитие прототипа Лавочкина Ла-126. Первый прототип, получивший обозначение Ла-130, был закончен в 1946 году. Сходство со знаменитым Лавочкиным Ла-7 было лишь внешним - новый истребитель имел все -металлическая конструкция и крыло с ламинарным обтеканием. Уменьшение веса за счет отказа от дерева в планере позволило значительно увеличить запас топлива и четырехпушечное вооружение. Учебный бой показал, что Ла-130 был на равных с Ла-7, но уступал к яковлевскому Як-3 в горизонтальных плоскостях. Новый истребитель, получивший официальное обозначение Ла-9, был запущен в производство в августе 1946 года. Всего к концу производства в 1948 году было построено 1559 самолетов."
  
 AFG_jet_multirole_equipment_1: "Микоян-Гуревич МиГ-9"
 AFG_jet_multirole_equipment_1_desc: "МиГ-9 "Фарго" был первым реактивным самолетом, разработанным Микояном после Второй мировой войны. Представлен в 1948 году. Он имел ограниченное боевое и учебное применение во время Гражданской войны в Китае и Корейской войны. Всего было произведено 610 самолетов, исключительно СССР. Последние МиГ-9 были списаны КНР в 1951 году."
 AFG_jet_multirole_equipment_1_short: "МиГ-9"
 AFG_jet_multirole_equipment_2: "Микоян-Гуревич МиГ-15"
 AFG_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 "Фагот" Микояна-Гуревича поступил на вооружение в 1947 году. С момента своего появления в Корейской войне МиГ-15 участвовал во многих конфликтах, где он показал себя достойный противник американским F-86 Sabre и F9F Panther. Участок корейско-китайской границы получил прозвище Аллея МиГов из-за их преобладания в этом районе. Более 18 000 МиГ-15 были построены и использовались многими странами, в первую очередь СССР и страны Восточного блока. Хотя большинство самолетов было выведено из эксплуатации в 1950-х годах, некоторые из них до сих пор остаются на вооружении ВВС Северной Кореи."
 AFG_jet_multirole_equipment_2_short: "МиГ-15"
 AFG_jet_multirole_equipment_3: "Микоян-Гуревич МиГ-17"
 AFG_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 "Фагот". С 1952 года было произведено более 10 000 МиГ-17 Fresco. МиГ-17 производился по лицензии в ВВС НОАК как Shenyang J-5. Всего МиГ использовали 20 стран. -17, охватывая Африку, Европу и Азию. Его первое боевое применение было в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabre над Тайваньским проливом. Однако МиГ-17 в основном использовался во Вьетнамской войне с NVAF. и ВВС НОАК, где он одержал 28 воздушных побед.МиГ-17 был настолько успешным, что даже выстоял против гораздо более современных, сверхзвуковых американских истребителей Phantom II во время войны во Вьетнаме.МиГ-17 вообще был выведен из эксплуатации в 1970-х годах, в то время как он до сих пор находится в ограниченном количестве в некоторых африканских странах и Северной Корее."
 AFG_jet_multirole_equipment_3_short: "МиГ-17"
 AFG_jet_multirole_equipment_4: "Микоян-Гуревич МиГ-19"
 AFG_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в горизонтальном полете. Сопоставимым американским истребителем "Century Series" был North American F-100 Super Sabre, хотя МиГ-19 в основном воевал против более современные McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 AFG_jet_multirole_equipment_4_short: "МиГ-19"
 AFG_jet_multirole_equipment_5: "Микоян-Гуревич МиГ-21Ф-13"
 AFG_jet_multirole_equipment_5_desc: "МиГ-21 "Фишбед" считается одним из первых советских истребителей третьего поколения, оснащенных ракетами дальнего радиуса действия и импульсным радаром. Китай и Индия по лицензии.Было построено более 11 000 самолетов, служивших в более чем 60 странах на 5 континентах.За время своего существования МиГ-21 сбили 240 самолетов.МиГ-21 участвовал во многих конфликтах,в том числе во Вьетнаме (где он видел огромные успех), индо-пакистанская война 1971 года, ирано-иракская война и множество более мелких конфликтов. Он остается на вооружении спустя более 6 десятилетий."
 AFG_jet_multirole_equipment_5_short: "МиГ-21Ф-13"
 AFG_jet_multirole_equipment_6: "Микоян-Гуревич МиГ-21ПФ"
 AFG_jet_multirole_equipment_6_desc: "Серийный вариант всепогодного перехватчика. Они были оснащены ТРД Р11Ф2-300 и, начиная с седьмой серийной партии, оснащались РЛС РП-21 (в первых шести партиях использовалась более старая РЛС ЦД-30Т (он же РП-9-21).Кроме того, система управления вооружением была изменена по сравнению с F-13, чтобы позволить использовать зенитный ракетный комплекс РС-2УС (он же К-5МС) с лучевым наведением в дополнение к К с ИК-наведением. -13."
 AFG_jet_multirole_equipment_6_short: "МиГ-21ПФ"
 AFG_jet_multirole_equipment_7: "Микоян-Гуревич МиГ-21бис"
 AFG_jet_multirole_equipment_7_short: "МиГ-21бис"
 AFG_jet_multirole_equipment_7_desc: "Окончательная разработка МиГ-21, оснащенная ТРД Туманского Р25-300 и множеством других улучшений по сравнению с предыдущими типами. Лазурь GCI ("Лежа-Л"), а для ВВС СССР была установлена ​​система ИЛС "Полет" ("Ледка-Н")."
 #AFG_jet_multirole_equipment_8: "Микоян-Гуревич МиГ-23МЛ"
 #AFG_jet_multirole_equipment_8_desc: "The early "Flogger" variants had a number of design shortcomings, including airframe strength and reliability, engine performance, maneuverability and radar performance. A considerable redesign of the airframe was conducted, resulting in the MiG-23ML."
 #AFG_jet_multirole_equipment_8_short: "MiG-23ML"
 #AFG_jet_multirole_equipment_9: "Mikoyan-Gurevich MiG-23MLD"
 #AFG_jet_multirole_equipment_9_desc: "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 #AFG_jet_multirole_equipment_9_short: "MiG-23MLD"
 #AFG_jet_multirole_equipment_10: "Mikoyan-Gurevich MiG-29A"
 #AFG_jet_multirole_equipment_10_desc: "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 #AFG_jet_multirole_equipment_10_short: "MiG-29A"
  
