 AFG_mbt_equipment_0: "Т-34-85"
 AFG_mbt_equipment_0_short: "Т-34-85"
 AFG_mbt_equipment_0_desc: "Т-34 — советский средний танк, который произвел революцию в области танкостроения и хорошо известен своей надежностью. Т-34 был разработан в 1940 году ХКБД в Советском Союзе. В попытке сократить расходы, В конструкцию танка была введена наклонная броня.Однако это также привело к тому, что сам танк стал намного лучше защищенным, а также менее дорогим с меньшей площадью поверхности. Само орудие представляет собой 76,2-мм орудие и имело номинальный боекомплект. Однако, прицелы и приборы обзора были крайне плохими, что затрудняло действия командиров танков, а их плохая координация сводила на нет многие преимущества, которые давал сам танк. Т-34 стал вторым по массовости танком в мире, но одним из самых наиболее важны во Второй мировой войне. Т-34 до сих пор используются повстанцами и более бедными странами."
 AFG_mbt_equipment_1: "Т-34-85М"
 AFG_mbt_equipment_1_short: "Т-34-85М"
 AFG_mbt_equipment_1_desc: "Т-34 — советский средний танк, который произвел революцию в области танкостроения и хорошо известен своей надежностью. Т-34 был разработан в 1940 году ХКБД в Советском Союзе. В попытке сократить расходы, В конструкцию танка была введена наклонная броня.Однако это также привело к тому, что сам танк стал намного лучше защищенным, а также менее дорогим с меньшей площадью поверхности. Само орудие представляет собой 76,2-мм орудие и имело номинальный боекомплект. Однако, прицелы и приборы обзора были крайне плохими, что затрудняло действия командиров танков, а их плохая координация сводила на нет многие преимущества, которые давал сам танк. Т-34 стал вторым по массовости танком в мире, но одним из самых наиболее важны во Второй мировой войне. Т-34 до сих пор используются повстанцами и более бедными странами."
 AFG_mbt_equipment_2: "Т-54"
 AFG_mbt_equipment_2_short: "Т-54"
 AFG_mbt_equipment_2_desc: "Танк Т-54 был самым массовым танком в истории. Танк был разработан в 1946 году ХКБД. Сам танк оснащен 100-мм нарезной пушкой и имеет различную толщину брони от 205 до 60 мм. Сам двигатель представляет собой дизельный двигатель V-12 объемом 38,88 л, а танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался более чем в 50 армиях мира и производился на всей советской территории и во всех странах мира. их конфликты вместе с ним."
 AFG_mbt_equipment_3: "Т-55"
 AFG_mbt_equipment_3_short: "Т-55"
 AFG_mbt_equipment_3_desc: "Т-55 является усовершенствованной версией танка Т-54. ОКБ-520 доработало конструкцию Т-55, улучшив защиту от РХБ, придав ему более оптимизированный двигатель, улучшив форму башни и даже добавив дополнительные вспомогательные оборудование, такое как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал крупнокалиберный пулемет ДШК калибра 12,7, тогда как Т-54 использовал орудие СГМТ калибра 7,62, что придавало ему большую огневую мощь, но не позволяло нести больше боеприпасов. Использовался в стольких же армиях и типично видел все конфликты, которые видел Т-54."
 AFG_mbt_equipment_4: "Т-62"
 AFG_mbt_equipment_4_short: "Т-62"
 AFG_mbt_equipment_4_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет немного более толстую броню. Основное орудие также было увеличено до 115 мм. Первоначально он был заказан Советским Союзом. в попытке улучшить свою огневую мощь, и ОКБ-520 завершило проект примерно в 1960 г. Несмотря на улучшение, производство не было прекращено, поскольку его стоимость была намного выше, чем у Т-55. Более 22 700 Т-62 были выпущены произведены, и он участвовал в большом количестве боев на территории СССР, но участвовал в конфликтах в основном на Ближнем Востоке. Его усовершенствования продемонстрировали немного большую боеспособность в 1969 году в китайско-советском пограничном конфликте."
 AFG_mbt_equipment_5: "Т-62М"
 AFG_mbt_equipment_5_short: "Т-62М"
 AFG_mbt_equipment_5_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет немного более толстую броню. Основное орудие также было увеличено до 115 мм. Первоначально он был заказан Советским Союзом. в попытке улучшить свою огневую мощь, и ОКБ-520 завершило проект примерно в 1960 г. Несмотря на улучшение, производство не было прекращено, поскольку его стоимость была намного выше, чем у Т-55. Более 22 700 Т-62 были выпущены произведены, и он участвовал в большом количестве боев на территории СССР, но участвовал в конфликтах в основном на Ближнем Востоке. Его усовершенствования продемонстрировали немного большую боеспособность в 1969 году в китайско-советском пограничном конфликте."
 AFG_mbt_equipment_6: "Т-62М1"
 AFG_mbt_equipment_6_short: "Т-62М1"
 AFG_mbt_equipment_6_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет немного более толстую броню. Основное орудие также было увеличено до 115 мм. Первоначально он был заказан Советским Союзом. в попытке улучшить свою огневую мощь, и ОКБ-520 завершило проект примерно в 1960 г. Несмотря на улучшение, производство не было прекращено, поскольку его стоимость была намного выше, чем у Т-55. Более 22 700 Т-62 были выпущены произведен, и он участвовал в большом количестве боев на территории СССР, но участвовал в конфликтах в основном на Ближнем Востоке. Его усовершенствования продемонстрировали немного большую боеспособность в 1969 году в китайско-советском пограничном конфликте."
  
