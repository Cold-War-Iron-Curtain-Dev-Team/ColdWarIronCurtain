  ## Infantry Equipment Afganistan 
  
 AFG_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но. 4 Mk I"
 AFG_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 AFG_infantry_equipment_0_desc: "Ли-Энфилд — магазинная винтовка с продольно-скользящим затвором, которая служила основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. Это была стандартная винтовка британской армии с С 1895 по 1957 г. Винтовка активно использовалась во время Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских сил и сил Содружества.Австралия и Индия сохранили и произвели SMLE Mk III* в качестве стандарта. винтовка во время конфликта, и винтовка оставалась на австралийской военной службе во время войны в Корее, пока ее не заменила L1A1 SLR в конце 1950-х годов."
  
 AFG_infantry_equipment_1: "Автомат Калашникова 1947"
 AFG_infantry_equipment_1_short: "АК-47"
 AFG_infantry_equipment_1_desc: "AK47 — полностью автоматическая штурмовая винтовка, разработанная в Советском Союзе Михаилом Калашниковым в 1947 году, но принятая на вооружение только в 1948 году, когда в производство была отправлена версия с фиксированным прикладом. В начале 1949 года AK47 был принят Советскими Вооруженными Силами для массового развертывания в передовых частях. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому механизму и механизму досылания, а также дальнейшим усовершенствованиям общей конструкции АК47 представлял собой обширную модернизацию по сравнению с АК47. СКС. AK47 на протяжении многих лет считался одним из самых надежных и простых в обслуживании видов оружия в мире."
  
 AFG_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 AFG_infantry_equipment_2_short: "АКМ"
 AFG_infantry_equipment_2_desc: "АКМ — это модернизированный вариант автомата АК47, разработанного Михаилом Калашниковым в конце 1950-х годов и принятого на вооружение Советской Армии в 1959 году. Для модернизации армии. Многие детали были упрощены для массового производства, а ствольная коробка из фрезерованной стали была заменена на У-образную стальную штамповку для повышения производительности. Оружие также стало значительно легче в результате упрощений, уменьшивших его вес на 30%. Кроме того, метал был усилен, чтобы сделать его прочнее, и добавлены направляющие для улучшения движения затворной рамы. АКМ немедленно и повсеместно использовался многими странами и производился для конфликтов на протяжении всего срока его службы."
  
 AFG_infantry_equipment_3: "Автомат Калашникова 1974"
 AFG_infantry_equipment_3_short: "АК-74"
 AFG_infantry_equipment_3_desc: "AK74 — это современный автомат, разработанный Михаилом Калашниковым для замены АКМ в 1974 году. В нем используется меньший патрон и улучшенный хромированный канал ствола с 4 правыми канавками. Мушка и газовый блок были переработаны, установленный под углом 90 градусов от оси канала ствола, чтобы уменьшить сдвиг пули. Кроме того, его разработка сопровождалась различными приспособлениями, включая приклад с резиновой подкладкой. Усовершенствования АК74 позволили солдатам нести большее количество боеприпасов в в поле и поддерживать больший объем огня с более высокой точностью на средних дистанциях. Он дорого использовался во время конфликта в Афганистане, когда ЦРУ заплатило моджахедам большую сумму денег за возвращение захваченного AK74."
  
 AFG_infantry_equipment_4: "Автомат Калашникова 1974 модернизированный"
 AFG_infantry_equipment_4_short: "АК-74М"
 AFG_infantry_equipment_4_desc: "АК-74М — это усовершенствованный вариант АК-74, разработанный в 1991 году заводом "ИЖМАШ". АК-74М был разработан с использованием новых материалов и производственных технологии для создания оружия нового типа. Он отличается облегченным затвором и держателем, который уменьшает отдачу, создаваемую газовым поршнем. Винтовка также включает в себя стеклонаполненный полиамидный приклад, который можно удерживать сбоку, улучшенный дульный срез, усиленный кожух и ряд других мелких улучшений. Также она поставляется с планкой для крепления оптики. Облегченная, усиленная винтовка была легче в обращении и переноске, а также была улучшена поддержка навесного оборудования. Она не была принята на вооружение Советским Союзом, поскольку СССР распался, однако она была принята на вооружение Российской Федерацией."
  
  
  ########## NEW AFG ARMOR 
 AFG_lt_equipment_1: "Т-60"
 AFG_lt_equipment_1_short: "Т-60"
 AFG_lt_equipment_1_desc: "Т60 был легким танком, созданным для замены Т-38 в роли разведчика. Он был разработан в 1941 году Николаем Астровым, и за 2 года его производства было выпущено 6300 экземпляров. Это был танк с двумя членами экипажа. с 6-цилиндровым двигателем и развивает скорость до 44 км/ч с 20-мм пушкой. Он широко использовался во время Второй мировой войны."
 AFG_lt_equipment_2: "Т-70"
 AFG_lt_equipment_2_short: "Т-70"
 AFG_lt_equipment_2_desc: "Легкий танк Т-70 был танком-разведчиком времен Второй мировой войны, созданным для замены ПТ60. Николай Астров начал работу сразу после ПТ60 и закончил в 1942 году. За 2 года его производства было выпущено 8300 экземпляров. 45-мм пушка была намного крупнее, оснащалась двумя двигателями ГАЗ-202 и могла развивать скорость до 45 км/ч. Т-70 также имел улучшенные оптические возможности. Он широко использовался во время Второй мировой войны."
 AFG_lt_equipment_3: "ПТ-76"
 AFG_lt_equipment_3_short: "ПТ-76"
 AFG_lt_equipment_3_desc: "ПТ76 — это советский легкий плавающий танк, который широко экспортировался по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 году, и было произведено около 12 000 единиц. Он требует экипажа из 3 человек и рядного шестицилиндрового двигателя V6. со скоростью 44 км/ч и может плавать со скоростью 10 км/ч. он до сих пор используется во многих странах благодаря своей знаменитой надежности и простоте обслуживания."
 AFG_lt_equipment_4: "ПТ-76Б Модель 4"
 AFG_lt_equipment_4_short: "ПТ-76Б"
 AFG_lt_equipment_4_desc: "ПТ-76, вооруженный 76,2-мм нарезной танковой пушкой Д-56ТС (двойной дульный тормоз, эжектор гильз, дымосос и двухкоординатная система стабилизации СТП-2П "Заря"),[4] ПАЗ ( противоатомная защита) система РХБ защиты, автоматическая система пожаротушения, улучшенный прицел ТШК-2-66, фильтровентиляционная система, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный двигатель В-6Б дизельный двигатель водяного охлаждения мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для чего пришлось несколько изменить форму брони."
 AFG_lt_equipment_5: "БРМ-1К"
 AFG_lt_equipment_5_short: "БРМ-1К"
 AFG_lt_equipment_5_desc: "БРМ-1К — советская разведывательная машина конца холодной войны. Она была разработана для поддержки бронетанковых и механизированных формирований советских войск. БРМ-1К предназначалась для разведки маршрутов и обнаружения вражеских формирований."
  
