 AFG_CAS_equipment_1: "Hawker Hind"
 AFG_CAS_equipment_1_short: "Hind"
  
  #Jet light 
  
 AFG_jet_light_equipment_1: "Яковлев Як-11"
 AFG_jet_light_equipment_1_short: "Як-11"
 AFG_jet_light_equipment_1_desc: "Як-11 поступил на вооружение в 1947 году в качестве стандартного учебно-тренировочного самолета ВВС СССР и ДОСААФ. И Як-11, и С-11 использовались во всех странах Варшавского договора и экспортировались в восемнадцать стран, включая многие страны Африки, Ближнего Востока и Азии."
 AFG_jet_light_equipment_2: "Микоян-Гуревич МиГ-15УТИ"
 AFG_jet_light_equipment_2_short: "МиГ-15УТИ"
 AFG_jet_light_equipment_2_desc: "6 апреля 1949 года коллективу ОКБ-155 официально была поручена разработка учебно-тренировочного варианта истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен заводом №1 в марте- Май 1949 г. Кабина инструктора на УТИ МиГ-15 была размещена за счет уменьшения первого фюзеляжного топливного бака.Обе гермокабины были оборудованы катапультными креслами и пиромеханически-сбрасываемыми фонарями.Специальное оборудование машины состояло из автоматической пушки АСП-1Н. прицел, приемо-передающая радиостанция РСИ-6К, радиокомпас РПКО-10М с маркером РПКО-10М, переговорное устройство СПУ-2М, кислородный прибор КП-14, фотокамера АФА-ИМ.Вооружение состояло из одной 23-мм пушки. пушка НР-23 с боезапасом 80 патронов и один пулемет УБК-Э с боезапасом 150 патронов."
 AFG_jet_light_equipment_3: "Л-29 Дельфин"
 AFG_jet_light_equipment_3_short: "Л-29 Дельфин"
 AFG_jet_light_equipment_3_desc: "Aero L-29 Delfín (англ. Dolphin, по классификации НАТО: Maya) — учебно-тренировочный военный реактивный самолет, разработанный и произведенный чехословацким авиапроизводителем Aero Vodochody. В ходе программы было изготовлено более 3000 L-29. Были произведены тренажеры Delfin. Сообщается, что около 2000 из них были доставлены в Советский Союз, где они использовались в качестве стандартных тренажеров для советских ВВС."
 AFG_jet_light_equipment_4: "Аэро Л-39 Альбатрос"
 AFG_jet_light_equipment_4_short: "Л-39 Альбатрос"
 AFG_jet_light_equipment_4_desc: "Aero L-39 Albatros — это высокопроизводительный учебно-тренировочный реактивный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах в качестве замены Aero L-29 Delfín в качестве основного учебного самолета. Это был первый учебно-тренировочный самолет с турбовентиляторной силовой установкой. Этот тип экспортировался в широкий круг стран как учебно-боевой."
 AFG_jet_light_equipment_5: "Аэро Л-39ЗА Альбатрос"
 AFG_jet_light_equipment_5_short: "Л-39ЗА Альбатрос"
 AFG_jet_light_equipment_5_desc: "Значительно модернизированный Л-39 для учебно-тренировочных и легких штурмовиков, с более прочным шасси, большей грузоподъемностью и, в частности, с 23-миллиметровой двухствольной пушкой ГШ-23Л, закрепленной в конформной гондоле под кабиной пилотов, с магазином на 150 патронов внутри планера."
  
 AFG_recon_equipment_0: "Туполев Ту-2Р"
 AFG_recon_equipment_0_short: "Ту-2Р"
 AFG_recon_equipment_0_desc: "Разведывательный вариант Ту-2."
 AFG_jet_recon_equipment_0: "Микоян-Гуревич МиГ-15Рбис"
 AFG_jet_recon_equipment_0_short: "МиГ-15Рбис"
 AFG_jet_recon_equipment_0_desc: "25 апреля 1950 г. ОКБ МиГ приступило к разработке фронтового разведывательного варианта МиГ-15 с фотокамерой АФА-БА/40, обеспечивающей ширину полосы обзора от 0,9 до 4,5 км при длине маршрута фотосъемки. от 90 до 450 км на высотах от 2000 до 10000м.На самолет устанавливалась только одна пушка НР-23.Для увеличения дальности разведчика впоследствии на балки были установлены замки Д4-50, позволяющие 600-литровые топливные баки улучшенной формы подвешиваться под крылом. Кроме того, на машину был установлен транспондер «Бариум-М» и дополнительный кислородный баллон объемом 2 л."
 AFG_jet_recon_equipment_1: "Микоян-Гуревич МиГ-21Р-13"
 AFG_jet_recon_equipment_1_short: "МиГ-21Р-13"
 AFG_jet_recon_equipment_1_desc: "Первоначально обозначенный как Изделие 03, чтобы сбить с толку посторонних, официальное обозначение типа МиГ-21Р было Изделие 94Р. Первая серийная единица была выпущена в начале 1966 года, и производство продолжалось до 1971 года. нести дневной блок PHOTINT типа D, ночной блок PHOTINT типа N, универсальный блок ELINT типа R или блок типа T с телевизионной системой, что делает МиГ-21Р одним из первых советских самолетов-разведчиков, использующих РТР. оборудование. Небольшие изменения вносились на протяжении всего производственного цикла."
