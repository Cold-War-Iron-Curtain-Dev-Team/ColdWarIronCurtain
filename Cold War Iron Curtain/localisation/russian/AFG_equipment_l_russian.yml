  #Tactical bombers 
  
 AFG_jet_tac_bomber_equipment_2: "Ильюшин Ил-28"
 AFG_jet_tac_bomber_equipment_2_short: "Ил-28"
 AFG_jet_tac_bomber_equipment_2_desc: "Ил-28 был турбореактивным средним бомбардировщиком, разработанным сразу после окончания Второй мировой войны для советских ВВС. во многих крупных конфликтах холодной войны, от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. в этот день. В отчетах ВВС США / Министерства обороны США указано название «Тип 27», а кодовое имя НАТО - «Бигль."
  
