 Castro.1.d: "Кубинское правительство объявило, что попытка убийства президента Фиделя Кастро была сорвана. Правительство заявило, что команда империалистических головорезов и предателей народа пыталась лишить жизни Кастро, но была поймана с поличным. Они добавили, что все кубинцы, пойманные на пособничестве или помощи убийцам, также будут арестованы и преданы суду. Правосудие будет вершиться во имя кубинского народа. Хотя подробности не были представлены, кубинское правительство также заявило, что, по их мнению, заговор был организован агентами американской разведки. Соединенные Штаты не прокомментировали обвинения в причастности к покушению, но заявили, что эти попытки демонстрируют желание кубинцев освободиться от Кастро и его деспотического режима."
 Castro.2.d: "До Кубинской революции американские криминальные боссы владели казино, отелями и другими ценными экономическими активами по всей Кубе. Однако после Кубинской революции Фидель Кастро возглавил кампанию по ограничению доступа иностранцев к кубинским активам, и многие американские криминальные боссы потеряли миллионы. Сегодня эти группировки отомстили, воспользовавшись своими дореволюционными связями, чтобы подсыпать яд, предоставленный Центральным Разведывательным Управлением (ЦРУ), в пищу Кастро. К утру кубинский лидер скончался. Это шокирующее событие было хорошо воспринято в Вашингтоне, но по всей Кубе сотни тысяч людей вышли скорбеть о смерти своего популярного национального героя. Кубинское правительство быстро пообещало возмездие всем, кто был причастен к заговору."
 Castro.3.d: "До Кубинской революции американские криминальные боссы владели казино, отелями и другими ценными экономическими активами по всей Кубе. Однако после Кубинской революции Фидель Кастро возглавил кампанию по ограничению доступа иностранцев к кубинским активам, и многие американские криминальные боссы потеряли миллионы. Сегодня была раскрыта попытка отравить еду кубинского лидера Фиделя Кастро. Сотрудники кубинской службы безопасности быстро схватили группу, доставившую отравленное блюдо Кастро, и объявили, что заговор вынашивала американская мафия. Кубинское правительство добавило, что изощренность яда и организация плана заставили их подозревать мафию в тесном сотрудничестве с американским правительством. До сих пор Соединенные Штаты никак не прокомментировали эти обвинения"
 CIA.7.d: "Операция HTLINGUAL, проверка почтовых отправлений, выходящих и входящих в Соединенные Штаты, которые направляются в коммунистические страны, была одобрена ЦРУ для расширения. Первоначально операция предназначалась только для сбора адресов и имен с внешней стороны подозрительной почты, направляемой в такие страны, как Советский Союз и Китайская Народная Республика. Новое расширение ЦРУ финансировало открытие двух новых центров тщательной проверки в Нью-Йорке и Лос-Анджелесе для обеспечения безопасности американского народа. Хотя ранее ЦРУ было создано для получения разведданных о зарубежных противниках, оно также начало следить за почтой возможных нарушителей спокойствия внутри страны и активистов, таких как Мартин Лютер Кинг и Джон Стейнбек."
 power_pack.2.d: "После того, как боевые действия в гражданской войне за Доминиканскую Республику окончательно утихли, мы наконец-то можем приступить к новым выборам с нашим недавно созданным временным правительством и стремимся провести их в течение следующего года. Несмотря на то, что нашего президента обвиняют в \"дипломатии на пушечном выстреле\", которую проводили его предшественники в 20 веке, когда морские пехотинцы США под малейшим предлогом вторгались и оккупировали ряд стран Латинской Америки. Наши люди на земле, в основном люди из воздушно-десантных подразделений, проводят операции по обеспечению безопасности и оказывают помощь членам обеих фракций, поставляя им продовольствие, воду и медикаменты."
 CIA.1.d: "Недавно был запущен проект МК-Ультра, это программа, целью которой является проведение экспериментов на людях для выявления и разработки препаратов и процедур, которые будут использоваться при допросе с целью ослабления человека и принуждения к признанию/извлечению информации посредством контроля над разумом. Она организована Управлением научной разведки ЦРУ и координируется Лабораториями биологической войны армии США. В рамках МК-Ультра мы изучали средства, использующие химические, биологические и радиологические методы контроля сознания. Некоторые из наших экспериментов включали введение ЛСД психическим больным, заключенным, наркоманам и работникам секс-индустрии. Выбор людей, которые с наименьшей вероятностью расскажут о своем опыте, имеет первостепенное значение."
 CIA.2.d: "ЦРУ подтвердило, что будет проводить операцию «Пересмешник». Операция «Пересмешник», детище директора ЦРУ Аллена Даллеса, подразумевает множество независимых действий по всей территории США для обеспечения достоверности содержания, публикуемого в газетах. ЦРУ будет передавать сообщения, соответствующие американской политике, в руки сотрудничающих журналистов от \"Нью-Йорк Таймс\" до \"Вашингтон Пост\". Наряду с ограничением публикации антиамериканской пропаганды и увеличением количества проамериканской информации в потоке газет, некоторые гражданские агентства, такие как Национальная студенческая ассоциация, будут финансироваться ЦРУ."
 CIA.3.d: "Будучи одним из многочисленных подпроектов МК-Ультра, операция «Полуночный оргазм» является одной из самых странных, которые когда-либо предпринимала наша разведка. Оперативники ЦРУ, участвовавшие в «Полуночном оргазме», нанимали проституток в Сан-Франциско, чтобы заманивать клиентов в бордели. Там агенты тайно накачивали своих жертв наркотиками и наблюдали за их сексуальными действиями из-за двустороннего зеркала. Один из руководителей проекта организовал бордель в Сан-Франциско, он хотел, чтобы это место имело \"вид французского борделя\", сказал он. Надеюсь, что операции, которые они проводят, будут окончательными и принесут много результатов для дальнейшего развития научных данных, которые пытается получить МК-Ультра."
 CIA.4.d: "Проект МК-Наоми - это кодовое название совместной исследовательской программы Центрального разведывательного управления и Министерства обороны, запущенной примерно в то же время, что и МК-Ультра. Она сосредоточена на биологических боевых агентах, в частности, на возможности хранения материалов, которые могут либо обездвижить, либо убить подопытного, и на разработке устройств для распространения таких материалов. Наблюдение, тестирование, модернизация и оценка специальных материалов также осуществлялись МК-Наоми, чтобы гарантировать отсутствие дефектов и нежелательных проблем при реальном использовании. В ходе разработки ЦРУ было поручено оказывать помощь SOC армии США. Одним из таких изобретений было модифицированное огнестрельное оружие, стреляющее специальными дротиками, покрытыми биологическими агентами и различными ядовитыми таблетками. Они были испытаны на сторожевых собаках, позволяя агентам проникать на территорию, которую охраняли собаки, а затем использовались для пробуждения собак при выходе с объекта."
 CIA.5.d: "Родительский проект МК-Офен, проект ЦРУ МК-Ультра был переименован в МК-Сёрч, что указывает на усовершенствованный поиск более совершенной сыворотки правды. Основываясь на некоторых предыдущих исследованиях врачей, участвовавших в работе УСС, а затем ЦРУ, которые изучали эксперименты немецких психиатров с заключенными концентрационных лагерей, проект требовал больше \"расходных материалов\", или испытуемых. Испытания МК-Сёрч будут проводиться на конспиративных квартирах ЦРУ в таких городах, как Вашингтон, Нью-Йорк, Чикаго и Лос-Анджелес. Эксперименты будут направлены на эксплуатацию человеческих слабостей и дестабилизацию человеческой личности. Предполагалось, что в крупных городах найти \"расходные материалы\", которые не будут упущены, будет гораздо проще, чем в небольших городах или сельской местности. Субъекты экспериментов будут подвергаться тестам, направленным на создание нарушений поведения, изменения сексуальных моделей и стимуляцию аберраций, которые могут быть использованы в процессе допросов и получения информации."
 CIA.6.d: "Проект МК-Офен был тайной программой Министерства обороны, разработанной совместно с Центральным разведывательным управлением. Целью партнерской программы МК-Сёрч было \"тестирование поведенческих и токсикологических эффектов определенных препаратов на животных и людях\". Операция ЦРУ \"Часто\", родственная программа, также была инициирована для изучения \"мира черной магии\" и \"использования сил тьмы и оспаривания концепции, что внутренние области разума недосягаемы\". В рамках этой операции сотрудники ЦРУ посещали и вербовали гадалок, гадателей по ладони, ясновидящих, астрологов, медиумов, экстрасенсов и других многочисленных оккультных практиков. МК-Офен занимался \"всем - от спиритических сеансов и колдовства до дистанционного наблюдения и экзотических наркотиков.\""
 CIA.8.d: "Операция CHAOS или MHCHAOS была проектом внутреннего шпионажа Центрального разведывательного управления, направленным на американский народ, он был начат в 1967 году. Задача - выявить возможное иностранное влияние на внутренние расовые, антивоенные и другие протестные движения. Он был запущен под руководством директора Центральной разведки. Когда [USA.GetLeader] был избран в 1968 году, существующие мероприятия по внутреннему наблюдению были объединены в операцию CHAOS. Проект использовал зарубежные отделения ЦРУ для получения информации об антивоенной деятельности американских граждан, выезжающих за границу, применяя такие методы, как физическое наблюдение и электронное подслушивание, используя \"службы связи\" для поддержания такого наблюдения. Позднее операции были расширены, и в них стало участвовать больше людей. В 1969 году, после расширения, операция начала развивать собственную сеть информаторов для проникновения в различные иностранные антивоенные группы, расположенные в зарубежных странах, которые могли иметь связи с американскими группами."
 CIA.9.d: "Проект MERRIMAC был операцией внутреннего шпионажа, которая началась в 1967 году. Координировалась Управлением безопасности ЦРУ. Она включала в себя процедуры сбора информации путем проникновения и наблюдения за вашингтонскими антивоенными группами, которые могли представлять потенциальную угрозу для ЦРУ. Однако тип собираемых данных также включал общую информацию об инфраструктуре целевых сообществ. Проект MERRIMAC и его близнец, проект RESISTANCE, координировались Управлением безопасности ЦРУ. Кроме того, проекты-близнецы были филиалами, которые передавали гражданскую информацию своей материнской программе, Операции CHAOS."
 CIA.10.d: "Проект RESISTANCE был операцией внутреннего шпионажа, координируемой Отделом внутренних операций ЦРУ. Его цель - сбор исходной информации о группах по всей территории США, которые могут представлять угрозу для объектов и персонала ЦРУ. Начиная с 1967 года, многие местные полицейские управления, сотрудники студенческих городков и другие независимые информаторы сотрудничали с ЦРУ, чтобы отслеживать студенческие радикальные группы, выступавшие против внешней политики правительства США в отношении Вьетнама. Проект RESISTANCE и его близнец, проект MERRIMAC, координировались Управлением безопасности ЦРУ. Кроме того, проекты-близнецы были филиалами, которые передавали гражданскую информацию своей материнской программе, Операции CHAOS."
 Operation_Shock.1.d: "После наступления Тет небольшая группа аналитиков ЦРУ во главе с Джорджем Карвером отреагировала на атаку, разработав план, который они назвали Операция «ШОК». Аналитики беспокоились, что генералы в правительстве Южного Вьетнама слишком свыклись с тем, что американские военные помогают им, что привело бы к росту поддержки вьетконговцев. План заключается в том, чтобы вице-президент руководил чисткой всех военных и гражданских чиновников, виновных в коррупции или других злоупотреблениях властью. Команда также упомянула другие решения, чтобы переломить ход войны, если этот план провалится, включая принуждение нынешнего президента уйти в отставку и позволить герою войны прийти к власти, временно прекратить бомбардировки Северного Вьетнама и начать переговоры, чтобы попытаться договориться о капитуляции, или переговоры с Национальным фронтом освобождения для возможного формирования коалиционного правительства."
 Secret_War.1.d: "Деятельность ЦРУ в Лаосе началась еще в 1950-х годах, причем некоторые американские спецназовцы обучали лаосских солдат методам асимметричной войны уже в 1959 году. Сами сотрудники ЦРУ утверждают, что воздушные операции в Лаосе были одними из крупнейших военизированных операций, когда-либо проводимых организацией. В течение многих лет они направляли силы туземцев против северовьетнамских войск, организовывали племена для борьбы с лаосскими коммунистами, даже использовали авиакомпанию Air America для доставки миллионов фунтов продовольствия, перевозки тысяч солдат и проведения разведки. ЦРУ работало с ранними очками ночного видения и самым современным электронным оборудованием. Наши усилия превосходны, использование рабочей силы было отличным, и мы помогли лаосскому народу в борьбе с коммунистической угрозой."
 Diem_Coup.2.d: "Президент Южного Вьетнама Нго Динь Дьем и его брат Нго Динь Нху были жестоко убиты во время военного переворота, начатого офицерами-националистами. Президент Дьем стал первым лидером Южного Вьетнама и имел репутацию одного из ведущих антиколониальных и антикоммунистических активистов Вьетнама. Будучи глубоко верующим католиком, режим Дьема в последние годы боролся с коммунистическими партизанами, действующими в сельской местности, и сопротивлением большинства буддистского населения. После того, как военные путчисты изолировали Дьема от лояльных сил, они напали на его резиденцию, в итоге захватив Дьема и его брата, которые попытались бежать. Несмотря на гарантии генералов и США, что Дьем получит безопасный выезд из страны, во время транспортировки в военный штаб Дьем и его брат были заколоты штыками и застрелены младшим офицером. Многие в новой правящей хунте осудили этот поступок, но до сих пор неизвестно, было ли убийство случайным или заказанным хунтой для консолидации власти."
 Reagan.103.d: "Президент [USA.GetLeader] давно выступает против законов о гражданских правах, но настаивает, что он не сегрегационист. Он просто поддерживает важность прав штатов. Однако он особенно возражает против некоторых положений эпохального Закона о гражданских правах и поручил высокопоставленным чиновникам изучить возможности внесения поправок в законопроект, чтобы отменить ограничения для штатов. Однако противники говорят, что эти поправки устранят защиту меньшинств, и ожидается сильная оппозиция Конгресса любым изменениям. Также ожидается, что президент не будет использовать исполнительную власть для содействия исполнению закона, что, по мнению многих, может подорвать его влияние на меньшинства."
 Goldwater.1.d: "Президент [USA.GetLeader] объявил, что федеральное правительство будет уважать права штатов и больше не будет навязывать федеральную повестку дня отдельным штатам. Президент [USA.GetLeader] подчеркнул, что федеральные требования и судебные постановления должны быть выполнены, но заявил, что штатам должно быть позволено выполнять их на своих собственных условиях, чтобы обеспечить стабильную и дружественную атмосферу по всей стране. Это заявление было встречено с осуждением, особенно со стороны активистов и групп по защите гражданских прав, которые утверждают, что если не заставлять штаты подчиняться федеральным директивам, то они увековечат свои системы несправедливости и избегут необходимых радикальных изменений."
 USAUrban.1.d: "После серии бурных протестов и беспорядков в американских городских центрах, президент [USA.GetLeader] объявил, что мир вернулся во все американские города. Он отметил усилия правоохранительных органов, а также чиновников штатов и федеральных властей в борьбе с беспорядками. На вопрос, будет ли он поручать расследование недавних беспорядков, президент заявил, что этот вопрос будет рассмотрен. Хотя беспорядки прекратились, противники президента считают, что они просто утихли или были насильственно подавлены усилиями правительства. Ожидается, что подразделения национальной гвардии, вызванные или приведенные в боевую готовность по всей стране, будут распущены."
 Bussing.1.d: "Президент [USA.GetLeader] дал указание членам кабинета министров и высокопоставленным чиновникам направить федеральных чиновников на отмену давления и выделения средств штатам на реализацию программ автобусной десегрегации. Программы автобусных перевозок размещают и перемещают учащихся в разные школы, чтобы бороться с сегрегацией и положить конец неравенству между школами по расовому признаку. Президент [USA.GetLeader] заявил, что хотя он не возражает против автобусных программ, он хотел бы уважать права штатов и местных родителей. Он заявил, что федеральное правительство не имеет права вмешиваться в политику штатов и местных органов власти в области образования."
 Goldwater.201.d: "По всей стране сегодня утром сотрудники ФБР и местных правоохранительных органов провели обыски в партийных офисах, связанных с видными организациями черных националистов. Президент [USA.GetLeader] выступил перед СМИ во второй половине дня, чтобы объявить, что он направляет федеральные агентства для подавления воинствующего черного национализма. Президент заявил, что эти организации занимаются боевыми действиями, подготовкой оружия и незаконной деятельностью, включая организованную преступность. Он заявил, что правительство опасается, что такие группы могут вскоре приступить к открытому насилию против негров и правительства. Он заявил, что утренние рейды - это только начало, и в ближайшие месяцы кампания усилится."
 Goldwater.202.d: "Президент [USA.GetLeader] заявил, что его правительство издаст указ о сохранении принципа прав штатов. Новый указ гарантирует штатам их права и запрещает федеральному правительству использовать силу, запугивание или финансовое давление для принуждения штатов к выполнению директив. Это объявление было тепло встречено южанами, выступающими против недавних федеральных судебных решений, касающихся сегрегации, но в студенческих городках по всей стране вспыхнули протесты. Кроме того, несколько видных членов конгресса заявили, что президент оскверняет жертвы Гражданской войны, принесенные солдатами и гражданами Союза."
 Goldwater.200.d: "Американцы, смотревшие вчера вечером новости, были ошеломлены, увидев, как полиция и национальные гвардейцы жестоко разгоняют антивоенные протесты, проводимые в нескольких крупных университетских городках. Это произошло после того, как президент [USA.GetLeader] ранее заявил, что антивоенные протесты подрывают Соединенные Штаты и помогают их врагам за рубежом. Он назвал угрозу огромной и заявил, что правительство начнет пресекать деятельность подобных организаций. В дополнение к насильственному разгону демонстраций, ФБР провело обыски в известных антивоенных организациях, изъяв тысячи документов. Представитель ФБР заявил, что они рассчитывают привлечь к ответственности многих антивоенных лидеров за иностранные связи и насильственные коммунистические симпатии."
 Klan.1.d: "Недавнее возрождение печально известного Ку-Клукс-Клана и несколько громких случаев насилия в отношении афроамериканцев подтолкнули президента [USA.GetLeader] объявить, что генеральный прокурор вскоре объявит обвинения против лидеров Клана, причастных к насилию. Президент заявил, что насилию Клана нет места в современной Америке, и объявил, что правительство не прекратит преследование этой группировки, пока она не прекратит насилие против американских граждан. Многие общины меньшинств по всей стране будут рады этой новости, хотя реакция Клана неизвестна, так как он имеет децентрализованную структуру."
 ERA.1.d: "Кампания за принятие Поправки о Равных Правах (ПРП) была впервые представлена в 1923 году. Цель поправки - положить конец любой юридической дискриминации между полами. Меняющаяся социальная и культурная жизнь возродила усилия по принятию ПРП. Тысячи женщин участвовали в акциях протеста или подписывали петиции, призывающие Конгресс окончательно утвердить ПРП. Женщины по-прежнему сталкиваются с юридическими препятствиями в делах, связанных с разводом и другими важными вопросами. За возрождением ПРП стоят женщины из колледжей и среднего класса, но женщины из рабочего класса выступают против ПРП, опасаясь, что законопроект положит конец законам о защите труда, принятым для сохранения прав женщин на рабочем месте."
 JFK_Mafia.1.d: "Президент [USA.GetLeader], работая в тесном контакте с генеральным прокурором, дал указание Министерству юстиции, ФБР и налоговой службе начать расследования и тесно сотрудничать в делах, направленных против организованной преступности в США. Президент отметил, что организованная преступность процветала благодаря тому, что федеральные правоохранительные органы сосредоточились на более явных преступлениях. Хотя расследования могут занять много лет, президент [USA.GetLeader] надеется, что такие города, как Лас-Вегас и Ньюпорт Кентукки, будут избавлены от организованных преступных элементов. Однако эта новая инициатива, несомненно, разозлит влиятельные криминальные семьи, и правительство опасается возмездия."
 LBJ_Civil.1.d: "После принятия президентом [USA.GetLeader] Закона о гражданских правах возникли вопросы о том, как обеспечить соблюдение нового закона. Многие южные общины, включая чиновников штатов, сопротивлялись выполнению закона. Для борьбы с этим президент решил ввести судебные запреты, федеральные судебные преследования и направил чиновников в проблемные места, чтобы добиться соблюдения закона. Президент также рассматривает возможность подписания исполнительных приказов, чтобы уполномочить федеральные агентства обеспечить выполнение Закона о гражданских правах. Однако такой подход вызвал отторжение у некоторых членов Конгресса, которые опасаются, что чрезмерное вмешательство федеральных властей может ободрить противников гражданских прав."
 Nixon.1960.d: "Диксикраты возникли как сегрегационистская, раскольническая фракция в Демократической партии, которая прекратила свое несогласие в 1948 году. Однако они остались недовольны ситуацией с гражданскими правами, и недавние президентские выборы показали, что южные демократы, возможно, меняют свою верность. Несколько традиционно демократических южных штатов перешли на сторону республиканского кандидата. Эти результаты разгневали лидеров Демократической партии, которые обвинили влияние диксикратов и южных демократов, сосредоточенных на сегрегации, в том, что они повернули юг в сторону республиканцев. Смогут ли демократы преодолеть этот раскол, неизвестно, но ожидается, что республиканцы попытаются подтолкнуть южных демократов присоединиться к ним."
 Nixon_native.1.d: "Президент [USA.GetLeader] изложил свое видение отношений между Соединенными Штатами и многочисленными общинами коренных американцев в стране. Он объявил, что старая политика прекращения или принудительной ассимиляции будет прекращена в пользу самоопределения. Президент подчеркнул, что коренные американцы должны сами делать свой выбор и принимать решения. Бюро по делам индейцев будет направлять федеральные средства признанным племенам, чтобы они распределяли их на своих условиях. Хотя многие племена приветствовали эти усилия, коренные американцы, не имеющие резерваций, живущие в городах, выразили обеспокоенность тем, что они будут лишены доступа к таким ресурсам или окажутся во власти старейшин."
 Rockefeller.1.d: "Президент [USA.GetLeader] давно обсуждал свою озабоченность по поводу расходов правительства на социальное обеспечение. Президент считал, что неконтролируемое социальное обеспечение нанесет ущерб развитию и социальному характеру страны. После вступления в должность президент [USA.GetLeader] встретился с членами кабинета министров и руководством Конгресса, чтобы разработать стратегию контроля расходов на социальное обеспечение и ввести несколько программ, в том числе программу, в рамках которой получатели социального обеспечения, способные работать, будут включены в программы профессиональной подготовки. Сегодня президент объявил, что его усилия принесли плоды, и расходы на социальное обеспечение, которые раньше считались неконтролируемыми, стабилизировались."
 Rockefeller.2.d: "На публичной церемонии президент [USA.GetLeader] официально представил свою новую инициативу в области искусства. Будучи сам заядлым коллекционером и меценатом, президент с гордостью заявил, что его новая художественная инициатива позволит лучшим художникам США не только получить жизненно важное финансирование для проектов, но и быть показанными. Он подчеркнул, что необходимо поддерживать американские таланты во всех областях, а его инициатива поможет продемонстрировать американское творчество и приведет к более тесному сотрудничеству между Соединенными Штатами и остальным миром. Хотя инициатива получила высокую оценку в прессе, недоброжелатели назвали ее тщеславным проектом президента."
 Desegregation.1.d: "После решения Верховного суда, объявившего сегрегацию неконституционной, военный ветеран Джеймс Мередит попытался зарегистрироваться в качестве студента в Университете Миссисипи (также называемом Оле Мисс). Мередит встретил враждебно настроенных протестующих, а губернатор отказался защищать или поддерживать десегрегацию университета. В ответ президент [USA.GetLeader] сегодня приказал маршалам Соединенных Штатов и армии Соединенных Штатов обеспечить десегрегацию и направить их в университетский городок. Ожидается, что Мередит зарегистрируется под защитой маршалов и войск, но тысячи протестующих против десегрегации собираются, многие опасаются, что может произойти насилие между федеральными войсками и разъяренными протестующими."
 Desegratation.2.d: "Сегодня в Белом доме президент [USA.GetLeader] подписал исполнительный приказ 11063. Указ \"...запрещает дискриминацию при продаже, аренде, сдаче в аренду или другом распоряжении имуществом и объектами, принадлежащими или управляемыми федеральным правительством на федеральные средства.\" Сегрегация теперь запрещена во всех жилых помещениях, финансируемых из федерального бюджета, и это стало большой победой в движении за гражданские права. Более того, многие надеются, что это постановление положит конец длившейся десятилетиями практике, когда черные общины хронически недополучали федеральные средства, особенно в общинах с острой потребностью в таком жилье."
 Wallace.5.d: "Война с наркотиками - это кампания, проводимая правительством США и возглавляемая президентом [USA.GetLeader] в отношении запрета на наркотики, военной помощи и военного вмешательства с целью сокращения незаконной торговли наркотиками в США. Этот план включает в себя комплекс мер по борьбе с наркотиками, направленных на противодействие производству, распространению и потреблению психоактивных веществ, которые правительства стран-участниц и Организация Объединенных Наций признали незаконными. Некоторые методы, применяемые в борьбе с наркотиками, включают резкое ужесточение наказаний за все, что с ними связано: владение, продажа, употребление, производство - назовите это, и вас посадят. По мнению некоторых неправительственных организаций, война с наркотиками вызывает резкий рост числа арестов, которые в силу различных факторов в непропорционально большой степени затрагивают афроамериканцев. Некоторые утверждают, что война с наркотиками используется для криминализации и разрушения сообществ чернокожих и хиппи и их лидеров. Вы всегда должны помнить, что наркотики - враг общества номер один!"
 US_60s_The_CIA: "ЦРУ"
 US_60s_The_CIA_desc: "Центральное Разведывательное Управление занимает центральное место в нашей борьбе против Советского Союза и его коммунистических марионеток. Наши шпионы говорят, что они проводят ряд операций по всему миру, чтобы склонить чашу весов в нашу пользу. Может быть, нам стоит переименовать их в (Анти)Коммунистическое агентство по вмешательству?"
 USA_60s_Domestic_Affairs: "Внутренние Дела"
 USA_60s_Domestic_Affairs_desc: "В то время как нам все еще необходимо поддерживать наше видение демократического мирового порядка, мы не можем игнорировать проблемы, которые есть у нас дома. Если мы проиграем на внутреннем фронте, как мы можем иметь шанс на успех за рубежом?"
 USA_60s_Latin_America_Desk: "Латиноамериканский Отдел"
 USA_60s_Latin_America_Desk_desc: "Наши соседи на юге в настоящее время являются очагом коммунистических подстрекателей и пропаганды. Многие страны, и прежде всего Куба, находящаяся в непосредственной близости от наших берегов, уже пали. Мы должны действовать быстро."
 USA_60s_Launch_the_Bay_of_Pigs: "Начать «Залив Свиней»"
 USA_60s_Launch_the_Bay_of_Pigs_desc: "Наши лучшие шпионы на Кубе разработали дерзкий план свержения Фиделя Кастро. Используя подготовленных ЦРУ кубинских изгнанников, чтобы скрыть наше участие, наши силы высадятся на пляже в юго-западной части Кубы и силой захватят островное государство."
 USA_Attempt_to_Assasinate_Castro: "Попытка Убийства Кастро"
 USA_Attempt_to_Assasinate_Castro_desc: "После фиаско в заливе Свиней у нас закончились возможности избавиться от коммунистической диктатуры на Кубе. Наш следующий лучший вариант - организовать покушение на жизнь Фиделя Кастро и убрать человека, на котором держится весь режим."
 USA_Operation_Northwoods: "Операция «Нортвудс»"
 USA_Operation_Northwoods_desc: "Операция «Нортвудс» - это предполагаемая операция под ложным флагом для оправдания вторжения на Кубу. Если будет получено разрешение, переодетые оперативники ЦРУ проведут настоящие террористические акты по всей территории США в попытке спровоцировать возмущение против Кубы."
 USA_Deal_with_the_Underworld: "Сделка с Преступным Миром"
 USA_Deal_with_the_Underworld_desc: "Хотя иметь дело с недовольными криминальными боссами и бандами неприятно, так же как и заниматься заговорами с целью убийства. Устроить так, чтобы они отравили еду Фиделя Кастро - это один из лучших шансов устранить коммунистическую угрозу с наших берегов."
 USA_Re_Establish_Mafia_in_Cuba: "Восстановить Мафию на Кубе"
 USA_Re_Establish_Mafia_in_Cuba_desc: "Теперь, когда наши кубинские изгнанники победили коммунистические силы, пришло время восстановить старый порядок, существовавший до прихода Кастро к власти. Частью этого порядка являются мафиозные банды, которые, несмотря на очевидную преступность, будут жизненно важны для поддержания порядка."
 USA_60s_Cuban_Deathsquads: "Кубинские Смертники"
 USA_60s_Cuban_Deathsquads_desc: "Несмотря на падение Кастро, многие кубинцы протестуют и бунтуют против вновь обретенной свободы! Это не может продолжаться. Формирование \"эскадронов смерти\" для защиты наших интересов необходимо, чтобы навсегда уничтожить кубинский коммунизм."
 USA_60s_Depose_Juan_Velasco: "Сместить Хуана Веласко Альварадо"
 USA_60s_Depose_Juan_Velasco_desc: "Хуан Веласко Альварадо, лидер Перу, является тираническим деспотом и должен быть устранен. Наши агенты уже на месте и ждут зеленого света."
 USA_60s_Establish_Ecuadorian_Junta: "Установить Эквадорскую Хунту"
 USA_60s_Establish_Ecuadorian_Junta_desc: "Хотя Эквадор еще не стал коммунистическим, пришло время создать новый режим. Хотя истинная демократия предпочтительнее, сильная военная хунта необходима для поддержания стабильности и статус-кво."
 USA_60s_Operation_POWER_PACK: "Операция POWER PACK"
 USA_60s_Operation_POWER_PACK_desc: "Доминиканская Республика погрузилась в хаос, и еще один коммунистический режим готов подняться на Карибах. Этого не должно случиться. Отправив наши собственные войска на помощь демократическим силам, мы можем предотвратить появление еще одной Кубы."
 USA_60s_Crush_The_Dominican_Rebellion: "Подавить восстание доминиканцев"
 USA_60s_Crush_The_Dominican_Rebellion_desc: "Когда наши войска благополучно добрались до берега и дали отпор коммунистическим повстанцам, пришло время положить конец безумию. Раздавите красных и не проявляйте милосердия!"
 USA_60s_Launch_Coup_in_Bolivia: "Устроить Переворот в Боливии"
 USA_60s_Launch_Coup_in_Bolivia_desc: "Боливийское правительство демонстрирует слишком много левых тенденций, чтобы нам понравиться. Мы должны сменить его, пока оно не показало свои истинные цвета и не присоединилось к Советам."
 USA_60s_Assasinate_Rafael_Trujillo: "Убить Рафаэля Трухильо"
 USA_60s_Assasinate_Rafael_Trujillo_desc: "Сильный лидер Доминиканской Республики с 1930-х годов, Трухильо возглавил новое царствование террора в Карибском бассейне. Он должен уйти, даже если он не коммунист."
 USA_60s_Train_Brazilian_Deathsquads: "Обучение бразильских отрядов смерти"
 USA_60s_Train_Brazilian_Deathsquads_desc: "Чтобы подавить коммунистических подстрекателей в Бразилии, мы должны организовать и поддерживать правые \"эскадроны смерти\", чтобы заставить их замолчать."
 USA_60s_Train_Uruguayan_Death_Squads: "Обучать Уругвайские Эскадроны Смерти"
 USA_60s_Train_Uruguayan_Death_Squads_desc: "Чтобы подавить коммунистических подстрекателей в Уругвае, мы должны организовать и поддерживать правые эскадроны смерти, чтобы заставить их замолчать."
 USA_60s_Project_MKUltra: "Проект МК-Ультра"
 USA_60s_Project_MKUltra_desc: "Операция МК-Ультра - это предлагаемая серия экспериментов на людях для проверки успешности различных препаратов, предназначенных для контроля сознания. Хотя это немного бесчеловечно, результаты помогут нам в борьбе с красной угрозой."
 USA_60s_Operation_Mockingbird: "Операция «Пересмешник»"
 USA_60s_Operation_Mockingbird_desc: "Нам нужно, чтобы население планеты, или, по крайней мере, наше собственное, горячо поверило в праведность нашего дела. Чтобы обеспечить это, мы должны начать распространять истории и пропаганду во всех средствах массовой информации по всему миру."
 USA_60s_Operation_MIDNIGHT_CLIMAX: "Операция «ПОЛУНОЧНЫЙ ОРГАЗМ»"
 USA_60s_Operation_MIDNIGHT_CLIMAX_desc: "Продолжение MK-Ultra, \"Полуночный климакс\" будет включать нанятых ЦРУ проституток, заманивающих своих клиентов на конспиративные квартиры ЦРУ. Там мы будем вводить клиентам ЛСД, чтобы записать, как он на них действует. Не беспокойтесь об этике всего этого, это все для общего блага. Ты что, коммунист?"
 USA_60s_Project_MKNAOMI: "Проект МК-Наоми"
 USA_60s_Project_MKNAOMI_desc: "МК-Наоми - еще одно ответвление МК-Ультра. Вместо того, чтобы сосредоточиться на препаратах контроля сознания, Наоми нацелен на биологические и химические соединения, предназначенные для мгновенного убийства или обездвиживания, а также на устройства для их распространения."
 USA_60s_Project_MKSEARCH: "Проект МК-Сёрч"
 USA_60s_Project_MKSEARCH_desc: "Проект МК-Сёрч - это отделение Ультра, сосредоточившееся на сыворотке правды. К сожалению (ну, не для нас), для экспериментов потребуются расходные материалы. То, что мы делаем ради свободы..."
 USA_60s_Project_MKOFTEN: "Проект МК-Офен"
 USA_60s_Project_MKOFTEN_desc: "Проект МК-Офен - еще один проект по исследованию наркотиков, на этот раз направленный на изучение поведенческих и токсикологических эффектов наркотиков на людей и животных. Кроме того, шпион доктор Сидни Готлиб хочет использовать Офен как прикрытие для изучения темной магии и оккультизма. Страшно и странно, но эй, если это победит красных, кого это волнует?"
 USA_60s_Expand_HTLINGUAL: "Расширить HTLINGUAL"
 USA_60s_Expand_HTLINGUAL_desc: "HTLINGUAL - это операция, направленная на перехват американской почты, направляющейся в СССР и КНР. Надеюсь, это поможет нам в наших попытках искоренить коммунизм в Соединенных Штатах."
 USA_60s_Operation_MCHAOS: "Операция MCHAOS"
 USA_60s_Operation_MCHAOS_desc: "Операция MCHAOS - это проект внутреннего шпионажа, направленный на выявление иностранного влияния на недавние расовые и антивоенные протестные движения. Мы знаем, что СССР подстрекает эти беспорядки, и если мы поймаем их агентов, движения погибнут."
 USA_60s_Operation_MERRIMAC: "Операция MERRIMAC"
 USA_60s_Operation_MERRIMAC_desc: "За последние несколько месяцев в Вашингтоне появилось множество антивоенных групп. MERRIMAC будет собирать информацию о тех из них, которые, как считается, представляют угрозу для внутренних институтов и стабильности."
 USA_60s_Operation_RESISTANCE: "Операция RESISTANCE"
 USA_60s_Operation_RESISTANCE_desc: "RESISTANCE - это сестринский проект MERRIMAC, направленный на организации студенческих городков, особенно радикальные студенческие группы, которые выступают против нашей политики во Вьетнаме. Это поможет нам следить за людьми, которые могут присоединиться к коммунистическому движению."
 USA_60s_Undermine_the_Anti_War_Movement: "Подрыв Антивоенного Движения"
 USA_60s_Undermine_the_Anti_War_Movement_desc: "Антивоенное движение было шипом в нашей стороне, снижая нашу способность сражаться во Вьетнаме, снижая наше внутреннее одобрение и стабильность, и нанося ущерб нашему глобальному престижу. Мы должны подорвать его, пока оно не стало еще хуже"
 USA_60s_African_and_European_Desks: "Африканский и Европейский Отделы"
 USA_60s_African_and_European_Desks_desc: "Несмотря на нестабильность Южной и Центральной Америки, европейский и африканский театры не менее, если не более, важны в нашей борьбе за мировое господство против Советов, и их нельзя игнорировать."
 USA_60s_Support_the_Greek_Junta: "Поддержать Греческую Хунту"
 USA_60s_Support_the_Greek_Junta_desc: "Со времен гражданской войны в Греции в 1949 году военная хунта, управляющая страной, с трудом удерживает все вместе. Мы должны послать им помощь, пока Греция снова не впала в войну"
 USA_60s_Provide_Intel_to_Greek_Junta: "Предоставить информацию греческой хунте"
 USA_60s_Provide_Intel_to_Greek_Junta_desc: "Предоставляя грекам разведданные о коммунистических группах, сторонниках и сочувствующих в их стране, мы сможем еще больше стабилизировать их страну."
 USA_60s_Covert_Rhodesian_Aid: "Тайная Помощь Родезии"
 USA_60s_Covert_Rhodesian_Aid_desc: "Хотя официально мы решительно выступаем против родезийцев и их расистской политики, мы будем посылать им скрытую военную и экономическую помощь. В конце концов, они не красные, так что насколько плохо все может быть на самом деле?"
 USA_60s_Covert_South_African_Aid: "Тайная Помощь Южной Африке"
 USA_60s_Covert_South_African_Aid_desc: "С точки зрения гражданских прав, правительство апартеида в Южной Африке ужасно. Но, эй, у всех нас есть свои недостатки, верно? У нас все равно есть своя проблема гражданских прав, и, кроме того, лучше они, чем коммунисты."
 USA_60s_Aid_the_FNLA: "Помощь НФСА"
 USA_60s_Aid_the_FNLA_desc: "НФСА, или Национальный Фронт Освобождения Анголы, борется за свою независимость в анголо-португальской войне. Оказывая им помощь сейчас, мы можем добиться их благодарности и включить их в сферу нашего влияния."
 USA_60s_Aid_Mobutu: "Помощь Мобуту"
 USA_60s_Aid_Mobutu_desc: "Мобуту Сесе Секо, президент Демократической Республики Конго, остро нуждается в нашей военной помощи, и мы дадим ему все необходимое для выживания его режима."
 USA_60s_Asian_Desk: "Азиатский Отдел"
 USA_60s_Asian_Desk_desc: "Азия - это место нашего самого крупного участия в конфликтах холодной войны, сначала в Корее, а теперь во Вьетнаме. Мы должны продолжать наши усилия, чтобы убедиться, что большая часть Дальнего Востока, а также остальная часть континента не попадет под красный сапог. "
 USA_60s_The_Secret_War: "Тайная Война"
 USA_60s_The_Secret_War_desc: "Хотя все знают о войне во Вьетнаме, существует другой, не менее жестокий конфликт, происходящий прямо по соседству в Лаосе. Там были проведены крупные воздушные операции, обеспечивающие наземную поддержку и снабжение, а также многочисленные операции спецназа, чтобы помочь антикоммунистическим бойцам в этом районе."
 USA_60s_Operation_PINCUSHION: "Операция «Подушечка-Подушечка»"
 USA_60s_Operation_PINCUSHION_desc: "Операция «Подушечка-Подушечка» - это тайная попытка завербовать лаосские горные племена и сформировать их в регулярные боевые силы, способные защитить себя от коммунистической угрозы на тропе Хо Ши Мина."
 USA_60s_Operation_MOMENTUM: "Операция «Моментум»"
 USA_60s_Operation_MOMENTUM_desc: "Программа подготовки лаосских партизан, «Моментум» будет действовать на северо-востоке страны и проводиться подразделением воздушного усиления тайской полиции. Американская сторона планирования будет осуществляться Джеймсом Уильямом Лэйром, оперативником, который уже глубоко проник на территорию Лаоса."
 USA_60s_Arm_the_Royalists: "Вооружение Роялистов"
 USA_60s_Arm_the_Royalists_desc: "Роялисты отчаянно нуждаются в нашей военной помощи, как в виде советников, так и в виде поставок. Поскольку мы не можем позволить себе еще одну коммунистическую страну в Юго-Восточной Азии, они получат то, что хотят."
 USA_60s_Air_America_Drug_Smuggling: "Контрабанда Наркотиков Air America"
 USA_60s_Air_America_Drug_Smuggling_desc: "Чтобы помочь разрушающейся экономике Лаоса, мы будем использовать пассажирские самолеты Air America для контрабанды наркотиков в страну."
 USA_60s_Aid_Royalist_Drug_Smuggling: "Помощь Роялистской Контрабанде Наркотиков"
 USA_60s_Aid_Royalist_Drug_Smuggling_desc: "В дополнение к наркобизнесу Air America, мы также будем поддерживать местную лаосскую контрабанду наркотиков, чтобы поддержать их экономику."
 USA_60s_Launch_Indonesian_Coup: "Устроить Индонезийский Переворот"
 USA_60s_Launch_Indonesian_Coup_desc: "К сожалению, несколько лет назад Голландская Ост-Индия перешла под власть Сукарно и его коммунистических сторонников. Нам пришлось выжидать, но наши оперативники говорят нам, что сейчас самое время нанести удар и свергнуть режим."
 USA_60s_Provide_Hit_List_to_Indonesia: "Предоставить Хит-Лист Индонезии"
 USA_60s_Provide_Hit_List_to_Indonesia_desc: "Хотя страна больше не является коммунистической по названию, в Индонезии все еще много сторонников старого правительства. Предоставляя военным хит-листы, мы можем быстро это изменить."
 USA_60s_Aid_SAVAK: "Помощь САВАК"
 USA_60s_Aid_SAVAK_desc: "САВАК, начинающая разведывательная служба шаха, изо всех сил пытается найти и задержать тех, кто стремится свергнуть правительство. Мы должны помочь ей, чтобы сохранить наши интересы на Ближнем Востоке."
 USA_60s_Support_Lon_Nol: "Поддержать Лон Нола"
 USA_60s_Support_Lon_Nol_desc: "Лон Нол, более правый камбоджийский генерал, изо всех сил пытается сдержать красных кхмеров и нуждается в нашей немедленной помощи. Мы должны действовать быстро, пока он не был побежден."
 USA_60s_Arm_the_Republic_of_Cambodia: "Вооружить Республику Камбоджа"
 USA_60s_Arm_the_Republic_of_Cambodia_desc: "Теперь, когда мы остановили кровотечение в Камбодже, необходимо общее перевооружение их сил."
 USA_60s_Covert_Aid_to_Thailand: "Тайная Помощь Таиланду"
 USA_60s_Covert_Aid_to_Thailand_desc: "Таиланд нуждается в нашей поддержке для поддержания своей экономики и армии, и хотя мы не можем быть замечены в оказании им помощи, мы предоставим секретное оружие и средства."
 USA_60s_Vietnam_Desk: "Вьетнамский Отдел"
 USA_60s_Vietnam_Desk_desc: "Вьетнам. Что еще нужно сказать о нем? Это всепоглощающий беспорядок, в который мы ввязались, как нам кажется, много лет назад. Нам нужно собраться с силами, разгромить Вьетконг и Хо Ши Мина, и убраться оттуда, пока ситуация не стала действительно ухудшаться."
 USA_60s_Assasinate_Diem: "Убить Дьема"
 USA_60s_Assasinate_Diem_desc: "Нго Динь Дьем, к сожалению, не справился со своей задачей по сохранению стабильности и защите Южного Вьетнама от коммунистических сил. Армия АРВН жаждет получить шанс свергнуть его режим, и мы не будем вмешиваться. До свидания, Дьем."
 USA_60s_Preserve_the_Diem_Regime: "Сохранить Режим Дьема"
 USA_60s_Preserve_the_Diem_Regime_desc: "Несмотря на все свои недостатки, Дьем сделал все возможное, чтобы сохранить государство Вьетнам в эти жестокие и бурные годы. Мы должны держать его рядом, потому что на данный момент, кто еще более способен и опытен на этой должности, чем он?"
 USA_60s_Civilian_Irregular_Defense_Group_Program: "Программа Гражданской Группы Иррегулярной Обороны"
 USA_60s_Civilian_Irregular_Defense_Group_Program_desc: "ПГГИО - это программа, разработанная для набора и ввода в строй нерегулярных подразделений, состоящих из представителей меньшинств в Южном Вьетнаме. Это позволит увеличить потенциал АРВН для наступления, а также уберечь эти меньшинства от вьетконговцев."
 USA_60s_Operation_VULCAN: "Операция «Вулкан»"
 USA_60s_Operation_VULCAN_desc: "Северовьетнамцы развивают военно-морской флот, и хотя он не может сравниться с нашим, он будет досаждать, если его не контролировать. У нас есть команда водолазов с бомбами, которые ждут сигнала, чтобы начать свою диверсионную миссию."
 USA_60s_Bribe_the_An_Quang_Buddhists: "Подкупить Буддистов Ан Куанга"
 USA_60s_Bribe_the_An_Quang_Buddhists_desc: "Буддисты Ань Куанга - религиозная группа, готовая сотрудничать с южновьетнамцами и АРВН за определенную плату. Однако АРВН нужны люди и опыт, поэтому взятка будет отправлена. "
 USA_60s_Launch_the_PHOENIX_Program: "Запустить Программу «Феникс»"
 USA_60s_Launch_the_PHOENIX_Program_desc: "Программа «Феникс» направлена на уничтожение Вьетконга и его сторонников путем проникновения, борьбы с терроризмом, пыток и допросов. В ее рамках специализированные разведывательные подразделения будут убивать или захватывать подозреваемых вьетконговцев и доставлять их в центры содержания под стражей."
 USA_60s_Operation_SHOCK: "Операция «ШОК»"
 USA_60s_Operation_SHOCK_desc: "В ответ на Тетское наступление группа аналитиков ЦРУ под руководством Джорджа Карвера разработала Операцию «ШОК», направленную на очищение АРВН от коррумпированных офицеров, а в случае неудачи - на временное прекращение бомбардировок и переговоры об условиях капитуляции с Севером или на создание коалиционного правительства с НОФ."
 USA_60s_Operation_Wandering_Soul: "Операция «Блуждающая душа»"
 USA_60s_Operation_Wandering_Soul_desc: "Операция «Блуждающая душа» основана на вьетнамской вере в одноименную концепцию, в которой неправильно похороненная душа будет бродить по сельской местности, бесцельно стоная. Пытаясь напугать вьетконговцев, мы установили на нашей территории динамики, которые воспроизводят жуткие звуки и голоса, имитируя «Блуждающие души»."
 USA_60s_Expand_the_PHOENIX_Program: "Расширить программу «Феникс»"
 USA_60s_Expand_the_PHOENIX_Program_desc: "Несмотря на все наши усилия, программа «Феникс» недостаточно велика, и тысячи сторонников и бойцов коммунизма все еще на свободе. Мы должны удвоить наши усилия, чтобы остановить их."
 USA_60s_End_the_PHOENIX_Program: "Завершить программу «Феникс»"
 USA_60s_End_the_PHOENIX_Program_desc: "Несмотря на ограниченный успех, программа «Феникс» бесчеловечна и чаще всего приводит к смерти невинного гражданского лица, а не вьетконговского солдата. Этому нужно положить конец немедленно"
 USA_60s_Bomb_the_Pathet_Lao: "Бомбить Патет Лао"
 USA_60s_Bomb_the_Pathet_Lao_desc: "Наконец, после перевооружения роялистов и подготовки специальных подразделений, мы проведем одну из крупнейших в мире бомбардировок, когда-либо запланированных, и уничтожим \"красных кхмеров\" с неба. У них не будет ни единого шанса против всей мощи современной сверхдержавы. "
 USA_60s_Continue_Funding_the_LDP: "Продолжить Финансирование ДПВ"
 USA_60s_Continue_Funding_the_LDP_desc: "ДПВ является одним из единственных некоммунистических (или не вовлеченных в какой-либо конфликт) режимов в Юго-Восточной Азии, и заслуживает нашей дальнейшей поддержки, несмотря на некоторые предыдущие недемократические политики."
 USA_60s_State_Department: "Государственный Департамент"
 USA_60s_State_Department_desc: "Государственный Департамент - это та рука правительства и страны, которую видит, слышит и на которую реагирует мир. Он будет играть огромную роль в предстоящие десятилетия, когда мы будем пытаться удержаться на вершине мирового порядка."
 USA_60s_Rethinking_our_Foriegn_Policies: "Переосмысление Нашей Внешней Политики"
 USA_60s_Rethinking_our_Foriegn_Policies_desc: "На этом продвинутом этапе десятилетия у нас теперь есть преимущество ретроспективы и возможность изменить наш подход к внешней политике, а именно: будет ли концепция сдерживания продолжена или заменена."
 USA_60s_The_Middle_East: "Ближний Восток"
 USA_60s_The_Middle_East_desc: "Ситуация на Ближнем Востоке радикально изменилась с 1950-х годов. Мы стали свидетелями подъема нового панарабского национализма, возглавляемого Гамелем Абделем Насером, а также его успешной попытки аннексии Суэцкого канала. Наши более демократические союзники, такие как Израиль и Иран, отчаянно нуждаются в поддержке и помощи, и мы их предоставим."
 USA_60s_Aid_the_Pahalvi_Regime: "Помощь Режиму Пехлеви"
 USA_60s_Aid_the_Pahalvi_Regime_desc: "Шах уже пережил многочисленные попытки переворота и убийства, но внутренняя оппозиция и нестабильность растут. Мы должны помочь ему, если хотим, чтобы его режим сохранился."
 USA_60s_Subsidize_the_Iranian_Armed_Forces: "Субсидировать Иранские Вооруженные Силы"
 USA_60s_Subsidize_the_Iranian_Armed_Forces_desc: "Иранские вооруженные силы, хотя и постоянно обновляют свое оборудование и стратегии в соответствии с современными стандартами, все еще отстают. Мы должны это изменить."
 USA_60s_Outreach_to_Israel: "Работа с Израилем"
 USA_60s_Outreach_to_Israel_desc: "Израиль уже является одним из наших самых верных союзников на Ближнем Востоке и сохранит это положение на долгие годы. Нам нужно расширять наше сотрудничество и связи друг с другом."
 USA_60s_Arm_Israel: "Вооружить Израиль"
 USA_60s_Arm_Israel_desc: "Окруженный враждебными соседями, которые все меньше его населения, Израиль, ЦАХАЛ нуждается в технологическом превосходстве, которое он может получить, и мы можем обеспечить его."
 USA_60s_Reject_Containment: "Отклонить Сдерживание"
 USA_60s_Reject_Containment_desc: "Сдерживание - это внешняя политика, которой наше правительство придерживается с 1947 года, и его требования противостоять советскому влиянию везде и сразу ошибочны и устарели. Настало время выйти из наших различных связей в Азии и Африке."
 USA_60s_Vietnamization: "Вьетнамизация"
 USA_60s_Vietnamization_desc: "Политика вьетнамизации призывает к выводу американских сил во Вьетнаме и замене их большим количеством сил АРВН, в попытке сделать войну во Вьетнаме более вьетнамской. Однако является ли это разумной идеей в военном отношении - это другой вопрос."
 USA_60s_Withdraw_From_Vietnam: "Вывести Войска из Вьетнама"
 USA_60s_Withdraw_From_Vietnam_desc: "Процесс Вьетнамизации завершен, и настало время для полного вывода наших солдат и советников из Вьетнама. Удачи Южному Вьетнаму!"
 USA_60s_Saudi_Aid: "Помощь Саудовской Аравии"
 USA_60s_Saudi_Aid_desc: "Саудовцы, хотя и не столь демократичны, как мы, возможно, надеялись, являются одним из наших немногих союзников на Ближнем Востоке и нуждаются в нашей поддержке."
 USA_60s_Aid_Oman: "Помощь Оману"
 USA_60s_Aid_Oman_desc: "Оман - маленький, но важный друг, расположенный в устье Красного моря и недалеко от Персидского залива. Мы должны убедиться, что они остаются нашими союзниками."
 USA_60s_Launch_Airstrikes_in_Cambodia_and_Laos: "Начать Авиаудары в Камбодже и Лаосе"
 USA_60s_Launch_Airstrikes_in_Cambodia_and_Laos_desc: "Хотя мы, возможно, выводим наши войска, мы все еще заинтересованы в конфликтах в Юго-Восточной Азии. Предоставление авиаударов и поддержки в Камбодже и Лаосе защитит эти интересы."
 USA_60s_Increase_American_Influence_in_the_Persian_Gulf: "Усилить Американское Влияние в Персидском Заливе"
 USA_60s_Increase_American_Influence_in_the_Persian_Gulf_desc: "Персидский Залив является жизненно важным регионом на Ближнем Востоке из-за огромного количества нефти, которая течет через него каждый день. Мы должны быть в хороших отношениях со странами, расположенными вокруг него, если хотим, чтобы нефть продолжала течь."
 USA_60s_Allow_The_PRC_In_the_UN: "Принять КНР в ООН"
 USA_60s_Allow_The_PRC_In_the_UN_desc: "Несмотря на наши очевидные и широкие идеологические различия, Китай - слишком крупная мировая держава, чтобы быть отодвинутой на второй план в важных глобальных дискуссиях, и пришло время принять его в ООН."
 USA_60s_Arm_Lon_Nol: "Вооружить Лон Нола"
 USA_60s_Arm_Lon_Nol_desc: "Лон Нол, президент Камбоджи, нуждается в большей нашей военной помощи и оборудовании для продолжения борьбы с красными кхмерами. и мы предоставим ему их."
 USA_60s_Increase_Arms_Sales_to_Saudi_Arabia_and_Iran: "Увеличить Продажи Вооружений Саудовской Аравии и Ирану"
 USA_60s_Increase_Arms_Sales_to_Saudi_Arabia_and_Iran_desc: "Саудовская Аравия и Иран больше нуждаются в оружии и советниках. Поскольку нам нужны более сильные союзники по всему миру, они их получат."
 USA_60s_The_Korean_DMZ_Crisis: "Кризис в Корейской Демилитаризованной Зоне"
 USA_60s_The_Korean_DMZ_Crisis_desc: "С 1964 года северокорейцы проникают в Республику Корея через демилитаризованную зону и совершают диверсии, а совсем недавно, во время печально известного рейда \"Блю Хаус\", попытались убить Пак Чун Хи. С этим нужно что-то делать!"
 USA_60s_Fortify_the_Border: "Укрепить Границу"
 USA_60s_Fortify_the_Border_desc: "Хотя мы бы хотели уничтожить КНДР, это слишком рискованно в нынешней глобальной ситуации. Лучше укрепить южную сторону демилитаризованной зоны, чем рисковать новой корейской войной."
 USA_60s_Increase_Aid_to_the_Republic_of_Korea: "Увеличить Помощь Республике Корея"
 USA_60s_Increase_Aid_to_the_Republic_of_Korea_desc: "Последние события ясно показали, что РК нуждается в военной и экономической помощи. Они должны быть в состоянии защитить себя от враждебного соседа."
 USA_60s_Approve_Retaliatory_Strikes: "Одобрить Ответные Удары"
 USA_60s_Approve_Retaliatory_Strikes_desc: "Наглость Северной Кореи продолжалась достаточно долго, и настало время для нас ответить добром на добро. Нанесение ответных ударов по КНДР послужит правильным сигналом. Дайте этим коммунякам попробовать их собственное лекарство!"
 USA_60s_the_Second_Korean_War: "Вторая Корейская Война"
 USA_60s_the_Second_Korean_War_desc: "Пришло время раз и навсегда покончить с проблемой двух государств и исправить ошибки, которые мы совершили здесь почти два десятилетия назад. Северная Корея должна умереть, и на ее месте будет одна настоящая Корея. Вперед, солдаты, за демократию!"
 USA_60s_The_Tar_Baby_Option: "Вариант «Тар-Бэби»"
 USA_60s_The_Tar_Baby_Option_desc: "Политика «Тар-Бэби» подразумевает более тесные контакты с правительствами белых меньшинств юга Африки, а также ослабление экономических мер против них, в попытке осознать, что апартеид, хотя и отвратительный, здесь и останется, как и эти режимы."
 USA_60s_Limited_Approach: "Ограниченный Подход"
 USA_60s_Limited_Approach_desc: "Хотя нам необходимо вновь открыть дипломатические каналы с этими странами и начать дружбу, нам не нужно полностью погружаться в эти отношения. Лучше всего использовать ограниченный подход."
 USA_60s_Circumvent_Rhodesian_Embargo: "Обход Эмбарго Родезии"
 USA_60s_Circumvent_Rhodesian_Embargo_desc: "Многие невинные граждане Родезии страдают из-за наложенного международным сообществом эмбарго на ее импорт и экспорт. Обходя эмбарго, мы можем помочь этим невинным людям"
 USA_60s_Limited_Escalation: "Ограниченная Эскалация"
 USA_60s_Limited_Escalation_desc: "Хотя мы не будем с головой погружаться в новую войну после ответных рейдов, мы позволим южнокорейцам усилить патрулирование и разведывательные операции в рамках своего рода ограниченной эскалации."
 USA_60s_Allow_American_Volunteers: "Разрешить Американских Добровольцев"
 USA_60s_Allow_American_Volunteers_desc: "Несмотря на нашу закулисную поддержку правительств апартеида, мы все еще, в конечном счете, хотим, чтобы они и их расистские идеи исчезли. Разрешение добровольцам отправляться в Зимбабве и другие регионы поможет в этом."
 USA_60s_Extensive_Approach: "Экстенсивный Подход"
 USA_60s_Extensive_Approach_desc: "Родезия и Южная Африка являются полностью легитимными режимами и заслуживают признания в качестве таковых. Мы будем поддерживать их всеми возможными способами."
 USA_60s_Deploy_Advisors_to_the_Alcora_Exercise: "Развернуть Советников на Учениях в Алкоре"
 USA_60s_Deploy_Advisors_to_the_Alcora_Exercise_desc: "Учения в Алкоре - это совместный альянс между Португалией, Родезией и Южной Африкой, тремя правительствами, борющимися за сохранение своих режимов белого меньшинства. Мы должны послать советников, чтобы помочь им."
 USA_60s_Capitalize_on_the_Soviet_Sino_Split: "Нажиться на Советско-Китайском Расколе"
 USA_60s_Capitalize_on_the_Soviet_Sino_Split_desc: "Китайцы и Советы окончательно разошлись из-за своих основных идеологических разногласий и противоречивых целей. Вот наш шанс вступить в партнерство с одним из них, чтобы получить преимущество над другим, будь то в политическом или военном плане."
 USA_60s_Outreach_to_Moscow: "Работа с Москвой"
 USA_60s_Outreach_to_Moscow_desc: "Мы и наши бывшие союзники прошли долгий путь со времен славы начала 40-х годов, но с появлением новой угрозы на горизонте, возможно, пришло время снова собрать группу вместе. Мы и Советы? Кто бы мог подумать!"
 USA_60s_Condemn_Chinese_Agression: "Осудить Китайскую Агрессию"
 USA_60s_Condemn_Chinese_Agression_desc: "Китайцы ведут себя слишком экспансионистски и агрессивно, нападают на беспомощные страны, такие как Тибет, и игнорируют договоры, усугубляя положение Тайваня. Мы должны выступить против них."
 USA_60s_Negotiate_over_Vietnam: "Вести Переговоры по Вьетнаму."
 USA_60s_Negotiate_over_Vietnam_desc: "Различные предложения были сделаны в ООН польским делегатом, из всех людей, сесть за стол переговоров с вьетнамцами и договориться о прекращении войны."
 USA_60s_Joint_American_Soviet_War_Against_PRC: "Совместная Американо-Советская Война Против КНР"
 USA_60s_Joint_American_Soviet_War_Against_PRC_desc: "Наши начальники штабов и разведывательные службы встретились, и планы уже готовы. Если пока оставить в стороне наши разногласия, лучшим способом обеспечить прочный мир во всем мире является скорейшее устранение КНР. Сражаясь бок о бок с Советами, мы готовы снова повергнуть мир в хаос ради всеобщего блага"
 USA_60s_Recognize_Rhodesia: "Признать Родезию"
 USA_60s_Recognize_Rhodesia_desc: "Родезия является 100%, абсолютно законным правительством, и никакое количество жалоб черных африканцев этому не поможет. Победителям достаются трофеи, говорим мы, и родезийцы были и будут победителями снова."
 USA_60s_Continue_Containment_Doctrines: "Продолжить Доктрины Сдерживания"
 USA_60s_Continue_Containment_Doctrines_desc: "Хотя у нее нет 100% успеха, сдерживание хорошо послужило нам в борьбе с мировым коммунизмом, и не имеет смысла избавляться от него сейчас."
 USA_60s_Double_Down_in_Vietnam: "Двойной Удар во Вьетнаме"
 USA_60s_Double_Down_in_Vietnam_desc: "Мы так долго держались во Вьетнаме, и сейчас не время бросать наших союзников. Мы должны послать больше оружия, больше войск и больше помощи южновьетнамцам."
 USA_60s_Increase_Aid_to_Taipei: "Увеличить Помощь Тайбэю"
 USA_60s_Increase_Aid_to_Taipei_desc: "В дополнение к тому, чтобы болтаться во Вьетнаме, мы также должны помочь нашим другим юго-восточным друзьям выжить. Тайбэю нужно больше помощи, чтобы выстоять против КНР. "
 USA_60s_Outreach_to_Beijing: "Работа с Пекином"
 USA_60s_Outreach_to_Beijing_desc: "Обращение к КНР в разгар китайско-советского раскола кажется мудрой идеей, поскольку наши мосты с Советами уже давно сожжены. Что получится из этих дипломатических усилий?"
 USA_60s_State_Visit_to_China: "Государственный Визит в Китай"
 USA_60s_State_Visit_to_China_desc: "Наши увертюры Пекину были хорошо приняты, и наш президент отправляется в первый официальный визит Соединенных Штатов в КНР. Приятного полета, господин президент!"
 USA_60s_Pressure_Hanoi: "Давление Ханоя"
 USA_60s_Pressure_Hanoi_desc: "Хо Ши Мин и его Ханойский кабинет отказываются слушать кого-либо, даже своих коллег-коммунистов в КНР. Пришло время усилить давление на них и заставить их сесть за стол переговоров."
 USA_60s_The_Shaghai_Communique: "Шанхайское Коммюнике"
 USA_60s_The_Shaghai_Communique_desc: "Шанхайское Коммюнике будет совместным сообщением между нами и Пекином, заявляющим о нашем общем желании работать вместе, чтобы принести мир в Восточную Азию и юго-восточную часть Тихого океана. Тост за наших новых коммунистических друзей!"
 USA_60s_Intervene_in_Cambodia: "Вмешаться в Камбоджу"
 USA_60s_Intervene_in_Cambodia_desc: "Настало время для нас принять более непосредственное участие в войне в Камбодже, посылая больше оружия и людей роялистам, а также увеличивая наши дипломатические связи."
 USA_60s_Increase_Arms_to_the_Hmong: "Увеличить Вооружение Хмонгов"
 USA_60s_Increase_Arms_to_the_Hmong_desc: "Народ Хмонгов, меньшинство во Вьетнаме, сражается вместе с нами с начала конфликта, и они нуждаются в нашей поддержке. Мы дадим им оружие и другое оборудование, чтобы помочь."
 USA_60s_Veto_PRC_Accension_into_the_UN: "Наложить Вето на Вступление КНР в ООН"
 USA_60s_Veto_PRC_Accension_into_the_UN_desc: "КНР - агрессивная, воинственная, экспансионистская страна, едва оправившаяся от кровавой гражданской войны. Ей не место в самой высокой и престижной организации мира."
 USA_60s_Expand_Aid_to_South_Korea: "Расширить Помощь Южной Корее"
 USA_60s_Expand_Aid_to_South_Korea_desc: "Несмотря на обеспечение свободы в результате прекращения огня в 1953 году, РК все еще нуждается в защите от северокорейских и китайских коммунистических подстрекателей. Для этого ей нужна более сильная экономика и вооруженные силы."
 USA_60s_Encourage_Further_Thai_Intervention_in_South_East_Asia: "Поощрять Дальнейшее Вмешательство Таиланда в Юго-Восточной Азии"
 USA_60s_Encourage_Further_Thai_Intervention_in_South_East_Asia_desc: "Тайцы были удивительно твердым союзником в Юго-Восточной Азии и оказывали поддержку южным вьетнамцам и роялистам. Настало время для их более активного участия."
 USA_60s_The_Gulf_of_Tonkin_Incident: "Инцидент в Тонкинском Заливе"
 USA_60s_The_Gulf_of_Tonkin_Incident_desc: "Северовьетнамцы атаковали два наших эсминца, патрулировавших Тонкинский залив! Этот беспрецедентный, необоснованный акт насилия не останется незамеченным. Это. Означает. Война."
 USA_60s_Begin_The_Vietnam_War: "Начать Войну во Вьетнаме"
 USA_60s_Begin_The_Vietnam_War_desc: "Время для войны снова пришло. Нет никаких ограничений, и никакой пощады не будет дано предательскому Хо Ши Мину и его коммунистическим псам. Мы раздавим их, как ничтожных муравьев, которыми они на самом деле являются."
 USA_60s_Restrict_Involvement: "Ограничить Вовлеченность"
 USA_60s_Restrict_Involvement_desc: "Хотя, возможно, казалось грандиозным ринуться в густые вьетнамские джунгли в разгар инцидента в Тонкинском заливе, более холодные головы возобладали, и решили, что ситуация слишком сложна, чтобы в нее влезать. Пока что мы будем проводить ограниченные операции."
 USA_60s_Crush_the_Khmer_Rouge: "Сокрушить Красных Кхмеров"
 USA_60s_Crush_the_Khmer_Rouge_desc: "Гражданская война в Камбодже затянулась. Пришло время нам вмешаться и покончить с восстанием красных кхмеров раз и навсегда."
 USA_60s_Tacit_Support_of_South_Africa: "Молчаливая Поддержка Южной Африки"
 USA_60s_Tacit_Support_of_South_Africa_desc: "Хотя мы не можем быть замечены в публичном одобрении правительства Южной Африки, мы должны дать им понять, что они пользуются нашей поддержкой, как словом, так и делом."
 USA_60s_Aid_Portugal_Colonial_Conflicts: "Помощь Португалии в Колониальных Конфликтах"
 USA_60s_Aid_Portugal_Colonial_Conflicts_desc: "Португальцы вовлечены в колониальные войны по всему миру и остро нуждаются в любой поддержке, которую они могут получить. Мы окажем им эту помощь."
 USA_60s_Reduce_Global_Tensions: "Снизить Глобальную Напряженность"
 USA_60s_Reduce_Global_Tensions_desc: "В течение последних нескольких лет или даже десятилетий глобальная напряженность находилась на тревожно высоком уровне. Мы, как ведущая мировая держава, должны снизить ее."
 USA_60s_The_American_Armed_Forces: "Американские Вооруженные Силы"
 USA_60s_The_American_Armed_Forces_desc: "Несмотря на все наши тайные операции и дипломатические усилия, единственное, что действительно поддерживает нашу жизнь и процветание - это наши вооруженные силы. Ее нужно поддерживать и поддерживать, чтобы эта ситуация сохранилась."
 USA_60s_US_Missle_Command: "Ракетное Командование США"
 USA_60s_US_Missle_Command_desc: "Ракетное командование, хотя и более новое подразделение, является очень важной частью нашей военной миссии, и это единственное, что мешает Советам сократить наше население до атомов. Мы должны продолжать наши ракетные исследования"
 USA_60s_Polaris_SLBM_Deployment: "Развертывание БРПЛ «Поларис»"
 USA_60s_Polaris_SLBM_Deployment_desc: "БРПЛ «Поларис» - наша самая успешная разработка на сегодняшний день, и она должна быть развернута на наших подводных флотах как можно скорее. Это даст Советам еще одну причину подумать дважды, прежде чем начать свою следующую войну."
 USA_60s_Missle_Silo_Expansion: "Расширение Ракетной Шахты"
 USA_60s_Missle_Silo_Expansion_desc: "Что толку от ракет, если их негде хранить? Расширяя наши шахты, мы можем расширить и наши ракетные силы."
 USA_60s_Attempt_to_Close_the_Missle_Gap: "Попытка Ликвидировать Ракетный Разрыв"
 USA_60s_Attempt_to_Close_the_Missle_Gap_desc: "Несмотря на все наши усилия, Советы, похоже, намного опережают нас в области ракетных исследований и разработок. Это должно измениться, пусть даже незначительно, если мы хотим выжить."
 USA_60s_Expand_Warhead_Production: "Расширить Производство Боеголовок"
 USA_60s_Expand_Warhead_Production_desc: "Боеголовки почти так же важны, как и ракеты, которые их несут, и жизненно важны для наших интересов. Мы должны увеличить их производство."
 USA_60s_The_American_Army: "Американская Армия"
 USA_60s_The_American_Army_desc: "Наша армия, хотя и не особенно полезна как ракетное командование в сдерживании, и совершенно бесполезна в мирное время, все же очень важна для распространения демократии в мире, и должна поддерживаться и расширяться."
 USA_60s_Ford_Machinery_M113: "Ford Machinery M113"
 USA_60s_Ford_Machinery_M113_desc: "M113 - это совершенно новый БТР, разработанный и произведенный компанией Ford. В наших интересах распространить эту машину как можно шире."
 USA_60s_M113_Armorered_Cavalry_Conversion: "M113 Конверсия Бронированной Кавалерии"
 USA_60s_M113_Armorered_Cavalry_Conversion_desc: "M113 также поступит в некоторые наши бронекавалерийские части для замены их устаревших БТР. Это сделает наш механизированный корпус сильнее, и с ним придется считаться."
 USA_60s_Encourage_M113_Exports: "Поощрять Экспорт M113"
 USA_60s_Encourage_M113_Exports_desc: "Экспорт M113 не только принесет пользу нашему правительству, но и укрепит нашу экономику за счет экспортных продаж, а также наших союзников, когда они примут его на вооружение."
 USA_60s_Mass_Adoption_of_the_M16: "Массовое Внедрение M16"
 USA_60s_Mass_Adoption_of_the_M16_desc: "M16, потомок AR-15, разработанный во время войны во Вьетнаме, является одной из лучших винтовок, когда-либо созданных в мире. Все наши наземные войска должны использовать ее."
 USA_60s_The_MBT_70: "MBT-70"
 USA_60s_The_MBT_70_desc: "Программа MBT-70 будет совместным научно-исследовательским проектом США и Западной Германии, направленным на создание MBT, способного противостоять советскому бронетанковому корпусу. Это будет трудная, но полезная задача."
 USA_60s_Abandon_the_MBT_70_Program: "Отказаться от программы MBT-70"
 USA_60s_Abandon_the_MBT_70_Program_desc: "MBT-70 уже значительно превысил бюджет и устарел. К сожалению, пришло время отказаться от этого неудачного эксперимента."
 USA_60s_X_M803: "XM-803"
 USA_60s_X_M803_desc: "XM-803 - армейский проект, предположительно улучшенная версия неудачного MBT-70 с гораздо меньшей стоимостью. Время покажет, правы ли они, но пока они могут продолжать свои эксперименты."
 USA_60s_Lima_Tank_Plant_Explosion: "Расширение Резервуарного Завода в Лиме"
 USA_60s_Lima_Tank_Plant_Explosion_desc: "Резервуарный завод в Лиме, штат Огайо, работает с 1941 года и является одним из лучших в стране. Чтобы увеличить наши возможности по производству танков, необходимо расширить завод."
 USA_60s_The_American_Navy: "Американский ВМФ"
 USA_60s_The_American_Navy_desc: "Наш ВМФ - это то, как мы проецируем нашу силу через моря, вдали от дома и в таких местах, как Ближний Восток и Юго-Восточная Азия. Нам необходимо поддерживать это оружие, если мы хотим, чтобы оно и дальше было в состоянии это делать."
 USA_60s_Advanced_Naval_Design_Studies: "Передовые Исследования Области Проектирования Флота"
 USA_60s_Advanced_Naval_Design_Studies_desc: "Новые достижения в области военно-морских технологий появляются каждый день, и мы должны использовать их и применять в наших великих флотах."
 USA_60s_Hydrofoil_Design_Studies: "Исследования по Проектированию Подводных Крыльев"
 USA_60s_Hydrofoil_Design_Studies_desc: "Новые исследования подводных крыльев дали нам возможность значительно продвинуть нашу технологию НЛЖК (надувная лодка с жестким корпусом)"
 USA_60s_Anti_Submarine_Ballistic_Missles: "Противолодочные Баллистические Ракеты"
 USA_60s_Anti_Submarine_Ballistic_Missles_desc: "У нас есть ядерные БРПЛ, и у Советов теперь тоже. Нам нужно создать другой вид оружия, чтобы остановить их подводные лодки от высвобождения их смертоносных боезарядов."
 USA_60s_Kittery_Shipyard_Expansion: "Расширение Верфи Киттери"
 USA_60s_Kittery_Shipyard_Expansion_desc: "Портсмутская военно-морская верфь в Киттери, штат Мэн, является важным производственным центром в Новой Англии для нашего флота, и ее следует расширить."
 USA_60s_Nuclear_Carrier_Development: "Разработка Атомного Авианосца"
 USA_60s_Nuclear_Carrier_Development_desc: "Авианосцы с ядерным двигателем - это будущее. Они могут идти дальше, дольше находиться в море и поддерживать операции на более обширной территории. Мы должны инвестировать в новые проекты прямо сейчас."
 USA_60s_Conventional_Nuclear_Naval_Propulsion: "Обычные Ядерные Военно-Морские Двигатели"
 USA_60s_Conventional_Nuclear_Naval_Propulsion_desc: "Теперь, когда конструкции уже разработаны, нам нужно продвигать исследования ядерных двигателей, чтобы мы могли реально приводить в движение наши новые суперкорабли."
 USA_60s_Mobile_Airfield: "Мобильный Аэродром"
 USA_60s_Mobile_Airfield_desc: "Наши новые CVN - это именно то, что предки доктрины авианосцев представляли себе все эти годы назад. Массивные плавучие аэродромы, каждый из которых способен поддерживать и проводить точные стратегические удары через океаны."
 USA_60s_Salt_Water_Nuclear_Engines: "Ядерные Двигатели на Соленой Воде"
 USA_60s_Salt_Water_Nuclear_Engines_desc: "Наши исследования показали, что нам нужны специализированные ядерные двигатели для среды соленой воды, в которой практически живут наши авианосцы. Мы должны немедленно продолжить работу в этой области."
 USA_60s_The_American_Airforce: "Американские ВВС"
 USA_60s_The_American_Airforce_desc: "ВВС действуют даже там, где и когда другие наши подразделения не могут, обеспечивая воздушные перевозки голодающим странам, поддерживая демократические режимы воздушным прикрытием и бомбя наших коммунистических врагов по всему миру."
 USA_60s_Strategic_Bomber_Command_Restructure: "Реорганизация Командования Стратегических Бомбардировщиков"
 USA_60s_Strategic_Bomber_Command_Restructure_desc: "Каждый день появляются новые конструкции и роли бомбардировщиков, и нам необходимо обновить нашу командную структуру, чтобы отразить это."
 USA_60s_Continue_High_Speed_Bomber_Development: "Продолжить Разработку Высокоскоростного Бомбардировщика"
 USA_60s_Continue_High_Speed_Bomber_Development_desc: "Планы по созданию высокоскоростного бомбардировщика существуют и реализуются уже некоторое время, и мы должны продолжить их, чтобы добавить этот жизненно важный самолет в наш арсенал."
 USA_60s_Cancel_the_XB_70: "Отменить XB-70"
 USA_60s_Cancel_the_XB_70_desc: "XB-70 «Валькирия» был разработан, чтобы стать идеальным стратегическим бомбардировщиком с большой высотой и скоростью. К сожалению, в ходе летных испытаний этого не произошло, и пришло время положить его на дальнюю полку."
 USA_60s_Big_Four_B_52_Enhancement: "Усовершенствование «Стратосферной Крепости» B-52"
 USA_60s_Big_Four_B_52_Enhancement_desc: "B-52 является краеугольным камнем нашей воздушной мощи, и было бы обидно позволить такой великолепной оружейной платформе кануть в лету. Мы должны улучшить и обновить его."
 USA_60s_Embrace_Systemic_Doctrine: "Принять Системную Доктрину"
 USA_60s_Embrace_Systemic_Doctrine_desc: "Роль наших ВВС изменилась с момента их создания, и пришло время, чтобы наша доктрина изменилась вместе с ней. Принятие системной программы поможет в этом."
 USA_60s_Air_Gunnery_Re_Emphasis: "Переориентация Воздушного Стрелкового Оружия"
 USA_60s_Air_Gunnery_Re_Emphasis_desc: "Слишком долгое время наше внимание было сосредоточено на высокотехнологичных бомбардировщиках, а наши исследования и разработки истребителей отставали. Это неприемлемо, и нам нужно снова сделать акцент на истребителях."
 USA_60s_Chrysler_XM_1: "Chrysler XM-1"
 USA_60s_Chrysler_XM_1_desc: "XM-1 наконец-то станет ответом, который мы ищем, чтобы заменить устаревший танк M-60 Паттон. Он новый, прочный и мощный. Это именно то, что нам нужно и чего мы хотели для нашего бронетанкового корпуса."
 USA_60s_Carrier_Strike_Group_Formations: "Формирования Ударных Групп Авианосцев"
 USA_60s_Carrier_Strike_Group_Formations_desc: "Поскольку авианосцы занимают все большее место в нашей стратегии, мы не можем позволить себе пренебрегать ими и их эскадрильями. Обновление формаций ударных групп повысит эффективность и точность."
 USA_60s_Maintain_Missle_Prioritisation: "Поддерживать Приоритет Ракет"
 USA_60s_Maintain_Missle_Prioritisation_desc: "Хотя наши пилотируемые ВВС важны, наше ракетное командование и НИОКР важнее, и мы не можем забывать об этом."
 USA_60s_Heavy_Napalm_Integration: "Интеграция Тяжелого Напалма"
 USA_60s_Heavy_Napalm_Integration_desc: "Напалм есть и будет полезным инструментом для расчистки деревень и густых лесных массивов. Интеграция его в наши ВВС позволит нам развернуть его."
 USA_60s_Wild_Weasels: "«Дикие ласки»"
 USA_60s_Wild_Weasels_desc: "«Дикие ласки» - это самолеты, оснащенные противорадиационными ракетами и предназначенные для уничтожения и подавления вражеской противовоздушной обороны. Наличие самолетов и пилотов, предназначенных для выполнения этой задачи, позволит остальным выполнять ее, не беспокоясь о наземном огне."