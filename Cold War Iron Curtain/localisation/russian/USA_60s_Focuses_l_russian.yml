 Operation_Firebird.1.d: "В рамках продолжающейся Корейской войны главнокомандующий КООН генерал Дуглас Макартур привел в действие план операции \"Гудзонская гавань\", который теперь будет жить в бесславии. Под покровом ночи пятьдесят самолетов B-29 взлетели с многочисленных аэродромов и авианосцев, расположенных в пределах досягаемости корейско-маньчжурской границы, все они были вооружены ядерным боезарядом. Один за другим они доставили свои адские заряды, разрушив границу от Антунга до Хуньчуня и фактически загнав в ловушку китайскую Красную армию. Удар был еще более расширен: сопровождаемый B-29 нанес жестокий удар по Пекину, доставив бомбу с большей боевой нагрузкой. За несколько часов линии снабжения и командования поддерживающих коммунистов были уничтожены, а Красные армии дезорганизованы. Теперь главнокомандующий приступил ко второй фазе своего плана, когда сотни тысяч американских и гоминьдановских солдат высадились в материковом Китае."
