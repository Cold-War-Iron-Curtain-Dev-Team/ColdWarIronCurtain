 USASOV_VIETNAM.1.d: "Американское вторжение во вьетнамские джунгли продолжается без сопротивления уже некоторое время, хотя Американские войска добились незначительного прогресса. Януш Левандовский, наш представитель в Международной контрольной комиссии, предложил дипломатическую инициативу под названием \"Мэриголд\". В рамках этой инициативы, он будет способствовать выработке условий мира, выступая в качестве посредника между Северным Вьетнамом и американским послом в Южном Вьетнаме. "
 USASOV_VIETNAM.2.d: "Американское вторжение во вьетнамские джунгли продолжается без сопротивления уже некоторое время, хотя Американские войска добились незначительного прогресса. Нам стало известно, что Януш Левандовский, польский представитель в Международной контрольной комиссии, предложил дипломатическую инициативу под названием \"«Мэриголд»\". В рамках этой инициативы он будет способствовать выработке условий мира, выступая в качестве посредника между Северным Вьетнамом и американским послом в Южном Вьетнаме. Хотя мы не должны активно посредничать, мы можем предотвратить его инициативу, если захотим."
 USASOV_VIETNAM.3.d: "[POL.GetNameDef] приняла советского посла и связалась с нашими дипломатами по поводу «Мэриголд», дипломатической инициативы, недавно начатой Янушем Левандовским. Эти дипломаты бестактно предложили с помощью тонко завуалированных угроз предотвратить его дипломатические усилия. К сожалению, мы не можем позволить Левандовскому продолжать эти усилия."
 USASOV_VIETNAM.4.d: "Наш посол в Южном Вьетнаме получил коммюнике от польского представителя в Международной контрольной комиссии Януша Левандовского. Левандовский выразил желание стать посредником в мирных переговорах между Северным Вьетнамом и Америкой. Хотя некоторые из ближайших советников президента считают, что мы должны воспользоваться этой возможностью, чтобы выйти из войны, есть много \"ястребов войны\", которые верят, что мы можем бороться до конца, чтобы выиграть эту борьбу с коммунизмом"
 USASOV_VIETNAM.5.d: "[USA.GetAdjective] Правительство официально приняло наше предложение о мирных переговорах между Северным Вьетнамом и Америкой! Мы можем ожидать надлежащих переговоров в ближайшие месяцы в штаб-квартире ООН, если [VIN.GetNameDef] согласится."
 USASOV_VIETNAM.6.d: "Дипломатическая инициатива «Мэриголд» была быстро и безоговорочно отвергнута [USA.GetAdjective] правительством. К сожалению, мы не сможем сгладить конфликт во Вьетнаме."
 USASOV_VIETNAM.7.d: "Польский представитель в МУС Януш Левандовский вызвался стать посредником в мирных переговорах между нашей страной и [USA.GetNameDef]! Американцы, кажется, даже готовы работать с нами ради мира. "
 USASOV_VIETNAM.8.d: "[USA.GetNameDef] и [VIN.GetNameDef]  отправили представителей для встречи под наблюдением польского представителя Левандовского в штаб-квартире ООН. После нескольких дней напряженных переговоров они согласовали условия мира, которые были подтверждены правительствами обоих сторон. Вооруженные [USA.GetAdjective] силы вскоре будут выведены из Юго-Восточной Азии."
 USASOV_VIETNAM.9.d: "[VIN.GetAdjective] Лидеры отвергли наши попытки установить мир! По какой-то причине они, похоже, хотят борьбы?"
