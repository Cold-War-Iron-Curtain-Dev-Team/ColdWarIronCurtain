l_english:
 CUB_infantry_equipment_0: "Винтовка M1941 Джонсон"
 CUB_infantry_equipment_0_short: "Винтовка M1941 Джонсон"
 CUB_infantry_equipment_0_desc: "Винтовка M1941 Джонсона\" - американская самозарядная винтовка с короткой перезарядкой, разработанная Мелвином Джонсоном перед Второй мировой войной. M1941 безуспешно конкурировала с американской винтовкой M1"
 CUB_infantry_equipment_1: "Автоматическая легкая винтовка Fabrique Nationale"
 CUB_infantry_equipment_1_short: "FN FAL"
 CUB_infantry_equipment_1_desc: "FN FAL является одним из самых производимых пистолетов в истории. Из-за его распространенности и широкого использования в армии многих стран НАТО и стран первого мира во время холодной войны ему было дано название \"Правая рука свободного мира\"."
 CUB_infantry_equipment_2: "АКМ"
 CUB_infantry_equipment_2_short: "АКМ"
 CUB_infantry_equipment_2_desc: "АКМ - модернизированный вариант АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия снизился на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ немедленно и повсеместно стал использоваться во многих коммунистических странах и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
 CUB_infantry_equipment_3: "AK-74"
 CUB_infantry_equipment_3_short: "AK-74"
 CUB_infantry_equipment_3_desc: "АК74 - современный автомат, разработанный Михаилом Калашниковым для замены АКМ в 1974 году. Он использует патрон меньшего калибра и улучшенный хромированный ствол с 4 правосторонними канавками. Мушка и газоотводная колодка были переделаны таким образом, что в них появился канал, установленный под углом 90 градусов к оси ствола для уменьшения сдвига пули при удержании ствола. Кроме того, при его разработке использовалось разнообразное навесное оборудование, включая ложе с резиновыми накладками. Усовершенствования АК74 позволили солдатам переносить большее количество боеприпасов в полевых условиях и вести более интенсивный огонь с высокой точностью на средних дистанциях. Во время конфликта в Афганистане ЦРУ заплатило моджахедам большую сумму денег за захваченный АК74. АК74 используется гражданскими властями в правительстве Кубы"
 CUB_infantry_equipment_4: "Кубинский АКМ)"
 CUB_infantry_equipment_4_short: "Кубинский АКМ"
 CUB_infantry_equipment_4_desc: "Лицензионно производимая версия АКМ, известная просто как кубинский АКМ, все еще используется и производится в наши дни. Были добавлены дополнительные точки крепления для оптического прицела собственной разработки и производства, что позволило увеличить срок службы автомата, состоящего на вооружении Кубы с конца 1950-х годов."
 CUB_lt_equipment_1: "M3A3 Stuart"
 CUB_lt_equipment_1_short: "M3A3 Stuart"
 CUB_lt_equipment_2: "M8 Greyhound"
 CUB_lt_equipment_2_short: "M8 Greyhound"
 CUB_lt_equipment_3: "PT-76"
 CUB_lt_equipment_3_short: "PT-76"
 CUB_lt_equipment_3_desc: "ПТ-76 - советский легкий танк-амфибия, который активно экспортировался по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 году и было произведено около 12 000 единиц. Он требует экипаж из 3 человек и двигатель V6 с прямой шестеркой, развивает скорость 44 км/ч и может плавать со скоростью 10 км/ч. Он экспортировался в различные страны советской сферы и страны, склоняющиеся к советской власти, и в качестве такового участвовал в разведке практически во всех конфликтах стран советской сферы. Однако, благодаря своей известной надежности и простоте обслуживания, он до сих пор используется многими странами."
 CUB_lt_equipment_4: "PT-76B Model 4"
 CUB_lt_equipment_4_short: "PT-76B"
 CUB_lt_equipment_4_desc: "PT-76 вооружен 76. 2 мм нарезной танковой пушкой (дульный тормоз с двойной перегородкой, эжектор патронов, дымоуловитель и двухосевая система стабилизации СТП-2П \"Заря\"), системой защиты от ЯБП ПАЗ (противоатомная защита), автоматической системой пожаротушения, улучшенным прицелом ТШК-2-66, фильтровентиляционной системой, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный дизельный двигатель V-6B с водяным охлаждением мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для которых пришлось немного изменить форму брони. "
 CUB_ht_equipment_4: "ИС-2М"
 CUB_ht_equipment_4_short: "ИС-2М"
 CUB_mbt_equipment_0: "M4 Sherman"
 CUB_mbt_equipment_0_short: "M4 Sherman"
 CUB_mbt_equipment_1: "A34 Comet Tank Cruiser"
 CUB_mbt_equipment_1_short: "Comet"
 CUB_mbt_equipment_2: "Т-54"
 CUB_mbt_equipment_2_short: "T-54"
 CUB_mbt_equipment_2_desc: "Танк Т-54 был самым производимым танком в истории. Танк был разработан в 1946 году конструктором КМБД. Сам танк использует 100-мм нарезную пушку и имеет различную толщину брони - от 205 мм до 60 мм. Двигатель - дизельный V-12 объемом 38,88 л. Танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался в более чем 50 армиях мира и выпускался на протяжении всего советского периода и всех конфликтов вместе с ним. "
 CUB_mbt_equipment_3: "T-55"
 CUB_mbt_equipment_3_short: "T-55"
 CUB_mbt_equipment_3_desc: "Т-55 - это улучшенная версия танка Т-54. ОКБ-520 модифицировало конструкцию Т-55, улучшив защиту от ЯБП, поставив более оптимизированный двигатель, улучшив форму башни, и даже добавив больше вспомогательного оборудования, такого как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал 12,7 ДШК HMG, в то время как Т-54 использовал 7,62 SGMT пушку, что давало ему больше огневой мощи, но не позволяло нести больше боеприпасов. Т-55 использовался в столь же многочисленных армиях и, как правило, участвовал во всех конфликтах, что и Т-54. "
 CUB_mbt_equipment_4: "T-62"
 CUB_mbt_equipment_4_short: "T-62"
 CUB_mbt_equipment_4_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет немного более толстую броню. Главная пушка также была увеличена до 115 мм. Изначально он был заказан Советским Союзом в попытке улучшить огневую мощь, и конструкторское бюро ОКБ-520 завершило проект около 1960 года. Несмотря на усовершенствование, производство не было прекращено, так как его стоимость была номинально выше, чем у Т-55. Было произведено более 22 700 единиц Т-62, которые приняли участие в огромном количестве боевых действий по всей советской территории, но в основном в конфликтах на Ближнем Востоке. Его усовершенствования показали несколько большие возможности в 1969 году в китайско-советском пограничном конфликте. "
 CUB_mbt_equipment_5: "T-62M"
 CUB_mbt_equipment_5_short: "T-62M"
 CUB_mbt_equipment_5_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет несколько более толстую броню. Главная пушка также была увеличена до 115 мм. Изначально он был заказан Советским Союзом в попытке улучшить огневую мощь, и конструкторское бюро ОКБ-520 завершило проект около 1960 года. Несмотря на усовершенствование, производство не было прекращено, так как его стоимость была номинально выше, чем у Т-55. Было произведено более 22 700 единиц Т-62, которые приняли участие в огромном количестве боевых действий по всей советской территории, но в основном в конфликтах на Ближнем Востоке. Его усовершенствования показали несколько большие возможности в 1969 году в китайско-советском пограничном конфликте. "
 CUB_mechanized_equipment_1: "M2 Half-Track"
 CUB_mechanized_equipment_1_short: "M2 Half-Track"
 CUB_mechanized_equipment_1_desc: "Полугусеничный автомобиль M2 - бронированный полугусеничный автомобиль, произведенный Соединенными Штатами во время Второй мировой войны. В его конструкции использовались полугусеничные машины, импортированные из Франции в 1930-х годах, с применением стандартных компонентов, поставляемых американскими производителями грузовиков для ускорения производства и снижения затрат. Концепция была разработана, а опытные образцы изготовлены компанией Firestone Tire and Rubber Company (до того, как прототип получил официальное обозначение M2.). Производство компанией White Motor Company началось в 1940 году и было расширено до Autocar."
 CUB_mechanized_equipment_2: "M3 Half-Track"
 CUB_mechanized_equipment_2_short: "M3 Half-Track"
 CUB_mechanized_equipment_2_desc: "Полугусеничный бронетранспортер M3 был американским полугусеничным бронетранспортером, широко использовавшимся союзниками во время Второй мировой войны и в холодной войне. Созданный на основе полугусеничной машины M2, M3 был широко распространен, было произведено около 15 000 стандартных M3 и более 38 000 вариантов. В эпоху холодной войны машина использовалась различными государственными и негосударственными операторами в конфликтах в Южной Америке, на Ближнем Востоке, в Африке и Азии, оставаясь на вооружении до середины 1990-х годов. В Мексике они все еще используются по состоянию на 2019 год"
 CUB_mechanized_equipment_3: "M3A1 Half-Track"
 CUB_mechanized_equipment_3_short: "M3A1 Half-Track"
 CUB_mechanized_equipment_3_desc: "M3A1 - это полугусеничный тягач M3 с улучшенным кольцевым креплением пулемета M49 над правым передним сиденьем. В 1942-1943 гг. все полугусеничные машины M3 (стандартные и A1) постоянно модернизировались. Эти усовершенствования включали в себя ряд улучшений трансмиссии, двигателя и укладки"
