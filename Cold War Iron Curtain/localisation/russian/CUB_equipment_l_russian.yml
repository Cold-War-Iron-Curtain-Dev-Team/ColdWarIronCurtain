 CUB_fighter_equipment_0: "Defensa Anti-Aérea y Fuerza Aérea Revolucionaria"
 CUB_fighter_equipment_0_short: "DAAFAR"
 CUB_fighter_equipment_0_desc: "Кубинские революционные силы авиации и противовоздушной обороны, обычно сокращаемые до DAAFAR на испанском и английском языках, являются военно-воздушными силами Кубы."
 CUB_fighter_equipment_3: "North American P-51D Mustang"
 CUB_fighter_equipment_3_short: "P-51D Mustang"
 CUB_jet_multirole_equipment_2: "МиГ-15"
 CUB_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 \"Фагот\" Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления на вооружении в Корейской войне, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые из них все еще остаются на вооружении ВВС Северной Кореи."
 CUB_jet_multirole_equipment_2_short: "МиГ-15"
 CUB_jet_multirole_equipment_3: "МиГ-17"
 CUB_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 \"Фагот\". Более 10 000 МиГ-17 \"Фагот\" было произведено с 1952 года. МиГ-17 по лицензии производился в ВВС НОАК как Shenyang J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabres над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе ВВС НОАК и ВВС НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял более современным сверхзвуковым американским истребителям Phantom II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно используется в некоторых африканских странах и Северной Корее."
 CUB_jet_multirole_equipment_3_short: "МиГ-17"
 CUB_jet_multirole_equipment_4: "МиГ-19"
 CUB_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в ровном полете. Сравнимым американским истребителем \"Century Series\" был North American F-100 Super Sabre, хотя МиГ-19 в основном боролся с более современными McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 CUB_jet_multirole_equipment_4_short: "МиГ-19"
 CUB_jet_multirole_equipment_5: "МиГ-21Ф-13"
 CUB_jet_multirole_equipment_5_desc: "МиГ-21 Fishbed считается одним из самых ранних советских истребителей третьего поколения, оснащенным ракетами дальнего радиуса действия и импульсным радаром. МиГ-21 является самым производимым сверхзвуковым самолетом в истории, особенно большое количество было построено в Китае и Индии по лицензии. Всего было построено более 11 000 самолетов, которые служат в более чем 60 странах на 5 континентах. За время своей службы МиГ-21 совершил 240 воздушных убийств. МиГ-21 участвовал во многих конфликтах, включая Вьетнам (где он добился огромных успехов), индийско-пакистанскую войну 1971 года, ирано-иракскую войну и множество более мелких конфликтов. Он остается на вооружении более 6 десятилетий"
 CUB_jet_multirole_equipment_5_short: "MiG-21F-13"
 CUB_jet_multirole_equipment_6: "МиГ-21ПФ"
 CUB_jet_multirole_equipment_6_desc: "Серийная версия всепогодного перехватчика. Они оснащались турбореактивными двигателями Р11Ф2-300 и, начиная с седьмой партии, оснащались РЛС РП-21 (на первых шести партиях использовалась более старая РЛС ЦД-30Т (она же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую АУ РС-2УС (она же К-5МС) в дополнение к К-13 с ИК-целью."
 CUB_jet_multirole_equipment_6_short: "МиГ-21ПФ"
 CUB_jet_multirole_equipment_7: "МиГ-23М"
 CUB_jet_multirole_equipment_7_desc: "МиГ-23 был первым советским истребителем, оснащенным радаром \"взгляд вниз/снижение\" и одним из первых, вооруженным ракетами дальнего радиуса действия. Производство началось в 1969 году и достигло больших объемов - было построено более 5 000 самолетов, что сделало его самым производимым самолетом с изменяемой стреловидностью крыла в истории. Сегодня МиГ-23 остается в ограниченном количестве на вооружении некоторых экспортных заказчиков."
 CUB_jet_multirole_equipment_7_short: "МиГ-23М"
 CUB_jet_multirole_equipment_8: "МиГ-23МЛ"
 CUB_jet_multirole_equipment_8_desc: "Ранние варианты \"Флоггера\" имели ряд конструктивных недостатков, включая прочность и надежность планера, работу двигателя, маневренность и радиолокационные характеристики. Была проведена значительная переделка планера, в результате чего появился МиГ-23МЛ."
 CUB_jet_multirole_equipment_8_short: "МиГ-23МЛ"
 CUB_jet_multirole_equipment_9: "МиГ-23МЛД"
 CUB_jet_multirole_equipment_9_desc: "МиГ-23МЛД был окончательным вариантом истребителя МиГ-23. Основным направлением модернизации было улучшение маневренности, особенно на больших углах атаки, что было признано главным недостатком МиГ-23М/МЛ. Стрела Пито была оснащена вихревыми генераторами, а зазубренные корни передней кромки крыла были \"пилообразными\" и также служили вихревыми генераторами. Система управления полетом включала в себя синтетическое устройство \"стик-стоп\"/ограничитель сигналов SOS-3-4"
 CUB_jet_multirole_equipment_9_short: "МиГ-23МЛД"
 CUB_jet_multirole_equipment_10: "МиГ-29А"
 CUB_jet_multirole_equipment_10_desc: "МиГ-29 Fulcrum A был первоначально разработан ОКБ Микояна. Это был первый истребитель 4-го поколения, поступивший на вооружение СССР и стран Восточного блока. На нем была установлена усовершенствованная авионика и значительно расширены возможности радара. Первые МиГ-29 использовались в качестве учебно-тренировочных самолетов в странах Варшавского договора и поставлялись на экспорт в Индию, но имели ограниченное боевое применение. Впоследствии МиГ-29 стал базой для широко производимых вариантов, таких как МиГ-29С, МиГ-29М и МиГ-35."
 CUB_jet_multirole_equipment_10_short: "МиГ-29А"
 CUB_jet_CAS_equipment_7: "МиГ-23БН"
 CUB_jet_CAS_equipment_7_short: "МиГ-23БН"
 CUB_jet_CAS_equipment_7_desc: "(\"Flogger-H\") Производимый с 1973 года, МиГ-23БН был основан на МиГ-23Б, но имел тот же двигатель Р-29-300, что и современные варианты истребителей. Они также были оснащены крыльями \"тип 3\". Были и другие незначительные изменения в электронике и оборудовании, некоторые изменения были внесены в ходе длительного производства. Серийное производство продолжалось до 1985 года, было построено 624 самолета. Большинство из них было экспортировано, поскольку Советы всегда рассматривали их как промежуточный тип, и лишь небольшое количество служило в полках фронтовой авиации. Как обычно, пониженная версия продавалась заказчикам из стран третьего мира. Этот вариант оказался достаточно популярным и эффективным. Наиболее характерной отличительной особенностью МиГ-23Б от МиГ-23БН было то, что первый имел диэлектрическую головку чуть выше пилона, которая была удалена на МиГ-23БН. В Индии последние МиГ-23БН летали в 221 эскадрилье (Valiants) ВВС Индии и были списаны 6 марта 2009 года. Командир крыла Тапас Ранджан Саху был последним пилотом, посадившим МиГ-23БН в этот день"
 CUB_jet_light_equipment_1: "Lockheed T-33 Shooting Star"
 CUB_jet_light_equipment_1_short: "T-33 Shooting Star"
 CUB_jet_light_equipment_1_desc: "Lockheed T-33 Shooting Star (или T-Bird) - дозвуковой американский реактивный учебно-тренировочный самолет. Он был произведен компанией Lockheed и совершил свой первый полет в 1948 году. T-33 был разработан на основе Lockheed P-80/F-80, начиная с TP-80C/TF-80C в разработке, затем получил обозначение T-33A."
 CUB_jet_light_equipment_2: "МиГ-15УТИ"
 CUB_jet_light_equipment_2_short: "МиГ-15УТИ"
 CUB_jet_light_equipment_2_desc: "6 апреля 1949 года коллективу ОКБ-155 было официально поручено разработать учебный вариант истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен заводом № 1 в марте-мае 1949 года. Кабина инструктора на УТИ МиГ-15 была размещена за счет уменьшения первого фюзеляжного топливного бака. Обе герметичные кабины были оборудованы катапультными креслами и фонарями пиромеханического сброса.  Специальное оборудование машины состояло из автоматического пушечного прицела АСП-1Н, приемопередающей радиостанции РСИ-6К, радиокомпаса с маркером РПКО-10М, переговорного устройства СПУ-2М, кислородного прибора КП-14 и фотоаппарата АФА-ИМ. Вооружение состояло из одной 23-мм пушки НР-23 с боекомплектом 80 патронов и одного пулемета УБК-Э с боекомплектом 150 патронов."
 CUB_jet_light_equipment_3: "L-29 Delfin"
 CUB_jet_light_equipment_3_short: "L-29 Delfin"
 CUB_jet_light_equipment_3_desc: "Aero L-29 Delfín (англ. Dolphin, отчетное название НАТО: Maya) - военный реактивный учебно-тренировочный самолет, разработанный и произведенный чехословацкой авиационной компанией Aero Vodochody. В ходе реализации программы было произведено более 3000 учебно-тренировочных самолетов L-29 Delfin. Из них около 2 000 были поставлены в Советский Союз, где они использовались в качестве стандартного учебно-тренировочного самолета для советских ВВС."
 CUB_jet_light_equipment_4: "Aero L-39 Albatros"
 CUB_jet_light_equipment_4_short: "L-39 Albatros"
 CUB_jet_light_equipment_4_desc: "Aero L-39 Albatros - это высокоэффективный реактивный учебно-тренировочный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах как замена Aero L-29 Delfín в качестве основного учебного самолета. Это был первый учебно-тренировочный самолет, оснащенный турбовентиляторной силовой установкой. Этот тип экспортировался во многие страны в качестве военного учебно-тренировочного самолета."
 CUB_jet_light_equipment_5: "Aero L-39ZA Albatros"
 CUB_jet_light_equipment_5_short: "L-39ZA Albatros"
 CUB_jet_light_equipment_5_desc: "Значительно модернизированный L-39 для вооруженной подготовки и легких атак, с более прочным шасси, большей полезной нагрузкой и, в частности, с возможностью установки 23-миллиметровой двухствольной пушки GSh-23L, закрепленной в конформной капсуле под отсеком пилота, с магазином на 150 патронов внутри планера."
 CUB_recon_equipment_0: "North American F-6D Mustang"
 CUB_recon_equipment_0_short: "F-6D Mustang"
 CUB_recon_equipment_0_desc: "Разведывательная версия P-51D Mustang."
 CUB_jet_recon_equipment_0: "Lockheed RT-33A Shooting Star"
 CUB_jet_recon_equipment_0_short: "RT-33A Shooting Star"
 CUB_jet_recon_equipment_0_desc: "RT-33A модифицирован перед поставкой как одноместный разведывательный вариант; построено 85, в основном для экспорта по программе военной помощи."
 CUB_jet_recon_equipment_1: "МиГ-21Р-13"
 CUB_jet_recon_equipment_1_short: "МиГ-21Р-13"
 CUB_tac_bomber_equipment_2: "North American B-25C Mitchell"
 CUB_tac_bomber_equipment_2_short: "B-25C Mitchell"
 CUB_tac_bomber_equipment_2_desc: "B-25 - двухмоторный средний бомбардировщик, представленный в 1941 году. Использовался многими военно-воздушными силами во время Второй мировой войны, а также служил на всех театрах военных действий, где применялась авиация. Наиболее известным его использованием стал рейд Дулиттла, первая успешная кампания воздушной бомбардировки материковой части Японии во время войны. Его прозвище - \"Митчелл\", по имени генерал-майора Билли Митчелла, пионера военной авиации США"
 CUB_tac_bomber_equipment_3: "Douglas B-26B Invader"
 CUB_tac_bomber_equipment_3_short: "B-26B Invader"
 CUB_jet_tac_bomber_equipment_2: "Ил-28"
 CUB_jet_tac_bomber_equipment_2_short: "Ил-28"
 CUB_jet_tac_bomber_equipment_2_desc: "Ил-28 - турбореактивный средний бомбардировщик, разработанный сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, запущенный в крупносерийное производство, Ил-28, представленный в 1950 году, участвовал во многих крупных конфликтах холодной войны, от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. Даже после снятия с вооружения СССР к 1980-м годам, многие самолеты этого типа продолжают служить и по сей день. Отчетное название USAF/DoD - Type 27, кодовое название НАТО - Beagle"
 CUB_transport_plane_equipment_1: "Douglas C-47 Dakota"
 CUB_transport_plane_equipment_1_short: "C-47 Dakota"
 CUB_transport_plane_equipment_2: "Ан-2"
 CUB_transport_plane_equipment_2_short: "Ан-2"
 CUB_transport_plane_equipment_6: "Ан-26"
 CUB_transport_plane_equipment_6_short: "Ан-26"
 CUB_transport_plane_equipment_6_desc: "Антонов Ан-26 - двухмоторный турбовинтовой гражданский и военно-транспортный самолет, разработанный и производившийся в Советском Союзе с 1969 по 1986 год."
 CUB_transport_plane_equipment_7: "Ил-62М"
 CUB_transport_plane_equipment_7_short: "Ил-62М"
 CUB_transport_plane_equipment_8: "Ил-76МД"
 CUB_transport_plane_equipment_8_short: "Ил-76МД"
 CUB_nav_bomber_equipment_1: "Vought OS2U-3 Kingfisher"
 CUB_nav_bomber_equipment_1_short: "OS2U-3 Kingfisher"
 CUB_nav_bomber_equipment_2: "Grumman G-21B Goose"
 CUB_nav_bomber_equipment_2_short: "G-21B Goose"
 CUB_nav_bomber_equipment_3: "Consolidated PBY-5A Catalina"
 CUB_nav_bomber_equipment_3_short: "PBY-5A Catalina"
 CUB_cv_jet_CAS_equipment_2: "Hawker Sea Fury FB.11"
 CUB_cv_jet_CAS_equipment_2_short: "Sea Fury FB.11"
 CUB_cv_jet_CAS_equipment_2_desc: "Одноместный истребитель-бомбардировщик для Королевских ВМС, Королевских ВМС Австралии, Королевских ВМС Канады и Королевских ВМС Нидерландов, 615 построенных, включая 31 для RAN и 53 для RCN"
 CUB_attack_helicopter_equipment_2: "Ми-24В"
 CUB_attack_helicopter_equipment_2_short: "Ми-24В"
 CUB_attack_helicopter_equipment_2_desc: "Более поздняя разработка, поступившая в производство в 1976 году. Он был вооружен более совершенными ракетами 9М114 \"Штурм\" (AT-6 Spiral). Восемь этих ракет установлены на четырех внешних пилонах крыла. Это была самая распространенная версия, было произведено более 1 500 самолетов. На польской службе этот самолет получил обозначение Ми-24W. Один Ми-24В по неизвестным причинам был обозначен как Ми-24Т"
 CUB_attack_helicopter_equipment_3: "Ми-25"
 CUB_attack_helicopter_equipment_3_short: "Ми-25"
 CUB_attack_helicopter_equipment_3_desc: "Экспортная версия Ми-24Д. (Hind-D) Ми-24Д был разработан как более чистый боевой корабль, чем предыдущие варианты. Он поступил в производство в 1973 году. Ми-24Д имеет перепроектированный передний фюзеляж с двумя отдельными кабинами для пилота и наводчика. Он вооружен одним 12,7-мм четырехствольным пулеметом Як-Б в носовой части. Он также может нести четыре 57-мм ракетные установки, четыре противотанковые ракеты SACLOS 9M17 Phalanga (значительное усовершенствование по сравнению с системой MCLOS, установленной на Ми-24А), а также бомбы и другое вооружение."
 CUB_scout_helicopter_equipment_1: "Ми-2А"
 CUB_scout_helicopter_equipment_1_short: "Ми-2А"
 CUB_naval_helicopter_equipment_5: "Ми-14ПЛ"
 CUB_naval_helicopter_equipment_5_short: "Ми-14ПЛ"
 CUB_utility_helicopter_equipment_1: "Ми-4"
 CUB_utility_helicopter_equipment_1_short: "Ми-4"
 CUB_utility_helicopter_equipment_2: "Ми-4АВ"
 CUB_utility_helicopter_equipment_2_short: "Ми-4АВ"
 CUB_utility_helicopter_equipment_3: "Ми-8Т"
 CUB_utility_helicopter_equipment_3_short: "Ми-8Т"
 CUB_utility_helicopter_equipment_4: "Ми-17"
 CUB_utility_helicopter_equipment_4_short: "Ми-17"
 CUB_utility_helicopter_equipment_5: "Ми-8МТВ"
 CUB_utility_helicopter_equipment_5_short: "Ми-8МТВ"