 Nazimuddin.1.d: "Хаваджа Назимуддин согласился стать вторым премьер-министром Пакистана. Многие считали бывшего генерал-губернатора наименее противоречивым выбором из-за его послужного списка. Будучи генерал-губернатором, он соблюдал политический нейтралитет в политике. Тот факт, что Мухаммад Али Джинна и Лиакат Али Хан открыто поддерживали его перед смертью, также сделал Назимуддина идеальным кандидатом на пост премьер-министра. Премьер-министр Назимуддин родом из Дакки и станет первым бенгальским главой правительства в Пакистане. Одним из первых его действий было назначение Малика Гулама новым генерал-губернатором. Он пришел к власти на фоне растущего политического недовольства со стороны провинциальных националистов и заявил, что будет продолжать консервативный подход своего предшественника. Началась новая эра в пакистанской политике. Однако критики уже отмечают его аристократическое происхождение, а политическая реакция на его доклад об основных принципах не сулит ему ничего хорошего."
 Language_Debate.1.d: "Премьер-министр Хаваджа Назимуддин вызвал споры своими высказываниями в Дакке в прошлом месяце. Он заявил, что Джинна был прав, когда говорил, что для национального единства урду должен быть единственным языком Пакистана. Хотя Назимуддин является бенгальцем, он по-прежнему твердо привержен идее Пакистана, задуманного Джинной, а его происхождение как аристократа, говорящего на урду, не позволило ему понять, насколько чувствителен бенгальский народ к языковому вопросу. Это заявление привело к созданию языковых комитетов, требующих признания бенгальского языка в качестве национального. Сегодня языковые демонстранты вышли на улицы Дакки в массовом количестве, несмотря на запрет правительства на незаконные собрания. Протестующие, в основном студенты, собрались в университете и собираются в большом количестве. Полиция и власти Восточного Пакистана готовы к действиямю"
 Language_Debate.2.d: "В университете Дакки, где студенты протестовали из-за языкового вопроса, полиция смогла оцепить районы и применила слезоточивый газ, чтобы разогнать протестующих. Когда студенты убегали, некоторые из них были задержаны за нарушение постановлений правительства, что, очевидно, разъярило толпу. Эта толпа двинулась к зданию Ассамблеи Восточного Пакистана, чтобы потребовать, чтобы их недовольство было услышано, и когда они, казалось, ворвались в здание, полиция открыла огонь, убив по меньшей мере шестерых, но, вероятно, больше студентов. Новость о стрельбе заставила жителей Дакки начать всеобщую забастовку. В течение следующих двух дней на улицы вышло еще больше протестующих, и было еще больше случаев стрельбы со стороны полиции. Поддержка правительства среди бенгальцев уменьшается, и они все больше обращаются к левым партиям. Левые обещают поддержать волю народа и обязуются поддержать языковое движение."
 PAK_Military.0.d: "Ряд британских военных офицеров были оставлены после раздела, чтобы заполнить пробелы и подготовить офицеров к занятию важных должностей в военном командовании. Во время недавней Кашмирской войны британские офицеры не подчинились приказам правительства направить пакистанские войска на фронт, что значительно затруднило военные действия. Правительство считает, что удаление этих офицеров необходимо для обеспечения национальной безопасности. Чтобы добиться этого, правительство недавно объявило, что предложит британским офицерам, служащим в пакистанской армии, лишь годичное продление их текущих контрактов, срок которых истекает в ближайшее время. Практически все британские офицеры отказались от продления, и в ответ правительство объявило, что через несколько месяцев в Пакистане произойдет национализация армии. В ВВС и ВМС, однако, многие британские офицеры останутся в силу необходимости, но в последующие годы они будут постепенно сокращены. Пресса горячо приветствовала эти усилия военных по национализации. Офицеры пакистанской армии также рады перспективе быстрого продвижения по службе, чтобы заполнить новые пробелы."
 PAK_Military.1.d: "Правительство Пакистана объявило, что генерал Айюб Хан приступил к исполнению обязанностей главнокомандующего армией Пакистана. Он стал первым главой армии из местных жителей, и его повышение вызвало большой резонанс в прессе. Высокий офицер-патанец, сын колониального железнодорожного чиновника, был одним из первых индийцев, принятых на службу в британскую индийскую армию после окончания Королевского военного колледжа в Сандхерсте. Во время Второй мировой войны он служил в звании полковника, руководя операциями в Бирме. После войны он занимал высшие командные должности как в Западном, так и в Восточном Пакистане. Вступив в должность, генерал пообещал верность армии Пакистана и пообещал, что возглавит усилия, направленные на то, чтобы начать инкорпорировать этнические группы, долгое время исключенные из вооруженных сил колониальным государством, и создать подлинно национальные силы для нации. Его комментарии были хорошо восприняты прессой"
 Bogra_PM.1.d: "Премьер-министр Хаваджа Назимуддин был отстранен от должности генерал-губернатором Гуламом Маликом, который воспользовался специальными полномочиями, предусмотренными Актом о правительстве Индии 1935 года. Некоторые приветствуют это решение, поскольку Назимуддин оказался неэффективным как во время языковых дебатов, так и во время беспорядков в Лахоре, а также в том, чтобы остановить рост популярности левых партий в стране. Однако других беспокоит то, что генерал-губернатор использует полномочия, установленные колониальным режимом для обеспечения контроля над управлением Индией. Чтобы заменить Назимуддина, генерал-губернатор отозвал относительно неизвестного посла в США Мохаммада Али Богра и убедил его стать новым премьер-министром. Назначение карьерного дипломата удивило нацию, и многие сомневаются, сможет ли он управлять все более разделенным политическим ландшафтом. Однако бенгальцы среднего класса надеются, что он сможет успокоить напряженность в Восточном Пакистане. Популярный в Вашингтоне, Соединенные Штаты, как говорят, в восторге от нового премьера."
 Bogra_PM.2.d: "Премьер-министр Али Богра на Учредительном собрании изложил то, что называют \"формулой Богры\". Премьер-министр назвал свои предложения политическим компромиссом для обоих крыльев страны. Она предусматривает создание Национальной ассамблеи на основе пропорционального представительства и Сената с равным представительством от четырех провинций Западного Пакистана, по сути, завершающего единое целое. Он также предложил формулу резервирования мест, которая в конечном итоге приведет к созданию парламента, в котором Восточный Пакистан будет иметь больше мест, но благодаря системе резервирования представители Западного Пакистана будут уравновешены. Вопросы между палатами будут решаться на совместном заседании, а должность генерал-губернатора потеряет многие полномочия, и титул будет заменен на президентский. Компромисс широко приветствуется по всей стране. Однако, как говорят, ограничение полномочий и смещение власти в сторону законодательной ветви заставляет генерал-губернатора, военных лидеров и офицеров гражданской службы нервничать."
 Bogra_PM.3.d: "Хотя премьер-министр Али Богра приложил много усилий для окончательной доработки конституции, и единый блок, и его формула Богры зашли в тупик на пути к окончательной конституции. Учредительное собрание недавно пришло к выводу, что генерал-губернатор Гулам Малик препятствует усилиям по достижению политического компромисса в стране. Пытаясь взять ситуацию под контроль, премьер-министр разрешил Учредительному собранию обсудить законы, которые ограничат полномочия генерал-губернатора и не позволят ему отправить в отставку нынешнее правительство, как он сделал это с его предшественником. В ответ Гулам Малик распустил Учредительное собрание, хотя и не отстранил правительство Богры. Члены собрания подали в суд на генерал-губернатора за его действия, и в разгар этой политической борьбы генерал-губернатор попросил отпуск по болезни. Гулам Малик уехал на лечение за границу, а министр внутренних дел, кадровый офицер государственной службы Искандер Мирза был назначен исполняющим обязанности генерал-губернатора."
 Bogra_PM.4.d: "Искандер Мирза, исполняющий обязанности генерал-губернатора, сразу же начал конфликтовать с премьер-министром Али Богра. Он считал, что Богра и его планы конституционного компромисса резко увеличат диспропорции во власти между провинциями и приведут страну к краху. Премьер-министр Али Богра был непреклонен в своем желании дать стране конституцию и начал обсуждать с политическими союзниками планы по ограничению полномочий генерал-губернатора после прихода нового собрания. Однако Мирза действовал первым: он объявил об отставке премьер-министра Али Богра и сообщил генерал-губернатору, которого он замещал, Гуламу Малику, что он также отстранен от должности. Хотя Али Богра официально подал в отставку, многие считают, что генерал-губернатор заставил его уйти в отставку. Теперь уже бывший премьер-министр вернулся на свою прежнюю должность посла в США. Поскольку новое законодательное собрание начинает формироваться, многие считают, что новый генерал-губернатор выберет ту политическую фракцию, которая гарантирует ему власть."
 Bohla_Cyclone.1.d: "По мере того как последствия тропического шторма «Нора» продвигались к Бенгальскому заливу, он медленно трансформировался в циклон под названием Bohla. Этот разрушительный шторм обрушился непосредственно на Восточный Пакистан, двигаясь на север, пока не закончился в Ассаме. Шторм привел к многочисленным жертвам, число погибших исчислялось десятками тысяч. Метеорологический департамент Пакистана не смог предсказать или предупредить население о шторме, что привело к еще большим потерям. Хотя пакистанские военные в Восточном Пакистане развернули самолеты, корабли и войска для оказания помощи, многие бенгальцы в ярости на правительство. Федеральное правительство не смогло скоординировать ответные меры, и многие жалуются на массовую нехватку гуманитарной помощи. Для многих бенгальцев недостаточная реакция воспринимается как подтверждение того, что федеральное правительство считает Восточный Пакистан второсортным."
 Bohla_Cyclone.2.d: "Стационарный циклон быстро ускорился к северу от Бенгальского залива и к вечеру достиг суши в Восточном Пакистане, недалеко от Читтагонга. Метеорологический департамент Пакистана объявил тревогу, но многие местные жители не знали, что это означает. Ветры со скоростью 144 км/ч, штормовой прилив достигал 4 метров. Последствия были разрушительными. По сообщениям местных властей, шторм уничтожил целые деревни и население островов. В районах, пострадавших от урагана, по сообщениям местных жителей, было разрушено почти девяносто процентов строений. Пострадали миллионы людей, а число жертв исчисляется сотнями тысяч. Правительство утверждает, что оказывает максимально возможную поддержку, но СМИ и местные жители критикуют ответные меры. По оценкам, ущерб огромен, и в настоящее время готовится международная помощь."
 COMPAK_Kashmir.1.d: "Оснащенный советским оружием и проникнутый уверенностью своих советских советников, генерал Акбар Хан предъявил партии ультиматум. Генерал отметил, что подобные ему офицеры, поддержавшие переворот, сделали это из убеждения, что в Кашмире необходимо действовать, пока Индия не стала слишком могущественной. Теперь Акбар Хан заявил, что настало время действовать для успешного решения проблемы Кашмира. Высшее руководство партии, прочитав это требование к действиям, считает, что страна не готова к таким действиям, поскольку революция продолжается. Тем не менее, они считают, что есть два варианта. Первый - дать Акбар Хану \"зеленый свет\" для начала пограничной стычки с Индией, что на некоторое время должно умерить аппетиты военных. Другой вариант - отстранить Акбар Хана и заменить его кем-то более хладнокровным, например, генералом Мусой Ханом."
 COMPAK_Kashmir.2.d: "Недавний конфликт закончился победой наших сил. Благодаря революционному пылу и мастерству наших войск мы одержали победу над нашим врагом. У них нет должной мотивации, чтобы противостоять нашим силам. Нация была воодушевлена нашим успехом, а те, кто участвовал в операциях, получают множество похвал в средствах массовой информации. Высшее военное командование, несомненно, очень довольны результатами и будут довольны до поры до времени. Политическое руководство также удовлетворено результатами, поскольку использует их в качестве обоснования необходимости революции. Ограниченный масштаб операции был достаточным, чтобы удовлетворить наши цели, и не был достаточной эскалацией, чтобы подтолкнуть индийцев к расширению своих операций. Благодаря этому успеху мы продолжим наращивать наши вооруженные силы и готовиться к будущему окончательному решению нашего спора с индийцами\". Индийские СМИ преуменьшают значение последних событий как незначительной пограничной стычки с неясным результатом."
 COMPAK_Kashmir.3.d: "Несмотря на доблестные и отважные усилия наших вооруженных сил на границе, недавние боевые действия прошли не так, как мы надеялись. Противник оказался гораздо более жестким, чем предполагалось\". Наши средства массовой информации изображают сражения как героические усилия, увенчавшиеся успехом, хотя в армии правда широко известна, и моральный дух был подорван этой неудачей. Некоторые офицеры даже поговаривают, что причиной неудачного выступления стали недавние чистки и новое руководство. С теми офицерами, которых мы выявили, будет проведена соответствующая работа. Несмотря на неудачу, результаты охладили некоторых из наиболее ястребиных лидеров в армии. Это значительно укрепит руки нашего партийного и политического руководства. Мы сможем сосредоточиться на преобразовании страны и наращивании потенциала и революционного пыла наших военных. Когда придет время, мы нанесем удар, который освободит не только народ Кашмира, но и всех трудящихся Индии."
 Bangladesh_Independence.1.d: "Новость о том, что Айюб Хан занял пост президента, вызвала массовые толпы людей по всему Восточному Пакистану, особенно в Дакке. Жители Восточного Пакистана уже давно чувствовали себя обделенными вниманием со стороны центра, и это новое событие, похоже, подтвердило их подозрения, что переворот был заговором военных, доминирующих в Западном Пакистане, с целью захвата страны, тем более что теперь они сместили бенгальца Искандара Мирзу. Растущие толпы в Дакке прошли практически беспрепятственно, поскольку местная полиция, похоже, не хотела вмешиваться. Небольшое количество солдат из 14-й дивизии, охранявших Ассамблею Восточного Пакистана, были вынуждены с боями пробиваться в район расквартирования, что привело к большим потерям среди гражданского населения и военных. Сейчас район расквартирования находится фактически в осаде, а местные батальоны Восточнопакистанских стрелков по всему Восточному Пакистану массово переходят на сторону народа. Практически все их западнопакистанские соотечественники сейчас находятся под вооруженной охраной."
 Bangladesh_Independence.2.d: "С момента обретения независимости пакистанское правительство держит в Восточном Пакистане небольшой гарнизон, состоящий из 14-й дивизии. Эти силы базируются на базе расквартирования в Дакке, но в настоящее время находятся в осаде бунтующих бенгальских демонстрантов, выступающих против переворота, начатого военными. В Западном Пакистане, по расчетам военных, возможности ограничены, так как переброска подкреплений по воздуху невозможна. Повстанцы в Дакке захватили Ассамблею Восточного Пакистана и провозгласили свое правопреемство от Пакистана, заявив о независимости Бангладеш. Единственные другие силы - это местные Восточнопакистанские стрелки, которые в большинстве своем дезертировали и взяли в плен своих западнопакистанских коллег. Повстанческие силы заявили, что позволят всем пакистанским военным покинуть страну, если правительство пообещает не вступать в вооруженный конфликт. Командир 14-го отряда отмечает, что его силы испытывают острую нехватку снаряжения, но будут сражаться, если правительство прикажет, несмотря на то, что их семьи находятся с ними в расквартировании."
 Bangladesh_Independence.3.d: "Правительство Пакистана объявило, что не будет рисковать жизнями своих солдат в безнадежной демонстрации или рисковать потерями невинных гражданских лиц, которые попадут под перекрестный огонь. Президент Айюб Хан отметил, что уже идет воздушная переброска, и самолеты из нескольких дружественных государств прибывают в Дакку, чтобы помочь в транспортировке 14-й дивизии, западнопакистанских военных с Восточнопакистанскими стрелками и лояльных правительственных служащих обратно в Западный Пакистан. Он заявил, что правительство рассматривает Бангладеш как мятежную территорию, но утверждает, что будет стремиться к переговорам в будущем, чтобы в конечном итоге воссоединить страну. Многие в Западном Пакистане рады прекращению насилия и возвращению войск, но в стране зреет глубокое чувство гнева. Многие утверждают, что независимая Бангладеш угрожает основам существования Пакистана, а многие левые отмечают, что эти драматические преобразования не произошли бы, если бы военные оставались в казармах."
 Bangladesh_Independence.4.d: "Пакистанское правительство приказало 14-й дивизии держаться до конца за честь своей страны, а затем отвергло требования так называемого бангладешского правительства. В течение нескольких часов бойцы повстанцев, подкрепленные прибытием дезертировавших пакистанских частей, вступили в уличные бои в районе расквартирования. Пакистанские войска держались несколько дней, но потом у них закончились боеприпасы, и вскоре они были разбиты. Обе стороны понесли тяжелые военные потери, а также потери среди гражданского населения, поскольку жилые районы превратились в поле боя. В этом хаосе семьи военнослужащих, проживающих в местах расквартирования, также понесли потери в результате боевых действий и их последствий. Оставшиеся в живых военнослужащие и члены их семей содержатся под стражей. Правительство Бангладеш приняло резолюцию в честь героических жертв своего народа против пакистанского государства и отметило, что Пакистан посылает тысячи людей в бой без какой-либо разумной цели. На международном уровне действия Пакистана решительно осуждаются, но внутри страны народ поддерживает правительство и своих мучеников."
 PAK_ECON.1.d: "После обретения независимости Пакистан унаследовал один из крупнейших в мире регионов по производству джута в Восточном Пакистане и крупные районы по производству хлопка в Западном Пакистане. У правительства есть средства на развитие, и оно должно решить, использовать ли эти средства для строительства предприятий по переработке хлопка в Западном Пакистане или джута в Восточном Пакистане. Некоторые чиновники отмечают, что такие инвестиции помогут сделать пакистанский хлопок более конкурентоспособным на мировом рынке. Другие же утверждают, что джутовая промышленность имеет большой потенциал, но разделение оставило многие перерабатывающие предприятия в индийской Бенгалии. Размещение этих предприятий в Восточном Пакистане поможет восстановить джутовую промышленность и позволит ей процветать."
 PAK_ECON.2.d: "Одной из насущных проблем Пакистана в период независимости было отсутствие банков и финансовых средств, доступных новому государству. Создание Национального банка Пакистана помогло облегчить потребность в коммерческих банках. Он открыл свое первое отделение в Восточном Пакистане, чтобы помочь джутовой промышленности. Сейчас банк стремится к расширению и открытию новых филиалов. Одна группа чиновников считает, что банк должен открыть больше отделений в Карачи - быстро растущей столице страны. Другие утверждают, что успех в Восточном Пакистане должен быть расширен, и большее количество филиалов приведет к росту провинции."
 PAK_ECON.4.d: "Колониальные британцы долгое время пренебрегали Северо-Западной пограничной провинцией СЗПП из-за ее тяжелых условий и роли в англо-афганских войнах. В федеральном бюджете есть некоторый излишек денег, которые можно потратить на улучшение дорог в провинции. Однако альтернативный вариант есть в Восточном Пакистане, где во внутренних районах также ощущается нехватка дорог и улучшения инфраструктуры. Хотя территория современного Восточного Пакистана в колониальный период поставляла большое количество сырья, большая часть инвестиций в инфраструктуру ушла в нынешнюю Индийскую Бенгалию. Использование этих излишков для улучшения инфраструктуры в Восточном Пакистане может быть более полезным, чем инвестиции в СЗПП."
 PAK_ECON.3.d: "Министр финансов сообщил нам, что две растущие корпорации заинтересованы в получении широкого кредита от национального банка для поддержки экспансии на рынок производства стали. Одна из них - компания Mughal Traders, расположенная в Лахоре. Изначально они были импортерами железа и стали, но хотят создать собственное производство. Другая компания, подавшая заявку на расширение, - BSRM. Эта компания уже имеет небольшой сталелитейный завод, но хочет расширить и модернизировать оборудование для увеличения объемов производства. Обе компании имеют обоснованные предложения, но мы можем позволить себе поддержать расширение только одной из них."
 PAK_ECON.5.d: "С момента обретения независимости и Карачи, и Читтагонг выросли в известность. Оба они являются жизненно важными портами для страны. Кроме того, в обоих наблюдается приток беженцев, пытающихся найти новую жизнь в Пакистане. Недавно кабинет министров получил запросы на финансирование развития от этих двух городов. Оба города хотели бы расширить свои порты и стимулировать промышленное развитие, чтобы обеспечить работой вновь прибывших жителей. Поскольку наша страна все еще развивается и не обладает огромным богатством, кабинет министров должен решить, кто получит эти средства на развитие. Сторонники Читтагонга утверждают, что он заслуживает большего развития, поскольку Дакка пожинает больше всего ресурсов. Сторонники Карачи отмечают, что поскольку город является федеральной столицей, правительство должно поддерживать усилия, направленные на то, чтобы сделать его более развитым и привлекательным не только для жителей, но и для иностранных гостей."
 INDIA_PAK_COM.1.d: "Коммунистическая Партия Пакистана КПП образовалась через несколько месяцев после обретения независимости во время 2-й Всеиндийской конференции Коммунистической партии Индии. В ближайшие несколько недель в Дакке правящая КПП проведет свою первую Всеиндийскую партийную конференцию с участием представителей Коммунистической партии Индии. Две партии уже объявили, что будут тесно сотрудничать и возобновлять свою общую историю. Однако на конференции также будут обсуждаться три основных вопроса. Первый - должен ли Пакистан начать процесс превращения в базу для экспорта революции в Индию или ее соседей. Второй - откроет ли Пакистан свои границы и позволит ли индийским коммунистическим активистам и рабочим приехать и помочь стране. Наконец, будет решен вопрос о национализме и Бенгалии."
 Bengal_Question.1.d: "Бенгальские делегаты как Индийской коммунистической партии, так и Коммунистической партии Пакистана CPP сидят вместе и часто голосуют вместе на протяжении всей конференции. Этот мощный блок избирателей вынес на обсуждение идею уважения национального суверенитета и утверждает, что революция может быть осуществлена более эффективно, если Восточному Пакистану будет предоставлена полная автономия. Социалистическая Республика Бангладеш сможет напрямую мобилизовать рабочих и крестьян, так как они более развиты в своем классовом сознании, чем в Западном Пакистане. Наконец, они могли бы также помочь в общении и мобилизации индийского бенгальского рабочего класса. Руководство КПП тщательно рассмотрело это предложение, и оно получило широкую поддержку. Однако многие опасаются, что разделение страны оттолкнет реакционные и антиреволюционные классы Пакистана, которые попытаются использовать такой шаг как признак слабости. Это будет последняя тема, по которой конференция примет решение."
 Ayub_Khan.1.d: "Генерал Айюб Хан, главный администратор военного положения, объявил, что Искандер Мирза подал в отставку и передал свои полномочия ему. Генерал объявил, что он примет титул президента, повысит свое звание до фельдмаршала и уйдет с поста главнокомандующего армией. Новым главой армии станет генерал Мухаммад Муса. Президент Айюб Хан пообещал, что военное вмешательство продлится только до тех пор, пока в стране не будет создана система управления, которая будет действовать в интересах всех граждан и не будет подвержена коррупции и грязной политике последнего десятилетия. Многие в Пакистане аплодируют новому президенту, поскольку считают Мирзу частью старого политического класса. Его отставка и отлет в Лондон рассматриваются наблюдателями как свидетельство того, что Айюб Хан победил в борьбе за лидерство в Пакистане."
 Ayub_Khan.2.d: "Президент Айюб Хан в последние недели проводил встречи с высокопоставленными бюрократами, офицерами государственной службы и судебными чиновниками. Он отметил, что с момента обретения независимости именно они и военные поддерживали функционирование пакистанского государства, поскольку политики постоянно ссорились и пытались свергнуть друг друга, что привело к неэффективности политического руководства. Президент призвал эти группы работать вместе с ним и обеспечить пакистанскому народу более эффективное правительство и не допустить негативного влияния режима военного положения на управление страной. Он отметил, что у военных мало знаний в области управления, и их поддержка будет жизненно необходима. Эти высокопоставленные чиновники были очень восприимчивы к президенту, и похоже, что формируется альянс военных и гражданских служащих для управления страной."
 Gilgit.1.d: "Правительство Пакистана подтвердило, что оно взяло на себя прямое управление Гилгит-Балтистан, а правительство Азад Кашмира согласилось передать управление. Причина этого в том, что Гилгит-Балтистан  - более густонаселенный регион Гилгит не связан напрямую с Азад Кашмиром. Более важно то, что во время Кашмирской войны именно гильгитские скауты под командованием майора Уильяма Брауна и жители этого района освободились от кашмирского правительства, они поклялись в верности не новому независимому Кашмиру, а Пакистану. Индийское правительство осудило это заявление и заявило, что мы присоединяем Гилгит-Балтистан к историческому Кашмиру, чтобы в будущем мирном соглашении мы не рисковали потерять эти земли. Наше правительство отвергло предложение Индии как смехотворное."
 USA_PAK.1.d: "Премьер-министр Пакистана недавно завершил обширный государственный визит в США. В эту поездку премьер-министр прибыл с высокопоставленными членами кабинета министров. Во время поездки министры встретились со своими коллегами, а премьер-министр провел обстоятельные переговоры с президентом. Премьер-министр также выступил перед Конгрессом, рассказав о чаяниях и ранней борьбе Пакистана. Он осмотрел основные достопримечательности, а в Пентагоне подчеркнул свое желание видеть Пакистан вооруженным для борьбы с любой угрозой, особенно с коммунизмом. Визит завершился шикарным государственным ужином, а перед отъездом премьер-министр пригласил американского президента посетить Пакистан в ближайшее время. Американские СМИ были весьма впечатлены премьер-министром, в то время как СМИ Пакистана с гордостью отметили впечатляющий протокол, предоставленный их лидеру. Американский президент пообещал помочь решить проблему нехватки сельскохозяйственной продукции, с которой сталкивается Пакистан."
 Rawalpindi.1.d: "Премьер-министр недавно узнал о заговоре против правительства с участием офицеров армии и высокопоставленных левых, составленном командующим армией. Информация поступила от одного из предполагаемых заговорщиков, который сообщил, что присутствовал на вечеринке, где видел видных левых и по крайней мере одного высокопоставленного генерала. Он заявил, что они делали заявления, в которых унижали нынешнее руководство за то, что оно не мобилизовало население и не вторглось в Кашмир как можно скорее. Офицер добавил, что, по его мнению, они обсуждали, насколько положительным для армии будет создание нового левого правительства, но заявил, что не слышал никаких конкретных планов. Начальник армии спросил премьер-министра, хочет ли он действовать и арестовать заговорщиков или оставить их в покое. Хотя арест заговорщиков устранил бы угрозу, некоторые советники считают, что полученная информация скудна, и аресты могут привести к тому, что правительство будет выглядеть слабым и поставит военных в неловкое положение."
 Rawalpindi.2.d: "Сегодня нация была ошеломлена, когда газеты опубликовали пресс-релиз премьер-министра, в котором он сообщил об аресте пятнадцати офицеров и видных левых активистов, включая членов Коммунистической партии Пакистана, в связи с заговором с целью свержения правительства. В заявлении отмечается, что генерал Акбар Хан стремился насильственно свергнуть правительство и установить коммунистический режим, чтобы начать кампанию внутренних репрессий и войны. Среди арестованных офицеров - несколько полковников и майоров, а среди арестованных левых - известный поэт Фаиз Ахмед Фаиз. Все заговорщики будут быстро преданы суду и привлечены к ответственности. Многие в Пакистане приветствуют быстрые действия премьер-министра по раскрытию этого заговора в Равалпинди. Однако критики отмечают отсутствие доказательств, представленных в заявлении, а некоторые предполагают, что сама армия может не заслуживать доверия."
 Rawalpindi.3.d: "Высокоорганизованные коммунистические кадры в Дакке и Карачи сегодня утром одновременно ворвались в правительственные здания. Они взяли в заложники многих политиков и чиновников, и когда премьер-министр позвонил в военный штаб с требованием принять меры. Однако, позвонив, он обнаружил, что большинство старших командиров задержаны, а старшие офицеры, симпатизирующие коммунистам, захватили штаб. Взяв штаб под свой контроль, лидеры переворота приказали местным военным подразделениям не вмешиваться в борьбу с коммунистическими кадрами, и вскоре правительство капитулировало перед переворотом, возглавляемым генералом Акбар Ханом. За предыдущие годы в результате заговора, в котором участвовали офицеры и ведущие левые, сочувствующие офицеры были переведены на стратегические позиции, а коммунистические кадры были мобилизованы, чтобы действовать в нужный момент. Генерал Акбар Хан до сих пор минимизировал возможность контрпереворота благодаря задержанию старших генералов и своей репутации знаменитого командира борцов за свободу во время Кашмирской войны."
 Rawalpindi.4.d: "В ходе недавнего переворота альянс левых активистов, недовольных военных и Коммунистической партии Пакистана КПП действовал согласованно, чтобы захватить власть. На недавнем партийном собрании КПП объявила о назначении знаменитого поэта Файза Ахмеда Файза новым лидером Пакистана. Благодаря своей поэзии он имеет сильную поддержку и левые убеждения, а его происхождение как бывшего военного делает его приемлемым для многих левых офицеров. Он будет координировать усилия партии по объединению фракций и началу процесса преобразования Пакистана и ликвидации неравенства. Генерал Акбар Хан, возглавлявший военных офицеров, и Саджад Захир, бывший глава КПП, признают, что им не хватает национальной привлекательности Фаиза Ахмеда Фаиза, но ожидается, что они будут править в тесном контакте с ним и получат руководящие должности."
 PAK_ASSASIN.2.d: "В ошеломляющей трагедии любимый премьер-министр Пакистана Лиакат Али Хан был застрелен сегодня в Равалпинди. Он выступал перед гражданами в парке, когда на него напал стрелок. Полицейские немедленно открыли ответный огонь и убили убийцу. Убийца был опознан как Саид Хан, гражданин Афганистана. Правительство расследует его мотивы, но, похоже, что это был поступок беспокойного человека, а не заговор, хотя многие в стране подозревают афганский заговор. В стране уже объявлен траур: из соседних штатов и от ведущих политиков Пакистана и Индии приходят послания с выражением сочувствия. У премьер-министра Лиаката Али Хана остались жена и трое детей."
 PAK_ASSASIN.1.d: "Убийство Лиаката Али Хана погрузило Пакистан в траур, но также и в ощутимое чувство неопределенности. Премьер-министр Али Хан провел Пакистан через трудные первые годы независимости, и его считали единственным лидером, способным направлять Учредительное собрание в его трудной миссии по созданию конституции. Для Мусульманской лиги потеря Лиаката Али Хана привела к новым опасениям, что партия может распасться. Али Хан умело поддерживал единство многочисленных групп, связанных с партией, и пока неясно, сможет ли партия выстоять без него. Пост премьер-министра теперь нуждается в новом лидере, и члены Учредительного собрания изо всех сил пытаются найти лидера, обладающего национальной легитимностью. Многие призывают генерал-губернатора уйти в отставку и взять на себя ответственность, поскольку никто в собрании не выглядит способным на это. Для народа Пакистана Лиакат Али Хан стал Шахид-и-Миллат, мучеником нации."
 PAK_Constitution.0.d: "Премьер-министр Лиакат Али Хан поручил Хавадже Назимуддину создать комитет для определения основополагающих принципов, которые будут определять будущую конституцию. Отчет был недавно опубликован. В докладе утверждалось, что национальным языком будет только урду, и предлагалось создать законодательный орган, в котором места будут распределены поровну между Западным и Восточным Пакистаном. В нем также содержался призыв к созданию совета улемов для изучения всех законов и подтверждения их соответствия исламу. Доклад вызвал бурную реакцию в прессе, особенно со стороны меньшинств и бенгальцев в Восточном Пакистане. Меньшинства считают совет улемов проблематичным. Бенгальцы критиковали положение о языке и равных местах, отмечая, что равное представительство обоих крыльев недемократично и игнорирует тот факт, что население Восточного Пакистана больше. Услышав эту критику, премьер-министр Лиакат Али Хан попросил комитет вновь собраться и представить форму позже."
 PAK_Constitution.1.d: "Учредительное собрание официально одобрило первую конституцию Пакистана. Правительство объявило о прекращении действия всех законов и правил колониальной эпохи, которые управляли страной, пока оно работало над созданием конституции. Новая конституция отменяет статус доминиона и объявляет, что государство будет называться Исламской Республикой Пакистан. Это будет парламентская система с одной палатой, называемой Национальной Ассамблеей. Восточный и Западный Пакистан будут иметь равное количество представителей. Президент будет церемониальным, но будет обладать чрезвычайными полномочиями в случае необходимости, а государственными языками будут урду, английский и бенгальский. Правительство получило высокую оценку за свои усилия, поскольку оно тесно сотрудничало с оппозицией для окончательной доработки документа. Генерал-губернатор Искандар Мирза станет президентом. Несмотря на то, что конституция была хорошо принята, есть некоторые опасения по поводу чрезвычайных полномочий президента и положений, дающих центру право вмешиваться в дела провинциальных органов власти."
 PAK_Constitution.2.d: "Учредительное собрание официально одобрило первую конституцию Пакистана. Новая конституция отменяет статус доминиона и объявляет, что государство будет называться Исламской Республикой Пакистан, покончив с последними следами колониализма. Это будет парламентская система с двумя палатами. Хотя места будут распределяться пропорционально численности населения, что даст Восточному Пакистану больше мест, в конституции есть положения о резервировании мест, что в совокупности создает паритет. Конституция очень похожа на формулу Богры и подчеркивает важность независимой судебной системы. В стране будет три государственных языка, бенгальский, урду и английский, а права провинций гарантируются парламентом. Однако президент, хотя он в значительной степени церемониален, имеет определенные чрезвычайные полномочия по смещению провинциальных и федеральных правительств. Считается, что это было добавлено для того, чтобы генерал-губернатор и будущий президент Искандар Мирза одобрил документ."
 PAK_Constitution.3.d: "Учредительное собрание официально утвердило первую конституцию Пакистана. Новая конституция отменяет статус доминиона и объявляет, что государство будет называться Исламской нацией Пакистана. Новая конституция предусматривает двухпалатный парламент, один из которых состоит исключительно из мусульманских мужчин с характером. Другой состоит из улемов со всей страны. Конституция определяет мусульман как тех, кто верит в истинность пророка, и объявляет шариатский суд высшей судебной инстанцией в стране. Главой государства будет Садар-и-Мумликат, что означает глава государства, и этот пост будет занимать нынешний генерал-губернатор Искандар Мирза. В будущем эта должность будет избираться двумя палатами парламента из числа своих членов. Эта должность также обладает чрезвычайными полномочиями, что, по мнению некоторых, было ценой, которую потребовал Мирза перед утверждением конституции. Реакция элиты, меньшинств и тех, кто связан с правительством, была чистым ужасом по поводу новой конституции."
 PAEC.1.d: "Правительство подтвердило создание Пакистанской комиссии по атомной энергии КАЭП. Это является кульминацией решения Пакистана принять участие в программе США \"Атом для мира\". Независимый орган объединяет ведущих ученых-ядерщиков и физиков пакистанского происхождения, которые будут работать над развитием ядерной энергетики как решения проблемы растущего спроса на энергию. Первым председателем станет уважаемый физик-экспериментатор д-р Назир Ахмед. КАЭП объявила, что не намерена заниматься исследованиями в области вооружений и надеется использовать новые технологии на благо пакистанского народа. Соединенные Штаты отмечают, что Пакистан с самого начала проявил большой интерес к этой энергетической технологии, и надеются помочь стране в удовлетворении ее энергетических потребностей. Стипендии и финансирование для молодых пакистанских ученых будут распределяться КАЭП для создания базы знаний, необходимой для мирной ядерной программы."
 PAK_INDIA.10.d: "Индийское правительство недавно предложило заключить с нашим правительством пакт об отсутствии войны. Это было сделано для того, чтобы поставить нас в неловкое положение на международной арене и попытаться представить Пакистан как страну, жаждущую войны. В ответ на их предложение наше правительство провело пресс-конференцию и отметило, что Пакистан хотел бы иметь мирные отношения с Индией и мечтает о том, чтобы обе страны работали бок о бок ради безопасности Южной Азии. Однако Индия прекрасно понимает, что мы не можем согласиться на такой договор до тех пор, пока остается гнойная рана Кашмира. Если индийское правительство выполнит резолюции ООН и будет работать над решением проблемы таким образом, чтобы признать желания кашмирцев, тогда, конечно, пакт о прекращении войны был бы разумным. Но учитывая нынешние обстоятельства, такой пакт невозможно серьезно рассматривать."
 Afghan_PAK.20.d: "С момента обретения Пакистаном независимости Афганистан постоянно бросает нам вызов на международном уровне. Афганистан голосовал против нашего вступления в Организацию Объединенных Наций, говорят, что он пытается разжечь восстания племен против нашего правительства. Это относится еще к британскому периоду, когда Афганистан утверждал, что патаны, проживающие на наших землях, принадлежат им. Теперь афганцы утверждают, что их договоры с британцами больше не действуют, и они претендуют на наши западные территории с населением патанов. Учитывая напряженность в отношениях с Индией, многие в правительстве считают, что продолжение конфликта с Афганистаном только вредит нам. Однако другие считают, что жесткий подход к афганцам гарантирует, что они не попытаются нанести нам удар в спину. Мы контролируем их доступ к международным товарам, мы можем пригрозить им этим."
 Gwadar.1.d: "Порт Гвадар долгое время находился под управлением султана Омана. Его притязания на порт были закреплены соглашениями с британцами и соседним княжеским государством Макран, которое ранее контролировало порт. После обретения Пакистаном независимости Макран присоединился к стране, но Гвадар остался под властью Омана. Недавно правительство Пакистана обратилось к правительству Омана, и после дружественных переговоров оманцы согласились вернуть Гвадар Пакистану на условиях купли-продажи. Это соглашение показывает, как братья-мусульмане могут работать вместе в интересах народа, и является контрастом индийцам, которые часто используют грубую силу при решении земельных претензий. Теперь, когда Гвадар защищен, у Западного Пакистана есть второй глубоководный порт, который он может развивать в будущем."
 Khan_PAK.1.d: "Министр иностранных дел Пакистана Зафарулла Хан доказал, что он является замечательным активом для нашего правительства. С момента обретения независимости он не только красноречиво защищал наше правительство, но и помогал продвигать ключевые резолюции ООН по Кашмиру, которые требовали сохранения права на самоопределение. В тех ранних дебатах по Кашмиру он постоянно переигрывал своих индийских оппонентов и добился того, что ни одна держава не наложила вето на принятые резолюции. Он также сыграл важную роль в содействии обсуждениям в ООН во время раздела Палестины и укрепил наши связи с США, открыто осуждая коммунистическую агрессию на международном уровне. Он остается шипом для индийской пропаганды по Кашмиру и считается великим представителем Кашмира в стране и уважаемым государственным деятелем за рубежом."
 Lahore_Riots.1.d: "Премьер-министр Хаваджа Назимуддин получил ультиматум от альянса улемов под названием Маджлис-и-Амал. Ультиматум требует отстранения ахмадитов от работы в правительственных учреждениях и объявления ахмадитов немусульманами. Конфликт вызван тем, что многие мусульманские общины считают, что ахмадиты, претендующие на статус мусульманской секты, не являются мусульманами, поскольку не верят в окончательность пророка. Хотя премьер-министр - консерватор с сильными религиозными убеждениями, он является строгим конституционалистом и отклонил ультиматум. К сожалению, это решение привело к беспорядкам в Лахоре, где сторонники Маджлис-и-Амаль грабят, разграбляют и разрушают дома, предприятия и молельные дома живущих там ахмадитов. Полиция, как говорят, присоединяется к бунтовщикам, и теперь премьер-министр должен объявить военное положение и ввести войска."
 Lahore_Riots.2.d: "Беспорядки против ахмадитов, охватившие город несколькими неделями ранее, в основном подошли к концу. После того как премьер-министр развернул пакистанскую армию для восстановления порядка и введения военного положения, граждане страны были взволнованы тем, как быстро армия добилась успеха. Уже через несколько часов после вступления в город уровень насилия начал снижаться, поскольку войска строго ввели комендантский час. В отличие от полиции, военные соблюдали дисциплину, и никто не присоединился к протестующим. Военное положение остается в силе, но жизнь в городе возвращается в нормальное русло. Главные имамы, участвовавшие в протестах, были приговорены военными судами к смертной казни, хотя многие подозревают, что приговоры будут заменены на пожизненные сроки. Жители Лахора сообщают о дружественном взаимодействии с армией. Программа благоустройства, запущенная армией, заставляет некоторых жителей шутить, что военные оставляют Лахор красивее, чем до беспорядков. Некоторые в Пакистане теперь задаются вопросом, предлагают ли парни в хаки больше стабильности, чем политики в Карачи."
 PAK_1955.1.d: "Учредительное собрание вновь собралось после его роспуска генерал-губернатором. Новое собрание состоит из трех фракций - Тройственного союза, который объединяет разделенную консервативную фракцию, управлявшую страной с момента раздела. У Объединенного фронта также есть сторонники в ассамблее, они состоят из левых, многие из которых выходцы из Восточного Пакистана, недавно активизировавшиеся из-за дебатов о языке. Им также выгодно мнение, что восточнопакистанцы ущемлены истеблишментом. Наконец, есть Джамаат-и-Ислами, главная исламистская партия в стране. Джамаат продолжает испытывать политические трудности из-за своей оппозиции по поводу создания Пакистана, но все еще имеет впечатляющую сеть низовых организаций по всей стране. Генерал-губернатор должен решить, сохранить ли Тройственный альянс у власти, пойти на поводу у популярного, но опасного Объединенного фронта или позволить Джамаат-и-Ислами взять власть."
 Ahmedi.1.d: "Недавно парламент принял новый законопроект, который, по его утверждению, окончательно решает ахмадийский вопрос. Законопроект объявляет ахмадийцев немусульманами, поскольку они не соответствуют конституционным требованиям, предъявляемым к мусульманам, и освобождает всех осужденных за участие в недавних беспорядках в Лахоре. В законопроекте отмечается, что те мусульмане, которые участвовали в беспорядках, были движимы страстью и желанием защитить веру и не могут быть наказаны за исполнение воли Бога. Законопроект запрещает ахмадитам быть похороненными на мусульманских кладбищах или называть свои молельные дома мечетями. Известие о законопроекте уже привело к тому, что многие ахмадийские предприятия закрылись, а дома выставлены на продажу. Западные посольства заваливают просьбами о предоставлении убежища, а одна из крупнейших деловых общин Лахора, похоже, массово покидает страну."
 PAK_REl.1.d: "Правительство Джамаат-и-Ислами объявило, что увеличит число имамов на базах и в воинских частях. Кроме того, оно отметило, что корпус капелланов будет переименован в корпус имамов, поскольку в ближайшие несколько лет планируется объявить об исключении немусульман из вооруженных сил. Увеличение числа имамов призвано повысить моральный дух бойцов, и имамы будут иметь более высокий ранг, чем раньше. Они также будут наблюдать и следить за соблюдением правил веры. Хотя военные не отреагировали на это заявление, многие считают, что военные в ярости от такого вмешательства в их структуру и дисциплину. Многие офицеры отмечают, что их войска уже мотивированы патриотизмом и религиозным рвением защищать страну, а правительство явно им не доверяет."
 PAK_Afghan_Relations.1.d: "Афганистан всегда угрожал единству нашей нации. После обретения независимости они постоянно разжигают патанский национализм посредством своей кампании по созданию Пуштунистана. Кроме того, они постоянно отказываются признавать нашу границу по линии Дюранда. Мы подозреваем, что на протяжении многих лет они не только распространяли пропаганду, но и предпринимали тайные и открытые попытки поднять вооруженное восстание. До сих пор наши силы сохраняли бдительность по отношению к этой угрозе. Однако статус-кво больше неприемлем, тем более что у нас есть и другие проблемы в сфере безопасности. У нас есть два варианта действий в Афганистане. Мы можем либо начать диалог и укрепить двусторонние отношения, либо ответить на агрессию Афганистана нашей собственной жесткой линией и заставить их сесть за стол переговоров."
 PAK_Afghan_Relations.2.d: "Пакистанское правительство пригласило нас на переговоры в Пешавар. Из сообщений СМИ и бесед с их послами ясно, что пакистанцы стремятся протянуть нам оливковую ветвь. Хотя есть сторонники жесткой линии, которые выступают за то, чтобы мы отказались от переговоров, пока Пуштунистан не стоит на повестке дня, это, скорее всего, вызовет отторжение у непуштунских лидеров в стране. Они все чаще критикуют наше правительство за то, что оно называет одержимостью Пуштунистаном, которая дорого обошлась стране в плане торговли. Мы отправим делегацию, но самым высокопоставленным членом делегации будет министр иностранных дел, таким образом, мы сможем удовлетворить и сторонников жесткой линии, и умеренных. Приверженцам жесткой линии понравится идея не посылать больше высокопоставленных чиновников, в то время как умеренные приветствуют возможность мирных переговоров. Переговоры состоятся через неделю."
 PAK_Afghan_Relations.3.d: "Министр иностранных дел Афганистана прибыл в Пешавар, чтобы провести переговоры с высокопоставленными пакистанскими лидерами по нерешенным вопросам между двумя государствами. Пакистанское правительство устроило афганцам большой прием и организовало экскурсии на первые несколько дней, включая осмотр знаменитого форта Бала-Гиссар. В ходе визита произошел небольшой недочет: афганские СМИ раскритиковали министра иностранных дел за посещение бывшей королевской резиденции афганской монархии, которая теперь является штаб-квартирой оккупационных военных сил, по мнению Афганистана. Несмотря на эти незначительные проблемы, переговоры уже начались, и пакистанское правительство не скрывает своих надежд на достижение прорыва."
 PAK_Afghan_Relations.4.d: "Правительство Пакистана отметило, что считает линию Дюранда официальной границей обоих государств, несмотря на критику Афганистана. Однако оно также отметило, что после обретения независимости Пакистан принял решение вывести постоянные военные посты из Территории племен, чтобы уважать автономию племен. Пакистанцы заявляют, что это демонстрирует их стремление к миру в регионе и уважение к народам, живущим на границе. Более того, пакистанцы предложили еще больше ослабить пограничные ограничения на границе, чтобы афганские и пакистанские семьи, разделенные на границе, могли легче добираться друг к другу. На первый взгляд, это предложение кажется очень разумным и принесет пользу афганским семьям. Подписание соглашения представляется очень выгодным, особенно если мы хотим, чтобы в конечном итоге наступил мир. Однако некоторые в Кабуле опасаются, что это предложение является ступенькой для пакистанцев, чтобы убаюкать Афганистан и в конечном итоге заставить нас принять линию Дюранда."
 PAK_Afghan_Relations.5.d: "Министр иностранных дел Афганистана сообщил пакистанскому правительству, что предложение о более слабых границах неприемлемо. Министр настаивает, что единственным выходом из кризиса является вывод пакистанских войск из Пуштунистана и проведение референдума для принятия решения народом. Поскольку никакого прогресса не наблюдалось, переговоры были быстро завершены. Многие в Пакистане разочарованы неудачей переговоров, а некоторые лидеры оппозиции открыто критикуют президента за его неспособность урегулировать напряженность в отношениях с Афганистаном. Тем не менее, правительство считает, что оно должно было попытаться, и надеется, что со временем афганское правительство образумится. В Кабуле сторонники жесткой линии похвалили правительство за его твердую позицию, в то время как умеренные высказали критику по поводу негибкости, проявленной во время переговоров."
 PAK_Afghan_Relations.6.d: "В Пешаваре представители пакистанского и афганского правительства подписали соглашение об ослаблении пограничных ограничений, чтобы облегчить поездки между семьями, разделенными границей. Для Афганистана это соглашение принесет облегчение многим его гражданам, которые в течение многих лет ожесточенно критиковали пограничные ограничения. В Пакистане соглашение рассматривается как акт политической зрелости правительства и свидетельство его желания иметь мирные отношения с Афганистаном. Однако есть и критики соглашения. Сторонники жесткой линии в Кабуле обвиняют правительство в предательстве священного обещания о создании Пуштунистана, а в Пакистане некоторые выражают опасения, что более открытые границы могут привести к проникновению афганцев в страну. Тем не менее, большинство людей в обеих странах, похоже, довольны соглашением."
 PAK_Afghan_Relations.100.d: "После успешного соглашения с Афганистаном о более слабых границах, наши отношения позитивны, и мы находимся в хорошем дипломатическом положении. Некоторые чиновники считают, что сейчас самое время предложить референдум о Пуштунистане жителям Территории племен, а не Северо-Западной пограничной провинции или районов Белуджистана. Хотя афганцы утверждают, что референдум должен проводиться нейтральной стороной, мы можем просто сказать, что, поскольку в Зонах племен нет военных постов, можно не опасаться запугивания. Мы даже предложим подписать с Афганистаном обязательное соглашение об уважении результатов. По крайней мере, Афганистан оценит этот жест, и если они согласятся, мы уверены, что Территория племен останется в составе Пакистана."
 PAK_Afghan_Relations.7.d: "В необычном предложении пакистанское правительство предложило провести референдум по Пуштунистану. Однако есть некоторые оговорки, они ограничились только Территорией племен и будут сами проводить референдум. Это предложение демонстрирует, по крайней мере, желание пакистанцев прислушаться, и его можно оценить. Действительно, умеренные и некоторые сторонники жесткой линии в правительстве призывают нас принять это предложение. Если Территория племен проголосует за присоединение к Афганистану, это вполне может привести к общественному давлению в Пакистане, чтобы расширить референдум на СЗПП и Белуджистан. Однако многие сторонники жесткой линии и некоторые умеренные не согласны с этим. Они считают это предложение недружественным и уловкой, направленной на ослабление нашей позиции по этому вопросу. Они настаивают на том, что Пакистан не согласится на голосование, если не будет уверен в своей победе. Вместо этого они утверждают, что мы должны, по крайней мере, принять этот жест из лучших побуждений, но отказаться, поскольку он не охватывает весь Пуштунистан."
 PAK_Afghan_Relations.8.d: "Кабул сообщил нашему министру иностранных дел, что они приняли предложение о проведении референдума по Пуштунистану в Зонах племен. Мы уже разослали объявление о голосовании, которое состоится примерно через 90 дней. Реакция в Афганистане неоднозначна: одни называют это первым шагом к освобождению, другие утверждают, что это уловка пакистанцев. Подготовка уже началась, так как мы направили инструкции политическим агентам на территориях племен для мобилизации поддержки среди племенных лидеров. Кроме того, направляются разведывательные ресурсы, чтобы следить за тем, как люди планируют голосовать, и убедиться, что число сторонников Пакистана увеличится."
 PAK_Afghan_Relations.9.d: "Афганское правительство сообщило нам, что не одобряет предложение о проведении референдума по Пуштунистану в Зонах племен. Афганистан хотел бы, чтобы такое голосование включало весь Пуштунистан и в идеале проводилось через нейтральную третью сторону. Тем не менее, Афганистан отметил, что оценил этот жест как позитивное движение и надеется, что мы вскоре согласимся с необходимостью проведения всеобъемлющего референдума в будущем. Хотя наше предложение было отвергнуто, мы все же улучшили отношения, так как наше предложение вызвало дальнейшие разногласия внутри фракции сторонников жесткой линии в Кабуле, что только укрепляет позиции тех, кто выступает за мир."
 PAK_Afghan_Relations.10.d: "Вчера пришли долгожданные результаты недавнего референдума в Пакистанской зоне племен по вопросу о том, желает ли ее население присоединиться к Афганистану в составе Пуштунистана или остаться в Пакистане. Народ проголосовал за то, чтобы остаться в Пакистане. Правительство Пакистана похвалило жителей племен за их самоотверженность и преданность нации. Результаты голосования были получены на фоне обвинений в том, что пакистанские чиновники предлагали вождям племен стимулы, чтобы те поддержали голосование за Пакистан, а также сообщений о том, что жители, перемещавшиеся между Пакистаном и Афганистаном, считались не имеющими права голоса. Возможно, наибольшую критику вызвало то, что многие бюллетени были получены от патанцев, служащих в вооруженных силах, которые утверждали, что они из Территории племен. Пакистан удовлетворен результатами голосования, и его правительство утверждает, что никогда не сомневалось в лояльности своего народа. Реакция из Афганистана, вероятно, последует в ближайшее время."
 PAK_Afghan_Relations.11.d: "Кабул опубликовал резкое заявление, осуждающее недавний референдум, проведенный в Пакистанской зоне племен по вопросу о том, хотят ли жители остаться в Пакистане или присоединиться к Афганистану для создания Пуштунистана. Значительное большинство проголосовало за то, чтобы остаться в Пакистане. Однако афганское правительство утверждает, что в течение нескольких недель, предшествовавших голосованию, происходила широкомасштабная манипуляция избирателями. Кроме того, пакистанцы отказались подсчитывать голоса тех, кто регулярно пересекал границу, заявив, что неизвестно, являются ли они постоянными жителями пакистанской Зоны племен. Несмотря на эти проблемы, афганское правительство настаивает на том, что результаты голосования были нелегитимными, и оно не прекратит отстаивать идею Пуштунистана для миллионов пакистанцев, борющихся под пакистанской оккупацией."
 PAK_Afghan_Relations.12.d: "Правительство Пакистана в необычно язвительном заявлении осудило правительство Афганистана за постоянное вмешательство в дела Пакистана. Они обвиняют афганцев в стремлении начать вооруженные восстания и распространении ложных утверждений с целью отравить отношение Пакистана к своим гражданам вдоль границы. Правительство отметило, что у него есть собственные возможности, и если афганцы не успокоятся, Пакистану вскоре придется привести их в порядок, чтобы преподать им урок. Очевидно, что Пакистан близок к переломному моменту в отношениях с Афганистаном"
 PAK_Afghan_Relations.13.d: "Продолжая свой недавний переход к вражде, правительство Пакистана потребовало от Афганистана признать линию Дюранда в качестве официальной границы между двумя странами. Пакистанцы настаивали на том, чтобы афганцы перестали жить в причудливом мире и приняли реальность на земле. Оно отметило, что Афганистан признал границу при раджах, а поскольку Пакистан унаследовал эти земли, он должен уважать границу. Это агрессивный шаг со стороны Пакистана, и некоторые опасаются, что они могут рассматривать военные варианты. Некоторые в правительстве предлагают в частном порядке заверить пакистанцев, что у нас нет амбиций на их территорию, но мы не можем публично признать границу в данный момент. Приверженцы жесткой линии в правительстве настаивают на том, чтобы мы осудили пакистанское правительство за его издевательства и подтвердили нашу позицию."
 PAK_Afghan_Relations.14.d: "Афганское правительство направило посредника, чтобы сообщить нашему правительству, что Афганистан услышал наши предупреждения. Посредник настоял на том, что в настоящее время у Афганистана нет планов или желания изменить статус-кво на границе. Они также пообещали снизить уровень пуштунистанской пропаганды и будут стараться поддерживать как можно более теплые отношения. В обмен они попросили нас сдержать враждебные комментарии и держать каналы открытыми. Наше правительство примет это заявление и вскоре снизит градус риторики, мы достигли своей цели - использовать сильную позицию, чтобы подтолкнуть афганцев к миру."
 PAK_Afghan_Relations.15.d: "Афганское правительство демонстративно осудило наши недавние заявления и подтвердило свои претензии на Пуштунистан. Афганское правительство настаивает на том, что оно выполняет чистую и благородную миссию, и они не поддадутся на уговоры какой-либо иностранной державы. Похоже, что наш жесткий подход не привел афганцев к пониманию того, что их постоянная враждебность никому не выгодна. Более того, отношения только ухудшились, и мы должны сохранять бдительность на западной границе. Однако у пакистанской армии есть предложение, как твердо показать Афганистану серьезность нашей позиции и переломить ситуацию в нашу пользу"
 PAK_Afghan_Relations_Border_War: "Начать Пограничную Войну с Афганистаном"
 PAK_Afghan_Relations_Border_War_desc.d: "Афганское правительство продолжает поднимать вопрос о Пуштунистане и угрожает стабильности Пакистана. Смелый план Генштаба призывает наши силы вступить в пограничный конфликт с афганцами. Как только мы разгромим афганские силы на границе, их правительство осознает серьезность ситуации и одумается."
 PAK_Afghan_Relations.16.d: "Недавняя пограничная война между Пакистаном и Афганистаном закончилась победой пакистанских сил. Недавно пакистанские войска начали операции против афганских сил на границе. Многие аналитики полагали, что пакистанцы одержат верх в этом конфликте, и они оказались правы. Новости о поражении военных на границе вызвали панику в Кабуле, так как некоторые опасались, что пакистанские войска могут продвинуться вглубь страны. Однако пакистанское правительство остановилось, заявив, что его войска дали достойный ответ на многолетние притеснения со стороны Афганистана. Источники в Кабуле сообщают, что пакистанцам удалось добиться от афганского правительства обещания о ненападении в течение как минимум пяти лет. Пакистанская армия наслаждается публичными демонстрациями в свою честь в крупных пакистанских городах в знак признательности за успешные операции."
 PAK_Afghan_Relations.17.d: "Недавняя пограничная война между Пакистаном и Афганистаном закончилась победой афганской армии. Пакистанские войска начали боевые действия после нападения на афганские войска на границе. Многие аналитики полагали, что пакистанцы одержат верх, но это оказалось ошибочным предположением. Подробности неясны, но, похоже, пакистанские военные либо недооценили афганцев, либо переоценили себя. Афганские войска не только отбросили пакистанцев, но и в настоящее время занимают часть территории за границей, называя ее освобожденной землей Пуштунистана. Несмотря на предупреждения из Дели, правительство Пакистана не способно расширить конфликт и должно жить с тяжелыми последствиями этой неудачной кампании. В Кабуле ощущается радость и оптимизм от того, что мечта о Пуштунистане далека от фантазии."
 PAK_Afghan_Relations_Alt.1.d: "Посол Пакистана передал послание президента Айюб Хана с приглашением делегации провести переговоры в Пакистане. Послание было дружественным, и, похоже, пакистанцы хотят наладить отношения. Однако мы не можем позволить им убаюкать нас, чтобы мы бросили наших братьев по ту сторону границы. Некоторые советники предлагают отклонить приглашение, так как слова не могут решить наши проблемы. Однако другие утверждают, что мы должны принять приглашение, чтобы, по крайней мере, увидеть их позицию и, возможно, улучшить условия на границе в нашу пользу."
 PAK_Afghan_Relations_Alt.2.d: "Наши усилия по установлению контактов с Афганистаном принесли свои плоды, поскольку они согласились направить делегацию высокого уровня для проведения переговоров с нами. Мы можем ожидать их прибытия в ближайшее время и должны рассмотреть подход, который мы хотим использовать для переговоров. Президент Айюб, этнический патанец, крайне заинтересован в стабилизации отношений с Афганистаном и предотвращении беспорядков среди пакистанских патанов. Если такой сценарий произойдет, он может оказаться катастрофическим, особенно в том, что касается отношений с Индией. Мы можем занять примирительную позицию и подписать соглашения о расширении связей и культурных обменов. Или мы можем занять жесткую позицию и призвать Афганистан признать Линию Дюранда в качестве постоянной границы."
 PAK_Afghan_Relations_Alt.3.d: "В ходе переговоров с пакистанцами они предложили ряд мер, включая культурные обмены, которые призваны улучшить отношения. Предложение пакистанцев, несомненно, направлено на нормализацию отношений между нашими государствами. Расширение культурных связей позволит нам получать больше разведывательной информации и снизит некоторую напряженность в Кабуле. Однако принятие инициативы может запутать наш собственный народ и уменьшить его пыл в борьбе за Пуштунистан. Мы должны решить, какой шаг будет лучшим."
 PAK_Afghan_Relations_Alt.4.d: "На неожиданной встрече с пакистанцами они заявили о своем желании, чтобы мы признали Линию Дюранда в качестве постоянной границы. Поскольку это противоречит ключевому столпу нашей внешней политики, наша делегация немедленно отказалась. Казалось, что переговоры вот-вот закончатся, однако пакистанцы предложили компромисс. Они заявили, что если мы сможем дать частные гарантии того, что мы можем принять Линию Дюранда, то этого будет достаточно для них. Мы можем принять этот компромисс или отвергнуть его и прекратить переговоры."
 PAK_Afghan_Relations_Alt.5.d: "Президент Айюб получил известие о том, что правительство Афганистана отклонило наше приглашение провести переговоры. Это тревожное развитие событий и указывает на то, что они намерены попытаться изменить статус-кво. Афганцы, несомненно, вынашивают опасные планы, и мы должны сохранять бдительность на границе. Тем не менее, военные настаивают на том, что афганская угроза минимальна и может быть легко отслежена или сдержана. Президенту Айюбу придется признать, что эти усилия провалились."
 PAK_Afghan_Relations_Alt.6.d: "Афганцы оказались очень восприимчивы к нашим предложениям по нормализации отношений и приняли их. Они попросили лишь о незначительных корректировках, направленных на улучшение поездок для афганцев, имеющих родственников в Пакистане. Президент Айюб с энтузиазмом подписал соглашения и выпустил заявление, в котором отметил братские отношения между Пакистаном и Афганистаном. Афганское правительство опубликовало собственное, более сдержанное заявление, в котором одобрило соглашение, заявив, что оно поможет облегчить воссоединение афганцев со своими семьями через границу."
 PAK_Afghan_Relations_Alt.7.d: "Афганская делегация заявила, что не может в здравом уме принять наши щедрые предложения по нормализации отношений. Они настаивали, что до тех пор, пока мы продолжаем отказывать патанам в праве на Пуштунистан, они не могут пытаться наладить отношения. Мы сообщили им, что в таком случае обсуждать больше нечего. На этом переговоры завершились, и афганцы вернулись в Кабул. Мы опубликовали заявление, в котором выразили свое разочарование тем, что не удалось достичь прорыва. Афганцы выпустили собственное заявление, в котором обвинили нас в использовании переговоров как средства для достижения пропагандистской победы. Президент Айюб горько разочарован результатом."
 PAK_Afghan_Relations_Alt.9.d: "Афганская делегация вернулась и заявила, что готова дать частные гарантии относительно линии Дюранда. Они заявили, что в ближайшем будущем не будут поднимать вопрос о линии Дюранда или превращать его в основной камень преткновения. Президент Айюб очень доволен таким развитием событий. Афганская делегация вскоре вернулась обратно в Кабул. Правительство Пакистана опубликовало заявление, в котором назвало переговоры позитивным шагом и выразило надежду, что они приведут к будущим позитивным связям. Афганское правительство опубликовало собственное заявление, в котором говорится, что оно удовлетворено результатами переговоров."
 PAK_Dissolve_One_Unit_desc: "Единица создала искусственную и большую правительственную структуру. Она также стерла индивидуальные особенности нашего разнообразного населения. Эта политика оказалась непопулярной, особенно среди государственных служащих, которых размещали в районах, удаленных от их домов. Первоначальные четыре провинции Западного Пакистана теперь восстановлены."
 PAK_Expand_Provincial_Bureaucracy_desc: "Предыдущий режим чрезмерно централизовал власть в пользу президента и федеральных служб. Эта чрезмерная централизация замедляла развитие и эффективное управление на местном уровне. После восстановления провинций провинциальные гражданские служащие будут назначаться в гораздо большем количестве."
 PAK_Reduce_Federal_Authority_desc: "Правительство объявило о новой инициативе, которая ограничивает федеральное участие или вмешательство в дела провинций. Народ Пакистана должен доверять своим местным властям и действовать, не опасаясь никаких федеральных вмешательств."
 PAK_Launch_Anti_Pashtunistan_Campaign_desc: "Афганское правительство десятилетиями выступало за образование Пуштунистана. Они используют этот повод, чтобы поднять волнения среди нашего собственного патанского населения и заручиться поддержкой населения в Афганистане. Работая с местными чиновниками, мы начнем кампанию против Пуштунистана. Мы будем использовать новостные СМИ и радиопередачи для борьбы с афганской пропагандой."
 PAK_Afghan_Indian_Relations_desc: "Президент Фатима Джинна сильно критиковала Айюб Хана за слишком мягкие отношения с Индией. Она также согласилась позволить военным взять на себя ведущую роль в решении региональных вопросов. Она планирует бросить вызов Индии дипломатическим путем и позволить военным занять жесткую позицию в отношении Афганистана."
 PAK_Denounce_Indian_Stubborness_desc: "На пресс-конференции с международной прессой президент Фатима Джинна осудила индийское правительство за отказ вступить в конструктивный диалог. Она настаивала на том, что Индия остается единственным препятствием на пути к миру в Южной Азии."
 PAK_Military_Insists_On_Hardline_desc: "Пакистанские военные сообщают, что ситуация с безопасностью в регионе остается крайне напряженной. Индийцы продолжают увеличивать присутствие своих войск на границе. Афганистан остается мощной угрозой. Его правительство продолжает подстрекать население своим нелепым призывом к созданию Пуштунистана. Пакистан должен готовиться к худшему."
 PAK_Express_Solidarity_With_Kashmir_At_UN_desc: "Правительство Пакистана начало крупную дипломатическую кампанию в ООН. Они утверждают, что кашмирский народ остается жертвой политических игр Индии. Усилия нашли поддержку среди сочувствующих держав, и постоянный представитель Пакистана отметил, что просто повышение осведомленности - это большая победа."
 PAK_New_Afghan_Border_Posts_desc: "Пакистанская армия объявила о создании новых пограничных постов и развертывании дополнительных военизированных сил, патрулирующих территорию. Этим шагом будут существенно ограничены возможности трансграничных племен, которые регулярно перемещаются туда и обратно от границы. Афганское правительство подвергло эти действия резкой критике."
 PAK_Adopt_Universal_Suffrage_desc: "После непродолжительных дебатов Национальное собрание приняло несколько поправок к конституции, устанавливающих всеобщее избирательное право. Предыдущая система непрямых выборов через базовых демократов была отменена. Новые поправки получили широкое одобрение, поскольку многие пакистанцы приветствуют возвращение к демократическим правам."
 PAK_Transform_To_Parliamentary_System_desc: "Национальная ассамблея наконец-то приняла ряд поправок, превращающих Пакистан в парламентскую систему. Президент Фатима Джинна приветствовала эту новость, назвав ее возвращением к исторической норме. Это объединяющий успех для правящей коалиции."
 PAK_1965_Election.1.d: "Правительство объявило, что президентские выборы состоятся через три месяца, они обозначили, что кандидатам предстоит один месяц предвыборной кампании. 80 000 основных демократов будут действовать как коллегия выборщиков на непрямых выборах, выбирая кандидата. Будет проведено девять проекционных встреч, на которых каждый кандидат сможет напрямую изложить избирателям свое видение Пакистана. Эти встречи не будут открыты для общественности или СМИ. Президент Айюб Хан почти гарантированно станет кандидатом от Конвенции мусульманской лиги, про-айюбовской фракции партии Пакистанская мусульманская лига. Лидеры оппозиции осуждают короткий предвыборный сезон и непрямые выборы. Они утверждают, что все складывается в пользу президента Айюба Хана. Представитель правительства отрицает это, утверждая, что эти выборы представляют собой новую эру демократии для Пакистана."
 PAK_1965_Election.2.d: "Основные оппозиционные партии объявили о выдвижении Фатимы Джинна в президенты. Пять партий сформировали коалицию под названием Объединенная оппозиционная партия, чтобы объединить ресурсы для свержения режима Айюб Хана. Фатима Джинна, сестра Мохаммада Али Джинна, покойного основателя Пакистана, широко популярна в народе, ее ласково называют Матерью нации. Новая коалиция обнародовала программу из девяти пунктов. Среди ее целей - восстановление парламентской демократии и всеобщего избирательного права, демонтаж существующей системы непрямых выборов. Фатима Джинна выпустила заявление, в котором призвала народ Пакистана объединиться во имя демократии и положить конец диктатуре Айюб Хана."
 PAK_1965_Election.3.d: "Фатима Джинна, любимая сестра почитаемого основателя Пакистана Мухаммада Али Джинна, проводит кампанию по всему Пакистану за пост президента. Она является кандидатом от Объединенной оппозиционной партии и выступает против действующего президента Айюба Хана. Газеты публикуют фотографии и репортажи о массовых толпах людей, пришедших посмотреть на Джинна. В своих речах Джинна осуждает режим Айюб Хана за то, что он был слишком мягким по отношению к Индии, светским и антидемократическим. Она желает восстановить демократию, положить конец существующей системе непрямых выборов и более открыто включить ислам в государственное устройство. Поскольку она оставалась практически вне поля зрения общественности с начала 1950-х годов, многие пакистанцы приезжают посмотреть на ее кампанию и путешествия, многие надеются просто взглянуть на женщину, которую считают великим борцом за независимость и называют Мадер-и Миллат (мать нации)."
 PAK_1965_Election.4.d: "За последние несколько недель ряд сторонников президента Айюб Хана и представители СМИ опубликовали язвительные статьи и редакционные статьи против Фатима Джинна. Кроме того, местные власти разрешили очень консервативным партиям проводить демонстрации, осуждающие идею женщины-лидера для Пакистана. И это несмотря на то, что Джинна пользуется поддержкой крупнейшей религиозной партии - Джамаат-и-Ислами. Однако эта кампания по дискредитации Джинна дала обратный результат. Интеллектуалы, политики и активисты по всей стране выступили в ее поддержку. Толпы пакистанцев также осуждают правительство за оскорбление репутации женщины, которую многие считают Мадер-и Миллат (матерью нации). Эта реакция напрямую влияет на популярность Айюб Хана."
 PAK_1965_Election.5.d: "Начался сезон выборов, в котором четыре кандидата борются за 80 000 основных избирателей-демократов. Это первые крупные выборы с непрямым франчайзингом в истории Пакистана. Действующий президент Айюб Хан является главным фаворитом, поскольку он создал нынешнюю избирательную систему. Пять основных оппозиционных партий объединились в коалицию под названием Объединенная оппозиционная партия и выдвинули широко популярную Фатиму Джинна. Два других кандидата - выходцы из малоизвестных кругов, и не ожидается, что они сыграют важную роль. Ожидается, что президент Айюб Хан будет вести предвыборную кампанию на платформе продолжения экономических реформ и восстановления политической стабильности. Фатима Джинна будет вести кампанию на платформе, призывающей к восстановлению парламентской системы и всеобщего избирательного права на будущих выборах."
 PAK_1965_Election.6.d: "Фатима Джинна недавно завершила предвыборное турне по крупным городам Восточного и Западного Пакистана. На каждой остановке ее встречали огромные, полные энтузиазма толпы. Толпы в Восточном Пакистане с особым энтузиазмом встречали женщину, которую называют Матерью нации. Она также осудила Айюб Хана за слабую позицию по отношению к Индии и поддержку кашмирского народа. Активисты, поддерживающие Аюба, распространяли пренебрежительные комментарии в адрес Фатимы Джинна, но эти попытки очернить ее имя в значительной степени оттолкнули пакистанцев, которые по-прежнему широко уважают сестру любимого Мохаммада Али Джинна. Президент Айюб Хан сосредоточил свою предвыборную кампанию на сельских районах, где его реформы имели наибольший успех. Поскольку большинство из 80 000 основных демократов являются выходцами из этих районов, многие считают, что это разумная стратегия. Несмотря на демонстрацию народной поддержки, ожидается, что Айюб Хан все же победит."
 PAK_1965_Election.7.d: "Один высокопоставленный государственный служащий в частном порядке обратился к Фатиме Джинна с просьбой посетить секретное совещание высокопоставленных военных и правительственных чиновников. Эти чиновники были из разных слоев общества. Некоторые относятся к ней с благоговением из-за ее близости к Мохаммаду Али Джинна и ее роли в основании государства. Другие прагматично отмечают, что она более популярный кандидат, но ей не хватает поддержки со стороны основных демократов. Если Джинна согласится, она может увидеть возможность преодолеть нынешнюю избирательную систему. Однако для этого ей, возможно, придется пойти на серьезные компромиссы. Она должна решить, участвовать или нет."
 PAK_1965_Election.8.d: "В условиях строжайшей безопасности высокопоставленные правительственные и военные чиновники, многие из которых были представлены доверенными союзниками, встретились с Фатимой Джинна. На встрече она настаивала на своей приверженности восстановлению парламентской демократии и прекращению системы непрямых выборов. Она также отметила, что Айюб Хан сдерживает нацию и демонстрирует слабость перед Индией. Присутствующие официальные лица поддержали ее позицию, но заявили, что поддержат ее только в том случае, если она согласится на несколько требований. Они заявили, что она должна воздержаться от того, чтобы называть Айюб Хана диктатором, и дать ему возможность спокойно уйти на пенсию в случае победы. Они также потребовали, чтобы она сохранила текущие экономические реформы или не вмешивалась в военные дела. Соглашение должно было храниться в тайне. Фатима Джинна должна решить, что делать."
 PAK_1965_Election.9.d: "Государственные СМИ подтвердили, что Фатима Джинна победила на президентских выборах 1965 года в Пакистане. Она получила большинство голосов избирателей, но что более важно, она получила незначительное большинство из 80 000 основных демократов, которые выбирают президента. Многие аналитики считают, что, несмотря на популярность Джинна, ей не удалось бы заручиться поддержкой коллегии выборщиков, которая состоит в основном из сельских представителей, тесно связанных с действующим президентом Айюб Ханом. Мисс Джинна выпустила заявление, в котором поблагодарила основных демократов за поддержку пожеланий народа. Миллионы людей празднуют в разных городах Пакистана, самые большие толпы в Дакке. Фатима Джинна, популярная сестра основателя Пакистана Мохаммада Али Джинна, пользуется всеобщим уважением. Президент Айюб Хан, ушедший от власти в результате переворота, не сделал никакого заявления по поводу результатов."
 PAK_1965_Election.10.d: "Президент Айюб Хан объявил, что признает результаты выборов и уйдет из общественной жизни после того, как к власти придет новое правительство. Он пообещал свою верность нации и выразил надежду, что народ признает его преданность ему. Фатима Джинна, избранный президент, похвалила Айюб Хана за признание результатов выборов. Когда ее спросили, будут ли Айюб Хану и его политическим союзникам предъявлены обвинения или проведено расследование по факту коррупции, она отвергла эту идею. Ее примирительные комментарии были значительным шагом вниз по сравнению с некоторыми из ее предыдущих резких критических замечаний в адрес Айюб Хана. Несмотря на его мужественное лицо, источники говорят, что Айюб Хан ошеломлен результатами выборов. Высшее военное руководство сообщило своему бывшему вождю, что они поддержат новое правительство, не оставив ему иного выбора, кроме как уйти в отставку."
 PAK_1965_Election.11.d: "В 1965 году состоялись президентские выборы. Народ Пакистана должен был избрать 80 000 основных демократов, которые затем голосовали за президента. Когда были подведены окончательные итоги, президент Айюб Хан был объявлен победителем, получив более шестидесяти процентов голосов. Его победа считалась несомненной, поскольку большинство базовых демократов были его назначенцами. Однако аналитики были удивлены тем, сколько голосов в итоге получила Фатима Джинна. Реакция многих пакистанцев - разочарование, поскольку многие считали, что она пользовалась поддержкой народа. Сейчас многие в стране считают конституцию, созданную Айюб Ханом, сфальсифицированной, чтобы удержать его у власти, и призывают к проведению более демократических реформ, особенно в Восточном Пакистане, где Фатима Джинна была особенно популярна."
 Jinnah_President.1.d: "Правительство Пакистана опубликовало заявление, в котором призвало провинции выбирать культурные праздники, актуальные для местных общин. Это шаг назад по сравнению с прошлым, когда федеральное правительство стремилось навязать более единую, национальную идентичность в ущерб этническим традициям или историческим личностям. Правительство Восточного Пакистана приветствовало эту новость, пообещав проводить праздники в честь великих бенгальских литературных героев. СЗПП выпустил собственное заявление, призвав провести неделю языка пушту в честь великих поэтов приграничья. Этот шаг является частью усилий по поиску баланса между федеральным правительством и провинциями"
 Jinnah_President.2.d: "Президент Фатима Джинна созвала внеочередную сессию Национального собрания. В своем обращении она призвала его членов усердно работать над реформой конституции. Она призвала к сбалансированной демократии, обеспечивающей стабильность и дающей власть народу. Джинна возглавляет коалицию различных партий. Несмотря на различия в идеологии, коалиция едина в своем стремлении уничтожить демократию Айюб Хана. Джинна ловко удерживает эти партии вместе благодаря своим способностям и статусу сестры покойного основателя Пакистана Мохаммад Али Джинна."
 Jinnah_President.3.d: "На заключительном заседании внеочередной сессии Национальной ассамблеи был принят ряд поправок, которые сокращали полномочия президента. При президенте Айюб Хане он наделил президента широкими полномочиями. Президент Фатима Джинна долгое время настаивала на проведении реформ. Она считала, что Пакистан уже давно страдает от чрезмерной власти исполнительной власти. Согласно реформам, президент сохраняет свои полномочия, но больше не может действовать абсолютно безнаказанно. Это решение приветствуется во всех политических кругах. Впервые, похоже, Пакистан сбалансировал свои политические институты."
 Jinnah_President.4.d: "После долгого заседания кабинета министров президент Фатима Джинна объявила бойкот индийским товарам. Она заявила, что это решение отражает чувства народа. Если индийское правительство будет продолжать враждебно относиться к Пакистану, то нет никаких причин вести с ним торговые отношения. Президент проводил предвыборную кампанию за сохранение жесткой линии по отношению к индийскому правительству. Пакистанские военные, как говорят, в восторге от этого решения. Эмбарго широко поддерживается большинством кругов в стране. Однако некоторые критики отмечают, что это решение только вредит экономике. На международном уровне многие государства выразили обеспокоенность эскалацией напряженности."
 Jinnah_President.5.d: "Президент Фатима Джинна завершила недавнюю сессию Национального собрания. С момента вступления в должность президента она отменила президентскую власть и восстановила парламентскую систему правления. Учась на предыдущих ошибках, она стремилась сократить президентские полномочия, чтобы создать сбалансированную исполнительную власть. Несмотря на ее реформы и поправки к конституции, ее коалиция выглядит все более расколотой. Многие политические обозреватели считают, что только ее личность и престиж удерживают нынешнее правительство у власти. Несмотря на это, она добилась своего, и теперь все пакистанцы могут пользоваться всеми правами голоса на предстоящих выборах."
 Jinnah_President.6.d: "Нация была ошеломлена, узнав, что президент Фатима Джинна скончалась ночью от сердечной недостаточности. Хотя ее срочно доставили в больницу, по прибытии она была объявлена мертвой. За время своего короткого пребывания у власти она преобразила Пакистан, изменив конституцию, обеспечив всеобщее избирательное право и более сбалансированную парламентскую демократию. Ожидается, что вскоре будут объявлены новые выборы. Правящая коалиция объединила множество партий с совершенно разными идеологиями, но репутация Джинны и ее миссия по устранению Айюб Хана помогли ей сохранить ее в неприкосновенности. Ее также запомнят как первую женщину, управлявшую государством с мусульманским большинством. В Карачи запланированы масштабные государственные похороны. Ожидается, что она будет похоронена рядом со своим братом в Мазар-э-Кайд."
 PAK_MAAG.1.d: "После завершения первого этапа ВПКГ многие военные хотят обратиться к американцам, чтобы немедленно начать следующий этап с новым вооружением для модернизации вооруженных сил. Армия заинтересована в расширении бронетанковых сил, а ВВС выразили заинтересованность в приобретении у США более современных истребителей. ВМС хотели бы обеспечить флот новой, более современной подводной лодкой. Однако сближение с американцами может потребовать от нас более жесткой привязки к их интересам. Возможно, будет лучше модернизировать наши силы за счет собственных усилий по сохранению независимости."
 PAK_MAAG.2.d: "Пакистанцы запросили больше военной помощи для модернизации своих сил в рамках новой фазы ВПКГ. Первая фаза была успешной, и наши офицеры на местах присылали блестящие отчеты о пакистанской армии. Тем не менее, были и остаются сомнения в том, сможет ли Пакистан экономически содержать многочисленную армию. Кроме того, многие подозревают, что эта военная техника нужна им в первую очередь не для сдерживания коммунизма, а для противостояния своему сопернику - Индии. Индия также очень чувствительна к нашим военным отношениям с Пакистаном, и новые усилия по предоставлению оружия не будут восприняты хорошо. Если мы все-таки решим предоставить желаемое оборудование, мы должны потребовать, чтобы Пакистан осудил Советский Союз и коммунистический Китай и предоставил нам военные базы для демонстрации своей искренности. Или мы можем сохранить связи с Индией и вежливо отклонить их просьбу."
 PAK_MAAG.3.d: "Американцы согласились предоставить поддержку ВПКГ для дополнительной пехотной дивизии, бронетанковой дивизии и механизированной бригады, а также артиллерии. Для ВВС они предоставят несколько более современных истребителей и расширят наши бомбардировщики. Военно-морской флот также получит новую подводную лодку. В обмен они просят нас серьезно свернуть наши связи с Китаем и Советским Союзом. Они также хотят иметь базы в нашей стране. Такая сделка предоставит нам много оборудования, но серьезно повлияет на нашу внешнюю политику и, скорее всего, приведет к внутренним волнениям по поводу соглашения. Некоторые министры призывают нас вежливо отклонить предложение и проводить более независимую оборону и внешнюю политику."
 PAK_MAAG.4.d: "Новости о нашем недавнем соглашении с Соединенными Штатами вызвали большой резонанс по всей стране. Левые, антиколониальные и религиозные группы собрали своих сторонников на акции протеста во всех крупных городах. Правительство осуждают за то, что оно продало страну. Индия в основном осудила соглашение, обвинив Америку в разжигании гонки вооружений в Южной Азии. Несмотря на громкие протесты, и США, и правительство Пакистана приветствовали соглашение как жизненно важное для сохранения Пакистана и остановки коммунизма в регионе"
 PAK_MAAG.5.d: "Правительство было проинформировано о том, что военные получили в свое распоряжение все оружие и системы, обещанные американцами. Военные также заявили, что не предвидят никаких серьезных проблем с эксплуатацией систем вооружения, так как американские инструкторы оказали большую помощь в этом отношении. Правительство отметило свое удовлетворение отчетом и похвалило военных за их усилия по обеспечению сохранения сильной, надежной, способной противостоять любым враждебным планам или авантюрам страны."
 Ayub.1.d: "Директор ИНИ, главной разведывательной службы страны, встретился с президентом Айюб Ханом. Президент Айюб Хан встречался, чтобы обсудить возможность мобилизации разведывательных средств для наблюдения за внутренней политикой и потенциальными угрозами его режиму. Нынешнее правительство играет важную роль в спасении Пакистана от иностранной агрессии и коррупции, которая поразила страну в первые годы ее существования. Директор заявил, что агентство, конечно, может помочь правительству, но это поставит под угрозу его способность отслеживать внешние угрозы. Необходимо решить, должна ли ИНИ пожертвовать своими возможностями внешней разведки и работать на укрепление режима или вообще остаться вне политики."
 Ayub.2.d: "Вскоре после прихода к власти президент Айюб Хан назначил бывшего главного судью Шахабуддина председателем комиссии, которая должна была предложить конституционные рамки, позволяющие избежать политической нестабильности и коррупции прежнего режима. Вышел доклад, в котором предлагалась президентская система правления вместо парламентской. Новая система будет двухпалатной с верхней палатой, призванной контролировать нижнюю. Президент будет обладать мощной исполнительной властью, особенно в вопросах назначения губернаторов. Комиссия рекомендовала вернуть политические партии, а все избранные должностные лица должны пройти образовательный ценз. Выборы должны были проводиться на основе всеобщего избирательного права. Президент Айюб мог бы принять отчет как есть, чтобы сформировать демократическую конституцию, но его советники предлагают внести изменения, которые усилили бы президентские полномочия, сохранили бы избирательную систему \"Базовые демократы\" и запрет на политические партии. Айюб склонен предложить изменения и создать более президентскую конституцию."
 Pak_Econ60s.1.d: "По мере реализации амбициозного пятилетнего плана встал вопрос об обеспечении финансирования. Мы, конечно, будем максимально использовать возможности привлечения средств внутри страны, но мы молодая, бедная нация, и для ее преобразования нам необходим доступ к более высокому финансированию. Соединенные Штаты выразили готовность предложить финансовую помощь и облегчить доступ к международной помощи со стороны своих союзников. Правительство склонно максимально использовать такую финансовую помощь, чтобы действительно преобразовать страну на этом критическом этапе. Однако несколько министров выразили обеспокоенность тем, что, полагаясь на такие средства, Пакистан может оказаться финансово уязвимым, и хотя это может замедлить потенциальный рост, более разумным решением может стать умеренная помощь. Мы должны решить, максимизировать ли американскую помощь или попросить умеренную помощь, чтобы покрыть некоторые пробелы в наших финансовых усилиях."
 Pak_Econ60s.2.d: "Пятилетний план был чрезвычайно успешным, во многом благодаря нашей способности привлекать финансовую помощь и дружественные кредиты. Однако эти выплаты достигли критического уровня. Теперь правительство должно выделять значительную часть бюджета на выполнение этих обязательств. Экономическое развитие, стимулируемое этими средствами, еще не достигло такого уровня, чтобы способствовать дальнейшему росту страны и выполнению обязательств по выплатам. В результате, экономические цели на ближайшие годы должны быть скорректированы с учетом этой суровой финансовой ситуации."
 Pak_Econ60s.3.d: "Пятилетний план был чрезвычайно успешным, во многом благодаря нашей способности привлекать финансовую помощь и дружественные кредиты. Однако эти выплаты достигли критического уровня. Теперь правительство должно выделять значительную часть бюджета на выполнение этих обязательств. Экономическое развитие, стимулируемое этими средствами, еще не достигло того уровня, чтобы способствовать дальнейшему росту страны и выполнению обязательств по выплатам. К счастью, обязательства не являются непреодолимыми, и министр финансов настаивает на том, что страна скоро преодолеет кризис и вернется к своим экономическим целям. В результате, экономические цели на ближайшие годы должны быть скорректированы с учетом этой суровой финансовой ситуации."
 PAK_Land_Reform.1.d: "Одним из первых шагов правительства Айюб Хана была борьба с феодальной системой, которая долгое время доминировала в сельскохозяйственном секторе и создавала крайне тяжелые условия для крестьян, обрабатывающих землю. Были проведены реформы, ограничивающие максимальное количество земли в собственности отдельного человека и обеспечивающие крестьянам некоторые основные права. Хотя многие считают, что эти реформы имеют слишком много лазеек, чтобы быть преобразующими, новые требования к владению землей привели к тому, что правительство изъяло миллионы акров непродуктивных земель. Эти земли могут быть использованы для развития сельскохозяйственного производства и экономики. Один из старших советников отметил, что хотя эти земли могут быть распределены среди продуктивных крестьянских хозяйств, они также могут быть предоставлены в качестве пенсионных грантов для младших офицеров в армии. Это вознаградило бы их за заслуги перед государством и укрепило бы их верность Айюб Хану. Правительство должно решить, кому должна достаться земля - крестьянам или офицерам."
 PAK_Land_Reform.2.d: "Правительство объявило, что в настоящее время оно раздает участки непродуктивных земель, находящихся под его управлением, крестьянам по всему Пакистану. Правительство отметило, что система феодального сельского хозяйства долгое время мешала сельскохозяйственной производительности в Пакистане, но в настоящее время эта ситуация исправляется. Правительство отметило, что оно шокировано количеством неиспользуемых пригодных для использования земель в стране. Пресса и общественность в основном приветствовали новости правительства. Популярная мера поможет Айюб Хану расположить к себе население, но традиционная сельская элита, как говорят, кипит от этих мер, которые они рассматривают как унижение, направленное против них."
 PAK_Land_Reform.3.d: "Правительство объявило, что будет распределять непродуктивные земли под своим управлением в качестве пенсионного вознаграждения для офицеров пакистанской армии, ВВС и ВМС. Правительство отметило, что, будучи бедной страной, пакистанские офицеры жертвуют финансовыми и материальными возможностями ради служения стране. Эти земли станут скромной, но справедливой наградой за их службу, поскольку военные обладают дисциплиной и патриотизмом, чтобы такие земли не пропадали зря, как это было раньше. Эта акция была хорошо воспринята контролируемой правительством прессой и офицерским корпусом. Айюб Хан определенно может рассчитывать на своих офицеров в обозримом будущем."
 PAK_Financial.1.d: "Комитет по планированию пятилетнего плана и министр финансов обратились к президенту Айюбу Хану, чтобы обсудить варианты стимулирования притока денежных средств и частного капитала. Есть предложение о новом законодательстве о промышленности, которое в значительной степени устранит финансовые правила и практику, чтобы стимулировать расширение промышленности и обеспечить максимальный рост. Некоторые члены Комитета, однако, предостерегают от такого дерегулирования, предупреждая, что оно может привести к еще большим финансовым проблемам в будущем. Вместо этого они считают, что некоторые устаревшие и экономически консервативные элементы могут быть реформированы или удалены, чтобы стимулировать умеренный рост."
 PAK_Financial.2.d: "Правительство объявило о беспрецедентном смягчении правил регулирования, особенно тех, которые связаны с промышленностью. Эта новая политика призвана способствовать быстрому экономическому росту Пакистана и его промышленной базы. Наряду с этой реформой правительство объявило о планах принять ряд законов, направленных на укрепление и упорядочение финансирования промышленных проектов. Министр финансов призвал как международных инвесторов, так и местных предпринимателей воспользоваться преимуществами дружественной деловой атмосферы в Пакистане. Он настаивает на том, что опасения по поводу прав рабочих или долгосрочных последствий этих действий сильно преувеличены, и эта политика необходима для процветания Пакистана в настоящее время."
 PAK_Financial.3.d: "Министерство финансов опубликовало заявление, в котором описывается ряд реформ, направленных на сокращение регулирования и препятствий для роста в промышленном секторе экономики. В заявлении отмечается, что это не будет свобода для всех, и были предприняты усилия по сохранению некоторых мер защиты от перерасхода средств или чрезмерных обязательств организаций. Позже правительство опубликовало свои собственные комментарии и призвало все заинтересованные стороны воспользоваться дружественной деловой атмосферой и огромным потенциалом Пакистана и его народа."
 PAK_Financial.4.d: "Политика дерегулирования, призванная стимулировать промышленную экспансию и экономический рост, привела к тому, что корпорации влезли в глубокие долги, что значительно замедлило экономический рост. Сокращение мер защиты, особенно для рабочих, также привело к экономическому спаду среди этих слоев населения, что еще больше замедлило экономику и снизило эффективность. Уменьшение государственной казны означает, что ее способность стимулировать рост и поддерживать денежные потоки значительно снизилась. Министр финансов объявил о пересмотре показателей промышленного роста и восстановил некоторые нормативные акты, чтобы остановить экономический спад."
 PAK_Financial.5.d: "Политика дерегулирования, призванная стимулировать промышленное развитие и экономический рост, привела к тому, что корпорации погрязли в глубоких долгах, препятствуя экономическому росту. Сокращение мер защиты, особенно для работников, привело к снижению их заработных плат и добавило топлива к неудовлетворительной работе местных отраслей промышленности и бизнеса. Уменьшение государственной казны означает, что ее способность стимулировать рост и поддерживать денежные потоки значительно снизилась. Министр финансов объявил о пересмотре показателей промышленного роста и восстановил некоторые нормы регулирования, чтобы остановить экономический спад. Однако министерство отметило, что считает этот спад временным и ожидает скорого восстановления экономики."
 Bengal_Issue_Ayub.1.d: "Бенгальцы в Восточном Пакистане долгое время питали подозрения, что они являются гражданами второго сорта или не замечаются федеральным правительством. И это несмотря на их многочисленное население, огромную экономическую роль и историческую преданность пакистанскому движению. Когда началась война за Кашмир, распространились слухи, что Западный Пакистан бросил Восточный Пакистан. К сожалению, возникший конфликт, похоже, подтвердил эти подозрения. Отсутствие крупных военных формирований в провинции и нежелание властей создать убежища от воздушных налетов или системы оповещения подпитывали ощущение брошенности. Наши войска и официальные лица действовали настолько эффективно, насколько могли, но, к сожалению, это не было оценено населением Восточного Пакистана."
 Bengal_Issue_Ayub.2.d: "Бенгальцы в Восточном Пакистане долгое время питали подозрения, что они являются гражданами второго сорта или что федеральное правительство их не замечает. И это несмотря на их многочисленное население, огромную экономическую роль и историческую преданность Пакистанскому движению. Многие выступали против захвата власти военными Айюб Ханом, и эта оппозиция усилилась, когда он представил свою систему базовой демократии. Для многих жителей Восточного Пакистана Айюб Хан внедрил систему, призванную лишить восточных пакистанцев пропорционального представительства и ограничить их политические устремления. Толпы бенгальцев, особенно студентов, регулярно протестуют за демократическое управление."
 Agartala_Conspiracy.1.d: "С тех пор как шейх Муджибур Рахман обнародовал свои опасные \"Шесть пунктов\", он вызвал массовые волнения среди бенгальцев по всему Восточному Пакистану. Бенгальцев все больше привлекает антигосударственный путь, и статус-кво сейчас не кажется решением проблемы. Вопрос в том, как подойти к этой сложной проблеме, не создавая новых проблем и не разжигая сепаратистские тенденции среди бенгальцев. Один из подходов - дискредитировать Рахмана и его «Авами Лиг». Наши спецслужбы обнаружили заговор с участием сепаратистов и индийского правительства. Публичное расследование этого дела разоблачит «Авами Лиг» как предателей, которыми мы их знаем. Многие советники поддерживают такой подход. Другой вариант - ослабить ограничения на публичные протесты. Это будет уступка, которая позволит нам пригласить «Авами Лиг» на переговоры на высоком уровне относительно будущего Восточного Пакистана. Скорее всего, нам придется пойти на компромисс, но быстрое движение в этом направлении может снизить вероятность вооруженного сопротивления."
 Agartala_Conspiracy.2.d: "После глубокого расследования ИНИ сообщила правительству об обширном заговоре, который она раскрыла в Восточном Пакистане. По данным их агентов, ведущие члены «Авами Лиг» вместе с бенгальскими военными офицерами и гражданскими служащими сговорились организовать вооруженное восстание за создание отдельного государства. Многие из ключевых участников заговора, включая высокопоставленных помощников шейха Муджибура Рахмана, вели эти переговоры в индийском городе Агартала, часто с представителями индийской разведки и военными, чтобы заручиться их поддержкой восстания. В какой-то момент агент нашей разведки был обстрелян некоторыми заговорщиками, но ему все же удалось доставить информацию. Правительство скоро выдаст ордера на арест и объявит обвинения против обвиняемых."
 Agartala_Conspiracy.3.d: "Сегодня утром нация Пакистана была ошеломлена сообщениями о том, что военные, гражданские служащие и члены «Авами Лиг», включая лидера партии Шейха Муджибура Рахмана, были арестованы. Правительство предъявило им обвинения в сговоре с Индией с целью начать восстание против государства Пакистан. В заявлении правительства говорится, что недавние попытки «Авами Лиг» потребовать большей автономии были лишь уловкой, предпринятой под руководством Индии, чтобы ослабить Пакистан. Президент Айюб Хан в своем собственном заявлении призвал к скорейшему судебному разбирательству, чтобы раскрыть правду об этом злом заговоре. Шейх Муджибур Рахман в своем заявлении отверг обвинения, назвав их сфабрикованными и отчаянной попыткой заглушить голос бенгальского большинства."
 Agartala_Conspiracy.4.d: "Сегодня начался долгожданный суд над шейхом Муджибуром Рахманом и его предполагаемыми заговорщиками. Суд проходит под руководством трех судей, один из которых не бенгалец, а двое других бенгальцы. Им предстоит заслушать доказательства того, что обвиняемые замышляли вооруженное восстание против Пакистана с помощью иностранной державы - Индии. В деле примут участие более 200 свидетелей, а также будут представлены доказательства, подтверждающие обширный список обвинений. Однако в Восточном Пакистане широко распространен гнев по поводу этого дела. Многие обвиняют правительство в фабрикации обвинений в заговоре против автономии Восточного Пакистана. Эти заявления были подогреты откровениями британского адвоката, помогавшего обвиняемым, о том, что некоторые свидетели признались, что их принуждали к даче показаний. Ежедневно проходят крупные акции протеста, требующие прекращения дела."
 Agartala_Conspiracy.5.d: "Суд по делу об Агартальском заговоре продолжает вызывать отчуждение и протест среди бенгальцев в Восточном Пакистане. По мере продолжения судебного процесса все больше бенгальцев считают обвинения нелепыми и заговором, направленным на то, чтобы заставить замолчать популярного шейха Муджубура Рахмана. В последнее время к протестам стали присоединяться студенты, особенно из университета Дакки. Эти протесты продолжают негативно влиять на экономику и функционирование штата. Однако правительство продолжает вести себя вызывающе и заявляет, что не прекратит добиваться справедливости. Однако оно продолжает сталкиваться с обвинениями в том, что свидетели были принуждены, а документы сфальсифицированы."
 Agartala_Conspiracy.6.d: "Бенгальские протестующие, выступающие за снятие обвинений с обвиняемых в суде по делу о заговоре в Агартале, сформировали Комитет действий. Комитет действий под руководством активистов «Авами Лиг» планирует организовать протесты, забастовки и агитацию, чтобы добиться максимального воздействия на правительство. Президент Айюб Хан надеялся, что это дело покажет жителям Восточного Пакистана опасность шейха Муджибура Рахмана и разоблачит его как сепаратиста, однако, похоже, эти усилия не увенчались успехом. Даже продемократические активисты в Западном Пакистане начинают высказываться в поддержку шейха Муджибура Рахмана, поскольку дело превращается в антиайюбское."
 Agartala_Conspiracy.7.d: "Дакка была охвачена волной насилия после известия о том, что сержант Захурул Хак, один из обвиняемых по делу о заговоре в Агартале, был застрелен охранником. Хотя его срочно доставили в местный военный госпиталь, Хак скончался от полученных ран. Неясно, что привело к стрельбе, но известие о ней вызвало массовые толпы, которые начали поджигать правительственные здания и Дом штата, где проходит слушание дела. Трем судьям трибунала удалось спастись, но в результате нападения начались массовые пожары, в которых сжигались улики и документы, связанные с делом. На следующее утро массовые толпы людей вернулись в Дакку, чтобы осудить убийство и обвинить правительство в попытке убийства обвиняемых, поскольку судебное дело застопорилось."
 Agartala_Conspiracy.8.d: "Президент Айюб Хан приказал правительству отозвать дело о заговоре в Агартале и снять обвинения с обвиняемых. В своем заявлении правительство настаивало на том, что у него были доказательства для вынесения обвинительного приговора, но обстоятельства на местах и нестабильность сделали судебный процесс неприемлемым. После освобождения из тюрьмы Шейх Муджибур Рахман и другие обвиняемые отправились на массовый прием к публике на ипподроме в Дакке. Его встретили ликующие толпы, которые скандировали его новый титул в народе - \"Друг Бенгалии\". В своих комментариях Рахман подчеркнул, что «Шесть Пунктов» не были ни сепаратистскими, ни антипакистанскими, и выразил признательность народу, который не позволил диктатору уничтожить оппозицию и голос народа. Многие бенгальцы рассматривают этот эпизод как большую победу, и многие в Восточном Пакистане теперь твердо поддерживают «Авами Лиг», что делает судебный процесс большой ошибкой Айюб Хана."
 Awami_League_Round_Table.1.d: "После решения правительства снять ограничения на протесты, «Авами Лиг» и ее лидер шейх Муджибур Рахман согласились провести переговоры с президентом Айюб Ханом по поводу «Шести пунктов». Ранее Муджибур Рахам обнародовал «Шесть Пунктов» в качестве основы для отношений между Восточным и Западным Пакистаном. Критики отмечают, что «Шесть Пунктов» разделяют почти все институты страны и оставляют Восточный Пакистан фактически независимым. Однако сторонники «Шести пунктов» утверждают, что их реализация остановит напряженность между двумя крыльями и позволит им развиваться вместе, а не за счет друг друга. Ожидается, что переговоры будут долгими и трудными, но многие по всей стране считают эту недавнюю инициативу правительства позитивным шагом."
 Awami_League_Round_Table.2.d: "На начальном этапе обсуждений и правительство, и «Авами Лиг» изложили свои переговорные позиции. Однако стало ясно, что шейх Муджибур Рахман, похоже, не желает идти на компромисс в отношении своих чрезвычайно популярных «Шести пунктов» и призвал правительство принять их для Восточного Пакистана. Он заявил, что это единственный путь к обеспечению мира и единства для всего Пакистана. Говорят, что правительственная сторона раздражена таким поведением. Однако некоторые советники Айюб Хана считают, что он может предложить Восточному Пакистану большую автономию, по сути, приняв некоторые из «Шести пунктов», но не уступая в предоставлении Восточному Пакистану независимой экономики или полностью независимых сил обороны. Другим вариантом был бы выход из переговоров, что было бы популярно среди западнопакистанцев, но фактически не смогло бы разрешить напряженность в Восточном Пакистане."
 Awami_League_Round_Table.3.d: "Президент Айюб Хан тщательно изложил предложение шейху Муджибуру Рахману о будущем статусе Восточного Пакистана. Он отметил, что понимает, что многие в провинции желают серьезных перемен в отношениях между обоими крыльями. Однако, как он заявил, «Шесть Пунктов» не являются реальным решением. Вместо этого он предложил предоставить Восточному Пакистану широкую автономию, предоставив ему контроль над фондами развития, налогообложением и внутренней политикой. Однако он не мог предоставить полностью независимую экономику или независимые силы обороны. Хотя он предложил уступки по обоим вопросам, включая передачу контроля над Восточнопакистанскими стрелками законодательному органу Восточного Пакистана. Для шейха Муджибура Рахмана это дало бы ему возможность выполнить многие из «Шести Пунктов» и достичь своей цели - автономии. Он и его основные сторонники склонны принять компромисс. Однако некоторые сторонники жесткой линии в партии настаивают на том, что они остаются приверженцами «Шести Пунктов» и отвергают это предложение."
 Awami_League_Round_Table.4.d: "Президент Айюб Хан внезапно прекратил переговоры за круглым столом и вернулся в Западный Пакистан. Он заявил, что его правительство стремилось искренне обсудить нерешенные вопросы с «Авами Лиг», но эта группа оказалась неготовой к переговорам ради улучшения положения народа Пакистана. Многие редакционные статьи в Западном Пакистане выступили в поддержку президента, заявив, что он принял правильное решение и разоблачил шейха Муджибура Рахмана как нечестного политика, вынашивающего опасные планы в отношении будущего Пакистана. В Восточном Пакистане «Авами Лиг» обвинили правительство в необдуманных действиях и использовании переговоров как средства набрать политические очки на своей базе. Хотя они получили поддержку от продемократических газет, они также столкнулись с критикой, особенно со стороны других основных партий Восточного Пакистана, которые обвинили «Авами Лиг» в продвижении радикальной программы против воли многих бенгальцев и бихарцев, живущих в Восточном Пакистане."
 Awami_League_Round_Table.5.d: "Шейх Муджибур Рахман, лидер «Авами Лиг», сказал правительству, что принимает их компромисс. Он лично сказал президенту Айюб Хану, что бенгальский народ не забудет его решение прислушаться к его желаниям. Президент ответил взаимностью на добрые слова и выразил надежду, что новое соглашение станет предвестником новой эры для Пакистана. Было решено, что официальное соглашение не будет подписано, и как только президент сообщит об этом высшим правительственным чиновникам, можно будет заключить окончательное соглашение. До этого момента обе стороны договорились не раскрывать детали и достигнутое предварительное соглашение, поскольку оно может быть изменено. По окончании переговоров обе стороны выпустили заявление, в котором отметили, что был достигнут значительный прогресс и будущие переговоры вполне вероятны. Аналитики отметили, что ни проправительственные, ни про-«Авами Лиг» издания не пытались критиковать другую сторону, а после возвращения президента Айюб Хана в Пакистан возобладало чувство оптимизма."
 Awami_League_Round_Table.6.d: "Шейх Муджибур Рахман, лидер «Авами Лиг», отверг предложение правительства о предоставлении гораздо большей автономии Восточному Пакистану. Президент Айюб Хан посчитал предложение справедливым, поскольку оно отвечало большинству \"Шести пунктов\", но «Авами Лиг» все равно отказался. После этого переговоры быстро завершились, и обе стороны выпустили резкие заявления. Правительство обвинило «Авами Лиг» в нечестных переговорах и отказе от разумных предложений. «Авами Лиг» заявила, что не пойдет на компромисс в отношении достоинства народа Восточного Пакистана. На национальном уровне сторонники правительства были удовлетворены его действиями. Хотя сторонники «Авами Лиг» удовлетворены, их жесткая линия оттолкнула тех, кто стоял на заборе"
 Awami_League_Round_Table.7.d: "Ошеломляющая новость: ожидаемое соглашение между правительством и «Авами Лиг» провалилось. «Авами Лиг» утверждает, что правительство пыталось изменить согласованные условия, и оно не может их принять. В стране царит разочарование по поводу того, что правительство не смогло завершить соглашение. Президент Айюб Хан спокойно относится к неудаче, но аналитики подозревают, что пакистанские военные, скорее всего, выступили против предложенного соглашения. Без поддержки военных у правительства не было выбора, кроме как допустить провал соглашения. Поскольку обе стороны застыли на своих позициях, надежды на будущее мало."
 PAK_1965_Economy.1.d: "После окончания последней войны страна стоит перед дилеммой, как ей восстанавливаться. Некоторые считают, что приоритет должен быть отдан восстановлению национальной экономики. Однако, учитывая сохраняющуюся ситуацию с безопасностью, многие выступают за то, чтобы сосредоточиться на восстановлении нашего военного потенциала. Восстановление экономики может обеспечить нам долгосрочную базу для создания более сильной оборонной промышленности. Однако пренебрежение вооруженными силами сейчас может привести к катастрофе, если Индия или Афганистан решат бросить нам вызов. Мы должны определить, куда направить наши ограниченные ресурсы для восстановления после войны."
 PAK_1965_Economy.3.d: "В настоящее время экономика переживает спад, в основном из-за растущего долга правительства и чрезмерных расходов банков. Министр финансов беспокоится, что текущая процентная ставка слишком низкая, и мы должны повысить ее, чтобы контролировать возможность кризиса платежей. Некоторые советники опасаются, что повышение процентных ставок оттолкнет интересы бизнеса и повредит экономическому росту, но иногда правительство должно принимать сложные решения. Выбор того, как действовать, лежит на президенте."
 PAK_1965_Economy.4.d: "Многие банки по всему Пакистану сообщают, что им не хватает средств, и они с трудом возвращают кредиты, которые выдавали. Во многом это связано с государственным стимулированием финансирования и текущими процентными ставками. Банки будут гораздо неохотнее предоставлять финансирование, и им потребуется время для восстановления своих активов. Это серьезный удар для экономического здоровья страны, но мы будем упорствовать и процветать."
 PAK_1965_Economy.5.d: "Недавно правительство Пакистана направило делегацию высших экономических чиновников, чтобы обсудить продолжение финансирования своих экономических программ. Пакистанцы отметили, что американская помощь в обеспечении иностранного финансирования значительно помогла правительству в реализации его последнего экономического плана. Они отметили, что для того, чтобы Пакистан окончательно переломил ситуацию в экономике, ему нужна дополнительная поддержка. Мы должны решить, хотим ли мы продолжать поддерживать пакистанскую экономику. Это улучшит отношения и даст нам больше рычагов влияния на них. Однако есть и те, кто утверждает, что слишком большое финансирование сделает Пакистан зависимым от такой поддержки и повредит их экономике в долгосрочной перспективе. Мы должны решить, что делать."
 PAK_1965_Economy.6.d: "Мы получили отличные новости из Вашингтона. США согласились продолжать поддерживать нашу экономику посредством экономической помощи и кредитов. Они также помогут нам получить финансирование от других дружественных государств для поддержания экономического подъема. Хотя некоторые советники опасаются, что наша зависимость от такого финансирования приведет к долгосрочным проблемам, преимущества, которые мы получаем сейчас, могут действительно превратить нашу страну в современную экономику. Министр финансов уже разрабатывает планы по использованию этих средств для крупных проектов развития. В идеале, при такой поддержке вся нация скоро будет пожинать плоды бурного роста экономики."
 SINO_PAK.1.d: "Первоначальным отношениям с Китаем и Пакистаном мешали геополитические расстановки и пограничные споры. Однако недавняя инициатива Пакистана провести переговоры по спорной границе была принята китайцами. После нескольких недель плодотворных переговоров обе стороны пришли к соглашению. Согласно соглашению, обе страны обязались провести демаркацию границы. Пакистан также согласился уступить Китаю Каракорумский тракт. Китайское и пакистанское правительства рассматривают это соглашение как начало настоящей дружбы. Хотя реакция народа была в основном положительной, индийское правительство подвергает его резкой критике. Многие индийские газеты утверждают, что Пакистан не имеет права даже уступать те земли, которые он уступил. Тем не менее, похоже, что Пакистан и Китай повернули за угол в своих отношениях/"
 SINO_PAK.2.d: "Правительство Пакистана и Китая объявили, что обе стороны начали строительство наземного маршрута, который свяжет две страны. Предлагаемый маршрут соединит СЗПП и Пенджаб с Синьцзяном через Гилгит-Балтистан. Обе стороны договорились, что шоссе будет проходить через перевал Хунджераб. Пакистанское строительство будет осуществляться Организацией пограничных работ, которая планирует использовать для проекта инженерный корпус пакистанской армии. Предлагаемый проект станет одной из самых длинных и высоких всепогодных автомагистралей на планете. Правительство Пакистана отмечает, что проект позволит восстановить древние связи Шелкового пути и восстановить исторические контакты между народами Пакистана и Китая."
 SINO_PAK.3.d: "Строительство Каракорумского шоссе продолжается как для Пакистана, так и для Китая. До сих пор были десятки смертельных случаев из-за схода лавин и экстремальных условий. В Гилгите создано китайское кладбище. Однако, несмотря на трудности, проект продолжается, а пакистанские инженеры получают ценные уроки в области дорожного строительства и планирования. Индийские эксперты выразили обеспокоенность тем, что предлагаемый маршрут, когда он будет завершен, позволит Китаю отправлять грузы или даже войска в любое время года, независимо от погодных условий. В настоящее время многие гималайские тропы и маршруты недоступны для крупномасштабных военных перевозок с января по апрель/"
 SINO_PAK.4.d: "Министерства иностранных дел Пакистана и Китая опубликовали заявление о том, что Каракорумское шоссе вступает в завершающую фазу строительства. В нем отмечается, что, несмотря на чрезвычайные опасности, как пакистанские, так и китайские рабочие продолжают усердно и с энтузиазмом трудиться на благо своего народа. Иностранные корреспонденты побывали на завершенных участках шоссе, и в их отчетах говорится о высокой прочности дорожного полотна. Правительства обеих стран продолжают восхвалять и рекламировать трудные инженерные подвиги и сотрудничество между обеими странами. Организация пограничных работ использовала опыт, полученный в ходе проекта, для значительного расширения своих инженерных возможностей/"
 SINO_PAK.5.d: "В ходе великолепной церемонии первый грузовик, груженный товарами, отправился из Кашгара в Китае. Его встречали ликующие толпы, когда он прибыл в Абботтабад в Пакистане, что ознаменовало официальное открытие Каракорумского шоссе. Позже правительство Пакистана устроило праздничный банкет с участием китайских коллег и дипломатов. Китайские СМИ высоко оценили открытие того, что они называют \"Шоссе дружбы\". В Пакистане ведущие газеты назвали дорогу восьмым чудом света. Новое шоссе обеспечивает круглогодичное сухопутное сообщение между Пакистаном и Китаем, способствуя развитию торговли и контактов. В стратегическом плане, к беспокойству Индии, этот маршрут гарантирует, что Китай сможет оказать военную или материальную поддержку Пакистану даже во время враждебного зимнего сезона. Организация пограничных работ теперь является ведущей военно-инженерной организацией в Пакистане/"
 PRC_PACT.1.d: "Только Индия знает об угрозе со стороны Китая не понаслышке. Хотя у нас есть разногласия с Индией, возможно, в ближайшем будущем придется приостановить наши взаимные военные действия. Сообщения о китайских границах продолжают бить тревогу по всему правительству. Конечно, в отношениях с Индией остается еще много нерешенных вопросов, и попытка быстрой нормализации отношений может привести к беспорядкам. Однако некоторые высокопоставленные чиновники считают, что мы можем предложить Индии пакт о ненападении сроком на три года или пять лет. Это позволит обеим странам работать над устранением слабых мест в отношении Китая. Некоторые военные руководители считают, что вся эта инициатива глупа, и Пакистан должен сам разбираться с Китаем. Теперь кабинет министров должен принять решение о предложении одного из вариантов ненападения, или же кабинет министров может решить просто отказаться от предложенной инициативы."
 PRC_PACT.2.d: "Министр иностранных дел принял своего пакистанского коллегу, который сделал беспрецедентное предложение. Он предложил подписать с нашим правительством трехлетний пакт о ненападении, который гарантирует отсутствие возможности конфликта в течение всего срока действия соглашения. В настоящее время пакистанцы обеспокоены состоянием своей границы с Китаем. Они опасаются, что китайцы планируют захватить занимаемые ими земли так же, как они недавно сделали это с нашими. Трехлетний период позволит их правительству и нашему правительству лучше подготовить наши территории к будущей китайской агрессии и может стать первым шагом на пути к миру. Однако некоторые военачальники выразили опасения, что это предложение - уловка, чтобы облегчить будущее пакистанское наступление в удобное для них время. Кабинет министров должен решить, как реагировать."
 PRC_PACT.3.d: "Министр иностранных дел принял своего пакистанского коллегу, который сделал беспрецедентное предложение. Он предложил подписать с нашим правительством пятилетний пакт о ненападении, который гарантирует отсутствие возможности конфликта в течение всего срока действия соглашения. В настоящее время пакистанцы обеспокоены состоянием своей границы с Китаем. Они опасаются, что китайцы планируют захватить занимаемые ими земли так же, как они недавно сделали это с нашими. Пятилетний период позволит их правительству и нашему правительству лучше подготовить наши территории к будущей китайской агрессии и может стать первым шагом на пути к миру. Однако некоторые военачальники выразили опасения, что это предложение - уловка для облегчения будущего пакистанского наступления в удобное для них время. Кабинет министров должен решить, как на это реагировать."
 PRC_PACT.4.d: "Неожиданным событием стало то, что правительство Пакистана и Индии объявили о заключении нового трехлетнего соглашения о взаимном ненападении под названием \"Индо-пакистанский пакт о ненападении\". Два традиционных соперника в Южной Азии заключили это соглашение из-за опасений по поводу все более настойчивой внешней политики Китая. Аналитики считают, что соглашение позволит обоим государствам сосредоточиться на более тщательной подготовке своих позиций вдоль китайской границы и укрепить свою внутреннюю базу без угрозы более широкой войны в Южной Азии. Китайцы осудили соглашение как сговор, в то время как западные государства приветствовали этот шаг. Внутри страны реакция была сдержанной, хотя в Пакистане прошли некоторые протесты против сотрудничества правительства с Индией."
 PRC_PACT.5.d: "Неожиданным событием стало то, что правительство Пакистана и Индии объявили о заключении нового пятилетнего соглашения о взаимном ненападении под названием \"Индо-пакистанский пакт о ненападении\". Два традиционных соперника в Южной Азии были вынуждены заключить это соглашение, опасаясь все более настойчивой внешней политики Китая. Аналитики считают, что соглашение позволит обоим государствам сосредоточиться на более тщательной подготовке своих позиций вдоль китайской границы и укрепить свою внутреннюю базу без угрозы более широкой войны в Южной Азии. Китайцы осудили соглашение как сговор, в то время как западные государства приветствовали этот шаг. Внутри страны реакция была приглушенной, хотя в Пакистане были некоторые протесты против сотрудничества правительства с Индией."
 PRC_PACT.6.d: "Срок действия беспрецедентного индо-пакистанского пакта о ненападении официально истек. Пакистан предложил это соглашение из-за беспокойства по поводу Китая. Индия, которая также имеет нерешенные пограничные вопросы с Китаем, приветствовала соглашение как возможность укрепить свой собственный потенциал для борьбы с китайской угрозой. Соглашение действительно привело к небольшому расцвету связей и культурного обмена между Индией и Пакистаном. Однако, поскольку срок действия соглашения истек, есть опасения, что может разгореться новая гонка вооружений между Индией и Пакистаном. Несмотря на успешное соглашение, необходим прогресс в других вопросах, чтобы Пакистан и Индия превратили свои отношения из соперничества в дружбу."
 PRC_PACT.7.d: "Министр иностранных дел вернулся из Индии с неутешительными новостями. Индийское правительство отказалось подписать предложенный нами пакт о ненападении. Они сослались на соображения безопасности и отметили, что являются миролюбивой нацией, не заинтересованной в разжигании войны. Однако очевидно, что Индия остается мощной угрозой нашей национальной безопасности. Поскольку ситуация с Китаем продолжает развиваться, наши силы и разведка должны сохранять бдительность в отношении коварных планов противника. В довершение ко всему индийское правительство просочило информацию о предложении таким образом, что наше правительство выглядит слабым. Китайцы, как говорят, расстроены тем, что они назвали предлагаемым антикитайским альянсом."
 PAK_SEC.1.d: "Соединенные Штаты внимательно следят за нашей борьбой с Китаем, а их официальные лица на местах выражают симпатии к коммунистической угрозе к северу от нас. Мы можем направить в США мощную дипломатическую миссию, чтобы попросить поддержки в обеспечении безопасности. Америка может стать сильным оплотом против коммунистической агрессии. Однако некоторые члены кабинета беспокоятся о нашей растущей зависимости от Америки и опасаются, что такая миссия может быть расценена как признак слабости со стороны населения, которое по своей природе враждебно относится к имперским державам."
 PAK_SEC.2.d: "Высокопоставленная пакистанская военная и дипломатическая миссия провела последние несколько дней, посещая Пентагон, Конгресс и Белый дом в попытке заручиться поддержкой своей страны. Пакистанцы опасаются агрессии коммунистического Китая на своих границах и просят помощи в сборе оборудования для трех новых горных дивизий. Госдепартамент и Пентагон предложили три варианта того, как мы можем ответить пакистанцам. Первый - предоставить оборудование для создания трех горных дивизий, что приведет в ярость Индию. Второй - предоставить нелетальную помощь и поддержку в обучении горным боевым действиям, что уменьшит гнев Индии и не унизит пакистанцев. Наконец, мы можем просто отказаться от предоставления какой-либо помощи, что, вероятно, повредит отношениям с Пакистаном, но они весьма зависимы от нашей поддержки, поэтому такая дипломатическая неудача будет временной."
 PAK_SEC.3.d: "В ответ на нашу просьбу о помощи в борьбе с китайской угрозой Соединенные Штаты согласились предоставить нам оборудование для того, чтобы в конечном итоге вырастить три горные дивизии. Как мы уже говорили Соединенным Штатам с момента обретения независимости, пока они предоставляют инструменты, мы можем наилучшим образом обучать, оснащать и развертывать наших людей. Правительства Китая и Индии выступили с резкой критикой американского решения, но это не имеет никакого значения, поскольку безопасность Пакистана является гораздо более важной задачей. Редакции по всей стране изображают военную помощь как результат прагматичной политики правительства, направленной на привлечение друзей."
 PAK_SEC.4.d: "В ответ на нашу просьбу о помощи в борьбе с китайской угрозой Соединенные Штаты объявили, что предоставят нам нелетальную помощь и передовую подготовку по горной войне. Хотя это разочаровывающий результат, поскольку многие в армии надеялись, что американское оборудование поможет ей вырастить новые формирования, это все же окажет ценную поддержку Пакистану. Правительство приветствовало решение американцев, но в частном порядке было разочаровано. Некоторые редакционные статьи отметили, что помощь была намного меньше, чем запрашивалось, и предположили, что Соединенные Штаты ограничили свою помощь, чтобы уменьшить беспокойство Индии по этому поводу. Китайское правительство выразило обеспокоенность по поводу растущего присутствия Соединенных Штатов в регионе. Ожидается, что вскоре прибудут американские военные эксперты, которые модернизируют учебные базы по горной войне в Пакистане."
 PAK_Kashmir_Unrest.1.d: "Из знаменитого храма Хазратбал в Сринагаре была похищена священная реликвия. Местные жители считают, что реликвия - это прядь волос Пророка, первоначально захваченная в семнадцатом веке императором Великих Моголов Аурангзебом. Когда распространилась новость о краже, десятки тысяч людей вышли на улицы в знак протеста в Кашмире. Индийские и местные власти проводят расследование, но протесты отмечаются своим размахом, и многие наблюдатели видят в этой спонтанной агитации признак политического возбуждения кашмирцев по поводу их международного статуса. Пакистанское правительство несет моральные обязательства перед народом Кашмира и должно принять решение. Должен ли Пакистан использовать военный вариант для решительного освобождения Кашмира или вместо этого ему следует сосредоточиться на дипломатических и разведывательных усилиях, чтобы заставить Индию принять резолюции ООН по этому вопросу?"
 PAK_Kashmir_Unrest.2.d: "Пакистанское правительство дает слово злоумышленникам и агитаторам в оккупированном ими Кашмире. Они улучшили передачу сигнала для своего так называемого \"Радио Свободный Кашмир\". Их передачи поощряют общинность, распространяют ложную пропаганду и агитируют к протестам. Мы уже выразили протест пакистанской дипломатической миссии, которая утверждает, что эта радиосеть - продукт независимых кашмирских активистов. Очевидно, что это попытка пакистанского правительства посеять смуту среди жителей Кашмира/"
 PAK_Kashmir_Unrest.3.d: "Так называемое \"Радио Свободный Кашмир\" недавно расширило свой канал передачи и мощность вещания, чтобы охватить больше районов Кашмира. Их передачи долгое время распространяли пакистанскую пропаганду и ложную информацию, но в последнее время они стали поощрять вооруженное сопротивление. Кашмирцев призывают сопротивляться нашему правительству любыми средствами, а также саботировать правительственные проекты в регионе. И снова наши призывы к правительству Пакистана прекратить подобную риторику игнорируются, но военные командиры на местах уверены, что смогут контролировать кашмирские волнения. Наши чиновники и агенты на местах будут отслеживать всех местных жителей, участвующих в распространении пакистанской пропаганды. Эти передачи подпитываются слухами о политических изменениях для Кашмира в рамках конституции/"
 PAK_Kashmir_Unrest.4.d: "Мы успешно выявили ряд кашмирцев, действующих в качестве агентов пакистанского государства. Мы знаем, что они предоставляют информацию, часто ложную, для так называемого \"Радио Свободный Кашмир\". Эти передачи вбивают клин в наши отношения с Кашмиром, и усилия по ограничению его вещания не дали результатов. Некоторые высокопоставленные полицейские и военные чиновники советуют нам быстро задержать этих агентов и судить их по законам о подстрекательстве. Приведя их в пример, мы покажем, что наше правительство сильное, и дадим сигнал. Другие члены кабинета министров предлагают просто следить за этими людьми и в частном порядке обращаться к ним, используя либо примирительные, либо принудительные методы, чтобы убедить их прекратить свою деятельность. Мы должны решить, как поступить в этой ситуации/"
 PAK_Kashmir_Unrest.5.d: "По всему Пакистану десятки тысяч людей вышли на улицы, чтобы осудить индийскую оккупацию Кашмира. Флаги Азад Кашмира развевались вместе с пакистанскими флагами, а ораторы весь день осуждали зверства и угнетение в оккупированном Индией Кашмире. Правительственные чиновники и министры присоединились ко многим из этих протестов, пообещав, что Пакистан по-прежнему предан делу освобождения Кашмира и его народа. Министерство иностранных дел опубликовало заявления по всем своим дипломатическим представительствам, подчеркивающие насилие и беспорядки в оккупированном Кашмире. Эта массовая публичная демонстрация призвана укрепить поддержку правительства в этом вопросе и привлечь внимание международной общественности к спорной территории."
 PAK_Kashmir_Unrest.6.d: "Поскольку общественность стоит за нами, а народ оккупированного Индией Кашмира требует решения, настал момент обратиться в Организацию Объединенных Наций по поводу выполнения Индией резолюций ООН, касающихся Кашмира. Индия, конечно, большая страна и, похоже, привержена своей оккупации. Тем не менее, мы составили проект резолюции, требующий от Индии выполнения резолюции или экономических санкций. Недавние волнения в Кашмире и наши общественные усилия привлекли внимание международной общественности. Если Соединенные Штаты и Советский Союз не наложат вето на резолюцию, мы сможем оказать огромное экономическое давление на Индию, пока она не подчинится. Однако министр иностранных дел предлагает, что прежде чем обращаться в ООН, мы должны сначала спросить у Индии, не хотят ли они провести всеобъемлющие переговоры, если эти усилия не увенчаются успехом, тогда мы можем обратиться в ООН."
 CML_Bhutto.1.d: "Учитывая ситуацию, в которой оказался Пакистан, военные сочли, что у них нет другого выбора, кроме как передать власть Зульфикару Али Бхутто. Бхутто контролирует крупнейшую политическую партию в Пакистане и добился успеха на выборах, что дает ему легитимность, которой не обладает ни один военный лидер. В своей вступительной речи Бхутто пообещал восстановить Пакистан как физически, так и как народ. Он пообещал прислушаться ко всем мнениям в стране и начать процесс перехода страны к конституции, которую смогут одобрить все пакистанцы. Он добавил, что его нынешний титул главного администратора военного положения и президента был временным и призван помочь в первоначальном восстановлении страны. Его речь была хорошо принята, и многие считают это хорошим знаком для будущего Пакистана."
 DemRahman65.1.d: "Правительство приняло закон о национализации сталелитейной промышленности. Это последние меры шейха Муджибура Рахмана по продвижению страны к социалистической экономике. Национализация призвана повысить производительность труда, обуздать коррупцию и положить конец любой эксплуатации рабочих. После голосования Рахман заявил журналистам, что эра кумовского капитализма в Пакистане закончилась. Он также заявил, что государственное руководство и финансирование повысят производительность и приведут к более эффективной работе промышленности. Критики отмечают, что у правительства может не хватить возможностей или опыта для управления такой отраслью, и есть опасения, что коррупция может подорвать процесс. Тем не менее, ожидается, что это объявление будет популярным среди многих в стране."
 DemRahman65.2.d: "Во время недавних дебатов в Национальной ассамблее члены правительства задали министру иностранных дел вопросы, касающиеся связей с Соединенными Штатами. Эти парламентарии задали вопрос, как Пакистан может поддерживать дружеские связи с государством, которое открыто сотрудничает с колониальными державами и иногда увековечивает продолжающееся колониальное правление по всему миру. Министр иностранных дел согласился с этими заявлениями и настоял на том, что правительство проведет переоценку связей между Пакистаном и США. Многие наблюдатели отметили, что эта демонстрация в парламенте, скорее всего, была срежиссирована правительством, чтобы показать, почему Пакистан хочет отойти от США и установить более тесные связи с социалистическими государствами. Американский посол выразил свое разочарование по поводу комментариев, сделанных в Национальном собрании, в то время как Государственный департамент в Вашингтоне внезапно отменил запланированный визит высокопоставленных экономических чиновников в Пакистан. Пакистан также отменил планы по приему американской военной миссии в стране. Китайское и советское правительство, как говорят, довольны этими недавними событиями."
 Dem_Ayub.1.d: "Президент скоро посетит Дахку, и в стране сохраняется напряженность в связи с продолжающимся спором о том, является ли бенгальский язык национальным. Для жителей Восточного Пакистана, несмотря на то, что Национальная ассамблея повысила статус языка, все еще существует горечь по поводу сопротивления со стороны правительства и пакистанцев из западного крыла. Для многих лидеров Западного Пакистана есть аргументы в пользу того, что урду должен быть единственным национальным языком, поскольку это язык ислама в Южной Азии. Другая фракция считает, что если бенгальский язык может быть повышен, то и все основные региональные языки, такие как пенджаби, синдхи, пастхо и белуджи, должны быть повышены. Президент выступит с речью в провинциальном законодательном собрании и должен сформулировать свое мнение по поводу дебатов или проигнорировать вопрос."
 Dem_Ayub.2.d: "Представители Восточного Пакистана со сторонниками из некоторых малых этнических групп предложили создать федеральные квоты. Сторонники законопроекта отмечают, что бенгальцы, несмотря на то, что составляют наибольшую часть населения Пакистана, в настоящее время недостаточно представлены на государственной службе и практически во всех федеральных агентствах. Кроме того, очень низка представленность бенгальцев в армии. Новый закон обяжет федеральные ведомства и вооруженные силы обеспечить пропорциональное представительство каждой основной этнической группы в своих организациях в соответствии с данными последней переписи населения. Государственные учреждения и сторонники президента Айюб Хана выступили против закона, заявив, что эти учреждения уже исправляют ситуацию, но слишком быстрый переход может привести к неэффективности. Противники указывают, что прошло уже более десяти лет с момента обретения независимости, а значимых изменений так и не произошло. Вскоре началось голосование."
 Dem_Ayub.3.d: "При недолгом режиме Айюб Хана гражданская служба была мобилизована в поддержку режима, и многие отмечали сильный союз военных и гражданской службы, который сформировался против старого политического порядка. С принятием новой конституции и демократической конституции Национальное собрание должно решить, что делать с расширением роли бюрократии. Некоторые утверждают, что законодательный орган должен узаконить дополнительные полномочия и влияние, предоставленные гражданской службе в начальный период военного положения. Они отмечают повышение эффективности и реализацию государственной политики. Однако другие опасаются, что узаконивание этих полномочий бросит вызов местным властям и постепенно создаст ситуацию, в которой Национальное собрание обнаружит, что его полномочия и способность осуществлять перемены сведены на нет."
 Ayub_East_Pakistan.1.d: "Одним из насущных вопросов, стоящих перед Пакистаном с момента обретения независимости, является продолжающаяся борьба между восточным и западным крылом. Восточный Пакистан имеет самое большое население, самую однородную этническую группу и наименьшее представительство в армии и на государственной службе среди всех групп пакистанцев. Лидеры Восточного Пакистана выступают за провинциализм и обвиняют правительство в дискриминации и эксплуатации. Сейчас, когда у власти находится твердое правительство, мы должны решить, следует ли решительно утверждать власть центра и преследовать диссидентов за антипакистанские настроения. Или, может быть, лучше формировать национальную идентичность через установление контактов и решение некоторых законных проблем бенгальцев, таких как представительство в армии и уважение бенгальского наследия."
 One_Unit_60s.1.d: "Правительство Пакистана объединило все провинции западного крыла в одну провинцию под названием Западный Пакистан в рамках политики Единица. Это должно было способствовать национальному единству, повышению эффективности и компенсировать этническую однородность и большую численность населения Восточного Пакистана. Однако после введения Единицы в стране появилось много критики, особенно среди лидеров бывших провинций СЗПП и Синд. Они утверждают, что Единица поощряет господство пенджабцев и заглушает их голоса, а также голоса белуджей Белуджистана. Преимущество Единицы в том, что она уравнивает два крыла страны, укрепляет федеральное правительство и способствует интеграции народов Западного Пакистана, но усиливающаяся агитация противников говорит о том, что она по-прежнему непопулярна в народе. Правительство должно решить, ликвидировать Единицу или сохранить ее."
 PAK_Frontier.1.d: "Еще до обретения независимости лидеры националистов-патанов во главе с харизматичным Абдулом Гаффаром Ханом призывали к независимости или достаточной автономии, чтобы стать независимыми. Эти левые активисты, в настоящее время в основном члены недавно запрещенной Национальная Партия Авами (НПА), продолжают свою агитацию и, по слухам, находятся в союзе с агентами афганского правительства. Недавно они выступили с резкой жалобой на правительство и роль военных. Правительство получило два предложения. Одно из них - продолжать аресты и задержания старших лидеров НПА, хотя это, как правило, возбуждает городских рабочих в Пешаваре. Другой подход заключается в том, чтобы освободить лидеров НПА и не позволить им стать политическими мучениками для своих сторонников. Вместо этого мы можем сосредоточиться на привлечении сельского большинства к поддержке правительства."
 PAK_Restore_Provinces.1.d: "После восстановления провинций были проведены новые провинциальные выборы. Члены региональных политических партий, включая многих сторонников автономии провинций, получили места во всех провинциях, создавая конфронтацию с центром и провинциями. Правительству будет гораздо сложнее эффективно управлять или использовать гражданскую службу для контроля за изменениями в провинциях. Одним из предложений кабинета министров является увеличение фондов развития для провинциальных правительств, чтобы убедить их быть более сговорчивыми. Однако другие члены кабинета опасаются, что такие усилия окажутся пустой тратой времени, и потребуется лишь немного времени для нормализации обмена с провинциями."
 Rahman_Victorious.1.d: "Пакистанцы в нескольких местах расквартирования в Западном и Восточном Пакистане проснулись от вида военных машин и хорошо вооруженных войск, патрулирующих улицы. Вооруженные войска также заняли ключевые правительственные здания в Исламабаде и Дакке. Однако этот очевидный переворот быстро сошел на нет. Во второй половине дня большая колонна пакистанских войск из Равалпинди вошла в столицу, после короткого противостояния они вывели мятежных солдат из правительственных зданий. В то же время войска, занимавшие расквартирование, вернулись в свои казармы. К вечеру президент Муджибур Рахман выступил с обращением к нации, он рассказал, что заговор, возглавляемый некоторыми реакционными офицерами, был сорван старшими офицерами и патриотичными солдатами, которые отказались предать конституцию. Он объявил временный комендантский час и призвал к спокойствию, поскольку те, кто причастен к заговору, взяты под стражу."
 Rahman_Victorious.2.d: "Массовые толпы пакистанцев вышли на улицы в Дакке, Исламабаде, Лахоре и Карачи. Они митингуют в поддержку правительства и демократии. Протестующие выражают свою поддержку государству после недавней неудачной попытки государственного переворота. Во время митингов ведущие политики из правящей коалиции выступали перед толпой, восхваляя деятельность шейха Муджибура Рахмана. Однако некоторые из выступавших сделали провокационные комментарии, осудив военных за противодействие демократии. Военизированный и военный персонал не стал оказывать поддержку местным властям в контроле над толпой, сохраняя спокойствие."
 Rahman_Victorious.3.d: "Президент Шейх Муджибур Рахман объявил о назначении военного трибунала для рассмотрения и расследования недавней попытки переворота. В своем выступлении он высоко оценил патриотизм и профессионализм военнослужащих, действовавших в защиту государства. Он призвал средства массовой информации прекратить спекуляции на этом инциденте и осудил недавние редакционные статьи, в которых говорилось о проблеме бонапартизма в армии. Генерал Тикка Хан возглавит трибунал, в котором генерал-майор Зия-уль-Хак обвиняется как главарь неудавшейся попытки переворота. Пакистанцы нервно ожидают дополнительной информации о предполагаемом заговоре. Десятки офицеров находятся под стражей, а военные демонстративно отсутствуют на улицах, чтобы не возбуждать население. Аналитики считают, что президент решил позволить военным вынести решение по этому делу после того, как в последние дни столкнулся с огромным давлением со стороны старших офицеров."
 Rahman_Victorious.4.d: "Генерал Тикка Хан готов вынести решение по суду над пакистанскими офицерами, участвовавшими в неудавшемся заговоре переворота. Суд и расследование показали, что, хотя заговор провалился, есть много пакистанских офицеров, которые относятся к социализму с подозрением. Многие в обществе хотели бы, чтобы все офицеры, подозреваемые в причастности к заговору, были уволены, а те, кто его осуществил, получили длительные сроки тюремного заключения. Однако среди военных есть ощущение, что широкомасштабные репрессии нанесут оскорбление институту и послужат интересам антивоенных элементов. Они предпочли бы, чтобы главные заговорщики были уволены со службы, а все остальные подозреваемые в заговоре были возвращены на службу. Генерал Тикка Хан должен взвесить последствия для нации и последствия для армии."
 Rahman_Victorious.5.d: "Приговор, вынесенный военным трибуналом под руководством генерала Тикка Хана, был недавно опубликован. Генерал Зия-уль-Хак, а также несколько других старших офицеров будут приговорены к десяти годам военной тюрьмы и уволены со службы. Они признаны виновными в попытке переворота с целью свержения правительства. Суд принял к сведению, что заговорщики не применяли вооруженное насилие при обосновании тюремного срока. Десятки других офицеров, признанных виновными в том, что они знали о заговоре, подлежат немедленному увольнению из вооруженных сил. Трибунал отметил, что хотя эти офицеры не участвовали в покушении, их несообщение о заговоре сделало их непригодными для службы в армии. Президент поблагодарил трибунал за выполнение своего долга."
 Rahman_Victorious.6.d: "СМИ и общественность положительно отреагировали на недавнее решение военного трибунала. Редакции хвалят генерала Тикка Хана за привлечение к ответственности участников переворота, утверждая, что это решение свидетельствует о новой зрелости военных. Президент также высказался в поддержку приговора, похвалив военных за преданность конституции. Однако в рядах военных, как говорят, есть недовольство. Некоторые считают, что тюремные сроки слишком суровы и очерняют репутацию офицерского корпуса. Большинство возмущены тем, что из армии было удалено так много перспективных офицеров. Этих людей убрали на основании слабых вещественных доказательств или за то, что они подчинялись начальству. Независимо от этого, Пакистан будет стремиться двигаться дальше от этого дела."
 Rahman_Victorious.7.d: "Недавно был обнародован приговор, вынесенный военным трибуналом под руководством генерала Тикка Хана. Генерал Зия-уль-Хак, а также несколько других старших офицеров должны быть уволены со службы и помещены под домашний арест на обозримое будущее. Они признаны виновными в попытке переворота с целью свержения правительства. Десятки других офицеров, обвиняемых в том, что они знали о деталях заговора, но не проинформировали правительство, не будут наказаны. Трибунал отметил, что попытка переворота не привела к насилию или гибели людей, но те, кто участвовал в ней, должны быть уволены со службы. Что касается обвиняемых сообщников, то трибунал сослался на отсутствие доказательств, помимо свидетельских показаний."
 Rahman_Victorious.8.d: "СМИ и общественность негативно отреагировали на недавнее решение Военного трибунала. Редакционные статьи обвиняют военных в том, что они защищают свои собственные интересы, а не нужды и желания нации. Распространяются подпольные антивоенные брошюры, призывающие народ готовиться к защите правительства от будущих военных замыслов. В армии приговор рассматривается как справедливый, беспристрастный ответ. Военнослужащие возвращаются на улицы в форме и с гордо поднятой головой. Президент Муджибур Рахман не сделал заявления и не обратился к нации после вынесения приговора. Многие считают, что президент и высшие политические лидеры в ярости от приговора, видя в нем прямой вызов гражданской власти."
 Pakistan_Alt_1973_Coup.1.d: "Пакистанцы проснулись от вида войск и танков в городах Западного Пакистана и в некоторых районах расквартирования в Восточном Пакистане. Правительственные здания были заняты, а дома ведущих политиков, по сообщениям, в настоящее время окружены войсками. Другие политики, как говорят, находятся под домашним арестом. Вскоре после этого армия объявила о том, что она взяла контроль над страной от президента Муджибура Рахмана. Лидером этого переворота стал молодой генерал-майор Зия-уль-Хак. Судя по всему, переворот был спланирован в высших эшелонах власти, и, по слухам, эти старшие офицеры также находятся под арестом. В своем выступлении президент Зия заявил, что нация движется в сторону атеизма и провинциальной политики, что приведет к разрушению нации. Генерал Зиа пообещал, что новые выборы будут проведены в ближайшее время. Однако неизвестно, насколько сильно военные контролируют ситуацию в Восточном Пакистане, где большинство сил - бенгальские."
 Pakistan_Alt_1973_Coup.2.d: "После военного переворота ситуация в Пакистане находится в напряженном тупике. Западный Пакистан в основном находится под контролем военных, которые пользуются поддержкой консервативных и религиозных слоев, долгое время выступавших против движения к социализму в стране. Внутри армии Зия заручился поддержкой большей части офицерского корпуса, который выступает против роста альтернативных военных сил. Однако «Авами Лиг» удалось сохранить контроль в Восточном Пакистане, поскольку бенгальские силы в армии отказались присоединиться к генералу Зиа. Когда ситуация зашла в тупик, генерал Зия направил группу офицеров и политических союзников в Дакку для переговоров с «Авами Лиг» и шейхом Муджибуром Рахманом."
 Pakistan_Alt_1973_Coup.3.d: "После интенсивных переговоров «Авами Лиг» и военное правительство объявили о достижении соглашения. Из уважения к чувствам западнопакистанцев и восточнопакистанцев было решено, что шейх Муджибур Рахман и «Авами Лиг» останутся под контролем Восточного Пакистана, а военные не будут пытаться захватить контроль над восточным крылом. «Авами Лиг» согласились позволить военному режиму управлять Западным Пакистаном до тех пор, пока не будет достигнуто окончательное соглашение. По сути, обе стороны согласились сохранить статус-кво. Большинство пакистанцев, похоже, смирились с ситуацией, надеясь, что гражданской войны удастся избежать."
 Pakistan_Alt_1973_Coup.4.d: "После соглашения с «Авами Лиг» и её существенного удаления из Западного Пакистана, Зульфикар Бхутто, безусловно, является самым популярным политиком в стране. Недавно генерал Зия направил к Бхутто своих представителей с вопросом о его намерениях. Дерзкий Бхутто упомянул о своем неодобрении переворота и призвал к восстановлению демократии. Генерал Зия и его высшие генералы должны решить, следует ли им позволить Бхутто выйти из-под домашнего ареста и создать конституционную ассамблею страны. Он создаст новую конституцию, которая сохранит исламские принципы страны и положит конец провинциальным конфликтам. Бхутто можно было бы убедить оставить Зию на посту главнокомандующего армией и не нападать на лидеров переворота, если бы ему дали власть. Другой вариант - держать Бхутто под стражей и провести расследование в отношении него по обвинению в коррупции, пока военное правительство продолжает править."
 Pakistan_Alt_1973_Coup.5.d: "После освобождения из-под домашнего ареста Зульфикар Бхутто призвал все политические партии объединиться для проведения конституционного собрания. В настоящее время пакистанская армия отступает, отменяет правила военного положения и возвращает контроль местным гражданским властям. Бхутто призывает к принятию новой конституции, которая разрешит нерешенные вопросы и предотвратит раскол, царящий по всей стране. Чтобы создать единый Пакистан, Бхутто пригласила «Авами Лиг» принять участие и политически воссоединить два крыла страны."
 Pakistan_Alt_1973_Coup.6.d: "«Авами Лиг» шокировала нацию, отказавшись присутствовать на Конституционном собрании, созванном Зульфикаром Бхутто. Они отметили, что Бхутто, похоже, является военной марионеткой, и как лидер партии меньшинства может руководить собранием по конституции. Это заявление поставило крест на планах по объединению Пакистана. Попытки Бхутто провести переговоры не увенчались успехом, а шейх Муджибур Рахман заявил, что больше не будет мириться с продолжающимся угнетением бенгальцев. Похоже, что «Авами Лиг» теперь намерена добиться самоуправления для Восточного Пакистана. По всему Восточному Пакистану вспыхнули протесты, народ требует независимости и вывода пакистанских военных. Говорят, что пакистанские войска в Восточном Пакистане остаются в казармах и сводят к минимуму контакты с широкой общественностью."
 Pakistan_Alt_1973_Coup.7.d: "Отказ «Авами Лиг» участвовать в конституционном собрании привел к тупиковой ситуации, когда Зульфикар Бхутто контролировал Западный Пакистан, а Муджибур Рахман - Восточный Пакистан. Чтобы выйти из этого тупика и положить конец растущему чувству отчаяния среди пакистанцев, пакистанские военные объявили о планах вывода своих войск из Восточного Пакистана. Это открывает путь к полному отделению. Тем военным, которые пожелают остаться в Восточном Пакистане, будет разрешено остаться. Однако армия объявила, что выведет из Восточного Пакистана всю не прибитую технику и призовет резервистов, чтобы заменить тех офицеров и солдат, которые останутся. За прошедшие годы многие бенгальцы поступили на военную службу, многие уже расквартированы в Восточном Пакистане, и, скорее всего, они останутся. Эксперты считают, что как только военные завершат эвакуацию, последует разделение."
 Pakistan_Alt_1973_Coup.8.d: "Выступая на переполненном стадионе, шейх Муджибур Рахман провозгласил независимость Бангладеш. По всей Дакке и на территории бывшего Восточного Пакистана миллионы людей вышли на улицы, и почти на каждом доме развевались самодельные флаги Бангладеш. Позже Рахман встретился с высокопоставленными правительственными и военными чиновниками Пакистана, которые официально поздравили народ Бангладеш и пообещали новую эру братских отношений. Несмотря на это публичное признание, и бангладешцы, и пакистанцы горько переживают разделение, причем многие обвиняют другую сторону в неспособности пойти на компромисс или принять решения, необходимые для сохранения Пакистана."
 Pakistan_Alt_1973_Coup.9.d: "Когда Зульфикар Бхутто был арестован, а шейх Муджибур Рахман все еще контролировал Восточный Пакистан, генерал Зия уль-Хак созвал совещание командиров корпусов для обсуждения ситуации. В ходе обсуждения на высоком уровне Зия представил два варианта того, как справиться с нарастающими волнениями, особенно среди городских левых и сторонников Бхутто. Как только с этими группами удастся справиться, правительство сможет заняться Муджибуром Рахманом и Восточным Пакистаном. Один из вариантов предусматривает агрессивное военное подавление. Генералы прозвали этот подход \"кнутом\". Другой вариант - пойти на уступки и компромисс с основными политическими группировками страны, чтобы править в сотрудничестве."
 Pakistan_Alt_1973_Coup.10.d: "Военное правительство объявило, что вскоре выдвинет обвинения в коррупции и убийстве против Зульфикара Али Бхутто. Эта ошеломляющая новость появилась спустя несколько месяцев после того, как крупный политический лидер был помещен под домашний арест после военного переворота, совершенного пакистанской армией. Бхутто успел выпустить письменное заявление, в котором осудил обвинения как сфабрикованные и необоснованные. Он призвал народ Пакистана продолжать сопротивление антидемократическим силам и спасти страну. Когда международные СМИ спросили его об обвинениях, генерал Зия заявил, что у него нет комментариев, поскольку судебная система не находится под его влиянием. Он заявил, что судьбу Бхутто определят суды Пакистана и верховенство закона. Поступают сообщения о нападениях на военные патрули в Карачи, что порождает слухи о вооруженном сопротивлении..."
 Pakistan_Alt_1973_Coup.11.d: "Правительство Пакистана под руководством генерала Зиа объявило, что достигло соглашения с \"Авами Лиг\" во главе с шейхом Муджибуром Рахманом. Недавно Зия пытался свергнуть Рахмана в результате военного переворота, но бенгальскому лидеру удалось бежать в Дакку и взять под контроль Восточный Пакистан. Обе стороны договорились об обмене правительственным и военным персоналом, это позволит жителям Восточного Пакистана, проживающим в Западном Пакистане, вернуться домой, и наоборот. Он также требует полного вывода пакистанской военной техники из страны, генерал Зия настаивает на том, что она принадлежит Пакистану. После того как оборудование и персонал будут обменены, Пакистан признает независимость Бангладеш. Многие жители как Западного, так и Восточного Пакистана приветствуют эту новость, поскольку они сыты по горло постоянными политическими конфликтами и беспорядками."
 Pakistan_Alt_1973_Coup.12.d: "Пакистан подтвердил свою приверженность недавнему соглашению с Бангладеш, опубликовав свой план эвакуации. Военнослужащие и правительственные чиновники, желающие репатриироваться обратно в Пакистан, должны сделать это как можно скорее. Правительство также направляет и нанимает транспортные службы для обеспечения скорейшего вывоза военного и государственного оборудования, приобретенного для государства Пакистан. Правительство утверждает, что завершит эвакуацию примерно за три месяца. Правительство Пакистана, отвечая на критику, что оно ничего не оставляет Бангладеш, отметило, что в этот же период оно наймет и организует эвакуацию жителей Восточного Пакистана, желающих покинуть Западный Пакистан. Генерал Зия выразил пожелание будущих братских связей."
 Pakistan_Alt_1973_Coup.13.d: "Генерал Зия подписал с шейхом Муджибуром Рахманом в Дакке документ, подтверждающий независимость Бангладеш. Два человека, бывшие соперники, которые месяцами находились в политическом тупике, тепло обнялись после подписания. Шейх Муджибур Рахман выразил свою радость за народ Бангладеш, хотя и отметил, что для этого потребовалось много трудностей. Генерал Зия просто выразил свое желание, чтобы обе страны продолжали идти по пути ислама и видения Мохаммад Али Джинна. На следующий день эти два человека должны были встретиться для переговоров, и генерал Зия должен был решить, воспользуется ли он возможностью предложить Бангладеш союз или просто оставит ситуацию как есть."
 Pakistan_Alt_1973_Coup.14.d: "Во время частных переговоров между шейхом Муджибуром Рахманом и пакистанским лидером генералом Зия уль-Хаком, пакистанский силач призвал обе стороны подписать союз. Зия отметил, что и Пакистан, и Бангладеш являются потомками пакистанского движения, и их народы должны поддерживать тесные связи. Хотя единое государство невозможно, новая дружба, основанная на взаимном уважении и независимом развитии, может сделать два государства мощным альянсом в регионе. Рахман поблагодарил генерала Зия, но заявил, что должен обсудить этот вопрос с кабинетом министров. Ответ кабинета министров, похоже, склоняется к тому, чтобы отклонить предложение. Они отмечают, что генерал Зия был тем, кто стремился свергнуть «Авами Лиг», что привело к нынешним обстоятельствам, и опасаются, что народ будет чувствовать себя преданным. Однако другие, особенно те, кто связан с религиозными партиями, отмечают, что такой альянс может подтвердить, что Бангладеш занимает важное место как на региональном, так и на международном уровне. Муджибур Рахман должен решить, как на это реагировать..."
 Yahya_Khan.1.d: "Президент Айюб Хан объявил, что больше не может руководить страной, охваченной беспорядками. Он заявил, что его целью всегда был прогресс и улучшение положения народа Пакистана, но это больше невозможно. Вместо этого он передал власть генералу Яхья Хану, своему протеже. Хан быстро провозгласил военное положение и назвал себя Главным администратором военного положения (ГАВП). Он объявил о развертывании войск по всей стране для восстановления закона и порядка. Как только это будет достигнуто, на помощь придут новые, демократические выборы. Общей реакцией был осторожный оптимизм. Многие в стране хотели бы видеть восстановление демократии, но все больше уставали от растущего роста преступности."
 Yahya_Khan.2.d: "Чтобы лучше координировать ситуацию с безопасностью в Пакистане и подготовиться к выборам, ГАВП Яхья Хан созвал Совет национальной безопасности (СНБ), призванный объединить высших гражданских и военных чиновников, отвечающих за безопасность. Этот шаг приветствуется наблюдателями, которые рассматривают его как попытку военного правительства управлять вместе с гражданскими лицами, давая им более широкий взгляд на ситуацию в стране. В ходе первого заседания СНБ высоко оценил успешное восстановление правопорядка по всему Пакистану и заявил о своей поддержке планов по скорейшей организации новых выборов в стране."
 Yahya_Khan.3.d: "Генерал ГАВП Яхья Хан объявил о введении в действие Правового рамочного приказа Но. 1970. Этот приказ устанавливает рамки для предстоящих выборов и официально отменяет схему Единица, восстанавливая первоначальные четыре провинции того, что было Западным Пакистаном. Этот шаг приветствуется многими, кто считает, что схема Единица была направлена на развитие пенджабского большинства в Западном Пакистане, а другие регионы и этнические группы остались в стороне. Что касается выборов, постановление обещает всеобщее избирательное право, пропорциональное представительство, предоставление восточному крылу большинства мест, а также простое большинство, необходимое для внесения изменений в конституцию. В нем говорится, что у избранного Национального собрания будет четыре месяца на окончательную разработку новой конституции Пакистана. "
 Tashkent_Bhutto.1.d: "Зульфикар Бхутто несколько лет проработал в кабинете Айюб Хана. Изображая из себя преданного генерала и патриота, он быстро стал надежным доверенным лицом. Высокообразованный выпускник Оксфорда вскоре стал министром иностранных дел, привнеся свою харизму и артикулированные речи в международные органы. В правительстве Бхутто возглавил \"ястребов\" по Кашмиру и добился начала операций в Кашмире. В результате война зашла в тупик, а во время мирных переговоров в Ташкенте Бхутто публично осудил договор. По возвращении в Пакистан его отношения с правительством испортились, и он подал прошение об отставке. В течение следующих нескольких месяцев Бхутто выступал перед большими аудиториями, излагая свои планы по созданию новой партии, которая будет объединять Пакистан ислама, демократии и социализма. Недавно он объявил о создании этой партии под названием Пакистанская народная партия или ПНП, председателем которой он является. Она объединяет ведущих социалистических и коммунистических лидеров Пакистана."
 Delhi_Unrest.1.d: "Высшее руководство пакистанских вооруженных сил было ошеломлено после недавнего выступления офицеров в штабном колледже в Кветте. Когда директор по военным операциям обратился к собравшимся офицерам, большинство из которых были майорами, он столкнулся с насмешками и гневными выпадами. Есть сообщения о подобных вспышках гнева в различных расквартированиях, но не в таких масштабах, как в Кветте. Низшие офицеры считают, что старшие военные офицеры были в значительной степени некомпетентны во время войны, и требуют реформ наряду с отставками. Потребуется время, чтобы восстановить дисциплину и вернуть доверие к нашему институту. Военной разведке будет поручено следить за ситуацией и вмешиваться, если молодые офицеры начнут планировать более открытые действия против института или государства."
 PAK_Social_Democratic_PPP: "ПНП"
 PAK_Social_Democratic_PPP_long: "Пакистанская Народная Партия"
 DemRahman1970.0.d: "В очередной раз миллионы пакистанцев пришли на выборы, чтобы определить, какая партия будет править Пакистаном и кто станет президентом. Бывший президент и отец нынешней конституции Айюб Хан объявил о своем уходе из политики и не будет участвовать в выборах. Однако молодой Зульфикар Али Бхутто, похоже, возглавит свою собственную партию, Пакистанскую народную партию, и центристскую коалицию против Шейха Муджибура Рахмана и его левой коалиции социалистических партий. Хотя Бхутто и Рахман оба выступают за социализм, Бхутто выступает за исламский социализм, который сторонники Рахмана отвергают как слишком смягченный. Для партий центра и правых Бхутто представляется меньшим из двух зол, особенно потому, что он поддерживает сильный центр, однако, также наблюдается широкая поддержка не только социализма Рахмана, но и его сторонников почти несуществующего центра и большей автономии провинций, особенно Восточного Пакистана."
 DemRahman1970.1.d: "На напряженной сессии Национального собрания президент Шейх Муджибур Рахман выступил в поддержку недавно представленного законопроекта, призывающего к реализации «Шести Пунктов» для Восточного Пакистана. Шейх Муджибур Рахман представил «Шесть Пунктов» несколькими годами ранее как ряд политических мер, направленных на обеспечение прав и достоинства Восточного Пакистана. В то время западнопакистанцы и федералисты осудили эти предложения за то, что они, по сути, предоставляли Восточному Пакистану независимость. После его выступления состоялись жаркие дебаты, в ходе которых многие представители оппозиции, особенно представители Западного Пакистана, осудили новый законопроект как выписывающий смертный приговор единому Пакистану. Многие представители правительства и бенгальские депутаты высказались в поддержку законопроекта, назвав его восстановлением чести бенгальцев."
 DemRahman1970.2.d: "Новости о законопроекте «Шесть Пунктов» в Национальной Ассамблее повергли Пакистан в беспорядки. По всему Западному Пакистану многие вышли на улицы, чтобы осудить шейха Муджибура Рахмана как бенгальского агента, работающего на уничтожение нации. Зульфикар Али Бхутто, лидер оппозиции, выступил на некоторых митингах в Карачи, заявив, что понимает чувство страдания народа. В Дакке бенгальцы пришли массовыми толпами, празднуя принятие законопроекта. Многие считают, что Пакистан относился к ним как к гражданам второго сорта, и новый законопроект исправит эту проблему."
 DemRahman1970.3.d: "Политические последствия законопроекта «Шесть Пунктов» достигли критической точки, когда все представители Западного Пакистана вышли из Национального собрания и вылетели из Дакки. Их вывел лидер оппозиции Зульфикар Али Бхутто. Приземлившись в Карачи, Бхутто заявил, что они не вернутся в парламент, если правительство не отзовет законопроект «Шесть Пунктов». Шейх Муджибур Рахман повел себя вызывающе, заявив, что его не заставят отказаться от выполнения воли народа. Он отметил, что оставшиеся члены ассамблеи могут завершить принятие законопроекта и без оппозиции. Аналитики отмечают, что без бойкотирующих парламентариев страна выглядит явно разделенной."
 DemRahman1970.4.d: "После вступления в силу новой конституции военные активизировали свои усилия по набору военнослужащих в соответствии с этническим составом страны. В результате в вооруженных силах служит гораздо больше бенгальцев, чем раньше. Это осложнило нынешний политический климат. В армии обсуждалась возможность вмешательства и взятия ситуации под контроль. Однако стало ясно, что такие действия могут спровоцировать крупный мятеж или восстание бенгальских сил. Учитывая, что многие из этих солдат и офицеров находятся в Восточном Пакистане, любой приказ о захвате Национальной ассамблеи мог привести к катастрофе. Главный штаб проинформировал лидеров оппозиции, что военные не могут действовать позитивно, учитывая обстоятельства."
 DemRahman1970.5.d: "Зульфикар Али Бхутто и делегация западнопакистанских парламентариев, военных лидеров и гражданских служащих встретились со своим шейхом Муджибуром Рахманом и его собственной делегацией. После ряда обсуждений обе стороны договорились о разделе имущества и репатриации западнопакистанского персонала из Восточного Пакистана. Очевидно, что Рахман не пойдет на компромисс в отношении своего «Шесть Пунктов», и такой переход был бы нетерпим для народа Западного Пакистана. Это частное соглашение открывает Рахману путь к провозглашению независимости Бенгалии и завершению эксперимента с единым Пакистаном. Репатриация уже тихо происходит, чтобы сделать переход как можно более плавным."
 DemRahman1970.6.d: "В ошеломляющем объявлении шейх Муджибур Рахман провозгласил независимость Восточного Пакистана как Бангладеш. Он сделал это объявление перед ликующими толпами. Бенгальцы по всей новой стране начали поднимать самодельные флаги. В Западном Пакистане, теперь уже просто Пакистане, настроение унылое, но приглушенное. Многие ожидали этого объявления в течение нескольких недель, и сейчас многие считают, что это хорошее избавление. В бывшем Восточном Пакистане осталось не так много пакистанцев, и скоро они должны вернуться домой. Пакистанские военные ввели военное положение и передали власть Зульфикару Али Бхутто, главе крупнейшей политической партии страны. Он пообещал восстановить порядок и создать новую конституцию Пакистана"
 DemRahman1970.7.d: "Потеря Бангладеш - серьезный удар по пакистанским военным. Почти треть ее личного состава были бенгальцами, и подавляющее большинство перешло на сторону нового государства. Военным придется восстанавливать свои ряды, но, к счастью, в Пакистане есть не только достаточные резервы, но и сильные традиции военной службы среди многих общин. Несмотря на это, потребуется время, чтобы восстановить потенциал и наладить работу некоторых объектов. Новый главный администратор военного положения Зулифкар Али Бхутто обещал свою полную поддержку усилиям по восстановлению былой славы пакистанских вооруженных сил."
 DemRahman1970.8.d: "Когда президент Шейх Муджибур Рахман поддержал предложенный законопроект о принятии «Шесть Пунктов» для Восточного Пакистана, это вызвало резкую критику со стороны западнопакистанцев. Однако после первоначального напряжения обе стороны согласились внести поправки в предложенный законопроект таким образом, чтобы обе стороны сочли его выгодным. В конце концов, эти обсуждения принесли свои плоды, и вскоре правительство представит исправленный вариант законопроекта, который пройдет. Ни одна из сторон не удовлетворена соглашением, но, учитывая обстоятельства, это лучше, чем альтернатива."
 DemRahman1970.9.d: "Законопроект о «Шести Пунктах» с новыми поправками прошел Национальную Ассамблею без особых дебатов. Законопроект пересматривает политическую структуру Пакистана. Западный Пакистан станет Пакистаном и будет иметь отдельный федеральный парламент, чем планируемое создание автономного Восточного Пакистана. Восточный Пакистан будет иметь свой собственный парламент, силы обороны и политику развития. Оба крыла будут связаны общей внешней политикой и экономическими связями. У обоих крыльев будут свои руководители, а споры будут решаться путем диалога. Первоначальная реакция людей в обоих крыльях - разочарование, но признание того, что это решение было необходимо, чтобы остановить десятилетия политических проблем, мучивших страну с момента обретения независимости."
 DemRahman1970.10.d: "С момента объявления о создании Восточного Пакистана федеральным служащим и военным было предложено выбрать, к какой федеральной системе они хотят присоединиться. Либо Пакистан, либо Восточный Пакистан. С тех пор предпринимаются активные усилия по переезду пакистанцев из Восточного Пакистана в преддверии создания Восточного Пакистана. В то же время восточнопакистанцы переезжают на родину. Одна газета отметила, что рейс восточнопакистанских военных офицеров сошел с самолета в Дакке, и пакистанские офицеры сразу же сели на тот же самолет, чтобы вернуться обратно в Пакистан. К сожалению, репатриация приводит к некоторым проблемам, особенно в семьях, где один из супругов - из Пакистана, а другой - из Восточного Пакистана."
 DemRahman1970.11.d: "Зульфикар Али Бхутто, который возьмет на себя управление Пакистаном после создания Восточного Пакистана, завершил переговоры с шейхом Муджибуром Рахманом, который возглавит Восточный Пакистан. Два человека договорились о разделе национальных активов между двумя сторонами. Это включает в себя раздел денежных резервов, ресурсов и вооруженных сил. Оба человека были настроены позитивно после переговоров и выразили свое удовлетворение по поводу нового Пакистана, который должен был сформироваться. Соглашение было финансово щедрым для Восточного Пакистана, и многие интерпретируют это как жест со стороны Пакистана, что, несмотря на изменение статуса, они по-прежнему рассматривают Восточный Пакистан как часть объединенного Пакистана."
 DemRahman1970.12.d: "После нескольких месяцев переговоров и подготовки Восточный Пакистан наконец начал функционировать как автономная провинция Пакистана. Шейх Муджибур Рахман обратился к народу Восточного Пакистана, заявив, что его обещание восстановить достоинство и честь бенгальцев выполнено. Он заявил, что благодаря этому решению Пакистан стал сильнее и сплоченнее, и теперь оба крыла будут процветать вместе, а не за счет друг друга. Большие толпы собрались, чтобы посмотреть парад, включавший культурные шествия и военный парад солдат из недавно созданной армии Восточного Пакистана. В Пакистане реакция была более тихой. Новый лидер Пакистана Зульфикар Али Бхутто заявил, что сохранит государство в прежнем виде до следующих выборов. В этот момент многие в Пакистане признали, что этот результат был неизбежен, поэтому произошло спокойное принятие."
 DemRahman1970.13.d: "После вступления в силу последней конституции были предприняты гораздо более активные усилия по лучшему набору этнических групп пропорционально их представительству в Пакистане. Хотя многие старшие офицеры были пакистанцами, было большое количество молодых бенгальских офицеров и солдат. Подавляющее большинство из них записались в армию Восточного Пакистана. Мы также обязались передать восточнопакистанским военным свою долю нашего оборудования. Это создает большую головную боль для штаба, который внезапно обнаружил нехватку живой силы и средств, которые можно было бы задействовать. Однако провинции Пакистана исторически были основным источником военной рабочей силы на всем субконтиненте, и многие добровольцы могут быть с готовностью найдены. Что еще более важно, у Пакистана также есть достаточные резервы. С Пакистаном все будет в порядке, но перестройка вооруженных сил, чтобы задействовать эти источники, потребует времени и усилий."
 DemRahman1970.14.d: "В рамках инициативы президента шейха Муджибура Рахмана по преобразованию Пакистана в социалистическую экономику национальное собрание приняло закон о национализации основных отраслей промышленности. Этот законопроект предусматривает национализацию нефтяной и электрической промышленности. Правительство утверждало, что это жизненно важные отрасли, которые не должны отдавать граждан на милость капиталистического ценообразования или под контроль частных корпораций. После принятия законопроекта президент направил федеральные ресурсы на то, чтобы начать процесс передачи этих компаний под контроль правительства."
 Dem_Ayub65.1.d: "Народ Пакистана пришел на избирательные участки, чтобы выбрать новую Национальную ассамблею и президента Пакистана. Это первые выборы в соответствии с новой конституцией. У народа Пакистана есть два варианта. Они могут выбрать президента Айюб Хана, который создал новую конституцию и вел нацию к этим выборам. В настоящее время он контролирует альянс центристских и правых партий. Или они могут выбрать пламенного бенгальского политика Шейха Муджибура Рахмана, который возглавляет левую коалицию. Айюб Хан придерживается капиталистического плана развития и сильного центрального правительства. Муджибур Рахман хочет сократить эксплуатацию рабочих, принести социализм и расширить автономию провинций."
 Dem_Ayub65.2.d: "Пакистанское телевидение (ПТВ) начало свою первую передачу вчера вечером. Новое государственное телевидение планирует передавать новостные сообщения, культурные программы и развлечения для всех граждан. Президент Айюб Хан в пресс-релизе выразил надежду, что новое СМИ поможет объединить народ Пакистана и показать миру всю красоту, которая находится внутри страны. Хотя количество телевизоров в стране невелико, эксперты считают, что со временем это новое средство массовой информации получит широкое распространение."
 Dem_Ayub65.3.d: "Высокопоставленный член американского кабинета министров встретился с президентом Айюб Ханом. Он заявил, что Соединенные Штаты будут признательны за помощь в продолжающемся конфликте во Вьетнаме. Он заявил, что Соединенные Штаты хотели бы получить помощь в виде как минимум одной пехотной дивизии. В обмен Соединенные Штаты могут предоставить экономическую поддержку, оборудование для двух пехотных дивизий и половины бронетанковой дивизии. Народ Пакистана в целом сочувствует антиколониальной борьбе вьетнамцев и не воспримет наше участие положительно. Однако военные, несомненно, были бы очень признательны за дополнительное оборудование. Однако среди младших офицеров и солдат, вероятно, возникнет недовольство по поводу иностранной дислокации."
 Dem_Ayub65.4.d: "Президент Пакистана Айюб Хан сообщил нам, что не может предоставить пехотную дивизию для боевого дежурства во Вьетнаме. Вместо этого он предложил направить медицинское подразделение. Однако, поскольку у нас нет потребности в таких услугах, мы отклонили эту просьбу. Это отказ от наших усилий по интернационализации Вьетнама как глобального конфликта против коммунизма. Некоторые из наших союзников в Конгрессе обязательно укажут на то, что, несмотря на всю историю нашей помощи Пакистану, он, похоже, не желает возвращать нам должок и помогать нам. Пакистанцы в основном обеспокоены своими собственными конфликтами в регионе и риском внутренней реакции в случае отправки войск"
 Dem_Ayub65.5.d: "Президент Айюб Хан сообщил нам, что отправит пехотную дивизию во Вьетнам. Он заявил, что его высшие военные офицеры уже рассматривают вопрос о том, какое подразделение отправить, и заявил, что Пакистан гордится тем, что продолжает историческое наследие развертывания южноазиатских войск за рубежом для обеспечения глобальной безопасности. Его правительство скоро опубликует заявление для общественности, в котором объяснит, что решение было принято на основе существующих связей с Соединенными Штатами и желания помочь вьетнамскому народу против зла советского коммунизма. Вскоре мы отдадим приказ об отправке обещанного оружия и наличных денег пакистанскому правительству."
 Dem_Ayub65.6.d: "Несмотря на несколько крупных демонстраций студентов университетов, правительство Пакистана подтвердило, что пехотная дивизия отправляется во Вьетнам. Силы предназначены для оказания помощи в обеспечении безопасности Азии против жестокой, европейской коммунистической идеологии. Пакистанцы старательно избегают критики любого коммунизма, чтобы не разозлить Китай. С тех пор, как правительство объявило о своих намерениях, начались протесты со стороны левых и религиозных активистов. И те, и другие обвиняют правительство в поддержке западного империализма и продаже жизней пакистанцев за деньги. Пакистанские военные, похоже, поддерживают правительство, но в частном порядке кажется, что многие офицеры и солдаты прилагали все усилия, чтобы избежать отправки за границу. Несмотря на это, правительство Пакистана сохраняет приверженность и отказывается сообщить, что американское правительство предоставляет Пакистану в обмен на помощь."
 KASHMIR_60s.1.d: "Пакистанское правительство попросило нас провести переговоры по кашмирскому кризису. Скорее всего, они будут добиваться выполнения резолюций ООН. Однако мы, конечно, можем посмотреть, заинтересованы ли они в возможном достижении компромисса\". Некоторые высокопоставленные чиновники считают, что нынешняя ситуация в Кашмире неприемлема в качестве долгосрочного решения, и то, что происходит в этом штате, может негативно повлиять на весь Индийский Союз. Они также опасаются, что сохраняющаяся напряженность мешает экономике и международной репутации Индии. Они считают, что мы должны провести переговоры. Другие члены кабинета утверждают, что Кашмир является неотъемлемой частью Индии, это вообще не вопрос Пакистана или международного сообщества. На самом деле, Пакистан сам является оккупантом, и они ведут себя так только для того, чтобы предотвратить свое неизбежное поражение. Мы должны решить, проводить переговоры или нет."
 KASHMIR_60s.2.d: "Премьер-министр и его делегация высокопоставленных дипломатических и военных советников провели несколько дней переговоров с пакистанской делегацией на горной станции Мурри. Как и ожидалось, пакистанцы сосредоточились на выполнении резолюций ООН и организации плебисцита, на котором жители Джамму и Кашмира решат присоединиться к Индии или Пакистану. Обе стороны согласились, что независимость не является жизнеспособным вариантом для Кашмира. Поскольку второй раунд переговоров вот-вот начнется, мы должны определиться с подходом. Один из вариантов - призвать к тому, чтобы нынешняя граница стала постоянной, при этом обе стороны признают суверенитет друг друга. Другим вариантом может стать предложение о разделе по стратегическим и общинным линиям. Пакистан получит Кашмирскую долину, а мы сохраним за собой Джамму и Ладакх. Наконец, мы можем предложить провести плебисцит и оставить его на усмотрение народа Кашмира. Или мы можем просто объявить переговоры неудачными и прекратить их."
 KASHMIR_60s.3.d: "Мы ведем обстоятельные переговоры с индийским руководством. После долгих споров и обсуждений они изложили нам свою позицию по Кашмиру. Они предлагают сделать нынешнюю линию прекращения огня в Кашмире постоянной границей. Тогда Пакистан и Индия откажутся от претензий на весь Кашмир. Нормализация границы стала бы основой для возобновления отношений между Индией и Пакистаном. После индийской презентации пакистанское руководство собралось в частном порядке, чтобы обсудить ответные меры. В ходе жарких дебатов сформировались две точки зрения. Одна группа рассматривала предложение как разумное завершение спора и способ нормализации индо-пакистанских отношений. Другая группа рассматривает его как унизительное предательство народа Кашмира и Пакистана. Они утверждают, что переговоры должны быть прекращены, а Индия должна предстать перед ООН."
 KASHMIR_60s.4.d: "Правительство Пакистана объявило об окончании Кашмирского конфликта после переговоров на высшем уровне в Мурри. Пакистан и Индия согласились сделать линию прекращения огня в Кашмире постоянной границей. Правительство заявило, что нормализация границы приведет к долгосрочному миру, процветанию и воссоединению кашмирского народа через мирную границу. Однако это оптимистичное заявление было встречено резкой критикой со стороны газет на языке урду и вялой реакцией со стороны английских газет. Многие статьи критиковали правительство за предательство Кашмира в пользу Индии и отказ от видения Пакистана. По всей стране тысячи людей вышли на улицы в знак протеста против решения правительства. Некоторые религиозные лидеры были задержаны местной полицией за призывы к революции. Ходили слухи о волнениях среди офицеров в армии, которые считали, что правительство уступило требованиям Индии."
 KASHMIR_60s.5.d: "Индийское правительство объявило об окончании Кашмирского конфликта после переговоров на высшем уровне в Мурри. Индия и Пакистан договорились сделать линию прекращения огня в Кашмире постоянной границей. В своем заявлении правительство отметило, что враждебность и угроза вооруженного насилия скоро рассеются, и народ Индии может рассчитывать на мир и процветание. Текущий статус Кашмира в индийской конституции вскоре будет скорректирован, чтобы Кашмир стал полноценным штатом в составе Индийского Союза. Хотя пресса в основном поддерживала правительство, рассматривая соглашение как его победу, есть и более радикальные издания, которые утверждали, что весь Кашмир должен быть частью Индии, а правительство отдало земли, украденные Пакистаном в 1949 году при первоначальном соглашении о прекращении огня. Несмотря на эту критику, соглашение остается популярным внутри страны, а на международном уровне Индия рассматривается как победитель."
 KASHMIR_60s.6.d: "Мы ведем обстоятельные переговоры с индийским руководством. После долгих споров и обсуждений они изложили нам свою позицию по Кашмиру. Они предложили разделить Кашмир по общинному и стратегическому принципу. Согласно этому предложению, обе стороны откажутся от претензий друг к другу в Кашмире, Пакистан получит Кашмирскую долину, включая Сринагар. В обмен на это Индия сохранила бы контроль над Джамму и настаивала на том, что по стратегическим причинам она должна контролировать и Ладакх. Затем пакистанское руководство встретилось с глазу на глаз, чтобы обсудить это предложение, и возникли две потенциальные реакции. Одна группа считает предложение очень выгодным, Пакистан достигнет своей цели - освободит Кашмирскую долину. В Джамму было индуистское большинство, и Ладакх был приемлемой ценой. Другая группа, однако, утверждает, что предложение показывает, что Индия боится вмешательства ООН для принуждения к плебисциту, и Пакистану следует прекратить переговоры и попытать счастья в ООН за весь Кашмир."
 KASHMIR_60s.7.d: "Пехотный батальон Азад Кашмир из Пакистана вошел в Сринагар, чтобы передать контроль над городом от индийского правительства Пакистану. В ходе торжественной церемонии обе стороны провели совместную церемонию спуска и подъема флага. Последние индийские войска и чиновники покинули город с полными почестями в соответствии с недавно согласованным индо-пакистанским планом раздела, который был подписан на конференции в Мурри по Кашмиру. Когда пакистанские войска и чиновники двинулись в Кашмирскую долину, многие кашмирцы последовали за ними, надеясь воссоединиться с семьями, разлученными во время первой Кашмирской войны. Хотя некоторые религиозные лидеры и националисты осудили соглашение за то, что оно не обеспечило безопасность всего Кашмира, многие пакистанцы приветствовали этот шаг и рассматривали его как благоприятный компромисс, который выполнил обещание, данное Пакистаном мусульманам Кашмирской долины. Сообщения о панике и коммунальных столкновениях вдоль новой границы с Джамму не омрачили новость для пакистанцев."
 KASHMIR_60s.8.d: "После конференции в Мурри по Кашмиру многие индийцы, особенно крайне правые и крайне левые, были недовольны индо-пакистанским планом раздела. Правые выступали против него как против передачи Пакистану суверенных индийских земель. Левые осуждали соглашение о разделе по преимущественно общинным линиям как противоречащее духу индийского секуляризма. Несмотря на это, индийское правительство и военные в основном преуспели в передаче Кашмирской долины с честью. Случаи общинного насилия вдоль новой границы в Джамму были сведены к минимуму благодаря действиям индийских войск в этом районе. Многие индуистские кашмирские беженцы времен Первой кашмирской войны начали протестовать и назвали соглашение предательством и узакониванием пакистанского насилия. Несмотря на это, многие теперь надеются, что Пакистан и Индия смогут превратить свои отношения из враждебных в дружеские."
 KASHMIR_60s.9.d: "Мы ведем обстоятельные переговоры с индийским руководством. После долгих препирательств и обсуждений они изложили нам свою позицию по Кашмиру. К большому шоку пакистанских лидеров, индийское правительство предложило выполнить резолюции ООН и позволить организации провести плебисцит по окончательному статусу Кашмира. Пакистанское руководство собралось, чтобы обсудить невероятный поворот событий. Поскольку индийцы предлагали то, что Пакистан требовал с самого начала, обсуждать было нечего. Пакистанцы вернулись и согласились с предложением индийцев. Обе страны направили своих лучших дипломатов в ООН, чтобы подготовить почву для выполнения резолюций."
 KASHMIR_60s.10.d: "Пакистан принял Индию для переговоров на высоком уровне на горной станции в Мурри в рамках Мурринской конференции по Кашмиру. Переговоры, к сожалению, закончились неудачей. Ни одна из сторон не проявила желания или готовности пойти на компромисс в отношении своей позиции. Когда индийская делегация вернулась домой, ее члены заявили, что Пакистан питает нереалистичные ожидания и демонстрирует голое стремление к индийской территории. Пакистанское правительство опубликовало заявление, в котором обвинило Индию в отсутствии гибкости и желании увековечить незаконную оккупацию. Министерство иностранных дел Пакистана объявило о намерении представить в ООН резолюцию, призывающую к санкциям до тех пор, пока Индия не согласится выполнить резолюции ООН по Кашмиру."
 UN_KASHMIR.1.d: "Правительство Пакистана направило своих ведущих дипломатов в Организацию Объединенных Наций, чтобы представить резолюцию, требующую от Индии выполнения резолюции ООН 47 или экономических санкций со стороны международного сообщества. Пакистанская делегация отметила, что Индия в основном отказывается обсуждать Кашмир или предлагать какие-либо реалистичные пути к справедливому решению. В связи с этим Пакистан обратился к Организации Объединенных Наций за справедливостью и решением проблемы. Ожидается, что резолюция поступит в Совет Безопасности, и Пакистан надеется, что Соединенные Штаты и Советский Союз не наложат на нее вето. Индийские дипломаты уже ведут переговоры с обеими странами, подчеркивая свою позицию и противодействие тому, что они называют международным шантажом."
 UN_KASHMIR.2.d: "Недавняя пакистанская резолюция, призывающая Индию выполнить резолюцию ООН 47, которая призывает к плебисциту в Кашмире, иначе ей грозят санкции, в настоящее время рассматривается дипломатами Совета Безопасности. Индийское правительство уже выразило желание, чтобы мы наложили вето на эту резолюцию, заявив, что в случае ее принятия экономические санкции ударят в основном по индийским торговым партнерам. Некоторые дипломаты согласны с этим и заявляют, что, несмотря на нашу дружбу с Пакистаном, жертвовать возможностями Индии было бы глупо. Другие советники указывают на нейтралитет Индии и слухи о заигрываниях с Советским Союзом. Они считают, что мы не должны использовать право вето, сохраняя наши связи с Пакистаном и демонстрируя нашу приверженность системе ООН, на создание которой мы потратили столько времени и энергии."
 UN_KASHMIR.3.d: "Недавняя пакистанская резолюция, призывающая Индию выполнить резолюцию ООН 47, которая призывает к плебисциту в Кашмире, или в противном случае подвергнуться санкциям, в настоящее время рассматривается дипломатами Совета Безопасности. Индийское правительство уже выразило желание, чтобы мы наложили вето на эту резолюцию, заявив, что в случае ее принятия экономические санкции ударят в основном по индийским торговым партнерам. В отличие от Пакистана, Индия в свое время доказала, что открыто относится к нашему государству и идеологии. Наложение вето может улучшить отношения и помочь Индии приблизиться к нашей орбите. Другие советники, однако, отмечают, что принятие резолюции может помочь нашим отношениям с Пакистаном и дать нам больше дипломатического влияния в Индии. Не накладывая вето, мы окажем давление на Индию, чтобы заставить ее более решительно поддержать Советский Союз и избежать нейтралитета или прозападной ориентации."
 UN_KASHMIR.4.d: "Американская делегация в Совете Безопасности объявила, что США наложат вето на пакистанскую резолюцию по Кашмиру. После этого американские дипломаты поспешили сказать, как сильно они сочувствуют народу Кашмира и понимают разочарование Пакистана. Однако они заявили, что ООН - это место международного мира, и Америка принципиально не может одобрить такую резолюцию, которая угрожает государству-члену санкциями в случае невыполнения. Пакистанская делегация выглядела откровенно разочарованной, и эта новость уже вызвала ряд антиамериканских редакционных статей и протестов."
 UN_KASHMIR.5.d: "Во время недавнего заседания Совета Безопасности советская делегация заявила, что наложит вето на недавнюю резолюцию Пакистана по Кашмиру. Это стало серьезным ударом по недавним дипломатическим усилиям Пакистана по достижению урегулирования спора по Кашмиру. После встречи советские дипломаты заявили, что считают резолюцию односторонней. В Пакистане говорят, что правительство в ярости из-за неудачи, а оппозиционные политики обвиняют правительство в неудачной попытке. В крупных городах вспыхнули антисоветские протесты. Индийское правительство выразило признательность и благодарность Советам за то, что они остановили, по их мнению, предвзятую резолюцию."
 UN_KASHMIR.6.d: "После некоторых корректировок формулировок резолюция, призывающая Индию к выполнению резолюции 47, прошла. Эта новая резолюция, за которую выступают Пакистан и его сторонники, призывает нас выполнить три этапа, описанные в резолюции 47, чтобы завершить плебисцит на территории бывшего княжеского штата Джамму и Кашмир. Если мы не подчинимся и не согласимся провести плебисцит, Организация Объединенных Наций наложит на нашу страну экономические санкции. Однако новая формулировка делает степень санкций расплывчатой. Мнения кабинета министров разделились: одни выступают за то, чтобы выполнить резолюцию 47 и надеяться, что Кашмир сделает правильный выбор. Другие утверждают, что резолюция является вопиющим нарушением нашего суверенитета и воли кашмирского народа. Они говорят, что мы должны отказаться и принять санкции. Индия - слишком большая экономика, чтобы подвергаться санкциям в течение длительного периода времени."
 UN_KASHMIR.7.d: "В вызывающем заявлении индийского правительства недавняя резолюция Совета Безопасности ООН названа незаконной и вопиющим нарушением суверенитета Индии. Индийское правительство далее добавило, что страна добилась свободы от колониальной эксплуатации не только для того, чтобы международное сообщество злоупотребляло ею. Правительство Пакистана быстро осудило ответ Индии и призвало международное сообщество ввести санкции. Соединенные Штаты и Советский Союз выразили озабоченность ситуацией, но не уточнили планы относительно того, как или если они введут санкции в ответ."
 UN_KASHMIR.8.d: "Наше решение отвергнуть недавнюю резолюцию ООН побудило многие страны ввести некоторые формы экономических санкций против нашей страны. Однако резолюция была принята только после того, как формулировка о степени санкций была сделана расплывчатой. Это означает, что, хотя наша экономика сильно пострадает, санкции не должны быть такими разрушительными, как надеялись пакистанцы\". Организация Объединенных Наций также заявила, что санкции будут немедленно сняты, если мы согласимся провести плебисцит, как указано в резолюции ООН 47. Многие иностранные и экономические консультанты предсказывают, что эти санкции, скорее всего, не будут постоянными, и при наличии терпения мы даже сможем увидеть их полную отмену."
 UN_KASHMIR.9.d: "Как и предсказывали многие наши эксперты, санкции, наложенные на нас Организацией Объединенных Наций, ослабляются многими странами. Похоже, что многие страны обеспокоены тем, что теряют возможности выхода на наши рынки или получения ценных контрактов от нашего правительства. Санкции все еще существуют, и они оказывают влияние, но их действие ослабевает. По прогнозам экспертов, в долгосрочной перспективе можно ожидать полного прекращения санкций. Возможность проведения плебисцита в Кашмире все еще доступна, и если она будет реализована, это положит конец всем санкциям."
 UN_KASHMIR.10.d: "Индийское правительство объявило, что будет выполнять резолюцию ООН 47 и вместе с Пакистаном готовить почву для проведения голосования в Кашмире. Индийское правительство настаивает, что это было сделано не по принуждению, а после того, как его собственные чиновники пришли к выводу, что такие выборы могут быть проведены. Индийское правительство добавило, что выполнит трехэтапный план только до тех пор, пока Пакистан не попытается нарушить или вмешаться в избирательный процесс. Силы ООН быстро собираются, чтобы обеспечить безопасность линии прекращения огня в Кашмире и заложить основу для плебисцита и поддержания мира в регионе. Генеральный секретарь ООН в своем заявлении приветствовал эту новость, но заявил, что для успешного выполнения резолюции 47 потребуется время, терпение и сотрудничество."
 UN_KASHMIR.11.d: "Крупные силы ООН прибыли на линию прекращения огня, разделяющую индийские и пакистанские районы Кашмира. Они присоединились к уже существующей наблюдательной группе ООН, которая предоставляет ценные знания о регионе. Ожидается, что силы ООН проведут отдельные брифинги с пакистанским и индийским военным командованием. Силы ООН должны сначала добиться вывода пакистанских войск, а затем - индийских. Как только это будет достигнуто, будет проведен плебисцит. В ходе этого голосования народ Кашмира окончательно решит свою дальнейшую судьбу."
 UN_KASHMIR.12.d: "Пакистанские военные в Кашмире начали выводить свои силы за пределы исторических границ княжеского государства Джамму и Кашмир. Индийское правительство первоначально пыталось разместить в этом районе свою собственную местную полицию для поддержания правопорядка вместе с силами ООН, однако военное командование ООН заявило, что пакистанская обученная полиция в этом районе способна поддерживать правопорядок. Оно отметило, что резолюция 80 приравнивает силы Азад Кашмира к силам штата Джамму и Кашмир. Пакистанские офицеры и солдаты выглядели невероятно нервными, когда грузили свое снаряжение и начинали отходить от линии фронта. Существуют опасения, что Индия может воспользоваться этой возможностью, чтобы отказаться от соглашения и захватить Кашмир, однако многие аналитики считают, что в этом случае Индия рискует нанести ущерб международным миротворцам."
 UN_KASHMIR.13.d: "Поскольку наши войска начинают упорядоченный вывод из Кашмира в соответствии с директивами ООН о проведении плебисцита, некоторые командиры выражают беспокойство по поводу возможных индийских ловушек. В резолюции ООН говорится, что военные силы Пакистана и Индии должны вывести войска, но у нас есть местные военизированные формирования, которые не являются регулярными войсками пакистанской армии. В частности, скауты Гилгита были ополченцами, набранными из местных жителей. Мы можем легко настоять на том, чтобы эти силы остались в Кашмире в качестве подразделения по поддержанию правопорядка. Командующего ООН можно легко убедить. Мы оставим несколько наших лучших офицеров и солдат со скаутами Гилгита, а также дополнительное оборудование на случай, если возникнут проблемы с голосованием."
 UN_KASHMIR.14.d: "Индийская армия и ВВС начали вывод собственных сил из Кашмира. Согласно резолюции, они начали этот процесс только тогда, когда стало ясно, что Пакистан завершает вывод своих сил. Силы ООН были впечатлены дисциплиной и профессионализмом, проявленными индийскими войсками, когда они покидали линию фронта. Один индийский офицер, говоря не для протокола, выразил оптимизм по поводу того, что индийские войска скоро вернутся, как только кашмирский народ подтвердит свое желание присоединиться к Индии. Как только вывод индийских войск будет подтвержден, Организация Объединенных Наций должна назначить наблюдателя за плебисцитом, чтобы обеспечить проведение выборов без каких-либо проблем"
 UN_KASHMIR.15.d: "В резолюции ООН ясно сказано, что мы должны вывести наши регулярные вооруженные силы, однако мы должны оставить местную полицию для обеспечения правопорядка. Джамму и Кашмирские стрелки были частью сил княжеского государства Кашмир, и мы можем легко убедить командование ООН разрешить нам оставить несколько батальонов для обеспечения безопасности. С этими войсками мы можем оставить дополнительное оборудование и некоторых наших лучших офицеров и солдат. Эти силы будут резервными, чтобы предотвратить пакистанскую сутяжничество или любые проблемы, которые могут возникнуть после плебисцита."
 UN_KASHMIR.16.d: "Специально назначенный Администратор плебисцита ООН, генерал виконт Слим, прибыл в Сринагар для наблюдения за плебисцитом в Кашмире. Бывший командующий Британско-индийской армии пользуется большим уважением среди офицеров как в Индии, так и в Пакистане. В своем первом заявлении генерал Слим выразил надежду, что свободные и честные выборы приведут к будущему миру и процветанию между Индией и Пакистаном. Он добавил, что свободные и справедливые выборы будут проведены как можно скорее. Первоначальный администратор плебисцита, адмирал Честер Нимиц, больше не был доступен для этой роли."
 UN_KASHMIR.17.d: "По всему Кашмиру люди пришли в огромном количестве, чтобы проголосовать. Хотя некоторые выразили разочарование тем, что независимость не была вариантом голосования, многие были просто благодарны за то, что у них был такой вариант. Для многих кашмирцев это жизненно важное голосование. Многих привлекает идея присоединиться к Пакистану и иметь мусульманскую родину. Для других, особенно среди индусов и сикхов, составляющих меньшинство, Индия представляет собой светскую мечту о равенстве и процветании. Народы как Пакистана, так и Индии с нетерпением ждут результатов этого голосования и того, что оно означает для будущего Южной Азии."
 UN_KASHMIR.18.d: "Администратор плебисцита ООН объявил, что народ Кашмира проголосовал за присоединение к Пакистану. Газеты по всему Пакистану быстро выпустили новые номера, провозглашающие исторический результат. Спонтанные сцены празднования происходили во всех крупных городах и поселках. Правительство Пакистана быстро опубликовало заявление, в котором выразило удовлетворение тем, что народ Кашмира смог наконец осуществить свое право на самоопределение. Правительство также отметило, что меньшинства в Кашмире не должны бояться и что Пакистан будет защищать всех своих граждан. Индийское правительство пока не выступило с заявлением по этому вопросу"
 UN_KASHMIR.19.d: "ООН объявила результаты голосования. Это шокирующий результат, и среди наших официальных лиц есть опасения, что Пакистан манипулировал результатами в свою пользу. Еще большее беспокойство вызывают сообщения о том, что меньшинства по всему Кашмиру бегут или готовятся уехать до прихода пакистанцев. Очевидно, что пакистанцам нельзя доверять защиту этих людей от общинного насилия, и действительно, есть некоторые сообщения о том, что мусульмане Кашмира нападают на соседей-немусульман. К счастью, индийская армия сообщила нам, что стрелковые подразделения Джамму и Кашмира, все еще находящиеся в Кашмире, могут быстро обеспечить безопасность Джамму и защитить меньшинства от дальнейшего насилия. Такой поступок, несомненно, вызовет гнев Пакистана."
 UN_KASHMIR.20.d: "Администратор плебисцита ООН объявил, что народ Кашмира проголосовал за присоединение к Индии. Газеты и радиостанции поспешили сообщить об этой радостной новости. В городах по всей Индии появились стихийные толпы, чтобы отпраздновать результат. Индийское правительство опубликовало заявление, в котором назвало результаты голосования триумфом индийской демократии и светскости. Оно добавило, что все кашмирцы будут пользоваться той же степенью свободы, что и все остальные граждане. Правительство Пакистана хранит молчание, но сообщения о гневных протестах и насилии в пакистанских городах подтверждаются международными наблюдателями. Есть некоторые сообщения из районов, ранее контролируемых Пакистаном, что результаты голосования были сфальсифицированы, что привело к сообщениям об агитации. Независимо от этого, результат рассматривается как крупный успех Индии."
 UN_KASHMIR.21.d: "Из результатов, объявленных ООН, ясно, что Индия провела масштабные манипуляции, чтобы получить желаемый результат. Уже сейчас наши кашмирские братья отчаянно пытаются бежать на пакистанскую территорию в надежде избежать возобновления антимусульманского индийского гнета. К счастью, пакистанская армия оставила скаутов Гилгита на такой случай. Если мы отдадим приказ, наши войска смогут обеспечить безопасность Гилгит-Балтистана, защитив пакистанскую границу и предоставив безопасное убежище беженцам, жаждущим свободы. Народ Пакистана страдает от результатов и требует действий."
 PAK_Afghan_War.1.d: "Советский Союз недавно вмешался в дела Афганистана, чтобы поддержать своего коммунистического союзника. Они используют вооруженную силу для жестокого принуждения афганцев к принятию чуждой идеологии и атеизма. Однако Афганистан долгое время был оплотом ислама и гордой нацией. Многие из его жителей сейчас бегут в Пакистан, и мы, как мусульмане, несем моральную ответственность за то, чтобы пропустить их. Однако этот приток беженцев приведет к истощению наших ресурсов, но нам придется пережить эту бурю."
 Zia_Era.1.d: "В Карачи проходят интенсивные студенческие протесты. Студенты университетов по всему городу постоянно протестуют против ограничений военного положения и призывают к восстановлению демократии. Более опасными являются те студенты, которые утверждают, что Зульфикар Бхутто был мучеником, а те, кто причастен к его смерти, должны быть арестованы. Местные рейнджеры и полиция представили списки видных студенческих лидеров в городе. Они хотели бы получить одобрение правительства военного положения и местных войск, чтобы арестовать этих лидеров и, как они надеются, сорвать протесты. Однако такие действия могут привести к эскалации беспорядков. Некоторые политические советники утверждают, что потенциальные риски слишком высоки, и мы должны просто терпеть эти протесты, пока они естественным образом не утихнут."
 Zia_Era.2.d: "Совместные операции рейнджеров и полиции по задержанию лидеров студенческих протестов не привели к подавлению студенческих восстаний. Вместо этого на улицы вышло еще больше студентов, многие из которых возмущены видом вооруженных войск, штурмующих здания кампусов. Администраторы университета отмечают, что они не в состоянии контролировать протестующих, поскольку у студентов больше нет авторитетного руководства. Надежды на то, что аресты остановят некоторые волнения, охватившие провинцию, явно не оправдались. Задержанные студенты чувствуют свое преимущество и отказываются сотрудничать в попытках деэскалации ситуации. Нам придется подождать."
 Zia_Era.3.d: "Совместные операции рейнджеров и полиции по задержанию лидеров студенческих протестов в значительной степени привели к снижению протестов. Похоже, многие студенты были напуганы внезапными арестами и готовы сосредоточиться на учебе, а не на протестах. После допросов некоторые из студенческих лидеров были освобождены с обещанием, что они не только воздержатся от организации беспорядков, но и будут активно помогать администрации университета в обуздании некоторых наиболее строптивых студенческих групп. Штаб военного положения в Карачи похвалил офицеров, солдат и полицейских, участвовавших в этих операциях."
 Zia_Era.4.d: "Пакистанская военная власть в Синде контролируется V корпусом, базирующимся в Карачи. Генерал Зия уль-Хак назначил генерал-лейтенанта С.М. Аббаси командующим V корпусом и военным губернатором Синда. От высокоодаренного артиллерийского офицера ожидают, что он не будет играть в политические фавориты и предотвратит коррупцию в экономической столице страны. Поддержание порядка будет непростой задачей, поскольку Карачи является оплотом ПНП, а Зульфикар Бхутто - уроженец Синда. Борьба с городскими волнениями из-за военного правления, а также с приверженцами ПНП и синдхскими националистами - вот лишь некоторые из проблем, стоящих перед генералом Аббаси."
 Zia_Era.5.d: "Администрация военного положения Синда продолжает сталкиваться с серьезным сопротивлением со стороны опорных пунктов ПНП, расположенных по всему Синду, но особенно в Карачи и Ларкане. Из этих мест ПНП организует протесты, забастовки и нападения на проправительственные символы или предприятия. Некоторые старшие офицеры разработали план масштабных репрессий, чтобы окончательно ликвидировать эти опорные пункты ПНП. Это будет хлопотно в течение нескольких месяцев, но, возможно, это позволит покончить с этой назойливой проблемой. Некоторые из гражданских советников, однако, отмечают, что у них есть контакты в ПНП и они готовы вести переговоры о прекращении огня с ПНП. Если мы согласимся не начинать операции или провокации, они, вероятно, согласятся прекратить свои подрывные операции и вместо этого сосредоточиться на политической пропаганде."
 Zia_Era.6.d: "Наши усилия по подавлению оплотов ПНП в основном не увенчались успехом. Многие лидеры ПНП остаются на свободе, так как попытки задержать их часто заканчиваются неудачей. Жители обычно распространяют информацию о передвижениях полиции или военных, что дает им достаточно времени, чтобы скрыться или уйти в подполье. Эти операции не только не дали результатов, но многие активисты ПНП перешли на сторону боевиков и присягнули на верность террористической организации Аль Зульфикар, возглавляемой сыновьями Зульфикара Бхутто. Они уже совершают нападения в Карачи, и ожидается, что эта группа создаст еще больше проблем по всему Синду. Хотя не ожидается, что эта группа свергнет режим, ее действия будут препятствовать экономическому развитию в Синде."
 Zia_Era.7.d: "Генерал Зия уль-Хак назначил генерал-лейтенанта Гулама Джилани Хана губернатором Пенджаба и администратором провинции на военном положении. Пенджаб, крупнейшая провинция Пакистана и база его военного набора и инфраструктуры, должен быть твердо под контролем режима. Генерал Джилани - пехотный офицер, служивший во Второй мировой войне, а после обретения независимости перешел на службу в пакистанскую армию. Он также служил начальником разведки на протяжении большей части семидесятых годов, что делает его опытным в местной политике и создании альянсов. Генерал Зия ожидает, что его новый губернатор будет не только поддерживать мир, но и поможет Зия установить отношения с пенджабскими интересами, которые могут расширить его базу поддержки."
 Zia_Era.8.d: "Харизматичный кавалерийский офицер, генерал-лейтенант Фазл Хак, принял назначение на пост губернатора и администратора военного положения Северо-Западной пограничной провинции. Генерал Зия безоговорочно доверяет генералу Фазлу, поскольку оба они - офицеры бронетанковых войск, и Зия считает, что то, что СЗПП будет управлять сын родного человека, поможет снизить напряженность. СЗПП представляет жизненно важный интерес для Пакистана, Афганистан часто пытается разжечь волнения в племенах, а патанские националисты в провинции давно выступают за независимость, большую автономию или объединение с Афганистаном. Ожидается, что генерал Фазл справится с этими внешними и внутренними вызовами, одновременно укрепляя патриотически настроенных граждан провинции. Ожидается, что генерал уйдет в отставку из армии, чтобы посвятить свои усилия управлению провинцией и чтобы его не воспринимали как военного силовика."
 Zia_Era.9.d: "Растущее число афганских беженцев создает огромную нагрузку на местные ресурсы и усиливает напряженность. Пока многие беженцы могут оставаться с семьей по нашу сторону границы, однако, по нашим оценкам, число беженцев будет продолжать расти. Многие высокопоставленные военные и гражданские руководители считают, что Пакистан несет моральную ответственность за оказание помощи мусульманам, испытывающим трудности, и считают, что мы должны немедленно предпринять усилия по предоставлению средств, материалов и территории для лагерей беженцев. Другие советники считают, что затраты слишком высоки, и утверждают, что мы должны позволить ситуации продолжаться, так как, похоже, местное население до сих пор было в состоянии принять афганцев."
 Zia_Era.10.d: "ООН, при поддержке западных государств и наших друзей в регионе, согласилась создать агентство по делам беженцев, которое будет заниматься афганскими беженцами. ООН скоро начнет переправлять средства и материалы для беженцев, что значительно снизит нагрузку на нас. В докладах ООН подчеркивается, что мы приложили значительные усилия, и наш международный имидж находится на высоком уровне. Афганские беженцы также выражают свою признательность как представителям ООН, так и иностранным СМИ, освещающим эту историю. Это большое облегчение для нашего правительства."
 Zia_Era.11.d: "Были созданы временные лагеря беженцев, поскольку число беженцев, хлынувших в СЗПП, намного больше, чем может выдержать местное население. В некоторых наших районах афганские беженцы строят временные дома и вырубают все местные деревья на дрова. Экологические и экономические издержки для местных сообществ растут. Опасаясь, что отчаявшиеся беженцы могут обратиться к насилию или наши собственные люди могут обратиться против беженцев, федеральное правительство решило вмешаться. Они приказывают нам предоставить обширные ресурсы и разместить беженцев, независимо от затрат. Похоже, что наши первоначальные усилия, направленные на то, чтобы позволить кризису беженцев разрешиться самостоятельно, провалились."
 Zia_Era.12.d: "Генерал Зия уль-Хак поставил своего ближайшего союзника в армии, генерал-лейтенанта Рахимуддина Хана, на пост губернатора и администратора военного положения Белуджистана. Опытный администратор, генерал Рахимуддин, как ожидается, возьмет на себя практическую роль в борьбе с внутренними разногласиями и управлении развитием исторически неспокойной провинции. Если его предшественники в основном участвовали в военных операциях против белуджских сепаратистов, то новый губернатор, как ожидается, попытается мирно завершить эти операции и предложить новую программу развития для народа Белуджистана."
 Zia_Era.13.d: "Администрация военного положения Белуджистана объявила о планах предложить общую амнистию всем оставшимся белуджским сепаратистским боевикам. Кроме того, пакистанские военнослужащие должны немедленно вернуться в свои гарнизоны мирного времени, а численность войск в провинции будет сокращена. Эти усилия уже приносят свои плоды, поскольку многие белуджские повстанцы уже приняли амнистию. После ухода войск старейшины мятежных племен с трудом объясняют, почему боевые действия должны продолжаться. Особенно после того, как правительство объявило о планах новых проектов развития, призванных поднять население провинции. Похоже, новое военное правительство усвоило кровавые уроки 1970-х годов."
 Delhi_Ageement.1.d: "После заключения соглашения в Симле министры иностранных дел Пакистана, Индии и Бангладеш встретились в Дели. Три стороны подписали соглашение под названием «Делийское соглашение». По этому соглашению Организация Объединенных Наций будет контролировать репатриацию тысяч бенгальских военнослужащих, правительственных чиновников и членов их семей, которые в настоящее время находятся в Пакистане. Тысячи пакистанских военнопленных, правительственных чиновников и членов их семей, содержащихся в Индии и Бангладеш, также будут обменены. Бангладешцы противились соглашению, поскольку в него вошли около двухсот пакистанских офицеров, которых они обвиняют в военных преступлениях. Однако индийское правительство настаивало на их согласии. Народ Пакистана с нетерпением ждет возвращения своих солдат."
 PAK_Kashmir_70s.1.d: "Старшие офицеры в штабе обсуждают, следует ли нам начать призыв резервистов в ожидании эскалации ситуации в Кашмире или нет. Это даст нам большую тактическую гибкость и позволит нашим фронтовым возможностям получить немедленный доступ к подкреплению. Однако такой шаг, даже если он будет скрыт под видом рутинных учений, скорее всего, будет замечен индийцами, и они могут решить призвать свои собственные резервы. Если индейцы не заметят, элемент неожиданности будет полностью под нашим контролем. Командирам корпусов придется принять какое-то решение по этому вопросу."
 PAK_Kashmir_70s.2.d: "По данным разведки, пакистанцы призывают некоторое количество резервистов. Это не является беспрецедентным, это следует предыдущим тенденциям, когда мы наблюдали подобные мобилизационные приказы перед крупномасштабными военными учениями. Многие высокопоставленные руководители оборонного ведомства считают, что наши силы могут бдительно следить за передвижениями пакистанцев, а призыв собственных резервистов не нужен и ложится бременем на экономику. Армейские командиры согласны с тем, что они готовы, но считают, что мобилизация обеспечит большую тактическую гибкость. Окончательное решение должен принять премьер-министр."
 PAK_Kashmir_70s.3.d: "Высшее руководство правительства и армии Пакистана встретилось для секретных переговоров в Главном штабе армии в Равалпинди. Командир корпуса в Кашмире заявил, что военные готовы, мотивированы и стремятся провести ограниченную кампанию против индийских сил. Успешный, быстрый удар может вытеснить оккупационную индийскую власть, после чего мы потребуем выполнения резолюций ООН. Простой захват территории или претензии на нее только спровоцируют тотальную индийскую атаку\". Некоторые руководители правительства и командующий ВВС усомнились в том, что цели могут быть достигнуты так быстро и реально ли ожидать, что Индия не пойдет на эскалацию конфликта. Обе стороны начали спорить о том, что делать, пока не было принято решение..."
 PAK_Kashmir_70s.4.d: "Индийское правительство и наблюдатели ООН сообщают, что пакистанские войска пересекли границу через Кашмир и наступают на индийские позиции. Правительство Пакистана заявило, что его действия были предприняты в ответ на крупное нарушение индийцами режима прекращения огня. Пакистан настаивает, что этот раунд боевых действий закончится только тогда, когда Индия согласится выполнить резолюции ООН по Кашмиру, и что Пакистан лишь дал достойный ответ на индийскую агрессию. Премьер-министр Индии проводит совещание с высшими военными и оборонными руководителями. И Соединенные Штаты, и Советский Союз опубликовали заявления, призывающие к немедленному прекращению военных действий."
 PAK_Kashmir_70s.5.d: "Премьер-министр председательствует на совещании с высшими военными и оборонными руководителями в министерстве обороны. Он получил первые сообщения о пакистанских атаках в Кашмире. Руководство армии считает, что пакистанские операции локализованы, и они надеются, что боевые действия ограничатся Кашмиром. Министр обороны спросил о возможности перерастания конфликта в общую войну. Индийское военное руководство заявило, что всеобщая война, вероятно, повлечет за собой быструю международную реакцию и, скорее всего, возвращение к довоенным границам, если не будет достигнут быстрый прорыв. Они пришли к выводу, что если премьер-министр считает армию способной защитить Кашмир, то эскалация не нужна, и в ходе кашмирской контратаки можно будет захватить больше территории. Но если пакистанцы считают, что у них есть перевес, расширение конфликта растянет их силы и ослабит их наступательные возможности."
 PAK_Kashmir_70s.6.d: "Генеральный секретарь ООН объявил о вступлении в силу соглашения о прекращении огня между Индией и Пакистаном. Ожидается, что обе стороны останутся на своих нынешних позициях до окончательной оценки ситуации. Конфликт начался после того, как Пакистан предпринял атаку через спорную границу Кашмира. Индийское правительство ответило эскалацией конфликта, нанеся удар через международную границу. И индийцы, и пакистанцы будут рады окончанию конфликта."
 PAK_Kashmir_70s.7.d: "После прекращения огня ООН стало ясно, что нашим силам удалось захватить ключевую территорию в Кашмире и сохранить контроль над нашими крупными городами. Индийские военные потерпели полное фиаско в своих попытках эскалации конфликта, чтобы ослабить давление в Кашмире или захватить ключевую территорию, чтобы либо захватить землю, либо выторговать возвращение к довоенным границам. Теперь мы стоим перед выбором. Мы можем настаивать на выполнении резолюций ООН по Кашмиру, оставляя выбор за народом Кашмира, или мы можем сохранить наши территориальные завоевания в Кашмире. Первый вариант ставит спор о Кашмире на голосование, которое мы не контролируем, но сохранение территорий может привести к будущему конфликту с Индией."
 PAK_Kashmir_70s.8.d: "Народ Пакистана находится в эйфорическом настроении после новостей о том, что Пакистан удерживает свои крупные завоевания в Кашмире. Толпы людей вышли на улицы Карачи и Лахора, чтобы отпраздновать, создавая праздничную атмосферу. Кашмирские беженцы в Равалпинди стояли у здания Главного штаба, чтобы поблагодарить военных за их жертвы и заслуги в освобождении кашмирского народа. Правительство будет купаться в лучах славы своей победы, и уже есть сообщения о переезде чиновников Азад Кашмира на новую территорию."
 PAK_Kashmir_70s.9.d: "Ситуация по всей Индии мрачная, но напряженная. Многие индийцы шокированы военными поражениями своих войск и отступлением с ключевых кашмирских земель. Поступают сообщения о спорадических, гневных демонстрациях, требующих увольнения генералов и министров или суда за их неудачи. Индийское правительство пообещало заботиться о беженцах и кашмирских чиновниках, перемещенных пакистанской армией. Ожидается, что индийские военные будут долго копаться в себе, чтобы понять, что пошло не так в их боевых планах."
 PAK_Kashmir_70s.10.d: "Пакистанское вторжение было не просто отброшено назад, наши войска нанесли карательное поражение его вооруженным силам. Сейчас индийские войска контролируют ключевые районы оккупированного Пакистаном Кашмира и сам Пакистан. Индийская общественность ликует, сообщается, что индийские солдаты по всей стране получают сладости и цветы от населения. Поражение пакистанцев заставит их дважды подумать о будущих авантюрах. Премьер-министр также получил послание от парламента с поздравлениями правительству и военным за их быстрые действия по защите республики."
 PAK_Kashmir_70s.11.d: "Недавний индо-пакистанский конфликт закончился безрезультатно. К моменту окончания боевых действий ни одна из сторон не имела решающего преимущества над другой. Обе стороны обладают достаточной территорией, чтобы торговаться о возвращении к довоенным границам. Хотя индийское правительство надеялось нанести карательный ответ, оно будет удовлетворено сохранением статус-кво. Пакистан, хотя и избежал военного поражения, не добился победы и будет вынужден бороться с последствиями своей неудачной кашмирской авантюры."
 PAK_Kashmir_70s.12.d: "Операция по размораживанию Кашмира и принуждению к выполнению резолюций ООН закончилась провалом. Пакистанская армия сражалась храбро, с огромными шансами, но не смогла достичь своих целей. Народ Пакистана подавлен результатом, и многие задаются вопросом, зачем было начинать такую операцию, если не удалось добиться победы. У пакистанских военных и правительства будет много вопросов, за которые придется отвечать, несмотря на их усилия представить результат как успешную защиту от индийского вторжения."
 PAK_Kashmir_70s.13.d: "Вероломное пакистанское нападение в Кашмире не смогло вызвать восстание или нанести поражение нашим силам. Индийская армия сохраняет контроль над своей территорией\". Индийское правительство опубликовало заявление, в котором поздравило своих военных за стойкую защиту Кашмира и его народа. Посол Индии в ООН заявил, что пакистанцы потерпели такое поражение, что они дважды подумают, прежде чем снова решиться на подобную авантюру. Время покажет, так ли это на самом деле."
 PAK_Kashmir_70s.14.d: "Генеральный штаб Пакистана в Равалпинди был взбудоражен сообщениями о том, что наступление в Кашмире удалось вытеснить индийские войска и получить новые территории для Пакистана. Продемонстрировав свою военную мощь в регионе, мы теперь можем обратиться к индийцам с требованием наконец-то выполнить резолюции ООН по Кашмиру. Однако несколько командиров корпусов считают, что лучший подход - это сохранить наши достижения для будущей операции по освобождению всего Кашмира. Они утверждают, что привлечение ООН сейчас приведет к потере военного преимущества, и нам следует установить новую линию контроля."
 PAK_Kashmir_70s.15.d: "Неоспоримо, что индийские силы были отброшены назад в ключевых районах вдоль границы Кашмира. Эта военная неудача является большим неудобством для индийского правительства и ставит его силы в Кашмире в стратегически невыгодное положение. Парламент критикует правительство за неудачи во время конфликта и требует объяснений от военных. Индийские военные уже начали расследование, чтобы выяснить, что пошло не так во время недавних боев."
 PAK_Kashmir_70s.16.d: "Пакистанское правительство попросило нас начать процесс выполнения резолюций ООН по Кашмиру. Они настаивают на том, что ситуация в Кашмире должна быть решена его народом, а не путем вооруженного конфликта. Это лицемерная позиция, но их недавние территориальные завоевания дают их силам более выгодное положение на спорной территории. Некоторые высокопоставленные чиновники считают, что, возможно, стоит добиваться этого, так как это положит конец конфликту и не оставит наши силы уязвимыми для будущих операций. Другие чиновники и высшие военные руководители выступают против этого предложения, заявляя, что Индия не может уступить требованиям, так как это явный шантаж. Они утверждают, что со временем Индия сможет вернуть утраченные территории."
 PAK_Kashmir_70s.17.d: "Дикая авантюра Пакистана по захвату Кашмира была сорвана. В ходе боевых действий пакистанские войска были не только остановлены, но и отброшены назад в ключевых районах. Теперь наши войска имеют стратегическое преимущество в Кашмире. Теперь у нас есть два варианта: мы можем восстановить довоенные границы и объявить о победе. Это было бы хорошо воспринято на международном уровне и показало бы, что мы не являемся державой, склонной использовать вооруженную силу для завоевания земель у наших соседей. Или мы можем удержать нашу новую территорию в качестве наказания за действия Пакистана. Удержание территории повысит риск будущего конфликта, так как пакистанцы будут разъярены и со временем придут в еще большее отчаяние."
 PAK_Kashmir_70s.18.d: "Вероломная атака пакистанцев в Кашмире не смогла вызвать восстание или нанести поражение нашим силам. Индийская армия сохраняет контроль над своей территорией\". Индийское правительство опубликовало заявление, в котором поздравило своих военных за стойкую защиту Кашмира и его народа. Посол Индии в ООН заявил, что пакистанцы потерпели такое поражение, что они дважды подумают, прежде чем снова решиться на подобную авантюру. Время покажет, так ли это на самом деле."
 PAK_Kashmir_70s.19.d: "Вероломное пакистанское нападение в Кашмире не смогло вызвать восстание или нанести поражение нашим силам. Индийская армия сохранила контроль над своей территорией и захватила часть пакистанской территории в ходе контратаки\". Индийское правительство опубликовало заявление, в котором поздравило своих военных за стойкую защиту Кашмира и ее народа. Посол Индии в ООН заявил, что пакистанцы потерпели такое поражение, что они дважды подумают, прежде чем снова решиться на подобную авантюру. Время покажет, так ли это на самом деле."
 PAK_Kashmir_70s.20.d: "Несмотря на тщательное планирование и агрессивную атаку, наша операция по размораживанию Кашмира и принуждению Индии к согласию на прекращение огня провалилась. Индийцы по-прежнему контролируют свои позиции, а наши силы были отбиты. Это не вина пакистанских солдат, которые выполняли свой долг с усердием и дисциплиной, а результат неудачного руководства и воображения командиров. Ожидается, что народ Пакистана гневно отреагирует на эту неудачу, а для миллионов кашмирцев, перемещенных в результате индийского насилия, это будет большим разочарованием."
 PAK_Kashmir_70s.21.d: "Наше посольство в Лондоне сообщило о создании новой Кашмирской националистической партии кашмирскими студентами, обучающимися за рубежом. В организацию входят индийские кашмирцы, а также пакистанские кашмирцы. Новая группа планирует проводить акции протеста и освещать кашмирский спор, чтобы привлечь внимание международной общественности к ситуации. Члены группы настаивают либо на независимости, либо на выполнении резолюций ООН на этой территории. Мы считаем, что правительство Пакистана играет важную роль в поддержке этой организации, чтобы обойти нас на международном уровне."
 PAK_Kashmir_70s.22.d: "Делегация Пакистана в ООН выступила с настойчивым призывом к выполнению резолюций ООН по Кашмиру. Они отметили, что сотни кашмирцев за рубежом обратились в их представительства с мольбой о решении проблемы и воссоединении их семей, разделенных десятилетиями спора. Это завершение широкого пакистанского дипломатического наступления, направленного на повышение осведомленности о Кашмире и оказание международного давления на нас, чтобы мы согласились. Некоторые в правительстве считают, что, возможно, пришло время принять и выполнить резолюцию. Это положит конец конфликту и позволит нам больше сосредоточиться на нашей экономике и продемонстрировать кашмирскому народу нашу приверженность ему. Однако большинство членов кабинета считает, что дипломатическая доброжелательность, которую мы потеряем, отказавшись, не сравнится с жертвой нашими позициями в Кашмире и стратегическим преимуществом над Пакистаном."
 PAK_Kashmir_70s.23.d: "Наши усилия оказать дипломатическое давление на Индию в ООН не увенчались успехом. Индийцы остаются непреклонными в своей оккупации Кашмира, несмотря на дипломатические издержки. Это серьезная неудача для правительства Пакистана, которое делало большую ставку на дипломатический подход к разрешению конфликта. Пакистанские военные воспримут это событие весьма негативно. В Министерстве иностранных дел опасаются, что будущее решение проблемы Кашмира теперь будет определяться на поле боя, а не за дипломатическим столом."
 Elahi.1.d: "Посол Пакистана передал послание от президента Элахи. Он просит Королевство встретиться с ним и его старшими офицерами обороны для проведения переговоров по укреплению стратегических отношений между нашими странами. Президент Пакистана отметил исторические узы, связывающие нас, и преданность, которую наши народы испытывают друг к другу. В прошлом пакистанцы предоставляли нам экспертов и военную подготовку. Многие в нашем правительстве готовы встретиться с этой высокопоставленной делегацией, чтобы определить, какого рода соглашение может быть достигнуто. Однако некоторые чиновники предлагают нам отклонить эту просьбу и не связывать себя ни с одним государством, независимо от отношений."
 Elahi.2.d: "Президент Пакистана и его ведущие военные и экономические советники провели переговоры с саудовским королем и его старшими министрами. В ходе переговоров пакистанцы предложили всеобъемлющее соглашение. В обмен на военных экспертов и постоянное военное присутствие для защиты королевства мы предложим Пакистану экономические субсидии. Это крупное соглашение, наши советники считают, что если нас не устроит соглашение, мы могли бы вежливо попросить о дальнейших консультациях и завершить встречу в знак потепления связей между нашими странами."
 Elahi.3.d: "Саудовское правительство приняло наше предложение, и мы подписали стратегическое соглашение в Эр-Рияде. Эта новость была очень хорошо воспринята пакистанским народом. Религиозные партии в нашей коалиции особенно рады этому соглашению. Пакистанские военные уже направляют советников и разрабатывают вместе со своими саудовскими коллегами планы возможного развертывания войск в случае необходимости. Саудовцы выразили огромное удовлетворение этим соглашением и дальнейшим углублением наших отношений. Началась новая эра в пакистано-саудовских отношениях."
 Elahi.4.d: "Правительство Пакистана очень взволновано недавним соглашением. Наши собственные военные взволнованы перспективами прибытия опытных пакистанских военных для повышения обороноспособности наших сил. Министерство информации скоро распространит информацию о соглашении среди местных СМИ и международной прессы. Мы ожидаем положительного отклика. Согласие Пакистана защищать Королевство от иностранной агрессии также является радостной новостью и позволит нашим лидерам получить большую свободу действий внутри страны. Это соглашение знаменует новую эру в саудовско-пакистанских отношениях."
 Elahi.5.d: "Недавний сдвиг в сторону более исламской идентичности, чтобы лучше подтолкнуть нашу нацию к национальной идеологии, заложенной нашими основателями, привел к обратной реакции со стороны бенгальцев в Восточном Пакистане. Их провинциальное собрание, в котором преобладают левые, открыто осудило недавнюю политику и призыв к независимости бенгальцев. Президент отправляется в Дакку, чтобы снять напряженность. Бенгальцы - гораздо более разнообразное в религиозном отношении население и на протяжении десятилетий следуют опасной светской идеологии \"Авами Лиг\". Нам придется подумать, будет ли взаимное разделение к лучшему. Однако объединенный Пакистан остается сильным Пакистаном."
 PAK_AL75.1.d: "Президент Пакистана Муджибур Рахман недавно направил послание с призывом провести переговоры на уровне министров иностранных дел в Карачи. Пакистанцы хотят укрепить доверие с нами и расширить торговые отношения. Наши старшие советники не считают, что пакистанцы хотят полного взаимодействия с нами, однако, даже постепенное улучшение отношений может привести к окончательной нормализации. Есть некоторые чиновники, которые считают, что мы должны отвергнуть эту инициативу, они полагают, что необходимо придерживаться жесткой линии до тех пор, пока Пакистан полностью не возьмет на себя обязательства по установлению добрососедских отношений. Решение должно быть принято."
 PAK_AL75.2.d: "Министры иностранных дел Пакистана и Индии встретились в Карачи для переговоров. Встреча состоялась после приглашения Пакистана в Индию. Стороны подписали соглашение о развитии торговли и увеличении числа дипломатов в обоих государствах. Оба правительства опубликовали заявления, в которых восхваляли соглашение как позитивный шаг в правильном направлении. Несмотря на соглашение, обе стороны признали, что остается много нерешенных вопросов, которые необходимо будет решать в будущем. На международном уровне переговоры получили высокую оценку. Дойдя до здания провинциальной ассамблеи, президент обратился к представителям СМИ. Он заявил, что понимает, что некоторые жители Восточного Пакистана разочарованы нынешней избирательной системой, и с нетерпением ждет предстоящих переговоров."
 PAK_1975_Election.1.d: "Зульфикар Али Бхутто объявил, что Пакистанская народная партия вышла из коалиции с «Авами Лиг». Он сослался на растущее расхождение в идеологических целях и обеспокоенность по поводу доминирования бенгальцев в коалиции. Бхутто заявил, что ПНП планировала возглавить коалицию левых и левоцентристских партий, чтобы обеспечить пакистанцам истинный исламский социализм. Представитель «Авами Лиг» подтвердил раскол, обвинив Бхутто в необоснованных требованиях к коалиции. Лидер «Авами Лиг» шейх Муджибур Рахман не дал комментариев, но, по слухам, его все больше раздражает амбициозный лидер ПНП."
 PAK_1975_Election.2.d: "После особенно ожесточенной избирательной кампании пакистанские избиратели идут на выборы. Три варианта выбора - коалиции во главе с Муджибуром Рахманом, Зульфикаром Али Бхутто и Чаудри Захуром Элахи. Молодой, харизматичный Бхутто возглавляет мощную левоцентристскую коалицию. Она заимствует некоторые из более умеренных элементов левых у политического оплота шейха Муджибура Рахмана. Наконец, Чаудри Захур Элахи, уважаемый промышленник, возглавляет коалицию консервативных партий, нацеленных на сокращение социализма в стране и отстаивание исламских принципов, на которых был основан Пакистан. Теперь народ должен принять решение."
 Awami_League_Unrest.1.d: "Лига Авами, которая доминирует в провинциальной ассамблее Восточного Пакистана, недавно приняла резолюцию, призывающую к созданию бенгальской нации. Эта радикальная резолюция вызвала бурную реакцию в Западном Пакистане и Национальной ассамблее. Президент также отреагировал резко и вылетел в Дакку для переговоров с Авами Лиг. Когда переговоры начались, президенту стало ясно по тому приему, который ему оказали люди и Авами Лига, что в единый Пакистан мало кто верит. Многие в провинции чувствуют, что страна отдаляется от них, а последние выборы показали, что растет предубеждение, которое препятствует росту бенгальских национальных лидеров. Президент должен решить, будет ли он искать компромисс по вопросу независимости Восточного Пакистана или займет жесткую позицию и будет настаивать на создании единого Пакистана. Учитывая, насколько тесно интегрированы два крыла в военном отношении, представляется мало шансов на перерастание ситуации в вооруженный конфликт, поскольку это было бы катастрофой для обеих сторон."
 Awami_League_Unrest.2.d: "Новости об отказе Пакистана пойти на компромисс вызвали массовые беспорядки в федеральных районах Дакки. Правительственные здания и суды были сожжены разъяренными протестующими, во многих случаях полиция просто стояла в стороне и не вмешивалась, чтобы остановить насилие. Это проявление народного возмущения заставило многих советников предложить президенту изменить курс и принять Бангладеш, однако есть и те, кто продолжает призывать его к созданию Единого Пакистана. Ситуация очень напряженная."
 Awami_League_Unrest.3.d: "Поскольку переговоры зашли в тупик и напряженность нарастала как в Западном, так и в Восточном Пакистане, «Авами Лиг» объявила День Бангладеш по всей провинции. В домах по всему Восточному Пакистану бенгальцы вывесили самодельные флаги Бангладеш в знак поддержки усилий «Авами Лиг». Эта акция потрясла даже жителей Западного Пакистана. Многие теперь считают, что если бенгальцы так сильно хотят уехать, то правительство должно просто позволить им уехать. Президент согласился с этим мнением и проинформирует представителей «Авами Лиг» при следующей встрече."
 Awami_League_Unrest.4.d: "Президент Пакистана и руководство «Авами Лиг» подписали публичный документ, призывающий к независимости Бангладеш. После подписания документа жители Дакки перешли в режим празднования с музыкой и гуляниями в течение всей ночи. В течение следующих трех месяцев западнопакистанцы будут репатриированы обратно в Пакистан по мере передачи власти. В рамках соглашения Пакистан не будет обязан \"платить\" Бангладеш за любые средства на развитие, использованные из его доходов с момента обретения независимости. Жители Западного Пакистана восприняли эту новость спокойно, многие надеются, что это наконец-то положит конец бесконечной напряженности между двумя крыльями страны."
 Awami_League_Unrest.5.d: "Бангладеш официально присоединилась к сообществу наций, когда правительство Пакистана официально предоставило суверенитет Ассамблее провинции Восточный Пакистан. Хотя пакистанское правительство заявило, что оно спокойно относится к этим переменам, многие бангладешцы отметили поспешность, с которой оно эвакуировало свой персонал и грузы из провинции. Более того, на церемонию поднятия флага пакистанское государство прислало только своего министра иностранных дел. Несмотря на это, «Авами Лиг» высоко оценил мирный переход и выразил надежду на продолжение хороших отношений между двумя братскими народами."
 Awami_League_Unrest.6.d: "Лига Авами, которая контролирует Ассамблею провинции Восточный Пакистан, недавно приняла резолюцию, призывающую к созданию Бенгальской нации. Эта радикальная революция вызвала возмущение в Западном Пакистане и Национальной ассамблее. Президент также отреагировал решительно и вылетел в Дакку для переговоров с Лигой Авами. По его прибытии многие жители заполнили улицы, приветствуя президентский кортеж. Недавний успех президента на выборах в Восточном Пакистане и общественная поддержка показывают, что многие в Восточном Пакистане по-прежнему твердо привержены государству."
 Awami_League_Unrest.7.d: "После нескольких дней переговоров Авами Лига согласилась отозвать свою резолюцию, призывающую к созданию бенгальской нации. Авами Лига быстро обнаружила, что ее позиции силы подорваны, поскольку сторонники правительства вскоре доминировали на улицах Дакки, сплотившись вокруг президента. Чтобы сохранить лицо, правительство Пакистана пообещало поддерживать больше местных культурных инициатив и рассмотреть возможность изменения количества мест, на которые имеет право Восточный Пакистан в Национальной ассамблее. Однако многие аналитики полагают, что этот последний пункт не приведет к каким-либо изменениям. По всему Пакистану президент пользуется широкой поддержкой, поскольку в передовицах газет утверждается, что недавние события доказывают, что конституция теперь является высшим законом для всех пакистанцев. Лига Авами опубликовала собственное заявление, в котором утверждается, что она добилась больших результатов в обеспечении прав жителей Восточного Пакистана. Провинциализм, похоже, находится на пути неуклонного упадка."
 PAK_Econ70s.1.d: "Королевство быстро растет и обладает невероятным богатством. Однако нам не хватает многочисленного рабочего класса или университетской системы, способной удовлетворить потребности в рабочей силе, образовании, медицине или инженерии, которые необходимы для роста нашего богатства. В последние месяцы мы предложили тысячам пакистанцев гостевые рабочие визы для работы в стране. Подавляющее большинство этих работников - мужчины, и большая их часть будет работать в строительстве или сфере обслуживания. Однако мы также привлекаем врачей, инженеров и других специалистов для работы в новых больницах и надзора за новыми проектами развития."
 PAK_Econ70s.2.d: "Эмираты быстро развиваются и обладают невероятным богатством. Однако нам не хватает многочисленного рабочего класса или университетской системы, способной удовлетворить потребности в рабочей силе, образовании, медицине или инженерии, необходимые для развития наших городов с нашим богатством. В последние месяцы мы предложили тысячам пакистанцев гостевые рабочие визы для работы в стране. Подавляющее большинство этих работников - мужчины, и большая их часть будет работать в строительстве или сфере обслуживания. Однако мы также привлекаем врачей, инженеров и других специалистов для работы в новых больницах и надзора за новыми проектами развития."
 PAK_Afghan_War.10.d: "Беспрецедентное присутствие афганских беженцев подавляет местные власти и вызывает конфликты в наших приграничных городах. Штаб поручил командиру местного корпуса взять ситуацию под контроль. Армейские инженеры планируют создать лагеря для беженцев за пределами Пешавара и других городов. Армия будет тесно сотрудничать с гражданскими служащими для установления эффективной связи между беженцами и нашим правительством. Беженцами руководят старейшины их традиционных племен, поэтому мы планируем передавать помощь непосредственно этим старейшинам, а они пусть распределяют ее между семьями. Армейский медицинский корпус в сотрудничестве с иностранными гуманитарными организациями планирует также создать полевые госпитали. Это поможет снизить социальную напряженность, вызванную беженцами, и продемонстрирует нашу братскую приверженность оказанию помощи афганскому народу."
 PAK_Afghan_War.11.d: "После интенсивного анализа ИНИ определил основные повстанческие группы, готовые и способные начать операции против поддерживаемого Советским Союзом марионеточного режима. Военная помощь повстанцам из внешних источников будет строго контролироваться ИНИ, которая будет распределять оружие среди наиболее эффективных групп. Те группы, у которых нет желания вступать в вооруженную борьбу, не получат ни оружия, ни денег. Бригадный генерал Мохамад Юсаф, недавно назначенный главой Афганского бюро, является ответственным за этот канал поставок оружия. Оружие, импортируемое в Карачи, будет перевозиться на гражданских автомобилях в лагеря моджахедов, создаваемые вблизи границы."
 Bhutto_70s.1.d: "Организация исламских стран выбрала Пакистан для проведения следующего исламского саммита в Лахоре. На встречу на три дня соберутся главы государств мусульманских стран со всего мира. ОИС отметила, что Пакистан является исключительным членом организации и заслуживает этой привилегии. Правительство Пакистана опубликовало собственное заявление, в котором выразило глубокую признательность за оказанную честь. Оно отметило, что Лахор уже давно является центром ислама в Южной Азии. Газеты по всему Пакистану опубликовали сообщения, свидетельствующие о гордости, которую испытывает народ Пакистана, и его волнении по поводу того, что он будет принимать у себя исламских братьев."
 Bhutto_70s.2.d: "Зульфикар Бхутто провел последние пару недель, летая по мусульманскому миру, чтобы вручить персональные приглашения главам государств. За сообщениями внимательно следит местная пресса, и многие пакистанцы все больше радуются предстоящему саммиту. Многие страны уже пообещали принять участие в саммите, а некоторые лидеры направили личные послания народу Пакистана, в которых выразили свою честь быть лично приглашенными. Зульфикар Али Бхутто также лично следит за подготовкой в Лахоре. Многие местные предприятия и организации уже пообещали предложить свои услуги и выступления для конференции."
 Bhutto_70s.3.d: "Зульфикар Али Бхутто открыл второй исламский саммит Организации исламских стран. В нем принимают участие более сорока глав мусульманских государств, а также высокопоставленные чиновники из ряда других государств. Пакистанский лидер подчеркнул необходимость исламского единства в эти трудные времена и пригласил всех участников познакомиться с Лахором. В своем выступлении Бхутто пообещал постоянную поддержку исламского мира народу Палестины и арабских государств. Под гром аплодисментов Бхутто открыл Исламский фонд солидарности, который будет способствовать развитию исламской культуры, единства и образования. Пакистанские СМИ и более широкая мусульманская пресса написали восторженные отзывы об открытии конференции. Во время первого государственного ужина Бхутто пригласили сесть с королем Саудовской Аравии."
 Bhutto_70s.4.d: "Харизматичный ливийский лидер Муаммар Каддафи выступил перед полным стадионом пакистанцев на стадионе в Лахоре. В своей громогласной речи Каддафи поблагодарил жителей Лахора и провозгласил вечное братство между Пакистаном и Ливией. Толпа особенно ликовала, когда Каддафи провозгласил, что то, что принадлежит ливийскому народу, принадлежит и народу Пакистана. Громче всего его приветствовали, когда он говорил о неограниченном потенциале Пакистана. Эта речь получила широкую огласку по всему Пакистану, и многие призывают Пакистанский совет по крикету изменить название стадиона на \"Стадион Каддафи\", что представляется вполне вероятным. После своего выступления Каддафи встретился с Зульфикаром Бхутто, и два лидера подписали соглашения, гарантирующие прибытие пакистанских гастарбайтеров и военных советников, а также субсидии на ливийскую нефть."
 Bhutto_70s.5.d: "Во время одного из главных выступлений в ОИС министр иностранных дел Пакистана выступил с мощной речью, осуждающей продолжающуюся оккупацию мусульманских земель Израилем и Индией. Речь была хорошо принята присутствовавшими мусульманскими лидерами. Индийская пресса, как говорят, была в ярости. Хотя Индия является членом-наблюдателем в ОИС, она отказалась прислать своего представителя, и теперь индийское правительство обвиняют в том, что его не было на месте, чтобы противостоять антииндийской повестке дня. В Пакистане хвалят Зульфикара Бхутто за успешную демонстрацию международной поддержки дела Пакистана."
 Bhutto_70s.6.d: "В знак признательности за все, что Пакистан предоставил и сделал во время конференции ОИС, страны Персидского залива обязались оказать финансовую поддержку правительству Пакистана. Зульфикар Бхутто подписал серию соглашений и выразил надежду, что Пакистан и страны Персидского залива установят долгосрочные связи друг с другом. Соглашения получили широкую известность, поскольку они обеспечивают Пакистану значительный экономический импульс в сложной экономической ситуации. Пакистан также подписал соглашения, обязывающие военных проводить учебные миссии для крупных стран Персидского залива с целью повышения их обороноспособности. Король Саудовской Аравии опубликовал собственное заявление, в котором выразил свое глубокое восхищение народом Пакистана и той милостью, которую он получил в Лахоре."
 Bhutto_70s.7.d: "Вторая исламская конференция Организации исламских стран официально завершилась. Пакистанский лидер Зульфикар Бхутто лично проводил многих участников в аэропорту Аллама Икбал. Конференция имела огромный успех для Пакистана, продемонстрировав его позиции в исламском мире. Что еще более важно, конференция принесла много положительных результатов для Пакистана. Бхутто значительно узаконил свой статус среди народа Пакистана и как международный лидер. Жители Лахора не скоро забудут воспоминания о конференции."
 Bhutto_70s.8.d: "Пакистан направил делегацию высокого уровня для посещения Кабула. Они предлагают нам возможность нормализовать отношения и положить конец недавней напряженности между нашими государствами. Нормализация отношений может защитить нас, если ситуация обострится в будущем. Однако, если мы сделаем это, то рискуем оттолкнуть от себя наше внутреннее население. У многих в стране есть родственники по ту сторону границы, и они убеждены, что Пакистан продолжает оккупировать священную афганскую землю. Мы должны решить, как поступить с делегацией. Мы можем привлечь их к сотрудничеству или дать им отпор, отправив для беседы с ними чиновников низкого уровня."
 Bhutto_70s.9.d: "Более десяти лет назад Афганистан активно пытался поднять волнения и спровоцировать вооруженное восстание в Пакистане. Эти усилия, естественно, не смогли бросить вызов суверенитету и национальному единству пакистанского народа. Однако Афганистан не забыл об этом и в будущем может предпринять новую попытку. Недавно Зульфикар Бхутто получил предложение установить контакт с таджиками и исламистами в Афганистане. Эти две группы выступают против конфликта с нашим государством и заинтересованы в укреплении своих позиций в Афганистане. Если мы наладим с ними контакт и установим связи, это может оказаться очень эффективным в будущем и продемонстрировать Афганистану, что мы можем причинить им не меньший вред. Однако в оборонном ведомстве есть и такие, кто считает, что мы должны оставить все как есть и не вмешиваться в дела Афганистана."
 Bhutto_70s.10.d: "Генерал Насирулла Бабар, генеральный директор военной разведки, ознакомил пакистанского лидера Зульфикара Бхутто с предложенным планом по экстрадиции в Пакистан ключевых религиозных и таджикских лидеров, выступающих против Кабула. Эти люди должны были пройти обучение, установить связи с Пакистаном и предоставить информацию о том, что происходит в Афганистане. Риск их обнаружения Афганистаном минимален, а если они и будут обнаружены, то, скорее всего, не станут говорить об этом. Если учесть, сколько наших диссидентов они публично мочат из шланга в Кабуле. Среди тех, кто должен быть выдан, - Ахмад Шах Масуд, Бурхануддин Раббани и Гульбадин Хекматыр. Таджикские активисты представляют общину, которая возмущена программой \"Пуштунистан\" и ее влиянием на афганское общество и экономику. Религиозные лидеры - в основном пуштуны, которые также выступают против афганского правительства за его антиисламскую политику. Они также хотят теплых отношений с Пакистаном, который они рассматривают как исламское государство."
 Bhutto_70s.11.d: "После нескольких месяцев обсуждений и учебных курсов наши спецслужбы успешно вернули религиозных и таджикских лидеров в Афганистан. Теперь мы имеем гораздо более четкое представление об Афганистане, его хрупкой политике и борьбе за то, чтобы государство распространило свое влияние за пределы городских центров. Генерал Насирулла Бабар недавно представил брифинг, в котором выступил за создание тайных маршрутов через границу для поставки оружия этим повстанческим фракциям. Он отметил, что афганское правительство активно борется с такими группировками и ежедневно совершенствует методы их подавления. Бабур рекомендовал одобрить передачу оружия для сохранения этих оппозиционных групп и укрепления наших связей с ними. Некоторые советники считают, что афганские повстанцы просто будут использовать оружие для операций, и Пакистан не должен рисковать новым конфликтом с Афганистаном"
 Bhutto_70s.12.d: "Наши контакты с оппозицией в Афганистане сообщают, что афганское правительство продолжает политику, направленную на подрыв ислама в стране и устранение таджиков как политической силы внутри страны. Теперь они просят у нас разрешения использовать уже предоставленное нами оружие для вооруженных нападений на афганское правительство. Они также просят предоставить им дополнительное оружие для поддержки их наступления. Наши руководители разведки сообщили нам, что даже если мы откажем им в разрешении, афганская оппозиция почувствует угрозу и будет действовать независимо от этого. Наши военные советники выступают за то, чтобы мы дали разрешение и отправили больше оружия и материалов через границу, чтобы выполнить нашу миссию по наказанию афганского правительства. Другие советники опасаются, что такие атаки могут поставить нас в неловкое положение, если повстанцы просочат информацию о нашем участии."
 Bhutto_70s.13.d: "Средства массовой информации активно сообщают о крупных нападениях на правительственных чиновников и силы безопасности в небольших городах и деревнях, в основном в таджикских районах страны. Операции по нанесению ударов и бегству демонстрируют некоторую изощренность, и первые сообщения указывают на то, что эти нападения совершаются разъяренными таджиками и недовольными пуштунскими боевиками, вдохновленными религией. В некоторых случаях сообщалось, что наши войска бежали против сил, которые значительно превосходили их по численности, но наши командиры отмечают, что это единичные случаи, связанные с плохо управляемыми новобранцами. Численность повстанцев слишком мала, чтобы захватить территории, но доверие народа поколеблено, а наши военные чувствуют себя униженными. Многие в Кабуле подозревают, что Пакистан участвует в подготовке и вооружении этих групп."
 Bhutto_70s.14.d: "Наше правительство и военные недавно завершили пресс-конференцию, на которой мы объявили о победе над недавней попыткой повстанцев, поддерживаемых иностранцами, захватить страну. Хотя первоначальные атаки казались сильными, повстанцы быстро ослабли, и мы смогли перебросить наши лучшие войска в нужные районы, чтобы отбить дальнейшие атаки. Средства массовой информации и жители Кабула восхваляют правительство и военную мощь Афганистана. Мы уже сообщаем мировым СМИ и представляем свидетельства захваченных повстанцев о том, что их вооружал и направлял Пакистан. Афганистан одержит победу, и гнусный заговор нашего соседа будет раскрыт."
 Bhutto_70s.15.d: "Недавно начальник пакистанской армии получил специальный оборонный доклад от самого Зульфикара Бхутто. Доклад, написанный по согласованию с его советниками по безопасности, включая некоторых офицеров, участвовавших в печально известном Равалпиндском заговоре, призывает к радикальным изменениям в пакистанской армии. В документе Бхутто выступает за преобразование армии в Народную армию, которая сможет лучше мобилизовать рабочий класс и крестьянство, чтобы противостоять демографическому преимуществу Индии. На первый взгляд, большинство старших офицеров считают этот документ нелепым и угрожающим не только институциональной целостности, но и стабильности Пакистана. Никто не хочет вооружать крестьян. Однако офицеры, поддерживающие Бхутто, поддерживают этот документ и давят на командующего армией, чтобы он был принят. В конечном счете, решение должен принять командующий армией."
 Bhutto_70s.16.d: "Пакистанский лидер Зульфикар Али Бхутто давно выступает за более тесное сотрудничество между гражданскими и военными и недавно начал заседать в советах по продвижению по службе, чтобы наблюдать и вносить свой вклад. Это знаменует собой серьезные изменения для пакистанской армии, поскольку в течение многих лет она строго отделяла свою институциональную практику от гражданского участия. Многие старшие пакистанские офицеры наблюдают за развитием событий с нервным беспокойством, поскольку, похоже, армия будет продвигать офицеров не только по их способностям как офицеров, но и по их предполагаемой лояльности к ПНП и самой Бхутто. Группа отставных генералов опубликовала открытое письмо, осуждающее политизацию армии, однако армия по-прежнему привержена проведению реформ, предложенных Бхутто несколько месяцев назад."
 Bhutto_70s.17.d: "Пакистанские военные сообщили ошеломленному Зульфикару Бхутто, что они раскрыли заговор младших офицеров армии и ВВС с целью свержения правительства. Пакистанские спецслужбы узнали о заговоре после того, как один из заговорщиков рассказал о нем своему начальнику. Судя по всему, в армии есть ряд офицеров, которые смотрят на Бхутто с опаской и боятся за будущее не только армии, но и самого Пакистана. Вскоре Бхутто обратилась к нации, осудив бонапартизм и пообещав искоренить антигосударственных заговорщиков сверху донизу. Пакистанские военные сообщили Бхутто, что они создают военный трибунал для искоренения других заговорщиков. У главнокомандующего армией есть на примете офицер для руководства трибуналом, однако некоторые близкие советники Бхутто предлагают ему настоять на том, чтобы трибунал возглавил бригадный генерал Зия уль-Хак, перспективный, аполитичный, но ревностный офицер"
 Bhutto_70s.18.d: "Назначение бригадного генерала Зия уль-Хака главой военного трибунала, расследующего заговор против Бхутто, позволило успешно раскрыть несколько ячеек заговорщиков в расквартированных по всему Пакистану лагерях. Даже те, кто только подозревается в причастности к этому, безжалостно допрашиваются трибуналом, и почти все они либо уходят в отставку, либо, в случае обнаружения доказательств, приговариваются к суровым тюремным срокам. Говорят, что Зульфикар Бхутто очень доволен работой трибунала и выразил свое желание главнокомандующему сухопутными войсками, чтобы Зия продвигался дальше по карьерной лестнице. Однако некоторые отставные офицеры, консультировавшие Бхутто, призвали его быть осторожным, поскольку, по их мнению, Зиа движим не только желанием защитить правительство, но и восстановить субординацию в армии."
 Bhutto_70s.19.d: "Военный трибунал, расследующий предполагаемый заговор против переворота Бхутто, успешно выявил ячейки, действующие в основном в Лахоре, Карачи и Равалпинди. Трибунал отметил, что многие из предполагаемых заговорщиков даже не замышляли заговора, не ограничиваясь соглашением о том, что Бхутто вредна для страны и военных. В результате многие обвиняемые получили официальные выговоры и отрицательные отметки в послужных списках, но им разрешили остаться в армии. Те, кто был уличен в более глубоком участии, особенно офицеры ВВС и армии в Карачи, увольняются со службы, а руководители получают тюремные сроки. Трибунал отметил важность восстановления субординации во всех подразделениях и осудил заговоры как подрывающие институт. Зульфикар Бхутто внимательно следит за работой трибунала и удовлетворен его действиями, хотя лично его раздражает акцент на субординации, а не на преступлении измены в заговоре с целью свержения его правительства."
 Bhutto_70s.20.d: "Вопрос о том, что делать с сектой Ахмадийя в Пакистане, продолжает мучить правительство. Последователи секты, которых называют ахмадийцами, в основном проживают в Лахоре, где они играют заметную роль в бизнесе и промышленности. Они считают себя мусульманами, однако многие другие мусульманские секты в Пакистане, включая основные религиозные политические организации, осуждают эту группу за отрицание того, что пророк Мухаммед был последним пророком, и за обожествление своего основателя Мирзы Гулама Ахмада. Эта напряженность привела к жестоким беспорядкам в Лахоре в 1953 году, когда армия была введена для прекращения насилия и защиты ахмадитов. В то время правительство отказалось принять требования бунтовщиков, чтобы ахмадийцев называли немусульманами. Однако напряженность вновь нарастает: многие пакистанцы осуждают ахмадитов за то, что они якобы используют свое богатство для обращения бедных жителей деревень в окрестностях Лахора. Зульфикар Бхутто вскоре внесет на рассмотрение Национальной ассамблеи поправку об объявлении ахмадитов немусульманами, чтобы заручиться поддержкой своей партии и положить конец критике со стороны религиозных групп о том, что он участвует в антиисламской политике."
 PAK_Religous_Upheaval.1.d: "Лидеры религиозных партий совместно с ведущими духовными лидерами организовали серию крупных акций протеста в разных городах Пакистана. Они перекрывают главные дороги и осуждают то, что они считают продолжающейся моральной деградацией нации. Похоже, что недавний провал религиозных партий на выборах вызвал опасения среди многих мусульманских общин, что страна отходит от своих исламских корней. Протестующие хотят, чтобы правительство законодательно обеспечило исламский характер нации. Многие пакистанские предприниматели объявили, что будут периодически закрывать свои магазины в поддержку протестов. В заявлении, опубликованном ведущими лидерами исламского сообщества страны, говорится, что по всей стране будут проводиться регулярные акции протеста и экономические бойкоты до тех пор, пока их проблемы не будут решены."
 PAK_Religous_Upheaval.2.d: "Нынешние протесты и бойкоты становятся невыносимыми для правительства. В настоящее время проводится совещание высокого уровня с участием соответствующих руководителей служб безопасности и членов кабинета министров. Некоторые хотят направить полицию и другие силовые структуры для подавления протестов, возможно, они не смогут положить конец беспорядкам, но они точно смогут уменьшить их последствия. Однако такие действия сопряжены с риском, поскольку они могут просто ободрить протестующих. Другой вариант - начать переговоры с религиозными комитетами. Возможно, мы сможем дать достаточно обещаний для локальных изменений, но, опять же, переговоры также связаны с риском, так как эти группы могут почувствовать себя увереннее и расширить свои требования."
 PAK_Religous_Upheaval.3.d: "Недавнее подавление полицией масштабных религиозных протестов, возглавляемых исламскими политическими партиями, привело к заметному снижению беспорядков. Решение не арестовывать религиозных лидеров, а нацелиться на их главных сторонников оказалось верным. Хотя молитвенные лидеры продолжают произносить речи, отсутствие на местах главарей, которые могли бы руководить беспорядками, значительно ослабило воздействие протестов. Кроме того, успешное судебное преследование послужило эффективным сдерживающим фактором для предотвращения появления новых лидеров. Правительство будет удовлетворено своим успехом."
 PAK_Religous_Upheaval.4.d: "Недавнее подавление полицией масштабных религиозных протестов, возглавляемых исламскими политическими партиями, не смогло ослабить волнения. Хотя правительство сосредоточилось на аресте организаторов, а не религиозных лидеров, чтобы не разжигать протестующих, обвинения не проходят в судах. Более того, некоторые из этих местных организаторов становятся все более заметными, поскольку они пропагандируют свою повестку дня на судебных слушаниях и в СМИ. Протестующие удваивают свои усилия и вдохновляют все больше людей присоединиться к кампании за то, чтобы Национальное собрание законодательно утвердило исламскую идентичность страны."
 PAK_Religous_Upheaval.5.d: "После напряженных переговоров правительство и лидеры религиозных протестов договорились о ряде компромиссов. Правительство пообещало воздержаться от преследования протестующих, обвиненных в нарушении общественного порядка, а протестующие сократят экономические протесты. Обе стороны сделали заявления для СМИ о том, что соглашение позволит снизить напряженность и создать более позитивную обстановку при рассмотрении вопроса Национальным собранием."
 PAK_Religous_Upheaval.6.d: "Правительство подтвердило, что усилия по переговорам с лидерами религиозных протестов закончились неудачей. Похоже, лидеры протеста расценили переговоры как признак слабости и только расширили свои требования, включив в них закрытие рынков в пятницу до полудня. Экономические последствия этого будут драматическими, что сделает переговоры невозможными. СМИ обрушились на правительство, обвиняя его в отсутствии стратегии борьбы с нарастающими протестами..."
 PAK_Religous_Upheaval.7.d: "Оппозиция выдвинула требования исламских партий и религиозных лидеров протеста, требующих, чтобы конституция более полно отражала исламский характер Пакистана. Общенациональные протесты не утихнут, пока эти требования не будут рассмотрены. Правительство может использовать два подхода: первый - осторожно выступить против этих предложений. Они могут сделать это, утверждая, что нация уже имеет исламскую идентичность. Мы можем работать над тем, чтобы убедить оппозицию присоединиться к правительству в противостоянии более радикальным требованиям и восстановить порядок. Другой подход - принять предложения и работать с оппозицией, чтобы решить их требования таким образом, чтобы не нанести ущерба конституции."
 PAK_Religous_Upheaval.8.d: "В громогласном обращении премьер-министр осудил оппозицию за то, что она использует беспокойство людей по поводу ислама в качестве политического инструмента для нападок на ведущие институты нации. Он заявил, что протесты показывают, почему ислам не следует вмешивать в государственные дела."
 PAK_Religous_Upheaval.9.d: "В ходе внеочередных дебатов в Национальном собрании парламентарии правительства задали вопрос лидерам оппозиции и исламских партий о том, что такое мусульманин. Ответы были весьма разнообразны, в зависимости от происхождения и секты, которую исповедует отвечающий. После обсуждения премьер-министр отметил, что ислам представлен в Пакистане по-разному, и поэтому любые попытки законодательно закрепить эту идентичность обречены на провал. Он спросил собрание, что если нет согласия по поводу того, кто такой мусульманин, то как Национальная ассамблея может даже рассматривать вопрос о принятии законов, связанных с исламом."
 PAK_Religous_Upheaval.10.d: "После последних дебатов с правительством в Национальном собрании оппозиция, похоже, разделилась. Несколько членов решили переключить свою поддержку на правительство. Несколько религиозных лидеров также призвали своих сторонников больше не участвовать в протестах."
 PAK_Religous_Upheaval.11.d: "Оппозиция не была впечатлена недавними дебатами с правительством в Национальном собрании. Многие обвиняют правительство в том, что оно отступило от своего долга защищать ислам. Действительно, некоторые парламентарии из правящей коалиции теперь поддерживают требования протестующих."
 PAK_Religous_Upheaval.12.d: "Во время недавних дебатов в Национальном собрании по поводу разрешения нынешних протестов религиозных партий правительство призвало всех депутатов обратить внимание на наследие Квади Азама. Сторонники правительства отметили, что Мохаммад Али Джинна приложил значительные усилия, чтобы гарантировать защиту меньшинств и обеспечить единство всех мусульманских общин. Они также указали на все элементы конституции, которые подтверждают письменные пожелания покойного основателя. Это была мощная и трогательная презентация, хотя оппозиция попыталась возразить, заявив, что правительство не представило полный отчет о пожеланиях любимого Квади Азама."
 PAK_Religous_Upheaval.13.d: "После продолжительных дебатов правительство предложило новый закон о защите меньшинств, чтобы гарантировать права немусульманских граждан в стране. Более того, закон предусматривает более строгое наказание для тех, кто признан виновным в насильственном обращении немусульман. Похоже, что это предложение пройдет легко и станет серьезным ударом для религиозных протестов. В частном порядке оппозиция обратилась к правительству, они хотят отозвать законопроект в обмен на прекращение протестов. Это было бы большой победой, но некоторые советники настаивают на принятии законопроекта. Они отмечают, что это предложение показывает слабость протестующих, и правительство должно использовать это преимущество сейчас"
 PAK_Religous_Upheaval.14.d: "Комитет, состоящий из членов правительства и оппозиции, представил отчет об изменении формулировок некоторых элементов конституции. Эти изменения планируют подчеркнуть важность ислама для народа Пакистана. Более того, теперь конституция будет начинаться с исламских призывов. Против этих предложений выступают секуляристы, но они составляют явное меньшинство. Даже члены парламента, симпатизирующие светским идеалам, поддерживают эти меры, поскольку они не меняют коренным образом содержание и не добавляют новых поправок."
 PAK_Religous_Upheaval.15.d: "Похоже, усилия по сближению с оппозицией и протестующими религиозными партиями приносят свои плоды. Недавнее решение парламента инициировать некоторые изменения, чтобы приблизить правительство к исламскому характеру, получило высокую оценку. В настоящее время есть члены оппозиции, поддерживающие инициативу правительства в этом вопросе. Более того, некоторые из наиболее популярных религиозных лидеров призывают своих сторонников прекратить кампанию протеста в связи с происходящими изменениями."
 PAK_Religous_Upheaval.16.d: "Наши усилия по удовлетворению требований религиозных протестующих и оппозиции не дают желаемого эффекта. Наши последние усилия воспринимаются как поверхностные. Лидеры протеста утверждают, что правительство вводит общественность в заблуждение и не идет достаточно далеко в своих предложениях. Все чаще звучит мнение, что правительство хочет обмануть общественность, делая вид, что оно заботится о проведении настоящих исламских реформ."
 PAK_Religous_Upheaval.17.d: "Предыдущие попытки принять антиалкогольные или антиигорные законы часто не доходили до голосования. Многие в Национальном собрании рассматривали вопрос употребления алкоголя как частное дело отдельных людей, не требующее законодательного регулирования. Сопротивление расширению антиигорных законов колониальной эпохи было обусловлено экономическими соображениями. В стране существуют казино и планируется строительство новых казино, которые будут обслуживать иностранных туристов. Принятие строгих законов об азартных играх нанесло бы ущерб этим усилиям. Однако недавние национальные протесты исламских религиозных лидеров убедили правительство в том, что эти вопросы важны для народа. На рассмотрении находится предложение о принятии всеобъемлющего запрета на употребление и продажу алкоголя мусульманской общине Пакистана. Кроме того, есть законопроект о расширении антиигорных законов колониальной эпохи, хотя и с исключениями для иностранцев."
 PAK_Religous_Upheaval.18.d: "Совместный комитет оппозиции и правительства недавно изучил предложение о новом законопроекте под названием \"Закон о шариатском суде\". Это удовлетворило бы требования мусульманских религиозных лидеров по всей стране. Законопроект предусматривает создание нового Федерального шариатского суда, судьями которого будут ведущие улемы. Этот суд будет рассматривать все предлагаемые законы и определять, соответствуют ли они исламским принципам или нет. Если нет, то законопроект должен быть отозван. Правительство выступило против этого предложения, предложив, чтобы Федеральный шариатский суд не блокировал законопроекты, а давал заключение по предлагаемому законодательству. Премьер-министр должен выбрать, какой законопроект поддержать."
 PAK_1977_Elections.1.d: "Всеобщие выборы 1977 года стали первыми выборами в соответствии с новой конституцией. Ожидается, что явка избирателей будет высокой, так как ПНП начала агрессивную кампанию по привлечению избирателей. Оппозиционные партии объединились в Пакистанский национальный альянс под руководством известного оппозиционного политика и антиколониального активиста Хана Абдул Вали Хана. В преддверии голосования лидер ПНА Зульфикар Бхутто проводил публичные митинги по всей стране, чтобы расширить базу поддержки ПНА. ПНА использовала свой альянс региональных и религиозных партий, чтобы начать кампанию на низовом уровне, осуждая ПНП за коррупцию и катастрофическую экономическую политику. Это была ожесточенная кампания, в ходе которой обе стороны обменивались резкими обвинениями в адрес друг друга."
 PAK_1977_Elections.2.d: "Очевидно, что ПНП получит большинство мест на выборах, обеспечив Зульфикару Бхутто еще один срок в качестве премьер-министра. Оглядываясь назад, становится ясно, что ПНП, скорее всего, выиграет у ПНА, которая не смогла предложить конкретный план управления Пакистаном. В избирательную ячейку ПНП поступают звонки от некоторых членов партии, которые отмечают, что есть несколько мест с близкой конкуренцией. Они просят разрешения помочь кандидатам ПНП выиграть эти места, и тогда мы сможем войти в парламент с супербольшинством и не сталкиваться с тактикой затягивания со стороны оппозиции. Это значительно ускорит реализацию платформы ПНП и превращение Пакистана в исламское социалистическое государство, которым он всегда должен был стать."
 PAK_1977_Elections.3.d:0 "Дипломатическая телеграмма от посла США в Пакистане: \"Дипломатическая телеграмма от посла США в Пакистане: \"Меня пригласили посмотреть результаты выборов вместе с премьер-министром Зульфикаром Бхутто в его резиденции. Как только телевизионные трансляции подтвердили, что ППС получит большинство голосов, в зале воцарилось ликование, и всем присутствующим были розданы напитки. Однако в течение часа настроение премьер-министра изменилось. Он видел результаты, свидетельствующие о том, что кандидаты от ППС завоевывают места с огромным отрывом и собираются получить подавляющее большинство в парламенте. Премьер-министр пробормотал проклятия и удалился в свой кабинет, где было слышно, как он проклинал лидеров своих избирательных ячеек за то, что они слишком усердствовали в обеспечении подавляющего большинства. Он вернулся в партию, но тихо пил и выглядел смущенным, поскольку результаты ясно указывают на то, что во время выборов имели место фальсификации...\""
 PAK_Contested_Elections.1.d: "Всеобщие выборы 1977 года были омрачены противоречиями. Результаты выборов с подозрительным перевесом голосов и получением большого количества мест ПНП привели к активизации оппозиции и ПНА. Многие наблюдатели считают, что ПНП действительно получила большинство, но ее усилия по обеспечению полной победы не оправдались и привели все выборы к хаосу. ПНА возглавляет массовые протесты, забастовки и беспорядки, требуя отставки правительства и проведения новых выборов. Премьер-министр Бхутто критикует ПНА за то, что они смущены своими плохими результатами, и осуждает их за подрыв нации только для того, чтобы набрать политические очки. ПНА заявляет, что будет бойкотировать Национальное собрание и собрания провинций до тех пор, пока правительство не уйдет в отставку и не будут проведены новые выборы под контролем Верховного суда."
 PAK_Contested_Elections.2.d: "Мы создали Федеральные силы безопасности, чтобы иметь военизированные силы, лояльные премьер-министру и подчиняющиеся его приказам. С момента основания мы обеспечили ФСБ всем необходимым оружием и предоставили их сотрудникам лучшие льготы, чем даже военным. Мы укомплектовали их офицерский состав лоялистами и офицерами армии, уволенными в отставку за непригодность к службе в этом учреждении. В связи с ростом беспорядков после результатов выборов советник по национальной безопасности предлагает разместить ФСБ в крупных городах, чтобы уменьшить постоянные уличные протесты. Некоторые советники опасаются, что развертывание ФСБ может только разжечь протестующих и привести к обратному результату."
 PAK_Contested_Elections.3.d: "Батальоны Федеральных сил безопасности, развернутые в крупных городах, сумели уменьшить уличные протесты, организованные оппозицией. Хотя международная пресса и те СМИ, которые симпатизируют оппозиции, критикуют жесткость подавления, оно увенчалось успехом. Войска ФСБ и их офицеры выполняют свои обязанности с рвением и преданностью. Единственное, о чем мы слышали, это то, что подразделения военной полиции, расположенные поблизости, отказались оказать какую-либо поддержку ФСБ, несмотря на приказ оказать помощь в восстановлении правопорядка."
 PAK_Contested_Elections.4.d: "Батальоны Федеральных сил безопасности, развернутые в крупных городах, были в основном вытеснены и вынуждены вернуться в свои казармы. Во многих случаях, когда войска ФСБ пытались разогнать протестующих, на улицы выходило гораздо больше людей, которые подавляли наши войска. Похоже, что наши силы ФСБ были плохо подготовлены к контролю над улицами, и их офицеры часто паниковали. Еще большее беспокойство вызывают слухи о том, что когда ФСБ попросил подкрепления у местной полиции, оно так и не появилось. Когда наши представители обратились в местную полицию за объяснениями, они были туманны, и мы подозреваем, что местные военные командиры угрожали полиции не вмешиваться."
 PAK_Contested_Elections.5.d: "Пакистанские рейнджеры - крупнейшее военизированное подразделение в Пенджабе и Синде. Они хорошо обучены, оснащены и укомплектованы офицерами пакистанской армии. Наши лучшие советники по безопасности считают, что нельзя просить рейнджеров подавлять протесты оппозиции. Однако общественные волнения вызвали всплеск краж, грабежей и других преступлений. Преступные группировки пользуются возможностью пошалить. Премьер-министр может попросить министра внутренних дел отдать приказ о развертывании рейнджеров. Некоторые советники по безопасности призывают нас воздержаться от обращения к рейнджерам, поскольку мы не можем быть уверены, что их офицеры будут добросовестно выполнять приказы."
 PAK_Contested_Elections.6.d: "Министр внутренних дел приказал пакистанским рейнджерам развернуть силы и помочь правоохранительным органам в борьбе со всплеском преступлений. Хотя рейнджеры подчинились приказу и установили блокпосты, похоже, они не добились существенных изменений. Преступность по-прежнему разгулялась, и теперь мы слышим жалобы на то, что правительство совершенно неэффективно борется с этой новой волной преступности. Похоже, что армейские офицеры, командующие подразделениями рейнджеров, прилагают очень мало усилий для выполнения своих приказов. Они делают вид, что подчиняются директивам, но ничего не делают."
 PAK_Contested_Elections.7.d: "Министр внутренних дел приказал пакистанским рейнджерам развернуть подразделения и помочь правоохранительным органам в борьбе со всплеском преступности. Рейнджеры добросовестно выполнили приказ. Рейнджеры взяли штурмом укрытия предполагаемых преступников и установили стратегические контрольно-пропускные пункты. Это привело к большому количеству арестов и конфискации незаконного оружия и наркотиков. Также было уничтожено около десятка незаконных игорных притонов. СМИ положительно освещают эти действия, и волна преступности постепенно спадает. Однако оппозиционные газеты ставят в заслугу армии, а не правительству, независимо от этого, повышение безопасности граждан поможет нам в наших усилиях по восстановлению порядка."
 PAK_Contested_Elections.8.d: "Протесты ПНА и вызванные ими беспорядки создали огромные трудности для правительства. Ситуация с правопорядком в стране продолжает ухудшаться, и на международном уровне существуют опасения, что Пакистану грозит гражданская война. По нашим данным, ПНА открыта для проведения переговоров. Хотя они продолжают оказывать давление на правительство, их коалиция всегда была шаткой, поскольку многие различные партии пытались работать вместе. Их руководство считает, что решение должно быть принято в ближайшее время. Кабинет министров предлагает премьер-министру провести переговоры, однако некоторые другие советники считают, что правительство должно просто держаться и ждать, пока усилия ПНА окончательно не сойдут на нет."
 PAK_Contested_Elections.9.d: "Зульфикар Бхутто направил своих ближайших советников для проведения переговоров с руководством ПНА, чтобы найти решение беспорядков. ПНА возмущена недавними выборами, утверждая, что они были массово сфальсифицированы в пользу ПНП. Однако в частном порядке ПНА понимает, что ПНП остается популярной партией с влиятельными кадрами по всей стране. Они готовы принять предложение о проведении новых выборов под руководством временного правительства технократов. Единственный вопрос - как скоро провести выборы. Хотя окончательное решение еще не принято, похоже, что переговоры идут по правильному пути, а риторика лидеров ПНА на митингах стала менее резкой."
 PAK_Contested_Elections.10.d: "Зульфикар Бхутто направил своих ближайших советников для проведения переговоров с руководством ПНА, чтобы найти решение для беспорядков. ПНА возмущена недавними выборами, утверждая, что они были в значительной степени сфальсифицированы в пользу ПНП. Однако переговоры зашли в тупик по нескольким причинам. Представителям ПНА трудно представить единую позицию, так как она состоит из множества партий и интересов. Участники переговоров ПНП не хотят признавать, что их партия не получила бы большинства без большинства. Поскольку стороны не могут договориться даже о базовом уровне, переговоры в основном ни к чему не приводят. Это только раззадорило руководство ПНА, которое в ответ усилило свою риторику, особенно в отношении бастующих рабочих."
 PAK_Contested_Elections.11.d: "Министр информации доложил премьер-министру Бхутто, что его переговоры с представителями крупных газет не были обнадеживающими. Он подчеркнул газетам, что они должны сыграть свою роль в оказании помощи правительству в сдерживании беспорядков. Однако большинство изданий настаивают на том, что они будут только сообщать новости и не обязаны печатать сообщения, благоприятные для правительства. Единственной хорошей новостью является то, что руководство СМИ также добавило, что им не особенно нравятся некоторые элементы в ПНА, и если появятся какие-либо признаки положительных изменений, они будут сообщать об этом в полном объеме, хотя они и не будут следовать диктату правительства, они осознают тяжелую ситуацию, в которой находится страна."
 PAK_Contested_Elections.12.d: "Сообщения СМИ в последние дни были в основном позитивными. Инсайдерские источники из ПНА и ПНП просачивают информацию о том, что недавние переговоры были позитивными, и на горизонте появляется консенсус. Вместе с этими новостями газеты также осуждают беззаконие и особенно раскольнические речи некоторых из наиболее радикальных лидеров ПНА. Это оказывает успокаивающее воздействие на население, и в воздухе витает новое чувство оптимизма, которое освежает. Премьер-министр Бхутто созвал своих советников и настаивает на том, чтобы они продолжали подталкивать страну к примирению и стабильности."
 PAK_Contested_Elections.13.d: "Сообщения СМИ в последние дни были в основном негативными. Инсайдерские источники, особенно из ПНА просочились новости о том, что переговоры с ПНП ни к чему не приведут. Эти новости только усилили напряженность в стране и подтолкнули врагов правительства к критике ПНП за стремление превратить Пакистан в однопартийную диктатуру. Министр внутренних дел дал указание местным властям конфисковывать и закрывать газеты, считающиеся подстрекающими к беспорядкам, но это не выполняется в полной мере. Кроме того, это вызвало новые протесты со стороны тех, кто утверждает, что правительство вводит цензуру."
 PAK_Contested_Elections.14.d: "Премьер-министр Зульфикар Бхутто объявил, что после переговоров ПНП и ПНА договорились о решении спорных выборов. Бхутто отметил, что он и его высшее партийное руководство не знали о каких-либо нарушениях во время последних выборов, но отметили, что на избирательных участках могли возникнуть проблемы из-за чрезмерного усердия активистов. Он подчеркнул, что ПНП нечего терять, так как они являются голосом народа, и он с нетерпением ждет новых выборов. Руководство ПНА провело собственную пресс-конференцию и отметило, что через три месяца будут проведены новые выборы, и похвалило народ Пакистана за его борьбу за восстановление демократии в стране. Вскоре после этого премьер-министр Бхутто подал в отставку и передал власть временному правительству, состоящему из нейтральных технократов, которое будет управлять страной до проведения выборов. Многие в стране приветствуют возвращение к нормальной жизни."
 PAK_Contested_Elections.15.d: "После трех месяцев активной предвыборной кампании народ Пакистана снова голосует. Ожидается высокая явка, поскольку Пакистан должен сделать выбор между ПНП и ПНА. ПНП обвинили в фальсификации последних выборов, однако ее руководство настаивает на том, что эти обвинения преувеличены, и ради блага нации они согласились на новые выборы. Лидер ПНА Зульфикар Бхутто уверенно заявил журналистам, что он не сомневается в проведении новых выборов, поскольку ПНА является голосом народа. Руководство оппозиции ПНА также выразило оптимизм, заявив, что именно они и народ заставили ПНП восстановить демократию в стране. Они вели предвыборную кампанию, обещая создать более исламское государство, которое лучше отражает желания всех пакистанцев, а не только тех, кто живет в городах. Критики опасаются, что коалиция ПНА может оказаться слишком громоздкой для управления страной, но они возглавили национальные протесты против результатов последних выборов и пользуются благосклонностью многих наблюдателей."
 PAK_Contested_Elections.16.d: "Генерал Зия уль-Хак и его высшие генералы начали операцию по отстранению от власти премьер-министра Зульфикара Бхутто и введению военного положения на всей территории Пакистана. Пакистанцы в столице и крупных городах, проснувшись, обнаружили, что вооруженные войска заняли ключевые правительственные здания и окружили дома высокопоставленных чиновников. Сам генерал Зия встретился с Зульфикаром Бхутто и настоял на том, что эти меры временные и будут действовать только до восстановления порядка. Теперь уже бывшего премьер-министра на время перевезли на виллу, расположенную на популярной горной станции. В своем обращении к нации генерал Зия подчеркнул, что армия действовала только для сохранения целостности и единства Пакистана."
 PAK_Contested_Elections.17.d: "Пообещав провести новые выборы, военное правительство освободило бывшего премьер-министра Бхутто только после того, как он пообещал не подрывать режим и признал, что понимает необходимость переворота. Однако после освобождения Бхутто путешествует по стране по железной дороге, выступая перед массовыми толпами людей. В своих выступлениях он осуждает военный переворот и требует скорейшего проведения выборов. Он также пообещал, что когда он вернется к власти, те, кто нарушил конституцию, поддержав переворот, будут наказаны. Эти выступления будоражат массы и подрывают генерала Зия, который пытается объединить страну."
 PAK_Contested_Elections.18.d: "В знаковом постановлении Верховный суд принял аргумент о том, что генерал Зия уль-Хак должен был совершить переворот в силу доктрины необходимости. Это решение узаконивает захват власти военными и прекращает призывы к преследованию военных офицеров за нарушение конституции, которая конкретно запрещает свержение любого избранного правительства. Критики военного режима, особенно лидеры ПНП, осуждают это решение, утверждая, что на судей неправомерно влияют военные, чтобы они вынесли решение в их пользу. Генерал Зия в своем собственном заявлении приветствовал решение суда как доказательство законности его действий."
 PAK_Contested_Elections.19.d: "Режим военного положения официально выдвинул обвинения против бывшего премьер-министра Зульфикара Бхутто и арестовал его. Ахмед Раза Касури обвиняет Бхутто в убийстве своего отца, погибшего в результате неудачного покушения, которое якобы организовал Бхутто. Бхутто отрицает обвинения, считая их политически мотивированными. Ожидается, что судебный процесс начнется через месяц в Высоком суде Лахора. Адвокаты, представляющие интересы Бхутто, отметили, что нет никаких доказательств, кроме показаний свидетелей, которые в лучшем случае сомнительны. Правительство в ответ заявило, что у обвинения есть веские основания, а в Пакистане никто не стоит выше закона."
 PAK_Contested_Elections.20.d: "Начался суд над Зульфикаром Бхутто. Бывший премьер-министр обвиняется в организации покушения на семью Касури. Говорят, что Бхутто уверен в себе, так как он собрал высококлассный юридический состав. Однако быстро становится ясно, что судьи настроены против Бхутто, поскольку они постоянно отклоняют возражения защиты и разрешают давать показания свидетелям, которые отказались от показаний после того, как были задержаны военными властями. Бхутто говорит всем, кто его слушает, что как только он снова выйдет из тюрьмы, он накажет тех, кто замешан в этих судебных делах, и генерала Зиа. Со своей стороны, генерал Зия настаивает на том, чтобы не делать никаких заявлений и оставить этот вопрос на усмотрение суда."
 PAK_Contested_Elections.21.d: "Высокий суд Лахора вынес вердикт по делу Зульфикара Бхутто. Бхутто был признан невиновным в непосредственном совершении нападения на семью Касури, но из-за его связи с заговором суд приговорил его к смертной казни. Почти сразу же адвокаты Бхутто осудили это решение и призвали Верховный суд Пакистана отменить смертный приговор. Как адвокаты защиты, так и международные наблюдатели отметили, что судебный процесс был в значительной степени нерегулярным и предвзятым по отношению к Бхутто. Судьи выбросили доказательства, представленные защитой, и опустошили зал суда, когда Бхутто попросила слова. Многие пакистанцы считают, что генерал Зия-уль-Хак и его военный режим оказывают закулисное влияние на судебный процесс. Разгневанные толпы сторонников ПНП вышли на улицы в ответ. Генерал Зия объявил, что ему придется отложить запланированные выборы, пока не будет обеспечен закон и порядок."
 PAK_Contested_Elections.22.d: "Спустя девять месяцев Верховный суд Пакистана постановил оставить в силе смертный приговор, вынесенный Зульфикару Бхутто. Решение было принято со счетом 4-3 на фоне обвинений в том, что судьи контролируются военным режимом генерала Зия-уль-Хака. Адвокаты Бхутто отмечают, что многие из судей напрямую связаны с Зией. Они также утверждают, что длительность рассмотрения апелляции также является отражением вмешательства правительства. Кроме того, военный режим издал указ о запрете на ответную реплику, написанную Бхутто против своих обвинений. Наконец, Верховному суду потребовалось несколько месяцев, чтобы рассмотреть дело, причем многие пакистанцы считали, что задержка была вызвана тем, что большинство судей выступали за оправдательный приговор. Только после того, как Зия убедился, что достаточное количество судей поддержат обвинительный приговор, он разрешил продолжить процесс. Несмотря на смертный приговор, адвокаты подали новые апелляции и призывают друзей Бхутто потребовать, чтобы приговор, по крайней мере, был заменен на пожизненное заключение."
 PAK_Contested_Elections.23.d: "Генерал Зия уль-Хак заявил, что он слуга судов и его правительство вершит правосудие, после известия о том, что Зульфикар Бхутто был казнен в Равалпинди рано утром. Казнь состоялась, несмотря на мольбы многих международных лидеров и видных пакистанских деятелей. Такие страны, как Саудовская Аравия и Иордания, обещали принять Бхутто в изгнании. Однако генерал Зия был невозмутим, и как только апелляции были удовлетворены, казнь была приведена в исполнение. Пакистан, как говорят, находится в состоянии покоя, большинство граждан ошеломлены новостью о том, что харизматичного лидера популярной партии ПНП больше нет. Многие лидеры ПНП поклялись отомстить, а ряд ведущих организаций осудили эту акцию. Однако аналитики отмечают, что генерал Зия давно пришел к выводу, что если он оставит Бхутто в живых, то рискует собственной жизнью, поскольку Бхутто давно обещал наказать генералов, совершивших переворот, и оставался популярным национальным лидером. Оппозиция на будущих выборах также низка."
 PAK_Contested_Elections.24.d: "Решение военных выдвинуть обвинения против Зульфикара Бхутто спровоцировало молодых левых, особенно студентов университетов, начать организовываться в ячейки сопротивления. Многие из этих молодых людей бегут из городов на холмы Белуджистана, чтобы укрыться среди исторически независимых племенных народов. Хотя сопротивление формально не создало руководящей структуры, его сторонники называют себя борцами за Аль-Зульфикара. Они требуют восстановления демократии и наказания тех, кто ее извращает."
 PAK_Contested_Elections.25.d: "Сторонники движения «Аль-Зульфикар» подтвердили, что организация, по сути, прекратила свою деятельность. Судя по всему, между старшими лидерами за рубежом шла ожесточенная борьба за власть. Многие члены, опасаясь репрессий, предпочли вернуться на родину. Движение «Аль-Зульфикар» не смогло разработать последовательное послание или расширить свою базу за пределы левых студентов университетов. Организация совершила несколько нападений, но не смогла бросить реальный вызов пакистанским военным. Несколько попыток совершить крупные нападения на военные посты Пакистана закончились большими потерями для повстанцев. Вернувшиеся члены организации обвиняют пакистанские спецслужбы в том, что они спровоцировали недавнюю напряженность в руководстве, распространяя ложные слухи."
