 Project_706.1.d: "Недавнее индийское ядерное испытание полностью изменило региональный баланс сил. Индия приблизила угрозу атомного уничтожения к нашим порогам. На секретном совещании высших военных-гражданских лиц и офицеров разведки было принято решение об активации проекта 706. Целью проекта 706 является достижение потенциала ядерного оружия. Правительство обещало обеспечить все финансовые потребности, а военные будут следить за объектами и безопасностью. Наша ведущая разведывательная служба будет искать по всему миру пакистанских ученых, которые могут быть полезны для программы. Они обратятся к патриотизму офицеров и организуют их возвращение домой."
 Project_706.2.d: "Физик-ядерщик Абдус Салам - главный атомный эксперт в стране. В настоящее время он работает в Университете Куайд-и-Азам, возглавляя группу пакистанских физиков для решения проблем в этой области. Патриотичный, интеллигентный пакистанец, он является естественным выбором для того, чтобы взять на себя ведущую роль в проекте 707. Некоторые высокопоставленные военные и офицеры разведки медлят. Они, естественно, не хотят передавать полномочия гражданскому ученому, но, что более важно, Абдус Салам является членом противоречивой общины Ахмади. Многие пакистанцы считают ахмадитов вероотступниками и не совсем мусульманами. Однако премьер-министр Зульфикар Бхутто отверг все опасения, настаивая на том, что программа имеет первостепенное значение для выживания нации, и каждый пакистанец, способный помочь проекту, должен быть использован."
 Project_706.3.d: "Правительство одобрило создание Комитета по ядерному оружию. Эта секретная группа будет проводить встречи и координировать работу различных ведомств, занимающихся исследованиями в области ядерного оружия. В ее состав входят военные офицеры, сотрудники разведки, государственные служащие и ученые. Хотя некоторые ведущие ученые выразили обеспокоенность тем, что комитет может помешать исследованиям из-за противоречивых планов его членов, правительство считает, что это наилучший путь вперед. Аппарат безопасности дал понять, что хочет полного надзора, даже в ущерб научному прогрессу. Члены комитета проходят тщательную проверку, чтобы убедиться, что они не просто лояльны, но и послушны командованию."
 Project_706.4.d: "В ходе смелой разведывательной операции наши агенты и иностранная служба успешно вывезли доктора Абдул Кадыр Хана из Нидерландов. Доктор А.К. Хан, инженер-ядерщик, работал на атомной электростанции, тайно предоставляя Проекту 706 информацию о центрифугах. Он также настаивал на том, чтобы правительство рассмотрело возможность использования урана вместо плутония. Он оказался очень убедительным, и теперь, когда он вернулся домой, он будет играть важную роль для Проекта 706. Уже разрабатываются планы по предоставлению ему лаборатории и команды, чтобы он мог реализовать свое урановое предложение. Доктор А.К. Хан ранее не был идентифицирован проектом, но он обратился к нашему послу в Нидерландах, чтобы предложить свои услуги из патриотического долга."
 Project_706.5.d: "Доктор Мунир Ахмад Хан, искусный организатор и ученый, взял на себя роль куратора проекта 706. В настоящее время он является главой Комиссии по атомной энергии Пакистана. Он координирует работу всех научных групп, работающих над проектом. В последние месяцы он начал непосредственно координировать приобретение приборов, элементов и других важных материалов, необходимых для реализации программы. Он особенно талантлив для этой работы. Кроме того, он хорошо работает с военными, объясняя им, как достигается прогресс и почему требуются те или иные материалы."
