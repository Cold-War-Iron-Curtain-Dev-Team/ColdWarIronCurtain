l_english:
 Islamabad.1.d: "Карачи является столицей Пакистана с 1947 года. Однако в последующие годы в город хлынул большой поток беженцев и жителей, быстро превратившись из сонного портового города в мегаполис. Правительству все труднее найти достаточно места для удовлетворения своих потребностей или размещения бюрократов, необходимых для функционирования государства. Карачи, главный коммерческий центр страны, также ставит политиков очень близко к деловым интересам, что со временем может привести к нарушениям. Погода в Карачи также сурова, особенно летом, когда температура достигает палящих высот. Его удаленность от штаба в Равалпинди и опасения по поводу его обороноспособности также вызывают беспокойство. После тщательного рассмотрения высокопоставленной комиссии экспертов было поручено обследовать Пакистан, чтобы найти подходящее место для новой столицы."
 Islamabad.2.d: "Недавно созданная комиссия, которой поручено найти район для строительства новой столицы страны, опубликовала свой отчет. Она определила участок земли к северо-востоку от Равалпинди. Это место легко доступно, не застроено и находится в идеальных погодных условиях. За исключением нескольких деревень, эта территория созрела для быстрого развития и строительства, необходимого для возведения столицы. Территория географически защищена от вражеских вторжений, а ее расположение рядом с Главным штабом укрепит сотрудничество между гражданскими и военными. Превращение этой земли в федеральную столицу потребует времени, и в настоящее время планируется временно перевести правительство в Равалпинди, прежде чем оно утвердится в новой столице, которая будет называться Исламабад. Хотя правительство утверждает, что новое местоположение сделает его легкодоступным для всех пакистанцев, есть жалобы на то, что новая столица в основном благоприятствует северным пакистанцам и военным."
 Islamabad.3.d: "Сегодня, в двадцатую годовщину независимости, правительство Пакистана официально переехало в свою новую столицу Исламабад. Правительство заключило контракт с греческой архитектурной фирмой на проектирование столицы, а за строительством будут наблюдать высокопоставленные федеральные и военные чиновники. Многие наблюдатели отмечают приятную планировку города, вершиной которой служат захватывающие дух Маргала Хилс. Пакистанские чиновники восторженно хвалят чистоту и организованность нового города. Эксперты считают, что город быстро привлечет множество пакистанцев, жаждущих новых возможностей. Помимо своей открытости и умеренного климата, город тесно связан с Равалпинди, где находится штаб-квартира Генерального штаба. Хотя горожане испытывают большую гордость, есть опасения, что новая столица в подавляющем большинстве случаев выгодна военным и тем общинам, из которых они в основном вербуются."
