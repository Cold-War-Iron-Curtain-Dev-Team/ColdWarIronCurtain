l_russian:
  
 CUB_50s_1945_the_1948_cuban_election: "Кубинские выборы 1948 года."
 CUB_50s_1945_the_1948_cuban_election_desc: "Пришло время Кубе сделать свой выбор!"
 CUB_50s_grau_adminstration: "Администрация Грау"
 CUB_50s_grau_adminstration_desc: "Несмотря на свое первое избрание в 1944 году, Рамону Грау еще многое предстоит сделать, чтобы полностью завершить свой последний президентский срок в Республике Куба."
 CUB_50s_the_hun_days: "Правительство 'Ста дней'-Gobierno de los Cien Días"
 CUB_50s_the_hun_days_desc: "Администрацию Грау обычно называли правительством «Ста дней», которое представляло единство, требуемое быть достигнутым в более широком масштабе."
 CUB_50s_the_continuation_of_natpro: "Продолжение прогрессивных реформ"
 CUB_50s_the_continuation_of_natpro_desc: "Нынешняя администрация выступает за прогрессивные реформы, в рамках которых наше правительство должно обеспечить будущие поколения кубинского народа для Кубы."
 CUB_50s_support_for_natpro: "Аутентичность требует избирательной географии"
 CUB_50s_support_for_natpro_desc: "Чтобы не рисковать смертью наследия нашей великой партии, нам нужно постепенно увеличивать влияние, которое мы имеем на кубинское государство!"
 CUB_50s_junta_start: "Офицеры-мятежники"
 CUB_50s_junta_start_desc: "С тех пор, как наше правительство одобрило выборы, наш режим потерял доверие общественности, поскольку авторитет нашего режима дохнет как  муха. Даже многие наши работающие граждане и военнослужащие взяли в руки оружие."
 CUB_50s_focus_against_the_conservatives: "Цель войны против консерваторов"
 CUB_50s_focus_against_the_conservatives_desc: "Консерваторы полностью виноваты в коррупции царящей в нашей стране, и поэтому нам нужно выступить против традиционалистов и их идеалов!"
 CUB_50s_focus_against_the_liberals: "Цель войны против либералов"
 CUB_50s_focus_against_the_liberals_desc: "Либералы были причиной того, что наша нация сплотилась с нами в восстании 1933 года. Чтобы получить одобрение людей, наши идеалы должны быть сохранены для общего блага."
 CUB_50s_perform_rallies_in_southern_cuba: "Устроить митинги в южной Кубе"
 CUB_50s_perform_rallies_in_southern_cuba_desc: "Наш политический истеблишмент нуждается в большей поддержке на юге страны для того, чтобы показать им истинную демократию."
 CUB_50s_support_from_the_republican_party: "Поддержка Республиканской партии"
 CUB_50s_support_from_the_republican_party_desc: "Приглашение от Республиканского национального комитета в Соединенных Штатах предложило нам финансовую помощь в борьбе против нашей оппозиции-либералов, которую поддерживает Демократическая партия Соединенных Штатов. Мы должны принять их помощь для большего процветания нашего истеблишмент."
 CUB_50s_raise_the_minimum_wage: "Поднять минимальную заработную плату"
 CUB_50s_raise_the_minimum_wage_desc: "Низшие классы Кубы страдают от ограниченной заработной платы, которая должна быть доступна для всех рабочих."
 CUB_50s_establish_longer_working_periods: "Увеличить длину рабочего дня"
 CUB_50s_establish_longer_working_periods_desc: "Данный новопринятый закон позволит кубинским рабочим работать дольше, чтобы получать необходимую им оплату."
 CUB_50s_nationalization_of_the_cuban_electric_industry: "Национализация кубинской электротехнической промышленности"
 CUB_50s_nationalization_of_the_cuban_electric_industry_desc: "Кубинская электротехническая промышленность должна оставаться национальной до падения нашего истеблишмента!"
 CUB_50s_automony_to_the_university_of_havanna: "Автономия Университета Гаваны"
 CUB_50s_automony_to_the_university_of_havanna_desc: "Гаванский университет очень давно искал автономию. Пора партии Partido Auténtico исполнить это желание."
 CUB_50s_limit_militaristic_control: "Ограничьте контроль военных над Конгрессом"
 CUB_50s_limit_militaristic_control_desc: "Военные много сделали для Кубы, но кубинским вооруженным силам пора держаться подальше от политики и вместо этого защищать нашу нацию."
 CUB_50s_appease_the_armed_forces: "Умиротворение вооруженных сил"
 CUB_50s_appease_the_armed_forces_desc: "Мы не можем рисковать смертью демократии, чтобы удовлетворить нашу повестку, вместо этого вооруженным 'крестоносцам' нужно отдохнуть перед войной с Республикой Куба."
 CUB_50s_supposed_unity: "Предлагаемое единство"
 CUB_50s_supposed_unity_desc: "Ради надежды на истинный кубинский суверенитет, вооруженные силы должны быть умиротворены в любом случае, чтобы предотвратить появление любой военной хунты в ближайшем будущем."
 CUB_50s_split: "Раскол в партии Partido Auténtico"
 CUB_50s_split_desc: "Партия Partido Ortodoxo откололась от партии Partido Auténtico, хотя у них одни и те же идеалы; Partido Ortodoxo считает, что аналогичные проблемы возникли у американцев со законопроектами, которые издавались в Америке."
 CUB_50s_victory_for_the_socialists: "Социалистическая победа!"
 CUB_50s_victory_for_the_socialists_desc: "Удивительно, но кубинские социалисты набрали большинство голосов."
 CUB_50s_an_authentic_: "CUB_an_authentic_"
 CUB_50s_an_authentic_victory: "Победа Partido Auténtico!"
 CUB_50s_an_authentic_victory_desc: "Как и ожидалось, партия Partido Auténtico  получила большую поддержку на всеобщих выборах, таким образом выиграв праймериз!"
 CUB_50s_victory_for_cuban_liberal: "Победа Кубинского либерализма!"
 CUB_50s_victory_for_cuban_liberal_desc: "Неожиданно, Либеральная партия благодаря поддержке Демократической партии США выиграла выборы с небольшим отрывом!"
 CUB_50s_increase_taxes: "Повысить налоги"
 CUB_50s_increase_taxes_desc: "Налогообложение - это то, что заставляет страны выделять больше средств на проекты и проекты общественных работ."
 CUB_50s_government_control: "Увеличить государственный контроль"
 CUB_50s_government_control_desc: "Правительство должно быть в состоянии заботиться о своих людях."
 CUB_50s_meeting_with_dp: "Встреча с Демократической партией"
 CUB_50s_meeting_with_dp_desc: "Демократы Соединенных Штатов стремятся к тому, чтобы наша партия была лидером в кубинской сфере влияния."
 CUB_50s_liberalize_industries: "Либерализация промышленных отраслей страны"
 CUB_50s_liberalize_industries_desc: "Нам нужна индустрии, которые следят за нашей политической повесткой. А также нам нужно предоставить рабочим лучшие условия для продолжения работы!"
 CUB_50s_edu_cuba: "Образование всем кубинцам!"
 CUB_50s_edu_cuba_desc: "Народ Кубы заслуживает образования, чтобы продвигать развитие страны"
 CUB_50s_power_to_the_CNOC: "Сила ПЦТК"
 CUB_50s_power_to_the_CNOC_desc: "ПЦТК или Профсоюзный центр трудящихся Кубы- популярный профсоюз, находящийся под текущим контролем кубинцев. Мы должны дать этой организации силу для необходимого конфликта."
 CUB_50s_nationalize_industries: "Национализация промышленности"
 CUB_50s_nationalize_industries_desc: "Куба снова и снова подвергается нападкам со стороны идеалов империализма Соединенных Штатов. Нам нужно наступить на ногу 'леди Либерти' и национализировать промышленность, которая находится на Кубе."
 CUB_50s_propaganda_encursion: "Агрессивная пропаганда"
 CUB_50s_propaganda_encursion_desc: "Чтобы укрепить власть на Кубе, нам нужна пропаганда, чтобы массы устремили на нас взгляд."
 CUB_50s_remove_private_property: "Отменить частную собственность"
 CUB_50s_remove_private_property_desc: "Чтобы общество процветало, ему нужно отменить границы собственности, чтобы восстановить истинный социализм."
 CUB_50s_proclaim_the_one_party_state: "Провозгласить однопартийное государство"
 CUB_50s_proclaim_the_one_party_state_desc: "Куба должна понять, что ее судьба - освободить рабочих от их угнетателей. Провозглашение распространится на наших соседей и прошлых союзников!"
 CUB_50s_crusade_against_corruption: "Крестовый поход против коррупции"
 CUB_50s_crusade_against_corruption_desc: "Партия Partido Ortodoxo увидела последствия действий партии Partido Auténtico, поскольку они порождают коррупцию, пришедшую из эпохи Батисты. "
 CUB_50s_reformation_of_the_house: "Реформация дома Правительства"
 CUB_50s_reformation_of_the_house_desc: "Куба заслуживает более расширенного правительства, того которое обеспечит волю народа."
 CUB_50s_privatization_of_enterprises: "Приватизация предприятий"
 CUB_50s_privatization_of_enterprises_desc: "Для того, чтобы Куба могла продвигаться вперед, ей необходимо присоединиться к свободному рынку."
 CUB_50s_nationalization_of_cuban_railways: "Национализация кубинских железных дорог"
 CUB_50s_nationalization_of_cuban_railways_desc: "Нам необходимо улучшить нашу инфраструктуру, проектируя ее как инфраструктуру, созданную кубинцами и предназначенную для кубинцев."
 CUB_50s_true_national_identity: "Настоящая национальная идентичность"
 CUB_50s_true_national_identity_desc: "Патриотизм ведет страну к успеху. Разжигание этого новообретенного патриотизма должно принести пользу партии Partido Ortodoxo."
 CUB_50s_the_raise_of_civil_liberties: "Восхваление гражданских свобод"
 CUB_50s_the_raise_of_civil_liberties_desc: "Гражданские свободы делают людей свободными и сильными. Народ должен быть на нашей стороне, если эти свободы защищены."
 CUB_50s_establishment_of_the_national_bank: "Учредить Национальный банк"
 CUB_50s_establishment_of_the_national_bank_desc: "Кубинцам пришлось ненадолго прибегнуть к услугам местных банков. Однако Гаванна должна основать свой первый Национальный банк для существования кубинской мечты."
 CUB_50s_establish_tribunal_accounts: "Учредить Tribunal de Contas da União"
 CUB_50s_establish_tribunal_accounts_desc: "Для того, чтобы удержать политику и экономическую свободу, следует учредить трибуналы для сохранения этого мира с политикой и экономикой."
 CUB_50s_preservation_of_the_ap: "Сохранение партии Partido Auténtico"
 CUB_50s_preservation_of_the_ap_desc: "Для того, чтобы Куба восстала снова; Кубе нужна партия Partido Auténtico, чтобы сохранить те свободы, которые Куба легко потеряет."
 CUB_50s_the_cordial_president: "Президент с добрый сердцем"
 CUB_50s_the_cordial_president_desc: "Карлос Приос имеет репутацию человека, отстаивающего справедливость народа и право народа на свободу на Кубе. "
 CUB_50s_a_new_and_free_cuba: "Новая и свободная Куба"
 CUB_50s_a_new_and_free_cuba_desc: "Куба снова свободна, и впервые в истории американцы практически не контролируют политику Кубы за долгое время!"
 CUB_50s_the_coup: "День в пепле"
 CUB_50s_the_coup_desc: "В этот раз Куба может пойти по пути, который предложит опасные методы для ложных идеалистических мыслей, которые приведут это государство к катастрофе. Батиста должен захватить власть и поспешить на Кубу."
