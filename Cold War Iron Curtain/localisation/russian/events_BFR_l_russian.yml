 BFR.103.d: "После ожесточенных боев в столице Лагоса коммандос из Республики Биафра и Республики Бенин захватили сильно забаррикадированный центр города. Хотя правительственные чиновники Нигерии уже несколько недель назад бежали в северные провинции, это показало, что война для федеративного государства по существу проиграна. Поскольку боевой дух полностью подорван и на данный момент невозможна контроперация, правительство Нигерии согласилось на встрече с Оджукву в нейтральном Кот-д'Ивуаре для прекращении огня."
 BFR.104.d: "Этим днем в нейтральном Кот-д'Ивуаре между [NGA.GetLeader] и C. Odumegwu Ojukwu было подписано соглашение о прекращении огня, положившее конец гражданской войне в Нигерии, что положило конец самому кровавому конфликту в истории Африки. Хотя соглашение предусматривало официальное признание Нигерией, многие крупные страны, такие как Соединенные Штаты и Соединенное Королевство, не были уверены, признают ли они новое государство-преемник. Однако, когда Франция официально признала независимость маленькой нации, остальной мир вскоре последовал за ней, и Биафра присоединилась к Организации Объединенных Наций в качестве официального члена. Теперь мир приветствует новую республику, которую ее жители называют 'Страной восходящего солнца'."
 BFR.105.d: "Первоначально, когда наша Республика продвигалась в дельту Нигера, все выглядело очень многообещающе, поскольку стратегическая ценность ресурсов в регионе была в значительной степени в нашу пользу. Однако сразу же стало ясно, что, когда федеральное правительство Нигерии дышит нам в затылок, этот неэтнический регион игбо не может безопасно быть частью Биафры. Вместо этого доктор Альберт Оконкво убедил Оджукву создать в регионе независимую республику, которая поддержит движение Биафры, а также будет отдельной независимой нацией, которая будет удовлетворять желания местных этнических меньшинств и подаст заявку на членство в ООН."
 BFR.106.d: "Сегодня провозглашена самая молодая нация в мире — Республика Бенин. Задуманный как суверенное государство, признанное ООН, страна была действительно создана правительством Биафры на оккупированной территории, не принадлежащей игбо, чтобы расширить контроль над богатым ресурсами государством в дельте реки Нигер без волнений этнических меньшинств в дельте. Вдохновившись республикой дельты Иджау, провозгласившей независимость несколькими годами ранее, нация пыталась вести пропаганду для себя, которая в основном объединяет людей с делом Биафры и предполагаемой тиранией федерального правительства Нигерии."
 BFR.107.d: "Большая расстрельная команда казнит десятки бывших офицеров Биафры сегодня, когда в маленькой стране произошла серия спорных судебных процессов. Генералов Виктора Банджо и Эммануэля Ифеахуну обвинили в попытке свергнуть правительство и покончить с нацией Биафры, в то время как их защита заключалась в том, что они пытались договориться о прекращении огня с федеральным правительством, поскольку они считали, что преемственность Биафры - тщетность, которая только продолжают вызывать сотни тысяч смертей. Конечно, Оджукву не собирался серьезно относиться ни к одному из этих заявлений и дал согласие на их исполнение после целесообразного судебного разбирательства."
 BFR.108.d: "Патрик Чуквума Нзеогву, один из главных организаторов переворота пяти крупных держав, погиб на этой неделе, защищая Биафру. Нзеогву вернулся в центр страны игбо после своего освобождения накануне гражданской войны из-за того, что Якубу Говон хотел стабилизировать ситуацию в стране, освободив политических заключенных. Возглавляя армию в разведывательной операции, он попал в засаду, и существуют разные версии того, что произошло: одни утверждают, что он погиб в бою, а другие говорят, что он собирался попасть в плен, но покончил жизнь самоубийством, чтобы избежать унижения из-за своей репутации."