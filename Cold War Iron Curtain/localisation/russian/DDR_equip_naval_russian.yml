l_english:
 DDR_screen_hull_heavy_0: "Сторожевые корабли проекта 50"
 DDR_screen_hull_heavy_0_short: "Пр.50 «Горностай»"
 DDR_screen_hull_heavy_0_desc: "Сторожевые корабли проекта 50 типа «Горностай» пришли на замену сторожевикам проекта 42. Корабли этого типа разрабатывались как средние сторожевые корабли для выполнения различных задач, включая патрулирование территориальных вод, обнаружение и уничтожение подводных лодок противника и эвакуацию персонала."
 DDR_screen_hull_heavy_1: "Малые противолодочные корабли проекта 201М"
 DDR_screen_hull_heavy_1_short: "МПК пр.201М"
 DDR_screen_hull_heavy_1_desc: "Малые противолодочные корабли проекта 201М стали самой многочисленной производственной серией кораблей проекта 201. Данный проект был разработан в 1958 году на базе проекта 201К. В 1958–1967 годах различными верфями было выпущено около 160 кораблей этой модификации, из которых немалое количество ушло на экспорт. В ГДР их строительство велось по советской документации и при помощи советских специалистов."
 DDR_screen_hull_heavy_2: "Ракетные катера проекта 151"
 DDR_screen_hull_heavy_2_short: "Пр.151"
 DDR_screen_hull_heavy_2_desc: "Малые ракетные корабли (Kleine Raketenschiffe) проекта 151. Корабли были построены на верфи Пеневерфт в Вольгасте"
 DDR_screen_hull_heavy_3: "Малые противолодочные корабли проекта 133.1"
 DDR_screen_hull_heavy_3_short: "МПК пр.133.1"
 DDR_screen_hull_heavy_3_desc: "Серия малых противолодочных кораблей производства ГДР, относятся к кораблям 3-го ранга. МПК проекта 133.1 предназначались для поиска и уничтожения быстроходных подводных лодок противника, охраны водных районов (в прибрежной и ближней морской зоне), охранения боевых кораблей и конвоев от них, а также несения дозорной службы."
 DDR_screen_hull_heavy_4: "Сторожевые корабли проекта 1159"
 DDR_screen_hull_heavy_4_short: "Пр.1159 «Дельфин»"
 DDR_screen_hull_heavy_4_desc: "Советские сторожевые корабли, относящиеся к кораблям 3-го ранга. В 1960 годах экспорт из СССР сторожевых кораблей малого водоизмещения значительно расширился, что вынудило начать разработку специального экспортного сторожевого корабля. Создание его началось в 1968 в Зеленодольском проектно-конструкторском бюро. При проектировании разработчики учли опыт создания сторожевых кораблей проекта 159 и малых противолодочных кораблей проекта 1124."
 DDR_screen_hull_medium_0: "Класс \"Хабихт\""
 DDR_screen_hull_medium_0_short: "Класс \"Хабихт\""
 DDR_screen_hull_medium_0_desc: "Минные заградители (Minenleg-und-raumschiffe) проект 1 (более поздний проект 1000, класс \"Habicht\")."
 DDR_screen_hull_medium_1: "Класс \"Hai 12.3\""
 DDR_screen_hull_medium_1_short: "Класс \"Hai 12.3\""
 DDR_screen_hull_medium_1_desc: "(U-Boot-Jäger) класс \"Hai 12.3\""
 DDR_screen_hull_medium_2: "Ракетные катера проекта 205"
 DDR_screen_hull_medium_2_short: "Пр.205 «Москит»"
 DDR_screen_hull_medium_2_desc: "Серия советских ракетных катеров. Проект разработан в ЦКБ «Алмаз» по тактико-техническому заданию ВС СССР 1956 года. От производившихся ранее катеров проекта 183Р новые катера отличались стальным корпусом (унифицированным с торпедными катерами проекта 206), усиленным вооружением и повышенной мореходностью. Является логическим продолжением серии проекта 183Р «Комар»."
 DDR_screen_hull_medium_3: "Ракетные катера проекта 1241РЭ"
 DDR_screen_hull_medium_3_short: "Пр.1241РЭ «Молния»"
 DDR_screen_hull_medium_3_desc: "Ракетные катера проекта 1241 предназначались для уничтожения боевых кораблей, транспортов и десантных средств противника, усиления ПВО групп кораблей, транспортов, ракетных и торпедных катеров от низколетящих средств воздушного нападения, прикрытия этих групп от атак лёгких сил противника. Тактически ракетный катер проекта 1241 должен был взаимодействовать с малыми ракетными катерам проекта 205 и прикрывать их от ракетных катеров противника, вооружённых 76-мм артиллерией, для чего ракетный катер должен был обладать скоростью, позволяющей не отставать от катеров проекта 205."
 DDR_screen_hull_medium_4: "Ракетные катера проекта 151-R"
 DDR_screen_hull_medium_4_short: "Пр.151-R"
 DDR_screen_hull_medium_4_desc: "Проект 151-R"