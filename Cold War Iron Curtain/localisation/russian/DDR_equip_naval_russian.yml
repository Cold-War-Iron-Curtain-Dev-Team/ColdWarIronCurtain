l_russian:
  
 DDR_screen_hull_heavy_0: "Kustenschutzschiffe Riga klass"
 DDR_screen_hull_heavy_0_short: "Kustenschutzschiffe Riga klass"
 DDR_screen_hull_heavy_0_desc: "68 кораблей этого типа были построены в СССР на заводах № 445 (имени 61 коммунара) в Николаеве, на судостроительном заводе № 820 ("Янтарь") в Калининграде, на судостроительном заводе № 199 (имени Ленкома) в Комсомольске-на-Амуре в 1954-1958 годах 4 корабля были переданы ВМФ ГДР в 1956-1959 годах, где вошли в состав 4-й флотилии Фольксмарине."
 DDR_screen_hull_heavy_1: "Проект 201M"
 DDR_screen_hull_heavy_1_short: "Проект 201M"
 DDR_screen_hull_heavy_1_desc: "U-Boot-Jägere project 201M (код НАТО- "S. O. 1")."
 DDR_screen_hull_heavy_2: "Sassnitz-Klasse"
 DDR_screen_hull_heavy_2_short: "Sassnitz-Klasse"
 DDR_screen_hull_heavy_2_desc: "Малые ракетные корабли (Kleine Raketenschiffe) проекта 151. Корабли были построены на верфи Пеневерфт в Вольгасте."
 DDR_screen_hull_heavy_3: "Kustenschutzschiffe III r."
 DDR_screen_hull_heavy_3_short: "Kustenschutzschiffe III r."
 DDR_screen_hull_heavy_3_desc: "Малые противолодочные корабли (Kleine UAW-Schiffe) (с 1 февраля 1986 года СКР 3 ранга (Kustenschutzschiffe III r.)) проекта 133.1 (код НАТО - "Пархим-I")."
 DDR_screen_hull_heavy_4: "Kustenschutzschiffe II r."
 DDR_screen_hull_heavy_4_short: "Kustenschutzschiffe II r."
 DDR_screen_hull_heavy_4_desc: "Тип ДЕЛЬФИНА (проект 1159, Koni klass) Всего в 1975-1987 годах на судостроительном заводе "Красный Металлист" в Зеленодольске было построено 12 кораблей этого типа. Три из них в 1978, 1979 и 1986 годах были переведены в ГДР, где вошли в состав 4-й флотилии фольксмарине. В 1990-1991 годах они временно входили в состав ВМС Германии (классифицировались как фрегаты). "Берлин" и "Галле" были разобраны на металл в 1995 году, а "Росток" - в 1998-м."
  
 DDR_screen_hull_medium_0: "Класс "Хабихт""
 DDR_screen_hull_medium_0_short: "Класс "Хабихт""
 DDR_screen_hull_medium_0_desc: "Minelayers minelayers (Minenleg-und-raumschiffe) проект 1 (более поздний проект 1000, класс "Habicht")."
 DDR_screen_hull_medium_1: "Класс "Hai 12.3""
 DDR_screen_hull_medium_1_short: "Класс "Hai 12.3""
 DDR_screen_hull_medium_1_desc: "(U-Boot-Jäger) класс "Hai 12.3"."
 DDR_screen_hull_medium_2: "Проект 205"
 DDR_screen_hull_medium_2_short: "Проект 205"
 DDR_screen_hull_medium_2_desc: "Ракетные катера (Raketenschnellboote) проекта 205 (код НАТО - "Osa I"). Лодки этого типа были развитием серии проекта 183Р "Комар". Они строились в Советском Союзе с 1960 по начало 1980-х годов на трех заводах: Приморском в Ленинграде, Дальзаводе во Владивостоке и Рыбинске. В 1962-1971 годах 15 лодок были переданы ВМФ ГДР. Корабли этого типа находились в составе 6-й флотилии Фольксмарине на протяжении всей своей службы."
 DDR_screen_hull_medium_3: "Проект 1241RE"
 DDR_screen_hull_medium_3_short: "Проект 1241RE"
 DDR_screen_hull_medium_3_desc: "Малые ракетные корабли (Kleine Raketenschiffe) проекта 1241RE "Молния" (код НАТО - "Тарантул I"). В начале 1980-х годов перед командованием Фольксмарине встал вопрос о замене устаревших ракетных катеров класса " Оса " на более современные корабли этого класса. С октября 1984 по октябрь 1986 года в составе ВМФ ГДР появилось пять больших ракетных катеров советского производства проекта 1241. Они служили в 6-й флотилии фольксмарине."
 DDR_screen_hull_medium_4: "Проект 151-R"
 DDR_screen_hull_medium_4_short: "Проект 151-R"
 DDR_screen_hull_medium_4_desc: "Проект 151-R"
  
