l_english:
 mongolia.1.d:0 "Под сапогом Сталина и его коммунистических марионеток в Монголии народ региона очень страдал. С момента своего создания в 1921 году Монгольская Народная Республика подвергалась чисткам и массовым убийствам, полностью искоренившим образ жизни монгольского народа и оказавшим разрушительное воздействие на население. Несмотря на то, что Монгольская народная партия заявляла, что представляет народ, она заставила людей коллективизировать скот и практически искоренила буддийскую религию. Их оскверненные храмы остались как выжженные напоминания о потерянных временах. Недовольство советской властью росло, и население становилось все более недовольным коммунистическим правлением. Хотя это еще не угроза советской власти, растущие антисоветские настроения по всей Монголии - опасность, которую Сталин не мог позволить себе игнорировать."
 mongolia.2.d:0 "Наш дорогой лидер Хорлоогийн Чойбалсан умер в возрасте 56 лет от рака почек в Москве. Его будут помнить как героя, патриота и, в конечном счете, мученика за дело монгольской независимости. Его тело было возвращено с полными воинскими почестями, и в столице состоялись государственные похороны, на которых присутствовали как монгольские, так и советские официальные лица. Он был похоронен на кладбище Алтан Ульгий в Улан-Баторе, но уже начались работы по строительству мавзолея перед Дворцом правительства."
 mongolia.3.d:0 "\nНесмотря на энтузиазм монгольских коммунистических лидеров, Советский Союз отклонил их заявку на вхождение в состав страны в качестве составной республики. Хотя Советский Союз высоко ценит приверженность монголов социализму и советской модели, многие советские люди считают, что страна слишком неразвита, чтобы входить в ее состав. Также существовали опасения, что присоединение Монголии может привести к антагонизму советских социалистических союзников в Китае и Восточной Азии. Монгольское правительство, как говорят, было разочаровано этим решением и пообещало продолжить революционное развитие страны под советским руководством. Однако в монгольской коммунистической партии ходят слухи, что многие члены партии выступали против этого плана и, возможно, в частном порядке призывали советских чиновников также отклонить это предложение."
 mongolia.11.d:0 "Монгольская коммунистическая партия завершила публичные обсуждения и доклады относительно прошлых проступков и чрезмерного насилия, которые имели место во время Великой чистки с 1937 по 1939 год. Партия сожалеет о гибели людей и разрушении культуры в этот период. Что еще более важно, партия решила реабилитировать членов партии, которые были осуждены за чрезмерный национализм. Многие в партии винят роль советских советников, особенно из НКВД, которых обвиняют в руководстве и контроле насилия, включавшего пытки и создание тюремных лагерей. Коммунистический лидер того периода, любимый маршал Чойбалсан, также подвергался критике за ошибки, допущенные в этот период, и создание культа личности. Некоторые из старой гвардии партии чувствуют себя неуютно в связи с этими процессами"
 mongolia.20.d:0 "Генеральный секретарь Дашийн Дамба недавно был отстранен от власти в результате борьбы за власть в Монгольской коммунистической партии. Дамба недавно сыграл важную роль в десталинизации, а также подтолкнул страну к сотрудничеству с другими азиатскими державами, ориентированными на социализм, а не только с Советским Союзом. Старая гвардия партии возмутилась десталинизацией, особенно критикой бывшего лидера, маршала Чойбалсана. Именно эта фракция организовала смещение Дамбы и чистку его близких соратников. Советский Союз, вероятно, будет доволен таким развитием событий, поскольку это поможет укрепить лидерство промосковской фракции в партии"
 mongolia.7.d:0 "Монголия имеет сложную и нестабильную историю с момента падения Монгольской империи. В неразберихе китайской политики времен войны маленькая и изолированная нация Монголии была забыта великими державами и поэтому никогда не получала официального признания. После того как Богдо-хан и оккупационные китайские войска были вытеснены Красной армией в 1921 году, страна фактически оказалась под советским контролем и не имела официальной государственности. Несмотря на независимое участие в боях против Японии во время 2-й мировой войны, независимость Монголии по-прежнему признавалась только Советами. Однако с усилением холодной войны во всем мире Советский Союз значительно активизировал усилия по признанию монголов в качестве независимого государства. Этот шаг представляет собой большой шаг вперед для монгольской национальной идентичности и, возможно, вернет Монголии статус общепризнанной державы впервые с 14-го века."
 mongolia.21.d:0 "During in extraordinary Central Committee meeting, Prime Minister Yumjaagiin Tsedenbal was removed from office. A major figure in the party since he first became General Secretary in 1940, his removal indicates the party had grown wary of his industrialization efforts and devotion to Moscow. His removal is likely the result of the recent de-Stalinization efforts which heavily criticized Tsedenbal party mentors. His association with the previous leadership has made his position untenable as the newer party leadership wishes to move on. The new Prime Minister has not been named yet but will be expected to keep ties strong with Moscow and also push Mongolia into stronger relations with other Asian socialist states. It is unknown whether Tsendenbal has been stripped of his party membership or simply removed from senior posts."
 AJAX.900.d:0 "Новое иранское правительство Ахмада Кавама дало согласие на восстановление династии Каджаров. Шахом станет молодой Хамид Мирза Каджар, сын бывшего наследного принца. Иранское правительство охарактеризовало это как восстановление исторической ошибки. Отмечая, что Реза Пехлеви узурпировал трон путем махинаций, насилия и с помощью иностранных сил. Именно эта тенденция к безжалостности и сговору с иностранными державами поддерживала слабость иранской нации в последние годы. Реставрация Каджаров возвращает династию из восемнадцатого века и оживит естественные связи не только между монархией и народом, но и между монархией и духовенством."
 AJAX.911.d:0 "Общественное положение шаха еще больше ухудшилось после проведения массовых митингов против шаха радикальной группой \"Фадаиян-и-Ислам\". Эта группа, используя свои связи среди духовенства, смогла собрать сторонников во время пятничной молитвы и вывести их на улицы по всей стране. Протестующие осуждали вестернизаторскую политику династии Пехлеви, ее приверженность имперским державам и то, что они называли угнетением ислама. Мобилизация религиозных общин в Иране - это серьезный удар по шаху, который уже столкнулся с общественными волнениями из-за своих автократических тенденций и воспринимаемого статуса имперской лазутчицы."
 mongolia_prc_1_desc:0 "В официальном коммюнике [КНР.GetName] предложила несколько сотен тысяч ханьских рабочих для Внешней Монголии, чтобы помочь в модернизации нашей страны. Это, несомненно, было бы невероятно полезно для обеспечения нашей роли в коммунистическом мире. Однако [MON.GetName] - очень маленькая страна, относительно говоря, в нашей стране живет не так много этнических монголов. Если мы примем этих ханьских рабочих, у нас будет гораздо больше этнических китайцев, чем мы сможем ассимилировать, и есть вероятность, что [КНР.GetName] попытается интегрировать нашу нацию."
 inner_mongol_13_desc:0 "Ранее сегодня [КНР.GetName] объявила о том, что она разрешает и поощряет миграцию монгольского населения из региона Внутренней Монголии во Внешнюю Монголию, или [MON.GetName]. Это произошло после первоначального запроса об уступке всего региона Внутренней Монголии, что, очевидно, было сочтено нелепым китайским правительством, которое решительно отвергло этот запрос. Однако их официальная просьба о заключении своего рода миграционного договора была принята в качестве акта доброй воли, и движение к монгольскому единству отмечается сегодня вечером в Улан-Баторе."
 inner_mongol_14_desc:0 "Ранее сегодня [MON.GetName] сообщило о своем недовольстве китайским правительством из-за его агрессивного отказа работать с монгольским правительством в его попытках интегрировать население Внутренней Монголии в свои владения. Первоначально [PRC.GetName] отверг первоначальную попытку организовать передачу региона Внутренней Монголии в состав своего государства с надеждой на улучшение отношений после передачи региона. Когда [MON.GetName] направил еще одно коммюнике с просьбой о проведении открытой миграционной политики, [PRC.GetName] еще больше отверг их. Сегодня многие в Монголии испытывают чувство разочарования из-за отсутствия сотрудничества."
 inner_mongol_12_desc:0 "Проклятый [PRC.GetName] еще больше запятнал наши цели по объединению монголов. Из ошибочной попытки бороться с нами из злобы, они отклонили оба наших запроса, вместо этого отдав предпочтение стойкой позиции того, что кажется антимонгольскими настроениями. К сожалению, нам придется подождать нашего союза."
 inner_mongol_11_desc:0 "Хотя [КНР.GetName] отклонила нашу первоначальную просьбу о передаче алтайских земель, они предварительно приняли просьбу об открытой миграции народов Внутренней Монголии во Внешнюю Монголию. Это решение не совсем то, чего мы хотели, но объединение наших народов - это, тем не менее, хорошо."
 inner_mongol_10_desc:0 "Хотя мы отклонили их предыдущее сообщение, мы получили еще одно послание от монгольского правительства. Извиняясь за свою самонадеянность, [PRC.GetLeader] попросил договор об открытой миграции алтайских народов на свою землю, чтобы продолжить свою миссию единения своего народа. Хотя это меньше раздражает, чем предыдущая просьба, некоторые все еще не согласны с идеей умиротворения монголов."
 inner_mongol_1_desc:0 "Хотя Внутренняя Монголия не является частью монгольской нации со времен падения империи Тэмуджина, алтайский народ все еще населяет обширные пространства степей Внутренней Монголии, ныне являющейся частью Северного Китая. Более того, активное население этого региона мечтает о единой степи и воссоединении Великой Монголии. Однако [PRC.GetName] контролирует эти обширные степи, и может не увидеть нашу точку зрения, когда речь идет о приобретении их земель. Мы можем только послать наш запрос и надеяться на лучшее."
 inner_mongol_2_desc:0 "Сегодня в полдень мы получили коммюнике от [MON.GetName]. В коммюнике содержалась подробная просьба об уступке территорий внутренней Монголии [MON.GetName] в рамках того, что [MON.GetLeader] описал как \"исконное и этническое право на единство народов\". Хотя это действительно было бы заметным актом доброй воли по отношению к алтайским народам региона, а также тем, что установило бы лучшие отношения между нашими странами, многие активные члены нашего правительства враждебно отреагировали на эту просьбу, прямо заявив, что мы ничего не должны монгольскому народу. "
 inner_mongol_3_desc:0 "Китай отклонил нашу просьбу в связи с неудачным поворотом событий. [PRC.GetLeader] заявил, что \ \"Китайский народ ничего не должен монголам.\", отвергнув нашу попытку единения народов. Однако, возможно, нам удастся убедить наших соседей принять участие в открытом миграционном договоре, который позволит нашим братьям с юга переселиться на наши земли."
 inner_mongol_4_desc:0 "Китай принял нашу просьбу. В нескольких коротких словах [PRC.GetLeader] фактически передал Внутреннюю Монголию, ссылаясь на вражду в прошлом и надежду на дальнейшую дружбу между двумя странами. Хотя передача земель может занять некоторое время, это знаковое достижение для дипломатии."
 inner_mongol.5.d:0 "Ранее сегодня [КНР.GetName] объявила, что уступит земли Внутренней Монголии [MON.GetName], ссылаясь на многочисленность алтайских народов в регионе, а также на желание улучшить отношения между двумя странами. Хотя эти земли не принадлежали должным образом монгольскому государству со времен династии Юань, монгольское правительство заявило о своем желании объединить монгольские народы. В Улан-Баторе население вышло на улицы, чтобы отпраздновать это главное достижение дипломатии."