 SOM_division_1: "Сильно разделенная нация"
 SOM_division_1_desc: "Несмотря на то, что после обретения независимости они объединились в единую нацию, на юге и севере Сомали правили совершенно разные языки и обычаи. Таким образом, нация очень сильно разделена между ними. При этом различные кланы видят в них в первую очередь членов своего клана, а не страны."
