 tanganyika_groundnut_scheme_desc: "Предложенная Фрэнком Сэмюелем, управляющим директором United Africa Company, схема с арахисом представляет собой план по выращиванию арахиса на более чем 1 миллионе гектаров земли с целью увеличения запасов маргарина в Британии, а также развития заброшенных захолустий Британской империи."
 SOM_division_1: ""
 SOM_division_1_desc: "Несмотря на объединение в единую нацию после обретения независимости, на юге и севере Сомали в данный момент совершенно разные языки и обычаи. Таким образом, нация фактически пытается усидеть на двух стульях. При этом различные кланы внутри государства видят себя, в первую очередь, членами именно своих группировок, а не страны."
