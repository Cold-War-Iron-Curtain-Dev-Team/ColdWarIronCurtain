  ##unifying Arab League 
 UNITY_DESC_0: "Века унижений, порабощения и разделения только укрепили нашу решимость объединиться. Только единое будущее может обеспечить судьбу арабского народа."
 UNITY_DESC_1: "Следующие решения будут разблокированы в зависимости от текущего настроения арабского мира. Поскольку общественное мнение начинает склоняться к объединению, можно принимать более значимые законы. Процесс можно начать с поиска первого решения, доступного на пути к объединению."
 UNITY_DESC_2: "Объединение приведет к упразднению Лиги арабских государств и, следовательно, к ее официальному роспуску. Любые нации, которые не проголосуют за объединение, будут изгнаны из братства арабского народа, как государства-предатели и с ними мы разберемся позже ..."
  
