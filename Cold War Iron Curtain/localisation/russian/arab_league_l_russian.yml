 ARAB_LEAGUE_RESOLUTION.0.t: "[GetNewspaperHeader]Лига арабских государств голосует за [arab_league_nation_global_target.GetAdjective] присоединение к западной сфере влияния"
 ARAB_LEAGUE_RESOLUTION.0.d: "\nПосле месяцев межгосударственных переговоров [arab_league_nation_global_target.GetAdjective] Лига арабских государств проголосовала за совместный шаг к благополучному будущему. Голосование было проведено после нескольких недель дебатов и споров по поводу обсуждаемой резолюции. Представители [arab_league_nation_global_target.GetAdjective] стремятся наладить прочные отношения, которые могут привести к большему и, возможно, даже к членству в НАТО и месту под защитным зонтиком Запада. Это улучшит отношения между странами на некоторое время или до следующего крупного регионального инцидента ..."
 ARAB_LEAGUE_RESOLUTION.01.t: "[GetNewspaperHeader]Лига арабских государств голосует за [arab_league_nation_global_target.GetAdjective] присоединение к западной сфере влияния"
 ARAB_LEAGUE_RESOLUTION.01.d: "\nПосле месяцев межгосударственных переговоров Лига арабских государств проголосовала за совместный шаг к благополучному будущему. Голосование было проведено после нескольких недель дебатов и споров по поводу обсуждаемой резолюции. Представители стремятся наладить прочные отношения, которые могут привести к большему и, возможно, даже к членству в НАТО и месту под защитным зонтиком Запада. Это улучшит отношения между странами на некоторое время или до следующего крупного регионального инцидента ..."
 ARAB_LEAGUE_RESOLUTION.1.d: "На недавней сессии Лиги арабских государств представила резолюцию, гд наш народ был открыто осужден за нарушение прав человека. Это заявление сильно навредит нашему международному имиджу и туризму. Что еще более важно, это дает возможность врагам государства и политическим оппонентам действовать более открыто по мере усиления глобального контроля над нашими политическими действиями. Некоторые высокопоставленные правительственные чиновники считают, что резолюция стала тревожным сигналом и мы должны действовать, чтобы убедить международное сообщество и наш народ в том, что наше правительство является оплотом справедливости в стране. Другая группа высокопоставленных чиновников заявляет, что голосование в Лиге арабских государств было результатом пропаганды и потенциально опасного внутреннего заговора против нас. Они утверждают, что мы не должны прекращать проводимую политику и мы вполне способны скрыть её от глаз общественности."
  
  ##condemn colonialism 
 ARAB_LEAGUE_RESOLUTION.2.t: "[GetNewspaperHeader]Лига арабских государств голосует за осуждение [arab_league_nation_global_target.GetAdjective] колониализма"
 ARAB_LEAGUE_RESOLUTION.2.d: "\nЛига арабских государств приняла мощную резолюцию, осуждающую колониализм [arab_league_nation_global_target.GetAdjective]. В ходе дебатов перед голосованием многие члены отметили, что право на самоопределение является жизненно важным принципом Хартии Лиги арабских государств, и [arab_league_nation_global_target.GetAdjective] не смогли предложить своим колониальным подданным никаких путей к свободе или определить их будущий статус. Многие члены не были впечатлены представленными контраргументами и, похоже, большинство убеждено, что [arab_league_nation_global_target.GetAdjective] не может предложить своим колониям право голоса для определения своего будущего. Представители [arab_league_nation_global_target.GetAdjective] отказались делать официальное заявление и покинули конгресс Лиги арабских государств, чтобы проконсультироваться со своим руководством. Резолюция рассматривается, как крупная победа антиколониальных сил по всей планете."
 ARAB_LEAGUE_RESOLUTION.3.t: "Лига арабских государств голосует за осуждение [arab_league_nation_global_target.GetAdjective] колониализма"
 ARAB_LEAGUE_RESOLUTION.3.d: "Недавняя резолюция Лиги арабских государств осудила правление колониальных владений нашей страны. Резолюция Лиги арабских государств не признала того, что мы предоставили в этих областях с точки зрения безопасности, образования и экономики. Эта резолюция стала огромным ударом по нашему международному имиджу. Наши враги и их заблудшая паства в колониях осмелели для нанесения удара по нам или возжелают поставить нас в неловкое положение своими действиями. Мы, безусловно, можем сохранить нашу политику и сохранить присутствие в колониях, хотя и рискуем дальнейшими санкциями Лиги арабских государств. Несколько высокопоставленных военных и колониальных чиновников сразу отметили, что предпочитают этот вариант. Но мы можем рассмотреть возможность подготовки планов деколонизации, чтобы противостоять негативному международному вниманию к нам. Другие высокопоставленные чиновники считают, что эти государства можно освободить и сохранить сильное влияние на них, хотя это и не гарантировано."
  
  ## contain foreign influence 
 ARAB_LEAGUE_RESOLUTION.4.t: "[GetNewspaperHeader]Лига арабских государств голосует за противостояние [arab_league_nation_global_target.GetAdjective] иностранному влиянию"
 ARAB_LEAGUE_RESOLUTION.4.d: "\nВ новой резолюции, принятой Лигой арабских государств, [arab_league_nation_global_target.GetAdjective] официально сообщается, что они больше не должны расширять свое влияние на другие государства. Многие члены утверждали, что деятельность [arab_league_nation_global_target.GetAdjective] ведет к дестабилизации, экономическим трудностям и может угрожать суверенитету слишком многих государств. Многих убедили дискуссии о том, что действия [arab_league_nation_global_target.GetAdjective] были сродни созданию нового типа колониализма, скрытого от глаз общественности. После голосования несколько представителей отметили, что практика [arab_league_nation_global_target.GetAdjective] является отвратительной и бездействие может привести к тому, что мир вернется к эпохе жестокой глобальной конкуренции."
  
  ## ban diplomats 
 ARAB_LEAGUE_RESOLUTION.5.t: "[GetNewspaperHeader]Лига арабских государств голосует за заморозку [arab_league_nation_global_target.GetAdjective] дипломатической миссии"
 ARAB_LEAGUE_RESOLUTION.5.d: "\nПосле долгих дебатов Лига арабских государств проголосовала за заморозку дипломатической миссии [arab_league_nation_global_target.GetAdjective]. Члены Лиги арабских государств определили, что правительство [arab_league_nation_global_target.GetAdjective] использовало свои средства ненадлежащим образом в ущерб мировому сообществу. Это огромный удар для правительства [arab_league_nation_global_target.GetAdjective]. После голосования их представитель проинформировал прессу, что результаты не только разочаровывают, но и представляют собой нарушение международных норм, касающихся суверенитета отдельных стран. Представитель предсказал, что такие шаги приведут к дальнейшим посягательствам на права государств и их народов. Другие страны опубликовали заявления, в которых говорилось, что [arab_league_nation_global_target.GetAdjective] нарушает так много общепринятых норм, что такой результат был неизбежен."
  
  ##demand Arab states 
 ARAB_LEAGUE_RESOLUTION.6.t: "[GetNewspaperHeader]Лига арабских государств голосует за санкции против видных [arab_league_nation_global_target.GetAdjective] деятелей"
 ARAB_LEAGUE_RESOLUTION.6.d: "\nЛига арабских государств проголосовала за санкции против видных деятелей [arab_league_nation_global_target.GetAdjective]. Этих людей обвиняют в целом ряде преступлений и коррупции. Лига арабских государств надеется, что санкции заставят правительство [arab_league_nation_global_target.GetAdjective] арестовать этих людей для дальнейших разбирательств. Резолюция была встречена положительно в средствах массовой информации. Они отметили, что резолюция направлена против отельных преступников и не касается всего общества или даже правительства. Вторя этой теме один видный дипломат поведал СМИ, что санкции призваны помочь людям [arab_league_nation_global_target.GetAdjective] очистить дом от преступников и реализовать свои амбиции. Никто из лиц, подвергшихся санкциям, не пожелал сделать заявление по этому поводу."
  
  ##Arab trade sanctions 
 ARAB_LEAGUE_RESOLUTION.7.t: "[GetNewspaperHeader]Лига арабских государств голосует за введение торговых санкций на [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.7.d: "\nПосле ожесточенных дебатов Лига арабских государств проголосовала за введение обширных торговых санкций в отношении [arab_league_nation_global_target.GetName]. В тексте резолюции отмечены постоянные нарушения установленных норм и негативные шаги правительства [arab_league_nation_global_target.GetName]. Несколько дипломатов поспешили заявить средствам массовой информации, что санкции не предназначены для нанесения вреда людям, но они должны быть реализованы, чтобы контролировать действия [arab_league_nation_global_target.GetName]. Правительство [arab_league_nation_global_target.GetName] очень расстроено резолюцией. Они рассказывают о международном заговоре и сообщают своему народу, что они подвергаются преследованиям и запугиванию со стороны Лиги арабских государств."
  
  ##denounce internationally 
 ARAB_LEAGUE_RESOLUTION.8.t: "[GetNewspaperHeader]Лига арабских государств проголосовала за введение запрета на торговлю оружием с [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.8.d: "\nЛига арабских государств приняла новую резолюцию, запрещающую закупку оружия правительством [arab_league_nation_global_target.GetName]. Многие члены лиги согласились с аргументом, что оружия, приобретенного [arab_league_nation_global_target.GetName], было намного больше, чем им необходимо для собственной безопасности. Вдобавок члены лиги считают, что [arab_league_nation_global_target.GetName] использует ресурсы для чрезмерного и угрожающего наращивания военного потенциала, которые необходимы для помощи собственному народу. Лига арабских государств в конечном итоге пришла к выводу, что она должна действовать, чтобы предотвратить дальнейшую дестабилизацию международного сообщества [arab_league_nation_global_target.GetName]. Представители [arab_league_nation_global_target.GetName] выпустили короткое заявление, осуждающее резолюцию, как нарушение суверенитета и прямое нападение на способность нации защищаться."
  
  ##enact oil embargo 
 ARAB_LEAGUE_RESOLUTION.9.t: "[GetNewspaperHeader]Организация Объединенных Наций призывает положить конец [arab_league_nation_global_target.GetName] ядерной программе"
 ARAB_LEAGUE_RESOLUTION.9.d: "\nЛига арабских государств приняла резолюцию, призывающую [arab_league_nation_global_target.GetName] прекратить свою ядерную программу. Во время дебатов по резолюции несколько стран отметили существующую угрозу, которую представляет ядерное оружие не только для региона, но и для всего мира. Представители [arab_league_nation_global_target.GetName] настаивали на том, что они имеют право развивать любые технологии, необходимые для продвижения и защиты людей. Они также добавили, что резолюция Лиги арабских государств говорит о предвзятости и лицемерии организации и планируют выпустить официальный ответ после консультации с высшим руководством. Другие дипломаты отвергли такие утверждения, указав, что опасность очевидна для всего мира и бездействие ,само по себе, было бы серьезной ошибкой."
  
  ##request Arab loans 
 ARAB_LEAGUE_RESOLUTION.10.t: "[GetNewspaperHeader]Организация Объединенных Наций призывает к изъятию оружия массового поражения у [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.10.d: "\nГорячие дебаты завершились принятием Лигой арабских государств резолюции, требующей от [arab_league_nation_global_target.GetName] уничтожения всего своего оружия массового поражения. Дипломаты из нескольких стран утверждали, что [arab_league_nation_global_target.GetName] не имеет надлежащих процедур командования и контроля, сдержанности и оправдания для производства, хранения или использования такого оружия. В резолюции Лиги арабских государств отмечалось, что уничтожение такого оружия улучшит перспективы мира в регионе и уменьшит вероятность вооруженного конфликта. Главный представитель [arab_league_nation_global_target.GetName] заявил, что дебаты и голосование проводились просто для того, чтобы унизить их нацию. Он сказал, что официальный ответ будет дан, как только он вернется домой, чтобы проконсультироваться с высшим руководством."
 ARAB_LEAGUE_RESOLUTION.11.d: "Лига арабских государств проголосовала за резолюцию, требующую, чтобы мы приостановили нашу ядерную программу и передали ее под наблюдение Лиги арабских государств. Во время дебатов по резолюции стало ясно, что международное сообщество не доверяет нашей способности использовать такое оружие. Мы можем принять резолюцию и начать процесс денуклеаризации. Это избавит наших оппонентов от шума и покажет, что мы - ответственный член международного сообщества. Это также снизило бы риск эскалации конфликта. Однако есть высокопоставленные чиновники и военные, которые отмечают, что нация пожертвовала огромным богатством, жизнями и ресурсами для создания ядерного оружия. Проведение денуклеаризации оскорбило бы нацию и сделало бы ее уязвимой. Они высказывают опасения, что резолюция Лиги арабских государств может быть всего лишь уловкой для уничтожения ядерного оружия в рамках подготовки к вторжению на наши земли."
 ARAB_LEAGUE_RESOLUTION.12.d: "Недавняя резолюция, принятая Лигой арабских государств, потребовала приостановить и прекратить нашу программу химического и ядерного оружия. По результатам голосования стало ясно, что международное сообщество рассматривает нашу программу, как серьезную угрозу и отказ от нее может поставить под угрозу дальнейшие действия Лиги арабских государств на международной арене. Принятие резолюции и начало процесса, несомненно, положат конец любой эскалации и некоторые официальные лица отмечают, что с моральной точки зрения, возможно, будет правильным уничтожить такое оружие любым способом. Однако другие официальные лица, особенно военные, призывают нас не уступать, поскольку это оружие предназначено для национальной защиты и является внутренним делом государства. По их мнению Лига арабских государств не имеет права диктовать суверенному государству внутреннюю политику."
  
  ##request control of state 
  
  ##declare peacekeeping mission 
  
  ##request Arab intervention 
 ARAB_LEAGUE_RESOLUTION.13.t: "[GetNewspaperHeader]Лига арабских государств голосует за возвращение [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.13.d: "\nПосле серьезной неудачи для [arab_league_state_owner_global_target.GetName] Лига арабских государств проголосовала за возвращение [arab_league_state_global_target.GetName]. Во время принципиальных дебатов многие члены выразили обеспокоенность сообщениями о беспорядках и общественной напряженности на территории. Они согласились, что народ хочет вернуть [arab_league_state_global_target.GetName]. Генеральный секретарь поддержал это мнение после того, как была принята резолюция, в которой говорилось, что возвращение [arab_league_state_global_target.GetName] будет иметь большое значение для снижения напряженности и насилия в регионе. Еще неизвестно, сможет ли это решение Лиги арабских государств стабилизировать [arab_league_state_owner_global_target.GetName], чтобы вернуть [arab_league_state_global_target.GetName] мировому сообществу."
  
  ##embargo Arab state 
 ARAB_LEAGUE_RESOLUTION.14.t: "[GetNewspaperHeader]Лига арабских государств голосует за возврат контроля над [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.14.d: "\nЛига арабских государств недавно приняла резолюцию, требующую, чтобы мы вернули контроль над [arab_league_state_global_target.GetName]. Это резкое осуждение со стороны всемирной организации представляет собой серьезную проблему для нашего правительства. Некоторые считают, что мы должны подчиняться просьбе Лиги арабских государств, так как это улучшит международное мнение и изменит негативное отношение к нашей стране. Они также отмечают, что отказ может поставить под угрозу нашу национальную безопасность. Другие, однако, утверждают, что принятие резолюции будет рассматриваться нашим народом, как предательство и правительство может не пережить этого. Кроме того, они уверены, что Лига арабских государств навязывает нам свое требование. Мы должны решить, принять резолюцию или отклонить ее."
  
  
  ##remove embargo Arab state 
 ARAB_LEAGUE_RESOLUTION.15.t: "[GetNewspaperHeader]Лига арабских государств развертывает миротворцев в [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.15.d: "\nЛига арабских государств санкционировала развертывание миротворцев в [arab_league_nation_global_target.GetName]. Ожидается, что миротворцы снизят напряженность и насилие в этом районе и сохранят мир. Те страны, которые одобрили эту меру, заявили, что миротворцы будут действовать как авангард мира и стабильности в регионе. Несколько членов лиги заявили о своей заинтересованности в отправке миротворцев, но фактическое количество стран, участвующих в миссии «Миротворец» еще не объявлены. Хотя многие газеты в [arab_league_nation_global_target.GetName] приветствовали развертывание, некоторые политики опасаются, что силы Лиги арабских государств представляют угрозу для независимости нации и это не должно было быть разрешено."
  
  ##send monetary aid 
 ARAB_LEAGUE_RESOLUTION.16.t: "[GetNewspaperHeader]Лига арабских государств начинает инвестиционный проект в [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.16.d: "\nЛига арабских государств одобрила отправку делегации высочайшего уровня для помощи в решении проблем в [arab_league_nation_global_target.GetName]. Делегацию Лиги арабских государств возглавит опытный дипломат, хорошо знающий ситуацию в регионе. Ожидается, что группа уедет, как только получит официальное разрешение на поездку. Дипломаты, знакомые с ситуацией, полагают, что эта попытка посредничества во главе с нейтральной группой дает надежду на разрешение ситуации. Эти усилия по посредничеству получили широкую поддержку, но с учетом столь высоких ожиданий многие дипломаты предполагают, что неудача может иметь катастрофические последствия."
  
  ##send research aid 
 ARAB_LEAGUE_RESOLUTION.17.d: "Лига арабских государств попросила нас прекратить боевые действия и согласиться на прекращение огня. Лига арабских государств обещает обеспечить соблюдение режима прекращения огня и пронаблюдать за нашим противником, чтобы он не пытался манипулировать ситуацией на передовой в своих интересах перед мирными переговорами. Мы должны проконсультироваться с высокопоставленными военными чиновниками, чтобы узнать их мнение о том, следует ли нам продолжать военные действия."
  
  ##release nation 
 ARAB_LEAGUE_RESOLUTION.18.t: "[GetNewspaperHeader]Прекращение огня вступило в силу между [FROM.GetName] и [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.18.d: "\n[FROM.GetName] и [arab_league_nation_global_target.GetName] договорились о прекращении огня под эгидой Лиги арабских государств. Вскоре должны прибыть наблюдательные силы Лиги арабских государств для охраны линии соприкосновения. Генеральный секретарь Лиги арабских государств надеется, что обе стороны воспользуются прекращением огня для продвижения мирных переговоров и, наконец, решения всех назревших проблем. Оба правительства выступили с заявлениями, в которых приветствовали роль Лиги арабских государств в содействии прекращению огня. Хотя Лига арабских государств довольна своей ролью в прекращении огня, некоторые дипломаты в частном порядке заявили средствам массовой информации, что, по их мнению, им потребовалось слишком много времени, чтобы добиться этого решения."
  
  ##increase session length 
 ARAB_LEAGUE_RESOLUTION.19.t: "[GetNewspaperHeader][FROM.GetName] отклоняет мирные переговоры"
 ARAB_LEAGUE_RESOLUTION.19.d: "\nЛига арабских государств сообщила, что [FROM.GetName] отказались принимать предложение о мирных переговорах. Ведущие дипломаты Лиги арабских государств подчеркнули свое разочарование отказом, отметив, что статус Лиги арабских государств, как нейтральной стороны сделал бы ее идеальным партнером для мирных переговоров. Ожидается, что Совет Безопасности обсудит это событие на своей следующей сессии. Из-за этого отказа растут опасения, что конфликт будет иметь нарастающий характер и что Лиге арабских государств не хватает влияния, чтобы реализовать амбиции ее основателей."
  
  ##reset session 
 ARAB_LEAGUE_RESOLUTION.20.t: "[GetNewspaperHeader]Лига арабских государств анонсировала интервенцию в [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.20.d: "\nВ результате закрытого голосования Лига арабских государств разрешила военное вмешательство в [arab_league_nation_global_target.GetName]. После голосования генеральный секретарь отметил, что сложившаяся на местах ситуация является неотвратимой и необходимой. Несколько государств уже выразили заинтересованность в поддержке новой миссии, но Лига арабских государств еще не предоставила точных цифр о том, сколько сил будет развернуто и из какой страны. В [arab_league_nation_global_target.GetName] многие приветствуют решение Лиги арабских государств и надеются, что оно поможет в обеспечении безопасности и стабильности, необходимых для прочного мира. Некоторые элементы в [arab_league_nation_global_target.GetName] выступают против развертывания сил Лиги арабских государств, рассматривая это как иностранное вмешательство. Лиге арабских государств придется действовать осторожно, но есть большие надежды на ее успех."
  
  ##establish the Azad zone 
 ARAB_LEAGUE_RESOLUTION.21.t: "[GetNewspaperHeader]Лига арабских государств анонсировала интервенцию в [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.21.d: "\nТоржественным голосованием Лига арабских государств разрешила военное вмешательство в [arab_league_nation_global_target.GetName]. После голосования генеральный секретарь отметил, что это не было целью организации или ее желанием, но ситуация ухудшилась до такой степени, что другого выхода не оставалось. Другие дипломаты в Лиге арабских государств были более откровенны, заявив, что ситуация с [arab_league_nation_global_target.GetName] достигла точки невозврата и вмешательство стало неизбежным. Какие страны возглавят интервенцию и в каком количестве на данный момент неизвестно. Правительство [arab_league_nation_global_target.GetName] не опубликовало официального заявления, но аналитики полагают, что они, скорее всего, будут непокорными и вряд ли уступят международному давлению."
  
  
  ##establish research sharing 
 ARAB_LEAGUE_RESOLUTION.22.d: "В недавней резолюции Лиги арабских государств содержится призыв к формированию коалиции для обеспечения мира в неспокойном регионе. Некоторые представители местной прессы призывают нас присоединиться к коалиции, чтобы продемонстрировать нашу солидарность и поддержку мира в регионе. В вооруженных силах офицеры также поддерживают решение, рассматривая такую коалицию, как способ проверить как войска, так и вооружение в полевых условиях. Однако есть и оппозиция: некоторые СМИ говорят, что мы не должны вмешиваться в дела других стран. Кроме того, в вооруженных силах есть еще одна группа, которая утверждает, что участие в таких операциях ставит под угрозу жизни людей и расходует ресурсы без какой-либо ощутимой выгоды. Для нас это трудный выбор."
  
  ##attempt to shift league HQ 
 ARAB_LEAGUE_RESOLUTION.23.t: "[GetNewspaperHeader]Лига арабских государств голосует за отмену торговых санкций в отношении [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.23.d: "\nЛига арабских государств проголосовала за отмену обширных торговых санкций в отношении [arab_league_nation_global_target.GetName]. Совет Безопасности отметил, что [arab_league_nation_global_target.GetName] добился значительного прогресса в прекращении практик, которые вынудили Лигу арабских государств первоначально ввести торговые санкции. Генеральный секретарь в ответ на голосование отметил, что организация не предназначена для наказания государств и выразил надежду, что это голосование поможет [arab_league_nation_global_target.GetName] вернуться в качестве члена мирового сообщества. Представитель [arab_league_nation_global_target.GetName] приветствовал решение и заявил, что последнее голосование сыграет большую роль в нормализации отношений."
  
  ##form Arab parliament 
 ARAB_LEAGUE_RESOLUTION.24.t: "[GetNewspaperHeader]Лига арабских государств голосует за снятие запрета на торговлю оружием с [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.24.d: "\nЛига арабских государств приняла резолюцию об отмене эмбарго на поставки оружия в [arab_league_nation_global_target.GetName]. Совет Безопасности посчитал, что причины запрета на ограничение вооружения больше не являются оправданными и позиция правительства в [arab_league_nation_global_target.GetName] последнее время была довольно приветливой. Генеральный секретарь сделал замечания и указал, что организация больше не ощущает угрозы. Он добавил, что надеется, что правительство [arab_league_nation_global_target.GetName] продолжит начатые ими положительные шаги. Некоторые дипломаты поддержали эти заявления, заявив, что санкции часто являются крайней мерой и как только они увидят позитивные изменения, то и не останется большого желания продолжать политику санкций. Однако в частном порядке некоторые представители выразили опасения, что снятие санкций может в конечном итоге спровоцировать гонку вооружений в регионе."
  
  ##reform pan Arabism 
 ARAB_LEAGUE_RESOLUTION.25.t: "[GetNewspaperHeader]Лига арабских государств голосует за [arab_league_nation_global_target.GetAdjective] свободу"
 ARAB_LEAGUE_RESOLUTION.25.d: "\nЛига арабских государств проголосовала за предоставление сообществу [arab_league_nation_global_target.GetAdjective] свободы. Голосование было проведено после оживленных дебатов по этому вопросу. Но только когда оно прошло делегаты осознали, что только что произошло событие исторической важности. Генеральный секретарь поблагодарил членов лиги за голосование и обсуждение резолюции. В своем выступлении он отметил, что право на самоопределение является важным компонентом не только Хартии Лиги арабских государств, но и в мировой практике. Принятие резолюции показывает, что международное сообщество по-прежнему привержено идеалам и чаяниям всех народов мира."
  
  
  ##strengthen league unity 
 ARAB_LEAGUE_RESOLUTION.26.t: "Arab League Calls for [arab_league_nation_global_target.GetAdjective] Freedom"
 ARAB_LEAGUE_RESOLUTION.26.d: "\nIn a significant development, the Arab League passed a resolution calling for the freedom of the [arab_league_nation_global_target.GetAdjective] people. The Arab League noted the importance of Self Determination and called for it to apply in this case. Before the resolution was passed, there was intense debate, as many members expressed concern that such a resolution was a direct intervention in the sovereignty of a nation. They felt such a precedent would leave many member states vulnerable to similar resolutions and on that principle did not want to vote for the resolution. However, in the end the votes needed to pass the resolution were received. Outside the Arab League, crowds of supporters and members of the [arab_league_nation_global_target.GetAdjective] community were said to be jubilantly cheering. However, time will tell if this resolution will be accepted."
  
  
  ##rally support for unification 
 ARAB_LEAGUE_RESOLUTION.27.t: "[GetNewspaperHeader][FROM.GetName] отклоняет призыв [arab_league_nation_global_target.GetAdjective] к свободе"
 ARAB_LEAGUE_RESOLUTION.27.d: "\nПравительство [FROM.GetName] решительно отвергло резолюцию Лиги арабских государств, призывающую к независимости сообщества [arab_league_nation_global_target.GetAdjective]. В заявлении они утверждали, что Лига арабских государств не имеет юрисдикции или права диктовать, как им вести свои внутренние дела. Принятие резолюции Лиги арабских государств не только принесло бы в жертву их суверенитет, но и создало бы опасный прецедент. В заявлении также указывалось, что резолюция и международная кампания, вероятно, являются международным заговором, направленным на уничтожение единства и силы [FROM.GetName]. Вызывающее заявление было холодно встречено в Лиге арабских государств, а генеральный секретарь выразил глубокое разочарование. Совет Безопасности, вероятно, обсудит этот вопрос на своем следующем заседании."
  
  
  ##form the Arab front / super event 
 ARAB_LEAGUE_RESOLUTION.28.t: "[GetNewspaperHeader]независимость [FROM.GetAdjective] от [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.28.d: "\nСообщество [FROM.GetAdjective] официально получило независимость от [arab_league_nation_global_target.GetName]. Это стало ответом на недавнюю резолюцию Лиги арабских государств, призывающую к освобождению народа [FROM.GetAdjective]. Правительство [arab_league_nation_global_target.GetName] выпустило очень краткое заявление, в котором говорилось, что оно выбрало выполнение резолюции Лиги арабских государств не из-за страха или давления, а потому, что они тоже пришли к выводу, что этот путь является лучшим для обеспечения мира в регионе. В Лиге арабских государств ведущие дипломаты были в восторге от такого развития событий, назвав его одним из величайших проявлений самоопределения в последнее время. Международная пресса в значительной степени поддерживает результат переговоров и считает его лучшим вариантом для установления прочного мира."
  
  ##unite the league / super event 
 ARAB_LEAGUE_RESOLUTION.29.t: "[GetNewspaperHeader]Резолюция отклонена Лигой арабских государств"
 ARAB_LEAGUE_RESOLUTION.29.d: "\n[ARAB_LEAGUE_SELECTION_BUTTON_3] потерпел сокрушительное поражение в Лиге арабских государств после напряженных дебатов. Аналитики считают, что эта резолюция не получила поддержки со стороны ведущих арабских государств, а оппозиционеры успешно доказали, что потенциальные негативные последствия такой резолюции перевешивают любые выгоды. Несмотря на некоторое разочарование по поводу того, что резолюция не была принята, многие дипломаты были удовлетворены тем, что в Лиге арабских государств арабское сообщество могло обсуждать, дебатировать, а затем голосовать. До недавнего времени такой сценарий казался почти невозможным."
 ARAB_LEAGUE_RESOLUTION.30.d: "\nНа недавнюю резолюцию [ARAB_LEAGUE_SELECTION_BUTTON_3] наложил вето постоянный член Совета безопасности Лиги арабских государств. Вето подвергается критике со стороны некоторых представителей, которые отмечают, что оно положило конец любым надеждам на завершение дебатов по резолюции и работе над достижением консенсуса. Другие критикуют вето как политическую уловку, призванную защитить дружественное государство. Однако некоторые страны выразили поддержку вето, обвинив первоначальное решение в том, что оно изначально было политически мотивировано. Это сделало вето не просто неизбежным, а правильным решением."
  
  ###misc 
 ARAB_LEAGUE_RESOLUTION.90.t: "[GetNewspaperHeader][arab_league_nation_global_target.GetName] отклоняет призыв Лиги арабских государств к денуклеаризации"
 ARAB_LEAGUE_RESOLUTION.91.t: "[GetNewspaperHeader]Денуклеаризация в [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.100.t: "[GetNewspaperHeader][arab_league_nation_global_target.GetName] отклоняет призыв Лиги арабских государств к уничтожению оружия массового уничтожения"
 ARAB_LEAGUE_RESOLUTION.101.t: "[GetNewspaperHeader][arab_league_nation_global_target.GetName] уничтожает оружие массового уничтожения."
 ARAB_LEAGUE_RESOLUTION.131.t: "[GetNewspaperHeader][arab_league_state_owner_global_target.GetName] отказывает возвращать [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.132.t: "[GetNewspaperHeader][arab_league_state_owner_global_target.GetName] соглашается вернуть [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.30.t: "[GetNewspaperHeader][ARAB_LEAGUE_SELECTION_BUTTON_3] наложено вето"
  
 ARAB_LEAGUE_RESOLUTION.90.d: "\nПравительство [arab_league_nation_global_target.GetName] демонстративно отклонило недавно принятую резолюцию Лиги арабских государств, призывающую их к денуклеаризации. В своем официальном ответе правительство настаивало на том, что резолюция нарушает их суверенитет и Лига арабских государств не имеет права диктовать, какие технологии можно или нельзя использовать для улучшения положения нации. В заключение они заявили, что ни одна организация или иностранная держава не могут диктовать людям требования. Генеральный секретарь Лиги арабских государств не получил немедленного ответа, но, как говорят, мировые державы пытаются найти надлежащий ответ на эту очевидную провокацию."
 ARAB_LEAGUE_RESOLUTION.91.d: "\nСегодня Лига арабских государств вызвала всеобщую радость среди дипломатов и руководителей. Это последовало за новостью о том, что [arab_league_nation_global_target.GetName] согласился прекратить свою ядерную программу и уничтожить все ядерное оружие. Ожидается, что для наблюдения за процессом будет направлена группа специалистов из Лиги арабских государств. Многие мировые лидеры выступили с заявлениями, в которых восхваляли [arab_league_nation_global_target.GetName] за его решение поставить во главу угла мир и стабильность во всем мире. Действительно, представители [arab_league_nation_global_target.GetName] уже указали, что они ожидают улучшения отношений с мировым сообществом после принятия ими резолюции Лиги арабских государств."
 ARAB_LEAGUE_RESOLUTION.100.d: "\nВ кратком ответе правительство [arab_league_nation_global_target.GetName] полностью отвергло резолюцию Лиги арабских государств, призывающую к изъятию всего ее оружия массового поражения. [arab_league_nation_global_target.GetName] утверждает, что принятие такого требования поставит под угрозу их безопасность и суверенитет. Они осудили Лигу арабских государств, как моральных банкротов и марионетку иностранных интересов. Генеральный секретарь Лиги арабских государств выразил разочарование этим заявлением. Один ведущий дипломат не был удивлен ответом, заявив, что они продемонстрировал, почему международное сообщество решило действовать. Совет Безопасности, скорее всего, рассмотрит этот вопрос на своем следующем заседании."
 ARAB_LEAGUE_RESOLUTION.101.d: "\nЛига арабских государств с радостью сообщила, что правительство [GetNewspaperHeader] [arab_league_nation_global_target.GetName] недавно проинформировало Совет Безопасности о своих намерениях положить конец и уничтожить свое оружие массового поражения. Это ответ на недавнее голосование Лиги арабских государств с требованием о прекращении программы. Генеральный секретарь Лиги арабских государств похвалил руководство [GetNewspaperHeader] [arab_league_nation_global_target.GetName] за принятие правильного решения в поддержку глобального мира. В отдельном заявлении представитель [GetNewspaperHeader] [arab_league_nation_global_target.GetName] подтвердил, что они завершат программу, но настаивал на том, что его действия были предприняты не из страха или запугивания, а сделаны с учетом желаний их народа. Международная пресса восхваляла это недавнее событие и то доверие, которое они придают Лиге арабских государств, как инициативной организации глобального мира."
 ARAB_LEAGUE_RESOLUTION.131.d: "\n[arab_league_state_owner_global_target.GetName] бросил вызов Лиге арабских государств и международному сообществу, отказавшись вернуть [arab_league_state_global_target.GetName]. Решение об отказе вызвало гневные протесты в спорном районе и за его пределами. В своем заявлении правительство [arab_league_state_owner_global_target.GetName] заявило, что резолюция Лиги арабских государств является прямым вмешательством в их внутренние дела и является незаконной. Он добавил, что любые решения по его священной земле и людям будут приниматься нацией, а не иностранными державами, вмешивающимися в дела других. Ожидается, что Совет Безопасности Лиги арабских государств отреагирует на эти события на своей следующей сессии."
 ARAB_LEAGUE_RESOLUTION.132.d: "\n[Arab_league_state_global_target.GetName] согласился вернуть [arab_league_state_global_target.GetName], что считается большой победой во всем мире. Правительство [arab_league_state_global_target.GetName] заявило, что их ответственная нация примет волю мирового сообщества. Он настаивал, что решение было принято не из-за давления или страха, а из уважения. Генеральный секретарь Лиги арабских государств одобрил это решение и призвал все страны извлечь уроки из этого примера. Многие газеты по всему миру публиковали восторженные репортажи, восхваляющие Лигу арабских государств и ее способность влиять на глобальный мир и стабильность. Однако некоторые дипломаты в частном порядке выразили обеспокоенность тем, что некоторые страны теперь могут попытаться манипулировать Лигой арабских государств для достижения своих территориальных целей."
  
  ###GUI actions 
 ARAB_LEAGUE_RESOLUTION.506.t: "\nУгроза санкций"
 ARAB_LEAGUE_RESOLUTION.506.d: "\nПроизошло тревожное событие: [from.GetName] пригрозил нам санкциями, если мы не примем их предложения. Можем ли мы позволить себе игнорировать их угрозы, или мы подчинимся их требованиям и позволим им всем командовать?"
 ARAB_LEAGUE_RESOLUTION.507.t: "\nСанкция угрозы"
 ARAB_LEAGUE_RESOLUTION.507.d: "\nНаш маневр был отклонен, и [from.GetName] отказался подчиниться нашим требованиям. Как мы поступим?"
 ARAB_LEAGUE_RESOLUTION.508.t: "\nПредложение о соглашении о взаимной защите"
 ARAB_LEAGUE_RESOLUTION.508.d: "\nНезависимо от того, заботимся мы об этом или нет, мы приветствуем то, что [from.GetName] стремится подписать с нами оборонительный договор, гарантируя взаимную военную помощь."
 ARAB_LEAGUE_RESOLUTION.509.t: "\nВзяточничество раскрыто!"
 ARAB_LEAGUE_RESOLUTION.509.d: "\nПохоже, что [from.GetName] мало думает о наших чиновниках, ведь они стремились разворовать!. Мы не можем оставить это в покое."
  
  
  
