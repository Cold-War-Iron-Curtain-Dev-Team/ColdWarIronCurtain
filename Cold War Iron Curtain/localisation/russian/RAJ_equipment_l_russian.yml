 RAJ_tac_bomber_equipment_3_short: "Mosquito B"
 RAJ_jet_tac_bomber_equipment_1: "English Electric Canberra B.2"
 RAJ_jet_tac_bomber_equipment_1_short: "Canberra B.2"
 RAJ_jet_tac_bomber_equipment_2: "English Electric Canberra B.6"
 RAJ_jet_tac_bomber_equipment_2_short: "Canberra B.6"
 RAJ_jet_tac_bomber_equipment_3: "Canberra B(I).58"
 RAJ_jet_tac_bomber_equipment_3_short: "Canberra B(I).58"
 RAJ_jet_tac_bomber_equipment_3_desc: "Индия была крупнейшим экспортным заказчиком \"Канберры\" и весьма успешно использовала бомбардировщик в войнах 1965 и 1971 годов, отметившись налетами на авиабазу в Пешаваре, нефтехранилища в Карачи и ряд других военных объектов по всей территории Пакистана. На вооружении IAF состояло несколько вариантов Canberra, наиболее многочисленным из которых был B(I)58 interdictor"
 RAJ_jet_tac_bomber_equipment_4: "Canberra B(I).66"
 RAJ_jet_tac_bomber_equipment_4_short: "Canberra B(I).66"
 RAJ_jet_tac_bomber_equipment_4_desc: "Индия была крупнейшим экспортным заказчиком \"Канберры\" и весьма успешно использовала бомбардировщик в войнах 1965 и 1971 годов, отметившись налетами на авиабазу в Пешаваре, нефтехранилища в Карачи и ряд других военных объектов по всей территории Пакистана. На вооружении IAF состояло несколько вариантов Canberra, наиболее многочисленным был B(I)58 interdictor"
 RAJ_jet_tac_bomber_equipment_5: "Микоян-Гуревич МиГ-25РБК"
 RAJ_jet_tac_bomber_equipment_5_short: "МиГ-25РБК"
 RAJ_jet_tac_bomber_equipment_5_desc: "МиГ-25РБК - одноместный разведчик-бомбардировщик, производный от МиГ-25Р, основное назначение - самолет ELINT, оснащенный системой ELINT Куб-3К. Однако бомбардировочные возможности сохранены, а фотокамеры не установлены. Кодовое название НАТО Foxbat-D"
 RAJ_strat_bomber_equipment_1: "Handley Page Halifax"
 RAJ_strat_bomber_equipment_1_short: "Halifax"
 RAJ_strat_bomber_equipment_2: "Consolidated B-24L Liberator"
 RAJ_strat_bomber_equipment_2_short: "B-24L Liberator"
 RAJ_strat_bomber_equipment_2_desc: "B-24 был разработан в 1941 году как дальний тяжелый бомбардировщик для ВВС армии США. Несмотря на способность нести большую бомбовую нагрузку в сочетании с высокой крейсерской скоростью, он был относительно сложен для полетов на малых высотах и имел более низкий потолок обслуживания, чем B-17. Тем не менее, \"Либератор\" был предпочтительнее для американского Генерального штаба и стал самым производимым бомбардировщиком во Второй мировой войне. Как и B-17, он хорошо зарекомендовал себя на европейском театре военных действий во время бомбардировок Германии, но также с отличием служил и на Тихоокеанском театре военных действий."
 RAJ_strat_bomber_equipment_3: "Consolidated B-24J Liberator"
 RAJ_strat_bomber_equipment_3_short: "B-24J Liberator"
 RAJ_strat_bomber_equipment_3_desc: "После обретения Индией независимости в 1947 году от 37 до 42 \"Либераторов\" были восстановлены компанией HAL и поступили на вооружение эскадрилий No.5, No.6 и No.16. Вплоть до снятия с вооружения в 1968 году. Именно индийским ВВС обязано своим существованием большинство оставшихся B-24."
 RAJ_jump_jet_equipment_3: "BAe Sea Harrier FRS Mk.51"
 RAJ_jump_jet_equipment_3_short: "Sea Harrier FRS Mk.51"
 RAJ_jump_jet_equipment_3_desc: "Появление \"Sea Harrier\" позволило снять с вооружения предыдущий истребитель-носитель Индии Hawker Sea Hawk, а также провести в 1987-1989 гг. масштабную модернизацию авианосца INS Vikrant. Индия эксплуатировала \"Си Харриеры\" с обоих авианосцев - INS Vikrant и INS Viraat"
 RAJ_jump_jet_equipment_4: "BAe Sea Harrier FRS Mk.51 Service Life Extention Programme"
 RAJ_jump_jet_equipment_4_short: "Sea Harrier FRS Mk.51 SLEP"
 RAJ_jump_jet_equipment_4_desc: "В 2006 году ВМС Индии приступили к модернизации до 15 самолетов Sea Harrier, установив на них РЛС Elta EL/M-2032 и ракету средней дальности \"воздух-воздух\" Rafael \"Derby\" BVR. Это позволило сохранить \"Си Харриер\" на вооружении Индии после 2012 года. К 2009 году в результате аварий флот Индии сократился до 12 единиц (с первоначальных 30)."
