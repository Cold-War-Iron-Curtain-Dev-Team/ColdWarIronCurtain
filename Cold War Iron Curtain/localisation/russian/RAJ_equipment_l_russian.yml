 RAJ_cv_CAS_equipment_1_short: "Osprey"
 RAJ_cv_CAS_equipment_2: "Hawker Sea Hurricane Mk.IB"
 RAJ_cv_CAS_equipment_2_short: "Sea Hurricane Mk.IB"
 RAJ_cv_CAS_equipment_3: "Fairey Firefly Fr.1"
 RAJ_cv_CAS_equipment_3_short: "Firefly Fr.1"
 RAJ_cv_jet_CAS_equipment_1: "Fairey Firefly AS Mk.5"
 RAJ_cv_jet_CAS_equipment_1_short: "Firefly AS Mk.5"
 RAJ_cv_jet_CAS_equipment_1_desc: "Более поздний Firefly AS.Mk 5 был противолодочным самолетом, который нес американские сонобуи и оборудование."
