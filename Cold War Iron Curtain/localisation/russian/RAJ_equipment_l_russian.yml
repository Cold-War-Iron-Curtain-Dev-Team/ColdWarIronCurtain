 RAJ_cv_fighter_equipment_1_short: "Sea Gladiator"
 RAJ_cv_fighter_equipment_2: "Supermarine Seafire Mk.IIc"
 RAJ_cv_fighter_equipment_2_short: "Seafire Mk.IIc"
 RAJ_cv_fighter_equipment_3: "Supermarine Seafire Mk.XVII"
 RAJ_cv_fighter_equipment_3_short: "Seafire Mk.XVII"
 RAJ_cv_jet_multirole_equipment_1: "Supermarine Seafire F Mk.47"
 RAJ_cv_jet_multirole_equipment_1_short: "Seafire F Mk.47"
 RAJ_cv_jet_multirole_equipment_2: "de Havilland Sea Vampire F.20"
 RAJ_cv_jet_multirole_equipment_2_short: "Sea Vampire F.20"
 RAJ_cv_jet_multirole_equipment_3: "Hawker Sea Hawk F.3"
 RAJ_cv_jet_multirole_equipment_3_short: "Sea Hawk F.3"
 RAJ_cv_jet_multirole_equipment_3_desc: "На вооружении ВМС Индии (с 1960 г.) \"Си Хок\" использовались на борту авианосца INS Vikrant, бывшего HMS Hercules, и принимали участие в индо-пакистанской войне 1965 года и индо-пакистанской войне 1971 года. В последней войне самолеты Sea Hawk потопили около десятка судов"
 RAJ_cv_jet_multirole_equipment_4: "Hawker Sea Hawk FGA.6"
 RAJ_cv_jet_multirole_equipment_4_short: "Sea Hawk FGA.6"
 RAJ_cv_jet_multirole_equipment_4_desc: "На вооружении ВМС Индии (с 1960 г.) \"Си Хок\" использовались на борту авианосца INS Vikrant, бывшего HMS Hercules, и принимали участие в индо-пакистанской войне 1965 года и индо-пакистанской войне 1971 года. В последней войне самолеты Sea Hawk потопили около десятка судов"
 RAJ_cv_jet_multirole_equipment_10: "Микоян-Гуревич МиГ-29К"
 RAJ_cv_jet_multirole_equipment_10_short: "МиГ-29К"
 RAJ_cv_jet_multirole_equipment_10_desc: "Программа МиГ-29К была возрождена в связи с решением ВМС Индии о приобретении в 2004 году бывшего советского авианосца \"Адмирал Горшков\". Когда \"Адмирал Горшков\" входил в состав советского флота, он представлял собой гибрид авианосца и крейсера, использующего самолеты вертикального взлета (V/STOL), поэтому на его палубе была установлена взлетная рампа и тросы-разрядники для эксплуатации самолетов МиГ-29К. Самолет имеет увеличенное и складывающееся крыло, разгрузочный крюк и усиленный фюзеляж с антикоррозийной защитой."
