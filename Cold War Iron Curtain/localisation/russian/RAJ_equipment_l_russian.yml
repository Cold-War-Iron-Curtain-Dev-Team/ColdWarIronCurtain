 RAJ_cv_jet_CAS_equipment_4_short: "Sea Hawk FB.5"
 RAJ_cv_jet_CAS_equipment_4_desc: "На вооружении ВМС Индии (с 1960 г.) \"Sea Hawk\" использовались на борту авианосца INS Vikrant, бывшего HMS Hercules, и принимали участие в индо-пакистанской войне 1965 года и индо-пакистанской войне 1971 года. В последней войне самолеты Sea Hawk потопили около десятка судов"
