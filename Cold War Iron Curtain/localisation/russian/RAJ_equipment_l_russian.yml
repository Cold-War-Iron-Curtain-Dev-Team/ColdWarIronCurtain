l_english:
 RAJ_infantry_equipment_0: "Lee-Enfield No.1 Mk III"
 RAJ_infantry_equipment_0_short: "Lee-Enfield No.1 Mk III"
 RAJ_infantry_equipment_0_desc: "SMLE Mk III* (переименованный в 1926 году в Rifle No.1 Mk III*) широко применялся на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили SMLE Mk III* в качестве своей стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск вплоть до Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 SLR. В 1953 году завод Lithgow Small Arms Factory окончательно прекратил производство SMLE Mk III*"
 RAJ_infantry_equipment_1: "Винтовка, 7,62 мм 1A1"
 RAJ_infantry_equipment_1_short: "Ishapore 1A1"
 RAJ_infantry_equipment_1_desc: "Винтовка 7,62 мм 1A1, также известная как Ishapore 1A1, является копией самозарядной винтовки L1A1. Ishapore 1A1 производится на заводе Ordnance Factory Tiruchirappalli. Она отличается от британской SLR тем, что в деревянном прикладе используется приклад от Lee-Enfield с местом для масленки и прорезями для чистки"
 RAJ_infantry_equipment_2: "Модернизированный автомат Калашникова"
 RAJ_infantry_equipment_2_short: "АКМ"
 RAJ_infantry_equipment_2_desc: "АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Тимофеевичем Калашниковым в конце 1950-х годов и поступивший на вооружение Советской Армии в 1959 году. Многое в оружии было оптимизировано и переработано под нужды модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена на U-образную стальную штамповку для повышения темпов производства. В результате упрощений оружие стало значительно легче, а его вес снизился на ~30%. Кроме того, оружие было усилено, чтобы сделать его более прочным, и добавлены направляющие для улучшения движения затворной рамы. АКМ сразу же получил широкое распространение во многих коммунистических странах и использовался в конфликтах на протяжении всего периода своего существования. В частности, во время вторжения в Чехословакию, где он использовался обеими сторонами."
 RAJ_infantry_equipment_3: "Стандартная винтовка INSAS"
 RAJ_infantry_equipment_3_short: "INSAS"
 RAJ_infantry_equipment_3_desc: "INSAS (аббревиатура от INdian Small Arms System) - это семейство пехотного оружия, состоящее из штурмовой винтовки и легкого пулемета (LMG). Оно производится на заводах Ordnance Factory Tiruchirappalli, Small Arms Factory Kanpur и Ishapore Arsenal. Штурмовая винтовка INSAS была стандартным пехотным оружием индийских вооруженных сил в начале 2000-х годов"
 RAJ_infantry_equipment_4: "1B1 INSAS Standard Rifle"
 RAJ_infantry_equipment_4_short: "1B1 INSAS"
 RAJ_infantry_equipment_4_desc: "Во время Каргильской войны 1999 года винтовки использовались на высоких горах Гималаев. Поступали жалобы на заклинивание, растрескивание магазина от холода и переход винтовки в автоматический режим, когда она была настроена на стрельбу очередями по три патрона. Была также проблема с попаданием масла в глаза оператора. Вариант 1B1 был введен для решения проблем с надежностью винтовки еще во время Каргильской войны, но это привело к появлению других проблем, таких как поломка магазинов."
 RAJ_squad_weapons_3: "Пулемет 7.62MM IA"
 RAJ_squad_weapons_3_short: "Gun Machine 7.62MM IA"
 RAJ_squad_weapons_5: "Легкий пулемет INSAS"
 RAJ_squad_weapons_5_short: "INSAS LMG"
 RAJ_specialist_5: "Vidhwansak"
 RAJ_specialist_5_short: "Vidhwansak"
 RAJ_ammo_explosives_4: "Граната Shivalik"
 RAJ_ammo_explosives_4_short: "Граната Shivalik"
 RAJ_lt_equipment_1: "M3A1 Stuart"
 RAJ_lt_equipment_1_short: "M3A1 Stuart"
 RAJ_lt_equipment_1_desc: "M3 Stuart, официально легкий танк M3, был американским легким танком времен Второй мировой войны. Усовершенствованная версия поступила на вооружение под обозначением M5. До вступления США в войну он поставлялся британским войскам и войскам стран Содружества по ленд-лизу. После этого он использовался американскими и союзными войсками до конца войны."
 RAJ_lt_equipment_2: "T17E1 Staghound"
 RAJ_lt_equipment_2_short: "T17E1 Staghound"
 RAJ_lt_equipment_2_desc: "Первые бронеавтомобили с пушечным вооружением появились на британских складах. Staghound использовался во время аннексии Хайдрабада бронеавтомобильными кавалерийскими подразделениями штата Хайдарабад, в частности уланами, а затем при аннексии Гоа, Дамана и Диу в 1961 году."
 RAJ_lt_equipment_3: "PT-76"
 RAJ_lt_equipment_3_short: "PT-76"
 RAJ_lt_equipment_3_desc: "ПТ-76 - советский легкий танк-амфибия, который был представлен в начале 1950-х годов и вскоре стал стандартным разведывательным танком Советской Армии и других вооруженных сил Варшавского договора. Он широко экспортировался в другие дружественные государства, такие как Индия, Ирак, Сирия, Северная Корея и Северный Вьетнам. В целом, около 25 стран использовали ПТ-76"
 RAJ_lt_equipment_4: "AMX-13/75"
 RAJ_lt_equipment_4_short: "AMX-13/75"
 RAJ_lt_equipment_4_desc: "AMX-13 - французский легкий танк, выпускавшийся с 1952 по 1987 год. Он служил во французской армии под обозначением Char 13t-75 Modèle 51 и экспортировался в более чем 25 других стран, включая Индию. Назван в честь своего начального веса в 13 тонн и отличается жестким и надежным шасси"
 RAJ_lt_equipment_5: "Легкий танк DRDO"
 RAJ_lt_equipment_5_short: "DRDO Light Tank"
 RAJ_lt_equipment_5_desc: "Легкий танк DRDO - это гусеничный легкий танк-амфибия, разработанный в Индии компанией DRDO. Он создан на базе шасси \"Sarath\", лицензионного варианта БМП, построенного на оружейном заводе Medak с французской башней GIAT TS-90 и 105-мм пушкой. Эта машина предназначена для перевозки оружия высокого калибра без ущерба для мобильности."
 RAJ_lt_equipment_6: "Бронированная инженерно-разведывательная машина Ordnance Factory Medak"
 RAJ_lt_equipment_6_short: "AERV"
 RAJ_lt_equipment_6_desc: "Бронированная инженерная разведывательная машина (AERV) - это индийская военная инженерная машина, разработанная Vehicle Research and Development Establishment, Ahmednagar совместно с Research and Development Establishment, Pune, в координации с C-TEC, в соответствии с КО индийской армии для обеспечения возможности боевым инженерам проводить операции по разведке. Он производится на оружейном заводе Медак"
 RAJ_mbt_equipment_0: "Grant М3"
 RAJ_mbt_equipment_0_short: "M3 Grant"
 RAJ_mbt_equipment_0_desc: "После того, как силы Британского Содружества в Европе и Средиземноморье начали получать M4 Shermans, около 900 заказанных британцами M3 Lees/Grants были отправлены в Индийскую армию. Некоторые из них участвовали в борьбе с японскими войсками и танками в Бирманской кампании Второй мировой войны."
 RAJ_mbt_equipment_1: "M4A4 Sherman V"
 RAJ_mbt_equipment_1_short: "M4A4 Sherman V"
 RAJ_mbt_equipment_1_desc: "M4 Sherman, официально Medium Tank, M4, был самым широко используемым средним танком Соединенных Штатов и западных союзников во Второй мировой войне. M4 Sherman оказался надежным, относительно дешевым в производстве и доступным в большом количестве. Он также послужил основой для нескольких успешных танков-уничтожителей, таких как M10, 17pdr SP Achilles и M36. Десятки тысяч были распределены по программе ленд-лиза среди стран Британского Содружества и Советского Союза."
 RAJ_mbt_equipment_2: "Sherman V D-56T"
 RAJ_mbt_equipment_2_short: "Sherman V D-56T"
 RAJ_mbt_equipment_2_desc: "После того, как Индия унаследовала парк \"Шерманов\", отправленный в 1947 году британским раджем, индийские военные имели на вооружении \"Шерманы\" M4A3 и M4A4, которые впоследствии были модернизированы французскими 75-мм пушками CN 75-50 (FL-10) и советской пушкой Д-56Т."
 RAJ_mbt_equipment_3: "Centurion Mk.7"
 RAJ_mbt_equipment_3_short: "Centurion Mk.7"
 RAJ_mbt_equipment_3_desc: "Centurion был основным боевым танком британской армии периода после Второй мировой войны. Представленный в 1945 году, он считается одной из самых удачных послевоенных танковых конструкций, оставаясь в производстве до 1960-х годов и участвуя в боевых действиях на передовой до 1980-х годов. Шасси также было адаптировано для выполнения ряда других задач. Оно входило в состав индийских танковых батальонов"
 RAJ_mbt_equipment_4: "HVF Vijayanta Mk.1"
 RAJ_mbt_equipment_4_short: "Vijayanta Mk.1"
 RAJ_mbt_equipment_4_desc: "Vijayanta (англ. \"Victorious\", ру. \"Победоносный\") - основной боевой танк, созданный в Индии на основе лицензионного проекта Vickers Mk.1. Прототип был создан в 1963 году, а на вооружение танк поступил 29 декабря 1965 года. Первые 90 машин были построены компанией Vickers в Великобритании. Производство продолжалось на заводе тяжелых машин в Авади до 1983 года, было построено 2 200 машин."
 RAJ_mbt_equipment_5: "HVF T-55A Gulmohar"
 RAJ_mbt_equipment_5_short: "T-55A Gulmohar"
 RAJ_mbt_equipment_5_desc: "Индийская модернизированная версия Т-55, вооруженная 105-мм основным орудием L7 от танка \"Vijayanta\", имевшим дымоотводы. Во время индо-пакистанской войны 1971 года для отличия от пакистанских Type 59 на стволах были установлены трубки из листовой стали, имитирующие дымоотводы."
 RAJ_mbt_equipment_6: "HVF T-72 Ajeya Mk.1"
 RAJ_mbt_equipment_6_short: "T-72 Ajeya Mk.1"
 RAJ_mbt_equipment_6_desc: "Версия Т-72М1. Параллельно с закупкой у Советского Союза различных Т-72М, Индия также запустила их внутреннее производство на заводе тяжелых машин. К концу 1970-х годов штаб индийской армии принял решение о приобретении замены нового поколения для своего парка танков Centurion и Vijayanta, изготовленных на британских заводах Royal Ordnance Factories, основанных на лицензионном производстве танков Vickers MBT, и, соответственно, индийская армия провела оценку огневой мощи и характеристик мобильности двух основных претендентов, предлагаемых для серийного производства во Франции AMX-40 и Chieftain 800 (который позже превратился в Challenger 1 производства Royal Ordnance Factories. "
 RAJ_mbt_equipment_7: "HVF T-72 Ajeya Mk.2"
 RAJ_mbt_equipment_7_short: "T-72 Ajeya Mk.2"
 RAJ_mbt_equipment_7_desc: "Версия Т-72М1 с ERA и банками по 6 дымовых гранатометов с каждой стороны. К концу 1970-х годов штаб индийской армии решил приобрести замену нового поколения для своего парка танков Centurion и Vijayanta, построенных на британских заводах Royal Ordnance Factories, основанных на лицензионном производстве танков Vickers MBT, и, следовательно, индийская армия провела оценку огневой мощи и характеристик мобильности двух основных претендентов, предлагаемых для серийного производства во Франции AMX-40 и Chieftain 800 (который позже превратился в Challenger 1 производства Royal Ordnance Factories. "
 RAJ_mbt_equipment_8: "DRDO Arjun Mk.1"
 RAJ_mbt_equipment_8_short: "Arjun Mk.1"
 RAJ_mbt_equipment_8_desc: "Arjun - это основной боевой танк третьего поколения, разработанный Индийской организацией оборонных исследований и разработок (DRDO) для индийской армии. Танк назван в честь Арджуна, принца-лучника, главного героя индийского эпоса Махабхарата. Arjun имеет основную нарезную пушку калибра 120 мм с боеприпасами собственной разработки с бронебойным оперением, стабилизированным отбрасывающим сабо, один коаксиальный пулемет PKT калибра 7,62 мм и пулемет NSVT калибра 12,7 мм. Он оснащен одним многотопливным дизельным двигателем MTU мощностью 1400 л.с. и может развивать максимальную скорость 67 км/ч (42 миль/ч) и скорость по пересеченной местности 40 км/ч (25 миль/ч)."
 RAJ_mbt_equipment_9: "HVF T-90S Bhishma"
 RAJ_mbt_equipment_9_short: "T-90S Bhishma"
 RAJ_mbt_equipment_9_desc: "Обозначение T-90S (Объект 188S), оснащен новыми сварными башнями и двигателем V-92S2 мощностью 1000 л.с. (735 кВт). Официально называется \"Бхишма\", достраивается в Индии из поставляемых Россией комплектов, а затем постепенно заменяется деталями местного производства."
 RAJ_mechanized_equipment_1: "Колёсный бронетранспортер индийского образца"
 RAJ_mechanized_equipment_1_short: "ACV-IP"
 RAJ_mechanized_equipment_1_desc: "Колёсный бронетранспортер индийского образца (ACV-IP), известный также как Indian Pattern Carrier или другие подобные названия, был бронированным автомобилем, производившимся в Индии во время Второй мировой войны. Как правило, он был вооружен легким пулеметом Bren. Бронемашины, произведенные компанией Tata Locomotives, назывались \"Татанагарами\" по месту расположения завода."
 RAJ_mechanized_equipment_2: "Bren Carrier Mk.II"
 RAJ_mechanized_equipment_2_short: "Bren Carrier Mk.II"
 RAJ_mechanized_equipment_2_desc: "Universal Carrier, также известный как Bren Gun Carrier, а иногда просто Bren Carrier из-за легкого пулеметного вооружения, является общим названием, описывающим семейство легких бронированных гусеничных машин, построенных Vickers-Armstrongs и другими компаниями. "
 RAJ_mechanized_equipment_3: "Loyd Carrier"
 RAJ_mechanized_equipment_3_short: "Loyd Carrier"
 RAJ_mechanized_equipment_3_desc: "Loyd Carrier был одним из ряда небольших гусеничных машин, использовавшихся британскими войсками и войсками Содружества во Второй мировой войне для перевозки техники и людей на поле боя. Наряду с Bren, Scout и Machine Gun Carriers, они также перевозили оружие поддержки пехоты. "
 RAJ_mechanized_equipment_4: "BTR-152"
 RAJ_mechanized_equipment_4_short: "БТР-152"
 RAJ_mechanized_equipment_4_desc: "БТР-152 (также известный как БТР-140) - шестиколесный советский бронетранспортер, построенный на шасси и трансмиссии грузовика ЗиС-151. Он поступил на вооружение ряда стран-членов Варшавского договора в 1950 г. и составлял основу советских мотострелковых батальонов до появления амфибийных БТР-60 в 1960-х гг. БТР-152 был доступен в нескольких модификациях и производился в большом количестве для советских военных и на экспорт. В поздних моделях использовались автомобильные компоненты от более надежного грузовика ЗИЛ-157."
 RAJ_mechanized_equipment_5: "БТР-60"
 RAJ_mechanized_equipment_5_short: "БТР-60"
 RAJ_mechanized_equipment_5_desc: "БТР-60 - первая машина в серии советских восьмиколесных бронетранспортеров (БТР). Он был разработан в конце 1950-х годов в качестве замены БТР-152 и впервые появился на публике в 1961 году"
 RAJ_mechanized_equipment_6: "БТР-60ПБ"
 RAJ_mechanized_equipment_6_short: "БТР-60ПБ"
 RAJ_mechanized_equipment_6_desc: "Улучшенная прицельная система для 14,5-мм тяжелого пулемета КПВТ и усовершенствованный двигатель ГАЗ-49Б. Башенка была модифицирована для установки нового оптического прицела, 14,5-мм тяжелый пулемет КПВТ и 7,62-мм коаксиальный легкий пулемет ПКТ были смещены вправо, а оптический прицел установлен коаксиально слева. Бронезащита также была улучшена"
 RAJ_mechanized_equipment_7: "OT-64B"
 RAJ_mechanized_equipment_7_short: "OT-64B"
 RAJ_mechanized_equipment_7_desc: "OT-64 был предназначен для замены полугусеничного танка OT-810, который был почти идентичен немецкому Sd.Kfz. 251 времен Второй мировой войны. Первый прототип был построен в 1959 году. В 1961 году была построена первая опытная серия, а с октября 1963 года машины производились в Люблине, Польша, на заводе Fabryka Samochodów Ciężarowych."
 RAJ_mechanized_equipment_8: "БТР-80"
 RAJ_mechanized_equipment_8_short: "БТР-80"
 RAJ_mechanized_equipment_8_desc: "Советские войска создали БТР-80 на базе БТР-70. Он оснащен одним 260-сильным дизельным двигателем V-8 с турбонаддувом и водяным охлаждением, что является улучшением по сравнению с двумя бензиновыми двигателями, установленными на машинах БТР-60 и БТР-70. Переделанная задняя часть корпуса вмещает новый, единственный двигатель. Советские специалисты убрали фаски крыши модифицированного БТР-70, подняли заднюю часть и сделали более квадратным наклоненный назад моторный отсек."
 RAJ_mechanized_equipment_9: "Vickers OMC Casspir Mk.3"
 RAJ_mechanized_equipment_9_short: "Casspir Mk.3"
 RAJ_mechanized_equipment_9_desc: "Casspir - это машина с защитой от мин и засад, которая используется в Южной Африке с 1980-х годов. Это четырехколесный, полноприводный автомобиль, используемый для перевозки войск. Он вмещает экипаж из двух человек, а также 12 дополнительных солдат и сопутствующее оборудование"
 RAJ_mechanized_equipment_10: "Tata Kestrel"
 RAJ_mechanized_equipment_10_short: "Kestrel"
 RAJ_mechanized_equipment_10_desc: "TATA Kestrel - это современный бронетранспортер, разработанный компанией Tata Motors и Организацией оборонных исследований и разработок (DRDO). Он спроектирован и изготовлен по образцу различных западных образцов БТР. Он был разработан с намерением заменить устаревшие советские БМП и БТР, состоястоявшие на вооружении индийской армии."
 RAJ_mechanized_heavy_equipment_3_short: "БТР-50P"
 RAJ_mechanized_heavy_equipment_3: "БТР-50П"
 RAJ_mechanized_heavy_equipment_3_desc: "БТР-50 - советский амфибийный бронетранспортер, созданный на базе легкого танка ПТ-76. БТР-50 - гусеничный, в отличие от большинства колесных БТР"
 RAJ_mechanized_heavy_equipment_4: "БМП-1"
 RAJ_mechanized_heavy_equipment_4_short: "БМП-1"
 RAJ_mechanized_heavy_equipment_4_desc: "БМП-1 - советская гусеничная боевая машина пехоты амфибийного типа. БМП-1 стала первой серийной боевой машиной пехоты (БМП) Советского Союза. До того, как стало известно ее правильное обозначение, в НАТО она называлась М-1967, БМП и БМП-76ПБ."
 RAJ_mechanized_heavy_equipment_5: "БМП-1П"
 RAJ_mechanized_heavy_equipment_5_short: "БМП-1П"
 RAJ_mechanized_heavy_equipment_5_desc: "После окончания войны в Сирию было направлено несколько советских технических групп для сбора информации. Полученный опыт в сочетании с наблюдениями за развитием западной автомобильной техники привел к тому, что в 1974 году была разработана программа замены оригинальной БМП. Первым продуктом этой программы стала модернизация БМП-1П, которая была предназначена для устранения наиболее серьезных проблем существующей конструкции."
 RAJ_mechanized_heavy_equipment_6: "БМП-2 "
 RAJ_mechanized_heavy_equipment_6_short: "БМП-2"
 RAJ_mechanized_heavy_equipment_6_desc: "БМП-2 - боевая машина пехоты второго поколения, созданная в 1980-х годах в Советском Союзе на базе БМП-1 1960-х годов."
 RAJ_mechanized_heavy_equipment_7: "DRDO Abhay ICV"
 RAJ_mechanized_heavy_equipment_7_short: "Abhay ICV"
 RAJ_mechanized_heavy_equipment_7_desc: "Abhay (санскр. अभय, \"Бесстрашный\") - боевая машина пехоты (БМП), разработанная в Индии Организацией оборонных исследований и разработок (DRDO). Abhay разрабатывается как демонстратор технологий для замены БМП-2 индийской армии. В настоящее время различные системы этой машины находятся на продвинутых стадиях разработки"
 RAJ_mechanized_heavy_equipment_8: "Ordnance Factory Medak BMP-II Sarath"
 RAJ_mechanized_heavy_equipment_8_short: "БМП-II Sarath"
 RAJ_mechanized_heavy_equipment_8_desc: "БМП-2 \"Sarath (Chariot of Victory), также известная как БМП-II - индийский лицензионный вариант БМП-2, построенный на заводе Ordnance Factory Medak. Первая машина, собранная из комплектующих, поставленных KBP, была готова в 1987 году. К 1999 году в Индии производилось около 90% всей машины и связанных с ней систем. По оценкам, к 2007 году было построено 1250 машин. По состоянию на февраль 2020 года было изготовлено около 2500 \"Саратхов\"."
 RAJ_motorized_equipment_1: "Грузовик Dodge T-234 \"Burma\" 4x4"
 RAJ_motorized_equipment_1_short: "T-234 \"Бирма\" 4x4"
 RAJ_motorized_equipment_1_desc: "Грузовики Canadian Military Pattern (CMP) - взаимосогласованные линейки военных грузовиков, выпускавшиеся в большом количестве, в нескольких классах и многочисленных модификациях канадскими филиалами американских автопроизводителей \"большой тройки\" во время Второй мировой войны по спецификациям британской армии, предназначенные в основном для использования в армиях союзников Британского Содружества, а также в других частях Британской империи. "
 RAJ_motorized_equipment_2: "Nissan 1-ton 4W73 4x4"
 RAJ_motorized_equipment_2_short: "4W73 1-t 4x4"
 RAJ_motorized_equipment_2_desc: "Nissan 4W73, также известный как Nissan 1-ton, был в значительной степени вдохновлен грузовиком Dodge M37, 4x4, который был представлен в 1951 году и стал одним из самых успешных военных автомобилей, используемых вооруженными силами США."
 RAJ_motorized_equipment_3: "VFJ Shaktiman 4X4"
 RAJ_motorized_equipment_3_short: "Shaktiman 4X4"
 RAJ_motorized_equipment_3_desc: "Shaktiman - это версия MAN 415, созданная по лицензии. Грузовики Shaktiman были наиболее распространенными среднетоннажными грузовиками в вооруженных силах Индии. Они производились с 1959 по 1996 гг. на заводе Vehicle Factory Jabalpur, (VFJ), входящем в состав Indian Ordnance Factories Board."
 RAJ_motorized_equipment_4: "Tata 1210 SD 4x4"
 RAJ_motorized_equipment_4_short: "Tata 1210 SD 4x4"
 RAJ_motorized_equipment_4_desc: "Tata 1210 SD - это полноприводный военный грузовик, созданный компанией Tata. Он способен перевозить груз массой 4 тонны по бездорожью и пересеченной местности."
 RAJ_motorized_equipment_5: "Tata LPTA 713 Troop Carrier 4x4"
 RAJ_motorized_equipment_5_short: "Ashok Leyland Stallion 4x4"
 RAJ_motorized_equipment_5_desc: "Семейство грузовиков Stallion производится на заводе Vehicle Factory Jabalpur (VFJ) компании Ordnance Factory Board для вооруженных сил Индии. По состоянию на 2010 г. на вооружении индийской армии находилось более 60 тыс. грузовиков Stallion, несколько тысяч из них используются в ITBP. Stallions заменили бывшие \"рабочие лошадки\" вооруженных сил - грузовики Shaktiman, которые в настоящее время выводятся из эксплуатации."
 RAJ_auto_cannon_equipment_1: "QF 40 mm Mk. 1"
 RAJ_auto_cannon_equipment_1_short: "QF 40 mm Mk. 1"
 RAJ_auto_cannon_equipment_2: "L/70 Bofors 40 mm gun"
 RAJ_auto_cannon_equipment_2_short: "L/70 Bofors"
 RAJ_auto_cannon_equipment_3: "60L/70G Bofors Rapid-Fire Gun"
 RAJ_auto_cannon_equipment_3_short: "60L/70G Bofors"
 RAJ_auto_cannon_equipment_4: "60L/70G Bofors Rapid-Fire Gun w/ HSA L4/5 Radar"
 RAJ_auto_cannon_equipment_4_short: "60L/70G w/ L4/5"
 RAJ_auto_cannon_equipment_5: "Sudarshan CIWS"
 RAJ_auto_cannon_equipment_5_short: "Sudarshan CIWS"
 RAJ_spaag_equipment_1: "Morris-Commercial C9/B Self-Propelled 40mm Bofors"
 RAJ_spaag_equipment_1_short: "Morris C9/B Self-Propelled 40mm Bofors"
 RAJ_spaag_equipment_1_desc: "40-мм пушка Bofors, часто называемая просто пушкой Bofors, - зенитная автопушка, разработанная в 1930-х годах шведской оружейной компанией AB Bofors. Во время Второй мировой войны это была одна из самых популярных зенитных систем среднего калибра, использовавшаяся большинством западных союзников, а также некоторые захваченные системы, применявшиеся державами оси. Небольшое количество этих орудий остается на вооружении и по сей день, причем они использовались и во время войны в Персидском заливе."
 RAJ_spaag_equipment_3: "ЗСУ-23-4 Шилка"
 RAJ_spaag_equipment_3_short: "ЗСУ-23-4 Шилка"
 RAJ_spaag_equipment_3_desc: "ЗСУ-23-4 \"Шилка\" с радиолокационным наведением и четырьмя 23-мм (0,90\") автопушками - революционный ЗСУ, зарекомендовавший себя как чрезвычайно эффективное оружие против штурмовиков и вертолетов противника при любых погодных и световых условиях. ЗСУ-23-4 обладает очень высокой плотностью, скорострельностью и точностью огня, а также способностью каждой из четырех автопушек стрелять снарядами своего типа из отдельных лент. Хотя технически возможно, что каждая пушка стреляет разными типами боеприпасов, в конце 1970-х годов широко использовались два типа - зажигательные осколочные ОФЗТ и бронебойно-трассирующие БЗТ, которые должны были заряжаться в соотношении 3:1 - три ОФЗТ, затем один БЗТ, причем каждый 10-й снаряд БЗТ снаряжался так называемым \"удалителем меди\" и маркировался. Операторам категорически не рекомендовалось стрелять из одного ствола"
 RAJ_spaag_equipment_4: "ЗСУ-23-4М \"Шилка"
 RAJ_spaag_equipment_4_short: "ЗСУ-23-4М Шилка"
 RAJ_spaag_equipment_4_desc: "ЗСУ-23-4 \"Шилка\" с радиолокационным наведением и четырьмя 23-мм (0,90\") автопушками - революционный ЗСУ, зарекомендовавший себя как чрезвычайно эффективное оружие против штурмовиков и вертолетов противника при любых погодных и световых условиях. ЗСУ-23-4 обладает очень высокой плотностью, скорострельностью и точностью огня, а также способностью каждой из четырех автопушек стрелять снарядами своего типа из отдельных лент. Хотя технически возможно, что каждая пушка стреляет разными типами боеприпасов, в конце 1970-х годов широко использовались два типа - зажигательные осколочные ОФЗТ и бронебойно-трассирующие БЗТ, которые должны были заряжаться в соотношении 3:1 - три ОФЗТ, затем один БЗТ, причем каждый 10-й снаряд БЗТ снаряжался так называемым \"удалителем меди\" и маркировался. Операторам категорически не рекомендовалось стрелять из одного ствола"
 RAJ_spaag_equipment_5: "2К22М \"Тунгуска"
 RAJ_spaag_equipment_5_short: "2К22М Тунгуска"
 RAJ_spaag_equipment_5_desc: "2К22М \"Тунгуска\" - российское гусеничное самоходное зенитное орудие, вооруженное зенитно-ракетным комплексом \"земля-воздух\". Предназначена для защиты пехотных и танковых полков от низколетящих самолетов, вертолетов и крылатых ракет в любых погодных условиях в дневное и ночное время. Ее условное наименование по классификации НАТО - SA-19 'Grison'"
 RAJ_light_artillery_equipment_1: "Ordnance QF 18-pounder Mk.II"
 RAJ_light_artillery_equipment_1_short: "QF 18-pounder Mk.II"
 RAJ_light_artillery_equipment_1_desc: "Орудие Ordnance QF 18-pounder, или просто 18-pounder, являлось стандартным полевым орудием Британской империи времен Первой мировой войны. Она составляла основу Королевской полевой артиллерии во время войны и производилась в больших количествах. Оно использовалось британскими войсками на всех основных театрах военных действий, а также британскими войсками в России в 1919 г."
 RAJ_light_artillery_equipment_2: "Ordnance QF 25-pounder Mk.IV"
 RAJ_light_artillery_equipment_2_short: "QF 25-pounder Mk.IV"
 RAJ_light_artillery_equipment_3: "105mm Indian Field Gun Mk.1"
 RAJ_light_artillery_equipment_3_short: "105mm Indian Field Gun Mk.1"
 RAJ_light_artillery_equipment_3_desc: "105-мм полевая пушка Indian Field Gun была разработана компанией Armament Research and Development Establishment, или ARDE, в 1972 году. Она представляет собой буксируемый вариант британской 105-мм гаубицы L13, установленной на FV433 Abbot"
 RAJ_light_artillery_equipment_4: "105-мм индийская полевая пушка Mk.2"
 RAJ_light_artillery_equipment_4_short: "105mm Indian Field Gun Mk.2"
 RAJ_light_artillery_equipment_4_desc: "105-мм полевая пушка Indian Field Gun была разработана компанией Armament Research and Development Establishment, или ARDE, в 1972 году. Она представляет собой буксируемый вариант британской 105-мм гаубицы L13, установленной на FV433 Abbot"
 RAJ_light_artillery_equipment_5: "105-мм индийская полевая пушка Mk.3"
 RAJ_light_artillery_equipment_5_short: "105mm Indian Field Gun Mk.3"
 RAJ_light_artillery_equipment_5_desc: "105-мм полевая пушка Indian Field Gun была разработана компанией Armament Research and Development Establishment, или ARDE, в 1972 году. Она представляет собой буксируемый вариант британской 105-мм гаубицы L13, установленной на FV433 Abbot"
 RAJ_light_sp_artillery_equipment_1: "25pdr SP, гусеничная, Sexton"
 RAJ_light_sp_artillery_equipment_1_short: "Sexton"
 RAJ_light_sp_artillery_equipment_2: "FV433 Abbot"
 RAJ_light_sp_artillery_equipment_2_short: "FV433 Abbot"
 RAJ_light_sp_artillery_equipment_3: "FV433 Abbot Mk.2"
 RAJ_light_sp_artillery_equipment_3_short: "FV433 Abbot Mk.2"
 RAJ_light_sp_artillery_equipment_4: "Гусеничная минометная машина БМП-2 Carrier"
 RAJ_light_sp_artillery_equipment_4_short: "БМП-2 Carrier Mortar Tracked Vehicle"
 RAJ_light_sp_artillery_equipment_4_desc: "Безбашенный вариант имеет 81-мм миномет, установленный в модифицированном десантном отделении. Огонь ведется через отверстие в крыше корпуса с двумя распашными дверцами. Максимальная дальность стрельбы составляет 5 000 м, нормальная скорострельность - 6-8 выстрелов/мин. Существует также вариант миномета повышенной дальности"
 RAJ_light_sp_artillery_equipment_5: "Tata LPTA-713 w/ Garuda 105mm Ultra Light Gun"
 RAJ_light_sp_artillery_equipment_5_short: "Tata LPTA-71 w/ Garuda 105mm"
 RAJ_light_sp_artillery_equipment_5_desc: "Легкое орудие Kalyani Garuda 105, созданное на базе Mandus Hawkeye. Машина и пушка - OFB`s, только система отдачи - Kalyani. На вооружение горных формирований она пока не поступала. Они хорошо отработаны и, будучи установленными на пикапы, идеально подходят для стрельбы и передвижения, не давая противнику времени на обстрел"
 RAJ_artillery_equipment_1: "BL 5.5-inch среднее орудие"
 RAJ_artillery_equipment_1_short: "BL 5.5-inch"
 RAJ_artillery_equipment_1_desc: "В январе 1939 года была выдана спецификация на орудие для замены 6-дюймовых 26-квт гаубиц, состоявших на вооружении большинства средних батарей. Первые подразделения были оснащены в Великобритании летом 1941 г., а через год - в Северной Африке. 20 орудий оснастили британские и свободные французские батареи в Эль-Аламейне. Впоследствии ею были оснащены также канадские, австралийские, южноафриканские, польские и индийские полки, а после войны она использовалась и Новой Зеландией. Во время Второй мировой войны обычная организация полка состояла из 16 орудий, объединенных в две батареи. После войны пушка калибра 5,5 осталась на вооружении. Она использовалась Королевской артиллерией в операциях в Корее, Южной Аравии и на Борнео. Вероятно, она использовалась индийской армией в войнах против Пакистана, а также применялась пакистанской армией против Индии в горах Кашмира во время Каргильской войны 1999 года."
 RAJ_artillery_equipment_2: "M-46"
 RAJ_artillery_equipment_2_short: "M-46"
 RAJ_artillery_equipment_2_desc: "М-46 была разработана на основе 130-мм морской пушки М-36, применявшейся на кораблях и для береговой обороны. Это настоящая пушка, не способная вести огонь под углом более 45°, имеющая длинный ствол и один метательный заряд. В отличие от нее, большинство западных полевых орудий этого периода имели возможность ведения огня под большим и малым углами, т.е. были орудием-гаубицей. Она имеет ствол 39-го калибра с горизонтальным скользящим затвором со стяжной муфтой и дульным тормозом типа \"перечный горшок\". Последний не отличается высокой эффективностью, но, по субъективным отзывам, достаточно эффективно снижает дульную вспышку. Гидропневматическая система отдачи состоит из буфера, расположенного под стволом, и рекуператора, расположенного над стволом. Длинный ствол позволяет использовать значительный заряд, обеспечивая большую длину ствола для достижения \"полного сгорания\" и, следовательно, пространства для разгона снаряда, что позволяет достичь дульной скорости 930 м/с"
 RAJ_artillery_equipment_3: "D-30A"
 RAJ_artillery_equipment_3_short: "Д-30А"
 RAJ_artillery_equipment_3_desc: "122-мм гаубица Д-30 (индекс ГРАУ 2А18) - советская гаубица, впервые поступившая на вооружение в 1960 году. Это надежный образец, в котором сосредоточены основные характеристики буксируемого полевого орудия, пригодного для эксплуатации в любых условиях. Максимальная дальность стрельбы Д-30 составляет 15,4 км, а при использовании боеприпасов РПД - более 21 км. Удивительная трехногая установка позволяет быстро разворачивать Д-30 на 360 градусов. Хотя Д-30 больше не производится в странах бывшего Советского Союза, он по-прежнему выпускается за рубежом и состоит на вооружении более чем в 60 странах мира."
 RAJ_artillery_equipment_4: "155-мм гаубица Fälthaubits 77"
 RAJ_artillery_equipment_4_short: "FH-77 155mm Howitzer"
 RAJ_artillery_equipment_4_desc: "Fälthaubits 77 (швед. \"полевая гаубица 77\") или FH77 - шведская 155-мм гаубица. Она была разработана и производилась компанией Bofors. Она выпускалась в двух вариантах: первоначальный (иногда называемый Haubits 77 A) со стволом 38 калибра и механизмом скользящего блока и более поздний экспортный вариант FH77 B со стволом 39 калибра и винтовой казенной частью с прерывистым затвором. "
 RAJ_artillery_equipment_5: "M777 155mm Howitzer"
 RAJ_artillery_equipment_5_short: "M777 155mm Howitzer"
 RAJ_artillery_equipment_5_desc: "Гаубица M777 - буксируемая 155-мм артиллерийская установка. В 2005 году она пришла на смену гаубице M198 в Корпусе морской пехоты и Армии США. M777 также используется в сухопутных войсках Австралии, Канады, Индии и Саудовской Аравии. Ее боевой дебют состоялся в ходе войны в Афганистане. M777 производится подразделением Global Combat Systems компании BAE Systems"
 RAJ_sp_artillery_equipment_3: "Катапульта М-46"
 RAJ_sp_artillery_equipment_3_short: "M-46 Catapult"
 RAJ_sp_artillery_equipment_3_desc: "M-46 Catapult - самоходное орудие, разработанное в Индии компанией Combat Vehicles Research & Development Establishment, входящей в состав Defence Research & Development Organisation. Она создана на основе переделки устаревшего корпуса британского/индийского танка Vijayanta, на котором установлена российская 130-мм полевая пушка М-46."
 RAJ_sp_artillery_equipment_4: "Самоходная гаубица Tata 155 T5-52"
 RAJ_sp_artillery_equipment_4_short: "155-мм самоходная гаубица T5-52 SPH"
 RAJ_sp_artillery_equipment_4_desc: "Моторизованная гаубица, названная на 55% отечественной, была разработана совместно TATA Power SED и южноафриканской компанией DENEL Land Systems, внесенной индийским правительством в черный список по обвинению во взяточничестве. По сути, это переработанная версия гаубицы T5-52 компании DENEL (которая демонстрировалась на выставке DEFEXPO 2002 вместе с ATMOS компании SOLTAM Systems, причем обе они в то время использовали специализированный грузовик 8х8, поставляемый компанией TATA Motors."
 RAJ_sp_artillery_equipment_5: "K9 Vajra-T"
 RAJ_sp_artillery_equipment_5_short: "K9 Vajra-T"
 RAJ_sp_artillery_equipment_5_desc: "Hanwha Techwin объединилась с индийским конгломератом Larsen and Toubro Limited для поставки 100 орудий K9-T (известных в Индии как K-9 Vajra) на конкурс гаубиц для индийской армии. В сентябре 2015 года компания Larsen and Toubro стала финалистом конкурса на получение контракта стоимостью 800 млн долларов США на поставку 100 самоходных гаубиц для индийской армии. Речь идет о машине K9 VAJRA-T - варианте K9, специально разработанном для эксплуатации в пустынных районах. К январю 2020 года более половины орудий K-9 Vajra уже были поставлены индийской армии с опережением графика."
 RAJ_direct_fire_gun_equipment_1: "Ordnance QF 17-pounder"
 RAJ_direct_fire_gun_equipment_1_short: "QF 17-pounder"
 RAJ_direct_fire_gun_equipment_2: "85-мм противотанковая пушка D-48"
 RAJ_direct_fire_gun_equipment_2_short: "85 мм D-48"
 RAJ_direct_fire_gun_equipment_2_desc: "85-мм противотанковая пушка Д-48 - советская противотанковая пушка калибра 85 мм, применявшаяся после Второй мировой войны. Она была разработана как замена 100-мм полевой пушки М1944 (БС-3). Отличительными особенностями Д-48 являются очень длинный ствол и дульный тормоз типа \"перец-горшок\". В 1960-х годах Д-48 была заменена на противотанковую пушку Т-12"
 RAJ_direct_fire_gun_equipment_3: "M40 Recoiless Rifle"
 RAJ_direct_fire_gun_equipment_3_short: "M40 Recoiless Rifle"
 RAJ_motorized_rocket_equipment_1: "Land Mattress"
 RAJ_motorized_rocket_equipment_1_short: "Land Mattress"
 RAJ_motorized_rocket_equipment_1_desc: ""
 RAJ_motorized_rocket_equipment_3: "BM-21 Град"
 RAJ_motorized_rocket_equipment_3_short: "БМ-21 Град"
 RAJ_motorized_rocket_equipment_3_desc: "БМ-21 \"Град\" - советская реактивная система залпового огня калибра 122 мм, устанавливаемая на грузовые автомобили. Система вооружения и ракета М-21ОФ были впервые разработаны в начале 1960-х годов, а первое боевое применение получили в марте 1969 года во время китайско-советского пограничного конфликта. БМ расшифровывается как \"Боевая машина\", а прозвище \"Град\" означает \"град\". Комплекс с ракетой-носителем БМ-21 и ракетой М-21ОФ обозначается как полевой ракетный комплекс М-21. Комплексная система более известна как реактивная система залпового огня \"Град\". В странах НАТО эта система (либо вся, либо только пусковая установка) первоначально была известна как M1964. Ряд других стран скопировали \"Град\" или разработали аналогичные системы."
 RAJ_motorized_rocket_equipment_4: "Многоствольная ракетная установка \"Пинака"
 RAJ_motorized_rocket_equipment_4_short: "Ракетная установка \"Пинака"
 RAJ_motorized_rocket_equipment_4_desc: "На вооружении индийской армии состоят российские реактивные системы залпового огня БМ-21 \"Град\". В 1981 году в связи с потребностью индийской армии в артиллерийской системе большой дальности Министерство обороны Индии санкционировало два проекта по созданию системы уверенного огня. В июле 1983 г. армия сформулировала качественные требования Генерального штаба (GSQR) к этой системе, планируя принимать на вооружение по одному полку в год, начиная с 1994 г. В перспективе эта система должна была заменить \"Град\". Разработка системы началась в декабре 1986 года, бюджет составил ₹ 26,47 крор. Разработка должна была завершиться в декабре 1992 года. Разработкой системы руководила лаборатория DRDO Armament Research and Development Establishment, расположенная в Пуне"
 RAJ_motorized_rocket_equipment_5: "БМ-30 \"Смерч"
 RAJ_motorized_rocket_equipment_5_short: "BM-30 Смерч"
 RAJ_motorized_rocket_equipment_5_desc: " 42 системы 9А52-2Т на вооружении. Пусковые установки для 300-мм реактивных систем залпового огня (РСЗО) 9К58 \"Смерч\" индийской армии будут установлены на 81 высокомобильном автомобиле 10×10 индийской разработки, предоставленном индийским частным оборонным производителем Ashok Leyland. Автомобиль, оснащенный гидравлическим краном для перезарядки системы, дополнит и в перспективе заменит пусковые установки 9А52-2, базирующиеся на шасси грузовика МАЗ-543М 8×8. ИА эксплуатирует несколько вариантов пусковых установок для системы \"Смерч\", в том числе около 62 батарей 9К58 \"Смерч\", каждая из которых имеет по шесть ракет-носителей. С 2012 года индийский государственный завод Ordnance Factory Board производит несколько вариантов ракет для этой системы с дальностью поражения 70 или 90 км."
 RAJ_atgm_equipment_1: "9M17 Fleyta"
 RAJ_atgm_equipment_1_short: "9M17 Fleyta"
 RAJ_atgm_equipment_1_desc: "Ракета разработана в ОКБ-16 имени Нудельмана. Она разрабатывалась примерно в то же время, что и AT-1 Snapper, как тяжелая ПТУР для применения как на наземных пусковых установках, так и на вертолетах. В ней были решены некоторые проблемы AT-1: она была значительно быстрее и имела несколько большую дальность стрельбы. Эти улучшения были достигнуты за счет передачи команд по радиоканалу вместо тянущегося провода наведения, что позволило ракете двигаться быстрее. Однако это сделало ее уязвимой для помех. В сентябре 1964 года ракетный комплекс был продемонстрирован советскому премьеру Никите Хрущеву и вскоре после этого принят на вооружение."
 RAJ_atgm_equipment_2: "9M113 Konkurs"
 RAJ_atgm_equipment_2_short: "9M113 Konkurs"
 RAJ_atgm_equipment_2_desc: "Ракета предназначена для стрельбы с транспортных средств, хотя может стрелять и из более поздних моделей пусковых установок 9М111. Она является неотъемлемой частью машин БМП-2, БМД-2 и БРДМ-2. Ракета хранится и перевозится в стеклопластиковом контейнере/пусковой трубе. Для выталкивания ракеты из пусковой трубы в системе используется газогенератор. Газ также выходит из задней части пусковой трубы по аналогии с безоткатным орудием. Ракета выходит из пусковой трубы со скоростью 80 м/с и под действием твердотопливного двигателя быстро разгоняется до 200 м/с. Такая начальная скорость уменьшает мертвую зону ракеты, поскольку она может быть запущена прямо на цель, а не по дуге вверх. В полете ракета совершает от 5 до 7 оборотов в секунду. Пусковая установка отслеживает положение инфракрасной лампы накаливания на задней части ракеты относительно цели и передает соответствующие команды ракете по тонкому проводу, идущему за ракетой. Система оснащена сигнализацией, которая срабатывает при обнаружении помех от системы типа \"Штора\". В этом случае оператор может взять на себя ручное управление, переведя ракету в режим MCLOS. Система наведения SACLOS имеет много преимуществ перед MCLOS. Точность системы, по некоторым данным, составляет 90%, хотя ее характеристики, вероятно, сопоставимы с BGM-71 TOW или более поздними SACLOS-версиями 9К11 \"Малютка\"."
 RAJ_atgm_equipment_3: "9M120 Ataka"
 RAJ_atgm_equipment_3_short: "9M120 Ataka"
 RAJ_atgm_equipment_3_desc: "9M120 Ataka\" - противотанковая управляемая ракета (ПТУР), созданная в Советском Союзе. По классификации НАТО ракета 9М120 называется AT-9 Spiral-2. Она представляет собой следующее поколение ракет семейства 9К114 \"Штурм\" (АТ-6 \"Спираль\"). Ракета имеет радиокомандное наведение, а также лучевое наведение SACLOS. Основной вариант этой ракеты был разработан для поражения танков с композитной броней и взрывореактивной броней. Систему 9М120 \"Атака\" часто путают с системой 9К121 \"Вихрь\", хотя это разные системы вооружения, разработанные разными компаниями. Первая была разработана машиностроительным конструкторским бюро КБМ и производилась на заводе имени Дегтярева. По данным Стокгольмского международного института исследования проблем мира, Россия экспортировала ПТРК \"Атака\" в Иран, Казахстан и Словению."
 RAJ_atgm_equipment_4: "9М133 \"Корнет"
 RAJ_atgm_equipment_4_short: "9M133 Kornet"
 RAJ_atgm_equipment_4_desc: "9М133 \"Корнет\" - современная российская переносная противотанковая управляемая ракета (ПТУР), предназначенная для борьбы с основными боевыми танками. Впервые поступила на вооружение российской армии в 1998 г. \"Корнет\" является одной из самых мощных российских ПТУР. Из-за высокой стоимости он не предназначен для полной замены предыдущих систем. Корнет\" выпускается в вариантах с термобарическими боеголовками для поражения мягких целей. В дальнейшем он был доработан в вариант 9М133 \"Корнет-ЭМ\", который имеет увеличенную дальность стрельбы, возможность стрельбы и самоликвидации, а также усовершенствованную боевую часть. Впервые он был применен в боевых действиях в 2003 году и с тех пор использовался во многих конфликтах"
 RAJ_atgm_equipment_5: "Amogha-III"
 RAJ_atgm_equipment_5_short: "Amogha-III"
 RAJ_atgm_equipment_5_desc: "MPATGM - это удлиненная цилиндрическая ракета малой массы с группой из четырех оперений вокруг средней части. Она оснащена фугасной противотанковой боеголовкой (HEAT). Ракета имеет длину около 1300 мм и диаметр около 120 мм, пусковую трубу из алюминия и углепластика и разборную треногу для снижения массы. Масса ракеты составляет 14,5 кг, масса командной пусковой установки (КПУ) - 14,25 кг, сочетающей в себе лазерный целеуказатель и цифровой всепогодный прицел. Дальность стрельбы составляет около 2,5 км. MPATGM оснащена современным инфракрасным датчиком изображения (IIR) и интегрированной авионикой. Ракета имеет возможность нанесения удара сверху. По имеющимся данным, она имеет много общего с такими системами, как FGM-148 Javelin и Spike (ATGM)"
 RAJ_atgm_carrier_equipment_1: "Landrover w/ MILAN"
 RAJ_atgm_carrier_equipment_1_short: "Landrover w/ MILAN"
 RAJ_atgm_carrier_equipment_2: "9P148 Konkurs"
 RAJ_atgm_carrier_equipment_2_short: "9P148 Konkurs"
 RAJ_atgm_carrier_equipment_3: "Windy 505 w/ MILAN 2T"
 RAJ_atgm_carrier_equipment_3_short: "Windy 505 w/ MILAN 2T"
 RAJ_atgm_carrier_equipment_4: "БМП-2 Nag Missile Carrier "
 RAJ_atgm_carrier_equipment_4_short: " БМП-2 NAMICA"
 RAJ_atgm_carrier_equipment_4_desc: "NAMICA (Nag Missile Carrier) - растянутая, лицензионная БМП-2 с дополнительными колесами, получившая в Индии прозвище \"Sarath\". Классифицируется как танковый эсминец. Он оснащен различными электрооптическими системами, включая тепловизор (TI) и лазерный дальномер (LRF) для захвата целей. NAMICA несет в общей сложности двенадцать ракет, из которых восемь находятся в режиме готовности к стрельбе, а четыре - в режиме хранения. Он оснащен компактной вспомогательной силовой установкой (ВСУ) для бесшумной работы, системой обнаружения и подавления пожара (СОПЖ) и системой ядерной, биологической и химической защиты (ЯБХЗ). Носитель весит 14,5 т в полной боевой нагрузке и способен двигаться на воде со скоростью 7 км/ч. В ходе летних испытаний 2008 года носитель прошел транспортные испытания, преодолев 155 км. Носитель имеет различные режимы стрельбы, включая стрельбу сверху и непрямую атаку. Имеется система фиксации цели перед пуском, при которой цель идентифицируется и назначается перед пуском. Дальность атаки ограничена, поскольку система наведения основана на визуальной идентификации"
 RAJ_sam_carrier_equipment_1: "S-25 Berkut"
 RAJ_sam_carrier_equipment_1_short: "S-25 Berkut"
 RAJ_sam_carrier_equipment_1_desc: "С-25 \"Беркут\" (рус. С-25 \"Беркут\"; \"Беркут\" в переводе с английского означает \"золотой орел\") - управляемая ракета класса \"земля-воздух\", первый боевой ЗРК в Советском Союзе. "
 RAJ_sam_carrier_equipment_2: "2К12 Куб"
 RAJ_sam_carrier_equipment_2_short: "2K12 Kub"
 RAJ_sam_carrier_equipment_2_desc: "Каждая батарея 2К12 состоит из нескольких однотипных гусеничных машин, одна из которых несет РЛС 1S91 (машина SURN, обозначение НАТО \"Straight Flush\") мощностью 25 кВт в диапазоне G/H (дальность действия 75 км (47 миль)), оснащенную, помимо оптического прицела, осветителем непрерывной волны. В состав батареи обычно входят также четыре трехракетные транспортно-установочные пусковые установки (ТЭУ) и четыре грузовика, каждый из которых несет три запасные ракеты и кран. TEL базируется на шасси GM-578, а радиолокационная машина 1S91 - на шасси GM-568, все они разработаны и производятся на ММЗ."
 RAJ_sam_carrier_equipment_5: "Боевая машина \"Тришул"
 RAJ_sam_carrier_equipment_5_short: "Боевая машина \"Тришул"
 RAJ_sam_carrier_equipment_5_desc: "Trishul - ракета малой дальности класса \"земля-воздух\", разработанная в Индии. Она была разработана Организацией оборонных исследований и разработок в рамках комплексной программы развития управляемых ракет. Она также может использоваться в качестве противокорабельной с корабля против низколетящих атакующих ракет."
 RAJ_sam_carrier_equipment_6: "Akash"
 RAJ_sam_carrier_equipment_6_short: "Akash"
 RAJ_sam_carrier_equipment_6_desc: "Akash - мобильный зенитно-ракетный комплекс (ЗРК) средней дальности, разработанный Организацией оборонных исследований и разработок (DRDO) и производимый компанией Bharat Dynamics Limited (BDL). Радар наблюдения и управления огнем, тактический центр управления и командования и пусковая установка ракеты разработаны компаниями Bharat Electronics (BEL), Tata Power Strategic Engineering Division и Larsen & Toubro."
 RAJ_sam_long_range_0: "S-75 Desna"
 RAJ_sam_long_range_1: "S-200V Vega"
 RAJ_sam_long_range_2: "S-300PM"
 RAJ_sam_long_range_3: "S-300PMU"
 RAJ_sam_long_range_4: "Barak 8"
 RAJ_scout_helicopter_equipment_1: "Aérospatiale SA-315B Lama"
 RAJ_scout_helicopter_equipment_1_short: "SA-315B Lama"
 RAJ_scout_helicopter_equipment_1_desc: "Aérospatiale SA 315B Lama - французский однодвигательный вертолет, разработанный с учетом высоких эксплуатационных требований вооруженных сил Индии. Он сочетает в себе более легкий планер Aérospatiale Alouette II с компонентами и силовой установкой Alouette III. Вертолет Lama обладает исключительными высотными характеристиками. "
 RAJ_scout_helicopter_equipment_2: "HAL Cheetah"
 RAJ_scout_helicopter_equipment_2_desc: "Значительное количество \"Лам\" SA315B было произведено по лицензии в Индии компанией Hindustan Aeronautics Limited (HAL) под названием Cheetah. Более чем через три десятилетия после начала производства в Индии HAL все еще получала экспортные заказы на оригинальные Cheetah."
 RAJ_scout_helicopter_equipment_2_short: "Cheetah"
 RAJ_scout_helicopter_equipment_3: "HAL Lancer"
 RAJ_scout_helicopter_equipment_3_desc: "Модифицированный боевой вариант. Изменения включают композитное бронирование, закаленное стекло и прицельные приспособления. Вооружение включает две сбрасываемые капсулы с оружием, каждая из которых содержит один 12,7-мм пулемет и до трех 70-мм ракет."
 RAJ_scout_helicopter_equipment_3_short: "Lancer"
 RAJ_scout_helicopter_equipment_4: "HAL Cheetal"
 RAJ_scout_helicopter_equipment_4_short: "Cheetal"
 RAJ_scout_helicopter_equipment_4_desc: "Cheetal - это модернизированная версия вертолета Cheetah. Проект был начат в 2002 году и направлен на повышение эксплуатационных возможностей и ремонтопригодности вертолета, а также на модернизацию в середине срока службы для обеспечения надежной и безопасной эксплуатации.  "
 RAJ_scout_helicopter_equipment_5: "HAL Rudra"
 RAJ_scout_helicopter_equipment_5_short: "Rudra"
 RAJ_scout_helicopter_equipment_5_desc: "HAL Rudra, также известный как ALH-WSI, является вооруженной версией HAL Dhruv, которая разработана и производится компанией Hindustan Aeronautics Limited (HAL). Rudra оснащен инфракрасным (FLIR) и тепловизионным прицелами переднего обзора, 20-мм турельной пушкой, 70-мм ракетными установками, противотанковыми управляемыми ракетами и ракетами \"воздух-воздух\"."
 RAJ_attack_helicopter_equipment_2: "Ми-24В"
 RAJ_attack_helicopter_equipment_2_short: "Ми-24В"
 RAJ_attack_helicopter_equipment_2_desc: "Более поздняя разработка, поступившая в производство в 1976 году. Он был вооружен более совершенными ракетами 9М114 \"Штурм\" (АТ-6 \"Спираль\"). Восемь таких ракет установлены на четырех внешних пилонах крыла. Это был самый массовый вариант, выпущенный более чем в 1500 экземплярах. В Польше этот самолет получил обозначение Ми-24В. Один Ми-24В по неизвестным причинам обозначался как Ми-24Т"
 RAJ_attack_helicopter_equipment_3: "Mil Mi-25"
 RAJ_attack_helicopter_equipment_3_short: "Миль Ми-25"
 RAJ_attack_helicopter_equipment_3_desc: "Экспортный вариант Ми-24Д. (Hind-D) Ми-24Д был разработан как более чистый боевой корабль, чем предыдущие варианты. Он поступил в производство в 1973 году. Ми-24Д имеет перепроектированный передний фюзеляж с двумя отдельными кабинами для летчика и наводчика. Он вооружен одним 12,7-мм четырехствольным пулеметом Як-Б в носовой части. Он также может нести четыре 57-мм ракетные установки, четыре противотанковые ракеты SACLOS 9M17 Phalanga (значительное усовершенствование по сравнению с системой MCLOS на Ми-24А), а также бомбы и другое вооружение."
 RAJ_attack_helicopter_equipment_4: "Ми-35Э \"Акбар"
 RAJ_attack_helicopter_equipment_4_short: "Ми-35Э Акбар"
 RAJ_attack_helicopter_equipment_4_desc: "Созданный на базе вертолета Ми-24 Hind, военный вертолет Ми-35М имеет ряд усовершенствований, включая укороченные законцовки крыла, новую несущую систему, современную авионику, модернизированные турбовальные двигатели и гидросистему. Кабина пилота и основные узлы вертолета имеют мощную броневую защиту"
 RAJ_attack_helicopter_equipment_5: "Легкий боевой вертолет HAL"
 RAJ_attack_helicopter_equipment_5_short: "LCH"
 RAJ_attack_helicopter_equipment_5_desc: "HAL Light Combat Helicopter (LCH) - индийский многоцелевой ударный вертолет, разработанный и производимый компанией Hindustan Aeronautics Limited (HAL). Это самый легкий современный ударный вертолет в мире, а его потолок полета - самый высокий среди всех ударных вертолетов. Он заказан как для ВВС Индии, так и для индийской армии. Вертолет также предназначен для продажи на экспорт; с 2015 года HAL ведет поиск других заказчиков LCH"
 RAJ_utility_helicopter_equipment_1: "Sikorsky S-55C Chickasaw"
 RAJ_utility_helicopter_equipment_1_short: "S-55C Chickasaw"
 RAJ_utility_helicopter_equipment_2: "Aérospatiale SA316 Alouette III"
 RAJ_utility_helicopter_equipment_2_short: "SA316 Alouette III"
 RAJ_utility_helicopter_equipment_3: "Mil Mi-8T"
 RAJ_utility_helicopter_equipment_3_short: "Ми-8Т"
 RAJ_utility_helicopter_equipment_4: "Mil Mi-17"
 RAJ_utility_helicopter_equipment_4_short: "Ми-17"
 RAJ_utility_helicopter_equipment_5: "HAL Chetak"
 RAJ_utility_helicopter_equipment_5_short: "Chetak"
 RAJ_utility_helicopter_equipment_5_desc: "В соответствии с лицензионным соглашением между компанией Aérospatiale и индийской авиастроительной компанией Hindustan Aeronautics Limited (HAL), вертолет Alouette III был построен по лицензии компанией HAL в Индии. К настоящему времени выпущено более 300 вертолетов, большинство из которых приобретено для военных нужд индийских вооруженных сил, которые используют их для выполнения различных задач, включая обучение, транспортировку, CASEVAC (эвакуацию раненых), связь и взаимодействие"
 RAJ_utility_helicopter_equipment_6: "HAL Dhruv Mk.1"
 RAJ_utility_helicopter_equipment_6_short: "Dhruv Mk.1"
 RAJ_utility_helicopter_equipment_6_desc: "HAL Dhruv - вертолет общего назначения, разработанный компанией Hindustan Aeronautics Limited (HAL). О разработке вертолета Dhruv было объявлено в ноябре 1984 г., впоследствии он был спроектирован при содействии немецкой фирмы MBB. Первый полет вертолета состоялся в 1992 г., однако его разработка затянулась по ряду причин, включая требования индийской армии внести изменения в конструкцию, бюджетные ограничения и санкции, наложенные на Индию после ядерных испытаний \"Похран-II\" в 1998 г. Он был назван в честь индийского мифологического персонажа Дхрува, что в переводе с санскрита означает \"непоколебимый\"."
 RAJ_utility_helicopter_equipment_7: "Легкий утилитарный вертолет HAL"
 RAJ_utility_helicopter_equipment_7_short: "LUH"
 RAJ_utility_helicopter_equipment_7_desc: "Легкий вертолет HAL Light Utility Helicopter (LUH) и его производная Light Observation Helicopter (LOH) были спроектированы и разработаны Rotary Wing Research and Design Center (RWR&DC) - одним из научно-исследовательских подразделений компании Hindustan Aeronautics Limited (HAL) для гражданского и военного применения. Они предназначены для замены лицензионных версий Aérospatiale SA 315B Lama (обозначение Cheetah) и Aérospatiale Alouette III (обозначение Chetak), состоящих на вооружении индийской армии и индийских ВВС."
 RAJ_cargo_helicopter_equipment_3: "Mil Mi-26"
 RAJ_cargo_helicopter_equipment_3_short: "Ми-26"
 RAJ_cargo_helicopter_equipment_4: "Mil Mi-26M"
 RAJ_cargo_helicopter_equipment_4_short: "Ми-26М"
 RAJ_cargo_helicopter_equipment_5: "Mil Mi-26T2"
 RAJ_cargo_helicopter_equipment_5_short: "Ми-26Т2"
 RAJ_cargo_helicopter_equipment_6: "Boeing CH-47F Chinook"
 RAJ_cargo_helicopter_equipment_6_short: "CH-47F Chinook"
 RAJ_cargo_helicopter_equipment_6_desc: "В 2001 году первый CH-47F, модернизированный CH-47D, совершил первый полет; первая серийная модель выкатилась 15 июня 2006 года на заводе компании Boeing в Ридли-Парке, штат Пенсильвания, и впервые совершила полет 23 октября 2006 года. Модернизация включает в себя двигатели Honeywell мощностью 4868 л.с. (3630 кВт) и планер самолета, имеющий более цельную конструкцию для снижения требований к техническому обслуживанию. Фрезерованная конструкция снижает вибрацию, а также потребность в осмотре и ремонте, и устраняет места изгиба для увеличения срока службы."
 RAJ_naval_helicopter_equipment_3: "Камов Ка-25БШ"
 RAJ_naval_helicopter_equipment_3_short: "Ка-25БШ"
 RAJ_naval_helicopter_equipment_4: "Westland Sea King Mk.42A"
 RAJ_naval_helicopter_equipment_4_short: "Sea King Mk.42A"
 RAJ_naval_helicopter_equipment_4_desc: "После индо-пакистанской войны 1965 года Пакистан инвестировал значительные средства в современные подводные лодки и торпедные аппараты большой дальности. В ответ на это Индия в 1969 г. решила закупить у Великобритании шесть Westland Sea Kings, предназначенных для выполнения задач ПЛО и получивших обозначение Mk42. Эта закупка также включала поставку самонаводящихся торпед для борьбы с подводными лодками"
 RAJ_naval_helicopter_equipment_5: "Westland Sea King Mk.42B"
 RAJ_naval_helicopter_equipment_5_short: "Sea King Mk.42B"
 RAJ_naval_helicopter_equipment_5_desc: "Многоцелевой вариант для ВМС Индии, оборудованный для противолодочной борьбы, с гидролокатором погружения и современной авионикой, и противокорабельных операций, с двумя ракетами Sea Eagle."
 RAJ_naval_helicopter_equipment_6: "Камов Ка-27PL Helix-A"
 RAJ_naval_helicopter_equipment_6_short: "Ка-27ПЛ Хеликс-А"
 RAJ_naval_helicopter_equipment_6_desc: "Kamov Ka-27 (NATO reporting name 'Helix') - военный вертолет, разработанный для ВМФ СССР и находящийся на вооружении в различных странах, включая Россию, Украину, Вьетнам, Китай, Южную Корею и Индию. Вертолет был разработан для перегонов и противолодочной борьбы."
 RAJ_naval_helicopter_equipment_7: "HAL Dhruv Mk.3"
 RAJ_naval_helicopter_equipment_7_short: "Dhruv Mk.3"
 RAJ_naval_helicopter_equipment_7_desc: "Морской вариант вертолета HAL Dhruv, Mk.3 был предоставлен ВМС Индии для патрулирования и противолодочных операций."
 RAJ_fighter_equipment_0: "Westland Wapiti Mk.IIA"
 RAJ_fighter_equipment_0_short: "Westland Wapiti Mk.IIA"
 RAJ_fighter_equipment_0_desc: "Westland Wapiti - британский двухместный военный одномоторный биплан общего назначения 1920-х годов. Он был разработан и построен компанией Westland Aircraft Works для замены Airco DH.9A на вооружении Королевских ВВС."
 RAJ_fighter_equipment_1: "Hawker Hurricane Mk.I"
 RAJ_fighter_equipment_1_short: "Hawker Hurricane Mk.I"
 RAJ_fighter_equipment_2: "Hawker Hurricane Mk.IIB"
 RAJ_fighter_equipment_2_short: "Hawker Hurricane Mk.IIB"
 RAJ_fighter_equipment_2_desc: "Hawker Hurricane - британский одноместный истребитель 1930-40-х годов, разработанный и построенный преимущественно компанией Hawker Aircraft Ltd. для Королевских ВВС (RAF)."
 RAJ_fighter_equipment_3: "Supermarine Spitfire F Mk.XIV"
 RAJ_fighter_equipment_3_short: "Spitfire F Mk.XIV"
 RAJ_fighter_equipment_3_desc: "Первые Спитфайры, оснащенные двигателем Griffon, страдали от плохих высотных характеристик, поскольку имели только одноступенчатый двигатель с наддувом. К 1943 году инженеры Rolls-Royce разработали новый двигатель Griffon серии 61 с двухступенчатым нагнетателем. В итоге на Mk XIV был использован несколько модифицированный двигатель 65-й серии. Полученный самолет обеспечил существенный прирост характеристик по сравнению с Mk IX"
 RAJ_jet_multirole_equipment_1: "De Havilland Vampire F.3"
 RAJ_jet_multirole_equipment_1_short: "Vampire F.3"
 RAJ_jet_multirole_equipment_1_desc: "7-я эскадрилья ВВС Индии (IAF) получила \"Вампиры\" в январе 1949 года. Этот тип также эксплуатировался в 17-й эскадрилье IAF. Во время аннексии Гоа в 1961 г. № 37 эскадрилья IAF совершила несколько ночных разведывательных полетов над Гоа, иногда попадая под зенитный огонь"
 RAJ_jet_multirole_equipment_2: "De Havilland Vampire F.52"
 RAJ_jet_multirole_equipment_2_short: "Vampire F.52"
 RAJ_jet_multirole_equipment_2_desc: "1 сентября 1965 года, во время индо-пакистанской войны, 45-я эскадрилья IAF откликнулась на просьбу нанести удары по контрнаступлению пакистанской армии (операция \"Большой шлем\"), и двенадцать истребителей-бомбардировщиков Vampire Mk 52 успешно замедлили продвижение пакистанцев."
 RAJ_jet_multirole_equipment_3: "Dassault MD.450B Toofani"
 RAJ_jet_multirole_equipment_3_short: "MD.450B Toofani"
 RAJ_jet_multirole_equipment_4: "Hawker Hunter F.1"
 RAJ_jet_multirole_equipment_4_short: "Hunter F.1"
 RAJ_jet_multirole_equipment_4_desc: "Первый серийный вариант, двигатель Avon 113, первый полет 16 мая 1953 года, построено 139 самолетов, из них 113 построены компанией Hawker Aircraft в Кингстон-апон-Темз и еще 26 - в Блэкпуле. Первый серийный самолет совершил полет 16 мая 1953 года (WT555, Дансфолд), последний поставлен в январе 1955 года. Использовался на двух фронтовых базах (Одихэм, 54 и 247 Sqns) и Лейчарс (43 и 222 Sqns); на 229 OCU, Чивенор, 233 OCU (Пембри), CFE (Вест Рейнхем) и в небольшом количестве в других местах."
 RAJ_jet_multirole_equipment_5: "Hawker Hunter F.56"
 RAJ_jet_multirole_equipment_5_short: "Hunter F.56"
 RAJ_jet_multirole_equipment_5_desc: "Экспортный вариант истребителя Hunter F.6 для Индии, построено 160 машин. Добавлены тормозной парашют и возможность нести 500-фунтовые (227 кг) бомбы, незначительные изменения в бортовой электронике, в том числе удаление УВЧ-радиостанции."
 RAJ_jet_multirole_equipment_6: "Микоян-Гуревич МиГ-21ПФ"
 RAJ_jet_multirole_equipment_6_desc: "Серийный вариант всепогодного перехватчика. На них устанавливался турбореактивный двигатель Р11Ф2-300, а начиная с седьмой партии - РЛС РП-21 (на первых шести партиях использовалась более старая РЛС ЦД-30Т (она же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую ЗУР РС-2УС (она же К-5МС) в дополнение к ИК-цели К-13."
 RAJ_jet_multirole_equipment_6_short: "МиГ-21ПФ"
 RAJ_jet_multirole_equipment_7: "HAL/Mikoyan-Gurevich MiG-21bis"
 RAJ_jet_multirole_equipment_7_short: "МиГ-21бис"
 RAJ_jet_multirole_equipment_7_desc: "Последним вариантом, выпущенным компанией HAL, был МиГ-21бис. В 1977 г. из комплектов CKD было построено 75 самолетов, а к 1984 г. - еще 220 с нуля. Несмотря на ряд аварий, произошедших в 1990-х годах, ВВС Индии приняли решение модернизировать около 125 МиГ-21бис, находящихся на вооружении, до стандарта МиГ-21 \"Бизон\". Эти самолеты могут служить до 2025 года. Первоначальный МиГ-21 FL (МиГ-21 PF или Тип 77) был снят с вооружения в декабре 2013 года; оставшиеся самолеты МиГ-21М (Тип 88) планируется снять с вооружения к 2015 году."
 RAJ_jet_multirole_equipment_8: "Микоян-Гуревич МиГ-23МФ"
 RAJ_jet_multirole_equipment_8_short: "МиГ-23МФ"
 RAJ_jet_multirole_equipment_8_desc: "(\"Флоггер-Б\") Это экспортное производное МиГ-23М, первоначально предназначавшееся для поставок в страны Варшавского договора, но продававшееся и многим другим союзникам и клиентам, поскольку большинство экспортных заказчиков были недовольны довольно примитивным МиГ-23МС. На самом деле он выпускался в двух вариантах. Первый продавался союзникам по Варшавскому договору и был практически идентичен советскому МиГ-23М, с небольшими изменениями в транспондерах \"опознавания друга или врага\" (IFF) и оборудовании связи. Второй вариант, продававшийся за пределами Восточной Европы, имел другой комплект ПРР и средств связи (как правило, с удаленным даталинком), а также модернизированную РЛС, которая не обладала возможностями и режимами радиоэлектронного противодействия (РЭП) базового \"Хай Ларка\". Этот вариант был более популярен за рубежом, чем МиГ-23МС, и значительное его количество было поставлено на экспорт, особенно на Ближний Восток."
 RAJ_jet_multirole_equipment_9: "Dassault Mirage 2000H"
 RAJ_jet_multirole_equipment_9_short: "Mirage 2000H"
 RAJ_jet_multirole_equipment_9_desc: "В 1980 году ВВС Индии (IAF) узнали об успешном обращении Пакистана к США с предложением о закупке истребителей F-16A/B, поставка которых должна была начаться в 1982 году. К концу 1980 г. IAF быстро убедили индийское правительство в необходимости приобретения не менее мощного самолета, поскольку парк МиГ-21 и МиГ-23 уступал F-16. При оценке Mirage F-1 ранее им стало известно, что в стадии летных испытаний находится высокоэффективный прототип Mirage 2000. Других самолетов с таким потенциалом в предложении не было. Проведя внутреннюю оценку Mirage 2000, индийское правительство сочло, что французский самолет является более совершенным и превосходит по своим характеристикам F-16, которые США собирались поставить Пакистану, и обратилось к Франции с предложением о поставке 150 самолетов Mirage 2000. В октябре 1982 г. страна разместила заказ в компании Dassault на 36 одноместных Mirage 2000H и 4 двухместных Mirage 2000TH (H означает \"Hindustan\") с возможностью последующей закупки девяти самолетов (восьми одноместных и одного двухместного) в качестве резерва на случай войны, технического обслуживания и выбытия. Закупка 150 самолетов вполне могла бы открыть путь к совместному производству с компанией Hindustan Aeronautics Limited (HAL), но количество заказанных самолетов (40+9) было слишком мало для такого соглашения. Тем не менее, Индия имела возможность лицензионного производства нескольких Mirage 2000, которая впоследствии была отменена из-за тесных отношений страны с Советским Союзом. Это привело к тому, что вместо него на вооружение был принят МиГ-29, что позволило преодолеть оговорки, высказанные IAF"
 RAJ_jet_multirole_equipment_10: "Микоян-Гуревич МиГ 29"
 RAJ_jet_multirole_equipment_10_short: "МиГ-29"
 RAJ_jet_multirole_equipment_10_desc: "Индия стала первым международным заказчиком МиГ-29. ВВС Индии (IAF) разместили заказ на более чем 66 самолетов МиГ-29 в 1980 году, когда самолет еще находился на начальной стадии разработки. С момента поступления на вооружение ВВС в 1985 г. самолет претерпел ряд модификаций с добавлением новой авионики, подсистем, турбовентиляторных двигателей и радаров. Во время Каргильской войны 1999 г. в Кашмире индийские МиГ-29 активно использовались ВВС Индии для истребительного сопровождения самолетов Mirage 2000, атакующих цели бомбами с лазерным наведением."
 RAJ_mr_stealth_fighter_equipment_1: "HAL Су-30МКИ"
 RAJ_mr_stealth_fighter_equipment_1_short: "Су-30МКИ"
 RAJ_mr_stealth_fighter_equipment_1_desc: "Су-30МКИ был разработан российской корпорацией \"Сухой\" в 1995 году и построен по лицензии индийской компанией Hindustan Aeronautics Limited (HAL). Су-30МКИ создан на базе самолета Су-27 и представляет собой сплав технологий демонстратора Су-37 и программы Су-30, являясь более совершенным, чем Су-30МК и китайские Су-30МКК/МК2. Министерство обороны России было впечатлено характеристиками этого типа и заказало для ВВС России 30 Су-30СМ, представляющих собой локализованный Су-30МКИ. Су-30СМ оснащен современной авионикой, разработанной Россией, Индией и Израилем для отображения информации, навигации, целеуказания и радиоэлектронной борьбы; Франция и ЮАР предоставили другое авионическое оборудование"
 RAJ_CAS_equipment_1: "Hawker Hind"
 RAJ_CAS_equipment_1_short: "Hind"
 RAJ_CAS_equipment_2: "Vultee A-31 Vengeance"
 RAJ_CAS_equipment_2_short: "A-31 Vengeance"
 RAJ_CAS_equipment_3: "Hawker Tempest Mk.V"
 RAJ_CAS_equipment_3_short: "Tempest Mk.V"
 RAJ_CAS_equipment_4: "Hawker Tempest Mk.II"
 RAJ_CAS_equipment_4_short: "Tempest Mk.II"
 RAJ_jet_CAS_equipment_1: "de Havilland Vampire FB.5"
 RAJ_jet_CAS_equipment_1_short: "Vampire FB.5"
 RAJ_jet_CAS_equipment_2: "de Havilland Vampire FB.52"
 RAJ_jet_CAS_equipment_2_short: "Vampire FB.52"
 RAJ_jet_CAS_equipment_3: "de Haviland/HAL Vampire FB.52"
 RAJ_jet_CAS_equipment_3_short: "HAL Vampire FB.52"
 RAJ_jet_CAS_equipment_3_desc: "Произведенный компанией HAL вариант самолета De Havilland Vampire FB.52."
 RAJ_jet_CAS_equipment_4: "Сухой Су-7Б"
 RAJ_jet_CAS_equipment_4_short: "Su-7B"
 RAJ_jet_CAS_equipment_4_desc: "Бомбардировочный вариант Су-7 \"Фиттер-А\" впервые поднялся в воздух в марте 1959 года и поступил на вооружение в 1961 году. В дальнейшем он стал основным советским ударным самолетом 1960-х годов. В 1957-1972 гг. было построено более 1400 Су-7Б, многие из которых были поставлены на экспорт. Самолет был довольно популярен за рубежом, где его использовали 10 стран. В частности, он активно использовался в ВВС Индии и Египта. Самолет продолжает ограниченно эксплуатироваться в Северной Корее"
 RAJ_jet_CAS_equipment_5: "HAL HF-24 Marut Mark.1"
 RAJ_jet_CAS_equipment_5_short: "HF-24 Marut"
 RAJ_jet_CAS_equipment_5_desc: "HAL HF-24 Marut (\"Spirit of the Tempest\") - индийский истребитель-бомбардировщик 1960-х годов. Разработан компанией Hindustan Aircraft Limited (HAL), ведущий конструктор - Курт Танк. Это первый реактивный самолет индийской разработки и первый азиатский истребитель (за пределами России/Советского Союза), вышедший из стадии испытаний и перешедший к успешному производству и активной эксплуатации. 17 июня 1961 г. состоялся первый полет этого типа, а 1 апреля 1967 г. первый серийный Marut был официально передан IAF"
 RAJ_jet_CAS_equipment_6: "SEPECAT Jaguar GR.1"
 RAJ_jet_CAS_equipment_6_short: "Jaguar GR.1"
 RAJ_jet_CAS_equipment_6_desc: "Индийские Jaguar существенно отличались от RAF. Вскоре на вооружение HAL были приняты двигатели Adour Mk 811 (предыдущие \"Ягуары\", производившиеся в Великобритании, имели более ранние Mk 804), дававшие по 8400 фунт-фут. На крыльях стояли Р-550 Magic 1 или 2 в направляющих. Но что еще более важно, NAWASS, пусть и очень современная по концепции, была заменена, поскольку была признана весьма ненадежной."
 RAJ_jet_CAS_equipment_7: "Микоян-Гуревич МиГ-23БН"
 RAJ_jet_CAS_equipment_7_short: "MiG-23BN"
 RAJ_jet_CAS_equipment_7_desc: "(\"Flogger-H\") Выпускался с 1973 года, МиГ-23БН был создан на базе МиГ-23Б, но имел тот же двигатель Р-29-300, что и современные варианты истребителя. На них также устанавливались крылья \"тип 3\". Имелись и другие незначительные изменения в электронике и оборудовании, а также некоторые изменения, внесенные в ходе длительного производства. Серийное производство продолжалось до 1985 года, было построено 624 самолета. Большинство из них было отправлено на экспорт, поскольку советская сторона всегда рассматривала их как промежуточный тип, и лишь небольшое количество служило в полках фронтовой авиации. Как обычно, пониженная версия продавалась заказчикам из стран третьего мира. Этот вариант оказался достаточно популярным и эффективным. Наиболее характерным отличием МиГ-23Б от МиГ-23БН было то, что первый имел диэлектрическую головку чуть выше пилона, которая на МиГ-23БН была снята. В Индии последние МиГ-23БН летали в 221-й эскадрилье (Valiants) ВВС Индии и были списаны 6 марта 2009 года. Командир крыла Тапас Ранджан Саху был последним пилотом, посадившим МиГ-23БН в этот день"
 RAJ_jet_CAS_equipment_8: "HAL МиГ-27М Bahadur"
 RAJ_jet_CAS_equipment_8_short: "МиГ-27М Бахадур"
 RAJ_jet_CAS_equipment_8_desc: "Экспортный вариант МиГ-27М, поставлявшийся в 1986 году в Индию в сбитых комплектах для лицензионной сборки. Аналогичен МиГ-27М, за исключением того, что подкрыльевой обтекатель датчика инфракрасного поиска и слежения (IRST) имел одно окно, а не несколько, как на оригинальном МиГ-27М. Всего Индией было собрано 150 таких самолетов. Индия называет эту модель МиГ-27М Bahadur, а МиГ-27Л - экспортное обозначение компании Mikoyan."
 RAJ_cas_stealth_equipment_1: "HAL Jaguar IS"
 RAJ_cas_stealth_equipment_1_short: "Jaguar IS"
 RAJ_cas_stealth_equipment_1_desc: "Разработанный компанией Hindustan Aeronautics Limited одноместный всепогодный тактический ударный и наземный истребитель для ВВС Индии"
 RAJ_jet_interceptor_equipment_1: "de Havilland Vampire NF.10"
 RAJ_jet_interceptor_equipment_1_short: "Vampire NF.10"
 RAJ_jet_interceptor_equipment_1_desc: "Двухместный ночной истребитель с двигателем \"Гоблин\" для RAF; построен 81 экземпляр, включая 3 прототипа."
 RAJ_jet_interceptor_equipment_2: "de Havilland Vampire NF.54"
 RAJ_jet_interceptor_equipment_2_short: "Vampire NF.54"
 RAJ_jet_interceptor_equipment_2_desc: "Экспортный NF.10. Итальянские ВВС закупили 14, а Индия - 30 отремонтированных NF.10."
 RAJ_jet_interceptor_equipment_6: "HAL/Микоян-Гуревич МиГ-21ФЛ Тип 77"
 RAJ_jet_interceptor_equipment_6_short: "МиГ-21ФЛ Тип 77"
 RAJ_jet_interceptor_equipment_6_desc: "Индия является крупнейшим эксплуатантом самолетов МиГ-21. В 1961 г. ВВС Индии предпочли приобрести МиГ-21 нескольким другим западным конкурентам. В рамках сделки Советский Союз предложил Индии полную передачу технологий и права на местную сборку. В 1964 г. МиГ-21 стал первым сверхзвуковым истребителем, поступившим на вооружение ВВС Индии. Из-за ограниченного количества поступивших на вооружение и недостаточной подготовки пилотов МиГ-21 сыграл ограниченную роль в индо-пакистанской войне 1965 года. Однако IAF приобрели ценный опыт, эксплуатируя МиГ-21 в оборонительных вылетах во время войны. Положительные отзывы пилотов IAF во время войны 1965 года побудили Индию разместить дополнительные заказы на этот истребитель, а также инвестировать значительные средства в создание инфраструктуры обслуживания МиГ-21 и программы подготовки пилотов"
 RAJ_jet_interceptor_equipment_7: "Микоян-Гуревич МиГ-21М"
 RAJ_jet_interceptor_equipment_7_short: "МиГ-21М"
 RAJ_jet_interceptor_equipment_7_desc: "Экспортный вариант МиГ-21С с двумя основными отличиями: РЛС РП-22 на МиГ-21С была заменена на более старую РЛС РП-21МА, а вместо пушечной установки использовалась встроенная пушка ГШ-23Л. В роли самолета \"воздух-воздух\" он мог нести на четырех пилонах только ИК-целевую ЗУР Р-3С, так как вариант Р-3Р с системой SARH не был допущен к экспорту. Этот тип также строился по лицензии в Индии, первый экземпляр индийской постройки был поставлен в феврале 1973 г."
 RAJ_jet_interceptor_equipment_8: "HAL МиГ-21МФ Тип 96"
 RAJ_jet_interceptor_equipment_8_short: "МиГ-21МФ Тип 96"
 RAJ_jet_interceptor_equipment_8_desc: "Лицензионное производство уникального для Индии усовершенствованного варианта, получившего обозначение МиГ-21МФ (Тип 96), началось в 1973 году и продолжалось до 1981 года - всего было построено 158 машин. МиГ-21МФ (тип 96) компании HAL не похож на МиГ-21МФ (изд. 96), который производился в СССР для экспорта в другие страны."
 RAJ_jet_interceptor_equipment_9: "HAL МиГ-21 Бизон"
 RAJ_jet_interceptor_equipment_9_short: "МиГ-21 Бизон"
 RAJ_jet_interceptor_equipment_9_desc: "Последним вариантом, выпущенным компанией HAL, стал МиГ-21бис. Всего в 1977 году из комплектов CKD было построено 75 машин, а к 1984 году - еще 220 с нуля. Несмотря на ряд аварий, произошедших в 1990-х годах, ВВС Индии приняли решение модернизировать около 125 МиГ-21бис, находящихся на вооружении, до стандарта МиГ-21 \"Бизон\". Эти самолеты могут служить до 2025 года. Оригинальный МиГ-21 FL (МиГ-21 PF или Type 77) был снят с вооружения в декабре 2013 года; оставшиеся самолеты МиГ-21М (Type 88) планируется снять с вооружения к 2015 году."
 RAJ_jet_light_equipment_1: "HAL HT-2"
 RAJ_jet_light_equipment_1_short: "HT-2"
 RAJ_jet_light_equipment_1_desc: "HAL HT-2 - индийский двухместный учебно-тренировочный самолет, разработанный и построенный компанией Hindustan Aeronautics Limited (HAL). HT-2 стал первой разработкой компании, поступившей в производство в 1953 году для ВВС и ВМС Индии, где он заменил самолет de Havilland Tiger Moth. HT-2 представляет собой низкоплан с консольным монопланом и фиксированным хвостовым шасси. Самолет оснащен поршневым двигателем Cirrus Major III мощностью 155 л.с. (116 кВт) и закрытой кабиной с двойным управлением. Помимо военного применения, самолет также использовался индийскими летными школами"
 RAJ_jet_light_equipment_2: "de Haviland/HAL Vampire T.55"
 RAJ_jet_light_equipment_2_short: "HAL Vampire T.55"
 RAJ_jet_light_equipment_2_desc: "Экспортный учебно-тренировочный самолет de Havilland Vampire, построено 322, в том числе 30 в Швейцарии, 60 в Индии компанией HAL и шесть переделанных из T.11"
 RAJ_jet_light_equipment_3: "Folland Gnat F.1"
 RAJ_jet_light_equipment_3_short: "Gnat F.1"
 RAJ_jet_light_equipment_3_desc: "Одноместный легкий истребитель, экспортировавшийся в Финляндию, Индию и Югославию, 50 штук построены компанией Folland на заводе Hamble. Он также строился в Индии по лицензии как HAL Gnat"
 RAJ_jet_light_equipment_4: "HAL Ajeet Mk.1"
 RAJ_jet_light_equipment_4_short: "Ajeet Mk.1"
 RAJ_jet_light_equipment_4_desc: "Ajeet является производной от британского легкого истребителя Folland Gnat. Gnat, закупленный в большом количестве для IAF и производимый по лицензии компанией HAL, хорошо зарекомендовал себя за время службы в Индии, в том числе принимал активное участие в боевых действиях во время многочисленных конфликтов с Пакистаном, включая индо-пакистанскую войну 1965 года и индо-пакистанскую войну 1971 года."
 RAJ_jet_light_equipment_5: "HAL Tejas Mark 1"
 RAJ_jet_light_equipment_5_short: "Tejas Mark 1"
 RAJ_jet_light_equipment_5_desc: "HAL Tejas\" - индийский однодвигательный многоцелевой легкий истребитель четвертого поколения, разработанный Агентством по развитию авиации (ADA) в сотрудничестве с Авиационным исследовательским и конструкторским центром (ARDC) компании Hindustan Aeronautics Limited (HAL) для ВВС и ВМС Индии. Он был создан в рамках программы Light Combat Aircraft (LCA), начатой в 1980-х годах для замены устаревших истребителей МиГ-21. В 2003 году LCA получил официальное название Tejas"
 RAJ_transport_plane_equipment_1: "Douglas C-47 Dakota"
 RAJ_transport_plane_equipment_1_short: "C-47 Dakota"
 RAJ_transport_plane_equipment_1_desc: "Dakota имеет огромное значение в истории Индии, поскольку это был первый из крупных транспортных самолетов, поступивших на вооружение IAF. Самолет поступил на вооружение 12-й эскадрильи IAF в 1946 году"
 RAJ_transport_plane_equipment_2: "Fairchild C-119G Flying Boxcar"
 RAJ_transport_plane_equipment_2_short: "C-119G Flying Boxcar"
 RAJ_transport_plane_equipment_2_desc: "Fairchild C-119 Flying Boxcar (обозначение ВМС и Корпуса морской пехоты R4Q) - американский военно-транспортный самолет, созданный на базе Fairchild C-82 Packet времен Второй мировой войны, предназначенный для перевозки грузов, персонала, больных и механизированной техники, а также для сброса грузов и войск на парашютах."
 RAJ_transport_plane_equipment_3: "HAL-748"
 RAJ_transport_plane_equipment_3_short: "HAL-748"
 RAJ_transport_plane_equipment_3_desc: "Лицензионная производственная версия самолета Hawker Siddeley HS 748 компании Hindustan Aeronautics Limited в индийском Бангалоре. Впоследствии индийские самолеты были модифицированы для выполнения различных задач, в том числе для испытаний варианта самолета раннего предупреждения о воздушном нападении, оснащенного большим радиокуполом, известного как Airborne Surveillance Platform (ASP)."
 RAJ_transport_plane_equipment_4: "Антонов Ан-12"
 RAJ_transport_plane_equipment_4_short: "Ан-12"
 RAJ_transport_plane_equipment_4_desc: "Первые такие самолеты поступили на вооружение ВВС Индии в 1961 году, когда была сформирована эскадрилья № 44 \"Гималайские гуси\". Вскоре шесть этих самолетов приняли участие в переброске подкреплений в Ладакх во время китайско-индийской войны 1962 года. Впоследствии Ан-12 был использован для создания эскадрильи No.25. Ан-12 также использовались в качестве тяжелых бомбардировщиков во время индо-пакистанской войны 1971 года"
 RAJ_transport_plane_equipment_5: "De Havilland Canada DHC-4 Caribou"
 RAJ_transport_plane_equipment_5_short: "DHC-4 Caribou"
 RAJ_transport_plane_equipment_5_desc: "De Havilland Canada DHC-4 Caribou - утилитарный транспортный турбовинтовой самолет с коротким взлетом и посадкой (STOL), разработанный на базе более ранней поршневой модели DHC-4 Caribou. Самолет обладает исключительными характеристиками STOL и способен взлетать на расстояния, значительно меньшие, чем это удается большинству легких самолетов. "
 RAJ_transport_plane_equipment_6: "Антонов Ан-32"
 RAJ_transport_plane_equipment_6_short: "Ан-32"
 RAJ_transport_plane_equipment_6_desc: "Ан-32 является, по сути, модернизированным Ан-26. Он спроектирован таким образом, чтобы выдерживать неблагоприятные погодные условия лучше, чем стандартный Ан-26. Анонсированный на Парижском авиасалоне в мае 1977 года, Ан-32 отличается от своего предшественника двигателями, поднятыми на 1,5 м над крылом, чтобы избежать повреждений от посторонних предметов на неровных, неподготовленных полосах. "
 RAJ_transport_plane_equipment_7: "Antonov AN-32RE"
 RAJ_transport_plane_equipment_7_short: "Ан-32РЭ"
 RAJ_transport_plane_equipment_7_desc: "Модернизированный вариант Ан-32Б. MTOW увеличена до 28,5 тонн, полезная нагрузка увеличена до 7,5 тонн, установлено новое более современное авионика."
 RAJ_transport_plane_equipment_8: "Ил-78МКИ"
 RAJ_transport_plane_equipment_8_short: "Ил-78МКИ"
 RAJ_transport_plane_equipment_8_desc: "Ил-78МКИ - заказной вариант Ил-78МЭ для ВВС Индии. Самолеты поставлены Россией, построены в Узбекистане и оснащены израильскими системами перекачки топлива, позволяющими заправлять 6-8 самолетов Су-30МКИ за один полет. Этот Ил-78МКИ эксплуатируется 78-й эскадрильей дозаправки в воздухе \"Доблестный MARS\" (он же \"Battle-cry\") IAF с авиабазы Агра"
 RAJ_transport_plane_equipment_10: "C-17 Globemaster III"
 RAJ_transport_plane_equipment_10_short: "C-17 Globemaster III"
 RAJ_recon_equipment_0: "Auster AOP. Mk 9"
 RAJ_recon_equipment_0_short: "Auster AOP. Mk 9"
 RAJ_recon_equipment_0_desc: "Auster AOP.9 - британский военный самолет воздушного наблюдения (\"Air Observation Post\"), произведенный компанией Auster Aircraft Limited для замены Auster AOP.6. "
 RAJ_jet_recon_equipment_0: "HAL HAOP-27 Krishak"
 RAJ_jet_recon_equipment_0_short: "HAOP-27 Krishak"
 RAJ_jet_recon_equipment_0_desc: "HAL HAOP-27 Krishak - военный самолет наблюдения, производившийся в Индии в 1960-х годах. Первоначально он был разработан компанией Hindustan Aeronautics как увеличенный четырехместный вариант легкого самолета HAL Pushpak. "
 RAJ_jet_recon_equipment_1: "Mikoyan-Gurevich Mig-25RB 'Garuda'"
 RAJ_jet_recon_equipment_1_short: "Миг-25РБ \"Garuda\""
 RAJ_jet_recon_equipment_1_desc: "В Индии МиГ-25 держался в строжайшем секрете и получил обозначение Garuda, названное в честь большой мифической птицы бога Вишну из индуистских писаний. Он активно использовался в Каргильской войне и операции \"Паракрам\", выполняя разведывательные полеты над Пакистаном. В мае 1997 г. разведывательный самолет МиГ-25РБ ВВС Индии произвел фурор, когда пилот пролетел над территорией Пакистана со скоростью более 3 Махов, выполняя разведывательный полет в воздушном пространстве Пакистана. МиГ-25 преодолел звуковой барьер при полете на высоте около 20 000 м (65 000 футов), иначе полет остался бы тайным, по крайней мере, для широкой общественности. Правительство Пакистана утверждало, что прорыв звукового барьера был преднамеренной попыткой показать, что на вооружении ВВС Пакистана нет самолетов, способных приблизиться к крейсерской высоте полета МиГ-25 (до 23 тыс. м (74 тыс. футов)). Индия отрицает факт инцидента, но министр иностранных дел Пакистана Гохар Айюб Хан считает, что Foxbat фотографировал стратегические объекты вблизи столицы Исламабада."
 RAJ_jet_recon_equipment_2: "HAL/SEPACAT Jaguar IS Recce"
 RAJ_jet_recon_equipment_2_short: "Jaguar IS Recce"
 RAJ_jet_recon_equipment_2_desc: "Одноместный всепогодный тактический ударный и наземный истребитель для ВВС Индии, 35 машин построены компанией BAe и 89 - компанией HAL (Shamser). На этом варианте установлена капсула для ведения фоторазведки в тылу врага."
 RAJ_nav_bomber_equipment_1: "Supermarine Stranraer"
 RAJ_nav_bomber_equipment_1_short: "Stranraer"
 RAJ_nav_bomber_equipment_1_desc: "Supermarine Stranraer - летающая лодка, разработанная и построенная британской компанией Supermarine Aviation Works. Она была разработана в 1930-х годах по заказу ее основного эксплуатанта - Королевских ВВС."
 RAJ_nav_bomber_equipment_2: "Short Sunderland"
 RAJ_nav_bomber_equipment_2_short: "Sunderland"
 RAJ_nav_bomber_equipment_2_desc: "Short S.25 Sunderland\" - британский патрульный бомбардировщик с летающей лодкой, разработанный и построенный компанией Short Brothers для Королевских ВВС (RAF). Самолет получил свое служебное название от города (позднее - города) и порта Сандерленд в Северо-Восточной Англии. "
 RAJ_nav_bomber_equipment_5: "Lockheed L-1049 Super Constellation Maritime Patrol Aircraft"
 RAJ_nav_bomber_equipment_5_short: "Super Constellation MPA"
 RAJ_nav_bomber_equipment_5_desc: "В 1976 году ВВС Индии передали самолеты Super Constellation в эскадрилью No.312 Albatross в Даболиме, штат Гоа. Будучи к тому времени довольно старыми самолетами, они были выведены из боевого состава к 1983 году. Для их замены в роли морских патрулей были приобретены советские самолеты. В 1977 году была введена в строй эскадрилья № 315 \"Крылатые жеребцы\", в состав которой вошли самолеты Ил-38"
 RAJ_nav_bomber_equipment_6: "Ил-38SD"
 RAJ_nav_bomber_equipment_6_short: "Ил-38SD"
 RAJ_nav_bomber_equipment_6_desc: "Ил-38 \"Дельфин\" (по классификации НАТО; May) - морской патрульный самолет и самолет противолодочной обороны, разработанный в Советском Союзе. Является развитием турбовинтового транспортного самолета Ил-18."
 RAJ_nav_bomber_equipment_7: "Туполев Ту-142МЭ"
 RAJ_nav_bomber_equipment_7_short: "Tu-142ME"
 RAJ_nav_bomber_equipment_7_desc: "Туполев Ту-142 - советский/российский самолет морской разведки и противолодочной борьбы (ПЛО), созданный на базе турбовинтового стратегического бомбардировщика Ту-95. Специализированный вариант Ту-142МР, получивший обозначение Ту-142МР, предназначался для обеспечения дальней связи с советскими подводными лодками с баллистическими ракетами. Ту-142 был разработан в ОКБ Туполева и производился на Куйбышевском авиационном и Таганрогском машиностроительном заводах с 1968 по 1994 год. Ту-142 эксплуатировался ранее в ВМФ СССР и ВВС Украины, в настоящее время состоит на вооружении ВМФ России."
 RAJ_nav_bomber_equipment_8: "Boeing P-8I Poseidon"
 RAJ_nav_bomber_equipment_8_short: "P-8I Poseidon"
 RAJ_nav_bomber_equipment_8_desc: "В январе 2008 года компания Boeing предложила для ВМС Индии P-8I - адаптированный экспортный вариант P-8A. Он имеет два основных компонента, не устанавливаемых на P-8A, - кормовой радар Telephonics APS-143 OceanEye и детектор магнитных аномалий (MAD)."
