 FIN_Encourage_Rapid_Urbanization:0 "Поощрять быструю урбанизацию"
 FIN_Join_the_USSR:0 "Присоединиться к СССР"
 FIN_Push_for_Integration_into_the_Eastern_Bloc:0 "Подталкивать к интеграции в Восточный блок"
 FIN_Encourage_Rapid_Urbanization_desc:0 "Быстрая урбанизация необходима для превращения наших городов в промышленные центры"
 FIN_Implement_Land_Reform:0 "Провести земельную реформу"
 FIN_Collectivist_Propaganda:0 "Запустить кампанию коллективистской пропаганды"
 FIN_Return_of_red_valpo:0 "Возвращение Valtiollinen poliisi"
