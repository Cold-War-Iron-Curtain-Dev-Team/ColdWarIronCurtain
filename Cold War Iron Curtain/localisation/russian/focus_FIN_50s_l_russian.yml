 FIN_Combat_Inflation:0 "Борьба с инфляцией"
 FIN_The_Finnish_Army:0 "Маавоимат"
 FIN_Import_British_Rifles:0 "Закупка излишков британских винтовок"
 FIN_Restart_Mobilization:0 "Asevelvollisuuslaki 1950"
 FIN_Acquire_Soviet_T55s:0 "Приобрести советские Т-55"
 FIN_The_Finnish_Navy:0 "Merivoimat"
 FIN_Request_Soviet_Economic_Aid:0 "Запросить советскую экономическую помощь"
 FIN_Begin_COMECON_Negotiations:0 "Переговоры КОМЕКОН"
 FIN_The_Death_of_President_Pekkala:0 "Смерть президента Пеккала"
 FIN_invest_in_medical_field:0 "Грантовые кредиты медицинским компаниям"
 FIN_invest_in_medical_field_desc:0 "Мы предоставим различным медицинским исследовательским компаниям крупные кредиты с длительным сроком погашения. Наряду с этим мы предоставляем больницам и клиникам дополнительное финансирование."
 FIN_criticize_right_parties:0 "Критиковать правые партии"
 FIN_invest_in_lapland:0 "Инвестиции в Лапландию"
 FIN_President_Kilpi:0 "Президент Килпи"
 FIN_audit_the_police:0 "Аудит полицейских сил"
 FIN_audit_the_police_desc:0 "Мы должны убедиться, что наша полиция не занимает никаких крайних позиций, будь то левые или правые"
 FIN_Declare_A_One_Party_State:0 "Провозгласить однопартийное государство"
 FIN_Declare_A_One_Party_State_desc:0 "Одна нация, одна партия, один лидер"
 FIN_Nationalize_the_Financial_Industry:0 "Национализировать финансовую промышленность"
 FIN_Nationalize_the_Financial_Industry_desc:0 "Корень всех зол - в финансовой индустрии. Мы должны национализировать их для народа"
 FIN_Soviet_Technical_Advisors:0 "Советские технические советники"
 FIN_Establish_Communes:0 "Кансанкоммуни"
 FIN_Salami_Tactics:0 "Подрыв социал-демократов"
 FIN_Exile_Prominent_Social_Democrats:0 "Изгнать видных социал-демократов"
 FIN_Outlaw_Right_Wing_Parties:0 "Объявить правые партии вне закона"
 FIN_Renegotiate_the_YYA:0 "Новый YYA"
 FIN_Seek_American_Credit:0 "Искать американский кредит"
 FIN_End_Rationing:0 "Покончить с рационированием"
 FIN_End_Rationing_desc:0 "0 \"Несмотря на то, что война закончилась уже несколько лет назад, мы все еще нормируем некоторые товары, такие как кофе и сахар. Сейчас, когда наша экономика растет, а идея дефицита осталась далеко позади, мы можем, наконец, прекратить непопулярную программу нормирования."
 FIN_Reformation_of_the_Red_Guard:0 "Новая Красная гвардия"
 FIN_Encourage_Social_Stability:0 "Поощрять социальную стабильность"
 FIN_Strengthen_the_Banking_Sector:0 "Укрепление банковского сектора"
 FIN_censor_anti_soviet_media:0 "Цензура антисоветских СМИ"
 FIN_peace_forever:0 "Выступать за мир во всем мире"
 FIN_peace_forever_desc:0 "В это напряженное время мы должны выступать за мир во всем мире"
 FIN_Oust_Communists_From_Government_Positions:0 "Финансирование промышленных исследований"
 FIN_Oust_Communists_From_Government_Positions_desc:0 "Технологии развиваются стремительно, мы должны следить за тем, чтобы не отставать"
 FIN_SDP_Domination_of_SAK:0 "Доминирование СДП над САК"
 FIN_SDP_Domination_of_SAK_desc:0 "Социал-демократическая партия имеет большое влияние на Финскую федерацию профсоюзов"
 FIN_Outmaneavor_the_Communists:0 "Перехитрить коммунистов"
 FIN_Preserve_Finnish_Sovereignty:0 "Сохранять суверенитет Финляндии"
 FIN_improve_welfare:0 "Улучшить благосостояние"
 FIN_rural_development:0 "Развитие сельских районов"
 FIN_Advocate_for_Finnish_Sovereiegnty:0 "Выступать за суверенитет Финляндии"
 FIN_Advocate_for_Finnish_Sovereiegnty_desc:0 "Мы должны сохранить свое место в качестве суверенной нации"
 FIN_Encourage_Athelticism:0 "Поощрять атлетизм"
 FIN_Encourage_Athelticism_desc:0 "Мы должны поощрять людей заниматься спортом, чтобы сохранить их здоровье"
 FIN_Seek_Soviet_Credit:0 "Искать советские кредиты"
 FIN_Seek_Soviet_Credit_desc:0 "Наша стандартная боевая винтовка должна быть FN FAL копия RK-53"
 FIN_Suspend_Rationing:0 "Приостановить нормирование"
 FIN_A_Civic_Peace:0 "Гражданский мир"
 FIN_american_imports_desc:0 ""
 FIN_Active_Neutrality:0 "Активный нейтралитет"
 FIN_Active_Neutrality_desc:0 "Вместо того, чтобы выбирать между Востоком и Западом, давайте будем нейтральными"
 FIN_Apply_to_Join_the_UN2:0 "Подать заявку на вступление в ООН"
 FIN_Apply_to_Join_the_UN2_desc:0 ""
 FIN_Currency_Reforms:0 "Реформировать марку"
 FIN_Currency_Reforms_desc:0 "Марка нуждается в реформе в соответствии с современными требованиями."
 FIN_Priortize_Industrial_Development:0 "Приоритет промышленного развития"
 FIN_Join_The_Nordic_Union2:0 "Вступить в Северный совет"
 FIN_Join_The_Nordic_Union2_desc:0 "После смерти Сталина мы можем более свободно контролировать нашу собственную внешнюю политику. Поэтому нам следует вступить в Северный совет, чтобы расширить сотрудничество Северных стран."
 FIN_join_nordic_council:0 "Присоединиться к Северному совету"
 FIN_join_nordic_council_desc:0 "После смерти Сталина мы можем более свободно контролировать нашу собственную внешнюю политику. Поэтому нам следует присоединиться к Северному Совету, чтобы расширить сотрудничество Северных стран."
 FIN_Delay_Wage_and_Price_Adjustments:0 "Отложить корректировку заработной платы и цен"
 FIN_Censor_Anti_Communist_Propaganda:0 "Установить отношения с КНР"
 FIN_Censor_Anti_Communist_Propaganda_desc:0 "Кажется вероятным, что КНР победит в гражданской войне. Мы должны признать это и установить с ними какие-то отношения"
 FIN_Begin_Further_Economic_Negotiations:0 "Укрепить автономию Аландских островов"
 FIN_Begin_Further_Economic_Negotiations_desc:0 "Автономный статус Аландских островов был подтвержден решением Лиги Наций, принятым в 1921 году по итогам спора об Аландских островах. По закону Аландские острова являются политически нейтральными и полностью демилитаризованными, а их жители освобождены от призыва в Силы обороны Финляндии. Парламент Финляндии предоставил Аландским островам широкую автономию в соответствии с Законом об автономии Аландских островов 1920 года. В настоящее время парламент разработал проект нового закона, заменяющего закон 1920 года на более современный."
