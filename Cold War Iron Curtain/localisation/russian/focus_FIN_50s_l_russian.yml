 fin_sov_aid_tt:0 "§YМы попросим у Советов экономической помощи, а также помощи в промышленности"
 FIN_Kickstart_Reconstruction:0 "Начать реконструкцию"
 FIN_Kickstart_Reconstruction_desc:0 "Чтобы улучшить нашу экономику и выплатить репарации за войну, мы должны развивать нашу промышленность"
 FIN_Accomadate_the_Population_Boom:0 "Успокоить демографический бум"
 FIN_Accomadate_the_Population_Boom_desc:0 "Наша рождаемость сильно возросла. Теперь мы должны строить жилье, чтобы всем было где жить"
 FIN_The_Finnish_Defense_Forces:0 "Puolustusvoimat"
 FIN_The_Finnish_Defense_Forces_desc:0 "Мы должны посмотреть на наши вооруженные силы и улучшить их, чтобы не отставать от наших врагов"
 FIN_Elections_of_1956:0 "Президентские выборы 1956 года"
 FIN_Elections_of_1956_desc:0 ""
 FIN_The_Paasikivi_Kekkonen_Doctrine:0 "Доктрина Паасикиви-Кекконена"
 FIN_The_Paasikivi_Kekkonen_Doctrine_desc:0 "Доктрина Паасикиви-Кекконена означает линию внешнеполитического нейтралитета Финляндии после Второй мировой войны. Событие, разблокированное в результате фокуса, объяснит это более подробно."
 FIN_Bolster_Domestic_Industry:0 "Укрепление отечественной промышленности"
 FIN_Bolster_Domestic_Industry_desc:0 "Чтобы помочь нашей экономике, мы должны финансировать некоторые отрасли промышленности, чтобы убедиться, что они могут модернизироваться."
 FIN_Crush_the_Kemi_Strike:0 "Подавить забастовку в Кеми"
 FIN_Crush_the_Kemi_Strike_desc:0 "После того как мы объявили о снижении зарплаты работников лесозаготовительной компании Kemi Oy на 30%, они начали бастовать, и с каждым днем к ним присоединяется все больше и больше работников. Мы должны подавить эти забастовки как можно скорее"
 FIN_Sideline_the_Communists:0 "Остановить коммунистов"
 FIN_Sideline_the_Communists_desc:0 "Необходимо помешать коммунистам получить слишком большую власть в правительстве"
 FIN_Elections_of_1950:0 "Президентские выборы 1950 года"
 FIN_Pekkala_Victory:0 "Победа Мауно Пеккала"
 FIN_Pekkala_Victory_desc:0 "Мауно Пеккала победил на президентских выборах 1950 года"
 FIN_explore_automated_computing:0 "Изучить автоматизированные вычисления"
 FIN_explore_automated_computing_desc:0 "Во всем мире быстро развиваются способы создания машин, которые могут вычислять и делать все гораздо быстрее, чем человек. Мы должны выделить средства Хельсинскому технологическому университету на исследование этой технологии"
 FIN_Vaccine_Mandates:0 "Обязательная вакцинация"
 FIN_Vaccine_Mandates_desc:0 "Благодаря вакцинам мы можем искоренить многие болезни"
 FIN_Reconstruction_in_Lappland:0 "Реконструкция Лапландии"
 FIN_Reconstruction_in_Lappland_desc:0 "Хотя Лапландия сильно пострадала во время Лапландской войны, до сих пор мы не могли полностью посвятить себя ее восстановлению. Пришло время изменить это и инвестировать в регион"
 FIN_End_Wage_Controls:0 "Прекратить контроль над заработной платой"
 FIN_End_Wage_Controls_desc:0 "Теперь, когда послевоенный экономический кризис стал более мягким, мы можем, наконец, прекратить контроль над заработной платой."
 FIN_Preserve_Friendly_Relations_with_Stalin:0 "Сохранить дружеские отношения со Сталиным"
 FIN_Preserve_Friendly_Relations_with_Stalin_desc:0 "Дружить со стальным человеком выгодно для нас"
 FIN_Lobby_for_The_Return_of_Pokkala:0 "Ситуация с Порккалой"
 FIN_Lobby_for_The_Return_of_Pokkala_desc:0 "Мы арендовали небольшую военно-морскую базу рядом с Хельсинки для Советского Союза до конца 1990-х годов. Мы должны попытаться вернуть ее раньше"
 FIN_The_FInnish_Air_Force:0 "Ilmavoimat"
 FIN_The_FInnish_Air_Force_desc:0 "Наши ВВС находятся не в лучшей форме. Они малы и используют устаревшие самолеты. Мы должны их модернизировать"
 FIN_Purchase_British_Vampires:0 "Приобрести британских вампиров"
 FIN_Purchase_British_Vampires_desc:0 "Несомненно, наши ВВС устарели. В век реактивных самолетов у винтового самолета нет шансов против реактивного истребителя. По этой причине правительство выделило ВВС гранты, чтобы они вступили в эру реактивных самолетов"
 FIN_Import_the_Folland_Gnat:0 "Импортировать Folland Gnats"
 FIN_Acquire_French_CM170_Magisters:0 "Приобрести французские CM170 Magisters"
 FIN_close_kansainhuoltominist:0 "Закрыть Kansanhuoltoministeriö"
 FIN_close_kansainhuoltominist_desc:0 "В 1939 году в связи с зимней войной мы начали нормировать питание. И это продолжается до сих пор, хотя военные времена давно позади. Каждый день люди жалуются, что им не хватает кофе. Конечно, мы постепенно сокращаем нормирование. В целях дальнейшего содействия этому мы прекращаем нормирование некоторых продуктов и закрываем министерство, контролирующее нормирование, передавая его функции в другие ведомства"
 FIN_Complete_Soviet_Reperations:0 "Полные советские репарации"
 FIN_Complete_Soviet_Reperations_desc:0 "Наконец-то, после долгих лет, мы выплатили наш военный долг Советскому Союзу"
 FIN_crackdown_on_heroin_epidemic:0 "Ограничить употребление героина"
 FIN_crackdown_on_heroin_epidemic_desc:0 "Употребление героина переросло в серьезную эпидемию. Мы должны ограничить его доступность, чтобы бороться с негативными последствиями, которые он оказывает на наше население"
 FIN_President_Kuusinen:0 "Куусинен вступает в должность"
 FIN_President_Kuusinen_desc:0 "Вы никогда не найдете более жалкого улья мерзавцев и негодяев"
 FIN_Join_COMECON:0 "Присоединиться к COMECON"
 FIN_Request_Soviet_Advisors:0 "Запрос советских военных советников"
 FIN_Request_Soviet_Advisors_desc:0 "Учитывая наши тесные отношения с Советским Союзом, наша армия может договориться о привлечении советских советников для оказания помощи нашим военным"
 FIN_Seize_Control_of_the_Labor_Unions:0 "Захватить контроль над профсоюзами"
 FIN_Seize_Control_of_the_Labor_Unions_desc:0 "Профсоюзы должны полностью контролироваться рабочими"
 FIN_Abolish_the_Constitution:0 "Отменить Конституцию"
 FIN_Abolish_the_Constitution_desc:0 "\"Это законно?\" \"Я сделаю это законным.\""
 FIN_Request_Karelia:0 "Переговоры о Карелии"
 FIN_Request_Karelia_desc:0 "Все знают, что Карелия - финская. Мы должны попытаться хотя бы контролировать ее"
 FIN_Establish_The_Finnish_Peoples_Republic:0 "Учредить Финскую Демократическую Республику"
 FIN_Establish_The_Finnish_Peoples_Republic_desc:0 "Я - сенат!"
 FIN_Allow_Soviet_Basing:0 "Разрешить советское базирование"
 FIN_Allow_Soviet_Basing_desc:0 "Советы предложили, что в обмен на некоторую сумму денег им будет разрешено использовать наши порты для своих кораблей."
 FIN_Increase_Soviet_Ties:0 "Расширить связи с Советским Союзом"
 FIN_Tax_Cuts:0 "Сокращение налогов"
 FIN_Increase_Pensions:0 "Увеличение пенсий"
 FIN_Increase_Steel_Production:0 "Улучшить производство стали"
 FIN_Renegotiate_Soviet_Reperations:0 "Пересмотреть советские репарации"
 FIN_Renegotiate_Soviet_Reperations_desc:0 "Благодаря нашим своевременным платежам мы смогли договориться о снижении репараций на некоторую сумму. Это означает, что мы покончим с ними максимум через несколько лет"
 FIN_New_Land_Clearings:0 "Новые сельскохозяйственные угодья"
 FIN_Hydroelectric_Dam_Campaign:0 "Кампания по строительству плотины гидроэлектростанции"
