 FIN_strengthen_SAK_desc:0 ""
 FIN_ARAVA_loans:0 "Арава Кредиты"
 FIN_ARAVA_loans_desc:0 "Asuntorakennustuotannon valtuuskunta, или Arava - это система, организующая выдачу низкопроцентных кредитов на производство жилья с использованием дешевого, субсидируемого государством кредита. Цель системы - производство доступного жилья, отвечающего определенным критериям качества. На средства \"Аравы\" строится арендное жилье, индивидуальные дома, жилье на правах собственности и студенческое жилье. В условиях финансирования присутствует социальный элемент, поэтому на использование и передачу жилья накладываются различные ограничения.\n\nКредиты \"Арава\" также стали причиной краха кабинета Кекконена IV. Хотя кабинет хотел, чтобы сумма кредитов составляла 5 млрд. рублей, парламент в итоге проголосовал за 7,5 млрд. рублей. На следующий день кабинет подал в отставку"
 FIN_fate_of_k_program:0 "Судьба программы \"К"
 FIN_fate_of_k_program_desc:0 "Программа \"К\" - это предложенная политика, направленная на решение проблем конкурентоспособности финской промышленности. Несмотря на то, что кабинет Кекконена IV, казалось бы, отказался от этой программы, она всплыла в качестве потенциальной альтернативы недавно предложенной программе S. Это неожиданное возрождение вызвало новый интерес и дебаты вокруг потенциального влияния программы K на финскую экономику"
 FIN_paasikivi_56:0 "Победа черного коня"
 FIN_paasikivi_56_desc:0 ""
 FIN_move_againts_communist_takeover:0 "Движение против коммунистического захвата"
 FIN_move_againts_communist_takeover_desc:0 "Коммунисты пытаются захватить профсоюзы, полицию и все, что они могут. Мы должны положить этому конец"
 FIN_promote_finnish_unity:0 "Продвигать финское единство"
 FIN_promote_finnish_unity_desc:0 "Стабильность важнее, чем какой-то крестовый поход против коммунистов"
 FIN_kekkonen_voted:0 "Кекконен заменил Паасикиви"
 FIN_kekkonen_voted_desc:0 "Кекконен сменил Паасикиви на посту президента, решение принято парламентским голосованием"
 FIN_kuusinen_voted:0 "Куусинен сменил Паасикиви"
 FIN_kuusinen_voted_desc:0 "Куусинен сменил Паасикиви на посту президента, решение принято парламентским голосованием"
 FIN_support_kekkonen:0 "Поддерживаю Кекконена в качестве преемника"
 FIN_support_kekkonen_desc:0 "Избранный в возрасте 85 лет, Паасикиви, не секрет, может умереть в любой день. Мы надеемся, что это произойдет после окончания его президентского срока, но ничего нельзя сказать наверняка. Поэтому Паасикиви решил поддержать Кекконена, который станет его преемником в случае, если Паасикиви умрет на посту президента"
 FIN_criticize_polarization:0 "Продвигать права шведов"
 FIN_criticize_polarization_desc:0 "\"Следите за тем, чтобы в финских школах преподавалось достаточное количество шведского языка! Если вы перестанете преподавать шведский язык, он может быть заменен другим иностранным языком - и я могу вас заверить, что это не испанский!\n\"\n-J. К. Паасикиви, беседа с Йоханнесом Виролайненом о планах Аграрной лиги сократить шведское образование"
 FIN_finno_soviet_student_program:0 "Финно-советская студенческая программа"
 FIN_finno_soviet_student_program_desc:0 "Мы оба выиграли бы от расширения программы обмена студентами"
 FIN_foster_left_unity:0 "Содействовать левому единству"
 FIN_foster_left_unity_desc:0 "По отдельности мы слабы. Вместе мы сильны. Мы должны стремиться к объединению левых сил наших стран под одним знаменем\". Kaikkien maiden proletaarit, liittykää yhteen!"
 FIN_ties_with_neutrals:0 "Встреча с нейтральными странами"
 FIN_ties_with_neutrals_desc:0 "Мы должны организовать встречи с лидерами более нейтральных стран"
 FIN_tactically_maneuver_politics:0 "Штабная полиция с коммунистами"
 FIN_tactically_maneuver_politics_desc:0 "Нынешняя полиция слишком правая. Чтобы сбалансировать ее, мы должны заменить некоторых членов коммунистами"
 FIN_free_sciences:0 "Программа развития сельских районов"
 FIN_free_sciences_desc:0 "Фермеры и другие сельские работники являются основой нашего общества. В связи с этим было принято решение о запуске программы \"Maaseudun ja pienkylien parannusohjelma\" (Программа развития сельской местности и малых деревень). В рамках этой программы средства будут перенаправлены из городских районов в сельскую местность и малые деревни. Она включает в себя улучшение дорог, водопровода/электричества, а также улучшение работы аварийных служб в этих районах"
 FIN_tone_down_marxist_agenda:0 "Tone Down Marxist Agenda"
 FIN_tone_down_marxist_agenda_desc:0 "Хотя наш путь к социализму был успешно начат, теперь, похоже, мы должны его смягчить. По данным полиции безопасности, более правые элементы начинают объединяться и, возможно, даже начнут применять насилие против нас. На заседании правительства было принято решение сократить коммунистическую и марксистскую политику нашего правительства. Надеюсь, это предотвратит насилие и рост правых радикалов"
 FIN_advocate_for_peaceful_socialism:0 "Усилить наблюдение за правыми"
 FIN_advocate_for_peaceful_socialism_desc:0 "Мы должны следить за тем, чтобы правое крыло не стало слишком сильным или радикальным"
 FIN_finnocommunism:0 "Улучшение благосостояния"
 FIN_finnocommunism_desc:0 "Улучшение благосостояния"
 FIN_freeslot:0 "Секуляризация общества"
 FIN_freeslot_desc:0 "Религия уходит"
 FIN_Imitate_Swedish_welfare:0 "Подражать шведской системе социального обеспечения"
 FIN_Imitate_Swedish_welfare_desc:0 "У нашего западного соседа есть несколько хороших идей в области социального обеспечения. Мы должны попытаться перенять некоторые из них у себя"
 FIN_advocate_for_church_gov_seperation:0 "Начать отделение церкви от государства"
 FIN_advocate_for_church_gov_seperation_desc:0 "\"Религия должна быть объявлена частной. Церковь должна быть отделена от государства, а церковные и религиозные общины должны рассматриваться как частные объединения, самостоятельно организующие свои внутренние дела. Религиозное образование должно быть исключено из школьного образования.\"\n-Из программы \"Форсса\" Социал-демократической партии Финляндии"
 FIN_two_german_policy:0 "Политика двух Германий"
 FIN_two_german_policy_desc:0 "Kahden Saksan politiikka\" (\"Политика двух Германий\") означает политику балансирования наших отношений с обеими Германиями. Однако о признании любой из них пока не может быть и речи"
 FIN_scandinavian_exhange_program:0 "Программа обмена студентами Северных стран"
 FIN_scandinavian_exhange_program_desc:0 "Мы должны предложить программу обмена студентами Северных стран"
 FIN_relax_censorship_laws:0 "Ослабить законы о цензуре"
 FIN_relax_censorship_laws_desc:0 "Большая часть наших законов о цензуре была введена либо для того, чтобы умиротворить Советский Союз,\ \"Чтобы защитить общественность от морально неправильных, непристойных, жестоких или психически вредных произведений, которые могут угрожать общественному порядку и безопасности, национальной обороне или ухудшить отношения страны с иностранными державами.\ \"Теперь мы должны ослабить эти законы, чтобы обеспечить большую свободу для прессы и средств массовой информации. Однако некоторая цензура будет сохранена"
 FIN_accept_cia_funding:0 "Принимаю тайное финансирование ЦРУ"
 FIN_accept_cia_funding_desc:0 "§RHUIPPUSALAINEN/TOP SECRET§!\n\nНаша партия, социал-демократы, получала финансирование ЦРУ с 1949 года. Однако теперь они предложили нам новую сделку. В обмен на допуск агентов ЦРУ в страну они готовы \"набить наши карманы\" дополнительным финансированием и военной разведкой."
 FIN_tyollisyystyot:0 "Työllistymisohjelma"
 FIN_tyollisyystyot_desc:0 "Työllistymisohjelma (программа занятости) - это предлагаемая идея, согласно которой правительство предлагает простые рабочие места, чтобы уменьшить безработицу.\nЭто потребует 1 миллиард из вашего бюджета."
 FIN_strengthen_the_party:0 "Укрепление партии"
 FIN_strengthen_the_party_desc:0 "Мы должны сделать так, чтобы наша партия оставалась актуальной в финской политике"
 FIN_nordic_democracy:0 "Vapaa, Vankka, Vakaa"
 FIN_nordic_democracy_desc:0 "Свободная, сильная, стабильная"
 FIN_foster_soviet_relations:0 "Легкая критика Советского Союза"
 FIN_foster_soviet_relations_desc:0 "Мы не можем позволить, чтобы над нами издевались, если они сильнее нас"
 FIN_Block_Communist_influences:0 "Блокировать коммунистическое влияние"
 FIN_Block_Communist_influences_desc:0 "Мы должны следить за тем, чтобы коммунисты не получили слишком много власти"
 FIN_improve_farms:0 "Улучшить фермы"
 FIN_Increase_Soviet_Ties_desc:0 "Мы должны следить за тем, чтобы Советский Союз был дружелюбен к нам"
 fin_karelia:0 "Хотя принятие выгодого для нас решения маловероятно, мы отправили предложение о возвращении Карелии советскому правительству"
 fin_critique_right_tt:0 "Мы не уверены, насколько сильный эффект будет иметь речь, если эффект вообще будет"
 kuusinen1:0 "Хертта Куусинен сменила Мауно Пеккала"
 korean_inflation:0 "У нас инфляционный кризис"