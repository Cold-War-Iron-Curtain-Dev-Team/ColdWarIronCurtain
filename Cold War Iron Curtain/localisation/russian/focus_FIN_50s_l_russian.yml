 FIN_Prepare_for_the_Helsinki_Olympics:0 "Подготовиться к Олимпийским играм в Хельсинки"
 FIN_Prepare_for_the_Helsinki_Olympics_desc:0 "Летние Олимпийские игры 1952 года (фин.: Kesäolympialaiset 1952), официально известные как Игры XV Олимпиады (фин.: XV olympiadin kisat) и широко известные как Хельсинки 1952 года - это предстоящие Олимпийские игры. После того как в 1938 году Япония заявила, что не сможет принять Олимпиаду 1940 года в Токио из-за продолжающейся Второй китайско-японской войны, Хельсинки был выбран местом проведения летних Олимпийских игр 1940 года, которые затем были отменены из-за Второй мировой войны. Теперь, когда война позади, мы наконец-то сможем принять игры"
 FIN_Resettle_the_Displace_Finns:0 "Переселить перемещенных финнов"
 FIN_Kekkonen_Victory:0 "Победа Кекконена"
 FIN_Placate_the_Communists:0 "Успокоить коммунистов"
 FIN_Increase_Wages:0 "Корректировка заработной платы"
 FIN_Expand_Exports:0 "Расширение экспорта"
 FIN_Housing_Expansion:0 "Расширение жилищного строительства в городах"
