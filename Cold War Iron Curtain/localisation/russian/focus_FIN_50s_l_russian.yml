 FIN_soviet_boost_to_un_desc:0 "Если мы сможем добиться от Советов поддержки нашего членства, мы должны легко попасть в ООН"
 FIN_support_stalinism:0 "Расширить нефтехранилище Тупавуори"
 FIN_support_stalinism_desc:0 "В связи с растущим спросом на нефть нам необходимо место для ее хранения. Поэтому парламент принял решение о выделении средств на расширение нефтехранилища Тупавуори в Наантали."
 FIN_end_rationing_klp:0 "Положить конец всем рационам"
 FIN_end_rationing_klp_desc:0 "Хотя война закончилась уже несколько лет назад, мы все еще нормируем некоторые товары, такие как кофе и сахар. Сейчас, когда наша экономика растет, а идея дефицита осталась далеко позади, мы можем, наконец, прекратить непопулярную программу нормирования."
 FIN_state_owned_unions:0 "Увеличить полномочия союза"
 FIN_state_owned_unions_desc:0 "Благодаря профсоюзам наши рабочие получили столь необходимые права. Но работа еще не закончена, и поэтому мы должны предоставить профсоюзам больше полномочий, чтобы добиться еще больших прав для рабочих."
 FIN_test_five_year_plan:0 "Pohjoismainen Viisivuotissuunnitelma"
 FIN_test_five_year_plan_desc:0 "Парламент предложил новый экономический план, получивший название \"Pohjoismainen Viisivuotissuunnitelma\" (Северный пятилетний план). Он представляет собой уникальную смесь экономического планирования Восточного блока и Северных стран."
 FIN_modernize_train_traffic:0 "Государственный визит в Восточный блок"
 FIN_modernize_train_traffic_desc:0 "Чтобы показать нашу поддержку социализму, Куусинен решил совершить турне по странам Восточного блока."
