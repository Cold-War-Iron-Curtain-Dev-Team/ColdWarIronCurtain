 FIN_Fagerholm_Victory_desc:0 "Вице-спикер Вяйне Лескинен зачитывает вслух бюллетени для голосования: Фамилия Кекконена звучит 149 раз, Фагерхольма - 151 раз. После обратного отсчета Фагерхольм сам объявляет, что он избран президентом на шестилетний срок с 1956 по 1962 год. Из зала раздаются аплодисменты, но они прекращаются, когда премьер-министр бросает на них взгляд."
