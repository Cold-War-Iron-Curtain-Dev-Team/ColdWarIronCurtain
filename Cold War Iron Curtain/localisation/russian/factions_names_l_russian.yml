  ##Warsaw Pact
  Leader_of_the_Socialist_Nations:0 "Единый и Moгучий - Советский Союз"
  Leader_of_the_Socialist_Nations_desc:0 "£Faction_Home_of_the_Revolution_pic\n\n\n\n\n\n\n\n\nИменно на этой земле мир стал свидетелем зарождения первой социалистической революции — момента, который разрушил старый имперский порядок и породил рабочее государство, не похожее ни на одно из прежних. Советский Союз возник не просто как новая нация, но и как символ революционного неповиновения, отбросив многовековое царское правление в пользу системы, которая обещала власть пролетариату. Когда мир столкнулся с бедствием фашизма, именно Красная Армия несла самое тяжелое бремя, сломав нацистскую военную машину и победоносно войдя в Берлин. Эта победа была не только военной, но и идеологической.\n\nВ последующие годы миллионы людей по всему миру смотрели на Советский Союз как на авангард международного дела социализма. От фабрик Европы до колоний, стремящихся к независимости, СССР рассматривается как маяк антиимпериализма и социальных преобразований. Она несла факел Маркса и Ленина, и многие верили, что однажды она приведет человечество в новую эру, где больше не будет править капитал, а рабочие всего мира объединятся под красным знаменем коммунизма."
  Warsaw_Treaty_Organization_member:0 "Eastern Bloc Socialist States"
  Socialist_oriented_countries:0 "States of Socialist Orientation"
