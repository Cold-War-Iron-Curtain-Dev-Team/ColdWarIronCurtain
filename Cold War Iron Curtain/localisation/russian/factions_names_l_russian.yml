  ##Generic
  Generic_Faction:0 "Member of the [This.GetFactionName]"
  Generic_Faction_desc:0 "[This.GetNameDefCap] is a member of the [This.GetFactionName]. They are in a faction, which means that if any of its members were to be attacked or otherwise have entered a war, members of the alliance will join their war in aid for their comrade. They can act as a unison in the world stage, and can project their influence as a result of their collective power. It may also not be limited to a military pact, but it can expand on many fronts, such as economic co-operation and other forms of collaboration that mutually benefits its members."
 
  ##NATO
  Leader_of_the_Free_World:0 "Leader of the Free World"
  Leader_of_the_Free_World_desc:0 "As the founding pillar and most powerful member of the North Atlantic Treaty Organization, the United States of America stands as the backbone of NATO, shaping its direction, capabilities, and strategic posture from its inception to the present day. Washington’s political will, military might, and economic resources are not just integral—they are indispensable. Without American commitment, NATO would be a shell of its current form; it was the United States that rallied war-weary Western nations into a collective defense pact at the dawn of the Cold War, and it is the United States that continues to guarantee its deterrence today.\n\nBeyond mere membership, the U.S. plays a central leadership role—providing the majority of NATO’s military capabilities, hosting key command structures, and driving its operational priorities. From the nuclear umbrella that deters existential threats, to high-end military logistics, surveillance, intelligence, and rapid deployment capacity, America's contributions dwarf those of any other ally."
