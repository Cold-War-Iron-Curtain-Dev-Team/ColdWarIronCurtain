 ISR_Rights_For_Palestinians_desc: ""
 ISR_Kibbutzim_Question: "Вопрос о кибуцах"
 ISR_Kibbutzim_Question_desc: ""
 ISR_Industry_Question: "Национализировать промышленность?"
 ISR_Industry_Question_desc: ""
 ISR_Multiculturalism: "Мультикультурализм"
 ISR_Multiculturalism_desc: ""
 ISR_Soviet_Backed_Arab_Israeli_Peace_Talks: "Арабо-израильские мирные переговоры при поддержке СССР"
 ISR_Soviet_Backed_Arab_Israeli_Peace_Talks_desc: ""
 ISR_Legalize_Homosexuality: "Легализовать гомосексуализм"
 ISR_Legalize_Homosexuality_desc: ""
 ISR_A_Binational_State: "Двунациональное государство"
 ISR_A_Binational_State_desc: "Белградские соглашения увенчались большим успехом! Мы, наконец достигли соглашения с палестинцами, и план состоит в том, чтобы стать двунациональным государством к середине 60-х годов. Однако это наверняка вызовет большой резонанс со стороны нашей оппозиции в Кнессете. "
 ISR_Negotiatie_with_Jordan: " Переговоры с Иорданией "
 ISR_Negotiatie_with_Jordan_desc: "Нам необходимо найти дипломатическое решение наших вопросов с Иорданией. Мы оба хотим Западный берег и Восточный Иерусалим, и только один из нас может получить их, но должен быть способ разобраться в этом."
 ISR_Limit_Labor_Unions_Political_Influence: "Ограничить политическое влияние профсоюзов"
 ISR_Limit_Labor_Unions_Political_Influence_desc: "Хотя профсоюзы важны для любого современного индустриального общества, в настоящее время они имеют слишком большое влияние, и вся ситуация напоминает коммунизм. Мы не будем их полностью упразднять или отодвигать на второй план, но мы ограничим их влияние."
 ISR_Settler_Economics: "Расширить 5 программ MEMS"
 ISR_Settler_Economics_desc: " 5 программ MEMS были введены только в предварительном порядке, чтобы протестировать воду и посмотреть, одобрит ли население. Теперь, когда у нас есть зеленый свет, мы должны расширить их, чтобы они могли полностью раскрыть свой потенциал."
 ISR_Population_Expulsions: "Идолизация ЦАХАЛа"
 ISR_Population_Expulsions_desc: "ЦАХАЛ - одна из элитных боевых сил мира, и к ней следует относиться так же, как к морской пехоте США и другим. Это то, чем наш народ может гордиться, и мы должны дать ему возможность сделать это"
 ISR_Secular_Education_Reform: "Реформы светского образования"
 ISR_Secular_Education_Reform_desc: "Нам нужно изменить несколько вещей в нашей системе образования. Во-первых, она нуждается в общей перестройке в разработке курсов и планировке школ. Во-вторых, нам нужно отойти от тяжелых религиозных школ и продвигать более светский список курсов."
 ISR_General_Zionist_Victory: "Общая сионистская победа"
 ISR_General_Zionist_Victory_desc: "В том, что оказалось решающим голосованием против социалистической политики Бен Гуриона и Мапай и программ жёсткой экономии, Всеобщая сионистская партия победила на израильских выборах 1951 года. Они будут придерживаться более капиталистической и демократической программы."
 ISR_Promote_Capitalism: "Продвигать капитализм"
 ISR_Promote_Capitalism_desc: "Капитализм - это то, что заставляет мир крутиться. Это единственный способ успешного управления экономикой. Коммунизм никогда не будет работать, и мы должны убедиться, что наши люди понимают и принимают оба этих факта."
 ISR_End_Histadrut_Economic_Control: "Конец экономического контроля Гистадрута"
 ISR_End_Histadrut_Economic_Control_desc: "Гистадрут (всеобщие профсоюзы) имеет слишком большой контроль над экономикой страны, чтобы нам это нравилось. Пришло время изменить нашу страну, сделав её более ориентированной на работодателей"
 ISR_Support_The_Middle_Class: "Поддерживать средний класс"
 ISR_Support_The_Middle_Class_desc: "Средний класс - это жизненная кровь нашей экономики, а также самый большой из трех классов в нашей стране. Поддерживая их, мы не только получаем большой процент одобрения Израиля, но и улучшаем нашу экономическую мощь."
 ISR_A_Beacon_of_Freedom: "Маяк свободы"
 ISR_A_Beacon_of_Freedom_desc: "Мы - единственная демократическая страна на Ближнем Востоке, проблеск надежды в черной ночи, свет во тьме. Мы - маяк свободы и сила, с которой нужно считаться, и мы останемся таковыми на десятилетия, если не на века"
 ISR_Enshrine_Democratic_Values: "Закрепить демократические ценности"
 ISR_Enshrine_Democratic_Values_desc: "Как единственная демократическая страна на Ближнем Востоке, окруженная автократическими и фашистскими режимами, мы должны показать миру и нашим гражданам, что свобода и справедливость стоят того, чтобы за них умереть, и как единственный маяк свободы в нашем регионе, мы готовы это сделать."
 ISR_European_Trade_Deals: "Европейские торговые сделки"
 ISR_European_Trade_Deals_desc: "Поскольку мы всё больше и больше открываемся для мирового рынка, нам необходимо заключить торговые сделки с нашими друзьями в Европе, чтобы улучшить наши затраты на импорт и экспорт товаров туда и оттуда."
 ISR_Develop_Ashdod: "Развивать Ашдод"
 ISR_Develop_Ashdod_desc: "Ашдод, город на юго-востоке Израиля, является новым, перспективным городом. Его дальнейшее развитие принесет много пользы нашей экономике и местной инфраструктуре, а также нашим гражданам."
 ISR_Expand_the_Educational_System: "Расширить систему образования"
 ISR_Expand_the_Educational_System_desc: "Система образования, которая недавно была реформирована и реструктурирована, все ещё мала и не хватает в некоторых областях. Мы должны обеспечить нашим детям самое лучшее образование, поэтому это необходимо изменить."
 ISR_A_Jewish_Israel: " Еврейский Израиль"
 ISR_Torah_vAvodah_desc: "Израиль является, и всегда был, домом еврейского народа. Благодаря Божьей доброте, мы отвоевали большую часть святой земли, и с Божьей помощью остальная часть скоро будет нашей. Мы должны всеми силами бороться за наше наследие, чтобы однажды наши потомки могли назвать еврейскую Родину своей."
 ISR_A_Devout_Israel: " Благочестивый Израиль"
 ISR_A_Devout_Israel_desc: "Мы преуспели в нашем стремлении превратить Израиль из светской пустоши в настоящее еврейское государство. Пусть Бог поможет нам на следующем этапе нашего пути, когда наши враги подступают к нам со всех сторон, и обеспечит, чтобы мы вышли победителями!"
 ISR_Develop_the_Lands_of_Israel: " Развитие земель Израиля"
 ISR_Develop_the_Lands_of_Israel_desc: "Наша экономика, хотя и растет медленно, нуждается в толчке, чтобы действительно развиваться. Развитие некоторых сельских земель на севере и юге позволит достичь этого."
 ISR_A_Jewish_Educational_Framework: "Еврейская система образования"
 ISR_A_Jewish_Educational_Framework_desc: "Все наши школы должны обучать наших детей правильным еврейским ценностям, начиная с раннего возраста. Это будет большим шагом к тому, чтобы стать настоящим еврейским государством."
 ISR_Preserve_Traditional_Gender_Roles: "Запретить клубы в Шаббат"
 ISR_Preserve_Traditional_Gender_Roles_desc: "Слишком много светских израильтян ходят в клубы в Шаббат, когда они должны быть в Синагогах или дома со своими семьями. Мы можем легко исправить это, заставив клубы закрываться в Шаббат"
 ISR_Left_Faction_Histadrut: "Выборы в Гистадруте"
 ISR_Left_Faction_Mikunis: "Председатель Микунис"
 ISR_Left_Faction_Vilner: "Председатель Вильнер"
 ISR_Left_Faction_Sneh: "Председатель Снех"
 ISR_Discard_Zionism: "Отбросить сионизм"
 ISR_Befriend_Yugoslavia: "Дружба с Югославией"
 ISR_Religion_Debate: "Религиозная политика"
 ISR_Zionism_Debate: "Сионистский вопрос"
 sov_aid: "Советская экономическая помощь"
 Osem: "Осем"
 israel.5.d: "Сегодня Израиль был официально принят в Организацию Объединенных Наций, решение об этом было принято в ходе напряженного голосования, которое завершилось решением 37-12, тем самым запечатав хрупкую вещь, которой является независимость еврейской нации, по крайней мере, на данный момент. Поскольку Израиль демонстрирует определенную степень поддержки плана раздела ООН, никто не знает, будет ли достигнут мир, но, несомненно, многие считают что это первый шаг в череде многих других. В то время как западный мир начинает устанавливать связи и демонстрировать свою поддержку младенческому государству, арабские соседи Израиля в ярости, все ещё переживая неудачу в уничтожении Израиля. Возрожденное еврейское государство теперь оставило свой первый современный след в истории."
 israel.6.d: "После нескольких месяцев ожесточённых переговоров, Лозаннская конференция созванная ООН, наконец, подошла к концу. Вопросы конференции в основном касались последствий арабо-израильской войны 1948 года - включая границы, раздел Иерусалима и 700 000 палестинских беженцев, появившихся в результате конфликта. Линия разграничения, установленная после конфликта, согласно которой Израиль контролировал 60% от первоначального плана раздела палестинского государства была сохранена, несмотря на дальнейшие требования Израиля и к возмущению арабских государств. Кроме того, израильтяне отказались вернуть беженцев в их старые дома и отвергли 'предложение о 100 000 беженцев', предложенное ООН. Хотя напряженность остается высокой, а Египет и Иордания всё ещё оккупируют Западный берег и сектор Газа, кажется, что хрупкий мир в регионе был сохранен, и принятие Израиля в ООН должно помочь привести к мирному будущему для невероятно нестабильного региона."
 ISR_National_Insurance_Act_historical: "Закон о национальном страховании"
 ISR_National_Insurance_Act_historical_desc: "Нам необходимо стандартизировать и улучшить страхование всех видов для наших граждан, так как сейчас цены на страхование разнятся, как и процентные ставки. Если так будет продолжаться, это окажет негативное влияние на нашу экономику."
 israel.8.d: "В результате эта система работает таким образом, что жители городов и местных советов голосуют за мэра, а также выбирают членов местных и городских советов, причем эти голосования происходят каждые законодательные выборы. Впервые со времен арабской войны палестинцам разрешили голосовать за своих местных советников, и до сих пор весь процесс проходил гладко, без каких-либо серьёзных сообщений о политическом насилии. Результаты продолжают поступать, и народ Израиля, наконец, может оглянуться назад на постоянный конфликт 40-х годов, впервые с позиции относительного мира и безопасности."
 israel.7.d: "С момента нашей победы в войне за независимость ситуация на сирийской границе оставалась напряженной, при этом официальный мирный договор так и не был подписан. Смешанная израильско-сирийская комиссия ООН по перемирию работала над соблюдением условий перемирия, и после многих месяцев переговоров соглашение, наконец, было заключено. По условиям израильско-сирийского соглашения об общем перемирии, сирийские войска покинули оккупированные территории к западу от международной границы, которые теперь стали демилитаризованными зонами. Сирия по-прежнему официально сохраняет контроль над этими территориями. Однако, несмотря на успех переговоров о перемирии, многие все ещё сомневаются в возможности установления прочного мира в регионе."
 idea_Mordechai_Nurock: "Президент Мордехай Нурок"
 egged_bus: "Компания Egged Bus"
 israelelection.1: "Выборы в Кнессет 1951 года"
 israelelection.1.d: "В 1950 году образовался раскол между Давидом Бен-Гурионом и Мапай и их партнерами по религиозной коалиции, раскол касался образования новых иммигрантов и включения женщин в ЦАХАЛ, Давид Бен-Гурион хотел дать новым иммигрантам светское образование и включить женщин в ЦАХАЛ, в то время как религиозные партии яростно выступали против того и другого, Напряженность стала очевидной, когда программа образования Мапай была провалена в Кнессете, Бен-Гурион воспринял эту неудачу как вотум недоверия своему правительству, после чего объявил о роспуске правительства и назначил досрочные выборы. Несмотря на все эти неудачи в сочетании с растущей поддержкой капиталистических и центристских 'Общих сионистов' и других партий, Мапай все ещё выглядит доминирующей, но её позиции могут оказаться под угрозой, поскольку новые иммигранты всё больше разочаровываются в режиме Мапай и могут проголосовать за более периферийные партии, такие как правая Херут или жёсткая социалистическая Мапам. После нескольких месяцев активной предвыборной борьбы, кто выйдет победителем?"
 israelelection.1.a: "Мапай выходит победителем"
 israelelection.1.b: "Всеобщие сионисты одерживают победу"
 israelelection.1.c: "Мапам одерживает победу"
 israelelection.1.e: "Альянс Херут-УРФ побеждает Мапай"
 israelelection.1.f: "Херут побеждает вопреки всему"
 israelelection.2: "Выборы в Кнессет в 1955 году"
 israelelection.2_1: "Снова наступил сезон выборов, и Мапай находится в более опасном положении, чем когда-либо прежде, страдая от последствий суда над Кастнером и растущего недовольства правительством. Различные партии могут сыграть решающую роль в формировании правительства. После ожесточенной предвыборной кампании со всех сторон, избирательные участки закрылись, и победителем стал..."
 israelelection.2_2: "Снова наступил сезон выборов, и Всеобщие сионисты надеются обеспечить себе второй срок в руководстве с вновь активизировавшейся Мапай и другими партиями, ожидающими на крыльях, чтобы нанести удар. Выиграет ли Исраэль Рокач второй срок или победа достанется другой партии?"
 israelelection.2_3: "Снова наступил сезон выборов, и Херут проводит кампанию по продолжению своей политики и "победе над иорданской угрозой", в то время как другие партии выступают против развязывания войны и при правильной игре могут победить Херут и обеспечить себе победу. Достаточно ли общественность боится Иордании, чтобы поддержать Херут ещё раз, или же кампания Херут провалится, позволив победить другой партии? Опросы закрылись, и победителем стал..."
 israelelection.2_4: "Снова наступил сезон выборов, и альянс Херута-УРФ надеется получить второй срок, а обновленная Мапай и Всеобщие сионисты пользуются всплеском популярности. Победит ли "консервативная коалиция" снова? Или другая партия уступит им и займет лидирующие позиции? Избирательные участки закрылись, и победителем стал..."
 israelelection.2_5: "Снова наступил сезон выборов, и премьер-министр Яари ведет кампанию за второй срок, а обновленная Мапай и Всеобщие сионисты достигли новой беспрецедентной волны популярности, выиграют ли Яари и социалистическая Мапам ещё один срок? или их предполагаемый радикализм станет их гибелью? опросы закрыты, и победителем стал..."
 israelelection.2_6: "После отставки премьер-министра Яари были назначены досрочные выборы. Действующий блок Мапам-Маки стремится сохранить власть с новым лидером, в то время как многие другие партии ведут активную кампанию, чтобы не допустить такого случая. Смогут ли Мапам и Маки снова переизбраться, на этот раз под новым руководством, или же общественность наконец-то устанет от их предполагаемого радикализма и выберет более умеренную партию? избирательные участки закрылись, и победителем стал..."
 israelelection.2.a: "Мапай одерживает победу"
 israelelection.2.b: "Всеобщие сионисты побеждают"
 israelelection.2.c: "Мапам одерживает победу"
 israelelection.2.e: "Блок Херут-УРФ побеждает"
 israelelection.2.f: "Херут побеждает"
 israelelection.2.g: "Мапам-Маки одержали очередную победу"
 BEN_GURION_DESC: "Долгое время был фактическим лидером рабочего сионистского движения, а теперь стал первым премьер-министром Израиля. Бен-Гурион всегда с подозрением относился как к крайне левым, так и к крайне правым, отказавшись включить в свою коалицию социалистов из Мапам и совершенно не желая прислушиваться к требованиям националистов из Херут. Он также считает, что Израиль должен мстить за проникновения и нападения из арабских стран, и сделает все, чтобы Израиль стал силой, с которой нужно считаться. Пока он остается неоспоримым, но рано или поздно его могут сменить все более влиятельные молодые поколения, которые стремятся заменить старшее поколение Второй алии, занимавшее доминирующее положение в политике сионистского движения, а теперь и еврейского государства."
 Sharett_desc: "Моше Шаретт - совсем другая фигура, чем Давид Бен-Гурион, он - голубь в партии, полной ястребов, и предпочитает использовать дипломатию для достижения своих целей, а не браться за оружие. Когда Израиль был создан, его назначили министром иностранных дел, он усердно служил на этом посту, планируя встречи Давида Бен-Гуриона с арабскими лидерами. Шаретт выступает против агрессии или 'авантюризма' и считает, что Израиль должен быть удовлетворен границами 1949 года, чтобы в этом неспокойном регионе существовал мир. Даже будучи меньшинством в Мапай, он был выдвинут партией и сейчас занимает пост премьер-министра Израиля."
 Lavon_desc: "Бывший министр обороны и влиятельный член Мапай, Пинхас Лавон, наконец, достиг вершины после внутренней борьбы за власть в Мапай. Известный как хитрая, но коварная фигура, Левон дергает за ниточки сзади, чтобы достичь своих целей. Сейчас Левон занимает пост премьер-министра после того, как Мапай добилась успеха на выборах и вернулась на вершину власти"
 Eshkol_desc: "Бывший министр финансов и компромиссный человек в Мапай, Леви Эшколь поднялся на вершину после неудач Мапай на выборах. Благодаря своему компромиссному характеру и неудачам предыдущего правительства, Эшколь был избран премьер-министром и вернул Мапай к власти."
 Golda_desc: "Бывший министр труда, а ныне премьер-министр, жесткий характер Голды Меир вернул ее и Мапай к власти после ряда поражений. Более прямой подход Голды Меир к решению проблем напоминает многим Давида Бен-Гуриона, как 'железная леди' Израиля будет действовать на постоянно бурлящем Ближнем Востоке??"
 Begin_young_desc: "Бывший лидер 'Иргуна' и лидер националистической партии 'Херут', Менахем Бегин был приведен к власти популистской волной и теперь может воплотить в жизнь видение Израиля своего наставника Зеэва Жаботинского, а также свое собственное видение. Победа Бегина ознаменовала драматический переворот в израильской политике, поскольку впервые в истории было нарушено господство социалистической партии Мапай в израильской политической сфере."
 Yaari_desc: "Лидер Мапам и социалистический активист, Меир Яари поднялся к власти на популистской волне, которая вытеснила из власти его соперника, Мапай. Яари придерживается более 'чистого' видения социализма и рассматривает советский блок в более позитивном свете, хотя и воздерживается от союза с ним."
 Rokach_desc: "Бывший мэр Тель-Авива и лидер Всеобщих сионистов, Исраэль Рокач вышел победителем, поскольку общественность разочаровалась в политике жесткой экономии Мапай и, наконец, "завопила", избрав его и его капиталистических Всеобщих сионистов. Оказавшись у власти, он может проводить капиталистическую политику, которая изменит экономику Израиля, сделав ее более похожей на западную, и, возможно, откроет новую эру для сионистского движения с доминированием либерализма вместо социализма."
 israel.9.d: "В ходе замечательного открытия последних лет в Кумранских пещерах были найдены свитки с древними еврейскими рукописями. Эти пещеры находятся недалеко от Мертвого моря, соленого озера, расположенного в районе Западного берега реки Иордан, где ведутся горячие споры. Хотя сами свитки были обнаружены в 1947 году, только в последние годы группы специалистов предприняли усилия по их раскопкам. По мере того как их историческое значение становилось все более очевидным, их ценность возрастала, и впоследствии ход поисков стремительно ускорялся. После пяти лет раскопок из пещеры наконец-то были извлечены последние свитки. Всего насчитывается 972 манускрипта с 7 свитками, найденными в общей сложности в 11 пещерах. Извлечение этих древних свитков представляет собой значительный шаг вперед для изучения как еврейской веры, так и еврейского языка, поскольку началась спешная попытка понять содержание свитков."
 israel.10.d: "После снятия британских ограничений на еврейскую иммиграцию и обеспечения нашей независимости число евреев, переезжающих в Израиль со всего мира, резко возросло, причем иракских, иранских, марокканских и йеменских евреев становится все больше. Хотя государству придется приспосабливаться к заботе о столь быстро растущем населении, иммигранты полны радости и надежды, когда они достигают своего нового дома, где они наконец-то будут жить свободно."
 israel.11.d: "С момента образования страны шли большие дебаты о том, какой должна быть школьная программа. Мапай и другие светские партии хотят, чтобы дети получали общее образование, подобное западному, в то время как ХаПоэль ха-Мизрачи, Мизрачи и другие ультраортодоксальные партии хотят ввести религиозное образование, чтобы 'возродить еврейский дух нации'. Эти дебаты, похоже, не близки к завершению, поскольку премьер-министр Бен-Гурион вынужден умиротворять обе стороны, чтобы сохранить свою все более нестабильную коалицию."
 israel.12.d: "Пальмах, который доблестно сражался вместе с ЦАХАЛом в войне за независимость, был распущен и интегрирован в основной состав ЦАХАЛа. Бен-Гурион заявил, что хочет 'деполитизировать' Пальмах, так как считает его слишком тесно связанным с Мапам, к которой он относится с враждебностью и подозрением."
 israel.13.d: "Иммиграционные лагеря, многие из которых были недавно превращены в переходные лагеря или маабарот в связи с растущим притоком еврейских иммигрантов, постоянно появляются по всему Израилю, хотя правительство зарезервировало столько квартир и домов, сколько могло, даже их оказалось недостаточно, чтобы вместить десятки тысяч евреев, прибывающих каждый месяц. Многие новые иммигранты сейчас живут в маабарот, где условия жизни очень тяжелые, по словам журналиста, посетившего маабарот, 'там было два крана на всех, около тысячи человек".. The toilets had no roof and were infested with flies.'"
 israel.14.d: "Моше Даян выступил с инициативой переселить бедуинов из Северного Негева и изгнать их на Хевронские холмы. Этот шаг вскоре вызвал споры после того, как привлек внимание Моше Шарета и Министерства иностранных дел, которые назвали инициативу 'глупой'."
 israel.15.d: "Столкнувшись с сокращением бюджета из-за продолжающегося экономического кризиса, начальник штаба ЦАХАЛа Игаль Ядин сегодня предложил свою отставку, премьер-министр быстро назначил Мордехая Маклефа в качестве его замены."
 israel.16.d: "Давид Бен-Гурион назначил Пинхаса Лавона, высокопоставленного члена Мапай, на пост министра обороны после того, как тот проработал на этом посту с 1948 года, многие предполагают, что премьер-министр Бен-Гурион планирует уйти из политики."
 israel.17.d: "Мордехай Маклеф, который был назначен вместо Игаля Ядина после отставки последнего, сам предложил свою отставку, после того как не смог сотрудничать с министром обороны. премьер-министр быстро назначил относительно молодого Моше Даяна новым начальником штаба."
 israel.18.d: "Столкнувшись с поражением на выборах, Мапай была приведена в ярость, поскольку лидерские позиции Бен-Гуриона казались как никогда уязвимыми. К Леви Эшколю, 'центристу' в своей партии и фигуре компромисса, обратились антибен-гурионистские деятели с просьбой высказать свое мнение по поводу отстранения Бен-Гуриона. Судьба Мапай зависит от решения Эшколя, Эшколь решает..."
 israel.19.d: "С помощью Эшколя Давид Бен-Гурион укрепил свое положение и предотвратил захват партии, теперь он отдает руководящие посты в партии таким лоялистам, как молодые Моше Даян и Шимон Перес."
 israel.20.d: "Используя уязвимость Бен-Гуриона в своих интересах, антибен-гурионисты захватили руководство Мапай и де-факто вытеснили Бен-Гуриона из партии, теперь им нужно выбрать нового лидера партии, который будет представлять их на предстоящих выборах. После непродолжительного обсуждения кандидатура будет..."
 israel.21.d: "С помощью Леви Эшколя, который увидел возможность укрепить свои позиции в партии, антибен-гурионисты захватили руководство Мапай и де-факто вытеснили Бен-Гуриона из партии, они предложили руководство Леви Эшколю, который, как они надеялись, сможет преодолеть разрыв между старшими и младшими мапайцами. Леви Эшколь пока не горит желанием стать лидером партии и предложил новому руководству назвать Голду Меир своей кандидатурой на случай, если он откажется от выдвижения. После недолгих раздумий Эшколь решает..."
 israel.22.d: "Федаины, палестинское националистическое ополчение, начали волну террористических атак на израильские цели и гражданское население, ЦАХАЛу и правительству теперь придется справляться с этой реальностью."
 israel.23.d: "Федаины сегодня напали на военный конвой, несколько человек ранены, это соответствует текущей волне нападений, совершаемых ополчением федаинов, некоторые советники призывают к 'карательным операциям' на территории федаинов, чтобы разоружить или хотя бы ослабить их на некоторое время, другие командиры советуют 'подождать и посмотреть', что произойдет."
 israel.24.d: "Силы ЦАХАЛа вошли в Газу пару дней назад и сейчас сообщают, что они нашли и уничтожили базы Федаинов, эта операция сильно ослабляет Федаинов, так как одна из их главных баз теперь уничтожена."
 israel.25.d: "ЦАХАЛ сообщает, что нашел и уничтожил последние базы Федаинов на Западном берегу, фактически выведя боевиков из строя, эксперты говорят, что после этой операции Федаины больше не будут представлять угрозу безопасности Израиля."
 israel.26.d: "Сегодня закончился суд над Кастнером. Когда суд начался, казалось, что дело будет касаться обвинения подсудимого Малхиэля Груенвальда в адрес члена Мапай Рудольфа Кастнера в сотрудничестве с нацистами во время Холокоста, но адвокат Груенвальда, Шмуэль Тамир, сумел перевернуть дело и сделать его посвященным роли Мапай в Холокосте и тому, как сильно она пыталась помочь евреям спастись от нацистов. После долгих раздумий судья вынес решение в пользу Грюнвальда, обвинив Кастнера в том, что он 'продал душу дьяволу'. Членство Кастнера в Мапай в сочетании с выводами суда заставило Херут внести предложение о вотуме недоверия в Кнессет, это предложение не прошло, но ущерб Мапай был нанесен."
 israel.27.d: "Готовясь к выборам в июле, лидеры ХаПоэль ха-Мизрачи, Мизрачи, Агудат Йисраэль и Поалей Агудат Йисраэль встретились, чтобы обсудить будущее своего союза, большинство говорит, что союз в лучшем случае шаткий и должен быть распущен, но некоторые голоса говорят, что единый фронт помогает продвигать их общие интересы наиболее эффективно, после нескольких часов обсуждения руководство объявляет, что..."
 israel.28.d: "Херут и Объединенный религиозный фронт всегда относились с презрением к Мапай, хотя последний демонстрировал это более открыто. Сегодня лидер Херут, Менахем Бегин, направил письмо Хаиму-Моше Шапире, в котором предложил избирательный альянс между Херут и ОРФ, ссылаясь на то, что если он согласится, то Херут будет продвигать 'еврейские ценности' и 'религиозную чистоту', он также сказал, что любой альянс против Мапай - это хороший шаг к прекращению 'социалистического режима'. Хотя некоторые могут не согласиться, это действительно хорошее предложение со стороны Бегина, после недолгого обдумывания предложения Шапира направил Бегину ответ, в котором подтвердил свою поддержку альянса."
 israel.30.d: "Наше недавнее решение начать закупку оружия в США возмутило Мапам, которая решительно выступает за СССР. Это возмутило их настолько, что они внесли вотум недоверия, к счастью, он не прошел, и это лишь показывает, что Мапам в одиночку противостоит нашим планам."
 israel.49.d: "Неделю назад Кнессет принял решение о запрете общественного транспорта в Шаббат, после чего несколько радиоведущих говорили об этом плохо, и как это создало им проблемы при поездке на работу. Но в прошлое воскресенье, во время интервью с Бен Гурионом на радиостанции 'Коль Йисраэль', он публично заявил\ 'Запрет на транспорт в шаббат был ошибкой, которая зависела от руки и разума избирателей, их сочувствие к ЕРФ зашкалило, и выборы это доказали.\" Правительство пока не ответило, но, похоже, не проигнорировало его. В Бейт ха-Кнессете, в Иерусалиме, в среду утром собралась небольшая демонстрация, Бен Гуриона не было на месте, но депутат от Хейрута Ури Цви Гринберг был замечен входящим в Кнессет и подвергся крикам демонстрантов."
 israel.50.d: "После победы альянса Херут-УРФ премьер-министр Бегин объявил свой план развития экономики: 'смешанная' экономика, смешивающая социализм и капитализм, следуя '5 мемам' Жаботинского"
 israel.51.d: "Сегодняшняя правительственная декларация объявила Иудею и Самарию, или Западный берег, неотъемлемой частью Израиля. Это решение вызвало напряженность в отношениях с Иорданией, которая рассматривает это заявление как джингоистическое и империалистическое. Премьер-министр Бегин провозгласил, что 'Иудея и Самария являются основной и неделимой частью земли Израиля и, следовательно, государства Израиль."
 israel.52.d: "Ревизионистское молодежное движение Бейтар одобрило политику правительства как следующую 'духу Жаботинского' и что она приведет к 'лучшему Израилю'."
 israel.53.d: "Объединенный религиозный фронт переживает все более разрушительные расколы и внутренние конфликты между двумя фракциями. Старая гвардия, объединившаяся под руководством лидера ОРФ Хаима Моше-Шапира, и более национально настроенная 'молодая гвардия' во главе с Йосефом Бургом. Старая гвардия считает, что альянс с 'Херут' не приносит им достаточной пользы, и хочет выйти из альянса, но остаться в правительстве, в то время как молодая гвардия хочет продолжить или даже укрепить альянс с 'Херут', чтобы создать большой правый фронт в израильской политике"
 israel.54.d: "Лидер СПС Хаим Моше-Шапира объявил сегодня, что альянс Херута и СПС будет распущен с сегодняшнего вечера. Премьер-министр Бегин в ответ заявил, что роспуск является 'неудачей', но призывает к дальнейшему сотрудничеству между Херутом и СПС как независимых партий."
 israel.55.d: "Социалистическая молодежь отправилась в Иерусалим, чтобы выразить протест против спорных законов, введенных правительством, таких как запрет на работу общественного транспорта в Шаббат. Они призвали правительство уйти в отставку, но были встречены глухими ушами. Израильские арабы присоединились к ним, чтобы выразить протест против того, что правительство ставит в привилегированное положение своих еврейских граждан по сравнению с нееврейскими. Хотя протест был масштабным, Херут по-прежнему остается довольно популярной партией, в то время как Мапай и другие социалистические партии пытаются вернуть себе былую силу."
 israel.56.d: "Премьер-министр Бегин решил назначить выборы в 1955 году, при этом Херут по-прежнему остается самой популярной партией. Мапай планирует возрождение и называет себя партией светских людей, противостоящей 'религиозным фундаменталистам' из альянса Херута и НРП, в то время как Общесионисты решили занять более спокойную и умеренную позицию."
 israelOlim.1.d: "Многие олим возражают против того, чтобы терпеть условия в Аярот Питуах, которые мы для них построили, после проверки эти условия оказались довольно плохими. Хотя помощь новым олим в улучшении их условий должна быть очевидной вещью, нам также очень не хватает ресурсов, и нам понадобится все до последнего ресурса, который у нас есть под рукой."
 israelOlim.2.d: "Несколько марокканских евреев подали жалобу в правительство, ссылаясь на то, как их облили газами и унизили по прибытии в Израиль, это соответствует шаблону пренебрежения нашими методами 'интеграции' новых олимов с Ближнего Востока и Северной Африки, должны ли мы начать расследование и удовлетворить их или отклонить жалобу и использовать наши ресурсы на что-то другое?"
 israelOlim.3.d: "Некоторые олимы сталкиваются с проблемами, пытаясь интегрироваться в израильское общество, многие олимы, особенно с Ближнего Востока, традиционны по своей природе, в то время как большая часть израильского общества светская и 'атеистическая' по своей природе, поэтому проблемы неизбежны, что мы можем сделать, так это начать государственную программу помощи олимам за счет ресурсов."
 israelOlim.4.d: "Из-за растущего недовольства политикой правительства, новые олимы ищут альтернативу Мапай, в настоящее время есть две партии, которые представляют эту альтернативу, правая партия Херут, которая критикует Мапай день и ночь, и жёсткая социалистическая партия Мапам, которая работает над прекращением расовой дискриминации в стране."
 israelOlim.5.d: "Многие олимы, прибывшие в Израиль, выразили свою озабоченность правительству, они обеспокоены тем, что им негде недорого жить. Многие призвали правительство построить 'города развития' или 'Аярот Питуах' для размещения олимов, пока ситуация не нормализуется."
 israelpresidents.1.d: "Несмотря на плохое состояние здоровья, Хаим Вейцман решил выставить свою кандидатуру на переизбрание на пост президента Израиля, хотя против него не было других кандидатов, все равно было проведено голосование, и Вейцман был избран абсолютным большинством голосов в Кнессете и продолжит исполнять обязанности президента."
 israelpresidents.2.d: "Хаим Вейцман, первый президент Израиля, скончался в возрасте 77 лет в Реховоте, он был похоронен вместе со своей женой в поместье Вейцмана. академический вердикт на его могиле гласит, что он был 'патриотом задолго до того, как Израиль вообще существовал'."
 israelpresidents.3.d_1: "Поскольку президент Вейцман умер на посту, были проведены досрочные президентские выборы, чтобы избрать его преемника, кандидатами стали Ицхак Бен-Цви, друг Бен-Гуриона и кандидат на пост президента от партии Мапай, и Мордехай Нурок, латышский еврей, изгнанный СССР после работы в латвийском парламенте, и кандидат от партии Мизрачи."
 israelpresidents.3.d_2: "С тех пор как президент Вейцман умер на своем посту, были проведены досрочные президентские выборы, чтобы избрать его преемника, Поскольку Альберт Эйнштейн принял предложение правительства стать президентом, ни одна партия не послала кандидата, чтобы бросить ему вызов, обеспечив его избрание без оппозиции."
 israelpresidents.4.d: "Прославленный ученый Альберт Эйнштейн считается величайшим из ныне живущих евреев, и после смерти президента Хаима Вейцмана Бен-Гурион предложил идею пригласить Эйнштейна на пост нового президента. Посол в США Абба Эббан представил это предложение Альберту Эйнштейну, сказав, что этот пост не помешает его научным занятиям, и он сможет свободно заниматься своими увлечениями. Подумав некоторое время, Эйнштейн представил свой ответ"
 lavonmania.1.d: "Давид Бен-Гурион, лидер Мапай и премьер-министр Израиля, решил уйти в отставку сегодня, он говорит, что отставка произошла по личным неполитическим причинам. Его внезапное решение уйти на пенсию и жить в небольшом кибуце в Негеве Сде Бокер привело к тому, что Мапай начала искать ему замену. В конце концов, Моше Шаретт, министр иностранных дел, был выбран партией в качестве замены Бен-Гуриона и теперь займет его место на посту премьер-министра."
 lavonmania.2.d: "После заключения соглашения между нашим союзником Великобританией и враждебным нам Египтом о выводе британских войск из Суэцкого канала к 1956 году, Верховное командование ЦАХАЛа осталось нервно наблюдать за происходящим. Суэцкий канал является важным торговым пунктом для израильских судов, и если Великобритания выведет свои войска из канала, Египет может заблокировать вход израильских судов в канал. Исходя из этой оценки, некоторые люди в Верховном командовании ЦАХАЛа предложили идею начать операцию под ложным флагом, чтобы взорвать британские предприятия вблизи канала, чтобы создать атмосферу нестабильности и убедить британцев выйти из договора и остаться в канале. Эта идея была отвергнута большинством членов Верховного командования ЦАХАЛа, которые предложили Израилю попытаться сохранить дипломатию, не предпринимая никаких безрассудных мер."
 lavonmania.3.d: "В ходе операции, которая была проведена без согласия премьер-министра, спящая ячейка израильских агентов попыталась атаковать несколько объектов в Суэцком канале в качестве операции под ложным флагом в надежде помешать британцам покинуть канал. Все агенты были пойманы, допрошены и заключены в тюрьму Египтом, который обнаружил их преданность Израилю. Это крупный дипломатический инцидент, поскольку правительство было ввергнуто в замешательство относительно того, кто несет ответственность за операцию. Премьер-министр Шаретт не знал об операции, когда она проводилась, а министр обороны Лавон заявляет о своей невиновности, хотя возникло много подозрений относительно его участия в операции."
 lavonmania.4.d: "После операции 'Шошанна' произошел беспрецедентный правительственный кризис: Лавон шантажировал Шарета, чтобы сохранить свой пост министра обороны. Шаретт не мог заменить Лавона кем-либо на посту министра обороны, так как ни один кандидат не принял предложение. В качестве последней попытки Шаретт и Голда Меир отправились в Сде Бокер, чтобы встретиться с Давидом Бен-Гурионом и предложить ему пост министра обороны. Бен-Гурион принял предложение и вернулся в правительство, сразу после того, как Лавон ушел в отставку с поста министра обороны."
 lavonmania.5.d: "В связи с подозрениями, что Лавон мог отдать приказ о начале операции 'Шошанна', и ростом напряженности, Пинхас Лавон решил уйти в отставку с поста министра обороны. Многие предвещают, что это конец некогда многообещающей политической карьеры Лавона."
 lavonmania.6.d: "Когда Бен-Гурион вернулся в правительство, Шаретт понял, что его дни сочтены, и решил уйти с поста премьер-министра, вернув его Бен-Гуриону. Шаретт согласился остаться на посту министра иностранных дел, но решил уйти в отставку, чтобы передать премьер-министрское министерство более 'решительному' Бен-Гуриону."
 lavonmania.7.d: "После операции 'Шошанна' Моше Шаретт пытался расследовать причины операции и кто отдал приказ, поэтому он создал Комитет двух. Комитет двух, или Комитет Ольшан-Дори, проводил расследование в правительстве на предмет того, кто отдал приказ провести операцию 'Шошанна'. Через некоторое время комитет представил отчет, в котором говорилось, что они не могут найти достаточно доказательств, чтобы связать кого-либо с операцией."
 Ben_Zion_Dinur: "Бен Цион Динур"
 Yigal_Allon: " Игаль Аллон"
 Zalman_Shazar: " Залман Шазар"
 Golda_Meir1: "Голда Меир"
 Zalman_Aran: "Залман Аран"
 Aryeh_Altman: "Арье Альтман"
 Hanan_Rubin: "Ханан Рубин"
 Ezra_Ichilov: "Эзра Ихилов"
 Yosef_Burg: " Иосиф Бург"
 ISR_Fight_Monopolies: "Борьба с монополиями"
 ISR_Fight_Monopolies_desc: "Хотя мы не коммунисты и хотим более капиталистической экономики, в то же время мы хотим, чтобы у каждого был шанс преуспеть в бизнесе. Это означает ликвидацию монополий и трестов"
 ISR_Sideline_Mapai: "Боковой мапай"
 ISR_Sideline_Mapai_desc: "Бен Гурион и Мапай имели свой шанс возглавить Израиль, и мы видели, к чему это привело - разрушенная экономика, низкий моральный дух и почти полное отсутствие чувства национального долга. Их время прошло. Мы должны вытолкнуть их в объятия истории, прежде чем они смогут нанести ещё больший ущерб"
 ISR_Fight_Communism: "Борьба с коммунизмом"
 ISR_Fight_Communism_desc: "После наших милых арабских соседей следующим врагом, с которым нам придется столкнуться, будет коммунизм, этот безбожный и беззаконный фарс экономической системы. Мы можем начать с его искоренения у себя дома и объявить коммунистические партии вне закона"
 ISR_Peoples_Capitalism: "Внедрить 5 мемов"
 ISR_Peoples_Capitalism_desc: "5 мем (мем - буква иврита) - это набор экономических и социальных мер, которым Бегин научился у своего наставника, раннего влиятельного сиониста Зеэва Жаботинского. Они состоят из более либерального экономического подхода, сохраняя при этом националистический и сионистский взгляд на роль Израиля в мире."
 ISR_Operations_In_Gaza_Herut: "Операции в Газе"
 ISR_Operations_In_Gaza_Herut_desc: "Слишком долго Египет спонсировал террористические рейды на наш народ и родину из сектора Газа. Мы должны послать наши элитные силы для проведения ответного рейда, чтобы преподать им урок"
 ISR_Destroy_fedayeen_in_west_Bank: "Уничтожить федаинов на Западном берегу"
 ISR_Destroy_fedayeen_in_west_Bank_desc: "С момента окончания Войны за независимость недовольные палестинцы, разочарованные тем, что мы не только выжили, но и полностью уничтожили их арабских соседей в 1948 году, организовали федаины для совершения террористических актов на нашей земле. Мы должны разгромить их как можно скорее"
 ISR_Capitalize_The_Economy_Herut: "Капитализировать экономику"
 ISR_Capitalize_The_Economy_Herut_desc: "Мапай заставляла наших граждан принимать полуразвалившуюся версию коммунизма, что неприемлемо. Мы должны полностью перевести нашу экономику на капитализм, истинную и единственную экономическую систему"
 ISR_Jewish_Heritage_in_the_West_Bank: "Еврейское наследие в Иудее и Самарии"
 ISR_Jewish_Heritage_in_the_West_Bank_desc: "Земли Иудеи и Самарии, отторгнутые от нас планом раздела ООН, на данный момент всегда будут действительно принадлежать еврейскому народу, и однажды, пусть и в далеком будущем, снова окажутся в наших руках!"
 ISR_Reject_West_German_Reperations2: "Отклонить репарации Западной Германии"
 ISR_Reject_West_German_Reperations2_desc: "Немцы пытаются отплатить за кровь и зверства Холокоста финансовым пакетом? Это жестокая шутка или они просто настолько наивны? В любом случае, мы отказываемся хоронить память о наших погибших родственниках за деньги"
 ISR_Sharret_Administration: "Администрация Шарета"
 ISR_Sharret_Administration_desc: "Премьер-министр Бен Гурион подал в отставку и назначил вместо себя лидера Мапай Моше Шарета, и Шарет, вероятно, просто продолжит левоцентристскую политику Бен Гуриона."
 ISR_Befriend_the_Progressives: "Дружить с прогрессистами"
 ISR_Befriend_the_Progressives_desc: "Хотя мы, возможно, и победили на выборах, мы все ещё не являемся одной из сильнейших партий в Кнессете. Объединение сил с прогрессистами улучшит наше положение"
 ISR_Reject_West_German_Reperations: "Отклонить репарации Западной Германии"
 ISR_Reject_West_German_Reperations_desc: "Немцы пытаются расплатиться за кровь и зверства Холокоста финансовым пакетом? Это жестокая шутка или они просто настолько наивны? В любом случае, мы отказываемся хоронить память о наших погибших родственниках за деньги"
 israel.35.d: "После победы над Мапай, премьер-министр Рокач назначил Переца Бернштейна министром финансов с целью сделать экономику более капиталистической, Перец Бернштейн объявил о своем плане либерализации экономики путем нейтрализации контроля Гистадрута над экономикой и плане подписания нескольких торговых сделок с западными странами."
 idea_ISR_Bernstein_Plan_Startup: "План Бернштейна"
 idea_ISR_Bernstein_Plan_Startup_desc: "План Бернстайна дает результаты, поскольку экономика заметно улучшается, мы определенно находимся на правильном пути к восстановлению"
 IDF_day: "День ИДФ"
 Expanded_5_Mems: "Расширенные программы 5 мемов"
 idea_ISR_Monetary_Management_Herut: "Планы управления экономикой"
 idea_ISR_Encourage_Higher_Birthrates: "Повышение рождаемости поощряется"
 idea_ISR_Encourage_Higher_Birthrates_desc: "Одна из самых больших проблем, с которой сталкивается наша страна, - это малочисленность населения, особенно по сравнению с нашими соседями. Поэтому с благословения правительства началась кампания по стимулированию повышения рождаемости, чтобы, как мы надеемся, смягчить эту проблему для будущих поколений."
 United_and_Ready_ISR: "Объединенные и готовые"
 ISR_Ready_for_Anything: "Готов ко всему"
 Herut_Monopolies: "Борьба с монополиями"
 israel.9999.d: "Вопреки всему, арабская коалиция, направленная на подавление восходящего еврейского государства, была оттеснена назад, и по мере объявления перемирий новое государство Израиль утверждается в качестве суверенного государства на мировой арене. Однако не все благополучно, поскольку новому государству теперь приходится бороться с идеологическими приливами и усиливающимся исходом евреев из диаспоры. Сможет ли Израиль пережить это время потрясений и процветать?"
 israelOlim.99.d_1: "Благодаря государственным программам, быстро помогающим олимам интегрироваться в общество, многие олимы выражают свою благодарность правительству, которое дало им возможность начать новую жизнь. Они говорят, что Израиль действительно является надежным убежищем для евреев всего мира."
 israelOlim.99.d_2: "В условиях ограниченной государственной помощи многие олимы выражают свое разочарование политикой правительства. Хотя со временем ситуация может исправиться, олимы по-прежнему сталкиваются с трудностями при интеграции в общество."
 israelOlim.99.d_3: "Практически не получая никакой государственной помощи, многие олим выразили свой гнев в адрес правительства, в городах со значительным населением олим растет напряженность, и недовольство правительством закрепилось. Хотя раны могут затянуться, общее мнение таково, что большинство олим возмущены режимом Мапай и, вероятно, будут продолжать возмущаться в ближайшие годы."
 israel.9998.d: "ещё до провозглашения независимости одна партия стала центром притяжения израильской политики - Рабочая партия Земли Израиля или сокращенно 'Мапай'. Под руководством харизматичного и умного Давида Бен-Гуриона, Мапай позиционировала себя между либеральными капиталистическими Генеральными сионистами и революционными социалистами Мапам. Несмотря на то, что Мапай не боится сотрудничать с несоциалистами, Давид Бен-Гурион поклялся никогда не входить в коалицию ни с националистическим правым крылом Херут, ни с вышеупомянутой Мапам. После победы на первых выборах в Израиле 4 месяца назад Давид Бен-Гурион создал коалицию 'Строительство нации' при поддержке левоцентристской Прогрессивной партии, религиозно-консервативного Объединенного религиозного фронта и нескольких других мелких партий. Правительство приняло философию под названием 'Мамлахтиут', которая продвигает официальные государственные органы в надежде деполитизировать state institutions, time will tell if this policy will survive."
 maki.1.d: "Не так давно член Mapam Майкл Орен был арестован, судим и заключен в тюрьму чехословацким правительством в ходе откровенно показательного процесса. Естественно, это вызвало бурную реакцию, поскольку Орен стал 'узником Праги', но настоящие проблемы происходят внутри Мапам и правительства. Премьер-министр Яари, министр труда Шмуэль Микунис и другие социалисты, расстроенные судебными процессами, рассматривают возможность осуждения Советского Союза и дистанцирования от коммунизма, в то время как министр транспорта Моше Снех и небольшой отряд 'лоялистов' защищают действия СССР и призывают партию продолжать про-СССР политику. После нескольких часов дебатов и препирательств...."
 maki.2.d: "Сегодня премьер-министр Яари объявил о слиянии с коммунистической партией Маки, хотя этого следовало ожидать, некоторые перья были взъерошены, особенно перья Мапай, которые быстро объявили, что это 'советский захват'."
 maki.3.d: "Председатель Снех объявил сегодня, что 'сионистское движение закончилось' и что начнется новая эра, 'социалистическая эра', он провозгласил образование 'Социалистического содружества Израиля' или 'Социалистического содружества Палестины' для ее арабских граждан. Содружество будет двунациональным, социалистическим и атеистическим государством, управляемым Маки и председателем Снехом"
 maki.4.d: "Хотя мы одержали победу на последних выборах, один вопрос так и не был решен - кто будет новым лидером партии и, следовательно, премьер-министром? Умеренный Шмуэль Микунис настаивает на нейтральном коммунистическом режиме, не связанном с СССР, в то время как Моше Снэх настаивает на том, чтобы Израиль был союзником СССР. Поскольку переговоры ни к чему не привели, многие выдвигают Меира Вильнера в качестве компромиссного кандидата, который удовлетворит всех. После дней и ночей препирательств и грязи, кто же станет новым лидером альянса Маки-Мапам?"
 maki.5.d: "Поскольку Маки видят, что Мапам все больше и больше идет на компромисс с их точкой зрения, Макисты видят отверстие, которое они могут использовать, чтобы получить больше рычагов влияния и, возможно, даже доминирование в альянсе Мапам-Маки, они планируют использовать это отверстие, призывая СССР оказать давление на Мапам, чтобы заставить их пойти на компромисс с их позицией."
 maki.6.d: "СССР ответил сегодня, заявив, что они готовы оказать давление на Мапам, теперь нам нужно подождать и посмотреть, что произойдет."
 maki.7.d: "СССР отклонил нашу просьбу и заявил, что мы не в состоянии 'начать революцию', мы должны продолжать ее под руководством Мапама."
 maki.8.d: "Премьер-министр Яари объявил о своей отставке, поскольку его положение в правительстве с каждым мгновением становится все менее надежным. Хотя он воздержался от объяснения причин своей отставки, многие предполагают, что за его отставкой стоят внешние или, скорее, внутренние силы. Его отставка инициирует проведение досрочных выборов в этом году, где он возглавит временное правительство до дня выборов."
 israelwar.1.d: "И снова мы оказались в состоянии войны. Премьер-министр работает над созданием временного правительства национального единства военного времени для координации действий страны на время войны."
 israelwar.2.d: "Похоже, что война закончилась, и поэтому наше военное правительство было распущено. Мы снова вернемся к нормальной политической жизни."
 german_reparations.1.d: "Федеративная Республика Германия, более известная как Западная Германия, обратилась к нам с предложением. Выплатить репарации за потери от Холокоста. Хотя некоторые в кругах Мапай поддерживают эту идею, большинство выступает против нее. Хотя это экономически выгодно, многие видят в этом отказ от потерь Холокоста и приравнивают их к бумажкам"
 german_reparations.2.d: "Герут Менахема Бегина выразил возмущение принятием немецкого соглашения о репарациях. Он сказал, что мы продаем кровь жертв Холокоста. Его слова звучат эхом по мере того, как все больше и больше людей высказываются против соглашения."
 german_reparations.3.d: "Хотя правительство надеялось, что споры вокруг соглашения о репарациях Германии утихнут и в конце концов сойдут на нет, это оказалось не так. Сегодня тысячи протестующих собрались возле Кнессета на митинге, невиданном в нашей истории. Протестующие требуют, чтобы мы отвергли план репараций Западной Германии и что мы не можем так легко простить немцам Холокост."
 german_reparations.4.d: "Дов Шиланский был арестован сегодня при попытке пронести бомбу в чемодане в Министерство иностранных дел. Он был обвинен в принадлежности к подпольной организации, выступающей против соглашения о репарациях с Германией, и приговорен к 2 годам тюрьмы."
 german_reparations.5.d: "Несмотря на то, что мы отвергли репарации из Германии, многие в клике Давида Бен-Гуриона высказываются в поддержку репараций, ссылаясь на то, что Израилю нужно как-то поднять экономику и что репарации - прекрасный способ сделать это."
 german_reparations.6.d: "Бен-Гурион выступил сегодня перед группой сторонников, заявив, что Израиль должен действовать как \'независимый народ\', а не быть 'рабом прошлого', и что Израилю нужны немецкие репарации, чтобы положить конец его экономическим страданиям. В то время как большая часть общественности по-прежнему выступает против соглашения, Бен-Гурион поддерживает его непоколебимо."
 german_reparations.7.d: "Сегодня министр иностранных дел Моше Шаретт подписал репарационные соглашения с Германией. Несмотря на огромную оппозицию со стороны общественности, соглашение выстояло, и теперь немецкие репарационные деньги могут помочь экономике Израиля."
 german_reparations.8.d: "Дебаты по поводу репараций Германии завершились, и сторона 'Нет', похоже, победила. Правительство объявило, что никаких репараций не будет. Хотя правительство пытается поддерживать хорошие отношения с Западной Германией, оно признало общественный резонанс и отклонило предложение Германии."
 israelelectionnews.1.d: "На своих вторых выборах с момента основания Израильская рабочая партия Земли Израиля, Мапай, отпраздновала переизбрание Давида Бен-Гуриона в парламент. После 37% по результатам опросов новое правительство под руководством второго кабинета Бен-Гуриона было сформировано при поддержке Мизрачи, Хапоэль ха-Мизрачи, Агудат Йисраэль и Поалей Агудат Йисраэль, а также Демократического списка для израильских арабов, Прогресса и работы и Сельского хозяйства и развития. Известный всему миру как отец-основатель Израиля, Бен-Гурион, вместе с Мапай, прославился проведением общенациональных реформ жилищного строительства и образования в попытке дать еврейскому народу дом после Холокоста. Теперь, когда власть Мапай, похоже, снова укрепилась, планы Бен-Гуриона по дальнейшему развитию Израиля, включая строительство национального водовода, а также дальнейшее расселение евреев в Негеве, практически гарантированы."
 israelelectionnews.2.d: "Израильская центристская партия, известная как Всеобщая партия сионистов, одержала победу на всеобщих выборах в этом году, а новый премьер-министр Исраэль Рокач обещал масштабную модернизацию и реформы. Мэр Тель-Авива с 1936 года, его пребывание у власти было отмечено в прошлом не очень теплыми отношениями его партии с британцами. Тем не менее, на протяжении десятилетий Рокач показал себя способным государственным деятелем, расширив и почти утроив население Тель-Авива за время своего правления, в конечном итоге объединив его с портовым городом Яффо, несмотря на первоначальные возражения Рокача против этого предложения. Партия общих сионистов, которую некоторые считают сектой 'западников\' в израильском политическом ландшафте, в значительной степени определяется европейским либерализмом, с акцентом на средний класс и капитализм в качестве своей основы, и хотя многие в израильском обществе находят их политику неудобно напоминающей британскую политику, непопулярная реакция на жесткие меры экономии Бен-Гуриона сделала победу общих сионистов практически несомненной, с основным фокусом кампании на выкорчевывание Мапай в пользу широкомасштабной экономической реформы."
 israelelectionnews.3.d: "Про-СССР социалистическая партия Мапам победила правящую умеренную социалистическую партию Мапай на выборах в Израиле в этом году. Их лидер Меир Яари стал премьер-министром. Многие прибывающие иммигранты решили проголосовать за Мапам из-за растущего разочарования интеграционной политикой Мапай, но не хотели голосовать за несоциалистические партии, отдавая предпочтение Мапам, которая получила подавляющее большинство их голосов."
 israelelectionnews.4.d: "Бывший лидер военизированной организации Иргун, Менахем Бегин привел свою правую националистическую партию Херут к победе на выборах в Израиле в этом году. Многие эксперты считают, что ему помогли голоса новых иммигрантов, которые были разочарованы политикой правящей партии Мапай, благодаря чему Бегин и Херут получили огромное количество голосов и победили на выборах."
 israel.9997.d: "Изменить заголовок новости"
 Yigael_Yadin_desc: "Игаэль Ядин записался в Хагану в 1933 году в возрасте 15 лет и с тех пор быстро продвигался по служебной лестнице, но после размолвки с тогдашним командиром Хаганы Ицхаком Саде покинул Хагану, чтобы учиться в университете. Ядин был отозван Бен-Гурионом для службы в Хагане, а затем в ЦАХАЛе во время Войны за независимость. В возрасте всего 32 лет Ядин полностью взял на себя роль начальника штаба ЦАХАЛа после того, как бывший начальник штаба Яаков Дори из-за болезни не смог исполнять свои обязанности. Ядин принял большинство важных решений для ЦАХАЛа во время Войны за независимость, включая соглашение о прекращении огня с Египтом, которое положило конец войне."
 Moshe_Dayan_1_desc: "Родился в 1915 году в Дегании, Даян записался в Хагану в 1936 году и стал учеником командира Хаганы Ицхака Саде, который научил его наступательным доктринам, которых он придерживается и по сей день. Даян потерял левый глаз во время Второй мировой войны, сражаясь на стороне англичан, и с тех пор носит защитную повязку. Даян является членом Мапай и близким другом Давида Бен-Гуриона и имеет большие политические амбиции помимо военной службы."
 Yitzhak_Rabin_1_desc: "Рабин родился в 1922 году и вырос в Тель-Авиве, поступил в сельскохозяйственную среднюю школу Кадори, Рабин преуспевал в предметах, связанных с сельским хозяйством, но ему не нравилось изучать английский язык или язык 'врага', как он его называл. Рабин вступил в 'Хагану' и прошел там базовую военную подготовку. Позже он вступил в секцию 'Пальмах' Хаганы и позже стал командиром. Во время Войны за независимость Рабин воевал в ЦАХАЛе в качестве командира бригады 'Харель', а позже был одним из израильских делегатов на мирных переговорах с Египтом на Родосе. Рабин является сторонником Мапай и другом Игаля Аллона"
 Yigal_Allon_desc: "Родился в 1918 году, Игаль Аллон вступил в Хагану в 1931 году и командовал подразделением во время Великого арабского восстания, позже, во время Войны за независимость, Аллон командовал подразделением, которому было приказано обстрелять 'Альталену', корабль снабжения Иргуна, после того, как последний вступил в конфронтацию с Бен-Гурионом. После войны Аллон помог сформировать 'Мапам', но Бен-Гурион предупредил его, чтобы он отошел от этой партии, так как она была конкурентом его собственной 'Мапай'. В настоящее время Аллон является командующим Южным командованием."
 israel.57.d: "Федаины и их египетские спонсоры атаковали нас достаточно долго, и мы решили действовать. Сегодня десантники 890-го батальона высадились в Хан-Юнисе, чтобы атаковать старый египетский форт Тегарт и ещё одно египетское укрепление под кодовым названием 'Позиция 132', которое доминирует над ближайшей дорогой, что было жизненно важно для обеспечения вывода войск. Позже механизированные силы во главе с командиром Мордехаем 'Мотте' Гуром окружили форт, а силы Рафаэля 'Рафуля' Эйтана заняли позицию 132. Все позиции были защищены к 22:45, были установлены заряды взрывчатки, чтобы превратить форт Тегарт в руины. 72 египтянина были убиты и только 1 израильтянин погиб, что является несомненным успехом."
 israel.58.d: "Египетские войска решили блокировать Эйлатский залив, поэтому мы решили внезапно атаковать их на довольно необороняемом секторе. В 20:00 890-я парашютно-десантная бригада и бригада 'Нахаль' атаковали египетские укрепления в Рас-Сираме при поддержке минометов и артиллерии. К утру все египетские укрепления были уничтожены, 81 египтянин лежал мертвым и 55 попали в плен, в то время как мы потеряли только 5 человек, ошеломляющая победа и большой позор для [EGY.GetLeader]"
 israel.59.d: "Чтобы стимулировать экономику, правительство решило открыть торговлю с Великобританией. Хотя социалисты, такие как Мапай и Мапам, протестовали против этого по экономическим причинам, а также Херут протестовал против сделки как 'сделки с дьяволом', сделка, тем не менее, была подписана."
 israel.60.d: "Израильский средний класс всегда был омрачен большим и мощным рабочим классом и всесильным Гистадрутом, которому было позволено процветать при Мапай. Больше нет, мы ограничим полномочия Гистадрута, чтобы не дать ему взять под полный контроль израильскую экономику и позволить малому бизнесу процветать. Мапай и Мапам, очевидно, поспешили атаковать этот законопроект, в то время как Херут аплодировал идее ограничения власти профсоюзов. После напряженного голосования законопроект прошел, нам остается только ждать и смотреть, что будет дальше"
 israel.61.d: "Гистадрут никак не отреагировал на наш законопроект, фактически они ответили письмом, в котором выразили возмущение и 'немедленные репрессии', если мы не отменим этот законопроект. Хотя это вызвало беспокойство в правительстве, премьер-министр Рокач решил продолжать борьбу в надежде, что Гистадрут просто блефует"
 israel.62.d: "Ужасные новости: Гистадрут призвал к протестам от Тель-Авива до Хайфы, от Беэр-Шебы до Иерусалима в рамках того, что пресса называет 'Красным летом'. Рабочие скандируют 'Остановите угнетение рабочего движения', 'Кнессет несправедлив, Рокач там, стоит на концессии, замышляет свое угнетение', а некоторые даже начали петь 'Интернационал'. Это большой удар для правительства Рокача, так как экономика находится в беспорядке из-за локальных забастовок, объявленных Гистадрутом."
 israel.63.d: "Давление на правительство Рокача с требованием прекратить забастовки нарастает, некоторые предлагают использовать против них ОМОН, в то время как многие кричат, что это приведет лишь к беспорядкам и насилию. Рокач решил начать переговоры и, возможно, предложить небольшие уступки Гистадруту в обмен на то, что они прекратят свои протесты. Пока что переговоры ни к чему не приводят, но надежда есть"
 israel.64.d: "Ссылаясь на неспособность администрации Рокача заключить приемлемое соглашение, Гистадрут призвал провести последнюю всеобщую забастовку в надежде нанести 'нокаутирующий' удар правительству Рокача. В назначенный день улицы Тель-Авива, Хайфы, Иерусалима и других крупных городов заполнили демонстранты, открыто призывающие правительство уйти в отставку."
 israel.65.d: "Премьер-министр Исраэль Рокач под сильным давлением извне и внутри своего правительства принял решение уйти в отставку с немедленным вступлением в силу. 'Граждане Израиля, сегодня я говорю вам с тяжелым сердцем, что я решил уйти в отставку.', 'Я действовал только в лучших интересах Израиля, никакого злого умысла, никаких планов, только улучшение нашей нации.' Рокач заявил, что Перец Бернштейн займет его пост премьер-министра."
 israel.66.d: "Давление на правительство Рокача с требованием прекратить забастовки нарастает, некоторые предлагают использовать против них ОМОН, в то время как многие кричат, что это приведет лишь к беспорядкам и насилию. Рокач решил начать переговоры и, возможно, предложить небольшие уступки Гистадруту в обмен на то, что они прекратят свои протесты. Пока что переговоры ни к чему не приводят, но надежда есть"
 israel.67.d: "Перец Бернштейн представил сегодня свое правительство президенту, который одобрил его формирование. В правительство войдут "Общие сионисты" Бернштейна, "Прогрессисты" Пинхаса Розена, "Мафдаль" Хаим-Моше Шапиры, "Религиозный фронт Торы" и "Херут" Бегина. Это нестабильная коалиция, но Бернштейн назвал ее "первым несоциалистическим правительством Израиля" и выразил доверие к ней."
 israel.68.d: "Новый министр финансов Йосеф Сапир сегодня беседовал с премьер-министром Бернштейном, чтобы рассказать ему о своей идее дальнейшего стимулирования и оживления израильской экономики. Идея заключается в том, чтобы Израиль присоединился к Европейскому экономическому сообществу в качестве расширения торгового соглашения с Великобританией. Он утверждал, что расширение торговли с Западной Европой оживит экономику Израиля. Бернштейн отнесся к этой идее благосклонно и сказал ему, что сделает все возможное, чтобы довести ее до конца"
 israel.69.d: "В своей речи перед ЕЭС Перец Бернштейн объявил о плане поиска ассоциации с ЕЭС, чтобы 'вдохнуть новую жизнь в больную экономику Израиля'. Его встретили аплодисментами с одной стороны и яростными насмешками с другой, особенно со стороны Мапай, Мапам и члена коалиции Херут, который решил разорвать связи с правительством из-за этого предложения, назвав его 'дьявольским пактом'. Большинство членов МК поддерживают этот шаг, поскольку считают экономику социалистов обреченной на провал, и положительно отреагировали на эту идею."
 israel.70.d: "После своего выхода из правительства 'Херут' атакует правительство при каждом удобном случае. Сегодня она даже вынесла вотум недоверия, надеясь сломить поддержку правительства и вынудить его уйти в отставку. Эта авантюра провалилась, так как остальные члены коалиции остались непоколебимы в своей поддержке правительства."
 israel.71.d: "Херут не одинок в своей оппозиции Ассоциации ЕЭС, Мапай и Мапам также выступили против нее, поскольку, по их мнению, она 'подрывает израильский внутренний труд' и 'наносит ущерб работнику'. Обе партии, особенно Мапай, надеются использовать оппозицию Ассоциации ЕЭС как точку опоры для возвращения в правительство на следующих выборах."
 israel.72.d: "Увеличение торговых сделок с Европой стабилизировало экономику, которая даже начала медленно восстанавливаться, Бернштейн быстро объявил это триумфом капитализма над социализмом, в то время как Мапай и Мапам называют это 'фасадом'. Если тенденция сохранится, экономика Израиля восстановится и начнет расти к 1961 году."
 israel.73.d: "Мапай и Мапам - не единственные социалисты, выступающие против ассоциации с ЕЭС. Гистадрут, профсоюз, свергнувший правительство Рокача, выступил с критикой идеи ассоциации с ЕЭС и заявил о своем несогласии с идеей ассоциации Израиля с ЕЭС."
 israel.74.d: "В прошлом месяце экономика не только восстановилась, но и бурно развивалась, благодаря торговой политике правительства. Благодаря экономическому буму Бернштейн и 'Всеобщие сионисты' постоянно поднимаются в опросах, и Бернштейн подумывает о проведении досрочных выборов, чтобы воспользоваться экономическим успехом."
 israel.75.d: "Премьер-министр Бернштейн призвал к проведению досрочных выборов в этом году, используя свой недавний экономический успех, который, как он надеется, заставит народ 'забыть' о противоречиях, окружающих правительство его партии. Мапай надеется сменить тему на Ассоциацию ЕЭС и вернуться к власти благодаря голосованию рабочего класса против ЕЭС."
 israel.76.d: "Победив на выборах, Меир Яари быстро начал искать партнеров, и то, что он нашел, был Йисраэль Галили и его партия 'Ахдут ха-авода'. Оба презирали Бен-Гуриона и разделяли общую социалистическую идею. Оба человека быстро согласились вместе сформировать правительство во имя социализма."
 israel.77.d: "Правительство представило свой экономический план до 1959 года, 'Четырехлетний план' по строительству и развитию земли Израиля. Этот план вдохновлен советским стилем 'строительства' экономики. План быстро набирает критиков, которые говорят, что он обречен на провал"
 israel.78.d: "Одними из самых яростных критиков Четырехлетнего плана являются капиталистические генеральные сионисты и прогрессисты, которые называют план 'угнетающим для владельцев бизнеса', говорят, что он только 'повредит Израилю' и призывают отменить план."
 israel.79.d: "Мапай также присоединилась к лагерю критиков, заявив, что план 'слишком авторитарен' и 'недемократичен', они также заявили, что план 'приведет Израиль в пропасть."
 israel.80.d: "Министр иностранных дел Йисраэль Галили объявил, что он посетит СССР для улучшения отношений между двумя странами. Многие другие партии обеспокоены тем, что это первый признак 'советского Израиля'. Херут назвал Галили предателем и сказал, что он 'предвещает гибель Израиля, сионизма и еврейского народа'. Пока мало кто возмущается, но многие все же обеспокоены тем, что этот визит создает прецедент на будущее."
 israel.81.d: "Руководство Гистадрута, связанное с Мапам, сталкивается с проблемами со стороны фракций, связанных с Мапам. Теперь кажется, что фракции, связанные с Мапам, перехватят руководство у Мапай. Победа на фронте Гистадрута поможет закрепить позиции Мапам как главной социалистической партии."
 israel.82.d: "Вопрос, который поднимался во время формирования правительства: приглашать Маки или нет? Приглашение коммунистической, антисионистской и бинационалистской партии сильно расстроит все остальные крупные партии, но если мы не пригласим их, наше правительство будет иметь все меньшее большинство в Кнессете под угрозой падения. Приглашать Маки или нет?"
 israel.83.d: "После приглашения Маки в нашу правительственную коалицию, Мапай вскоре подала вотум недоверия нашему правительству, ссылаясь на 'предательство сионистских ценностей, на которых был основан Израиль'. Хотя голосование было очень близким, мы вырвались из беды, и вотум провалился."
 israel.84.d: "Министр иностранных дел Йисраэль Галили объявил о политике, согласно которой Израиль будет двигаться в сторону третьего мира и нейтралитета. Мапай, Всеобщие сионисты, Херут и Прогрессивные говорят, что мы отдаляемся от нашего единственного главного союзника, Соединенных Штатов, и этот шаг обречет Израиль на гибель. Тем не менее, наша политика продолжается"
 israel.85.d: "В соответствии с нашими социалистическими, эгалитарными убеждениями, мы решили декриминализировать гомосексуализм, что возмутило религиозные партии, такие как Мафдаль и Объединенный фронт Торы, которые говорят, что этот шаг 'нееврейский' и превратит Израиль в 'декадентскую нацию"
 israel.86.d: "Новый законопроект, секуляризирующий Шаббат и превращающий его в светский 'День отдыха', едва прошел сегодня голосование в Кнессете, к возмущению и без того враждебно настроенных религиозных и традиционалистских партий. Чьи сторонники все больше возмущаются светской политикой нашего правительства."
 israel.87.d: "Религиозные и ультраортодоксальные евреи сегодня начали протестовать по всей стране, требуя сохранить Израиль как 'еврейское государство' и прекратить 'коммунистическую болтовню'. Мы решили не использовать полицию, чтобы не обострять ситуацию ещё больше, но Яари решил продолжать свою политику."
 israel.88.d: "Мафдаль сегодня вынес вотум недоверия после протестов, заявив, что мы предали 'еврейские ценности и доверие народа', этот вотум снова провалился, но он показывает ослабление поддержки в правительстве."
 israel.89.d: "Югославия пригласила нас сегодня начать конференцию в надежде решить израильско-палестинский конфликт мирным путем. Министр иностранных дел Галили возглавил израильскую делегацию и начал переговоры с палестинской и арабской делегациями о возможном прекращении конфликта."
 israel.90.d: "Израиль и арабские страны, а также палестинская делегация подписали сегодня Белградские соглашения, которые обещают, что Израиль превратится в двунациональное светское государство к 1965 году. Это вызвало возмущение всех оппозиционных партий в Кнессете, заявивших, что Мапам ведет Израиль к гибели."
 israel.91.d: "Херут, Мапай, Всеобщие сионисты, Прогрессивная партия, Мафдаль и Объединенный фронт Торы выдвинули сегодня вотум недоверия в качестве последней попытки свалить правительство, но он не прошел с перевесом в 2 голоса. Хотя это маленькая победа для Мапам, это очень тревожная перспектива относительно будущего правительства."
 israel.92.d: "Столкновения между евреями и арабами в Израиле и на Западном берегу сегодня резко возросли после Белградских соглашений, а также слабые обещания арабских держав поддержать соглашения привели к тому, что доверие к соглашениям упало до нового минимума. Многие теперь считают, что попытка создания двунационального государства заглохла из-за отсутствия общественной поддержки, и даже Я'ари начинает верить в это."
 israel.93.d: "Рейтинг одобрения Я'ари также упал, достигнув отметки в 10%. Поскольку коалиция становится все более шаткой, Я'ари подумывает о том, чтобы объявить досрочные выборы и посмотреть, что из этого выйдет."
 israel.94.d: "Я'ари, поддавшись общественному и внутреннему давлению, решил назначить досрочные выборы в этом году, решив вернуть принятие решений народу. Выборы вполне могут стать референдумом по Белградским соглашениям, где Мапам, скорее всего, потерпит поражение."
 israel.95.d: "После победы на выборах Бегин начал поиск потенциальных союзников, он поговорил с лидером Всеобщих сионистов Исраэлем Рокачем в 'долгой, продуктивной беседе', которая продвигает его цели по созданию коалиции большинства."
 israel.96.d: "Сегодня Херут и Общесионисты достигли соглашения, согласно которому Общесионисты поддержат правительство Херута в обмен на то, что Херут поставит Исраэля Рокача министром финансов, а Переца Бернштейна - министром промышленности. Бегин называет это соглашение 'шагом вперед к созданию режима, свободного от социализма'. Добившись присоединения к своей коалиции Прогрессистов, Мафдала и Объединенного фронта Торы, Бегин представил правительство президенту, который одобрил его формирование."
 israel.97.d: "Бегин представил сегодня свой 'Манифест монополии', подробно изложив план борьбы как с корпоративными монополиями, так и с профсоюзными монополиями, что было встречено в Гистадруте с тревогой, которые очень хорошо знают его намерения в ослаблении их власти."
 israel.98.d: "Представленный Херут и Всеобщими сионистами, Закон о профсоюзах 1956 года серьезно ограничит полномочия профсоюзов и снизит влияние Гистадрута на нацию. Бегин провозгласил это как конец социалистической эры"
 israel.99.d: "Гистадрут не отреагировал на закон о профсоюзах доброжелательно, он выразил свое возмущение и заявил, что сделает все возможное, чтобы бороться с деспотичными законами."
 israel.100.d: "Ужасные новости, Гистадрут призвал рабочих от Тель-Авива до Хайфы, от Беэр-Шебы до Иерусалима к забастовке летом 1956 года, чтобы показать правительству Бегина 'силу и единство рабочего движения', в настоящее время правительство Бегина заняло пассивную позицию, опасаясь дальнейшей эскалации ситуации."
 israel.101.d: "Мапай и Мапам вынесли вотум недоверия правительству в свете рабочих протестов, ссылаясь на 'жестокое предательство народа администрацией Бегина'. Это предложение не прошло, но оно показывает, что пассивный подход правительства не работает."
 israel.102.d: "Демонстранты-социалисты, связанные с Гистадрутом, решили провести сегодня марш к Кнессету, чтобы 'заклевать Бегина'. Бегин не дал никакого ответа, и многие считают его непреклонную решимость либо признаком упрямства, либо признаком силы."
 israel.103.d: "Активисты движения 'Херут' и социалистические демонстранты устроили беспорядки в Тель-Авиве. Столкновение приобрело такой размах, что для разгона бунтовщиков пришлось привлечь полицию. Никто не погиб, но 45 человек получили ранения. Многие призывают 'Бегин' принять меры, чтобы остановить насилие."
 israel.104.d: "Бегин решил действовать и выступил сегодня по радио с речью в программе 'Коль Исраэль'. 'Сограждане, в свете последних событий я обращаюсь к вам с призывом к разуму. Пусть никто не отрицает опасностей нашего времени', - начал он. 'Пока мы сражаемся друг с другом, разделенные мелкими распрями нашей общей истории, прилив более серьезного конфликта обращается против нас, угрожая разрушить все, чего мы достигли', - добавил он, - 'Пришло время для нас, евреев, граждан и людей, оставить в стороне наши давние распри и объединиться. Приливы и отливы невыигрышной войны надвигаются на нас, и мы должны найти убежище на возвышенности, чтобы нас не смыло потоком'. Режима Мапай больше нет. То подобие единства и защиты, которое он когда-то обеспечивал, стало призраком, воспоминанием. Если наши враги останутся без контроля, к кому вы обратитесь за защитой? Разрушения, причиненные арабскими державами, очевидны. Мы видели, как наши дома и общины были разрушены огнем сирийской артиллерии. Мы воочию видели, как наши друзья и близкие были убиты палестинскими федаинами. Какими бы ужасными и невообразимыми они ни были, это знаки нашего времени. Пришло время, мои сограждане, сплотиться вокруг флага, в Единстве - сила, многие уже поняли это и стекаются под наше единое знамя, так давайте же, сограждане, объединяйтесь! Объединяйтесь, ибо мы победим, чего бы нам это ни стоило!"
 israel.105.d: "Сторонники Херут, многие из которых имеют мизрахийское происхождение, организовали 'парад любви' к премьер-министру. Их сторонники называют это 'улучшением по сравнению с недавними протестами', а их противники - 'бездумными автоматами'. Бегин назвал парад Великолепным"
 israel.106.d: "Бегин представил свой план по развитию периферии и выведению ее на один уровень с центральными городами. 'Периферия игнорировалась достаточно долго, мы будем развивать ее и превратим в блестящий образец сионистской решимости'. сказал Бегин в своей речи в Кнессете"
 israel.107.d: "Давид Бен-Гурион выступил против Бегина. Назвав его 'фашистской фигурой в наших рядах' и 'провозвестником гибели Израиля'. Бегин отверг эти обвинения, назвав Бен-Гуриона старческим маразмом"
 israel.108.d: "Египетские силы были разбиты в ходе быстрой операции ЦАХАЛа после преследования пограничных патрулей в течение последних 2 недель. Это рассматривается как большая победа милитаристского правительства Херут."
 israel.109.d: "Бегин представил свое \видение суверенного Израиля\, согласно которому Израиль контролирует не только Западный берег, но и Газу и другой берег Иордана. Это видение также ставило под сомнение легитимность Иорданского королевства, что вызвало возмущение со стороны иорданской монархии."
 israel.110.d: "Сегодня сирийцы начали артиллерийский обстрел с Голанских высот, убив 3 и ранив 50 человек. Бегин провозгласил, что сирийцы заплатят за этот акт агрессии, но отказался уточнить, как это сделать."
 israel.111.d: "За последние 2 месяца увеличилось количество зарегистрированных столкновений с боевиками 'Федаин', что вызвало беспокойство общественности по поводу безопасности. Бегин заявил в своей речи, что он \'уничтожит всех террористов Федаин\' и что \'Израиль будет безопасным государством, ни один террорист не попадет внутрь\'. Бегин подумывает о созыве досрочных выборов, чтобы воспользоваться позицией своей партии, выступающей за безопасность."
 israel.112.d: "Бегин призвал к проведению досрочных выборов сегодня, надеясь извлечь выгоду из позиции своей партии, выступающей за безопасность и милитаризм, в связи с увеличением числа нападений федаинов. Мапай и Всеобщие сионисты надеются получить роль лидера, проводя кампанию по прекращению \'экстремистской\' и \'раскольнической\' политики Бегина."
 israel.113.d: "Две религиозные сионистские партии, Мизрачи, и их более трудовой близнец, ХаПоэль ХаМизрачи (буквально Рабочий Мизрачи) решили завершить объединение в одну партию после совместного участия в выборах 1955 года под названием 'Национальный религиозный фронт'. Новая партия будет называться \'Национально-религиозная партия\' или \'Мафдал\' для краткости и будет продолжать представлять религиозный сионизм в Кнессете."
 israel.114.d: "Ультраортодоксальная партия Агудат Йисраэль и ее близнец, основанный на труде, Поалей Агудат Йисраэль (буквально Работники Агудат Йисраэль) решили баллотироваться вместе под одним списком под названием \'Религиозный фронт Торы\'. Новый список будет продолжать представлять интересы ультраортодоксов в Кнессете."
 israel.115.d: "Известно, что Египет может быть причастен к атакам федаинов, но только недавно правительство раскрыло всю степень их участия. Несколько дней назад был пойман боевик Fedayeen, убивший мирного жителя в Реховоте, и при нем был найден документ, связывающий его с египетской военной разведкой. Правительство решило действовать решительно, чтобы ослабить 'Федаины' и их египетских спонсоров, совершив рейд на важную базу 'Федаинов' в контролируемой Египтом Газе. 150 десантников под командованием Ахарона Давиди и Дэнни Матта атаковали египетскую базу недалеко от города Газа и успешно устроили засаду на египетский конвой военной помощи. В общей сложности в бою погибло около 38 египтян и 8 израильтян. Крупное унижение для Египта, который в ответ заблокировал Акабский пролив для израильского морского и воздушного сообщения."
 israel.116.d_1: "Сегодня полиция прибыла в город Вади-Салиб, где большинство населения составляют олимы. Они прибыли, чтобы остановить драку, которая происходила в одном из кафе города, спровоцированную жителем города по имени Акива Яаков Элькариф, человеком североафриканского происхождения, который в тот день находился под воздействием алкоголя. Никто не знает, что произошло дальше, но полицейские ранили Элькарифа в ногу. Среди олимов-мизрахи (в основном выходцев с Ближнего Востока и Северной Африки) начали распространяться слухи о том, что полиция убила Элькарифа, и они собрались возле городского полицейского участка и начали протестовать и бунтовать, утверждая, что полиция проводит против них этническую дискриминацию. Участники беспорядков также разграбили клубы Мапай и Гистадрут, заявив, что правительство Мапай дискриминирует их."
 israel.116.d_2: "Сегодня полиция прибыла в город Вади-Салиб, где большинство населения составляют олимы. Они прибыли, чтобы остановить драку, которая происходила в одном из кафе города, спровоцированную жителем города по имени Акива Яаков Элькариф, человеком североафриканского происхождения, который в тот день находился под воздействием алкоголя. Никто не знает, что произошло дальше, но полицейские ранили Элькарифа в ногу. Среди олимов Мизрачи (в основном выходцев с Ближнего Востока и Северной Африки) начали распространяться слухи о том, что полиция забила Элькарифа до смерти, и начались жестокие беспорядки перед городским полицейским участком из-за претензий полиции на расовую дискриминацию. После грабежа и разграбления полицейского участка Вади Салиб, участники беспорядков начали грабить и разрушать клубы Мапай и Гистадрут, утверждая, что Мапай является \'расистской ашкеназской организацией\\' и обвиняя ее в дискриминации против них."
 israel.117.d: "После победы на выборах 1955 года Мапай сформировала ещё одно правительство во главе с ней. Мапай остается крупной и влиятельной партией со времен до обретения независимости, и формирование этого правительства свидетельствует о продолжении доминирования Мапай."
 israel.118.d: "Новая скульптура Меноры, созданная еврейским скульптором Бено Эльканом, была подарена сегодня Кнессету еврейской общиной Англии. Сигнал о продолжении хороших отношений между Израилем и диаспорой."
 israel.119.d: "Сегодня Херут и Агудат Йисраэль выдвинули вотум недоверия после решения правительства открыть промышленную выставку в Хайфе в шаббат. Это сильно расстроило ультраортодоксальную 'Агудат Йисраэль', а также дало возможность 'Херут' обвинить 'Мапай' ещё в одном деле. Предложение провалилось, что свидетельствует об оставшейся силе Мапай в правительстве."
 israel.120.d: "Нынешнее здание, в котором располагается Кнессет, было построено не совсем для этих целей, поэтому правительству была предложена идея строительства нового здания для размещения Кнессета. Правительство решило провести публичный конкурс, чтобы определить проект, по которому будет построено новое здание Кнессета."
 israel.121.d: "Сегодня премьер-министр опубликовал заявления о признании дискриминации египетских евреев со стороны правительства Египта. Вероятно, это было сделано из-за и без того плохих отношений между Израилем и Египтом."
 israel.122.d: "Сегодня премьер-министр в своем заявлении сказал, что резня в Кфар-Касиме была \'ужасающим злодеянием, произошедшим среди нас\'. И призвал все вовлеченные стороны не допустить подобной эскалации впредь."
 israel.123.d: "Херут выразил вотум недоверия в связи с нашим решением уйти с Синайского полуострова по решению ООН. Они назвали это \'национальной трагической новостью\' и считают, что мы должны были остаться и впоследствии аннексировать Синайский полуостров. Очевидно, что предложение провалилось, так что беспокойства было не так много."
 israel.124.d: "Конкурс архитекторов судебной коллегии единогласно выбрал Йосефа Кларвина для проектирования нового здания Кнессета. Новый проект, как говорят, будет более современным, чем когда-либо."
 israel.125.d: "Психически больному человеку удалось пробраться в здание Кнессета и бросить гранату в пленум якобы с намерением убить премьер-министра. В то время как премьер-министру удалось спастись, получив лишь незначительные ранения, министр по делам религии Хаим Моше-Шапира получил более тяжелые ранения от осколков. После этого инцидента премьер-министр решил сформировать подразделение, которое будет обеспечивать безопасность в здании Кнессета и вокруг него. Охранники Кнессета не допустят повторения этого инцидента"
 israel.126.d: "Примерно сейчас Израилю исполняется 10 лет. Десятилетие со дня образования первого еврейского государства за 2000 лет. И правительство, и народ праздновали на улицах и в своих домах, и радость охватила каждый уголок каждой улицы каждого города по всей стране."
 israel.127.d: "Несколько министров Мафдала ушли в отставку из правительства из-за дебатов на тему \'Кто еврей\', которые вышли из-под контроля, что заставило их уйти в отставку. Это привело к расколу в правительстве, так как Мафдаль находится на грани выхода из коалиции и подвергает опасности всю коалицию."
 israel.128.d: "Сегодня началось строительство нового здания Кнессета в Иерусалиме. Новое здание будет больше и лучше, чем любое другое правительственное здание, которое у нас было до сих пор, и станет вершиной израильской инженерии."
 israel.129.d: "Сегодня вечером началась паника после того, как популярная радиопередача на 'Коль Исраэль' была прервана военными кодовыми словами, сигнализирующими о мобилизации резервистов, что указывает на чрезвычайное положение в стране. Эти учения повергли общественность в панику, поскольку многие решили, что в стране действительно чрезвычайное положение и что страна подвергается нападению. Даже королева Бельгии Елизавета находилась в Израиле, когда произошел кризис, который поверг ее вместе с другими иностранными делегатами в стране в массовое замешательство, думая, что они оказались втянуты в ещё одну войну. Только в 11 часов вечера, через два часа после начала призыва, Коль Исраэль объявил, что это были всего лишь учения. Пресса назвала эту ночь 'Ночью уток', так как одним из кодовых слов было \'водяные утки\'"
 israel.130.d: "Сегодня несколько различных партий выдвинули ещё один вотум недоверия, ссылаясь на чистое управление \'Ночью уток\', которая повергла общественность в панику. Голосование провалилось, но это свидетельствует об ослаблении позиций правительства по мере приближения дня выборов."
 israel.131.d: "Премьер-министр решил назначить выборы на ноябрь этого года, надеясь воспользоваться дезорганизацией в оппозиции и одержать ещё одну победу для Мапай."
 israel.132.d: "Армия приказала ввести комендантский час во всех арабских деревнях вблизи иорданской границы с 5 вечера до 6 утра. В деревне под названием Кафр Касим или Кфар Касим. Местному батальону пограничной полиции было приказано \'стрелять на поражение\' в каждого, кто нарушит комендантский час. Затем в деревню въехал грузовик с 28 пассажирами, и пограничная полиция открыла по ним огонь, убив нескольких человек. Многие другие раненые жители деревни остались без помощи. Запрет на освещение военных действий, наложенный правительством, не позволил прессе осветить это событие, пока два члена МК Маки, Меир Вильнер и Тауфик Туби, не прибыли в деревню и не убедили правительство начать расследование. Правительство заявило, что этот инцидент не должен повториться снова, и что проводится внутреннее расследование, а также прекратило запрет на освещение этого события в прессе."
 israel.133.d: "После поражения Херута, Объединенный религиозный фронт распался на две партии, ХаПоэль ха-Мизрачи и Мизрачи образовали Мафдаль (Национально-религиозная партия), а Агудат Израиль и Поалей Агудат Израиль образовали Религиозный фронт Торы."
 idea_ISR_German_Reparations: "Немецкие репарации"
 mapai.1.d: "\'Старый путь, очевидно, потерпел неудачу в рабочем движении Мапай\', сказал новоиспеченный председатель Мапай Моше Шаретт, бывший министр иностранных дел. Шаретт, который возглавил Мапай после Давида Бен-Гуриона, приступил к попытке перестроить имидж Мапай с нуля. Теперь Мапай - это не партия отставших от жизни старожилов, теперь Мапай - это партия рабочих и \'всех\' рабочих, ашкеназов, мизрахи, сефардов, йеменцев и т.д.. Теперь Мапай - это партия современного социализма и социал-демократии, 'Новая Мапай' - это современная партия 1950-х годов, а не партия 1920-х годов."
 mapai.2.d: "Премьер-министр Шаретт не известен решительными действиями, как его предшественник Бен-Гурион, Шаретт скорее полная противоположность, дипломатичный, компромиссный и прагматичный премьер-министр, который стремится использовать перо для достижения своих целей. Такой подход, обожаемый Шаретом, позволяет его кабинету беспредельничать в управлении государственными делами, когда министры де-факто действуют самостоятельно без вмешательства премьер-министра, но пока это не наносит никакого реального ущерба. Такой прагматичный подход, хотя и способствует сплочению коалиции, поскольку позволяет децентрализовать управление, наносит ущерб власти исполнительной власти и создает прецедент слабого премьер-министра."
 mapai.3.d: "Моше Шаретт, занимающий пост министра иностранных дел в дополнение к должности премьер-министра, не чужд ведению переговоров с другими. Часто называемый своими коллегами 'Переговорщиком', Моше Шаретт сумел сохранить впечатляюще стабильную коалицию, начиная от его собственной Мапай, все ещё оправляющейся от собственных потрясений, до либеральных сионистов среднего класса и религиозных сионистов. Моше Шаретт изобретает новый взгляд на 'государственного деятеля' премьер-министра."
 mapai.4.d: "Преобладающие мапайники, все ещё поддерживающие ушедшего от власти Давида Бен-Гуриона, напали на Моше Шарета за его \'трусливое\\' управление. \ 'Если он не может управлять своим кабинетом, как, черт возьми, он может управлять страной?\', - сказал Бен-Гурион в интервью. Хотя Бен-Гурион официально отошел от политики после отстранения Шарета, он не мог упустить возможность выступить против своего соперника."
 mapai.5.d: "С момента формирования правительства Голда Меир, 'железная леди', занимала пост министра обороны, но сейчас она направила письмо, в котором объявила о своем намерении уйти с этого поста, чтобы больше сосредоточиться на должности министра внутренних дел. Теперь перед Шаретом стоят два кандидата на пост министра обороны: интриган, но способный Пинхас Лавон или надежный, но осторожный Леви Эшколь."
 mapai.6.d: "Моше Шаретт отправился в США с официальным гос. визитом. Его намерения - встретиться с президентом США для улучшения отношений между Израилем и Америкой, а также сделать Америку надёжным союзником для Израилья в будущем. После двухчасовой прогулки в Кэмп-Дэвиде с президентом США. Шаретт достиг соглашения, по которому США будут поддерживать Израиль в обмен на обязательство Израиля не ставить под угрозу стабильность на Ближнем Востоке."
 mapai.7.d: "Пинхас Лавон, министр обороны, вступил в перепалку с разгневанным Моше Шаретом после того, как последний узнал об инциденте на египетской границе, в результате которого один солдат ЦАХАЛа погиб и трое получили ранения. По всей видимости, египетская армия выпустила минометный снаряд после того, как израильские учения запустили миномет на их территорию и ответили добром. Шаретт направил письмо в Египет, чтобы сообщить им об отсутствии недоброжелательности в надежде разрешить ситуацию до ее эскалации."
 mapai.8.d: "Новоиспеченная председательница Мапай, Голда Меир начала сегодня кампанию в СМИ, чтобы представить себя непогрешимой 'государственной женщиной', наиболее подходящей на пост премьер-министра. Благодаря своей способности держать свою партию под контролем ей удалось выставить себя стойким и грозным политиком, которому нельзя перечить."
 mapai.9.d: "Теперь, когда Голда Меир стала премьер-министром, ее поведение на своем посту называют похожим на поведение ее предшественника Бен-Гуриона. Агрессивная администрация, принимающая тяжелые решения, с мощным кабинетом премьер-министра была названа прессой 'новым видом старого'. Пока что мощная исполнительная власть гарантирует, что премьер-министр остается влиятельной фигурой в делах государства."
 mapai.10.d: "В качестве смелого шага Голда Меир решила позволить Общим сионистам покинуть ее правящую коалицию, чтобы привлечь более надежных Прогрессистов. Хотя большинство сохраняется, крупная партия теперь находится в оппозиции, но теперь коалиция будет меньше конфликтовать, или так надеется Голда Меир."
 mapai.11.d: "Голда Меир всегда держала горячую линию связи с Сде Бокером, далеким южным кибуцем, где бывший премьер-министр Давид Бен-Гурион сделал свой дом. Она обменивается с ним письмами, когда даже она не уверена в дальнейших действиях, в надежде услышать совет старика."
 mapai.12.d: "Общее впечатление от премьерства Голды Меир - 'железная леди', решительный премьер-министр, которая управляет своей коалицией железной рукой, а всей страной - бархатной перчаткой. Хотя это усиливает напряженность в коалиции, она уверена, что с ее кабинетом нельзя шутить"
 mapai.13.d: "Призывая покончить с фракционностью внутри Мапай, Леви Эшколь объявил себя кандидатом партии и национального единства. Ставя государство выше мелких дел, Леви Эшколь начал блиц-акцию в СМИ, чтобы показать себя мягким, добрым и честным государственным деятелем, который может стать преемником Бен-Гуриона."
 mapai.14.d: "Посторонний наблюдатель может расценить премьерство Леви Эшколя как простое безделье, но его кабинет министров считает иначе. По совету своего коллеги Моше Шаррета, Леви Эшколь выбрал полупрагматичный подход к управлению, сохранив при этом пост премьер-министра как влиятельную должность. Леви Эшколь пытается найти золотую середину для наилучшего управления"
 mapai.15.d: "Леви Эшколь сегодня разрешил небольшой инцидент внутри своей коалиции, обменявшись несколькими портфелями в кабинете министров между Общими сионистами и Религиозными сионистами, пообещав при этом преследовать цели, поставленные обеими партиями, такие как расширение возможностей среднего класса и 'Сохранение целостности Шаббата'. Хотя люди могут сказать, что компромисс просто оставляет обе стороны неудовлетворенными, Леви Эшколю пока удается сохранять стабильную коалицию."
 mapai.16.d: "Не секрет, что Леви Эшколь - близкий друг Давида Бен-Гуриона, Леви Эшколь часто обменивался письмами со своим другом по поводу государственных дел, спрашивая его совета по тому или иному вопросу. Возможно, два мозга, работающие вместе, создадут более успешную администрацию"
 mapai.17.d: "Эшколь подготовил к эфиру довольно обыденную речь на Новый еврейский год, которая будет транслироваться по радио через 'Коль Израэль'. Но, увы, во время чтения своей речи он спотыкался и запинался, что не очень-то похоже на государственную речь. Его помощники призывают его перечитать речь, но Эшколь воспринимает это как оскорбление его ораторских способностей."
 mapai.18.d: "Эшколь решил отменить свое новогоднее выступление, чтобы не тратить драгоценное время на пересъемку речи. Наступил канун Нового года, и граждане стали включать 'Коль Израэль', чтобы обнаружить, что вместо запланированной речи звучат обычные песни. Некоторые отправили письма в офис премьер-министра с вопросом, что случилось с речью."
 mapai.19.d: "Я... желаю всем гражданам государства Израиль! Евреев, арабов, друзов и многих других, с Новым годом! Заикающаяся речь Леви Эшколя стала мгновенным хитом, так как фасад непогрешимого премьер-министра, кажется, исчез на мгновение с его приземленной и довольно человеческой речью. Люди хвалят его честность и обожают своего премьер-министра как народного премьер-министра."
 mapai.20.d: "После того, как Пинхас Лавон был приведен к присяге в качестве премьер-министра, многие задумались о том, как может выглядеть его премьерство. Похоже, что он намерен реализовать большинство пунктов Мапай, вызывающих наибольшие разногласия, но, как известно, прибегает к тактике умолчания, чтобы обеспечить их прохождение. Пока что другие партии делают все возможное, чтобы быть на его стороне, поэтому у Левона никогда не было особых проблем с формированием коалиции."
 mapai.21.d: "В качестве одного из своих первых дел Левон разработал закон об укреплении Гистадрута, но понял, что не сможет провести его без поддержки Мапама и Меира Яари, поэтому он договорился с Яари о сделке 'услуга за услугу': сначала представить закон о Гистадруте, а после того, как Мапам поможет его принять, он представит другой законопроект, запрещающий Гистадруту поддерживать любую политическую партию. Первый законопроект прошел достаточно легко, но после внесения второго законопроекта, поддержанного Мапам, он тайно приказал всем депутатам Мапай проголосовать против этого законопроекта, обрекая его на провал на заседании Кнессета. Это возмутило Меира Яари, которого видели кричащим и ссорящимся с Левоном после голосования."
 mapai.22.d: "Частым предметом разногласий между Мапай и ее обычными партнерами по коалиции ультраортодоксами был статус образования. Левон стремился достичь окончательного соглашения, которое благоприятствовало бы позиции Мапай, поэтому он внес законопроект о строительстве светских школ вблизи ультраортодоксальных общин, но также пообещал принять законопроект об укреплении Главного раввината. После принятия первого законопроекта, что вызвало недовольство ультраортодоксов, Левон решил рассмотреть второй законопроект, что привело к тому, что возмущенные ультраортодоксы вышли из правительства, но в это время Левон получил ряд нелегальных депутатов от Мапай, чтобы поддержать свое правительство извне, сохранив поддержку большинства в Кнессете."
 mapai.23.d: "Все уловки Левона, похоже, догнали его: Менахем Бегин, Меир Яари и Ицхак Меир-Левин внесли вотум недоверия, после напряженного голосования и отчаянных переговоров Левон добился, чтобы за него проголосовали изгои из числа членов Мапам, сионистов, Прогрессивной партии и Мафдала, что едва спасло его правительство от краха."
  
  #Decisions 
  
 ISR_Olim_category: "Дела олимов"
 ISR_Olim_category_desc: "С момента образования нашего молодого государства, \nЕвреи по всему миру покинули свои родные страны \nначать новую жизнь в Израиле, в то время как это соответствует нашим \nцель как еврейская родина, мы должны принять \nучитывать, как разместить \nтысячи новых иммигрантов (или олимов), которые прибывают \nу нашего порога каждый день.  \n\n Эти решения и ваши действия будут §Cвлияние \nрезультаты предстоящих выборов 1952 года,§! поэтому выбирайте \nс умом. \n\n\n§YУдовлетворенность олимов: [?ROOT.ISR_Olim_anger]% Рейтинг одобрения§!"
 ISR_build_pituach: "Маршрут Олим - Аярот Питуах"
 ISR_assist_in_exodus: "Оказание помощи евреям прибывающим из арабских стран"
 ISR_build_maabarot: "Постройте Маабарот"
 ISR_News_Chooser_category: "Заголовок новостей"
 ISR_News_Chooser_category_desc: "Переход к другому заголовку новостей"
 ISR_Choose_News: "Изменение заголовка новостей"
  
 ##################### 
 ISR_side_with_the_hareidim: "Встать на сторону харейдимов"
 ISR_side_with_the_hareidim_desc: "Более ортодоксальные харейды имеют моральное преимущество в этом споре, а также поддержку наших раввинов. Мы должны встать на их сторону"
 ISR_side_with_the_hilonim: "Встать на сторону хилоним"
 ISR_side_with_the_hilonim_desc: "Более светские хилоним подкрепляют свои аргументы успехами современного мира. Мы должны быть больше похожи на западные страны и встать на их сторону"
 ISR_stay_neutral: "Встать на сторону нейтралитета"
 ISR_stay_neutral_desc: "Выбор стороны в этом споре только ухудшит ситуацию. Мы должны оставаться и казаться настолько нейтральными, насколько это возможно"
 ISR_the_talks_are_a_failure: "Переговоры провалились"
 ISR_the_talks_are_a_failure_desc: "Наше решение о встрече двух сторон дало обратный эффект, и ситуация выглядит как никогда плохо. Нам придется действовать быстро, чтобы не допустить ухудшения ситуации"
 ISR_the_talks_are_a_success: "Переговоры проходят успешно"
 ISR_the_talks_are_a_success_desc: "Наше решение дать обеим сторонам обсудить их проблему принесло свои плоды, и напряженность снижается. Общественность также одобряет наши действия и поддерживает нас сейчас больше, чем когда-либо"
 ISR_force_hareidim_into_the_national_service: "Принудить харейдим к национальной службе"
 ISR_force_hareidim_into_the_national_service_desc: "Харейдимам каким-то образом удалось добиться освобождения от службы в ЦАХАЛе за изучение своих глупых текстов. Больше не получится"
 ISR_organize_talks_between_faction_leaders: "Организовать переговоры между лидерами фракций"
 ISR_organize_talks_between_faction_leaders_desc: "Единственный способ по-настоящему урегулировать это - заставить глав харедим и хилоним сесть за стол переговоров и провести цивилизованную дискуссию."
 ISR_make_yom_kippur_a_national_holiday: "Сделать Йом Кипур национальным праздником"
 ISR_make_yom_kippur_a_national_holiday_desc: "Йом Кипур - самый святой день иудаизма, и многие наши граждане сознательно оскверняют его! Это неприемлемо и должно быть изменено"
 ISR_tread_the_middle_ground: "Придерживаться средней позиции"
 ISR_tread_the_middle_ground_desc: "Все эти разговоры о поддержке в той или иной стороны просто смешны. Хотя мы пока не приобретем друзей, компромисс - единственный способ сохранить нашу страну"
 ISR_revoke_traditional_jewish_laws: "Отменить традиционные еврейские законы"
 ISR_revoke_traditional_jewish_laws_desc: "Хотя Израиль не так уж сильно склоняется к ортодоксальной религии, то немногое что в нем есть - слишком много, и нам нужно добиваться более светской социальной политики"
 ISR_enforce_religious_laws: "Обеспечить соблюдение религиозных законов"
 ISR_enforce_religious_laws_desc: "В соответствии с нашей более ортодоксальной политикой Кнессет недавно принял множество законов, обеспечивающих соблюдение ценностей и законов Торы. Мы должны обеспечить их соблюдение"
 ISR_address_hareidisecular_tensions: "Устранение напряженности между харейди и хилони"
 ISR_address_hareidisecular_tensions_desc: "В нашей стране существуют две основные секты евреев - более ортодоксальные, религиозные харейдиты и более левые, светские хилонимы. Они не согласны практически во всем, что приводит к падению внутренней стабильности. Мы должны занять позицию по этим вопросам"
 ISR_try_to_compromise: "Не принимать в Кнессете законы, основанные на религии"
 ISR_try_to_compromise_desc: "Хотя найти общий язык между двумя фракциями не невозможно, это будет трудно. Возможно, это не принесет немедленных результатов, но в дальнейшем сгладит нынешнюю напряженность. Отказ от голосования по любым вопросам, связанным с религией, будет хорошим началом"
 ISR_support_the_hareidim_in_the_knesset: "Продвигать политику харейдитов в Кнессете"
 ISR_support_the_hareidim_in_the_knesset_desc: "Чем более религиозной и нравственной будет наша страна, тем лучше. Мы должны быть на стороне харейдим в Кнессете, чтобы принимать законы, которые следуют принципам Торы"
 ISR_support_the_hilonim_in_the_knesset: "Продвигать политику Хилони в Кнессете."
 ISR_support_the_hilonim_in_the_knesset_desc: "Представление о том, что религия и государство не должны быть разделены, абсурдно. Мы должны поддержать Хилоним в Кнессете, чтобы этого не произошло"
 ISR_crack_down_on_hareidi_protests: "Подавить протесты харейдитов"
 ISR_crack_down_on_hareidi_protests_desc: "После наших последних решений харейдитское население бунтует на улицах. Они должны принять новый статус-кво"
 ISR_suppress_hiloni_strikes: "Подавить забастовки в Хилони"
 ISR_suppress_hiloni_strikes_desc: "В ответ на то, что мы следуем Слову Божьему, заблудшие хилонимы подтолкнули рабочих фабрик к забастовке. Нам нужно разогнать их, пока ситуация не стала ещё хуже"
 ISR_accept_hiloni_strikes: "Отозвать политику ультраортодоксов"
 ISR_accept_hiloni_strikes_desc: "Возможно, мы зашли слишком далеко в нашем стремлении создать более святой Израиль. Лучше мир и дружба между всеми евреями, чем раздоры и строгие законы. Возможно, нам стоит отказаться от некоторых из наших недавних законов"
 ISR_accept_hareidi_protests: "Принять протесты харейдитов"
 ISR_accept_hareidi_protests_desc: "Хотя мы не согласны с ними или не понимаем их, мы должны, по крайней мере, позволить харедим продолжать свой образ жизни без вмешательства. Пришло время отказаться от некоторых из наших наиболее спорных политик."
 isr.tooltip.1: "Это разблокирует ветвь религиозной напряженности"
 isr.tooltip.2: "Хотя это сделает харейдитов счастливыми и принесет вам пользу сейчас, позже вам придется иметь дело с последствиями от хилоним"
 isr.tooltip.3: "Это увеличит поддержку и выгоду харейдитов"
 isr.tooltip.4: "Это увеличит поддержку харейдитов, но хилоним начнут протестовать"
 isr.tooltip.5: "Ну, это сделает хилоним счастливыми и принесет вам выгоду в краткосрочной перспективе, позже вам придется иметь дело с последствиями от харедим."
 isr.tooltip.6: "Это увеличит поддержку и выгоду Хилони"
 isr.tooltip.7: "Это увеличит поддержку Хилони, но харедим начнут протестовать"
 isr.tooltip.8: " Это стабилизирует ситуацию позже, но в краткосрочной перспективе окажет негативное влияние на нацию."
 isr.tooltip.9: "Это усилит гнев харейдитов и хилони"
 isr.tooltip.10: "Это откроет цепь событий, которые улучшат или ухудшат религиозную напряженность"
 isr.tooltip.11: "Это отменит некоторые недавние светские политики, направленные на умиротворение харедим"
 isr.tooltip.12: "Это отменит некоторые недавние православные политики, чтобы умиротворить хилоним"."
  
 hareidi_support_1: "Малая поддержка харейдитов"
 hareidi_support_1_desc: "Из-за наших недавних политических действий некоторые евреи-харейдиты начали активно поддерживать нас"
 hiloni_support_1: " Малая поддержка хилони"
 hiloni_support_1_desc: "В связи с нашими недавними политическими действиями некоторые евреи-хилони начали активно поддерживать нас."
 isr_compromise_1: "Первоначальные попытки компромисса"
 isr_compromise_1_desc: "Мы пытаемся уладить отношения между двумя фракциями, но они не сотрудничают"
 hareidi_support_2: "Средняя поддержка харейдитов"
 hareidi_support_2_desc: "Благодаря нашим недавним политическим действиям, ещё больше евреев-харейдитов стали поддерживать нас"
 hiloni_support_2: "Средняя поддержка Хилони"
 hiloni_support_2_desc: "Благодаря нашим недавним политическим действиям, ещё больше евреев-хилони стали поддерживать нас"
 isr_compromise_2: "Возобновление усилий по достижению компромисса"
 isr_compromise_2_desc: "Несмотря на все наши усилия, ситуация продолжает ухудшаться"
 hareidi_support_3: "Большая поддержка харейдитов"
 hareidi_support_3_desc: "Благодаря нашим недавним политическим действиям, большинство евреев-харейдитов начали поддерживать нас"
 hiloni_support_3: "Большая поддержка хилони"
 hiloni_support_3_desc: "Благодаря нашим недавним политическим действиям, большинство евреев-хилони начали поддерживать нас"
 Election1955: "Выборы 1955 года были проведены"
 hareidi_compromise: "Компромисс с харедим"
 hiloni_compromise: "Компромисс с хилоним"
 hareidi_support_4: " Широкая поддержка харейдитов"
 hiloni_support_4: " Широкая поддержка хилони"
 hareidi_protests: "Протесты харейдитов"
 hiloni_strikes: " Забастовки хилони"
  
 israel.religiousdebate.d: "В наших усилиях по примирению двух религиозных фракций мы решили, что будет полезно, если лидеры харедим и хилоним сядут за стол переговоров и проведут цивилизованную дискуссию по вопросам, которые их разделяют. Если все пойдет по плану, они смогут все уладить, и мы сможем прийти к удовлетворительному для всех компромиссу. Однако если мы окажемся не на той стороне по слишком многим вопросам или они не смогут прийти к согласию, мы можем оказаться в худшем положении, чем начинали"
 debate.1.d: "Тема для обсуждения - насколько сильно правительство должно быть вовлечено в процесс сертификации кошерной пищи. Лидеры Хилони настаивают на том, чтобы не было никакого федерального вмешательства, в то время как лидеры Харейди требуют, чтобы все предприятия соблюдали кошерность. Аргументом 'золотой середины' здесь было бы создание комитета по надзору за процессом кошерности, что облегчило бы компаниям сертификацию кошерных продуктов, а нам - отслеживание некошерных продуктов, но мы можем пойти любым путем"
 debate.2.d: "Следующая тема переговоров - вопрос о Шаббате, и, как и ожидалось, обе стороны пытаются придерживаться своих прежних позиций: хилоним говорят, что Шаббат должен полностью игнорироваться, а харейдим - что он должен быть обязательным. Логичный путь здесь - остаться в стороне и позволить каждому делать то, что он считает нужным. Почему правительство должно принуждать кого-то к религии, которой он не хочет придерживаться?"
 debate.3.d: "Третьим и последним, а также самым спорным вопросом является вопрос об освобождении от службы в ЦАХАЛе харейдитов, занимающихся изучением Торы после окончания школы. Хилоним уже ясно выразили свое отвращение к таким освобождениям, а харейдиты предупреждают о божественной каре, если мы оторвем этих ученых от их источника жизни. Мы можем попытаться найти компромисс и предоставить отсрочку, в отличие от абсолютного иммунитета, в дополнение к более ограниченным исключениям, или встать на сторону одной из фракций в этом вопросе"
 debate.4.d: "Дебаты между харедим и хилоним завершились, были приняты различные резолюции по трем пунктам, обсуждавшимся во время переговоров. Последствия дебатов пока неясны, и будет ли это иметь положительное или отрицательное влияние на нашу страну, ещё предстоит выяснить. Остается надеяться, что мы приняли правильные решения."
 compromise_issue_1: "Компромисс по первому вопросу"
 compromise_issue_2: "Компромисс по второму вопросу"
 compromise_issue_3: "Компромисс по третьему вопросу"
 hareidi_issue_1: " На стороне харедим по первому вопросу"
 hareidi_issue_2: " На стороне харедим по второму вопросу"
 hareidi_issue_3: " На стороне харедим по третьему вопросу"
 hiloni_issue_1: " На стороне хилоним по первому вопросу"
 hiloni_issue_2: " На стороне хилоним по второму вопросу"
 hiloni_issue_3: " На стороне хилоним по третьему вопросу"
 isr_compromise_success: "Успешный религиозный компромисс"
 isr_compromise_success_desc: "Наши усилия по примирению харедим и хилоним окупились, и мы наслаждаемся результатами"
 isr_compromise_fail: "Провал религиозного компромисса"
 isr_compromise_fail_desc: "Наши усилия по примирению харедим и хилоним потерпели неудачу, и мы занимаемся устранением последствий"
  
 suez.0.d: "После того, как последние британские войска ушли на родину, и оккупация закончилась, [EGY.GetLeader] сделал шаг к возвращению нашей естественной территории, которая слишком долго находилась под контролем империалистических англичан. Сегодня [EGY.GetLeader] разорвал фарсовый англо-египетский договор 1936 года, освободив нас от оков жаждущего власти Запада! Однако, хотя мы находимся на пороге завоевания большой славы для себя и всего арабского мира, мы должны подождать и посмотреть, как отреагирует международное сообщество..."
 suez.1.d: "Сегодня правительство Египта решило в одностороннем порядке аннулировать англо-египетский договор 1936 года. Это было встречено с большой тревогой многими представителями международного сообщества, поскольку следующим логическим шагом Насера является не что иное, как захват Суэцкого канала, что только разрушит нашу экономику и мировой престиж. ещё более зловещёй, однако, является мысль о том, что если Насер и дальше будет сотрудничать с Советами, как предполагается, красные будут контролировать поток нефти с Ближнего Востока во весь западный мир.."
 suez.2.d: "Несколько часов назад наши солдаты вошли в зону Суэцкого канала и по праву захватили его, вытеснив оттуда империалистов раз и навсегда! После их вступления правительство быстро объявило о национализации Суэцкого канала, создав великий момент и большую победу для нас и всего арабского мира. Англичане, как и ожидалось, в ярости, но они не смогут обойти ООН и весь остальной мир, если только не решат сделать что-нибудь действительно безумное."
 suez.3.d: "Наши опасения по поводу судьбы Суэцкого канала оправдались, так как Египет захватил и национализировал Суэцкий канал. Это беспрецедентная опасность для нашей экономики и международного престижа, и мы должны действовать."
 suez.4.d: "Египет возмутительно национализировал Суэцкий канал, подвергая серьезной опасности наши торговые пути. Мы не одиноки в этой панике, так как британцы несут основную тяжесть удара. Между финансированием и вооружением Насером нашей оппозиции в Алжире и этой беспрецедентной, наглой пощечиной, мы должны сотрудничать с британцами, чтобы Насер никогда больше не причинил нам вреда и не оскорбил нас."
 suez.5.d: "Когда Египет национализировал Суэцкий канал, он одновременно заблокировал Тиранский пролив, расположенный к югу от Красного моря, отрезав порт Эйлат, а вместе с ним и наш доступ к большей части импорта - нефти и других товаров. Это приведет к гибели нашей экономики и голоду наших граждан, и мы не можем оставить это без внимания. Нужно что-то делать"
 suez.6.d: "США, опасаясь эскалации ситуации, организовали международную конференцию, чтобы разрешить кризис. Однако все вовлеченные стороны стояли на своем в вопросе о праве собственности на канал, и ни одна из сторон, казалось, не хотела уступать или идти на компромисс. Несмотря на большие надежды, которые американцы возлагали на переговоры, очевидно, что они полностью провалились, так как не было достигнуто никакого соглашения или решения о том, кому достанется канал."
 suez.7.d: "Гамель Абдель Насер поставил нас перед дилеммой, национализировав Суэцкий канал, ранее находившийся под нашим контролем. Теперь мы должны рассчитать, в наших ли интересах предпринять военные действия против Египта или отпустить один маленький кусочек империи. Если мы все же решимся на силовой ответ, нам, несомненно, придется действовать совместно с другой державой, например, с французами, чтобы не выглядеть слишком похожими на колониальных владык, натравливающих своих бунтующих подданных."
 suez.8.d: "Британский премьер-министр недавно связался с нашим лидером, чтобы обсудить военные действия против Египта в ответ на захват Насером Суэцкого канала. Это кажется разумным предложением, и если мы добьемся успеха в любом выбранном нами варианте, это может заставить Насера прекратить финансирование алжирских повстанцев, которые так долго досаждали нам."
 suez.9.d: "Британцы и французы направили нашему руководству сообщения, в которых говорится о желании нанести ответный удар по Насеру за его недавние действия, связанные с Суэцким каналом. Это кажется слишком хорошей возможностью, чтобы упустить ее - мы можем смирить одного из наших самых опасных врагов, захватить славу для себя и создать крепкие узы дружбы между нами и двумя великими европейскими державами. Вопрос только в том, воспользуемся ли мы ею?"
 suez.10.d: "Наш премьер-министр и высшие армейские чины собрались вместе со своими французскими и британскими коллегами в небольшом городке Севр, чтобы обсудить наши военные планы на войну с Египтом и политические варианты в случае успеха. Мы уже предлагали завоевать весь Египет, но эта идея была быстро отвергнута. Вместо этого мы решили провести менее масштабную операцию под кодовым названием "Кадеш', целью которой является уничтожение всех египетских войск на Синае менее чем за 2 недели. Несмотря на свою амбициозность, мы верим, что добьемся великолепного успеха.."
 suez.11.d: "На секретной встрече с британскими и израильскими лидерами и генералами было решено, что Израиль будет продвигаться через Синай при поддержке с воздуха с нашей стороны и со стороны RAF, а наши воздушно-десантные подразделения проведут совместную с британцами операцию по захвату канала, Порт-Саида и Порт-Фауда. Этому прыжку, названному операцией 'Телескоп', будет предшествовать кампания бомбардировок под кодовым названием "Мушкетер" (пересмотрено)"
 suez.12.d: "На секретном совещании с французскими и израильскими лидерами и генералами в отдаленном городе Севр было решено, что Израиль будет продвигаться через Синай при воздушной поддержке RAF и французов, а наши воздушно-десантные подразделения проведут совместную с французами операцию по захвату канала, Порт-Саида и Порт-Фауда. Этому прыжку, названному операцией 'Телескоп', будет предшествовать бомбардировочная кампания под кодовым названием 'Мушкетер'(пересмотрено)."
  #NOTE- chronologically, suez.13 through suez.16 are after suez.17-21 
 suez.13.d: "Время для мира прошло, и наши бомбардировщики и транспорты с войсками направляются в Суэц в ближайшее время. План состоит в том, чтобы нанести удары по ключевым военным и инфраструктурным целям в Суэце и его окрестностях, после чего наши люди высадятся в Порт-Саиде. Все наши планы с французами и израильтянами скоро подвергнутся испытанию, и мы можем только надеяться, что мы преуспеем как в военном отношении, так и, что, возможно, более важно, на площадке ООН. Ведь даже если мы вернем наши земли и обеспечим безопасность наших нефтяных путей, у международного сообщества могут быть разные мысли и мнения по поводу всего этого дела..."
 suez.14.d: "Время для мира прошло, и наши бомбардировщики и войсковые транспорты направляются в Суэц. План заключается в нанесении ударов по ключевым военным и инфраструктурным целям в Суэце и его окрестностях, после чего наши люди высадятся в Порт-Фауде. Все наши планы с британцами и израильтянами скоро будут подвергнуты испытанию, и мы можем только надеяться, что мы преуспеем как в военном отношении, так и, что, возможно, более важно, на площадке ООН. Ведь даже если мы вернем наши земли и обеспечим безопасность наших нефтяных путей, у международного сообщества могут быть разные мысли и мнения по поводу всего этого дела..."
 suez.15.d: "Наши транспорты достигли зон высадки, и наши храбрые воздушно-десантные подразделения высаживаются в ближайшее время. Израиль уже выполняет свою часть операции, и хотя мы обеспечили некоторую поддержку с воздуха, пришло время для нас выполнить свою часть Севрского соглашения и отвоевать канал у Насера и его банды воров."
 suez.16.d: "Наши транспорты достигли зон высадки, и наши храбрые воздушно-десантные подразделения высаживаются в ближайшее время. Израиль уже выполняет свою часть операции, и хотя мы оказали некоторую поддержку с воздуха, пришло время для нас выполнить свою часть Севрского соглашения и отвоевать канал у Насера и его банды воров."
 suez.17.d: "Израиль, в соответствии с планом Севра, вторгся на Синайский полуостров и наступает на Суэцкий канал, вызывая шок у мира, который готовится к надвигающемуся кризису нехватки нефти. Зная это, мы предложим прекращение огня, которое Насер наверняка отвергнет, что даст нам и французам повод присоединиться к израильтянам в борьбе против него. "
 suez.18.d: "В течение нескольких часов после вероломного сионистского вторжения на Синай, столь же отвратительные имперские державы Великобритания и Франция предложили прекращение огня, которое Израиль уже принял. Оно предусматривает немедленное прекращение всех военных действий, передачу канала под контроль миротворческих сил, уполномоченных ООН, и демилитаризацию Синайской пустыни. Мы можем либо отказаться от прекращения огня и сделать ставку на успех наших вооруженных сил, либо играть в безопасность и рисковать навлечь на себя гнев собственного народа и арабского мира."
 suez.19.d: "Насер согласился на прекращение огня и передал Суэцкий канал под контроль ООН. Хотя наши лучшие генералы и военные разочарованы упущенным шансом проявить себя, это явно лучше для нас, чем любые военные действия."
 suez.20.d: "Как и ожидалось (и почти надеялись), Насер отклонил предложенное нами прекращение огня. Израильтяне будут продолжать наступление на Синае, и нашим бомбардировщикам и воздушно-десантным подразделениям было дано слово готовиться к запуску. Согласие на прекращение огня было бы идеальным, но наши высшие генералы уверены в успехе наших сил."
 suez.21.d: "Как и ожидалось (и почти надеялись), Насер отклонил предложенное нами прекращение огня. Израильтяне будут продолжать наступление на Синае, и нашим бомбардировщикам и воздушно-десантным подразделениям было дано слово готовиться к запуску. Согласие на прекращение огня было бы идеальным, но наши высшие генералы уверены в успехе наших сил."
 suez.22.d: "За одну неделю хрупкая стабильность была разрушена странами и лидерами, которых мы считали своими союзниками. Израиль, Великобритания и Франция объявили войну Египту Насера, и мир ждет от нас ответа. Многие из наших ведущих советников по внешней политике предлагают нам решительно осудить агрессоров, чтобы завоевать доверие остального Ближнего Востока, но другие говорят, что это не наша борьба, а третьи по-прежнему утверждают, что нам нужно поддержать наших старых союзников."
 suez.23.d: "[USA.GetLeader], президент Соединенных Штатов, опубликовал официальное заявление, в котором объявил о намерении его и его правительства не вмешиваться ни во что, связанное с текущей ситуацией на Синае и в Суэцком канале. Это, по сути, дает нам и нашим союзникам свободу действий для продолжения войны и решения вопросов, связанных с мирной конференцией, как нам заблагорассудится."
 suez.24.d: "[USA.GetLeader], президент Соединенных Штатов, опубликовал официальное заявление, в котором объявил о намерении его и его правительства не вмешиваться ни во что, связанное с текущей ситуацией на Синае и в Суэцком канале. Это, по сути, дает нам и нашим союзникам свободу действий, чтобы продолжать войну и решать вопросы, связанные с мирной конференцией, как нам заблагорассудится. Наши ведущие эксперты по вопросам политики уже работают над благоприятными предложениями, включая возвращение канала под наш контроль."
 suez.25.d: "Благодаря отсутствию оппозиции со стороны крупных мировых держав, в частности США, нам удалось разработать мирный план, который пришелся по вкусу нам и нашим союзникам. Детали плана включают передачу Синая Израилю и возвращение канала в наши руки. Оглядываясь назад, можно сказать, что весь этот кризис оказался не таким уж плохим"
 suez.26.d: "В худшем случае президент Соединенных Штатов [USA.GetLeader] сделал официальное заявление, в котором решительно осудил недавние действия наши и наших союзников на Синае и в Суэцком канале, зайдя настолько далеко, что заявил, что рассматривает возможность прекращения любой помощи всем трем нашим странам. Кроме того, большая часть свободного мира последовала их примеру, и даже СССР навалился на них. Короче говоря, это не что иное, как катастрофа"
 suez.27.d: "В худшем случае президент США [USA.GetLeader] выступил с официальным заявлением, в котором решительно осудил недавние действия наши и наших союзников на Синае и в Суэцком канале, зайдя настолько далеко, что заявил, что рассматривает возможность прекращения любой помощи всем трем нашим странам. Кроме того, большая часть свободного мира последовала их примеру, и даже СССР навалился на них. На внутреннем фронте люди требуют отставки [ENG.GetLeader]. Короче говоря, это не что иное, как катастрофа без преувеличения."
 suez.28.d: "Сегодня ООН завершила обсуждение Суэцкого кризиса и приняла две резолюции, 997 и 1001, которые фактически положат конец всей ситуации. Вместе взятые, они отдают канал под мандат миротворческих сил ООН, демилитаризуют Синай, и, чтобы добавить ещё один пинок под зад, в одностороннем порядке осуждают нас, французов и израильтян. То, что казалось таким многообещающим в начале операций 'Мушкетер' и 'Телескоп', превратилось в наш худший провал с момента окончания Второй мировой войны"
 suez.29.d: "Вслед за резолюциями ООН 997 и 1001 мы проанализировали все, что произошло за последние несколько месяцев, включая все наши военные успехи и все наши политические неудачи. Хотя мы доказали нам, нашему народу и Египту, что мы не являемся военной державой, к которой можно относиться легкомысленно, все страны, которые могли относиться к нам благосклонно после 1948 года, теперь, несомненно, относятся к нам с подозрением и отвращением. Вся наша международная доброжелательность исчезла, и, похоже, мы оттолкнули от себя обе крупные державы. Следующее десятилетие, а возможно, и более длительный период, поставит перед нами задачи, не похожие на те, с которыми мы сталкивались раньше, и определит судьбу нашей нации.."
  #####Egypt holding and winning events 
 suez.30.d: "Египтяне продвигаются в Израиль"
 suez.31.d: "Египет удерживается в течение определенного времени"
 suez.32.d: "Провал Кадеша - прекращение огня + репарации Египту"
 suez.33.d: "Победа Египта на Синае"
 suez.34.d: "Израильские репарации Египту и кое-что об открытии Тиранского пролива из-за несостоятельности ситуации"
 suez.35.d: "Событие для Франции с подробным описанием израильских потерь и прекращения огня, после чего они тоже подписывают перемирие"
 suez.36.d: "Событие для Великобритании с подробным описанием израильских потерь и прекращения огня, после чего они тоже подписывают перемирие"
  ####telescope stuff-connects to suez.15/16 
 suez.37.d: "Наши воздушно-десантные дивизии высадились в Порт-Саиде и его окрестностях с большей частью своего оборудования и формирований, но следующие несколько часов боев будут ключевыми. Египтяне собирают силы в этом районе для контратаки, и от того, смогут ли наши люди удержаться, будет зависеть успех 'Телескопа' и судьба Суэцкого канала. Наши командиры уверены, что мы выйдем победителями, но мы знаем, что в любой момент может произойти что-то неожиданное."
 suez.38.d: "Хорошие новости из Суэца! Штаб дивизии сообщает о грандиозной победе и полном контроле над Порт-Саидом, а французы добились аналогичного успеха в Порт-Фауде. Наши люди спешат захватить всю зону канала, и можно с уверенностью сказать, что, по крайней мере, с военной точки зрения, операция 'Телескоп' была успешной от начала до конца."
 suez.39.d: "Недавно мы запросили отчёт о ситуации по операции 'Телескоп', и то, что мы получили, говорит о том, что произошел самый худший сценарий. Египтяне смогли сплотиться гораздо быстрее, чем ожидалось, и застали наших людей врасплох, все ещё оправляющихся от первоначальных боев после падения. Они полностью захватили Порт-Саид, а французы говорят, что их подразделения вытесняются из Порт-Фауда. Это плохо. Очень плохо"
 suez.40.d: "Наши атташе в Британии и наши самолеты-разведчики сообщили, что десантирование в рамках операции 'Телескоп' потерпело впечатляющий провал, и полностью на нас лежит ответственность за победу в этом конфликте. Хотя это, очевидно, стало шоком, мы не можем позволить себе долго на этом зацикливаться. У нас есть два варианта. Первый - признать поражение и посмотреть, удастся ли заключить мирное соглашение в той или иной форме. Второй - быть уверенными в наших вооруженных силах и их способности перехитрить, перебороть и переработать своих египетских коллег"
 suez.41.d: "После провала 'Телескопа' израильтяне усугубили наше поражение и международный позор, заявив, что они готовы прекратить боевые действия в обмен на реальный, прочный мирный договор. Таким образом, за два-три дня Насер и его армия сдержали и нас, и французов, а теперь разгромили израильтян. Это катастрофа"
 suez.42.d: "США оказывают поддержку. Мы получаем хорошие отношения и некоторое оборудование!"
 suez.43.d: "США оказывает поддержку. Мы получаем хорошие отношения и некоторое оборудование!"
