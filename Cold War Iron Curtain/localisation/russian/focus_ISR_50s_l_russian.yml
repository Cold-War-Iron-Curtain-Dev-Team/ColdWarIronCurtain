 Shlomo_Shamir_desc: "Шломо Шамир родился как Шломо Рабинович в Бердичеве, Российская империя 15 июня 1915 года. В 1925 году он был отправлен в Палестину, а в 1929 году вступил в Хагану и играл важную роль в контрабанде оружия и нелегальных еврейских иммигрантов в Палестину во времена Британского мандата и Белой книги 1939 года. В 1940 году он получил лицензию пилота и в том же году вступил в Королевские ВВС, чтобы сражаться с нацистами и получить опыт ведения войны. В 1946 году он был демобилизован из британских вооруженных сил в звании майора. В 1948 году по приказу премьер-министра Давида Бен-Гуриона он возглавил израильскую 7-ю бронетанковую бригаду в борьбе за завоевание Латруна. Он также сыграл важную роль в создании Бирманской дороги. В конце войны в Палестине 1947-1949 гг. ему предложили стать начальником Генерального штаба, но он отказался. Вместо этого он занимал другие должности, в конце концов, став командующим израильским флотом."
 Israel_electricity_company: "Израильская электрическая корпорация"
 IMI: "Израильская военная промышленность"
 Golda_Meir: "Голда Меир"
 ISR_idea_NationalUnityWar: "Правительство национального единства военного времени"
 idea_Chaim_Weizmann: "Президент Хаим Вейцман"
 idea_ISR_economy_recession: "Катастрофическая экономика"
 idea_ISR_economy_recession_desc: "После войны за независимость экономика была в полном беспорядке, прибытие большого количества новых иммигрантов со всего мира тоже не помогло, нам нужно решить эту проблему, чтобы не быть разрушенными не снаружи, а изнутри."
 idea_ISR_economy_austerity: "Жёсткие меры экономии"
 idea_ISR_economy_austerity_desc: "Несмотря на свою непопулярность, правительство Бен-Гуриона приняло жёсткие меры экономии, чтобы удержать страну на плаву в эти тяжелые экономические времена. Многие противники говорят, что страна должна открыться для международного рынка, чтобы оживить экономику, в то время как некоторые поддерживают меры Бен-Гуриона. Граждане теперь вынуждены жить с небольшими пайками еды и других товаров."
 idea_ISR_economy_recovery: "Восстановление экономики"
 idea_ISR_economy_recovery_desc: "Наши первоначальные усилия по стимулированию экономики оказались успешными, но до полного восстановления ещё далеко."
 idea_ISR_5_Mems: "5 мемов"
 idea_ISR_5_Mems_desc: "5 'Мем' Жаботинского, права на питание, жилье, одежду, образование и здравоохранение, реализуются в рамках государственной программы. Мы надеемся, что эта 'смешанная' экономическая политика преодолеет разрыв между капиталистами и социалистами, создав капиталистическую систему, которая позаботится о маленьком человеке."
 idea_ISR_Olim_Population: "Исход евреев в Израиль"
 idea_ISR_Olim_Population_desc: "Поскольку евреи со всего мира массово иммигрируют в Израиль, численность населения резко возросла, если не удвоилась, и хотя хорошо иметь большое количество население для будущего, мы также должны думать о том, как интегрировать новых олимов."
 ISR_HelpingOlim: "Помощь олимам"
 ISR_HelpingOlim_desc: "Многие новые иммигранты (или олимы) испытывают трудности, когда впервые приезжают в Израиль, мы начали государственную программу помощи им за счёт драгоценных ресурсов"
 idea_YitzhakBenZvi: "Президент Ицхак Бен-Цви"
 ISR_Ben_Gurion_Rule: "Правило Бен-Гуриона"
 ISR_Ben_Gurion_Rule_desc: "Давид Бен Гурион был скалой нашей нации задолго до её основания год назад, направлял нас твердой рукой в трудные времена. Однако ветры меняются, и с ежедневным прибытием тысяч новых олимов, первый премьер-министр Израиля мог заметить, что его время на посту закончилось после первого срока."
 ISR_The_Election_of_1951: "Выборы 1951 года"
 ISR_The_Election_of_1951_desc: "Выборы 1951 года, первые в нашей короткой, но славной истории, способны радикально повлиять на направление развития еврейской нации. Кандидаты представлены во всем политическом спектре: от жёсткого коммуниста до левоцентристского социалиста, от главы религиозной коалиции до пограничного религиозного фашиста. Кто победит - никто не знает."
 ISR_Elections_of_1955: "Выборы 1955 года"
 ISR_Elections_of_1955_desc: "На вторых выборах в Израиле множество партий пытаются получить или вернуть контроль над Кнессетом. Однако настоящих претендентов всего несколько, и снова народ должен выбрать направление движения нации."
 The_Israeli_Defense_Forces: "Израильские силы обороны"
 The_Israeli_Defense_Forces_desc: "Армия обороны Израиля - единственная причина, по которой мы находимся здесь сегодня, имея в своих руках более половины Святой земли. Нам необходимо увеличить его численность и силу, а также продолжать наши исследовательские усилия, если мы хотим продолжать в том же духе."
 ISR_The_Israeli_Economy: "Израильская экономика"
 ISR_The_Israeli_Economy_desc: "Даже для такой молодой страны как наша, экономика не находится в отличной или даже среднем состоянии. Потребуется много работы, чтобы улучшить нашу экономическую мощь и инфраструктуру, среди прочего."
 ISR_Hula_Valley_Reclamation: "Восстановление долины Хула"
 ISR_Hula_Valley_Reclamation_desc: "Долина Хула имеет потенциал стать прекрасным, плодородным сельскохозяйственным регионом, но озеро Хула и окружающее его болото заражены малярийными комарами. Отвоевав землю для собственного использования, мы можем изменить ситуацию."
 ISR_Barlan_University: "Университет Бар-Илан"
 ISR_Barlan_University_desc: "Университет Бар-Илан, задуманный на встрече американских мизрахи в Атланте, будет государственным исследовательским учреждением, которое не только расширит наши возможности для экспериментов и исследований, но и станет местом высшего образования для наших ученых граждан."
 ISR_Israeli_Atomic_Commission: "Израильская атомная комиссия"
 ISR_Israeli_Atomic_Commission_desc: "Ядерные технологии слишком важны, чтобы их игнорировать, даже для такой маленькой страны, как наша. Создание Израильской атомной комиссии поможет нам в достижении этой цели."
 ISR_Tel_Aviv_Savidor_Central_Railway_Station: "Центральный железнодорожный вокзал Тель-Авива Савидор"
 ISR_Tel_Aviv_Savidor_Central_Railway_Station_desc: "Мы должны соединить нашу страну не только грунтовыми дорогами. Центральный железнодорожный вокзал в нашем крупнейшем городе, через который будет проходить большинство железнодорожных линий, сотворит чудеса с нашей инфраструктурой. Кроме того, это принесет пользу нашей растущей индустрии туризма."
 ISR_Create_the_City_of_Dimona: "Создание города Димона"
 ISR_Create_the_City_of_Dimona_desc: "Мы развиваем новые города по всему Израилю. ещё один город планируется построить возле комбината Мертвого моря в Восточном Негеве, который будет называться Димона. Это улучшит инфраструктуру и экономическое состояние нашей нации."
 ISR_Dimona_Nuclear_Reactor: "Ядерный реактор в Димоне"
 ISR_Dimona_Nuclear_Reactor_desc: "Французы согласились помочь нам в строительстве ядерного реактора вблизи Димона. Окруженные враждебными соседями, мы нуждаемся во всех военных преимуществах, которые мы можем получить, даже если это означает прибегнуть к 'ядерному варианту'."
 ISR_Create_the_City_of_Ofakim: "Создание города Офаким"
 ISR_Create_the_City_of_Ofakim_desc: "Мы должны основать ещё один город в Негеве. Офаким будет не только важным городским центром для близлежащих районов, в нем также будет расположено множество текстильных производств и фабрик."
 ISR_Tel_Aviv_University: "Университет Тель-Авива"
 ISR_Tel_Aviv_University_desc: "Школа права и экономики Тель-Авива, Институт естественных наук и Институт еврейских исследований объединяются для создания одного общего Университета Тель-Авива. Это хорошая новость для нас, так как их объединённые усилия повысят наши общие исследовательские возможности."
 ISR_Complete_the_Huleh_Swamp_Drainage_Project: "Завершить проект по осушению болота Хула"
 ISR_Complete_the_Huleh_Swamp_Drainage_Project_desc: "Проект по осушению болота Хула продвигается хорошо, но все ещё не завершён. Мы должны удвоить наши усилия, чтобы сельскохозяйственные разработки могли начаться как можно скорее."
 ISR_Expand_the_National_Telephone_Lines: "Расширение национальных телефонных линий"
 ISR_Expand_the_National_Telephone_Lines_desc: "Несмотря на то, что телефонные линии в Израиле являются основным товаром в наш современный век, они ужасно коротки и не дотягиваются до того расстояния, которое нам бы хотелось. Это необходимо изменить не только для удобства граждан, но и для точности военных действий."
 ISR_Left_Faction_1955_Victory: "Победа Левого блока"
 ISR_Left_Faction_1955_Victory_desc: ""
 ISR_Condemn_American_Imperialism: "Осудить американский империализм"
 ISR_Condemn_American_Imperialism_desc: ""
 ISR_Ties_With_East_Germany: "Связи с Восточной Германией"
 ISR_Ties_With_East_Germany_desc: ""
 ISR_The_Israeli_Airforce: "Военно-воздушные силы Израиля"
 ISR_The_Israeli_Airforce_desc: "Израильские ВВС сыграли большую роль в нашей победе в войне за независимость и несомненно будут только важнее в последующие годы. Нам необходимо развивать собственные реактивные самолеты, а также закупать всё что мы можем, у наших немногочисленных друзей за рубежом."
 ISR_Czechsovakian_Planes: "Лицензия на Метеор"
 ISR_Czechsovakian_Planes_desc: "Наши молодые ВВС нуждаются в новых самолетах. Мы могли бы обратиться в Великобританию за 'Метеором'."
 ISR_Domestic_Air_Manufacturing: "Производство бытового воздуха"
 ISR_Domestic_Air_Manufacturing_desc: "Помимо закупок за рубежом, нам также необходимо развивать местные производственные возможности. Строительство большего количества военно-промышленных комплексов в наших главных городских центрах поможет в этом."
 ISR_Develop_Former_British_Airfields: "Развитие бывших британских аэродромов"
 ISR_Develop_Former_British_Airfields_desc: "Когда британцы ушли, они оставили нам несколько крупных военных аэродромов. Их разработка поможет нам в нашей миссии по защите нашего неба."
 ISR_Israeli_Paratroopers: "Израильские десантники"
 ISR_Israeli_Paratroopers_desc: "Хотя они все ещё практически не испытаны в обычной войне (за исключением нескольких случаев), мы должны рассмотреть возможность создания собственной воздушно-десантной дивизии"
 ISR_Mapam_Victory: "Победа Мапама"
 ISR_Mapam_Victory_desc: "Вопреки всему, жёсткая коммунистическая партия Мапам победила на выборах 1951 года, причем результат, который почти никто не предсказывал. Они скорее всего будут продвигать более левую программу, чем Бен-Гурион и Мапай, а также более тесные связи с Советским Союзом."
 ISR_Enter_Coalition_with_Maki: "Коалиция с Маки"
 ISR_Enter_Coalition_with_Maki_desc: "Хотя мы победили на выборах, мы все ещё относительное меньшинство в нашем собственном правительстве. Объединение сил с нашими коммунистическими коллегами в Маки укрепит наши позиции в Кнессете."
 ISR_Nationalize_Healthcare: "Национализация здравоохранения"
 ISR_Nationalize_Healthcare_desc: "Состояние частного здравоохранения в Израиле ужасающее. Национализировав его, мы сможем улучшить его и установить стандартную стоимость медицинского обслуживания, а также продвинуть Израиль дальше к коммунизму. "
 ISR_State_Atheism: "Государственный атеизм"
 ISR_State_Atheism_desc: ""
 ISR_Promote_Womens_Rights: "Продвижение прав женщин"
 ISR_Promote_Womens_Rights_desc: "Иудаизм всегда смотрел на женщин свысока, отводя им роль на кухне, воспитывая детей. В нашем новом коммунистическом Израиле все будут иметь равные права!"
 ISR_Empower_Labor_Unions: "Расширение возможностей профсоюзов"
 ISR_Empower_Labor_Unions_desc: "Очевидным этапом нашей коммунистической программы является расширение прав и возможностей работника. Это означает больше прав для профсоюзов, а также увеличение льгот и заработной платы."
 ISR_Promote_A_Secular_Society: "Продвижение светского общества"
 ISR_Promote_A_Secular_Society_desc: "Израиль всегда был немного религиозным, чем нам бы хотелось, из-за его отношений с иудаизмом. Это должно измениться. Разделение церкви и государства более предпочтительно, чем альтернатива."
 ISR_The_Slansky_Trial: "Суд над Сланским"
 ISR_The_Slansky_Trial_desc: "Чехословакия, поддерживаемая Советским Союзом, проводит антисемитские показательные судебные процессы, чтобы оправдать свой недавний коммунистический переворот. Это ставит крест на наших планах подлизаться к Советам, потому что если они выступают против религиозных убеждений большинства наших граждан, мы потеряем большую часть нашей поддержки, встав на их сторону. Должны ли мы игнорировать их или осудить их?"
 ISR_Ignore_the_Trials: "Игнорировать судебные процессы"
 ISR_Ignore_the_Trials_desc: ""
 ISR_Soviet_Advisors: "Советские советники"
 ISR_Soviet_Advisors_desc: ""
 ISR_Lift_Martial_Law: "Отмена военного положения"
 ISR_Lift_Martial_Law_desc: ""
 ISR_Soviet_Economic_Aid: "Советская экономическая помощь"
 ISR_Soviet_Economic_Aid_desc: ""
 ISR_The_Israeli_Army: "Израильская армия"
 ISR_The_Israeli_Army_desc: "Израильская армия - это то, что будет защищать наших граждан и государство на земле в любых будущих войнах, и это жизненно важно для нашей безопасности и защиты. Она должна быть первоклассной и современной, если мы хотим выжить с армией такого размера, как сейчас."
 ISR_Establish_Unit_101: "Создание подразделения 101"
 ISR_Establish_Unit_101_desc: "Подразделение 101 - это подразделение специального назначения, которым будет командовать дерзкий молодой офицер Ариэль Шарон. Его роль будет заключаться в проведении рейдов на вражеские арабские территории в ответ на спонсируемый государством терроризм."
 ISR_Small_Conflicts_Traininig: "Тренировка малых конфликтов"
 ISR_Small_Conflicts_Traininig_desc: "Наша армия должна пройти специальную подготовку по сценариям малых конфликтов, поскольку наши офицеры должны уметь думать на своих ногах и быть независимыми в ситуациях, когда они должны действовать или наблюдать, как их подразделения распадаются на части."
 ISR_Complete_The_Paramilitary_Integration: "Завершить интеграцию военизированных формирований"
 ISR_Complete_The_Paramilitary_Integration_desc: "Основная часть боевых действий в 1948 году велась небольшими и элитными военизированными организациями, такими как Хагана, Иргун и Лехи. Теперь, когда у нас есть профессиональная армия, такие организации будут вредить нашей командной структуре и дадут ценный опыт, если будут интегрированы."
 ISR_The_Super_Sherman: "Покупка французских излишков"
 ISR_The_Super_Sherman_desc: "Франция оказалась восприимчивой к нашим дипломатическим достижениям. Несомненно, ЦАХАЛ мог бы извлечь выгоду из покупки старых военных излишков, которые французское правительство больше не использует."
 ISR_The_Uzi: "Узи"
 ISR_The_Uzi_desc: "Пистолет 'Узи' разрабатывался майором Узиэлем 'Узи Гал' с конца 1940-х годов. Легкий пистолет-пулемет/ПДВ использует конструкцию с открытым затвором и ударно-спусковым механизмом. Он будет полезен для войск тылового обеспечения и танкистов, а также для элитных штурмовых подразделений."
 ISR_Lessons_from_the_Arab_Israeli_War: "Уроки арабо-израильской войны"
 ISR_Lessons_from_the_Arab_Israeli_War_desc: "Из войны за независимость 1948 года мы можем узнать много нового по многим вопросам: тактика наших врагов, расположение и преимущества нашей родной местности, как сражаться с превосходящими силами на широком театре военных действий."
 ISR_Prepare_for_the_Worst: "Подготовка к худшему"
 ISR_Prepare_for_the_Worst_desc: "Хотя мы с ужасом ожидаем исхода возможной второй арабо-израильской войны, мы не можем быть слепы к тому, что она может произойти. Готовясь к худшему, мы можем гарантировать, что сделаем всё возможное."
 ISR_Collab_With_France: "Сотрудничество с Францией"
 ISR_Collab_With_France_desc: "Французы предлагают нам свой новейший легкий танк AMX-13. Было бы разумно принять их предложение и в дальнейшем использовать пушку AMX-13 для перевооружения наших 'Шерманов'."
 ISR_Condemn_Soviet_Anti_Semetism: "Осудить советский антисемитизм"
 ISR_Condemn_Soviet_Anti_Semetism_desc: "Мы хотели вписаться в советскую сферу, но недавний процесс Сланского показал нам ошибочность нашего пути. Нам придётся искать другой путь, и позаботиться о том, чтобы Советы не остались безнаказанными за этот ужасный фарс.."
 ISR_Appeal_to_Yugoslavia: "Обращение к Югославии"
 ISR_Appeal_to_Yugoslavia_desc: "Югославия - наш единственный вариант сейчас, когда Советы зашли слишком далеко, если мы хотим иметь коммунистического союзника. Нам придется обратиться к ним с призывом увеличить наши дипломатические связи и экономическое сотрудничество."
 ISR_Allow_Foriegn_Investment: " Разрешение иностранных инвестиций"
 ISR_Allow_Foriegn_Investment_desc: "Хотя это увеличит иностранное (и, возможно, капиталистическое) влияние в нашей стране, мы слишком слабы, чтобы полностью блокировать их. Мы позволим инвестициям сейчас, а с последствиями разберемся позже"
 ISR_Support_The_Kibbutz: "Поддержка Кибуца"
 ISR_Support_The_Kibbutz_desc: "Кибуц является неотъемлемой частью израильского общества и моделью современного социализма малого масштаба. Мы должны поддерживать существующие и поощрять граждан к созданию новых"
 ISR_Invest_in_Mass_Transit: "Инвестиции в массовый транзит"
 ISR_Invest_in_Mass_Transit_desc: "Массовый транзит - важная часть любой страны, и это то, чего нам очень не хватает. Инвестиции в него пойдут нам на пользу"
 ISR_Aid_the_Poor: "Помощь бедным"
 ISR_Aid_the_Poor_desc: "Тот факт, что в нашей стране так много бедных людей, прямо противоречит нашей коммунистической программе. Мы должны помогать им всем, чем можем, так как все должны иметь возможность пользоваться плодами нашей новой страны."
 ISR_Rappoachment_with_Mapai: "Сближение с МАПАЙ"
 ISR_Rappoachment_with_Mapai_desc: "МАПАЙ оставила нас вне своего коалиционного правительства перед недавними выборами, и посмотрите, к чему это привело! Но мы будем более крупной партией и позволим им снова играть главную роль в Кнессете в качестве жеста доброй воли. Надеюсь, это улучшит отношения между нами"
 ISR_Mapam_Victory_55: "Победа МАПАМ"
 ISR_Mapam_Victory_55_desc: "Партия МАПАМ победила на выборах 1955 года и будет продвигать свою коммунистическую повестку дня."
 ISR_Establish_State_Pensions: "Учредить государственные пенсии"
 ISR_Establish_State_Pensions_desc: "В нашей стране есть много людей, которые заслуживают пенсии - пожилые люди, пережившие Холокост, военные ветераны и другие. Мы должны создать программу, чтобы обеспечить их ею"
 ISR_Promote_Urbanization: "Продвигать урбанизацию"
 ISR_Promote_Urbanization_desc: "Поощряя наших граждан переезжать в большие города, мы можем укрепить нашу экономику, а также развить инфраструктуру."
 ISR_Aid_our_Farmers: "Помощь нашим фермерам"
 ISR_Aid_our_Farmers_desc: "Хотя мы хотим, чтобы больше людей жило в городах, мы не можем забывать о наших фермерах. Они жизненно важны для нашей экономики, и мы должны их поддерживать"
 ISR_Invest_in_Industry: "Инвестиции в промышленность"
 ISR_Invest_in_Industry_desc: "Несмотря на все наши усилия, наша отрасль все ещё крайне мала. Очевидно, нам нужно ещё больше поднажать, чтобы улучшить её состояние"
 ISR_Encourage_Israeli_Arab_Coexestience: "Поощрять израильско-арабское сосуществование"
 ISR_Encourage_Israeli_Arab_Coexestience_desc: "Состояние израильско-арабских отношений всегда было плохим, и трудно сделать хуже, чем сейчас. Мы не враги друг другу, и мы должны заставить людей с обеих сторон поверить в это"
 ISR_Ties_With_India: "Связи с Индией"
 ISR_Ties_With_India_desc: "Индия была для нас удивительным союзником как в экономической поддержке, так и в ООН. Нам нужно улучшить наши дипломатические связи с нашим новообретенным азиатским другом."
 ISR_Expand_the_Power_Grid: "Расширить энергосеть"
 ISR_Expand_the_Power_Grid_desc: "Некоторые из наших более сельских жителей все ещё живут без стабильной подачи электроэнергии. Нам необходимо расширить электросеть, чтобы исправить это"
 ISR_Promote_International_Neutrality: "Продвигать международный нейтралитет"
 ISR_Promote_International_Neutrality_desc: "Хотя нам все ещё нужно защищаться, нет необходимости ввязываться в конфликты, с которыми мы сейчас не можем справиться. Нам следует не высовываться, пока мы не станем сильнее"
 ISR_Yugoslavian_Arms_Deals: "Югославские оружейные сделки"
 ISR_Yugoslavian_Arms_Deals_desc: "Частью самообороны является способность содержать армию, и новая сделка с нашим союзником Югославией поможет нам в этом."
 ISR_The_Israeli_Navy: "Израильский военно-морской флот"
 ISR_The_Israeli_Navy_desc: "Израильский флот практически не существует. У нас всего 4 эсминца, и очень мало бронированных конвоев. Хотя это не слишком критично для нации нашего размера и географического положения, мы должны стремиться улучшить наш флот."
 ISR_Purchase_Destroyers: "Приобрести эсминцы"
 ISR_Purchase_Destroyers_desc: "Покупка эсминцев не сделает нас мировой державой в миг, но нам нужно с чего-то начинать чтоб развить наш надводный флот."
 ISR_The_Belgrade_Accords: "Белградские соглашения"
 ISR_The_Belgrade_Accords_desc: "Югославия предлагает провести встречу между нами и нашими палестинскими коллегами, чтобы обсудить любую возможность выхода из сложившейся ситуации. Это именно то, что нам нужно, чтобы двигаться вперёд и преодолеть наши мелкие разборки."
 ISR_Egyptian_Israeli_Peace_Treaty: "Египетско-израильский мирный договор"
 ISR_Egyptian_Israeli_Peace_Treaty_desc: "Хотя в 1948 году у нас было официальное прекращение огня с Египтом, Насер похоже ежедневно усиливает свою риторику. Если мы хотим добиться прочного мира, нам нужно что-то более точное."
 ISR_Purchase_Submarines: "Приобрести подводные лодки"
 ISR_Purchase_Submarines_desc: "Подводные лодки с каждым днём становятся всё более продвинутыми, и создание подводного флота было бы не самой плохой идеей, если мы хотим иметь наступательные возможности в Средиземноморье."
 ISR_British_Trained_Naval_Officers: "Морские офицеры с британской подготовкой"
 ISR_British_Trained_Naval_Officers_desc: "Отправив некоторых наших морских офицеров за границу в британские школы, мы сможем изучить новую тактику и улучшить нашу стратегию в открытом море."
 ISR_American_Naval_Advisors: "Американские военно-морские советники"
 ISR_American_Naval_Advisors_desc: "Отправив некоторых наших морских офицеров за границу в американские школы, мы сможем изучить новую тактику и улучшить нашу стратегию в открытом море."
 ISR_Enter_the_UN: "Вступить в ООН"
 ISR_Enter_the_UN_desc: "Пришло время занять своё место на мировой арене. Хотя год назад ООН признала независимость нашей страны, нам все ещё необходимо официально вступить в организацию. Это ознаменует новую, захватывающую главу в нашей истории."
 ISR_Government_Austerity: "Политика жёсткой экономии"
 ISR_Government_Austerity_desc: "Наша экономика находится не в том состоянии, чтобы правительство могло активно тратить деньги. Нам необходимо начать программы жёсткой экономии, чтобы остановить разрушения и начать её восстановление."
 ISR_Syrian_Armstice: "Сирийское перемирие"
 ISR_Syrian_Armstice_desc: "Сирийцы так и не приняли соглашение о прекращении огня в конце войны 1948 года, и с тех пор мы находимся в состоянии непростого перемирия де-факто. Это глупый способ продолжать наши дипломатические отношения с ними, и мы должны вести переговоры о надлежащем мире."
 ISR_Lusanne_Talks: "Лозаннские переговоры"
 ISR_Lusanne_Talks_desc: "Лозаннские переговоры были организованы ООН для решения оставшихся споров после войны за независимость. Мы готовы принять всё что она предложит во имя мира, но мы должны знать что наши арабские партнёры могут быть не так готовы."
 ISR_Designate_Jerusalem_as_the_Capital: "Назначить Иерусалим столицей"
 ISR_Designate_Jerusalem_as_the_Capital_desc: "Иерусалим всегда был домом еврейского народа, и хотя он не полностью в наших руках, мы должны определить его как нашу столицу, как во имя традиции, так и для того, чтобы улучшить мнение ортодоксальных евреев о нашем правительстве."
 ISR_Benelux_Recognition: "Признание Бенилюкса"
 ISR_Benelux_Recognition_desc: "Нам необходимо добиваться от стран региона Бенилюкс официального признания нашего статуса как независимой и суверенной нации, поскольку они не решаются сделать это."
 ISR_British_Recognition: "Британское признание"
 ISR_British_Recognition_desc: "Хотя Великобритания поддержала нас в обеих предыдущих резолюциях ООН относительно нашей независимости, мы должны быть уверены, что они выступают в качестве наших союзников на Ближнем Востоке и в ООН."
 ISR_First_Nationwide_Munincipal_Elections: "Первые общенациональные муниципальные выборы"
 ISR_First_Nationwide_Munincipal_Elections_desc: "Пришло время провести первые муниципальные выборы по всему Израилю. Это позволит создать городские советы и правительство, и, надеемся, новые мэры смогут принести пользу нашей стране как в политической, так и в экономической политике"
 ISR_Mapai_Victory: "Победа Мапай"
 ISR_Mapai_Victory_desc: "Мапай сохранила своё большинство в Кнессете благодаря тому, что все - и новые олимы, и старые граждане Израиля - остались довольны. Это не является неожиданностью, но интересно задаться вопросом, что могло бы быть, поскольку Израиль не будет двигаться в другом направлении - пока что"
 ISR_Palestinian_Concilation_Committee: "Палестинский комитет по примирению"
 ISR_Palestinian_Concilation_Committee_desc: "Хотя они могут быть не заинтересованы в разговоре с нами, мы должны связаться с палестинцами и другими арабскими группами вокруг Израиля в надежде на создание прочного мира в регионе."
 ISR_Fund_Egged_Bus_Corporation: "Финансировать автобусную корпорацию Egged"
 ISR_Fund_Egged_Bus_Corporation_desc: "Автобусная корпорация Egged является важной частью транзитной системы Израиля. Предоставив компании государственную субсидию, мы сможем увеличить её возможности по строительству новых линий и автобусов."
 ISR_Talks_With_West_Germany: "Переговоры с Западной Германией"
 ISR_Talks_With_West_Germany_desc: "Западная Германия предлагает нам репарации, чтобы начать 'компенсировать' то, что её предшественники сделали с нашим народом во время Холокоста 5 лет назад. Должны ли мы принять это предложение, потому что нам нужны деньги, или отвергнуть его, потому что деньги не могут скрыть 6 миллионов смертей?"
 ISR_The_Law_of_Return: "Закон возвращения"
 ISR_The_Law_of_Return_desc: "Пришло время открыть еврейское государство для всех евреев всех слоев общества - каждый еврей должен иметь право войти на землю, которая является его наследием. Это также пойдет нам на пользу, так как чем больше богатых евреев иммигрирует из-за рубежа, тем сильнее будет наша экономика."
 ISR_Operation_Erza_and_Neremiah: "Операция Эзра и Нехемия"
 ISR_Operation_Erza_and_Nehemiah_desc: "После Войны за независимость многие арабские страны стали жёстко преследовать евреев, живущих в их странах, а в некоторых крайних случаях сжигали и разрушали общины во время беспорядков, напоминающих нацистскую Германию. Мы должны эвакуировать их любыми возможными способами, даже воздушным путем, пока ситуация не ухудшилась"
 ISR_Mapai_Victory_1955: "Победа Мапай"
 ISR_Mapai_Victory_1955_desc: "Мапай снова контролирует Кнессет и будет продолжать свою прежнюю левоцентристскую политику."
 ISR_Apply_for_American_Arms_Sales: "Заявка на продажу американского оружия"
 ISR_Apply_for_American_Arms_Sales_desc: "Ну, американцы говорят, что они готовы продать нам военное оборудование, нам все ещё нужно пройти через обычный процесс подачи заявки, чтобы купить его. Надеюсь, они не ищут предлога, чтобы отказать нам"
 ISR_Egyptian_Tensions: "Напряженность в Египте"
 ISR_Egyptian_Tensions_desc: "После недавних карательных рейдов, Насер усилил свою антиизраильскую/антисионистскую риторику и пропаганду, и напряженность повысилась. Нам придется действовать осторожно, но отношения уже ухудшаются"
 ISR_Failure_of_the_Palestinian_Talks: "Провал палестинских переговоров"
 ISR_Failure_of_the_Palestinian_Talks_desc: "Как и ожидалось, палестинцы отвергли наше предложение о мире и о собственных поселениях. Нам придется двигаться дальше и попытаться снова, когда они будут готовы к переговорам больше, чем к открытой враждебности."
 ISR_Condemn_the_Slansky_Trial: "Осудить суд над Сланским"
 ISR_Condemn_the_Slansky_Trial_desc: "Суд над Сланским - это возмущение и ложь, призванные спровоцировать антисемитизм в попытке скрыть кровавый переворот Советского Союза в Чехословакии. Мы не можем сидеть сложа руки и молчать, пока это происходит"
 ISR_Education_Reforms: "Реформы образования"
 ISR_Education_Reforms_desc: "Хотя у нас есть рудиментарная школьная система, реформа и реструктуризация образования необходимы для упрощения и улучшения знаний и навыков обучения нашей молодежи."
 ISR_PM_Moshe_Sharret: "Премьер-министр Моше Шаррет"
 ISR_PM_Moshe_Sharret_desc: ""
 ISR_Continue_Palestinian_Martial_Law: "Продолжить палестинское военное положение"
 ISR_Continue_Palestinian_Martial_Law_desc: "В наших интересах быть как можно более строгими с палестинцами. Для этого нам нужно сохранить военное положение, даже если это принесет нам ещё несколько врагов."
 ISR_Mergers_With_the_Minor_Parties: "Слияния с мелкими партиями"
 ISR_Mergers_With_the_Minor_Parties_desc: ""
 ISR_General_Zionists_Victory_1955: "Победа Генеральных Сионистов"
 ISR_General_Zionists_Victory_1955_desc: ""Генеральные сионисты победили на выборах 1955 года и будут следовать своей центристской демократической доктрине"
 ISR_Promote_White_Collar_Enterprises: " Продвижение предприятий белых воротничков"
 ISR_Promote_White_Collar_Enterprises_desc: "В то время как у нас большое количество людей занято на фабриках и в сельском хозяйстве, у нас не хватает белых воротничков, административных/офисных работников. Мы должны поощрять больше людей занимать такие рабочие места"
 ISR_End_Austerity: "Покончить с жёсткой экономией"
 ISR_End_Austerity_desc: "Программа жёсткой экономии Мапай была нелепой. Она не только не достигла своей цели - стабилизации экономики, но и лишила наших граждан востребованных товаров. Мы должны покончить с ней немедленно"
 ISR_End_Government_Subsidies_to_the_Collectives: "Прекратить государственные субсидии коллективам"
 ISR_End_Government_Subsidies_to_the_Collectives_desc: "Мапай также раздавала огромное количество денег различным коллективам по всему Израилю. Это тоже бессмысленно, и в любом случае не соответствует нашей экономической политике. Субсидии будут прекращены"
 ISR_Political_Freedom: "Политическая свобода"
 ISR_Political_Freedom_desc: "Каждый человек, как было сказано многими до нас, рождается с определёнными неотъемлемыми правами. Мы здесь, у власти, в Израиле, чтобы обеспечить нашему народу эти права."
 ISR_Stregthen_French_Ties: "Укрепить французские отношения"
 ISR_Stregthen_French_Ties_desc: "Французы были одними из наших самых верных сторонников с момента создания нашей нации в 1948 году, поставляя нам военное оборудование, экономическую помощь и наш собственный ядерный реактор. Мы должны быть уверены, что сохраним этот союз"
 ISR_Continue_The_Status_Quo: "Продлить статус-кво"
 ISR_Continue_The_Status_Quo_desc: "Хотя наша политическая программа и направление не могут быть радикальными или захватывающими, это то, что нужно Израилю в данный момент. Может быть, мы и не революционеры, но мы обеспечиваем стабильность и относительное процветание нашей нации."
 ISR_Stregthen_British_Ties: "Укрепить британские отношения"
 ISR_Stregthen_British_Ties_desc: "Наш бывший колониальный владыка. Наши отношения с британцами, конечно, начинались не совсем гладко, но с 1948 года стали только лучше. Мы должны использовать преимущества нашей дружбы и тесного сотрудничества на благо нам обоим."
 ISR_Industrial_Growth: "Промышленный рост"
 ISR_Industrial_Growth_desc: "Мы не можем приложить достаточно усилий для улучшения нашей промышленности, настолько она жизненно важна для нашей экономики и мощи в целом. Как нация, мы должны стремиться строить и развивать больше на наших землях."
 ISR_British_Economic_Investments: "Британские экономические инвестиции"
 ISR_British_Economic_Investments_desc: "Поскольку наш союз с британцами надёжен, сейчас самое время обратиться с просьбой об инвестициях в крупные израильские компании и предприятия. В случае успеха мы поможем нашей экономике сейчас и их экономике в долгосрочной перспективе."
 ISR_Invest_in_Tel_Aviv: "Инвестировать в Тель-Авив"
 ISR_Invest_in_Tel_Aviv_desc: "Тель-Авив - наш самый большой город, и он самый модернизированный. Однако, всегда есть место для улучшений, особенно для страны нашего размера."
 ISR_West_German_Reperations: "Репарации Западной Германии"
 ISR_West_German_Reperations_desc: ""
 ISR_Embrace_Free_Trade: "Принять свободную торговлю"
 ISR_Embrace_Free_Trade_desc: "Нам необходимо получить всё что мы можем с мировых рынков, чтобы максимально увеличить наш экономический потенциал. Полное принятие свободной торговли в качестве нашей политики в отношениях с другими странами поможет это сделать."
 ISR_Promote_Industrial_Development: "Продвигать промышленное развитие"
 ISR_Promote_Industrial_Development_desc: "Из-за молодого возраста нашей страны, наша промышленность только начинает развиваться. Нам необходимо содействовать развитию, чтобы запустить наши производственные и фабричные районы."
 ISR_Seek_French_Weaponry: " Поиск французского оружия "
 ISR_Seek_French_Weaponry_desc: "Теперь, когда мы уверены в приверженности французов нашей безопасности, было бы разумно запросить у них больше первоклассного военного оборудования, особенно реактивные самолёты и танки, чтобы улучшить наши шансы в новой тотальной войне."
 ISR_Expand_the_Port_of_Haifa: "Расширить порт Хайфы"
 ISR_Expand_the_Port_of_Haifa_desc: "Как наша гражданская верфь, так и военные верфи крайне ограничены для наших нужд. Расширив Хайфу, один из наших главных портов, мы улучшим и то и другое"
 ISR_Build_West_Jerusalem: " Строительство Западного Иерусалима"
 ISR_Build_West_Jerusalem_desc: "Несмотря на то, что Западный Иерусалим является нашей столицей, он очень слабо развит, что позорит нас и нашу нацию. Мы должны построить совершенно новые кварталы и коммерческие районы, чтобы исправить это."
 ISR_National_Religious_Party_Victory: "Победа Херута - Религиозного Альянса"
 ISR_National_Religious_Party_Victory_desc: "Коалиция Герут-Религиозный Альянс победила на выборах 1955 года и будет проводить более ориентированную на религию правую программу."
 ISR_A_Jewish_Society: "Еврейское общество"
 ISR_A_Jewish_Society_desc: "Израиль - еврейское государство, и наша культура и ценности должны отражать это. Нам нужно продвигать более ориентированную на иудаизм программу, чтобы это произошло."
 ISR_Ban_Non_Kosher_Food: "Кошерный налог"
 ISR_Ban_Non_Kosher_Food_desc: "Кошерный налог будет представлять собой налог на некошерные продукты, чтобы стимулировать производство кошерных продуктов. Это безусловно шаг в морально правильном еврейском направлении, хотя светские партии будут против."
 ISR_Promote_Traditional_Culture: " Продвижение традиционной культуры"
 ISR_Promote_Traditional_Culture_desc: "Мы должны убедиться, что наша культура - еврейская, и такая, которая следует как можно большему числу из 613 заповедей Торы. Хотя это может показаться обратным для посторонних, это то что мы считаем правильным"
 ISR_National_Insurance_Act: "Закон о национальном страховании"
 ISR_National_Insurance_Act_desc: "Нам необходимо стандартизировать и улучшить страхование всех видов для наших граждан, так как сейчас цены на страхование разнятся, как и процентные ставки. Если так будет продолжаться, это окажет негативное влияние на нашу экономику"
 ISR_West_German_Reperations2: "Репарации Западной Германии"
 ISR_West_German_Reperations2_desc: ""
 ISR_Minimize_the_Histadrut: "Минимизировать роль Гистадрута"
 ISR_Minimize_the_Histadrut_desc: "Хотя Гистадрут не совсем бесполезен, он имеет слишком большое влияние и власть в экономике Израиля. Мы не избавимся от них полностью, но мы определенно уменьшим их роль"
 ISR_Hapoel_HaMizrachi_Victory: "Херут - победа религиозного альянса"
 ISR_Hapoel_HaMizrachi_Victory_desc: "В сочетании с Религиозным Альянсом националистическая партия Менахема Бегина 'Херут' победила на выборах 1951 года в Израиле. Что не является полной неожиданностью из-за их коалиции, это значительный отход от левоцентристской партийной линии Мапай."
 ISR_Promote_Religous_Educaitonal_Curriculum: " Продвижение религиозных учебных программ"
 ISR_Promote_Religous_Educaitonal_Curriculum_desc: "Мы должны улучшить нашу систему образования, это ясно, но мы также должны ввести в учебный план некоторые столь необходимые религиозные занятия."
 ISR_Encourage_Charity: "Поощрять благотворительность"
 ISR_Encourage_Charity_desc: "Благотворительность - или цдака на иврите - является важной частью еврейской веры и общества. Мы должны поощрять её не только с религиозной точки зрения, но и для решения наших проблем бедности."
 ISR_apolitical_Labour_Unions: "Аполитичные профсоюзы"
 ISR_apolitical_Labour_Unions_desc: "Слишком долго профсоюзы имели политическую роль и повестку дня. В нашем видении Израиля этому нет места. Нам нужно деполитизировать профсоюзы"
 ISR_Encourage_Aliyah: "Поощрять алию"
 ISR_Encourage_Aliyah_desc: "Алия, или еврейская иммиграция на землю Израиля, - это то, что мы должны поощрять. Это не только улучшит нашу экономику и кадровый резерв, но и ещё больше сплотит еврейскую нацию."
 ISR_Military_Expansion: "Военная экспансия"
 ISR_Military_Expansion_desc: "Частью поддержания еврейской нации является способность защитить себя от наших враждебных мусульманских соседей. Чтобы сделать это, нам нужно расширить наше военное присутствие"
 ISR_Shabbat_Laws: "Дополнительные запреты касающиеся Шаббата"
 ISR_Shabbat_Laws_desc: "Шаббат - еврейский день отдыха - является одним из самых важных еврейских понятий. Однако многие наши граждане нарушают принципы Торы, занимаясь в этот день бизнесом и другой светской деятельностью. Мы должны пресечь это"
 ISR_Support_Our_Settlers: " Поддержка сельских поселенцев"
 ISR_Support_Our_Settlers_desc: "Большая часть нашего населения живет не в городах, а на небольших фермах на севере и юге Израиля. Игнорировать их было бы почти преступно, и их поддержка принесет нам пользу в долгосрочной перспективе."
 ISR_Develop_Jerusalem: " Развитие Иерусалима"
 ISR_Develop_Jerusalem_desc: "Иерусалим несмотря на обширное строительство за последние 4 или 5 лет, все ещё недостаточно развит по современным стандартам. Нам нужно улучшить нашу столицу ради национальной гордости, если не более того."
 ISR_Increase_Agricultural_Subsidies: "Увеличить субсидии на сельское хозяйство"
 ISR_Increase_Agricultural_Subsidies_desc: "Сельское хозяйство является основой нашей экономики и всегда нуждается в дополнительном финансировании. Мы должны предоставлять субсидии нуждающимся фермерам. "
 ISR_Torah_and_State: "Тора и государство"
 ISR_Torah_and_State_desc: "Мы считаем, что Израиль должен следовать указаниям и принципам Торы, и что разделение Торы и государства должно быть как можно меньше. Чтобы достичь этого, мы должны расширить нашу религиозную политику."
 ISR_Condemn_Godless_Communism: "Осудить безбожный коммунизм"
 ISR_Condemn_Godless_Communism_desc: "Коммунизм - это одна из худших идей, когда-либо и кем-либо созданных. Он ужасен, и в дополнение ко всем своим проблемам он пропагандирует атеистическое государство, что является противоположностью того, что мы пытаемся сделать. Мы должны заставить людей осознать это"
 ISR_Expand_Welfare_Programs: " Расширить программы социального обеспечения"
 ISR_Expand_Welfare_Programs_desc: "В нашей стране много бедных людей, особенно ультра-ортодоксальных евреев и сельских фермеров. Расширяя программы социального обеспечения, мы можем попытаться изменить это"
 ISR_Encourage_Higher_Birthrates: "Поощрять более высокую рождаемость"
 ISR_Encourage_Higher_Birthrates_desc: "Повышение рождаемости абсолютно необходимо, если мы хотим продолжить рост нашего населения. Мы уже отстаем от наших более крупных соседей и не можем позволить, чтобы этот разрыв увеличился"
 ISR_Military_Service_As_A_Religous_Duty: "Приветствовать победы ЦАХАЛа"
 ISR_Military_Service_As_A_Religous_Duty_desc: "С самого начала существования ЦАХАЛа он не знает ничего, кроме побед. Это то, чем мы все можем гордиться, и это должно продолжаться. Л'Хаим!"
 ISR_To_the_Banks_of_the_Jordan: "К берегам Иордании"
 ISR_To_the_Banks_of_the_Jordan_desc: ""
 ISR_Herut_victory_1955: "Победа Херута"
 ISR_Herut_victory_1955_desc: "Херут выиграл выборы 1955 года и под руководством Менахема Бегина будет стремиться смягчить свою националистическую/ирредентистскую политику, сосредоточившись на внутреннем развитии."
 ISR_Land_reclamation_Projects: "Проекты рекультивации земель"
 ISR_Land_reclamation_Projects_desc: "Хотя уже было осуществлено несколько проектов рекультивации, включая болото Хула, есть ещё много других регионов, которые могли бы использовать такую же обработку, чтобы освободить место для ферм и семей."
 ISR_Herut_Victory: "Победа Херута"
 ISR_Herut_Victory_desc: "Националистическая партия Менахема Бегина 'Херут', которую никто не предвидел, победила на выборах в Израиле в 1951 году! Это почти наверняка означает резкий, радикальный сдвиг во внешней политике Израиля, социальной структуре и экономической системе. Что Бегин сделает первым?"
 ISR_Secularize_Israel: "Секуляризировать Израиль"
 ISR_Secularize_Israel_desc: ""
 ISR_Condemn_West_Germany_Deal: "Отклонить репарации Западной Германии"
 ISR_Condemn_West_Germany_Deal_desc: "Немцы пытаются расплатиться за кровь и зверства Холокоста финансовым пакетом? Это жестокая шутка или они просто настолько наивны? В любом случае, мы отказываемся хоронить память о наших погибших родственниках за деньги"
 ISR_Build_railways: " Строительство железных дорог"
 ISR_Build_railways_desc: "Нам необходимо улучшить связь между нашими странами, как для гражданских так и для военных целей. Строительство новых железных дорог по всей стране будет лучшим способом достичь этого."
 ISR_Refuse_recognize_Jordan: "Отказаться признать Иорданию"
 ISR_Refuse_recognize_Jordan_desc: "После кражи у нас Западного берега реки Иордан король Хусейн имел наглость изменить название своей страны с Транс-Иордании (находящейся через Иордан с запада) на Иорданию. Мы отказываемся признать что его претензии на нашу законную землю и наследие имеют какую-либо силу. Смерть королю-предателю!"
 ISR_Expand_israeli_Settlements: "Расширить израильские поселения"
 ISR_Expand_israeli_Settlements_desc: "Существует множество израильских поселений, будь то на севере или на юге, и большая часть нашего народа живет в этих отдаленных местах. Тем не менее, они являются важной частью нашей нации, и их нельзя игнорировать."
 ISR_Fund_Development_Projects: "Финансировать проекты развития"
 ISR_Fund_Development_Projects_desc: "Существует множество запланированных проектов в городах и сельской местности по всему Израилю, которым мешает только отсутствие капитала. Мы можем создать офис, который поможет решить эту проблему, распределяя средства на различные разработки."
 ISR_Raise_Living_Standards: "Повышение уровня жизни"
 ISR_Raise_Living_Standards_desc: "Хотя они и растут, уровень жизни в Израиле все ещё очень низок, если мы хотим называть себя современной страной, Мы должны изменить это, пока он не начал падать снова."
 ISR_Expand_Farms: "Расширить фермы"
 ISR_Expand_Farms_desc: "Фермы и сельскохозяйственные предприятия являются важнейшим звеном в нашей экономической системе, и мы не можем их игнорировать. Кроме того, увеличение поставок местных продуктов питания никогда не бывает плохой вещью."
 ISR_Tensions_with_arab_states: " Напряжение в отношениях с арабскими государствами"
 ISR_Tensions_with_arab_states_desc: "Из-за недавних инцидентов напряженность в отношениях со всеми нашими арабскими соседями растет. Хотя это прискорбно и досадно, это также неизбежно из-за их риторики и пропаганды."
 ISR_Subsidize_New_Settlements: "Подключить периферию к энергосистеме"
 ISR_Subsidize_New_Settlements_desc: "Многие израильские поселенцы всё ещё отключены от электросети, что является проблемой. Мы должны постараться изменить это и улучшить качество жизни наших граждан."
 ISR_Tax_cuts: "Управление денежными средствами"
 ISR_Tax_cuts_desc: "На данный момент мы находимся в относительно стабильной финансовой ситуации, поэтому мы можем сделать некоторые сокращения налогов, чтобы снять давление с наших людей и позволить им тратить деньги на себя."
 ISR_Emphasize_Brotherhood: "Подчёркивать братство"
 ISR_Emphasize_Brotherhood_desc: "Все евреи - братья, и всегда ими были. Это важная часть принципов Торы, и она ещё более важна сейчас, когда каждый из нас имеет решающее значение для выживания нашей нации."
 ISR_To_The_Banks_of_the_Jordan_River: "К берегам реки Иордан"
 ISR_To_The_Banks_of_the_Jordan_River_desc: ""
 ISR_Reclaim_Gaza: "Вернуть сектор Газа"
 ISR_Reclaim_Gaza_desc: ""
 ISR_Gazan_Settlements: "Поселения сектора Газа"
 ISR_Gazan_Settlements_desc: ""
 ISR_Settle_East_Jerusalem: " Поселения Восточного Иерусалима"
 ISR_Settle_East_Jerusalem_desc: ""
 ISR_Clashes_with_Syria: "Столкновения с Сирией"
 ISR_Clashes_with_Syria_desc: ""
 ISR_The_Power_of_the_Free_Markets: "Сила свободных рынков"
 ISR_The_Power_of_the_Free_Markets_desc: ""
 ISR_Appeal_to_America: "Обращение к Америке"
 ISR_Appeal_to_America_desc: "Америка похоже наш единственный союзник, и у нас есть как друзья в правительстве, так и гражданское население. Мы должны попытаться укрепить наши связи с США, чтобы у нас была мощная поддержка, когда придёт время войны."
 ISR_Condemn_Marxism: "Осудить марксизм"
 ISR_Condemn_Marxism_desc: "Марксизм, коммунизм, как бы он ни назывался - это плохо, это ужасная экономическая система и ещё худшая социальная структура. Мы должны надеяться, что наша нация никогда не подвергнется его тирании и отдаление от любой коммунистической нации поможет нам в этом отношении."
 ISR_Our_Own_Physicians: "Наши собственные физики"
 ISR_Our_Own_Physicians_desc: "Наши новые университеты выпускают очень способных учёных, среди которых есть несколько блестящих физиков. Это замечательная новость, так как она очень поможет нам в наших исследовательских начинаниях."
 ISR_Conquest_of_the_Desert: " Открытая ярмарка завоевания пустыни"
 ISR_Conquest_of_the_Desert_desc: "Большой регион нашей страны - Негев - в настоящее время почти необитаем. Однако, приложив значительные усилия по терраформированию и поливке земли, мы сможем покорить открытую пустыню, сделав её пригодной для сельского хозяйства и проживания."
 ISR_West_German_Repperation_Treaty: "Договор о репарациях Западной Германии"
 ISR_West_German_Repperation_Treaty_desc: "Мы решили принять репарации Западной Германии. Они говорят об этом из лучших побуждений, а мы находимся в отчаянном экономическом положении. Эти деньги нам очень помогут, даже если они даны нам, чтобы искупить вину за 6 миллионов человек."
 ISR_Found_the_Kibbutz_Metzer: "Найден кибуц Мецер"
 ISR_Found_the_Kibbutz_Metzer_desc: "Кибуц Мецер будет небольшой сельскохозяйственной деревней, расположенной почти на границе перемирия 1949 года, недалеко от Хайфы. Оно будет обеспечивать государство сельскохозяйственной продукцией и улучшит инфраструктуру в этом районе."
 ISR_A_Visit_From_the_US: "Визит из США"
 ISR_A_Visit_From_the_US_desc: "Соединенные Штаты направляют делегацию в нашу страну! Это важное событие, и мы должны постараться доказать, что мы будем достойным союзником на Ближнем Востоке."
 ISR_The_Kastner_Trial: "Судебный процесс над Кастнером"
 ISR_The_Kastner_Trial_desc: "Рудольф Кастнер, один из руководителей Будапештского комитета помощи и спасения (который тайно вывозил евреев из Германии во время Второй мировой войны), был обвинен в сотрудничестве с нацистами! Это смертельно серьёзное обвинение, и весь Израиль ожидает приговора с затаённым дыханием."
 ISR_Kfar_Qasim_Massacre: "Ввести комендантский час в арабских деревнях"
 ISR_Kfar_Qasim_Massacre_desc: "Чтобы попытаться уменьшить их способность объединяться в террористические группы, мы должны ввести строгий комендантский час в палестинских деревнях. Надеюсь, все останутся в безопасности"
 ISR_Expand_the_Railway_Systems: "Расширить железнодорожные системы"
 ISR_Expand_the_Railway_Systems_desc: "С завершением строительства центрального вокзала Тель-Авива Савидор, у нас теперь есть железнодорожный узел в масштабах страны, который можно использовать в своих интересах. Расширяя железнодорожные линии во всех направлениях, мы можем продолжать соединять нашу нацию"
 ISR_Establish_the_Holocaust_Remembrance_Day: "Учредить День памяти жертв Холокоста"
 ISR_Establish_the_Holocaust_Remembrance_Day_desc: "Прошло более 10 лет с момента одной из самых страшных национальных трагедий, постигших еврейский народ. Хотя это и болезненно, мы должны помнить о причинах и последствиях Холокоста, установив национальный день памяти."
 ISR_A_United_Israel: " Единый Израиль"
 ISR_A_United_Israel_desc: "Мы уже многого добились за месяцы, прошедшие после нашего прихода к власти. Однако впереди нас ждёт самая большая и трудная задача - защита от очередного арабского наступления, направленного на уничтожение еврейской нации. Мы должны быть едины, с одним сердцем и одним разумом, чтобы защитить нашу родину и будущее нашего народа."
 ISR_Seize_Sinai: "Готов ко всему"
 ISR_Seize_Sinai_desc: "С начала этого нового срока мы достигли очень многого. Мы укрепили нашу страну во всех областях, начиная с экономического потенциала, уровня инфраструктуры, общего морального духа и стабильности, и заканчивая отношениями с иностранными державами. Но давайте не забывать, что самые трудные испытания ещё впереди, и когда они начнутся, мы будем там, чтобы встретить их с головой. Яллах, Ачарай!"
 ISR_Operation_Elkayam: "Операция Элькаим"
 ISR_Operation_Elkayam_desc: "В ответ на постоянно растущее число террористических атак с территории Египта, Верховное командование армии санкционировало Операцию Элькаим, карательный рейд на форт Хан-Юнис на Синае. Удачи нашим солдатам!"
 ISR_Secret_French_Arms_Deal: " Тайная сделка по французскому оружию"
 ISR_Secret_French_Arms_Deal_desc: "Французы согласились продать нам большое количество военного оборудования, включая броню, стрелковое оружие и, самое главное, истребители. Это огромный успех для ЦАХАЛа"
 ISR_Operation_Samaria: "Операция Вулкан"
 ISR_Operation_Samaria_desc: "В ответ на египетскую блокаду Акабского залива, Верховное командование армии санкционировало атаку на территорию, окружающую египетские войска, поддерживающие её. Надеемся, что всё пройдет хорошо, и залив снова откроется"
 ISR_Embrace_The_Eisenhower_Doctrine: "Принять доктрину Эйзенхауэра"
 ISR_Embrace_The_Eisenhower_Doctrine_desc: "Президент Эйзенхауэр объявил Конгрессу о так называемой 'Доктрине Эйзенхауэра', которая гласит, что любая страна, находящаяся в опасности из-за коммунистической угрозы, может просить американскую помощь, как экономическую, так и военную. Мы конечно скоро будем ссылаться на это"
 ISR_Subway_Expansion: "Расширение метрополитена"
 ISR_Subway_Expansion_desc: "У нас есть технология и возможность расширить наши крошечные системы метро в больших городах нашей страны. Это должно улучшить транспортные проблемы и инфраструктуру за один раз."
 ISR_French_Nuclear_Aid: "Французская ядерная помощь"
 ISR_French_Nuclear_Aid_desc: "Французы продолжают помогать нашим ядерным исследованиям и разработкам, даже после согласия построить реактор в Димоне, Мы должны воспользоваться этим пока ещё можем."
 ISR_Social_Welfare_Service_Law: "Закон о службе социального обеспечения"
 ISR_Social_Welfare_Service_Law_desc: "С принятием закона о службе социального обеспечения, муниципалитеты и местные органы власти будут обязаны содержать отдел социального обеспечения и получать государственное финансирование для этого, чтобы расширить доступ к программам социального обеспечения."
 ISR_Begin_Merger_With_Maki: "Начать слияние с Маки"
 ISR_Begin_Merger_With_Maki_desc: ""
