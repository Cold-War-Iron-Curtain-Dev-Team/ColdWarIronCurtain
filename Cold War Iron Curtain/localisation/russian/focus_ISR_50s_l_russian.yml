 operationkadesh.1.d: "Синай получает кучу неприятных модификаторов, чтобы игрок не смог преодолеть его за 2 дня. У 1 государства модификаторы будут убраны на время, соответствующее историческому порядку операций."
 operationkadesh.2.d: "Кампания на Южном Синае, модификаторы снижены. Следующая фаза разблокируется, когда будет контролироваться штат 453. Также вы получите подразделение десантников в западном Синае"
 operationkadesh.3.d: "Кампания на Северном Синае. Следующая фаза откроется, когда будет контролироваться штат 805."
 operationkadesh.4.d: "Кампания в Газе. После этого ещё одно событие для операции Кадеш в качестве завершения"
 operationkadesh.5.d: "завершение операции Кадеш, все модификаторы удалены."
