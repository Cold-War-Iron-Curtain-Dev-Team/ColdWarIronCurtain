l_russian:
 TUR_1950_ELECTIONS.0.d:0 "Турецкая Республика проводит свои вторые многопартийные всеобщие выборы. Правящую Республиканскую партию, известную как НРП, возглавляет доверенное лицо Ататюрка Исмет Инону. Его партия обещает продолжение протекционистской экономики, управляемой государством. Во внешней политике республиканцы обещают сохранить суверенитет Турции, одновременно управляя все более опасной ситуацией в регионе. Демократическая партия, возглавляемая Аднаном Мендересом, хочет приватизировать и дать толчок турецкой экономике. Они также стремятся к более тесным связям с Западом, и некоторые из её членов верят в восстановление некоторых исламских практик при сохранении секуляризма. Среди многих турок есть ощущение, что, возможно, настало время дать шанс другой партии после десятилетий однопартийного правления НРП."
 TUR_1950_ELECTIONS.1.d:0 "Вопреки многим прогнозам, Республиканская партия (НРП) одержала победу на всеобщих выборах. Президент Исмет Инону останется у руля ещё на один срок. Говорят, что многие городские и либеральные турки расстроены результатом, и ходят слухи о вбросе бюллетеней. Демократическая партия также выразила свою обеспокоенность результатами. Несмотря на это, военные удовлетворены, поскольку многие офицеры с подозрением относились к Демократической партии, несмотря на их претензии к секуляризму и кемализму. Похоже, что традиционная военно-бюрократическая правящая элита прочно удерживается у власти. Международному сообществу кажется, что турецкий народ хочет сохранить свой политический и экономический путь."
 CHP_1950.1.d:0 "После выборов во время дебатов в Великом национальном собрании между правительством и оппозицией Демократической партии происходили резкие перепалки. Хотя Демократическая партия открыто не называет результаты выборов сфальсифицированными, очевидно, что они этого не отрицают, разжигая подозрения общественности, особенно в либеральных кругах. Правительство должно устранить эту напряженность, если оно хочет сохранить стабильность и выполнить свою законодательную программу. Руководители вооруженных сил и разведки предложили поговорить наедине с лидерами оппозиции и активистами, ставящими под сомнение результаты. Однако некоторые в НРП считают, что было бы лучше просто провести прямые переговоры с высокопоставленными лидерами оппозиции."
 CHP_1950.2.d:0 "Военные и разведывательные операции по приведению оппозиции в соответствие увенчались оглушительным успехом. Благодаря принуждению, угрозам и подаркам многие лидеры оппозиции теперь гораздо более сговорчивы и хранят молчание по вопросу фальсификации выборов. С активистами, особенно в университетских городках, поступили аналогичным образом, правительство теперь может более гладко проводить свою законодательную программу. Высокопоставленных лидеров НРП намеренно держали в неведении относительно того, что именно было сделано, чтобы заставить оппозицию сговориться."
 CHP_1950.3.d:0 "Попытки военных и оппозиции добиться большего сотрудничества и положить конец обсуждениям фальсификаций на выборах среди оппозиции Демократической партии привели к обратным результатам. Быстро распространились слухи о том, что лидеров оппозиции ночью доставляют на военные базы или встречают с влиятельными офицерами разведки. Эта вопиющая попытка контролировать оппозицию широко известна и только придала смелости оппозиции в Великом национальном собрании. Ее члены больше не боятся репрессий, поскольку НРП не может рисковать и предпринимать действия, не спровоцировав общественный пыл или даже широкомасштабные протесты."
 CHP_1950.4.d:0 "Недавно НРП завершила переговоры с руководством Демократической партии по поводу текущей напряженности и проблем в Великом национальном собрании. Состоялся откровенный обмен мнениями, и мы смогли предложить оппозиции некоторые гарантии относительно определенных процедур и законодательства. В свою очередь, оппозиция заявила, что запретит своим членам встречаться с теми, кто считает, что выборы были сфальсифицированы в пользу правительства, или поощрять их."
 CHP_1950.5.d:0 "Недавно НРП завершила переговоры с руководством Демократической партии по поводу текущей напряженности и проблем в Великом национальном собрании. Состоялся откровенный обмен мнениями, но в конечном итоге они не привели к какому-либо прорыву. Оппозиция расценила переговоры как признак слабости правительства и выдвинула определенные требования к законодательству. Попытки найти компромисс в обмен на помощь оппозиции в пресечении слухов о фальсификации выборов провалились, поскольку оппозиция заявила, что никто из её членов не причастен к таким слухам. Мы можем ожидать более решительной оппозиции в Ассамблее."
 TUR_1950_ELECTIONS.2.d:0 "Демократическая партия одержала убедительную победу на выборах. Президент Турции Исмет Инону уже пообещал мирную передачу власти, положив конец слухам о военном перевороте или восстании, спонсируемом НРП. Ожидается, что Аднан Мендерес возглавит партию и правительство в качестве премьер-министра, оставив пост президента Джелалу Байяру. Новое правительство привносит в свой состав коммерческих лидеров и бизнесменов, распространяя политическую власть за пределы традиционной бюрократическо-военной базы. Военные, вероятно, будут относиться к правительству с подозрением, поскольку оно обещает ускорить экономическое развитие Турции за счет приватизации и иностранной наличности."
 DP_1950.1.d:0 "Премьер-министр Турции недавно прибыл в Соединенные Штаты для проведения переговоров с американским правительством. Соединенные Штаты придают приоритетное значение отношениям с Турцией и рассматривают её как ключевое передовое государство глобального капитализма. У турецкого правительства есть свои собственные цели, правящая Демократическая партия пообещала стимулировать экономический рост посредством свободной рыночной экономики. Военные просят, чтобы мы попросили больше военной помощи, в то время как политические советники хотят больше экономической помощи, чтобы способствовать ускорению экономического роста. Другой вариант - запросить военный и экономический пакет, хотя в этом случае помощь была бы более ограниченной."
 DP_1950.2.d:0 "Премьер-министр Турции находится с визитом в Соединенных Штатах и запросил у нашего правительства дополнительную военную помощь. В частности, турецкая армия хотела бы получить больше пехотной техники для модернизации своих сил. Пентагон считает, что может удовлетворить запрос, а Госдепартамент считает, что такая поддержка укрепила бы турецкое правительство внутри страны. Что ещё более важно, это продемонстрировало бы близость наших связей и показало, как наше правительство поддерживает тех, кто непосредственно сталкивается с коммунистической угрозой. Однако в Белом доме есть люди, которые ставят под сомнение необходимость предоставления такого большого объема помощи стране, которую мы и так активно поддерживаем."
 DP_1950.3.d:0 "Премьер-министр Турции находится с визитом в Соединенных Штатах и запросил дополнительную экономическую помощь от нашего правительства. В частности, премьер-министр Турции хотел бы получить приток наличных денег для активизации усилий правительства по преобразованию Турции в свободную рыночную экономику. Госдепартамент считает, что такая поддержка укрепила бы турецкое правительство внутри страны. Что ещё более важно, это продемонстрировало бы близость наших связей и показало, как наше правительство поддерживает тех, кто непосредственно сталкивается с коммунистической угрозой. Однако в Белом доме есть люди, которые ставят под сомнение приток наличных денег, особенно учитывая опасения, что это может способствовать разжиганию инфляционного кризиса."
 DP_1950.4.d:0 "Премьер-министр Турции находится с визитом в Соединенных Штатах и запросил у нашего правительства дополнительную военную помощь. В частности, турецкая армия хотела бы получить больше пехотной техники для модернизации своих сил. Пентагон считает, что может удовлетворить запрос, а Госдепартамент считает, что такая поддержка укрепила бы турецкое правительство внутри страны. Что ещё более важно, это продемонстрировало бы близость наших связей и показало, как наше правительство поддерживает тех, кто непосредственно сталкивается с коммунистической угрозой. Однако в Белом доме есть люди, которые ставят под сомнение необходимость предоставления такого большого объема помощи стране, которую мы и так активно поддерживаем."
 DP_1950.5.d:0 "Недавняя поездка в Соединенные Штаты была неудачной для премьер-министра Турции. Хотя обе стороны договорились продолжать налаживать отношения, нового соглашения о дальнейшей помощи достигнуто не было. Это подрывает заявления правительства о том, что оно могло бы расширить связи с Америкой в интересах Турции. Говорят, что военные расстроены, а министр финансов предупреждает, что отсутствие соглашения повышает неопределенность на рынке. Соединенные Штаты по-прежнему очень заинтересованы в своих связях с Турцией, но у них явно есть предел тому, что они могут предоставить."
 DP_1950.6.d:0 "Приток иностранной наличности, государственные расходы и денежные средства, полученные в результате приватизации, привели к росту инфляции и вызывают опасения по поводу перегрева экономики. Некоторые экономические консультанты предупреждают, что текущие темпы приватизации и приток правительством наличных денег для стимулирования рынка могут привести к серьезным проблемам в будущем. Они предлагают нам начать структурные реформы и остудить ситуацию. Однако у нас есть другие экономисты, которые утверждают, что замедление сейчас нанесет ущерб экономическому росту, и мы должны продолжать наши расходы, поскольку страна находится на пороге резкого экономического роста."
 TUR_1950_ELECTIONS.3.d:0 "Турецкая Республика проводит всеобщие выборы. Народ должен выбрать между Республиканской партией (НРП) или Демократической партией (ДП). НРП обещает продолжать протекционистское, управляемое государством развитие наряду с твердой приверженностью традиционным республиканским ценностям, таким как секуляризм и кемализм. ДП обещает содействовать приватизации и использовать государственное финансирование для стимулирования свободной рыночной экономики. Она также верит в приверженность секуляризму. ДП также желает расширить международное присутствие Турции и расширить связи с Западом. Говорят, что могущественные военные с подозрением относятся к ДП, поскольку в её состав входят предполагаемые исламисты и экономические элиты, которые угрожают могущественной бюрократическо-военной элите. НРП правит десятилетиями, и многие наблюдатели полагают, что турецкий народ может склониться к ДП, но это ещё предстоит выяснить."
 TUR_1950_ELECTIONS.4.d:0 "Вопреки многим предвыборным прогнозам, Республиканская партия (НРП) одержала уверенную победу на недавних выборах. Ее руководство рассматривает победу как доказательство того, что турецкий народ не готов резко отходить от видения и экономической политики ранней республики. Военные особенно взволнованы, поскольку многие лидеры НРП - бывшие офицеры. Говорят, что оппозиция в ярости и в частном порядке обвиняет НРП в фальсификации выборов, но они не могут открыто выразить свое недовольство, не рискуя столкнуться с юридическими проблемами. Однако слухи, которые они распространяют, вызовут подозрения, особенно в либеральных кругах и университетских городках. Несмотря ни на что, НРП надеется реализовать свое видение Турецкой республики."
 CHP_1954.1.d:0 "Недавние выборы вызвали недовольство среди общественности и оппозиции тем, что выборы были сфальсифицированы или манипулировались либо НРП, либо военными. Оппозиция использует тактику затягивания и отравляет атмосферу в Великом национальном собрании, делая усилия по принятию законодательства трудоемкими или неприятными. Некоторые из наших членов обратились к оппозиции, и они проявили интерес к предложению о создании комитета для изучения избирательных реформ. Они не стали бы комментировать или обсуждать предыдущие выборы, а просто предложили бы предложения по обеспечению большей прозрачности в будущем. Мы могли бы поддержать такой комитет и снизить напряженность, или мы могли бы принять предложение военных о сотрудничестве в частном порядке."
 CHP_1954.2.d:0 "Объединенный комитет представил Великому национальному собранию свой доклад о реформировании избирательного процесса для повышения прозрачности. Его авторы отмечают, что, по их мнению, ни на каких предыдущих выборах не было проблем, но отметили, что его рекомендации ослабят любые опасения избирателей и более упростят процесс голосования. Ожидается, что законодательный орган примет рекомендации в ближайшие недели. Многие наблюдатели расценивают это как большой успех правительства и будет иметь большое значение для ослабления напряженности в отношениях с оппозицией."
 CHP_1954.3.d:0 "Напряженность и препирательства в Великом национальном собрании заметно снизились за последние недели. Лидеры оппозиции придержали языки, и те, кто в частном порядке распространял слухи о фальсификации последних выборов, теперь открыто заявляют, что выборы были честными. Похоже, военные проделали хорошую работу, поговорив с оппозицией и успокоив ее. Правительство не запрашивало подробностей, но ходят слухи о взятках, принуждении и шантаже, используемых против оппозиции. Надеюсь, правительство получит более продуктивную законодательную повестку дня."
 CHP_1954.4.d:0 "Существует общественный резонанс и ободренная оппозиция в Великом национальном собрании. Некоторые представители оппозиции низкого уровня сообщили, что военные чиновники обращались к ним с просьбой оказать большую поддержку правительству. Как только они выступили вперед, к ним присоединились другие члены оппозиции, утверждая, что они сталкивались с угрозами или предложениями наличных денег, чтобы быть более сговорчивыми. Правительство отрицает какую-либо причастность, а военные утверждают, что некоторые из его членов, возможно, действовали вопреки действующим приказам. Как бы то ни было, это разоблачение ослабляет правительство, укрепляет оппозицию и придает уверенности тем, кто обвиняет НРП в фальсификации последних выборов военными."
 CHP_1954.5.d:0 "С 1945 года в Турцию наблюдался значительный приток наличных из-за рубежа, либо в виде инвестиций, либо международной помощи. Турецкое правительство время от времени выделяло собственные денежные средства на поддержку экономического развития и инфраструктурных проектов. Министр финансов считает, что экономика не в состоянии поглощать и рискует утонуть. Он предлагает правительству провести бюджетные реформы и принять меры по ограничению расходов, даже ценой немедленного роста. Однако некоторые другие наши экономические советники и наши политические консультанты считают, что такой сдвиг вызовет неоправданные трудности для турецкого народа и что риски, вероятно, преувеличены."
 TUR_1950_ELECTIONS.5.d:0 "Демократическая партия одержала победу на выборах 1954 года. Ожидается, что лидер партии Аднан Мендерес возглавит правительство в качестве премьер-министра, оставив пост президента Джелалу Байяру. Демократическая партия обещает свободную рыночную экономику и приватизацию для стимулирования экономического роста. Однако она захватывает экономику, в которой уже наблюдается высокая инфляция. Кроме того, Демократическая партия должна бороться с военными, которые с подозрением относятся к её намерениям, и с угрозой того, что традиционные политические элиты будут сопротивляться партии, приводящей к власти коммерческие, сельскохозяйственные и промышленные элиты."
 DP_1954.1.d:0 "Министр финансов сообщает, что текущие резервы наличности опасно малы. Он ссылается на продолжающееся вливание наличности правительством для стимулирования роста и сокращение иностранного капитала для поддержания текущей экономической ситуации. Министр рекомендует ограничить расходы и фискальные меры, чтобы взять инфляцию под контроль для долгосрочной стабильности. Однако некоторые другие экономические и политические советники предупреждают, что такие действия могут нанести ущерб экономике и дорого обойтись нам на следующих выборах."
 TUR_1950_ELECTIONS.6.d:0 "Тут не было текста"
 TUR_1950_ELECTIONS.7.d:0 "Республиканская партия (РНП) победила Демократическую партию (ДП) на недавних всеобщих выборах. Победа подтверждает стремление турок сохранить лидерство и политику, которыми тщательно руководствовалась нация в первые годы существования республики. Говорят, что военно-бюрократическая элита в значительной степени удовлетворена результатом. Однако, говорят, что оппозиция и либеральные круги разочарованы результатами. Говорят, что многие турки все больше разочаровываются тем, что они видят в многочисленной, неэффективной военной и бюрократической элите. НРП обещает поддерживать тщательно контролируемую экономику. Левое крыло ДП сейчас набирает все больше позиций. Похоже, что партии необходим сдвиг влево, если она сможет победить НРП в будущем."
 CHP_1957.1.d:0 "Министр финансов предложил нам немного снизить тарифы. Это будет означать изменение политики правительства, которое поддерживало высокие тарифы для стимулирования внутреннего производства. Однако министр предполагает, что тарифы фактически наказывают местную промышленность и сдерживают потенциальный рост. Снижение тарифов подстегнет рост экономики и сохранит инфляцию управляемой. Другие экономические и политические консультанты предупреждают правительство не снижать тарифы, поскольку это противоречит правительственной программе. Правительство должно принять решение о снижении тарифов или их сохранении."
 CHP_1957.2.d:0 "Среди сторонников Демократической партии наблюдается тревожный поворот в сторону социализма и левых сил. Они все больше разочаровываются в правительстве и его зависимости от традиционных элит и вооруженных сил. Они также стремятся к осуществлению социалистической политики и расширению политического класса. Это является серьезной угрозой кемалистскому порядку и принципам, на которых была основана республика. Военные и разведывательные службы хотели бы провести операции по обезглавливанию растущего социалистического движения и задержанию его лидеров. Однако такие действия могут в конечном итоге только разозлить социалистов. Другой вариант - оставить социалистов в покое и бросить им вызов на выборах, что может подорвать их веру в автократичность правительства."
 CHP_1957.3.d:0 "Военная и разведывательная операция по аресту социалистических лидеров и агитаторов увенчалась крупным успехом. Активность социалистов снижается, особенно в университетских городках. Правительство в частном порядке аплодирует этим действиям, в то время как публично отказывается комментировать слухи о репрессиях. Похоже, решение стратегически нацелиться на этих агитаторов было успешным. Турция будет защищена от социалистического бедствия, которое является первым шагом к коммунизму и вытекающему из него тоталитаризму."
 CHP_1957.4.d:0 "Недавние операции военных и разведки по задержанию социалистических лидеров и пресечению их активности привели к обратным результатам. Похоже, студенты университета поняли, что происходит, во время одной попытки ареста, что привело к публичному инциденту с участием студентов и солдат. На следующий день вспыхнули протесты, к которым присоединились другие кампусы, что привело к неловкой ситуации для правительства. Многие из задержанных были быстро освобождены, но их не убедили смягчить свою деятельность. Сообщения указывают на то, что все больше сторонников Демократической партии в настоящее время обращаются к социализму, и растет разочарование в том, что многие сейчас рассматривают как политическую структуру из двух центристских партий."
 TUR_1950_ELECTIONS.8.d:0 "Демократическая партия победила на выборах 1957 года. Ожидается, что лидер партии Аднан Мендерес возглавит правительство в качестве премьер-министра, оставив пост президента Джелалу Байяру. Демократическая партия обещает свободную рыночную экономику и приватизацию для стимулирования экономического роста. Однако она захватывает экономику, в которой уже наблюдается высокая инфляция. Кроме того, Демократическая партия должна бороться с военными, которые с подозрением относятся к её намерениям, и с угрозой того, что традиционные политические элиты будут сопротивляться партии, приводящей к власти коммерческие, сельскохозяйственные и промышленные элиты. Демократическая партия также признает традиционную элиту и её контроль над средствами массовой информации, необходимо приложить усилия для подавления враждебной внутренней пропаганды."
 DP_1957.1.d:0 "Оппозиция и их союзники в средствах массовой информации в настоящее время открыто поощряют беспорядки и восстание против правительства. Министр внутренних дел предполагает, что эти усилия направлены на то, чтобы спровоцировать волнения среди кемалистов с целью содействия военному перевороту. Некоторые из наших министров считают, что сейчас настало время призвать армию подчиняться правительству и помочь навести порядок, а также закрыть СМИ, нарушающие закон. Однако некоторые министры считают, что заговор звучит надуманно, и обращение армии к целевым группам, которые она считает союзниками, на самом деле может подтолкнуть военных ближе к принятию мер против правительства."
 TUR_FOR.1.d:0 "После арабо-израильской войны Ближний Восток оказался в щекотливом положении. Мы являемся одной из немногих стран, имеющих дипломатические контакты с израильтянами, и это принесло пользу нашему правительству. Однако это не устраивает более набожных турецких мусульман, и существует давление с целью расширения связей с другими мусульманскими государствами. И это несмотря на наши усилия преуменьшить значение контактов с Израилем. Министерство иностранных дел считает, что мы можем расширить ранние, многообещающие связи с Израилем, создав представительство, а также стремясь к дружбе с крупнейшими арабскими державами. Другим вариантом могло бы стать прекращение зарождающихся связей с Израилем и полный поворот к арабам."
 TUR_FOR.2.d:0 "Правительство Турции недавно обратилось с просьбой о нормализации связей и культурных обменов. Очевидно, они хотят возродить старые братские узы, сложившиеся за столетия османского владычества. Тем не менее, они поддерживают отношения с израильтянами, и сообщения указывают на то, что эти отношения только расширяются. Многие из наших официальных лиц считают, что мы должны отклонить запрос Турции в знак солидарности и дать понять, что помощь врагу арабов не будет оценена по достоинству. Другие официальные лица считают, что мы должны наладить связи, чтобы ограничить влияние Израиля и в конечном итоге убедить их."
 TUR_FOR.3.d:0 "Египетское правительство отклонило нашу просьбу о расширении двусторонних связей и поощрении культурных обменов. Египтянам было ясно, что это связано с нашими связями с израильтянами. Это дипломатическая неудача, препятствующая нашим усилиям убедить турецкий народ в том, что мы можем поддерживать позитивные отношения с мусульманскими государствами, одновременно поддерживая связи с Израилем. Египетские СМИ, открыто осуждающие наши контакты с Израилем, также вызывают сожаление, поскольку они разоблачают наше преуменьшение таких отношений перед турецкой общественностью."
 TUR_FOR.4.d:0 "Правительство Саудовской Аравии отклонило нашу просьбу о расширении двусторонних связей и поощрении культурных обменов. Саудовцам было ясно, что это связано с нашими связями с израильтянами. Это дипломатическая неудача, препятствующая нашим усилиям убедить турецкий народ в том, что мы можем поддерживать позитивные отношения с мусульманскими государствами, одновременно поддерживая связи с Израилем. Саудовские СМИ, открыто осуждающие наши контакты с Израилем, также вызывают сожаление, поскольку они разоблачают наше преуменьшение таких отношений перед турецкой общественностью."
 TUR_FOR.5.d:0 "Иракское правительство отклонило нашу просьбу о расширении двусторонних связей и поощрении культурных обменов. Иракцам было ясно, что это связано с нашими связями с израильтянами. Это дипломатическая неудача, препятствующая нашим усилиям убедить турецкий народ в том, что мы можем поддерживать позитивные отношения с мусульманскими государствами, одновременно поддерживая связи с Израилем. Иракские СМИ, открыто осуждающие наши контакты с Израилем, также вызывают сожаление, поскольку они разоблачают наше преуменьшение таких отношений перед турецкой общественностью."
 TUR_FOR.6.d:0 "Сирийское правительство отклонило нашу просьбу о расширении двусторонних связей и поощрении культурных обменов. Сирийцам было ясно, что это связано с нашими связями с израильтянами. Это дипломатическая неудача, препятствующая нашим усилиям убедить турецкий народ в том, что мы можем поддерживать позитивные отношения с мусульманскими государствами, одновременно поддерживая связи с Израилем. Сирийские СМИ, открыто осуждающие наши контакты с Израилем, также вызывают сожаление, поскольку они разоблачают наше преуменьшение таких отношений перед турецкой общественностью."
 TUR_FOR.7.d:0 "Правительство Египта приняло нашу просьбу о расширении двусторонних связей и культурных обменов. Египтяне согласились с нами в важности сохранения исторических контактов между нашими народами. Египтяне действительно выразили свое неодобрение нашим связям с Израилем, но пока мы продолжаем преуменьшать это, они не будут поднимать эту тему. Турецкий народ будет удовлетворен этой новостью. Министерство иностранных дел мастерски уравновешивает наши связи в регионе."
 TUR_FOR.8.d:0 "Правительство Саудовской Аравии приняло нашу просьбу о расширении двусторонних связей и культурных обменов. Саудовцы согласились с нами в важности сохранения исторических контактов между нашими народами. Саудовцы действительно выразили свое неодобрение нашим связям с Израилем, но пока мы продолжаем преуменьшать это, они не будут поднимать эту тему. Турецкий народ будет удовлетворен этой новостью. Министерство иностранных дел мастерски уравновешивает наши связи в регионе."
 TUR_FOR.9.d:0 "Иракское правительство приняло нашу просьбу о расширении двусторонних связей и культурных обменов. Иракцы согласились с нами в важности сохранения исторических контактов между нашими народами. Иракцы действительно выразили свое неодобрение нашим связям с Израилем, но до тех пор, пока мы будем продолжать преуменьшать это, они не будут поднимать эту тему. Турецкий народ будет удовлетворен этой новостью. Министерство иностранных дел мастерски уравновешивает наши связи в регионе."
 TUR_FOR.10.d:0 "Сирийское правительство приняло нашу просьбу о расширении двусторонних связей и культурных обменов. Сирийцы согласились с нами в важности сохранения исторических контактов между нашими народами. Сирийцы действительно выразили свое неодобрение нашим связям с Израилем, но пока мы продолжаем преуменьшать это, они не будут поднимать эту тему. Турецкий народ будет удовлетворен этой новостью. Министерство иностранных дел мастерски уравновешивает наши связи в регионе."
 TUR_FOR.11.d:0 "Израильское правительство недавно пригласило нас присоединиться к Периферийному пакту. Это были бы более глубокие стратегические отношения между нашими правительствами. Они утверждали, что такие отношения будут сохраняться в тайне, чтобы не настраивать против себя наше мусульманское население, и обещают экономическое и военное сотрудничество. Израильтяне стремятся расширить связи с неарабскими мусульманскими государствами региона, чтобы стать противовесом своим арабским оппонентам. Такие тайные отношения могли бы принести много пользы, но их раскрытие вызвало бы негативную реакцию общественности."
 TUR_FOR.12.d:0 "Турецкое правительство согласилось присоединиться к Периферийному пакту. Это крупная внешнеполитическая победа, поскольку Турция, вероятно, является самым могущественным неарабским мусульманским государством в регионе. Турки рассчитывают на более глубокое экономическое и военное сотрудничество. При поддержке Турции, пусть даже скрытой, мы гораздо менее изолированы, чем раньше, и со временем потенциально можем развить отношения до такой степени, что возникнет сильная северная угроза арабским государствам, объединившимся против нас."
 TUR_FOR.13.d:0 "Турецкое правительство отклонило предложение присоединиться к Периферийному пакту. Несмотря на секретность, турков, по-видимому, не устраивают последствия, если их отношения станут достоянием общественности. Хотя ясно, что Турция не стремится разорвать связи, это серьезный удар по нашим планам. Периферийный пакт направлен на противодействие арабской коалиции путем объединения нас с неарабскими мусульманскими государствами региона. Это разрушит их попытки изолировать нас на международном уровне."
 TUR_FOR.14.d:0 "В рамках новой региональной политики Турция объявила, что отменит свое признание Израиля. Запланированное создание постоянной дипломатической миссии в стране будет отменено, и все граждане Турции, находящиеся в Израиле, должны немедленно вернуться домой. Говорят, что израильское правительство весьма шокировано таким поворотом событий, а некоторые израильские политики обвиняют влияние антисемитов в Анкаре. Во всем арабском мире новость получила широкую поддержку. Газеты восхваляют Турцию за то, что она снова встала на сторону арабов. Некоторые редакционные статьи в Турции утверждают, что это решение знаменует собой восстановление братских связей между турками и арабами."
 TUR_FOR.15.d:0 "У нас долгая, неспокойная история с греками, растянувшаяся на столетия. В последние десятилетия этот конфликт едва не привел к гибели нашей нации. Они ковырялись в умирающем остове Османской империи, а затем попытались задушить нашу республику в колыбели. Мы выстояли и преодолели эти трудности. Несмотря на затишье в прямых боевых действиях, напряженность сохраняется, и, учитывая вызовы, с которыми мы сталкиваемся на нашем востоке, и хаос на Ближнем Востоке, напряженность в отношениях с Грецией может привести к будущей катастрофе. Есть те, кто хочет взаимодействовать с правительством Греции и предложить ряд мер укрепления доверия для снижения напряженности. Это укрепило бы наши ресурсы для более эффективного решения множества проблем безопасности, стоящих перед нашей страной."
 TUR_FOR.16.d:0 "Турецкое правительство желает участвовать в переговорах на высоком уровне. Они признают, что у нас обоих есть разногласия по ряду вопросов, но хотят завершить ряд мер по укреплению доверия. Это включало бы облегчение возможностей для торговли, культурных обменов, студенческих программ и переговоров между военными. Это интригующее предложение, ситуация на нашем севере остается неопределенной, особенно после последней войны. Нормализация турецких отношений могла бы принести облегчение. Однако есть те, кто выступает против проведения переговоров, они считают, что это уловка Турции продолжать удерживать греческую территорию в заложниках, пожиная плоды двусторонних отношений."
 TUR_FOR.17.d:0 "В Афинах был подписан ряд соглашений между Грецией и Турцией. Турецкая делегация высокого уровня прибыла несколькими днями ранее и выразила большое удовлетворение результатами. Обе стороны пообещали развивать отношения, торговлю и контакты. Состоится ряд культурных обменов, экономических миссий, переговоров между военными и расширенных торговых возможностей. Хотя некоторые в обеих странах будут разочарованы тем, что ни одна из сторон, похоже, не проявила желания настаивать на каких-либо исторических или территориальных претензиях, ожидается, что большинство поддержит эти усилия по снижению напряженности."
 TUR_CYPRUS.1.d:0 "Ситуация на Кипре продолжает ухудшаться. Греческие экстремисты открыто нападают на британцев и ни в чем не повинных турок на острове. Турецкий народ следит за ситуацией с растущей озабоченностью, поскольку ясно, что греки планируют захватить остров и добиваться объединения с Грецией. Такой сценарий привел бы к новому витку этнических чисток на острове, что неприемлемо. Турция должна взаимодействовать с турками на острове и определить, как помочь."
 TUR_CYPRUS.2.d:0 "Недавно был подписан Договор о гарантиях между Турцией, Соединенным Королевством, Грецией и Кипром. Договор устанавливает независимое, демократическое кипрское государство. Оно должно сохранить свою конституцию и сбалансировать власть между греческим и турецким населением острова. Если какая-либо сторона выйдет из соглашения, любая из подписавших сторон может в одностороннем порядке вмешаться только для восстановления договора. Нам разрешено содержать небольшой гарнизон на острове для защиты турецкого населения. Мы должны решить, насколько активным будет гарнизон. Мы можем сохранять пассивную позицию, по сути, имея возможность вмешаться только в том случае, если турецкое население подвергается риску нападения. Или мы можем действовать на опережение и тщательно собирать разведданные и быть в состоянии вмешаться, если конституция будет изменена."
 TUR_CYPRUS.3.d:0 "Греки-киприоты значительно обострили кризис, захватив контроль над островом и провозгласив энозис (объединение) с Грецией. Турки-киприоты в панике и требуют быстрого турецкого вмешательства. По всей Турции СМИ и толпы людей призывают правительство действовать. У военных есть план быстрого развертывания сил для обеспечения безопасности турецкой части острова и защиты их от риска этнических чисток. Такие действия, вероятно, спровоцируют ответную реакцию Греции, которая может привести к войне. Соединенные Штаты также могут отнестись к ситуации неблагоприятно. Однако невмешательство привело бы к уничтожению кипрско-турецкого населения и гневу народа."
 TUR_ARAB.1.d:0 "Образование Объединенной Арабской Республики (ОАР) несет угрозу арабского национализма к нашей границе. Хатай уже давно является предметом вожделения Сирии и арабов региона, которые рассматривают его как последнюю оккупированную турцией арабскую землю. Генеральный штаб разработал план активного противодействия этой угрозе. Мы можем выслушать их предложение и принять решение о принятии мер. Однако многие в правительстве считают, что ОАР гораздо больше сосредоточена на израильском конфликте, и единственный способ, которым Хатай станет проблемой, - это если мы обострим ситуацию."
 TUR_ARAB.2.d:0 "Турецкие военные представили правительству предложение относительно Объединенной Арабской Республики (ОАР). Военные заявляют, что у них есть информация о том, что неарабское население на севере Сирии обеспокоено ростом арабского национализма. Было бы нетрудно организовать пограничное столкновение, которое перерастет в конфликт. Военные считают, что могут быстро захватить территорию и создать буферную зону на севере Сирии. Это рискованная операция, но она может обеспечить защиту Хатая. Однако некоторые высокопоставленные чиновники более осторожны и считают, что лучший способ противостоять потенциальной угрозе арабских националистов - это нормализовать отношения с ОАР."
 TUR_ARAB.3.d:0 "В крупном соглашении Турция и Объединенная Арабская Республика (ОАР) договорились нормализовать отношения и наладить культурные обмены. Оба правительства подчеркнули, что любые слухи о недоверии или напряженности раздуты. Это событие приветствуется во всем регионе и придает большую легитимность ОАР. Опасения турецких чиновников по поводу того, что ОАР будет настаивать на Хатае, похоже, утихли."
 TUR_ARAB.4.d:0 "Турецкие военные нанесли поражение Объединенной Арабской Республике (ОАР) вдоль их северной границы. Турецкие военные в значительной степени контролируют север Сирии. Конфликт начался после того, как пограничный конфликт перерос в полномасштабную пограничную войну. ОАР оказалась неподготовленной и не смогла отразить турецкое вторжение. Хотя Турция утверждает, что отреагировала на агрессию ОАР, ОАР утверждает, что Турция начала неспровоцированное вторжение. Говорят, что силы ОАР пытаются реорганизоваться, поскольку опасаются дальнейших нападений, поскольку Турция, похоже, контролирует ситуацию."
 TUR_ARAB.5.d:0 "Объединенная Арабская Республика (ОАР) объявила о победе в пограничном конфликте с Турцией. Боевые действия начались после того, как пограничное столкновение переросло в более масштабную пограничную войну. ОАР настаивает, что её войска были атакованы первыми, и они старательно ответили. Турецкое правительство утверждает, что жертвами стали его войска. Опасения, что ОАР может попытаться контратаковать и прекратить наступление на Хатай, не оправдались. Соединенные Штаты открыто предупредили ОАР о таких действиях. Это серьезная неудача для турецких вооруженных сил."
 TUR_ARAB.6.d:0 "Наши военные успешно создали буферную зону на севере Сирии. Командиры уверены в себе и воодушевлены своим успехом. Генеральный штаб сейчас предлагает полномасштабное наступление на САР. Если мы сможем покончить с Дамаском, мы сможем разрушить арабское националистическое государство и установить дружественный режим в Сирии. Это гарантировало бы защиту Хатая. Однако эскалация конфликта может привести к непредвиденным последствиям, и многие официальные лица считают, что мы должны удовлетвориться буферной зоной."
 TUR_ARAB.7.d:0 "Поскольку Объединенная Арабская Республика больше не представляет угрозы, усиливается давление, особенно в регионе, требующее вывода наших войск с севера Сирии. Это было бы желанной поддержкой новому режиму, и мы могли бы заключить пакт о ненападении, гарантирующий защиту Хатая. Военные, однако, считают, что мы должны сохранить контроль над северной Сирией и начать интеграцию территории. Они указывают на то, что если сирийцы вернутся, они могут отомстить неарабским группировкам, которые приветствовали наши силы. Однако продолжение оккупации, скорее всего, приведет к беспорядкам в арабских странах и даже вооруженному сопротивлению нашим силам."
 TUR_ARAB.8.d:0 "Турецкое правительство объявило, что его войска вторгаются в Сирию, чтобы освободить её от египетской оккупации. Объединенная Арабская Республика (ОАР) осудила это вторжение, заявив, что арабский народ даст отпор османской агрессии. В Дамаске раздаются призывы к людям присоединиться к военным усилиям и защитить эту попытку уничтожить объединенное арабское государство. Действия Турции осуждаются во всем арабском мире."
 TUR_ARAB.9.d:0 "После месяца боевых действий было объявлено о прекращении огня Организацией Объединенных Наций, чтобы положить конец боевым действиям между Турцией и Объединенной Арабской Республикой (ОАР). Обе стороны заявляют о победе, но как только пыль уляжется, станет ясно, что произошло. Организация Объединенных Наций неустанно работала, как только начался конфликт, чтобы быстро положить ему конец. Турецкое правительство начало войну, чтобы восстановить сирийский режим и разрушить ОАР."
 TUR_ARAB.10.d:0 "В Дамаске был провозглашен новый сирийский режим. Новое правительство поблагодарило Турцию за освобождение своего народа от египетского колониализма и пообещало восстановить суверенитет Сирии. Турецкие войска начинают быстрый вывод с территорий, хотя они по-прежнему контролируют север Сирии. Оставшиеся египетские официальные лица и военнослужащие репатриируются обратно в Каир, а все предыдущие договоры, связанные с Объединенной Арабской Республикой (ОАР), были аннулированы. Это подтверждает победу Турции и знаменует конец панарабской коалиции."
 TUR_ARAB.11.d:0 "Боевые действия между Турцией и Объединенной Арабской Республикой (ОАР) зашли в тупик. Ни одна из сторон, похоже, не смогла добиться крупного прорыва для достижения решающей победы. Однако, поскольку Турция инициировала конфликт, они будут рассматривать это как поражение. Турецкое правительство настаивает на том, что оно достигло своих основных целей. Однако ОАР объявляет о победе, утверждая, что её силы успешно отразили иностранную агрессию и сохранили арабские земли. Трофейное турецкое оружие и техника выставляются напоказ по всему Дамаску."
 TUR_ARAB.12.d:0 "Недавний конфликт между Турцией и Объединенной Арабской Республикой (ОАР) закончился победой ОАР. Турция стремилась вторгнуться в Сирию и развалить ОАР. Однако их наступление было не только отбито, но и ОАР удалось захватить спорную территорию Хатай. ОАР провела крупный парад в Хатае, заявив, что это окончательное освобождение арабских земель от турок. Турецкое правительство и военные должны немного покопаться в себе и быть благодарными, что потерь не было больше."
 TUR_Kurdish.1.d:0 "Ещё до основания республики курдский вопрос мучил турецкое правительство. В первые годы существования республики усилия по интеграции курдов наталкивались на бунт и сопротивление. Усилия по распространению образования и развитию также подвергались сомнению. Одна группа официальных лиц считает, что мы должны удвоить наши усилия по цивилизованности и интеграции этих курдов, которые на самом деле являются горными турками. Однако другая группа официальных лиц утверждает, что мы должны взаимодействовать с курдами на их условиях и начать переговоры с их лидерами и стремиться к более совместному, инклюзивному подходу. Мы должны решить, по какому пути идти."
 TUR_Kurdish.2.d:0 "Мы успешно запустили процесс тюркизации горных народов. Посредством экономических инвестиций, образовательных стипендий и стимулов мы поощряем многих переезжать из своих изолированных деревень в города. В городах они, наконец, общаются со своими соотечественниками-турками и знакомятся с современными идеями и республиканскими ценностями. Обратное влияние их старших ослабевает, и со временем среди всего народа Турции не останется различий."
 TUR_Kurdish.3.d:0 "Количество случаев бандитизма в горах резко сократилось. Курдские лидеры чувствуют себя гораздо более комфортно и открыто с правительственными чиновниками и полицией. Бандиты, которых когда-то считали защитниками угнетенных, теперь по праву считаются преступниками, которыми они и являются. Курдские семьи выражают удовлетворение терпимостью правительства к урокам курдского языка и культурным практикам даже в турецких городах. Это установило отношения взаимного уважения между нами и курдами. Однако среди кемалистов и националистов растет беспокойство и фрустрация по поводу того, что мы предаём принципы республики только для того, чтобы потакать эго отсталых людей."



 turkey.1.t:0 "Смерть Мустафы Кемаля Ататюрка"
 turkey.1.d:0 "\n Республика скорбит. \n\n Герой войны, революционер, президент и отец турок Мустафа Кемаль Ататюрк скончался.\п\п Он выполнял свой долг перед турецким народом и республикой, которую он основал, до самого конца. Тысячи скорбящих отдали дань уважения в Стамбуле, прежде чем его тело было перевезено кессоном, кораблем и поездом в Анкару. Там состоялись его государственные похороны, на которых присутствовал весь парламент и высокопоставленные лица со всего мира.\n\n С уходом отца современной турецкой нации республика должна двигаться дальше. Великое национальное собрание избрало бывшего премьер-министра Исмета Иненю преемником Ататюрка."
 turkey.1.a:0 "Ататюрк не будет забыт."
 turkey.10.t:0 "[From.GetName] присоединяется к [Root.GetFactionName]!"
 turkey.10.d:0 "Признавая необходимость единства в борьбе с угрозами, окружающими наши страны со всех сторон, [From.GetLeader] сегодня объявил миру, что [From.getName] заключил соглашение с [Root.getName] ради нашей взаимной безопасности".
 turkey.10.a:0 "[Root.GetName] и [From.GetName] сегодня стоят плечом к плечу, как братья."
 turkey.11.t:0 "[From.GetName] отказывается присоединиться [Root.GetFactionName]"
 turkey.11.d:0 "В глупом акте воображаемого самосохранения [From.GetLeader] сегодня объявил, что [From.getName] воздержится от любых дипломатических действий, которые могут быть расценены как угрожающие их могущественным соседям. Поэтому он отклонил наш запрос присоединения к [Root.GetFactionName]."
 turkey.11.a:0 "Единственный  выход - держаться вместе.
 turkey.22.t:0 "Хатай - Франция согласна"
 turkey.22.d:0 "Французское правительство согласилось провести референдум. Жители Хатая наверняка проголосуют за присоединение к Родине."
 turkey.22.a:0 "Прекрасно."
 turkey.23.t:0 "Хатай - Франция отказывает"
 turkey.23.d:0 "Французское правительство отклонило наши требования! Они утверждают, что Турция не имеет законных прав на Хатай."
 turkey.23.a:0 "Мы разберемся с этим позже."
 turkey.4.t:0 "Вопрос турецких проливов"
 turkey.4.d:0 "Зона вокруг проливов Босфор и Дарданеллы была демилитаризована Лозаннским договором. Однако этот важный регион в его нынешнем состоянии может попасть не в те руки. Лучше позволить туркам иметь там полный суверенитет."
 turkey.4.a:0 "Согласовано."
 turkey.3.t:0 "Конвенция Монтре"
 turkey.3.d:0 "Международное сообщество согласилось, что мы должны обладать полным суверенитетом над Турецкими проливами. Эпоха демилитаризации закончилась. Мы должны немедленно начать строить нашу оборону."
 turkey.3.a:0 "Прекрасные новости!"
 sadabat.7.t:0 "[From.GetName] запрашивает [Root.GetAdjective] членство в [From.GetFactionName]"
 sadabat.7.d:0 "В связи с подписанием договора о дружбе между нашими народами, [From.GetName] попросил, чтобы [Root.GetName] присоединился к ним в их [From.GetFactionName], чтобы объединиться против растущих угроз, которые окружают наши страны. Будь то борьба с коммунизмом или фашизмом, [From.getName] обещает отстаивать интересы [Root.GetAdjective]."
 sadabat.7.a:0 "[Root.GetName] сражается бок о бок со своими братьями."
 sadabat.7.b:0 "[Root.GetName] способна выжить сама по себе"
 sadabat.31.t:0 "Турция требует референдум в Хатае"
 sadabat.31.d:0 "Turkey requested a referendum to be held in the autonomous Syrian sandjak of Alexandretta to join Turkey. If such a referendum is held, it will surely go through."
 sadabat.31.a:0 "That piece of land is not worth much to us. They can have it."
 sadabat.31.b:0 "Not a chance!"
 sovietturkeywar.1.t:0 "Советский Союз проиграл войну за Баку"
 sovietturkeywar.1.d:0 "Сегодня турецкие войска захватили Армению, Баку, Грузию и Кавказские горы, в то время как война Германии с Россией всё ещё продолжается. Советский Союз не может воевать на два фронта одновременно, и поэтому они решили договориться с Турцией"
 sovietturkeywar.1.a:0 "Давайте предложим мир."
 sovietturkeywar.2.t:0 "Мирное предложение Советского Союза"
 sovietturkeywar.2.d:0 "Сегодня турецкие войска захватили Армению, Баку, Грузию и Кавказские горы, в то время как война Германии с Россией все ещё продолжается. Советский Союз не может воевать на два фронта одновременно, и поэтому они решили договориться с Турцией, предложив Баку и Армению"
 sovietturkeywar.2.a:0 "Давайте примем это предложение."
 englishturkishwar.1.t:0 "Мы приграли войну!"
 englishturkishwar.1.d:0 "Наши колонии оккупированы турками. Возможно, сейчас самое время отступить?"
 englishturkishwar.1.a:0 "Давайте вернемся, пока напряженность не возросла!"
 englishturkishwar.2.t:0 "Британия сдается!"
 englishturkishwar.2.d:0 "Британское правительство объявило об уходе из своих ближневосточных колоний. Они предлагают щедрые уступки, но, возможно, мы можем потребовать ещё большего. Что нам делать?"
 englishturkishwar.3.d:0 "Колонии Великобритании были оккупированы Турцией, проигравшей сражения в Каире и Иерусалиме. В результате британское правительство объявило о своем отступлении с Ближнего Востока. Контроль над Святыми землями и Египтом снова принадлежит туркам..."
 staunch_traditionalist:0 "Стойкий традиционалист"
 TUR_imperialism_focus:0 "Империализм"
 TUR_recovering_from_the_war_for_independence:0 "Восстановление после войны за независимость"
 TUR_recovering_from_the_war_for_independence_desc:0 "Турецкая война за независимость завершилась 24 июля 1923 года Лозанским мирным договором. Мы выиграли войну, но понесли много потерь. Трудно сказать, как долго её последствия будут преследовать нашу страну..."
 TUR_generic_staunch_traditionalist:0 "Салих Бозок"