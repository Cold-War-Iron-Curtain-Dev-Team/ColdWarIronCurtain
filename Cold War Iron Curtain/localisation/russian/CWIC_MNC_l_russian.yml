 cwic_mnc_nationalization_targeted_cat:0 "Национализация иностранных компаний"
 cwic_mnc_nationalization_targeted_cat_desc:0 "Выдавайте точечные приказы о национализации конкретных транснациональных корпораций, действующих в нашей стране. Успешное действие снижает уровень присутствия компании в выбранном секторе, временно замораживает дальнейшее расширение и передает изъятые активы в государственную казну. Высокие уровни присутствия в целевом секторе обычно приносят большие выплаты, но могут усилить политическую нестабильность и повысить долгосрочное давление в пользу национализации."
 cwic_mnc_nat_exxon_hydrocarbons:0 "Национализировать Exxon (Углеводороды)"
 cwic_mnc_nat_exxon_hydrocarbons_desc:0 "Изъять активы и свернуть деятельность Exxon в углеводородном секторе. Это действие снижает уровень присутствия компании в секторе на одну ступень (или полностью удаляет его, если оно минимально), временно замораживает новые инвестиции и конвертирует изъятую стоимость в государственные доходы."
