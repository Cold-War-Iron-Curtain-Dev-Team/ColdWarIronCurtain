 CWIC_MNC.1020.t:0 "Привлечение иностранных инвестиций: Rio Tinto (Добыча)"
 CWIC_MNC.1020.d:0 "Rio Tinto has offered to enter our market in the Добыча sector. If we accept, the firm will establish a local presence, begin deploying capital, and seek contracts, concessions, or partnerships consistent with our economic rules. Refusal keeps the invite open to other partners, but may slow foreign investment and reduce future technology and productivity spillovers. Our current nationalization pressure and economic openness will influence both the terms and the long-term risk of operating disputes."
 CWIC_MNC.1020.a:0 "Одобрить выход Rio Tinto's на рынок"
