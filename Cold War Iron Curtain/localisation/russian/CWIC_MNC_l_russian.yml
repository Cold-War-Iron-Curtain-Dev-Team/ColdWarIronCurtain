 cwic_mnc_invitations:0 "Привлечение иностранных инвестиций"
 cwic_mnc_invitations_desc:0 "Выдавайте приглашения или концессии транснациональным корпорациям. Приглашения будут рассматриваться с течением времени и могут вызвать ответное событие, что приведет к расширению присутствия корпораций по секторам, если принимающая страна одобрит предложение. Плановые экономики могут разрешать ограниченные концессии путем санкционирования иностранных концессий."
 cwic_mnc_invite_exxon_hydrocarbons:0 "Пригласить Exxon (Углеводороды)"
 cwic_mnc_invite_exxon_hydrocarbons_desc:0 "Предложить компании Exxon инвестировать в наш углеводородный сектор. Если условия риска будут приемлемыми, корпорация может ответить предложением о расширении своего присутствия. Более высокое давление в пользу национализации может сдерживать инвестиции."
 cwic_mnc_concession_exxon_hydrocarbons:0 "Предложить льготы для Exxon (Углеводороды)"
 cwic_mnc_concession_exxon_hydrocarbons_desc:0 "Предложить ограниченные концессии Exxon для инвестиций в наш углеводородный сектор. Этот вариант предназначен для плановых или закрытых экономик, которые разрешили иностранные концессии. Корпорация все еще может отказать, если предполагаемый риск будет слишком высоким."
