 CWIC_MNC.1000.t:0 "Привлечение иностранных инвестиций: Exxon (Углеводороды)"
 CWIC_MNC.1000.d:0 "Exxon предложила выйти на наш рынок в нефтегазовом секторе. Если мы согласимся, фирма создаст местное представительство, начнет вкладывать капитал и будет искать контракты, концессии или партнерства в соответствии с нашими экономическими правилами. Отказ оставляет приглашение открытым для других партнеров, но может замедлить приток иностранных инвестиций и снизить будущие выгоды от передачи технологий и роста производительности. Текущее давление в пользу национализации и экономическая открытость повлияют как на условия, так и на долгосрочный риск возникновения операционных споров."
 CWIC_MNC.1000.a:0 "Одобрить выход Exxon's на рынок"
 CWIC_MNC.1000.b:0 "Отклонить предложение"
