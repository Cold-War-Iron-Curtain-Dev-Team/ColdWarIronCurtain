 cg_basic_coverage_tt:0 "§YДоступность основных товаров§!\nТекущее удовлетворение спроса на осн. товары.\n\nУдовлетворение: [?cg_basic_coverage|G0%]"
 cg_durable_coverage_tt:0 "§YДоступность товаров длительного пользования§!\nТекущее удовлетворение спроса на товары длит. пользования.\n\nУдовлетворение: [?cg_durable_coverage|G0%]"
 cg_vehicle_coverage_tt:0 "§YДоступность транспорта§!\nТекущее удовлетворение спроса на транспорт.\n\nУдовлетворение: [?cg_vehicles_coverage|G0%]"
 cg_electronic_coverage_tt:0 "§YДоступность электроники§!\nТекущее удовлетворение спроса в электронике.\n\nУдовлетворение: [?cg_consumer_electronics_coverage|G0%]"

 cg_basic_demand_tt:0 "§YСпрос на основные товары§!\nЕжемесячная потребность в основных товарах.\n\nСпрос: [?cg_basic_demand|Y0]"
 cg_durable_demand_tt:0 "§YСпрос на товары длит. пользования§!\nЕжемесячная потребность в мебели, бытовой технике, инструментах и других товарах длительного пользования.\n\nСпрос: [?cg_durable_demand|Y0]"
 cg_vehicle_demand_tt:0 "§YСпрос на транспорт§!\nЕжемесячная потребность в гражданском транспорте.\n\nСпрос: [?cg_vehicles_demand|Y0]"
 cg_electronic_demand_tt:0 "§YСпрос на электронику§!\nЕжемесячная потребность в радиоприемниках, телевизорах, бытовой электронике и сопутствующих товарах.\n\nСпрос: [?cg_consumer_electronics_demand|Y0]"

 CG_PRODUCED_TITLE_TT:0 "§YПроизведено§!\nЕжемесячное производство потребительских товаров.\n\nПроизводство распределяется по наилучшим доступным уровням для каждой категории.\n\n§YТекущий уровень производства§!\nОсновные товары: [?cg_basic_producible_tier|Y0]\nТовары длит. пользования: [?cg_durable_producible_tier|Y0]\nТранспорт: [?cg_vehicles_producible_tier|Y0]\nБытовая электроника: [?cg_consumer_electronics_producible_tier|Y0]\n\n§YПромышленный потенциал§!\nЛегкая промышленность: [?modifier@cap_light_industry|Y1]\nТочное машиностроение: [?modifier@cap_precision_manufacturing|Y1]\nАвтоматизация: [?modifier@cap_automotive|Y1]\nЭлектроника: [?modifier@cap_electronics|Y1]\nМенеджмент: [?modifier@cap_management|Y1]\n\nБолее высокие уровни требуют большего промышленного, производственного, управленческого, автомобильного или электронного потенциала, в зависимости от категории."
 CG_IMPORTED_TITLE_TT:0 "§YИмпортировано§!\nИмпорт потребительских товаров за текущий месяц.\n\nИмпортные товары поступают на склады до распределения потребления, напрямую снижая нехватку товаров."
 CG_EXPORTED_TITLE_TT:0 "§YЭкспортировано§!\nПотребительские товары, выделенные на экспорт.\n\nЭти товары изымаются из внутреннего оборота и становятся доступны зарубежным покупателям. Нераспроданный экспорт остается доступным для будущих торговых сделок."
 CG_CONSUMPTION_TITLE_TT:0 "§YПотребление§!\nЕжемесячный внутренний спрос на потребительские товары и его покрытие.\n\nСпрос рассчитывается на основе населения, уровня развития, текущего года и ожидаемых стандартов жизни. Если объем доступных товаров ниже спроса, увеличивается нехватка потребительских товаров."
 CG_COVERAGE_ROW_TT:0 "§YПокрытие спроса§!\nДоля текущего удовлетворения ежемесячного спроса.\n\nНизкое обеспечение спроса приводит к нехватке потребительских товаров, увеличивая нагрузку на экономику и политику."
 CG_DEMAND_ROW_TT:0 "§YСпрос§!\nЕжемесячный спрос населения на эту категорию потребительских товаров.\n\nОжидаемое качество растет со временем и с развитием страны. Чем выше ожидаемое качество, тем хуже устаревшие товары удовлетворяют спрос."