l_english:
 Baluchistan_Uprising.100.d: "Сардары из основных племен Белуджистана направили правительству список требований. По сути, они требуют автономии, контроля над развитием и получения прибыли от добычи ресурсов. Наши высокопоставленные федеральные и военные чиновники в провинции отмечают, что племенные сдары держат людей мертвой хваткой и навязывают архаичные племенные законы. Они также отмечают, что Белуджистан имеет относительно небольшое население и богат национальными ресурсами, они настоятельно рекомендуют нам отклонить требования. Некоторые политические советники предупреждают, что отказ от требований может привести к восстанию, хотя в результате мы потеряем доступ к ресурсам в Белуджистане."
 Baluchistan_Uprising.101.d: "Генерал Рахимуддин Хан был назначен губернатором Белуджистана. Его темперамент и опыт делают его идеальным для этой задачи. На данный момент у нас, безусловно, есть военная огневая мощь для подавления мятежников, но без эффективного управления любые военные успехи быстро исчезнут. Провинциальное правительство ненадежно и, в первую очередь, способствовало возникновению кризиса. Для восстановления порядка в провинции необходимо создать эффективное военное правительство. Новый губернатор будет следить за восстановлением управления, взаимодействовать с политическими лидерами белуджей и следить за прекращением конфликта. Мы ожидаем, что при военной поддержке политическая ситуация быстро стабилизируется."
 Baluchistan_Uprising.0.d: "После отклонения их требований многие сардары-белуджи бежали в горы со своими сторонниками. В последние дни они начали вооруженные нападения на посты полиции и военизированных формирований, эти рейды, как представляется, были сосредоточены на захвате оружия и перехвате основных транспортных путей. Наши чиновники в ключевых деревнях были вынуждены бежать из-за угроз. Военные отвергли эти действия, отметив, что многие из злодеев-белуджей вооружены старинными винтовками и не имеют достаточного количества или подготовки, чтобы представлять серьезную угрозу для Пакистана."
 Baluchistan_Uprising.1.d: "Несмотря на уверенность, выраженную штабом в Равалпинди, похоже, что ряды боевиков племени белуджей за последние недели пополнились. Кроме того, их атаки выросли как по количеству, так и по сложности. Особую озабоченность вызывает дезертирство белуджской полиции и военизированных формирований. Многие офицеры военизированных формирований выразили обеспокоенность по поводу боеспособности и надежности своих сил. Из Кветты власти выражают обеспокоенность тем, что, хотя повстанцы, похоже, действуют в горах, если не принять срочных мер, они вскоре могут попытаться захватить деревни и города. Пакистанская армия объявила о плане немедленного ввода войск в провинцию и прекращения восстания. Военные обещают быстрое решение, но в прошлом их оценки были чрезмерно оптимистичными."
 Baluchistan_Uprising.2.d: "Недавно пакистанское правительство направило к нашему руководству дипломатическую и военную миссию высокого уровня. Они представили отчет о продолжающихся беспорядках в Белуджистане и поделились разведданными, указывающими на то, что повстанцы-белуджи устанавливают связи с лидерами иранских белуджей. Понятно, что если повстанцы добьются успеха, они могут в конечном итоге взбудоражить наше собственное белуджское население или попытаться распространить свой контроль на нашу собственную территорию. Мы должны решить, какой уровень поддержки оказывать Пакистану, мы можем предложить экономическую поддержку, особенно в виде нефтяных и военных субсидий. Некоторые из наших высших военных лидеров считают, что в наших интересах оказывать как военную, так и экономическую поддержку. Тем не менее, мы должны предложить некоторую помощь пакистанцам в этот трудный период."
 Baluchistan_Uprising.3.d: "Пакистанцы недавно объявили о ряде ограничений на передвижение в Белуджистан из Афганистана. Это нанесет ущерб нашей экономике, но, что более важно, отдельным семьям, живущим вдоль границы. Пакистанцы явно стремятся наказать белуджей за их справедливые требования. Это только удваивает наши собственные усилия по защите интересов пуштунов и белуджей, живущих под сапогом пакистанской армии. Мы будем решительно осуждать эту акцию и сохранять бдительность в отношении возможной агрессии. Мы также позволим белуджам транслировать свои сообщения с наших радиовышек."
 Baluchistan_Uprising.4.d: "Правительство Пакистана объявило, что его военно-морской флот будет патрулировать и блокировать Белуджистан от контрабанды оружия и припасов повстанцам. Пакистанцы утверждают, что ситуацию усугубляют иностранные державы, и открыто обвиняют нас. Ясно, что это пропаганда, предназначенная для прикрытия репрессивной политики и жестокой тактики военных. Наша собственная разведка продолжит оказывать поддержку белуджам, хотя теперь это будет ограничено. Эти действия свидетельствуют об отчаянии пакистанцев и показывают, что они теряют контроль."
 Baluchistan_Uprising.5.d: "Верный вождь белуджского племени сообщил правительству, что иракское правительство недавно способствовало доставке оружия, предназначенного для повстанцев-белуджей. Он настаивал на том, что оружие хранится в посольстве Ирака в Исламабаде. Используя эту информацию, пакистанские рейнджеры при поддержке местной полиции совершили налет на посольство. В ходе операции наши силы обнаружили сотни советских пистолетов-пулеметов, пятьдесят тысяч патронов и денежные средства, предназначенные для повстанцев. Мы выслали иракского посла. Подтвердив свою вину, Багдад затем принял высокопоставленного вождя повстанческого племени. Мы считаем, что иракцы поддерживают повстанцев из-за поддержки их друга Индии и угрозы Иранскому Белуджистану. Тем не менее, это крупная победа наших сил, разоблачающая предательство Ирака."
 Baluchistan_Uprising.8.d: "Командиры в Белуджистане запрашивают разрешение на использование тяжелого вооружения, в том числе полевой артиллерии и танков, для уничтожения повстанцев-белуджей. Многие офицеры в полевых условиях отмечают, что силы повстанцев способны растворяться в горах и отдаленных деревнях после атак. Артиллерийским и танковым огнем наши войска могли нанести ответный удар и разрушить их убежища, из которых можно было действовать против нас. Военные, похоже, очень заинтересованы в развертывании такого оружия. Однако некоторые советники по национальной безопасности отмечают, что такая огневая мощь может привести к большему количеству жертв среди гражданского населения, поскольку это оружие охватывает большие площади и не всегда точно. Военные приняли эти опасения и пообещали, что потери среди гражданского населения будут сведены к минимуму, однако они твердо заявили о своей уверенности в том, что защита жизней пакистанских солдат и быстрое восстановление правопорядка стоят рисков."
 Baluchistan_Uprising.9.d: "Размещение тяжелых вооружений в Белуджистане оказалось очень эффективным. С самого начала успешное развертывание пакистанской артиллерии вместе с корректировщиками и наблюдением ВВС позволило армии разбить крупные скопления повстанцев точным артиллерийским огнем. Повстанцы-белуджи приспосабливаются, действуя небольшими группами и атакуя из укрытий, но даже в тех ситуациях, когда присутствует наша бронетехника, мы выгоняем их. Негодяи больше не могут претендовать на горы исключительно как на свои. Основное отличие заключалось в том, что бойцов-белуджи стало меньше, это уменьшило их способность проводить зрелищные атаки и улучшило способность наших аванпостов лучше противостоять набегам повстанцев."
 Baluchistan_Uprising.10.d: "Развертывание тяжелых вооружений, особенно артиллерии и танков, имело неприятные последствия. Хотя армия использовала это оружие для разгона крупных скоплений повстанцев, были заметные случаи неудачных атак и агрессивных нападений, которые непреднамеренно привели к жертвам среди гражданского населения. Это только спровоцировало еще больше племен, которые покинули правительство и поддержали повстанцев. В одном случае верный белуджский старейшина сообщил нам, что, хотя он остался верным, большинство молодых людей его племени ускользнуло в горы. Наши наблюдатели иногда ошибочно принимают скопление соплеменников, участвующих в собрании или свадьбе, за скопление повстанцев. Кроме того, было несколько инцидентов, когда наши силы попали под обстрел из близлежащей деревни, и местный командир отдал приказ штурмовать деревню с применением артиллерии и танков, что в конечном итоге привело к значительным разрушениям и вызвало жалобы со стороны местных вождей племен."
 Baluchistan_Uprising.11.d: "В ходе недавних операций в Белуджистане военные и силы безопасности задержали ряд подозреваемых боевиков. Этих мужчин часто допрашивают и держат под стражей, однако их правовой статус не выяснен. Недавно полковник штаба написал рекомендацию для военных передать подозреваемых боевиков в местные и федеральные суды для судебного разбирательства. Многих из этих подозреваемых можно судить по колониальным законам о подстрекательстве к мятежу, и это придало бы легитимность нашим операциям и поведению с заключенными. Отчет был передан на уровень кабинета министров, где должно быть принято решение. Противники этой меры опасаются, что местные суды могут иметь сторонников повстанцев, и предоставление повстанцам платформы для выражения их пропаганды может в конечном итоге повредить нашим усилиям. Мы должны рассмотреть вопрос о том, перевешивают ли потенциальные выгоды потенциальные проблемы, связанные с использованием судов."
 Baluchistan_Uprising.12.d: "Недавнее решение правительства предать суду подозреваемых белуджских повстанцев показало стране истинные масштабы угрозы со стороны повстанцев. Прокуроры могут объяснить количество насилия, совершенного обвиняемыми, и нарисовали повествование о кровожадной повстанческой армии, стремящейся уничтожить пакистанскую нацию. Особый интерес для многих пакистанцев, читающих или слушающих новости о судебном процессе, представляют заявления об иностранном участии в деятельности повстанцев-белуджей. Правительство часто доказывает происхождение оружия, захваченного у повстанцев, и делает вывод, что повстанцы получают иностранную поддержку, особенно из Индии. Хотя правозащитные группы продолжают критиковать военные действия, правительство отмечает, что судебные процессы доказывают, что государство по-прежнему привержено закону и порядку."
 Baluchistan_Uprising.13.d: "Недавнее решение правительства предать суду подозреваемых мятежников-белуджей не смогло показать стране истинные масштабы угрозы со стороны повстанцев. Хотя прокуратура упорно трудилась, чтобы подчеркнуть жестокость обвиняемых и их связь с иностранными державами, многие в обществе были очарованы показаниями обвиняемых повстанцев. Эти, зачастую скромные представители племени белуджей, рисуют образ общества, которое постоянно игнорируется государством и подвергается жестоким военным репрессиям. Многие говорят, что белуджи просили о достоинстве только с 1947 года, но им было отказано, и если правительство продолжит отказывать им, они потеряют народ Белуджистана. В университетских городках наблюдается повышенная агитация и критика в адрес военных за их деспотический подход. Ходят слухи, что некоторые студенты университетов бежали в горы и в ответ присоединились к повстанцам."
 Baluchistan_Uprising.14.d: "После того, как правительство Пакистана согласилось уйти из Белуджистана, из провинции произошел массовый уход небелуджских и государственных семей. Военные конвои Пакистана часто забиты новыми беженцами, особенно из большой патанской общины в Кветте. Беженцы направляются в сторону Пешавара и Карачи. Правительство Пакистана предупредило, что любые попытки воспрепятствовать передвижению беженцев в Пакистан недопустимы, и пока что, похоже, победившие бойцы-белуджи не заинтересованы в нападении на беженцев или на отступившие вооруженные силы. Согласно недавнему соглашению, как только пакистанские силы покинут провинцию, все политические и военные заключенные-белуджи будут возвращены в Белуджистан. Народ Пакистана испытывает чувство горечи и унижения."
 Baluchistan_Uprising.15.d: "Пакистанская армия представила отчет высшему руководству правительства. Армия отметила, что Кветта в значительной степени был городом патанов с мощной оборонной инфраструктурой, включая Штабной колледж. Они отметили, что, несмотря на исход многих беженцев, город остается таковым, и многие беженцы-патаны из Кветты обращаются к военным с просьбой вернуть их домой. Армия требует от правительства предъявить Белуджистану ультиматум. Они должны вернуть Кветту и земли вокруг нее с патанским населением обратно в Пакистан, иначе армия захватит их силой. Пакистанские военные гарантируют, что у них не будет проблем с обеспечением безопасности этой части Белуджистана, поскольку она исторически лояльна Пакистану, а повстанцы-белуджи не могут внедриться. Они хотят, чтобы правительство использовало недавнее столкновение между белуджами и соплеменниками пуштунов в качестве предлога для ультиматума."
 Baluchistan_Uprising.16.d: "Правительство Пакистана, ссылаясь на недавнее столкновение между бойцами белуджей и патанами в качестве предлога, требует, чтобы мы ушли из Кветты и земель большинства патанов. По сути, Пакистан желает закрепить за собой Кветту и сухопутный коридор в Северо-Западную пограничную провинцию. Мы новое, молодое государство, и хотя мы отбились от пакистанской оккупации, попытка удержать этот район потребует обычной военной обороны, в которой наши командиры не уверены. Некоторые хотят, чтобы мы приняли ультиматумную ноту, мы можем изобразить это как самоопределение и получить международную легитимность и похвалу. Другие, однако, считают, что потеря Кветты, ее инфраструктуры и экономического потенциала может нанести вред нашему новому государству, и даже если мы проиграем, мы должны бороться, пока нас не вытеснят, и показать миру нашу решимость. Выбор за нами."
 Baluchistan_Uprising.17.d: "Белуджистан отказал в нашем справедливом требовании о Кветте и возвращении наших беженцев в их дома. Как и ожидалось, бойцы белуджей не могли сравниться с нашими вооруженными силами, и Кветта была легко захвачена. Газеты по всему Пакистану опубликовали фотографии марша наших войск по городу и нашего поднятия флага над фортом Жоб. Победа — небольшое утешение после унизительного поражения, понесенного партизанами-белуджами. В Пешаваре и Карачи \"победные\" караваны беженцев планируют отправиться в путь и вернуться домой. Чтобы продемонстрировать уверенность в нашей военной победе, армия объявила, что всего через несколько месяцев откроет Штабной колледж в Кветте."
 Baluchistan_Uprising.18.d: "Наши войска сражались мужественно и упорно, однако остановить продвижение пакистанских войск им не удалось. Пакистанцы перебросили подавляющую силу, включая тяжелое вооружение, используя все, чтобы отбить у нас Кветту. Наши собственные силы, даже в этих сложных обстоятельствах, по-прежнему стремились свести к минимуму использование тяжелых боеприпасов и защитить как имущество, так и жизни гражданских лиц. Хотя пакистанское правительство изображает свои действия как справедливые, а свою победу как полную, Белуджистан остается независимым. Что еще более важно, мир видит неприкрытую агрессию Пакистана. Учитывая эти обстоятельства, мы должны искать защиты и находить друзей на будущее."
 Baluchistan_Uprising.19.d: "Правительство Белуджистана официально попросило нас гарантировать их суверенитет после их недавнего пограничного конфликта с Пакистаном. Несмотря на достижение независимости, пакистанцам удалось подорвать свой суверенитет, захватив ценную территорию, которую он мог занять подавляющей силой. Белуджистан признает, что это только вопрос времени, когда пакистанцы предпримут еще одну попытку вырубить его, и поэтому они обратились к нам за помощью. Они считают, что если мы гарантируем их территориальную целостность, то и Пакистан, и Иран не решятся задушить Белуджистан в колыбели. Мы, безусловно, могли бы договориться и держать Пакистан в постоянной угрозе двух фронтов, но некоторые утверждают, что Белуджистан без Кветты никогда не сможет быть сильным, и в будущем мы можем быть втянуты в безнадежный конфликт."
 Baluchistan_Uprising.20.d: "На многих фотографиях с недавнего пограничного конфликта наши солдаты изображены с лукавой ухмылкой на лице. Несмотря на то, что многие считали невозможным, нашим храбрым солдатам удалось остановить пакистанское вторжение. Пакистанцы пытались изобрести способ отобрать у нас Кветту, но им помешали. Международное сообщество будет пристально смотреть на нас, поскольку наши некогда партизаны оказались хорошими обычными солдатами. Наши силы взяли в плен несколько пакистанских пленных, в том числе офицеров, и планируют продемонстрировать уничтоженное и брошенное оборудование, оставленное отступающими пакистанскими войсками. Эта битва знаменует собой крупную победу, но мы должны сохранять бдительность и подумать о том, чтобы найти больше иностранных союзников."
 Baluchistan_Uprising.21.d: "Правительству пришлось закрыть СМИ, как только стало очевидно, что наше наступление провалилось. Мы обещали быструю победу, но вместо этого наши силы столкнулись с гораздо более стойким противником, чем ожидалось. Донесения с фронта говорят о том, что наша разведка недооценила не только численность и подготовку белуджистанских сил, но и их тактические возможности. Отключение СМИ даст нам всего несколько дней, чтобы организовать развертывание дополнительных полицейских и военизированных формирований в крупных городах, поскольку мы ожидаем беспорядков, как только люди узнают об этой последней неудаче. Наши посольства за рубежом уже отмечают, что международная пресса сообщает о наших неудачах."
 Baluchistan_Uprising.22.d: "Фронт освобождения Белуджистана организовал большой отряд боевиков из племен для нападения на позиции пакистанской армии вокруг Гвадара. Отдельные армейские посты захвачены или окружены повстанцами, пытающимися расширить свое присутствие. Пакистанские военные будут стремиться остановить продвижение повстанцев, поскольку потеря Гвадара даст повстанцам доступ к иностранной поддержке через море. Хотя повстанцы легко вооружены, они очень мотивированы и считают, что пакистанская армия не отреагирует достаточно быстро, чтобы помешать их успеху. Правительство продолжает преуменьшать значение новостей из Белуджистана, чтобы предотвратить панику среди населения."
 Baluchistan_Uprising.23.d: "Пакистанский гарнизон в Гвадаре быстро отступил перед лицом наступающих боевиков Фронта освобождения Белуджистана и союзных племен. Бойцам мятежников удалось успешно прорваться и отрезать гарнизон. Поскольку пакистанские силы не могли действовать в этом районе, они были вынуждены отступить. Повстанцы выставляют напоказ трофейное оружие отступающих войск. Пакистанская армия преуменьшает неудачу, утверждая, что правительство сохраняет контроль, но вынуждено передислоцировать свои активы в этом районе. Оно обязалось разобраться с реакционными вождями белуджских племен, вводящими народ в заблуждение."
 Baluchistan_Uprising.24.d: "Пакистанский гарнизон в Гвадаре приветствовал группу иностранных журналистов, прибывших из Исламабада. Армия демонстрировала захваченное стрелковое оружие, взрывчатку и повстанцев. Фронт освобождения Белуджистана и его племенные союзники недавно предприняли наступление, чтобы вырвать Гвадар из рук пакистанского правительства. Однако пакистанской армии удалось сорвать атаку, нанеся нападавшим тяжелые потери. Лидеры повстанцев в Кабуле осудили правительство Пакистана за неизбирательное насилие в отношении белуджей. В Исламабаде правительство настаивает на том, что оно сохраняет контроль, и вожди племен должны поклясться в подчинении нации."
 Baluchistan_Uprising.25.d: "Пакистанская армия подтвердила, что ее силы наступают на Гвадар. Армия утверждает, что повстанцы используют порт для незаконного приобретения оружия у враждебных держав в завуалированном обвинении Индии. Первоначальное наступление Фронта освобождения Белуджистана, захватившее сонный портовый город, стало первой крупной победой сепаратистского движения. Многие эксперты предполагают, что единственный способ для армии добиться успеха — это направить достаточно подавляющую военную силу против стойких бойцов племен. Повстанцы будут полагаться на свой боевой дух и знание местности, чтобы отбить атаку."
 Baluchistan_Uprising.26.d: "Пакистанская армия провела большую церемонию поднятия флага в Гвадаре, подтвердив свою победу над белуджскими сепаратистами, оккупировавшими порт. Хотя правительство Пакистана отказывается разглашать данные о жертвах, оно явно преуспело в подавлении присутствия повстанцев. Лидеры повстанцев в Кабуле подтвердили неудачу, заявив, что пакистанская армия продолжает применять неизбирательное насилие против белуджей для достижения своей цели. Многие высокопоставленные военные и гражданские лидеры в Пакистане считают, что план этой операции станет ключом к окончательной победе над повстанцами."
 Baluchistan_Uprising.27.d: "Несмотря на блокировку СМИ, ясно, что пакистанское наступление, направленное на борьбу с Гвадаром с белуджскими сепаратистами, потерпело неудачу. Иностранная пресса в Исламабаде отмечает чувство отчаяния и даже панику среди высокопоставленных чиновников. Лидеры белуджей в Кабуле поздравили своих бойцов и народ с мужественным сопротивлением жестокому нападению неизбирательного врага. Согласно политике, новости о неудаче подавляются по всему Пакистану, чтобы предотвратить беспорядки среди людей. Однако ряд экспертов опасаются, что правительству, возможно, придется столкнуться со своими критиками, если оно продолжит борьбу с повстанцами."
 Baluchistan_Uprising.28.d: "Фронт освобождения Белуджистана и его племенные союзники начали наступление на Хуздар и его окрестности. Сообщается, что высоко мотивированные боевики захватили изолированные армейские посты, граничащие с территорией, контролируемой повстанцами. Сообщается, что пакистанская армия организует решительные действия, чтобы остановить атаку повстанцев. Несмотря на недавние неудачи, правительство по-прежнему блокирует СМИ, хотя скрывать истинное положение дел становится все труднее. Лидеры белуджских изгнанников в Кабуле обещают белуджскому народу быструю победу, чтобы продолжить борьбу за право на самоопределение Белуджистана."
 Baluchistan_Uprising.29.d: "Несмотря ни на что, Фронт освобождения Белуджистана и его племенные союзники успешно захватили Хуздар и его окрестности у пакистанского правительства. Последние пакистанские гарнизоны в этом районе выведены. Они больше не могут охранять линии снабжения гарнизонов. Попытки Пакистана сохранить блокировку СМИ, похоже, терпят неудачу. Новости о военных неудачах распространяются по городским районам, вызывая волнения в университетских городках. Многие студенты призывают правительство заключить мир и предоставить автономию всем провинциям."
 Baluchistan_Uprising.30.d: "В качестве редкого признания продолжающегося конфликта в Белуджистане пакистанская армия осторожно доставила иностранных журналистов в Хуздар. Журналистам показали пленных белуджских сепаратистов и груды трофейного оружия. Также были показаны учебные документы, взрывчатые вещества и трофейные минометы, чтобы продемонстрировать изощренность повстанческих сил. Фронт освобождения Белуджистана и их племенные союзники недавно начали крупное наступление в Хуздаре. Правительство Пакистана заявило, что военная победа подтверждает отсутствие поддержки повстанцев среди белуджей, и скоро будет достигнуто быстрое разрешение конфликта."
 Baluchistan_Uprising.31.d: "В качестве редкого признания ухудшения ситуации в Белуджистане правительство Пакистана объявило, что армия направляет войска, чтобы освободить Хуздара от Фронта освобождения Белуджистана. Лидеры BLF в Кабуле подтвердили, что их силы столкнулись с нападением пакистанской армии. Они призвали всех белуджей твердо противостоять ничем не спровоцированному обстрелу деспотичного центрального правительства. Правительство Пакистана в последнее время сдает позиции повстанцам, и многие эксперты считают, что они отчаянно нуждаются в успешном наступлении. Усилия по обеспечению отключения СМИ в связи с конфликтом в значительной степени провалились, поскольку большая часть провинции теперь находится под контролем BLF."
 Baluchistan_Uprising.32.d: "Правительство Пакистана опубликовало фотографию форта колониальной эпохи с поднятым пакистанским флагом. Показывая это как доказательство того, что недавнее наступление с целью отбить Куздар и его окрестности увенчалось успехом. Представитель армии похвалил командиров и преданность солдат как решающие факторы успешной операции. Правительство пообещало, что весь Белуджистан будет умиротворен в ближайшие месяцы. Лидеры Фронта освобождения Белуджистана, выступая из изгнания в Кабуле, подтвердили неудачу и поклялись отомстить за всех невинных белуджей, убитых в результате военных действий."
 Baluchistan_Uprising.33.d: "Фронт освобождения Белуджистана успешно остановил и отразил крупное наступление пакистанской армии в Хуздаре. Руководство BLF в Кабуле подтвердило эту новость, высоко оценив решимость белуджей выступить против насильственного подавления. Пакистанская армия хранит молчание и отказывается комментировать ситуацию. Однако утечки в СМИ и общая паника среди высшего военного руководства в Исламабаде говорят о том, что наступление в Хуздаре закончилось неудачей. Правительство Пакистана стремилось заблокировать в СМИ кризис в Белуджистане, однако недавние успехи повстанцев сделали это невозможным. Теперь принято не комментировать неудачи и хвалить все успешные операции."
 Baluchistan_Uprising.34.d: "Конфликт в Белуджистане, похоже, достигает критической точки, поскольку Освободительная армия Белуджистана подтвердила, что ее боевики начинают операцию 'окончательного освобождения' по захвату столицы Кветты у пакистанского правительства. BLA надеется, что уверенности, достигнутой его силами в ходе недавних операций, и их боевого духа будет достаточно, чтобы преодолеть любую оборону пакистанской армии. Пакистанская армия пообещала остановить любое нападение 'злоумышленников' и установить мир в провинции. Наблюдатели в Кветте отмечают, что военные установили контрольно-пропускные пункты, укрепления и развертывают гарнизон для защиты города. Знаменитый армейский и штабной колледж временно передислоцировал своих сотрудников и студентов до разрешения ситуации."
 Baluchistan_Uprising.35.d: "Пакистанская армия запустила фейерверк и отменила недавние приказы о комендантском часе в Кветте. Это произошло после того, как он остановил крупное наступление Фронта освобождения Белуджистана. BLF недавно попытался захватить столицу Белуджистана у Пакистана и фактически контролировать всю провинцию. Однако его силам явно не хватало оружия или возможностей, чтобы сокрушить крупный военный гарнизон в Кветту. Лидеры BLF в Кабуле преуменьшили эту новость, заявив, что их силы временно отброшены, но скоро вернутся. Многие аналитики считают, что правительство Пакистана может попытаться воспользоваться своей победой и попытаться вернуть территории, утраченные в ходе предыдущих наступлений повстанцев. Время покажет, станет ли эта неудача поворотным моментом в конфликте."
 Baluchistan_Uprising.36.d: "Транспортные средства с семьями и их имуществом забивают дороги из Кветты. Жены, дети и семьи военнослужащих или гражданских сотрудников вооруженных сил бегут из Кветты, когда силы Фронта освобождения Белуджистана начинают входить в город. Бойцы BLF разъезжают по городу, их болельщики встречают приветствиями и сладостями. Кветта, бастион для военных с колониального периода, была оставлена ​​сепаратистам. Похоже, пакистанская армия после поражения от повстанцев решила передислоцировать свои силы, чтобы помешать повстанцам расширить свои операции на близлежащие провинции, по сути уступив Кветту и прилегающие районы BLF. Говорят, что BLF ликует своей победой, объявляя о планах возвращения изгнанных белуджских лидеров. Хотя правительство Пакистана остается непокорным, внутри страны и за рубежом растет давление, требующее от него скорейшего прекращения конфликта, даже несмотря на то, что Белуджистан находится под контролем BLF."
 Baluchistan_Uprising.37.d: "Лидеры Фронта освобождения Белуджистана в Кабуле недавно прилетели в Кветту, где их триумфально приветствовали жители и их бойцы. Лидеры пообещали создать новое правительство, которое будет заботиться о людях и обеспечивать их процветание за счет ресурсов провинции. Несмотря на ликующую атмосферу, есть и опасения. Многие районы, когда-то бывшие домами отставных военнослужащих и правительственных чиновников, пустеют, поскольку пропакистанские беженцы продолжают уезжать из Белуджистана. Правительство Пакистана продолжает настаивать на том, что Белуджистан находится в состоянии восстания, а не является независимым государством. Жителям Белуджистана остается только гадать, что ждет их в будущем при новом режиме."
 Baluchistan_Uprising.38.d: "Источники в пакистанской армии в частном порядке подтверждают, что военные начали наступление, чтобы покончить с белуджскими сепаратистами в Харане. Военные считают, что собрали достаточно сил, чтобы завершить свой победный марш. Лидеры белуджей в Кабуле подтвердили, что вспыхнули новые боевые действия. Он призвал всех белуджей встать вместе со своими бойцами, чтобы остановить то, что они называют жестоким армейским нападением. Правительство Пакистана продолжает блокировать в СМИ ситуацию с безопасностью в Белуджистане, утверждая, что армия преследует преступные группировки и приносит современность жителям Белуджистана."
 Baluchistan_Uprising.39.d: "Правительство Пакистана подтвердило, что его вооруженные силы успешно победили белуджских сепаратистов в полевых условиях. Военные командиры на местах сообщают, что оставшиеся повстанцы в настоящее время окружены и не могут прорваться со своих позиций. Окончательная капитуляция ожидается в ближайшее время. Сообщается, что лидеры белуджей в Кабуле подавлены нынешней ситуацией. Для пакистанских вооруженных сил успешные операции — это большой прилив уверенности. Многие командиры в полевых условиях получили ценный боевой опыт. Правительство обязалось поддерживать усилия, направленные на достижение прогресса для народа Белуджистана."
 Baluchistan_Uprising.40.d: "Говорят, что белуджские сепаратисты празднуют свое успешное сопротивление наступлению пакистанской армии. Повстанцы утверждают, что, несмотря на то, что они столкнулись с безжалостным и жестоким врагом, белуджи выдержали безжалостное нападение. Армия и правительство Пакистана отказались комментировать сообщения, заявив, что ситуация на местах остается нестабильной. В частном порядке несколько военных чиновников заявляют, что было извлечено много ценных уроков, и восстановление порядка армией является лишь вопросом времени. Конфликт в Белуджистане продолжает бушевать."
 Baluchistan_Uprising.41.d: "В ходе серии церемоний тысячи белуджских боевиков-сепаратистов передали свое оружие пакистанской армии. Боевики были амнистированы и они прощены за бунт против государства. Вожди племен, возглавлявшие повстанцев, публично присягнули правительству. За мероприятием наблюдали высокопоставленные пакистанские военные, подтвердив свою военную победу над повстанцами. Белуджские повстанцы упорно боролись за независимость и защищали белуджей от властного центрального правительства. Правительство Пакистана утверждает, что его победа представляет собой шаг к прогрессу и модернизации для белуджей. Они утверждают, что традиционные старейшины племен настаивают на сохранении репрессивной феодальной системы. Лидеры белуджских повстанцев в Кабуле остаются в изгнании, однако некоторые из лидеров, как сообщается, ведут переговоры с Пакистаном о возвращении домой."