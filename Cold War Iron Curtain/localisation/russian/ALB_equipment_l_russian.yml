 ALB_mbt_equipment_2: "T-54"
 ALB_mbt_equipment_2_short: "T-54"
 ALB_mbt_equipment_2_desc: "Танк Т-54 был самым производимым танком в истории. Танк был разработан в 1946 году конструктором КМБД. Танк оснащен 100-мм нарезной пушкой и имеет различную толщину брони - от 205 мм до 60 мм. Двигатель - дизельный V-12 объемом 38,88 л. Танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался в более чем 50 армиях мира и выпускался на протяжении всего советского периода и всех конфликтов вместе с ним."
 ALB_mbt_equipment_3: "T-55"
 ALB_mbt_equipment_3_short: "T-55"
 ALB_mbt_equipment_3_desc: "Т-55 - это усовершенствованная версия танка Т-54. ОКБ-520 модифицировало конструкцию Т-55, улучшив противоядерную защиту, поставив более оптимизированный двигатель, улучшив форму башни, и даже добавив дополнительное оборудование, такое как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал 12,7 ДШК HMG, в то время как Т-54 использовал 7,62 SGMT пушку, что давало ему больше огневой мощи, но не позволяло нести больше боеприпасов. Т-55 использовался в столь же многочисленных армиях и, как правило, участвовал во всех конфликтах, в которых участвовал Т-54."
