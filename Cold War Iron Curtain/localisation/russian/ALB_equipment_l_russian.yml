 ALB_jet_multirole_equipment_8: "Микоян-Гуревич МиГ-21"
 ALB_jet_multirole_equipment_8_short: "МиГ-21"
 ALB_jet_multirole_equipment_8_desc: "Окончательное развитие МиГ-21, оснащенного турбореактивным двигателем Туманского Р25-300 и множеством других усовершенствований по сравнению с предыдущими типами.."
 ALB_heavy_fighter_equipment_1: "Яковлев Як-9"
 ALB_heavy_fighter_equipment_1_short: "Як-9"
 ALB_jet_interceptor_equipment_1: "Яковлев Як-17"
 ALB_jet_interceptor_equipment_1_desc: "Впервые Як-17 был публично продемонстрирован на Дне советской авиации в 1949 году на Тушинском аэродроме. В эксплуатации Як-17 имел большинство тех же недостатков, что и его предшественник, включая относительно низкую скорость и дальность полета, ненадежный двигатель (все еще основанный на немецком Junkers Jumo 004) со сложной процедурой запуска. С другой стороны, его управление было очень простым и схожим с популярными винтовыми истребителями, такими как Як-3 и Як-9. Это сделало его отличной переходной машиной к реактивным истребителям."
