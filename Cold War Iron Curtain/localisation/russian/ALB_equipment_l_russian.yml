 ALB_fighter_equipment_0: "ВВС Албанской народной армии"
 ALB_fighter_equipment_0_short: "ВВСАНА"
 ALB_fighter_equipment_0_desc: "Военно-воздушные силы АНА были созданы в апреле 1952 года и насчитывали 11 000 человек. Миссия ВВС заключалась в отражении атак противника на границах страны и защите национального воздушного пространства. В 1970 году АНА перешла с советских самолетов на китайские, которые албанцы использовали лишь в течение короткого периода времени до разрыва отношений между Албанией и Китаем, что в результате еще больше усложнило техническое обслуживание, поскольку АНА полагалась на советских/китайских специалистов, которые были более опытными в военных технологиях."
 ALB_fighter_equipment_1: "Яковлев Як-3"
 ALB_fighter_equipment_1_short: "Як-3"
 ALB_fighter_equipment_1_desc: "Яковлев Як-3 был одномоторным, одноместным советским истребителем времен Второй мировой войны. Прочный и простой в обслуживании, он очень нравился как пилотам, так и наземному экипажу. Один из самых маленьких и легких боевых истребителей, принятых на вооружение во время войны, благодаря высокому соотношению мощности и веса он имел отличные характеристики и зарекомендовал себя как грозный истребитель-догфайтер."
 ALB_fighter_equipment_2: "Лавочкин Ла-7"
 ALB_fighter_equipment_2_short: "Ла-7"
 ALB_fighter_equipment_2_desc: "Лавочкин Ла-7 - советский одноместный истребитель с поршневым двигателем, разработанный во время Второй мировой войны в ОКБ Лавочкина. Он был развитием и усовершенствованием Ла-5 и последним в семействе самолетов, начавшемся с ЛаГГ-1 в 1938 году."
 ALB_fighter_equipment_3: "Яковлев Як-9П"
 ALB_fighter_equipment_3_short: "Як-9П"
 ALB_fighter_equipment_3_desc: "Этот самолет был последним и самым совершенным вариантом истребителя Як-9, который стал вершиной развития среди поршневых истребителей А.С. Яковлева. Як-9П (изделие П), появившийся в 1946 году, представлял собой модификацию истребителя Як-9У композитной конструкции. В отличие от своего предшественника, он имел цельнометаллические крылья с эллиптическими законцовками. К этому времени в Советском Союзе было налажено производство высокопрочных алюминиевых сплавов, что упростило эксплуатацию самолета и увеличило срок его службы."
 ALB_jet_multirole_equipment_1: "Яковлев Як-23"
 ALB_jet_multirole_equipment_1_short: "Як-23"
 ALB_jet_multirole_equipment_2: "Микоян-Гуревич МиГ-15"
 ALB_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 \"Фагот\" Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления в Корейской войне, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые до сих пор остаются на вооружении ВВС Северной Кореи."
 ALB_jet_multirole_equipment_2_short: "МиГ-15"
 ALB_jet_multirole_equipment_3: "Микоян-Гуревич МиГ-17"
 ALB_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 \"Фагот\". Более 10 000 МиГ-17 \"Фреско\" было произведено с 1952 года. МиГ-17 был построен по лицензии в ВВС НОАК как Shenyang J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabres над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе ВВС НОАК и ВВС НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял более современным сверхзвуковым американским истребителям Phantom II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно эксплуатируется в некоторых африканских странах и Северной Корее."
 ALB_jet_multirole_equipment_3_short: "МиГ-17"
 ALB_jet_multirole_equipment_4: "Микоян-Гуревич МиГ-19"
 ALB_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в ровном полете. Сравнимым американским истребителем \"Century Series\" был North American F-100 Super Sabre, хотя МиГ-19 в основном сражался с более современными McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 ALB_jet_multirole_equipment_4_short: "МиГ-19"
