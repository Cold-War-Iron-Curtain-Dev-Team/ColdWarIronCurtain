 ALB_jet_interceptor_equipment_3: "Микоян-Гуревич МиГ-17"
 ALB_jet_interceptor_equipment_3_desc: "Всепогодный истребитель-перехватчик, оснащенный РЛС \"Изумруд\", 3 х 23 мм пушками НР-23 и двигателем ВК-1Ф"
