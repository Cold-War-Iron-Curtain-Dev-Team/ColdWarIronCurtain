 ## Large destroyers or cruisers 
  
 SWE_battle_hull_light_0: "Gotland Class"
 SWE_battle_hull_light_0_desc: "HSwMS Gotland был гидросамолетным крейсером шведского флота, построенным компанией Götaverken. Проект корабля был разработан в декабре 1926 года как гидросамолетоносец с местом для двенадцати самолетов.[1] Когда был представлен проект, Совет по строительству ВМС Швеции решил, что корабль должен выполнять функции крейсера и миноносца, а также работать в качестве гидросамолетоносца."
 SWE_battle_hull_light_1: "Tre Kronor Class"
 SWE_battle_hull_light_1_desc: "Класс Tre Kronor или Three Crowns class был классом из двух крейсеров, построенных для шведского флота во время Второй мировой войны, состоящих из Tre Kronor и Göta Lejon."
 SWE_battle_hull_light_2: "Переоборудование класса Tre Kronor"
 SWE_battle_hull_light_2_desc: "Класс Tre Kronor или класс "Три короны" был классом из двух крейсеров, построенных для шведского флота во время Второй мировой войны, включая Tre Kronor и Göta Lejon"
