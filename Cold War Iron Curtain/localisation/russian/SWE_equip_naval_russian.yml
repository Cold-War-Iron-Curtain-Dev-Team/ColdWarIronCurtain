  #Battleship/Battlecruiser Hulls in research tree# 
  
  
  
 SWE_battle_hull_medium_0: "Переоборудование класса Sverige"
 SWE_battle_hull_medium_0_desc: "Корабли береговой обороны класса Sverige были классом кораблей береговой обороны, которые на момент введения в строй были самыми большими кораблями, служившими в шведском флоте. Их конструкция была совершенно новой, и на нее повлияли корабли того времени."
  
  #Carrier Hulls in research tree# 
  
  # Submarine Hulls # 
 SWE_sub_hull_small_single_0: "Класс Draken II"
 SWE_sub_hull_small_single_0_desc: "Класс Draken (Дракон) был классом подводных лодок, построенных для ВМС Швеции с 1960 по 1962 год. Всего было поставлено шесть подводных лодок. Четыре лодки были модернизированы в 1981-82 годах. Конструкция представляла собой модифицированную версию подводных лодок класса Hajen с одним валом и большим пятилопастным гребным винтом для улучшения подводных характеристик и снижения шума."
 SWE_sub_hull_small_single_1: "Рефит класса Draken II"
 SWE_sub_hull_small_single_1_desc: "Класс Draken (Дракон) был классом подводных лодок, построенных для ВМС Швеции с 1960 по 1962 год. Всего было поставлено шесть подводных лодок. Четыре лодки были модернизированы в 1981-82 годах. Конструкция представляла собой модифицированную версию подводных лодок класса Hajen с одним валом и большим пятилопастным гребным винтом для улучшения подводных характеристик и снижения шума."
 SWE_sub_hull_small_single_2: "Класс Sjöormen"
 SWE_sub_hull_small_single_2_desc: "Класс Sjöormen (Морской змей) был классом подводных лодок, построенных для ВМС Швеции в конце 1960-х годов. Они имели каплевидную форму корпуса и могли погружаться на глубину до 150 метров (490 футов). На момент принятия на вооружение они считались одними из самых передовых неядерных подводных лодок в мире."
 SWE_sub_hull_small_single_3: "Västergötland Class"
 SWE_sub_hull_small_single_3_desc: "Дизель-электрические подводные лодки класса Västergötland поступили на вооружение шведского флота в 1987 году, что позволило вывести из эксплуатации последние подводные лодки класса Draken II."
 SWE_sub_hull_small_single_4: "Класс Готланд"
 SWE_sub_hull_small_single_4_desc: "Подводные лодки класса "Готланд" ВМС Швеции - это современные дизель-электрические подводные лодки, которые были спроектированы и построены на верфи Kockums в Швеции. Это первые подводные лодки в мире, оснащенные воздухонезависимой силовой установкой (ВНП) с двигателем Стирлинга, что увеличивает их подводную выносливость с нескольких дней до нескольких недель."
  
 SWE_sub_hull_large_single_0: "Класс "Нептун""
 SWE_sub_hull_large_single_0_desc: "Подводная лодка класса "Нептун" была шведской подводной лодкой, построенной компанией Kockums. Первая субмарина была спущена на воду в 1942 году, всего было построено три субмарины: HMSwS Neptun, HMSwS Najad и HMSwS Nacken."
 SWE_sub_hull_large_single_1: "Hajen III Class"
 SWE_sub_hull_large_single_1_desc: "Класс Hajen (класс "Акула") был классом подводных лодок, построенных компанией Kockums и использовавшихся шведским флотом. Дизайн был разработан под влиянием немецких подводных лодок класса Type XXI. Всего было построено 6 подводных лодок в 1954-1958 годах, которые находились на вооружении до 1980 года."
