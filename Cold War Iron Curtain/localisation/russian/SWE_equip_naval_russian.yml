 SWE_screen_hull_medium_2: "Стокгольмский класс"
 SWE_screen_hull_medium_2_desc: "Класс "Стокгольм" - пара боевых кораблей ВМС Швеции. Построенные как корветы в Карлскруне в 1984-1985 годах, они вооружены четырьмя противокорабельными ракетами RBS15, одной 57-мм пушкой и несколькими пулеметами. В 2017 году две единицы этого класса были перестроены и теперь служат в качестве патрульных катеров. Однако возможность нести противокорабельные ракеты сохраняется"
 SWE_screen_hull_medium_3: "Класс Гетеборг"
 SWE_screen_hull_medium_3_desc: "Класс "Гетеборг" - это класс корветов ВМС Швеции, построенных в период с 1986 по 1993 год. Класс изначально был разработан для уничтожения советских подводных лодок и надводных кораблей, и вооружен восемью противокорабельными ракетами RBS-15, торпедами, одной 57-мм пушкой и одной 40-мм пушкой."
 SWE_screen_hull_medium_4: "Класс Visby"
 SWE_screen_hull_medium_4_desc: "Класс Visby - это военный корабль, используемый ВМС Швеции. Это последний класс корветов, принятый на вооружение ВМС после корветов класса "Гетеборг" и "Стокгольм". В его конструкции особое внимание уделяется малозаметности радиолокационного сечения и инфракрасной сигнатуры, и класс привлек широкое международное внимание благодаря своим возможностям как корабля-невидимки."
  
 ## Destroyers or large frigates 
  
 SWE_screen_hull_heavy_0: "Класс Visby"
 SWE_screen_hull_heavy_0_desc: "Класс "Висбю" был шведским классом эсминцев времен Второй мировой войны. В 1942-1944 годах четыре корабля, "Висбю", "Сундсвалль", "Хельсингборг" и "Кальмар", были построены и переданы шведскому флоту. Эти корабли были частью военного строительства Швеции во время войны. В этот период корабли использовались в качестве нейтральных сторожевых и эскортных судов."
 SWE_screen_hull_heavy_1: "Öland Class"
 SWE_screen_hull_heavy_1_desc: "Класс Öland был шведским классом эсминцев. С 1943 по 1947 год было построено два эсминца, HSwMS Öland и HSwMS Uppland."
 SWE_screen_hull_heavy_2: "Класс Halland"
 SWE_screen_hull_heavy_2_desc: "Эсминцы класса "Халланд" были двумя кораблями, построенными для ВМС Швеции в 1950-х годах. Планировалось построить четыре корабля, но вторая пара была отменена. Два модифицированных корабля были экспортированы в ВМС Колумбии. Эти корабли были надводными боевыми кораблями общего назначения"
 SWE_screen_hull_heavy_3: "Östergötland Class"
 SWE_screen_hull_heavy_3_short: "Östergötland Class"
 SWE_screen_hull_heavy_3_desc: "Класс Östergötland был классом эсминцев, построенных для ВМС Швеции в конце 1950-х годов. Они были меньше и менее способны, чем предшествующий класс "Халланд", и были выведены из эксплуатации в 1982 году. Это были последние эсминцы, построенные Швецией в 20 веке. Иногда их называли "легкими эсминцами"
