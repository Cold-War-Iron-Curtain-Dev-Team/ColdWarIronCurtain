l_english:
 Nasser.2.d: "Сегодня в ошеломляющих новостях египетское правительство объявило о смерти фельдмаршала Абдель Хакима Амера. Он умер под стражей в полиции из-за самоубийства. Только в прошлом месяце Амер вместе с десятками других офицеров и чиновников был арестован за государственную измену и должен был предстать перед судом перед смертью. Многие предполагают, что он покончил с собой, чтобы избежать унизительного суда и сохранить лицо. В то время как некоторые другие круги предполагают, что эта смерть кажется довольно удобной для сражающегося египетского президента, который изо всех сил пытался сохранить свой общественный имидж после недавнего поражения Израиля. Смерть фельдмаршала знаменует собой драматическое падение человека, который когда-то считался ближайшим союзником президента Гамаля Абдель Насера. Эти двое встретились во время военной подготовки, и Амер сыграет ведущую роль в перевороте, который привел Насера к власти. В последующие годы Амер возглавлял египетскую армию и возглавлял Министерство обороны. К 1964 году он был первым вице-президентом и сменил бы Насера, если бы президент был недееспособен. Однако неудача Египта в победе над израильтянами в войне в начале этого года привела к краху его репутации, и он был отстранен от командования, как только стало ясно, что Израиль одержал победу. После окончания войны Амер стал олицетворением поражения, и его отказ уйти в отставку со всех постов, по слухам, раздражал президента Насера."
 Nasser.1.d: "Известный египетский писатель Сайид Кутб был приговорен сегодня днем к смертной казни через повешение по обвинению в заговоре с целью убийства премьер-министра Гамаля Насера. Сайид Кутб был одним из ведущих интеллектуалов \"Братьев-мусульман\", политической и религиозной организации, основанной на вере в то, что ислам-это не просто религия, а образ жизни. Сайид Кутб наиболее известен своим манифестом Маалим фи аль-Тарик или также известным как Вехи, в котором мусульманская община называлась вымершей, утверждая, что они впали в состояние Джахилии или века невежества. Чтобы очистить Джахилию, нужно построить новый мусульманский мир, в котором никто не будет служить президенту или парламенту, а люди будут служить Богу. В своем манифесте он описывает, что все немусульманское или джахилийское является злом и коррумпированным, и его существование где бы то ни было должно быть невыносимым для всех истинных мусульман. Вехи Кутуба также требовали формирования исламского авангарда, который будет следовать двойному плану Кутуба по восстановлению мусульманского мира, который должен быть осуществлен через обращение и наступательный джихад."
 Rogers_Plan.1.d: "Президент Гамаль Абдель Насер принял предложение государственного секретаря Соединенных Штатов Уильяма П. Роджерса относительно мира между Египтом и Израилем. План предусматривает демилитаризацию Суэцкого канала и его возвращение Египту, превращение Иерусалима в международный город, управляемый тремя основными религиями, свободный проход израильских кораблей через Суэц, а также проведение переговоров об окончательном статусе сектора Газа и Шарм-эш-Шейха после ухода Израиля с этих территорий. Хотя советские дипломаты и близкие советники указывали на то, что план казался произраильским и может вызвать негативную реакцию со стороны более широкого арабского мира, Насер считает, что план пойдет ему на пользу. Этот план предоставит палестинцам возможность вернуться в свои дома, а также сохранить Иерусалим как открытый город. Что еще более важно, разрешение военного соперничества с Израилем сэкономит Египту много ресурсов и позволит ему сосредоточиться на распространении своего панарабского националистического видения по всему региону. Кроме того, участвуя в мирных усилиях, Египет продемонстрирует всему миру свою приверженность миру, и если Израиль отвергнет этот план, Египет получит больше уважения со стороны крупных держав. Президент Насер надеется, что его репутация и положение в арабском мире помогут ему и Египту избежать любой негативной реакции от согласия на этот план."
 an_Naksah.1.d: "После катастрофы войны 1967 года египетский народ и правительство начали подозрительно смотреть на 3000-летнюю еврейскую общину своей страны. Многие египтяне считали, что они сочувствовали или активно помогали врагу, что позволило им решительно победить египетских военных. С широко распространенным общественным гневом по отношению к еврейской общине президент Гамаль Абдель Насер решил направить органы государственной безопасности и полиции на проведение кампании арестов, запугивания и депортации. Для египетского государства и Насера обвинение еврейской общины отвлекает общественный гнев от обвинений государства в недавних неудачах. Это также дает удобный повод объяснить, почему египетские военные не смогли достичь амбициозных целей, обещанных их лидерами. Египетские силы безопасности арестовали большое количество евреев, поместив их в центры содержания под стражей без указания того, когда и будут ли они освобождены. Паника среди еврейской общины привела к бегству многих еврейских семей в Израиль, Соединенные Штаты и по всей Европе. Многие считают, что этот последний раунд репрессий может привести к окончательному упадку некогда видной еврейской общины Египта."
 Nasser.3.d: "Сегодня днем председатель Гамаль Абдель Насер объявил о создании Арабского социалистического союза (АСУ) в качестве единственной законной политической партии Арабской Республики Египет. Это было сделано в соответствии с Национальной хартией Насера, которая призывала к национализации, аграрным реформам, земельным реформам и конституционным поправкам. Арабский социалистический союз-это политическая партия, основанная на идеалах арабского национализма, панарабизма и арабских социалистических ценностях, которые лягут в основу принятия решений в АГУ.Арабский социалистический союз выступает в качестве высшей власти государства Египет. Арабский социалистический союз включает также генеральный комитет, высший исполнительный комитет, Генерального секретаря и Президента. Гамаль Насер также станет первым генеральным секретарем Арабского социалистического союза."
 nasser.10.d: "Президент Объединенной Арабской Республики (ОАР) Гамаль Абдель Насер объявил, что его войска вскоре перейдут границу и освободят арабов Саудовской Аравии. Только что одержав ошеломляющую победу над Израилем, Насер надеется распространить свое видение арабского национализма и антиимпериализма по всему арабскому миру. В своей речи, объявляющей войну Саудовской Аравии, Насер охарактеризовал саудовскую королевскую семью как коррумпированных империалистических марионеток, которые используют поддержку Запада, чтобы сохранить свою власть над саудовским народом и обуздать арабский революционный пыл. Насер отметил, что реакционные режимы, такие как Саудовская Аравия, сдерживали арабов, поощряли внутренние распри и отдавали свои огромные нефтяные богатства империалистическим державам. Он предупредил, что только благодаря чистой решимости ОАР преодолела саудовские махинации, чтобы добиться своей великой победы над Израилем. Саудовская Аравия часто конфликтовала с Насером с тех пор, как он пришел к власти в начале 1950-х годов. Саудовская Аравия часто стремилась подвергнуть цензуре и ограничить распространение насеризма и панарабизма по всему региону и часто поддерживала режимы, борющиеся за предотвращение захвата власти насеристами. Организация Объединенных Наций восприняла заявление ОАР с большой тревогой и призвала к миру. Соединенные Штаты, Великобритания и Советский Союз внимательно следят за ситуацией, поскольку вторжение САР угрожает мировому нефтяному рынку. Многие наблюдатели опасаются, что эта война может привести к еще большему, возможно, глобальному конфликту, поскольку мало кто верит, что Соединенные Штаты могут позволить себе иметь еще одного жизненно важного глобального партнера под угрозой."
 Al_Azhar.1.d: "Шейх Махмуд Шалтут, Великий имам богословской школы Аль-Азхар в Египте, сегодня издал фетву, признающую алавитов, шиитов и друзов мусульманами и к которым следует относиться без несправедливого предубеждения. Аль-Азхар-один из главных центров суннитской науки в мире. К большому удовольствию Дар аль-Такриб аль-Мадхахиб аль-Исламия-группы суннитских и шиитских ученых Аль-Азхара, которые заложили основы дружественных отношений и взаимопонимания между различными сектами ислама. Первоначально, до этого друзы, шииты и алавиты рассматривались как еретики или язычники и иногда подвергались преследованиям в суннитских общинах Ближнего Востока на протяжении всей истории. Гамаль Абдель Насер также выразил свою поддержку фетве, убедившись, что она была опубликована по всему Ближнему Востоку. Это привело бы к зениту суннитско-шиитских отношений на следующее десятилетие."
 Syria_Seccession.1.d: "Ранним утром[ROOT.GetDateText], подполковник Абд аль-Карим аль-Нахлави, возглавил войска, чтобы захватить военные объекты, радиостанцию и аэропорт в результате переворота против египетского союза и призыва к независимой Сирии. В последующие часы многие сирийские военные подразделения заявили о своей поддержке переворота, а лидеры про-Объединенной Арабской Республики (ОАР) все больше изолируются. Лидеры переворота объявили по радио, что армия приняла меры по устранению коррупции и восстановлению прав сирийского народа. Президент Гамаль Абдель Насер был застигнут врасплох этими событиями, он не осознавал, насколько глубоко его авторитарный подход и экономическая политика агрессивной национализации отчуждали сирийцев. У него есть два варианта: один-принять переворот и желание Сирии восстановить свою независимость. Это может помочь Египту сохранить хорошие отношения и, возможно, военный союз, который имеет решающее значение для безопасности Египта. Однако это не гарантируется. Другим вариантом было бы поддержать тех сирийцев, которые все еще преданы ОАР и делу арабского национализма, возможно, поддержка про-оарской фракции в Сирии с помощью египетской военной мощи может восстановить единство и продемонстрировать силу видения Насера для арабского мира."
 Syria_Seccession.2.d: "После военного переворота заговорщики и их сторонники создали военную хунту. Президент Египта Гамаль Абдель Насер отреагировал на события вызывающим радиообращением, в котором заявил, что переворот не получил широкой поддержки, и призвал сирийскую армию подавить его. Несмотря на его агрессивный ответ, сторонники Насера в Дамаске были арестованы, а большинство военных твердо встали на сторону повстанцев, попытки договориться о компромиссе были отвергнуты Насером, который считал, что ОАР должна оставаться централизованным социалистическим государством, чтобы выжить, и не мог идти на компромисс в этих вопросах. Через несколько дней после выступления Насера египетские официальные лица в Сирии вместе с проаритскими сирийцами спокойно вернулись в Каир. ОАР была создана в 1958 году и объединила Египет с Сирией под руководством великого лидера арабских националистов президента Насера. В Сирии страх перед коммунистическим переворотом и тяготение к арабскому национализму подтолкнули многие политические партии, особенно партию Баас, к созданию египетского союза. Однако надежды на союз равных не оправдались, поскольку после создания ОАР Насер переработал конституцию, чтобы обеспечить политическое господство Египта. Лидеры партии БААС были отодвинуты в сторону как ключевые посты правительства, когда египтянам и сирийским военным было поставлено в подчинение египетское военное ведомство. Политические партии также подверглись чистке, а политическая автономия в Сирии постепенно была подорвана. Экономически Насер навязал агрессивную программу национализации и земельной реформы, но без особого участия или участия сирийских социалистов. Отсутствие политического, экономического или военного равенства привело к росту напряженности, которая в конце концов вылилась в государственный переворот. В то время как Насер публично осудил переворот и заявил, что ОАР остается сильной, реальность такова, что ОАР больше не существует, и Сирия снова стала независимой, под контролем своих собственных военных."
 Syria_Seccession.3.d: "Президент Гамаль Абдель Насер обратился к нации после переворота в Сирии, он отверг переворот как совершенный небольшой группировкой, и в экстраординарном шаге заявил, что египетские войска будут направлены в ближайшее время, чтобы помочь сирийской армии подавить переворот. Насер далее описал переворот как заговор врагов арабского народа с целью ослабить ОАР и обеспечить империалистам и врагам арабов возможность воспользоваться кризисом. Близкий друг президента Насера генерал Абдель Хаким Амер находился в Дамаске до того, как произошел переворот. После переворота он встречался с сирийскими военными и политическими лидерами, чтобы найти компромисс, и после решения Насера активно сопротивляться перевороту смог заручиться поддержкой некоторых влиятельных сирийцев, которые все еще придерживались своих арабских националистических убеждений. Сирийские командиры на побережье колебались и собирались присоединиться к перевороту. Услышав речь Насера, они решили не задерживать египетских военных чиновников и теперь прочно удерживают эти прибрежные базы в ожидании египетской поддержки. Поскольку сирийские военные сейчас выглядят разделенными, гражданская война кажется неизбежной. Лидеры переворота пользуются большей поддержкой населения, однако про-оарские фракции ободряются агрессивной реакцией Насера."
 suezcrisisnews.1.d: "Совместная англо-франко-израильская операция по обеспечению безопасности Синая и Суэцкого канала от египетского правительства оказалась впечатляющим успехом. Операция началась после того, как националистический президент Египта Гамаль Абдель Насер национализировал Суэцкий канал. Его силы в значительной степени распались перед лицом вторгшихся армий, а Суэц и Синай были взяты без особого сопротивления. Военный провал не мог быть скрыт от египетской общественности, которая чувствовала себя преданной Насером и националистическим военным руководством за их некомпетентность. Затем англо-французские войска помогли разгневанному египетскому среднему классу и офицерам-антинационалистам в армии свергнуть Насера, прекратить боевые действия и подтвердить британский контроль над Суэцем. Без Насера открылось пространство для возвращения короля Фарука на трон. Тщательно продуманная церемония в Каире ознаменовала его повторную интронизацию с участием высокопоставленных египетских, британских и французских чиновников. Широкая публика была исключена, чтобы предотвратить любые неловкие инциденты."
 suezcrisisnews.2.d: "Синайский кризис закончился тем, что англо-французские войска согласились уйти из Суэца. Хотя их партнер Израиль продолжает удерживать Синай, ожидается, что они также вернутся на довоенные позиции. В военном отношении совместная англо-франко-израильская операция имела ошеломляющий успех, когда египетские войска были отброшены в беспорядке. Однако международный протест, особенно со стороны двух сверхдержав, вынудил к прекращению огня и выводу войск. Вторжение началось в ответ на решение националистического египетского правительства национализировать Суэцкий канал. Президент Египта Гамаль Абдель Насер провозглашает победу Египта и арабов над мировым империализмом. Несмотря на то, что его войска терпели поражения, население и более широкий арабский мир получали ложные сообщения о военных победах Египта, и объявление о выводе войск, по-видимому, подтверждает это повествование. Международный протест по всему миру и давление сверхдержав показывают, что свобода действий, которой долгое время пользовались колониальные государства, не будет терпима более широким международным сообществом."
 Yemani_Coup.1.d: "Имам Мухаммад Аль-Бадр вступил на престол Йемена после смерти своего отца в 1962 году. Несмотря на свое королевское происхождение, он долго восхищался египетским президентом Гамалем Абдулом Насером, и одним из его первых действий было продвижение известного насериста, полковника Абдуллы Салляля, командовать дворцовой охраной. И это несмотря на антинассеровскую позицию его отца и угрозу, которую арабский национализм уже представлял для имамата. Отец Аль-Бадра жестоко подавил попытку государственного переворота в 1955 году насеровскими офицерами, стремившимися покончить с монархией. В Египте президент Насер открыто поддерживал анти-королевских йеменских офицеров, а египетские дипломаты спокойно поддерживали многочисленные заговоры против Аль-Бадра. Абдулла Саллал в сотрудничестве с другими заговорщиками планировал развернуть танки и вооруженные войска для штурма дворца Аль-Бадра в ночь на 26 сентября 1962 года. Запланированный переворот был приведен в действие после того, как Саллал узнал, что Аль-Бадр знал о заговорах против него. Многолетняя напряженность между революционерами и сторонниками монархии теперь накалилась, и, похоже, усилия Аль-Бадра по работе с нассеристскими фракциями, возможно, обернулись против него, когда переворот Салляля начал приводиться в движение."
 Yemani_Coup.2.d: " К 11:45 вечера в ночь переворота танки полковника Абдуллы Салляля начали обстреливать королевский дворец, Мухаммад Аль-Бадр попытался возглавить сопротивление, но из-за подавляющей огневой мощи он был вынужден бежать из дворца и был изгнан из своей столицы Саны. Силы Саллала быстро захватили ключевые объекты по всему городу, включая радиостанцию и аэропорт. Другие революционные офицеры, многие из которых сочувствовали попытке переворота 1955 года, начали захватывать контроль в других крупных городах Йемена. Радио объявило о свержении Аль-Бадра и прекращении коррумпированной монархии, которая нанесла ущерб развитию Йемена как народа и как части арабского мира. Саллал укрепил контроль над революцией, очистив не насеристов, и Египет направил старших офицеров, чтобы оценить, какая помощь нужна режиму Саллала. Несмотря на заявления о том, что Аль-Бадр погиб во время штурма дворца, йеменский король выжил и пробирался на север, заручившись поддержкой соплеменников и обосновавшись в Саудовской Аравии."
 Yemani_Coup.3.d: "Утром 26 сентября 1962 года офицер-роялист сообщил имаму Мухаммеду Аль-Бадру, что его командир дворцовой гвардии и известный насерист полковник Абдулла Саллал открыл оружейную комнату военной академии для вооружения войск и младших офицеров. Кроме того, Саллал сообщил Аль-Бадру, что этой ночью танки будут переброшены к дворцу, и Аль-Бадру не следует беспокоиться. Подозревая эти действия, Аль-Бадр призвал верных ему офицеров и солдат встретиться с ним, и всего за несколько часов до того, как танки Саллала должны были быть выдвинуты на позиции для штурма дворца, Аль-Бадр арестовал Саллала и отменил приказ о перемещении танков. Параллельный заговор, направленный лейтенантом Али Абдулом Могни на отправку броневика и охрану радиостанции и аэропорта, был легко разгромлен благодаря тому, что его люди ненадолго захватили радиостанцию. В течение нескольких часов заговор переворота был раскрыт, а его главные заговорщики либо арестованы, либо находятся в бегах."
 Tiran_Closing.1.d: "В ходе последней эскалации на Синае президент Египта Гамаль Абдель Насер объявил о закрытии Тиранского пролива для всех судов, предназначенных для Израиля, заявив, что корабли, пытающиеся нарушить блокаду, будут обстреляны. Эта новость последовала за повторной милитаризацией Синая египетскими войсками 14 мая и требованием высылки миротворцев ООН 16 мая. Насер заявил, что\"Мы готовы к войне... Эти воды-наши. Если Израиль хочет угрожать войной, мы говорим ей: добро пожаловать\". Ранее в этом месяце премьер-министр Израиля Леви Эшкол повторил предупреждение 1957 года о том, что любое закрытие проливов будет рассматриваться как акт войны. Поступили сообщения о передвижении израильских танков в ответ на развертывание египетских войск на Синае. Напряженность в регионе растет, поскольку дипломаты пытаются разрешить кризис до того, как он еще больше обострится. Израиль получает 90 процентов своей нефти через проливы, и наблюдатели рассматривают это как серьезную угрозу для израильской экономики. Арабы по всему региону были воодушевлены действиями Насера и горячо поддерживают его политику в отношении Израиля."
 aswan.100.d: "Через 10 лет после начала строительства Египет наконец завершил строительство плотины Аван. Десятки тысяч египетских инженеров и рабочих с помощью советского финансирования и опыта завершили этот масштабный проект. Этот успех представляет собой большое достижение для арабо-советского сотрудничества. С помощью Асуанской плотины Египет надеется использовать Нил для своей гидроэлектроэнергии, помочь контролировать наводнения и привести к сельскохозяйственному буму в стране. Водохранилище было названо озером Насер в честь дальновидного президента Египта Гамаля Абдель Насера. Строительство плотины началось в начале 1950-х годов и стало ключевым компонентом планов Насера по модернизации Египта. Завершение этого проекта представляет собой величайший проект развития независимого Египта со времен избавления от ига западного империализма, и многие египтяне оптимистично настроены, что это приведет к экономическому золотому веку."
 black_saturday.1.d: "Беспорядки начались в аэропорту Алмаза, когда тамошние рабочие отказались обслуживать британские самолеты. За этим последовал бунт полицейских, которые хотели выразить свою солидарность с погибшими и захваченными в плен коллегами. Затем протестующие направились к зданию университета, где к ним присоединились студенты. Вместе они направились к кабинету премьер-министра, чтобы потребовать от Египта разорвать дипломатические отношения с Великобританией и объявить ей войну. Им сказали, что правительство хотело бы сделать это, но столкнулось с противодействием со стороны короля. В результате протестующие направились к дворцу Абдин и выразили свое недовольство по отношению к королю. Первый акт поджога произошел на Оперной площади, где огонь распространился на многочисленные магазины, офисы корпораций, кинотеатры, отели и банки. Пожары также достигли кварталов Фаггала, Дахер, Цитадель, площадь Тахрир и площадь Каирского вокзала. Из-за хаоса, кражи и грабежи происходили до тех пор, пока не прибыла египетская армия."
 farouk_gang.6: "Все готово к предстоящему военному параду. Танки заправлены топливом, пушки начищены, солдаты накормлены. Скоро все узнают, что наша военная мощь сильна и бунтовать или нападать на нас бесполезно!"
 farouk_gang.9.d: "Непопулярный и забытый король Фарук, как сообщается, умер. Судя по всему, он перенес смертельный сердечный приступ, вызванный стрессом и нездоровым образом жизни. Однако некоторые источники сообщают, что он покончил с собой, в то время как другие утверждают, что он был убит правительством. Какова бы ни была официальная правда, одно можно сказать наверняка: для Египта наступает новое время."
 egy_trial.2.d: "Теперь, когда Нагиб обеспечил свое превосходство над Насером, пришло время решить, что с ним делать. Во-первых, мы можем позволить ему жить нормальной жизнью в Каире. Если мы хотим наказать его, мы можем принудить его к изгнанию и запретить ему когда-либо возвращаться, или мы можем посадить его в тюрьму на несколько лет."
 egy_trial.3.d: "Очень немногие помнят имя Гамаля Абдель Насера. Когда-то один из ведущих членов Совета революционного командования, он в конце концов попытался свергнуть Нагиба, что закончилось его неудачей. После неудавшегося переворота он исчез из политики и, по данным анонимных источников, в настоящее время живет где-то в Каире."
 egy_trial.4.d: "Гамаль Абдель Насер, некогда крупная фигура в Совете Революционного командования, только что был вынужден отправиться в изгнание. По имеющимся данным, его сопровождали в аэропорт под дулом пистолета, где он сел на самолет в неизвестном направлении. За пределами аэропорта несколько человек протестовали против этого, утверждая, что Насер был спасением Египта, и теперь Египет обречен."
 egy_trial.5.d: "Последние новости из каирского суда. Гамаль Абдель Насер, бывший высокопоставленный член Совета революционного командования, только что был приговорен к 15 годам тюремного заключения за попытку переворота президента Нагиба. Насер будет отбывать свой срок в тюрьме Тора."
 egypt.60.t: "Национализация Суэцкого канала"
 egypt.60.d: "После роста напряженности в отношениях с нашим правительством Египет в одностороннем порядке национализировал и захватил Суэцкий канал"
 egypt.60.a: "Приготовьтесь к войне и свяжитесь с французами"
 egypt.60.b: "Выдать дипломатическое осуждение"
 egypt.61.d: "После роста напряженности в отношениях с Великобританией Египет в одностороннем порядке национализировал и захватил Суэцкий канал, Британия планирует войну и просит нас присоединиться к ним в этом"
 egypt.61.a: "Выдать дипломатическое осуждение"
 egypt.61.b: "Согласитесь присоединиться к Британии для войны"
 egypt.62.d: "После роста напряженности в отношениях с Великобританией Египет в одностороннем порядке национализировал и захватил Суэцкий канал, Британия не хочет начинать войну и ищет другие страны, чтобы также осудить их дипломатически"
 egypt.62.a: "Выдать дипломатическое осуждение"
 egypt.63.t: "Франция отказывается присоединиться к войне"
 egypt.63.d: "После долгих внутренних дебатов французское правительство отказалось присоединиться к нашей войне против Египта"
 egypt.63.a: "Готовьтесь к войне в любом случае"
 egypt.63.b: "Выдать дипломатическое осуждение вместо"
 egypt.64.t: "Франция отказывается вступить в войну"
 egypt.64.d: "После долгих внутренних дебатов французское правительство решило присоединиться к нашей войне против Египта"
 egypt.64.a: "Объявите войну Египту и свяжитесь с Израилем"
 egypt.65.t: "Франция и Великобритания объявляют войну"
 egypt.65.d: "После долгих внутренних дебатов французское и британское правительства решили объявить войну нашей стране, чтобы вернуть свои колониальные владения в пределах наших границ"
 egypt.65.a: "Империалистическая мразь"
 egypt.66.t: "Британия объявляет войну"
 egypt.66.d: "После долгих внутренних дебатов британское правительство решило объявить войну нашей стране, чтобы вернуть свои колониальные владения в пределах наших границ"
 egypt.66.a: "Британская мразь"
 egypt.67.t: "Британия Отступает"
 egypt.67.d: "После долгих внутренних дебатов британское правительство решило воздержаться от объявления войны Египту после нашего решения не присоединяться к ним в военном ударе"
 egypt.67.a: "Пока нет войны"
 egypt.68.t: "Британия объявляет войну"
 egypt.68.d: "После долгих внутренних дебатов британское правительство решило воздержаться от объявления войны Египту после нашего решения не присоединяться к ним в военном ударе"
 egypt.68.a: "Это будет иметь печальные последствия"
 egypt.69.t: "Предложение нанести удар по Египту"
 egypt.69.d: "Британия и Франция связались с нами, чтобы сообщить нам, что они нападают на Египет, нас также пригласили присоединиться к этой войне....."
 egypt.69.a: "Присоединяйтесь к войне"
 egypt.70.t: "Приглашение во Франко-Британский союз"
 egypt.70.d: "Несколько недель назад, когда начался Суэцкий кризис, французы сказали, что помогут нам. Недавно французское предложение премьер-министра Франции получило поддержку в их парламенте, где они были бы в Союзе с нами. Французы будут аннексированы нами и интегрированы в наше правительство. Это привело бы к созданию нового правительства под названием Франко-британский союз. Наш парламент должен принять решение о том, вступим ли мы с ними в Союз или нет"
 egypt.70.a: "Давайте объединимся."
 egypt.70.b: "Нет, спасибо"
 news.200.t: "Суэцкий кризис"
 news.200.d: "После роста напряженности в отношениях с Великобританией Египет в одностороннем порядке национализировал и захватил Суэцкий канал"
 news.200.a: "Интересное развитие событий"
 news.200.b: "Сокрушительный удар по империализму"
 news.200.c: "A относительно развития"
 news.200.e: "Время войны?"
 news.206.d: "После национализации зоны Суэцкого канала англичане и французы объявили войну египетскому правительству, чтобы заставить его вернуть свои владения"
 news.206.a: "Соответствующее развитие"
 news.206.b: "Тогда это война!"
 news.206.c: "Вперед к победе"
 news.206.e: "Вперед к победе"
 news.207.d: "После национализации Суэцкого канала англичане решили объявить войну Египту, чтобы вернуть себе только зону Суэцкого канала."
 news.208.t: "Израиль присоединяется к войне с Египтом"
 news.208.d: "После тайных продолжающихся секретных переговоров с англичанами и французами Израиль объявил войну и начал нападения на Египет"
 egypte.10.t: "Приглашение в Объединенные Арабские Республики"
 egypte.10.d: "[FROM.GetNameDef] приглашает нас присоединиться к Объединенным Арабским Республикам. Это означает, что они присоединят нашу территорию и сформируют новую нацию под своим командованием. Такое сотрудничество могло бы быть полезным в эти трудные времена, но действительно ли мы хотим отказаться от нашей земли?"
 egypte.10.a: "Да, мы присоединимся."
 egypte.10.b: "Нет, мы остаемся независимыми!"
 egypte.11.d: " С тех пор как революционное правительство и флаг свободы развеваются над Дамаском, сионисты сражаются с нашими арабскими братьями на Голанах. Теперь, когда арабы постепенно укрепляют свои позиции не только для борьбы с сионистской угрозой, но и для осуществления действий по освобождению арабских земель в самой Палестине, сионисты нависают над Дамаском, чтобы свергнуть враждебное правительство. Из-за этого мы должны немедленно провести ремилитаризацию Синая, чтобы удержать сионистов от любых шагов против нас."
 farouk_gang.1.d: "Король Фарук объявил сегодня, что все красные автомобили в Египте запрещены немедленно и только ему разрешено владеть ими. Исключение составляют только военные джипы, выкрашенные в красный цвет, которые путешествуют в составе королевской свиты.Король известен своим парком дорогих автомобилей, включая огненно-красный Bentley Mark VI 1947 года выпуска и красный Mercedes Benz 540K, который был подарен Адольфом Гитлером.\Нмуч из сторонников короля Фарука высоко оценил закон, утверждающий, что король должен быть единственным, кто достоин использовать такие транспортные средства. Анонимные оппоненты критиковали закон как \"абсолютно безумный\" и \"совершенно бессмысленный\". Несколько человек пришли на анонимное интервью просто для того, чтобы заявить, что король прострелил им шины, когда они пытались пройти мимо него. Король назвал эти обвинения \"недоказанными\"."
 farouk_gang.2.d: "Принцессе Фатии запретили въезд в Египет после романа с Риядом Гали. Недавно стало известно, что Рияд Гали, королевский советник короля Египта, сделал предложение принцессе Фатии Египетской. Несмотря на серьезные возражения короля Фарука, свадьба состоялась в отеле \"Фэрмонт\" в Сан-Франциско. Выяснилось также, что оба они перешли в католичество и планируют жить вместе. В ответ король Фарук объявил, что принцессе Фатии запрещен въезд в Египет и она отлучена от церкви. Все их имущество, оставшееся в Египте, было конфисковано государством."
 farouk_gang.3.d: "Король вернулся из своей дипломатической поездки во Францию. По его словам, поездка была плодотворной и, безусловно, улучшит отношения между Египтом и Францией. Однако анонимные источники утверждают, что поездка была массовым провалом. Во-первых, во время официальной вечеринки, проходившей в Париже, Фарук, как сообщается, украл часы, бумажники и зажигалки. Затем в свободное время он устроил 70-часовую азартную игру, во время которой якобы проиграл 150 000 долларов, напился до потери сознания и напал на женщину за то, что она не спала с ним. Конечно, все это только слухи и наверняка выдуманы кем-то, кто ревнует короля."
 farouk_gang.4.d: "Король только что вернулся из своей поездки во Францию. Фарук вместе со своей свитой, состоящей из его \"кухонного кабинета\", 30 албанских телохранителей, различных египетских секретарей и врачей, суданских дегустаторов еды и различных других последователей, путешествовал по французской сельской местности в колонне из 7 кадиллаков, окруженных телохранителями на мотоциклах и самолетом, летящим над головой с приказом приземлиться, если Фарук захочет летать вместо них. В казино он выиграл около 40 миллионов марок. Затем он переехал в Сан-Себастьян в Испании, чтобы посетить кинофестиваль с четырьмя \"его дамами момента\". Следующей остановкой Фарука были Канны, где он играл в баккару на 80 000 долларов в казино Палм-Бич с такими людьми, как голливудский магнат Джек Л. Уорнер и британский промышленник Майерс Хайман. Хайман выиграл игру, а затем быстро умер от сердечного приступа, что привело к появлению газетных заголовков, таких как \"Счастливчик Микки бьет Фарука-и умирает!\""
 nasser_execution.1.d: "Охота на Насера наконец-то подошла к концу. После долгих и трудных поисков египетская полиция нашла предателя Насера в камере в Каире. После установления блокады суданская гвардия была вызвана, чтобы арестовать Насера и убить защитников здания. Насера привели к королю Фаруку, где он предстал перед справедливым судом за свои преступления. В конце концов было решено, что его преступление должно быть капитально наказано, и он был казнен путем удушения лично королем Фаруком."
 sudan_part.1.d: "Борьба против британского господства привела к тому, что суданский регион оказался втянут в ужасный конфликт. Наш благородный король Фарук, желая сохранить порядок и мир, учредил миротворческую миссию. Не желая вносить свой вклад в конфликт, египетские войска построили гарнизоны и административные штабы для обеспечения порядка. Спустя 4 года конфликт, наконец, подошел к концу, когда британский колониальный гарнизон был выведен, а суданские силы почти истощены. Поскольку на юге остались только организованные суданские силы, король Фарук установил контроль над анархическим суданским регионом. Правительство Южного Судана направило королю официальный протест по этому поводу, но король Фарук ответил, заявив, что они не в состоянии управлять разоренным севером. Король Фарук открыто признался египетскому народу, что он не уверен, что Южный Судан является даже функциональным правительством в его нынешнем состоянии. В настоящее время он рассматривает возможность отправки миротворцев на Юг, чтобы навести там порядок."
 farouk_exiled.1.d: "Новый режим в Египте быстро решил выставить на аукцион обширную коллекцию сокровищ короля, включая его спальню из семи предметов. Среди наиболее известных его владений была одна из редких монет 1933 года с Двойным орлом. Большой интерес вызвало открытие, что Фарук владел одной из самых больших коллекций порнографии в мире, поскольку он обладал обширной коллекцией, насчитывающей сотни тысяч порнографических фотографий, открыток, календарей, игральных карт, часов, очков, штопоров и так далее. Одержимость Фарука коллекционированием также включала в себя бриллианты, собак, марки, рубины, яйца Фаберже, древние тибетские монеты, средневековые доспехи, флаконы с аспирином, бритвенные лезвия, скрепки и счетчики Гейгера. Во дворце Куббе было обнаружено, что Фарук собрал 2000 шелковых рубашек, 10 000 шелковых галстуков, 50 золотых тросточек с бриллиантами и один портрет Адольфа Гитлера с автографом."
 Free_Officer_Coup.1.d: "Переворот свободного офицера только что произошел в Каире и приведет к изгнанию короля Фарука из страны. Узнав, что Свободные офицеры планируют переворот, король Фарук приказал арестовать их. Однако Свободные офицеры узнали об этом приказе и решили нанести упреждающий удар и уклониться от ареста. Не имея возможности арестовать Свободных офицеров, король Фарук получил помощь верной суданской гвардии для укрепления своего дворца. Вечером Свободные офицеры осадили город и атаковали. Они не смогли прорвать укрепления во дворце и были вынуждены отступить. Сам король Фарук убил 4 нападавших из своей снайперской винтовки из импровизированной амбразуры на своем балконе. На следующий день за Свободными офицерами прибыло бронетанковое подкрепление. Свободные офицеры предъявили королю Фаруку ультиматум о капитуляции, угрожая уничтожить дворец артиллерией. Не имея возможности уничтожить подкрепление, король Фарук сдался."
 free_officer_fail.1.d: "После короткой осады Свободные офицеры решили организовать штурм дворца короля Фарука и обезопасить страну. Короля охраняли около 800 хорошо экипированных суданских гвардейцев. Король Фарук, опытный стрелок, участвовал в обороне, предположительно убив около 16 нападавших, когда они вошли на территорию дворца. Свободные офицеры, отчаявшись поддержать наступление и убить короля, решили не отступать. Однако это оставило их силы уязвимыми, и они понесли тяжелые потери. Когда нападавшие ослабли, король Фарук приказал контратаковать дезорганизованные и сильно ослабленные силы Свободных офицеров. В конце концов почти тридцать Свободных офицеров сдались, но были казнены без суда и следствия. Король Фарук объявил чрезвычайное положение и призвал патриотически настроенных египтян найти Гамаля Абдель Насера, одного из лидеров Свободных офицеров, который избежал контратаки. Аналитики ожидают, что король очистит армию от националистов и усилит аппарат безопасности."
 Sudan.1.d: "После того как революция 1952 года в Египте лишила британские войска возможности достичь Судана, Судан смог восстать против Великобритании и легко получить свою независимость. Однако не все счастливы в суданском регионе. В стране наблюдается массовый уровень политической фракционированности и огромные идеологические и этнические разногласия. Новое суданское правительство не может даже решить, как сформировать новое правительство или каким справедливым образом решить, кто из них должен управлять страной. К наиболее острым проблемам относятся нехватка работников государственной службы, отсутствие индустриализации для поддержки независимого государства, восстание на Юге и многие другие проблемы. Если страна не сможет решить эти вопросы, то в ближайшие годы она может столкнуться с серьезными проблемами."
 abolish_mon_egy.1.d: "Переходное правительство Египта отменило монархию. Правление сына короля Фарука, короля Фауда II, было очень недолгим, поскольку его назначение было всего лишь уловкой, чтобы успокоить англичан. Гамаль Абдель Насер был назначен заместителем премьер-министра, а генерал Нагиб-первым президентом. С упразднением монархии появилась новая Конституция Республики Египет. Конституция обещала светскость и гражданские права.Есть, однако, много людей, которые были верны королю, которые сердятся, что они больше не будут получать выгоды и трофеи от короля. Более озлобленные, чем бывшие офицеры и лоялисты, \"Братья-мусульмане\" решительно выступают против секуляризма новой республики и могут вызвать проблемы для вновь созданной Республики, если не будут решены."
 egy_trial.1.d: "Царские офицеры, верные царю военные офицеры, предаются суду за сговор в преступлениях против Египта. Обвинения включают в себя такие вещи, как общая коррупция и злоупотребление властью, но многие офицеры привлекаются к суду за конкретные преступления, такие как жестокость или прямое воровство. Судебные процессы займут длительный период времени, а более сложные дела, в которых трудно собрать доказательства, скорее всего, будут длиться месяцами. Некоторые офицеры уже пытались бежать из страны, чтобы избежать возможного наказания."
 egy_rioting.1.d: "После нескольких месяцев поджогов\" Исламское братство \" в настоящее время участвует в массовом беспорядке по всему штату. \"Братья-мусульмане\" с самого начала разработки Египетской конституции презирали только что созданную Республику. Их главные претензии - секуляризация страны и либерализация мусульманской веры в политической атмосфере правительства. Многие ведущие теоретики, такие как Сайид Кутб, опубликовали работы, в которых утверждалось, что Египет больше не является исламским и что государство должно быть свергнуто. Мятежники уже захватили ключевые районы во многих городах Египта и массово уничтожают государственную собственность. Правительственные силы безопасности ведут ожесточенные бои с бунтовщиками на улицах."
 egy_suez_funding.1.d: "Асуанская высокая плотина наконец-то получила финансирование и будет построена через Нил. Ожидается, что плотина будет охватывать ~3800 метров с огромной высотой ~110 метров. Плотина будет поддерживать индустриализацию с помощью электричества, контролировать наводнения, обеспечивать инфраструктуру водоснабжения и орошать сельскохозяйственные угодья на больших расстояниях. Кроме того, плотина создаст озеро, которое было преждевременно названо \"Озером Насера\" в честь революционного лидера. В настоящее время египетское правительство начинает массовый наем и заключение контрактов, чтобы накопить рабочую силу и ресурсы, необходимые для строительства плотины теперь, когда финансирование обеспечено."
 RCC_Crisis.1.d: "Совет находится в кризисе по поводу того, кто должен править Египтом."
 farouk_gang.10.d: "Нагиб эль-Рихани, отец египетской комедии, умер от тифа во время съемок своего последнего фильма\"Газель Аль Банат\" в возрасте 60 лет в Каире. Он родился в Баб-Эль-Шерейе, Каир, в семье халдейского иракского отца из города Мосул в Ираке по имени Элиас Эль-Рихани, который работал экспертом по лошадям и торговцем и в конце концов поселился в Каире, где встретил и женился на матери Нагиба, коптской египтянке из Каира. Нагиб получил образование во французской школе \"Les Frères\" в Каире.Он основал свою собственную театральную группу в конце 1910-х годов в Каире и сотрудничал со своим давним другом Бадейхом Хайри в адаптации нескольких французских театральных хитов для египетской сцены, а затем и для кино. У эль-Рихани был бурный брак с Бадией Масабни, левантийской актрисой и танцовщицей. Они расстались перед его смертью."
