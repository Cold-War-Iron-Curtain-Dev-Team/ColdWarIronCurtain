 HUN_fighter_equipment_0: "Magyar Legiero"
 HUN_fighter_equipment_0_short: "ML"
 HUN_fighter_equipment_0_desc: "The Hungarian Air Force is the air force branch of the Hungarian Defence Forces.A small air arm was organised along Soviet lines during 1947. Following the communist takeover, Russian military aid was stepped up and a major expansion program initiated."
  
  ## Fighter 
  
 HUN_fighter_equipment_1: "MAVAG Heja"
 HUN_fighter_equipment_1_short: "Heja"
