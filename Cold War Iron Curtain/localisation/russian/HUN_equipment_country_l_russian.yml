 HUN_infantry_equipment_1: "АК-55"
 HUN_infantry_equipment_1_short: "AK-55"
 HUN_infantry_equipment_1_desc: "АК-55 является точной лицензионной копией автомата Калашникова, выпускавшегося венгерской компанией Fegyver es Gazkeszulekgyar (FEG) с 1959 по 1962 год."
  
 HUN_infantry_equipment_2: "AMD-65"
 HUN_infantry_equipment_2_short: "AMD-65"
 HUN_infantry_equipment_2_desc: "В 1963 году венгерская армия приняла на вооружение новую штурмовую винтовку с обозначением АКМ-63 (также известную как AMD-63), представляющую собой модернизированную версию АК-55."
  
 HUN_infantry_equipment_3: "АК-63"
 HUN_infantry_equipment_3_short: "AK-63"
 HUN_infantry_equipment_3_desc: "На венгерской службе АК-63 заменил AMD-65, который почти идентичен, но имеет модифицированный теплозащитный экран и вертикальную переднюю рукоятку под стволом. Хотя AMD-65 была венгерской служебной винтовкой с 1965 года, она была более дорогой в изготовлении, а передние рукоятки имели репутацию легко повреждаемых в полевых условиях. В конце 1970-х годов Министерство обороны Венгрии обратилось к ФЕГУ с просьбой изготовить более дешевую винтовку на основе более традиционной советской конструкции АКМ. К концу 1977 года АК-63 был принят на вооружение Венгерской народной армии (начиная с Сухопутных войск). В 1978 году FÉG добавила в свой каталог складную версию АК-63 АКМС; после этого АК-63 с фиксированным запасом стал известен как АК-63Ф (Деревянный приклад), а складная версия была обозначена как АК-63Д (Спуск). На венгерской службе АК-63 F и D обозначаются как AMM и AMMS соответственно."
  
 HUN_infantry_equipment_4: "AK-63MF"
 HUN_infantry_equipment_4_short: "AK-63MF"
 HUN_infantry_equipment_4_desc: "Модернизированный АК-63Д с телескопическим прикладом и лебединым рельсом MIL-STD-1913."
  
