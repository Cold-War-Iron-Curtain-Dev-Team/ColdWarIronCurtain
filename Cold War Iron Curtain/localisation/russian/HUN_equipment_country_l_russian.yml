 #HUN_fighter_equipment_3_desc: ""
  
 #HUN_jet_multirole_equipment_1: "Mikoyan-Gurevich MiG-9"
 #HUN_jet_multirole_equipment_1_desc: "The MiG-9 Fargo was the first Mikoyan designed jet aircraft of the post WW2 era. Introduced in 1948. It saw limited combat and training use during the Chinese Civil War and Korean War. In total 610 aircraft were produced, solely by the USSR. The final MiG 9's were decommissioned by the PRC in 1951."
 #HUN_jet_multirole_equipment_1_short: "MiG-9"
 HUN_jet_multirole_equipment_2: "Mikoyan-Gurevich MiG-15"
 HUN_jet_multirole_equipment_2_desc: "Perhaps one of the most iconic fighters of the Cold War, the Mikoyan-Gurevich MiG-15 Fagot entered service in 1947. The MiG-15 was involved in many conflicts since its introduction in the Korean War, where it proved a worthy adversary to the American F-86 Sabre and F9F Panther. A section of the Korean-Chinese border was nicknamed MiG Alley because of their prevalence in the area. Over 18 000 MiG-15s were built and used by many nations, most notably the USSR and Eastern Bloc nations. While most aircraft were decommissioned in the 1950's, some still remain in service with the North Korean Air Force."
 HUN_jet_multirole_equipment_2_short: "MiG-15"
 HUN_jet_multirole_equipment_3: "МиГ-15"
 HUN_jet_multirole_equipment_3_desc: "A direct successor to the MiG-15 Fagot. Over 10 000 MiG-17 Fresco were produced from 1952. The MiG-17 was license built in the PLAAF as the Shenyang J-5. In total 20 nations used the MiG-17, spanning Africa, Europe and Asia. Its first combat deployment was in 1958, when PRC MiGs clashed with Nationalist Chinese F-86 Sabres over the Taiwan Strait. However, the MiG-17 primarily saw use in the Vietnam war with the NVAF and PLAAF were it scored 28 aerial victories. The MiG-17 was so successful that it even held its own against the much more modern, supersonic American Phantom II fighters of the Vietnam war. The MiG-17 was generally decommissioned in the 1970's, while it still remains in limited service in some African nations and North Korea."
 HUN_jet_multirole_equipment_3_short: "МиГ-15"
 HUN_jet_multirole_equipment_4: "МиГ-17Ф"
 HUN_jet_multirole_equipment_4_desc: "The MiG-19 was the first Soviet production aircraft capable of supersonic speeds in level flight. A comparable U.S. "Century Series" fighter was the North American F-100 Super Sabre, although the MiG-19 primarily fought against the more modern McDonnell Douglas F-4 Phantom II and Republic F-105 Thunderchief over North Vietnam."
 HUN_jet_multirole_equipment_4_short: "МиГ-17Ф"
 HUN_jet_multirole_equipment_5: "МиГ-19С"
 HUN_jet_multirole_equipment_5_desc: "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 HUN_jet_multirole_equipment_5_short: "МиГ-19С"
 HUN_jet_multirole_equipment_6: "МиГ-21Ф"
 HUN_jet_multirole_equipment_6_desc: "Production version of the all-weather interceptor. These were powered by the R11F2-300 turbojet and, starting with the seventh production batch, fitted with the RP-21 radar (the first six batches used the older TsD-30T radar (aka RP-9-21). Further, the weapons control system was modified from that of the F-13 to allow use of the RS-2US (aka K-5MS) beam-riding AAM in addition to the IR-seeking K-13."
 HUN_jet_multirole_equipment_6_short: "МиГ-21Ф"
 HUN_jet_multirole_equipment_7: "МиГ-21бис"
 HUN_jet_multirole_equipment_7_desc: "the MiG-23 was the first Soviet fighter to field a look-down/shoot-down radar and one of the first to be armed with beyond-visual-range missiles. Production started in 1969 and reached large numbers with over 5,000 aircraft built, making it the most produced variable-sweep wing aircraft in history. Today the MiG-23 remains in limited service with some export customers."
 HUN_jet_multirole_equipment_7_short: "МиГ-21бис"
 HUN_jet_multirole_equipment_8: "МиГ-23MФ"
 HUN_jet_multirole_equipment_8_desc: "The early "Flogger" variants had a number of design shortcomings, including airframe strength and reliability, engine performance, maneuverability and radar performance. A considerable redesign of the airframe was conducted, resulting in the MiG-23ML."
 HUN_jet_multirole_equipment_8_short: "МиГ-23MФ"
 HUN_jet_multirole_equipment_9: "МиГ-23МЛ"
 HUN_jet_multirole_equipment_9_desc: "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 HUN_jet_multirole_equipment_9_short: "МиГ-23MЛ"
 HUN_jet_multirole_equipment_10: "МиГ-29"
 HUN_jet_multirole_equipment_10_desc: "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 HUN_jet_multirole_equipment_10_short: "МиГ-29"
  
 HUN_mr_stealth_fighter_equipment_1: "Mikoyan MiG-29M"
 HUN_mr_stealth_fighter_equipment_1_short: "MiG-29M"
 HUN_mr_stealth_fighter_equipment_1_desc: "The MiG-29M/M2 aircraft is a revision of the basic MiG-29. It achieved a more robust multi-role capability with enhanced use of air-to-air and air-to-ground high-precision weapons. It also featured a considerably increased combat range, owing to an increase in its internal fuel capacity. A few changes took place during the aircraft's development. The redesigned airframe was constructed from a lightweight Aluminium-lithium alloy to increase the thrust-to-weight ratio. The air intake ramps' geometry was revised, the upper intake louvers were removed to make way for more fuel in the LERXs, mesh screens introduced to prevent foreign object damage (FOD) and inlet dimensions were enlarged for higher airflow."
  
  ##CAS 
  
 HUN_jet_CAS_equipment_1: "Ил-10"
 HUN_jet_CAS_equipment_1_short: "Ил-10"
 HUN_jet_CAS_equipment_2: "МиГ-15бис"
 HUN_jet_CAS_equipment_2_desc: "Fighter-bomber conversion, fitted to carry unguided rockets and bombs."
 HUN_jet_CAS_equipment_2_short: "МиГ-15бис"
 HUN_jet_CAS_equipment_3: "Су-7Б"
 HUN_jet_CAS_equipment_3_desc: "Fighter-Bomber version with all-moving slab tail. Equipped with Svod long-range navigation receiver and armed with three 30 mm NR-30 cannons. Had provisions for an ORO-32K rocket unguided rocket pack or a FAB-250 bomb under each wing, and from 1957 modified to allow four rocket pods to be carried."
 HUN_jet_CAS_equipment_3_short: "Су-7Б"
 HUN_jet_CAS_equipment_4: "МиГ-21бис"
 HUN_jet_CAS_equipment_4_desc: "The bomber variant of the Su-7 Fitter-A first flew in March of 1959, later entering service in 1961. It would go on to be the primary Soviet ground attack aircraft of the 1960's. From 1957-1972 over 1400 Su-7Bs were constructed, many of which were exported. The aircraft was relatively popular overseas seeing service 10 nations. It saw extensive service in both the Indian and Egyptian Air Forces. The aircraft remains in limited service in North Korea."
 HUN_jet_CAS_equipment_4_short: "МиГ-21бис"
 HUN_jet_CAS_equipment_5: "Су-22M-3"
 HUN_jet_CAS_equipment_5_desc: "Upgraded AL-7F-1 engine, upgraded fuel system with external piping on either side of the fuselage spine, fuel tanks installed in the wings, 'wet' underwing hardpoints for carrying external fuel tanks, capable of carrying tactical nuclear bombs."
 HUN_jet_CAS_equipment_5_short: "Су-22M-3"
