l_english:
 CHI_The_Fall_of_the_Mainland: "Падение материка"
 CHI_The_Fall_of_the_Mainland_desc: "Войска предательской Народно-освободительной армии вытеснили нас из Южного Китая! Мы должны перегруппироваться и отступить на остров Тайвань, и мы вернём себе материк, когда придёт время. Коммунисты будут сожалеть о том дне, когда они изгнали нас с нашей родины."
 CHI_Declaration_of_Martial_Law: "Объявление военного положения"
 CHI_Declaration_of_Martial_Law_desc: "Чтобы сохранить национальную безопасность нашей новой республики, необходимо объявить военное положение. Мы должны подготовиться к любому нападению на нашу землю и спланировать повторное вторжение на материк и разгром коммунистов!"
 CHI_Elections_of_1954: "Выборы 1954 г."
 CHI_Elections_of_1954_desc: "На всеобщих выборах 1954 года разгорелась острая борьба между Народно-демократической партией, Коммунистической партией Тайваня и Демократической социалистической партией Китая. Народ будет решать сам!"
 CHI_Elections_of_1958: "Выборы 1958 г."
 CHI_Elections_of_1958_desc: "На всеобщих выборах 1958 года разгорелась острая борьба между Народно-демократической партией, Коммунистической партией Тайваня и Демократической социалистической партией Китая. Народ будет решать сам!"
 CHI_The_Hyperinflation_Crisis: "Кризис гиперинфляции"
 CHI_The_Hyperinflation_Crisis_desc: "Мы должны бороться с гиперинфляционным кризисом, вызванным Гражданской войной! Новый тайваньский доллар будет создан для замены старого тайваньского доллара и тайваньской иены."
 CHI_Republic_of_China_Armed_Forces: "Вооруженные силы Китайской Республики"
 CHI_Republic_of_China_Armed_Forces_desc: "Чтобы противостоять коммунистической угрозе, наши силы должны быть сильнее, хорошо обученными и способными вернуть землю, которая принадлежит нам по праву!"
 CHI_Republic_of_China_Air_Force: "ВВС Китайской Республики"
 CHI_Republic_of_China_Air_Force_desc: "Мы должны защищаться от революционных угроз с воздуха, используя новые технологии и авиацию, для борьбы с коммунистическими силами, захватившими нашу землю."
 CHI_Develop_Modern_Airbases: "Развитие современных авиабазы"
 CHI_Develop_Modern_Airbases_desc: "Мы должны идти в ногу с меняющимися технологиями и развивать современные авиабазы, предназначенные для размещения новейших моделей реактивных самолетов любого размера."
 CHI_Re_Establish_the_Air_Force_Academy: "Восстановить Академию ВВС"
 CHI_Re_Establish_the_Air_Force_Academy_desc: "Для создания эффективных военно-воздушных сил нам нужны не только самолеты, но и способные офицеры. Академия ВВС Китайской Республики будет заниматься именно этим, обучая молодых людей, чтобы они стали новым поколением военно-воздушных сил."
 CHI_Surplus_American_Aircraft: "Излишки американских самолетов"
 CHI_Surplus_American_Aircraft_desc: "Чтобы помочь нам, мы примем излишки самолетов из Соединенных Штатов, чтобы мы могли эффективно использовать наши могучие военно-воздушные силы."
 CHI_Import_American_Jet_Fighters: "Импорт американских реактивных истребителей"
 CHI_Import_American_Jet_Fighters_desc: "Нам нужны новейшие американские самолеты, чтобы дополнить наши и без того растущие военно-воздушные силы! Мы запросим, чтобы нам прислали несколько сотен новейших моделей из Соединенных Штатов."
 CHI_Victory_in_Hainan: "Победа на Хайнане"
 CHI_Victory_in_Hainan_desc: "Попытки коммунистов силой захватить остров Хайнань провалились! Наши силы построили впечатляющую оборону, мы считаем это победой Китайской Республики!"
 CHI_Republic_of_China_Army: "Армия Китайской Республики"
 CHI_Republic_of_China_Army_desc: "Наша новая армия должна быть сильной и хорошо обученной для борьбы с подлыми коммунистическими силами. Мы должны сформировать боеспособную многочисленную силу, чтобы победить революцию!"
 CHI_Reformation_of_the_Military: "Реформа вооруженных сил"
 CHI_Reformation_of_the_Military_desc: "Наши вооруженные силы должны быть реформированы для достижения наших нынешних целей. Наши офицеры и солдаты должны быть реформированы и переподготовлены для решения задач завтрашнего дня, а не вчерашнего дня."
 CHI_American_Arms: "Американское оружие"
 CHI_American_Arms_desc: "Мы должны получить новейшие образцы американского оружия и вооружений для оснащения и обучения наших военных, это позволит нашей армии быть сильной и победить предателей-коммунистов!"
 CHI_Urban_Warfare_Training: "Обучение ведению боевых действий в городских условиях"
 CHI_Urban_Warfare_Training_desc: "Крайне важно, чтобы наши солдаты научились воевать в городах, будь то Тайбэй или Пекин. Городские войны необходимы в наши дни и в эпоху, мы больше не живем в викторианскую эпоху."
 CHI_Amphibious_Commando_Operations: "Десантные операции"
 CHI_Amphibious_Commando_Operations_desc: "Пока мы не на материке, мы должны продолжать наши атаки на Народно-освободительную армию издалека. Наши элитные коммандос начнут совершать набеги на объекты на побережьях Фуцзянь и Гуандун  оставляя «сообщения» оккупационным силам."
 CHI_Fall_of_Hainan: "Падение Хайнаня"
 CHI_Fall_of_Hainan_desc: "Мы потеряли остров Хайнань! Коммунисты высадились на Хайнане и нанесли тысячи жертв! Наш флот подвел нас! Мы должны отступить на Тайвань, но боевые действия продолжатся."
 CHI_Fortify_the_Coast: "Укрепить побережье"
 CHI_Fortify_the_Coast_desc: "Тайвань должен стать непроницаемой защитой от любых возможных вторжений или высадок коммунистов. Вдоль западного побережья будут построены форты и оборонительные сооружения для защиты нашей национальной безопасности."
 CHI_Korean_War_Intervention_Offer: "Предложение о вмешательстве в Корейскую войну"
 CHI_Korean_War_Intervention_Offer_desc: "Мы должны помочь нашим братским демократическим странам противостоять коммунистической агрессии. Мы поддержим Республику Корея материальной поддержкой в знак солидарности."
 CHI_Reinforced_American_Ties: "Усиленныеотношения с США"
 CHI_Reinforced_American_Ties_desc: "Запросив оружие и авиацию у Соединенных Штатов, мы считаем справедливым укрепить дипломатические связи с американцами, нашим ближайшим союзником, ради единой цели предотвращения распространения коммунизма."
 CHI_Aid_For_Tibetan_Loyalists: "Помощь тибетским лоялистам"
 CHI_Aid_For_Tibetan_Loyalists_desc: "Мы должны помочь тибетскому народу в его кампании сопротивления Народно-освободительной армии; Республика Китай окажет материальную помощь нашим тибетским союзникам."
 CHI_Undermine_the_Dalai_Lama: "Подорвать Далай-ламу"
 CHI_Undermine_the_Dalai_Lama_desc: "Нынешний Далай-лама должен быть заменен как можно скорее, чтобы продолжить революцию против агрессии китайских коммунистов. Будет назначен регент для продолжения борьбы!"
 CHI_Support_Anti_Communist_Insurgents: "Поддержка антикоммунистических повстанцев"
 CHI_Support_Anti_Communist_Insurgents_desc: "Война не проиграна! Мы будем и впредь поддерживать повстанцев на материке и во всей Юго-Восточной Азии, чтобы противостоять быстрому распространению коммунизма, подрывать заговоры Советов и китайцев!"
 CHI_Continue_to_Support_Operations_in_Burma: "Продолжать поддерживать операции в Бирме"
 CHI_Continue_to_Support_Operations_in_Burma_desc: "Мы должны продолжать операции в Бирме, чтобы сдерживать мятежи коммунистов под Красным и Белым Флагом. Бирма должна стать стабильной и свободной от опасностей коммунизма."
 CHI_Fortify_Matsu_and_Kinmen: "Укрепить острова Мацу и Цзиньмэнь"
 CHI_Fortify_Matsu_and_Kinmen_desc: "Острова Мацу и Цзиньмэнь являются наиболее важной линией обороны от будущей коммунистической агрессии с материка и первой целью возможного нападения. Мы должны и дальше строить оборону и укрепления на островах, чтобы защитить наши новые земли."
 CHI_Arm_Partisans_on_the_Mainland: "Вооруженить партизан на материке"
 CHI_Arm_Partisans_on_the_Mainland_desc: "На материке остались те, кто готов продолжать борьбу за свободу Китая и антикоммунизм. Мы обеспечим партизан оружием и снаряжением, которые им нужны, чтобы беспокоить НОАК и оставаться для них занозой в жеппе."
 CHI_Raid_Fujian: "Рейд на Фуцзянь"
 CHI_Raid_Fujian_desc: "Нашим коммандос пора искупить свою вину! Мы совершим набег на материковое побережье провинции Фуцзянь, чтобы послать нашим врагам-коммунистам сообщение о том, что мы будем продолжать сражаться!"
 CHI_Republic_of_China_Navy: "ВМС Китайской Республики"
 CHI_Republic_of_China_Navy_desc: "Наш флот должен стать сильным, чтобы править Южно-Китайским морем! Мы должны набирать и обучать способных моряков, чтобы китайские воды были нашими."
 CHI_Develop_Taiwanese_Shipyards: "Развитие тайваньских верфей"
 CHI_Develop_Taiwanese_Shipyards_desc: "Тайвань — идеальное место для верфей, так как он расположен на острове. Мы разработаем несколько объектов, чтобы начать производство собственных кораблей, чтобы пополнить наш флот."
 CHI_Commissioning_of_Former_IJN_Destroyers: "Ввод в строй бывших эсминцев ВМФ Японии"
 CHI_Commissioning_of_Former_IJN_Destroyers_desc: "Теперь, когда Япония стала союзником Соединенных Штатов, мы любезно приняли предложение о нескольких бывших японских эсминцах. Пришло время ввести их в строй и представить нашему доблестному флоту!"
 CHI_Purchase_American_Destroyers: "Покупка американских эсминцев"
 CHI_Purchase_American_Destroyers_desc: "The Americans have also offered to sell us surplus destroyers, and we will accept; several older American destroyers will also be added to the ever-growing fleet."
 CHI_Expand_the_Marine_Corps: "Расширение корпуса морской пехоты"
 CHI_Expand_the_Marine_Corps_desc: "Корпус морской пехоты Китайской Республики (ROCMC) должен быть расширен. Сформированная в 1914 году морская пехота является самым элитным родом вооруженных сил и должна быть хорошо обучена всем видам боя."
 CHI_The_Temporary_Provisions: "Временные положения"
 CHI_The_Temporary_Provisions_desc: "Чтобы подавить восстание коммунистов, мы должны ввести военное положение и аннулировать конституцию Китайской Республики. Необходимо принять чрезвычайные меры для обеспечения национальной безопасности и безопасности нашего народа. Нам придется оставаться в этих условиях, пока мы не сможем успешно вернуть материк!"
 CHI_Reconstruct_the_KMT: "Reconstruct the KMT"
 CHI_Reconstruct_the_KMT_desc: "Мы, может, и потеряли материк, но Тайвань по-прежнему наш! Гоминьдан останется сильным и сосредоточится на экономическом процветании. Нам нужно реконструировать и восстановить нацию в нашем новом доме."
 CHI_The_Academy_for_the_Study_of_Carrying_out_Revolution: "Академия изучения осуществления революции"
 CHI_The_Academy_for_the_Study_of_Carrying_out_Revolution_desc: "Мы должны изучить недостатки Гоминьдана на материке и обнаружить свои недостатки, а также то, как мы можем спровоцировать дальнейшую революцию против коммунистического правительства."
 CHI_Establish_the_Central_Reform_Committee: "Создание Центрального комитета реформ"
 CHI_Establish_the_Central_Reform_Committee_desc: "Центральный комитет реформ (CRC) будет существовать как ядро Гоминьдана с целью заново изобрести партию и сделать ее революционно-демократическим институтом. Конечная цель CRC — не переизобретение, а возвращение материка!"
 CHI_Intensify_the_White_Terror: "Усилить белый террор"
 CHI_Intensify_the_White_Terror_desc: "Некоторые «политические диссиденты» должны быть задержаны за оппозицию Гоминьдану. Любые коммунистические шпионы среди нас должны быть уничтожены. Белый террор должен быть усилен, чтобы искоренить тех, кто отказывается присоединиться к Гоминьдану."
 CHI_Execute_Aborginee_Leaders: "Казнить лидеров аборигенов"
 CHI_Execute_Aborginee_Leaders_desc: "Некоторые лидеры коренных народов Тайваня возражали против политики Гоминьдана и их «насильственной ассимиляции» в китайское общество. Мы должны подать пример тем, кто противостоит нам, и в качестве заявления казнить нескольких лидеров аборигенов."
 CHI_Sinification_Campaign: "Кампания китаизации"
 CHI_Sinification_Campaign_desc: "Мы должны начать просветительскую кампанию и оказать влияние на коренные народы Тайваня, чтобы наша молодая республика стала маяком китайской демократии и культуры. Мы должны бороться с прежним японским влиянием, которое испортило людей.."
 CHI_Repress_Taiwanese_Activists: "Подавить тайваньских активистов"
 CHI_Repress_Taiwanese_Activists_desc: "Те, кто отказывается следовать идеалам Гоминьдана, должны быть репрессированы, это единственный способ сохранить порядок и стабильность. С политическими оппонентами разберутся."
 CHI_Ban_the_Formation_of_New_Political_Parties: "Запрет на создание новых политических партий"
 CHI_Ban_the_Formation_of_New_Political_Parties_desc: "Новые политические партии не нужны и не нужны. Гоминьдан силен, и все, кто выступает против него, поставлены в пример. Китайская Республика не будет расколотой демократией с политической борьбой!"
 CHI_Outlaw_Native_Languages: "Родные языки вне закона"
 CHI_Outlaw_Native_Languages_desc: "Китайский язык необходимо будет знать, чтобы общаться и адаптироваться к нашим традициям. Все остальные языки ничего не значат и не приносят пользы Китайской Республике."
 CHI_Rename_Street_Names: "Переименовать названия улиц"
 CHI_Rename_Street_Names_desc: "В соответствии с нашей кампанией по китаизации мы переименуем некоторые улицы, чтобы они отражали расположение на материке, поскольку они являются нашей законной территорией."
 CHI_Growing_Paranoia: "Растущая паранойя"
 CHI_Growing_Paranoia_desc: "Многие люди, в том числе в высших эшелонах власти, все больше обеспокоены оппозицией Гоминьдану и проникновением коммунистов. Мы должны что-то сделать с этой растущей паранойей, чтобы стабилизировать нашу страну."
 CHI_Sun_Li_Jen_Coup: "Переворот Сунь Лижэня"
 CHI_Sun_Li_Jen_Coup_desc: "Ходили слухи, что Сунь Лижэнь, главнокомандующий армией Китайской республики, замешан в раскрытом перевороте ЦРУ с целью свергнуть нашего славного президента генералиссимуса Чана Кайши. Это не пройдет! Мы отстраним его от его команды."
 CHI_Release_Formosan_Activists: "Освободить формозских активистов"
 CHI_Release_Formosan_Activists_desc: "В силах Республики Китай освободить формозских активистов, активно выступающих против гоминьдановского режима, и мы это сделаем, они должны научиться действовать осторожно."
 CHI_Accede_to_American_Pressure: "Поддаться американскому давлению"
 CHI_Accede_to_American_Pressure_desc: "Американцы вынудили нас; мы откажемся от нашего политического «допроса» подозреваемых диссидентов в надежде, что наша республика станет более безопасной."
 CHI_Arrest_Sun_Li_Jen: "Арестовать Сунь Лижэня"
 CHI_Arrest_Sun_Li_Jen_desc: "У генерала было достаточно свободы! За заговор с целью свержения Чанf Кайши Сунь Ли;энь был освобожден от своих обязанностей и помещен под домашний арест. Это должно послужить примером для других высокопоставленных офицеров, что они должны ставить страну превыше всего."
 CHI_Intensify_Censorship_Campaign: "Активизировать цензурную кампанию"
 CHI_Intensify_Censorship_Campaign_desc: "Мы должны контролировать все средства массовой информации, включая газеты, радио и телевидение, чтобы поддерживать национальную безопасность и предотвращать любую оппозицию Гоминьдану. Цензура должна быть усилена."
 CHI_Arrest_the_Intellectual_Elite: "Арестовать интеллектуальную элиту"
 CHI_Arrest_the_Intellectual_Elite_desc: "Необходимо задержать некоторых представителей интеллигенции, чтобы сдержать их оппозицию правительству Гоминьдана. Их громкая поддержка демократии и независимости Тайваня будет приглушена."
 CHI_Play_the_Cliques_off_Against_One_Another: "Настроить враждебные клики друг на друга"
 CHI_Play_the_Cliques_off_Against_One_Another_desc: "Клики, противостоящие Гоминьдану, должны быть натравлены друг на друга, чтобы они сражались, а наша партия оставалась на вершине!"
 CHI_Empower_The_CC_Clique: "Расширить возможности клики ЦК"
 CHI_Empower_The_CC_Clique_desc: "ЦК, или Клика Центрального клуба, считается крайне правой в Гоминьдане, представляющей антикоммунистов и националистов, и имеет большое влияние на партийную элиту, военных, разведку и бизнес. Мы должны усилить их действия и позволить им продолжать оказывать свое влияние."
 CHI_Outlaw_Political_Demonstrations: "Объявить политические демонстрации вне закона"
 CHI_Outlaw_Political_Demonstrations_desc: "Оппозиция правящему гоминьдановскому правительству недопустима. Любые политические демонстрации, особенно оппозиционные Гоминьдану, будут встречены силой и подавлены."
 CHI_Expel_Lei_Chen_From_the_Party: "Исключить Лей Ченя из партии"
 CHI_Expel_Lei_Chen_From_the_Party_desc: "Лей Чень стал лидером оппозиционного движения за создание более демократической Китайской Республики. Мы должны исключить его из партии и арестовать, так как он не разделяет прежней верности!"
 CHI_Outlaw_Strikes: "Объявить забастовки вне закона"
 CHI_Outlaw_Strikes_desc: "Забастовка за улучшение условий труда будет просто невозможна. У нас могут быть законы, позволяющие рабочим создавать профсоюзы и заключать коллективные договоры, но любые забастовки в Китайской Республике будут встречены силой правительства и быстро подавлены, ценой человеческих жизней или нет."
 CHI_Allow_the_Former_Blueshirts_to_Run_the_Secret_Police: "Разрешить бывшим синерубашечникам руководить тайной полицией"
 CHI_Allow_the_Former_Blueshirts_to_Run_the_Secret_Police_desc: "Общество практики трех народных принципов (неофициально известное как «Синие рубашки») было военизированной ультранационалистической ультраправой фракцией в Гоминьдане. Известные своим ярым антикоммунизмом и операциями, основанными на итальянских фашистах, мы позволим им взять под свой контроль Тайваньское гарнизонное командование и действовать как тайная полиция Гоминьдана."
 CHI_Empower_The_Secret_Police: "Расширить возможности тайной полиции"
 CHI_Empower_The_Secret_Police_desc: "Теперь, когда власть у «синих рубашек», мы можем расширить полномочия и возможности тайной полиции, позволив им предпринимать любые действия против оппозиции Гоминьдану или возможных коммунистических тенденций."
 CHI_Inhibit_the_Political_Center: "Запретить политический центр"
 CHI_Inhibit_the_Political_Center_desc: "Мы должны подавлять политический центр нашей идеологией, вместо того, чтобы пытаться искать баланс между обеими сторонами."
 CHI_Seek_Out_American_Support: "Запрос американской поддержки"
 CHI_Seek_Out_American_Support_desc: "Мы должны получить больше поддержки от нашего союзника, Соединенных Штатов. Это единственный способ сохранить нашу стабильность от подлости коммунистических революционеров с материка."
 CHI_Investigate_Mainland_Refugees: "Расследовать дела беженцев с материка"
 CHI_Investigate_Mainland_Refugees_desc: "Мы должны расследовать дела беженцев с материка, чтобы убедиться, что они действительно находятся здесь в поисках убежища, а не спящие агенты коммунистов!"
 CHI_Invest_in_Textiles: "Инвестиции в текстиль"
 CHI_Invest_in_Textiles_desc: "Необходимо сделать текстильное производство одной из основных отраслей промышленности Тайваня. Министерство экономики немедленно создаст комитет по расширению текстильной промышленности."
 CHI_Sovietize_the_Armed_Forces: "Советизировать Вооруженные Силы"
 CHI_Sovietize_the_Armed_Forces_desc: "По опыту Цзяна Цзинго, сына нашего президента, мы проведем в нашей армии военные реформы советского образца; теперь, когда Сунь Лижэнь «устранен», мы можем полностью расширить корпус политических офицеров и охват Гоминьдана."
 CHI_Establish_Light_Industries: "Создать легкую промышленность"
 CHI_Establish_Light_Industries_desc: "Необходимо, чтобы мы начали производить больше товаров народного потребления за счет расширения легкой промышленности, чтобы заручиться поддержкой населения."
 CHI_Democratic_Progressive_Victory: "Победа демократической прогрессивной партии"
 CHI_Democratic_Progressive_Victory_desc: "На выборах 1954 года победила Демократическая прогрессивная партия! ДПП известна своей левоцентристской и националистической позицией."
 CHI_A_Formosan_Identity: "Формозская идентичность"
 CHI_A_Formosan_Identity_desc: "Необходимо, чтобы мы начали создавать свою идентичность здесь, на Формозе, в нашем новом доме, чтобы показать миру, что мы разные люди."
 CHI_Moderate_Welfare_Spending: "Умеренные расходы на социальное обеспечение"
 CHI_Moderate_Welfare_Spending_desc: "Правительство начнет нести ответственность за увеличение расходов на здравоохранение, больницы и профилактику заболеваний. С этой целью будет создано Министерство здравоохранения и социального обеспечения."
 CHI_Increase_Ties_to_South_Korea: "Расширение связей с Южной Кореей"
 CHI_Increase_Ties_to_South_Korea_desc: "Мы должны установить дружеские и дипломатические отношения с другими свободными странами Азии. Южная Корея должна быть нашим союзником, поскольку у обеих наших стран есть угрозы коммунизма, которые мы должны разделить."
 CHI_Japanese_Investments: "Японские инвестиции"
 CHI_Japanese_Investments_desc: "Мы позволим японскому правительству и японским компаниям инвестировать в нашу текстильную и легкую промышленность, это улучшит отношения между нами двумя и прибыль для всех."
 CHI_Industrial_Expansion: "Промышленное расширение"
 CHI_Industrial_Expansion_desc: "Мы должны и дальше развивать нашу промышленность, как тяжелую, так и ширпотребную. Китайская Республика будет известна своей промышленной мощью!"
 CHI_Defend_Our_Newfound_Independence: "Защитить нашу вновь обретенную независимость"
 CHI_Defend_Our_Newfound_Independence_desc: "Китайская Республика является независимым и суверенным государством, и любая попытка Китайской Народной Республики изменить это потерпит неудачу. Мы будем бороться за свою независимость!"
 CHI_Naturalization_of_the_Military: "Натурализация военных"
 CHI_Naturalization_of_the_Military_desc: "Если негражданин служил в Вооруженных силах Китайской Республики, он будет натурализован и станет гражданином Тайваня в знак признания их заслуг перед государством."
 CHI_Constitutional_Reform: "Конституционная реформа"
 CHI_Constitutional_Reform_desc: "Конституция Китайской Республики должна быть реформирована, чтобы заявить о нашем суверенитете, территории и независимости от коммунистического режима."
 CHI_Democratic_Progressive_Victory_1958: "Победа демократической прогрессивной партии 1958 г."
 CHI_Democratic_Progressive_Victory_1958_desc: "На выборах 1958 года победила Демократическая прогрессивная партия! ДПП известна своей левоцентристской и националистической позицией."
 CHI_Purchase_American_Weaponry: "Покупка американского оружия"
 CHI_Purchase_American_Weaponry_desc: "Чтобы не отставать от новых технологий, мы должны продолжать закупать оружие и оборудование в Соединенных Штатах по соображениям национальной обороны и безопасности."
 CHI_Trade_Deal_with_Indonesia: "Торговая сделка с Индонезией"
 CHI_Trade_Deal_with_Indonesia_desc: "Необходимо заключить торговую сделку с соседней державой Индонезией, чтобы получить нефть, газ и пальмовое масло. Взамен мы дадим им текстиль и товары народного потребления."
 CHI_Abandon_Hope: "Отказаться от надежды"
 CHI_Abandon_Hope_desc: "Это усилие бесполезно. Коммунистические силы находятся только за морем, и они скоро придут толпами и поработят нас всех. Мы должны оставить надежду и посмотреть правде в глаза."
 CHI_Political_Instability: "Политическая нестабильность"
 CHI_Political_Instability_desc: "Текущая ситуация характеризуется огромной политической нестабильностью. Фракции со всех сторон борются за власть, и вся страна находится в хаосе."
 CHI_Increase_Taiwanese_Repression: "Усиление тайваньских репрессий"
 CHI_Increase_Taiwanese_Repression_desc: "Мы должны ассимилировать коренных тайваньцев и заставить их полностью придерживаться принципов гоминьдана и правящего правительства. Любая оппозиция будет подавлена."
 CHI_Legacy_of_the_228_Incident: "Наследие инцидента 228"
 CHI_Legacy_of_the_228_Incident_desc: "Мы должны извиниться перед семьями жертв инцидента 228 и никогда не забывать об этой ужасной трагедии, случившейся с людьми."
 CHI_The_Formosan_Revolution: "Формозская революция"
 CHI_The_Formosan_Revolution_desc: "Народ должен восстать против коррумпированного и авторитарного гоминьдановского правительства! Мы не останемся под сапогом националистических репрессий!"
 CHI_The_Republic_of_Formosa_Provisional_Government: "Временное правительство Республики Формоза"
 CHI_The_Republic_of_Formosa_Provisional_Government_desc: "Теперь, когда мы свергли коррумпированное правительство Гоминьдана, мы должны создать для народа более демократическую, менее националистическую партию."
 CHI_Restore_Japanese_Relations: "Восстановить отношения с Японией"
 CHI_Restore_Japanese_Relations_desc: "Мы снова на Формозе, Япония должна более активно участвовать в наших отношениях и в региональной безопасности. Дипломатические отношения будут восстановлены."
 CHI_President_Thomas_Liao: "Президент Томас Ляо"
 CHI_President_Thomas_Liao_desc: "Томас Ляо был выдающимся основателем тайваньского движения за независимость. Теперь, когда мы стали Республикой Формоза, кажется справедливым назначить его президентом нового независимого государства."
 CHI_Equal_Rights: "Равные права"
 CHI_Equal_Rights_desc: "В отличие от политических репрессий и насильственной ассимиляции, проводимых гоминьдановским правительством, с каждым гражданином Формозы будут обращаться одинаково и иметь полные свободы."
 CHI_Formation_of_the_Democratic_Progressive_Party: "Формирование Демократической прогрессивной партии"
 CHI_Formation_of_the_Democratic_Progressive_Party_desc: "Необходимо создать Демократическую прогрессивную партию, чтобы продвигать идеи благосостояния и национализма для нашей новой республики."
 CHI_Promote_Formosan_Culture: "Продвигать формозскую культуру"
 CHI_Promote_Formosan_Culture_desc: "Мы должны способствовать самобытности коренных народов Формозы, мы будем известны не китайской культурой, а своей собственной."
 CHI_Ban_The_KMT: "Запретить Гоминьдан"
 CHI_Ban_The_KMT_desc: "Гоминьдан — коррумпированная и жестоко авторитарная партия. Их больше никогда не потерпят на Формозе. Мы не хотим их здесь."
 CHI_Seek_American_Aid: "Запрос американской помощи"
 CHI_Seek_American_Aid_desc: "Мы должны продолжать получать американскую помощь, несмотря на смену режима. Нам нужна помощь, чтобы помочь нам через успешную революцию и защиту наших берегов."
 CHI_Education_Reform: "Реформа образования"
 CHI_Education_Reform_desc: "Мы должны изменить программу изучения истории. Вместо того, чтобы прославлять прибытие Гоминьдана, мы должны винить их и способствовать большему образованию коренных народов Формозы."
 CHI_Free_Market_Reforms: "Свободные рыночные реформы"
 CHI_Free_Market_Reforms_desc: "Республика Формоза должна оставаться ведущей державой на мировой арене. Наша экономическая система должна быть реформирована, чтобы отражать открытую торговлю с каждой страной."
 CHI_One_China_One_Formosa: "Один Китай Одна Формоза"
 CHI_One_China_One_Formosa_desc: "Время пришло, мы должны перестать мечтать о возвращении материка. Гражданская война закончилась, и теперь нет никакой надежды сокрушить коммунистов. Мы примем нашу нынешнюю территорию, и ничего больше; Китай и Формоза теперь другие."
 CHI_Taiwanese_Communist_Party_Victory: "Победа тайваньской коммунистической партии"
 CHI_Taiwanese_Communist_Party_Victory_desc: "Коммунистическая партия Тайваня победила на выборах 1954 года! Коммунистическая партия Тайваня известна… ну… коммунизмом."
 CHI_Emulate_the_Japanese_Communist_Party: "Подражать коммунистической партии Японии"
 CHI_Emulate_the_Japanese_Communist_Party_desc: "Мы не должны поворачиваться к репрессивной сталинской политике. Подражая японским коммунистам, мы сосредоточимся на экономическом развитии, а не на авторитаризме."
 CHI_Increase_Welfare: "Повышение благосостояния"
 CHI_Increase_Welfare_desc: "Крайне важно, чтобы мы выделяли больше денег на здравоохранение и другие нужды, для улучшения жизни наших людей и повышения качества жизни для всех."
 CHI_Socialist_Values: "Социалистические ценности"
 CHI_Socialist_Values_desc: "Социалистические ценности могут быть полезны для Республики Формоза, мы должны начать консолидировать экономику в руках правительства и делать то, что лучше для нашего народа."
 CHI_Embrace_Secularism: "Объятия секуляризма"
 CHI_Embrace_Secularism_desc: "Религия мертва, и такие пустые занятия только отвлекут нас от нашего экономического развития и национальной обороны."
 CHI_Reconstruction: "Реконструкция"
 CHI_Reconstruction_desc: "Мы должны восстановиться после многих лет гражданской войны, политических репрессий и насилия. Формоза снова станет сильной."
 CHI_Universal_Elementary_Education: "Всеобщее начальное образование"
 CHI_Universal_Elementary_Education_desc: "Каждый ребенок в нашей стране, независимо от расы или пола, заслуживает равного и непредвзятого образования. Мы предоставим это."
 CHI_Reduce_Unemployment_Crisis: "Уменьшить кризис безработицы"
 CHI_Reduce_Unemployment_Crisis_desc: "Чтобы сократить безработицу, мы должны предложить людям работу в виде работы в правительстве или в промышленности. Это еще больше укрепит нашу экономику."
 CHI_Reduce_Land_Rent_Costs: "Снижение затрат на аренду земли"
 CHI_Reduce_Land_Rent_Costs_desc: "Сельское хозяйство на Тайване можно стимулировать, снизив стоимость аренды земли, что позволит простому человеку создать ферму и обеспечит всеобщее процветание."
 CHI_Promote_Domestic_Industry: "Содействовать отечественной промышленности"
 CHI_Promote_Domestic_Industry_desc: "Мы должны попытаться сохранить все производство исключительно на Тайване; мы не можем долго зависеть от иностранного импорта."
 CHI_Repatriate_Former_Japanese_Property: "Репатриация бывшей японской собственности"
 CHI_Repatriate_Former_Japanese_Property_desc: "То, что когда-то было японским, теперь наше. Любая японская собственность на Тайване станет государственной собственностью."
 CHI_The_Farmers_Fields_Bill: "Законопроект о фермерских полях"
 CHI_The_Farmers_Fields_Bill_desc: "Законопроект о фермерских полях будет принят Законодательным юанем, что даст фермерам больше прав и позволит продавать их излишки с высокой прибылью в пользу государства."
 CHI_American_Foreign_Aid: "Американская иностранная помощь"
 CHI_American_Foreign_Aid_desc: "От Соединенных Штатов требуется больше иностранной помощи, чтобы мы могли поддерживать нашу экономику и растущую систему социального обеспечения."
 CHI_Protectionism: "Протекционизм"
 CHI_Protectionism_desc: "Чтобы еще больше укрепить нашу экономику, мы должны быть вынуждены облагать налогом импорт, чтобы дать нашей отечественной промышленности преимущество на рынке Формозы."
 CHI_Increase_Literacy_Rates: "Повышение уровня грамотности"
 CHI_Increase_Literacy_Rates_desc: "Наша успешная система образования может только повысить уровень грамотности нашего населения и сделать людей все более и более умными!"
 CHI_Economic_Integration_of_Recent_Immigrants: "Экономическая интеграция недавних иммигрантов"
 CHI_Economic_Integration_of_Recent_Immigrants_desc: "Любые недавние иммигранты, будь то с материка или откуда-либо еще, будут быстро и эффективно интегрированы в домашнюю рабочую силу, где они станут гордыми образцами граждан Формозы."
 CHI_Womens_Rights: "Права женщин"
 CHI_Womens_Rights_desc: "Как часть нашей веры в личные свободы, женщинам должны быть предоставлены полные права на работу, голосование и образование, точно так же, как и любому мужчине."
 CHI_Establish_a_Minimum_Wage: "Установить минимальную заработную плату"
 CHI_Establish_a_Minimum_Wage_desc: "Времена непомерно низких зарплат прошли! В условиях инфляции правительство установит минимальную почасовую оплату, которую должен платить каждый работник, чтобы учесть стоимость жизни."
 CHI_Expand_the_Port_of_Kaohsiung: "Расширение порта Гаосюн"
 CHI_Expand_the_Port_of_Kaohsiung_desc: "Во время японской оккупации Тайваня было начато несколько проектов расширения, последний этап был прерван из-за Второй мировой войны. Мы должны продолжать это расширение, чтобы сделать Гаосюн крупным портом для Тайваня."
 CHI_Invest_in_Taipei: "Инвестиции в Тайбэй"
 CHI_Invest_in_Taipei_desc: "В Тайбэй, нашу сияющую столицу, нужно вкладывать значительные средства; он может стать центром международной торговли, и правительство Формозы должно сделать все, что в наших силах, для достижения этой цели."
 CHI_Urbanization: "Урбанизация"
 CHI_Urbanization_desc: "Мы должны урбанизировать крупные города и пригороды Тайваня, быстро растущему населению нужны места для жизни и работы, а города должны расширяться!"
 CHI_Lift_the_Ban_on_the_KMT: "Снять запрет на Гоминьдан"
 CHI_Lift_the_Ban_on_the_KMT_desc: "Даже если Гоминьдан был известен своим политическим угнетением и авторитаризмом, мы должны быть прозрачными в политическом процессе. Запрет будет снят, и Гоминьдан снова сможет действовать на Тайване."
 CHI_Promote_Democratic_Values: "Продвижение демократических ценностей"
 CHI_Promote_Democratic_Values_desc: "Мы не хотим, чтобы Тайвань вернулся к полицейскому государству под властью Гоминьдана, идея демократии должна быть внедрена в каждого гражданина, чтобы он был уверен в своей свободе и процветании."
 CHI_Housing_Reform: "Жилищная реформа"
 CHI_Housing_Reform_desc: "По мере роста населения правительство должно сделать жилье и доступ к нему более доступным и легким, особенно для людей с низким доходом в нашем обществе."
 CHI_Expand_Health_Access: "Расширение доступа к здравоохранению"
 CHI_Expand_Health_Access_desc: "Доступ к здравоохранению должен быть гарантирован каждому. Министерство здравоохранения и социального обеспечения должно приложить реальные усилия, чтобы сделать доступ к здравоохранению доступным для каждого гражданина Тайваня, независимо от его расы, пола или вероисповедания."
 CHI_Expand_Labor_Unions: "Расширение профсоюзов"
 CHI_Expand_Labor_Unions_desc: "Людям должна быть предоставлена возможность вести коллективные переговоры о правах трудящихся. Профсоюзы будут расширены, чтобы позволить обычному человеку получить права, которых он заслуживает, посредством демократического процесса. Мы больше не будем рабами!"
 CHI_Freedom_of_the_Press: "Свобода прессы"
 CHI_Freedom_of_the_Press_desc: "СМИ не будут такими, какими они были при Гоминьдане. Не будет государственных газет, а средствам массовой информации будет разрешено освещать правительство и политику без каких-либо последствий для свободы людей."
 CHI_Infrastructure_Modernization: "Модернизация инфраструктуры"
 CHI_Infrastructure_Modernization_desc: "Наши дороги, общественные здания, дамбы, каналы и порты должны быть модернизированы и обновлены с учетом меняющихся времен. Мы не можем допустить, чтобы наша жизненно важная инфраструктура устарела и разрушилась в такой процветающей и успешной стране."
 CHI_China_Democratic_Socialist_Party_Victory_1958: "Победа Демократической социалистической партии Китая в 1958 г."
 CHI_China_Democratic_Socialist_Party_Victory_1958_desc: "Демократическая социалистическая партия Китая победила на выборах 1958 года! CDSP известна своим левоцентристским демократическим социализмом, выступающим за мир во всем мире, индивидуальные свободы и системы социального обеспечения."
 CHI_The_Formosan_Welfare_State: "Формозское государство всеобщего благосостояния"
 CHI_The_Formosan_Welfare_State_desc: "Наша система социального обеспечения должна быть значительно расширена, чтобы позволить проявиться всем аспектам традиционного государства всеобщего благосостояния; Формоза должна быть известна отличной системой здравоохранения и государством всеобщего благосостояния!"
 CHI_Socialized_Health_Care: "Социализированное здравоохранение"
 CHI_Socialized_Health_Care_desc: "Правительство Формозы будет обеспечивать здравоохранение для своего народа за счет более низких затрат и планов медицинского обслуживания, которые обходятся простым людям очень мало для посещения больниц или стандартных осмотров."
 CHI_Establish_Pensions: "Установить пенсии"
 CHI_Establish_Pensions_desc: "Наши пожилые граждане должны быть обеспечены и заботиться так же, как и все остальные в нашей стране. Мы обеспечим пенсионные выплаты или пенсии пенсионерам, чтобы они могли комфортно жить в более поздние годы."
 CHI_Promote_World_Peace: "Содействовать миру во всем мире"
 CHI_Promote_World_Peace_desc: "Мы прекратили конфликт с коммунистическим Китаем и призываем все страны мира отложить в сторону свои идеологические или политические разногласия и сделать Землю более безопасным местом для всех."
 CHI_Condemn_Soviet_Imperialism: "Осудить советский империализм"
 CHI_Condemn_Soviet_Imperialism_desc: "Советский империализм зашел слишком далеко. Советское вмешательство в Восточной Европе, на Ближнем Востоке и в Юго-Восточной Азии зашло достаточно далеко."
 CHI_The_Plight_of_the_Indigenous_Formosans: "Бедственное положение коренных жителей Формозы"
 CHI_The_Plight_of_the_Indigenous_Formosans_desc: "Наши коренные жители Формозы сильно пострадали; высокая безработица, некачественное образование, культурная ассимиляция и утрата языков разорили коренное население."
 CHI_Rural_Investments: "Сельские инвестиции"
 CHI_Rural_Investments_desc: "Мы должны поддерживать нашу сельскохозяйственную промышленность, вкладывая больше средств в сельскую собственность, фермы и субсидии для сельскохозяйственных культур; это укрепит как наши внутренние, так и внешние рынки."
 CHI_China_Democratic_Socialist_Party_Victory: "Победа Демократической социалистической партии Китая"
 CHI_China_Democratic_Socialist_Party_Victory_desc: "Демократическая социалистическая партия Китая победила на выборах 1958 года! CDSP известна своим левоцентристским демократическим социализмом, выступающим за мир во всем мире, индивидуальные свободы и системы социального обеспечения."
 CHI_Reform_the_Formosan_Navy: "Реформировать военно-морской флот Формозы"
 CHI_Reform_the_Formosan_Navy_desc: "Наш флот должен быть реформирован, как в оснащении, так и в офицерском составе; Военно-морской флот Формозы должен быть реформирован, чтобы отразить оборонительную стратегию, используя новейшее оборудование и тактику обучения."
 CHI_Relations_With_South_Vietnam: "Отношения с Южным Вьетнамом"
 CHI_Relations_With_South_Vietnam_desc: "Крайне важно, чтобы правительство Формозы как можно скорее установило дипломатические отношения с Южным Вьетнамом, поскольку это еще одна азиатская страна, которой угрожают коммунистические революционеры."
 CHI_Attract_Formosan_Loyalists: "Привлечь формозских лоялистов"
 CHI_Attract_Formosan_Loyalists_desc: "Необходимо привлекать и поддерживать сторонников движения Формоз и коренных народов, нам нужно больше разнообразия и прозрачности в нашем правительстве."
 CHI_A_Free_Formosa: "Свободная Формоза"
 CHI_A_Free_Formosa_desc: "Формоза должна быть освобождена от подлости коммунистического режима Китая! Наши войска должны быть обучены защищать нашу страну!"
 CHI_Cooperate_with_the_Treaty_Ports: "Сотрудничать с портами Договора"
 CHI_Cooperate_with_the_Treaty_Ports_desc: "Мы должны продолжать сотрудничать с договорными портами, навязанными нам западными державами, что позволит нам в дальнейшем торговать с остальным миром."
 CHI_Reform_the_Tax_Code: "Реформа Налогового кодекса"
 CHI_Reform_the_Tax_Code_desc: "Наша налоговая система должна быть переработана таким образом, чтобы наши самые богатые граждане платили больше налогов и не могли уклоняться от уплаты налогов; наши налоги необходимы для работы правительства и успеха нашей страны."
 CHI_New_Taiwan_Dollars: "Новые тайваньские доллары"
 CHI_New_Taiwan_Dollars_desc: "Чтобы полностью решить наш кризис гиперинфляции, мы введем новую форму тайваньского доллара. Этот доллар будет равен 40 000 старых тайваньских долларов, и правительство с радостью обменяет всю валюту на новую версию."
 CHI_Socialist_Unions: "Социалистические союзы"
 CHI_Socialist_Unions_desc: "Рабочие должны объединяться не только в союзы, но и в группы, продвигающие ценности социализма и средства производства."
 CHI_Distance_Ourselves_From_Maoism: "Дистанцироваться от маоизма"
 CHI_Distance_Ourselves_From_Maoism_desc: "Китайские принципы коммунизма, более известные как маоизм, гнусны и не подходят для такой страны, как Тайвань. Мы будем использовать принципы югославского социализма вместо авторитарных и деструктивных идей маоизма."
 CHI_Soviet_Aid: "Помощь от СССР"
 CHI_Soviet_Aid_desc: "Мы обратимся за помощью к Советскому Союзу, чтобы помочь в нашем военном и экономическом развитии. Мы принимаем исключительно социалистическую форму правления, и СССР получит пользу от наших трудов."
 CHI_Establishing_a_Taiwanese_Identity: "Создание тайваньской идентичности"
 CHI_Establishing_a_Taiwanese_Identity_desc: "Наша национальная идентичность должна основываться на исконных идеалах Тайваня, нашего дома. Мы не будем поддерживать никакие другие идеалы, кроме уникальной тайваньской идентичности."
 CHI_Limited_Collectivization: "Ограниченная коллективизация"
 CHI_Limited_Collectivization_desc: "Чтобы укрепить нашу сельскохозяйственную промышленность, мы будем добиваться ограниченного создания государственных или коллективных ферм, находящихся в ведении национального правительства; это централизует наше снабжение продовольствием и сельскохозяйственные методы и обеспечит равенство по всей стране."
 CHI_Ties_with_North_Korea: "Связи с Северной Кореей"
 CHI_Ties_with_North_Korea_desc: "Теперь, когда мы перешли к социалистическому правительству, мы должны подружиться с Корейской Народно-Демократической Республикой (КНДР), еще одной великой социалистической азиатской страной, известной своей экономической мощью и процветанием!"
 CHI_Encourage_Indigenous_Culture: "Поощрять культуру коренных народов"
 CHI_Encourage_Indigenous_Culture_desc: "Наши коренные граждане Тайваня должны быть приняты за их культуру и разные языки. Мы не должны пытаться внедрить их в нашу культуру, а должны уважать их."
 CHI_Egalitarian_Reforms: "Эгалитарные реформы"
 CHI_Egalitarian_Reforms_desc: "Все люди на Тайване должны быть равны; мы должны реформировать наше правительство и наше общество, чтобы отразить равенство всех, не основанное на поле, расе или классе."
 CHI_Soviet_Advisors: "Советские инструкторы"
 CHI_Soviet_Advisors_desc: "Мы должны приветствовать советников из СССР в нашей стране для помощи нам в наших экономических и военных делах."
 CHI_Join_COMECON: "Присоединиться к СЭВ"
 CHI_Join_COMECON_desc: "СЭВ, или Совет Экономической Взаимопомощи, является организацией Восточного блока, призванной помогать всем социалистическим странам в их экономических делах, чтобы сделать их сильными. Мы присоединимся к СЭВ, так как любая экономическая поддержка со стороны наших новых союзников будет выгодна."
 CHI_Condemn_Maoism: "Осудить маоизм"
 CHI_Condemn_Maoism_desc: "Идеология маоизма ущербна, и мы не можем ее терпеть. Как гордая социалистическая страна, мы должны осудить маоизм как ошибочную философию, которой он является сегодня."
 CHI_Aid_the_Vietminh: "Помощь Вьетминю"
 CHI_Aid_the_Vietminh_desc: "Вьетминь, вьетнамская антиимпериалистическая организация, привержена идеалам вьетнамского социализма и свободы от французского колониализма. Мы должны помочь в их партизанских усилиях!"
 CHI_Taiwanese_Communist_Party_Victory_58: "Победа Коммунистической партии Тайваня в 1958 г."
 CHI_Taiwanese_Communist_Party_Victory_58_desc: "Коммунистическая партия Тайваня победила на выборах 1958 года! Коммунистическая партия Тайваня известна… ну… коммунизмом."
 CHI_Reformation_of_the_State_and_Party: "Реформа государства и партии"
 CHI_Reformation_of_the_State_and_Party_desc: "Крайне важно, чтобы мы реформировали элементы государства, чтобы обеспечить политическое и экономическое процветание на благо народа."
 CHI_Reform_the_Secret_Police: "Реформа тайной полиции"
 CHI_Reform_the_Secret_Police_desc: "Наша тайная полиция должна быть реформирована и переквалифицирована, чтобы она отражала новую социалистическую государственную идеологию вместо прежнего, фашистского режима."
 CHI_A_New_KMT: "A New Kuomintang"
 CHI_A_New_KMT_desc: "We will continue to pursue reforms within the Kuomintang which will greatly shift the structure of our political system. The Kuomintang shall no longer be the corrupt and despotic party of the Chiang and Soong family! The new Kuomintang will appeal to the common people on Taiwan and serve their interests in the name of the Three Principles of the People. For Democracy, Welfare and Nationalism!"
 CHI_Reduce_Censorship: "Уменьшить цензуру"
 CHI_Reduce_Censorship_desc: "Наш народ должен иметь возможность выражать свои взгляды без политических репрессий, как это делал последний режим. Мы снизим цензуру и контроль над СМИ."
 CHI_American_Investors: "Американские инвесторы"
 CHI_American_Investors_desc: "Американским инвесторам нужно разрешить вкладывать средства в нашу быстрорастущую экономическую систему, это будет выгодно как нашей экономике, так и самим инвесторам."
 CHI_CIA_Observers: "Наблюдатели ЦРУ"
 CHI_CIA_Observers_desc: "Американское центральное разведывательное управление (ЦРУ) получит большую пользу от наблюдателей на Тайване; Наше расположение идеально подходит для наблюдения за передвижениями коммунистов-китайцев вдоль побережья."
 CHI_Focus_on_the_Defensive: "Сосредоточиться на обороне"
 CHI_Focus_on_the_Defensive_desc: "Мы должны быть готовы к любым непредвиденным обстоятельствам. Китайские коммунисты сейчас способны на многое, и наша военная политика должна быть направлена на защиту Тайваня."
 CHI_Bolster_the_Viet_Quoc: "Поддержать Национальной партии Вьетнама"
 CHI_Bolster_the_Viet_Quoc_desc: "Вьеткуок, или VNQDD, — вьетнамская националистическая партия, выступающая за свободу от французского колониального господства. Мы должны поддерживать эту партию в ее антиимпериалистических действиях."
 CHI_Open_Up_to_Foreign_Investment: "Открыться для иностранных инвестиций"
 CHI_Open_Up_to_Foreign_Investment_desc: "Важно поддержать нашу экономику, разрешив иностранные инвестиции в наши отрасли и предприятия. Это пойдет на пользу и нашей экономике, и всему миру."
 CHI_Join_SEATO: "Присоединиться к СЕАТО"
 CHI_Join_SEATO_desc: "С созданием Организации Договора о Юго-Восточной Азии необходимо, чтобы Тайвань присоединился к этой организации для борьбы с агрессией Китайской Народной Республики, Северной Кореи и Северного Вьетнама."
 CHI_American_Backed_Economic_Reforms: "Американская поддержка экономической реформы"
 CHI_American_Backed_Economic_Reforms_desc: "Для нас было бы честью использовать американские идеи для реформирования нашей экономики и сделать ее более процветающей, чем когда-либо!"
 CHI_Tolerate_Political_Dissenters: "Терпение политических инакомыслящих"
 CHI_Tolerate_Political_Dissenters_desc: "Свобода мнений — самый важный аспект демократии, и политическое инакомыслие на Тайване будет принято, но не поощрено."
 CHI_Economic_Growth: "Экономический рост"
 CHI_Economic_Growth_desc: "Наша экономика должна стать сильной, и необходимо быстро провести быструю индустриализацию, чтобы Тайвань стал известен во всем регионе как процветающая электростанция."
 CHI_Increase_Relations_with_Vietnam_and_Korea: "Улучшить отношения с Вьетнамом и Кореей"
 CHI_Increase_Relations_with_Vietnam_and_Korea_desc: "И Вьетнам, и Корея поражены ужасами коммунистического врага. В подобной ситуации мы должны поддержать их и объединиться с ними, чтобы разделить общую связь."
 CHI_Cut_Our_Foreign_Losses: "Сократить наши зарубежные потери"
 CHI_Cut_Our_Foreign_Losses_desc: "Наши инвестиции в зарубежные страны и экспорт не окупаются. Вместо того, чтобы продолжать терять ценные деньги, мы отменим все сделки."
 CHI_Lift_the_Martial_Law: "Отменить военное положение"
 CHI_Lift_the_Martial_Law_desc: "Годы паранойи и авторитаризма закончились. Мы должны вернуться к демократическим и ненасильственным методам нашего прошлого. Военное положение будет отменено."
 CHI_Allow_Formation_of_New_Parties: "Разрешить создание новых партий"
 CHI_Allow_Formation_of_New_Parties_desc: "Предоставляя больше свободы, людям будет разрешено создавать новые политические партии, выражать свое мнение о правительстве и пробуждать больше демократии среди населения."
 CHI_Limited_Democracy: "Ограниченная демократия"
 CHI_Limited_Democracy_desc: "У народа может быть демократия, но мы не должны забывать об агрессивных действиях КНР и других злых коммунистических стран в регионе и делать все возможное, чтобы предотвратить это."
 CHI_Limit_American_Influence: "Ограничить американское влияние"
 CHI_Limit_American_Influence_desc: "Американцы сделали достаточно на Тайване. Мы независимы, и, хотя мы стремимся остановить распространение коммунизма, США не могут контролировать нашу демократию."
 CHI_State_Visit_From_Washington: "Государственный визит из Вашингтона"
 CHI_State_Visit_From_Washington_desc: "Мы с радостью пригласим американского президента посетить Тайвань и вместе обсудить демократию и безопасность в азиатском регионе, способствуя миру и процветанию."
 CHI_Embrace_Capitalism: "Объятия капитализма"
 CHI_Embrace_Capitalism_desc: "Капитализм означает успех для Тайваня, и наши недавние успехи в построении экономики и иностранных инвестициях точно доказали тот факт, что рынок означает для нас хорошие вещи."
 CHI_Militarist_Propaganda: "Милитаристская пропаганда"
 CHI_Militarist_Propaganda_desc: "Наши вооруженные силы должны быть сильными, чтобы защитить наши берега от коммунистов! Мы должны активно вербовать."
 CHI_Prepare_for_Operation_National_Salvation: "Готовиться к операции «Национальное спасение»."
 CHI_Prepare_for_Operation_National_Salvation_desc: "Пришло время уйти от Тайваня и вернуть материк. Мы снова будем бороться за контроль над материком!"