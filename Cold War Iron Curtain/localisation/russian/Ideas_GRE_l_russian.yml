 GRE_disorganized_health: "Дезорганизованная система здравоохранения"
 GRE_disorganized_health_desc: "Греческая система здравоохранения страдает от острой нехватки средств, так как только 2% государственного бюджета выделеяется на нёё. Соответственно, качетсво услуг, предоставляемых нашим гражданам, ужасно, и положение ухудшается с каждым днём."
