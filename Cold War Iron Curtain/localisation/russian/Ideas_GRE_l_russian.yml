 GRE_Diaspora: "Греческая диаспора"
 GRE_Diaspora_desc: "После масштабных разрушений, принесенных нашей стране Второй мировой и Гражданской войнами, многие греки покидают свою страну в поисках лучшей жизни в других странах. Это приводит к огромной утечке мозгов и потере необходимой рабочей силы. Если мы в значительной степени стабилизируем и улучшим нашу страну, возможно, однажды они вернутся."
