 GRE_law_511_harsh_desc: "С принятием закона 511, Греческое государство создало концетрационные лагеря на островах Макронисос, Йиарос, Агиос-Стратис, куда были направлены солдаты с левыми и коммунистическими взглядами с целью исполнения своей 'воинской обязанности'"
