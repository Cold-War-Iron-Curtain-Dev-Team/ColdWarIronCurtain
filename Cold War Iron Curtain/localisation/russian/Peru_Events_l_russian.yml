l_russian:
 peru.1.d: "Нам нужно выбрать, кто будет президентом Республики, с одной стороны, у нас есть Военная Хунта де Гоберно ... и никто другой"
 peru.2.d: "Настало время выбрать, кто будет президентом Республики. С одной стороны, у нас есть Демократическое Движение Перу, возглавляемая Мануэлем Прадо Угартеше, а с другой - Фернандо Белонде Терри, возглавляющий Национальный Фронт Ювентудской Демократической Республики."
