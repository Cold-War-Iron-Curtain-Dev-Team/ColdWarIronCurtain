l_english:
 BAN_FOR.1.d: "Страна-посредник привезла сообщение из Бангладеш. Они просят нормализации наших отношений. До этого момента мы оставались непоколебимыми в поддержке Пакистана, не вступая в контакт с новым государством. Однако международная ситуация такова, что мы не можем игнорировать новое азиатское государство. Пакистан ценит нашу поддержку, но не будет держать на нас зла за начало связей с другими странами. Бангладеш стратегически расположен вдоль Бенгальского залива, на восточной границе Индии. Потенциально эта страна могла бы стать для нас важным союзником. У нас есть два варианта, один - установить дружественные дипломатические отношения, это, скорее всего, не заденет чувств Пакистана. Другой вариант - предложить пакт о торговле и военной помощи, чтобы показать нашу заинтересованность в стратегическом партнерстве, но это, вероятно, разозлит пакистанское правительство"
 BAN_FOR.2.d: "Китайское правительство согласилось установить с нами полноценные дипломатические отношения. Бывшее китайское консульство в Дакке будет преобразовано в полноценное посольство, ожидается, что вскоре будет объявлено о назначении нового посла. Нам также было предложено открыть посольство в Пекине. Китай остается жизненно важной азиатской державой, и установление тесных связей поможет гарантировать, что мы никогда не будем полностью зависеть от Индии в будущем. Это важный импульс для нашей внешней политики и придает нашему народу большую легитимность на международном уровне"
 BAN_FOR.3.d: "Китайское правительство очень позитивно отреагировало на наш призыв к дипломатической нормализации. Они предложили пакт о предоставлении благоприятных условий торговли и военной помощи. Предлагаемая помощь могла бы помочь оснастить стрелковым оружием несколько пехотных батальонов. Наше высшее военное и экономическое руководство очень заинтересовано в этом предложении. Однако ведущие политические и дипломатические эксперты отмечают, что если мы примем эту поддержку, то оттолкнем Индию. Индийцы не будут благосклонно относиться к увеличению китайского присутствия на нашей земле. Вместо этого они считают, что мы должны оценить предложение, но придерживаться поддержания дружеских связей. Мы должны решить, стоит ли военная помощь и экономическая поддержка того, чтобы оттолкнуть нашего крупнейшего соседа"
 BAN_FOR.4.d: "Недавно новое независимое государство Бангладеш обратилось к нам с просьбой прислать экспертов для укрепления их экономики и вооруженных сил. Правительство поддерживает стремление принять социалистическую экономическую модель, чтобы поднять свой обнищавший народ. В нашем анализе отмечается, что, хотя правительство и его сторонники поддерживают социализм, у многих бангладешцев есть оговорки. Особенно в вооруженных силах и среди консервативных элементов. Наша помощь могла бы помочь правительству добиться успеха и все больше убеждать население в конечном итоге принять тотальное социалистическое общество. Однако некоторые сообщения свидетельствуют о том, что страна слишком неразвита экономически или социально, чтобы сделать нашу помощь эффективной. Возможно, было бы лучше просто сосредоточиться на укреплении связей. Необходимо будет принять решение"
 BAN_FOR.5.d: "Правительство и средства массовой информации недавно приветствовали прибытие советских экспертов в Дакку. В ближайшие недели ожидается прибытие большего числа советников, поскольку консультативный комитет организует свою деятельность в стране. Мы приветствуем этих советников, предлагающих поддержку министерствам финансов и обороны. Социализм предлагает лекарство от бангладешской бедности и классовых разногласий. Советские эксперты будут пользоваться нашим полным сотрудничеством. Военные отказали в разрешении любым советским экспертам посетить какой-либо военный штаб или полевые подразделения или внедриться в них. Они ссылаются на соображения безопасности, но со временем мы надеемся, что более реакционные офицеры могут быть заменены "
 BAN_FOR.6.d: "Правительство Бангладеш в частном порядке обратилось с просьбой об их доле в федеральных активах. Бангладешцы утверждают, что их провинция оказала значительную финансовую поддержку федеральному правительству и хотела бы, чтобы эти оставшиеся активы были немедленно возвращены. Сложившаяся ситуация ставит нас в неловкое положение. Министерство финансов располагает документами и считает, что правительство могло бы вернуть эти конкретные активы, собранные в бывшем Восточном Пакистане. Учитывая, как они покинули страну, многие в кабинете предпочли бы, чтобы мы не давали ни цента. Другие утверждают, что часть можно было бы вернуть, это помогло бы нашим отношениям. Наконец, мы могли бы вернуть все активы, что в значительной степени способствовало бы укреплению связей"
 BAN_FOR.7.d: "Недавно мы попросили правительство Пакистана вернуть те активы и капитал, которыми владеет федеральное правительство за счет наших провинциальных взносов в центр. Мы не ожидали положительного ответа Пакистана, но были приятно удивлены. Пакистанцы подписали соглашение, обещающее вернуть активы в течение следующих двух лет. Это придаст импульс нашей экономике и поможет стабилизировать наш собственный рост. Однако стоимость активов, по-видимому, составляет лишь небольшой процент от причитающейся суммы. Пакистанцы настаивают на том, что их предложение не может быть увеличено. Как бы то ни было, важно, что они согласились отдать все, что угодно, и помогут нашим связям"
 BAN_FOR.8.d: "Недавно мы попросили правительство Пакистана вернуть те активы и капитал, которыми владеет федеральное правительство за счет наших провинциальных взносов в центр. Мы не ожидали положительного ответа Пакистана, но были очень удивлены. Пакистанцы подписали соглашение, обещающее вернуть активы в течение следующих пяти лет. Это придаст импульс нашей экономике и стабилизирует наш рост. Стоимость, предложенная пакистанцами, соответствует нашим собственным расчетам, похоже, пакистанцы искренне заинтересованы и готовы вернуть активы. Это значительное событие и, возможно, указывает на будущее сотрудничества и братство между нашими государствами"
 BAN_FOR.9.d: "Наш посол в Дакке получил запрос от министра иностранных дел Бангладеш. Министр призвал наши две страны провести переговоры по демаркации границы. В настоящее время на обеих наших территориях существует множество анклавов, и население приграничных районов считает ситуацию проблематичной. Урегулирование вопроса о границе потенциально укрепило бы связи и сделало бы границу менее хаотичной для ее жителей. Однако наши эксперты отмечают, что ряд наших анклавов, по сути, окружен Бангладеш. Демаркация может привести к тому, что мы потеряем деревни и граждан Бангладеш. Если это потенциал, который мы можем принять, тогда переговоры могут состояться, если нет, мы должны вежливо отказаться от переговоров"
 BAN_FOR.10.d: "Правительство Индии согласилось провести переговоры в Калькутте по поводу нашей границы. В настоящее время мы собираем мощную команду, и нам необходимо разработать стратегию ведения переговоров. Индийцы указали, что они хотят услышать наши решения по этому вопросу и вести переговоры оттуда. Одно из предложений, которое мы разработали, призывает обе стороны уступить анклавы на границе друг другу. Это изменило бы национальную принадлежность деревень анклава. Его жители могли либо остаться и получить свое новое гражданство, либо репатриироваться. Другое предложение укрепило бы границы, но потребовало бы перемещения населения. Все бангладешцы в анклавах, захваченных Индией, будут возвращены, и наоборот. У жителей деревни не было бы выбора при таком решении. Мы должны решить, какую позицию предложить"
 BAN_FOR.11.d: "Мы ведем переговоры с Бангладеш в Калькутте по поводу нашей границы. В частности, существует озабоченность в отношении анклавных деревень, удерживаемых обеими сторонами. Бангладешцы предложили обеим сторонам уступить эти анклавы, окруженные другой державой. Затем сельским жителям будет предоставлена возможность либо принять гражданство своей новой страны, либо репатриироваться. Бангладешское правительство считает, что это стабилизирует границу, предоставляя сельским жителям возможность выбора. Наши переговорщики считают, что соглашение может помочь стабилизировать границу, но дает сельским жителям лишь иллюзию выбора, отмечая, что тем, кто желает сохранить свое индийское гражданство, придется покинуть родину. Это оказало бы давление на местные власти с целью переселения тех граждан, которые, возможно, не стоят беспокойства. Тем не менее, участники переговоров также признают, что соглашение положит конец анклавной головной боли, которая мучила пограничные земли после разделения."
 BAN_FOR.12.d: "Мы ведем переговоры с Бангладеш в Калькутте по поводу нашей границы. В частности, существует озабоченность в отношении анклавных деревень, удерживаемых обеими сторонами. Бангладешцы предложили обеим сторонам уступить эти анклавы, окруженные другой державой. Однако они настаивают на том, чтобы все жители анклавов были переведены, что означает, что наши граждане в наших анклавах будут переданы нам. Мы также вернули бы граждан Бангладеш обратно из их анклавов в Индии. Это предложение решительным образом решило бы проблему, однако у наших переговорщиков есть опасения. У нас гораздо больше граждан, которые были бы насильственно депортированы из домов своих предков. Это, вероятно, усилит напряженность и окажет давление на местные власти с целью переселения беженцев. Правительство должно принять решение об ответных мерах"
 BAN_FOR.13.d: "Переговоры о границе в Калькутте между Бангладеш и Индией не привели к урегулированию напряженности. В настоящее время по обе стороны границы существуют сотни анклавов и царит полная неразбериха в сочетании со случайными пограничными столкновениями. Бангладешцы заинтересованы в решении вопроса об анклавах. Однако индейцев больше интересовали жители анклава. Правительство Индии настаивает на том, что любое решение проблемы анклавов должно предоставлять жителям возможность сохранить свою национальную идентичность и доступ к землям предков. Правительство Бангладеш считает это нереалистичным. Несмотря на неудачу, обе стороны согласились продолжить обсуждения по всем нерешенным вопросам"
 BAN_FOR.14.d: "После переговоров в Калькутте Индия и Бангладеш договорились разрешить свой пограничный спор путем перемещения населения. Всем жителям анклавов будет предложено выбрать свою национальную принадлежность. Те бангладешцы, которые проживают в анклавах на индийской стороне границы, будут репатриированы. Аналогичным образом, индийские граждане, проживающие в анклавах в Бангладеш, также будут переселены в Индию. Этот процесс займет несколько месяцев, но обе стороны ожидают, что он разрешит большую часть пограничной напряженности. Бангладешская общественность недовольна результатом, полагая, что правительство отказалось от большего, поскольку Бангладеш контролировал большую часть анклавов. Однако правительства Бангладеш и Индии подчеркнули, что это решение будет взаимовыгодным для всех участников"
 BAN_ECON.1.d: "Народ Бангладеш заслуживает мира и процветания. Наш народ веками был жертвой колониальной эксплуатации и теперь сам распоряжается своей судьбой. Недавно правительство получило два проекта пятилетних планов. Один из них, разработанный ведущими политическими лидерами и учеными, предусматривает переход нации к социализму. Этот план предлагает амбициозные усилия по обеспечению динамичного мышления для роста общества. Другой план, разработанный традиционной бюрократией, предлагает более скромную серию реформ, направленных на превращение Бангладеш в стабильную и независимую экономику. Многие в правительстве одобряют академический план, поскольку он предлагает новый подход к экономическому развитию и отходит от традиционных механизмов. Однако слишком быстрые изменения могут вызвать проблемы у молодого государства"
 BAN_ECON.2.d: "Джут остается одной из наиболее важных отраслей промышленности в Бангладеш и исторически является причиной того, что наша страна была колонией. Британцы, а затем пакистанцы управляли джутовыми фабриками, уничтожая богатство страны. С обретением независимости многие из этих джутовых фабрик бездействуют. Некоторые рекомендовали правительству выставить эти фабрики на аукцион частным предприятиям и корпорациям. Однако это только подстегнуло бы новую волну эксплуатации. Правительство начнет процесс национализации этих джутовых фабрик и начнет их использование. Рабочие и фабрики теперь будут находится под контролем государства"
 BAN_ECON.3.d: "В недавнем отчете отмечается, что производство джута в стране намного ниже, чем в период до обретения независимости. Расходы на джутовую промышленность также намного выше. Профсоюзы обвиняют в том, что они создают чрезмерные трудности для руководителей. Руководство также столкнулась с резкой критикой. Его членов обвиняют в прогулах и неквалифицированности. Многие члены Бангладешского совета по джуту являются назначенцами, которые мало что знают об этой отрасли. Несмотря на эти серьезные неудачи, правительство настаивает на том, что оно не будет приватизировать заводы, хотя и пообещало борьбу с неэффективностью. Существуют планы ликвидировать Бангладешский джутовый совет и передать его в ведение Министерства финансов"
 BAN_ECON.4.d: "Комитет экономистов и высокопоставленных чиновников недавно опубликовал отчет о результатах расследования деятельности джутового совета Бангладеш. Они отметили, что усилия по борьбе с неэффективностью оказались неэффективными. Профсоюзами по-прежнему трудно управлять, особенно с руководством с небольшим опытом работы в бизнесе или джутовой промышленности. Недавняя реформа в ходе которой было создано отдельное министерство джута для сокращения расходов оказала незначительное влияние. В докладе рекомендуется, чтобы правительство начало приватизацию заводов, которые финансируются из государственного бюджета и не приносят прибыли. Однако многолетняя приверженность государственному контролю приводит к тому, что полная приватизация невозможна. Правительство планирует постепенно приватизировать некоторые джутовые фабрики, чтобы улучшить ситуацию и оценить результататы"
 BAN_ECON.5.d: "Следуя рекомендациям экспертного комитета, правительство недавно приватизировало около дюжины джутовых фабрик. Кроме того, правительство осуществило ряд мер для стимулирования экономического роста. Однако недавняя оценка показывает, что частные джутовые фабрики производят столько же или лишь немного больше, чем государственные. Это печальная новость для экономики, хотя отчет дает больше доказательств тем, кто выступает за то, чтобы правительство не отказывалось полностью от своей доли в отрасли. Правительство заявило, что сократит темпы приватизации, но продолжит предоставлять субсидии отрасли."
 BAN_ECON.10.d: "Министерство финансов выпустило ряд нормативных актов, регулирующих производственные отношения между руководством и работниками. Они предназначены для того, чтобы лучше определить, какие именно средства правовой защиты имеются у обеих сторон в отношении переговоров или объявления забастовок. Рабочие группы критикуют это решение, отмечая, что в Бангладеш по-прежнему отсутствует жизненно важное законодательство о правах рабочих, что дает владельцам фабрик несправедливое преимущество. Ведущая бизнес-ассоциация также раскритиковала правила как дорожную карту, позволяющую работникам эффективно проводить акции протеста, не нарушая закон. Несмотря на эти критические замечания, министерство финансов настаивает на том, что это решение поможет разрешить текущие конфликты и в будущем улучшить ситуацию на фабриках"
 BAN_ECON.11.d: "Джут является жизненно важной отраслью для Бангладеш. В колониальный период джут, произведенный в нашей стране, отправлялся на переработку на территорию нынешней Индии. Несмотря на потенциал и обещания, мало что было сделано для создания перерабатывающих фабрик в самом Бангладеш. Чтобы исправить это, на международном уровне предлагаются новые стимулы для поощрения иностранных инвестиций в джутовую промышленность. Бангладеш обладает потенциалом для значительного роста, но для этого необходима финансовая помощь из-за рубежа. Представительства в других странах вскоре начнут распространять информацию о новых возможностях"
 BAN_ECON.12.d: "Наши усилия по привлечению иностранных инвестиций для расширения мощностей по переработке джута принесли определенные плоды. Мы получили финансирование от некоторых организаций по развитию и нескольких инвестиционных групп. Однако это меньше, чем мы ожидали, когда начинали эту работу. Похоже, большинство людей по-прежнему рассматривают нашу страну как рискованную инвестицию. Несмотря на это, мы можем расширить некоторые из наших перерабатывающих мощностей, что станет благом для экономики. Что еще более важно, это позволяет нам получать больше прибыли, экспортируя продукцию, произведенную из джута, а не просто сырье"
 BAN_ECON.13.d: "Наши усилия по привлечению иностранных инвестиций для расширения мощностей по переработке джута принесли плоды. Дипломатические представительства и министерство финансов были засыпаны запросами от инвестиционных групп и организаций, заинтересованных в предлагаемой программе. Похоже, многие считают нашу страну страной возможностей. Мы можем не только значительно расширить переработку джута в стране, но и привлечь достаточное количество иностранных партнеров, чтобы максимизировать возможности получения прибыли. Это большой успех для Бангладеш"
 BAN_ECON.14.d: "В настоящее время мы имеем дополнительный интерес к иностранным инвестициям в Бангладеш. Министерство финансов считает, что в интересах страны будет, если мы вложим проинвестрированные деньги в конкретную область, чтобы максимизировать ее развитие. Некоторые эксперты считают, что мы должны направить деньги на создание инфраструктуры по всей стране. Другие эксперты считают, что развитие энергетики имеет первостепенное значение для создания основы будущего экономического роста. Некоторые из высшего руководства настаивают на том, что основное внимание следует уделять новым отраслям промышленности, чтобы создать больше рабочих мест. Решение должно быть принято в ближайшее время"
 BAN_ECON.15.d: "Пакистанское правительство продолжало удерживать большие участки земли, которые оно унаследовало от британского колониального правительства. Позже военные захватили часть земель, якобы по соображениям безопасности. После обширного обследования правительство выявило большое количество пригодных для сельского хозяйства земель, которые могут быть возвращены крестьянам. Нужно просто определить, как распределить землю. Один из вариантов - распределить землю между безземельными крестьянами. Другой вариант предусматривает продажу этих земель. Сторонники первого варианта считают, что это улучшит состояние крестьян в стране и исправит проблему с их угнетением. Те, кто хочет продажи земель отмечают, что если кто-то купит землю, то он, скорее всего, вложит нужные деньги, чтобы сделать ее полезной"
 BAN_ECON.16.d: "Наши крестьяне взбешены решением распродать излишки государственных земель. Они утверждают, что эта земля должна была быть отдана людям, которые отчаянно в ней нуждаются. Многие крестьянские семьи утверждают, что у них практически нет возможности получить землю, и их все чаще принуждают работать на крупных землевладельцев. Некоторых чиновников обвиняют в присвоении прибыли от продаж. Участились случаи, когда крестьяне отказывались работать или уменьшали объем выполняемой работы в знак протеста против того, что они считают тяжелой ситуацией"
 Rahman_Assasination.1.d: "В Дакке царит хаос после сообщений о том, что вооруженные люди в форме взяли штурмом резиденцию президента, шейха Муджибура Рахмана. Поступают сообщения о взрывах и стрельбе в резиденции. Бангладешцы находятся в состоянии тревоги, пытаясь понять, что происходит. Недавний всплеск насилия, преступности и экономический кризис значительно подорвали популярность президента. Говорят, что военные также обеспокоены этими кризисами, поскольку они оказались вовлеченными в конфликт с радикально-социалистической парией НСПБ (Национальная Социалистическая Партия Бангладеш"
 Rahman_Assasination.2.d: "Государственные СМИ Бангладеш подтвердили, что патриотически настроенные офицеры ответственны за нападение на резиденцию президента. После убийства офицеры вышли в эфир, чтобы подтвердить, что они убили Муджибура Рахмана, чтобы спасти нацию. Среди погибших - двое его сыновей, которые рассматривались как его будущие преемники. Две его дочери находятся в Западной Германии. Всего несколькими годами ранее миллионы приветствовали Муджибура Рахмана как своего лидера, однако реакция на его смерть в значительной степени сдержанная. Похоже, экономический кризис и другие внутренние проблемы в значительной степени подорвали его авторитет среди народа. Неясно, кто сейчас возглавляет правительство. Военные продолжают хранить молчание о своей роли в этом перевороте. В переворот вовлечены офицеры среднего звена, а офицеры более высокого ранга, похоже, так же шокированы произошедшим, как и народ"
 Rahman_Assasination.3.d: "Беспрецедентным событием стало то, что Хондакер Мостак Хан провозгласил себя новым президентом Бангладеш. Он известный лидер националистов и член исполнительного комитета. Новый лидер, по-видимому, пришел к власти при поддержке лидеров переворота. Аналитики полагают, что участники переворота считали, что их низкие звания делают их уязвимыми, но новый президент узаконит их действия. Новый президент действительно работал с шейхом Муджибуром Рахманом. До прихода в исполнительный комитет он занимал пост министра в правительстве. Некоторые эксперты полагают, что его избрание президентом призвано умиротворить вооруженное крыло Авами Лиг и предотвратить либо контрпереворот, либо иностранную интервенцию. Народу Бангладеш остается только ждать, чтобы увидеть, что ждет его в будущем"
 Rahman_Assasination.4.d: "Президент Хондакер Мостак Хан вступил в должность президента после того, как руководство Авами Лиг (левая партия) обратилась к нему после убийства шейха Муджибура Рахмана. Теперь новое настоящее должно решить, что делать с ассасинами. Очевидно, что убийцы одобрили его назначение при условии, что он предоставит им иммунитет. Если этого не будет сделано, существует высокая вероятность другого, более насильственного переворота, совершенного вооруженными до зубов младшими офицерами. Другой вариант - не высказывать своего мнения по поводу убийства и передать его на рассмотрение системы военного правосудия. Это решение определит судьбу нового правительства"
 Rahman_Assasination.5.d: "Президент Кхондакер Мостак Хан обратился к нации. Он похвалил убийц шейха Муджибура Рахмана за то, что они спасли страну от уничтожения. Он также призвал к национальному примирению. В рамках этого плана он объявил о новом постановлении о возмещении ущерба. Это даст полный иммунитет убийцам, которые уже получают руководящие посты в новом правительстве. Говорят, что многие бангладешцы шокированы этим решением, хотя сообщений о беспорядках нет. Однако Авами Лиг и ее самые стойкие члены будут взбешены отсутствием справедливости в отношении их покойного лидера. В Дакке уже ходят слухи, что новый президент сталкивается с высоким риском реакции Авами Лиг, поскольку многие хотят, чтобы Муджибур Рахман был отомщен"
 Rahman_Assasination.6.d: "Если режим президента Хондакера Мостак Хана хочет выжить, военные должны быть взяты под контроль. Первоначальный переворот был предпринят офицерами среднего звена, но им не хватает полномочий или статуса, чтобы установить контроль над вооруженными силами. Нынешний главнокомандующий армией генерал Шафиулла был решительным сторонником Муджибура Рахмана и не предвидел грядущего переворота. Если он будет сохранен, это может поддержать порядок, но подвергнет правительство риску, учитывая его политические взгляды. Многие официальные лица рекомендуют отправить генерала Шафиуллу в отставку и заменить его генералом Зиауром Рахманом. Генерал Рахман считается консервативным офицером, на которого вряд ли повлияют сторонники Муджибура Рахмана. Однако он амбициозный офицер, его продвижение по службе может дать военным больше влияния на государство"
 Rahman_Assasination.7.d: "Покойный президент Муджибур Рахман стремился укрепить свою власть через свою партию НРКЛБ. Президент Хондакер Мостак Хан объявил, что немедленно распустит НРКЛБ (Народную рабоче-крестьянскую лигу Бангладеш) и позволит существовать всем политическим партиям. Он отметил, что партия НРКЛБ заставила многих бангладешцев чувствовать себя бесправными или не вовлеченными в политику страны. Восстановление политических партий вернет народу политическую активность и восстановит демократию в Бангладеш. Этот шаг широко приветствуется, хотя есть некоторые опасения. Многие политики опасаются, что религиозные партии могут воспользоваться этой новой ситуацией и попытаться манипулировать электоратом, играя на религиозных чувствах. Президент отверг эти опасения и отметил свою веру в совместимость ислама и демократии."
 Rahman_Assasination.8.d: "После убийства президента Муджибура Рахмана и прихода к власти президента Хондакера Мостака Хана были задержаны высокопоставленные лидеры Авами Лиг. Новый президент признал, что его положение было очень шатким не только по отношению к военным офицерам, совершившим убийство, но и к сторонникам муджибура в партии. Эти лоялисты, хотя и задержаны, все еще обладают огромным влиянием и потенциально могут вызвать насильственную реакцию со стороны воинствующего крыла партии Авами Лиг. Некоторые высокопоставленные чиновники рекомендуют президенту убрать этих противников из Авами Лиг, прежде чем они либо сбегут из тюрьмы, либо будут освобождены. Они могли бы легко сплотить враждебную оппозицию правительству. Другие советники считают, что это может иметь неприятные последствия, они призывают к примирению. Освобождение политических заключенных могло бы купить добрую волю. Необходимо принять решение"
 Rahman_Assasination.9.d: "Генерал Халед Мошараф, высокопоставленный бангладешский офицер с высокими наградами, работающий с военными подразделениями, поддерживающими Муджибура Рахмана, захватил контроль над правительством в одночасье. Генерал Халед Мошараф, возмущенный убийством и защищавший убийц, действовал после сообщений о том, что высокопоставленные чиновники Авами Лиг были убиты в тюрьме при подозрительных обстоятельствах. Нынешний главнокомандующий армией, высокопоставленные правительственные чиновники, включая президента Хондакера Мостака Хана и убийц Муджибура Рахмана, находятся либо под стражей, либо под домашним арестом. В обращении к нации Халед Мошараф пообещал привлечь убийц Муджибура Рахмана к ответственности и восстановить субординацию в вооруженных силах. В течение нескольких часов после объявления тысячи людей прошли маршем в память о шейхе Муджибуре Рахмане, больше не опасаясь репрессий со стороны правительства. Генерал Мошараф претендовал на пост главнокомандующего армией и президента."
 Rahman_Assasination.10.d: "Хаос в Бангладеш продолжается после сообщений о мятеже солдат, выступающих против переворота генерала Халеда Мошарафа. Мятеж возглавляют солдаты и офицеры левого толка, которыми руководит полковник в отставке и лидер НСПБ Абу Тахер. Мятежники арестовывают, убивают, нападают на офицеров, лояльных генералу Мошарафу или покойному Муджибуру Рахману. По-видимому, многие из взбунтовавшихся солдат считают, что новый лидер - индийский агент, стремящийся передать Бангладеш Индии. Хотя Мошараф претендовал на звание главнокомандующего армией от генерала Зиаура Рахмана, это требование не признается в рядах. Поступают сообщения об ожесточенных боях по всей столице и вокруг дома, где в настоящее время содержится Зиаур Рахман. Время покажет, что произойдет"
 Rahman_Assasination.11.d: "Спустя несколько часов после сообщений о вооруженном восстании левых сил ситуация в Бангладеш снова изменилась. Генерал Халед Мошараф, который всего несколькими днями ранее сверг правительство, был убит во время контрпереворота, предпринятого взбунтовавшимися солдатами. Генерал Зиаур Рахман был освобожден из-под домашнего ареста и взял под свой контроль правительство, вернув себе титул главнокомандующего армией. Действуя быстро, генерал Зиаур Рахман приказал немедленно восстановить дисциплину и субординацию. Офицеры и солдаты, выступающие за Мошараф, находятся под стражей. Все оставшиеся политические заключенные, удерживаемые либо покойным генералом Мошарафом, либо бывшим президентом Хондакером Мостаком Ханом, должны быть освобождены или переведены под домашний арест до принятия соответствующего решения. Левые солдаты, освободившие Зиаура, добивались создания нового социалистического правительства, однако генерал Зиаур заявил, что возьмет ситуацию в свои руки без социалистического правительства или хунты."
 Rahman_Assasination.12.d: "В течение нескольких недель, последовавших как за переворотом, так и за контрпереворотом, генерал Зиаур Рахман решительно восстановил порядок в стране и в вооруженных силах. Офицеры и солдаты, причастные к обоим заговорам с целью государственного переворота, быстро задерживаются. Наиболее примечательно, что полковник в отставке Абу Тахер, который повлиял на переворот, который способствовал его освобождению из-под домашнего ареста, также был задержан. Генерал Зиаур отметил, что восстание против генерала Мошарафа было направлено не на восстановление порядка, а на приведение к власти социалистического военного государства. Если мы хотим восстановить дисциплину, все эти движения должны быть изгнаны из казарм. В дополнение к восстановлению порядка в вооруженных силах генерал Зиаур руководил широкомасштабным развертыванием сил безопасности, чтобы снизить уровень беззакония и восстановить порядок по всей стране. Многие бангладешцы приветствуют новое чувство спокойствия и порядка, которое приносит новый режим"
 Rahman_Assasination.13.d: "Военный трибунал приговорил полковника Абу Тахера к повешению за его государственную измену и убийства. Бывший лидер НСПБ обвиняется в руководстве антигосударственной деятельностью в период мятежа. Его также обвинили в организации убийства генерала Халеда Мошарафа и других лояльных ему офицеров, чтобы помочь жестокому захвату власти социалистами в Бангладеш. Его казнь не сулит ничего хорошего его собственным сторонникам в армии, поскольку многие предполагали, что они будут пользоваться иммунитетом, поскольку их действия способствовали возвращению генерала Зиаура к власти. Однако генерал Зиаур признает, что влияние других идеологий и личностей подрывало дисциплину и порядок в армии. Массовые задержания и судебные процессы над видными военными офицерами, причастными к недавним переворотам, призваны восстановить дисциплину в казармах"
 Rahman_Assasination.14.d: "Генерал К.М. Шафиулла, главнокомандующий армией Бангладеш и народный герой войны, сверг президента Кхондакера Мостак Хана. Генерал действовал после сообщений о том, что несколько членов Авами Лиг умерли при загадочных обстоятельствах в тюрьме. Для генерала Шафиуллы это была последняя ничья. Видный сторонник Муджибура Рахмана, он был шокирован его убийством, но помог сохранить нацию вместе после этого. Однако неспособность президента Мостака Хана привлечь убийц к ответственности и недавние подозрительные убийства в тюрьме сделали ситуацию невыносимой для генерала и его старших офицеров. Бангладешские войска вышли на улицы. В обращении к нации новый лидер пообещал справедливость для покойного Муджибура Рахмана и стабильность для нации, сотрясаемой нестабильностью."
 Rahman_Assasination.15.d: "Полковник в отставке Абу Тахер, бывший лидер НСПБ, организовал марксистское восстание младших офицеров и солдат, лояльных видению социалистической революции. Левые солдаты быстро перешли к захвату контроля над крупными формированиями и убийству генерала К.М. Шафиуллы. Поступают сообщения о спорадических боевых действиях в местах расквартирования войск по всей стране. Говорят, что резиденция главнокомандующего армией также стала ареной интенсивной стрельбы. Похоже, полковник Тахер стремится воспользоваться нынешней нестабильностью в стране, чтобы создать революционное социалистическое государство. Ближайшие часы покажут любые изменения в ситуации на местах"
 Rahman_Assasination.16.d: "Левый переворот против генерала К.М. Шафиуллы потерпел крах из-за беспорядка. Главнокомандующий народной армией смог сплотить своих сторонников и быстро отдавать приказы во время насилия. Его собственные лояльные войска смогли помешать команде убийц напасть на генерала в его доме. Тысячи солдат, офицеров и сочувствующих повстанцам гражданских лиц находятся под стражей. Ожидается, что они предстанут перед судом. Полковник Абу Тахер, организовавший покушение, был убит во время боевых действий. Обращаясь к нации, генерал Шафиулла похвалил вооруженные силы за то, что они остаются непоколебимыми в своем долге перед нацией. Укрепив свое правление, он теперь может сосредоточиться на восстановлении революции, как это представлял покойный Муджибур Рахман"
 Rahman_Assasination.17.d: "НСПБ, воспользовавшись военными столкновениями между старшими командирами, захватила ряд военных объектов. Офицеры и солдаты, выступающие за НСПБ, на нескольких базах присоединились к повстанцам снаружи, чтобы захватить объекты. Эта акция успешно отрезала нескольких старших офицеров от лояльных им подразделений. Попытка генерала Халеда Мошарафа организовать сопротивление провалилась, поскольку многие подразделения продолжают отказываться от его командования или непризнавать его главнокомандующим армией. Абу Тахер, лидер НСПБ и бывший полковник, координирует передвижение НСПБ из недавно захваченного центра связи."
 Rahman_Assasination.18.d: "Попытка генерала Халеда Мошарафа захватить власть закончилась его убийством. Подробности остаются отрывочными, но считается, что солдаты повстанцев, возможно, лояльные НСПБ, застрелили его, когда он координировал операции против своей оппозиции. Лидер НСПБ Абу Тахер вскоре объявил по государственному радио, что НСПБ захватила контроль и обеспечит безопасность людей. Военные машины сейчас патрулируют улицы, перевозя группы бойцов НСПБ и солдат, выступающих за НСПБ. Считается, что те старшие офицеры, которые выступали против Халеда Мошарафа и НСПБ, находятся под стражей. Хаотическая борьба между высшими военными руководителями открыла путь для захвата власти НСПБ."
 Khondaker_Regime.1.d: "В вооруженных силах растет напряженность. Профессиональные офицеры, прошедшие подготовку в колониальный и пакистанский периоды, продолжают утверждать себя как самые элитные офицеры в вооруженных силах. Борцы за свободу и бойцы молодежной органиации, существовавшие до обретения независимости, были интегрированы в вооруженные силы после обретения независимости. Те, кого повысили до офицеров, жалуются, что профессиональные офицеры маргинализируют их, препятствуя их продвижению по службе. Профессиональные офицеры требуют, чтобы мы поддержали их политику преобразования интегрированных элементов в их видение армии. Бывшие борцы за свободу выступают за создание более национальной, народной армии. Президент должен решить, какую фракцию поддержать"
 Khondaker_Regime.2.d: "Президент Кхондакер Мостак Ахмад в недавней речи похвалил убийц шейха Муджибура Рахмана. Он назвал убийц сынами солнца за их действия. Он утверждал, что если бы офицеры не действовали, правительство и нация столкнулись бы с риском полного краха. В своем заключительном слове он призвал нацию сплотиться и закончил свою речь словами \"Бангладеш Зиндабад\". Примечательно изменение предыдущего слогана Joy Bangla. Эти замечания воспринимаются с реакцией удивления и гнева. Многие бангладешцы теперь убеждены, что их новый лидер был причастен к убийству. Говорят, что сторонники покойного Муджибура Рахмана были взбешены этими замечаниями"
 Khondaker_Regime.3.d: "Среди бангладешцев растет опасение, что Индия пользуется слишком многими привилегиями и влиянием в стране. Это чувство особенно распространено среди офицерского корпуса. Правительство будет проводить новую внешнюю политику, направленную на уменьшение влияния Индии на страну. Мы усилим ограничения на пересечение границ, призовем Индию сократить свои дипломатические представительства и введем больше торговых ограничений. Мы заранее распространили некоторые новости, и общественность, похоже, согласна с этим новым направлением в политике. Индийцы должны знать, что они не могут посягать на наш суверенитет"
 Khondaker_Regime.4.d: "Кабинет министров отметил, что предыдущая политика национализации экономики проводилась в стране слишком быстро. В нем говорилось о поддержке общества, в котором рабочие, нация и экономика могли бы процветать вместе. Однако экспертные заключения подтвердили, что государству не хватало потенциала для эффективного управления всеми отраслями, которые оно национализировало. Таким образом, кабинет министров принял решение о программе приватизации определенного процента государственных отраслей промышленности. Правительство надеется, что это подстегнет расходы и будет способствовать динамичному росту экономики. Несколько профсоюзов и официальные лица Авами Лиг выразили обеспокоенность по поводу этого решения. Однако многие бангладешцы, страдающие в условиях застоя экономики, готовы попробовать все ради роста"
 Shafiullah.1.d: "Генерал К.М. Шафиулла, главный лидер военного правительства Бангладеш, встретился со своими старшими военными командирами, чтобы обсудить судьбу тех, кто убил президента Муджибура Рахмана. Одна группа офицеров считает, что должен состояться публичный судебный процесс, в ходе которого жестокие подробности убийства будут представлены населению. Тогда убийцы могут быть казнены, чтобы обеспечить правосудие и порядок во всей стране. Однако другая группа офицеров опасается, что такой судебный процесс может привести к негативному мнению о вооруженных силах в целом. Они утверждают, что убийц следует судить военным трибуналом, чтобы свести к минимуму антивоенную риторику и показать нации, как военные расправляются с предателями. Президент Шафиулла должен принять решение"
 Shafiullah.2.d: "Сегодня завершился публичный судебный процесс над теми военными офицерами, которые были причастны к убийству президента Муджибура Рахмана. Нация была ошеломлена, услышав, как группа офицеров среднего звена вооружилась, ворвалась в резиденцию Рахмана и зарезала его вместе с семьей. Только то, что его не было в стране, спасло двух его дочерей. Обвинение намекнуло, что высокопоставленные офицеры, возможно, в частном порядке способствовали перевороту, однако правительство уже объявило, что других судебных процессов не будет. Все восемь убийц, включая трех майоров, утверждали, что действовали, чтобы спасти нацию от коррупции и диктатуры. Приговор будет объявлен через несколько дней, и многие ожидают обвинительного приговора, за которым последует казнь"
 Shafiullah.3.d: "Военные Бангладеш объявили, что их военный суд вскоре огласит приговор восьми мужчинам, причастным к убийству покойного президента Муджибура Рахмана. Подробности судебного процесса были скрыты от широкой общественности. Военные утверждали, что дело находится под военной юрисдикцией и что правосудие восторжествует. Несмотря на некоторое первоначальное общественное недовольство по поводу неприкосновенности частной жизни в этом деле, многие бангладешцы с нетерпением ждут вынесения решения. Гражданским адвокатам обвиняемых не разрешили участвовать в военном суде, и они назвали судебный процесс фиктивным. Средства массовой информации Индии также с подозрением относятся к судебному процессу"
 Shafiullah.4.d: "Убийцы президента Муджибура Рахмана были приговорены вчера судом к смертной казни. Восемь человек будут повешены в ближайшие дни. Тысячи сторонников Авами Лиг вышли на улицы, чтобы отпраздновать правосудие в отношении их покойного лидера. Суд не убедил довод убийц о том, что они убили президента, чтобы предотвратить диктатуру и спасти нацию. Генерал К.М. Шафиулла, нынешний президент, одобрил решение суда. Среди осужденных - три армейских майора. Хотя правительство и Авами Лиг приветствуют эту новость, поступают сообщения о беспорядках в вооруженных силах и среди более консервативных кругов. Они считают, что обвиняемых делают козлами отпущения и рисуют таким образом, чтобы очернить военных и другие консервативные политические партии. Многие офицеры считали, что отстранение Муджибура Рахмана было оправдано, учитывая его политические действия и близость к Индии."
 Shafiullah.5.d: "Военные объявили вердикт своего военного трибунала, все восемь человек, причастных к убийству президента Муджибура Рахмана и его семьи, были приговорены к смертной казни. Военные добавили, что казни через повешение уже проводились. Эта новость застала многих в стране врасплох. Был спешно организован большой митинг Авами Лиг в честь покойного Муджибура Рахмана. Многие в стране критически отнеслись к военному процессу из-за его секретного характера, но приветствовали вердикт. Среди военных есть те, кто считает, что суд сделал обвиняемых козлами отпущения. Эти офицеры считают, что убийство было оправдано из-за политической нестабильности, охватившей нацию. Правительство опубликовало заявление, в котором одобрило это решение и подтвердило, что никаких других судебных процессов, связанных с убийством, проводиться не будет. Для многих бангладешцев инцидент исчерпан, по крайней мере на данный момент"
 Shafiullah.6.d: "Офицеры и солдаты, вступившие в национальную армию не из движения сопротивления до обретения независимости, жалуются на невозможность продвижения на службе в армии. Они утверждают, что солдаты и офицеры, прошедшие профессиональную подготовку до обретения независимости, систематически следили за тем, чтобы личный состав армии не получал повышения по службе или привлекательных должностей. Президент должен решить, следует ли позволить, чтобы в армии по-прежнему доминировали военные служившие до получения независимости, или настаивать на равенстве в армии. Поддержка старой гвардии позволила бы сохранить военную структуру как есть, а новобранцы в конечном итоге были бы уволены со службы. Поддержка новой гвардии подтолкнет военных к созданию более эффективной структуры народной армии"
 Shafiullah.7.d: "С момента прихода к власти генерал К.М. Шафиулла неустанно работал над выявлением и нейтрализацией угроз государству. Более воинственные консервативные элементы были в значительной степени нейтрализованы еще до того, как он пришел к власти. Однако марксисты уже давно участвуют в актах насилия и проникновении как в правительство, так и в вооруженные силы. В ответ на эту угрозу генерал Шафиулла недавно отдал приказ о массовом подавлении опасных марксистских организаций по всей стране. Силы безопасности задержали правительственных, военных и государственных чиновников, идентифицированных как промарксистские. Кроме того, были также задержаны несколько студенческих лидеров и сельских агитаторов. В обращении к нации генерал Шафиулла отметил, что социализм является средством экономической эмансипации, однако марксизм представляет угрозу религии и культуре бангладешцев."
 Shafiullah.8.d: "Генерал К.М. Шафиулла, главный лидер военного правительства Бангладеш, объявил, что в ближайшем будущем будут проведены новые выборы. Герой войны заявил, что его режим восстанавливает стабильность как в обществе, так и в государственных институтах. Лидер не назвал конкретную дату, когда будут проведены выборы, но заявил, что уровень преступности и коррупции должны быть еще более низкими, чтобы выборы стали возможными. Он добавил, что после выборов он покинет вооруженные силы, выполнив свой долг перед нацией и покойным президентом Муджибуром Рахманом. Всем политическим партиям будет разрешено открыто участвовать в выборах. Это объявление было хорошо воспринято по всей Бангладеш. Авами Лиг, похоже, готова начать свою предвыборную кампанию, в то время как оппозиционные партии, как ожидается, сформируют коалицию, чтобы противостоять им. Хотя точной даты выборов нет, народ доволен нынешним курсом правительсва"
 ZR_Regime.1.d: "Генерал Зиаур Рахман, главный лидер военного правительства Бангладеш, выступил с обращением к нации. Он отметил, что за последние годы народ преодолел большие невзгоды, народ рделился по политическим, религиозным и классовым признакам. Зиаур заявил, что пришло время для исцеления и стабильности. Затем он пообещал народу политику надежды, основанную на взгляде в будущее, а не в прошлое, построенную не на уничтожении или нападении на оппонентов, а на национальном единстве и мирном развитии. Он пообещал провести выборы, как только ситуация стабилизируется. Эти комментарии хорошо воспринимаются населением Бангладеш, желающим мира и стабильности"
 ZR_Regime.2.d: "Народ Бангладеш пришел на избирательные участки, чтобы избрать нового президента. Главный руководитель военного положения генерал Зиаур Рахман одержал уверенную победу. Это крупная победа его политической партии, Националистической партии Бангладеш, которая смогла заручиться поддержкой населения во время избирательной кампании. Хотя генерал Зиаур поспешил поблагодарить избирателей за то, что они обеспечили ему такой успех, международные наблюдатели отметили, что были нарушения. Несмотря на эти сообщения о честности голосования, многие бангладешцы, похоже, довольны результатом. Авами Лиг опубликовала заявление с критикой процесса голосования."
 ZR_Regime.3.d: "Шейха Хасина, дочь убитого президента шейха Муджибура Рахмана, попросила разрешения вернуться. Она и ее сестра были за границей, когда офицеры красной армии убили их семью. Авами Лиг признает шейху Хасину наследницей Муджибура Рахмана, и предыдущие правительства отказали ей в разрешении вернуться. Для президента Зиаура ее возвращение станет серьезным стимулом для Авами Лиг. Однако отказ от ее возвращения может вызвать волнения и заставить людей усомниться в его собственной честности, поскольку он обещал людям, что сосредоточится на будущем, а не на прошлом. В конечном счете разрешение было получено, что позволило шейхе Хасине вернуться домой, чтобы взять на себя титул шейха, который ее отец имел столько лет"
 ZR_Regime.4.d: "Президент Зиаур Рахман одобрил новую конституционную поправку, добавляющую в конституцию Закон о возмещении ущерба. Закон был принят и предоставлял иммунитет убийцам шейха Муджибура Рахмана. Президент Зиаур Рахман настаивал на том, что его решение призвано исцелить нацию и отойти от политики мести или обид. Авами Лиг и сторонники покойного шейха Муджибура Рахмана осудили поправку. Они обвиняют президента в том, что он встал на сторону убийц и защищает своих собственных политических союзников, которые, возможно, были замешаны в этом. Некоторые публикации зашли так далеко, что обвинили президента Зиаура в принятии поправки о прекращении любого расследования его собственной роли в убийстве. Президент также подтвердил легализацию консервативных и религиозных партий, первоначально запрещенных Авами Лиг."
 ZR_Regime.5.d: "Президент Зиаур Рахман признает популярность и преимущества социализма для экономики. Определенные идеи остаются популярными в сознании людей. Однако экономика остается слабой, и необходимо опробовать новый подход. Правительство объявило, что заморозит любую дальнейшую национализацию, открыв для приватизации несколько неэффективных отраслей. Кроме того, был инициирован ряд новых мер, направленных на стимулирование роста частного сектора. Правительство надеется, что переход к рыночной экономике поможет стимулировать экономический рост и, естественно, уменьшить национализацию"
 ZR_Regime.6.d: "Исторически сложилось так, что дважды в год, перед сбором урожая, бангладешские фермеры сталкиваются с риском голода. Доступность продовольствия в этот период невелика, как и экономические возможности. За это время произошло много случаев голода. Президент Зиаур Рахман представил новую программу \"Еда в обмен на работу\", направленную на прекращение цикла голода. В рамках программы бангладешские фермеры в эти неурожайные периоды будут наняты для участия в государственных инфраструктурных программах в обмен на продовольствие. Предоставленная пища спасет эти семьи и предотвратит массовый голод. Правительство считает, что в дополнение к предоставлению государственных услуг населению, программа укрепит экономику, обеспечив стабильность сельского хозяйства в течение всего года"
 ZR_Regime.7.d: "Существует высокая обеспокоенность, особенно среди военных офицеров, по поводу нашей зависимости от индийской поддержки. Правительство находится под давлением, требуя найти альтернативный источник военной техники, чтобы помешать Индии достичь гегемонии. Китай обладает оборудованием, технологиями и географически близок к нам. Министр иностранных дел скоро совершит поездку и может попросить китайцев оказать поддержку армии Бангладеш. Другие члены кабинета считают, что поездка в Китай может привести к чрезмерному влиянию Китая,  они просят, чтобы мы просто использовали поездку для укрепления существующих связей"
 ZR_Regime.8.d: "Делегация из Бангладеш недавно обратилась с просьбой о расширении двусторонних отношений с Китаем. В частности, они были заинтересованы в приобретении танков. Многие бангладешские офицеры, которые проходили подготовку, когда страна была частью Пакистана, знакомы с нашей технологией. Это представляет собой попытку Бангладеш уклониться от влияния Индии и позволить нам усилить влияние в стране. В Бангладеш есть важные порты, ведущие к Бенгальскому заливу. Некоторые высокопоставленные чиновники не верят, что Бангладеш действительно отвернется от Индии или предложит многое взамен, они предлагают, чтобы мы просто взяли на себя обязательство расширять двусторонние и торговые связи"
 ZR_Regime.9.d: "Китайское правительство подтвердило, что начнет передачу более двухсот танков для армии Бангладеш. Правительство Бангладеш обрадовала эта новость, как и средства массовой информации. Армия в восторге от новой техники, полагая, что она обеспечивает стране надежную защиту. Внутри страны правительство хвалят за его государственную мудрость и способность вести переговоры с крупными державами. Ожидается, что китайцы расширят свое дипломатическое присутствие в стране, чтобы способствовать заключению нового соглашения"
 ZR_Regime.10.d: "После обретения независимости Бангладеш приняла светскую идеологию. К сожалению, многие мусульманские государства ошибочно истолковали это как подавление исламской идентичности, хотя это было далеко от истины. Бангладеш всегда оставалась набожной нацией. Президент Зиаур Рахман публично отвечал на исламские приветствия и призывы на публичных мероприятиях, показывая, что, хотя правительство остается светским, оно не будет скрывать исламскую идентичность народа. Обеспечив наши религиозные полномочия, мы теперь можем обратиться к Саудовской Аравии с просьбой нормализовать переговоры и найти возможности для нашего народа в богатом Королевстве"
 ZR_Regime.11.d: "Правительство Бангладеш в частном порядке обратилось к нам с просьбой провести переговоры. Они стремятся нормализовать связи с нашим народом. Наши тесные отношения с Пакистаном и их первоначальное принятие секуляризма в ущерб исламской идентичности ранее сдерживали отношения. Пакистан, похоже, больше не слишком обеспокоен внешними отношениями с Бангладеш. Нынешнее правительство Бангладеш также подчеркивает исламскую идентичность своего народа. Проведение переговоров и нормализация отношений имели бы большое значение для поддержки этого происламского правительства"
 ZR_Regime.12.d: "Саудовская Аравия и Бангладеш подписали ряд соглашений, укрепляющих двусторонние связи, расширяющих дипломатические миссии. Бангладешцы довольны соглашением, поскольку число паломников, совершающих хадж, также увеличилось. Недавнее сотрудничество с Саудовской Аравией представляет собой усилия правительства по прямому взаимодействию с мусульманскими странами"
 ZR_Regime.13.d: "После нормализации отношений наши дипломаты и другие посетители были поражены большим количеством профессионально подготовленных бангладешцев. Кроме того, на улице миллионы людей, желающих работать, но не имеющих возможности делать это из-за слабой экономики. Мы подписали несколько контрактов с бангладешскими рабочими, чтобы они приезжали и работали в Саудовской Аравии. Мы предлагаем им высокую заработную плату и другие льготы до тех пор, пока они не нарушат социальные обычаи и не согласятся оставаться гастарбайтерами, а не резидентами или гражданами. Правительство Бангладеш недавно предложило нам формализовать программу для гастарбайтеров, чтобы облегчить работу большему числу работников и максимизировать денежные переводы, которые они отправляют обратно. Это поможет нашей отчаянно нуждающейся в рабочей силе экономику"
 ZR_Regime.14.d: "После нескольких обсуждений были определены условия соглашения о гастарбайтерах. Саудовская Аравия сможет нанять всю неквалифицированную и профессиональную рабочую силу, которую она пожелает, из нашей страны. У нас избыток рабочей силы, а Саудовская Аравия предоставляет огромные возможности для людей. Агенты, компании и реклама гастарбайтеров будут допущены свободно. Взамен наши работники будут наслаждаться высоким уровнем жизни по сравнению с домом и возможностью легко переводить свои заработки домой, семьям. Мы ожидаем, что обе страны получат большую выгоду в ближайшие годы"
 ZR_Regime.15.d: "Спустя несколько лет после соглашения о гастарбайтерах с Саудовской Аравией последствия уже ощущаются. Многие семьи, ранее принадлежавшие к бедному или испытывавшие трудности среднему классу, теперь приобретают новые дома, высококачественное образование для детей и потребительские товары. Приток денежных переводов из Саудовской Аравии возглавляет этот бум. Нашей обычно испытывающей трудности экономике хорошо помогает программа крупных гастарбайтеров, поскольку денежные средства, отправляемые из Саудовской Аравии, поддерживают все основные секторы экономики. Правительство широко хвалят за его инициативу по этой программе, а эти новые семьи гастарбайтеров называют самым быстрорастущим средним классом в Бангладеш"
 ZR_Regime.16.d: "В рамках развития связей с Саудовской Аравией правительство Бангладеш дало разрешение на финансирование нового медресе в стране. Новая большая школа, полностью финансируемая саудовцами, будет предоставлять исламское образование мальчикам по всему Бангладеш. Посол Саудовской Аравии высоко оценил новую школу, назвав ее первой из многих, которые помогут укрепить исламские узы, скрепляющие мусульманский мир. Многие бангладешцы одобряют новые школы, поскольку они предоставляют бесплатное обучение, жильё и питание, что делает их идеальными для более бедных семей. Президент Бангладеш опубликовал свое собственное заявление, в котором восхвалял новую школу."
 ZR_Regime.17.d: "После отделения от Пакистана отношения с ним охладились. Однако многие в стране по-прежнему чувствуют идеологическую и религиозную связь с Пакистаном. Мы - два исламских государства на субконтиненте. Есть несколько старшых советников, которые считают, что обращение к Пакистану может восстановить исторические связи и предложить нам выход в случае ухудшения отношений с Индией. Мы можем попросить государство-посредника обратиться к пакистанцам с просьбой о проведении переговоров. Есть большое количество бангладешцев, которые действительно негативно относятся к Пакистану, поэтому решение о переговорах должно быть тщательно обдумано"
 ZR_Regime.18.d: "Посол из государства-посредника прислал нам сообщение о том, что Бангладеш желает провести переговоры. Хотя разделение оставило горькие воспоминания, многие в Пакистане по-прежнему хотят, чтобы наша страна поддерживала братские связи со всеми мусульманскими государствами. В Бангладеш по-прежнему много высокопоставленных лиц, особенно в армии, которые прошли обучение в пакистанских школах. Мы можем предложить провести переговоры по улучшению двусторонних и, возможно, торговых связей. Или мы можем сосредоточиться на улучшении двусторонних связей, предлагая военную подготовку, чтобы восстановить оборонные связи между нашими странами. Кабинет министров должен решить, какой подход он хочет предложить бангладешцам, прежде чем переговоры смогут состояться"
 ZR_Regime.19.d: "Правительство Пакистана оказалось восприимчивым к нашим усилиям по улучшению ситуации. Многие в Пакистане считают, что, несмотря на тяжёлое прошлое, мусульманские государства в Южной Азии должны держаться вместе. Есть признаки того, что пакистанцы были бы готовы не только улучшить дипломатические контакты, но и укрепить торговые связи. Мы можем решить, насколько улучшатся двусторонние связи. Независимо от нашего решения, мы можем ожидать реакции со стороны Нью-Дели. Народ Бангладеш с нетерпением ожидает нормализации отношений с нацией, за создание которой боролось так много наших людей"
 ZR_Regime.20.d: "Правительство Пакистана оказалось восприимчивым к нашим усилиям по улучшению ситуации. Многие в Пакистане считают, что, несмотря на тяжёлое прошлое, мусульманские государства в Южной Азии должны держаться вместе. Есть признаки того, что пакистанцы были бы готовы не только улучшить дипломатические контакты, но и обеспечить военную подготовку. Многие из наших офицеров прошли подготовку в Пакистанской армии, и поддержание таких контактов может оказаться полезным по мере наращивания нашего собственного военного потенциала. Однако нам пришлось бы держать военные связи в секрете, поскольку многие бангладешцы могут отреагировать отрицательно на такие новости. Мы также могли бы просто сосредоточиться на улучшении двусторонних связей"
 ZR_Regime.21.d: "Посол Индии доставил сообщение из Нью-Дели, в котором выразил недовольство нашими недавними переговорами с Пакистаном. Индийское правительство недовольно расширением двусторонних связей. Мы сообщили индийцам, что наши отношения - это наше личное дело. Несмотря на это, индийцы отменили некоторые из наших программ культурного обмена и ввели некоторые ограничения на торговлю. Это прискорбно, но мы не можем смириться с ситуацией, когда Индия диктует внешнюю политику Бангладеш. Средства массовой информации сообщают об этой размолвке, но общественность в основном поддерживает нашу позицию"
 JAF_472.1.d: "Японская Красная Армия (ЯКА) захватила рейс 472 авиакомпании Japan Airlines, летевший из Бомбея. Пятеро вооруженных террористов захватили контроль над самолетом и направили пилота в Дакку. Угонщики сейчас сидят в самолете, на летном поле, удерживая в заложниках 156 пассажиров и членов экипажа. ЯКА требует шесть миллионов долларов и освобождения девяти заключенных членов ЯКА. Японское правительство проводит экстренное заседание для обсуждения ответных мер. Правительство Бангладеш окружило самолет, но будет ждать ответа Японии. Президент Зиаур Рахман проводит обсуждение со своими высшими должностными лицами службы безопасности"
 JAF_472.2.d: "Поступают сообщения о беспорядках в военном городке Богра. Недавний захват заложников японской авиакомпанией в Дакке привел к слухам и волнениям среди антиправительственных военнослужащих, которые считают, что происходит более масштабный переворот. Было замечено, что вооруженные войска взяли под контроль здания местных органов власти, и есть сообщения о том, что старшие офицеры в районе расквартирования находятся под арестом. Колонна лояльных войск была отправлена в Богру. После напряженного противостояния восстание было подавлено. Однако подавление Богры не положило конец слухам, и есть сообщения о подобных восстаниях в других гарнизонах. Правительство должно подготовиться к дальнейшим инцидентам"
 JAF_472.3.d: "Нападение на резиденцию президента Зиаура Рахмана было сорвано. Антиправительственные военнослужащие Военно-воздушных сил и сочувствующие армии подняли восстание, полагая, что они поддерживают национальный переворот против президента. Повстанческие войска временно захватили радиостанцию Дакка, а в международном аэропорту были убиты по меньшей мере два десятка военнослужащих ВВС, включая офицеров. Эти офицеры вели переговоры с террористами японской Красной Армии, которые в настоящее время удерживают в заложниках самолет авиакомпании Japan Airlines на взлетно-посадочной полосе. К счастью, командующие местными военно-воздушными силами и армейским сектором смогли подавить восстание, задержав многих повстанцев. Правительство приказало военным немедленно задерживать любого инакомыслящего персонала"
 JAF_472.4.d: "Рейс авиакомпании Japan Airlines из Бомбея был недавно захвачен вооруженными членами Японской Красной Армии. Самолет в настоящее время находится в Дакке, угонщики требуют шесть миллионов долларов и освобождение девяти своих членов из тюрьмы. Общественность непреклонна в том, что мы вернем 156 заложников в целости и сохранности. Наши международные партнеры призывают нас отказаться от этих требований, заявляя, что это создаст плохой прецедент не только для мирового сообщества, но и для Японии. Однако мнение нашего народа и большинства должностных лиц таково, что спасение человеческой жизни, независимо от цены, должно быть руководящим идеалом. Необходимо принять решение"
 JAF_472.5.d: "Правительство согласилось с требованиями угонщиков японской Красной Армии. В Дакку зафрахтован рейс авиакомпании Japan Airlines с шестью миллионами долларов для захвативших заложников. Самолет также доставит домой 156 заложников. Мы также освободили заключенных, как было проинструктировано. Хотя многие на международном уровне осуждают это решение как потворство терроризму, премьер-министр опубликовал заявление, в котором отметил, что жизнь одного человека важнее земли. Это чувство находит отклик у японского народа, который приветствует эту новость. Когда ситуация разрешилась, правительство также объявило о планах создания мощных сил по борьбе с терроризмом, чтобы справиться с будущим кризисом, подобным этому"
 JAF_472.6.d: "Японское правительство отклонило требования угонщиков Японской Красной Армии, которые в настоящее время удерживают самолет со 156 заложниками на взлетно-посадочной полосе в Дакке. Это серьезная эскалация, и есть опасения, что угонщики могут действовать опрометчиво. Услышав эту новость, угонщики потребовали от правительства Бангладеш заправить самолет и позволить ему улететь. Президент Зиаур Рахман стоит перед трудным выбором, он может согласиться с требованием, позволив кризису покинуть Бангладеш, или отправить войска на штурм самолета. Штурмовать самолет будет невероятно рискованно, но покажите террористам, что Бангладеш - это не то место, откуда можно выдвигать требования или проводить операции"
 JAF_472.7.d: "Угон рейса 472 авиакомпании Japan Airlines продолжается после того, как правительство Бангладеш заправило самолет топливом и разрешило ему покинуть страну. Самолет направляется на Ближний Восток, хотя конечный пункт назначения пока не указан. Пятеро вооруженных членов Японской Красной Армии захватили в заложники самолет из Бомбея, посадив его в Дакке. Они потребовали освобождения нескольких членов группы в Японии вместе с шестью миллионами долларов. Японское правительство отклонило эти требования. Чтобы избежать эскалации насилия, правительство Бангладеш выполнило требование террористов заправить самолет топливом и позволить ему улететь с заложниками. Президент Бангладеш Зиаур Рахман выразил пожелание, чтобы кризис был урегулирован без гибели ни в чем не повинных людей."
 JAF_472.8.d: "В ходе ошеломляющей ночной атаки бангладешские спецслужбы взяли штурмом рейс 472 авиакомпании Japan Airlines. Самолет был недавно захвачен вооруженными членами Японской Красной Армии после того, как он вылетел из Бомбея. Самолет был доставлен в Дакку, где угонщики потребовали миллионы долларов и освобождения его членов из японских тюрем. После того, как японское правительство отказалось от его требований, правительство Бангладеш решило принять меры, чтобы предотвратить убийство заложников. Операция по штурму самолета длилась всего несколько минут, но привела к сообщениям о перестрелках и взрывах. Армия Бангладеш подтвердила, что самолет был захвачен, а террористы нейтрализованы. Отвечая на вопрос о состоянии заложников, военные признали, что было несколько жертв, но большинство из них были благополучно спасены."
 JAF_472.9.d: "Недавний кризис Japan Airlines вызвал слухи по всему Бангладеш, что привело к вооруженным восстаниям антиправительственных военнослужащих. Эти люди думали, что правительство рухнуло или готовится более масштабный переворот, что привело к крупным восстаниям на всех базах. Эти восстания были быстро подавлены, и многие зачинщики были взяты под стражу. Президент Зиаур Рахман получил два списка, в одном из которых указаны все военнослужащие, участвовавшие в беспорядках. Другой список включает подозреваемых сотрудников полиции, разведки и других служб безопасности, которые, как полагают, способствовали восстаниям. Он должен решить, очищать ли от врагов только военных или весь свой аппарат безопасности"
 JAF_472.10.d: "Кризис с заложниками в японской авиакомпании вызвал распространение диких слухов на военных базах по всей стране. Более ранний антиправительственный мятеж в Богре был успешно подавлен, но восстание там вдохновило сторонников НСПБ солдат в Дакке начать свой собственный переворот. Восставшие солдаты при поддержке местных бойцов НСПБ не только захватили контроль над расквартированием, но и захватили президента Зиаура Рахмана. Многие высокопоставленные бангладешские офицеры, которые были с президентом, чтобы обсудить кризис с заложниками, также были захвачены в плен. Элементы, выступающие за НСПБ, в настоящее время берут под контроль военные базы по всей стране, а лоялистские силы парализованы из-за отсутствия руководства"
 JAF_472.11.d: "НСПБ объявила о формировании нового правительства. Военнослужащие, выступающие за НСПБ, недавно совершили государственный переворот, вызванный слухами, связанными с продолжающимся кризисом с заложниками в японской авиакомпании. Президент вместе с высокопоставленными военными чиновниками был захвачен солдатами повстанцев, что вдохновило бойцов НСПБ и их сторонников захватить контроль над страной. НСПБ утверждает, что это принесет народу социализм, положит конец коррупции и приведет бангладешский народ к его истинной судьбе. Говорят, что народ Бангладеш ошеломлен этим внезапным поворотом событий на местах. Что касается кризиса с заложниками, НСПБ заявила, что продолжит усилия по урегулированию ситуации с японским правительством."
 Ziaur_Rahman_Assasination.1.d: "Президент Зиаур Рахман получил сообщения о том, что представители его местной партии в Читтагонге страдают от интенсивной политической борьбы. Ситуация быстро ухудшается, и его присутствие требуется для переговоров о компромиссе. Двигаясь быстро, президент покинул Дакку. Он планирует остаться рядом с армейским лагерем на ближайшие несколько дней, чтобы решить этот вопрос. Поддержание партийной дисциплины и единства в Читтагонге имеет решающее значение для управления страной. Перед отъездом из столицы президент заверил своих высокопоставленных чиновников, что этот вопрос будет решен в течение нескольких дней."
 Ziaur_Rahman_Assasination.2.d: "Президент Зиаур Рахман мертв. Группа офицеров, вооруженных автоматами, ракетными установками и гранатами, ворвалась в отель Circuit, где остановился президент во время визита в Читтагонг. Убийцы избежали лобовой атаки, создав две дыры в задней части отеля Circuit. Прежде чем подоспели основные силы президентской охраны, убийцам удалось схватить Зиаура Рахмана, прежде чем убить его в упор. Двое убийц были убиты при побеге, один из них был опознан как полковник. Генерал Абул Манзур, управляющий Читтагонгом, выступил по местному радио, призвав нацию объединиться и стать по-настоящему единой. Похоже, готовится государственный переворот."
 Ziaur_Rahman_Assasination.3.d: "Опасения по поводу государственного переворота в Бангладеш в связи с убийством президента Зиаура Рахмана рассеялись. Действующий главнокомандующий армией генерал Хусейн Мухаммад Эршад быстро взял ситуацию под контроль. Он выступил по радио и призвал все силы повстанцев сдаться и арестовать генерала Абула Манзура. Ответные меры фактически изолировали Читтагонг и лидеров повстанцев от остальной части страны. Быстрый ответ генерала Эршада сплотил все другие крупные гарнизоны, чтобы они поклялись в своей лояльности правительству и армейской иерархии. Есть сообщения о беспорядках среди военнослужащих в Читтагонге как из-за убийства, так и из-за радиопередач."
 Ziaur_Rahman_Assasination.4.d: "Сообщалось, что генерал Абул Манзур, которого считали вдохновителем убийства покойного президента Зиаура Рахмана, был убит, что фактически положило конец его восстанию. После требования главнокомандующего армией Манзура и его войск сдаться половина гарнизона Читтагонга вновь перешла на сторону правительства. Когда ситуация обернулась против него, генерал Манзур, как сообщается, сдался лоялистским войскам без инцидентов. Однако в течение нескольких часов поступило сообщение о том, что он убит. Ходят слухи, что разъяренная группа солдат-лоялистов окружила и убила командира повстанцев в порыве гнева. Хотя многие в стране считают, что справедливость восторжествовала, ходят слухи, что Манзура убили, чтобы заставить его замолчать и не раскрывать причастность более высокопоставленных военных и гражданских лидеров к попытке государственного переворота"
 Ziaur_Rahman_Assasination.5.d: "Несколько миллионов бангладешцев посетили похороны президента Зиаура Рахмана в Дакке. Толпа была убита горем, и многие выражали глубокую скорбь по покойному лидеру. Несмотря на его репутацию сильного человека, многие считали, что президент Рахман проявил твердую руку, в которой нуждалась нация. Его кампании по продвижению национализма и экономической стабильности останутся в памяти надолго. Когда похороны закончатся, многие в стране будут с тревогой смотреть в будущее. Вице-президент Абдус Саттар был приведен к присяге для вступления в должность президента. Опытный старший государственный деятель пообещал продолжить политику Зиаура Рахмана и провести новые выборы в ближайшем будущем."
 Ziaur_Rahman_Assasination.6.d: "Исполняющий обязанности президента Абдус Саттар, который пришел к власти после убийства президента Зиаура Рахмана, легко победил на недавних президентских выборах. Многие бангладешцы рассматривают результаты выборов как подтверждение того, что страна по-прежнему привержена наследию Зиаура Рахмана. Президент Саттар поблагодарил сторонников БНП и призвал к новой эре развития нации. Он также поделился видением расширения сотрудничества национальных учреждений. Несмотря на победу, есть опасения по поводу здоровья и возраста Саттара"
 Ziaur_Rahman_Assasination.7.d: "Генерал Хусейн Мухаммад Эршад вступил в должность президента и главного администратора военного положения. За предыдущие часы президент и вице-президент оба подали в отставку. Генерал Эршад распустил парламент и объявил, что сотни политиков будут арестованы за коррупцию. Военные утверждают, что им пришлось действовать из-за неэффективности нынешнего правительства. Генерал Эршад настаивает на том, что если бы он не действовал, антигосударственные силы погрузили бы Бангладеш в хаос. Аналитики не удивлены переворотом, поскольку президент и главнокомандующий армией были вовлечены в политические споры в течение последних нескольких месяцев. Недавнее решение об отстранении военных офицеров от административных должностей рассматривается как последний розыгрыш. Бангладешцы смотрят в неопределенное будущее"
 Ziaur_Rahman_Assasination.8.d: "Бангладешский лидер и президент Зиаур Рахман был убит в результате очевидной попытки государственного переворота в Читтагонге. В сообщениях говорится, что президента заманил туда местный военный комендант, который затем организовал нападение на его резиденцию. Главнокомандующий армией генерал Хусейн Мохаммад Эршад отреагировал быстро, потребовав от солдат-повстанцев немедленно сдаться и направив войска для усмирения повстанцев. Повстанцы быстро сдались, а военный лидер, возглавлявший восстание, предположительно был убит солдатами, разгневанными этим убийством. Президент Рахман будет похоронен в Дакке, где, как ожидается, по меньшей мере миллион скорбящих отдадут дань уважения. Военный правитель доказал свою популярность, установив стабильный режим в стране, страдающей от политической нестабильности. Согласно конституции, Абдус Саттар является исполняющим обязанности президента, и он пообещал провести новые выборы в ближайшие месяцы"
 FG_AL.0.d: "По всему Бангладеш большое волнение, люди приходят на избирательные участки. Многие бангладешцы рассматривают выборы как подтверждение того, что их нация является истинным авангардом южноазиатской демократии. Ожидается, что Авами Лиг одержит победу на выборах. Поскольку результаты почти предрешены, руководство Авами Лиг сталкивается с дилеммой. Лига может править независимо, чтобы полностью реализовать свое видение страны. Однако в партии есть некоторые, кто выступает за формирование правительства национального единства, чтобы вовлечь всех бангладешцев в политический процесс. Центральный комитет должен принять решение о том, как действовать дальше"
 FG_AL.1.d: "В конце 1950-х годов были созданы две организации для обучения и распространения информации об исламе в Дакке. В последующие годы эти организации стали ведущими исследовательскими институтами в регионе по исламской философии, культуре и знаниям. Недавно правительство расправилось с этими организациями и запретило их деятельность за то, что они не поддержали независимость Бангладеш. Однако народ Бангладеш все чаще выступает за восстановление духовных организаций, что приводит к массовым протестам. В парламенте есть предложение объединить бывшие группы в финансируемую правительством организацию под названием Исламский фонд. Новая организация сосредоточилась бы исключительно на духовных вопросах и не вмешивалась бы в политику. Некоторые секуляристы утверждают, что такая организация противоречит основным демократическим принципам, и правительство должно сохранить запрет"
 FG_AL.2.d: "Президент Муджибур Рахман в настоящее время управляет страной основываясь на новую конституцию, однако правительство сталкивается с обвинениями в игнорировании ее положений. Предпринимаются усилия по принятию новых поправок, которые узаконят некоторые сомнительные действия правительства. Муджибур Рахман желает, чтобы документ переориентировался на основные принципы национализма, секуляризма, демократии и социализма. Несмотря на эти высокие заявления о расширении конституционных полномочий, оппозиция обвиняет правительство в создании однопартийно1 диктатуры. Члены правящей Авами Лиг призывают к терпению, отмечая проблемы, с которыми в настоящее время сталкивается страна."
 FG_AL.3.d: "Бангладешский крестьянин был жертвой сначала доколониальной феодальной аристократии, а затем колониального режима. Таким образом, большая часть земель остается недостаточно развитой или находится под контролем клики аристократов. Социализм предлагает путь к процветанию крестьянства. Кабинет министров представил две программы земельной реформы, одна из которых предусматривает умеренную программу коллективизации, в то время как другая предполагает радикальные изменения. Некоторые призывают к быстрым действиям по преобразованию общества, но те, кто поддерживает умеренную программу, отмечают, что, возможно, именно умеренный путь приведет общество к социализму"
 FG_AL.4.d: "Проект коллективизации, который мы недавно запустили, столкнулся с серьезными препятствиями. Многие крестьяне отказываются отказываться от своих небольших владений. Что еще более важно, землевладельцы сохраняют контроль, платя крестьянам за то, чтобы они удерживали за собой земли, что противоречит цели программы. Государственные служащие, по-видимому, неспособны эффективно определять новые земли для обработки, а правительственные агенты не могут стимулировать местное производство. Нам придется свернуть программу коллективизации. Вдобавок ко всему, многие крестьяне возмущены действиями правительства, программа имеет катастрофические последствия, сельскохозяйственное производство резко сократилось"
 FG_AL.5.d: "Проблемы с бюрократией, слабость сельской власти и проблемы с коллективизацией вызвали острую нехватку продовольствия. Текущий год показывает стремительное падение производительности сельского хозяйства. Уже есть сообщения о голоде среди крестьянских общин, многие бегут в города. Стоимость продовольствия также растет, что вызывает панику среди городского населения. Наши собственные чиновники не смогли держать центральное правительство в курсе этих проблем, и многие министерства с трудом реагируют на них. Есть обещания международной помощи и поддержки, но они не придут достаточно быстро или в количестве, необходимом для нашего народа. В недавнем докладе кабинету министров министр сельского хозяйства отметил, что страна вступила в ситуацию голода."
 FG_AL.6.d: "Голод, охвативший Бангладеш, вызывает массовую гибель, а также истерию на улицах. Политиков, землевладельцев и даже военных обвиняют в том, что они отбирают продовольственные запасы у населения. Крестьяне, прибывающие в города в отчаянии, полицейские органы сообщают о протестах и росте преступности. У президента есть только один вариант. Он должен объявить чрезвычайное положение, чтобы мобилизовать государственные ресурсы и пресечь накопление продоольствия организованными преступными группировками. Как только мы стабилизируем экономику, мы будем бороться с растущим беззаконием и беспорядками. Многие в Лиге Авами признают, что оппозиция безрассудно стремится распространять опасные для стабильности слухи ради политической выгоды"
 FG_AL.7.d: "Бангладеш сталкивается с беспрецедентными проблемами. Правительство продолжает подвергаться нападкам со стороны оппозиции, которая, не колеблясь, публикует ложные новости, чтобы справоцировать население. Если мы хотим реализовать наше видение страны, мы должны принять радикальное решение. Сторонники этого хотят протолкнуть поправку к конституции, запрещающую все националистические партии. Затем президент сможет объявить чрезвычайное положение и создать однопартийное государство. Тогда мы сможем подчинить всех политиков президенту и полностью выполнить наши планы. Однако этот шаг, возможно, слишком радикален, но в любом случае необходимо принять решение"
 FG_AL.8.d: "Парламент Бангладеш с принял новую поправку, позволяющую президенту запрещать любую политическую партию во время чрезвычайного положения. Несмотря на яростные протесты оппозиции, которая утверждает, что новый закон создан для злоупотреблений. Президент заявляет, что законопроект обеспечит эффективное урегулирование чрезвычайной ситуации. Реакция средств массовой информации была неоднозначной. Проправительственные издания отмечают, что обострившийся политический кризис означает, что такие законы должны быть приняты. Оппозиционная пресса утверждает, что законопроект закладывает основу для правительственной диктатуры"
 FG_AL.9.d: "В свете все более нестабильной обстановки в стране президент Муджибур Рахман объявил чрезвычайное положение. В соответствии со своими чрезвычайными полномочиями президент объявил, что все политические партии должны быть запрещены. Он заявил о своих намерениях обеспечить прекращение политического кризиса в стране. Связаться с лидерами оппозиции для комментариев не удалось, так как большинство из них находятся под арестом. Хотя Муджибур Рахман пообещал восстановить нормальную жизнь после решения проблем, многие в стране не уверены, что это будет сделано"
 FG_AL.10.d: "Муджибур Рахман объявил о создании новой политической партии под названием Народная рабоче-крестьянская лига Бангладеш или НРКЛБ. Все политики обязаны присоединиться, включая всех действующих членов парламента. Страной будет управлять новый кабинет, состоящий из представителей всех основных политических партий. Муджибур Рахман называет новую партию необходимой для установления политической гармонии и единства. Объединив политическое руководство, Бангладеш наконец сможет принять свою судьбу. Из-за цензуры прессы неясно, как реагирует общественность. Однако иностранная пресса отмечает тревожную тишину среди людей, указывающую на то, что далеко не все довольны сложившейся ситуацией"
 FG_UNITY.1.d: "Исламские партии в Бангладеш требуют создания министерства по делам ислама. Они хотели бы, чтобы все законодательство было рассмотрено этим министерством, чтобы определить, совместимо ли оно с исламом. Это, конечно, неприемлемо, ведь религия должна быть вне политики. Вместо этого был достигнут компромисс по созданию Исламской академии для пропаганды ислама и предоставления необязательных рекомендаций правительству, когда его попросят. Однако даже это считается неприемлемым, особенно для левого крыла Авами Лиг, выступающего за полный секуляризм"
 FG_UNITY.2.d: "Группа лидеров левого крыла Авами Лиг вместе с членами других левых партий выдвинули требование к правительству значительно расширить права работников на создание политических организаций. Это вызывает беспокойство, поскольку Министерство финансов сообщает, что решение может оказаться неразумным, учитывая нынешнюю экономическую ситуацию. Лидеры бизнеса также призвали правительство не уступать таким требованиям. Однако профсоюзным лидерам ясно, что невыполнение этого требования может спровоцировать рабочие волнения. Правительство стоит перед трудным решением"
 FG_UNITY.3.d: "Недавнее решение правительства о расширении прав трудящихся принесло некоторые неожиданные выгоды. Отчеты указывают на увеличение производства и меньшее количество случаев беспорядков среди рабочих, которые усиливались в последние месяцы. Правительство не может не воспользоваться стабильностью на производстве и трудовых отношениях"
 FG_UNITY.4.d: "Авами Лиг и ее союзники уже давно выступают за радикальную реформу сельского хозяйства. Они считают, что колониальное и постколониальное государство поддерживало архаичные способы ведения сельского хозяйства, которые препятствовали развитию крестьянских хозяйств. Они считают, что коллективизация - это выход из кризиса. Авами Лиг предложила скромную программу коллективизации, чтобы не столкнутся с сильным сопротивлением других партии в коалиции. Однако более консервативные партии считают такой шаг слишком радикальным. Вместо этого они хотят провести земельную реформу, которая позволит государству конфисковывать непродуктивные земли для перераспределения среди крестьян. Если коллективизация будет проведена, единство правительства может оказаться под угрозой"
 FG_UNITY.5.d: "Правительство недавно запустило программу по приобретению неиспользуемых пахотных земель у крупных землевладельцев и распределению их между крестьянами. Программа пользовалась популярностью, однако она начала буксовать. Землевладельцы безнаказанно подкупают местных чиновников, чтобы гарантировать, что земля остается под их контролем через доверенных лиц. Правительство, похоже, не заинтересовано или неспособно остановить эту практику, подрывающую всю программу"
 FG_UNITY.6.d: "Провалившаяся программа земельной реформы привела к тому, что Бангладеш столкнулся с голодом. Сопротивление землевладельцев Правительство, по-видимому, не в состоянии привезти из-за границы достаточное количество продовольствия, чтобы исправить ситуацию. Возросший дефицит продовольствия уже приводит к росту цен на рынках. Многих фермеров обвиняют в массовых закупках продовольствия, как и правительственных чиновников. Ситуация быстро ухудшается, правительству скоро придется с этим разбираться"
 FG_UNITY.7.d: "Национализация - это вопрос, вызывающий разногласия в парламенте. Авами Лиг по-прежнему привержена широкомасштабной национализации, однако многие другие партии призывают к более постепенной программе национализации. Существует также широкая поддержка смешанной экономики (как частная, так и национализированная промышленность). Правительство предлагает программу национализации промышленности, базирующейся в Читтагонге. Однако более консервативные члены правительства предпочли бы более скромную программу национализации некоторых важнейших отраслей промышленности. Если программа промышленной национализации пройдет успешно, есть опасения, что \"правительство единства\" может рухнуть"
 FG_UNITY.8.d: "Вопрос расселения беженцев остается очень актуальным для правительства. Есть беженцы, которые прибыли во время провозглашения независимоси из Пакистана. Содержание их в лагерях не может быть долгосрочным решением, оно подрывает народную поддержку правительства. Один из планов предусматривает размещение этих беженцев в общинах, остро нуждающихся в рабочей силе для осуществления новых проектов развития. Другое предложение заключается в размещении беженцев в коммерческих районах, особенно на рынках, чтобы поддержать эту часть экономики"
 FG_UNITY.9.d: "Многие молодые левые все чаще критикуют правительство. Они чувствуют, что социализмом пренебрегают во имя политических компромиссов, а нынешнее партийное и государственное руководство оторвано от реальности. Многие хотят, чтобы некоторые из более высокопоставленных членов правительства и партии ушли в отставку и уступили место молодым лидерам. В Дакке вспыхивают все более ожесточенные и масштабные протесты, студенты требуют отставки правительства единства и внедрения в стране полного социализма. Авами Лиг может использовать эту группу в своих целях, выдвинув некоторых лидеров левого крыла на руководящие посты в партии, хотя это создалст нагрузку на правительство единства, возможно, разрушив его. Другой вариант - задействовать полицию для подавления этих протестов и попытаться навязать партийную дисциплину в кампусах"
 FG_UNITY.10.d: "Правительство единства, возглавляемое Авами Лиг, рухнуло. Партнеры по коалиции утверждают, что Авами Лиг не управляет на основе консенсуса, как заявлялось ранее. Этот шаг был предпринят после ряда разногласий в отношении недавнего законодательства. Партнеры по коалиции утверждают, что Авами Лиг стремится протолкнуть радикально-социалистическое законодательство. Хотя правительство единства распалось, Авами Лиг продолжает править, поскольку она занимает большинство мест в парламенте. Правительство опубликовало заявление, в котором отмечается, что оно сформировало \"правительство единства\" ради национального единства, но оппозиция теперь хочет играть в политику, хотя Бангладеш переживает критическиую ситуацию."
 FG_UNITY.11.d: "Внешняя политика вызывает серьезную озабоченность правительства. Те, кто сильно привязан к колониальному периоду и пакистанскому правительству, подталкивают к укреплению связей с Пакистаном. Они видят, что бангладешская демократия и экономика неразрывно связаны Пакистаном. Социалисты и прочие левые хотят сосредоточиться на улучшении связей с социалистическим миром. Они верят, что будущее Бангладеш заключается в создании социалистического общества. Наконец, многие считают, что большая часть проблем, с которыми сталкивается Бангладеш, связана с иностранным влиянием, они хотят сосредоточиться на связях с соседями и региональными державами"
 FG_UNITY.12.d: "Голод, охвативший Бангладеш, вызывает массовые смерти, а также истерию на улицах. Политиков, землевладельцев и даже военных обвиняют в том, что они отбирают продовольственные запасы у населения в целом. Крестьяне, прибывающие в город, в отчаянии, полицейские органы сообщают о насильственных протестах и росте преступности. У президента есть только один вариант. Он должен объявить чрезвычайное гуманитарное положение, чтобы мобилизовать государственные ресурсы и пресечь накопительство организованных преступных элементов. Как только мы стабилизируем экономику, мы также будем бороться с растущим беззаконием и политическими беспорядками. Многие в Лиге Авами признают, что оппозиция безрассудно стремилась распространять опасные слухи ради политической выгоды, несмотря на усилия партии управлять в единстве."
 FG_UNITY.13.d: "Нация сталкивается с беспрецедентными вызовами в социальном, политическом и экономическом плане. Нынешний голод показал ограниченность правительства единства. Если мы хотим донести видение Авами Лиг до нации, некоторые в партии предлагают радикальное решение. Они хотят протолкнуть поправку к конституции, запрещающую все политические партии, чтобы способствовать истинному национальному единству. Затем президент может объявить чрезвычайное положение и создать однопартийное государство. Тогда мы сможем подчинить всех политических лидеров президенту и полностью выполнить нашу повестку дня. Однако этот шаг, возможно, слишком радикальен, необходимо принять решение"
 FG_UNITY.14.d: "Президент встретился с министром финансов и ключевыми экономическими советниками, чтобы определить детали новой схемы индустриализации Читтагонга. Из-за текущего финансового состояния нашей страны возможен только ограниченный проект. Правительство может сосредоточиться на создании инфраструктурной базы, обеспечивая будущий рост за счет укрепления транспорта и производства электроэнергии в этом районе. Или же он может сосредоточиться на создании новых фабрик, чтобы как можно скорее расширить производство. По оценкам, завершение проекта займет три года."
 FG_UNITY.15.d: "Президент провел пресс-конференцию, подтвердив, что Программа промышленной национализации завершила свою работу в Читтагонге. Он высоко оценил создание нескольких государственных электростанций и городскую инфраструктуру города. Заложена основа для устойчивого, быстрого промышленного роста, который обеспечит возможности, развитие и процветание региона. Средства массовой информации восхваляют эту программу как образец для других регионов страны. Представитель Авами Лиг выступил с отдельным заявлением, в котором высоко оценил сотрудничество государственных институтов в области экономического развития."
 FG_UNITY.16.d: "Президент провел пресс-конференцию, подтвердив, что Программа промышленной национализации завершила свою работу в Читтагонге. Он высоко оценил создание в городе множества государственных промышленных предприятий. Регион, по-видимому, настроен на устойчивый, быстрый экономический рост, который обеспечит возможности, развитие и процветание для региона. Средства массовой информации восхваляют эту программу как образец для других регионов страны. Представитель Авами Лиг выступил с отдельным заявлением, в котором высоко оценил сотрудничество государственных институтов в области экономического развития."
 BAN_JSD.1.d: "Новый режим Национальной Социалистической Партии Бангладеш (НСПБ) объявил о серьезных преобразованиях в вооруженных силах. Партия объявила, что все реакционные и нелояльные элементы должны быть изгнаны из армии. Поступают сообщения о массовых арестах, особенно солдат и офицеров. Военные подготовительные школы также подвергаются рейдам, объявлено о планах изменить учебную программу. Некоторые высокопоставленные бангладешские офицеры бежали из страны, многие бежали в Индию. Когда представителя правительства спросили о судьбе арестованных сотрудников, он заявил, что их будут судить военные трибуналы."
 BAN_JSD.2.d: "Новое правительство Бангладеш обещает принести истинный социализм своему народу. Его радикальные идеи и повестка дня изолировали его от соседей и других держав. Дипломатический представитель Бангладеш недавно обратился к нам с просьбой о соглашении об экономической и военной помощи. Бангладеш желает ускорить свой переход к социалистической экономике и создать боеспособную армию для защиты своей революции. Наши эксперты указывают, что новый режим предпринял значительные усилия по чистке контрреволюционеров, особенно в своих вооруженных силах. Без всесторонней поддержки они с трудом удержаться у власти. Поддержка режима может дать нам социалистического союзника в регионе, но некоторые советники считают, что новый режим слишком нестабилен, и мы не должны поддерживать потенциально саморазрушительный режим"
 BAN_JSD.3.d: "Недавно мы получили крупный пакет экономической помощи от Советского Союза. Это большое благо для революции и обеспечивает гораздо большую легитимность нашему режиму. Экономика Бангладеш долгое время была жертвой эксплуатации со стороны колонизаторов и оккупантов. Мы должны построить экономику, предназначенную для роста благосостояния людей, а не для внешних интересов. Советская помощь и советники сыграют ценную роль в содействии успеху революции. В рамках соглашения мы можем ожидать регулярных визитов советских официальных лиц для наблюдения за нашими действиями"
 BAN_JSD.4.d: "Мы получили крупные пакеты экономической и военной помощи с Советским Союзом. Это будет иметь большое значение для укрепления революции и отношени к нашему режиму в социалистическом мире. Наша экономика долгое время была жертвой эксплуатации как колонизаторами, так и оккупантами. Советская поддержка поможет превратить Бангладеш в промышленный рай для рабочих. У революции много врагов, как внутри страны, так и за ее преелами. Слабые вооруженные силы означают незащищенную революцию. Советский Союз планируют обеспечить передовую подготовку и вооружение для наших военных. Наши старшие офицеры больше не будут выпускниками империалистических высших учебных заведений"
 BAN_JSD.5.d: "После того, как мы в частном порядке обратились к Советскому Союзу для переговоров, нам  отказали. Похоже, у нашей революции есть враги внутри страны, за рубежом и внутри социалистического лагеря. Советскию Союз не назвал четкой причины, просто заявив, что им необходимо полностью оценить ситуацию. Они, однако, согласилась сохранить свое посольство в стране. Теперь ясно, что внешние силы стремятся задушить нашу революцию в колыбели, мы должны объединиться как нация, чтобы окончательно освободить наш народ от оков империализма и капитализма"
 BAN_JSD.6.d: "Индийское коммунистическое движение обширно и включает в себя социалистов и коммунистов самых разных течений. Некоторые из наиболее радикальных все чаще обнаруживают, что их голос игнорируется более популярным движением, которое, по-видимому, стремится действовать в рамках капиталистического и феодального порядка в Индии. Некоторые из наиболее радикальных лидеров также являются объектом правительственных репрессий. За последние несколько недель в Дакку прибыло несколько таких радикальных коммунистических лидеров. Как революционный режим, мы приветствуем этих активистов, которые выступают с публичными обращениями, как на публичных собраниях, так и по радио. Они также публикуют важные статьи и журналы о своем деле. Посол Индии постоянно просит нас депортировать этих активистов или свернуть их деятельность, но мы никогда не предадим революционеров"
 BAN_JSD.7.d: "Комитеты пролетариата создаются по всей стране. Местные рабочие избирают местных представителей для управления своим районом. Эти комитеты также предоставляют мнения и жалобы своего сообщества региональным партийным структурам. Это представительства на самом низком уровне, дающее право голоса в том числе и всем бангладешцам"
 BAN_JSD.8.d: "После нескольких недель обсуждений Центральный Комитет Экономического Планирования готов решить, по какому пути должна двигаться экономика в течение следующих десяти лет. Одна фракция считает, что Бангладеш должен заложить фундамент для будущего роста, они хотят сосредоточиться на развитии инфраструктуры. Другая фракция верит в сельское хозяйство, они хотят развивать этот сектор, наряду с расширением банков и портовых сооружений, чтобы в конечном итоге экспортировать произведённое нашим сельским хозяйством. Наконец, фракция промышленников считает, что создание мощной промышленной базы будет способствовать быстрому экономическому росту. Необходимо принять решение"
 BAN_JSD.9.d: "Предыдущий режим инициировал план национализации, но он был выполнен лишь наполовину. Мы планируем включить большинство из этих планов в наши собственные усилия. Однако наши экономические консультанты считают, что при небольшом внимании мы можем быстро завершить проект и немедленно получить результаты. Мы должны решить, какой проект завершить. Мы можем завершить проект коллективизации, промышленный проект или проект финансовой независимости сельских районов. Только наш режим способен превратить неудачные усилия предыдущего правительства в успех для нашй страны и её народа"
 Bangladesh_Federation.1.d: "После создания Федерации с Пакистаном Учредительное собрание создало конституцию для Восточного Пакистана. Ведущие политические и общественные лидеры Восточного Пакистана встречаются под председательством судьи Высшего суда Дакки Абдуса Саттара. В качестве беспрецедентного шага обсуждения в ассамблее должны оставаться закрытыми и не публиковаться. Это делается для предотвращения неправомерного влияния либо со стороны федерального правительства, либо со стороны местных политических партий. Через три месяца после завершения работы над конституцией состоятся всеобщие выборы."
 Bangladesh_Federation.2.d: "Одна из первых дискуссий касается прав человека в провинции. Некоторые хотят установить конституцией права человека, аналогично тому, что установлено британской и американской конституциями. Сторонники такого подхода видят в нем соответствие международным нормам для всех цивилизованных обществ. Однако другая группа в ассамблее утверждает, что ислам по своей сути гарантирует все права человека. Они хотят конституции, поддерживающей универсальные принципы прав человека в соответствии с исламскими традициями. После ожесточенных дебатов должно быть принято решение"
 Bangladesh_Federation.3.d: "Так же проблемой на раннем этапе является роль религии и секуляризма в конституции. Многие члены ассамблеи получили образование в светских учреждениях или работают по светским профессиям. Однако ислам является религией многих жителей Восточного Пакистана, и ряд религиозных лидеров были выбраны народом, чтобы представлять их на ассамблее. Эти члены утверждают, что ислам по своей сути является наиболее справедливой религией, и конституция должна начинаться с заявления, провозглашающего приверженность принципам ислама. Однако члены либеральной партии считают это потенциально проблематичным и хотели бы сохранить документ светским, чтобы защитить интересы всех граждан Восточного Пакистана"
 Bangladesh_Federation.4.d: "Восточный Пакистан является домом для разнообразного населения, включая меньшинствf и недопредставленные общины. Пакистан был основан из-за отказа партии Конгресса сохранить политические права общин меньшинств, естественно, что конституция Восточного Пакистана продолжит политику сохранения мест меньшинств. Более традиционные элементы желают получить щедрые зарезервированные места, особенно для женщин и индуистских общин. Однако либеральные элементы указывают на то, что это предложение потенциально ограничит электоральный потенциал этих общин. Они хотят предложить более ограниченную долю зарезервированных мест, чтобы предоставить больше возможностей для прямой демократии общинам меньшинств"
 Bangladesh_Federation.5.d: "Учредительное собрание обсуждает степень власти парламента. Многие члены парламента считают, что большая часть исполнительной власти должна принадлежать премьер-министру. Наделенный полномочиями премьер-министр мог бы непосредственно руководить законодательной властью. Что еще более важно, премьер-министр должен быть членом парламента, для чего необходимо, чтобы исполнительная власть избиралась народом. Однако есть и другие члены, которые считают, что наделенный полномочиями глава исполнительной власти должен обладать большей частью исполнительной власти. Сторонники более сильного главы исполнительной власти считают, что это поддержало бы баланс между ветвями власти. Что еще более важно, такой глава исполнительной власти не был бы заангажирован в политике внутри парламента"
 Bangladesh_Federation.6.d: "Восточный Пакистан имеет богатую судебную историю. Самые ранние колониальные суды были основаны в Бенгалии. Многие из самых известных лидеров Восточного Пакистана имеют юридическое образование. Вопрос в том, следует ли парламенту обращаться за проверкой законодательства к Верховному суду Пакистана или к Верховному суду Восточного Пакистана, который будет создан в соответствии с конституцией. Те, кто выступает за расширение связей с Западным Пакистаном, поддерживают обращение в Верховный суд Пакистана. Однако те, кто желает большей автономии, хотят создать Верховный суд Восточного Пакистана, зная, что в будущем это, вероятно, приведет к серьезной судебной головной боли в будущем"
 Bangladesh_Federation.7.d: "Учредительное собрание Восточного Пакистана представило конституцию, которая решительно выступает за федеративную модель отношений с Западным Пакистаном. Многие отмечают, что документ соответствует конституции Пакистана по ряду вопросов и тем. Члены парламента, разработавшие проект конституции, восхваляют ее как гарантирующую единство Пакистана и обеспечивающую достоинство восточных пакистанцев. Имели место спорадические протесты, особенно со стороны бенгальских националистов, которые осуждают документ как подготовленный элитами для подавления голоса масс. Выборы состоятся через три месяца, и победившие партии должны будут окончательно определить отношения с Пакистаном"
 Bangladesh_Federation.8.d: "Учредительное собрание Восточного Пакистана представило конституцию, которая решительно выступает за большую автономию в составе Пакистана. Говорят, что ведущие политические, военные и правительственные чиновники обеспокоены этим документом. Западно-пакистанские газеты критиковали его за то, что временами он полностью противоречил духу конституции Пакистана. В Восточном Пакистане бенгальские националисты провели несколько митингов в поддержку этого документа. Однако конституцию хвалят не все, поскольку многие представители среднего класса и консервативные жители Восточного Пакистана выразили обеспокоенность по поводу конституции, которую они считают провоцирующей конфронтацию. Выборы состоятся через три месяца, и победившие партии должны будут окончательно определить отношения с Пакистаном"
 Bangladesh_Federation.9.d: "К удивлению немногих, на всеобщих выборах в Восточном Пакистане доминировали партии, выступающие за федерацию. Коалиция этих партий вскоре сформируется для управления и установления прочных, новых отношений между частями Пакистана. Выборы прошли в почти праздничной атмосфере, хотя некоторые группы, выступающие за автономию, обвиняли избирателей в манипулировании ими. Они утверждали, что новая конституция предоставляет широкие избирательные права, предоставляя полное избирательное право многим западным пакистанцам, которые недолго жили в провинции или служили там в правительственных или военных целях. Несмотря на эти обвинения, похоже, что выборы в целом принимаются положительно"
 Bangladesh_Federation.10.d: "К удивлению немногих, на всеобщих выборах в Восточном Пакистане доминировали партии, выступающие за автономию. Коалиция этих партий, возглавляемая Авами Лиг, вскоре сформируется для управления и установления прочных, новых отношений между крыльями Пакистана. Ожидается, что шейх Муджибур Рахман возглавит правительство. Выборы прошли в почти праздничной атмосфере, хотя некоторые группы, выступающие за федерацию, обвиняли избирателей в манипулировании ими. Они утверждают, что новая конституция сделала требования к проживанию настолько строгими, что многие западнопакистанцы, у которых есть коммерческие или семейные интересы в Восточном Пакистане, не смогли принять участие. Как бы то ни было, похоже, что выборы в целом принимаются"
 Bangladesh_Federation.11.d: "С объявлением о создании федерации между Западным и Восточным Пакистаном высокопоставленные бюрократические и административные чиновники обоих частей, наряду с федеральными чиновниками, встретились, чтобы обсудить разделение активов. Недавно обе стороны заключили соглашение не только о разделе активов, но и о распределении обязанностей между федеральными и провинциальными правительствами. Соглашение в основном хорошо воспринято, хотя некоторые восточнопакистанские СМИ, выступающие за автономию, жалуются, что Восточный Пакистан остается в значительной степени подчиненным центру. Пресс-секретарь президента высоко оценил успешные переговоры, заявив, что это маленький, но важный шаг к созданию более сильного Пакистана."
 Bangladesh_Federation.12.d: "После трудных переговоров пакистанские военные чиновники подтвердили, что согласились разрешить своим солдатам решать, служить ли в вооруженных силах Западного Пакистана или в молодых вооруженных силах Восточного Пакистана. Ожидается, что практически все солдаты из Восточного Пакистана выберут Восточный Пакистан, хотя есть признаки того, что некоторые западные пакистанцы, имеющие семейные связи с жителями Восточного Пакистана, также могут присоединиться. Детали остаются отрывочными, но, похоже, Западный Пакистан передаст технику для не менее двух пехотных дивизий. Также ожидается передача истребителей для восточной части. Президент похвалил военных за их способность сохранять Пакистанскую Федерацию. В разговорах говорят, что западно-пакистанские офицеры испытывают раздражение, но ожидается, что они выполнят соглашение"
 Bangladesh_Federation.13.d: "Федеральное правительство Пакистана завершило разработку своего плана по созданию регионального правительства в Восточном Пакистане. Соглашение о федерации предусматривает, что Восточный Пакистан будет иметь своё собственное правительство и не будет полностью подчиняться федеральным властям, базирующимся в Западном Пакистане. Сотрудники из Восточного Пакистана в федеральном правительстве возглавляют новые отделы, создаваемые в Дакке. Соглашение широко приветствуется в обоих кругах, хотя до сих пор не существует механизма для устранения любых противоречий, которые могут возникнуть в политике или применении законодательства"
 Bangladesh_Federation.14.d: "Государственный банк Пакистана объявил, что все его активы в Восточном Пакистане отныне будут управляться Государственным банком Восточного Пакистана. Новый банк будет обладать всеми полномочиями для управления финансами Восточного Пакистана. Всем банкам, работающим в Восточном Пакистане, больше не нужно регистрировать или поддерживать какие-либо активы в Западном Пакистане. Новый банк пообещал инициировать ряд изменений, которые подстегнут экономический рост в Восточном Пакистане. Экономисты обоих частей Пакистана полагают, что экономика Восточного Пакистана, скорее всего, переживет серьезный бум, поскольку федеральная налогово-бюджетная политика ранее была сосредоточена на росте в Западном Пакистане."
 Bangladesh_Federation.15.d: "После обсуждений за закрытыми дверями было достигнуто соглашение относительно окончательного статуса Восточного Пакистана. Президент Пакистана объявил подробности после завершения длительных дискуссий с лидерами Восточного Пакистана. Восточный Пакистан сохранит свою про-федеративную конституцию и получит больше возможностей для контроля над своим развитием. Однако внешняя политика, экономика и оборона останутся в ведении федеральной власти. Законодательство, принятое в Восточном Пакистане, должно соответствовать федеральной конституции. Соглашение восхваляется в обоих субъектах федерации как подлинный политический компромисс. Критика исходит только от сторонников автономии, таких как Авами Лиг в Восточном Пакистане. Эти группы рассматривают соглашение как капитуляцию перед требованиями Западного Пакистана и называют автономию, обещанную в соглашении, иллюзией. Эта критика не привела к уличным протестам, так что, похоже, все пакистанцы готовы дать шанс этой новой политической системе"
 Bangladesh_Federation.16.d: "Дискуссии между президентом Пакистана и недавно избранными должностными лицами Восточного Пакистана завершились после изнурительных переговоров. Говорили, что выступающая за автономию Авами Лиг выдвигает обширные требования к федеральному правительству. Встречные предложения были в основном отвергнуты обеими сторонами. После того, как переговоры затянулись еще на две недели, было решено, что Восточный Пакистан получит независимость, но будет создан союз Бангладеш и Пакистана. Бангладешское правительство планирует провести опросы об отношении населения к независимости, в то время как Пакистан готовится к тому, что потеряет часть территорий. Хотя многие пакистанцы разочарованы, большинство понимает, что признание Восточного Пакистана фактически независимой страной создаёт опасный прецедент, который может быть использован в будущем"
 Bangladesh_Federation.17.d: "Решение сделать Бангладеш независимым было трудным для президента. Однако руководство Восточного Пакистана (Бангладеш) не желало идти на компромисс в своих требованиях. Пакистанская военная и политическая элита признала, что такой сценарий приведет к большим потрясениям, если другие провинции потребуют аналогичных уступок. Президент отметил, что руководство Восточного Пакистана хотело получить большинство мест в Национальной ассамблее, наслаждаясь при этом фактической независимостью, что является неприемлемым сценарием. Поддержание дипломатического и военного союза будет иметь большое значение для мирного разделения, совершенного братскими народами. Будет переходный период, но большая часть процесса отделения уже произошла в течение недолгого периода федерации"
 BAN_2AL.0.d: "В Бангладеш завершились вторые всеобщие выборы с момента обретения независимости. Люди с нетерпением ждут результатов. Было отмечено, что количество избирателей было очень высоким. Ожидается, что эти выборы не станут легкими для правящей Авами Лиг. Количество проблем и кризис, обрушившийся на правительство, открыли возможность для консервативных партий заручиться поддержкой. Авами Лиг продолжает обещать социализм, отмечая, что проблемы, с которыми недавно столкнулись, отражают то, что происходит, когда общество снимает оковы рабства, наложенные на людей предыдущими режимами. Консервативные партии, объединившиеся в коалицию, осуждают Авами Лиг за коррупцию, бесхозяйственность и желание добиться политического господства. Эксперты и наблюдатели не уверены, на чьей стороне преимущество"
 BAN_2AL.1.d: "Бангладеш сталкивается с беспрецедентными проблемами. Правительство продолжает подвергаться нападкам со стороны оппозиции, которая, не колеблясь, публикует ложные новости, чтобы раззадорить население. Если мы хотим реализовать наше видение нации, то, возможно, нужно принять радикальное решение. Сторонники этого хотят протолкнуть поправку к конституции, запрещающую все националистические и консервативные партии. Затем президент сможет объявить чрезвычайное положение и создать однопартийное государство. Тогда мы сможем подавить всех оппощиционных и реализовать наши идеи. Однако этот шаг, возможно, слишком радикален, но в любом случае необходимо принять решение"
 BAN_2AL.2.d: "Парламент Бангладеш принял новую поправку, позволяющую президенту запрещать любую политическую партию во время чрезвычайного положения. Несмотря на яростные протесты оппозиции, которая утверждает, что новый закон создан для злоупотреблений, он был принят. Президент заявляет, что законопроект обеспечит эффективное урегулирование чрезвычайныых ситуаций. Реакция средств массовой информации была неоднозначной. Правительственные издания отмечают, что обострившийся политический кризис означает, что такие законы (хотя и непопулярные) должны быть приняты. Оппозиционная пресса утверждает, что законопроект закладывает основу для диктатуры правительства"
 BAN_2AL.3.d: "В свете все более нестабильной политической обстановки президент Муджибур Рахман объявил чрезвычайное положение. В соответствии со своими чрезвычайными полномочиями президент объявил, что все политические партии должны быть запрещены. Он заявил о своих намерениях решить проблему политического кризиса в стране. Связаться с лидерами оппозиции для комментариев не удалось, большинство из них находятся под арестом. Хотя Муджибур Рахман пообещал восстановить нормальную жизнь как только политический кризис кончится, многие в стране не уверены в том, что это произойдет"
 BAN_2AL.4.d: "Президент Муджибур Рахман объявил о создании новой политической партии под названием Народная Рабоче-Крестьянская Лига Бангладеш или НРКЛБ. Все политики (включая всех действующих членов парламента) обязаны присоединиться. Страной будет управлять новый кабинет, состоящий из представителей всех основных политических партий. Муджибур Рахман называет новую партию необходимой для установления политической гармонии и единства. Объединив политическое руководство, Бангладеш наконец сможет стать стабильным. Из-за цензуры прессы неясно, как реагирует общественность. Однако иностранная пресса отмечает тревожную тишину среди людей, указывающую на то, что не все согласны с ситуацией"
 BAN_2AL.5.d: "Многие нынешние госслужащие начали службу ещё при колониальном правительстве, но они находятся под сильным влиянием империалистических идеалов. Они часто тянут время или недостаточно эффективно реализуют наше видение страны. Некоторые высокопоставленные члены партии считают, что мы должны провести перевыборы и заменить высокопоставленных чиновников лояльными партии. Мы также можем назначать сторонников на ключевые посты, чтобы укрепить правительство. Однако это может иметь непредвиденные последствия так что, возможно, было бы лучше отделить службу государству от политики"
 BAN_2AL.6.d: "Наши усилия по замене госслужащих партийными лоялистами обеспечили нам большую поддержку, особенно со стороны региональных партий. Однако госслужащие теряют моральный дух. Говорят, что многие из более опытных госслужащих расстроены отсутствием продвижения по службе и попаданием в подчинение к неквалифицированным членам партии. Что еще более важно, ряд ценных госслужащих с отвращением подали в отставку, что затруднило подготовку тех, кто их заменит. Пройдет несколько лет, прежде чем правительсвенный аппарат вернется к своему прежнему уровню эффективности"
 BAN_2AL.7.d: "Наше решение сделать государственную службу отдельной от политики привело к некоторым проблемам. Многие региональные партии жалуются на то, что политика, инициированная правительством, осуществляется неэффективно. Это подрывает поддержку правительственных инициатив. Кроме того, все больше сотрудников государственных служб занимают руководящие должности, а их предшественники уходят на пенсию. Это создает нагрузку на бюджет, поскольку мы должны выплачивать растущие зарплаты наряду с пенсиями. Несмотря на эти неудачи, на службу поступает новое поколение офицеров, которые со временем могут оказаться более эффективными"
 BAN_2AL.8.d: "Индия долго поддерживает нашу страну. Однако многие бангладешцы относятся к Индии враждебно. Это проистекает из-за разделения и наших пограничных конфликтов. Мы отчаянно нуждаемся в экономической и военной поддержке для обеспечения нашего развития. У Индии есть ресурсы, чтобы помочь нам. Мы можем обратиться к Индии для проведения переговоров, и это может стать большим благом. Однако оппозиция, скорее всего, воспримет такие усилия как пример того, что Авами Лиг якобы является марионеткой Индии"
 BAN_2AL.9.d: "Правительство Бангладеш недавно обратилось к нам с просьбой о проведении всеобъемлющих переговоров. Бангладеш нужны военная техника и экономические советники. Мы, конечно, можем оказать хотя бы экономическую поддержку. Однако в министерстве иностранных дел есть некоторые, кто считает, что Бангладеш уже давно пользуется нашей поддержкой, продолжая конфронтацию, особенно в том, что касается пограничных вопросов. Они предлагают, чтобы мы просто сосредоточили обсуждения на расширении двусторонних отношений. Мы должны подумать о том, как подойти к переговорам"
 BAN_2AL.10.d: "Наше правительство недавно заключило ряд новых соглашений с Индией. Хотя мы подчеркивали преимущества соглашения, последовала существенная негативная реакция. Оппозиция и националисты обвиняют нас в том, что мы в очередной раз пресмыкаемся перед индийской властью. В ближайшие дни запланировано несколько демонстраций. Несмотря на негативную реакцию, соглашение в целом принесет пользу стране и поможет нам реализовать наше видение Бангладеш. Чтобы предотвратить дальнейшие протесты, мы решили отменить предстоящую пресс-конференцию с участием посла Индии, восхваляющего недавние соглашения"
 BAN_CC.1.d: "Государственная служба, ее экзаменационная система и набор работников берет свое начало из колониальной системы. Усиливается давление на правительство с целью проведения реформ учебной программы и требований к госслужащим. Это позволило бы большей части населения получить доступ к такой карьере. Реформы будут включать в себя отмену некоторых требований к западным языкам и замену элементов учебной программы с уделением большего внимания культуре Бангладеш. Реализация этих мер потребует времени, и эффективность снизится. Критики этих мер также ставят под сомнение необходимость изменения бюрократической структуры, которая оставалась относительно эффективной и полностью аполитичной с момента обретения независимости. Кабинету министров нужно будет принять решение"
 BAN_CC.2.d: "Правительство готовится обнародовать кампанию по приватизации предприятий Кхулны. Кампания будет иметь важное значение для того, чтобы убедить народ Бангладеш в том, что национализация - это бессмысленная политика, подверженная коррупции и ограниченниям роста. В ходе кампании мы продадим убыточные государственные предприятия, чтобы помочь стимулировать развитие Кхулны как финансового центра страны. Мы надеемся, что к концу программы мы не только поможем поддержать финансовое развитие, но и увидим рост нашего промышленного производства по мере того, как эти убыточные государственные предприятия перейдут в частный сектор. Министр финансов настолько уверен в себе, что предложил пересмотренный план, призывающий нас максимально распродать государственные предприятия для достижения еще большего успеха. Президент должен решить, принять ли рекомендацию или сохранить план в изначальном виде"
 BAN_CC.3.d: "Недавняя приватизационная кампания привела к огромному успеху. Распродажа многих государственных предприятий поначалу застала нацию врасплох, и многие левые издания назвали это вопиющим предательством трудящихся. Однако очевидно, что большинство из этих бывших государственных предприятий процветают в частной собственности, стимулируя промышленное производство в стране и предоставляя больше рабочих мест для работников. Что еще более важно, приватизация позволила правительству позиционировать Кхулну как крупный финансовый центр региона. Многие банки, в том числе из-за рубежа, пользуются государственными льготами для открытия отделений в городе. Популярность правительства увеличилась до беспрецендентного размера"
 BAN_CC.4.d: "Недавняя приватизационная кампания закончилась провалом. Несмотря на обещания о том, что распродажа убыточных государственных предприятий приведет к росту и инновациям в промышленности и экономике, этого не осуществилось. Многие из этих новых, приватизированных предприятий находятся на грани краха. Неспособность расширить производство или увеличить экономический рост привела к тому, что многие предприятия сократили количество рабочих и заработную плату, что привело к интенсивным трудовым конфликтам. В конечном итоге это вынудило правительство вмешаться и поддержать некоторые из этих предприятий, чтобы предотвратить насилие на улицах. В конечном счете правительству пришлось отказаться от своего плана и признать, что его исполнение привело к снижению промышленного роста. Оппозиция использует эту возможность, чтобы дискредитировать правительство из-за его провала"
 BAN_CC.5.d: "Недавняя приватизационная кампания оказалась успешной. Распродажа государственных предприятий поначалу застала многих врасплох, а некоторые левые издания назвали это вопиющим предательством трудящихся. Однако очевидно, что многие из этих бывших государственных предприятий процветают в частной собственности, стимулируя промышленное производство в стране и обеспечивая больше рабочих мест, а иногда и более высокую заработную плату для работников. Что еще более важно, высвобождение капитала позволило правительству представить Кхулну как крупный финансовый центр региона. Приток финансовых организаций, особенно региональных банков, преображает регион. Правительство пользуется все большей популярностью благодаря своей программе"
 BAN_CC.6.d: "Правительство объявило, что приостановит свою приватизационную кампанию. Несмотря на обещания о том, что распродажа убыточных государственных предприятий приведет к росту и инновациям в промышленности и экономике, это не осуществилось. Многие из этих новых, приватизированных предприятий находятся на грани краха. Неспособность расширить производство или экономический рост привела к тому, что многие предприятия сократили персонал и заработную плату, что привело к интенсивным трудовым конфликтам. В конечном счете правительство признало, что его программа привела лишь к снижению промышленного роста. Оппозиция использует эту возможность, чтобы дискредитировать правительство из-за его провала"
 BAN_CC.7.d: "Представители консервативных партий, состовляющих коалицию и в настоящее время правящих Бангладеш, недавно подписали партийную конституцию, чтобы сформировать единую политическую партию под названием Националистическая партия Бангладеш (НПБ). Подписанты, все лидеры партий - членов коалиции, согласились служить при президенте и немедленно передать свои партии новому Центральному комитету в случае прикааза. Объявление о создании новой партии полностью меняет политический ландшафт в Бангладеш. У Авами Лиг, которая традиционно доминировала среди левых, теперь есть равный противник с доминированием среди правых в стране. НПБ превозносят как стабилизирующую силу для бангладешской политики\"."
 BAN_CC.8.d: "Представители консервативных партий, состовляющих коалицию и в настоящее время правящих Бангладеш, недавно подписали партийную конституцию, чтобы сформировать единую политическую партию под названием Националистическая партия Бангладеш (НПБ). Подписанты, все лидеры партий - членов коалиции, согласились служить при президенте и немедленно передать свои партии новому Центральному комитету в случае приказа. Объявление о создании новой партии полностью меняет политический ландшафт в Бангладеш. У Авами Лиг, которая традиционно доминировала среди левых, теперь есть равный противник с доминированием среди правых в стране. НПБ превозносят как стабилизирующую силу для бангладешской политики"
 JSD_Insurgency.102.d: "Мирные протестующие, поддерживающие НСПБ, были встречены стрельбой со стороны правительственных военизированных формирований под названием \"Национальные силы обороны\" (НСО). НСПБ утверждала, что было убито до шестидесяти протестующих, в то время как правительство утверждает, что эта цифра составляет пять или шесть человек. Стрельба произошла после того, как протестующие из НСПБ окружили резиденцию министра внутренних дел. Протестующие были возмущены сообщениями о коррупции, в которых она обвинялась в недавнем всплеске инфляции по всей стране. НСО утверждают, что протестующие вышли из-под контроля и, чтобы предотвратить серию инцидентов, применили силу. Стрельба вызвала гнев многих бангладешцев, которые все чаще рассматривают НСО как вооруженное крыло правящей Авами Лиг. НСО также сталкивается с обвинениями в пытках и незаконных задержаниях."
 JSD_Insurgency_Decisions: "Восстание Национальной Социалистической Партии Бангладеш"
 JSD_Insurgency_Decisions_desc: "Национальная Социалистическая Партия Бангладеш отделилась от молодежного крыла Авами Лиг. Они покинули партию, поскольку сочли, что Авами Лиг не выполнила своего обещания принести социализм в Бангладеш. Группа сформировала вооруженную организацию под названием гонобхайни. Опасаясь усиления коррупции и государственных репрессий, партия начала мятеж против правительства. НСПБ хочет свергнуть Авами Лиг, заменить старую гвардию новой и принести стране истинный социализм.\n\n[?ROOT.НСПБ_Strength|R]%"
