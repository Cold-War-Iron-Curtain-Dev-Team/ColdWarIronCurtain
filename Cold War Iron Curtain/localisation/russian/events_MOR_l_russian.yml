l_english:
 MOR_SETUP.1.d: "Марокко находится на перепутье, и напряженность растет. Страна разделена с Францией и Испанией, обе оккупируют колониальные владения. Султан Мухаммед V вступил на престол в 1927 году и до сих пор умудрялся противостоять влиянию Франции и Испании, чтобы сохранить свою власть и утвердить легитимность у народа. Городских марокканцев все больше привлекают арабские националистические идеи и стремление к вооруженной борьбе против колониальных оккупантов Марокко. Для борьбы с этим новым вызовом султан недавно призвал к независимости и восстановлению суверенитета Марокко. Теперь он должен иметь дело с французским и испанским влиянием, а также уравновешивать свои отношения с традиционной базой своих сторонников и городскими антиколониальными арабскими националистами. Всего несколько лет назад марокканцы добровольно вызвались стать одними из самых эффективных французских войск во Второй мировой войне и Гражданской войне в Испании."
 MOR_Assasin.1.d: "Видный лидер марокканской освободительной армии Аббас Мессаади был застрелен в Фесе. Марокканская освободительная армия-это разрозненная организация сельских антиколониальных борцов, готовых сражаться до тех пор, пока не будет освобожден весь Магриб. Убийство вызвало немедленное возмущение среди антиколониальных активистов и арабских националистов. Аббаса Мессаади уже объявляют мучеником за это дело. Султан находится в трудном положении, так как убийца или убийцы не были захвачены, и ни одна группа не взяла на себя ответственность. Если арест не будет произведен в ближайшее время, ситуация с безопасностью в стране может быстро ухудшиться."
 MOR_Assasin.2.d: "Марокканское правительство объявило об аресте Карима Хаджаджа, члена партии Истикляль. Говорят, что он совершил недавнее убийство Аббаса Мессаади, видного лидера марокканской освободительной армии. Мессаади был ярым критиком Истикляля, и многие из его сторонников почти сразу почувствовали ответственность партии. Султан в значительной степени согласился с арестом, чтобы быстро снизить напряженность и ослабить партию, которая стала все более критично относиться к его правлению. Карим Хаджадж обвиняется в том, что спустил курок по приказу видного лидера партии Истикляль Мехди Бен Барки. Ожидается, что Хадж будет быстро судим и осужден за свою роль. Партия Истикляль попыталась дистанцироваться от стрелка и заговора, но столкнулась с негативной реакцией общественности."
 MOR_Assasin.3.d: "Султан Мухаммад V недавно помиловал Карима Хаджаджа, осужденного за убийство видного лидера Освободительной армии Марокко Аббаса Мессаади. Султан принял это решение после получения информации о том, что Мессаади на самом деле был убит местной бандой в Тазе, нанятой для совершения убийства. Это убийство первоначально вызвало ожесточенный гнев и волнения, которые были подавлены после ареста Хаджаджа, члена партии Истикляль. Партия Истикляль пострадала от негативной реакции за свою предполагаемую роль в заговоре, но теперь она поднялась в воздух. Правительство не сообщило, кто заказал убийство, и не освободило Мехди Бен Барку, которого обвиняли в том, что он изначально руководил заговором с Хаджаджем."
 MOR_ISR.1.d: "Правительство Марокко тайно передало предложение марокканской еврейской общине. Они заявили о готовности отказаться от политики сохранения еврейского населения в Марокко и предоставить ему свободу эмиграции в Израиль. Они заявили, что это будет возможно, если мы заплатим определенную цену за каждого марокканского еврея, который решит эмигрировать. Цена, конечно, высока, но, учитывая беспорядки и угрозы, с которыми сталкивается наш народ в Марокко, это может быть единственным способом обеспечить его свободу. Это возможность и явный разворот марокканской политики, и мы действительно должны рассмотреть эту возможность, несмотря на издержки."
 SPANISH_MOR.1.d: "Испания и Марокко вступили в переговоры о будущем Rif. Эти переговоры начались после того, как Марокко официально обрело независимость от Франции. Испанцы признали, что они столкнулись с перспективой длительного сопротивления, теперь открыто поддерживаемого соседним государством. Марокканцы требуют, чтобы Испания освободила территорию, которую она контролировала в течение многих лет, из уважения к чувствам людей в Рифе и Марокко. Испания должна решить, подпишет ли она соглашение о передаче территории или сохранит ее."
 SPANISH_MOR.3.d: "Народ Марокко радуется известию о том, что Испания восстановит наши земли и положит конец их протекторату. Соглашение демонстрирует независимость и силу нашего народа и правительства. Некоторые из наиболее ястребиных элементов выступали за вооруженную борьбу против Испании и ставили под сомнение наше решение провести переговоры. С этим соглашением мы оправданы и будем иметь больше власти и влияния над этими более жестокими группировками. Испанцы не двинулись бы с места на города Куэта и Меллила, но нам придется пока оставить их. Испания уже многое нам уступила. Это новая эра для свободного Марокко."
 SPANISH_MOR.5.d: "Напряженность нарастает по всей стране, когда приходят новости о провальных переговорах с Испанией. Многие марокканцы считают это серьезным оскорблением и считают, что Испания показала их полную неспособность понять новую реальность в мире. Те, кто давно выступает за вооруженное сопротивление, получат большую выгоду; уже есть сообщения о том, что молодые марокканцы присоединяются к ополченцам и требуют возможности сражаться с Испанией. Униженное правительство, обещавшее прорыв в переговорах, должно действовать быстро, чтобы обуздать эмоции народа и подготовить ответ. Очевидно, что Испания не заинтересована в справедливом разрешении кризиса."
 MOR_POL.1.d: "Совет престола, орган, учрежденный французами для консультирования султана, недавно был втянут в споры. Хотя официально совет является консультативным органом, многие националисты обвиняют совет в том, что он является инструментом французского резидента для навязывания своей воли султану. Эти обвинения, по-видимому, были подтверждены на недавнем заседании совета, когда откровенный националист Мохаммад Лагзауи был выслан по якобы настоянию французского резидента. Это вызвало бурю возмущения и привело к тому, что другие члены националистической партии также ушли, а султан встретился с ними сразу после этого на частной аудиенции. Это событие оживило националистов и усилило слухи о том, что султан симпатизирует их делу. Традиционные марокканские лоялисты, как говорят, возмущены действиями султана, обвиняя его в нарушении установленных протоколов взаимодействия с националистами."
 MOR_POL.2.d: "Националистический протест в Агмате был жестоко подавлен полицией, действовавшей по приказу местного Каида в этом районе. Султан, услышав об этих действиях, потребовал, чтобы куэйд предстал перед ним и объяснил свои действия. Тами Эль Глауи, видный паша, обвиненный в профранцузских симпатиях, должен был предстать перед Каидом. Однако паша не явился из-за того, что находился за границей, и вызов был проигнорирован. Хотя семья Эль-Глауои настаивает на том, что это неявка была простым недоразумением, султан, как говорят, очень расстроен этими событиями. Похоже, он знает, что смотрит на Тами Эль Глауи с гораздо большим подозрением и недоверием."
 MOR_POL.5.d: "Праздник Мулуда-это ежегодное мероприятие, на которое приходят все паши и кади, чтобы подтвердить свою верность султану. Паши и кади дают эти клятвы на личной аудиенции у султана, в то время как их племена публично демонстрируют свою лояльность. Это крупное событие, которое публично укрепляет традиционную базу поддержки монархии. Недавний подъем национализма и антиколониализма подвергает эти отношения испытанию. Многие из этих пашей, как полагают, были профранцузскими и получили большую выгоду от французского колониального режима. Церемония в этом году считается очень важной как для пашей, так и для султана."
 Throne_Crisis.1.d: "Праздник Мулуда продолжался по традиции, но во время частной аудиенции между султаном и его пашой Тами Эль Глауи произошел крупный инцидент. Пожилой, но могущественный паша начал с критики националистов за разжигание беспорядков в стране. Султан заявил, что националисты являются лояльными марокканскими подданными. Это вызвало гневную лекцию старого паши, которая лишила султана дара речи. Вскоре Тальми покинул ошеломленного султана. Затем султан сообщил своему великому визирю, чтобы тот запретил Тальми возвращаться ко двору из-за его замечаний и вопиющего неуважения. Позже два кади, сыновья Тальми, получили аудиенцию у султана. Они стремились уменьшить напряженность, утверждая, что их отец просто увещевал султана, как отец своего сына. Однако это только еще больше разозлило султана и стало еще одним оскорблением."
 Throne_Crisis.2.d: "Традиционный праздник Мулуда был омрачен спорами после решения султана изгнать Тами Эль Глауи и его семью из двора. Решение было принято после частных аудиенций между султаном, Тами, а затем и его сыновьями. Султан почувствовал себя оскорбленным агрессивной тирадой Тами в адрес марокканских националистов. Когда Тами сообщили о его изгнании, он немедленно уехал со своей семьей и племенем. Они ушли еще до окончания праздника Мулуда, который заканчивается публичным заявлением племен о верности. Султан и его дворец рассматривают этот внезапный уход как доказательство того, что Тальми совершает открытый мятеж против королевской семьи."
 MOR_POL.11.d: "После переговоров в Экс-ле-Бене был создан Регентский совет для Марокко. Этот орган будет играть важную роль в оказании помощи в управлении страной и проведении переговоров о независимости, пока Мохаммед V остается в изгнании. Националисты долго призывали к возвращению изгнанного султана Мухаммеда V, в то время как Франция отказывалась вернуть его. Регентский совет-это компромисс, позволяющий обеим сторонам сохранить свою позицию, но двигаться вперед в переговорах о независимости. Члены совета должны быть утверждены изгнанным султаном, что дает ему возможность удерживать своих сторонников на переговорах."
 FRANCAFRIQUE_MOR.1.d: "Султан Арафа, занявший трон после изгнания своего двоюродного брата султана Мухаммеда V, призвал Францию вмешаться и спасти его трон. После прихода к власти Арафа столкнулся с жесткой оппозицией со стороны националистов, а также некоторых традиционных пашей, которые считают его назначение незаконным и частью французского заговора. Граждане Марокко называют Арафу французским султаном. Французское правительство объявило, что поддержит султана Арафу из-за его долга перед марокканским народом и установит закон и порядок во всем протекторате. Вооруженные ополченцы и лоялисты Мухаммеда V уже организовывают и захватывают части страны для изгнанного султана. Многие наблюдатели считают, что французская интервенция сделает гражданскую войну в Марокко неизбежной."
 MOR_CONSPIRACY.1.d: "Французский резидент в Марокко, который контролирует монархию и продвигает французские интересы, тесно вовлечен в заговор с целью найти альтернативного султана для Марокко. Нынешний правитель, султан Мухаммед V, все чаще связывает себя с националистами и продолжает делать заявления, осуждающие иностранное влияние в Марокко, хотя и не называя напрямую Францию или Испанию. Еще большее беспокойство вызывают слухи о том, что султан направляет свое правительство открыто помогать и даже обучать антиколониальных борцов по всей стране. Резидент и другие французские агенты определили, что двоюродный брат султана, Мохаммед бен Арафа, готов занять трон, если он станет вакантным. Он также пообещал поддержать французские интересы и подавить националистов. Французские агенты встречаются с видными пашами, чтобы оценить их поддержку для возведения на трон нового султана. Паши традиционно были близкими сторонниками французов."
 Arafa.1.d: "Мохаммад бен Арафа, недавно провозглашенный султан Марокко, укрепил свои претензии на трон после церемонии, на которой ведущие паши и дворяне Марокко объявили его имамом. Это символически показывает, что Арафа сохранил традиционную основу марокканской королевской власти. Однако некоторые паши отказались присутствовать на церемонии, а многие марокканцы, как говорят, разгневаны изгнанием бывшего султана Мохаммеда V. Арабские националисты, в частности, возглавляют общественное негодование по поводу нового султана, которого называют французским султаном. Сможет ли Арафа успокоить растущее возмущение, неизвестно. Многие наблюдатели отмечают, что современное марокканское общество может оказаться не таким податливым и послушным традиционной элите, как в прошлом."
 MOR_EXILE.1.d: "Во время традиционного празднования Курбан-Байрама французские власти столкнулись с Мухаммедом V и арестовали султана Марокко. Султана обвиняют в активном сговоре с националистами и использовании государственных учреждений для обеспечения оружием, поставками и обучением антиколониальных боевиков в Марокко. Французы быстро увезли султана и его семью на Корсику, и ходят слухи, что Мухаммед Бен Арафа, двоюродный брат султана, займет его место. Ожидается, что реакция марокканцев, особенно националистов, будет немедленной; однако французы считают, что новый султан быстро установит легитимность и сплотит традиционных пашей, чтобы укрепить свой контроль над страной."
 SPR_MOR_ALT.1.d: "Султан Арафа укрепил свою легитимность среди марокканского народа и пользуется благосклонностью Франции после своей недавней победы в гражданской войне. При этой поддержке он недавно поручил своему правительству официально потребовать возвращения колониальной территории, находящейся в настоящее время под контролем Испании. Это может быть лучшей возможностью для того, чтобы выдвинуть свои претензии внутри страны. Успешные переговоры с Испанией укрепили бы его имидж в народе и подорвали бы пропаганду оппозиции о том, что султан Арафа-колониальная марионетка. Правительство уверено, что Испания согласится."
 SPR_MOR_ALT.2.d: "Марокканский султан Арафра направил делегацию высокого уровня с просьбой передать наши территориальные владения в Марокко новому правительству. Это фактически положило бы конец и нашему протекторату над Марокко. Если мы согласимся на эту просьбу, то улучшим свой имидж в арабском мире и других постколониальных государствах. Это также улучшило бы отношения с Францией, которая поддерживает режим султана Арафы. Что еще более важно, содержание этих земель и без того дорого обходится, и любое будущее вооруженное восстание марокканцев нанесет ущерб нашему международному имиджу и экономике. Однако эти земли были испанскими на протяжении десятилетий и оказали решающую поддержку во время Гражданской войны. Конечно, на этих территориях есть много националистов, которые, без сомнения, подумают о вооруженном сопротивлении, если мы откажемся, но у нас также есть лоялисты, которые придут поддержать испанское дело. Решение должно быть принято."
 SPR_MOR_ALT.3.d: "Испанское правительство негативно отреагировало на законную просьбу нашего правительства о возвращении оккупированных марокканских земель. Они продолжают считать наш народ колонизированным, и их отказ вызвал протесты по всей стране. Султан Арафа, как говорят, был ошеломлен этим решением, он чувствовал, что испанцы не будут рисковать колониальной войной или даже возможной французской интервенцией, отказываясь. В обращении к нации султан Арафа осудил действия испанцев и призвал марокканский народ мобилизоваться для будущего освобождения всех марокканцев. Вооруженные группы антиколониальных активистов уже готовятся к интервенции, и султан приказал своим военным обеспечить их обучением и вооружением, поскольку продолжение испанского империализма недопустимо."
 SPR_MOR_ALT.4.d: "Испанское правительство положительно отреагировало на нашу законную просьбу о возвращении оккупированных марокканских земель и людей. Мы согласились с предложенным ими графиком вывода войск в ближайшие недели, чтобы обеспечить не просто плавную передачу власти, но и достойный вывод испанского государства. Султан Арафа объявил радостную весть народу, и многие вышли на улицы, чтобы выразить свою радость по поводу объединения своей страны. Успешное освобождение испанского оккупированного Марокко дает большую легитимность султану Арафе и его политическим противникам, которые беспокоятся, смогут ли они когда-нибудь убрать человека, которого они считают орудием французского империализма."
 MOR_CIVIL_WAR.20.d: "Французы и их марокканские союзники изгнали султана Мухаммеда V и установили его двоюродного брата Арафу. Теперь они призывают нас признать султана Арафу новым правителем. Французы просчитались, поскольку их вопиющее вмешательство вызвало массовые беспорядки по всему Марокко, и гражданская война кажется неизбежной, поскольку марокканские республиканцы формируют вооруженные банды против Арафы и французов. У нас есть несколько вариантов, как справиться с ситуацией. В настоящее время мы можем отказаться признать султана Арафу. Поступая таким образом, мы рисковали бы только нападениями и восстанием на нашей собственной марокканской территории. Это также позволило бы нам увидеть, как разыгрывается гражданская война, не привязываясь к одному лагерю. Другой вариант-открыто осудить легитимность Арафы и предоставить признание вместе с оружием марокканским республиканцам, которые выступают против него. Это улучшило бы наш имидж среди марокканцев и обеспечило бы нам доминирующее европейское влияние в Марокко."
 MOR_POL.25.d: "Марокко погрузилось в политические беспорядки после отставки премьер-министра Мбарека Беккая. Первый премьер-министр был вынужден уйти в отставку националистической партией Истикляль после того, как он обратился за королевской поддержкой, чтобы узаконить коалицию подавленных, промонархических партий, которые сформировали партию Народного движения. Эти действия премьер-министра оттолкнули лидеров про-сопротивления, националистов, которые обвинили Беккея в том, что он слишком медленно продвигается вперед, оказывая давление на вывод всех французских сил из страны. Ожидается, что пост премьера займет Ахмед Балафрей, генеральный секретарь Истикляля, но наблюдатели опасаются, что его нейтральная позиция может только усугубить политическую напряженность. Уже есть сообщения о том, что члены партии Истикляль, выступающие за сопротивление, формируют оппозиционную фракцию внутри партии. Там, где раньше группы сопротивления могли обвинять Беккай, теперь, похоже, Истикляль будет открыт для публичного гнева националистических марокканских активистов."
 MOR_POL.10.d: "Марокканское правительство объявило о легализации политической партии, известной как Национальный союз народных сил (NUPF). НУПФ возник как социалистическое ответвление партии Истикляль и долгое время считался угрозой правительству. Несмотря на агрессивные репрессии со стороны МВД, НУПФ продолжал расти и процветать. Легализация группы, как мы надеемся, подтолкнет ее в сторону мейнстрима и от более радикальных позиций, таких как вооруженное сопротивление. Сам НУПФ имеет различные элементы, и правительство считает, что его действия укрепят умеренные части партии. Средства массовой информации восхваляют правительство за его зрелость в борьбе с политической оппозицией."
 SPANISH_MOR.2.d: "Испанское и марокканское государства объявили о соглашении о ретроцессии Риф в Марокко. Испания также официально объявила о прекращении своего протектората над Марокко. Это соглашение является серьезным стимулом для марокканского правительства, которое вернуло себе территорию, находившуюся под испанской оккупацией в течение десятилетий, и приобрело большую легитимность как внутри страны, так и на международном уровне. Наблюдатели отмечают, что Испания, скорее всего, не хотела провоцировать колониальную войну в регионе и хотела поддерживать сердечные связи с Марокко, утверждающим свою независимость. Испания сохраняет контроль над двумя городами Куэта и Меллила, отмечая, что они являются неотъемлемой частью Испании и были частью нации на протяжении веков. Марокканское правительство также претендует на эти города, но согласилось пока оставить этот вопрос."
 SPANISH_MOR.4.d: "Переговоры между Испанией и Марокко сорвались без какого-либо соглашения о продолжающейся оккупации Рифа Испанией. Кроме того, Испания также не отказалась от своего протектората над Марокко. Неспособность достичь соглашения является серьезным ударом по марокканскому правительству и более умеренным антиколониальным активистам. Они утверждали, что вооруженная борьба не может обеспечить успеха, но переговоры необходимы для окончательного прорыва. Испанское правительство настаивает на том, что оно не пойдет на компромисс с правами своих граждан или своим историческим положением в регионе только для того, чтобы сделать Марокко счастливым. Марокканское правительство до сих пор оставалось в основном спокойным, лишь в кратком комментарии выражая сожаление по поводу провалившихся усилий."
 MOR_POL.3.d: "Марокканское правительство призвало обширную иностранную помощь для поддержки своего народа. Правительство отмечает, что годы иностранной эксплуатации и недавние конфликты оказали огромное давление на марокканское государство и его способность поддерживать народ. Все страны просят оказать любую возможную помощь Марокко в достижении не только независимости для всего его народа, но и стабильного роста для долгосрочного процветания. Несколько посольств опубликовали заявления, в которых говорилось, что они будут выступать в защиту марокканского народа и тех уникальных обстоятельств, с которыми он сталкивается."
 SLA.1.d: "Марокканский султан недавно приказал силам Освободительной армии, борющимся с испанским колониализмом, создать Сахарскую освободительную армию. Группа партизан официально не связана с марокканской армией, но многие наблюдатели считают, что основными бойцами являются войска марокканской армии. Этих людей поддерживают местные марокканские освободители и другие добровольцы, которые пересекли границу на оккупированной испанией территории. Создание Освободительной армии Сахары свидетельствует о серьезной эскалации и возобновлении внимания со стороны марокканского правительства и антиколониальных активистов к расширению вооруженной борьбы в Испании."
 IFNI_WAR_FRANCE.1.d: "Сообщения из Западной Сахары указывают на то, что марокканские войска продвигаются с контролируемых испанией территорий в Мавританию. Это говорит о серьезном ухудшении испанских и французских позиций в этом районе. Марокканское правительство опубликовало заявление, в котором говорится, что освобождение и объединение Магриба близки, и ни одна иностранная держава не должна стремиться помешать этому объединению. Ожидается, что в ближайшее время состоится чрезвычайная встреча на высоком уровне между французскими и испанскими лидерами, поскольку оба они пока молчат о том, насколько плоха для них ситуация в регионе в настоящее время."
 FRANCAFRIQUE_MOR.10.d: "В Марокко разразилась гражданская война между сторонниками поддерживаемого Францией султана Арафы и марокканскими республиканцами, которые обвиняют французов в том, что они посадили Арафу на трон. Несколько других группировок также участвуют в боевых действиях, включая тех, кто поддерживает свергнутого султана Мухаммеда V, и влиятельных сельских марокканских лидеров, которые выступают против возросшего политического влияния городских марокканцев. Те, кто поддерживает республиканское дело, считают, что монархия явно является инструментом иностранного империализма, и Марокко может быть свободным только без монархии. Режим султана Арафы может опираться на французскую поддержку и лояльность тех монархистов, которые не поддерживают дело восстановления султана Мухаммеда V."
 MOR_CIVIL_WAR.10.d: "Народ Марокко был потрясен известием о том, что Мохаммед V был убит. Подробности произошедшего в настоящее время неизвестны, но в городах по всему Марокко тысячи людей вышли на улицы, чтобы оплакать погибших. Будучи султаном, Мохаммед V в последние годы занял гораздо более твердую позицию по вопросу о независимости Марокко. Он открыто ухаживал за националистами и наделял полномочиями городских активистов, вызывая гнев традиционных сельских элит и Франции. Уже сейчас многие в стране обвиняют в убийстве Францию или французских доверенных лиц. По мере распространения этих слухов становится маловероятным, что смерть Мохаммеда V облегчит жизнь поддерживаемому францией султану Арафе."
 MOR_CIVIL_WAR.21.d: "Городские марокканцы в последние годы превратились в крупную политическую силу в современном Марокко. Распространение антиколониальной риторики и арабского национализма вдохновило тысячи молодых марокканцев, особенно тех, кто учился в школах. Это, в сочетании с их жизненно важной экономической ролью, делает их более мощной силой, чем традиционные сельские марокканские элиты. Вопиющее возведение султана Арафы на трон Францией оказалось слишком большим шагом. Теперь тысячи городских марокканцев не просто протестуют против марионеточного монарха, но и подняли восстания по всем городам. Они утверждают, что вооруженные восстания будут продолжаться до тех пор, пока коррумпированная монархия и Франция не будут удалены из Марокко. Многих марокканцев привлекает четкий антиколониальный посыл республиканцев и их обещание больших политических свобод после победы."
 MOR_CIVIL_WAR.22.d: "Гражданская война в Марокко приняла драматический оборот после сообщений о том, что Испания вмешается, оказав широкую поддержку республиканским силам в Марокко. Испанцы утверждают, что их действия направлены на поддержку народа Марокко и прекращение тайной и репрессивной тактики, организованной Францией. Французы, как говорят, в ярости от этой новости, в то время как многие наблюдатели отмечают, что Испания действует таким образом, чтобы обеспечить прочные отношения с марокканским правительством, если республиканцы победят. Что еще более важно, испанская интервенция укрепит отношения Испании с другими арабскими государствами и подавит любые потенциальные марокканские волнения на ее собственной территории. Республиканское руководство выпустило заявление, в котором поблагодарило Испанию за ее вклад в марокканскую свободу."
 TANGIERS_PROTOCOL.1.d: "Марокко и Испания недавно подписали Танжерский протокол об урегулировании статуса города. Хотя Танжер номинально находился под властью марокканской монархии, он провел несколько десятилетий как международный город под защитой Испании. Это новое соглашение формально восстанавливает полный суверенитет Танжера над Марокко. Известие о соглашении заставило многих марокканцев праздновать возвращение города, который долгое время считался оккупированным, поскольку они ранее осуждали то, как город стал партийным местом для европейских элит, которые использовали марокканские ресурсы, но отдавали свои деньги иностранным оккупантам города. Марокко надеется, что он не только восстановит свой суверенитет, но и обеспечит, чтобы прибыль, получаемая городом, могла дойти до народа Марокко."
 TANGIERS_PROTOCOL.2.d: "Испания объявила, что официально аннексирует Танжер после референдума, проведенного для определения его окончательного статуса. Это решение было осуждено Марокко и другими международными государствами. Испания заявила, что референдум представляет народ Танжера, выражающий свое право на самоопределение. Марокканское правительство обвинило Испанию в манипулировании голосованием, исключив многих марокканцев при подсчете иностранных избирателей и начав кампанию, которая ошибочно указала, что марокканское правление приведет к экономическому краху города. Испания отмахнулась от этой критики и планирует провести большой фестиваль в честь аннексии и объединения Танжера с Испанией. По слухам, марокканское правительство готовит альтернативные методы, включая вооруженное сопротивление."
 MOR_UN.1.d: "Марокко было официально принято в Организацию Объединенных Наций после голосования. После формального обретения суверенитета первым решением правительства стало обращение за членством в Организации Объединенных Наций. Марокко было принято подавляющим большинством, и многие страны, особенно из арабского мира, тепло приветствовали Марокко. Учитывая длительную борьбу Марокко за достижение независимости и его взаимодействие с арабским миром и Северной Африкой, ожидается, что новый член будет активно поддерживать антиколониальные и проарабские голоса в Генеральной Ассамблее."
 MOR_Coronation.2.d: "Султан Мухаммед V вернулся на трон после своего краткого изгнания и вновь короновал себя как султан. Это знаменует собой конец эпической борьбы за султана, который пережил месяцы изгнания за границу после того, как французы свергли его в пользу своего кузена. Однако народные волнения и волнения заставили французов отступить, и их марионеточный правитель вскоре вернул трон Мухаммеду V. Султан поблагодарил народ за поддержку и упорство в трудные времена. Он обещал свою преданность марокканской нации и народу, а не какому-либо иностранному правителю."
 MOR_EXILE.2.d: "Французы недавно вынудили Мохаммеда V отказаться от престола, а затем назначили его двоюродного брата Арафу новым султаном Марокко. Опасаясь, что марокканцы сплотятся вокруг Мохаммеда V, французы быстро приказали бывшему султану забрать свою семью и покинуть страну. Через несколько часов французы отправили бывшего султана и его семью в изгнание на Корсику. Надежды на то, что молниеносная смена руководства и изгнание заглушат любые потенциальные беспорядки, оказались ошибочными, поскольку городские марокканцы почти сразу же начали агитировать против французского вмешательства, когда новости распространились на следующее утро. Мухаммед V сумел выпустить свое собственное послание народу, утверждая, что он не ушел в отставку, но был насильственно удален французами."
 MOR_EXILE.3.d: "В частной церемонии, чтобы избежать публичных вспышек, султан Арафа был официально коронован как новый правитель Марокко. Двоюродный брат бывшего султана Мохаммеда V, Арафа занял трон после скандального смещения и изгнания Мохаммеда V французскими официальными лицами. Хотя некоторые крупные вожди сельских племен отказались присутствовать на коронации, новый монарх был утвержден улемами. Коронация широко осуждается по всему Марокко, особенно в городах, где Арафа часто презрительно называют французским султаном. Сможет ли новый султан удержаться на троне, еще предстоит выяснить."
 second_rif_revolt.1.d: "Марокканцы в Рифе подняли восстание против продолжающегося правительственного произвола. Первая война Риф произошла в 1920-х годах и была подавлена испанцами только после значительных людских и финансовых затрат. Повстанцев поддерживают марокканцы по всей стране, которые вливаются в монархическую борьбу. Правительство Марокко обвиняет панарабистов форига в поддержке повстанцев оружием, войсками и обучением. Панарабские лидеры по всему региону тем временем называют восстание естественной реакцией народа, уставшего от иностранной оккупации и вмешательства."
 Ifni_War.1.d: "За последние несколько месяцев испанские власти в испанской Западной Африке столкнулись с массовыми марокканскими протестами и волной убийств происпанских лидеров. С ростом волнений в Марокко Испания приказала мобилизовать свои силы, в результате чего Марокко мобилизовало свои собственные войска. Испанские войска вскоре обнаружили, что их коммуникации отрезаны и находятся под атакой Марокканской освободительной армии, поддерживаемой марокканскими войсками в этом районе. Испанские войска находятся в обороне, и в Мадриде опасаются, что Сиди Ифни находится под угрозой захвата марокканскими войсками арсеналов вокруг города. До сих пор испанские линии держатся твердо, но ситуация переросла в перестрелку между Испанией и Освободительной армией, поддерживаемой марокканскими войсками в регионе."
 Ifni_War.2.d: "После интенсивных боев Испания и Марокко недавно подписали соглашение, положившее конец войне Ifni. Испания согласилась уступить регион Тарфая, сохранив контроль над Испанской Сахарой и Сиди-Ифни. Марокканское правительство изображает это соглашение как свидетельство своей военной победы над Испанией. Однако аналитики отмечают, что неспособность Марокко приобрести все территории свидетельствует о том, что им не удалось добиться военной победы. Хотя Испания успешно удержала большую часть своей территории и успешно подавила марокканское нападение, затраты были тяжелыми, и многие в Мадриде сомневаются в затратах, необходимых для сохранения колониальных территорий."
 Ifni_War.3.d: "Попытка марокканцев захватить испанские владения в Западной Сахаре через свою Освободительную армию привела к катастрофическому поражению. Испанские войска быстро отбили первоначальное наступление марокканцев на Сиди-Ифни. Попытки марокканцев вернуть себе инициативу или даже укрепить стратегические территории провалились из-за эффективных испанских операций. Марокканцы не могли справиться с дисциплиной, тяжелым вооружением или тактикой испанских войск. Марокканское правительство пыталось представить ситуацию как победу, однако провал каких-либо территориальных завоеваний и слухи об отступлении войск сделали реальность ясной. В Мадриде испанское правительство поздравило свои войска и объявило серию парадов и медалей в ознаменование победы."
 Ifni_War.4.d: "Испанское правительство объявило о полном выводе своих войск из Западной Сахары. Это свидетельствует о полном военном поражении в их конфликте с поддерживаемой марокканцами Освободительной армией. Марокканские войска смогли прорвать испанские линии обороны, изолировать испанские гарнизоны по всему региону и успешно захватить ключевые позиции и города. Марокканское правительство объявило об освобождении Западной Сахары и опубликовало фотографии марокканских войск, празднующих в освобожденных городах. Тысячи людей вышли на улицы, чтобы отпраздновать эту знаменательную победу над оккупирующей колониальной державой. Марокканское правительство получает поздравительные послания от других антиколониальных государств. Доверие марокканцев сейчас находится на небывало высоком уровне."
 REVOLUTION_KING.5.d: "С самого начала антиколониальной борьбы в Марокко монархия стояла на стороне народа. Король Мохаммед V воплощает желания своего народа. Своими действиями, часто неуловимыми, он демонстрирует свою поддержку и симпатию националистам по всей стране. Он делает это вопреки проколониальным элитам и колониальным державам, которые ранее были главными сторонниками трона. Однако эти враги народа в последнее время стремились свергнуть царя. Пока король сидит в изгнании, народ Марокко вышел на улицы, объявил забастовку и требует возвращения короля. Рвение к независимости нарастает."
 REVOLUTION_KING.6.d: "В знаковом соглашении Мохаммед V и французское правительство подписали декларацию, закладывающую основу независимости Марокко. В ходе переговоров, проходивших в Ла-Целль-Сен-Клу, Франция допустит восстановление на троне Мохаммеда V. Взамен король согласовал дорожную карту к независимости, основанную на франко-марокканской взаимозависимости. Обе стороны рассматривают соглашение как успешный компромисс и мирное разрешение нынешних беспорядков. Хотя среди некоторых националистов есть опасения по поводу постепенного пути к независимости, многие готовы доверять Мохаммеду V."
 REVOLUTION_KING.2.d: "Бывший монарх Марокко Мухаммед V вышел из переговоров с французским правительством в Ла-Целль-Сен-Клу. Похоже, ни одна из сторон не смогла добиться компромисса. Хотя обе стороны первоначально договорились о восстановлении Мохаммеда V на троне, переговоры о независимости быстро развалились. Французы настаивали на дорожной карте к независимости, основанной на франко-марокканской взаимозависимости. Хотя Франция обещала, что это не продлится долго и закончится полной независимостью, марокканцы считали, что это условие было уловкой для продолжения французского колониализма. Французы, скорее всего, будут крайне разочарованы провалом переговоров. В Марокко поступают сообщения о том, что лидеры националистической партии Истикляль призывают к вооруженному восстанию, чтобы окончательно избавить страну от колониальной оккупации."
 REVOLUTION_KING.0.d: "Ситуация в Марокко ухудшается для французов. Их недавняя попытка свергнуть выступающего за независимость короля Мухаммеда V и заменить его профранцузским кузеном дала обратный результат. Марокканский народ отвергает нового короля как марионетку. По всей стране проходят массовые протесты, забастовки и насилие. Французское правительство обеспокоено растущими расходами. Что еще более важно, если насилие будет продолжаться, есть опасения, что более радикальные группировки получат влияние среди марокканцев. Планируется, что министр иностранных дел Франции встретится с Мохаммедом V в Ла-Целль-Сен-Клу."
 Arafa.0.d: "Недавно взошедший на трон король Марокко Арафа едва уцелел после покушения, совершенного Аллалем бен Абдаллой. Король, ехавший верхом с процессией, стал мишенью, когда убийца въехал на своей машине в лошадь, везущую короля. Затем убийца выскочил, чтобы заколоть короля Арафу, но на него набросился французский полицейский. Офицер, раненный ножом во время схватки, повалил убийцу на землю, прежде чем тот был застрелен. Хотя король упал с лошади, он получил незначительные травмы и покинул место происшествия под усиленной охраной. Король Арафа занял трон после того, как его двоюродный брат, король Мохаммед V, был вынужден отправиться в изгнание французами. Многие марокканцы считают короля Арафу французской марионеткой, и этот последний инцидент говорит о том, что марокканский гнев против французского колониализма остается высоким."
 second_rif_revolt.0.d: "Политические лидеры Риф направили список из 18 требований марокканскому правительству. Народ Рифа давно жаловался на развитие и политическое пренебрежение к региону. И это несмотря на заветную историю антиколониальной активности и сопротивления. Марокканское правительство, скорее всего, не будет удовлетворено этим общественным требованием, поскольку оно может создать опасный прецедент и вызвать гнев некоторых слоев населения. Однако неспособность дать положительный ответ может вызвать бурную реакцию со стороны людей, сведущих в партизанской войне."