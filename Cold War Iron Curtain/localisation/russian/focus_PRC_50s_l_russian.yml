 PRC_Lessons_from_the_Liberation_War_desc: "Мы боролись долго и упорно против империалистических оккупантов, Гоминьдана, ложного Императора, японцев. За эти войны, за эти освободительные войны мы многому научились. После завершения Народно-освободительной войны в Китае мы должны извлечь уроки, которые мы извлекли, и применить их к Народно-освободительной армии.."
