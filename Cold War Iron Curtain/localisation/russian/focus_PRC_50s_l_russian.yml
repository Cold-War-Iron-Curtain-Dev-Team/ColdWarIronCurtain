 prc_foreign_affairs: "Министерство иностранных дел"
 prc_foreign_affairs_desc: "Китай больше не может полностью сосредоточиться на себе. В 1949 году Китайская Народная Республика создала министерство иностранных дел для решения всех внешних проблем. Нынешний премьер Чжоу Эньлай любезно занял пост министра иностранных дел и начал процесс установления официальных дипломатических связей со странами мира!"
