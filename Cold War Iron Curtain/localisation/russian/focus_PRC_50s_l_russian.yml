 PRC_Societal_Reforms_desc: "Если наша революция действительно должна быть успешной, чем все наше общество, наш образ жизни должен быть реформирован. При председателе Мао и Коммунистической партии, чем мы должны изменить всю нашу нацию."
 PRC_End_the_Feudal_Family_desc: "Чтобы осуществить революцию, мы должны положить конец патриархальному обществу, которое у нас есть. Разрушив феодальную семью, мы можем начать сосредотачиваться на сообществе, подталкивая наших людей изменить свое отношение к своим семьям, сообществам и доверяя своей нации."
