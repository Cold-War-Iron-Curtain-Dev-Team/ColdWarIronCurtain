 founding_prc: "Церемония основания"
 founding_prc_desc: "Изображенная на всемирно известной масляной картине «Кайгуо Дадин», Мао Цзэдун и другие члены ЦК открывают Китайскую Народную Республику на площади Тяньаньмэнь в Пекине. КНР теперь официально является истинным преемником династии Цин! Мы больше не будем забиты на международном уровне или лишены нашей власти!"
 kmt_truce: "Перемирие с Гоминьданом"
 one_china: "Политика одного Китая"
 one_china_desc: "Гоминдан может претендовать на суверенитет, но они всего лишь мятежная провинция. Существует только один настоящий Китай, и остальной мир должен признать нас!"
