 prc_in_un: "Признание ООН"
 prc_in_un_desc: "Организация Объединенных Наций продолжает признавать Гоминдан правящей партией в Китае. Теперь, когда Гоминдан остался в прошлом, мы должны обратиться к постоянным членам Совета Безопасности с просьбой предоставить нам наше законное место в качестве члена и держателя китайского права вето."
 sim_chinese: "Упрощенный китайский"
 sim_chinese_desc: "Китайский народ не будет сидеть сложа руки, пока остальной мир играет на мировой арене. Китайскую систему письма всегда считали одной из самых сложных систем для изучения, но это создает серьезное препятствие для интернационализации маоистской идеологии. Под руководством председателя Мао мы создали упрощенную версию каждого символа в языке, чтобы повысить грамотность и помочь иностранцам выучить наш замечательный язык."
 one_child: "Политика одного ребенка"
 one_child_desc: "Население нации растет слишком быстро. Нарастающая проблема уже начинает проявляться, поэтому Национальный народный конгресс принял решение о введении политики «одного ребенка». Это ограничит пары только одним ребенком, в противном случае они будут облагаться большими налогами. Это строгая политика, но необходимая для обеспечения здоровья и успеха страны."
 prc_us_relations: "Восстановить отношения с США"
 prc_us_relations_desc: "Быть врагом с США не приносит ничего, кроме ограничений. Улучшение отношений с Америкой даст нам больший доступ к ресурсам, нефти и поможет развеять холодную войну."
 prc_uk_relations: "Подружиться с Великобританией"
 prc_uk_relations_desc: "Несмотря на их исторические обиды на нас, Великобритания когда-то была лишь оболочкой. Поддержание холодных отношений с ними - ребячество, и мы должны вкладывать больше времени и ресурсов в дружбу с британцами. Возможно, мы сможем снова отправить им хороший чай ..."
 prc_jap_relation: "Подружиться с Японией"
 prc_jap_relation_desc: "После второй мировой войны у нас была сильная вражда с японцами. Но после долгих размышлений мы обнаруживаем, что зверства, совершенные во время войны, были по вине империалистического правительства, а не самих людей. Таким образом, мы возобновим дипломатический диалог с ними. Возможно, дружба с ними увеличит популярность коммунизма внутри нашего старого врага."
 prc_uk_hong_kong: "Китайско-британская декларация"
 prc_uk_hong_kong_desc: "Теперь, когда мы возобновили политический диалог с англичанами, мы чувствуем себя комфортно, требуя возвращения Гонконга дипломатическим путем. Зачем рисковать разрушением Гонконга в войне, когда мы можем мирно получить ключи от англичан?"
