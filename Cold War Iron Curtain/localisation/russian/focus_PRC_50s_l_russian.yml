 ping_pong_diplo: "Пинг-понговая дипломатия"
 ping_pong_diplo_desc: "В Китае есть одни из величайших игроков в пинг-понг в мире, но без кого-то, с кем мы можем играть, мы не можем показать свое доминирование. Таким образом, мы начнем организовывать соревнования с западными странами, в частности с США. Надеюсь, это поможет оттащить наши отношения с остальным миром и продемонстрировать наше спортивное превосходство."
