 PRC_The_Peoples_Liberation_Army_desc: "Основанная 1 августа 1927 года Народно-освободительная армия, или Красная Армия, была силой, предназначенной для борьбы с колониализмом, империализмом и капитализмом. Несмотря на то, что она столкнулась со многими трудностями, Народная армия победила многих своих врагов."
 PRC_Transforming_our_Army_desc: "Наша армия была сосредоточена на непрямой войне, используя тактику, которая хорошо нам помогает, когда мы сталкиваемся с превосходящим и технологически развитым противником. Те, кто будут сражаться с нами, не могут противостоять нашей объединенной мощи. Таким образом, Народно-освободительная армия должна быть преобразована в боевую силу, способную противостоять всем угрозам, как внутренним, так и внешним."
 PRC_Artillery_Developments_desc: "Артиллерия была ключом в нашей борьбе против Имперской Японии и ложной Китайской Республики. Мы должны продолжать развивать наши артиллерийские технологии, чтобы гарантировать, что мы можем обрушиться на всех тех, кто будет угрожать Народной Республике."
 PRC_Establish_the_Work_Soldier_Militia_desc: "Наша способность быстро обучать солдат будет иметь ключевое значение в борьбе с капитализмом. Создавая военизированные группы ополченцев, мы обеспечим армию будущими солдатами."
 PRC_Establish_Air_Defense_Troops_desc: "Новая столица в Пекине нуждается в защите. Чтобы обеспечить безопасность Пекина и государства, мы должны создать специализированные войска, предназначенные для защиты воздушного пространства вокруг Пекина."
 PRC_Development_of_Armored_Troops_desc: "Это уже не время чистой пехоты и кавалерии, это не время поднятия знамен. Мы находимся в новом веке, веке танков, самолетов, ракет и оружия, которые могут уничтожить человечество. Чтобы наши солдаты могли удовлетворить потребности Китая, мы должны разработать наши бронетранспортеры и транспортные средства."
 PRC_Men_Over_Material_desc: "Наша самая большая сила - это наш народ. Мы должны дать понять населению, что служба в вооруженных силах будет способствовать революции и обеспечит безопасность нашего драгоценного Китая."
 PRC_Establish_the_Public_Security_Forces_desc: "Порядок должен поддерживаться, ведь без порядка наше общество рухнет. Мы видели это под маньчжурскими «королями» и мы видели это под ложной республикой. Мы должны убедиться, что наше правило кодифицировано, и с теми, кто не подчиняется нашему правилу, будут приняты меры."
 PRC_Indoctrinate_the_Peasents_desc: "Крестьянство было сельским авангардом революции, когда мы освободили их от диктатуры помещиков. Мы покажем им, как их вера в партию приведет к их собственному процветанию."
 PRC_Human_Wave_Tactics_desc: "Идея массового штурма важна в теперешнем моменте. Наш самый большой актив - это наш народ, как одной из самых густонаселенных наций на этой Земле. Нам нужно обеспечить, чтобы у нас были сильные и большие вооруженные силы."
 PRC_Establish_the_Peoples_Liberation_Navy_desc: "Наша нация никогда не была морской державой, но это должно измениться. Учитывая угрозы, с которыми мы столкнемся со стороны империалистов, колонизаторов и капиталистов, мы должны создать Народный флот, чтобы гарантировать, что мы сможем противостоять угрозам в Тихом океане и за его пределами."
 PRC_Oppose_the_Imperialist_Oppression_desc: "Чжэцзян будет идеальным местом, чтобы начать расширять верфи. Наряду с увеличением нашего военно-морского потенциала это поможет оживить разрушенный войной регион и создать тысячи новых рабочих мест для нашего народа."
 PRC_Dalian_Naval_Academy_desc: "Основанная как первая военно-морская академия Китайской народно-освободительной армии, военно-морская академия в Даляне станет главным местом обучения наших моряков в нашей борьбе против реакционеров и империалистического запада."
 PRC_Soviet_Naval_Advisors_desc: "В Советском Союзе при Сталине наблюдалось быстрое увеличение их военно-морского производства. Пригласив советских советников, мы можем взять то, чему они научились во время Второй мировой войны, и применить это для собственных нужд."
 PRC_Old_KMT_Boats_desc: "Мы обнаружили большой запас кораблей Гоминьдана, заброшенных после того, как ложная республика отступила на Тайвань. Мы с радостью переназначим для собственных нужд."
 PRC_Fortify_the_Coasts_desc: "На данный момент мы в меньшинстве и превзойдены в открытом море. Поскольку мы начинаем развивать наш военно-морской потенциал, мы должны тем временем укрепить нашу береговую линию, гарантируя, что вторжения, которыми Китай подвергся японцам во время Второй китайско-японской войны, больше никогда не произойдут."
 PRC_Naval_Air_Forces_desc: "Это новая эра, когда мы больше не посылаем огромные линкоры друг против друга. Чтобы модернизировать Китай и подготовить его ко всем угрозам, с которыми он может столкнуться, мы должны модернизировать нашу морскую авиацию."
