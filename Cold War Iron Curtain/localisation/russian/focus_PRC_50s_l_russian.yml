 prc_war: "Освободительная война"
 prc_war_desc: "Общая защита Китая подошла к концу. Маньчжурия наконец-то была защищена от реакционеров, и наши успехи вдохновили молодежь Китая вступить в наши ряды, и тысячи вражеских солдат увидели тщетность своей борьбы и присоединились к коммунистическим силам. Но теперь, когда мы на равных, мы можем отказаться от стратегии партизанской войны и встретить врага на поле битвы в обычной войне! Ци лай! К победе!"
