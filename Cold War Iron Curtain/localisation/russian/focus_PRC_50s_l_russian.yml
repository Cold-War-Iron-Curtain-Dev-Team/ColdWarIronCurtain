 liberate_macau: "Освобождение Макао"
 liberate_macau_desc: "Наши братья в Макао были покорены достаточно давно! Португальцы больше не имеют мощной колониальной империи и не представляют для нас никакой угрозы. Быстрое вторжение положит конец их фашистскому контролю над Макао!"
 liberate_hong_kong: "Освобождение Гонконга"
 liberate_hong_kong_desc: "Гонконг был взят у нас с единственной целью - уничтожить нашу страну опиумом. Мы восстановим нашу честь, вернув город во имя славного китайского социализма! Вполне уместно, что самые разрушительные империи в мире будут побеждены теми самыми людьми, которых они когда-то покорили и отравили. Похоже, британцы снова застрянут со своим ужасным чаем!"
