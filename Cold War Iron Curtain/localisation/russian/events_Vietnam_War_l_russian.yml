l_russian:
 NLF_Flavor.1.d: "Для коммунистов Южного Вьетнама, Сайгонское правительство не смогло провести объединительные выборы и продолжает политику угнетения коммунистов. Регулярные всплески политической борьбы в Сайгоне наряду с коррупцией сильно оттолкнули от себя крестьян, расположенных вдали от городов. Недавно, правительство Северного Вьетнама одобрило проведение освободительной войны для южновьетнамских коммунистов. Были активизированы кадры Вьетминя, которые остались после ухода французов. Многие из них сейчас обучают крестьян партизанской войне и учат коммунизму. Другие уже начали нападать на правительственных чиновников в сельской местности в надежде быстро освободить Южный Вьетнам. Южновьетнамское правительство развертывает свои собственные силы и обещает быстро справиться с беспорядками."
 NLF_Flavor.2.d: "После заключения Женевского соглашения коммунисты и Вьетминь решили сформировать Национальный Фронт Освобождения (НФО) для распространения коммунизма в Южном Вьетнаме. Хотя в соглашении оговаривалось, что все Вьетминцы должны уйти с юга, несколько тысяч человек были тайно оставлены там, чтобы составить ядро НФО. Пока же Национальный Фронт будет держаться в тени, устанавливать контакты среди крестьян и распространять среди них коммунистическую идеологию. НФО также будет сеять беспорядки дабы сохранить слабость сайгонского правительства. Так же НФО планирует создать несколько подставных организаций, чтобы скрыть свое существование и неожиданно нанести удар по Сайгону с разных сторон. НФО будет авангардом Южной революции и возглавит объединение Вьетнама, когда настанет этот момент."
 Vietnam_War_Decisions_category_desc: "Неспособность Северного и Южного Вьетнама договориться о плане объединения поставила под угрозу сохранение мира в регионе. Среди южновьетнамцев были те, кто надеялся на создание жизнеспособного правительства, но в сельских районах росло недовольство политической неопределенностью и коррупцией. Северные вьетнамцы решили воспользоваться этим и начали готовить южновьетнамских коммунистов к началу национальной борьбы за объединение. Северо-вьетнамские агенты и агитаторы проникают в страну, чтобы помочь своим союзникам на юге. Южновьетнамское правительство мобилизует свои собственные силы и сторонников, чтобы уничтожить эту угрозу и затем освободить Вьетнам самостоятельно.\n\nФинансирование Фронта Национального Освобождения [?NLF.global_nlf_funding]\nФинансирование Республики Вьетнам [?VIE.global_vie_funding]"
  
 VIN_Bao_Dai.1.d: "Сегодня мы приняли решение осудить Бао Дай. Последний император династии Нгуен в последний раз показал свою некомпетентность. Он просто французская марионетка и не заботится о своем народе! Он даже не проводит время на нашей земле, предпочитая находится с империалистами во Франции. Он-символ угнетения, которое слишком долго преследовало нашу нацию."
 CPSU_VIN.1.d: "Сегодня проходит 20-й съезд Коммунистической партии Советского Союза. Мы получили информацию о секретной речи, которая обличила бывшего лидера Советского Союза Иосифа Сталина и его культ личности. В ней говорится о том, как он укрепил свою власть и создал культ, подобный поклонению ему и той власти, которой он обладал. КПСС стала жертвой его действий, и мы поддерживаем речь первого секретаря Хрущева, коммунизм-это идеология, поддерживающая всех, а не только элиту на вершине иерархии, которую мы так упорно пытались уничтожить. Мы поддержим наших товарищей на севере. Надеюсь, что остальная часть их нации придет к пониманию истинных мотивов бывшего лидера."
 Le_Duan.1.d: "Ле Дуань доводит свою революционную кампанию до абсолюта. Он подверг критике нынешнее руководство страны за то, что оно не проявило инициативы и допустило гибель наших товарищей на юге. Дьем только и делает, что уступает капиталистам и империалистам, он позволяет американскому правительству использовать его как марионетку для расширения своего влияния в Индокитае и остальной Юго-Восточной Азии. Он реорганизовал бойцов после женевских соглашений и призывает наших военных действовать, чтобы помочь южным боевикам. По мнению Ле Дуана, общая задача Вьетнамской революции в настоящее время состоит в том, чтобы ускорить социалистическую революцию в Северном Вьетнаме и одновременно активизировать национальную Народно-демократическую революцию в Южном Вьетнаме."
 VIN_Geneva.1.d: "Мы получили довольно странное предложение от нашего соседа на Севере, который просит провести референдум. Во время женевских соглашений было заявлено, что должен быть проведен референдум по объединению, чтобы разрешить раскол, но на нас оказывают давление со стороны элиты в нашем и американском правительстве, чтобы мы отказались проводить его. У нас действительно нет выбора в этом вопросе... Но так ли это?"
 VIN_Geneva.2.d: "К всеобщему удивлению, юг отклонил наше предложение о проведении референдума, несмотря на то, что это предусмотрено Женевскими соглашениями. Ясно, что Южный Вьетнам не будет сотрудничать с нами и находится под влиянием американского правительства, хотя у нас есть поддержка китайцев и французов. Мы надеемся, что наши товарищи на юге поймут, кто является законным владельцем спорных земель."
 VWP.1.d: "Идет пятнадцатый Пленум Вьетнамской рабочей партии, и теперь нам предстоит принять важное решение . У нас есть выбор между Ле Дуанем и его южной фракцией, которая стремится начать конфликт, чтобы объединить Юг и Север, маоистской группой, которая стремится ввести более интенсивную земельную реформу, как это было в Китае во главе с Чыонг Чином, или мы можем сохранить фракцию во главе с Хо Ши Мином, который чувствовал себя довольно плохо в последние несколько недель. Сохранение Хо Ши Мина у власти также предполагает предоставление большей власти великому генералу Во Нгуен Гиапу."
  
 Vietnam_America.1.d: "\nВ связи с растущей напряженностью в Северном Вьетнаме и общими разногласиями по поводу внутренней политики, правительство Северного Вьетнама объявило о закрытии американского консульства в стране и предоставило всем находящимся там сотрудникам достаточное время для отъезда. Правительство Северного Вьетнама высказалось по поводу несправедливости Соединенных Штатов, их тайных действий на полуострове, а также их поддержки Южного Вьетнама и решил, что с него хватит. Все взгляд мирового сообщества теперь сосредоточены на этой маленькой стране... Какой конфликт возникнет из этого и чем это закончится?"
  
