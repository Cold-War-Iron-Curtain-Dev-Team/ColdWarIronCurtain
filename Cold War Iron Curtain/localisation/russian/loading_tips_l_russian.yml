l_russian:
 LOADING_TIP_0: "От Штеттина на Балтике до Триеста на Адриатике Железный Занавес опустился по всему континенту.\n- Уинстон Черчилль, 5 марта 1946 г."
 LOADING_TIP_1: "При Ленине Советский Союз был как религиозное возрождение, при Сталине как тюрьма, при Хрущеве как цирк и при Брежневе как почтовое отделение США.\n- Збигнев Казимеж Бжезинский, 7 ноября 1977 г."
 LOADING_TIP_2: "Мистер Горбачёв, снесите эту стену!\n- Рональд Рейган, 12 июня 1987 г."
 LOADING_TIP_3: "По милости Божьей Америка выиграла холодную войну.\n- Джордж Герберт Уокер Буш, 29 января, 1992 г."
 LOADING_TIP_4: "Капитализм - всего лишь джентльменский метод рабства. \n- Кваме Нкрума, 1968 г."
 LOADING_TIP_5: "Иногда демократия должна быть залита кровью.\n- Аугусто Пиночет, без даты"
 LOADING_TIP_6: "Коммунизм это не любовь. \n Коммунизм - это молот, который мы используем, чтобы сокрушить врага.\n- Мао Зедун, 1 октября 1949 г."
 LOADING_TIP_7: "Прости своих врагов, но никогда не забывай их имена.\n-Джон Ф. Кеннеди, 1963 г."
 LOADING_TIP_8: "Мы не собираемся отправлять американских парней за 9 или 10000 миль от дома\n делать то, что азиатские парни должны делать для себя.\n- Линдон Джонсон, 21 октября 1964 г."
 LOADING_TIP_9: "Наступает момент, который редко встречается в истории, когда мы выходим из старого в новое, \n когда кончается век и когда душа нации, долго подавленная, обретает высказывание.\n- Джавахарлал Неру, 14 августа 1947 г."
 LOADING_TIP_10: "Сегодня свобода в наступлении, \n демократия в движении. \n- Дуглас МакАртур, 2 декабря 1945 г."
 LOADING_TIP_11: "Искусство политики состоит в том, чтобы точно знать, когда\n нужно ударить противника чуть ниже пояса.\n-Конрад Аденауэр, без даты"
 LOADING_TIP_12: "Когда я покину Сомали, я покину здания, но не людей. \n- Сиад Барре, 1991 г."
 LOADING_TIP_13: "Я марксист-ленинец и буду им до последнего дня своей жизни.\n- Фидель Кастро, 2 декабря 1961 г."
 LOADING_TIP_14: "Флаг свободы, который сегодня развевается над Каиром, Дамаском и Багдадом\n будет развиваться и над остальной частью Ближнего Востока. \n- Гамаль Абдель Насер, 19 июля, 1958 г."
 LOADING_TIP_15: "И тогда я подумал, что мир не знает о Хатыни! \n Они знают о Катыни, о резне польских офицеров там. \nНо они не знают о Белоруссии. \n- Элем Климов, 1977 г."
 LOADING_TIP_16: "Угроза мировой войны больше нет.\n- Михаил Горбачёв, Декабрь 1991 г."
 LOADING_TIP_17: "Апартеид означает добрососедство. \n- Питер Виллем Бота, 1998 г."
 LOADING_TIP_18: "Мои советники построили стену между мной и моими людьми.\n Я не понимал, что происходит. Когда я проснулся, я потерял своих людей.\n-Мухаммед Реза Пахлави, без даты"
 LOADING_TIP_19: "Стена чертовски лучше, чем война.\n- Джон Ф. Кеннеди, август 1961 г."
 LOADING_TIP_20: "Пусть свет свободы, проникающий во все затемненные земли, ярко вспыхнет - пока, наконец, тьма не исчезнет.\n Дуайт Д. Эйзенхауэр, Второе инаугурационное послание, 1957 г."
 LOADING_TIP_21: "Нравится вам это или нет, история на нашей стороне. \n Мы похороним тебя.\n- Никита Хрущев, 18 ноября 1956 г."
 LOADING_TIP_22: "Я не диктатор, и я не думаю, что стану им. \n Я не буду поддерживать власть с пулеметом.\n- Фидель Кастро, 1959 г."
 LOADING_TIP_23: "Основа идеи чучхе заключается в том, что человек - хозяин всего и решающий фактор во всем. \n - Ким Ир Сен, 1977 г."
 LOADING_TIP_24: "Команда НГПМ предоставляет возможность играть в модификации на русском. Ссылка: https://vk.com/newmodsp "
 LOADING_TIP_25: "Однажды я сказал: «Мы вас похороним», и у меня возникли проблемы из-за этого. \n Конечно, мы не будем хоронить вас лопатой. Ваш собственный рабочий класс похоронит вас.\n-Никита Хрущев, 24 августа 1963 г."
 LOADING_TIP_26: "Между социалистической системой и рыночной экономикой нет принципиальных противоречий. \n- Дэн Сяопин, 4 ноября 1985 г."
 LOADING_TIP_27: "Человечество должно положить конец войне, или война положит конец человечеству.\n- Джон Ф. Кеннеди, 25 сентября, 1961 г."
 LOADING_TIP_28: "Берлин это яички Запада. \n Каждый раз, когда я хочу, чтобы Запад кричал, я сжимаю Берлин.\n- Никита Хрущев, 1962 г."
 LOADING_TIP_29: "Мне нравится господин Горбачев, мы можем иметь дело с ним.\n- Маргарет Тэтчер, 18 декабря 1984 г."
 LOADING_TIP_30: "Демократия не для Африки. \n- Мобуту Сесе Секо, 1992"
 LOADING_TIP_31: "Семена тоталитарных режимов взращиваются в нищете и нужде.\n- Гарри С. Трумэн, 3 марта, 1947 г."
 LOADING_TIP_32: "Нет ничего более ценного, чем независимость и свобода.\n- Хо Ши Мин, 1969 г."
 LOADING_TIP_33: "Выжившие в ядерной войне будут завидовать погибшим.\n- Никита Хрущев, 20 июля 1963 г."
 LOADING_TIP_34: "Я бы сказал, что колониализм - замечательная вещь. Это распространило цивилизацию в Африку. До этого у них не было письменности, ни колеса, как мы его знаем, ни школ, ни больниц, ни даже нормальной одежды. \n- Ян Смит, Июнь 1997 г."
 LOADING_TIP_35: "Вот моя стратегия по холодной войне: \nмы выигрываем, они проигрывают.\n- Рональд Рейган, 2 июня 1988 г."
 LOADING_TIP_36: "Все, что я сделал, я сделал для своей страны. \n- Пол Пот"
 LOADING_TIP_37: "Человек может умереть, народы могут расти и падать, но идея живет. \n Идеи выдерживают без смерти.\n- Джон Ф. Кеннеди, 14 декабря 1962 г."
 LOADING_TIP_38: "Если вы начнете бросать ежей под меня, \n Я брошу в вас пару дикобразов.\n- Никита Хрущев, 7 ноября 1963 г."
 LOADING_TIP_39: "Художники не инженеры души.\n- Джон Ф. Кеннеди, 26 октября 1963 г."
 LOADING_TIP_40: "Наши голоса должны идти вместе с нашим оружием. \n- Роберт Мугабе, 1976 г."
 LOADING_TIP_41: "Политика похожа на бокс - вы пытаетесь нокаутировать своих противников. \n- Иди Амин, январь 1976 г."
 LOADING_TIP_42: "Режимы, посаженные штыками, не приживаются.\n- Рональд Рейган, 8 июня 1982 г."
 LOADING_TIP_43: "Это момент вашего поражения. \n Вы только что вбили последние гвозди в гроб коммунизма.\n- Лех Валенса своим тюремщикам, 13 декабря 1981 г."
 LOADING_TIP_44: "Урок холодной войны состоит в том, что против ядерного оружия, \n только ядерное оружие может удержать мир.\n- Чон Монджун, 9 апреля 2013 г."
 LOADING_TIP_45: "Именно в этом духе, духе 76, я прошу вас подняться и присоединиться ко мне в тосте за председателя Мао, премьер-министра Чжоу, за народ наших двух стран, \n и в надежде наших детей, что мир и гармония могут стать наследием нашего поколения для них.\n- Ричард Никсон, 25 февреля 1972 г."
 LOADING_TIP_46: "Когда я был в Белом доме, \nЯ столкнулся с проблемой холодной войны. У нас с Советским Союзом было 30 000 единиц ядерного оружия, которое могло уничтожить всю землю, и я должен был сохранять мир. \n- Джимми Картер, 30 марта 2012 г."
 LOADING_TIP_47: "Нигерия сегодня так же угнетена и необратима\n как Османская империя была в Восточной Европе более века назад. \n Чуквуэмека Одумегву Оджукву, 1969 г."
 LOADING_TIP_48: "Запад не будет сдерживать коммунизм, он превзойдет коммунизм. \nМы не будем отказываться от него, мы будем отклонять его как странную главу в истории человечества \n чьи последние страницы даже сейчас пишутся.\n- Рональд Рейган, 1981 г."
 LOADING_TIP_49: "Моя работа состоит в том, чтобы остановить Британию краснеть.\n- Маргарет Тэтчер, 1977 г."
 LOADING_TIP_50: "Мои сограждане, я рад сообщить вам сегодня, что \nЯ подписал закон, который поставит Россию вне закона навсегда.\n Мы начнем бомбардировку через пять минут.\n- Рональд Рейган, 11 августа 1984 г."
 LOADING_TIP_51: "Мы, коммунисты, должны на некоторое время присоединиться к капиталистам. \nНам нужно их сельское хозяйство и их технологии.\n- Леонид Брежнев 1976 г."
 LOADING_TIP_52: "Мы не предлагаем сидеть здесь в кресле-качалке, сложив руки \nи пусть коммунисты создадут любое правительство в западном полушарии.\n- Линдон Джонсон 1965 г."
 LOADING_TIP_53: "Центральноафриканцы! Этим утром ваша армия взяла под свой контроль правительство. \n Час справедливости близок. Буржуазия отменена. \nНовая эра равенства между всеми началась. Да здравствует Республика! \n- Жан Бедель Бокасса, 1 января 1966 г."
 LOADING_TIP_54: "В России есть вещи, которые не такие, как кажутся. \n- Георгий Жуков, 1963"
 LOADING_TIP_55: "Мы пролили океан крови за братство и единство наших народов, \n и мы не позволим никому трогать или разрушать это изнутри.\n- Иосип Броз Тито, 1975 г."
 LOADING_TIP_56: "Советский Союз действительно был нашей самой большой угрозой\n не столько из-за того, что он сделал, \n но из-за оправданий он обеспечил нас для наших собственных неудач.\n- Джеймс Уильям Фулбрайт, 1963 г."
 LOADING_TIP_57: "Мы не будем преждевременно или излишне рисковать издержками мировой ядерной войны\n в котором даже плоды победы будут пеплом в наших устах - \n но мы не должны уклоняться от этого риска в любое время, когда с ним приходится сталкиваться.\n- Джон Ф. Кеннеди, 1963 г."
 LOADING_TIP_58: "[Албанцы] кажутся довольно отсталыми и примитивными людьми ... они могут быть такими же верными, как собака; это одна из черт примитива. \n Наши чуваши были такими же. Русские цари всегда использовали их для своих телохранителей. \n Иосиф Сталин, 1947 г."
 LOADING_TIP_59: "Сдержанность? Почему вы так заинтересованы в спасении их жизни?\n Вся идея состоит в том, чтобы убить ублюдков. \nВ конце войны, если в живых останутся два американца и один русский, мы победим.\n- Томас Пауэр, 1960 г."
 LOADING_TIP_60: "Вы [албанцы] - отдельный народ, как и персы и арабы, которые имеют ту же религию, что и турки. Ваши предки существовали до римлян и турок. \n Религия не имеет ничего общего с национальностью и государственностью ... вопрос о религиозных верованиях должен быть тщательно продуман, должен решаться с большой осторожностью, потому что религиозные чувства людей не должны оскорбляться. \n Иосиф Сталин Энверу Ходже, 1949 г."
 LOADING_TIP_61: "Давайте не будем обмануты, \n мы сегодня в разгаре холодной войны.\n- Бернард Барух 16 апреля 1947 г."
 LOADING_TIP_62: "Сегодня мы участвуем в окончательной тотальной битве между коммунистическим атеизмом и христианством. \n Современные поборники коммунизма выбрали это как время, \n и дамы и господа, деньги не работают, они действительно не работают.\n- Джозеф Маккарти, 9 февраля 1950 г."
 LOADING_TIP_63: "Тот, кто не патриотичен, не может считаться португальцем. \n -Антонио де Оливейра Салазар, 1952 г."
 LOADING_TIP_64: "Если мы имеем в виду, что мы хотим удержать Европу от коммунизма, мы не должны сдвинуться с места. \n Я верю, что будущее демократии требует от нас оставаться здесь до тех пор, пока нас не вытеснят.\n- Люсиус Клей о Берлине, 1948 г."
 LOADING_TIP_65: "Я должен умереть, чтобы снова увидеть тех, кто умер раньше, \n и сказать им, что посеянное нами семя пустило корни. \n- Менгисту Ньюай перед казнью, 30 марта 1961 г."
 LOADING_TIP_66: "Мы не хотим чужого национализма. \n- Джомо Кениата, 1964 г."
 LOADING_TIP_67: "Хотя перестрелка окончена, мы находимся в разгар холодной войны, которая становится все теплее.\n- Бернард Барух, 1947 г."
 LOADING_TIP_68: "Мы боролись с рождаемостью нации. \n- Дэвид Халберштам о войне во Вьетнаме, 2011 г."
 LOADING_TIP_69: "Единственная альтернатива сосуществованию - это кодостроение. \n- Джавахарлал Неру, 29 августа, 1954 г."
 LOADING_TIP_70: "Стало необходимым разрушить город, чтобы спасти его. \n- Безымянный майор армии США о бомбардировке вьетнамской деревни, 1968 г."
 LOADING_TIP_71: "Именно солдаты платят большую часть человеческих потерь. На войне удивительно, как все сводится к характеру одного человека. \n Генерал Крейтон Абрамс, 1969 г."
 LOADING_TIP_72: "Наступает момент, который приходит, но редко в истории, \n когда мы выходим из старого в новое, когда заканчивается век, \n и когда душа нации, долго подавленная, находит высказывание. \n- Джавахарлал Неру, 14 августа, 1947 г."
 LOADING_TIP_73: "Мы всегда смотрели наружу, в Новый Свет, \nи сегодня мы смотрим в Новый Свет, а также в Азию и Африку. \n- Клемент Эттли 8 ноября 1962 г."
 LOADING_TIP_74: "Вы не можете осуществить фундаментальные изменения без определенного количества безумия.\n- Томас Санкара, 1985 г."
 LOADING_TIP_75: "Вопреки тому, во что можно верить, \n я первый, кто приветствует мирное решение проблем. \n- Морис Ямеого после свержения, 2 января 1966 г."
 LOADING_TIP_76: "Современные методики «промывания мозгов» и ментоцидов \nэто извращения психологии\nможет привести практически любого человека в подчинение и сдаться.\n- «Похищение разума» Джоста Меерлоо, 1956 г."
 LOADING_TIP_77: "Раймонд Шоу - самый добрый, самый храбрый, самый теплый,\n самый замечательный человек, которого я когда-либо знал в своей жизни. \n- Беннетт Марко, 1963 г."
 LOADING_TIP_78: "Я знаю, что ты пришел, чтобы убить меня. \nСтреляй, трус, ты собираешься убить только человека.\n-Эрнесто Гевара, 1967 г."
 LOADING_TIP_79: "Если президент знает, чего он хочет, ни один бюрократ не сможет его остановить.\n Президент должен знать, когда прекратить принимать советы.\n-Гарри С. Трумэн, 1945 г."
 LOADING_TIP_80: "Я начал революцию с 82 солдатами. Если бы мне пришлось сделать это снова, я бы сделал это с 10 или 15 и абсолютной верой. \nНеважно, насколько вы маленький, если у вас есть вера и план действий.\n-Фидель Кастро, 1959 г."
 LOADING_TIP_81: "Все ли люди люди?\n Или некоторые люди более человечны, чем другие?\n-Ромео Даллер, 1994 г."
 LOADING_TIP_82: "Я не знаю, я только когда-либо убивал коммунистов. \n Польский наемник Рафал Ганович, \n на вопрос о том, что значит убивать человека, 1967 г."
 LOADING_TIP_83: "Мы знали, что мир не будет таким же. Мало кто смеялся, мало кто плакал, большинство молчали. \n Дж. Роберт Оппенгеймер, описывающий реакции на испытание Тринити, 1965 г."
 LOADING_TIP_84: "Позвольте мне сказать вам кое-что, что мы, израильтяне, имеем против Моисея. Он провел нас 40 лет в пустыне, чтобы привести нас в одно место на Ближнем Востоке, где нет нефти! \n Голда Меир"
 LOADING_TIP_85: "Маловероятно, что коммунизм когда-либо станет значительным фактором в Эфиопии при нынешнем правительстве. \n Коммунистическая деятельность ограничена, и нет никаких признаков того, что она добилась эффективного прогресса. \n ЦРУ, 1952 г."
 LOADING_TIP_86: "В то время как революционеры как личности могут быть убиты, вы не можете убивать идеи. \n -Томас Шанкара, за неделю до убийства, 1987 г."
 LOADING_TIP_87: "Без достоинства нет свободы, без справедливости нет достоинства, а без независимости нет свободных людей. \n -Патрис Лумумба, 1960 г."
 LOADING_TIP_88: "Скажем, диалектический материализм работает как кокаин. \n Если вы понюхаете это один или два раза, это может не изменить вашу жизнь. \n Если вы будете употреблять его день за днем, это сделает вас зависимым, другим человеком. \n - Николае Чаушеску, 1972 г."
 LOADING_TIP_89: "Мы хорошо играем на краю пропасти, и если мы падаем, мы падаем только на тела наших врагов. \n- Хафез Асад"
 LOADING_TIP_90: "Для кого это дает нам хорошую руку, мы протянули ему хорошую руку, а для кого это дает нам злую руку, мы протянули ему нож, который режет зло. \n- Хафез Асад"
 LOADING_TIP_91: "Там нет страха за будущее. Мы сильнее всех, потому что мы с истиной, потому что мы с людьми, потому что мы с Богом, а Бог с людьми. \n- Хафез Асад"
