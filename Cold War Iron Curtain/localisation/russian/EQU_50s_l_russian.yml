l_russian:
  
 ROC_Review_the_Economy: "Перемотр экономики"
 ROC_Review_the_Economy_desc: "Французским колониям необходимо пересмотреть свой статус после Второй мировой войны. Мы также должны посмотреть, сможем ли мы улучшить какую-либо из наших инфраструктур."
 ROC_Military_Reform: "Военная реформа"
 ROC_Military_Reform_desc: "Многие из наших самых умов сейчас находятся во Франции после того, как показали свои заслуги, сражаясь с Вишистской Францией. Мы должны компенсировать это."
 ROC_The_Matters_of_Colonial_Administration: "Вопрос колониальной администрации."
 ROC_The_Matters_of_Colonial_Administration_desc: "Колониальная система должна быть перепрофилирована в цифровой эпохе."
 ROC_The_New_Governor_1951: "Новый губернатор"
 ROC_The_New_Governor_1951_desc: "Время Корнуэлла истекло. Франция считает, что Бернар останется."
 ROC_Standardize_Laws: "Стандартизация законов"
 ROC_Standardize_Laws_desc: "Мы должны стандартизировать законы в этих колониях, чтобы повысить эффективность нашего правительства."
 ROC_An_Equatorial_Customs_Union: "Экваториальный таможенный союз"
 ROC_An_Equatorial_Customs_Union_desc: "Нам нужно официально создать экономический союз между колониями. Это повысит эффективность работы наших заводов."
 ROC_Aid_From_the_Homeland: "Помощь с метрополии"
 ROC_Aid_From_the_Homeland_desc: "Мы можем обратиться к французам за промышленной помощью. Мы были самым преданным регионом и держались Франции, несмотря на существование Вишистской Франции."
 ROC_More_Rubber: "Больше резины"
 ROC_More_Rubber_desc: "Резина - это один из основных продуктов нашей экономики. Нам нужно еще больше."
 ROC_Industry_of_Brazzaville: "Промышленность Браззавиля"
 ROC_Industry_of_Brazzaville_desc: "Давайте стимулировать перспективный промышленный центр. Наша промышленность должна расти в размерах."
 ROC_Inroads_into_Africa: "Вторжение в Африку"
 ROC_Inroads_into_Africa_desc: "Нам нужно больше способов для путешествовия между экваториальными колониями."
 ROC_Mining_in_Chad: "Добыча полезных ископаемых в Чаде"
 ROC_Mining_in_Chad_desc: "Чад богат редкими ресурсами. Мы должны использовать этот факт."
 ROC_Minds_of_Tommorrow: "Умы завтрашнего дня"
 ROC_Minds_of_Tommorrow_desc: "Нам нужно приложить общие усилия, чтобы обучить туземцев."
 ROC_Public_Schools: "Государственные школы"
 ROC_Public_Schools_desc: "Государственные школы будут поощрять равенство и охватят больше людей. Это может вызвать гнев некоторых туземных вождей, которые опасаются того, что это может означать конец для их традиций."
 ROC_Teach_Local_Languages: "Преподавание местных языков"
 ROC_Teach_Local_Languages_desc: "Местные языки являются основой этих колоний. Без них ничего нельзя сделать с туземцами. Это порадует многих людей в наших колониях как признак интеграции."
 ROC_Private_Schools: "Частные школы"
 ROC_Private_Schools_desc: "Частные школы поощряют порядок. Никто не будет жаловаться на них."
 CAN_Encourage_French: "Поощрение французского языка"
 CAN_Encourage_French_desc: "Преподавание французского языка в первую очередь повысит лояльность туземцев, делая их немного занощивее. Однако это даст нам еще немного политической власти для переговоров с Францией."
 ROC_Teaching_Reforms: "Реформы образования"
 ROC_Teaching_Reforms_desc: "Обучение в этих колониях должно быть облегчено. Нам нужно нанять лучших учителей и пересмотреть нашу систему преподавания."
 ROC_Catholic_Missionaries: "Католические миссионеры"
 ROC_Catholic_Missionaries_desc: "Мы должны поощрять сотрудничество частных школ с католическими миссионерами. Это только укрепит установленный порядок."
 ROC_Local_Troops: "Местные войска"
 ROC_Local_Troops_desc: "Мы должны побуждать людей вступать в нашу армию. Это компенсирует эмиграцию французских солдат после Второй мировой войны."
 ROC_Local_Officers: "Местные офицеры"
 ROC_Local_Officers_desc: "Мы должны построить свою собственную военную культуру, независимую от Франции. Мы должны способствовать вступлению людей в наш армейский корпус."
 ROC_Officer_Schools: "Офицерские школы"
 ROC_Officer_Schools_desc: "Открытие местных офицерских школ будет способствовать развитию нашей собственной военной культуры и сделает нас более автономными. Это также решит проблему бездарных туземных офицеров."
 ROC_Officers_from_Home: "Офицеры из метрополии"
 ROC_Officers_from_Home_desc: "Мы будем продолжать зависеть от Франции в наших военных стратегиях."
 ROC_Bargain_with_France: "Сделка с Францией"
 ROC_Bargain_with_France_desc: "Мы могли бы ходатайствовать перед Францией о некоторых военных подразделениях, учитывая нашу лояльность к ним."
 ROC_Army_Reform: "Реформа армии"
 ROC_Army_Reform_desc: "Нам нужно переосмыслить то, как работает наша армия. Нам нужно определить его приоритеты."
 ROC_Jeeps_Across_the_Plains: "Джипы по равнинам"
 ROC_Jeeps_Across_the_Plains_desc: "Наше основное внимание должно быть сосредоточено на севере, где моторизованные дивизии работают эффективно, и мы находимся под угрозой со стороны Египта и Ливии. Моторизованные дивизии-это путь к модернизации нашей армии"
 ROC_Cut_the_Trees: "Вырубить деревья"
 ROC_Cut_the_Trees_desc: "Нам нужно сосредоточиться на технике вырубке деревьев, чтобы позволить нашим моторизованным войскам пройти через джунгли. Практические упражнения освободят место для заводов, а также научат нашу армию передвигаться на джипах по джунглям."
 ROC_Army_of_the_Brush_and_Jungle: "Армия кустарников и джунглей"
 ROC_Army_of_the_Brush_and_Jungle_desc: "Экваториальная Африка - это в основном кустарники и джунгли. Мы должны сосредоточиться на защите большей части нашей страны. Моторизованные войска ничего не сделают в джунглях"
 ROC_Local_Initiative: "Местная инициатива"
 ROC_Local_Initiative_desc: "Мы должны вдохновлять туземцев, чтобы они защищали нашу нацию. Их знание территорий очень поможет нашей армии."
 ROC_Minor_Details: "Незначительные детали"
 ROC_Minor_Details_desc: "Хотя мы и колония, метрополия дает нам свободу действий в том, как вести себя. Давайте переосмыслим нашу политику в эту новую эпоху."
 ROC_Undermine_French_Governors: "Ликвидация французских губернаторов"
 ROC_Undermine_French_Governors_desc: "Беграмотные губернаторы. Они сдерживают эту нацию и создают культуру кумовства. Их нужно убрать бесшумно."
 ROC_Support_the_French_Governors: "Поддержка французских губернаторов"
 ROC_Support_the_French_Governors_desc: "Французские губернаторы бесценны. Они знают эту страну почти так же хорошо, как местные жители. Они могут контролировать свое местное население. Мы должны поддержать их, поскольку они стремятся к французизации этой территории."
 ROC_Restrict_Local_Councils: "Ограничить местные советы"
 ROC_Restrict_Local_Councils_desc: "Местные советы - это ступенька к независимости и индигенизации. Они разорвут эту землю на части."
 ROC_Forced_Labor: "Принудительный труд"
 ROC_Forced_Labor_desc: "Принудительный труд хорошо работал в Конго. Мы должны реализовать его здесь, чтобы мы могли модернизироваться."
 ROC_Cooperate_with_Local_Councils: "Сотрудничество с местными советами"
 ROC_Cooperate_with_Local_Councils_desc: "Учитывая некоторые изменения в том, как они работают, местные советы могут расположить наше правительство к местным жителям."
 ROC_The_Governors_Government: "Правительство губернатора"
 ROC_The_Governors_Government_desc: "Наша государственная система была полностью перестроена, мы пока можем ее изменить. Давайте продолжим изменения."
 ROC_Request_Autonomy: "Запросить автономию"
 ROC_Request_Autonomy_desc: "Wы можем модернизировать только как колония. Необходимо добиться большей автономии и иметь возможность быстро внедрять наилучшую политику на местах."
 ROC_Autonomy_Denied: "Отказ в автономии"
 ROC_Autonomy_Denied_desc: "Создается впечатление,что французы не готовы разделить экваториальную Африку. Мы должны заставить их увидеть свет."
 ROC_Stir_Up_Discontent: "Разжечь недовольство"
 ROC_Stir_Up_Discontent_desc: "Франция должна знать, насколько негативно отсутствие автономии влияет на колонии."
 ROC_Native_Resentment: "Внутренее недовольство"
 ROC_Native_Resentment_desc: "Из-за нашего буквального толкования французской политики некоторые неизбежно могут возненавидеть наше правительство»."
 ROC_Stage_Riots: "Стадия беспорядков"
 ROC_Stage_Riots_desc: "Мы должны продолжать работу. Автономия для нас не за горами."
 ROC_Demand_Emergency_Powers: "Требовать чрезвычайных полномочий"
 ROC_Demand_Emergency_Powers_desc: "Нам нужно расправиться с этими протестующими. Франция тогда узнает, что они совершили ошибку."
 ROC_Autonomy_Accepted: "Автономия принята"
 ROC_Autonomy_Accepted_desc: "После долгих переговоров Франция наконец решила передать часть своего господства нашему правительству в Пуэнт-Нуар»."
 ROC_Administrative_Reform: "Административная реформа"
 ROC_Administrative_Reform_desc: "Проще говоря, французское направление сдерживало эту территорию. Теперь все изменится."
 ROC_Power_to_the_Governor: "Власть губернатору"
 ROC_Power_to_the_Governor_desc: "Губернатор будет главой нашего правительства не только по номинально. Все будут подчиняться."
 ROC_A_Unitary_Constitution: "Унитарная конституция"
 ROC_A_Unitary_Constitution_desc: "Банги-Шари, Габон, Конго – государства которым никогда не быть. Единственное возможное государство в этой области - Экваториальная Африка."
 ROC_Suspend_our_Ambitions: "Остановить наши амбиции"
 ROC_Suspend_our_Ambitions_desc: "Мы зашли слишком далеко. Нам нужно успокоить людей."
 ROC_Governor_Chauvet_Takes_Command: "Губернатор Шове принимает командование"
 ROC_Governor_Chauvet_Takes_Command_desc: "Габриэль Шове здесь, чтобы спасти африканский народ от жестокого обращения Корню-Джентиля."
 ROC_Locals_In_Civil_Service: "Местные жители на государственной службе"
 ROC_Locals_In_Civil_Service_desc: "Мы должны сделать нашу администрацию более эффективной, включив в нее местное население"
 ROC_Regional_Autonomy: "Региональная автономия"
 ROC_Regional_Autonomy_desc: "Давайте рассмотрим идею региональной автономии. Должны ли мы увеличить или уменьшить ее"
 ROC_Destandardize_Laws: "Дестандартные законы"
 ROC_Destandardize_Laws_desc: "В качестве шага к автономии мы должны отказаться от идеи сохранения единых законов на этой территории. Нет смысла для каждого штата иметь одинаковый набор законов"
 ROC_Keep_the_Current_System: "Сохранить текущую систему"
 ROC_Keep_the_Current_System_desc: "Экваториальная Африка будет продвигаться вперед за счет расширения своей власти, а не за счет дестандартизации"
 ROC_Invite_Cameroon: "Пригласить Камерун"
 ROC_Invite_Cameroon_desc: "Мандат Камеруна должен быть передан нам. Давайте спросим местных губернаторов, что они думают"
 ROC_Union_of_Central_African_Republics: "Союз Центральноафриканских Республик"
 ROC_Union_of_Central_African_Republics_desc: "Мы должны официально изменить наше имя. Мы не просто французы"
 ROC_1951_Development_Plan: "План развития на 1951 год"
 ROC_1951_Development_Plan_desc: "Давайте создадим набор планов по модернизации нашей нации"
 ROC_End_Forced_Labor: "Конец принудительного труда"
 ROC_End_Forced_Labor_desc: "Давайте избавимся от бесчеловечной практики того, что люди называют «псевдо-гулагами»"
 ROC_Development_Plan_Modernization_51: "План модернизации на 1951 год"
 ROC_Development_Plan_Modernization_51_desc: "Наша страна должна двигаться вперед"
 ROC_1953_Development_Plan: "План развития на 1953 год"
 ROC_1953_Development_Plan_desc: "Мы продолжим прогресс"
 ROC_Development_Plan_Modernization_53: "План модернизации на 1953 год"
 ROC_Development_Plan_Modernization_53_desc: "Мы должны продолжать работу, чтобы привести нашу страну в будущее"
 ROC_The_State_of_Equatorial_Africa: "Государство Экваториальной Африки"
 ROC_The_State_of_Equatorial_Africa_desc: "Пришло время провозгласить новое африканское государство. Теперь это реальность. Наши мечты сбылись"
 ROC_A_Union_Under_Gentille: "Союз во главе Жантия"
 ROC_A_Union_Under_Gentille_desc: "Мы не должны забывать, кто привел нас сюда. Давайте дадим ему самый высокий титул, какой только сможем. Он будет консулом, как Наполеон"
 ROC_Sweeten_the_Deal: "Подсластить сделку"
 ROC_Sweeten_the_Deal_desc: "Франция наверняка не будет возражать против независимости, если мы дадим им что-нибудь взамен"
 ROC_France_Rejects: "Франция отвергает сделку"
 ROC_France_Rejects_desc: " К сожалению, Франция еще не дала нам независимости. Мы должны посмотреть, что можно сделать"
 ROC_Request_Independence: "Запрос независимости"
 ROC_Request_Independence_desc: "Мы считаем, что показали Франции, что мы готовы к независимости. Давайте подождем их ответа"
 ROC_France_Accepts: "Франция согласна"
 ROC_France_Accepts_desc: "Сегодня счастливый день. Франция дала нам независимость."
 ROC_Autonomy_to_Gabon: "Габонская автономия"
 ROC_Autonomy_to_Gabon_desc: "Гвбон сталкивается с той же проблемой, что и Убанги-Шари, но им нужна большая автономия из-за их близости к Камеруну и испанским владениям"
 ROC_Give_Political_Authority_to_Ubangi_Shari: "Передать власть Убанги-Шари."
 ROC_Give_Political_Authority_to_Ubangi_Shari_desc: "Мы должны дать больше власти местным губернаторам Убанги-Шари. Они изолированы от Пуэнт-Нуара и требуют особого внимания на местном уровне"
 ROC_Dissolution_of_French_Equatorial_Africa: "Распад Французской Экваториальной Африки"
 ROC_Dissolution_of_French_Equatorial_Africa_desc: "Деколонизацию больше нельзя сдерживать. Пришло время разваливаться"
 ROC_1955_Development_Plan: "План развития на 1955 год"
 ROC_1955_Development_Plan_desc: "Пора продолжить наши промышленные планы"
 ROC_Development_Plan_Modernization_55: "План модернизации 1955 года"
 ROC_Development_Plan_Modernization_55_desc: "Мы догоним французскую промышленность к 1960 году!"
 roc_france_pay: "Платежи во Францию"
 roc_france_pay_desc: "Мы платим Франции за достижение независимости"
 roc_france_give: "Платежи в Экваториальной Африке"
 roc_france_give_desc: "Мы получаем дань от нашей экваториальной африканской колонии в обмен на их независимость"
 equ.1.t: "Смена губернатора"
 equ.1.d: "Французы решили, что время Бернара Корну-Жантийя истекло. Он был назначен губернатором на несколько лет после окончания Второй мировой войны. Однако он отслужил это время, и теперь Франция хочет отозвать его и заменить другим губернатором, Луи Габриэлем Шове. Мы можем оспорить это, но никто не будет счастлив, и наша возможность реформ будет упущена."
 equ.1.a: "Отправить Жантийля домой"
 equ.1.b: "Оставить Жантийля"
