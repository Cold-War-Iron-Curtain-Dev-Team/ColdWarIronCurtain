l_russian:
 wgr.1.t: "Принять ФРГ в НАТО?"
 wgr.1.d: "Западная Германия обратилась к нам с просьбой вступить в НАТО. Принимем ли мы их в НАТО? Это значительно облегчило бы наше военное сотрудничество."
 wgr.1.a: "Да, принять их."
 wgr.1.b: "Никаких бывших нацистов в НАТО."
 wgr.2.t: "Возвращение в Германию"
 wgr.2.d: "Западная Германия попросила нас вернуться в Федеративную Республику Германия, но наша экономика тесно связана с Францией. Мы могли бы вернуться в Германию или еще больше сблизиться с Францией. Может быть, мы останемся полностью независимыми? Это потребует проведения референдума."
 wgr.2.a: "Вернуться в Германию"
 wgr.2.b: "Продолжить сближение с Францией"
 wgr.2.c: "Остаться полностью независимыми"
 wgr.3.t: "Эльзас-Лотарингия - часть Германии"
 wgr.3.d: "Западная Германия и ее фашистские лидеры хотят получить от нас Эльзас-Лотарингию путем референдума. Мы не можем позволить им захватить нашу территорию!"
 wgr.3.a: "Отдать территорию Германии"
 wgr.3.b: "Оставить территорию себе"
 wgr.4.t: "Западная Германия хочет воссоединения!"
 wgr.4.d: "Федеративная Республика Германия готова к воссоединению под их командованием. Мы станем частью Запада и разорвем все дипломатические отношения с Востоком. И в конце концов, Германия снова будет единой."
 wgr.4.a: "Давайте объединимся!"
 wgr.4.b: "Остаться на стороне СССР"
 wgr.9.t: "Новый Кайзер"
 wgr.9.d: "Пришло время выбрать нашего нового Кайзера. У нас 2 варианта: Луи Фердинанд, принц Пруссии или Принцесса Виктория Луиза Прусская."
 wgr.9.a: "Поприветствуем Луи I"
 wgr.9.b: "Королева Виктория I"
 wgr.10.a: "Он останется в Западной Германии, и это окончательно."
 wgr.10.b:0 "Создать пункт выдачи в Восточную Германию" wgr.10.t: Создать пункт выдачи в Восточную Германию" wgr.10.t:0 "Германская Демократическая Республика требует Вернера Вайнхольда "
 wgr.10.d: "Мы получили запрос от Германской Демократической Республики (ГДР) об экстрадиции восточногерманского пограничника Вернера Вайнхольда в ГДР (Немецкая Демократическая Республика). Они заявили, что он убил двух восточногерманских солдат, а затем также перешел на запад. Они хотят отдать его в суд и судить. Вернер Вайнхольд, убив двух восточногерманских солдат, мог оказаться полезным для внутренней работы восточногерманской пограничной службы и позиций солдат. Однако, если мы оставим его здесь, правительство Восточной Германии будет недовольно. Нам нужно принять решение об экстрадиции."
  
 wgr.202.d: "Наступили выборы 1961 года. Впервые у СДПГ появился кандидат в канцлеры, который не является председателем партии: Вилли Брандт, правящий мэр Западного Берлина. После возведения Берлинской стены он завоевывал все больше симпатий, а канцлера Конрада Аденауэра критиковали за то, что он не оказывал достаточной поддержки жителям Западного Берлина. Аденауэра должно было спасти абсолютное большинство ХДС и ХСС, но, учитывая его возраст и длительный срок пребывания на посту канцлера, были большие сомнения в том, что он возглавит страну на четвертом сроке."
 #wgr.12.t: "Кризис истребителей"
 #wgr.12.d: "Похоже, что наши новые истребители не так хороши, как казалось, поскольку за последние несколько дней у нас было несколько крупных аварий. Наши эксперты теоретизируют, что F-104 Starfighter просто не разработан с учетом наших погодных условий. Нам придется найти какое-то решение."
 #wgr.12.a: "О, нет..."
 wgr.15.d: "Теперь все готово к объединению. Вскоре СДП и КПГ объединятся для достижения конечной цели."
 wgr.16.d: "Последние новости для Федеративной Республики Германия. СДП и КПГ объявили о слиянии двух партий. Новая партия называется Vereinigte Sozialistische Partei, или Объединенная социалистическая партия. Официальные отчеты изображают это слияние как добровольное объединение усилий социалистических партий. Однако некоторые подозревают, что слияние было более сложным, чем мы предполагаем."
 wgr.17.t: "Смерть Аденауэра"
 wgr.17.d: "Конрад Герман Йозеф Аденауэр, наш первый канцлер, отец Виртшафтсвундера и низшего человека, умер в своем семейном доме в Рондорфе. По словам дочери, его последние слова были: \"Da jitt et nix zo kriesche!"(На кельшском жаргоне это означает "здесь не о чем плакать!\"). На его похоронах в Кельнском соборе присутствовало большое количество иностранных гостей. Было представлено сто восемьдесят стран, в том числе пятнадцать мировых лидеров. После заупокойной мессы и богослужения, его останки были доставлены вверх по течению Рейна в Рендорф на борту "Кондора" вместе с еще двумя быстроходными штурмовиками класса "Зеедлер" и "Шпербер" в качестве эскорта, "мимо тысяч людей, молча стоявших на обоих берегах реки". Он похоронен на кладбище Вальдфридгоф в Rhöndorf. Когда немцев спросили, что их больше всего восхищает в Аденауэре, большинство ответило, что он привез домой последних немецких военнопленных из СССР, что стало известно как "возвращение 10000"."
 wgr.17.a: "Увидимся на том свете.."
 Ostpolitik.2.t: "Подписание Варшавского договора"
 Ostpolitik.2.d: "Сегодня в Варшаве канцлер Западной Германии [WGR.GetLeader] и польский премьер-министр Юзеф Циранкевич подписали Варшавский договор. Договор обязывает обе стороны к ненасилию наряду с принятием существующей границы-линии Одер-Нейсе, навязанной Германии союзными державами на Потсдамской конференции 1945 года после окончания Второй мировой войны. Хотя Польша рада этому соглашению, то же самое нельзя сказать о Западной Германии. Там же оппозиция обозначила эту политику как предательство национальных интересов. В момент подписания договора западногерманские комментаторы пытались утверждать, что это не может быть окончательным решением польского пограничного вопроса, поскольку статья IV этого договора гласит, что предыдущие договоры, такие как Потсдамское соглашение, не были заменены этим последним соглашением; поэтому можно утверждать, что положения этого договора могут быть изменены окончательным мирным договором между Германией и союзниками по Второй мировой войне — как это предусмотрено в Потсдамском соглашении."
 SDP_60s.1.t: "СДП призывает к безъядерной Европе"
 SDP_60s.1.d: "Правящая Социал-демократическая партия (СДП) Западной Германии объявила, что она призывает к созданию безъядерной Европы. Правительство заявило, что народы Европы уже давно находятся в заложниках гонки ядерных вооружений и сверхдержав, развертывающих такое разрушительное оружие по всей Европе. Это заявление получило поддержку не только среди немцев, но и среди европейцев по всему континенту, которые чувствовали себя бессильными перед лицом ядерной угрозы. По всему НАТО растет чувство беспокойства в связи с этим заявлением. Некоторые правительства в частном порядке симпатизируют ему, в то время как другие, особенно Соединенные Штаты, рассматривают это заявление как потенциальный саботаж, подрывающий обороноспособность Европы. Появились группы людей, которые предполагают, что объявление доказывает, что СДП является советским агентом, предназначенным для саботажа НАТО изнутри."
 Stammheim.1.t: "Открытие тюрьмы Stammheim Supermax"
 Stammheim.1.d: "Западная Германия открыла новую тюрьму в Штутгарте. Правительство считает, что тюрьма под названием Stammheim Supermax станет самым безопасным местом в стране. Действительно, тюрьма будет не только содержать заключенных, но и иметь свое собственное здание суда, в котором, возможно, будут судить подозреваемых. Это будет особенно полезно в случаях, связанных с опасными организациями, поскольку они не смогут вмешиваться в судебный процесс. Новый начальник тюрьмы отметил, что тюрьма может оказаться не только самой безопасной тюрьмой в стране, но, возможно, даже в мире. Строительство тюрьмы заняло четыре года, и ожидается, что в ней сразу же разместятся некоторые из самых опасных преступников и подозреваемых."
 WGRPolitical.1.t: "Большая коалиция"
 WGRPolitical.1.d: "После распада коалиции Христианско-демократического союза (ХДС) она объявила о создании Большой коалиции с Социал-демократической партией (СДП). Это спасет правительство, поскольку оно потеряло своих союзников по коалиции, но также обеспечит контроль коалиции почти на девяносто процентов над Бундестагом. Учитывая идеологические разногласия между обеими партиями, ожидается, что правительству будет трудно сохранить контроль. Для ХДС это будет означать более слабую способность принимать законы и больше компромиссов. Что касается СДП, то это заявление возмутило тех, кто больше склонен к левым взглядам и считает великую коалицию предательством партийных ценностей. Студенческие сторонники СДП выразили свое возмущение этим решением. Студенты уже готовят протесты и возглавляют оппозиционную коалицию, но новое правительство считает, что сможет справиться с таким инакомыслием."
 WGRPolitical.2.t: "Преемник Аденауэра"
 WGRPolitical.2.d: "Конрад Аденауэр быстро стал ведущим политиком послевоенной Западной Германии. Он неустанно работал над тем, чтобы сделать Христианско-демократический союз (ХДС) ведущей национальной политической партией. Будучи канцлером, он отстаивал демократические нормы и свободы. Однако он пообещал стране, что уйдет в отставку до конца своего последнего срока, и после некоторых недавних скандалов он не может позволить себе задерживаться. Главным кандидатом на его место является Людвиг Эрхард, человек, который руководил послевоенным экономическим восстановлением и развитием страны. Хотя канцлер Аденауэр имеет свои опасения по поводу Эрхарда, ХДС непреклонен, и Эрхард намерен занять пост второго канцлера Западной Германии"
 WGRPolitical.3.t: "Распад СДП и СДС"
 WGRPolitical.3.d: "Социал-демократическая партия Западной Германии (СДП) официально объявила о своем отделении от Социалистического немецкого студенческого союза (СДС). СДС образовалась вскоре после окончания Второй мировой войны как колледж-филиал СДП. Однако с момента обретения независимости она постоянно находилась в противоречии с родительским институтом. В частности, СДС решительно выступала против перевооружения Западной Германии, которое поддерживала СДП. Кроме того, СДС выразила обеспокоенность тем, что СДП тесно сотрудничает с основными партиями, идеологически противостоящими политическим арендаторам СДП. СДП объявила, что немедленно исключит из своих рядов всех членов СДС. СДС объявила, что будет действовать в интересах немецкого народа и трудящихся и не пойдет на компромисс со своими ценностями ради политической выгоды или ради иностранных интересов. Ожидается, что еще больше левых членов СДП поменяют свою лояльность."
  
 Elysee.1.t: "Елисейский договор"
 Elysee.1.d: "Президент Франции и канцлер Западной Германии подписали сегодня в Париже Елисейский договор. Этот договор призван положить конец десятилетиям конфликтов и соперничества между двумя континентальными европейскими державами. Эти два государства были вовлечены в многочисленные вооруженные конфликты с девятнадцатого века до Второй Мировой Войны. Договор предусматривал регулярные встречи между двумя государствами. Главы государств будут регулярно встречаться, а межведомственный комитет будет координировать сотрудничество между двумя государствами. Обе страны должны также координировать оборонное и дипломатическое сотрудничество друг с другом. Граждане обеих стран приветствуют этот договор и с нетерпением ожидают наступления новой эры мира и сотрудничества между двумя важнейшими сухопутными державами Европы. Французское правительство надеется, что это может привести к созданию более тесного союза, чтобы бросить вызов советской и американской гегемонии, но время покажет, разделит ли Западная Германия эту долгосрочную цель."
 Ostpolitik.3.d: "Западногерманское правительство и Советский Союз недавно заключили новый договор, названный Московским договором. Оба правительства договорились о нормализации отношений друг с другом. Они также пообещали сохранить международный мир, отказаться от применения оружия и согласились на границы после Второй мировой войны. Этот договор отражает новую политику, проводимую нынешним правительством Германии. Подписав этот договор, Западная Германия признала свою границу с Восточной Германией и на данный момент не настаивает на самоопределении Германии. Что еще более важно, правительство приняло Польшу, контролирующую большую часть бывшей Восточной Пруссии. Многие в Западной Германии выразили удовлетворение в связи с уменьшением напряженности, но есть и недовольство по поводу жертвоприношения немецких границ и самоопределения. Соединенные Штаты выразили озабоченность в связи с этим договором."
 WGR_Pol.1.d: "После Второй мировой войны союзные державы согласились отдать историческую Восточную Пруссию Польше. Советский Союз выполнил это постановление, обеспечив восточногерманское согласие. Однако Западная Германия заявила, что послевоенное соглашение должно было быть решено в будущем, и польская оккупация не подтверждена. Сегодня западногерманское правительство вновь заявило о своих претензиях на Восточную Пруссию и заявило, что объединение Германии включает в себя восстановление Восточной Пруссии в составе нации. Советский Союз и Польша оба назвали это заявление провокационным и указывающим на то, что Западная Германия питает фашистские территориальные желания, угрожающие миру в Европе. Западногерманское заявление получило поддержку многих в стране, но есть большая часть населения, которая считает это заявление слишком провокационным в нынешнем политическом климате."
 RedArmyFaction.20.t: "Первые заключенные Stammheim"
 RedArmyFaction.20.d: "Фракция Красной армии (RAF) - крайне левая военизированная организация, проводящая атаки по всей Западной Германии. Недавняя эскалация насилия, похищений и убийств привела к национальному кризису во всей Западной Германии. Многие в Германии стали подозревать, что левые партии могут быть идеологически связаны с боевиками. В этой напряженной обстановке было принято решение начать репрессии против RAF. Силы безопасности будут более интенсивно работать над арестом членов организации и ее искоренением. Арестованные члены RAF будут содержаться в полной изоляции от средств массовой информации и не будут допущены к публичным заявлениям. Интенсивная изоляция также будет включать запрет членам семьи встречаться с адвокатами или членами их семей. Хотя многие немцы аплодируют репрессиям, есть много тех, кто боится подавления прав членов RAF, что отражает слишком многое из авторитарного прошлого, которое Германия пыталась оставить позади себя."
 Ostpolitik.4.d: "В Эрфурте лидеры Западной Германии впервые встретились с лидерами Восточной Германии. Было заявлено, что встреча прошла успешно, поскольку обе стороны согласились с необходимостью более тесного общения и выразили желание деэскалации конфликта. Ожидается, что на этом саммите будет происходить больше взаимодействий, конечной целью которых будет нормализация отношений между двумя германскими нациями. Хотя саммит приветствуется как ключ к достижению прочного мира и потенциальному объединению, многие представители оппозиции в Западной Германии выразили свое возмущение. Они утверждают, что эта встреча узаконивает восточногерманский режим и приведет лишь к более постоянному разделению Германии. Они называют саммит предательством немецкого народа. Несмотря на это, саммит, по-видимому, является успехом нового курса, политики, направленной на ослабление напряженности и нормализацию отношений между Западной Германией и Восточной Европой."
 WGR_Viet.1.d: "Сегодня западногерманская Республика объявила, что она прекратит все поставки боеприпасов и поддержку вьетнамского конфликта в Юго-Восточной Азии. Первоначально, поддерживая демократический Южный Вьетнам против коммунистов на севере, немцы заявляли, что поддержка такой войны ослабила германскую Республику как экономически, так и в военном отношении, и если бы война исходила от коммунистической Восточной Германии, они были бы беспомощны. Многие предполагают, что такое решение вряд ли изменит исход вьетнамского конфликта, но оно все же оказывает свое влияние на отношения между двумя странами."
 Spiegal_Affair.1.d: "Дело Шпигеля закончилось сегодня отставкой министра обороны Франца Штрауса. Несколько месяцев назад газета Der Spiegel сообщила, что высокопоставленный чиновник НАТО охарактеризовал западногерманских военных как неспособных защитить страну. Это побудило Штрауса послать полицию оккупировать газету, задержать ее сотрудников, и он приказал испанской полиции арестовать автора статьи в Мадриде. Он утверждал, что газета раскрыла государственную тайну, но общественность отреагировала на это уличными протестами против жесткого подхода Штрауса. Штраус в конечном счете не смог убедить суд рассмотреть дело газеты, и вместо этого суд обвинил Штрауса в превышении своих полномочий. Штраус решил покинуть свой пост, чтобы спасти правительство, и Der Spiegel был освобожден от полицейской оккупации. Многие в Западной Германии считают это победой демократии и свободной прессы."
 Europe_Space.1.d: "В Западной Германии на этой неделе начал функционировать Европейский центр космических операций. Этот объект, расположенный в Дармштадте, будет выполнять функции центра управления полетами Европейской организации космических исследований (ESRO). ESRO была основана десятью западноевропейскими государствами, чтобы позволить Европе участвовать в растущей международной космической гонке. Эти государства объединяют свои ресурсы и опыт, чтобы продвигать Европу вперед. Из нового центра управления полетами ESRO надеется управлять и координировать будущие операции. Многие в Западной Германии гордятся тем, что они будут принимать у себя этот новый объект, и считают, что это отражает то значение, которое немцы имели в продвижении космических исследований с самых ранних дней. Большие надежды возлагаются на то, что Европейский центр космических операций вскоре начнет осуществлять полеты в космос с такой же сложностью, как и все другие державы, участвующие в космической гонке."
