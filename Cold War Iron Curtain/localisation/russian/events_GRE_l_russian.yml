 greece.0.t: "Смерть премьер-министра"
 greece.0.d: "	Сегодня Греция оплакивает одного из своих детей. Фемистоклис Софулис, наш премьер-министр, скончался в возрасте 88 лет. Он родился в 1860 году в Вати на острове Самос. Он изучал философию в Афинском национальном университете имени Каподистрии, а затем отправился в Германию, где специализировался на археологии. Он вышел на греческую политическую арену после провозглашения союза между Самосом и Грецией в 1913 году. До этого он участвовал в политике Самоса и сыграл большую роль в процессе объединения. На выборах в мае 1915 года Софулис был избран депутатом греческого парламента и занимал пост министра внутренних дел при Элефтериосе Венизелосе. Когда в 1920 году Венизелос оказался в самоизгнании, Софулис возглавил партию. В 1924 году он впервые стал премьер-министром. В межвоенный период Софулис был одной из центральных политических фигур в Греции. После капитуляции Греции перед Осью в 1941 году Софулис оставался пассивным, как почти все греческие политики. После освобождения он стал премьер-министром до апреля 1946 года и пытался предотвратить начало гражданской войны. Однако его усилия не увенчались успехом, и в результате он на короткое время воздержался от политики. 7 сентября 1947 года он вновь стал премьер-министром в коалиционном правительстве Либеральной партии и Народной партии. Софулис предпринял дальнейшие усилия по прекращению гражданской войны, предложив ЕАМ всеобщую амнистию и новое коалиционное правительство между ним и его партией. Однако эти предложения потерпели крах под сильным давлением США, и гражданская война пошла своим чередом."
 greece.0.r: "Траурный день..."
 greece.1.t: "Александрос Диомидис"
 greece.1.d: "После смерти Фемистоклиса Софулиса Александрос Диомидис, заместитель председателя кабинета министров, становится исполняющим обязанности премьер-министра"
 greece.1.r: "Посмотрим, как все пройдет.."
 greece.2.t: "Александрос Диомидис остается премьер-министром"
 greece.2.d: "После нескольких дней переговоров Лайко Комма и Комма Филелейтерос согласились поддержать Александроса Диомидиса в качестве преемника Софулиса на посту премьера. Диомидис вступил в должность 30 июля 1949 года, когда гражданская война все еще продолжалась.."
 greece.2.r: "Трудные дни для Диомидиса..."
 greece.3.t: "Объединение демократической фракции"
 greece.3.d: "Старая фракция венизелистов все еще расколота на различные большие и малые партии. Это затрудняет противостояние с правыми, которые хоть и находятся сейчас в оппозиции, но, похоже, становятся сильнее день ото дня. Мы много раз пытались объединить различных венизелистов в одну партию, но попытки были безуспешными. Однако впереди последний шанс достичь этой невозможной цели..."
 greece.4.t: "Дебаты о реформе избирательной системы"
 greece.4.d: "Широко признано, что наша нынешняя избирательная система не смогла обеспечить страну стабильными правительствами, способными исполнять свои полномочия. В результате растет число голосов, выступающих за радикальную реформу существующей системы. Они поддерживают мнение, что для будущего Греции необходимо перейти к системе расширенного большинства, чтобы получить стабильные правительства и уйти от хрупкого многопартийного парламентского большинства. Кроме того, и посольство США, и Дворец явно выступают за систему расширенного большинства. Было бы неразумно выступать против них. Однако за предложенной системой скрываются опасности. Мы должны забыть, что партия Папагоса заняла первое место на выборах, хотя ему и не удалось сформировать правительство. Приняв систему усиленного большинства, мы можем неосознанно дать ему сильное однопартийное большинство в следующем парламенте."
 greece.6.t: "Умер Александрос Папагос"
 greece.6.d: "В январе 1955 года у премьер-министра Александроса Папагоса начались проблемы с желудком - результат его предыдущего заключения во время войны. Поэтому он назначил Стефанопулоса временным премьер-министром, пока тот не преодолеет свою болезнь. Однако состояние Папагоса продолжало ухудшаться до сегодняшнего дня, когда наш премьер-министр испустил последний вздох из-за сильного кровоизлияния в легкие."
 greece.7.t: "Караманлис приведен к присяге премьер-министра"
 greece.7.d: "После смерти Папагоса король Павел неожиданно назначает Константиноса Караманлиса премьер-министром. Назначение Караманлиса застало греческую политическую жизнь врасплох, поскольку король обошел двух старших членов партии Папагоса, Стефаноса Стефанопулоса и Панайотиса Канеллопулоса, которых многие считали потенциальными преемниками Папагоса. Став премьер-министром, Караманлис реорганизовал \"Эллиникос синагермос\" в \"Этники ризоспастики эноси\"."
 greece.8.d: "Сегодня утром мы получили ужасающие сообщения о том, что на Ионических островах Кефалония и Закинф произошла серия землетрясений общей магнитудой около 6,8. Два судна Королевского военно-морского флота Великобритании первыми прибыли на место происшествия для оказания экстренной помощи, и, по первым сообщениям, ущерб, нанесенный региону, представляется серьезным. На данный момент число жертв оценивается по меньшей мере в 400 человек, а экономические последствия землетрясения представляются обширными, так как несколько ведущих экономистов уже оценили финансовые потери от землетрясения в миллиарды."
 greece.9.d: "Премьер-министр [GRE.GetLeader] ввел новое законодательство! В ответ на продолжающуюся эпидемию молодых буянов, законодательство теперь позволяет наказывать за их глупые выходки и грубые слова. Наряду с наказанием за использование нецензурных слов, таких как \"gamo teen Panagia sou,\", \"skeela,\" и \"malakas,\", закон также предусматривает конкретные наказания для буянов, которые бросают еду в стариков или нападают на них. В частности, они будут заключены в местный центр заключения, им будут обриты головы, а их родители будут привлечены к ответственности. Кроме того, их будут позорить на улицах за их преступления! Хотя некоторые протестуют против закона из-за его наказаний, многие празднуют решение [GRE.GetLeader] по борьбе с буйной молодежью."
 greece.10.d: "Тесный союз и сотрудничество Греции с Соединенными Штатами сохранили ее независимость после бурных 1940-х годов. Греческий народ имел дело с оккупационными войсками Италии, Германии и Великобритании. Кроме того, страна только недавно вышла из гражданской войны, в которой потерпели поражение греческие коммунисты. Начало Корейской войны заставило Соединенные Штаты призвать всех своих друзей и союзников внести свой вклад в это дело. Многие члены кабинета министров и старшие офицеры считают, что Греция должна предоставить технику и людей, чтобы продемонстрировать свою приверженность американским союзникам и антикоммунизму. Однако многие политики и простые греки считают, что страна слишком устала от войны и не должна участвовать в иностранных войнах. Однако после тесных переговоров с членами своей партии и политическими союзниками премьер-министр Греции смог убедить их поддержать греческую интервенцию в Корее. В настоящее время греческие военные совместно с американскими коллегами разрабатывают варианты того, как Греция может внести свой вклад в борьбу с коммунизмом в Корее. Сторонники интервенции говорят, что, как и греки, южнокорейцы являются жертвами коммунистической агрессии, и вполне уместно, чтобы греки пришли на помощь в их отчаянной защите."
 greece.junta.100.d: "[GetNewspaperHeader]В связи с ростом напряженности между левыми и правыми в Греции группа армейских офицеров правого толка во главе с бригадным генералом Стилианосом Паттакосом и полковниками Джорджем Пападопулосом и Николаосом Макарезосом свергла временное правительство и приостановила действие конституции Греции. Что это означает для нации, в настоящее время неясно"
 greece.junta.884.d: "[GetNewspaperHeader]В результате шокирующего поворота событий для греческой политики коммунистические ополченцы заняли несколько городов по всей стране, в первую очередь Афины и Салоники, и свергли временное правительство, провозгласив Греческую Народную Республику."
 greece_bw.1.d: "Мы преуспели в нашей пограничной борьбе с турками и заняли Эдирне"
 greece_bw.2.d: "Мы потерпели неудачу в нашей пограничной борьбе с турками и были отброшены от Эдирне"
 greece_bw.3.d: "Мы преуспели в нашей пограничной борьбе с турками и оккупировали город Стамбул"
 greece_bw.4.d: "Мы потерпели неудачу в нашей пограничной борьбе с турками и были отброшены от Стамбула"
 greece.100.d: "[GetNewspaperHeader]После столкновений с правительством в Турции несколько хорошо вооруженных коммунистических формирований захватили жизненно важные города и регионы страны, в первую очередь Анкару. Хотя эти ополченцы действительно пользуются значительной поддержкой населения, правительственные силы значительно превосходят их по военной мощи и качеству, и еще неизвестно, смогут ли они победить."
 greece.101.d: "[GetNewspaperHeader]Сегодня [GRE.getName] заявила о своей поддержке коммунистов в Турции и напрямую вмешалась в гражданскую войну в Турции, взяв турецкое коммунистическое правительство под свое крыло. Хотя до сих пор до конца не ясно, кто выйдет победителем в этом конфликте, вмешательство Греции, безусловно, склонило чашу весов в пользу коммунистов."
 greece.102.d: "[GetNewspaperHeader]Сегодня, после начала гражданской войны в Турции, [GRE.getName] оккупировала город Стамбул, заявив, что жизненно важный пролив Босфор должен быть временно оккупирован, чтобы гарантировать, что поток торговли из Азии в Европу не будет затруднен. Оба турецких правительства, вовлеченные в гражданскую войну, выразили крайнее недовольство действиями Греции и назвали оккупацию не более чем оппортунистическим захватом земли."
