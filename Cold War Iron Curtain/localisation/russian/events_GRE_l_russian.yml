 cyprus.4.b: "Принять"
 PDG.1.d: "Демократическая Республика Греция (ДРГ) объявила о казни Стефаноса Сарафиса. Сарафис, который командовал генеральным штабом ДРГ во время гражданской войны, был убит по приказу председателя Никоса Захариадиса. Правительство заявило, что Сарафис имел сомнительные связи за рубежом, а его мотивы вступления в ДРГ всегда были подозрительными. Правительство отметило, что Сарафис не был членом партии до войны и вступил в нее только после пленения. Аналитики подозревают, что казнь - это шаг, направленный на укрепление позиций Захариадиса как главы партии и армии."
 PDG.2.d: "После победы Демократической Республики Греции (ДРГ) в недавней гражданской войне новое правительство начало \"красный террор\" по всей Греции. Обвиняемые в сотрудничестве с фашистами во время оккупации странами Оси, сторонники Королевства Греции и те члены партии, чья лояльность вызывает подозрения, подвергаются арестам. Уже есть сообщения о казнях без суда и следствия и о создании новых судов. ДРГ призывает всех греков помочь коммунистической партии выявить предателей и заявляет, что революция может начать процветать только после того, как все внутренние враги будут уничтожены."
 PDG.3.d: "Демократическая Республика Греция (ДРГ) объявила о своем намерении выйти из Варшавского договора. Это знаменует собой серьезный сдвиг в коммунистической партии после захвата партии реформистами во время недавнего заседания Конгресса. Реформисты опасались, что жесткое крыло партии слишком тесно связано с Советским Союзом и проводит политику, которая отталкивает население. Они опасались, что это в конечном итоге приведет либо к насильственному восстанию, либо к тому, что Греция будет втянута в еще одну крупную войну. Советский Союз объявил о созыве экстренного заседания Политбюро для обсуждения ситуации в Греции."
 PDG.4.d: "В результате неожиданных изменений бывший председатель коммунистической партии Никос Захариадис вернул себе контроль над партией. Похоже, что попытка реформистов отойти от Москвы провалилась. Большинство членов коммунистической партии и без того испытывали дискомфорт от нового направления движения из Москвы, но также выступают против реформистской программы. Они считают Никоса Захариадиса лучшей надеждой для зарождающегося коммунистического режима. Захариадис уже отверг новое направление, проповедуемое Советами, и сохраняет приверженность сохранению Греции на истинном революционном пути."
 PDG.5.d: "Советский Союз объявил, что не будет противодействовать решению Демократической Республики Греции (ДРГ) выйти из Варшавского договора. Советские действия будут хорошо восприняты реформистской фракцией, контролирующей в настоящее время греческую коммунистическую партию. Похоже, что Советский Союз хочет отойти от жесткой позиции сталинской эпохи и показать, что он может поддерживать отношения с социалистическими государствами, не входящими в его зонтик. Возможно, Советы также рассчитали, что их действия помогут партии укрепить свой контроль над Грецией. Ответит ли Греция взаимностью и сохранит ли она прочные двусторонние связи, пока неизвестно."
 PDG.6.d: "Известный греческий коммунистический военный и партизанский лидер маршал Маркос Вафеадис взял под контроль партию и Демократическую Республику Греции (ДРГ). Хотя он был известным военачальником, у него были разногласия с бывшим лидером Никосом Захариадисом, и в свое время он был сослан в Москву. Вафеадис считается сторонником независимой Греции и восхищается лидером социалистов Иосипом Тито. Сможет ли он направить Грецию в сторону неприсоединившегося социалистического государства, еще предстоит выяснить."
 PDG.7.d: "Пемьер Харилаос Флоракис, известный коммунистический государственный деятель, взял под контроль коммунистическую партию. Хотя Флоракис был твердым членом партии, по слухам, он был одним из тех, кого больше всего беспокоил жесткий подход Никоса Захариадиса и его фракции. Многие наблюдатели и греки ожидают смягчения политики и более инклюзивного подхода. Его первое заявление после прихода к власти, похоже, подтверждает это, поскольку он призвал всех греков собраться вместе и зажить в мире."
 PDG.8.d: "Демократическая Республика Греция подала заявку на вступление в НАТО. В ходе недавних реформ по всей стране произошла беспрецедентная демократизация. Политическая трансформация правительства и реформы превратили Грецию в государство, несовместимое с Советским Союзом или с тем, что он рассматривает как социалистическое государство. Другим мотивом для вступления в НАТО является опасение, что Советы могут выбрать тайные или даже чрезмерные средства, чтобы остановить новое направление греческого социализма. Многие члены НАТО рассматривают потенциальное включение ДРГ как крупную победу как в стратегическом, так и в политическом плане."
 PDG.9.d: "Демократическая Республика Греция (ДРГ) заявила о своей поддержке антиревизионизма. Греческие коммунисты возмущены недавними действиями Советского Союза по осуждению сталинизма и отходу от его позиций. ДРГ считает, что то, что Советы называют реформами, на самом деле является отходом от революционного социализма в сторону государственного капитализма. ДРГ заявляет, что будет продолжать отстаивать социализм и призывает все социалистические государства оставаться непоколебимыми."
 PDG.10.d: "Демократическая Республика Греция (ДРГ) объявила о том, что многовековая борьба за энозис наконец-то была завершена. Помощь ДРГ оказалась решающей в принуждении Британии к уходу с Кипра и его захвату греками-киприотами. ДРГ также удалось разбить и очистить EOKA от роялистского и духовенского руководства, превратив группу сопротивления киприотов в революционную силу. В ответ на угрозы со стороны Турции ДРГ заявила, что не пойдет на компромисс и не откажется от идеи построения социализма для всех греческих народов."
 PDG.11.d: "Гора Афон, исторический и важный центр монашества греческой православной церкви, была закрыта Демократической Республикой Греция (ДРГ). Гора Афон, остров в северо-восточной части Греции, на протяжении веков была домом для монастырей и монахов. Согласно греческой конституции 1927 года, остров пользовался автономией и управлялся самостоятельно. Однако недавно правительственные войска ворвались на остров и вывезли всех монахов. ДРГ заявила, что освободила остров для народа и устранила коррумпированное влияние церкви. Хотя правительство превозносит свои действия как победу, многие греки, скорее всего, негативно воспримут это прямое нападение на религию."
 PDG.12.d: "Греция открыла свое первое заседание правительства в Константинополе, официально перенеся столицу страны в этот город. Демократическое правительство Греции (ДРГ) получило город и его окрестности после раздела Турции Советским Союзом. Перенос столицы, по-видимому, стал последним шагом в интеграции этих земель. Для греческих коммунистов возвращение Константинополя в качестве столицы символизирует объединение Греции и ее народа под властью социализма."
 PDG.13.d: "Советский Союз выступил с резким осуждением продолжающейся британской оккупации Кипра. Советский Союз отмечает лицемерие Великобритании и ее союзников, призывающих к самоопределению в социалистических государствах, в то время как она открыто подавляет желания кипрского народа. Советское дипломатическое наступление окажет сильное давление на британцев. Советское внимание к Кипру, по-видимому, является ответом на просьбы коммунистической Демократической Республики Греции (ДРГ). ДРГ продолжает выступать за деколонизацию Кипра и его объединение с Грецией. Многие греки чувствуют родство с кипрскими греками, которые составляют большинство населения Кипра."
 PDG.14.d: "Организация Объединенных Наций проголосовала за признание Демократической Республики Греция (ДРГ). Это крупная дипломатическая победа нового коммунистического государства, которое укрепляет свой контроль над страной после ожесточенной гражданской войны. Все социалистические страны проголосовали за принятие Греции, наряду со многими новыми независимыми государствами. Ряд союзников бывшего Королевства Греции либо воздержались, либо проголосовали против принятия в знак протеста."
 PDG.15.d: "Гражданская война в Греции закончилась победой Коммунистической партии Греции. Новый режим быстро объявил о создании Демократической Республики Греции. Это знаменует конец Королевства Греция. Многие социалистические государства уже признали новое правительство, объявив о планах создания или расширения посольств в стране. Союзники исчезнувшего Королевства Греция закрыли свои посольства, но со временем, вероятно, вернутся. Народ Греции с тревогой ожидает, что принесет новый режим."
 PDG.16.d: "Маркос Вафеадис, известный коммунистический лидер греческого сопротивления и военный лидер, был исключен из партии и, как говорят, находится в изгнании. Его отстранение последовало за интенсивным расследованием в отношении лидеров партии. Вафеадиса обвинили в том, что он придерживался несовпадающих революционных взглядов. Из-за угрозы, которую он представляет для внутренней безопасности и революционного пути Греции, он был исключен из партии. Маркос Вафеадис, опасаясь ареста, бежал в Москву, где отрицает выдвинутые против него обвинения. Его исключение серьезно ослабит позиции его сторонников в партии."
 PDG.17.d: "В настоящее время миллионы этнических турок изгоняются из Демократической Республики Греции (ДРГ). Греческие чиновники и войска организуют депортацию тех, кого правительство называет опасной пятой колонной внутри государства. Действия Греции подвергаются широкой международной критике, а турецкое правительство обвиняет ДРГ в создании кризиса беженцев в Анатолии. Греция недавно завладела турецкими землями после раздела страны Советским Союзом."
 PDG.18.d: "После оккупации Измира и Стамбула в результате советского раздела Турции Демократическая Республика Греция (ДРГ) объявила о переименовании этих городов. Измир вернется к своему греческому названию Смирна, а Стамбул станет Константинополем. Греческое правительство утверждает, что это возвращение к исторической норме и что на протяжении веков эти греческие земли были оккупированы турецкими захватчиками. Многие греки приветствуют этот шаг, хотя международное сообщество обеспокоено судьбой турок, все еще живущих в этих городах."
 PDG.19.d: "После неудачной попытки реформистов взять под контроль Коммунистическую партию Греции, председатель Никос Захариадис объявил о казни Чарлиоса Флоракиса. Флоракиса судили за контрреволюционные тенденции и тесную связь с врагами народа. Его смерть укрепила контроль Захариадиса над партией. Флоракис был известным коммунистическим государственным деятелем и одним из основных лидеров реформистского крыла. Реформисты все больше опасаются, что смерть Флоракиса может открыть путь к более широкой чистке в партии."
 PDG.20.d: "Маркос Вафеадис, известный коммунистический сопротивленец и военный лидер, был убит. Демократическая Республика Греция (ДРГ) объявила об этой новости и о своей решимости раскрыть всех причастных к заговору. Подробности убийства не разглашаются. Его взгляды на социализм и создание независимого пути для Греции сделали его противником как внутри партии, так и на международном уровне. Неизвестно, кто из его противников был замешан в этом. Его смерть стала серьезным ударом для его сторонников в партии."
 PDG.21.d: "Премьер-министр Харилаос Флоракис был уволен главой коммунистической партии Маркосом Вафеадисом. Это знаменует собой консолидацию власти Вафеадиса над правящим реформистским крылом партии. Судя по всему, эти два человека поссорились из-за проводимой политики. Эксперты считают, что Флоракис выступал за более инклюзивное, либеральное видение страны, но Вафеадис счел его контрреволюционным и расходящимся. Флоракис, государственный деятель в партии, скорее всего, уйдет в отставку."
 PDG.22.d: "Демократическая Республика Греция (ДРГ) объявила о казни Никоса Захариадиса. Бывшего председателя партии судил специальный суд, который признал его виновным в контрреволюционной деятельности и преступлениях против народа. Никос Захариадис возглавлял партию во время гражданской войны и в первые годы ее существования, однако его жесткая политика оказалась непопулярной среди реформистов и многих греков. Его казнь укрепит позиции нынешнего лидера партии Маркоса Вафеадиса и станет суровым предупреждением для тех членов партии, которые симпатизировали Захариадису."
 PDG.23.d: "Демократическая Республика Греция (ДРГ) сделала важное заявление о принятии титоизма. Греческое правительство считает, что титоизм предлагает более подлинный и эффективный подход к развитию социализма в стране. Это также означает отказ от советской модели. Что еще более важно, ДРГ надеется создать более независимую социалистическую модель и внешнюю политику. Это получит большую поддержку среди людей, которые устали от того, что Греция может оказаться втянутой в будущий международный конфликт."
 PDG.24.d: "Премьер-министр Харилаос Флоракис опубликовал новость о том, что бывший председатель партии Никос Захариадис был выслан из Демократической Республики Греции (ДРГ). Как председатель и лидер во время гражданской войны, Захариадис стремился к жесткой и быстрой социалистической трансформации страны. Однако его политика в значительной степени оттолкнула реформистскую фракцию в партии и многих греков. Его изгнание, вероятно, ослабит его сторонников в партии и проложит путь для дальнейших реформ в стране."
 PDG.25.d: "Народ Греции переживает беспрецедентный период либерализма под руководством премьер-министра Харилаоса Флоракиса. Как лидер коммунистической партии и Демократической Республики Греции, он отошел от жесткого революционного подхода и отменил многие ограничения. Еще до установления коммунистического правления греки долгое время находились под ограничениями, будь то авторитарные лидеры, иностранные оккупанты или условия военного времени. Флоракис умело провел свои реформы, не спровоцировав контрпереворот."
 PDG.26.d: "По сообщениям из Демократической Республики Греция, правительство опустошает свои гулаги. Это последняя реформа премьер-министра Харилаоса Флоракиса. Греческий премьер недавно инициировал ряд либеральных реформ в государстве. Многие греки приветствуют это решение, так как у многих есть близкие, содержащиеся в тюрьмах. Более жесткие члены партии, вероятно, будут расстроены, но пока премьер Флоракис выглядит способным управлять различными фракциями партии."
 PDG.27.d: "Международное сообщество возмущено сообщениями о том, что Демократическая Республика Греция разрушила церковь Панагии Мегалохари на острове Тинос. Церковный комплекс был построен вокруг чудотворной иконы, найденной монахиней девятнадцатого века. Греки посещали святыню на протяжении десятилетий, утверждая, что здесь происходят чудеса. Коммунистическое правительство утверждает, что святыня является фикцией, призванной отравить умы людей и распространить суеверия. Правительство утверждает, что от имени народа конфисковало драгоценности и серебро. Разрушение исторической и символической церкви, вероятно, оттолкнет от нее большое количество греков."
 PDG.28.d: "Новости о \"Секретной речи\" и ее содержание вызвали переполох в правящей коммунистической партии Демократической Республики Греции. Осуждение сталинизма и призывы к реформам по внедрению социализма вызывают споры. Многие коммунистические лидеры утверждают, что советский сдвиг представляет собой отход от социализма. Руководство партии собралось на экстренное совещание. Было решено, что правительство будет дистанцироваться от Москвы, пока оно оценивает последствия этих новых перемен."
 PDG.29.d: "Для многих коммунистов Греческая православная церковь представляет собой институт угнетения и суеверия. Однако церковь остается важной частью жизни многих наших людей. Церковь также пользуется высокой репутацией благодаря своей роли в сопротивлении и независимости Греции. Партия должна решить, как поступить с церковью. Одна фракция считает, что партия должна подавить церковь и покончить с ее опасным влиянием. Другая фракция утверждает, что церковь можно кооптировать в государство, как это делается в других социалистических государствах. Они утверждают, что церковь может стать мощным средством распространения социализма в массах."
 PDG.30.d: "Греческое правительство обратилось к нам за помощью в достижении своей цели - Энозиса, объединения Греции с Кипром. В настоящее время Кипр находится под колониальным управлением Великобритании и сталкивается с сопротивлением со стороны греков, составляющих большинство населения Кипра. Возможно, в наших интересах предложить дипломатическую поддержку, чтобы позиционировать себя как борцов за антиколониализм. Мы также можем предложить дипломатическую поддержку вместе с тайной помощью, чтобы подорвать британцев. Это укрепило бы наши позиции в Восточном Средиземноморье. Однако, если риски реакции Запада слишком высоки, мы можем отклонить просьбу Греции."
 PDG.31.d: "Советский посол сообщил нам, что его правительство не может предложить никакой открытой или тайной помощи для поддержки нас на Кипре. Советское правительство выразило свои симпатии к антиколониальной борьбе, но в настоящее время оно не может принять в ней участие. Это серьезный удар по нашим целям в отношении Кипра. Правительство должно признать, что оно должно поддерживать Кипр самостоятельно. Некоторые в партии открыто сомневаются в нашей приверженности советской линии на международном уровне, если они не хотят помочь нам в таком важном вопросе."
 PDG.32.d: "Советский посол сообщил нам, что его правительство окажет дипломатическую поддержку, чтобы поддержать нас на Кипре. Советское правительство полностью сочувствует антиколониальной борьбе и желанию народа Кипра объединиться с Грецией. Посол добавил, что это преступление, что объединение было отложено веками империализма и капиталистического насилия. Однако советское правительство не может предложить тайную помощь. Это положительный момент, хотя и досадно, что Советы не желают напрямую помогать нашим усилиям. Мы надеемся, что политическое давление, оказанное на британцев, заставит их прекратить оккупацию."
 PDG.33.d: "Советский посол сообщил нам, что его правительство окажет дипломатическую поддержку, чтобы поддержать нас на Кипре. Советское правительство полностью сочувствует антиколониальной борьбе и желанию народа Кипра объединиться с Грецией. Посол добавил, что это преступление, что объединение было отложено веками империализма и капиталистического насилия. Советское правительство также окажет тайную помощь для поддержки освободительных усилий на Кипре. Советский военный атташе и офицер разведки вскоре начнут координировать свои действия с Министерством обороны. Это серьезный толчок для наших усилий по достижению Энозиса."
