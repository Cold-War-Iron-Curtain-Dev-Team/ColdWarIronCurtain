 PDG.38.d: "Сегодня исполняется 10 лет со дня сокрушительной победы ККЕ над белыми в гражданской войне в Греции. В честь этого события Центральный комитет подготовил большой парад, демонстрирующий многочисленные достижения греческого народа за последнее десятилетие. На параде можно увидеть плакат, изображающий восстановление нации, колонны новых основных боевых танков, построенных в Афинах, и потрясающий музыкальный концерт с участием ансамбля имени Александрова. Несмотря на то, что многие проблемы все еще беспокоят страну красного Средиземноморья, сегодня день праздника - греки в стране и за рубежом отмечают новую эру в истории Греции."
 PDG.39.d: "Сегодня в 2:34 утра вблизи острова Крит неожиданно загорелась нефтяная буровая установка \"Димитриос Парцалидис\". На буровой установке, принадлежащей Демократической Республике Греция, произошел критический сбой в одном из нефтесодержащих цилиндров, в результате чего неизвестное количество нефти вылилось в Средиземное море. Полный отказ буровой установки был остановлен только греческими рабочими, сумевшими не дать огню распространиться на место добычи. По оценкам, погибло 10 человек, неизвестное число ранено. Демократическая Республика Греция отказалась комментировать ситуацию, поскольку множество стран по обе стороны железного занавеса требуют ответов."
 PDG.40.d: "В 12:20 утра на нефтяной вышке \"Велушиотис\" (родственной печально известной вышке \"Парцалидис\") произошел катастрофический сбой и взрыв, в результате которого погибло около 24 человек. Пожар был быстро потушен с помощью советского боевого крейсера, находившегося поблизости. Однако вскоре после этого специалисты поняли, что сила взрыва выбила все четыре скважины с места, открыв доступ нефти в Средиземное море. На рассвете океан стал черным, так как миллионы бочек с нефтью хлынули в море. Последствия оказались катастрофическими для дикой природы, поскольку морская экосистема оказалась покрыта илом. Югославия, Италия, Израиль, Турция, Сирия и Египет сообщили о большом количестве зараженной рыбы и требуют скорейшего устранения последствий катастрофы. На данный момент Демократическая Республика Греция вновь отказалась от комментариев, и многие обеспокоены тем, что ККЕ дистанцируется от катастрофы."
 PDG.42.d: "Вчера Демократическая Республика Греция объявила о создании Революционного договора дружбы и труда, который многие окрестили \"Антиревизионистским блоком\". Хотя в настоящее время в него входит только Греция, в ближайшие дни ожидается присоединение многих жестких коммунистических стран. Советский Союз поспешил осудить этот новый пакт как акт агрессии против социалистического единства и мира. Красная Армия уже начала мобилизацию для возможного вооруженного конфликта на Балканах, поскольку к холодной войне присоединилась новая сторона."
 PDG.43.d: "Теперь, когда наша страна стабилизировалась, мы можем начать осваивать богатые воды Средиземноморья. Каждый год рыболовецкие суда возвращаются с большим и большим уловом. Помимо продовольствия, в наших восточных водах были обнаружены большие запасы нефти. Эти богатства должны быть собраны и использованы для улучшения жизни нашего народа."
 PDG.44.d: "В 2:34 утра левый маслозадерживающий цилиндр получил критический отказ и лопнул. Отчет ЛЕЕА пришел к выводу, что причиной стала зажженная сигарета, которая скатилась с платформы технического обслуживания и попала в часть оборудования. Хотя очевидно, что это была прямая причина инцидента, многие в разведывательном сообществе считают, что истинной причиной была переутомленная команда, пытавшаяся достичь все более высоких квот. Многие в партии призывают к скорейшему прекращению массового бурения, в то время как другие уверяют, что это был единичный случай."
 PDG.45.d: "На нефтяной вышке Velouchiotis произошла катастрофа. Из-за сбоя в техническом обслуживании в добываемой нефти образовались воздушные карманы. Одна искра привела к пожару. Мы должны устранить этот беспорядок, пока не стало слишком поздно."
 PDG.46.d: "Небольшой город Ксания на острове Крит стал небезопасен для проживания. Нефть и огонь теперь опустошают побережье, а продовольствие становится все более дефицитным. Мы должны направить все имеющиеся в нашем арсенале корабли, чтобы доставить жителей этого города в безопасное место, пока не стало слишком поздно."
 PDG.47.d: "Недавний кризис с нефтяными вышками подтолкнул рыбаков и экологов к протестам против наших методов добычи ресурсов в Средиземноморье. В частности, экологи считают, что без реформ восточное Средиземноморье станет непригодным для жизни водных организмов. Хотя ЛЕЕА уверяет, что эти акты диссидентства не являются контрреволюционными, они советуют разобраться с протестами скорее раньше, чем позже. По этой причине было создано Министерство охраны окружающей среды, которое будет консультировать планировщиков и поддерживать природную красоту Греции."
 PDG.48.d: "В то время как наши многочисленные экологические реформы увеличили продолжительность жизни греков и резко снизили вероятность катастрофы, эти правила нанесли ущерб производительности. Греческие плановики предупреждают, что дальнейшее снижение производительности труда нанесет серьезный ущерб нашей стране. Мы должны побудить греческий пролетариат работать еще усерднее."
 PDG.49.d: "В течение последних нескольких лет мы ограничивали советское влияние с конечной целью оставить его нашим китайским товарищам. В течение года мы будем достаточно сильны, чтобы покинуть наших советских хозяев и продолжить революцию вместе с Мао. Тем не менее, все большее число умеренных высказывают свою озабоченность по поводу выхода из безопасного Варшавского договора. Хотя Советы иногда навязывали свою волю нашему гордому народу, нельзя забывать об их щедрости в помощи нам в восстановлении. Если повезет, утверждают они, продолжение позитивных отношений с СССР поможет обеим странам и революции."
 PDG.50.d: "Наш новый союз должен расти, если мы хотим превзойти социал-империализм Советского Союза и его марионеток. По всему миру истинные марксисты собираются для нашей совместной борьбы за освобождение и суверенитет. Отправьте призыв к объединенной классовой борьбе."
 PDG.51.d: "Наши греческие товарищи пригласили нас к заключению Революционного договора о дружбе и труде. Хотя мы сходимся во взглядах по многим вопросам и можем многое выиграть от сотрудничества, многие советники предупредили нас, что публичное одобрение этого нового союза поставит нас под угрозу возможной войны с СССР. Что нам делать?"
 PDG.53.d: ""
 PDG.54.d: ""
 PDG.56.d: "Спустя всего несколько дней после основания Антиревизионистского блока Советский Союз и многие страны Варшавского договора объявили о состоянии войны с антиревизионистами. СССР заявил, что \"фанатизм и раскол где бы то ни было - это угроза миру во всем мире\". Советская бронетехника уже вошла на Балканы, и распространились слухи о массовых перемещениях войск Варшавского договора на Дальнем Востоке. КНР выступила с решительным предупреждением, что любая дальнейшая экспансия империализма приведет к войне. Соединенные Штаты призвали к мирному урегулированию и осудили любые военные действия на евразийском континенте. Однако эти решительные слова вряд ли что-то изменят, поскольку Советы перешли на территорию антиревизионистов."
 PDG.55.d: "Коварные греки объявили о создании Революционного договора о дружбе и труде. Эти фанатики являются прямым оскорблением марксизма-ленинизма и мира во всем мире. Мы должны действовать быстро, пока этот новый альянс не получил распространение в странах третьего мира. Были выдвинуты два плана. Первый был предложен Красной Армией. Они предлагают быструю полномасштабную интервенцию Варшавского договора на Балканах и в Восточной Азии. Они считают, что наша превосходная воздушная мощь будет более чем подходящей для огромных людских резервов Антиревизионистского блока. Второй предложенный план исходит от КГБ. Множество доказательств подтверждает утверждение о том, что Антиревизионистский блок внутренне разделен и дезорганизован. Этой дезорганизацией можно легко воспользоваться и с помощью манипуляций настроить кровожадные толпы друг против друга. Можно выбрать только один вариант."
 SRT.1.d: "Сегодня Советское военное правительство в Турции под командованием генерала Павла Батова объявило о формальном создании Социалистической Республики Турция. Генерал заявил, что к концу месяца 100 000 преимущественно тюркских солдат Красной Армии будут выведены из Анатолии, а власть будет передана гражданскому правительству под руководством генерального секретаря Сефика Хусну. Международные наблюдатели по обе стороны железного занавеса ожидают, что переход будет плавным и мирным, поскольку советские солдаты покинут новую страну как завоеватели. США и их союзники могут лишь с ужасом наблюдать, как советский паровой каток захватывает еще одну страну."
 SRT.2.d: "Сегодня мир замер в скорби, когда Социалистическая Республика Турция объявила о внезапной смерти бывшего президента Исмета Инону. Инону был найден мертвым в своей ванной комнате с 7 огнестрельными ранениями. Коммунистический режим уже организовал государственные похороны в его честь. Будучи ярым критиком коммунизма, Инону удивил мир тем, что поддержал Советский Союз как предпочтительного мирового лидера. Было ли это заявление сделано в страхе перед советским возмездием за менее благоприятное одобрение, или в искренней любви к рабочему классу, неизвестно. Это, как и личность убийцы, вероятно, останется загадкой в обозримом будущем."
 SRT.3.d: "Сразу же после смерти Сталина турецкие текстильщики вышли на улицы, требуя повышения заработной платы. На следующий день на протесты вышли хорошо вооруженные сталевары и фермеры из пригородов Анкары. Оказавшись в меньшинстве, советские гарнизоны и турецкая полиция открыли огонь по мирной демонстрации. Затем последовало жестокое восстание, когда турецкие протестующие ворвались в национальный арсенал Анкары. Хотя сначала восстание приветствовалось как триумф свободы и демократии, оно переросло в неорганизованные беспорядки, сопровождавшиеся грабежами и поджогами. Местонахождение генерального секретаря Хусну неизвестно, но ходят слухи, что он бежал из города вместе с остальными членами центрального правительства."
 SRT.4.d: "Впервые за месяц солнце садится в мирной Анкаре. Генеральный секретарь Сефик Хусну объявил всему миру, что в столице страны полностью восстановлен порядок. Стабильность была восстановлена благодаря блестящей тактике и решительности министра пропаганды Гузин Дино и ее друга Назима Хикмета. Эти два художника, ставшие революционерами, обеспечили контроль над городом без единого выстрела, заключая стратегические сделки и идя на уступки отдельным группам бунтовщиков. Успех этой стратегии дал чиновникам ТКП уверенность в себе и позволил выпустить шквал мер по защите прав человека, включая полную свободу забастовок, право на юридическую защиту в суде и возможность выражения критики в адрес турецкого государства."
 SRT.5.d: "Не прошло и недели с начала беспорядков, как в Анкару вернулась стабильность. Генеральный секретарь Сефик Хусну объявил миру, что порядок в столице страны полностью восстановлен. Скорость, с которой был совершен этот подвиг, можно отнести исключительно на счет громилы Хусну, Севкета Сурейи Айдемира. Известный своим коллегам как идеологический фанатик и герой турецких националистов, Айдемир приобрел у жителей Анкары новую репутацию мясника. Всего через несколько дней после начала беспорядков Айдемир обрушил на диссидентов всю мощь турецкой армии. Сообщения о беспорядочном обстреле быстро переросли в систематические и массовые казни по всему городу. Хотя в город вернулась стабильность, многие спрашивают: ”Какой ценой?\""
 SRT.7.d: "Многие думали, что политическая карьера Исмета Инону закончилась после захвата Турции Советским Союзом. Однако сегодня эти убеждения оказались ошибочными, когда бывший президент и герой войны за независимость выступил с речью перед народом Турции, заявив, что их любимая национальная икона вернулась, чтобы снова руководить ими. Хотя, по слухам, внутренняя политика остается такой же, как при старом режиме, правительство Инонуса уже начало процесс “десоветизации”, который включает в себя изгнание всех советских войск, восстановление турецкого национализма и разрыв дипломатических отношений с Москвой и восточным блоком. Ясно, что недолговечная коммунистическая эпоха в Турции подходит к концу, однако по обе стороны железного занавеса остается один вопрос: “Что теперь будет с Турцией?”"
 SRT.8.d: "Сегодня по всей Турции толпы людей вышли на улицы в знак празднования того, что харизматичный поэт, ставший революционером, Назым Хикмет был объявлен вторым генеральным секретарем ТКП. После беспорядков в Анкаре Назым Хикмет стал национальным героем, что дало ему легитимность для консолидации власти. В кратком обращении к нации Хикмет пообещал дальнейшую культурную либерализацию, а также прекращение принудительного труда и отмену всех ограничений в области искусства. Международная реакция на новые события была самой разной. Никита Хрущев с энтузиазмом поздравил нового турецкого генсека, а Мао Цзэдун и Энвер Ходжа предупредили, что ослабление пролетарской дисциплины приведет к консолидации реакционного бюрократического класса. Однако на данный момент Социалистическая Республика Турция остается сильной страной с многообещающим будущим."
 SRT.9.d: "Сегодня Турция испытала шок, когда ТКП исключила Исмета Инону из коммунистической партии за \"отсутствие когнитивных способностей для выполнения сложных задач\". В медицинском заключении, просочившемся в прессу, у Инону был обнаружен IQ всего 84, опухоль в коре головного мозга и тяжелый случай шизофрении. Многие турки не верят в ошеломляющее падение бывшего президента. По другую сторону \"железного занавеса\" многочисленные правозащитные и медицинские организации осудили доклад, заявив, что тест \"скорее всего, был сфабрикован и намеренно просочился в прессу\". Турецкое правительство отрицает эти утверждения и заявляет, что их действия по удалению Инону от общественности были выбором, чтобы \"защитить его от самого себя\". "
 SRT.10.d: "Сегодня и восток, и запад с нервным предвкушением наблюдали за тем, как Севкет Сурейя Айдемир объявил, что \"турецкий пролетариат одержал победу над реакционными элементами ТКП\". Айдемир, давний марксист-националист, впервые заявил о себе во время беспорядков в Анкаре, где его жестокие и систематические репрессии в городе принесли ему прозвище \"Мясник Анкары\". В настоящее время нацию сотрясает смесь революционного рвения и паники. Москва отказывается комментировать ситуацию в Анатолии, однако международные наблюдатели подтвердили сообщения о том, что советский Черноморский флот направляется в небольшие прибрежные города вдоль турецкой границы, чтобы эвакуировать туристов из стран Восточного блока вместе с турецким гражданским населением. "
 SRT.11.d: "Официальные лица Социалистической Республики Турция официально объявили о выходе Турции из Варшавского договора. Для новой турецкой администрации направления Москвы и Анкары стали несовместимыми. Немногочисленные советские и греческие гарнизоны в Анатолии были эвакуированы, а Красная Армия приведена в состояние готовности на случай, если уходящим войскам будет причинен какой-либо вред. Хотя многие в Турции опасаются советского вмешательства, многие отмечают, что размеры и география республики окажутся слишком дорогостоящими для любых советских действий."
 SRT.12.d: "Удивительные новости пришли из красной Турции: министр пропаганды Гузин Дино объявил, что Верховный Совет Турции принял несколько законов о правах гомосексуалистов. Теперь социалистическая республика позволит судам разрешать однополые союзы, отменит дискриминацию по половому признаку в религиозных учреждениях и, наконец, разрешит открытым гомосексуалистам участвовать в рядах ТКП и Национальной рабочей армии. Этот закон привлек внимание к обсуждению вопросов сексуальности во всем Восточном блоке, и многие ожидают, что \"весна квиров\" прокатится эхом по всему социалистическому миру, поскольку многие геи получат возможность высказаться."
 SRT.14.d: "Курдская демократическая республика (КДР) провозгласила свою независимость. Турецкая Социалистическая Республика и Советский Союз согласились с требованием курдов о создании нового курдского социалистического государства. Новое правительство объявило, что начнет новую эру социалистического развития и процветания курдского народа. Оно также обещало братские отношения со всеми социалистическими государствами, особенно со своими соседями. Региональные государства, особенно те, где проживает большое курдское меньшинство, выражают опасения, что КДР может стать громоотводом для нестабильности."
 SRT.17.d: "Сегодня премьер-министр Турции Инону выступил с пламенной речью в небольшом турецком городке на границе с Советским Союзом. В своей речи премьер заявил, что “земли Константинополя, Эрзурума, Западной Анатолии и Кавказских гор должны находиться под властью законных правителей Анатолии”. В ответ на эту пламенную речь Советская Красная Армия и греческая НОАК (Народно-освободительная армия Греции) были приведены в готовность. В опровержении, типичном для нового советского премьера, Никита Хрущев предупредил, что “армии стран Варшавского договора вполне способны защитить свою родину от варварских захватчиков… Мы не просто остановим вас, мы уничтожим вас”. В качестве прямого ответа на Инону Советский Союз также закрыл жизненно важный нефтепровод Баку-Адана и потребовал вернуть все долги к концу месяца. Учитывая такое развитие событий, вполне вероятно, что смелые слова премьера Инону ранили Турцию в ногу."
 SRT.18.d: ""
 SRT.19.d: "Сефик Хусну, лидер гражданского правительства Турции и генеральный секретарь ТКП, объявил всему миру, что бывшая Османская империя и родина большинства турецких граждан несет ответственность за \"деяние, слишком отвратительное для того, чтобы его мог не заметить настоящий социалистический народ\". Сорок лет назад на землях Турции турки устроили геноцид армянского и греческого пролетариата. Это событие позже будет названо Геноцидом армян. Хусну упомянул \"Auferstanden aus Ruinen\" (Восточногерманский национальный гимн) и сказал, что, как и ГДР, весь турецкий народ должен работать над тем, чтобы \"свет мира сиял, чтобы мать никогда больше не оплакивала своего сына\". В дополнение к словам Хуснуса турецкие руководители местных органов власти воздвигли памятники сотням тысяч безымянных жертв империалистической жестокости."
 SRT.20.d: "По сообщениям из Турции, Советский Союз недавно конфисковал золотые запасы страны. Советы утверждают, что конфискация произведена для защиты турецких резервов от потенциальных враждебных угроз и в качестве компенсации за масштабную советскую поддержку. Один советский чиновник спокойно отметил, что их правительство предоставляло золото республике в первые годы ее существования и имеет право на эти резервы. Турецкое и советское правительства стремятся замолчать эту новость. По мере распространения новостей ожидается, что многие турки будут отчуждены этим действием, хотя неизвестно, отреагируют ли они публичными протестами. Правительства западных стран уже выступили с заявлениями, осуждающими эти действия."
 SRT.21.d: "Одной из главных проблем оккупации является сдача в плен колонн трусливых реакционных турецких войск. В настоящее время они содержатся во временных центрах содержания по всей Анатолии и на Кавказе, не имея ни пищи, ни воды. Многие дивизии организуются, а тайники с советским оружием исчезают все чаще и чаще. Этот вопрос должен быть решен быстро. Мы должны спросить товарища Сталина, что делать."
 SRT.22.d: "Советское оккупационное правительство в Турции поставило перед нами насущный вопрос о турецких военнопленных. После обсуждения Политбюро предложило два возможных решения. Первое - это повторение наших действий в Великой Отечественной войне. Подобно немецким и японским военнопленным, турецкие военнопленные будут заняты на работах по восстановлению нашей великой страны. Хотя это и заманчиво, но может оттолкнуть турецкий пролетариат от нашего великого социалистического эксперимента. Второй вариант - отправить домой и переоснастить турецкую армию для борьбы за рабочий класс. Несмотря на дороговизну, этот план гарантированно покорит турецкий народ и продемонстрирует всемогущество товарища Сталина."
 SRT.23.d: "Пока артиллерийские орудия молчат, насилие по-прежнему терзает Анатолию. Как турецкие головорезы, так и, к нашему стыду, храбрые солдаты Красной Армии притесняют многочисленное греческое меньшинство в этом районе. Для защиты греков были направлены комиссары, но очевидно, что необходимо более постоянное решение. Мы должны посоветоваться с товарищем Захариадисом."
 SRT.24.d: "К нам пришли новости из недавно освобожденной Турции. Советское оккупационное правительство просит нашей помощи в поддержании мира между греками и турками. Нам были предложены два плана. Первый предусматривает спасение наших греческих товарищей и поселение их в недавно освобожденном Константинополе. Это даст нам значительный прирост населения и превратит нашу новую столицу в греческий город. С другой стороны, многие считают, что наш долг - оздоровить отношения с турецким народом. Второй план предполагает проведение массированной пропагандистской кампании, направленной на укрепление единства между нашими двумя социалистическими нациями. Возможно, в интересах трудящихся, чтобы мы протянули оливковую ветвь и сделали Анатолию мирным местом для всех народов."
 SRT.25.d: "Наше оккупационное правительство столкнулось с большой проблемой. Ранние кампании коллективизации продемонстрировали системное предубеждение против армян. Это предубеждение выплеснулось наружу вчера, когда несколько армянских турок, а также 7 товарищей из 390-й стрелковой оккупационной дивизии (состоящей в основном из армян) были найдены зверски замученными до неузнаваемости. Очевидно, что необходимо что-то сделать для обеспечения безопасности как людей, так и наших солдат. На данный момент в Москву отправлена телеграмма с просьбой оказать содействие."
 SRT.26.d: "Начали поступать сообщения о насилии в отношении наших армянских товарищей в Анатолии. Необходимо что-то предпринять. Ввиду природы и сложности региона, только два варианта представляются осуществимыми. Первый вариант предполагает отправку армянских турок в недавно завоеванные регионы Армянской ССР. Это, как мы надеемся, укрепит наши позиции в новом регионе и даст всем армянам безопасное место для жизни. Хотя это, возможно, более эффективно, мы бы не решили проблему, а просто отбросили бы ее на задний план. Второй вариант - идти на полном ходу к социалистическому единству. Такие действия, как предложение армянам большего представительства в правительстве, принудительная диверсификация рабочих мест, и, что самое спорное, приказ турецкому гражданскому правительству признать Геноцид армян."
 SRT.27.d: "После завоевания и освобождения Анатолии промышленная база исчезнувшего турецкого государства простаивала по всей стране. Командиры Красной Армии пытались запустить турецкую промышленность в попытке восстановить отношения с гражданским населением, но эти попытки в основном заканчивались неудачей. Мы должны придумать, что делать, пока драгоценная промышленность не проржавела на ветру. К счастью, Москва сообщила нам, что в данный момент они занимаются разработкой постоянного решения."
 SRT.28.d: "В условиях, когда реакционное турецкое государство разрушено, его промышленность созрела для захвата. Многие в Кремле, включая перспективного Косыгина, считают, что, как и в Германии, турецкая промышленность должна быть передана на хранение в СССР. Однако Павел Батов, командующий оккупационным правительством, лично написал товарищу Сталину письмо с выражением необходимости использовать мощь Советского Союза для создания нового турецкого государства. Хотя это и требует больших затрат, он считает, что это быстро снизит враждебность между турецким населением и социалистическим правительством, что приведет к более стабильной стране в будущем."
 SRT.29.d: ""
 SRT.30.d: "В связи с ухудшением здоровья товарищ Сефик Хусну объявил, что он уходит с поста генерального секретаря ТКП и проведет последние несколько месяцев своей жизни на даче на берегу Черного моря. Вместо него Политбюро взяло на себя полный контроль над нацией. Перед своим уходом товарищ Хусну потребовал создания плюралистического руководства, \"основанного на ценностях компромисса и солидарности\". Несмотря на его требование, очевидно, что линии борьбы уже прочерчены. Крайне справа от политбюро находится фракция TKP-CHP, возглавляемая камалистами, верными предыдущему режиму. Они твердо убеждены, что Турция должна порвать с международной борьбой рабочих и придерживаться позитивного нейтралитета. В центре находится фракция истеблишмента ТКП, возглавляемая верными Москве хрущевцами. Они считают, что будущее Турции - в солидарности с нашими товарищами по Варшавскому договору. Наконец, на крайнем левом фланге находится фракция ТКП-МЛ, возглавляемая фанатичными турецкими националистами и антиревизионистами. Их видение Турции - это самодостаточное социалистическое государство с упором на технологический прогресс и идеологическую верность. Хотя официально все фракции работают вместе, очевидно, что в ближайшие месяцы останется только одна."
 SRT.32.d: "После внезапной смерти генерального секретаря Назыма Хикмета его правая рука Гузин Дино возглавила \"Красную Турцию\". Выдающаяся писательница и теоретик феминизма в старой республике, Дино прошла путь до министра пропаганды, где стала любимицей Хусну и Хикмета. Теперь, став лидером Турецкой социалистической республики, Гюзин Дино планирует сохранить нормы турецкой внешней политики и продолжить либерализационные движения, начатые Хикметом. Заявления из Москвы и более широкого восточного блока, хотя и приглушенные, скорее положительные, чем отрицательные, поскольку многие члены Варшавского договора поздравляют нового генсека. Будущее Турции, хотя оно всегда находится в воздухе, скорее всего, будет состоять из реформ внутри страны и экспансии за рубежом."
 SRT.33.d: "После внезапной смерти генерального секретаря Назыма Хикмета, глава Народных комиссаров Исмаил Билен взял на себя руководство Красной Турцией. Теперь Билен является лидером Турецкой Социалистической Республики и планирует нормализовать общество и принести стабильность турецкому народу. Это, вероятно, повлечет за собой откат от либеральных реформ Хикмета, зажим независимых новостных организаций и восстановление связей с арабским миром. Новости о таком развитии событий были с радостью встречены как в Москве, так и в Каире, поскольку Анкара продолжает придерживаться советской линии."
 SRT.34.d: "Сегодня на ступенях Революционного народного комплекса в Анкаре пролилась кровь в результате столкновения офицеров, верных фракции ТКП-МЛ, с сотрудниками Секретной службы. Хотя офицерам удалось прорвать внешнюю оборону здания столицы, они были отбиты местным гарнизоном после того, как политбюро смогло связаться с Рабочей армией Турции. В настоящее время генеральный секретарь ТКП объявил розыск, потребовав, чтобы все заговорщики были доставлены в Анкару за \"высокие преступления против турецких рабочих и государства\". После решительного поражения переворота восточный блок вздохнул с облегчением, поскольку советский коммунизм остался в Анатолии."
 SRT.35.d: "Сегодня офицеры, верные фракции ТКП-МЛ, ворвались в здание столицы Турецкой Социалистической Республики. Несмотря на ожесточенную защиту со стороны турецкой секретной службы, офицеры смогли прорвать все оборонительные сооружения и передать в эфир сообщение об успехе переворота. Во главе с председателем Ибрагимом Кайпаккая революционеры поклялись покончить с советским культурным империализмом и вернуть Турцию рабочим и крестьянам. Мао Цзэдун и Энвер Ходжа поздравили новый режим в Турции и надеются укрепить связи с Кайпаккайей. Москва, с другой стороны, осудила этот акт как незаконный и потребовала жестких санкций со стороны международного сообщества."
 SRT.36.d: "Вчера вечером элементы турецких экспедиционных сил пересекли границу САР, чтобы защитить своего союзника от \"сионистской агрессии\". Хотя наземные силы еще не представлены в значительном количестве, турецкие рабочие ВВС были развернуты в большом количестве и сейчас ведут перестрелку с израильскими пилотами. Западные страны осудили эти действия и, вероятно, обратятся в ООН с просьбой о вмешательстве. Хотя Советский Союз хранит молчание по поводу разворачивающейся ситуации, вполне вероятно, что он полностью поддерживает вмешательство Турции. Это развитие событий представляет собой сейсмическую эскалацию на Ближнем Востоке по мере того, как часы приближаются к полуночи."
 SRT.37.d: ""
 SRT.38.d: ""
 SRT.39.d: ""
 KRD.1.d: "Премьер-министр КДР Ахмед Тофик опубликовал заявление, в котором призвал все народы курдского происхождения мигрировать в новое курдское государство. Он выразил потребность в рабочей силе и технических знаниях для продвижения нации в будущее. Тофик пообещал трудоустройство, бесплатное жилье, гарантированную чистую пищу и воду, а также защиту от империализма и экономической эксплуатации. Уже сейчас курды со всего мира вдохновились и толпами покидают земли Ирака, Ирана и Сирии, направляясь в свои новые дома. Ожидается, что к концу года население КРД увеличится в три раза."
 KRD.2.d: "Шокирующие новости пришли из Демократической Республики Курдистан, поскольку премьер-министр Ахмед Тофик публично выразил свое презрение как к Социалистической Республике Турция, так и к Генеральному секретарю Хусну. Тофик заявил, что “ущерб, нанесенный турками курдскому народу, является непростительным пятном на регионе и может оправдать только дипломатическую изоляцию от нового курдского государства”. Его заявление было поддержано отъездом курдских дипломатов из Турции и замораживанием всех государственных коммуникаций. Заявление Тофика вызвало шоковую волну в Восточном блоке и во всем мире, поскольку многие ставят под сомнение природу Советского Союза и его силу. Это заявление также сильно разозлило как Анкару, так и Москву, которые поспешили осудить заявления Тофика как “реакционные” и “ребяческие”, однако, скорее всего, никаких действий против маленькой изолированной нации предпринято не будет."
 KRD.3.d: "Курдская Демократическая Республика сталкивается с масштабной засухой на всей своей территории. Существуют опасения, что если засуха не закончится в ближайшее время, страна может столкнуться с острой нехваткой продовольствия и голодом. Экономика КДР в значительной степени связана с сельским хозяйством, поэтому кризис грозит вызвать экономическую депрессию. КДР призывает союзников-социалистов вмешаться и оказать поддержку зарождающемуся государству. Однако кризис рассматривается критиками как подтверждение, которые утверждают, что КДР в ее нынешнем виде не является устойчивой."
 KRD.4.d: "Курдская демократическая республика (КДР) объявила о планах воссоединения с Турецкой социалистической республикой. КДР отметила, что новое соглашение сохранит курдскую автономию и позволит обоим народам жить вместе в рамках справедливого социалистического государства. Турецкое правительство приветствовало эту новость и планирует провести церемонию объединения в столице. Аналитики считают, что КДР приняла это решение после экономических и политических трудностей, с которыми она столкнулась после обретения независимости. Это решение было положительно воспринято соседними государствами с курдскими меньшинствами, которые считали, что КДР представляет собой дестабилизирующую силу."
 KDR.5.d: "Курдская Демократическая Республика (КДР) подтвердила сообщения о том, что ее заявка на вступление в состав СССР была принята. Советское правительство приветствовало эту новость и объявило о планах принять курдских лидеров в Москве на официальной церемонии. Решение КДР во многом обусловлено последствиями ее борьбы с недавней засухой. Руководство КДР и Советский Союз согласились с тем, что бездействие может привести к экономическому или политическому коллапсу. На международном уровне этот шаг осуждается Западом как расширение советского империализма, но приветствуется большинством социалистических и просоветских государств."
 KRD.6.d: "Удивительные новости пришли из КДР - страна осудила марксистско-ленинскую доктрину в регионе. Хотя премьер-министр Ахмед Тофик признался в личной любви к советскому коммунизму быстрого индустриального развития, он признает, что количество рабочей силы и ресурсов, необходимых для этой системы, привело страну к экономической и экологической катастрофе. Премьер заявил, что целью Курдистана будет \"приведение нации в состояние нормализованной святости\". На практике это означает восстановление племенной функции, снижение политических репрессий и крайнюю децентрализацию. По сути, Курдистан вернется к дореволюционному феодальному государству, управляемому коммунистической партией. Москва осудила эти действия, но Тофик заверил, что Курдистан останется верным Кремлю, одновременно медленно создавая инфраструктурную базу, необходимую для быстрой индустриализации."
 KRD.7.d: ""
 KRD.8.d: "Курдская Демократическая Республика столкнулась со второй масштабной засухой. Первая засуха вызвала массовый дефицит продовольствия и значительно дестабилизировала экономику. Новая засуха угрожает дальнейшим экономическим спадом и вызывает опасения за политическую стабильность государства. КДР уже обратилась за помощью для преодоления кризиса. Однако даже массированного притока помощи может оказаться недостаточно. Некоторые в правительстве тихо предполагают, что КДР, возможно, придется искать альтернативное решение. Советские чиновники, как говорят, сильно обеспокоены будущим социалистического проекта в КДР."
 KRD.9.d: "Вчера регионы Мухабад и Южный Азербайджан в Иране были потрясены, когда стаи курдских беженцев хлынули через границу. Хотя Иран выразил сочувствие курдским беженцам, шах Пехлеви заявил, что Иран не в состоянии разместить полмиллиона беженцев. Это утверждение вскоре подтвердилось, когда акры земли были оголены голодными курдами. На вопрос о том, почему так много курдов бежало от коммунистического режима, иранские и ооновские исследователи встретили стену молчания, так как ни один курд из примерно полумиллиона беженцев не заговорил. Хотя известно не так много, две вещи стали ясны. Северный Иран погрузился в полную анархию, а коммунистический режим КДР, должно быть, ужаснее, чем кто-либо мог предположить."
 KRD.10.d: "Шокирующие новости потрясли мир: впервые с 1945 года советские границы расширились. То, что когда-то считалось отступлением из Курдистана, оказалось уловкой. Волны курдских \"беженцев\", хлынувшие в Иран, были не бегством, а расширением коммунизма. Дестабилизация, которую принесла быстрая иммиграция, сделала невозможной скоординированную оборону Ирана, и земли были быстро захвачены совместными курдско-советскими силами. Несмотря на очевидное пренебрежение международным правом со стороны Советского Союза, большая часть вины была возложена на ООН, которая не смогла вовремя организовать ответные действия. Полный провал международного права поставил под сомнение жизнеспособность Организации Объединенных Наций в деле поддержания мира во всем мире. Последствия некомпетентности, проявленной как ООН, так и Ираном, можно легко продемонстрировать на примере колонн советской бронетехники, катящихся по Тебризу. На данный момент невозможно предсказать последствия, однако одно можно сказать наверняка. Советские сапоги, скорее всего, никогда не покинут север Ирана."
 KRD.11.d: "Шокирующие новости потрясли мир: Красная Армия была остановлена в Иране. Всего несколько дней назад Советский Союз вместе с КДР предпринял внезапное нападение на иранские войска в Южном Азербайджане. Хотя волны курдских беженцев дестабилизировали регион, иранские части мужественно защищали свою родину и разгромили совместное советско-курдское вторжение, захватив в процессе множество сверхсекретного и экспериментального оружия. Советский Союз и Варшавский договор стали международным посмешищем, многие сравнивают действия СССР в этом сражении с Зимней войной. Мало что известно о том, что происходит в Кремле, однако есть подозрения, что многие офицеры были освобождены от службы и идет переоценка советской доктрины. Известно лишь то, что земли Ирана останутся иранскими в обозримом будущем."
 KRD.12.d: "Сегодня Демократическая Республика Курдистан была принята в Организацию Объединенных Наций. Многие критикуют ООН за предоставление еще одного места коммунистической стране, однако ООН считает, что приглашение новых членов укрепит ее власть и поможет гарантировать международный мир. Курдская Демократическая Республика и Советский Союз с энтузиазмом поддержали вступление нового государства в ООН, и вполне вероятно, что больше частично признанных государств смогут вступить в Организацию Объединенных Наций."
 KRD.13.d: "Хотя у нас наконец-то есть государство, люди, населяющие его, покрыты шрамами от воспоминаний о геноциде и репрессиях со стороны персов и арабов. Пришло время им признать ущерб, который они нанесли нашему народу. В Иран и Ирак было направлено письмо с призывом возместить ущерб как нашему великому народу, так и предкам тех, кого обидели империалистическая эксплуатация и расизм."
 KRD.14.d: "Новое курдское государство потребовало от нашей страны выплаты репараций своему народу. Хотя у нас, несомненно, есть возможность выплатить их в полном объеме, и, возможно, имеет стратегический смысл развивать позитивные отношения с нашим новым соседом, преклонение перед любым курдским государством - это ниже нашей нации. Что же нам делать?"
 KRD.15.d: "Хотя наш могучий народ Курдистана освободился от империализма и эксплуатации, большая часть нашей земли все еще находится под гнетом чужих сапог. Волею судьбы часть этой земли оказалась в руках наших товарищей в Советском Союзе. Хотя на эту землю претендует Армянская ССР, провинция Эрзурум по праву принадлежит курдам. В связи с этим в Москву было направлено письмо, призывающее СССР передать Эрзурум курдскому народу."
 KRD.16.d: "Наши курдские товарищи обратились к нам с интересным предложением. Во имя социалистического единства и справедливости они просят передать Эрзурум из состава Армянской ССР в состав Курдской Демократической Республики. Хотя мы с удовольствием поможем нашим курдским товарищам в освобождении их нации, у нас тоже есть планы в отношении этой вновь приобретенной земли. Что следует предпринять?"
 KRD.17.d: "Сегодня - день гордости для социализма и курдского народа. Государство Эрзурум вместе с его народом и промышленностью полностью возвращено законным владельцам. Наш народ уже празднует на улицах, как растет наша нация. Трижды ура нашим советским товарищам, трижды ура товарищу Ахмеду Тофику и трижды ура Курдистану!"
 KRD.18.d: "Сегодня мрачный день для курдско-советских отношений. Хотя Советский Союз симпатизирует нашему делу освобождения всех курдов, в письме из Москвы говорится, что Эрзурум теперь по праву принадлежит Советскому Союзу. Этот упадок научил нас тому, что наши \"союзники\" в Советском Союзе больше не заботятся о нас. Теперь мы должны сами работать над тем, чтобы стать ярким примером могущества всего курдского народа."
 KRD.19.d: "То, что начиналось как обычный сухой сезон, вышло из-под контроля и превратилось в одну из самых страшных засух в истории. Каждый день рабочие заводов, матери и дети умирают на работе от обезвоживания. Сообщения о доброкачественных заболеваниях фермеров, доведенных до клинического вампиризма, становятся обычным явлением. Несмотря на все наши усилия, и Социалистическая Республика Турция, и Советский Союз не в состоянии передать нашей стране достаточное количество воды. Что-то нужно делать быстро, иначе никого не останется."
 KRD.21.d: "Генеральный секретарь СРТ Сефик Хусну написал открытое письмо нашему народу. В своем письме он призывает ради курдского народа отказаться от суверенитета и присоединиться к Турции в качестве автономной области или к Советскому Союзу в качестве ССР. Если мы согласимся, он обещает, что вся мощь как советского, так и турецкого государства будет направлена на то, чтобы помочь курдскому народу выжить и в конечном итоге восстановить регион, превратив его в красный оазис. Если мы согласимся, мы обеспечим безопасность нашего народа ценой нации, за освобождение которой мы боролись столетиями."
 KRD.22.d: "Хотя предыдущие реформы обеспечили нам больше воды, засуха снова будет сеять хаос на наших землях. Этот факт привел нас к мысли, что единственным постоянным решением является расширение. Хотя в регионе много заманчивых целей, военное командование выбрало озеро Орумиех в Иране из-за его близости к Вану и высокой численности курдского населения. Хотя Иран является важной марионеткой Соединенных Штатов, мы твердо уверены, что у США не хватит духу начать ядерный арсенал из-за небольшого озера на полпути через весь мир. Несмотря на это, наш план основан на участии Варшавского договора в дипломатическом сдерживании любого ответа, а также на советском отвлекающем ударе в Южном Азербайджане. До дня вторжения нашими целями будут препятствовать эффективности ООН и дестабилизировать Иран."
 KRD.23.d: "Наконец-то чистая вода течет как из наших рек, так и из наших раковин. Зелень возвращается в нашу великую страну, и впервые в глазах людей появилась жизнь. При этом большинство не питает иллюзий по поводу того, что кошмар может вернуться. Должна произойти смена курса. Некоторые в партии считают, что наша неудача заключается в том, что мы недостаточно активно взялись за индустриализацию Курдистана. Хотя новые заводы и сельскохозяйственные угодья способствовали засухе, именно отсутствие инфраструктуры не позволило оказать должную помощь. Однако многие в партии считают, что мы были обречены в тот момент, когда был построен первый заводской комплекс. Они предлагают прекратить все усилия по индустриализации и вернуться к дореволюционному образу жизни. Хотя оба варианта представляют собой верные пути, выбрать можно только один."
 KRD.24.d: "Хотя мы дестабилизировали Иран и затруднили любую возможность эффективного контрнаступления, самая важная часть операции остается. Настало время проинформировать Советский Союз о наших намерениях."
 KRD.25.d: "Сегодня мы получили граничащее с безумием предложение от Курдской Демократической Республики. Хотя информаторы КГБ сообщали о наращивании военного присутствия в курдском государстве, никто этого не предсказывал. Из-за нехватки воды курды выразили желание, чтобы мы вступили в военные действия с Ираном (главным союзником США) и обеспечили озеро Орумие для их народа. Многие в Кремле уже отвергли эту нелепую идею. Если мы поможем вторжению, мы рискуем ввергнуть мир в ядерный ад. Однако, если мы согласимся, курды пообещали, что провинция Южный Азербайджан будет легкой добычей. Они также гарантируют, что из-за их усилий по дестабилизации Иран будет не в состоянии организовать оборону региона. Красная Армия заверила, что в течение недели 6 дивизий могут быть призваны для возможного вторжения. Можно сделать один выбор, и мы должны выбрать мудро."
 KRD.26.d: "Отличные новости из Советского Союза. В данный момент шесть лучших дивизий Красной Армии мобилизованы на южной границе. Хотя они открыто не заявили о советском участии, мы с полной уверенностью считаем, что наше вторжение будет дополнено советской бронетехникой. Победа в этой борьбе практически гарантирована, поскольку последние планы завершены. Теперь это только вопрос времени..."
 KRD.27.d: "Ужасные новости из СССР. Советы не только отказались помочь нам в любом вторжении в суверенную страну, они также потребовали нашей полной демобилизации. Хотя многие курдские военные хотят действовать самостоятельно, широко признано, что озеро Орумие останется вне нашей власти."
 KRD.28.d: "Сегодняшний день требует празднования, товарищи. Мы празднуем освобождение Северного Ирана от империализма с пищей в животе и водой в кружках. Мы не только обеспечили будущее курдского государства, но и продемонстрировали истинную мощь армии рабочего класса. Пока мы говорим, трусливые иранцы отступают с нашей законной земли, поджав хвосты. Вероятно, этот день, а также герои, которые сделали его возможным, будут увековечены в сердцах и умах всех патриотически настроенных курдов."
 KRD.31.d: "Сегодня над городом Аль-Хасака был поднят курдский триколор, поскольку Курдская демократическая республика взяла под контроль все курдские земли на севере Сирии. Это событие произошло после заключения военного и экономического пакта между КДР и САР. В обмен на передачу всех регионов с курдским большинством Курдистан (и СССР) согласились финансировать развитие инфраструктуры в Сирии, соединяя Варшавский договор с ее арабским союзником. В дополнение к этому Курдистан согласился выступить на стороне САР в любой оборонительной войне против Израиля или США. Это соглашение, хотя и популярное среди тех, кто находится в Каире и Ване, возмутило многих в сирийских провинциях, которые считают, что это соглашение было заключено для дальнейшего ослабления их влияния на республику."
 KRD.33.d: "Вчера шейх Ахмед Тофик мирно скончался в своем кабинете в 22:50. Хотя быстро распространились слухи об убийстве, Курдская рабочая партия объявила официальной причиной смерти аневризму головного мозга. Новость о смерти первого курдского премьера потрясла всю страну, и, несомненно, будут организованы государственные похороны. Что касается будущего курдского руководства, известно немного. Однако, скорее всего, бразды правления перейдут либо к министру иностранных дел Даре Тауфику, либо к главному идеологу Седигу Камангару."
 KRD.34.d: "Сегодня иракско-курдская война резко обострилась, поскольку силы Курдской демократической республики выступили на стороне курдских повстанцев. Хотя военные действия были предсказаны аналитиками CENTO и НАТО, курдам удалось скрыть истинный масштаб своей предстоящей военной операции. В 3:20 утра Курдская рабочая красная армия начала разрушительный артиллерийский обстрел, который сокрушил передовую оборону Ирака. Это совпало с авиаударами в Багдаде, Мосуле и Аль-Фаллудже, которые вывели из строя иракское высшее командование и важные военные логистические сети. Два часа спустя курдские бронетанковые дивизии прорвались через северный Ирак, обойдя немногие уцелевшие оборонительные позиции. Хотя неизвестно, сможет ли Курдистан удержать инициативу в ближайшие месяцы, ясно, что Ирак был застигнут врасплох и не готов к такому наступлению."
 KRD.36.d: "К разочарованию международного сообщества, милитаристский коммунист Седиг Камангар был избран премьер-министром Курдской демократической республики. Считающийся архитектором идеологии РПК, Камангар упорно боролся под руководством Тофика за то, чтобы обеспечить КДР как можно больше земли и гарантировать мощное будущее своему народу. В своих речах и телеобращениях к нации Камангар решительно осуждал призывы Москвы к сосуществованию с другими государствами региона. Кроме того, он выступал против советских войск в регионе, заявляя, что \"турецкий сапог заменили на русский\". Международное сообщество, и в частности Советский Союз, не удовлетворены такой сменой руководства, и многие опасаются кровавого будущего региона."
 KRD.37.d: "Сегодня дипломаты Курдской Демократической Республики и Имперского государства Иран встретились в Эрбиле, чтобы подписать историческое мирное соглашение. Так называемый \"Эрбильский договор из 9 пунктов\" предусматривает следующее - двустороннее соглашение о постоянной демилитаризации северного Ирана, а также все будущие территориальные обмены между обеими странами. Выплата курдами репараций в размере не менее 100 миллиардов в течение 10 лет, возвращение иранским властям всех военнопленных и оружия. Курдская гарантия уважения религиозных, культурных и этнических прав иранцев и мусульман-шиитов в пределах своих границ. Иранские гарантии уважения религиозных, культурных и этнических прав всех курдов в пределах своих границ. Свободная иммиграция иранских граждан из Восточного Азербайджана. Признание Курдской Демократической Республики и ее границ. 15-летний пакт о ненападении и невмешательстве между обеими сторонами. Немедленное прекращение и вывод всех организованных курдами тайных операций в Иране. Свободные и честные выборы в курдских мажоритарных регионах Ирана для присоединения к Курдской Демократической Республике. Комментаторы по обе стороны железного занавеса в восторге от новостей об этом историческом соглашении. Хотя будущее этих двух ближневосточных держав остается неопределенным, многие испытывают оптимизм, поскольку мир и дипломатия вновь одержали победу над насилием."
 KRD.38.d: "Сегодня утром на землях Северного Ирана вновь вспыхнул конфликт, поскольку Курдская Демократическая Республика обстреляла небольшой город Банех. Хотя неизвестно, какая сторона открыла огонь первой, курды резко активизировали боевые действия, направив в регион подкрепление в виде новой 18-дюймовой гаубичной системы \"Барзанджи\" и модернизированных Т-34У. Хотя изменение территории маловероятно, очевидно, что курды намерены продолжать давление на иранское государство."
 KRD.39.d: "Сегодня в Демократической Республике Курдистан произошли драматические перемены. Почти единогласным голосованием Курдистан был исключен из Варшавского договора за \"Вопиющее пренебрежение международным правом и развращающий буржуазный национализм\". За этим решением немедленно последовали войска Варшавского договора, разрушившие последние объекты инфраструктуры, ведущие к их бывшему союзнику Курдистану. В последние месяцы напряженность между Ваном и Москвой резко обострилась из-за курдского милитаризма на Ближнем Востоке. Хотя ранее СССР был сильным союзником, он все больше расстраивается из-за агрессивной курдской внешней политики, которая противоречит его собственным целям в регионе. Хотя Советский Союз и многие страны Варшавского договора разорвали все экономические и политические связи, Китай и различные национальные коммунистические движения в Восточной Европе поклялись увеличить военную и политическую помощь все более изолированному ближневосточному государству."
 KRD.40.d: "Ровно в полночь по всему Курдистану раздался артиллерийский залп. Хотя регион страдает от бесконечных конфликтов, сегодня орудия стреляют не в гневе, а в честь праздника. Подобно своим товарищам в Греции, курды отмечают десятилетие коммунистического правления в Демократической Республике Курдистан. В течение всего дня РПК организовывала мероприятия, посвященные героям курдского движения за независимость и достижениям партии и государства. Самым заметным из этих мероприятий стал большой парад в столице страны городе Ван. На площади Победы были выставлены большие платформы, посвященные всему: от советского освобождения, современного трубопровода до спорной аннексии северного Ирана. Подражая советскому параду, Курдская рабочая красная армия также воспользовалась возможностью продемонстрировать ракетные системы, новый вариант автомата Калашникова и даже основной боевой танк отечественного производства. После парада Ахмед Тофик поздравил курдский народ и призвал к полному освобождению Курдистана к 1970 году в редком телевизионном выступлении. Хотя в курдских диаспорах это событие отмечается, многие в арабском мире все больше нервничают по поводу этой все более воинственной республики."
 KRD.41.d: "Сегодня политбюро Курдской рабочей партии избрало министра иностранных дел Дару Тауфика премьер-министром Курдской демократической республики. Будучи неоднозначной фигурой в Курдистане, Дара Тауфик пообещал положить конец дипломатической изоляции КДР путем нормализации отношений с Ираном и Западом. В своем заявлении западным журналистам Тауфик заявил о необходимости \"подружиться с Западом\" и избежать дальнейшего экономического ущерба гражданскому сектору экономики. Многие по обе стороны железного занавеса вздохнули с облегчением, когда умеренные взяли на себя командование Курдистаном."
 Tofiq_Death: "Ахмед Тофик скончался"
 KRD.42.d: "Курды обратились к нам с заманчивым предложением. В обмен на наши курдские земли, составляющие большинство населения, КДР поклянется принять активное участие в осуществлении нашей мечты о едином арабском государстве."
 KRD.43.d: "Хотя это причиняет нам боль, для обеспечения нашего выживания мы должны снова жить под властью иностранцев. Правительства Турции и СССР Ради блага нашего народа мы должны присоединиться..."
