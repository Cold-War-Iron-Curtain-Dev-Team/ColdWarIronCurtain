l_russian:
 Romania_Purge.1.d: "Со дня падения нацистской империи новая правящая партия [ROM.GetNameDef] находилась в состоянии междоусобной войны. Московское крыло и изоляционистское крыло находились в состоянии статус-кво со времени уничтожения буржуазного секретариатского крыла в 1948 году. Однако сейчас [ROM.GetLeader] получил поддержку от [SOV.GetLeader] и одержал победу над лидером московского крыла Анной Паукер. [ROM.GetRulingParty] начал серию жестоких чисток среди членов московского крыла, обиняя их в правом уклоне. Из миллиона членов партии, от 300000 до 465000 человек были исключены, то есть почти половина. Сделав это, [ROM.GetLeader] обезопасил свою власть над Румынией."
 Romania_Purge.2.d: "Несмотря на то, что раньше [SOV.GetLeader] ревностно поддерживал своих союзников в Восточной Европе, ситуация быстро меняется в [ROM.GetNameDef]. Твёрдая рука Георге Георгиу-Дежа когда-то помогла сокрушить оппозицию в стране. Однако его агрессивная антисемитская кампания против умеренной политики Анны Паукер привлекла больше внимания, чем ожидалось. Идея о том, что Георге является не самым надёжным правителем [ROM.GetNameDef], распространилась по всему коммунистическому миру. Анна Паукер возглавила вооружённое отстранение параноидального Георгиу-Дежа от власти, используя поддержку [SOV.GetLeader]. Опозоренный первый секретарь забаррикадировался в своем офисе, объявляя всех своих противников предателями, но он был успешно заключён под стражу. Сейчас Георгиу-Деж находится в заключении, а Анна Паукер была объявлена новым первым секретарём с поддержкой [SOV.GetLeader]."
 Romania_Purge.3.d: "После речи [SOV.GetLeader] о Сталине и его культе личности многие страны Варшавского договора начали процесс снятия с высших должностей людей, поддерживающих политику Сталина. Румыния пошла по такому же пути на XX съезде КПСС и начала отстранение Георге Георгиу-Дежа от государственных дел из-за его диктаторских методов по защите гос.безопасности и современных взглядов на коммунизм. Хотя Георгиу-Деж изо всех сил боролся за защиту нации от ревизионистов и либеральных анархистов, он был свергнут с помощью [SOV.GetLeader], а на его место назначили [ROM.GetLeader]. "
 Romania_Purge.4.d: "Неофициальный лидер румынской коммунистической партии Анна Паукер была арестована [ROM.GetLeader] в качестве плана по консолидации власти [SOV.GetNameDef]’а в Восточной Европе. Обвинения против Анны Паукер были основаны на её поддержке "подрывной и шпионской деятельности, осуществляемой представителями Израиля и сионистами" Также ей предъявили обвинения в раскрытии государственной тайны. Её поместили в румынскую тюрьму, широко известную своими пытками и допросами."
 Romania_Purge.5.d: "Лидер давно несуществующего секретариатского крыла Лукрециу Пэтрэшкану был приговорён к высшей мере наказания после обвинений в сотрудничестве с буржуазными элементами и даже американскими агентами. Пэтрэшкану находился в заключении с 1948 года по этим обвинениям. На недавнее судебное заседание он явился с ампутированной ногой. Изнемождённый лидер упорно отказывался принять помощь адвоката и говорил, что плюёт на выдвинутые против него обвинения. После суда над Пэтрэшкану и его казнии по стране прошла новая волна арестов, направленная на подавление союзников Пэтрэшкану и любой оппозиции [ROM.GetRulingParty]."
