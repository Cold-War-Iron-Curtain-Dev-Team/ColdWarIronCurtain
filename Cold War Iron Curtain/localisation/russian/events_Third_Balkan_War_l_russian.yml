l_english:
 THIRD_BALKAN_WAR.1.d: "Турецкие войска, размещённые на Кипре, работая с местными ополченцами из числа кипрских турок, заняли турецкие кварталы на севере острова после провозглашения Энозиса. Греческие войска на острове организовали периметр, чтобы не дать силам греков-киприотов вступить в бой с турецкими военными. Турецкое правительство отказывается принять Энозис, утверждая, что это приведет к культурному искоренению турецкой общины на острове. Несмотря на их заявление о том, что они являются оборонительными силами, турецкая оккупация представляет собой потенциально вражеский плацдарм. Мы можем попытаться добиться разделения с Турцией или выдвинуть двухнедельный ультиматум, чтобы Турция освободила остров."
 THIRD_BALKAN_WAR.2.d: "Правительство Греции опубликовало заявление, в котором призвало обе стороны снизить напряженность на Кипре и принять нынешнее разделение территории. Оно отметило, что народ Кипра однозначно принял Энозис, но греческое правительство понимает озабоченность Турции в отношении турок-киприотов. Греция, похоже, не заинтересована в эскалации нынешней напряженности и стремится быстро её разрешить. Турецкое правительство стоит перед дилеммой, так как греческая увертюра вызывает смешанные чувства. Многие чиновники видят в нём средство предотвращения более широкого конфликта, позволяющее Турции защитить свои интересы на острове. Однако есть также большое количество чиновников, особенно среди военных, которые рассматривают это соглашение как средство для Греции выиграть время и в конечном итоге захватить остров в ближайшем будущем."
 THIRD_BALKAN_WAR.3.d: "Турецкое правительство категорически отвергло предложение Греции о разделе Кипра. Турция твёрдо убеждена, что такое соглашение не приведет к прочному миру и осуждением Греции за вопиющее нарушение международных соглашений, касающихся Кипра. Турецкое правительство, похоже, сосредоточено не только на обеспечении своих интересов на Кипре, но и на предотвращении любого греческого контроля над островом. Греция не ответила на это предложение, хотя это решение вероятно, накалит страсти людей в обеих странах. Дипломаты в обеих странах сообщают что, похоже, нужно будет мало усилий для сдерживания общественного гнева."
 THIRD_BALKAN_WAR.4.d: "Кризис Энозиса достиг новой эскалации, когда Греция дала Турции две недели на вывод войск с Кипра. Нынешнее напряжение возникло после того, как греческие киприоты объявили об Энозисе или объединении с Грецией после ухода Великобритании с острова. Хотя на острове проживают в основном греки-киприоты, многочисленное турецкое население Кипра выступает против Энозиса, утверждая, что он фактически угрожает их культурной идентичности. Турецкие войска на острове недавно заняли турецкие кварталы на севере острова и столкнулись с греческими войсками, удерживающими периметр. Греция обвиняет Турцию в том, что она держит народ Кипра в заложниках своих требований и незаконно оккупирует остров. Она обещает завершить справедливое объединение всех греков. Аналитики считают, что греческое правительство находится под огромным давлением националистической волны, прокатившейся по всей Греции после Энозиса."
 THIRD_BALKAN_WAR.5.d: "Кризис Энозиса перерос в ультиматум Греции против Турции. Обе стороны проявляют упрямство в этом вопросе. Греция, безусловно, поддержала, если бы не оказывала прямую помощь грекам-киприотам, выступающим за Энозис, и, похоже, этого хочет большинство жителей острова. Однако международные соглашения были заключены для того, чтобы Кипр обеспечил представительство всем своим людям, особенно многочисленному турецкому кипрскому населению. Оккупировав Кипр и отказавшись вести переговоры, Турция, по сути, вынудила Грецию потребовать вывода войск. Если начнется вооруженный конфликт, это натравит двух союзников по НАТО друг на друга, что значительно ослабит альянс. Мы должны начать дипломатические усилия с угрозами санкций, чтобы попытаться остановить конфликт. Наша делегация сначала прибудет в Грецию, а затем в Турцию."
 THIRD_BALKAN_WAR.6.d: "Дипломатическая делегация высокого уровня из США прибыла в Афины для переговоров. Они призывают нас отозвать свой ультиматум и гарантировать статус-кво на Кипре. Они отмечают, что США не будут выбирать какую-либо сторону в этом текущем конфликте и гарантируют, что НАТО останется в военном отношении непричастным. Что еще более важно, если мы продолжим ультиматум, то столкнемся с немедленными экономическими и военными санкциями. США не сказали, что нас выгонят из НАТО, скорее, что наше членство будет приостановлено. В нашем кабинете министров мнения разделились, некоторые считают, что мы должны прислушаться к предупреждению и уйти в отставку, но это приведет в ярость народ Греции. Приверженцы жесткой линии отмечают, что Греция может пережить такие санкции, но она не может откладывать постоянное решение проблемы. Если Турция останется на Северном Кипре, она превратит свою незаконную оккупацию в крепость и плацдарм для будущего вторжения.."
 THIRD_BALKAN_WAR.7.d: "Греция согласилась отозвать свой ультиматум Турции после проведения переговоров в Афинах с США. Американцы оказали огромное давление на Грецию, чтобы она отозвала ультиматум. Согласно отчетам, Соединенные Штаты обещали жесткие санкции, если Греция начнет военные действия с НАТО. Теперь миссия намерена провести переговоры с Турцией. Турецкое правительство не опубликовало никакого заявления по этому поводу. Эта новость вызвала гневные протесты среди греков по всей стране и на Кипре. Они считают, что правительство отказывается от своего священного обещания об Энозисе, уступая международному давлению. Греческие военные опубликовали собственное заявление, отметив, что, несмотря на отзыв ультиматума, ситуация остается неразрешенной, и военные по-прежнему привержены защите народа Греции."
 THIRD_BALKAN_WAR.8.d: "Делегация Соединенных Штатов в Афинах уехала в Анкару разочарованной. Греческое правительство отказалось отозвать свой ультиматум. Оно утверждает, что Турция оккупирует районы Кипра, которые на самом деле являются греческими, и правительство не может предать свои обещания грекам-киприотам, которые столь многим пожертвовали ради Энозиса. Говорят, что Соединенные Штаты пригрозили санкциями в случае начала конфликта и гарантией того, что НАТО не будет вовлекаться в него военным путем. Источники с обеих сторон подтвердили, что никаких дискуссий о том, что Грецию выгонят или она выйдет из НАТО, не было. Есть сообщения о проведении патриотических митингов в поддержку правительства за его решение оставаться верным пути освобождения Греции."
 THIRD_BALKAN_WAR.9.d: "Дипломатическая делегация высокого уровня из США прибыла в Анкару для переговоров. Они призывают Турцию проявить сдержанность и принять текущий статус-кво. Они отмечают, что ситуацию нельзя повернуть вспять, а дальнейшая эскалация будет означать только войну. Американцы заявили, что любая эскалация приведет к немедленным экономическим и военным санкциям. НАТО будет запрещено принимать военное участие. Турция и Греция также будут отстранены от участия в НАТО до тех пор, пока не прекратятся боевые действия. Турецкий кабинет министров разделился. Некоторые хотят следовать американским приказам, чтобы избежать конфликта или риска американских санкций. Приверженцы жесткой линии утверждают, что народ не примет компромисс, и Турция должна оставаться твердой в вопросе восстановления Кипра к тому, что было согласовано на международном уровне."
 THIRD_BALKAN_WAR.10.d: "США утверждают, что их дипломатические усилия в Турции увенчались успехом. В совместном заявлении Турция заявила о своей открытости принять текущий статус-кво на Кипре, пообещав не идти на эскалацию конфликта. Эти переговоры завершают вихревые дипломатические усилия США. Президент опубликовал заявление, в котором призвал обе стороны воспользоваться этим последним рывком для мирного разрешения текущего кризиса. Турецкое правительство заявило, что оно не прекратит защищать турок-киприотов, и хотя оно хочет мира, его вооруженные силы сохраняют бдительность. Греческое правительство никак не отреагировало на это последнее событие."
 THIRD_BALKAN_WAR.11.d: "США признали, что их усилия в Турции по разрешению кризиса Энозиса были безуспешными. Турецкое правительство по-прежнему стремится защищать не только свои интересы на Кипре, но и возвращение к статусу-кво, существовавшему до Энозиса. Источники сообщают, что турецкое правительство, похоже, не было остановлено угрозами санкций в случае возникновения конфликта. Решение Турции было хорошо воспринято гражданами, разгневанными тем, что они считают греческим заговором с целью захвата Кипра и изгнания его турецкого населения. В частном порядке один дипломатический источник отметил, что решение Турции отражает доминирующее влияние сторонников жесткой линии, которые сейчас находятся в правительстве."
 THIRD_BALKAN_WAR.12.d: "После бешеных дипломатических усилий США, кризис Энозиса, похоже, утих. Греция и Турция согласились принять текущий статус-кво, при котором оба государства разделят остров. Отчеты указывают на ослабление напряженности между турецкими и греческими войсками на Кипре. Столицы стран НАТО и всего мира восхваляют Соединенные Штаты за содействие этому рывку. Несмотря на предотвращение вооруженного конфликта, многие греки и турки считают, что их лидеры поддались американскому давлению."
 THIRD_BALKAN_WAR.13.d: "Правительство в Афинах подвергается язвительной критике со стороны различных слоев общества в связи с тем, что оно согласилось принять раздел Кипра. Правительство настаивает, что это временный компромисс и ситуация будет разрешена в будущем. Приверженцы жёсткой линии считают что не настаивая на преимуществе, Турция превратит свою область Кипра в опасный пляжный берег. Они также утверждают, что Энозис не был полностью достигнут. Левые обвиняют правительство в том, что оно поддалось американскому империалистическому давлению. Несмотря на неудачу, многие греки с нетерпением ждут присоединения Кипра к нации."
 THIRD_BALKAN_WAR.14.d: "Турецкое правительство подвергается критике со стороны общественности за то, как оно справилось с кризисом Энозиса. Критики считают, что правительство должно было оказать давление на США, чтобы настоять на возвращении к кипрским соглашениям, существовавшим до Энозиса. Они считают, что правительство предало интересы турок-киприотов. Сторонники правительства считают, что резолюция сохраняет турецкие интересы на Кипре и позволяет напрямую защищать турок-киприотов. Все стороны сходятся в одном: Греция не будет удовлетворена таким разделом и Турция должна сохранять бдительность."
 THIRD_BALKAN_WAR.15.d: "Турецкое правительство объявило Греции свой собственный двухнедельный ультиматум. Турецкое правительство настаивает на том, что Энозис должен быть отменен и конституция Кипра должна быть восстановлена. Это решение широко приветствуется по всей стране, в крупных городах проходят проправительственные митинги. Турецкие военные опубликовали собственное заявление, в котором призвали нацию к единству. Греческое правительство не отреагировало на это заявление, но в Афинах проходят антитурецкие митинги. Многие аналитики считают, что горячая общественная поддержка Энозиса в Греции означает, что правительство не может согласиться с требованием Турции. Обе стороны, как говорят, мобилизуют военные силы"
 THIRD_BALKAN_WAR.16.d: "После турецкого ультиматума Греции, США объявили что введут экономические и военные санкции против Турции. Американское правительство заявило, что Турция отвергла предложения по деэскалации текущего кризиса. Аналитики считают, что санкции США призваны ограничить возможности Турции вести военные действия. Турецкое правительство ответило вызывающе, заявив что оно не будет сдерживать свои усилия по прекращению агрессивной греческой экспансии. США также призвали к проведению экстренного заседания НАТО для обсуждения ответных мер на эскалацию кризиса."
 THIRD_BALKAN_WAR.17.d: "На экстренном совещании НАТО было принято несколько важных решений в отношении эскалации кризиса между Грецией и Турцией. Альянс решил, что в случае начала военных действий обе страны будут отстранены от участия в организации до их окончания. Всем странам-участницам настоятельно рекомендуется сохранять нейтралитет. Альянс также согласился, что, несмотря на приостановку членства, любая внешняя сила, стремящаяся воспользоваться вооруженным конфликтом, рискует вызвать подавляющий ответ НАТО. Турция и Греция не были допущены на встречу, но ни одно из правительств не заявило о своем выходе из альянса"
 THIRD_BALKAN_WAR.18.d: "Поскольку Греция сохранила свой ультиматум против Турции, США объявили, что введут экономические и военные санкции против Греции. Американское правительство заявило, что Греция отвергла предложения по деэскалации текущего кризиса. Аналитики считают, что санкции США призваны ограничить возможности Греции вести военные действия. Греция ответила вызывающе, заявив что она не пойдет на компромисс в своей священной миссии по завершению Энозиса. Греческие военные опубликовали заявление, в котором утверждают, что санкции не повлияют на их способность выполнять свою миссию. США созвали экстренное совещание НАТО для обсуждения ответных мер на эскалацию кризиса"
 THIRD_BALKAN_WAR.19.d: "До истечения срока действия греческого ультиматума остались считанные часы. За последние несколько дней всякий интерес к принятию требований рассеялся. Турецкий народ и военные полностью готовы к конфликту. Вывод турецких войск на данном этапе будет расценен как оставление турок-киприотов на произвол судьбы\". Правительство скоро опубликует заявление, отвергающее несправедливые требования Греции. Турецкое военное командование отправляет приказы своим войскам быть готовыми к враждебным действиям."
 THIRD_BALKAN_WAR.20.d: "Отчеты с Кипра показывают, что турецкие и греческие силы вступили в открытые стычки. Конфликт Энозиса вступил в новую фазу открытых боевых действий. Также поступают сообщения о боевых действиях вдоль турецко-греческой границы. Многие аналитики считают, что боевые действия не ограничатся Кипром, и обе стороны, скорее всего, будут стремиться добиться крупных успехов в борьбе друг с другом. Это первый конфликт между Грецией и Турцией со времен Греко-турецкой войны 1919 года. США призвали обе стороны прекратить военные действия"
 THIRD_BALKAN_WAR.21.d: "Поскольку Греция и Турция не стали уступать, США объявили что введут экономические и военные санкции против Греции. Американское правительство заявило, что оба государства отказываются от предложений по деэскалации текущего кризиса. Аналитики считают, что санкции США призваны ограничить возможности обеих стран вести военные действия. Греция ответила вызывающе, заявив, что не пойдет на компромисс в отношении своей священной миссии по завершению Энозиса. Турецкое правительство также опубликовало заявление, в котором говорится, что оно не оставит турецкое население Кипра. США созвали экстренное совещание НАТО, чтобы обсудить ответ на обострение кризиса"
 THIRD_BALKAN_WAR.22.d: "После провозглашения Энозиса, Турция захватила часть Северного Кипра, ссылаясь на опасения за безопасность турок-киприотов. В ответ греческое правительство выдвинуло ультиматум, требуя от Турции вывести войска. Поскольку Турция является союзником по НАТО, мы должны принять решение об ответных мерах. Турецкий посол хочет получить нашу полную поддержку, и многие союзники по НАТО будут внимательно следить за тем, как мы реагируем на кризис. Отсутствие поддержки может привести к тому, что некоторые страны НАТО почувствуют, что альянсу не хватает защиты. Однако в США проживает большое количество греческого населения, которое не будет радо, если мы вмешаемся. Мы можем выступить с публичным заявлением, гарантирующим нашу поддержку Турции, хотя мы должны быть осторожны и не говорить, в чем будет заключаться эта поддержка. Это, надеюсь, напугает Грецию и заставит ее отступить. Другой вариант - объявить этот вопрос двусторонним, поскольку Турция ввела свои войска по собственной инициативе"
 THIRD_BALKAN_WAR.23.d: "США предупредили Грецию по поводу ее недавнего ультиматума по отношению к Турции. Американское правительство заявило, что Турция является членом НАТО и акт агрессии может вызвать действия со стороны альянса. Это заявление, безусловно, заставит греческое правительство задуматься. Турецкое правительство приветствовало это заявление, выразив благодарность за поддержку. Аналитики отмечают, что Соединенные Штаты не обещали вмешательства НАТО, но подтекст, безусловно, присутствует. Есть сообщения, что греческий кабинет министров, вероятно, проведет экстренное заседание в ближайшие часы"
 THIRD_BALKAN_WAR.24.d: "США намекнули, что если мы применим силу для справедливого устранения турецких оккупантов на Кипре, то можем подвергнуться риску вмешательства НАТО. Мы проводим экстренные заседания кабинета министров и министерства обороны, чтобы сформулировать ответ. Некоторые чиновники считают, что США, скорее всего, блефуют, так как многие страны НАТО, вероятно, расценят захват Турцией Северного Кипра как провокацию, а не как основание для полномасштабного ответа. Другие идут дальше и утверждают, что сами американцы не смогут заручиться общественной поддержкой для принятия ответных мер, учитывая наличие там многочисленной греческой общины. Однако многие считают что ситуация такова, что мы не можем рисковать полагаясь на невмешательство. Это может дорого обойтись Греции. Они считают, что правительство должно отменить ультиматум и искать выход из тупика в более благоприятное время"
 THIRD_BALKAN_WAR.25.d: "Правительство Греции объявило, что отменит свой ультиматум. Это радостная новость, которая обещает, что мы сможем продолжать защищать турок-киприотов от агрессии. США открыто поддержали нашу позицию, которая сыграла важную роль в остановке потенциальной греческой агрессии. Мы можем принять нынешний статус-кво, но нет никакой гарантии, что Греция не предпримет попытку агрессии в будущем. Приверженцы жесткой линии в правительстве призывают нас выдвинуть собственный ультиматум Греции. Мы должны потребовать, чтобы они прекратили незаконную оккупацию Кипра и восстановили согласованную на международном уровне конституцию. Такие действия могут стоить нам американской поддержки, но греки возможно не захотят рисковать"
 THIRD_BALKAN_WAR.26.d: "Турецкое правительство показало свое коварство и стремление к насилию, выдвинув свой собственный ультиматум после того, как мы предложили мир. Турция требует от нас отмены Энозиса, чтобы восстановить прежнюю конституцию. Для народа Греции это было бы серьезным предательством. Это также вернет Кипр к прежнему режиму некомпетентности и плохого управления. Учитывая настроение общества, мы полностью проигнорируем эти требования. В частном порядке правительство узнало из источников, что даже если оно рассмотрит возможность выполнения требований Турции, то столкнется с негативной реакцией военных. Мы должны подготовить наши силы к предстоящей угрозе"
 THIRD_BALKAN_WAR.27.d: "Ошеломляющий шаг, турецкое правительство выдвинуло свой собственный ультиматум Греции. Они хотят вернуть согласованную на международном уровне конституцию Кипра. Это действие меняет ход конфликта, так как теперь именно Турция ведет к обострению ситуации. Мы никогда не обещали Турции поддержку НАТО для таких действий. Скорее всего, даже если бы мы захотели, мы не смогли бы убедить американскую общественность поддержать нас, поскольку конфликт представляется слишком локализованным. Мы можем обозначить свою позицию. Турция является жизненно важным геополитическим партнером, мы можем оставаться твердыми в оказании ей дипломатической и материальной поддержки, но не в военной силе. Однако многие высокопоставленные дипломатические и военные чиновники считают, что Турция пыталась манипулировать нашей поддержкой в своих национальных интересах. Другие государства могут попытаться сделать нечто подобное, они предлагают нам занять позицию критики этой турецкой эскалации, это может даже заставить Турцию сделать паузу перед началом каких-либо действий."
 THIRD_BALKAN_WAR.28.d: "Соединенные Штаты выразили беспокойство по поводу недавнего заявления Турции, требующей от Греции вернуть Кипр к прежней конституции. Высокопоставленные американские чиновники поспешили назвать эти действия необоснованными. Несмотря на публичную критику, Турция остается непреклонной в том, что единственным способом разрешения кризиса на Кипре является возвращение конституции, основанной на разделении власти. Правительство Греции никак не отреагировало на это, хотя многие аналитики считают, что если бы правительство даже задумалось о выходе, оно рисковало бы вызвать бурную реакцию со стороны населения, охваченного патриотическим пылом после провозглашения Энозиса."
 THIRD_BALKAN_WAR.29.d: "Недавний кризис на Кипре, похоже, закончился благополучно. Турция и Греция согласились сохранить нынешний раздел острова после того, как Греция провозгласила Энозис, а Турция оккупировала северную часть острова. Недавно кипрские про-греческие националисты свергли неэффективную по их мнению конституцию и провозгласили единство с Грецией. Это действие привело к тому что Турция ввела свои войска, чтобы, по ее словам, защитить турок-киприотов. Турция настаивает на том, что остров должен вернуться к согласованной на международном уровне конституции. Греция угрожала военными действиями, чтобы изгнать Турцию, если она не выведет свои войска с острова, но похоже более холодные умы изменили эту позицию. Турецкое правительство также отказалось от своей позиции, призывающей к полному уходу Греции. По сообщениям, обе стороны сворачивают свои вооруженные силы"
 THIRD_BALKAN_WAR.30.d: "На экстренном совещании членов НАТО было заявлено, что они рассматривают текущий кипрский спор как двусторонний вопрос между Турцией и Грецией. Организация также отметила, что Турция остается членом НАТО и будет защищена, если столкнется с агрессией со стороны внешней державы. Хотя турецкое правительство пыталось убедить НАТО поддержать свою позицию и заставить Грецию восстановить на Кипре политический порядок, существовавший до энозиса, ему не удалось убедить организацию. Многие члены считают, что Турция недавно обострила кризис, потребовав вывода греческих войск. Несмотря на неудачу, Турция будет удовлетворена тем, что организация сдержит свои обещания"
 THIRD_BALKAN_WAR.31.d: "Греция ответила отказом на наше предупреждение, чтобы они отозвали свой ультиматум против Турции. Греческое правительство настаивает на том, что оно выполняет пожелания кипрского народа. Она настаивает на том, что Турция подстрекает к нынешней напряженности и незаконно удерживает часть острова. Следующий шаг - созыв экстренного заседания НАТО по кипрскому кризису. Мы должны определить организационную реакцию. Однако наши первые запросы показывают, что многие члены НАТО, возможно, не захотят настаивать на вооруженном вмешательстве. Греция занимает особое место в культурном плане для многих европейцев, и есть много людей, которые с пониманием относятся к их действиям"
 THIRD_BALKAN_WAR.32.d: "НАТО завершила экстренное заседание по кипрскому кризису. Встреча вызвала разногласия: члены НАТО утверждали, что конфликт носит двусторонний характер, в то время как другие считали, что вооруженный конфликт должен привести к коллективному ответу. Турция горячо отстаивала необходимость поддержки со стороны своих союзников. В конце концов, соглашение было достигнуто. НАТО опубликовала решительное заявление, в котором говорится, что ее члены окажут полную дипломатическую и материальную поддержку своему союзнику, хотя и не обещали военного ответа. Турецкое правительство будет воодушевлено сильной международной поддержкой, но разочаровано отсутствием полноценного военного ответа. В заявлении также предупреждается, что любая внешняя сила, стремящаяся подорвать Турцию, рискует вызвать полномасштабный ответ."
 THIRD_BALKAN_WAR.33.d: "С началом боевых действий с Турцией нам предстоит трудная борьба. Албания - наш идеологический партнер и сосед. В прошлом мы сотрудничали в деле снятия оков турецкой оккупации, возможно, настало время возобновить эти связи. Многие в партии призывают правительство обратиться к Албании с призывом присоединиться к нам в нашей справедливой борьбе. Однако есть опасения, что привлечение Албании может спровоцировать НАТО. Решение должно быть принято"
 THIRD_BALKAN_WAR.34.d: "Греческое правительство призвало нас присоединиться к ним в борьбе против Турции. Греция стремится завершить объединение с Кипром и наказать Турцию за вмешательство в ее дела. У нас есть идеологическая связь с Грецией, и в партии есть много тех, кто хочет, чтобы мы объединились с ними. Мы, конечно, можем присоединиться к конфликту, хотя война всегда имеет непредвиденные последствия. В качестве альтернативы мы можем предложить дипломатическую и материальную помощь, чтобы выполнить наши идеологические обязательства и при этом не воевать. Те, кто выступает против конфликта, сомневаются в целесообразности нашего участия и считают, что мы должны вежливо отклонить призыв к оружию."
 THIRD_BALKAN_WAR.35.d: "Большинство стран НАТО смотрят в сторону США, какую позицию занять в отношении оказания поддержки Турции в ее конфликте с Грецией. Некоторые из более про-натовских правительственных чиновников хотят, чтобы мы открыто помогали Турции, это даст нам возможность предоставлять большие объемы помощи. Тогда другие страны НАТО смогут последовать нашему примеру, если захотят. Однако есть и те, кто считает, что Турция сама виновата в этом конфликте и стремится извлечь выгоду, а открытая помощь Турции может стать негативным примером для других наших союзников. Они считают, что любая помощь должна предоставляться тайно. Это ограничивает объем помощи, но дает нам возможность играть роль миротворца в будущем"
 THIRD_BALKAN_WAR.36.d: "До начала боевых действий между Грецией и Турцией, США раскритиковали турецкое правительство за то, что оно сыграло главную роль в эскалации напряженности. Они и греческое правительство в равной степени несут ответственность за этот военный конфликт. Однако Турция является союзником НАТО и занимает жизненно важное геополитическое пространство. Несколько стран НАТО также обратились к нам, заявив о своей заинтересованности в организации тайной военной помощи Турции. Наши разведчики и военные считают, что такие операции обеспечат уверенность турецкому правительству. Некоторые высокопоставленные дипломатические советники предостерегают от предоставления какой-либо помощи, отмечая, что это потворствует плохому поведению союзника"
 THIRD_BALKAN_WAR.37.d: "Нам предстоит монументальная борьба с Турцией. Ее силы готовятся к завоеванию наших земель и восстановлению турецкого присутствия на Балканах. Как неприсоединившееся государство, Югославия должна быть заинтересована в противостоянии агрессивному клиенту США. Исторически наш народ сотрудничал против турецкой агрессии в прошлом, и было бы естественно призвать его к поддержке. Многие призывают правительство обратиться к Югославии. Некоторые выступают против обращения за поддержкой к Югославии, считая, что это может осложнить будущее мирное урегулирование"
 THIRD_BALKAN_WAR.38.d: "Греция призвала нас поддержать её в военном конфликте с Турцией. Греки утверждают, что Турция воодушевлена своим союзом с США и стремится предъявить несправедливые требования ко всем грекам. Многие в правительстве считают, что мы, как государство, не входящее в союз, должны оказать им поддержку. Одна фракция хочет, чтобы мы вступили в войну, чтобы продемонстрировать, что неприсоединившиеся государства не будут подвергаться запугиванию. Другая группа чиновников хочет предоставить обширную материальную поддержку вместе с добровольцами. Однако некоторые более холодные умы считают, что вооруженное вмешательство слишком рискованно, они предлагают оказать дипломатическую поддержку."
 THIRD_BALKAN_WAR.39.d: "Югославия осудила Турцию за развязывание агрессивной войны против Греции. Она также обвинила США в том, что они поставляют чрезмерное количество оружия Турции, подпитывая её агрессивную внешнюю политику. Чтобы поддержать Грецию, Югославия пообещала материальную и дипломатическую поддержку. Также ходят слухи, что Югославия разрешает добровольцам уезжать и воевать за Грецию. Турецкое правительство осудило Югославию, но заявило, что ничто не сдержит её волю. Когда от США потребовали комментариев, они заявили, что следят за ситуацией и призывают все государства не нагнетать обстановку."
 THIRD_BALKAN_WAR.40.d: "В результате ошеломляющего события Югославия объявила, что её войска присоединятся к Греции против Турции. Югославское правительство утверждает, что Турция ведет агрессивную войну, вызванную чрезмерными поставками оружия США в Грецию. Оно добавило, что неприсоединившиеся державы не могут позволить какой-либо сверхдержаве или её клиентам запугивать их. Турецкое правительство осудило эти действия, отметив, что сейчас оно борется за предотвращение оккупации и изгнания турок по всему региону. Многие региональные государства и крупные державы внимательно наблюдают за быстро нарастающим конфликтом."
 THIRD_BALKAN_WAR.41.d: "Югославское правительство выступило с резкой критикой Турции. Они утверждают, что Турция начала жестокую кампанию агрессии против Греции. Оно также обвинило США в милитаризации региона. Греция приветствовала это заявление и призвала все неприсоединившиеся государства поддержать ее в противостоянии с Турцией. Турецкое правительство осудило это заявление, назвав его искажением действительности. Несмотря на решительное заявление, большинство наблюдателей отмечают, что Югославия, похоже, не желает участвовать в этом процессе помимо оказания Греции дипломатической поддержки."
 THIRD_BALKAN_WAR.42.d: "Турция и Греция в настоящее время находятся в состоянии войны. Греция является другом Объединенной Арабской Республики и членом неприсоединения. Многие в стране поддерживают её борьбу за освобождение греков Кипра. Некоторые высокопоставленные военные чиновники видят в этом развитии событий потенциальную возможность. Мы можем оказать помощь Греции и послать наши войска для освобождения оккупированных арабов Хатая. Пока Греция освобождает свой народ, мы можем освободить свой собственный. Другие считают, что такие действия могут вызвать гнев США, которые контролируют Турцию как марионетку. Вместо этого они считают, что мы должны ограничить нашу поддержку военной помощью. Если Турция потерпит поражение, мы сможем разобраться с ней позже. Однако есть и те, кто считает, что любые из этих действий не в наших интересах, и вместо этого мы должны сосредоточиться на оказании моральной и дипломатической поддержки Греции"
 THIRD_BALKAN_WAR.43.d: "Объединенная Арабская Республика подвергла Турцию резкой критике за развязывание агрессивной войны против Греции. Она обвинила Турцию в возрождении своего империалистического прошлого на службе США. Радиопередачи из Каира для арабов по всему Ближнему Востоку распространяют это послание. Греческое правительство приветствовало это заявление, заявив, что арабский мир как никто другой понимает, что означает турецкая оккупация. В ответ турецкое правительство отмахнулось от этого заявления, назвав его неуместным и основанным на ложной информации. Аналитики отмечают, что несмотря на воинственное заявление, не похоже что ОАР будет напрямую вмешиваться в конфликт."
 THIRD_BALKAN_WAR.44.d: "Объединенная Арабская Республика подвергла Турцию резкой критике за её агрессивные действия по отношению к Греции. В дополнение к осуждению, военные ОАР объявили, что направят военное оборудование для поддержки Греции, борющейся за освобождение собственного народа. Радиопередачи из Каира подчеркивают параллели между освобождением греков и борьбой арабов за освобождение. По сообщениям из Афин, в стране проходят демонстрации в поддержку ОАР. Турецкое правительство предупредило ОАР, что она понесет последствия своих действий в то время и в том месте, которые выберет Турция."
 THIRD_BALKAN_WAR.45.d: "Высокопоставленные представители оборонного ведомства и разведки сообщают о массовом наращивании войск вдоль границы Объединенной Арабской Республики с Турцией. Похоже, что ОАР рассматривает возможность военной интервенции для поддержки Греции и захвата Хатая у Турции. Это будет тревожным событием, которое в случае успеха может привести к краху Турции. Мы должны дать какой-то ответ на эту угрозу. Мы можем опубликовать предупреждение о том, что любые военные действия ОАР будут сопровождаться нашим быстрым вмешательством в конфликт. Однако, если мы не готовы взять на себя обязательства по вмешательству, мы можем опубликовать предупреждение. Многие считают, что этого будет достаточно, чтобы заставить ОАР остановить свои планы"
 THIRD_BALKAN_WAR.46.d: "США обнаружили, что Объединенная Арабская Республика быстро развертывает военные силы на своей границе с Турцией. Американские официальные лица заявляют, что ОАР планирует вмешательство в текущий турецко-греческий конфликт. Американское правительство предупредило, что такой сценарий приведет к прямому военному вмешательству. ОАР призывают прекратить военные приготовления. Каир пока молчит в ответ на американские обвинения. Мир с нетерпением ждет, что произойдет дальше"
 THIRD_BALKAN_WAR.47.d: "США обнаружили, что Объединенная Арабская Республика быстро развертывает военные силы на своей границе с Турцией. Американские официальные лица заявляют, что ОАР планирует вмешательство в текущий турецко-греческий конфликт. Американское правительство предупредило о серьёзных последствиях, если ОАР не остановит свое угрожающее наращивание вооруженных сил. Каир до сих пор хранил молчание в ответ на американские обвинения. Наблюдатели отмечают, что предупреждение не гарантирует военного вмешательства, но и не исключает его."
 THIRD_BALKAN_WAR.48.d: "В ответ на обвинения США в том, что они планируют вторжение в Турцию, Объединенная Арабская Республика опубликовала ответ. Она решительно отвергла обвинения, заявив, что американцы стремятся найти любой предлог, чтобы поддержать своего турецкого клиента. Несмотря на отрицание, наблюдатели отмечают, что в ОАР происходили значительные военные перемещения, но теперь, похоже, они прекратились. Американское правительство отвергло ответ ОАР, но отметило, что нынешнее наращивание военной мощи прекратилось. Греческое правительство осудило США за стремление найти предлог для вмешательства в пользу Турции."
 THIRD_BALKAN_WAR.49.d: "Несмотря на наше предупреждение Объединенной Арабской Республике, они начали вторжение в Турцию. Мы считаем, что ОАР стремится захватить Хатай и открыть второй фронт, чтобы помочь Греции в ее нынешнем конфликте с Турцией. Мы должны выбрать ответ, если этого не сделать, мы рискуем подорвать все наши глобальные партнерские отношения. В нашем предупреждении не было указано, какой ответ будет дан, что дает нам гибкость. Один из вариантов - обеспечить массовый приток оружия в Турцию, что значительно укрепит ее способность защищаться от ОАР. Мы также можем вмешаться и начать военные операции против ОАР"
 THIRD_BALKAN_WAR.0.d: "Белый дом и Пентагон подтвердили, что проводится операция по обеспечению массового притока оружия в Турцию. Соединенные Штаты предостерегли ОАР от вовлечения в конфликт, и это, похоже, стало их ответом. Турецкое правительство приветствовало поддержку, заявив, что его вооруженные силы более чем способны противостоять текущему кризису. Греция выступила с протестом, предупредив, что оружие приведет к эскалации насилия и будет использовано против их собственных сил. ОАР осталась непокоренной, назвав действия Америки доказательством ее гнусных замыслов в отношении региона."
 THIRD_BALKAN_WAR.51.d: "Соединенные Штаты подтвердили, что присоединятся к Турции в отражении вторжения Объединенной Арабской Республики в страну. Американцы сделали предупреждение ОАР, угрожая ответными мерами, если она присоединится к текущему греко-турецкому конфликту. Турецкое правительство приветствовало эту новость, заявив, что его народ воодушевлен поддержкой своего ключевого союзника. ОАР публично не проявляет беспокойства, заявляя, что ее силы и народ способны противостоять любой угрозе. В частном порядке, многие аналитики ОАР будут сильно обеспокоены таким развитием событий, поскольку политическое руководство страны рассчитывало на то, что американцы не станут вмешиваться"
 THIRD_BALKAN_WAR.52.d: "Наземные войска Объединенной Арабской Республики пересекли турецкую границу. Позже правительство подтвердило, что ее войска направлены для освобождения арабов Хатая и поддержки Греции. Это серьезная эскалация греко-турецкого конфликта. В Турции опасаются, что новый фронт истощит её силы, которые в настоящее время сражаются против Греции. Греческое правительство приветствовало эту новость, заявив, что неприсоединившийся мир не примет издевательств со стороны тех государств, которые чувствуют поддержку со стороны своего сверхдержавного покровителя. Мир будет внимательно следить за тем, как США отреагируют на эту новую угрозу, стоящую перед их союзником."
 THIRD_BALKAN_WAR.53.d: "Греция и Турция вовлечены в вооруженный конфликт из-за Кипра. На фоне этих боевых действий Объединенная Арабская Республика начала свое собственное вторжение в Турцию, стремясь закрепить давние территориальные претензии. С момента открытия дипломатических отношений наши разведывательные и оборонные службы тесно сотрудничают с Турцией. Вторжение ОАР угрожает изменить военный баланс в регионе. Из-за риска общественной реакции турецкое правительство предпочитает, чтобы мы оба держали в тайне степень наших отношений. В связи с этим у нас есть три варианта помощи Турции: первый - мобилизовать наши силы на границе с ОАР. Это может заставить их отвлечь силы с фронта. Мы также можем в частном порядке передать Турции военное оборудование и советников. Однако есть те, кто считает, что не в наших интересах подвергать Израиль риску из-за другого государства, они хотят чтобы мы просто дипломатически осудили агрессию ОАР"
 THIRD_BALKAN_WAR.54.d: "Донесения разведки и военные командиры на границе сообщают о массовой мобилизации израильских сил. Мы также перехватили передачи, призывающие резервистов готовиться к призыву по всему Израилю. Это необычайно масштабное наращивание сил, и оно явно связано с нашим текущим конфликтом с Турцией. Израильтяне, возможно, хотят нанести удар по нам, пока мы сосредоточены на освобождении наших братьев и сестер в Хатае. Местные командиры настоятельно рекомендуют нам обеспечить укрепление наших пограничных позиций и способность справиться с любым заговором сионистов"
 THIRD_BALKAN_WAR.55.d: "Израильское правительство в частном порядке сообщило нам, что передаст большое количество оружия и советников для наших войск. Израильтяне говорят, что они сочувствуют нашему тяжелому положению, когда мы подвергаемся нападению со стороны Объединенной Арабской Республики, и хотят помочь нашей обороне. Это радостная новость, поскольку наша страна продолжает сталкиваться с агрессией на большинстве наших границ. Для тех, кто долгое время поддерживал тесные связи с Израилем, несмотря на противодействие религиозно настроенных людей, эта новость является подтверждением того, что наше решение о сотрудничестве с Израилем было правильным. Мы будем тесно сотрудничать с израильтянами, чтобы любая передача оружия и советников оставалась вне поля зрения общественности, чтобы не провоцировать тех, кто выступает против наших отношений"
 THIRD_BALKAN_WAR.56.d: "Израильское правительство осудило Объединенную Арабскую Республику (ОАР) за вторжение в Турцию. Оно отметило, что эта акция подчеркивает угрозу, с которой сталкивается Израиль и все те, кому угрожает ОАР. Израиль также призвал международное сообщество привлечь ОАР к ответственности за ее откровенные акты агрессии. Объединенная Арабская Республика осудила заявление Израиля, назвав его сионистской уловкой, призванной отвлечь мир от оккупации арабских земель. Обмен резкими словами вызвал в регионе опасения, что Израиль может вскоре ввязаться в быстро нарастающий конфликт, который начался с войны Греции и Турции за Кипр. Израиль, как говорят, повысил военную бдительность своих сил на границе"
 THIRD_BALKAN_WAR.57.d: "Турецкое правительство поступило трусливо, когда заморозило отношения с нашей страной. Вместо этого оно потворствует арабам и стремится осудить нас на международном уровне. В настоящее время Турция воюет с Грецией за Кипр. По имеющимся данным, бои носят интенсивный характер. Сотрудники нашей разведки считают, что мы можем воспользоваться этим конфликтом и ослабить военный потенциал Турции. Они призывают нас немедленно направить в Грецию оружие и советников. С этим оружием и при нашей поддержке греки, как мы надеемся, смогут победить турок или, по крайней мере, нанести им тяжелые потери, чтобы ослабить их боевой потенциал. Эта акция пользуется большой поддержкой, но есть военные и экономические чиновники, которые выступают против этого шага, утверждая, что Израилю нужно все оружие, чтобы противостоять арабам, окружающим наши границы."
 THIRD_BALKAN_WAR.58.d: "В частном порядке, делегация разведки и военных чиновников из Израиля прибыла, чтобы посетить наше руководство. Они пообещали предоставить нам оружие и советников. Израильтяне глубоко симпатизируют нам, отмечая что мы действуем только для того, чтобы освободить греческие земли для их греческого народа. Наши собственные лидеры тепло поблагодарили израильтян, сказав, что это знаменует собой начало дружественных греко-израильских отношениях. Поддержка Израиля является большим стимулом и подтверждением справедливости нашего дела. Чтобы не разжечь религиозный гнев мусульман и не дать Турции повод заявить, что она ведет справедливую религиозную войну, мы пока будем держать эти поставки оружия в секрете"
 THIRD_BALKAN_WAR.59.d: "Все мировые СМИ в Афинах бросились фотографировать, как турецкая армия подняла огромный флаг над афинским Акрополем. Это подчеркивает турецкую оккупацию греческой столицы. Сообщается, что турецкие войска патрулируют улицы города, поднимая флаги на каждом греческом правительственном здании или памятнике. Турецкие войска пребывают в радостном настроении, многие считают падение Афин величайшим достижением своей кампании. Местные греки в основном остаются дома, испытывая страх и унижение от того, что их военные не смогли удержать столицу. В ближайшие дни ожидается прибытие высокопоставленных турецких генералов и гражданских лидеров, которые будут лично осматривать город. Один высокопоставленный турецкий офицер сказал, что эта победа должна смирить греков"
 THIRD_BALKAN_WAR.60.d: "После напряженной кампании греческие войска прочно удерживают контроль над Стамбулом. Греческие солдаты и офицеры, прибывающие в город, маршируют со слезами на глазах, охваченные эмоциями по поводу возвращения города, потерянного более пяти веков назад. С начала греческой оккупации в Святой Софии и других исторических византийских местах ежедневно проводятся греческие православные церемонии, на которых присутствуют греческие военнослужащие и высокопоставленные гости. На пресс-конференции местный греческий командир отметил, что взятие Константинополя отражает дисциплину, эффективность и желание греческих солдат освободить свой народ и земли. Планируется провести массовый парад на площади Таксим, чтобы продемонстрировать греческую военную мощь."
 THIRD_BALKAN_WAR.61.d: "После напряженных боев последняя греческая военная позиция на Кипре пала перед турецкой армией. Репортеры на острове сообщают, что ситуация напряженная, греки-киприоты часто вызывающе смотрят на хорошо вооруженных турецких солдат. В греческих кварталах турки, как говорят, находятся в полной боевой готовности, готовые оказать любое сопротивление. Турецкие военные листовки уверяют местное население, что их присутствие направлено только на восстановление кипрской конституции на острове. В турецких кварталах, напротив, царит праздничное настроение, турецкие военные и гражданские лица свободно общаются друг с другом. Турки-киприоты быстро говорят представителям СМИ, что именно турецкая армия спасла их от резни и насильственного изгнания. Турецкое правительство отмечает, что, несмотря на победу на Кипре, война продолжается в других местах, и остров не будет в безопасности, пока не закончатся боевые действия."
 THIRD_BALKAN_WAR.62.d: "Турецкий карман пал перед греческими силами после интенсивных боев. Греческие солдаты усиленно патрулируют кварталы кипрских турок, утверждая, что обеспечивают безопасность жителей. Многие турки-киприоты в частном порядке сказали журналистам, что патрулирование больше похоже на демонстрацию силы. В крупных греческих кварталах проходят большие празднования: и кипрские греки, и греческие солдаты празднуют завершение Энозиса. Несмотря на радостную атмосферу, греческие военные быстро подчеркивают, что боевые действия не закончились, и военные будут продолжать бдительно следить за тем, чтобы остров оставался под греческим флагом. Один из местных греков сказал репортеру, что народ Кипра наконец-то возвращается к греческой нации после столетий разделения"
 THIRD_BALKAN_WAR.63.d: "Объединенная Арабская Республика объявила, что её войска освободили Хатай. Она добавила, что победа была достигнута благодаря тому, что ОАР успешно преодолела жёсткое турецкое сопротивление. Президент ОАР высоко оценил преданность, дух и руководство своих войск. Иностранная пресса опубликовала фотографии солдат ОАР, идущих по улицам города, местные жители дарят им цветы и сладости. Поступают сообщения о демонстрациях сторонников ОАР по всему арабскому миру, приветствующих недавнюю победу. Турецкое правительство никак не прокомментировало происходящее"
 THIRD_BALKAN_WAR.64.d: "Турецкий флаг высоко развевается над Алеппо. Наши силы недавно захватили город после боев с силами Объединенной Арабской Республики. ОАР начала войну, пытаясь захватить у нас Хатай. Наши силы не только отбили вторжение, но и захватили этот исторический город. Теперь мы можем воспользоваться этой возможностью, чтобы предложить ОАР прекращение огня. Они согласятся на возвращение к довоенным границам. Это позволит нам сосредоточить наши усилия на Греции. Другой вариант - продолжать боевые действия и давить на наше преимущество"
 THIRD_BALKAN_WAR.65.d: "Турецкое правительство объявило о прекращении огня с Объединенной Арабской Республикой. Обе стороны согласились вернуться к довоенным границам. ОАР будет унижена этим результатом. Оно вторглось в Турцию в надежде захватить Хатай и его многочисленное арабское население. Турецкие военные, как говорят, ликуют, но сейчас они сосредоточены на борьбе с другими угрозами, с которыми они сталкиваются. В Хатае был проведен большой парад победы, а иностранным СМИ показали захваченное и уничтоженное оружие"
 THIRD_BALKAN_WAR.66.d: "Наш недавний конфликт с Турцией закончился катастрофой. Мы стремились освободить арабов Хатая, но вместо этого потерпели унизительное поражение, включая потерю Алеппо. Турецкое правительство объявило о прекращении огня, что позволило нам восстановить довоенную границу. Поступают сообщения о гневных демонстрациях в наших городах. Многие граждане разгневаны поражением, даже военные, как говорят, в отчаянии. Многие солдаты втайне обвиняют своих командиров в том, что они их подвели"
 THIRD_BALKAN_WAR.67.d: "Греческая армия подтвердила, что ее войска захватили Эдирне. Командующий генерал высоко оценил решимость и преданность своих людей в боях. Многие в Греции радостно приветствуют эту новость, считая захват важным для освобождения Константинополя. Редакции некоторых газет в регионе едва скрывают свое ликование по поводу того, что турецкие войска лишились своего плацдарма в Европе. Турецкое правительство хранит молчание, но отмечает, что его войска не дрогнут в защите нации"
 THIRD_BALKAN_WAR.68.d: "Греческие войска сейчас контролируют Бурсу. СМИ опубликовали фотографии греческих офицеров, осматривающих османские исторические места по всему городу. Эта победа имеет большое символическое значение для Греции, поскольку теперь она занимает первую столицу бывшей Османской империи. Турецкое правительство стремится преуменьшить неудачу, но очевидно, что война идёт не так, как они надеялись. Воодушевленная этим успехом, Греция, похоже, готова к дальнейшему прорыву. Турецкой армии будет трудно сохранить общественную поддержку, если она продолжит терять позиции"
 THIRD_BALKAN_WAR.69.d: "После смелой кампании Греция подтвердила, что ее силы контролируют Измир. Захват имеет важное историческое значение для греческой армии, так как этот порт был ее пунктом входа в начале греко-турецкой войны 1919 года. Местное турецкое население, как говорят, было в ярости после того, как греческая армия установила таблички, называющие город Смирной. Несмотря на это, греческие военные власти попытались успокоить население, отдав строгий приказ солдатам не вмешиваться в дела гражданского населения. Турецкое правительство демонстративно заявило, что история повторится и предупредило что все ответят если Греция нападет на её граждан. Многие потомки греческих беженцев из города чувствуют себя очень тронутыми этим достижением."
 THIRD_BALKAN_WAR.70.d: "Турецкая столица пала перед греческой армией. Падение столицы заставило многих турок задуматься о будущем своей нации. Пока греческие военные обыскивают заброшенные здания министерств, старшие офицеры и чиновники проводят совещания в офицерских помещениях, которые когда-то занимали высшие турецкие чиновники. Греческие граждане с ликованием читают газетные сообщения о брошенных документах и предметах, оставленных турецкими чиновниками, которые были вынуждены быстро покинуть свои посты. Несмотря на неудачу, турецкая армия вызывающе заявила, что потеря Анкары не ослабит их решимости."
 THIRD_BALKAN_WAR.71.d: "После интенсивных боев турецкие войска контролируют Кавалу. Сообщается, что турецкие войска быстро превращают город в передовой командный пункт. Турецкий командир захвативший город, утверждает, что он станет плацдармом для будущих турецких наступлений в Греции. Греческое правительство заявило, что это поражение является незначительной неудачей и что его войска вскоре полностью вытеснят турок из Греции. Греческие жители, как говорят, в основном остаются дома, многие из них обеспокоены тем, что их ждет в будущем под турецкой оккупацией."
 THIRD_BALKAN_WAR.72.d: "Турция подтвердила, что её войска полностью контролируют Салоники. Турецкая армия провела официальный марш к дому детства Мустафы Кемаля, основателя республики. Для многих турок город имеет такое символическое значение. Для многих потомков турецких беженцев из северной Греции, они смотрят на победу с большим удовлетворением. Для греческого населения турецкая оккупация ощущается как катастрофа, и многие опасаются за будущее, если турецкая армия не будет вытеснена в ближайшее время"
 THIRD_BALKAN_WAR.73.d: "Исторический и стратегически важный остров Родос отошел к Турции. Турецкое правительство опубликовало фотографии офицеров, посещающих основные греческие исторические достопримечательности. Говорят, что турецкие солдаты активно патрулируют гражданские кварталы в качестве демонстрации силы местному греческому населению. Многие греки, как говорят, разгневаны на своих военных и правительство за их неспособность сохранить контроль над островом, несмотря на попытки греческих лидеров преуменьшить неудачу. Говорят, что турецкие ВМС создают местный командный центр, чтобы лучше использовать и контролировать доступ к порту."
 THIRD_BALKAN_WAR.74.d: "Греческое правительство признало, что потеряло контроль над Иоанниной, крупнейшим городом и административным центром северо-западной Греции. Хотя оно назвало эту потерю временной неудачей, турецкое правительство утверждает, что теперь оно готово захватить этот регион. Турецкие военные спешно продвигаются в город, чтобы создать эффективную оккупационную власть. Турецкое правительство похвалило свои силы за успешный захват города, защищенного вражескими силами и труднопроходимой местностью. Многие греки все больше опасаются, что северная часть страны становится все более уязвимой для турецких операций."
 THIRD_BALKAN_WAR.75.d: "Генеральный секретарь ООН объявил о прекращении огня, чтобы положить конец текущей греко-турецкой войне. Он похвалил международное сообщество за объединение усилий и прекращение боевых действий. Греческие и турецкие войска прекратили боевые действия, так как обе стороны нервно ожидают окончательного результата. На протяжении всего конфликта оба правительства стремились подавить негативные новости и преувеличить успехи. Многие региональные правительства вздохнут с облегчением теперь, когда боевые действия закончились"
 THIRD_BALKAN_WAR.76.d: "Пока Турция и Греция готовятся к мирным переговорам, ясно одно: Греция полностью контролирует Кипр. Победа греков на острове даёт им важные рычаги для переговоров. Когда было объявлено о прекращении огня, в греческих кварталах Кипра начался праздник: солдат забрасывали цветами и сладостями. Однако репортеры отмечают, что в турецких кварталах действует строгий комендантский час, а в районе постоянно находятся вооруженные до зубов патрули. Греческий офицер отметил, что эти патрули предназначены для защиты всех киприотов"
 THIRD_BALKAN_WAR.77.d: "Пока Турция и Греция готовятся к мирным переговорам, ясно одно: Турция полностью контролирует Кипр. Победа турок на острове даёт им важные рычаги для переговоров. Когда было объявлено о прекращении огня, большинство районов, по сообщениям, перешли в состояние затишья. Только в турецких кварталах наблюдается особая активность. Турецкие патрули патрулируют более воинственные греческие кварталы, при этом турецкие офицеры требуют от мирных жителей сдать оружие, чтобы обеспечить всеобщую безопасность"
 THIRD_BALKAN_WAR.78.d: "Пока Турция и Греция готовятся к мирным переговорам, ясно одно: ни одна из сторон не имеет полного военного контроля над Кипром. На линии фронта существует напряженное противостояние между турецкими и греческими солдатами. Офицеры с обеих сторон в частном порядке сообщили журналистам, что опасаются, что незначительный инцидент может вновь разжечь боевые действия. Хотя война началась из-за окончательного статуса Кипра, она распространилась на все Восточное Средиземноморье и турецко-греческую границу. Гражданское население острова всё больше разочаровывается из-за продолжающейся милитаризации острова."
 THIRD_BALKAN_WAR.79.d: "Война с Грецией не закончилась на позитивной ноте. Греция контролирует значительную часть нашей территории и занимает господствующее положение. Однако нам удалось захватить Кипр, что дало нам ценный козырь. Учитывая, что война началась только из-за ситуации на Кипре, наша лучшая надежда - предложить Кипр в обмен на возвращение к довоенным границам на всех остальных фронтах. Это действительно единственная позиция, которую мы можем занять"
 THIRD_BALKAN_WAR.80.d: "Наши войска нанесли решительное поражение турецкой армии на большинстве фронтов в ходе недавнего конфликта. Мы удерживаем значительную часть её территорий. Однако на Кипре нас постигла неудача, и турецкие войска захватили остров. Изначально мы участвовали в конфликте, чтобы завершить Энозис с народом Кипра. Турецкое правительство предложило мирный договор: оно уступит нам Кипр в обмен на возвращение к довоенным границам на всех остальных фронтах. Многие в правительстве выступают за эту сделку, они утверждают что отнятие у Турции других исторических земель может вызвать гнев иностранцев и привлечь в страну большое негреческое население. Захват Кипра обеспечит нашу главную цель и приведет в страну большое патриотическое греческое население. Другие чиновники хотят отказаться от соглашения и сосредоточиться на присоединении более исторически греческих земель"
 THIRD_BALKAN_WAR.81.d: "Греция и Турция объявили о соглашении, которое положит конец их текущему конфликту. Турецкое правительство согласилось передать Кипр Греции и признать её власть на острове в обмен на возвращение к довоенным границам. Греческие военные нанесли Турции крупные поражения, оккупировав огромные территории. Но на Кипре турецкие военные одержали верх, захватив остров и удерживая его до прекращения огня. Соглашение приветствуется в Греции, поскольку правительство страны наконец-то добилось объединения с Кипром. В Турции много разочарований по поводу неудачной войны и отказа от кипрских турок. Несмотря на это, многие турки чествуют свои силы и командиров на Кипре за обеспечение безопасности острова, что спасло Турцию от более унизительного поражения."
 THIRD_BALKAN_WAR.82.d: "Крупный общественный парад с участием военных и гражданских организаций прошел по Афинам. Про-греческие организации с Кипра также прислали своих участников. Парад отмечал успешную военную кампанию Греции против Турции, в результате которой Греция получила Кипр. Мечта об Энозисе наконец-то была достигнута. Многие греки не только празднуют, но и вспоминают тех, кто отдал свои жизни за эту мечту. На Кипр медленно прибывают греческие чиновники и военные, чтобы превратить остров в новую провинцию. Хотя греки-киприоты открыто празднуют новый режим, турецкие жители по-прежнему не уверены в своем будущем."
 THIRD_BALKAN_WAR.83.d: "Проходят большие, гневные демонстрации против турецкого правительства в связи с его действиями в недавней войне с Грецией. Во время конфликта большая часть Турции оказалась под греческой оккупацией. Многие турки считают, что их правительство и военные не смогли защитить их во время боевых действий. Кроме того, огромное возмущение вызывает соглашение о передаче Кипра для возвращения к довоенным границам. Растет страх за будущее турок-киприотов. Некоторые лидеры оппозиции обвиняют правительство в том, что оно жертвует Кипром, чтобы минимизировать масштабы своих неудач в ведении конфликта."
 THIRD_BALKAN_WAR.84.d: "Мы находимся в потрясающей переговорной позиции. Наши силы контролируют основные районы Турции, включая многие исторически греческие земли. Что ещё более важно, Константинополь теперь под нашим флагом. Более активные элементы правительства хотят, чтобы мы воспользовались этой военной победой и добились создания Великой Греции, захватив как можно больше исторически греческих земель. Однако более умеренные элементы опасаются, что такой шаг может вызвать сильную реакцию со стороны США и привести в Грецию слишком много турецкого населения, что ослабит нашу стабильность. Эти элементы призывают правительство добиваться Эдирне и Константинополя, чтобы окончательно вытеснить турок из Европы. Окончательная позиция на переговорах должна быть определена в ближайшее время"
 THIRD_BALKAN_WAR.85.d: "Греция подписала мирный договор с Турцией, подтвердив свой контроль над Эдирне и Стамбулом. Соглашение потрясло турецкую нацию и вызвало панику во многих европейских столицах. Многие обвиняют Грецию в неприкрытых территориальных требованиях, отмечая, что на захваченных ею территориях проживает большое количество турецких граждан, будущее которых представляется неопределенным. Турецкое правительство оказалось не в состоянии противостоять этим требованиям, поскольку оно потерпело военное поражение и потеряло значительную часть своей территории. Соглашение приветствуется во всей Греции как первый шаг в восстановлении Греции в ее исторических границах. В Турции же граждане испытывают почти отчаяние"
 THIRD_BALKAN_WAR.86.d: "Недавний конфликт с Грецией и захват ею нашей европейской территории является серьезным поражением для нашей нации. Многие в стране разгневаны НАТО, спрашивая, какой смысл быть частью альянса, если он не предлагает защиту. Возможно, будущее Турции лежит в другом месте, вдали от США и её союзников. Некоторые в правительстве требуют, чтобы мы пригрозили Соединенным Штатам выходом из организации, другие утверждают, что наша будущая безопасность зависит от продолжения сотрудничества с НАТО."
 THIRD_BALKAN_WAR.87.d: "Наш посол в Турции написал предупреждение о том, что Турция рассматривает возможность выхода из НАТО. Турецкое правительство также намекнуло, что они могут даже посмотреть в сторону Советов. Турция разгневана недавним военным поражением и потерей территории Грецией. Многие в стране считают, что НАТО предала их, не оказав поддержки во время конфликта. У нас есть два варианта: первый - предложить крупный пакет военной и экономической помощи для восстановления турецких вооруженных сил и экономики. Другой вариант - ничего не предлагать, некоторые чиновники предполагают, что эта угроза может быть просто турецким блефом, чтобы получить от нас помощь"
 THIRD_BALKAN_WAR.88.d: "В ответ на наши угрозы потенциального выхода из НАТО, США обещали предоставить крупный пакет вооружений и экономической помощи для восстановления Турции. Они призывают другие страны НАТО помочь нам восстановить наши военные силы сдерживания. Без сомнения, это очень щедрый пакет, но многие турки все еще чувствуют себя преданными НАТО. Американцы настаивают на том, что их пакет помощи может быть предоставлен только до тех пор, пока мы остаемся в НАТО. Правительство должно решить, останется ли оно в НАТО, получит ли помощь или нам следует отклонить это предложение о помощи и провести публичные дискуссии о будущем членстве."
 THIRD_BALKAN_WAR.89.d: "В ответ на наши угрозы о возможном выходе из НАТО, США направили послание от своего президента, призывая нас остаться. Они не предложили никаких гарантий, поддержки или помощи. Это невероятно разочаровывает, учитывая всё что мы потеряли в недавней войне с Грецией. Кабинет министров разгневан реакцией американцев. Единственный вариант, который остался у нашей страны - это провести публичное обсуждение вопроса о том, в интересах ли Турции оставаться членом НАТО или нет"
 THIRD_BALKAN_WAR.90.d: "Правительство Греции пытается извлечь выгоду из своей военной победы над Турцией. Оно требует большую часть Турции, чтобы сформировать 'Великую Грецию'. Если Греция захватит эти территории, это резко изменит баланс сил в регионе. Более того, на этих территориях проживает большое количество негреческого населения. Турция умоляет о помощи. Мы можем оказать давление на Грецию, чтобы она снизила свои требования, угрожая санкциями и другими наказаниями. Международное сообщество, вероятно, поддержит такие действия, поскольку многие опасаются что масштабное расширение территории может привести к крупному гуманитарному кризису. Это также может расширить возможности умеренных в Греции и помешать приверженцам жесткой линии настаивать на крупном территориальном расширении. Другой вариант - не вмешиваться и позволить ситуации развиваться как есть"
 THIRD_BALKAN_WAR.91.d: "Соединенные Штаты послали секретное сообщение нашему правительству. Они настаивают на том, чтобы мы сократили наши территориальные требования или рискуем получить международные санкции и вероятное исключение из НАТО. Альянс не сможет функционировать, если Турция будет настолько ослаблена, что не сможет выполнять свои обязанности. Они также говорят, что наши территориальные требования необоснованны и приведут к еще большей нестабильности. Учитывая негреческое население в этих районах, это справедливое замечание. Умеренные члены кабинета министров настаивают на том, чтобы правительство прислушалось к просьбе американцев. Мы можем получить Константинополь и сохранить наш союз с НАТО. Однако сторонники жесткой линии считают, что Греция переживает момент исторической трансформации, и утверждают, что она должна захватить все территории, какие только возможно."
 THIRD_BALKAN_WAR.92.d: "Греческое правительство отклонило наши просьбы о снижении территориальных требований к Турции. Это значительно ослабит альянс НАТО и создаст ужасный прецедент. Греческое правительство, похоже, опьянено властью после своей победы. Мы должны провести экстренное заседание НАТО, чтобы выработать эффективный ответ. Многие в альянсе считают что Греция не заинтересована в том, чтобы действовать в интересах НАТО и коллективной безопасности. Турецкое правительство и народ будут чувствовать себя совершенно опустошенными из-за потери территории, мы должны заверить их в нашей поддержке, чтобы не рисковать потерей их членства"
 THIRD_BALKAN_WAR.93.d: "Соединенные Штаты созвали экстренное заседание членов НАТО, чтобы обсудить Грецию. Одержав крупную военную победу над Турцией, они настаивают на оккупации значительной части её территории. Это решение не только дестабилизирует регион, но и критически ослабляет Турцию - такое же жизненно важное передовое государство НАТО, как и Греция. Попытки членов НАТО во главе с США оказать давление на Грецию, чтобы заставить ее смягчить свои требования, не увенчались успехом. Греция больше не может быть членом НАТО и будет исключена. Чтобы защитить Турцию от дальнейшей агрессии Греции, будут немедленно введены военные и экономические санкции. Кроме того, страны-члены должны решить, хотят ли они предложить Турции большой пакет военной помощи или военную и экономическую помощь. Некоторые члены считают, что неспособность предложить Турции большую поддержку может привести к её выходу из организации."
 THIRD_BALKAN_WAR.94.d: "После нашей массивной военной победы над Турцией наше правительство раскрыло планы по оккупации огромного количества турецкой территории. Эти земли составляют историческое ядро Греции и должны быть восстановлены. Соединенные Штаты, которые выступают в роли марионетки для Турции, угрожают обширными санкциями со стороны этой страны и других членов НАТО, если мы не уменьшим наши требования. Они заявили, что согласятся на оккупацию Константинополя и европейских турецких территорий, но не более того. Умеренные силы считают, что мы должны прислушаться к предупреждению, указывая на то, что захват гораздо большего количества земель приведет к появлению в стране огромного негреческого населения. Однако есть и более жесткие лидеры, настаивающие на том, чтобы мы не позволяли никакой иностранной державе диктовать нам условия"
 THIRD_BALKAN_WAR.95.d: "Несмотря на международное возмущение, в основном со стороны США, Греция подтвердила, что после военной победы она будет стремиться к контролю над большим количеством турецких земель. Греческое правительство настаивает на том, что это не территориальная экспансия, а освобождение исторически греческих земель. Оно не ответило на вопросы, касающиеся места проживания негреческого населения, которое в настоящее время проживает на этих землях. Эта новость, скорее всего, вызовет бурю негодования в Турции, поскольку в последние дни правительство этой страны пыталось преуменьшить значение этих сообщений. США выразили недовольство реакцией Греции и созвали экстренное совещание НАТО для обсуждения ситуации."
 THIRD_BALKAN_WAR.96.d: "Турецкое население недавно узнало о масштабах территориальных требований Греции. Усилия турецкого правительства по предотвращению новостей о своих военных и территориальных потерях не смогли предотвратить осознание того, что Греция теперь контролирует жизненно важные турецкие города и земли вдоль Средиземного моря. Местные власти в Анкаре были вынуждены вызвать солдат для восстановления порядка после того, как разъяренные турецкие толпы, включая беженцев, вызванных недавними боями, начали нападать на правительственные здания. По всей Турции ощущается чувство глубокого унижения, что привело к сообщениям иностранных репортеров о том, что многие в Турции, похоже, находятся в депрессивном состоянии."
 THIRD_BALKAN_WAR.97.d: "После массового захвата территории Грецией НАТО решила провести экстренное совещание. Все члены согласились с тем, что требования Греции чрезмерны и неприемлемы. Военные и экономические санкции должны быть введены немедленно. Другой вопрос - решение о том, как поддержать Турцию. На данный момент Турция остается членом НАТО, хотя в стране много тех, кто считает, что организация не смогла их защитить. Некоторые страны НАТО считают, что организация должна предоставить обширную военную и экономическую помощь для восстановления Турции и ее отношений с народом. Другие считают, что помощь должна быть направлена только на вооруженные силы, чтобы восстановить их потенциал. Учитывая ослабленное состояние Турции, есть мнение, что оказание любой помощи может быть напрасным"
 THIRD_BALKAN_WAR.98.d: "После экстренного совещания НАТО объявила, что введет экономические и военные санкции против нашей страны. Это чрезмерная реакция на наше справедливое освобождение исторически греческих земель. Наши вооруженные силы одержали подавляющую победу, и мы отказываемся тратить историческую победу на умиротворение иностранных держав. Эти санкции ничего не значат, мы найдем новых партнеров и не будем подчиняться Западу и его лицемерию. Мы не ожидаем большой реакции со стороны нашего собственного народа, который продолжает решительно поддерживать нацию."
 THIRD_BALKAN_WAR.99.d: "После экстренного заседания НАТО альянс согласился оказать нам масштабную военную помощь. НАТО считает, что это необходимо для восстановления нашего военного авторитета, чтобы мы могли выполнить свои обязательства перед альянсом. Что еще более важно, это оборудование позволит нам гарантировать, что жадные греки не попытаются отнять у нас еще больше территорий в будущем. Действительно, некоторые командиры предлагают нам начать размещение новой техники, чтобы подготовиться к будущему освобождению наших потерянных земель. Однако эти обсуждения должны быть закрытыми для НАТО"
 THIRD_BALKAN_WAR.100.d: "После экстренного совещания НАТО, альянс согласился оказать нам масштабную военную и экономическую помощь. НАТО считает, что это необходимо для восстановления нашего военного авторитета и экономики, чтобы мы могли выполнить наши обязательства перед альянсом. Что еще более важно, эта поддержка позволит нам гарантировать, что жадные греки не попытаются отнять у нас еще больше земли в будущем. В ближайшие дни высшее руководство проведет встречи, чтобы убедиться, что эта поддержка может быть эффективно использована для максимизации наших возможностей по противодействию продолжающейся греческой угрозе."
 THIRD_BALKAN_WAR.101.d: "Недавний конфликт с Грецией и захват ею нашей территории продемонстрировали ограниченность нашего союза с НАТО. НАТО имела широкие возможности помочь нам в момент кризиса, но предпочла этого не делать. Та поддержка, которую мы получили, оказалась неэффективной. Многие в стране, особенно в СМИ, указывают на НАТО как на альянс, который требует многого, но мало предлагает взамен. Они также задаются вопросом, учитывая войну в Греции, что опасения по поводу коммунизма могут быть преувеличены. Сторонники НАТО признают, что недавние действия были разочаровывающими, но в целом альянс предлагает Турции много преимуществ и защиты. Кабинет министров соберется, чтобы обсудить будущий статус Турции в НАТО"
 THIRD_BALKAN_WAR.102.d: "Правительство Турции объявило о своем официальном выходе из НАТО. Затем турецкие лидеры выпустили заявление, в котором отметили чувство предательства, которое испытывают все турки, поскольку альянс не смог защитить их от греческой агрессии. Цели НАТО больше не совместимы с интересами Турции. Многие аналитики считают, что Турция стремится сформировать новую, более регионально ориентированную внешнюю политику. Она стремится восстановить свои возможности и быть готовой в будущем вновь противостоять Греции. Среди многих турок также бытует мнение, что угроза коммунизма, как внутренняя, так и внешняя, была в значительной степени сфабрикована пропагандой НАТО."
 THIRD_BALKAN_WAR.103.d: "Война с Турцией закончилась не на позитивной ноте. Турки контролируют большие участки нашей территории и занимают господствующее положение. Однако нам удалось захватить Кипр, что дало нам ценный козырь. Учитывая, что война началась только из-за ситуации на Кипре, наша лучшая надежда - предложить остров в обмен на возвращение к довоенным границам на всех остальных фронтах. Это действительно единственная позиция, которую мы можем занять, хотя наш народ будет страдать от потери, но Энозис не стоит потери единства нации."
 THIRD_BALKAN_WAR.104.d: "В ходе недавнего конфликта наши войска нанесли решительное и решающий удар по греческой армии на большинстве фронтов. Мы удерживаем значительную часть её территорий. Однако на Кипре нас постигла неудача, и греческие войска захватили остров. Изначально мы вступили в конфликт, чтобы защитить турок-киприотов от угрозы культурного уничтожения со стороны греков. Греческое правительство предложило мирный договор: оно уступит нам Кипр в обмен на возвращение к довоенным границам на всех других фронтах. Многие в правительстве поддерживают эту сделку, утверждая, что если мы будем добиваться новых территориальных захватов, не обеспечив безопасность Кипра, это приведет к тому, что большое нетурецкое население будет нуждаться в дорогостоящей оккупации. Однако есть и те, кто считает, что мы должны настаивать на наших завоеваниях, и это обеспечит защиту турок на Кипре"
 THIRD_BALKAN_WAR.105.d: "Многие столицы по всему миру вздохнули с облегчением после сообщений о том, что Греция и Турция согласились на мирные условия. Обе стороны вернутся к довоенным границам при условии, что Греция уступит Кипр Турции. Греческие военные потерпели значительное поражение в ходе конфликта, за исключением Кипра, и использовали его для переговоров о выводе турецких войск с других своих территорий. Важно отметить, что Греция не могла выдвигать никаких условий турецкой администрации на острове. Турецкое правительство похвалило свои вооруженные силы и объявило, что будет изучать пути разрешения ситуации на Кипре к выгоде всех сторон."
 THIRD_BALKAN_WAR.106.d: "Кипр прочно находится под турецким контролем, всего несколько дней назад тысячи кипрских греков скорбно наблюдали, как последние греческие солдаты маршировали на своих кораблях. Турецкие войска быстро выдвинулись для установления порядка в греческих городах, выйдя со своих баз в турецких районах острова. По сообщениям иностранной прессы, турецкие войска в основном игнорируются и избегаются греками, но сообщений о насильственных инцидентах нет. В ближайшие дни турецкий кабинет министров проведет переговоры о том, чтобы либо восстановить прежнюю конституцию и предоставить Кипру независимость, либо сохранить военную оккупацию."
 THIRD_BALKAN_WAR.107.d: "После долгих обсуждений правительство Турции подтвердило, что оно должно сохранить нынешнюю оккупацию Кипра. Оно сослалось на необходимость восстановления стабильности на острове и вытеснения всех иностранных элементов, прежде чем рассматривать другое решение. Турецкие лидеры поспешили подчеркнуть, что это решение не является постоянной оккупацией, и в конечном итоге они хотят видеть Кипр, где все киприоты находятся под защитой закона. Греческое правительство опубликовало заявление, в котором поставило под сомнение целесообразность сохранения военной оккупации на острове. В Греции прошли акции протеста, осуждающие решение Турции. В Турции реакция была в целом благожелательной, большинство турок согласились с тем, что ситуацию на острове необходимо стабилизировать"
 THIRD_BALKAN_WAR.108.d: "Турецкий военный губернатор на Кипре официально передал власть новому временному правительству острова. В ближайшие месяцы должны состояться новые выборы. Турецкий кабинет министров недавно одобрил восстановление прежней конституции, отменив поправки, принятые греками-киприотами, которые стремились поставить Кипр на путь объединения с Грецией. Хотя турецкие власти поспешили заявить, что они восстанавливают инклюзивную конституцию, критики отмечают, что конституция была изменена. Турция указана в качестве гаранта демократии на Кипре, а Энозис запрещен. В Греции прошли масштабные акции протеста, многие осудили Турцию за превращение Кипра в свое государство-клиент."
 THIRD_BALKAN_WAR.109.d: "Наши вооруженные силы при поддержке народа сумели одержать масштабную военную победу над Грецией. Её войска были разбиты, переиграны и побеждены на протяжении всего конфликта. После прекращения огня ООН мы должны начать мирные переговоры с Грецией. Правительство должно определить свою позицию на переговорах, а мы установим условия. Одна группа, в основном умеренные, хочет, чтобы мы взяли территорию, содержащую Кавалу и остров Родос. Это даст нам стратегическое преимущество и гарантирует, что Греция больше никогда не сможет нам угрожать. Более жесткие сторонники считают, что мирный вариант растратит наше преимущество, они хотят вернуть земли, потерянные в Первой Балканской войне, и вновь захватить Северную Грецию. Противники этой точки зрения считают, что международному сообществу это не понравится, и будет трудно присоединить земли с большим нетурецким населением."
 THIRD_BALKAN_WAR.110.d: "После недавней Греко-турецкой войны, Турция оказалась в выигрышном положении. Она контролировала большое количество греческих земель и доминировала в военном отношении. После мирных переговоров обе стороны подтвердили, что Турция получит Кавалу, прилегающие к ней территории и Родос. Аналитики считают, что эта территория позволит турецким военным получить стратегическое преимущество, которое Греции будет нелегко преодолеть в будущем. Греция остается в основном покоренной, но среди ее населения ощущается нарастающий гнев. Турецкое правительство будет удовлетворено результатом, хотя ему придется довольствоваться захватом территории со значительным греческим населением."
 THIRD_BALKAN_WAR.111.d: "После потери территории в недавнем конфликте с Турцией многие в стране ставят под сомнение наше дальнейшее участие в НАТО. Они отмечают, что в последние десятилетия Греция значительно пострадала за вовлечение в более широкие дела Европы. При этом Греция часто остается на периферии. Также многие считают, что угроза коммунизма - это просто продукт пропаганды НАТО, и альянс ничего не предлагает. Несмотря на эту критику, есть и защитники НАТО, которые призывают правительство не выходить из организации. Они считают, что НАТО обеспечивает защиту от экзистенциальных угроз и открывает пути развития для страны. Правительство рассматривает возможность информирования США о том, что оно может пересмотреть свое членство в НАТО."
 THIRD_BALKAN_WAR.112.d: "Наш посол в Греции написал предупреждение о том, что правительство страны рассматривает возможность выхода из НАТО. Греческое правительство также намекнуло, что они могут даже посмотреть в сторону Советов вместо этого. Греция разгневана недавним военным поражением и потерей территории Турцией. Многие в стране считают, что НАТО предала их, не оказав поддержки во время конфликта. У нас есть два варианта: первый - предложить крупный пакет военной и экономической помощи для восстановления греческих вооруженных сил и экономики. Другой вариант - просто призвать их остаться. Некоторые чиновники предполагают, что эта угроза может быть просто блефом Греции, чтобы получить от нас помощь"
 THIRD_BALKAN_WAR.113.d: "В ответ на наши угрозы о возможном выходе из НАТО, США пообещали предоставить крупный пакет вооружений и экономической помощи для восстановления Греции. Они призывают другие страны НАТО помочь нам восстановить наши военные силы сдерживания. Без сомнения, это очень щедрый пакет, но многие греки все еще чувствуют себя преданными НАТО. Американцы настаивают на том, что их пакет помощи может быть предоставлен только до тех пор, пока мы остаемся в НАТО. Правительство должно решить, останется ли оно в НАТО, получит ли помощь, или нам следует отклонить это предложение о помощи и провести публичное обсуждение будущего членства."
 THIRD_BALKAN_WAR.114.d: "В ответ на наши угрозы о возможном выходе из НАТО, США направили послание от своего президента с призывом остаться. Они не предложили никаких гарантий, поддержки или помощи. Это невероятно разочаровывает, учитывая все, что мы потеряли в недавней войне с Турцией\". Кабинет министров разгневан реакцией американцев. Единственный вариант, который остался у нашей страны, - это провести публичные обсуждения о том, в интересах ли Греции оставаться членом НАТО или нет"
 THIRD_BALKAN_WAR.115.d: "По сообщениям, греческие представители покидали встречу с турецкими представителями по поводу мирного договора, призванного положить конец недавней греко-турецкой войне, с шокированным видом. Вскоре выяснилось, что Турция, по сути, потребовала контроля над северной Грецией, требуя все земли, которые она потеряла как Османская империя в Первой Балканской войне. На этих землях проживает большое количество греческого населения и находятся жизненно важные экономические ресурсы. Наши аналитики считают, что это потенциально дестабилизирует регион, приведет к миграции населения и будущим конфликтам. Многие наши европейские союзники испытывают дискомфорт от такой масштабной турецкой экспансии. Президент должен принять решение: либо позволить мирному соглашению состояться, либо заставить Турцию снизить свои требования ради стабильности в регионе"
 THIRD_BALKAN_WAR.116.d: " США тихо сообщили нашим высшим должностным лицам, что мы рискуем столкнуться с санкциями, если продолжим захват северной Греции. Американцы настаивают, что если мы захватим эту территорию, то только увековечим конфликт и вызовем нестабильность во всем регионе. Некоторые из наших собственных чиновников согласны с этим, они считают, что это будет дорого и трудно справиться с оккупацией такого количества греков. Американцы добавили, что они согласны на сокращение соглашения, отдав нам часть территории, но если мы возьмем все требуемые земли, то рискуем получить санкции."
 THIRD_BALKAN_WAR.117.d: "Неожиданным событием стало заявление США о том, что они введут санкции против Турции в связи с чрезмерными, по их мнению, территориальными требованиями к Греции. Американское правительство заявило, что санкции призваны продемонстрировать его озабоченность перспективами мира в регионе. Турецкое правительство опубликовало заявление, в котором выразило недовольство американским решением. Поступают сообщения об антиамериканских демонстрациях, но аналитики не уверены, что эти санкции носят долгосрочный характер из-за их союза с НАТО."
 THIRD_BALKAN_WAR.118.d: "США тихо отменили свои санкции в отношении Турции. Первоначально санкции были введены в ответ на территориальные требования Турции к Греции. В течение предшествующих месяцев Пентагон и Госдепартамент заверяли Конгресс в своей поддержке отмены санкций. Белый дом поддержал эти усилия, утверждая, что Турция остается жизненно важной региональной державой, с которой необходимо взаимодействовать. Турция опубликовала собственное заявление, в котором приветствовала это решение и выразила надежду на возобновление связей"
 THIRD_BALKAN_WAR.119.d: "США послали секретное сообщение нашему правительству. Они настаивают на том, чтобы мы сократили наши территориальные требования или рискуем получить международные санкции и вероятное исключение из НАТО. Альянс не сможет функционировать, если Греция будет резко ослаблена. Они также говорят, что наши территориальные требования необоснованны и приведут к еще большей нестабильности. Учитывая, что в этих районах проживает нетурецкое население, это вполне справедливо. Умеренные члены кабинета министров заставляют правительство прислушаться к просьбе американцев. Мы можем уменьшить наши требования, чтобы получить стратегическое преимущество над Грецией, сохранив при этом наш союз с НАТО. Однако сторонники жесткой линии считают, что Турция переживает момент исторической трансформации, и утверждают, что она должна захватить все территории, какие только сможет."
 THIRD_BALKAN_WAR.120.d: "США и НАТО оказывают давление на Турцию, чтобы она снизила свои требования к Греции после победы. НАТО опасается, что если Турция продолжит свои завоевания, это дестабилизирует регион и вызовет новые конфликты в ближайшие годы. Более того, ослабление Греции и нестабильность на вновь захваченных землях могут сильно помешать возможностям НАТО в Средиземноморье. Однако Турция заявила, что не будет подчиняться диктату, утверждая, что будет настаивать на своих требованиях. Многие турки считают, что они заслужили победу и поддерживают эти усилия."
 THIRD_BALKAN_WAR.121.d: "Турция стремится к масштабным территориальным захватам за счет Греции, которую она победила в недавнем конфликте. Поскольку обе страны являются членами НАТО, организация призвала Турцию проявить сдержанность, ради блага всего альянса, но она отказалась. Было созвано экстренное заседание, организация, безусловно, исключит Турцию и введет санкции. Теперь предстоит решить, оказывать ли помощь Греции. Многие в альянсе считают, что организация должна помочь восстановлению Греции, но есть и те, кто считает, что предоставление помощи может только подстегнуть Турцию к поиску альтернативных союзников, что приведет к еще большей нестабильности."
 THIRD_BALKAN_WAR.122.d: "Турция официально объявила, что займет земли, потерянные Османской империей в Первой Балканской войне. Турецкое правительство утверждает, что эта территория позволит многим туркам вернуться в дома предков и не даст Греции стать угрозой в будущем. Ожидается, что реакция Греции будет крайне резкой, поскольку многие будут опасаться за членов своих семей, которые теперь находятся под турецкой оккупацией. Многие соседние государства выражают глубокую озабоченность тем, что ждет их в будущем."
 THIRD_BALKAN_WAR.123.d: "Захваченное греческое правительство изо всех сил пытается сохранить порядок на фоне растущих беспорядков. Многие греки ошеломлены масштабами своего национального поражения и потерей своего северного сердца. Греция будет бороться с разлукой многих семей из-за новой турецкой оккупации. Международные репортеры говорят о том, что в народе ощущается подавленное настроение, и стране потребуется время, чтобы сплотиться. Ходят слухи, что военные офицеры путешествуют в гражданской одежде, чтобы избежать оскорблений со стороны общественности."
 THIRD_BALKAN_WAR.124.d: "После экстренного совещания НАТО объявила, что введет экономические и военные санкции против нашей страны. Это чрезмерная реакция на наше справедливое освобождение земель, с которых наш народ был жестоко изгнан. Наши вооруженные силы одержали ошеломляющую победу, и мы отказываемся разбазаривать их историческую победу, чтобы умиротворить иностранные державы. Эти санкции ничего не значат, мы найдем новых партнеров и не будем подчиняться диктату Запада и его лицемерию. Мы не ожидаем большой реакции со стороны нашего собственного народа, который продолжает решительно поддерживать нацию."
 THIRD_BALKAN_WAR.125.d: "После экстренного заседания НАТО, альянс договорился о предоставлении нам масштабной военной помощи. НАТО считает, что это необходимо для восстановления нашего военного авторитета, чтобы мы могли выполнить свои обязательства перед альянсом. Что еще более важно, это оборудование позволит нам гарантировать, что жадные греки не попытаются отнять у нас еще больше земли в будущем. Действительно, некоторые командиры предлагают нам начать размещение новой техники, чтобы подготовиться к будущему освобождению наших потерянных земель. Однако эти обсуждения должны быть закрытыми для НАТО"
 THIRD_BALKAN_WAR.126.d: "После экстренного совещания НАТО, альянс согласился предоставить нам масштабную военную и экономическую помощь. НАТО считает, что это необходимо для восстановления нашего военного авторитета и экономики, чтобы мы могли выполнить наши обязательства перед альянсом. Что еще более важно, эта поддержка позволит нам гарантировать, что жадные турки не попытаются отнять у нас еще больше земель в будущем. В ближайшие дни высшее руководство проведет встречи, чтобы убедиться, что эта поддержка может быть эффективно использована для максимизации наших возможностей по противодействию продолжающейся турецкой угрозе"
 THIRD_BALKAN_WAR.127.d: "Недавний конфликт с Турцией и захват ею нашей территории показали ограниченность нашего союза с НАТО. НАТО имела широкие возможности помочь нам в момент кризиса, но предпочла этого не делать. Та поддержка, которую мы получили, оказалась неэффективной. Многие в стране, особенно в средствах массовой информации, указывают на НАТО как на альянс, который требует многого, но мало предлагает взамен. Они также задаются вопросом, учитывая недавнюю войну, что опасения по поводу коммунизма могут быть преувеличены. Сторонники НАТО признают, что недавние действия были разочаровывающими, но в целом альянс предлагает Турции много преимуществ и защиты. Кабинет министров встретится, чтобы обсудить будущий статус Греции в НАТО"
 THIRD_BALKAN_WAR.128.d: "Недавняя греко-турецкая война закончилась безрезультатно. Ни одна из сторон не смогла добиться доминирующего положения над другой. Пропаганда в обеих странах стремилась подчеркнуть свои военные успехи и преуменьшить неудачи. Правительствам обеих стран придется объяснять, почему их сторона не добилась подавляющей победы. Действительно, газеты обеих стран вместо этого сосредотачиваются на историях героизма и преуменьшают отсутствие ощутимых результатов. На международном уровне чувствуется облегчение, поскольку многие опасались, что продолжение конфликта или смена территории будет означать для региона в долгосрочной"
 THIRD_BALKAN_WAR.129.d: "'Радио Каира' подтвердило, что Объединенная Арабская Республика официально установила контроль над Хатаем у Турции. Поступают сообщения о массовых празднованиях по всему арабскому миру, войска ОАР танцуют на улицах вместе с жителями Хатая. ОАР вторглась в Хатай во время недавней греко-турецкой войны, воспользовавшись конфликтом. Их войскам удалось захватить территорию и удерживать её на протяжении всего конфликта. Турецкое правительство подтвердило потерю территории, но пообещало, что никогда не забудет предательства, которое оно пережило. Хотя ОАР будет радоваться своей победе, многие аналитики считают, что она приобрела постоянного врага в Турции, что усугубляет ее проблемы с безопасностью."
 THIRD_BALKAN_WAR.130.d: "Объединенная Арабская Республика пыталась нанести нам удар в спину во время недавней греко-турецкой войны. Они хотели захватить Хатай на хлипких основаниях арабского единства. Предсказуемо, наши силы отразили вторжение и продвинулись вглубь их территории. В конце конфликта мы контролируем северную Сирию, включая исторический город Алеппо. Перед нами стоят три варианта: либо вернуть захваченные земли, либо навсегда оккупировать северную Сирию, либо установить дружественное сирийское правительство. Возвращение территории восстановит отношения и восстановит предвоенную ситуацию, наша победа доказала, что они не могут нас победить. Аннексия земель могла бы дать нам буфер для наблюдения за ОАР, но мы рискуем сделать их постоянным врагом. Наконец, создание сирийского правительства дает нам жизнеспособное буферное государство и может угрожать единству Объединенной Арабской Республики."
 THIRD_BALKAN_WAR.131.d: "Турция объявила, что ее войска освобождают земли, захваченные ею у Объединенной Арабской Республики во время недавней Греко-турецкой войны. Турецкое правительство заявило, что его операции носили чисто оборонительный характер, и оно не имело никаких территориальных амбиций. Многие аналитики считают, что Турция не хотела брать на себя ответственность за оккупацию арабских земель и более глубокое вовлечение в дела Ближнего Востока. Турецкие военные также продемонстрировали свое военное превосходство над противником. ОАР преуменьшает значение этого заявления, пытаясь представить вывод войск как свидетельство того, что её военные успешно нанесли достаточный урон, чтобы заставить турок отступить. Прибытие беженцев и отступающих войск в города ОАР в значительной степени ограничило эффективность этой пропаганды."
 THIRD_BALKAN_WAR.132.d: "Турецкое правительство подтвердило, что его силы контролируют Алеппо и север Сирии. Они не сообщили, будет ли эта оккупация временной или постоянной. Представитель турецких военных отметил, что попытка вторжения Объединенной Арабской Республики во время недавно завершившейся Греко-турецкой войны означает необходимость сохранения сил для наблюдения за намерениями ОАР. Объединенная Арабская Республика осудила это заявление, заявив, что добьется отмщения и освободит всех арабов, находящихся под турецким игом. Несмотря на смелое заявление и агрессивную пропаганду, многие граждане ОАР, как говорят, разгневаны на своих гражданских и военных лидеров, которых они винят в поражении."
 THIRD_BALKAN_WAR.133.d: "В ходе крупного события турецкие военные официально передали управление северной Сирией вновь созданной Сирийской Республике. Многие сирийские националисты, включая тех, кто бежал с территории Объединенной Арабской Республики, стекаются, чтобы присоединиться к новому режиму. Сообщается, что несколько националистов, служивших в вооруженных силах ОАР, также дезертировали. Турция пообещала поддержать новый режим, поскольку его лидеры призвали к освобождению Сирии от оккупации ОАР. Иностранные дипломаты рассматривают новое государство как турецкий буфер, а его националистическую пропаганду - как мощную угрозу панарабской идеологии ОАР. Каир осудил это событие, заявив, что новый режим является марионеткой турецкого империализма, а те, кто присоединяется к нему, - враги арабского народа. Поступают сообщения о беспорядках в Дамаске"
 THIRD_BALKAN_WAR.134.d: "Недавний конфликт с Турцией и захват ими нашей территории высветил ограниченность нашего союза с НАТО. НАТО имела широкие возможности помочь нам в момент кризиса, но предпочла этого не делать. Та поддержка, которую мы получили, оказалась неэффективной. Многие в стране, особенно в средствах массовой информации, указывают на НАТО как на альянс, который требует многого, но мало предлагает взамен. Они также задаются вопросом, учитывая недавнюю войну, что опасения по поводу коммунизма могут быть преувеличены. Сторонники НАТО признают, что недавние действия были разочаровывающими, но в целом альянс предлагает Турции много преимуществ и защиты. Кабинет министров встретится, чтобы обсудить будущий статус Греции в НАТО"
 THIRD_BALKAN_WAR.135.d: "Правительство Греции объявило о своем официальном выходе из НАТО. Затем греческие лидеры опубликовали заявление, в котором отмечается чувство предательства, которое испытывают все греки, поскольку альянс не смог выполнить свои основные обязательства. Цели НАТО больше не совместимы с интересами Греции. Многие аналитики считают, что Греция будет стремиться к формированию новой, менее глобально ориентированной внешней политики. Она будет стремиться к партнерству, которое позволит ей расширить свои возможности на случай нового столкновения с Турцией. Многие греки сейчас считают, что НАТО играет в фаворитов и не имеет подлинной приверженности защите демократии в Европе"
 THIRD_BALKAN_WAR.136.d: "Югославия пыталась присоединиться к греческому крестовому походу против нас и была разбита нашими храбрыми солдатами. Мы оккупировали их землю и можем диктовать мир. Многие наши высокопоставленные чиновники согласны с тем, что если мы попытаемся расширить территорию или навязать слишком жесткие условия, то только прибавим себе врагов. Вместо этого они предлагают ввести компенсацию за войну и демилитаризованную границу. Это поможет нам сосредоточиться на обеспечении наших завоеваний в Греции без северной угрозы. Однако некоторые утверждают, что мы должны предоставить независимость Македонии и сделать её буферной зоной. Решение должно быть принято"
 THIRD_BALKAN_WAR.137.d: "Турецкое правительство объявило о достижении соглашения о прекращении военных действий с Югославией. Оно выведет свои войска при условии, что Югославия демилитаризует свою границу с Турцией и выплатит компенсацию за войну. Югославское правительство спокойно подтвердило эти условия. Учитывая, что югославские военные понесли большие потери в конфликте, условия оказались не такими жесткими, как ожидали некоторые. Многие эксперты считают, что турецкое правительство стремилось минимизировать риск сближения Югославии и Греции из желания отомстить. Похоже, что в обозримом будущем Турция может стать ведущей региональной державой"
 THIRD_BALKAN_WAR.138.d: "Турецкое правительство объявило о создании Республики Македония. В своем заявлении оно отметило, что македонский народ давно требовал независимости от югославского господства, и Турция её предоставила. Югославское правительство выразило протест, но не стало угрожать военным ответом. Учитывая военное поражение, которое потерпела Югославия, она, скорее всего, не сможет ответить в течение некоторого времени. Создание Македонии делает Турцию авторитетной державой в регионе"
 THIRD_BALKAN_WAR.139.d: "Коррумпированный албанский режим пытался объединиться с Грецией против нас, но был разбит нашими храбрыми солдатами. Мы оккупировали их землю и можем диктовать мир. Турецкий и албанский народы давно имеют глубокую историческую связь. Наши силы в Албании сообщают, что народ расстроен и боится правительства. Наши собственные аналитики отмечают, что режим нелегитимен и жесток. После нашей победы над Грецией и усиления присутствия в регионе лучшим решением будет сменить албанский режим. Мы предоставим албанскому народу нашу защиту и поддержку, пока он строит новое государство. Приказы будут отданы в ближайшее время"
 THIRD_BALKAN_WAR.140.d: "В захватывающей ночной операции турецкие силы, работая с албанскими союзниками, свергли правительство. Утром новое правительство объявило о своем создании. В своем заявлении турецкое правительство похвалило албанский народ за возвращение контроля над своей страной. Установление нового, протурецкого режима в Тиране значительно укрепило власть Турции на Балканах. Во время недавней Греко-турецкой войны Албания потерпела крупное поражение, и её правительство не смогло противостоять захвату власти при поддержке Турции. Наблюдатели отмечают, что действия Турции способствовали закреплению её позиций в регионе."
 THIRD_BALKAN_WAR.141.d: "Кризис Энозиса начался после краха согласованной на международном уровне конституции Кипра. Новый режим провозгласил Энозис или объединение с Грецией. Турецкие военные на острове захватили северную часть острова, утверждая, что они защищают турок-киприотов от угнетения. Это ставит нашего союзника по НАТО Турцию на путь столкновения с советским союзником Грецией. Высокопоставленные военные чиновники считают, что мы должны сказать американцам, что поддерживаем Турцию и её справедливые аргументы в защиту интересов всех киприотов. Другие чиновники считают, что наш собственный опыт показал, что Кипр нельзя приручить, и он не стоит мировой войны. Мы должны определиться с нашей позицией по этому вопросу и проинформировать Соединенные Штаты"
 THIRD_BALKAN_WAR.142.d: "Британский посол недавно встретился с президентом, чтобы обсудить кризис энозиса на Кипре. Он отметил, что Соединенное Королевство имеет большой опыт работы с островом и пришел к выводу, что действия Турции, хотя и поспешные, были оправданы. Если коммунистическому греческому режиму не будет брошен вызов, это может способствовать возникновению подобных коммунистических заговоров в регионе и вдоль границ других стран НАТО. Отказ поддержать Турцию также может быть расценен не только как умиротворение, но и как предательство союзника. Посол добавил, что на данный момент Соединенное Королевство будет держать свое мнение в тайне и следовать нашему примеру в этом вопросе."
 THIRD_BALKAN_WAR.143.d: "Британский посол недавно встретился с президентом, чтобы обсудить кризис энозиса на Кипре. Он отметил, что Соединенное Королевство имеет большой опыт работы с островом и пришел к выводу, что действия Турции были безрассудными. Соединенное Королевство рекомендует нашему правительству надавить на Турцию, чтобы она вывела войска и не позволила втянуть НАТО в мировую войну из-за Кипра. Хотя многие могут рассматривать отказ поддержать Турцию как уступку требованиям коммунистов, это не так\". Посол добавил, что Соединенное Королевство пока не будет высказывать свое мнение и последует нашему примеру в этом вопросе"
 THIRD_BALKAN_WAR.144.d: "В качестве ответной реакции турецкие войска оккупировали Северный Кипр. Это вызвало крупный международный кризис, поскольку поставило Турцию, нашего союзника по НАТО, во враждебное положение по отношению к Греции, советскому союзнику. Турция справедливо считает, что за крахом кипрской конституции стоят греческие махинации. Однако поддержка действий Турции может привести к конфликту с Советским Союзом. Такой конфликт был бы катастрофическим для Турции, поскольку она оказалась бы в состоянии войны на два фронта. В результате некоторые чиновники говорят, что мы должны пригрозить Турции исключением из НАТО, если она не уйдет. Другие чиновники считают, что отказ от поддержки Турции - это умиротворение, и мы должны оставаться верными нашему союзнику. Великобритания, которая контролировала обширную "
 THIRD_BALKAN_WAR.145.d: "Недавно США направили высокопоставленную делегацию в Анкару для однодневного обсуждения вопроса о Кипре. За закрытыми дверями американцы недвусмысленно заявили, что ожидают от нас вывода войск с Кипра и деэскалации кризиса. Американцы заявили, что мы в одностороннем порядке обострили ситуацию и теперь мир находится под угрозой глобальной войны. Они добавили, что такой конфликт поставит нас в ситуацию войны на два фронта, когда Советский Союз будет атаковать с востока. Ясно, что если ситуация на Кипре обострится, США исключат нас из НАТО и оставят нас перед лицом подавляющего коммунистического вторжения. Многие в кабинете министров сейчас выступают за выход, американцы заявили, что они поддержат будущее соглашение о защите турок-киприотов. Однако некоторые чиновники считают, что США блефуют и политически не могут допустить крупной победы коммунистов. Мы должны решить, как действовать дальше"
 THIRD_BALKAN_WAR.146.d: "Иностранные репортеры и греческие силы на Кипре подтвердили вывод турецких войск с северного Кипра. Турецкое правительство не подтвердило эту новость. Многие наблюдатели связывают вывод войск с недавним визитом в Анкару высокопоставленной делегации из США. Похоже, что США и НАТО не были заинтересованы в поддержке турецкого решения о захвате северной части острова. Греческое правительство опубликовало заявление, в котором пообещало, что все граждане Кипра, независимо от их принадлежности, будут пользоваться процветанием и защитой в условиях революции."
 THIRD_BALKAN_WAR.147.d: "После нашего предупреждения Турции о продолжении эскалации кризиса на Кипре, её правительство направило сигнал, что не выведет свои войска. Турция утверждает, что если её войска будут выведены, они обрекут турок-киприотов на уничтожение. Оно добавило, что Турция не будет стремиться захватить остров или начать вооруженный конфликт, но не может вывести войска. Теперь перед нами стоит сложный выбор: мы можем выполнить свое обещание и созвать экстренное заседание НАТО для изгнания Турции. Или мы можем подождать и посмотреть, как все будет развиваться, возможно, начать диалог с Советами о деэскалации ситуации. Отказ от Турции на данном этапе может привести к крупному дипломатическому провалу и открыть дверь для коммунистического вторжения в Турцию"
 THIRD_BALKAN_WAR.148.d: "На ошеломляющем экстренном заседании НАТО проголосовало за исключение Турции из организации. Турцию обвинили в том, что она опасно толкает альянс в глобальный конфликт для удовлетворения собственных интересов. Турция поспешила обвинить организацию в лицемерии, отметив, что её предали так называемые союзники. Поступают сообщения о протестах перед посольствами стран-членов НАТО в Анкаре. Также сообщается, что турецкое правительство требует немедленного сокращения дипломатических миссий НАТО в пределах своих границ. Голосование оказалось спорным, и ходят слухи, что некоторые члены НАТО сомневаются, не сделало ли это решение альянс импотентом."
 THIRD_BALKAN_WAR.149.d: "По частным каналам американцы вышли на связь. Они все больше обеспокоены продолжающимся кризисом на Кипре. Они считают, как и многие наши официальные лица, что будет катастрофично, если конфликт с Грецией или Турцией перерастет в глобальный конфликт. Американцы предлагают нам надавить на Грецию и Турцию, чтобы они согласились на раздел острова, с обещанием в конечном итоге разрешить конфликт путем двусторонних обсуждений. Очевидно, что разговоры в западных СМИ о том, что США не поддержат Турцию в конфликте, не соответствуют действительности. Наши дипломаты подтвердили, что американцы останутся верны Турции, но стремятся к деэскалации кризиса"
 THIRD_BALKAN_WAR.150.d: "В качестве неожиданного шага США и Советский Союз выпустили совместное заявление, в котором утверждалось, что кризис на Кипре скоро будет разрешен. Ни греческое, ни турецкое правительство не сообщили, что такой план находится в разработке, что породило слухи о том, что две крупные державы пришли к соглашению без них. Некоторые официальные лица обеих стран в частном порядке подтвердили, что им сообщили о плане лишь за несколько часов до его обнародования и заставили согласиться с ним. Детали плана предусматривают раздел Кипра, при котором Турция оккупирует турецкие районы, а Греции достанется остальная часть острова. Греция и Турция также согласились в конечном итоге достичь двустороннего решения для окончательного урегулирования вопроса"
 THIRD_BALKAN_WAR.151.d: "После интенсивных переговоров при посредничестве США и Советского Союза кипрский кризис, похоже, был разрешен. Турция возьмет под контроль северный Кипр, чтобы контролировать турецкую общину на острове. Остальная часть острова будет контролироваться Грецией. Обе стороны согласились решить этот вопрос путем двусторонних обсуждений. Националисты в обеих странах, как говорят, разгневаны, многие считают, что иностранное давление заставило их принять решение. Несмотря на это, обе страны снижают уровень военной боеготовности. Турецкие и греческие силы на острове устанавливают рабочую границу"
 THIRD_BALKAN_WAR.152.d: "Во время экстренного совещания между правительственными и военными руководителями обсуждался вопрос о том, следует ли просить у Советского Союза разрешения выдвинуть ультиматум против Турции. Недавнее решение НАТО об исключении Турции привело к их изоляции. Многие из высших военных руководителей считают, что нынешняя ситуация дает нам возможность одержать победу. Единственный недостаток - если Советы откажутся поддержать нас, мы не сможем настаивать на военном решении на Кипре. В конечном итоге правительство должно решить, какие действия предпринять"
 THIRD_BALKAN_WAR.153.d: "Греческое правительство хочет получить наше согласие на то, чтобы позволить им выдвинуть ультиматум против Турции. Они хотят, чтобы Турция вывела свои войска с Кипра или была принудительно выселена. Греция отметила, что НАТО недавно выдворило Турцию из-за её действий на Кипре. Они отмечают, что это может быть лучшей возможностью воспользоваться этим. Многие высокопоставленные чиновники согласны с такой оценкой, но есть и те, кто считает, что мы должны отклонить просьбу Греции. Вместо этого, по их мнению, мы могли бы использовать эту возможность, чтобы склонить Турцию к тесным связям с нами. Привлечение Турции в нашу сферу полностью обезопасит наш южный фронт. Отказ также может разозлить греческое правительство. Решение должно быть принято в ближайшее время"
 THIRD_BALKAN_WAR.154.d: "Советское правительство отклонило нашу просьбу предъявить ультиматум Турции за её вопиющее вмешательство на Кипре. Это очень разочаровывающая новость, поскольку мы были уверены, что ситуация складывается в нашу пользу. Наши ведущие эксперты в области обороны опасаются, что бездействие сейчас может дать Турции время, необходимое для подготовки к любым действиям. Советы лишь заявили, что момент для каких-либо действий неподходящий. Наш посол в Москве считает, что на советское решение повлияло несколько факторов. Некоторые в их правительстве считают, что конфликт с Турцией может привести к более широкой войне с Западом. Есть также мнение, что Турция может стать потенциальным местом революционной активности в будущем. Независимо от этого, мы должны следовать их решению и доверять ему"
 THIRD_BALKAN_WAR.1540.d: "Коммунистический режим в Греции недавно выдвинул ультиматум, призывающий нас вывести наши войска с Кипра. Это поставило бы под угрозу местное кипрское турецкое население и оттолкнуло бы наш народ. Однако очевидно, что Советский Союз планирует оказать помощь Греции, тем более что НАТО не поддерживает нас, и мы находимся в международной изоляции. Есть серьезные сомнения в том, как долго мы сможем сдерживать мощный натиск коммунистов. Многие высокопоставленные чиновники призывают правительство вывести войска с Кипра, избежать войны и дождаться лучших времен, чтобы поддержать наших братьев на Кипре. Решение о том, как поступить, остается за правительством"
 THIRD_BALKAN_WAR.155.d: "Турецкое правительство объявило, что выведет своих солдат с Кипра. Оно заявило, что это решение не связано с греческим ультиматумом, а потому что турецкое правительство хочет сначала исчерпать все мирные варианты. Похоже, что вероятное вмешательство Советского Союза в случае конфликта подтолкнуло турецкое правительство к тому, чтобы отступить и избежать конфликта. Многие видные турки-киприоты, как говорят, уходят вместе с турецкими силами, поскольку опасаются преследования или задержания со стороны греческого правительства. По всей стране прошли мрачные митинги в знак солидарности с турками-киприотами."
 THIRD_BALKAN_WAR.156.d: "По указанию высшего военного командования премьер-министр провел совещание за закрытыми дверями. После этого, по сообщениям вспомогательных служб, премьер-министр выглядел потрясенным. На следующее утро он созвал заседание кабинета министров и сообщил правительству, что Турция немедленно выведет свои войска с Кипра. Это полный поворот в политике, который фактически положит конец кипрскому кризису в пользу Греции. Ходят слухи, что генералы, опасаясь экзистенциальной угрозы, исходящей от вероятной советской интервенции на стороне Греции, угрожали отобрать власть у правительства, если оно не изменит курс. Если слухи правдивы, то это действительно черный день для турок-киприотов и демократии в Турции"
 THIRD_BALKAN_WAR.157.d: "Во время экстренного совещания между правительственными и военными руководителями обсуждался вопрос о том, следует ли просить у Советского Союза разрешения выдвинуть ультиматум против Турции. Многие из высших военных руководителей считают, что нынешняя ситуация дает нам возможность одержать победу. Однако это может привести к вмешательству НАТО. Некоторые в Советском Союзе, конечно, приветствовали бы возможность выступить против НАТО и США. Единственный недостаток - если Советский Союз откажется поддержать нас, мы не сможем настаивать на военном решении на Кипре. В конечном итоге правительство должно решить, какие действия предпринять"
 THIRD_BALKAN_WAR.158.d: "Греческое правительство хочет получить наше согласие на то, чтобы позволить им выдвинуть ультиматум против Турции. Они хотят, чтобы Турция вывела свои войска с Кипра или была насильно выселена. Греция отметила, что ультиматум может привести к риску интервенции НАТО, но они готовы поддержать нас на всем пути. Они отмечают, что это может быть лучшей возможностью противостоять Западу. Многие высокопоставленные чиновники согласны с такой оценкой, но есть и те, кто считает, что мы должны отклонить просьбу Греции. По мнению этих чиновников, риск тотального конфликта с НАТО ради удовлетворения территориальных требований Греции не стоит таких рисков. Решение должно быть принято в ближайшее время"
 THIRD_BALKAN_WAR.159.d: "Коммунистический режим Греции недавно выдвинул ультиматум против Турции. Они призывают Турцию уйти с Кипра или быть насильно выселенной. Турция - союзник НАТО, и мы обязаны защищать их в рамках коллективной обороны. Однако такой конфликт, скорее всего, перерастет в конфликт с Советским Союзом. Недавно мы провели экстренное заседание Совета национальной безопасности. Некоторые военные руководители считают, что мы должны твердо стоять на стороне Турции и противостоять коммунистической угрозе в Восточной Европе. Другие официальные лица выразили серьезную озабоченность по поводу такого конфликта. Вместо этого они предлагают нам обратиться к Советскому Союзу и настаивать на мирном урегулировании. Решение должно быть принято"
 THIRD_BALKAN_WAR.160.d: "После неудачных переговоров и истечения срока ультиматума Греции, турецкие и греческие войска, как говорят, ведут бои на Кипре и вдоль международной границы. Греция, член Варшавского договора, и Турция, член НАТО, также втянули в конфликт свои соответствующие альянсы. Советский Союз выступил с заявлением о том, что его войска вмешаются в конфликт ради международного мира. США заявили, что окажут полную поддержку для защиты народа Турции от угрозы международного коммунизма. Новости о боевых действиях вызывают шок во всем мире, поскольку есть опасения, чем может обернуться дальнейшая эскалация конфликта."
 THIRD_BALKAN_WAR.161.d: "Наши войска и храбрые союзники одержали ошеломляющую победу над НАТО в Турции. Враги пролетариата были справедливо повержены. Мы еще раз продемонстрировали, что империалистические пешки не могут остановить волю народа. Греческое правительство хочет захватить большую часть Турции, чтобы восстановить историческую территорию Греции. Наши собственные чиновники считают, что мы должны захватить восточную Турцию, включая Карс, чтобы обеспечить безопасность нашего южного фланга. Однако есть и те, кто считает, что такие территориальные требования могут лишь создать долгосрочные проблемы и возможности для использования нашими врагами в будущем. Вместо этого они предлагают более скромные территориальные претензии, чтобы окончательно ослабить Турцию и избежать будущих проблем. Мы должны решить, какого подхода придерживаться"
 THIRD_BALKAN_WAR.162.d: "Советский Союз и его союзники заявили, что хотят выдвинуть обширные территориальные претензии к Турции. Советы и греки стремятся реализовать территориальные претензии Греции к Турции после Первой мировой войны. Кроме того, Советы хотят захватить Карс и прилегающие территории, чтобы выступить в качестве буфера. Учитывая нынешнюю военную ситуацию, мы мало что можем сделать, чтобы остановить эту потерю территории. Наибольшее беспокойство вызывает реакция Турции. Эта неудача может заставить их пересмотреть свои отношения с НАТО, если мы не сможем предложить поддержку. Крупнейшие газеты обрушиваются с критикой на наши усилия в недавнем конфликте."
 THIRD_BALKAN_WAR.163.d: "Советский Союз и его союзники заявили о своем желании предъявить обширные территориальные претензии к Турции. Похоже, что Советы и Греция стремятся ограничить свои территориальные претензии Эдрином, Стамбулом и Карсом. Потеря такой территории ослабит Турцию и обеспечит Советам буфер. Наибольшее беспокойство вызывает реакция Турции. Эта неудача может заставить их пересмотреть свои отношения с НАТО, если мы не сможем предложить поддержку. Крупнейшие газеты обрушиваются с критикой на наши усилия в недавнем конфликте"
 THIRD_BALKAN_WAR.164.d: "Наша страна потерпела крупное поражение в недавнем конфликте с Варшавским договором. Наш альянс НАТО не предоставил той защиты и поддержки, на которую мы рассчитывали. Многие в стране горько разочарованы и боятся, что территориальные требования искалечат нашу нацию и разделят турецкий народ. Есть некоторые чиновники, которые считают, что мы должны сами обратиться к Советам. Мы можем предложить некоторые территориальные уступки, например, отказаться от Кипра и уступить Карс Советам, чтобы удовлетворить их интересы в области безопасности. Что более важно, мы также пообещаем выйти из НАТО и сохранить нейтралитет. Это успокоит советские опасения и значительно ослабит НАТО. Однако есть официальные лица, которые считают, что это предложение, хотя и сохранит территорию, но сделает нас уязвимыми для будущей агрессии"
 THIRD_BALKAN_WAR.165.d: "Турецкое правительство недавно прислало нам частное предложение о мире. Они, без сомнения, опасаются земель, которые они потеряют в любом мирном предложении из-за их глупой ассоциации с НАТО. Турецкое предложение предлагает нам восточные территории и навсегда отдает Кипр Греции. Более интригующим является то, что Турция обещает выйти из НАТО и сохранять строгий нейтралитет. Многие наши чиновники считают, что это предложение может устранить НАТО как угрозу из Восточного Средиземноморья и нанести серьезный удар по США. Однако в правительстве есть и другие, которые считают, что мы добились такой крупной победы, что не должны упускать эту возможность распространить свое влияние."
 THIRD_BALKAN_WAR.166.d: "Шокирующим событием стало объявление Советского Союза о достижении соглашения с Турцией о прекращении конфликта между НАТО и Варшавским договором из-за Кипра. Турция согласилась полностью отказаться от любых территорий и претензий на Кипр. Она также разрешит советскую оккупацию Карса и прилегающих районов для обеспечения мира. Что еще более важно, Турция выйдет из НАТО, аннулирует любые соглашения с альянсом и сохранит строгий нейтралитет. США выразили свое разочарование этой новостью, в то время как турецкое правительство многие турки хвалят за то, что оно спасло миллионы своих граждан от иностранной оккупации. Однако многие наблюдатели отмечают, что Турция, возможно, лишь отсрочила будущую агрессию."
 THIRD_BALKAN_WAR.167.d: "Афины и Москва подтвердили, что Варшавский договор захватит обширные турецкие территории. Греческое правительство отметило, что восстановило исторические земли Греции, включая Константинополь. Сообщается, что Советский Союз устанавливает гарнизон в Карсе, где его силы создают буферную зону на востоке Турции. Учитывая масштабы поражения Турции и НАТО в ходе конфликта, её дипломаты лишь выступили с протестами против коммунистической экспансии. Турецкое правительство пока отказывается комментировать ситуацию, хотя источники в Анкаре сообщают, что среди политических и военных лидеров существует искреннее чувство отчаяния. Несмотря на территориальные завоевания, некоторые аналитики предупреждают, что и Греция, и Советский Союз должны найти способ управлять значительным турецким населением, сопротивляющимся их правлению."
 THIRD_BALKAN_WAR.168.d: "Советский Союз, выступая от имени своих союзников по Варшавскому договору, объявил, что его союзник Греция захватит все европейские земли, принадлежащие Турции, включая Константинополь. Он также подтвердил, что его войска займут буферную зону на востоке Турции с центром вокруг Карса. Потеря Стамбула и Карса приведет к экономическому, культурному и географическому ослаблению Турции, но потерянные территории не столь значительны, как некоторые считают. Эксперты предполагают, что Советы не верят, что Греция сможет поглотить все территории, на которые она претендовала. Греческое правительство объявило национальный праздник в честь победы своей революции над империалистами. Турецкое правительство в Анкаре, как говорят, готовится к наплыву беженцев"
 THIRD_BALKAN_WAR.169.d: "Недавний конфликт с Грецией и её коммунистическими союзниками закончился катастрофой. Наши союзники по НАТО не смогли должным образом поддержать нас на поле боя, что привело к военному поражению. Теперь миллионы турок находятся под властью коммунистов, и наша нация находится в самом уязвимом месте. В Великом национальном собрании растущая фракция политических лидеров требует, чтобы мы вышли из НАТО. Они считают, что альянс потерпел неудачу и новый виток боевых действий может привести к концу республики. Возможно, они правы, и нам следует покинуть альянс и начать новый путь. Многие высокопоставленные сотрудники служб безопасности выступают против этого, отмечая, что без защиты НАТО коммунисты могут просто закончить работу. Вместо этого, говорят они, мы должны сначала обратиться к США и попросить поддержки. Если американцы откажутся помочь нам в восстановлении, тогда не останется другого выбора, кроме как покинуть НАТО"
 THIRD_BALKAN_WAR.170.d: "Турция официально вышла из альянса НАТО. Ее лидеры сослались на необходимость восстановления Турции и её неспособность выполнить экономические или военные обязательства перед альянсом. В Турции эта новость встретила широкую поддержку, поскольку многие турки обвиняют альянс в предательстве Турции и недостаточной поддержке во время недавнего конфликта с коммунистической Грецией и её союзниками. НАТО выпустила собственное заявление, в котором выразила разочарование этим решением. В резком последующем заявлении Министерство иностранных дел Турции сообщило, что ожидает немедленного вывода всего персонала НАТО из страны и что оно пересмотрит уровень дипломатических представительств НАТО в стране."
 THIRD_BALKAN_WAR.171.d: "Мы получили сообщение из нашего посольства в Анкаре, что турецкое правительство хочет получить от нас крупный пакет помощи. Турция сильно пострадала в недавнем конфликте между НАТО и Варшавским договором, и многие в Турции винят Соединенные Штаты в том, что они не предотвратили их поражение. Сотрудники посольства считают, что Турция не просит о помощи публично, так как это могло бы вызвать антиамериканские настроения. Вместо этого они считают, что американское предложение успокоит напряженность и восстановит веру в НАТО. Отказ от серьезной поддержки, скорее всего, приведет к тому, что Турция покинет НАТО. Есть много советников, которые поддерживают предложение пакета помощи, однако есть и те, кто считает, что нынешнее положение Турции делает её обузой, и позволить ей покинуть НАТО может быть в наших интересах."
 THIRD_BALKAN_WAR.172.d: "США объявили, что они предложат массивный пакет помощи, чтобы помочь восстановить турецкие вооруженные силы и экономику. Американское правительство заявило, что его поддержка призвана протянуть руку помощи ценному другу США. Турция приветствовала это заявление. Недавняя антинатовская кампания в турецком парламенте в значительной степени утратила силу после известия о пакете помощи. Более вызывающее турецкое правительство выпустило еще одно заявление, в котором утверждалось, что оно никогда не забудет свой народ, находящийся сейчас за железным занавесом. Советский Союз раскритиковал США за попытку дальнейшей милитаризации региона."
 THIRD_BALKAN_WAR.173.d: "Силы НАТО и Варшавского договора прекратили боевые действия в связи с греко-турецким кризисом из-за Кипра. Ни одна из сторон не смогла нанести решающее поражение другой, хотя произошел обмен некоторыми территориями. Из Женевы представители США и Советского Союза объявили о соглашении об отводе сил к довоенным границам. Обе стороны были разочарованы результатом. Советское правительство выпустило заявление, в котором утверждалось, что боевые действия увенчались успехом, поскольку усилия империалистов по уничтожению революции потерпели полный крах. США отметили, что НАТО твердо стояло за своего союзника и предотвратило попытку коммунистов насильственно уничтожить демократию в Турции."
 THIRD_BALKAN_WAR.174.d: "С помощью наших союзников по НАТО мы не только остановили коммунистическую агрессию против Турции, но и захватили огромные участки греческой территории. Турецкое правительство твердо заявляет, что хочет контролировать северную Грецию и её острова, чтобы окончательно отрезать Грецию от её коммунистических союзников. Наши эксперты опасаются, что Турции будет трудно контролировать такую большую территорию, что может помешать выполнению её обязательств перед НАТО. Вместо этого есть альтернативное предложение, чтобы Турция оккупировала Родос, Кавалу, включая её окрестности, и Кипр. Эти территории более управляемы и значительно ослабят стратегическую позицию Греции в будущем конфликте. Предложение о превращении северной Греции в антикоммунистический греческий режим в настоящее время не рассматривается турецкими властями как жизнеспособное."
 THIRD_BALKAN_WAR.175.d: "Империалисты никого не удивили, раскрыв свой гнусный план по ликвидации нашего революционного союзника Греции. НАТО объявило, что планирует оккупировать северную Грецию и другие стратегические земли, чтобы 'обеспечить мир в регионе'. В действительности же они отрезают Грецию от нас и укрепляют свои стратегические позиции в регионе. Народ Греции и весь мир потрясен этой новостью, однако, к сожалению, мы не в состоянии изменить ситуацию из-за военного положения на местах. Несмотря на эту неудачу, мы не забудем этого унижения"
 THIRD_BALKAN_WAR.176.d: "Империалисты никого не удивили, раскрыв свой гнусный план по уничтожению нашего революционного союзника Греции. НАТО передаст Кипр, Родос и Кавалу под турецкую военную оккупацию. Они утверждают, что это делается для обеспечения дальнейшего мира в регионе, но это явно шаг, направленный на ослабление стратегической позиции Греции и создание условий для будущего вторжения. Международное сообщество, несомненно, увидит истинную природу этого решения. В связи с военной ситуацией, наши возможности ограничены тем, что мы просто заявляем о своем несогласии с этим предложением."
 THIRD_BALKAN_WAR.177.d: "Новости с экстренного заседания НАТО в Анкаре подтвердили, что Турция станет оккупационной властью на островах и северных провинциях Греции, захваченных во время войны. НАТО настаивает, что оккупация - это не территориальная экспансия, а просто способ обеспечить отсутствие дальнейших конфликтов в регионе. Советский Союз и греческое правительство быстро осудили это решение как карательное и направленное на максимальное наказание народа Греции. Аналитики отмечают, что удержание такой большой территории может стать проблемой для Турции, но это, по сути, отрезает Грецию от Балкан и Советского Союза."
 THIRD_BALKAN_WAR.178.d: "Новости с экстренного заседания НАТО в Анкаре подтвердили, что Турция будет оккупировать Родос, Кипр и Кавалу. Альянс утверждает, что оккупирует эти стратегические объекты только для того, чтобы предотвратить дальнейшую коммунистическую агрессию со стороны Греции и защитить свои интересы. Это решение положило конец недавнему конфликту между НАТО и Варшавским договором из-за Кипра, который закончился крупной победой Турции и её союзников по НАТО. Греция и Советский Союз осудили оккупацию как преамбулу для возобновления конфликта в будущем."
 THIRD_BALKAN_WAR.179.d: "Недавний конфликт с НАТО закончился катастрофой. Сейчас греческие рабочие находятся под иностранной оккупацией, а наша экономика в смятении. Военные также нуждаются в восстановлении своих возможностей, поскольку было бы глупо полагать, что капиталисты не нанесут новый удар. Растут антисоветские настроения, даже внутри партии, но мы делаем все возможное, чтобы подавить их. Учитывая наше положение, мы направим делегацию высокого уровня, чтобы обратиться к советским товарищам за помощью в это труднейшее время."
 THIRD_BALKAN_WAR.180.d: "В Москву прибыла делегация высокого уровня, которая просит нашей помощи в оказании им экономической и военной помощи. Греки предупреждают нас, что отказ поддержать режим может расширить возможности контрреволюционеров и открыть для них простор. Это убедительный довод, и наши собственные аналитики подтверждают, что эти опасения вполне обоснованы. Есть даже сообщения о том, что капиталистические агенты раздувают пламя недовольства. Таким образом, существует сильная поддержка предложения помощи Греции. Однако другая фракция в правительстве отмечает, что мы также сильно пострадали в недавнем конфликте. Возможно, нам следует объяснить Греции, что сильный Советский Союз - это конечное благо для всех социалистических государств"
 THIRD_BALKAN_WAR.181.d: "Наша делегация в Москве подписала комплексный пакет военной и экономической помощи. Это значительно повысит наши возможности и усилия по восстановлению. Это также восстановит моральный дух в народе и в партии. В отличие от прошлого, когда мы заключили союз с капиталистами, наши друзья-социалисты не оставят греческий народ\". Турция и США осудили соглашение как ненужное наращивание военного потенциала. Однако они должны понять, что независимо от ситуации, партия и государство никогда не откажутся от своего долга освободить всех греков от угнетения."
 THIRD_BALKAN_WAR.182.d: "Объединенная Арабская Республика (ОАР) начала вторжение в Турцию, надеясь захватить населенную арабами турецкую провинцию Хатай. Они утверждают, что борются за освобождение этой земли и поддерживают Грецию, которая разделяет их неприсоединившиеся взгляды, но это полная чушь. Это акт агрессии и генеральная репетиция их планов по вторжению в Израиль. Успешное вторжение ОАР может значительно укрепить этот вражеский режим. Это неприемлемо, мы должны сделать что-то, чтобы ослабить военные усилия ОАР. Один из вариантов - отдать приказ о мобилизации и развертывании военного персонала на границе ОАР. ОАР, несомненно, будут вынуждены держать войска на нашей границе, что ослабит их способность развернуть резервы против Турции. Другой вариант - начать мобилизацию, а затем через неделю начать нашу собственную атаку. Мы должны нацелиться на Сирию и её побережье, чтобы отрезать силы ОАР, вторгшиеся в Турцию."
 THIRD_BALKAN_WAR.183.d: "Продолжающаяся греко-турецкая война снова обострилась, так как израильские войска, по слухам, начинают операции против Объединенной Арабской Республики. ОАР недавно объявила войну Турции, ссылаясь на её поддержку Греции и захват турецкой провинции Хатай. Израильское правительство заявило, что оно вынуждено действовать, чтобы спасти свою страну от все более агрессивного, антиизраильского режима в Каире. Аналитики считают, что израильтяне, скорее всего, нацелятся на сирийские территории ОАР, чтобы изолировать и перекрыть поток снабжения сил ОАР, воюющих против Турции."
 THIRD_BALKAN_WAR.184.d: "Вторжение Объединенной Арабской Республики в Хатай привело к серьезной эскалации греко-турецкой войны за Кипр. В течение нескольких дней Израиль присоединился к конфликту на стороне Турции, пытаясь остановить то, что он считал агрессией ОАР. Этот конфликт закончился крупным поражением ОАР, поскольку её силы были разбиты в Сирии. После переговоров на высоком уровне между израильскими и турецкими официальными лицами в Дамаске Израиль согласился вывести свои войска, а Турция проконтролировала переход власти к новому сирийскому правительству. Обе стороны согласились с необходимостью устранения режима ОАР в Сирии. Турецкое правительство высоко оценило это решение, заявив, что турки будут гордиться тем, что их народ помог освободить Сирию от сапога Каира. ОАР решительно осудили это решение, но не в состоянии ему помешать"
 THIRD_BALKAN_WAR.185.d: "С завершением Греко-турецкой войны, боевые действия на Ближнем Востоке также подошли к концу. Ни Объединенная Арабская Республика, ни Израиль не смогли добиться победы. Боевые действия оказались безрезультатными, и обе стороны согласились на возвращение довоенных границ. Обе стороны заявляют о своей победе. Израиль отмечает, что его силам удалось связать большое количество войск ОАР из конфликта с Турцией. ОАР утверждает, что их силы отразили все атаки израильтян и уничтожили огромное количество их техники. Несмотря на большие бои, ни одна из сторон не получит новых территорий."
 THIRD_BALKAN_WAR.186.d: "После прекращения огня между Объединенной Арабской Республикой (ОАР) и Израилем, ОАР подтвердила, что контролирует Хайфу и прилегающие районы. Израильское правительство осудило ОАР за неприкрытую агрессию. Боевые действия начались, когда Израиль напал на ОАР за её вторжение в Турцию. В ходе последовавшего конфликта силам ОАР удалось оттеснить израильские войска. Ожидается, что среди израильтян будет большая обратная реакция, так как многие граждане теперь находятся под оккупацией арабского государства."
 THIRD_BALKAN_WAR.187.d: "По всему Израилю проходят массовые протесты разъяренных граждан, которые считают, что Хайфа и её жители были оставлены Объединенной Арабской Республике (ОАР). Многие израильтяне считают, что гражданское и военное руководство подвело народ и солдат, приняв неверные решения. Правительство также обвиняют в том, что оно поспешило ввязаться в конфликт без подготовки и четкой цели. Один горький протестующий спросил, стоит ли Хайфе помогать туркам. Израильское правительство и военные уже объявили, что будет проведено полное расследование и следствие, чтобы понять, что произошло и как предотвратить это в будущем."
 THIRD_BALKAN_WAR.188.d: "Наши храбрые вооруженные силы успешно освободили северную Палестину от сионистов. Мы пресекли их усилия по расширению оккупации и сумели вернуть некоторые земли. Теперь необходимо принять решение о том, что делать дальше. ОАР - это государство для всех арабов, поэтому, естественно, многие считают, что эти земли должны войти в состав государства. Однако такой шаг может вызвать ненужную критику со стороны других арабских государств, которые будут утверждать, что мы аннексируем земли. Другим решением является создание палестинской администрации, которая со временем может присоединиться к ОАР"
 THIRD_BALKAN_WAR.189.d: "Арабы всего мира ликуют за победу Объединенной Арабской Республики над сионистами. Несмотря на неспровоцированное нападение, доблестные арабские армии одержали победу. В настоящее время египтяне контролируют северную Палестину, а изгнанные арабы призывают вернуться домой. Многие были доведены до слез, когда ОАР опубликовала снимки своих солдат, восстанавливающих деревню, жители которой были изгнаны во время Накбы. Несмотря на победу, будущий статус этих земель вызывает большой интерес во многих арабских столицах."