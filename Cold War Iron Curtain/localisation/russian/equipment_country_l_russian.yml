 YUG_lt_equipment_1: "Т-60"
 YUG_lt_equipment_1_short: "Т-60"
 YUG_lt_equipment_1_desc: "Т60 был легким танком, созданным для замены Т-38 в роли разведчика. Он был разработан в 1941 году Николаем Астровым, и за 2 года его производства было выпущено 6300 штук. Это был танк с 2 экипажами, 6-цилиндровым двигателем, развивающий скорость до 44 км/ч, с 20-мм основным орудием. Он широко использовался во время Второй мировой войны."
 YUG_lt_equipment_2: "Т-70"
 YUG_lt_equipment_2_short: "Т-70"
 YUG_lt_equipment_2_desc: "Легкий танк Т-70 - это танк-разведчик времен Второй мировой войны, созданный для замены ПТ60. Николай Астров начал работы сразу после ПТ60 и закончил в 1942 году. За 2 года было выпущено 8300 единиц. Танк имел более мощную 45-мм пушку, оснащался 2 двигателями ГАЗ-202 и мог развивать скорость до 45 км/ч. Т-70 также имел номинально улучшенную оптику Он широко использовался во время Второй мировой войны."
 YUG_lt_equipment_3: "ПТ-76"
 YUG_lt_equipment_3_short: "ПТ-76"
 YUG_lt_equipment_3_desc: "ПТ-76 - советский легкий танк-амфибия, который активно экспортировался по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 году и было произведено около 12 000 единиц. Он требует экипаж из 3 человек и двигатель V6 с прямыми шестерками, развивает скорость 44 км/ч и может плавать со скоростью 10 км/ч. Он экспортировался в различные страны Советского Союза и страны, поддерживающие Советский Союз, и в качестве такового принимал участие в разведке практически во всех конфликтах стран Советского Союза. Однако, благодаря своей знаменитой надежности и простоте обслуживания, он до сих пор используется многими странами."
 YUG_lt_equipment_4: "ПТ-76B Модель 4"
 YUG_lt_equipment_4_short: "ПТ-76B"
 YUG_lt_equipment_4_desc: "ПТ-76 вооружен 76. 2 мм нарезной танковой пушкой (дульный тормоз с двойной перегородкой, эжектор патронов, дымоуловитель и двухосевая система стабилизации СТП-2П \"Заря\"),[4] системой защиты от ЯБП ПАЗ (противоатомная защита), автоматической системой пожаротушения, улучшенным прицелом ТШК-2-66, фильтровентиляционная система, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный дизельный двигатель V-6B с водяным охлаждением мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для чего пришлось несколько изменить форму брони. "
 YUG_lt_equipment_5: "БРМ-1K"
 YUG_lt_equipment_5_short: "БРМ-1K"
 YUG_lt_equipment_5_desc: "БРМ-1К - советская разведывательная машина времен поздней холодной войны. Она была разработана для поддержки бронетанковых и механизированных формирований, используемых советскими войсками. БРМ-1К должен был разведывать маршруты и обнаруживать вражеские формирования."
 YUG_lt_equipment_6: "M-80A KC"
 YUG_lt_equipment_6_short: "M-80A KC"
 YUG_ht_equipment_1: "ИС-2"
 YUG_ht_equipment_1_short: "ИС-2"
 YUG_mbt_equipment_0: "Т-34-85"
 YUG_mbt_equipment_0_short: "Т-34-85"
 YUG_mbt_equipment_0_desc: "Т-34 - советский средний танк, который произвел революцию в области танкостроения и хорошо известен своей надежностью. Т-34 был разработан в 1940 году ХКБМ в Советском Союзе. В попытке снизить затраты в конструкцию танка была введена наклонная броня. Однако это привело к тому, что сам танк стал гораздо лучше защищенным, а также менее дорогим за счет меньшей площади поверхности. Само орудие - 76,2-мм пушка - имело номинальный боезапас. Однако прицелы и приборы обзора были очень плохими, что затрудняло работу командиров танков, а их слабая координация сводила на нет все преимущества, которые давал сам танк. Т-34 стал вторым по производству танком в мире, но одним из самых важных во Второй мировой войне. Т-34 и сегодня используются повстанцами и более бедными странами."
 YUG_mbt_equipment_1: "M4A3E4"
 YUG_mbt_equipment_1_short: "M4A3E4"
 YUG_mbt_equipment_1_desc: "Модернизированный Шерман с подвеской HVSS, мокрой гусеницей и 76 мм."
 YUG_mbt_equipment_2: "M47 Паттон"
 YUG_mbt_equipment_2_short: "M47 Паттон"
 YUG_mbt_equipment_3: "Т-54"
 YUG_mbt_equipment_3_short: "Т-54"
 YUG_mbt_equipment_3_desc: "Танк Т-54 был самым производимым танком в истории. Танк был разработан в 1946 году конструктором ХКБМ. Сам танк использует 100-мм нарезную пушку и имеет различную толщину брони - от 205 мм до 60 мм. Двигатель - дизельный V-12 объемом 38,88 л. Танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался в более чем 50 армиях мира и выпускался на протяжении всего советского периода и всех конфликтов вместе с ним. "
 YUG_mbt_equipment_4: "Т-55"
 YUG_mbt_equipment_4_short: "Т-55"
 YUG_mbt_equipment_5: "Т-55А"
 YUG_mbt_equipment_5_short: "Т-55A"
 YUG_mbt_equipment_6: "Т-72"
 YUG_mbt_equipment_6_short: "Т-72"
 YUG_mbt_equipment_6_desc: "Т-72 - советский танк, созданный как новое поколение танков, в основном для замены Т-62 и его дорогого аналога Т-64. Он стоил почти в два раза дешевле, чем Т-64, и был значительно усовершенствован. Его разработка была завершена в 1973 году Леонидом Венедиктовым и показала невероятные возможности. Орудие и броня по-прежнему были 125-мм и композитными соответственно, но с гораздо более экономически обоснованной конструкцией, которую было легче производить. Двигатель - V-12 мощностью 780 л.с., который впоследствии мог быть переоборудован в 1130-сильный. Танк мог достичь невероятной подвижности, развивая скорость до 80 км/ч, и мог преодолевать более суровые участки местности лучше, чем Т-64. В отличие от Т-64, танк использовался во всех конфликтах в советской сфере и показал невероятные возможности и в них. Танк также получил широкое применение во внесферных конфликтах в Африке, на Ближнем Востоке и в Индокитае."
