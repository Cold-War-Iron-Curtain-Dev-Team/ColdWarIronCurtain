 CHI_mechanized_equipment_1: "Автомобиль, Личный, Полугусеничный, M2"
 CHI_mechanized_equipment_1_short: "M2 Полугусеничный"
 CHI_mechanized_equipment_1_desc: "Полугусеничный автомобиль M2 - это бронированный полугусеничный автомобиль, произведенный Соединенными Штатами во время Второй мировой войны. В его конструкции использовались полугусеничные машины, импортированные из Франции в 1930-х годах, с применением стандартных компонентов, поставляемых американскими производителями грузовиков для ускорения производства и снижения затрат. Концепция была разработана, а опытные образцы изготовлены компанией Firestone Tire и Rubber Company (до того, как прототип получил официальное обозначение M2.). Производство компанией White Motor Company началось в 1940 г. и было расширено до Autocar."
 CHI_mechanized_equipment_2: "Автомобиль, Личный, Полугусеничный, M3"
 CHI_mechanized_equipment_2_short: "M3 Полугусеничный"
 CHI_mechanized_equipment_2_desc: "Полугусеничный бронетранспортер M3 был американским полугусеничным бронетранспортером, широко использовавшимся союзниками во время Второй мировой войны и в холодной войне. Созданный на основе полугусеничной машины M2, M3 был широко распространен, было произведено около 15 000 стандартных M3 и более 38 000 вариантов. В эпоху холодной войны машина использовалась различными государственными и негосударственными операторами в конфликтах в Южной Америке, на Ближнем Востоке, в Африке и Азии, оставаясь на вооружении до середины 1990-х годов. В Мексике они все еще используются по состоянию на 2019 год."
 CHI_mechanized_equipment_3: "Автомобиль, Личный, Полугусеничный, M5"
 CHI_mechanized_equipment_3_short: "M5 Полугусеничный"
 CHI_mechanized_equipment_5: "Автомобиль, Личный, Полногусеничный, Бронированный, M113"
 CHI_mechanized_equipment_5_short: "M113"
 CHI_mechanized_equipment_6: "Автомобиль, Личный, Полногусеничный, Бронированный, M113A1"
 CHI_mechanized_equipment_6_short: "M113A1"
 CHI_mechanized_equipment_6_desc: "Начиная с 1964 года, бензиновый двигатель был заменен на двигатель 6V-53 Detroit Diesel мощностью 215 л.с. (160 кВт), чтобы воспользоваться преимуществами лучшей экономии топлива и меньшей пожароопасности дизельного двигателя."
 CHI_mechanized_equipment_7: "Автомобиль, Личный, Полногусеничный, Бронированный, M113A2"
 CHI_mechanized_equipment_7_short: "M113A2"
 CHI_mechanized_equipment_7_desc: "M113A2 - это улучшенный вариант M113, созданный корпорацией Food Machinery Corporation в конце 70-х годов. Он участвовал в боевых действиях везде, где участвовал M113. В A1 двигатель был заменен на 6V-53. В А2 было улучшено охлаждение двигателя, введены торсионы повышенной прочности для увеличения дорожного просвета, добавлены амортизаторы в подвеску, бронированы топливные баки и добавлены дымовые пусковые установки."
 CHI_mechanized_equipment_8: "см-21A1"
 CHI_mechanized_equipment_8_short: "см-21A1"
 CHI_mechanized_equipment_9: "см-31"
 CHI_mechanized_equipment_9_short: "см-31"
 CHI_mechanized_equipment_10: "см-33"
 CHI_mechanized_equipment_10_short: "см-33"
 CHI_mechanized_marine_equipment_1: "Десантный транспорт, Гусеничный, Mark 3C"
 CHI_mechanized_marine_equipment_1_short: "ДТГ-3C"
 CHI_mechanized_marine_equipment_2: "Десантное транспорт, Гусеничный (Бронированный), Mark 4"
 CHI_mechanized_marine_equipment_2_short: "ДТГ(Б)-4"
 CHI_mechanized_marine_equipment_3: "Десантный транспорт, Гусеничный, Личный, Mark 5A1"
 CHI_mechanized_marine_equipment_3_short: "ДТГЛ-5A1"
 CHI_mechanized_marine_equipment_4: "Штурмовой Транспорт-Амфибия, Личный, Mark 7A1"
 CHI_mechanized_marine_equipment_4_short: "ШТАЛ-7A1"
 CHI_mechanized_marine_equipment_4_desc: "ШТАЛ-7A1 - это десантный БТР, разработанный в 1984 году корпорацией Food Machinery Corporation. Он принимал участие в боевых действиях в Персидском заливе, Сирии и Ираке. ШТАЛ-7A1 использует двигатель VTAC RAM-RS мощностью 525 л.с. и может передвигаться примерно так же, как ДТГЛ-7. Он имеет улучшенные двигатель, трансмиссию, систему вооружения и более прост в обслуживании, чем ДТГЛ-7. Он также имеет ряд улучшений в системе безопасности для снижения последствий попаданий. "
 CHI_motorized_equipment_1: "GMC CCKW"
 CHI_motorized_equipment_1_short: "GMC CCKW"
 CHI_motorized_equipment_1_desc: "GMC CCKW - это 2,5-тонный грузовик 6x6, разработанный General Motors в 1941 году. Он широко использовался во время Второй мировой и Корейской войн. CCKW использует двигатель GMC270, 5-ступенчатую/2-диапазонную коробку передач и балочную ось на рессорной подвеске. Он может перевозить груз весом 5000 фунтов. Он может двигаться со скоростью до 45 миль в час на протяжении 300 миль и имеет расход топлива 7,5 миль/гал. CCKW был разработан для армии США в качестве грузовика для перевозки войск и снабжения. Грузовик, помимо использования для снабжения и транспортировки, может также устанавливать кузов-фургон для использования в качестве полевого автомобиля для обеспечения комфорта/поддержки, а также может устанавливать буксируемое оружие на свою кровать для создания дешевого оружия СП."
 CHI_motorized_equipment_2: "M35A1"
 CHI_motorized_equipment_2_short: "M35A1"
 CHI_motorized_equipment_2_desc: "M35 - это 2.5-тонный грузовик 6x6, разработанный REO в 1944 году. Он широко использовался во всех конфликтах США с 1950-1988 гг. M35 использует двигатель OA-331 с 5-ступенчатой/2-диапазонной коробкой передач и балочными мостами на рессорной подвеске. Он может перевозить груз весом 5000 фунтов. Он может двигаться со скоростью 58 миль в час на протяжении 300 миль и имеет расход топлива 8 миль/гал. Он широко использовался США и многими их союзниками по всему миру. Он был построен, чтобы заменить GMC CCKW после войны и обеспечить более мощный и быстрый автомобиль. "
 CHI_motorized_equipment_3: "M35A2"
 CHI_motorized_equipment_3_short: "M35A2"
 CHI_motorized_equipment_3_desc: "M35A2 обычно оснащается двигателем LDT 465, произведенным либо Continental Motors Company, либо Hercules, либо White Motor Company. Это рядный, 478-кубиковый (7,8 л), шестицилиндровый, многотопливный двигатель с турбонаддувом, развивающий мощность 134 л.с. (100 кВт) и крутящий момент 330 фунт-фут (447 Н⋅м). Он агрегатируется с 5-ступенчатой механической коробкой передач и разведенной 2-ступенчатой раздаточной коробкой (либо раздаточная коробка Rockwell 136-21 с пружинным приводом, либо раздаточная коробка Rockwell 136-27 с пневматическим приводом)."
 CHI_motorized_equipment_4: "M939"
 CHI_motorized_equipment_4_short: "M939"
 CHI_motorized_equipment_4_desc: "M939 - это 5-тонный грузовик 6x6, разработанный компанией AM General в 1982 году. Он использовался во всех западных конфликтах с 1982 года. M939 использует двигатель 6CTA8.3, 5-ступенчатую/2-диапазонную коробку передач и балочные мосты на рессорной подвеске. Машина способна перевозить груз весом 10000 фунтов. Он может двигаться со скоростью 6,3 миль в час на протяжении 350 миль и имеет расход топлива 6 миль/гал. M939 очень эффективен на любой местности и хорошо подходит для суровых погодных условий. M939 позволил создать новое поколение грузовиков, тягачей и эвакуационных машин и получил широкое распространение в производстве. Он более надежен и прочен, чем предыдущие машины, и полностью вытеснил предыдущие производственные контракты. "
 CHI_motorized_equipment_5: "Семейство средних тактических машин 6x6"
 CHI_motorized_equipment_5_short: "ССТМ 6x6"
 CHI_motorized_equipment_5_desc: "Семейство средних тактических машин (ССТМ) - это серия машин, основанных на общем шасси, которые различаются по грузоподъемности и требованиям миссии. ССТМ создан на базе австрийского грузовика Steyr 12 M 18, но существенно модифицирован в соответствии с требованиями армии США, включая минимум 50% американского компонента."
