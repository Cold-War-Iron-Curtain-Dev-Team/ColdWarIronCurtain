 SPR_mechanized_marine_equipment_1: "ЛВТ-4 Уотер Буффало"
 SPR_mechanized_marine_equipment_1_short: "ЛВТ-4"
 SPR_mechanized_marine_equipment_1_desc: "ЛВТП-4 - десантная машина-амфибия, разработанная корпорацией Ford Machinery в начале 40-х годов. ЛВТП-4 использовался во Второй мировой войне, Корее и Вьетнаме. Он использует 7-цилиндровый радиальный двигатель W-670-9A и может преодолевать до 75 миль по воде со скоростью 7 миль в час. Являясь эволюцией ЛВТП-1, ЛВТП-4 способен проплывать невероятные расстояния, хотя и с низкой скоростью. Если вам нужно преодолеть 70 миль по воде и у вас есть на это около 10 часов, ЛВТП-4 - ваш выбор. Он способен перевозить войска или транспортные средства. "
 SPR_mechanized_marine_equipment_2: "ЛВТ(A)-5"
