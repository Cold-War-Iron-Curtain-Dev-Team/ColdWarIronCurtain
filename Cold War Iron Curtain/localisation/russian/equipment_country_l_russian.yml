 NIC_infantry_equipment_0: "Американская винтовка, калибр .30-06, модель 1903"
 NIC_infantry_equipment_0_short: "M1903 Спрингфилд"
 NIC_infantry_equipment_0_desc: "M1903 Спрингфилд, официально - Американская Американская винтовка калибра .30-06 образца 1903 года, является американской пятизарядной винтовкой с магазинной перезарядкой. Винтовка имеет ствол длиной 24 дюйма, коробчатый магазин на 5 патронов, расположенный в шахматном порядке, и цельное ложе с прямыми рукоятками. Стрельба ведется высокоскоростным патроном калибра .30-'06."
 NIC_infantry_equipment_1: "Американская винтовка, калибр .30, M1."
 NIC_infantry_equipment_1_short: "M1 Гаранд"
 NIC_infantry_equipment_1_desc: "M1 Гаранд - это крупнокалиберное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Гаранд - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Это одна из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Оно стало символом и до сих пор используется современными учебными командами в США."
 NIC_infantry_equipment_2: "Fusil Automático Ligero"
 NIC_infantry_equipment_2_short: "FN FAL"
 NIC_infantry_equipment_2_desc: "FAL (Fusil Automático Ligero, легкая автоматическая винтовка) - это боевая винтовка, разработанная в Бельгии Дьедонне Сайве и производимая компанией FN Herstal. Никарагуанские вооруженные силы имели на вооружении как бельгийский FN FAL, так и его израильскую версию, облегченный ROMAT."
 NIC_infantry_equipment_3: "IMI Галиль SAR/ARM"
 NIC_infantry_equipment_3_short: "Галиль"
 NIC_infantry_equipment_3_desc: "В середине 70-х годов Никарагуа получила IMI Галиль SAR и ARM в вариантах 5,56×45 мм и 7,62×51 мм."
 NIC_infantry_equipment_4: "Американская винтовка, 5,56 мм, M16A2."
 NIC_infantry_equipment_4_short: "M16A2"
 NIC_infantry_equipment_4_desc: "После частых случаев ненадежности оружия в джунглях Вьетнама, морская пехота США запросила перепроектирование оружия. В 1982 году была произведена переделка и усовершенствования. Оружие отличалось усиленной ствольной коробкой, новым нарезным стволом, усиленным корпусом, улучшенным охлаждением за счет использования других материалов, улучшенной поддержкой навесного оборудования и переработанным внутренним механизмом, что обеспечило ему высокий уровень надежности. Оружие принимало участие в боевых действиях в Ливане, Ливии, Египте и других конфликтах, в которых участвовали США с момента его создания."
 FIN_infantry_equipment_0: "SAKO Sotilaskivääri m/39"
 FIN_infantry_equipment_0_short: "M/39"
 FIN_infantry_equipment_0_desc: "Военная винтовка M/39, прозванная \"Укко-Пекка\" в честь бывшего президента Пехра Эвинда Свинхуфвуда, была разработана как компромисс между армией и белой гвардией, принятый с целью стандартизации финского производства Мосин-Нагантов. M/39 была в основном заимствована из M28-30, но в нее были внесены некоторые изменения, предложенные армией. В М/39 также была применена полупистолетная рукоятка приклада, хотя некоторые ранние образцы использовали типичные прямые приклады Мосина-Наганта. К концу Зимней войны было построено всего 10 винтовок, но 96 800 винтовок было произведено после Зимней войны и использовалось в Войне-продолжении. Небольшое количество винтовок также было собрано из оставшихся частей в конце 1960-х - 1970 годах."
 FIN_infantry_equipment_1: "Suomi KP/-31"
 FIN_infantry_equipment_1_short: "KP/-31"
 FIN_infantry_equipment_1_desc: "Suomi KP/-31 - пистолет-пулемет (ПП) финской конструкции, использовавшийся в основном во время Второй мировой войны. Он является потомком прототипа М-22 и серийной модели KP/-26, которая была представлена публике в 1925 году. Он поступил на вооружение Финляндии в 1931 году и оставался в эксплуатации до 1980-х годов."
 FIN_infantry_equipment_2: "Valmet Rynnäkkökivääri 62"
 FIN_infantry_equipment_2_short: "RK 62"
 FIN_infantry_equipment_2_desc: "RK 62 (от финского rynnäkkökivääri 62, что означает \"штурмовая винтовка 62\") - штурмовая винтовка, выпускаемая компаниями Valmet и Sako. Разработка финской штурмовой винтовки началась в 1950-х годах. При этом рассматривались различные зарубежные модели, в первую очередь советский АК-47. Первые прототипы были созданы по образцу польских АК и имели тонированные ложи из березы. После испытаний оружия FDF решила принять его с небольшими изменениями на вооружение в качестве RK 62."
 FIN_infantry_equipment_3: "Valmet Rynnäkkökivääri 62 76"
 FIN_infantry_equipment_3_short: "RK 62 76"
 FIN_infantry_equipment_3_desc: "версия со штампованной стальной ствольной коробкой, напоминающая RK 62 с пластиковой мебелью нового образца, но отличающаяся более легким весом ствольной коробки. Общий вес RK 62 76 составляет 3,27 кг. В отличие от АК-47 и АКМ, внутренние детали полностью взаимозаменяемы между РК 62 и РК 62 76, единственное отличие - ствольная коробка."
 FIN_infantry_equipment_4: "SAKO Rynnäkkökivääri 95 taittoperä"
 FIN_infantry_equipment_4_short: "RK-95 TP"
 FIN_infantry_equipment_4_desc: "RK 95 был принят на вооружение финских сил обороны в 1990-х годах в относительно небольшом количестве. Изначально RK 95 TP имел множество усовершенствований, включая селектор управления огнем и дульное устройство, позволявшее стрелять винтовочными гранатами, устанавливать глушитель или штык."
 SWE_infantry_equipment_0: "HVA Gevär m/96"
 SWE_infantry_equipment_0_short: "Gevar m/96"
 SWE_infantry_equipment_0_desc: "Шведские маузеры - это семейство винтовок с продольно-скользящим затвором, созданных на основе улучшенного варианта более ранней модели 1893 года Маузера под патрон 6,5×55 мм и включающих уникальные элементы конструкции по заказу Швеции."
 SWE_infantry_equipment_1: "Carl Gustafs SG Kulsprutepistol m/45 B"
 SWE_infantry_equipment_1_short: "Kpist m/45 B"
 SWE_infantry_equipment_1_desc: "Пистолет-пулемет модели 45, также известный как Carl Gustav M/45 и шведский К ПП, - шведский пистолет-пулемет калибра 9×19 мм, разработанный Гуннаром Йонссоном."
 SWE_infantry_equipment_2: "HVA Automatkarbin 4"
 SWE_infantry_equipment_2_short: "Ak 4"
 SWE_infantry_equipment_2_desc: "Automatkarbin 4, или Автоматический карабин 4 - это шведская копия западногерманской винтовки G3."
 SWE_infantry_equipment_3: "Carl Gustafs SG Automatkarbin 5"
 SWE_infantry_equipment_3_short: "Ak 5"
 SWE_infantry_equipment_3_desc: "Ak 5 или Automatkarbin 5 (\"автоматический карабин 5\", \"автоматический карабин\" - шведский термин для штурмовой винтовки) - шведская версия штурмовой винтовки FN FNC с некоторыми изменениями, в основном для адаптации оружия к частично субарктическому шведскому климату. Ak 5 является служебной винтовкой вооруженных сил Швеции. Ak 5 заменил Ak 4 (лицензионный вариант Heckler & Koch G3) на вооружении шведских вооруженных сил."
 SWE_infantry_equipment_4: "Bofors Automatkarbin 5C"
 SWE_infantry_equipment_4_short: "Ak 5C"
 SWE_infantry_equipment_4_desc: "В начале 21 века шведские военные хотели получить более современную штурмовую винтовку для интеграции в будущую программу шведских солдат. Винтовка должна была иметь систему Rail Integration System, улучшенную эргономику и повышенную надежность. Вместо покупки новой штурмовой винтовки Швеция решила модифицировать уже используемую винтовку семейства Ak 5(B), снизив риски и стоимость программы."
 ISR_infantry_equipment_0: "Sten Mark V"
 ISR_infantry_equipment_0_short: "Sten"
 ISR_infantry_equipment_0_desc: "Появившийся в 1944 году, Sten Mark V по сути является более качественной и продуманной версией Mk 2. Изменения включали деревянную пистолетную рукоятку, вертикальную деревянную переднюю рукоятку, деревянное ложе и крепление для штыка."
 ISR_infantry_equipment_1: "Rov've Mitta'enn"
 ISR_infantry_equipment_1_short: "Ромат"
 ISR_infantry_equipment_1_desc: "Столкнувшись с логистическими проблемами, связанными с наличием на вооружении большого количества старого огнестрельного оружия, ЦАХАЛ решил заменить старые немецкие и британские винтовки с продольно-скользящим затвором на новую самозарядную винтовку. В 1955 году ЦАХАЛ решил принять на вооружение FN FAL в качестве стандартной пехотной винтовки под названием Rov've Mitta'enn или Romat, что является аббревиатурой от \"самозарядная винтовка\.\" FAL, заказанная ЦАХАЛом, выпускалась в двух основных вариантах, как в обычном полуавтоматическом, так и в тяжелом автоматическом, и была рассчитана на 7,62-мм патроны НАТО."
 ISR_infantry_equipment_2: "Автоматическая винтовка ИМИ Галиль"
 ISR_infantry_equipment_2_short: "Галиль АВ"
 ISR_infantry_equipment_2_desc: "В конце 60-х - начале 70-х годов основная боевая винтовка ЦАХАЛа \"Ромат\" начала показывать свои слабые стороны."
 ISR_infantry_equipment_3: "Автоматическая винтовка-пулемет IMI Галиль"
 ISR_infantry_equipment_3_short: "Галиль АВП"
 ISR_infantry_equipment_3_desc: "В конце 60-х - начале 70-х годов основная боевая винтовка ЦАХАЛа \"Ромат\" начала показывать свои слабые стороны."
 ISR_infantry_equipment_4: "IMI M4"
 ISR_infantry_equipment_4_short: "M4"
 ISR_infantry_equipment_4_desc: "Израильский вариант карабина M4. Стандартный выпуск в Армии обороны Израиля, но с 2001 года постепенно заменяется на IWI Tavor."
 HOL_infantry_equipment_0: "Американская винтовка, калибр .30, M1"
 HOL_infantry_equipment_0_short: "M1 Гаранд"
 HOL_infantry_equipment_0_desc: "M1 Гаранд - это крупнокалиберное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Гаранд - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Она стала одной из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Она стала символом и до сих пор используется современными учебными командами в США."
 HOL_infantry_equipment_1: "Fusil Automatique Léger"
 HOL_infantry_equipment_1_short: "FN FAL"
 HOL_infantry_equipment_2: "Fusil Automatique Léger Polymer"
 HOL_infantry_equipment_2_short: "FN Fal(p)"
 HOL_infantry_equipment_1_desc: "FN FAL - один из самых производимых пистолетов в истории. Благодаря своей распространенности и широкому использованию среди военных многих стран НАТО и первого мира во время холодной войны, он получил название \"Правая рука свободного мира\"."
 HOL_infantry_equipment_3: "Винтовка Diemaco 5.56 мм C7"
 HOL_infantry_equipment_3_short: "C7"
 HOL_infantry_equipment_3_desc: "Colt Canada C7 - канадское семейство военных винтовок, производимых компанией Colt Canada (ранее Diemaco до 2005 года), схожих по конструкции и функциям с Colt M16A3."
 HOL_infantry_equipment_4: "Винтовка Diemaco 5.56 мм C7A1"
 HOL_infantry_equipment_4_short: "C7A1"
 HOL_infantry_equipment_4_desc: "C7A1 (Diemaco C7FT) заменяет узел прицел/ручка для переноски, используемый на C7, на модифицированную планку Weaver для установки оптики. Разработка направляющих в Канаде предшествовала стандартизации в США \"направляющей Пикатинни\" MIL-STD-1913, поэтому \"канадская направляющая\" или \"направляющая Diemaco\" несколько отличается. Здесь 14 пазов вместо 13, и каждый паз более узкий. Высота направляющей также больше, что позволяет использовать мушку нормальной высоты."
 DEN_infantry_equipment_0: "Американская винтовка, калибр .30, M1"
 DEN_infantry_equipment_0_short: "M1 Гаранд"
 DEN_infantry_equipment_0_desc: "M1 Гаранд - это крупнокалиберное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Гаранд - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Она стала одной из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Оно стало символичным и до сих пор используется современными учебными командами в США...."
 DEN_infantry_equipment_1: "Gevær M/50"
 DEN_infantry_equipment_1_short: "M/50"
 DEN_infantry_equipment_2: "Gevær M/66"
 DEN_infantry_equipment_2_short: "M/66"
 DEN_infantry_equipment_3: "Gevær M/75"
 DEN_infantry_equipment_3_short: "M/75"
 DEN_infantry_equipment_4: "Gevær M/95"
 DEN_infantry_equipment_4_short: "M/95"
 POR_infantry_equipment_0: "Карабин 98k Espingarda 8 мм Маузер m/938"
 POR_infantry_equipment_0_short: "Маузер m/938"
 POR_infantry_equipment_0_desc: "Маузер-Вергейро - винтовка с продольно-скользящим затвором, разработанная в 1904 году Жозе Альберто Вергейро, пехотным офицером португальской армии, и производимая компанией Deutsche Waffen und Munitionsfabriken (DWM). Он был разработан на основе винтовки Маузер 98 с использованием новой системы затвора, заимствованной из Gewehr 1888 и Mannlicher-Schönauer. За пределами Португалии это оружие было также известно как португальский Маузер."
 POR_infantry_equipment_1: "Artillerie Inrichtingen ArmaLite AR-10"
 POR_infantry_equipment_1_short: "ArmaLite AR-10"
 POR_infantry_equipment_1_desc: "Окончательная конструкция Artillerie Inrichtingen известна как португальская модель AR-10. В этой окончательной версии было учтено все, что было получено на сегодняшний день о AR-10, включая отчеты о пехотной служебной винтовке и полевых испытаниях. Помимо более тяжелого ствола с хромированной каморой, опциональной сошки и съемных пластиковых/металлических наручников переходной модели, португальский вариант имел более широкие выступы затвора, более мощный экстрактор, новый упрощенный трехпозиционный газовый регулятор и рукоятку взведения затвора с упором вперед."
 POR_infantry_equipment_2: "Heckler & Koch G3"
 POR_infantry_equipment_2_short: "G3"
 POR_infantry_equipment_2_desc: "Оригинальная модель на базе CETME Модель 58, представленная в 1959 году и утвержденная в 1960 году. Она имела деревянное ложе и рукоятку."
 POR_infantry_equipment_3: "Heckler & Koch G3A3"
 POR_infantry_equipment_3_short: "G3A3"
 POR_infantry_equipment_3_desc: "Наиболее известная версия 1963 года. Барабанный прицел с улучшенной мушкой, пламегаситель/дульный тормоз, способный стрелять гранатами стандарта НАТО, фиксированный цельный пластиковый приклад и пластиковый ганшип, не соприкасающийся со свободно висящим стволом. Наконечник выпускался в тонком вентилируемом варианте и широком варианте. Последний вариант позволяет установить сошку."
 POR_infantry_equipment_4: "Heckler & Koch HK33E"
 POR_infantry_equipment_4_short: "HK33E"
 POR_infantry_equipment_4_desc: "HK33 - 5,56-мм штурмовая винтовка, разработанная в 1960-х годах западногерманской оружейной компанией Heckler & Koch GmbH (H&K) в основном для экспорта."
 NOR_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск до конца Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 СЗВ."
 NOR_infantry_equipment_0: "Американская винтовка, калибр .30, M1 Норвежский образец"
 NOR_infantry_equipment_0_short: "M1 Гаранд (НО)"
 NOR_infantry_equipment_2: "Heckler & Koch G3"
 NOR_infantry_equipment_2_short: "G3"
 NOR_infantry_equipment_2_desc: "Оригинальная модель на базе CETME Модель 58, представленная в 1959 году и утвержденная в 1960 году. Она имела деревянные ложе и гарду."
 NOR_infantry_equipment_3: "Kongsberg Våpenfabrikk AG-3."
 NOR_infantry_equipment_3_short: "AG-3"
 NOR_infantry_equipment_4: "Kongsberg Våpenfabrikk AG-3F1"
 NOR_infantry_equipment_4_short: "AG-3F1"
 BEL_infantry_equipment_0: "Fabrique Nationale Модель 1949"
 BEL_infantry_equipment_0_short: "FN-49"
 BEL_infantry_equipment_0_desc: "Конструкция FN-49 восходит к началу 1930-х годов и выпускается как в виде самозарядной винтовки, так и в виде автоматической винтовки с магазинами на 10 патронов.\nХотя винтовка FN-49 была хорошо известна благодаря высокому качеству сборки и надежности по сравнению с винтовками того времени, ее рыночные возможности были ограничены, поскольку она была разработана не для использования во время Второй мировой войны, а позже, когда многие военные уже начали переходить на боевые винтовки с автоматическим огнем. Неизвестное количество FN-49 было выпущено в качестве автоматических винтовок, но небольшой коробчатый магазин на 10 патронов ограничивал возможности автоматики."
 BEL_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 BEL_infantry_equipment_1_short: "FN FAL"
 BEL_infantry_equipment_1_desc: "FN FAL - один из самых производимых пистолетов в истории. Благодаря своей распространенности и широкому использованию среди военных многих стран НАТО и стран первого мира во время холодной войны, он получил название \"Правая рука свободного мира\.\""
 BEL_infantry_equipment_2: "Fabrique Nationale Carabine Automatique Légère"
 BEL_infantry_equipment_2_short: "FN CAL"
 BEL_infantry_equipment_2_desc: "CAL (Carabine Automatique Légère) - бельгийское оружие, производимое компанией Fabrique Nationale. Это была первая винтовка калибра 5,56 мм, выпущенная компанией Fabrique Nationale. Она напоминала весьма успешную винтовку FN FAL, но имела оригинальную конструкцию. В отличие от FAL, винтовка оказалась неудачной на рынке, хотя ее развитие привело к созданию достаточно успешной FN FNC."
 BEL_infantry_equipment_3: "Fabrique Nationale Карабин M2"
 BEL_infantry_equipment_3_short: "FNC M2"
 BEL_infantry_equipment_3_desc: "FNC была разработана в 1975-1977 годах для испытаний по стандартизации НАТО в качестве менее дорогой альтернативы винтовке M16 под патрон 5,56x45 мм НАТО. Конструкция винтовки основана на прототипе FNC 76, который сам был создан на базе коммерчески неудачной винтовки FN CAL."
 BEL_infantry_equipment_4: "Fabrique Nationale Carabine M3"
 BEL_infantry_equipment_4_short: "FNC M3"
 BEL_infantry_equipment_4_desc: "Карабин Fabrique Nationale Carabine M2, созданный в основном для нужд бельгийских подразделений пара-коммандос. Он имеет укороченный ствол и патрон 5,56x45 мм НАТО."
 SPR_infantry_equipment_0: "Маузер M43 Español"
 SPR_infantry_equipment_0_short: "M43 Español"
 SPR_infantry_equipment_1: "CETME Модель 58 A"
 SPR_infantry_equipment_1_short: "CETME Модель 58 A"
 SPR_infantry_equipment_1_desc: "CETME Модель 58\" - это боевая винтовка из штампованной стали, выпускаемая испанской оружейной компанией Centro de Estudios Técnicos de Materiales Especiales (CETME). Модель 58 имела коробчатый магазин на 20 патронов и использовала патрон 7.62×51 мм НАТО (хотя изначально была разработана под патрон 7.92x51 мм CETME[2], а затем под испанский патрон уменьшенной мощности 7.62×51 мм).[1] CETME 58 стала основой для широко распространенной немецкой боевой винтовки Heckler & Koch G3. Для гражданского рынка также выпускались полуавтоматические варианты. "
 SPR_infantry_equipment_2: "CETME Модель 58 B"
 SPR_infantry_equipment_2_short: "CETME Модель 58 B"
 SPR_infantry_equipment_2_desc: "Модель B была первой серийной Моделью. Она имела перфорированную стальную рукоятку и была рассчитана на патрон 7,62×51 мм CETME. Патрон 7,62 мм CETME отличался от стандартного патрона 7,62 мм НАТО более легкой пулей и меньшим зарядом ракетного топлива."
 SPR_infantry_equipment_3: "CETME Модель L"
 SPR_infantry_equipment_3_short: "CETME Модель L"
 SPR_infantry_equipment_3_desc: "Модель L\" - испанская штурмовая винтовка под патрон 5,56×45 мм НАТО, разработанная в конце 1970-х годов в государственном научно-исследовательском центре стрелкового оружия CETME (Centro de Estudios Técnicos de Materiales Especiales), расположенном в Мадриде. Винтовка сохранила многие из проверенных элементов конструкции, которые институт ранее использовал в своих боевых винтовках CETME Модель 58."
 SPR_infantry_equipment_4: "Heckler & Koch G36E"
 SPR_infantry_equipment_4_short: "G36E"
 SPR_infantry_equipment_4_desc: "G36E - 5,56-мм штурмовая винтовка, экспортная версия стандартного G36, созданная западногерманским производителем вооружений Heckler & Koch GmbH (H&K)."
 ENG_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но.4 Mk I"
 ENG_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 ENG_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск до конца Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 СЗВ."
 ENG_infantry_equipment_1: "L1A1 Самозарядная винтовка"
 ENG_infantry_equipment_1_short: "L1A1 СЗВ"
 ENG_infantry_equipment_1_desc: "L1A1 СЗВ - это британская версия бельгийской боевой винтовки FN FAL. Она выпускалась по лицензии и использовалась во многих странах Содружества. Великобритания выпустила свой собственный вариант FN FAL, включающий модификации, разработанные Союзным стрелковым комитетом, и получивший обозначение самозарядная винтовка L1A1 (СЗВ). Оружие производилось на заводах Royal Small Arms Factory Enfield, Birmingham Small Arms, Royal Ordnance Factory и ROF Fazakerley. После прекращения производства замену комплектующих производила компания Parker Hale Limited. СЗВ служил в вооруженных силах Великобритании с 1954 года примерно до 1994 года, а с 1985 года был заменен на L85A1."
 ENG_infantry_equipment_2: "L1A1 Самозарядная винтовка полимерная"
 ENG_infantry_equipment_2_short: "L1A1 СЗВ(п)"
 ENG_infantry_equipment_2_desc: "Облегченная полимерная версия L1A1 СЗВ."
 ENG_infantry_equipment_3: "L85A1"
 ENG_infantry_equipment_3_short: "L85A1"
 ENG_infantry_equipment_3_desc: "L85A1 - газоотводная винтовка с компоновкой буллпап. Основным преимуществом компоновки буллпап является общая компактность оружия. Штурмовая винтовка выпускается под стандартный патрон НАТО 5,56 x 45 мм. Стоит отметить, что штурмовая винтовка L85A1 была сопряжена с множеством проблем. В целом она была достаточно ненадежной и сложной в обслуживании. Надежность оружия не была большой проблемой, по крайней мере, для британского правительства, пока L85A1 не побывала в реальном бою и не показала очень плохие результаты. Только в 1997 году компания Heckler & Koch была нанята для устранения проблем с винтовками L85A1."
 ENG_infantry_equipment_4: "L85A2"
 ENG_infantry_equipment_4_short: "L85A2"
 ENG_infantry_equipment_4_desc: "L85A2 - это модернизированный вариант оригинальной штурмовой винтовки L85A1, которая была принята на вооружение британской армии в 1984 году в качестве стандартного оружия пехоты. Оригинальная штурмовая винтовка L85A1 имела некоторые проблемы с надежностью и производительностью, поэтому для их устранения и был создан этот вариант. В настоящее время L85A2 является стандартной служебной винтовкой британских вооруженных сил. Питание L85A2 осуществляется из коробчатых магазинов емкостью 30 патронов. Это стандартные магазины НАТО STANAG. Оригинальные магазины L85A1 были не очень надежными и доставляли много хлопот. На L85A2 были модернизированы как магазины, так и колодец магазина, чтобы избежать проблем с питанием."
 CAN_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но.4 Mk I"
 CAN_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 CAN_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск до конца Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 СЗВ."
 CAN_infantry_equipment_1: "Винтовка 7.62 мм FN C1"
 CAN_infantry_equipment_1_short: "C1"
 CAN_infantry_equipment_1_desc: "C1 - это канадская версия бельгийской боевой винтовки FN FAL. Она производилась по лицензии и использовалась во многих странах Содружества. Великобритания выпустила свой собственный вариант FN FAL, включающий модификации, разработанные Союзным стрелковым комитетом, получив обозначение самозарядная винтовка L1A1 (СЗВ). Оружие производилось на заводах Royal Small Arms Factory Enfield, Birmingham Small Arms, Royal Ordnance Factory и ROF Fazakerley. После прекращения производства комплектующие для замены оружия производились компанией Parker Hale Limited. СЗВ служил в вооруженных силах Великобритании с 1954 года примерно до 1994 года, а с 1985 года был заменен на L85A1."
 CAN_infantry_equipment_2: "Винтовка 7.62 мм FN C1A1"
 CAN_infantry_equipment_2_short: "C1A1"
 CAN_infantry_equipment_2_desc: "Улучшенная версия C1."
 CAN_infantry_equipment_3: "Винтовка Diemaco 5.56 мм C7"
 CAN_infantry_equipment_3_short: "C7"
 CAN_infantry_equipment_3_desc: "Colt Canada C7 - канадское семейство военных винтовок, производимых компанией Colt Canada (ранее Diemaco до 2005 года), схожих по конструкции и функциям с Colt M16A3."
 CAN_infantry_equipment_4: "Винтовка Diemaco 5.56 мм C7A1"
 CAN_infantry_equipment_4_short: "C7A1"
 CAN_infantry_equipment_4_desc: "C7A1 (Diemaco C7FT) заменяет узел прицела/ручки для переноски, используемый на C7, модифицированной планкой Weaver для установки оптики. Разработка направляющих в Канаде предшествовала стандартизации в США \"направляющей Пикатинни\" MIL-STD-1913, поэтому \"канадская направляющая\" или \"направляющая Diemaco\" немного отличается. Здесь 14 пазов вместо 13, и каждый паз более узкий. Высота направляющей также больше, что позволяет использовать мушку нормальной высоты."
 WGR_infantry_equipment_0: "Карабин 98 kurz"
 WGR_infantry_equipment_0_short: "Карабин 98k"
 WGR_infantry_equipment_0_desc: "Иконическая винтовка с продольно-скользящим затвором, принятая вермахтом в 1935 году в качестве стандартной служебной винтовки. Это была одна из последних разработок в длинной линейке военных винтовок Маузер. Хотя во время Второй мировой войны к ней добавились полуавтоматические и полностью автоматические винтовки, она оставалась основной немецкой винтовкой до конца войны в 1945 году. Несмотря на растущее число полуавтоматических и полностью автоматических винтовок, Kar98k продолжает использоваться по обе стороны железного занавеса."
 WGR_infantry_equipment_1: "Heckler & Koch G1"
 WGR_infantry_equipment_1_short: "G1"
 WGR_infantry_equipment_1_desc: "G1 или Gewehr 1 является вайрантом FN FAL. Он имел штампованную металлическую рукоятку, идентичную австрийской Stg. 58, а также на голландских и греческих FAL, но при этом он был несколько тоньше стандартных деревянных или пластиковых накладок и имел горизонтальные линии, идущие почти по всей длине. G1 также оснащались уникальным съемным штыревым пламегасителем, что добавляло еще одно внешнее отличие."
 WGR_infantry_equipment_2: "Heckler & Koch G3"
 WGR_infantry_equipment_2_short: "G3"
 WGR_infantry_equipment_2_desc: "G3 или Gewehr 3 - боевая винтовка под патрон 7,62×51 мм НАТО, разработанная в 1950-х годах немецкой оружейной компанией Heckler & Koch в сотрудничестве с испанским государственным агентством по проектированию и развитию CETME."
 WGR_infantry_equipment_3: "Heckler & Koch G3A3"
 WGR_infantry_equipment_3_short: "G3A3"
 WGR_infantry_equipment_3_desc: "Наиболее известная версия G3 образца 1963 года. Барабанный прицел с улучшенной мушкой, пламегаситель/дульный тормоз, способный стрелять гранатами стандарта НАТО, фиксированный цельный пластиковый приклад и пластиковый ганшип, не соприкасающийся со свободно висящим стволом. Наконечник выпускался в тонком, вентилируемом и широком вариантах. Последний вариант позволяет установить сошку."
 WGR_infantry_equipment_4: "Heckler & Koch G36"
 WGR_infantry_equipment_4_short: "G36"
 WGR_infantry_equipment_4_desc: "Heckler & Koch G36 (Gewehr 36) - штурмовая винтовка калибра 5,56×45 мм, разработанная в начале 1990-х годов немецкой оружейной компанией Heckler & Koch в качестве замены более тяжелой боевой винтовки G3 калибра 7,62×51 мм. Она была принята на вооружение бундесвера в 1997 году, заменив G3."
 FRA_infantry_equipment_0: "MAS-36"
 FRA_infantry_equipment_0_short: "MAS-36"
 FRA_infantry_equipment_0_desc: "MAS-36\" - винтовка, разработанная в 1927 году под французский патрон 7,62x54 мм и принятая на вооружение французской армии в 1936 году в качестве замены служебным винтовкам Бертье и Лебель. Во время Второй мировой войны винтовка принималась на вооружение в ограниченном количестве, но благодаря массовому производству после окончания войны она принимала участие в многочисленных конфликтах разных стран. После Второй мировой войны винтовки были модернизированы с точки зрения эргономики. В некоторых вариантах винтовки были дополнены навесными винтовочными гранатами и прицелом Модель. Предполагалось, что она будет лишь промежуточной винтовкой, созданной на станках, которые могут быть использованы для создания предполагаемых самозарядных винтовок."
 FRA_infantry_equipment_1: "MAS-49"
 FRA_infantry_equipment_1_short: "MAS-49"
 FRA_infantry_equipment_1_desc: "MAS-49 - французская самозарядная винтовка, заменившая различные винтовки с продольно-скользящим затвором в качестве служебной винтовки, выпускавшаяся с 1949 года. Формальное обозначение винтовки - Fusil-semiautomatique 7 мм 5 M. 49 или \"самозарядная винтовка калибра 7,5 мм 1949 года.\"\n\n\nВыпущенная в ограниченном количестве, эта винтовка завоевала репутацию точной, надежной и простой в обслуживании винтовки, особенно в неблагоприятных условиях, таких как джунгли или пустыня, которую иногда можно было чистить только тряпками и моторным маслом. Винтовка также могла стрелять 22-мм винтовочными гранатами стандарта НАТО, при этом она даже имела встроенный прицел для стрельбы гранатами, который крепился к прицельной планке, и газоотвод, который предотвращал попадание газа в газоотводную трубку из газового отверстия при стрельбе холостыми боеприпасами для гранат."
 FRA_infantry_equipment_2: "MAS-49/56"
 FRA_infantry_equipment_2_short: "MAS-49/56"
 FRA_infantry_equipment_2_desc: "Усовершенствованная версия винтовки MAS-49/56 была представлена в 1957 году и вобрала в себя опыт, полученный в ходе службы в Алжире, Индокитае и во время Суэцкого кризиса. Винтовка была укорочена и облегчена для повышения мобильности механизированных и воздушно-десантных войск, добавлен штык-нож. Встроенный винтовочный гранатомет MAS-49 был заменен на комбинированный компенсатор/винтовочный гранатомет, стреляющий 22-мм винтовочными гранатами стандарта НАТО."
 FRA_infantry_equipment_3: "FAMAS F1"
 FRA_infantry_equipment_3_short: "FAMAS F1"
 FRA_infantry_equipment_3_desc: "Fusil d'Assaut de la Manufacture d'Armes de SainT-Etienne\" или сокращенно FAMAS - это штурмовая винтовка типа буллпап, разработанная и производимая во Франции компанией MAS. Это действующая служебная винтовка французских вооруженных сил. Оружие стреляет патронами калибра 5,56x45 мм и может использовать винтовочные гранаты APAV 40 и AC 58. Винтовка была разработана после того, как американцы приняли на вооружение M16 и 5.56, что заставило французских военных пересмотреть свой подход к созданию служебной винтовки. FAMAS F1 заменила устаревшую винтовку MAS 49/56 и пистолет-пулемет MAT-49. В конструкции винтовки была использована концепция одноразовых магазинов; когда ограниченный бюджет французских вооруженных сил заставлял солдат использовать одноразовые магазины снова и снова, FAMAS заклинивало и требовало немедленного вмешательства. Со временем MAS выпустила более прочные магазины для FAMAS, что позволило сократить количество неисправностей."
 FRA_infantry_equipment_4: "FAMAS G2"
 FRA_infantry_equipment_4_short: "FAMAS G2"
 FRA_infantry_equipment_4_desc: "FAMAS G2 был разработан в 1994 году для соответствия стандартам НАТО, принимая стандартные магазины НАТО и используя более узкую нарезку ствола для точной стрельбы как старыми патронами 5.56 мм 55 гр, так и новыми стандартными патронами 5.56 мм НАТО 62 гр. \G2 также включает в себя несколько других модернизаций, заимствованных у модели G1, таких как увеличенная спусковая скоба и улучшенные щитки для рук, сделанные из армированного стекловолокна вместо пластика, а также возможность использования стандартных патронов с латунной гильзой и стальных патронов французского производства. В 1995 году ВМС Франции приобрели FAMAS G2 и поставили его на вооружение Fusiliers Marins и Commandos Marine. Однако французская армия отказалась от приобретения G2, предпочитая использовать в качестве основной винтовки FAMAS F1."
 USA_infantry_equipment_0: "Американская винтовка, калибр .30, M1"
 USA_infantry_equipment_0_short: "M1 Гаранд"
 USA_infantry_equipment_0_desc: "M1 Гаранд - это крупнокалиберное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Гаранд - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Она стала одной из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Она стала символом и до сих пор используется современными учебными командами в США."
 USA_infantry_equipment_1: "Американская Винтовка, калибр 7,62 мм, M14"
 USA_infantry_equipment_1_short: "M14"
 USA_infantry_equipment_1_desc: "M14 или официально известная как United States Rifle, Caliber 7.62 мм, M14 - американская боевая винтовка под патрон 7.62x51мм НАТО. Она стала стандартной винтовкой вооруженных сил США в 1959 году, заменив винтовку M1 Гаранд в армии США в 1958 году и в Корпусе морской пехоты США в 1965 году. Это была последняя американская боевая винтовка, выпущенная в массовом количестве для военнослужащих США. Мощность патрона 7,62×51 мм НАТО позволяла винтовке хорошо пробивать укрытия и действовать на больших дистанциях. Винтовка использовалась в основном в многочисленных войнах в Индокитае, но основное внимание к ней было приковано во время войны во Вьетнаме. После замены его на M16 он экспортировался во многие страны."
 USA_infantry_equipment_2: "Американская Винтовка, калибр 5,56 мм, M16A1."
 USA_infantry_equipment_2_short: "M16A1"
 USA_infantry_equipment_2_desc: "Американские военные чиновники отметили, что карабин M2 значительно превосходит АК47 и немецкий StG44, и в 1956 году началась разработка M16. В 1959 году Юджин Стоунер и Джеймс Салливан завершили работу над этим оружием. Оно продемонстрировало исключительные возможности и превзошло АК47 и АКМ. В частности, оружие обладало гораздо большей огневой мощью, чем карабин М2, было более точным, чем АК47, а также носило более легкие боеприпасы при минимальных потерях в мастерстве. Однако, несмотря на превосходство над АК47 в общих испытаниях, он обладал низкой надежностью, из-за чего его нельзя было считать равным себе. Особенно во Вьетнаме, где поломки были очень частым явлением."
 USA_infantry_equipment_3: "Американская Винтовка, 5,56 мм, M16A2."
 USA_infantry_equipment_3_short: "M16A2"
 USA_infantry_equipment_3_desc: "После частых случаев ненадежности оружия в джунглях Вьетнама, морская пехота США потребовала перепроектировать оружие. В 1982 году была произведена переделка и усовершенствования. Оружие отличалось усиленной ствольной коробкой, новым нарезным стволом, усиленным корпусом, улучшенным охлаждением за счет использования других материалов, улучшенной поддержкой навесного оборудования и переработанным внутренним механизмом, что обеспечило ему высокий уровень надежности. Автомат принимал участие в боевых действиях в Ливане, Ливии, Египте и других конфликтах, в которых участвовали США с момента его создания."
 USA_infantry_equipment_4: "Карабин, калибр 5,56 мм, M4 "
 USA_infantry_equipment_4_short: "Карабин M4"
 USA_infantry_equipment_4_desc: "Карабин M4 является дальнейшим усовершенствованием M16A2. Первоначально он был заказан большой специальной группе конструкторов в 1984 году, а разработка была завершена в 1993 году. После 9 лет разработки, надеемся, что ожидание стоило того. Он отличается более высоким уровнем надежности, значительно легче и короче. В основном благодаря улучшенным материалам, он более точен, чем M16A2. Компактные размеры делают его более универсальным и простым в эксплуатации, чем M16A2. Карабин M4 принимал участие в войне США в Афганистане, в Ираке и в войне против ИГИЛ."
 SOV_infantry_equipment_0: "Мосин ко. 91/30"
 SOV_infantry_equipment_0_short: "Мосин"
 SOV_infantry_equipment_0_desc: "Мосин-Нагант - Русская винтовка с продольно-скользящим затвором, использовавшаяся в Российской империи и созданная на основе конструкции, импортированной из Франции. В 1889 году МОРИ (Министерство обороны Российской империи) приобрело у Франции винтовку Лебеля-1886 и попыталось усовершенствовать ее конструкцию. Министерство наняло различных русских ученых и инженеров под руководством капитана Сергея Мосина и Леона Нагана для усовершенствования конструкции, и после долгих испытаний и создания опытных образцов был создан Наган Мосина. В 91-м году 1891 года винтовка Мосина была запущена в производство. Винтовка имеет длительное время разборки, но отличается высокой точностью стрельбы. Она широко использовалась в Русско-японской войне, Первой мировой войне, гражданской войне в Российской империи, которая привела к образованию Советского Союза, Второй мировой войне и многочисленных мировых конфликтах."
 SOV_infantry_equipment_1: "Автомат Калашникова 1947"
 SOV_infantry_equipment_1_short: "AK-47"
 SOV_infantry_equipment_1_desc: "AK47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. На протяжении многих лет АК47 будет считаться одним из самых надежных и простых в обслуживании, обращении и изучении оружием в мире."
 SOV_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 SOV_infantry_equipment_2_short: "АКМ"
 SOV_infantry_equipment_2_desc: "АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия был значительно уменьшен на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ сразу и повсеместно стал использоваться во многих коммунистических странах и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
 SOV_infantry_equipment_3: "Автомат Калашникова 1974"
 SOV_infantry_equipment_3_short: "AK-74"
 SOV_infantry_equipment_3_desc: "АК74 - современный автомат, разработанный Михаилом Калашниковым для замены АКМ в 1974 году. Он использует патрон меньшего калибра и улучшенный хромированный ствол с 4 правосторонними канавками. Мушка и газоотводная колодка были переделаны таким образом, что в них появился канал, установленный под углом 90 градусов к оси ствола для уменьшения сдвига пули при удержании ствола. Кроме того, в его конструкцию входили различные приспособления, включая ложе с резиновыми накладками. Усовершенствования АК74 позволили солдатам переносить большее количество боеприпасов в полевых условиях и вести более интенсивный огонь с высокой точностью на средних дистанциях. Он получил дорогое применение во время конфликта в Афганистане, где ЦРУ заплатило моджахедам большую сумму денег за захваченный АК74."
 SOV_infantry_equipment_4: "Автомат Калашникова 1974 года модернизированный"
 SOV_infantry_equipment_4_short: "AK-74M"
 SOV_infantry_equipment_4_desc: "АК-74М - усовершенствованный вариант АК-74, разработанный в 1991 году на заводе \"Ижмаш.\" В АК-74М были применены новые материалы и производственные достижения для создания более совершенного оружия. Он имеет облегченные затвор и ствольную коробку, что уменьшает отдачу от газового поршня. Винтовка также имеет ложе из стеклонаполненного полиамида с возможностью боковой фиксации, улучшенное дуло, усиленный кожух и ряд других мелких усовершенствований. Кроме того, в комплект входит планка для установки оптики. Облегченный и усиленный автомат стал более удобным в обращении и переноске, улучшилась поддержка навесного оборудования. Он не была принят на вооружение Советским Союзом, так как СССР распался, однако он был принят на вооружение Российской Федерацией."
