 FRA_lt_equipment_1: "M5 Стюарт"
 FRA_lt_equipment_1_short: "M5 Стюарт"
 FRA_lt_equipment_1_desc: "M5 Стюарт был новой версией легкого танка M3 Stuart, созданной в связи со спросом на радиальные авиационные двигатели во время Второй мировой войны. Он имеет переработанный корпус с приподнятой задней палубой, наклонной плитой ледника и сдвинутым к верху люком водителя. Он оснащен 37-мм пушкой, экипажем из четырех человек, тремя пулеметами M1919 и весом около 15 тонн. Он состоял на вооружении США и других союзных войск в течение всей Второй мировой войны и использовался в многочисленных конфликтах после войны."
 FRA_lt_equipment_2: "M24"
 FRA_lt_equipment_2_short: "M24"
 FRA_lt_equipment_2_desc: "M24 - американский легкий танк, который производился компаниями Cadillac и Massey-Harris Он использовался в конце Второй мировой войны и в некоторых конфликтах после Второй мировой войны. На нем была установлена 75мм пушка M6, и он широко использовался в войне в Алжире и Первой Индокитайской войне."
 FRA_lt_equipment_3: "Panhard E.B.R. 75мм SA49"
 FRA_lt_equipment_3_short: "E.B.R. Mle 51"
 FRA_lt_equipment_3_desc: "Panhard EBR (Panhard Engin Blindé de Reconnaissance, франц: Бронированная разведывательная машина) - это бронированный автомобиль, разработанный компанией Panhard для французской армии и позже использовавшийся по всему миру, в частности, французской армией во время Алжирской войны и португальской армией во время португальской колониальной войны в Анголе, Мозамбике и Гвинее-Бисау."
 FRA_lt_equipment_4: "Panhard E.B.R. 90мм F1"
 FRA_lt_equipment_4_short: "E.B.R. Mle 63"
 FRA_lt_equipment_5: "AMX-10RC"
 FRA_lt_equipment_5_short: "AMX-10RC"
 FRA_lt_equipment_5_desc: "AMX 10RC - это колесная разведывательная машина среднего веса, вооруженная 105-мм пушкой. Машина, поставляемая компанией Nexter Systems, состоит на вооружении французской армии с 1980 года. Для управления машиной требуется экипаж из 4 человек, а вес машины составляет около 15 тонн."
