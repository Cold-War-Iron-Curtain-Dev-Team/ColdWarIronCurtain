 JAP_spaag_equipment_4: "Mitsubishi Тип 87 Шики-Дзисо-Коша-Киканхо 'Гантанк'"
 JAP_spaag_equipment_4_short: "Тип 87 'Гантанк'"
 JAP_spaag_equipment_4_desc: "Самоходное зенитное орудие Тип 87 (\"87-шики дзисо коша киканхо\") - это японское орудие ПВО, созданное на базе 35-мм спаренной пушечной системы Oerlikon, использовавшейся на самоходном зенитном орудии Gepard. Система использует модифицированное шасси танка Тип 74. Полевые офицеры прозвали ее 'Гантанк' в честь похожей машины из серии Mobile Suit Gundam."
 JAP_spaag_equipment_5: "Mitsubishi Тип 87 Кай Шики-Дзисо-Коша-Киканхо 'Гантанк'"
 JAP_spaag_equipment_5_short: "Тип 87 Кай 'Гантанк'"
 JAP_spaag_equipment_5_desc: "Самоходная зенитная установка Тип 87 Kai (87-шики дзисо коша киканхо) - это японское орудие ПВО, созданное на основе 35-мм спаренной пушечной системы Oerlikon, использовавшейся на самоходной зенитной установке Gepard. Система использует модифицированное шасси танка Тип 74. Полевые офицеры прозвали ее 'Гантанк' в честь похожей машины из серии Mobile Suit Gundam."
