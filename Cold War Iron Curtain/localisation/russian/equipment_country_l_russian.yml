 DEN_spaag_equipment_4_desc: "Vildkat - это версия датского PNMK с орудийной башней M/92. Эта версия имеет системы управления огнем для обеспечения не только прямой огневой поддержки, но и для отслеживания низколетящих самолетов и вертолетов."
 DEN_spaag_equipment_5: "Леопард 1 / OTO Основной зенитный танк для перехвата и боя"
 DEN_spaag_equipment_5_short: "Леопард 1 ОТООЗТПБ(ОТОМАТИК)"
 DEN_spaag_equipment_5_desc: "Основной зенитный танк OTO для перехвата и боя (сокращенно ОТООЗТПБ(ОТОМАТИК), игра слов Automatic и OTO) был прототипом итальянского самоходного зенитного орудия (СЗО). Разработанный и построенный компанией OTO Melara, он был вооружен одним 76 мм морским орудием."
