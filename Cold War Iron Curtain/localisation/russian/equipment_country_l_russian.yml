 BEL_lt_equipment_3_short: "M41 Уокер Бульдог"
 BEL_lt_equipment_3_desc: "M41 - легкий разведывательный танк, разработанный компанией Cadillac в 1949 году. Он принимал участие в боевых действиях во Вьетнаме, в заливе Свиней, Ливане и Сомали. Его броня варьируется от 19 мм до 31,7 мм. Он вооружен 76-мм основным орудием, коаксиальным пулеметом 30 калибра и крышной пушкой 50 калибра. Он использует 6-цилиндровый бензиновый двигатель Continental и развивает скорость до 45 миль/ч, а запас хода составляет 100 миль. Разработка M41 продвигалась медленно и с небольшим финансированием, но когда началась Корейская война, армия США начала торопить программу. Спешка вызвала большое количество проблем в программе и проблемы с габаритами. В результате серьезных проблем, вызванных спешкой, M41 выпускался очень недолго и не использовался во время войны в Корее. Фактически, производство началось только в 1951 году и продолжалось всего 3 года."
 BEL_lt_equipment_4: "Fabrique National FN 4RM 62F"
 BEL_lt_equipment_4_short: "FN 4RM 62F"
 BEL_lt_equipment_4_desc: "FN Herstal разработала 4RM 62F, не имея опыта работы с бронированными машинами. За основу был взят грузовик FN 4RM/62 Ardennes (4 × 4) массой 1500 кг, а вдохновение черпалось из других проектов, таких как французский Panhard AML. Изначально бронеавтомобиль был разработан для бельгийской жандармерии."
 BEL_lt_equipment_5: "Alvis FV101 Скорпион"
 BEL_lt_equipment_5_short: "FV101 Скорпион"
 BEL_lt_equipment_6: "Ateliers de Constructions Electriques de Charleroi Кобра с 90мм Кокериллом"
 BEL_lt_equipment_6_short: "ACEC Кобра 90"
 BEL_lt_equipment_6_desc: "С экипажем из трех человек и оснащенный башней для пушек калибра до 90 мм. Один прототип был оснащен двухместной электрической башней АК 90 Е, вооруженной пушкой Кокерилла KEnerga 90/46 и оснащенной системой управления огнем OIP LRS-5 с баллистическим компьютером, прицелом день/ночь и лазерным дальномером. Другой вариант имел двухместную башню Cockerill C-25 с 25-мм пушкой Эрликон KBB и 7,62-мм коаксиальным пулеметом."
 BEL_mechanized_equipment_1: "M3 Полугусеничный"
 BEL_mechanized_equipment_1_short: "M3 Полугусеничный"
 BEL_mechanized_equipment_2: "Bren Carrier LP2"
 BEL_mechanized_equipment_2_short: "Bren Carrier LP2"
 BEL_mechanized_equipment_3: "Loyd Carrier"
 BEL_mechanized_equipment_3_short: "Loyd Carrier"
 BEL_mechanized_equipment_4: "M59"
 BEL_mechanized_equipment_4_short: "M59"
 BEL_mechanized_equipment_4_desc: "M59 - это БТР, разработанный корпорацией FMC в 1951 году. Он использовался во Вьетнаме и Ливане. M75 имел 2 6-цилиндровых рядных бензиновых двигателя, гидромеханическую трансмиссию 301MG и торсионную подвеску. Он мог двигаться со скоростью до 32 миль/ч на протяжении 120 миль. M59 быстро заменил M75, поскольку он был амфибией, имел меньшие размеры и был намного дешевле в производстве. M59 также использовался в качестве миноносца и машины поддержки."
 BEL_mechanized_equipment_5: "AMX-VTP"
 BEL_mechanized_equipment_5_short: "AMX-VTP"
 BEL_mechanized_equipment_6: "M113-B"
 BEL_mechanized_equipment_6_short: "M113-B"
 BEL_mechanized_equipment_7: "AIFV-B-.50"
 BEL_mechanized_equipment_7_short: "AIFV-B-.50"
 BEL_mechanized_equipment_7_desc: "Бельгийский армейский вариант почтенного AIFV с 12,7-мм пулеметом CWS, двумя 71-мм минометами Lyran и креплением для ракетной установки MILAN."
 BEL_mechanized_equipment_8: "AIFV-A1-B-.50"
 BEL_mechanized_equipment_8_short: "AIFV-A1-B-.50"
 BEL_mechanized_equipment_8_desc: "Обновление в середине жизни бельгийского армейского варианта почтенного AIFV с 12,7-мм CWS cuppola, двумя 71-мм минометами Лиран и креплением для ракетной установки МИЛАН."
 BEL_mechanized_equipment_9: "Steyr-Daimler-Puch Spezialfahrzeuge Пандур I"
 BEL_mechanized_equipment_9_short: "Пандур I"
 BEL_mechanized_equipment_9_desc: "Пандур - это БТР, разработанный и производимый австрийской компанией Steyr-Daimler-Puch Spezialfahrzeuge (SSF). Он был разработан в 1980-х годах как частное предприятие."
 BEL_mechanized_equipment_10: "Mowag Piranha IIIC FUS"
 BEL_mechanized_equipment_10_short: "Piranha IIIC FUS"
 BEL_mechanized_equipment_10_desc: "Вариант Mowag Piranha 8x8 для бельгийской армии, призванный заменить более ранние гусеничные AIFV и M113 на вооружении Бельгии после окончания холодной войны. Назван Фузилер, чтобы указать на его роль в качестве транспорта для бельгийской пехоты."
 BEL_mechanized_heavy_equipment_2: "M75"
 BEL_mechanized_heavy_equipment_2_short: "M75"
 BEL_mechanized_heavy_equipment_2_desc: "M75 - тяжелый БТР, разработанный корпорацией International Harvester в начале 1950-х годов. M75 широко использовался во время Корейской войны, но затем был быстро снят с вооружения. M75 оснащен 6-цилиндровым бензиновым двигателем AO-895-4 и торсионной подвеской. Он может двигаться со скоростью 43 миль/ч, а запас хода составляет 115 миль. После того, как проект M44 был отменен из-за его непомерных размеров, началась разработка еще одного полностью закрытого тяжелого PC. В результате проекта M75 было создано гораздо меньшее шасси, которое было намного быстрее M44. Однако он все еще считался слишком большим, и проект M95 продолжал финансироваться."
 BEL_mechanized_heavy_equipment_5: "FMC AIFV-B-C25"
 BEL_mechanized_heavy_equipment_5_short: "AIFV-B-C25"
 BEL_mechanized_heavy_equipment_5_desc: "Доработанный голландский вариант, оснащенный подвеской, аналогичной M113A1-B (похожей на M113A2), системой NBC и системой пожаротушения Halon."
 BEL_mechanized_heavy_equipment_6: "FMC AIFV-A1-B-C25"
 BEL_mechanized_heavy_equipment_6_short: "AIFV-A1-B-C25"
 BEL_mechanized_heavy_equipment_6_desc: "Обновленный вариант оригинального AIFV на вооружении бельгийской армии Подвеска аналогична M113A1-B (аналогична M113A2), система NBC и система пожаротушения Halon."
 BEL_mechanized_heavy_equipment_7: "FMC AIFV-A2-B-C25"
 BEL_mechanized_heavy_equipment_7_short: "AIFV-A2-B-C25"
 BEL_mechanized_heavy_equipment_7_desc: "Дальнейшая обновленная версия почтенного AIFV на вооружении бельгийской армии с улучшенным оборудованием ночного видения и повышенной защитой от NBC."
 BEL_mechanized_heavy_equipment_8: "Ateliers de Constructions Electriques de Charleroi Кобра GAD-AOA"
 BEL_mechanized_heavy_equipment_8_short: "ACEC Кобра GAD-AOA"
 BEL_mechanized_heavy_equipment_8_desc: "Прототип для нового БМП бельгийской армии, который был отменен в связи с окончанием холодной войны. Вооружен 25-мм башней Эрликон-Контравес GAD-AOA с 20-мм пушкой модели 204GK, а также возможностью установки компактной башни Евроракета МИЛАН."
