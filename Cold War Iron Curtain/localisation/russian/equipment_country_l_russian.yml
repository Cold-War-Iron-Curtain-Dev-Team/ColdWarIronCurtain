 YUG_infantry_equipment_0: "Пушка M1924B"
 YUG_infantry_equipment_0_short: "M.1924B"
 YUG_infantry_equipment_0_desc: "Винтовка Болтовая на базе немецкой Gewehr 98."
 YUG_infantry_equipment_1: "Пушка М.48 7,9 мм"
 YUG_infantry_equipment_1_short: "Застава M48"
 YUG_infantry_equipment_1_desc: "После Второй мировой войны, в отличие от большинства других стран, Югославия не приняла на вооружение автоматическую/полуавтоматическую винтовку. Вместо этого на вооружение была принята Застава М48, отечественный вариант немецкой Карабин 98к.\nНесмотря на внешнее сходство, многие детали югославских и немецких винтовок не взаимозаменяемы, особенно затвор и связанные с ним детали. Винтовки М48 обычно отличаются от 98k по верхней планке, которая выступает за мушку и заканчивается непосредственно перед кольцом ствольной коробки. Ложа M48 была сконструирована так же, как и у 98k, но у нее более короткие ствольная коробка и затвор средней длины. Большинство ложей M48 изготавливаются из более толстой древесины вяза или бука и имеют толстую пластину приклада из нержавеющей стали в задней части ложи."
 YUG_infantry_equipment_2: "Застава M70"
 YUG_infantry_equipment_2_short: "Застава M70"
 YUG_infantry_equipment_2_desc: "Разработка отечественной штурмовой винтовки началась в 1959 году компанией \"Застава\" с серии автоматов М59 и М64 с фрезерованными стволами, нарезными стволами, привычными для \"Заставы\" рукоятками, газоотводными отверстиями для взведения гранаты и некоторыми другими отличиями от основной конструкции АК, такими как устройство для удержания затвора в открытом положении на правой стороне ствольной коробки и рукоятка заряжания, отличающаяся от других моделей АК. Несмотря на удовлетворительные характеристики, югославские военные по разным причинам не приняли винтовку на вооружение.\n\nВ 1970 году был дан зеленый свет для начала финансируемого армией серийного производства M70 и M70A (Automatska Пушка Модель 1970, \"Автоматическая винтовка Модель 1970\"), из которых M70A была версией со складным прикладом. Со временем было реализовано несколько мер по повышению эффективности производства, таких как устранение внутренней задержки затвора и замена фрезерованных ствольных коробок штампованной сталью, сначала 0.9мм, а позже более толстой 1.5мм."
 YUG_infantry_equipment_3: "Застава М80"
 YUG_infantry_equipment_3_short: "Застава M80"
 YUG_infantry_equipment_3_desc: "Наряду с НАТО и Советским Союзом Югославия в конце 70-х годов начала переход на промежуточные патроны. Результатом этого стала винтовка Застава М80. Это практически идентичная копия M70 Модель, с той лишь разницей, что M80 был создан под патрон 5.56×45 мм НАТО.\nСемейство M80 имеет два различных \"вкуса\", обозначаемых просто как M80 и M80A. Основное различие между этими двумя формами заключается в ложе, причем M80 является базовой версией с фиксированным деревянным ложе, а M80A - компактной версией со складным металлическим ложе. Металлический приклад складывается под ствольную коробку и способствует значительно более короткому профилю, что делает эту Модель идеальной для десантников, спецподразделений и экипажей транспортных средств. "
 YUG_infantry_equipment_4: "Застава M90"
 YUG_infantry_equipment_4_short: "Застава M90"
 YUG_infantry_equipment_4_desc: "Дальнейшее развитие M80, M90 больше походила на западные винтовки с магазином типа STANAG и вспышкой-распылителем западного образца.\n M90 должна была заменить M70 в югославской армии, но распад Югославии нарушил производство, и сегодня это оружие остается редким и никогда официально не использовалось, вероятно, из-за отсутствия боеприпасов 5.56×45 мм НАТО."
 SIK_infantry_equipment_0: "Мосин ко. 91/30"
 SIK_infantry_equipment_0_short: "Мосин"
 SIK_infantry_equipment_0_desc: "Мосин-Нагант - Русская винтовка с продольно-скользящим затвором, использовавшаяся в Российской империи и созданная на основе конструкции, импортированной из Франции. В 1889 году МОРИ (Министерство обороны Российской империи) приобрело у Франции винтовку Лебеля-1886 и попыталось усовершенствовать ее конструкцию. Министерство наняло различных русских ученых и инженеров под руководством капитана Сергея Мосина и Леона Нагана для усовершенствования конструкции, и после долгих испытаний и создания опытных образцов был создан Наган Мосина. В 91-м году 1891 года винтовка Мосина была запущена в производство. Винтовка имеет длительное время разборки, но отличается высокой точностью стрельбы. Она широко использовалась в Русско-японской войне, Первой мировой войне, гражданской войне в Российской империи, которая привела к образованию Советского Союза, Второй мировой войне и многочисленных мировых конфликтах."
 SIK_infantry_equipment_1: "Автомат Калашникова 1947"
 SIK_infantry_equipment_1_short: "AK-47"
 SIK_infantry_equipment_1_desc: "AK47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. На протяжении многих лет АК47 будет считаться одним из самых надежных и простых в обслуживании, обращении и изучении оружием в мире."
 SIK_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 SIK_infantry_equipment_2_short: "АКМ"
 SIK_infantry_equipment_2_desc: "АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия был значительно уменьшен на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ сразу и повсеместно стал использоваться во многих коммунистических странах и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
 SIK_infantry_equipment_3: "Автомат Калашникова 1974"
 SIK_infantry_equipment_3_short: "AK-74"
 SIK_infantry_equipment_3_desc: "АК74 - современный автомат, разработанный Михаилом Калашниковым для замены АКМ в 1974 году. Он использует патрон меньшего калибра и улучшенный хромированный ствол с 4 правосторонними канавками. Мушка и газоотводная колодка были переделаны таким образом, что в них появился канал, установленный под углом 90 градусов к оси ствола для уменьшения сдвига пули при удержании ствола. Кроме того, в его конструкцию входили различные приспособления, включая ложе с резиновыми накладками. Усовершенствования АК74 позволили солдатам переносить большее количество боеприпасов в полевых условиях и вести более интенсивный огонь с высокой точностью на средних дистанциях. Он получил дорогое применение во время конфликта в Афганистане, где ЦРУ заплатило моджахедам большую сумму денег за захваченный АК74."
 SIK_infantry_equipment_4: "Автомат Калашникова 1974 года модернизированный"
 SIK_infantry_equipment_4_short: "AK-74M"
 SIK_infantry_equipment_4_desc: "АК-74М - усовершенствованный вариант АК-74, разработанный в 1991 году на заводе \"Ижмаш.\" В АК-74М были применены новые материалы и производственные достижения для создания более совершенного оружия. Он имеет облегченные затвор и ствольную коробку, что уменьшает отдачу от газового поршня. Винтовка также имеет ложе из стеклонаполненного полиамида с возможностью боковой фиксации, улучшенное дуло, усиленный кожух и ряд других мелких усовершенствований. Кроме того, в комплект входит планка для установки оптики. Облегченный и усиленный автомат стал более удобным в обращении и переноске, улучшилась поддержка навесного оборудования. Он не была принят на вооружение Советским Союзом, так как СССР распался, однако он был принят на вооружение Российской Федерацией."
 PRC_infantry_equipment_0: "Сиамский Маузер Тип 45"
 PRC_infantry_equipment_0_short: "СМ-45"
 PRC_infantry_equipment_0_desc: "СМ-45, или сиамская винтовка Маузер Тип 45, - это винтовка с продольно-скользящим затвором, разработанная компанией Koishikawa Arsenal в 1903 году. Изначально винтовка была разработана в рамках программы военных разработок короля Рамы V, которая была начата из-за опасений западной экспансии на Востоке. Сама винтовка была разработана на основе Gewehr 98, но с несколькими заметными улучшениями в удобстве использования и эргономике. С момента своего создания СМ-45 в небольших количествах производился в Китае, но в основном китайцы полагались на лицензионное производство. С момента своего появления он участвовал в каждой войне, затрагивающей восточную сферу."
 PRC_infantry_equipment_1: "Штурмовая винтовка ZB-56"
 PRC_infantry_equipment_1_short: "ZB-56"
 PRC_infantry_equipment_1_desc: "ZB-56 - автоматическая штурмовая винтовка, разработанная КНР в 1956 году на основе АК-47. С момента разработки автомат принимал участие во всех войнах, в которых участвовала КНР. ZB-56 имеет ряд отличий от АК-47. Они были изготовлены с фрезерованной ствольной коробкой и полностью закрытым прицелом. Ствол также тяжелее и больше похож на ствол РПК, за исключением того, что у него отсутствует усиленная цапфа. Кроме того, ствол не имеет нарезного дула. Поскольку ZB-56 обладает легендарной надежностью и очень прост в эксплуатации, он продолжает использоваться армиями всего мира. Кроме того, его производство обходится несколько дешевле, чем АК-47."
 PRC_infantry_equipment_2: "Штурмовая винтовка ZB-63"
 PRC_infantry_equipment_2_short: "ZB-63"
 PRC_infantry_equipment_2_desc: "ZB-63 - автоматическая штурмовая винтовка, разработанная правительственным арсеналом КНР в 1963 году. Он принимал участие в боевых действиях во Вьетнаме, Камбодже, Афганистане, Косово и Туареге. Оружие имеет внутренний механизм, аналогичный АК, и внешний механизм и корпус, аналогичные СКС. Это позволяет оружию найти компромисс между дальностью и мощностью автоматического огня, что делает его сравнимым с дальнобойным ZB-56. Дальность стрельбы в два раза выше, чем у СКС, а скорострельность несколько выше, чем у ZB-56. Оружие очень надежно и имеет небольшую цену. За 10 лет производства было выпущено более 1 миллиона винтовок."
 PRC_infantry_equipment_3: "Штурмовая винтовка ZB-81"
 PRC_infantry_equipment_3_short: "ZB-81"
 PRC_infantry_equipment_3_desc: "ZB-81 - это автоматическая штурмовая винтовка, которая может быть модифицирована в различные виды оружия, разработанная компанией Norinco в 1981 году. С момента своего появления она побывала во всех китайских конфликтах, включая китайско-вьетнамскую войну, Афганистан и Шри-Ланку. ZB-81 является усовершенствованной моделью ZB-63, но не имеет такой же эффективной дальности стрельбы. Само оружие обладает большей огневой мощью, чем ZB-63, и включает в себя различные элементы от автоматов Драгунова, СКС и АК47. Кроме того, срок службы оружия больше, чем у АК47. Кроме того, оружие поддерживает подствольное навесное оборудование."
 PRC_infantry_equipment_4: "Автоматическая винтовка QBZ-95"
 PRC_infantry_equipment_4_short: "QBZ-95"
 PRC_infantry_equipment_4_desc: "QBZ-95 - это современная автоматическая легкая винтовка типа булл-пап, разработанная Дуо Инсянем в 1991 году. Оружие использовалось в Пакистане и Бирме. QBZ-95 имеет дальность стрельбы, аналогичную ZB-81, но значительно большую огневую мощь и более высокую скорострельность. Оружие было разработано для замены ZB-81 с механизмом буллпап, чтобы укоротить винтовку и облегчить ее перезарядку. В конструкции винтовки использованы полимерные материалы, поворотный затвор и короткоходный поршень. Она устойчива к коррозии и атмосферным воздействиям, что делает ее хорошо подходящей для использования в экстремальных условиях."
 PRC_explosives_1: "Тип 42"
 PRC_explosives_2: "Тип 67"
 CHI_infantry_equipment_0: "Тип Чан Кайши Винтовка"
 CHI_infantry_equipment_0_short: "Тип 24"
 CHI_infantry_equipment_0_desc: "Тип винтовки Чан Кайши, также известный как винтовка Чжунчжэн/Цзян Цзеши (в зависимости от латинизации китайского языка), винтовка генералиссимуса и Тип 24, названный в честь китайского генералиссимуса Чан Кайши, был китайской копией немецкой винтовки Штандартмоделль, предшественницей Карабин 98к."
 CHI_infantry_equipment_1: "Американская Винтовка, калибр 7,62 мм, M14"
 CHI_infantry_equipment_1_short: "M14"
 CHI_infantry_equipment_1_desc: "M14 или официально известная как United States Rifle, Caliber 7.62 мм, M14 - американская боевая винтовка под патрон 7.62x51мм НАТО. Она стала стандартной винтовкой вооруженных сил США в 1959 году, заменив винтовку M1 Гаранд в армии США в 1958 году и в Корпусе морской пехоты США в 1965 году. Это была последняя американская боевая винтовка, выпущенная в массовом количестве для военнослужащих США. Мощность патрона 7,62×51 мм НАТО позволяла винтовке хорошо пробивать укрытия и действовать на больших дистанциях. Винтовка использовалась в основном в многочисленных войнах в Индокитае, но основное внимание к ней было приковано во время войны во Вьетнаме. После замены его на M16 он экспортировался во многие страны."
 CHI_infantry_equipment_2: "Государственный арсенал Китайской Республики Тип 57 Battle Rifle"
 CHI_infantry_equipment_2_short: "T57"
 CHI_infantry_equipment_2_desc: "Вариант винтовки M14, производимый Китайской Республикой. M14 или официально известная как Американская винтовка, калибр 7,62 мм, M14 - американская боевая винтовка под патрон 7.62x51мм НАТО."
 CHI_infantry_equipment_3: "Объединенное командование материально-технического обеспечения Тип 65"
 CHI_infantry_equipment_3_short: "T65"
 CHI_infantry_equipment_3_desc: "T65\" - винтовка, разработанная и произведенная Объединенным командованием материально-технического обеспечения вооруженных сил Китайской Республики на Тайване. Изначально винтовка была создана по образцу Armalite AR-18 с короткоходной газоотводной системой, но на прототипе, представленном в 1975 году, была показана винтовка, созданная под влиянием семейства винтовок AR-15, хотя и с измененными прицельными приспособлениями, измененной формой ложи и переделанными наручниками."
 CHI_infantry_equipment_4: "Объединенное командование материально-технического обеспечения Тип 65K2"
 CHI_infantry_equipment_4_short: "T65K2"
 CHI_infantry_equipment_4_desc: "Модернизация винтовок семейства Т65. В конструкции T65 рукоятка для переноски винтовок образца M16 была заменена на прицельную планку. Рукоятка для переноски вернулась на винтовку T65K2 (но была съемной на карабине T91). T65 использует магазины, совместимые с винтовками AR-15."
 VIE_infantry_equipment_0: "Американская винтовка, калибр .30, M1"
 VIE_infantry_equipment_0_short: "M1 Гаранд"
 VIE_infantry_equipment_0_desc: "M1 Гаранд - это крупнокалиберное оружие, разработанное Джоном К. Гарандом в 1928 году для США. M1 Гаранд - это самозарядная винтовка калибра .30, которая широко использовалась во время Второй мировой войны. Она стала одной из первых винтовок, использующих газоотводную систему перезарядки для досылания нового патрона после выстрела. Винтовка использует обоймы, заряжаемые с верхней части ствола, и может быть оснащена дополнительным оборудованием, включая противотанковую ружейную гранату M31 HEAT. Это универсальное оружие с исключительной дальностью и точностью стрельбы. Он стал символом и до сих пор используется современными учебными командами в США."
 VIE_infantry_equipment_1: "M2 Карабин"
 VIE_infantry_equipment_1_short: "M2 Карабин"
 VIE_infantry_equipment_1_desc: "Изначально предполагалось, что M1 Карабин будет иметь возможность ведения селективного огня, но было принято решение запустить M1 в производство без этой функции. Полностью автоматическая винтовка была включена в конструкцию M2 (улучшенный вариант M1), представленного в 1944 году. В M2 были внесены усовершенствования, характерные для поздней версии M1: добавлен прицел, добавлено штыковое ушко и другие незначительные изменения. M2 поступил на вооружение во Вьетнаме вместе с ранними M14, а затем в качестве дешевого оружия, поставляемого силам ARVN."
 VIE_infantry_equipment_2: "Американская Винтовка, калибр 5,56 мм, M16A1"
 VIE_infantry_equipment_2_short: "M16A1"
 VIE_infantry_equipment_2_desc: "Военные чиновники США отметили, что M2 Карабин значительно превосходит АК47 и немецкий StG44, и в 1956 году началась разработка M16. В 1959 году Юджин Стоунер и Джеймс Салливан завершили работу над этим оружием. Оно продемонстрировало исключительные возможности и превзошло АК47 и АКМ. В частности, оружие обладало гораздо большей огневой мощью, чем M2 Карабин, было более точным, чем AK47, а также носило более легкие боеприпасы при минимальных потерях в мастерстве. Однако, несмотря на превосходство над АК47 в общих испытаниях, автомат обладал низкой надежностью, из-за чего не мог считаться равным ему. Особенно во Вьетнаме, где поломки были очень частым явлением."
 VIE_infantry_equipment_3: "Американская Винтовка, 5,56 мм, M16A2"
 VIE_infantry_equipment_3_short: "M16A2"
 VIE_infantry_equipment_3_desc: "После частых случаев ненадежности оружия в джунглях Вьетнама, морская пехота США запросила перепроектирование оружия. В 1982 году была произведена переделка и усовершенствования. Оружие отличалось усиленной ствольной коробкой, новым нарезным стволом, усиленным корпусом, улучшенным охлаждением за счет использования других материалов, улучшенной поддержкой навесного оборудования и переработанным внутренним механизмом, что обеспечило ему высокий уровень надежности. Винтовка принимала участие в боевых действиях в Ливане, Ливии, Египте и других конфликтах, в которых участвовали США с момента ее создания."
 VIE_infantry_equipment_4: "Американская Винтовка, 5,56 мм, M16A4"
 VIE_infantry_equipment_4_short: "M16A4"
 VIE_infantry_equipment_4_desc: "M16A4 - это четвертое поколение серии M16. Прицел/ручка для переноски, установленный на верхней части ствольной коробки M16A2/M16A3, был заменен на верхнюю часть ствольной коробки MIL-STD-1913 \"Picatinny railed\" плоская верхушка для установки прицельной оптики или съемного прицела/ручки для переноски. Задний апертурный прицел M16A4, интегрированный в узел рукоятки для переноски на рейке Пикатинни, регулируется в диапазоне от 300 м (328 ярдов) до 600 м (656 ярдов), в то время как аналогичный прицел M16A2 может достигать 800 м (875 ярдов)."
 VIE_team_weapons_1: "M1919 Браунинг (ТП), M1 Миномет (Миномет)"
 VIE_team_weapons_1_short: "M1919 Браунинг, M1 Миномет"
 VIE_team_weapons_1_desc: "M1919 Браунинг - тяжелый пулемет, разработанный в 1919 году Джоном Браунингом. Оружие стало культовым после его знаменитого использования во время Великой войны Эму, но оно также применялось во время Второй мировой войны. Оружие использует патроны калибра .30, имеет короткую отдачу и эффективную дальность стрельбы 1500 ярдов. Предшественник M1917 имел водяное охлаждение, но для облегчения оружия оно было удалено за счет сокращения времени стрельбы. Это оказалось опасным, так как при перегреве репеллент мог нагреваться и приводить к выстрелам без предупреждения, что приводило к неконтролируемому огню./nМ1 Миномет - это вариант французского Миномет Брандта, созданный США в начале Второй мировой войны. Он стреляет из 81-мм пушки Миномет калибра до 1,9 мили. Он широко использовался во время Второй мировой войны, а также применялся во Вьетнаме и Корее."
 VIE_team_weapons_2: "M2 Браунинг (ТП), M29 Миномет (Миномет), M75 (РПД)."
 VIE_team_weapons_2_short: "M2 Браунинг, M29 Миномет, M75."
 VIE_team_weapons_2_desc: "M2 Браунинг - это ТП, который обычно устанавливается на транспортные средства, но может использоваться и как установленное орудие. Он стреляет патронами 50-го калибра и имеет гораздо большую огневую мощь, чем M1919. Он был разработан в 1919 году Джоном Браунингом и использовался на протяжении всей Второй мировой войны. По сложности и качеству он аналогичен M1919, но тяжелее и имеет более тяжелые боеприпасы./nМ29 Миномет - американский Миномет, созданный для замены M1 Миномет в 1952 году специальной командой. Он может производить 4-12 выстрелов в минуту, гораздо легче и имеет большую дальность стрельбы. Кроме того, он хромирован для повышения надежности оружия и улучшения очистки./nM75 РПД - тяжелый гранатомет, разработанный компанией Philco-Ford в 1961 году и использовавшийся во время войны во Вьетнаме. Гранатомет автоматический, с электроприводом и скорострельностью 225 выстрелов в минуту на расстояние до 2045 ярдов. Сама пусковая установка была очень быстро заменена из-за ряда проблем с надежностью, энергоэффективностью и весом."
 VIE_team_weapons_3: "Mk19 (РПД)."
 VIE_team_weapons_3_short: "Mk19"
 VIE_team_weapons_3_desc: "Mk19 - это тяжелый гранатомет, используемый в установках или на транспортных средствах. Он был разработан в 1966 году в NOSL и использовался во Вьетнаме, в войне в Персидском заливе, Афганистане, Ираке и в мексиканских нарковойнах. Первая Модель РПД была крайне ненадежной и небезопасной, но более поздние модели доказали свою высокую эффективность и вероятность поражения противника выше, чем оператора. Орудие может производить 40 40-мм выстрелов в минуту на расстояние до 1600 ярдов."
 VIE_team_weapons_4: "M85 (ТП), M224 Миномет (Миномет)."
 VIE_team_weapons_4_short: "M85, M224 Миномет"
 VIE_team_weapons_4_desc: "M85 - это крупнокалиберный пулемет, который был разработан в 80-х годах компанией General Electric для замены M2 Браунинг. Он использовался в войне в Персидском заливе, но после этого не принимал участия в боевых действиях. Вес M2 Браунинг привел к тому, что армия США в конечном итоге заказала разработку M85. M85 имеет гораздо больший вес и обладает избирательной скорострельностью. Кроме того, он имеет возможность изменять конфигурацию частей и направления подачи, что повышает его универсальность./n Миномет M224 был разработан в 1978 году специальной командой. Миномет принимал участие в боевых действиях в Персидском заливе, Ираке, Афганистане, а его прототипы использовались во Вьетнаме. Сам Миномет был сделан из более легких и прочных деталей, чем M29, и его легче обслуживать в полевых условиях."
 VIE_team_weapons_5: "XM312 (ТП), XM307 (РПД)."
 VIE_team_weapons_5_short: "XM312, XM307"
 VIE_team_weapons_5_desc: "XM312 ТП создан на основе автопушки XM307 и рассчитан на патроны 50 калибра. Автопушка XM307 представляет собой автоматическую ГСВГ с возможностью подрыва в воздухе. XM307 был разработан в конце 90-х годов, а XM312 появился в 2000 году. Обе пушки были созданы компанией General Dynamics и еще не принимали участия в боевых действиях. Обе пушки могут быть быстро переделаны друг в друга в полевых условиях, что позволяет подразделению переключаться на ТП или РПД в зависимости от текущей ситуации. Они легкие (для тяжелых орудий) и надежные, хотя и дорогие. "
 VIE_squad_weapons_1: "Браунинг 1918A2 BAR (РП)"
 VIE_squad_weapons_1_short: "Браунинг 1918A2"
 VIE_squad_weapons_1_desc: "Браунинг 1918A2 (он же BAR) назван в честь человека, который разработал его в 1917 году для армии США, конструктора Джона Браунинга, а не за то, что происходит со штанами противника, когда он его видит. Само оружие представляет собой РП, использующий автоматику с продольно-скользящим поворотным затвором и газоотводной автоматикой. Эффективная дальность стрельбы составляет 1500 ярдов, а вес исключительно мал даже для РП. Винтовка BAR широко использовалась во время Второй мировой войны, где она продемонстрировала значительные возможности."
 VIE_squad_weapons_2: "M79 (ПЛ)"
 VIE_squad_weapons_2_short: "M79"
 VIE_squad_weapons_2_desc: "M79 - это однозарядный гранатомет, разработанный в 1960 году компанией \"Спрингфилд Армори\" для армии США. Это однозарядный гранатомет, стреляющий 40-мм гранатами. Во время использования во Вьетнамской войне он показал, что обладает невероятной огневой мощью и стреляет дольше, чем винтовочные гранаты, но более портативен, чем Миномет, что позволяет ему помогать в боевых действиях пехоте и хорошо действовать против легких машин противника и против врагов в укрытии."
 VIE_squad_weapons_3: "M60 (РП)."
 VIE_squad_weapons_3_short: "M60"
 VIE_squad_weapons_3_desc: "M60 - это РП, разработанный для армии США в 1957 году компанией Saco Defense. Он может стрелять шариковыми, трассирующими и бронебойными патронами. РП использует газовый поршень с коротким ходом и открытый затвор. Система питания - дезинтегрирующая лента, эффективная дальность стрельбы - 1200 ярдов. Он очень недорог в использовании и до сих пор используется армией США благодаря своей низкой стоимости и высокой жизнеспособности в бою. Однако он ненадежен в экстремальных условиях, особенно при загрязнении. Кроме того, он чрезвычайно тяжел для РП, хотя является одним из самых легких 7,62-мм пистолетов. Он принимал участие в боевых действиях во Вьетнаме, Камбодже, войне в Персидском заливе, Ираке, Афганистане и против ИГИЛ. "
 VIE_squad_weapons_4: "M249 (РП), M32 (ПЛ)."
 VIE_squad_weapons_4_short: "M249, M32"
 VIE_squad_weapons_4_desc: "M249 - это РП, разработанный компанией FN Herstal в 1976 году. Он значительно легче и надежнее, чем M60, но имеет меньшую общую огневую мощь. M249 использовался во всех крупных конфликтах с участием США, начиная с вторжения в Панаму. Благодаря меньшему весу и более высокой надежности, он лучше, чем M60, работает в негородских контролируемых условиях и лучше подходит в качестве наступательного оружия для отрядов. Фактически, M249 был первоначально заказан для замены M60 в качестве более легкого оружия./nГранатомет M32 - это американский вариант револьверного гранатомета Милкор MGL."
 VIE_squad_weapons_5: "MK48 (РП), XM25 (ПЛ)."
 VIE_squad_weapons_5_short: "MK48, XM25"
 VIE_squad_weapons_5_desc: "MK48 - это РП, разработанный в 2003 году компанией FN Herstal совместно с Командованием специальных операций США. Он очень легкий для РП и широко использовался США в боевых действиях в Ираке и Афганистане. Сам автомат очень легко разбирается и может быть использован в полевых условиях для замены перегретых стволов. Его основное преимущество перед M249 - малый вес и значительно более упрощенные детали, что облегчает обслуживание и производство./nГранатомет XM25 CDTE - современный гранатомет типа \"буллпап\", разработанный в 2010 году компанией Heckler and Koch и использовавшийся в войне в Афганистане."
 VIE_specialist_1: "M1903 Спрингфилд (СВ)"
 VIE_specialist_1_short: "M1903 Спрингфилд"
 VIE_specialist_1_desc: "M1903 Спрингфилд - это винтовка с продольно-скользящим затвором, которая использовалась снайперами во время Второй мировой войны. Она была разработана Спрингфилдской оружейной фабрикой в 1903 году и сразу же стала использоваться. Спрингфилд - это пятизарядная винтовка с продольно-скользящим затвором, ведущая эффективную стрельбу патронами .30-06 на дальность до 1000 ярдов. Однако максимальная дальность стрельбы достигает 5500 ярдов. Было выпущено более 3 миллионов таких винтовок, и снайперы часто использовали их во время Второй мировой войны."
 VIE_specialist_2: "M40 (СВ)"
 VIE_specialist_2_short: "M40"
 VIE_specialist_2_desc: "M40 - снайперская винтовка с продольно-скользящим затвором, разработанная в 1966 году компанией Remington arms для КМП США. Она стреляет стандартными патронами 7,62x51 мм и имеет дальность стрельбы 900 ярдов. Винтовка использовалась во Вьетнаме, во время войны в Персидском заливе, в Афганистане, Ираке и Ливане. M40 отличается высокой надежностью и сравнительно прост в обслуживании. Он был эффективен в качестве снайперской винтовки для борьбы с пехотой."
 VIE_specialist_3: "M21 (СВ)"
 VIE_specialist_3_short: "M21"
 VIE_specialist_3_desc: "M21 - один из самых сексуальных пистолетов, когда-либо созданных. M21 - это крутая полуавтоматическая снайперская винтовка, которая использовалась в США и других странах, которые были достаточно благословенны, чтобы иметь такое великолепное оружие. Разработанная в 69-м году командованием вооружений морской пехоты после вдохновения, полученного непосредственно от Бога, она может нанести окончательный приговор на эффективной дистанции 900 ярдов и использует великолепный боеприпас 7,62x51 мм. В зависимости от ваших предпочтений он может иметь магазин на 5, 10 или 20 патронов. Он продемонстрировал свою непревзойденную мощь и мастерство в войнах во Вьетнаме и Ираке и, вероятно, выиграл бы войну во Вьетнаме, если бы его прислали больше. Неудивительно, что такое невероятное легендарное оружие используется и сегодня."
 VIE_specialist_4: "Barrett M82 (AMR), M24 (СВ)."
 VIE_specialist_4_short: "M82, M24."
 VIE_specialist_4_desc: "Barrett M82 - полуавтоматическая снайперская винтовка булл-пап, использующая боеприпасы 50-го калибра. Она была разработана в 1980 году Ронни Барреттом к войне в Афганистане и Ираке. Эффективная дальность стрельбы составляет 2000 ярдов, она способна пробивать стены, любые виды бронежилетов и легкобронированную технику. M82 является культовым оружием благодаря своей эффективности и способности противостоять боевым средствам. Лицензия на его производство очень востребована многими странами, и ею обладают 54 страны, а еще больше стран пытаются получить права на производство или приобрести это оружие./nМ24 - это снайперская винтовка с продольно-скользящим затвором, используемая армией США. Она была разработана в 1988 году компанией Remington arms и призвана заменить M40 в качестве стандартной снайперской винтовки. Эффективная дальность стрельбы составляет 875 ярдов, используется боеприпас 7,62х51 мм. Винтовка принимала участие в боевых действиях в Персидском заливе, Афганистане, Ираке и Сирии. M24 поставляется с бесплатным съемным оптическим прицелом и приставным штативом."
 VIE_specialist_5: "M110 (СВ)"
 VIE_specialist_5_short: "M110"
 VIE_specialist_5_desc: "M110 - это полуавтоматическая снайперская винтовка с вращающимся затвором и DMR. Первоначально она была разработана в 2007 году компанией Knight's Armament Company и введена в эксплуатацию после того, как американские военные увидели эффект от снайперов USSOCOM и отчетов о результатах действий снайперов SOF в Ираке. После конкурса, в котором участвовало множество различных разработок, была выбрана модель M110, и компания \"Найтс\" получила очень крупный контракт. С тех пор винтовка использовалась в Афганистане и Ираке. Эффективная дальность стрельбы составляет около 875 ярдов, и он может вести преследующий огонь гораздо дальше."
 VIE_ammo_explosives_1: "Mk2 Граната (Граната), FMJ (Патроны), M1 Химическая Мина (Мина)"
 VIE_ammo_explosives_1_short: "Mk2 Граната, FMJ, M1 Химическая Мина"
 VIE_ammo_explosives_1_desc: "Ручная Граната MK2 - это противопехотная ручная Граната, использовавшаяся Соединенными Штатами во время 2-й и 1-й мировых войн. Она была разработана в 1918 году большой специальной группой конструкторов и использовалась во многих странах. Сама по себе Граната представляет собой простой франгибированный боеприпас, который взрывается на взрывателе с таймером через ~4 секунды после выдергивания булавки. Во время 2-й мировой войны их было создано огромное количество, и поэтому, несмотря на то, что производство было минимальным, а в конце концов и вовсе прекратилось, они непрерывно использовались в течение многих лет./n Химическая Мина M1 - противопехотная Мина, содержащая иприт, который выделяется при детонации. Он использовался во время Второй мировой войны и мог поддерживать блокаду местности после детонации до тех пор, пока газ сохранялся./nПуля с цельнометаллической оболочкой - это пуля, изобретенная в 1882 году швейцарским полковником Эдуардом Рубиным. Однако за время, прошедшее с тех пор до Второй мировой войны, металлургия была усовершенствована, и поэтому в патроне WWII FMJ просто использовались более качественные материалы в уже существующей конструкции."
 VIE_ammo_explosives_2: "M26 (Граната), M18 Клеймор (Мина)."
 VIE_ammo_explosives_2_short: "M26, M18 Клеймор."
 VIE_ammo_explosives_2_desc: "Ручная Граната M26 - это осколочно-фугасная ручная Граната, разработанная большой специальной группой в 1950 году. Он поступил на вооружение и одновременно впервые принял участие в боевых действиях в Корейской войне. Он оснащен фрикционным взрывателем с таймером и обладает большей взрывной способностью, чем Mk2 Граната. Кроме того, раздроблению способствует предварительно зазубренная спираль внутри Граната, которая способствует раздроблению./nКлаймор Мина M18 - это противопехотная Мина направленного раздробления, разработанная в 1956 году большой специальной группой под руководством Нормана Маклеода. Он использовался во время войны во Вьетнаме, в КДМЗ и в Ираке. Для взрыва используется пластиковый колпачок M4, наполненный C4."
 VIE_ammo_explosives_3: "Патроны повышенной кучности, M67 Граната."
 VIE_ammo_explosives_3_short: "Патроны повышенной кучности (Патроны), M67 Граната (Граната)."
 VIE_ammo_explosives_3_desc: "Ручная Граната M67 - это противопехотная осколочная ручная Граната, созданная для замены серии M26, которая использовалась во Вьетнаме и Корее. Она содержит пиротехническую задержку и обладает большей взрывной способностью, чем M26. Он также оснащен предохранительной скобой для предотвращения случайного выдергивания штифта. Он использовался во всех войнах США, начиная с Вьетнама./снаряды nAP существуют уже много лет, возникли еще до Первой мировой войны и использовались в основном для пробивания боевых кораблей. После Первой мировой войны, когда на поле боя появился танк, были созданы миниатюрные патроны. В конце концов, в качестве ответа на бронежилеты были созданы небольшие калибры AP. Современные боеприпасы AP были созданы в 1965 году как ответ на увеличение количества тяжелобронированной пехоты и пехотного прикрытия. "
 VIE_ammo_explosives_4: "Утилитарные гранаты (Граната), M93 ПТ мина (Мина)"
 VIE_ammo_explosives_4_short: "Утилитарные гранаты, мины M93 ПТ"
 VIE_ammo_explosives_4_desc: "Утилитарные гранаты - это ручные гранаты, выполняющие специализированные функции, такие как вспышки, дымовые, зажигательные и т.д. Они могут использоваться для оглушения врагов. Они могут быть использованы для оглушения противника, маскировки позиций, а также для проведения зон поражения соответственно./nМины M93 - это противотанковые мины, разработанные компанией Textron в 1987 году. Она способна поражать цели на расстоянии до 100 метров от своей позиции. Мины M93 используют сейсмические и акустические датчики для отслеживания и идентификации близлежащих целей. Обнаружив цель, она поворачивается лицом к ней и запускает свой суббоеприпас - танталовую пулю весом 450 г.."
 VIE_ammo_explosives_5: "Современные Патроны (Патроны)."
 VIE_ammo_explosives_5_short: "Современные Патроны"
 VIE_ammo_explosives_5_desc: "В современную эпоху существует огромный арсенал различных типов специализированных боеприпасов, которые могут быть использованы в конкретных ситуациях. Современные патроны AP гораздо лучше пробивают цели, чем старые, и могут достигать более высоких скоростей. Современные сплавы позволяют стандартным боеприпасам наносить больший урон цели. Сгораемые пули или зажигательные патроны имеют особые ситуации, в которых они могут быть полезны. Кроме того, в современном бою дробовики могут иметь улучшенную практичность при использовании HE патронов, 000 патронов, флешетных патронов или зажигательных выстрелов."
 VIE_manpats_1: "M1 Базука"
 VIE_manpats_1_short: "M1 Базука"
 VIE_manpats_1_desc: "M1 Базука - это безоткатная противотанковая ракета, разработанная в 1942 году Эдвардом Улем. Было создано более 400000 единиц, и она широко использовалась во время Второй мировой войны, в Корее и Вьетнаме. M1 Базука - одно из первых реактивных противотанковых орудий. Она могла использоваться против бункеров, бронетехники, пулеметных гнезд или танков. Некоторые экземпляры M1 были захвачены немецкими войсками вскоре после выпуска, и их переработали для создания Panzerschreck. M1 стоил очень мало, и было создано огромное количество излишков боеприпасов, поэтому он использовался в будущих войнах и до сих пор используется малобюджетными армиями. При нынешних темпах использования это оружие, скорее всего, и дальше будет использоваться малобюджетными армиями. Однако с учетом того, что глобальное развитие привело к увеличению количества специализированных ВПК, а текущие конфликты исчерпали себя, вряд ли оно будет использоваться еще долго."
 VIE_manpats_2: "M20A1 Супербазука"
 VIE_manpats_2_short: "M20A1 Супербазука"
 VIE_manpats_2_desc: "Супербазука M20A1 - это совокупность большого количества усовершенствований, внесенных в базуку Эдвардом Улем на протяжении всей войны и вплоть до середины 50-х годов. Она отличалась легким литьем, вспомогательной опорой для установки, оптическим прицелом, увеличенной дальностью стрельбы в результате усовершенствования боеприпасов, улучшенным механизмом сцепления, магнитным спусковым крючком, заменяющим батарейное зажигание, металлической мебелью и возможностью разборки для облегчения мобильности и обслуживания. Эти усовершенствования сделали его гораздо более мощным оружием, чем M1, которое можно было использовать против более сильных целей. Он использовался в Корейской войне и во многих других конфликтах других стран."
 VIE_manpats_3: "M72 LAW"
 VIE_manpats_3_short: "M72 LAW"
 VIE_manpats_3_desc: "M72 LAW - легкая противотанковая неуправляемая ракетная установка с 1 выстрелом, разработанная FA Spinale, CB Weeks и PV Choate в 1963 году. Она была сразу же принята на вооружение вместо базуки и с момента своего появления принимала участие в боевых действиях во всех конфликтах США. Само оружие очень легкое, что позволяет пехотинцам носить его с собой и использовать везде, где это необходимо. Оно не перезаряжается, но весит всего 5,5 фунтов, так что им может пользоваться даже ваша бабушка. Эффективная дальность стрельбы составляет 660 футов. Оружие использовалось в Афганистане, Ираке, Сомали, войне в Персидском заливе и Вьетнаме."
 VIE_manpats_4: "M202 FLASH"
 VIE_manpats_4_short: "M202 FLASH"
 VIE_manpats_4_desc: "M202 FLASH - это многозарядная зажигательная ракетная установка, разработанная в 1978 году большой специальной группой и использовавшаяся в войне во Вьетнаме. Она может быть заряжена 66-мм зажигательными ракетами, использующими ТПД для воспламенения местности после взрыва. Он может гореть гораздо жарче напалма и создает достаточно тепла и дыма, чтобы заставить низколетящие вертолеты избегать района. Он может быть использован в качестве противотанкового оружия из-за огромного жара, который он создает на большой площади, эффективно поджаривая экипаж машины. В качестве альтернативы M202 может использовать 66-мм реактивные снаряды LAW, если оператору необходимо, чтобы он использовал реактивные снаряды прямого действия, а не покрывал огнем всю территорию. Официального широкомасштабного производства не было, хотя несколько сотен прототипов Модель было изготовлено и использовалось во Вьетнаме. "
 VIE_manpats_5: "M141/153 SMAW"
 VIE_manpats_5_short: "M141/153 SMAW"
 VIE_manpats_5_desc: "M153 SMAW - это противотанковая, противофортификационная ракетная установка, разработанная в 1984 году компанией McDonnell Douglas. Это оружие принимало участие в боевых действиях в Персидском заливе, Афганистане, Ираке и Йемене. M141 - это одноразовое противотанковое оружие, предназначенное для разрушения бункеров, с эффективной дальностью стрельбы 1200 ярдов, но может использоваться для поражения крупных целей и дальше. M153 - это оружие многоразового использования, стреляющее HEAA или термобарическими снарядами. SMAW может разрушать здания и имеет очень большой радиус взрыва. Однако он выделяет большое количество полутоксичного дыма, что делает стрельбу из него в закрытом помещении небезопасной без газовой защиты. Эта проблема не была решена до разработки SMAW II. Он принимал участие в боевых действиях в Персидском заливе, Афганистане и Ираке."
 VIE_hmg_1: "M45 Quadmount"
 VIE_hmg_1_short: "M45 Quadmount"
 VIE_hmg_1_desc: "M45 Quadmount - это буксируемое противовоздушное оружие с исключительной скорострельностью из 4 пулеметов M2 Браунинг. Он работает на электричестве и имеет максимальный радиус действия 1,6 мили. Он был разработан корпорацией WL Maxson в 1943 году и использовался во Второй мировой войне, Корейской войне и в качестве установки во время войны во Вьетнаме. Прозванный \"мясорубкой\", он мог использоваться горизонтально для поражения мягких целей и самолетов попеременно. M45 также устанавливалась на прицепы или полуприцепы для использования в качестве дешевой пушки СХ AA. "
 VIE_manpads_1: "Редай I"
 VIE_manpads_1_short: "Редай I"
 VIE_manpads_1_desc: "Редай - это противовоздушный ПЗРК, который был создан в 1959 году компанией Convair для адаптации к современным боевым действиям, где реактивные самолеты могли опережать или обгонять противовоздушные орудия. Для наведения на цель он использует инфракрасное излучение. В 1948 году армия США начала поиск новых средств ПВО для замены неэффективных орудий. Было исследовано множество различных концепций быстродвижущихся ракет, но в итоге ни одна из них не оказалась точной. В середине 1950-х годов компания Convair начала изучать возможность использования инфракрасного наведения для создания портативной ракетной системы класса \"поверхность-воздух.\" Для создания своего оружия компания Convair взяла за основу ранние ракеты класса \"воздух-воздух\" и сумела уменьшить их масштаб до меньшего уровня. Редай использовалась во Вьетнаме, Никарагуа и Афганистане."
 VIE_manpads_2: "Редай II"
 VIE_manpads_2_short: "Редай II"
 VIE_manpads_2_desc: "Редай II - это противовоздушный ПЗРК, разработанный компанией General Dynamics в 1967 году. В нем используется инфракрасная самонаводящаяся ракета класса \"поверхность-воздух\" для наведения на цель. В нем был установлен более мощный компьютер, улучшены детали и общая конструкция, что позволило сделать его более надежным. Хотя Редай II была улучшена по сравнению с Редай I, она не производилась широко и оставалась прототипом, поскольку большинство ее усовершенствований можно было просто добавить к Редай I. Можно считать, что разработка Редай II в данном контексте - это улучшение компьютера Редай I и производство более совершенного оборудования."
 VIE_manpads_3: "Стингер A"
 VIE_manpads_3_short: "Стингер A"
 VIE_manpads_3_desc: "Стингер A - это конечный результат проекта Редай II, который был завершен в 1980 году компанией General Dynamics. Стингер A полностью переработал всю систему Редай и оснащен двойным инфракрасным и ультрафиолетовым искателем для лучшего определения того, что является контрмерой, а что - реальной целью. Боеприпасы Стингер A содержат более мощную смесь, обеспечивающую большую мощность по сравнению с предшественником и дальность стрельбы. Он продемонстрировал свою мощь в Фолклендской войне, Афганистане, ирано-иракской войне и многих других ближневосточных конфликтах."
 VIE_manpads_4: "Стингер C"
 VIE_manpads_4_short: "Стингер C"
 VIE_manpads_4_desc: "Стингер C - это усовершенствование Стингер B, законченное примерно в 1990 году компанией General Dynamics. Стингер B имел улучшенный искатель с функцией сканирования розетки. Однако Стингер B был выпущен в небольшом количестве - всего 600 единиц. В Стингер C было добавлено больше компьютерных компонентов, улучшенное программное обеспечение и адаптивная система, которая может пытаться преодолеть помехи, настраивая свои модули для поиска наиболее четкого изображения. Было создано более 20000 единиц, и они принимали участие в боевых действиях в Афганистане и Ираке. Проект Стингер продолжает развиваться, добавляются новые, незначительные дополнения, и по мере создания незначительных усовершенствований появляются новые варианты."
 VIE_protection_equip_1: "M12 + M1"
 VIE_protection_equip_1_short: "M12 + M1"
 VIE_protection_equip_1_desc: "Во время 2-й мировой войны бронежилет M12 использовался Соединенными Штатами в качестве защитной брони, способной поглощать зенитные и малокалиберные снаряды. Однако он был очень громоздким, поэтому в большинстве случаев единственной униформой солдата была форма Olive Drab из хлопкового волокна. Несмотря на это, M12 хорошо защищал солдат от шрапнели при условии, что шрапнель не попадала в обширное пространство, которое не занимал бронежилет./nШлем M1 был разработан в 1941 году майором Сиденхемом из армии США. Он был очень эффективен при отражении выстрелов, которые были направлены, но не в голову. Он широко использовался во время Второй мировой войны и стал культовым."
 VIE_protection_equip_2: "M1952A + M1A"
 VIE_protection_equip_2_short: "M1952A + M1A"
 VIE_protection_equip_2_desc: "M1952A - бронежилет, который использовался США во время войны во Вьетнаме и был разработан в 1952 году. Он обеспечивал номинальную защиту от низкокалиберного оружия и осколков. Бронежилет номинально легкий и имеет встроенные карманы для хранения боеприпасов. M1952A был также разработан, с ограниченным успехом, для изоляции от тепла. M1952A был заменен M1965A, когда почти сразу был изобретен кевлар. M1A - это усовершенствование шлема M1 с небольшими изменениями внутренней части шлема, чтобы он легче ложился на голову."
 VIE_protection_equip_3: "СИБСВ"
 VIE_protection_equip_3_short: "СИБСВ"
 VIE_protection_equip_3_desc: "СИБСВ - это обозначение комплекта брони, разработанного для американской пехоты в 1975 году Центром солдатских систем армии США. Он намного лучше защищает пехоту, чем M1965A, который он заменил. Включая в себя несколько слоев нейлона, шлем и бронежилет СИБСВ были полностью развернуты к 1983 году. Однако, несмотря на лучшую защиту, СИБСВ был чрезвычайно тяжелым, громоздким и очень неудобным при экстремальных температурах."
 VIE_protection_equip_4: "Перехватчик"
 VIE_protection_equip_4_short: "Перехватчик"
 VIE_protection_equip_4_desc: "Перехватчик\" - это обозначение современного защитного снаряжения, которое используют американские военные. Оно было разработано в DARPA в 1998 году и призвано обеспечить защиту, которой не было у пехоты с тех пор, как броня впервые вышла из употребления. Хотя он не так эффективен против огнестрельного оружия, как пластинчатая броня против мечей. Бронежилет \"Перехватчик\" состоит из OTV, DAPS и MICH. OTV - это жилет, который защищает шею, горло, бицепс и пах. Вспомогательные элементы могут быть сняты с защиты торса. OTV содержит баллистические пластины и современные нейлоновые соединения, которые могут защитить солдат лучше, чем любая броня до этого. Система также имеет возможность защитить солдата тонким жилетом Flattening Load Carrier, облегчающим переноску снаряжения. DAPS - это вспомогательные защитные рукава, предназначенные для защиты ног и рук. MICH - это легкий кевларовый шлем, оснащенный вспомогательными портами для хранения различного оборудования, например, бинокля. "
 VIE_protection_equip_5: "ICTV + SFICTV"
 VIE_protection_equip_5_short: "ICTV + SFICTV"
 VIE_protection_equip_5_desc: "Улучшенный комбинированный тактический жилет и его вариант для спецназа - это теоретические комплекты индивидуального защитного снаряжения, предназначенные для замены перехватчика. В настоящее время большинство из них находятся в разработке или на стадии концепта. ICTV и SFICTV начали разрабатываться в начале 2000-х годов различными производителями, и только IOTV был разработан к 2007 году, а серия шлемов в настоящее время находится в разработке или на стадии концепта. ICTV должен включать полный комплект бронежилета, защищающего почти все тело, с зазорами, защищенными сцепленными слоями волокна и легкими металлическими пластинами. Шлем поставляется с защитой ушей и глаз с дополнительной поддержкой для защитного пуленепробиваемого штурмового противогаза и поддержкой для бинокля. Вариант SF намного легче, большая часть пластин уменьшена или разделена на сегменты для облегчения движения. Когда он будет разработан, он обеспечит полную защиту."
 JAP_infantry_equipment_0: "Howa Patern, американская винтовка, калибр .30, M1"
 JAP_infantry_equipment_0_short: "M1 Гаранд (H)"
 JAP_infantry_equipment_0_desc: "Howa производила копию американской M1 Гаранд для японских сил самообороны в первые годы холодной войны, первоначально для обеспечения огнестрельным оружием недавно созданного резерва национальной полиции или Keisatsu Yobita. В октябре 1952 года он был расширен до 110 000 человек и переименован в Национальные силы безопасности, за содержание и производство которых Хауа будет отвечать после окончания программ военной помощи США по созданию первоначальной организации."
 JAP_infantry_equipment_1: "Howa Модель, Соединенные Штаты Карабин, калибр .30, U3 M1"
 JAP_infantry_equipment_1_short: "U3 M1 Карабин (H)"
 JAP_infantry_equipment_1_desc: "Howa производила копии U3 M1 Карабин для японских сил самообороны в первые годы холодной войны, первоначально для обеспечения огнестрельным оружием недавно созданного резерва национальной полиции или Keisatsu Yobita. В октябре 1952 года он был расширен до 110 000 человек и переименован в Национальные силы безопасности, за содержание и производство которых Хауа будет отвечать после окончания программ военной помощи США по созданию первоначальной организации."
 JAP_infantry_equipment_2: "Боевая винтовка Howa Тип 64"
 JAP_infantry_equipment_2_short: "Тип 64"
 JAP_infantry_equipment_2_desc: "Боевая винтовка Howa Тип 64 (Roku-yon-shiki-jidou-shoujuu) - японская боевая винтовка, используемая исключительно Силами самообороны Японии и береговой охраной Японии. Это газоотводная винтовка с автоматикой, работающей по принципу отсечки, под патрон 7,62×51 мм НАТО и с отъемным коробчатым магазином на 20 патронов. Тип 64 никогда не экспортировался из-за строгих японских законов, запрещающих экспорт оружия."
 JAP_infantry_equipment_3: "Howa Тип 80"
 JAP_infantry_equipment_3_short: "Тип 80"
 JAP_infantry_equipment_3_desc: "Экспериментальный прототип Armalite AR-18, Тип 80 никогда не выпускался за пределами ограниченного тестового использования."
 JAP_infantry_equipment_4: "Howa Тип 89"
 JAP_infantry_equipment_4_short: "Howa Тип 89 "
 JAP_infantry_equipment_4_desc: "Штурмовая винтовка Howa Тип 89 (89式小銃, hachi-kyū-shiki-shōjū), называемая Тип 89 5,56 мм (89式5. 56мм小銃, hachi-kyū-shiki-go-ten-go-roku-miri-shōjū), является японской штурмовой винтовкой, используемой Силами самообороны Японии, подразделениями специальной группы безопасности береговой охраны Японии и специальной штурмовой группой. Она никогда не экспортировалась за пределы Японии из-за строгой политики по борьбе с экспортом аппаратуры. На службе в JGSDF он известен под названием Buddy."
 JAP_specialist_1: "Тип 99 снайперская винтовка"
 JAP_specialist_1_short: "Тип 99 снайперская винтовка"
 JAP_specialist_1_desc: "Тип 99 снайперская винтовка (Kyukyu-shiki sogeki-ju) - японская снайперская винтовка, использовавшаяся во время Второй мировой войны. Это была снайперская версия винтовки Тип 99 под патрон 7,7×58 мм. Существовало несколько вариантов снайперской винтовки Тип 99, некоторые из которых имели прямой затвор и прицел, установленный на левой стороне ствольной коробки, что позволяло использовать обоймы. Другой вариант - с изогнутым затвором и прицелом над ствольной коробкой, что требовало от снайпера заряжать винтовку по одному патрону. Укороченный ствол в сочетании с большим калибром патронов затруднял маскировку по сравнению с предшествующей винтовкой Тип 97, учитывая более громкий дульный взрыв и вспышку, вызванную увеличенной мощностью пороха."
 JAP_specialist_2: "M1D"
 JAP_specialist_2_short: "M1D"
 JAP_specialist_2_desc: "M1D - снайперский вариант M1 Гаранд. Созданный на основе более сложного M1C, вариант D использовал более простую однокольцевую насадку Спрингфилд Армори, прикрепленную к стволу, а не к ствольной коробке."
 JAP_specialist_3: "Howa Тип 64 Designated Marksman"
 JAP_specialist_3_short: "Howa Тип 64"
 JAP_specialist_3_desc: "На винтовку Тип 64 может быть установлена оптика (прицелы) дальнего действия, что позволяет использовать ее в качестве снайперской винтовки. Снайперская винтовка Тип 64 обычно выдается человеку с наиболее точной стрельбой в каждом подразделении (назначенному стрелку). Однако во многих случаях человеку может быть выдан просто оптический прицел, который будет использоваться только во время тренировок и соревнований по стрельбе, а конкретная винтовка за ним не закрепляется.\nВыдаваемая оптика обычно имеет увеличение ПТ 2.2× и может быть либо излишком прицела M84 снайперской винтовки M1C/D, который использовался американскими военными во время Второй мировой войны, либо аналогичной Моделью производства компании Nikon, которая повторяет уровень увеличения M84. Характеристики прицела аналогичны снайперской винтовке M1C/D, однако его можно настроить только на прицеливание на ПТ 500 метров, несмотря на то, что ручка регулировки увеличения имеет маркировку до 800 метров. Кроме того, стандартный прицельный сетка представляет собой простой черный \"T\", что делает его крайне сложным для использования в сумерках или по черной цели.\nНесколько серьезных претензий к точности снайперской версии связаны с плохо продуманной системой крепления прицела. Прицел легко смещается, поскольку крепится только одним винтом. После установки прицела и обнуления винтовки необходимо аккуратно обращаться с ним, так как его легко сдвинуть с места. Кроме того, поскольку прицел обычно не привязан к конкретной винтовке, часто бывает трудно удержать его в статичном положении на ствольной коробке конкретной винтовки. Обычно это можно исправить, проложив кусок ткани между ствольной коробкой и креплением прицела, но тогда заслоняются прицельные приспособления винтовки. В таких случаях необходимо установить нащечник, чтобы правильно совместить глаз пользователя с прицелом."
 JAP_specialist_5_short: "M24"
 AST_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но.4 Mk I"
 AST_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 AST_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск до конца Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 СЗВ."
 AST_infantry_equipment_1: "Самозарядная винтовка L1A1"
 AST_infantry_equipment_1_short: "L1A1"
 AST_infantry_equipment_1_desc: "L1A1 - это британская версия бельгийской боевой винтовки FN FAL. Она выпускалась по лицензии и использовалась во многих странах Содружества. Великобритания выпустила свой собственный вариант FN FAL, включающий модификации, разработанные Союзным стрелковым комитетом, и получивший обозначение самозарядная винтовка L1A1 (СЗВ). Оружие производилось на заводах Royal Small Arms Factory Enfield, Birmingham Small Arms, Royal Ordnance Factory и ROF Fazakerley. После прекращения производства комплектующие для замены оружия производились компанией Parker Hale Limited. СЗВ служил в вооруженных силах Великобритании с 1954 года примерно до 1994 года, а с 1985 года был заменен на L85A1."
 AST_infantry_equipment_2: "L1A1 Самозарядная винтовка полимерная"
 AST_infantry_equipment_2_short: "L1A1(п)"
 AST_infantry_equipment_2_desc: "Улучшенная версия C1."
 AST_infantry_equipment_3: "Steyr Aug F88 Austeyr"
 AST_infantry_equipment_3_short: "F88 Austeyr"
 AST_infantry_equipment_3_desc: "Штурмовая винтовка F88 Austeyr является стандартным индивидуальным оружием ADF. Он производится по лицензии Steyr Mannlicher AG компанией Thales Australia и поставляется вооруженным силам Австралии и Новой Зеландии."
 AST_infantry_equipment_4: "Steyr Aug F88SA1 Austeyr"
 AST_infantry_equipment_4_short: "F88SA1 Austeyr"
 AST_infantry_equipment_4_desc: "F88SA1 Austeyr - это вариант F88 Austeyr с интегрированной планкой Пикатинни вместо стандартного оптического прицела, которая позволяет устанавливать различные другие прицельные приспособления (прицелы ночного видения, оптику с увеличением и без увеличения, такую как ELCAN C79, Trijicon ACOG или Aimpoint)."
 DOC_infantry_equipment_0: "Fabrique Nationale Модель 1949"
 DOC_infantry_equipment_0_short: "FN-49"
 DOC_infantry_equipment_0_desc: "Конструкция FN-49 восходит к началу 1930-х годов и выпускается как в виде самозарядной винтовки, так и в виде автоматической винтовки с магазинами на 10 патронов.\nХотя винтовка FN-49 была хорошо известна благодаря высокому качеству сборки и надежности по сравнению с винтовками того времени, ее рыночные возможности были ограничены, поскольку она была разработана не для использования во Второй мировой войне, а позже, когда многие военные уже начали переходить на боевые винтовки с автоматическим огнем. Неизвестное количество FN-49 было выпущено в качестве автоматических винтовок, но небольшой коробчатый магазин на 10 патронов ограничивал возможности автоматики."
 DOC_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 DOC_infantry_equipment_1_short: "FN FAL"
 DOC_infantry_equipment_1_desc: "FN FAL - один из самых производимых пистолетов в истории. Благодаря своей распространенности и широкому использованию в армии многих стран НАТО и первого мира во время холодной войны, он получил название \"Правая рука свободного мира\.\""
 DOC_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 DOC_infantry_equipment_2_short: "АКМ"
 DOC_infantry_equipment_2_desc: "АКМ - модернизированный вариант АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия снизился на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ был сразу же и повсеместно использован многими коммунистическими странами и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
 KEN_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но.4 Mk I"
 KEN_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 KEN_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск до конца Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 СЗВ."
 KEN_infantry_equipment_1: "L1A1 Самозарядная винтовка"
 KEN_infantry_equipment_1_short: "L1A1"
 KEN_infantry_equipment_1_desc: "L1A1 - это британская версия бельгийской боевой винтовки FN FAL. Она выпускалась по лицензии и использовалась во многих странах Содружества. Великобритания выпустила свой собственный вариант FN FAL, включающий модификации, разработанные Союзным стрелковым комитетом, и получивший обозначение самозарядная винтовка L1A1 (СЗВ). Оружие производилось на заводах Royal Small Arms Factory Enfield, Birmingham Small Arms, Royal Ordnance Factory и ROF Fazakerley. После прекращения производства комплектующие для замены оружия производились компанией Parker Hale Limited. СЗВ служил в вооруженных силах Великобритании с 1954 года примерно до 1994 года, а с 1985 года был заменен на L85A1."
 KEN_infantry_equipment_2: "Heckler & Koch G3"
 KEN_infantry_equipment_2_short: "G3"
 KEN_infantry_equipment_2_desc: "G3 или Gewehr 3 - это боевая винтовка калибра 7,62×51 мм НАТО, разработанная в 1950-х годах немецкой оружейной компанией Heckler & Koch в сотрудничестве с испанским государственным агентством по проектированию и развитию CETME."
 KEN_infantry_equipment_3: "Автоматический пулемет IMI Галиль"
 KEN_infantry_equipment_3_short: "Галиль АРМ"
 KEN_infantry_equipment_3_desc: "В конце 60-х - начале 70-х годов основная боевая винтовка ЦАХАЛа \"Ромат\" начала показывать свои слабые стороны."
 KEN_infantry_equipment_4: "Карабин, калибр 5,56 мм, M4 "
 KEN_infantry_equipment_4_short: "M4 Карабин"
 KEN_infantry_equipment_4_desc: "M4 Карабин является дальнейшим усовершенствованием M16A2. Первоначально он был заказан большой специальной группе конструкторов в 1984 году, а разработка была завершена в 1993 году. После 9 лет разработки можно надеяться, что ожидание стоило того. Он отличается более высоким уровнем надежности, значительно легче и короче. В основном благодаря улучшенным материалам, он более точен, чем M16A2. Компактные размеры делают его более универсальным и простым в эксплуатации, чем M16A2. M4 Карабин принимал участие в войне США в Афганистане, в войне в Ираке и в войне против ИГИЛ."