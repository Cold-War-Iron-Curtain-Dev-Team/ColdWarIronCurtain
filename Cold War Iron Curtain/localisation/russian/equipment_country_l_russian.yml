 BEL_atgm_equipment_0: "DTAT ENgin Téléguidé Anti-Char ENTAC"
 BEL_atgm_equipment_0_short: "ENTAC"
 BEL_atgm_equipment_0_desc: "Ракета была разработана французским правительственным агентством - DTAT (Direction Technique des Armements Terrestres) одновременно с частной промышленностью SS.10."
 BEL_atgm_equipment_1: "Nord SS.11"
 BEL_atgm_equipment_1_short: "SS.11"
 BEL_atgm_equipment_1_desc: "Разработка усовершенствованной версии SS.10 (Nord-5203) началась в 1953 году как Nord-5210. Ракета предназначалась в качестве тяжелой версии переносной SS.10 для использования с транспортных средств, кораблей и вертолетов. Ракета поступила на вооружение французской армии под обозначением SS.11. Она использовалась в качестве первой в мире противотанковой ракеты, устанавливаемой на вертолете (на вертолетах Alouette II)."
 BEL_atgm_equipment_2: "MBDA Missile d'infanterie léger antichar 'МИЛАН' F1"
 BEL_atgm_equipment_2_short: "МИЛАН F1"
 BEL_atgm_equipment_2_desc: "МИЛАН является продуктом Евроракеты, франко-западногерманской программы разработки ракет, восходящей к 1960-м годам. Состоящая из двух основных компонентов, пусковой установки и ракеты, система МИЛАН использует полуавтоматическую систему командного наведения по прямой видимости (СКНППВ)."
 BEL_atgm_equipment_3: "MBDA Missile d'infanterie léger antichar 'МИЛАН' F2"
 BEL_atgm_equipment_3_short: "МИЛАН F2"
 BEL_atgm_equipment_3_desc: "МИЛАН - является продуктом Евроракеты. Вариант F2 оснащен одной основной боеголовкой с кумулятивным зарядом и автономным зондом для увеличения проникающей способности. Франко-западногерманская программа разработки ракет, восходящая к 1960-м годам. Состоящая из двух основных компонентов, пусковой установки и ракеты, система МИЛАН использует полуавтоматическую систему командного наведения по прямой видимости (СКНППВ)."
 BEL_atgm_equipment_4: "MBDA Missile d'infanterie léger antichar 'МИЛАН' F3"
 BEL_atgm_equipment_4_short: "МИЛАН F3"
 BEL_atgm_equipment_4_desc: "МИЛАН - является продуктом Евроракеты. Ракета F3 оснащена боеголовкой \"Тандем\" с кумулятивным зарядом и электронным маяком. Франко-западногерманская программа разработки ракет, восходящая к 1960-м годам. Состоящая из двух основных компонентов, пусковой установки и ракеты, система МИЛАН использует полуавтоматическую систему командного наведения по прямой видимости (СКНППВ)."
 BEL_atgm_carrier_equipment_0: "Willys MB ко. ENTAC"
 BEL_atgm_carrier_equipment_0_short: "Willys MB ко. ENTAC"
 BEL_atgm_carrier_equipment_0_desc: "Бельгийский джип Willys MB с ракетными капсулами ENTAC, установленными сзади."
 BEL_atgm_carrier_equipment_1: "Minerva T.T ко. SS.11"
 BEL_atgm_carrier_equipment_1_short: "Minerva T.T ко. SS.11"
 BEL_atgm_carrier_equipment_1_desc: "Лицензированная в Бельгии версия Landrover, Minterva T.T могла нести ракеты SS.11 либо установленные сзади, либо перевозимые в тележке."
 BEL_atgm_carrier_equipment_2: "Bombardier Iltis ко. МИЛАН"
 BEL_atgm_carrier_equipment_2_short: "Bombardier Iltis ко. МИЛАН"
 BEL_atgm_carrier_equipment_2_desc: "Bombardier Iltis бельгийского производства, установленный с ракетной установкой МИЛАН F1 на крыше на огневой позиции."
 BEL_atgm_carrier_equipment_3: "AIFV-B-МИЛАН"
 BEL_atgm_carrier_equipment_3_short: "AIFV-B-МИЛАН"
 BEL_atgm_carrier_equipment_3_desc: "Модернизированный бельгийский AIFV-B, на крыше которого установлена ракетная установка МИЛАН F2."
