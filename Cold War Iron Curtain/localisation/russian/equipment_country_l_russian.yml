 DEN_atgm_carrier_equipment_3_short: "M1045A2"
 DEN_atgm_carrier_equipment_4: "Falck Schmidt/Delco M113G3DK ETS"
 DEN_atgm_carrier_equipment_4_short: "M113G3DK ETS"
 DEN_atgm_carrier_equipment_4_desc: "Elevated TOW System (ETS) - это система вооружения TOW с 2- или 4-трубной пусковой установкой и приподнятой мачтой, возвышающейся над землей на 6,5 метров. Ракеты TOW могут запускаться из любого положения. Это позволяет системе при развертывании действовать, максимально используя рельеф местности и другие сооружения. ИТС позволяет использовать весь спектр ракет TOW (включая TOW-2A и TOW-2B)."
