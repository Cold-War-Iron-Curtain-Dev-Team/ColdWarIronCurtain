 VIE_lt_equipment_1: "M5 Стюарт"
 VIE_lt_equipment_1_short: "M5 Стюарт"
 VIE_lt_equipment_1_desc: "M5 Стюарт - это маленький танк, разработанный Департаментом вооружений армии США в 1941 году для роли легкого танка. Он имеет тонкую 63,5-мм броню и 37-мм основное орудие с 3 7,62-мм вспомогательными орудиями Браунинг. Он использует сдвоенный двигатель Cadillac V8, способный развивать скорость до 36 миль/ч по бездорожью, и имеет боевой запас хода 100 миль. Он активно поставлялся по ленд-лизу в течение всей Второй мировой войны, даже когда США вступили в войну. "
 VIE_lt_equipment_2: "Легкий танк, M24"
 VIE_lt_equipment_2_short: "M24"
 VIE_lt_equipment_2_desc: "M24 Чаффи - это легкий танк, разработанный Департаментом вооружений армии США в 1944 году ближе к концу Второй мировой войны Electric Boogaloo. M24 имеет 38-мм броню и 75-мм основное орудие. Двигатель - V8 twin Cadillac с трансмиссией Hydramatic, который может двигаться примерно так же, как M5 Stuart. В бою маленькая пушка M5 Стюарт оказалась существенным недостатком, особенно в североафриканской кампании. Вскоре после этого был разработан M24 Чаффи с намерением придать ему большую огневую мощь, чтобы он лучше выполнял свою роль."
 VIE_lt_equipment_3: "Танк, боевой, Полногусеничный: 76-мм пушка, M41."
 VIE_lt_equipment_3_short: "M41 Уокер Бульдог"
 VIE_lt_equipment_3_desc: "M41 - легкий разведывательный танк, разработанный компанией Cadillac в 1949 году. Он принимал участие в боевых действиях во Вьетнаме, в заливе Свиней, Ливане и Сомали. Его броня варьируется от 19 мм до 31,7 мм. Он вооружен 76-мм основным орудием, коаксиальным пулеметом 30 калибра и крышной пушкой 50 калибра. Он использует 6-цилиндровый бензиновый двигатель Continental и развивает скорость до 45 миль/ч, а запас хода составляет 100 миль. Разработка M41 продвигалась медленно и с небольшим финансированием, но когда началась Корейская война, армия США начала торопить программу. Спешка вызвала большое количество проблем в программе и проблемы с габаритами. В результате серьезных проблем, вызванных спешкой, M41 выпускался очень недолго и не использовался во время войны в Корее. Фактически, производство началось только в 1951 году и продолжалось всего 3 года."
 VIE_lt_equipment_4: "Танк, боевой, Полногусеничный: 76-мм пушка, M41A1"
 VIE_lt_equipment_4_short: "M41A1 Уокер Бульдог"
 VIE_lt_equipment_4_desc: "M551 Шеридан - амфибийный десантный разведывательный танк, разработанный компанией Cadillac в 1966 году. Он использовался во Вьетнаме, в операциях \"Просто дело\" и \"Буря в пустыне.\" M551 Sheridan имеет 152-мм основное орудие и 2 вспомогательных орудия. Танк оснащен 6-цилиндровым дизельным двигателем 6V53T с турбонаддувом, развивает скорость до 43 миль/ч и скорость плавания 3,6 миль/ч. Броня представляет собой алюминиевый корпус со стальной башней. Из-за своей мобильности и универсальности он сразу же поступил на вооружение во Вьетнаме, где сыграл исключительную роль. 152-мм основное орудие может вести огонь соответственно ПТУР или обычными боеприпасами. M551 подвергался критике со стороны многих его операторов из-за сложности использования в прямом бою, но все же эффективно выполнял свою роль, несмотря на плохую репутацию."
 VIE_lt_equipment_5: "Танк, боевой, Полногусеничный: 76-мм пушка, M41A3"
 VIE_lt_equipment_5_short: "M41A3 Уокер Бульдог"
 VIE_lt_equipment_5_desc: "M3 Брэдли БМК очень похож на M2 Брэдли БМП ( Боевая машина пехоты) и оснащен такой же двухместной башней с 25-мм пушкой Bushmaster Cannon и соосным 7,62-мм пулеметом M240C. Она отличается от M2 лишь несколькими тонкими отличиями и ролью. M3 классифицируется как бронированная разведывательная и разведывательно-дозорная машина, и в ней отсутствуют огневые отверстия, которые были в серии M2. M3 также несет больше ракет TOW, а также больше боеприпасов для 25-мм и 7,62-мм пушек."
 VIE_lt_equipment_6: "M3A2 Брэдли ODS"
 VIE_lt_equipment_6_short: "M3A2 Брэдли ODS"
 VIE_lt_equipment_6_desc: "M3A2 включает в себя усовершенствованную броню, такую как возможность установки взрывной реактивной брони, от M2A2 Брэдли. После испытаний с боевой стрельбой были также изменены места для сидения и укладки боеприпасов: наблюдатели были перемещены на скамейку с левой стороны машины, а укладка ракет была изменена для повышения безопасности."
 VIE_ht_equipment_1: "M4A3E2 Шерман Джамбо"
 VIE_ht_equipment_1_short: "M4A3E2 Джамбо"
 VIE_ht_equipment_1_desc: "Дополнительная броня (включая 1 дюйм спереди), вертикальная башня, но примерно на 3-4 миль/ч медленнее. Построен с 75-мм орудием, но часто перевооружается использующими подразделениями на 76-мм орудия. Удлиненные концевые разъемы (УКР) типа \"утконос\" установлены на внешнем краю гусениц."
 VIE_ht_equipment_2: "T26E4 Супер Першинг"
 VIE_ht_equipment_2_short: "T26E4 Супер Першинг"
 VIE_ht_equipment_2_desc: "Супер Першинг был более тяжелым вариантом базового M26. На танк была установлена более тяжелая броня, а более длинная пушка T15E1 заменила пушку M3, чтобы сравняться по огневой мощи с King Tiger."
 VIE_ht_equipment_3: "T32"
 VIE_ht_equipment_3_short: "T32"
 VIE_ht_equipment_3_desc: "В начале 1945 года началась работа по созданию значительно более тяжелого варианта M26 Першинг. Используя данные, полученные в ходе работы над проектом тяжелого танка T29, и установив экспериментальную 90-мм главную пушку, стреляющую бронебойными боеприпасами с жестким композитным составом, а также более совершенную трансмиссию, был создан первый танк T32. Пушка T15E2, установленная на этом танке, была намного мощнее, чем пушка, установленная на \"Першинге\", и, подобно T26E4 Супер Першинг, который использовал аналогичную экспериментальную 90-мм пушку, противовес в задней части башни был значительно увеличен, чтобы компенсировать вес длинной пушки."
 VIE_ht_equipment_4: "120-мм Орудие Боевого Танка M103"
 VIE_ht_equipment_4_short: "M103"
 VIE_ht_equipment_4_desc: "M103 был тяжелым танком, созданным в 1957 году компанией Chrysler. Было построено и развернуто 100 единиц, но в боях он не участвовал. Он имел 127-254-мм броню и 120-мм основное орудие с 3 дополнительными пушками. Он развивал максимальную скорость 21 миль/ч и имел рабочий запас хода 80, расходуя за это время 280 галлонов. Двигателем служил 12-цилиндровый бензиновый двигатель AV1790. Сам танк служил в морской пехоте, но в боях не участвовал, так как подразделения, в которые он был направлен, так и не смогли его использовать."
 VIE_ht_equipment_5: "120мм Орудие Боевого Танка M103A2"
 VIE_ht_equipment_5_short: "M103A2"
 VIE_ht_equipment_5_desc: "M103A2 - это усовершенствование M103, сделанное в 60-х годах компанией Chrysler. Было создано 200 единиц, но в боях он не участвовал. В нем двигатель M103 был заменен на двигатель AVDS1790-2 V12 с двойным турбонаддувом, что дало ему значительные преимущества перед M103. Усовершенствованный двигатель мог пронести его 295 миль со скоростью 23 миль/ч и обладал значительной мобильностью, используя то же топливо, что и M103. Также были внесены некоторые незначительные улучшения в конструкцию M103, например, несколько иная модель трансмиссии, но в конечном итоге она осталась прежней. M103A2 стал последним тяжелым танком, созданным США, поскольку основные боевые танки вытеснили необходимость в тяжелых танках и могли нести большую огневую мощь при меньшем весе и большей мобильности."
 VIE_mbt_equipment_0: "M4 Шерман"
 VIE_mbt_equipment_0_short: "M4 Шерман"
 VIE_mbt_equipment_0_desc: "M4 Шерман - средний танк, разработанный отделом снабжения армии США в 1940 году для Второй мировой войны. Начиная с 1940 года он передавался в лизинг многим странам. Шерман может иметь основное орудие калибра 75 мм, 76 мм или 105 мм и, как правило, вспомогательное орудие Браунинга. В движение он приводился 9-цилиндровым радиальным бензиновым двигателем C4, способным перемещать машину со скоростью 22-30 миль в час на расстояние 100-150 миль до дозаправки. Он был надежен, дешев в производстве и был просто мечтой логиста. Он был очень компактным и легко транспортировался в больших количествах, что делало перевозку машины через Атлантику чрезвычайно простой. M4 также был очень универсален и мог работать в самых разных условиях."
 VIE_mbt_equipment_1: "M26"
 VIE_mbt_equipment_1_short: "M26 Першинг"
 VIE_mbt_equipment_1_desc: "M26 Першинг - средний танк, разработанный Департаментом вооружений армии США в 1944 году. Он принимал участие в боевых действиях во Второй мировой войне и в войне в Корее. M26 Pershing очень тяжел для среднего танка и имеет исключительно низкую скорость движения по бездорожью. Его 8-цилиндровый двигатель Ford GAF мог проехать до 100 миль со скоростью 30 миль в час по дороге, но на бездорожье его скорость составляла 5,25 миль в час. Основным орудием является 90-мм пушка, а также может использоваться браунинг M2. Однако во время войны в Корее браунинг M2 калибра .50 был заменен на 2 пушки M1919 калибра .30-06 из-за большого количества мягких целей на поле боя и необходимости перевозить в 9 раз больше боеприпасов, а не больше огневой мощи. M26 мог быть средним танком, но он очень тяжелый и может рассматриваться как гибрид среднего/тяжелого танка."
 VIE_mbt_equipment_2: "M46 Паттон"
 VIE_mbt_equipment_2_short: "M46 Паттон"
 VIE_mbt_equipment_2_desc: "M46 Паттон - средний танк, разработанный Департаментом вооружений армии США в 1949 году. Он участвовал в боевых действиях в Корейской войне и был разработан для замены M26 Pershing из-за его непомерно большого веса. Он оснащен 90-мм основным орудием и 102-мм броней. Он может быть оснащен одной пушкой M2 Браунинг или двумя M1919 Браунинг. M46 Patton использует двигатель V12 с двойным турбонаддувом, разгоняется до 15-30 миль в час и имеет рабочий диапазон 30-80 миль. Он выпускался массово в попытке заменить прежние образцы. Он соответствовал современным конструкциям и вооружению и не страдал от большого веса."
 VIE_mbt_equipment_3: " Танк, боевой, полногусеничный: 90-мм пушка, M47"
 VIE_mbt_equipment_3_short: "M47 Паттон"
 VIE_mbt_equipment_3_desc: "M47 Паттон - один из первых основных боевых танков, разработанный Департаментом вооружений армии США в 1951 году. Он очень похож на M46 Patton, но имеет обновленную орудийную башню с улучшенным внутренним механизмом и усовершенствованной трансмиссией. Он принимал участие в Суэцком кризисе, 6-дневной войне и югославских войнах."
 VIE_mbt_equipment_4: "Танк, боевой, полногусеничный: 90-мм пушка, M48"
 VIE_mbt_equipment_4_short: "M48 Паттон"
 VIE_mbt_equipment_4_desc: "M48 Паттон - это танк MBT, разработанный Департаментом вооружений армии США в 1953 году. M48 имеет 110-мм броню и улучшенное 90-мм главное орудие. Двигатель представляет собой оптимизированный вариант V12, использовавшийся на предыдущих танках Паттон, с облегченной системой впрыска топлива и наддувом. Запас хода по бездорожью составляет 160 миль, по шоссе - 300 миль. По дороге он может двигаться со скоростью 30 миль в час, а по бездорожью - со скоростью 20 миль в час благодаря усовершенствованному двигателю, трансмиссии и гусеницам. Он служил основным танком в войне во Вьетнаме и широко использовался союзниками США по холодной войне. Он похож на M47 Паттон, но представляет собой совершенно новую конструкцию с новыми внутренними механизмами. Он использовался в армии и морской пехоте США, пока в конечном итоге не был заменен на M60, хотя многие подразделения национальной гвардии все еще эксплуатировали и обслуживали M48 до конца 80-х годов."
 VIE_mbt_equipment_5: "Танк, боевой, полногусеничный: 90-мм пушка, M48A3"
 VIE_mbt_equipment_5_short: "M48A3 Паттон"
 VIE_mbt_equipment_6: "Танк, боевой, полногусеничный: 105-мм пушка, M48A5"
 VIE_mbt_equipment_6_short: "M48A5 Паттон"
 VIE_mbt_equipment_7: "Танк, боевой, полногусеничный: 120-мм пушка, M1A1"
 VIE_mbt_equipment_7_short: "M1A1 Абрамс"
 VIE_mbt_equipment_7_desc: "Основной боевой танк M1A1 Абрамс был разработан компанией General Dynamics. Он является дальнейшим развитием M1 Абрамс. M1A1 был представлен в 1985 году, его производство началось в том же году. M1A1 имеет улучшенную броневую защиту башни по сравнению со своим предшественником. Одним из наиболее важных усовершенствований по сравнению с M1 является 120-мм гладкоствольная пушка M256, первоначально разработанная компанией Rheinmetall и производимая в США по лицензии."
 VIE_mbt_equipment_8: "Танк, боевой, полногусеничный: 120-мм пушка, M1A2"
 VIE_mbt_equipment_8_short: "M1A2 Абрамс"
 VIE_mbt_equipment_8_desc: "M1A2 Абрамс - это усовершенствование M1, сделанное GDLS в начале 80-х годов. Танк использует усиленную сеткой из обедненного урана композитную броню размером около 600 мм. Танки также поставляются с дополнительными опциями, такими как реактивная броня, комплект для выживания в городских условиях и дистанционно управляемая система вооружения. Танк имеет 120-мм основную гладкоствольную пушку и превосходит большинство других танков. Он также имеет улучшенную электронику, средства противодействия ПТУР и систему пожаротушения. Однако не были улучшены трансмиссия, подвеска и двигатель, поэтому танк сидит ближе к земле и весит значительно больше. Он может двигаться по дороге со скоростью 42 миль/ч или по бездорожью со скоростью 25 миль/ч с меньшим радиусом действия. Он использовался в Афганистане, Персидском заливе и Ираке, где продемонстрировал непревзойденную живучесть против большинства противотанковых средств, которыми располагали его противники."
 VIE_mbt_equipment_9: "Танк, боевой, полногусеничный: 120-мм пушка, M1A2(ПУС)."
 VIE_mbt_equipment_9_short: "M1A2 Абрамс ПУС"
 VIE_mbt_equipment_9_desc: "M1A2 Пакет усовершенствования системы (ПУС) является преемником M1A2. Он также является пакетом модернизации для старых танков Абрамс. Он имеет улучшенную броневую защиту, улучшенные компоненты системы, улучшенные компьютерные компоненты и некоторые другие усовершенствования. Первый модернизированный танк был поставлен в 1999 году."
 VIE_mechanized_equipment_1: "M2 Полугусеничный"
 VIE_mechanized_equipment_1_short: "M2 Полугусеничный"
 VIE_mechanized_equipment_1_desc: "Полугусеничный автомобиль M2 - бронированный полугусеничный автомобиль, произведенный Соединенными Штатами во время Второй мировой войны. В его конструкции использовались полугусеничные машины, импортированные из Франции в 1930-х годах, с применением стандартных компонентов, поставляемых американскими производителями грузовиков для ускорения производства и снижения затрат. Концепция была разработана, а опытные образцы изготовлены компанией Firestone Tire and Rubber Company (до того, как прототип получил официальное обозначение M2.). Производство компанией White Motor Company началось в 1940 году и было расширено до Autocar."
 VIE_mechanized_equipment_2: "M3 Полугусеничный"
 VIE_mechanized_equipment_2_short: "M3 Полугусеничный"
 VIE_mechanized_equipment_2_desc: "Полугусеничный бронетранспортер M3 был американским полугусеничным бронетранспортером, широко использовавшимся союзниками во время Второй мировой войны и в холодной войне. Созданный на основе полугусеничной машины M2, M3 был широко распространен, было произведено около 15 000 стандартных M3 и более 38 000 вариантов. В эпоху холодной войны машина использовалась различными государственными и негосударственными операторами в конфликтах в Южной Америке, на Ближнем Востоке, в Африке и Азии, оставаясь на вооружении до середины 1990-х годов. В Мексике они все еще используются по состоянию на 2019 год."
 VIE_mechanized_equipment_3: "M3A1 Полугусеничный"
 VIE_mechanized_equipment_3_short: "M3A1 Полугусеничный"
 VIE_mechanized_equipment_3_desc: "M3A1 - это полугусеничный тягач M3 с улучшенным кольцевым креплением пулемета M49 над правым передним сиденьем. В 1942-1943 гг. все полугусеничные тягачи M3 (стандартные и A1) постоянно модернизировались. Эти усовершенствования включали ряд улучшений трансмиссии, двигателя и укладки."
 VIE_mechanized_equipment_4: "REO M35A1 Гантрак"
 VIE_mechanized_equipment_4_short: "M35A1 Гантрак"
 VIE_mechanized_equipment_4_desc: "Первые более сложные переделки этого образца были выполнены американскими военными во Вьетнаме. Артиллерийским батальонам армии США (автоматическое оружие, самоходное) часто придавались артиллерийские батареи (калибра .50), подразделения, оснащенные грузовиками M35 и системами M55 Quadmount, устанавливающими четыре пулемета M2 Браунинг."
 VIE_mechanized_equipment_5: "Автомобиль, Личный, Полногусеничный, Бронированный, M113"
 VIE_mechanized_equipment_5_short: "M113"
 VIE_mechanized_equipment_5_desc: "Самый узнаваемый американский БТР с 60-х годов. Широкое использование и многолетние исследования превратили его в настоящий бронетранспортер, используя его высоту, угол наклона брони и толщину. Позднее он вводил все новые и новые варианты, вооружаясь пулеметом M2 Браунинг .50 Cal с несколькими тысячами патронов. Воистину, он мог похвастаться как хороший БТР. Десятки вариантов вышли из линейки M113, которые и по сей день используются американскими военными."
 VIE_mechanized_equipment_6: "Автомобиль, Личный, Полногусеничный, Бронированный, M113A1"
 VIE_mechanized_equipment_6_short: "M113A1"
 VIE_mechanized_equipment_6_desc: "Начиная с 1964 года, бензиновый двигатель был заменен на двигатель 6V-53 Detroit Diesel мощностью 215 л.с. (160 кВт), чтобы воспользоваться преимуществами лучшей экономии топлива и меньшей пожароопасности дизельного двигателя."
 VIE_mechanized_equipment_7: "Автомобиль, Личный, Полногусеничный, Бронированный, M113A2"
 VIE_mechanized_equipment_7_short: "M113A2"
 VIE_mechanized_equipment_7_desc: "M113A2 - это улучшенный вариант M113, созданный корпорацией Food Machinery Corporation в конце 70-х годов. Он участвовал в боевых действиях везде, где участвовал M113. В A1 двигатель был заменен на 6V-53. В А2 было улучшено охлаждение двигателя, введены торсионы повышенной прочности для увеличения дорожного просвета, добавлены амортизаторы в подвеску, бронированы топливные баки и добавлены дымовые пусковые установки."
 VIE_mechanized_equipment_8: "Автомобиль, Личный, Полногусеничный, Бронированный, M113A3"
 VIE_mechanized_equipment_8_short: "M113A3"
 VIE_mechanized_equipment_8_desc: "В 1987 году были введены дальнейшие усовершенствования для \"повышения выживаемости (на поле боя).\" Они включали в себя ярмо для рулевого управления вместо боковых рычагов, более мощный двигатель (6V-53T Detroit Diesel с турбонаддувом), внешние топливные баки и внутреннюю обшивку от сколов для улучшения защиты. Суффикс A3 используется на всех вариантах для обозначения модернизации до стандарта A3."
 VIE_mechanized_equipment_9: "Боевая машина пехоты M1126 Страйкер"
 VIE_mechanized_equipment_9_short: "M1126 Страйкер БМП"
 VIE_mechanized_equipment_9_desc: "СТРАЙКЕР - это БТР, разработанный компанией General Dynamics в 1999 году. Он использовался в войне в Афганистане. Страйкер использует двигатель C7 Caterpillar с подвеской 8x8. Он может двигаться со скоростью до 60 миль в час на протяжении 310 миль. Почти с полуторагодовым отставанием от графика, в ноябре 2000 года команда General Motors-General Dynamics получила контракт стоимостью 8 миллиардов долларов на производство 2131 машины канадского варианта LAV III для оснащения шести бригадных боевых групп быстрого развертывания к 2008 году."
 VIE_mechanized_equipment_10: "M1296 Драгун"
 VIE_mechanized_equipment_10_short: "M1296 Драгун"
 VIE_mechanized_equipment_10_desc: "Армия США стремилась повысить огневую мощь базовой машины для перевозки пехоты M1126 Страйкер. Его 12,7-мм крупнокалиберный пулемет был не особенно эффективен против современной бронетехники. Поэтому армия США одобрила повышение летальности путем оснащения 81 \"Страйкера\" 30-мм легкими беспилотными турелями. Это значительно повысило огневую мощь \"Страйкера\" при сохранении мобильности машины."
 VIE_mechanized_heavy_equipment_1: "M44"
 VIE_mechanized_heavy_equipment_1_short: "M44"
 VIE_mechanized_heavy_equipment_1_desc: "M44 - это сверхтяжелый БТР, разработанный Департаментом вооружений армии США в 1951 году. M44 имеет двигатель AOS-895-3 и торсионную подвеску. Он может двигаться по бездорожью со скоростью 15 миль в час, а запас хода составляет 60 миль. Проект M44 был отменен, и было создано всего 6 прототипов. Несмотря на это, некоторые из прототипов прошли полевые испытания и участвовали в боевых действиях во время войны в Корее. Хотя он был очень хорошо бронирован и мог перевозить 24 пассажира, он был очень медленным и представлял собой крупную мишень."
 VIE_mechanized_heavy_equipment_2: "Автомобиль, Личный, Полногусеничный, Бронированный, M75"
 VIE_mechanized_heavy_equipment_2_short: "M75"
 VIE_mechanized_heavy_equipment_2_desc: "M75 - тяжелый БТР, разработанный корпорацией International Harvester в начале 1950-х годов. M75 широко использовался во время Корейской войны, но затем был быстро снят с производства. M75 оснащен 6-цилиндровым бензиновым двигателем AO-895-4 и торсионной подвеской. Он может двигаться со скоростью 43 миль/ч, а запас хода составляет 115 миль. После того, как проект M44 был отменен из-за непомерных размеров, началась разработка еще одного полностью закрытого тяжелого PC. В результате проекта M75 было создано гораздо меньшее шасси, которое было намного быстрее M44. Однако он все еще считался слишком большим, и проект M95 продолжал финансироваться."
 VIE_mechanized_heavy_equipment_3: "Автомобиль, Личный, Полногусеничный, Бронированный, M113 ACAV"
 VIE_mechanized_heavy_equipment_3_short: "M113 ACAV"
 VIE_mechanized_heavy_equipment_3_desc: "M113 ACAV, также известный как M150, является бронированной кавалерийской штурмовой машиной, которая является ранней формой БМП. M113 ACAV был разработан в 60-х годах прошлого века корпорацией Food Machinery Corporation. В большинстве аспектов M113 ACAV схож с M113. Вариант M113 ACAV несет пусковую установку TOW и может быть оснащен башней с огнеметом, как это было во Вьетнаме. M113 ACAV использовался везде, где использовался M113."
 VIE_mechanized_heavy_equipment_4: "Автомобиль, Личный, Полногусеничный, Бронированный, M113A1 ACAV"
 VIE_mechanized_heavy_equipment_4_short: "M113A1 ACAV"
 VIE_mechanized_heavy_equipment_4_desc: "Версия M113A1 ACAV с дополнительным вооружением, таким как безоткатная винтовка."
 VIE_mechanized_heavy_equipment_5: "M2 Брэдли"
 VIE_mechanized_heavy_equipment_5_short: "M2 Брэдли"
 VIE_mechanized_heavy_equipment_5_desc: "M2 Брэдли - амфибийный БМП, разработанный компанией BAE Systems Land & Armaments в 1981 году. M2 Брэдли принимал участие во всех конфликтах США с момента своего создания, включая \"Бурю в пустыне.\" Проект M2 Брэдли был направлен на создание нового поколения БМП для современной эпохи, оснащенного NBC-защитой. Проект начался в конце 60-х годов и прошел через множество прототипов, чтобы достичь того уровня, на котором он находится сейчас. Брэдли использует 8-цилиндровый двигатель VTA-903T и имеет торсионную подвеску. Брэдли вооружен 25-мм автопушкой и противотанковой установкой TOW. Перед BAE была поставлена задача создать пехотный транспорт, который был бы бэу. Вдохновленный прототипами проекта MICV, Брэдли способен вести разведку и поддерживать пехоту, которую он перевозит. Хотя он имеет алюминиевую броню, его огневая мощь и мобильность используются для защиты в полевых условиях."
 VIE_mechanized_heavy_equipment_6: "M2A2 Брэдли"
 VIE_mechanized_heavy_equipment_6_short: "M2A2 Брэдли"
 VIE_mechanized_heavy_equipment_6_desc: "Представленный в 1988 году, A2 получил улучшенный двигатель мощностью 600 лошадиных сил (447 кВт) с гидромеханической трансмиссией HMПТ-500-3 и улучшенную броню (как пассивную, так и с возможностью установки реактивной брони взрывного действия). Новая броня защищает \"Брэдли\" от 30-мм снарядов ББОС и РПГ (или аналогичного противоброневого оружия). Новая броня также устранила флюгер, который делал \"Брэдли\" амфибией, и скрыла боковые огневые отверстия."
 VIE_mechanized_heavy_equipment_7: "M2A2 Брэдли ODS"
 VIE_mechanized_heavy_equipment_7_short: "M2A2 Брэдли ODS"
 VIE_mechanized_heavy_equipment_7_desc: "M2 ODS Брэдли - это улучшенный вариант Брэдли, разработанный BAE systems в 1991 году. ODS отличался оптимизированным интерьером, реактивной броней взрывного действия и гидромеханической трансмиссией. Хотя реактивная броня обошлась недешево и привела к тому, что \"Брэдли\" не мог плавать. Б ODS также добавили улучшенный дальномер, навигационную систему, систему противодействия ракетам и тепловизионную систему. Кроме того, был добавлен очень маленький подогреватель пищи и станция комфорта, которую некоторые считают лучшей инновацией."
 VIE_mechanized_heavy_equipment_8: "M2A3 Брэдли"
 VIE_mechanized_heavy_equipment_8_short: "M2A3 Брэдли"
 VIE_mechanized_heavy_equipment_8_desc: "M2A3 Bradley является дальнейшим усовершенствованием Брэдли, разработанным BAE systems в 2000 году. A3 сделал \"Брэдли\" полностью цифровым и сделал все в машине дистанционно управляемым. Также было добавлено множество различных улучшений брони, чтобы сделать машину более живучей. Кроме того, был добавлен NBC инструментарий Bradley, включающий дополнительную радиационную защиту, воздушные фильтры и химическую стойкость. "
 VIE_mechanized_marine_equipment_1: "ЛВТ-4 Уотер Буффало"
 VIE_mechanized_marine_equipment_1_short: "ЛВТ-4"
 VIE_mechanized_marine_equipment_1_desc: "ЛВТП-4 - это десантная машина-амфибия, разработанная корпорацией Ford Machinery Corporation в начале 40-х годов. ЛВТП-4 использовался во Второй мировой войне, Корее и Вьетнаме. Он использует 7-цилиндровый радиальный двигатель W-670-9A и может преодолевать до 75 миль по воде со скоростью 7 миль в час. Являясь эволюцией ЛВТП-1, ЛВТП-4 способен проплывать невероятные расстояния, хотя и с низкой скоростью. Если вам нужно преодолеть 70 миль по воде и у вас есть на это около 10 часов, ЛВТП-4 - ваш выбор. Он способен перевозить войска или транспортные средства. "
 VIE_mechanized_marine_equipment_2: "ЛВТП-5"
 VIE_mechanized_marine_equipment_2_short: "ЛВТП-5"
 VIE_mechanized_marine_equipment_2_desc: "ЛВТП-5\" - это амфибийный БТР, разработанный корпорацией \"Food Machinery Corporation\" в 1956 году. Он принимал участие в боевых действиях во Вьетнаме. ЛВТП-5 использует двигатель ЛВ-1790-1 V12 и может преодолевать до 57 миль по воде со скоростью 7 миль в час. Он является эволюцией ЛВТП-4 и гораздо более живуч и надежен, чем его предшественник. Кроме того, были созданы варианты, позволяющие использовать его шасси в машинах огневой поддержки, таких как 105-мм гаубица. Был создан прототип варианта AA, но он так и не поступил в производство."
 VIE_mechanized_marine_equipment_3: "ЛВТП-7"
 VIE_mechanized_marine_equipment_3_short: "ЛВТП-7"
 VIE_mechanized_marine_equipment_3_desc: "ЛВТП-7 - амфибийный БТР, разработанный в 1972 году корпорацией Food Machinery Corporation. Он участвовал в конфликтах на Фолклендах, Гренаде, в Персидском заливе, Сирии и Ираке. ЛВТП-7 использует двигатель 8V-53T и может проехать 23 мили со скоростью 8,2 мили в час на воде. Наиболее примечательно, что ЛВТП-7 способен передвигаться в состоянии моря 5, которое классифицируется как \"грубое\" со средне-высоким вздутием моря, что делает его превосходным в борьбе с суровыми погодными условиями, чем ЛВТП-5. Кроме того, он гораздо лучше бронирован, чем ЛВТП-5. Так как он может впечатляюще передвигаться в состоянии моря 5 и более хорошо защищен, он заменил ЛВТП-5. Он также оснащен дымовыми рассеивателями."
 VIE_mechanized_marine_equipment_4: "ЛВТП-7A1"
 VIE_mechanized_marine_equipment_4_short: "ЛВТП-7A1"
 VIE_mechanized_marine_equipment_4_desc: "ЛВТП-7A1 - это амфибийный БТР, разработанный в 1984 году корпорацией Food Machinery Corporation. Он принимал участие в боевых действиях в Персидском заливе, Сирии и Ираке. ЛВТП-7A1 использует двигатель VTAC RAM-RS мощностью 525 л.с. и может передвигаться примерно так же, как ЛВТП-7. Он имеет улучшенные двигатель, трансмиссию, систему вооружения и более прост в обслуживании, чем ЛВТП-7. Он также имеет ряд улучшений в системе безопасности для снижения последствий попаданий. "
 VIE_mechanized_marine_equipment_5: "EFVP-1 Усовершенствованная амфибийно-штурмовая машина."
 VIE_mechanized_marine_equipment_5_short: "EFVP-1 УАШМ"
 VIE_mechanized_marine_equipment_5_desc: "EFVP-1 УАШМ - это проект амфибийного БМП, разработанный компанией General Dynamics, который был отменен. EFVP-1 использовал двигатель MT 883 ka, хотя предполагалось, что в процессе производства он будет использовать другой двигатель. Он способен преодолевать 75 миль по воде с впечатляющей скоростью плавания 28,6 миль/ч. Машина также должна была иметь башню в стиле БМП для дополнительной огневой поддержки. Точное вооружение неизвестно, но потенциально оно могло бы вмещать все - от автопушек до ПТРК. Разработка проекта обошлась в 3 миллиарда, но в итоге была отменена, поскольку, по оценкам, создание оставшейся части машины обошлось бы еще в 12 миллиардов. Он видел бой в испытательном бассейне, когда во время испытаний от него оторвался кусок, и один из конструкторов, разозленный тем, что он снова это сделал, пнул его достаточно сильно, чтобы сломать ему ногу. "
 VIE_motorized_equipment_1: "GMC CCKW"
 VIE_motorized_equipment_1_short: "GMC CCKW"
 VIE_motorized_equipment_1_desc: "GMC CCKW - это 2,5-тонный грузовик 6х6, разработанный General Motors в 1941 году. Он широко использовался во время Второй мировой и Корейской войн. CCKW использует двигатель GMC270, 5-ступенчатую/2-диапазонную коробку передач и балочную ось на рессорной подвеске. Он может перевозить груз весом 5000 фунтов. Он может двигаться со скоростью до 45 миль в час на протяжении 300 миль и имеет расход топлива 7,5 миль/гал. CCKW был разработан для армии США в качестве грузовика для перевозки войск и снабжения. Грузовик, помимо использования для снабжения и транспортировки, мог также устанавливать кузов-фургон для использования в качестве полевого автомобиля с удобствами/поддержки, а также устанавливать буксируемое оружие на свою кровать для создания дешевого оружия СХ."
 VIE_motorized_equipment_2: "Toyota Модель DW 15L 2.5-тонный 6x6"
 VIE_motorized_equipment_2_short: "Модель DW 15L 2.5т 6x6"
 VIE_motorized_equipment_3: "REO M35A2"
 VIE_motorized_equipment_3_short: "M35A2"
 VIE_motorized_equipment_3_desc: "M35A2 обычно оснащается двигателем LDT 465 производства Continental Motors Company, Hercules или White Motor Company. Это рядный, 478-кубиковый (7,8 л), шестицилиндровый, многотопливный двигатель с турбонаддувом, развивающий мощность 134 л.с. (100 кВт) и крутящий момент 330 фунт-фут (447 Н⋅м). Он агрегатируется с 5-ступенчатой механической коробкой передач и разведенной 2-ступенчатой раздаточной коробкой (либо раздаточная коробка Rockwell 136-21 с пружинным приводом, либо раздаточная коробка Rockwell 136-27 с пневматическим приводом)."
 VIE_motorized_equipment_4: "M939"
 VIE_motorized_equipment_4_short: "M939"
 VIE_motorized_equipment_4_desc: "M939 - это 5-тонный грузовик 6x6, разработанный компанией AM General в 1982 году. Он использовался во всех западных конфликтах с 1982 года. M939 использует двигатель 6CTA8.3, 5-ступенчатую/2-диапазонную коробку передач и балочные мосты на рессорной подвеске. Машина способна перевозить груз весом 10000 фунтов. Он может двигаться со скоростью 6,3 миль в час на протяжении 350 миль и имеет расход топлива 6 миль/гал. M939 очень эффективен на любой местности и хорошо подходит для суровых погодных условий. M939 позволил создать новое поколение грузовиков, тягачей и эвакуационных машин и получил широкое распространение в производстве. Он более надежен и прочен, чем предыдущие машины, и полностью вытеснил предыдущие производственные контракты. "
 VIE_motorized_equipment_5: "Oshkosh Семейство средних тактических машин 6x6"
 VIE_motorized_equipment_5_short: "ССТМ 6x6"
 VIE_motorized_equipment_5_desc: "Семейство средних тактических машин (ССТМ) - это серия машин, базирующихся на общем шасси, которые различаются по грузоподъемности и требованиям миссии. ССТМ создан на базе австрийского грузовика Steyr 12 M 18, но существенно модифицирован в соответствии с требованиями армии США, включая минимум 50% американского компонента."
