 JAP_motorized_equipment_3_short: "TSD 2.5т 6x6"
 JAP_motorized_equipment_4: "Toyota Тип 73 1.2-тонный Поколение 1 4x4"
 JAP_motorized_equipment_4_short: "Тип 73 1.2т Пок1 4x4"
 JAP_motorized_equipment_5: "Isuzu Тип 73 2.5-ton Generation 3 6x6"
 JAP_motorized_equipment_5_short: "Тип 73 2.5т Пок3 6x6"
 JAP_mechanized_marine_equipment_1: "ЛВТ-4 Уотер Буффало"
 JAP_mechanized_marine_equipment_1_short: "ЛВТ-4"
 JAP_mechanized_marine_equipment_1_desc: "ЛВТП-4 - десантная машина-амфибия, разработанная корпорацией Ford Machinery Corporation в начале 40-х годов. ЛВТП-4 использовался во Второй мировой войне, Корее и Вьетнаме. Он использует 7-цилиндровый радиальный двигатель W-670-9A и может преодолевать до 75 миль по воде со скоростью 7 миль в час. Являясь эволюцией ЛВТП-1, ЛВТП-4 способен проплывать невероятные расстояния, хотя и на низкой скорости. Если вам нужно преодолеть 70 миль по воде и у вас есть на это около 10 часов, ЛВТП-4 - ваш выбор. Он способен перевозить войска или транспортные средства. "
 JAP_mechanized_marine_equipment_2: "ЛВТ(A)-5"
 JAP_mechanized_marine_equipment_2_short: "ЛВТ(A)-5"
 JAP_mechanized_marine_equipment_2_desc: "ЛВТ(A)-4 с башней с приводом и гиростабилизатором для гаубицы. Некоторые были модернизированы в конце 1940-х годов путем изменения конфигурации брони."
 JAP_mechanized_marine_equipment_3: "Ohara Тип 78 Снегоход"
 JAP_mechanized_marine_equipment_3_short: "Тип 78 СХ"
 JAP_mechanized_marine_equipment_3_desc: "Тип 78 - довольно необычный гусеничный транспортер. Его основная задача - работать по снегу и перевозить пассажиров, лыжников, легкие грузы и различное оборудование. Он был произведен компанией Ohara Iron Works. В этом снегоходе использовались автомобильные компоненты от грузовика \"Тип 73.\" Он был принят на вооружение в 1978 году, отсюда и название. Он заменил предыдущие снегоходы Тип 60 и Тип 61."
 JAP_mechanized_marine_equipment_4: "AAVP-7A1"
 JAP_mechanized_marine_equipment_4_short: "AAVP-7A1"
 JAP_mechanized_marine_equipment_4_desc: "ЛВТП-7A1 - это амфибийный БТР, разработанный в 1984 году корпорацией \"Food Machinery Corporation.\" Он принимал участие в боевых действиях в Персидском заливе, Сирии и Ираке. ЛВТП-7A1 использует двигатель VTAC RAM-RS мощностью 525 л.с. и может передвигаться примерно так же, как ЛВТП-7. Он имеет улучшенные двигатель, трансмиссию, систему вооружения и более прост в обслуживании, чем ЛВТП-7. Он также имеет ряд улучшений в системе безопасности для снижения последствий попаданий. "
 JAP_mechanized_marine_equipment_5: "Ohara Тип 10 Снегоход"
 JAP_mechanized_marine_equipment_5_short: "Тип 10 СХ"
 JAP_mechanized_marine_equipment_5_desc: "Министерство обороны Японии искало новый гусеничный транспортер для замены устаревшей снегоходной машины Тип 78. Он использовал многие автомобильные компоненты военного грузовика Тип 73, который производился в больших количествах для японских военных. Новый гусеничный транспортер произведен корпорацией Ohara."
 JAP_auto_cannon_equipment_1: "40 мм Автоматическая Пушка M1"
 JAP_auto_cannon_equipment_1_short: "M1 Бофорс"
