 SOV_mbt_equipment_0: "Т-34-85"
 SOV_mbt_equipment_0_short: "Т-34-85"
 SOV_mbt_equipment_0_desc: "Т-34 - советский средний танк, который произвел революцию в области танкостроения и хорошо известен своей надежностью. Т-34 был разработан в 1940 году в ХКБМ в Советском Союзе. В попытке снизить затраты в конструкцию танка была введена наклонная броня. Однако это привело к тому, что сам танк стал гораздо лучше защищенным, а также менее дорогим за счет меньшей площади. Само орудие - 76,2-мм пушка - имело номинальный боезапас. Однако прицелы и приборы обзора были очень плохими, что затрудняло работу командиров танков, а их слабая координация сводила на нет все преимущества, которые давал сам танк. Т-34 стал вторым по производству танком в мире, но одним из самых важных во Второй мировой войне. Т-34 и сегодня используются повстанцами и более бедными странами."
 SOV_mbt_equipment_1: "Т-44"
 SOV_mbt_equipment_1_short: "Т-44"
 SOV_mbt_equipment_1_desc: "Т-44 - средний советский танк, созданный ближе к концу Второй мировой войны. Он обладал улучшенной подвижностью и усиленной броней, а также более тяжелым 85-мм основным орудием. Он был разработан А.А. Морозовым в 1944 году, но построено было немного, так как танк считался слишком дорогим для тех преимуществ, которые он давал. Всего было построено 2000 танков, после чего производство вернулось к Т-34."
 SOV_mbt_equipment_2: "Т-54"
 SOV_mbt_equipment_2_short: "Т-54"
 SOV_mbt_equipment_2_desc: "Танк Т-54 был самым производимым танком в истории. Танк был разработан в 1946 году конструктором ХКБМ. Сам танк использует 100-мм нарезную пушку и имеет различную толщину брони - от 205 мм до 60 мм. Двигатель - дизельный V-12 объемом 38,88 л. Танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался в более чем 50 армиях мира и выпускался на протяжении всего советского периода и всех конфликтов вместе с ним. "
 SOV_mbt_equipment_3: "Т-55"
 SOV_mbt_equipment_3_short: "Т-55"
 SOV_mbt_equipment_3_desc: "Т-55 - улучшенная версия танка Т-54. ОКБ-520 модифицировало конструкцию Т-55, улучшив защиту от ЯБП, поставив более оптимизированный двигатель, улучшив форму башни, и даже добавив больше вспомогательного оборудования, такого как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал 12,7 ДШК НСВ, в то время как Т-54 использовал 7,62 СПСГ, что дало ему больше огневой мощи, но не позволило нести больше боеприпасов. Т-55 использовался в столь же многочисленных армиях и, как правило, участвовал во всех конфликтах, что и Т-54. "
 SOV_mbt_equipment_4: "Т-62"
 SOV_mbt_equipment_4_short: "Т-62"
 SOV_mbt_equipment_4_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольное орудие и имеет несколько более толстую броню. Главная пушка также была увеличена до 115 мм. Изначально он был заказан Советским Союзом в попытке улучшить огневую мощь, и конструкторское бюро ОКБ-520 завершило проект около 1960 года. Несмотря на усовершенствование, производство не было свернуто, так как его стоимость была номинально выше, чем у Т-55. Было произведено более 22 700 единиц Т-62, которые приняли участие в большом количестве боевых действий по всей советской территории, но в основном в конфликтах на Ближнем Востоке. Его усовершенствования показали несколько большие возможности в 1969 году в китайско-советском пограничном конфликте. "
 SOV_mbt_equipment_5: "Т-64А"
 SOV_mbt_equipment_5_short: "Т-64A"
 SOV_mbt_equipment_5_desc: "Т-64 - это советский танк Т-64, в который были внесены многочисленные модернизации по сравнению с Т-62, и его можно назвать продолжением усовершенствований, сделанных с Т-55 до Т-62. Он имеет более компактный двигатель, композитную броню, улучшенное вспомогательное оборудование двигателя и 125-мм основную пушку с автозарядом. Разработанный в 1962 году ХКБМ, танк имел множество усовершенствований по сравнению со своим предшественником, но при этом значительно подорожал. В качестве двигателя использовался 5-цилиндровый дизельный двигатель 5TDF, что позволило увеличить дальность хода и скорость. Танк планировалось списать, но благодаря политическому влиянию главного конструктора его удалось сохранить в производстве. Александр Морозов, главный конструктор, утверждал, что, несмотря на затраты, это была значительно более совершенная конструкция, которая того стоила. В ходе войны на Донбассе и в Приднестровье это оказалось не так. Он был заменен на гораздо более экономически эффективный Т-72. "
 SOV_mbt_equipment_6: "Т-72"
 SOV_mbt_equipment_6_short: "Т-72"
 SOV_mbt_equipment_6_desc: "Т-72 - советский танковый танк нового поколения, созданный в основном для замены Т-62 и его дорогого аналога Т-64. Он стоил почти в два раза дешевле Т-64 и был значительно усовершенствован. Его разработка была завершена в 1973 году Леонидом Венедиктовым и показала невероятные возможности. Орудие и броня по-прежнему были 125-мм и композитными соответственно, но с гораздо более экономически обоснованной конструкцией, которую было легче производить. Двигатель - V-12 мощностью 780 л.с., который впоследствии мог быть переоборудован в 1130-сильный. Танк мог достичь невероятной подвижности, развивая скорость до 80 км/ч, и мог преодолевать более суровые участки местности лучше, чем Т-64. В отличие от Т-64, танк использовался во всех конфликтах в советской сфере и показал невероятные возможности и в них. Танк также использовался во внеконфликтных конфликтах в Африке, на Ближнем Востоке и в Индокитае."
 SOV_mbt_equipment_7: "Т-80У"
 SOV_mbt_equipment_7_short: "Т-80У"
 SOV_mbt_equipment_7_desc: "Т-80 - советский танковый танк, разработанный в соответствии с доктриной высокой мобильности Т-72. ХКБМ начал его проектирование в 1964 году и закончил в 1975 году после 11 лет работы. Сам корпус выполнен из улучшенной, утолщенной композитной брони и оснащен улучшенной гладкоствольной пушкой. Для повышения огневой мощи он также может оснащаться ракетным вооружением. Дальность стрельбы меньше, чем у Т-72, а скорость несколько ниже, несмотря на более совершенную трансмиссию и газотурбинный двигатель. Он принимал участие в чеченских войнах и войне на Донбассе, но не использовался так широко, как Т-72."
 SOV_mbt_equipment_8: "Т-90"
 SOV_mbt_equipment_8_short: "Т-90"
 SOV_mbt_equipment_8_desc: "После того, как Т-80 не смог заменить Т-72 или продемонстрировать значительно большие возможности, Карцев-Венедиктов стремился к дальнейшему совершенствованию танка и внедрению лучших возможностей, чем у Т-80. Проектирование было закончено примерно в 1990 году. Двигатель был заменен на 12-цилиндровый дизель, он был медленнее, чем даже у Т-80, но обладал гораздо большей огневой мощью. Было модернизировано орудие, улучшена система управления огнем, значительно утолщена броня и добавлено много вспомогательного оборудования, включая глушитель АТГМ и дымовые шашки. Он принимал участие в боевых действиях в Дагестане и Донбассе. "
 SOV_mbt_equipment_9: "Т-84Н"
 SOV_mbt_equipment_9_short: "Т-84Н"
 SOV_mbt_equipment_9_desc: "Работы по модернизации танка Т-80УД начались в 1992 году. Т-84Н имеет новую бронированную боковую юбку, новую сварную башню с автоматом заряжания в кормовой нише, новую реактивную броню, вспомогательную силовую установку (ВСУ), тепловизионный прицел, спутниковую навигацию, лазерный дальномер для командира и другие усовершенствования."
