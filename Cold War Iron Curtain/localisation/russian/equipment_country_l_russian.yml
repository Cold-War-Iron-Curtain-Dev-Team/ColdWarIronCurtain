 JAP_atgm_equipment_0: "Kawasaki Тип 64 MAT"
 JAP_atgm_equipment_0_short: "Тип 64 MAT"
 JAP_atgm_equipment_0_desc: "Тип 64 MAT (64-шики тай-сэнша юдо-дан) - японская противотанковая ракета с проводным наведением, разработанная в конце 1950-х годов. Ракета в целом похожа на швейцарско-немецкую Кобру и 9M14 Малютка. В СССЯ она также известна как 64MAT и KAM-3."
 JAP_atgm_equipment_1: "Kawasaki Тип 79 Jyu-MAT"
 JAP_atgm_equipment_1_short: "Тип 79 Jyu-MAT"
 JAP_atgm_equipment_1_desc: "Тип 79 Jyu-MAT (79-шики тай-шутэй тай-сэнша юдо-дан) - японская управляемая противотанковая ракета ПАКПВ, поступившая на вооружение СССЯ в 1984 году. Первоначально она была выпущена для подразделений береговой обороны и предназначалась для уничтожения десантных кораблей с войсками и транспортными средствами при их приближении к береговой линии. Она также известна как КАМ-9."
 JAP_atgm_equipment_2: "Kawasaki`Тип 79 Кай Дзю-MAT"
 JAP_atgm_equipment_2_short: "Тип 79 Кай Дзю-MAT"
 JAP_atgm_equipment_2_desc: "Тип 79 Кай Дзю-MAT (79-шики тай-шутэй тай-сэнша юдо-дан) - японская управляемая противотанковая ракета ПАКПВ, поступившая на вооружение СССЯ в 1984 году. Первоначально она была выпущена для подразделений береговой обороны и предназначалась для уничтожения десантных кораблей с войсками и транспортными средствами при их приближении к береговой линии. Она также известна как КАМ-9."
 JAP_atgm_equipment_3: "Kawasaki Тип 87 Чу-MAT"
 JAP_atgm_equipment_3_short: "Тип 87 Чу-MAT"
 JAP_atgm_equipment_3_desc: "Тип 87 Чу-MAT ( 87-шики тай-сэнша юдо-дан) Чу-MAT - японская противотанковая ракета с лазерным наведением, состоящая на вооружении Сухопутных сил самообороны Японии. Она была создана в качестве фронтовой замены для Тип 64 MAT, поступившей на вооружение вместе с Тип 79 Чу-MAT. "
 JAP_atgm_equipment_4: "Kawasaki Тип 87 Кай Чу-MAT"
 JAP_atgm_equipment_4_short: "Тип 87 Кай Чу-MAT"
 JAP_atgm_equipment_4_desc: "Тип 87 Чу-MAT ( 87-шики тай-сэнша юдо-дан) Чу-MAT - японская противотанковая ракета с лазерным наведением, состоящая на вооружении Сухопутных сил самообороны Японии. Она была создана в качестве фронтовой замены для Тип 64 MAT, поступившей на вооружение вместе с Тип 79 Дзю-MAT. "
 JAP_atgm_equipment_5: "Kawasaki Тип 01 LMAT"
 JAP_atgm_equipment_5_short: "Тип 01 LMAT"
 JAP_atgm_equipment_5_desc: "Тип 01 LMAT ( 01-шики кей-тай-сэнша юдо-дан) - японская переносная противотанковая ракета. Разработка началась в 1993 году на предприятии Kawasaki Heavy Industries и была принята на вооружение в 2001 году. В ходе разработки ракета получила кодовое название XATM-5. Позже она стала известна под кодовым названием ATM-5."
 JAP_atgm_carrier_equipment_0: "Mitsubishi Тип 73 ко. MAT"
 JAP_atgm_carrier_equipment_0_short: "Тип 73 MAT"
 JAP_atgm_carrier_equipment_0_desc: "Mitsubishi Тип 73 с установленным противотанковым управляемым ракетным комплексом Тип 64 MAT, закрепленным на задних боковых панелях."
 JAP_atgm_carrier_equipment_1: "Komatsu Тип 60 ко. MAT"
 JAP_atgm_carrier_equipment_1_short: "Тип 60 MAT"
 JAP_atgm_carrier_equipment_1_desc: "Komatsu Тип 60 APC с установленным противотанковым управляемым ракетным комплексом Тип 64 MAT, закрепленным на задних боковых панелях."
 JAP_atgm_carrier_equipment_2: "Mitsubishi Тип 73 ко. Дзю-MAT"
 JAP_atgm_carrier_equipment_2_short: "Тип 73 Дзю-MAT"
 JAP_atgm_carrier_equipment_2_desc: "Mitsubishi Тип 73 с установленным на задней палубе противотанковым управляемым ракетным комплексом Тип 79 Дзю-MAT."
 JAP_atgm_carrier_equipment_3: "Toyota Мега Крейсер с многоцелевым ракетным комплексом Тип 96"
 JAP_atgm_carrier_equipment_3_short: "Тип 96 МКМР"
 JAP_atgm_carrier_equipment_3_desc: "Многоцелевой ракетный комплекс Тип 96 - это противотанковая/десантная ракета, используемая СССЯ. Это первая японская ракетная система, в которой используется полный интерфейс с цифровым управлением. "
 JAP_atgm_carrier_equipment_4: "Toyota Мега Крейсер с многоцелевой ракетой средней дальности"
 JAP_atgm_carrier_equipment_4_short: "МРСД"
 JAP_atgm_carrier_equipment_4_desc: "Многоцелевая ракета средней дальности или Чу-MPM - это противотанковая/посадочная ракета, используемая японской армией СССЯ."
 JAP_sam_carrier_equipment_4: "Зенитно-ракетный комплекс Toshiba Тип 81"
 JAP_sam_carrier_equipment_4_short: " Тип 81 Тансам"
 JAP_sam_carrier_equipment_4_desc: "Тип 81 или Тансам (短SAM) - это ракета класса \"земля-воздух\" японской разработки, в настоящее время состоящая на вооружении сухопутных сил самообороны Японии. "
 JAP_sam_carrier_equipment_5: "Toshiba Тип 93 ЗРК малой дальности Закрытая стрела."
 JAP_sam_carrier_equipment_5_short: "Тип 93 Консам"
 JAP_sam_carrier_equipment_5_desc: "Тип 93 (93 шики-кинкёри-титайку-ююдодан) или Kon-SAM - это ракета класса \"земля-воздух\", используемая Сухопутными силами самообороны Японии. Это носимая версия ракеты Тип 91."
 JAP_sam_carrier_equipment_6: "Зенитно-ракетный комплекс Toshiba Тип 11"
 JAP_sam_carrier_equipment_6_short: "Тип 11 Тансам Кай II"
 JAP_sam_carrier_equipment_6_desc: "Зенитная ракета Тип 11 или Тансам Кай II - это ракета класса \"земля-воздух\" японской разработки, в настоящее время состоящая на вооружении Сил самообороны Японии."
