 SOV_lt_equipment_1: "Т-60"
 SOV_lt_equipment_1_short: "Т-60"
 SOV_lt_equipment_1_desc: "Т-60 - легкий танк, созданный для замены Т-38 в роли разведчика. Он был разработан в 1941 году Николаем Астровым, и за 2 года его производства было выпущено 6300 машин. Машина представляла собой танк с 2 экипажами, 6-цилиндровым двигателем, развивающий скорость до 44 км/ч, с 20-мм основным орудием. Он широко использовался во время Второй мировой войны."
 SOV_lt_equipment_2: "Т-70"
 SOV_lt_equipment_2_short: "Т-70"
 SOV_lt_equipment_2_desc: "Легкий танк Т-70 - это танк-разведчик времен Второй мировой войны, созданный для замены ПТ60. Николай Астров начал работу сразу после ПТ60 и закончил в 1942 году. За 2 года было выпущено 8300 единиц. Танк имел более мощную 45-мм пушку, оснащался 2 двигателями ГАЗ-202 и мог развивать скорость до 45 км/ч. Т-70 также имел номинально улучшенную оптику Он широко использовался во время Второй мировой войны."
 SOV_lt_equipment_3: "ПТ-76"
 SOV_lt_equipment_3_short: "ПТ-76"
 SOV_lt_equipment_3_desc: "ПТ-76 - советский легкий танк-амфибия, который активно экспортировался по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 году и было произведено около 12 000 единиц. Он требует экипаж из 3 человек и двигатель V6 с прямой шестеркой, развивает скорость 44 км/ч и может плавать со скоростью 10 км/ч. Он экспортировался в различные страны советской сферы и страны, склоняющиеся к советской власти, и в качестве такового участвовал в разведке практически во всех конфликтах стран советской сферы. Однако, благодаря своей известной надежности и простоте обслуживания, он до сих пор используется многими странами."
 SOV_lt_equipment_4: "ПТ-76Б Модель 4"
 SOV_lt_equipment_4_short: "ПТ-76Б"
 SOV_lt_equipment_4_desc: "ПТ-76 вооружен 76. 2 мм нарезной танковой пушкой (дульный тормоз с двойной перегородкой, эжектор патронов, дымоуловитель и двухосевая система стабилизации СТП-2П Заря),[4] системой защиты от ЯБП ПАЗ (противоатомная защита), автоматической системой пожаротушения, улучшенным прицелом ТШК-2-66, фильтровентиляционная система, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный дизельный двигатель V-6B с водяным охлаждением мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для чего пришлось несколько изменить форму брони. "
 SOV_lt_equipment_5: "БРМ-1K"
 SOV_lt_equipment_5_short: "БРМ-1K"
 SOV_lt_equipment_5_desc: "БРМ-1К - советская разведывательная машина времен поздней холодной войны. Она была разработана для поддержки бронетанковых и механизированных формирований, используемых советскими войсками. БРМ-1К должен был разведывать маршруты и обнаруживать вражеские формирования."
 SOV_lt_equipment_6: "БРМ-3К"
 SOV_lt_equipment_6_short: "БРМ-3К"
 SOV_lt_equipment_6_desc: "БРМ-3К Рысь была разработана в начале 1990-х годов. Он был предназначен для дополнения и замены разведывательной машины БРМ-1К. Она базируется на шасси боевой машины пехоты БМП-3. Хотя БРМ-3К был официально принят на вооружение российской армии еще в 1995 году, он до сих пор находится в малосерийном производстве."
