 POR_lt_equipment_3_desc: "Panhard EBR (Panhard Engin Blindé de Reconnaissance, фр.; бронированная разведывательная машина) - бронированный автомобиль, разработанный компанией Panhard для французской армии и позже использовавшийся по всему миру, в частности, французской армией во время Алжирской войны и португальской армией во время Португальской колониальной войны в Анголе, Мозамбике и Гвинее-Бисау."
 POR_lt_equipment_4: "Panhard AML-60"
 POR_lt_equipment_4_short: "AML-60"
 POR_lt_equipment_4_desc: "Известный более официально как AML HE 60-7, или под кодом производителя AML-245B, AML-60 был первоначальной серийной моделью Panhard и включал округлую башню со спаренными 7.62мм пулеметами слева и казнозарядным 60мм (2.36 дюйма) минометом справа, с 3800 боеприпасами калибра 7.62мм и 43-53 минометными снарядами, соответственно."
 POR_lt_equipment_5: "Bravia Chaimite V-400"
 POR_lt_equipment_5_short: "V-400"
 POR_lt_equipment_5_desc: "Bravia Chaimite - это бронированная машина с полным приводом колес, построенная португальской компанией Bravia. Этот вариант представляет собой тяжелую машину огневой поддержки с 90-мм или 75-мм пушкой низкого давления."
