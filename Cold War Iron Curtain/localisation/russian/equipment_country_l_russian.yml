 JAP_sht_equipment_1: "O-I"
 JAP_sht_equipment_1_short: "O-I"
 JAP_sht_equipment_1_desc: "Гусеница танка из проекта выставлена в школе СССЯ Фудзи в Японии. В конечном итоге, полная история прототипа O-I неизвестна из-за неясного характера проекта и ограниченного количества документации, сохранившейся после войны."
 JAP_mechanized_equipment_1: "Тип 1 Хо-Ки"
 JAP_mechanized_equipment_1_short: "Тип 1 Хо-Ки"
 JAP_mechanized_equipment_1_desc: "Тип 1 Бронетранспортер Хо-Ки был гусеничным бронетранспортером (БТР), разработанным Императорской армией Японии во время Второй мировой войны."
 JAP_mechanized_equipment_2: "M3 Полугусеничный"
 JAP_mechanized_equipment_2_short: "M3 Полугусеничный"
 JAP_mechanized_equipment_2_desc: "Полугусеничный бронетранспортер M3 был американским полугусеничным бронетранспортером, широко использовавшимся союзниками во время Второй мировой войны и в холодной войне. Созданный на основе полугусеничной машины M2, M3 был широко распространен, было произведено около 15 000 стандартных M3 и более 38 000 вариантов. В эпоху холодной войны машина использовалась различными государственными и негосударственными операторами в конфликтах в Южной Америке, на Ближнем Востоке, в Африке и Азии, оставаясь на вооружении до середины 1990-х годов. В Мексике они все еще используются по состоянию на 2019 год."
 JAP_mechanized_equipment_3: "M5 Полугусеничный"
 JAP_mechanized_equipment_3_short: "M5 Полугусеничный"
 JAP_mechanized_equipment_3_desc: "M5 - это полугусеничная машина M3 с улучшенным кольцевым креплением пулемета M49 над правым передним сиденьем - упрощенная версия M3A1. Между 1942 и 1943 годами все полугусеничные машины M3 (стандартные и A1) постоянно модернизировались. Эти усовершенствования включали ряд улучшений трансмиссии, двигателя и укладки."
 JAP_mechanized_equipment_4: "Автомобиль, Личный, Полногусеничный, Бронированный, M59"
 JAP_mechanized_equipment_4_short: "M59"
 JAP_mechanized_equipment_5: "Komatsu Тип 60 Року-Мару-Шики"
 JAP_mechanized_equipment_5_short: "Тип 60"
 JAP_mechanized_equipment_5_desc: "Бронетранспортер Тип 60 (60, року-мару-шики-суку-ша) - это бронетранспортер, поступивший на вооружение Сухопутных сил самообороны Японии в 1960 году."
 JAP_mechanized_equipment_6: "Komatsu Тип 60 Кай Року-Мару-Шики"
 JAP_mechanized_equipment_6_short: "Тип 60 Кай"
 JAP_mechanized_equipment_6_desc: "Тип 60 Кай (Кайдзен или Улучшенный) бронетранспортер (60, року-мару-шики-суку-ша) - это бронетранспортер, поступивший на вооружение Сухопутных сил самообороны Японии после 1960 года."
 JAP_mechanized_equipment_7: "Mitsubishi Тип 73 Нана-Сан-Шики"
 JAP_mechanized_equipment_7_short: "Тип 73"
 JAP_mechanized_equipment_7_desc: "Бронетранспортер Тип 73 (73, нана-сан-шики-сукоу-ся) - это бронетранспортер, поступивший на вооружение Сухопутных сил самообороны Японии в 1973 году."
 JAP_mechanized_equipment_8: "Mitsubishi Тип 73 Кай Нана-Сан-Шики"
 JAP_mechanized_equipment_8_short: "Тип 73 Кай"
 JAP_mechanized_equipment_8_desc: "Тип 73 Кай (Кайдзен или Улучшенный) Бронетранспортер (73, нана-сан-шики-суку-ся) - это бронетранспортер, поступивший на вооружение Сухопутных сил самообороны Японии после 1973 года."
 JAP_mechanized_equipment_9: "Komatsu Тип 96 Кюу-Року-Шики"
 JAP_mechanized_equipment_9_short: "Тип 96"
 JAP_mechanized_equipment_9_desc: "Колесный бронетранспортер Тип 96 (96, кюу-року-шики-сурин-суку-ся) - это бронированная машина, поступившая на вооружение Японии в 1996 году. "
 JAP_mechanized_equipment_10: "Komatsu Тип 96B Кай Кюу-Року-Шики"
 JAP_mechanized_equipment_10_short: "Тип 96B"
 JAP_mechanized_equipment_10_desc: "Новый прототип БТР 8×8 под названием Колесная бронированная машина (Улучшенная или Кайдзен) был передан японским вооруженным силам для замены 365 машин Тип 96, находящихся на вооружении. Разработанная Министерством обороны Японии в сотрудничестве с Komatsu Limited, эта колесная машина нового поколения была спроектирована для обеспечения большей защиты от самодельных взрывных устройств (СВУ) с компоновкой, аналогичной Patria AMV и Страйкер, обеспечивая японскую армию семейством различных машин на общем шасси. Предлагаемая новая машина длиннее, выше и тяжелее, чем Тип 96."
 JAP_mechanized_heavy_equipment_6: " Тип 89 Хачи-Кю"
 JAP_mechanized_heavy_equipment_6_short: "Тип 89"
 JAP_mechanized_heavy_equipment_7: "Тип 89 Хачи-Кю Кай"
 JAP_mechanized_heavy_equipment_7_short: "Тип 89 Кай"
 JAP_mechanized_heavy_equipment_8: "Тип 89 Хачи-Кю SLEP"
 JAP_mechanized_heavy_equipment_8_short: "Тип 89 SLEP"
 JAP_mechanized_heavy_equipment_8_desc: "Mitsubishi Тип 89 БМП (89, Mitsubishi 89-шики соко сэнто-ша) (89 FV ) - японская боевая машина пехоты, поступившая на вооружение Сухопутных сил самообороны Японии в 1989 году. По состоянию на 1999 год на вооружении состояло 58 машин, к 2014 году было произведено 120 машин, а всего планируется произвести 300. Основное вооружение машины - пушка Oerlikon Contraves 35 миллиметров KDE. "
