 ISR_iw_armored_vehicles_desc: "Армия обороны Израиля (АОИ), альтернативно именуемая на иврите аббревиатурой ЦАХАЛ, является национальной армией Государства Израиль. Она состоит из трех родов войск: сухопутных войск Израиля, ВВС Израиля и ВМС Израиля. Это единственное военное крыло израильского аппарата безопасности, не имеющее гражданской юрисдикции на территории Израиля."
