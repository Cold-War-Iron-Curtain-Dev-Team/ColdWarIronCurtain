 SPR_mechanized_equipment_10: "Mowag Piranha IIIC Fusileros"
 SPR_mechanized_equipment_10_short: "Piranha IIIC Fusileros"
 SPR_mechanized_heavy_equipment_4: "M113 ACAV"
 SPR_mechanized_heavy_equipment_4_short: "M113 ACAV"
 SPR_mechanized_heavy_equipment_4_desc: "M113 ACAV, также известный как M150, - это бронированная кавалерийская штурмовая машина, которая является ранней формой БМП. M113 ACAV был разработан в 60-х годах прошлого века корпорацией Food Machinery Corporation. В большинстве аспектов M113 ACAV похож на M113. Вариант M113 ACAV несет пусковую установку TOW и потенциально может быть оснащен башней с огнеметом, как это было во Вьетнаме. M113 ACAV использовался везде, где использовался M113."
