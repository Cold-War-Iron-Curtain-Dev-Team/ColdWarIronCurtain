 SPR_mbt_equipment_0: "Верьеда 1"
 SPR_mbt_equipment_0_short: "Верьеда 1"
 SPR_mbt_equipment_0_desc: "Внешний вид получившегося прототипа Верьеда 1 был близок к тому, что первоначально предполагалось в первых проектах капитана Верьеда. Корпус машины был удлинен, а задняя панель - наклонена, в то время как запас топлива и, следовательно, дальность боя были увеличены, как и запас боеприпасов и толщина брони."
 SPR_mbt_equipment_1: "Panzerkampfwagen IV Ausf.H"
 SPR_mbt_equipment_1_short: "Panzer IV Ausf.H"
 SPR_mbt_equipment_1_desc: "Уже в январе 1944 года Испания снова начала вести переговоры с Германией о поставках дополнительной техники. Новая программа вращалась вокруг продажи 33 Panzer IV, три из которых должны были быть командного варианта. Позднее было сделано еще одно предложение о продаже еще 67 Panzer IV; в результате, обе программы в сумме давали потенциальную возможность закупки 100 Panzer IV.["
 SPR_mbt_equipment_3: "M47E Паттон"
 SPR_mbt_equipment_3_short: "M47E Паттон"
 SPR_mbt_equipment_3_desc: "M47 Паттон - один из первых основных боевых танков, разработанный Департаментом вооружений армии США в 1951 году. Он очень похож на M46 Паттон, но имеет обновленную орудийную башню с улучшенным внутренним механизмом и усовершенствованной трансмиссией. Он принимал участие в Суэцком кризисе, 6-дневной войне и югославских войнах."
 SPR_mbt_equipment_4: "M48 Паттон"
 SPR_mbt_equipment_4_short: "M48 Паттон"
 SPR_mbt_equipment_4_desc: "M48 Паттон - это танкетка, разработанная Департаментом вооружений армии США в 1953 году. M48 имеет 110-мм броню и улучшенное 90-мм главное орудие. Двигатель представляет собой оптимизированный вариант V12, использовавшийся на предыдущих танках Patton, с облегченной системой впрыска топлива и наддувом. Запас хода по бездорожью составляет 160 миль, по шоссе - 300 миль. По дороге он может двигаться со скоростью 30 миль в час, а по бездорожью - со скоростью 20 миль в час благодаря усовершенствованному двигателю, трансмиссии и гусеницам. Он служил основным танком в войне во Вьетнаме и широко использовался союзниками США по холодной войне. Он похож на M47 Паттон, но представляет собой совершенно новую конструкцию с новыми внутренними механизмами. Он использовался в армии и морской пехоте США, пока в конечном итоге не был заменен на M60, хотя многие подразделения национальной гвардии все еще эксплуатировали и обслуживали M48 до конца 80-х годов."
 SPR_mbt_equipment_5: "M48A2 Паттон"
 SPR_mbt_equipment_5_short: "M48A2 Паттон"
 SPR_mbt_equipment_6: "AMX-30E"
 SPR_mbt_equipment_6_short: "AMX-30E"
 SPR_mbt_equipment_7: "AMX-30EM2"
 SPR_mbt_equipment_7_short: "AMX-30EM2"
 SPR_mbt_equipment_7_desc: "Министерство обороны Испании согласилось модернизировать армейские AMX-30E в 1987 году и выделило на эту программу 16 миллиардов песет (155 миллионов долларов). С июля 1987 года армия модернизировала весь свой парк AMX-30E до стандартов EM1 и EM2."
 SPR_mbt_equipment_8: "KMW Леопард 2A4S"
 SPR_mbt_equipment_8_short: "Леопард 2A4S"
 SPR_mbt_equipment_9: "KMW Леопард 2E"
 SPR_mbt_equipment_9_short: "Леопард 2E"
 SPR_mechanized_equipment_5: "FMW M113"
 SPR_mechanized_equipment_5_short: "M113"
 SPR_mechanized_equipment_5_desc: "Самый узнаваемый американский БТР с 60-х годов. Благодаря широкому использованию и многолетним исследованиям он превратился в настоящий бронетранспортер, используя свою высоту, угол наклона брони и толщину. Позднее он вводил все новые и новые варианты, вооружаясь пулеметом M2 Браунинг .50 Кал с несколькими тысячами патронов. Воистину, он мог похвастаться как хороший БТР. Десятки вариантов вышли из линейки M113, которые и по сей день используются американскими военными."
 SPR_mechanized_equipment_6: "FMW M113A2"
 SPR_mechanized_equipment_6_short: "M113A2"
 SPR_mechanized_equipment_6_desc: "Самый узнаваемый американский БТР с 60-х годов. Широкое использование и многолетние исследования превратили его в настоящий бронетранспортер, используя его высоту, угол наклона брони и толщину. Позднее он вводил все новые и новые варианты, вооружаясь пулеметом M2 Браунинг .50 Кал с несколькими тысячами патронов. Воистину, он мог похвастаться как хороший БТР. Десятки вариантов вышли из линейки M113, которые и по сей день используются американскими военными."
 SPR_mechanized_equipment_7: "Pegaso 3560 BMR"
