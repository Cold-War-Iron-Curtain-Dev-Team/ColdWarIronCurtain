 CAN_iw_armored_vehicles_desc: "Канадские вооруженные силы (КВС; французский: Forces armées canadiennes; FAC) - это объединенные вооруженные силы Канады, включающие морские, сухопутные и воздушные подразделения, именуемые Королевским канадским флотом, Канадской армией и Королевскими канадскими военно-воздушными силами."
