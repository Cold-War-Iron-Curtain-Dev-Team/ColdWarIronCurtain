 CAN_mechanized_equipment_5: "M113"
 CAN_mechanized_equipment_5_short: "M113"
 CAN_mechanized_equipment_5_desc: "Самый узнаваемый американский БТР с 60-х годов. Широкое использование и многолетние исследования превратили его в настоящий бронетранспортер, используя его высоту, угол наклона брони и толщину. Позднее он вводил все новые и новые варианты, вооружаясь пулеметом M2 Браунинг .50 Калибра с несколькими тысячами патронов. Воистину, он мог похвастаться как хороший БТР. Десятки вариантов вышли из линейки M113, которые и по сей день используются американскими военными."
 CAN_mechanized_equipment_6: "M113A1"
 CAN_mechanized_equipment_6_short: "M113A1"
 CAN_mechanized_equipment_6_desc: "Начиная с 1964 года, бензиновый двигатель был заменен на двигатель 6V-53 Detroit Diesel мощностью 215 л.с. (160 кВт), чтобы использовать преимущества лучшей экономии топлива и меньшей пожароопасности дизельного двигателя."
