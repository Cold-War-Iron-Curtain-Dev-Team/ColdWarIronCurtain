 DEN_atgm_carrier_equipment_1: "Landrover 88 ко. TOW"
 DEN_atgm_carrier_equipment_1_short: "Landrover 88 ко. TOW"
 DEN_atgm_carrier_equipment_1_desc: "M113F1 норвежской армии с отдельной пусковой установкой ракет TOW, установленной на задней палубе."
 DEN_atgm_carrier_equipment_2: "M113G1DK ко. BGM-71 TOW"
