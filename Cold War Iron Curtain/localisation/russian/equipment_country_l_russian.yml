 AST_lt_equipment_3: "Танк, боевой, полногусеничный, 76-мм пушка, M41"
 AST_lt_equipment_3_short: "M41 Уокер Бульдог"
 AST_lt_equipment_3_desc: "M41 - легкий разведывательный танк, разработанный компанией Cadillac в 1949 году. Он принимал участие в боевых действиях во Вьетнаме, в заливе Свиней, Ливане и Сомали. Его броня варьируется от 19 мм до 31,7 мм. Он вооружен 76-мм основным орудием, коаксиальным пулеметом 30 калибра и крышной пушкой 50 калибра. Он использует 6-цилиндровый бензиновый двигатель Continental и развивает скорость до 45 миль/ч, а запас хода составляет 100 миль. Разработка M41 продвигалась медленно и с небольшим финансированием, но когда началась Корейская война, армия США начала торопить программу. Спешка вызвала большое количество проблем в программе и проблемы с габаритами. В результате серьезных проблем, вызванных спешкой, M41 выпускался очень недолго и не использовался во время войны в Корее. Фактически, производство началось только в 1951 году и продолжалось всего 3 года."
 AST_lt_equipment_4: "Carrier, огневая поддержка, полногусеничная башня M113A1 (FS) Саладин"
 AST_lt_equipment_4_short: "M113A1 FSV"
 AST_lt_equipment_4_desc: "Вариант M113, оснащенный башней от бронеавтомобиля Alvis Saladin. FSV поступил в части австралийской армии в середине 1960-х годов после снятия с вооружения Саладинов и был вооружен 76-мм пушкой, коаксиальным пулеметом 30 калибра и пулеметом 30 калибра, установленным на крыше башни машины."
 AST_lt_equipment_5: "Carrier, огневая поддержка, полногусеничная башня M113A1 (FS) Скорпион"
 AST_lt_equipment_5_short: "M113A1 MRV"
 AST_lt_equipment_5_desc: "Австралийский вариант, аналогичный M113 FSV, но использующий башню от легкого танка FV101 Скорпион, вместо старой башни бронеавтомобиля Саладин, которую ранее использовал FSV. Эта башня была оснащена прицелом Image Intensifier для основного вооружения. Этот прицел II стал первым эффективным пассивным ночным прицелом, установленным на австралийских БМП, обеспечив MRV возможности ночного боя, превосходящие Леопард AS1 и все другие австралийские БМП того периода."
 AST_lt_equipment_6: "Carrier, огневая поддержка, полногусеничная башня M113A2+ (FS) Скорпион"
 AST_lt_equipment_6_short: "M113A2+ MRV"
 AST_lt_equipment_6_desc: "Австралийский вариант, аналогичный M113 FSV, но использующий башню от легкого танка FV101 Scorpion, вместо старой башни бронеавтомобиля Саладин, которую ранее использовал FSV. Эта башня была оснащена прицелом Image Intensifier для основного вооружения. Этот прицел II стал первым эффективным пассивным ночным прицелом, установленным на австралийских БМП, обеспечив MRV возможности ночного боя, превосходящие Леопард AS1 и все другие австралийские БМП того периода."
