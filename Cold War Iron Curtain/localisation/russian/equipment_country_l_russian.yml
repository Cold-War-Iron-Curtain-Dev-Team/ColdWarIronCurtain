 JAP_medium_tank_destroyer_equipment_1: "M36 Джексон"
 JAP_medium_tank_destroyer_equipment_1_short: "M36 Джексон"
 JAP_medium_tank_destroyer_equipment_2_desc: "Тип 60 Самоходное 106-мм безоткатное орудие (60, року-мару-шики-дзису-мухандоу-хоу) - это легкая противотанковая машина, разработанная Японией в конце 1950-х годов. В качестве основного вооружения на нем установлены два безоткатных орудия M40 калибра 106 мм."
 JAP_medium_tank_destroyer_equipment_3: "Mitsubishi Тип 73 106мм RR"
 JAP_medium_tank_destroyer_equipment_3_short: "Тип 73 106мм RR"
 JAP_medium_tank_destroyer_equipment_3_desc: "Первый серийный Тип 73, известный как Mitsubishi Тип 73 Легкий Грузовик (Кю) (73-шики когата торакку (кю)), был основан на Jeep CJ-3B, которые Mitsubishi Motors производила по лицензии Willys."
 JAP_medium_tank_destroyer_equipment_4: "Боевая машина будущего"
