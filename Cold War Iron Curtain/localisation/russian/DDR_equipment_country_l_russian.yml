l_russian:
  
 ### Infantry Equipment 
  
 DDR_infantry_equipment_0: "Karabiner 98K"
 DDR_infantry_equipment_0_short: "Karabiner 98K"
 DDR_infantry_equipment_0_desc: "Знаковая винтовка с продольно-скользящим затвором, принятая на вооружение Вермахта в 1935 году в качестве стандартной винтовки. Это была одна из последних разработок в длинной линейке армейских винтовок Маузера. Хотя во время Второй мировой войны она была дополнена полуавтоматическими и полностью автоматическими винтовками, она оставалась основной немецкой винтовкой до конца войны. Несмотря на растущее количество полуавтоматических и полностью автоматических винтовок, Kar98k продолжает использоваться в по обе стороны железного занавеса."
  
 DDR_infantry_equipment_1: "Awtomat Kalashnikova 1947"
 DDR_infantry_equipment_1_short: "MPI-AK-47"
 DDR_infantry_equipment_1_desc: "MPI-AK-47 — восточногерманская лицензионная версия советского автомата АКМ."
  
 DDR_infantry_equipment_2: "Maschinenpistole K"
 DDR_infantry_equipment_2_short: "MPi-KM-72"
 DDR_infantry_equipment_2_desc: "Ранние версии винтовок имели деревянную фурнитуру, но более поздние модели имеют характерные коричневые приклады и пистолетные рукоятки с пунктирной отделкой. MPi-KMS-72 также имеет складывающийся вбок приклад «вешалки» с одной стойкой, особенность, которая характерна для более поздних румынских винтовок."
  
 DDR_infantry_equipment_3: "Maschinenpistole Avtomat Kalashnikova-74N"
 DDR_infantry_equipment_3_short: "MPi-AK-74N"
 DDR_infantry_equipment_3_desc: "В 1981 году ГДР приобрела лицензию на производство АК-74, после чего в оружие было внесено несколько изменений. Новый образец получил индекс MPi AK-74N. Изменения заключались в изготовлении новых приклада и цевья, выполненных из серо-голубого (реже темно-коричневого) пластика. Приклад имел характерную точечную структуру. Вариант со складывающимся прикладом получил вариант MPi AKS-74N. Также был разработан автомат MPi AK-74NK с укороченным стволом."
  
 DDR_infantry_equipment_4: "Maschinenpistole KM-90"
 DDR_infantry_equipment_4_short: "MPi-90"
 DDR_infantry_equipment_4_desc: "Создание Wieger MPi-90 — это попытка Восточной Германии разработать собственную систему стрелкового оружия, независимую от Советского Союза, но на базе АК-74 под патрон 5,56х45 мм НАТО."
  
  ########## NEW DDR ARMOR 
 DDR_iw_armored_vehicles: "Landstreitkräfte der Nationalen Volksarmee"
 DDR_iw_armored_vehicles_short: "LaSK"
 DDR_iw_armored_vehicles_desc: ""
  
 DDR_fighter_equipment_0: "Luftstreitkräfte der Nationalen Volksarmee"
 DDR_fighter_equipment_0_short: "LSK"
 DDR_fighter_equipment_0_desc: "The Air Forces of the National People's Army was the Air Force of East Germany. As with the Landstreitkräfte, the Volksmarine, and the Border Troops, it was a military branch of the National People's Army (NVA)."
  
 DDR_lt_equipment_1: "T-60"
 DDR_lt_equipment_1_short: "T-60"
 DDR_lt_equipment_1_desc: "Т-60 был легким танком, созданным для замены Т-38 в роли разведчика. Он был разработан в 1941 году Николаем Астровым, и за 2 года его производства было выпущено 6300 танков. Машина представляла собой танк с двумя членами экипажа с 6-цилиндровым двигателем и развивала скорость до 44 км / ч с 20-мм пушкой. Он широко использовался во время Второй мировой войны."
 DDR_lt_equipment_2: "T-70"
 DDR_lt_equipment_2_short: "T-70"
 DDR_lt_equipment_2_desc: "Легкий танк Т-70 был танком-разведчиком времен Второй мировой войны, созданным для замены Т-60. Николай Астров начал работу сразу после Т-60 и закончил в 1942 году. За 2 года его изготовления было выпущено 8300 штук. Танк имел гораздо более мощную 45-мм пушку, 2 двигателя ГАЗ-202 и мог развивать скорость до 45 км/ч. Т-70 также имел номинально улучшенные оптические возможности. Он широко использовался во время Второй мировой войны."
 DDR_lt_equipment_3: "ПT-76"
 DDR_lt_equipment_3_short: "ПT-76"
 DDR_lt_equipment_3_desc: "ПТ-76 — советский легкий плавающий танк, который активно экспортировался по всему миру. Он был спроектирован Н. Шашмыриным и Ж. Котиным в 1951 г., выпущено около 12 000 единиц. Экипаж - 3 человека. Он был экспортирован в различные страны советской сферы влини и поэтому играл разведывательную роль практически во всех конфликтах мира. Тем не менее, он до сих пор используется во многих странах благодаря своей знаменитой надежности и простоте обслуживания."
 DDR_lt_equipment_4: "ПТ-76Б"
 DDR_lt_equipment_4_short: "ПТ-76Б"
 DDR_lt_equipment_4_desc: "ПТ-76, вооруженный 76,2-мм нарезной танковой пушкой Д-56ТС (двухкамерный дульный тормоз, эжектор гильз, дымосос и двухкоординатная система стабилизации СТП-2П «Заря»)[4], ПАЗ (противоатомная защита ) Система РХБ защиты, автоматическая система пожаротушения, улучшенный прицел ТШК-2-66, фильтровентиляционная система, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный дизель В-6Б с водяным охлаждением двигатель мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для которых пришлось немного изменить форму брони."
 DDR_lt_equipment_5: "БРМ-1К"
 DDR_lt_equipment_5_short: "БРМ-1К"
 DDR_lt_equipment_5_desc: "БРМ-1К — советская разведывательная машина конца холодной войны. Он был разработан для поддержки бронетанковых и механизированных соединений советских войск. БРМ-1К предназначалась для разведки маршрутов и обнаружения формирований противника."
 DDR_lt_equipment_6: "БРМ-3K"
 DDR_lt_equipment_6_short: "БРМ-3K"
 DDR_lt_equipment_6_desc: "БРМ-3К «Рысь» была разработана в начале 1990-х годов. Он предназначался для дополнения и замены разведывательной машины БРМ-1К. Базируется на шасси боевой машины пехоты БМП-3. Хотя БРМ-3К была официально принята на вооружение Российской Армии еще в 1995 году, она до сих пор производится небольшими темпами."
  
