 DDR_mechanized_equipment_2: "Sonder-Kfz 1"
 DDR_mechanized_equipment_2_short: "Sonder-Kfz 1"
 DDR_mechanized_equipment_2_desc: "Sonder Kfz-1 и SK-1, также известный как Garant 30k SK-1, был восточногерманской бронированной патрульной машиной, представленной полицией Восточной Германии в 1953 году. Он использовался Kasernierte Volkspolizei (KVP, полиция по охране общественного порядка) и короткое время Национальной народной армией. СК-1 представляет собой шасси грузовика Robur Garant 30K с бронированным корпусом и легкой башней. В задней части корпуса имеется дверь для входа экипажа и люк в верхней части башни. В башне есть несколько смотровых щелей и отверстие для пулемета."
