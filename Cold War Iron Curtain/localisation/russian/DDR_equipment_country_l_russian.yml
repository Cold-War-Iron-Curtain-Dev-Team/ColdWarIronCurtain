 DDR_motorized_equipment_3: "IFA G5KO"
 DDR_motorized_equipment_3_short: "IFA G5KO"
 DDR_motorized_equipment_3_desc: "G5 — трехосный грузовик с задним приводом (6×4) и отключаемым передним приводом (6×6). У него нет центрального дифференциала, а это означает, что включение переднего привода будет передавать разный крутящий момент на переднюю и заднюю оси; нет возможности передавать одинаковый крутящий момент на каждую ось, поэтому система полного привода не подходит для движения по дорогам. Кабина была изготовлена в нескольких различных версиях, таких как закрытая кабина, кабина для экипажа, кабина с откидным верхом и кабина с откидным ветровым стеклом. Серия G5 и серия H6, которые производились в Вердау одновременно, имеют несколько общих компонентов."
 DDR_motorized_equipment_4: "IFA-W50LA"
 DDR_motorized_equipment_4_short: "IFA-W50LA"
 DDR_motorized_equipment_4_desc: "Грузовик IFA W50L, который производится уже 25 лет, стал легендой автопрома ГДР. Эта машина получила распространение не только в ГДР, но и во всех странах бывшего соцлагеря, а также в государствах Азии, Африки и Южной Америки. Одним из основных покупателей автомобилей этой модели был Советский Союз."
