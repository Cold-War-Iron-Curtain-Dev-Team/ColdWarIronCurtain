 DDR_mbt_equipment_7_short: "KPz T-72G"
 DDR_mbt_equipment_7_desc: "Восточногерманский KPz T-72G — модернизированный вариант KPz T-72. Это обозначение использовалось не только для штатного Т-72М, но и для 75 базовых Т-72, которые были модернизированы RWN в 1986 году. Эти танки (Kampfpanzer) были оснащены резиновыми бортовыми экранами, дымовыми гранатометами «Туча» и дополнительными стальными пластинами толщиной 16 мм на верхней лобовой детали."
