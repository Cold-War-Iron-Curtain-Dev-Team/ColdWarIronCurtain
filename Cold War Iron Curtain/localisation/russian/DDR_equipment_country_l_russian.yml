 DDR_fighter_equipment_1: "Messerschmitt Bf 109 B-1"
 DDR_fighter_equipment_1_short: "Messerschmitt Bf 109"
 DDR_fighter_equipment_2: "Focke-Wulf Fw 190"
 DDR_fighter_equipment_2_short: "Fw 190"
 DDR_fighter_equipment_3: "FWD 53B"
 DDR_fighter_equipment_3_short: "FWD 53B"
 DDR_fighter_equipment_3_desc: "Проект получил кодовый номер "53" (по году его начала), а конструктивной основой для не очень нового истребителя для зарождающихся ВВС ГДР были в основном поздние планеры Bf 109G и некоторые Bf 109K, отраженные суффиксом "А" и "В". для экономии веса вооружение FWD-53 было относительно легким. Она состояла из пары тяжелых 12,7-мм пулеметов Березина УБС и одной 23-мм пушки Нудельмана-Суранова НС-23. Эти три орудия были установлены над двигателем, синхронизированные для стрельбы через диск пропеллера."
  
 DDR_jet_multirole_equipment_1: "Ме.262"
 DDR_jet_multirole_equipment_1_desc: "The MiG-9 Fargo was the first Mikoyan designed jet aircraft of the post WW2 era. Introduced in 1948. It saw limited combat and training use during the Chinese Civil War and Korean War. In total 610 aircraft were produced, solely by the USSR. The final MiG 9's were decommissioned by the PRC in 1951."
 DDR_jet_multirole_equipment_1_short: "Ме.262"
 DDR_jet_multirole_equipment_2: "МиГ-15бис"
 DDR_jet_multirole_equipment_2_desc: "МиГ-15бис - Советский реактивный истребитель, разработанный ОКБ Микояна и Гуревича, развитие МиГ-15. В 1946 году моторостроительное ОКБ В. Я. Климова занялось разработкой усовершенствованного варианта двигателя РД-45Ф, который являлся копией британского Нин II. Разработанный Климовым ТРД ВК-1 при практически тех же габаритах и массе что и РД-45Ф, имел на 20% большую тягу. Заводские и государственные испытания двигателя были проведены на четырёх серийных МиГ-15, которые получили заводской шифр «СЛ». В начале 1949 года госиспытания двигателя были завершены, а 14 мая, постановлением Совета Министров СССР № 1887-697 двигатель ВК-1 со 100 часовым ресурсом был запущен в серийное производство."
 DDR_jet_multirole_equipment_2_short: "МиГ-15бис"
 DDR_jet_multirole_equipment_3: "МиГ-17Ф"
 DDR_jet_multirole_equipment_3_desc: "A direct successor to the MiG-15 Fagot. Over 10 000 MiG-17 Fresco were produced from 1952. The MiG-17 was license built in the PLAAF as the Shenyang J-5. In total 20 nations used the MiG-17, spanning Africa, Europe and Asia. Its first combat deployment was in 1958, when PRC MiGs clashed with Nationalist Chinese F-86 Sabres over the Taiwan Strait. However, the MiG-17 primarily saw use in the Vietnam war with the NVAF and PLAAF were it scored 28 aerial victories. The MiG-17 was so successful that it even held its own against the much more modern, supersonic American Phantom II fighters of the Vietnam war. The MiG-17 was generally decommissioned in the 1970's, while it still remains in limited service in some African nations and North Korea."
 DDR_jet_multirole_equipment_3_short: "МиГ-17Ф"
 DDR_jet_multirole_equipment_4: "МиГ-19ПМ"
 DDR_jet_multirole_equipment_4_desc: "МиГ-19ПМ - Советский одноместный реактивный истребитель второго[3] поколения, разработанный ОКБ Микояна и Гуревича в начале 1950-х годов. Первый советский серийный сверхзвуковой истребитель, широко применялся в системе ПВО СССР и поставлялся за рубеж. Ровесник американского истребителя F-100 Super Sabre, хотя во Вьетнаме противостоял и более поздним F-4 Phantom II."
 DDR_jet_multirole_equipment_4_short: "МиГ-19ПМ"
 DDR_jet_multirole_equipment_5: "МиГ-19СФ"
 #DDR_jet_multirole_equipment_5_desc: "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 DDR_jet_multirole_equipment_5_short: "МиГ-19СФ"
 DDR_jet_multirole_equipment_6: "МиГ-21ПФ"
 DDR_jet_multirole_equipment_6_desc: "МиГ-21ПФ"
 DDR_jet_multirole_equipment_6_short: "МиГ-21ПФ"
 DDR_jet_multirole_equipment_7: "МиГ-21бис"
 DDR_jet_multirole_equipment_7_desc: "the MiG-23 was the first Soviet fighter to field a look-down/shoot-down radar and one of the first to be armed with beyond-visual-range missiles. Production started in 1969 and reached large numbers with over 5,000 aircraft built, making it the most produced variable-sweep wing aircraft in history. Today the MiG-23 remains in limited service with some export customers."
 DDR_jet_multirole_equipment_7_short: "МиГ-21бис"
 DDR_jet_multirole_equipment_8: "МиГ-23МФ"
 DDR_jet_multirole_equipment_8_desc: "МиГ-23МФ"
 DDR_jet_multirole_equipment_8_short: "МиГ-23МФ"
 DDR_jet_multirole_equipment_9: "МиГ-23МЛ"
 DDR_jet_multirole_equipment_9_desc: "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 DDR_jet_multirole_equipment_9_short: "МиГ-23МЛ"
 DDR_jet_multirole_equipment_10: "МиГ-29"
 DDR_jet_multirole_equipment_10_desc: "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 DDR_jet_multirole_equipment_10_short: "МиГ-29"
  
