l_english:
 DDR_infantry_equipment_0: "Karabiner 98k"
 DDR_infantry_equipment_0_short: "Kar98k"
 DDR_infantry_equipment_0_desc: "Знаковая винтовка с продольно-скользящим затвором, принятая на вооружение Вермахта в 1935 году в качестве основной винтовки. Это была одна из последних разработок в длинной линейке армейских винтовок \"Маузер\". Хотя во время Второй мировой войны она была дополнена полуавтоматическими и автоматическими видами винтовок, Kar98k оставалась основной немецкой винтовкой вплоть до конца войны. Несмотря на растущее количество полуавтоматических и полностью автоматических винтовок, она продолжает использоваться в странах по обе стороны железного занавеса."
 DDR_infantry_equipment_1: "Mashinenpistole-Kalaschnikow"
 DDR_infantry_equipment_1_short: "MPi-K"
 DDR_infantry_equipment_1_desc: "MPI-AK-47 — восточногерманская лицензионная версия советского автомата АКМ."
 DDR_infantry_equipment_2: "Mashinenpistole-Kalaschnikow mit Stutze"
 DDR_infantry_equipment_2_short: "MPi-KMS-72"
 DDR_infantry_equipment_2_desc: "Ранние версии винтовок имели деревянную фурнитуру, но более поздние модели имеют характерные коричневые приклады и пистолетные рукоятки с пунктирной отделкой. MPi-KMS-72 также имеет складывающийся вбок приклад «вешалки» с одной стойкой, особенность, которая характерна для более поздних румынских винтовок."
 DDR_infantry_equipment_3: "Mashinenpistole-Kalaschnikow AK-74N"
 DDR_infantry_equipment_3_short: "MPi AK-74N"
 DDR_infantry_equipment_3_desc: "В 1981 году ГДР приобрела лицензию на производство АК-74, после чего в оружие было внесено несколько изменений. Новый образец получил индекс MPi AK-74N. Изменения заключались в изготовлении нового приклада и цевья, выполненных из серо-голубого (реже темно-коричневого) пластика. Приклад имел характерную пунктирную структуру. Вариант со складным прикладом получил вариант MPi AKS-74N. Также был разработан автомат MPi AK-74NK с укороченным стволом."
 DDR_infantry_equipment_4: "Wieger StG-940"
 DDR_infantry_equipment_4_short: "StG-940"
 DDR_infantry_equipment_4_desc: "StG-940 - Проект компании Wieger по адаптации Автомата Калашникова, который производился в Восточной Германии по лицензии, под патрон 5,56х45 мм НАТО, с целью уменьшения зависимости от Советского Союза и экспорта в другие страны."
 DDR_iw_armored_vehicles: "Сухопутные войска Национальной народной армии ГДР"
 DDR_iw_armored_vehicles_short: "СВ ННА"
 DDR_iw_armored_vehicles_desc: ""
 DDR_fighter_equipment_0: "Военно-воздушные силы Национальной народной армии ГДР"
 DDR_fighter_equipment_0_short: "ВВС ННА"
 DDR_fighter_equipment_0_desc: "Военно-воздушные силы Национальной народной армии - военно-воздушные силы Восточной Германии. Как и Сухопутные Войска, Фольксмарине, Пограничные войска, являлись видом войск в Национальной народной армии (ННА)."
 DDR_lt_equipment_1: "T-60"
 DDR_lt_equipment_1_short: "T-60"
 DDR_lt_equipment_1_desc: "Т-60 - легкий танк, созданный для замены Т-38 в роли танка-разведчика. Разработан в 1941 году Николаем Астровым. За 2 года производства было выпущено 6300 единиц. Танк имел конструкцию с двумя членами экипажа, 6-цилиндровым двигателем, 20-мм пушкой и развивал скорость до 44 км / ч. Широко использовался во время Второй мировой войны."
 DDR_lt_equipment_2: "T-70"
 DDR_lt_equipment_2_short: "T-70"
 DDR_lt_equipment_2_desc: "Легкий танк Т-70 - танк-разведчик времен Второй мировой войны, созданный для замены Т-60. Николай Астров начал работать над ним сразу после Т-60 и закончил разработку в 1942 году. За 2 года его производства было выпущено 8300 единиц. Танк имел более мощную 45-мм пушку, 2 двигателя ГАЗ-202, номинально улучшенные оптические возможности и мог развивать скорость до 45 км/ч. Широко использовался во время Второй мировой войны."
 DDR_lt_equipment_3: "ПT-76"
 DDR_lt_equipment_3_short: "ПT-76"
 DDR_lt_equipment_3_desc: "ПТ-76 — советский легкий плавающий танк, который активно экспортировался СССР. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 г., всего было выпущено около 12 000 единиц. Экипаж - 3 человека. Он был экспортирован в различные страны советской сферы влияния и поэтому выполнял роль разведки практически во всех конфликтах мира. Он до сих пор используется во многих странах благодаря своей знаменитой надежности и простоте обслуживания."
 DDR_lt_equipment_4: "ПТ-76Б"
 DDR_lt_equipment_4_short: "ПТ-76Б"
 DDR_lt_equipment_4_desc: "ПТ-76Б стал глубокой модернизацией ПТ-76. Новую модель оснастили системой химической и радиационной защиты, улучшенным орудием с двухлопастным стабилизатором, более совершенной оптикой и приборами наблюдения. Новый 6-ти цилиндровый двигатель мощностью в 263 л.с. значительно улучшил мобильность машины."
 DDR_lt_equipment_5: "БРМ-1К"
 DDR_lt_equipment_5_short: "БРМ-1К"
 DDR_lt_equipment_5_desc: "БРМ-1К — бронированная самоходная машина времен конца холодной войны, предназначенная для разведки на поле боя. Она был разработана для поддержки бронетанковых и механизированных соединений советских войск. БРМ-1К предназначалась для разведки маршрутов и обнаружения боевых формирований противника."
 DDR_lt_equipment_6: "БРМ-3K"
 DDR_lt_equipment_6_short: "БРМ-3K"
 DDR_lt_equipment_6_desc: "БРМ-3К «Рысь» была разработана в начале 1990-х годов. Она предназначалась в качестве дополнения и замены разведывательной машины БРМ-1К. Базируется на шасси БМП-3. Хотя БРМ-3К была официально принята на вооружение ВС РФ еще в 1995 году, темпы производства до сих пор остаются сравнительно малыми."
