 manpats_1: "Переносные противотанковые комплексы I"
 manpats_1_short: "ППК I"
 manpats_1_desc: "A basic man-portable anti-tank weapons for use by infantry units. In western service often known as a bazooka."
 manpats_2: "Переносные противотанковые комплексы II"
 manpats_2_short: "ППК II"
 manpats_2_desc: "With updates in armor thickness, shoulder fired man-portable anti-tank systems require improved warheads in order to be effective."
 manpats_3: "Переносные противотанковые комплексы III"
 manpats_3_short: "ППК III"
 manpats_3_desc: "Additional updates in armor penetration technology and reduced weight allow man-portable anti-tank systems of this generation to be even more effective."
 manpats_4: "Переносные противотанковые комплексы IV"
 manpats_4_short: "ППК IV"
 manpats_4_desc: "An improved generation of light anti-tank weapons allow an infantry unit to become a powerfull foe to any opposing armor."
 manpats_5: "Переносные противотанковые комплексы V"
 manpats_5_short: "ППК V"
 manpats_5_desc: "Modern day light-weight anti-tank launchers with capable penetrating power can prove extremely lethal on a battlefield."
 infantry_manpats_tt: "§CРазблокирует решение о использовании ППК для увеличения противотанковых возможностей пехоты и пехотных машин.§!"
 hmg_1: "Тяжелый пулемет ПВО"
 hmg_1_short: "Тяжелый пулемет ПВО"
 hmg_1_desc: "Heavy machine guns can help an infantry unit to defend itself from air attack without the need to bring seperate specialized anti-aircraft units."
 manpads_1: "Переносные зенитно-ракетные комплексы I"
 manpads_1_short: "ПЗРК I"
 manpads_1_desc: "The first generation of portable manpads. They lack accuracy in the field but when they do manage to connect with an enemy aircraft the results can be spectacular."
 manpads_2: "Переносные зенитно-ракетные комплексы II"
 manpads_2_short: "ПЗРК II"
 manpads_2_desc: "Second generation man portable anti-aircraft systems designed to use infrared to home onto a target. Helicopters and low-flying aircraft beware."
 manpads_3: " Переносные зенитно-ракетные комплексы III"
 manpads_3_short: "ПЗРК III"
 manpads_3_desc: "Advanced man-portable anti-aircraft systems with a high certainty of hitting a target."
 manpads_4: "Переносные зенитно-ракетные комплексы IV"
 manpads_4_short: "ПЗРК IV"
 manpads_4_desc: "Modern Man-portable air-defense systems with capable infrared tracking and advanced missiles."
 infantry_manpads_tt: "§CРазблокирует решение о использовании ПЗРК для увеличения противовоздушных возможностей пехоты.§!"
 protection_equip_1: "Средства индивидуальной защиты I"
 protection_equip_1_short: "Защита I"
 protection_equip_1_desc: "First generation helmets to defend against shrapnel injuries."
 protection_equip_2: "Средства индивидуальной защиты II"
 protection_equip_2_short: "Защита II"
 protection_equip_2_desc: "Second generation protection with greater strenght to also protect against small arms fire."
 protection_equip_3: "Средства индивидуальной защиты III"
 protection_equip_3_short: "Защита III"
 protection_equip_3_desc: "Third generation helmet protection and bullet proof vests to protect against impacts of small arms or explosives."
 protection_equip_4: "Средства индивидуальной защиты IV"
 protection_equip_4_short: "Защита IV"
 protection_equip_4_desc: "Fourth generation helmet protection and bullet proof vests to protect against shrapnel and blast energy."
 protection_equip_5: "Средства индивидуальной защиты V"
 protection_equip_5_short: "Защита V"
 protection_equip_5_desc: "Modern day protection equipment to protect soldiers against blast, shrapnel and small arms increases survivability of the Individual."
 infantry_protection_tt: "§CРазблокирует решение о использовании пехотного снаряжения, брони и униформы для повышения выживаемости пехоты.§!"