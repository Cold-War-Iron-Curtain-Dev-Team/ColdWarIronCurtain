l_english:
 Operation_Searchlight.1.d: "В настоящее время Генеральный штаб в Равалпинди рассматривает вопрос о том, как спланировать решение проблемы безопасности в нынешнем политическом тупике. Один из самых больших вопросов, который необходимо рассмотреть - что делать с бенгальскими солдатами, особенно с военнослужащими Восточно-Бенгальских стрелков. Если мы должны начать операцию по обеспечению безопасности ради спасения страны, бенгальские солдаты могут оказаться ненадежными для выполнения своих задач. В основном, опасения вызывают лазутчики. Восточное командование считает, что они могут разработать план по разоружению и задержанию этих солдат до разрешения кризиса. Однако в Генеральном штабе есть те, кто утверждает, что бенгальские солдаты хорошо обучены и идеологически преданы Пакистану. Они утверждают, что мы должны использовать эти силы в рамках операции по охране границы и не продвигать идею антибенгальской операции."
 Operation_Searchlight.2.d: "В настоящее время Генеральный штаб в Равалпинди рассматривает вопрос о том, как спланировать план обеспечения безопасности для выхода из нынешнего политического тупика. Один из самых больших вопросов - как ликвидировать «Авами Лиг» и их сторонников. В тесном сотрудничестве с Восточным командованием и разведывательными службами составляется список их главных членов. Их передвижения и местонахождение также отслеживаются, поэтому, если начнется операция, наши силы прибудут туда, чтобы арестовать их всех сразу. В идеальном случае такая операция обезглавит руководство антигосударственных злоумышленников"
 Operation_Searchlight.3.d: "Стало ясно, что шейх Муджибур Рахман и Зульфикар Бхутто неспособны к примирению. Из своих последних бесед с обоими мужчинами президент Яхья сделал вывод, что ситуация не поддается исправлению. Очевидно, что Рахман соберет Национальное собрание без бойкотирующих депутатов из Западного Пакистана и примет «Шесть Пунктов» или начнет вооруженное восстание. В своей недавней речи он призвал бенгальцев начать кампанию гражданского неповиновения за свободу и превратить каждый дом в крепость. Совершенно очевидно, что необходимо принимать меры. Перед тем как президент Яхья покинул Дакку, он в частном порядке проинформировал Восточное командование о начале операции «Прожектор», чтобы остановить этот марш к анархии и гражданской войне. Как только президент покинул город, пакистанские войска по всему Восточному Пакистану начали одновременную операцию, чтобы покончить с угрозой целостности Пакистана со стороны «Авами Лиг»."
 Operation_Searchlight.4.d: "Университет Дакки давно стал рассадником молодежного сопротивления и антигосударственной идеологии. В последние дни студенты были замечены прессой за проведением военных учений на территории университета. Преподаватели в основном поддерживают такую воинственность, и охрана кампуса и его обыск на предмет оружия были одной из главных задач в первую ночь операции «Прожектор». Пока другие подразделения обеспечивали безопасность Дакки, 22-й белуджский и 32-й пенджабский отряды получили задание захватить кампус. Операция прошла успешно, старшие преподаватели были быстро задержаны, но попытка захватить руководителей в общежитиях привела к вооруженному сопротивлению со стороны студентов. Наши силы дали достойный ответ, легко подавив сопротивление и взяв кампус под контроль. По первоначальным данным, было нейтрализовано не менее сотни злоумышленников и захвачено оружие. Кампус находится в безопасности."
 Operation_Searchlight.5.d: "В ходе операции «Прожектор» наши силы успешно обеспечили безопасность университета Дакки, задержав опасных боевиков, нейтрализовав вооруженных злоумышленников и захватив оборудование для подготовки боевиков. Тем не менее, мы столкнулись с серьезной реакцией со стороны местных жителей и международной прессы. СМИ сообщают, что наши силы вели беспорядочный огонь, убив или казнив не менее сотни студентов и преподавателей. Особенно осуждаются кадры использования танков для проникновения в общежития. Независимо от этой реакции, силы действовали в соответствии с приказом использовать любые средства, необходимые для быстрого подавления повстанческого движения, развивающегося в университетском городке."
 Operation_Searchlight.6.d: "Когда началась операция «Прожектор», мы развернули батальоны по всей Дакке, чтобы обеспечить безопасность города. По всему Восточному Пакистану действовали другие подразделения, одним из приоритетов которых был захват высокопоставленных лидеров «Авами Лиг», чтобы обезглавить потенциальное сопротивление. Эта операция в целом была успешной. Хотя в первые часы мы захватили несколько высокопоставленных чиновников, похоже, что чиновники более низкого уровня смогли узнать об операции и скрылись. Мы полагаем, что некоторые из них уже находятся на пути в Индию или скрываются в сельской местности, несомненно, координируя действия боевиков против государства. Независимо от этого, наши офицеры уверены, что в результате арестов «Авами Лиг» была полностью уничтожена."
 Operation_Searchlight.7.d: "Шейх Муджибур Рахман, лидер «Авами Лиг» и организатор заговора с целью уничтожения Пакистана, был арестован в своем доме взводом солдат спецназа. Наши силы действовали быстро, не встретили сопротивления и взяли Рахмана без происшествий. Его уже посадили на самолет, направляющийся в Западный Пакистан, где он предстанет перед судом за свой антигосударственный заговор. По первым сообщениям, Рахман шокирован таким поворотом событий и просит о встрече с президентом Яхья Ханом для разрешения кризиса. Он утверждает, что поддерживает военные действия, чтобы защитить Пакистан от гражданской войны, но настаивает, что не участвует ни в каком заговоре. Очевидно, что это уловка, призванная завоевать симпатию и, возможно, организовать его побег, независимо от этого, с ним разберутся, когда он доберется до своей тюрьмы в Лайяллпуре."
 Operation_Searchlight.8.d: "В рамках операции «Прожектор» западнопакистанские офицеры и солдаты в батальонах Восточно-Бенгальских стрелковых войск начали разоружать своих бенгальских офицеров и солдат. Эта часть операции оказалась безуспешной. В некоторых случаях нашим людям удавалось разоружить бенгальцев, и они возвращались в свои казармы. В некоторых случаях бенгальские солдаты отказывались разоружаться и оказывали сопротивление, что приводило к их уничтожению нашими силами. Однако в некоторых случаях, особенно в случае со 2-ыми Восточно-Бенгальскими стрелками, бенгальцы действовали первыми и расправились с нашими людьми до того, как разоружение было проведено. Нам пришлось послать бригаду для восстановления порядка, обнаружив жуткие сцены того, как они расправились с нашими людьми. Когда новости об эскалации насилия достигли казарм, многие бенгальцы, мирно сдавшиеся в плен, запаниковали и убежали в джунгли. Восточно-Бенгальские стрелки были нейтрализованы, но многие из высококвалифицированных солдат и офицеров сбежали в джунгли."
 Operation_Searchlight.9.d: "Во время операции «Прожектор» Восточное командование развернуло свои силы по всей провинции для обеспечения своих целей. Однако шесть батальонов Восточно-Бенгальских стрелков были уникальными подразделениями, поскольку в них служили в основном бенгальские солдаты. Чтобы снизить риск их восстания, они были развернуты в основном для охраны стратегических объектов за пределами крупных городов или ключевых пограничных районов. Это снижало риск того, что солдаты могут открыть огонь по своим собратьям-бенгальцам. До сих пор Восточно-Бенгальские стрелки прекрасно выполняли свои задачи, однако, когда распространились новости о насилии, имевшем место во время операции «Прожектор», небольшое количество солдат и офицеров покинуло свои части. Эти люди, несомненно, будут стремиться присоединиться к антигосударственным злоумышленникам, но в целом Восточно-Бенгальские стрелки выполняют свой долг как верные слуги Пакистана."
 Operation_Searchlight.10.d: "В первые часы операции «Прожектор» пакистанские военные стремились нейтрализовать потенциальные очаги бенгальского сопротивления и арестовать возможных лидеров такого восстания. На начальном этапе наши силы столкнулись с плохо вооруженными и обученными студентами, а также с некоторым вооруженным сопротивлением со стороны членов «Авами Лиг». Они оказались не в состоянии противостоять нашим силам, но бежали либо в Индию, либо глубже в джунгли. К сожалению, ряду руководителей среднего и высшего звена «Авами Лиг» и их союзникам удалось бежать в Индию. Кроме того, ряд бенгальских солдат и офицеров в армии покинули свои посты и присоединились к растущему движению сопротивления. Эти люди, а также местные бенгальцы, соблазненные вражеской пропагандой, формируют партизанские отряды. Они уже пользуются поддержкой бенгальцев, которые называют этих бойцов «Мукти Бахини», что означает Борцы за Свободу"
 Operation_Searchlight.11.d: "Неспособность эффективно разоружить батальоны Восточно-Бенгальских стрелков или военизированные батальоны Восточно-Пакистанских стрелков привела к ожесточенным боям и резне с обеих сторон. Однако многим солдатам и офицерам бенгальских повстанцев удалось ускользнуть, и они нашли дорогу в Индию или присоединились к бандам «Мукти Бахини», формирующимся глубоко в джунглях. Офицеры-предатели работают с лидерами «Авами Лиг» в Индии, чтобы лучше координировать действия «Мукти Бахини» и создавать тренировочные лагеря. К нашей головной боли, наш враг получит нашу подготовку и бывших солдат, что повысит их оперативную эффективность."
 Operation_Searchlight.12.d: "В ходе операции «Прожектор» были предприняты большие усилия для размещения бенгальских офицеров и подразделений на позициях и в районах, где им не пришлось бы непосредственно участвовать в боевых действиях. Это было сделано для того, чтобы предотвратить попытки спровоцировать мятеж в рядах антигосударственной «Авами Лиг» и их заблуждающихся сторонников. Эти подразделения действовали великолепно и в целом выполняли свои приказы. Однако в последующие дни они услышали сообщения о якобы имевших место массовых убийствах и насилии, в значительной степени это была вражеская пропаганда, но, несмотря на это, она возымела действие. Несколько бенгальских офицеров дезертировали, чтобы присоединиться к бандам «Мукти Бахини» или «Авами Лиг» в Индии. Некоторые солдаты тоже дезертировали, но это лишь незначительная часть. На данный момент мы можем ожидать большего количества дезертиров, но мы передислоцировали наши силы до такой степени, что в Восточном Пакистане нет подразделений с бенгальским большинством, поэтому восстание маловероятно"
 Operation_Searchlight.13.d: "Поскольку наши силы в Восточном Пакистане сталкиваются с растущим вооруженным сопротивлением и гражданским неповиновением, правительство уполномочило Восточное командование расширить суды военного времени. Это позволит властям на местах быстро доставлять подозреваемых боевиков или антигосударственных злоумышленников в суды, где может быть вынесен быстрый приговор. Гражданские суды слишком медлительны и не имеют опыта в рассмотрении подобных дел. Что еще более важно, это позволит нам быстрее проводить судебные процессы над многими бенгальцами, которые в настоящее время сидят в лагерях для задержанных. К сожалению, эти лагеря переполнены, условия в них ужасные, боевики имеют возможность манипулировать своим выходом и вызывают отчуждение у семей задержанных. Новые правила военного положения укрепят нашу способность выкорчевывать злоумышленников."
 Operation_Searchlight.14.d: "Восточное командование всегда жаловалось на нехватку военных подразделений, но с этим ничего не поделаешь, поскольку доступ в Восточный Пакистан затруднен, а в Западном Пакистане есть потребности в обеспечении безопасности. Это приводит к тому, что наши силы оказываются в опасной ситуации, поскольку им приходится бороться с «Мукти Бахини», нарушением правопорядка, а также с протяженной границей с Индией. Эти проблемы усугубляют бенгальские элементы в армии и полиции, которые либо дезертировали, либо являются ненадежными. Существует отчаянная необходимость в создании дополнительных вспомогательных сил для оказания помощи военным в их кампании против «Мукти Бахини». К счастью, ведущие религиозные партии Восточного Пакистана лояльны, и они призвали своих сторонников присоединиться к нашему делу. С этим притоком людей мы создали силы моджахедов, это пропакистанские бенгальцы и бихарцы, готовые выполнять вспомогательные функции, которые освободят наши силы для проведения военных операций."
 Operation_Searchlight.15.d: "В ходе операции «Прожектор» ситуация в Восточном Пакистане превратилась фактически в гражданскую войну, а пакистанские военные начали кампанию против «Мукти Бахини», выступающих за независимость Бангладеш. Среди населения Восточного Пакистана возникли новые разногласия, хотя «Мукти Бахини» пользуется поддержкой среди широких слоев бенгальцев, религиозные мусульманские партии и их сторонники поддерживают пакистанское правительство. Кроме того, большое количество бихарцев, беженцев, прибывших из Индии во время раздела, также в основном лояльны Пакистану. Это привело к появлению сообщений о жестоких расправах, проводимых лояльными Пакистану общинами и самой пакистанской армией. Правительство Пакистана отвергает такие заявления, но есть убедительные свидетельства того, что бенгальские индусы подвергаются нападениям со стороны мусульманских соседей, а правительство отказывается вмешиваться. Эти предполагаемые массовые убийства бенгальцев, подкрепленные интервью и некоторыми фотографиями, наносят урон правительству Пакистана, которое, по меньшей мере, выглядит соучастником, не остановившим эти события."
 Operation_Searchlight.16.d: "Бихари - это собирательный термин, используемый для обозначения мусульманских беженцев из Индии, которые переехали в Восточный Пакистан во время раздела. Эти семьи в основном покинули дома и общины своих предков, чтобы начать новую жизнь в Пакистане. Они отвергают независимую Бангладеш и в основном остались верны пакистанскому государству и его кампании против «Мукти Бахини». После начала операции «Прожектор» Восточный Пакистан погрузился в хаос, поскольку кампания пакистанских военных против «Мукти Бахини» омрачается сообщениями об этнических убийствах, происходящих на всей территории страны. Хотя международная пресса в основном освещает предполагаемые массовые убийства бенгальцев, она до сих пор избегала сообщений о массовых убийствах бихарцев со стороны «Мукти Бахини» или их бенгальских соседей. Недавно пакистанская армия обнародовала несколько предполагаемых мест массовых убийств, и репортеры взяли интервью у выживших, которые в настоящее время находятся под охраной в местах расквартирования пакистанской армии. Для многих очевидно, что боевые действия в Восточном Пакистане происходят на разных уровнях, что приводит к массовым страданиям."
 Operation_Searchlight.17.d: "Восточное командование в Дакке продолжает бороться с огромным количеством проблем, с которыми сталкиваются его войска в плане борьбы с повстанцами, охраны индийской границы и управления провинцией, среди многих других. Местные органы власти и бюрократия практически не функционируют, так как многие бежали к повстанцам или отказываются служить, опасаясь возмездия. Однако Пакистан может рассчитывать на бихарцев и многих более религиозных бенгальцев, которые остаются приверженцами идеологии Пакистана. Кроме того, создаются новые вспомогательные силы для улучшения базового правопорядка и обеспечения безопасности государственных служащих. После конференции с государственными служащими было решено, что лояльные пакистанцы будут назначены на ключевые должности и наделены широкими полномочиями, включая контроль над местными поднятыми лояльными ополченцами, чтобы обеспечить продолжение управления в Восточном Пакистане. Некоторые опасаются, что такой шаг может разжечь коррупцию или насильственное возмездие, однако у нас нет выбора, и мы должны восстановить управление любыми средствами."
 Operation_Searchlight.18.d: "Недавно международные СМИ обратили внимание на то, что из миллионов бенгальцев, бежавших из Восточного Пакистана в Индию, большое число составляют представители индуистского меньшинства. Эти беженцы рассказывают о жестокости и насилии, в основном от рук соседей, а в некоторых случаях и от подразделений пакистанской армии. Индийское правительство называет растущую ситуацию с беженцами глобальным кризисом и осуждает правительство Пакистана за кампанию крайней жестокости по отношению к собственному народу. Представитель Народной лиги заявил журналистам, что беженцы и их истории являются доказательством систематической кампании геноцида бенгальского народа. Правительство Пакистана решительно отвергает эти обвинения, оно настаивает на том, что его силы не нападают на мирных жителей, отмечая, что СМИ игнорируют акты насилия и расправы, которые проводит «Мукти Бахини» над мирными жителями, выступающими за Пакистан. На международном уровне многие ведущие артисты, музыканты и политики призывают Пакистан прекратить то, что они считают кампанией бессмысленного насилия."
 Operation_Searchlight.19.d: "Число беженцев, хлынувших в Бенгалию, исчисляется миллионами, а по некоторым прогнозам, их число может достигнуть десяти миллионов. Эти беженцы спасаются от насилия, охватившего Восточный Пакистан, где «Мукти Бахини» продолжают борьбу за независимость от правительства Пакистана. Вдобавок к этому конфликту происходят жестокие столкновения между бенгальцами, выступающими за независимость, и бенгальцами и бихарцами, выступающими за Пакистан. Наше правительство продолжает освещать зверства пакистанцев и обещает поддержку беженцам. Однако их количество создает серьезную нагрузку на наши ресурсы, и поступают сообщения о столкновениях между недовольными беженцами и местными жителями. Некоторые официальные лица предполагают, что Пакистан способствует движению беженцев, особенно индуистских, чтобы избавиться от нелояльных, по его мнению, элементов в провинции. Мы должны внимательно следить за ситуацией, чтобы выработать ответные меры для прекращения потока беженцев и насилия."
 Operation_Searchlight.20.d: "Ситуация в Восточном Пакистане становится все более невыносимой, в частности, ясно, что Индия планирует использовать кризис в своих интересах. Чем больше времени проходит, тем больше у Индии времени, чтобы уничтожить нас в свое удовольствие. Мы всегда утверждали, что защита востока лежит на западе, возможно, сейчас самое время применить эту доктрину на практике. ВВС Пакистана предложили план внезапного нападения на авиабазы вдоль всей границы с Индией и вывести из строя их воздушную мощь еще до того, как будет произведен первый выстрел. Как только индийские ВВС будут нейтрализованы, наши собственные силы смогут одержать победу благодаря превосходству в воздухе. Хотя президенту Яхья Хану и его близким союзникам, похоже, нравится этот план, некоторые офицеры выразили сомнения в том, что такая операция сможет достичь поставленных целей. Решение должно быть принято."
 Operation_Searchlight.21.d: "Правительство и народ Индии были ошеломлены, услышав сообщения о пакистанских бомбардировщиках, нацеленных почти на дюжину аэродромов на западной границе. К счастью, многие истребители находились в своих укрепленных подвесах, что свело к минимуму ущерб от пакистанских самолетов. Правительство Пакистана опубликовало заявление, в котором призвало свой народ объединиться против индийской агрессии. Для нашего правительства этот удар означает начало войны и дает нам международную легитимность для решительных действий в отношении пакистанских военных, особенно в Восточном Пакистане."
 Operation_Searchlight.22.d: "ВВС Пакистана провели световую атаку на индийские аэродромы, надеясь вывести из строя их самолеты в предстоящей войне. Однако, первые отчеты не очень хорошие. Хотя наши самолеты выполнили поставленные перед ними задачи и действовали великолепно, их бомбы не оказали большого влияния на аэродромы и индийские самолеты. Уже сейчас взлетно-посадочные полосы, поврежденные бомбами, быстро восстанавливаются. Похоже, что индийские самолеты были защищены, и мы не использовали подавляющее число самолетов, что могло бы дать больший эффект. Независимо от этого, наши самолеты готовы к операциям, и мы должны готовиться к войне!"
 Operation_Searchlight.23.d: "В шокирующих новостях из Южной Азии, истребители из Пакистана нанесли удары по основным индийским аэродромам, некоторые из них проникли на глубину до 400 километров вглубь Индии. Хотя правительство Пакистана утверждает, что не понесло никаких потерь и нанесло большой ущерб, индийское правительство отрицает это сообщение. Удары вдоль западной границы удивили аналитиков, которые считали, что это действия Индии вдоль границы с Восточным Пакистаном, а не пакистанская атака. Напряженность усилилась после того, как пакистанские военные операции против повстанцев «Мукти Бахини», борющихся за независимость бенгальцев в Восточном Пакистане, усилились, что привело к бегству миллионов беженцев в Индию. Индийское правительство утверждает, что Пакистан проводит кампанию бессмысленной жестокости против бенгальцев, просто требующих свободы. Пакистанцы же утверждают, что Индия разжигает конфликт и наращивает свои военные силы, провоцируя Пакистан на действия. Независимо от этого, похоже, начался полномасштабный военный конфликт."
 BAN_Liberation_War.1.d: "Ситуация в Восточном Пакистане нетерпима, индийские военные при поддержке правительства и народа готовы сделать все необходимое, чтобы остановить правительство Пакистана. Международные СМИ и общественность поддерживают наше правительство, многие осуждают жестокое насилие, происходящее в Восточном Пакистане. Однако кабинет министров должен принять решение о целях наших войск и правительства. Многие утверждают, что целью войны должно быть исключительно освобождение Бангладеш и расширение прав бенгальцев в Восточном Пакистане. Другие утверждают, что мы должны также добавить цели вдоль наших западных границ и использовать эту возможность для решения проблемы Кашмира. Если мы пойдем на эту цель, мы рискуем потерять международное превосходство и рискуем вовлечением Китая или Соединенных Штатов."
 BAN_Liberation_War.2.d: "На недавней встрече высокопоставленных и военных руководителей было решено рассмотреть вопрос о расширении целей текущего конфликта, включив в него освобождение Кашмира от пакистанской оккупации. Премьер-министр недавно завершил переговоры с высокопоставленными дипломатическими и военными чиновниками о расширении конфликта за счет включения в него целей Кашмира. Дипломаты были убеждены, что сохранение цели, сосредоточенной на освобождении Восточного Пакистана и обеспечении прав бенгальцев, обеспечит международную поддержку и сохранит моральное превосходство. Хотя Кашмир может показаться созревшим для нашего вмешательства, включение его в текущий конфликт подорвет международную поддержку и может обеспечить Пакистану новые каналы поддержки. Военные лидеры заявили, что они поддержат любые директивы правительства, добавив, что хотя кампания в Восточном Пакистане является главным приоритетом, индийские вооруженные силы более чем способны добавить Кашмир в качестве цели."
 BAN_Liberation_War.3.d: "Наши дипломатические источники и анализ последних заявлений индийского правительства указывают на то, что оно может стремиться превратить недавний конфликт в Восточном Пакистане в трамплин для захвата территорий в Кашмире и переломить нынешний статус-кво. Если Индии удастся укрепить и серьезно ослабить Пакистан путем захвата Кашмира, а также обеспечения независимости Восточного Пакистана, это может привести к стратегическому дисбалансу в Южной Азии. У Индии не будет соперника, способного сдержать ее гегемонию, а наши собственные позиции в регионе будут серьезно ослаблены. Исходя из этих соображений, мы направляем частное послание индийскому правительству с требованием заверить его, что Индия не будет стремиться к одностороннему решению спора о Кашмире с помощью применения физической силы, как она ведет войну против Пакистана"
 BAN_Liberation_War.4.d: "Старшие аналитики из ЦРУ и Госдепартамента предоставили отчеты, которые указывают на то, что индийское правительство может использовать текущую войну с Пакистаном как средство для захвата Кашмира. Такие действия не представляются оправданными, учитывая, что конфликт происходит из-за восстания бенгальцев в Восточном Пакистане. Что еще более важно, это положит конец статус-кво в Кашмире и приведет к долгосрочным проблемам для региона. Учитывая это, на президента оказывают давление, чтобы он проинформировал индийского премьер-министра о нашей озабоченности и попросил конкретного заявления о том, что захват территорий в контролируемом Пакистаном Кашмире не является частью плана. Другие советники отмечают неудачи пакистанцев в решении проблемы Восточного Пакистана и их нынешнюю непопулярность у международного сообщества и призывают нас оставить ситуацию и посмотреть, как она будет развиваться."
 BAN_Liberation_War.5.d: "Китайское правительство уже сделало несколько враждебных заявлений, осуждающих наши действия в Восточном Пакистане. Однако недавно мы получили частное сообщение, в котором китайцы недвусмысленно заявили, что если мы попытаемся вытеснить Пакистан из Кашмира, Китай будет рассматривать это как нападение на их собственную территорию. Возможно, это грозное заявление - блеф, но высшее военное командование утверждает, что ведение войны на обоих флангах Пакистана и борьба с китайским вторжением могут привести к опасному истощению вооруженных сил. Исходя из этих соображений, мы направили Китаю ноту, в которой настаивали, что у нас нет намерений менять территориальные позиции в Кашмире. Премьер-министр также приказал военным прекратить планы по окончательному освобождению Кашмира и сосредоточить все внимание на освобождении Бангладеш."
 BAN_Liberation_War.6.d: "Премьер-министр получил телефонный звонок от президента Соединенных Штатов. Президент попросил проинформировать его о наших намерениях. Премьер-министр сообщил президенту, что Индия несколько месяцев спокойно ждала, когда Пакистан прекратит свою жестокую кампанию в Восточном Пакистане или когда международное сообщество вмешается. Однако растущий кризис беженцев, экономическое истощение и опасения геноцида заставили Индию действовать. Президент заявил, что ценит точку зрения индийского правительства, и отметил, что Соединенные Штаты могут оценить ухудшение ситуации в Восточном Пакистане и участие Индии. Однако он отметил свою озабоченность по поводу военных действий в Кашмире и заявил, что Соединенные Штаты будут рассматривать любые военные попытки Индии расширить территорию в Кашмире как вопиющий акт агрессии и заставят правительство рассмотреть возможные варианты. Премьер-министр просто выразил удовлетворение американской точкой зрения и завершил разговор. Позже военно-морские силы проинформировали премьер-министра о военно-морских маневрах США вблизи Индийского океана. Не желая потерять международную поддержку или помочь Пакистану привлечь вмешательство сверхдержавы, премьер-министр приказал военным прекратить любое финансирование или проведение операций, направленных на вытеснение Пакистана из Кашмира."
 BAN_Liberation_War.7.d: "Индийское правительство обратилось в ООН с просьбой о введении перемирия для прекращения текущих боевых действий. Очевидно, они чувствуют, что ничего больше нельзя достичь или получить в военном отношении для них, и готовы закончить войну. Наши собственные силы упорно и храбро сражаются за нацию и ислам. Теперь дело за высшим руководством страны. Наши дипломаты говорят, что если мы хотим попытаться улучшить наши позиции на местах, они могут отложить прекращение огня на десять дней. Однако, если в эти сроки мы не сможем ничего добиться или исправить, мы можем согласиться и начать процесс немедленного прекращения боевых действий."
 BAN_Liberation_War.8.d: "После нашей победы в Бангладеш мы взяли под стражу десятки тысяч пакистанских военных, правительственных чиновников, сотрудников разведки и полиции. Министр внутренних дел и министр обороны планируют разместить этих военнопленных в лагерях по всей Индии. Расселение пленных предотвратит массовые побеги или тайные спасательные операции. Сохранение этих заключенных гарантирует нам сильный козырь в будущих переговорах с Пакистаном. Бангладеш потребовал, чтобы мы передали им пятьсот пакистанских чиновников и офицеров за военные преступления. Однако наше командование настаивает на том, чтобы мы этого не делали, поэтому такой вариант не рассматривается. Некоторые советники предлагают нам вернуть большинство военнопленных, это значительно улучшит отношения с Пакистаном, поможет нам установить новую эру в наших связях и при этом сохранить наш козырь."
 BAN_Liberation_War.9.d: "После нашего освобождения Бангладеш, есть сообщения о бродячих бандах «Мукти Бахини» и других группах бенгальцев, мстящих предполагаемым пакистанским коллаборационистам. Наши собственные силы обеспечили защиту захваченных пакистанских чиновников и военнослужащих, но эти репрессии вызывают много негатива в СМИ. Временное правительство Бангладеш настаивает на том, что будет поддерживать закон и порядок, однако наши военные руководители в Дакке считают, что это неразумное ожидание. Они просят нас уполномочить индийских военных вмешаться и поддерживать закон и порядок до тех пор, пока правительство Бангладеш не будет готово взять бразды правления в свои руки. Мы должны решить, принять эту просьбу, оттолкнув бенгальцев, или оставить ситуацию как есть."
 BAN_Liberation_War.10.d: "На публичной церемонии индийские военные и правительство официально передали суверенитет новой Республике Бангладеш. Бенгальцы по всей Бангладеш приветствовали свою свободу массовыми демонстрациями празднования по всей стране. Бангладешский флаг развевается почти на каждом доме. Некоторые члены делегации были раздражены отсутствием благодарности индийскому правительству, но в целом церемония прошла с огромным успехом. Новое правительство Бангладеш пообещало процветание своему народу, надлежащее восстановление страны и потребовало от Индии выдать предполагаемых пакистанских военных преступников. Несмотря на эту раннюю напряженность, мы надеемся на эру мира и процветания с нашим новым соседом."
 BAN_Liberation_War.11.d: "Лидеры Пакистана прибыли на горную станцию Шимла, чтобы провести переговоры с индийским правительством после завершения последней индо-пакистанской войны. Считается, что пакистанцы находятся в очень слабой переговорной позиции, поскольку они уже потеряли Восточный Пакистан, а Индия занимает явно доминирующее положение. Для Пакистана их целью является возвращение военнопленных и сохранение статус-кво в Кашмире. Единственным пакистанским козырем является шейх Муджибур Рахман, который по-прежнему находится в их плену. Однако международное давление на них растет, чтобы они отпустили его в Бангладеш, что быстро сводит на нет это преимущество. Что касается Индии, то она, как говорят, заинтересована в использовании военнопленных и своей военной победы, чтобы заставить изменить ситуацию в отношении Кашмира и добиться признания Пакистаном Бангладеш."
 BAN_Liberation_War.12.d: "Пакистан на первых переговорах потребовал возвращения своих военнопленных. Пакистанцы ссылаются на Женевскую конвенцию, которая требует немедленной репатриации военнопленных после окончания боевых действий. Мы сообщили пакистанцам, что некоторые из этих военнопленных обвиняются Бангладеш в военных преступлениях, а продолжающийся отказ признать Бангладеш подразумевает, что конфликт не разрешен. Для нас это представляется возможностью оказать давление на Пакистан, чтобы он освободил Шейха Муджибура Рахмана и признал Бангладеш в обмен на репатриацию военнопленных."
 BAN_Liberation_War.13.d: "Индийцы твердо сообщили нам, что репатриация военнопленных может быть осуществлена только в том случае, если наше правительство освободит шейха Муджибура Рахмана и признает Бангладеш. Учитывая давление, которому мы подвергаемся в связи с тем, что Муджибур остается под стражей, у нас нет другого выбора, кроме как согласиться с этим. Однако мы сообщим индийцам, что в принципе согласны с этой просьбой. При положительном ответе мы также призовем Индию восстановить довоенные границы вдоль наших границ на западе. Это включает в себя сохранение статуса Кашмира, каким он был до начала конфликта."
 BAN_Liberation_War.14.d: "Пакистанцы положительно отреагировали на наше предложение, и мы можем ожидать скорого освобождения шейха Муджибура Рахмана. Мы начнем процесс репатриации военнопленных, но будем делать это медленно и только по мере нормализации связей Пакистана с Бангладеш\". Пакистанцы также призвали восстановить довоенные границы и сохранить Кашмир таким, каким он был за час до начала боевых действий. Первоначальные попытки заставить их признать границу Кашмира постоянной и окончательно утвержденной зашли в тупик. Пакистанцы настаивают, что если они согласятся на такой шаг, то возникнет риск либо революции, либо радикального переворота. Наши аналитики согласны с этим, поэтому вместо этого мы будем настаивать на том, чтобы Пакистан согласился на мирное решение проблемы Кашмира как двустороннего вопроса между нами. Это положит конец их настойчивым попыткам привлечь ООН и, по сути, разрешит конфликт в нашу пользу."
 BAN_Liberation_War.15.d: "Индийское правительство сообщило нам, что согласится на возвращение к статус-кво на западной границе только в том случае, если мы согласимся принять Кашмир как двусторонний вопрос. Мы потратили много времени, работая с индийцами над формулировкой этого аспекта в окончательном соглашении. Индийцы приняли версию, которая, на наш взгляд, достаточно расплывчата, чтобы обеспечить нам гибкость в отношениях с Кашмиром и ООН. Однако с этого момента Индия будет настаивать на том, что конфликт является двусторонней проблемой. Некоторые из наших старших юридических советников также отмечают, что если дело дойдет до этого, мы сможем заявить международному сообществу, что этот предстоящий договор был заключен под принуждением и не является обязательным. Учитывая нашу нынешнюю ситуацию, это наилучший подход. Однако в будущем Пакистан восстановит свою славу и покончит с этой несправедливостью."
 BAN_Liberation_War.16.d: "Правительство Пакистана и Индии согласились подписать соглашение о прекращении их недавнего вооруженного конфликта. Обе стороны в принципе согласились на возвращение военнопленных и восстановление довоенных границ на Западе. Хотя формулировки в отношении Бангладеш были расплывчатыми, считается, что Пакистан согласился с тем, что ему придется признать эту страну и освободить Шейха Муджибура Рахмана. Самым большим изменением стало заявление о том, что спор о Кашмире является двусторонним вопросом между двумя государствами. После подписания договора индийское правительство заявило, что это означает, что резолюции ООН больше не рассматриваются в отношении Кашмира. Пакистанцы же заявили, что формулировка просто гласит, что обе стороны будут работать над разрешением конфликта мирным путем, но не исключает роли международного сообщества. Пакистанский народ испытал огромное унижение после подписания договора, но пресса сообщает, что результаты оказались не такими разрушительными, как многие опасались. Индийское правительство уже столкнулось с критикой со стороны оппозиции за то, что оно растратило военную победу на мирные переговоры. Время покажет, каковы будут окончательные результаты."
 BAN_Liberation_War.17.d: "Правительство Пакистана и Индии согласились подписать соглашение о прекращении недавнего вооруженного конфликта. Обе стороны в принципе согласились на возвращение военнопленных и восстановление довоенных границ на Западе. Хотя формулировки в отношении Бангладеш были расплывчатыми, считается, что Пакистан согласился с тем, что ему придется признать эту страну и освободить Шейха Муджибура Рахмана. Самым большим изменением стало заявление о том, что спор о Кашмире является двусторонним вопросом между двумя государствами. После подписания договора индийское правительство заявило, что это означает, что резолюции ООН больше не рассматриваются в отношении Кашмира. Индийское правительство уже подвергается критике со стороны оппозиции за то, что оно растратило военную победу на мирные переговоры. Время покажет, каковы будут окончательные результаты"
 BAN_Liberation_War.18.d: "Миллионы людей в Дакке приветствовали прибытие шейха Муджибура Рахмана, отца Бангладеш. После того, как Пакистан незаконно удерживал его в течение нескольких месяцев, он наконец вернулся на родину. Пакистанские власти освободили его и организовали его поездку в Лондон, где он сел на свой рейс домой. Шейх Муджибур Рахман был полон эмоций, когда выражал свою любовь и гордость за народ Бангладеш, который освободил себя и пережил жестокую военную оккупацию. Он повторил слова правительства, пообещав, что Бангладеш не только восстановится, но и обеспечит всем жертвам пакистанских зверств признание и поддержку со стороны государства. Он также пообещал социализм для народа и новую эру процветания."
 BAN_Liberation_War.19.d: "После долгого, мучительного ожидания для многих семей военнослужащих последние военнопленные пересекли границу Вагах в Лахоре и вернулись в Пакистан. Тысячи граждан приветствовали солдат, когда они пересекали границу, многие воссоединились со своими семьями после долгих лет разлуки. Правительство Пакистана давно жаловалось, что Индия использовала военнопленных в качестве разменной монеты и незаконно удерживала их в нарушение Женевской конвенции. Вернувшиеся военнопленные будут размещены во временных лагерях, где военные проведут с ними инструктаж и решат, кто из них вернется в армию, а кто будет демобилизован. Первые отчеты военнопленных показывают, что, хотя Индия обращалась с ними относительно хорошо, они столкнулись с интенсивной пропагандой, призывающей их отречься от Пакистана и Раздела. Правительство Пакистана заявило о своем удовлетворении и высоко оценило решимость своих солдат не поддаться вражеской пропаганде."
 BAN_Liberation_War.20.d: "Высшие военные руководители выглядели заметно потрясенными, когда они сообщили премьер-министру, что наступление за освобождение Бангладеш провалилось и застопорилось. Премьер-министр, как говорят, также был подавлен, обращаясь к нации с речью о сложившейся ситуации. По всей стране, особенно в Калькутте, уже поступают сообщения о беспорядках и агитации, поскольку в стране царит чувство неверия. Правительство Пакистана уже восхваляет свои силы за успешное предотвращение национального унижения и призывает Индию вывести свои войска. ООН и другие крупные державы также призывают нас вывести свои войска, так как считают, что они отвлекают и препятствуют окончательному разрешению кризиса в Восточном Пакистане. В ближайшие дни правительству и нации придется провести большую работу по осмыслению произошедшего."
 BAN_Liberation_War.21.d: "Серия военных реформ была объявлена индийским правительством после неутешительных результатов недавней войны с Пакистаном. Работая в тесном сотрудничестве с парламентом, индийское правительство раскрыло планы по расширению набора в армию для лучшей мобилизации ресурсов. Премьер-министр в своем собственном заявлении отметил планы выделения средств на временное увеличение военных расходов для укрепления национальной обороны. Индийцы по всей стране выражают разочарование, а иногда и возмущение по поводу фиаско в Восточном Пакистане. Редакционные статьи сетуют на то, что военные все еще укоренены в мышлении колониальной эпохи и не способны привить необходимые навыки, требующиеся для ведения современной войны. Сообщается, что индийские офицеры ездят на работу в гражданской одежде, чтобы избежать публичного смущения и унижения в некоторых районах."
 BAN_Liberation_War.22.d: "Всего через несколько дней после объявления о ряде военных реформ премьер-министр обнародовал имена многих старших военачальников, которые должны быть немедленно отправлены в отставку. Премьер-министр отметил, что эти офицеры либо не справились со своими обязанностями, либо занимают должности, уже не соответствующие новым индийским вооруженным силам. Индийская армия, в частности, подвергается наибольшему числу увольнений, и хотя старшие офицеры выглядят весьма деморализованными, эти действия находят поддержку как среди населения, так и среди младших офицеров. Многие молодые офицеры в частном порядке считают, что старшие командиры не смогли проявить срочность или навязать дисциплину во время конфликта, что привело к задержкам и неудачам. Многие из этих офицеров считают, что неудача была вызвана руководством, а не действиями солдат или пакистанской армии. Сейчас для индийских военных начинается новая эра."
 Yahya_Khan.4.d: "Главнокомандующий Пакистана генерал Яхья Хан заявил, что ситуация стабилизировалась и политическая атмосфера готова к всеобщим выборам, которые состоятся через шесть месяцев. Он заявил, что всем политическим партиям будет разрешено участвовать в выборах и проводить предвыборную кампанию при условии, что они будут вести себя мирно. Он приказал, чтобы вооруженные силы не допустили коррупции или фальсификаций. Эта новость была хорошо воспринята по всей стране, но многие наблюдатели сомневаются, можно ли действительно доверять военным в проведении беспристрастных выборов, которые они обещали."
 Yahya_Khan.5.d: "Миллионы пакистанцев, от холмов Белуджистана до джунглей Бенгалии, пришли голосовать на крупнейших выборах в истории Пакистана. Международные наблюдатели признали голосование гладким, мирным и без признаков вмешательства. Вопреки ожиданиям, пакистанские военные сдержали свое слово обеспечить мирное и справедливое голосование. Ожидается, что окончательные результаты будут объявлены в ближайшее время. Политические аналитики прогнозируют, что «Авами Лиг», возглавляемая Шейхом Муджибуром Рахманом, скорее всего, получит больше всего мест, особенно благодаря своей базе в Восточном Пакистане. Ожидается, что ПНП во главе с Зульфикаром Бхутто получит большинство мест в западном крыле, однако многие считают, что ни одна из сторон не сможет добиться абсолютного большинства. Есть ощущение, что другие региональные партии и религиозные партии также получат ряд мест."
 Yahya_Khan.6.d: "Избирательная комиссия Пакистана опубликовала результаты недавних всеобщих выборов. «Авами Лиг», возглавляемая шейхом Муджибуром Рахманом, получила 160 из 300 мест в Национальной ассамблее. С таким большинством «Авами Лиг» может вносить поправки в конституцию по своему усмотрению. «Авами Лиг» баллотировалась на платформе своей программы «Шесть Пунктов», призывающей к гораздо большей автономии Восточного Пакистана. Для большей части военно-гражданского истеблишмента «Авами Лиг» рассматривается как угроза национальному единству Пакистана, они не ожидали, что партия сможет занять практически все места в Восточном Пакистане. Зульфикар Бхутто захватил большинство мест в Западном Пакистане, но его партия, ПНП, все еще занимает далекое второе место. Президент Яхья Хан сначала поздравил «Авами Лиг», но уже ходят слухи, что высокопоставленные генералы и политики в Западном Пакистане требуют от президента не передавать власть без гарантий шейха Муджибура Рахмана."
 Yahya_Khan.7.d: "В Пакистане царит неопределенность, поскольку Зульфикар Бхутто отказывается присутствовать на Национальном собрании в Дакке. На президента Яхья Хана оказывается огромное давление, чтобы поддержать Бхутто и отказаться от встречи, пока «Авами Лиг» не даст обещание не выполнять «Шесть Пунктов». Однако «Авами Лиг» отмечает, что у нее есть большинство, полученное в результате свободных демократических выборов, и она может провести Национальную ассамблею без поддержки ПНП или других западнопакистанских партий. Шейх Муджибур Рахман в некоторых своих выступлениях осуждал действия Бхутто, заявляя, что он действует против демократии, и предлагал без колебаний провести Национальное собрание и принять «Шесть Пунктов». Яхья Хан в настоящее время находится в Дакке вместе с Бхутто и Рахманом, пытаясь договориться о решении проблемы."
 Mukti_Bahini_Insurgency: "Повстанческое движение «Мукти Бахини»"
 Mukti_Bahini_Insurgency_desc: "Когда пакистанская армия начала операцию «Прожектор», это положило конец любой возможности мирного урегулирования в Восточном Пакистане. Те бенгальские солдаты, которые избежали задержания, смогли связаться с другими диссидентами, включая членов «Авами Лиг». Бенгальское правительство в изгнании сформировалось из бойцов, организованных как «Мукти Бахини». Вскоре они начали операции против оккупационной пакистанской армии. Пакистанское правительство пообещало подавить это восстание, и, похоже, Восточный Пакистан теперь втянут в гражданскую войну."
 Bangladesh_War.1.d: "Индийское правительство объявило, что его силы продвигаются в Восточный Пакистан, чтобы остановить кровопролитие и сохранить жизнь. Индийские военные уже совершают нападения на наши силы. Этот акт агрессии, несомненно, получит достойный ответ со стороны наших сил. Вскоре мы опубликуем заявление, призывающее народ объединиться и защитить родину не только от вторжения, но и от угрозы нашему образу жизни и религии. Индийцы утверждают, что они действуют, потому что ситуация с беженцами достигла критического момента, но мы знаем, что это завершение многомесячного заговора по уничтожению нашей нации, во-первых, через манипулирование средствами массовой информации, во-вторых, через вооружение «Мукти Бахини», наращивание военного потенциала и, наконец, это вторжение. Ради Пакистана мы должны бороться до конца."
 Bangladesh_War.2.d: "Пакистанский посол передал письмо своего президента, призывающее Соединенные Штаты оказать военную поддержку, поскольку они столкнулись с массированным вторжением Индии. Мы давно предупреждали пакистанцев, чтобы они разрешили свой кризис в Восточном Пакистане, но они не хотели или не могли этого сделать. В настоящее время Индия заявляет, что ее единственным интересом является изгнание Пакистана из Восточного Пакистана, что, на наш взгляд, может быть и к лучшему с точки зрения региональной стабильности. Однако агрессия Индии в Западном Пакистане может привести к дестабилизации. В Соединенных Штатах общественность и оппозиция громко осудили Пакистан за его действия по вытеснению повстанцев «Мукти Бахини». Открыто поддерживать Пакистан было бы непопулярно. Несмотря на это, Пакистан был другом на протяжении многих лет и помогает нашим усилиям по взаимодействию с Китаем. Наши варианты - символически развернуть военно-морские силы и сказать Индии не наносить удар по Западному Пакистану, вообще отказаться от участия или тихо предложить несколько самолетов, танков и оружия, чтобы Западный Пакистан не пал."
 Bangladesh_War.3.d: "Соединенные Штаты объявили, что военно-морские силы проведут маневры в Бенгальском заливе. Многие наблюдатели рассматривают это развертывание как сигнал Индии контролировать свои амбиции во время текущей войны, которую она ведет с Пакистаном. Многие редакционные статьи и оппозиционные политики критикуют президента за его действия. Они считают, что правительство чрезмерно поддерживает Пакистан, который обвиняется в жестокой военной кампании в Восточном Пакистане против бенгальцев, борющихся за независимость. Советник президента в частном порядке сообщил журналистам, что Соединенные Штаты не встают на сторону Пакистана, а наоборот, склоняются в его сторону, чтобы предотвратить полное ухудшение баланса сил в Южной Азии."
 Bangladesh_War.4.d: "Недавно премьер-министр провел обстоятельный разговор с американским госсекретарем. Соединенные Штаты выразили обеспокоенность тем, что нынешняя война может привести к распаду Пакистана, что пагубно скажется на регионе. Мы сообщили ему, что нашей целью является окончательное прекращение убийств и гуманитарного кризиса, разрастающегося в Восточном Пакистане. Американцы признали это и заявили, что у них нет претензий к этой цели. Однако они дали понять, что любые попытки расширить рамки конфликта и захватить территорию Западного Пакистана, даже в Кашмире, могут повлечь за собой решительные действия Америки. Такое вопиющее благосклонное отношение к Пакистану очень беспокоит, но ясно, что у нас есть их поддержка в отношении наших целей в отношении Восточного Пакистана."
 Bangladesh_War.5.d: "Посол Соединенных Штатов сообщил нам, что его правительство, хотя и сочувствует тяжелому положению, в котором оказался наш народ, не может принять на себя ответственность за вовлечение в конфликт. Американцы настаивают на том, что лучшая роль для них - быть другом и Пакистана, и Индии. Открытая поддержка одной из сторон в долгосрочной перспективе навредит Пакистану, особенно на международной арене. Это неутешительные новости, очевидно, что американцы считают нас слабыми и обеспокоены внутренней критикой наших действий по борьбе с агрессивными, антипакистанскими элементами в Восточном Пакистане. Мы не можем полагаться на Соединенные Штаты и в будущем должны подумать о том, как выжить без них."
 Bangladesh_War.6.d: "В неожиданной новости нам сообщили, что президент Соединенных Штатов санкционировал немедленную отправку оружия для помощи нашим войскам, которые в настоящее время втянуты в жестокую войну с Индией. Американцы отметили, что они не могут открыто поддержать нас, так как многие американцы винят в нынешней войне действия Пакистана. Кроме того, США не хотят антагонизировать Индию, что позволит ей играть определенную роль в будущих переговорах. Американцы, скорее всего, не будут сами поставлять оружие, а позволят дружественным государствам региона беспрепятственно передавать нам оборудование. Кроме того, американцы пообещали сделать Индии предупреждение, чтобы она не использовала нынешний конфликт как средство для территориальных захватов в Западном Пакистане."
 Bangladesh_War.7.d: "Соединенные Штаты тихо согласились поддержать усилия других региональных держав по передаче американского оборудования вооруженным силам Пакистана в его борьбе с Индией. Соединенные Штаты не вмешивались, чтобы остановить поставки оружия, и в частном порядке сообщили этим странам, что то оборудование, которое они отправили, будет заменено американским правительством. Сегодня было выгружено последнее оружие, и уже есть планы по отправке этого оружия на фронт. Американская помощь невелика, но она будет иметь большое значение в борьбе за выживание нашей нации. Соединенные Штаты доказали свой статус настоящего друга Пакистана."
 Bangladesh_War.8.d: "Недавно одна из национальных газет подробно рассказала о том, как мы одобряли поставки оружия Пакистану со стороны региональных государств во время текущего индо-пакистанского конфликта. В докладе отмечалось, что мы могли бы остановить такие поставки, но вместо этого способствовали им и обещали пополнить запасы стран, отправивших оружие. Доклад вызвал резкое осуждение со стороны индийского и советского правительств. Они обвинили нас в эскалации кризиса и подстегивании наращивания вооружений. Наш посол в Индии получил строгую выволочку от министра иностранных дел Индии. Теперь ясно, что мы поддерживаем пакистанцев, и это нанесет серьезный ущерб отношениям с Индией."
 Bangladesh_War.9.d: "Наш братский друг Пакистан попросил нашей помощи в войне против Индии. Наши собственные аналитики считают, что конфликт возник только потому, что Пакистан не смог решить свои внутренние проблемы, и Индия, скорее всего, воспользуется этим в своих интересах. Наши лучшие советники считают, что ситуация такова, что вмешательство не изменит результатов, а только продлит страдания. У нас остается три варианта: мы можем отправить экстренные поставки оружия Пакистану, а также предупредить Индию. Мы также можем просто послать Индии твердое предупреждение, чтобы она прекратила свои гегемонистские амбиции. И наконец, мы можем выбрать момент, чтобы ничего не говорить и оставить Пакистан справляться с ситуацией самостоятельно. Со временем, как младший брат, они поймут, что наши действия были к лучшему."
 Bangladesh_War.10.d: "Китайское правительство опубликовало резкое заявление, осуждающее нас и выражающее поддержку Пакистану. В заявлении также содержится предупреждение о тяжелых последствиях для нас. Военные также проинформировали кабинет министров о передвижениях китайских войск вдоль границы. Дипломаты из дружественных Китаю государств передали сообщение о том, что для Китая главное беспокойство вызывает то, что мы не стремимся захватить территорию или земли Западного Пакистана. На данный момент не похоже, что Китай вмешается, но мы должны сохранять бдительность в отношении такой возможности. Несмотря на жесткие формулировки, ясно, что Китай не заинтересован в том, чтобы заставить нас отступить в отношении кризиса в Восточном Пакистане."
 Bangladesh_War.11.d: "Наш друг Китай вмешался и предоставил нам столь необходимое военное оборудование. Китайская помощь в настоящее время обрабатывается и будет развернута как можно скорее. Индия - большая страна и мощная угроза, наши военные могут воспользоваться любой поддержкой, которую они могут получить. Хотя прямое вмешательство Китая было бы очень желательно, получение такой поддержки все равно имеет большое значение\". Китайское правительство также опубликовало заявление, в котором пригрозило Индии контролировать свои амбиции и осудило их гнусную кампанию по попытке уничтожить нашу страну."
 Bangladesh_War.12.d: "Китайское правительство отвергло нашу просьбу о поддержке. Они не только отказались предложить какую-либо помощь, но даже отказались предложить дипломатическую поддержку против потенциальных вымогательских требований Индии. Это серьезная неудача для нашего государства и указывает на то, что мы можем оказаться в большей изоляции, чем мы думали. Когда этот кризис закончится, нам, несомненно, придется пересмотреть характер наших отношений с Китаем. Некоторые предлагают отозвать нашего посла в знак протеста, но большинство членов кабинета министров согласны с тем, что эти отношения слишком важны, чтобы позволить этому разрушить добрую волю, которую мы установили за многие годы."
 Bangladesh_War.13.d: "Пакистанцы обратились к ООН с просьбой выступить посредником в прекращении огня в ходе нынешних боевых действий. Очевидно, что они не могут продолжать боевые действия и хотят, чтобы они прекратились. Наши дипломаты говорят, что если мы хотим, они могут задержать ООН еще на десять дней, после чего нам придется согласиться на прекращение огня. Однако, если мы считаем, что наши цели достигнуты, мы можем согласиться на прекращение огня. Наши войска и народ вели тяжелую борьбу, теперь мы должны принять решение о том, когда завершить конфликт."
 Bangladesh_War.14.d: "ООН успешно выступила посредником в прекращении огня между Индией и Пакистаном. В регион быстро направляются силы мониторинга, чтобы убедиться, что ни одна из сторон не нарушает соглашение. Пока что режим прекращения огня держится, поскольку столкновения между обеими сторонами прекратились. Генеральный секретарь приветствовал это решение и выразил надежду, что обе стороны смогут решить свои нерешенные вопросы путем диалога. Как пакистанское, так и индийское правительство выпустили заявления, в которых приветствовали прекращение огня и похвалили свои силы и народ."
 Bangladesh_War.15.d: "ООН сообщила нам, что правительство Индии попросило прекратить огонь в нашем текущем конфликте. Мы можем принять это предложение и немедленно прекратить боевые действия. Это может оказаться лучшим выбором, особенно если мы считаем, что ситуация не может измениться на месте. Однако наши дипломаты утверждают, что при желании мы можем отложить прекращение огня еще на десять дней, после чего нам придется его принять. Если мы почувствуем, что ситуация может быть улучшена с увеличением времени, мы можем воспользоваться этим вариантом. Наши силы и люди вели тяжелую борьбу."
 Bangladesh_War.16.d: "Командующий пакистанским Восточным командованием подписал документ о капитуляции на ипподроме Рамна в Дакке. Он подписал его в присутствии индийского военного командования. После подписания документа все пакистанские войска, все еще действующие в Восточном Пакистане, начали процесс капитуляции перед индийскими войсками. В настоящее время пакистанские гражданские чиновники находятся под стражей. Бенгальское население Дакки и всего Восточного Пакистана с ликованием отреагировало на эту новость. Для многих это означает конец их долгой борьбы за независимость. Новости в Пакистане были приглушенными, но там чувствуется гнев и унижение в связи с таким поворотом событий."
 Bangladesh_War.17.d: "После унизительной потери Восточного Пакистана и возникновения Бангладеш президент Яхья Хан столкнулся с массовыми волнениями среди народа и своего офицерского корпуса. Опасаясь либо гражданского восстания, либо военного переворота, Яхья Хан вместо этого объявил о своей отставке с поста президента Пакистана. Он передал власть Зульфикару Али Бхутто, сделав его одновременно президентом и главным администратором военного положения. Бхутто, возглавляющий самую популярную партию в Пакистане, имеет легитимность среди народа и не беспокоится о реакции военных. В своей вступительной речи Бхутто пообещал восстановить гордость пакистанцев и начать процесс установления демократии и конституции для народа."
 Bangladesh_War.18.d: "Вопреки всему, пакистанские военные и народ выдержали натиск индийского вторжения и повстанческого движения «Мукти Бахини». Во время боев многие группы «Мукти Бахини» предприняли тотальные атаки, что выявило их и привело к уничтожению. Те силы, которые уцелели, бежали к индийским границам. Поскольку Индия не смогла добиться значительных успехов, ее силы уже согласились на возвращение к довоенным границам и условиям. Общая реакция в Западном Пакистане - радость и удивление по поводу успешной обороны. В Индии ощущают унижение и душевные терзания по поводу того, что не смогли завершить кризис в Восточном Пакистане на своих условиях. Однако боевые действия привели к нарушению гражданского управления, и многие бенгальские националисты до сих пор проводят кампанию неповиновения в масштабах всей провинции."
 Bangladesh_War.19.d: "Восточное командование в Дакке изо всех сил старается поддерживать порядок и эффективно управлять. Хотя «Мукти Бахини» в основном разгромлены, а наши сторонники в Восточном Пакистане сильны как никогда, ясно, что это лишь вопрос времени, когда начнутся внутренние бои, особенно между бенгальцами и бихарцами. Учитывая, что Восточное командование должно бороться с этим внутренним этническим насилием наряду с поддержанием сил на границе, ситуация становится несостоятельной. Федеральное правительство решило, что сохранение прежнего статус-кво невозможно, но мы можем контролировать решение спора. Первый шаг - открыть переговоры с «Авами Лиг» и ее лидером Шейхом Муджибуром Рахманом, который все еще содержится в Западном Пакистане."
 Bangladesh_War.20.d: "Шейх Муджибур Рахман вернулся в Дакку среди огромных толп сторонников, что свидетельствует о постоянной поддержке его дела. Он прибыл на пакистанском военном самолете после завершения напряженных переговоров между «Авами Лиг» и военным правительством в Исламабаде. Обе стороны договорились о проведении через три месяца референдума по вопросу о том, останется ли Восточный Пакистан частью федерации или получит фактическую независимость, став частью со-федерации с Западным Пакистаном. В соответствии с соглашением, «Авами Лиг» и «Мукти Бахини» были амнистированы, хотя некоторые члены, считавшиеся особенно близкими к Индии, должны быть исключены из партии. Взамен «Авами Лиг» обещала, что не будет настаивать на независимости, и обещала прекратить любое вооруженное сопротивление и гражданское неповиновение. Реакция западнопакистанцев на соглашение была враждебной, поскольку многие расценили его как чрезмерно примирительное по отношению к группе, которая вела войну против государства."
 Bangladesh_War.21.d: "Народ Восточного Пакистана проголосовал на историческом референдуме за будущее своей провинции. В итоге народ решил остаться в составе Пакистана на правах со-федерации. С этого момента Восточный Пакистан будет управляться собственной ассамблеей и премьер-министром. По сути, он будет полностью независим от Пакистана, за исключением экономики, совместной обороны, иностранных дел, и под управлением того же президента. Пакистанские военные уже разделили себя, передав Восточному Пакистану Восточно-Бенгальские стрелки и Восточно-Пакистанские стрелки в качестве основы собственных вооруженных сил. Восточное командование вскоре будет расформировано и оставит оборону провинции новым восточнопакистанским военным. Предполагаемый премьер-министр Восточного Пакистана Шейх Муджибур Рахман приветствовал результат. Однако многие в Западном Пакистане, как говорят, в ярости от того, что, несмотря на победу над индийским вторжением и жертвуя столькими жизнями, «Авами Лиг», похоже, победила."
 Bangladesh_War.22.d: "После недавнего референдума в Восточном Пакистане, подтвердившего его новый статус, народ Западного Пакистана с нетерпением ждет возвращения своих героических солдат. Однако многие, особенно Зульфикар Бхутто и его Пакистанская народная партия, критикуют результаты. Действительно, есть сообщения о забастовках и беспорядках в некоторых городах, поскольку многие не могут понять, как военное правительство могло так легко передать власть. Президент, однако, обратился к нации и заявил, что ситуация в Восточном Пакистане была отчаянной, и он действовал так, чтобы сохранить Пакистан, как только мог. Бенгальским офицерам в армии скоро будет предоставлен выбор: присоединиться к новым вооруженным силам Восточного Пакистана или остаться. Аналитики считают, что эта обратная реакция вызвана сознательными усилиями правительства преуменьшить ситуацию с тех пор, как несколько месяцев назад начались волнения."
 Bangladesh_War.23.d: "Президент Яхья Хан официально передал власть Зульфикару Бхутто и его Пакистанской народной партии. Это произошло после нескольких месяцев волнений и протестов пакистанцев, возмущенных решением позволить Восточному Пакистану образовать со-федеративные отношения с Пакистаном. В своем заявлении президент Яхья отметил, что ПНП получила больше всего мест в Западном Пакистане во время предыдущих всеобщих выборов, и пришло время вернуть власть народу. Он заявил, что военные спасли нацию и сделали трудный выбор, необходимый для ее выживания. Вопреки ожиданиям, Бхутто заявил, что не будет менять новые отношения с Восточным Пакистаном и пообещал, что два крыла будут продолжать процветать вместе. Это указывает на то, что между ПНП и военными могло быть достигнуто соглашение до передачи власти. Бхутто также пообещал, что вскоре начнет процесс написания конституции и возвращения демократии в Пакистан."
 Admiral_Ahsan_Mission.1.d: "После решительной победы «Авами Лиг» на недавних всеобщих выборах возник политический кризис. Многие оппозиционные партии, особенно в Западном Пакистане, отказываются участвовать в работе Национальной ассамблеи. Они утверждают, что большинство голосов «Авами Лиг» дает им право вносить изменения в конституцию по своему усмотрению и разрушать пакистанское государство. Президент Яхья Хан ведет политические переговоры, но недавно он решил поручить вице-адмиралу Сайеду Мохаммаду Ахсану, исполняющему обязанности губернатора Восточного Пакистана, разработать мирную инициативу, которая положит конец нынешнему кризису. Ахсан имеет положительный имидж среди многих жителей Восточного Пакистана и не так жестко настроен, как другие военные. Его положительные отношения с президентом Яхья Ханом также считаются преимуществом при разработке мирного предложения."
 Admiral_Ahsan_Mission.2.d: "Адмирал Сайед Мохаммад Ахсан представил правительству свое мирное предложение. Оно было сделано после того, как он провел подробные переговоры с высокопоставленными правительственными, военными и политическими лидерами Восточного Пакистана. Предложение предусматривает создание совместной федерации, где оба крыла будут иметь своего премьер-министра, Зульфикар Бхутто для Западного Пакистана и шейх Муджибур Рахман для Восточного Пакистана, все под руководством президента. В Восточном Пакистане была бы создана отдельная гражданская служба и вооруженные силы, а тем, кто находится в провинции, был бы предоставлен выбор репатриироваться обратно в Пакистан. Некоторые в правительстве считают, что это предложение слишком далеко идущее. Другие утверждают, что международное сообщество уже заявило о своей поддержке этого предложения, и оно предлагает реальный способ выхода из политического тупика и сохранения Пакистана."
 Admiral_Ahsan_Mission.3.d: "После бурных обсуждений и жарких дебатов правительство Пакистана согласилось принять предложение миссии Ахсана. Хотя лидер крупнейшей западнопакистанской партии Зульфикар Бхутто выступил против этого плана, почти все другие ведущие политики Западного Пакистана поддержали его. Среди военных многие армейские офицеры выступили против, но руководители других родов войск были более благосклонны. В конце концов, когда командующий армией согласился, его подчиненные присоединились к нему. Новости об этом согласии уже породили в Пакистане и во всем мире надежду на то, что мирное решение поможет раз и навсегда разрешить кризис в Восточном Пакистане."
 Admiral_Ahsan_Mission.4.d: "«Авами Лиг» давно выступает за большую автономию Восточного Пакистана в составе страны. Недавние всеобщие выборы подтвердили широкую поддержку партии среди жителей Восточного Пакистана и их стремление к большей свободе. Недавно адмирал Сайед Мохаммад Ахсан, военный губернатор Восточного Пакистана, предложил решение, которое недавно было принято правительством. Основанное на наших \"Шести пунктах\", предложение предусматривает создание совместной федерации и, по сути, позволяет каждому крылу быть самоуправляемым. Некоторые члены партии поддерживают это предложение как достижение многих наших целей и обеспечение нашей автономии. Однако другие члены партии утверждают, что мы должны отклонить это предложение, поскольку мы выиграли выборы и должны добиваться получения всей политической власти, которую мы заработали на выборах."
 Admiral_Ahsan_Mission.5.d: "На улицах Дакки ощущалось радостное настроение после известия о том, что «Авами Лиг» согласилась с предложением Миссии Ахсана о создании со-федеративного государства Пакистан. Всего несколькими днями ранее город был полон мрака и напряженности из-за политического кризиса после недавних всеобщих выборов. Поскольку правительство уже поддержало этот план, ожидается, что в ближайшие дни будет сделано новое заявление, определяющее новый статус Пакистана. В Западном Пакистане предложение поддерживают почти все партии, кроме Пакистанской народной партии под руководством Зульфикара Бхутто. Однако аналитики опасаются оппозиции со стороны Бхутто, поскольку его партия получила большинство мест в Западном Пакистане на недавних выборах."
 Admiral_Ahsan_Mission.6.d: "Вице-адмирал Сайед Мохаммад Ахсан, военный губернатор Восточного Пакистана, недавно предложил решение кризиса Восточного Пакистана. Он надеялся, что его план позволит сохранить единство Пакистана и одновременно предоставит народу Восточного Пакистана автономию, которую он давно требовал с тех пор, как «Авами Лиг» впервые представила свое предложение из «Шести Пунктов». Однако его миссия провалилась. Некоторые винят в этом противодействие жестких элементов в армии вместе с Зульфикаром Бхутто. Другие предполагают, что это «Авами Лиг» сорвала попытку, будучи уверенной, что ее доминирование на выборах указывает на отсутствие необходимости идти на компромисс. Как бы то ни было, попытка провалилась, и адмирал Ахсан недавно подал в отставку в разочаровании."
 Admiral_Ahsan_Mission.7.d: "На фоне волнующей церемонии в Дакке президент Яхья Хан и новый премьер-министр Пакистана Зульфикар Бхутто смотрели, как шейх Муджибур Рахман был приведен к присяге в качестве премьер-министра Восточного Пакистана. Это ознаменовало новую эру для Пакистана после того, как адмирал Сайед Мохаммад Ахсан и его предложение по разрешению недавнего политического кризиса превратили Пакистан из федерации в со-федерацию. Два крыла Пакистана будут управляться собственными премьер-министрами, а любые споры между ними будут решаться президентом. Восточный Пакистан будет иметь автономию во всех областях, кроме внешней политики и некоторых аспектов обороны и экономики. Уже сейчас пакистанские военные передают два своих восточнопакистанских полка новой армии Восточного Пакистана и деактивируют Восточное командование. Народ Восточного Пакистана, как говорят, в восторге от этой резолюции, однако ходят слухи, что многие в Западном Пакистане недовольны, включая нового премьер-министра."
 Admiral_Ahsan_Mission.8.d: "Спустя всего несколько недель после создания со-федерации в Пакистане, западное крыло, которое теперь называется просто Пакистан, разгромлено крупными демонстрациями и забастовками, особенно в Карачи. Многие протестующие разгневаны тем, что, по их мнению, является предоставлением фактической независимости бенгальцам. Военному правительству с трудом удается держать эти протесты под контролем, а премьер-министр Зульфикар Бхутто отказывается комментировать их. Он давно выступал против недавнего соглашения, но стал премьер-министром благодаря тому, что его партия, Пакистанская народная партия (ПНП), получила больше всего мест на последних всеобщих выборах. Он отметил, что Пакистан не может отменить соглашение, но тот факт, что оно было заключено без явного одобрения всех пакистанцев, доказывает несовершенство существующей системы. Многие на государственной службе и в армии симпатизируют Бхутто. Ходят слухи, что некоторые старшие офицеры сотрудничали с ПНП в организации этой кампании беспорядков."
 Admiral_Ahsan_Mission.9.d: "Президент Яхья Хан официально передал свои полномочия военного положения и президентский титул премьер-министру Зульфикару Бхутто. Это произошло после нескольких месяцев волнений и протестов пакистанцев, возмущенных решением позволить Восточному Пакистану образовать со-федеративные отношения с Пакистаном. В своем заявлении президент Яхья отметил, что военные сделали трудный выбор, необходимый для Пакистана, но для возвращения демократии это должны сделать те, кого избрал народ. Придя к власти, Бхутто пообещала не отменять со-федеративное устройство. Это указывает на то, что между ПНП и военными могло быть достигнуто соглашение до передачи власти. Бхутто также пообещал, что вскоре начнет процесс организации учредительного собрания для создания новой конституции и восстановления демократии в Пакистане. Что касается со-федерации, Бхутто немедленно объявил, что президент больше не будет посредником между обоими крыльями, но что отныне споры будут решаться путем диалога между двумя премьер-министрами."
 Awami_League_Win.1.d: "Президент Яхья Хан успешно убедил Зульфикара Бхутто и остальных членов Национального собрания Западного Пакистана отозвать свой протест и отправиться в Дакку, чтобы начать работу нового Национального собрания. Бхутто и его сторонники выступали против участия в собрании, поскольку «Авами Лиг» получила явное большинство и, по сути, может написать новую конституцию по своему усмотрению. Западные пакистанцы хотели, чтобы «Авами Лиг» приняла изменения в Национальной ассамблее и гарантировала, что любые изменения, которые они внесут, будут сделаны с согласия всех политических партий. «Авами Лиг» утверждала, что она честно выиграла выборы и не должна идти на компромисс только потому, что большинство поддержало их. Президент Яхья Хан решил поддержать позицию «Авами Лиг» и, похоже, успешно убедил оппозицию присоединиться к ней, вероятно, используя военных для давления на них."
 Awami_League_Win.2.d: "«Авами Лиг» использовала свое большинство, чтобы принять свои «Шесть Пунктов» в качестве основы для будущей конституции Пакистана. Как только спикер Ассамблеи объявил, что законопроект будет поставлен на голосование, оппозиция, включая всех депутатов от Западного Пакистана, вышла из зала. Лидер оппозиции Зульфикар Али Бхутто заявил, что голосование было актом политического насилия и игнорировало мнение целого крыла страны. Премьер-министр Шейх Муджибур Рахман осудил оппозицию и заявил, что «Шесть Пунктов» были основной платформой его партии, которая получила абсолютное большинство в Национальном собрании. Президент Яхья Хан, обладающий сейчас в основном символическими полномочиями, прилетел в Дакку, чтобы провести переговоры о выходе из тупика. Бхутто должен решить, попытается ли он найти компромисс с «Авами Лиг» или начнет бойкот Национальной Ассамблеи."
 Awami_League_Win.3.d: "После принятия «Шести Пунктов» «Авами Лиг», западнопакистанские парламентарии покинули парламент в знак протеста. Президент Яхья Хан прибыл для посредничества с «Авами Лиг» и оппозицией. После напряженных дискуссий был достигнут компромисс, чтобы положить конец постоянным политическим тупикам, в которых оказалась страна. Лидер оппозиции Зульфикар Али Бхутто согласился на создание Пакистана как со-федерации. Это позволило бы создать два парламента, по одному для каждого крыла. Восточный Пакистан получил бы большую автономию и был бы практически самоуправляемым. Пакистан разделил бы активы с Восточным Пакистаном. Хотя Бхутто согласился с решением, он публично выразил свое нежелание и заявил, что решение было принято под сильным давлением со стороны «Авами Лиг» и президента Яхья Хана. В частном порядке его сторонники распространяют слухи о том, что военные вооружили Бхутто. Независимо от этого, похоже, что решение было достигнуто."
 Awami_League_Win.4.d: "Недавний политический кризис, связанный с принятием «Шести Пунктов» в Национальной ассамблее, перерос в серьезный кризис. Западнопакистанские парламентарии объявили бойкот и отказываются возвращаться в Дакку и Национальную Ассамблею. Их надежды заставить «Авами Лиг» отступить и пойти на компромисс провалились. Вместо этого Шейх Муджибур Рахман объявил ликующим толпам, что отныне бенгальский народ больше не будет гражданином второго сорта, вместо этого он будет сам распоряжаться своей судьбой. Он объявил о создании Бангладеш и призвал всех бенгальцев объединиться для обеспечения свободы. Это заявление застало западнопакистанцев врасплох. Уже поступают сообщения о толпах бенгальцев, которые окружают расквартированные по всему Восточному Пакистану лагеря и блокируют движение грузов и людей. Правительство должно решить: либо принять эти катастрофические изменения, либо попытаться восстановить порядок и ввести войска."
 Awami_League_Win.5.d: "После объявления шейха Муджибура Рахмана о независимости Бангладеш бенгальцы по всему Восточному Пакистану начали фактическую блокаду военных расквартирований по всей провинции. Поскольку у пакистанских войск заканчивались припасы, правительству пришлось решать, смириться с реальностью или начать военную интервенцию. Президент Яхья Хан решил смириться с потерей Восточного Пакистана и приказал репатриировать пакистанских солдат и чиновников на родину. Новое правительство Бангладеш с готовностью согласилось и разрешило пакистанским войскам переместиться в Дакку, чтобы вывести войска по воздуху и морю. Индийское правительство приветствовало появление Бангладеш, в то время как Яхья Хан столкнулся с фактическим восстанием своих собственных офицеров."
 Mukti_Bahini.1.d: "Наши бойцы выявили аванпост пакистанской армии. С этой позиции они преследуют местных жителей и блокируют передвижение наших бойцов в этом районе. Один из командиров организовал штурмовую группу. Они провели тщательную разведку, прежде чем начать атаку. Пакистанские войска не знали, что их поразило, мы нанесли им тяжелые потери, когда они бежали с позиции. Перед отходом наши люди успешно захватили оружие и припасы. Большой конвой пакистанцев вернулся, но к тому времени мы уже давно исчезли. Эти операции подорвут волю нашего врага."
 Mukti_Bahini.2.d: "Наши бойцы обнаружили аванпост пакистанской армии. С этой позиции они преследуют местных жителей и блокируют передвижение наших людей в этом районе. Один из командиров организовал штурмовую группу. К сожалению, он перестарался, и его приближающиеся силы были обнаружены пакистанскими дозорными. Подготовленный противник легко отразил нашу атаку, нанеся потери и взяв несколько пленных. Это серьезное поражение «Мукти Бахини» в этом районе. Пакистанцы будут уверенны в своих силах после этого успеха и расширят свои операции по преследованию"
 Mukti_Bahini.3.d: "С помощью местных информаторов мы определили точные позиции солдат из пакистанского батальона, действующего в этом районе. Элитная группа минометчиков вошла в район и открыла заградительный огонь по указанным координатам. Наши радиоперехваты подтвердили, что минометы были точными и нанесли потери. Несколько вражеских позиций были оставлены из-за точного огня. Это позволит усилить операции в этом районе и даст нашим силам пространство для маневра, чтобы более эффективно действовать в этом районе."
 Mukti_Bahini.4.d: "С помощью местных информаторов мы определили точные позиции солдат из пакистанского батальона, действующего в этом районе. Элитная группа минометчиков попыталась проникнуть в этот район и начать обстрел по предоставленным координатам. К сожалению, наши бойцы были перехвачены группой пакистанских солдат и понесли потери, включая минометы, которые пришлось бросить на месте. Это серьезная неудача для наших операций. Пакистанские силы будут пытаться использовать свое преимущество в этом районе."
 Mukti_Bahini.5.d: "Недавно мы завербовали несколько местных чиновников для предоставления разведданных нашим силам «Мукти Бахини» в этом районе. Пакистанская армия тесно сотрудничает с местными органами власти и зависит от них. Мы получаем впечатляющие разведданные о передвижениях войск и будущих операциях. Эта информация уже привела к оперативным успехам. Мы также можем перемещать «Мукти Бахини» без риска перехвата. Это большой успех, мы постепенно отбираем контроль над районом у оккупировавших его пакистанцев."
 Mukti_Bahini.6.d: "Недавно мы завербовали несколько местных чиновников, чтобы они предоставляли разведданные нашим силам «Мукти Бахини» в этом районе. Пакистанская армия тесно сотрудничает с местными властями и зависит от них. Полученные разведданные заставили нас думать, что мы получаем впечатляющую информацию о передвижениях войск и операциях. Однако чиновники, которых мы завербовали, были лояльны оккупантам. Они предали бенгальский народ. Прежде чем мы осознали их предательство, пакистанцы успешно перехватили силы «Мукти Бахини» в этом районе. Это серьезная неудача для нашего дела в этом районе."
 Mukti_Bahini.7.d: "Амбициозный командир батальона обнаружил крупный форпост «Мукти Бахини» в своем районе. После тщательной разведки он поручил капитану возглавить штурм. Операция увенчалась большим успехом, позиция была быстро захвачена, несколько бандитов взяты в плен. Они также оставили после себя потери. Наши офицеры разведки смогли получить ценные документы противника на месте. Этот успех привел к сокращению операций «Мукти Бахини» в этом районе и поднял боевой дух войск. Капитан будет по праву отмечен за свое отличное поведение."
 Mukti_Bahini.8.d: "Амбициозный командир батальона обнаружил в своем районе крупный форпост «Мукти Бахини». После тщательной разведки он поручил капитану возглавить штурм. Операция, к сожалению, обернулась провалом. Наши силы были либо предупреждены, либо опознаны при приближении к позиции. «Мукти Бахини» были хорошо подготовлены. Они понесли большие потери, прежде чем отступить. Застава была захвачена, но враг уже вывез с нее документы и оборудование. Это серьезная неудача для наших операций в этом районе. В батальон поступают сообщения, что наши солдаты нервничают, выходя на патрулирование."
 Mukti_Bahini.9.d: "Наши агенты разведки обнаружили аванпост «Мукти Бахини» глубоко в джунглях. Армия сообщила, что для штурма позиции потребуется тяжелая колонна, поэтому ВВС попросили уничтожить объект. Получив координаты и приказ, наши отважные пилоты выполнили задание. Они сообщили, что объект был успешно нейтрализован. Мы послали небольшой патруль, чтобы осмотреть объект. Они обнаружили уничтоженные боеприпасы и захваченные документы. Есть свидетельства того, что враг понес потери и поспешно ушел. Это был большой успех. Мы показали, что врагу негде спрятаться от наших сил."
 Mukti_Bahini.10.d: "Наши агенты разведки обнаружили аванпост «Мукти Бахини» глубоко в джунглях. Армия сообщила, что для штурма позиции потребуется тяжелая колонна, поэтому ВВС попросили уничтожить объект. Получив координаты и приказ, наши отважные пилоты выполнили задание. Они сообщили, что объект был успешно нейтрализован. Мы послали небольшой патруль, чтобы осмотреть место. К сожалению, они не нашли никаких доказательств того, что на этом месте находились боевики «Мукти Бахини». Местные жители разгневаны бомбардировкой, и мы считаем, что многие из них теперь симпатизируют злоумышленникам. Это серьезное поражение, которое используется как крупная пропагандистская победа повстанцев."
 Mukti_Bahini.11.d: "Сотрудники нашей разведки выявили несколько видных бенгальцев в деревнях, находящихся под влиянием «Мукти Бахини». Эти люди искренне верят в ислам и идеологию Пакистана. Они предоставляют ценную информацию о видных сторонниках «Мукти Бахини» и движениях «Мукти Бахини» в этом районе. Мы начали совместную операцию, в ходе которой задержали ряд этих сторонников и перехватили несколько групп «Мукти Бахини». Это большой успех, теперь мы можем укрепить наш контроль в этом районе. Это крупная победа наших разведчиков и знак исключительного военного сотрудничества."
 Mukti_Bahini.12.d: "Наши офицеры разведки выявили несколько видных бенгальцев в деревнях, находящихся под влиянием «Мукти Бахини». Мы считали этих людей истинно верующими в ислам и идеологию Пакистана. Они предоставляли, как нам казалось, ценную информацию о видных сторонниках «Мукти Бахини» и движениях «Мукти Бахини» в этом районе. К сожалению, когда мы начали операцию по облаве на сторонников повстанцев и перехвату боевиков «Мукти Бахини», она закончилась катастрофой. «Мукти Бахини» не было на указанных позициях. Более того, выяснилось, что задержанные нами люди на самом деле были нейтральными. Теперь они будут симпатизировать врагу. «Мукти Бахини» используют их успех и укрепляют свое влияние в этом районе."
 Mukti_Bahini.13.d: "Премьер-министр собрал высокопоставленных чиновников кабинета министров и военных на закрытую конференцию. Ситуация в Восточном Пакистане быстро ухудшается, пакистанская армия активно борется с повстанцами «Мукти Бахини». Большое количество бенгальских беженцев на нашей территории активно поддерживает «Мукти Бахини». Наши высшие военные руководители считают, что не составит труда предоставить им более современное вооружение и обучение, особенно бывшим пакистанским солдатам из их числа. У них уже есть планы по немедленному созданию тренировочных лагерей по нашу сторону границы. Однако некоторые министры обеспокоены. Они считают, что мы не должны обострять ситуацию и вместо этого должны оказать давление на Пакистан с целью урегулирования кризиса. Эскалация может привести к бегству еще большего числа беженцев и спровоцировать Пакистан на ответные действия."