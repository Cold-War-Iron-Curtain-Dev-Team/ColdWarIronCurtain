 tank_experimental_company: "Экспериментальная Компания"
 tank_mass_produced_company_desc: "Эта компания фокусируется на сокращении затрат и сокращении накладных расходов, что позволяет нам производить больше наземных единиц и экономить деньги, но делает их менее надежными и они легче ломаются."
 tank_mobile_warfare_company_desc: "Эта компания полагается на скорость и мобильность и примет меры для оптимизации скорости наших наземных транспортных средств"
 tank_heavy_vehicle_company_desc: "Эта компания полагается на производство тяжелых бронированных машин"
 tank_superior_firepower_company_desc: "Эта компания вкладывает значительные средства в увеличение огневой мощи наших наземных транспортных средств."
 tank_expeditionary_company_desc: "Эта компания специализируется на создании транспортных средств, которые могут ездить на пересеченной местности и сокращают расход топлива."
 tank_experimental_company_desc: "Эта компания ориентирована на будущее и вкладывает значительные средства в создание новых моделей"
 air_mass_produced_company: "Компания массового производства"
 air_guardian_angel_company: "Ангел-Хранитель"
 air_firestorm_company: "Огненная Буря"
 air_assault_horizon_company: "Компания штурмового горизонта"
 air_infinity_company: "Компания безграничности"
 air_mass_produced_company_desc: "Эта компания фокусируется на массовом производстве больших количеств самолетов за счет того, что они становятся менее надежными и с большей вероятностью выходят из строя во время использования."
 air_guardian_angel_company_desc: "Эта компания считает, что ВВС должны играть вспомогательную роль и поддерживать наземные подразделения"
 air_firestorm_company_desc: "Эта компания считает, что военно-воздушные силы должны играть непосредственную роль и делает все возможное, чтобы военно-воздушные силы были более способными к выполнению специальных задач."
 air_assault_horizon_company_desc: "Эта компания желает сделать самолеты надежными и работоспособными в любых условиях и работать долго."
 air_infinity_company_desc: "Эта компания ориентирована на будущее и вкладывает значительные средства в создание новых моделей"
 materiel_value_company: "Ценные средства"
 materiel_infantry_company: "Средства для пехоты"
 materiel_support_company: "Средства поддержки"
 materiel_experimental_company: "Экспериментальные средства"
 materiel_value_company_desc: "Эта компания фокусируется на упрощении снаряжения и повышении его надежности для снижения общих затрат."
 materiel_infantry_company_desc: "Эта компания направляет все свое внимание на улучшение снаряжения пехоты"
 materiel_support_company_desc: "Эта компания считает, что пехота - это только поддержка; артиллерия делает всю работу"
 materiel_experimental_company_desc: "Эта компания ориентирована на будущее и вкладывает значительные средства в создание новых моделей"