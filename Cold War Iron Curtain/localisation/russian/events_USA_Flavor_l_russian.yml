l_english:
 MacArthur_Dismissal.1.d: "В связи с обострением боевых действий в Корее, президент Трумэн призвал генерала Макартура выразить свою озабоченность сообщениями о наращивании китайской военной мощи на границе. Генерал Макартур заверил Президента, что такая возможность крайне маловероятна. Он назвал отсутствие промышленной базы и военное истощение после гражданской войны лишь некоторыми причинами, по которым Китай не хотел бы вмешиваться. Президент Трумэн принял этот совет и более чем когда-либо уверен в лидерстве Макартура во время этого конфликта."
 MacArthur_Dismissal.2.d: "Президент Трумэн выразил свое недовольство генералом Макартуром после получения известия о массированной китайской военной интервенции в Корею. Он обвиняет Макартура в его бесцеремонной военной стратегии и агрессивных публичных заявлениях. Он считает, что эти действия спровоцировали китайцев действовать. Генерал Макартур не слишком обеспокоен таким развитием событий и считает, что его силы более чем способны справиться с этой задачей. В СМИ появились сообщения о том, что президент недоволен военной ситуацией в Корее."
 MacArthur_Dismissal.3.d: "Поскольку война в Корее продолжается, генерал Макартур все чаще предлагает развить конфликт. Он связывает борьбу против коммунизма в Азии и борьбу с коммунизмом в Европе и считает, что война должна быть развита, чтобы нацелиться на материковый Китай и защитить Тайвань. Некоторые из этих комментариев попали в средства массовой информации и привели к появлению редакционных статей, поддерживающих этот аргумент. Говорят, что президент Трумэн пришел в ярость от этих событий. Он не согласен с такой оценкой и хочет, чтобы война ограничивалась Кореей. В частности, Трумэна беспокоят сообщения о развертывании военно-морских сил ООН в направлении Тайваня и материкового побережья. Прежде всего Трумэн выразил опасение, что Макартур намеренно сливает информацию в СМИ."
 MacArthur_Dismissal.4.d: "Президент Трумэн потребовал от генерала Макартура обуздать его публичные комментарии и пропаганду более широкого конфликта. В частности, Трумэн хочет, чтобы Макартур не комментировал и не принимал решений, связанных с внешней политикой. Трумэн считает, что Макартур бросает вызов исполнительной власти и осуществляет власть за пределами своих полномочий военного командира. Говорят, что генерал Макартур разочарован президентом и его очевидным эгоизмом. В Корее растет напряженность между исполнительной властью и военным командованием."
 MacArthur_Dismissal.5.d: "Генерал Макартур написал коммюнике для высших офицеров под его командованием о начале наступательных операций против Китая. Макартур утверждает, что китайская мощь сильно преувеличена и корейский конфликт может быть использован для борьбы с китайской угрозой Тайваню и его стремлением обеспечить себе место в Совете Безопасности. Президент Трумэн планировал выпустить аналогичное коммюнике и, как говорят, был в ярости на Макартура. В частности, Трумэна расстраивают комментарии, связанные с внешней политикой. Он и его советники считают, что Макартур подрывает президентство и расширяет свое военное командование за пределы приемлемых сфер."
 MacArthur_Dismissal.6.d: "Президент Трумэн слышал слова поддержки от нескольких высокопоставленных руководителей союзных государств, которые выражали озабоченность по поводу генерала Макартура. Они говорят, что его мировоззрение противоречит их собственному, и они боятся, что его суждение может привести к тому, что корейский конфликт перерастет в глобальную войну. Есть также опасения по поводу его комментариев в СМИ, поскольку они часто носят подстрекательский характер. Более сильную же озабоченность вызывает его отдача приказов, которые порой почти противоречат политике, согласованной политическими лидерами. В одном из примеров Макартур санкционировал крупную операцию прямо перед тем, как получил приказ не наступать на фронте, хотя и знал, что эти приказы поступят. Президент Трумэн заверил лидеров, что генерал Макартур не будет диктовать политику, и Белый дом твердо контролирует ситуацию."
 MacArthur_Dismissal.7.d: "Недавно президента Трумэна спросили, не отдаст ли он приказ о новых наступательных действиях в Корее. Президент заявил, что такие решения принимаются командованием на местах. Генерал Макартур воспринял это как разрешение и дал своим командирам разрешение на проведение наступательных операций на земле, не посоветовавшись с Белым домом. Услышав эту новость, президент Трумэн снова был взволнован Макартуром и считает, что тот в очередной раз превысил свои полномочия. Президент Трумэн решил созвать совещание своих высших военных руководителей, чтобы обсудить будущее командование генерала Макартура. Макартур постоянно издает приказы и действия, которые находятся прямо на границе допустимого, и он явно не может следовать политике, продиктованной Белым домом."
 MacArthur_Dismissal.8.d: "Президент Трумэн провел встречу с председателем Объединенного комитета начальников штабов, министром обороны, государственным секретарем и своим главным советником, чтобы обсудить будущее генерала Макартура. Трумэна все больше беспокоило то, что Макартур постоянно действует независимо от Белого дома и временами вмешивается во внешнюю политику во время корейского конфликта. Председатель Объединенного комитета начальников штабов и министр обороны попросили день на размышление. Посоветовавшись с начальниками служб, они пришли к единому мнению, что освобождение Макартура было бы желательным действием для всех. С этой информацией президент Трумэн решил окончательно освободить генерала Макартура от командования. Президент Трумэн спросил, может ли Макартур быть освобожден за неподчинение, Объединенный комитет начальников штабов посоветовал не делать этого, поскольку тогда Макартур мог бы обратиться в военный трибунал. Вместо этого они предлагают освободить его от должности без объяснения причин. Однако Трумэну очень хочется снять с должности Макартура именно из-за неповиновения, чтобы продемонстрировать исполнительную власть и ограничить публичную критику. Мы должны принять решение."
 MacArthur_Dismissal.9.d: "Белый дом послал сообщение министру армии, находящемуся в настоящее время с визитом в Корее, чтобы сообщить генералу Макартуру, что он будет освобожден за свое неподчинение. Однако возникла проблема со связью, и министр армии так и не получил сообщение. Вместо этого Трумэн сообщил репортеру о своем решении, и Макартур узнал об этом только тогда, когда услышал новости в Токио. Услышав, что он был освобожден за неподчинение, генерал Макартур, как говорят, отреагировал яростно, и он уже публично заявил о своем намерении предстать перед военным трибуналом. В своих комментариях к СМИ президент Трумэн заявил, что у него нет другого выбора, кроме как действовать, поскольку Макартур не поддается контролю."
 MacArthur_Dismissal.10.d: "Белый дом послал сообщение министру армии, который в настоящее время находится с визитом в Корее, чтобы сообщить генералу Макартуру, что он будет освобожден от должности. Однако возникла проблема со связью, и министр армии так и не получил сообщение. Вместо этого Трумэн сообщил репортеру о своем решении, и Макартур узнал об этом только тогда, когда услышал новости в Токио о его увольнении. Говорят, что генерал Макартур глубоко ранен, но выполняет приказ о передаче командования. В своем пресс-релизе президент Трумэн признал блестящую карьеру генерала Макартура, но отметил, что он не был полностью привержен национальной политике и поэтому должен был быть заменен. Семья Макартуров строит планы по возвращению в Соединенные Штаты."
 MacArthur_Dismissal.11.d: "Новость о том, что генерал Макартур отстранен от командования, вызвала бурную реакцию в средствах массовой информации по всем Соединенным Штатам. Многие офицеры в Корее критикуют президента Трумэна за то, что он бесцеремонно уволил самого титулованного офицера в американской истории. Во многих сообщениях отмечается, что именно руководство Макартура переломило ход событий в Корее, и его увольнение было вызвано, по-видимому, завистью со стороны Белого дома, а не военным поведением. Для миллионов американцев, которые помнят Макартура за его героизм в военное время или служили под его началом в течение более чем пятидесяти лет в армии, его отстранение воспринимается как пощечина. Лишь несколько крупных газет поддержали президента, заявив, что Макартур слишком часто переступал границы дозволенного, и у администрации остался только один выбор."
 MacArthur_Dismissal.12.d: "Вернувшись в Сан-Франциско из Кореи, генерал Макартур был встречен старшими военными офицерами региона и дал парад, в котором приняли участие полмиллиона человек. Затем его пригласили выступить на совместном заседании в Конгрессе. После приземления в Вашингтоне его приветствовали высокопоставленные военные и правительственные чиновники, однако президент Трумэн пренебрег генералом, не поприветствовав его. В своей речи он отрицал интерес к партизанству и вместо этого заявил, что его единственным желанием было и остается служить своей стране. Он опроверг заявления о том, что он был разжигателем войны, заявив, что мало кто видел такие бои, как он, и его самым большим желанием остается сохранение мира. Во время выступления его более пятидесяти раз прерывали овациями. Он защищал свои действия в Корее и хвалил свои послевоенные достижения с Японией. После выступления, представители и сенаторы выразили свое разочарование тем, что Трумэн уберет Макартура, офицера беспрецедентных достижений и ума."
 MacArthur_Dismissal.13.d: "После выступления перед Конгрессом, генерал Макартур вылетел в Нью-Йорк, где принял самый большой парад в истории города. Тысячи людей приходили посмотреть на старого генерала и поболеть за все его достижения. После Нью-Йорка Макартур посетил Чикаго, где выступил перед битком набитым Солдатским полем с более чем 50 000 присутствующими. Во время всех этих визитов он защищал свои действия и подчеркивал свои выдающиеся достижения. Его способность привлекать огромные толпы от побережья до побережья также рассматривается Республиканской партией, которая планирует принять его в партию. До сих пор генерал Макартур опровергал слухи о том, что он намерен заняться политикой или вступить в партию."
 MacArthur_Dismissal.14.d: "Сенатский комитет по вооруженным силам и Сенатский комитет по международным отношениям проводят расследование войны в Корее и решения об отставке генерала Макартура. Многие сенаторы и представители республиканской партии критиковали президента за его действия. Сенатор Роберт Тафт назвал это решение мстительным и поспешным, заявив, что оно доказывает, насколько непригоден президент Трумэн для этой должности. Вместе с Объединенным Комитетом начальников штабов генерал Макартур, вероятно, представит доказательства следствию. Расследование решит, нарушил ли президент Трумэн свои конституционные полномочия, убрав генерала. Расследование является не только серьезным затруднением для президента, но и угрожает сделать его уязвимым для голосования по импичменту."
 MacArthur_Dismissal.15.d: "Военный суд, которому генерал Макартур поручил оспорить обвинения в нарушении субординации, вынес решение в его пользу. Военный суд установил, что во всех упомянутых инцидентах он не нарушал воинской субординации и не выполнял приказов, противоречащих Объединенному комитету начальников штабов. Они заметили, что время от времени он подходил близко, но при тщательном осмотре не было никаких прямых доказательств этого. Этот результат является серьезным ударом для президента Трумэна, который в настоящее время сталкивается с сенатским расследованием по поводу его отношения к войне в Корее и его решения уволить Макартура. Однако суд решил не восстанавливать его командование, хотя у него была такая возможность."
 MacArthur_Dismissal.16.d: "Сенатское расследование увольнения генерала Макартура пришло к окончательным выводам. Они пришли к выводу, что президент Трумэн не нарушил конституционную власть, освободив Макартура. Однако они отметили, что обстоятельства произошедшего больно задели национальную гордость американского народа. Расследование также утверждало, что не было никаких доказательств серьезных разногласий по военной стратегии между Макартуром и Объединенным Комитетом начальников штабов. Во время расследования генерал Макартур дал убедительные показания в свою защиту, однако все его утверждения были опровергнуты Объединенным Комитетом начальников штабов, что значительно ослабило его аргументы."
 MacArthur_Dismissal.17.d: "Ошеломляющим событием стало то, что сенатское расследование решения президента Трумэна освободить генерала Макартура от командования в Корее пришло к выводу, что президент нарушил конституционную власть. Следствие отметило, что генерал Макартур был освобожден по ложным обвинениям, так как он был оправдан в недавнем военном суде, и что Президент злоупотребил своими полномочиями, чтобы удалить его. Во время расследования генерал Макартур дал показания, которые были опровергнуты Объединенным Комитетом начальников штабов, однако следствие отметило, что Объединенный комитет начальников штабов признал, что они не рекомендовали отстранить Макартура, если Президент впоследствии сообщит это прессе. Объединенный комитет начальников штабов лишь заявил, что согласен с этим решением. Представители республиканской партии внесли в палату представителей предложение об импичменте."
 MacArthur_Dismissal.18.d: "Конгресс Соединенных Штатов проводит внеочередное голосование по вопросу об импичменте президента Гарри Трумэна. Если голосование пройдет, предложение об импичменте попадёт в Сенат, который будет судить президента. Если его признают виновным, президент будет отстранен от власти. Президент Трумэн обвиняется в злоупотреблении конституционными полномочиями, приняв решение освободить генерала Макартура в Корее. Ожидается, что республиканцы проголосуют за эти статьи, и есть опасения, что даже некоторые демократы могут поддержать эту меру, учитывая общественную поддержку Макартура наряду с презрением Конгресса к президенту. Многие до сих пор расстроены тем, что он не добился одобрения Конгресса до вмешательства в Корею. В своем заявлении Президент выразил уверенность, что сфабрикованные против него обвинения не выдержат критики."
 MacArthur_Dismissal.19.d: "Конгресс Соединенных Штатов проголосовал за импичмент президенту Соединенных Штатов. Это беспрецедентная ситуация и последняя глава в конституционном кризисе, который потряс Белый дом с тех пор, как президент Трумэн решил освободить генерала Дугласа Макартура от командования в Корее. Многие в Конгрессе и в газетах по всей стране аплодировали голосованию, заявляя, что мстительный характер президента и его необдуманные действия демонстрируют его неспособность руководить в это критическое для Соединенных Штатов время. Белый дом не сделал никаких заявлений по поводу голосования, поскольку многие аналитики считают, что они были уверены, что эта мера не получит достаточного количества голосов. Генерал Макартур заявил, что голосование - это победа демократической системы."
 MacArthur_Dismissal.20.d: "Президент Соединенных Штатов Гарри Трумэн обратился к нации по радио, чтобы объявить о своей отставке. Он станет первым действующим президентом, который уйдет в отставку. Недавно Конгресс объявил ему импичмент, и президент понял, что Сенат, скорее всего, признает его виновным и отстранит от власти. В своем обращении Президент заявил, что не хочет больше подвергать страну потрясениям, особенно учитывая международную ситуацию. Он добавил, что его решение было не признанием вины, а жертвой ради общего блага страны. Вице-президент Албен У. Баркли скоро примет присягу президента. Первоначальная реакция на эту речь была в основном позитивной, поскольку политические лидеры и газеты по всей стране выразили восхищение решением положить конец кризису во имя национального единства."
 MacArthur_Dismissal.21.d: "Конгресс США проголосовал против импичмента президента Гарри Трумэна. Это крупная победа для сражающегося главнокомандования. Его обвиняли в злоупотреблении конституционными полномочиями в связи с решением отстранить от командования в Корее высокооплачиваемого и популярного генерала Дугласа Макартура. Хотя многие конгрессмены, особенно республиканцы, выражали тревогу по поводу результата, в ходе процесса было ясно, что обвинения не имеют достаточно оснований, чтобы настроить Конгресс против президента. Хотя президент Трумэн пережил это испытание, негативное внимание и общественный гнев по поводу его решения сделают его шансы на переизбрание намного более сложными."
 MacArthur_Dismissal.22.d: "Генерал Дуглас Макартур продолжает делать заявления в средствах массовой информации и выступать перед аудиторией по поводу своего увольнения из командования в Корее. Несмотря на то, что он остается чрезвычайно популярным благодаря своей пятидесятилетней службе в армии, его постоянные нападки на Трумэна теряют свою силу. Многие американцы, которые видели в Макартуре потенциального кандидата в президенты, теряют интерес, поскольку у Макартура, похоже, нет четкого видения будущего страны, кроме его желания видеть Трумэна проигравшим."
 MacArthur_Dismissal.23.d: "После решения Конгресса объявить импичмент президенту Трумэну, генерал Дуглас Макартур активизировал свои публичные выступления и интервью в средствах массовой информации. Многие американцы теперь рассматривают его как жертву злоупотреблений со стороны руководства и сплотились вокруг него. Теперь, когда Трумэна убрали, Макартур тратит больше времени на обсуждение своего видения Америки и ее места в мире. Его перспектива видеть коммунизм более глобальным и связанным с Азией находит отклик среди многих американских избирателей. Ходят даже слухи, что он ведет переговоры с ключевыми республиканскими лидерами по поводу потенциальной президентской гонки."
 MacArthur_Dismissal.24.d: "Республиканский национальный съезд скоро соберется, чтобы выбрать кандидата в президенты, но зашел в тупик, кого поддержать. Многие в партии видят в выборах прекрасную возможность захватить президентский пост после десятилетий демократического контроля. Республиканцы разделились между сенатором Робертом Тафтом и легендарным генералом Дуайтом Эйзенхауэром. Ключевые республиканские лидеры теперь призывают генерала Макартура начать кампанию за одобрение, чтобы выйти из тупика, поскольку его недавняя полемика с президентом Трумэном сделала его национальной фигурой, которую могут поддержать все республиканцы."
 MacArthur_Dismissal.25.d: "После тщательного обдумывания, генерал Дуглас Макартур решил открыто добиваться выдвижения кандидатуры на пост президента от Республиканской партии. Его решение присоединиться к гонке сломало тупик для выдвижения кандидатуры, и многие в партии поспешили поддержать генерала. Сам Макартур заявил, что как военный человек он давно отказался от участия в политике, однако, учитывая состояние нации, он окажет медвежью услугу, не ответив на призыв. Говорят, что Демократическая партия очень обеспокоена, особенно тем, что генерал Макартур в настоящее время находится на вершине после импичмента и отставки своего заклятого врага, президента Трумэна."
 MacArthur_Dismissal.26.d: "Генерал Макартур сообщил лидерам республиканцев, что не будет активно агитировать за выдвижение своей кандидатуры на пост президента. Хотя, если бы ему дали эту возможность, он бы подумал. Для многих республиканцев, поддерживающих генерала, это большая неудача и помеха. Теперь очень маловероятно, что он получит эту кандидатуру, и партии придется выйти из тупика и выбрать между сенатором Робертом Тафтом и генералом Дуайтом Эйзенхауэром. Генерал Макартур в частном порядке дал понять, что, когда придет время, он поддержит Тафта. Похоже, генерал Макартур теперь будет спокойно наслаждаться своей отставкой в Уолдорфских башнях."
 usanews.3.d: "В [GetDateText] Самая страшная авария в истории атомной энергетики США началась, когда не закрылся клапан давления на реакторе Блока-2 на Три-Майл-Айленд. Охлаждающая вода, зараженная радиацией, стекала из открытого клапана в соседние здания, и активная зона начала опасно перегреваться. После того, как охлаждающая вода начала стекать из сломанного напорного клапана, автоматически включились насосы аварийного охлаждения. Однако операторы в диспетчерской неправильно истолковали запутанные и противоречивые показания и отключили систему аварийного водоснабжения. Реактор также был остановлен, но остаточное тепло от процесса деления все еще выделялось.\nВскоре после 8 утра весть об аварии просочилась во внешний мир. Компания завода, Metropolitan Edison, преуменьшила значение кризиса и заявила, что за пределами территории завода не было обнаружено радиации, но в тот же день инспекторы обнаружили поблизости несколько повышенный уровень радиации в результате утечки загрязненной воды. Губернатор Пенсильвании Дик Торнбург решил объявить эвакуацию. Наконец, около 8 часов вечера операторы станции поняли, что им нужно снова запустить воду через активную зону, и перезапустили насосы. Температура начала падать, и давление в реакторе уменьшилось. Более половины активной зоны было разрушено или расплавлено.\nОднако через два дня в здании реактора был обнаружен пузырь с легковоспламеняющимся газообразным водородом. После того, как была обнаружена утечка радиации, жителям рекомендовали оставаться дома. Эксперты не были уверены, вызовет ли водородный пузырь дальнейшее расплавление или, возможно, гигантский взрыв, и в качестве меры предосторожности губернатор Торнбург посоветовал «беременным женщинам и детям дошкольного возраста покинуть территорию в радиусе пяти миль от объекта Три-Майл-Айленд до дальнейшего уведомления». Это привело к панике, которой губернатор надеялся избежать; за несколько дней более 100 000 человек бежали из близлежащих городов. Медленно водород удалялся из системы по мере охлаждения реактора, и через несколько дней все испытания закончились."
 usanews.4.d: "На втором энергоблоке Три-Майл-Айленд недалеко от Гаррисберга, штат Пенсильвания, США, произошла серьезная авария. Из-за того, что важный клапан не работал должным образом, была потеряна вода для охлаждения активной зоны, части активной зоны расплавились, а остальная ее часть была разрушена, а большое количество продуктов деления было выброшено из системы первого реактора внутрь реактора. Отказ оборудования усугубился ошибкой оператора реактора, так как система аварийного охлаждения активной зоны была отключена действиями оператора из-за неправильной интерпретации типа произошедшей аварии.\nКомпания-владелец станции преуменьшила значение кризиса и заявила, что никакого излучения обнаружено не было за пределами территории завода, но в тот же день инспекторы обнаружили поблизости слегка повышенный уровень радиации. Тем не менее этот инцидент сильно подорвал веру общества в ядерную энергетику."