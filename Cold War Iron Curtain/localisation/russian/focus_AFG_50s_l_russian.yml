 AFG_Revoke_all_British_Treaties_desc:0 "Парламент принял решение отменить все договоры, которые бывшие афганские правительства подписали с британцами, включая соглашение о линии Дюранда, и таким образом провозгласил, что афганское правительство не признает линию Дюранда как юридическую границу между Афганистаном и Пакистаном."
