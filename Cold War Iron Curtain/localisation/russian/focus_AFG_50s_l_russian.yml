 AFG_The_Afghani_Economy:0 "Экономика Афганистана"
 AFG_The_Elections_of_1949:0 "Выборы 1949 года"
 AFG_The_Elections_of_1949_desc:0 "Парламентские выборы в Афганистане 1949 года состоялись после того, как была издана королевская прокламация, призывающая народ избрать Национальное собрание. Выборы определили состав седьмого афганского парламента."
 AFG_The_1950_Coup_Attempt:0 "Попытка переворота в 1950 году"
 AFG_Establish_the_Helmand_Valley_Aurhority:0 "Учредить Управление долины Гильменд"
 AFG_Establish_the_Helmand_Valley_Aurhority_desc:0 "HVA была создана для управления экономическим развитием Гильмендской долины, в основном за счет ирригации и освоения сельскохозяйственных земель вдоль реки Гильменд, в рамках плана, который, по прогнозам, будет иметь первостепенное значение для будущей экономики Афганистана.."
 AFG_Construct_the_Kajaki_Dam:0 "Строительство плотины Каджаки"
 AFG_Construct_the_Kajaki_Dam_desc:0 "Расположенная на реке Гильменд, плотина производит электроэнергию и помогает орошать около 650 000 акров земли. Плотина была построена в 1951-1953 годах фирмой "Моррисон-Кнудсен" в рамках проекта Управления долины Гильменд."
 AFG_Secure_American_Finanacing:0 "Надежное американское финансирование"
 AFG_Join_the_Point_Four_Program:0 "Присоединиться к программе четвертого пункта"
 AFG_Join_the_Point_Four_Program_desc:0 "После Второй мировой войны Соединенные Штаты оказались в состоянии холодной войны против СССР. Администрация Трумэна пришла к идее программы технической помощи как средства завоевания \"сердец и умов\" развивающегося мира после того, как страны Ближнего Востока, Латинской Америки, Азии и Африки пожаловались на то, что США делают упор на помощь европейцам."
 AFG_Build_the_Arghandab_Dam:0 "Строительство плотины Аргандаб"
 AFG_Build_the_Arghandab_Dam_desc:0 "Первоначально плотина Аргандаб была построена в 1950-1952 годах, когда отношения между Афганистаном и США начали быстро развиваться. Целью строительства плотины было помочь фермерам в провинции Кандагар и обеспечить чистой питьевой водой город Кандагар."
