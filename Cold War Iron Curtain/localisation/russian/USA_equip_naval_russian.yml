l_russian:
 #Battleship/Battlecruiser Hulls in research tree# 

 USA_battle_hull_medium_0:0 "Линейный корабль типа «Айова»"
 USA_battle_hull_medium_1:0 "Линейный корабль типа «Айова» первой модификации"
 USA_battle_hull_medium_2:0 "Линейный корабль типа «Айова» второй модификации"
 USA_battle_hull_medium_3:0 "Крейсер типа «Базовый»"(CGBL)"
 USA_battle_hull_medium_4:0 "Эскадренный миноносец типа «Замволт»"
 USA_battle_hull_medium_0_desc:0 "Более продвинутый корпус линкора конца Второй мировой войны, эти корабли быстры и довольно проворны для своего размера, с отличным вооружением для своего времени и возможностью модернизироваться новым оборудованием практически бесконечно."
 USA_battle_hull_medium_1_desc:0 "Большой крейсер или линейный крейсер эпохи холодной войны, вооруженный разнообразным вооружением. Некоторые из них до сих пор вооружены крупнокалиберными орудиями минувших дней, а другие оснащены новыми ракетами класса «корабль-воздух» и «корабль-поверхность»."
 USA_battle_hull_medium_2_desc:0 "Управляемый большой крейсер или линейный крейсер эпохи холодной войны, вооруженный различными системами вооружения для ракетных сражений «корабль-корабль», «корабль-поверхность» или «корабль-воздух»."
 USA_battle_hull_medium_3_desc:0 "Эпоха холодной войны требовала появление новых средств борьбы с авиацией, а также большого смертоносного набора ракетных систем для конкретных задач."
 USA_battle_hull_medium_4_desc:0 "Современный ракетный крейсер, вооруженный новейшими ракетными системами или ранними технологиями рельсотрона, может нанести удар из-за горизонта, как никакой другой корабль до него."
  
 #Carrier Hulls in research tree#

 USA_carrier_hull_0:0 "Авианосец типа «Мидуэй»"
 USA_carrier_hull_1:0 "Авианосец типа «Форрестол»"
 USA_carrier_hull_2:0 "Авианосец типа «Мидуэй» первой модификации"
 USA_carrier_hull_3:0 "Авианосец типа «Средний»(CVV)"
 USA_carrier_hull_4:0 "Корабль морского контроля(SCS)"
 USA_carrier_hull_0_desc:0 "Корабли класса CVB-41 (тогда безымянные) были первоначально задуманы в 1940 году как проектное исследование для определения влияния включения бронированной полетной палубы на авианосец размером с класс Essex. Полученные расчеты показали, что эффективным будет уменьшение размера авиагруппы - в результате корабль будет иметь авиагруппу из 64 человек по сравнению с 90-100 для стандартных авианосцев класса Эссекс. По мере его развития на конструкцию также сильно повлиял военный опыт бронетранспортеров Королевского флота."
 USA_carrier_hull_1_desc:0 "Авианосцы типа «Форрестол» представляли собой четыре авианосца, спроектированных и построенных для ВМС США в 1950-х годах. Корабль класса был назван в честь Джеймса Форрестола, первого министра обороны США. Это был первый класс суперавианосцев, сочетающий большой тоннаж, бортовые лифты и наклонную палубу. Первый корабль был сдан в 1955 году, последний списан в 1998 году."
 USA_carrier_hull_2_desc:0 "Модернизация авианосцев класса «Мидуэй». Первоначально только USS Midway прошла обширную программу расширения и реконструкции, которая оказалась спорной и нефтяной, и поэтому не повторялась на других кораблях."
 USA_carrier_hull_3_desc:0 "Авианосец «Средний» (CVV) был американским проектом авианосца с обычным (то есть неатомным) двигателем, предложенным в 1970-х годах. Он должен был быть меньше и дешевле, чем современный атомный класс Нимиц. Планировался единственный экземпляр, но он не был построен, вместо него были построены другие авианосцы класса Нимиц."
 USA_carrier_hull_4_desc:0 "Корабль морского контроля(SCS) был авианосцем, разработанным и концептуализированным ВМС США под руководством начальника военно-морских операций Элмо Зумвальта в 1970-х годах. В настоящее время этот термин относится к военно-морским судам, которые могут выполнять аналогичные обязанности. SCS задумывался как эскортное судно, обеспечивающее авиационную поддержку конвоев. Он был отменен после сокращения бюджета ВМС США."
 
 USA_carrier_hull_light_0:0 "Авианосец типа «Индепенденс»"
 USA_carrier_hull_light_1:0 "Десантный вертолётоносец типа «Иводзима»"
 USA_carrier_hull_light_2:0 "Универсальный десантный корабль типа «Тарава»"
 USA_carrier_hull_light_3:0 "Универсальный десантный корабль типа «Уосп»"
 USA_carrier_hull_light_4:0 "Универсальный десантные корабль типа «Америка»"
 USA_carrier_hull_light_0_desc:0 "Авианосцы типа «Индепенденс» — класс легких авианосцев, построенных для ВМС США во время Второй мировой войны."
 USA_carrier_hull_light_1_desc:0 "Десантные вертолётоносцы типа «Иводзима» ВМС США были первыми десантными кораблями, спроектированными и построенными как специальные вертолетоносцы, способными использовать до 20 вертолетов для перевозки до 1800 морских пехотинцев на берег."
 USA_carrier_hull_light_2_desc:0 "Универсальный десантный корабль класса «Тарава» - это корабль типа десантно-штурмовых вертолётоносцев (LHA), используемый ВМС США. Пять кораблей были построены Ingalls Shipbuilding в период с 1971 по 1980 год; были запланированы еще четыре корабля, но позже они были отменены; вместо этого к ним присоединились десантные корабли типа «Оса»."
 USA_carrier_hull_light_3_desc:0 "«Уосп» - это класс десантных вертолётоносных кораблей-доков (LHD), находящихся в ведении ВМС США. Основан на классе «Тарава» с модификациями для управления более совершенными самолетами и десантными кораблями."
 USA_carrier_hull_light_4_desc:0 "«Америка» (ранее класс LHA (R)) - это корабль десантно-штурмовых вертолётоносцев (LHA) ВМС США. Этот класс предназначен для высадки на берег экспедиционного подразделения морской пехоты с использованием вертолетов и транспортных самолетов MV-22B Osprey V/STOL при поддержке самолетов AV-8B Harrier II или F-35 Lightning II V/STOL и различных ударных вертолетов."
 
 USA_carrier_hull_super_1:0 "Авианосец типа «Китти-Хок»"
 USA_carrier_hull_super_2:0 "Авианосец типа «Нимиц»"
 USA_carrier_hull_super_3:0 "Авианосец типа «Теодор Рузвельт»"
 USA_carrier_hull_super_4:0 "Авианосец типа «Рональд Рейган»"
 USA_carrier_hull_super_1_desc:0 "Наступление ядерной эры и использование малых морских реакторов позволяет этим крупным кораблям не только нести большие воздушные крылья, но и позволяет им оставаться в море практически бесконечно."
 USA_carrier_hull_super_2_desc:0 "Обновленный дизайн суперавианосца с более эффективными реакторами и возможностью нести еще больше самолетов."
 USA_carrier_hull_super_3_desc:0 "Усовершенствованный дизайн суперавианосца поздней холодной войны с большим количеством самолетов и улучшенными реакторами."
 USA_carrier_hull_super_4_desc:0 "Современный дизайн суперавианосца с улучшенными реакторами, большим количеством самолетов и возможностью их быстрого и эффективного запуска с использованием улучшенных катапульт."
 
 # Submarine Hulls #
 USA_sub_hull_small_single_0:0 "Подводная лодка типа «Дартер»"
 USA_sub_hull_small_single_0_desc:0 "USS Darter (SS-576), уникальная подводная лодка, основанная на классе Tang, но включающая в себя множество улучшений, стала вторым кораблем ВМС США, названным в честь дартера, разновидности небольшой американской пресноводной рыбы."
 USA_sub_hull_small_single_1:0 "Подводная лодка типа «Барбел»"
 USA_sub_hull_small_single_1_desc:0 "Подводные лодки типа «Барбел», последние дизель-электрические ударные подводные лодки, построенные ВМС США, включали в себя многочисленные радикальные инженерные усовершенствования по сравнению с предыдущими классами. Это были первые серийные боевые корабли, построенные с каплевидным корпусом, впервые испытанные на экспериментальном авианосце USS Albacore (AGSS-569), и первые, в которых центр управления, центр атаки и боевая рубка совмещены в одном пространстве корпуса."
 USA_sub_hull_small_single_2:0 "Подводная лодка типа «Стерджен»"
 USA_sub_hull_small_single_2_desc:0 "Тип «Стерджен» (известный в военно-морских кругах как класс 637) был серией атомных быстроходных ударных подводных лодок (SSN), находившихся на вооружении ВМС США с 1960-х по 2004 год. Они были «рабочими лошадками» нападения ВМФ. Были частью подводного флота США на протяжении большей части холодной войны."
 USA_sub_hull_small_single_3:0 "Подводная лодка типа «Сивулф»"
 USA_sub_hull_small_single_3_desc:0 "Тип «Сивулф» — это серия атомных быстроходных подводных лодок (SSN), находящихся на вооружении ВМС США. Этот класс был предполагаемым преемником класса «Лос-Анджелес» и работа по проектированию началась в 1983 году."
 USA_sub_hull_small_single_4:0 "Подводная лодка типа «Вирджиния»"
 USA_sub_hull_small_single_4_desc:0 "Тип «Вирджиния», также известный как класс SSN-774, представляет собой класс быстроходных подводных лодок с крылатыми ракетами, находящихся на вооружении ВМС США. Разработанная General Dynamics Electric Boat (EB) и Huntington Ingalls Industries, подводная лодка класса «Вирджиния» является новейшей моделью подводной лодки ВМС США, которая включает в себя новейшие технологии в области малозаметности, сбора разведданных и систем вооружения."

 USA_sub_hull_large_single_0:0 "Подводная лодка типа «Тенч»"
 USA_sub_hull_large_single_0_desc:0 "Подводные лодки класса «Тенч» были типом подводных лодок, построенных для ВМС США (USN) между 1944 и 1951 гг. улучшенная внутренняя планировка."
 USA_sub_hull_large_single_1:0 "Подводная лодка типа «Скейт»"
 USA_sub_hull_large_single_1_desc:0 "Подводные лодки типа «Скейт» были первой производственной партией атомных подводных лодок ВМС США. Они были эволюцией класса «Тенч» во всем, за исключением их двигательных установок, которые были основаны на действующем прототипе USS Nautilus. Четыре катера класса «Скейт» вновь получили кормовые торпедные аппараты."
 USA_sub_hull_large_single_2:0 "Подводная лодка типа «Скипджек»"
 USA_sub_hull_large_single_2_desc:0 "Тип «Скипджек» был классом атомных подводных лодок ВМС США (SSN), принятых на вооружение в 1959-61 гг. Этот класс был назван в честь его головного корабля USS Skipjack. Новый класс представил атомным подводным лодкам США каплевидный корпус и реактор S5W."
 USA_sub_hull_large_single_3:0 "Подводая лодка типа «Лос-Анджелес» первой модификации"
 USA_sub_hull_large_single_3_desc:0 "Подводные лодки класса «Лос-Анджелес» — это атомные быстроходные ударные подводные лодки (SSN), находящиеся на вооружении ВМС США. Также известный как класс 688 (произносится как «шесть-восемьдесят восемь») по номеру корпуса головного корабля USS Los Angeles (SSN-688), 62 корабля были построены с 1972 по 1996 год, последние 23 - по улучшенному стандарту 688i."
 USA_sub_hull_large_single_4:0 "Подводая лодка типа «Лос-Анджелес» второй модификации"
 USA_sub_hull_large_single_4_desc:0 "Подводные лодки класса «Лос-Анджелес» — это атомные быстроходные ударные подводные лодки (SSN), находящиеся на вооружении ВМС США. Также известный как класс 688 (произносится как «шесть-восемьдесят восемь») по номеру корпуса головного корабля USS Los Angeles (SSN-688), 62 корабля были построены с 1972 по 1996 год, последние 23 - по улучшенному стандарту 688i."

 USA_sub_hull_large_double_0:0 "Подводная лодка типа «Грейбэк»"
 USA_sub_hull_large_double_0_desc:0 "Подводная лодка типа «Грейбэк» — класс двух подводных лодок с управляемыми ракетами ВМС США. Они несли ядерные крылатые ракеты Regulus I и Regulus II, развернутые в 1957–64 годах, которые были быстро выведены из эксплуатации баллистическими ракетами подводных лодок Polaris (БРПЛ)."
 USA_sub_hull_large_double_1:0 "Подводныя лодка типа «Джордж Вашингтон»"
 USA_sub_hull_large_double_1_desc:0 "«Джордж Вашингтон» был классом атомных подводных лодок с баллистическими ракетами, развернутых ВМС США. Джордж Вашингтон вместе с более поздними классами Итана Аллена, Лафайета, Джеймса Мэдисона и Бенджамина Франклина входили в группу подводных лодок «41 за свободу», которая представляла собой основной вклад ВМС в силы ядерного сдерживания в конце 1980-х годов."
 USA_sub_hull_large_double_2:0 "Подводная лодка типа «Огайо»"
 USA_sub_hull_large_double_2_desc:0 "Класс атомных подводных лодок «Огайо» включает 14 подводных лодок с баллистическими ракетами (ПЛАРБ) ВМС США и четыре подводные лодки с крылатыми ракетами (ПЛАРК). Подводные лодки класса «Огайо» водоизмещением 18 750 тонн каждая являются крупнейшими подводными лодками, когда-либо построенными для ВМС США. Это третьи по величине подводные лодки в мире."
 USA_sub_hull_large_double_3:0 "Подводная лодка типа «Колумбия»"
 USA_sub_hull_large_double_3_desc:0 "Подводная лодка класса «Колумбия», ранее известная как подводная лодка-заменитель «Огайо» и ПЛАРБ-X Future Follow-on Submarine, представляет собой будущий класс атомных подводных лодок, предназначенный для замены подводных лодок с баллистическими ракетами класса «Огайо» в ВМС США."

 # Screen Hulls #

 USA_screen_hull_medium_0:0 "Эскортный миноносец типа «Джон Батлер»"
 USA_screen_hull_medium_0_desc:0 "Был эсминцем сопровождения, возникшим во время Второй мировой войны. Головным кораблем был USS John C. Butler, введенный в строй 31 марта 1944 года."
 USA_screen_hull_medium_1:0 "Фрегат типа «Бронштейн»"
 USA_screen_hull_medium_1_desc:0 "Фрегаты класса «Бронштейн» были боевыми кораблями ВМС США, первоначально заложенными как океанские эскорты (ранее называвшиеся эсминцами сопровождения), но все они были переименованы в фрегаты 30 июня 1975 года в ходе реклассификации кораблей ВМС США в 1975 году, а их обозначение корпуса изменилось с DE на ФФ."
 USA_screen_hull_medium_2:0 "Фрегат типа «Нокс»"
 USA_screen_hull_medium_2_desc:0 "46 фрегатов класса «Нокс» были самыми большими и самыми многочисленными противолодочными кораблями ВМС США второго поколения сопровождения. Первоначально заложенные как океанские эскорты (ранее называвшиеся эскортами эсминцев), все они были переименованы в фрегаты 30 июня 1975 года в плане реклассификации кораблей 1975 года, а их обозначение корпуса изменилось с «DE» на «FF». Класс «Нокс» был последним эсминцем ВМФ с паротурбинной силовой установкой."
 USA_screen_hull_medium_3:0 "Фрегат типа «Оливер Хазард Перри»"
 USA_screen_hull_medium_3_desc:0 "«Оливер Хазард Перри» — класс фрегатов с управляемыми ракетами, названный в честь американского коммодора Оливера Хазарда Перри, героя морской битвы у озера Эри. Эти военные корабли, также известные как класс Perry или FFG-7 (обычно «фиг.7»), были спроектированы в Соединенных Штатах в середине 1970-х годов как универсальные эскортные суда, достаточно недорогие, чтобы их можно было покупать в больших количествах."
 USA_screen_hull_medium_4:0 "Прибрежный боевой корабль типа «Индепенденс»"
 USA_screen_hull_medium_4_desc:0 "Класс «Индепенденс» — это серия прибрежных боевых кораблей, построенных для ВМС США."
 
 USA_screen_hull_heavy_0:0 "Эскадренный миноносец типа «Аллен М. Самнер»"
 USA_screen_hull_heavy_0_desc:0 "«Аллен М. Самнер» представлял собой группу из 58 эсминцев, построенных Соединенными Штатами во время Второй мировой войны. Еще двенадцать кораблей были достроены как эсминцы-минные заградители. Класс был назван в честь Аллена Меланхтона Самнера, офицера морской пехоты США."
 USA_screen_hull_heavy_1:0 "Эскадренный миноносец типа «Чарльз Ф. Адамс»"
 USA_screen_hull_heavy_1_desc:0 "«Чарльз Ф. Адамс» - это серия из 29 эсминцев с управляемыми ракетами (DDG), построенных в период с 1958 по 1967 год. Двадцать три были построены для ВМС США, три - для Королевского флота Австралии и три - для бундесмарина Западной Германии. Конструкция этих кораблей (известных как проект SCB 155) была основана на конструкции эсминцев класса «Форрест Шерман», но класс «Чарльз Ф. Адамс» был первым классом, предназначенным для использования в качестве эсминцев с управляемыми ракетами."
 USA_screen_hull_heavy_2:0 "Эскадренный миноносец типа «Спрюэнс»"
 USA_screen_hull_heavy_2_desc:0 "Эсминец класса Spruance был разработан Соединенными Штатами для замены многих эсминцев класса «Аллен М. Самнер» и «Гиринг», построенных во время Второй мировой войны, и был основным эсминцем, построенным для ВМС США в 1970-х и 1980-х годах. Он был назван в честь адмирала ВМС США Рэймонда А. Спруанса, который успешно руководил крупными морскими сражениями на Азиатско-Тихоокеанском театре военных действий во время Второй мировой войны, такими как битва за Мидуэй и битва в Филиппинском море."
 USA_screen_hull_heavy_3:0 "Эскадренный миноносец типа «Арли Бёрк» первой модификации"
 USA_screen_hull_heavy_3_desc:0 "Класс эсминцев с управляемыми ракетами (DDG) «Арли Бёрк» - это эсминец класса ВМС США, построенный на основе боевой системы Aegis и многофункциональной пассивной антенной решетки с электронным сканированием SPY-1D. Класс назван в честь адмирала Арли Берка, офицера американского эсминца во время Второй мировой войны, а затем начальника военно-морских операций. Головной корабль, USS Arleigh Burke, был введен в строй еще при жизни адмирала Берка."
 USA_screen_hull_heavy_4:0 "Эскадренный миноносец типа «Арли Бёрк» второй модификации"
 USA_screen_hull_heavy_4_desc:0 "Класс эсминцев с управляемыми ракетами (DDG) «Арли Бёрк» - это эсминец класса ВМС США, построенный на основе боевой системы Aegis и многофункциональной пассивной антенной решетки с электронным сканированием SPY-1D. Класс назван в честь адмирала Арли Берка, офицера американского эсминца во время Второй мировой войны, а затем начальника военно-морских операций. Головной корабль, USS Arleigh Burke, был введен в строй еще при жизни адмирала Берка."
 
 USA_battle_hull_light_0:0 "Лёгкий крейсер типа «Кливленд»"
 USA_battle_hull_light_0_desc:0 "Класс «Кливленд» — группа легких крейсеров, построенных для ВМС США во время Второй мировой войны. Это был самый многочисленный класс легких крейсеров из когда-либо построенных."
 USA_battle_hull_light_1:0 "Ракетный крейсер типа «Лонг Бич»"
 USA_battle_hull_light_1_desc:0 "USS Long Beach (CLGN-160/CGN-160/CGN-9) был атомным ракетным крейсером ВМС США и первым в мире надводным кораблем с ядерной силовой установкой. Это был третий корабль ВМФ, названный в честь города Лонг-Бич, штат Калифорния."
 USA_battle_hull_light_2:0 "Крейсер типа «Белкнап»"
 USA_battle_hull_light_2_desc:0 "Крейсера типа «Белкнап» представляли собой класс однокорпусных ракетных крейсеров (их ракетное вооружение устанавливалось только в носовой части, в отличие от «двухсторонних» ракетных крейсеров с ракетным вооружением, установленным как в носовой, так и в кормовой части), построенных для ВМС США в 1960-е гг."
 USA_battle_hull_light_3:0 "Ракетный крейсер типа «Тикондерога» первой модификации"
 USA_battle_hull_light_3_desc:0 "Ракетные крейсера класса «Тикондерога» — класс военных кораблей ВМС США, впервые заказанный и утвержденный в 1978 году. Этот класс использует пассивный радар с фазированной антенной решеткой и изначально планировался как класс эсминцев. Тем не менее, боевая система Aegis Combat System и радиолокационная система AN/SPY-1 обладают повышенной боеспособностью, а также возможностью работать в качестве флагмана."
 USA_battle_hull_light_4:0 "Ракетный крейсер типа «Тикондерога» второй модификации"
 USA_battle_hull_light_4_desc:0 "Ракетные крейсера класса «Тикондерога» — класс военных кораблей ВМС США, впервые заказанный и утвержденный в 1978 году. Этот класс использует пассивный радар с фазированной антенной решеткой и изначально планировался как класс эсминцев. Тем не менее, боевая система Aegis Combat System и радиолокационная система AN/SPY-1 обладают повышенной боеспособностью, а также возможностью работать в качестве флагмана."
 