l_english:
 BM_HISTORY_TITLE: "Краткая история"
 GATHERING_STORM_NAME: "Железный занавес"
 GATHERING_STORM_DESC: "Послевоенный оптимизм в отношении глобального сотрудничества и мира, воплощенный в создании ООН, быстро испарился. Во время последней войны европейские империи истощили не только свою собственную землю, но и свои колониальные территории. Теперь народы по всей Африке и Азии требуют независимости. В глобальном масштабе США и СССР сейчас значительно превосходят любую другую державу. Начавшееся идеологическое соперничество быстро охладило их дружбу военного времени. Идеалогическое разделение на капиталистов и коммунистов продолжает перекраивать Европу."
 ENG_GATHERING_STORM_DESC: "Эпоха британского империализма подошла к концу. В ее колониях по всему миру растет популярность как националистических, так и коммунистических движений. По мере того как мировая мощь Соединенного Королевства ослабевает, оно надеется, что его западные союзники защитят его от угрозы коммунизма, которая сейчас ближе, чем когда-либо. Страхи Освальа Мосли уже прошли, теперь страх перед коммунизмом захватывает сердца Британского Содружества."
 CAN_GATHERING_STORM_DESC: "Canada left the Great War as a nation, and has left the last war as a power in her own right. Increasingly independent of London, Canada has become a prosperous nation with a strong economy and modern military. For the first time in her history, Canada has the chance to write her own destiny. Will the True North stay strong and free?"
 KOR_GATHERING_STORM_DESC: "Наконец-то освободившись от американской и японской оккупации, вновь созданная Республика Корея надеялась на мирное воссоединение со своими разлученными соотечественниками выше 38-й параллели. Но после подозрительного убийства единственного высокопоставленного политика, готового вести переговоры с Севером, и решительного антикоммуниста Ли Сын Мана, победившего на президентских выборах, эта надежда быстро угасла. США, возможно, передали ключи, но ни одна Корея не контролирует ситуацию, и между республиками, претендующими на полуостров, конфликт неизбежен."
 WGR_GATHERING_STORM_DESC: "Некогда великая немецкая нация была вновь повержена. Когда слава Германской империи осталась лишь отдаленным воспоминанием, а эйфория от своих завоеваний всего лишь несколькими годами ранее омрачена стыдом и разочарованием, немецкий народ снова оказывается под дулом пистолета. Занятые обеими сверхдержавами мира, они являются шахматной доской для их политических игр. Народ Германии устал, и ему предстоит еще многое восстановить. Все, что осталось, - это надежда на деэскалацию и воссоединение со своими восточными собратьями."
 DDR_GATHERING_STORM_DESC: "При советском военном губернаторстве народ Восточной Германии оказался под властью тех самых людей, которых он угнетал. Моральный дух находится на низком уровне, но ситуация улучшается по мере того, как разрабатываются планы создания ГДР. При советском руководстве строительство идет хорошо, но жизнь трудна, так как общество стало строго регламентированным и вся вина за войну ложится на их плечи. Уже сейчас значительная часть населения полностью приняла коммунистическую идеологию, создав идеологический разрыв между двумя Германиями, который будет длиться на протяжении многих поколений…"
 KPA_GATHERING_STORM_DESC: "Вскоре после провозглашения Республики Корея революционер Ким Ир Сен вместе с советской гражданской администрацией подготовил проект Конституции КНДР. Теперь, независимо от советского контроля и имея границы с двумя могущественными коммунистическими нациями, Ким готов освободить своих товарищей ниже 38-й параллели. Имея советскую технику, китайскую рабочую силу и объединенное население в рамках системы чучхе, война за воссоединение Кореи должна была стать легкой прогулкой..."
 PRC_GATHERING_STORM_DESC: "Японцы потерпели поражение, и перемирие с Гоминьданом было нарушено. Народно-освободительная армия выросла в геометрической прогрессии, и с помощью техники, оставленной японцами, Народная Республика готова обеспечить безопасность остальной части Китая. Несмотря на минимальную помощь со стороны Советского Союза, руководство Мао Цзэдуна после Великого похода позволило китайскому коммунизму процветать. Еще несколько ключевых городов-и Китай, наконец, будет объединен!"
 SOV_GATHERING_STORM_DESC: "Благодаря самопожертвованию миллионов отважных коммунистов, фашизм по большей части был стерт с лица Земли. Но за павшим чудовищем скрывается еще большая угроза. Угроза капитализма. Только Советский Союз может встать на защиту мира от очередной империалистической системы. Народы мира нуждаются в сильной направляющей руке, и нет лучшего кандидата, чем Советский Союз. Коммунизм набирает обороты, и товарищ Сталин прекрасно это знает..."
 POL_GATHERING_STORM_DESC: "После Второй мировой войны Польша оказалась в руках Советского Союза. Болеслав Бирута, считающийся близким союзником и идеологическим учеником Сталина, является бесспорным лидером Польши. Польскому государству предстоит долгий путь, но если оно сможет избежать гнева народа и укрепить его веру в социализм, возможно, ужасы Второй мировой войны останутся в прошлом."
 CZE_GATHERING_STORM_DESC: "Оставшаяся под советским надзором после войны, Коммунистическая партия Чехословакии установила полный контроль над страной в 1948 году в результате переворота, поддержанного Советским Союзом. Несмотря на то, что Чехословакия остается однопартийным государством при коммунистическом правлении, она сталкивается с растущим давлением со стороны Москвы, требующей очистить страну от нелояльных элементов. В ближайшие годы ради революции придется пожертвовать многим."
 BUL_GATHERING_STORM_DESC: "Во время Второй мировой войны Болгария воевала на стороне стран Оси, но когда удача отвернулась от Гитлера, возглавляемый коммунистами Отечественный фронт сверг профашистское правительство и заключил мир с СССР. В 1946 году монархия была упразднена, и с тех пор социалистическую Болгарию возглавляет бывший глава Коминтерна и близкий соратник Сталина Георгий Димитров. Похоже, что, по крайней мере на данный момент, София и Москва неразделимы."
 ROM_GATHERING_STORM_DESC: "Румыния сражалась бок о бок с Гитлером в ходе операции «Барбаросса», где, возможно, пророчески румынская армия была разгромлена под Сталинградом. Вскоре после этого тёзка города утвердил коммунистическое правление в Румынии, упразднив монархию и создав рабочую республику советского образца. Теперь партия сталкивается с расколом между поддерживаемой СССР «тюремной фракцией» и более умеренной «московской фракцией» во главе с Аной Паукер."
 ALB_GATHERING_STORM_DESC: "29 ноября 1944 года Албанский фронт освобождения под руководством Энвера Ходжи полностью освободил всю Албанию от оккупации стран Оси. Слабая монархия осталась в прошлом, и была провозглашена Народная Республика Албания. Энвер Ходжа — непреклонный союзник Сталина и Мао, преданный революции до фанатизма. Однако если в Москве или Пекине произойдут перемены, Тирана может оказаться не готовой следовать за ними."
 PDG_GATHERING_STORM_DESC: "В течение последних трёх лет греки сражались против греков в ужасной гражданской войне по воле западных империалистов. Греческий народ имеет право самостоятельно определять свою судьбу, и для Коммунистической партии Греции этой судьбой является социализм. Пока что инициатива находится в руках марионеточного короля Запада, но сможет ли революция в конечном итоге одержать победу?"
 HUN_GATHERING_STORM_DESC: "На несколько коротких лет после окончания Великой войны Венгрия стала одним из первых коммунистических государств в мире. Не сумев соединиться со своими большевистскими союзниками, венгерская революция была подавлена. Двадцать пять лет спустя революция триумфально вернулась под знамёнами Советской армии, прочно закрепив Будапешт в советской сфере влияния. Сможет ли Москва удержать контроль, или перемены неизбежны?"
 USA_GATHERING_STORM_DESC: "С победой Соединенных Штатов во Второй мировой войне они позиционируют себя как чемпионов западной демократии. Решительно отстаивая свои капиталистические ценности, они яростно противостоят коммунистическому Востоку, возглавляемому Советским Союзом. Вместо демилитаризации после разрушений, вызванных Второй мировой войной, вооруженные силы страны продолжают расти, чтобы противостоять красной угрозе. Но теперь, когда ядерное оружие находится в распоряжении обеих сторон, могут ли Соединенные Штаты и Запад действительно выжить против такого грозного врага?"
 ISR_GATHERING_STORM_DESC: "Сионизм наконец-то достиг своих целей, и еврейское государство было создано, хотя не все так хорошо, поскольку Израиль выходит из своей войны за независимость со всеми своими соседями как нация на распутье.  Израиль, несмотря на свою стойкость, всегда должен быть готов к следующей катастрофе, следующей войне, и они не позволят 2000-летнему изгнанию начаться снова."
 YUG_GATHERING_STORM_DESC: "После Югославско-Советского раскола в 1948 году модель рыночного социализма Тито хорошо работала с финансированием из плана Маршалла Соединенных Штатов. Югославия, будучи сильно пострадавшей от итальянской и немецкой оккупации, оказалась с лучшим качеством жизни, чем любое другое коммунистическое государство. Однако их политическая стабильность была чем-то совершенно иным. Тито был любим своими соотечественниками, но его стратегия нейтралитета вызывала презрение как на Востоке, так и на Западе. При постоянных угрозах с обеих сторон, может ли Югославия сохранить себя как независимая социалистическая страна?"
 MON_GATHERING_STORM_DESC: "Под твердой рукой Хорлугина Чойбалсана Монголия находится на пути модернизации. Поддерживая прочные отношения с Советским Союзом, Монголия тем не менее пытается сохранить свою независимость. Хотя и не так плохо, как в 30-е годы, аресты и расстрелы все еще продолжаются по аналогии со Сталиным."
 SIK_GATHERING_STORM_DESC: "The East Turkestan Republic is a conundrum. Formally recognized by the world as a part of China, the civil war has left a power vacuum, and the local Uighurs have taken power under Soviet guidance. With the victory of Mao's communists likely, will Moscow stand by their erstwhile allies, or is East Turkestan doomed to be a footnote in history?"
 IRQ_GATHERING_STORM_DESC: "После арабо-израильской войны 1948 года Ирак может многое сделать на Ближнем Востоке, несмотря на свои потери в этой войне, однако он сталкивается с проблемой курдских повстанцев, совсем недавно вдохновленных восстанием Мустафы Барзани. Ирак зависит от британцев, которые имеют доступ к своей нефти через иракскую нефтяную компанию в обмен на помощь. В этом Хашимитском суде существует большой конфликт между новыми \"свободными\" военными офицерами и старым монархическим судом, который должен быть разрешен."
 EGY_GATHERING_STORM_DESC: "Говорят, что султанат Египта обрел независимость в 1922 году, однако большая часть населения не верит, что это правда в чем-то большем, чем название. Король Фарук рассматривается многими египтянами как ключевой инструмент британского контроля над Суэцким каналом. Существует оппозиция правящему монарху во всех кругах: правительственном, гражданском и военном. Это воля египетских и Панарабских националистов освободить Суэц из рук британцев. Дальнейшее правление короля Фарука выглядит маловероятным без экстраординарной британской поддержки."
 SYR_GATHERING_STORM_DESC: "Путь Сирийской республики к независимости был отмечен проблемами, а после обретения независимости она видит еще больше проблем. Наряду с неудачной попыткой сорвать формирование Израиля, правительство Шукри аль-Куватли было свергнуто в результате поддерживаемого США военного переворота. Хотя генерал Хусни Аль-Заим удобно сидит на троне, другие генералы ждут своей очереди узурпировать лидерство. Когда Сирия сможет разорвать цепи диктатуры? Сможет ли она достичь величия?"
 JAP_GATHERING_STORM_DESC: "Имперские амбиции Японии были подавлены союзниками. Теперь, находясь под американской оккупацией, эта бывшая имперская держава пытается оправиться от разрушительных бомбардировок, с которыми она столкнулась во время Второй мировой войны. Как будет выглядеть будущее Японии? Пойдут ли они по новому демократическому пути или предпримут что-то более радикальное?"
 PHI_GATHERING_STORM_DESC: "Филиппины получили независимость от Соединённых Штатов всего несколько лет назад и сохраняют тесный союз с бывшим владыкой перед лицом растущей коммунистической угрозы как внутри страны, так и за её пределами. Молодая страна нестабильна: коммунистические партизаны и политические интриги угрожают охватить острова огнём. Филиппины стоят на перепутье, и предстоящие годы определят их будущее на десятилетия вперёд."
 SIA_GATHERING_STORM_DESC: "Таиланд вышел из Второй мировой войны территориально невредимым. Соединенные Штаты поддерживали новый демократический режим, и стране оставалось только отказаться от своих территориальных завоеваний. Несмотря на проведение выборов, подозрительная смерть короля Махидола ввергла страну в политический хаос. Военные захватили власть в 1947 году и вернули к власти премьер-министра военного времени Тибуна. Премьер-министр сейчас курирует послевоенный экономический бум, жесткое подавление оппозиции и более глубокие отношения с Соединенными Штатами. Таиланд предлагает себя в качестве оплота антикоммунизма в Юго-Восточной Азии."
 CUB_GATHERING_STORM_DESC: "Президент Рамон Грау поручил радикалам провести ряд реформ и в 1934 году отменил ненавистную поправку Платта. Однако это правительство рухнуло после военного переворота. В 1940 году Фульхенсио Батиста стал президентом, но в 1944 году Рамон Грау вернулся к власти. Президент Грау курировал больше реформ, но экономический бум военного времени привел к безудержной коррупции и политическому, а также криминальному насилию. Новоизбранный президент Карлос Соккарас обещает вернуться к Демократической цивилизованности и реформам, но коррупция не ослабевает."
 DOM_GATHERING_STORM_DESC: "Доминиканская Республика находится под железной кулаком генералиссимуса Рафаэля Трухильо с 1930 года. Народ страдает от его тирании, но все, кто пытался противостоять ему, погибали от рук тайной полиции под командованием его верного пса, лейтенанта Джонни Аббеса Гарсии. Кажется, что пока для доминиканского народа нет никакой надежды. Но как долго можно держать народ в напряжении?"
 BEL_GATHERING_STORM_DESC: "Бельгия, подвергшаяся вторжению, оккупации и освобождению во второй раз в XX веке, переживает особенно тяжелые времена после Второй мировой войны. Ее промышленность и экономика разрушены, вооруженные силы крайне малочисленны, а колониальные дела стабильны, но в лучшем случае шатки. С политической точки зрения Бельгия является демократическим государством, но король обладает огромной властью в сознании народа, а бельгийские коммунисты не дают ему покоя..."
 RAJ_GATHERING_STORM_DESC: "После столетий иностранного гнета, недавно провозглашенное господство Индии, наконец-то завоевало свое место на мировой арене, и через кровавую бойню двух мировых войн, угрозу голода и ужасный натиск в войне на Тихом океане, индийский народ находится на грани достижения независимости.\nНо такие усилия привели к большой цене; огонь, зажженный в сердцах индийского народа такими людьми, как Ганди, может стать националистическим адом, если его не остановить. Индийский народ должен действовать осторожно, если хочет выжить."
 KEN_GATHERING_STORM_DESC: "Кения, мягко говоря, не является образцовой колонией. В то время как большинство жителей материковой части Великобритании вряд ли когда-нибудь задумаются об этой нации в своей империи. Основанная в кульминационный момент борьбы за Африку, Кения в основном населена этническими кикуйю с заметным уровнем местного британского бизнеса. Как и в каждой африканской колонии, в Кении существует небольшое меньшинство антиколониальной и панафриканской студенческой молодежи и интеллигенции, организованных в основном вокруг активиста Джомо Кениаты."
 UGA_GATHERING_STORM_DESC: "По сравнению с другими британскими колониями, в Уганде сохраняется более независимая администрация, позволяющая традиционным королевствам сохранять свои полномочия над племенами. Однако экономика по-прежнему находится в руках белых и азиатских поселенцев, которые не допускают коренных африканцев к прибыльной хлопковой промышленности. Эта политика, наряду с другими мерами, вызвала недовольство народа баганда. Возможно, независимость Уганды неизбежна?"
 ETH_GATHERING_STORM_DESC: "Мать-Эфиопия, Эфиопская империя-это многоэтническая и религиозно разнообразная нация, в которой проживает около 18 миллионов человек. Эфиопия страдает от засухи и голода, а большинство ее граждан-неграмотны, и если корона хочет модернизировать свою страну так, как она намеревается, ей придется решать эти важнейшие проблемы. Эфиопская Империя, по-видимому, находится на пике своей стабильности. Эфиопия имеет много возможностей, доступных им в это время, когда отсутствует внутренний конфликт."
 VIE_GATHERING_STORM_DESC: "Руководствуясь французами, государство Вьетнам является противоположностью коммунистическому Вьетминю. Только время покажет, кто победит."
 SAF_GATHERING_STORM_DESC: "Южная Африка вышла победителем во Второй Мировой, поскольку она неустанно сражалась за западных союзников. Положение Южной Африки в международном сообществе растет в то время, когда борьба третьего мира против колониализма все еще не вышла на первый план. Как и в 1919 году, Смэтс призвал делегатов создать мощный международный орган для сохранения мира. Однако внутренняя политическая борьба в недовольной и по существу обнищавшей африканской общине вскоре вышла на первый план, что привело к поражению Смэтса на выборах 1948 года от рук возрождающейся после войны Национальной партии."
 NGA_GATHERING_STORM_DESC: "Нигерия 1950-х годов - это колония, наполненная этнической напряженностью, которую колониальный режим крепко связал цепями автократического феодализма во главе с хауса-фулани северного региона. Нигерия может рассматриваться как идеальный африканский пример британской политики непрямого правления, поскольку эгалитарные общества двух второстепенных этнических групп, предприимчивых игбо и артистичных йоруба, сдерживаются более многочисленными и могущественными северянами, хауса-фулани. В отличие от Кении, где местная политика подавляется интересами британского бизнеса, здесь существуют очень заметные политические партии (хотя их избиратели полностью основаны на этнической принадлежности), борющиеся за представительство в колониальной ассамблее: Национальный совет Нигерии и Камеруна игбо под руководством доктора Ннамди Азикиве и Группа действий йоруба Обафеми Аволово составляют оппозицию Северному народному конгрессу сэра Абубакара Тафавы Балева"
 OTHER_DESC: "Народы мира, большие и малые, не все довольствуются тем, чтобы затаить дыхание в ожидании начала очередного глобального конфликта. От крупных держав, находящихся на грани гражданской войны, до многих государств, сформированных и преобразованных Второй мировой войной, всем придется принимать трудные решения и сочетать идеалы с прагматизмом, чтобы иметь влияние на будущее мира."
 DECADE_CRISIS_NAME: "Десятилетие кризиса"
 DECADE_CRISIS_DESC: "Процесс деколонизации привел к тому, что страны в Азии добились свободы мирным путем. Теперь африканские народы борются за свободу с еще большим рвением, поскольку имперские державы сталкиваются с растущей волной протестов.На Ближнем Востоке арабский национализм обещает разрушить старые порядки. Соперничество США и СССР превратилось в тотальную борьбу за мировое влияние. Некоторые государства все больше разочаровываются в идеях сверхдержав."
 ETH_DECADE_CRISIS_DESC: "Эфиопия, вступающая в 1960-е годы, подвергается бомбардировке идеями современного мира. Эфиопия все больше пытается доказать свою актуальность в это время деколонизации и нестабильности в Африке, поскольку Хайле Селассие пытается конкурировать с растущими панафриканскими личностями, он пренебрегает внутренней политикой, сосредоточившись на внешней политике. В то время как большая часть Эфиопии полностью неграмотна и необразованна, в правительстве и среди интеллигенции все больше критикуется самодержавный характер правления Хайле Селассие и его неудачи в модернизации за счет дворянства. В эту эпоху лидер не может рассчитывать остаться у власти, основываясь на своей династической легитимности..."
 KEN_DECADE_CRISIS_DESC: "Хотя восстание Мау-Мау закончилось, в Кению надвигаются новые беды. В то время как многие считают деколонизацию Британской империи неизбежной, в колониальной ассамблее, напротив, существует сильная, очень громкая группа британских поселенцев и бизнесменов. С главным антиколониалистским активистом Джомо Кеньяттой, находящимся в тюрьме. Время покажет только то, как Кения войдет в мир как новое независимое государство."
 OILCRISIS_NAME: "Нефтяной кризис (Ранний доступ)"
 OILCRISIS_DESC: "Соперничество в холодной войне между США и СССР ослабевает, но это может легко измениться. Деколонизация почти завершена, хотя Португалия цепляется за свои колонии. Во всем мире соперничество и конфликты угрожают охватить весь мир. Глобальные потребности в нефти изменили экономическую мощь и влияния. Движение неприсоединения продолжается, но давление сверхдержав не ослабевает. Однако внутри лагерей сверхдержав нации все больше стремятся к самоутверждению."
 USA_DECADE_CRISIS_DESC: "Соединенные Штаты Америки являются крупным игроком в капиталистическом блоке. После того как Куба и Китай полностью погрузились в коммунизм, они готовы вмешаться всеми способами, чтобы остановить рост коммунизма в других азиатских странах или в Латинской Америке. Они восстановили Западную Европу и обеспечили капиталистическое господство над ней, теперь пришло время обеспечить капиталистическое господство над всем миром."
 SOV_DECADE_CRISIS_DESC: "Союз Советских Социалистических Республик де-Сталинизировал свою политику и стабилизировал свои внутренние проблемы. Теперь они сосредоточились на исследовании космоса и распространении своего влияния через объединение рабочих всего мира и внедрение коммунистического правительства во многих странах. Советский Союз растет. Сохранится ли экономический рост и политическое господство СССР или американцы поменяют свое место за столом переговоров?"
 DDR_DECADE_CRISIS_DESC: "Германская Демократическая Республика под руководством Ульбрихта продолжала следовать за Советским Союзом по большинству его вопросов с относительным успехом. Однако с наступлением нового десятилетия ГДР все еще страдает от многих проблем, наиболее заметной из которых является Республика Флюхт, в которой граждане ГДР бегут на Запад. Наряду с экономическими и внутренними проблемами, Ульбрихт должен действовать в ближайшее время или рисковать быть вытесненным, или еще хуже."
 PRC_DECADE_CRISIS_DESC: "Китайская Народная Республика вышла победителем из Гражданской войны в Китае. После изгнания Гоминьдана на Тайвань Мао сосредоточился на своем видении того, как сделать Китай великим. Однако за это время он столкнулся со многими препятствиями. Добьется ли Мао успеха или его забудут в истории?"
 CUB_DECADE_CRISIS_DESC: "Республика Куба, ныне находящаяся под властью Кастро, всего год назад стала коммунистической. Беспорядки и нестабильность привели к свержению Батисты в январе 1959 года Движением 26 июля, которое впоследствии установило коммунистическое правление под руководством Фиделя Кастро. В то время как США сначала благосклонно отнеслись к кубинской революции, легализация Кастро Коммунистической партии и последовавшие за этим сотни казней привели к ухудшению отношений между двумя странами. Остается только посмотреть, что принесет нам будущее, но это точно будет не мир."
 VIE_DECADE_CRISIS_DESC: "Республика Вьетнам была провозглашена 26 октября 1955 года, а ее первым президентом стал Нго Динь Дьем. Полная противоположность коммунистическому северу, юг поддерживается США. Всё это напоминает корейскую ситуацию. Не приведет ли и это к войне?"
 FRA_DECADE_CRISIS_DESC: "Французская республика только что реформировалась под руководством де Голля как Пятая Республика, возникшая после распада Четвертой республики, заменив бывшую парламентскую республику полупрезидентской системой. Де Голль, который был первым французским президентом, избранным при Пятой республике в декабре 1958 года, верит в сильного главу государства, которого он описывает как воплощение l'Esprit de la nation (\"Дух нации\")."
 ENG_DECADE_CRISIS_DESC: "Соединенное Королевство в связи с недавним Суэцким кризисом находится в трудном положении. С ростом движения за независимость многие ожидают скорого конца Британии. Наряду с разваливающейся империей в стране наблюдался подъем коммунизма, который мог бы перерасти в более серьезную проблему."
 ZIM_DECADE_CRISIS_DESC: "С 1953 года Южная Родезия, Северная Родезия и Ньясаленд находятся в нестабильной Федерации. Теперь, с наступлением нового столетия, многие задаются вопросом, продержится ли федерация или рухнет? Рост национализма во всех трех субъектах может оказаться слишком жестким, чтобы справиться с ним."
 NGA_DECADE_CRISIS_DESC: "Благодаря согласованным усилиям политических групп страны, Нигерия только приближается к запланированной на октябрь независимости. Местные политики наконец-то смогли сформировать правительство: крупнейшая партия, Северный народный конгресс, в котором доминируют хауса-фулани, создала коалицию с партией игбо Ннамди Акизикве, Национальным советом Нигерии и Камеруна. Похоже, что Абубакар Тафава Балева станет первым премьер-министром страны, и только время покажет, решит ли он проблему этнической напряженности в Нигерии, созданную британской политикой доминирования Севера. Партикуляризм и регионализм являются очень заметными чувствами на Юго-Востоке и Западе, если эти вопросы не будут решены прямым и немедленным образом, конфликт может перерасти в полномасштабное насилие."
 1990_DESC: "Конец коммунизма близок. С растущим желанием присоединиться к Западу многие коммунистические страны вот-вот сменят свои правительства. С советами у них дела обстоят совсем плохо ."
 1945_DESC: "Самая разрушительная война в истории человечества наконец-то закончилась. Германия и Австрия оккупированы Великобританией, США, Францией и Советским Союзом, в то время как Азия погружается в хаос после капитуляции Японии. Фашизм окончательно побежден,но коммунизм сейчас на подъеме."
 YUG_1990_DESC: "Югославия разваливается на части. После смерти Тито этническая напряженность в стране стала расти. Теперь, с началом нового десятилетия, эта напряженность может перерасти в насилие. Неужели Балканы снова будут охвачены огнем?"
 USA_OILCRISIS_DESC: ""
 PRC_OILCRISIS_DESC: "КНР находится в эпицентре культурной революции и огромных перемен. Социалистическое образование продолжается, и молодые китайские рабочие из городских районов отправляются в деревню для перевоспитания. Председатель Мао остается у власти, но уже ведутся дискуссии о том, кто может стать преемником отца социализма в Китае. Напряженность в отношениях с Советами остается высокой, поскольку оба социалистических гиганта преследуют свое видение социалистического общества. Враждебные отношения с Китайской Республикой сохраняются, и оба государства продолжают взаимодействовать друг с другом дипломатически и через посреднические конфликты. Многие рассматривают недавний прорыв в отношениях с США как возможность противостоять советской угрозе и потенциально изолировать Китайскую республику."
 SOV_OILCRISIS_DESC: ""
 EGY_OILCRISIS_DESC: ""
 ISR_OILCRISIS_DESC: ""
 FRA_OILCRISIS_DESC: ""
 SYR_OILCRISIS_DESC: "Унизительное поражение Сирии в катастрофической Шестидневной войне, кульминацией которой стал захват Голанских высот сионистским противником, привело к падению Салаха Джадида и Хафеза Асада. После неизбежной борьбы за власть президент Хафез встал на вершину, чтобы осуществить свое корректирующее движение, чтобы сформировать Сирию, которую мы знаем сегодня. Он также стремился отомстить за предыдущее поражение и освободить каждый дюйм потерянной сирийской земли. Он втайне занимался реорганизацией сирийских вооруженных сил по советскому образцу и теперь покажет на что способен Левиантский Лев."
 WGR_OILCRISIS_DESC: ""
 ENG_OILCRISIS_DESC: ""
 DDR_OILCRISIS_DESC: ""
 ITA_OILCRISIS_DESC: ""
 RAJ_OILCRISIS_DESC: ""
 POL_OILCRISIS_DESC: ""
 ETH_OILCRISIS_DESC: "Хотя студенческой молодежи и интеллигенции Эфиопии потребовалось несколько десятилетий, чтобы прочно обосноваться в определенных международных идеологиях, эти движения всегда были неизбежны в своем развитии из-за прочного, неизменного статус-кво Императорской монархии. В последнее десятилетие в стране впервые сформировались марксистские и аграрно-социалистические партии, а также была предпринята попытка реформистского переворота против монархии; что, хотя и непостижимо извне, по-прежнему имеет далеко идущие последствия в духе тщательно сговорившихся генералов и молодых офицеров страны. Нет, вопрос не в том, превратится ли Эфиопская империя в революционную страну, а в том, когда - независимо от любых реформаторских мер, которые может предпринять Лев Иудеи."
 IRE_OILCRISIS_DESC: ""
 SUEZCRISIS_DESC: "Мир снова близок к тотальной войне. Поскольку Гамаль Абдель Насер национализировал Суэцкий канал, некоторые страны рассматривают это как конфликт интересов. Однако Израиль также может присоединиться к этому плану. Вопрос в том, что же будет дальше?"
 ARG_GATHERING_STORM_DESC: "После окончания печально известного десятилетия, утверждения избирательного права женщин и избрания Перона Аргентина, похоже, находится на пути к демократии. Перон находится в середине своего президентства, и уже кажется, что он встряхнет аргентинскую экономику и ее народ."
 VIN_GATHERING_STORM_DESC: "Вьетнам был оставлен французами. Все попытки добиться независимости потерпели неудачу. Бао Дай, японский коллаборационист, снова стал врагом Вьетминя. Кровь, пролитая при разрушении Ханоя китайскими империалистами, будет отплачена французской кровью. Борьба Вьетнама теперь идет против западного империализма, и Хо Ши Мин теперь полагается на коммунизм, чтобы победить в битве."
 FRA_GATHERING_STORM_DESC: "Франция сильно расколота. От забастовки Рено в 1947 году до хлебных бунтов в Ле-Мане и Вердене и оккупации коммунистических газет страна готова впасть в хаос. Она также должна столкнуться с мятежами на Мадагаскаре и в Индокитае, но при этом должна позаботиться о том, чтобы ее родина тоже не впала в мятеж. Нормирование и забастовки были характерны для Франции до сих пор, но невозможно рационировать страну вечно. Выдержит ли Франция и ее империя или она падет?"
 SPR_GATHERING_STORM_DESC: "Вторая Мировая война была очень болезненной для Испании. Франсиско Франко наблюдал, как его товарищи-фашисты пали в бою против союзников. Фаланге по-прежнему контролирует испанское население, и с началом Холодной войны вряд ли что-то в Испании изменится. Авторитаризм сохранил Испанию стабильной, но изолированной, и мало кто хочет перемен, но всегда есть шанс на перемены."
 GRE_GATHERING_STORM_DESC: "Глаза как Востока, так и Запада сосредоточили свой взор на Греции. Последствия войны не прошли для Греции без следа; экономика находится в состоянии упадка, и страна еще более разделена, чем когда-либо. В вакууме власти, образовавшемся после капитуляции Италии, греческие коммунистические партизаны восстали в надежде создать новую, ориентированную на Советскую власть, эллинскую нацию. Гражданская война в Греции превратилась в опосредованную войну между Варшавским договором и бывшими союзными войсками. Сможет ли греческое правительство должно сделать все, что в его силах, чтобы сохранить свободу и суверенитет?"
 CHI_GATHERING_STORM_DESC: "Восьмилетняя война сопротивления наконец закончилась взрывным финалом для японского империализма. Это, конечно, повод для большого торжества - но гоминьдановское правительство не может позволить себе праздновать до такой степени, чтобы отвлекаться. По-прежнему существует большая опасность для националистических правительств, поскольку из-за отсутствия угрозы со стороны Японии Китай вновь разделился. Благодаря советской помощи китайские коммунисты под руководством Мао Цзэдуна значительно расширили занимаемую ими территорию, превратившись в опасного соперника. А пока гражданская война в Китае продолжается, все усилия должны быть направлены на сокрушение коммунистов."
 ITA_GATHERING_STORM_DESC: "Лихорадочное настроение после смерти Муссолини улеглось. Провозглашение республики в 1948 году является высшей точкой новой Италии, но она все еще столкнется с небольшими последствиями оккупации и растущим коммунистическим движением."
 PER_GATHERING_STORM_DESC: "Иран сильно пострадал после оккупации союзническими войсками и отстранения от власти предыдущего шаха Резы Пехлеви. Его сын, Мохаммед Реза Пехлеви, стал одобренной британцами заменой. Мягкий Шах мало что сделал бы в первые годы своего пребывания у власти, что привело бы к созданию свободного демократического аппарата. Премьер-министр и парламент теперь обладают значительной властью, а Шах отошел на второй план в политике. Когда Иран вступит на перепутье в новую эру, будут ли продолжать свой путь демократии или будет подчинена многочисленным противникам молодого правительства?"
 FIN_GATHERING_STORM_DESC: "В начале холодной войны Финляндия решила не вмешиваться в конфликт и сохранять нейтралитет. Однако в условиях советского и американского влияния Финляндия сможет остаться в стороне от конфликта или будет вынуждена выбрать одну из сторон?"
 NIC_GATHERING_STORM_DESC: "Никарагуа — страна с богатой и непростой историей. При диктатуре Сомосы она сталкивается с вмешательством США, социальными потрясениями и партизанской войной. Оппозиция Сомосе, вдохновлённая антиимпериалистическим героем Сандино, борется за социальную справедливость и национальный суверенитет. Никарагуа оказалась между двух миров, и избежать надвигающегося пламени уже невозможно."
 CAM_GATHERING_STORM_DESC: "С окончанием мировой войны Камбоджа получила некоторую автономию от своих французских хозяев. Пока страна делает первые шаги к независимости, будущее остается неопределенным. Сплотится ли народ вокруг молодого короля, или выберет свой собственный путь, когда колониализм начнет рушиться?"
 MOR_GATHERING_STORM_DESC: "Королевство Марокко — это протекторат, который французы держат на коротком поводке. Под руководством харизматичного короля Мухаммеда V народ Марокко сделал свои первые шаги к независимости, что привело к увеличению недовольства в Париже. Страна стоит на перепутье, и с ростом напряженности между королём и его французскими хозяевами, сможет ли Марокко когда-либо надеяться на долгожданную свободу?"
 SAU_GATHERING_STORM_DESC: "Королевство Саудовская Аравия двадцать лет назад было бы не узнать. Объединение арабских княжеств под знаменем династии Саудитов и последующее открытие нефти американскими геологами в 1933 году принесло пустынному королевству невиданный расцвет. Король Абдул-Азиз правил мудро, направляя нефтяные доходы на развитие страны, однако он не молодеет. Сумеют ли его наследники сохранить эту мудрость?"
 ZIM_GATHERING_STORM_DESC: "Колония Южная Родезия пользуется правом самоуправления, хотя оно, разумеется, ограничено белым меньшинством. В последнее время все чаще обсуждается идея создания федерации с Северной Родезией и Ньясалендом, и, похоже, вопрос лишь в том, когда парламент официально разрешит начать переговоры."
 GHA_GATHERING_STORM_DESC: "Богатая ресурсами колония Золотой Берег сыграла важную роль в снабжении Британии во время войны и в результате получила определенную степень автономии. Однако из-за сложной, раздробленной системы управления и нарастающего недовольства среди местного населения Золотому Берегу предстоит действовать осторожно в ближайшие годы."
 MLA_GATHERING_STORM_DESC: "С начала 19 века Малайский полуостров находился под полным контролем Великобритании и феодальных правителей, присягнувших Лондону. Хотя Британия обещает независимость и реформы, коммунисты под руководством Чин Пенга решили не ждать и начали действовать уже сейчас. С каждым днем их восстание всё больше набирает силу. Одержит ли революция верх?"
 AFG_GATHERING_STORM_DESC: "Афганистан, кладбище империй, остался в стороне от Второй мировой войны. Это тихое горное королевство словно застыло во времени на протяжении веков, но в последние годы перешло к конституционной монархии и положило курс на модернизацию. Однако в стране, где племен столько же, сколько гор, далеко не все согласны с королем и его правительством. Династию Баракзаев ждет непростое испытание."
 QAT_GATHERING_STORM_DESC: "Маленькое королевство Катар остается британским протекторатом. Долгое время изолированное и отсталое, оно обрело новую надежду после обнаружения нефти десять лет назад. Однако, пока большая часть прибыли уходит в Лондон, возможно, настало время катарцам самим решать свою судьбу — под властью династии Аль-Тани или кого-то другого."
 SWE_GATHERING_STORM_DESC: "Швеция сохраняла нейтралитет, когда мир охватила война, и сохраняет его до сих пор. Однако раскол мира на Запад и Восток усложняет этот выбор. Как бы Швеция ни стремилась сосредоточиться на внутреннем развитии, ее народу предстоит решить: воплотить в жизнь мечту о «народном доме» (Folkhemmet) или готовить страну к войне, которая может оказаться еще страшнее прошлой."
 TUR_GATHERING_STORM_DESC: "На протяжении веков турки правили могущественной Османской империей, но после ее краха в Великой войне Мустафа Кемаль Ататюрк провозгласил новую Турецкую республику — светскую, националистическую и приверженную демократическим и западным ценностям. После его смерти страна оставалась верна принципам Кемализма, но давление со стороны западных союзников и Советского Союза нарастает. Вскоре Турции придется сделать выбор — или остаться в пыли на обочине истории."
 BRM_GATHERING_STORM_DESC: "Бирма обрела независимость после Второй мировой войны, но первые годы свободы оказались, мягко говоря, непростыми. Этнические сепаратисты и коммунистические повстанцы угрожают погрузить хрупкое государство Рангуна в хаос. Выстоит ли сама Бирма, не говоря уже о правительстве, — вопрос открытый."
 BCP_GATHERING_STORM_DESC: "Коммунистическая партия «Красное Знамя» во главе с «красным генералом» Такином Тан Туном была одним из лидеров сопротивления японской оккупации. Однако теперь, когда Бирма обрела независимость, коммунисты Тан Туна взялись за оружие против центрального правительства, которое, по их мнению, недостаточно привержено социализму. Если бы они добились успеха, Бирма прочно вошла бы в коммунистический блок."
 LEB_GATHERING_STORM_DESC: "Ливан получил независимость в 1943 году, но с тех пор его беды не закончились. «Великий Ливан» был по сути созданием французских колонизаторов, и теперь страна разделена противоречиями между суннитами, шиитами, маронитами, армянами и множеством других религиозных и этнических групп, каждая из которых стремится к влиянию в этом небольшом и хрупком государстве. Чтобы избежать гражданской войны и сохранить ливанскую демократию, потребуется настоящее чудо."
 YEM_GATHERING_STORM_DESC: "На берегах Красного моря Мутаваккилийское Королевство Йемен застряло в средневековой эпохе. Деспотичное и непредсказуемое правление короля Ахмада бин Яхьи принесло ему мало союзников, и множество врагов, среди которых — и его британские покровители, раздраженные его постоянными претензиями на протекторат Аден и мечтами о «Великом Йемене»."
 LBA_GATHERING_STORM_DESC: "   Само существование Киренаикского эмирата Идриса находится в опасности из-за колониализма. С тех пор, как британские и итальянские дипломаты Эрнест Бевин и Карло Сфорца составили книгу Бевина-Сфорца, Ливия стала центром международных споров. Этот широко осуждаемый предложенный раздел итальянской Ливии разделит ее между Францией в Феццан-Гарамтес, Соединенным Королевством в Киренаике и Италией в населенном центре Триполитании. Фактический правитель Киренаикийского эмирата Идрис I оказался в сложной и трудной ситуации. Ему придется положиться на Организацию Объединенных Наций и международную поддержку со стороны недавно деколонизированного арабского мира и крупных держав того времени."
 BHR_GATHERING_STORM_DESC: "Королевство Бахрейн едва заметно на карте, но открытие нефти в 1929 году и стратегическое расположение в Персидском заливе сделали его слишком важным для британских покровителей. Хотя Бахрейн, возможно, и предпочел бы независимость, давние и до сих пор актуальные территориальные претензии Ирана делают союз с Британией необходимым злом. Пока Иран не откажется от своих амбиций, статус-кво сохранится."
 PAK_GATHERING_STORM_DESC: "When British rule over India ended in 1947, the old Raj was divided into Hindu India and Muslim Pakistan. The resulting killed thousands and displaced millions more, but in the end the Muslims of the Indian subcontinent now have a nation to call their own. The new nation, like its Indian rival, suffers from poverty, division, and an uncertain future as the world splits in two."
 JOR_GATHERING_STORM_DESC: "Иордания вышла из Арабо-Израильской войны 1948 года побежденной, но не сломленной. Хашимитское королевство теперь независимое государство и твердо намерено сохранить свою свободу. Однако остается открытым вопрос об отношениях с Израилем. Король Абдулла готов к официальным переговорам о мире, тогда как многие его подданные, особенно Палестинцы на управляемом Иорданией Западном берегу, не хотят идти на компромисс."