 RAJ_OILCRISIS_DESC: ""
 POL_OILCRISIS_DESC: ""
 ETH_OILCRISIS_DESC: "Хотя студенческой молодежи и интеллигенции Эфиопии потребовалось несколько десятилетий, чтобы прочно обосноваться в определенных международных идеологиях, эти движения всегда были неизбежны в своем развитии из-за прочного, неизменного статус-кво Императорской монархии. В последнее десятилетие в стране впервые сформировались марксистские и аграрно-социалистические партии, а также была предпринята попытка реформистского переворота против монархии; что, хотя и непостижимо извне, по-прежнему имеет далеко идущие последствия в духе тщательно сговорившихся генералов и молодых офицеров страны. Нет, вопрос не в том, превратится ли Эфиопская империя в революционную страну, а в том, когда - независимо от любых реформаторских мер, которые может предпринять Лев Иудеи."
 IRE_OILCRISIS_DESC: ""
 #### 
  
 SUEZCRISIS_DESC: "Мир снова близок к тотальной войне. Поскольку Гамаль Абдель Насер национализировал Суэцкий канал, некоторые страны рассматривают это как конфликт интересов. Однако Израиль также может присоединиться к этому плану. Вопрос в том, что же будет дальше?"
 ARG_GATHERING_STORM_DESC: "После окончания печально известного десятилетия, утверждения избирательного права женщин и избрания Перона Аргентина, похоже, находится на пути к демократии. Перон находится в середине своего президентства, и уже кажется, что он встряхнет аргентинскую экономику и ее народ."
 VIN_GATHERING_STORM_DESC: "Вьетнам был оставлен французами. Все попытки добиться независимости потерпели неудачу. Бао Дай, японский коллаборационист, снова стал врагом Вьетминя. Кровь, пролитая при разрушении Ханоя китайскими империалистами, будет отплачена французской кровью. Борьба Вьетнама теперь идет против западного империализма, и Хо Ши Мин теперь полагается на коммунизм, чтобы победить в битве."
 FRA_GATHERING_STORM_DESC: "Франция сильно расколота. От забастовки Рено в 1947 году до хлебных бунтов в Ле-Мане и Вердене и оккупации коммунистических газет страна готова впасть в хаос. Она также должна столкнуться с мятежами на Мадагаскаре и в Индокитае, но при этом должна позаботиться о том, чтобы ее родина тоже не впала в мятеж. Нормирование и забастовки были характерны для Франции до сих пор, но невозможно рационировать страну вечно. Выдержит ли Франция и ее империя или она падет?"
 SPR_GATHERING_STORM_DESC: "Вторая Мировая война была очень болезненной для Испании. Франсиско Франко наблюдал, как его товарищи-фашисты пали в бою против союзников. Фаланге по-прежнему контролирует испанское население, и с началом Холодной войны вряд ли что-то в Испании изменится. Авторитаризм сохранил Испанию стабильной, но изолированной, и мало кто хочет перемен, но всегда есть шанс на перемены."
 GRE_GATHERING_STORM_DESC: "Глаза как Востока, так и Запада сосредоточили свой взор на Греции. Последствия войны не прошли для Греции без следа; экономика находится в состоянии упадка, и страна еще более разделена, чем когда-либо. В вакууме власти, образовавшемся после капитуляции Италии, греческие коммунистические партизаны восстали в надежде создать новую, ориентированную на Советскую власть, эллинскую нацию. Гражданская война в Греции превратилась в опосредованную войну между Варшавским договором и бывшими союзными войсками. Сможет ли греческое правительство должно сделать все, что в его силах, чтобы сохранить свободу и суверенитет?"
 CHI_GATHERING_STORM_DESC: "Восьмилетняя война сопротивления наконец закончилась взрывным финалом для японского империализма. Это, конечно, повод для большого торжества - но гоминьдановское правительство не может позволить себе праздновать до такой степени, чтобы отвлекаться. По-прежнему существует большая опасность для националистических правительств, поскольку из-за отсутствия угрозы со стороны Японии Китай вновь разделился. Благодаря советской помощи китайские коммунисты под руководством Мао Цзэдуна значительно расширили занимаемую ими территорию, превратившись в опасного соперника. А пока гражданская война в Китае продолжается, все усилия должны быть направлены на сокрушение коммунистов."
 ITA_GATHERING_STORM_DESC: "Лихорадочное настроение после смерти Муссолини улеглось. Провозглашение республики в 1948 году является высшей точкой новой Италии, но она все еще столкнется с небольшими последствиями оккупации и растущим коммунистическим движением."
 PER_GATHERING_STORM_DESC: "Иран сильно пострадал после оккупации союзническими войсками и отстранения от власти предыдущего шаха Резы Пехлеви. Его сын, Мохаммед Реза Пехлеви, стал одобренной британцами заменой. Мягкий Шах мало что сделал бы в первые годы своего пребывания у власти, что привело бы к созданию свободного демократического аппарата. Премьер-министр и парламент теперь обладают значительной властью, а Шах отошел на второй план в политике. Когда Иран вступит на перепутье в новую эру, будут ли продолжать свой путь демократии или будет подчинена многочисленным противникам молодого правительства?"
 FIN_GATHERING_STORM_DESC: "В начале холодной войны Финляндия решила не вмешиваться в конфликт и сохранять нейтралитет. Однако в условиях советского и американского влияния Финляндия сможет остаться в стороне от конфликта или будет вынуждена выбрать одну из сторон?"
 NIC_GATHERING_STORM_DESC: "Nicaragua is a nation with a rich and troubled history. Under the Somoza dictatorship, Nicaragua faces US meddling, social strife, and guerrilla warfare. The opposition to Somoza, inspired by the anti-imperialist hero Sandino, fight for social justice and national sovereignty. Nicauragua is caught between two worlds, and the rising flames are unavoidable." #NT!
 CAM_GATHERING_STORM_DESC: "With the end of the World War, Cambodia has gained a measure of autonomy from her French masters. As the nation takes its first steps toward independence, the future remains uncertain. Will the people rally around the young king, or choose their own path as colonialism begins to crumble?" #NT!
 MOR_GATHERING_STORM_DESC: "The Kingdom of Morocco is a protectorate kept on a short leash by the French. Under the charismatic king, Mohammed V, the people of Morocco have taken their first steps toward independence, at the cost of increasing anger from Paris. The nation stands at a crossroads, and as tensions rise between the King and his French masters, can Morocco ever hope to secure her long-desired freedom?" #NT!
 SAU_GATHERING_STORM_DESC: "The Kingdom of Saudi Arabia would have been unrecognizable only twenty years ago. The unification of the Arabian kingdoms under the banner of the House of Saud and the subsequent discovery of oil by American prospectors in 1933 has brought the desert kingdom unprecedented prosperity. King Abdulaziz has ruled wisely, spending his oil profits on the development of the nation, but he grows older by the day. Will his successors maintain his wisdom?" #NT!
 ZIM_GATHERING_STORM_DESC: "The Colony of Southern Rhodesia enjoys the privilege of self-government, of course limited to the white minority. Recently, talks of forming a federation with Northern Rhodesia and Nyasaland have started to gain steam, and it seems only a matter of time before Parliament allows negotiations to begin." #NT!
 GHA_GATHERING_STORM_DESC: "The resource-rich Colony of the Gold Coast played an important role in supplying Britain during the war, and has gained some measure of autonomy as a result. With a byzantine, decentralized administration and increasing agitation from the native population, the Gold Coast must tread carefully in the coming years." #NT!
 MLA_GATHERING_STORM_DESC: "Since the early 19th century, the Malayan peninsula has been under the complete domination of Great Britain and the feudal lords who pay their tribute to London. While Britain has promised independence and reform, the communists under Chin Peng have decided to take action now rather than later, and the power of their insurgency grows with each passing day. Will the revolution prevail?" #NT!
 AFG_GATHERING_STORM_DESC: "Afghanistan, the Graveyard of Empires, remained out of the Second World War. The quiet mountain kingdom has remained stuck in time for centuries, but in recent years has transitioned to a constitutional monarchy and began a campaign of modernization. Yet in a nation where the tribes are as many as the mountains, not all agree with the King and his ministry. The Barakzai dynasty faces a great challenge indeed." #NT!
 QAT_GATHERING_STORM_DESC: "The little Kingdom of Qatar is a British protectorate. Isolated and backwards, Qatar has seen new hope with the discovery of oil a decade ago. With the profits largely going to London, perhaps it is time the Qataris choose their own destiny, whether under the Al-Thani dynasty or otherwise." #NT!
 SWE_GATHERING_STORM_DESC: "Sweden remained neutral as the world was set ablaze by war, and remains neutral still. The division of the world between West and East complicates this matter. However much Sweden would like to focus on internal development, the Swedish people must choose between realizing the dream of \"Folkhemmet\" or preparing the nation for the possibility of a war even worse than the last." #NT!
 TUR_GATHERING_STORM_DESC: "For hundreds of years, the Turks ruled over the mighty Ottoman Empire, but in the aftermath of its collapse in the Great War, Mustafa Kemal Atatürk declared a new Turkish republic, firmly secular, nationalist, and committed to democratic and western values. Turkey has remained true to Kemalism in the years since his death, but pressure from both the Western Allies and the Soviet Union is rising. Soon, Turkey must pick a side, or be left in the dust." #NT!
 BRM_GATHERING_STORM_DESC: "Burma regained its independence after the Second World War, but her first years of freedom have been challenging to say the least. Ethnic separatists and communist rebels threaten to set the fragile government in Rangoon ablaze. Whether Burma itself will survive, let alone the government, remains to be seen." #NT!
 BCP_GATHERING_STORM_DESC: "The Red Flag Communist Party, led by the red general Thakin Than Tun, was one of the leaders of the resistance against Japanese occupation. With Burma now independent, Tan Tun's communists have taken up arms against the central government, who they see as not sufficiently socialist. Were they to succeed, Burma would fall firmly within the Communist Bloc." #NT!
 LEB_GATHERING_STORM_DESC: "Lebanon became independent in 1943, but its woes have not ended since. \"Greater Lebanon\" was a ultimately creation of French colonialists, and the nation lies divided between Sunnis, Shias, Maronites, Armenians, and a myriad other religious and racial groups all vying for domination of the small and fragile country. To avoid civil war and save Lebanese democracy would take a miracle." #NT!
 YEM_GATHERING_STORM_DESC: "On the shores of the Red Sea, the Mutawakkilite Kingdom of Yemen is stuck in the medieval era. The tyrannical and unpredictable rule of King Ahmad bin Yahya has made few friends and many enemies, among them his British masters who cannot stand his constant claims to the Aden protectorate and his dreams of \"Greater Yemen\"." #NT!
 LBA_GATHERING_STORM_DESC: "   Само существование Киренаикского эмирата Идриса находится в опасности из-за колониализма. С тех пор, как британские и итальянские дипломаты Эрнест Бевин и Карло Сфорца составили книгу Бевина-Сфорца, Ливия стала центром международных споров. Этот широко осуждаемый предложенный раздел итальянской Ливии разделит ее между Францией в Феццан-Гарамтес, Соединенным Королевством в Киренаике и Италией в населенном центре Триполитании. Фактический правитель Киренаикийского эмирата Идрис I оказался в сложной и трудной ситуации. Ему придется положиться на Организацию Объединенных Наций и международную поддержку со стороны недавно деколонизированного арабского мира и крупных держав того времени."
 BHR_GATHERING_STORM_DESC: "The Kingdom of Bahrain is barely noticeable on a map, but the discovery of oil in 1929 and its strategic importance on the Persian Gulf have made it all too important for its British masters. While Bahrain might prefer independence, the age-old and still very active Iranian claim to its territory means that its relationship to Britain is a necessary evil. Until Iran abandons such notions, the status quo will remain." #NT!
 PAK_GATHERING_STORM_DESC: "When British rule over India ended in 1947, the old Raj was divided into Hindu India and Muslim Pakistan. The resulting killed thousands and displaced millions more, but in the end the Muslims of the Indian subcontinent now have a nation to call their own. The new nation, like its Indian rival, suffers from poverty, division, and an uncertain future as the world splits in two." #NT!
 JOR_GATHERING_STORM_DESC: "Jordan left the 1948 Arab-Israeli war beaten, but not defeated. The Hashemite Kingdom of Jordan now stands as an independent state, and is committed to maintaining its newfound freedom. The question of how to approach Israel remains. King Abdullah is open to formal peace talks, while many among the people and especially the Palestinians in the Jordanian-administered West Bank have no desire for compromise." #NT!
