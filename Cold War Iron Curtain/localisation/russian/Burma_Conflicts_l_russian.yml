 Launch_Campaign_Against_the_Karen_National_Liberation_Army: "Кампания против Каренской национально-освободительной армии"
 Karen_Conflict_desc: "Каренское меньшинство сыграло важную роль в поддержке британского колониального режима. Взамен они получили благосклонность государственной службы, особенно в армии и полиции. После обретения независимости новое правительство инициировало политику оттеснения каренских офицеров на второй план и расширения их рядов до большинства общины Бамар. Карены, опасаясь, что правительство запланировало инициировать кампанию подавления, чтобы превратить каренов во второсортное сообщество, в ответ подняли собственное восстание. Многие солдаты карен дезертировали, чтобы присоединиться к повстанцам, представляя серьезную угрозу для бирманских вооруженных сил и государства.\n\nТекущие победные очки правительства Бирмы: [?BRM.Karen_Conflict_Strength]\nТекущие очки победы Каренской национально-освободительной армии: [?KAY.Karen_Conflict_Strength]"
 KAREN_DESC1: "Безрезультатные боевые действия между бирманским правительством и Каренской национально-освободительной армией привели к [?BRM.Burmese_Casualties_Karen_Conflict_Display] потерям бирманцев и [?BRM.Karen_Casualties_Karen_Conflict_Display] потерям КНОА."
 KAREN_DESC2: "Недавние боевые действия между бирманским правительством и Каренской национально-освободительной армией закончились победой бирманцев, что привело к [?BRM.Burmese_Casualties_Karen_Conflict_Display] потерям бирманцев и [?BRM.Karen_Casualties_Karen_Conflict_Display] потерям КНОА."
 KAREN_DESC3: "Недавние боевые действия между бирманским правительством и Каренской национально-освободительной армией закончились победой каренов, что привело к [?BRM.Burmese_Casualties_Karen_Conflict_Display] потерям бирманцев и [?BRM.Karen_Casualties_Karen_Conflict_Display] потерям КНОА."
 MON_DESC1: "Безрезультатные боевые действия между правительством Бирмы и Национально-освободительной армией Мон привели к [?BRM.Burmese_Casualties_Mon_Conflict_Display] потерям бирманцев и [?BRM.Mon_Casualties_Mon_Conflict_Display] потерям Мон."
 MON_DESC2: "Недавние боевые действия между правительством Бирмы и Национально-освободительной армией Мон закончились победой бирманцев, что привело к [?BRM.Burmese_Casualties_Mon_Conflict_Display] потерям бирманцев и [?BRM.Mon_Casualties_Mon_Conflict_Display] потерям Мон."
 MON_DESC3: "Недавние боевые действия между бирманским правительством и Национально-освободительной армией мон закончились победой монов, что привело к [?BRM.Burmese_Casualties_Mon_Conflict_Display] потерям бирманцев и [?BRM.Mon_Casualties_Mon_Conflict_Display] потерям мон."
 BCP_DESC1: "Безрезультатные боевые действия между правительством Бирмы и Коммунистической партией Бирмы привели к [?BRM.Burmese_Casualties_Communist_Conflict_Display] потерям бирманцев и [?BRM.Communist_Casualties_Communist_Conflict_Display] потерям коммунистов."
 BCP_DESC2: "Недавние боевые действия между правительством Бирмы и Коммунистической партией Бирмы закончились победой бирманцев, что привело к [?BRM.Burmese_Casualties_Communist_Conflict_Display] потерям бирманцев и [?BRM.Communist_Casualties_Communist_Conflict_Display] потерям коммунистов."
 BCP_DESC3: "Недавние боевые действия между правительством Бирмы и Коммунистической партией Бирмы закончились победой коммунистов, что привело к [?BRM.Burmese_Casualties_Communist_Conflict_Display] потерям бирманцев и [?BRM.Communist_Casualties_Communist_Conflict_Display] потерям коммунистов."
 arakan_insurgency_Decisions: "Араканская народно-освободительная армия"
 arakan_insurgency_Decisions_desc: "Многие люди в Аракане чувствовали, что колониализм лишил их всякого контроля над собственной судьбой и землей. Обретение независимости не сняло эти опасения. Многие араканцы берутся за оружие, чтобы восстановить независимый Аракан. Бирманское правительство и особенно военные рассматривают штат Аракан как неотъемлемую часть государства, которую необходимо подчинить любыми средствами..\n\nТекущая сила: [?ROOT.arakan_insurgency|R]%"
