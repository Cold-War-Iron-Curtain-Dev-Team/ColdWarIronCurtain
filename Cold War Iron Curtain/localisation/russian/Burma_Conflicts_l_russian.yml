 Burma_Communist_Conflict: "Коммунистическое повстанческое движение под белым флагом"
 Mon_Conflict: "Конфликт Мон"
 Burma_Communist_Conflict_desc: "Коммунистическая партия Бирмы оказала вооруженное сопротивление после того, как правительство помешало ее усилиям по принуждению к политическим переменам. Бирманские националисты считали коммунистические требования слишком радикальными и подталкивающими Бирму к глобальному конфликту. Опасаясь репрессий со стороны правительства, коммунисты бежали из своего политического штаба и начали вооруженную борьбу. Бирманские военные, опасаясь, что коммунисты могут объединить другие региональные восстания, хотят быстро подавить коммунистическую угрозу.\n\nТекущие победные очки правительства Бирмы: [?BRM.Communist_Conflict_Strength]\nТекущие победные очки Коммунистической партии Бирмы: [?BCP.Communist_Conflict_Strength]"
 Mon_Conflict_desc: "До колониального правления моны столкнулись с реальной угрозой со стороны Бирманского королевства. Однако в последние годы британского правления они присоединились к антиколониальному движению. После обретения независимости лидеры монов потребовали от правительства самоопределения, однако в этом было отказано. Опасаясь за свое будущее, моны в ответ подняли восстание против правительства. Бирманские военные стремятся восстановить государственный контроль над землями Мон.\n\nТекущие победные очки правительства Бирмы: [?BRM.Mon_Conflict_Strength]\nCurrent Mon National Liberation Army Victory Points: [?MNL.Mon_Conflict_Strength]"
 Karen_Conflict: "Конфликт Карен"
