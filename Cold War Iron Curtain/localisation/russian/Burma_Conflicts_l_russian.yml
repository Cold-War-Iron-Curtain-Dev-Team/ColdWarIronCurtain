 Rohingya_Insurgency_Decisions_desc: "Лидеры рохингянских мусульман пытались присоединиться к Пакистану до раздела, но получили отказ. Попытки убедить бирманское правительство уступить территорию Пакистану также были отклонены. После этого местные банды бойцов, называющих себя моджахедами, организовались и подняли оружие против бирманской армии. Боевики пользуются местной поддержкой и сочувствующими в Пакистане. Перед бирманским правительством стоит сложная задача по восстановлению контроля над северным Араканом.\n\nНынешняя сила: [?ROOT.rohingya_insurgency|R]%"
