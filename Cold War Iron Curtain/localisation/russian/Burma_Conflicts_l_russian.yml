 arakan_insurgency_options.3.d: "Недавно патруль обнаружил в горах убежище так называемой Армии освобождения Аракан. Местный командир организовал десант, провел рекогносцировку вражеского лагеря и начал штурм. Атака прошла с большим успехом, мы нанесли большие потери, захватили пленных, оружие и документы. Командир говорит, что в настоящее время в этом районе спокойно. Надеюсь, мы сможем развить этот успех и продолжим уничтожать эту антигосударственную группировку. Разведка указывает, что противник серьезно обеспокоен их неудачей."
 arakan_insurgency_options.4.d: "Подразделение выявило небольшую базу бойцов так называемой Армии освобождения Аракан. Эти антигосударственные злодеи вели активные враждебные операции в этом районе. Командир части организовал штурмовую группу из наших бойцов, однако грамотной тактики не придерживался. Он переоценил собственную огневую мощь и недооценил возможности противника. Наши люди были обнаружены при их приближении и попали в безжалостную засаду. Мы понесли тяжелые потери и не смогли ни захватить позиции противника, ни нанести ему большие потери. Также на поле было брошено некоторое количество оружия. Это серьезное препятствие для нашей деятельности в этом районе."
 arakan_insurgency_options.1.d: "Недавно военная разведка наняла нескольких жителей деревни Аракан в качестве наших агентов. Они присоединились к Освободительной армии Аракана, чтобы изучить их тактику и планы. Операция имела большой успех. Наши агенты, благодаря их обучению, быстро занимают руководящие должности. Они успешно передали ценные данные. Наши силы  эффективно реагировали на передвижения противника и уничтожили несколько банд повстанцев. Мы готовим дальнейшие операции по проникновению, чтобы добиться полной победы."
 arakan_insurgency_options.2.d: "Недавно военная разведка наняла нескольких жителей деревни Аракан в качестве наших агентов. Они присоединились к Освободительной армии Аракана, чтобы изучить их тактику и планы. Операция оказалась очень успешной. Наши агенты, благодаря обучению, быстро занимают руководящие должности. Однако информация, которую они нам передали, привела к тому, что наши собственные силы попали в засаду. Ясно, что некоторые из этих агентов предали нацию. Некоторые из других наших оперативников, без сомнения, верные, перестали выходить на связь, указывая на то, что они были скомпрометированы. Это серьезное изменение, но мы не можем остановить наши усилия."
 arakan_insurgency_options.5.d: "Армия сообщила ВВС о крупной позиции противника, расположенной на хорошо защищенной позиции. Прямой штурм может увенчаться успехом, но привести к большим потерям. ВВС спланировали и организовали миссию. Наши бомбардировщики покинули аэродром и повели атаку. Мы отправили небольшую группу для оценки бомбардировки, и они подтвердили, что удар удался. Освободительная армия Аракана спешно покинула лагерь, оставив после себя разрушенные постройки и ценные документы. Эта успешная бомбардировка демонстрирует эффективное использование авиации для поддержки нашей кампании по уничтожению антигосударственных сил в стране."
 arakan_insurgency_options.6.d: "Армия сообщила ВВС о крупной позиции противника, расположенной на хорошо защищенной позиции. Прямой штурм может увенчаться успехом, но привести к большим потерям. ВВС спланировали и организовали миссию. Наши бомбардировщики покинули аэродром и повели атаку. Мы послали небольшую группу для оценки бомбежки, и они были удивлены, обнаружив разбомбленный фермерский дом. Позиция оказалась гражданским центром, и нет никаких доказательств присутствия Армии освобождения Аракана. Говорят, что местные жители возмущены взрывом. Нам нужно будет пересмотреть то, как эти миссии будут организованы в будущем, поскольку сейчас позиции правительства в регионе ослабли."
 arakan_insurgency_options.10.d: "Последний грузовик бирманских вооруженных сил выехал из штата Аракан. При этом тысячи жителей Аракана вышли на улицы, чтобы отпраздновать успешное свержение Армией освобождения Аракана бирманского правительства. Восстание вспыхнуло, когда стало ясно, что центральное правительство не намерено предоставлять государству Аракан желаемый уровень автономии, что подтолкнуло многих присоединиться к вооруженному восстанию. Правительственные силы не были подготовлены и не были способны справиться с тактикой повстанцев \"бей и беги\". В связи с растущими потерями и растущей поддержкой повстанцев бирманское правительство приказало вывести свои войска. Хотя повстанцы и иностранные наблюдатели подтверждают победу повстанцев, бирманское правительство отказывается это признавать."
 arakan_insurgency_options.11.d: "Бирманское правительство выпустило новую серию фотографий, на которых бойцы Армии освобождения Аракана сдают оружие армейским офицерам. Эти изображения отражают успешную кампанию по борьбе с повстанцами, в ходе которой бирманские военные в конечном итоге подавили восстание в Аракане. Повстанцы и их сторонники желали, чтобы конец колониального правления привел к тому, что Аракан получил автономию в составе нового государства. Однако когда бирманское правительство оказалось не заинтересованным в уступках, это побудило многих поднять оружие против правительства. Военные отреагировали быстро, сумев победить, искоренить и, по сути, устранить араканских повстанцев как угрозу."
 rohingya_insurgency_options.3.d: "Патруль обнаружил укрытие моджахедов в джунглях. Враги не понимали, что их разоблачили. Было организовано подразделение для наступления. Им удалось незамеченными добраться до вражеского лагеря и начать там штурм. Понеся большие потери, моджахеды рассеялись. Мы захватили пленных, оружие и разведданные противника. Это крупная победа наших сил в этом районе. Наши силы концентрируются в этом районе. Моджахеды дважды подумают, прежде чем пытаться противостоять нашим храбрым силам."
 rohingya_insurgency_options.4.d: "Патруль обнаружил укрытие моджахедов в джунглях. Враги не понимали, что их разоблачили. Было организовано подразделение для наступления. Им удалось добраться до вражеского лагеря, однако они были обнаружены. Наши бойцы попали в засаду противника. При отступлении мы понесли тяжелые потери. Это серьезное препятствие для операций в этом районе. Моджахеды посмеют продолжить свои антигосударственные операции. Несмотря ни на что, мы продолжим борьбу за единство нашего народа."
 rohingya_insurgency_options.1.d: "В контролируемых нами деревнях на севере Аракана мы начали разведывательную операцию по вербовке местных осведомителей. Моджахеды доверяют своему народу. Таким образом, эти агенты могут собирать информацию о позициях противника в этом районе. Мы также можем отслеживать их перемещения. Операция прошла с большим успехом. Нашим силам удалось успешно перехватить и уничтожить группы моджахедов в этом районе. Это усиливает наш контроль над территорией. С такими успехами мы скоро вернем эту часть страны в Бирму."
 rohingya_insurgency_options.2.d: "В контролируемых нами деревнях на севере Аракан мы начали разведывательную операцию по вербовке местных осведомителей. Моджахеды доверяют своему народу. Таким образом, эти агенты могут собирать информацию о позициях противника в этом районе. Мы также можем отслеживать их перемещения. Операция закончилась крупным провалом. Многие агенты фактически перешли на сторону моджахедов. Они предоставили ложные сведения, и наши войска потерпели ряд поражений. Это серьезная неудача в нашей борьбе."
 rohingya_insurgency_options.5.d: "Бирманские ВВС, используя разведывательные полеты, определили поляну в джунглях, которая, по-видимому, является крупным лагерем моджахедов. После тщательного планирования наши летчики начали бомбометание. Они успешно поразили цель. Затем был отправлен патруль для оценки операции. Мы нашли доказательства того, что наши бомбардировщики уничтожили лагерь снабжения, уничтожив оружие и припасы. Также известно, что противник эвакуировал раненых с места происшествия. В спешке противник бросил ценные разведывательные документы. Это большая победа наших ВВС, и народ может гордиться своими летчиками."
 rohingya_insurgency_options.6.d: "Бирманские ВВС, используя разведывательные полеты, определили поляну в джунглях, которая, по-видимому, является крупным лагерем моджахедов. После тщательного планирования наши летчики начали бомбометание. Они успешно поразили цель. Затем был отправлен патруль для оценки операции. К сожалению, следов присутствия моджахедов или оружия патруль не обнаружил. Мы наткнулись на заброшенный фермерский дом. Это позор для наших пилотов, а сочувствующие моджахедам распространяют слухи, что мы убили семью фермеров. Уверенность наших летчиков поколеблена, и мы продолжим борьбу за объединение нации."
 rohingya_insurgency_options.10.d: "В деревнях рохинджа проходят молитвы в ознаменование победы моджахедов над бирманскими военными. Конфликт начался после того, как мусульманам северного Аракана было отказано в праве присоединиться к недавно созданному мусульманскому государству Пакистан. Прибытие бирманских правительственных войск вскоре после этого побудило многих взять в руки оружие и изгнать правительственные войска из своих районов. После ожесточенных боев бирманские военные недавно решили вывести свои силы из этого района, позволив силам моджахедов полностью оккупировать территорию. Похоже, что правительственные силы не могли справиться с повстанцами или их способностью смешаться и заручиться поддержкой местных жителей. Неясно, будут ли рохинджа добиваться независимости, объединения с Пакистаном или автономии в составе Бирмы."
 rohingya_insurgency_options.11.d: "На официальной церемонии растрепанные бойцы моджахедов сдали свое оружие бирманским военным, подтвердив свое поражение. Бирманская армия успешно и методично подрывала поддержку повстанцев рохинджа и изолировала их бойцов, обеспечив успех наших вооруженных сил. Восстание рохинджа началось после неудачных попыток добиться независимости от Бирмы или объединения с Пакистаном. Многие рохинджа опасались, что бирманское правительство в конечном итоге установит буддийский режим, который подавит их исламские обычаи. Победа вселяет уверенность в бирманское правительство и защищает стратегически важный регион страны."
 BCP_Conflict.1.d: "Националистическое бирманское правительство стремилось подавить и уничтожить коммунистическую партию. Однако ее усилия не увенчались успехом, поскольку коммунисты смогли начать успешную военную кампанию и сплотить людей на ее стороне. После ряда военных поражений правительство сдалось Коммунистической партии Бирмы. Новое правительство пообещало восстановить мир по всей стране. Он планирует инициировать революционную социалистическую программу, чтобы быстро принести процветание всем бирманским крестьянам и рабочим."
 BCP_Conflict.2.d: "Коммунистическая партия Бирмы, не сумев заставить правительство начать радикальную социалистическую программу, прибегла к вооруженному сопротивлению. Она стремилась захватить власть с помощью военной силы и коммунистической тактики. Бирманские военные отреагировали на эту угрозу, сразившись с врагом, и после стремительной кампании одержали победу над коммунистами. Несмотря на победу, есть опасения, что коммунисты могут со временем возродиться, однако правительство считает, что продемонстрировало, что вооруженное сопротивление приведет только к поражению."
 Karen_Conflict.1.d: "Каренская национально-освободительная армия подтвердила, что последние бирманские войска покинули земли каренов. Это следует за его успешными операциями против бирманских вооруженных сил, посланных для подавления восстания каренов. Карены, опасаясь снижения своего социального статуса, подняли вооруженное восстание за независимость. Бирманские военные оказались неспособными подавить восстание или преодолеть переход солдат-каренов на сторону каренов. У бирманского правительства теперь нет возможности помешать каренам отстаивать свою независимость."
 Karen_Conflict.2.d: "Бирманские военные подтвердили, что они разгромили Каренскую национально-освободительную армию и теперь полностью контролируют Карен. Люди карен подняли восстание из-за опасений, что их отстранят от их традиционных ролей в правительстве и вооруженных силах. Когда началось восстание, солдаты карен дезертировали из армии, а ветераны Второй мировой войны присоединились к повстанцам. Несмотря на эти проблемы, бирманским военным удалось провести методичную кампанию по унижению каренских повстанцев и восстановлению суверенитета Бирмы. Это представляет собой крупную победу Бирмы."
 Mon_Conflict.1.d: "Моны, давние жертвы более крупных держав, успешно взяли под контроль свою судьбу, изгнав последних бирманских солдат со своих земель. Мон начали восстание за независимость после того, как бирманское правительство отклонило их просьбу о самоопределении. Моны, опасаясь, что властное государство может привести к их уничтожению, подняли восстание. Несмотря на согласованные усилия бирманских вооруженных сил по восстановлению порядка, их силы не смогли победить монских повстанцев. Опасаясь дальнейших потерь, бирманцы решили отступить. Путь к самоопределению и независимости мона кажется непреодолимым."
 Mon_Conflict.2.d: "Бирманские военные восстановили государственную власть над штатом Мон. Бирманские военные успешно уничтожили и уничтожили силы повстанцев Мон, лишив их возможности вести вооруженную борьбу против государства. Для бирманского правительства победа позволит сосредоточиться на более насущных вопросах и укрепит доверие своих вооруженных сил. Хотя мон потерпели военное поражение, его люди по-прежнему недовольны бирманским правлением. Время покажет, сможет ли правительство развеять эти страхи или это была лишь первая глава в будущем конфликте."
