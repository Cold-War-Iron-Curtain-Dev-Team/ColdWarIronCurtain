l_russian:
  
 ###Egypt### 
  
 EGY_1973.1.t: "Египет запускает операцию Бадр"
 EGY_1973.1.d: "После нескольких месяцев подготовки наши вооруженные силы готовы начать операцию "Бадр". Операция "Бадр" позволит нашим войскам прорвать сионистские формирования и проникнуть на Синай. Ошибки предыдущих конфликтов не повторятся. На этот раз война будет на наших условиях, и мы готовы прорваться сквозь врага. Сионисты стали самодовольными, и многие из их сил находятся в отпуске на Йом Кипур.  Мы наступаем в Рамадан, самый благоприятный месяц, который только укрепит веру наших солдат на фронте."
 EGY_1973.1.a: "Итак, все начинается..."
  
 EGY_1973.2.t: "Синай наш!"
 EGY_1973.2.d: "Сионисты давно провозгласили Синай нерушимой крепостью, но сегодня наши войска не только прорвали их стены, но и теперь контролируют Синай. Синай-это рука египетской нации, и его возвращение под наш справедливый контроль вдохновляет нацию. Миллионы людей по всему Египту приветствуют эту новость, и моральный дух наших войск на фронте переполнен. Решение, стоящее перед нашим правительством и военными, заключается в том, предложить ли прекратить огонь или продолжать наступление. Так как мы обеспечили себе Синай, суверенную египетскую землю, мы можем укрепить наши позиции и предложить прекращение огня с позиции силы. Однако это может привести к отчуждению наших арабских братьев, которые захотят, чтобы мы продвигались к Иерусалиму. Учитывая, насколько хорошо наши силы оттесняют врага, стремление покончить с сионистской угрозой раз и навсегда также является вариантом. Достижение полной победы позволило бы нам определить будущее региона, но можно ожидать усиления сопротивления, и мы рискуем истощить наши собственные силы."
 EGY_1973.2.a: "Предложите прекращение огня"
 EGY_1973.2.b: "Давайте завершим наше завоевание!"
  
 EGY_1973.3.t: "Больше завоеваний в Палестине!"
 EGY_1973.3.d: "С Синая наши войска продолжали наступать на сионистскую территорию, освобождая полосы арабских земель в Палестине. Сионисты продолжают сопротивляться нашим силам, но наши командиры спокойно выразили свое удивление успехами наших сил. Однако по мере того, как военные продвигаются вперед, они все больше удаляются от линий снабжения, и есть опасения чрезмерного расширения со стороны старших командиров. Теперь необходимо решить, объявляем ли мы о прекращении огня и ведем ли переговоры с Синаем и ключевыми районами Палестины, находящимися под нашим контролем, или же мы должны продолжать настаивать на окончательной победе. Конечно, прекращение огня сейчас дало бы нам отличную переговорную позицию. Однако полная победа позволила бы нам диктовать условия, но продвижение вперед может повлечь за собой усиление международного давления и рисковать нашими силами для сионистского контрнаступления."
 EGY_1973.3.a: "Предложите прекращение огня"
 EGY_1973.3.b: "Давайте завершим наше завоевание!"
  
 EGY_1973.4.t: "Ультиматум от Соединенных Штатов"
 EGY_1973.4.d: "Американцы показали себя сионистскими марионетками, какими мы их всегда знали. В то время как наши силы продолжают бить сионистов и освобождать все больше палестинских земель, мы получили ноту от Соединенных Штатов. Они потребовали, чтобы мы предложили сионистам перемирие, иначе они вмешаются. Учитывая мощь и влияние американцев, к такой угрозе нельзя относиться легкомысленно. Мы уже многого достигли, и предложение о прекращении огня будет сделано с позиции силы. Возможно, сейчас самое время остановиться и отпраздновать наши удивительные достижения над врагом. Однако ряд высокопоставленных чиновников указывают на то, что все это может быть просто блефом, поскольку американское правительство, возможно, не сможет сплотить свой народ для поддержки войны, которая рискует перерасти в конфронтацию с Советским Союзом. Особенно если речь идет о судьбе иностранного государства."
 EGY_1973.4.a: "Предложите прекращение огня"
 EGY_1973.4.b: "Игнорировать"
  
 EGY_1973.5.t: "Соединенные Штаты Вмешиваются"
 EGY_1973.5.d: "Каир был в состоянии шока с тех пор, как пришло известие о том, что Соединенные Штаты присоединились к сионистам и будут развертывать свои военные силы против наших храбрецов. Мы недооценили, насколько глубоко влияние сионистов на Соединенные Штаты, и думали, что они не станут рисковать миром во всем мире ради иностранного государства. Мы планируем немедленно провести переговоры с советским послом, чтобы узнать, могут ли они помочь. Несмотря на эту дипломатическую неудачу, успех наших сил на земле и моральный дух нашего народа гарантируют, что мы будем готовы противостоять любым вызовам, которые бросят нам американцы в их обреченных усилиях по спасению сионистов."
 EGY_1973.5.a: "Значит, они не блефовали..."
  
 EGY_1973.6.t: "Сионисты Принимают наши Условия!"
 EGY_1973.6.d: "Операция Бадр видела, как наши храбрые силы прорвали сионистские укрепления на Синае, оборону, которую они объявили неприступной. Как только мы прорвались, наши люди смогли оказать давление на врага и изгнать его с Синая. Закрепление Синая вернуло священную землю обратно на родину. Укрепив свои позиции, мы любезно предложили сионистам перемирие с Синаем, находящимся под нашим контролем. Трусливый враг принял наши условия, и теперь наши войска-хозяева Синая. Тысячи людей вышли на улицы по всему Египту, чтобы отпраздновать наш ошеломляющий успех над сионистами. Правда, другие арабские государства критиковали нас за то, что мы остановились, но это не важно, мы восстановили египетскую честь и нанесли сокрушительный удар сионистам."
 EGY_1973.6.a: "Победа!"
  
 EGY_1973.7.t: "Сионисты Принимают наши Условия!"
 EGY_1973.7.d: "Война началась с операции "Бадр" на Синае. Его ошеломляющий успех позволил нам изгнать сионистов и освободить эту священную египетскую землю. Затем наши войска двинулись дальше и в результате ряда побед освободили значительную часть западной и южной Палестины. Получив эти земли, мы предложили сионистам перемирие, и трусы согласились. Египет теперь контролирует Синай, и наши храбрые вооруженные силы останутся в Палестине, чтобы защитить свой народ и следить за устранением любого сионистского присутствия на этой земле. По всему арабскому миру сотни тысяч людей вышли на улицы, чтобы отпраздновать победу арабского оружия и освобождение арабских земель от многолетней оккупации."
 EGY_1973.7.a: "Победа!"
  
 EGY_1973.8.t: "Сионисты Отказываются От Прекращения огня"
 EGY_1973.8.d: "Наши силы разгромили сионистов с самого начала конфликта. Они терпят поражение за поражением против наших храбрых сил. Мы любезно предложили им условия прекращения огня и только просим, чтобы они согласились, что наши силы останутся на земле, которую они в настоящее время освободили. Однако, несмотря на наше великодушие, сионисты отвергли наши условия. Их глупость и заблуждения-это их собственная вина, и теперь у наших сил не будет другого выбора, кроме как продолжать двигаться вперед против врага."
 EGY_1973.8.a: "Итак, они выбирают смерть..."
  
 EGY_1973.9.t: "Сионисты Предлагают Перемирие"
 EGY_1973.9.d: "Наши храбрые силы продолжают сражаться с сионистским врагом. Там, где мы наступаем, они отступают, а там, где они нападают на нас, мы пускаем им кровь. Сионисты по-прежнему поражены упорством, гениальностью и боевой доблестью наших вооруженных сил. В результате они предложили нам перемирие, которое позволило бы обеим сторонам вернуться к довоенным границам. Конечно, наши бойцы превосходно справляются в полевых условиях, но командиры отметили, что продвижение идет медленно. Мы зарекомендовали себя как бойцы, и, возможно, прекращение огня позволит нам вести переговоры с гораздо более сильной позиции. Однако, хотя продвижение было медленным, это может быть просто вопросом времени, прежде чем мы прорвемся и полностью переломим ситуацию, иначе зачем бы они предложили перемирие?"
 EGY_1973.9.a: "Принять прекращение огня"
  
 EGY_1973.10.t: "Второе предложение сионистов о прекращении огня"
 EGY_1973.10.d: "Сионисты в очередной раз предложили прекратить боевые действия. Наши храбрецы усилили сопротивление, и хотя мы потеряли ключевые территории, оборона Каира остается сильной. Среди высокопоставленных чиновников некоторые утверждают, что согласие на прекращение огня на данном этапе может уменьшить жесткость требований сионистов. Однако другая группа утверждает, что вести переговоры или пресмыкаться перед врагом было бы позором для нашей великой арабской нации. Выбор теперь состоит в том, чтобы либо принять сионистское перемирие, либо сражаться до последнего человека, либо, с Божьей помощью, мы можем даже изменить нашу судьбу."
 EGY_1973.10.a: "Принять прекращение огня"
 EGY_1973.10.b: "Мы будем сражаться до последнего!"
  
 EGY_1973.11.t: "Советский Союз Вмешивается"
 EGY_1973.11.d: "Советский Союз долгое время был другом народа Египта, и в нашей величайшей борьбе они пришли нам на помощь. Советская поддержка укрепит наши храбрые вооруженные силы и поднимет боевой дух нашего народа. Советы подготовили ряд специальных войск для быстрого развертывания, и мы можем ожидать, что они вскоре начнут прибывать. Сионистам и их банде сторонников придется теперь иметь дело с Красной Армией и нашими войсками."
 EGY_1973.11.a: "Мы не ожидали спецназа."
  
 #Decisions 
  
 ###Israel### 
  
  
 ISR_1973.1.t: "Сообщения о мобилизации в Египте"
 ISR_1973.1.d: "С передовых позиций на Синае и других разведывательных объектов мы получили многочисленные сообщения о том, что египтяне начали мобилизацию своих сил. Скопление арабских войск и техники к нашей границе вызывает беспокойство. Некоторые в кабинете считают, что мобилизация может быть просто позерством, чтобы успокоить местное население и предупредить, что эскалация наших сил может полностью настроить международное мнение против нас. Другие, однако, выступают за то, чтобы мы отменили Йом-Кипур, которым наслаждаются многие наши сотрудники, и немедленно отправили их на фронт. Они выступают за то, чтобы мы не отдавали инициативу врагу."
 ISR_1973.1.a: "Праздник отменяется! К оружию!"
  
 ISR_1973.2.t: "Сообщения о сирийской мобилизации"
 ISR_1973.2.d: "С передовых позиций на Голанах и других разведывательных объектов мы получили многочисленные сообщения о том, что сирийцы начали мобилизацию своих сил. Вызывает беспокойство скопление арабских войск у одного из наших самых опасных соседей. Некоторые в кабинете считают, что мобилизация может быть просто позерством, чтобы успокоить местное население и предупредить, что эскалация наших сил может полностью настроить международное мнение против нас. Другие, однако, выступают за то, чтобы мы отменили Йом-Кипур, которым наслаждаются многие наши сотрудники, и немедленно отправили их на фронт. Они выступают за то, чтобы мы не отдавали инициативу врагу."
 ISR_1973.2.a: "Праздник отменяется! К оружию!"
  
 ISR_1973.3.t: "Египет предлагает прекратить огонь"
 ISR_1973.3.d: "Наши храбрые воины в ЦАХАЛЕ продолжают сопротивляться арабской агрессии на Синае. Однако, несмотря на все наши усилия, войска были вытеснены с Синайского полуострова и теперь находятся в состоянии защищать родину от агрессии. Египтяне, без сомнения, сознавая, что их вероломное нападение больше не удивляет, предложили нам перемирие, которое признает их оккупацию Синая. Если мы примем перемирие сейчас, то наша земля останется нетронутой и мы сможем сосредоточиться на других угрозах и перегруппировке сил после первоначальных потерь. Однако некоторые руководители ЦАХАЛА предполагают, что египтяне потратили все свои уловки, и вскоре мы сможем нанести ответный удар и прогнать их через канал."
 ISR_1973.3.a: "Принять прекращение огня"
 ISR_1973.3.b: "Мы будем сражаться до последнего!"
  
 ISR_1973.4.t: "Египет предлагает прекратить огонь"
 ISR_1973.4.d: "Никто не может сомневаться в мужестве и упорстве ЦАХАЛА. Несмотря на подавляющую арабскую агрессию, ЦАХАЛ продолжает сражаться и проливать кровь врага за каждый дюйм нашей священной земли, которую они захватывают. Вот почему египтяне недавно направили нам предложение о прекращении огня. Принять его-значит позволить арабским армиям оккупировать Синай, Газу и юг Израиля. Хотя мы потеряем нашу землю, по крайней мере, это даст нам время перегруппироваться и обеспечить выживание остального Израиля. Однако некоторые высокопоставленные чиновники предлагают нам бороться дальше, довериться нашей вере и народу. Оказаться во власти врага было бы хуже смерти."
 ISR_1973.4.a: "Принять прекращение огня"
 ISR_1973.4.b: "Мы будем сражаться до последнего!"
  
 ISR_1973.5.t: "Соединенные Штаты решают вмешаться"
 ISR_1973.5.d: "В том, что многие в Израиле уподобляют библейскому чуду, Соединенные Штаты согласились вмешаться и спасти Израиль от арабской агрессии, угрожающей уничтожить нацию. Заявление Соединенных Штатов прозвучало в тот момент, когда наша Армия обороны Израиля продолжает сопротивляться из своих последних бастионов обороны. Приход американской поддержки, без сомнения, переломит ситуацию, и, как говорят, в регион уже направляются специальные силы. Наша разведка сообщает, что настроение в Каире изменилось от ликования до полного ужаса."
 ISR_1973.5.a: "Мы не ожидали спецназа."
  
 ISR_1973.6.t: "Советский ультиматум"
 ISR_1973.6.d: "Советский Союз направил ноту нашему правительству с требованием предложить египтянам немедленное прекращение огня или столкнуться с советской интервенцией. Хотя арабы трусливо напали на нас без предупреждения, ЦАХАЛ успешно отбил их, и наши силы находятся глубоко в Египте, гарантируя, что они никогда больше не подумают причинить вред нашему народу. Многие высокопоставленные члены кабинета предполагают, что сообщение Египту было отправлено в этот момент и предложить прекращение огня, однако есть также несколько членов кабинета и офицеров ЦАХАЛА, которые считают, что Советы просто блефуют. Они предполагают, что Советы только умиротворяют египтян и не будут всерьез рассматривать возможность прямого вмешательства."
 ISR_1973.6.a: "Предложите Египту прекращение огня"
 ISR_1973.6.b: "Игнорировать"
  
 ISR_1973.7.t: "Советский Союз вмешивается..."
 ISR_1973.7.d: "Объявление Советского Союза о немедленном вмешательстве в войну превратило настроение нашего народа в траурное. Удовлетворение и гордость, которые мы чувствовали раньше за наших солдат, которые вели войну вглубь врага, который так вероломно напал на нас, теперь превратились в страх за них и за наше собственное выживание.  Правительство не сумело прочесть советских намерений и теперь должно страдать от последствий, однако, несмотря на эту неудачу, мы будем упорствовать."
 ISR_1973.7.a: "Значит, они не блефовали..."
  
 ISR_1973.8.t: "Советский ультиматум"
 ISR_1973.8.d: "Советский Союз направил ноту нашему правительству с требованием предложить немедленное прекращение огня сирийскому правительству или столкнуться с советской интервенцией. Хотя арабы трусливо напали на нас без предупреждения, ЦАХАЛ успешно отбил их, и наши силы находятся глубоко в Сирии, чтобы они не думали снова причинить вред нашему народу. Многие высокопоставленные члены кабинета предполагают, что это послание Сирии было послано именно в этот момент, и предлагают прекратить огонь, однако есть также несколько членов кабинета и офицеров ЦАХАЛА, которые считают, что Советы просто блефуют. Они предполагают, что Советы только умиротворяют сирийцев и не будут всерьез рассматривать возможность прямого вмешательства."
 ISR_1973.8.a: "Предложите Сирии прекращение огня"
 ISR_1973.8.b: "Игнорировать"
  
 ISR_1973.9.t: "Синай Держится крепко!"
 ISR_1973.9.d: "Несмотря на обширные приготовления и сосредоточение огромных сил, арабская попытка прорыва через Синай явно провалилась. Египтяне думали, что они могут начать трусливую атаку без нашего ведома и уничтожить наше присутствие на Синае. Однако ЦАХАЛ оказался превосходящей силой, и наше упорное сопротивление и контратаки обеспечили нам победу и господство на Синае. Некоторые предполагают, что сейчас самое время предложить прекращение огня и прекратить боевые действия, поскольку мы по-прежнему контролируем ситуацию и победили нападение. Другие, однако, считают, что арабам следует преподать урок, и ЦАХАЛ должен продолжать наступление. Подавляющая победа может обеспечить нам десятилетия безопасности."
 ISR_1973.9.a: "Предложите Египту прекратить огонь"
 ISR_1973.9.b: "Мы их прикончим!"
  
 ISR_1973.10.t: "Израиль пересекает Суэцкий канал"
 ISR_1973.10.d: "ЦАХАЛ переправился через Суэц и оттеснил потрепанных египтян к окраинам Каира. Потери арабов продолжают расти, и их боевой дух, без сомнения, рухнул. Международные посредники предполагают, что египтяне уже сыты по горло и, скорее всего, согласятся на прекращение огня. С гарантированной победой имеет смысл предложить прекращение огня на данном этапе и прекратить боевые действия. Это позволит нам перегруппироваться, вести переговоры с позиции силы и улучшить наше положение на международной арене. Однако есть некоторые высокопоставленные чиновники и офицеры ЦАХАЛА, которые предлагают нам продвигаться вперед и идти дальше, пока арабам больше некуда будет отступать."
 ISR_1973.10.a: "Предложите Египту прекратить огонь"
 ISR_1973.10.b: "Мы их прикончим!"
  
 ISR_1973.11.t: "Египет согласен на прекращение огня!"
 ISR_1973.11.d: "Египтяне думали, что смогут прорваться через наши линии и отнять у нас Синай. Однако ЦАХАЛ в очередной раз доказал свое превосходство над противником. Вероломная попытка египтян была сорвана, и они приняли наше великодушное предложение о прекращении огня. ЦАХАЛ упорно и со стальной решимостью боролся за то, чтобы удержать Синай под нашим контролем. Синай остается бастионом израильской обороны, и мы надеемся, что с этим успехом египтяне теперь увидят, что у них нет никаких шансов изменить статус-кво силой оружия. Это великая победа Израиля и ЦАХАЛА."
 ISR_1973.11.a: "Победа!"
  
 ISR_1973.12.t: "Египет принимает прекращение огня!"
 ISR_1973.12.d: "Египтяне приняли наше предложение о прекращении огня, подтвердив свое сокрушительное поражение. Их вероломная попытка захватить Синай с помощью военной силы была не просто сорвана ЦАХАЛОМ, но мы превратили ее в наступление на Египет. Мы не только помешали им взять Синай, но и наши храбрые войска вступили в бой с Египтом и захватили у врага жизненно важный Суэц. С этого момента Египет дважды подумает, прежде чем угрожать нашему существованию."
 ISR_1973.12.a: "Победа!"
  
 ISR_1973.13.t: "Египет Отвергает мирное предложение"
 ISR_1973.13.d: "Египтяне сказали" нет " нашему недавнему предложению о прекращении огня. Они явно слишком смущены своими неудачами против наших сил, чтобы принять наземную реальность. После отказа была проведена встреча со старшими должностными лицами и офицерами ЦАХАЛА. ЦАХАЛ заявил, что они будут продолжать наказывать египтян и заставят их пожалеть о своем отказе вести переговоры. Если они надеются на снижение или лучшие условия, они не получат их от наших сил, которые будут продолжать операции с той же энергией, что и раньше."
 ISR_1973.13.a: "Итак, они выбрали смерть..."
  
 ISR_1973.14.t: "Голан остается твердым!"
 ISR_1973.14.d: "Несмотря на обширные приготовления и сосредоточение огромных сил, арабская попытка прорыва Голан явно провалилась. Сирийцы думали, что они могут начать трусливую атаку без нашего ведома и уничтожить наше присутствие в горах. Однако ЦАХАЛ оказался превосходящей силой, и наше упорное сопротивление и контратаки обеспечили нам победу и господство на Голанских высотах. Некоторые предполагают, что сейчас самое время предложить прекращение огня и прекратить боевые действия, поскольку мы по-прежнему контролируем ситуацию и победили нападение. Другие, однако, считают, что арабам следует преподать урок, и ЦАХАЛ должен продолжать наступление. Подавляющая победа может обеспечить нам десятилетия безопасности."
 ISR_1973.14.a: "Предложите Сирии прекратить огонь"
 ISR_1973.14.b: "Мы их прикончим!"
  
 ISR_1973.15.t: "Израиль пересекает Голаны"
 ISR_1973.15.d: "ЦАХАЛ пересек Голаны и оттеснил потрепанных сирийцев к окраинам Дамаска. Потери арабов продолжают расти, и их боевой дух, без сомнения, рухнул. Международные посредники предполагают, что сирийцы уже сыты по горло и, скорее всего, согласятся на прекращение огня. С гарантированной победой имеет смысл предложить прекращение огня на данном этапе и прекратить боевые действия. Это позволит нам перегруппироваться, вести переговоры с позиции силы и улучшить наше положение на международной арене. Однако есть некоторые высокопоставленные чиновники и офицеры ЦАХАЛА, которые предлагают нам продвигаться вперед и идти дальше, пока арабам больше некуда будет отступать."
 ISR_1973.15.a: "Предложите Сирии прекратить огонь"
 ISR_1973.15.b: "Мы их прикончим!"
  
 ISR_1973.16.t: "Сирия согласна на прекращение огня!"
 ISR_1973.16.d: "Сирийцы думали, что смогут прорвать наши линии и отнять у нас Голаны. Однако ЦАХАЛ в очередной раз доказал свое превосходство над противником. Вероломная попытка сирийцев была сорвана, и они приняли наше великодушное предложение о прекращении огня. ЦАХАЛ упорно и со стальной решимостью боролся за то, чтобы удержать сирийцев на расстоянии. Голаны остаются бастионом израильской обороны, и мы надеемся, что благодаря этому успеху сирийцы теперь признают, что у них нет никаких шансов изменить статус-кво силой оружия. Это великая победа Израиля и ЦАХАЛА."
 ISR_1973.16.a: "Победа!"
  
 ISR_1973.17.t: "Сирия принимает прекращение огня!"
 ISR_1973.17.d: "Сирийцы приняли наше предложение о прекращении огня, подтвердив сокрушительное поражение, которое они потерпели. Их вероломная попытка захватить Голаны с помощью военной силы была не только сорвана ЦАХАЛОМ, но и превращена нами в наступление на Сирию. Храбрые мужчины и женщины Армии обороны Израиля вступили в бой в Сирии и были готовы наступать на сам Дамаск. С этого момента Сирия дважды подумает, прежде чем угрожать нашему существованию."
 ISR_1973.17.a: "Победа!"
  
 ISR_1973.18.t: "Сирия отвергает прекращение огня"
 ISR_1973.18.d: "Сирийцы сказали" нет " нашему недавнему предложению о прекращении огня. Они явно слишком смущены своими неудачами против наших сил, чтобы принять наземную реальность. После отказа была проведена встреча со старшими должностными лицами и офицерами ЦАХАЛА. ЦАХАЛ заявил, что они будут продолжать наказывать сирийцев и заставлять их сожалеть о своем отказе вести переговоры. Если они надеются на снижение или лучшие условия, они не получат их от наших сил, которые будут продолжать операции с той же энергией, что и раньше."
 ISR_1973.18.a: "Итак, они выбрали смерть..."
  
 ISR_1973.19.t: "Сирия предлагает перемирие"
 ISR_1973.19.d: "Наши храбрые воины в Армии обороны ИЗРАИЛЯ продолжают сопротивляться арабской агрессии на Голанских высотах. Однако, несмотря на все наши усилия, войска были вытеснены из Высокогорья и теперь находятся в состоянии защитить родину от агрессии. Сирийцы, без сомнения, сознают, что их вероломное нападение больше не удивляет нас тем, что оно предложило нам перемирие, согласное на возвращение Голанских высот. Если мы примем перемирие сейчас, то наша земля останется нетронутой и мы сможем сосредоточиться на других угрозах и перегруппировке сил после первоначальных потерь. Однако некоторые руководители ЦАХАЛА предполагают, что сирийцы потратили все свои уловки, и вскоре мы сможем нанести ответный удар и вернуться домой."
 ISR_1973.19.a: "Принять прекращение огня"
 ISR_1973.19.b: "Мы будем сражаться до последнего!"
  
 ISR_1973.20.t: "Сирия предлагает прекратить огонь"
 ISR_1973.20.d: "Никто не может сомневаться в мужестве и упорстве ЦАХАЛА. Несмотря на подавляющую арабскую агрессию, ЦАХАЛ продолжает сражаться и проливать кровь врага за каждый дюйм нашей священной земли, которую они захватывают. Вот почему сирийцы недавно направили нам предложение о прекращении огня. Принять его-значит позволить арабским армиям оккупировать Голанские высоты и Север Израиля. Хотя мы потеряем нашу землю, по крайней мере, это даст нам время перегруппироваться и обеспечить выживание остального Израиля. Однако некоторые высокопоставленные чиновники предлагают нам бороться дальше, довериться нашей вере и народу. Оказаться во власти врага было бы хуже смерти."
 ISR_1973.20.a: "Принять прекращение огня"
 ISR_1973.20.b: "Мы будем сражаться до последнего!"
  
 #Decisions 
  
 ###Syria### 
  
 SYR_1973.1.t: "Верните себе Голанские высоты!"
 SYR_1973.1.d: "В течение нескольких месяцев мы готовились нанести удар по врагу вместе с нашими братьями в Египте. Теперь, когда они нанесли сокрушительный удар по сионистам, пришло время и нам присоединиться. Сионисты понятия не имеют о наших приготовлениях и недооценивают нас. Мы отомстим за прошлые унижения и восстановим не только арабскую гордость, но и наши оккупированные земли. Люди движимы своим справедливым делом и с нетерпением ждут призыва двигаться вперед."
 SYR_1973.1.a: "Вперед к победе!"
  
 SYR_1973.2.t: "Голан восстановлен!"
 SYR_1973.2.d: "Наши приготовления и перевооружение окупились для Сирийской арабской армии. Теперь мы контролируем Голаны, восстанавливая сирийское правление на земле, несправедливо отнятой у нас. Сионистские силы были не в состоянии противостоять нашим превосходящим силам. Теперь, когда мы отвоевали нашу землю, есть некоторые призывы от высших должностных лиц и военных лидеров, что, возможно, пришло время предложить прекращение огня. Когда Голаны будут в безопасности, мы сможем легко договориться о возвращении их обратно и закончить войну до того, как сионисты смогут восстановить свои позиции. Другая фракция, однако, утверждает, что мы должны продолжать наступление и освободить больше арабских земель, особенно с таким слабым врагом."
 SYR_1973.2.a: "Предложите Израилю прекратить огонь"
 SYR_1973.2.b: "Давайте завершим наше завоевание! "
  
 SYR_1973.3.t: "Еще больше освобожденных земель"
 SYR_1973.3.d: "Храбрые бойцы Сирийской арабской армии продолжили свой успех и захватили контроль над северной Палестиной, землей, которую сионисты оккупировали в течение многих лет. Вражеские силы продолжают быть разбитыми нашей военной мощью. И снова некоторые из наших высших руководителей предлагают нам предложить сионистам перемирие. Они заявляют, что мы одержали ошеломляющую победу, и теперь настало время прекратить боевые действия на наших условиях. В то же время другие в руководстве призывают нас продолжать борьбу. Они утверждают, что это прекрасная возможность покончить с сионистской угрозой навсегда, и мы не можем упустить этот шанс."
 SYR_1973.3.a: "Предложите Израилю прекращение огня"
 SYR_1973.3.b: "Давайте завершим наше завоевание!"
  
 SYR_1973.4.t: "США выдвигают ультиматум"
 SYR_1973.4.d: "Как сионисты терпят поражение за поражением от рук наших храбрых вооруженных сил. Их сопротивление рушится по мере того, как мы продолжаем отвоевывать у них арабские земли. Однако у сионистов был еще один трюк в рукаве, поскольку их агенты убедили Соединенные Штаты выдвинуть ультиматум с требованием немедленно прекратить войну. Учитывая, что мы уже основательно потрепали врага и достигли своих целей, возможно, пришло время объявить перемирие и избежать этой американской угрозы. Однако другие считают, что американцы блефуют, и это сионистская уловка. Они считают, что мы должны проигнорировать этот ультиматум и попытаться покончить с врагом."
 SYR_1973.4.a: "Предложите Израилю прекращение огня"
 SYR_1973.4.b: "Игнорировать"
  
 SYR_1973.5.t: "Соединенные Штаты вмешиваются!"
 SYR_1973.5.d: "Настроение в Дамаске резко изменилось. Паника охватила улицы, поскольку граждане начали готовиться к прибытию американских бомбардировщиков, держась подальше от улиц и накапливая припасы. Правительственные и военные объекты укрепляются по мере того, как высокопоставленные правительственные чиновники и офицеры пытаются понять, что Соединенные Штаты вступили в войну против нашей нации. Мы думали, что их ультиматум был просто уловкой, и не думали, что они всерьез присоединятся к конфликту. Однако теперь уже слишком поздно, и, несмотря на опасность, мы должны верить, что наши вооруженные силы справятся с задачей разгрома американцев."
 SYR_1973.5.a: "Значит, они не блефовали..."
  
 SYR_1973.6.t: "Израиль принимает прекращение огня!"
 SYR_1973.6.d: "Годы перевооружения и месяцы подготовки к этой войне достигли своей цели. Сирийские вооруженные силы, используя храбрость и энергию, успешно отбили оккупированные Голаны у сионистских врагов. Наши войска, вдохновленные святостью своей миссии, отбивали все попытки противника. Выполнив свою миссию, мы любезно предложили перемирие, которое трусливые сионисты приняли. Голанские высоты теперь снова являются частью Сирии, и мы никогда больше их не потеряем."
 SYR_1973.6.a: "Победа!"
  
 SYR_1973.7.t: "Израиль принимает прекращение огня!"
 SYR_1973.7.d: "Годы перевооружения и месяцы подготовки к этой войне достигли своей цели, а затем и некоторых. Сирийские вооруженные силы, используя храбрость и энергию, успешно отбили оккупированные Голаны у сионистов. Наши войска, вдохновленные святостью своей миссии, с Голанских высот двинулись вглубь Палестины, чтобы освободить арабские земли, оккупированные сионистами. Несмотря на то, что наши силы сокрушали врага, мы любезно предложили перемирие, которое смиренные сионисты приняли. Голанские высоты теперь снова являются частью сирийской нации. Мы также решительно оккупируем северную Палестину, чтобы защитить арабские земли от нового осквернения."
 SYR_1973.7.a: "Победа!"
  
 SYR_1973.8.t: "Израиль отвергает прекращение огня"
 SYR_1973.8.d: "Наши лидеры в Дамаске были удивлены отказом Израиля от нашего прекращения огня и прекращения боевых действий. Их глупая гордыня ослепила реальность того, что наша сирийская арабская армия продолжает превосходить сионистские силы и отбрасывать их назад. Хотя наше предложение было щедрым, это не означало, что мы ослабим или замедлим наши усилия. Мы продолжим наше наступление и заставим сионистов пожалеть о своем решении. Освобождение священных арабских земель будет продолжаться."
 SYR_1973.8.a: "Итак, они выбрали смерть..."
  
 SYR_1973.9.t: "Получено предложение о прекращении огня"
 SYR_1973.9.d: "Сионисты недавно предложили прекратить боевые действия между нами. Наши храбрые военные упорно и самоотверженно сражались с врагом, подкрепленным иностранной помощью. Несмотря на превосходство наших сил, мы продолжаем сражаться с ними на равных, и успех наших бойцов, несомненно, подтолкнул сионистов предложить перемирие с соглашением о возвращении к довоенным границам. Кое-кто из руководства считает, что мы хорошо зарекомендовали себя, и прекращение огня было бы разумным. Другие призывают нас отвергнуть сионистское предложение и идти дальше. Они говорят, что враг, очевидно, находится на грани краха против нас и пытается прекратить боевые действия, прежде чем мы переломим ситуацию."
 SYR_1973.9.a: "Принять прекращение огня"
 SYR_1973.9.b: "Мы будем сражаться до последнего!"
  
 SYR_1973.10.t: "Получено предложение о прекращении огня"
 SYR_1973.10.d: "Хотя наши войска отступили на оборонительные позиции, они продолжают храбро сражаться против подавляющей сионистской оппозиции. Отражая боль, которую мы причиняем наступающему противнику, мы получили от него предложение о прекращении огня. Они, без сомнения, не желают терять больше жизней в попытке вытеснить нас. Хотя мы потеряли земли, некоторые в руководстве считают, что принятие перемирия сейчас пойдет нам на пользу, поскольку мы показали народу нашу преданность делу. Однако другая фракция говорит, что мы никогда не должны вести переговоры с врагом, и если это конец, мы должны сражаться до последнего человека и верить, что Бог переломит ситуацию для нас."
 SYR_1973.10.a: "Принять прекращение огня"
 SYR_1973.10.b: "Мы будем сражаться до последнего!"
  
 SYR_1973.11.t: "Советский Союз вмешивается!"
 SYR_1973.11.d: "Сегодня в Сирии царит ощутимое настроение оптимизма и даже радости. Наш народ получил известие, что Советский Союз решил вмешаться и помешать сионистам уничтожить регион в своих корыстных целях. Советский Союз признает злые намерения нашего врага и готов помочь нам в любом случае. Наши официальные лица уже разговаривают по телефону или договариваются о встречах со своими советскими коллегами. Поскольку Советы внимательно следили за ходом войны, мы ожидаем, что их поддержка скоро придет."
 SYR_1973.11.a: "Бог как ответил на наши молитвы!"
  
