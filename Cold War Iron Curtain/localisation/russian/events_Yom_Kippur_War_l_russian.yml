 ###USA### 
  
 USA_1973.1.t: "Египет Отвоевывает Синай"
 USA_1973.1.d: "Совет национальной безопасности был проинформирован о том, что египетские вооруженные силы успешно отбили Синай у израильских войск. Эта новость стала шоком для наших аналитиков и военных руководителей, которые все были под впечатлением, что израильтяне легко смогут противостоять египетскому нападению. Однако аналитики связывают этот египетский успех с неожиданностью их нападения и по-прежнему настаивают на том, что, как только израильские войска перегруппируются, они смогут сдержать дальнейшее продвижение египтян и даже могут отодвинуться к Синаю. Однако, учитывая, насколько они ошибались раньше, нам, возможно, придется внимательно следить за развитием ситуации на местах."
 USA_1973.1.a: "Мы будем внимательно следить за этим."
  
 USA_1973.2.t: "Египет Продвигается Дальше"
 USA_1973.2.d: "Публично израильское правительство настаивает на том, что ситуация находится под его контролем, но наши разведывательные службы и средства массовой информации все чаще указывают на продолжающееся продвижение египетских войск вглубь собственно Израиля. Недавно израильский посол призвал нас к более активному участию и сказал, что он опасается, что полная победа Египта приведет к гуманитарному кризису и массовым депортациям в количестве, невиданном со времен Второй мировой войны. Некоторые в Совете национальной безопасности согласны с этим и предлагают поставить египтянам ультиматум, чтобы они прекратили боевые действия и предложили прекратить огонь или рискнуть нашим вмешательством. Полное поражение Израиля катастрофически разрушило бы нашу внешнюю политику в регионе, и многие американцы поддерживают Израиль. Однако другие высокопоставленные чиновники считают, что мы не должны вмешиваться в конфликт и рисковать, вводя войска в иностранную войну."
 USA_1973.2.a: "Предупредить Египет"
 USA_1973.2.b: "Никакого вмешательства"
  
 USA_1973.3.t: "Египет Проигнорировал наш ультиматум"
 USA_1973.3.d: "Египетское правительство проигнорировало наш ультиматум о том, что оно должно предложить прекращение огня и прекратить боевые действия с Израилем. Они достигли своих целей и теперь стремятся уничтожить государство Израиль. Это сильно возмутило многих американцев. У нас есть средства, готовые развернуть и остановить египтян, но некоторые в кабинете министров сейчас говорят, что, несмотря на ультиматум, мы все равно не должны вмешиваться. Они утверждают, что затягивание конфликта и привлечение американских сил только усложнит ситуацию. Однако другие члены кабинета и военные лидеры говорят, что наше правительство дало обещание, и мы должны выполнить его, вмешавшись против египетской агрессии."
 USA_1973.3.a: "Они нас вынудили"
 USA_1973.3.b: "Никакого вмешательства"
  
 USA_1973.4.t: "Сирия берет Голаны"
 USA_1973.4.d: "Голанские высоты давно желанны сирийцам после того, как они потеряли контроль над ними израильтянам. Однако во время продолжающейся войны в регионе сирийские войска изгнали израильтян с Голанских Высот и теперь контролируют их. Это застало наших высокопоставленных разведчиков и региональных экспертов совершенно врасплох, поскольку большинство экспертов полагали, что израильтяне легко сдержат сирийскую попытку. Когда израильские войска перегруппируются после этой неудачи, они могут переломить ход боевых действий, но сирийцы так же легко могут продолжить свой успех в северном Израиле, и нам придется внимательно следить за тем, как будут развиваться боевые действия с этого момента."
 USA_1973.4.a: "Мы будем внимательно следить за этим"
  
 USA_1973.5.t: "Сирия Продвигается Дальше"
 USA_1973.5.d: "После их успеха на Голанах Совет национальной безопасности был проинформирован сегодня о том, что сирийские войска сейчас находятся глубоко на севере Израиля. Израильское сопротивление, похоже, ослабевает, и израильский посол в частном порядке высказал свои опасения, что сирийцы вполне могут уничтожить государство Израиль. Совет национальной безопасности отметил этот потенциальный сценарий и обсудил вопрос о том, следует ли направить сирийцам ультиматум с требованием прекратить боевые действия и предложить прекращение огня или столкнуться с американской интервенцией. Многие считают, что одной угрозы должно быть достаточно, чтобы положить конец боевым действиям. Однако другие участники встречи заявили, что, хотя потеря Израиля разрушит американскую внешнюю политику в регионе, возможно, лучше не ввязываться в боевые действия."
 USA_1973.5.a: "Предупредить Сирию"
 USA_1973.5.b: "Никакого вмешательства"
  
 USA_1973.6.t: "Сирия Игнорирует наш ультиматум"
 USA_1973.6.d: "На экстренном заседании Совета национальной безопасности было сообщено, что сирийское правительство решило проигнорировать наш ультиматум, и их войска продолжают наступать на Израиль. Силы готовы к наступлению, и многие на встрече призывают Америку сдержать свое слово и преподать Сирии урок. На данном этапе Сирия достигла своих целей, и теперь они ведут войну на уничтожение. Другие участники встречи указывают на то, что сирийцы назвали наш блеф блефом и наша тактика принуждения к миру провалилась, они говорят, что это не означает, что американцы должны вмешиваться."
 USA_1973.6.a: "Они нас вынудили"
 USA_1973.6.b: "Никакого вмешательства"
  
 ###Soviet Union### 
  
 SOV_1973.1.t: "Израиль удерживает Синай"
 SOV_1973.1.d: "На совещании высших военных, разведывательных и политических руководителей было сообщено, что попытка египетских военных захватить Синай не увенчалась успехом. Израиль по-прежнему контролирует Синай, к большому разочарованию египтян. Египтяне используют наше оборудование и опыт, мы будем продолжать оказывать им поддержку, но сейчас мы можем только наблюдать. Египтяне настаивают на том, что их войска в настоящее время ведут борьбу с израильтянами, но ситуация может измениться по мере продолжения боевых действий."
 SOV_1973.1.a: "Мы будем внимательно следить за этим"
  
 SOV_1973.2.t: "Израиль вторгается в Египет"
 SOV_1973.2.d: "На совещании высших военных, разведывательных и политических руководителей было сообщено, что израильские войска продвигаются в Египет с Синая, несмотря на сопротивление египтян. Продолжающееся наступление израильтян можно рассматривать только как попытку нанести чрезмерное карательное наказание народу Египта. Израильская оккупация Суэцкого канала может угрожать и нашим экономическим интересам. Было решено обсудить, должны ли мы сказать израильтянам, что они должны прекратить боевые действия и предложить перемирие или рискнуть советским вмешательством. Чувствовалось, что угроза нашего участия заставит их прекратить войну. Однако другие утверждали, что мы не должны даже выдвигать такой ультиматум и должны позволить конфликту завершиться самому по себе, поскольку советский народ не заинтересован в ведении внешней войны."
 SOV_1973.2.a: "Предупредить Израиль"
 SOV_1973.2.b: "Никакого вмешательства"
  
 SOV_1973.3.t: "Израиль Игнорирует Ультиматум"
 SOV_1973.3.d: "Чрезмерно уверенное в себе израильское правительство высокомерно отказалось принять наш ультиматум. Для многих это решение подтвердило их оценку того, что Израиль стремится нанести карательное наказание египтянам. Ради египетского народа и нашей экономики мы должны сейчас действовать. Израильтяне могут решить уничтожить Суэц или, что еще хуже, заблокировать его от нашего движения, чтобы наказать нас в будущем, поэтому мы должны вмешаться сейчас, чтобы защитить Египет и наши интересы. Однако есть те, кто считает, что ультиматум был направлен на то, чтобы заставить мир не представлять серьезной угрозы, и поскольку израильтяне назвали это блефом, было бы лучше просто позволить войне продолжаться до ее естественного завершения."
 SOV_1973.3.a: "Они нас вынудили"
 SOV_1973.3.b: "Никакого вмешательства"
  
 SOV_1973.4.t: "Израиль защищает Голаны"
 SOV_1973.4.d: "Сирийские военные, используя нашу технику и доктрину, начали наступление с целью освобождения от них оккупированных израильтянами Голанских высот. Эти усилия не увенчались успехом, поскольку израильские войска по-прежнему контролируют Голаны. Сирийские военные настаивают на том, что боевые действия зашли в тупик и скоро они прорвутся, но есть опасения, что израильские войска вскоре могут войти в саму Сирию. Наши разведывательные и дипломатические силы продолжают наблюдение и будут держать нас в курсе любых изменений ситуации."
 SOV_1973.4.a: "Мы будем внимательно следить за этим"
  
 SOV_1973.5.t: "Израиль продвигается вперед в Сирии"
 SOV_1973.5.d: "Израильские военные продвигаются все глубже в Сирию, оттесняя сирийских военных назад. Хотя сирийцы по-прежнему настаивают на том, что они все еще контролируют ситуацию, ясно, что израильтяне продвигаются вперед. Сирийский посол в частном порядке рассказал нам о своих опасениях относительно намерений Израиля в отношении его страны. Наши собственные аналитики опасаются, что израильтяне стремятся проникнуть в Сирию и вызвать гуманитарный кризис в регионе, которого не было с момента появления Израиля. Высшее политбюро обсуждает, должны ли мы или не должны посылать Израилю ультиматум, чтобы прекратить боевые действия или рискнуть нашим вооруженным вмешательством."
 SOV_1973.5.a: "Предупредить Израиль"
 SOV_1973.5.b: "Никакого вмешательства"
  
 SOV_1973.6.t: "Израиль Проигнорировал Ультиматум"
 SOV_1973.6.d: "Израильское правительство решило не отвечать на наше требование прекратить боевые действия против Сирии или столкнуться с нашей интервенцией. Многие высокопоставленные военные и политические лидеры утверждают, что отказ Израиля свидетельствует о наших опасениях, что они осуществят катастрофические и негативные преобразования в регионе. Они также считают, что наши силы легко разрешат конфликт и преподадут урок Израилю. Другие, однако, утверждают, что смысл ультиматума состоял в том, чтобы принудить к миру, и это не было достигнуто. Вместо того чтобы ввязываться в рискованную иностранную войну, мы должны просто ждать, чем это закончится."
 SOV_1973.6.a: "Они нас вынудили"
 SOV_1973.6.b: "Никакого вмешательства"
  
 ###World News### 
  
 Arab_Israeli_war_1973.1.t: "[GetNewspaperHeader]Арабо-израильская война 1973 года"
 Arab_Israeli_war_1973.1.d: "Египетские и сирийские военные предприняли скоординированную внезапную атаку против израильских сил на Синае и Голанских высотах, начав новый раунд арабо-израильской войны. Сообщалось, что израильские военные находятся в состоянии низкой готовности из-за праздника Йом-Кипур, а первоначальные сообщения из Египта и Сирии свидетельствуют о том, что израильские линии были прорваны. Израиль призвал своих резервистов и поклялся отогнать захватчиков. Египетское и сирийское правительства объявили, что их нападения знаменуют собой конец десятилетий унижения."
 Arab_Israeli_war_1973.1.a: "Ну вот, опять"
  
 Arab_Israeli_war_1973.2.t: "[GetNewspaperHeader]Американское вмешательство в арабо-израильскую войну"
 Arab_Israeli_war_1973.2.d: "Соединенные Штаты сегодня объявили, что вмешаются в арабо-израильскую войну, чтобы защитить Израиль от угрозы уничтожения, с которой он сталкивается со стороны своих врагов. Американское правительство настаивает на том, что продолжающееся нападение на Израиль сейчас неспровоцировано и направлено только на то, чтобы полностью выкорчевать израильский народ и вызвать гуманитарную катастрофу. Американские войска находятся в состоянии боевой готовности с самого начала конфликта, и аналитики полагают, что американские войска могут прибыть в ближайшее время. В то время как израильское правительство приветствовало эту новость, настроение в арабском лагере стало подавленным, и многие утверждали, что американское вмешательство является заговором. До сих пор Советский Союз не дал ответа, но, как ожидается, вскоре отреагирует на эту эскалацию.""
 Arab_Israeli_war_1973.2.a: "Эта война будет только хуже"
  
 Arab_Israeli_war_1973.3.t: "[GetNewspaperHeader]Советская интервенция"
 Arab_Israeli_war_1973.3.d: "Советский Союз объявил, что его войска будут вмешиваться в продолжающуюся арабо-израильскую войну против Израиля. Советы заявляют, что продолжающееся израильское нападение неспровоцировано, неоправданно, и они опасаются, что результатом будет депопуляция, невиданная с тех пор, как Израиль впервые появился. Новости из арабского лагеря были радостными, в то время как в Израиле это чувство было описано как траур среди многих. Советские войска находятся в состоянии боевой готовности с начала войны, и ожидается, что они быстро придут. Израильское правительство называет эти действия подтверждением международного предубеждения против существования Израиля. До сих пор Соединенные Штаты не дали ответа, но, как ожидается, вскоре отреагируют на эту эскалацию."
 Arab_Israeli_war_1973.3.a: "Эта война будет только хуже"
  
 Arab_Israeli_war_1973.4.t: "[GetNewspaperHeader]Победа Израиля над Египтом!"
 Arab_Israeli_war_1973.4.d: "Несмотря на то, что на Синае египтяне неожиданно нанесли сокрушительный удар, израильским военным удалось выйти победителями. Порой, сталкиваясь с превосходящими силами хорошо дисциплинированного и хорошо оснащенного противника, израильские войска держались мужественно. Настроение в Израиле-это не столько ликование, сколько облегчение от того, что они упорно продолжали этот опасный конфликт. Уже сейчас призывают к расследованию, чтобы выяснить, почему военные оказались не готовы к египетскому нападению через Синай. Между тем в Каире существует ощущение, что победа была предана иностранным заговором. Многие считают, что египетский солдат оказался равным израильскому солдату, и, несмотря на результаты, Израиль теперь знает, что не может принимать свое господство как должное. Однако факт остается фактом: Израиль сорвал наступление на Египет и добился своей цели."
 Arab_Israeli_war_1973.4.a: "Интересно"
  
 Arab_Israeli_war_1973.5.t: "[GetNewspaperHeader]Победа Израиля над Сирией!"
 Arab_Israeli_war_1973.5.d: "Несмотря на сокрушительное внезапное нападение сирийцев на Голанских высотах, израильским военным удалось выйти победителями. Порой, сталкиваясь с превосходящими силами хорошо дисциплинированного и хорошо оснащенного противника, израильские войска держались мужественно. Настроение в Израиле-это не столько ликование, сколько облегчение от того, что они упорно продолжали этот опасный конфликт. Уже звучат призывы к расследованию, чтобы выяснить, почему военные оказались не готовы к сирийскому нападению. Между тем в Дамаске существует ощущение, подпитываемое пропагандой, что победа была предана иностранным заговором. Многие считают, что сирийский солдат оказался равным израильскому солдату, и, несмотря на результаты, Израиль теперь знает, что не может принимать свое господство как должное. Однако факт остается фактом: Израиль сорвал наступление на Сирию и добился своей цели."
 Arab_Israeli_war_1973.5.a: "Интересно"
  
 Arab_Israeli_war_1973.6.t: "[GetNewspaperHeader]Победа Египта над Израилем!"
 Arab_Israeli_war_1973.6.d: "Внезапное нападение египтян на Синай оказалось сокрушительным первым успехом, когда египетские войска шли к победе над своим врагом в Израиле. Известие о победе вызвало появление ликующих толп по всему Египту, особенно в Каире, чтобы отпраздновать победу. После того, что многие египтяне считали годами национального унижения, они теперь видят, что их национальная гордость восстановлена. В Израиле настроение довольно унылое из-за неспособности израильских военных противостоять египтянам. Уже проводятся расследования, чтобы возложить вину на провал разведки и руководства в критические часы начала войны. Многие в Израиле считают, что если бы страна была подготовлена, египтянам никогда не удалось бы выиграть конфликт. Как бы то ни было, победа Египта сейчас меняет баланс сил в регионе."
 Arab_Israeli_war_1973.6.a: "Интересно"
  
 Arab_Israeli_war_1973.7.t: "[GetNewspaperHeader]Победа Сирии над Израилем!"
 Arab_Israeli_war_1973.7.d: "Внезапное нападение Сирии на Голанские высоты оказалось разрушительным первым успехом, когда сирийские войска шли к победе над своим врагом в Израиле. Весть о победе вызвала появление ликующих толп по всей Сирии, особенно в Дамаске. После того, что многие сирийцы считали годами национального унижения, теперь они видят, что их национальная гордость восстановлена. В Израиле настроение довольно унылое из-за неспособности израильских военных противостоять сирийцам. Уже проводятся расследования, чтобы возложить вину на провал разведки и руководства в критические часы начала войны. Многие в Израиле считают, что если бы страна была подготовлена, сирийцам никогда не удалось бы выиграть конфликт. Как бы то ни было, победа Сирии сейчас меняет баланс сил в регионе."
 Arab_Israeli_war_1973.7.a: "Интересно"
  
 The_October_War: "Октябрьская война"
 The_October_War_desc: "Ситуация на Ближнем Востоке в последнее время зашла в тупик. Израильтяне остаются твердыми и не желают уступать своей выгодной позиции. Поскольку сверхдержавы не могут или не хотят выйти из тупика, арабские государства, особенно Египет, должны рассмотреть возможность военной операции по размораживанию ситуации. Арабские государства гораздо более подготовлены к военному конфликту, чем в прошлом, а отказ израильтян идти на компромисс свидетельствует о чрезмерной самоуверенности. Дальнейшее промедление позволит израильтянам еще больше окопаться. Если арабские государства упустят этот момент, у них может не быть другого шанса."
