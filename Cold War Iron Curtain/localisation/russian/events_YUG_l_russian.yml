l_russian:
 yug.1.t: "Объединение Триеста"
 yug.1.d: "Настало время вернуть город Триест, который в настоящее время контролируется СБ ООН. Триест разделяется на зону А, главный город, и зону B, сельскую местность за пределами Триеста. Мы получим сельскую местность, а Италия - город. Допустим ли мы это разделение или хотим получить обе части?"
 yug.1.a: "Мы допускаем раздел."
 yug.1.b: "Мы хотим вернуть обе части!"
 yug.2.t: "Угрозы от Италии"
 yug.2.d: "Италия, встав на сторону Великобритании и США, угрожает нам разделить город. Если мы не отступим, то вторгнемся в Триест, но это может привести к войне между нами и Италией. Если мы отступим, то получим свою долю, и все останется мирно."
 yug.2.a: "Мы начинаем войну! Сейчас же!"
 yug.2.b: "Мы сохраним мир."
 yug.4.t: "Коллективное управление"
 yug.4.d: "Руководители шести республик приняли решение, что представитель каждой республики будет составлять специальный совет для руководства страной, и мы надеемся на то, что эти люди смогут сохранить единство нашей нации."
 yug.4.a: "Это те, кому можно доверять."
 yug.4.b: "Собрать всех участников самостоятельно."
 yug.4.c: "Пусть республики сами выбирают."
 yug.5.t: "Коррупционный скандал"
 yug.5.d: "У нас есть основания подозревать, что члены Совета воруют из нашего бюджета, и мы должны положить этому конец."
 yug.5.a: "Расследование дела о коррупции"
 yug.5.b: "Мы не можем допустить, чтобы это стало достоянием общественности."
 yug.7.t: "Преемник Тито"
 yug.7.d: "Министры и советники пришли к выводу, что мы должны назначить нового президента для управления страной."
 yug.7.a: "Назначить вице-президента."
 yug.7.b: "Назначить главу Хорватии."
 yug.7.c: "Назначить главу Сербии."
 yug.8.t: "Чистки в правительстве"
 yug.8.d: "В Сербии и Хорватии проводится чистка, чтобы уволить всех министров, которые не согласны с нашей новой политикой."
 yug.8.a: "Все, что необходимо"
 yug.9.t: "Суэцкий кризис"
 yug.9.d: "Конфликт произошел между Великобританией и Египтом, мы склонны поддержать Египет, однако это может быть не лучшим решением."
 yug.9.a: "Поддержать Египет."
 yug.9.b: "Остаться в стороне."
 yug.10.t: "Афганский вопрос"
 yug.10.d: "Лидер Афганистана просит присоединиться к Движению неприсоединения, однако у нас есть основания полагать, что Советы проявляют интерес к этому району. Позволим ли мы ему присоединиться или откажем в его просьбе?"
 yug.10.a: "Разрешить им присоединиться."
 yug.10.b: "Мы не можем так рисковать."
 yug.11.t: "Сербские радикалы сместили Тито!"
 yug.11.d: "Вооруженная группа, которая ранее штурмовала столицу, теперь выдвинула свои цели. Они утверждают, что являются сербскими националистами, которые решили провозгласить Югославию Великой Сербией. Бывший лидер Тито, как сообщается, покинул страну и теперь возглавляет югославское правительство в изгнании в Триесте. Среди хаоса и Хорватия, и Босния провозгласили независимость от этого нового государства."
 yug.11.a: "Наша мечта наконец сбылась."
 yug.12.t: "Хорватские националисты казнили Тито!"
 yug.12.d: "Earlier today, a public broadcast was held in Federal Assembly building in Belgrade. There, several high ranking members of the Communist party including Tito himself were held at gunpoint by several Croat nationalists: 'For too long, has Croatia been left in the shadows. However, starting from today, that is no more! Today, my friends, will start a new decade for us, as we shall become Greater Croatia!, the leading figure of the group said in a speech. Moments after this, he and the other members executed Tito and the other politicians. Nations around the world are shocked by this and many of the people of former Yugoslavia are scared about what this means for them. Due to this, many nations of the former Yugoslavia declared independence to distance themselves from the violent Croats.'"
 yug.12.a: "Победа для родины"
 yug.13.t: "Переворот радикалов"
 yug.13.d: "Из столицы поступают сообщения о том, что вооруженная группа взяла штурмом правительственные здания и взяла под свой контроль правительство. Хотя еще не было установлено, кто эти люди, они объявили, что Тито пока останется в качестве лидера."
 yug.13.a: "Наступили тёмные времена."
 yug.14.t: "Бледское соглашение-"
 yug.14.d: "Теперь, когда мы примирились с Советами, мы можем заключить Бледское соглашение и приблизиться на один шаг к созданию балканской Федерации."
 yug.14.a: "Отлично!"
 yug.15.t: "Давление на Болгарию"
 yug.15.d: "Нужно оказать давление на Болгарию, чтобы она выполнила соглашение."
 yug.15.a: "Надавите на них."
 yug.16.t: "Югославия хочет объединиться"
 yug.16.d: "Югославия просит нас присоединиться к нам в соответствии с Бледским соглашением."
 yug.16.a: "Разрешить им."
 yug.16.b: "Отказать им."
 yug.17.t: "Дипломаты в Албании"
 yug.17.d: "Пошлите наших дипломатов в Албанию, чтобы предложить союз."
 yug.17.a: "Надавите на них."
 yug.18.t: "Давление на Румынию"
 yug.18.d: "Нужно оказать давление на Румынию на вступление в союз с южными славянами."
 yug.18.a: "Надавите на них."
 yug.19.t: "Югославия хочет объединиться"
 yug.19.d: "Балканская федерация просит нас присоединиться к ним."
 yug.19.a: "Присоединиться к ним"
 yug.19.b: "Отказать"
 yug.20.t: "[GetNewspaperHeader]Провозглашение Балканской федерации"
 yug.20.d: "[YUG.GetLeader] оглядел взволнованную и беспрецедентно патриотическую толпу, провозгласившую создание Балканской Федерации, состоящей из Югославии и вновь оккупированных государств Албании и Болгарии. Хотя конфликт, необходимый для установления контроля над двумя другими государствами, был жестоким и иногда кровавым, сейчас все затаили дыхание, поскольку начинается новая эра без затягивающейся петли советской тирании. Балканская Федерация, давно подавляемая капризами империалистических наций, разбросанных по всей Европе, теперь будет верить мечте Тито о сильном, интернационалистическом, социалистическом, но независимом государстве, которое будет продвигать Балканы в будущее и защищать их право решать свою собственную судьбу."
 yug.20.a: "Пусть это продлится тысячу лет!"
 yug.20.b: "Эти наглые дураки!"
 yug.20.c: "Интересно."
 yug.21.t: "Румынская марионетка"
 yug.21.d: "Румыния не подчинится нашей воле, мы должны заменить ее правительство."
 yug.21.a: "Это должно быть сделано."
 yug.22.t: "Приглашение Греции"
 yug.22.d: "Пригласите наших старых греческих друзей присоединиться к нам и разделить наше процветание."
 yug.22.a: "Отправьте им наше предложение."
 yug.23.t: "Уничтожить восстание."
 yug.23.d: "Оппозиционные группы раздувают огонь гражданской войны, выступая против радикального захвата власти. Пришло время покончить с этой маленькой игрой."
 yug.23.a: "Сокрушите их!"
 yug.24.t: "Бандунгская конференция"
 yug.24.d: "Представители 29 "неприсоединившихся" стран Африки, Азии и Ближнего Востока встретились, чтобы осудить колониализм, осудить расизм и выразить свои оговорки по поводу растущей сегодня холодной войны между Соединенными Штатами и Советским Союзом."
 yug.24.a: "Какая продуктивная конференция!"
 yug.25.t: "Присоединяйтесь к Движению неприсоединения."
 yug.25.d: "Югославия создала Движение неприсоединения и просит нас присоединиться к этому движению? Может быть, мы присоединимся?"
 yug.25.a: "Да, мы согласны."
 yug.25.b: "Нет, мы не полезем туда."
 yug.26.t: "Экспансия Северной Африки"
 yug.26.d: "Расширение Движения неприсоединения в Северной Африке."
 yug.26.a: "Прекрасно!"
 yug.27.t: "Экспансия на Ближний восток"
 yug.27.d: "Расширение Движения неприсоединения на Ближнем Востоке."
 yug.27.a: "Прекрасно!"
 yug.28.t: "Экспансия в Азию"
 yug.28.d: "Расширение Движения неприсоединения в Азию."
 yug.28.a: "Прекрасно!"
 yug.29.t: "Советская марионетка"
 yug.29.d: "Склонитесь перед Москвой и полностью присоединитесь к Варшавскому договору, став их саттелитом."
 yug.29.a: "Надеюсь, оно того стоит"
 yug.30.d: "Великий маршал Тито произнес сегодня удивительную речь. В своей речи он провозгласил, что Югославия делает поворот к коммунизму и отходит от Титоизма. Хотя многие поддерживают это решение, Некоторые опасаются, что оно приведет к диктатуре, подобной советской."
 yug.31.d: "После долгих препирательств с дипломатами они решили отказаться от наших планов. Когда наши дипломаты вернулись домой разочарованными, нам показалось, что они поддержат военное вторжение в их страну."
 yug.33.d: "Около 720 боснийских крестьян, преимущественно Боснийской национальности, устроили антиправительственные беспорядки в городах Казин и Великая Кладуша в районе Босанской Краины. Повстанцы предприняли попытку захватить город Казин, а также направляются в Бихач и Великую Кладушу. Они сожгли архивы местных властей, разграбили продовольственные склады и перерезали телефонные провода. Мы должны действовать немедленно, иначе ситуация ухудшится."
 yug.34.d: "Отчет о последствиях восстания в Казине здесь. Мы быстро подавили восстание, и восемь участников были убиты в ходе зачистки. Власти арестовали 714 человек; 288 из них предстали перед военным трибуналом, который вынес суровые наказания, в том числе 17 смертных приговоров. Остальные 426 участников были подвергнуты административным наказаниям. Около 777 членов 115 семей были приговорены к коллективному наказанию в виде выселения и переселены в город Србац на севере Боснии. В общей сложности 25 человек были убиты в результате насильственной реакции правительств на восстание. По меньшей мере двенадцать мятежников были убиты в перестрелке с JNA и местной полицией. В качестве жертв были названы следующие восемь человек: Аган Беганович, Ариф Дурмик, Хасан Кавич, Махмут Беганович, Мехмед Мехулджич, Мусо Ковачевич, Сахин Сефераджич, Селим Сарик. Мы также вынесли 17 приговоров о смертной казни через расстрел, которые должны быть приведены в исполнение в ноябре: Аган Коралич, Але Кович, Дедо Кович, Дулага Сумар, Хасан Кекич, Хасиб Беганович, Гусейн Зеканович, Гусейн Капич, Мехмед Табакович, Милан Божич, Миля Милкович, Мухарем Дервишевич, Незир Байрактаревич, Никола Божич, Рамо Караджич, Смаил Айкич, Стоян Старчевич."
 yug.35.d: "В Загребе состоялся 6-й съезд Коммунистической партии Югославии. На съезде присутствовали 2022 делегата, которые представляли 779 382 члена Коммунистической партии Югославии. Помимо избранных делегатов, на съезде присутствовали около 400 гостей-политические, общественные и общественные деятели со всей Федеративной Народной Республики Югославии, а также делегации иностранных коммунистических и социалистических партий. На этом съезде произошли реформистские изменения в партии. Был принят новый устав, в соответствии с которым название партии было изменено на Лига коммунистов Югославии. Была усилена самостоятельность основных партийных организаций и нижних чинов, отменен срок выдвижения кандидатур для приема в партию, а также срок выдвижения кандидатур для членов Центрального Комитета. Съезд также постановил, что Народный фронт Югославии будет преобразован в массовую политическую организацию и переименован в Социалистический Союз трудящихся Югославии. В конце съезда был избран новый центральный комитет в составе 109 членов и новая центральная ревизионная комиссия в составе 23 членов. На первом же заседании Центрального комитета после съезда генеральным секретарем Лиги коммунистов Югославии был избран Иосип Броз Тито. На той же сессии были избраны члены Исполнительного комитета и Секретариат исполнительного комитета."
  
 Yugoslavia_influence_decisions: "Проект Балканской Федерации"
 Yugoslavia_influence_decisions_desc: "Вслед за нашими успехами в последней войне и силой нашей партии мы становимся опорой революции на Балканах. Другие партии в регионе надеются на нас, мы должны руководить ими. В конечном итоге мы объединим Балканы с нашим видением и положим конец всем межнациональным розням. Годы, которые мы потратили на создание нашей партии и налаживание связей с нашими соседями, дают нам прекрасную возможность иметь огромное влияние в регионе."
 Spread_Titoist_Propaganda_ALB: "Распространение пропаганды Тито в Албании"
 Spread_Titoist_Propaganda_BUL: "Распространение пропаганды Тито в Болгарии"
 Spread_Titoist_Propaganda_PDG: "Распространение пропаганды Тито в Греции"
 Integrate_BUL: "Интеграция Болгарии"
 Integrate_PDG: "Интеграция Греции"
 Integrate_ALB: "Интеграция Албании"
 Intervene_in_the_Greek_Civil_War: "Вмешаться в греческую гражданскую войну"
 Integration_YUG: "Должно быть более 75% влияния"
 YUG_proclaim_balkan_federation: "Провозгласить Балканскую Федерацию"
 YUG_proclaim_balkan_federation_desc: "Объединение Балкан больше не является простой мечтой. Объединив Албанию и Болгарию, мы можем провозгласить Балканскую Федерацию. Пролетарии всех стран, объединяйтесь!"
  
 YUG_INTEGRATION.2.d: "Югославская Коммунистическая партия сыграла важную роль во время Второй мировой войны в поддержке албанских коммунистов и освобождении Албании от оси. Когда албанские коммунисты захватили власть после войны, они все еще были связаны с Югославией из-за связей военного времени и присутствия югославских солдат внутри страны. Недавно Югославия использовала свое влияние, чтобы добиться чистки антиюгославских албанских коммунистических лидеров. Поскольку эти противники югославского влияния сидели в тюрьме или были отстранены от власти, албанское правительство оказалось вполне готовым принять предложение Белграда об интеграции Албании в Югославию. Интеграция принесет пользу народу и сделает немыми любые вопросы, касающиеся границ и национальностей. Интеграция знаменует собой продолжающееся шествие революции по объединенным Балканам."
 YUG_INTEGRATION.3.d: "Коммунистические партии Югославии и Болгарии уже давно сотрудничают и поддерживают друг друга. Эти две партии всегда были сильными сторонниками объединения балканских государств под коммунистическим режимом для лучшего распространения марксизма среди народа. После окончания Второй мировой войны обе страны решили македонский вопрос и провели обширные дискуссии об объединении. Эти дискуссии и переговоры принесли свои плоды после недавнего решения Болгарской коммунистической партии принять приглашение Югославии и интегрировать Болгарию в нее. Югославское правительство отметило, что это решение укрепило народ и коммунистов в обеих странах и положило конец любым пограничным или этническим спорам. Югославия становится родиной для всех народов Балканского полуострова, и при коммунизме все будут равны и будут расти вместе. Для болгарских коммунистов это решение отражает их давнюю веру в объединение коммунистических режимов на Балканах."
 YUG_INTEGRATION.1.d: "Народы Греции и Югославии сильно пострадали во время Второй Мировой Войны. Именно коммунистические партии обеих стран возглавили сопротивление и в конечном итоге освободили страну. Однако там, где югославская Коммунистическая партия преуспела в укреплении своего контроля, в Греции коммунистам пришлось бороться с реакционными силами и иностранным вмешательством, прежде чем восторжествовать. Югославия недавно обратилась к греческому правительству с просьбой интегрироваться и прочно закрепить свою революционную победу. После долгих внутренних обсуждений греческое правительство согласилось. Они считают, что в одиночку страна рискует контрреволюционным восстанием или вмешательством в их дела, но объединенное с Югославией государство будет слишком могущественным, чтобы бросить ему вызов. Югославия утверждает, что, объединив все народы Балкан, она положит конец любым пограничным или этническим спорам и более эффективно осуществит коммунизм для народа."
 YUG_GREEK_CIVIL_WAR.1.d: "Народы Греции и Югославии были первыми жертвами агрессии стран оси и были оставлены своими лидерами и союзниками. Благодаря огромным жертвам именно те люди, которые остались позади, освободили себя и только под руководством своих коммунистических партий. В Югославии коммунисты закрепили свои позиции после войны, однако в Греции Коммунистическая партия оказывается в борьбе с реакционными греками. Эти враги греческого народа существуют только потому, что они открыто поддерживаются империалистическими державами и пользуются услугами греческих коллаборационистов для нацистов. Центральный комитет в Белграде признает эту ситуацию и объявил, что он направит югославских солдат, оружие и поддержку греческим коммунистам и поможет им в их борьбе. Их окончательная победа будет победой не только народа Греции, но и всех народов Балкан, борющихся за революцию."
 influence_gain_100: "Даёт 100 очков влияния"
  
  #Country Events 
 Informbiro.1.d: "Период Коминформа охватывает Советско-югославский конфликт, начавшийся в 1948 году. Югославия никогда не зависела от советской поддержки во время Второй мировой войны, в значительной степени освободившись сама. Она также заявила о себе после войны как союзник, а не как сателлит, как того хотели советы. Советский Союз также считал югославскую внешнюю политику слишком независимой и подрывал хрупкое равновесие, установившееся между Советами и Западом. Раскол произошел во время встречи Коминформа 1948 года (Информбюро по-Югославски), на которой югославская Коммунистическая партия была изгнана Советским Союзом и его союзниками. С тех пор как эта резолюция была принята, отношения между Белградом и Москвой еще больше ухудшились, причем советы направили все коммунистические партии на разрыв связей, а Югославия столкнулась с военным наращиванием на своей границе. Однако такая ситуация позволяет Югославии проводить совершенно независимую политику, и этот раскол может дать ей уникальные возможности для получения поддержки и расширения своего влияния."
 Yug_1950s.1.d: "Сегодня началось вещание югославского радио-телевидения. Это первая система общественного вещания для Югославии. Было создано восемь радио-и телевизионных штабов, по одному для каждой входящей в состав Югославии республики и автономной области. Эти станции будут вещать для местной аудитории, но подчеркнут важность национального единства и сотрудничества. Будут освещены важные партийные мероприятия и объявлены объявления о региональных и национальных партийных мероприятиях. Правительство надеется, что югославское радио-телевидение станет мощным средством объединения нации и поощрения взаимопонимания между всеми народами страны."
 AntiSovYug.1.d: "Югославское правительство подтвердило, что видный хорватский коммунистический лидер Андрия Хебранг недавно скончался в тюрьме. Бывший глава хорватской Коммунистической партии был недавно арестован, лишен каких-либо партийных почестей и осужден за сотрудничество с нацистами и их хорватским марионеточным государством во время войны. Учитывая, что Хебранг был арестован немцами и выжил в концлагере, многие считают, что обвинения были сфабрикованы югославской разведкой. Вероятная причина - убежденность центрального руководства в том, что Советы планировали заменить своего лидера Иосипа Тито Хебрангом. Недавний раскол между двумя коммунистическими государствами вызвал напряженность и тревогу внутри Югославии, поскольку многие опасаются просоветского проникновения в партию. Обстоятельства его смерти вызывают подозрения, поскольку не было названо ни одной причины, и тело не было освобождено. Смерть Хебранга удобно снимает угрозу режиму Тито."
 Diljas.1.d: "Милован Джилас, давний и высокопоставленный член партии "Лига коммунистов Югославии", недавно был назначен президентом страны. Он широко рассматривается как преемник нынешнего лидера Иосипа Тито. Будучи коммунистическим теоретиком, Джилас стал главным критиком Советского Союза и сыграл чрезвычайно важную роль в формулировании югославской перспективы во время недавнего раскола с Москвой. В частности, Джилас критиковал массовую советскую бюрократическую систему и проблемы с тем, чтобы центр руководил всей экономической деятельностью. Конечно, советы в прошлом уже открыто призывает к Diljas, чтобы быть очищены. Однако новый президент пользуется поддержкой Тито и высшего руководства, которые попросили его продолжать писать статьи для официальной коммунистической газеты, касающиеся критики советской системы и реформ."
 Diljas.2.d: "За последние несколько месяцев президент Милован Джилас опубликовал в официальной югославской коммунистической газете почти двадцать статей с критикой советской модели. Он начал писать эти статьи под руководством югославского лидера Иосипа Тито. Однако эти критики, хотя и антисоветские, выступают за альтернативную, более демократическую систему партийного правления. Джилас зашел так далеко, что предположил, что однопартийное государство может быть ошибкой, предложив отставить лидеров, чтобы предотвратить коррупцию и открыть путь для других. Эта часть его критики привела к заседанию Центрального комитета, на котором несколько членов высказались за то чтобы убрать Джиласа. После консультаций Иосип Тито и его союзники решили, что критика Джиласа имеет свои достоинства, и партия должна их принять. Это решение удерживает Джиласа у власти и предполагает, что новые реформы уже в пути."
 Diljas.3.d: "За последние несколько месяцев президент Милован Джилас опубликовал в официальной югославской коммунистической газете почти двадцать статей с критикой советской модели. Он начал писать эти статьи под руководством югославского лидера Иосипа Тито. Однако эти критики, хотя и антисоветские, выступают за альтернативную, более демократическую систему партийного правления. Джилас зашел так далеко, что предположил, что однопартийное государство может быть ошибкой, предложив отставить лидеров, чтобы предотвратить коррупцию и открыть путь для других. Эта часть его критики привела к заседанию Центрального комитета, на котором несколько членов высказались за чистку Джиласа. После консультаций Иосип Тито и его союзники сошлись во мнении, что Джилас зашел слишком далеко и его необходимо убрать. Джилас был уволен со всех политических постов, и ожидается, что он вскоре уйдет из партии. Государство Тито все еще твердо верит в мощную партию с твердым лидером для управления Югославией."
 YUG_1950s.2.d: "Недавно была одобрена значительная реформа югославской конституции. Эти реформы направлены на то, чтобы переориентировать страну на самопроизводство, самоуправление и самостоятельную работу, чтобы охватить управление экономикой, образованием и местным самоуправлением. Это отражает отказ Югославии от советской модели, которую она обвиняет в чрезмерной бюрократизации, централизации и неэффективности. Самоуправление сократит государственный контроль над этими институтами и заставит руководителей и администраторов отчитываться перед рабочими советами. Эти реформы укрепляют важность самоуправления в развитии Югославии. Реформы также подчеркивают верховную власть партии, отвергая демократический централизм и одновременно предоставляя большую автономию республикам и автономным областям, входящим в состав Югославии."
 Diljas.4.d: "Президент Милован Дилас недавно опубликовал серию статей, критикующих советскую модель и предлагающих демократическую реформу нынешней однопартийной системы. Эта последняя критика привела к тому, что на заседании Центрального комитета обсуждался вопрос о том, следует ли принять Диласа и его идеи или же его следует убрать за его опасные взгляды. В конце концов партия приняла Джиласа, и он недавно объявил о серии реформ для партии Лиги коммунистов Югославии (СКЮ). Новые реформы ослабят строгие правила партийной дисциплины, открывая путь для более открытой дискуссии внутри партии. В нем также содержится призыв к ротации должностных лиц с высших постов и сверхурочной отставке, с тем чтобы искоренить коррупцию и предотвратить монополизацию власти. Похоже, что высшее руководство во главе с Иосипом Тито приняло свое собственное падение как издержки реформирования партии."
 YUG_NATO.1.d: "Недавно штаб-квартира Соединенных Штатов и НАТО получила предложение от Югославии. Югославское правительство предложило подать заявку и вступить в НАТО в обмен на уступку Триеста этой стране. Югославия утверждает, что Триест был оккупированной территорией, которую югославские войска освободили в ходе войны. Послевоенное соглашение о том, чтобы сделать его свободным городом, было сделано только из уважения к союзникам. Югославия добавила, что предоставление Триеста покажет югославскому народу искренность НАТО. Некоторые члены НАТО, особенно Италия, заявили о своей оговорке к югославскому предложению, указав, что такая сделка лишит мнения жителей Триеста и будет противоречить праву на самоопределение, оставляя НАТО уязвимой для критики коммунистов. Другие задаются вопросом, Может ли Югославия многое предложить альянсу, поскольку она может стать троянским конем для коммунизма."
 YUG_NATO.3.d: "После тщательного рассмотрения правительство Соединенных Штатов сообщило югославскому правительству, что оно не может согласиться с передачей Триеста или вступлением Югославии в НАТО. Американцы настаивали на том, что они очень восхищались Югославией, особенно ее военными успехами и сопротивлением советской гегемонии. Однако народ Триеста имеет право на самоопределение и выбор своего будущего. Соединенные Штаты не должны вмешиваться в это дело. В частном порядке внутри стран-членов НАТО существовали опасения, что принятие этой сделки приведет к напряженности между членами организации. Кроме того, добавление Югославии подорвет антикоммунистическую идентичность организации, а интеграция ее вооруженных сил в стандарты НАТО станет сложной задачей, которую мало кто из ее членов хотел бы решать. Хотя Югославия выразила свое разочарование этим ответом и вновь заявила о своих претензиях в отношении Триеста, она обещала продолжать позитивное взаимодействие с Соединенными Штатами и всеми государствами НАТО."
  
  #News Events 
 YUG_NATO.2.d: "НАТО официально признало Югославию в качестве своего нового члена. Это произошло очень скоро после манифеста Италии о признании югославского суверенитета над Триестом. Вступление Югославии в НАТО дает Североатлантическому союзу видное положение на Балканах, и один из официальных лиц говорит, что НАТО теперь может нанести удар по подбрюшью Советской европейской системы. Многие военные лидеры в НАТО с нетерпением ожидают перспективы модернизации и последующего развертывания мощных югославских вооруженных сил для защиты Североатлантического союза от советской агрессии. Советский Союз осудил этот шаг как эскалацию, которая приведет к милитаризации Балкан, невиданной со времен Балканских войн. Есть даже критики в некоторых государствах-членах НАТО, которые рассматривают решение уступить Триест как сделку по покупке югославского членства, отмечая, что если их можно так легко купить, то что мешает им принять Советскую взятку в будущем."
 YUG_50s.1.d: "Недавний кризис в Венгрии привел к тому, что Югославия вступила в контакт с обеими сторонами в целях содействия достижению позитивного результата для всех сторон. Хотя некоторые на Западе и в советском блоке считают югославские действия гнусными, другие высоко оценили то, что все чаще признается в качестве позитивного нейтралитета. Во время венгерского кризиса Югославия провела переговоры с высшими советскими руководителями и предложила им руководство по управлению инакомыслием внутри Венгрии. Во время боевых действий югославское посольство защищало семью и высокопоставленных членов венгерского правительства, ставших мишенью советских войск. Несмотря на кажущуюся противоречивость политики, югославы утверждают, что они помогли смягчить насилие и напряженность, заняв позицию содействия быстрому мирному урегулированию, оставаясь при этом нейтральными. Некоторые страны в более широком мировом сообществе изучают югославский подход как руководство к тому, как они могут сохранить свои национальные цели, не вызывая при этом реакции со стороны крупных держав."
 HungarianRevYug.1.d: "Правительство Югославии заявило о своей искренней поддержке недавней советской интервенции в Венгрию. Правительство указало, что венгерские коммунисты не смогли контролировать реакционные элементы в венгерском обществе. Они позволили этим силам развратить население, возглавившее восстание. Единственный способ восстановить власть народа в Венгрии заключался в действиях Советского Союза. Югославское правительство также объявило, что оно размещает войска на своей границе с Венгрией, чтобы предотвратить попытки антиреволюционных сил бежать. Он призвал венгров приветствовать своих коммунистических освободителей и выступить против тех антиреволюционных сил, которые удерживают столицу в заложниках."
 HungarianRevYug.2.d: "Югославское правительство продолжает открыто поддерживать венгерскую революцию и осуждает советскую агрессию. Многие венгерские диссиденты в настоящее время находятся под защитой югославского посольства, к большому огорчению советских чиновников и военных руководителей. Кроме того, Югославия продолжает утверждать, что советская акция была репрессией венгерских революционеров, которые просто хотели создать революционное государство, отражающее ценности своего народа. Они не хотели, чтобы советская модель и ее слабости подорвали их революцию. Советы уже осудили Югославию за ее позицию, и кажется, что любые надежды на примирение между двумя ведущими коммунистическими государствами Европы кажутся маловероятными."
  
