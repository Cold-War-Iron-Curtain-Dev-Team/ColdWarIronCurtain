 #YUG Balkan annexation events 
 yug_annex.1.d: "В последние несколько месяцев Югославия постепенно усиливала свое влияние на Болгарию. Теперь, когда ревизионистские титоистские элементы широко распространены по всей стране, они потребовали их полной аннексии в СФРЮ. Как мы ответим на это требование?"
 yug_annex.10.d: "Несколько дней назад Югославия потребовала у СССР разрешения на аннексию нашей страны. К нашему удивлению, Москва согласилась на это возмутительное требование. Теперь Белград прислал нам «предложение» присоединиться к их стране в качестве «Социалистической Республики Болгарии». Хотя мы могли, конечно, отказаться от их требований, тот факт, что Советы фактически отказались от нас, а также высокое титоистское влияние в стране, заставляет некоторых в правительстве серьезно задуматься о согласии."
 yug_annex.11.d: "Несколько удивительно, что Москва согласилась на наше требование интегрировать Болгарию. Зная, что Советы отказались от них, болгары решили проявить благоразумие и приняли наше предложение стать частью нашей великой страны."
 yug_annex.12.d: "Если Москва согласилась с нашими требованиями, то этого нельзя сказать о самих болгарах. Несмотря на то, что их де-факто повелитель фактически бросил их, они все же отказались от нашего предложения присоединиться к нам. Как мы поступим?"
 yug_annex.13.d: "Москва отказала в наших требованиях интегрировать Болгарию. Более того, они предупредили нас, что «ответят на любое нарушение территориальной целостности Болгарии». Может быть, нам стоит просто забыть обо всем этом деле..."
 yug_annex.14.d: "СССР сообщил нам о югославском требовании нашей аннексии, которое они получили за несколько дней до этого. Они, естественно, отказались и заверили нас, что защитят нас от любых актов иностранной агрессии. Еще неизвестно, как отреагирует Белград, но они, скорее всего, отступят, так как знают, что не могут противостоять Советской Армии."
 yug_annex.2.d: "В последние несколько месяцев Югославия постепенно усиливала свое влияние на Албанию. Теперь, когда ревизионистские титоистские элементы широко распространены по всей стране, они потребовали их полной аннексии в СФРЮ. Как мы ответим на это требование?"
 yug_annex.20.d: "Несколько дней назад Югославия потребовала у СССР разрешения на аннексию нашей страны. Поразительно, но Москва согласилась на это возмутительное требование. Теперь Белград прислал нам «предложение» присоединиться к их стране в качестве «Социалистической Республики Албании». Хотя мы могли, конечно, отказаться от их требований, тот факт, что Советы фактически отказались от нас, а также высокое титоистское влияние в стране, заставляет некоторых в правительстве серьезно задуматься о согласии."
 yug_annex.21.d: "Несколько неожиданно Москва согласилась на наше требование интегрировать Албанию. Зная, что Советы отказались от них, албанцы решили проявить благоразумие и приняли наше предложение стать частью нашей великой страны."
 yug_annex.22.d: "Если Москва согласилась с нашими требованиями, то этого нельзя сказать о самих албанцах. Несмотря на то, что их де-факто повелитель фактически бросил их, они все же отказались от нашего предложения присоединиться к нам. Как мы поступим?"
 yug_annex.23.d: "Москва отказала нам в требованиях об интеграции Албании. Более того, они предупредили нас, что «отреагируют на любое нарушение территориальной целостности Албании». Может быть, нам стоит просто забыть обо всем этом деле..."
 yug_annex.24.d: "СССР сообщил нам о югославском требовании нашей аннексии, которое они получили за несколько дней до этого. Они, естественно, отказались и заверили нас, что защитят нас от любых актов иностранной агрессии. Еще неизвестно, как отреагирует Белград, но они, скорее всего, отступят, так как знают, что не могут противостоять Советской Армии."
