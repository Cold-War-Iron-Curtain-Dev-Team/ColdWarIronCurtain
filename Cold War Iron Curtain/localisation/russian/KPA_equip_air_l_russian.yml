l_english:
 KPA_fighter_equipment_0: "Воздушные и противовоздушные силы Корейской народной армии"
 KPA_fighter_equipment_0_short: "KPAAF"
 KPA_fighter_equipment_0_desc: "Воздушные и противовоздушные силы Корейской народной армии являются объединенными военными авиационными силами Северной Кореи. Это второй по численности род войск Корейской народной армии, насчитывающий около 110 000 человек. На вооружении имеется около 950 самолетов различных типов, в основном десятилетней давности советского и китайского производства. Ее главная задача - защита воздушного пространства Северной Кореи"
 KPA_fighter_equipment_1: "Як-3"
 KPA_fighter_equipment_1_short: "Як-3"
 KPA_fighter_equipment_1_desc: "Яковлев Як-3 был одномоторным, одноместным советским истребителем времен Второй мировой войны. Прочный и простой в обслуживании, он очень нравился как пилотам, так и наземному экипажу. Один из самых маленьких и легких боевых истребителей, принятых на вооружение во время войны, его высокое отношение мощности к весу обеспечивало отличные характеристики, и он оказался грозным истребителем собак."
 KPA_fighter_equipment_2: "Ла-7"
 KPA_fighter_equipment_2_short: "Ла-7"
 KPA_fighter_equipment_2_desc: "Ла-7 - советский одноместный истребитель с поршневым двигателем, разработанный во время Второй мировой войны в ОКБ Лавочкина. Он был развитием и усовершенствованием Ла-5 и последним в семействе самолетов, начавшемся с ЛаГГ-1 в 1938 году."
 KPA_fighter_equipment_3: "Ла-9"
 KPA_fighter_equipment_3_short: "Ла-9"
 KPA_fighter_equipment_3_desc: "Ла-9 представляет собой дальнейшее развитие прототипа Лавочкина Ла-126. Первый прототип, получивший обозначение Ла-130, был закончен в 1946 году. Сходство со знаменитым Лавочкиным Ла-7 было лишь поверхностным - новый истребитель имел цельнометаллическую конструкцию и крыло ламинарного типа. Снижение веса за счет исключения из конструкции планера дерева позволило значительно увеличить запас топлива и установить четырехпушечное вооружение. Имитационные бои показали, что Ла-130 был на равных с Ла-7, но уступал Яковлеву Як-3 в горизонтальной плоскости. Новый истребитель, получивший официальное обозначение Ла-9, поступил в производство в августе 1946 года. Всего к концу производства в 1948 году было построено 1 559 самолетов."
 KPA_CAS_equipment_3: "Ил-10"
 KPA_CAS_equipment_3_short: "Ил-10"
 KPA_heavy_fighter_equipment_1: "Як-9"
 KPA_heavy_fighter_equipment_1_short: "Як-9"
 KPA_heavy_fighter_equipment_1_desc: "Як-9 имел укороченный задний фюзеляж с козырьком кругового обзора. Его более легкая металлическая конструкция позволяла увеличить загрузку топлива и вооружение по сравнению с предыдущими моделями, построенными из дерева. Як-9 был маневренным на высокой скорости на малых и средних высотах и легким в управлении, что сделало его одним из самых производимых советских истребителей Второй мировой войны."
 KPA_heavy_fighter_equipment_3: "Ла-11"
 KPA_heavy_fighter_equipment_3_short: "Ла-11"
 KPA_heavy_fighter_equipment_3_desc: "Разработанный в 1947 году, после окончания Второй мировой войны, Ла-11 был дальнейшим развитием Ла-9 \"Фриц\" для создания дальнего истребителя сопровождения. Самолет был оснащен большими шинами, чтобы выдержать возросший вес, и удобствами для длительных полетов, такими как увеличенная обивка сиденья, подлокотники и писсуар. Кроме того, был установлен полный радионавигационный комплекс. Неудивительно, что боевые характеристики с полным запасом топлива ухудшились. Однако по мере того, как загрузка топливом приближалась к показателям Ла-9, улучшались и характеристики. Пилоты Ла-11 на советской, а затем и китайской службе служили в ПВО, сбивая американские \"Мустанги\" и штурмовики во время Корейской войны. По классификации НАТО его название - Fang"
