l_russian:
  #Battleship/Battlecruiser Hulls in research tree# 
  
 ITA_battle_hull_medium_0: "Переоборудование класса Duilio"
 ITA_battle_hull_medium_0_desc: "Класс Andrea Doria (обычно называемый в итальянских источниках классом Duilio) представлял собой пару линкоров-дредноутов, построенных для Королевского флота Италии (Regia Marina) между 1912 и 1916 годами. Два корабля — "Андреа Дориа" и "Дуилио" — были достроены во время Первой мировой войны. Этот класс был постепенным улучшением по сравнению с предыдущим классом "Конте ди Кавур"."
  
 #ITA_carrier_hull_light_0: ""
 #ITA_carrier_hull_light_1: ""
 #ITA_carrier_hull_light_2: ""
 ITA_carrier_hull_light_3: "Класс Джузеппе Гарибальди"
 ITA_carrier_hull_light_4: "Класс Кавура"
 #ITA_carrier_hull_light_0_desc: ""
 #ITA_carrier_hull_light_1_desc: ""
 #ITA_carrier_hull_light_2_desc: ""
 ITA_carrier_hull_light_3_desc: "Джузеппе Гарибальди - итальянский авианосец, первый корабль палубной авиации, когда-либо построенный для ВМС Италии, и первый итальянский корабль, построенный для эксплуатации самолетов с неподвижным крылом. Она оснащена самолетами и вертолетами с коротким взлетом и вертикальной посадкой (STOVL). Джузеппе Гарибальди участвовал в боевых воздушных операциях у берегов Сомали, Косово, Афганистана и Ливии."
 ITA_carrier_hull_light_4_desc: "Корабль предназначен для объединения воздушных операций с неподвижным крылом V/STOL и вертолетом, операций командования и контроля, а также перевозки военного или гражданского персонала и тяжелой техники. Ангар площадью 134 м (440 футов), площадью 2800 м2 (30 000 кв. футов) может использоваться в качестве транспортного отсека, способного вместить до 24 основных боевых танков (обычно Ariete) или гораздо больше более легких машин (50 БМП Dardo, 100+ Iveco LMV), и оснащен в кормовой части пандусами для доступа, рассчитанными на до 70 тонн, а также два подъемника грузоподъемностью до 30 тонн для самолетов."
  
  # Submarine Hulls # 
 ITA_sub_hull_small_single_0: "Класс Tang"
 ITA_sub_hull_small_single_0_desc: "Подводные лодки класса Tang были первыми подводными лодками, спроектированными (в рамках проекта SCB 2) и построенными ВМС Соединенных Штатов после Второй мировой войны. Они вобрали в себя лучшие черты быстроходной немецкой подводной лодки типа XXI и почтенной подводной лодки Военно-морского флота США."
 ITA_sub_hull_small_single_1: "Тоти класс"
 ITA_sub_hull_small_single_1_desc: "Общим классом были подводные лодки, построенные для ВМС Италии в 1960-х годах. Это были первые подводные лодки, спроектированные и построенные в Италии после Второй мировой войны. Эти лодки были небольшими и проектировались как противолодочные лодки типа "охотник-убийца". Они сопоставимы с немецкими подводными лодками типа 205 и французскими подводными лодками класса Aréthuse"
 ITA_sub_hull_small_single_2: "Toti Class Refit"
 ITA_sub_hull_small_single_2_desc: "Общим классом были подводные лодки, построенные для ВМС Италии в 1960-х годах. Это были первые подводные лодки, спроектированные и построенные в Италии после Второй мировой войны. Эти лодки были небольшими и проектировались как противолодочные лодки типа "охотник-убийца". Они сопоставимы с немецкими подводными лодками типа 205 и французскими подводными лодками класса Aréthuse"
 ITA_sub_hull_small_single_3: "Класс Сауро"
 ITA_sub_hull_small_single_3_desc: "Подводные лодки класса Nazario Sauro - дизель-электрические подводные лодки, эксплуатируемые ВМС Италии. Все лодки были построены компанией Fincantieri в Монфальконе."
 ITA_sub_hull_small_single_4: "Класс Тодаро"
 ITA_sub_hull_small_single_4_desc: "Немецкая подводная лодка типа 212, также известная как итальянская Todaro, представляет собой дизель-электрическую подводную лодку, разработанную компанией Howaldtswerke-Deutsche Werft AG (HDW) для военно-морских сил Германии и Италии. Он оснащен дизельной силовой установкой и дополнительной воздухонезависимой двигательной установкой (AIP), использующей топливные элементы на сжатом водороде Siemens с протонообменной мембраной (PEM)."
  
 ITA_sub_hull_large_single_0: "Класс линя"
 ITA_sub_hull_large_single_0_desc: "Подводные лодки класса "Тенч" были типом подводных лодок, построенных для ВМС Соединенных Штатов (USN) в период с 1944 по 1951 год. Они были улучшением по сравнению с классами Gato и Balao, всего на 35-40 тонн больше, но более прочного строения и со слегка улучшенной внутренней планировкой."
  
  # Screen Hulls # 
 ITA_screen_hull_medium_0: "Класс Альдебаран"
 ITA_screen_hull_medium_0_desc: "Класс "Альдебаран" был классом из четырех фрегатов/корветов/эсминцев сопровождения, эксплуатируемых ВМС Италии. Они поступили на вооружение в 1951 году, а последний был выведен из эксплуатации в 1976 году."
 ITA_screen_hull_medium_1: "Класс Centauro"
 ITA_screen_hull_medium_1_desc: "Класс Centauro был классом из четырех фрегатов, эксплуатируемых ВМС Италии. Они поступили на вооружение в 1957 году, а последний был выведен из строя в 1985 году."
 ITA_screen_hull_medium_2: "Класс Альпино"
 ITA_screen_hull_medium_2_desc: "Изначально проект был задуман как увеличенная версия фрегатов класса Canopo. Однако дизайн был радикально изменен с появлением комплекта оборудования CODAG, включающего газовые турбины и дизели. Эти корабли ввели в ВМС Италии использование вертолетов корабельного базирования и гидролокатора переменной глубины."
 ITA_screen_hull_medium_3: "Класс Лупо"
 ITA_screen_hull_medium_3_desc: "Класс Lupo - это класс фрегатов, построенных компанией Cantieri Navali Riuniti (CNR) для ВМС Италии. Спроектированные как многоцелевые военные корабли с акцентом на противолодочную оборону (ASuW), они пользовались определенным успехом на экспортном рынке, будучи приобретенными военно-морскими силами Перу и Венесуэлы. Небольшой тираж слегка обновленной версии известен как Soldati class."
 ITA_screen_hull_medium_4: "Высший класс"
 ITA_screen_hull_medium_4_desc: "Класс Maestrale - это класс фрегатов ВМС Италии. Класс состоит из восьми судов, все из которых были построены Fincantieri S.p.A., Рива Тригозо, за исключением Grecale, который был построен Fincantieri S.p.A. – Муджиано, Специя."
  
 ITA_screen_hull_heavy_0: "Класс Сан-Джорджо"
 ITA_screen_hull_heavy_0_desc: "Класс San Giorgio был классом двух эсминцев итальянского военно-морского флота. Они поступили на вооружение в 1955 году, а последний был выведен из эксплуатации в 1980 году. Бывшие крейсерами класса "Капитан Романи" Королевского флота Италии во время Второй мировой войны, они были перестроены в эсминцы во время холодной войны."
 ITA_screen_hull_heavy_1: "Стремительный класс"
 ITA_screen_hull_heavy_1_desc: "Эсминцы класса Impetuoso были первыми эсминцами, построенными после Второй мировой войны для ВМС Италии. Эти два корабля были заказаны в феврале 1950 года, вступили в строй в 1958 году и были выведены из эксплуатации в начале 1980-х годов."
 ITA_screen_hull_heavy_2: "Класс Импавидо"
 ITA_screen_hull_heavy_2_desc: "Эсминцы класса Impavido были второй группой эсминцев, построенных для ВМС Италии после Второй мировой войны, и первыми итальянскими эсминцами с управляемыми ракетами. Похожие по своим характеристикам на корабли класса Charles F. Adams ВМС США, эти корабли были существенно улучшенными кораблями класса Impetuoso, с кормовой орудийной башней, замененной пусковой установкой ракет класса "земля-воздух" Tartar и соответствующим радаром."
 ITA_screen_hull_heavy_3: "Класс Дюран де ла Пенне"
 ITA_screen_hull_heavy_3_desc: "Эсминцы класса "Дюран де ла Пенне" - это два эсминца с управляемыми ракетами, эксплуатируемые ВМС Италии. Дизайн представляет собой увеличенную версию Audace class, оснащенную дизельным и газотурбинным оборудованием CODOG и современными датчиками. Планировалось построить четыре корабля, но вторая пара была отменена, когда Италия присоединилась к проекту Horizon."
 ITA_screen_hull_heavy_4: "Класс Orizzonte"
 ITA_screen_hull_heavy_4_desc: "Класс Horizon - это класс эсминцев противовоздушной обороны, находящихся на вооружении ВМС Франции и Италии, обозначаемых как эсминцы по классификации НАТО. Программа начиналась как "Общий фрегат нового поколения" (CNGF) - многонациональное сотрудничество по созданию нового поколения фрегатов противовоздушной обороны. В Италии этот сорт известен как сорт Ориззонте."
  
 ITA_battle_hull_light_0: "Класс Джузеппе Гарибальди"
 ITA_battle_hull_light_0_desc: "После войны она была сохранена итальянским флотом и модернизирована с незначительными изменениями вооружения и радара. Он был выведен из эксплуатации в 1953 году и реконструирован как крейсер с управляемыми ракетами."
 ITA_battle_hull_light_1: "Класс Андреа Дориа"
 ITA_battle_hull_light_1_desc: "Крейсера класса "Андреа Дориа" были вертолетными крейсерами ВМС Италии. Первые крупные новые итальянские корабли послевоенной эпохи, эти корабли в первую очередь предназначались для борьбы с подводными лодками. Первоначально планировалось построить три корабля, но два из них, "Андреа Дориа" и "Кайо Дуилио", прослужили до 1991 года как в действующем, так и в учебном качестве."
 ITA_battle_hull_light_2: "Класс Витторио Венето"
 ITA_battle_hull_light_2_desc: "Витторио Венето" был вертолетным крейсером, служившим в ВМС Италии. Первоначально предполагалось, что это будет класс из двух кораблей, специально предназначенных для противолодочной борьбы (ASW), но только "Витторио Венето" вступил в строй в 1969 году, а его родственный корабль "Италия" был отменен."
  
