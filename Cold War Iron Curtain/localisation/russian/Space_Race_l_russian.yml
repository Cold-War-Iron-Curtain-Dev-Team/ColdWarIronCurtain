 space_race_decision_event.1.t: "[GetNewspaperHeader][ROOT.GetName] запускает в космос свой беспилотный аппарат"
 space_race_decision_event.1.d: "После обширных инвестиций в национализированную космическую программу [ROOT.GetLeader] объявил об успешном запуске на орбиту Земли беспилотного летательного аппарата. \nВ связи с недавними предложениями США и СССР в отношении крупных инвестиций в космические программы, очевидно, что зарождающаяся космическая гонка подтолкнула страны всего мира к участию в исследованиях и разработках космических технологий. \nХотя успех текущей программы может показаться незначительным по своей природе, очевидно, что это только начало присоединения к глобальной космической гонке, с большими инвестициями в [Root.GetAdjective] космическую программу, которая устремлена в будущее! \n\n(по вашим оценкам ...)"
 space_race_decision_event.1.a: "Это потрясающе"
 space_race_decision_event.2.t: "[GetNewspaperHeader][ROOT.GetName] запускает животное в космос"
 space_race_decision_event.2.d: "После недавнего успеха [Root.GetAdjective] космической программы, [ROOT.GetLeader] повысил роль [ROOT.GetName] в глобальной космической гонке, объявив об успешном запуске животного на орбиту Земли. \nОпровергая небольшие опасения по поводу состояния, животное-космонавт успешно восстановилось после того, как его ракета благополучно приземлилась у берегов Средиземного моря после успешного 9-часового полета на орбите Земли. \nЭтот момент знаменует собой значимую победу в [Root.GetAdjective] космической программе; с постоянными инвестициями в государственную космическую программу, возможно, недолго до следующего большого шага для [ROOT.GetName] в глобальной технологической гонке. \n\n(... приготовьтесь ...)"
 space_race_decision_event.2.a: "Невероятно..."
 space_race_decision_event.3.t: ""
 space_race_decision_event.3.d: "Возможно, это один из самых важных моментов в истории [ROOT.GetName]. Недавно [ROOT.GetLeader] объявил об успешном запуске пилотируемого космического корабля на орбиту. \nПосле продолжительного периода предварительных исследований, [Root.GetAdjective] национальная космическая программа успешно оснастила одноместный модуль всем необходимым оборудованием для полета в условиях невесомости на орбите Земли. Пилот высадился в океане вскоре после приземления и успешного завершения миссии. \nОн, как и те, кто стоял за развитием космической программы [ROOT.GetName], был провозглашен героем страны, причем сам [ROOT.GetLeader] принимал участие в награждении всех мужчин и женщин, ответственных за этот великий и неоспоримый вклад не только в историю своего государства, но и в историю человечества, а также в прогресс. \n\n(... иии ПУСК! ...)"
 space_race_decision_event.3.a: ""
 space_race_decision_event.4.t: "[GetNewspaperHeader][ROOT.GetName] выходит на геостационарную орбиту в рамках своей космической программы"
 space_race_decision_event.4.d: "Интенсивные расчеты и строгий контроль со стороны [Root.GetAdjective] интеллигенции принесли свои плоды. [ROOT.GetLeader] объявил, что [Root.GetAdjective] спутник достиг геосинхронной орбиты, сумев согласовать свою планетарную орбиту с орбитой вращения Земли. \nНеобходимость гораздо большего планирования и чёткости действий умов, стоящих за [Root.GetAdjective] космической программой, а тауже заметный успех проекта открывают новые возможности для её расширения. \nТеперь ведутся переговоры о новых экспериментах с пилотируемыми космическими аппаратами.\n\n(... и народ сошёл с ума! ...)"
 space_race_decision_event.4.a: "Это потрясающе"
 space_race_decision_event.5.t: "[GetNewspaperHeader][Root.GetAdjective] рандеву на орбите"
 space_race_decision_event.5.d: "Последние попытки [Root.GetAdjective] космической программы привели к значительному событию для международных отношений, как на Земле, так и за ее пределами! \n[Root.GetAdjective] астронавты успешно пилотировали свои космические корабли на орбите, чтобы провести орбитальную встречу с другой группой астронавтов на [Root.GetAdjective] пилотируемом спутнике. \nЭто событие знаменует собой знаменательный момент для статуса [ROOT.GetName] на мировой арене. Ясно, что усилия со стороны национальной космической программы повысили [ROOT.GetName] в глазах великих держав мира, и в ближайшем будущем появятся новые достижения. \n\n(... [ROOT.GetName ] берет на себя инициативу! ...)"
 space_race_decision_event.5.a: ""
 space_race_decision_event.6.t: "[GetNewspaperHeader][ROOT.GetName] проводит первый беспилотный облет Луны"
 space_race_decision_event.6.d: "Правительство [ROOT.GetName] подтвердило, что они успешно завершили беспилотный облет Луны. Это удивительное технологическое достижение, требующее высокого уровня научной и инженерной координации. Газеты по всему восхваляют правительство [ROOT.getName] за это достижение. На международном уровне эта новость поразила воображение многих. Космические агентства по всему миру сейчас удваивают свои усилия, чтобы наверстать упущенное. Ожидается, что беспилотный зонд отправит с Луны фотографии, дающие человечеству самое близкое представление о нашем спутнике."
 space_race_decision_event.6.a: "Это потрясающе"
 space_race_decision_event.7.t: ""
 space_race_decision_event.7.d: "Правительство [ROOT.GetName] подтвердило, что они успешно провели беспилотный облет Луны. Это удивительное технологическое достижение, требующее высокого уровня научной и инженерной координации. Должностные лица из [ROOT.getName] подтвердили, что спроектированный ими зонд успешно вышел на орбиту планеты. Они пообещали, что мир увидит много новых снимков с этой миссии. Эта новость подстегивает космические агентства по всей планете создавать свои аппараты, поскольку они все чаще сталкиваются с вопросами о том, почему же они так сильно отстают в космичечкой гонке."
 space_race_decision_event.7.a: "Это потрясающе"
 space_race_decision_event.8.t: "[GetNewspaperHeader][ROOT.GetName] публикует первые снимки выхода в открытый космос"
 space_race_decision_event.8.d: "Захватывающие новости о космосе, официальные лица из [ROOT.getName] подтверждено, что астронавт на орбитальном космическом аппарате успешно совершил выход в открытый космос. Однодневную миссию провел экипаж из двух человек, выход в открытый космос длился чуть более десяти минут. Ученые отметили, что космический аппарат обладал воздушным шлюзом, позволяющим осуществить выход в открытый космос. После завершения миссии астронавты были успешно возвращены на землю. Газеты по всему миру показали астронавта в космосе с Землей позади него, поразив воображение миллионов."
 space_race_decision_event.8.a: "Это потрясающе"
 space_race_decision_event.9.t: "[GetNewspaperHeader][ROOT.GetName] совершает первую беспилотную посадку на Луну"
 space_race_decision_event.9.d: "Высокопоставленные чиновники руководящие космической программой [ROOT.GetName] подтвердили недавнюю посадку на Луну, успешно проведя беспилотную мягкую посадку на Луну. Зонд успешно собрал образцы лунной породы. Зонд также имел с собой телевизионное оборудование, позволяющее космонавтам передавать изображения в реальном времени с поверхности Луны. Эти снимки показывают человечеству первые снимки поверхности Луны. Благодаря этой миссии космическое агентство [ROOT.getName] позиционирует себя как ведущую космическую державу на Земле. Растет ожидание того, когда будет достигнута следующая веха. Граждане по всему [ROOT.getName] сияют от гордости за это достижение"
 space_race_decision_event.9.a: "Это потрясающе"
 space_race_decision_event.10.t: ""
 space_race_decision_event.10.d: "Демонстрируя впечатляющие инженерные и технологические возможности, официальные лица из [ROOT.getName] подтвердили, что [ROOT.getName] посадил свой луноход на поверхность Луны. Аппарат способен перемещаться по лунной поверхности. Прочность его каркаса позволяет ему работать на Луне в течение длительного периода времени. Перед полетом он прошел интенсивные испытания, чтобы убедиться, что он справится с возможными трудностями нашей космической миссии. Луноход будет отправлять нам множество изображений, образцов и данных о нашем спутнике. Похоже, что человечество уже всё ближе подходит к пилотируемым полетам на Луну. Вопрос лишь в том, какая страна сможет достичь этого первой."
 space_race_decision_event.10.a: "Это потрясающе"
 space_race_decision_event.11.t: ""
 space_race_decision_event.11.d: "Первая космическая станция успешно вышла на низкую орбиту. Официальные лица по всему миру подтвердили, что [ROOT.getName] успешно запустил эту монолитную структуру. Власти [ROOT.getName] заявили, что вскоре будут запущены новые миссии, целью которых является размещение астронавтов на станции по мере ее перехода на более высокую орбиту. Космическая станция позволит проводить научные исследования и даст возможность находиться в космосе намного дооьше. Станция позволяет в долгосрочной перспективе исследовать космос и принесет выгоду всему человечеству. Эксперты отмечают, что  кропотливое строительство, запуск и чёткая координация действий, способствовавшие размещению космической станции в космосе, продемонстрировали безграничный опыт и многочисленные возможности [ROOT.getName]."
 space_race_decision_event.11.a: ""
 space_race_decision_event.12.t: "[GetNewspaperHeader][ROOT.GetName] в первые в истории производит мягкую посадку на Луне с последющим возвращением на Землю"
 space_race_decision_event.12.d: "Миллионы людей по всему миру затаили дыхание, наблюдая за тем, как астронавты из [ROOT.GetName] успешно приземлились на Луну и также успешновернулись обратно на Землю. Такая авантюра потребовала от страны огромных затрат ресурсов и времени. Лидеры и журналисты по всему [ROOT.getName] рукплещут миссии за демонстрацию беспрецедентной храбрости, мастерства и самоотверженности. Кадры полёта и успешной установки флага на лунной поверхности вызвали необычайную гордость у граждан [ROOT.getName]. Воображение миллионов людей наполнилось мечтами о скором освоении космических простор. Однако для тех, кто жил в конкурирующих космических державах, эта новость не особо приглась по душе, поскольку они надеялись, что именно их космонавты будут блескать в мировых новостях."
 space_race_decision_event.12.a: ""