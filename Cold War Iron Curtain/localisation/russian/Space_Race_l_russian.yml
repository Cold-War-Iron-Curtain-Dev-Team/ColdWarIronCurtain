 # Events 
 space_race_decision_event.1.t: "[GetNewspaperHeader][ROOT.GetName] Запуск беспилотного летательного аппарата"
 space_race_decision_event.1.d: "После обширных инвестиций в национализированную космическую программу [ROOT.GetLeader] объявил об успешном запуске на орбиту Земли беспилотного летательного аппарата. \nВ связи с недавними предложениями США и СССР в отношении крупных инвестиций в космические программы, очевидно, что зарождающаяся космическая гонка подтолкнула страны всего мира к участию в исследованиях и разработках космических технологий. \nХотя успех текущей программы может показаться незначительным по своей природе, очевидно, что это только начало присоединения к глобальной космической гонке, с большими инвестициями в [Root.GetAdjective] космическую программу, которая устремлена в будущее! \n\n(по вашим оценкам ...)"
 space_race_decision_event.1.a: "Это потрясающе"
 space_race_decision_event.2.t: "[GetNewspaperHeader][ROOT.GetName] Запуск животного в космос"
 space_race_decision_event.2.d: "После недавнего успеха [Root.GetAdjective] космической программы, [ROOT.GetLeader] повысил роль [ROOT.GetName] в глобальной космической гонке, объявив об успешном запуске животного на орбиту Земли. \nОпровергая небольшие опасения по поводу состояния, животное-космонавт успешно восстановилось после того, как его ракета благополучно приземлилась у берегов Средиземного моря после успешного 9-часового полета на орбите Земли. \nЭтот момент знаменует собой значимую победу в [Root.GetAdjective] космической программе; с постоянными инвестициями в государственную космическую программу, возможно, недолго до следующего большого шага для [ROOT.GetName] в глобальной технологической гонке. \n\n(... приготовьтесь ...)"
 space_race_decision_event.2.a: "Невероятно..."
 space_race_decision_event.3.t: "[GetNewspaperHeader]Человек в космосе!"
 space_race_decision_event.3.d: "Возможно, в один из самых важных моментов в истории [ROOT.GetName], [ROOT.GetLeader] объявил об успешном запуске пилотируемого космического корабля на орбиту. \nПосле продолжительного периода предварительных исследований, [Root.GetAdjective] национальная космическая программа успешно оснастила одноместный модуль необходимым оборудованием для полета в условиях невесомости и заатмосферной орбиты. Пилот высадился вскоре после приземления в океане после успеха миссии. \nПилот, вместе со многими людьми, стоящими за космической программой [ROOT.GetName], был провозглашен героем страны, причем сам [ROOT.GetLeader] принимает участие в награждении медалями мужчин и женщин, ответственных за этот великий и беспрецедентный вклад в государственную и человеческую историю и прогресс. \n\n(... и они ушли! ...)"
 space_race_decision_event.3.a: "ПОЕХАЛИ!"
 space_race_decision_event.4.t: "[GetNewspaperHeader]Геостационарная орбита достигнута космической программой [ROOT.GetName]"
 space_race_decision_event.4.d: "Интенсивные расчеты и проверки со стороны [Root.GetAdjective] интеллигенции принесли свои плоды. [ROOT.GetLeader] объявил, что [Root.GetAdjective] спутник достиг геосинхронной орбиты, сумев согласовать свою планетарную орбиту с орбитой вращения Земли. \nНеобходимость гораздо большего планирования и конкретности со стороны умов, стоящих за [Root.GetAdjective] космической программой, и успех проекта открывают новые возможности для расширения программы. \nТеперь ведутся переговоры о новых экспериментах с пилотируемыми космическими объектами. \n\n(... и толпа сходит с ума! ...)"
 space_race_decision_event.4.a: "Это потрясающе"
 space_race_decision_event.5.t: "[GetNewspaperHeader][Root.GetAdjective] орбитальное рандеву"
 space_race_decision_event.5.d: "Последние попытки [Root.GetAdjective] космической программы привели к значительному событию для международных отношений, как на Земле, так и за ее пределами! \n[Root.GetAdjective] астронавты успешно пилотировали свои космические корабли на орбите, чтобы провести орбитальную встречу с другой группой астронавтов на [Root.GetAdjective] пилотируемом спутнике. \nЭто событие знаменует собой знаменательный момент для статуса [ROOT.GetName] на мировой арене. Ясно, что усилия со стороны национальной космической программы повысили [ROOT.GetName] в глазах великих держав мира, и в ближайшем будущем появятся новые достижения. \n\n(... [ROOT.GetName ] берет на себя инициативу! ...)"
 space_race_decision_event.5.a: "Как-же всё-таки красива наша планета"
  
 space_race_decision_event.6.t: "[GetNewspaperHeader][ROOT.GetName] запускает первый беспилотный облет Луны"
 space_race_decision_event.6.d: "Правительство [ROOT.GetName] подтвердило, что они успешно завершили беспилотный облет Луны. Это удивительное технологическое достижение, требующее высокого уровня научной и инженерной координации. Газеты по всему [ROOT.getName] восхваляют правительство за его достижение. На международном уровне эта новость поразила воображение многих. Космические агентства по всему миру сейчас удваивают свои усилия, чтобы наверстать упущенное. Ожидается, что беспилотный зонд отправит с Луны фотографии, дающие человечеству самое близкое представление о Луне."
 space_race_decision_event.6.a: "Это потрясающе"
 space_race_decision_event.7.t: "[GetNewspaperHeader][ROOT.GetName] запускает первый беспилотный лунный орбитальный аппарат"
 space_race_decision_event.7.d: "Правительство [ROOT.GetName] подтвердило, что они успешно завершили беспилотный облет Луны. Это удивительное технологическое достижение, требующее высокого уровня научной и инженерной координации. Чиновник из [ROOT.getName] подтвердил, что спроектированный им зонд успешно вышел на орбиту планеты. Чиновник пообещал, что мир увидит новые снимки. Эта новость подстегивает космические агентства по всей планете, поскольку они сталкиваются с вопросами о том, почему они, так сильно отстают в космической гонке."
 space_race_decision_event.7.a: "Это потрясающе"
 space_race_decision_event.8.t: "[GetNewspaperHeader][ROOT.GetName] опубликуйте первые снимки выхода в открытый космос"
 space_race_decision_event.8.d: "Захватывающие новости о космосе, официальные лица из [ROOT.getName] подтверждено, что астронавт на орбитальном космическом аппарате успешно совершил выход в открытый космос. Однодневную миссию провел экипаж из двух человек, выход в открытый космос длился чуть более десяти минут. Ученые отметили, что космический аппарат обладал воздушным шлюзом, позволяющим осуществить выход в открытый космос. После завершения миссии астронавты были успешно возвращены на землю. Газеты по всему миру показали астронавта в космосе с Землей позади него, поразив воображение миллионов."
 space_race_decision_event.8.a: "Это потрясающе" #NT!
 space_race_decision_event.9.t: "[GetNewspaperHeader][ROOT.GetName] запускает первую беспилотную мягкую посадку на Луну"
 space_race_decision_event.9.d: "Высокопоставленные чиновники руководящие космической программой [ROOT.GetName] подтвердили недавнюю посадку на Луну, успешно проведя беспилотную мягкую посадку на Луну. Зонд успешно собрал образцы лунной породы. Зонд также имел с собой телевизионное оборудование, позволяющее космонавтам передавать изображения в реальном времени с поверхности Луны. Эти снимки показывают человечеству первые снимки поверхности Луны. Благодаря этой миссии космическое агентство [ROOT.getName] позиционирует себя как ведущую космическую державу на Земле. Растет ожидание того, когда будет достигнута следующая веха. Граждане по всему [ROOT.getName] сияют от гордости за это достижение"
 space_race_decision_event.9.a: "Это потрясающе"
 space_race_decision_event.10.t: "[GetNewspaperHeader][ROOT.GetName] запускает первый луноход"
 space_race_decision_event.10.d: "Демонстрируя впечатляющие инженерные и технологические возможности, официальные лица из [ROOT.getName] подтвердили, что [ROOT.getName] посадил лунный аппарат на Луну. Аппарат способен перемещаться по лунной поверхности. Прочность позволяет оставаться на Луне в течение длительного периода времени. Перед полетом аппарат прошел интенсивные испытания, чтобы убедиться, что он справится с трудностями космического полета. Марсоход получит больше изображений, образцов и знаний о Луне. Похоже, человечество приближается к пилотируемым полетам на Луну, вопрос лишь в том, какая страна сможет достичь этого первой."
 space_race_decision_event.10.a: "Это потрясающе"
 space_race_decision_event.11.t: "[GetNewspaperHeader][ROOT.GetName] запускает первую монолитную космическую станцию"
 space_race_decision_event.11.d: "Первая космическая станция успешно вышла на низкую орбиту. Официальные лица по всему миру подтвердили, что [ROOT.getName] успешно запустил монолитную структуру. Президент [ROOT.getName] заявил, что вскоре будут отправлены следующие миссии для размещения астронавтов на станции по мере ее перехода на более высокую орбиту. Космическая станция позволит проводить научные исследования и позволит астронавтам проводить длительные периоды времени в космосе. Станция позволяет в долгосрочной перспективе исследовать космос и обеспечивает большие потенциальные выгоды для всего человечества. Эксперты отмечают, что строительство, запуск и координация, необходимые для размещения космической станции, демонстрируют опыт и возможности [ROOT.getName]."
 space_race_decision_event.11.a: "Земля в иллюминаторе, Земля в иллюминаторе, Земля в иллюминаторе видна..."
 space_race_decision_event.12.t: "[GetNewspaperHeader][ROOT.GetName] запускает первую пилотируемую мягкую посадку на Луну с последующим возвращением"
 space_race_decision_event.12.d: "Миллионы людей по всему миру затаили дыхание, когда астронавты из [ROOT.GetName] успешно приземлились на Луну и вернулись назад. Это потребовало огромных затрат ресурсов и времени. Лидеры и журналисты по всему [ROOT.getName] хвалят миссию за демонстрацию беспрецедентной храбрости, мастерства и самоотверженности. Кадры миссии и успешной установки флага на лунной поверхности вызвали сильную гордость у граждан [ROOT.getName]. Для миллионов людей воображение было полно фантазий о космосе. Однако для людей, живущих в конкурирующих космических державах, эта новость не полностью приятная, поскольку они надеялись, что их страна будет первой"
 space_race_decision_event.12.a: "Это маленький шаг для человека, но огромный для всего человечества!"
