 # Spacecraft Construction 
  
 SOV_woodmetal_frames: "Ракета Р-1"
 SOV_woodmetal_frames_short: "Р-1"
 SOV_woodmetal_frames_desc: "Ракета Р-1 (По НАТОвской классификации SS-1 Scunner, Советское кодовое название СА11, ГРАУ 8А11) - тактическая баллистическая ракета, производимая в Советском Союзе на основе немецкой ракеты В-2. Несмотря на то, что это была копия, она изготавливается на советских промышленных предприятиях и дала СССР ценный опыт, который позже позволил ему создать свои собственные, гораздо более мощные ракеты. Ракетный комплекс Р-1 поступил на вооружение Советской Армии 28 ноября 1950 года."
  
 SOV_pressure_vessel1: "Р-5 Победа"
 SOV_pressure_vessel1_short: "Р-5 Победа"
 SOV_pressure_vessel1_desc: "Р-5 "Победа" - баллистическая ракета, разработанная Советским Союзом во время холодной войны. Версия Р-5М получила в НАТО отчетное название SS-3 Shyster и имела индекс ГРАУ 8K51. Первоначально Р-5 была разработкой ОКБ-1 как одноступенчатая ракета с отделяемой головной частью. Р-5М была ядерной ракетой - первой ядерной ракетой, принятой на вооружение Советским Союзом - с большей полезной нагрузкой и весом, но более надежной, чем ее предшественница. Р-5М дала Советскому Союзу возможность поражать многие стратегические цели в Европе. Р-5М поступила на вооружение 21 мая 1956 года (снята с вооружения в 1967 году), а в 1959 году была установлена в Фогельзанге, Зехденике и Фюрстенберге/Хавеле в Восточной Германии - первых советских ракетно-ядерных базах за пределами СССР."
  
  
 SOV_pressure_vessel2: "Восток"
 SOV_pressure_vessel2_short: "Восток"
 SOV_pressure_vessel2_desc: "Восток" - семейство ракет, созданных на базе советской МБР Р-7 "Семерка" и предназначенных для программы пилотируемых космических полетов. С использованием этого семейства ракет был запущен первый в истории человечества искусственный спутник Земли ("Спутник-1") и первый космический корабль с экипажем ("Восток"). Это ответление семейства ракет Р-7. 18 марта 1980 года ракета "Восток-2М" взорвалась на стартовой площадке в Плесецке во время заправки топливом, в результате чего погибло 48 человек. Расследование аналогичной (но предотвращенной) аварии показало, что замена припоя на основе свинца на припой на основе олова в фильтрах с перекисью водорода позволила разрушить H2O2, что и привело к взрыву."
  
 SOV_pressure_vessel3: "Н1/Л3"
 SOV_pressure_vessel3_short: "Н1/Л3"
 SOV_pressure_vessel3_desc: "Н1/Л3 ("Ракета-носитель"; Н1/Л3) - сверхтяжёлая ракета-носитель, предназначенная для доставки всего необходимого за пределы низкой околоземной орбиты. Н1 была советским аналогом американской ракеты Сатурн V и предназначалается для обеспечения возможности полетов с экипажем на Луну и за ее пределы, исследования начались уже в 1959 году. Первая ступень ракеты остается самой мощной из когда-либо созданных ступеней, но все четыре летавшие первые ступени Н1 Блок А вышли из строя из-за недостатка статических испытаний, в результате чего не были выявлены проблемы с водой и другие проблемы кластера из тридцати двигателей и его сложной системы подачи топлива и окислителя."
  
  
 SOV_pressure_vessel4: "Энергия"
 SOV_pressure_vessel4_short: "Энергия"
 SOV_pressure_vessel4_desc: "Энергия" (ГРАУ 11К25) - ракета-носитель сверхтяжелого класса. Она была разработана НПО "Энергия" Советского Союза для различных целей, включая использование для космического корабля "Буран". Основным предприятием-разработчиком системы управления было НПО "Электроприбор". Ракета-носитель "Энергия" использовала четыре пристыковываемых ускорителя, каждый из которых приводился в движение четырехкамерным двигателем РД-170, работающим на керосине/жидком кислороде, и центральной основной ступенью с четырьмя однокамерными двигателями РД-0120 (11Д122), работающими на жидком водороде/жидком кислороде. Ракета-носитель имела два функционально различных эксплуатационных варианта: Энергия-Полюс (первоначальная тестовая конфигурация), в которой система Полюс использовалась в качестве последней ступени для вывода ракеты на орбиту, и Энергия-Буран, в которой орбитальные корабли класса Буран были объектом размещения на орбите и источником импульса выведения на орбиту. Ракета-носитель была способна вывести около 100 тонн на низкую околоземную орбиту, до 20 тонн на геостационарную орбиту и до 32 тонн по транслунной траектории на лунную орбиту. Ракета-носитель совершила всего два полета на орбиту, после чего была снята с производства. С 2016 года предпринимаются попытки возродить ракету-носитель."
  
  
 SOV_pressure_vessel5: "Ангара-А5"
 SOV_pressure_vessel5_short: "Ангара-А5"
 SOV_pressure_vessel5_desc: ""Ангара-А5" - российская ракета-носитель тяжелого класса семейства "Ангара". Экологически чистое ракетное топливо (кислород + керосин) [86] позволяет снизить экологическую нагрузку от запусков на окружающую среду. Запускается с пятью универсальными ракетными модулями УРМ-1, которые оснащены двигателями РД-191 (четыре модуля на первой ступени и один на второй)."
  
  
 SOV_pressure_vessel6: "Енисей"
 SOV_pressure_vessel6_short: "Енисей"
 SOV_pressure_vessel6_desc: "Енисей (проектное название РН СТК-1 (ракета-носитель сверхтяжелого класса)) является первой сверхтяжелой ракетой-носителем, разрабатываемой российской космической промышленностью. Основным разработчиком является РКК "Энергия". Он разрабатывается в рамках федеральной целевой программы "Создание ракетно-космического комплекса сверхтяжелого класса на 2020-2030 годы", стоимость программы оценивается в 1,5 триллиона рублей. Это основная ракета российской лунной программы. Ожидается, что окончательный проект ракеты будет завершен к осени 2021 года. Ожидается, что первый запуск произойдет в 2028 году с космодрома Восточный. На базе ракеты-носителя "Енисей" разрабатывается ракета-носитель РНСТК-2 (путем добавления еще одной ступени)."
  
  
 # Propulsion 
 SOV_liquid_propellant: "НК-9"
 SOV_liquid_propellant_short: "НК-9"
 SOV_liquid_propellant_desc: "НК-9 (8Д517) - жидкостный ракетный двигатель, разработанный СНТК им. Н.Д. Кузнецова. С Мая 1959 года началась разработка жидкостных ракетных двигателей. Одним из первых разработанных ракетных двигателей был двигатель НК-9. НК-9 предназначался для первой ступени межконтинентальной ракеты ГР-1 "Глобал-1" (SS-10 по классификации НАТО). Это был первый в мире кислородно-керосиновый двигатель в классе тяги свыше 1 МН, выполненный по замкнутой схеме с дожиганием генераторного газа в камере сгорания. Для второй ступени этой ракеты был разработан двигатель НК-9В. Его испытания начались в сентябре 1962 года. В начале 1960-х годов на базе НК-9 были созданы ЖРД НК-19 и НК-21 для третьей и четвертой ступеней ракеты-носителя N1".
  
  
 SOV_nuclear_pulse_propulsion: "РД-0410"
 SOV_nuclear_pulse_propulsion_short: "РД-0410"
 SOV_nuclear_pulse_propulsion_desc: "РД-0410 - советский ядерный тепловой ракетный двигатель. Двигатель прошел наземные испытания на Семипалатинском полигоне, и он был использован в полете "Курчатов Марс 1994". Этот двигатель имеет несколько более высокие характеристики (температура выхлопа и удельный импульс) по сравнению с NERVA (проект американского ядерного теплового ракетного двигателя). Конструкция активной зоны реактора предусматривает теплоизоляцию между топливом из карбида урана/карбида вольфрама и замедлителем из гидрида циркония. Это решение позволило создать очень компактную конструкцию активной зоны реактора. Поток водорода сначала охлаждал замедлитель, позволяя сохранить очень низкую энергию нейтронов и высокое поперечное сечение деления, затем он нагревался при непосредственном контакте с топливными стержнями. Чтобы предотвратить химическую реакцию между карбидом и водородом, к водороду после прохождения замедлителя добавляли около 1 процента гептана."
  
  
 # Data Transmission 
  
 SOV_geosynchronous_network: "Циклон"
 SOV_geosynchronous_network_short: "Циклон"
 SOV_geosynchronous_network_desc: "Циклон (гражданский вариант системы известен как "Цикада") - первая спутниковая навигационная система в СССР, построенная на базе космических аппаратов (КА) "Циклон" и КА "Залив" (индекс ГРАУ - 11Ф617), в состав которой входили три аппаратных комплекса: Цунами-АМ для искусственных спутников Земли, Цунами-БМ (Р-790) на кораблях и Цунами-ВМ на береговых сооружениях."
  
