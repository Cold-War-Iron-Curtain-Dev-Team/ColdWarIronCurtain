 CZE_fighter_equipment_0: "Avia B-34"
 CZE_fighter_equipment_0_short: "Avia B-34"
 CZE_fighter_equipment_0_desc: "The Czechoslovak Air Force (Ceskoslovenské letectvo) or the Czechoslovak Army Air Force (Ceskoslovenské vojenské letectvo) was the air force branch of the Czechoslovak Army formed in October 1918."
 CZE_fighter_equipment_1: "Avia B.634"
 CZE_fighter_equipment_1_short: "Avia B.634"
 CZE_fighter_equipment_2: "Avia B-135"
 CZE_fighter_equipment_2_short: "Avia B-135"
 CZE_fighter_equipment_3: "Avia S-199"
 CZE_fighter_equipment_3_short: "Avia S-199"
 CZE_jet_multirole_equipment_1: "Avia S-92"
 CZE_jet_multirole_equipment_1_short: "Avia S-92"
 CZE_jet_multirole_equipment_1_desc: "The Yakovlev Yak-23 was an early Soviet jet fighter with a straight wing. It was developed from the Yak-17 in the late 1940s and used a reverse-engineered copy of a British engine. It was not built in large numbers as it was inferior in performance to the swept-wing Mikoyan-Gurevich MiG-15. Many Yak-23s were exported to the Warsaw Pact nations and remained in service for most of the 1950s, although some were still in use a decade later."
 CZE_jet_multirole_equipment_2: "Як-23"
 CZE_jet_multirole_equipment_2_short: "Як-23"
 CZE_jet_multirole_equipment_2_desc: "Perhaps one of the most iconic fighters of the Cold War, the Mikoyan-Gurevich MiG-15 Fagot entered service in 1947. The MiG-15 was involved in many conflicts since its introduction in the Korean War, where it proved a worthy adversary to the American F-86 Sabre and F9F Panther. A section of the Korean-Chinese border was nicknamed MiG Alley because of their prevalence in the area. Over 18 000 MiG-15s were built and used by many nations, most notably the USSR and Eastern Bloc nations. While most aircraft were decommissioned in the 1950's, some still remain in service with the North Korean Air Force."
 CZE_jet_multirole_equipment_3: "МиГ-15"
 CZE_jet_multirole_equipment_3_desc: "A direct successor to the MiG-15 Fagot. Over 10 000 MiG-17 Fresco were produced from 1952. The MiG-17 was license built in the PLAAF as the Shenyang J-5. In total 20 nations used the MiG-17, spanning Africa, Europe and Asia. Its first combat deployment was in 1958, when PRC MiGs clashed with Nationalist Chinese F-86 Sabres over the Taiwan Strait. However, the MiG-17 primarily saw use in the Vietnam war with the NVAF and PLAAF were it scored 28 aerial victories. The MiG-17 was so successful that it even held its own against the much more modern, supersonic American Phantom II fighters of the Vietnam war. The MiG-17 was generally decommissioned in the 1970's, while it still remains in limited service in some African nations and North Korea."
 CZE_jet_multirole_equipment_3_short: "МиГ-15"
 CZE_jet_multirole_equipment_4: "МиГ-17Ф"
 CZE_jet_multirole_equipment_4_desc: "The MiG-19 was the first Soviet production aircraft capable of supersonic speeds in level flight. A comparable U.S. \"Century Series\" fighter was the North American F-100 Super Sabre, although the MiG-19 primarily fought against the more modern McDonnell Douglas F-4 Phantom II and Republic F-105 Thunderchief over North Vietnam."
 CZE_jet_multirole_equipment_4_short: "МиГ-17Ф"
 CZE_jet_multirole_equipment_5: "МиГ-19С"
 CZE_jet_multirole_equipment_5_desc: "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 CZE_jet_multirole_equipment_5_short: "МиГ-19С"
 CZE_jet_multirole_equipment_6: "МиГ-21F"
 CZE_jet_multirole_equipment_6_desc: "Production version of the all-weather interceptor. These were powered by the R11F2-300 turbojet and, starting with the seventh production batch, fitted with the RP-21 radar (the first six batches used the older TsD-30T radar (aka RP-9-21). Further, the weapons control system was modified from that of the F-13 to allow use of the RS-2US (aka K-5MS) beam-riding AAM in addition to the IR-seeking K-13."
 CZE_jet_multirole_equipment_6_short: "МиГ-21Ф"
 CZE_jet_multirole_equipment_7: "МиГ-21bis"
 CZE_jet_multirole_equipment_7_desc: "the MiG-23 was the first Soviet fighter to field a look-down/shoot-down radar and one of the first to be armed with beyond-visual-range missiles. Production started in 1969 and reached large numbers with over 5,000 aircraft built, making it the most produced variable-sweep wing aircraft in history. Today the MiG-23 remains in limited service with some export customers."
 CZE_jet_multirole_equipment_7_short: "МиГ-21бис"
 CZE_jet_multirole_equipment_8: "МиГ-23MF"
 CZE_jet_multirole_equipment_8_desc: "The early \"Flogger\" variants had a number of design shortcomings, including airframe strength and reliability, engine performance, maneuverability and radar performance. A considerable redesign of the airframe was conducted, resulting in the MiG-23ML."
 CZE_jet_multirole_equipment_8_short: "МиГ-23МФ"
 CZE_jet_multirole_equipment_9: "МиГ-23МЛ"
 CZE_jet_multirole_equipment_9_desc: "The MiG-23MLD was the ultimate fighter variant of the MiG-23. The main focus of the upgrade was to improve maneuverability, especially during high AoA, which was identified as the MiG-23M/ML's chief shortcoming. The pitot boom was equipped with vortex generators, and the wing's notched leading edge roots were 'saw-toothed' to act as vortex generators as well. The flight-control system incorporated the SOS-3-4 synthetic stick-stop device/signals limiter."
 CZE_jet_multirole_equipment_9_short: "МиГ-23МЛ"
 CZE_jet_multirole_equipment_10: "МиГ-29"
 CZE_jet_multirole_equipment_10_desc: "The MiG-29 Fulcrum A was originally developed by the Mikoyan Design Bureau. It was the first 4th generation fighter to enter service with the USSR and Eastern Bloc. Incorporating improved avionics and greatly enhanced radar capabilities. The first MiG-29s were used as trainers by the Warsaw Pact with limited exports to India but had limited combat use. The MiG-29 would later become the base for widely produced variants such as the MiG-29S, MiG-29M and MiG-35."
 CZE_jet_multirole_equipment_10_short: "МиГ-29"
 CZE_mr_stealth_fighter_equipment_1: "Mikoyan MiG-29M"
 CZE_mr_stealth_fighter_equipment_1_short: "MiG-29M"
 CZE_mr_stealth_fighter_equipment_1_desc: "The MiG-29M/M2 aircraft is a revision of the basic MiG-29. It achieved a more robust multi-role capability with enhanced use of air-to-air and air-to-ground high-precision weapons. It also featured a considerably increased combat range, owing to an increase in its internal fuel capacity.A few changes took place during the aircraft's development. The redesigned airframe was constructed from a lightweight Aluminium-lithium alloy to increase the thrust-to-weight ratio. The air intake ramps' geometry was revised, the upper intake louvers were removed to make way for more fuel in the LERXs, mesh screens introduced to prevent foreign object damage (FOD) and inlet dimensions were enlarged for higher airflow."
 CZE_jet_interceptor_equipment_1: "Avia S-92"
 CZE_jet_interceptor_equipment_1_short: "S-92"
 CZE_jet_interceptor_equipment_1_desc: "The Czech built version of the World War 2 German Messerschmitt Me 262, nicknamed Schwalbe in fighter versions, or Sturmvogel in fighter-bomber versions, is a fighter aircraft and fighter-bomber that was the world's first operational jet-powered fighter aircraft."
 CZE_jet_interceptor_equipment_3: "Aero S-103"
 CZE_jet_interceptor_equipment_3_short: "Aero S-103"
 CZE_jet_interceptor_equipment_3_desc: "All-weather fighter-interceptor version equipped with Izumrud radar, 3 x 23 mm NR-23 cannons and VK-1F engine"
 CZE_CAS_equipment_3: "Ilyushin Il-10"
 CZE_CAS_equipment_3_short: "Il-10"
 CZE_CAS_equipment_3_desc: "Developed from the Il-2 Sturmovik, the Il-10 was designed for the purpose of addressing many of the Il-2's faults. The main goal was to increase speed and maneuverability at low altitudes, mainly to evade small-caliber anti-aircraft artillery, which was the main threat for ground attack aircraft. Entering service in January 1945, the Il-10 took part in some of the last combat operations in Europe, and during the brief Soviet intervention in the Pacific War. By the time the Il-10 retired from Soviet service in 1956, the Air Force shifted focus from pure CAS and ground-attack to fighter-bomber aircraft. Its NATO reporting name is Beast."
 CZE_CAS_equipment_4: "Avia B-33"
 CZE_CAS_equipment_4_short: "B-33"
 CZE_CAS_equipment_4_desc: "Czech built variant of the venerable Il-10. Developed from the Il-2 Sturmovik, the Il-10 was designed for the purpose of addressing many of the Il-2's faults. The main goal was to increase speed and maneuverability at low altitudes, mainly to evade small-caliber anti-aircraft artillery, which was the main threat for ground attack aircraft. Entering service in January 1945, the Il-10 took part in some of the last combat operations in Europe, and during the brief Soviet intervention in the Pacific War. By the time the Il-10 retired from Soviet service in 1956, the Air Force shifted focus from pure CAS and ground-attack to fighter-bomber aircraft. Its NATO reporting name is Beast."
 CZE_jet_CAS_equipment_1: "Avia B-33M"
 CZE_jet_CAS_equipment_1_short: "B-33M"
 CZE_jet_CAS_equipment_1_desc: "Czech built variant of the venerable Il-10M. Developed from the Il-2 Sturmovik, the Il-10M was designed for the purpose of addressing many of the Il-2's faults. The main goal was to increase speed and maneuverability at low altitudes, mainly to evade small-caliber anti-aircraft artillery, which was the main threat for ground attack aircraft. Entering service in January 1945, the Il-10 took part in some of the last combat operations in Europe, and during the brief Soviet intervention in the Pacific War. By the time the Il-10 retired from Soviet service in 1956, the Air Force shifted focus from pure CAS and ground-attack to fighter-bomber aircraft. Its NATO reporting name is Beast."
 CZE_jet_CAS_equipment_2: "МиГ-15бис"
 CZE_jet_CAS_equipment_2_short: "МиГ-15бис"
 CZE_jet_CAS_equipment_2_desc: "Fighter-bomber conversion, fitted to carry unguided rockets and bombs."
 CZE_jet_CAS_equipment_3: "МиГ-17АС"
 CZE_jet_CAS_equipment_3_short: "МиГ-17АС"
 CZE_jet_CAS_equipment_3_desc: "Fighter-Bomber version with all-moving slab tail. Equipped with Svod long-range navigation receiver and armed with three 30 mm NR-30 cannons. Had provisions for an ORO-32K rocket unguided rocket pack or a FAB-250 bomb under each wing, and from 1957 modified to allow four rocket pods to be carried."
 CZE_jet_CAS_equipment_4: "Су-7Б"
 CZE_jet_CAS_equipment_4_short: "Су-7Б"
 CZE_jet_CAS_equipment_4_desc: "The bomber variant of the Su-7 Fitter-A first flew in March of 1959, later entering service in 1961. It would go on to be the primary Soviet ground attack aircraft of the 1960's. From 1957-1972 over 1400 Su-7Bs were constructed, many of which were exported. The aircraft was relatively popular overseas seeing service 10 nations. It saw extensive service in both the Indian and Egyptian Air Forces. The aircraft remains in limited service in North Korea."
 CZE_jet_CAS_equipment_5: "Су-7БКЛ"
 CZE_jet_CAS_equipment_5_short: "Су-7БКЛ"
 CZE_jet_CAS_equipment_5_desc: "Upgraded AL-7F-1 engine, upgraded fuel system with external piping on either side of the fuselage spine, fuel tanks installed in the wings, 'wet' underwing hardpoints for carrying external fuel tanks, capable of carrying tactical nuclear bombs."
 CZE_jet_CAS_equipment_6: "Су-20"
 CZE_jet_CAS_equipment_6_short: "Су-20"
 CZE_jet_CAS_equipment_6_desc: "The Sukhoi Su-17 Fitter-C was a further development of the Soviet Su-7B ground attack aircraft. The Su-17 was widely exported to the Eastern Bloc, Arab and South American Air Forces. The Su-17 improved upon almost all aspects of its predecessor including sensors, flight performance, payload, range and variable wing sweep. From 1969 to 1990 2867 aircraft were produced and used in 30 nations, 6 that still use the aircraft today."
 CZE_jet_CAS_equipment_7: "Су-22"
 CZE_jet_CAS_equipment_7_desc: "(\"Flogger-H\") An upgraded version of the MiG-23B, the MiG-23BN differed in that it was fitted with the Edition 3 wings and R-29 engine of contemporary fighter variants, along with minor updates in electronics and equipment. The other major difference was the removal of the dielectric head found on the MiG-23B. Produced from 1973 to 1985, a total of 624 MiG-23BNs were built, although only a small number served in VVS units with the rest exported."
 CZE_jet_CAS_equipment_7_short: "Су-22"
 CZE_jet_CAS_equipment_8: "Су-25"
 CZE_jet_CAS_equipment_8_short: "Су-25"
 CZE_jet_CAS_equipment_8_desc: "The Sukhoi Su-25 Frogfoot is a twin-engine ground attack aircraft developed in the Soviet union. The aircraft completed its maiden flight in 1975 and was introduced in 1981. Since 1978 over 1000 aircraft have been produced. It was particularly popular aircraft overseas, being sold to 29 countries. Because of this the Su-25 has been involved in several conflicts, notably the Soviet Afghan, Iran-Iraq and Gulf Wars. The aircraft remains in service with all export countries today."
