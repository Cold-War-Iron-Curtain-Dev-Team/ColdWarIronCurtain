l_russian:
 HUNGARIAN_REV.1.d: "Ласло Райка отправили в тюрьму вместе с двумя другими жертвами послевоенных чисток, инициированных венгерским лидером Матьяшем Ракоши. На публичном судебном процессе присутствовало около ста тысяч человек. Это знаменует собой кульминацию одного из многочисленных протестов с требованием реабилитации Ласло Райка. Райк был популярным коммунистическим лидером и основателем агентства безопасности AVH. Ракоши недавно признал, что он несправедливо отдал Райка под суд и казнил за то, что он был титовцем. Хотя фактическое признание Ракоши не было опубликовано, многие в Венгрии и внутри партии теперь сомневаются в способности нынешнего правительства, состоящего из избранных Ракоши лидеров. Это усиливает оппозицию против Ракоши. Коммунисты старой гвардии недовольны этими событиями и обвиняют нового советского руководителя Никиту Хрущева в том, что он стал источником этой новой открытости, которая позволила людям так открыто нападать на партийное руководство."
 HUNGARIAN_REV.2.d: "После публичного возмущения реабилитацией Ласло Райка, студенты в Шнегеде заняли свою собственную позицию против правящего коммунистического режима. Студенты реформировали Союз венгерских студентов университетов и академий (MEFESZ). Эта демократическая студенческая организация была давно запрещена, когда правил Матиас Ракоши. Вместо этого единственным разрешенным студенческим союзом был коммунистический ВКСМ. В течение нескольких дней студенты основали MEFESZ в нескольких других городах. Эта последняя провокация свидетельствует о том, что венгерский народ начинает терять веру в коммунистическое правительство, находящееся под контролем избранных Ракоши лидеров. Похоже, что вопрос о студенческих союзах является второстепенным, но многие в венгерской коммунистической партии обеспокоены тем, что это только усилит протесты против партии и наследия Ракоши, которое она стремится сохранить."
 HUNGARIAN_REV.3.d: "В то время как студенты по всей Венгрии массово выражают свое недовольство впервые за последние десятилетия, студенты Будапештского технического института теперь присоединились к протесту. Они составили список из шестнадцати требований национальной политике, которые включают, среди прочего, расследование деятельности режима Матиаса Ракоши, свободные выборы и устранение советского влияния в стране. Студенты в Будапеште также объявили о планах присоединиться и поддержать Союз писателей, поскольку они планируют возложить венок к статуе знаменитого героя венгерской революции 1848 года, польского генерала Юзефа Бема. Это делается в знак солидарности с польскими активистами, которые в настоящее время борются за реформы в стране. Это событие теперь, вероятно, привлечет больше толп, чем ожидалось. События разворачиваются слишком быстро, и правительство не успевает что-либо предпринять."
 HUNGARIAN_REV.4.d: "Огромная многотысячная толпа собралась у памятника знаменитому генералу Юзефу Бему, чтобы возложить венок и предложить поддержку польским активистам, борющимся за перемены. Петер Верес обратился к толпе, призывая к независимости Венгрии и либерализации социалистической системы. Толпа пела запрещенные патриотические песни, и многие начали вырезать коммунистический герб на венгерском флаге. Огромная толпа прошла к парламенту, чтобы присоединиться к протестующим там, в результате чего число протестующих превысило двести тысяч. Хотя протесты не переросли в насилие, они многочисленны и опасны. Многие коммунистические правительственные чиновники теперь опасаются, что ситуация быстро перерастает в анархию."
 HUNGARIAN_REV.5.d: "В свете недавних протестов, охвативших Будапешт, перед страной выступил первый секретарь венгерской Коммунистической партии Эрно Геро. Он осудил протестующих, которые ранее в тот же день выдвинули требования от статуи Йозефа Бема, а затем устроили стычки с полицией у здания парламента. Он заявил, что протестующие не имеют на это права, и отверг все их требования. Хотя сторонники жесткой линии партии будут довольны этим обращением, первоначальная реакция протестующих была крайне недовольной. Они чувствуют, что правительство игнорирует людей и не оказывает им уважения, несмотря на их приверженность мирному протесту. Многие теперь открыто стали революционерами."
 HUNGARIAN_REV.6.d: "Услышав выступление Эрно Геро, взволнованные протестующие решили выполнить одно из своих требований. Они дошли до памятника Сталину и снесли статую Сталина. Статуя была подарена Советским Союзом в 1951 году и рассматривалась как символ иностранной оккупации Венгрии. Протестующие снесли голову статуе, чтобы выразить свой гнев. В конце концов от статуи остались только ноги, а над ней был водружен венгерский флаг. Примерно в то же время у здания радиостанции начались столкновения между протестующими и членами AVH, и среди хаоса AVH открыла огонь по протестующим. Молодой студент Янош Визи был мгновенно убит. Протестующие завернули его тело в венгерский флаг и унесли с собой, собирая все больше людей вокруг себя. Беспорядки теперь еще больше обострились по всему Будапешту, и протестующие теперь прибегают к насилию."
 HUNGARIAN_REV.7.d: "Поскольку Эрно Геро обратился к нации, протестующие собрались на главной радиостанции и послали делегацию, чтобы ретранслировать свои требования в страну. Однако венгерское агентство безопасности AVH задержало делегацию и отказало в удовлетворении требований. Слухи среди протестующих по поводу казни делегатов заставили некоторых попытаться штурмовать здание. AVH открыла огонь, убивая протестующих, и бросила в толпу слезоточивый газ. Неудавшаяся попытка привезти еще больше оружия с помощью скорой помощи еще больше обострила напряженность. Когда военные прибыли, чтобы освободить AVH, протестующие приветствовали их, поскольку солдаты сняли свои красные звезды со своих шляп. В ходе волнений протестующие подожгли полицейские машины, и, что еще более важно, совершили налеты на склады оружия по всему Будапешту. Оружие быстро распределяется, чтобы обеспечить защиту от дальнейших нападений правительства."
 HUNGARIAN_REV.8.d: "Поскольку ситуация в Будапеште быстро выходила из-под контроля, первый секретарь венгерской Коммунистической партии Эрно Геро призвал советские войска в стране вмешаться. Геро сообщил советам, что ситуация вышла за пределы возможностей правительства. Через несколько часов советский министр обороны санкционировал развертывание танков в Будапеште. Советские войска выдвинулись рано утром и, как ожидается, к полудню займут позиции в парламенте и на ключевых узловых пунктах."
 HUNGARIAN_REV.9.d: "Поскольку протестующие теперь нацелились на полицию, правительственные здания и символы коммунистического режима, Агентство безопасности AVH попыталось вмешаться. На правительственных объектах, находящихся в осаде, его личный состав открывал огонь по толпам людей, однако эти действия только разъярили протестующих, а не разогнали их. Нарастание и распространение протестов привело к тому, что численность АVH сократилась, и теперь они больше не имеют преимущества в огневой мощи. Попытки развернуть венгерские войска в поддержку AVH были быстро прекращены, поскольку первоначальные развертывания привели к тому, что войска присоединились к протестующим. Столкновения продолжались всю ночь и раннее утро. Там, где протестующие одерживают верх, они открыто нападают на членов AVH."
 HUNGARIAN_REV.10.d: "В ошеломляющем повороте событий венгерский премьер-министр передал власть Имре Надю. Лидер народных коммунистов был недавно отстранен от должности председателя Совета министров в связи с его призывом к реформам и противодействием советскому вмешательству. В своем обращении к стране он призвал к спокойствию и пообещал, что инициирует необходимые стране политические реформы. Это заявление немного успокоило напряженность, однако столкновения все еще происходят, и сообщения указывают на то, что протестующие продолжают вооружаться. Хотя Надь пользуется общественным доверием, прибытие советских войск в Будапешт и продолжающиеся столкновения с AVH заставляют многих беспокоиться, что у нового премьер-министра нет средств контролировать ситуацию."
 HUNGARIAN_REV.11.d: "Советская ввод войск был неспланирован, поэтому танки были заблокированы баррикадами, возведенными протестующими. Положение AVH продолжало ухудшаться, поскольку их силы были вытеснены с радиостанции и протестующие все больше превосходили их по вооружению. Советские войска, собравшиеся у здания парламента, были встречены огромной толпой. Члены AVH открыли огонь по протестующим из соседних зданий, что заставило советы нацелиться на AVH, полагая, что они стреляют по ним. В этой неразберихе вооруженные протестующие нацелились на обе стороны, что еще больше усилило напряженность и хаос. В течение следующих нескольких дней были сформированы революционные советы для координации вооруженного сопротивления, что привело к тому, что Советы и AVH понесли тяжелые потери. Венгерская Коммунистическая партия также столкнулась с жестоким возмездием со стороны этих революционеров. Поскольку венгерские военные не желали вмешиваться, премьер-министр Имре Надь в конце концов договорился о прекращении огня, и советы согласились уйти из Будапешта в свои гарнизоны."
 HUNGARIAN_REV.12.d: "Председатель Мао написал письмо, в котором призвал советского лидера Никиту Хрущева проявить терпение и не вмешиваться в нынешний венгерский кризис. Ранее правительство выразило поддержку интервенции, и советы высоко оценили наши взгляды на этот вопрос. Однако это письмо изменит нашу позицию и может повлиять на Хрущева, озабоченного тем, как более широкий коммунистический мир воспримет вторую интервенцию. Мы должны решить, следует ли нам немедленно доставить письмо Хрущеву, чтобы попытаться предотвратить интервенцию. Однако есть и те, кто полагает, что, возможно, лучше оставить этот вопрос без внимания, поскольку мы уже консультировались с советами, дальнейшие комментарии многих только усложняют ситуацию и наши отношения."
 HUNGARIAN_REV.13.d: "Китайское правительство представило письмо Председателя Мао Цзэдуна Советскому премьеру Никите Хрущеву. В нем китайский лидер призывает нас не вмешиваться. Он предупреждает о последствиях такого поступка и призывает к сдержанности. Он предложил свои услуги для содействия мирному урегулированию кризиса. Мы постоянно контактировали с китайцами по этому вопросу, и их мнение может дать нам представление о том, как весь коммунистический мир может отреагировать на интервенцию. Если верить Мао, интервенция может привести к дальнейшим расколам и поставить под угрозу единство мирового социалистического движения. Мы должны тщательно взвесить этот совет и решить, следует ли нам последовать его совету и начать деэскалацию или продолжать наши приготовления."
 HUNGARIAN_REV.14.d: "Ситуация в Венгрии продолжает ухудшаться. Разведка и военные источники сравнивают ситуацию с анархией. Правительство Имре Надь утверждает, что успокоило ситуацию и восстановило порядок. Однако мы слышали от коммунистических союзников в Венгрии, что Надь слаб и находится во власти контрреволюционных сил. Однако у нас есть сообщения, указывающие на военное вмешательство, которое может вызвать протест не только на Западе, но и среди других социалистических государств. Кроме того, у нас есть и другие сообщения, в которых отмечается, что с тех пор, как Надь был назначен, он сократил насилие и, возможно, является необходимой стабилизирующей силой. Многие выступают за то, чтобы мы продолжали следить за ситуацией. Мы, конечно, можем провести переоценку и вмешаться позже, если это необходимо, этот вариант предлагает нам гибкость. Мы можем вмешаться сейчас и помешать этой анархии окончательно разрушить связи венгерского народа с социализмом."
 HUNGARIAN_REV.15.d: "Китайское правительство предложило выступить посредником в переговорах между нами и Советским Союзом. Советский премьер Никита Хрущев, по-видимому, принял это предложение и надеется решить этот вопрос мирным путем. Китайцы добавили, что споры между революционными правительствами не должны приводить к насилию, так как это только ослабляет единство и плохо отражает ситуацию. Намекали также, что отказ от участия в таких переговорах может привести к массированному советскому военному вмешательству. Согласие принять участие в переговорах может позволить нам сохранить некоторые из тех драматических изменений, которых мы достигли, и помочь обеспечить нашу независимость от иностранного вмешательства. Тем не менее, другие члены правительства возражают против участия в переговорах, утверждая, что риск советского вторжения предпочтительнее, чем идти на компромиссы по тому, что требует народ."
 HUNGARIAN_REV.16.d: "\nПосле напряженных переговоров, проведенных в Южной Польше, представители Венгрии и Советского Союза согласились на компромисс. Еще совсем недавно казалось, что ситуация между двумя нациями ведет к вооруженному конфликту из-за венгерской революции. Однако китайское правительство смогло убедить Советский Союз позволить Китаю облегчить переговоры между обеими сторонами и достичь справедливого решения. Детали окончательного соглашения будут обнародованы в ближайшее время, но предварительные сообщения предполагают, что соглашение сохраняет ряд венгерских внутренних реформ. Взамен венгры должны гарантировать свою приверженность Варшавскому договору и социализму. Китайские дипломаты наблюдали за ходом переговоров и содействовали их завершению. В официальном заявлении китайского правительства они объявили, что новое соглашение демонстрирует, как социалистические государства разрешают споры миром, а не войной, в отличие от Запада."
 HUNGARIAN_REV.17.d: "Премьер-министр Имре Надь, выполняя свое обещание провести политические реформы, назначил нескольких некоммунистов министрами правительства. Этот беспрецедентный шаг призван успокоить революционеров в Будапеште и восстановить веру народа в социалистическое правительство. Это явный разрыв с предыдущими режимами, которые строго придерживались однопартийной системы в стране. Имре Надь долгое время выступала за необходимость реформ и открытия нынешней коммунистической системы для удовлетворения венгерских политических устремлений. Этот шаг уже отталкивает радикальных коммунистов в стране, которые боятся, что Надь капитулирует перед революционерами, которых они считают контрреволюционерами и агентами Запада."
 HUNGARIAN_REV.18.d: "С тех пор как началась венгерская революция, главной оппозиционной силой было агентство безопасности AVH. Их члены охраняли правительственные объекты и вступали в ожесточенные столкновения с протестующими. Многие из их членов обвиняются в открытой стрельбе по безоружным протестующим. Имре Надь недавно помогала вести переговоры о прекращении огня с прорежимными и революционными силами. Он заявил, что, распустив AVH, он положит конец источнику конфликта и раскола. Премьер-министр обозначил планы по формированию национальной гвардии для поддержания общественного порядка. Эта новая сила будет состоять из вооруженных революционеров и правительственных солдат, которые будут работать вместе, чтобы восстановить мир."
 HUNGARIAN_REV.19.d: "В разгар напряженности и насилия венгерские рабочие покинули правительство, чтобы сформировать местные рабочие советы для контроля над муниципальными вопросами и инициировать забастовки по всей стране. Понимая, что эти рабочие советы набирают все большую популярность, премьер-министр Надь санкционировал создание местных советов рабочих, которые должны заботиться о муниципальном управлении и условиях труда. Советы положительно отреагировали на это заявление, и общенациональная забастовка была отменена. Кроме того, делегация представителей этих советов вскоре прибудет с визитом к премьер-министру и предложит свою поддержку его правительству."
 HUNGARIAN_REV.20.d: "В продолжение политики примирения, недавно начатой премьер-министром Имре Надем, правительство объявило о создании правительства национального единства, которое будет состоять из нескольких ранее запрещенных политических партий. Он заявил, что эти партии, работая вместе с его собственными, обеспечат не только порядок, но и помогут определить будущее развитие венгерской нации. Это говорит о том, что Венгрия движется к многопартийному демократическому государству. Это заявление фактически объявляет о конце однопартийной системы в Венгрии, что является ключевым требованием революционеров. Советы и закоренелые коммунисты не будут рассматривать эти события позитивно, так как идеологически однопартийная система считается существенным компонентом развивающегося социалистического государства. В то время как премьер-министр заводит друзей среди оппозиции, его собственная партия, похоже, разваливается на фоне этих драматических перемен."
 HUNGARIAN_REV.21.d: "\nВ радиообращении к стране премьер-министр Имре Надь объявил о своем намерении выйти из Варшавского договора и проводить внешнюю политику нейтралитета. Для многих венгров членство в Варшавском договоре символизировало сохранение контроля над их страной со стороны Советов. Выводя войска, Надь стремится восстановить независимую внешнюю политику Венгрии. Это заявление также является прямой угрозой Советскому Союзу и его послевоенному порядку в Восточной Европе. Премьер-министр Надь надеется, что советы будут уважать волю венгерского народа и не рискнут оттолкнуть других своих союзников, заняв жесткую позицию против страны. Остается выяснить, прав ли Надь в своих расчетах относительно советских намерений."
 HUNGARIAN_REV.22.d: "Последнее заявление премьер-министра Имре Надя потрясло венгерских коммунистов до глубины души. Многие теперь считают, что Надь не просто капитулировал перед оппозицией, но открыто наблюдал за крахом социалистического строя в Венгрии. Янош Кадер, высокопоставленный лидер Коммунистической партии и министр, встретился с советским руководством в Москве. Он сообщил им, что Венгрия не переживает социалистического переустройства, а поддается контрреволюционным силам. Либеральная кампания Надя вышла далеко за рамки того, что могло бы позволить любое другое социалистическое общество, и коммунисты Венгрии отчаянно нуждаются в Советском Союзе, чтобы защитить их. Он также отметил внесудебные убийства членов Коммунистической партии в начале недавних беспорядков как пример того, что произойдет, если Надь не будет остановлен сейчас. С этой просьбой венгерских коммунистов советы должны решить, следует ли вмешаться или попытаться заставить его работать с правительством Надя."
 HUNGARIAN_REV.23.d: "Советский Союз внимательно следил за ситуацией в Венгрии. Советские войска, дислоцированные в стране, пытались помочь на ранних стадиях, но были вынуждены отступить. Последующая программа либерализации, объявленная премьер-министром Имре Надь, по-видимому, успокоила напряженность, и хотя среди венгерских коммунистов были жалобы. Однако недавнее заявление Венгрии о выходе из Варшавского договора и нейтралитете было провокацией против Советского Союза. Во всем мире люди ждали реакции Советского Союза, которая была выражена в заявлении, опубликованном в Москве. В нем советы обещают установить новые отношения с Венгрией, основанные на взаимном уважении и равенстве. Похоже, опасения советского военного вмешательства необоснованны, и советы надеются вступить с режимом в дипломатический контакт. Что это означает для других членов Варшавского договора и советской позиции в Восточной Европе, еще предстоит выяснить."
 HUNGARIAN_REV.24.d: "Недолгая, но бурная венгерская революция закончилась кровопролитием, когда советские войска в течение последних нескольких дней пронеслись по Венгрии. Решение премьер-министра Имре Надя объявить Венгрию нейтральной страной и выйти из Варшавского договора обернулось против СССР ответной военной интервенцией. Советские войска вначале разоружили венгерские воинские части и окружили Будапешт. Затем они атаковали сопротивляющиеся революционные силы, и после ожесточенных городских боев советские войска одержали верх, оставив город сильно поврежденным. Премьер-министр Надь и другие высокопоставленные революционеры бежали в югославское посольство в Будапеште. Советский Союз утверждает, что он действовал после того, как венгерские коммунисты попросили о вмешательстве, чтобы положить конец контрреволюции и защитить коммунистов от дальнейшего насилия, поскольку многие были казнены революционерами на ранней стадии восстания. Сопротивление венгров и отказ их военных присоединиться к советам свидетельствуют о том, что не все венгры приветствовали эту акцию. Новое правительство под руководством Яноша Кадара возьмет на себя восстановление социализма в стране."
 Golden_Team.1.d: "Венгерская национальная футбольная сборная стала самой доминирующей командой в последнее время. Команду возглавляет менеджер Гужтав Себеш, бывший профсоюзный организатор. Ведущие игроки - Ференц Пушкаш, Шандор Кочсис, Нандор Хидегкути, Золтан Чибор, Йожеф Божик и Дьюла Гросич. Себес реализовал научную фитнес-программу, тактическую гибкость и требование универсальности всех своих игроков. Это позволяет команде играть в гораздо более динамичную игру, которая возбуждает толпы и выигрывает матчи. Команда доминировала над традиционными футбольными державами, включая ошеломляющую победу над Англией на их родной земле. Их победы превозносятся правительством как пример превосходства социалистического человека. Среди венгров эти победы вызывают чувство национальной гордости, что несколько беспокоит некоторых коммунистических сторонников жесткой линии."
