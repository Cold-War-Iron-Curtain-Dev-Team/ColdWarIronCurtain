l_english:
 Suez_Crisis_Gulf.51.d: "Недавний Суэцкий кризис подогрел арабские страсти в Бахрейне, поскольку тысячи людей, как говорят, борются против британской агрессии в отношении Египта. Британские здания и транспортные средства становятся мишенью, так как участники беспорядков требуют прекращения британского влияния на Бахрейн. Правящая монархия, похоже, не в состоянии использовать свои собственные силы для подавления беспорядков, и некоторые опасаются, что солдаты могут присоединиться к участникам беспорядков. Вместо этого король попросил британцев развернуть свои собственные силы и положить конец насилию. Британцы согласились, и британские войска были быстро развернуты, чтобы положить конец беспорядкам и восстановить мир. Бунтовщики отреагировали в основном забрасывая британские силы камнями и горящими машинами. Однако британцы уверены, что порядок будет восстановлен в ближайшее время."
 NUC.5.d: "В ответ на недавнее расширение нефтяной промышленности, межконфессиональные волнения и враждебное отношение к британскому влиянию в Бахрейне, появилась новая партия. Названная Комитетом национального единства, эта партия возглавляется комитетом в составе четырех суннитов и четырех шиитов с целью оказания давления на правительство, с тем чтобы оно разрешило деятельность профсоюзов, положило конец британскому влиянию и боролось с сектантством в стране. Несмотря на появление партийной платформы, противоречащей монархии, правительство Бахрейна приняло решение легализовать партию и принять ее в качестве законной политической силы в стране. Этот шаг приветствуется на местном уровне как признак зрелости монархии. Однако пробританские элементы и традиционалисты опасаются легализовать партию, рискуя легализовать более радикальные политические мысли, которые страна может не выдержать."
 BAH_FEDERATION.1.d: "Правительство Бахрейна при содействии своих британских советников, обратилось с просьбой оказать поддержку в создании Федерации арабских государств Персидского залива, в состав которой войдут Бахрейн, Маскат и государства Персидского залива. Правительство отмечает, что эти государства обладают общим историческим наследием связей через торговлю и идентичность. Что еще более важно, эти районы обладают ценными природными ресурсами, и сильная федерация стран Персидского залива - единственный способ обеспечить, чтобы внешняя власть не захватила их и не эксплуатировала эти ресурсы. Они также отмечают, что это предлагаемое государство возьмет на себя бремя обороны и снимет его с британских военных. Говорят, что Лондон внимательно рассматривает эту просьбу, и что более крупные региональные державы в регионе, следят за ситуацией с небольшим беспокойством, так как такая федерация изменила бы динамику в регионе."
 BAH_FEDERATION.2.d: "Британское правительство после интенсивных встреч решило принять предложение правительства Бахрейна о создании нового государства под названием \"Федерация Арабского залива\". Это новое государство объединит Бахрейн, Маскат и государства Персидского залива. Британцы, очевидно, были убеждены в этом предложении и видят преимущество в том, что природные ресурсы этих государств будут находиться под единой властью. Британские военные отметили, что это обеспечит защиту этих ресурсов от соседних государств и снизит давление на Великобританию в вопросе защиты этих земель. Несмотря на то, что британское правительство выглядит вполне удовлетворенным, некоторые наблюдатели отмечают, что Федерации Арабского залива придется управлять эгоизмом нескольких абсолютных правителей, и отмечают, что такое государство может в конечном итоге дестабилизировать регион со временем."
 BAH_FEDERATION.3.d: "Британское правительство после интенсивных встреч решило отклонить предложение правительства Бахрейна о создании нового государства под названием \"Федерация Арабского залива\". Это новое государство объединило бы Бахрейн, Маскат и государства Персидского залива. Правительство Великобритании отметило, что оно с уважением относится к предложению своего близкого союзника в Бахрейне, но пришло к выводу, что такое государство нежизнеспособно и не отвечает интересам народа региона. Правительство Бахрейна, скорее всего, будет расстроено таким развитием событий, и уже ходят слухи, что британское решение было заговором с целью обеспечения того, чтобы эти арабские государства оставались слабыми и расколотыми. Однако эту новость приветствуют региональные державы, которые опасались, что такое государство может поставить под угрозу баланс сил в регионе."
 BAH_FEDERATION.4.d: "После одобрения британского правительства руководители Бахрейна, Маската и государств Персидского залива незамедлительно приступили к реализации планов по формированию Федерации Арабского залива. Британские официальные лица помогли скоординировать эти усилия, и теперь время пришло. В столице Бахрейна состоялась тщательно продуманная церемония поднятия флага. Лидеры новой нации рассказали собравшимся сановникам, что Федерация Арабского залива представляет собой арабское единство и бастион защиты от злых влияний и врагов народа. Они также пообещали, что наступит эпоха невероятного экономического развития, которая сделает народ нового государства предметом зависти всего мира. В конце церемонии главы государств вместе с региональными британскими чиновниками подписали соглашение, подтверждающее появление Арабской федерации стран Персидского залива."
 General_Strike.2.d: "Проходившая в Бахрейне всеобщая забастовка, которая поглотила страну в последние дни, похоже, подходит к концу. Главный советник короля Бахрейна, Чарльз Белгрейв подал в отставку. Это было принципиальным требованием забастовок, которые были организованы реформистским Комитетом национального единства. Организация твердо верит в прекращение британского влияния в Бахрейне, и отставка знаменует собой победу группы. Чарльз Белгрейв занимал руководящую должность в Бахрейне в течение почти тридцати лет, и его отставка, похоже, произошла после того, как он понял что ситуация обостряется. Удаление Белгрейва, ослабляет британское влияние на острове, но продемонстрировало монархии угрозу уличной власти."
 Suez_Crisis_Gulf.50.d: "Ситуация в Бахрейне ухудшилась по мере того, как волнения охватили столицу. Многие вышли на улицы в гневном протесте против Суэцкого кризиса и британской агрессии против Египта. Участники беспорядков требуют от правительства устранить британское влияние и считают, что Бахрейн должен поддержать Египет в их борьбе. Отсутствие политической открытости в сочетании с презрением к открытому британскому присутствию на острове, разожгло ситуацию, и мятежники нацелились не только на британские здания, но и на магазины, которые обслуживают иностранцев. Правительство, похоже, не в состоянии сдержать восстание, так как король удерживает свои вооруженные силы, есть опасения, что солдаты могут в конечном итоге поддержать мятежников, а правительство не желает эскалации беспорядков. Правительство уже объявило, что оно уменьшит влияние британских советников в руководстве политикой, но это не положило конец протестам."
 Bab_Al_Bahrain.1.d: "Сегодня, правительство Бахрейна официально открыло Баб Аль Бахрейн для восторженных толп. Этот прекрасный памятник станет первым общественным местом в небольшом островном государстве, и правительство надеется, что он обеспечит лучшие удобства для граждан Бахрейна. Проект стал детищем Чарльза Белгрейва, главного советника Короля. Наряду с банками, магазинами и ресторанами, памятник отмечает вход на рынок Манама. Кроме того, правительство планирует перенести свои основные здания вокруг памятника. Белгрейв уверен, что памятник поможет сделать Бахрейн более привлекательным и будет способствовать росту торговли на острове. Памятник воспринимается гражданами весьма благосклонно и воспринимается как символ нового, современного Бахрейна."
 NUC.10.d: "С тех пор как появился реформистский Комитет национального единства (КНЕ), он участвовал в организации забастовок и беспорядков. Хотя их цели, по-видимому ограничиваются улучшением прав трудящихся, прекращением британского влияния и борьбой с сектантством, стало ясно, что группа питает более мрачные амбиции. Их недавняя всеобщая забастовка повергла страну в дни жестоких беспорядков, которые угрожали стабильности Бахрейна. Главные лидеры КНЕ были схвачены и представлены перед судом. Сегодня этот суд вынес свой вердикт, и принял решение о высылке этих лидеров из Бахрейна, в тюрьму на острове Святой Елены на четырнадцать лет. Британцы согласились оставить этих людей, и им не разрешат вернуться до окончания срока их заключения. Правительство объявило вердикт и провозгласило, что разрушители мира были справедливо наказаны. Реакция на улице была беззвучной."
 General_Strike.1.d: "С тех пор, как появился Комитет национального единства (КНЕ), он выступает за создание профсоюзов, прекращение британского влияния и искоренение сектантства. Их реформистская повестка дня дала им большое влияние, и они смелым шагом объявили всеобщую забастовку. Главной целью этой забастовки является отстранение Чарльза Белгрейва от должности главного советника короля. Для многих в Бахрейне Белгрейв символизировал открытое британское влияние на страну с момента своего прибытия почти три десятилетия назад. Ранние попытки полиции сдержать или разогнать акции протеста получили обратную реакцию. Бунты медленно появляются и по мере роста насилия. До сих пор правительство отказывалось принимать требования КНЕ, но правительство, безусловно, знает, что эта группа сейчас представляет собой потенциальную угрозу для политики правительства."
 Bahrainian_Revolution.1.d: "Суэцкий кризис разжег арабские страсти в Бахрейне, когда тысячи людей вышли на улицы в знак протеста против действий Великобритании против Египта. Протестующие забрасывали камнями британских чиновников в стране и разграбляли здания, управляемые британцами, по всей столице. Беспорядки сопровождались забастовками, организованными Комитетом Национального единства. Однако в последние несколько дней, арабские националистические революционеры подходили к участникам беспорядков и вчера обратили их против правящей монархии. Бунтовщики, а теперь уже революционеры, обратились к правительству, требуя избрания законодательного органа и установления нового режима в Бахрейне. Протестующие начали захватывать правительственные здания и радиостанции, заявляя, что народ должен положить конец реакционной монархии и освободить Бахрейн от Великобритании. Король развернул свои силы для подавления беспорядков, утверждая, что КНЕ была прикрытием для иностранного левого влияния, но к утру большинство войск присоединились к протестующим, когда страна была захвачена революционерами."
 Bahrainian_Revolution.2.d: "Почти три десятилетия, британский советник Чарльз Белгрейв, исполнял обязанности главного советника монархии в Бахрейне. Под его влиянием, Бахрейн инициировал ряд социальных и экономических реформ, направленных на модернизацию страны, хотя и часто возмущал традиционалистов. Аналогичным образом, его чрезмерное влияние рассматривалось большинством граждан Бахрейна как символ продолжающегося британского влияния и контроля над страной. Во время недавних беспорядков и революции, многие обвиняют Белграйва в том, что он подтолкнул короля к насильственному подавлению протестов и привлечению его к ответственности за жертвы среди гражданского населения. Чарльз Белгрейв сдался революционерам, как только стало ясно, что монархия потеряла власть и вскоре был публично казнен. Революционеры заявили, что его смерть ознаменовала собой освобождение, но эта акция широко осуждается во всем регионе и мире. Многие в Лондоне переживают этот поворот событий, и пока неясно, как британцы отреагируют на эту провокацию."
 Bahrainian_Revolution.3.d: "Новость о казни революционерами Чарльза Белгрейва, вызвала массовую панику среди британского населения острова. Чтобы ослабить эту напряженность и предотвратить дальнейшее насилие в отношении своих граждан, британское правительство объявило о полном выводе своих войск и полной эвакуации своих граждан. Британские подданные, желая получить защиту, наводняют британские военные объекты, так как британские военные начали посылать самолеты для эвакуации своих граждан. Как только британские гражданские лица будут благополучно эвакуированы, британские военные силы вскоре последуют за ними. Британские подданные и силы сыграли большую роль в оказании помощи нефтяной промышленности и обороне Бахрейна, их односторонний вывод, несомненно, будет препятствовать развитию экономики."