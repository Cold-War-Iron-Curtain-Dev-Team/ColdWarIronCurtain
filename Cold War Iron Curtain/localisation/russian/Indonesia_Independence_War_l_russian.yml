l_russian:
 Indonesian_National_Revolution.1.d: "Прошлогоднее наступление голландцев вынудило нас к партизанскому сопротивлению на Яве и Суматре. Международное давление вынудило их вернуть Джакарту и согласиться на переговоры. В настоящее время действует режим прекращения огня, хотя наши силы участвуют в партизанских операциях. Наши силы медленно восстанавливаются. Мы должны определить, как подходить к голландцам до тех пор, пока не будет достигнуто всеобъемлющее прекращение огня. Большинство командиров желают продолжить партизанскую кампанию и продержаться до окончательного заключения мира. Другие командиры утверждают, что мы должны изменить действия на местах. Они предлагают использовать месяц и реорганизовать часть наших бойцов в боевые подразделения и начать наступательные действия, чтобы вытеснить голландцев с Явы и Суматры, чтобы обеспечить наше преимущество на мирных переговорах. Однако неудача наступления может иметь катастрофические последствия"
 Indonesian_National_Revolution.2.d: "Нынешняя военная ситуация, похоже, зашла в тупик. Наши силы успешно отбили ключевые объекты на Яве и Суматре в прошлом году в ходе операции "Ворон", но международное давление вынудило нас пойти на уступки, включая возвращение Джакарты в обмен на согласие вести переговоры об урегулировании. Похоже, что более существенное прекращение огня и переговоры по определению окончательного урегулирования начнутся в течение нескольких месяцев. У наших военных чиновников есть два плана, один из которых заключается в подготовке наших сил к наступлению. Хотя это приведет к негативной реакции международного сообщества и нарушит нынешнее прекращение огня, возможно, оно того стоит. Если наши силы нанесут сокрушительное поражение повстанцам, мы контролируем переговоры. Однако неудавшееся наступление имело бы катастрофические последствия. Другой, более безопасный вариант - сохранить контроль над районами, которые у нас есть сейчас, и воздержаться от продолжения боевых действий до переговоров"
 Indonesian_National_Revolution.3.d: "После операции "Ворон" Нидерланды были вынуждены прекратить свое наступление, вернуть столицу Джакарту в обмен на прекращение огня. Поскольку ожидается, что республиканское правительство вскоре вернется, а всеобъемлющие переговоры, как ожидается, будут проведены в течение нескольких месяцев, правительство Нидерландов решило вывести всех своих граждан из Джакарты. Голландские военные чиновники призывают своих граждан не медлить, поскольку возвращение республиканской власти в этом районе подвергает их повышенному риску. Поскольку республиканское правительство остается непостоянным, они не сделали никакого заявления по этому вопросу"
 Indonesian_National_Revolution.4.d: "Индонезийской правительство официально вернулось к власти в своей столице Джакарте. Многие из его членов бежали или были задержаны и сосланы голландцами после того, как их войска захватили город в ходе операции "Ворон" Однако, под сильным международным давлением, они согласились вернуть город и свободу республиканских лидеров для содействия переговорам, которые должны состояться в ближайшее время. Прибытие знаменитого лидера республиканцев Сукарно вывело большинство жителей города на улицы, чтобы отпраздновать его возвращение. Голландцы надеялись, что захват высокопоставленных политических лидеров сломит военное сопротивление, однако этого не произошло. Несмотря на теплый прием, поступали сообщения о том, что военные командиры отказывались принять возвращение гражданского правительства, обвиняя их в отказе от революции. Однако вмешательство нескольких старших командиров, включая полковника Сухарто, убедило вооруженные силы оставаться лояльными Сукарно"
 Indonesian_National_Revolution.5.d: "При республиканском правительстве властью предпринимаются усилия по подготовке к независимости. Одна из самых больших проблем заключается в том, как будут выглядеть будущие индонезийские вооруженные силы. После интенсивных обсуждений было решено, что республиканская армия станет основой объединенных индонезийских вооруженных сил, а все другие иррегулярные или колониальные силы будут объединены по этим линиям. Многие наблюдатели отмечают, что это решение может быть попыткой правительства наладить отношения с офицерами армии, которые всего несколько недель назад отказались признать власть правительства. На конференции также пришли к выводу, что любое будущее независимое правительство будет возглавляться Сукарно."
 Indonesian_National_Revolution.6.d: "Конференция за круглым столом состоится в Нидерландах позже в этом месяце. Для того чтобы переговоры состоялись, на Яве и Суматре должно быть проведено полное прекращение огня. После обсуждений было решено, что на Яве режим прекращения огня начнется 11 августа, в то время как на Суматре режим прекращения огня начнет действовать 12 августа. Как только все боевые действия закончатся, начнется процесс контроля за передачей военной власти от голландских и нерегулярных индонезийских сил республиканскому индонезийкому правительству. Следующие несколько месяцев (а может и недель) определят судьбу Индонезии"
 Indonesian_National_Revolution.7.d: "Решение объединить все вооруженные силы под республиканским командованием привело к столкновениям по всей Индонезии. Некоторые ополченцы и нерегулярные бойцы отказались сложить оружие или следовать директивам. Эти столкновения пока локализованы, но есть опасения по поводу того, что может произойти, когда более крупные, проголландские группы начнут беспорядки. Существует некоторая обеспокоенность тем, что, если насилие не будет сдержано, это может сорвать предстоящее прекращение огня. Если прекращение огня не вступит в силу, Нидерланды могут попытаться сорвать заседание "круглого стола""
 Indonesian_National_Revolution.8.d: "За последние два года работы голландцы восстановили свое присутствие в различных районах Явы. На самом деле, их пропаганда утверждает, что наши силы полностью разгромлены. Поскольку до прекращения огня на Яве осталось всего несколько дней, наши командиры хотят начать последнее наступление на Суракарту. Если мы захватим город, это значительно укрепит наши позиции на переговорах, по крайней мере, мы покажем врагу, что наша решимость сохраняется. Это очень рискованная операция, и она должна быть завершена к дате прекращения огня. Мы должны принять решение"
 Indonesian_National_Revolution.9.d: "Индонезийские правительственные силы проникли в районы вокруг Суракарты и готовы начать наступление. Голландские войска и их местные союзники не смогли остановить продвижение индонезийцев и укрепляются в центре города. Операция была проведена всего за несколько дней до того, что, как ожидается, прекращение огня на Яве вступит в силу. Республиканское правительство отвергло обвинения в том, что его наступление имеет целью сорвать заключение мира, заявив, что войска Индонезии будут соблюдать режим прекращения огня, когда он вступит в силу. Говорят, что численность задействованных республиканских сил исчисляется сотнями."
 Indonesian_National_Revolution.10.d: "Наши командиры в Суракарте отправили срочный запрос о подкреплении. Сообщается, что силы повстанцев, атакующие город, проникают в город, оказывая давление на нашу оборону. Есть опасения, что без подкреплений город может пасть прямо перед прекращением огня. Мы можем отправить несколько сотен коммандос, чтобы укрепить оборону и остановить продвижение повстанцев. Однако есть некоторые опасения, что если мы поторопим силы и все равно потеряем город, это может означать, что наши силы не смогут сдержать угрозу повстанцев. Действительно, некоторые военные лидеры считают, что командование в Суракарте ведет себя слишком осторожно, и развертывание дополнительных сил только усилит пропаганду повстанцев"
 Indonesian_National_Revolution.11.d: "Своевременное развертывание первых коммандос привело к поражению республиканских сил, которые были на грани захвата Суракарты. Говорят, что голландцы в восторге от того, что их войска в очередной раз одержали победу в сражении с повстанцами. Однако ожесточенные бои разоблачили ложные заявления, недавно сделанные колониальными чиновниками о том, что сопротивление повстанцев фактически прекратило свое существование. Несмотря на публичную похвалу своим силам, в частном порядке многие колониальные чиновники обеспокоены тем, что регулярные войска смогли отразить нападение повстанцев только с помощью элитных сил. Индонезийское правительство высоко оценило храбрость своих бойцов, заявив, что это олицетворяет бесконечную преданность народа свободной Индонезии"
 Indonesian_National_Revolution.12.d: "Всего за несколько часов до того, как на Яве должно было состояться прекращение огня, в преддверии запланированных мирных переговоров, индонезийские силы захватили символический и стратегически важный город Суракарта. Голландские войска не смогли удержать город и в конечном счете отступили, хотя республиканцы утверждают, что захватили много пленных. Республиканское наступление началось всего несколько дней назад, в результате чего его силы быстро взяли Суракарту в осаду. В следующие несколько дней колониальное сопротивление в значительной степени рухнуло. Некоторые наблюдатели полагают, что тактика "бей и беги", принятая республиканскими силами на Яве, подорвала моральный дух голландцев, что привело к быстрому краху их сопротивления. Ходят слухи о спорах между голландскими военными чиновниками из-за того, что не было предпринято никаких усилий для доставки подкреплений в город. Аналитики полагают, что победа республиканцев дает им лидирующие позиции на мирных переговорах в Нидерландах."
 Indonesian_National_Revolution.13.d: "Массовый протест голландских граждан, в том числе многих студентов, прошел маршем в Амстердаме, протестуя против продолжающейся колониальной войны в Индонезии. Правительство обвиняется в том, что оно пожертвовало экономикой, национальной честью и международной репутацией Нидерландов только ради эгоистичных колониальных интересов. Протестующие также утверждают, что их тошнит от постоянной лжи, которую подпитывает правительство. Недавний всплеск насилия в Индонезии вызывает особую озабоченность не только протестующих, но и членов парламента. Сейчас, похоже, ситуация довольно быстро меняется в сторону поиска мирного решения и быстрого вывода войск из региона"
 Indonesian_National_Revolution.14.d: "Народ Явы может, наконец, вздохнуть с облегчением, поскольку на острове вступает в силу прекращение огня. Сообщается, что колониальные и республиканские силы обеспечивают соблюдение условий прекращения огня, обе стороны не хотят, чтобы предстоящие мирные переговоры потерпели неудачу. Несмотря на это, поступают сообщения о том, что некоторые местные иррегулярные силы и ополченцы сопротивляются попыткам республиканских военных интегрировать или разоружить их. Республиканское правительство стремится создать организованную армию до того, как голландцы признают свою независимость. Голландские вооруженные силы будут рады положить конец смертоносным нападениям республиканских сил, ведущих партизанскую войну"
 Indonesian_National_Revolution.15.d: "Народ Суматры наконец-то может вздохнуть с облегчением, поскольку на острове вступает в силу прекращение огня. Сообщается, что колониальные и республиканские силы обеспечивают соблюдение условий прекращения огня, обе стороны не хотят, чтобы предстоящие мирные переговоры потерпели какие-либо неудачу. Несмотря на это, поступают сообщения о том, что некоторые местные иррегулярные силы и ополченцы сопротивляются попыткам республиканских военных интегрировать или разоружить их. Республиканское правительство стремится создать организованную армию до того, как голландцы признают независимость Индонезии"
 Indonesian_National_Revolution.16.d: "Мы отозвали ряд наших бойцов и реорганизовали их в обычные боевые подразделения. Они будут необходимы для нашего нового генерального наступления, нацеленного на острова Ява и Суматра. Запланированная эскалация и нынешний климат означают, что мы должны нанести быстрый, решительный удар, чтобы обеспечить доминирование на будущих мирных переговорах. Целями наступления на Суматре являются города Джакарта и Сурабая. На Яве должны быть взяты города Палембанг и Медан. Захватив эти города и сохранив контроль над территорией, которую мы в настоящее время контролируем, голландцы будут иметь мало возможностей для того, чтобы диктовать условия на переговорах. У нас есть две недели на подготовку"
 Indonesian_National_Revolution.17.d: "Наши войска начали наступательные действия против колонизаторов. Они преисполнены патриотического пыла. Мы планируем нанести такой удар, что у врага не будет иного выбора, кроме как заключить мир на справедливых (наших) условиях. Слишком долго враг стремился диктовать правила боя, но не более того. Несмотря на наши приготовления и самоотверженность, ожидается, что враг будет яростно сопротивляться. Пусть эта кампания станет кульминацией всей нашей борьбы за свободу. Народы Явы и Суматры ждут свободы"
 Indonesian_National_Revolution.18.d: "Республиканские повстанческие силы начинают наступление на Яве и Суматре. Очевидно, что они стремятся вытеснить нас с этих островов и обеспечить себе больше сил на мирных переговоров. Повстанцы явно хотят свести на нет успехи, достигнутые нами в ходе наших последних крупных военных операций, но им это не удастся. Наши вооруженные силы лучше обучены, оснащены и мотивированы. Мы планируем не только пресечь это опасное нападение повстанцев, но, если возможно, отбросить их назад и изгнать из их командных центров в Джакарте и Букиттинги"
 Indonesian_National_Revolution.19.d: "Общее наступление, начатое антиколониальными республиканскими силами в Индонезии, закончилось крупной победой. Голландские колониальные силы и их союзники были вытеснены из ключевых районов на жизненно важных островах Ява и Суматра. Многие аналитики считают, что эта операция значительно ослабила решимость голландцев продолжать боевые действия. Что еще более важно, республиканское правительство теперь готово доминировать на запланированных мирных переговорах. В дополнение к потере контроля над этими ключевыми островами, многие голландские граждане сейчас находятся на территории, контролируемой республиканцами, наряду с рядом военнопленных"
 Indonesian_National_Revolution.20.d: "Общее наступление, начатое антиколониальными республиканскими силами в Индонезии, закончилось безрезультатно. Голландские колониальные силы и их союзники, несмотря на некоторые неудачи, добились некоторых успехов. Это позволило голландцам удержаться в регионе. Республиканское правительство хвалит свои силы за проведение операции, хотя очевидно, что их основные цели не были достигнуты. Действительно, многие в правительстве, вероятно, вздохнут с облегчением из-за того, что голландцы не смогли провести успешную контратаку. Хотя боевые действия были интенсивными, теперь обе стороны будут ожидать нового прекращения огня, прежде чем проводить окончательные переговоры. Ставка республиканцев на взятие переговоров под свой контроль провалилась"
 Indonesian_National_Revolution.21.d: "Общее наступление, начатое антиколониальными республиканскими силами в Индонезии, закончилось провалом. Голландские войска и их союзники не только отразили атаку, но и предприняли собственную контратаку, вытеснив республику из ее основных командных и политических центров. Голландская военная победа кажется весьма решающей на поле боя. Одержав победу, Нидерланды, скорее всего, вступят в переговоры с позиции силы. Говорят, что выжившие республиканские силы применяют тактику "бей и беги" Ожидается, что переговоры начнутся в ближайшие месяцы"
 Indonesian_National_Revolution.22.d: "Поскольку мирные переговоры ожидаются через несколько месяцев, мы готовимся начать последнее наступление. Это могло бы значительно укрепить наши позиции на переговорах и ослабить республиканское правительство. У нас есть оправдание, поскольку повстанцы продолжают преследовать наши силы, но мы не можем рассчитывать на какое-либо международное сочувствие. Так что это должна быть быстрая операция, и мы должны захватить Джакарту и Букиттинги. Мы ожидаем столкнуться с жестким сопротивлением. Несмотря на эти трудности, наши силы опытны, дееспособны и готовы выполнить план сражения"
 Indonesian_National_Revolution.23.d: "Нидерланды подтвердили, что их силы начали новую "полицейскую акцию" по восстановлению мира на Яве и Суматре. Нидерландское правтельство отметило, что, несмотря на его уступки индонезийскому правительству и международному сообществу, колониальные силы продолжали подвергаться жестоким нападениям. Колониальные силы стремятся значительно ослабить военную мощь республиканцев в преддверии мирных переговоров, ожидаемых в ближайшие месяцы. Международное сообщество, скорее всего, решительно осудит эту акцию. Аналитики полагают, что голландцы верят, что быстрый военный успех приведет к благоприятным переговорам, которые компенсируют любое потенциальное международное противодействие. Боевые действия сосредоточены на Яве и Суматре."
 Indonesian_National_Revolution.24.d: "Дипломаты в Организации Объединенных Наций поспешили осудить недавнее голландское наступление на Яву и Суматру. Многие утверждают, что голландцы отказываются от заверений, данных ими в прошлом году. Похоже, что голландские заявления о том, что это был ответ на республиканские партизанские операции, не вызывают особого доверия. Уже разрабатывается проект о введении санкций в отношении Нидерландов, ожидается, что вскоре он будет вынесен на голосование. Аналитики полагают, что голландцы были готовы к этой дипломатической неудаче и воспользуются своим шансом при голосовании. Ее лидеры делают ставку на то, что выгоды от военного успеха перевесят потерю международного авторитета"
 Indonesian_National_Revolution.25.d: "Доверенный голландский командир дал пресс-конференцию, на которой он представил всех пленных и оружие, захваченные во время их недавнего наступления. Голландским войскам и их колониальным союзникам удалось захватить основные политические и командные центры индонезийского правительства, фактически вернув контроль над Явой и Суматрой. Наряду с военнопленными были также задержаны ряд политических лидеров. Наблюдатели полагают, что победа Нидерландов укрепит их позиции, когда в ближайшие месяцы состоятся переговоры"
 Indonesian_National_Revolution.26.d: "После многих лет борьбы представители Нидерландов, индонезийских националистов и Федеральной Консультативной Ассамблеи, представляющей основанные Голландцами государства в Индонезии, встречаются в Гааге. Комиссия Организации Объединенных Наций по Индонезии содействует переговорам. Обсуждения нЛРАвлены на обеспечение того, чтобы все нерешенные вопросы между Нидерландами и Индонезией были решены до передачи суверенитета независимой Индонезии. Хотя националисты надеялись на сильное центральное правительство поддерживающее национальное единства, перед конференцией они согласились пойти на компромисс с Федеральным Консультативным Собранием для выработки единой позиции по будущей конституции."
 Indonesian_National_Revolution.27.d: "После обсуждений участники круглого стола согласовали график вывода голландских войск из Индонезии. Колониальные силы, организованные голландцами, отступят и будут либо демобилизованы, либо интегрированы в новые индонезийские вооруженные силы, ядро которых составят республиканские вооруженные силы. Нидерланды удовлетворены тем, что их войска будут выведены со всеми воинскими почестями, хотя многие считают, что колониальные силы просто сдаются. Индонезийское правительство столкнется с трудной задачей интеграции этих сил. Среди общин меньшинств в Индонезии, которые обеспечивали основную часть колониальной военной рабочей силы, уже есть опасения, что они потеряют работу и статус с уходом голландцев. Голландцы должны покинуть Индонезию как можно быстрее"
 Indonesian_National_Revolution.28.d: "Одним из главных камней преткновения является место голландских гражданских лиц и корпораций в независимой Индонезии. Эти общины и предприятия долгое время пользовались особыми привилегиями при колониальном режиме. Для многих индонезийцев они остаются примером отношения к ним как к второсортным гражданам. Для многих голландских граждан в Индонезии это единственный дом, который они знают, и многие не желают покидать его. Индонезийские представители согласились с тем, что не будет никакой дискриминации в отношении голландских граждан или предприятий, и это будет соответствовать всем существующим торговым соглашениям. Основной проблемой является вопрос о долге, накопленном колониальным правительством, этот вопрос будет рассмотрен позже на конференции"
 Indonesian_National_Revolution.29.d: "Вопрос о долге оставался основным камнем преткновения на протяжении всех переговоров. Колониальная администрация накапливала как внутренние, так и внешние долги в течение длительного периода времени. Обе стороны представили свои собственные расчеты относительно того, каков именно долг, и разошлись во мнениях относительно того, какой процент будет нести Индонезия. В частности, Нидерланды настаивают на том, что Индонезия должна нести ответственность за долги, возникшие после начала японской оккупации в 1942 году. Индонезийцы были в ярости от перспективы платить за голландские военные операции против собственного народа. Соединенные Штаты и ООН смогли убедить индонезийцев принять долг как цену, которую нужно заплатить за независимость"
 Indonesian_National_Revolution.30.d: "Помимо вопроса о долге, статус Западной Новой Гвинеи вызвал ряд острых дискуссий. Индонезийцы настаивают на том, что территория должна быть передана, но Нидерланды утверждают, что она этнически не связана с остальной Индонезией. Голландское правительство спокойно заявило индонезийским представителям, что если территория будет передана, оно, возможно, не сможет добиться ратификации мирного соглашения своим парламентом. Индонезийцы, однако, не были готовы отозвать свои претензии. Многие опасаются, что переговоры по этому вопросу могут зайти в тупик"
 Indonesian_National_Revolution.31.d: "Индонезийские делегаты согласились ратифицировать Федеральную Конституцию в качестве руководящего документа для независимого объединенного государства Индонезия. Принципы этого документа были согласованы до начала переговоров всеми сторонами. Соединенные Штаты Индонезии будут федеративным государством с двухпалатным парламентом. Все регионы будут составными частями государства, каждый из которых получит определенное количество мест. Также должны быть признаны несколько автономных регионов. Эта конституция в значительной степени соответствует требованиям проголландских жителей Индонезии, которые опасаются, что чрезмерно могущественное центральное правительство может стать проблемой в будущем. Индонезийские националисты, выступавшие за сильный центр, пошли на серьезные компромиссы, чтобы обеспечить единую Индонезию. Однако они займут посты президента и премьер-министра"
 Indonesian_National_Revolution.32.d: "Последний вопрос перед достижением окончательного соглашения между представителями Нидерландов и Индонезии на переговорах был окончательно разрешен. Индонезийцы согласились позволить голландцам контролировать Западную часть Новой Гвинеи при условии, что обе стороны проведут переговоры об окончательном урегулировании в течение года после обретения независимости. Компромисс был достигнут ранним утром после нескольких часов интенсивного обсуждения. Индонезийские националисты не будут счастливы, но они, по крайней мере, добились независимости"
 Indonesian_National_Revolution.33.d: "Месяцы переговоров между голландскими и индонезийскими представителями завершились в Риддерзаале. Переговоры были невероятно трудными, и обе стороны были вынуждены идти на компромиссы. Сообщалось, что представители обеих сторон были утомлены, но удовлетворены результатами. Нидерланды будут удовлетворены тем, что покинули Индонезию с соглашениями, защищающими их интересы. Индонезийцы будут приветствовать прекращение войны и признание полного суверенитета Индонезии. Правительства по всему миру посылают свои поздравления в связи с рождением новой страны. Голландцы теперь будут работать над быстрой передачей контроля"
 Indonesian_National_Revolution.34.d: "В рамках передачи суверенитета колониальные власти освободили всех заключенных деятелей сопротивления, как военных, так и политических. Заключенные возвращаются в свои дома как герои Индонезии. Все тюрьмы переходят под индонезийский контроль. Освобождение заключенных в значительной степени поможет новому государству утвердиться, поскольку среди задержанных было много влиятельных политических лидеров. Процесс передачи суверенитета, по-видимому, продвигается так гладко, как только можно"
 Indonesian_National_Revolution.35.d: "Нидерланды официально передали суверенитет Соединенным Штатам Индонезии. Впервые весь народ Индонезии будет независимым, объединенным под руководством одного правительства. Для индонезийцев годы борьбы за свободу наконец закончились. Организация Объединенных Наций опубликовала заявление о своем ожидании встречи с руководством новой страны. Крупнейшие посольства уже сообщают о своем намерении признать новую страну. Знаменитый герой-националист Сукарно стал новым президентом страны, в то время как его политический союзник Мохаммад Хатта стал премьер-министром."
 Indonesian_National_Revolution.36.d: "В последние недели бывший голландский спецназовец Раймонд Вестерлинг объявил о создании движения под названием Легион Рату Адиля (ЛРА). ЛРА, состоящая из разнообразных людей, включая бывших колониальных солдат, недовольных республиканских бойцов и сунданцев, выступающих против яванского политического господства. Группа решительно выступает против независимой Индонезии и нЛРАвила ультиматум, требующий, чтобы ЛРА была названа официальной армией государства и гарантировала автономию штатам. Правительство не отреагировало, и в течение последних нескольких дней силы ЛРА попытались совершить государственный переворот и захватить Бандунг и Джакарту. Нападение на Бандунг изначально было успешным, но его силам не удалось захватить Джакарту или власть. Республиканские силы совместно с полицией смогли быстро восстановить порядок, хотя Вестерлинг сбежал в Сингапур. Несмотря на то, что Нидерланды осуждают этот акт, ходят слухи, что они способствовали побегу Вестерлинга"
 Indonesian_National_Revolution.37.d: "В знак поддержки происходящих событий парламент Пасудана, одного из составных элементов Соединенных Штатов Индонезии, проголосовал за самороспуск и присоединение к Республике. Парламент принял меры после того, как столкнулся с сильным внутренним давлением со стороны своего народа. Голосование состоялось после разоблачений того, что высокопоставленные чиновники правительства Пасудана были причастны к недавней попытке государственного переворота, предпринятой ЛРА. Разоблачения подтвердили опасения, что проголландские элементы в Индонезии стремятся использовать конституцию и слабость центра, чтобы разделить и ослабить нацию. Это решение значительно ослабляет нынешнюю федеральную структуру и слегка нарушило политический баланс в национальном парламенте"
 Indonesian_National_Revolution.38.d: "Султан Абдул Хамид II, правитель Понтианака и член федерального кабинета, был арестован. Правительство сообщило, что допрос захваченных членов ЛРА после их неудавшегося переворота выявил причастность Абдул Хамида. На допросе султан признал свою причастность, даже сообщив, что в феврале была сорвана вторая попытка государственного переворота. Султан Абдул Хамид II решительно выступает против создания унитарного центрального правительства, опасаясь, что это приведет к маргинализации индонезийцев, не являющихся яванцами, и служил старшим офицером в колониальных вооруженных силах. Арест вызвал массовые протесты в провинции Западный Калимантан, поскольку граждане хотят, чтобы штат присоединился к Республике. Неудавшийся переворот и последующие разоблачения подтверждают в умах многих индонезийцев, что нынешняя политическая структура - это колониальный проект, призванный сохранить Индонезию слабой"
 Indonesian_National_Revolution.39.d: "В свете ухудшающейся политической ситуации лидеры провинции Малуку провозгласили свою независимость как Республика Южного Малуку. Вооруженные сторонники движения захватили контроль над Амбоном. Индонезийские власти сообщают о нападениях, произошедших в Сераме. Южномолуккские протестанты долгое время служили костяком колониальных вооруженных сил. После обретения независимости большинство решило не вступать в индонезийскую армию, опасаясь, что в ней доминируют яванские мусульмане. Вооруженные боевики, захватившие Амбон, как говорят, являются колониальными солдатами, находящимися в процессе демобилизации. Индонезийское правительство пообещало быстро восстановить порядок, одновременно обвиняя Нидерланды в том, что они предоставили бывшим солдатам доступ к оружию. Восстание вспыхнуло после новостей о том, что новый кабинет министров Восточной Индонезии рассматривает возможность самороспуска и присоединения к Республике."
 Indonesian_National_Revolution.40.d: "За последние два месяца, на фоне разоблачений январской попытки государственного переворота и общего недовольства политической ситуацией, практически все автономные районы и штаты проголосовали за присоединение к Республике. Остались только Восточная Индонезия и Восточная Суматра. Руководство обоих штатов решительно выступает против унитарного центрального правительства, опасаясь, что это приведет к политической изоляции неяванцев и мусульман. Однако националистическое послание унитарной Индонезии о построении сильной нации имеет сильный резонанс среди широких слоев населения. Поступают сообщения о протестах, проводимых в двух штатах гражданами, желающими присоединиться к республике. Лидеры республиканцев заявляют, что они всего лишь хотят поддержать волю народа"
 Indonesian_National_Revolution.51.d: "Соединенных Штатов Индонезии больше нет. Центральное правительство, Республика, Восточная Индонезия и Восточная Суматра согласились отменить конституцию и заменить ее временной конституцией, которая сделает государство унитарным. Джакарта была утверждена в качестве столицы этого нового государства, Республики Индонезия. Эти объявления приурочены к пятой годовщине первоначального провозглашения независимости, сделанного Сукарно. Это объявление широко отмечается по всей стране. Старая система оказалась непопулярной, население считало, что это навязанная колониалистами система, призванная разделять индонезийцев. Сторонники Соединенных Штатов Индонезии были вынуждены отступить из-за растущего общественного давления."
 Indonesian_National_Revolution.41.d: "После интенсивных обсуждений индонезийское правительство согласилось взять на себя долг, накопленный колониальным правительством после японской оккупации 1942 года. Хотя обе стороны представили свои собственные цифры о том, какой должна быть сумма, похоже, индонезийцы в основном согласились с предложенияи Нидерландов. Говорили, что индонезийские делегаты оказались в трудном положении из-за их слабой позиции на местах. Кроме того, представители Организации Объединенных Наций и США настаивали на заключении соглашения, отмечая, что это, вероятно, цена, которую приходится платить за свободу"
 Indonesian_National_Revolution.42.d: "Одним из первых камней преткновения была Западная Новая Гвинея. Индонезийские делегаты утверждали, что Индонезия должна получить всю голландскую Ост-Индию. Нидерланды отметили, что этот район этнически и религиозно отличается от остальной Индонезии. Обе стороны оставались тверды в своей позиции до тех пор, пока не было достигнуто соглашение. Индонезийские делегаты согласились с тем, что Западная Новая Гвинея остается частью Нидерландов при условии, что голландцы пообещают рассмотреть возможность проведения переговоров по этой территории в будущем. Наблюдатели отмечают, что это соглашение оставляет голландцам достаточно возможностей просто отложить обсуждение на неопределенный срок"
 Indonesian_National_Revolution.43.d: "Индонезийские делегаты согласились ратифицировать Федеральную Конституцию в качестве руководящего документа для независимой, объединенной Индонезии. Принципы этого документа были согласованы до начала переговоров всеми индонезийскими сторонами. Соединенные Штаты Индонезии будут федеративным государством с двухпалатным парламентом. Республика и созданные Голландией штаты будут составными частями государства, каждое из которых получит определенное количество мест в парламенте. Также должны быть признаны несколько автономных государств. Эта конституция в значительной степени соответствует требованиям голландских штатов, которые опасаются, что чрезмерно могущественное центральное правительство может стать проблемой в будущем. Индонезийские националисты, выступавшие за сильный центр, пошли на серьезные компромиссы, чтобы обеспечить независимую Индонезию. Однако индонезийские националисты займут посты президента и премьер-министра"
 Indonesian_National_Revolution.44.d: "В последние недели бывший голландский спецназовец Раймонд Вестерлинг объявил о создании движения под названием Легион Рату Адиля (ЛРА). ЛРА, состоящая из разнообразных людей, включая бывших колониальных солдат, недовольных республиканских бойцов и сунданцев, выступающих против яванского политического господства. Группа решительно выступает против унитарной Индонезии и направила ультиматум, требующий, чтобы ЛРА была названа официальной армией государства и гарантировала автономию штатам. Правительство не отреагировало, и в течение последних нескольких дней силы ЛРА попытались совершить государственный переворот и захватить Бандунг и Джакарту. Хотя республиканские силы пытались вмешаться, ЛРА удалось захватить кабинет министров. Представители, имеющие связи с ЛРА, были призваны помочь в переговорах с заговорщиками. Страна затаила дыхание"
 Indonesian_National_Revolution.45.d: "После напряженных переговоров был достигнут успех. ЛРА согласилась освободить своих заключенных при условии, что это не повлечет за собой никаких последствий и будет избран новый кабинет национального единства. Республиканцы неохотно согласились позволить султану Абдул Хамиду II, правителю Понтианака и члену федерального кабинета, занять пост премьер-министра, в то время как Сукарно остается президентом. Бойцы ЛРА в настоящее время выводят войска из столицы. Его успех вдохновил на создание филиалов ЛРА по всей восточной Индонезии, в основном состоящих из бывших колониальных солдат, недовольных нынешней военной структурой"
 Indonesian_National_Revolution.46.d: "Делегаты Нидерландов и Индонезии придерживались твердого мнения в отношении долга, понесенного колониальным государством. Индонезийцы твердо верили, что они не обязаны оплачивать расходы, понесенные голландцами за ведение войны на островах и эксплуатацию их ресурсов. Нидерланды считают, что индонезийцы должны взять на себя часть бремени, особенно с того периода, когда японцы начали оккупировать острова. После напряженных переговоров голландцы согласились взять на себя большую часть долга. Хотя они отметили, что Индонезия согласилась взять на себя часть долга, большинство аналитиков считают, что это всего лишь ничтожная сумма, чтобы помочь голландцам сохранить лицо. Слухи указывают на то, что голландцы были вынуждены уступить из страха за свой военный и гражданский персонал в условиях республиканской оккупации"
 Indonesian_National_Revolution.47.d: "Нидерланды согласились передать Западную Новую Гвинею Индонезии. Первоначально голландцы сопротивлялись этому требованию, заявляя, что Западная Новая Гвинея этнически и культурно отличается от остальной Индонезии. Однако индонезийские делегаты настаивали на том, что Индонезия должна унаследовать всю голландскую Ост-Индию. Основное давление исходило от самих голландских граждан, поскольку многие твердо убеждены, что удержание Западной Новой Гвинеи не стоит того, чтобы прерывать переговоры. Опасаясь негативной реакции общественности, Нидерланды в конце концов уступили индонезийцам. Это рассматривается как еще один крупный успех Индонезии во время этих переговоров"
 Indonesian_National_Revolution.48.d: "Индонезийские делегаты согласились принять конституцию 1945 года для будущей Республики Индонезия. Документ в значительной степени вдохновлен принципами, которые Сукарно изложил как важнейшие для независимой Индонезии. Она рассматривается как президентская республика с наличием парламента. Республиканцы смогли договориться о принятии конституции после демонстрации своего доминирующего военного и политического положения на острове за несколько месяцев до круглого стола. Наблюдатели отмечают, что, хотя документ был принят, многие влиятельные индонезийцы обеспокоены чрезмерно могущественным центральным правительством и доминированием яванской культуры."
 Indonesian_National_Revolution.49.d: "Республиканское правительство, в соответствии с процессом передачи суверенитета, наконец освободило последнюю часть голландских заключенных. Многие из этих людей были захвачены в плен на последнем этапе перед окончательным прекращением огня. Эти заключенные были важными для ведения переговоров на конференции за круглым столом. Процесс передачи суверенитета продолжается, хотя есть некоторые случаи беспорядков, особенно на восточных островах, где некоторые жалуются, что голандских хозяев просто заменяют яванские хозяева. Несмотря на это, Сукарно и республиканские официальные лица продолжают призывать к национальному единству и сотрудничеству"
 Indonesian_National_Revolution.50.d: "Нидерланды официально передали суверенитет Республике Индонезия. Впервые весь народ Индонезии будет независимым, объединенным под руководством одного правительства. Для многих индонезийцев годы борьбы за свободу наконец закончились. Организация Объединенных Наций опубликовала заявление о предвкушении приема новой страны в свои члены. Многие страны уже сообщают о своем намерении признать новое государство. Знаменитый герой-националист Сукарно стал президентом, и он пообещал неустанно работать на благо всех индонезийцев"
 Political_Instability_4: "Политическая нестабильность"
