 japan.126.a: "Какой позор!"
 japan.127.t: "Япония требует Курильские острова"
 japan.127.d: "После Второй мировой войны Курильские острова, которые когда-то контролировались японцами, были переданы в собственность Советскому Союзу, но теперь японцы хотят их вернуть. Возвращение Курил можно рассматривать как признак слабости, но это может предотвратить будущий конфликт с Японией. Что нам делать?"
 japan.127.a: "Уступить японским требованиям"
 japan.127.b: "Эти острова наши"
 japan.128.t: "Советы сдают Курилы"
 japan.128.d: "Советы прислушались к голосу разума и вернули контроль над Курильскими островами японцам."
 japan.128.a: "Курилы снова наши"
 japan.129.t: "Советы отказываются от японских требований"
 japan.129.d: "Советы отказались удовлетворить наши требования, утверждая, что острова теперь являются их законной территорией. Они заплатят за это."
 japan.129.a: "Так или иначе, Курилы снова станут японской землей"
 japan.130.t: "Становиться горячо"
 japan.130.d: "Коммунизм — главный враг демократии. Если они откажутся сотрудничать дипломатически, то единственным выходом будет война. Настало время нанести удар."
 japan.130.a: "Может быть, это была не лучшая идея"
 japan.130.b: "Заручиться поддержкой американцев"
 japan.131.t: "Япония хочет обострения"
 japan.131.d: "Японское военное министерство обратилось к нам за поддержкой в войне против Советов, утверждая, что война неизбежна, поэтому она должна быть начата на наших условиях."
 japan.131.a: "Настало время вернуться к японцам"
 japan.131.b: "Японцы сошли с ума?! Мы не поддержим такую войну!"
 japan.132.t: "Американцы обещают поддержку"
 japan.132.d: "После жарких дебатов в Конгрессе американцы пообещали поддержать нас в нашей войне против Советского Союза."
 japan.132.a: "Давайте начнем эту войну"
 japan.132.b: "Нам нужно время для подготовки"
 japan.133.t: "Американцы отказываются нас поддерживать"
 japan.133.d: "После жарких дебатов в Конгрессе американцы отказываются поддерживать какую-либо войну против Советов, если мы собираемся идти на войну, мы идем в одиночку."
 japan.133.a: "Отступите, эту войну невозможно выиграть без поддержки Америки"
 japan.133.b: "Будьте прокляты американцы! Мы сможем выиграть эту войну в одиночку!"
 japan.134.t: "Япония требует Маньчжурию"
 japan.134.d: "Когда-то Япония контролировала Маньчжурию. Когда Вторая мировая война закончилась, земля была передана под контроль Китая, но теперь Япония требует, чтобы мы ее вернули. Что нам делать?"
 japan.134.a: "Уступить японским требованиям"
 japan.134.b: "Маньчжурия — законная китайская территория"
 japan.135.t: "Китай отказывается уступать Маньчжурию"
 japan.135.d: "Китай отказался передать контроль над Маньчжурией, утверждая, что это его законная территория. Что нам ответить?"
 japan.135.a: "Хорошо, тогда мы возьмем ее силой."
 japan.135.b: "Мы уважаем их решение"
 japan.136.t: "Япония приглашает нас в Ось"
 japan.136.d: "После Второй мировой войны страны Оси были насильственно расформированы союзными державами, но теперь Япония вернулась, требуя реформирования старой фракции."
 japan.136.a: "Вместе мы сильны"
 japan.137.t: "Япония приглашает нас в Ось"
 japan.137.d: "После Второй мировой войны страны Оси были насильственно расформированы союзными державами, но теперь Япония вернулась, требуя реформирования старой фракции."
 japan.137.a: "Вместе мы сильны"
 news.event.10000.t: "Япония присоединяется к Варшавскому договору"
 news.event.10000.d: "Япония, находившаяся под демократическим влиянием США с конца Второй мировой войны, теперь присоединилась к Варшавскому договору, выступая на стороне Советов, выступая против Запада и демократии."
 news.event.10000.a: "Запад понес тяжелую утрату."
 news.event.10001.t: "Третья мировая война началась"
 news.event.10001.d: "Поддерживаемое США японское наступление в континентальной Азии положило начало Третьей мировой войне. По всей Европе приходят сообщения о том, что советские танки пересекают Берлинскую стену, вступая в бой с силами НАТО. Это действительно будет война, которая положит конец всем войнам."
 news.event.10001.a: "Да поможет нам всем Бог..."