l_english:
 japan.100.t: "Колонизация Тихого океана"
 japan.100.d: "После Второй мировой войны Япония потеряла многие из своих колоний в Тихом океане, пришло время вернуть их."
 japan.100.a: "Мы снова будем править Тихим океаном."
 japan.101.t: "Колонизация Кореи"
 japan.101.d: "После Второй мировой войны Корея была освобождена из под нашего правления. С тех пор она разделилась на Север и Юг. Сейчас самое время вернуть себе утраченную территорию, пока они слабы."
 japan.102.t: "Япония требует Тайвань"
 japan.102.d: "Япония потеряла Тайвань после Второй мировой войны, но теперь они вернулись и требуют, чтобы мы уступили им Тайвань."
 japan.102.a: "Уступить японским требованиям"
 japan.102.b: "Тайвань теперь наша земля"
 japan.103.t: "Китай отказывается уступать Тайвань"
 japan.103.d: "Несмотря на то, что Тайвань по праву принадлежит нам, Китай отказался передать Тайвань под наш контроль."
 japan.103.a: "Я думаю, мы должны взять это сами"
 japan.103.b: "Мы уважаем их решение"
 japan.104.t: "Япония присоединяется к Варшавскому договору"
 japan.104.d: "Япония, которая после окончания Второй мировой войны встала на сторону США и западной демократии, внезапно и резко переключилась на сторону Советского Союза и восточного коммунизма."
 japan.104.a: "Для Японии это не обернется хорошо"
 japan.105.t: "Япония скатилась к коммунизму"
 japan.105.d: "В последние годы японцы стали поддерживать коммунистические идеалы. Сначала мы не придали этому большого значения, так как поддержка была ограниченной. Но нам только что сообщили, что произошел переворот, в результате которого демократическое правительство было заменено правительством, выступающим за коммунизм. Это опасная ситуация для нашего положения в Тихом океане. Если мы хотим действовать, мы должны действовать сейчас."
 japan.105.a: "Япония не может сдаться коммунизму, мы должны вмешаться"
 japan.105.b: "Мы не должны вмешиваться в дела других стран"
 japan.106.t: "Япония приглашает нас в Азиатскую Коалицию"
 japan.106.d: "Япония недавно создала Азиатскую коалицию в попытке сплотить коммунистические страны, которые в настоящее время существуют в Азии, чтобы стать единой силой против любых внешних угроз."
 japan.106.a: "Мы поддержим Японию"
 japan.106.b: "Мы не поддержим ни одну такую фракцию"
