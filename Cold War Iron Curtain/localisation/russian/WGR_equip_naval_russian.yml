 WGR_battle_hull_light_1: "Класс 440 Deutschland"
 WGR_battle_hull_light_1_short: "440 Deutschland"
 WGR_battle_hull_light_1_desc: "Дойчланд (A59) был военно-морским кораблем Бундесмарине, Вест-Германского флота. Он был построен и использовался как тренировочный крейсер («Шульшиф») в мирное время и предназначался для многоразовых задач в случае войны, таких как перевозка войск, госпитальный корабль, минно-тральщик и эскорт."
