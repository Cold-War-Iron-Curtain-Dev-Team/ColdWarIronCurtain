  # Submarine Hulls # 
 WGR_sub_hull_small_single_0: "Класс 201"
 WGR_sub_hull_small_single_0_desc: "Тип 201 был первым классом подводных лодок Германии, построенных после Второй мировой войны. Они были построены из амагнитной стали для противодействия угрозе магнитных морских мин, но материал оказался недостаточно протестированным и вызывал проблемы в эксплуатации в Бундесмарине."
 WGR_sub_hull_small_single_1: "Класс 205"
 WGR_sub_hull_small_single_1_desc: "Тип 205 был классом немецких дизель-электрических подводных лодок. Они были однокорпусными судами, оптимизированными для использования в мелководных акваториях Балтийского моря. Тип 205 представляет собой прямое развитие класса 201 с удлиненным корпусом, новым оборудованием и датчиками. Самое большое отличие заключается в использовании стали ST-52 для давления в корпусе, так как неамагнитная сталь класса 201 оказалась проблематичной."
 WGR_sub_hull_small_single_2: "Класс 206A"
 WGR_sub_hull_small_single_2_desc: "Тип 206 - класс дизель-электрических подводных лодок (U-ботов), разработанный Howaldtswerke-Deutsche Werft (HDW). Его конструкция основана на предыдущем классе подводных лодок типа 205. Эти малые и маневренные подводные лодки были построены во время Холодной войны для действий в мелководных акваториях Балтийского моря и атаки на суда Варшавского договора в случае военного противостояния."
 WGR_sub_hull_small_single_3: "Лот I класса 212A"
 WGR_sub_hull_small_single_3_desc: "Немецкая подводная лодка типа 212 - это дизель-электрическая подводная лодка, разработанная компанией Howaldtswerke-Deutsche Werft AG (HDW) для военно-морских сил Германии и Италии. Он оснащен дизельной силовой установкой и дополнительной воздухонезависимой двигательной установкой (AIP), использующей топливные элементы на сжатом водороде Siemens с протонообменной мембраной (PEM)."
 WGR_sub_hull_small_single_4: "Лот II класса 212A"
 WGR_sub_hull_small_single_4_desc: "Немецкая подводная лодка типа 212 - это дизель-электрическая подводная лодка, разработанная компанией Howaldtswerke-Deutsche Werft AG (HDW) для военно-морских сил Германии и Италии. Он оснащен дизельной силовой установкой и дополнительной воздухонезависимой двигательной установкой (AIP), использующей топливные элементы на сжатом водороде Siemens с протонообменной мембраной (PEM)."
  
 #WGR_sub_hull_large_single_0: "Type IX Class"
 #WGR_sub_hull_large_single_0_desc: "The Type IX U-boat was designed by Nazi Germany's Kriegsmarine in 1935 and 1936 as a large ocean-going submarine for sustained operations far from the home support facilities. Type IX boats were briefly used for patrols off the eastern United States in an attempt to disrupt the stream of troops and supplies bound for Europe. It was derived from the Type IA, and appeared in various sub-types."
 WGR_sub_hull_large_single_0: "Тип XXI класс"
 WGR_sub_hull_large_single_0_desc: "Подводные лодки типа XXI представляли собой класс немецких дизель–электрических подводных лодок Elektroboot, спроектированных во время Второй мировой войны. Сто восемнадцать были завершены, причем четыре из них были боеготовы. Во время войны только два были приняты на действительную службу и ходили на патрулирование, но они не использовались в бою."
