 WGR_screen_hull_medium_1: "Класс F120 Кельн"
 WGR_screen_hull_medium_1_short: "F120 Кельн"
 WGR_screen_hull_medium_1_desc: "Корабли класса фрегатов F120 "Кельн" были первыми крупными военными кораблями, построенными в Германии после Второй мировой войны. Это были первые в мире корабли, оснащенные комбинированной дизельной и газовой двигательной установкой. За свою долгую карьеру корабли неоднократно переоборудовались с помощью новой электроники и торпедных аппаратов. В 1980-х годах они были заменены фрегатами типа 122, и четыре корабля были проданы турецкому флоту."
 WGR_screen_hull_medium_2: "Бременский класс F122"
 WGR_screen_hull_medium_2_short: "F122 Бремен"
 WGR_screen_hull_medium_2_desc: "Восемь фрегатов класса F122 Bremen ВМС Германии представляют собой серию фрегатов, введенных в эксплуатацию в период с 1982 по 1990 год. Конструкция основана на проверенном и надежном голландском классе Kortenaer, но использует другую двигательную установку и планировку ангара."
 WGR_screen_hull_medium_3: "Класс F123 Бранденбург"
 WGR_screen_hull_medium_3_short: "F123 Бранденбург"
 WGR_screen_hull_medium_3_desc: "Класс F123 "Бранденбург" - это класс немецких фрегатов. Они были заказаны ВМС Германии в июне 1989 года и достроены и введены в эксплуатацию в период с 1994 по 1996 год, заменив эсминцы класса "Гамбург". Корабли в основном ведут противолодочную борьбу (ASW)."
 WGR_screen_hull_medium_4: "Класс F124 Sachsen"
 WGR_screen_hull_medium_4_short: "F124 Sachsen"
 WGR_screen_hull_medium_4_desc: "Класс F124 Sachsen - это новейший класс высокоразвитых фрегатов противовоздушной обороны ВМС Германии. Конструкция фрегата класса Sachsen основана на конструкции F123 класса Brandenburg, но с улучшенными функциями скрытности, предназначенными для обмана радаров и акустических датчиков противника. Этот класс включает в себя усовершенствованный многофункциональный радар APAR и радар дальнего действия SMART-L, который, как предполагается, способен обнаруживать самолеты-невидимки и ракеты-невидимки"
  
 WGR_screen_hull_heavy_0: "119 Зерстерер-1 класс"
 WGR_screen_hull_heavy_0_short: "119 Зерстерер-1"
 WGR_screen_hull_heavy_0_desc: "Тип 119 Zerstörer 1 был классом из 6 эсминцев ВМС Западной Германии. Они вступили в строй в 1958 году, а последний из них был списан в 1982 году. Поскольку времени на планирование, строительство и испытания собственных крупных кораблей не было, Федеративная Республика Германия в 1958-1960 годах получила от США шесть эсминцев класса "Флетчер" для ВМС Германии в рамках Закона о взаимной помощи в обороне."
 WGR_screen_hull_heavy_1: "Класс 101 по Гамбургу"
 WGR_screen_hull_heavy_1_short: "101 Гамбург"
 WGR_screen_hull_heavy_1_desc: "Эсминцы типа 101 "Гамбург" были единственным классом эсминцев, построенных в послевоенной Германии. Они были специально разработаны для эксплуатации в Балтийском море, где вооружение и скорость важнее мореходных качеств"
 WGR_screen_hull_heavy_2: "Класс 103B Лютйенс"
 WGR_screen_hull_heavy_2_short: "103B Лютьенс"
 WGR_screen_hull_heavy_2_desc: "Эсминцы типа 103 "Лютьенс" были последним классом эсминцев, состоявшим на вооружении ВМС Германии. Это были американские эсминцы с управляемыми ракетами класса "Чарльз Ф. Адамс", но с некоторыми модификациями в соответствии с требованиями Германии."
 WGR_screen_hull_heavy_3: "Ремонт класса 103B Лютьенс I"
 WGR_screen_hull_heavy_3_short: "Ремонт 103B Лютьенс I"
 WGR_screen_hull_heavy_3_desc: "Эсминцы типа 103 "Лютьенс" были последним классом эсминцев, состоявшим на вооружении ВМС Германии. Это были американские эсминцы с управляемыми ракетами класса "Чарльз Ф. Адамс", но с некоторыми модификациями в соответствии с требованиями Германии."
 WGR_screen_hull_heavy_4: "Класс 125 Баден-Вюртемберг"
 WGR_screen_hull_heavy_4_short: "125 Баден-Вюртемберг"
 WGR_screen_hull_heavy_4_desc: "Фрегаты класса F125 "Баден-Вюртемберг" представляют собой серию фрегатов ВМС Германии, которые были спроектированы и построены ARGE F125, совместным предприятием Thyssen-Krupp и Lürssen. Фрегаты класса "Баден-Вюртемберг" имеют самое большое водоизмещение среди всех классов фрегатов в мире."
  
