l_russian:
 Pachachi.1.d: "Опытный иракский политик и арабский националист Музахим аль-Пачачи сегодня покинул Ирак. Бывший премьер-министр Ирака помог создать одну из самых первых арабских националистических групп в Ираке и сыграл большую роль в разработке конституции Ирака 1925 года. В межвоенный период он занимал различные посты в кабинете министров и работал на дипломатических должностях. Он успешно налаживал связи с СССР, воинствующими антиколониальными лидерами и другими арабскими националистами, что ставило его в противоречие с правящим в Ираке прозападным королем Хашимитом. Будучи премьер-министром, он подтолкнул Ирак к активному участию в освобождении Палестины, и его постоянное отстаивание прав палестинцев разозлило хашимитов как в Ираке, так и в Иордании. Иорданская династия имеет свое собственное видение Палестины, а иракский король опасается, что его прозападная позиция будет подорвана антизападными националистами. В последние недели пробританские сторонники Хашимитов и дворцовые чиновники оказывали огромное давление на Музахима аль-Пачачи, чтобы он покинул Ирак, пытаясь сдержать растущий пыл арабских националистов в Ираке. Хотя им удалось заставить его уехать, многие считают, что Музахим просто заключит союз с другими арабскими националистами в регионе и будет распространять свое послание без помех со стороны хашимитского надзора."
 CENTO.1.d: "Соединенные Штаты определили Ближний Восток как уязвимое пространство, через которое может распространиться коммунизм. Американские попытки сформировать ближневосточное командование провалились из-за антиколониальных настроений и растущего арабского национализма. Вместо этого основное внимание было направлено на формирование \"северного яруса\" и сдерживание коммунизма путем объединения НАТО с СЕАТО для завершения окружения Москвы. Это означало создание альянса, который географически связывал бы Турцию (члена НАТО) с Пакистаном (членом SEATO). Турция и Ирак недавно подписали договор о сотрудничестве под названием "Багдадский пакт", который призывал к совместному сопротивлению внешнему вмешательству и приглашал региональные государства присоединиться к нему. Великобритания, Пакистан и Иран согласились присоединиться, тем самым закрепив Багдадский пакт в качестве регионального альянса с оборонными, культурными и экономическими связями. Хотя Соединенные Штаты поддержали эту инициативу и она соответствовала их региональным целям, они отказались стать ее членом. В связи с этим возникают вопросы о том, как альянс будет сотрудничать в военном отношении без прямого американского участия. У каждого государства-члена есть свои интересы, и, кроме Ирана и Турции, ни Пакистан, ни Ирак не граничат с коммунистическими государствами. На бумаге альянс выглядит сильным, но время покажет, станет ли он на практике НАТО мусульманского мира."
 ARF.1.d: "Сегодня королевства Ирак и Иордания объявили о создании Арабской федерации, которую многие рассматривают как ответ на Объединенную Арабскую Республику, созданную Египтом и Сирией. Король Ирака Фейсал и его двоюродный брат, король Иордании Хусейн, потомки династии Хашимитов, правившей Аравией до 1921 года, заявили, что давно планировали создать арабский союз государств. Этот союз рассматривается как прямое следствие выхода Ирака из Багдадского пакта и обеспечения независимости страны от западного арабского партнера, Египта. Хотя по названию это федерация, многие считают новое государство конфедерацией, что расстроило многих людей. Объединенная Арабская Республика еще не сделала никакого официального заявления по этому поводу, хотя есть сообщения о мобилизации Израиля. Тем не менее, это монументальный шаг для Ближнего Востока, а возможно, и для всего мира."
 Faisal.1.d: "Сегодня король Ирака Фейсал II достиг совершеннолетия и занял свое место правителя Ирака. Хотя он взошел на трон в возрасте 4 лет в 1939 году после смерти короля Гази, своего отца, страной управлял его регент и пробританский дядя принц Абд аль-Аллах. Король Фейсал II начал коронацию с поездки в открытой карете, которую вели нарядно одетые кавалеристы, чтобы посетить иракский Меджлис. Он вошел в парламент в сопровождении войск в парадной форме, одетых по европейскому образцу. После обращения к Меджлису король Фейсал II принес присягу на царствование и принял клятву верности от Меджлиса и иракского народа от президента Сената. После церемонии король посетил большой прием, где принимал известных высокопоставленных лиц, включая герцога Глостера. Европейский стиль униформы и практики во время коронации указывает на то, что король Фейсал II надеется продолжить политику своего дяди. Сможет ли он сдержать растущую угрозу панарабизма и арабского национализма, остается неясным, поскольку, несмотря на пышную церемонию, поступали сообщения о том, что иракцы из районов со средним достатком жаловались на расходы, связанные с коронацией. В районах с рабочим классом некоторые иракцы были отвращены мероприятием, на котором короля окружала вооруженная охрана, а не народ Ирака."
 Suwaidi.1.d: "Тауфик аль-Сувайди решил принять приглашение короля Фейсала II сформировать новое правительство и работать с Хашимитами. Блестящий юрист и бывший премьер-министр, выросший в поздней Османской империи, аль-Сувайди добился известности в эпоху британского мандата. Сегодня он опытный политик и международная фигура. Хашимиты надеялись, что его прозападные взгляды приведут к поддержке их режима, но аль-Сувайди исторически доказал, что он не верит в западные принципы представительной демократии и индивидуальных прав. Иракская королевская семья с подозрением относилась к его предыдущему пребыванию на посту премьер-министра, поскольку он разрешил функционирование политических партий и дал указание министерству внутренних дел ослабить свои действия, особенно в отношении левых. Однако ситуация, в которой оказался Ирак, требует сильного руководства, и опыт и репутация аль-Сувайди перевешивают риски отмены им правительственных ограничений и наблюдения за сомнительными группами в стране. Тауфик аль-Сувайди имеет долгую историю столкновений с Хашимитами, но он тоже считает, что настало время для более успешных отношений и, возможно, более демократического Ирака."
 Central_League_Games.1.d: "Центральная лига Ирака состоит из футбольных команд клубов и учреждений, расположенных в Багдаде. Несмотря на то, что Иракская центральная лига является одной из четырех региональных лиг страны, она считается главной футбольной лигой Ирака. Ее чемпионы представляют Ирак на клубном чемпионате Азии. Клуб "Харис Аль-Малики" считается главным клубом страны. Однако все матчи пользуются популярностью, так как на них часто собираются полные залы. Кроме того, многие иракцы внимательно следят за результатами в СМИ, надеясь, что их команда окажется на первом месте. Крупные учреждения, такие как полиция и армия, также выставляют свои команды, что дает сотрудникам этих учреждений больше оснований поддерживать свою команду. Иракский футбол радует население во время сезона лиги и позволяет конкурирующим учреждениям разрешать свои противоречия на поле, а не на улицах. Какая красивая игра."
 Ayoubi.1.d: "Али Джавдад аль-Айуби долгое время служил Хашимитам в Ираке. После службы при недолговечном сирийском режиме Фейсала он последовал за ним в Ирак. Он занимал крупные руководящие и дипломатические посты, в том числе несколько раз был премьер-министром Ирака. Аль-Айуби, опытный политический лидер, осознал изменение мирового порядка после окончания Второй мировой войны. В ходе драматического дипломатического маневра аль-Айюби прилетел в Вашингтон, чтобы лично открыть посольство Ирака в американской столице. Иракское правительство признает, что Великобритания уже не является той первостепенной силой, которой она когда-то была. Если Хашимиты хотят выжить в условиях подъема антимонархического, панарабского национализма и коммунистической агитации, им необходимо укрепить свои связи с американцами, и новое посольство станет первым шагом в этом процессе. СМИ в США сообщают о волнении и интересе местного населения к драматическому решению старшего иракского лидера прилететь, чтобы лично открыть посольство. В Ираке этот шаг восхваляется как признание глобального порядка, в то время как антимонархисты указывают на это действие как на продолжение сдачи Ираком своего суверенитета колониальным силам."
 Constitution_Party.1.d: "Разочарование и гнев по поводу политических репрессий в Ираке и вмешательства Великобритании вылились в протесты и забастовки против монархии и англо-иракского договора 1948 года. По мнению протестующих, слишком долгое время внешняя политика Ирака диктовалась Лондоном, а династия Хашимитов ограничивала любые проявления политического дискурса. В разгар этих волнений король Фейсал II опубликовал публичное осуждение Партии конституции. Он заявил, что эта партия разжигала гнев протестующих и пыталась спровоцировать гражданскую войну во имя собственной политической выгоды. По его словам, в действительности многое из того, на что жалуются протестующие, происходит по вине Партии конституции, а поскольку протесты направлены против королевской семьи, Партия конституции отказывается помочь успокоить беспорядки. Такое осуждение Партии конституции удивило многих в Ираке, и еще предстоит выяснить, поможет ли попытка короля возложить вину и ответственность на партию успокоить беспорядки, охватившие Ирак."
 IRQ_Reign.1.d: "Ирак - это, пожалуй, самое произвольно созданное государство, возникшее в результате Первой мировой войны. Британцы объединили три отдельные провинции Османской империи и создали Ирак. В новом государстве отсутствовала этническая, религиозная или языковая однородность. Арабское большинство было разделено на суннитов и шиитов. В стране было значительное курдское меньшинство, сосредоточенное на севере. В Багдаде существовало значительное ассирийское христианское население, а также большая еврейская община. Британцы стремились управлять Ираком через договоры с дружественным правительством, чтобы обеспечить свои интересы и избежать расходов. Фейсал ибн Хусейн, недавно свергнутый французами в Сирии, был приглашен англичанами стать королем Ирака Фейсалом I. Несмотря на отсутствие каких-либо связей с землей, король Фейсал I оказался искусным посредником между фракциями Ирака и утвердил легитимность своей династии в народе. Его смерть в 1933 году привела на трон неумелого короля Гази. После смерти короля Гази в 1939 году на престол вступил трехлетний король Фейсал II, но власть осталась за регентом, принцем Абдуллой. После ранней смерти короля Фейсала I в парламенте доминируют стареющие политики османской эпохи, которые постоянно меняют власть в парламенте. С начала правления принца Абдаллы военные свергли несколько премьеров, хотя они решили не свергать систему.  Во время Второй мировой войны Хашимиты столкнулись с самым серьезным испытанием - власть захватили националистически настроенные армейские офицеры. Хашимиты и парламент вернулись к власти только после британского вторжения, что навсегда запятнало государство Хашимитов в глазах все более националистически настроенного населения.  Политика централизации иракского государства сопровождалась жестокими репрессиями, когда армия подавляла курдов и ассирийцев. Помимо сопротивления централизации, антиколониальный средний класс и левая агитация среди городских рабочих - все это новые угрозы для иракского хашимитского государства. Время покажет, сможет ли король Фейсал II положить конец политической неопределенности и восстановить доверие народа к династии."
  
  
 hashemite_survival_tt: "§HЭтот фокус открывает возможность расширить Арабскую Федерацию на Сирию и Аравию, а также обеспечивает выживание режима Хашимитов в Ираке. Этот фокус должен быть выполнен до июля 1958 года"
 IRQ_Integrate_Hashemite_Arabia_into_the_Federation: "Интеграция Аравии в Федерацию"
 IRQ_the_hashemite_soveriegnty: "Хашимитский суверенитет"
 IRQ_the_hashemite_soveriegnty_desc: "Ирак вступает в трудную новую эпоху. Мы должны работать над тем, чтобы наши отношения как с западным миром, так и с нашим собственным населением были позитивными, не нанося ущерба нашим отношениям с другими."
 IRQ_exodus_of_the_jews: "Исход евреев"
 IRQ_exodus_of_the_jews_desc: "Израильское правительство пытается помочь евреям Ирака эмигрировать в Израиль через Иран и Кипр. Мы должны пресечь эти попытки."
 IRQ_parliamentary_election: "Парламентские выборы"
 IRQ_parliamentary_election_desc: "Настало время для народа Ирака избрать новый парламент."
 IRQ_financial_managment: "Финансовый менеджмент"
 IRQ_financial_managment_desc: "Страна якобы существует для блага и безопасности людей, которые в ней проживают. Поэтому мы должны начать модернизировать и преобразовывать нашу экономику, чтобы она соответствовала западной, только так мы сможем обеспечить процветание нашего народа."
 IRQ_increase_troops_in_palestine: "Увеличить численность войск в Палестине"
 IRQ_increase_troops_in_palestine_desc: "Арабский мир все еще находится под угрозой сионистской агрессии, мы должны увеличить наши военные обязательства на фронтах арабо-израильского конфликта в Палестине."
 IRQ_unpopular_rule: "Непопулярное правило"
 IRQ_unpopular_rule_desc: "Прозападная позиция нашего правительства привела к тому, что наше правление стало очень непопулярным среди многих критиков режима. Если заставить этих критиков и писателей замолчать и скрыть их произведения от общественности, это поможет внутренней стабильности и увеличит поддержку нашего правительства."
 IRQ_denounce_the_constitution_union_party: "Денонсировать партию Союз Конституции"
 IRQ_denounce_the_constitution_union_party_desc: "Партия Конституционного союза - это политическая партия, основанная Нури аль-Саидом в 1949 году, целью которой является ограничение вмешательства кронпринца Абд аль-Илаха в иракскую политику, поддержка аль-Саида при формировании правительства и противостояние левым партиям. Нури Саид - коррумпированный политик, для которого собственные интересы превыше всего, даже в ущерб независимости страны и жизни людей, а его политика не вызывает ничего, кроме волнений среди населения. Он должен быть осужден."
 IRQ_support_the_constitutional_union_party: "Поддержать партию Конституционный союз"
 IRQ_support_the_constitutional_union_party_desc: "Партия Конституционного союза - это политическая партия, основанная Нури Аль-Саидом в 1949 году, целью которой является ограничение вмешательства кронпринца Абд аль-Илаха в иракскую политику, поддержка Аль-Саида при формировании правительства и противостояние левым партиям. Эта партия важна для того, чтобы не допустить коммунистического влияния в правительство, а Нури Саид - важный политик, который долгое время служил нашей стране, и поэтому он нуждается в поддержке короля."
 IRQ_crackdown_on_terrorism: "Борьба с терроризмом"
 IRQ_crackdown_on_terrorism_desc: "На юге страны существует несколько шиитских террористических групп, которые стремятся уничтожить монархию и правительство, в котором доминируют сунниты. С этими опасными группами необходимо бороться и уничтожить их."
 IRQ_maintain_british_relations: "Поддерживать отношения с Великобританией"
 IRQ_maintain_british_relations_desc: "Переворот 1941 года и протесты 1948 года заставили британцев скептически относиться к нашей способности поддерживать стабильность в стране, Мы должны поддерживать наши отношения с ними на плаву и заверить их, что наша ситуация под контролем."
 IRQ_condemn_the_1949_agreements: "Осудить соглашения 1949 года"
 IRQ_condemn_the_1949_agreements_desc: "Нам не удалось уничтожить израильское государство, а арабские государства на нашем востоке подписали с сионистами соглашения о перемирии. Эти действия вызвали крупные протесты в нашей стране и должны быть осуждены, чтобы успокоить наше население."
 IRQ_restrict_israeli_recognition: "Ограничить признание Израиля"
 IRQ_restrict_israeli_recognition_desc: "Израильское государство вторглось в дома тысяч арабских палестинцев и захватило их, и мы не можем позволить им сделать это без последствий."
 IRQ_negotiate_with_the_populace: "Вести переговоры с населением"
 IRQ_negotiate_with_the_populace_desc: "Англо-иракский договор 1948 года и арабо-израильская война того же года вызвали крупные антиимпериалистические и антисионистские протесты по всей нашей стране, а правительственные репрессии этих протестов только ухудшили ситуацию. Мы должны предложить мирные переговоры с протестующими и уступить их требованиям, если мы хотим остаться у власти."
 IRQ_sign_oil_agreements: "Подписание нефтяных соглашений"
 IRQ_sign_oil_agreements_desc: "Недавнее обнаружение нефти на юге страны вызвало желание различных компаний начать там буровые работы. Заключение торгового соглашения с ними позволит нам получить еще большую прибыль."
 IRQ_host_the_iraqi_central_league_game: "Провести игру Центральной лиги Ирака"
 IRQ_host_the_iraqi_central_league_game_desc: "Футбол - один из самых популярных видов спорта в Ираке, и проведение игры между самыми популярными иракскими командами объединит наше население и даст нам большие суммы денег от футбольных болельщиков."
 IRQ_establish_the_university_of_baghdad: "Учредить Багдадский университет"
 IRQ_establish_the_university_of_baghdad_desc: "Багдад уже давно является центром многих известных университетов и школ в мире, и с растущим населением, которое нуждается в образовании, расширение университетов значительно поможет интеллектуальным поискам Ирака."
 IRQ_arabize_kirkuk: "Арабизация Киркука"
 IRQ_arabize_kirkuk_desc: "Киркук уже давно является городом, разделенным между курдами, арабами и турками. С ростом сепаратистских настроений курдов в регионе, нам необходимо обеспечить иммиграцию большого количества арабов в Киркук, чтобы превратить его в арабский город."
 IRQ_force_civil_service: "Гражданская служба"
 IRQ_force_civil_service_desc: "Курдские сепаратисты уже давно создают проблемы для страны, поэтому вместо того, чтобы просто посадить их в тюрьму, заставить их работать на Ирак было бы гораздо полезнее и гораздо более ироничным наказанием."
 IRQ_countering_operation_ezrah: "Противодействие операции Эзра"
 IRQ_countering_operation_ezrah_desc: "Операции "Эзра" и "Нехемия" направлены на то, чтобы перевести всех иракских евреев в Израиль. Мы не можем позволить им сделать это, так как это усилит их и ослабит нас."
 IRQ_financial_gains_from_AJJDC: "Финансовые поступления от «Джойнт»"
 IRQ_financial_gains_from_AJJDC_desc: "Операция по оказанию помощи иракским евреям в эмиграции в Израиль финансируется Американским еврейским объединенным распределительным комитетом. Однако, при грамотной финансовой работе, большая часть этих средств может быть направлена правительству вместо этого."
 IRQ_crackdown_on_airlift_operations: "Ограничение воздушных перевозок"
 IRQ_crackdown_on_airlift_operations_desc: "Многие из иракских евреев переправляются по воздуху, чтобы покинуть страну. Мы должны перехватить эти самолеты в рамках противодействия операции."
 IRQ_reverse_ban_on_jewish_emmigration: "Отмена запрета на еврейскую эмиграцию"
 IRQ_reverse_ban_on_jewish_emmigration_desc: "Из-за большого политического давления, оказываемого на нас американским, британским и израильским правительствами, в дополнение к предлагаемому экономическому эмбарго, отмена запрета на еврейскую эмиграцию в Израиль будет наилучшим вариантом действий."
 IRQ_mass_arrests: "Массовые аресты"
 IRQ_mass_arrests_desc: "Многие иракские евреи подозреваются в сионистской или коммунистической деятельности, поэтому мы должны арестовать и допросить этих предполагаемых шпионов. Потому что, в конце концов, лучше перестраховаться, чем потом жалеть."
 IRQ_iraqi_secret_services: "Иракские секретные службы"
 IRQ_iraqi_secret_services_desc: "Операция "Эзра" позволяет многим сионистским агентам проникать в страну и шпионить за нашим правительством. Мы должны создать секретную службу, чтобы выслеживать этих агентов."
 IRQ_denounce_israeli_spying_activities: "Осудить шпионскую деятельность Израиля"
 IRQ_denounce_israeli_spying_activities_desc: "Несмотря на наши усилия остановить въезд израильских шпионов в страну, они все еще остаются. Публичное разоблачение этих шпионов, безусловно, повредит репутации Израиля на мировой арене."
 IRQ_coronation_of_faisal_ii: "Коронация Фейсала II"
 IRQ_coronation_of_faisal_ii_desc: "Принц Абд аль-Алла, бывший наследный принц Хеджаза, правил Королевством Ирак в качестве регента после смерти своего племянника короля Гази I. Наконец-то молодой Фейсал, сын Гази, достиг совершеннолетия в соответствии с правилами конституции и может принять на себя управление страной. Принц-регент Абд аль-Аллах организовал пышную церемонию коронации в королевском дворце, где Фейсалу будет официально передано управление государством. Да здравствует Его Величество Фейсал II Божьей милостью и конституцией, король Ирака!"
 IRQ_the_journey_of_al_ayoubi: "Путешествие Аль-Айюби"
 IRQ_the_journey_of_al_ayoubi_desc: "Али Джаудат Аль-Айуби верно служил Хашимитской монархии со времен правления короля Фейсала I в Сирии. Близкий советник и доверенное лицо принца-регента и короля Фейсала II, он был назначен с важной дипломатической миссией в Лондон для проведения предварительных переговоров по заключению Багдадского пакта."
 IRQ_founding_of_the_baghdad_pact: "Основание Багдадского пакта"
 IRQ_founding_of_the_baghdad_pact_desc: "После нескольких недель переговоров мы почти завершили работу над соглашением, которое станет известно как CENTO или Багдадский пакт. Это важный договор о безопасности, спонсором которого выступили Соединенные Штаты и в который войдут почти все западные страны Ближнего Востока и Великобритания. Мы официально присоединимся к тому, что называют НАТО Ближнего Востока, а Багдад станет его штаб-квартирой."
 IRQ_purge_soviet_influence: "Очистить советское влияние"
 IRQ_purge_soviet_influence_desc: "Советский Союз является ведущим спонсором коммунистических движений в нашей стране. Их влияние дестабилизирует нашу страну и является серьезной угрозой для монархии. Мы должны принять немедленные меры для устранения любого советского присутствия в нашей стране, хотя они, конечно, этого не оценят."
 IRQ_denounce_british_presence_in_the_suez_crisis: "Отрицание британского присутствия в Суэцком кризисе"
 IRQ_denounce_british_presence_in_the_suez_crisis_desc: "Несмотря на наш номинальный союз в рамках Багдадского пакта, отношения с британцами портятся уже много лет, с тех пор как Великобритания ушла из страны после Второй мировой войны. Их контроль над Суэцем дает им неоправданное влияние на все арабские страны, и мы должны четко обозначить свою позицию в отношении британской оккупации."
 IRQ_local_democratic_elections: "Местные демократические выборы"
 IRQ_local_democratic_elections_desc: "Пришло время новых выборов, однако на этот раз в местных округах и администрациях штатов. Хотя нам удалось сохранить жесткий контроль над национальным парламентом, чтобы не позволить антимонархическим настроениям набрать слишком большую силу, местные законодательные органы, с другой стороны, гораздо более независимы от нашего контроля. Наши консультанты ожидают, что антихашимитские партии и политики получат больше влияния на этих выборах благодаря этому."
 IRQ_crackdown_on_pachachi: "Подавление Пачачи"
 IRQ_crackdown_on_pachachi_desc: "Бывший премьер-министр Музахим аль-Пачачи уже много лет является ведущим голосом панарабизма в Ираке и поэтому часто вступает в конфликт с монархией. Многие в нашем правительстве оказывали давление на короля, чтобы он выслал его из страны, и хотя это было бы ударом по силе националистов, это, безусловно, разозлило бы многих его сторонников."
 IRQ_forcefully_remove_british_influence: "Насильственное устранение британского влияния"
 IRQ_forcefully_remove_british_influence_desc: "Британцы контролировали большую часть нашей политики с момента основания нашего Королевства. К счастью для нас, власть Великобритании в регионе ухудшилась, и король со своими советниками решил, что настало время полностью избавиться от британского господства."
 IRQ_establish_the_reconstruction_sector: "Создать сектор реконструкции"
 IRQ_establish_the_reconstruction_sector_desc: "В 1945 году курды под руководством Мустафы Барзани подняли восстание против нашего правительства. Хотя оно было быстро подавлено, а Барзани вместе со своими сторонниками был вынужден бежать в Советский Союз, оно, тем не менее, вызвало широкомасштабные разрушения в северных регионах Ирака. Несмотря на то, что восстание произошло много лет назад, регион до сих пор полностью не восстановлен, и новый король Фейсал II решил приступить к программе восстановления и использовать это как возможность для инвестиций и дальнейшего развития северного Ирака."
 IRQ_new_palaces: "Новые дворцы"
 IRQ_new_palaces_desc: "В честь коронации Фейсала II было построено несколько новых дворцов для короля и королевской семьи. Однако наряду с дворцами была отремонтирована и модернизирована местная инфраструктура и общины. Это привело к росту деловой и экономической активности в районах вокруг новых дворцов, что очень порадовало местное население."
 IRQ_vast_infastructure_project: "Масштабный инфраструктурный проект"
 IRQ_vast_infastructure_project_desc: "Когда-то Багдад считался эпицентром исламского мира, по значимости уступая лишь святым городам Мекке и Медине. Однако с тех пор, как он был разрушен монголами, он превратился в тень себя прежнего. Король Фейсал II предложил ряд широкомасштабных инфраструктурных проектов в городе и его окрестностях, чтобы помочь вернуть Багдаду былую славу."
 IRQ_work_with_aramco: "Работа с компанией Aramco"
 IRQ_work_with_aramco_desc: "Aramco - это государственная нефтяная компания Саудовской Аравии. Они зарекомендовали себя как способная корпорация благодаря нефтяному буму в Саудовской Аравии. Мы должны пригласить их с их опытом, чтобы они помогли разработать наши собственные нефтяные месторождения и превратить Ирак в следующую нефтяную сверхдержаву."
 IRQ_northern_dam_constructions: "Строительство северных плотин"
 IRQ_northern_dam_constructions_desc: "Реки Тигр и Евфрат считаются двумя самыми важными реками в истории человечества, с которыми соперничает только великий Нил. Именно между этими двумя реками зародились первые цивилизации человечества. В честь этой традиции мы должны инвестировать в инфраструктуру, чтобы использовать потенциал гидроэлектрической энергии, которую могут использовать эти две великие реки."
 IRQ_the_baghdad_international_fair: "Багдадская международная ярмарка"
 IRQ_the_baghdad_international_fair_desc: "Когда-то Багдад считался самым просвещенным городом в мире: ученые со всего исламского и даже христианского мира приезжали сюда, чтобы почерпнуть хотя бы намек на мудрость, хранящуюся в Багдаде. Мы должны снова сделать Багдад мировым центром науки и образования, проведение международной ярмарки и приглашение самых умных экспертов со всего мира для обсуждения и демонстрации своих исследований было бы хорошим первым шагом."
 IRQ_state_funded_programs: "Программы, финансируемые государством"
 IRQ_state_funded_programs_desc: "Наше правительство признает, что монархия не любима народом так, как должна быть. Для того чтобы доказать, что Хашимиты заботятся об интересах народа, мы должны расширить финансирование социальных программ и коммунальных услуг. Хотя наши финансовые консультанты ожидают, что это будет большой нагрузкой на бюджет, потенциальные политические и социальные выгоды намного перевесят любые денежные потери."
 IRQ_build_new_public_institutions: "Построить новые государственные учреждения"
 IRQ_build_new_public_institutions_desc: "В рамках наших усилий, направленных на то, чтобы расположить монархию к народу, мы должны построить новые школы, больницы, здания судов и любые другие общественные учреждения, чтобы показать народу Ирака, что его правительство является благосклонным."
 IRQ_establish_a_new_ministry: "Учредить новое министерство"
 IRQ_establish_a_new_ministry_desc: "Наше Королевство состоит из множества различных народов и этнических групп, что создает бюрократический кошмар для наших министров. Мы должны создать новые министерства, чтобы лучше справляться с многочисленными задачами, необходимыми для управления нашим государством. Это не только облегчит нагрузку на нынешних правительственных чиновников, но и поможет быстрее и лучше взаимодействовать с народом, что, несомненно, укрепит его расположение к монархии."
 IRQ_dissolute_the_national_congress_union_party: "Распустить партию Национальный конгресс союз"
 IRQ_dissolute_the_national_congress_union_party_desc: "Партия "Национальный союз конгресса" уже некоторое время является занозой в боку монархии. Они добивались все больших и больших ограничений власти короля и регентов до него. Пришло время разобраться с этой досадой и официально распустить ее, чтобы не позволить им вмешиваться в Богом данную обязанность короля править."
 IRQ_promote_arab_unity: "Продвижение арабского единства"
 IRQ_promote_arab_unity_desc: "Хотя многие панарабские националисты утверждают, что династия Хашимитов выступает против арабского единства, это не может быть дальше от истины. Именно Хашимиты при Хусейне ибн Хашеме и Фейсале бин Хусейне первыми добились объединения и независимости арабских стран от турок-османов. Династия Хашимитов - единственные законные правители объединенного арабского мира, и чтобы доказать это, мы должны продвигать панарабское движение под руководством Хашимитов внутри нашей страны."
 IRQ_formalise_arab_federation: "Формализация арабской федерации"
 IRQ_formalise_arab_federation_desc: "Выполняя свое обещание о единстве арабов, король Фейсал II и иракское правительство ведут переговоры с двоюродным братом Фейсала королем Иордании Хусейном о создании арабской федерации между двумя королевствами. Создание такой федерации докажет арабскому миру, что Хашимиты стремятся работать вместе, чтобы объединить всех арабов под одним флагом."
 IRQ_inspire_revolt_in_hejaz: "Вдохновить восстание в Хеджазе"
 IRQ_inspire_revolt_in_hejaz_desc: "Вероломный Дом Сауда в 1920-х годах узурпировал хашимитский монарх король Хусейн и наследный принц, наш бывший регент принц 'Абд аль-Аллах, с их законных тронов. Пришло время свергнуть незаконную династию Саудов и вернуть Хашимитам не только их трон, но и их законное господство над всей Аравией."
 IRQ_hashemite_reentry_into_syria: "Возвращение Хашимитов в Сирию"
 IRQ_hashemite_reentry_into_syria_desc: "Поскольку сирийцы увидели преимущества монархии под руководством Хашимитов, они пригласили бывшего принца-регента Абд аль-Аллаха стать королем реформированного Королевства Сирия. Мы должны официально пригласить монарха-регента присоединиться к своим родственникам-хашимитам в рамках Арабской Федерации и сделать следующий шаг к арабскому единству."
 IRQ_milk_new_demands: "Новые требования к молоку"
 IRQ_milk_new_demands_desc: "Нефть - это черное золото пустынь, и в последние годы с коммерциализацией автомобилей и быстрой моторизацией армий спрос на нее резко возрос. Чтобы удовлетворить этот новый спрос, мы должны развивать и расширять наши нефтяные месторождения и операции по добыче нефти."
 IRQ_creation_of_a_large_public_sector: "Создание крупного государственного сектора"
 IRQ_creation_of_a_large_public_sector_desc: "Чтобы экономика действительно процветала, наряду с частным сектором должен существовать динамичный и прочный государственный сектор, чтобы государство могло удовлетворять собственные потребности, не полагаясь на частные компании. Это также обеспечит большое количество удобных и надежных государственных рабочих мест, что принесет большую пользу низшим классам, которым в противном случае было бы сложнее найти работу в частном секторе."
 IRQ_oil_interest: "Нефтяные интересы"
 IRQ_oil_interest_desc: "The success of our previous campaign of expanding our oil extraction operations has begun to attract investors and entrepreneurs who seek to profit from new found oil deposits. We should of course negotiate the best deal for the government and allow these noble businessmen to produce even more oil for us."
 IRQ_higher_oil_production: "Увеличение добычи нефти"
 IRQ_higher_oil_production_desc: "Хорошего никогда не бывает слишком много, и, следуя этому принципу, король Фейсал II распорядился о строительстве еще большего количества нефтеперерабатывающих заводов и буровых установок для эксплуатации огромных богатств наших пустынь."
 IRQ_silo_construction: "Строительство силосов"
 IRQ_silo_construction_desc: "С ростом добычи нефти мы столкнулись с неизбежной проблемой - хранением нефти. Вся эта нефть пропадет впустую, если после ее добычи ее некуда будет девать. Мы должны инвестировать в создание дополнительных хранилищ и запасов топлива, чтобы быть уверенными, что мы получим все до последней капли."
 IRQ_increase_oil_prices: "Повышение цен на нефть"
 IRQ_increase_oil_prices_desc: "If you go back far enough eventually you will see that money indeed does grow on trees, however oil does not and as such the price for oil should reflect its rarity and difficulty to extract. So far we have been generous in our pricing, but this practice should come to an end. King Faisal II has come up with a proposal to raise oil prices and use the revenue generated from this to construct new financial districts in Baghdad and expand the service sector. Such a plan would surely reap great financial benefits and the government is eager to enact the proposal."
 IRQ_increase_electric_consumption: "Увеличение потребления электроэнергии"
 IRQ_increase_electric_consumption_desc: "Нефть является основным компонентом многих нефтехимических продуктов, эти нефтехимические продукты имеют множество применений, но одним из самых важных является производство электроэнергии. В связи с недавним резким ростом добычи нефти никогда еще не было такой возможности значительно увеличить потребление электроэнергии в нашей стране путем строительства большего количества электростанций, и поэтому мы должны немедленно отдать приказ о строительстве этих электростанций."
 IRQ_introduce_american_oil_companies: "Представить американские нефтяные компании"
 IRQ_introduce_american_oil_companies_desc: "Для того чтобы превратить нефть во что-то, требуется долгий и сложный процесс. Американцы занимаются этим бизнесом по переработке нефти уже несколько десятилетий и достигли больших успехов. Приглашая американские нефтяные компании перерабатывать наши огромные запасы сырой нефти на основе выгодных контрактов, мы можем использовать их опыт, чтобы этот процесс проходил гладко и эффективно."
 IRQ_provide_capital_to_IPC: "Предоставление капитала ИНК"
 IRQ_provide_capital_to_IPC_desc: "Иракская нефтяная компания - это крупная корпорация, связанная со многими нашими нефтяными скважинами. Мы должны убедиться, что у них есть необходимый капитал для продолжения и даже расширения производства."
 IRQ_increase_manufactured_goods_development: "Увеличение развития производства промышленных товаров"
 IRQ_increase_manufactured_goods_development_desc: "Производство стало основным показателем развития страны. Чтобы показать миру, что мы также являемся современной и актуальной страной, мы должны изучить промышленные методы более развитых стран и перенять их как свои собственные."
 IRQ_agricultural_hub: "Сельскохозяйственный узел"
 IRQ_agricultural_hub_desc: "Ирак находится в самом сердце плодородного полумесяца, и сельское хозяйство остается жизненно важным аспектом нашей экономики. Мы должны расширить наши сельскохозяйственные операции и превратить нашу страну в житницу арабского мира."
 IRQ_state_provided_tools: "Инструменты, предоставляемые государством"
 IRQ_state_provided_tools_desc: "Чтобы обеспечить каждому фермеру доступ к современному качественному оборудованию, мы должны предпринять программу обеспечения инструментами тех, кто не может себе этого позволить."
 IRQ_green_revolution: "Зеленая революция"
 IRQ_green_revolution_desc: "С внедрением современных методов ведения сельского хозяйства это привело к новой "зеленой революции" и буму в производстве продуктов питания. Мы должны и дальше инвестировать в сельское хозяйство и поощрять эту тенденцию."
 IRQ_modern_irrigation: "Современная ирригация"
 IRQ_modern_irrigation_desc: "Вода является наиболее фундаментальным строительным блоком для жизни, чтобы обеспечить каждому доступ к пресной воде для питья и снабжения своих ферм, мы должны модернизировать и расширить нашу нынешнюю ирригационную систему."
 IRQ_import_fertilizers: "Импорт удобрений"
 IRQ_import_fertilizers_desc: "Наряду с солнечным светом и водой удобрения являются следующим важным ингредиентом для любой фермы. Западные страны разработали более качественные и лучшие удобрения, чем те, которые используются в нашей стране, нам следует импортировать некоторые из их удобрений и попытаться воспроизвести их для дальнейшего сельскохозяйственного производства."
 IRQ_boost_grain_production: "Увеличение производства зерна"
 IRQ_boost_grain_production_desc: "Зерно является основной продовольственной культурой для большей части мира, империи поднимались и падали благодаря доступу к зерну. Мы должны инвестировать в сельскохозяйственные комплексы, которые сосредоточены вокруг зерна, и обеспечить всем доступ к хлебу."
 IRQ_decrease_communist_insurgency: "Уменьшение коммунистического повстанческого движения"
 IRQ_decrease_communist_insurgency_desc: "В разгар холодной войны многие в нашей стране, выступающие против Хашимитской монархии, обратились за поддержкой к Москве. Коммунистическая мысль начинает распространяться среди нашего населения, и случаи насилия становятся все более частыми. Мы должны пресечь это в зародыше и подавить коммунистическое движение, пока оно еще находится в зачаточном состоянии."
 IRQ_infastructure_expedition: "Экспедиция по инфраструктуре"
 IRQ_infastructure_expedition_desc: "Ирак по-прежнему остается в основном сельской и пустынной страной благодаря палящим жарким пустыням. Для содействия торговле и развитию мы должны приступить к реализации крупного инфраструктурного проекта по обновлению и расширению дорог, железных дорог, водных путей и всей инфраструктуры, необходимой для безопасного и комфортного передвижения по пустыне."
 IRQ_rural_infastructure: "Сельская инфраструктура"
 IRQ_rural_infastructure_desc: "Большая часть нашего населения по-прежнему проживает в небольших городах и изолированных деревнях. Для повышения благосостояния наших граждан и экономического роста сельских общин мы должны улучшить инфраструктуру в этих сельских районах."
 IRQ_invest_agrarian_schools: "Инвестируйте в аграрные школы"
 IRQ_invest_agrarian_schools_desc: "Если мы хотим иметь наиболее эффективных и высококачественных фермеров, мы должны инвестировать в образование, сосредоточенное на обучении технике и науке сельского хозяйства."
 IRQ_encourage_a_sizable_household: "Поощряйте крупное домашнее хозяйство"
 IRQ_encourage_a_sizable_household_desc: "Во многих западных странах так называемая нуклеарная семья считается идеальной семьей с двумя родителями и двумя детьми. Однако такой образ жизни приведет к стагнации населения, вместо этого мы должны двигаться в противоположном направлении и поощрять семьи иметь как можно больше детей и формировать крепкие братские связи со своей расширенной семьей."
 IRQ_urban_investments: "Городские инвестиции"
 IRQ_urban_investments_desc: "Города являются местом, где происходит основная экономическая активность, и поэтому требуют больших инвестиций для своего развития, но вознаграждение за такие инвестиции астрономическое и более чем достойное."
 IRQ_rebrand_iraqi_banks: "Ребрендинг иракских банков"
 IRQ_rebrand_iraqi_banks_desc: "Иракские банки не так престижны и известны, как крупные банки на Западе, мы должны провести кампанию по ребрендингу, чтобы сделать иракские банки более привлекательными и дружелюбными."
 IRQ_encourage_transport: "Поощрять развитие транспорта"
 IRQ_encourage_transport_desc: "Сильная экономика требует, чтобы все места в стране были интегрированы и связаны между собой. Наши автомобильные и железные дороги развиты крайне слабо, и если мы хотим иметь крупную и сильную экономику, нам необходимо улучшить транспортное сообщение по всей стране."
 IRQ_the_kurdish_question: "Курдский вопрос"
 IRQ_the_kurdish_question_desc: "У курдов на севере страны всегда были в лучшем случае натянутые отношения с центральным правительством. В 1945 году курды подняли восстание, и хотя нам удалось их разгромить, среди курдского населения все еще сохраняется недовольство, и оно готово нанести удар в любой момент слабости. У правительства есть два пути: мы можем либо улучшить благосостояние и качество жизни курдов и интегрировать их в нашу страну как равноправных граждан. Второй путь - это решение, которое часто использовалось в прошлом и которое доказало свою эффективность; это репрессии, путем подавления курдов мы можем гарантировать, что они будут слишком слабы и напуганы, чтобы когда-либо представлять угрозу для нашего правительства."
 IRQ_improve_kurdish_opinion: "Улучшить отношение с курдами"
 IRQ_improve_kurdish_opinion_desc: "С момента основания Королевства к курдам относились как к гражданам второго сорта и часто пренебрегали ими со стороны правительства. Мы должны встретиться с их лидерами и обратиться к народу, гарантируя автономию и равные права, чтобы улучшить их мнение о нашем правительстве и стабилизировать регион."
 IRQ_their_opinion_is_irrelevant: "Их мнение не имеет значения"
 IRQ_their_opinion_is_irrelevant_desc: "Курды снова и снова доказывали свою нелояльность правительству, они являются лишь помехой для страны, и поэтому мы должны принимать только те меры, которые необходимы для того, чтобы они больше не восставали."
 IRQ_appoint_a_prince_of_terror: "Назначить принца террора"
 IRQ_appoint_a_prince_of_terror_desc: "Самый проверенный и верный метод прекратить восстание до того, как оно начнется, - это террор. Назначив чиновников с... менее чем благотворительной репутацией, мы можем гарантировать, что курдский народ будет слишком напуган, чтобы даже подумать о восстании против правительства."
 IRQ_lower_autonomy: "Низкая автономия"
 IRQ_lower_autonomy_desc: "Курдам всегда предоставлялся определенный уровень автономии и свободы от центрального правительства. Однако после восстания 45 года они потеряли всякое право требовать больше прав, чем другие граждане Ирака, поэтому предыдущие соглашения о предоставлении автономии должны быть аннулированы, а законы отменены."
 IRQ_reform_the_armed_forces: "Реформировать вооруженные силы"
 IRQ_reform_the_armed_forces_desc: "Наши вооруженные силы были унижены во время войны с Израилем в 1948 году, мы должны приступить к программе реформ и модернизации, чтобы улучшить наши военные возможности и гарантировать, что следующая война с Израилем закончится нашей победой."
 IRQ_advance_the_land_forces: "Продвижение сухопутных войск"
 IRQ_advance_the_land_forces_desc: ""
 IRQ_review_military_budget: "Обзор военного бюджета"
 IRQ_review_military_budget_desc: "Всем армиям нужны деньги и оборудование для функционирования, мы должны пересмотреть количество денег и ресурсов, выделяемых в настоящее время на военные цели, и обеспечить наши вооруженные силы всем необходимым."
 IRQ_improve_camp_rustamiyah: "Благоустройство лагеря Рустамия"
 IRQ_improve_camp_rustamiyah_desc: "Лагерь Рустамия является основным военным комплексом для нашей страны, мы должны улучшить и обновить его и поощрять растущих производителей оружия вокруг лагеря."
 IRQ_expand_military_production: "Расширение военного производства"
 IRQ_expand_military_production_desc: "Производство так же важно для достижения победы, как и боеспособность наших солдат. К сожалению, наши нынешние возможности военного производства менее чем достаточны, поэтому мы должны инвестировать в расширение нашей военной промышленности."
 IRQ_heavy_artillery: "Тяжелая артиллерия"
 IRQ_heavy_artillery_desc: "Вместо того, чтобы наши парни умирали за нашу страну, мы должны заставить врага умирать за свою, лучший способ сделать это - разнести их в щепки с максимально возможного расстояния, и поэтому мы должны инвестировать в улучшение возможностей нашей артиллерии."
 IRQ_invest_in_licenses: "Инвестиции в лицензии"
 IRQ_invest_in_licenses_desc: "Наша отечественная оружейная промышленность недостаточна для удовлетворения требований современной войны, вместо этого мы должны стремиться к производству оружия более мощных стран и обеспечить оснащение наших производств для создания иностранных образцов."
 IRQ_importation_of_t_55: "Импорт Т-55"
 IRQ_importation_of_t_55_desc: "Несмотря на наше идеологическое неприятие, Советский Союз является одним из крупнейших производителей танков и военной техники в мире. Мы должны держать язык за зубами и импортировать советские танки для развития нашего бронетанкового корпуса."
 IRQ_airforce_development: "Развитие ВВС"
 IRQ_airforce_development_desc: "ВВС - молодой, но все более важный сектор наших вооруженных сил. Для обеспечения полной победы на поле боя нам необходимо развивать наш растущий воздушный потенциал."
 IRQ_flying_shells: "Летающие снаряды"
 IRQ_flying_shells_desc: "Бомбить врага с неба гораздо безопаснее, чем сражаться с ним на земле, мы должны инвестировать в совершенствование наших бомбардировщиков и взрывчатых веществ для достижения этого более безопасного результата."
 IRQ_replace_old_planes: "Замена старых самолетов"
 IRQ_replace_old_planes_desc: "Не имеет значения, сколько у нас самолетов, если все они устарели и не способны противостоять противнику. Мы должны покупать самолеты у британцев, чтобы заменить наши старые самолеты, которые больше вредят, чем помогают в бою."
 IRQ_import_vampire_planes: "Импорт вампиров"
 IRQ_import_vampire_planes_desc: "Превосходство в воздухе важно для достижения победы на земле, у британцев есть большой запас самолетов, которые они готовы продать нам, чтобы помочь модернизировать наши военно-воздушные силы."
 IRQ_the_british_doctrine: "Британская доктрина"
 IRQ_the_british_doctrine_desc: "Британцы смогли отбить мощь немецкой военной машины благодаря своей способности побеждать их в воздухе. Мы должны изучить тактику, использованную британцами для обеспечения превосходства в воздухе, и взять ее на вооружение."
 IRQ_aviation_manufacturing: "Авиационное производство"
 IRQ_aviation_manufacturing_desc: "Производство самолетов и всех необходимых компонентов является сложным процессом, требующим иных методов производства, чем те, которые используются для создания танков и кораблей, поэтому мы должны построить новые комплексы, предназначенные исключительно для создания наших военно-воздушных сил."
 IRQ_raf_cooperation: "Сотрудничество РАФ"
 IRQ_raf_cooperation_desc: "Наряду с импортом британских самолетов мы должны работать с офицерами британских ВВС, чтобы повысить компетентность и компетентность наших собственных ВВС."
 IRQ_increase_airports: "Увеличение аэропортов"
 IRQ_increase_airports_desc: "Подобно тому, как корабельным самолетам необходимо место, откуда они могут взлететь и куда вернуться, в настоящее время у нас нет достаточного количества аэропортов, чтобы поддерживать наши растущие военно-воздушные силы, поэтому был разработан план строительства новых современных аэропортов."
 IRQ_improve_raf_bases: "Улучшить базы РАФ"
 IRQ_improve_raf_bases_desc: "Во время Второй мировой войны РАФ располагала несколькими стратегическими базами на территории нашей страны, и, реквизировав эти пустующие базы и улучшив их, мы сможем использовать их в своих целях."
 IRQ_maritime_assistance: "Морская помощь"
 IRQ_maritime_assistance_desc: "Хотя наша береговая линия может быть небольшой, это не умаляет важности нашего военно-морского флота и защиты нашей торговли и судоходства через Персидский залив."
 IRQ_sub_efforts: "Дополнительные усилия"
 IRQ_sub_efforts_desc: "Подводные лодки являются одним из самых полезных и универсальных кораблей в арсенале флота, мы должны изучить современные конструкции подводных лодок, чтобы убедиться, что у нас есть лучшие и самые мощные корабли."
 IRQ_increase_shipping_in_basrah: "Увеличить объем грузоперевозок в Басре"
 IRQ_increase_shipping_in_basrah_desc: "Басра - наш единственный крупный порт, но один из самых оживленных в Персидском заливе. Расширяя наши порты и военно-морские базы в городе, мы можем еще больше увеличить судоходство и наш военно-морской потенциал."
 IRQ_baban_family: "Семья Бабан"
 IRQ_baban_family_desc: "Семья Бабан - это выдающаяся курдская семья, обладающая невероятным влиянием среди курдского народа. Если работать с лидерами семьи Бабан и привлечь их на нашу сторону, это поможет стабилизировать ситуацию в регионе. Однако для этого потребуется большой политический капитал и предоставление особых услуг и преференций."
 IRQ_kurdish_urbanization_projects: "Курдские проекты урбанизации"
 IRQ_kurdish_urbanization_projects_desc: "Подавляющее большинство курдов по-прежнему живет в изолированных деревнях и племенных поселениях. Мы можем улучшить жизнь курдского населения, взяв на себя обязательства по реализации проектов массовой урбанизации и ввоза современных технологий и товаров."
 IRQ_replace_the_incompetent_officals: "Заменить некомпетентных чиновников"
 IRQ_replace_the_incompetent_officals_desc: "Многие из наших чиновников в северных регионах коррумпированы и некомпетентны, что приводит к постоянному недовольству и гневу по отношению к правительству. Заменив этих чиновников, мы сможем улучшить мнение курдов о нас и обеспечить выполнение государственной политики."
 IRQ_push_against_leftist_parties: "Противодействие левым партиям"
 IRQ_push_against_leftist_parties_desc: "Левые партии в Ираке получают все большую поддержку среди городских мыслителей и сельских фермеров из-за низких условий жизни, однако эти партии очень антимонархичны и представляют угрозу для нашего короля и должны быть подавлены."
 IRQ_promote_the_Constitutional_Charter: "Продвигать Конституционную хартию"
 IRQ_promote_the_Constitutional_Charter_desc: "Конституционная хартия - следующий шаг для создания более совершенной политической системы."
 IRQ_protection_of_the_workers: "Защита работников"
 IRQ_protection_of_the_workers_desc: "Рабочие Ирака уже давно эксплуатируются богатыми землевладельцами, что заставляет многих из них постоянно бастовать. Защита прав этих рабочих не только сделает их более счастливыми и менее мятежными, но и повысит производительность труда."
 IRQ_encourage_various_industries: "Поощрение различных отраслей промышленности"
 IRQ_encourage_various_industries_desc: "Недавнее обнаружение большого количества ресурсов и полезных ископаемых в стране привело к образованию множества новых предприятий и отраслей промышленности для эксплуатации этих ресурсов. Поддержка этих начинаний будет способствовать их дальнейшему процветанию, что принесет большую пользу экономике страны."
 IRQ_organize_the_youth: "Организовать молодежь"
 IRQ_organize_the_youth_desc: "С ростом национализма в нашей стране очевидно, что многие люди готовы умереть, сражаясь за нее. Мы можем использовать это в наших интересах, поощряя молодых националистов записываться в армию."
 IRQ_call_on_suwaidi_to_be_prime_minister: "Призыв к Сувайди"
 IRQ_call_on_suwaidi_to_be_prime_minister_desc: "Тауфик аль-Сувайди - старый и опытный политик, который верит в представительную демократию и соответствует западным идеалам. Несмотря на его антихашимитскую позицию, Ираку по-прежнему нужен сильный лидер, способный провести демократические реформы, в которых нуждается наше население. Однако его прозападная позиция может вызвать споры среди населения."
 IRQ_social_stability: "Социальная стабильность"
 IRQ_social_stability_desc: "Мы наконец-то достигли хотя бы некоторого уровня социальной стабильности, популярность короля находится на рекордно высоком уровне, а качество жизни значительно улучшилось для рядовых граждан. Народ теперь принимает и даже поддерживает правление Хашимитской монархии, а призывы к ее свержению существуют только на политических задворках."
 IRQ_reaction_to_the_abadan_crisis: "Реакция на Абаданский кризис"
 IRQ_reaction_to_the_abadan_crisis_desc: "Новое правительство Ирана решило национализировать нефтедобычу в стране и изгнать западные компании. Британцы возмущены этим решением, называя его воровством и преступным деянием. В городе Абадан напряженность достигла пика, и город стал местом противостояния между британцами и иранцами. Наше мнение, как ближайшего соседа Ирана, связанного с британскими нефтяными интересами, может изменить баланс в этом напряженном противостоянии. Король Фейсал II и правительство до сих пор хранили молчание, но пришло время выступить с официальной реакцией на кризис."
 IRQ_secure_our_convoys: "Обеспечить безопасность наших конвоев"
 IRQ_secure_our_convoys_desc: "Мы зависим от экспорта нефти и других ресурсов из нашей страны, чтобы обеспечить безопасность этого ценного сектора нашей экономики, мы должны изучить современные конструкции эскорта и фрегатов, чтобы они могли защищать наши конвои и судоходные пути."
 IRQ_encourage_kurdish_science: "Поощрение курдской науки"
 IRQ_encourage_kurdish_science_desc: "Школы с преподаванием на курдском языке практически отсутствуют, для повышения грамотности и образования курдского населения мы должны отказаться от попыток навязать курдскому народу арабский язык и вместо этого поощрять преподавание на курдском языке, позволяя курдам учиться на своем родном языке."
 IRQ_issue_improved: "Улучшение ситуации с курдами"
 IRQ_issue_improved_desc: "Нет никакой разницы между курдом и арабом, оба они объединены общей верностью королю. Поэтому мы должны расширить наши социальные и гражданские права, которыми пользуется арабское население, и распространить их на курдов. Это также позволит решить многие из тех проблем, против которых курдские повстанцы взялись за оружие, и, хотя это не решит полностью курдский конфликт, это заставит значительное число повстанцев и сочувствующих отказаться от поддержки повстанцев."
 IRQ_increase_military_presence_in_iraqi_kurdistan: "Увеличить военное присутствие"
 IRQ_increase_military_presence_in_iraqi_kurdistan_desc: "Курды представляют собой постоянную угрозу для чиновников и деятельности в северных регионах. Усиливая военное присутствие и меры безопасности, мы можем гарантировать, что в любой момент, когда курдские повстанцы решат напасть на наших граждан, они будут встречены подавляющей силой."
 IRQ_stomp_out_further_resistance: "Подавить дальнейшее сопротивление"
 IRQ_stomp_out_further_resistance_desc: "Благодаря доблестным усилиям наших храбрых офицеров безопасности и большим инвестициям в меры безопасности мы разбиваем все больше и больше повстанческих ячеек, и частота нападений резко сократилась."
