l_russian:
  
 iran_political.100.d: "Долгое время выступавший за исламское правление в Иране, Навваб Сефеви сформировал Фадаиян-е ислам, чтобы подтолкнуть к усилению фундаменталистских реформ в стране. Правительство, находящееся у власти, наконец-то устанет от его выходок после покушения на премьер-министра генерала Фазлоллу Захеди. Сефеви был казнен государственными властями вместе с тремя другими союзниками.\Казнь знаменует собой мрачный день для исламских фундаменталистов в Иране, поскольку становится ясно, что светская политика должна остаться в Иране."
 iran_political.500.d: "Военный суд приговорил бывшего премьер-министра Ирана Мохаммеда Моссадыка к смертной казни за его изменнические преступления против правительства и народа Ирана. Вскоре после вынесения приговора расстрельная команда привела приговор в исполнение. Моссадык якобы сделал заявление о том, что его действия были совершены во имя свободы и чести иранского народа, прежде чем быть казненным. Противники покойного премьер - министра, несомненно, обрадуются его смерти. Его способность мобилизовать народную поддержку и политическое влияние делала его мощной угрозой для своих противников. Для его сторонников и союзников будет великое отчаяние по поводу его кончины. Однако до Тегерана уже доходят слухи о том, что его сеть политических союзников, скорее всего, попытается продолжить его усилия по демократизации Ирана и восстановлению его национальной чести."
 iran_political.1301.d: "После провала операции "Аякс" обострилась напряженность между режимом Мосаддыка и Тудехом. Ожесточенное сопротивление Туде во время Аякса вдохновило многих на вступление в партию, увеличив их ряды до уровня большинства в стране. Опасаясь очередного переворота, Мосаддык предпримет попытку подавления партии. Вооруженная полиция попытается арестовать видные высокопоставленные силы внутри Тудехов, включая членов Пятидесяти трех. Только объединив партию, Тегеран будет наводнен вооруженными гражданскими лицами и военизированными формированиями. Через два дня Мосаддык должен был уйти в отставку и бежать в Турцию. После ухода прежнего руководства и взятия Тегерана была провозглашена Социалистическая Республика Иран. Без внутренней оппозиции этот шаг укрепил власть партии Туде.\Ниранцы по всей стране празднуют победу, широко проводя фестивали в поддержку этого движения. Исламские фундаменталисты продолжают выступать против Туде, но им не хватает сплоченности или народной поддержки, чтобы по-настоящему бросить вызов новому режиму. Для Запада то, что началось как планы по экономии нефтяных прибылей, привело к тому, что на его месте появился коммунистический Иран."
 iran_political.1298.d: "Некогда культовый монарх Ирана, которого когда-то приветствовали радостными криками, когда он двигался по улицам Тегерана, теперь насмехался над толпой, гнилые фрукты загораживали охраняемый конвой, в котором он находился. Конвой быстро двинулся в сторону Верховного суда Тегерана. К Мохаммеду Резе Пехлеви присоединяется его семья, Шабан Джафари, Фазлолла Захеди и Нематолла Нассири, все они находятся под судом за государственную измену. За пределами высокого суда сотни протестующих Туде призывают к смертной казни для всех причастных. Как суд решит судьбу ныне предателей?"
 iran_political.1299.d: "Демонтаж бывшей монархии продолжается в Тегеране и сегодня. Бывшие генералы и высшие советники шаха были недавно судимы и осуждены по обвинениям, связанным с коррупцией и государственной изменой. Эти процессы называются Тегеранскими. Обвинения в измене исходят от провалившегося контрсобытия, предпринятого для восстановления власти шаха. Многие из осужденных приговорены к смертной казни или длительным срокам тюремного заключения. Шах остается за границей в изгнании и вряд ли вернется, особенно с таким количеством его сторонников, которые теперь удалены. Соединенные Штаты и их союзники, которых обвиняют в поддержке контркупа, внимательно следят за судебными процессами, поскольку растет опасение, что новый режим поворачивается к коммунизму."
 iran_political.1300.d: "Напряженное судебное заседание Верховного суда Тегерана было окончательно решено. Те, кто участвовал в перевороте, были приговорены к смертной казни. У здания суда сторонники Туде празднуют это заявление, называя его важным шагом к концу буржуазного правления в Иране. Вскоре после объявления заговорщиков вывели за 15 миль от Тегерана и расстреляли. Более 280 заговорщиков были казнены, включая всю династию Пехлеви.Конец эпохи ударил по Ирану, как тысячи лет монархического влияния приходит к концу. Это событие пошлет ударную волну по будущему Ирана на многие поколения."
 tudeh.1.d: "Верховный суд Тегерана примет решение. В течение 48 часов Пехлеви и многочисленные их сообщники должны быть изгнаны из страны, чтобы никогда не возвращаться. Когда Мохаммад Реза покидал зал суда, агрессивные протестующие бросали камни в него и его семью. Это будет его последнее воспоминание об Иране, так как он быстро был лишен гражданства и депортирован в Саудовскую Аравию, откуда переедет в Соединенные Штаты. Бывший монарх отрицал любые интервью в средствах массовой информации и просил, чтобы люди уважали частную жизнь его и его семей.Конец эпохи ударил по Ирану, как тысячи лет монархического влияния приходит к концу. Это событие пошлет ударную волну по будущему Ирана на многие поколения."
 iran_political.1100.d: "После нескольких месяцев размышлений Мохаммад Реза Шах объявил о своем разводе с королевой Сорайей из-за ее бесплодия, чтобы произвести на свет наследника. Его единственный ребенок женится на Ардешире Захеди, враге королевской семьи. С этими словами он осудил свою жену и дочь и снова женился на Фарахе Пехлеви. Многие считали все это испытание порочным и морально неправильным, другие считали его простительным из-за необходимости иметь наследника. Так или иначе, королевский развод вызвал новые споры в Иране"
 phi_events.1.d: "Ужасная новость обрушилась сегодня на Манилу, когда бывший филиппинский сенатор Бениньо"Ниной" Акино-младший был убит на летном поле международного аэропорта Манилы. Убежденный критик президента Фердинанда Маркоса, сенатор Акино недавно прибыл в Манилу из своего добровольного изгнания из Соединенных Штатов, избежав опасностей и того, что было бы экстремальными пытками и потенциальной смертью. Прибыв в Манилу, правительственные солдаты ждали его прибытия, арестовав в процессе. Однако при выходе из самолета раздались выстрелы, и Ниной Акино был найден мертвым на летном поле. Следствие пришло к выводу, что убийца-коммунист по имени Роландо Гальман убил Акино, но ходят слухи, что Гальман был просто козлом отпущения и что убийство было заказано администрацией Маркоса. Тем не менее тысячи филиппинцев оплакивали смерть Ниноя Акино, и призывы к отставке режима Маркоса звучат все громче. Наблюдатели отмечают, что это событие может стать катализатором того, что станет революцией и свержением режима Маркоса, но пока рано строить догадки."
  
 AJAX.101.d: "Национализация нефти в Иране режимом Мосаддыка вызвала негодование в Соединенном Королевстве и Соединенных Штатах. Решив вернуть свое влияние на Иран, ЦРУ начало контактировать с шахом, главарями банд и высокопоставленными военными чиновниками, чтобы организовать переворот. План должен был сработать, как только Мосаддык услышит о готовящемся перевороте, арестовав главаря Шайбана Джафари до того, как план мог быть начат. С утечкой информации от Тудехов и Джафари иранская полиция арестует королевскую семью Пехлеви прямо перед тем, как они отправятся в свой"отпуск" в Северные горы Ирана. Без сильного руководства со стороны Пехлеви и Джафари Туде и правительственные силы легко пресекли бы любые попытки переворота. Арестованы сотни предполагаемых организаторов и иностранных агентов.Что теперь будет с Ираном-загадка. Монархическое и западное влияние было устранено, но вопрос о том, как режим Мосаддыка и партия Туде отреагируют на переворот, может определить судьбу нации. Назревает ли уже новая борьба за власть?"
 AJAX.105.d: "Быстро после провала операции Ajax оставшаяся неразбериха будет решена. Туде наберут силу благодаря своим впечатляющим усилиям по подавлению переворота, что создаст трения между режимом Мосаддыка и коммунистами почти сразу после испытания. Вместо того, чтобы заниматься ситуацией с большим конфликтом, обе стороны быстро увидят важность обсуждения и быстро возникнет официальная встреча между лидерами обеих фракций. Несмотря на различия во мнениях по многим вопросам, оба показали силу, которую они имеют, работая вместе. С этим были заключены соглашения, чтобы сохранить мир.Республика Иран при Мосаддыке остается у власти, даже несмотря на силу внутренних сил вокруг нее. Молодая демократия столкнулась со своей самой большой угрозой, оказав сопротивление Западу и одержав победу."
