l_russian:
 make_puppet_button_TT: "Создать марионетка\nДелает целевую нацию марионеткой, но также дестабилизирует их на 25% и ухудшает наши отношения с соседями нашей новой марионетки."
 trade_agreement_button_TT: "Двустороннее торговое соглашение\nСнижение торговых издержек на 50% между обеими странами."
 coup_button_TT: "Экономические инвестиции\nУвеличивают экономический рост в целевой стране благодаря национальному духу."
 manipulate_politics_button_TT: "Влияние на политику\nУвеличение популярности вашей партии на 2% в целевой стране."
 target_other_button_TT: "Военный доступ\nДает нам военный доступ и права стыковки с целевой нацией."
 aid_military_button_TT: "Оказать военную помощь\nОказывает военную помощь целевой нации через национальный дух."
 influence_action_button_TT: "Начало влияния на cnhfye\nУвеличивает наше влияние на целевую нацию на 50 пунктов."
 economic_exploitation_button_TT: "Экономическая эксплуатация\nПозволяет нам использовать часть промышленности целевой страны и повышает эффективность торговли за счет ухудшения отношений с соседями."
  
 INF_COUP_DESC: "Стоит 750 политической власти, требует более 50% влияния и 75 проекции силы. Это дорогостоящее действие позволяет заменить всё  правительство страны. Это требует серьезного планирования и проникновения и, как таковое, свяжет огромную часть международного влияния и ресурсов страны, чтобы собирать информацию в массовом масштабе, перемещать оружие, планировать атаки внутри страны и делать все это вне поля зрения национальных политиков и их внутренних/внешних разведывательных органов. Если этот акт не увенчается успехом, вряд ли сама страна когда-либо снова будет иметь дело с нами, и международное сообщество вряд ли сможет доверять нам."
 INF_DEFENSE_DESC: "Стоит 10 очков проекции силы и не менее 50% влияния на цель. Оборонительные пакты являются гарантией того, что каждая нация встанет на защиту друг друга во время войны. Используя благоприятное влияние в стране, оборонительный пакт может принести плоды. Даже если у страны неблагоприятные отношения с нами, влияние и ситуационное давление заставят их согласиться, поскольку альтернатива будет неблагоприятной."
 INF_TRADE_DESC: "Стоит 500 политической власти, 10 очков проекции силы и требует не менее 34% влияния на цель. Соглашения о свободной торговле — это сделки между странами, направленные на обеспечение бесперебойной торговли между двумя странами. Используя влияние на страну и повышая безопасность торговых путей, можно установить свободную торговлю."
 INF_ECON_DESC: "Стоит 100 политической власти и 3 очка проекции силы. Договариваться о выгодных иностранных инвестициях — сложное искусство. Вы можете желать лучшей сделки, которую может заключить ваша страна, но иностранные инвесторы хотят больше прибыли в свои карманы. Благодаря искусству заключения сделок можно договориться о выгодных условиях с иностранными инвесторами и банками. Креативные прогнозы, обещания безопасности инвестиций и некоторые сомнительные закулисные сделки могут позволить стране заключать чрезвычайно выгодные сделки за счет инвестора."
 INF_POLI_DESC: "Стоит 200 единиц политической власти и 25 очков проекции силы. Переговоры с нацией открывает возможности для общения и дипломатии, но также может распространять идеалы. Используя международное влияние, можно оказывать политическое давление на страну, чтобы изменить ее идеологию. Даже в самых стойких странах друзья и влиятельные лица могут иметь значительное влияние."
 FPP_TOOLTIP: "Проекция силы — это показатель вашего международного влияния, который позволяет вам совершать особые дипломатические или политические действия. Способность проецировать силу в международных отношениях измеряется вашей способностью реагировать на кризисы, быстро развертывать и поддерживать силы, а также оказывать давление на международные отношения и силы в вашу пользу. Проекция силы скудна и строго ограничена доступными дипломатическими и военными оперативными группами. Перерасход этих активов физически невозможен."
