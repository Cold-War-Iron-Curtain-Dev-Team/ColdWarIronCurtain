 argleaders.1.t: "Освободительная Революция"
 argleaders.1.d: ""
 argleaders.1.a: ""
 argleaders.2.t: ""
 argleaders.2.d: "Эдуардо Лонарди, католик-националист, возглавил хунту \"Освободительной революции\", которая свергла прошлого президента Хуана Перона. Теперь, он занял его место. После прибытия в Буэнос-Айрес, его встретили исполнением \"Cristo Vence\"."
 argleaders.2.a: "Надеемся, это стабилизирует Аргентину"