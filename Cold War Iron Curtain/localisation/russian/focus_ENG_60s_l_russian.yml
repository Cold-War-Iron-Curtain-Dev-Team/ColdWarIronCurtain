l_english:
 ENG_60s_Continue_The_Economic_Boom: "Продолжить экономический бум"
 ENG_60s_Continue_The_Economic_Boom_desc: "Экономика преуспеает, и было бы безрассудно останавливать это, мы должны принять меры, чтобы экономика продолжала процветать, и наша нация продолжала расти."
 ENG_60s_The_Winds_of_Change: "Ветра перемен"
 ENG_60s_The_Winds_of_Change_desc: "Времена меняются, колониализм осуждается на международном уровне, а движения за независимость усиливаются. Мы стоим перед выбором: попытаться сохранить нашу империю или позволить колониям обрести независимость. Возможно, настало время, чтобы солнце наконец зашло над Британской империей."
 ENG_60s_The_British_Armed_Forces: "Британские Вооруженные Силы"
 ENG_60s_The_British_Armed_Forces_desc: "Со временем, по мере развития технического прогресса в мире, развивается и вооружение. Мы должны заниматься его модернизацией для нашей армии, чтобы она соответствовала современным стандартам а также для защиты от наших врагов и расширения собственного влияния."
 ENG_60s_Prime_Minister_MacMillan: "Премьер-министр Макмиллан"
 ENG_60s_Prime_Minister_MacMillan_desc: "После того, как Энтони Иден был вынужден уйти в отставку, Гарольду Макмиллану выпала доля вести нашу великую нацию в будущее, однако, учитывая спад экономики и возможные колониальные проблемы, еще неизвестно, будет ли его правление успешным."
 ENG_60s_Elections_of_1964: "Выборы 1964 года"
 ENG_60s_Elections_of_1964_desc: "Голоса посчитаны, но еще неизвестно, кто победил и стал новой правящей партией."
 ENG_60s_Elections_of_1966: "Выборы 1966 года"
 ENG_60s_Elections_of_1966_desc: "После недавних выборов голоса были подсчитаны, интересно, кто победил."
 ENG_60s_Elections_of_1970: "Выборы 1970 года"
 ENG_60s_Elections_of_1970_desc: "Вот и новые выборы в новом десятилетии, однако еще неизвестно, насколько успешной будет избранная партия."
 ENG_60s_Increase_Affordable_Housing: "Увеличить доступность жилья"
 ENG_60s_Increase_Affordable_Housing_desc: "Людям нужно доступное жилье, но, на сегодняшний день, это целая дыра на рынке недвижимости. Если мы сможем увеличить количество доступных домов, это повысит нашу популярность, не говоря даже об увеличении наших финансов."
 ENG_60s_Increase_Weapon_Exports: "Увеличить экспорт вооружений"
 ENG_60s_Increase_Weapon_Exports_desc: "По мере роста напряженности во всем мире и возникновения новых войн, возрастает потребность в оружии, а так как на рынке появился пробел, мы должны немедленно увеличить производство оружия, чтобы у нас появилась возможность продавать больше."
 ENG_60s_Expand_Auto_Usage: "Расширить автомобилизацию"
 ENG_60s_Expand_Auto_Usage_desc: "Со временем мы видим, что все больше и больше людей пользуются автомобилями в других странах, было бы глупо упускать это из виду. Нам нужно увеличить количество пользователей автолюбителей, и мы дать импульс автомобильной промышленности. Это будет беспроигрышный вариант."
 ENG_60s_The_Benefits_of_Full_Employment: "Преимущества полной занятости"
 ENG_60s_The_Benefits_of_Full_Employment_desc: "Поскольку экономика продолжает расти, мы должны убедиться, что люди работают, и один из способов сделать это - показать им многочисленные преимущества полной занятости! Продвижение этой кампании будет стоить нам некоторого политического влияния, но с точки зрения экономической выгоды оно того стоит."
 ENG_60s_Encourage_Economic_Modernization: "Поощрять экономическую модернизацию"
 ENG_60s_Encourage_Economic_Modernization_desc: "По мере развития технологий мы не можем сохранять наши архаичные привычки, мы должны поощрять технологическое развитие, иначе рискуем отстать в технологической гонке."
 ENG_60s_Encourage_Higher_Wages: "Поощрять высокие зарплаты"
 ENG_60s_Encourage_Higher_Wages_desc: "По мере роста экономики прибыли корпораций растут вместе с ней, повышение заработной платы не только даст людям больше покупательной способности и увеличит рост других предприятий, но и повысит нашу популярность среди людей."
 ENG_60s_Devalue_the_Pound: "Девальвация Фунта"
 ENG_60s_Devalue_the_Pound_desc: "Хотя это нанесет ущерб экономике в краткосрочной перспективе, мы не должны рисковать гиперинфляцией, разрушающей экономику в долгосрочной перспективе. Мы должны девальвировать фунт, пока наша экономика достаточно крепка."
 ENG_60s_Increase_Airliner_Exports: "Увеличить экспорт авиалайнеров"
 ENG_60s_Increase_Airliner_Exports_desc: "Растущая мировая экономика нуждается в самолетах, как и растущая индустрия туризма, а это задача для британского экспорта. На рынке есть спрос на авиалайнеры, а мы их производим, все просто."
 ENG_Establish_the_National_Economic_Development_Council: "Учредить Национальный Совет Экономического Развития"
 ENG_Establish_the_National_Economic_Development_Council_desc: "По мере роста экономики растет и потребность в инфраструктуре, поэтому нам необходимо организовать программу строительства инфраструктуры, чтобы она не отставала от спроса."
 ENG_60s_Achieve_Budgetary_Surplus: "Достичь профицита бюджета"
 ENG_60s_Achieve_Budgetary_Surplus_desc: "Экономический рост позволил создать профицит бюджета, который даст нам свободу тратить больше денег и увеличивать экономику, а также еще больше повышает нашу популярность."
 ENG_60s_Encourage_Corporate_Mergers: "Поощрять слияние корпораций"
 ENG_60s_Encourage_Corporate_Mergers_desc: "По мере роста экономики и роста новых предприятий мы должны поощрять их слияние, чтобы увеличить свою прибыль и обезопасить себя от банкротства."
 ENG_60s_Condemn_Rhodesian_UDI: "Отвергнуть Декларацию о независимости Родезии"
 ENG_60s_Condemn_Rhodesian_UDI_desc: "Декларация независимости Родезии неприемлема, она подрывает нашу мощь и смеется нам в лицо! Мы не можем позволить им уйти при таких обстоятельствах, но, возможно, лучше прийти дипломатическое решению вопроса, чем к военному."
 ENG_60s_Open_Negotiations_with_Rhodesia: "Начать переговоры с Родезией"
 ENG_60s_Open_Negotiations_with_Rhodesia_desc: "Было бы безрассудно пытаться остановить это военным путем, мы должны проявить сдержанность и начать переговоры с Родезией, возможно, мы сможем обратить это движение в свою пользу."
 ENG_60s_Sanction_Rhodesia: "Наложить санцкии на Родезию"
 ENG_60s_Breakdown_of_Negotiations: "Провал переговоров"
 ENG_60s_Breakdown_of_Negotiations_desc: "Мы пытались вести переговоры с Родезией, но безуспешно, они отказываются вести себя с нами разумно, и поэтому мы продолжим наше господство над ними, неужели они не попытаются совершить такую ​​глупость, как восстание?"
 ENG_60s_Recognize_Rhodesia: "Признать Родезию"
 ENG_60s_Recognize_Rhodesia_desc: "Переговоры с Родезией увенчались успехом, и мы согласились признать их, надеясь, что это приведет к светлому будущему между нашими двумя странами."
 ENG_60s_Mitigate_International_Damages: "Снижение международного ущерба"
 ENG_60s_Mitigate_International_Damages_desc: "Ситуация с Родезией привела к ухудшению нашей международной репутации, и поэтому сейчас мы должны предпринять усилия, чтобы восстановить эту репутацию и доверие со стороны других стран, чтобы помочь нашей стране двигаться вперед и сделать нас лучше в глазах народа."
 ENG_60s_Aid_Nigeria: "Помощь Нигерии"
 ENG_60s_Aid_Nigeria_desc: "Нигерия стремится к независимости, и уже невозможно пытаться подчинить их себе, поэтому вместо этого нашим долгом стало помогать им в их недавно обретенной независимости, иначе они рискуют попасть под влияние наших врагов."
 ENG_Reevaluate_The_Colonial_Situation: "Пересмотреть колониальную обстановку"
 ENG_Reevaluate_The_Colonial_Situation_desc: "Времена изменились, старые способы управления нашей империей больше уже не актуальны, нам нужно найти иной способ управления нашими оставшимися колониями, чтобы они не приняли более радикальные методы проведения изменений."
 YEM_The_Aden_Emergency: "Аденская Тревога"
 YEM_The_Aden_Emergency_desc: "Дикари Адена восстали против нас! Мы должны принять экстренные меры, чтобы обеспечить сохранение нашего господства над этим ценным регионом, или, возможно, наконец отпустить Аден."
 ENG_60s_Reap_Profits_from_Arabian_Protectorates: "Получать прибыль от арабских протекторатов"
 ENG_60s_Reap_Profits_from_Arabian_Protectorates_desc: "В то время как мы продолжаем защищать наши арабские владения, мы должны иметь возможность эксплуатировать их ресурсы для нашей собственной экономической выгоды, в конце концов, мы не только получим больше ресурсов, но и больше рабочих мест для наших людей."
 ENG_Declare_Martial_Law_in_Aden: "Объявить военное положение в Адене"
 ENG_Declare_Martial_Law_in_Aden_desc: "Кризис обострился, и наши активы в регионе подвергаются атаке со стороны повстанцев, мы должны задействовать армию, чтобы восстановить контроль над регионом и поддерживать порядок, поскольку протекторат явно не в состоянии сделать это сам."
 ENG_60s_Crackdown_on_Aden: "Расправиться в Адене"
 ENG_60s_Crackdown_on_Aden_desc: "Аден - это британская колония, и британской колонией она останется! Эти повстанцы не будут нам мешать, мы должны расправиться с ними, чтобы сохранить контроль, и на этот раз мы не отступим."
 ENG_60s_Withdraw_from_Aden: "Уйти из Адена"
 ENG_60s_Withdraw_from_Aden_desc: "Ситуация в Адене стала неприемлемой, стало очевидно, что любые ресурсы, выделенные на поддержание контроля, тратятся впустую, и поэтому мы должны уступить требованиям повстанцев и уйти."
 ENG_60s_Reject_Calls_for_South_African_Sanctions: "Отвергнуть призывы к санкциям против ЮАС"
 ENG_60s_Reject_Calls_for_South_African_Sanctions_desc: "Хотя международное сообщество осуждает апартеид, Южная Африка по-прежнему является другом Великобритании, и мы не можем допустить, чтобы они от этого пострадали, кроме того, расширение торговли будет означать для нас больше прибыли."
 ENG_60s_Announce_Withdrawal_from_the_Arabian_Gulf: "Объявить об уходе из Персидского Залива"
 ENG_60s_Announce_Withdrawal_from_the_Arabian_Gulf_desc: "Несмотря на наши усилия по сохранению контроля в регионе, мы должны отступить, как и большая часть наших колониальных владений, они стали убыточными и несостоятельными, мы просто не можем больше оправдать свое пребывание здесь, и поэтому необходимо начать процесс вывода войск."
 ENG_60s_Resist_Calls_to_Withdraw_from_the_Gulf: "Сопротивляться призывам уйти из Залива"
 ENG_60s_Resist_Calls_to_Withdraw_from_the_Gulf_desc: "У нас есть контроль над Персидским заливом и мы не позволим никаким другим иностранным державам попытаться нас вытеснить, мы - Британская империя, и мы сохраним контроль над нашей империей, мы сохраним контроль над Персидским заливом! За короля и отечество!"
 ENG_60s_The_Balance_of_Payments_Crisis: "Валютный кризис"
 ENG_60s_The_Balance_of_Payments_Crisis_desc: "Несмотря на быстрый рост экономики в 50-х годах, наша валюта начала терять свою ценность, и теперь мы сталкиваемся с трудностями при импорте необходимых товаров и выплате долгов. Требуются экстренные действия, чтобы наша экономика не рухнула."
 ENG_60s_Temporary_Wage_Freeze: "Временная заморозка зарплат"
 ENG_60s_Temporary_Wage_Freeze_desc: "Стремясь сократить расходы, мы должны остановить повышение заработной платы, чтобы соответствовать инфляции, иначе это может скоро выйти из-под контроля. Это сделает партию непопулярной среди людей, но стабилизирует экономику и повысит нашу популярность среди крупного бизнеса."
 ENG_60s_Establish_The_National_Income_Commission: "Учредить Комиссию Национального Дохода"
 ENG_60s_Establish_The_National_Income_Commission_desc: "Замораживание заработной платы помогло, однако мы должны в конечном итоге должны будем их разморозить, и поэтому мы должны создать комиссию для работы с заработной платой и ценами в будущем, чтобы держать инфляцию под контролем."
 ENG_60s_Labour_Victory: "Победа Лейбористов"
 ENG_60s_Labour_Victory_desc: "Лейбористы победили на последних выборах, теперь мы можем приступить к отмене консервативных устоев и введению политики, чтобы увидеть, как Британия входит в vболее либеральное будущее, предназначенное для помощи простым людям, а не богатым. "
 ENG_60s_Decrease_Public_Censorship: "Сократить цензуру"
 ENG_60s_Decrease_Public_Censorship_desc: "Мы не диктатура, государственная цензура - это то, чего мы ожидаем в Советском Союзе, а не в Великобритании, пришло время ограничить общественную цензуру, чтобы создать более демократическую нацию."
 ENG_60s_Liberalize_Abortion_Laws: "Смягчить законы об абортах"
 ENG_60s_Liberalize_Abortion_Laws_desc: "Сотни женщин вынуждены посещать сомнительных врачей, чтобы сделать аборт, с нас хватит, пора сделать аборты более доступными, чтобы уменьшить количество женщин, умирающих от абортов, несомненно, это повысит нашу популярность среди людей."
 ENG_60s_Labour_Victory_66: "Победа Лейбористов 1966г."
 ENG_60s_Labour_Victory_66_desc: "Теперь, когда мы избраны, мы должны приступить к работе, создавая Британию, которую хотят люди, и Британию, за которую люди голосовали."
 ENG_60s_Increase_Agricultural_Subsidies: "Увеличить фермерские субсидии"
 ENG_60s_Increase_Agricultural_Subsidies_desc: "Наши фермеры кормят наш народ, и мы должны давать им деньги, чтобы модернизировать сельское хозяйство, в конце концов, мы бы не хотели, чтобы у нас закончились деньги."
 ENG_60s_Labour_Victory_70: "Победа Лейбористов 1970г."
 ENG_60s_Labour_Victory_70_desc: "Мы выиграли еще одни выборы, и теперь мы должны обеспечить исполнение воли народа, мы были избраны народом, и, черт возьми, мы собираемся прислушиваться к ним сейчас и двигаться вперед в течение следующих 5 лет."
 ENG_60s_Fight_Racial_Inequality: "Бороться с расовым неравенством"
 ENG_60s_Fight_Racial_Inequality_desc: "Со временем должно измениться наше отношение, мир становится все более либеральным местом, и мы должны быть в состоянии не отставать. Количество мелатонина в вашей коже не меняет интеллект или поведение, и пора нам начать относиться к другим расам как к равным для создания более единой Британии."
 ENG_60s_Abolish_the_Death_Penalty: "Запретить смертную казнь"
 ENG_60s_Abolish_the_Death_Penalty_desc: "Мы больше не будем сидеть сложа руки и позволять смертной казни продолжаться, было доказано, что она не действует как сдерживающий фактор и является просто варварством, которому нет места в современной западной стране. Пора отменить смертную казнь раз и навсегда!"
 ENG_60s_Decriminalize_Homosexuality: "Декриминализовать гомосексуализм"
 ENG_60s_Decriminalize_Homosexuality_desc: "В предыдущие годы было обнаружено, что многие люди являются гомосексуалистами, но людей не следует арестовывать за любовь к представителю своего пола, мы должны немедленно декриминализовать гомосексуализм и создать более свободную и либеральную страну, а также обеспечить голоса гомосексуалистов."
 ENG_60s_Return_to_Nationalizations: "Вернуться к национализации"
 ENG_60s_Return_to_Nationalizations_desc: "В предыдущие годы консервативного лидерства все больше и больше секторов экономики переходили в частную собственность, однако это оказалось неэффективным для помощи людям и экономике, мы должны снова национализировать экономику, в конце концов, правительство всегда знает как будет лучше."
 ENG_60s_Investigate_Railway_Reform: "Изучить железнодорожную реформу"
 ENG_60s_Investigate_Railway_Reform_desc: "Поскольку кризис ухудшается, государственные расходы должны быть решены, одним из возможных способов сокращения расходов является железнодорожная система, мы должны исследовать, есть ли возможные области для реформ, чтобы сократить расходы."
 ENG_60s_The_Beeching_Axe: "План Beeching Axe"
 ENG_60s_The_Beeching_Axe_desc: "Ясно, что мы больше не можем позволить себе нашу нынешнюю экономическую систему, сокращение должно производиться даже за счет рабочих мест и инфраструктуры, и придется сократить количество станций и маршрутов, хотя те, кто работает на этих станциях, попадут под сокращение, это необходимая жертва для экономики."
 ENG_60s_Reduce_Inflation: "Снизить инфляцию"
 ENG_60s_Reduce_Inflation_desc: "Благодаря контролю над государственными расходами и помощи КНД в поддержании контроля над заработной платой и ценами, мы сейчас в хорошей позиции, чтобы начать борьбу с гиперинфляцией. Эти усилия по борьбе с инфляцией потребуют много времени и могут сделать жизнь людей неудобной, но в долгосрочной перспективе мы только выиграем."
 ENG_60s_Increase_Education_Funding: "Увеличить финансирование оброзования"
 ENG_60s_Increase_Education_Funding_desc: "Образование важно, с образованными людьми мы получаем квалифицированных рабочих, а с более разнообразной рабочей силой наша экономика растет. Это не только улучшит жизнь людей, но и увеличит наш доход, и это не всегда хорошо."
 ENG_60s_Encourage_Economic_Planning: "Поощрить экономическое планироване"
 ENG_60s_Encourage_Economic_Planning_desc: "Для успешной экономики у нас не может быть хаоса, поэтому мы должны тщательно планировать все, чтобы не потерять контроль и не погрузиться в хаос. При тщательном планировании мы сможем легче перенаправить ресурсы в необходимые области и позволить экономике процветать."
 ENG_60s_Increase_Welfare_Benefits: "Увеличить социальные выплаты"
 ENG_60s_Increase_Welfare_Benefits_desc: "Не у всех одинаковая удача в жизни, и тем, кому не повезло, нужна наша помощь, нам нужно увеличить социальные выплаты, чтобы помочь людям встать на ноги и вернуться к работе! И это поможет сохранить их голоса в будущем."
 ENG_60s_Urban_Renewal_Program: "Программа обновления городов"
 ENG_60s_Urban_Renewal_Program_desc: "Городские районы устарели и неэффективны, поэтому мы должны начать новую программу, чтобы модернизировать их и повысить не только уровень жизни, но и значительно упростить процесс строительства новой городской недвижимости."
 ENG_60s_Increase_Access_to_Healthcare: "Увеличить доступность здравоохранения"
 ENG_60s_Increase_Access_to_Healthcare_desc: "Здравоохранение - важная часть Манифеста о труде, однако от этого мало пользы, если люди не могут его использовать, поэтому мы должны инвестировать в то, чтобы сделать его более доступным, и в то же время повысить нашу популярность и эффективность системы здравоохранения."
 ENG_60s_Industrial_Reorganization: "Индустриальная реорганизация"
 ENG_60s_Industrial_Reorganization_desc: "Снова настало время, когда мы должны предпринять усилия для повышения эффективности и производительности нашей отрасли, нам необходимо реорганизовать нашу отрасль, чтобы мы могли дать ей инструменты, необходимые для того, чтобы идти в ногу с остальным миром."
 ENG_60s_Subsidize_Scottish_Industry: "Субсидирование шотландской промышленности"
 ENG_60s_Subsidize_Scottish_Industry_desc: "В Шотландии целый рынок остается без присмотра, и для ускорения экономического роста мы должны субсидировать промышленность Шотландии, чтобы стимулировать ее рост, не только увеличивая производство в этом районе, но и создавая рабочие места."
 ENG_Continue_Heavy_Rail_Spending: "Продолжить траты на тяжелые Ж/Д Перевозки"
 ENG_Continue_Heavy_Rail_Spending_desc: "Хотя мы нашли способы реформировать железнодорожное сообщение, оно по-прежнему является жизненно важной частью нашей инфраструктуры, и поэтому мы должны продолжать тратить значительные средства на его содержание, если мы это сделаем, то наша инфраструктура только выиграет, и, надеюсь, наша экономика будет вместе с этим."
 ENG_60s_Establish_The_EFTA: "Учредить ЕАСТ"
 ENG_60s_Establish_The_EFTA_desc: "Ссоры с Европой стоили нам нашего положения в мире, мировые войны позволили американцам и Советам стать мировыми державами. Нельзя допустить, чтобы это повторилось снова, Европа должна стать более тесно связанной, иначе она рискнет новой войной, установление свободной торговли не только помогает этой цели, но и обеспечивает нам лучшие торговые сделки в этом процессе, беспроигрышную победу."
 ENG_60s_The_Night_of_Long_Knives: "Ночь длинных ножей"
 ENG_60s_The_Night_of_Long_Knives_desc: "Нынешнее правительство стало старым и несвежим, и это начинает проявляться в опросах! Мы должны немедленно перестроить наш кабинет, чтобы он лучше соответствовал нынешним временам, и чтобы правительство было лучше подготовлено к предстоящим вызовам."
 ENG_60s_Increase_Government_Support: "Увеличить поддержку правительства"
 ENG_60s_Increase_Government_Support_desc: "Теперь, когда у нас есть новый, более свежий кабинет, мы можем приступить к работе по увеличению государственной поддержки, приближаются выборы, и нам нужна прочная база, которая даст нам больше легитимности для принятия нашей политики."
 ENG_60s_Conservative_Victory: "Победа Консерваторов"
 ENG_60s_Conservative_Victory_desc: "Мы сделали это! Годы успешного руководства привели к тому, что мы выиграли еще одни выборы, нам предстоит сохранить экономику в рабочем состоянии и это сулит успешное будущее Британии."
 ENG_60s_Reduce_Labour_Union_Influence: "Сократить влияние профсоюзов"
 ENG_60s_Reduce_Labour_Union_Influence_desc: "Профсоюзы обладают слишком большой властью, рабочие проводят больше времени на забастовках, чем на работе, а это вредит и бизнесу и экономике, поэтому мы должны уменьшить их влияние и вернуть все в норму, в конце концов, я уверен, что бизнес позаботится о своих рабочих."
 ENG_60s_Encourage_Economic_Efficiency: "Поощрять эффективную экономику"
 ENG_60s_Encourage_Economic_Efficiency_desc: "При эффективной экономике у нас будет меньше спроса на ресурсы и потребности в инвестициях, что приведет к сокращению государственных расходов. Если мы хотим лучшей экономики, нам понадобится более эффективная."
 ENG_60s_Increase_Commonwealth_Technical_Cooperation: "Увеличить техническую кооперацию в Содружестве"
 ENG_60s_Increase_Commonwealth_Technical_Cooperation_desc: "В нашем содружестве много великих умов, поэтому мы должны объединить их для достижения общей цели технологического прогресса, тем самым увеличивая скорость наших исследований и облегчая задачу идти в ногу с постоянно развивающимся миром."
 ENG_60s_Encourage_Home_Modernization: "Поощрять модернизацию в метрополии"
 ENG_60s_Encourage_Home_Modernization_desc: "Наши здания устарели, мы должны убедиться, что новые дома из новых материалов потребляют меньше ресурсов и делают жизнь людей более комфортной, в конце концов, если люди счастливы, то они за нас проголосуют."
 ENG_60s_Endorse_Slum_Clearances: "Поддержать расчистку трущоб"
 ENG_60s_Endorse_Slum_Clearances_desc: "Такой маленькой нации, как наша, нужно больше места. Может быть лучше для начала снесем эти отвратительные трущобы, которые портят наш имидж. Если мы очистим их, тогда наши города будут выглядеть лучше, и у нас больше возможностей для расширения!"
 ENG_60s_The_Vassall_Tribunal: "Трибунал над Вассаллом"
 ENG_60s_The_Vassall_Tribunal_desc: "После того, как Вассалл объявил предателем, многие стали критиковать нашу безопасность, в конце концов, как вообще государственному служащему было позволено контактировать с Советами! Мы были вынуждены созвать этот Трибунал для дальнейшего расследования этих исков."
 ENG_60s_Deal_with_The_Profumo_Affair: "Сделка с делом Профумо"
 ENG_60s_Deal_with_The_Profumo_Affair_desc: "Выяснилось, что у Джона Профумо был роман с 19-летней моделью Кристин Киллер, политические последствия этого скандала были ужасны, и наша популярность значительно упала, мы должны попытаться сдержать это, прежде чем у нас все начнет валиться из рук."
 ENG_60s_Rally_the_Conservatives: "Сплотить Консерваторов"
 ENG_60s_Rally_the_Conservatives_desc: "После недавних скандалов и нескольких попыток повысить нашу популярность мы теперь можем мобилизовать консервативную поддержку по всей стране в стремлении победить на предстоящих выборах, что, несомненно, приведет к увеличению поддержки нашей партии и, как следствие, к победе на выборах."
 ENG_60s_Conservative_Victory_66: "Победа Консерваторов 1966 г."
 ENG_60s_Conservative_Victory_66_desc: "Всего лишь через 2 года после последних выборов тори победили, и нам снова выпало вести Британию к процветающему будущему."
 ENG_60s_Reform_the_Welfare_State: "Реформировать социальное государство"
 ENG_60s_Reform_the_Welfare_State_desc: "Нынешняя система социального обеспечения слишком дорога, ее необходимо реформировать, чтобы мы могли сократить расходы и сократить государственные расходы, а затем стимулировать экономику, даже если после этого некоторые простолюдины будут бороться."
 ENG_60s_Conservative_Victory_70: "Победа Консерваторов 1970 г."
 ENG_60s_Conservative_Victory_70_desc: "Мы завоевали доверие британского народа, и наша задача - сделать страну и экономику лучше для них. Вперед в будущее под руководством консерваторов."
 ENG_60s_Cut_Education_Funding: "Урезать финансирование образования"
 ENG_60s_Cut_Education_Funding_desc: "Еще один шаг к нашему бесконечному стремлению к экономическому росту - это ограничение государственных расходов, и нужно сказать, что система образования - одна из самых больших статей расхода нашего бюджета. Поэтому нам нужно начать сокращать финансирование, даже если это будет означать, что некоторые дети могут не ходить в школу, они все равно не хотят туда ходить."
 ENG_60s_Raise_Compulsory_School_Age_to_16: "Поднять обязательный школьный возраст до 16"
 ENG_60s_Raise_Compulsory_School_Age_to_16_desc: "Нам нужны более квалифицированные работники, и лучший способ сделать это - заставить людей ходить в школу. Если мы будем держать людей в школе дольше, они обязательно узнают больше и, следовательно, получат больше навыков для использования на рабочем месте."
 ENG_60s_Retain_Nuclear_Autonomy: "Сохранить ядерную автономию"
 ENG_60s_Retain_Nuclear_Autonomy_desc: "Мы работали с США над созданием ядерного оружия, но они оставили его себе. Ядерное оружие - это то, что позволяет нам сохранять нашу независимость в безопасности в наше время, и мы должны гарантировать, что никакая другая страна не может поставить нашу независимость под угрозу. Неободимо инвестировать средства в наши собственные ядерные исследования."
 ENG_60s_Increase_Investment_in_Northern_Ireland: "Увеличить инвестиции в Северную Ирландию"
 ENG_60s_Increase_Investment_in_Northern_Ireland_desc: "Мы боролись за контроль над Северной Ирландией, и теперь это главная область для инвестиций. Если бы мы инвестировали в эту область, это не только сделало бы нас более популярными в глазах людей, но и увеличило бы наш собственный доход!"
 ENG_60s_Crackdown_on_Crime: "Борьба с преступностью"
 ENG_60s_Crackdown_on_Crime_desc: "Полиции нужно больше полномочий, чтобы обезопасить людей. Преступность растет слишком быстро, и нам нужно взять ситуацию под контроль, мы принесем мир, свободу и безопасность нашей новой империи."
 ENG_60s_The_Industrial_Relations_Act: "Акт о производственных отношениях"
 ENG_60s_The_Industrial_Relations_Act_desc: "Если мы хотим улучшить экономику, нам нужно позволить экспертам заниматься делом, в конце концов, кто еще знает, как управлять промышленностью лучше, чем промышленные предприятия, нам нужно улучшить отношения с ними, чтобы мы могли повысить их эффективность, даже за счет урезания прав рабочих."
 ENG_60s_The_Royal_Navy: "Королевский Флот"
 ENG_60s_The_Royal_Navy_desc: "Когда-то Британию хвалили за ее военно-морскую мощь, однако мы больше не правим волнами, американцы потеснили нас со статуса главной военно-морской державы, но мы не можем допустить этого, мы должны предпринять усилия, чтобы модернизировать наш флот и вернуть себе место на пьдестале морских держав."
 ENG_60s_County_Class_Destroyers: "Эскадренные миноносцы типа «Каунти»"
 ENG_60s_County_Class_Destroyers_desc: "Поскольку значение подводных лодок растет, мы должны иметь эффективный способ противодействовать им, поэтому мы должны инвестировать в модернизацию наших эсминцев, чтобы противостоять растущей угрозе подводных лодок."
 ENG_60s_Resolution_Class_Submarines: "Подлодки типа «Каунти»"
 ENG_60s_Resolution_Class_Submarines_desc: "Подводная лодка - это новый линкор, мы должны инвестировать в этот новый метод ведения войны, чтобы использовать его против наших врагов, прежде чем они применят его против нас."
 ENG_60s_Fund_the_CVA_01_Carriers: "Авианосцы типа «Куин Элизабет»"
 ENG_60s_Fund_the_CVA_01_Carriers_desc: "Авианосцы - это еще один тип кораблей, который стал незаменимым для морской войны, однако наши авианосцы старые и не подходят для современной войны. Поэтому мы должны вложить деньги в новую, более современную конструкцию авианосца, которая сможет конкурировать с любым американским или советским авианосцем."
 ENG_60s_Refit_Carriers: "Переоснастить авианосцы"
 ENG_60s_Refit_Carriers_desc: "Зачем платить за новые авианосцы, если мы можем переоборудовать существующие. Все, что нам нужно сделать, это взять наши нынешние носители и вставить несколько новых деталей, чтобы ускорить их работу, они могут быть не лучшими, но это дешево."
 ENG_60s_Invest_in_Nuclear_Submarines: "Вложиться в ядерные субмарины"
 ENG_60s_Invest_in_Nuclear_Submarines_desc: "Хотя наши текущие инвестиции в подводные лодки могут привести их в порядок, их батареи ограничивают время, в течение которого они могут находиться под водой. Однако, если мы инвестируем в недавно открытую ядерную энергетику, мы можем продлить время их работы и, следовательно, эффективность."
 ENG_60s_The_British_Army: "Британская Армия"
 ENG_60s_The_British_Army_desc: "Мы всегда отдавали предпочтение небольшой и элитной армии, и хотя армия не увеличивалась в размерах со времен Второй мировой войны, она отстала от других держав. Армия - это то, чем мы захватываем и удерживаем землю, мы должны вкладывать средства в ее восстановление. "
 ENG_60s_Suspend_National_Service: "Приостановить наицональную службу"
 ENG_60s_Suspend_National_Service_desc: "Хотя напряженность высока, мы всегда выступали за меньшую армию, это позволяет ей быть более элитной, поэтому мы должны приостановить выполнение требований национальной службы, что не только повысит нашу популярность среди людей, но и позволит им вернуться к работе, но и заставит их более охотно поддерживают войны, потому что они не подвергаются риску."
 ENG_60s_L2A1_Assault_Rifle: "Штурмовая винтовка L2A1"
 ENG_60s_L2A1_Assault_Rifle_desc: "Сильная армия нуждается в сильном оружии, нам нужно вкладывать средства в более современное оружие, чтобы вооружить наши войска и дать им преимущество в бою."
 ENG_60s_Develop_the_Chieftain: "Разработать танк «Чифтен»"
 ENG_60s_Develop_the_Chieftain_desc: "Вторая мировая война показала всем эффективность блицкрига и бронетехники. Мы должны убедиться, что наши бронетанковые части могут не отставать от наших соперников, чтобы мы могли использовать эту проверенную и успешную тактику."
 ENG_60s_Operation_Banner: "Операция «Знамя»"
 ENG_60s_Operation_Banner_desc: "Незаконные вооруженные формирования активизировали свою деятельность, мы должны начать операцию «Знамя» и взять ситуацию под контроль."
 ENG_60s_The_Royal_Airforce: "Королевские ВВС"
 ENG_60s_The_Royal_Airforce_desc: "В последнее время авиация стала ключевой частью военных операций, и КВВС нельзя оставлять без внимания, мы должны догнать наших соперников, прежде чем они оставят нас позади."
 ENG_60s_Invest_in_VTOL: "Вложиться в СВВП"
 ENG_60s_Invest_in_VTOL_desc: "Нам нужны более современные истребители, способные защитить наши силы с неба, мы должны инвестировать в новые истребители вертикального взлета и посадки, чтобы позволить нам догнать наших потенциальных врагов и продвинуть ВВС Великобритании в число лучших военно-воздушных сил в мире."
 ENG_60s_Import_American_Phantoms: "Импорт американских «Фантомов»"
 ENG_60s_Import_American_Phantoms_desc: "Хотя нам, возможно, не нравится это признавать, американские ВВС превосходят наши собственные, нам было бы выгодно приобрести некоторые из их самолетов, чтобы увеличить наши собственные силы, полагаю, что у них есть лишние, верно?"
 ENG_60s_Harrier_Jump_Jets: "Самолеты «Харриер»"
 ENG_60s_Harrier_Jump_Jets_desc: "Мы должны и дальше инвестировать в наши военно-воздушные силы, хотя истребители вертикального взлета и посадки были шагом в правильном направлении, мы не можем останавливаться на достигнутом, эти новые реактивные истребители значительно увеличат наши возможности в воздушных боях и других наземных операциях."
 ENG_60s_The_Blackburn_Buccaneer: "«Блекберн Буканир»"
 ENG_60s_The_Blackburn_Buccaneer_desc: "Хотя у нас есть реактивные самолеты для наших сухопутных войск, нам нужны реактивные самолеты, предназначенные для морских операций, поэтому новые «Буканьеры» значительно увеличат возможности нашего флота."
 ENG_60s_Publicize_Welfare_Programs: "Опубликовать социальные программы"
 ENG_60s_Publicize_Welfare_Programs_desc: "Мы увеличили расходы на социальное обеспечение, однако мы должны убедиться, что люди знают, что им доступно, и поэтому мы должны потратить деньги на кампанию по освещению программ социального обеспечения и их преимуществ, одновременно повышая нашу общественную репутацию в процессе."
 ENG_60s_Ensure_Dockworker_Job_Security: "Обеспечить безопасность работы докера"
 ENG_60s_Ensure_Dockworker_Job_Security_desc: "Никто не должен жить с угрозой отсутствия безопасности на работе, и это приводит к потере продуктивности, если они тратят больше времени на беспокойство, чем на работу. Поэтому мы должны обеспечить безопасность докеров, зная, что их работа безопасна, что повысит их вероятность голосовать за лейбористов и работать более продуктивно."
 ENG_60s_Establish_Open_Universities: "Учредить открытые университеты"
 ENG_60s_Establish_Open_Universities_desc: "Университет стоит слишком дорого, и большинству людей это не по карману. Поэтому мы должны сделать его бесплатным для масс. Это не только сделает нас более популярными, но и повысит общий уровень образования большинства населения, а когда люди станут более образованными, все сектора экономики будут расти."
 ENG_60s_Increase_Early_Childhood_Education: "Увеличить дошкольное образование"
 ENG_60s_Increase_Early_Childhood_Education_desc: "Детей нужно учить с более раннего возраста, чтобы дать им больше времени для развития ключевых навыков и становления умнее, с более образованной рабочей силой производительность труда белых воротничков возрастет, и экономика, несомненно, от этого только выиграет. "
 ENG_60s_Reduce_the_Voting_Age_to_18: "Снизить избирательный возраст до 18 лет"
 ENG_60s_Reduce_the_Voting_Age_to_18_desc: "Не секрет, что молодые люди более либеральны и, следовательно, с большей вероятностью будут голосовать за лейбористов, поэтому, снизив возрастной ценз, мы можем гарантировать, что мы сами получим больше голосов и ограничим влияние старшего поколения. "
 ENG_60s_Increase_Infrastructure_Spending: "Увеличить расходы на инфраструктуру"
 ENG_60s_Increase_Infrastructure_Spending_desc: "По мере того, как наша страна продолжает расти, должна расти и наша инфраструктура, если она хочет удовлетворить потребности людей и экономики. Чтобы увеличить инфраструктуру, мы должны инвестировать в более совершенные методы ее строительства, иначе мы рискуем дать сбой в нашей экономике."
 ENG_60s_Increase_Womens_Rights: "Расширить права женщин"
 ENG_60s_Increase_Womens_Rights_desc: "Несмотря на то, что в начале 20-го века у женщин было право голоса, женщины по-прежнему считаются менее значимыми, мы должны это изменить, вместе мы должны приложить усилия для повышения имиджа женщин как равных с мужчинами, в конце концов, есть много блестящих умы и работники женского населения, игнорировать которые было бы глупо."
 ENG_60s_Expand_English_New_Towns: "Расширить новые города Англии"
 ENG_60s_Expand_English_New_Towns_desc: "По мере роста населения растет и необходимость их всех размещать, но мы также не можем ожидать, что люди будут жить в нищете. Поэтому мы должны начать кампанию по расширению английских новых городов, новых городов для новых людей."
 ENG_60s_Enviromental_Regulations: "Регулирование окружающей среды"
 ENG_60s_Enviromental_Regulations_desc: "Мы живем на этой планете и, насколько нам известно, нет другой планеты, благоприятной для жизни. Поэтому нам нужно защитить Землю и приложить усилия, чтобы остановить загрязнение. Надеюсь, эти новые правила - шаг в правильном направлении."
 ENG_60s_The_Britain_We_Want: "Британия, которую мы заслужили"
 ENG_60s_The_Britain_We_Want_desc: "Это заняло несколько месяцев напряженной работы, но нам удалось создать более либеральную Британию, лучше Британию, где люди могут быть счастливы, качество жизни улучшается, и создало более равное общество, светлое будущее для Британии и британского народа."
 ENG_60s_Begin_Negotiations_with_the_EEC: "Начать переговоры с ЕЭС"
 ENG_60s_Begin_Negotiations_with_the_EEC_desc: "Если мы хотим улучшить экономику, мы должны сотрудничать с нашими европейскими соседями, а не против них. Мы должны немедленно начать переговоры с ЕЭК, чтобы расширить наше сотрудничество и создать лучшие рабочие отношения, в которых все, в основном мы, могут процветать."
 ENG_60s_Campaign_Against_Euroskepticism: "Кампания против евроскептицизма"
 ENG_60s_Campaign_Against_Euroskepticism_desc: "В предыдущие годы мы выступали за более тесные связи с европейскими странами, однако эти проклятые евроскептики подрывают нашу повестку дня, мы должны усилить кампании по поощрению еврофилов и сделать сотрудничество с Европой более радужным."
 ENG_60s_Combat_Unemployment: "Бороться с безработицей"
 ENG_60s_Combat_Unemployment_desc: "Безработица - проклятие любого правительства, однако она становится все хуже, мы должны принять меры по борьбе с ней сейчас, пока не стало слишком поздно! Иначе мы можем отстать в экономическом отношении, что само по себе приведет к катастрофе."
 ENG_60s_Distance_Relations_From_America: "Дистанцироваться от отношений с Америкой"
 ENG_60s_Distance_Relations_From_America_desc: "Хотя Британия и янки были хорошими друзьями со времен Второй мировой войны, стало ясно, что они просто хотят использовать нас как марионеток. Нам нужно дистанцироваться от них, чтобы сохранить свою независимость, иначе мы рискуем стать американскими рабами."
 ENG_60s_Strengthen_Relations_with_the_PRC: "Улучшить отношения с КНР"
 ENG_60s_Strengthen_Relations_with_the_PRC_desc: "Знаете, может быть, Китай не так уж и плох, раз уж мы планируем дистанцироваться от американцев, нам нужно найти союзников, и что может быть лучше, чем Китай, при условии, что они, конечно, могут оставить позади всю опиумную войну."
 ENG_60s_The_Local_Government_Act: "Акт о местном самоуправлении"
 ENG_60s_The_Local_Government_Act_desc: "Для более эффективной системы управления и для того, чтобы люди чувствовали себя менее угнетенными, нам необходимо усилить власть местных органов власти, в конце концов, они могут более эффективно управлять местными территориями, а не пытаться управлять всем на микроуровне, и это дает у людей чувство контроля."
 ENG_60s_Combat_Rising_Prices: "Бороться с ростом цен"
 ENG_60s_Combat_Rising_Prices_desc: "Поскольку цены растут, люди не могут позволить себе товары первой необходимости, мы должны действовать быстро, чтобы контролировать эти цены, прежде чем они выйдут из-под контроля и нам придется иметь дело с гиперинфляцией."
 ENG_60s_Utilize_British_Technical_Skills: "Использовать британское технологическое превосходство"
 ENG_60s_Utilize_British_Technical_Skills_desc: "Британский народ технически одарен, и все же мы не используем его должным образом - я имею в виду использование этой области рабочей силы, с небольшими инвестициями можно было бы легко использовать этот пробел на рынке."
 ENG_60s_Reform_the_Unions: "Реформировать профсоюзы"
 ENG_60s_Reform_the_Unions_desc: "Профсоюзы представляют собой проблему, однако, если бы мы реформировали их, мы могли бы повысить эффективность нашей рабочей силы и, следовательно, стимулировать экономику, превратив врага в преимущество."
 ENG_60s_Increase_European_Cooperation: "Усилить Европейскую Кооперацию"
 ENG_60s_Increase_European_Cooperation_desc: "Мы не можем изолировать себя как нацию, нам нужно работать с нашими европейскими партнерами, а не против них, нам нужно улучшить наши отношения с ними, чтобы нам было легче обсуждать торговые возможности и взаимную защиту, потому что, если мы изолируем себя, мы сделаем себя открытыми. к атаке коммунистов."
 ENG_60s_Reuce_Government_Waste: "Снизить правительственные расходы"
 ENG_60s_Reuce_Government_Waste_desc: "Наши усилия по сокращению государственных расходов продолжаются, поскольку мы, правительство, тратим слишком много денег, и нам нужно их сократить, если мы хотим увеличить бюджет и решить экономические проблемы Великобритании, это также поможет нам выглядеть лучше как правительство."
 ENG_60s_Reduce_Immigration_Rates: "Сократить иммиграционные квоты"
 ENG_60s_Reduce_Immigration_Rates_desc: "Мы не можем позволить иностранцам работать в Великобритании! Если наша экономика хочет вернуться в нормальное русло, нам нужно, чтобы британцы работали в британской промышленности, мы должны немедленно остановить приток иммигрантов, пока не стало слишком поздно."