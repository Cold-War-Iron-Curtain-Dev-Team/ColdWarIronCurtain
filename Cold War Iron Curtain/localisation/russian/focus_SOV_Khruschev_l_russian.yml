 #Новостные события
 Beria_Arriest.1.d: "Глава НКВД Лаврентий Берия, казалось бы, мог встать у руля Советского Союза после смерти Сталина. Однако его интриги не увенчались успехом, поскольку соперники оказались на шаг впереди. Во время совещания с его ближайшими советниками военные обошли НКВД и арестовали Берию и его соратников. Вскоре после этого постановочный суд, лишенный защитника, признает Берию виновным в изменнических действиях в координации с Лондоном и терроризме против государства. Берия и шесть его соратников были быстро расстреляны, а их останки сожжены. После того как одна из самых мрачных фигур сталинской эпохи была предана земле, будущее Советского Союза остается неопределенным, поскольку многие фигуры по-прежнему имеют большое влияние в Политбюро." 
