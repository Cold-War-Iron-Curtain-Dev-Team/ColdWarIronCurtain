 #Ивенты
 Tblisi.1.d: "Хрущевская политика десталинизации начнет разрушать культ личности, сформировавшийся вокруг тоталитарного деятеля при его жизни, но не все это одобрят. Многие воспринимают Сталина как национального героя, который храбро вел коммунистический мир против зла держав оси и имперских угнетателей. Сталин остается особенно популярным в его родном регионе - Грузии, где Хрущев становится все более непопулярным из-за своих антисталинских реформ. Речь Хрущева на 20-м съезде, произнесенная за закрытыми дверями и направленная против Сталина и его грузинских сторонников, лишь еще больше вызвала недовольство. В отместку, 4 марта грузины соберутся у памятника Сталину, чтобы отметить третью годовщину его смерти. В ближайшие дни организованное движение протеста против Хрущева начало набирать обороты, когда тысячи людей вышли на улицы. Вскоре ситуация обострилась: многие грузинские националисты призывают к полному выходу Грузии из состава Советского Союза. Местные власти Грузии находятся в полной растерянности и ждут указаний из Москвы." 
 destalinization.3.d: "После почти 6 дней парализующих беспорядков в Грузинской ССР, Москва, наконец, восстановила полный контроль над регионом. После напряженного противостояния с местной полицией для разгона толпы были направлены военные.  Ситуация обострилась до предела, когда правительство арестовало гражданскую делегацию, а протестующие бросились на военных и полицию. Советские танки врывались на площадь Ленина, за ними следовали батальоны войск, которые без стеснения расстреливали толпу боевыми патронами. К 10 марта протестующие были массово арестованы и убиты, сотни других исчезли среди ночи. Порядок был восстановлен, но легитимность Хрущева и его руководства теперь под вопросом."
 malenkov_resign.1.d: "После смерти Лаврентия Берии давление на премьера Георгия Маленкова быстро усилилось, чтобы заставить его уйти в отставку. Хрущев и остальные члены Политбюро быстро осудили Маленкова за его тесную связь с Берией и готовность предавать других ради политической выгоды. Не имея особого выбора в этом вопросе, он объявил о своей отставке в феврале 1955 года. После этого он вернулся в качестве постоянного члена Политбюро. Таким образом, новое руководство Советского Союза может наконец-то начать свою работу."
