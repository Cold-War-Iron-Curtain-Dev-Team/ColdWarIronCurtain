l_russian:
 codwar.1.d: "Рыболовство всегда было одним из столпов исландской экономики. Однако рыбы в наших водах осталось мало, и это угрожает нашему традиционному образу жизни. Если мы в ближайшее время не сократим наше производство рыбы, то наша рыбная промышленность наверняка рухнет в долгосрочной перспективе."
 codwar.2.d: "Чтобы спасти нашу рыбную промышленность, важный источник дохода для нас, мы можем либо сократить квоты на вылов рыбы, либо осваивать новые промысловые угодья. Если мы этого не сделаем, рыбаки нашей страны разгневаются. Другой вопрос, как далеко должна простираться любая экспансия."
 codwar.3.d: "Исландские моря переполнены рыбой, поэтому исландское правительство решило просто расширить свои территориальные воды и претендовать на новые рыболовные угодья – за счет наших собственных рыбаков, которые теперь нуждаются в защите от флота в "новых" исландских водах. Вряд ли Исландия, которая зависит от рыбной промышленности, уступит здесь, но можем ли мы принять эту провокацию?"
 codwar.4.d: "Так называемая 'тресковая война' почти закончилась. Британия вскоре официально согласилась с нашим расширением территориальных вод. Хотя британское судоходство продолжает нарушать наш суверенитет в настоящее время, британское правительство указало, что эта авантюра становится слишком дорогой для них, и они скоро отзовут свою морскую поддержку от британского рыболовного флота."
 codwar.5.d: "Так называемая 'тресковая война' затягивается, и конфликт не показывает никаких признаков того, что он закончится в ближайшем будущем. Мы уверены, что Британия в конце концов согласится на расширение наших территориальных вод, но в настоящее время британские корабли все еще упорно нарушают наш суверенитет. Пока британские корабли не уйдут, нам придется нести расходы по защите нашего рыболовного флота."
