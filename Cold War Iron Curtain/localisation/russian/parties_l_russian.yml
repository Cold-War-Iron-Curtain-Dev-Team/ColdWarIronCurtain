 ISR_liberal_party: "Общие сионисты"
 ISR_liberal_party_long: "Хационим ХаКлалийм: §GХационим ХаКлалийм (Всеобщие сионисты) - центристская крупная палаточная капиталистическая партия. Созданная сионистами, не связанными ни с одной из философских школ сионизма, она вскоре приняла либеральные и капиталистические высоты. Основной базой поддержки общих сионистов является средний класс и другие землевладельцы за пределами кибуцев. Сионисты в целом рассматриваются как двухпартийное решение проблемы растущей поляризации израильской политики.§!"
 ISR_nationalist_party: "Херут"
 ISR_nationalist_party_long: "Движение Херут: §GТнуат Херут (Движение Херут), также называемое просто Херут, является правой ревизионистской сионистской партией. Сформирована бывшим лидером \"Иргун\" Менахемом Бегином и находится под сильным влиянием ныне несуществующей партии \"Хатзохар\". Херут принял точку зрения Жаботинского на сионизм, ревизионистский сионизм, который стремится к еврейскому суверенитету на всей территории бывшего британского мандата на Палестину и полному контролю над Землей Израиля. Многие другие партии рассматривают \"Херут\" как маргинальную радикальную силу, но их поддержка на низовом уровне делает их потенциальным главным претендентом на власть в Кнессете.§!"
 ISR_socialist_party: "Мапай"
 ISR_socialist_party_long: "Мифлегет Поалей Эрец Исраэль: §GМифлегет Поалей Эрец Исраэль (Рабочая партия земли Израиль), часто сокращаемая до Мапай, является умеренной социалистической партией, которая доминировала в сионистской политике в догосударственные годы. С их социалистической политикой и прозападными позициями Мапай кажется партией для обычных рабочих, которые не подписались на коммунизм. Однако Мапай - очень нестабильная партия, со многими фракциями, соперничающими за власть, что приводит к внутрипартийным беспорядкам из-за каждой допущенной ею ошибки.§!"
 ISR_trotskyism_party: "Мапам"
 ISR_trotskyism_party_long: "Мифлегет ХаПоалим ХаМеухедет: §GМифлегет ХаПоалим ХаМеухедет (Объединенная рабочая партия), часто сокращаемая до Мапам, является бескомпромиссной социалистической партией с незначительными марксистскими тенденциями. Созданная в результате слияния партий \"Хашомер Хацаир\" и \"Ахдут Ха'Авода\", \"Мапам\" прочно стоит на левом фланге. Мапам верит, что сионизм может сыграть свою роль в мировой революции, и считает, что СССР совершил ошибку, заняв антисионистские позиции.§!"
