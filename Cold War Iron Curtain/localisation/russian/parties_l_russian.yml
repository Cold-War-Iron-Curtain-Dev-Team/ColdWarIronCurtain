 FIN_Social_Democratic_party_desc: "Основанная в 1899 году как Финская лейбористская партия (получившая нынешнее название в 1903 году), СДП является старейшей партией в Финляндии. Из-за проигрыша на выборах в 1917 году многие члены партии присоединились к Красной гвардии во время гражданской войны в Финляндии. После войны она преобразовалась в более патриотическую, менее радикальную версию, в результате чего партия раскололась на социал-демократов и коммунистов. Раскол только усугубился после 2-й мировой войны."
