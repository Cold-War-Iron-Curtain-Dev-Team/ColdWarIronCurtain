l_english:
 YUG_The_Reconstruction_of_Yugoslavia: "Восстановление Югославии"
 YUG_The_Reconstruction_of_Yugoslavia_desc: "Хотя со времени войны прошло уже много лет, ее последствия все еще ощущаются. Мы должны упорно трудиться, чтобы восстановить нашу нацию."
 YUG_The_Informbiro_Period: "Период Коминформа"
 YUG_The_Informbiro_Period_desc: "Мы должны быть бдительными в отношении сталинской угрозы."
 YUG_Jugoslavenska_Narodna_Armija: "Югославская народная армия"
 YUG_Jugoslavenska_Narodna_Armija_desc: "Югославская народная армия"
 YUG_The_Yugoslavian_Path_to_Socialism: "Югославский путь к социализму"
 YUG_The_Yugoslavian_Path_to_Socialism_desc: "Несмотря на то, что мы установили социализм в Югославии, мы все еще должны укреплять нашу власть, чтобы сохранить наше прошлое и увековечить наше наследие."
 YUG_Encourage_Secular_Values: "Поощрение традиционных ценностей"
 YUG_Encourage_Secular_Values_desc: " \"Религия - это вздох угнетенного существа, сердце бессердечного мира и душа бездушных условий. Это опиум для народа\" - Карл Маркс"
 YUG_Reject_Socialist_Realism: "Отвергнуть социалистический реализм"
 YUG_Reject_Socialist_Realism_desc: "Социалистический реализм - это не более чем сталинская пропаганда."
 YUG_Discourage_Anticlerical_Attacks: "Отбиться от антиклерикалов"
 YUG_Discourage_Anticlerical_Attacks_desc: "Хотя религия в Югославии не приветствуется, мы не можем допустить, чтобы люди нападали на религиозных деятелей."
 YUG_Embrace_State_Atheism: "Принять атеизм на гос. уровне"
 YUG_Embrace_State_Atheism_desc: "Атеизм - это то, чего мы хотим."
 YUG_Expand_Titos_Pioneers: "Расширить организацию Titovi Pioniri"
 YUG_Expand_Titos_Pioneers_desc: "Титови Пионери (Titos Pioneer), официально известный как Союз пионеров Югославии является пионерской организацией Югославии, аналогичной другим пионерам Восточного блока."
 YUG_Restore_Relations_with_the_Vatican: "Разорвать отношения с Ватиканом"
 YUG_Restore_Relations_with_the_Vatican_desc: "После того как Папа Пий XII возвел архиепископа Степинаца в коллегию кардиналов, СФР Югославия разорвала дипломатические отношения со Святым Престолом, обвинив его во вмешательстве во внутренние государственные дела. Степинац предстал перед судом и в конце концов был признан виновным в сотрудничестве с нацистскими оккупантами во время Второй мировой войны. Святейший Престол отреагировал на это тем, что отлучил от церкви президента Тито и некоторых других должностных лиц, участвовавших в этом процессе."
 YUG_Increase_Womens_Rights: "Расширить права женщин"
 YUG_Increase_Womens_Rights_desc: "Равное общество лучше для всех."
 YUG_Establish_Yugoslav_Radio_Television: "Учредить Югославское радиотелевидение"
 YUG_Establish_Yugoslav_Radio_Television_desc: "Югославское радиотелевидение является национальной системой общественного вещания в СФР Югославии. Она состоит из восьми субнациональных радио и телевизионных вещательных центров, каждый из которых имеет штаб-квартиру в одной из шести входящих в состав Югославии республик и двух автономных провинций."
 YUG_Empower_Peoples_Committees: "Расширение возможностей народных комитетов"
 YUG_Empower_Peoples_Committees_desc: "Расширение прав и возможностей народных комитетов"
 YUG_Literacy_Campaign: "Кампания по ликвидации безграмотности"
 YUG_Establish_the_University_of_Skopje: "Создать университет в Скопье"
 YUG_Establish_Workers_Councils: "Учредить рабочие советы"
 YUG_Relax_Censorship: "Ослабить цензуру"
 YUG_Allow_the_Establishment_of_Cultural_Societies: "Разрешить создание культурных сообществ"
 YUG_Open_Up_to_Western_Cultural_Influences: "Усилить западное культурное влияние"
 YUG_Stengthen_the_UDBA: "Учредить УГБ (UDBA)"
 YUG_Stengthen_the_UDBA_desc: "(UDBA) Управление государственной безопасности - это наша тайная полиция. С Советской помощью мы должны увеличить его финансирование и подготовку агентов."
 YUG_Continue_the_Repression_of_Slavonia: "Продолжить репрессии в Славонии"
 YUG_Continue_the_Repression_of_Slavonia_desc: "Тито прекрасно понимает, что самая большая угроза развитию коммунизма в Югославии - это национализм. Поэтому даже малейшая форма национализма должна быть подавлена репрессиями. Больше всего усилий требуется в районе Славонии, Хорватия из-за их недавней истории."
 YUG_Suppress_the_Cazin_Uprising: "Подавить восстание казинов"
 YUG_Arrange_Hebrangs_Death: "Организовать убийство Хебранга"
 YUG_Establish_Goli_Otok_Prison: "Построить тюрьму Голи Оток"
 YUG_Halt_Agricultural_Collectivization: "Остановить сельскохозяйственную коллективизацию"
 YUG_Reject_Stalinist_Economics: "Отказаться от сталинской экономики"
 YUG_Introduce_Workers_Self_Management: "Ввести самоуправление работников"
 YUG_Introduce_Workers_Self_Management_desc: "Мы должны практиковать социалистическое самоуправление в отличие от стран Восточного блока, которые практиковали централизованное планирование и централизованное управление своими экономиками. Экономика Югославии будет организована в соответствии с теориями Иосипа Броз Тито и более непосредственно Эдварда Карделя. Благодаря нашей политике нейтралитета и нашей ведущей роли в Движении неприсоединения югославские компании будут экспортировать продукцию как на западные, так и на восточные рынки."
