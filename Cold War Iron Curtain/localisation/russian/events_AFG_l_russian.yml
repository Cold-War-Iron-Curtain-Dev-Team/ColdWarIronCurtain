l_russian:
 withdraw_from_korea: "Вывод войск из Кореи"
 AFG_Revolution.1.d: "С момента вступления в должность премьер-министр Дауд Хан давно выступает за Пуштунистан и освобождение пуштунов в Афганистане. Это принесло ему популярность среди военных и кабульской элиты, но оттолкнуло от него поддержку непуштунского населения Афганистана. Амбициозный военачальник предложил операцию по отправке небольшого количества войск в Пакистанскую зону племен, что заставит хорошо вооруженные племена присоединиться к нашим силам. Вместе мы сможем осуществить мечту о Пуштунистане. С 1947 года пакистанские военные эвакуировали свои войска из территории племен, и их внимание к индийской границе означает, что наши войска могут войти туда без особого сопротивления. Военное командование утверждает, что операция будет легким маневром, который решит кризис в Пуштунистане решительно в нашу пользу."
 AFG_Revolution.2.d: "Недавно отряд солдат из Афганистана перешел на территорию пуштунских племен Пакистана, чтобы спровоцировать восстание против пакистанского государства. Однако операция закончилась полным провалом, так как местные племена, лояльные Пакистану, напали на афганцев, выиграв время для пакистанских сил, включая авиацию, чтобы прибыть и отогнать инфильтрантов. Это последняя провокация правительства премьер-министра Дауд Хана против Пакистана. Первоначально афганское правительство заявило, что нападение было совершено страстными пуштунскими племенами, стремящимися освободить своих соотечественников, но пакистанские военные представили СМИ пленных афганских солдат и документы, чтобы опровергнуть это заявление. Король Афганистана Захир Шах, как говорят, втайне разгневан действиями своего двоюродного брата."
 AFG_Revolution.3.d: "Недавнее вторжение афганских солдат в зону племен вместе с неустанной пропагандой Пуштунистана, исходящей из Кабула, привело в ярость правительство Пакистана. Оно решило принять ответные меры, начав блокаду сухопутной торговли с Афганистаном. Подавляющее большинство импорта в Афганистан поступает из пакистанских портов, и это решение, вероятно, нанесет ущерб афганской экономике, если она не найдет новых торговых путей. Это заявление вызвало гневные протесты афганцев у пакистанских дипломатических объектов по всей стране. Премьер-министр Дауд Хан назвал это решение актом войны и заявил, что Афганистану придется обратиться за поддержкой к другим соседям, намекая на расширение связей с Советами. Это заставило американцев призвать к восстановлению мира в обеих странах, так как они опасаются, что Советы используют напряженность, чтобы закрепиться в Афганистане."
 AFG_Revolution.4.d: "Премьер-министр Дауд Хан недавно подал прошение об отставке королю Захир Шаху после нескольких долгих и бурных лет пребывания у власти. Глубокая преданность и самоотверженность премьер-министра вопросу Пуштунистана сделали его невероятно популярным среди афганских пуштунов. Однако его неудачи в достижении решения по этому вопросу и пакистанская экономическая блокада нанесли огромный ущерб экономике страны. Это подорвало поддержку премьер-министра со стороны крупных непуштунских этнических групп. В условиях снижения своей популярности и упадка экономики премьер-министр обратился к королю с просьбой о расширении исполнительных полномочий. Для короля Захир Шаха это стало последней каплей, и он потребовал отставки. Вскоре после объявления об отставке правительство Пакистана заявило о снятии экономической блокады Афганистана. Несмотря на недавние неприятности, Дауд Хан остается популярным, и многие сейчас обвиняют короля в том, что он сместил премьер-министра по указке Пакистана."
 AFG_Revolution.5.d: "Король Афганистана Захир Шах официально утвердил новую конституцию страны. Документ расширяет демократические права и превращает страну в парламентскую монархию. Конституция призвана постепенно подготовить афганцев к демократии. Согласно ее положениям, члены королевской семьи не могут занимать должности министров. Это положение рассматривается как прямая атака на Дауд Хана, двоюродного брата короля. Несмотря на его популярность, новая конституция фактически отстраняет его от власти. Конституция фактически создает выборную нижнюю палату парламента, которая будет проверять королевские назначения. Хотя документ называют прогрессивным, некоторые наблюдатели сомневаются, не приведет ли он к конфликту между парламентом и советом министров, поскольку каждый из них будет стремиться утвердить себя над другим."
 AFG_Revolution.6.d: "Пока король Захир Шах восстанавливался после медицинской операции в Италии, его двоюродный брат, бывший премьер-министр Дауд Хан захватил власть в результате бескровного переворота. Афганские военные совершили переворот, быстро захватив ключевые правительственные здания и средства массовой информации. Через несколько часов Дауд Хан обратился к нации, заявив, что годы слабого правительства и сговора элит закончились. Он провозгласил, что Афганистан теперь будет республикой, а он будет главой государства. Король Захир Хан пока никак не отреагировал на это заявление, и, судя по всему, не произошло никакого контрпереворота. Дауд Хан долгое время был популярен среди военных за его щедрое финансирование их в качестве премьер-министра, а его национализм давно нашел отклик в народе, особенно среди многочисленного этнического пуштунского населения. Имея сильную базу популярности и поддержку военных, Дауд Хан, похоже, твердо стоит у власти."
 AFG_Revolution.7.d: "Из своего изгнания в Италии король Афганистана Захир Хан объявил, что отречется от престола и не будет участвовать в борьбе с новым режимом в Кабуле. Месяц назад, пока король проходил медицинскую операцию в Италии, его двоюродный брат и бывший премьер-министр Дауд Хан совершил бескровный переворот в Кабуле. Дауд Хан провозгласил страну республикой и упразднил монархию. Похоже, король понял, что его положение стало несостоятельным. Военные почти полностью присоединились к Дауд Хану. Кроме того, не было никаких крупных общественных восстаний или протестов против переворота, что свидетельствует о том, что народ в основном поддержал новый режим. Хотя кажется, что король покинут народом, многие рассматривают его решение отречься от престола как жест, направленный на обеспечение мира в жизни подданных. Ожидается, что в обозримом будущем Захир Хан останется в Италии."
 AFG_Revolution.8.d: "Потрясающие новости из Кабула: редактор ежедневной газеты НДПА "Парчам" Мир Акбар Хайбер был убит группой наемных убийц недалеко от своего дома. Хайбер, которого многие считают лидером фракции Парчам в НДПА, также пользуется глубоким уважением в конкурирующей фракции Хальк за свою историческую роль идеолога и основателя партии. Президент Дауд быстро возложил ответственность за нападение на исламских боевиков, но многие члены НДПА уже указывают на правительство Дауда, которое недавно ополчилось на своих союзников-парчамистов. Дауд недавно начал удалять членов НДПА из правительства и публично заявил о своем намерении отменить некоторые социалистические реформы, которые он обещал НДПА. Хотя никто не взял на себя ответственность, слухи ходят повсюду, некоторые эксперты полагают, что это могли быть члены Халька, надеющиеся добиться полного разрыва между парчамистами и Даудом. Тем не менее, многие афганцы также обвиняют в нападении американцев или Советы."
 AFG_Revolution.9.d: "На похоронах видного лидера НДПА и идеолога афганского коммунизма Мир Акбара Хайбера более пятнадцати тысяч членов НДПА вышли на улицы Кабула. Хайбер, редактор известной леворадикальной газеты, был недавно убит неизвестными недалеко от своего дома. Хотя президент Дауд осудил нападение и возложил вину на исламских боевиков, разгневанные участники марша НДПА скандировали антиправительственные и антиамериканские лозунги. Многие считают, что именно правительство, сотрудничающее с американцами, убило Хайбера. Выступавшие на похоронах видные члены НДПА поддержали эти настроения, что подогрело гневные скандирования. Похороны продемонстрировали президенту Дауду силу НДПА, а ее проникновение в вооруженные силы привело к тому, что солдаты не могут быть направлены на службу. Президент Дауд должен либо очистить НДПА, арестовать ее главных лидеров, выступивших на похоронах, либо вновь пригласить парчамитов в правительство и начать постепенную социалистическую трансформацию Афганистана."
  
 AFG_War.1.d: "Через несколько дней после похорон Мир Акбара Хайбера правительство начало репрессии против НДПА, и многие видные лидеры НДПА были заключены в тюрьму. Однако вместо того, чтобы сломить НДПА, эти действия подтолкнули фракции Парчам и Хальк к совместной работе. Хафизулла Амин, лидер Халька и самый видный член НДПА, не попавший в тюрьму, организовал сторонников в правительстве и армии. Когда правительство Дауда арестовало старшего лидера Нур Мухаммада Тараки, это заставило военных немедленно принять меры. Сторонники НДПА в армии повели танки и войска на захват министерства обороны и президентского дворца. Президент Дауд отказался сдаться, и начались тяжелые уличные бои, когда его президентская гвардия дала отпор. Однако, как только пилоты лояльные НДПА убили своего командира и направили истребители на бомбардировку лоялистов, сопротивление быстро ослабло. Президент Дауд, его семья и лояльные чиновники были убиты, и вскоре после этого афганские военные объявили об окончании монархического правления в Афганистане."
 AFG_War.2.d: "Через несколько дней после захвата страны военными было объявлено о передаче власти Революционному совету Демократической Республики Афганистан, контролируемому НДПА. Нур Мухаммад Тараки был избран президентом и премьер-министром. Такие видные лидеры, как Хафизулла Амин и Бабрак Кармаль из фракции Парчам, получили титул вице-президента. Фракция "Хальк" в НДПА явно лидирует, но они правят вместе с фракцией "Парчам", поскольку некоторые министерства были отданы ее членам. Новое правительство быстро провозгласило свою преданность исламу, веру в демократию и заявило о политике позитивного нейтралитета в отношениях с соседями. Учитывая количество коммунистов в партии, вооруженный характер переворота и чистки противников НДПА, многие наблюдатели сомневаются в искренности этих заявленных убеждений. Однако эксперты на Западе считают, что Тараки представляет националистическое правительство, а не коммунистическое, и готовы подождать и следить за ходом событий."
 AFG_War.3.d: "Недолгий союз между халькистами и парчамистами в НДПА недавно закончился. Президент Афганистана Нур Мухаммад Тараки приказал провести массовые аресты и чистки членов Парчам в правительстве и армии. Лидер Парчам Барбрак Кармаль находится за границей. Судя по всему, президент Тараки действовал под давлением своих коллег из фракции Хальк, которые видели в парчамистах нежелание предпринимать радикальные революционные шаги, необходимые для страны. Для обеспечения успеха революции, по их мнению, Парчам должен быть смещен. Массовые аресты и казни, по слухам, злят военных и ведут к углублению поляризации в подразделениях. Советские усилия по примирению обеих фракций в последние недели, очевидно, не увенчались успехом, и Москва, как говорят, недовольна чисткой Тараки."
 AFG_War.4.d: "Афганское правительство под руководством президента Нур Мухаммада Тараки объявило об агрессивной кампании по перераспределению земли, призванной разорить крупных помещиков и предоставить крестьянам собственные земли. Однако через шесть месяцев правительство тихо прекратило эту программу, поскольку она оказалась неудачной. Правительство объявило об ограничении количества земли, которой мог владеть каждый, лишние земли должны были быть перераспределены между крестьянами без компенсации прежним владельцам. Быстрота реформы в сочетании с отсутствием исследований и планирования привела к тому, что землевладельцы использовали лазейки, чтобы сохранить свои прибыльные земли, а многие крестьянские семьи захватили земли с низкой сельскохозяйственной ценностью. Количество собранных урожаев резко упало, и многие крестьяне живут на землях, которые не могут прокормить даже их семьи. Хотя правительство публично заявило, что кампания была успешной, многие афганские крестьяне разгневаны и еще больше обеднели из-за политики правительства."
 AFG_War.5.d: "Несколько месяцев назад, в рамках кампании по просвещению Афганистана и социальному развитию народа, президент Афганистана Нур Мухаммад Тараки инициировал ряд реформ, касающихся брака. В частности, была запрещена практика выкупа невесты. Эта реформа вызвала гневную реакцию, особенно среди традиционного сельского населения Афганистана. Они считают, что все эти практики являются частью афганских обычаев и ислама. Правительство обвиняют в том, что оно покушается на афганскую культуру и религию. Аналитики винят в этой реакции радикальный характер реформ и отказ НДПА работать с сельскими и религиозными лидерами перед их объявлением. Мусульманские ученые в Кабуле отмечают, что реформы, особенно запрет на выкуп невест, можно было бы легко обосновать с религиозной точки зрения, поскольку ислам запрещает такую практику, но правительство проигнорировало их, и теперь его обвиняют в антирелигиозности."
 AFG_War.6.d: "Постоянные чистки после Саурской революции подорвали военную поддержку президента Нур Мухаммада Тараки. Стремительные попытки его режима превратить Афганистан в современное социалистическое государство оттолкнули сельскую местность до такой степени, что по провинциям стали бродить вооруженные повстанцы. В Герате арест и жестокий допрос нескольких старших офицеров спровоцировал их людей на мятеж. Когда для подавления мятежа были посланы другие подразделения, они присоединились к ним. Вскоре местные повстанцы присоединились к мятежным солдатам и захватили Герат. Советские военные советники и их семьи, находившиеся в городе, были уничтожены. При советской помощи ответные действия правительства координировал вице-президент Хафизулла Амин, направивший крупные военные силы. После тяжелых боев, в ходе которых правительство нанесло по мятежникам множество авиаударов, город был взят. Хотя большинство мятежников и повстанцев были убиты, многим удалось бежать, и они уже присоединились к другим повстанческим силам в сельской местности."
 AFG_War.7.d: "Афганскому правительству президента Нур Мухаммада Тараки был нанесен серьезный удар, когда оно потеряло контроль над Гератом в результате действий повстанцев. Город был потерян после того, как несколько армейских подразделений взбунтовались, присоединились к местным повстанцам и убили верных правительству людей. При этом советники из СССР и их семьи также были убиты повстанцами. Наши советники в Кабуле помогли правительству принять ответные меры, и мы обеспечили надлежащую борьбу с повстанцами, когда правительственные войска вернули город. Однако этот инцидент свидетельствует о том, что ситуация в Афганистане становится все более хаотичной. Хотя президент Тараки предан делу преобразования своей страны по социалистическому образцу, он движется слишком быстро для народа. Кроме того, он оказался самодуром, и его чистки сужают его собственную базу поддержки. Нам придется внимательно следить за ситуацией, поскольку мы вложили значительные средства в эту страну и не можем позволить себе видеть, как один слабый правитель разрушает все, чего мы и афганский народ надеемся достичь."
 AFG_War.8.d: "После катастрофы в Герате президент Афганистана Нур Мухаммад Тараки был вынужден назначить Хафизуллу Амина премьер-министром. Восходящая звезда Амина вызвала раскол в правящей фракции халькистов НДПА. Амин укреплял свою собственную базу поддержки среди военных, и его назначение на пост премьер-министра указывает на то, что борьба за власть идет не в пользу президента Тараки. Это вызвало беспокойство Советов, поскольку Амин выглядит более независимым, чем Тараки, делая выпады в сторону Вашингтона и ставя под сомнение советское влияние на Кабул. Более того, он сопротивлялся попыткам Советов выступить посредником между ним и Тараки. Советы опасаются, что их соперничество за власть только ослабляет режим. К большому разочарованию Советов, во время недавней международной поездки президента Тараки Хафизулле Амину удалось убрать из армии четырех преданных сторонников Президента, что привело к эскалации напряженности в отношениях между ними."
 AFG_War.9.d: "Сегодня завершился конфликт внутри правящей фракции Хальк НДПА между президентом Нур Мухаммадом Тараки и премьер-министром Хафизуллой Амином. Напряженность обострилась после заседания Центрального комитета, на котором президент предложил создать новое коалиционное правительство с парчамистами для воссоединения НДПА. Тараки выполнял рекомендации Москвы, но премьер-министр Хафизулла Амин выступил против этих предложений, сплотил своих сторонников и блокировал предложения президента. Это разозлило Тараки и Советский Союз. Президент попытался отстранить Амина от должности, отправив его послом за границу, но Амин отказался. Наконец, Тараки пригласил Амина в президентский дворец для разрешения кризиса. Подозрительный Амин мобилизовал своих военных союзников, и по прибытии он и его сторонники были обстреляны. Амин скрылся на своей машине, а военные быстро приняли меры, задержав Тараки и его союзников из фракции Хальк.."
 AFG_War.10.d: "После того как президент Нур Мухаммад Тараки был отстранен от власти, Хафизулла Амин быстро занял пост президента. Его приход к власти был быстро подтвержден внутри Афганистана и Советами, которые призывали его замедлить темпы социалистических преобразований и расширить свою базу поддержки путем объединения НДПА. Вместо этого президент Амин вызвал раздражение Москвы, потребовав от нее заменить своего посла в Кабуле. Он также расширил чистки, еще больше подорвав афганское правительство и армию, на этот раз против сторонников Тараки. Дезертирство и беспорядки только усилились. Амин отказывается замедлить реформы и не хочет открывать переговоры с фракцией Парчам или сторонниками Тараки в партии НДПА. Вдобавок ко всему, его правительство недавно объявило о смерти бывшего президента Тараки от болезни, хотя, по мнению некоторых источников, он был убит по приказу Амина, что положило конец любым надеждам на примирение."
 AFG_War.11.d: "Советское правительство и лидеры партии НДПА опасались, что чистки и радикальные реформы бывшего президента Нур Мухаммада Тараки слишком сильно давят на афганцев, однако надежды на то, что его преемник, президент Хафизулла Амин, замедлит ухудшение ситуации, испарились. Вместо того чтобы обратиться к фракции Парчам или попытаться примириться со сторонниками бывшего президента Тараки, Амин вместо этого усилил масштабы и жестокость своей чистки против обеих групп. Его казнь Тараки не только усилила разногласия в НДПА, но и разозлила Советский Союз, который отчаянно хотел примирения. За пределами грязной борьбы за власть, сельская местность кажется почти полностью потерянной для правительства. Вооруженные силы в значительной степени развалены из-за чисток и политизации офицеров. Кроме того, многие солдаты переходят на сторону повстанцев, принося им оружие, современную тактику и разведданные. Многие лидеры НДПА в Кабуле умоляют Советский Союз о помощи в предотвращении краха правительства."
 AFG_War.12.d: "Сообщения из Афганистана невероятно тревожны. Вооруженные силы практически перестали функционировать, а президент Хафизулла Амин руководит кампанией массовых чисток против соперничающих левых. Все это позволило враждебным государствам финансировать и направлять повстанцев, которые теперь управляют почти всей сельской местностью. Мы вложили значительные средства в Афганистан и вырастили преданные кадры афганских коммунистов, которые ждут надлежащего руководства. Недавно мы получили предложение от более умеренной фракции НДПА "Парчам". Они предлагают нам помочь народу Афганистана отстранить Амина и его клику от власти и привести к власти парчамистов. Парчамиты утверждают, что они прекратят междоусобицу, создадут коалиционное правительство и восстановят доверие народа к правительству. Решение сейчас за нами, должны ли мы развернуть советские вооруженные силы, чтобы убрать Амина и спасти социализм в Афганистане, или позволить ему рухнуть и рисковать появлением нового антисоветского режима на нашей границе.."
 AFG_War.13.d: "После тщательного планирования мы начали операцию по обеспечению безопасности Афганистана и отстранению от власти Хафизуллы Амина. Состояние афганских вооруженных сил сильно ухудшилось из-за подъема повстанцев и волн чисток, начатых режимом Амина. Наши советники в этих подразделениях успешно заперли оружие, поставили тяжелое вооружение на техобслуживание и убедились, что важные офицеры были на встречах в ночь нашего вмешательства. В Кабуле мы успешно перебросили по воздуху элитные воздушно-десантные войска, которые быстро взяли под охрану ключевые здания и аэропорт. Президент Амин устраивал пышную вечеринку во дворце Таджбег за пределами Кабула. Ударная группа спецназа и КГБ возглавила штурм, успешно преодолев президентскую охрану и положив конец жизни жестокого тирана. В это время две дивизии наших войск пересекли границу и быстро начали занимать крупные города и поселки. Мы не встретили никакого сопротивления, и, несомненно, афганские военные с радостью приняли нашу помощь.."
 AFG_War.14.d: "Когда Афганистан был взят под контроль советскими войсками, Бабрак Кармаль быстро появился в Кабуле и был провозглашен новым президентом Афганистана. Хотя президент Кармаль утверждал, что находился в стране в течение нескольких месяцев, тайно работая против тиранического режима президента Амина, большинство наблюдателей считают, что Москва прилетела к нему, как только их войска взяли Кабул. Президент Кармаль поблагодарил Советы за то, что они приняли приглашение афганского правительства и народа помочь им в трудное время. Он уже пообещал освобождение политических заключенных и всеобщую амнистию. Кроме того, он пообещал создать демократические институты и провести выборы в ближайшее время. Его заявление вызвало одобрение среди сторонников НДПА, измученных многолетней междоусобицей, однако многие афганцы скептически относятся к тому, что эти высокие обещания могут быть выполнены, пока остаются советские войска. Уже сейчас оппоненты представляют президента Кармаля как нелегитимную марионетку и требуют немедленного вывода советских войск."
 AFG_War.15.d: "Советское правительство на недавнем заседании Центрального комитета приняло решение о плане вывода войск из Афганистана. Согласно принятому плану, советские войска уйдут с достоинством, создав дружественное и стабильное правительство для народа Афганистана. Советские войска, несомненно, выполнили свой долг и даже больше, но пришло время народу Афганистана продолжить борьбу. На первом этапе боевые действия перейдут от советских солдат к афганским. На следующем этапе афганское правительство должно начать политику примирения и расширить свою базу поддержки за счет привлечения бывших врагов. Наконец, Советский Союз будет добиваться международного признания афганского правительства и прекращения иностранной помощи моджахедам."
 AFG_War.16.d: "Советские военные подтвердили, что их войска больше не ведут активных боевых действий против повстанцев в Афганистане. Советские военные добавили, что они ответят на нападение, но боевые действия теперь будут вести сами афганцы. Афганские военные по-прежнему смогут использовать советскую артиллерию, авиацию и материально-техническую поддержку для своих операций. Советы сообщили, что даже эта поддержка будет постепенно сокращаться по мере того, как вооруженные силы Демократической Республики Афганистан будут обретать свою опору. Аналитики отмечают, что афганские военные печально известны своим уровнем дезертирства и ослаблением после советского вмешательства, но в ближайшее время ожидается огромный приток оружия и новые денежные стимулы. Советы надеются, что эта поддержка подстегнет вооруженные силы."
 AFG_War.17.d: "Советское правительство и руководители разведки давно пришли к выводу, что президент Бабрак Кармаль, хотя и лояльный Советскому Союзу, использовал советскую помощь для укрепления своей власти в Кабуле и не заинтересован в достижении национального единства в Афганистане. Шеф афганской разведки Мохаммад Наджибулла зарекомендовал себя как очень эффективный чиновник. Он произвел впечатление на советских наблюдателей, а его статус религиозного, сельского пуштунского лидера означает, что он может понравиться большинству моджахедов. Хотя президент Кармаль сопротивлялся, в конце концов он согласился назначить Наджибуллу в Секретариат и превратить разведывательный отдел в собственное министерство."
 AFG_War.18.d: "Недавно Советский Союз использовал дипломатическое давление и своих советников в Кабуле, чтобы повлиять на президента Афганистана Бабрака Кармаля и заставить его согласиться на вступление Мохаммада Наджибуллы в должность генерального секретаря партии НДПА. В течение нескольких недель Наджибулла заявил, что было установлено коллективное руководство, состоящее из него и Кармаля, который сохранил за собой несколько руководящих постов. Советы довольны этим сдвигом и призывают Наджибуллу медленно консолидировать власть, чтобы сохранить достоинство Кармала. Однако внутри НДПА стало ясно, что Кармаль сохраняет достаточно большое влияние, и Наджибулла в значительной степени зависит от его контроля над большим, безжалостным и эффективным аппаратом разведки. Приведет ли это к будущему конфликту, пока неизвестно."
 AFG_War.19.d: "Советы призывали Мохаммада Наджибуллу медленно отстранить Бабрака Кармала от власти из уважения к его лояльности Советскому Союзу. Однако теперь Наджибулла утверждает, что после нескольких месяцев напряженности ситуация стала несостоятельной. Недавно он представил доказательства того, что Кармаль частным и публичным образом подрывал его авторитет и недавно заявил, что скоро вернется на пост генерального секретаря. Наджибулла также добавил, что Кармаль в основном выступает против его идей национального примирения и использует свою поддержку в партии для его критики. Этот последний бит информации прямо препятствует советским усилиям по успешному выводу войск, и они дали Наджибулле разрешение действовать. Через несколько дней после получения разрешения, во время заседания НДПА, Наджибулла заставил партию лишить Кармала партийных званий. Затем Бабрак Кармаль принял советское предложение отправиться в изгнание в Москву, где он получит средства и квартиру. Теперь Наджибулла прочно контролирует ситуацию."
 AFG_War.20.d: "Президент Афганистана Мохаммад Наджибулла недавно объявил о политике национального примирения. Он заявил, что новая конституция ограничит президентскую власть, будет инклюзивной и пообещал, что членство в НДПА не является обязательным условием для занятия министерств. В своем обращении Наджибулла сделал пять предложений. Одним из них было немедленное прекращение огня правительственными войсками, которые будут сопротивляться только в случае нападения повстанцев. Второе предложение заключалось в том, чтобы предложить разделение власти с теми, кого он назвал контрреволюционными силами. Третьим была всеобщая амнистия вражеским бойцам, а четвертое и пятое обещания были гарантиями того, что правительство будет уважать афганскую культуру и придерживаться ислама. Чтобы еще больше отдалить режим от коммунизма, он также переименовал страну в Республику Афганистан. Советская сторона высоко оценила новую политику как средство вовлечения оппозиции в ряды правительства. Однако многие члены НДПА критикуют ее за предательство партийных ценностей, и ожидается, что многие группы моджахедов отвергнут ее."
 AFG_War.21.d: "Ахмад Шах Масуд долгое время был занозой для Советов и афганского правительства. Его подвиги при защите долины Панджшир и интервью в СМИ сделали его национальной фигурой. Недавно Масуд провел секретные переговоры с советской разведкой о прекращении огня. Масуд заявил, что готов прекратить боевые действия до тех пор, пока советские и правительственные войска остаются за пределами Панджшира и его окрестностей. Советы попросили президента Мохаммада Наджибуллу согласиться с этим прекращением огня, и если оно будет соблюдено, это может открыть путь для Масуда и его союзников даже в правительство. Однако, если Наджибулла согласится на прекращение огня и, по сути, предоставит Масуду свободу действий на его землях, он рискует вызвать отторжение сторонников жесткой линии в НДПА."
 AFG_War.22.d: "Режим прекращения огня между правительством Афганистана и командиром боевиков Ахмад Шахом Масудом остается в силе. Затишье в боевых действиях позволило афганским подразделениям в этом районе перегруппироваться, и командиры на местах просят разрешения начать новые наступательные действия против Масуда. Эти командиры, а также сторонники жесткой линии в НДПА утверждают, что нынешнее перемирие заставляет правительство выглядеть слабым, и если Масуд решит нанести удар по уходящим советским войскам, когда придет время, это будет катастрофой. С другой стороны, Масуд, очевидно, готов принять должность в кабинете министров и войти в правительство, если ему предложат. Привлечение Масуда стабилизирует часть страны и поможет поддержать программу национального примирения, однако многие лидеры НДПА опасаются, что такие шаги приведут к концу их партии и режима."
 AFG_War.23.d: "Иран спонсируют несколько предполагаемых партий бойцов сопротивления. Однако эти люди, как правило, иностранцы и в основном занимаются бандитизмом. Они очень осложняют ситуацию в западном Афганистане и сковывают многие наши силы. В рамках недавнего объявления о национальном примирении президент Наджибулла спросил своих министров, не следует ли ему использовать советские контакты и попросить иранцев согласиться на прекращение огня между правительственными войсками и этими партиями. Со временем мы сможем вернуть этих лидеров в правительство и укрепить страну. Однако многие члены кабинета выразили недовольство этим предложением, поскольку включение этих партий в состав правительства в конечном итоге ослабит НДПА и будущее режима."
 AFG_War.24.d: "Кабульский режим через советских посредников предложил прекращение огня с партиями моджахедов, действующими с нашей территории. После шестимесячного периода лидеры партий будут включены в состав центрального правительства, в то время как у бойцов будет выбор вступить в ряды афганских вооруженных сил. Это предложение, если оно будет принято, положит конец боевым действиям вдоль нашей границы, и мы больше не будем участвовать в боевых действиях в Афганистане. Однако такая сделка лишит нас роли в определении будущего Афганистана, что может привести к появлению антииранского режима. Наши варианты - убедить стороны принять соглашение о прекращении огня и умыть руки в Афганистане, либо отклонить предложение и продолжать поддерживать моджахедов, которые продолжают продвигаться к окончательной победе."
 AFG_War.25.d: "Западный Афганистан был относительно мирным с тех пор, как базирующиеся в Иране партии моджахедов и афганское правительство заключили соглашение о прекращении огня. Теперь для режима президента Мохаммада Наджибуллы настало время включить эти группы в состав центрального правительства или рискнуть возобновлением боевых действий. Хотя Наджибулла предложил партиям несколько незначительных постов, моджахеды, поддерживаемые Ираном, в ответ потребовали больше должностей в правительстве и армии. Принятие их требований приведет к ослаблению власти и влияния НДПА, но в значительной степени стабилизирует ситуацию в стране. Это будет воплощением разделения власти, и хотя власть центра будет ослаблена, это может спасти афганскую нацию. Советы хотят, чтобы мы согласились, но многие высокопоставленные чиновники НДПА выразили озабоченность тем, что объединение сторон чревато будущим уничтожением НДПА в Кабуле. Возможно, лучший вариант - прекратить переговоры, возобновить боевые действия и заставить их капитулировать на наших условиях."
 AFG_War.26.d: "Самые крупные и жестокие контрреволюционные группы происходят из так называемых партий, базирующихся в Пакистане. Эти группы пользуются иностранными добровольцами, помощью и обучением со стороны пакистанской разведки и военных. Эти партии в основном религиозные и традиционно выступают против нашего правительства. Однако, согласно плану национального примирения, президент Мохаммад Наджибулла рассматривает возможность использования советской помощи для предложения этим группам прекращения огня и возможного включения в состав правительства, разделяющего власть. Сейчас решается вопрос о том, предложить ли прекращение огня и надеяться на стабильность на юге Афганистана и в районе Кабула или отказаться от него. Противники прекращения огня в НДПА предупреждают, что включение этих партий может сделать правительство единства нестабильным. Кроме того, включение этих преимущественно пуштунских групп в состав правительства и вооруженных сил может привести к окончательному разрушению НДПА."
 AFG_War.27.d: "Советские агенты привезли предложение для групп моджахедов, действующих из Пешавара, о прекращении огня и последующем присоединении к правительству. Мы можем либо подтолкнуть партии к принятию и соблюдению прекращения огня, либо призвать их отказаться от него. Министерство иностранных дел считает, что присоединение этих партий может пойти нам на пользу и привести к формированию более дружественного правительства в Кабуле. Что еще более важно, такой сценарий может обеспечить окончательное решение проблемы Пуштунистана. Однако высокопоставленные военные и представители разведки выступают против прекращения огня. Они рассматривают это предложение как признак ослабления кабульского режима и считают, что если моджахеды, которых мы поддерживаем, смогут в конечном итоге победить, то это будет гарантией достижения наших целей."
 AFG_War.28.d: "Шестимесячное прекращение огня в основном соблюдается c пакистанскими моджахедами. Это принесло период беспрецедентного мира на юге Афганистана и в Кабуле. В ходе переговоров об инкорпорации партий мы предложили им небольшой процент мест и некоторые министерские полномочия. Однако они требуют не менее сорока процентов мест и некоторые высокопоставленные министерства. Некоторые чиновники утверждают, что мы должны согласиться и ввести их в правительство, чтобы показать людям, что именно НДПА принесла мир, такая популярность поможет нам на будущих выборах. Другие, особенно сторонники жесткой линии, хотят отвергнуть их и возобновить боевые действия. Они боятся, что эти партии подорвут суверенитет Афганистана своей пропакистанской позицией, и опасаются, что НДПА станет партией меньшинства, если в нее войдут новые повстанческие группы. Президент должен решить, включить ли эти партии в свой состав или продолжать войну."
 AFG_War.29.d: "Представители Советского Союза, Соединенных Штатов, Пакистана и Республики Афганистан подписали в Афганистане окончательное соглашение об урегулировании войны. В соглашении Пакистан и Афганистан договорились о нормализации отношений и обязались не вмешиваться. Это отвечает советской цели легитимизации своего клиента в Кабуле. Советы согласились с графиком вывода войск. Кроме того, США обязались прекратить поддержку групп моджахедов в Афганистане. Советы также должны прекратить поставки оружия в Республику Афганистан. И Соединенные Штаты, и Советский Союз согласились быть гарантами соглашения. Многие приветствуют это соглашение как начало мира в Афганистане. Однако наблюдатели отмечают, что моджахедам не было разрешено участвовать в соглашении, и многие скептически относятся к тому, будут ли они соблюдать соглашение."
 AFG_War.30.d: "Недавно заключенные Женевские соглашения предлагают график вывода советских войск, что является главной целью нашей афганской политики. Соглашение также предусматривает, что мы прекращаем поставки оружия моджахедам. Однако руководители ЦРУ и Конгресса призывают нас разрешить поставки оружия, тем более что пакистанцы готовы продолжать наши операции. Советы в течение многих лет подрывали нас по всему миру и стали причиной гибели многих наших граждан и союзников. Они утверждают, что мы должны продолжать заставлять их проливать кровь за свои действия. Другие члены администрации призывают нас выполнить свои обещания и положить конец конфликту. Они опасаются, что продолжение вооружений может еще больше дестабилизировать Афганистан и привести к непредвиденным последствиям."
 AFG_War.31.d: "Недавно заключенные Женевские соглашения на бумаге обеспечили несколько наших целей в обеспечении достойного вывода войск из Афганистана. Мы предоставили президенту Мохаммаду Наджибулле и его правительству большую международную легитимность и обеспечили график нашего вывода. Американцы и пакистанцы также согласились прекратить финансирование моджахедов. Во время переговоров мы обещали Наджибулле постоянную военную помощь, чтобы заставить его подписать соглашение. Теперь мы должны решить, будем ли мы продолжать оказывать военную помощь или нет. Многие наши военные и разведывательные советники считают, что мы должны продолжать вооружать Наджибуллу, чтобы сохранить наши обязательства и гарантировать, что мы оставим после себя стабильный Афганистан. Они также сомневаются, что американцы будут выполнять свои собственные обязательства. Другие советники предлагают соблюдать соглашение и прекратить поставки оружия. Эксперимент с Афганистаном уже оказался слишком дорогостоящим, и, возможно, лучше умыть руки."
 AFG_War.32.d: "В соответствии с Женевскими соглашениями, наши войска начали вывод из Афганистана. В соответствии с соглашением, это фронтальный вывод. За два месяца более половины наших сил вернулись на советскую территорию. Окончательный этап вывода войск наступает в ближайшее время и, вероятно, продлится еще шесть-семь месяцев. Однако вывод войск не обошелся без инцидентов. Временами наши войска подвергались сильному обстрелу со стороны боевиков моджахедов. Мы горько жаловались американцам и пакистанцам на эти инциденты, но они утверждают, что не могут повлиять на полевых командиров. Некоторые в Кремле утверждают, что рост насилия и ухудшение безопасности означают, что Женевские соглашения игнорируются, и мы должны временно остановить вывод войск, чтобы заставить их соблюдать. Это нереальный вариант, но было решено дать командирам разрешение временно остановить вывод войск, чтобы оказать давление на противника. Однако в конечном итоге Советский Союз не остановит вывод войск."
 AFG_War.33.d: "Командир нашей успешной операции по выводу войск стал последним советским солдатом, который официально пересек Оксус и ознаменовал окончание нашей дислокации в Афганистане. Последняя фаза вывода войск была завершена, хотя преследования со стороны моджахедов продолжались. Мы временно приостановили вывод войск, но моджахеды поймали нас на блефе, и нам пришлось возобновить операцию. Несмотря на эти проблемы, мы благополучно вернули наших людей и передали базы и тяжелое оборудование Республике Афганистан. Это был прощальный подарок нашим солдатам, которые выполнили свой интернациональный долг. Мы высоко держим голову, оставляя народу Афганистана стабильность и средства для защиты своего образа жизни. Наши собственные войска пересекли границу в колоннах, с улыбками и размахивая флагами. Мы сообщили об этом местным и международным СМИ, чтобы показать, что мы ушли по собственному желанию, а не в смятении или поражении.."
 AFG_War.34.d: "В окружении представителей СМИ последние советские войска пересекли Оксус, ознаменовав окончание советского вмешательства в Афганистане. Советские солдаты пересекали границу с широкими улыбками и размахивая флагами. Хотя Советский Союз создавал образ торжествующих солдат, возвращающихся домой после успешной миссии, по сообщениям из Афганистана, эти войска подвергались постоянным атакам моджахедов. Ситуация с безопасностью теперь находится в руках поддерживаемой Советским Союзом Республики Афганистан, и еще предстоит выяснить, смогут ли они справиться с бременем борьбы с многочисленными группами моджахедов и воссоединить разоренную войной страну. Соединенные Штаты приветствовали вывод советских войск, многие официальные лица и лидеры Конгресса назвали это окончанием жестокой иностранной оккупации. Многие добавили, что окончательным освобождением Афганистана станет устранение режима НДПА в Кабуле. Советы быстро раскритиковали американские заявления, назвав их безответственными и открытыми угрозами законному правительству Афганистана."
 AFG_PAK.24.d: "Сегодня мы получили письмо из Афганистана. В нем они просят создать автономный Пуштунистан вокруг Федерально управляемой территории племен. После обсуждения этого вопроса с вашим кабинетом министров было решено, что..."
  
 Afghani_Coup.1.d: "Хизб-и Сирри Иттихад - единственная политическая партия в нашей стране, которая действительно стремится к установлению республики. Они представляют собой очень разнообразную группу и были основаны в конце 1940-х годов. Они считают, что республиканское правительство - это единственный способ положить конец дискриминации по этническому и религиозному признаку в Афганистане. Сейчас мы обнаружили предполагаемый план государственного переворота во время празднования Навруза в марте. Как нам поступить в этой ситуации? Их мотивы связаны с мировоззрением их лидеров, а также с нашей этнической политикой и проблемой Пуштунистана."
 Afghani_Coup.2.d: "Хизб-и Сирри Иттихад" успешно совершила государственный переворот, монархия была свергнута, и мы назначили предстоящие выборы. По всей стране вспыхнули беспорядки в связи с внезапной сменой режима, и о наших недавних действиях стало известно на мировой арене. Мы создали небольшое временное правительство с Исмаэлем Балхи во главе до проведения выборов и провозглашения первой республики. В настоящее время наши высшие руководители работают над новой конституцией, которая будет включать принципы республики. Члены партии, представляющие все этнические и религиозные группы, из всех частей нашей страны, включая север, запад и центр, не только являются демократами, но и представляют все слои общества. Нами больше не правят боги и короли, нами правят принципы демократии, впервые заложенные в Древней Греции. Мы восстанем из пепла как новый Афганистан."
  
 Afghanistan.1.d: "Впервые за многие годы наш премьер-министр Шах Махмуд разрешил относительно свободные выборы в Национальное собрание, в результате чего будет избран седьмой парламент Афганистана. Многие партии, участвующие в выборах, придерживаются гораздо более умеренных и либеральных взглядов, либерализм - новая идеология, появившаяся в Афганистане. Политическая философия, зародившаяся на Западе в эпоху Просвещения. Она основана на свободе, согласии управляемых и равенстве перед законом. Многие партии планируют выступить с критикой нашего правительства и традиционных институтов, а также позволить оппозиционным политическим группам ожить и планируют провести либеральные реформы, такие как свобода прессы."
 Afghanistan.2.d: "Вопрос Пуштунистана является одним из наиболее важных политических событий в Афганистане после окончания Второй мировой войны. Линия Дюранда была установлена после того, как Афганистан потерял некоторые территории на востоке и юге Афганистана, которые были заселены пуштунами в 1893 году. Однако после раздела Индии в 1947 году правительство Афганистана утверждало, что линия никогда не была международной границей, и поощряло пуштунские общины устраивать "экскурсии" через границу на их законную территорию, и такое нарушение произошло, когда группа афганских пуштунских племен вторглась на перевал Богра, при этом афганское правительство отрицало, что захватчики состояли из афганских войск. Из-за отсутствия сотрудничества со стороны афганского правительства Пакистан ввел блокаду Афганистана для торговли и путешествий, но они готовы вести переговоры для обсуждения экономических и культурных вопросов, представляющих общий интерес для двух стран."
  
 HVA.1.d: "Управление долины Гильменда и Аргандаба (HAVA), расположенное в Лашкаргахе, Афганистан, было создано 4 декабря 1952 года как агентство правительства Афганистана. Оно было создано по образцу Управления долины реки Теннесси в США. В его компетенцию входили земли в провинции Фарах, провинции Газни, провинции Гильменд, провинции Герат и провинции Кандагар. HAVA было создано для управления экономическим развитием долин Гильменд и Аргандаб, в основном за счет ирригации и развития сельскохозяйственных земель вдоль реки Гильменд и реки Аргандаб, в рамках плана, который, по прогнозам, будет иметь первостепенное значение для будущей экономики Афганистана."
 AFG_PM.1.d: "Шах Махмуд Хан на посту премьер-министра принес нашей стране многие достижения в плане прогрессивной политики, такие как свободные выборы, но после его неудачной попытки реализовать весьма амбициозную ирригационную схему в западном Афганистане, серьезного экономического спада в последние несколько месяцев и напряженных отношений с Пакистаном, его время пришло, и парламент вынес вотум недоверия, вынудив его уйти в отставку. Теперь у нас есть выбор между Мохаммедом Дауд Ханом, прогрессивным политиком, и Гуламом Мухаммадом Гобаром, кого мы выберем?"
 SocDemAfg.1.d: "Одним из основных направлений деятельности премьер-министра был эксперимент шаха Махмуда по большей политической терпимости и либерализации. Поощряемый молодыми, получившими западное образование представителями политической элиты, премьер-министр разрешил проведение выборов в Национальное собрание, которые были явно менее контролируемыми, чем в прошлые выборы; результатом стал "либеральный парламент" 1949 года. Он терпимо относился к деятельности оппозиционных политических групп. Недавно созданный студенческий союз не только обеспечивал форум для политических дебатов, но и ставил театральные пьесы с критикой ислама и монархии. Газеты критиковали правительство, и многие группы стали требовать более открытой политической системы. Но либерализация зашла дальше, чем мог предполагать премьер-министр или кто-либо другой, поэтому он начал репрессии. Студенческий союз был распущен в 1951 году; газеты, критиковавшие правительство, были закрыты; многие лидеры оппозиции были посажены в тюрьму. Парламент, избранный в 1952 году, был большим шагом назад по сравнению с тем, который был избран в 1949 году. Короткий эксперимент с открытой политикой был закончен."
 AFG_REP.1.d: "Хизб-и Сирри Иттихад, возглавляемая Исмаилом Балхи, сегодня с одобрения Лойя джирги написала новую конституцию, провозгласив Республику Афганистан. Партия и их военизированные и горячие сторонники захватили власть и создали республиканское правительство. Преданные сторонники предыдущего правительства были заключены в тюрьму или казнены, в настоящее время через парламент проходят дебаты о равном отношении ко всем этническим группам и религиям в стране. Да здравствует Республика Афганистан!"
  
 USA_AFG.1.d: "Сегодня в нашем аэропорту нас встречал самолет ВВС США с президентом [USA.GetLeader] Соединенных Штатов Америки. Он встретился с нашим королем Мохаммедом Захир Шахом во дворце Таджбег. Хотя визит был неофициальным, обсуждалось многое, включая продолжение дипломатических связей Америки с нашей страной. Да благословит Аллах наших братьев на Западе!"
 AFG_SOV.1.d: "Сегодня мы получили письмо от Андрея Вышинского, министра иностранных дел Советского Союза. В нем говорится, что Советский Союз решительно выступает против миссии ООН в нашем государстве, что это дело рук американских империалистов, что все это уловка и американцы планируют строительство военных дорог и аэродромов вблизи границы. Оно было направлено нам вскоре после принятия седьмым Национальным собранием законопроекта о национализации нефти в этом регионе и приглашения в страну миссии технической помощи ООН. Они посетили район Шибарган на северо-западе, хотя и очень близко к границе с Советским Союзом, там были обнаружены богатые залежи нефти. Мы опровергнем эту ноту, разве они не понимают, что наш экономический успех зависит от автомобильного транспорта, и вся нефть в нашей стране представляет стратегический интерес?"
 AFG_SOV.2.d: "Несмотря на наше прекрасно написанное письмо, правительство Афганистана, похоже, отвергло письмо Андрея Вышинского, касающееся империалистических Соединенных Штатов и Организации Объединенных Наций в их участии в экономике Афганистана. Возможно, мы используем неправильный подход, вместо того, чтобы принуждать афганское правительство, как насчет того, чтобы побаловать их деньгами и оружием? Возможно, это привлечет их на нашу сторону. Мы рассмотрим возможность поставки оружия в следующем году или около того. Но пока мы будем бдительно следить за нашей южной границей."
  
 Afghanistan.10.d: "Сегодня был проведен арест Мохаммада Арифа, а также его преданных сторонников, после короткого судебного разбирательства он был признан виновным в планировании военного захвата власти в стране. По данным разведки, у него было много сторонников в Национальной Ассамблее, готовых подчиниться его правлению и сделать все, что он скажет. К счастью, мы раскрыли этот заговор до того, как из него что-то вышло. Надеюсь, это поможет нам сохранить стабильность и отучит других офицеров планировать что-то подобное, пусть это будет прекрасным примером того, что мы делаем с предателями!"
 Afghanistan.3.d: "Сегодня мы решили освободить Абдул Гаффар Хана, пуштунского борца за независимость, известного своей работой по прекращению правления Британского раджа в Индии, просто слишком много хлопот, чтобы держать его интернированным в нашем государстве. Будучи всю жизнь пацифистом и мусульманином, он часто требовал, чтобы пуштунам дали право выбора на создание независимого государства под названием Пуштунистан, состоящего из всех пуштунских территорий Британской Индии. С его вновь обретенной свободой, возможно, он сможет работать в нашу пользу, чтобы заставить пуштунов, живущих в настоящее время в Пакистане, сражаться на нашей стороне."
  
 Afghanistan.4.d: "Сегодня король нашей страны, Его Величество Мухаммед Захир Шах выступил с мощной речью по вопросу Пуштунистана, он потребовал, чтобы Пуштунистан был реинтегрирован в Афганистан, они по праву являются нашим народом и заслуживают того, чтобы мы управляли ими и представляли их, а не правительство Пакистана. Наш король глубоко эмоционально привязан к этому, потому что его прадед, Сардар Султан Мухаммад Хан, брат эмира Дост Мухаммад Хана, был последним афганским правителем Пешавара, когда сикхи вытеснили его в 1834 году при Ранджит Сингхе. Объединение Пуштунистана с Афганистаном имеет огромное значение, и он не успокоится до того дня, когда пуштуны воссоединятся со своей родиной."
  
 AFG_IND.1.d: "Сегодня мы получили письмо от афганского посла с грифом "строго конфиденциально". В нем говорится, что, пока Пакистан сосредотачивает большую часть своих войск на западе, мы должны провести внезапную атаку вдоль всей пакистанской границы, чтобы вынудить их к мирным переговорам, и как только они сдадутся, в последующем мирном соглашении мы получим весь Кашмир. Возможно, это положит конец нашей текущей проблеме о принадлежности Кашмира."
 AFG_IND.2.d: "Несмотря на амбициозность нашего письма, мы с удивлением узнали, что индийское правительство приняло наше предложение - напасть на Пакистан, чтобы захватить регион Кашмир, пока они заняты борьбой с нами, для скорейшего окончания этой войны. Возможно, теперь мы сможем исправить ошибку с линией Дюранда и разделением Британского раджа. Мы всегда знали, что у нас есть друзья на высоких постах в индийском правительстве, которые помогут нам выиграть нашу войну."
  
 AFG_IND.3.d: "Несмотря на наше стратегическое предложение индийскому правительству напасть на Пакистан и захватить регион Кашмир, за который идет горячая борьба. Мы с удивлением узнали, что наше предложение было отклонено, кто бы мог подумать, что индийское правительство так неумело использует хорошую возможность?"
  
 AFG_PAK.20.d: "Из полевого штаба армии вблизи пакистанской границы поступают сообщения, что мы провели успешный рейд против военной заставы в Пакистане, несколько пакистанских солдат были убиты, и мы украли все полезные припасы. Мы сомневаемся, что за это последует возмездие, мы позаботились о том, чтобы не оставить следов нашего присутствия. Наши парни на местах хорошо поработали, это точно!"
  
 AFG_PAK.21.d: "С одной из передовых оперативных баз нашей армии, расположенной недалеко от пакистанской границы, поступают сообщения о том, что операция, которую мы провели на территории Пакистана с целью сорвать военные действия, провалилась, несколько человек были убиты, многие пропали без вести. Это оперативный провал, и, возможно, нам следует пересмотреть нашу дальнейшую стратегию в отношении пакистанцев."
 AFG_PAK.22.d: "Мы получили отчет о результатах боевых действий от одного из наших самых опытных командиров, находящихся в настоящее время на афганской границе, в нем говорится, что мы успешно провели рейд на афганскую границу, они не смогли отразить нашу атаку. Во время попытки строительства пограничного забора мы убили трех солдат, ранили множество других и разрушили часть забора, отличная работа!"
 AFG_PAK.23.d: "Несмотря на все наши усилия и стратегическое планирование, наш пограничный рейд против афганской военной заставы внутри страны провалился, большинство наших солдат были убиты или успешно отступили. По всей видимости, в роте, которая проводила атаку, говорят, что они ожидали этого и держали наготове мины и пулеметные точки. Возможно, нам следует предвидеть подобное в следующий раз и ударить сильнее, давайте покажем этим афганцам, кто здесь хозяин!"
  
  #News Events 
 Afghani_Coup.3.d: "Из Королевства Афганистан пришло сообщение, что оно больше не является королевством. Предыдущий премьер-министр Шах Махмуд Хан был казнен сегодня в центре Кабула, его труп был выброшен на улицу. Статус правящего монарха Афганистана Мохаммеда Захир Шаха и остальных членов дома Баракзаев на данный момент неизвестен, что положило конец более чем 200-летнему королевскому правлению в Афганистане. Политическая партия Хизб-и Сирри Иттихад, ответственная за свержение, возглавляется человеком по имени Исмаил Балхи, мотивы захвата власти на данный момент неизвестны, но можно предположить, что они недовольны авторитарными методами предыдущей администрации. Все внимание приковано к новому правительству, и какие действия оно предпримет для улучшения условий жизни народа."
 Afghani_Coup.4.d: "Исмаил Балхи, поэт и известный политический лидер Афганистана, был арестован вместе с пятью другими людьми, которые пытались совершить государственный переворот против короля Мохаммеда Захир Шаха, а также убить премьер-министра. Правительство Афганистана успешно перехватило сообщения об этом и пресекло попытку до того, как она могла состояться. Все арестованные члены организации обвиняются в заговоре с целью свержения монархии и установления республики. Они планировали осуществить это во время празднования Навруза, чтобы попытаться застать правительство врасплох во время празднеств."
 CENTO.225.d: "После недавних переговоров и разрядки с Пакистаном. Сегодня из пресс-службы Багдадского пакта поступило сообщение о том, что недавно образованная Республика Афганистан присоединилась к альянсу. Багдадский пакт - это военный альянс, созданный по образцу НАТО, страны которого обязуются к взаимному сотрудничеству и защите. Целью организации является сдерживание Советского Союза путем создания линии сильных государств вдоль южной границы СССР."
 AFG_IND.4.d: "Сегодня было сделано заявление индийского правительства об объявлении войны Пакистану. Индийское правительство назвало это "простой мерой защиты нашего этнического народа", мотивируя это тем, что они обеспечивают стабильность в регионе Кашмир, поскольку не уверены в том, что может произойти с индусами в регионе после возможного поражения в текущей афгано-пакистанской войне. Возможно, это положит конец пограничным стычкам и конфликтам в регионе?"
 AFGPAKWAR.1.d: "После того, как напряжение достигло абсолютного максимума, Афганистан сегодня объявил о своем вторжении в Пакистан, заявив, что это вторжение направлено на предотвращение дальнейшего конфликта в регионе, а casus belli - освобождение законной земли, на которой живут пуштуны. Из города Чаман, расположенного недалеко от границы, приходят сообщения о том, что афганские солдаты прошли через город, не обращая внимания на гражданское население. Некоторые страны региона бойкотируют вторжение, и даже поговаривают о введении санкций против Афганистана. Будут ли вовлечены другие страны, остается неизвестным. Будущее этой части мира неясно."
 Afghanistan.6.d: "Сегодня в Кабуле правительство Афганистана созвало племенной совет. В него вошли члены Национальной ассамблеи. Афганский парламент выступил с прокламацией против Пакистана и в пользу права пуштунов на самоопределение. В нарушение установленных мировых норм и международных законов он принял резолюцию, отвергающую в одностороннем порядке все договоры, конвенции и соглашения, заключенные между правительством Афганистана и правительством Британской Индии. Совет принял резолюцию в поддержку Пуштунистана и объявил Соглашение Дюранда 1893 года, Англо-афганский пакт 1905 года, Договор о независимости Равалпинди 1919 года, Англо-афганский договор 1921 года и другие договоры и соглашения в отношении международной границы между Афганистаном и Пакистаном (основанной на линии Дюранда) и в отношении статуса пуштунов недействительными и не имеющими юридической силы. Кроме того, чтобы подтвердить эту отмену, было объявлено, что День Пуштунистана будет официально отмечаться каждый год 31 августа."
 AFG_SHIA.5.d: "С созданием новой Республики Афганистан под руководством Исмаэля Балхи монархии негде оставаться. В результате беспорядков по всей стране сторонники старой власти были вынуждены покинуть страну. Королевский дворец был разгромлен, а королевская семья бежала из страны. Куда они направились, пока неизвестно, но, по слухам, они якобы бежали в соседний Ирак или Иорданию. Никаких серьезных доказательств нет, и новое правительство, похоже, это не волнует. Теперь, когда монархии больше нет, мы можем положить конец дискриминации хазарейцев и таджиков и прекратить фаворитизм в отношении пуштунов, чтобы обеспечить истинное равенство в Афганистане."
  
