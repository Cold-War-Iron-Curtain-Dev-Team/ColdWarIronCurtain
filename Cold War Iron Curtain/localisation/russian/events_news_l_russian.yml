 saf_news.4.t: "Роберт Собукве, президент Панафриканского конгресса, приговорен к 3 годам тюремного заключения за подстрекательство чернокожих африканцев к сопротивлению законам об Апартеиде и другим недавним законодательным актам, ущемляющим гражданские свободы, особенно в отношении АНК и других проафриканских групп."
