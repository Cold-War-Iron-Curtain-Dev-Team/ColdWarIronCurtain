l_english:
 conquest.100.d: "Республика Корея сейчас находится на грани краха, поскольку ее столица Сеул только что была успешно захвачена наступающими северокорейскими войсками. Северная Корея, используя тактику, подобную блицкригу, использовала свои танки советского производства, чтобы быстро продвинуться к Сеулу, с тяжелыми потерями для южнокорейцев, так как у них нет никакого противотанкового оружия или танков вообще. Северокорейцы, стремясь уморить врага голодом, взорвали мост через реку Хань, захватив в плен тысячи солдат и гражданских лиц, которые отчаянно нуждаются в эвакуации и медицинской помощи. Это событие в Корейской войне показывает слабость поддерживаемой американцами Южной Кореи, и наблюдатели предполагают, что если эта тенденция сохранится, то капитуляция, как ожидается, произойдет в течение нескольких месяцев."
 conquest.101.d: "Надежда на демократию и гражданские свободы на Корейском полуострове вновь возгорелась, поскольку коалиция ООН, состоящая из Соединенных Штатов и ее союзников, сумела отбить Сеул у КНА, дислоцированной в гарнизоне, и оккупировать город. Победа, однако, была нелегкой, так как КНА установила оборонительные укрепления почти на каждом углу города, с баррикадами и противотанковыми орудиями, по всему Сеулу. Тем не менее, коалиционные силы смогли прорваться через сопротивление КНА, оказанное ими, и, наконец, отвоевать Сеул для Южной Кореи. Эта победа даст ясный сигнал Пхеньяну, что борьба за Корейский полуостров скоро придет к их берегам, и их земля будет окровавлена."
 conquest.102.d: "На Корейском полуострове вновь произошел перелом, ибо вмешательство Китайской Народной Республики вновь привело к падению Сеула, отвоевав его у коалиционных сил ООН. Коалиция, застигнутая врасплох и истощенная боем, подверглась обязательной эвакуации из Сеула в другие города на юге, но она деморализована и неспособна сражаться в это время. Это поражение сыграет решающую роль в решении судьбы Корейского полуострова, и пока наблюдатели считают, что коалиция Китая и Северной Кореи, скорее всего, победит. Однако те же наблюдатели сомневаются в своих прогнозах, поскольку многочисленные сообщения указывают на то, что китайские войска истощены и подавлены войной, и потребуется время и усилия, чтобы восстановить свои силы, что может открыть возможность для контратаки коалиционных сил ООН."
 conquest.103.d: "В свете поражения за поражением коалиционные силы ООН разработали операцию, которая сломит как китайские, так и северокорейские силы. Операция называется Потрошитель, артиллерийский обстрел всей Сеульской столичной области с последующей осадой этого района. Артиллерийский обстрел направлен на нанесение максимального ущерба китайско-северокорейской коалиции и минимизацию потерь коалиции ООН. Согласно нашим источникам на местах, это большой успех, с десятками тысяч жертв для китайцев и северокорейцев. Наблюдатели полагают, что, поскольку война длится уже так долго, ООН будет настаивать на заключении соглашения о перемирии, чтобы раз и навсегда положить конец конфликтам на полуострове."
 conquest.104.d: "Капитуляция Республики Корея наступает раньше, чем ожидалось, поскольку Северная Корея смогла прорвать периметр Пусана, единственную линию обороны для Южной Кореи и ее единственный крупный город, оставшийся, поскольку остальные были оккупированы Северной Кореей. На момент написания статьи остальная часть коалиционных сил ООН эвакуируется на остров Чеджудо, единственный остров, который не был затронут северокорейскими войсками. Однако, видя это, Северная Корея инициировала усилия по размещению дальнобойной артиллерии, способной нацелиться на остров Чеджудо, поэтому наблюдатели ожидают массовых жертв для жителей острова. С исчезновением Пусана ожидается, что Северная Корея будет претендовать на весь полуостров, а Южная Корея будет просто сведена к правительству в изгнании, аналогичному правительствам стран, оккупированных нацистами во Второй мировой войне."
 conquest.105.d: "Дни Корейской Народно-Демократической Республики сочтены, поскольку коалиционные силы ООН успешно вторглись в Пхеньян, столицу Северной Кореи, и оккупировали его. В разгар хаоса и неразберихи некоторые представители северокорейской элиты и видные правительственные чиновники смогли эвакуироваться из столицы, в то время как некоторым не повезло, и их судьба оказалась в руках коалиционных сил ООН, причем Ким Ир Сен был включен в число тех, кто эвакуировался. Это явная победа коалиции ООН, поскольку они окончательно оттеснили северокорейцев к горным хребтам, обеспечив капитуляцию в течение нескольких месяцев. Однако наблюдатели отмечают, что если в кризис вмешаются внешние силы, такие как Советский Союз или Китайская Народная Республика, то упомянутая победа будет временной и катастрофической в ближайшем будущем."
 conquest.106.t: "[GetNewspaperHeader]коалиционные войска приближаются к реке Ялу!"
 conquest.106.d: "В то время как коалиционные силы готовятся начать оккупацию Корейской Народно-Демократической Республики, сообщения из-за Ялу предполагают массированное военное наступление из Маньчжурии. На заседании ООН в начале года премьер Китайской Народной Республики Чжоу Эньлай предупредил, что \"Корея является соседом Китая... Китайский народ не может не быть озабочен решением корейского вопроса\". Генерал Макартур на недавней встрече с президентом Трумэном на острове Уэйк преуменьшил риск китайского вмешательства, заявив, что \"если китайцы попытаются добраться до Пхеньяна, там будет самая большая резня\". Несмотря на это, напряженность остается высокой в связи с перспективой эскалации."
 conquest.106.1.a: "Они не посмеют..."
 conquest.106.1.b: "Посмотрим, что сделает Мао..."
 conquest.106.1.c: "Теперь наша судьба в руках Мао..."
 conquest.106.1.d: "Американская агрессия не останется безнаказанной!"
 coronation.1000.d: "Его Величество Георг VI, король Соединенного Королевства и Британских доминионов и Последний император Индии был найден мертвым в своей кровати в Сандрингем-хаусе в Норфолке сегодня утром после почти двух лет ухудшения здоровья. Хотя он был вторым в очереди после своего старшего брата Эдуарда VIII, он оказался королем Британской империи на пороге того, что вскоре переросло во Вторую мировую войну. На протяжении всей войны присутствие короля Георга поднимало моральный дух подданных короны как дома, так и на фронте. Его дочь Елизавета стала королевой Елизаветой II и спешно возвращается на похороны из-за границы."
 NNE.1.d: "Loving v Virginia - судебное разбирательство, в ходе которого отменены все законы против межрасовых браков. Дело было передано в суд Милдред Лавинг и Ричардом Лавингом, межрасовой парой, которая была приговорена к тюремному заключению в Вирдгинии за то, что они поженились. Судебный процесс продолжался несколько дней, но в конце концов единогласно было решено, что запрет является неконституционным. \nПо всей стране наблюдается неоднозначная реакция, но большинство настроено очень позитивно в пользу правящего режима. Группы гражданских прав в настоящее время празднуют этот день и объявляют, что \"День любви\" официально является знаковым праздником гражданских прав."
 NNE.2.d: "По делу «Roe v Wade» официально заявили, что ограниченный доступ к абортам является неконституционным. Суд постановил, что положение о надлежащей правовой процедуре защищает право женщин на аборт. Государственные и федеральные ограничения на аборты были отменены. Roe v Wade вызвал национальные дебаты о том, должны ли аборты быть законными и в какой степени. \nСтрана, по-видимому, сильно разделена по этому вопросу, и низовые движения активизировались с обеих сторон. Лагерь сторонников абортов, который называет себя \"Сторонниками выбора\", защищает это решение, утверждая, что это выбор и право женщины. Лагерь против абортов, который называет себя \"За жизнь\", выступает против этого решения, говоря, что оно отнимает жизнь ребенка и что это аморально. \nНезависимо от чьих-либо взглядов, это решение будет определять политику США на долгие годы вперед."
 NNE.3.d: "ГДР объявила, что будет строить Дворец Республики. Дворец будет построен в Восточном Берлине для размещения парламента Германской Демократической Республики. Дворец планируется построить на месте бывшего Берлинского Штадтшлосса на площади. Дворец Республики будет служить как культурным, так и политическим зданием Германской Демократической Республики. \nБерлинский Штадтшлосс был разрушен во время Второй мировой войны и никогда не ремонтировался и не заменялся. Нехватка финансов и бюрократический тупик, возникший в результате массовых политических изменений, не позволили ему восстановиться."
 NNE.4.d: "По делу «Carey v Population Services International» официально постановили, что неконституционно запрещать любому лицу, кроме лицензированного фармацевта, распространять безрецептурные контрацептивы лицам до 16 лет. Кроме того, Carey v Population Services International также постановил, что лицам в возрасте до 16 лет никто не может отказать в контрацептивах. Суд постановил, что положение о надлежащей правовой процедуре 14-й поправки не позволяет государству вмешиваться в решения отдельных лиц по вопросам деторождения. Основной ответчик по апелляции, PSI, является некоммерческой корпорацией, дающая знания о контроле рождаемости и обеспечиапющяя контроль рождаемости. Вторичные аппеляторы - это преподобный Джеймс Хейден, который руководил программой по раздаче контрацептивов без рецепта, врачи, специализирующиеся на контроле над рождаемостью, и житель Нью-Йорка, который хочет раздавать контрацептивы своим детям."
 NNE.5.d: "«Планируемое родительство против Кейси» официально постановил, что Штаты могут принимать законы, регулирующие аборты после третьего триместра. Истцы оспорили 5 положений Пенсильванского закона о контроле за абортами 1982 года: \"неоформленное согласие; врач должен предоставить конкретную информацию за 24 часа до процедуры, включая уведомление о здоровье и жизнеспособности; женщина, ищущая аборт, должна уведомить отца о согласии на аборт; несовершеннолетние должны иметь согласие родителей\", в случае если прерывание беременности необходимо для предотвращения смерти матери \nТребования к отчетности; определенные мандаты по отчетности и ведению учета в учреждениях, предоставляющих аборты"
 NNE.6.d: "По делу «Abington School District v Schempp» официально постановили, что чтение Библии в государственных школах является неконституционным. Abington School District утверждал, что Библия является частью их учебной программы, а Schempp утверждал, что она нарушает светскость и свободу вероисповедания. После долгих слушаний и постепенной эскалации дело дошло до Верховного Суда. В ходе этого процесса был отменен закон Пенсильвании, обязывающий Abington School District проводить библейские чтения. В этом вопросе есть много разных мнений, разделенных и приводящих аргументы в пользу и против этого решения."
 NNE.7.d: "Основная авиакомпания ГДР, Deutsch Lufthansa, официально была закрыта из-за невыполнения квот на прибыль. Комментаторы, однако, говорят, что это было связано с неизбежным иском против авиакомпании ГДР за использование названия Lufthansa. Все активы Deutsch Lufthansa были переданы другой авиакомпании DDR-Interflug"
 NNE.8.d: "Сегодня Германская Демократическая Республика объявила о сносе Берлинского дворца. Дворец был объявлен символом прусского милитаризма и в результате будет разрушен. Снос будет проходить быстро и начнется в течение нескольких недель. Вальтер Ульбрихт, генеральный секретарь Центрального комитета, заявляет, что культурная символика и завещание дворца являются оскорблением трудящихся Народной Республики и социализма в целом. \nЕсть возражения, исходящие от людей внутри ГДР и за ее пределами, которые считают Дворец культурным и историческим памятником, который означает гораздо больше, чем просто милитаризм. \nСнос, по оценкам, займет 3-5 месяцев и будет взорвано 19 тонн динамита."
 NNE.9.d: "\nЛхамо Дхондруб, ныне известный как Тензин Гьяцо, был провозглашен 14-м Далай-ламой. Официально провозглашенный Далай-ламой в 1940 году, Тензин Гьяцо официально приступил к исполнению своих обязанностей в возрасте 15 лет. \nВ конце 1930-х годов Ретингу Ринпоче было видение, которое привело его в дом воплощения Далай-ламы, Лхамо Дхондупа. Сера-лама сообщил, что у Лхамо Дхондупа были старые четки, принадлежавшие 13-му Далай-Ламе, и мальчик сразу узнал Сера-Ламу. Лхамо Дхондуп также упоминал Сера-Ламу на диалекте 13-го Далай-ламы, который его биологическая мать не могла узнать. Ему подарили целый ряд вещей, некоторые из которых принадлежали Далай-ламе, а другие-нет. \nПринятие на себя обязанностей будет иметь серьезные последствия для буддистов всего мира и политического региона в целом. Решения и учения 14-го Далай-ламы проложат политический ландшафт на долгие годы вперед."
 NNE.10.d: "Элджер Хисс, американский правительственный чиновник, был обвинен в том, что он был советским шпионом и осужден. Доказательства против Элджера Хисса включают утверждение Уиттакера Чемберса, бывшего члена Коммунистической партии США, что Элджер Хисс был коммунистом. Хисс подал иск о клевете против Чамберса. Однако Чемберс также представил новые доказательства того, что и он, и Хисс были вовлечены в шпионаж. Суд будет действовать в свете этих доказательств и включать лжесвидетельство, поскольку некоторые из доказательств противоречат утверждениям, которые ранее сделал Элджер Хисс. Этот процесс вызвал новые дискуссии относительно масштабов советского шпионажа в Соединенных Штатах."
 NNE.11.d: "Трагическая авиакатастрофа в Свердловске унесла жизни 19 человек из хоккейной команды ВВС Москвы. Самолет, направлявшийся на матч, разбился из-за плохой погоды. Сильная метель вкупе с сильным ветром привела самолет в штопор, и он рухнул на землю. Только 2 из команды выжили. Бобров спал во время катастрофы, а Шувалов был ранен. \nВ память о погибших рядом с братской могилой в Кольцово возводится мемориал. Многие болельщики команды сейчас переживают утрату. \nВасилий Сталин, сын Иосифа Сталина и покровитель команды, теперь пытается набрать новую команду и рассчитывает, что все будут набраны в течение дня для большой игры."
 NNE.12.d: "Сенатор Кефаувер начал слушания по организованной преступности, являющейся серьезной проблемой в соответствии со статьями Соединенных Штатов 1949 года. Кефаувер уже заявил, что планирует опросить более пятисот человек на тему организованной преступности. Кефаувер публично заявил, что он считает, что крупная Сицилийская организация, основанная на семейных связях, управляет крупной мафией по всей территории Соединенных Штатов. Комитет планирует организовать общенациональную трансляцию этих слушаний на всю страну. Независимо от того, верен ли прогноз Кефаувера, это будет иметь большое значение, чтобы помочь понять и уничтожить проблему организованной преступности в Соединенных Штатах."
 NNE.13.d: "В районе Ассам-Тибет произошло мощное землетрясение магнитудой 8,6. Более 1526 человек погибли и 30000 ранены, а также сообщалось о значительном материальном ущербе. Геологические полевые исследования со всего земного шара направляются на место землетрясения, чтобы изучить его, и гуманитарная помощь прибывает со всего мира, чтобы помочь. Однако в шокирующем развитии событий есть сотни \"тёмных туристов\", которые прибывают, чтобы увидеть разрушение, но не намерены помогать. В отличие от ученых, которые избегают путешествовать по путям, препятствующим гуманитарным усилиям, туристические транспортные средства блокируют инфраструктуру и препятствуют гуманитарным миссиям. Несмотря на это, усилия по оказанию чрезвычайной помощи будут номинально продолжаться."
 NNE.14.d: "Папа Пий XII обнародовал Humani Generis, последнюю папскую энциклику. Энциклика направлена на рассмотрение многих мнений, которые, по мнению Папы, угрожают подорвать основы католической доктрины. В нем рассматриваются роль теологии, препятствия на пути поиска Бога, проблемы, которые папа имеет с современной культурой, некоторые богословские разработки, связанные с Католической Церковью после Второй мировой войны, и полигенизм. Кроме того, энциклика занимает тонкую позицию в отношении эволюции и утверждает, что гуманитарные науки не противоречат библейским учениям. Позиция по эволюции заставила многих теологов пересмотреть свои позиции, и многие религиозные люди оставили теорию молодой Земли позади."
 NNE.15.d: "Федеральное правительство США проводит длинную серию судебных преследований против коммунистической партии США. Группа была обвинена в нарушении закона Смита, закона, который налагает наказание на людей за пропаганду насильственного свержения правительства. Обвиняемые возражают, заявляя, что они хотят мирного перехода и что, несмотря ни на что, свобода слова защищает их взгляды и заявления. Заявления КПСША вызвали общенациональные дебаты по поводу свободы слова, которые привлекли людей по всей стране к аргументации в пользу права КПСША независимо от их личных убеждений или чувств по отношению к коммунизму."
 NNE.16.d: "После 4 месяцев и взорванных 19 тонн динамита Берлинский дворец был официально снесен, несмотря на возражения. Фундамент был настолько прочным, что вся гора здания осталась нетронутой даже тогда, когда оно упало на землю. Единственная секция, которая не была снесена, - это портал с балкона, где Карл Либкнехт провозгласил ГДР. На месте бывшего здания планируется строительство нового здания - Государственного Совета. Планирование и финансирование уже завершены и обеспечены, соответственно. Портал с балкона будет включен в новое здание, так как он считается важным для ГДР и ее культуры. \nБольшая часть артефактов внутри будет сохранена в хранилище, к незначительному облегчению для людей, которые считают здание культурно важным."
 NNE.17.d: "Сегодня Юлиус и Этель Роденберг предстали перед судом за шпионаж. Эти два человека и их сообщники были осуждены и имеют большую базу доказательств против них. Были найдены доказательства того, что они предоставляли СССР сверхсекретную информацию о радиолокационных, гидроакустических и реактивных двигателях. Кроме того, были найдены доказательства того, что они передавали СССР совершенно секретные данные о ядерном оружии, которые, как известно, теперь находятся в руках Советского Союза. \nПоследствия передачи данных о ядерном оружии советам весьма серьезны. До сих пор единственной страной, обладающей ядерным оружием, были США. Однако с потерей этих данных Советский Союз сможет начать строительство собственного ядерного оружия и представлять угрозу для западных держав. \nВыявление других шпионов, которые были вовлечены в это дело, продолжается, и ядерные исследовательские объекты страны находятся под блокировкой до тех пор, пока выявление не будет завершено."
 NNE.18.d: "По делу, «Деннис против Соединенных Штатов» постановили, что Деннис, генеральный секретарь КП США, не имеет защиты в соответствии с 1-й поправкой, если осуществление включает создание заговора с целью свержения правительства. Суд признал Денниса виновным в заговоре с целью свержения правительства и должен был понести наказание в соответствии с законом Смита. Деннис ранее утверждал, что никакого заговора не было и что он выступал за мирный переход к социализму. Десять других членов КПСША также были признаны виновными в пропаганде насильственного свержения правительства. Дело дошло до Верховного суда, и было вынесено решение шесть к двум в пользу наказания Денниса и других заговорщиков. Участники заговора КПСША были приговорены к 5 годам тюремного заключения со штрафом в размере 10000 долларов каждый."
 NNE.19.d: "Наводнения, обрушившиеся на побережье Северного моря этой зимой, имели разрушительные последствия для жителей Нидерландов, Великобритании и Бельгии. Водяные дамбы оказались неспособны сдержать набухающие приливы, заливая берега с небывалой яростью. Больше всего пострадали Нидерланды, которым был нанесен почти катастрофический ущерб, поскольку более 9% пахотных земель были разрушены, а по оценкам, погибло 1800 человек. Провинция Зеландия по-прежнему находится в состоянии беспорядка, поскольку сильный ущерб от наводнения затрудняет транспортировку и спасательные работы до тех пор, пока уровень воды не упадет. Ущерб в Южной Англии и Шотландии также был значительным: по оценкам, из-за наводнений погибло около 300 человек. Бельгия также пострадала от наводнения, хотя и в гораздо меньших масштабах, чем ее соседи."
 NNE.20.d: "Нью-Йоркские гиганты выйграли Национальную Лигу! \nБобби Томсон, аутфилдер и третий бейсмен \"Джайентс\", нанес удар по игровому хоумрану для команды питчера \"Бруклин Доджерс\" Ральфа Бранки. В заключительном иннинге Томсон построил трехкратный Гомер, выигравший игру против \"Доджерс\".это исторический момент для страны, поскольку игра впервые транслируется по национальному телевидению и ее видят миллионы зрителей, а еще миллионы слышат ее по радио. Этот победный удар официально объявляется \"выстрелом, услышанным во всем мире\", после выстрела, который начал революционную войну в 1776 году, потому что она транслируется очень многим американцам, включая зарубежных военнослужащих."
 NNE.22.d: "Серия журнальных статей под названием \"Человек скоро завоюет космос\" была опубликована в журнале Collier's Magazine. В статьях подробно описываются планы Вернера фон Брауна по пилотируемому космическому полету. Эти статьи вызвали огромный национальный интерес к космическим путешествиям и футуристический оптимизм. В статьях представлены подробные рисунки, картины и иллюстрации, созданные командой дизайнеров журнала и ошеломляющие читателей своими яркими представлениями о жизни в космосе. Страна уже обсуждает последствия космических путешествий и колонизации, а также то, что может сделать мир, если он будет использовать эти технологии."
 NNE.23.d: "Массовая забастовка была организована Объединенными сталелитейщиками Америки против 10 крупнейших сталелитейщиков в США, но была остановлена, поскольку президент Гарри Трумэн национализировал американскую сталелитейную промышленность перед уходом и дал рабочим повышение заработной платы. Сталелитейные компании, потерявшие контроль над своими предприятиями, теперь судятся с правительством, чтобы вернуть себе свою собственность. Если президент выиграет дело, хотя и маловероятно, то это может иметь серьезные последствия для авторитета способности правительства национализировать промышленность. \nСенатор Джозеф Маккарти официально осуждает президента за то, что он позволил известным коммунистам остаться на работе."
 NNE.24.d: "Претендент, Youngstown Sheet & Tube Co v Sawyer постановил, что президент не имеет полномочий национализировать промышленность, а сталелитейные заводы должны быть возвращены их частным владельцам. Верховный суд заявил, что без полномочий, предоставленных ему Конгрессом, президент не имеет права осуществлять государственный контроль над частной собственностью. Суд проголосовал шестью голосами против трех в пользу Youngstown Sheet & tube Co. Объекты немедленно передаются их бывшим частным владельцам, но ущерб от упущенной выгоды за то время, что объекты находились под государственным контролем, не возмещается."
 NNE.26.d: "В Южной долине Сан-Хоакин землетрясение магнитудой 7,3 нанесло ущерб в размере 2,6 миллиона долларов и по меньшей мере 11 человек погибли в городе Техачапи. Обрушились два железнодорожных туннеля, пострадал также город Бейкерсфилд. Кроме того, в результате подземных толчков были повреждены трубопроводы. Хлопок, растущий рядом с землетрясением, также был смещен. Бено Гутенберг, директор сейсмологической лаборатории Калифорнийского технологического института, был удивлен этим землетрясением. - \"Нет никаких сомнений, что вчерашнее землетрясение - самое крупное в Южной Калифорнии за последнее столетие.\" Американский Красный Крест объявил землетрясение крупным бедствием, в результате которого пострадало около 700 семей, однако доступ в этот район был затруднен из-за оползней."
 NNE.27.d: "Китайская республика на Тайване и Япония наконец-то объявили мир. Задержка в мирных переговорах была вызвана тем, что ни одно из китайских правительств не участвовало в Сан-Францисском договоре из-за Гражданской войны в Китае. Говорят, что Соединенные Штаты оказали серьезное давление на Японию, чтобы заставить ее подписать мирную конференцию. Текст договора похож на договор Франсиско, но он был отредактирован, чтобы соответствовать Китайской Республике. В договоре не упоминается, кто должен быть истинным владельцем Тайваня, а вместо этого в первую очередь рассматриваются японские претензии и граждане."
 NNE.28.d: "Тринадцать евреев были казнены в московской тюрьме на Лубянке. После ареста с июня 1949 года все подсудимые были обвинены в измене Советскому Союзю. Их суд - это показатель того, что Сталин теперь обращается против Еврейского антифашистского комитета, который помог еврейской культуре восстановиться после Холокоста. В числе этих тринадцати были убиты и пять еврейских писателей. Одна жертва, Соломон Брегман, потерял сознание, когда был вынесен смертный приговор, и до сих пор не пришел в себя. Лина Стерн, также осужденная, не была казнена из-за своей научной работы. Самое необычное, что здесь не было ни прокуроров, ни защитников, а только три военных судьи, которые задавали случайные вопросы."
 NNE.29.d: "Джонас Солк, американский медицинский исследователь, объявил на канале Си-би-эс, что он создал вакцину против изнурительной болезни полиомиелита. Солк принял подход Мориса Броди, который должен был убить штаммы полиомиелита и ввести их в человека. Солк говорит, что он пишет статью для Американской Медицинской Ассоциации, которая скоро будет опубликована. Это является крупным прорывом в лечении полиомиелита, поскольку в настоящее время он менее восприимчив к молодым людям, которые особенно страдают от него."
 NNE.30.d: "Даг Хаммаршельд был назначен вторым генеральным секретарем Организации Объединенных Наций в качестве основного непредвзятого кандидата. Он никогда не был связан с какой-либо политической партией, несмотря на свою службу в шведском правительстве, особенно в его дипломатическом корпусе. Он был единогласно назначен генеральным секретарем, и он будет продолжать править в течение пяти лет до 1958 года."
 news.1000.t: "[GetNewspaperHeader]Конец Нюрнбергского процесса"
 news.1000.d: "Нюрнбергский процесс наконец-то закончился спустя долгих 4 года. 24 важных деятеля бывшей нацистской Германии прошли через судебные разбирательства в 1945-1949 гг. за свои деяния, совершенные в ходе Второй Мировой: от ведения агрессивных войн до массового геноцида. Кроме того, 15 сподвижников Гитлера были приговорены к смертной казни или пожизненному заключению. 10 видных политических и военных деятелей нацистской Германии были приговорены к смертной казни через повешение. Впрочем, несколько других нацистских деятелей покончили жизнь самоубийством, ожидая приговора. Единственным, кто жалел о содеянном, оказался Шпеер. В тюрьму Шпандау будут заключены такие деятели нацистской Германии, как: Альберт Шпеер, Рудольф Гесс, Карл Дёниц и другие. Теперь весь мир может спокойно вздохнуть, ведь люди, что развязали одну из самых кровавых войн в истории человечества, находятся теперь под стражей."
 news.1000.a: "Все приспешники фашистов наконец наказаны."
 news.1002.t: "[GetNewspaperHeader]Закрытие Берлинского воздушного моста"
 news.1002.d: "СССР внезапно перекрыл всё наземное сообщение с Западным Берлином в июне 1948 года, чтобы заставить другие оккупационные государства выполнить его требования. В результате Западный Берлин не мог быть снабжен одеждой, медикаментами и даже продовольствием. Так что у стран НАТО возникла блестящая идея не настаивать на агрессивном ответе, а организовать воздушный транспорт. Только через 15 месяцев и высадку 277 264 самолетов блокада наконец закончилась без единого выстрела."
 news.1002.a: "Будем надеяться, что мир продлится дольше!"
 news.1002.b: "Мы могли бы сделать лучше..."
 news.1003.t: "[GetNewspaperHeader]Вспыхивает Корейская Война"
 news.1003.desc: "Корея находилась под властью Японии с 1910 года до Второй мировой войны. Когда в 1945 году Советский Союз объявил войну Японии, советские войска вошли в северную часть Кореи, а войска Соединенных Штатов освободили Южную. Оба участника войны заключили соглашение и разделили Корею на Северную и Южную. В конце концов они сформировали там свои правительства, и поэтому Север стал коммунистическим, а юг-капиталистическим. Но поскольку они оба утверждали, что являются законным правительством всей Кореи, конфликт обострился сегодня, когда северокорейские войска вошли в Южную Корею."
 news.1003.a: "Принем ли мы меры?"
 news.1003.b: "Коммунизм должен победить!"
 news.1003.c: "Это не закончится хорошо."
 news.1003.d: "У них нет ни единого шанса!"
 news.1003.e: "Нам нужна помощь!"
 pinyin_tt: "Все названия городов и штатов будут обновлены, чтобы использовать пиньинь"
 news.1004.t: "[GetNewspaperHeader]КНР создает упрощенный китайский язык"
 news.1004.d: "Сегодня Китайская Народная Республика изобрела упрощенный китайский язык для облегчения общения в своей огромной и разнообразной стране. Это также делает изучение китайского языка для людей во всем мире более доступным и более простым. Однако те части Китая, которые все еще говорят на своем родном китайском языке, такие как кантонский или маньчжурский, все еще хотят сохранить свою культуру и язык вместе с ними. Это вызвало некоторое недоверие к китайскому правительству."
 news.1004.a: "Пусть это объединит нашу страну."
 news.1004.b: "Отлично!"
 news.10004.d: "Китайское правительство опубликовало документ, объявляющий об официальной системе латинизации китайского языка под названием пиньинь. Система пиньинь-это результат сотрудничества ведущих китайских лингвистов по этому вопросу с Министерством образования. Правительство утверждает, что это облегчит правительству перевод иностранных документов и сделает китайский язык более доступным за рубежом. Что еще более важно, это позволит Китаю более эффективно распространять свои идеи и мнения по всему миру. Китайские правительства пытались создать латинизацию китайского языка с начала двадцатого века, и правительство Соединенных Штатов создало свою собственную систему, названную Йельской системой. Пиньинь должен был заменить йельскую систему, и китайское правительство быстро объявило пиньинь официальной системой латинизации китайского языка."
 news.1005.t: "[GetNewspaperHeader]Основание нового Китая"
 news.1005.d: "Китайская Народная Республика наконец-то выиграла свою гражданскую войну против Китайской Республики. Вторая фаза гражданской войны в Китае подошла к концу. Китайская республика и Китайская Народная Республика воюют уже 3 года. Даже до этого они воевали с 1927 года до 1936 года, но на время забыли о своих разнагласиях, когда Япония объявила войну. После Второй мировой войны в 1946 году боевые действия возобновились и до 1948 года находились в тупике. В 1948 году коммунистические китайские войска прорвались через Пекин и вошли в Центральный Китай, в результате чего сотни тысяч демократических китайских солдат были окружены. Только в конце 1949 года Китайская республика бежала на Тайвань и в другие части Юго-Восточной Азии. Премьер-министр Мао провозгласил новый Китай, который будет единственным сильным Китаем. Сотни тысяч людей собрались в Пекине, наблюдая за выступлением Мао Цзэдуна. Война в Китае пока успокоилась."
 news.1005.a: "Это может длится вечно!"
 news.1005.b: "Интересно."
 news.1006.t: "[GetNewspaperHeader]КНР учреждает Министерство иностранных дел"
 news.1006.d: "Китайская Народная Республика учредила Министерства иностранных дел в США и Советском Союзе. Китайская Народная Республика утверждает, что ее правительство является единственным истинным Китаем, в то время как Китайская республика - это \"Оккупированный Тайбэй\". На данный момент кажется, что СССР воссоздал новое китайское правительство, в то время как США все еще воссоздают Китайскую Республику как единый Китай. "
 news.1006.a: "Приветствуют ли они нас?"
 news.1006.b: "Добро пожаловать к нам!"
 news.1006.c: "Интересно."
 news.1007.t: "[GetNewspaperHeader]КНР объявляет о подписании китайско-советского договора"
 news.1007.d: "Китайская Народная Республика объявила о заключении договора с Советским Союзом. Сегодня утром в Пекине Китайская Народная Республика объявила, что подписала договор о дружбе с Советским Союзом. Он называется \"китайско-советский договор о дружбе, и союзе\". Договор включает в себя вывод советских войск из Маньчжурии и Даляня, транспортные соглашения и краткосрочный \"Союз\" вплоть до 1979 года. СССР и КНР дали понять Западу, что они будут стоять вместе, чтобы объединить народы мира под знаменем коммунизма!"
 news.1007.a: "Мы будем помогать друг другу"
 news.1007.b: "Это может стать опасным"
 news.1007.c: "Допустим..."
 news.1008.t: "[GetNewspaperHeader]КНР принимает план Маршалла"
 news.1008.d: "Китайская Народная Республика объявила, что она примет план Маршалла, предложенный Соединенными Штатами Америки. Теперь КНР получит инструменты и деньги для восстановления своей страны после Второй Мировой и Гражданской войн. Это стало шоком, поскольку многие думали, что КНР примет план Молотова от СССР. Это дало сильный сигнал СССР, потому-что КНР этим сказали что не будут марионеткой в руках СССР. США заинтересованы в заключении сделок с КНР и могут встряхнуть всю Восточную Азию."
 news.1008.a: "Мы будем помогать друг другу"
 news.1008.b: "Это может стать опасным"
 news.1008.c: "Допустим..."
 news.1009.t: "[GetNewspaperHeader]Китайская республика на Тайване"
 news.1009.d: "Вторая фаза гражданской войны в Китае подошла к концу. Китайская республика и Китайская Народная Республика воюют уже 3 года. Даже до этого они воевали с 1927 года до 1936 года, но на время забыли о своих разнагласиях, когда Япония объявила войну. После Второй мировой войны боевые действия возобновились и находились в тупике вплоть до 1948 года. В 1948 году коммунистические китайские войска прорвались через Пекин и вошли в Центральный Китай, в результате чего сотни тысяч демократических китайских солдат были окружены. Однако в этом году состоялись мирные переговоры с миссией Маршалла о возможном перемирии с разделением Китая или о мирном плане. Этот план провалился, и боевые действия продолжились с наступлением Янцзы на юг Китая. После нескольких разгромов Китайской Республики республиканское правительство бежало на остров Тайвань. Чан Кайши заявил, что Китайская республика продолжает жить и что однажды флаг Китайской республики будет вновь поднят над материковым Китаем. Сотни тысяч солдат и беженцев бегут в Тибет, Бирму, Таиланд и Тайвань."
 news.1009.a: "Они все еще живы?"
 news.1009.b: "Допустим."
 news.1010.t: "КНР декларирует политику одного Китая"
 news.1010.d: "Китайская Народная Республика только что объявила о своей политике единого Китая. В соответствии с этой политикой оба правительства (КНР и Республика Китай) согласны с тем, что существует только одно суверенное государство, управляющее материковым Китаем. Но они расходятся во мнениях относительно того, какое государство является законным правительством этого государства. Всякое другое государство, стремящееся к димпломатическим отношениям с Народной Республикой, должно разорвать отношения с Республикой и наоборот."
 news.1010.a: "Мы - законное правительство!"
 news.1010.b: "С кем мы пойдем?"
 news.1011.t: "[GetNewspaperHeader]КНР сближается с СССР"
 news.1011.d: "Во время своей московской миссии Китайская Народная Республика обратилась к СССР и провела дискуссии о будущем своих уездов."
 news.1011.a: "Будущее выглядит великолепно."
 news.1011.b: "Интересно."
 news.1012.t: "[GetNewspaperHeader]Государство [From.GetName] присоединяется к Варшавскому Пакту"
 news.1012.d: "Государство [From.GetName] официально вступил в Варшавский договор. Теперь они союзники и ещё больше раздвинули железный занавес."
 news.1012.a: "Отлично!"
 news.1012.b: "Интересно."
 news.1012.c: "Не хорошо."
 news.1013.t: "[GetNewspaperHeader]КНР создает собственный альянс"
 news.1013.d: "Китайская Народная Республика основала свою собственную фракцию. Она называется \"Народная объединенная азиатская Империя\". Планируют ли они расширить эту империю?"
 news.1013.a: "Наша Империя будет расти!"
 news.1013.b: "Интересно."
 news.1016.t: "[GetNewspaperHeader]КНР принята в ООН"
 news.1016.d: "Китайская Народная Республика была принята в Организацию Объединенных Наций в качестве 4 основных членов, Франция, Великобритания, Соединенные Штаты и Советский Союз проголосовали за. Единственной стороной, отказавшейся от этого, была Китайская республика. Они проиграли гражданскую войну, но, видимо, не хотят признавать свое поражение."
 news.1016.a: "Вместе мы сильны."
 news.1016.b: "Новое государство на нашей стороне!"
 news.1016.c: "Они будут желанными гостями."
 news.1016.e: "Враги навеки!"
 news.1017.t: "[GetNewspaperHeader]КНР не принята в ООН"
 news.1017.d: "Китайская Народная Республика не была принята в Организацию Объединенных Наций, поскольку один или несколько из четырех основных членов, Франция, Великобритания, Соединенные Штаты и Советский Союз проголосовали против, так же как и Китайская республика. Им нравится тот факт, что КНР не была принята."
 news.1017.a: "Мы старались изо всех сил."
 news.1017.b: "Держитесь подальше!"
 news.1017.c: "Интересно."
 news.1017.e: "Враги навеки!"
 news.1018.t: "[GetNewspaperHeader]Объединение Триеста"
 news.1018.d: "Сегодня в Лондоне был подписан лондонский меморандум между Великобританией, Соединенными Штатами, Италией и Югославией об объединении свободной территории Триест. И Италия, и Югославия согласились с требованиями договора. Италия получит зону А, которая включает в себя город Триест, а Югославия получит зону В, которая является сельской местностью внешнего Триеста. Это будет великий день для мирного объединения."
 news.1018.a: "Мы получили свою часть."
 news.1018.b: "Мы могли бы иметь обе части."
 news.1018.c: "Интересно."
 news.1019.t: "[GetNewspaperHeader]Триест не объединён"
 news.1019.d: "После переговоров в Лондоне Югославия решила отказаться от подписания Лондонского меморандума из-за того, что договор был слишком выгоден Италии. Они обвиняют Соединенные Штаты и Великобританию в том, что они встали на сторону Италии из-за того, что они следуют капиталистическим идеалам и хотят остановить падение города за железный занавес. Югославия не подпишет договор, и напряженность в Средиземноморье снова выросла."
 news.1019.a: "Почему?"
 news.1019.b: "Нам нужны обе части!"
 news.1019.c: "Волнительно..."
 news.1020.t: "[GetNewspaperHeader]Объединение Триеста"
 news.1020.d: "После новых переговоров в Лондоне Югославия решила отступить и подписала лондонский меморандум, чтобы не рисковать войной. Они все еще думают, что договор слишком выгоден Италии, но угроза мировой войны заставила их отступить. Напряженность в Средиземноморье была снижена."
 news.1020.a: "К счастью это не обострилось."
 news.1020.b: "Мы должны были это сделать."
 news.1020.c: "К счастью это не обострилось."
 news.1021.t: "[GetNewspaperHeader]Война за Триест"
 news.1021.d: "После нескольких дней напряженности переговоры между Югославией и Италией фактически сорвались. Обе стороны угрожают друг другу войной и решить вопрос о Триесте, но обе стороны по-прежнему утверждают, что они владеют Триестом. Только вчера ночью югославские войска пересекли границу Италии, а югославские спецназовцы вторглись в Триест и захватили город. Италия заявила, что они еще раз защитят свою страну и освободят город Триест. В Средиземном море разразилась война, и Восток и Запад так или иначе должны быть вовлечены в нее. Это темные времена, в которых мы живем."
 news.1021.a: "Мы должны сражаться сейчас!"
 news.1021.b: "Оно того стоит."
 news.1021.c: "О боже..."
 news.1022.t: "[GetNewspaperHeader]Объединение Триеста"
 news.1022.d: "После переговоров в Лондоне Италия решила отказаться от подписания Лондонского меморандума из-за того, что Италия получает только зону А Триеста, а не обе зоны. Они заявили в заявлении, что у них есть исторические документы, показывающие, что они владели всем Триестом, а не его половиной. Это привело к тому, что напряженность в Средиземноморье достигла небывало высокого уровня, а Югославия и Италия не могут прийти к единому соглашению."
 news.1022.a: "Мы должны были это сделать."
 news.1022.b: "Это отличная новость!."
 news.1022.c: "К счастью это не обострилось."
 news.1023.t: "[GetNewspaperHeader]Франко-Британский Союз"
 news.1023.d: "И снова французы и англичане сражаются в новой войне бок о бок. Была создана и отправлена в Египет новая англо-французская оперативная группа. Французский премьер-министр хочет сделать еще один шаг вперед и предложил союз между двумя странами. Министр заявил, что Соединенному Королевству и Франции необходимо объединиться, для борьбы с врагами Запада. Министр предложил присоединить Францию к Британской империи под названием Франко-Британского союза. Тогда англичане решили образовать Франко-Британский Союз. Французскому правительству потребуется некоторое время, чтобы интегрироваться в Британскую империю, но новый союз британцев и французов уже сформирован."
 news.1023.a: "Вместе мы сильнее!"
 news.1023.b: "Интересно."
 news.1024.t: "[GetNewspaperHeader]Тито мертв"
 news.1024.d: "Четыре короля, 31 Президент, шесть принцев, 22 премьер-министра и 47 министров иностранных дел прибыли в Белград, чтобы оплакать потерю маршала Тито, они прибыли с обеих сторон, чтобы выразить почтение нашему великому лидеру. Тито был объявлен мертвым в отделении сердечно-сосудистой хирургии Университетского медицинского центра в Любляне от гангрены всего через три дня после своего 88-летия."
 news.1024.a: "Покойся с миром Маршал."
 news.1024.b: "Он был великим Лидером."
 news.1025.t: "[GetNewspaperHeader]Конец Гражданской войны в Греции"
 news.1025.d: "После трех лет и шести месяцев боев, почти 50 000 убитых и тысячи пропавших без вести, Гражданская война в Греции закончилась. Гражданская война оставила Грецию в руинах, и её экономика страдает. Теперь должно последовать восстановление лучшей и сильной Греции. Убийства и насилие наконец закончились."
 news.1025.a: "Наконец-то мир в нашей стране."
 news.1025.b: "Интересно."
 news.1026.t: "[GetNewspaperHeader]Конец малайской чрезвычайной ситуации"
 news.1026.d: "Чрезвычайное положение в Малайе началось 16 июня 1948 года. После многих месяцев партизанской войны в джунглях Малайи чрезвычайное положение наконец-то закончилось. Сельская местность была разрушена, и многие люди все еще бездомны и ранены в боях. В настоящее время Малайя приступает к процессу восстановления и работает над тем, чтобы вновь объединить нацию. Содружество назвало это победой против того, чтобы остановить распространение коммунизма по всему миру."
 news.1026.a: "Наконец-то мир в нашей стране."
 news.1026.b: "Интересно."
 news.1026.desc: "Чрезвычайное положение в Малайе началось 16 июня 1948 года. После многих месяцев партизанской войны в джунглях Малайи чрезвычайное положение наконец-то закончилось. Сельская местность была разрушена, и многие люди все еще бездомны и ранены в боях. Майяла надеется стать более сильной страной теперь, когда народ наконец восстал. Содружество назвало это разочаровывающим поражением в Малайе, и что они сделают все, чтобы сдержать распространение коммунизма в других местах."
 news.1027.t: "[GetNewspaperHeader]Конец второй малайской чрезвычайной ситуации"
 news.1027.d: "Вторая чрезвычайная ситуация в Малайе закончилась после того, как коммунистические повстанцы получили больше поддержки и помощи от других коммунистических стран региона. В сельской местности снова начались бои, началась партизанская война. После долгого периода борьбы восстание было подавлено. Правительства Малайи и Содружества вновь объявили это победой над коммунизмом и что он больше не будет распространяться."
 news.1027.a: "Наконец-то мир в нашей стране, снова."
 news.1027.b: "Интересно."
 news.1027.desc: "Вторая чрезвычайная ситуация в Малайе закончилась после того, как коммунистические повстанцы получили больше поддержки и помощи от других коммунистических стран региона. В сельской местности снова начались бои, началась партизанская война. После долгого периода борьбы народное восстание увенчалось успехом. Демократическое правительство Малайи сейчас находится в изгнании, и коммунисты полностью захватили власть в стране. Малайское правительство заявило, что они однажды вернутся, чтобы забрать свою законную землю. Правительство Содружества заявило в ответ, что кампания Сердца и Умы просто не была такой успешной, как в прошлый раз. Будет ли в регионе еще одна война?"
 news.1028.t: "[GetNewspaperHeader]Советский Союз проводит свое первое ядерное испытание"
 news.1028.d: "В 7 часов утра 29 августа Советский Союз провел свои первые испытания ядерного оружия на Семипалатинском полигоне в Казахской ССР"
 news.1028.a: "Они представляют угрозу всему миру."
 news.1029.t: "[GetNewspaperHeader]Иосиф Сталин Умер!"
 news.1029.d: "Советский Союз только что объявил, что их лидер Иосиф Сталин скончался в возрасте 74 лет."
 news.1029.a: "Что же теперь?"
 news.1030.t: "[GetNewspaperHeader]Хрущев становится лидером Советского Союза"
 news.1030.d: "Никита Хрущев становится генсеком ЦК КПСС"
 news.1030.a: "Будем надеятся на мир."
 news.1031.t: "[GetNewspaperHeader]Советский Союз испытывает мощнейшую бомбу в истории"
 news.1031.c: "Отправим отчет в Верховный Совет и поблагодарим всех причастных к ее разработке"
 news.1031.d: "Русские объявили об успешном испытании мощнейшей бомбы в истории. Они назвали ее \"Царь-бомба\" - царем всех бомб!"
 news.1031.a: "Выразим формальный протест! Это ужасное изобретение!"
 news.1031.b: "Испытание такого необузданного оружия не останется незамеченным."
 news.1511.t: "[GetNewspaperHeader]Речь Хрущёва в ООН"
 news.1511.a: "Отношения между сверхдержавами хуже быть не могут"
 news.1511.d: "Через три дня после первой встречи с Фиделем Кастро Хрущев посетил Организацию Объединенных Наций 23 сентября 1960 года. Советский лидер верит, что коммунизм - это будущее и что Америку нужно сдерживать. В своем обращении к Генеральной Ассамблее ООН советский лидер пригрозил \"похоронить\" Америку"
 news.1512.t: "[GetNewspaperHeader]Дом Советов"
 news.1512.a: "Он похож на скрытого робота."
 news.1512.d: "Во время реконструкции города Кёнигсберга - ныне Калининграда - старый замок Кенигсберга, уже частично разрушенный бомбардировками Великой Отечественной войны, был снесен, чтобы уничтожить все следы прусского милитаризма. Областной секретарь ЦК КПСС принял решение заменить его зданием под названием Дом Советов, которое будет служить центром управления Калининградской областью. Его строительство начнется в ближайшее время и, надеюсь, будет завершено примерно через десять лет"
 news.1501.t: "[GetNewspaperHeader]Советские войска перешли границу Финляндии!"
 news.1501.d: "Мы всегда будем стоять за независимость Финляндии!"
 news.1501.a: "Начнется ли Вторая Зимняя?"
 news.1501.b: "Нам нужно что-то предпринять!"
 news.1501.c: "Мы освободим Финляндию от Запада, раз и навсегда!"
 news.1501.e: "We will always support Finnish Independence!"
 news.1502.t: "[GetNewspaperHeader]Финское правительство разрешило базирование советских войск!"
 news.1502.d: "Финское правительство предоставило советским войскаv право на базирование на своей территории. Советы заявили, что финны сделали правильное решение, избежав вооруженного конфликта. Русские заявили, что это приведет к лучшему сотрудничеству между двумя странами. Впрочем, в мировом сообществе это не осталось незамеченным и НАТО заявил, что такие действия являются вторжением во внутренние дела Финляндии. Каково же значение этого события для Скандинавии?"
 news.1502.a: "Приведет ли это к эскалации конфликта?"
 news.1502.b: "Великий союз был создан!"
 news.1502.c: "Это нарушает финскую независимость!"
 news.1503.t: "[GetNewspaperHeader]Финская армия встала на защиту своего Отечества!"
 news.1503.d: "Финское правительство наконец приняла решение после недолгих переговоров в кабинете правительства. Оно заявило, что такого рода \"защита\" является неуважением к финской независимости. Финская Армия встала на защиту своей родной Суоми. Она будет защищать её до последнего патрона и, если придется, последней капли крови. На данный момент уже поступают сообщения о боях в Восточной Финляндии. Разгорелась Вторая Зимняя война. Кто победит в этот раз?"
 news.1503.a: "Кто же победит в этой войне?"
 news.1503.b: "Мы поддержим финскую независимость, как бы то ни было."
 news.1503.c: "Раскрывайте ж теперь нам доверчиво половинки широких ворот!"
 news.1503.e: "\"Призываю на священную войну с врагом нашей нации!\""
 news.1504.t: "[GetNewspaperHeader]Разгорается Вторая Зимняя война!"
 news.1504.d: "Советский союз атаковал Финляндию. Советские парашютисты уже высадились вокруг стратегически важных городов, а колонны советских танков и пехоты пересекли границу Финляндии. Финская армия открыла ответный огонь. Поступают сообщения о тысячах беженцах, пытающихся пересечь границы соседних Норвегии и Швеции. НАТО пока еще не сделал заявлений, но факт остается фактом: война между Советским Союзом и Финляндией началась."
 news.1504.a: "О, еще одна Зимняя Война? Кто победит?"
 news.1504.b: "Принимай нас, Суоми-красавица!"
 news.1504.c: "Мы все равно будем помогать Финляндии, как бы то ни было."
 news.1504.e: "Нет, Хрущев! Ты врешь даже больше, чем Молотов!"
 news.1505.t: "[GetNewspaperHeader]Основана Финская Демократическая Республика!"
 news.1505.d: "Финский народ решил свергнуть старое правительство. Коммунисты празднуют победу, видя в ней начало мировой революции. Западные державы назвали это величайшей потерей союзника в восточном регионе. Беженцы пересекают границы Норвегии и Швеции, стараясь избежать так называемой \"коммунистической тирании\". В Хельсинки уже отмечают коммунистическую революцию."
 news.1505.a: "Что же случится теперь?"
 news.1505.b: "Добро пожаловать в Содружество, финские друзья!"
 news.1505.c: "Мы потеряли важного союзника."
 news.1505.e: "Так поможем же Революции!"
 news.1506.t: "[GetNewspaperHeader]Сформирована Финская ССР!"
 news.1506.d: "Финская Республика согласилась быть интегрированной в так называемые \"советские республики\". Коммунисты празднуют победу, видя в этом событии начало мировой революции. Западные державы назвали это величайшей потерей союзника в восточном регионе. Беженцы пересекают границы Норвегии и Швеции, стараясь избежать так называемой \"коммунистической тирании\". В Хельсинки уже празднуют вхождение в состав СССР."
 news.1506.a: "Что случится теперь?"
 news.1506.b: "Добро пожаловать в Союз, финские друзья!"
 news.1506.c: "Мы потеряли хорошего союзника в регионе."
 news.1506.e: "Поможем революции!!"
 news.1507.t: "[GetNewspaperHeader]Гражданская война в Финляндии"
 news.1507.d: "Вспыхнула гражданская война между Финской Республикой и Финской Демократической Республикой. Финские коммунисты уже атакуют правительственные войска. Финское правительство заявило о готовности подавить бунт в срочном порядке. Советская сторона заявила о готовности помочь финским коммунистам. НАТО заявил, что готов помочь правительственным войска чем только сможет."
 news.1507.a: "Что случится теперь?"
 news.1507.b: "Мы должны помочь финским революционерам!"
 news.1507.c: "Мы должны принять коммунизм! Долой буржуев!"
 news.1507.e: "Прикажите армии подавить этот жалкий бунт!"
 news.1508.t: "[GetNewspaperHeader]Финляндия оккупирована СССР!"
 news.1508.d: "Финская республика приняла решение о вхождении в состав СССР. Советская сторона заявила, что это отличное решение для развития дружбы между двумя народами. Запад назвал это потерей хорошего союзника. Беженцы пересекают границы Норвегии и Швеции, стараясь избежать \"Красных и их тирании\". Хельсинки уже празднует воссоединение с СССР."
 news.1508.a: "Что случится теперь?"
 news.1508.b: "Наконец-то мы объединились!"
 news.1508.c: "Мы потеряли союзника в этом регионе."
 news.1509.t: "[GetNewspaperHeader]Конец Финско-Советского кризиса"
 news.1509.d: "Финско-Советский кризис разрешен. Обе стороны подписали соглашения о дальнейшей судьбе Финляндии и всего Северо-Восточного региона. Главы НАТО и ОВД заявили, что рады мирному разрешению кризиса. Будем надеется, что мир будет долгим."
 news.1509.a: "Да будет мир."
 news.1510.t: "[GetNewspaperHeader]Великое Чилийское землетрясение"
 news.1510.d: "Названная \"Великим Чилийским землетрясением\", Геологическая служба Соединенных Штатов задокументировала эту катастрофу как самое крупное землетрясение, когда-либо зарегистрированное человечеством. 22 мая 1960 года было зафиксировано \"Великое Чилийское землетрясение\" магнитудой 9,5, вызвавшее цунами, охватившее территорию от Чили до Азии. Последствия землетрясения оставили 2 000 000 человек без крова и работы. Само цунами прокатилось по большей части Чили, Новой Зеландии, Филиппинам, Японии, Перу, Эквадору, Калифорнии и многим другим островным территориям, которые по сей день оспариваются иностранными державами. Аргентина и Боливия также были опустошены в результате землетрясения в соседних регионах, затронувшего Чили. Ущерб, нанесенный землетрясением, оценивается в сумму от 400 до 800 миллионов долларов."
 mccarthy.1.d: "Республиканец от штата Висконсин Джозеф Р. Маккарти впервые выиграл выборы в Сенат в 1946 году во время кампании, отмеченной большим количеством антикоммунистических травлей. Отчасти в ответ на победы Республиканской партии президент Гарри С. Трумэн попытался продемонстрировать свою озабоченность угрозой коммунизма, создав программу лояльности для федеральных служащих. Он также попросил Министерство юстиции составить официальный список из 78 подрывных организаций. В преддверии промежуточных выборов бывший сотрудник Госдепартамента Элджер Хисс, подозреваемый в шпионаже, был осужден за лжесвидетельство. Маккарти в своей речи в Уилинге, Западная Виргиния, предпринял атаку на внешнеполитическую программу Трумэна, обвинив Государственный департамент и его секретаря Дина Ачесона в укрывательстве коммунистов. Существует некоторый спор о количестве коммунистов, о которых якобы знал Маккарти. Хотя предварительные копии этой речи, распространенные в прессе, их насчитали 205 штук, Маккарти быстро пересмотрел это утверждение. И в письме, которое он написал президенту Трумэну на следующий день, и в \"официальной\" стенограмме речи, которую Маккарти представил в Конгресс десять дней спустя, он использует число 57. Хотя Маккарти показал этот список имен как в Уилинге, так и позже в Сенате, он никогда не делал этот список публичным."
 MZB.2.d: "В течение многих лет Мозамбик пытался всеми возможными способами освободиться от португальского колониального господства. Теперь они вступили в жестокий конфликт против португальцев, причем ФРЕЛИМО является главной силой, стоящей за этим. Помимо независимости, цель ФРЕЛИМО - провести социальную реформу и ликвидировать правящую элиту."
 ire.1.d: "Рейс 633 авиакомпании KLM разбился сразу после взлета из аэропорта Шеннон по пути из Амстердама в Нью-Йорк. Самолёт выбросило на берег реки Шеннон в результате аварии погибли 28 человек."
 raj.1.t: "Кашмирский конфликт"
 raj.1.d: "Конфликт с Пакистаном за регион Кашмир всё больше и больше нарастает. Агрессия пакинстанцев по отношению к нам дошла до предела: в любой момент может начаться война. Должны ли нанести упреждающий удар и покончить с ними?"
 raj.1.a: "Мы ударим первыми!"
 raj.1.b: "Уладим всё дипломатически"
 raj.2.t: "Индия объявляет войну!"
 raj.2.d: "Под предлогом конфликта в Кашмире, Индия объявила нам войну. Они начали массированную атаку на наши земли! Мы должны покарать этих предателей."
 raj.2.a: "В атаку!"
 raj.5.t: "Референдум в Пондичерри"
 raj.5.d: "Индия и Франция достигли договорённостей о статусе французских поселений 13 октября 1954 года. Пять дней спустя, избранные члены ассамблеи и местные члены муниципалитета городов Пондичерри и Карайккал провели референдум. Из 178 голов, подавляющее большинство в 170 голосов проголосовало за присоединение к Индии. Три дня спустя фактическая передеча земель состоялась между франзцускими и индийскими дипломатами в Нью-Дели."
 raj.5.a: "Великолепно!"
 raj.6.t: "Референдум в Пондичерри"
 raj.6.d.: "India and France, following talks, issued a joint statement on October 13, 1954 announcing a procedure for deciding the status of the French settlements. Five days later, on 18 October 1954 the elected members of the Representative Assembly and the municipal councilors of Pondicherry and Karaikkal took part in a referendum at Kizhur. Of the 178 members voting, an overwhelming majority of 170 members favored the merger of French Indian territories with the Republic of India. Three days later, an agreement on the de facto transfer of the French territories to India was signed in New Delhi between the two countries."
 raj.6.a: "Жаль, что они не голосовали за нас."
 raj.7.t: "Потребовать Гоа"
 raj.7.d: "Годами мы пытаемся выторговать Гоа у португальских империалистов. Их заявления о правах на эти земли, которые тысячелетиями принадлежали нам, абссурдны. Португалия бьётся за свои колонии по всему миру, в особенности за африканские, и не сдаст их без боя. Если так, то нам придётся прибегнуть к силе..."
 raj.7.a: "Гоа - индийская земля!"
 raj.7.b: "Уладим всё дипломатически"
 raj.8.t: "Война с Индией!"
 raj.8.d: "Мой премьер! Индия предательски объявила нам войну! Они требуют Гоа - нашу исконную территорию! Мы усилили там гарнизон, но они всё ещё превосходят нас числом в разы. Стоит ли послать подкрепление?"
 raj.8.a: "Пошлите подмогу!"
 pak.1.t: "Кашмирский конфликт"
 pak.1.d: "Конфликт с Индией за штат Кашмир всё больше и больше нарастает. Агрессия индусов по отношению к нам дошла до предела: в любой момент может начаться война. Должны ли нанести упреждающий удар и покончить с ними?"
 pak.1.a: "Мы ударим первыми!"
 pak.1.b: "Уладим всё дипломатически"
 pak.2.t: "Пакистан объявляет войну!"
 pak.2.d: "Под предлогом конфликта в Кашмире, Пакистан объявил нам войну. Они начали массированную атаку на наши земли! Мы должны покарать этих предателей."
 pak.2.a: "В атаку!"
 news.500.t: "[GetNewspaperHeader]Кашмирский конфликт"
 news.500.d: "Индия напала на Пакистан! Под предлогом защиты Кашмира они вторглись в Восточный Пакистан. Судьба Кашмира до сих пор неизвестна."
 news.500.a: "Можно было просто договориться..."
 news.501.t: "[GetNewspaperHeader]Кашмирский конфликт"
 news.501.d: "Пакистан напал на Индию! Под предлогом защиты Кашмира они вторглись в Индию. Судьба Кашмира до сих пор неизвестна"
 news.501.a: "Можно было просто договориться..."
 news.502.t: "[GetNewspaperHeader]Война за Гоа!"
 news.502.d: "Индия напала на Португалию! Они утверждают, что Гоа должно пренадлежать им, а не португальцам. Индия активно штурмует позиции Португалии в Гоа."
 news.502.a: "Интересно."
 swe.2.d: "13 июня 1952 года невооруженный шведский военно-морской самолет, известный как Tp 47 \"Catalinan\", был сбит советским МиГ-15 за пределами Готланда после того, как он искал другой шведский самолет, пропавший без вести в Балтийском море. Это привело к тому, что многие шведы протестовали у здания советского посольства в Швеции. Четыре года спустя Никита Хрущев признался премьер-министру Швеции Таге Эрландеру, что советские войска сбили самолет. Однако шведское правительство решило сохранить это в тайне, и только в 1991 году эта информация была распространена среди общественности, после того как бывший советский полковник признался общественности, что он приказал сбить его. Считается, что это произошло из-за того, что шведские самолеты неоднократно нарушали советское воздушное пространство и тайно фотографировали советские корабли, которые затем отправляли НАТО."
 news.1513.t: "[GetNewspaperHeader]Смерть Джими Хендрикса"
 news.1513.d: "Знаменитый гитарист Джими Хендрикс скончался в возрасте 27 лет. Точная причина смерти пока неясна, и 30 сентября в Лондоне должно состояться коронерское расследование. Однако полиция утверждает, что это была передозировка от наркотиков. Говорят, он принял девять таблеток снотворного и умер от удушья из-за рвоты. За несколько дней до своей смерти Хендрикс был слаб здоровьем, отчасти из-за усталости, вызванной переутомлением, хроническим недосыпанием и предполагаемой болезнью, связанной с гриппом. Неуверенность в своих личных отношениях, а также разочарование в музыкальной индустрии также способствовали его разложению. Хотя подробности его последних часов и смерти оспариваются, Хендрикс провел большую часть своего последнего дня жизни с Моникой Даннеманн. Утром Даннеманн застал Хендрикса без сознания в ее квартире в гостинице \"Самарканд\". Она вызвала скорую помощь в 11:18 утра, и Хендрикса отвезли в больницу Святой Марии аббат, где была предпринята попытка реанимировать его. Он был объявлен мертвым в 12:45."
 news.1513.a: "Жизнь происходит быстрее, чем моргание глаз"
 news.1514.t: "[GetNewspaperHeader]Мэрилин Монро Умирает; Виноваты Таблетки"
 news.1514.d: "Мэрилин Монро, беспокойная красавица, которая не смогла найти счастья в качестве самой яркой звезды Голливуда, была обнаружена мертвой в своем Брентвудском доме от явной передозировки снотворного.\nМонро страдала от психических заболеваний и злоупотребления психоактивными веществами в течение нескольких лет до своей смерти, и она так и не закончила фильм с 1961 года.\nМонро провела последний день своей жизни в своем доме в Брентвуде. Примерно в 3 часа ночи, после того как ее психиатр долго стучалась в дверь, она вошла в комнату, разбив окно, и обнаружила Монро мертвой. \nЕе смерть была официально признана вероятным самоубийством, основываясь на прецедентах ее передозировки и склонности к перепадам настроения и суицидальным мыслям. Никаких признаков насилия обнаружено не было, и случайная передозировка была исключена из-за большого количества барбитуратов, которые она проглотила.\nОна была главным секс-символом и одной из самых популярных голливудских звезд в 1950-х и начале 1960-х гг. она была самой высокооплачиваемой актрисой в течение десяти лет, и ее фильмы собрали в прокате 200 миллионов долларов к моменту ее смерти."
 news.1514.a: "Еще одна жертва Голливуда"
 saf_news.2.d: "Только что премьер-министр Великобритании Гарольд Макмиллан выступил с исторически значимым обращением к южноафриканскому парламенту в Кейптауне во время своего турне по странам Африканского Содружества. С 6 января он находился в турне по Африке, посетив Гану, Нигерию и другие британские колонии в Африке. Речь ясно показала, что правительство Великобритании, возглавляемое консерваторами, не намерено блокировать независимость многих из этих территорий. Кейптаунская речь Макмиллана также ясно показала, что Макмиллан включил Южную Африку в свою речь и указал на изменение британской политики в отношении апартеида"
 news.1515.t: "[GetNewspaperHeader]Израиль вторгается в Синай"
 news.1515.d: "Ранее, сегодня утром передовые подразделения израильских сил обороны вошли в принадлежащую египту Синайскую пустыню и неуклонно продвигаются к недавно национализированному Суэцкому каналу. Израильское руководство заявляет, что причина войны напрямую связана с сильной и неоднократной угрозой египетского премьера Насера закрыть Тиранский пролив, и в свете его решения захватить канал у Израиля не было другого выбора, кроме как нанести ответный удар в порядке самообороны. До сих пор международное сообщество несколько молчало об этом неожиданном развитии событий, хотя сообщения и слухи утверждают, что высшие британские и французские дипломаты уже разрабатывают предложение о прекращении огня."
 news.1515.a: "Как это будет происходить?"
 news.1516.t: "[GetNewspaperHeader]Суэцкий канал захвачен"
 news.1516.d: "Сегодня утром, когда солнце взошло над Египтом, элитные силы Египетской армии ворвались в Суэцкий канал и быстро захватили его, в то время как лидер Гамель Абдель Насер одновременно произнес триумфальную речь перед своим народом, объявив Канал по праву Египетским и что теперь он снова принадлежит им. В то время как массы по всему арабскому миру наводнили улицы, чтобы отпраздновать эту великую победу над старыми империалистическими державами, высшие дипломаты и политики по всей Европе пытаются найти какую-то реакцию и выяснить, как это повлияет на их соответствующие страны. Остается только посмотреть, как долго Насер сможет продержаться на своей новой территории."
 news.1516.a: "Интересно"
 news.1517.t: "[GetNewspaperHeader]Британские войска высаживаются в Суэце"
 news.1517.d: "Похоже, что цепная реакция, вытекающая из национализации Египтом Суэцкого канала, еще не совсем закончилась, поскольку сегодня и Великобритания, и Франция присоединились к Израилю в проведении военных действий против этой страны. Британские воздушно-десантные части высадились в Порт-Саиде и его окрестностях и быстро отбросили несколько египетских бригад в город, в то время как французские войска были встречены с таким же успехом в Порт-Фауде. Тем не менее, они не смогли сохранить канал свободным от блокады, так как египетские войска потопили несколько больших танкеров в середине прохода, прежде чем англо-французская коалиция смогла остановить их. Таким образом, в то время как англичане одержали большую военную победу, наступающий дефицит нефти, который затронет всю Европу, кажется, имеет гораздо большее значение."
 news.1517.a: "Лучше сейчас же заправиться!"
 news.1518.t: "[GetNewspaperHeader]Резолюция ООН 997 & 1001"
 news.1518.d: "Когда англичане и французы вторглись в Египет вместе с Израилем, они надеялись, что, по крайней мере, международное сообщество останется в стороне и позволит ситуации развиваться. Однако произошло обратное, поскольку Соединенные Штаты оказались во главе международного возмущения против англо-франко-израильской операции. Сегодня это возмущение достигло кульминации, когда Организация Объединенных Наций приняла 2 резолюции, требующие немедленного прекращения конфликта и передачи канала миротворческим силам ООН. Хотя Трехсторонний пакт казался успешным в военном отношении, ясно, что Суэцкий кризис был не чем иным, как политической катастрофой, с тяжелыми последствиями для всех трех стран."
 news.1518.a: "По крайней мере, это не вызвало Третьей мировой войны"
 news.1519.t: "[GetNewspaperHeader]Египетская победа"
 news.1519.d: "К большому шоку большей части международного сообщества, сегодня египетский лидер Гамель Абдель Насер провозгласил военную победу над Трехсторонним пактом Великобритании, Франции и Израиля. Несмотря на ранние стадии конфликта за Синай и Суэцкий канал, показавшие, что Египет отступает, тем не менее его армия смогла восстановиться и вытеснить Израиль с Синая, фактически положив конец любым шансам на успех Трехстороннего пакта. Детали переговоров о прекращении огня до сих пор неясны, но вполне вероятно, что Насер потребует какой-то формы репараций и, конечно же, сохранит канал под контролем Египта."
 news.1519.a: "Аутсайдеры вышли на первое место!"
 news.1520.t: "[GetNewspaperHeader]Насер принимает Британское перемирие"
 news.1520.d: "Сегодня египетский лидер Гамель Абдель Насер принял соглашение о прекращении огня под руководством Великобритании после быстрого утвердительного ответа Израиля на это предложение. Этот шаг стал неожиданностью для многих экспертов по ближневосточной политике, поскольку Насер, как известно, не уступает ни в чем так легко. Тем не менее, все военные действия на Синае прекратились, и британские солдаты двинулись, чтобы вернуть канал в соответствии с условиями сделки. Остается только воображать, что могло бы произойти, если бы Насер отклонил это предложение, и на данный момент на Ближнем Востоке снова воцарился мир."
 news.1520.a: "Это кажется немного... Необычным"
