l_russian:
 Albania_1_desc:0 "Мы арестовали заместителя премьер-министра и министра внутренних дел Кочи Дзодзе. Со времен становления албанского коммунизма Кочи был ярым противником нашего лидера [ALB.GetLeader]. Кроме того, после разрыва презренного [YUG.GetLeader] с [SOV.GetLeader] его также горячо поддерживают проклятые югославы, которые, вероятно, хотят присоединить нашу страну к своей большой республике. Теперь, когда он находится под нашим контролем, мы должны решить, что с ним делать". 
 Albania_2_desc:0 "На состоявшемся сегодня секретном суде предатель Кочи Дзодзе признался, что работал на британскую разведку и вступил в сговор с [YUG.GetLeader], лидером предательской группировки [YUG.GetNameDef]. Его отстранение от власти было объявлено результатом его \"проюгославской деятельности,\" а наказанием за предательство нового лидера, [ALB.GetLeader], будет повешение." 
 Albania_3_desc:0 "\nДвадцатый съезд Коммунистической партии Советского Союза стал богатым на события для коммунистического мира, так как это был первый съезд после смерти Иосифа Сталина. В ходе съезда [SOV.GetLeader] осудил культ личности Сталина и его террор на востоке, в чем все более параноидальный Энвер Ходжа усмотрел угрозу своему правлению. Постоянно растущий раскол между [SOV.GetNameDef] и [ALB.GetNameDef] может представлять угрозу нашему суверенитету. Мы можем позволить ему развиваться и идти своим путем, а можем обратиться за советом к Лири Белишовой. Как сторонник сталинизма и друг [SOV.GetLeader], она может открыть новую эру процветания для нашей страны". 
 Albania_10_desc:0 "По мере того как Энвер Ходжа становился все более параноидальным, народ и правительство ополчились против него, как против противника нового первого секретаря Советского Союза. Вслед за разоблачением его сталинского стиля правления появилась заметная просоветская фракция, которая арестовала Ходжу, и назначила нового первого секретаря Албании Лири Белишовой. Теперь, когда Ходжа под арестом и обвиняется в антикоммунистической, а также антиалбанской деятельности, мы должны решить, что с ним делать". 

 Albania_5_desc:0 "После предательства интригана [YUG.GetLeader] мы оказались в изоляции от наших братьев-коммунистов, не имея прямых связей с востоком, а с запада на нашу скромную страну надвигаются грандиозные планы. Эти замыслы включают шепот о вторжении в нашу страну в надежде, что наше изолированное государство будет ослаблено и охотнее перейдет на их сторону. Мы будем стоять и бороться с капиталистическим подрывом нашей нации, но мы можем проиграть их обученным лазутчикам". 
 Albania_6_desc:0 "Слухи о западном проникновении оказались правдой! За последние несколько месяцев мы столкнулись с несколькими попытками посеять инакомыслие в Албании. Обученные албанские экстремисты под покровом ночи возвращались на родину, чтобы свергнуть правительство нашего народа в пользу какого-нибудь деспотичного режима. К счастью, наши обученные албанские силы безопасности загнали в угол и взяли в плен всех этих иностранных пособников". 
 Albania_7_desc:0 "Слухи о западном проникновении оказались правдой! В течение последних нескольких месяцев обученные албанские эмигранты возвращались на родину, чтобы свергнуть деспотичный режим Ходжи, для создания западного государства, свободного от коммунистического гнета. Бойцы за свободу, вступившие в НАТО, ведут жестокую партизанскую войну против государства, которая постепенно становится все жарче и жарче. Под угрозой смерти Ходжа бежал из страны и нашел убежище в Москве, и в этой суматохе к власти в стране пришло правительство, ориентированное на Запад." 
 Albania_8_desc:0 "В течение последних нескольких месяцев [ALB.GetName] отбивалась от партизанских атак плотно организованных, хорошо обученных албанских экстремистов. Хотя борцы за свою идею сражались ожесточенно, они получали отпор на каждом шагу, что, вероятно, отчасти объяснялось наличием предателя в их среде. Все, кто выступал против нового правительства Ходжи в ходе этого неудачного восстания, были расстреляны, повешены или посажены в тюрьму. Хотя о том, где проходили подготовку экстремисты, ничего не говорится, почти наверняка их готовили западные диверсанты." 
 Albania_9_desc:0 "В медленном темпе партизанской войны и тайных операций небольшие группы албанских националистов одержали верх над силами безопасности Ходжи. По слухам о западном проникновении, эти националистические группы начали свои атаки на государство, борясь за свободу от режима Ходжи. Под угрозой смерти Ходжа бежал из страны и укрылся в Москве, а правительство, ориентированное на Запад, взяло власть в свои руки и начало дипломатические переговоры со странами НАТО. От [SOV.GetLeader] пока ничего не слышно, но, скорее всего, он недоволен таким развитием событий." 

