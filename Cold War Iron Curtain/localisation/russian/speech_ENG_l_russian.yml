l_english:
 attlee_speech_category: "Публичные выступления премьер-министра Эттли"
 attlee_speech_category_desc: "Премьер-министр Эттли стал свидетелем быстрого упадка Британской империи вскоре после окончания Второй мировой войны. Он уделяет большое внимание благополучию граждан и категорически против войн. Страна начала восстанавливаться при его правительстве"
 attlee_anti_war: "Провести антивоенную речь перед публикой"
 attlee_anti_war_desc: "Пять лет войны нанесли большой урон нашей стране. Ценные жизни были потеряны. Много богатств было уничтожено. Наша торговля была нарушена. Ясно, что придется пережить трудности и нехватку многих вещей. Чтобы добиться выздоровления, нам требуются большие усилия со стороны всех мужчин и женщин Британии, в течение последних четырех с половиной лет были предприняты очень большие усилия, производство в промышленности и сельском хозяйстве было значительно увеличено, и возможности для работы были расширены, и подавляющее большинство работало хорошо. Неизбежные трудности и дефицит были насколько это возможно, были разделены между всеми, великая система социального обеспечения была применена ко всем. Результатом политики лейбористов является здоровье люди, особенно дети и младенцы, никогда они не были так прекрасны, мистер Черчилль называет это разделением страданий, и вопрос, который предстоит решить на этих выборах, состоит в том, будет ли продолжена политика лейбористов по справедливому распределению для всех или как при предыдущем консервативном правительстве, выгоды к одной части народа, а несчастья к другой. Я прошу вас помочь нам продолжить работу по восстановлению, так хорошо начатую."
 attlee_korean_war: "Обращение по Корейской войне"
 attlee_korean_war_desc: "Мы столкнулись с прямым вызовом авторитету Организации Объединенных Наций, совершен акт агрессии. Сейчас можно делать всякие специальные встречи, можно встретиться с южнокорейским или американским правительством, я согласен. Поскольку этот человек не очень хороший персонаж, это не оправдывает попытки другого человека убить его. Вы можете сказать, что Китай, новый Китай не входит в Совет Безопасности. Это не влияет и не изменяет факт агрессии. И если Организация Объединенных Наций не была полностью старой Лигой Наций, то надо было абсолютно необходимо положить этому конец. И более пятидесяти других стран поддерживают их в этих усилиях по сохранению мира во всем мире. Это означает риски и опасности, да и любые другие причины подразумевали бы риски и опасности. Я совершенно уверен, что если мы победим, то наш авторитет в мире будет больше, чем у агрессора. Мы должны сказать здесь и сейчас, что их агрессия не увенчается успехом."
 churchill_speech_category: "Речи премьер-министра Черчилля"
 churchill_speech_category_desc: "Премьер-министр Черчилль — наш герой войны, он провел страну через тяжелейшие пять лет. Хотя Вторая мировая война унесла миллионы британских жизней, наш великий премьер-министр отказался идти на компромисс с нацистами и сражался до окончательной победы, его вклад в страну и мир во всем мире навсегда останется в памяти."
 churchill_king_death: "Речь по поводу смерти короля Георга VI"
 churchill_king_death_desc: "В эти последние месяцы король ходил рядом со смертью, как если бы смерть была его спутником, знакомым, которого он узнавал и не боялся. В конце концов смерть пришла как друг, и после счастливого солнечного дня и спорта, и после \"спокойной ночи\" тем, кто любил его больше всего, он заснул, как каждый мужчина или женщина, которые стремятся бояться Бога и ничего больше. Я, чья юность прошла в августейшей, неоспоримой и безмятежной славе викторианской эпохи, вполне могу испытать трепет, когда еще раз воззову молитву и гимн: \"Боже, храни королеву!\""