 RETALIATE_NUKES: "Отлично. Пока это продолжалось - это было хорошо."
 declare_nuclear_power: "Объявить себя ядерной державой!"
 declare_nuclear_power_desc: "Наконец-то мы накопили ядерный арсенал, достойный страха международного сообщества. Теперь мы можем успешно заявить о себе как о члене Ядерного клуба, участники которого могут уничтожить человечество."
 WMD.3.t: "[GetNewspaperHeader] Дипломатический инцидент: Советский Союз требует возвращения американского «шпиона»"
 WMD.3.d: "Москва, СССР: Сумасшедший человек врезался в вестибюль американского посольства во время преследования его советскими властями. \n\nЗаявив о дипломатическом иммунитете и устроив настоящую сцену, он шокировал свидетелей истерическими криками о первом ядерном ударе Советского Союза, который уже свершился. \n\nОчевидцы рассказывают, как голос мужчины надломился и хриплые слова пронзили уши всех присутствующих, как только он упал на колени и замолчал. Американское посольство пока никак не прокомментировало этот инцидент, и человек, известный пока что только как «Дмитрий Поляков», в настоящее время находится под американским арестом."
 WMD.31.t: "[GetNewspaperHeader]Сообщения о множественных возможных ядерных запусках в Соединенных Штатах"
 WMD.31.d: "Вамего, Канзас: Деревенский городок, привыкший к звукам домашнего скота и детей, играющих на улицах, замер. \n\nМужчины, женщины и дети в ужасе смотрели вдаль. Сотни полос света поднимались с земли к небесам, полностью окрасив горизонт дымом. \n\nВозможно, они были одними из первых, кто понял, что ждет человечество, и казалось, будто полный ужас заставил их застыть на месте. "
 WMD.6.t: "[GetNewspaperHeader]Ответный удар СССР?"
 WMD.6.d: "После первого ядерного удара по советскому блоку и после дня радиомолчания, президент [? USA.GetLeader] объявил, что коммунистическое чудовище было убито раз и навсегда. \n\nОднако международные космические агентства сообщили о запуске огромного количества ракет из глубин советского государства. На данный момент эти сообщения не могут быть подтверждены, однако президент заверил, что успешный первый удар сделал СССР неспособными к какому-либо ответу."
 WMD.7.t: "[GetNewspaperHeader]Ответный удар Америки?"
 WMD.7.d: "Шайенн, Вайоминг: Наш город, кажется, был пощажен первым залпом красных ракет, поскольку затянувшийся кошмар, наконец, проявляется. Сообщения о том, что целые города были стерты с лица Земли, а огненные бури поглотили все остальное, вызвали опасения стать мишенью еще одного удара, который лишит этот континент жизни. \n\nПрезидент [USA.GetLeader] пока не делал никаких публичных заявлений, и слухи о крахе Вашингтона распространяются. Надежды нации покоятся в руках Капитанов, которые лежат в глубинах океанов, и которые остаются нашей единственной надеждой утащить красных в ад вместе с нами."
