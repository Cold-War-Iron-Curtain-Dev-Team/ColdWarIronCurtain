l_russian:
  #Country Events 
 ADR_sell_tech.0.d: "Недавно из Вены прибыла делегация высшего уровня. В ходе переговоров высокопоставленный австрийский чиновник предложил нам закупить у них качественные потребительские товары. Они отметили, что в Австрийской Демократической Республике имеются самые современные и высококачественные потребительские товары в социалистическом мире, и такие продукты могут принести большую пользу нашей стране и ее народу. Совершенно очевидно, что делегация ожидает, что мы дадим окончательный ответ на их предложение. Если мы купим товары, это, безусловно, нанесет ущерб нашим финансовым резервам, но укрепит связь между нашими двумя государствами. Кроме того, столь качественный товар может оказаться для нас выгодным. Если мы отклоним предложение Австрии, делегация обязательно выразит разочарование."
 ADR_sell_tech.1.d: "Делегация недавно прибыла в [FROM.GetName] чтобы обсудить общие проблемы, стоящие перед нами обоими, и предложить им продать потребительские товары. Продажа товаров другим социалистическим государствам укрепит социалистический мир и повысит уровень счастья наших граждан в конкуренции с Западом. Получив предложение, правительство [FROM.GetName] с энтузиазмом приняли. Они заявили о своем желании продвигать свой народ и делать это с помощью знаний, полученных в социалистическом мире. Успешный визит, несомненно, укрепляет связи между Австрийской Демократической Республикой и [FROM.GetName] . Уже строятся планы относительно будущих предложений по продаже товаров народного потребления заинтересованным и дружественным государствам."
 ADR_sell_tech.2.d: "Делегация недавно прибыла в [FROM.GetName] чтобы обсудить общие проблемы, стоящие перед нами обоими, и предложить им продать потребительские товары. Продажа товаров другим социалистическим государствам укрепит социалистический мир и повысит уровень счастья наших граждан в конкуренции с Западом. Получив предложение, правительство [FROM.GetName] ошеломили наших дипломатов отказом. Они не сделали этого резко или грубо, но отметили, что финансовые ограничения не позволяют им приобрести товары. Конечно, это, скорее всего, ложь. Как только делегация вернется, мы временно понизим штат посольства и его консульские службы, чтобы выразить наше недовольство."
  
