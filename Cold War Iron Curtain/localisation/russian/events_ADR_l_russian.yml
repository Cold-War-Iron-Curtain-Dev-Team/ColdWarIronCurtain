l_english:
 ADR_sell_tech.0.d: "Недавно из Вены прибыла высокопоставленная делегация. В ходе переговоров один из делегатов, австрийский чиновник предложил нам закупить у них качественные потребительские товары. Они отметили, что у Австрийской Демократической Республики имеются самые современные и высококачественные потребительские товары в социалистическом мире, и такие продукты могут принести большую пользу нашей стране и ее народу. Совершенно очевидно, что делегация ожидает, что мы дадим окончательный ответ на их предложение. Если мы купим товары, это, безусловно, нанесет ущерб нашим финансовым резервам, но укрепит связь между нашими двумя государствами. Кроме того, столь качественный товар может оказаться для нас выгодным. Если мы отклоним предложение Австрии, делегация обязательно выразит разочарование."
 ADR_sell_tech.1.d: "Недавно в [FROM.GetName] была направлена делегация для обсуждения общих проблем, стоящих перед нами, и предложения продавать им товары народного потребления. Продажа товаров социалистическим государствам укрепит социалистический мир и повысит счастье наших граждан в конкуренции с Западом. Получив это предложение, правительство [FROM.GetName] с энтузиазмом приняло его. Они заявили о своем желании развивать свой народ и делать это с помощью знаний, полученных в социалистическом мире. Успешный визит, несомненно, укрепляет связи между Австрийской Демократической Республикой и [FROM.GetName]. Уже строятся планы будущих предложений по продаже товаров народного потребления желающим и дружественным государствам."
 ADR_sell_tech.2.d: "Недавно отправленная в [FROM.GetName] делегация для обсуждения общих проблем, стоящих перед нами, и предложения продавать им товары народного потребления. Продажа товаров социалистическим государствам укрепит социалистический мир и повысит счастье наших граждан в конкуренции с Западом. Получив это предложение, правительство [FROM.GetName] ошеломило наших дипломатов отказом. Они не сделали этого резко или грубо, но отметили, что финансовые трудности мешают им приобрести товары. Конечно, это, скорее всего, ложь, но после возвращения делегации мы временно сократим штат посольства и его консульские услуги, чтобы показать свое недовольство."