 IRQ_attack_helicopter_equipment_2: "Ми-8"
 IRQ_attack_helicopter_equipment_2_short: "Ми-8"
 IRQ_attack_helicopter_equipment_2_desc: "Ми-8 использовались бывшей иракской армейской авиацией и иракскими ВВС при Саддаме Хусейне. Во время ирано-иракской войны 1980-х годов происходили воздушные бои между вертолетами иракской и иранской армейской авиации, в том числе между иранскими Bell AH-1J Cobras и иракскими Ми-8."
 IRQ_attack_helicopter_equipment_3: "Ми-25"
 IRQ_attack_helicopter_equipment_3_short: "Ми-25"
 IRQ_attack_helicopter_equipment_3_desc: "Экспортный вариант Ми-24Д. (Hind-D) Ми-24Д разрабатывался как боевой вертолет, более совершенный, чем его более ранние варианты. Он был запущен в производство в 1973 году. Ми-24Д имеет переработанную носовую часть фюзеляжа с двумя отдельными кабинами для пилота и стрелка. Он вооружен одним 12,7-мм четырехствольным пулеметом Як-Б под носом. Он также может нести четыре 57-мм ракетных блока, четыре противотанковых ракеты SACLOS 9M17 Phalanga (значительное усовершенствование по сравнению с системой MCLOS, установленной на Ми-24А), а также бомбы и другое вооружение."
 IRQ_attack_helicopter_equipment_4: "Ми-35"
 IRQ_attack_helicopter_equipment_4_short: "Ми-35"
 IRQ_attack_helicopter_equipment_4_desc: "Созданный на базе Ми-24 Hind, военный вертолет Ми-35М включает в себя ряд улучшений, в том числе укороченные короткие крылья, новую систему несущего винта, современную авионику, модернизированные турбовальные двигатели и гидравлическую систему. Кабина и жизненно важные компоненты вертолета хорошо бронированы."
