 IRQ_mach2stratbomber_equipment_1: "Туполев Ту-22Б"
 IRQ_mach2stratbomber_equipment_1_short: "Ту-22Б"
 IRQ_mach2stratbomber_equipment_1_desc: "Первый сверхзвуковой бомбардировщик, запущенный в производство в Советском Союзе, Ту-22 поступил на вооружение советских ВВС в 1962 году. Произведенный в небольшом количестве (было построено 311 самолетов), этот тип оказался разочарованием, поскольку ему не хватало межконтинентальной дальности полета. ожидаемо от такого бомбардировщика. Несмотря на это, Ту-22 модернизировался на протяжении всего срока службы и использовался в качестве пусковой платформы для противокорабельной ракеты большой дальности Х-22 (по отчетному названию НАТО; AS-4 Kitchen). Его кодовое название НАТО - Blinder."
 IRQ_cv_jet_CAS_equipment_2: "Hawker Sea Fury FB.11"
 IRQ_cv_jet_CAS_equipment_2_short: "Sea Fury FB.11"
 IRQ_cv_jet_CAS_equipment_2_desc: "Одноместный истребитель-бомбардировщик для Королевского флота, Королевского флота Австралии, Королевского флота Канады и Королевского флота Нидерландов, построено 615 самолетов, в том числе 31 для RAN и 53 для RCN."
