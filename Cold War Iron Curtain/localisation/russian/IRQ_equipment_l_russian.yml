l_english:
 IRQ_infantry_equipment_0: "Винтовка Lee-Enfield с коротким магазином, No. 4 Mk I"
 IRQ_infantry_equipment_0_short: "SMLE No. 4"
 IRQ_infantry_equipment_0_desc: "Lee-Enfield — магазинная магазинная винтовка с продольно-скользящим затвором, которая служила основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. Это была стандартная винтовка британской армии с 1895 по 1957 год. Винтовка широко использовалась на протяжении всей Второй мировой войны, особенно на театрах военных действий в Северной Африке, Италии, Тихом океане и Бирме в руках британских сил и сил Содружества. Австралия и Индия сохранили и производили SMLE Mk III * в качестве своей стандартной винтовки во время конфликта, и винтовка оставалась на военной службе Австралии во время Корейской войны, пока в конце 1950-х годов ее не заменила L1A1 SLR."
 IRQ_infantry_equipment_1: "Автомат Калашникова 1947"
 IRQ_infantry_equipment_1_short: "AK-47"
 IRQ_infantry_equipment_1_desc: "АК-47 — полностью автоматическая штурмовая винтовка, разработанная в Советском Союзе Михаилом Калашниковым в 1947 году, но не применявшаяся на вооружении до 1948 года, когда в производство была отправлена версия с фиксированным прикладом. В начале 1949 года АК-47 был принят Советскими Вооруженными Силами для массового развертывания во фронтовых частях. С газовым поршнем с длинным ходом, селектором / предохранителем, автоматическим спусковым крючком и механизмом досылания, а также дальнейшими улучшениями в общей конструкции AK47 стал значительным обновлением СКС. AK-47 в течение многих лет считался одним из самых надежных и простых в обслуживании, обращении и изучении видов оружия в мире."
 IRQ_infantry_equipment_2: "Zastava М70-Б1"
 IRQ_infantry_equipment_2_short: "Zastava М70-Б1"
 IRQ_infantry_equipment_2_desc: "Разработка отечественного автомата началась в 1959 году компанией «Застава» с серий винтовок М59 и М64 с фрезерованной ствольной коробкой, стволами с резьбой, привычными для «Заставы» цевьями, газовыми отсечками для запуска гранат и рядом других отличий от основной конструкции АК, таких как затвор держите открытое устройство с правой стороны ствольной коробки, а рукоятка заряжания появилась отличной от других моделей АК. Хотя характеристики были удовлетворительными, югославские военные в то время не приняли винтовку на вооружение по разным причинам.\n\nВ 1970 году был дан зеленый свет на начало финансируемого армией серийного производства серий M70 и M70A (Automatska Puska Model 1970,\"Automatic Rifle Model 1970\"), из которых M70A была версией со складным прикладом. Со временем было реализовано несколько производственных мер по повышению рентабельности, таких как удаление внутреннего фиксатора затвора в открытом положении и замена фрезерованных ствольных коробок штампованной сталью сначала 0,9 мм, а затем толще 1,5 мм."
 IRQ_infantry_equipment_3: "Аль-Кадиссия Винтовка «Табук»"
 IRQ_infantry_equipment_3_short: "Табук"
 IRQ_infantry_equipment_3_desc: "«Табук» — произведенная в Ираке копия российского АКМ, который сам по себе является модернизированной версией знаменитого АК-47, разработанного Михаилом Калашниковым. Ирак начал производить «Табук» в 1980 году при техническом содействии Югославии.\""
 IRQ_infantry_equipment_4: "Автомат Калашникова 1974 Модернизированный"
 IRQ_infantry_equipment_4_short: "AK-74M"
 IRQ_infantry_equipment_4_desc: "АК-74М — усовершенствованный вариант АК-74, разработанный в 1991 году заводом «Ижмаш». АК-74М был разработан с использованием новых материалов и производственных достижений для создания улучшенного оружия. Он имеет облегченный затвор и держатель, что снижает отдачу газового поршня. Винтовка также включает приклад из стеклонаполненного полиамида, который можно удерживать сбоку, улучшенный дульный срез, усиленную крышку и ряд других незначительных улучшений. В комплекте есть планка для крепления оптики. Облегченная и усиленная винтовка стала проще в обращении и переноске, а также улучшена поддержка навесного оборудования. Он не был принят Советским Союзом, поскольку СССР распался до того, как его можно было рассмотреть, однако он был принят Российской Федерацией."
