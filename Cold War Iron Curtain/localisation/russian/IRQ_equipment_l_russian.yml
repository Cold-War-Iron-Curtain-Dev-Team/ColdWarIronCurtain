 IRQ_fighter_equipment_0_desc: "Иракские ВВС (IQAF или IrAF) (Аль-Кувват аль-Джаввия аль-Иракийя) — подразделение воздушной войны Вооружённых сил Ирака. Он отвечает за защиту воздушного пространства Ирака, а также за охрану его международных границ."
