 IRQ_lt_equipment_4: "ПТ-76Б"
 IRQ_lt_equipment_4_short: "ПТ-76Б"
 IRQ_lt_equipment_4_desc: "ПТ-76, вооруженный 76,2-мм нарезной танковой пушкой Д-56ТС (двухкамерный дульный тормоз, эжектор гильз, дымосос и двухкоординатная система стабилизации СТП-2П «Заря»), ПАЗ (противоатомная защита) РХБ защиты система автоматического пожаротушения, улучшенный прицел ТШК-2-66, фильтровентиляционная система, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный дизельный двигатель водяного охлаждения В-6Б мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительными внутренними топливными баками, для чего пришлось несколько изменить форму брони."
 IRQ_lt_equipment_5: "Engesa EE-9 Cascavel Мк.II"
 IRQ_lt_equipment_5_short: "EE-9 Cascavel Mk.II"
 IRQ_lt_equipment_5_desc: "EE-9 Cascavel — шестиколесный бразильский бронеавтомобиль, разработанный в первую очередь для разведки. Он был спроектирован компанией Engesa в 1970 году в качестве замены устаревающему бразильскому парку M8 Greyhounds. Сначала машина была оснащена 37-мм пушкой Greyhound, а затем французской башней, заимствованной у Panhard AML-90."
