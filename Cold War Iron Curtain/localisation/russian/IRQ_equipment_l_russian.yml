 IRQ_fighter_equipment_3_desc: "Вариант одноместного истребителя наземного базирования для ВВС Ирака. Неофициально известен как \"Багдадские фурии\"."
 IRQ_jet_multirole_equipment_1: "de Havilland Vampire F.50"
 IRQ_jet_multirole_equipment_1_short: "Vampire F.50"
 IRQ_jet_multirole_equipment_1_desc: "De Havilland Vampire — британский реактивный истребитель, разработанный и производимый компанией de Havilland Aircraft Company. Это был второй реактивный истребитель ВВС Великобритании после Gloster Meteor и первый реактивный истребитель с одним реактивным двигателем."
 IRQ_jet_multirole_equipment_3: "Hawker Hunter F.1"
 IRQ_jet_multirole_equipment_3_short: "Hunter F.1"
 IRQ_jet_multirole_equipment_4: "МиГ-19"
 IRQ_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в горизонтальном полете. Сопоставимым американским истребителем «Century Series» был North American F-100 Super Sabre, хотя МиГ-19 в основном воевал против более современных McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 IRQ_jet_multirole_equipment_4_short: "МиГ-19"
 IRQ_jet_multirole_equipment_5: "МиГ-21 Ф-13"
 IRQ_jet_multirole_equipment_5_desc: "МиГ-21 «Фишбед» считается одним из первых советских истребителей третьего поколения, оснащенных ракетами дальнего радиуса действия и импульсным радаром. МиГ-21 — самый массовый сверхзвуковой реактивный самолет в истории, особенно большое количество самолетов было построено по лицензии в Китае и Индии. Было построено более 11 000 самолетов, обслуживающих более 60 стран на 5 континентах. За время своего существования МиГ-21 сбили 240 самолетов. МиГ-21 участвовал во многих конфликтах, в том числе во Вьетнаме (где он добился огромного успеха), в войне между Индией и Пакистаном 1971 года, в ирано-иракской войне и во многих более мелких конфликтах. Он остается в эксплуатации после более чем 6 десятилетий."
 IRQ_jet_multirole_equipment_5_short: "МиГ-21 Ф-13"
 IRQ_jet_multirole_equipment_6: "МиГ-21МФ"
 IRQ_jet_multirole_equipment_6_desc: "Серийный вариант всепогодного перехватчика. Они были оснащены ТРД Р11Ф2-300 и, начиная с седьмой серийной партии, оснащались РЛС РП-21 (в первых шести партиях использовалась более старая РЛС ЦД-30Т (она же РП-9-21). Кроме того, вооружение система управления была изменена по сравнению с F-13, чтобы можно было использовать зенитный ракетный комплекс РС-2УС (он же К-5МС) с лучевым наведением в дополнение к К-13 с ИК-наведением."
 IRQ_jet_multirole_equipment_6_short: "МиГ-21МФ"
 IRQ_jet_multirole_equipment_7: "МиГ-21бис"
 IRQ_jet_multirole_equipment_7_short: "МиГ-21бис"
 IRQ_jet_multirole_equipment_7_desc: "Окончательное развитие МиГ-21, оснащенное ТРД Туманского Р25-300 и множеством других усовершенствований по сравнению с предыдущими типами. Те МиГ-21бис для советских ПВО (Сил ПВО) были оснащены системой Лазур GCI, а для советских ВВС были оснащены системой ИЛС «Полет»."
 IRQ_jet_multirole_equipment_8: "МиГ-23МЛ"
 IRQ_jet_multirole_equipment_8_desc: "Ранние варианты «Флоггера» имели ряд конструктивных недостатков, включая прочность и надежность планера, характеристики двигателя, маневренность и характеристики радара. Была проведена значительная доработка планера, в результате которой появился МиГ-23МЛ."
 IRQ_jet_multirole_equipment_8_short: "МиГ-23МЛ"
 IRQ_jet_multirole_equipment_9: "Mirage F1EQ-2"
 IRQ_jet_multirole_equipment_9_short: "Mirage F1EQ-2"
 IRQ_jet_multirole_equipment_9_desc: "В конце 1970-х годов Ирак разместил заказ на вариант Mirage F1, получивший обозначение Mirage F1EQ, который был специально модифицирован для увеличения дальности полета для выполнения ударных задач и не был похож ни на одну из моделей, эксплуатируемых французскими ВВС."
 IRQ_jet_multirole_equipment_10: "МиГ-29A"
 IRQ_jet_multirole_equipment_10_short: "МиГ-29A"
 IRQ_jet_multirole_equipment_10_desc: "МиГ-29 Fulcrum A был первоначально разработан конструкторским бюро Микояна. Это был первый истребитель 4-го поколения, поступивший на вооружение СССР и стран Восточного блока. Включая улучшенную авионику и значительно расширенные возможности радара. Первые МиГ-29 использовались Варшавским договором в качестве учебно-тренировочных с ограниченным экспортом в Индию, но имели ограниченное боевое применение. Позже МиГ-29 станет базой для широко выпускаемых вариантов, таких как МиГ-29С, МиГ-29М и МиГ-35."
 IRQ_CAS_equipment_1: "Hawker Iraqi Audax 'Nisr'"
 IRQ_CAS_equipment_1_short: "Nisr"
 IRQ_CAS_equipment_2: "Northrop 15 Model 8A-4"
 IRQ_CAS_equipment_2_short: "15 Model 8A-4"
 IRQ_CAS_equipment_3: "Hawker Typhoon Mk.Ib/Late"
 IRQ_CAS_equipment_3_short: "Typhoon Mk.Ib/Late"
 IRQ_CAS_equipment_3_desc: "Хаукер Тайфун был британским истребителем-бомбардировщиком, который в основном использовался Королевскими военно-воздушными силами (RAF) во время Второй мировой войны. Тайфун Mk.Ib/поздний был улучшенной версией более ранних Хаукер Тайфун с новым пузырчатым фонарём."
 IRQ_CAS_equipment_4: "Hawker Fury I Trainer"
 IRQ_CAS_equipment_4_short: "Fury I Trainer"
 IRQ_CAS_equipment_4_desc: "Двухместная учебная версия для ВВС Ирака. Неофициально известен как \"Багдадские фурии\"."
 IRQ_jet_CAS_equipment_1: "de Havilland Vampire FB.50"
 IRQ_jet_CAS_equipment_1_short: "Vampire FB.50"
 IRQ_jet_CAS_equipment_2: "de Havilland Venom FB.1"
 IRQ_jet_CAS_equipment_2_short: "Venom FB.1"
 IRQ_jet_CAS_equipment_3: "de Havilland Venom FB.4"
 IRQ_jet_CAS_equipment_3_short: "Venom FB.4"
 IRQ_jet_CAS_equipment_4: "Hawker Hunter FGA.59"
 IRQ_jet_CAS_equipment_4_short: "Hunter FGA.59"
 IRQ_jet_CAS_equipment_5: "Су-7БКЛ"
 IRQ_jet_CAS_equipment_5_short: "Су-7БКЛ"
 IRQ_jet_CAS_equipment_5_desc: "Модернизированный двигатель АЛ-7Ф-1, модернизированная топливная система с внешними трубопроводами по обеим сторонам хребта фюзеляжа, топливные баки, установленные в крыльях, «мокрые» подкрыльевые узлы подвески для подвесных топливных баков, способные нести тактические ядерные бомбы."
 IRQ_jet_CAS_equipment_6: "Су-17М"
 IRQ_jet_CAS_equipment_6_short: "СУ-17M"
 IRQ_jet_CAS_equipment_6_desc: "Су-17 Фиттер-С был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских стран и Южной Америки. Су-17 улучшил почти все аспекты своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год 2867 самолетов были произведены и использовались в 30 странах, 6 из которых используют эти самолеты до сих пор."
 IRQ_jet_CAS_equipment_7: "МиГ-23БН"
 IRQ_jet_CAS_equipment_7_short: "МиГ-23БН"
 IRQ_jet_CAS_equipment_7_desc: "Модернизированный вариант МиГ-23Б, МиГ-23БН отличался тем, что он был оснащен крыльями Edition 3 и двигателем Р-29 современных вариантов истребителя, а также небольшими обновлениями в электронике и оборудовании."
 IRQ_jet_CAS_equipment_8: "Су-25"
 IRQ_jet_CAS_equipment_8_short: "Су-25"
 IRQ_jet_CAS_equipment_8_desc: "Су-25 «Фрогфут» — двухмоторный штурмовик, разработанный в Советском Союзе. Самолет совершил свой первый полет в 1975 году и был представлен в 1981 году. С 1978 года было произведено более 1000 самолетов. Это был особенно популярный самолет за границей, который продавался в 29 стран. Из-за этого Су-25 участвовал в нескольких конфликтах, в частности, в советско-афганской, ирано-иракской войнах и войнах в Персидском заливе. Сегодня самолет остается на вооружении всех стран-экспортеров."
 IRQ_heavy_fighter_equipment_1: "Messerschmitt Bf 110"
 IRQ_heavy_fighter_equipment_1_short: "Bf 110"
 IRQ_heavy_fighter_equipment_2: "Bristol Blenheim IVF Mk.V"
 IRQ_heavy_fighter_equipment_2_short: "Blenheim IVF Mk.V"
 IRQ_heavy_fighter_equipment_3: "de Havilland Mosquito F Mk.II"
 IRQ_heavy_fighter_equipment_3_short: "Mosquito F Mk.II"
 IRQ_jet_interceptor_equipment_3: "МиГ-17ПФ"
 IRQ_jet_interceptor_equipment_3_short: "МиГ-17ПФ"
 IRQ_jet_interceptor_equipment_3_desc: "Всепогодный вариант истребителя-перехватчика с РЛС «Изумруд», 3 х 23-мм пушками НР-23 и двигателем ВК-1Ф."
 IRQ_jet_interceptor_equipment_7: "МиГ-25П"
 IRQ_jet_interceptor_equipment_7_short: "МиГ-25П"
 IRQ_jet_interceptor_equipment_7_desc: "МиГ-25 Foxbat Микояна-Гуревича, пожалуй, один из самых влиятельных советских самолетов в истории. Первый прототип МиГ-25 поднялся в воздух в начале 1964 г., а официально поступил на вооружение в 1970 г. За время эксплуатации было построено и продано более 1150 самолетов во многие страны, включая Сирию, Ирак и Индию. Самолет был разработан для быстрого перехвата высотных самолетов, таких как U-2 и B-58, с невероятной скоростью. Этот самолет дал Советскому Союзу гораздо более высокий контроль над своим удаленным воздушным пространством, чем когда-либо прежде. Он до сих пор находится на ограниченном вооружении ВВС России."
 IRQ_jet_interceptor_equipment_8: "МиГ-25ПДС"
 IRQ_jet_interceptor_equipment_8_short: "МиГ-25ПДС"
 IRQ_jet_interceptor_equipment_8_desc: "МиГ-25 Foxbat Микояна-Гуревича, пожалуй, один из самых влиятельных советских самолетов в истории. Первый прототип МиГ-25 поднялся в воздух в начале 1964 г., а официально поступил на вооружение в 1970 г. За время эксплуатации было построено и продано более 1150 самолетов во многие страны, включая Сирию, Ирак и Индию. Самолет был разработан для быстрого перехвата высотных самолетов, таких как U-2 и B-58, с невероятной скоростью. Этот самолет дал Советскому Союзу гораздо более высокий контроль над своим удаленным воздушным пространством, чем когда-либо прежде. Он до сих пор находится на ограниченном вооружении ВВС России."
 IRQ_jet_light_equipment_1: "Як-18"
 IRQ_jet_light_equipment_1_short: "Як-18"
 IRQ_jet_light_equipment_2: "МиГ-15УТИ"
 IRQ_jet_light_equipment_2_short: "МиГ-15УТИ"
 IRQ_jet_light_equipment_2_desc: "6 апреля 1949 года коллективу ОКБ-155 официально была поручена разработка учебно-тренировочного варианта истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен заводом №1 в марте-мае 1949 г. Кабина инструктора на УТИ МиГ-15 размещалась за счет уменьшения первого фюзеляжного топливного бака. Обе гермокабины были оборудованы катапультными креслами и пиромеханически опускаемыми фонарями. Специальное оборудование машины состояло из автоматического прицела АСП-1Н, приемо-передающей радиостанции РСИ-6К, радиокомпаса РПКО-10М с маркером РПКО-10М, переговорного устройства СПУ-2М, кислородного прибора КП-14, и камера AFA-IM. Вооружение состояло из одной 23-мм пушки НР-23 с боезапасом 80 патронов и одного пулемета УБК-Э с боезапасом 150 патронов."
 IRQ_jet_light_equipment_3: "L-29 Дельфин"
 IRQ_jet_light_equipment_3_short: "L-29 Дельфин"
 IRQ_jet_light_equipment_3_desc: "L-29 Delfín (англ.; Dolphin, отчетное название НАТО; Maya) — учебно-тренировочный военный реактивный самолет, разработанный и производимый чехословацким авиационным производителем Aero Vodochody. В ходе программы было произведено более 3000 учебно-тренировочных самолетов L-29 Delfin. Сообщается, что около 2000 из них были доставлены в Советский Союз, где они использовались в качестве стандартных учебных самолетов для советских ВВС."
 IRQ_jet_light_equipment_4: " L-39 Альбатрос"
 IRQ_jet_light_equipment_4_short: "L-39 Альбатрос"
 IRQ_jet_light_equipment_4_desc: "L-39 Albatros — реактивный учебно-тренировочный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах как замена Aero L-29 Delfín в качестве основного учебного самолета. Это был первый учебно-тренировочный самолет с турбовентиляторной силовой установкой. Этот тип экспортировался в широкий круг стран в качестве военного учебно-тренировочного самолета."
 IRQ_jet_light_equipment_5: " L-39ZA Альбатрос"
 IRQ_jet_light_equipment_5_short: "L-39ZA Альбатрос"
 IRQ_jet_light_equipment_5_desc: "Значительно модернизированный Л-39 для боевой подготовки и легкой атаки, с более прочным шасси, большей грузоподъемностью и, в частности, оснащенный 23-миллиметровой двухствольной пушкой ГШ-23Л, закрепленной в конформной гондоле под кабиной пилотов, имеющей 150-мм."
 IRQ_recon_equipment_0: "Taylorcraft Auster AOP6"
 IRQ_recon_equipment_0_short: "Auster AOP6"
 IRQ_recon_equipment_0_desc: "Taylorcraft Auster — британский военный самолёт связи и наблюдения, производившийся компанией Taylorcraft Airplanes (England) Limited во время Второй мировой войны."
 IRQ_jet_recon_equipment_0: "МиГ-15Р бис"
 IRQ_jet_recon_equipment_0_short: "МиГ-15Р бис"
 IRQ_jet_recon_equipment_0_desc: "25 апреля 1950 г. ОКБ МиГ приступило к разработке фронтового разведывательного варианта МиГ-15 с фотокамерой АФА-БА/40, обеспечивающей ширину полосы обзора от 0,9 до 4,5 км при длине маршрута фотосъемки от 90 до 450 м. км на высотах от 2000 до 10000м. На самолете была установлена всего одна пушка НР-23. Для увеличения дальности полета разведчика впоследствии на балки были установлены замки Д4-50, позволяющие подвешивать под крылом 600-литровые топливные баки улучшенной формы. Кроме того, на машину установили транспондер «Барий-М» и дополнительный кислородный баллон на 2 литра."
 IRQ_jet_recon_equipment_1: "МиГ-25РБ"
 IRQ_jet_recon_equipment_1_short: "МиГ-25РБ"
 IRQ_jet_recon_equipment_1_desc: "МиГ-25РБ — одноместный всевысотный оперативно-разведывательный самолет-бомбардировщик. Испытания завершились в декабре 1970 г. Самолет был оснащен двумя-четырьмя камерами общей разведки А-70М и одной топографической АФА-Э/10. Фотоаппаратура размещалась в пяти отсеках, расположенных в нижней части носовой части фюзеляжа. Также была установлена ​​станция SIGINT под названием SPS-4A или B «Virage», работающая в разных диапазонах частот. Специальное оборудование - станция активных радиопомех СПС-141"
 IRQ_jet_recon_equipment_2: "Dassault Mirage F1EQ-4 "
 IRQ_jet_recon_equipment_2_short: "Mirage F1EQ-4 "
 IRQ_jet_recon_equipment_2_desc: "Mirage F1EQ-4, одноместный многоцелевой истребитель, штурмовик, разведывательный вариант для Ирака."
 IRQ_nav_bomber_equipment_1: "Supermarine Walrus"
 IRQ_nav_bomber_equipment_1_short: "Walrus"
 IRQ_nav_bomber_equipment_2: "Lockheed Hudson I"
 IRQ_nav_bomber_equipment_2_short: "Hudson I"
 IRQ_nav_bomber_equipment_3: "Avro Anson Mk.I"
 IRQ_nav_bomber_equipment_3_short: "Anson Mk.I"
 IRQ_tac_bomber_equipment_0: "Armstrong Whitworth Whitley"
 IRQ_tac_bomber_equipment_0_short: "Whitley"
 IRQ_tac_bomber_equipment_1: "Savoia-Marchetti SM.79 Sparviero"
 IRQ_tac_bomber_equipment_1_short: "SM.79 Sparviero"
 IRQ_tac_bomber_equipment_2: "Bristol Beaufort"
 IRQ_tac_bomber_equipment_2_short: "Beaufort"
 IRQ_tac_bomber_equipment_3: "de Havilland Mosquito B"
 IRQ_tac_bomber_equipment_3_short: "Mosquito B"
 IRQ_jet_tac_bomber_equipment_2: "Ил-28"
 IRQ_jet_tac_bomber_equipment_2_short: "Ил-28"
 IRQ_jet_tac_bomber_equipment_2_desc: "Ил-28 был турбореактивным средним бомбардировщиком, разработанным сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, запущенный в крупносерийное производство, Ил-28, представленный в 1950 году, участвовал во многих крупных конфликтах холодной войны, от Вьетнамской и советско-афганской до Суэцкого конфликта и войны в Биафре. Даже после того, как к 1980-м годам они были выведены из эксплуатации в Советском Союзе, многие самолеты этого типа до сих пор эксплуатируются. В отчетах ВВС США / Министерства обороны США указано название Type 27, а кодовое имя НАТО - Beagle."
 IRQ_jet_tac_bomber_equipment_5: "МиГ-25РБС"
 IRQ_jet_tac_bomber_equipment_5_short: "МиГ-25РБС"
 IRQ_jet_tac_bomber_equipment_5_desc: "МиГ-25РБС — одноместный разведывательно-бомбардировочный вариант МиГ-25Р, оснащенный усовершенствованными системами разведки и системой автоматического бомбометания «Пеленг». Самолет может нести бомбовую нагрузку из восьми бомб по 500 кг (1102 фунта)."
 IRQ_jet_tac_bomber_equipment_6: "Су-24"
 IRQ_jet_tac_bomber_equipment_6_short: "Су-24"
 IRQ_jet_tac_bomber_equipment_6_desc: "Большой истребитель-бомбардировщик, разработанный Советским Союзом в 1960-х годах, который используется до сих пор. Характеристики включают его переменные крылья и острое тело. Он может оснащаться вооружением массой до 8000 кг и способен запускать различные типы ракет класса «воздух-земля» при сохранении стабильной скорости. Этот самолет известен под кодовым названием НАТО «Фехтовальщик». Вместе со своим преемником Су-34 он в настоящее время используется в качестве истребителя-бомбардировщика для стран бывшего Восточного лагеря."
 IRQ_strat_bomber_equipment_1: "Handley Page Halifax"
 IRQ_strat_bomber_equipment_1_short: "Halifax"
 IRQ_strat_bomber_equipment_2: "Avro Lancaster"
 IRQ_strat_bomber_equipment_2_short: "Lancaster"
 IRQ_strat_bomber_equipment_3: "Avro Lincoln I"
 IRQ_strat_bomber_equipment_3_short: "Lincoln I"
 IRQ_jet_strat_bomber_equipment_1: "Ту-16"
 IRQ_jet_strat_bomber_equipment_1_short: "Ту-16"
 IRQ_jet_strat_bomber_equipment_1_desc: "Ту-16 был двухмоторным стратегическим бомбардировщиком, разработанным в 1952 году, и одним из первых реактивных стратегических бомбардировщиков, поступивших на вооружение ВВС СССР. Он имел схему со стреловидным крылом и приводился в движение двумя ТРД Микулин АМ-3 в корнях крыла. Он мог нести до 9000 кг (20000 фунтов) боеприпасов, включая ядерное оружие и ФАБ-9000, 9000-килограммовую бомбу с мощностью, аналогичной британской бомбе Большого шлема. Этот тип, известный на Западе как Badger, служил на протяжении всей холодной войны и ушел в отставку в 1993 году. Китайский лицензионный вариант H-6 остается на вооружении НОАК как передовой стратегический бомбардировщик."
