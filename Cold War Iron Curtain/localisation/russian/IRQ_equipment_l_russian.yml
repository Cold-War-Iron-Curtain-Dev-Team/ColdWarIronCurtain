 IRQ_artillery_equipment_1: "5,5-дюймовая средняя пушка БЛ"
 IRQ_artillery_equipment_1_short: "БЛ 5,5 дюйма"
 IRQ_artillery_equipment_1_desc: "В январе 1939 года была выпущена спецификация на орудие для замены 6-дюймовых гаубиц мощностью 26 центнеров, используемых с большинством средних батарей. Первые единицы были оснащены в Великобритании летом 1941 года и в Северной Африке годом позже, 20 орудиями укомплектовали британские и Свободные французские батареи в Эль-Аламейне. Впоследствии им также были оснащены канадские, австралийские, южноафриканские, польские и индийские полки, а после войны он также использовался Новой Зеландией. Во время Второй мировой войны нормальной организацией был полк из 16 орудий, объединенный в две батареи. 5.5 оставался на вооружении после войны. Он использовался Королевской артиллерией в операциях в Корее, Южной Аравии и Борнео. Вероятно, он использовался индийской армией в войнах против Пакистана и использовался пакистанской армией против Индии в горах Кашмира во время Каргильской войны 1999 года."
