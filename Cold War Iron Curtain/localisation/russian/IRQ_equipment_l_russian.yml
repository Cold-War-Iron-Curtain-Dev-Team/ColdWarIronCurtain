 IRQ_transport_plane_equipment_3: "Bristol Type 170 Freighter"
 IRQ_transport_plane_equipment_3_short: "Freighter"
 IRQ_transport_plane_equipment_3_desc: "Bristol Type 170 Freighter — британский двухмоторный самолет, разработанный и построенный Bristol Airplane Company как грузовой и авиалайнер. Его наиболее известное использование было в качестве воздушного парома для перевозки автомобилей и их пассажиров на относительно короткие расстояния. Также была выпущена пассажирская версия, известная как Wayfarer."
