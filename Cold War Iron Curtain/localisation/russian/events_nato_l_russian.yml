l_russian:
 nato.9.t: "Изоляционизм или интернационализм?"
 nato.9.d: "В рамках одного из своих предвыборных обещаний президент пообещал вывести Соединенные Штаты из НАТО. Он призвал к меньшему вмешательству в дела мира и возвращению к изоляционистскому состоянию, как перед Второй мировой войной. Однако это может оставить Европу уязвимой для полчищ коммунизма, а СССР получит открытый мир для распространения своих коммунистических идеалов. Если мы останемся изоляционистами, то, надеюсь, не будем втянуты в Третью мировую войну. Какой должна быть внешняя политика США?"
 nato.9.b: "Коммунизм стал слишком большой угрозой. Необходим интернационализм."
 nato.9.a: "Изоляционизм необходим для мира."
  
 nato.10.t: "Америка покидает НАТО"
 nato.10.d: "Президент США Тафт заявил об уходе Америки из НАТО. США заявили, что они хотят вернуться к своей изоляционистской политике, проводившейся до Второй мировой войны. С выходом США из НАТО мы стали гораздо более слабым альянсом. СССР будет легче распространять свое влияние по всему миру. Нам нужно решить, останемся ли мы в альянсе НАТО и удержим то, что можем удержать от СССР, или нам нужно выйти и защищаться самостоятельно. Если мы останемся, Великобритания будет лидером альянса, так как у неё самые мощные вооружённые силы, не считая Америки. Нам необходимо принять решение о будущем альянса."
 nato.10.a: "НАТО обязана защищать свободный мир, с Америкой или без нее."
 nato.10.b: "НАТО слабый альянс, и он стал потерянным делом."
  
 nato.101.t: "[GetNewspaperHeader]США объявили о прекращении членства в НАТО."
 nato.101.d: "Сегодня США объявили о своем выходе из командования НАТО и о своем членстве в этой организации. Президент Тафт заявил, что он желает больше не вмешиваться в иностранные дела и делать то, что лучше для американского народа. Тафт также сказал, что он хочет начать новую эру американского процветания, которая придет с изоляционизмом. Другие члены НАТО потрясены и сейчас собираются на чрезвычайный совет, чтобы обсудить будущее НАТО и свободного мира. СССР заявил, что желает лучшего для США, а также сказал, что их изоляционистская политика поможет миру. Что произойдет со Свободным миром?"
 nato.101.a: "Интересное развитие событий."
  
 nato.11.t: "США покидают НАТО: покинуть или остаться?"
 nato.11.d: "Президент США Тафт объявил о выходе Америки из НАТО. США заявили, что они хотят вернуться к своей изоляционистской политике, проводившейся до Второй мировой войны. С выходом США из НАТО мы стали гораздо более слабым альянсом. СССР будет легче распространять свое влияние по всему миру. Нам нужно решить, останемся ли мы в альянсе НАТО и удержим то, что можем удержать от СССР, или нам нужно выйти и защищаться самостоятельно."
 nato.11.a: "Остаться"
 nato.11.b: "Покинуть"
  
 nato.12.t: "Великобритания отказывается от НАТО: Сформировать ЕОС?"
 nato.12.d: "У нас есть план Плевена, который хочет создать евро-центричный альянс, и он может оказаться мощной альтернативой НАТО. Европейское оборонное сообщество (ЕОС) могло бы помочь остановить СССР и распространение его влияния."
 nato.12.a: "Создадим его: нам нужен европейский альянс."
 nato.12.b: "Не создавайте его: мы должны беспокоиться о себе сами."
  
 nato.13.t: "Франция формирует ЕОС"
 nato.13.d: "Из остатков НАТО была сформирована новая фракция. Эта новая фракция известна как Европейское Оборонное Сообщество и призвана занять место НАТО в Европе. Должны ли мы присоединиться?"
 nato.13.a: "Присоединиться"
 nato.13.b: "Не присоединяться"
  
 nato.14.t: "Реформировать НАТО?"
 nato.14.d: "С приходом новой администрации мы должны определиться с новой политикой. Прежняя внешняя политика была политикой изоляционизма и невмешательства во внешние дела. Должны ли США продолжать свою изоляционистскую политику, или мы должны проводить политики вмешательства? В связи с роспуском НАТО мы можем попытаться реформировать его снова. Какой должна быть наша политика?"
 nato.14.a: "Реформировать"
 nato.14.b: "Не реформировать"
  
 nato.141.t: "[GetNewspaperHeader]Америка реформирует НАТО"
 nato.141.d: "США и десятки других европейских стран встретились сегодня в Брюсселе, чтобы официально реформировать НАТО. Члены НАТО рады, что Америка реформировала альянс, и надеются на усиление Европы. США объявили об изменении политики после расширения советского влияния в Европе и явной угрозы для Америки. Началось размещение американских войск в Европе, и СССР заявил что недоволен агрессией Америки.."
 nato.141.a: "Интересное развитие событий"
  
 nato.15.t: "США реформируют НАТО: приглашение к возвращению в организацию"
 nato.15.d: "США пригласили нас снова вступить в НАТО. Должны ли мы принять?"
 nato.15.a: "Вступить"
 nato.15.b: "Покинуть"
  
 nato.16.t: "Создать ЕОС?"
 nato.16.d: "С приходом новой администрации мы должны определиться с новой политикой. Прежняя внешняя политика была политикой изоляционизма и невмешательства во внешние дела. Должны ли США продолжать свою изоляционистскую политику, или нам следует проводить политику вмешательства? С расформированием НАТО и созданием ЕОС мы можем попытаться реформировать её снова. Какой должна быть наша политика?"
 nato.16.a: "Создать"
 nato.16.b: "Не создавать"
  
 nato.161.t: "[GetNewspaperHeader]EОС распущен! НАТО реформировано Америкой!"
 nato.161.d: "США и десятки других европейских стран встретились сегодня в Брюсселе, чтобы официально реформировать НАТО. Бывшие члены НАТО рады, что Америка реформировала альянс и надеются на усиление Европы. ЕОС в Париже сегодня распустили, но их командная структура будет введена в НАТО. США объявили о таком изменении политики после расширения советского влияния в Европе и явной угрозы для Америки. Началось размещение американских войск в Европе, и СССР заявил что он недоволен агрессией Америки."
 nato.161.a: "Интересное развитие событий."
  
 nato.17.t: "США реформирует ЕОС: приглашение к повторному вступлению"
 nato.17.d: "США реформировали EОС обратно в НАТО, должны ли мы снова вступить в НАТО?"
 nato.17.a: "Вступить"
 nato.17.b: "Покинуть"
  
 nato.171.t: "[GetNewspaperHeader][nato_target.GetName] вновь вступает в НАТО"
 nato.171.d: "[nato_target.GetName] приняла решение о вступлении в НАТО после того, как США реформировали ЕОС."
 nato.171.a: "Интересное развитие событий."
 nato.171.b: "Прискорбно."
  
 nato.172.t: "[GetNewspaperHeader][nato_target.GetName] покидает НАТО"
 nato.172.d: "[nato_target.GetName] решила не вступать в НАТО после того, как США реформировали ЕОС."
 nato.172.a: "Интересное развитие событий."
 nato.172.b: "Отличные новости!"
  
 nato.18.t: "Вновь вступить в НАТО?"
 nato.18.d: "С приходом новой администрации мы должны определиться с новой политикой. Прежняя внешняя политика была политикой изоляционизма и невмешательства во внешние дела. Должны ли США продолжать свою изоляционистскую политику, или мы должны проводить интернационалистскую политику? Поскольку НАТО все ещё вместе, мы могли бы вновь принять участие в защите свободного мира. Какой должна быть наша политика?"
 nato.18.a: "Вступить"
 nato.18.b: "Не вступать"
  
 nato.19.t: "США вновь вступают в НАТО: Остаться или уйти?"
 nato.19.d: "США вновь вступили в НАТО, должны ли мы остаться или уйти?"
 nato.19.a: "Вступить"
 nato.19.b: "Покинуть"
  
 nato.191.t: "[GetNewspaperHeader][nato_target.GetName] Остается в НАТО"
 nato.191.d: "[nato_target.GetName] решила остаться членом НАТО после того, как США вновь вступили в НАТО."
 nato.191.a: "Интересное развитие событий."
 nato.191.b: "Прискорбно."
  
 nato.192.t: "[GetNewspaperHeader][nato_target.GetName] покидает НАТО"
 nato.192.d: "[nato_target.GetName] решила покинуть НАТО после того, как США объявили о возобновлении своего членства в этой организации."
 nato.192.a: "Интересное развитие событий."
 nato.192.b: "Отличные новости!"
  
 nato.111.t: "[GetNewspaperHeader][nato_target.GetName] Остается в НАТО"
 nato.111.d: "[nato_target.GetName] решила остаться членом НАТО, несмотря на потерю США."
 nato.111.a: "Интересное развитие событий."
 nato.111.b: "Прискорбно."
  
 nato.112.t: "[GetNewspaperHeader][nato_target.GetName] Покидает НАТО"
 nato.112.d: "[nato_target.GetName] решила выйти из НАТО, следуя примеру США."
 nato.112.a: "Интересное развитие событий."
 nato.112.b: "Отличные новости!"
  
 nato.121.t: "[GetNewspaperHeader]Франция формирует ЕОС"
 nato.121.d: "Из остатков НАТО была сформирована новая организация. Возглавляемая Францией, эта новая организация известна как Европейское Оборонное Сообщество и призвана занять место НАТО в Европе."
 nato.121.a: "Интересное развитие событий."
  
 nato.122.t: "[GetNewspaperHeader]НАТО распущено"
 nato.122.d: "После экстренного заседания совета, состоявшегося сегодня в Лондоне, НАТО объявило о роспуске альянса. Поскольку Америка недавно покинула альянс, НАТО потеряла поддержку и моральный дух в альянсе. Несколько стран, например, Франция, заявили, что защищать себя должны сами страны, и что НАТО теперь слабый альянс. С уходом НАТО многие беспокоятся о распространении коммунизма, но бывшие члены альянса заявили, что они по-прежнему будут бороться с коммунизмом и его идеалами. Что теперь будет со свободным миром?"
 nato.122.a: "Интересное развитие событий."
 nato.122.b: "Запад ослабевает."
  
 nato.131.t: "[GetNewspaperHeader][edc_target.GetName] Присоединяется к ЕОС"
 nato.131.d: "[edc_target.GetName] решила присоединиться к ЕОС."
 nato.131.a: "Интересное развитие событий."
 nato.131.b: "Прискорбно."
  
 #nato.132.t: "[edc_target.GetName] Присоединяется к ЕОС"
 #nato.132.d: "[edc_target.GetName] решила присоединиться к ЕОС."
 #nato.132.a: "Интересное развитие событий."
 #nato.132.b: "Отличные новости!"
