l_english:
 nato.9.t: ""
 nato.9.d: "В рамках одного из своих предвыборных обещаний президент заявил о выходе Соединенных Штатов из НАТО. Он призвал к меньшему вмешательству в дела мира и возвращению к изоляционистскому состоянию, как когда-то перед Второй мировой войной. Однако это может оставить Европу уязвимой для коммунистических полчищ, а СССР это развяжет руки для распространения своих идеалов. Если мы останемся изоляционистами, то, надеюсь, не будем втянуты в Третью мировую войну. Какой должна стать внешняя политика США?"
 nato.9.b: "Коммунизм стал слишком большой угрозой. Нам необходимо вмешаться в мировую политику."
 nato.9.a: "Изоляционизм необходим для достижения мира."
 nato.10.t: ""
 nato.10.d: "Президент США Тафт заявил о выходе Америки из НАТО. США заявили, что они хотят вернуться к своей изоляционистской политике, проводившейся до Второй мировой войны. С выходом США из НАТО мы стали гораздо более уязвимыми. СССР будет легче распространять свое влияние по всему миру. Нам нужно решить, останемся ли мы в альянсе и попытаемся удержать то, что можем от СССР, или нам нужно выйти и защищаться самостоятельно. Если мы останемся, Великобритания будет лидером альянса, так как у нее самые мощные вооружённые силы после американских. Нам необходимо принять решение о будущем НАТО."
 nato.10.a: "НАТО обязано защищать свободный мир, с Америкой или без нее."
 nato.10.b: "НАТО - слабый альянс, обернувшийся гиблым делом."
 nato.101.t: ""
 nato.101.d: "Сегодня США объявили о своем выходе из командования НАТО и о своем членстве в этой организации. Президент Тафт заявил, что он желает больше не вмешиваться в иностранные дела и делать то, что лучше для американского народа. Тафт также сказал, что хочет начать новую эру американского процветания, которая придет с изоляционизмом. Другие члены НАТО потрясены и сейчас собираются на чрезвычайный совет, чтобы обсудить будущее НАТО и остального Свободного мира. СССР заявил, что желает лучшего для США, а также сказал, что их изоляционистская политика действительно поможет миру. Что же произойдет со Свободным миром?"
 nato.101.a: ""
 nato.11.t: "США покидают НАТО: покинуть альянс с ними или остаться?"
 nato.11.d: "Президент США Тафт заявил о выходе Америки из НАТО. США заявили, что они хотят вернуться к своей изоляционистской политике, проводившейся до Второй мировой войны. С выходом США из НАТО мы стали гораздо более уязвимыми. СССР будет легче распространять свое влияние по всему миру. Нам нужно решить, останемся ли мы в альянсе и попытаемся удержать то, что можем от СССР, или нам нужно выйти и защищаться самостоятельно."
 nato.11.a: ""
 nato.11.b: ""
 nato.12.t: "Великобритания покидает НАТО: Сформировать ЕОС?"
 nato.12.d: "У нас есть план Плевена, предполагаемый создание ориентированного на Европу альянса, который может оказаться мощной альтернативой НАТО. Европейское оборонительное сообщество (ЕОС) могло бы помочь остановить распространение влияния СССР."
 nato.12.a: "Создадим его: Нам нужен Европейский Альянс."
 nato.12.b: "Не создавайте его: Мы должны надеяться только на себя."
 nato.13.t: ""
 nato.13.d: ""
 nato.13.a: ""
 nato.13.b: ""
 nato.14.t: ""
 nato.14.d: "С приходом новой администрации мы должны определиться с новым политическим курсом. Прежняя внешняя политика была изоляционистской, пропагандирующей наше невмешательство во внешние дела. Должны ли США продолжать гнуть эту линию, или мы должны обратиться к интернационалистическим взглядам? В связи с расформированием НАТО мы могли бы попытаться воскресить этот альянс. Что же нам предпринять?"
 nato.14.a: ""
 nato.14.b: "Отказаться от этой затеи"
 nato.141.t: ""
 nato.141.d: "США и десятки других европейских стран встретились сегодня в Брюсселе, чтобы официально реформировать НАТО. Члены альянса рады, что Америка пошла на этот шаг, и надеются на повторное усиление Европы. США объявили об изменении политики после заметного расширения советского влияния в Европе и появлении явной угрозы для своего государства. Началось размещение американских войск в Европе, в ответ на что СССР заявил о своем возмущении агрессией Америки."
 nato.141.a: "Интересное развитие событий."
 nato.15.t: "США реформируют НАТО: Приглашение к Возвращению в Организацию"
 nato.15.d: "США пригласили нас вернуться в НАТО. Должны ли мы согласиться?"
 nato.15.a: "Вернуться"
 nato.15.b: "Не возвращаться"
 nato.16.t: ""
 nato.16.d: "С приходом новой администрации мы должны определиться с новым политическим курсом. Прежняя внешняя политика была изоляционистской, пропагандирующей наше невмешательство во внешние дела. Должны ли США продолжать гнуть эту линию, или мы должны обратиться к интернационалистическим взглядам? С расформированием НАТО и созданием ЕОС мы можем попытаться воскресить старый альянс. Что же нам предпринять?"
 nato.16.a: "Решиться"
 nato.16.b: "Отказаться"
 nato.161.t: "[GetNewspaperHeader]EОС распущен! Америка реформировала НАТО!"
 nato.161.d: "США и десятки других европейских стран встретились сегодня в Брюсселе, чтобы официально реформировать НАТО. Бывшие члены альянса рады, что Америка пошла на этот шаг, и надеются на повторное усиление Европы. Сегодня в Париже было объявлено о роспуске Европейского оборонительного сообщества. США решились на изменение своей политики после заметного расширения советского влияния в Европе и появлении явной угрозы для своего государства. Началось размещение американских войск в Европе, в ответ на что СССР заявил о своем возмущении агрессией Америки."
 nato.161.a: ""
 nato.17.t: "США реформирует ЕОС: Приглашение к Повторному Вступлению"
 nato.17.d: "США реформировали EОС обратно в НАТО, должны ли поверить в эту авантюру и вернуться в альянс?"
 nato.17.a: "Вернуться"
 nato.17.b: "Не возвращаться"
 nato.171.t: ""
 nato.171.d: ""
 nato.171.a: ""
 nato.171.b: ""
 nato.172.t: ""
 nato.172.d: ""
 nato.172.a: ""
 nato.172.b: ""
 nato.18.t: "Вернуться в НАТО?"
 nato.18.d: "С приходом новой администрации мы должны определиться с новым политическим курсом. Прежняя внешняя политика была изоляционистской, пропагандирующей наше невмешательство во внешние дела. Должны ли США продолжать гнуть эту линию, или мы должны обратиться к интернационалистическим взглядам? Поскольку НАТО все еще существует, мы могли бы вновь принять участие в защите свободного мира. Какой же путь нам выбрать?"
 nato.18.a: "Вернуться"
 nato.18.b: ""
 nato.19.t: ""
 nato.19.d: ""
 nato.19.a: "Остаться"
 nato.19.b: ""
 nato.191.t: "[GetNewspaperHeader][nato_target.GetName] остается в НАТО"
 nato.191.d: "[nato_target.GetName] решила остаться членом НАТО после того, как США вновь вступили в организацию."
 nato.191.a: ""
 nato.191.b: ""
 nato.192.t: ""
 nato.192.d: ""
 nato.192.a: ""
 nato.192.b: ""
 nato.111.t: "[GetNewspaperHeader][nato_target.GetName] остается в НАТО"
 nato.111.d: "[nato_target.GetName] решила остаться членом НАТО, несмотря уход США."
 nato.111.a: ""
 nato.111.b: ""
 nato.112.t: "[GetNewspaperHeader][nato_target.GetName] покидает НАТО"
 nato.112.d: "[nato_target.GetName] решила выйти из НАТО, последовав примеру США."
 nato.112.a: ""
 nato.112.b: ""
 nato.121.t: ""
 nato.121.d: "Из остатков НАТО была сформирована новая организация. Возглавляемая Францией, эта новая организация, известная как Европейское Оборонное Сообщество, призвана занять место прошлого альянса в Европе."
 nato.121.a: ""
 nato.122.t: ""
 nato.122.d: "После экстренного заседания совета, состоявшегося сегодня в Лондоне, НАТО объявило о своем роспуске. Поскольку Америка недавно покинула альянс, НАТО потеряла поддержку и моральный дух для дальнейшего функционирования. Несколько стран, например, Франция, заявили, что защищать себя страны должны самостоятельно, и что НАТО теперь настолько слабо, что надежда на защиту со стороны организации потеряла какой-либо смысл. С выходом НАТО из игры многие начали беспокоится о распространении коммунизма, но бывшие члены альянса заявили, что по-прежнему будут бороться с красной угрозой и ее идеалами. Что же теперь будет со свободным миром?"
 nato.122.a: ""
 nato.122.b: "Запад теряет хватку."
 nato.131.t: "[GetNewspaperHeader][edc_target.GetName] присоединяется к ЕОС"
 nato.131.d: ""
