 conventional_sub_engines_0: "Двигатели ПЛ времен ВМВ"
 conventional_sub_engines_0_short: "Двигатели ПЛ времен ВМВ"
 conventional_sub_engines_0_desc: "Большинство первых подводных лодок использовали прямую механическую связь между двигателем внутреннего сгорания и гребным винтом, переключаясь между дизельными двигателями для надводного хода и электродвигателями для подводного движения. По сути, это был гибрид «параллельного» типа, поскольку двигатель и двигатель были соединены с одним и тем же валом."
 conventional_sub_engines_1: "Улучшенные двигатели подводных лодок"
 conventional_sub_engines_1_short: "Улучшенные двигатели ПЛ"
 conventional_sub_engines_1_desc: "Напротив, в настоящей дизель-электрической трансмиссии гребной винт или гребные винты всегда приводятся в движение напрямую или через редуктор одним или несколькими электродвигателями, в то время как один или несколько дизель-генераторов обеспечивают электроэнергию для зарядки аккумуляторов и привода двигателей."
 conventional_sub_engines_2: "Усовершенствованные двигатели подводных лодок"
 conventional_sub_engines_2_short: "Усовершенствованные двигатели ПЛ"
 conventional_sub_engines_2_desc: "В этой технологии используется дизельный двигатель подводной лодки, который может работать обычным образом на поверхности, но также может снабжаться окислителем, обычно хранящимся в виде жидкого кислорода, при погружении. Поскольку металл двигателя будет гореть в чистом кислороде, кислород обычно разбавляют переработанным выхлопным газом. Аргон заменяет выхлопные газы при запуске двигателя."
 conventional_sub_engines_3: "Двигатели подводных лодок Стирлинга"
 conventional_sub_engines_3_short: "Двигатели ПЛ Стирлинга"
 conventional_sub_engines_3_desc: "Двигатель Стирлинга — это тепловой двигатель, который работает за счет циклического сжатия и расширения воздуха или другого газа (рабочего тела) при различных температурах, что приводит к чистому преобразованию тепловой энергии в механическую работу. В частности, двигатель Стирлинга представляет собой регенеративную тепловую машину замкнутого цикла с постоянным газообразным рабочим телом. Замкнутый цикл в данном контексте означает термодинамическую систему, в которой рабочая жидкость постоянно находится внутри системы."
 conventional_sub_engines_4: "Водометные двигатели подводных лодок"
 conventional_sub_engines_4_short: "Водометные двигатели ПЛ"
 conventional_sub_engines_4_desc: "К концу 20 века некоторые подводные лодки, такие как британские подводные лодки класса Vanguard, вместо гребных винтов стали оснащаться водометными движителями. Хотя они тяжелее, дороже и менее эффективны, чем винты, они значительно тише, что дает важное тактическое преимущество."
 nuclear_sub_engines_0: "Ранние ядерные двигатели подводных лодок"
 nuclear_sub_engines_0_short: "Ранние ядерные двигатели ПЛ"
 nuclear_sub_engines_0_desc: "Ранний подводный тепловой реактор или STR, также известный как реактор S2W на вооружении ВМС США, представляет собой реактор с водой под давлением. Ядерная энергетика имеет решающее преимущество в двигателях подводных лодок, потому что это процесс с нулевым уровнем выбросов и без потребления воздуха. Это означает, что подводная лодка с таким реактором теоретически может оставаться под водой бесконечно долго."
 nuclear_sub_engines_1: "Улучшенные ядерные двигатели подводных лодок"
 nuclear_sub_engines_1_short: "Улучшенные ядерные двигатели ПЛ"
 nuclear_sub_engines_1_desc: "Ядерная энергетика произвела революцию в подводной лодке, сделав ее, наконец, настоящим «подводным» судном, а не «погружаемым» кораблем, который может оставаться под водой только ограниченное время. Это дало подводной лодке возможность действовать в подводном положении на высоких скоростях, сравнимых со скоростями надводных кораблей, в течение неограниченного времени, зависящего только от выносливости ее экипажа."
 nuclear_sub_engines_2: "Современные двигатели атомных подводных лодок"
 nuclear_sub_engines_2_short: "Современные двигатели атомных подводных лодок"
 nuclear_sub_engines_2_desc: "Реактор с водой под давлением (PWR) — это тип легководного ядерного реактора. PWR составляют подавляющее большинство мировых атомных электростанций (за исключением Великобритании, Японии и Канады). В PWR теплоноситель первого контура (вода) закачивается под высоким давлением в активную зону реактора, где он нагревается за счет энергии, выделяемой при делении атомов. Затем нагретая вода высокого давления поступает в парогенератор, где передает свою тепловую энергию воде низкого давления вторичной системы, в которой вырабатывается пар."
 sub_batteries_0: "Улучшенные батареи подводных лодок"
 sub_batteries_0_short: "Улучшенные батареи ПЛ"
 sub_batteries_0_desc: "Впервые батареи появились в конце Второй мировой войны на подводной лодке типа XXI, также известной как Электробот или Электрическая лодка. Эта конструкция включает в себя больше батарей, чтобы увеличить время, которое подводная лодка может провести под водой, до нескольких дней с перезарядкой через систему шноркеля. Компоновка батареи типа XXI является предшественником многих других подводных лодок военно-морского флота, таких как советские подводные лодки Whiskey, американские Tang, британские Porpoise и шведские Hajen."
 sub_batteries_1: "Литий-ионные батареи для подводных лодок"
 sub_batteries_1_short: "Литий-ионные батареи ПЛ"
 sub_batteries_1_desc: "Эти батареи имеют примерно вдвое больший запас энергии, чем традиционные батареи, и за счет замены свинцово-кислотных батарей в их обычных местах хранения, а также заполнения большого пространства корпуса, обычно отведенного для воздухонезависимого двигателя и топливных баков, многими тоннами литий-ионные батареи."
 sub_batteries_2: "Водородные батареи для подводных лодок"
 sub_batteries_2_short: "Водородные батареи для ПЛ"
 sub_batteries_2_desc: "Хотя водородно-кислородная силовая установка рассматривалась для подводных лодок еще во время Первой мировой войны, эта концепция не была очень успешной. Этому противодействовало хранение топлива и окислителя в баках за пределами экипажа, между прочным корпусом и внешним легким корпусом. Газы направляются через прочный корпус к топливным элементам по мере необходимости для выработки электроэнергии, но в любой момент времени в отсеке для экипажа присутствует лишь очень небольшое количество газа."
