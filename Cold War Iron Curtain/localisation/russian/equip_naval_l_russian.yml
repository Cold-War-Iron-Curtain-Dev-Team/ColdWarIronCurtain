 subkiller_4_short: "ПТУУ"
 subkiller_5_short: "Сов. ПТУУ"
 subkiller_6_short: "Прод. ПТУУ"
 subkiller_1_desc: "Hedgehog (также известный как Anti-Submarine Projector) был направленным вперед противолодочным оружием, которое использовалось в основном во время Второй мировой войны. Устройство, разработанное Королевским флотом, стреляло до 24 мин впереди корабля при атаке подводной лодки."
 subkiller_2_desc: "Ракетная установка противолодочной обороны представляет собой противолодочную ракетную пусковую установку (ПЛО). В принципе она аналогична системе Hedgehog Королевского флота, использовавшейся во время Второй мировой войны. Кроме того, снаряды реактивные."
 subkiller_3_desc: "Ранние противолодочные торпеды были прямолинейными, и обычно в случае маневрирования цели стреляла группа. Их можно разделить на два основных типа: тяжелые, запускаемые с подводных лодок, и легкие, запускаемые с кораблей."
 subkiller_4_desc: "Дополнительные усовершенствования в противолодочных торпедах означают, что они стали более эффективными, чем раньше. Теперь эти торпеды также можно сбрасывать с самолетов (как с неподвижным крылом, так и с вертолетов) и доставлять с помощью ракеты или ракетной системы."
 subkiller_5_desc: "Дальнейшее совершенствование противолодочных торпед означает, что они стали более успешными, чем прежде. Эти усовершенствованные торпеды теперь также могут быть сброшены с самолетов (как с неподвижным крылом, так и с вертолетов) и доставлены ракетой или ракетным комплексом с более высокими скоростями и перегрузками, чем раньше."
 subkiller_6_desc: "Противоторпедная торпеда предназначена для уничтожения торпед с акустическим самонаведением, с проводным наведением, без проводного наведения и с кильватерным самонаведением, запускаемых по надводным кораблям и подводным лодкам."
