 ww_screens: "Экранопланы эпохи второй мировой войны"
 ww_screens_desc: "Экранопланы во время второй мировой войны были относительно небольшими по сравнению с крупными кораблями, такими как линкоры. Разрушители, эскортные корабли и легкие крейсера были наиболее распространенными классификациями кораблей-экранопланов во время Второй мировой войны. Хотя экранопланы времен Второй мировой войны являются важной основой, на них отсутствует множество важных систем, необходимых для поддержки современных модулей и их правильной работы. Кроме того, новые инновации в электронике и вычислительной технике привели к серьезным изменениям в доктринах и требованиях к конструкции, поэтому они не могут быть приняты на вооружение или дооборудованы модулями, требующими этих инноваций, такими как специальное оружие или современное тяжелое электронное оборудование."
