 ww_capitals: "Корпус линкора ВМВ"
 ww_capitals_desc: "Могучие стальные чудовища эпохи Второй мировой войны. Хотя целесообразность линкора и крейсера была признана неэффективной, в подходящих условиях эти корабли все еще могут нанести смертельный удар."
 battle_hull_medium_0: "Основной корпус линейного крейсера"
 battle_hull_medium_1: "Корпус линейного крейсера"
 battle_hull_medium_2: "Улучшенный корпус линейного крейсера"
 battle_hull_medium_3: "Современный корпус линейного крейсера"
 battle_hull_medium_4: "Продвинутый корпус линейного крейсера"
 battle_hull_medium_0_desc: "Более совершенный корпус линкора эпохи конца Второй мировой войны, эти корабли быстрые и довольно проворные для своих размеров, с большим вооружением для своего времени и потенциалом для модернизации новым оборудованием почти до бесконечности."
 battle_hull_medium_1_desc: "Большой крейсер или боевой крейсер эпохи холодной войны, вооруженный разнообразным оружием. Некоторые из них до сих пор оснащены крупнокалиберными орудиями, оставшимися с тех времен, а другие - новыми и перспективными ракетами \"корабль-воздух\" и \"корабль-поверхность\"."
 battle_hull_medium_2_desc: "Управляемый большой крейсер или боевой крейсер времен холодной войны, вооруженный различными системами оружия для боя \"корабль-корабль\", \"корабль-поверхность\" или \"корабль-воздух\"."
 battle_hull_medium_3_desc: "Большой управляемый крейсер или боевой крейсер времен холодной войны с пространством для действий авиации и большим набором смертоносных ракетных систем."
 battle_hull_medium_4_desc: "Современный управляемый ракетный крейсер или боевой крейсер, вооруженный новейшими ракетными системами или ранними рельсовыми орудиями, может нанести удар из-за горизонта, как ни один другой корабль до него."
