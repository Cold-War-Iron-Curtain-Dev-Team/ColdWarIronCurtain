 ship_armament_medium_ww_desc: "Вооружение среднего калибра, которое выпускалось во время Второй мировой войны."
 ship_armament_medium_0_desc: "Вооружение средних кораблей после Второй мировой войны, похожее по внешнему виду, но из более новых материалов."
 ship_armament_medium_1_desc: "Вооружение средних кораблей эпохи ранней холодной войны со скорострельными орудиями меньшего калибра."
 ship_armament_medium_2_desc: "Cold War era medium ship armaments with rapid firing guns in a similar caliber."
 ship_armament_medium_3_desc: "Вооружение средних кораблей времен холодной войны со скорострельными орудиями аналогичного калибра с улучшенными взрывателями."
 ship_armament_medium_4_desc: "Скорострельные автоматические пушки времен холодной войны, способные вести эффективный огонь на малых дистанциях."
 ship_armament_medium_5_desc: "Скорострельные автоматические пушки эпохи поздней холодной войны, способные вести эффективный огонь на малой дистанции."
 ship_armament_medium_6_desc: "Современные скорострельные автоматические пушки малого калибра с программируемыми взрывателями для максимальной отдачи"
