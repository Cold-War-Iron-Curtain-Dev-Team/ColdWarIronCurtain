 ship_armament_heavy_ww_desc: "Вооружение крупного калибра, которое выпускалось во время Второй мировой войны."
 ship_armament_heavy_0_desc: "Вооружение тяжелых кораблей после Второй мировой войны, похожее по внешнему виду, но из более новых материалов."
 ship_armament_heavy_1_desc: "Вооружение тяжелых кораблей времен холодной войны со скорострельными орудиями аналогичного калибра."
 ship_armament_heavy_2_desc: "Скорострельные крупнокалиберные автоматические пушки времен холодной войны, способные вести эффективный огонь на малых дистанциях."
 ship_armament_heavy_3_desc: "Рельсотрон — это устройство с линейным двигателем, обычно разработанное как оружие, которое использует электромагнитную силу для запуска высокоскоростных снарядов. Снаряд обычно не содержит взрывчатых веществ, вместо этого он полагается на высокую скорость, массу и кинетическую энергию снаряда для нанесения урона."
