 ww_submarines: "Субмарина ВМВ"
 ww_submarines_desc: "Подводные лодки времен Второй мировой войны были сырыми по сравнению с более Современный вариантами. Многие из них должны были оставаться над водой в течение длительного периода времени, прежде чем погрузиться в воду из-за трудностей, с которыми они сталкивались при хранении и получении воздуха. Подводные лодки играют в основном наступательную роль в морском бою, используя торпеды для уничтожения вражеских кораблей, а также используются для уничтожения плохо защищенных транспортных судов. Хотя Subm, подводные лодки времен Второй мировой войны все еще могут выполнять эту критически важную военно-морскую роль и лучше, чем вообще не иметь подводных лодок."
 torpedo_ww: "Торпеды ВМВ"
 torpedo_ww_desc: "Торпеды эпохи ВМВ были противокорабельными торпедами, сравнимыми с легкими торпедами во флотах. Ранее в ходе войны большинство торпед страны страдали от серьезных проблем, таких как не взрывающиеся при желании, идущие глубже, чем установленные, и т. д. Однако позже в ходе войны большинство торпед было заменено более совершенными и совершенными вариантами, включая электрические торпеды. Эти более поздние проекты проложили бы путь для будущих торпед и определили доктрины, используемые в разработке после эпохи Второй мировой войны."
 torpedo_small_0: "Ранние МТ"
 torpedo_small_0_desc: "Ранние послевоенные торпеды следовали большинству конструктивных принципов поздних военных торпед, включая электрические двигатели и контактную детонацию с гироскопическим наведением. Однако послевоенные торпеды будут также включать более новые компоненты, включая пассивный крейсерский гидролокатор. Помимо улучшения наведения и добавления самонаведения, они также обладали большей поражающей способностью и значительно увеличенными дальностями, глубинами и скоростями."
 torpedo_small_1: "Малая торпеда"
 torpedo_small_1_desc: "Следуя ранним разработкам и совершенствуя их, более поздние малые торпеды стали включать в себя более совершенную технологию, такую как активное доплеровское самонаведение и лучшие боеголовки для взрывчатых веществ. Эти торпеды также отличались \"пропеллерами для большей маневренности и скорости\" и \" материалами, которые могли бы позволить им быть развернуты на значительно большей глубине. Эта гибкость и маневренность позволяют подводным лодкам занимать более оптимальные или скрытые позиции и атаковать в районах, более трудных для обороны противника или планирования вокруг него."
 torpedo_small_2: "Улучшенная МТ"
 torpedo_small_2_desc: "Торпеды этой эпохи были полностью переработаны и заменили большинство доктрин торпед эпохи ВМВ. Улучшенные торпеды включают в себя форсунки насосов и поршневые двигатели с наклонной шайбой на монотопливном топливе. В дополнение к этому, боеголовки были Улучшенным с более способными взрывчатыми веществами и взрывателями близости. Эти торпеды также улучшены за счет добавления более эффективных систем наведения, чтобы помочь им в активном поиске и поражении целей. Следует также отметить, что в эту эпоху торпеды стали использовать более легкие металлы или сплавы везде, где им это удавалось, позволяя им быть легче и прочнее, чем когда-либо прежде."
 torpedo_small_3: "Современная МТ"
 torpedo_small_3_desc: "Современные торпеды отличались лучшей акустикой, электроникой и материалами. Эти современные торпеды могут даже вернуться назад в случае промаха и предпринять еще одну атаку, если у них есть топливо. Кроме того, улучшенная акустика и электроника могут значительно сократить число пропущенных при первом шансе. Все эти улучшения вместе позволяют торпедам достичь новых высот летальности."
 torpedo_small_4: "Продвинутая МТ"
 torpedo_small_4_desc: "С наступлением нового века появляются новые технологии и новые задачи для торпед. Контрмеры, средства защиты и \"материалы\" той эпохи вызвали необходимость в более совершенных системах наведения, большей скорости и более высокой взрывчатости. Технология CBASS [Common Broadband and Son Sonar System] позволяет торпедам поражать цели гораздо дальше. Оптимизация структурной целостности и двигательных установок позволяет использовать их на больших глубинах. Эти подводные лодки могут также контролировать окружающие электрические и магнитные поля, чтобы обеспечить высокоточные детонационные взрыватели и обеспечить активное наведение для поражения кораблей в предпочтительных местах."
 torpedo_large_0: "Большие торпеды I"
 torpedo_large_0_desc: "Просто увеличивая количество взрывчатки и увеличивая размер систем наведения и двигателей торпед, вы можете значительно увеличить их огневую мощь. Это, однако, требует разработки лучшей конструкции и расширенной системы двигателя, чтобы выдерживать увеличение веса. Различные усовершенствования этих полей позволили в послевоенное время разработать более крупные и мощные торпеды."
 torpedo_large_1: "Большие торпеды II"
 torpedo_large_1_desc: "В то время как большие корабли начали терять популярность у большинства флотов, в том числе некоторые флоты полностью отказались от тяжелых / линейных крейсеров. потребность в более мощных торпедах не исчезла. Более высокий уровень технологий защиты от подводных лодок и технологий обнаружения подводных лодок создал потребность в торпедах большей дальности. Самое простое решение — просто создать большие торпеды, которые могут вместить больше топлива и иметь более мощные двигатели, чтобы двигаться дальше и поражать цели с большего расстояния. Это, однако, придает большее значение необходимости в более совершенных системах наведения и возможностях дальнего наведения на подводные лодки, что делает проблему более сложной, чем просто наличие торпеды большего размера."
 torpedo_large_2: "Большие торпеды III"
 torpedo_large_2_desc: "Новые доктрины и направления, используемые при проектировании торпед, делают предыдущие методы пусков торпед устаревшими. Увеличить размер поршневых двигателей с наклонной площадкой и насосных форсунок в условиях торпеды не так просто, как на корабле. Многие кормовые конструкции торпеды нуждались в модернизации и переделке. Однако из-за новых технологий создать ее было проще, чем прежние тяжеловесные торпеды."
 torpedo_large_3: "Большие торпеды IV"
 torpedo_large_3_desc: "Одним из ключевых улучшений, внесенных в разработку современных торпед, была возможность вернуться назад для еще одного выстрела промахе. Чтобы оснастить тяжелые торпеды этой возможностью, необходимо было облегчить конструкцию и обновить двигатели."
 slbm_tube_1: "Ранняя ракета БРПЛ"
 slbm_tube_1_desc: "Ранняя ракета БРПЛ была основной, и самые ранние конструкции имели очень ограниченную емкость. Ранняя ракета БРПЛ базировалась на торпедном аппарате с тяжелыми модификациями, сделанными для размещения нового оружия. Однако большая часть затрат на разработку подводных систем, способных запускать weapons оружие, была связана с обширными электронными системами, необходимыми для наведения и наведения ракеты, а не для удержания ее самой. Несмотря на невероятные инвестиции и фундаменты, необходимые для разработки ракеты БРПЛ, подводные лодки имели очень ограниченную дальность и целеуказание из-за примитивной природы ранней электроники."
 slbm_tube_2: "Ракета БРПЛ"
 slbm_tube_2_desc: "В то время как у ранних ракет БРПЛ были серьезные проблемы из-за ограничений технологии в то время, усовершенствования вычислительной техники значительно позволили подводным лодкам иметь гораздо лучшие системы наведения и наведения для БРПЛ, а также миниатюрные размеры бортовых систем, которые могли позволить больше ракет БРПЛ или других систем.\nВ связи с ограничениями HOI4 и форматом конструктора модуля, этот Улучшенный дизайн увеличивает емкость БРПЛ, предполагая, что сэкономленное пространство идет на увеличение количества ракет."
 slbm_tube_3: "Улучшенный ракета БРПЛ"
 slbm_tube_3_desc: "Дальнейшее усовершенствование технологии ракет БРПЛ проложило путь к еще большей дальности и целеуказанию. Последние достижения в области вычислительной техники и электроники позволяют улучшить системы управления БРПЛ. Кроме того, ракеты БРПЛ могут быть загружены автоматически и содержать больше БРПЛ, чем раньше."
 slbm_tube_4: "Современная ракета БРПЛ"
 slbm_tube_4_desc: "Современные системы БРПЛ способны к взаимодействию между стратегической сетью страны и сетью подводных лодок на уровне, ранее невообразимом. Кроме того, современные системы БРПЛ позволяют атомным подводным лодкам нацеливаться на регионы с предельной точностью на невероятно больших дистанциях. Современными БРПЛ позволяют атомным подводным лодкам наносить удары в любую точку мира и действительно обеспечивать взаимное уничтожение даже в случае первого удара, наносящего большой урон."
 rhib_launch_1: "Платформа НЖЛК"
 rhib_launch_1_desc: "НЛЖК - это лодка с жестким корпусом и надувными устройствами. Они могут использоваться для различных операций, включая помощь патрулированию судна, оказание помощи в работе, транспортировку войск и использование в качестве спасательных шлюпок. Самые ранние НЛЖК имели ограниченное применение и возможности по сравнению с более поздними конструкциями, хотя это почти полностью связано с косвенными усилиями по развитию, такими как материальные исследования и небольшие преимущества оборудования. Тем не менее, лодки RHIB могут быть использованы для оказания помощи в морском патрулировании, обеспечении безопасности на море, снижении аварийности и ремонте судна, если у него возникают проблемы, а также для выполнения ряда других задач."
 rhib_launch_2: "Палуба НЛЖК"
 rhib_launch_2_desc: "Использование материалов НЛЖК и косвенные улучшения, сделанных в других областях, значительно повышает их производительность и обеспечивает более высокий уровень гибкости. Тем не менее, необходимо также усовершенствовать сам запуск НЛЖК, включая более совершенные средства для поиска и развертывания, техническое оборудование и стандартизацию самой палубы."
 rhib_launch_3: "Корпус НЛЖК"
 rhib_launch_3_desc: "Дальнейшее улучшение ЖКНЛ с помощью современного оборудования и вспомогательных устройств может значительно помочь во взаимодействии между ЖКНЛ и самим кораблем. Кроме того, добавление рулевых рубок вместе с этими вспомогательными устройствами может повысить эффективность патрулирования"
 rhib_launch_4: "Центр НЛЖК"
 rhib_launch_4_desc: "Продвинутый НЛЖК центр полностью оборудован катера для множества миссий и целей, чтобы значительно снизить количество происшествий с судами и помощь в патрулировании."
 screen_aviation_1: "Основная АП"
 screen_aviation_1_desc: "ПЛ вертолеты - это большие вертолеты, которые несут торпеды, используемые для уничтожения подводных лодок. Эти вертолеты могут помочь защитить корабли от субмарин и двигаться быстрее, чем может корабль или субмарина. Оснащение платформ основной вертолетной площадкой ПЛ вертолётами и обслуживающим персоналом может значительно улучшить противолодочные возможности корабля."
 screen_aviation_2: "Авиационная площадка"
 screen_aviation_2_desc: "Хотя наличие платформы Основной и вертолета ASW является простым и эффективным, этого недостаточно для удовлетворения потребностей армии современный. Оснащение экранного авиационного объекта дополнительными запасными частями и всем оборудованием, необходимым для обслуживания вертолета в течение длительного периода времени в открытом море, необходимо для обеспечения непрерывной, безопасной эксплуатации и продолжения защиты корабля от субмарин."
 screen_aviation_3: "Улучшенная АП"
 screen_aviation_3_desc: "Оснащение авиационной площадки вспомогательным оборудованием и оборудованием для большего количества современных вертолетов дорого, но необходимо для удержания указанных современных вертолетов."
 screen_aviation_4: "Современная АП"
 screen_aviation_4_desc: "Эскортные авианосецы оснащены электронными системами управления полетами, которые помогают обеспечить взаимодействие между вертолетом и кораблем. В сочетании с этим оборудованием Современный, противолодочных вертолетов могут достичь высокого уровня эффективности представительства и защиты своих судов от субмарин."
 countermeasures_0: "Дымовая завеса"
 countermeasures_0_desc: "Дымовая завеса — это дым, выпускаемый для маскировки движения или местоположения воинских частей, таких как пехота, танки, самолеты или корабли. На военных кораблях часто образуется такая дымовая завеса."
 countermeasures_1: "Пирофорные факелы"
 countermeasures_1_desc: "Ракета или Пирофорные факелы - это воздушная инфракрасная мера противодействия, используемая военным кораблем в этом случае для быстрого противодействия ракете с инфракрасным наведением или инфракрасным прицелам."
 countermeasures_2: "Дипольные отражатели"
 countermeasures_2_desc: "Дипольные отражатели — это противорадиолокационная мера, при которой самолеты или другие цели разбрасывают облако маленьких тонких кусочков алюминия, металлизированного стекловолокна или пластика, которое либо появляется как скопление основных целей на экранах радаров, либо захлестывает экран с множественными отражениями, чтобы запутать и отвлечь."
 countermeasures_3: "Лазерный указатель"
 countermeasures_3_desc: "Даззлер — это несмертельное оружие, которое использует интенсивное направленное излучение, чтобы временно вывести цель из строя с помощью вспышки слепоты. Цели могут включать датчики или человеческое зрение."
 countermeasures_4: "ДО/ОР"
 countermeasures_4_desc: "Автоматические реакции на вспышку запускаются без какого-либо вмешательства человека. Бортовой компьютер вычислит приближающуюся угрозу и соответственно запустит сигнальные ракеты."
 countermeasures_5: "ГЛЦ/ЦРП"
 countermeasures_5_desc: "Генераторы ложных целей и глушители с цифровой радиочастотной памятью - это автоматизированные системы, которые можно использовать с точки зрения радиоэлектронной борьбы, чтобы заставить корабль появляться на радаре там, где его нет. Активное глушение цифровых частот может дополнять его, чтобы дополнительно сбить с толку противоборствующую силу."
 countermeasures_6: "Ракета постановки активных помех"
 countermeasures_6_desc: "Активные ракетные ловушки часто представляют собой одноразовые активные ловушки за бортом, предназначенные для отвлечения противокорабельных ракет от их целей. Некоторые из них имеют уникальную конструкцию, заключающуюся в том, что приманка зависает в воздухе, привлекая приближающуюся противокорабельную ракету."
 maritime_sonar_0: "Сонар"
 maritime_sonar_0_short: "Сонар"
 maritime_sonar_0_desc: "Сонар (sound navigation and ranging) это метод, который использует распространение звука (обычно под водой, как в подводной навигации) для навигации, измерения расстояний (дальномерности), связи или обнаружения объектов на поверхности воды или под ней, таких как другие суда."
 maritime_sonar_1: "Детекторы магнитных аномалий"
 maritime_sonar_1_short: "ДМА"
 maritime_sonar_1_desc: "Детектор магнитных аномалий (ДМА) — это прибор, используемый для обнаружения мельчайших изменений магнитного поля Земли. Этот термин относится конкретно к магнитометрам, используемым вооруженными силами для обнаружения подводных лодок (масса ферромагнитного материала создает заметное возмущение в магнитном поле)."
 maritime_sonar_2: "Продвинутый сонар"
 maritime_sonar_2_short: "Продвинутый сонар"
 maritime_sonar_2_desc: "В 1970-х годах были обнаружены соединения редкоземельных элементов и железа с превосходными магнитомеханическими свойствами, а именно сплав терфенол-Д. Это сделало возможными новые конструкции, например, гибридный магнитострикционно-пьезоэлектрический преобразователь. Самым последним из этих улучшенных магнитострикционных материалов является галфенол."
 maritime_sonar_3: "Глобальная сеть прослушивания"
 maritime_sonar_3_short: "ГСП"
 maritime_sonar_3_desc: "ГСП представляет собой сеть массивов гидрофонов, установленных на морском дне по всему Атлантическому и Тихому океанам, как и в системе SOSUS, она использует звуковой канал, существующий в океане, который позволяет низкочастотному звуку распространяться на большие расстояния. Этот канал называется Фиксацией Звучания И Ранжированием, или SOFAR."
 maritime_sonar_4: "Многосенсорные противолодочные координационные системы связи"
 maritime_sonar_4_short: "МПКСС"
 maritime_sonar_4_desc: "Новые подводные угрозы привели к значительному изменению требований, что привело к созданию МПКСС"
