 Goa.2.t: "Португалия получила отчет о передвижении индийских войск"
 Goa.2.d: "Мы получаем тревожные сообщения от губернатора Гоа о массовом размещении индийских вооруженных сил вдоль границы. Он указывает на неизбежность военного вмешательства. Военные отмечают, что нашим войскам будет трудно выдержать длительную кампанию, а отправка подкреплений может в конечном итоге израсходовать ценные ресурсы и сделать другие части империи уязвимыми. Однако некоторые из ведущих политических лидеров настаивают на том, что мы должны обеспечить некоторую оборону, несмотря на все шансы избежать унижения и дать сигнал нашим врагам, что Португалию не получится запугать. Правительство должно следить за ситуацией и решать, что реально можно сделать в военном и дипломатическом плане."
 Goa.2.a: "Гарнизон должен оставаться"
 Goa.7.t: "Португалия информировала о падении Гоа"
 Goa.7.d: "Оборона Гоа оказалась сложной задачей. Индия окружила территорию и проникла в наш стан. Географическая удаленность затрудняла пополнение запасов и развертывание войск. Неспособность ООН привлечь к ответственности Индию до или во время конфликта демонстрирует глобальные двойные стандарты. Однако, несмотря на это, наш гарнизон выполнил свой долг и сопротивлялся до последнего. Гарнизон сообщил нам, что сдастся перед лицом превосходящих сил противника. Хотя наши европейские союзники и США публично высказались поддержав нас, ясно, что это их предел. Народ Португалии будет опустошен этими новостями с Индостана, что в свою очередь вызовет чувство унижения. Некоторые политики уже заявляют, что правительство должно пересмотреть нашу нынешнюю колониальную политику."
 Goa.7.a: "Неприятный удар"
 Macau.2.t: "Стоит ли вести переговоры с китайцами?"
 Macau.2.d: "После Инцидента 12-3 в Макао жители Китая активизировали свою кампанию против решительного ответа Португалии, начав политику «трех нет»: никаких налогов, никаких услуг и никаких продаж португальцам. Эта кампания получила широкую поддержку среди китайских жителей Макао. Правительство Португалии уже ощущает влияние, и ясно, что возвращение к нормальной жизни не на горизонте. Китайское сообщество требует переговоров с правительством относительно будущего Макао и ее отношения с материковым Китаем. Многие в колониальной администрации утверждают, что переговоры с китайцами - лучший способ решить проблему. Уступление некоторых требований восстановит порядок и обеспечит нашу административную роль на территории. Другие официальные лица не согласны, они утверждают, что уступки мятежникам могут привести только к новым беспорядкам и несправедливым требованиям. Решение должно быть принято."
 Macau.2.a: "Вести переговоры"
 Macau.2.b: "Нас не шантажировать не получится"
 Macau.3.t: "Португалия ведет переговоры с китайцами"
 Macau.3.d: "После Инцидента 12-3 и жесткого военного ответа разъяренные китайские жители Макао начали политику \ \"трех нет \": никаких налогов, никаких услуг и никаких продаж португальцам. Эта кампания распространилась по всему китайскому сообществу и имеет серьезные экономические и социальные последствия. Португальцы отчаянно пытаются восстановить нормальную жизнь, и после интенсивного давления португальские власти согласились провести переговоры с китайцами. Хотя противники утверждают, что переговоры приведут к более несправедливым требованиям, правительство, похоже, намерено провести переговоры и предложить некоторые уступки, чтобы помочь восстановить порядок и сохранить административную роль Португалии в отношении территории."
 Macau.3.a: "Мирное разрешение в скором времени"
 Macau.4.t: "Инцидент 12-3 в Макао"
 Macau.4.d: "Несколько недель назад жители, работающие с местными левыми организациями, начали строительство частной школы в Макао. Однако из-за неуплаты взяток португальским чиновникам, они же приостановили работы в школе. Сразу же начались столкновения между жителями и полицией, приведшие к арестам и ранениям. Однако вчера все это обострилось. Около 13:00 местные красногвардейцы, вдохновленные Культурной революцией на материке, начали жестокие бунты по всему Макао. К бунтовщикам присоединились другие жители Китая, которые штурмовали правительственные здания, сносили статуи и поджигали правительственные документы. Власти Португалии объявили военное положение, и вмешались военные. По меньшей мере восемь протестующих погибли, несколько сотен получили ранения. Число арестованных неизвестно, но по неподтвержденным данным счет идет на сотни."
 Macau.4.a: "О нет! Только не статуи!"
 Macau.6.t: "Протестующие, усиленные Красногвардейцами, атаковали португальские предприятия, правительственные здания и общественные символы колониального режима. Мятежники снесли статуи Хорхе Альвареса и полковника Висенте Николау де Мескита. Пожары уничтожили книги и колониальные постройки. Португальский гарнизон объявил военное положение и жестоко восстановил подобие порядка при поддержке полиции. Восемь протестующих были убиты, сотни ранены. Беспорядки пока закончились, но напряженность остается высокой, а китайская община остается в ярости. Надежды на быстрое восстановление порядка маловероятны, поскольку напряженность в Макао остается высокой."
 Macau.6.d: "The 1-2-3 Riots, exacerbated by the involvement of the Red Guards, attacked Portuguese businesses, government buildings, and public symbols of the colonial regime. The rioters tore down statues of Jorge Álvares and Colonel Vicente Nicolau de Mesquita. Fires burned books and colonial buildings. The Portuguese garrison declared martial law and brutally restored a semblance of order with police support. Eight of the protesters were killed with hundreds wounded. The riots are over for now, but tensions remain high and the Chinese community remains infuriated. Hopes a quick response would restore order appear unlikely as tension remains high across Macau."
 Macau.6.a: "Смутные времена"