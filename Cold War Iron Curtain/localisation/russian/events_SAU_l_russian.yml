l_russian:
 arabia.1.t: "Арабы Спрашивают Наши Колонии"
 arabia.1.d: "Сегодня саудовско-арабский дипломат Ахмут аль-паша принес нам предложение от своего короля. Они предлагают взять под свой контроль наши колонии на Аравийском полуострове. После недавних открытий нефти в этом регионе сказать " нет " означало бы, что мы больше не получаем от них необходимой нефти. Что же нам делать?"
 arabia.1.a: "Принять предложение"
 arabia.1.b: "Как Они Смеют!"
 arabia.2.t: "Англичане Уступили Нашим Требованиям"
 arabia.2.d: "После дружественных переговоров Британия решила уступить нам свои колонии на Аравийском полуострове за право экспорта и бурения нефти в нашем регионе."
 arabia.2.a: "Ислам Восстанет Снова!"
 arabia.3.t: "Британия Отклоняет Наши Требования"
 arabia.3.d: "Англичане отвергли наши требования, они не оставляют нам выбора, чтобы прекратить торговлю нефтью с ними и взять землю силой."
 arabia.3.a: "Мы возьмем то, Что принадлежит Нам!"
 arabia.4.t: "[GetNewspaperHeader]Количества Обнаруженной Нефти"
 arabia.4.d: "После пяти лет бесплодного бурения скважина № 7 наконец-то добыла нефть «3 марта 1938 года». Это открытие оказалось бы первым из многих, в конечном итоге обнаружив самый большой источник сырой нефти в мире. Это открытие навсегда изменит политические отношения на Ближнем Востоке."
 arabia.4.a: "Интересно"
 arabia.4.b: "Это черное золото!"
 arabia.5.t: "Объединяйтесь С Йеменом И Оманом"
 arabia.5.d: "Поскольку мы освободили наш народ и взяли под законный контроль наши исторические территории, многие арабские меньшинства или в некоторых районах даже большинство населения могли бы быть использованы лучше. Позволив лояльным исламистам занять место в своих институтах, мы можем превратить государства Оман и Йемен в центральные государства, не так ли?"
 arabia.5.a: "Мы должны это сделать"
 arabia.5.b: "Слишком много потрачено сил, ничего не делай"
 arabia.6.t: "Приглашение Из Аравии"
 arabia.6.d: "Сегодня дипломат Арабского халифата Мехмет аль-паша принес нам предложение. Он предлагает сформировать оборонительный союз между нашими исламскими странами"
 arabia.6.a: "Мы Примем!"
 arabia.6.b: "Мы будем стоять одни!"
 arabia.7.t: "[PER.GetNameDef] Присоединяется к нашему Альянсу"
 arabia.7.d: "Разумно искать союзников в эти непредсказуемые времена. Мы, сыновья Мухаммеда, должны держаться вместе и распространять исламские учения по всему миру."
 arabia.7.a: "Добро пожаловать!"
 arabia.8.t: "[PER.GetNameDef] Отвергла наш Альянс"
 arabia.8.d: "Иран Отклонил наш Альянс"
 arabia.8.a: "Дураки"
 arabia.9.t: "Подписано Нефтяное концессионное соглашение"
 arabia.9.d: "Сегодня, после заключения нефтяного концессионного соглашения между Саудовской Аравией и компанией Standard Oil Company, два американских геолога высадились в небольшом порту Джубайль. Они пришли, чтобы начать поиски нефти на Аравийском полуострове. Открываем старые нефтяные буры и даем работу многим нашим людям."
 arabia.9.a: "Мы оба извлекаем выгоду из этого соглашения"
 arabia.10.t: "Объединиться С Бывшими Британскими Колониями"
 arabia.10.d: "Поскольку мы освободили наш народ и взяли под законный контроль наши исторические территории, многие арабские меньшинства или в некоторых районах даже большинство населения могли бы быть использованы лучше. Позволив лояльным исламистам занять место в своих институтах, мы можем превратить бывшие британские государства в центральные государства, не так ли?"
 arabia.10.a: "Мы должны это сделать"
 arabia.10.b: "Слишком много потрачено сил, ничего не делай"
 arabia.11.t: "Аравия приглашает Нас"
 arabia.11.d: "Сегодня дипломат Арабского халифата Мехмет аль-паша принес нам предложение. Он предлагает сформировать оборонительный союз между нашими исламскими странами"
 arabia.11.a: "Мы Примем!"
 arabia.11.b: "Мы будем стоять одни!"
 arabia.12.t: "[TUR.GetNameDef] Присоединяется к нашему Альянсу"
 arabia.12.d: "Получив наше предложение, Турция приняла наше приглашение"
 arabia.12.a: "Добро пожаловать, братья!"
 arabia.13.t: "[TUR.GetNameDef] Отклонил наш Альянс"
 arabia.13.d: "Турция Отклонила наш Альянс"
 arabia.13.a: "Дураки"
 arabia.14.t: "Падение Каира"
 arabia.14.d: "Силы арабских вооруженных сил пробились к Каиру, столице Египта. Союзные войска в беспорядке отступили дальше в пустыню, саудовские солдаты, маршировавшие через Каир, приветствовались как освободители многими гражданами, которые стали рассматривать британцев как угнетателей.Падение Каира является значительной потерей для военных усилий союзников, и некоторые эксперты предположили, что вся Африка теперь открыта для арабского завоевания."
 arabia.14.a: "Нас не Остановить!"
 arabia.15.t: "[GetNewspaperHeader]Падение Анкары"
 arabia.15.d: "Ранее сегодня силы Арабского халифата успешно заняли город Анкару, жизненно важную стратегическую цель в их войне против Турции. Расположенный в центре Малой Азии, город является ключом к арабскому пути в Европу.Захват \n\nIts ставит Аравию в положение расширить войну дальше в Средиземное море."
 arabia.15.a: "Победа принадлежит Нам!"
 arabia.16.t: "[GetNewspaperHeader]Падение Багдада"
 arabia.16.d: "После нескольких противоречивых сообщений теперь было подтверждено, что Багдад пал к арабам. Этот стратегический город охраняет вход в великий шелковый путь и 2 жизненно важные реки, и до начала войны он считался неприступным. Иракский гарнизон отступил в туннели, проходящие под городом, но в конце концов был вытеснен огнеметами и гранатами. С Багдадом в руках арабов произошел драматический сдвиг власти в битве за Ближний Восток"
 arabia.16.a: "Победа принадлежит нам!"
