l_russian:
 SYR_stateoftheeconomy: "Состояние экономики"
 SYR_stateoftheeconomy_desc: ""
 SYR_headwaterdiversionplan: "План Отвода Верховьев"
 SYR_headwaterdiversionplan_desc: ""
 SYR_purgeconspirators: "Чистка заговорщиков"
 SYR_purgeconspirators_desc: "Хотя мы пришли к власти в результате переворота, это не значит, что мы невосприимчивы к нему. Пришло время принять превентивные меры."
 SYR_thepeopleswaragainstzionism: "Народная война против сионизма"
 SYR_thepeopleswaragainstzionism_desc: "Не только вооруженные силы, но и сирийский народ должны готовиться к войне против сионизма."
 SYR_denouncethereactionaries: "Осудить реакционеров"
 SYR_denouncethereactionaries_desc: "Арабские монархии — бесхребетные марионетки империалистического Запада. Мы не видим необходимости быть с ними милостивыми."
 SYR_canceltheunification: "Отмена объединения"
 SYR_canceltheunification_desc: "С другой стороны, как мы можем доверять Египту, чтобы он снова не маргинализировал нас? Нам лучше быть самим по себе"
 SYR_harderstanceagainstisrael: "Более жесткая позиция в отношении Израиля"
 SYR_harderstanceagainstisrael_desc: "Наш долг — продолжать боевые действия против Израиля в знак солидарности с нашими палестинскими братьями."
 SYR_secondbaathcoup: "Второй переворот Баас"
 SYR_secondbaathcoup_desc: "Старая гвардия не в состоянии управлять страной в соответствии со своим старым мышлением. Сейчас мы возьмем все на себя."
 SYR_startunificationplanning: "Приступить к планированию объединения"
 SYR_startunificationplanning_desc: "После завершения переговоров с Египтом и Ираком мы готовимся к объединению."
 SYR_attempttoformtheunitedarabrepublic: "Попытка образования Объединенной Арабской Республики"
 SYR_attempttoformtheunitedarabrepublic_desc: "Мы снова создадим Объединенную Арабскую Республику. На этот раз сепаратистов больше не будет."
 SYR_conductunificationtalkswithegypt: "Провести переговоры об объединении с Египтом"
 SYR_conductunificationtalkswithegypt_desc: "Мы с отвращением оставили предыдущую попытку объединения, но, может быть, попробуем еще раз?"
 SYR_discussunificationwithiraq: "Обсудить объединение с Ираком"
 SYR_discussunificationwithiraq_desc: "Ирак проявил интерес к присоединению к ОАР. Мы еще обсудим с ними этот вопрос."
 SYR_purgethenasserists: "Чистка нассеристов"
 SYR_purgethenasserists_desc: "Чистка комнатных собачек Насера должна быть предупредительной. Здесь у него не будет никакой власти."
 SYR_8thofmarchrevolution: "Революция 8 Марта"
 SYR_8thofmarchrevolution_desc: "Наше нынешнее правительство оказалось некомпетентным и неспособным помочь сирийскому народу. Пришло время изменить это силой."
 SYR_nationalcouncilfortherevolutionarycommand: "Национальный совет революционного командования"
 SYR_nationalcouncilfortherevolutionarycommand_desc: "После революции 8 марта мы сформируем руководящий орган, который лучше представляет Сирию."
 SYR_strengthenourrule: "Укрепить наше правление"
 SYR_strengthenourrule_desc: "Наша победа над сионистским режимом закрепила за нами статус национальных героев. Противники нашего правления молчат от стыда."
 SYR_enforcetheheadwaterdiversionplan: "Обеспечение выполнения плана отвода истоков"
 SYR_enforcetheheadwaterdiversionplan_desc: "Победой мы заставили замолчать протесты сионистов против нашего плана отвода воды. Мы будем делать все, что захотим, пока они беспомощно наблюдают."
 SYR_reviewingthearmedforces: "Обзор вооруженных сил"
 SYR_reviewingthearmedforces_desc: "В новом десятилетии наши вооруженные силы должны быть готовы к грядущим конфликтам."
 SYR_politicisedmilitary: "Политизированная армия"
 SYR_politicisedmilitary_desc: "Сохранение лояльности армии к партии гарантирует, что мы маргинализируем оппозицию, которая может использовать их против нас."
 SYR_newgenerationofofficers: "Новое поколение офицеров"
 SYR_newgenerationofofficers_desc: "Новые офицеры и новые таланты проложат путь к военным реформам."
 SYR_reviewingthearmy: "Обзор армии"
 SYR_reviewingthearmy_desc: "Настало время провести обзор армии."
 SYR_reviewingtheairforce: "Обзор ВВС"
 SYR_reviewingtheairforce_desc: "Настало время провести обзор ВВС."
 SYR_sovietaircraftpurchases: "Закупки советских самолетов"
 SYR_sovietaircraftpurchases_desc: "Покупка новейших самолетов на рынке будет держать нас в хорошей форме."
 SYR_reviewingthenavy: "Обзор военно-морского флота"
 SYR_reviewingthenavy_desc: "Настало время пересмотреть военно-морской флот."
 SYR_spanishpanzers: "Испанские танки"
 SYR_spanishpanzers_desc: "Среди наших последних военных закупок — Panzer IV. Может быть, это напугает сионистов, когда они увидят, что прошлое преследует их?"
 SYR_sovietinstructors: "Советские инструкторы"
 SYR_sovietinstructors_desc: "Наличие советских летчиков для обучения наших собственных пилотов поможет повысить компетентность ВВС."
 SYR_dockyardupgrades: "Модернизация военно-морских баз"
 SYR_dockyardupgrades_desc: "Модернизация наших военно-морских баз позволит нам повысить военно-морской потенциал."
 SYR_strenghenthemukhabarat: "Укрепление мухабарата"
 SYR_strenghenthemukhabarat_desc: "Нашей военной разведкой нельзя пренебрегать, пока наши враги что-то замышляют против нас."
 SYR_kgbassistance: "Помощь КГБ"
 SYR_kgbassistance_desc: "У советских агентов КГБ есть несколько трюков в рукаве, которым они могут нас научить. Мы будем учиться у них."
 SYR_studysovietdesigns: "Изучать советские образцы"
 SYR_studysovietdesigns_desc: "Изучение конструкции советских кораблей, поможет в проектировании наших кораблей."
 SYR_rootoutzionistspies: "Искоренить сионистских шпионов"
 SYR_rootoutzionistspies_desc: "Сионисты, возможно, держат свой нос слишком близко к нам. Что это? Необычные сигналы из квартиры Таабет?"
 SYR_surveillancewithinthecountry: "Надзор внутри страны"
 SYR_surveillancewithinthecountry_desc: "Благожелательное правительство, такое как наше, заботится о том, чтобы люди были хорошими, а не просто вели себя хорошо."
 SYR_sovietalignment: "Связи с советами"
 SYR_sovietalignment_desc: "Советский Союз - естественный союзник против сионистского империализма. Мы должны укреплять двусторонние связи."
 SYR_strengthenthebaathparty: "Укрепить партию Баас"
 SYR_strengthenthebaathparty_desc: "Утверждение позиции партии Баас выше других имеет решающее значение для выживания государства."
 SYR_1964arableaguesummit: "Саммит Лиги арабских государств 1964 года"
 SYR_1964arableaguesummit_desc: ""
 SYR_studycapturedisraeliweapons: "Изучение трофейного израильского оружия"
 SYR_studycapturedisraeliweapons_desc: "После нашей победы сионисты ушли в спешке, забыв часть своего оборудования. Мы, конечно, должны изучить их, выразив благодарность нашему советскому союзнику, отправив ему несколько образцов."
 SYR_assadjadidpowerstruggle: "Борьба за власть между Асадом и Джадидом"
 SYR_assadjadidpowerstruggle_desc: "Ссора между помощником регионального секретаря партии Баас Салахом Джадидом и министром обороны Хафезом аль-Асадом стала очевидной, а разногласия становились все более непримиримыми. Только Бог знает, кто победит в этой борьбе."
 SYR_jadidvictory: "Победа Джадида"
 SYR_jadidvictory_desc: "Помощник регионального секретаря партии Баас Салах Джадид успешно подавил попытку переворота Асада, обеспечив продолжение жесткого левого курса Сирии."
 SYR_assadvictory: "Победа Асада"
 SYR_assadvictory_desc: "Министр обороны Хафез аль-Асад и его умеренные сторонники взяли верх, направив сирийскую политику в прагматичное русло."
 SYR_alliancewiththesyriancommunistparty: "Альянс с Сирийской коммунистической партией"
 SYR_alliancewiththesyriancommunistparty_desc: "Вступая в партнерские отношения с Коммунистической партией, мы демонстрируем нашу приверженность социализму."
 SYR_correctivemovement: "Корректирующее направление"
 SYR_correctivemovement_desc: "С помощью Корректирующего Направления пришло время исправить ошибки, допущенные Джадидом и его радикалами."
 SYR_purgemilitaryfactionalism: "Избавиться от военного фракционнонализма"
 SYR_purgemilitaryfactionalism_desc: "Военные слишком долго были занозой. Новая чистка позволит держать их в узде."
 SYR_requesttojointhewarsawpact: "Запрос сирийско-советского договора об обороне"
 SYR_requesttojointhewarsawpact_desc: "Мы верим, что наше будущее связано с нашими друзьями в Москве. Мы должны посмотреть, смогут ли они согласиться на договор о взаимной обороне."
 SYR_nonalignment: "Независимость"
 SYR_nonalignment_desc: "Принимая курс на неприсоединение, мы не только защищаем себя в большом конфликте между Востоком и Западом, но и объединяемся с другими, которые стремятся к тому же."
 SYR_reaffirmsovietties: "Подтверждение связей с советским союзом"
 SYR_reaffirmsovietties_desc: "Свержение верного просоветского союзника, которым был Джадид, вызвало некоторую обеспокоенность. Уверяю вас, мы по-прежнему друзья."
 SYR_inviteaflaqites: "Пригласить афлакитов"
 SYR_inviteaflaqites_desc: "Пригласив бывших афлакитов, бежавших в Ирак, мы сможем частично разморозить отношения со старыми баасистами."
 SYR_diplomaticmissiontochina: "Дипломатическая миссия в Китае"
 SYR_diplomaticmissiontochina_desc: "Отправка миссии в Китай не только подтверждает нашу независимость, но и дает понять Советскому Союзу, что мы можем выбирать, с кем дружить. Теперь они не могут позволить себе потерять нас."
 SYR_civiliancontrolofthemilitary: "Гражданский контроль над вооруженными силами"
 SYR_civiliancontrolofthemilitary_desc: "Установление гражданского контроля положит конец военному вмешательству в политику."
 SYR_arabdefeat: "Поражение арабов"
 SYR_arabdefeat_desc: "Сионистская агрессия в 1967 году привела к уничтожению сирийских арабских вооруженных сил и оккупации Голанских высот."
 SYR_arabvictory: "Победа арабов"
 SYR_arabvictory_desc: "Сионистская агрессия 1967 года привела к уничтожению их так называемых «Сил обороны» и нанесла им унижение."
 SYR_sixdaywar: "Война 1967"
 SYR_sixdaywar_desc: "В 8:45 утра сионистские самолеты нанесли внезапный удар по египетским радиолокационным станциям, аппарату ПВО и авиабазам, вызвав полный паралич телекоммуникаций между египетским руководством и его силами. В течение четырех часов израильская авиация уничтожила около 85% наземных египетских самолетов."
 SYR_requestemergencyarmssupply: "Запросить экстренную поставку оружия"
 SYR_requestemergencyarmssupply_desc: "В ходе войны мы связались с Советским Союзом, чтобы он снабдил нас оружием, чтобы возместить наши потери."
 SYR_governmentmarketingorganisations: "Государственные маркетинговые организации"
 SYR_governmentmarketingorganisations_desc: "Правительство официально возьмет на себя продажу товаров в соответствии с принципами арабского социализма."
 SYR_commercialbankofsyria: "Коммерческий банк Сирии"
 SYR_commercialbankofsyria_desc: "Коммерческий банк, контролируемый государством, - это то, что нужно сирийской экономике в противовес частным банкам."
 SYR_upgradethepowergrid: "Модернизация нашей национальной энергосистемы"
 SYR_upgradethepowergrid_desc: "Для удовлетворения нового промышленного и бытового спроса на электроэнергию необходимо будет инвестировать в нашу энергосистему."
 SYR_tabqadam: "Плотина Табка"
 SYR_tabqadam_desc: "Построив плотину на Евфрате, мы сможем использовать потенциал реки в электроэнергетике и сельском хозяйстве."
 SYR_rumailiaoilfield: "Нефтяное месторождение Румайлия"
 SYR_rumailiaoilfield_desc: "В прошлом десятилетии мы нашли еще одно месторождение нефти возле Каратчока. ришло время освоить и его."
 SYR_socialistlandreforms: "Социалистические земельные реформы"
 SYR_socialistlandreforms_desc: "Наша экономика находится в стагнации, потому что земля все еще находится под властью феодальной элиты. Пришло время силой изменить эту практику."
 SYR_nationalisationofindustries: "Национализация промышленности"
 SYR_nationalisationofindustries_desc: "Правительство национализирует частные предприятия, чтобы представлять интересы сирийского народа."
 SYR_militaryindustrialallocation: "Военно-промышленный комплекс"
 SYR_militaryindustrialallocation_desc: "По мере приближения войны мы будем готовить некоторые заводы для снабжения наших военных."
 SYR_easternbloctrade: "Торговля с Восточным блоком"
 SYR_easternbloctrade_desc: "Торговля с Советским Союзом и его сателлитами принесет нам большую пользу."
 SYR_egalitarianworkplace: "Эгалитарные рабочие места"
 SYR_egalitarianworkplace_desc: "Гендерное равенство не только улучшает общество, но и способствует укреплению нашей национальной рабочей силы."
 SYR_generalfederationoftradeunions: "Всеобщая федерация профсоюзов"
 SYR_generalfederationoftradeunions_desc: "Объединив все профсоюзы во Всеобщую федерацию профсоюзов, мы будем представлять интересы трудящихся от их лица."
 SYR_implementhealthcarefoundations: "Внедрить основы здравоохранения"
 SYR_implementhealthcarefoundations_desc: "Переход от феодальной экономики, национальные реформы здравоохранения являются отличительной чертой современной экономики."
 SYR_ministryofhighereducation: "Министерство высшего образования"
 SYR_ministryofhighereducation_desc: "Создавая орган высшего образования, мы гарантируем, что у нас будут работать самые умные сирийцы."
 SYR_triumphatdamascus: "Триумф в Дамаске"
 SYR_triumphatdamascus_desc: "В ознаменование нашей победы над сионистским режимом мы проведем парад в Дамаске. Мир увидит наш триумф!"
 SYR_shifttheblame: "Объединить наших людей"
 SYR_shifttheblame_desc: "Наша неудача в конфликте указывает на одно - отсутствие единства среди сирийского народа. Сейчас мы должны сплотить народ ради одной цели. Освобождение Голанских высот."
 SYR_syrianscientificstudiesandresearchcenter: "Сирийский центр научных исследований и разработок"
 SYR_syrianscientificstudiesandresearchcenter_desc: "Этот институт поможет значительно улучшить положение страны, координируя работу наших ученых."
 SYR_bitterlessons: "Горький урок"
 SYR_bitterlessons_desc: "Наше поражение стало для нас тревожным сигналом. Мы должны принять эти уроки близко к сердцу."
 SYR_syrianarabnewsagency: "Сирийское арабское информационное агентство"
 SYR_syrianarabnewsagency_desc: "Мы создадим SANA, чтобы укрепить поток информации внутри страны."
 SYR_trainingineastgermany: "Обучение в Восточной Германии"
 SYR_trainingineastgermany_desc: "Направляя наших офицеров на обучение в Восточную Германию, мы повышаем их компетентность на местах."
 SYR_mendthefences: "Чинить ограды"
 SYR_mendthefences_desc: "Позиция Джадида по отношению к другим арабским государствам не принесла нам ничего хорошего. Мы начнем налаживать связи, особенно в Персидском заливе."
 SYR_nationalprogressivefront: "Национальный прогрессивный фронт"
 SYR_nationalprogressivefront_desc: "Политический союз с другими партиями не только контролирует оппозицию, но и создает имидж единого фронта против западного империализма."
 SYR_rejuvenatetheprivatesector: "Омоложение частного сектора"
 SYR_rejuvenatetheprivatesector_desc: "Добавление пара в частный сектор позволит преодолеть ущерб, нанесенный Джадидом его социалистической политикой."
 SYR_religiousrevival: "Религиозное возрождение"
 SYR_religiousrevival_desc: "Возвращая религию в широкую общественную жизнь, мы изображаем себя ее защитниками."
 SYR_updatingournavaldoctrine: "Обновление нашей военно-морской доктрины"
 SYR_updatingournavaldoctrine_desc: "Наша военно-морская доктрина должна постоянно обновляться."
 SYR_thepuppetpresident: "Марионеточный президент"
 SYR_thepuppetpresident_desc: "Кто наблюдает за Джадидом, пока он наблюдает за аль-Аттаси?"
 SYR_modernsovietequipment: "Современная советская техника"
 SYR_modernsovietequipment_desc: "Последние приобретения позволят нам встать вровень с нашими соседями."
 SYR_airbaseupgrades: "Модернизация авиабаз"
 SYR_airbaseupgrades_desc: "Нашим авиабазам придется наверстывать упущенное, чтобы поддерживать наши новые самолеты в рабочем состоянии."
 SYR_upgradelatakianavalbase: "Модернизация военно-морской базы Латакия"
 SYR_upgradelatakianavalbase_desc: "Военно-морской комплекс в Латакии будет обновляться для нужд нашего флота."
 SYR_radarinstallations: "Установка радаров"
 SYR_radarinstallations_desc: "Радары необходимы, чтобы следить за тем, что могут делать наши враги."
 SYR_airdefencecapabilities: "Средства ПВО"
 SYR_airdefencecapabilities_desc: "Для сохранения превосходства в воздухе наша ПВО должна быть готова к отражению акат"
 SYR_resettlegolanirefugees: "Переселение беженцев из Голани"
 SYR_resettlegolanirefugees_desc: "Потеря Голан привела к тому, что наши граждане бежали от боевых действий, а затем и от сионистской оккупации. Мы должны будем помогать их переселению."
 SYR_blackseptember: "Черный сентябрь"
 SYR_blackseptember_desc: ""
 SYR_entrenchrifdimashq: "Укрепление Риф Димашк"
 SYR_entrenchrifdimashq_desc: "Сионисты захватили нашу землю, и вполне логично, что они пойдут дальше в своих захватах. Мы должны немедленно укрепиться."
 SYR_alawitesecurityapparatus: "Алавитский аппарат безопасности"
 SYR_alawitesecurityapparatus_desc: "По первому инстинкту, кому вы будете доверять? Семье? Клану? Или единоверцам, чтобы создать свой охранный аппарат?"
 SYR_cutfoodprices: "Снижение цен на продукты питания"
 SYR_cutfoodprices_desc: "Мы можем подавить общественные волнения, поставляя предметы первой необходимости. Снизив цены на продукты питания, люди будут менее склонны к беспорядкам."
 SYR_loosentraderestrictionswithlebanon: "Ослабление торговых ограничений с Ливаном"
 SYR_loosentraderestrictionswithlebanon_desc: "Сокращение торговли с Ливаном поможет нашей экономике быстрее восстановиться."
 SYR_gainindustrialknowledge: "Получение промышленных знаний"
 SYR_gainindustrialknowledge_desc: "Многому можно научиться, чтобы улучшить нашу промышленность."
 SYR_armtheplo: "Вооружать ООП"
 SYR_armtheplo_desc: "Что толку от боевиков без оружия? Мы предоставим наши старые запасы в качестве основы для их снабжения.(ООП - Организация освобождения Палестины)"
 SYR_intervenefortheplo: "Вмешаться в дела ООП"
 SYR_intervenefortheplo_desc: "Поскольку ООП воюет с иорданцами, вмешательство может иметь для нас некоторые преимущества."
 SYR_aligntheplotosyria: "Привязать ООП к Сирии"
 SYR_aligntheplotosyria_desc: "ООП очень обязана нам тем, что мы можем навязать им свою волю. Они будут покорны нашим прихотям."
 SYR_refusetointervene: "Отказаться от вмешательства"
 SYR_refusetointervene_desc: "Война между ООП и Иорданией - это не наша война, чтобы вмешиваться в нее. Мы не будем тратить там свою кровь."
 SYR_reachouttoarabsocialiststates: "Установить контакты с арабскими социалистическими государствами"
 SYR_reachouttoarabsocialiststates_desc: "Альянсы с другими арабскими социалистическими государствами - естественная цель, к которой следует стремиться."
 SYR_enforcesecularism: "Обеспечить светский характер государства"
 SYR_enforcesecularism_desc: "Отстраняя религию от политики, мы сохраняем светский принцип арабского социализма."
 SYR_publicworksinvestment: "Инвестиции в общественные работы"
 SYR_publicworksinvestment_desc: "Инвестиции в инфраструктуру будут удерживать внимание общественности в других местах."
 SYR_geartowardsautarky: "Переход к автаркии"
 SYR_geartowardsautarky_desc: "Открытая экономика делает нас уязвимыми для экономических атак. Изоляция и самодостаточность будут более эффективны."
 SYR_snubchina: "Высокомерный Китай"
 SYR_snubchina_desc: "Игнорируя Китай, мы показываем Советскому Союзу, что являемся их самым последовательным союзником."
 SYR_agriculturalmanagement: "Управление сельским хозяйством"
 SYR_agriculturalmanagement_desc: "Советская сельскохозяйственная модель - это то, к чему мы должны стремиться. Давайте пойдем по их стопам."
 SYR_sovietorbit: "Советская орбита"
 SYR_sovietorbit_desc: "Внимательно следя за Советским Союзом, мы заверяем их в нашей преданности."
 SYR_trainploofficers: "Обучение офицеров ООП"
 SYR_trainploofficers_desc: "ООП хорошо зарекомендовала себя в боях. Это можно закрепить, обучая их офицеров."
 SYR_sovietmilitaryoverhaul: "советская помщь в реконструкции вооруженных сил"
 SYR_sovietmilitaryoverhaul_desc: "Нам стало известно, что мы нуждаемся в дальнейшей советской поддержке в реформировании наших вооруженных сил."
 SYR_sovietdivisions: "Советские дивизии"
 SYR_sovietdivisions_desc: "Реорганизация наших вооруженных сил по советскому образцу даст нам силы, необходимые для современной войны."
 SYR_sovietdoctrines: "Советские доктрины"
 SYR_sovietdoctrines_desc: "Внедряя советские военные доктрины, мы можем улучшить наши тактические возможности."
 SYR_newsyrianarmy: "Новая сирийская армия"
 SYR_newsyrianarmy_desc: "Наша армия готова. Мы - Сирийская арабская армия."
