l_russian:
 #1960s 
 nga60.1.d: "Волнения в Палате собрания, так как глава группы действий йоруба Обафеми Аволово был обвинен в попытке свергнуть правительство. Несмотря на любые веские доказательства этого, северяне считают, что премьер-министр Абубакар Тафава Балева вместо этого должен назначить союзника Ахмеда Белло Самуэля Акинтолу губернатором западного региона. Этот вопрос имеет первостепенное значение для Нигерии в настоящее время, поскольку беспорядки, бандитизм и все акты насилия имеют место на западе, пока Обафеми Аволово отказывается сотрудничать с центральным правительством."
 nga60.4.d: "36 Африканские страны бойкотируют чемпионат мира по футболу 1966 года, поскольку ФИФА настаивает на включении в него Южной Африки с апартеидом. Ранее Южная Африка была исключена из Конфедерации африканского футбола, и в ответ ФИФА постоянно штрафовала CAF на несколько тысяч швейцарских франков в год. В ответ президент Конфедерации африканского футбола Йиднекатчев Тессема заявил: «ФИФА заняла безжалостную позицию в отношении африканских ассоциаций, и ее решения напоминают методы запугивания и репрессий, призванные воспрепятствовать любым дальнейшим импульсам подобного характера. По нашему мнению, Африканские национальные ассоциации... заслужили скорее жест уважения, чем штраф»."
 nga60.5.d: "Лидер АНК Нельсон Мандела сегодня предстанет перед судом вместе со своими товарищами по защите от смертной казни. Обвинение утверждает, что Нельсон Мандела и АНК пытались свергнуть правительство, хотя, признавая акты саботажа, защита отрицает это. В героической и трогательной трехчасовой речи Нельсон Мандела заявляет: «Я готов умереть», поскольку он выносит дело своей партии на передний план средств массовой информации по всему миру. Международное возмущение распространяется по всему миру, когда студенческие группы в Лондоне и комитет ООН по правам человека призывают освободить Нельсона Манделу. В конце концов судья Де Вет признал Нельсона Манделу и его коллегу виновными по всем четырем пунктам обвинения, но отказался от смертной казни, вместо этого приговорив его к пожизненному заключению."
 nga60.6.d: "Социалистическая рабочая и фермерская партия Нигерии, марксистско-ленинская партия, недавно была основана профсоюзным деятелем Тунджи Отегбеем. Получив образование в Лондоне в качестве видного оратора в Студенческом союзе, Тунджи Отегбей сделал себя значимым в городских центрах Нигерии после того, как возглавил протесты после смерти Патриса Ламумбы. Непосредственно присоединяясь к Москве, он хочет создать в Западной Африке полностью ортодоксальное марксистско-ленинское государство, которое участвовало бы в советских исследовательских группах и СЭВ."
 nga60.7.d: "Этим утром группа из пяти майоров и других младших офицеров во главе с Чукумой Кадуной Нзеогву штурмовала столичное здание и убила основных деятелей правительства, не принадлежащих к игбо, включая премьер-министра Абубакара Тафаву Балеву, губернатора северного региона Ахмаду Белло и губернатора Самуэля Акинтолу. После смерти многих высокопоставленных офицеров заговорщики сделали публичное заявление о том, что переворот был результатом явного и широко распространенного мошенничества на выборах со стороны северных политиков страны. Подозрительно важные политики игбо, такие как президент Ннамди Азикиве, отсутствовали или не пострадали от переворота."
 nga60.8.d: "В попытке подавить северные беспорядки и теории заговора о том, что переворот пяти майоров был внутренним заговором военного истеблишмента игбо, Джонсон Агуйи-Иронси решил освободить северных военных заключенных, арестованных во время предыдущего переворота. Однако многие советники генерала говорят ему, что это наверняка позволит им совершить контрпереворот. Вопрос еще не решен..."
 nga60.9.d: "Слухи о перевороте пяти майоров, являющемся внутренним заговором с целью оправдать приход к власти Джонсона Агийи-Иронси и других игбо, теперь поддерживаются как символы веры северянами в вооруженных силах и по всей стране. В ответ несколько северных офицеров во главе с Мурталой Мухаммадом и Олусегуном Обасанджо предпринимают попытку контрпереворота против Агийи-Иронси."
 nga60.11.d: "Будучи независимой всего пять лет, сегодня заканчивается зарождение нигерийской республики. С момента своих первых всеобщих выборов в 1961 году южная этническая группа игбо чувствовала, что правительство их страны чрезмерно северно-направленое, и в ответ группа майоров и офицеров низшего звена происхождения игбо совершила насильственный переворот, который привел к смерти ведущего истеблишмента западноафриканской республики. Пока мир все еще ждет новостей от этих узурпаторов, люди по всему миру могут только сидеть и гадать, что будет с одной из самых молодых наций в мире..."
 nga60.12.d: "Несмотря на то, что первоначальный переворот пяти крупных политиков в Нигерии был подавлен уважаемым генералом Джонсоном Агийи-Иронси, он, как ни странно, тоже был потомком игбо. Быстро распространились теории заговора о том, что этот первоначальный заговор был фальшивым флагом с целью оправдать законный приход игбо к власти в правительстве. Северяне придерживались бы этой идеи, как если бы это была евангельская истина, пока новая группа более опытных офицеров из северных провинций не совершила успешный контрпереворот против Джонсона Агийи-Иронси и его товарищей. На фоне этого кризиса по всей северной части страны вспыхивают массовые погромы этнических игбо, что приводит к массовому бегству беженцев, возвращающихся в родной юго-восточный регион."
 nga60.13.d: "Социалистическая рабочая и фермерская партия Нигерии Тунджи Отегбейе, хотя и была основана всего несколько лет назад, сумела внедриться в значительную группу молодых офицеров с университетским образованием, которые были частью его студенческих движений и протестов. При правильном уровне удачи и точного планирования, а также благодаря советским связям был совершен точный переворот, связанный с убийством Джонсона Агийи-Иронси. Хотя фактически были захвачены только правительственные здания в Кадуне и Лагосе, отсутствие какого-либо нынешнего руководства хунты позволило Освободительной армии Нигерии установить контроль над нацией. Утверждая, что партия положит конец этническому конфликту в Нигерии, создав марксистско-ленинское государство, многие нигерийцы сочувствуют этому делу, особенно в кругах профсоюзов."
 nga60.14.d: "Приближаются всеобщие выборы в Нигерии, и две основные партии выходят на первый план по популярности. Первая — хорошо зарекомендовавшая себя большая партия, состоящая из панафриканистов, социал-демократов и некоторых более умеренных социал-либералов, Национальный совет Нигерии и Камеруна во главе с Ннамди Азикиве. Во-вторых, у нас есть партия аутсайдеров — Кемалистская динамическая партия. Одна из первых партий, у которой есть формальный манифест, возглавляемый ученым-математиком Чике Оби; партия утверждает, что идет по пути вестернизации и модернизации. Их главные внешнеполитические цели — западноафриканская федерация, африканская доктрина Монро и союз с Индией против Южной Африки."
 nga60.15.d: "Помня о правах на нефть Биафры, Франция планирует оказать нам столь необходимую военную поддержку в нашей войне против севера. Несмотря на много критики, что это приведет к тому, что мы потеряем доступ к своим собственным ресурсам, другие говорят, что эта сделка является просто символической и не потребует от нас особых действий."
 nga60.16.d: "Бог Бабалу-Айе или Обалуайе — это божество йоруба оспы и исцеления от болезней. Среди тех, кто поклоняется ему, в целом наблюдается пренебрежение или даже оппозиция западным лекарствам, которые сдерживают здоровье жителей сельских общин. Некоторые практикующие даже предотвратили местные программы вакцинации от оспы, полагая, что это разозлит их бога. В ответ администрация NCNC пытается привезти в регион учителей и протестантских миссионеров, чтобы уменьшить этот культ."
 nga60.17.d: "Наш мудрый президент д-р Ннамди Азикиве объединил различные этнические группы Нигерии для общего дела, стирая разногласия между тремя основными народами страны. Свободно говорящий на йоруба, игбо и хауса, мультикультурный красноречивый лидер смог ответить на недовольство каждой группы, которое, как объяснялось, возникло в результате десятилетий колониальной эксплуатации. Британская схема «разделяй и властвуй» нанесла серьезный ущерб бывшей колонии, поскольку они пытались использовать авторитарный феодальный север для обеспечения господства над неиерархическим югом. Однако в последние несколько лет йоруба, хауса и игбо начинают больше идентифицировать себя не как свой этнический термин, а просто как нигерийцы. Возможно, панафриканизм действительно достигнут..."
 nga60.18.d: "Благодаря взаимному интересу и некоторой хитрой дипломатии Чике Оби вместе с его единомышленниками в Гане, Верхней Вольте, Того и Нигере объединились, чтобы сделать, возможно, самый большой шаг, который когда-либо был сделан в панафриканизме. Декларация западноафриканской федерации теперь является официальной, а полная интеграция состоится в ближайшие недели. Однако это не совсем шок для наших государственных систем из-за обширного планирования, которое имело место в предыдущие месяцы, что смягчит долгий путь, который нам предстоит пройти для создания полностью функционирующего федеративного государства. Однако есть более сложные разговоры о наших внутренних планах по объединению других западноафриканских стран в нашу федерацию."
 nga60.19.d: "С официальным учреждением Западноафриканской федерации пришло время решить, какой должна быть столица новой нации, поскольку многие считают Лагос слишком ориентированным на Нигерию."
 nga60.20.d: "Победа панафриканизма предстает перед всем миром, поскольку продолжительные политические переговоры нигерийского африканского кемалиста Чике Оби с Кваме Нкрумой и другими наконец привели к интеграции нескольких западноафриканских государств в новую свободную федерацию. План, впервые предложенный Оби в политическом манифесте его Динамичной партии, проделал долгий путь к этой точке, что видно во многих компромиссах, на которые ему пришлось пойти в управлении и автономиями новой страны. Однако критики и скептики за пределами Африки спрашивают только о двух вещах; является ли она устойчивой и будет ли эта модель распространяться на другие страны?"
 nga60.21.d: "В качестве одного из основных элементов партийного манифеста Чике Оби наша страна дипломатическим путем установила то, что он называет «Западноафриканской доктриной Монро», которая представляет собой международное заявление о том, что нападение на любое независимое африканское государство является нападением на Западноафриканскую Федерацию."
 nga60.22.d: "Вдохновленная американской доктриной Монро, Западноафриканская федерация объявила, что любая новая попытка колониализма или нарушения суверенитета Африки будет рассматриваться как акт войны против Федерации. Имея в виду напряженные отношения с Южной Африкой и Португалией, иностранные наблюдатели нервно следят за тем, где восходящая африканская держава будет утверждать свое влияние."
 nga60.23.d: "В результате поддержанного Москвой переворота к власти в Нигерии пришла Социалистическая рабочая и фермерская партия Нигерии Тунджи Отегбейе. Признанный частью традиционных «Старых левых», Отегбей зарекомендовал себя задолго до основания своей партии, будучи очень успешным организатором профсоюзов и студенческих протестов, и теперь он берет на себя управление переходным правительством. В течение следующих нескольких лет в стране будет введено военное положение из-за нигерийской освободительной армии (недавно сформированных ополченцев в стиле красной гвардии), поскольку власть утверждается по всей стране. Как только национальная безопасность будет достигнута, у Отегбея будет многоточечный план, в котором он утверждает, что благодаря диалектическому пониманию мира нигерийцы больше не будут испытывать проблемы этнических распрей, которые преследуют нацию еще с колониальных дней."
 nga60.24.d: "Сегодня Джонсон Агийи-Иронси объявил о начале оправданного освобождения Амбазонии. Граница между Нигерией и Камеруном изначально была частью единого британского Камерунского мандата с конца Первой мировой войны, когда север отходил к Нигерии, а юг - к Камеруну. Во время планов по независимости англоязычный регион пытался присоединиться к Нигерии или, возможно, стать независимым в составе Республики Амбазония, однако после референдума в 1961 году эта цель исчезла, и вместо этого ООН создала автономное государство во французском Камеруне."
 nga60.25.d: "После успешной кампании против Мали мы смогли восстановить контроль над нацией под руководством Модибо Кейты. С новым присоединением к нашей сфере влияния наши дипломаты должны будут вести переговоры о вступлении в Западноафриканскую Федерацию."
 nga60.26.d: "С момента переворота 1968 года против панафриканиста Модибо Кейты наша внешняя политика в отношении Мали была враждебной. Однако с соглашениями, заключенными с предыдущим лидером о восстановлении его режима, Западноафриканская федерация готова вести обычную войну против Мали, пытаясь приблизить нацию к нашей панафриканской цели. Официально сегодня Чике Оби объявил об официальном объявлении войны, что вызвало неоднозначную реакцию во всем мире, поскольку Франция заявила, что поддержит нынешний малийский режим."
 nga60.28.d: "В ответ на растущую напряженность между К. Одумегву Оджукву и [NGA.GetLeader], [GHA.GetLeader] проводит собрание под международным наблюдением, чтобы прийти к соглашению по поводу напряженности в юго-восточном регионе. Желая избежать кризиса, связанного с правопреемством богатого нефтью региона Биафра, [NGA.GetLeader] выслушивает каждую просьбу К. Одумегву Оджукву, который открыто и положительно ответил на переговоры, проведенные в дружеской и профессиональной обстановке. К. Одумегву Оджукву добивается превращения Нигерии в свободную конфедерацию с большим количеством региональной автономии, в то время как [NGA.GetLeader] просто хочет, чтобы глава государства одновременно был главой вооруженных сил, что является его целью. В конце концов, однако, кажется, что каждое предложение, сделанное Оджукву, будет принято единогласно, и военная сила не будет применяться в Нигерии ни при каких обстоятельствах."
 nga60.29.d: "Независимо от прежних концепций, соглашения Абурийского соглашения полностью развалились. Как только встречи в Абури закончились, [NGA.GetLeader] сразу же отступил, и штаты игбо были разделены таким образом, что губернаторство Оджукву больше не могло контролировать права на нефть на юго-востоке, поскольку центр извлечения будет перемещен в штаты с большинством населения, не принадлежащие к игбо. В связи с растущими погромами против игбо и явным пренебрежением со стороны национального правительства Оджукву призвал всех игбо вернуться на историческую родину на юго-востоке. Это не сделало их преемственность ясной уверенностью, что стало причиной авиакатастрофы в Энугу, в ходе которой оружие из национальных запасов было тайно доставлено в регион. Несомненно, со дня на день, Юго-Восток может провозгласить свою независимость..."
 nga60.30.d: "Несмотря на попытку переговоров в Абури, Гана, между региональным губернатором Биафры К. Одумегву Оджукву и [NGA.GetLeader], все соглашения были расторгнуты после того, как недовольный Оджукву не чувствовал другого выбора, кроме преемственности. После нигерийского переворота пяти майоров северяне возглавили погромы против этнических игбо, происходящих из юго-восточного региона. Биафра, будучи богатым нефтью и густонаселенным регионом Нигерии, считает, что ее люди не получают никаких преимуществ от того, чтобы быть частью национального правительства Нигерии, и теперь президент К. Одумегву Оджукву считает, что нация может поддерживать себя самостоятельно. Отвечая на вопрос об опасениях перед попыткой нигерийских вооруженных сил восстановить контроль над регионом, Оджукву заверил, что отсутствие какой-либо организованной командной структуры и боевого опыта молодых военных страны станет его смертью."
 nga60.31.d: "Учитывая ситуацию, [NGA.GetLeader] явно предпринял все политически осуществимые действия, которые он мог, для выполнения соглашений Абури, но, в конце концов, неразумный характер К. Одумегву Оджукву привел к ужасному кризису. Однако в наших интересах нехватка оборудования и средств сепаратистского государства Биафры, и многие в нашем военном штабе считают, что война закончится через несколько недель. Тем не менее, мы все равно должны быть осторожны, несмотря на слабость нашего врага, поскольку у нас все еще нет хорошо организованной армии, и нам потребуется некоторое время, чтобы составить надежный военный план. Пришло время обеспечить внутреннюю безопасность и вернуть себе контроль над юго-востоком нашей страны!"
 nga60.32.d: "Добровольческая армия Дельты только что провозгласила независимую Республику Дельты Нигера под руководством молодого майора армии, офицера полиции, учителя, студента университета и политического активиста Исаака Адака Боро. Боро из этнической группы иджау считает, что штат Дельта, являющийся одним из основных источников нефти для Нигерии, получает прибыль только от игбо, хауса и йорубанов. Объявляя революцию, он заявил: «Сегодня великий день не только в вашей жизни, но и в истории дельты Нигера. Возможно, это будет величайший день за очень долгое время. Это не потому, что мы собираемся рушить небеса над своей головой , а потому, что мы собираемся продемонстрировать миру, и как мы относимся к угнетению. Вспомните свою 70-летнюю бабушку, которая все еще занимается сельским хозяйством, прежде чем она ест;помните также ваш бедный народ;помните также вашу украденную нефть, которую ежедневно выкачивают из ваших вен, а затем сражайтесь за свою свободу»."
 nga60.33.d: "С тех пор, как Джонсон Агийи-Иронси подавил переворот пяти крупных держав, среди северян было распространено мнение, что недавние события в Нигерии были взяты под контроль заговором игбо, желающих монополизировать власть в стране. Еще до неудавшегося Северного контрпереворота были планы на успех севера. Имея это в виду, многие из доминирующего на севере генерального штаба упоминали о преимуществах независимой мусульманской хаузаландии, в которую больше не будут вмешиваться игбо. Хотя это, вероятно, привело бы к полномасштабной гражданской войне, мы не можем полагаться на то, что эти деятели в вооруженных силах не додумались бы дойти до такого предела при такой высокой напряженности."
 nga60.34.d: "Как некоторые предвидели, большая часть нигерийского генерального штаба вернулась на родину на север, где они организовали военное восстание под командованием генерала Муртала Мохаммеда. Однако многие северяне предпочли остаться в нашей стране, будь то по религиозным или политическим причинам, и мы можем рассчитывать на то, что сохраним свой значительный военный персонал. Скорее всего, что станет с армией Хаусаленда, так это то, что она будет играть оборонительную роль, пытаясь вытянуть наши ресурсы в пустынях и горах этого региона страны. Однако, если мы сможем сосредоточиться на долгосрочных эмбарго, бомбардировках и артиллерийских ударах, мы обязательно покорим предателей."
 nga60.35.d: "Этнический конфликт в Нигерии перерос в трагический кризис. Хайле Селассие в своем постоянном стремлении быть активным участником позитивной африканской внешней политики считает, что может договориться об окончании этого кризиса, найдя взаимовыгодное соглашение между сепаратистами Биафры и ведущим правительством нигерийских северян."
 nga60.36.d: "Тяжелый характер нашей ситуации с преемственностью Биафры явно не остался незамеченным мировыми лидерами. Император Эфиопии Хайле Селассие пытается провести мирные переговоры в своей нейтральной стране между К. Одумегву Оджукву и [NGA.GetLeader], в соответствии с его репутацией межафриканского организатора справедливости и сердечной дипломатии. Однако ясно, что переговоры никуда не ведут, поскольку, похоже, Оджукву не собирается соглашаться ни на что, кроме полной автономии и независимости Биафры от Нигерии. Проходят недели, а война обходится дорого, и мы должны использовать ядерный вариант: полную блокаду. Наверняка биафранцы не будут сидеть и морить себя голодом, когда возможно подчинение."
 nga60.37.d: "Несмотря на то, что мы пытались заключить мир с Нигерией на недавних встречах в Эфиопии, они решили сделать все возможное со своими жестокими вариантами, поскольку они не могут победить нас в военном отношении. Блокируя наши порты и препятствуя ввозу любого оружия, припасов или продовольствия, они считают, что могут положить конец нашей храброй республике. Если мы в ближайшее время не переломим ход войны или не вмешается международное сообщество, мы можем стать свидетелями невообразимых страданий."
 nga60.38.d: "Не в силах добиться больших боевых успехов, нигерийская федеральная армия решила начать полную блокаду Биафранской сепаратистской республики. Миллионам телезрителей всего мира показывают трагические, ужасные и травмирующие фотографии и фильмы о тысячах детей и младенцев, умерших от голода в юго-восточном регионе Нигерии. Это событие привело к созданию десятков новых неправительственных организаций по всему миру, организованных для предотвращения голода, и одним из первых действий этих групп была попытка создания крупнейшей в мире воздушной перевозки, которая должна стать более обширной и масштабной, чем даже предыдущая Берлинская воздушная перевозка. Несмотря на международное возмущение, Организация Объединенных Наций и основные страны мира отказались дипломатически вмешиваться в конфликт, а руководство Федеральной армии Нигерии заявило, что «голод является законным оружием войны, и мы намерены его использовать»."
 nga60.39.d: "Федеральная армия Нигерии с самого начала войны исходила из предположения, что Энугу, столица Биафры, являющаяся сердцем сепаратистских настроений, положит конец войне, когда будет взята. Однако это предвзятое мнение могло быть наивным, поскольку после взятия города сопротивление продолжалось внутри него и вокруг линии фронта с Биафрой. В момент разочарования из-за того, что дальнейшее продвижение войны в городе было остановлено, генерал Муртала Мохаммед возглавил своих людей в организованной резне в которой погибло более 700 мирных жителей, пытаясь снизить боевой дух врага. Было предпринято мало попыток скрыть это, поскольку генерал надеется, что новости об этом событии посеют страх по всей стране, но другие в нашем правительстве считают, что это может повредить нашему международному имиджу."
 nga60.40.d: "Первоначально, когда Муртала Мохаммед, Бабафеми Огундипе, Роберт Адебайо и другие создавали Высший военный совет, они предполагали, что их хунта возглавит северный регион в наследство от нигерийского государства, но когда различные правительственные чиновники и иностранные дипломаты из США и Великобритании (с их правами на нефть в заливе Биафра) убедили их в обратном, заговорщикам пришлось изменить темп своих планов. Из-за крайней межэтнической напряженности в Нигерии лидеры хунты решили найти кандидата, который был бы наименее противоречивым, для них это был бы Якубу Говон. Учитывая отсутствие какого-либо участия полковника в политике, а также то, что он не является хауса, фулани или даже мусульманином, но все же северянином, делает его удобным выбором для избрания главой государства."
 nga60.41.d: "Якубу Говон понял, что мы оказались в ситуации, когда Нигерия должна стать единым федеральным государством, но все равно будет необходимость сдерживать влияние западных и восточных губернаторов. Чтобы предотвратить повторение ситуации, подобной западному кризису или войне в Биафре, мы будем делить южные и западные регионы на подразделения, которые оставят ресурсы и населенные пункты в подразделениях, которые не являются большинством людей игбо или йоруба, поскольку этнические меньшинства не совсем склонны к сотрудничеству и поддержке федерального правительства."
 nga60.42.d: "Когда капитуляция Республики Биафран была принята, Якубу Говон решил выступить с речью на главной повстанческой радиостанции республики, Радио Биафра. В сети он выступил с речью, для которой характерно повторяющееся заявление «Нет победителей, нет побежденных», где он пообещал политику «примирения, реконструкции и реабилитации», в которой он амнистирует почти всех, кто сражался на войне. дать по 20 долларов каждому гражданину Биафры, у которого был банковский счет в Нигерии, и начать программу ремонта и развития в регионе. Несмотря на эти обещания, средний гражданин юго-востока не может быть менее восторженным или оптимистичным, поскольку заявления кажутся фантастическими для обычной жертвы войны."
 nga60.43.d: "С потерей двух крупных городов Республики Биафра президент К. Одумегву Оджукву бежал на самолете на Кот-д'Ивуар, а Филипу Эффионгу оставалось собирать осколки. В следующие часы Эффионг согласился официально передать Республику Биафра Якубу Говону и согласиться на полную аннексию Биафры. Если передать письмо генералу Олусегуну Обасанджо на передовой, боевые действия все равно продолжатся через несколько дней, поскольку новости еще не дошли до ополченцев, сражающихся во внутренних частях страны."
 nga60.44.d: "После того, как основные населенные пункты Хаусаленда были взяты, бои казались все более и более бесполезными для жителей региона. Ранее на этой неделе Муртала Мохаммед бежал через границу в этнический район хауса в Нигере, где он безуспешно пытался собрать там базу. Серьезность этой ситуации привела к попытке государственного переворота Хасана Кацины, а затем, в конечном итоге, к краху организованного правительства. [NGA.GetLeader] ждал, когда прибудет мирное соглашение от Хасана Кацины, соглашающееся на полную аннексию и отказ от престолонаследия, которое было с готовностью принято, хотя боевые действия в сельских районах продолжались в течение нескольких дней."
 nga60.45.d: "В ходе контратаки биафранских коммандос ранее был взят под контроль итальянский нефтяной комплекс, многие рабочие были убиты, а группа европейских рабочих-эмигрантов взята в заложники. Те, в плену которых были 14 итальянцев, 3 западных немца и один ливанец, были первоначально приговорены к смертной казни за помощь нигерийскому вражескому государству посредством строительства инфраструктуры. Однако среди западных стран, которые уже были весьма враждебны по отношению к Биафре, возник массовый протест, теперь Соединенные Штаты и Великобритания выбирают еще более агрессивный подход к Байфре после этого события. Даже Папа Павел VI отправлял прямую почту Оджукву, что в конечном итоге убедило лидера помиловать заключенных."
 nga60.46.d: "После потери столицы Биафры, Энугу, лидер восстания К. Одумегву Оджукву сбежал из плена и попал в плен к дружественной стране Берега Слоновой Кости. Благодаря мирному соглашению, заключенному от заместителя командира, Филиппа Эффионга, был положен конец самому кровавому конфликту в истории Африки. При полностью разрушенной инфраструктуре региона и все еще продолжающемся массовом голоде будет трудно вызвать подлинное чувство примирения среди жертв этой войны. Разговоры о помиловании большинства тех, кто воевал в Биафре, распространяются как пропаганда снисходительности правительства, когда десятки военных преступников, ответственных за блокаду, убивавшую более восьми тысяч человек в день, не хотят даже стоять."
 nga60.47.d: "Когда «Республика Дельты Нигера» была полностью разгромлена, небольшая группа лидеров повстанцев под командованием Исаака Адака Боро, составлявшая Добровольческую армию Дельты, была арестована и заключена в тюрьму за подстрекательство к мятежу. Однако Якубу Говон, желая разрядить этническую напряженность в стране, решил помиловать Боро, после чего немедленно вернулся в командование Федеральной армии Нигерии. Поскольку страна находится на грани гражданской войны, возможно, он сможет помочь нам на передовой, завербовав добровольцев из штата Дельта и поддерживая их боевой дух."
 nga60.48.d: "Элитное подразделение морских коммандос Исаака Адаки Боро, «Морские школьники», сыграло важную роль в гражданской войне в Нигерии, поскольку их знание речных систем, понимание различных местных языков и их профессиональные навыки выживания, позволяющие им жить за счет земли, сделали наши операции невероятно успешными. Однако неожиданно их лидер Боро был убит, оставив дивизию в неуправляемом состоянии, бродящую в хаосе и подлежащую роспуску. Есть две версии случившегося. Официальная версия состоит в том, что во время захвата цитадели Биафры мятежник застрелил человвека из дивизии , а затем вспыхнуло случайное насилие. Однако второй отчет был услышан солдатом, поклявшимся богами Иджо, что Боро не был убит повстанцем. Он утверждает, что сектор уже был стабильным и безопасным, и что в неожиданный момент, когда люди отдыхали, спецназ Бенджамина «Черный Скорпион» Адекунле устроил засаду на солдат и тут же убил Боро."
 nga60.49.d: "На этой неделе в ходе приятной церемонии Кристофер Уэлби-Эверард передал руководство нигерийскими вооруженными силами нынешнему генерал-майору Джонсону Агийи-Иронси. На протяжении всей истории колонии и протектората Нигерии существовала серьезная проблема чрезмерно доминирующего британского военного командования, что приводило к тому, что многие офицеры более низкого уровня должны были продвигаться по службе после обретения независимости. Из-за этого многие британские сотрудники оставались на военных должностях в течение нескольких месяцев после обретения независимости, поскольку потребовалось время для их соответствующей замены, поскольку Кристофер Уэлби-Эверард оставался последним британским командующим в Нигерии до этого года, оставив теперь полностью африканизированную армию."
 nga60.50.d: "Студенческая группа во главе с социалистом Тунджи Отегбеем штурмовала палату представителей в знак протеста против англо-нигерийского оборонительного пакта. Отегбей и студенты считают, что оборонный пакт является продолжением британского колониализма и нарушает суверенитет Нигерии, вовлекая нейтральную страну в борьбу за власть в холодной войне НАТО и Варшавского договора. Тунджи Отегбей как марксист-ленинец идет еще дальше, полагая, что, помогая Соединенному Королевству против СССР, пакт способдсвует и подстрекает угнетение рабочих на международном уровне. В ответ Тунджи Отегбей как главный организатор был арестован и заключен в тюрьму вместе с несколькими другими товарищами, однако на следующий день они были освобождены."
 nga60.51.d: "С тех пор, как он был командиром, Джонсон Агийи-Иронси характеризовался своей чванливой палкой с чучелом талисмана крокодила, которого он ласково называет «Чарли». Легенды о его солдатах окружают талисман, многие сторонники традиционных народных религий считают его фетишем или предметом, обладающим мистической и духовной силой. Легенды гласят, что Джонсон Агийи Иронси несколько раз использовал посох, чтобы блокировать пули в Конго, что извлечение его из своей машины во время операции в Хаусаландской войне позволило ему избежать артиллерийского удара, и, что наиболее важно, что он был с ним во время попытки северного контрпереворота. Несмотря на эти утверждения, Джонсон Агийи Иронси не фетишист, а набожный католик и уверяет своих людей, что чванливая палка - это просто посох и ничего более."
 nga60.52.d: "К чести нашего превосходного планирования, когда мы осуществили наш контрпереворот на севере, Джонсон Агийи-Иронси уже был в руках Теофила Данджума, прежде чем он понял, что происходит. После его ареста ситуация начала обостряться, когда его связали. На допросе, когда его союзник Адекунле Фаджуйи и его адъютант Эндрю Нванкво находились в заложниках рядом с ним, его неоднократно спрашивали о его причастности к перевороту пяти майоров. Поскольку Агуйи-Иронси настаивал на том, что он ничего не знал о планировании восстания и что он вмешался только для восстановления стабильности, его похитители стали нетерпеливыми, в результате чего люди Данджумы избили его до потери сознания. В конце концов, мало заинтересованный в суде или осуждении, Данджума сформировал расстрельную команду, которая убила Агуйи-Иронси и Фаджуйи, а Эндрю Нванкво сбежал в кусты."
 nga60.53.d: "Сегодня Тунжи Отегбей официально объявляет об отмене шариатских судов, непризнании кади в качестве законной власти и начале пропагандистской кампании, направленной на отвержение всех форм исламского права. В то время как Нигерия является религиозно разнообразной страной с суннитами, католиками, протестантами и десятками традиционных верований, Тунджи считает, что в первую очередь следует сосредоточиться на уменьшении влияния ислама, поскольку он является основой власти северной феодальной знати. Однако эта инициатива не осталась без сопротивления, поэтому солдаты Освободительной армии Нигерии участвуют в насильственном упразднении шариатских судов и будут контролировать юридическую практику во всех северных регионах."
 nga60.54.d: "Феодализм существует в Нигерии почти тысячелетие, и его влияние на неграмотное венгерское крестьянство неоспоримо. Солдаты Освободительной армии Нигерии с караванами студентов-учителей проходят по протяженным маршрутам вдоль сельской местности северной Нигерии, сталкиваясь с одним поместьем за другим, где крестьяне перераспределяют собственность у своих дворян и учат тому, как они должны работать навстречу революции и не признают власть своих предыдущих помещиков. Однако при некоторых обстоятельствах дворянство убедило свое неграмотное крестьянство в том, что Освободительная армия Нигерии убьет их и разрушит их деревни, что приведет к небольшим ополчениям, сражающимся в коротких стычках. Однако в каждом случае моральный дух крепостных очень низок, и на раннем этапе НОА может договориться о прекращении ситуации, чтобы погибло как можно меньше людей."
 nga60.55.d: "Джонсон Агийи-Иронси планирует строительство нового парламента и президентского дворца (технически в котором он не является ни премьер-министром, ни президентом) в Порт-Харкорте. Агуйи-Иронси считает, что Лагос как столица слишком олицетворяет колониальное наследие Нигерии, поскольку город с его португальским названием всегда был центром британского колониального господства в регионе. Основав столицу в новом строящемся центре города в центре игбо в Порт-Харкорте, Агуйи-Иронси пытается установить видение новой эры для независимой Нигерии."
 nga60.56.d: "На церемонии, вдохновленной провозглашением Мао Народной Республики, Тунжи Отегбей стоял на главной площади Лагоса на трибуне, окруженный вооруженной охраной, перед толпой, заполнившей улицы за сотни метров. Многие люди аплодировали, другие молчали, некоторые выражали чистую радость, в то время как другие хмуро смотрели на своего лидера. В своей речи Тунджи начал с выступления против помещиков, реакционеров и других врагов государства, после чего объявил о начале новой эры не только для Нигерии, но и для всей Африки, поскольку мировая революция однажды будет достигнута объединенными усилиями рабочих и фермеров нации. Но это будет радикально, настаивает он, и потребуется полностью воссоздать всю идентичность нации... "
 nga60.57.d: "Многие города Нигерии носят колониальные названия от британских и других европейских колонизаторов. Лагос, например, по-португальски означает озера, а Порт-Харкорт говорит сам за себя. Таким образом, вопрос, который задают, когда дело доходит до переименования городов Нигерии, заключается в том, должны ли мы изменить их на местные названия или переименовать их в честь социалистов и панафриканистских деятелей?"
 nga60.58.d: "На первом этапе революционного преобразования страны в первую очередь ставится под сомнение план смены столицы. Лагос, являющийся колониальным центром предыдущей колонии и протектората Нигерии, придает ему негативный оттенок как столицы, а его расположение очень неудобно для управления. Выбор для новой столицы должен быть в центре, а не в месте, где одна крупная этническая группа имеет непропорциональное преобладание."
 nga60.59.d: "Хотя по всему миру прошли интенсивные протесты после убийства Патриса Ламумбы, здесь, в Нигерии, ситуация стала особенно напряженной. Большая часть финансового района Лагоса была сожжена в результате крупномасштабных беспорядков, в которых участвовали тысячи студентов со всей страны, возглавляемых не кем иным, как доктором-марксистом Тунжи Отегбеем. В то время как Отегбей постоянно создает проблемы в стране, его значимость означает, что может возникнуть хаос, если против него будут приняты слишком строгие меры, поэтому в ответ федеральная полиция решила арестовать и задержать его и его коллег всего на несколько месяцев."
 nga60.60.d: "Поскольку единственное восстание, запланированное Нзеогву, произошло в Кадуне, лидеру вооруженных сил Джонсону Агуийи-Иронси на раннем этапе стало ясно, что следующим курсом действий Нзеогву должна быть попытка захватить контроль над федеральной столицей Лагосом. Имея это в виду, Агуйи-Иронси смог послать полковника Конрада Нваво, человека, которого Нзеогву очень уважал, чтобы перехватить его и вести переговоры в качестве доверенного лица. Агуйи-Иронси сказал Конраду Нваво заверить Нзеогву, что он не будет наказан, если сдастся, Нзеогву начал верить, что это его лучший вариант, поскольку он понял, насколько тщетной будет атака на теперь хорошо защищенную федеральную столицу. После капитуляции Нзеогву и смерти премьер-министра Абубакара Тафава Балева Агийи-Иронси попытался убедить президента Ннамди Азикиве занять пост главы государства. Однако, когда Азикиве отказался из-за того, что ему как игбо передал руководство страной другой игбо после переворота, дело осталось в руках Агийи-Иронси..."
 nga60.61.d: "После обширного западноафриканского конгресса наше правительство пришло к соглашению с другими нациями собрания. Пора начинать интеграцию."
 nga60.62.d: "Первый вопрос, который нужно задать съезду, — как должно быть устроено наше новое правительство и как оно должно функционировать. Страны, вовлеченные в Западную Африку, происходят из разных колониальных империй, и поэтому у всех были разные способы достижения деколонизации. Идеологические разногласия между Нкрумой и Оби еще предстоит обсудить, поскольку это, вероятно, затормозит весь конгресс, вместо этого сегодня основное внимание уделяется простым структурным решениям законодательной власти правительства. Как он будет структурирован?"
 nga60.63.d: "Сегодняшний конгресс превратился в кричащий матч между Кваме Нкрумой и его союзником Ахмедом Секу Туре против Чике Оби. В то время как большинство политических вопросов были отмечены между ними и просто отошли на второй план, одна сильно оспариваемая позиция между ними - это распределение государственного бюджета. С огромными ресурсами и населением новой нации Кваме Нкрума и Ахмед Секу Туре хотят сосредоточить экономику страны на государственной инфраструктуре, социальном развитии и образовании, в то время как Чике Оби верит в это, он хочет сосредоточить большую часть бюджета на наращивание военной мощи, чтобы иметь грозную армию, способную защитить всю Африку от империализма. Утверждая, что новая страна сможет иметь собственные военные технологии наравне с европейскими странами, он считает, что для этого потребуется огромное количество студентов-инженеров и ученых, уполномоченных государством проводить военные исследования. Ни один из них не сдвинулся с места по вопросу, что нам делать?"
 nga60.64.d: "Еще со времен, предшествовавших Маркусу Гарви, африканцы видели свою общую борьбу за угнетение со стороны иностранного империализма и желали единства и силы благодаря великой изобретательности и храбрости африканского народа. Когда в 1963 году Союз африканских государств Нкрумы и Туре потерпел крах, казалось, что идея единой африканской федерации в Западной Африке никогда не воплотится в жизнь. Это изменилось с приходом к власти в Нигерии динамичной партии, поскольку Чике Оби готов создать федерацию с лидерами-единомышленниками в регионе в качестве основного направления своей администрации. В течение следующих нескольких дней начнется конгресс, на котором различные представители западноафриканских стран соберутся вместе для достижения одной цели."
 nga60.65.d: "Вдохновленный тем же решением, которое принял Кемаль Ататюрк, Чике Оби официально запретил любое публичное ношение хиджаба или других подобных исламских головных уборов. Связывая господство исламской феодальной элиты в Нигерии с фундаменталистами в бывшей Османской империи, Чике Оби выступил с телеобращением к нации, в котором ясно дал понять, что такие обычаи являются устаревшими пережитками прошлого, от которых должна избавиться любая модернизирующаяся нация. Хотя это будет трудно обеспечить, а все еще существующее влияние исламской культуры в Нигерии вызовет негативную реакцию на это решение, Оби не приемлет никакой критики за это решение."
 nga60.66.d: "Племенные знаки йоруба насчитывают не менее тысячи лет и всегда были важным фактором в иерархии обществ йоруба, поскольку они означают принадлежность к клану, а те, у кого их нет в их обществе, подвергаются полному остракизму и неспособны к какому-либо значимому взаимодействию с другими. Выполненные в молодом возрасте острыми обжигающими инструментами, рубцы обычно составляют серию из 4-15 следов на лице у мужчин и несколько десятков на груди или ягодицах у женщин. Часто такая практика может привести к инфекции или, в некоторых случаях, к непреднамеренным уродствам. В плане полной модернизации и вестернизации страны Чике Оби хочет не только полностью отменить эту практику, но и древние социальные конструкции, которые делают эту практику необходимой."
 nga60.67.d: "Калечащие операции на женских половых органах — это тысячелетняя практика, которая выходит за рамки религии и этнической принадлежности по всей Западной Африке. В Нигерии, к удивлению некоторых, наибольшая склонность к этой практике проявляется в христианских и традиционных верованиях, следующих на юг. Там почти половина девочек и женщин подвергается женскому обрезанию - практике, целью которой является удаление половых губ у женщин в молодом возрасте, чтобы предотвратить любое удовольствие от секса по духовным причинам. Практика может привести ко многим проблемам со здоровьем и даже в более позднем возрасте может привести к фатальным проблемам при родах. Чике Оби неоднократно выступал против этой практики и создаст общенациональную информационную кампанию, чтобы уменьшить эту практику, а также ввести юридические наказания до пяти лет тюремного заключения для тех, кто практикует это действие."
 nga60.68.d: "В новом законопроекте, продвигаемом через парламент Ннамди Азикиве, который укрепит и защитит права рабочих на организацию, большое внимание уделяется главному профсоюзному организатору Тунджи Отегбейе. Отегбей требует дополнительных дополнений к законопроекту, которые предотвратят срыв забастовки и увольнение бастующих рабочих. Этот дополнительный шаг может сделать законопроект слишком противоречивым и его не удастся принять. Что нам делать?"
 nga60.69.d: "На всех текстильных фабриках Лагоса проходят крупномасштабные забастовки, организованные Тунжи Отегбей. Масштабы и интенсивность предотвратили любое вмешательство властей, и пока мы не изменим законопроект, нам придется давать пустые обещания и ждать, когда это пройдет."
 nga60.70.d: "Когда милитаризм внедряется в политику, его всегда почти невозможно устранить. История многих ранних демократий закончилась таким образом одним-единственным переворотом или ударом. После такого события военные всегда будут чувствовать, что у них есть возможность взять под контроль правительство, если они считают, что это не в их интересах, это такая традиция, которую нельзя отменить. По крайней мере, это норма, и мы должны верить, но, возможно, Zik и NCNC могут создать для нас другое будущее. Со стабильностью страны благодаря реформам Зика мы можем достичь уровня, когда такое событие, как более поздний переворот, будет рассматриваться как моральная и социальная невозможность. У нас будет устойчивая и постоянная демократия, и ничто нас не остановит!"
 nga60.71.d: "Основным убеждением Ннамди Азикиве как панафриканца является сильное желание отменить этнический фаворитизм, религиозный фаворитизм и традиционные племенные и феодальные структуры, которые увековечивают эти практики. Через осуществление безжалостно регулируемой системы государственной службы и бюрократии с суровыми наказаниями за кумовство, взяточничество и, прежде всего, дискриминацию по этническому или религиозному признаку возникает ощущение подлинного восхождения за пределы племенной политики, которая управляла Нигерией с момента создания колонии и северного господства, созданного англичанами. Когда нигерийский национализм Зика действительно обретет форму, мы увидим страну нигерийцев, а не хаусанов, йоруба или игбо."
 nga60.72.d: "Благодаря массовым усилиям десятков тысяч студентов начали проводиться крупномасштабные кампании по ликвидации неграмотности с организованными группами, закрепленными за конкретными районами, а затем распространяющимися на отдаленные сельские деревни и города. Эта программа, вдохновленная аналогичной инициативой, предпринятой Кубой пару лет назад, призвана снизить уровень неграмотности менее чем на 10 процентов в течение следующих 5 лет. Секретарь Тунджи Одегбей также дал понять, что программа также научит жителей сельской местности тому, как они должны внести свой вклад в прогресс революции и научиться игнорировать свои старые суеверия и иерархические убеждения."
 nga60.73.d: "Учитывая поддержанный ЦРУ переворот, в результате которого Нкрума был свергнут, мы не смогли бы провести Конгресс Западной Африки без него. Эту ужасную несправедливость можно исправить, Нкрума жив и здоров в Гвинее, в настоящее время исполняющий обязанности сопрезидента. Мы можем показать Западу, что если страны третьего мира будут работать вместе, нас нельзя будет помыкать и запугивать, чтобы заставить подчиниться. Пора вернуть отца панафриканизма на место, которое ему принадлежит!"
 nga60.74.d: "После тактического вторжения в Гану и обеспечения безопасности столицы мы можем восстановить Кваме Нкруму и продолжить наш путь к объединению африканского народа. Будем надеяться, что любая принесенная смерть будет вознаграждена процветанием в будущем, наполненном возможностями и свободном от страданий, вызванных иностранной эксплуатацией и региональной коррупцией."
 nga60.75.d: "На прошлой неделе драматург и автор-выскочка Воле Шойинка представил широкой городской аудитории свою новую пьесу «Танец лесов». Пьеса фокусируется на ошибках доколониального государства Нигерии и предсказывает постколониальную Нигерию, которая будет работать коррумпированным и бесцельным образом. Хотя, по сути, пьеса предназначена для того, чтобы предостеречь от ошибок прошлого и не повторять их, среди высшего класса и политического истеблишмента спектакль подвергается резкой критике, в то время как для других он быстро стал влиятельным. Карьера Воле Сойинки идет вверх и вверх, и он надеется вдохновить новую уникальную Нигерию, культура которой может превзойти европейский империализм."
 nga60.76.d: "Вчера после того, как нигерийский авиалайнер 825 совершал перелет из Кано в Лагос рейсом из Лондона, произошла катастрофа, когда самолет врезался в густой лес, окружающий международный аэропорт Лагоса. Едва не долетев до места, шасси самолета зацепилось за крону близлежащих тропических деревьев, в результате чего он потерял управление и взорвался огромным огненным шаром, в результате чего погибли все 76 пассажиров и 11 членов экипажа. Хотя расследование того, как могла быть совершена эта ошибка, все еще продолжается, есть предположения о грязной игре, поскольку в обломках было обнаружено несколько единиц огнестрельного оружия. Тем не менее, местные чиновники сказали общественности не делать поспешных выводов, поскольку с текущими доказательствами мы просто не знаем, что происходило в те последние моменты полета рейса 825."
  #1970s 
 nga70.1.d: "Якубу Говон никогда не был бесспорным лидером Нигерии, те, кто занимал высшие посты, всегда знали, что он был во власти первых заговорщиков хунты. Так что не стало неожиданностью, когда один из главных вдохновителей северного контрпереворота Муртала Мухаммед совершил бескровный путч против Говона, когда тот был с визитом, представляя Нигерию на саммите Организации африканского единства в Кампале. Официально причиной переворота было то, что Говон мало продвинулся в переходе к гражданскому правительству, хотя многие считают, что Якубу Говон был избран главой государства только из-за того, что он был немусульманским кандидатом, не принадлежащим к народности "хауса", во времена этнической напряженности. Теперь, когда Гражданская война закончилась и Нигерия обезопасена, мусульманин-северянин может взять на себя ответственность управления страной."
 nga70.2.d: "Сегодня произошла трагедия, когда в машину Мурталы Мухаммеда, направлявшуюся к его офису, попала серия пуль, от которых он сразу погиб. Произошел неудавшийся контрпереворот с целью восстановления Якубу Говона, который возглавил подполковник Бука Сука Димка. В то время как Димка и его сообщники были быстро найдены и расстреляны, британское правительство отказалось экстрадировать Говона. Поскольку нация оплакивала Мурталу Мухаммеда, его заместителя, Олусегун Обасанджо теперь сменит его на посту главы государства."
  
