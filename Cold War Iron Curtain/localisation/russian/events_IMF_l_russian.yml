l_english:
 IMF_event_desc_1:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ считает, что экологические нормы сдерживают экономическое развитие, и полагает, что для содействия росту необходимы перспективы развития заповедников и смягчение дорогостоящих экологических норм."
 IMF_event_desc_2:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ твердо убежден, что политика страны в отношении прав женщин и женщин на рабочем месте опасно устарела и проблематична для экономического роста. МВФ обещает, что поощрение прав женщин значительно укрепит экономику страны."
 IMF_event_desc_3:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ считает, что наша страна недостаточно экспортирует и может воспользоваться преимуществами мировой экономики, используя выгодные экспортные возможности."
 IMF_event_desc_4:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения заключаются в следующем:0 МВФ завершил 178-страничный анализ денежной массы в нашей стране и считает, что денежная масса в стране нездорово короткая и не поспевает за ростом ВВП. Поэтому они рекомендуют нам немедленно начать насыщать нашу валюту"
 IMF_event_desc_5:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ отрицает недавние сообщения о том, что корпорации ведут неблаговидные деловые практики, и считает, что в ходе расследований были получены ложные доказательства, которые не подтвердятся в суде. Поэтому они рекомендуют прекратить эти расследования, поскольку, по их мнению, они обойдутся гораздо дороже, чем сэкономят, и что принятие мер против этих практик только исказит естественный экономический рост страны."
 IMF_event_desc_7:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения заключаются в следующем:0 МВФ проанализировал государственные капиталовложения и считает, что они неэффективны и что свободный рынок может управлять государственными предприятиями страны лучше, чем правительство. Поэтому в своем последнем отчете МВФ выделил несколько государственных предприятий, которые должны быть приватизированы."
 IMF_event_desc_8:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ читает лекции и обсуждает с руководством нашей страны преимущества свободной торговли и те блага, которые она дает. В первую очередь, они считают, что национальный протекционизм вреден для экономического роста страны и искусственно завышает стоимость импортируемой и экспортируемой продукции, что напрямую тормозит национальную экономику."
 IMF_event_desc_9:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ считает, что профсоюзы в стране подрывают экономический рост и косвенно тех работников, которых они представляют. Поэтому МВФ предложил ослабить гарантированные полномочия профсоюзов для увеличения экономического роста и заверил наш кабинет министров, что работодатели лучше всех знают потребности своих работников."
 IMF_event_desc_10:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ неоднократно жаловался на наши бюрократические процедуры и считает, что бюрократия и правила нашего государства стали непосильными и неэффективными, и просит нас значительно сократить их."
 IMF_event_desc_11:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения заключаются в следующем:0 МВФ завершил анализ расходов на здравоохранение в стране и считает, что текущий уровень расходов не соответствует бюджету страны. В связи с этим МВФ рекомендовал сократить государственные выплаты на здравоохранение и обеспечить медицинское страхование за счет работодателей."
 IMF_event_desc_12:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ считает, что высокие расходы страны на образование недоступны при нынешнем ВВП страны, и полагает, что временные сокращения для вливания денег в экономику будут лучше в долгосрочной перспективе."
 IMF_event_desc_13:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ подготовил объемный отчет о расходах страны на социальное обеспечение и считает, что они тормозят экономический рост и препятствуют прямому сокращению бедности за счет роста рабочих мест. Поэтому они утверждают, что социальные пособия должны быть существенно сокращены."
 IMF_event_desc_14:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ считает, что в стране негостеприимный климат для ведения бизнеса, и разработал план по улучшению возможностей ведения бизнеса в стране."
 IMF_event_desc_15:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 Недавнее исследование правил безопасности в стране, финансируемое МВФ, показало, что многие инициативы в стране не улучшают безопасность, а лишь увеличивают операционные расходы и снижают эффективность. Таким образом, МВФ выделил многие инициативы и правила безопасности, на отмене которых они настаивают."
 IMF_event_desc_16:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему:0 МВФ завершил анализ данных о занятости в нашей стране и пришел к выводу, что рынок труда слишком горяч, искусственно повышает заработную плату и неустойчиво увеличивает потребление сверх естественного уровня. В связи с этим они рекомендуют ослабить ограничения на продолжительность рабочего времени, чтобы уменьшить количество рабочих мест, увеличить количество смен и охладить рынок труда для обеспечения дальнейшего роста."
 IMF_event_desc_17:0 "МВФ завершил свой отчет о рекомендациях, которые наша страна должна принять для увеличения экономического роста и сокращения регионального долга. Их предложения сводятся к следующему: В настоящее время МВФ испытывает серьезные проблемы с отношениями с гражданами и малым, а также крупным бизнесом. Поэтому они обратились к нам за помощью в разрешении этих споров."