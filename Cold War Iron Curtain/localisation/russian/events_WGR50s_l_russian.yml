l_russian:
 WGRElection.1.d:0 "Первые федеральные выборы в Западной Германии - это действительно важное событие. Две доминирующие партии, Христианско-демократический союз во главе с Конрадом Аденауэром и Социал-демократическая партия во главе с Куртом Шумахером, имеют большинство голосов. Партия меньшинства, которая всё ещё может оказывать некоторое влияние - Коммунистическая партия Германии (КПГ), которая по слухам пользуется советской поддержкой. Кто же победит?"
 WGRElection.2.d:0 "Вторые федеральные выборы в Западной Германии - это действительно важное событие. Две доминирующие партии - Христианско-демократический союз во главе с Конрадом Аденауэром и Социал-демократическая партия во главе с Эрихом Олленхауэром и Эгоном Франке - ведут борьбу за власть. Кто же победит?"
 WGRElection.3.d:0 "Третьи федеральные выборы в Западной Германии - это действительно важное событие. Две доминирующие партии - Христианско-демократический союз во главе с Конрадом Аденауэром и Социал-демократическая партия во главе с Эрихом Олленхауэром и Эгоном Франке - ведут борьбу за власть. Кто же победит?"
 WGRElection.4.d:0 "После пятилетнего военного правления, Германия вновь готова к предварительным выборам. После раскола СДПГ двумя конкурирующими партиями стали Христианско-демократический союз во главе с Конрадом Аденауэром и коалиция Немецкой партии и Свободной демократической партии во главе с Генрихом Гельвеге и Францем Блюхером. Кто же победит?"
 Starting.1.d:0 "23 мая 1949 года навсегда останется знаменательным днем в истории Германии! Сегодня работа Парламентского совета воплотилась в реальность: был подписан и обнародован Grundgesetz. Совет, состоящий из членов парламентов западногерманских земель, разработал проект документа и 8 мая одобрил его 53 голосами против 12. Затем он был представлен на рассмотрение земельных парламентов, и в итоге был одобрен всеми, кроме баварского Ландера. Этот документ, включающий формирование федерального правительства Германии и предоставляющий важнейшие права всем её гражданам, знаменует собой основание Федеративной Республики Германия."
 Starting.2.d:0 "(1) ФРГ является демократическим и социальным федеративным государством.\n(2) Вся государственная власть исходит от народа. Она осуществляется народом на выборах и голосованиях, а также посредством отдельных законодательных, исполнительных и судебных органов.\n(3) Законодательная власть ограничивается конституцией, исполнительная власть и отправление правосудия - законодательством и правом.\n\nСтатья 20 является одной из основополагающих статей Основного закона, описывает государственное устройство Федеративной Республики и гарантирует демократию, республиканизм, социальную ответственность и федерализм, являясь более прямой, чем прошлая Веймарская конституция. Кроме того, статья 20 имеет привилегию не быть исключенной из Основного закона, поскольку она гарантирует демократию для всех."
 Starting.3.d:0 "В настоящее время настоящий Основной закон действует на территории земель Баден, Бавария, Бремен, Большой Берлин, Гамбург, Гессен, Нижняя Саксония, Северный Рейн-Вестфалия, Рейнланд-Пфальц, Шлезвиг-Гольштейн, Вюртемберг-Баден и Вюртемберг-Гогенцоллерн. Для других частей Германии она вступит в силу после их присоединения\n\nСтатья 23 посвящена немецким землям, или Ландерам. Ландеры всегда играли большую роль в унитарном управлении Германии, и эта статья предоставляет другим де-юре немецким государствам, не включенным в сферу применения Основного закона, возможность заявить о своем присоединении, или Beitritt, позднее. Это сделано для того, чтобы дать Ландерам справедливую возможность присоединиться к Федеративной Республике, при условии, что они будут признаны федеральным правительством и заявят о своем присоединении путем свободного самоопределения. Это действительно переломный момент для отношений между федеральным правительством и Ландерами в немецкой политике."
 Adenauer49.1.d:0 "В новом составе парламента Бундестага ведутся дебаты о новой столице ФРГ. В настоящее время столица находится в городе Бонн на западе страны, на берегу реки Рейн. Однако члены СДПГ выступают за перенос столицы в город Франкфурт, утверждая, что в нём уже есть необходимые объекты и что это обойдется на 95 миллионов марок дешевле. Однако члены ХДС настаивают на своём, утверждая что Бонн является временной столицей, и столица не должна быть перенесена до тех пор, пока вся Германия не воссоединится. Где должна быть столица?"
 Adenauer49.2.d:0 "Я боюсь, что западные союзники, вместо того чтобы проводить европейскую политику, ввязываются в политику интересов, которая направлена скорее на поддержание авторитарного режима Аденауэра, чем на то, чтобы позволить ему смениться демократическим режимом... То, что нам предстоит обсудить и проголосовать сегодня, является не чем иным, как проверкой того, является ли Основной закон клочком бумаги и может ли большинство продолжать свои попытки грубо по нему ездить..."\n\nЭто вызвало аплодисменты со стороны СДПГ и осуждение и освистывания со стороны ХДС в зале Бундестага. Герр доктор Арндт из СДПГ продолжил выступление.\n\n 'Мы думали, что находимся на пути к парламентской демократии, а оказались на пути к монархии без конституции... Герр канцлер, мы не позволим вам забыть эту клятву!'\n\nКанцлер Аденауэр поднялся, чтобы выступить, отметив, что профсоюзы Германии поддерживают правительство в их искреннем желании подписать Петерсбергское соглашение, даже если оно касается демонтажа промышленности. Это вызвало вопросы со стороны оппозиционной СДПГ, поставившей под сомнение обоснованность данного утверждения. Дебаты продолжались, но решение должно было быть принято быстро."
 Adenauer49.3.d:0 "29 декабря 1948 года три западных союзника, а также страны Бенилюкса издали Рурский статут, представлявший собой особую систему регулирования работ в рурской промышленности. Предусмотренный Статутом Рурский орган, состоящий из представителей шести держав, был учрежден 28 апреля 1949 года, включая положение о представителях Федеративной Республики в качестве членов органа.\n\nЭто вызвало разногласия между правительством и, прежде всего, социал-демократической оппозицией по вопросу, тесно связанному с проблемой демонтажа, а именно: признание Рурского органа путём направления в него представителя Германии. На практике функции этого органа были бы равнозначны контролю над всей немецкой экономикой, поскольку промышленный район Рура имеет огромное значение для всей экономической жизни Германии.\n\nНа заседании кабинета канцлер Аденауэр объяснил, что участие в Статуте будет иметь благоприятные последствия; если мы откажемся, это будет равносильно препятствию, а значит, и дружественные отношения с союзниками.\n\n Однако другой аргумент состоял в том, что внутри страны членство не будет популярным, и поддержка правительства может зашататься, особенно на выборах в ландтаг в Северном Рейне-Вестфалии. По какому пути пойдёт Германия?"
 Adenauer49.4.d:0 "В честь нового десятилетия 1950-х годов канцлер Аденауэр обратился к собравшимся в зале Бундестага, а также к высокопоставленным правительственным чиновникам с новогодней речью. После аплодисментов, в основном со стороны ХДС, он начал:\n\n 'Дамы и господа из Бундестага, министры кабинета министров, иностранные высокопоставленные лица и все присутствующие, мы вступаем в новую эпоху. Менее года назад была основана Федеративная Республика, и по мере того, как мы вступаем в 1950-е годы, Германия будет становиться все больше и больше. Наши отношения с западными державами только улучшаются, в то время как мы стремимся к объединению Германии в единое демократическое государство, а не в государство, контролируемое одной политической партией. Вступая в новую эру технологического развития, Германия будет находиться на переднем крае этих инноваций, поскольку мы консолидируем наше ограниченное промышленное использование в благих целях. Сейчас, когда я стою здесь, демонстрируется свидетельство европейской демократии и мира, и это будет продолжаться вечно!'"
 Adenauer49.5.d:0 "Реакция на предложения союзников о перевооружении Германии в правительстве Федеративной Республики была смешанной. Позиция СДПГ в отношении участия Германии в европейском оборонном сообществе была действительно враждебной, а доктор Шумахер считает предложения ХДС о перевооружении преждевременными и опасается, что американцы сделают предложение, которое не смогут выполнить. Однако ХДС утверждает, что советская угроза достаточно велика, чтобы потребовать быстрого перевооружения Германии, и что если они не пойдут на союз с союзниками, то Федеративная Республика может быть втянута в советский блок и потерять суверенитет."
 Adenauer49.6.d:0 "Сегодняшний день стал знаменательным в истории Федеративной Республики, поскольку сталелитейный завод в городе Зальцгиттер, известный как Зальцгиттерский завод, был демонтирован немецкими рабочими под наблюдением представителей трех союзных держав. Ранее находившиеся в ведении Рейхсверке Германа Геринга, эти заводы способствовали развитию немецкой военной техники, особенно в производстве танков, самолётов и оружия. После захвата союзниками завод долгие годы простоял без дела. Это большая потеря для немецкой промышленности, но она была необходима, чтобы убрать символ нацистской промышленности и господства."
 Adenauer49.7.d:0 "Сегодня правительство Германии с гордостью объявляет об официальном прекращении продовольственного распределения на территории Федеративной Республики. После окончания Второй мировой войны был введен план распределения всех предметов потребления, включая уголь, яйца, мясо, масло и картофель. Союзники помогли дополнить этот план, но мы, наконец, достигли того момента, когда выгодно прекратить его выполнение, поскольку у нас есть достаточное количество продовольствия и других расходных материалов."
 Adenauer49.8.d:0 "Сегодня в Бундестаге разгорелись очередные дебаты, на этот раз о возможном вступлении ФРГ в Совет Европы. ХДС и канцлер Аденауэр рассказали о причинах, по которым Германия должна вступить в Совет, о готовности других европейских правительств включить республику, особенно о готовности французского правительства и министра иностранных дел Роберта Шумана, а также о преимуществах вступления в союз с другими европейскими демократиями.\n\n Ораторы от СДПГ выступили против, спросив, почему ХДС настаивает на этом, и призвав повременить до выяснения настоящих причин. Дебаты продолжаются, но мы должны принять решение в ближайшее время."
 Adenauer49.9.d:0 "Сегодня канцлер Аденауэр сделал публичное заявление по всем радио и телевидению, объявив о новом указе. Вступает в силу недавно принятое федеральным правительством постановление о конституционной лояльности государственных служащих, поэтому члены запрещенных организаций не могут работать в федеральном правительстве. Постановление, согласно которому 'лица, находящиеся на службе федерального правительства, должны всем своим поведением придерживаться демократической концепции государства', направлено против 11 левых и 2 национал-социалистических партий, включая Коммунистическую партию Германии ( КПГ), Свободную Немецкую Молодежь (СНМ), Культурбунд и Союз жертв нацистского режима (СЖНР). Критика за авторитаризм неминуемо последует, но это необходимо для демократии."
 Adenauer49.10.d:0 "Из Федеральной канцелярии пришли печальные новости. Заместитель канцлера Конрада Аденауэра Ганс Глобке оказался замешан в преступлениях нацистов, в том числе в разработке Закона о разрешении 1933 года, который позволил Гитлеру получить диктаторские полномочия, а также нескольких Нюрнбергских расовых законов, направленных против евреев. Глобке никогда не был членом нацистской партии, но был тесно связан с антисемитизмом. После войны Глобке был оправдан от любых правонарушений и выступал в качестве свидетеля на Министерском процессе 1948 года, а в 1949 году был назначен Аденауэром. Канцлер решил не увольнять его из уважения, но готов столкнуться с огромной критикой за прошлое Глобке."
 Adenauer49.11.d:0 "Сегодня на стол канцлера Аденауэра поступил новый доклад. Названный Химмеродским меморандумом в честь места его составления - аббатства Химмерод, он создает условия для появления новых вооруженных сил Германии под названием Бундесвер. Среди основных условий - освобождение всех немецких солдат, осужденных как военные преступники, прекращение клеветы на немецких солдат, а также меры по изменению внутреннего и внешнего общественного мнения о немецких военных. Группа немецких офицеров, составивших этот документ, включая Ганса Шпайделя и Адольфа Хойзингера, надеются, что канцлер примет их меморандум и начнёт переговоры с тремя западными державами, чтобы удовлетворить их требования."
 Adenauer49.12.d:0 "Тюрьма Ландсберг - печально известное исправительное учреждение в Баварии, наиболее известное как тюрьма, где содержался Адольф Гитлер после неудачного Пивного путча и где была написана 'Моя борьба' (Mein Kampf). Во время оккупации американскими войсками она использовалась для содержания военных преступников, а в 1946 году была переименована в тюрьму для военных преступников № 1. За время своего существования в Ландсберге было проведено около 300 казней осужденных военных преступников. Сейчас она по-прежнему используется для содержания военных преступников, но находится под нашей юрисдикцией. С одной стороны, пришло время освободить их - смертная казнь в ФРГ отменена, но, с другой стороны, содержание их в тюрьме станет примером для тех, кто стремится к недемократическим формам правления. Что же нам делать?"
 Adenauer49.13.d:0 "Сегодня самолет канцлера из Германии приземлился в Лондоне, и под громкие фанфары канцлер Аденауэр встретился с премьер-министром Уинстоном Черчиллем - впервые за 20 лет, когда глава немецкого правительства коснулся британской земли. Отметив общие англо-германские цели: сохранение мира и защита демократического порядка, Аденауэр заверил, что Германия проявит себя как надёжный союзник. Отгоняя опасения по поводу немецкой экономической конкуренции и возобновления националистических движений, Аденауэр подчеркнул важность Германии в вопросе Европы и защиты демократии. Это действительно был успех для германских и англо-германских отношений!"  
 Adenauer49.14.d:0 "Три западных союзника и Федеральная канцелярия получили интересные предложения. Судя по всему, советский генсек Иосиф Сталин выдвинул предложения по воссоединению Германии при условии, что мы будем соблюдать нейтралитет и гарантировать 'права человека и основные свободы'. Официальные лица союзников подозревают, что 'записки Сталина' - это просто блеф, с помощью которого Советы хотят свалить на союзников вину за разделенную Германию. Канцлер Аденауэр и ХДС характеризуют записки как агрессивную акцию, которая пытается затормозить реинтеграцию Западной Германии в европейскую политику, и даже СДПГ рассматривает такую возможность. Очевидно, что правительство едино в этом вопросе, но решение должно быть принято, и как можно скорее."
 Adenauer49.15.d:0 "Сегодня германо-европейская интеграция продолжается благодаря подписанию Боннско-Парижских конвенций в Бонне между тремя западными союзниками и ФРГ. Важные условия включают статью 1, которая предоставляет Федеративной Республике полную власть как суверенному государству над своими внутренними и внешними делами, и статью 2, которая предусматривает, что три державы сохраняют свои права в отношении Берлина и всей Германии, включая воссоединение и мирное урегулирование. Это огромный шаг для суверенитета Германии и европейской интеграции, и это только первый шаг на долгом, долгом пути."
 Adenauer53.1.d:0 "Победив на выборах 1953 года, Конрад Аденауэр сохранил за собой пост канцлера Федеративной Республики Германии. Начиная своё второе правление с практически тем же кабинетом, что и раньше, Аденауэр объявил о намерении передать министерство иностранных дел в подчинение одному из министров, дата которого будет объявлена позже. Кроме того, ожидается, что Теодор Хойс, нынешний федеральный президент, останется на своём посту без особой оппозиции. Политические аналитики внутри страны и за рубежом считают, что дальнейшее руководство Аденауэра является выгодным для Западной Германии, и ожидают продолжения экономической и социальной перестройки в стране."
 Adenauer53.2.d:0 "Страны всего мира, особенно три западных союзника, возмущены разговорами об освобождении семерки Шпандау - группы нацистских военных преступников, содержащихся в тюрьме Шпандау в Западном Берлине, включая Альберта Шпеера, Карла Доница и Рудольфа Гесса. После внутренних обсуждений в канцелярии по поводу возможного освобождения из Шпандау Константина фон Нойрата, бывшего министра иностранных дел Германии, и Эриха Редера, бывшего гросс-адмирала Кригсмарине, западные союзники в основном осудили эту акцию, но не приняли никаких конкретных мер против неё ради стабильности страны."
 Adenauer53.3.d:0 "Сегодня в ФРГ отмечают победу сборной Германии по футболу над венгерской 'Золотой командой' или 'Могучими мадьярами' в финале чемпионата мира по футболу 1954 года. На стадионе 'Ванкдорф' в Берне (Швейцария), венгерская команда имела все шансы на победу, но была разгромлена. Считающаяся одним из величайших матчей в истории Кубка мира и известная как 'Бернское чудо', эта победа позволила вновь обрести международное признание и популярность Федеративной Республике на мировой арене, пытавшейся исправить своё общественное восприятие после Второй мировой войны и денацификации."
 Adenauer53.4.d:0 "События произошедшие недавно с высокопоставленными чиновниками немецкого правительства, стали шоком как в стране, так и за рубежом. Отто Джон, президент Федерального ведомства по охране конституции, внутренней разведки Федеративной Республики, исчез в Берлине несколько дней назад после участия в церемонии, посвященной годовщине заговора против Гитлера 20 июля. Три дня спустя Джон появился в коммунистическом Восточном Берлине, отрекаясь от своей бывшей страны и критикуя политику канцлера Аденауэра по интеграции и ремилитаризации Запада.\n\n Правительство Германии выразило возмущение этим инцидентом и требует его ареста и передачи из Восточной Германии под нашу охрану."
 Adenauer53.5.d:0 "Сегодня в Федеральной канцелярии было объявлено о новой внешней политике. Названная в честь гос. секретаря министерства иностранных дел Вальтера Халльштайна, доктрина Халльштайна гласит, что Федеративная Республика не будет устанавливать и поддерживать дипломатические отношения ни с одним государством, признавшим Германскую Демократическую Республику - незаконный коммунистический аналог на нашем востоке. На основании советского признания ГДР в марте 1954 года и наших собственных недавних соглашений с Советами в этом году мы обладаем исключительным правом сделать это заявление, основанное на праве правительства представлять всю Германию. Это, несомненно, определит нашу будущую внешнюю политику, наши перспективы и положение на мировой арене."
 Adenauer53.6.d:0 "Сегодня канцлер Аденауэр вернулся из Москвы, завершив визит в логово льва для западногерманского правительства, и в основном сосредоточившись на возвращении последних немецких военнопленных, спустя десятилетие после окончания Второй мировой войны.\n\nПриземлившись в Москве, Аденауэр увидел себя равным партнером русских, позируя для фотосессии с советским представителем Николаем Булганиным и генеральным секретарем Никитой Хрущевым. Однако переговоры зашли в тупик и грозили сорваться, пока немецкая и советская делегации не посетили спектакль 'Ромео и Джульетта' в Большом театре. \n\nПосле окончания спектакля, когда отцы обнимали друг друга над телами Ромео и Джульетты, Аденауэр и Булганин встали и обнялись, отметив тем самым знаменательный момент визита.\n\nПоследующие обсуждения оказались плодотворными, и были достигнуты соглашения; дипломатические отношения с Советами, освобождение 10 000 военнопленных. Этот успех, известный как 'Возвращение десяти тысяч', навсегда запомнится в Германии и за её пределами."
 Adenauer53.7.d:0 "Это официально! С момента подписания Парижского соглашения 27 февраля 1955 года Федеративная Республика Германия стала членом НАТО, западноевропейского союза взаимной безопасности, основанного тремя западными союзниками и девятью другими странами в 1949 году. После подписания устава войск НАТО и других соглашений, устанавливающих конец оккупационного режима, в Париже состоялась церемония празднования вступления ФРГ, а в следующем году должны начаться боевые учения с участием сил НАТО и бундесвера. Это пополнение альянса гарантированно разозлит Советов и установит линию конфликта на внутригерманской границе, вступив в новую эпоху холодной войны."
 Adenauer53.8.d:0 "Сегодня не было обычного заседания кабинета канцлера. На Ближнем Востоке складывалась непростая обстановка, и канцлер Аденауэр считал, что она требует реагирования.\n\nАденауэр открыл заседание. 'Герр Брентано, что известно министерству иностранных дел?'\n\n 'Господин канцлер, как вы знаете, президент Египта Насер национализировал Суэцкий канал 26 июля. Прошло чуть больше трёх месяцев, и нам сообщили, что эти две страны направили парашютистов для захвата Суэцкого канала.'\n\nЭто вызвало шквал разговоров за столом кабинета.\n\nАденауэр выступил над ними. 'Мы должны принять решение: сохранить ли нашу дружбу с Великобританией и Францией или выступить в поддержку Насера, предложив дипломатическую поддержку.'\n\nБрентано снова заговорил. 'Идти против союзников, особенно французов, сейчас, пожалуй глупо. Мы всё ещё пытаемся укрепить свои позиции на мировой арене. Но, тем не менее, поддержка усилий ООН в настоящее время может рассматриваться как нейтральная позиция; поддержка Насера по умолчанию, без прямого вмешательства.'\n\nАденауэр рассмотрел варианты, затем поставил вопрос на голосование кабинета. Какова будет наша позиция?"
 Adenauer53.9.d:0 "Сегодня в Бундестаге обсуждался важный вопрос, который может изменить границы Федеративной Республики, - вопрос о Сааре.\n\nС 1947 года Саар был отделен от французской оккупационной зоны и пользовался политической автономией, а также экономическим сотрудничеством с Францией, но всё ещё находился под контролем французского верховного комиссара. Правительство Германии под руководством канцлера Аденауэра продолжает прилагать усилия к тому, чтобы покончить с особым статусом Саара и присоединить его к Федеративной Республике в качестве Ландера. Хотя некоторые жители Саара протестуют против того, что они должны быть суверенными, большинство жителей страны считают Саар частью Германии, важным экономическим компонентом и способом вырвать контроль над территорией у Франции. Что же они решат?"
 Adenauer53.10.d:0 "В воздухе ощущалось напряжение, когда старшие офицеры нового немецкого бундесвера вошли в наполненные дымом залы заседания Военного комитета НАТО. Они подошли к столу и сели напротив представителей 14 других членов НАТО.\n\nПредседатель начал. 'Сегодня мы начинаем первый день дискуссий по поводу размещения ядерного оружия НАТО на территории ФРГ. Мы приглашаем наших коллег из Бундесвера поделиться своим мнением'. Вокруг раздались общие аплодисменты и одобрительные кивки, в то время как некоторые члены продолжали прерывисто курить.\n\nСамый старший офицер бундесвера начал говорить. 'Если позволите, я хотел бы поблагодарить членов этого комитета за то, что они разрешили нам выступить сегодня. Однако я считаю, что у бундесвера, да и у правительства Федеративной Республики в целом, есть опасения по поводу размещения ядерного оружия на нашей территории. Мы находимся на передовой, на поле боя...'\n\nАмериканский представитель перебил. 'Именно так! Теперь, когда Федеративная Республика вступила в НАТО, мы должны обратить внимание на размещение большего количества ядерного оружия на немецкой земле, тем самым увеличив радиус действия и облегчив нанесение удара по СССР в случае необходимости.'\n\n Старший офицер бундесвера выглядел заметно рассерженным. 'Видите ли, в этом-то и проблема. Мы - новая страна, с маленькой и новой армией. Если ядерное оружие будет размещено на нашей территории, это создаст угрозу для Советского Союза и даст ему ещё больше поводов для нападения!'\n\nАмериканский делегат ответил. 'Но, видите ли, статья 5 гарантирует вашу безопасность сейчас. Мерзкие коммуняки не посмеют напасть на нас!' Председатель комитета, выглядевший так, словно ему нужно было выпить чего-нибудь крепкого, молча заткнул ему рот. 'Возможно, нам следует обсудить этот вопрос на закрытом заседании'."
 Adenauer53.11.d:0 "Сегодня в Риме, Федеративная Республика участвовала в подписании Римского договора, который также назывался Договором об учреждении Европейского экономического сообщества и предлагал снижение таможенных пошлин и создание таможенного союза, а также создание единого экономического рынка. Что ещё более важно, этот договор учредил Европейскую комиссию, которая стала исполнительной властью Европейского союза. Подписанное канцлером Конрадом Аденауэром и гос. секретарём министерства иностранных дел Вальтером Халльштайном, участие Германии в этой организации, безусловно, будет выгодно всем!"
 Adenauer53.12.d:0 "Федеральный конституционный суд, высшая судебная инстанция страны, вынес важное решение. Определяя правовой статус Западного Берлина, продолжающего оставаться оккупированным тремя западными союзниками, суд постановил, что город является землёй Федеративной Республики Германии. Определение города как отдельной земли предоставляет его гражданам права, предусмотренные Основным законом. Это неожиданное развитие событий, особенно при наличии трёх оккупационных властей в Берлине; Бог знает, что Советы сочтут это за трюк для показухи."
 Adenauer57.1.d:0 "Сегодня в Бундестаге была принята важная часть немецкой реформы - Закон об общих последствиях войны. Этот закон, призванный покрыть все претензии и убытки от действий бывшего германского рейха и передать их Федеративной Республике, в конечном итоге окажется полезным для восстановления войны не только в Германии, но и во всей Европе, где был нанесён значительный ущерб. В целом это было признано как принятие правительством Германии полной финансовой ответственности за действия своих фашистских предшественников и получило широкую поддержку западных союзников."
 Adenauer57.2.d:0 "Сегодня в Ульме завершился суд над айнзацгруппой. Дело, проходившее в Ульмском региональном суде, касалось десяти сотрудников гестапо, СД и полиции порядка, входивших в состав Тильзитской эйнзацгруппы во времена национал-социализма. Согласно докладу Вальтера Шталекера, бывшего командира эйнзацгруппы А, эти десять человек были обвинены в убийстве более 5000 еврейских мужчин, женщин и детей у литовской границы во время войны.\n\nСчитаясь первым поворотным пунктом в судебной борьбе с наследием национал-социализма, все десять обвиняемых были приговорены к срокам от 3 до 15 лет лишения свободы за 'убийство с поличным' и лишены гражданских прав на срок до 10 лет. \n\nЭто дело имело глубокие последствия: было создано Центральное управление Государственной администрации по расследованию преступлений национал-социализма, чтобы помочь начать федеральное преследование по всем делам, что позволило союзникам убедиться в том, что Федеративная Республика может сама себя контролировать."
 Adenauer57.3.d:0 "8 июля 1954 года Федеративная Республика Германия была приглашена на Всемирную выставку в Брюсселе, также известную как Экспо 58. Казавшийся политически деликатным, особенно после участия нацистской Германии во Всемирной выставке 1937 года в Париже, этот момент стал переломным для Федеративной Республики.\n\n Вопрос о том, как Федеративная Республика должна представлять себя, горячо обсуждался, в кабинете министров проходили противоречивые дебаты, пока в 1956 году не было принято окончательное решение.\n\n Немецкий павильон состоял из двух этажей, покрытых стеклом, с мостом, обеспечивающим доступ через Бундесавтобан 3. Небольшой по сравнению с более крупными павильонами США и СССР, а также печально известным павильоном Бельгийского Конго, наш вклад в Экспо 58 представляет собой надежду на будущее Федеративной Республики."
 Adenauer57.4.d:0 "В Бундестаге возникла новая проблема. С момента вступления Федеративной Республики в НАТО и встречи, состоявшейся два года назад перед Военным комитетом НАТО, вопрос о ядерном оружии преследует федеральное правительство. Аденауэр и его кабинет выступают за размещение НАТО ядерного оружия в Федеративной Республике, а также за возможную независимую ядерную программу с Францией и Италией. Однако СДПГ высказала многочисленные опасения по поводу всех аспектов, начиная с размещения НАТО, считая это превышением полномочий и риском для безопасности не только граждан Германии, но и возможного воссоединения с Востоком.\n\nКабинет Аденауэра, консультируясь с членами СДПГ, предложил провести референдум по этому вопросу, чтобы народ мог принять решение. \Однако этот вопрос может быть заблокирован Федеральным конституционным судом, который заранее дал понять, что разрешение на ядерное оружие было бы неконституционным в соответствии со статьей 26 Основного закона.\n\nДолжен ли референдум продолжаться, отражая волю народа, или этот вопрос должен быть отменён раз и навсегда?"
 Adenauer57.5.d:0 "По распоряжению Федерального правительства Германии во всех федеральных землях прошёл референдум о размещении ядерного оружия. Миллионы немцев, имеющих право голоса, пришли сегодня на свои избирательные участки, чтобы решить судьбу размещения ядерного оружия НАТО в Федеративной Республике. Штаб-квартира НАТО в Брюсселе пока не дала никаких комментариев, однако ожидается, что после объявления результатов голосования последует публичное заявление. Что выбрала нация?"
 Adenauer57.6.d:0 "Сегодня было созвано ещё одно заседание кабинета министров, на этот раз в связи с вопросом, поднятым германскими посольствами в Лондоне, Париже и Вашингтоне по поводу советской записки, направленной правительствам трёх последних стран.\n\nАденауэр уже сидел, как и остальные члены кабинета, когда к нему поспешил министр иностранных дел Генрих фон Брентано, с руками, полными материалов для брифингов и распечаток.\n\nАденауэр начал. 'Брентано, что нового?'\n\nБрентано ответил. 'Канцлер, Советы заявили... вернее, потребовали... чтобы союзники вывели свои войска из Западного Берлина, и чтобы город стал Свободным городом.'\n\nЭто вызвало бурное обсуждение в зале, которое Аденауэр прокомментировал. 'Я полагаю, что кабинет не согласен с большинством этих пунктов, и поэтому...'\n\nЕго прервал младший министр, министр по делам Германии. 'Сэр, может быть, это не такая уж плохая идея - Берлин может быть свободен, и Советы могут отступить'. Брентано снова ворвался в разговор. 'Это ужасная идея. Мы должны занять более жёсткую позицию в отношении Советов - в конце концов, для чего мы вступили в НАТО?' Аденауэр сделал паузу, размышляя."
 Adenauer57.7.d:0 "Федеральное правительство Германии подверглось новому давлению со стороны западных держав с целью признания линии Одер-Нейсе, которая в настоящее время является границей между Польской Народной Республикой и Германской Демократической Республикой, сформированной после Потсдамской конференции по течению рек Одер и Нейсе. В то время как американцы оказывают особое давление на Аденауэра и его кабинет с целью признания линии посредством пактов о ненападении, часть немецкого населения, особенно демографическая группа немецких изгнанников, осознала его возможные мотивы и начала действовать против признания Польши. Должна ли линия быть признана?"
 Adenauer57.8.d:0 "С сожалением сообщаем, что Теодор Оберландер, бывший министр по делам перемещенных лиц, беженцев и жертв войны и член Бундестага, был вынужден уйти в отставку со службы в правительстве ФРГ. В начале этого года Оберландер был обвинен в поощрении и совершении военных преступлений в Польше во время Второй мировой войны, а также в одобрении этнических чисток в Польше в отношении народа, который он вскоре возглавил как лидер Общегерманского блока/Лиги изгнанных и лишенных прав.\n\nОжидается, что кабинет Аденауэра сделает публичное заявление по этому поводу, но будет полностью отрицать обвинения и пожелает Оберландеру благополучной отставки."
