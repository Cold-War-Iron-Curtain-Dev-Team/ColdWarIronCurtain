l_english:
 suezcrisis.1.d: "Сегодня египетское правительство приняло решение в одностороннем порядке отменить Англо-египетский договор 1936 года. Это было встречено с большой тревогой в мировом сообществе, так как многие подозревают, что Египет имеет свои взгялд на реализацию захвата канала."
 suezcrisis.2.d: "Сегодня Суэцкий канал был захвачен, и империалисты будут вытеснены из канала! Египетские войска вошли в канал и взяли его под свой контроль. Правительство быстро объявило о национализации Суэцкого канала. Империалисты потрясены этой новостью, но мы считаем, что они слишком слабы что бы остановить нас."
 suezcrisis.3.d: "Наши опасения по поводу судьбы Суэцкого канала оправдались, когда Египет захватил и национализировал Суэцкий канал. Это беспрецедентная опасность для нашей экономики и международного престижа, мы должны что то делать."
 suezcrisis.4.d: "Египет вераломно национализировал Суэцкий канал, подвергнув наши торговые пути серьезной опасности. Мы не одиноки в этой проблеме, поскольку англичане страдают от главного удара. Мы решили начать работать с англичанами над планом отмены национализации канала, Египту это не сойдет с рук."
 suezcrisis.5.d: "В то время как Египет национализировал Суэцкий канал, поставив под угрозу международную торговлю, они также решили блокировать жизненно важный для нас торговый путь-Тиранский пролив, блокируя наши корабли от торговли с внешним миром. Мы не можем позволить этому продолжаться, мы должны как-то остановить это."
 suezcrisis.6.d: "США, опасаясь эскалации ситуации, провели международную конференцию с целью разрешения кризиса. Многие страны стояли на своем в отношении владения каналом, и ни одна сторона, казалось, не прогибалась. Эта конференция закончилась полным провалом, поскольку ситуация продолжает обостряться."
 suezcrisis.7.d: "Сегодня во французском городе Севр состоялась секретная встреча между британскими, французскими и израильскими представителями, все присутствующие страны возмущены египетской национализацией канала и выступают за действия по отмене национализации. План состоит в том, чтобы израильские войска атаковали Синайский полуостров, остановились возле канала и позволили британским и французским силам атаковать канал и сокрушить египтян, положив конец конфликту и анексии с их стороны."
 suezcrisis.8.d: "Сегодня в городе Севр состоялась секретная встреча между британскими, французскими и израильскими представителями, все присутствующие страны возмущены египетской национализацией канала и выступают за действия по отмене национализации. План состоит в том, чтобы израильские войска атаковали Синайский полуостров, остановились возле канала и позволили британским и французским силам атаковать канал и сокрушить египтян, положив конец конфликту."
 suezcrisis.9.d: "Англо-французский план операции \"Мушкетер\" прошел проверку и ждет своей реализации. Первоначальная операция включала британско-французскую высадку в Александрии, но место высадки было перенесено в Порт-Саид, чтобы свести к минимуму жертвы среди гражданского населения. Цель состоит в том, чтобы быстро взять под контроль канал, прежде чем египтяне успеют действовать."
 suezcrisis.10.d: "Сегодня англо-французские войска высадились в Порт-Саиде и быстро захватили город после короткого боя с обороняющимися египетскими войсками. Когда давление уже растет, мы должны достичь целей операции, иначе она закончится неудачей."
 suezcrisis.11.d: "Протесты против нашего вторжения начали разгораться с социалистами и неинтервенционистами, одинаково требующими прекращения операции. Правительство в основном закрывает на это глаза в надежде, что протесты утихнут."
 suezcrisis.12.d: "Сегодня завершается последний рывок в Суэцком канале и операция \"Мушкетер\", успех быстро положит конец операции, а провал или тупик приведет к провалу операции под давлением ООН, вынуждающим наши войска отказаться от операции."
 suezcrisis.13.d: "Плохие новости, наша атака была отбита решительными египетскими защитниками. Теперь нам остается только ждать решения ООН о прекращении огня. Операция провалилась."
 suezcrisis.14.d: "Хорошие новости, наша атака был успешной, египетские войска были в панике и отступили от канала. Теперь у нас гораздо больше рычагов влияния, чем было бы в противном случае на предстоящих переговорах. Операция \"Мушкетер\" имела оглушительный успех."
 suezcrisis.15.d: "Было принято решение о прекращении огня ООН. Наши войска должны будут покинуть Египет сегодня, наши отношения с Соединенными Штатами пострадали от этой операции, и общее восприятие операции является одним из великолепных провалов."
 suezcrisis.16.d: "Был подписан новый договор, Александрийский договор, по которому Египет уступит Суэцкий канал обратно Компании Суэцкого канала и демилитаризирует Синайский полуостров и сектор Газа. Победа нашей внешней политики."
 suezcrisis.17.d: "Империалистические англо-французы и израильтяне отступили после своих мелких попыток завоевать нашу нацию. Наш лидер провозглашен спасителем арабского мира. Пропагандистская победа нашей нации."
 suezcrisis.18.d: "Империалистические англо-французы и израильтяне отступили, но не раньше, чем навязали нам несправедливый и унизительный договор. Это, безусловно, повредит популярности нашего режима."
 suezcrisis.19.d: "Израильская делегация решила \"воздержаться\" от наших планов захвата канала, опасаясь международного возмездия. Мы должны были бы получить еще один casus belli, чтобы вмешаться, планы уже разрабатываются."
 suezcrisis.20.d: "Опишите, как израильтяне, хотя они и победили, были вынуждены отступить из-за политического давления"
 suezcrisis.0.d: "Опишите, как Египет окончательно отменил ратификацию договора"
 OperationKadesh.1.d_1: "Сегодня премьер-министр [Root.GetLeader], генеральный директор Министерства обороны Шимон Перес и начальник штаба Моше Даян тайно встретились с французским министром обороны, министром иностранных дел и начальником штаба в дополнение к британскому министру иностранных дел и его помощнику в изолированном доме во французском городе Севр. Они говорили об актуальности ситуации в Египте и своей реакции на национализацию Египтом Суэцкого канала. Затем они запланировали вторжение в Египет в 2 этапа, включая историю прикрытия, чтобы рассказать ее всему миру. Израильский делегат опасался быть покинутым Францией и Великобританией в разгар вторжения и поэтому потребовал, чтобы все стороны подписали документ, подтверждающий их верность друг другу. Все лидеры покинули здание с копиями соглашения, и теперь все, что нам нужно сделать, это подготовиться к вторжению на Синайский полуостров, в то время как западные державы сосредоточатся на Египте."
 OperationKadesh.1.d_2: "Сегодня премьер-министр [Root.GetLeader], генеральный директор Министерства обороны и начальник штаба тайно встречались с французским министром обороны, министром иностранных дел и начальником штаба в дополнение к британскому министру иностранных дел и его помощнику в изолированном доме во французском городе Севр. Они говорили об актуальности ситуации в Египте и своей реакции на национализацию Египтом Суэцкого канала. Затем они запланировали вторжение в Египет в 2 этапа, включая историю прикрытия, чтобы рассказать ее всему миру. Израильтяне, опасаясь быть покинутыми Францией и Великобританией в разгар вторжения, потребовали, чтобы все стороны подписали документ, подтверждающий их верность друг другу. Все лидеры покинули здание с копиями соглашения, теперь все, что нам нужно сделать, это подготовиться к вторжению на Синайский полуостров, в то время как западные державы сосредоточатся на Египте."
 OperationKadesh.2.d: "С нашим включением в англо-французский план свержения Насера наша цель состояла в том, чтобы обеспечить безопасность Синайского полуострова, в то время как англо-французские войска атакуют сам канал. Из-за ограничений, наложенных планом не начинать операцию с упреждающего удара по египетским аэродромам, мы вынуждены вместо этого использовать десантников для обеспечения наших целей. 890-й десантный батальон во главе с командиром Рафаэлем Эйтаном был сброшен на восточные подступы к перевалу Митла и должен продержаться несколько часов, пока остальные десантники не смогут догнать их."
 OperationKadesh.3.d: "Одной из наших главных целей было остановить вторжение федаинов в Израиль. В то время как многие ожидали, что базы федаинов будут расположены как в Газе, так и на Синайском полуострове, ЦАХАЛ не смог найти никаких баз федаинов на Синайском полуострове и поэтому решил уничтожить любую базу федаинов, которую он мог найти в Газе. После того, как все это было сделано, многие ожидают, что федаины будут сильно ослаблены и больше не будут представлять серьезной угрозы."
 OperationKadesh.4.d: "Наше главное наступление на Синайский полуостров началось сегодня всерьез, с силами, движущимися к Аришу, Абу-Агейле и перевалу Митла. Операция \"Кадеш\" может начаться прямо сейчас."
 OperationKadesh.5.d: "В то время как остальная часть операции идет плавно, ЦАХАЛ столкнулся с некоторыми трудностями при захвате важных дорожных узлов Абу-Агейла и Ум-Катеф. После неудачного лобового штурма бронетанковые подкрепления помогли армии обороны Израиля прорвать линию обороны египтян и фактически взять под контроль весь северный Синайский полуостров."
 OperationKadesh.6.d: "Еще одно важное место для захвата-стратегический перевал Митла, тот самый перевал, на который несколько дней назад была отправлена 890-я десантная бригада. С прибытием подкреплений десантники начали захватывать перевал Митла, начав долгий и кровопролитный бой против оборонявшейся египетской армии. Распространился миф о том, что рядовой Иегуда Кен-Дрор въехал на джипе на перевал Митла, чтобы привлечь к себе египетский огонь, пожертвовав при этом собой. После того, как пыль осела, 38 десантников были убиты, 120 ранены, а 260 египтян лежали мертвыми. В этот момент египтяне полностью отступили, чтобы защитить Суэцкий канал, прекратив сопротивление на северном Синае."
 OperationKadesh.7.d: "Находясь на Синайском полуострове, ЦАХАЛ начал разрушать египетскую инфраструктуру, чтобы помешать египетскому продвижению в будущем. Разрушение инфраструктуры оказалось бы занозой в боку египтян на довольно долгое время."
 OperationKadesh.8.d: "Сегодня ЦАХАЛ захватил стратегический порт Шарм-эль-Шейх, предоставив ЦАХАЛУ контроль над Южным Синаем и выведя из строя египетскую блокаду в Тиранском и Акабском проливах."
 OperationKadesh.9.d: "Международное давление усиливается на США, Великобританию и Францию, чтобы они прекратили операцию и ушли с Синайского и Суэцкого каналов соответственно. Кульминацией этого стало то, что и США, и СССР выступили с суровыми предупреждениями об уходе с Синая. В то время как некоторые выступали против ухода, у нас нет особого выбора, поскольку мы не хотим вызывать их гнев."
 OperationKadesh.10.d: "С успехом британского последнего толчка Египет был вынужден заключить унизительный мир, предоставив Суэцкий канал обратно Корпорации Суэцкого канала (и фактически Британии), и ему было запрещено перемещать солдат в Канал. Договор также демилитаризовал Синайский полуостров после обещания нашего вывода. Демилитаризованный Синайский полуостров получил большую поддержку в Израиле, и лишь немногие выступали против вывода войск."
 OperationKadesh.11.d: "Поскольку мы выступали против присоединения к англо-французскому плану по захвату контроля над Суэцким каналом, Верховное командование ЦАХАЛА начало разрабатывать планы, чтобы раз и навсегда покончить с угрозой федаинов. План под названием операция \"Мапатц\" начинался с того, что десантники тайком высаживались в сектор Газа, очаг активности федаинов, и сеяли хаос на каждой базе федаинов, которую они могли найти, через 2 часа механизированные группы должны были помочь десантникам в их миссии, которая завершилась большим успехом и значительно ослабила федаинов. После операции многие эксперты считают, что угроза федаинов миновала навсегда."
 isr_eng.1.d: "Если Израиль скажет \"Да\", они получат альт-севр. если нет, то ничего не происходит"
 isr_eng.2.d: "Печаль"
 isr_eng.3.d: "Военные цели Израиля"
 isr_eng.4.d: "Военные цели Великобритании"
 isr_eng.5.d: "Британская помощь Израилю"
 fra_eng.1.d: "Половина  Великобритания и Франция получают события для альт-севр 2"
 fra_eng.2.d: "Британия совершит атаку под ненастоящим флагом, чтобы получить оправдание для вторжения"
 fra_eng.3.d: "Франция вторгнется и/или бомбит"
 fra_eng.4.d: "Атака с ненастоящим  флагом. пока никаких последствий."