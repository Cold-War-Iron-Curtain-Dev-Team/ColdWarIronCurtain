 TASK_FORCE_AUTO_REINFORCEMENT_DESC: "Если включено §Hавтоматическое пополнение§! оперативного соединения, оно будет забирать корабли из резервных флотов своего театра в соответствии с заданными требованиями.\nПри включении требования будут отображаться под текущим количеством кораблей в оперативном соединении.\n\nОперативное соединение никогда не возвращает корабли автоматически, если их больше, чем нужно."
