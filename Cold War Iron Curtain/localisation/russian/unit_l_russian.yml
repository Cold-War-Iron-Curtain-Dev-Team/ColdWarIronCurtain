 RESERVE_FLEETS_FOR_THIS_THEATER_DESC: "Корабли, выходящие со стапелей и не имеющие конкретной §Yцели для размещения§!, автоматически назначаются в резерв.\nКорабли в резервном флоте автоматически выходят на подкрепление оперативных соединений, у которых включена функция §YАвтоматическое пополнение§! и которым требуется пополнение.\nЕсли же количество кораблей в оперативном соединении больше, чем требуется, то часть кораблей покинет соединение и отправится в ближайший порт, а затем в резерв."
