 CUB_Implement_Land_Reform: "Провести земельную реформу"
 CUB_the_final_revoultion: "Финальная революция"
 CUB_the_final_revoultion_desc: "Куба больше не будет свидетелм коррупции, которой Батиста одарил жителей старой Кубы."
 CUB_bay_of_pigs_victory: "Победа в Заливе Свиней"
 CUB_bay_of_pigs_victory_desc: "Социалистического правительства Кубы больше нет, грядет разрешение Кубинской огромной проблемы."
 CUB_victorious_blaze: "Победоносное пламя"
 CUB_victorious_blaze_desc: "Батиста долго добивался этого, и сейчас это было вопросом приложенных усилий."
 CUB_the_cuban_missile_crisis: "Карибский кризис"
 CUB_the_cuban_missile_crisis_desc: "Соединенные Штаты стремятся расколоть Кубу своим гадким империализмом. Никита Хрущев намерен помочь Кубе в борьбе с империалистами."
 CUB_the_provisional_cuban_government: "Временное правительство Кубы"
 CUB_the_provisional_cuban_government_desc: "Кубе необходимо примириться с обязанностями, которые она должна выполнять."
 CUB_the_shut_down_of_brothels: "Закрытие борделей"
 CUB_the_shut_down_of_brothels_desc: "Бордели - символ коррупции в истории Кубы со времен режима Батисты. Если это оставит людей без работы, им придется терпеть."
 CUB_crusades_against_corruption: "Крестовые походы против коррупции среди политиков"
 CUB_crusades_against_corruption_desc: "Причина, по которой Батиста пришел к власти, была полностью связана с его желанием атаковать кубинское население на выборах 1953 года."
 CUB_political_intensity: "Политическая напряженность"
 CUB_political_intensity_desc: "'Движение Четвертого июля' показало себя агрессивным в долгосрочной перспективе, поскольку оно разделено на 'Кубинский национализм' и 'Кубинский коллективизм'."
 CUB_governmental_resignation: "Отставка правительства"
 CUB_governmental_resignation_desc: "Если нынешний режим сохранится, это только усилит политический кризис. Правительство должно уйти в отставку"
 CUB_educational_rehabilitation: "Реабилитация образования"
 CUB_educational_rehabilitation_desc: "Из-за режима Батисты Кубе пришлось многим пожертвовать для того, чтобы остаться в живых. Одной из этих вещей было создание кубинского образования."
 CUB_regime_stabilization: "Стабилизация режима"
 CUB_regime_stabilization_desc: "Нынешний режим принес стабильность, позволяющяя государству действовать."
 CUB_execution_of_the_batista_era: "Конец эпохи Батисты"
 CUB_execution_of_the_batista_era_desc: "Куба, наконец, разобралась со вредом нанесенном Батистой, правление которого  оказало негативное влияние на историю Кубы."
 CUB_public_persuadsion: "Убеждение общественности"
 CUB_public_persuadsion_desc: "Чтобы следующий режим вступил во власть, им потребуется помощь в его стабилизации."
 CUB_che_in_the_barracks: "Гевара в казармах"
 CUB_che_in_the_barracks_desc: "Эрнесто Гевара был назначен ответственным за кубинские казармы для того, чтобы любыми необходимыми средствами избавиться от любого про-Батистского влияния."
 CUB_youth_indoctination: "Воспитание молодежи"
 CUB_youth_indoctination_desc: "Молодежь уже спасла Кубу однажды. Она должна продолжать делать это."
 CUB_path_to_democracy: "Путь к демократическим ценностям"
 CUB_path_to_democracy_desc: "Демократия, хоть и не соответствует нашим идеалам, должна быть обеспечена для защиты народа Кубы."
 CUB_one_party_socialism_in_the_cuban_state: "Однопартийный социализм на Кубе"
 CUB_one_party_socialism_in_the_cuban_state_desc: "Кубу можно защитить только идеалами социализма, с применением насильственных средств."
 CUB_the_crazied_devil_che_guervara: "Безумный дъявол Че Гевара"
 CUB_the_crazied_devil_che_guervara_desc: "Эрнесто Гевара пользуется поддержкой кубинского народа,ему придется вести нас по-крайней мере пока."
 CUB_a_revoultionary_regiment: "Революционный режим"
 CUB_a_revoultionary_regiment_desc: "Гевара хочет установить режим, возглавляемый сторонниками революции, обучение которых прошло у бывших Республиканцев мертвой Испании."
 CUB_cultural_revoultion: "Культурная революция"
 CUB_cultural_revoultion_desc: "Куба всегда будет управляться грязным империалистом, только если мы не разберемся с этим."
 CUB_the_soldier_raul_castro: "Солдат Рауль Кастро"
 CUB_the_soldier_raul_castro_desc: "У Рауля Кастро есть намерения привести Кубу к изоляции."
 CUB_mafia_witch_hunts: "Охота на мафиозных ведьм"
 CUB_mafia_witch_hunts_desc: "Неважно в какой части света, мы будем стараться стереть Мафию и все ее идеалы с лица Земли, за то, что они сделали со славной Кубой."
 CUB_state_visit_to_the_USA: "Государственный визит в США"
 CUB_state_visit_to_the_USA_desc: "Кубой тайно управляет левый режим под их носом, нынешнему режиму придется обратить на это внимание и спланировать визит в Вашингтон, чтобы избежать подозрений со стороны правительства США."
 CUB_the_progressive_movement: "Прогрессивное движение"
 CUB_the_progressive_movement_desc: "Прогрессивное движение - это то, что народ Кубы пытался воссоздать из разрушения партий Partido Auténtico и Partido Ortodoxo."
 CUB_increase_wages_for_the_middle_class: "Повысить заработные платы для среднего класса."
 CUB_increase_wages_for_the_middle_class_desc: "Средние и низшие классы должны стать основой для богатых для дальнейшего развития страны."
 CUB_introduce_a_welfare_state: "Представить государство всеобщего благосостояния"
 CUB_introduce_a_welfare_state_desc: "Режим симпатизирует идеалам капитала благосостояния"
 CUB_national_industrialization: "Национальная индустриализация"
 CUB_national_industrialization_desc: "Куба в последнее время сильно стремится к индустриализации."
 CUB_moderate_socialism: "Умеренный социализм"
 CUB_moderate_socialism_desc: "Хотя это не «настоящий» социализм, это могло бы уменьшить степень разногласий на Кубе."
 CUB_progressive_land_reform: "Прогрессивная земельная реформа"
 CUB_progressive_land_reform_desc: "Необходимо будет провести земельную реформу, чтобы компенсировать количество земель, которыми Куба владеет."
 CUB_the_world_revoultion: "Мировая Революция"
 CUB_the_world_revoultion_desc: "Если мир не хочет революции с нашими иделами, революция должна прийти на Землю."
 CUB_rebellion_in_the_americas: "Восстания в Америках"
 CUB_rebellion_in_the_americas_desc: "Американский континент больше не будет игрушкой в руках США, он станет миром коллективизированных стран, подобным нашему собственному Союзу."
 CUB_cooperation_in_buenos_aires: "Сотрудничество в Буэнос-Айресе"
 CUB_cooperation_in_buenos_aires_desc: "Хуан Доминго Перон оставил след в истории Аргентины, симпатизировав как левым, так и правым, экономический союз будет объединять Гавану и Буэнос-Айрес."
 CUB_bolivian_socialism: "Боливийский социализм"
 CUB_bolivian_socialism_desc: "Боливия кажется чрезвычайно слабой, особенно из-за того количества отчаяния, которое ей пришлось вынести от своих соседей и Соединенных Штатов."
 CUB_racial_opptunity: "Расовое единство"
 CUB_racial_opptunity_desc: "Куба будет известна как котёл антирасистских идеалов."
 CUB_colombian_leftism: "Колумбийская левизна"
 CUB_colombian_leftism_desc: "Движения правых и левых безуспешны в Колумбии, однако Куба все равно ищут левые движения."
 CUB_the_secret_revoultion: "Тайная революция"
 CUB_the_secret_revoultion_desc: "'Движение Четвертого июля' восстало против нашего неуважения к демократическому обществу, в результате чего они бросились к более радикальным методам."
 CUB_extensive_taxation: "Расширенное налогооблажение"
 CUB_extensive_taxation_desc: "Будь то богатые или бедные, Куба желает коллективизации всех ценностей, чтобы восстановить наше величие."
 CUB_posadist_legacy: "Новое наследие"
 CUB_posadist_legacy_desc: "Разработан в дружественной Аргентине; Посадизм - это идеология из ветви троцкизма, в которой развитое общество, подобное нам, будет столь же развитым, как и инопланетные существа."
 CUB_removal_of_private_property: "Уничтожение частной собственности"
 CUB_removal_of_private_property_desc: "Частная собственность только разделяет классы, нам нужно коллективизировать ее полностью."
 CUB_rally_for_rocketry: "Митинг за развитие ракетной техники"
 CUB_rally_for_rocketry_desc: "Единственный способ встретиться с нашими героями - улететь за звезды, если не сегодня, то завтра."
 CUB_consolidation_of_power: "Консолидация власти"
 CUB_consolidation_of_power_desc: "Многие режимы до нас потерпели неудачу из-за неудачных действий политической консолидации."
 CUB_anti_communist_rhetoric: "Анти-коммунистическая риторика"
 CUB_anti_communist_rhetoric_desc: "Коммунизм приносит только разрушения и даже больше политических и гражданских волнений. Именно поэтому, он вреден будущему Кубы."
 CUB_prosecution_of_batistos: "Преследование верных последователей Батисты"
 CUB_prosecution_of_batistos_desc: "У Батисты есть сторонники безумной натуры, независимо от того, является ли их преследование насильственным или конституционным, Куба не может позволить им разгуливать на свободе."
 CUB_deal_with_the_usa: "Сделка со Соединенными Штатами"
 CUB_deal_with_the_usa_desc: "Соединенные Штаты Америки до сих пор поддерживали наш режим, с таким же успехом они могли бы продолжить делать это."
 CUB_strike_against_leftist_strongholds: "Удар по оплотам левых сил"
 CUB_strike_against_leftist_strongholds_desc: "Продолжение осуждения левых сил может ухудшить наше затруднительное положение, возможно радикальный вариант может стать решением проблем."
 CUB_cuban_isolationism: "Кубинский изоляционизм"
 CUB_cuban_isolationism_desc: "Кубинский народ устал отвмешательства Соединенных Штатов в дела Кубы. После этого, американские побеги могут прекратиться."
 CUB_prosecution_against_batista: "Преследование Батисты"
 CUB_prosecution_against_batista_desc: "Будь Организация Объединенных Наций на нашей стороне или нет, Батиста в любом случае должен был бы предстать перед судом"
 CUB_allow_the_secular_clubs: "Разрешить светские клубы"
 CUB_allow_the_secular_clubs_desc: "Данные клубы пропагандируют противозаконное поведение и были чрезвычайно поощряемы во время режима Батисты, однако, если мы закроем их; рабочие места могут оказаться под угрозой."
 CUB_ban_the_secular_clubs: "Запретить светские клубы"
 CUB_ban_the_secular_clubs_desc: "Эти клубы пропагандируют противозаконное поведение и очень поощрялись во время режима Батисты, однако это не имеет значения; Кубе придется вынести боль за более цивилизованную нацию на мировой арене."
 CUB_crackdown_on_infamous_corruption: "Преследование печально известной коррупции"
 CUB_crackdown_on_infamous_corruption_desc: "Батиста может и позволял мафии бродить по Кубинской земле, однако военная хунта не допустит, чтобы подобное повторилось снова."
 CUB_the_education_womb: "Зарождение образования"
 CUB_the_education_womb_desc: "При режиме Батисты было разрушено образование, поэтому крайне важно разрушить бордели и построить вместо них школы."
 CUB_soviet_guarentee: "Советская гарантия"
 CUB_soviet_guarentee_desc: "Куба обладает ракетами, преставляющими опасность Соединенным Штатам. Использование ракет остается за СССР, но Кубе остается угроза независимости от империалистической риторики Соединенных Штатов."
 CUB_cuban_missiles: "Кубинские ракеты"
 CUB_cuban_missiles_desc: "Эти советские ракеты - то, что нужно Кубе, хотя СССР не знает, что Куба намерена разобрать некоторые из этих ракет для нашей собственной управляемой выгоды."
 CUB_consolidation_of_the_caribbean: "Укрепление Кариб"
 CUB_consolidation_of_the_caribbean_desc: "У Соединенных Штатов есть база в Карибском бассейне, в зависимости от ее влияния Соединенные Штаты могут получить поддержку Гаити и Домииканы."
 CUB_goal_against_the_domician: "Цель войны с Доминиканой"
 CUB_goal_against_the_domician_desc: "Доминиканская Республика представляет собой угрозу кубинскому марксизму; консолидация Кубы идет полным ходом."
 CUB_attack_haiti: "Вторжение на Гаити"
 CUB_attack_haiti_desc: "Гаити должна быть освобождена от Американского империализма"
 CUB_prepare_for_an_us_counterattack: "Приготовиться к Американскому вторжению"
 CUB_prepare_for_an_us_counterattack_desc: "Грязные империалисты думают, что они могут просто в ритме вальса прибыть на Кубу без какого-либо сопротивления, но они получат бой."
 CUB_anti_aircraft: "Противовоздушная оборона"
 CUB_anti_aircraft_desc: "Кубу нужно защитить от вторжений с воздуха."
 CUB_prime_minister_castro: "Премьер-министр Фидель Кастро."
 CUB_prime_minister_castro_desc: "Фидель Кастро уже руководит этой страной, почему бы ему не делать это официально?"
 CUB_agarian_land_reform: "Аграрная реформа землевладения"
 CUB_agarian_land_reform_desc: "Земля должна быть поровну разделена между людьми."
 CUB_finacial_distribution: "Уравнение финансовых возможностей"
 CUB_finacial_distribution_desc: "У всех кубинцев будут равные возможности."
 CUB_military_isolation: "Военная изоляция"
 CUB_military_isolation_desc: "Рауль Кастро не является марионеткой ни Советского Союза, ни Китайской Народной Республики."
 CUB_closer_ties_with_the_prc: "Более тесные связи с Китайской Народной Республикой"
 CUB_closer_ties_with_the_prc_desc: "У КНР есть несколько великих идеалов, которые разделяет Че Гевара, быть может, что вместе они продолжат Революцию."
 CUB_closer_ties_with_the_USSR: "Более тесные связи с Советским Союзом"
 CUB_closer_ties_with_the_USSR_desc: "Советский Союз является крупнейшим экспортером Революции, их цель аналогична нашей - избавиться от империализма Запада."
 CUB_venture_in_africa: "Предприятия в Африке"
 CUB_venture_in_africa_desc: "Африка - самое слабое звено западного империализма, наша задача - освободить их население от угнетения."
 CUB_state_visit_to_santiago: "Государственный визит в Сантьяго"
 CUB_state_visit_to_santiago_desc: "С успехом левого движения в одной из сильнейших стран в Южной Америке, союзным державам Революции необходимо встретиться, чтобы обсудить дальнейшее развитие кооперативного социализма."
 CUB_the_shining_path: "Sendero Luminoso-Сияющий путь"
 CUB_the_shining_path_desc: "С успехом, достигнутым в результате победы крайне левых в Перу, нашим силам необходимо установить дружеские отношения со страной, если только ситуация не ухудшится."
 CUB_the_angolan_civil_war: "Гражданская война в Анголе"
 CUB_the_angolan_civil_war_desc: "Повстанцы-коммунисты в Анголе нуждаются в кубинской поддержке, чтобы противостоять империализму."
 CUB_the_six_days_war: "Шестидневная война"
 CUB_the_six_days_war_desc: "Египет находится под огнем империализма стран Запада и поэтому Египту нужна помощь Кубы, чтобы освободить Ближний Восток от империализма Запада."
 CUB_south_african_marxism: "Южно-Африканский Марксизм"
 CUB_south_african_marxism_desc: "Куба должна начать операцию по принесению революции в Южную Африку при нашей поддержке и наших идеалах."
 CUB_state_visit_to_algiers: "Государственный визит в Алжир"
 CUB_state_visit_to_algiers_desc: "Алжир находится под атакой империалистов. Нам нужно заступиться за него."
 CUB_support_the_congo: "Поддержать Конго"
 CUB_support_the_congo_desc: "Конго отчаянно нуждается в подкреплении Кубы, ради сохранения своей независимости."
 CUB_marxist_leninist_rhetoric: "Марксистско-ленинская риторика"
 CUB_marxist_leninist_rhetoric_desc: "Только марксизм-ленинизм может объединить людей для достижения «настоящего» коммунизма."
 CUB_the_non_aligned_movement: "Движение нейтралов"
 CUB_the_non_aligned_movement_desc: "Куба станет союзником Югославии, потому что мы разделяем одни и те же идеалы против Востока и Запада."
 CUB_incite_rallies_against_radicals: "Спровоцировать митинги против радикалов"
 CUB_incite_rallies_against_radicals_desc: "Радикалы Кубы вовлекают радикалов из крайне правых и крайне левых партий и поэтому наше правительство должно использовать все политические усилия для победы над радикалами."
 CUB_a_modern_constitution: "Современная Конституция"
 CUB_a_modern_constitution_desc: "Только Конституция, принятая в соответствии с Законом, может спасти Кубу во все времена."
 CUB_the_militaristic_era: "Эпоха милитаристов"
 CUB_the_militaristic_era_desc: "Всенародным голосованием кубинский народ решил продолжить хунту."
 CUB_the_washington_dc_meeting: "Встреча в Вашингтоне"
 CUB_the_washington_dc_meeting_desc: "Нынешний президент Соединенных Штатов пригласил нас на встречу в Вашингтоне, округ Колумбия, для обсуждения нашей внешней политики."
 CUB_the_cuban_revoultionary_council: "Кубинский революционный совет"
 CUB_the_cuban_revoultionary_council_desc: "Кубинский революционный совет вступит во владение благодаря всенародному голосованию населения; Их лидер Хосе Кордона желает вернуться на Кубу после вынужденной отставки."
 CUB_recruitment_propaganda: "Пропаганда обязательного военного призыва"
 CUB_recruitment_propaganda_desc: "Народ Кубы не захочет присоединиться к нашему делу по собственной воле, поэтому принудительный призыв должен осуществляться любыми способами."
 CUB_militaristic_rhetoric: "Милитаристская риторика"
 CUB_militaristic_rhetoric_desc: "Куба и ее народ знают, что единственный способ остаться независимым - это тренироваться, пока не начнется битва."
 CUB_corporatist_economic_policies: "Политика корпоративной экономики"
 CUB_corporatist_economic_policies_desc: "Только корпоративизм может принести нам богатство."
 CUB_civilian_economy: "Гражданская экономика"
 CUB_civilian_economy_desc: "Неолиберализм, хотя и являлся экспериментальным экономическим идеалом, мог бы стать путем к оживлению нашей промышленности."
 CUB_private_land_ownership: "Частная земельная собственность"
 CUB_private_land_ownership_desc: "Коллективизация земли - это бич экономики и, по большей части проделка крайне левых, ее необходимо уничтожить."
 CUB_medicine_through_virture: "Медицина добродетели"
 CUB_medicine_through_virture_desc: "Чтобы залечить раны Кубы, необходимо еще раз реализовать наши религиозные идеалы."
 CUB_family_values: "Семейные ценности"
 CUB_family_values_desc: "Нам нужны наши ценности, для блага Кубы."
 CUB_an_new_cuban_tradition: "Новая Кубинская традиция"
 CUB_an_new_cuban_tradition_desc: "Это время экспериментальных идеалов, наша новая традиция в ближайшем будущем должна оказаться чрезвычайно эффективной."
 CUB_stronghold_of_the_caribbean_right: "Оплот Карибского права"
 CUB_stronghold_of_the_caribbean_right_desc: "Карибский бассейн наконец-то освободился от экстремистского поведения, и Кубе пора помочь своим соседям."
 CUB_ventures_in_europe: "Предприятия в Европе"
 CUB_ventures_in_europe_desc: "Европа по-прежнему и склонна к вредным идеологиям со стороны собственного народа, однако мы можем это изменить."
 CUB_helping_hand_of_the_americas: "Рука помощи Америк"
 CUB_helping_hand_of_the_americas_desc: "В последнее время Америка проявляет крайность и возмущение. Наше представление может это изменить."
 CUB_denunciation_of_spains_legacy: "Осуждение Испанского наследия"
 CUB_denunciation_of_spains_legacy_desc: "Важно осудить методы фашизма, особенно из истории Испании, для разжигания антифашизма против стран континента."
 CUB_aid_in_the_reconstruction_of_germany: "Помощь в восстановлении Германии"
 CUB_aid_in_the_reconstruction_of_germany_desc: "Германия сильно пострадала от своих военных действий в прошлом, и они все еще выздоравливают, мы протянем руку помощи разбитому сердцу Германии."
 CUB_the_valparaiso_summit: "Саммит в Вальпараисо"
 CUB_the_valparaiso_summit_desc: "Вальпараисо, Чили, будет местом обсуждения планов Южного конуса Южной Америки."
 CUB_the_cuban_marshall_plan: "План Маршалла по-кубински"
 CUB_the_cuban_marshall_plan_desc: "С нашим влиянием в Северной Америке, мы сможем устроить план Маршалла по-кубински."
 CUB_coastal_forts_across_cuba: "Прибрежные форты на Кубе"
 CUB_coastal_forts_across_cuba_desc: "Куба должна защитить себя в случае военно-морского вторжения."
 CUB_deal_with_hershey: "Сделка с Херши"
 CUB_washington_havana_joint_commission: "Совместная комиссия Вашингтон-Гавана"
 CUB_washington_havana_joint_commission_desc: "Мы должны работать вместе с людьми в Вашингтоне."
 CUB_state_visit_to_paris: "Государственный визит в Париж"
 CUB_expel_anti_american_influence: "Избавиться от антиамериканского влияния"
 CUB_sino_cuban_pact: "Китайско-кубинский пакт"
 CUB_enviromental_supervision: "Экологический надзор"
 CUB_international_meeting_in_havana: "Международная встреча в Гаване"
