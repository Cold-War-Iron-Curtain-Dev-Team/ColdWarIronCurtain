l_russian:
 gab.1.d: "28 ноября 1967 года, всего через несколько дней после принятия президентской присяги в посольстве Габона, М'ба умер от рака в Париже, где его лечили с августа того же года. У него остались жена Полина М'ба и 11 детей. На следующий день после смерти М'бы Бонго конституционно сменил его на посту президента Габона."
  
