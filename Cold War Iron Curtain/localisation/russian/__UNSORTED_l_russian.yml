 burma.1.d: "С момента обретения независимости от Великобритании в 1948 году наша страна страдает от политических потрясений и гражданских беспорядков, включая многочисленные коммунистические мятежи и раскол правящей партии Антифашистская лига народной свободы (АЛНС) на две конкурирующие фракции. Хотя нам удалось сохранить единство нашей нации, последней опасностью для правительства, по-видимому, являются военные, на которых мы привыкли полагаться в поддержании порядка на протяжении многих лет, и отношения с ними были напряженными с тех пор, как они приняли власть гражданского правительства два года назад. При внезапном и неожиданном повороте событий военный командующий Не Вин организовал общенациональный военный переворот против нашего правительства. Армейские подразделения уже захватили стратегические позиции в Рангуне и укрепляют свою власть над страной, их целью, по-видимому, является прекращение демократии и возвращение Бирмы к однопартийной военной диктатуре. Однако, возможно, еще не поздно действовать и предпринять попытку навести порядок в стране."
