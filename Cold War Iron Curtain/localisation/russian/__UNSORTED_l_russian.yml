 indonesia.1.d: "Our delegation has recently returned from the Indonesia Round Table held at the Hague. They have with them an agreement which offers Indonesia its independence from the Netherlands. Although the Dutch have had some successes on the battlefield, the conflict is far too expensive for them and the international pressure has hardened against their actions. Our own people have been fighting for years, first against the brutal Japanese occupation and now the Dutch, the sacrifices have been immense, and peace is now at hand. The discussions were very fruitful, but the delegation explained two issues emerged. One was the Dutch East India's national debt. We were not willing to take on the recent debt incurred as this would mean we are paying the Dutch for the war they waged on us, but the delegation assured us for just taking on a portion of the debt we can achieve freedom. The other issue is West Papua, from initially refusing to even discuss the topic, they eventually agreed to hold talks on its future within a year of our independence. The Netherlands parliament has already approved the agreement and once our legislature agrees we can finally move on to a new era of freedom for the people of Indonesia."
 indonesia.2.d: "The Indonesia Round Table Conference ended this week in the Netherlands. Indonesia will finally be handed sovereignty by the Dutch and achieve independence. This agreement marks the end of a violent colonial war which saw the Dutch attempting to re-establish colonial rule over its former colonies after being driven out by the Imperial Japanese Army during World War II. A loose band of Indonesian resistance fighters, many secular supporters of a republic, fought together against the Dutch who faced increased international criticism for its efforts to reimpose colonial rule. The Indonesian Round Table came about after several other major conferences and at a time where the Dutch face even heavier international pressure, while the Indonesian fighters struggle to deal with a population increasingly war-weary. Although the conference ended in success, there were two major stumbling blocks, the Dutch East India debt and West Papua. With encouragement from the United States, the Indonesians agreed to take on some of the debt and the Netherlands agreed to a rapid military withdrawal. In regard to West Papua, the Netherlands initially refused to discuss it but eventually agreed to hold talks on its future within a year of Indonesia's independence. The Dutch parliament has approved the agreement and it is expected the Indonesian representatives will likewise get approval once they present the treaty to the acting Indonesian legislature. Indonesia's leader Sukarno was said to be elated by the prospect of seeing his country achieve freedom and an end to almost a decade of military conflict on the islands."
