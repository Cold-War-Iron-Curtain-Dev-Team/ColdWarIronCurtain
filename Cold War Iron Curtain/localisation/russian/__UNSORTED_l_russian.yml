 Aktion_Harpune.1.d: "С победой социал-демократов на выборах 1953 года в Западной Германии западные державы начали выражать все большую озабоченность по поводу примирительной позиции правительства в отношении Восточной Германии. Несмотря на окончание Сталинских записок, правительство Эриха Олленхауэра, как сообщается, предприняло несколько попыток возродить перспективу нейтрального воссоединения между двумя нациями. Будучи первоначально предложенным в качестве буферного государства, предполагающего вывод всех западных войск, западные державы настаивали на том, что оно будет невероятно подвержено советскому влиянию и эффективно действовать как еще одно российское государство - сателлит. Однако готовность СДПГ вступить в переговоры с восточными немцами явно возмутила Соединенные Штаты, поскольку западногерманские СМИ просочились в сообщения между Олленхауэром и Белым домом, содержащие подразумеваемую угрозу возобновления военной оккупации в случае дальнейшего отказа от сотрудничества. Однако в результате стремительной эскалации событий западногерманская столица Бонн была потрясена насильственным переворотом, организованным местными армейскими подразделениями против правительства Олленхауэра.В то время как город был поглощен боями в течение нескольких часов, широкая консервативная коалиция во главе с Генрихом Хелльвегом захватила власть в Бонне, казнив Олленхауэра и возглавив новое временное правительство, которое уже разорвало все связи с Восточным блоком. Правительство США быстро признало и объявило о своей поддержке нового режима Хелльвега, в то время как незначительные дипломатические протесты из Восточной Германии были отодвинуты на второй план. Поскольку коалиция состоит из бывших офицеров вермахта, консерваторов, монархистов и националистов, будущее молодой демократии теперь неопределенно, а бывшие связи СС многих членов коалиции ставятся под сомнение средствами массовой информации во всех западных демократиях. Однако это, по-видимому, не имело большого эффекта, и коалиция Хелльвега продолжает править Западной Германией фактически без сопротивления, в то время как его "Немецкая партия" уже началась."
 Aktion_Harpune.2.d: "С победой социал-демократов на выборах 1953 года в Западной Германии западные державы начали выражать все большую озабоченность по поводу примирительного отношения правительства к Восточной Германии. Несмотря на окончание Сталинских записок, правительство Эриха Олленхауэра, как сообщается, предприняло несколько попыток оживить перспективу нейтрального воссоединения. Будучи первоначально предложенным в качестве буферного государства, предполагающего выход из НАТО, западные державы настаивали на том, что оно будет невероятно подвержено советскому влиянию и будет эффективно действовать в качестве еще одного российского государства-клиента. Однако готовность СДПГ вступить в переговоры с восточными немцами явно возмутила Соединенные Штаты, поскольку западногерманские СМИ просочились в сообщения между Олленхауэром и Белым домом, содержащие подразумеваемую угрозу возобновления военной оккупации в случае дальнейшего отказа от сотрудничества. Однако в результате стремительной эскалации событий западногерманская столица Бонн была потрясена насильственным переворотом, организованным местными армейскими подразделениями против правительства Олленхауэра.В то время как город был поглощен боями в течение нескольких часов, теперь кажется, что силы во главе с бывшим полковником вермахта Вальтером Коппом захватили контроль над аппаратом правительства и вытеснили социал - демократов. Ссылаясь на изменническое предательство национальной безопасности, Копп приказал казнить Олленхауэра перед большой толпой в центре Бонна и был назначен главой временного правительства, которое уже подтвердило свою приверженность НАТО и разорвало все дипломатические связи с Восточным блоком. Соединенные Штаты поспешили официально признать новое правительство, в то время как международные СМИ уже высказывали озабоченность по поводу слухов о связях Коппа как с ЦРУ, так и с бывшими нацистскими группировками. Его новое правительство уже предприняло шаги, напоминающие приход Гитлера к власти в 1933 году, в то время как правительство США активно поддерживало все более диктаторский режим Коппа. Несмотря на формальный дипломатический протест Восточной Германии, теперь кажется, что Копп укрепил свой контроль над Западной Германией и посеял семена новой эпохи авторитаризма."
