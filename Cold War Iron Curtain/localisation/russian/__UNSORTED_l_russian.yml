 black_september_prelude.1.d: "Недавно Израиль начал операцию, направленную против сил Федаинов в Карамехе. В ходе последовавшего сражения иорданские и федаиновские силы оказали сопротивление израильской атаке. Израильтяне заявили, что достигли своих целей, в то время как палестинские и иорданские силы утверждали, что отбили израильтян. Хотя иорданцы в основном вели боевые действия, Федаины открыто заявили о своей заслуге. Иорданское правительство решило не оспаривать эти заявления. В результате Федаины приобрели популярность во всем арабском мире, и добровольцы хлынули в их ряды. В частном порядке иорданские военные обеспокоены тем, что вербовка в Федаинов отвлекает их от собственного набора."
 black_september_prelude.2.d: "Нападения федаинов на Израиль дорого обошлись, и они нанесли ответные удары по Иордании. Мы столкнулись с международным давлением, чтобы обуздать эти нападения. Внутри страны нападения на нашу территорию наносят ущерб нашему имиджу и влияют на нашу способность привлекать средства и развивать туризм. Мы приказали армии начать пресекать действия федаинов, когда они совершают нападения через границу. Палестинцы и арабы осуждают правительство за его репрессии. Многие группы федаинов находят способы обойти армию и продолжить свои атаки. Многие из них теперь устраивают более драматичные нападения, чтобы привлечь внимание и увеличить число новобранцев."
 black_september_prelude.3.d: "В ходе недавней операции Иорданская армия начала репрессии против группировки федаинов под названием Аль-Наср. Аль-Наср не слишком популярна из-за недавних операций, в которых они нападали на полицейские заставы Иордании. Иорданское правительство придает огласке это событие и свою жесткую линию, чтобы продемонстрировать свою власть и показать пример. Король надеется, что операция против Аль-Наср поможет восстановить контроль над группировками федаинов и укрепить доверие к правительству. Многие иорданцы все больше разочаровываются тем, что федаины действуют как государство в государстве, и тем, как эти группы провоцируют жестокие израильские репрессии, в результате которых часто страдают мирные иорданские граждане."
 black_september_prelude.4.d: "Король Иордании Хусейн и ООП недавно заключили соглашение из семи пунктов. Оно узаконивает военизированные формирования ООП, известные как федаины, на территории Иордании и ограничивает незаконные действия федаинов по отношению к правительству. Федаины соглашаются прекратить передвигаться по иорданским городам вооруженными и в униформе. Им также запрещено досматривать гражданские автомобили, и они должны хранить иорданские удостоверения личности вместе с регистрацией автомобиля. Хотя большинство групп ООП, похоже, готовы принять соглашение, некоторые из более ястребиных групп, как говорят, расстроены, и неясно, сможет ли главное руководство ООП сдерживать все группы."
 black_september_prelude.5.d: "Недавнее соглашение из семи пунктов, похоже, разваливается на части, поскольку ряд групп федаинов отказываются соблюдать его положения. В частности, Народный фронт освобождения Палестины (НФОП) продолжает направлять агрессивные патрули в столицу Иордании Амман. Эти боевики открыто носят оружие, преследуют мирных иорданцев, отказываются подчиняться армейским блокпостам и не имеют при себе надлежащих удостоверений личности. Король пока отказывается противостоять федаинам, так как не считает, что у него достаточно народной поддержки, чтобы действовать. НФОП и другие группы открыто осуждают короля как предателя арабского дела. Поддерживаемая Сирией группировка Ас-Сайка Федаин также участвует в этих провокационных действиях, что приводит к напряженности в отношениях между Амманом и Дамаском."
 black_september_prelude.6.d: "Король Хусейн недавно провел переговоры в Каире, где египетское правительство пообещало свою поддержку в обуздании групп федаинов, находящихся под его собственным влиянием. Ободренный, король вернулся и объявил эдикт из десяти пунктов. Среди новых правил — приказ о том, чтобы палестинские бойцы перестали открыто носить оружие или хранить его в деревнях, что провоцирует ответные рейды Израиля. Также запрещается проводить крупные собрания без предварительного разрешения правительства, чтобы пресечь антихуссейновские протесты. Многие группы федаинов гневно отреагировали на этот указ, в результате чего многие его положения были проигнорированы. Пытаясь сгладить нарастающую напряженность, король Хусейн сменил министра внутренних дел, который, по мнению федаинов, был настроен против палестинцев. Король должен действовать осторожно, поскольку Иордания в значительной степени зависит от иностранных субсидий от арабских государств, поддерживающих федаинов."
 black_september_prelude.7.d: ""
 black_september_prelude.8.d: "Недавнее столкновение между армейскими войсками и федаинами привело в ярость бронетанковое подразделение. Подразделение зарядило оружие и двинулось на штурм лагеря беженцев и находящихся в нем федаинов. Опасаясь, что такие действия могут привести к открытому конфликту с федаинами, король и некоторые военачальники на своих машинах помчались блокировать подразделение. Войска вернулись на свою базу только после того, как король лично призвал их вернуться. Король Хусейн избежал серьезного инцидента, но он все больше понимает, что его собственные военные все больше разочаровываются в федаинах."
 black_september_prelude.9.d: "В Зарке подразделения федаинов и армии вступили в бой друг с другом. Они обострились после покушения на начальника иорданской разведки. После посещения штаб-квартиры разведки король Хусейн обнаружил свой кортеж под огнем федаинов. Один из его охранников был убит, но король выжил. Разъяренный отряд бедуинов открыл артиллерийский огонь по нескольким близлежащим лагерям палестинских беженцев. Бои продолжались несколько дней, прежде чем Ясир Арафат и король Хусейн договорились о прекращении огня. Напряженность в Иордании достигла опасного уровня, и некоторые на Западе пишут статьи, в которых предупреждают, что король может не выжить."
 black_september_prelude.10.d: "Несмотря на недавнее соглашение о прекращении огня между королем Хусейном и Ясиром Арафатом, оно не было принято Народным фронтом освобождения Палестины (НФОП), который продолжал сражаться против иорданских войск. В результате серьезной эскалации конфликта группировка захватила почти шестьдесят иностранцев и удерживает их в заложниках в двух отелях. Группа утверждает, что если ее требования к иорданскому правительству не будут выполнены, она взорвет отели. Король Хусейн, как говорят, в ярости из-за этого последнего события, но пока продолжает проявлять сдержанность."
 black_september_prelude.11.d: "В ходе очередной эскалации Народный фронт освобождения Палестины (НФОП) провел ошеломляющую операцию. Они взяли в заложники три коммерческих самолета и удерживают их вместе с пассажирами и экипажем на взлетно-посадочной полосе в Аммане. Группа требует освобождения палестинских заключенных из европейских и израильских тюрем. Этот последний инцидент произошел всего через несколько дней после очередного покушения на иорданского короля. Король Хусейн и правительство Иордании, как говорят, крайне расстроены этой последней провокацией."
 black_september_prelude.12.d: "Недавняя акция Народного Фронта Освобождения Палестины (НФОП) по захвату в заложники трех гражданских самолетов возмутила многих в арабском мире. Многие, включая высокопоставленных членов ООП, как говорят, разочарованы этой группой и считают, что ее операция только вредит международному имиджу Палестины. Даже Ясир Арафат, как говорят, обеспокоен, но не может публично порвать с группой федаинов. Однако для короля Хусейна эта реакция на инцидент только укрепляет его позиции, поскольку многие теперь считают иорданское государство жертвой группировки."
 black_september_prelude.13.d: "Сняв заложников с трех самолетов и собрав мировые СМИ, Народный фронт освобождения Палестины (НФОП) затем взорвал самолеты. Драматические кадры и обстоятельства унизили короля Хусейна. Что еще более важно, этот акт обратил иорданскую общественность в значительной степени на сторону правительства. Многие теперь требуют принять меры, чтобы остановить действия федаинов, за которые они не несут никакой ответственности. Король Хусейн проведет совещание с высшим военным руководством, чтобы определить, какие меры следует предпринять."
 black_september.1.d: "Во время экстренного совещания между королем Хусейном и его высшими военными руководителями было решено, что федаины нетерпимы и с ними необходимо разобраться. Король Хусейн поинтересовался, как быстро военные смогут разгромить группировку и изгнать ее из иорданских городов. Генералы пообещали, что им понадобится всего три дня, чтобы разрешить конфликт. Получив эти заверения, король дал свое согласие, но предупредил, что затянувшаяся борьба может привести к более широкому конфликту и вмешательству региональных государств. На встрече король отправил правительство в отставку, назначив военное правительство под руководством пропалестинца Мухаммеда Дауда, чтобы дать понять, что операция не была антипалестинской, а представляла собой миссию по поддержанию правопорядка."
 black_september.2.d: "Иорданские танки ворвались в Амман, чтобы изгнать из города боевиков федаинов. Пока иорданские войска продвигались в Амман, другие иорданские военные подразделения атаковали силы федаинов в городах по всей Иордании. Крупные лагеря палестинских беженцев, часто являющиеся оперативными центрами сил федаинов, также подвергаются нападениям. Правительство объявило, что оно действует, чтобы восстановить порядок и остановить беззаконие, охватившее Иорданию в последние месяцы. Многие аналитики считают, что превосходство иорданцев в огневой мощи приведет их к победе, однако уже есть сообщения о дезертирстве некоторых иорданских солдат и офицеров в ряды федаинов. Высокопоставленные лидеры ООП осудили эту акцию и пообещали выступить единым фронтом против иорданской армии."
 black_september.3.d: "Новости о разгоне иорданцами федаинов вызвали уличные протесты и осуждение по всему арабскому миру. Многие обвиняют иорданцев в неизбирательном применении силы, включая артиллерию и танки, против палестинских гражданских лиц и борцов за свободу. Эта негативная огласка и уличные протесты оказывают давление на правительства арабских стран по всему региону, заставляя их действовать. Ожидается, что Египет созовет Чрезвычайный Саммит Лиги Арабских Государств, чтобы организовать ответные меры арабских стран, которые, вероятно, призовут к прекращению боевых действий и восстановлению нормальной жизни в Иордании."
 black_september.4.d: "Палестинцам в Иордании в настоящее время грозит уничтожение в руках иорданского правительства и их короля, который является западной марионеткой. Народ Сирии и палестинцы в Дамаске требуют действий. У нас есть Палестинские Вооруженные Силы, которым не терпится перебраться в Иорданию и создать безопасную зону для федаинов. Наши собственные военные командиры настаивают на том, что будет не так уж сложно перекрасить нашу технику в палестинский флаг и использовать ее для поддержки таких усилий. Мы должны решить, примем ли мы эстафету лидерства в этом вопросе и поможем нашим арабским братьям в Иордании, или позволим ситуации разрешиться сама собой."
 black_september.5.d: "Высшее военное командование в Иордании сообщило королю Хусейну, что операции против федаинов не продвигаются так, как планировалось изначально. Хотя они настаивают на том, что иорданская армия в конце концов добьется своего, они утверждают, что это займет больше времени, чем планировалось. Король выразил свое недовольство новостями и сообщениями о том, что в результате применения тяжелого оружия есть большие жертвы среди мирного населения. Армия отметила, что это прискорбно и является результатом того, что федаины скрываются и действуют среди гражданского населения. Король также осведомился о военных передвижениях вдоль сирийской границы. Его генералы сообщили ему, что они способны справиться не только с федаинами, но и с любой иностранной агрессией."
 black_september.6.d: "Поскольку появляется все больше сообщений о возможной сирийской интервенции и опасения, что армия борется с федаинами в некоторых районах, король Хусейн решил обратиться к главе пакистанской военной учебной миссии в Иордании, бригадному генералу Зия уль-Хаку. Он спросил Зию, может ли он и его миссия предоставить оперативное руководство для иорданских военных в это трудное время. Бригадный генерал Зия провел три года в Иордании и с пониманием относится к нашей ситуации, поскольку он воочию убедился в том, что федаины вышли из-под контроля. Он согласился оказать нам полную поддержку и планирует в ближайшее время посетить сирийскую границу. Благодаря большому опыту и высоким профессиональным стандартам этих офицеров, их поддержка будет очень полезна для нашего дела."
 black_september.7.d: "Самые большие опасения короля Хусейна оправдались, когда он получил сообщения о том, что сирийская армия пересекла границу с Иорданией. Сирийцы утверждают, что это палестинские бойцы, пришедшие на помощь своим братьям из федаинов, однако наблюдатели ясно видят, что это регулярные сирийские войска, замаскированные под палестинцев. Хотя военные уверены, что смогут справиться с этой угрозой, она отвлечет наши силы и, несомненно, продлит борьбу с федаинами. Другие государства региона, особенно Израиль и Ирак, внимательно следят за ситуацией."
 black_september.8.d: "После того как сирийские войска успешно пересекли границу и создали «безопасную зону» для федаинов на севере Иордании, ситуация для иорданского правительства быстро ухудшилась. Иорданские войска внезапно оказались растянуты, а из-за успеха федаинов многие солдаты перешли на сторону палестинцев. Руководители разведки сообщили королю Хусейну, что со временем дезертиров будет становиться все больше, а безопасность короля и его семьи не может быть гарантирована. Более того, они отметили, что боевые действия, скорее всего, приведут к затяжной гражданской войне. Король пришел к выводу, что ситуация постепенно меняется не в его пользу, и дальнейшее сопротивление может привести к окончательному подрыву его репутации. Официально передав власть военному правительству, король и его семья сели в самолет королевских ВВС и покинули страну. Военное правительство быстро обратилось к сирийцам и ООП с просьбой о прекращении огня."
 black_september.9.d: "Крупные сирийские силы попытались пересечь границу с Иорданией, чтобы помочь федаинам, которые в настоящее время сражаются против иорданского правительства. Хотя сирийцы утверждают, что эти силы — палестинские бойцы, надеющиеся помочь своим товарищам, очевидно, что это в основном сирийские регулярные войска с палестинскими знаками отличия. Несмотря на значительные силы и поддержку федаинов в Иордании, иорданским военным удалось разгромить эти силы и вытеснить их обратно в Сирию. Аналитики отмечают, что успех иорданских войск объясняется тем, что им удалось перехватить сирийцев до того, как они смогли соединиться с группами федаинов или занять прочные позиции в Иордании. Дамаск отрицает, что потерпел военное поражение, утверждая, что это палестинские силы потерпели поражение. И это несмотря на четкие изображения иорданских сил, позирующих с захваченной сирийской военной техникой вдоль границы."
 black_september.10.d: "Король Хусейн получил хорошие новости от своих военачальников. Сирийская интервенция была не только отбита, но и сопротивление отрядов федаинов окончательно сломалось. У этих отрядов заканчивались боеприпасы, или они были разочарованы неудачной сирийской операцией и превосходящей огневой мощью Иордании, с которой они столкнулись. Несколько крупных лагерей беженцев были зачищены от федаинов, и мы ожидаем, что вскоре они очистят всю страну. Федаины превратились в государство в государстве, которое угрожало иорданскому обществу, и теперь мир будет восстановлен в ближайшее время."
 black_september.11.d: "С тех пор как иорданские военные начали подавление федаинов, палестинские силы оказались в меньшинстве по всей стране. Во многих районах сопротивление федаинов распалось, однако некоторые группы федаинов сумели удержать свои позиции и оказать эффективное сопротивление. Однако в последние дни стало ясно, что арабский мир, скорее всего, не будет вмешиваться в борьбу с Иорданией, и федаины сражаются в одиночку. Это осознание подорвало боевой дух федаинов, и в последние часы иорданские военные сообщили, что захватили или вытеснили практически все силы федаинов из крупных городов. Операции еще не закончены, но, похоже, иорданское правительство скоро вернет себе контроль над палестинскими районами страны."
 black_september.12.d: "Поскольку король Хусейн планирует принять участие в саммите Лиги арабских государств в Каире, он объявил о назначении палестинца Ахмада Тукана на пост премьер-министра. Король поручил своему новому премьер-министру перевязать раны недавнего конфликта, поскольку иорданские войска, похоже, находятся на грани победы над федаинами. В заявлении для СМИ король Хусейн отметил, что его военные обнаружили сотни подземных баз ООП только в Аммане и задержали около 20 000 подозреваемых. Он похвалил иорданский народ и военных за то, что они вместе прошли через этот кризис, и призвал ООП прекратить кампанию насилия против иорданского государства."
 black_september.13.d: ""
 black_september.14.d: "Под огромным давлением со стороны других арабских государств король Иордании Хусейн подписал соглашение о прекращении огня с Ясиром Арафатом и ООП. Это положило конец открытой войне между иорданскими военными и боевиками ООП — федаинами. Федаины согласились уйти из городов и сосредоточиться на районах, расположенных вблизи израильской границы. Хотя Арафат и его союзники в Лиге арабских государств превозносили это соглашение как большой успех в предотвращении гражданской войны, в частном порядке он выразил облегчение, поскольку казалось, что силы федаинов вскоре будут уничтожены иорданскими военными. Для короля Хусейна прекращение огня означает окончание боевых действий и признание того, что его войска успешно разгромили силы федаинов. Ожидается, что лидеры двух стран продолжат переговоры в Аммане, чтобы заключить окончательное соглашение, которое положит конец конфликту."
 black_september.15.d: "Через несколько недель после начала боевых действий в Иордании между правительством страны и Федаинами обе стороны совместно подписали Амманское соглашение. В этом соглашении Федаины обещали признать суверенитет Иордании и прекратить носить униформу или открыто носить оружие в иорданских городах. Они также подтвердили свой уход из иорданских городов. Попытка ООП добиться от Иордании признания этой группы в качестве единственного представителя палестинского народа была отвергнута иорданским правительством. Это соглашение явно признает военную победу Иордании и слабые политические позиции ООП и Федаинов в стране. Хотя основные боевые действия прекратились, некоторые из более радикальных и просирийских групп Федаинов продолжают оказывать сопротивление и совершать нападения на иорданские войска, хотя эти силы не считаются угрозой для правительства."
 black_september.16.d: "Король Иордании Хусейн утвердил Васфи Таля на посту премьер-министра Иордании. Это стало последним признаком того, что ООП и федаины сильно ослабли после тяжелых боев в сентябре. Когда начались боевые действия, Хусейн назначил премьер-министром палестинца, но тот в самом начале боевых действий перебежал в Ливию. Его место занял хашимитский лоялист Телль, который умело руководил иорданским правительством в разгар боев и завоевал популярность среди иорданцев и военных благодаря своей приверженности восстановлению порядка. Во время недавних переговоров с Арафатом, Таль занимал бескомпромиссную жесткую позицию, требуя от ООП подчинения иорданскому правительству. Известие о его назначении на постоянную должность вызвало новые столкновения между теми группами федаинов, которые все еще сопротивляются, и иорданской армией. Таль пообещал выкорчевать всех предателей и антииорданские элементы в правительстве, СМИ и обществе."
 black_september.17.d: "Хотя большая часть боевых действий между Федаинами и иорданскими военными закончилась после подписания Амманского соглашения, некоторые группы Федаинов продолжают действовать вблизи городских районов. Недавно премьер-министр Иордании Васфи Телль потребовал от Федаинов покинуть свои базы Аджлун и Джараш, что, по их мнению, было нарушением предыдущих соглашений и угрозой государственному суверенитету. Федаины отказались, и после недельного военного наступления иорданские военные овладели территорией и взяли в плен несколько тысяч Федаинов. После этой победы премьер-министр Телль отметил, что порядок наконец-то восстановлен, а последние сопротивляющиеся группы Федаинов разгромлены. Около 500 боевиков Федаинов, по некоторым данным, бежали на север в Сирию. Король Хусейн похвалил вооруженные силы и правительство за искоренение беззакония по всей стране. Изгнание и операции теперь практически гарантируют, что у ООП не будет будущего в Иордании."
 black_september.18.d: "Премьер-министр Иордании Васфи Телль был зверски убит в каирском отеле «Шератон». Он был убит после того, как вернулся в отель после переговоров во время встречи Лиги Арабских Государств в городе. По сообщениям, в нападении участвовали четверо боевиков, один из которых в настоящее время находится под стражей в полиции. Телль был невероятно непопулярен среди ООП и арабов-федаинов по всему региону, но среди иорданских националистов его превозносили за лидерство во время Сентябрьского кризиса. Новая палестинская группировка, называющая себя «Организацией Черного Сентября», взяла на себя ответственность за убийство, утверждая, что на руках Телля кровь многих невинных палестинцев. В частности, они обвиняют Телля в том, что он лично руководил убийством высокопоставленного командира ООП во время Сентябрьских боев. Эта новая организация обещает, что будет продолжать преследовать и наказывать тех людей и государства, которые совершили преступления против народа Палестины."
 black_september.19.d: "Силы, которые мы поддержали для продвижения в Сирии, сумели разгромить марионеточные иорданские вооруженные силы и соединились с федаинами. Благодаря огневой мощи нашего тяжелого вооружения мы заняли доминирующее положение, поскольку группа «Баас Ас-Сайка Федаин» уже давно участвует в борьбе против Иордании. Наши успехи не только укрепили их поддержку среди палестинцев в Иордании, но они более чем готовы установить баасистский режим по сирийскому образцу на всей территории Иордании. Помимо создания арабской республики, мы можем попытаться захватить контроль над страной. Однако наша разведка предостерегает от такого подхода, указывая, что нам не хватает крупных сил в стране, и если соседние государства узнают об этом, то это, скорее всего, вызовет захват территории Иордании. Тем не менее, это может быть предпочтительнее, чем тратить усилия на поддержание государства-клиента."
 black_september.20.d: "Сирия попыталась тихо отправить оккупационные силы, чтобы обезопасить Иорданию, прежде чем ее соседи смогут отреагировать, однако некоторые группы федаинов, не связанные с Сирией, узнали об этом и начали нападения. Это привлекло внимание международного сообщества, и произошел крупный раздел Иордании. Сирия закрепила за собой ключевые территории на севере Иордании, однако израильтянам удалось захватить ключевые западные территории. Иракцы забрали себе восточную Иорданию, а саудиты — южную. Международные СМИ осуждают то, что они называют каннибализацией Иордании ее соседями, но, несмотря на это, в регионе сложился новый статус-кво."
 black_september.21.d: "Сегодня в Аммане Зухейр Мохсен, лидер просирийской партии ООП «Аль-Саика», провозгласил Иорданскую Арабскую Республику. «Аль-Саика» присоединилась к более радикальным группам в сопротивлении иорданскому правительству вплоть до Сентябрьского кризиса и получила большую выгоду от последовавшей Сирийской военной интервенции. По слухам, после сирийской интервенции в партию «Аль-Саика» в Иордании хлынули тысячи сирийских палестинцев. В то же время другие организации ООП были либо отодвинуты на второй план, либо вычищены. Члены бывшего Иорданского правительства либо бежали из страны, либо скрывались. В своем обращении Мохсен пообещал революцию Баас для Иордании и национальную преданность делу освобождения Палестины. Сирийское правительство поспешило похвалить новое правительство, однако другие государства региона хранили молчание. Западные страны и Израиль выразили обеспокоенность организацией, а один из Израильских министров назвал новое правительство откровенным Сирийским клиентом."
