 white_australia_policy_desc: "После образования Австралийской федерации в 1901 году парламентарии сочли необходимым создать национальный закон об иммиграции. Законопроект об ограничении иммиграции был одним из первых законопроектов, внесенных в новый парламент, и предлагал двойной подход к ограничению роста небелого населения. Закон вступил в силу 23 декабря 1901 года, формально представляя установление \"Политики белой Австралии\". Закон давал сотрудникам иммиграционной службы право заставлять любого неевропейского мигранта сдавать тест под диктовку из 50 слов. Первоначально это было дано на любом европейском языке, а после 1905 года - на любом предписанном языке.Небольшому числу мигрантов были выданы свидетельства об освобождении от прохождения теста, но часто освобожденные люди разлучались со своими друзьями и членами семьи, которые не прошли тест, и были депортированы.Введение двух сопутствующих актов (Закон о рабочих тихоокеанских островов 1901 года и Закон о почте и телеграфе 1901 года) еще больше ограничило доступ в Австралию для небелых мигрантов, объявив вне закона использование импортированной рабочей силы и обязав нанимать белых рабочих на любые суда, перевозящие австралийскую почту."
 Khruschev_SU.1.d: "Правящая рабочая партия Кореи (ТПК) управляет Северной Кореей с момента своего основания при Ким ир Сене. Однако сегодня ситуация изменилась, поскольку просоветская фракция внутри партии совершила успешный переворот. Ранее председателю Ким удавалось побеждать соперников из многих фракций партии или стравливать их друг с другом, сохраняя при этом свою собственную власть. Однако критика советским правительством культа личности и других проблем сделала председателя Кима уязвимым для осуждения. Просоветская фракция расценила эту публичную критику как возможность и замыслила осудить Кима на следующем пленарном заседании Центрального комитета Трудовой партии Кореи. Председатель Ким, обычно осведомленный о таких заговорах, не был подготовлен. На встрече просоветская фракция, работающая с несколькими другими фракциями, публично осудила председателя Кима, его сторонники не знали и не могли перекричать их. Нейтральные члены партии, которых Ким мог бы привлечь на свою сторону, если бы знал, были неуверенны и хранили молчание, позволяя обвинениям продолжаться. Ошеломленный председатель Ким не смог оказать эффективного сопротивления критике, и к концу сессии он был отстранен от должности. Новости распространялись медленно, поскольку новое просоветское правительство стремилось укрепить свой контроль, отстраняя от власти прокимских чиновников. Еще предстоит увидеть, как прокитайские группировки и китайское правительство отреагируют на это изменение. Однако Советский Союз, как говорят, рад возвращению Северной Кореи на правильный революционный путь. ТПК с нетерпением ожидает нового этапа в своем революционном развитии."
