 US_Mars.1.d: "In a nationally televised address from NASA headquarters, President Agnew declared the United States would land a man on Mars. The President noted that Americans are historically a people who always strive for the furthest frontiers. Mars will be the next great frontier. He added that America will need its brightest people working with brave men to achieve this undertaking. He noted the technology exists for a Mars mission, but it will be NASA who must successfully utilize the technology for the mission. The response to the speech was strongly felt by younger Americans, excited for a noble mission. However, some in the media continue to point out such expensive space missions will drain government resources from more pressing issues."
 US_Mars.2.d: "President Agnew's request to congress regarding a major expansion of funds for NASA was recently approved. This is considered a huge victory for the President. During the previous administration, President Agnew had chaired the Space Task Group to consider the next phase of American space exploration and development. Now that he occupies the Oval Office, he can begin to implement those recommendations. The first step of drastically increasing the NASA budget has been achieved. Although the President is quite dedicated to his space ambitions, there are many in Congress and across the country who question whether the United States should engage in expensive space projects with so many other issues facing the nation"
 US_Mars.3.d: "Millions of Americans were glued to television sets across the nation as audio transmitted from Mars indicating a successful landing on Mars. The dangerous mission had only been possible by the efforts of President Agnew to ensure the American space program remained a priority for the United States. After the transmission, the President addressed the nation, heaping praise on the astronauts and NASA for achieving the goal of a Mars landing. He also noted with this success, America has established itself as the clear premier space power on the planet. Members of the media who had constantly ridiculed the space mission for being too expensive were notably congratulatory to the achievement of NASA and the President."
 US_Mars.4.d: "When NASA proposed its Integrated Program Plan (IPP), many in Washington expected the President to reject it as unfeasible considering its expenses. However, President Agnew was convinced and pledged full support for the ambitious NASA plans. The Integrated Program Plan hopes to establish space stations, bases on the Moon and Mars eventually. It also calls for the building of specialized satellites and a new reusable space shuttle that will aid in building the vast space infrastructure involved in the plan. NASA and the scientific community reacted very favorably to the news, many seeing it as the foundation for a new technological revolution. However, members of Congress and the media are already referring to the IPP as a financial folly."
