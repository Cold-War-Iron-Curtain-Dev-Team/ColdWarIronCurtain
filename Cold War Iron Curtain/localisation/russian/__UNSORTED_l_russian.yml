 DOMESTIC_OP_2_DESC_1: "Агенты будут выбраны из числа тех, кто знаком со страной [GetDisidentNameText] для операции против группы. Дискретность - ключевой момент, так как мы не можем рисковать тем, что страна [GetDisidentNameText] узнает о рейде заранее."
 DOMESTIC_OP_2_DESC_2: "Они будут хорошо вооружены и отправлены из ближайшего убежища, чтобы сократить время в пути. После их ухода убежище будет очищено от всех связей. Как только агенты прибудут, они будут искать любые улики, какими бы незначительными они ни были."
 DOMESTIC_OP_2_DESC_3: "Агенты будут возвращены в безопасное место. Если все пойдет по плану, несколько членов организации будут арестованы и возвращены вместе с извлеченными оперативниками."
  
  
