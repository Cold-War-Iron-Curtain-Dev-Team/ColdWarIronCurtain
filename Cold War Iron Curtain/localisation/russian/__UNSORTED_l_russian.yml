 Iran60.1.d: "Недавно Шах обнародовал планы программы реформ из двенадцати пунктов, которую он назвал Белой революцией. Недавно она была одобрена на национальном референдуме. Программа включает реформы в области прав трудящихся, индустриализации, земельной реформы и социального развития. Земельная реформа и новый Корпус грамотности являются одними из наиболее важных элементов для Шаха. Земельная реформа направлена на то, чтобы сделать земли продуктивными и избавиться от власти отсутствующих землевладельцев. Корпус грамотности будет состоять из призывников, которые во время службы будут обучать грамоте жителей сельской местности. Улучшение образования в сельской местности способствует модернизации, нарушая традиционные нормы и уменьшая влияние духовенства. Амбициозная программа направлена на превращение Ирана в современное, образованное и промышленно развитое государство. Однако критики отмечают, что амбициозную программу может быть трудно реализовать даже при большом финансировании. Кроме того, они указывают, что шах не осознает, что такие радикальные реформы, проводимые при сохранении абсолютной монархии, могут привести к будущим политическим волнениям."
 Iran60.10.d: "После отбытия срока одиночного заключения в военной тюрьме бывший премьер-министр Ирана Мохаммад Мосаддык был отправлен под домашний арест в семейный дом в Ахмадабаде. Во время вынесения приговора непокорный конституционалист заявил, что вердикт укрепил его наследие. Мосаддык многими рассматривается как патриотический защитник национального суверенитета. Эта популярность, вероятно, спасла его от казни после ареста. С победой Национального фронта на недавних выборах они объявили о немедленном освобождении Мохаммада Мосаддыка и восхваляли его неугасающую преданность конституционализму в Иране. Национальный фронт вернул своего лидера."
 Clerical_Opposition.1.d: "Напряжение между шахом и шиитским духовенством усилилось с момента объявления Белой революции. Многие представители духовенства видят в реформах и модернизации попытки подорвать ислам и ограничить их собственное влияние. Одним из самых откровенных критиков был аятолла Рухолла Хомейни, который произнес особенно резкую проповедь, осуждающую шаха и, как утверждается, назвал его жалким и несчастным человеком. Иранские власти вскоре арестовали Хомейни и отправили его в Тегеран. Это вызвало тысячи гневных протестов, приведших к жестоким столкновениям, в ходе которых военные открыли огонь по толпе. Через неделю насилие наконец удалось взять под контроль. Хотя некоторые в режиме хотели казнить Хомейни, уровень насилия, вспыхнувшего после его ареста, вынудил режим временно оставить его в тюрьме."
 Iran60.5.d: "Шах Ирана недавно завершил пышное празднование 2500-летия Персидской империи. Торжества прошли в древнем городе Персеполь. Помимо улучшения местной инфраструктуры для мероприятия, сам Персеполь был заполнен роскошными шатрами, воссоздающими облик города двухтысячелетней давности. Во время празднования Шах отдал дань уважения гробнице Кира, восхваляя его как первого в истории защитника прав человека. Он стремился подчеркнуть не только историческое наследие, но и современные преобразования Ирана. В рамках мероприятий были проведены два роскошных банкета. Кроме того, гости наблюдали парад более тысячи иранских солдат, одетых в костюмы разных эпох, чтобы продемонстрировать мощь персидской армии на протяжении веков. Пышное мероприятие обошлось почти в двадцать миллионов долларов, и хотя международная пресса и многие иранцы хвалили его как демонстрацию иранской культуры и современности, некоторые иранские священнослужители осудили чрезмерные затраты."
 Iran60.6.d: "Со времен Сефевидов зороастрийская община в Иране сталкивалась с постоянными преследованиями. Однако Шах Ирана недавно предпринял усилия, чтобы подчеркнуть историческую роль, которую зороастрийская вера сыграла в формировании персидской идентичности. Действительно, многие иранские националисты теперь рассматривают зороастрийцев как важный символ иранской идентичности и связующее звено, которое удерживало нацию вместе до прихода ислама. Этот новый акцент на зороастрийском наследии вызывает подозрения у иранского духовенства. Наблюдатели отмечают, что шах подчеркивает доисламскую историю и символы национального единства как способ формирования иранской идентичности, независимой от ислама."
 Cyrus.1.d: "С самого начала своего правления Шах Ирана поощрял и способствовал созданию образа Кира Великого. Правительство и его сторонники восхваляют Кира и проводят параллели между его правлением и реформами с нынешним Шахом. Недавно завершившееся празднование Персидской империи было организовано вокруг визита Шаха к гробнице Кира, где он, как утверждается, сказал ему, что Иран пробудился ото сна. Проводя линию между Киром Великим и Шахом, которого его сторонники называют \"Киром сегодняшнего дня\", Шаху удается проводить реформы без зависимости от традиционных источников легитимности, таких как шиитский ислам и духовенство"
 Lebanon_Crisis.0.d: "Президент Камиль Шамун предложил Национальному собранию внести поправки в конституцию и позволить ему баллотироваться на второй срок. Это предложение угрожает хрупкой ливанской политической системе. Конституция 1926 года удерживала глубоко сектантскую нацию вместе, но основывается на разделении власти между различными конфессиональными группами. Многие опасаются, что если Шамун останется у власти, он укрепит свои политические позиции и нарушит баланс в пользу маронитов-христиан. Основной проблемой являются трудности, с которыми Шамун сталкивается при взаимодействии с другими религиозными фракциями. С момента его прихода к власти сменилось несколько премьер-министров, многие из которых продержались менее года. Как страна отреагирует на это последнее заявление и усилия, пока остается неизвестным."
 Lebanon_Crisis.1.d: "За последние годы напряженность между маронитами-христианами и мусульманами значительно возросла. Маронитский президент Камиль Шамун все больше придерживается прозападной линии и избегает ассоциаций с растущими арабскими националистическими настроениями, охватившими арабский мир. Ливанские мусульмане, в частности, поддерживают арабский национализм, но марониты остаются твердо преданными поддержанию связей с Европой и Западом. Недавний Синайский кризис перерос в политический кризис в Ливане. Ливанские мусульмане начали протестовать против Шамуна, который отказался разорвать связи с западными государствами. Протестующие также требуют, чтобы Ливан присоединился к Объединенной Арабской Республике и держался подальше от Багдадского пакта, к которому Шамун выразил интерес в присоединении. По мере роста напряженности возникают опасения, что Ливан вскоре может столкнуться с арабской националистической революцией с целью свержения правительства. Отчаявшийся президент Шамун обратился за помощью к ООН, а после их отказа он попросил помощи у Соединенных Штатов."
 Lebanon_Crisis.2.d: "Президент Ливана Камиль Шамун официально обратился к Соединенным Штатам с просьбой вмешаться в нынешний политический кризис, охвативший Ливан. Шамун считает, что Объединенная Арабская Республика (ОАР) использует своих сторонников в Ливане для подрыва правительства и его свержения. Ливан управляется в соответствии с Конституцией 1926 года, которая обеспечивает хрупкий баланс между различными ливанскими конфессиональными группами. Наши аналитики указывают, что переворот САР может вызвать нестабильность и привести к гражданской войне между христианами-маронитами и мусульманами. Экспансия САР в Ливан также подорвет баланс сил в регионе и может спровоцировать израильтян, потенциально превратив кризис в региональную войну. Другие утверждают, что интервенция ослабит американские силы, подорвет наше положение среди арабов и откроет путь для советского влияния в регионе. Мы можем либо не вмешиваться, либо вмешаться и сохранить нынешнюю политическую систему Ливана."
 Lebanon_Crisis.3.d: "Американское правительство начало операцию \"Голубая летучая мышь\", чтобы восстановить порядок в Ливане и защитить свое правительство от коммунистической подрывной деятельности. Американские войска вошли в Ливан через аэропорт Бейрута, а морские пехотинцы прибыли с берега. Силы были полностью поддержаны ливанским правительством и быстро стабилизировали ситуацию, установив контроль над Бейрутом и всеми маршрутами, ведущими в столицу. Американское правительство также направило высокопоставленного дипломата для наблюдения за политической ситуацией. К тому времени, когда кризис миновал, американские войска начали мирный вывод из страны. Кроме того, президент Ливана Камиль Шамун пообещал, что не будет изменять конституцию 1926 года, чтобы баллотироваться на второй срок. Интервенция преуспела в достижении своих целей по сохранению правительства и политической системы в неприкосновенности. Успех в Ливане побудил многих в Вашингтоне рассмотреть возможность аналогичного военного развертывания в будущем для сохранения американских интересов."
 Lebanon_Crisis.4.d: "Правительство Соединенных Штатов последовало примеру ООН и решило не вмешиваться в течение текущего политического кризиса. Через несколько дней протестующие, выступающие за Объединенную Арабскую Республику (ОАР), подняли восстание в Бейруте. Когда армия была развернута, многие офицеры и солдаты присоединились к протестующим. Несколько часов спустя правительство Ливана было свергнуто, и комитет офицеров и политиков арабских националистов объявили о формировании нового правящего совета. Затем они объявили о своём предложении подчиниться воле ливанского народа и обратились с просьбой о союзе с САР. САР быстро согласились, и высокопоставленные чиновники САР вылетели, чтобы начать интеграцию Ливана. Говорят, что ливанские христиане-марониты обеспокоены, и в то время как многие рассматривают возможность бегства в Европу, другие готовятся к возможности военной интервенции. Ливанская революция широко восхваляется по всём арабском мире, но Израиль выразил свою озабоченность этими событиями."
 LEB_NAKBA.1.d: "С начала палестинской войны в 1947 году многочисленные группы палестинских беженцев проживают по всей южной части Ливана. Местные ливанские владельцы бизнеса утверждают, что подверглись нападению со стороны некоторых палестинцев, в то время как другие в целом считают, что беженцы лишают местное ливанское население возможностей трудоустройства. Многие палестинские беженцы, из которых христиане, ищут убежища в стране многих религий. Хотя ливанские власти в Бейруте еще не признали потребности или просьбы о предоставлении гражданства многих беженцев в регионе, отношения между палестинцами и коренными ливанцами находятся в напряжении. По мере того как все больше беженцев и просителей убежища устремляются к границам Ливана из Палестины, отношения между государствами могут испортиться в недалеком будущем."
 LEB_ISR.1.d: "С момента основания национального государства Израиль в 1948 году Лига арабских государств, состоящая из Египта, Сирии, Трансиордании, Ирака и Ливана, выражала огромный протест по поводу раздела Палестины Великобританией и западными державами. Твердо настроенные на создание арабского палестинского государства, члены Лиги арабских государств единогласно решили, что объявление войны государству Израиль было оправдано. Ожидая быстрой победы, относительно небольшая ливанская армия наряду с более крупными силами Лиги арабских государств поначалу добились успеха. Вскоре ливанцы были отброшены к своим довоенным границам, где израильские войска начали оккупацию южной части Ливана. С подписанием перемирия еще в марте 1949 года было подписано официальное прекращение огня между государством Израиль и Ливаном. Остается единственный вопрос, как долго это продлится..."
 Lebanon_Pol.3.d: "В настоящее время в 20:00 вечера в Бейруте, Ливан, где многочисленные официальные лица режима заявили, что составные части правящего режима Хоури рухнули сами по себе. Президент Ливана Бешара Эль-Кури, печально известный своими сильными националистическими взглядами и антифранцузскими настроениями в 1940-х годах. Известный введением законодательства, направленного на уравнивание христианских и мусульманских меньшинств в отношении культурных прав, режим Кури вызывал большие споры. Первоначальные краткосрочные разведданные ЦРУ предполагают, что политическая оппозиция, частично подстрекаемая событиями в Египте, возобновила планы по свержению президентского режима. Многие диссиденты и те, кто выступает против режима Кури, обратились к правительствам Франции и США за помощью в возможном свержении президента, будь то политическими или военными средствами. Официальные лица Пентагона еще не ответили официальным заявлением на предполагаемые запросы."
 Lebanon_Pol.4.d: "Недавно подписанный Багдадский пакт 1955 года только что заручился поддержкой ливанского правительства. Из пяти нынешних членов — Ирака, Ирана, Пакистана, Турции и Соединенного Королевства — Ливан станет шестой страной, подписавшей соглашение о вступлении в военный альянс. Созданный по образцу НАТО, пакт направлен на обеспечение взаимного сотрудничества и защиты между каждой нацией. Это гарантия, которой на Ближнем Востоке не существовало бы всего несколько десятилетий назад. Похоже, члены пакта приветствовали государство Ливан с распростертыми объятиями, с этого момента блок становится только сильнее."
 Lebanon_Pol.5.d: "Когда соседние государства, такие как Сирия на востоке и Израиль на юге, кажутся, что Ливан явно борется за сохранение абсолютной независимости влияния от своих соседей в регионе. Хотя кажется, что Египет, даже физически не граничащий с Ливаном, потряс ближний Восток радикальными взглядами, ставящими под угрозу статус-кво. Египет стал главным пропагандистом идеалов панарабизма, популярность этой идеи распространилась по всему Ближнему Востоку и Северной Африке. В связи с этой растущей угрозой правительство Ливана открыто осудило как египетское, так и общеарабское движения как дестабилизирующую силу в регионе. Несомненно, правительство Ливана отвергло эти идеалы, и в ближайшее время поддержка не изменится."
 SSNP_Focus.2.d: "Печально известному основателю ССНП, политическому деятелю и философу Антуану Сааде вчера вечером удалось сбежать из ливанской тюрьмы. Ранее приговоренный к смертной казни, Сааде был схвачен и арестован 3 года назад во время возвращения в Ливан из Франции, когда страна получила независимость. В ответ на единственную революционную речь ливанские власти выдали ордер на арест социалиста. После жестоких провокационных протестов, в конечном итоге переросших в восстание, Сааде удалось бежать из Ливана в Дамаск. Состоялась встреча с президентом Сирии Хусни аз-Заимом, пообещавшим поддержать Сааде. При таком повороте событий президент аз-Заим вернул Сааде ливанским властям, после чего в Ливане состоялся судебный процесс в военном трибунале. Оказывается, пока он ожидал казни в камере предварительного заключения, тюремных охранников нигде не было видно, что позволило беглецу быстро и легко сбежать. В очередной раз социалист-революционер поторопился с выводами, без сомнения продолжая проповедовать свои социалистические взгляды в будущем."
 SSNP_Focus.1.d: "Печально известный основатель ССНП, политический деятель и философ Антун Сааде был казнен сегодня утром расстрельной командой. Ранее приговоренный к смертной казни, Сааде был схвачен и арестован 3 года назад во время возвращения в Ливан из Франции, когда страна получила независимость. В ответ на единственную революционную речь ливанские власти выдали ордер на арест социалиста. После жестоких провокационных протестов, в конечном итоге переросших в восстание, Сааде удалось бежать из Бейрута в Дамаск. Состоялась встреча с президентом Сирии Хусни аз-Заимом, пообещавшим поддержать Сааде. При таком повороте событий президент аз-Заим вернул Сааде ливанским властям. После суда военного трибунала в Ливане, приговорившего его к смертной казни, серия социалистических проповедей Сааде в Ливане и Леванте наконец завершилась."
 Lebanon_Pol.1.d: "После прихода к власти христианского политического руководства в Ливане произошло ожидаемое увольнение арабских политиков и лидеров. Христиане в Ливане присутствовали в регионе с первого века, с ростом доли ислама в религиозной демографии и миграцией арабов в регион. С прохристианским руководством в Ливане будущее новых арабских политиков и законодателей было остановлено на своем пути."
 Lebanon_Pol.2.d: "С приходом к власти христианского политического руководства в Ливане произошло неожиданное увольнение премьер-министра Рияда Аль-Солха. Семья Рияда, родившегося в Сидоне, городе на юге Ливана, была богатыми землевладельцами-суннитами египетского и палестинского происхождения. Избранный президентом Ливана Аль-Хоури на пост премьер-министра, срок полномочий Солха ознаменовался подписанием Национального пакта Ливана, иначе известного как рамки объединения народов Ливана. Его лояльность Ливану была под вопросом из-за его культурных связей с Палестиной и родовых корней в Египте. С ростом христианской политической сцены в Ливане Сольх был самой крупной мишенью для его оппозиции."
 LEB_Assasination.1.d: "Поступающие из Бейрута сообщения свидетельствуют о том, что вооруженный мятеж социалистов левого толка вышел на улицы после убийства журналиста левого толка Насиба Аль-Матни. Аль-Матни был откровенным критиком ливанского правительства и позитивным представителем левосоциалистического подполья Бейрута и Ливана в целом. Учитывая, что нынешний политический климат Ливана, мягко говоря, нестабилен, о тотальной гражданской войне даже близко не может быть и речи. Смерть этого поляризационного журналиста определенно вскружит головы его верным и набожным читателям."
 SSNP_Focus.15.d: "Наконец-то сирийский народ Ливана восстал против репрессивного режима в сотрудничестве с ССНП. В объявлениях, транслируемых как по телевидению, так и по радио, ливанские сирийцы объявили о роспуске ливанского государства, правительства и авторитетного органа. Далее произойдет политическое слияние двух наций. Ни в каких заявлениях ССНП не озвучивалась какая-либо позиция по поводу находящихся в настоящее время на службе ливанских политических деятелей или их гарантированной безопасности. Казалось бы, незначительное движение всего три года назад свергло одну из самых стабильных демократий Ближнего Востока."
