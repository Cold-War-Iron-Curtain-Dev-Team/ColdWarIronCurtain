 CRO_insurgency_options.0.d: "На поздних этапах Второй мировой войны так называемое государство Хорватия и их фашистские хозяева в Берлине создали отряды партизан, называемых крестоносцами, чтобы действовать против наших освободительных сил. Многие из их командиров и бойцов — бывшие члены фашистского режима, и хотя они мало что сделали во время войны, они недавно активизировались. Крестоносцы пытаются заручиться поддержкой, особенно среди антиреволюционных сил, хорватских националистов и католиков, чтобы восстановить свой незаконный режим. Они обвиняют нас в том, что мы угнетатели и антихорваты. Однако мы покажем им, что их идеология и претензии не имеют никакого влияния на наш народ, который продолжает поддерживать правительство и нашу революцию. Все народы Югославии, особенно хорваты, признают гнусную ложь, распространяемую крестоносцами."
 CRO_insurgency_options.10.d: "Крестоносцы надеялись использовать террористическую тактику и фашистскую пропаганду, чтобы убедить хорватский народ присоединиться к ним и восстановить хорватское правительство. Тем не менее народ не мог быть обманут, и их отсутствие поддержки гарантировало, что эти вражеские истребители стали легкой мишенью для наших сил. Они пытались подражать нашей военной тактике, но это была бледная имитация, и наше знание такой тактики делало их легко покоряемыми. Когда сдадутся последние отряды крестоносцев, мы воспользуемся этой победой для дальнейшего укрепления партии, расправившись с католической церковью и другими организаторами, которые явно симпатизировали крестоносцам. Наша победа и тесное сотрудничество с хорватским населением будут способствовать тому, что восстановленное югославское государство объединит все свои народы в единое целое."
 CRO_insurgency_options.11.d: ""
 CRO_insurgency_options.3.d: "После сообщений о действиях крестоносцев в этом районе одно из наших подразделений установило вероятное местонахождение вражеских истребителей. Этот анализ оказался точным, так как был идентифицирован вражеский фермерский дом. Во время рейда наши войска штурмовали ферму, захватив и убив крестоносцев, находившихся внутри, без потерь. Вражеское оружие и припасы были захвачены. Судя по всему, эта группа бойцов перебралась жить к местным горожанам, но не нашла большой поддержки в их деятельности. Эта победа поднимет боевой дух наших людей и покажет народу, что мы сражаемся за них, а не против них."
 CRO_insurgency_options.4.d: "Наши войска получили донесения о местонахождении группы боевиков «Крестоносцев», проводивших диверсионные операции в этом районе. Они проследили их до жилого комплекса. Когда наши войска ворвались внутрь, они применили агрессивную силу и захватили здание. Однако оказалось, что крестоносцы уже бежали, и вместо этого жители комплекса были задержаны и подвергнуты агрессивным обыскам. Никаких документов, оружия или улик обнаружено не было, и местные жители в городе возмущены нашими действиями. Эта провалившаяся операция только подорвала имидж наших сил в АРЕ и усилила пропаганду нашего врага."
 CRO_insurgency_options.5.d: ""
 CRO_insurgency_options.6.d: ""
 CRO_insurgency_options.1.d: ""
 CRO_insurgency_options.2.d: "Крестоносцы являются преемниками нацистских коллаборационистов и жестоких фашистов. Наши разведывательные операции времен войны дают нам список бывших коллаборационистов и сочувствующих хорватским националистам. В ходе недавней операции наши разведчики завербовали некоторых из этих фигур и пригрозили раскрыть их сотрудничество с иностранными оккупантами в военное время, чтобы заставить их присоединиться к ячейкам крестоносцев и снабжать нас информацией. Крестоносцы очень подозрительно относятся к чужакам, но доверяют своим сторонникам в военное время. Хотя операция была тщательно спланирована, завербованные люди оказались настоящими предателями. Информация, которую они нам предоставили, в конечном итоге привела наших людей к погоне за дикими гусями и позволила им проводить диверсионные операции. Они также заставили наших людей оказаться в компрометирующих ситуациях, что нанесло ущерб популярности нашего правительства среди народа. Попытки поймать и наказать этих предателей пока не увенчались успехом."
 YANSA.100.d: "На протяжении почти тысячелетия народ шан в Восточной Бирме представлял собой смесь бирманской, тайской и лаосской культур. История государства Шан была разбросана по векам, в основном из-за сильных споров между традиционными бирманскими королевствами, тайскими захватчиками и самим королевством Шан. В последнее десятилетие британское правление в Бирме было дезориентировано из-за японских операций во время войны, что, похоже, положило конец правильно организованному колониальному управлению страной. Наконец-то государство, которое практически полтора века было вымершим, возродилось. Единственный вопрос, который остается... Надолго ли?"
 Collapse_Burma.1.d: "Бирма, одна из великих мистических земель востока, находившаяся под властью британцев с 1824 года, наконец-то увидела отблеск независимости. Колония Бирма получила известность благодаря решению не включать регион в состав Британской империи, а организовать его народы в отдельное бирманское колониальное государство. Британское владычество над Бирмой (известное как «Бирманский Офис»), наконец, казалось, подошло к концу. Сочетание внутренних и внешних факторов повлияло на колонию и администраторов. Официальное Союзное Государство Бирма объявило о своем создании, торжественно подняв государственный флаг новой молодой республики. Интересно, что молодое государство не проявило интереса к вступлению в Содружество в качестве официального члена этой организации, что является редкостью среди бывших колоний Великобритании."
 YANSA.200.d: ""
 YANSA.101.d: "Правительство Китайской Республики (ныне расположенное на острове Тайвань) в изгнании вместе с США согласилось поддержать создание ЮААНС, партизанских остатков сил Гоминьдана в изгнании, находившихся в Юньнани во время гражданской войны в Китае. ЮААНС (Юньнаньская Антикоммунистическая Армия Национального Спасения) продолжает сражаться с многочисленными группами бирманских сил безопасности в штате Шань, где находились очаги оккупации боевиков Гоминьдана. Учитывая многочисленные просьбы бирманского правительства вывести эти контингенты Гоминьдана из страны, территория ЮААНС будет служить небольшим буфером между Шан и взволнованной тайской границей."
 SS_HAITEN.1.d: "В ходе подготовки операции «Земля» и ее материально-технического обеспечения по морю лидеры Гоминьдана на Тайване и организаторы партизанского движения Гоминьдана встретились в Тайбэе, чтобы обсудить планирование. Операция предусматривала доставку многочисленных партий вооружения и оборудования на побережье Тенассерима в Бирме. Кроме того, ветераны КНА должны были направиться в лагеря Гоминьдана для обучения и вооружения партизан. Согласно плану, эти силы в идеале должны были обеспечить безопасность коридора на побережье, продвигаясь в государство Шан. Фиаско началось, когда команда корабля (SS Haitien) не смогла связаться с кем-либо на берегу, в результате чего с корабля был построен импровизированный небольшой деревянный пирс. Неудачи продолжились, когда офицеры корабля не смогли получить никаких сообщений от командования Гоминьдана. Операция обернулась фиаско, и Тайвань снова оказался в центре внимания мировой общественности."
 SS_HAITEN.2.d: "Казавшаяся идеальной операция по пополнению запасов и вооружению партизан Гоминьдана в Шанской области Бирмы, проведенная тайваньскими чиновниками Гоминьдана, была осуществлена. Операция состояла в том, что многочисленные партии оружия и снаряжения должны были прибыть на побережье Тенассерима в Бирме. Кроме того, ветераны КНА должны были направиться в лагеря Гоминьдана для обучения и вооружения партизан. Согласно плану, эти силы в идеале должны были обеспечить безопасность коридора на побережье, продвигаясь в государство Шан. Корабль SS Haitien, назначенный Гоминьданом под личным руководством Чан Кайши, отправился в Бирму. По прибытии на побережье небольшой контингент войск Гоминьдана Яньсу ожидал команду, чтобы сойти на пляжи. Оттуда тайваньские офицеры вместе с ветеранами Гоминьдана направились в лагеря Яньсу."
 Operation_Heaven.2.d: "С момента существования независимого Бирманского государства остатки юньнаньско-китайских гоминьдановских армий, отступивших к бирманской границе, существовали в государстве с начала 50-х годов. США поддерживали оставшиеся в Бирме группы Гоминьдана со времен великого отступления, надеясь сдержать бирманское правительство с помощью влияния Гоминьдана. В 1953 году государство Бирма обратилось в Организацию Объединенных Наций с просьбой оказать давление на Китайскую Республику (Тайвань) с целью устранения различных групп влияния Гоминьдана, рассеянных на северо-востоке страны. Сейчас осталось лишь несколько групп Гоминьдана..."
 KMT_BURMA.11.d: ""
 Shan_Recognition.1.d: "Исторические связи между различными тайскими королевствами и шанскими народами в прошлые века оставили уникальное чувство родства в регионе. Решение тайского правительства официально признать независимость государства Шан от недавно разделенного Союза Мьянмы вызвало много разногласий между двумя соседями. Можно ожидать, что военная и экономическая помощь из Таиланда вскоре поступит в независимое государство Шан, народы которого оторваны от остального мира. Признание Таиландом независимого государства Шан может привести к нарушению баланса сил между Бирмой и Таиландом, что в будущем приведет к напряженным разногласиям между двумя заинтересованными странами."
 Integrate_The_SSNP: "Интегрируйте ССНП"
 SSNP_Insurgency_Decisions: "Мятеж Сирийской Социал-националистической партии"
 SSNP_Insurgency_Decisions_desc: "Сирийская социал-националистическая партия (ССНП) выступает за Великую Сирию и объединение всех арабов плодородного полумесяца. Она отвергает нынешние границы Ливана как конструкцию колониализма и выступает за ассоциацию с Сирией и сохранение исторической и культурной самобытности народа. Группа угрожает существованию Ливана и предлагает привлекательную идеологию для многих ливанцев. Однако правительство работает над расколом группировки, поскольку это угрожает хрупкому политическому порядку, который скрепляет ливанское государство и общество.\n\nCurrent Strength: [?ROOT.ssnp_insurgency]%"
 SSNP_insurgency_options.3.d: "Ливанская армия провела успешный рейд сегодня в Бейруте. Местные информаторы отметили, что студенческие активисты ССНП собирались в местном многоквартирном доме, планируя нападение на правительственные объекты. Когда войска ворвались внутрь, они обнаружили членов ССНП, документы, пропагандистскую атрибутику и оружие. Несколько студентов попытались открыть огонь по нападавшим войскам, но они были нейтрализованы. Подобные рейды продолжают разлагать ССНП и гарантируют, что партия не будет распространять свои опасные антигосударственные послания. Один из захваченных боевиков был опознан как лидер городской партизанской ячейки, которая совершила несколько нападений на армию. Местным СМИ показали собранное оружие вместе с полными ненависти сообщениями, которые эта ячейка планировала распространить среди жителей города."
 SSNP_insurgency_options.4.d: "Ливанская армия начала налет на жилой дом в Бейруте. Они получили информацию о собрании студенческих активистов ССНП с целью замысла насилия и распространения ненависти. Когда войска вошли в здание, возникла неразбериха, и несколько человек из числа находившихся в нем были застрелены нашими солдатами. Однако после осмотра места происшествия стало ясно, что, хотя оккупанты были членами ССНП, у них не было оружия, взрывчатых веществ или публикаций, которые можно было бы счесть разжигающими ненависть. Известие о том, что наши войска жестоко нападают на безоружных студентов, вызвало враждебность среди людей, особенно молодежи. Местный командир утверждает, что информация о студентах, возможно, была подброшена ССНП, чтобы выставить правительство в дурном свете и ослабить общественную поддержку."
 SSNP_insurgency_options.1.d: "ССНП пользуется сильной поддержкой в Бейруте и других городских районах Ливана. Группа выпускает обширные публикации и особенно ориентирована на молодых студентов, призывающих присоединиться к их делу. В ходе недавней операции в крупном университете агенты нашей разведки завербовали нескольких студентов для вступления в ССНП и передачи нам информации об их тактике, членстве и планах. Операция до сих пор была успешной, поскольку наша разведка теперь располагает четкой картиной о членстве и деятельности ССНП в школе. Если придет время, мы сможем легко ворваться и быстро искоренить ССНП из кампуса."
 SSNP_insurgency_options.2.d: "ССНП пользуется сильной поддержкой в Бейруте и других городских районах Ливана. Группа выпускает обширные публикации и особенно ориентирована на молодых студентов, призывающих присоединиться к их делу. В ходе недавней операции в крупном университете агенты нашей разведки завербовали нескольких студентов для вступления в ССНП и передачи нам информации об их тактике, членстве и планах. Наша разведка сочла операцию успешной, поскольку они получили четкое представление о членстве и деятельности ее членов в кампусе. Однако, когда мы вмешались, чтобы искоренить высшее руководство и пресечь заговор с целью приобретения оружия, мы закончили тем, что арестовали членов анти-ССНП в кампусе. Оказывается, наши лазутчики превратились в перебежчиков. Они скармливали нам ложную информацию и обманом заставляли нас действовать, это настроило организации, выступающие против ССНП, против правительства и укрепило их аргументы о государственном угнетении."
 SSNP_insurgency_options.5.d: "Ливанские военно-воздушные силы предприняли дерзкий налет, сбросив бомбы и атаковав автоколонну, которая двигалась в сельскую местность из Бейрута. При осмотре обломков были обнаружены тела нескольких высокопоставленных активистов ССНП и их приближенных. Что более важно, они перевозили оружие и боеприпасы. Считается, что они пытались переправить оружие на склад и провести боевую подготовку, прежде чем вернуться в Бейрут в качестве городских партизан. Успешная операция наших небольших военно-воздушных сил демонстрирует смелый профессионализм вооруженных сил и научит ССНП не расширять операции против правительства."
 SSNP_insurgency_options.6.d: "Небольшой военный аванпост сообщил, что по нему был открыт сильный огонь и есть жертвы со стороны предполагаемой группы боевиков ССНП. Ливанские ВВС идентифицировали конвой возле аванпоста как убегающих повстанцев. Самолеты бомбили и обстреливали транспортные средства. Осмотрев обломки, наши потрясенные следователи не смогли найти никаких признаков того, что в транспортных средствах находились члены ССНП. Кроме того, не было найдено ни оружия, ни униформы. Похоже, что пилоты допустили ошибку, но ССНП уже использует свои контакты в средствах массовой информации, чтобы распространить сообщение о том, что мы наказываем граждан без причины. Неудача подорвала моральный дух наших пилотов и подорвала местную поддержку правительства."
 SSNP_insurgency_options.10.d: "Конфликт между правительством Ливана и ССНП завершился сегодня, когда правительство легализовало партию. В течение многих лет ССНП выступала за Великую Сирию и ассоциацию народов плодородного полумесяца. Однако подъем арабского национализма во время недавнего кризиса в Ливане поставил под угрозу целостность ливанского политического порядка. Правительство признает, что для сохранения Ливана и противодействия угрозе арабских националистов оно должно привлечь к политическому процессу такие группы, как ССНП. Для ССНП арабское националистическое видение великого арабского объединения угрожает культуре и исторической самобытности народов плодородного полумесяца, и их идеология уже уводит членов. Легализация позволит партии сосредоточиться на формировании своего послания и борьбе с угрозой арабского национализма. Ливанское правительство делает ставку на то, что, вовлекая ССНП в политику, оно успешно заручится поддержкой арабских националистов в стране."
 SSNP_insurgency_options.11.d: "Военные офицеры, лояльные захватившим сегодня власть в Ливане. Переворот произошел в Бейруте, когда двое офицеров повели своих солдат и быстро захватили кабинет министров и высшее руководство Ливана. Затем повстанцы захватили радиостанцию и объявили о создании нового правительства. Военные и полицейские силы никак не отреагировали, и партийные лидеры пришли к власти. Отсутствие реакции объясняется общим шоком среди сил безопасности, но, несмотря на это, это позволило ССНП укрепить свои позиции. Когда лидеры партии ССНП обратились к стране, они заявили, что переворот был направлен на сохранение культурной и исторической самобытности народа и подавление растущего влияния арабских националистов в правительстве. Они отметили, что если бы ССНП не действовала, арабские националисты передали бы страну североафриканцам и арабам Персидского залива, которые не имели права указывать им, что делать."
