 tonkin.2.d: "После инцидента в Тонкинском заливе Конгресс одобрил военные действия во Вьетнаме. После принятия совместной резолюции президент дал указание военным немедленно развернуть свои воздушные и военно-морские силы. В нем также было объявлено о планах развертывания американских морских пехотинцев в Южном Вьетнаме и оказания помощи правительству Сайгона. Ранее Соединенные Штаты принимали активное участие в регионе, предлагая Южному Вьетнаму дипломатическую поддержку. Кроме того, американские военные советники уже находятся на местах, но это новое развертывание знаменует собой серьезную эскалацию. Ранее американским силам разрешалось только обучать и консультировать южновьетнамцев, теперь американские военные будут активно поддерживать и помогать южновьетнамцам в борьбе с коммунистической агрессией. Многие аналитики полагают, что эта новая эскалация быстро переломит ситуацию против коммунистов."
