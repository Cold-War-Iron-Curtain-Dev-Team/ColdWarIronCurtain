 OPCASTOR: "Воздушно-десантная операция «Кастор» увенчалась успехом! Чтобы создать новые укрепления в стратегических районах и районах снабжения после вторжения Giap в Лаос, десантники Французского иностранного легиона за последние несколько дней высадились в Дьенбьенфу на северо-западе Вьетнама, чтобы создать укрепленный аэродром хеджхог для продолжения наступления против вьетминя. Эта операция встретила небольшое сопротивление и будет весьма полезна при атаках и обороне в Северном Вьетнаме в ближайшие месяцы. Это самая масштабная воздушная операция со времен Мировой войны."
 VIN_HELL: "После массированной воздушной операции «Кастор» генерал Гиап почувствовал, что иностранный легион удерживает слабый плацдарм в Дьенбьенфу. Вьетминь начал отводить свои силы от линии фронта к небольшому городку на северо-западе Вьетнама. Партизаны начали серию нападений на патрули Иностранного легиона в этом районе, постепенно уничтожая их. В течение 57 дней войска отражали волну за волной атак на их позиции, пока в конечном итоге они не были отбиты. Ветераны конфликта, длившегося почти два месяца, теперь называют это 57 днями ада."
 FRA_LAO_1: "Потерпев неоднократные неудачи в прямых атаках на стойко обороняемые французские позиции, генерал Гиап начал оказывать давление на французский Лаос в надежде отвлечь подразделения иностранного легиона. Эти атаки на различные лаосские базы были успешно отбиты. Хотя Вьетминь атаковал жестоко и безжалостно, французская оборона выстояла против сил Гиап."
 FRA_LAO_2: "Потерпев неоднократные неудачи в прямых атаках на стойко обороняемые французские позиции, генерал Гиап начал оказывать давление на французский Лаос в надежде отвлечь подразделения иностранного легиона. Эти атаки на различные лаосские базы были успешными: было уничтожено несколько дивизий, а также захвачено несколько баз в Лаосе."
 BLACK_RIVER_1: "После череды катастрофических потерь пограничных постов в Северном Вьетнаме Вьетминь начал серию наступлений против французского иностранного легиона вдоль Черной реки в регионе Тай. Форсирование генералом Гиапом Черной реки было встречено стойким сопротивлением Иностранного легиона, который в ответ начал операцию «Лотарингия» — самую масштабную военную операцию во Вьетнаме на сегодняшний день. Укрепляя свои линии снабжения и цепляясь за то, что было завоевано в наступлении зубами и ногтями, Иностранный легион медленно добивается победы, отвоевывая несколько утраченных аванпостов"
 BLACK_RIVER_2: "После череды катастрофических потерь пограничных постов в Северном Вьетнаме Вьетминь начал серию наступлений против французского иностранного легиона вдоль Черной реки в регионе Тай. Форсирование генералом Гиапом Черной реки было встречено стойким сопротивлением Иностранного легиона, который в ответ начал операцию «Лотарингия» — самую масштабную военную операцию во Вьетнаме на сегодняшний день. В то время как Иностранный легион достиг множества целей в ходе наступления, они не смогли добиться решающей победы, чему еще больше способствовали атаки Вьетминя на линии снабжения. Операция «Лотарингия» сейчас терпит неудачу, и хотя было одержано несколько побед в обороне, они дались большой ценой."
