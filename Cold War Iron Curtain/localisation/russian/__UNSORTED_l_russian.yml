 Zurich_1_d: "Following the Zurich Agreement, the governments of Britain, Greece, and Turkey created the framework for what an independent Greece must look like. As the proposed constitutional framework was for an independent Cyprus with guarantees that it, Greece, and Turkey would refrain from unification, the agreement was a rejection of enosis (unification of Cyprus to Greece). It was decided to present the framework for finalizing and approval by the Cypriote Greek and Turkish communities in a London summit. Many Cypriote Greeks, especially those engaged in resistance to the colonial regime outright denounced the agreement for the rejection of enosis. However, the governments of Greece and Great Britain managed to convince the most popular Cypriote Greek leader and ardent enosis propagator Archbishop Makarios to attend and represent his community in London. Many believe he was convinced to participate in order to help find a solution to end the violence on Cyprus. For the Cypriote Turkish community, Dr. Fazil Kutchuk came as the main representative. Britain, Turkey, and Greece again sent representatives to oversee the process. As the summit begins, there is optimism that Cyprus may finally return to peace."
 Zurich_2_d: "After a tense negotiation, the London summit on Cyprus has announced an agreement has been made and will be signed shortly by the representatives attending. The Cypriote Turkish community was anxious to ensure its rights were protected and enosis would be off the table. The Cypriote Greeks were looking for a way to end the armed conflict and since enosis was no longer viable, they sought guarantees to their political rights. Apparently, the final agreement will assuage both community's misgivings and more importantly for the people of Cyprus, finally lead a way for the end of armed conflict. For the British, securing a final agreement will give it an exit from governing the island although it is expected the British will retain control of certain military bases. Strategically, the RAF airfield in Cyprus is of immense strategic value for the British. The final signing and more details about the agreement is expected soon."
 Zurich_3_d: "With representatives of Great Britain, Greece, and Turkey looking on, the leaders of the Cypriote Greek and Cypriote Turkish communities signed the London Agreement. Armed conflict on Cyprus is expected to be ending almost immediately and the people of Cyprus are expected to begin the process of preparing for independence almost immediately. The agreement in London formalized the constitutional framework agreed to in Zurich and added Treaty of Guarantee and Treaty of Alliance. The Treaty of Guarantee pledges Cyprus shall neither demand enosis nor partition and will remain an independent republic with guaranteed rights and political representation for both communities. The Treaty of Alliance limited the number of military personnel from Greece and Turkey and pledged they would work together to preserve the agreement, though if any party violated the agreement, each party reserved the right to act unilaterally to preserve it. The complicated constitution appears to be rigid as any attempts to radically change it appears forbidden. Many in Cyprus hope with the end of colonial rule peace can return, but there are observers who point out the lack of goodwill between the Cypriote communities may make the new constitution untenable. Time will tell whether these fears are warranted or if Cyprus will emerge as a prosperous republic."
 Zurich_4_d: "In Zurich, detailed discussions between senior representatives of Great Britain, Turkey, and Greece concluded in an agreement about how to resolve the crisis in Cyprus. All three states agreed that Cyprus must become an independent state and finalized the framework on which the constitution will be made. The complicated agreement wants to see a constitution which follows the framework agreed by the three powers. Cyprus will make Greek and Turkish the national languages of a new state and divide political power between the two communities. The president will be Greek and Vice President Turkish, with the Vice President holding a veto power. This is to prevent the Greek majority legislature from renegading the agreement or pass laws restricting the Turkish community's rights. Essentially the three nations agreed not to seize Cyprus for themselves and promised to establish a republic which caters to the interests of both communities on the island. After this agreement it is expected representatives of the Greek and Turkish communities in Cyprus will travel to London in order to finalize a constitution and accept an end to the crisis in Cyprus. Although many Cypriots cautiously welcome the agreement, there is still a great deal of distrust between the communities and already some Greek nationalists are condemning what they see is an imposed agreement by outside powers."
 Zurich_5_d: "In a stunning reversal to the governments of Britain, Greece, and Turkey, the London Summit has ended without an agreement. The Cypriote Greeks, led by Archbishop Makarios declared they could not in good conscious accept such a restrictive constitutional framework or completely reject enosis, as it remains a desire deep in the hearts of Cypriote Greeks. The British in particular are said to be fuming as this diplomatic debacle is being portrayed as an example to the whole British policy in Cyprus being disastrous. The British had invited Archbishop Makarios to attend and although he initially declined he had been convinced to attend. The British were under the impression the Archbishop would not demand enosis and was willing to accept independence for Cyprus. Archbishop Makarios was said to be motivated by a desire to see the end of armed conflict on the island even if it meant an end to the enosis demand. However, it appears upon closer examination of the constitutional framework and his interactions with the representatives of the Cypriote Turkish community, he decided the proposed agreement was unfeasible and left the conference."
  
 EOKA_GRE_1: "Many people are increasingly sympathetic to the goal of achieving Enosis with the Greek nation. Our guerilla bands operate freely from their mountainous hideouts and work with town groups who engage in urban actions such as encouraging riots and strikes. The National Front supports these armed efforts by facilitating the acquisition of supplies, arms, and most importantly, intelligence to the armed wings of the movement. Recently, several National Front operatives were able to join local police units and take on positions in government buildings. We expect they will be able to provide invaluable information on British troop movements and aid our fighters to strike at the weakest targets. More importantly, we hope to uncover information about local collaborators or traitors to the cause."
 EOKA_GRE_2: "Our guerilla bands operate freely from their mountainous hideouts and work with town groups who engage in urban actions such as encouraging riots and strikes. The National Front supports these armed efforts by facilitating the acquisition of supplies, arms, and most importantly, intelligence to the armed wings of the movement. However, a recent effort by the National Front to embed operatives within the local police and government in one area resulted in disaster. Apparently, the operatives were discovered and were fed false information leading to the mauling of one mountain band of fighters. The operatives were detained almost immediately after it became clear they were being tricked by the British."
 EOKA_GRE_3: "One of our mountain guerrilla warfare bands took advantage of an area with a light British presence. Operating from their mountain base they quickly moved into a major village and raided the local police station and attacked a small, lightly armed British patrol. The British were quickly forced to withdraw in defeat while our fighters were able to seize the police station, acquire weapons and ammunition. The local townspeople were said to be cheering our men and some are said to have joined either the local urban town group or gone to the mountains themselves."
 EOKA_GRE_4: "In a reversal today, one of our mountain guerilla warfare bands made a major tactical blunder in an operation to raid a nearby town to acquire arms and supplies from a nearby town. Our fighters had assumed the local police would be loyal to our fighters and there was no British presence nearby. Both counts proved false as they faced stiff resistance from the police, which apparently consisted of Turkish Cypriot policemen brought in and this force was bolstered by British troops in the area. The attempted raid failed to secure any of its objectives or even reach the police station and our fighters were forced to withdraw with casualties. The local population is said to be greatly discouraged by this failure."
 EOKA_GRE_5: "The best way to show the British continued colonial rule must be ended is to make the cost of continuous occupation too high. We must especially demonstrate tis to the British public and that is why sabotage operations and bombings are so effective. Our town groups conduct these operations and over the past week have successfully bombed a local police station, British military base, and several homes of anti-EOKA officials. These high-profile attacks, although not inflicting high casualties, did achieve their objective of demonstrating to the international community that the situation in Cyprus is unstable. The British forces are under scrutiny and are facing increasing questions from the press about whether any progress has been made in their fight against the EOKA."
 EOKA_GRE_6: "The best way to show the British continued colonial rule must be ended is to make the cost of continuous occupation too high. We must especially demonstrate tis to the British public and that is why sabotage operations and bombings are so effective. Our town groups conduct these operations but unfortunately one group failed to bomb a military outpost and several homes of British colonial officials. Apparently, the British saw some men conducting surveillance on target sites and decided to track them instead of detaining them. When our fighters moved to plant their devices at the different locations, they were either detained or ambushed by waiting British forces. The British have uprooted a town group and are parading the captured explosives to the press to demonize our cause."
  
 EOKA_1_d: "Although it is difficult to admit, the EOKA has managed to garner a lot of sympathy and support from the Greek community on Cyprus. Opponents are generally silenced through intimidation, bombing, or violence. However, our recent efforts to expand intelligence collection by using local anti-EOKA groups or small units of intelligence operatives has yielded a major success yesterday. A mid-level EOKA commander has been successfully turned by one of our agents and is feeding us detailed information regarding EOKA tactics, objectives, and movements in the area. From this intelligence we expect to launch several successful operations and hope the this will break the EOKA popularity in the area."
 EOKA_2_d: "Although it is difficult to admit, the EOKA has managed to garner a lot of sympathy and support from the Greek community on Cyprus. Opponents are generally silenced through intimidation, bombing, or violence. Recently an intelligence source informed us he had a senior EOKA logistics leader willing to turn and provide information for cash regarding the movement of arms and weapons. Our overzealous local officer pushed the intelligence source to get actionable intelligence which was then immediately used in a successful operation. However, the EOKA quickly realized what had happened and when our vital intelligence source went to meet the source, they both disappeared. We expect to find their bodies in the next few days and our intelligence in the area is greatly hindered."
 EOKA_3_d: "Our search and cordon operations to uproot the EOKA have generally failed as the enemy often gets advanced warning from sympathizers. It was decided to conduct operations more frequently and replace the police with more Turkish Cypriote residents to plug leaks to enemy fighters. These policy changes bore fruit today as our forces successfully found and assaulted one of the enemy's mountain camps. The enemy fighters were unprepared, those who were not casualties or captured fled deeper into the mountains and our forces took no casualties. The operation saw us collect valuable intelligence and remove a cache of arms from the enemy."
 EOKA_4_d: "A major search and cordon operation, which the colonel in command had promised to the press would result in massive losses for the enemy ended in failure today. Our forces searched the whole sector, detained dozens of local men, searched many homes, and found nothing. Publicly our leadership was embarrassed. More significantly, the disruption of the operation on the local population's day to day life and the rough handed manner in which detainees were questioned meant many locals are increasingly sympathetic to the EOKA. More operations like this will only serve to bolster the enemy's influence among the population."
 EOKA_5_d: "Our search and cordon operations to uproot the EOKA have generally failed as the enemy often gets advanced warning from sympathizers. It was decided to conduct operations more frequently and replace the police with more Turkish Cypriote residents to plug leaks to enemy fighters. These policy changes bore fruit today as our forces successfully found and assaulted one of the enemy's mountain camps. The enemy fighters were unprepared, those who were not casualties or captured fled deeper into the mountains and our forces took no casualties. The operation saw us collect valuable intelligence and remove a cache of arms from the enemy."
 EOKA_6_d: "The Royal Air Force (RAF) maintains a large and strategically vital airfield along with other assets on Cyprus. When the RAF is not caught up with operations essential to British objectives in the region, they aid the local forces. However, in an unfortunate incident, the RAF ended up bombing what was thought to be an EOKA safehouse located outside a village. However, the building was in fact a storehouse for locals to hold their crops before selling to the market. The bombing of this structure has alienated the local population who believe the British are willing to gamble innocent lives on flimsy intelligence. EOKA support is expected to be boosted in the coming days."
  
 EOKA_7_d: "The British government has announced its withdrawal from Cyprus. The British cite the refusal of the Cypriote Greek population to be governed and the unsustainable costs required to maintain a British presence. For the EOKA this is a major victory as its mountain guerrilla fighters successfully achieved their first objective of ending colonial rule. Now with the British withdrawal, the group will push for enosis with Greece. Throughout the conflict the group not only effectively dealt with the British but also made it a point to silence opposition and portray the conflict as an intercommunal one between the Cypriote Greek and Cypriote Turkish communities. This has allowed the group to even convince moderate Cypriote Greeks that to survive and prevent a Cypriote Turkish coup or even a Turkish invasion, enosis must be achieved as quickly as possible. The British are expected to withdraw quite hastily as the EOKA fighters move in to secure strategic positions across the island."
 EOKA_8_d: "The British military command in Cyprus accepted the surrender of the final bands of EOKA fighters today. The EOKA had emerged as a potentially potent guerrilla force. The Greek Orthodox Church and the group's logistical arm facilitated the movement of arms, supplies, intelligence, and men for the group. Among the Cypriote Greek population, they initially enjoyed a lot of support and sympathy for their call for enosis. However, the British military proved very effective in its counter-insurgency tactics. It managed to gain intelligence on fighters and utilized the minority Cypriote Turkish community to act as auxiliary forces and police. This greatly reduced leaks and allowed the British to avoid tipping their hand. The EOKA's failures against the British along with attempts to target the Cypriote Turkish community to provoke a conflict ended up weakening public support, by the end many Cypriote Greeks saw them as more of a nuisance who stood in the way of a political solution."
  
 Enosis_d: "In Athens tonight, the Greek government released a statement congratulating the people of Greece and Cyprus for achieving enosis today. Earlier in the day huge celebrations with patriotic songs and speeches occurred in major towns across Greece and Cyprus. In Athens, the senior political and military leadership listened to speeches with leading Cypriote Greek leaders siting amongst them to indicate the new unity. Enosis had been talked about extensively since the early nineteenth century and its success has renewed the patriotic fervor of Greeks. Greek Orthodox churches across the world held special services to celebrate the achievement. Efforts to invite representatives of the Cypriote Turkish community to the festivities were rebuffed. Many in the Cypriote Turkish community to remain upset with enosis as they fear their rights and homes will soon be targeted by Cypriote Greeks. Rumors have grown among the Cypriote Turks that Greece plans on expelling them and seizing their lands to give to Greek immigrants from the mainland. If enosis is to thrive, Greece must work to not just integrate the island to the mainland but also assuage the fears of its sizeable Cypriote Turkish minority, who may seek the help of Turkey or launch its own resistance if it feels overly threatened. Regardless of the future, the people of Greece tonight will sleep with an optimism towards the future."
  
 TMT_1_d: "As the TMT, we oppose Enosis and the EOKA's brutal actions against our community in Cyprus. Indeed, the increasing violence has pushed the British to rely on recruiting Turkish Cypriotes for the police. To take advantage of this trend we have sent members to join the police in a strategic area and are gaining valuable intelligence. These members have brought other Turkish officers to the cause. In addition, their intelligence will provide us cover from the scrutiny of the colonial government and feed us intelligence so we know pro-EOKA figures we can target in the area."
 TMT_2_d: "A recent effort by our supporters to join the local police ended in disaster. Increasingly the British have begun recruiting Turkish Cypriotes to join the police and prevent the EOKA from infiltrating the police. However, our recent effort at infiltrating a local police force failed. Our men approached several officers they thought would be sympathetic to the TMT cause but misjudged, the men instead reported them to the British. The British detained our supporters and after an interrogation uprooted a lot of our sympathizers in the area, greatly hindering our intelligence and weakening morale."
 TMT_3_d: "Using intelligence gained from sympathetic Turkish police officers, we discovered the location of an EOKA safe house. One team of fighters led the assault on the safehouse, and we successfully destroyed the EOKA infestation. The operation was done during the day to show in this area we will not tolerate the EOKA and combat their narrative that the conflict in Cyprus is one about Greece unification. The Turkish press has covered the incident extensively, hopefully this will help raise our profile and garner us more sympathy."
 TMT_4_d: "Using intelligence gained from sympathetic Turkish police officers, we discovered the location of an EOKA safe house. We assembled a team of fighters to destroy the EOKA forces at the location. However, disaster struck as it appears the EOKA had fed this intelligence to lure us for a trap. Our fighters suffered casualties and after a protracted firefight were forced to retreat. The failed operation has lowered our reputation among the Turkish community and our patrons in Turkey have grown concerned about the failure. More importantly, the EOKA has used the incident to push its narrative of us as being traitors to Cyprus."
 TMT_5_d: "The EOKA has long sought to provoke armed conflict between the Cypriote Greek and Cypriote Turkish communities. By escalating ethnic tensions and pushing the conflict to one between communities, they feel more Greeks will join their cause. To counter these efforts, we have successfully bombed the homes of several major EOKA sympathizers in the area. These men had been making statements against our and rallying their community in opposition to us. We believe the will remain silent now and we successfully showed our people will not be easily intimidated."
 TMT_6_d: "The EOKA has long sought to provoke armed conflict between the Cypriote Greek and Cypriote Turkish communities. By escalating ethnic tensions and pushing the conflict to one between communities, they feel more Greeks will join their cause. To counter these efforts, we tried to bomb the homes of several major EOKA sympathizers in the area to silence their criticism of us and our community. However, the operation was compromised, and our fighters were caught red handed by local authorities. The EOKA has already spread word of the attempt and retaliatory actions are already occurring. Many local Turks in the area now blame us for provoking such violence and our support has weakened."
  
 TMT_7_d: "The TMT had formed to counter the growing harassment and violence perpetrated by the EOKA against the Cypriote Turkish community and combat the cause of enosis. The group took advantage of training, volunteers, and supplies from Turkey. In addition, the British policy of recruiting Cypriote Turks to fill the police ranks allowed us to place operatives and collect intelligence on the EOKA. After a successful campaign in Northern Cyprus in which we targeted EOKA and prominent Cypriote Greek leaders, we successfully carved out the northern half of the island for our people. Once Cypriote Greek communities realized our forces were in charge, they moved south and away, leaving their homes for our people. With North Cyprus essentially a Turkish enclave we can negotiate from a position of strength and push for partition, enosis is no longer a viable option in Cyprus."
 TMT_8_d: "\nThe TMT formally dissolved itself today. It had formed as a counter to the EOKA and its harassment and violence against the Cypriote Turkish community. The goal of the TMT was to prevent enosis and secure a generous partition of Cyprus on ethnic lines. Although the TMT enjoyed tacit support from British and covert Turkish aid, it could not utilize these advantages to tactical victories. Efforts to defeat the EOKA and secure Northern Cyprus failed and with each defeat support diminished. As the defeats increased, the EOKA moved in and successfully displaced some Cypriote Turkish communities, strengthening their claims for enosis and dispersing the Turkish minority to prevent them from creating a block. The defeat of the TMT now leaves the Cypriote Turkish minority vulnerable and unprotected from the Cypriote Greeks. Now we are dependent on the goodwill of the Cypriote Greeks and our international patron, Turkey."
  
 Cyprus_TUR_1_d: "The situation in Cyprus continues to deteriorate as the Greek Cypriotes continue to advocate the removal of rights from the Turkish Cypriote community. Since the London Agreement, the Republic of Cyprus has faced political deadlock. Many Greek Cypriotes viewed the guaranteed representation and minority rights for the Turkish Cypriotes as excessive and not reflective of the demographic reality in Cyprus. In addition, they resent the veto powers of the Turkish Cypriote Vice President. Recent attempts to force constitutional changes and end what they see as excessive rights were vetoed, leading to increased tension and violence across the island. Our Turkish Cypriote brothers and sisters have increasingly become targets of riots and violence. Our intelligence believes the Greek Cypriotes are seeking to use violence and force the minority Turkish Cypriotes into obedience and then take the island to enosis as once the constitutional amendments pass, we believe they will request enosis. According to the Treaty of Guarantee signed during the London Agreement, we, along with Greece and Britain are pledged to maintain the provisions, but so far Greece and Britain appear unwilling to intervene. However, the treaty did not specify we had to act in concert with the other signatories. As a result, we have two options for Cyprus. One is to intervene, we already have a military force on the island and our commanders say they can easily establish a Turkish safe zone in the north of the island to prevent further violence. However, although we have the right by treaty, we expect some international backlash and the risk of a wider conflict with Greece. The other option would be to not intervene but diplomatically ensure the Turkish Cypriotes voice and rights are listened to."
 Cyprus_TUR_2_d: "In northern Cyprus, it is reported that a large number of military personnel from Turkey have established a beachhead. The Republic of Cyprus dispatched a military force to resist the invaders and ended up facing a heavily armed Turkish force supported by heavy air power. Reports have also reached of Turkish paratroopers landing at strategic points on the island. The government of Greece and Cyprus immediately condemned this naked act of aggression while the government of Turkey announced it was acting in accordance to the Treaty of Guarantee signed at the London Agreement which ended British colonial rule over Cyprus. Turkey argues recent efforts by the Greek Cypriote majority to change the constitution, remove guaranteed rights for the Turkish Cypriote minority, and the increased incidents of ethnic violence necessitated their intervention. They say the efforts to terrorize Turkish Cypriotes into agreeing with the changes was designed to lead to their eventual expulsion from the island and Cyprus proclaiming enosis with Greece, in clear violation to both the Zurich and London Agreements. Greece and Cyprus both pointed out the Turkish invasion appears to be aimed at securing the Turkish Cypriote main enclaves and not in restoring the original constitution. It is unknown if Greece will dispatch additional forces to the island. The Turkish government however, insists if it did not intervene, ethnic warfare and forced deportation was going to happen. The fighting appears intense and at the moment Turkish forces seem to have not broken out of the beachhead. The United States and Britain are both said to be caught off-guard by the Turkish action and early word from Washington indicates they might be very displeased by Turkey's aggressive actions. We are still waiting for their formal response."
  
 cyprus_decisions: "The Cyprus Emergency"
 cyprus_decisions_desc: "Enosis, the unification of Cyprus to Greece, has long been propagated by the government of Greece and the Greek Orthodox Church. The church especially spread this idea to the Cypriote Greek population since the early twentieth century. A number of pro-enosis Cypriotes are now organizing into armed bands as the only way for achieve enosis appears to now be armed conflict. Calling themselves the EOKA, these Cypriote Greeks will take on the British colonial regime, internal opponents, force Britain to concede enosis to the people. However, for the island's sizable minority of Cypriote Turks, enosis represents their destruction as they are well-aware of the post-Ottoman deportations and persecution of Muslims. Leading Cypriote Turks formed the armed TMT to counter the EOKA, stop enosis, preserve their rights and if that is not possible to achieve a partition of the island on ethnic lines. Decolonization and other pressures have reduced British assets globally, making Cyprus even more significant to retain. The EOKA actions will likely provoke a strong British response to preserve Cyprus as a crown colony.\n\n EOKA Strength: [?ENG.eoka_insurgency]\nTurkish Resistance Organization Strength: [?ENG.tmt_insurgency]"
  
 CYP_INSURGENCY.1.d: "After several years of planning and a failure to push the British to grant Greeks on Cyprus the option to vote for enosis, a new Greek nationalist guerilla movement has emerged. Calling itself the EOKA, the group last night announced a major escalation in Cyprus by launching a coordinated nighttime assault across Cyprus. The attack targeted the radio station, British military bases, a power station, police stations, and the homes of senior colonial officials. The attacks were followed by a statement widely released by the EOKA which announced its presence to the people of Cyprus. The leader who released the proclamation called himself Digenes, after a Byzantine general that defended Cyprus centuries ago. The EOKA actions are being seen positively by many Greek Cypriotes who have long believed enosis must be achieved by any means necessary. For the British, the attacks demonstrate their efforts to keep order and peace in Cyprus has failed but military commanders are confident any anti-colonial movement on the island will be easily dealt with. More British troops are expected to be dispatched to Cyprus in the coming days."
 CYP_INSURGENCY.2.d: "Since the early nineteenth century, many Greeks, were strong believers in unifying all lands with Greek populations to Greece. Since then the, small initial Greek state has expanded and united many Greek territories back with the mainland. However, one of the driving desires for Greece and its people is the unification of Greece with Cyprus. This dream unification is called enosis. Since the early and mid-twentieth century, enosis has been widely propagated not just in Greece but in British controlled Cyprus, specifically by the Greek Orthodox church. With Cypriote Greeks increasingly interested in challenging British rule, Greeks from across the world now send funds in support of enosis. Greek communities from Greece and Egypt are especially dedicated but the church is also collecting funds from Greek churches across the world. From these funds, the Greek Orthodox church is able to press the enosis cause in Cyprus and provide funds for those Cypriote Greeks willing to escalate the struggle if the British remain unwilling to budge. The Greek government is said to be facilitating the church's funding operations and is providing officers to help the Cypriote Greeks organize their resistance."
 UN_Cyprus.1.d: "The Greek government today formally asked the United Nations to intervene and allow the people of Cyprus to have a plebiscite on whether they want enosis or not . The Greek representatives pointed out the Greeks who reside on the island have done so for many centuries and they have long, deep historical, cultural, and religious affiliation with mainland Greece. They argued Cyprus is an extended limb of the Greek nation that has been shamefully separated by outside powers for many years. They urged the United Nations to strongly consider the aspirations of the Cypriote people and wrong an historical mistake. Ultimately, the government of Greece asked the United Nations to implement the right of self-determination and equal rights for the people of Cyprus and hold a referendum on its future. The impassioned presentation, done with representatives of the Cypriote Greek community, was countered by the Turkish government who pointed out Cyprus's long history with Anatolia and cautioned giving the island to Greece will leave the sizable Turkish minority vulnerable to violence and expulsion. The Turkish delegation had representatives of the Cypriote Turkish community present to support their stance. The United Nations will consider the government of Greece's request but many expect the status quo to remain, though nothing is ever certain."
 UN_Cyprus.2.d: "In a major surprise to the international community, the United Nations agreed to a plebiscite on Cyprus to consider whether the nation wishes for unification with Greece or not. Considering the Cypriote Greek community's majority on the island, many expect the results will be a clear victory for enosis and it appears the unification of Cyprus to Greece is inevitable. News of the decision has seen thousands take to the streets of Athens and across Cyprus in joy. The festive atmosphere was only contrasted by reporters who visited the Cypriote Turkish neighborhoods and towns. In those areas the mood was quite somber with many residents expressing their disappointment with the United Nations and fears of the future. When Cyprus joins Greece it will take a lot of effort and goodwill to assuage the fears of the Cypriote Turkish community. Upon hearing the United Nations decision, the Turkish representatives stormed out of the chamber. Afterwards they released a statement condemning the decision and claiming it will never abandon its duty to ensure the protection of the Cypriote Turkish community. The government of Greece welcomed the announcement, simply saying the vote will show allow the people of Cyprus to determine their own destiny."
 UN_Cyprus.3.d: "The United Nations today announced it would not take up Greece's proposal for a plebiscite on Cyprus to allow its people the right of self-determination. The failure was largely due to several factors, some nations were concerned about what such a vote would mean for Cyprus's Turkish minority and if this would just lead to another round of conflict. Another group of nations feared the precedent set if they were to allow the vote to go through. Finally, a number of nations did not want to risk their close ties with Turkey or drastically change the status quo in the region. The mood within the Cypriote Greek community is disappointment and in some towns protesters, including stone throwing youths attacked colonial police in frustration to the announcement. All sides involved in the increasing tensions on Cyprus must work on other avenues to resolve the conflict, although reports from Athens indicate it may approach the United Nations on a later date to try again."
  
