 Saudi_Extra_1_desc: "Сегодня на драматичной пресс-конференции президент Египта Гамаль Абдель Насер объявил о неудавшемся покушении, которое произошло днем ранее. Покушение, спланированное королем Саудом, провалилось, поскольку начальник службы безопасности, нанятый для этой работы, на самом деле был ярым сторонником Насера. План предусматривал привязывание бомбы к самолету Насера, а затем подрыв ее в полете. Египтяне доказали попытку Саудовской Аравии, предъявив три чека, выданные заговорщикам для совершения преступления. Напряженность между Объединенной Арабской Республикой и Саудовской Аравией возросла еще больше, и считается, что эта попытка была предпринята из страха перед растущей мощью Египта и недавно сформированной САР, объединяющей Египет и Сирию. Насер назвал Сауда врагом арабского народа, и египтяне уже сплотились против саудовцев. Дом Саудов вскоре проведет заседание по этому вопросу, и король может быть лишен своих полномочий из-за этой неудачи, а также других недавних инцидентов..."
 Qasim.1.d: "В течение многих лет принадлежащая англо-американцам Иракская нефтяная компания (ИНК) эксплуатировала иракскую нефть в своих интересах. Старый режим был слишком зависим от Запада и стремился учесть интересы IPC при заключении соглашений до революции. Однако новый революционный режим премьер-министра Абд аль-Карима Касима решил, что эпоха подчинения Ирака МПК должна закончиться. Премьер-министр Касим потребовал большую долю в ИНК и чтобы большая часть прибыли шла иракскому государству. ИНК отказалась, и в ответ премьер-министр распорядился о значительном повышении тарифов. Сегодня правительство объявило о введении в действие Закона № 80 об освобождении иракской территории от иностранной эксплуатации. Новый закон конфискует 99,5 процента земель, которые на протяжении многих лет уступались ИНК старым режимом, и приостанавливает новые разработки нефти. ИНК не получит никакой компенсации, и премьер-министр Касим объявил, что земля будет передана иракским фермерам. Одним движением он ослабил ИНК, мобилизовал общественную поддержку своего режима и обеспечил землю для поддержки политики нового правительства по земельной реформе."
 Qasim.2.d: "После успешной революции и освобождения Ирака от марионеток империалистических держав иракские свободные офицеры должны начать процесс ликвидации последних пережитков колониализма в Ираке. Коррумпированная монархия долгое время была марионеткой британских интересов, и они держали иракцев привязанными к себе и своей умирающей империи. Премьер-министр Ирака Абд аль-Карим Касим объявил, что Ирак больше не будет привязывать иракский динар к британскому фунту. Вместо этого динар будет привязан к доллару США, хотя и с сохранением первоначальной конвертации. Валюта Ирака долгое время контролировалась британцами, сначала после Первой мировой войны была введена индийская рупия, а затем был введен иракский динар наравне с британским фунтом стерлингов. Отказываясь от фунта стерлингов, Ирак отказывается от британского финансового мира и, в конечном счете, делает валюту более конкурентоспособной, поскольку доллар быстро стал мировой валютой двадцатого века."
 Qasim.3.d: "После Иракской революции бригадный генерал Абд аль-Карим Касим, лидер иракских свободных офицеров, объявил об упразднении монархии и образовании Иракской республики. Революция теперь политически разрушила институт, который она физически уничтожила во время революции, когда свободные офицеры наблюдали за массовыми казнями высокопоставленных членов королевской семьи и их сторонников. По мере развития новых конституционных рамок они будут соответствовать республиканскому правлению. Для многих иракцев монархия представляла собой имперский контроль над страной. На протяжении всей истории Ирака король постоянно выступал на стороне британцев в защиту иракского народа. В вооруженных силах это проявилось наиболее остро во время англо-иракской войны 1941 года, когда хашимиты поддержали британское вторжение в Ирак, чтобы сокрушить правительство сторонников Оси. В монархии интересы элит и их сторонников доминировали в управлении, теперь, как в республике, власть вернется к иракскому народу."
 Qasim.4.d: "Правительство Ирака во главе с премьер-министром Абд аль-Каримом Касимом объявило о ратификации Временной конституции. Новая конституция, одобренная на референдуме и представленная кабинетом министров, провозглашает Ирак республикой. Ислам будет официальной религией, и документ призывает к тому, чтобы Ираком управляли арабы и курды вместе. Исполнительная власть принадлежит Президентскому совету, состоящему из трех членов, который контролируется законодательным советом министров. Наконец, судебная система должна оставаться независимой от политики и защищать права иракских граждан. Примечательно, что конституция подтверждает статус Ирака как члена Лиги арабских государств, но призывает не разделять иракскую идентичность по этническому признаку, поскольку она предоставляет равный статус арабам и курдам. Что еще более важно, конституция рассматривает граждан как источник власти для всей нации, что резко контрастирует с монархической эпохой, когда суверенитет принадлежал королевской семье, а власть сохранялась за теми, кто находился на самом верху. Что касается курдов, то новое правительство уже объявило о своих намерениях амнистировать курдских боевиков, участвовавших в восстаниях 1940-х годов, в знак того, что арабы и курды будут управлять Ираком на равных. Школам также было предложено принять курдский в качестве официального языка для занятий наряду с арабским. Несмотря на концентрацию власти в руках двух советов, иракцы настроены оптимистично, что новая конституция и гарантированные права личности откроют золотой век политического и социального развития Ирака."
 CENTO.2.d: "Новости об иракской революции вызвали шок в столицах и военных штабах стран-членов Организации центрального договора (ОЦД). Ирак был одним из основателей альянса и как арабское государство имел решающее значение для усилий по рекламе альянса в регионе. Арабская националистическая пропаганда долгое время называла ОЦД империалистическим проектом, и это давление подорвало способность альянса привлекать больше членов. Иракские свободные офицеры, кроваво свергнувшие монархию, являются ярыми арабскими националистами, и они объявили, что новое правительство выйдет из всех предыдущих международных альянсов, включая ОЦД. Поскольку штаб-квартира альянса находится в Багдаде, новое иракское правительство потребовало его эвакуации, Турция предложила разместить альянс в Анкаре. Вывод войск из Ирака сильно ослабляет североатлантический союз, но неспособность американцев или британцев защитить иракскую монархию от этого переворота также привела к слухам о том, предлагает ли североатлантический союз какие-либо преимущества. Говорят, что несколько штатов рассматривают вопрос о том, перевешивают ли выгоды от работы в ОЦД риски возникновения внутренних беспорядков или иностранного вмешательства. Время покажет, станет ли это действие началом конца для ОЦД."
 Qasim.5.d: "Невероятно популярный курдский лидер и боевик Мустафа Барзани и его сторонники прибыли сегодня в Ирак. Правительство премьер-министра Абд аль-Карима Касима пригласило курдского революционера подчеркнуть серьезность предложений его правительства по формированию новой иракской идентичности, основанной на общей арабо-курдской культурной самобытности. Два лидера встретились с улыбками, и многие иракцы были взволнованы, увидев старшего иракского военного офицера и старшего курдского партизана вместе в качестве партнеров. Для Касима этот шаг имеет большой смысл, поскольку он сталкивается с растущим давлением со стороны более радикальных арабских офицеров в армии, которые хотят, чтобы Ирак принял арабское националистическое видение и объединил страну с другими арабскими националистами. Что еще более важно, Барзани может помочь добиться признания нового революционного правительства курдским народом. Для Барзани его прибытие и амнистия в Ираке положили конец его длительному изгнанию из Курдистана, и он надеется использовать Касима, чтобы помочь ему укрепить свои политические позиции в Курдистане. Этот шаг подчеркивает арабо-курдское единство для граждан Ирака, но для Касима это притупляет радикальную арабскую националистическую угрозу его власти, а для Барзани это дает ему мощного союзника в Багдаде, с которым он может работать по мере укрепления власти в Курдистане. Продлится ли это соглашение между ними, еще предстоит выяснить, поскольку оба мужчины амбициозны и не будут доброжелательно реагировать, если заподозрят предательство."
 KuwaitDemands.1.d: "Республика Ирак активно отказывается от своих обязательств перед нами и подталкивает Ирак к более тесным связям с коммунистическим миром. Последним признаком растущей враждебности Ирака стало заявление его лидера Абд аль-Карима Касима о том, что он планирует включить Кувейт в состав Ирака. Ирак утверждает, что Кувейт исторически был частью османской провинции Басра и, таким образом, неотъемлемой частью Ирака. У нас есть сообщения о наращивании военной мощи на ирако-кувейтской границе, и мы получили сообщение, что Ирак ожидает от нас ответа относительно их требования относительно Кувейта. Разведка отмечает, что Касим мотивирован выдвигать эти требования, чтобы заручиться поддержкой арабских офицеров-националистов в политически разделенном иракском офицерском классе. Сами кувейтцы ссылались на наше договорное обязательство защищать страну перед лицом угроз, но в конечном счете нам решать, вмешиваться или нет. Решение поддержать освобождение Кувейта от Ирака поможет сохранить его стратегические нефтяные ресурсы в дружественных руках, но будет стоить нам развертывания военной техники. Это также вынудило бы Ирак либо вторгнуться, либо отступить. Хотя Касим хочет заручиться поддержкой офицеров-националистов, неясно, пойдет ли он на риск войны и своего режима, чтобы получить такую поддержку. Согласие на требования Ирака избавит нас от необходимости размещать активы на зарубежном театре военных действий, но мы, вероятно, потеряем доступ к нефтяным месторождениям Кувейта. Для Касима наше признание укрепит его режим, но это может оказаться полезным, поскольку он, скорее всего, не примет панарабских националистов полностью и, как можно ожидать, будет, скорее всего, сопротивляться усилиям по панарабскому объединению в регионе. Теперь мы должны решить, отвергать ли территориальные требования Ирака и гарантировать Кувейту или согласиться с предполагаемыми историческими притязаниями Ирака на Кувейт."
 KuwaitDemands.2.d: "Британское правительство объявило, что поддержит Кувейт, и отклонило требования Ирака к Кувейту как необоснованные. Говорят, что премьер-министр Великобритании консультируется со своим высшим военным штабом для разработки планов действий на случай кризиса в Кувейте. Такой поворот событий, без сомнения, является серьезным ударом по нашим справедливым претензиям на Кувейт и распространению арабского освобождения на другой народ, угнетенный декадентской монархией, раздутой ее имперскими хозяевами. Наши офицеры расходятся во мнениях относительно того, как реагировать, и, конечно, воинствующие националисты говорят руководству, что мы выполняем наши требования и забираем Кувейт силой. Быстрая захватническая война может обезопасить Кувейт до прихода Британии, и как только они увидят новый статус-кво, им придется смириться с новой реальностью. Наши публичные прокламации активизировали эту часть вооруженных сил и населения в целом, поскольку по всей стране прошли проправительственные и антивоенные митинги. Однако, с другой стороны, другие офицерские фракции указывают на катастрофу англо-иракской войны 1941 года и на то, что мы не могли ожидать, что британцы просто отступят, как только начнутся военные действия. Они предполагают, что было бы безрассудно жертвовать иракской революцией и ее огромными завоеваниями только ради общественной поддержки и Кувейта с его отсталым населением. Мы должны решить, стоит ли настаивать на наших требованиях и захватить Кувейт силой, рискуя спровоцировать крупный военный конфликт. Или если мы поддержим наши требования, но отвергнем военное решение и снизим напряженность ситуации, но ценой общественного унижения и враждебности со стороны арабских националистических режимов в регионе."
 KuwaitDemands.3.d: "Британское правительство объявило, что после рассмотрения наших справедливых требований они согласны и начнут процесс передачи Кувейта под суверенитет Ирака. Иракское правительство поблагодарило британцев за их честность, и по всему Ираку прошли массовые митинги в поддержку правительства. Во всем арабском мире Республика Ирак сейчас рассматривается как великое революционное правительство, приверженное освобождению всех арабов от упадка и империализма. Крошечные кувейтские вооруженные силы отступили, когда наши ликующие войска въехали в Эль-Кувейт, чтобы начать процесс передачи. Местные британские и кувейтские военные чиновники отступили и официально передали управление нашим силам. Поступают новости о спорадических беспорядках и перестрелках со стороны наших вооруженных сил, но наши командиры в Кувейте настаивают на том, что они держат ситуацию под контролем. Вскоре мы направим гражданских чиновников и нового военного губернатора для наблюдения за присоединением Кувейта к Ираку. Конечно, наше правительство сейчас пользуется огромной общественной поддержкой, но что более важно, разногласия внутри наших собственных вооруженных сил улеглись, поскольку все фракции теперь признают великое лидерство, продемонстрированное нашим успехом."
 MosulUprising.1.d: "Премьер-министр Абд аль-Карим Касим все больше полагается на поддержку Коммунистической партии Ирака, чтобы ослабить влияние арабской националистической партии Баас. Арабские националисты, особенно из числа военных, продолжают агитировать Ирак за интеграцию в Объединенную Арабскую Республику (ОАР). Эти события привели к росту напряженности между обеими группировками по всему Ираку. Узнав о заговорах с целью государственного переворота, вынашиваемых офицерами-арабскими националистами в Мосуле, Касим призвал коммунистов к маршу с демонстрацией силы. Это привело к уличным столкновениям между двумя сторонами в Мосуле и развертыванию подразделений местной армии против коммунистов. Среди хаотичного насилия командующий гарнизоном Мосула полковник Абдель Вахаб Шаваф решил предпринять попытку государственного переворота против Касима при поддержке офицеров-националистов и САР. Силы Шавафа казнили коммунистических лидеров, захватили радиостанцию в Мосуле, похитили британского специалиста-нефтяника и призвали сочувствующие племена и воинские части присоединиться к нему. Попытка государственного переворота быстро провалилась, поскольку военная поддержка со стороны других подразделений не была оказана, и Касим легко организовал силы из Багдада для подавления восстания, хотя радио Мосула пропагандировало националистическую программу партии Баас. Когда заговор начал проваливаться, полковник Шаваф был убит своими людьми, но насилие не прекратилось, когда правительственные войска прибыли в Мосул, чтобы отомстить повстанческим войскам и националистам за их действия. Хотя премьер-министр Касим на самом деле не сталкивался с серьезной угрозой своей власти, поддержка САР государственного переворота усилила напряженность в отношениях между двумя государствами. Коммунисты укрепились, в то время как арабская националистическая программа партии Баас получила широкую поддержку. Оба последствия в конечном счете ослабляют позиции Касима, поскольку он не желает становиться коммунистом и не хочет принимать панарабское видение, поддерживаемое БААС."
 RamadanRevolution.1.d: "Бурное правление премьер-министра Абд аль-Карима Касима сегодня подошло к кровавому концу. После трех дней боев иракская партия Баас вместе с союзниками в вооруженных силах обнародовали фотографии изрешеченного пулями тела Касима. Это заявление знаменует окончание переворота и утверждает полковника Абдула Салама Арифа в качестве нового лидера Ирака. Премьер-министр Касим пришел к власти после того, как возглавил военную операцию по свержению иракской хашимитской монархии. Однако Касим изо всех сил пытался утвердить свою власть и ограничить влияние многочисленных группировок в стране. Он долгое время стремился использовать коммунистов в качестве противовеса панарабскому националистическому пылу в Ираке. Тем не менее, его страх перед коммунистами означал, что он часто проводил чистки и против коммунистов, оставляя свою базу разделенной и слабой. Этой политической слабости и постоянному балансированию еще больше препятствовали экономические проблемы Ирака и неправильное ведение Касимом иностранных дел, особенно в отношении Кувейта. Иракская партия Баас осознала эти слабости и, объединившись с панарабскими офицерами, решила действовать. В первое утро после переворота был убит коммунистический глава военно-воздушных сил, и войска были переброшены для обеспечения безопасности Багдада. Касим и его сторонники, включая коммунистов, сопротивлялись в течение трех дней, прежде чем Касим сдался. Убийство и чистки Касима означали, что коммунист не смог эффективно мобилизоваться, что в конечном итоге стоило Касиму жизни. Многие аналитики предполагают, что новый режим может принять панарабский национализм и быстро двигаться к достижению этих целей. Слухи из Багдада предполагают, что солдаты устраивают облавы на сторонников коммунистов по всему городу, что еще больше укрепляет влияние БААС."
 RamadanRevolution.2.d: "Husain al-Radi announced on the radio that the Iraqi Communist Party has defeated the nationalist coup and will now administer the country. This marks the end of a bold coup attempt led by pan-Arab nationalist officers and the Ba'ath Party against the regime of Prime Minister Abd al-Karim Qasim. The Ba'athis had sought to end Qasim and communist sympathizers by beginning the coup with an assassination attempt on the communist chief of the air force, Jalal al-Awqati, this attempt failed. When rebel tanks moved to seize the radio station they were stunned to see Iraqi air force planes come in to stop their advance while communist sympathizers secured the station. In the ensuing violence the pro-Ba'ath military units overpowered the pro-Qasim forces, leading to Qasim's death in Baghdad. However, the Ba'ath failed to capitalize as they did not control the radio stations and their efforts to secure key sites were hindered by the establishment of communist strongholds across pro-communist neighborhoods in Baghdad. Without clear news regarding a Ba'ath victory, nervous Iraqi troops across the country began returning to their barracks while others joined the communist fighters operating out of their strongholds. The Ba'athist coup soon failed due to a lack of momentum and the communists emerged from their strongholds to declare victory. Ba'ath leadership is said to have gone underground and Husain al-Radi is expected to soon announce the Iraqi Communist Party's program for economic and social transformation."
 RamadanRevolution.3.d: "Prime Minister Abd al-Karim Qasim addressed the media with several detained senior Ba'ath and pan-Arab military officers standing behind him. Just five days earlier the officers and Ba'ath Party supporters launched a vicious coup to end Qasim's rule and push the country on a more pan-Arab path. Despite initially assassinating the communist air chief and seizing control of the country's radio station, the plotters ultimately failed to consider Qasim's popularity among Iraqis. Qasim long sought to play is base of supporters against one another and purge groups like the communists when they appeared too powerful, greatly hindering the ability of his supporters to mobilize support. However, Qasim's recent success with regards to Kuwait galvanized Iraqis and once the communists spread word of the coup, pro-Qasim forces and the communists saw scores of volunteers show up. The movement of Ba'ath forces and allies were also hindered in multiple pro-Qasim neighborhoods. All this allowed Qasim to rally his supporters and following his counter-attack, the Ba'ath forces virtually disintegrated, securing Qasim's victory. In his address Qasim thanked the Iraqi people for their aid and declared Iraq's revolutionary path will not be hindered by those forces who seek to destroy the unity of Iraq."
