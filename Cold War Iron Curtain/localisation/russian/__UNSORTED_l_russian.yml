 PRC_TIBETAN.1.d: "Китайская Народная Республика (КНР) объявила о подписании Соглашения из семнадцати пунктов с Тибетом. Китайцы хвалят соглашение о прекращении нынешних боевых действий и воссоединении Тибета с Китаем. Соглашение позволяет КНР создавать военные и гражданские административные департаменты в Тибете, но обещает местное самоуправление своему народу. Тибетское правительство в Лхасе выразило шок по поводу соглашения, заявив, что его участники переговоров не были уполномочены подписывать какое-либо соглашение, а условия, по-видимому, продиктованы китайцами. Несмотря на заявления о том, что договор, вероятно, был подписан под принуждением, тибетское военное сопротивление, похоже, рухнуло, и китайские войска выполняют соглашение без особых препятствий."
 PRC_TIBETAN.2.d: "Правительство Тибета подтвердило, что их силы успешно остановили вторжение Народно-освободительной армии (НОАК). Правительство Китая пока не прокомментировало сообщение, но иностранные дипломаты в частном порядке подтверждают эту новость. Это будет ошеломляющим поражением коммунистического режима Пекина. Он давно обещал вернуть Тибет под суверенитет Китая. Похоже, что китайские войска не смогли преодолеть тибетское сопротивление или сложную местность региона."
 PRC_TIBETAN.3.d: "Нью-Дели объявил, что индийские вооруженные силы начинают военные операции для защиты Тибета от Китайской Народной Республики. Индийское правительство заявляет, что претензии Китая на Тибет неубедительны, и Индия должна действовать, чтобы защитить не только тибетский народ, но и регион от китайской агрессии. Правительство Тибета выразило огромную благодарность и заявило, что будут приложены все усилия для эффективного сотрудничества и содействия индийским силам. Китайцы отреагировали гневно, назвав интервенцию Индии типичной реакцией марионеточного империалистического государства."
 PRC_TIBETAN.4.d: "Индийские генералы и высокопоставленные тибетские официальные лица провели пресс-конференцию в Лхасе, подтвердив, что они успешно отразили вторжение Народно-освободительной армии (НОАК) в Тибет. Конфликт начался, когда НОАК начала вторжение в Тибет, чтобы подчинить его китайскому суверенитету. В ответ индийское правительство развернуло собственные силы, чтобы остановить продвижение НОАК. После ожесточенных боев индийско-тибетским вооруженным силам удалось остановить продвижение Китая. Пекин не подтвердил эту новость, но есть сообщения, что китайские СМИ перестали обсуждать конфликт в газетах."
 PRC_TIBETAN.5.d: "Массовое тибетское восстание в Лхасе успешно вытеснило Народно-освободительную армию. Мятежных тибетцев поддержали партизаны кхампа, которые активизировали свои операции по пресечению отправки подкреплений. Восстание в Лхасе началось, когда распространились слухи о том, что китайские военные замышляли похитить Далай-ламу во время мероприятия, спонсируемого военными. Прокоммунистические тибетские официальные лица вместе с китайскими войсками стали мишенью жителей Лхасы. Тибетские войска разместились в главном летнем дворце для защиты Далай-ламы. Радиостанции, находящиеся под контролем тибетских повстанцев, объявили о независимости Тибета. Сообщается, что НОАК выводят, но Пекин утверждает, что они просто перегруппировывается. Нет уверенности в том, что они смогут быстро вернуть себе территорию."
 PRC_TIBETAN.6.d: "Индийско-тибетский альянс объявил о подписании перемирия с Китайской Народной Республикой. Индийско-тибетские силы не только пресекли вторжение Народно-освободительной армии, но и освободили тибетские деревни вдоль ее границы с Китаем. Сообщается, что индийская армия сыграла решающую роль в кампании, и Нью-Дели высоко оценил дисциплину и способности своих войск. НОАК явно недооценила военную мощь альянса. Пекин утверждает, что в неудаче виноват империалистический и капиталистический заговор. По условиям прекращения огня китайцы признают независимость Тибета и откажутся от претензий на Аксай Чин. Во время конфликта Индия обнаружила доказательства того, что НОАК стремилась строить дороги и оккупировать территорию."
 PRC_TIBETAN.7.d: "Китайское правительство и народ Тибета были потрясены, узнав, что Далай-лама бежал из Лхасы в Индию. Во время продолжающегося восстания в Лхасе Далай-лама останавливался в своем дворце, поскольку ситуация ухудшалась. Однако около дворца НОАК произвела несколько выстрелов из артиллерийских орудий. Это спровоцировало Далай-ламу и его советников покинуть дворец ночью. Ходят слухи, что его побегу способствовали сотрудники внешней разведки и сторонники тибетского правительства. Далай-лама планирует жить среди растущего числа тибетских повстанцев и, как ожидается, установит правительство в изгнании."
 PRC_TIBETAN.10.d: "Народно-освободительная армия (НОАК) недавно начала полномасштабное вторжение в Тибет. Они утверждают, что это восстановление китайского суверенитета над страной, но тибетское правительство сохраняет свой суверенитет, оборону и внешнюю политику. Наши высшие советники выразили опасения, что контроль Китая над Тибетом приведет к тому, что крупная держава окажется прямо у нашей границе в Гималаях. НОАК продолжает демонстрировать агрессивную экспансионистскую повестку дня и может возобновить пограничные споры, как только установит контроль над Тибетом. Мы должны решить, как реагировать. Мы можем оставить Тибет на произвол судьбы, послать ему оружие или послать войска для защиты Тибета. Наши военачальники настаивают на том, что мы должны быть готовы к любым неожиданностям."
 The_Lhasa_Uprising: "Восстание в Лхасе"
 The_Invasion_of_Tibet: "Вторжение в Тибет"
 central_africa.101.d: "По всему миру широко распространилось чувство отвращения после сообщений о казни, возможно, до ста учеников школьного возраста в Банги, столице Центральноафриканской империи. Император Бокасса приказал армии арестовывать студентов, протестующих против требования покупать униформу, и поместил их в главную тюрьму. Именно в тюрьме многие студенты были убиты во время пыток и казней. Несколько выживших, среди своих мучительных заявлений об удушении и избиениях, также заявляют, что сам Бокасса убил палкой по крайней мере трех студентов. Правительство Франции вместе с соседними государствами заявило о своем недовольстве этим последним сообщением о зверствах в нестабильной стране. Центральноафриканская империя отвергает обвинения, заявляя, что Император объявил амнистию, хотя критики отмечают, что эта «амнистия» наступила через два дня после убийств. Многие изгнанники из Центральной Африки призывают Францию вмешаться и защитить своих бывших колониальных подданных."
