 global_aggression.1.d: "Советский Союз продолжает кампанию голой агрессии и неприкрытого насилия, угрожая жизни миллионов людей по всему миру. Если оставить их без контроля, их идеология насилия распространится за пределы нашей способности сдерживать ее. Свободный Мир сейчас обращается к нам за лидерством в это время. Мы должны решить, взять ли нам в руки меч свободы или повременить. Конечно, ожидание разочарует многих, но оно может дать нашей нации драгоценное время, необходимое для подготовки надлежащего ответа. Однако многие, особенно в Пентагоне, считают, что настал момент, чтобы наконец положить конец Советской агрессии."
 global_aggression.2.d: "Соединенные Штаты продолжают кампанию открытой и скрытой агрессии против бесчисленных невинных людей по всему миру. Они используют все формы насилия, чтобы гарантировать, что мировой пролетариат останется либо с промытыми мозгами, либо подавленным. Наши социалистические союзники по всему миру обращаются к нам за советом в это трудное время. Мы должны принять решение: либо выступить против наших капиталистических врагов в качестве авангарда революции, либо ждать. Если мы будем ждать, многие почувствуют себя брошенными, однако это может дать государству время, необходимое для подготовки достойного ответа на капиталистическую агрессию. Однако многие считают, что момент, за который боролись многие, настал, и мы должны вмешаться, чтобы остановить Американский империализм и спасти мировую революцию."
  
UN_RESOLUTION.0.d: "\nВ знак решительного осуждения [un_nation_global_target.GetAdjective] политки, Организация Объединенных Наций проголосовала за то, чтобы осудить страну за нарушения прав человека. Голосование состоялось после нескольких недель выступлений, дебатов и споров по поводу обвинений.  [un_nation_global_target.GetAdjective] представители пытались преуменьшить значение обвинений, заявляя, что свидетельства жертв и организаций были ложными и являлись частью некоего заговора против них. Однако, как показывает голосование, членов ООН эти аргументы не убедили. Многие международные группы похвалили Организацию Объединенных Наций за решительную позицию в борьбе с нарушениями прав человека. [un_nation_global_target.GetAdjective] правительство официально не ответило, но, несомненно, будет ошеломлено результатами."
 UN_RESOLUTION.2.d: "\nОрганизация Объединенных Наций приняла мощную резолюцию, осуждающую [un_nation_global_target.GetAdjective] колониализм. Во время дебатов, предшествовавших голосованию, многие члены отметили, что право на самоопределение является жизненно важным принципом Устава ООН, а [un_nation_global_target.GetAdjective] правительство не смогло предложить своим колониальным подданным никаких путей к свободе или их будущему статусу. Многие члены не были впечатлены представленными контраргументами, и, похоже, большинство членов убеждены, что [un_nation_global_target.GetAdjective] правительство не смогло предложить своим колониям адекватного права голоса в отношении своего управления или политического будущего. [un_nation_global_target.GetAdjective]  Представители отказались сделать официальное заявление, покинув ООН, чтобы проконсультироваться со своим руководством. Голосование рассматривается как крупная победа антиколониальных активистов по всей планете."
 UN_RESOLUTION.4.d: "\nНовая резолюция, принятая ООН, официально уведомила [un_nation_global_target.GetAdjective] правительство, что оно больше не должно расширять свои ресурсы для получения влияния на другие государства. Многие члены утверждали, что [un_nation_global_target.GetAdjective] деятельность ведет к дестабилизации, экономическим трудностям и может угрожать суверенитету слишком многих государств. Многих убедили дискуссии, утверждавшие, что [un_nation_global_target.GetAdjective]  действия сродни созданию нового типа колониализма, скрытого от глаз общественности. После голосования несколько представителей отметили, что [un_nation_global_target.GetAdjective] действия были гнусными и бездействие грозило бы миру возвращением к ситуации жестокой глобальной конкуренции."
 UN_RESOLUTION.5.d: "\nПосле долгих дебатов Организация Объединенных Наций проголосовала за замораживание [un_nation_global_target.GetAdjective] национальных активов. Члены ООН решили, что [un_nation_global_target.GetAdjective] правительство использовало свои средства не по назначению в ущерб мировому сообществу и его народу. Это огромный удар для [un_nation_global_target.GetAdjective] правительства. После голосования его представитель сообщил прессе, что результаты голосования не просто разочаровывают, а представляют собой откат назад в международных нормах, касающихся суверенитета отдельных государств. Представитель предсказал, что такое голосование приведет к дальнейшим посягательствам на права наций и их народов. Другие страны опубликовали заявления, в которых говорится, что [un_nation_global_target.GetAdjective] правительство нарушает столько приемлемых норм, что результат был неизбежен."
UN_RESOLUTION.6.d: "\nОрганизация Объединенных Наций проголосовала за введение санкций в отношении видных деятелей страны [un_nation_global_target.GetNameDef] . Этих людей обвиняют в целом ряде преступлений и коррупции. ООН надеется, что санкции окажут давление на правительство страны [un_nation_global_target.GetNameDef], чтобы оно арестовало или задержало этих людей. Голосование получило высокую оценку многих СМИ, которые считают, что оно направлено на главных виновных, а не на наказание всего общества или даже правительства. Поддерживая эту тему, один видный дипломат заявил СМИ, что санкции призваны помочь народу страны [un_nation_global_target.GetNameDef] навести порядок в доме и реализовать свои чаяния. Никто из тех, на кого были наложены санкции, не пожелал сделать заявление по этому поводу."
 UN_RESOLUTION.7.d: "\nПосле ожесточенных дебатов Организация Объединенных Наций проголосовала за введение широких торговых санкций в отношении страны [un_nation_global_target.GetName]. В тексте резолюции отмечались постоянные нарушения установленных норм и плохое поведение правительства страны [un_nation_global_target.GetName]. Несколько дипломатов поспешили заявить СМИ, что санкции не направлены на причинение вреда народу, но они должны быть введены, чтобы контролировать действия страны [un_nation_global_target.GetName]. Правительство страны [un_nation_global_target.GetName], как говорят, очень расстроено из-за резолюции, обвиняя международный заговор и сообщая своему народу, что он стал жертвой и объектом издевательств со стороны ООН."
 UN_RESOLUTION.8.d: "\nОрганизация Объединенных Наций приняла новую резолюцию, запрещающую покупку оружия правительством страны [un_nation_global_target.GetName]. Многие страны-члены согласились с аргументом, что оружия, приобретенного страной [un_nation_global_target.GetName], гораздо больше, чем ему нужно. Кроме того, государства-члены считали, что страна [un_nation_global_target.GetName] отвлекает ресурсы, необходимые для помощи своему народу, на чрезмерное и угрожающее наращивание вооружений. В итоге Организация Объединенных Наций пришла к выводу, что должна действовать, чтобы предотвратить дальнейшую дестабилизацию международного сообщества страны [un_nation_global_target.GetName]. Представители страны [un_nation_global_target.GetName] опубликовали короткое заявление, в котором осудили резолюцию как нарушение суверенитета и прямое нападение на способность страны защищать себя."
 UN_RESOLUTION.9.d: "\nОрганизация Объединенных Наций приняла резолюцию, призывающую страну [un_nation_global_target.GetName] прекратить свою ядерную программу. Во время обсуждения резолюции несколько стран отметили экзистенциальную угрозу, которую представляет это ядерное оружие не только для региона, но и для всего мира. Представители страны [un_nation_global_target.GetName] настаивали на том, что они имеют право продолжать и развивать любые технологии, необходимые для развития и защиты народа. Они добавили, что резолюция ООН говорит о предвзятости и лицемерии организации, но они планируют выпустить официальный ответ после консультаций с высшим руководством. Другие дипломаты отвергли эти утверждения, указав, что риски были очевидны всему миру, и бездействие было бы грубой ошибкой."
 UN_RESOLUTION.90.d: "\nПравительство страны [un_nation_global_target.GetName] демонстративно отвергло недавно принятую резолюцию ООН, призывающую их к денуклеаризации. В своем официальном ответе правительство заявило, что резолюция нарушает его суверенитет, а ООН не имеет права диктовать, какие технологии можно или нельзя использовать для улучшения положения нации. В заключение они заявили, что ни одна организация или иностранная держава не может диктовать народу свои требования. Генеральный Секретарь ООН не дал немедленного ответа, но мировые державы, по слухам, ищут подходящий ответ на эту последнюю провокацию."
UN_RESOLUTION.91.d: "\nСегодня в Организации Объединенных Наций дипломаты и руководители стран испытывали всеобщую радость. Это произошло после того, как стало известно, что страна [un_nation_global_target.GetName] согласилась прекратить свою ядерную программу и демонтировать все ядерное оружие. Ожидается, что для наблюдения за этим процессом будет направлена группа специалистов из ООН. Многие мировые лидеры опубликовали заявления, в которых похвалили страну [un_nation_global_target.GetName] за решение поставить во главу угла мир и стабильность во всем мире. Более того, представители страны [un_nation_global_target.GetName] уже заявили, что ожидают улучшения отношений и выгод от мирового сообщества после принятия резолюции ООН."
 UN_RESOLUTION.10.d: "\nОгненные дебаты закончились принятием ООН резолюции, требующей от страны [un_nation_global_target.GetName] убрать все свое оружие массового поражения. Дипломаты из множества государств заявили, что страна [un_nation_global_target.GetName] не имеет надлежащих процедур командования и управления, сдержанности и оправдания для производства, хранения или использования такого оружия. В резолюции ООН отмечается, что изъятие такого оружия будет способствовать перспективам мира в регионе и снизит вероятность вооруженного конфликта. Главный представитель страны [un_nation_global_target.GetName] заявил, что дебаты и голосование были проведены просто для того, чтобы унизить его страну. Он сказал, что официальный ответ будет получен, как только он вернется домой, чтобы проконсультироваться с высшим руководством."
 UN_RESOLUTION.100.d: "\nВ своем кратком ответе правительство страны [un_nation_global_target.GetName] полностью отвергло резолюцию ООН, призывающую к демонтажу всего оружия массового уничтожения. Страна [un_nation_global_target.GetName] утверждает, что принятие такого требования поставит под угрозу его безопасность и суверенитет. Они осудили ООН, назвав ее моральным банкротом и марионеткой иностранных интересов. Генеральный секретарь ООН выразил разочарование в связи с этим заявлением. Один из ведущих дипломатов не удивился такому ответу, заявив, что он демонстрирует, почему международное сообщество решило действовать решительно. Совет Безопасности, вероятно, рассмотрит этот вопрос на своей следующей сессии."
 UN_RESOLUTION.101.d: "\nОрганизация Объединенных Наций с удовлетворением сообщила, что правительство страны [GetNewspaperHeader][un_nation_global_target.GetName] недавно проинформировало Совет Безопасности о своих намерениях покончить с оружием массового уничтожения и уничтожить его. Это стало ответом на недавнее голосование в ООН, потребовавшее прекратить программу. Генеральный секретарь ООН похвалил руководство страны [GetNewspaperHeader][un_nation_global_target.GetName] за принятие правильного решения в поддержку мира во всем мире. В отдельном заявлении представитель страны [GetNewspaperHeader][un_nation_global_target.GetName] подтвердил, что программа будет прекращена, но подчеркнул, что его действия были предприняты не из страха или запугивания. Вместо этого они были приняты с учетом пожеланий народа. Международная пресса с похвалой отозвалась об этих недавних событиях и о том авторитете, который они придают Организации Объединенных Наций как активной организации, выступающей за мир во всем мире."
 UN_RESOLUTION.26.d: "\nВ качестве важного события Организация Объединенных Наций приняла резолюцию, призывающую к свободе [un_nation_global_target.GetAdjective] народа. ООН отметила важность самоопределения и призвала применить его в данном случае. Прежде чем резолюция была принята, прошли бурные дебаты, поскольку многие члены выразили обеспокоенность тем, что такая резолюция является прямым вмешательством в суверенитет нации. Они считали, что такой прецедент сделает многие страны-члены уязвимыми для подобных резолюций, и по этому принципу не хотели голосовать за резолюцию. Однако в итоге голоса, необходимые для принятия резолюции, были получены. За пределами Организации Объединенных Наций толпы сторонников и членов [un_nation_global_target.GetAdjective] сообщества, как говорят, ликовали. Однако будет ли принята эта резолюция, покажет время."
 UN_RESOLUTION.13.d: "\nВ результате серьезного поражения страны [un_state_owner_global_target.GetName], Организация Объединенных Наций проголосовала за возвращение территории [un_state_global_target.GetName]. Во время принципиальных дебатов многие члены выразили беспокойство по поводу сообщений о волнениях и напряженности на территории. Они согласились с тем, что воля народа направлена на возвращение территории [un_state_global_target.GetName]. Генеральный секретарь поддержал эти настроения после принятия резолюции, заявив, что возвращение территории [un_state_global_target.GetName] проделает долгий путь к разрешению напряженности и насилия в регионе. Остается только догадываться, сможет ли эта последняя акция ООН преследовать страну [un_state_owner_global_target.GetName], чтобы вернуть территорию [un_state_global_target.GetName] мировому сообществу."
 UN_RESOLUTION.131.d: "\nСтрана [un_state_owner_global_target.GetName] бросила вызов Организации Объединенных Наций и международному сообществу, отказавшись вернуть территорию [un_state_global_target.GetName]. Решение об отказе вызвало гневные протесты в спорной зоне и за пределами Организации Объединенных Наций, поскольку сторонники резолюции требуют принять меры. В своем заявлении правительство страны [un_state_owner_global_target.GetName] заявило, что резолюция ООН является прямым вмешательством в их внутренние дела и незаконна. Оно добавило, что любые решения, касающиеся его священной земли и народа, будут приниматься нацией, а не иностранными державами, вмешивающимися в дела других. Ожидается, что Совет Безопасности ООН отреагирует на эти последние события на своей следующей сессии."
 UN_RESOLUTION.132.d: "\nВ то время как страна [un_state_global_target.GetName] согласилась вернуть территорию [un_state_global_target.GetName], что было названо крупной победой для мира во всем мире. Правительство страны [un_state_global_target.GetName] заявило, что оно является ответственной страной и примет волю мирового сообщества. Оно настаивало на том, что решение было принято не под давлением или из страха, а из уважения. Генеральный секретарь ООН высоко оценил это решение и призвал все страны учиться на этом примере. Многие газеты по всему миру опубликовали восторженные репортажи, восхваляющие Организацию Объединенных Наций и ее способность добиваться перемен во имя мира и стабильности во всем мире. Однако некоторые дипломаты в частном порядке выразили опасения, что некоторые страны теперь могут попытаться манипулировать ООН для достижения своих территориальных целей."
 UN_RESOLUTION.14.d: "\nОрганизация Объединенных Наций недавно приняла резолюцию, требующую от нас освободить контроль над территорией [un_state_global_target.GetName]. Это резкое осуждение со стороны всемирной организации и серьезная проблема для нашего правительства. Некоторые считают, что мы должны подчиниться требованию ООН, так как это обеспечит международную добрую волю и изменит негативный настрой против нашей страны. Они также отмечают, что отказ может представлять риск для нашей национальной безопасности. Другие же утверждают, что принятие резолюции будет воспринято как предательство нашего народа, и правительство может не выдержать этого. Кроме того, они отвергают идею о том, что ООН вообще будет предъявлять нам подобные требования. Мы должны решить, принять резолюцию или отклонить ее."
 UN_RESOLUTION.15.d: "\nОрганизация Объединенных Наций санкционировала развертывание миротворцев в стране [un_nation_global_target.GetName]. Миротворцы должны снизить напряженность и насилие в этом районе и сохранить мир. Члены парламента, одобрившие эту меру, заявили, что миротворцы будут выступать в качестве авангарда мира и стабильности. Несколько стран-членов объявили о своей заинтересованности в отправке миротворцев, но реальное количество и страны, участвующие в миротворческой миссии, пока не объявлены. Хотя многие газеты в стране [un_nation_global_target.GetName] приветствовали развертывание, есть и те, кто опасается, что силы ООН представляют угрозу независимости нации и не должны были быть разрешены."
 UN_RESOLUTION.16.d: "\nОрганизация Объединенных Наций одобрила отправку делегации высокого уровня, чтобы помочь урегулировать проблемы в стране [un_nation_global_target.GetName]. Делегацию ООН возглавит дипломат-ветеран, обладающий обширными знаниями о ситуации. Ожидается, что группа отправится в путь, как только получит официальное разрешение на поездку. Дипломаты, знакомые с ситуацией, считают, что эта попытка посредничества под руководством нейтральной группы может дать наилучшую надежду на урегулирование ситуации. Последняя попытка посредничества получила высокую оценку, но, учитывая столь высокие ожидания, многие дипломаты считают, что ее провал может оказаться катастрофическим."
UN_RESOLUTION.18.d: "\nСтрана [FROM.GetName] и страна [un_nation_global_target.GetName] договорились о прекращении огня под эгидой Организации Объединенных Наций. В ближайшее время должны прибыть наблюдательные силы ООН, которые будут следить за соблюдением линии прекращения огня. Генеральный секретарь ООН надеется, что обе стороны воспользуются прекращением огня для продвижения мирных переговоров и окончательного решения всех нерешенных проблем. Правительства обеих стран выступили с заявлениями, в которых приветствовали роль ООН в содействии прекращению огня. Хотя ООН высоко оценивает свою роль в прекращении огня, некоторые дипломаты в частном порядке сообщили СМИ, что, по их мнению, прекращение огня заняло слишком много времени."
 UN_RESOLUTION.19.d: "\nОрганизация Объединенных Наций сообщила, что страна [FROM.GetName] отказался принять предложения о мирных переговорах. Ведущие дипломаты Организации Объединенных Наций выразили свое разочарование по поводу отказа, отметив, что статус ООН как нейтрального, глобального органа сделал бы ее идеальным партнером для мирных переговоров. Ожидается, что Совет Безопасности обсудит это новое событие на своей следующей сессии. С этим отказом растут опасения, что конфликт будет только разрастаться и что ООН не хватит влияния для реализации чаяний ее основателей."
 UN_RESOLUTION.20.d: "\nВ результате голосования Организация Объединенных Наций санкционировала военную интервенцию в страну [un_nation_global_target.GetName]. После голосования Генеральный секретарь отметил, что тяжелый характер ситуации на местах сделал решение о вмешательстве неизбежным и необходимым. Несколько государств уже выразили заинтересованность в поддержке новой миссии, однако ООН еще не представила точных данных о том, сколько сил и из какой страны будет развернуто. В рядах страны [un_nation_global_target.GetName] есть много тех, кто приветствует решение ООН и надеется, что оно поможет обеспечить безопасность и стабильность, необходимые для прочного мира. Некоторые элементы в стране [un_nation_global_target.GetName] выступают против развертывания ООН, рассматривая его как иностранную интервенцию. ООН придется действовать осторожно, но есть большие надежды на ее успех."
 UN_RESOLUTION.21.d: "\nВ ходе торжественного голосования Организация Объединенных Наций санкционировала военную интервенцию в страну [un_nation_global_target.GetName]. После голосования Генеральный секретарь отметил, что это не было целью организации или ее желанием, но ситуация ухудшилась до такой степени, что другого выбора нет. Другие дипломаты в ООН были более откровенны, заявив, что ситуация со страной [un_nation_global_target.GetName] достигла точки невозврата и вмешательство неизбежно. Какие страны и в каком количестве возглавят интервенцию, на данный момент неизвестно. Правительство страны [un_nation_global_target.GetName] не сделало официального заявления, но аналитики полагают, что оно, скорее всего, будет вести себя вызывающе и вряд ли отступит или поддастся международному давлению."
 UN_RESOLUTION.23.d: "\nОрганизация Объединенных Наций проголосовала за отмену обширных торговых санкций в отношении [un_nation_global_target.GetName]. Совет Безопасности отметил, что страна [un_nation_global_target.GetName] добилась значительного прогресса в прекращении практики, которая вынудила ООН первоначально применить торговые санкции. Генеральный секретарь в ответ на голосование отметил, что организация не предназначена для наказания государств, и выразил надежду, что это голосование поможет стране [un_nation_global_target.GetName] вернуться в качестве члена мирового сообщества. Представитель страны [un_nation_global_target.GetName] приветствовал решение и заявил, что это последнее голосование сыграет большую роль в нормализации отношений."
 UN_RESOLUTION.24.d: "\nОрганизация Объединенных Наций приняла резолюцию, отменяющую эмбарго на поставки оружия стране [un_nation_global_target.GetName]. Совет Безопасности счел, что причины запрета на поставки оружия более не оправданы и что отношение правительства страны [un_nation_global_target.GetName] в последнее время было довольно восприимчивым. Генеральный секретарь выступил с замечаниями и отметил, что организация больше не считает, что угроза существует. Он выразил надежду, что правительство страны [un_nation_global_target.GetName] продолжит начатые им позитивные шаги. Некоторые дипломаты поддержали эти заявления, сказав, что санкции часто являются крайним средством, и как только они увидят положительные изменения, не будет особого желания продолжать санкции. Однако в частном порядке некоторые представители выразили опасение, что отмена санкций может привести к гонке вооружений в регионе."
 UN_RESOLUTION.25.d: "\nОрганизация Объединенных Наций проголосовала за предоставление свободы [un_nation_global_target.GetAdjective] сообществу. Голосование состоялось после оживленных дебатов по этому вопросу, но как только оно прошло, у всех делегатов возникло ощущение, что только что произошло событие исторического значения. Генеральный секретарь поблагодарил государства-члены за голосование и обсуждение резолюции. В своем выступлении он отметил, что право на самоопределение является важнейшим компонентом не только устава ООН, но и практически всех государств. Принятие резолюции показывает, что международное сообщество по-прежнему привержено идеалам и чаяниям всех народов мира."
UN_RESOLUTION.27.d: "\nПравительство страны [FROM.GetName] решительно отвергло резолюцию ООН, призывающую к независимости [un_nation_global_target.GetAdjective] сообщества. В своем заявлении они утверждают, что ООН не имеет юрисдикции или права диктовать им свои внутренние дела. Принятие резолюции ООН не только принесло бы в жертву их суверенитет, но и создало бы опасный прецедент. В заявлении также указывается, что резолюция и международная кампания, скорее всего, являются международным заговором, призванным разрушить единство и силу страны [FROM.GetName]. Вызывающее заявление было холодно встречено в ООН, а генеральный секретарь выразил глубокое разочарование. Совет Безопасности, вероятно, обсудит этот вопрос на своей следующей сессии."
 UN_RESOLUTION.28.d: "\n[FROM.GetAdjective] сообщество официально получило независимость от страны [un_nation_global_target.GetName]. Это произошло в ответ на недавнюю резолюцию ООН, призывающую к освобождению [FROM.GetAdjective] народа. Правительство страны [un_nation_global_target.GetName] выпустило очень краткое заявление, в котором говорится, что оно решило подчиниться резолюции ООН не из-за страха или давления, а потому что они тоже пришли к выводу, что этот путь является наилучшим для обеспечения мира. В Организации Объединенных Наций ведущие дипломаты были в восторге от этого события, назвав его одним из величайших проявлений самоопределения за последнее время. Международная пресса в основном поддерживает мнение о том, что этот результат является наилучшим для установления прочного мира."
 UN_RESOLUTION.29.d: "\nНедавняя резолюция [UN_SELECTION_BUTTON_3] после напряженных дебатов была с треском провалена в ООН. Аналитики считают, что резолюция не получила поддержки ведущих держав, а те, кто был в оппозиции, успешно доказывали, что потенциальные негативные последствия такой резолюции перевешивают любые положительные последствия. Несмотря на некоторое разочарование по поводу провала резолюции, многие дипломаты были удовлетворены тем, что в ООН международное сообщество смогло обсудить, провести дебаты, а затем проголосовать. Такой сценарий до недавнего времени казался практически невозможным."
 UN_RESOLUTION.30.d: "\nНа недавнюю резолюцию [UN_SELECTION_BUTTON_3] было наложено вето одним из постоянных членов Совета Безопасности ООН. Некоторые представители критикуют это вето, отмечая, что оно положило конец любым надеждам на завершение обсуждения резолюции и работу над достижением консенсуса. Другие критикуют вето за то, что оно является политической уловкой, направленной на защиту дружественного государства. Однако некоторые страны высказались в поддержку вето, обвинив первоначальную резолюцию в том, что она с самого начала была политически мотивированной. Это сделало вето не просто неизбежным, но и правильным решением. Независимо от этого, резолюция фактически умерла."
 UN_RESOLUTION.31.t: "Коалиция ООН наносит поражение коалиции [UN_Coalition_Target.GetName]"
 UN_RESOLUTION.31.d: "Воодушевляющая победа международной коллективной безопасности, коалиция ООН успешно остановила агрессию коалиции [UN_Coalition_Target.GetName] и нанесла им военное поражение. Совет Безопасности санкционировал военную интервенцию после того, как стало ясно, что коалиция [UN_Coalition_Target.GetName] не будет придерживаться призывов к миру. Командование ООН заявило, что успех операции объясняется эффективным международным сотрудничеством между партнерами по коалиции. Генеральный секретарь ООН отметил, что применение военной силы никогда не бывает желательным, но иногда оно необходимо для высшего блага.".
 UN_RESOLUTION.32.t: "Объявлено Прекращение Огня, поскольку коалиции ООН не удается продвинуться вперед"
 UN_RESOLUTION.32.d.: "Командование Организации Объединенных Наций подтвердило, что между его силами и коалицией [UN_Coalition_Target.GetName] теперь действует режим прекращения огня. По сообщениям, силы ООН, несмотря на огромные усилия, не смогли вытеснить коалицию [UN_Coalition_Target.GetName] с оккупированных ими территорий. Совет Безопасности ООН санкционировал военную интервенцию после того, как стало ясно, что коалиция [UN_Coalition_Target.GetName] не будет придерживаться призывов к миру. Генеральный секретарь ООН, как говорят, в полном отчаянии из-за провала интервенции. Многие аналитики сомневаются в том, что ООН может быть глобальной силой, способной защитить международную безопасность."
 UN_Intervention_Coalition: "Объявлено Прекращение Огня с участием Сил ООН"
  
 UN_RESOLUTION.1.d: "На недавней сессии Организации Объединенных Наций наша страна была открыто осуждена в резолюции за нарушение прав человека. Это действие наносит огромный ущерб нашему международному имиджу и туризму. Более того, это дает возможность врагам государства и оппонентам действовать еще более вопиюще, поскольку глобальное наблюдение за нашими действиями усиливается. Есть высокопоставленные правительственные чиновники, которые считают, что резолюция должна стать тревожным сигналом, и мы должны действовать, чтобы заверить международное сообщество и наш народ в справедливости нашей страны. Другая группа высокопоставленных чиновников утверждает, что голосование в ООН было результатом пропаганды и потенциально опасного внутреннего заговора против нас. Они утверждают, что мы не должны прекращать нашу необходимую политику, но мы, безусловно, можем работать над тем, чтобы скрыть ее от глаз общественности."
 UN_RESOLUTION.3.d: "Недавняя резолюция Организации Объединенных Наций осудила колониальные владения нашей страны. Резолюция ООН не признала всего того, что мы предоставили этим странам в плане безопасности, образования и экономики, но, несмотря на это, резолюция нанесла огромный удар по нашему международному имиджу. Несомненно, злоумышленники и заблуждающиеся элементы в колониях получат стимул, чтобы нанести нам новые удары или поставить нас в неловкое положение. Мы, конечно, можем сохранить нашу политику и присутствие в колониях, хотя и под угрозой дальнейших санкций ООН". Несколько высокопоставленных военных и колониальных чиновников поспешили отметить, что предпочитают именно этот вариант. Или же мы можем рассмотреть возможность подготовки планов деколонизации, чтобы противостоять негативному международному вниманию к нам. Некоторые высокопоставленные чиновники считают возможным освободить эти государства и сохранить сильное влияние, хотя это и не может быть гарантировано."
 #UN_RESOLUTION.10.d: "A recent resolution passed by the United Nations demanded we suspend and end our chemical weapons program. From the vote it is clear the international community views our program as a grave threat and to refuse may risk further actions by the United Nations. Accepting the resolution and beginning the process would no doubt end any escalation and some officials note that morally it may be the right thing to remove such weapons any ways. However, other officials, especially those in the military are urging we do not give in as these weapons are for national protection and are an internal matter. For them, the UN has no right to dictate what a sovereign state can do internally."
 #UN_RESOLUTION.10.d: "A recent resolution passed by the United Nations demanded we suspend and end our chemical weapons program. From the vote it is clear the international community views our program as a grave threat and to refuse may risk further actions by the United Nations. Accepting the resolution and beginning the process would no doubt end any escalation and some officials note that morally it may be the right thing to remove such weapons any ways. However, other officials, especially those in the military are urging we do not give in as these weapons are for national protection and are an internal matter. For them, the UN has no right to dictate what a sovereign state can do internally."
 UN_RESOLUTION.17.d: "Организация Объединенных Наций попросила нас прекратить военные действия и согласиться на прекращение огня. Организация Объединенных Наций обещает, что обеспечит вступление в силу такого прекращения огня, которое сохранит нынешние линии боевых действий и не позволит нашему врагу пытаться манипулировать ситуацией на фронтах в своих интересах в преддверии мирных переговоров. Мы должны проконсультироваться с высокопоставленными военными и представителями оборонного ведомства, чтобы узнать их мнение о том, следует ли нам продолжать борьбу."
 UN_RESOLUTION.22.d: "Недавняя резолюция ООН призывает к созданию коалиции, которая поможет установить мир в неспокойном регионе. Некоторые представители местной прессы призывают нас присоединиться к коалиции, чтобы продемонстрировать нашу солидарность и поддержку международного мира. Некоторые офицеры в армии также поддерживают эту идею, считая, что такая коалиция - это способ проверить войска и материальную часть в полевых условиях. Однако есть и противники: некоторые СМИ утверждают, что нам не следует вмешиваться в дела других стран. Кроме того, среди военных есть и другая группа, которая утверждает, что участие в таких силах подвергает жизни людей риску и тратит ресурсы без ощутимой выгоды. Нам предстоит сделать непростой выбор."
  
  
