 imf_decisions: "Решения Международного валютного фонда"
 imf_decisions_desc: "Международный валютный фонд (МВФ) - это пул международных финансовых ресурсов, в котором множество различных стран являются вкладчиками, выплачиваемыми МВФ членами по квоте, которая иногда берет кредиты у Всемирного банка.МВФ предоставляет кредиты, консультации и финансовую помощь странам, стремящимся взять кредиты на проекты или разрешить финансовые кризисы.Плащи,полученные от МВФ, увеличивают влияние МВФ в вашей стране. Это делает их более склонными влиять на национальную политику по снижению налогов и стимулированию косвенного экономического роста. Кроме того, они будут продвигать социальную политику, способствующую росту ВВП, такую как права женщин.§!\n\nЕжемесячный баланс: $[?IncomeCheck|2]M\nТекущий долг: [?currentDebt|2]M\nВлияние МВФ: [?influence_array_calc^IMF_POSITION|%0]"
