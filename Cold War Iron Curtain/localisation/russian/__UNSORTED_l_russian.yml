 CRO_insurgency_options.0.d: "На поздних этапах Второй мировой войны так называемое государство Хорватия и их фашистские хозяева в Берлине создали отряды партизан, называемых крестоносцами, чтобы действовать против наших освободительных сил. Многие из их командиров и бойцов-бывшие члены фашистского режима, и хотя они мало что сделали во время войны, они недавно активизировались. Крестоносцы пытаются заручиться поддержкой, особенно среди антиреволюционных сил, хорватских националистов и католиков, чтобы восстановить свой незаконный режим. Они обвиняют нас в том, что мы угнетатели и антихорваты. Однако мы покажем им, что их идеология и претензии не имеют никакого влияния на наш народ, который продолжает поддерживать правительство и нашу революцию. Все народы Югославии, особенно хорваты, признают гнусную ложь, распространяемую крестоносцами."
 CRO_insurgency_options.10.d: "Крестоносцы надеялись использовать террористическую тактику и фашистскую пропаганду, чтобы убедить хорватский народ присоединиться к ним и восстановить хорватское правительство. Тем не менее, народ не мог быть обманут, и их отсутствие поддержки гарантировало, что эти вражеские истребители стали легкой мишенью для наших сил. Они пытались подражать нашей военной тактике, но это была бледная имитация, и наше знание такой тактики делало их легко покоряемыми. Когда сдадутся последние отряды крестоносцев, мы воспользуемся этой победой для дальнейшего укрепления партии, расправившись с католической церковью и другими организаторами, которые явно симпатизировали крестоносцам. Наша победа и тесное сотрудничество с хорватским населением будут способствовать тому, что восстановленное югославское государство объединит все свои народы в единое целое."
 CRO_insurgency_options.11.d: "Югославские военные выводят свои последние силы из Хорватии сегодня после соглашения с правительством и хорватскими партизанами, известными как крестоносцы. Крестоносцы, состоявшие в основном из бывших солдат германского марионеточного хорватского государства, успешно сумели противостоять югославским силам и заручиться широкой народной поддержкой хорватского народа. При такой поддержке они смогли поставить югославов в незавидное положение перед лицом этнической и идеологической войны. Это поражение Югославии ставит вопрос о том, может ли коммунистический режим продолжать объединять под своим флагом многие народы или это поражение является началом постепенного распада всей нации. Несмотря на эти опасения, югославское правительство отметило, что революция остается сильной, и они просто удалили фашистскую раковую опухоль из тела."
 CRO_insurgency_options.3.d: "После сообщений о действиях крестоносцев в этом районе одно из наших подразделений установило вероятное местонахождение вражеских истребителей. Этот анализ оказался точным, так как был идентифицирован вражеский фермерский дом. Во время рейда наши войска штурмовали ферму, захватив и убив крестоносцев, находившихся внутри, без потерь. Вражеское оружие и припасы были захвачены. Судя по всему, эта группа бойцов перебралась жить к местным горожанам, но не нашла большой поддержки в их деятельности. Эта победа поднимет боевой дух наших людей и покажет народу, что мы сражаемся за них, а не против них."
 CRO_insurgency_options.4.d: "Наши войска получили донесения о местонахождении группы боевиков "Крестоносцев", проводивших диверсионные операции в этом районе. Они проследили их до жилого комплекса. Когда наши войска ворвались внутрь, они применили агрессивную силу и захватили здание. Однако оказалось, что крестоносцы уже бежали, и вместо этого жители комплекса были задержаны и подвергнуты агрессивным обыскам. Никаких документов, оружия или улик обнаружено не было, и местные жители в городе возмущены нашими действиями. Эта провалившаяся операция только подорвала имидж наших сил в АРЕ и усилила пропаганду нашего врага."
 CRO_insurgency_options.5.d: "Югославская авиация дает нашим войскам явное преимущество перед фашистскими крестоносцами. В недавней операции они успешно выявили концентрацию сил противника. Наши самолеты приблизились и успешно бомбили цель. Патруль, посланный для оценки удара, отметил, что были нанесены потери, и из протокола были найдены доказательства оружия и маркировки крестоносцев, свидетельствующие о точности ударов. С этим успехом противник будет более осторожен, чтобы встретиться в большем количестве, и это поможет защитить наши силы, действующие в этом районе. Местный командир позвонил своим товарищам по ВВС, чтобы поздравить их с успехом."
 CRO_insurgency_options.6.d: "Югославская авиация дает нашим войскам явное преимущество перед фашистскими крестоносцами. В ходе недавней операции они выявили вражескую концентрацию. Наши самолеты приблизились и успешно бомбили цель. Однако, когда патруль был послан для оценки удара, они обнаружили, что разрушенное строение не имело никаких признаков присутствия крестоносцев. Операция была провалена, но больше всего беспокоило то, что она вызвала гнев местных жителей, которые считают, что бомбардировка была нацелена на гражданское население. Они также критиковали использование авиации, говоря, что это указывает на то, что партия и правительство рассматривают их как вражеское население, и задавались вопросом, будем ли мы использовать такую огневую мощь в сербской общине."
 CRO_insurgency_options.1.d: "Крестоносцы являются преемниками нацистских коллаборационистов и жестоких фашистов. Наши разведывательные операции времен войны дают нам список бывших коллаборационистов и сочувствующих хорватским националистам. В ходе недавней операции наши разведчики завербовали некоторых из этих фигур и пригрозили раскрыть их сотрудничество с иностранными оккупантами в военное время, чтобы заставить их присоединиться к ячейкам крестоносцев и снабжать нас информацией. Крестоносцы очень подозрительно относятся к чужакам, но доверяют своим сторонникам в военное время. Завербованные люди успешно выполнили свою миссию и предоставили нам ценную информацию о тактике крестоносцев, их передвижениях и численности в этом районе. Мы планируем свернуть несколько ячеек и устранить присутствие крестоносцев в этом районе."
 CRO_insurgency_options.2.d: "Крестоносцы являются преемниками нацистских коллаборационистов и жестоких фашистов. Наши разведывательные операции времен войны дают нам список бывших коллаборационистов и сочувствующих хорватским националистам. В ходе недавней операции наши разведчики завербовали некоторых из этих фигур и пригрозили раскрыть их сотрудничество с иностранными оккупантами в военное время, чтобы заставить их присоединиться к ячейкам крестоносцев и снабжать нас информацией. Крестоносцы очень подозрительно относятся к чужакам, но доверяют своим сторонникам в военное время. Хотя операция была тщательно спланирована, завербованные люди оказались настоящими предателями. Информация, которую они нам предоставили, в конечном итоге привела наших людей к погоне за дикими гусями и позволила им проводить диверсионные операции. Они также заставили наших людей оказаться в компрометирующих ситуациях, что нанесло ущерб популярности нашего правительства среди народа. Попытки поймать и наказать этих предателей пока не увенчались успехом."
  
  #YANSA Events 
YANSA.100.d: "На протяжении почти тысячелетия народ шан в Восточной Бирме представлял собой смесь Бирманской, Тайской и Лаосской культур. История государства Шан была разбросана по векам, в основном из-за сильных споров между традиционными бирманскими королевствами, тайскими захватчиками и самим королевством Шан. В последнее десятилетие британское правление в Бирме было дезориентировано из-за Японских операций во время войны, что, похоже, положило конец правильно организованному колониальному управлению страной. Наконец-то государство, которое практически полтора века было вымершим, возродилось. Единственный вопрос, который остается... Надолго ли?".
 Collapse_Burma.1.d: "Бирма, одна из великих мистических земель востока, находившаяся под властью британцев с 1824 года, наконец-то увидела отблеск независимости. Колония Бирма получила известность благодаря решению не включать регион в состав Британской империи, а организовать его народы в отдельное бирманское колониальное государство. Британское владычество над Бирмой (известное как \"Бирманский Офис\"), наконец, казалось, подошло к концу. Сочетание внутренних и внешних факторов повлияло на колонию и администраторов. Официальное Союзное Государство Бирма объявило о своем создании, торжественно подняв государственный флаг новой молодой республики. Интересно, что молодое государство не проявило интереса к вступлению в Содружество в качестве официального члена этой организации, что является редкостью среди бывших колоний Великобритании."
 YANSA.200.d: "Бирманское правительство обратилось с просьбой о том, чтобы тела бойцов Гоминьдана, бежавших из материкового Китая после окончания гражданской войны, были захоронены во Франции. Многие из этих бойцов Гоминьдана действовали в составе бандитских групп, воруя урожай у бирманских фермеров и оказывая влияние на правительство Мандалая. Из-за многочисленных преступлений, совершенных этими группами, Гоминьдан приобретает все более негативное и уродливое восприятие среди населения Бирмы."
 YANSA.101.d: "Правительство Китайской Республики (ныне расположенное на острове Тайвань) в изгнании вместе с США согласилось поддержать создание ЮААНС, партизанских остатков сил Гоминьдана в изгнании, находившихся в Юньнани во время гражданской войны в Китае. ЮААНС(Юньнаньская Антикоммунистическая Армия Национального Спасения) продолжает сражаться с многочисленными группами бирманских сил безопасности в штате Шань, где находились очаги оккупации боевиков Гоминьдана. Учитывая многочисленные просьбы бирманского правительства вывести эти контингенты Гоминьдана из страны, территория ЮААНС будет служить небольшим буфером между Шан и взволнованной тайской границей."
 SS_HAITEN.1.d: "В ходе подготовки Операции «Земля» и ее материально-технического обеспечения по морю лидеры Гоминьдана на Тайване и организаторы партизанского движения Гоминьдана встретились в Тайбэе, чтобы обсудить планирование. Операция предусматривала доставку многочисленных партий вооружения и оборудования на побережье Тенассерима в Бирме. Кроме того, ветераны КНА должны были направиться в лагеря Гоминьдана для обучения и вооружения партизан. Согласно плану, эти силы в идеале должны были обеспечить безопасность коридора на побережье, продвигаясь в государство Шан. Фиаско началось, когда команда корабля (SS Haitien) не смогла связаться с кем-либо на берегу, в результате чего с корабля был построен импровизированный небольшой деревянный пирс. Неудачи продолжились, когда офицеры корабля не смогли получить никаких сообщений от командования Гоминьдана. Операция обернулась фиаско, и Тайвань снова оказался в центре внимания мировой общественности."
 SS_HAITEN.2.d: "Казавшаяся идеальной операция по пополнению запасов и вооружению партизан Гоминьдана в Шанской области Бирмы, проведенная тайваньскими чиновниками Гоминьдана, была осуществлена. Операция состояла в том, что многочисленные партии оружия и снаряжения должны были прибыть на побережье Тенассерима в Бирме. Кроме того, ветераны КНА должны были направиться в лагеря Гоминьдана для обучения и вооружения партизан. Согласно плану, эти силы в идеале должны были обеспечить безопасность коридора на побережье, продвигаясь в государство Шан. Корабль SS Haitien, назначенный Гоминьданом под личным руководством Чан Кай Ши, отправился в Бирму. По прибытии на побережье небольшой контингент войск Гоминьдана Яньсу ожидал команду, чтобы сойти на пляжи. Оттуда тайваньские офицеры вместе с ветеранами Гоминьдана направились в лагеря Яньсу."
  
Operation_Heaven.2.d: "С момента существования независимого Бирманского государства, остатки юньнаньско-китайских гоминьдановских армий, отступивших к бирманской границе, существовали в государстве с начала 50-х годов. США поддерживали оставшиеся в Бирме группы Гоминьдана со времен великого отступления, надеясь сдержать бирманское правительство с помощью влияния Гоминьдана. В 1953 году государство Бирма обратилось в Организацию Объединенных Наций с просьбой оказать давление на Китайскую Республику (Тайвань) с целью устранения различных групп влияния Гоминьдана , рассеянных на северо-востоке страны. Сейчас осталось лишь несколько групп Гоминьдана ..."
 KMT_BURMA.11.d: "По сообщениям из Мандалая, множество сельских городов в провинциях Шан и Качин были разграблены и разворованы мошенническим присутствием Гоминьдана в стране. Многочисленные группы Гоминьдана действуют в восточных штатах страны с момента окончания гражданской войны в Китае, действуя как пограничные контингенты в изгнании. У бирманских властей есть основания полагать, что нехватка припасов и продовольствия может служить оправданием для этих жестоких нападений. Народ Бирмы задается вопросом, почему правительство не предприняло дальнейших шагов по окончательному вытеснению иностранных кровопийц с земель далеко на востоке."
 Shan_Recognition.1.d: "Исторические связи между различными тайскими королевствами и шанскими народами в прошлые века оставили уникальное чувство родства в регионе. Решение тайского правительства официально признать независимость государства Шан от недавно разделенного Союза Бирмы вызвало много разногласий между двумя соседями. Можно ожидать, что военная и экономическая помощь из Таиланда вскоре поступит в независимое государство Шан, народы которого оторваны от остального мира. Признание Таиландом независимого государства Шан может привести к нарушению баланса сил между Бирмой и Таиландом, что в будущем приведет к напряженным разногласиям между двумя заинтересованными странами."
  
  
  #SSNP Insurgency 
 Integrate_The_SSNP: "Integrate the SSNP"
 SSNP_Insurgency_Decisions: "Syrian Social Nationalist Party Insurgency"
 SSNP_Insurgency_Decisions_desc: "The Syrian Social Nationalist Party (SSNP) advocates for a Greater Syria and the unification of all the fertile crescent Arabs. It rejects the present borders of Lebanon as a construct of colonialism and advocates for an association with Syria and preservation of the historical and cultural identity of the people. The group threatens the existence of Lebanon and offers an attractive ideology for many Lebanese. However, the government works to breakup the group as it threatens the fragile political order that holds the Lebanese state and society together.\n\nCurrent Strength: [?ROOT.ssnp_insurgency]%"
  
 SSNP_insurgency_options.3.d: "The Lebanese Army launched a successful raid today in Beirut. Local informants noted SSNP student activists were meeting in a local apartment building, plotting an attack on government targets. When the troops stormed in, they found SSNP members, documents, propaganda paraphernalia and weapons. Some students tried to fire at the assaulting troops, but they were neutralized. Raids like these continue to degrade the SSNP and will ensure the party does not spread its dangerous anti-state messages. One of the captured fighters was identified as the leader of an urban guerrilla cell that had launched several attacks on the Army. The local media was shown the weapons collected along with the hateful messages this cell planned to distribute to the residents in the city."
 SSNP_insurgency_options.4.d: "The Lebanese Army launched a raid on a residential building in Beirut. They had received information about SSNP student activists meeting to plot violence and spread hate. When the troops entered the building, confusion ensued and several of the occupants were shot by our soldiers. However, upon inspecting the scene, it became clear that though the occupants were SSNP members, they possessed no weapons, explosives, or publications that could be deemed hateful. The news that our forces are violently assaulting unarmed students has caused animosity among the people, especially the youths. The local commander claims the information about the students may have been planted by the SSNP to make the government look bad and weaken public support."
 SSNP_insurgency_options.1.d: "The SSNP enjoys a strong base of support in Beirut and other urban areas in Lebanon. The group makes extensive publications and especially targets young students to join their cause. In a recent operation at a major university, our intelligence agents recruited several students to join the SSNP and feed us information on their tactics, membership, and plans. The operation so far has been a success as our intelligence now has a clear picture on membership and activities of the SSNP at the school. If the time comes, we should be able to easily swoop in and uproot the SSNP rapidly from the campus."
 SSNP_insurgency_options.2.d: "The SSNP enjoys a strong base of support in Beirut and other urban areas in Lebanon. The group makes extensive publications and especially targets young students to join their cause. In a recent operation at a major university, our intelligence agents recruited several students to join the SSNP and feed us information on their tactics, membership, and plans. The operation had been seen as a success by our intelligence as they gained a clear picture on membership and activities of its members on campus. However, when we moved in to uproot the senior leadership and stop a plot to acquire weapons, we ended up arresting anti-SSNP members on campus. It turns out our infiltrators turned into defectors. They fed us false information and tricked us into acting, this has antagonized the anti-SSNP organizations against the government and has bolstered their arguments about state oppression."
 SSNP_insurgency_options.5.d: "The Lebanese Air Force launched a daring raid, dropping bombs and strafing a convoy that moving towards the countryside from Beirut. Upon inspecting the wreckage, the bodies of several senior SSNP activists and their cadres were found. More significantly, they were transporting arms and ammunition. It is believed they were trying to shift the arms to a store house and conduct arms training before returning to Beirut as urban guerrilla fighters. The successful operation by our small Air Force shows the daring professionalism of the armed forces and will teach the SSNP to not expand operations against the government."
 SSNP_insurgency_options.6.d: "A small military outpost reported it took heavy fire and casualties from a suspected SSNP group of fighters. The Lebanese Air Force identified a convoy near the outpost as the rebels fleeing. The planes bombed and strafed the vehicles. Upon inspecting the wreckage, our shocked investigators could not find any indication the vehicles contained SSNP members. In addition, no arms or uniforms were recovered. It appears the pilots had made an error but already the SSNP is using their media contacts to portray a message that we are punishing citizens without reason. The failure has hurt the morale of our pilots and hurts local support for the government."
 SSNP_insurgency_options.10.d: "The conflict between the Lebanese government and the SSNP reached an end today with the government legalizing the party. For years the SSNP had advocated for a Greater Syria and association of the fertile crescent peoples. However, the rise of Arab nationalism during the recent crisis in Lebanon threatened the integrity of the Lebanese political order. The government recognizes that in order to preserve Lebanon and counter the Arab nationalist threat it must bring groups like the SSNP into the political process. For the SSNP, the Arab nationalist vision of a grand Arab unification threatens the culture and historical identity of fertile crescent peoples and their ideology is already taking away members. Legalization will allow the party to focus on building its message and combating the threat of Arab nationalism. The Lebanese government is gambling that by bringing the SSNP into politics it will successfully draw support away from Arab nationalists in the country."
 SSNP_insurgency_options.11.d: "Military officers loyal to the  seized power in Lebanon today. The coup unfolded in Beirut when two of the officers led their soldiers and rapidly captured the cabinet and senior leadership of Lebanon. The rebels then took over a radio station and announced a new government. Military and police forces did not react, and party leaders moved in to take over. The lack of response is being attributed to a general shock among the security forces but regardless this allowed the SSNP to consolidate its hold. When the SSNP party leaders addressed the country they stated the coup was meant to preserve the cultural and historical identity of the people and defeat the rising influence of Arab nationalists in the government. They noted had the SSNP not acted, the Arab nationalists would have handed the country off to North Africans and Gulf Arabs who had no business telling them what to do."
  
