 insurgency_1256_desc: "Португалия с гордостью управляет Гвинеей-Бисау с 1446 года. С 1952 года эта территория стала продолжением португальской нации, сделав ее людей, землю и кровь нашими собственными. Несмотря на наши усилия по поддержанию правопорядка, здесь укоренился левый заговор. Так называемая Африканская Партия Независимости Гвинеи и Кабо-Верде (АПНГК) была создана некоторыми местными интеллектуалами и стремилась спровоцировать конфликт с нашим правительством и народом Гвинеи-Бисау. В 1959 году АПНГК подтолкнула докеров к забастовке, и в результате провокации, инициированной АПНГК, правительство было вынуждено любыми средствами подавить забастовщиков. АПНГК воспользовалась этим, чтобы увеличить поддержку, но все еще не представляла реальной угрозы. Отчаявшаяся группа недавно начала саботировать мосты, телеграфные линии и грабить отдельные административные пункты, но это были лишь действия отчаявшейся группы. Теперь пришло известие, что левая партия направила своих бойцов для нападения на армейский гарнизон к югу от Бисау, кроме того, поступили сообщения о передвижении вооруженных партизан в сельской местности. В своей последней отчаянной авантюре АПНГК прибегла к вооруженной борьбе, но португальская нация и военные с лихвой справятся с задачей по подавлению этой неприятности."
 insurgency_1257_desc: "На территорию Гвинеи-Бисау Португалия претендовала еще в 1446 году, но с развитием новых технологий и медицины им потребовалось время до XIX века, чтобы занять внутренние районы. В 1952 году португальцы приняли поправку к конституции, превратив территорию из колонии в провинцию и тем самым расширив материковую часть Португалии. Сопротивление существовало всегда, но в 1956 году Амилкар Кабрал и Рафаэль Барбоза основали Африканскую партию независимости Гвинеи и Кабо-Верде (АПНГК), став первой организованной партией сопротивления в колонии. В 1959 году они организовали крупную забастовку докеров, но португальская полиция жестоко подавила рабочих, убив десятки человек. После этого поддержка АПНГК резко возросла. Несмотря на рост АПНГК, португальские власти отказывались рассматривать их как серьезную угрозу. Однако ситуация изменилась в 1961 году, когда АПНГК начала кампанию саботажа против португальской армии, направленную против ее инфраструктуры. Это переросло в открытую войну, когда АПНГК начали атаку на армейский гарнизон, расположенный к югу от Бисау. То, что португальцы считали мелкой левацкой неприятностью, превратилось в партизанскую армию, открыто ведущую войну"
 Guinea_Bissau_War_of_Independence_category: "Война за Независимость Гвинеи-Бисау"
 Guinea_Bissau_War_of_Independence_category_desc: "Волна послевоенной деколонизации вдохновила левых и антиколониальных активистов в португальской колонии Гвинея-Бисау на создание Африканской партии за независимость Гвинеи и Кабо-Верде (АПНГК). На их попытки организовать забастовки рабочих против предполагаемой колониальной эксплуатации Португалия ответила жесткой военной силой. Португальцы пытались пресечь беспорядки силой, но вместо этого АПНГК усилила свою собственную тактику. К началу 1960-х годов АПНГК начала жестокую партизанскую войну против португальцев. Португалия должна решить, сможет ли она принять на себя издержки такой войны и пересилить своего решительного противника.\n\nПортугальские очки победы: [?POR.victory_points]\nОчки Победы АПНГК: [?GNB.victory_points]\n\nСоветское финансирование АПНГК: [?SOV.paigc_funding] млрд.\nЮгославское финансирование АПНГК: [?YUG.paigc_funding] млрд.\nКитайское финансирование АПНГК: [?PRC.paigc_funding] млрд.\nСенегальское финансирование АПНГК: [? SEN.paigc_funding] Миллиард\nГвинейское финансирование АПНГК: [?GNA.paigc_funding] Миллиард\n\nСтоимость баз АПНГК в Гвинее [?774.PAIGC_Camp_level]/20\nСтоимость баз ПАИГК в Сенегале [?272.PAIGC_Camp_level]/20"
