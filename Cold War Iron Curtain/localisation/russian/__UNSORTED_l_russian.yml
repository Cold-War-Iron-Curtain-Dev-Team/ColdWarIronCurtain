 Carl_Albert_TT: "Сын угольщика из Оклахомы, ростом 5 футов 4 дюйма, был вынужден сам финансировать свое обучение в колледже, получив в итоге стипендию Родса, после чего основал собственную юридическую фирму. После службы во Второй мировой войне он был избран в Конгресс как демократ, веря в либеральные реформы, но также в сдерживание коммунизма. Маленький гигант является убежденным сторонником использования правительства для улучшения общества, Альберт уделяет большое внимание развитию государственного здравоохранения для всех американцев. Его личность и лидерство делают его важнейшим лидером Демократической партии."
 John_McCormack_TT: "Один из самых долгоживущих демократов в Конгрессе. Адвокат из Массачусетса выступал за «Новый курс» и участие Америки во Второй мировой войне. Он знает, что остается приверженцем прогрессивной программы Демократической партии. Будучи убежденным антикоммунистом и сторонником уважения к старшинству, Маккормак терпеливо продвигался по карьерной лестнице Демократической партии. Эта непоколебимая приверженность традиционной партийной политике ставит его в противоречие с более молодыми конгрессменами-демократами, стремящимися к немедленным достижениям."
 Sam_Rayburn_TT: ""
 Robert_Michel_TT: ""
 John_Jacobs_Rhodes_Jr_TT: "Ветеран ВВС Джон Джейкобс Родс навсегда останется в памяти как первый республиканец, избранный от Аризоны. Его харизма и обаяние позволили ему оставаться популярным в округе, который никогда ранее не избирал республиканца, и он принес эту индивидуальность в Конгресс. Он быстро стал крупным республиканским лидером в Конгрессе, способным вести двухпартийную работу, сохраняя при этом партийные ценности."
 Gerald_Ford_TT: "После службы на флоте во время Второй мировой войны молодой Джеральд Форд был избран в Конгресс как республиканец от штата Мичиган. На праймериз он победил действующего республиканца-изоляциониста. Он быстро зарекомендовал себя как крупный переговорщик и организатор законодательной деятельности. Он стал ведущим умеренным в партии. Он поддерживает фискальный консерватизм и принимает реальность Америки как глобального игрока. Многие в Конгрессе считают Форда честным человеком и справедливым лидером своей партии."
 Charles_Halleck_TT: "Представитель Индианы стал известным лидером республиканцев во время президентских выборов 1940 и 1948 годов. Впервые он пришел в Конгресс в 1935 году и быстро стал влиятельным членом консервативной коалиции в Конгрессе. Будучи главным противником «Нового курса» и правительственных программ, Хэллек считал, что американцы должны жить так, как они хотят, а не так, как им велит бюрократ в Вашингтоне. Хотя он является ведущим членом консервативной коалиции, он рассматривает вопрос гражданских прав как потенциальный мост для двухпартийности. Он по-прежнему решительно выступает против государственных социальных программ."
 Joseph_Martin_TT: "Сочувствующий консервативный республиканский представитель от штата Массачусетс. Бывший редактор газеты играл ведущую роль в национальной Республиканской партии во время всех последних президентских выборов. Он выступал против Нового курса и тесно сотрудничал с консервативной коалицией. Многие демократы признают его как сильного партнера по двухпартийному законодательству, что дает ему огромное влияние. Однако более консервативные республиканцы считают, что его умеренные позиции ослабляют партию в ее основе."
