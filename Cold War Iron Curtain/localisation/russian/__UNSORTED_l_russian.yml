 Saudi_Extra_1_desc: "Today in a dramatic press conference, Egyptian president, Gamal Abdel Nasser has announced a failed assassination attempt that took place a day before. The attempt, plotted by King Saud, failed as the security chief hired for the job, was in fact an ardent Nasser supporter. The plan called for strapping a bomb to Nasser's jet and then detonating it mid flight. The Egyptians have proved the Saudi attempt by presenting the three checks given to the plotters for the deed. Tensions rose between the United Arab Republic and Saudi Arabia even further and this attempt is thought to be carried out in fear of Egypt's rising power and the newly formed UAR, uniting Egypt and Syria. Nasser has labelled Saud as an enemy of the Arabic people and the Egyptians are already rallying against the Saudis. The House of Saud is soon to hold a meeting on the matter and the King may be stripped of his power over this failure as well as other recent incidents...."
  
  #Qasim Iraq Events 
 Qasim.1.d: "For years the Anglo-American owned Iraqi Petroleum Company (IPC) exploited Iraqi oil for its own benefit. The old regime had been too dependent on the West and sought to accommodate IPC interests when negotiating agreements before the revolution. However, the new revolutionary regime of Prime Minister Abd al-Karim Qasim decided the era of Iraqi subservience to the IPC must end. Prime Minister Qasim has demanded a large stake in the IPC and that most profits go to the Iraqi state. The IPC refused and in response the Prime Minister directed a massive increase in tariffs. Today, the government announced the enactment of Law No. 80 to liberate Iraqi territory from foreign exploitation. The new law seizes 99.5 percent of the land conceded to the IPC over the years by the old regime and halts new oil explorations. No compensation will be given to the IPC and Prime Minister Qasim announced the land would be given to Iraqi farmers. In one move, he weakened the IPC, galvanized public support for his regime, and secured land to support the new government's land reform policies."
 Qasim.2.d: "Following the successful revolution and liberation of Iraq from the puppets of imperial powers, the Iraqi Free Officers must begin the process of dismantling the last vestiges of colonialism from Iraq. The corrupt monarchy had long been a stooge for British interests and they kept Iraqis tied to them and their dying empire. Prime Minister Abd al-Karim Qasim announced Iraq would no longer keep the Iraqi dinar pegged with the British pound. Instead the dinar will be pegged to the US dollar, though maintaining its original conversion. Iraq had long had its currency controlled by the British, first with the Indian rupee being introduced after World War I and then the creation of the Iraqi dinar at par with the British pound. By removing the sterling currency Iraq abandons the British financial world and ultimately makes the currency more competitive as the dollar has quickly become the global currency of the twentieth century."
 Qasim.3.d: "Following the Iraqi Revolution, Brigadier Abd al-Karim Qasim, the leader of the Iraqi Free Officers, announced the abolishment of the monarchy and formation of the Republic of Iraq. The revolution has now politically destroyed an institution it physically decimated during the revolution when the Free Officers oversaw the mass execution of senior royal family members and their supporters. As a new constitutional framework develops, it will be along the lines of a republican government. For many Iraqis the monarchy represented imperial control over the country. Throughout Iraq's history the King constantly sided with the British over the Iraqi people. Within the military this was most acute during the Anglo-Iraq War of 1941 when the Hashemites backed the British invasion of Iraq to crush the pro-Axis government. In the monarchy, the interests of the elites and their backers dominated governance, now as a republic, power would return to the Iraqi people."
 Qasim.4.d: "The Iraqi government under Prime Minister Abd al-Karim Qasim announced the ratification of the Interim Constitution. The new constitution approved in a referendum and presented by the cabinet declares Iraq a republic. Islam will be the official religion and the document calls for Iraq to be ruled by Arabs and Kurds together. Executive authority lies with the three-member Presidency Council and this is overseen by the legislative Ministerial Council. Finally, the judiciary is to remain independent from politics and should preserve Iraqi citizens their rights. Significantly, the constitution affirms Iraq's status as an Arab League member but calls for Iraqi identity to not be divided by ethnicity as it provides equal status to Arabs and Kurds. More importantly, the constitution places citizens as the source of authority for the whole nation, in stark contrast to the monarchical era where sovereignty rested in the royal family and power was kept among those at the very top. For the Kurds the new government has already announced its intentions to provide amnesty to Kurdish fighters from the uprisings in the 1940s as a sign that Arabs and Kurds will run Iraq as equals. Schools have also been asked to accept Kurdish as an official language for the classroom alongside Arabic. Despite the concentration of power resting with the two councils, Iraqis are optimistic the new constitution and guaranteed individual rights will usher a golden age for Iraqi political and social development."
 CENTO.2.d: "News of the Iraqi revolution sent shockwaves across the capitals and military headquarters of Central Treaty Organization (CENTO) members. Iraq had been a founding member and as an Arab state was critical for efforts to advertise the alliance in the region. Arab nationalist propaganda long called CENTO an imperialist project and this pressure hurt the alliance's ability to attract more members. The Iraqi Free Officers who bloodily overthrew the monarchy are ardent Arab nationalists and they have announced the new government would withdraw from all previous international alliances, including CENTO. As the alliance is headquartered in Baghdad, the new Iraqi government demanded it be evacuated, Turkey has offered to host the alliance in Ankara. The withdrawal of Iraq greatly weakens the alliance but the failure of the Americans or British to protect the Iraqi monarchy from this coup has also led to rumblings about whether the alliance offers any benefits. Several states are said to be considering if the benefits of working in CENTO outweigh the risks of incurring internal unrest or foreign interference. Time will tell if this action marks the beginning of the end for CENTO."
 Qasim.5.d: "The incredibly popular Kurdish leader and fighter Mustafa Barzani and his supporters arrived in Iraq today. The government of Prime Minister Abd al-Karim Qasim invited the Kurdish revolutionary to emphasize the seriousness of his government's proposals to forge a new Iraqi identity based on a shared Arabic-Kurdish cultural identity. The two leaders met with smiles and many Iraqis were thrilled at the sight of a senior Iraqi military officer and senior Kurdish guerilla fighter together as partners. For Qasim the move makes a lot of sense as he faces increasing pressure from more radical Arab officers in the military who want Iraq to embrace an Arab nationalist vision and unite the country with other Arab nationalists. More importantly, Barzani can help secure the acceptance of the new revolutionary government by the Kurdish people. For Barzani, his arrival and amnesty in Iraq has ended his long exile from Kurdistan and hopes to use Qasim to help him consolidate his political position within Kurdistan. The move highlights Arab-Kurdish unity to Iraq's citizens but for Qasim it blunts the radical Arab nationalist threat to his power and for Barzani it gives him a powerful ally in Baghdad he can work with as he consolidates power in Kurdistan. Whether this arrangement will last between the two remains to be seen as both men are ambitious and will not react kindly if they suspect betrayal."
 KuwaitDemands.1.d: "The Republic of Iraq has actively withdrawn from its commitments with us and are pushing Iraq into closer ties with the communist world. In the latest sign of Iraq's increasingly hostile attitude, its leader, Abd al-Karim Qasim announced he planned to incorporate Kuwait into Iraq. Iraq claims Kuwait was historically part of the Ottoman province of Basra and thus an integral part of Iraq. We have reports of a military buildup on the Iraq-Kuwaiti border and have received word Iraq expects a response from us regarding their demand for Kuwait. Intelligence notes Qasim is motivated to make these demands in order to garner support of Arab nationalist officers within a politically divided Iraqi officer class. The Kuwaitis themselves invoked our treaty obligation to defend the country in the face of threats but ultimately it is for us to decide whether to get involved. Choosing to support Kuwait's freedom from Iraq will help keep its strategic oil resources in friendly hands but cost us the deployment of military assets. It would also force Iraq to either invade or backdown. Though Qasim wants the support of nationalist officers, it is unclear if he will risk a war and his regime to get such support. Consenting to Iraq's demands will save us from having to commit assets in a foreign theatre but we will probably lose access to Kuwaiti oil fields. For Qasim our acceptance will strengthen his regime but this may prove beneficial as he is not likely to embrace the pan-Arab nationalists totally and can be expected to likely resist pan-Arab unification efforts in the region. We must now decide whether to reject Iraq's territorial demands and guarantee Kuwait or consent to Iraq's supposed historical claims to Kuwait."
 KuwaitDemands.2.d: "The British government announced it would back Kuwait and rejected Iraqi demands on Kuwait as baseless. The British Prime Minister is said to be consulting with his senior military staff to devise contingency plans for the crisis in Kuwait. This turn of events is no doubt a major blow to our just claims for Kuwait and the spreading of Arab liberation to another people's oppressed by a decadent monarchy bloated by its imperial masters. Our military officers are divided on how to respond, certainly the hawkish nationalists are telling the leadership we commit to our demands and take Kuwait by force. A rapid war of conquest can secure Kuwait before Britain arrives and once, they see the new status quo they will have to concede to the new reality. Our public proclamations have galvanized this part of the military and the general population as pro-government and pro-War rallies have taken place across the country. However, on the other side the other officer factions point out the disaster of the 1941 Anglo-Iraq War and that we could not expect the British to just back down once hostilities began. They suggest it would be reckless to sacrifice the Iraqi revolution and its tremendous gains just for public support and Kuwait with their backwards population. We must decide on whether to push forward with our demands and secure Kuwait forcibly, risking a major military conflict. Or if we should maintain our claim but reject a military solution and de-escalate the situation but at the cost of public humiliation and hostility from the Arab nationalist regimes in the region"
 KuwaitDemands.3.d: "The British government announced upon reviewing our just claims they agree and will begin the process of handing over Kuwait to Iraqi sovereignty. The Iraqi government thanked the British for their honesty and across Iraq mass rallies in support of the government have occurred. Across the Arab World the Republic of Iraq is now seen as a great revolutionary government committed to liberating all Arabs from decadence and imperialism. The tiny Kuwaiti military forces have stood down as our jubilant forces drove into Kuwait City to begin the handover process. The local British and Kuwaiti military officials stood down and formally handed administration over to our forces. There are news of sporadic rioting and shootings by our forces but our commanders in Kuwait insist they have the situation under control. We will soon be dispatching civil officials and a new military governor to oversee the integration of Kuwait to Iraq. Certainly our government now enjoys massive public support but more importantly, the divisions within our own military have calmed down as all factions now recognize the great leadership demonstrated by our success"
 MosulUprising.1.d: "Prime Minister Abd al-Karim Qasim has increasingly relied on the support of the Iraqi Communist Party to blunt the influence of the Arab nationalist Ba'ath Party. The Arab nationalists, especially from within the military, continue to agitate for Iraq to integrate itself with the United Arab Republic (UAR). These developments saw tensions rise between both factions across Iraq. After hearing about coup plots being hatched by Arab nationalist officers in Mosul, Qasim encouraged communists to march in a show of force. This led to street clashes between the two sides in Mosul and the deployment of local army units against the communists. Amidst the chaotic violence, the commander of the Mosul garrison, the Colonel Abdel Wahab Shawaf decided to attempt a coup against Qasim with support from nationalist officers and the UAR. Shawaf's forces executed communist leaders, took over the Mosul radio station, kidnapped a British oil technician, and called on sympathetic tribes and military units to join him. The coup attempt quickly failed as military support from other units failed to materialize and Qasim easily organized forces from Baghdad to breakup the rebellion, though Radio Mosul propagated the Ba'ath Party nationalist agenda. As the plot began failing, Colonel Shawaf was killed by his own men but the violence did not end as government forces arrived in Mosul to retaliate against the rebel troops and nationalists for their actions. Although Prime Minister Qasim did not really face a major challenge to his power, the UAR's support for the coup, has raised tensions between the two states. The communists were strengthened while the Ba'ath Party's Arab nationalist agenda gained a major platform. Both consequences ultimately weaken Qasim's position as he does not wish to become communist nor does he want to embrace the pan-Arab vision espoused by the Ba'ath."
 RamadanRevolution.1.d: "The tumultuous reign of Prime Minister Abd al-Karim Qasim came to a bloody end today. After three days of fighting, the Iraqi Ba'ath Party along with allies in the military released pictures of the bullet-ridden body of Qasim to the public. This announcement marks the end of the coup and confirms Colonel Abdul Salam Arif as Iraq's new leader. Prime Minister Qasim came to power after leading the military in overthrowing the Iraqi Hashemite monarchy. Qasim however, struggled to assert his authority and curtail the influence of multiple factions in the country. He long sought to use the communists as a counter-balance to pan-Arab nationalist fervor in Iraq. Yet his fear of communists meant he often purged the communists as well, leaving his base divided and weak. This political weakness and constant balancing were further hindered by Iraq's economic challenges and Qasim's mishandling of foreign affairs, especially with regards to Kuwait. The Iraqi Ba'ath Party recognized these weaknesses and after allying itself with pan-Arab officers, they decided to act. On the first morning of the coup, the communist head of the air force was assassinated and troops moved to secure Baghdad. Qasim and his supporters, including communists, resisted for three days before Qasim surrendered. The assassination and Qasim's purges meant the communist could not mobilize effectively which ultimately cost Qasim his life. Many analysts suggest the new regime may embrace pan-Arab nationalism and quickly move to achieve these goals. Rumors from Baghdad suggest soldiers are rounding up communist sympathizers across the city, further solidifying Ba'ath influence."
 RamadanRevolution.2.d: "Husain al-Radi announced on the radio that the Iraqi Communist Party has defeated the nationalist coup and will now administer the country. This marks the end of a bold coup attempt led by pan-Arab nationalist officers and the Ba'ath Party against the regime of Prime Minister Abd al-Karim Qasim. The Ba'athis had sought to end Qasim and communist sympathizers by beginning the coup with an assassination attempt on the communist chief of the air force, Jalal al-Awqati, this attempt failed. When rebel tanks moved to seize the radio station they were stunned to see Iraqi air force planes come in to stop their advance while communist sympathizers secured the station. In the ensuing violence the pro-Ba'ath military units overpowered the pro-Qasim forces, leading to Qasim's death in Baghdad. However, the Ba'ath failed to capitalize as they did not control the radio stations and their efforts to secure key sites were hindered by the establishment of communist strongholds across pro-communist neighborhoods in Baghdad. Without clear news regarding a Ba'ath victory, nervous Iraqi troops across the country began returning to their barracks while others joined the communist fighters operating out of their strongholds. The Ba'athist coup soon failed due to a lack of momentum and the communists emerged from their strongholds to declare victory. Ba'ath leadership is said to have gone underground and Husain al-Radi is expected to soon announce the Iraqi Communist Party's program for economic and social transformation."
 RamadanRevolution.3.d: "Prime Minister Abd al-Karim Qasim addressed the media with several detained senior Ba'ath and pan-Arab military officers standing behind him. Just five days earlier the officers and Ba'ath Party supporters launched a vicious coup to end Qasim's rule and push the country on a more pan-Arab path. Despite initially assassinating the communist air chief and seizing control of the country's radio station, the plotters ultimately failed to consider Qasim's popularity among Iraqis. Qasim long sought to play is base of supporters against one another and purge groups like the communists when they appeared too powerful, greatly hindering the ability of his supporters to mobilize support. However, Qasim's recent success with regards to Kuwait galvanized Iraqis and once the communists spread word of the coup, pro-Qasim forces and the communists saw scores of volunteers show up. The movement of Ba'ath forces and allies were also hindered in multiple pro-Qasim neighborhoods. All this allowed Qasim to rally his supporters and following his counter-attack, the Ba'ath forces virtually disintegrated, securing Qasim's victory. In his address Qasim thanked the Iraqi people for their aid and declared Iraq's revolutionary path will not be hindered by those forces who seek to destroy the unity of Iraq."
  
  
