GBN_1_desc: "Полевой офицер доложил в штаб, что его подразделение обнаружило неподалеку вражеский лагерь и полагает, что именно оттуда совершается ряд нападений на его подразделение. Он попросил разрешения на штурм позиции, и оно было получено. Самоуверенный командир АПНГК в лагере не сумел организовать оборонительные позиции, и наши войска легко преодолели позиции повстанцев. В ходе операции было убито и захвачено несколько вражеских бойцов, а также вражеская техника и документы. Наша разведка надеется использовать захваченные документы для уничтожения других ячеек АПНГК в этом районе."
 GBN_2_desc: "Местная операция командира батальона по уничтожению ячейки АПНГК и ликвидации инфраструктуры поддержки противника в местных деревнях закончилась полным провалом. Судя по всему, АПНГК были подготовлены к такой операции или информаторы выдали оперативные детали. Рейд наших сил в предполагаемые вражеские деревни не дал никаких разведданных или тайников с припасами. Когда наши войска вернулись на базу, они столкнулись с вражескими засадами и снайперским огнем, мы понесли потери. Неспособность достичь каких-либо целей и потери ослабили наш боевой дух, и можно ожидать, что АПНГК получит большую поддержку в этом районе."
 GBN_3_desc: "Местный командир и его отряд бойцов обнаружили, что в лагере португальской армии ослаблена охрана и не хватает личного состава. Спланировав и собрав бойцов в этом районе, наш командир начал налет на этот лагерь. Противник оказался совершенно не готов к нападению, и после короткого боя лагерь был захвачен с минимальными потерями. Важно, что в лагере были обнаружены тайники с оружием и припасами, а также взято несколько пленных. Несомненно, этот успех укрепит наше присутствие в этом районе и продемонстрирует нашу решимость продолжать борьбу за независимость."
 GBN_4_desc: "Агрессивный командир и его бойцы действовали на основании полученных от местного жителя разведданных об уязвимой оперативной базе португальской армии в этом районе. Почувствовав возможность нанести удар по врагу, командир приказал атаковать. Однако, судя по всему, информатор работал с врагом, и рейдеры попали в засаду на подходе, что привело к большим потерям и контратаке, в результате которой был захвачен наш местный лагерь. Документы, оборудование, пленные и тяжелые потери были получены в ходе этого неудачного рейда. Это, несомненно, повысит боевой дух противника и понизит наш собственный."
  
expel_militant_bases_tt: "Это изгонит все лагеря боевиков из страны, имейте в виду, это улучшит отношения и снизит напряженность с колониальной державой, но снизит нашу репутацию среди сторонников боевиков"
 insurgency_funding_inc_tt: "Это действие увеличит финансирование на 1$ миллиард, расходы на это будут вычтены из нашего ежемесячного дохода"
 insurgency_funding_dec_tt: "Это действие уменьшит финансирование на 1$ миллиард ежемесячно"
 increase_camp_level_one_tt: "Это действие увеличит уровень нашего тренировочного лагеря на один в этом регионе и увеличит количество живой силы и опыта, которые мы получим со временем"
  
 op_trident_desc: "Операция прошла идеально для португальцев: правительственные войска выбили вражеских партизан с их позиций. Повстанцы АПНГК были вытеснены из Комо, он был закреплен за правительством и должен стать для него стратегической базой для дальнейших операций."
 op_cyclone_desc: "Этим утром 12-я эскадрилья десантников отправилась в Кафал-Каффейн, у них был приказ охранять ОО и исследовать разбившийся F-86 «Сейбр», они были введены в ОО без единой проблемы, по пути они обнаружили лагерь АПНГК рядом с местом крушения, лагерь был уничтожен без потерь. Крупная победа Португалии."
 op_vulcano_desc: "Сегодня вечером 40-й полк коммандос совершил рейд на местную базу АПНГК, где, по слухам, находились кубинские командиры, их ввели в зону ответственности пешком, они прорубили дыру в заднем заборе комплекса и с боем пробились через него, очистив его вскоре после этого."
 op_little_cat_desc: "Несколько месяцев назад португальские колониальные регулярные войска выставили заставы вдоль сенегальской границы, чтобы не допустить партизан из Сенегала на помощь АПНГК, и это оказалось довольно успешным, так как до сих пор ни одна застава не была скомпрометирована."
 buba_attack_desc: "В ночь на 16 октября 1969 года. Сотни гвинейских повстанцев напали на наш лагерь прямо за Бубой, в котором находилась только рота бойцов, вражеские повстанцы обстреливали лагерь из минометов, официальное число убитых - 267 повстанцев и 12 наших"
 op_jove_desc: "Пару часов назад группа десантников только что вернулась с задания в Гидадже, они установили пару подслушивающих устройств на тропе, то, что они принесли с собой, является жизненно важной информацией, содержащей сведения о партизанских ячейках по всей стране"
 op_amethyst_desc: "После месяцев напряженной работы, наши Контрпартизанские Операции принесли свои плоды, судя по тому, что мы слышали от врага, повстанцы в районе Гидахе были полностью уничтожены, а наши потери сведены к минимуму. "
 op_griffin_desc: "Мы провели короткую, но решающую засаду, чтобы остановить проникновение повстанцев в наши районы, этот бой остановит любые проникновения в наши районы на некоторое время, благодаря профессионализму и превосходству наших десантников."
  
 op_green_sea_desc: "В сумерках, 21 ноября 1970 года. Четыре десантных корабля португальского флота перебросили около 420 человек в Конакри, чтобы спасти 26 заключенных, содержащихся в комплексе, десантные корабли переправили людей, некоторые высадились возле летнего дома президента Туре, который они сожгли, они двинулись дальше в город, захватив 2 армейских поста, городскую электростанцию и штаб-квартиру АПНГК, но им не удалось захватить всех важных членов АПНГК, как только они оказались на электростанции, они спасли 26 заключенных, некоторые находились там годами, они были погружены на десантные корабли и ушли сразу после полуночи, 22 ноября. "
 op_green_sea_fail_desc: "В сумерках, 21 ноября 1970 года. Четыре десантных корабля португальского флота перебросили около 420 человек в Конакри, чтобы спасти 26 заключенных, содержащихся в комплексе, однако, высадившись на берег, гвинейские солдаты быстро повернули против наших солдат, завязалась интенсивная перестрелка с партизанами АПНГК, которые быстро усилили 200 дезертировавших солдат, наши солдаты были вынуждены отступить и отказаться от миссии, понеся 52 потери, 26 заключенных были переведены в другую заброшенную тюрьму, или так мы слышали, да поможет им Бог. ...пока продолжается эта война, они никогда не увидят свет."
 op_green_sea_fail_gui_desc: "Прошлой ночью империалисты высадились на нашем берегу в Конакри, они использовали местных коллаборационистов и контрреволюционеров, прижав нас друг к другу... они сожгли президентский дворец и наши посты в городе, мы были застигнуты врасплох, и даже более того, мы были ошеломлены тем, как наши братья могли совершить такое."
  
paigc_defeat_desc: "Первоначальной реакцией португальцев на мирные протесты и забастовки рабочих под руководством Африканской Партии Независимости Гвинеи и Кабо-Верде (АПНГК) стало жестокое подавление. Колониальные власти считали, что демонстрация силы заставит народ Гвинеи подчиниться. Эта тактика не оправдала себя, поскольку вместо этого АПНГК организовала повстанческое движение, вынудив Португалию направить дополнительные войска и потратить значительные средства из своих ограниченных ресурсов. АПНГК пользовалась поддержкой соседних государств и местных жителей. Поначалу португальским войскам с трудом удавалось сдерживать партизан, но ряд реформ изменил ситуацию. Португальские колониальные власти вложили значительные средства в создание общественных служб для местных жителей, а военные скорректировали свою тактику и начали проводить мобильные, мелкомасштабные рейды, направленные против бойцов АПНГК. Португальцы понимали, что конфликт будет на истощение, и со временем местные жители стали переходить на сторону АПНГК или устали от боевых действий. Кроме того, АПНГК сильно пострадал от новой тактики, что подорвало его моральный дух, особенно после нескольких крупных трансграничных рейдов, в ходе которых были убиты высокопоставленные лидеры повстанцев в соседних государствах. Вчера вечером в гвинейской столице Бисау португальское колониальное и военное руководство подписало соглашение о капитуляции с лидерами АПНГК. По всей колонии вооруженные боевики начали выходить из кустов, чтобы сдать оружие сотрудникам колониальной службы безопасности. Несмотря на высокую цену, Португалия продемонстрировала свою волю и желание не сворачивать с пути колониальной империи."
 paigc_win_desc: "Первоначальной реакцией португальцев на мирные протесты и забастовки рабочих, возглавляемые Африканской Партией Независимости Гвинеи и Кабо-Верде (АПНГКГК), было начало жестоких репрессий. Колониальные власти считали, что демонстрация силы заставит народ Гвинеи подчиниться. Эта тактика не оправдала себя, поскольку АПНГК вместо этого организовала восстание, вынудив Португалию направить дополнительные войска и потратить значительные средства из своих ограниченных ресурсов. С самого начала АПНГК удавалось совершать молниеносные партизанские рейды и расширять операции по всей колонии. Местные жители, вдохновленные глобальной волной деколонизации, а также неприязнью к жесткой португальской тактике, пополняли ряды АПНГК. Кроме того, помощь оказывали соседние государства, что оказывало сильное давление на португальские силы. Португальские войска адаптировали свою тактику и попытались провести реформы, чтобы переломить ход борьбы с АПНГК. Однако, несмотря на улучшение военных показателей, этого все равно было недостаточно, чтобы остановить рост и эффективность ПАИГК. Признав, что больше не может продолжать курс, португальское правительство и руководство АПНГК подписали сегодня в Алжире соглашение. Война окончена, и Португалия выводит свои войска, оставляя Гвинею для АПНГК".
  
 portugal_raid_sen_desc: "Правительство Сенегала долгое время поддерживало АПНГК и их операции, позволяя своей территории выступать в качестве операционной базы и тренировочного лагеря боевиков АПНГК. После того как пограничный пост подвергся сильному обстрелу со стороны боевиков АПНГК, которые быстро отступили обратно в Сенегал, наш местный командир приказал воздушно-десантному подразделению подготовить операцию по преследованию и ликвидации вражеской базы в Сенегале. В результате операция застала врага врасплох, поскольку он не ожидал нападения через границу. Наши войска понесли большие потери, захватили пленных и документы. Сенегальские власти пока хранят молчание."
 portugal_raid_fail_sen_desc: "После серии успешных нападений на наши пограничные посты рядом с сенегальской границей наши местные силы решили нанести ответный удар. Наши силы собрались на границе и после длительного периода сбора пересекли ее, чтобы уничтожить оперативные базы АПНГК. Однако АПНГК были готовы, мы полагаем, что они проследили за сбором сил и, как только наши силы пересекли границу, они обнаружили брошенные лагеря. Вернувшись на нашу территорию, они столкнулись с атаками повстанцев и понесли потери. АПНГК и Сенегальцы использовали изображения нашей уничтоженной техники в качестве доказательства португальской агрессии."
  
 portugal_raid_gna_desc: "Боевики и лидеры АПНГКпользовались безопасным убежищем в Гвинее. Их силы могли тренироваться, планировать и отдыхать в безопасности гвинейской территории. Офицер среднего звена в Бисау разработал план рейда на вражеские лагеря через границу. После того как план был одобрен и принят высшим руководством, операция была приведена в действие. Ошеломленные бойцы и командиры АПНГК были убиты и взяты в плен в большом количестве, включая многих необученных новобранцев. Наши силы понесли минимальные потери, а успех помешает вербовке противника, а благодаря количеству захваченных документов мы будем надеяться уничтожить больше вражеских позиций."
 portugal_raid_fail_gna_desc: "Сегодня в столицу Бисау пришли ужасные новости. Чрезмерно усердное подразделение, дислоцированное у границы с Гвинеей, решило расширить рамки запланированного рейда на предполагаемые лагеря местных  из АПНГК и включить в него лагеря, расположенные по другую сторону границы в Гвинее. В результате операции подразделение понесло большие потери, столкнувшись с вражескими засадами после пересечения границы с Гвинеей. Провал операции и потери, которые мы понесли в Гвинее, используются в качестве пропаганды для поддержки гвинейского правительства и АПНГК .Государства региона также осуждают наши операции."
  
 expulsion_of_paigc_gna_desc: "Когда португальские власти начали репрессии против Африканской Партии Независимости Гвинеи и Кабо-Верде (АПНГК), убивая протестующих работников доков, руководство АПНГК бежало в соседнюю Гвинею. Гвинейское правительство придерживалось идеологических, социалистических взглядов в отношении АПНГК, и его столица Конакри стала штаб-квартирой АПНГК. Гвинея предоставляла оружие, обучение, снабжение, базы и тренировочные лагеря. С баз в Гвинее бойцы АПНГК могли атаковать португальские войска по всей восточной и южной границе колонии. Протесты и гнев португальцев не остановили поддержку АПНГК со стороны гвинейского правительства. Однако ситуация изменилась, поскольку Португалия недавно изменила свою тактику. Ссылаясь на право преследования по горячим следам, португальские войска начали совершать рейды и нападения на базы АПНГК на территории Гвинеи. Гвинейские войска в лагерях и гражданские лица, оказавшиеся под перекрестным огнем, сильно пострадали. Кроме того, португальцы наносили авиаудары и даже совершали рейды в Конакри, чтобы уничтожить высокопоставленных чиновников ПАИГК. Под таким огромным давлением гвинейское правительство объявило, что изгонит АПНГК со своей территории. Они сослались на несостоятельность АПНГК как военной силы и обвинили ее членов в попытке захватить Гвинею. Эти обвинения не были доказаны, и многие считают это средством сохранить лицо за уступку требованиям Португалии."
 expulsion_of_paigc_sen_desc: "Как и большинство постколониальных государств, Сенегал твердо привержен антиколониальным идеям, а его руководство, кроме того, придерживается панафриканизма. Когда португальские власти на первых порах пресекли деятельность Африканской Партии Независимости Гвинеи и Кабо-Верде (АПНГК), некоторые лидеры АПНГК бежали в Сенегал, который граничит с северной частью колонии. Поскольку АПНГК превратилась из политического движения протеста в вооруженное повстанческое движение, сенегальцы предложили ей оружие, припасы и тренировочные лагеря в безопасных пределах своих границ. Поддержка АПНГК соответствовала стремлению Сенегала поддерживать антиколониализм, а предоставление своей территории давало АПНГК безопасную базу для операций. Бойцы АПНГК могли легко наносить удары по северной части Португальской Гвинеи, а затем отступать в безопасное место в Сенегале. Португальские протесты по поводу действий Сенегала были проигнорированы, но недавно все изменилось. Португальские войска, используя право преследования по горячим следам, начали совершать рейды и нападения на лагеря АПНГК через границу. Эта агрессивная тактика и разрушительные рейды привели к тому, что сенегальцы также понесли потери. Столкнувшись с риском потенциальной войны и разочаровавшись неспособностью АПНГК эффективно реагировать на эти нападения, Сенегал объявил, что изгонит ПАИГК со своей территории. Он обвинил АПНГК в совершении \"безрассудных\" действий, которые ставят под угрозу интересы Сенегала, и заявил, что бойцы АПНГК вмешиваются в дела местных жителей Сенегала."
 americo_liberian_minority_rule_desc: "Иммигранты бывших рабов из США и их потомки, америко-либерийцы, несмотря на меньшинство, постоянно доминируют в политической, социальной и экономической жизни Либерии с момента основания страны в 1847 году. Коренные жители недовольны ограниченным избирательным правом и законами, которые, по их мнению, укореняют дискриминацию, что приводит к напряженности в обществе. Несмотря на это, американо-либерийцы продолжают настаивать на том, что только благодаря им Либерия сможет достичь процветания и современности."
  
