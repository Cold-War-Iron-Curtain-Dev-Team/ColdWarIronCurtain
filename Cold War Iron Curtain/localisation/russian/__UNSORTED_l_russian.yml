 Shanghai_Campaign.1.d: ""
 Shanghai_Campaign.2.d: "После ожесточенной кампании НОАК была вынуждена признать, что ее войска не захватили Шанхай, крупнейший и самый экономически мощный город Китая. Контроль над городом считается необходимым для любой из сторон, чтобы претендовать на победу. И те, и другие выделили для кампании крупные военные силы. РПЦ твердо верит, что контроль над городом необходим для обеспечения базы, с которой можно освободить материк. КНР хотела взять город, чтобы узаконить свой режим и серьезно ослабить сопротивление РПЦ. РПЦ утверждала, что ее войска ослабили наступление коммунистов, и публиковала фотографии уничтоженной техники КНР на поле боя. НОАК не ответила на претензии о больших потерях, но заявила, что ее силы оценивают ситуацию. Победа РПЦ — это серьезный толчок для правительства, которое оправдано своей сосредоточенностью на защите города. Многие наблюдатели конфликта предполагают, что НОАК теперь может быть уязвима для контратак, а поддержка РПЦ на подконтрольных ей территориях находится на небывало высоком уровне."
