 NF_Iran.10.d: "После смерти легендарного конституционалиста и популярного лидера Мохаммеда Моссадыка Национальный фронт столкнулся с дилеммой, кто придет к власти. После долгих обсуждений и с ростом левых внутри партии было решено, что руководство возьмет на себя Карим Санджаби. Опытный юрист, Санджаби был близким союзником и членом кабинета Моссадыка. Его непоколебимая лояльность Моссадыку наряду с его левыми взглядами делают его идеальным кандидатом. Многие в партии утверждают, что Санджаби является естественным преемником и приведет партию к будущему успеху. Его долгая карьера в политике и правительстве также считается главным плюсом в управлении опасным полем иранской политики."
 Khomenei.1.d: "Аятолла Рухолла Хомейни недавно был изгнан из Ирана. Иранское правительство приняло это решение после взрыва насилия, который разразился из-за его проповедей, осуждающих шаха и правительство за его политику. Хомейни в настоящее время находится в Турции, но, как ожидается, в конечном итоге поселится в священном шиитском городе Наджаф в Ираке. Иранские власти считают, что его высылка из страны ослабит его контроль над своими последователями по всему Ирану."
 Iran_Coronation.1.d: "Шах Мохаммед Реза Пехлеви был официально коронован во время экстравагантной коронации в Тегеране. Ранее он носил титул короля, но на коронации принял древний титул шаханшаха (Царь царей). Новый титул подчеркивает его связь с долгой историей иранской королевской семьи и поддерживает его усилия по привязке иранской идентичности к древнему культурному прошлому. Когда шаха спросили, почему он выбрал свою коронацию после десятилетий пребывания на посту короля, он заявил, что Иран был бедной страной, когда он взошел на трон, и теперь он заслужил свой титул. На аудиенции к нему теперь будут обращаться \"Его Императорское величество\", а не \"Его Величество\"."
