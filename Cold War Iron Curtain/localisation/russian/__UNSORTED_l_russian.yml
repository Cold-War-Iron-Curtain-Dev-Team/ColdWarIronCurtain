 IRQ.9901.d: "The Hashemites have had a long and historical relationship with the Hijaz. The family traces its ancestry to the Prophet and the early Hashimites competed with other factions for the title of Caliph. Within three centuries of Islam's founding, the title of Sharif and Emir of Mecca was given to the Hashimites. The dynasty oversaw the holy land and preserved it for the whole Islamic world. During World War I, Hussein bin Ali and his four sons revolted against the decadent Ottoman Empire after receiving promises from the British it would support a new Arab empire with a Hashimite caliph. These promises were not kept but after the war the Hashimites did establish kingdoms in Jordan, Iraq, and the Hijaz. However, in 1925 the Saudis drove the Hashimites out of their ancestral home in Hijaz. Now the Saudis appear weak, opposition to their rule grows and Hashimite loyalists still in the holy land have started a revolt to end Saudi rule. The Saudi policies of destroying historical relics and undermining the traditional powerbases of Arabia have resulted in a backlash for those who wish for the Hashimites to return. The rebels have appealed to the Hashimite powers of Iraq and Jordan for support. Both are expected to offer arms, volunteers, and diplomatic support. Both rulers have long desired to avenge the humiliation their family suffered in 1925. Saudi arrogance and disrespect for the traditions of Arabia will now cost them as the people flock to restore Hashimite rule."
 IRQ.1753.d: "Iraq is perhaps the most arbitrarily designed state that emerged from World War I. The British merged three distinct Ottoman provinces to create Iraq. The new state lacked ethnic, religious, or linguistic homogeneity. The Arab majority was divided into Sunnis and Shias. The country had a sizable Kurdish minority concentrated in the north. A sizable Assyrian Christian population existed along with a large Jewish community in Baghdad. The British sought to rule Iraq through treaties with a friendly government to secure its interests and avoid expenses. Faisal ibn Hussein, recently deposed by the French in Syria, was brought by the British to become King Faisal I of Iraq. Despite lacking any connection to the land, King Faisal I proved adept at mediating Iraq's factions and establishing the legitimacy of his dynasty with the people. His death in 1933 brought the inept King Ghazi to the throne. After King Ghazi's death in 1939, the three-year-old King Faisal II took over but power rests with the regent, Prince Abdullah. King Faisal I's early death saw parliament dominated by aging Ottoman-era politicians who constantly rotate power in parliament. The military has overthrown several premiers since Prince Abdullah's regency began, though they have chosen to not overthrow the system.  World War II witnessed the Hashemite's biggest challenge as nationalist army officers seized power. The Hashemites and parliament returned to power only after a British invasion, forever tainting the Hashemite state in the eyes of an increasingly nationalistic population.  The Iraqi state's centralizing policy saw brutal repression as the army suppressed the Kurds and Assyrians. In addition to resistance to centralization, the anti-colonial middle class and leftist agitation among urban workers are all emerging threats to the Hashemite Iraqi state. Time will tell if King Faisal II can end the political uncertainty and restore the people's trust in the dynasty."
 IRQ.9998.d: "Frustration and anger towards the political repression in Iraq and British interference has boiled over to protests and strikes against the monarchy and the 1948 Anglo-Iraqi Treaty. For far too long, the protestors believe, Iraq has had its foreign policy dictated by London while the Hashemite dynasty curtailed any expressions of political discourse. In the midst of this unrest, King Faisal II published a public denouncement against the Constitution Party. He says the party has fanned the protestors anger and has sought to provoke a civil war in the name of its own political gains. He says in reality much of what the protestors are complaining about are actually caused by the Constitution Party and because the protests are targeting the royal family, the Constitution Party refuses to help calm the unrest. This condemnation of the Constitution Party has surprised many in Iraq and it remains to be seen if the King's effort to place the blame and responsibility on the Party will aid its ability to calm down the unrest sweeping Iraq."
 IRQ.9999.d: "The Iraq Central League consists of football teams from clubs and institutions based across Baghdad. Despite being one of four regional leagues in the country, the Iraqi Central League is considered the premier Iraqi football league. Its champions go on to represent Iraq in the Asia Club Championship. The Haris Al-Maliki club is considered the powerhouse club in the country. However, all the matches appear to be popular, as they often attract sold out crowds. In addition, many Iraqis follow the results closely in the media with hopes their team can come out on top. Major institutions like the police and army also field teams giving members of such institutions more reasons to support their team. The Iraqi football love keeps the population happy during the league season and allows rival institutions to resolve their tensions on the pitch instead of on the streets. What a beautiful game it is."
 IRQ.9996.d: "Today, King Faisal II of Iraq achieved his majority and has taken his place as ruler of Iraq. Although he ascended the throne at age 4 in 1939 following the death of King Ghazi, his father, the country had been governed by his regent and pro-British uncle Prince 'Abd al-llah. King Faisal II started the coronation by traveling in an open carriage led by smartly dressed cavalrymen to attend the Iraqi Majlis. He entered the parliament with troops at attention in ceremonial uniforms, all along European lines. After addressing the Majlis, King Faisal II took the oath of kingship and accepted a pledge of loyalty from the Majlis and Iraqi people by the President of the Senate. Following the ceremony the King attended a massive reception where he hosted notable dignitaries, including the Duke of Gloucester. The European style uniforms and practices throughout the coronation indicates King Faisal II hopes to continue the policies of his uncle. Whether he can contain the rising threat of pan-Arabism and Arab nationalism remains uncertain as despite the magnificent ceremony, there were reports of Iraqis from middle class neighborhoods complaining of the coronation's expenses. In working class districts some Iraqis were put off by an event where the King was surrounded by armed guards and not the people of Iraq."
 IRQ.9995.d: "Ali Jawdad al-Ayoubi has long served the Hashemites in Iraq. After serving for Faisal's short-lived Syria regime he followed him to Iraq. He took on major leadership positions and diplomatic posts, including several stints as Prime Minister for Iraq. Al-Ayoubi, a seasoned political leader recognizes the changing global order following the end of World War II. In a dramatic diplomatic maneuver, al-Ayoubi flew to Washington D.C. to personally open an Iraqi embassy in the American capital. The Iraqi government recognizes the British are not the paramount power it once was. If the Hashemites are to survive against the rise of anti-monarchal, pan-Arab nationalism and communist agitation it will need to strengthen its ties with the Americans and the new embassy will be the first step in this process. Media in the US reported local excitement and interest to the senior Iraqi leader's dramatic decision to fly in to personally open an embassy. In Iraq the move is praised as recognizing the global order while anti-monarchists point to this action as Iraq continuing to surrender its sovereignty to colonial forces."
 IRQ.9980.d: "Today, the kingdoms of Iraq and Jordan, have announced to form an Arab Federation, which many see as a response to the United Arab Republic, formed by Egypt and Syria. King Faisal of Iraq and his cousin, King Hussain of Jordan, both descendants of the Hashemite dynasty, that ruled Arabia till 1921, have disclosed that they had long been planning an Arabic union of states. This union, is seen as a direct consequence of Iraq leaving the Baghdad Pact and to ensure the country's independence from their western Arabic counterpart, Egypt.Although a federation by name, many see the new state to be a confederation and has upset a lot of people. The United Arab Republic has yet to make any formal statement on this, though there are reports of Israeli mobilization . Nevertheless, this is a monumental step for the Middle East, and possibly for the world."
 kurdish_conflict.1.d: "The Kurds have long resisted efforts from the Iraqi state to implement a strong, central government. The Kurds oppose the pro-Arab nationalist school system, lack of protection for their own language and culture. In addition, they oppose efforts by the state to forcibly settle Kurdish communities and change their modes of life. Iraq has traditionally deployed the army to enforce its will on the Kurds but the cycle of armed violence between both groups has proven costly over the years. A new initiative has arrived to help reduce the animosity between the Kurdish population and government. The Iraqi government will reduce military checkpoints and raids. In addition, educational institutions will allow students to speak Kurdish in school, alongside Arabic. Politically, local officials will be given more discretion in dealing with Kurdish tribal groupings, especially with Kurdish chieftains. Giving them more say in government policy will help them buy into the state while not compromising on centralizing state policies. These concessions can help reduce tensions and once things settle down, we can return to bringing the Kurds into the Iraqi state on our terms."
 IRQ.9997.d: "Tawfiq al-Suwaidi has decided to accept King Faisal II's invitation to form a new government and work with the Hashemites. A brilliant lawyer and former Prime Minister who grew up in the late Ottoman Empire, al-Suwaidi rose to prominence during the British mandate era. Today, he is a seasoned politician and international figure. The Hashemites had hoped his pro-Western leanings would translate to support for their regime but al-Suwaidi has historically proven himself to be a believer in Western principals of representative democracy and individual rights. The Iraqi royal family viewed his previous stints as Prime Minister with suspicion as he allowed political parties to function and directed the interior ministry to relax its operations, particularly against leftists. However, the situation Iraq finds itself in requires strong leadership and a man of al-Suwaidi's experience and reputation outweighs the risks of his lifting government restrictions and surveillance of dubious groups in the country. For Tawfiq al-Suwaidi he has had a long history of clashing with the Hashemites but he too feels the time maybe right for a more successful relationship and perhaps a more democratic Iraq."
 Abadan_Crisis.1.d: "The decision of the Iranian government to nationalize its oil in defiance to its treaties and the rage of Britain has sent shockwaves across Iraq. Iraqis have applauded Iran for securing its sovereignty and defying imperialism while recognizing its own government continues to accept colonial British concessions. Many Iraqis now openly call King Faisal II a British stooge. The Iraqi government is very sensitive to this, as anti-British and anti-colonial sentiments are at an all-time high across the country. Anti-British protesters have appeared in cities across the country and are demanding Iraq assert its own sovereignty. Currently, the Iraqi government receives a fixed royalty on oil sales, which many recognize leaves most of the oil wealth ending in in British hands. The government has two options in how it responds to the Abadan Crisis. It can join Iran and nationalize its own oil industry, rallying the masses and demonstrating the King's position as an Iraqi sovereign. However, doing so would provoke significant British and Western ire, ending Iraq's decades long cultivation of such ties and leave Iraq exposed internationally as well as domestically. The second option is to negotiate with the British over the current oil concession and perhaps change the model from one of a fixed annual royalty to a profit-sharing scheme where Iraq makes money on each barrel of oil sold. The British may be receptive to this plan as it would not want to risk losing another major concession and it could placate the protesters."
 IRQ.9902.d: "King Faisal II grew up hearing of his family's betrayals by the British and the Saudis. A number of exiles from the Hashimite defeat in 1925 settled in Baghdad and have governed with the Hashimite king. When the Hashimites entered Iraq they had been outsiders and exiles in an alien land but recent events have opened the path for a potential Hashimite return to their ancestral homeland. Saudi Arabia's brutal regime and arrogance has provoked a pro-Hashimite revolt in the holy land. The Jordanians are expected to involve itself closely with the conflict and considering King Faisal II's close ties with his relatives in Jordan, Iraq will also be expected to involve itself. Pro-monarchy groups have taken to the streets of Baghdad to demand Iraq support the anti-Saudi freedom fighters, though some of the media speculate these rallies were sponsored by the royal family. Iraq has pledged diplomatic support to the pro-Hashimite forces in Saudi Arabia and are said to be preparing a program to offer arms and volunteers to the rebels. If the civil war in Saudi Arabia turns against the Saudi family, many feel Iraq may elevate its intervention to a direct military intervention. Saudi planners are concerned about the potential of an Iraqi invasion."
 IRQ.9903.d: "The King of Jordan has long felt the sting of humiliation at losing the Hijaz. The kingdom's founder, King Abdullah could do little as the Saudis seized his homeland and caused a stream of Hashimite refugees and supporters to flee to Aman. Since that period, Jordan had evolved from an emirate into a kingdom. It possessed a modern military and the Hashimites enjoyed extensive political power. However, the failure of saving the Hijaz still hurts and many believe it has driven Jordanian desires to secure Jerusalem. Now, news has reached Aman of pro-Hashimite fighters emerging to fight against Saudi rule over the holy land. The anti-Saudi forces have called on the Hashimites and their supporters abroad to offer support. The Jordanian government will not abandon its supporters and orders have been made to offer arms, volunteers, and diplomatic support for the fighters. Descendants of exiles from 1925 have volunteered support and rumors in Aman say Jordanian forces are erecting camps near the Saudi border to support fighters. At the moment, direct military intervention has not occurred but if the Saudi position worsens, many believe the Jordanians may deploy its small but efficient army into the fray."
 IRQ.9994.d: "President Gamal Nasser's newly established United Arab Republic (UAR) threatens the entire Arab world. With Egypt and Syria firmly under his control, emboldened Nasserist sympathizers across the region have taken to the streets demanding change. No doubt the first target will be Jordan, governed by a fellow Hashemite king who faces the prospect of a military conflict and an internal uprising inspired by the UAR. To offset this threat, the seasoned Iraqi leader Nuri al-Said has proposed Iraq start an alliance called the Arab Federation with Jordan. Unlike the UAR, the Arab Federation will not eradicate either nation's identity but instead work to unify the foreign policy and defense of both states. Both Hashemite rulers in Iraq and Jordan have long sought to unite their kingdoms but these previous efforts all ended in failure. However, with the UAR threat looming, it is clear neither Iraq nor Jordan can survive alone. King Faisal II has dispatched an Iraqi delegation led by Nuri al-Said to propose the Arab Federation to his cousin, the King of Jordan."
 IRQ.9991.d: "In Aman today, the Jordanian government received a high level delegation form Iraq led by senior political leader Nuri al-Said. He brought with him a personal message from King Faisal II of Iraq urging his cousin to join an alliance he calls the Arab Federation. Al-Said explained the establishment of the United Arab Republic (UAR) upended the balance of power in the region and the Hashemite states of Iraq and Jordan must unite to survive this threat. The Iraqi delegation explained the alliance sought to mainly unite both nations foreign policy and defense coordination, not threaten the governance and national identity of either state. After the talks, the Iraqi delegation left Aman and the Jordanian government considered their options. The threat of the UAR on its borders was very real as were the number of UAR sympathizers within Jordan, especially among the Palestinian population. Having an alliance of this type with Iraq would restore balance in the region and fulfill a long-term family ambition for the Jordanian monarchy to unite with Iraq without losing Jordanian identity. On the other hand, Iraq may use the alliance to hijack Jordan's carefully constructed defense and foreign policy. The King weighs his options and after careful consideration he must decide whether to accept the Iraqi proposal for an Arab Federation or reject it."
  
