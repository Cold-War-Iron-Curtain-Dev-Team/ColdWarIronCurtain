 SAU_Focus_Events_1_d: "Правительство Саудовской Аравии объявило сегодня о смерти короля Ибн Сауда. Основатель современного саудовского государства скончался от сердечного приступа ночью в своем дворце в Таифе. Ибн Сауд родился в 1875 году в семье правителя Неджа. Однако в подростковом возрасте он и его семья бежали в изгнание, когда соперники его семьи Рашиды завоевали Недж. К 1902 году Ибн Сауд возглавил группу родственников и последователей, чтобы вновь завоевать родной город своей семьи Эр-Рияд. Это привело к кампании против Рашидов, в ходе которой Ибн Сауд успешно освободил родину своей семьи, одновременно изгнав османов из региона. Он поддержал древний союз между своей семьей и сектой ваххабитов. При поддержке ваххабитов в виде объединяющей идеологии и преданных бойцов Ибн Сауд смог в конечном итоге победить Рашидов в 1922 году. Он укрепил свои позиции мирового лидера, отвоевав Хиджаз у хашимитов в 1925 году, а в 1932 году провозгласил Королевство Саудовская Аравия. Его контроль над ежегодным паломничеством Хадж обеспечил ему и ваххабизму престиж во всем мусульманском мире, но открытие сырой нефти в конце 1930-х годов обеспечило королевству беспрецедентное богатство. Ибн Сауд использовал ваххабизм для объединения племен Аравии, а нефтяные богатства позволили ему предлагать субсидии, чтобы заручиться лояльностью своих подданных. Его впечатляющие военные победы сочетались с тактичной дипломатией, когда он справлялся с региональной напряженностью и обеспечивал тесное партнерство с Соединенными Штатами. Будут заданы вопросы, смогут ли его преемники сохранить союз Саудовской Аравии с ваххабитами и будут ли они продолжать заручаться поддержкой Америки, чтобы гарантировать свою защиту от угроз королевству, как внешних, так и внутренних. Принц Сауд, его сын, считается фаворитом на вступление на трон."
 SAU_Focus_Events.2.d: "Сауд ибн Абдель Азиз Аль Сауд был коронован ранее сегодня в Саудовской Аравии. На нем лежит огромная ответственность за то, чтобы стать преемником своего отца, легендарного короля Ибн Сауда, который основал современное саудовское государство. Там, где его отец объединил королевство бедуинских вождей, новому королю Сауду приходится бороться с региональной нестабильностью, идеологическими угрозами и международными интригами. Саудовская Аравия контролирует огромные запасы нефти, и саудовский король должен довольствоваться гораздо большим, чем просто организацией ежегодного паломничества и обеспечением лояльности своих подданных. Кроме того, необходимо продолжать сохранять и развивать отношения с ваххабитскими улемами, поскольку потеря их поддержки чревата серьезной внутренней нестабильностью. В своей вступительной речи к своему народу и миру в целом новый король объявил о создании нового Совета министров. Кроме того, он сказал, что его правление будет сосредоточено не на военном конфликте, а на искоренении бедности, расширении образования, здравоохранения, обеспечении сильной армии для обороны и внедрении шариата для всех в королевстве. Король Сауд долгое время был назначенным наследным принцем и был хорошо подготовлен своим отцом к правлению Аравией в качестве правителя пустыни. Однако некоторые опасаются, что управление растущими нефтяными богатствами страны и борьба с различными идеологиями, процветающими в арабском мире, могут оказаться непосильными для нового короля. Сможет ли новый король справиться с вызовом, с которым он сталкивается в мире, разительно отличающемся от того, в котором он вырос, покажет время."
 SAU_Focus_Events.3.d: "После коронации короля Сауда принц Фейсал стал наследным принцем своего брата короля. Принц Фейсал занимал административные посты в качестве военного лидера при своем отце короле Ибн Сауде и имеет большой дипломатический опыт в качестве министра иностранных дел Саудовской Аравии. Амбициозные проекты короля Сауда и его экстравагантные расходы привели к финансовым проблемам и общественному дискомфорту правительства. Кроме того, радиопередачи из арабских националистических государств, осуждающие старые арабские монархии, приобретают все большую популярность среди слоев населения. Опасение перед нынешней волной арабского национализма и растущее общественное недовольство государственными расходами побудили фракцию улемов и королевскую семью объединиться. Они выступили против короля Сауда и потребовали, чтобы он назначил принца Фейсала на пост премьер-министра с исполнительными полномочиями. Король неохотно согласился, и Фейсал стал премьер-министром. Дипломаты в Эр-Рияде полагают, что это может ограничить более импульсивные решения короля, но нет никаких сомнений в том, что братья столкнутся, и весьма возможно, что вместо того, чтобы сдерживать власть короля, это может привести к более масштабным распрям внутри саудовской королевской семьи. Только время покажет, сможет ли это назначение восстановить престиж Саудовской Аравии."
 SAU_Focus_Events.4.d: "В результате сегодняшних шокирующих событий военнослужащие ВВС Саудовской Аравии взяли под контроль Эр-Рияд. Они захватили основные правительственные учреждения. Военные, транспортные и медийные объекты, и, как говорят, большая часть королевской семьи находится под вооруженной охраной. Военные боевики бомбили дворцы и военные объекты, что вызвало опасения, что королевская семья понесла большие потери. По государственному радио лидеры саудовского переворота объявили о конце упадочного режима и рождении новой Арабской Республики в Эр-Рияде. Радио Каира отреагировало на этот переворот ликованием, поскольку президент Насер Лонг заявил, что освобождение арабского мира сначала должно начаться с освобождения Эр-Рияда. Говорят, что городские саудовцы среднего класса довольны этим развитием событий, но сельские жители Саудовской Аравии, особенно арабские вожди, могут не воспринять это изменение мирно. Ходят слухи, что принц Талал, возможно, возвращается в Саудовскую Аравию и, возможно, уже находится там. Он привел многих молодых принцев в Египет в поддержку Насера после египетской революции, и его фракция королевской семьи может помочь превращению Саудовской Аравии в Арабскую республику, поскольку он давно выступал за переход Саудовской Аравии к конституционному правлению. Посольство Соединенных Штатов окружено, пока Вашингтон пытается осмыслить то, что произошло в том, что он считает одним из самых критических государств в мире. Остальной мир также внимательно следит за этими событиями, поскольку саудовцы долгое время были хранителями священных земель ислама, и их контроль над мировыми запасами нефти может повлиять на цены на энергоносители. По мнению Насера, дружественный режим в Саудовской Аравии может изменить региональный баланс сил, повергнув монархических соседей Саудовской Аравии в паническое состояние."
 SAU_Focus_Events.5.d: "Саудовская Аравия сегодня объявила, что арестовала десятки военнослужащих ВВС, которые готовили заговор с целью свержения саудовского государства. Ожидается, что впоследствии последует еще много арестов. Правительство давно подозревало, что насеристы проникли в армию и городской средний класс. Правительство заявило, что заговорщики собирались устроить путч, который привел бы к захвату Эр-Рияда и авианалетам на ключевые правительственные объекты. Президент Насер через радио Каира давно выступал за то, чтобы освобождение арабского мира началось с освобождения Эр-Рияда, и срыв этого заговора, без сомнения, станет серьезным ударом по его региональным целям. Провал государственного переворота, без сомнения, подтолкнет саудовское правительство к усилению надзора за вооруженными силами и усилит его паранойю. Принц Талал и молодые принцы, которые долгое время симпатизировали Насеру и переходу к конституционному правительству, будут находиться под гораздо более пристальным вниманием короля Саудовской Аравии. Соединенные Штаты вздохнут с облегчением оттого, что они помогли предотвратить падение важнейшего союзника в регионе."
 SAU_Focus_Events.6.d: "После успешного переворота Свободных офицеров в Саудовской Аравии революционный пыл охватил сторонников революционеров. Эти сторонники вышли на улицу, чтобы подбадривать воинские части и бросать камни во дворцы и офицеров, связанных с королевской семьей. Многие видные саудовские принцы были задержаны в этих учреждениях под присмотром их личных телохранителей. Однако в последние часы саудовские офицеры среднего звена из движения \"Свободные офицеры\" переезжали из дома в дом вместе с вооруженными контингентами. Большинство телохранителей княжеского двора либо сдались, либо были побеждены вооруженными войсками. Как только офицеры взяли под свой контроль дворцы, принцев и их домочадцев выволокли из их домов и казнили либо во дворе дворцов, либо на улицах. Бродячие толпы тащили тела тех принцев, убитых на улицах, и оскверняли их. Движение \"Свободные офицеры\" объявило о гибели многих выдающихся принцев и заявило, что эти смерти были естественным проявлением воли народа, долгое время скованного упадочным правящим классом. Учитывая, как саудовским государством управляла королевская семья и ее многочисленные принцы, эти казни — способ для революционеров обезглавить старый политический класс и проложить путь к новому порядку. В то время как насеристы считают эти действия необходимыми, те арабские государства, которые были идеологически близки с саудовской королевской семьей, как говорят, были взбешены этими действиями."
 SAU_Focus_Events.7.d: "Около 15 000 работников нефтяной промышленности Саудовской Аравии присоединились к забастовке за улучшение условий труда. Король Саудовской Аравии распорядился создать королевскую комиссию по расследованию, поскольку это знаменует радикальную трансформацию трудовых отношений в королевстве. Говорили, что саудовские рабочие были вдохновлены иностранными арабскими рабочими, которые указывали на их плохие условия по сравнению с значительно превосходящими условиями, которыми пользуются их американские менеджеры в королевстве. Плохие условия и отказ ARAMCO удовлетворить требования рабочих вызвали антиамериканские настроения, поскольку рабочие считали, что действия американской компании отражают то, что Соединенные Штаты думают о рабочих. Также к забастовке рабочих подтолкнули недавняя инфляция и гнев по поводу чрезмерных расходов королевской семьи. Для координации забастовки был создан комитет трудящихся, и единство саудовских рабочих, выходящее за рамки племенных уз, рассматривается как серьезная угроза королевской семье Саудовской Аравии. Королю Саудовской Аравии придется решить, уступить ли требованиям рабочих, предложить несколько уступок или отклонить требования рабочих. Уступка всем требованиям может сделать рабочих счастливыми, но подтолкнет их к выдвижению новых требований и усилению влияния иностранных рабочих. Кроме того, Соединенные Штаты не будут рады, если ARAMCO проиграет забастовку. Поддержка ARAMCO и отказ рабочих улучшат наше положение в отношениях с Соединенными Штатами, но приведут рабочих в ярость, поэтому, возможно, компромисс будет лучшим выходом. В долгосрочной перспективе правительство должно рассмотреть вопрос о том, как контролировать влияние иностранной рабочей силы на граждан Саудовской Аравии."
 SAU_Focus_Events.8.d: "Великобритания и Соединенные Штаты оказали сильное давление на Саудовскую Аравию, чтобы она присоединилась к недавно созданной Организации Центрального договора, также известной как Багдадский пакт, которая объединила Ирак, Турцию, Иран и Пакистан в антикоммунистический региональный альянс. Британцы верили, что присутствие Саудовской Аравии укрепит авторитет альянса среди монархических арабских стран. Однако король Саудовской Аравии отказался присоединиться, утверждая, что он не может поддерживать или присоединяться к региональным альянсам, которые продвигают иностранные программы, поскольку это привело бы к межарабскому конфликту и нанесло бы ущерб региональной стабильности. В частном порядке правительственные источники в Эр-Рияде сообщили журналистам, что у правительства Саудовской Аравии также были опасения по поводу вступления в альянс, поскольку в него входило Иракское хашимитское государство, с которым у саудовской семьи историческое соперничество. Кроме того, руководство Саудовской Аравии опасалось, что поддерживаемый Западом антикоммунистический альянс на Ближнем Востоке спровоцирует формирование контр союза Советским Союзом и Египтом, что приведет к конфликту."
 SAU_Focus_Events.9.d: "Мощное лоббирование со стороны американских и британских дипломатов в Эр-Рияде привело к крупному прорыву. Правительство Саудовской Аравии опубликовало заявление, в котором говорится, что король намерен присоединиться к CENTO, также известному как Багдадский пакт. Саудовская Аравия присоединилась к антикоммунистическому региональному альянсу, в который уже входили Ирак, Турция, Иран и Пакистан, а также Соединенное Королевство. CENTO рассматривался как способ предотвратить распространение левого радикализма в регионе и обуздать республиканский панарабизм. Присоединившись к Ираку, управляемому хашимитами, Саудовская Аравия надеялась разрешить историческое соперничество с другой королевской династией. Однако некоторые дипломаты в частном порядке выразили обеспокоенность тем, что этот альянс может развалиться изнутри, и что добавление Саудовской Аравии сделает CENTO более авторитетной в регионе. Египет и Саудовская Аравия конкурировали за влияние в арабских странах, и египетские радиопередачи критиковали решение Саудовской Аравии. CENTO теперь рассматривается как исламская версия НАТО, ключевым членом которой является Саудовская Аравия."
 SAU_Focus_Events.10.d: "Правительство Саудовской Аравии опубликовало заявление о назначении принца Талала на должность премьер-министра Саудовской Аравии после огромного давления со стороны короля Сауда в связи с общественным недовольством его расходами и растущими угрозами панарабизма со стороны Египта и его сторонников-насеритов в регионе. Традиционалисты в королевской семье настаивали на том, чтобы премьер-министр взял ситуацию под исполнительный контроль, и был выбран принц Талал. Этот выбор вызвал удивление в западных странах, поскольку принц Талал является частью фракции, которая поддерживает Насера и выступает за более либеральный подход, чем традиционалисты. Принц Талалс открыто выступает за крупные политические реформы, включая принятие конституции Саудовской Аравии. Назначение Талала королем Саудовской Аравии, по-видимому, является противовесом влиянию его брата принца Фейсала, которого поддерживают традиционалисты. Сауд надеется, что пропаганда Талалом конституционного правления уменьшит влияние тех, кто выступает за революцию в Саудовской Аравии в духе насеритов. Кроме того, этот шаг, похоже, уменьшил влияние традиционалистов, которые настаивали на посту премьер-министра, и, в конечном счете, будет видно, сможет ли Талал сохранить свои отношения с королем Саудом, традиционалистами и ваххабитами и оправдать ожидания, поскольку неспособность осуществить политические реформы может привести к дальнейшей радикализации разочарованного населения Саудовской Аравии. Только время покажет, знаменует ли это назначение начало постепенных демократических перемен в королевстве."
 SAU_Focus_Events.11.d: "Сегодня в Эр-Рияде Республика Аравия официально присоединилась к Объединенной Арабской Республике. На официальной и пышной церемонии присутствовали представители дружественных стран, высшие руководители Республики и представители всех государств-членов САР. В конце церемонии президент САР удовлетворил просьбу Республики присоединиться. Когда два лидера обнялись на сцене, гости громко зааплодировали. Этот шаг радикально преобразил Ближний Восток, поскольку САР через республику теперь контролирует один из самых ценных ресурсов в мире - нефть. Соперники за влияние в арабских странах находятся в невыгодном положении, поскольку власть постоянно меняется. И США, и СССР должны иметь дело с САР, которая является растущей державой, но с присоединением Республики есть эксперты, которые считают, что это фундаментальное изменение также знаменует собой сдвиг внутри страны. Египет долгое время доминировал в ОАР, но с учетом экономической мощи Республики и ее символического статуса принимающей стороны исламских святых земель египетское господство кажется уязвимым, особенно если другие страны начнут сотрудничать. Поскольку САР продолжает расширяться, а другие страны со страхом наблюдают за этим, только время покажет, продолжится ли этот эксперимент по укреплению арабского единства."
 SAU_Focus_Events.12.d: "Король Ибн Сауд, основатель Саудовской Аравии, объединил Аравию мечом и заключил тесный идеологический союз с ваххабитскими улемами. С тех пор королевством управляет королевская семья, работающая совместно с улемами, чтобы гарантировать, что все законы подчиняются Божьим. Однако в последние годы популярность панарабизма, поддерживаемого президентом Египта Гамалем Насером, распространилась по всему арабскому миру. Королевская семья не застрахована от этого влияния. Ряд идейных молодых принцев объединились под руководством принца Талала и называют себя Свободными принцами в знак уважения к Свободным офицерам Насера. Эти молодые принцы сплотились вокруг принца Талала, который часто напоминает старшим членам семьи о необходимости более демократических реформ и конституции. Однако король и старшие улемы больше не проявляют терпения к Свободным принцам. Их называют подрывными, тайными коммунистами, и в некоторых кругах их считают антиисламскими в их стремлении к реформам, которые бросают вызов исламскому характеру государства. У некоторых были заморожены активы, а большинство Свободных принцев бежали из страны, опасаясь преследований со стороны правительства. Многие прибыли в Ливан и Египет. Ожидается, что египтяне начнут использовать видных принцев, особенно принца Талала, для распространения сообщений против саудовского государства. Хотя Свободные принцы будут сеять смуту за границей, по крайней мере, они не будут разжигать беспорядки не только в королевстве, но и в самой королевской семье."
 SAU_Focus_Events.13.d: "Правительство Саудовской Аравии объявило в заявлении короля, что оно решительно осуждает неприкрытую агрессию Великобритании против народа Египта. Британцы долгое время демонстрировали высокомерное и империалистическое отношение к Суэцкому каналу. Египет последовательно добивался справедливого решения, в то время как Великобритания постоянно не проявляла интереса к справедливому обращению с народом Египта. Вместо этого, добавлено в заявлении короля, британцы вступили в заговор с заклятыми врагами Египта с целью начать варварское нападение. Правительство Саудовской Аравии поддержит народ Египта и призовет к арабскому единству в это кризисное время. Чтобы поддержать египтян, правительство Саудовской Аравии дополнительно объявило нефтяное эмбарго против государств-агрессоров, которое будет действовать до тех пор, пока не прекратится насилие против Египта. Хотя революционное правительство Египта, по-видимому, является противоположностью саудовскому монархическому государству, общая враждебность двух государств к династии Хашимитов в Иордании, по-видимому, объединяет их. Кроме того, саудовцы поддерживают тесные связи с Соединенными Штатами и следуют их примеру в этом кризисе. Выступление против британцев поможет египтянам, но окажет давление на иорданское правительство и короля, которые долгое время зависели от британской поддержки. Выступив с такой решительной позицией, Саудовская Аравия в очередной раз показала себя как один из главных лидеров арабского мира."
 SAU_Focus_Events.14.d: "Правительство Саудовской Аравии осудило продолжающуюся британскую оккупацию Адена и осудило то, как колониализм продолжает приковывать арабов к западной оккупации. Волна деколонизации и подъем арабского национализма по всему Ближнему Востоку заставили многих рассматривать Аден как форпост архаичной системы. Для британцев Аден исторически служил ключевой станцией добычи угля, базой по борьбе с пиратством и торговым форпостом с девятнадцатого века. Объем торговли, проходящей через порт, наряду с его стратегическим положением в качестве ключевого компонента британской глобальной оборонной сети заставляет британцев не решаться отказаться от своего контроля над Аденом. Кроме того, добыча нефти в Адене рассматривается как важнейший стратегический актив. Британцы рассматривают усилия саудовцев и египтян по вытеснению их из Адена как попытку обезопасить Аден как пространство, которое может быть инкорпорировано либо государством, либо их доверенными лицами. Для саудовцев вызов британскому колониализму помогает их репутации во всем арабском мире, но, что более важно, это оказывает давление на британцев, заставляя их уйти. Вывод британских войск из Адена, без сомнения, был бы большим достижением арабских стран, но также и потенциальной возможностью для саудовского государства."
 IRQ.9901.d: "У хашимитов были давние исторические отношения с Хиджазом. Семья ведет свою родословную от Пророка, и ранние хашимиты конкурировали с другими фракциями за титул халифа. В течение трех столетий после основания ислама титул шарифа и эмира Мекки был присвоен хашимитам. Династия контролировала святую землю и сохранила ее для всего исламского мира. Во время Первой мировой войны Хусейн бен Али и его четверо сыновей восстали против пришедшей в упадок Османской империи после получения обещаний от Британии поддержать новую арабскую империю с хашимитским халифом. Эти обещания не были выполнены, но после войны хашимиты действительно основали королевства в Иордании, Ираке и Хиджазе. Однако в 1925 году саудовцы изгнали хашимитов из их родового дома в Хиджазе. Сейчас саудовцы кажутся слабыми, оппозиция их правлению растет, а сторонники хашимита, все еще находящиеся на святой земле, подняли восстание, чтобы положить конец правлению Саудовской Аравии. Политика Саудовской Аравии по уничтожению исторических реликвий и подрыву традиционных опор власти в Аравии вызвала негативную реакцию у тех, кто желает возвращения хашимитов. Повстанцы обратились за поддержкой к хашимитским державам Ирака и Иордании. Ожидается, что обе страны предложат оружие, добровольцев и дипломатическую поддержку. Оба правителя давно хотели отомстить за унижение, которому подверглась их семья в 1925 году. Высокомерие саудовцев и неуважение к традициям Аравии теперь дорого им обойдутся, поскольку люди стекаются, чтобы восстановить правление хашимитов."
 IRQ.1753.d: "Ирак, пожалуй, самое произвольно спроектированное государство, возникшее после Первой мировой войны. Британцы объединили три отдельные провинции Османской империи, чтобы создать Ирак. Новому государству не хватало этнической, религиозной или языковой однородности. Арабское большинство было разделено на суннитов и шиитов. В стране было значительное курдское меньшинство, сосредоточенное на севере. Значительное ассирийское христианское население существовало наряду с большой еврейской общиной в Багдаде. Британцы стремились управлять Ираком на основе договоров с дружественным правительством, чтобы обеспечить его интересы и избежать расходов. Фейсал ибн Хусейн, недавно свергнутый французами в Сирии, был привезен британцами, чтобы стать королем Ирака Фейсалом I. Несмотря на отсутствие какой-либо связи с землей, король Фейсал I проявил себя искусным посредником между иракскими группировками и установил легитимность своей династии в глазах народа. Его смерть в 1933 году привела на трон неумелого короля Гази. После смерти короля Гази в 1939 году к власти пришел трехлетний король Фейсал II, но власть принадлежит регенту, принцу Абдалле. После ранней смерти короля Фейсала I в парламенте доминировали стареющие политики эпохи Османской империи, которые постоянно меняли власть в парламенте. Военные свергли нескольких премьер-министров с тех пор, как началось регентство принца Абдаллы, хотя они предпочли не свергать систему. Вторая мировая война стала самой большой проблемой для хашимитов, когда офицеры националистической армии захватили власть. Хашимиты и парламент вернулись к власти только после британского вторжения, навсегда запятнавшего хашимитское государство в глазах все более националистически настроенного населения. Политика централизации иракского государства сопровождалась жестокими репрессиями, когда армия подавляла курдов и ассирийцев. Помимо сопротивления централизации, антиколониальный средний класс и левая агитация среди городских рабочих — все это новые угрозы иракскому хашимитскому государству. Время покажет, сможет ли король Фейсал II положить конец политической неопределенности и восстановить доверие народа к династии."
 IRQ.9998.d: "Разочарование и гнев по поводу политических репрессий в Ираке и вмешательства Великобритании вылились в протесты и забастовки против монархии и англо-иракского договора 1948 года. Протестующие считают, что слишком долго внешняя политика Ирака диктовалась Лондоном, в то время как династия Хашимитов ограничивала любые проявления политического дискурса. В разгар этих беспорядков король Фейсал II опубликовал публичное осуждение Конституционной партии. Он говорит, что партия разжигала гнев протестующих и стремилась спровоцировать гражданскую войну во имя своих собственных политических выгод. Он говорит, что на самом деле многое из того, на что жалуются протестующие, на самом деле вызвано Конституционной партией, и, поскольку протесты направлены против королевской семьи, Конституционная партия отказывается помочь утихомирить беспорядки. Это осуждение Конституционной партии удивило многих в Ираке, и еще неизвестно, помогут ли усилия короля возложить вину и ответственность на Партию ее способности утихомирить волнения, охватившие Ирак."
 IRQ.9999.d: "Центральная лига Ирака состоит из футбольных команд клубов и учреждений, расположенных по всему Багдаду. Несмотря на то, что Иракская центральная лига является одной из четырех региональных лиг в стране, она считается премьер-лигой Ирака по футболу. Его чемпионы продолжают представлять Ирак на клубном чемпионате Азии. Клуб \"Харис Аль-Малики\" считается сильнейшим клубом в стране. Тем не менее, все матчи, похоже, пользуются популярностью, поскольку на них часто собираются аншлаговые толпы. Кроме того, многие иракцы внимательно следят за результатами в СМИ в надежде, что их команда сможет выйти на первое место. Крупные учреждения, такие как полиция и армия, также отправляют на места группы, что дает членам таких учреждений больше причин поддержать свою команду. Любовь иракцев к футболу делает население счастливым во время чемпионата и позволяет соперничающим учреждениям разрешать свои трения на поле, а не на улицах. Какая это прекрасная игра."
 IRQ.9996.d: "Сегодня король Ирака Фейсал II достиг совершеннолетия и занял свое место в качестве правителя Ирака. Хотя он взошел на престол в возрасте 4 лет в 1939 году после смерти короля Гази, своего отца, страной управлял его регент и пробритански настроенный дядя, принц Абд аль-Ллах. Король Фейсал II начал коронацию с поездки в открытом экипаже, возглавляемом нарядно одетыми кавалеристами, для участия в Меджлисе Ирака. Он вошел в парламент с войсками по стойке «смирно» в парадной форме, полностью соответствующей европейским образцам. После выступления перед Меджлисом король Фейсал II принес королевскую присягу и принял клятву верности от Меджлиса и иракского народа от председателя Сената. После церемонии король посетил грандиозный прием, на котором принимал известных сановников, включая герцога Глостерского. Униформа в европейском стиле на протяжении всей коронации указывает на то, что король Фейсал II надеется продолжить политику своего дяди. Сможет ли он сдержать растущую угрозу панарабизма и арабского национализма, остается неясным, поскольку, несмотря на великолепную церемонию, поступали сообщения о том, что иракцы из кварталов среднего класса жаловались на расходы на коронацию. В рабочих кварталах некоторых иракцев отпугнуло мероприятие, на котором король был окружен вооруженной охраной, а не народом Ирака."
 IRQ.9995.d: "Али Джавдад аль-Айюби долгое время служил хашимитам в Ираке. После недолгой службы сирийскому режиму Фейсала он последовал за ним в Ирак. Он занимал важные руководящие и дипломатические посты, в том числе несколько раз занимал пост премьер-министра Ирака. Аль-Айюби, опытный политический лидер, признает изменение мирового порядка после окончания Второй мировой войны. В ходе драматического дипломатического маневра аль-Айюби вылетел в Вашингтон, округ Колумбия, чтобы лично открыть посольство Ирака в американской столице. Иракское правительство признает, что Британия уже не является той первостепенной силой, какой она была когда-то. Если хашимитам суждено выжить в условиях роста антимонархического, панарабского национализма и коммунистической агитации, им необходимо укрепить свои связи с американцами, и новое посольство станет первым шагом в этом процессе. Американские СМИ сообщили о волнении и интересе местных жителей к драматическому решению высокопоставленного иракского лидера прилететь, чтобы лично открыть посольство. В Ираке этот шаг восхваляется как признание мирового порядка, в то время как антимонархисты указывают на то, что Ирак продолжает уступать свой суверенитет колониальным силам."
 IRQ.9980.d: "Сегодня королевства Ирак и Иордания объявили о создании Арабской Федерации, которую многие рассматривают как ответ Объединенной Арабской Республике, образованной Египтом и Сирией. Король Ирака Фейсал и его двоюродный брат, король Иордании Хусейн, оба потомки династии Хашимитов, правившей Аравией до 1921 года, раскрыли, что они давно планировали создание арабского союза государств. Этот союз рассматривается как прямое следствие выхода Ирака из Багдадского пакта и обеспечения независимости страны от их западноарабского коллеги, Египта. Хотя по названию новое государство является федерацией, многие считают его конфедерацией, и это огорчило многих людей. Объединенная Арабская Республика еще не сделала никакого официального заявления по этому поводу, хотя есть сообщения о мобилизации Израиля. Тем не менее, это монументальный шаг для Ближнего Востока, а возможно, и для всего мира."
 kurdish_conflict.1.d: "Курды долгое время сопротивлялись усилиям иракского государства по созданию сильного центрального правительства. Курды выступают против проарабской националистической школьной системы, отсутствия защиты их собственного языка и культуры. Кроме того, они выступают против усилий государства по насильственному расселению курдских общин и изменению их образа жизни. Ирак традиционно задействовал армию для навязывания своей воли курдам, но цикл вооруженного насилия между обеими группами с годами оказался дорогостоящим. Появилась новая инициатива, призванная помочь уменьшить враждебность между курдским населением и правительством. Правительство Ирака сократит количество военных контрольно-пропускных пунктов и рейдов. Кроме того, учебные заведения разрешат учащимся говорить в школе на курдском языке наряду с арабским. В политическом плане местным чиновникам будет предоставлено больше свободы действий в отношениях с курдскими племенными группировками, особенно с курдскими вождями. Предоставление им большего права голоса в политике правительства поможет им доверять государству, не идя при этом на компромисс с централизацией государственной политики. Эти уступки могут помочь снизить напряженность, и как только все уляжется, мы сможем вернуться к возвращению курдов в состав иракского государства на наших условиях."
 IRQ.9997.d: "Тауфик аль-Сувейди решил принять приглашение короля Фейсала II сформировать новое правительство и работать с хашимитами. Блестящий юрист и бывший премьер-министр, выросший на закате Османской империи, аль-Сувейди приобрел известность в эпоху британского мандата. Сегодня он опытный политик и международная фигура. Хашимиты надеялись, что его прозападные взгляды выразятся в поддержке их режима, но аль-Сувейди исторически доказал, что верит в западные принципы представительной демократии и прав личности. Иракская королевская семья с подозрением относилась к его предыдущему пребыванию на посту премьер-министра, поскольку он позволил политическим партиям функционировать и дал указание министерству внутренних дел ослабить свои действия, особенно против левых. Однако ситуация, в которой оказался Ирак, требует сильного руководства, и опыт и репутация человека с аль-Сувейди перевешивают риски отмены им правительственных ограничений и слежки за сомнительными группами в стране. Что касается Тауфика ас-Сувейди, то у него была долгая история столкновений с хашимитами, но он тоже чувствует, что, возможно, настало время для более успешных отношений и, возможно, для более демократического Ирака."
 Abadan_Crisis.1.d: "Решение иранского правительства национализировать свою нефть вопреки международным договорам и гнев Великобритании вызвали шок по всему Ираку. Иракцы приветствовали Иран за обеспечение своего суверенитета и вызов империализму, признавая, что его собственное правительство продолжает соглашаться на колониальные уступки Великобритании. Многие иракцы теперь открыто называют короля Фейсала II британской марионеткой. Иракское правительство очень болезненно относится к этому, поскольку антибританские и антиколониальные настроения по всей стране находятся на небывало высоком уровне. Антибританские протестующие появились в городах по всей стране и требуют от Ирака утвердить свой собственный суверенитет. В настоящее время иракское правительство получает фиксированный роялти от продажи нефти, что, по признанию многих, оставляет большую часть нефтяных богатств в руках Великобритании. У правительства есть два варианта реагирования на кризис в Абадане. Оно может присоединиться к Ирану и национализировать свою собственную нефтяную промышленность, сплотив массы и продемонстрировав позицию короля как иракского суверена. Однако это вызвало бы значительный гнев Великобритании и Запада, положив конец десятилетиям культивирования Ираком таких связей и оставив Ирак незащищенным как на международном, так и на внутреннем уровне. Второй вариант заключается в переговорах с Великобританией по поводу текущей нефтяной концессии и, возможно, изменении модели с фиксированного годового роялти на схему распределения прибыли, при которой Ирак зарабатывает деньги на каждом проданном барреле нефти. Британцы могут быть восприимчивы к этому плану, поскольку они не хотели бы рисковать потерей еще одной крупной уступки, и это могло бы успокоить протестующих."
 IRQ.9902.d: "Король Фейсал II вырос, услышав о предательстве своей семьи британцами и саудовцами. Несколько изгнанников после поражения хашимитов в 1925 году поселились в Багдаде и правили вместе с хашимитским королем. Когда хашимиты вошли в Ирак, они были чужаками и изгнанниками в чужой стране, но недавние события открыли путь для потенциального возвращения хашимитов на родину их предков. Жестокий режим и высокомерие Саудовской Аравии спровоцировали хашимитское восстание на святой земле. Ожидается, что иорданцы будут тесно вовлечены в конфликт, и, учитывая тесные связи короля Фейсала II со своими родственниками в Иордании, ожидается, что Ирак также будет вовлечен. Промонархические группы вышли на улицы Багдада, требуя, чтобы Ирак поддержал антисаудовских борцов за свободу, хотя некоторые СМИ предполагают, что эти митинги были спонсированы королевской семьей. Ирак пообещал дипломатическую поддержку хашимитским силам в Саудовской Аравии и, как говорят, готовит программу по поставке оружия и добровольцев повстанцам. Если гражданская война в Саудовской Аравии обернется против саудовской семьи, многие считают, что Ирак может довести свое вмешательство до прямой военной интервенции. Саудовские планировщики обеспокоены возможностью иракского вторжения."
 IRQ.9903.d: "Король Иордании уже давно испытывает чувство унижения из-за потери Хиджаза. Основатель королевства, король Абдалла, мало что мог сделать, поскольку саудовцы захватили его родину и вызвали поток беженцев-хашимитов и их сторонников, бежавших в Аман. С того периода Иордания превратилась из эмирата в королевство. Она обладала современной военной силой, а хашимиты пользовались обширной политической властью. Однако неудача с спасением Хиджаза все еще причиняет боль, и многие считают, что это побудило иорданцев обезопасить Иерусалим. Теперь до Амана дошли новости о про-хашимитских боевиках, выступающих против правления Саудовской Аравии на святой земле. Антисаудовские силы призвали хашимитов и их сторонников за рубежом предложить поддержку. Правительство Иордании не бросит своих сторонников, и были отданы приказы предложить боевикам оружие, добровольцев и дипломатическую поддержку. Потомки изгнанников из 1925 года вызвались оказать поддержку, и, по слухам в Амане, иорданские войска возводят лагеря недалеко от границы с Саудовской Аравией для поддержки боевиков. На данный момент прямого военного вмешательства не произошло, но если положение Саудовской Аравии ухудшится, многие полагают, что иорданцы могут ввести в бой свою небольшую, но боеспособную армию."
 IRQ.9994.d: "Недавно созданная президентом Гамалем Насером Объединенная Арабская Республика (ОАР) угрожает всему арабскому миру. Поскольку Египет и Сирия прочно находятся под его контролем, осмелевшие сторонники насеризма по всему региону вышли на улицы, требуя перемен. Без сомнения, первой целью станет Иордания, управляемая таким же хашимитским королем, который сталкивается с перспективой военного конфликта и внутреннего восстания, инспирированного САР. Чтобы нейтрализовать эту угрозу, опытный иракский лидер Нури аль-Саид предложил Ираку создать альянс под названием Арабская федерация с Иорданией. В отличие от САР, Арабская федерация не будет искоренять самобытность ни одной из наций, а вместо этого будет работать над объединением внешней политики и обороны обоих государств. Оба хашимитских правителя в Ираке и Иордании долгое время стремились объединить свои королевства, но все эти предыдущие усилия закончились неудачей. Однако в условиях надвигающейся угрозы со стороны САР становится ясно, что ни Ирак, ни Иордания не смогут выжить в одиночку. Король Фейсал II направил иракскую делегацию во главе с Нури аль-Саидом, чтобы предложить создание Арабской федерации своему двоюродному брату, королю Иордании."
 IRQ.9991.d: "Сегодня в Амане правительство Иордании приняло делегацию высокого уровня из Ирака во главе со старшим политическим лидером Нури аль-Саидом. Он привез с собой личное послание от короля Ирака Фейсала II, призывающее его двоюродного брата присоединиться к союзу, который он называет Арабской федерацией. Аль-Саид объяснил, что создание Объединенной Арабской Республики (ОАР) перевернуло баланс сил в регионе, и хашимитские государства Ирак и Иордания должны объединиться, чтобы противостоять этой угрозе. Иракская делегация объяснила, что североатлантический союз стремился главным образом объединить внешнеполитическую и оборонную координацию обеих стран, а не угрожать управлению и национальной идентичности обоих государств. После переговоров иракская делегация покинула Аман, и правительство Иордании рассмотрело свои варианты. Угроза со стороны САР на ее границах была очень реальной, как и количество сторонников САР в Иордании, особенно среди палестинского населения. Заключение подобного союза с Ираком восстановило бы равновесие в регионе и осуществило бы долгосрочную семейную мечту иорданской монархии — объединиться с Ираком, не теряя иорданской идентичности. С другой стороны, Ирак может использовать североатлантический союз, чтобы подорвать тщательно выстроенную оборонную и внешнюю политику Иордании. Король взвешивает свои варианты и после тщательного рассмотрения должен решить, принять ли иракское предложение о создании Арабской федерации или отклонить его."
