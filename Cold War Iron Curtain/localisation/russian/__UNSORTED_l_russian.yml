 VIN_Generic_Raid_Success: "Командир потратил несколько недель на то, чтобы организовать бойцов и обучить их в джунглях в соответствии с нашей стратегией. Подготовив свои силы, он смог найти изолированный французский аванпост с их солдатами. Действуя стремительно, наши люди атаковали позиции французов, нанося им потери, отгоняя выживших и собирая оружие и припасы. К тому времени, когда прибыли французские силы по оказанию помощи, наши люди уже растворились в джунглях. Если мы продолжим проводить успешные атаки, подобные этой, там, где французы уязвимы и где мы не подвержены их огневой мощи, мы, без сомнения, подорвем их волю к продолжению."
 VIN_Generic_Raid_Failure: "Группа наших бойцов допустила критическую ошибку, которая обошлась им очень дорого. Бойцы обнаружили то, что казалось слабой позицией французов, и начали атаку. Однако, похоже, французы знали о готовящемся нападении и смогли отразить его. В этот момент нашим бойцам следовало отступить обратно в свое безопасное убежище, но они, преисполненные патриотического пыла, продолжили наступление. Это дало французам достаточно времени для прибытия подкрепления, и они развернулись, чтобы ударить по нашим атакующим истребителям с фланга. Это оказалось разрушительным, и остатки наших сил отступили. Неудавшийся рейд придал уверенности французам и истощил наши силы в этом районе."
 FRA_Generic_Raid_Success: "В джунглях была замечена относительно большая группа коммунистических боевиков. Эти люди, по-видимому, хорошо вооружены, но передвигаются так шумно, что мы смогли их выследить. Когда они разбили лагерь на ночь, местный командир организовал отряд из своих лучших солдат, легко экипированных и вооруженных, чтобы они могли быстро передвигаться по густым джунглям. Когда они заняли позиции и враг показался им наиболее уязвимым, они атаковали. Это был крупный успех, мы не понесли серьезных потерь, но нанесли тяжелые потери врагу. Все пленные, оружие и документы были захвачены. Мы полагаем, что благодаря этой информации можно отследить и другие вражеские подразделения, действующие в этом районе, что позволит нам искоренить коммунистических головорезов из этого района."
 FRA_Generic_Raid_Failure: "Молодой, амбициозный офицер подталкивал своих людей и вел их на активные патрулирования, чтобы искоренить коммунистов и не отдать территорию под влияние врага. Безусловно, это была благородная цель, но его предупреждали, что такие действия могут привести к ответным действиям противника. Во время такого патрулирования местный житель направил его к месту, где, по его утверждению, был разбит коммунистический лагерь. Не желая упускать возможность, солдаты двинулись в атаку на позиции, однако, как только они вошли в джунгли, они попали во вражескую засаду. В ходе первой перестрелки наши войска понесли потери, но к тому времени, когда они открыли ответный огонь, враг уже отступил. Подобные неудачи вселяют в противника уверенность, подрывают наш боевой дух и вдохновляют местных жителей присоединиться к нашему врагу."
 BCP.1.d: ""
 BCP.2.d: ""
 BCP.3.d: "Когда наши насущные проблемы будут решены, а наше выживание гарантировано, мы сможем начать длительную подготовку к освобождению Бирмы. В настоящее время в Центральном комитете нет единого мнения о том, как лучше действовать. На одном конце стола находятся сторонники пацифистской фракции «Белый флаг». Они утверждают, что лучший путь вперед — это победа на открытых выборах. По их словам, люди уже поддерживают нашу борьбу и будут массово голосовать за нашу коалицию. Этот план подвергся критике со стороны многих членов партии, которые считают, что этот путь слишком неопределенный. На другом конце стола находятся националисты, милитаристы и ортодоксальные ленинцы, которые выступают за продолжение вооруженной борьбы против правительства США. Они верят, что ключом к нашему успеху будет союз со многими репрессированными этническими группами. Однако некоторые члены партии считают этот план слишком смелым и жестоким. Что нам делать?"
 BCP.6.d: "Сегодня, премьер-министр Тханкин Тхан Тун объявил о роспуске Бирманского союза и о создании Демократической Республики Бирма. Эта новость появилась вскоре после того, как молод коммунист был приведён к присяге в результате уверенного переворота на выборах, в результате которого коалиция БКП и НУФ получила почти абсолютный контроль над страной Юго-Восточной Азии."
 BCP.7.d: "Сегодня джунгли Южной Бирмы потряс ряд драматических договоров и соглашений между Национально-освободительной армией Карана (НОАК), национально-освободительной армией Мона (НОАМ) и Народно-освободительной армией Бирмы (НОАБ). Эти договоры привели к созданию Фронта освобождения Бирмы. Несмотря на прежнюю враждебность по отношению друг к другу, Коммунистическая партия Бирмы объединила две этнические группы в совместной борьбе против правительства У Ну. Разведывательные самолеты Бирмы подтвердили высокую степень координации действий между тремя армиями в ходе строительства крупных учебных центров и лагерей в джунглях. Председатель Коммунистической партии Бирмы Тхань Тан Тун призвал все угнетенные этнические группы и трудящихся объединиться вокруг Фронта освобождения Бирмы. Бирманское правительство объявило эти действия вопиющей эскалацией гражданской войны и поклялось разгромить объединенные армии на юге. Несмотря на эти пламенные заявления с обеих сторон, международные наблюдатели полагают, что обеим сторонам не хватает ресурсов и живой силы для продолжения наступления, и линии фронта, скорее всего, останутся неизменными в обозримом будущем."
