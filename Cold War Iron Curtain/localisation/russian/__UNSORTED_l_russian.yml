 VINLAO.1.d: "Появились срочные новости, похоже, что Северный Вьетнам захватил район Чепоне недалеко от ДМЗ между Северным и Южным Вьетнамом. Ханой утверждает, что деревни исторически были частью Вьетнама на протяжении веков. Довольно скоро по всей границе с Северным Вьетнамом-Лаосом начались широкомасштабные боевые действия. Вьетнамская тактика была направлена на открытие тропы в районе Чепоне, в том, что было известно как Тропа Хо Ши Мина."
 Pathet_Lao.1.d: "В Лаосе поднялось новое движение. Лаосская народная партия, позже названная Патет-Лао, - это марксистско-ленинское партизанское движение, созданное принцем Суфанувонгом, который встречался с Хо Ши Мином и имеет тесные связи с Вьетминем. Антифранцузское и некоммунистическое националистическое движение, возникшее из лаосской Иссары, было принято Суфанувонгом, который присоединился к восстанию Вьетминя против французов в Первой Индокитайской войне. Многие утверждают, что Патет-лао-это просто продолжение вьетнамских коммунистов, в то время как другие утверждают, что это независимое движение, которое посвящено освобождению Лаоса от капиталистических и американских элементов; Лаос теперь разделен между монархистами и коммунистами, и мало кто может поспорить, сможет ли сама нация поддержать борьбу."
  
 VIN_Reform.1.d: "Правительство Демократической Республики Вьетнам объявило, что оно начнет серию земельных реформ в интересах крестьянства и сельских рабочих; в то время как первоначально занимая умеренную позицию и идя на компромисс с помещиками в отношении земель, с простым снижением земельной ренты, правительство Северного Вьетнама начало более жесткую и радикальную реформу, вдохновляясь китайцами. Считать помещиков предательскими элементами дела и образовать особый народный трибунал суд; большинство из них составлены крестьянами, практически не разбирающимися в законах и выносящими произвольные приговоры, которые варьируются от смертной казни до нескольких лет сурового труда. Кроме того, был издан ряд декретов и законов о земельной реформе, подробно описывающих последний этап земельной революции - перераспределение сельскохозяйственных земель."
 VIN_Reform.2.d: "После радикализации земельной реформы элементами Коммунистической партии Вьетнама вскоре начались казни и социальная изоляция помещиков. После публикации документа Политбюро, в котором подробно говорится, что один человек на тысячу населения должен быть казнен на том основании, что они являются помещиками или иным образом сотрудничают с помещиками; было подсчитано, что пятнадцать тысяч реакционеров и помещиков мертвы. До сих пор VWP начала кампанию по исправлению ошибок после казни этих землевладельцев, многие из которых были ложно или ошибочно приговорены к смертной казни. В ходе трехэтапной операции она переклассифицировала крестьян и восстановила имущество, которое было ошибочно экспроприировано или иным образом компенсировано за эти ошибки; кроме того, была проведена ревизия, инвентаризация и сосредоточенная повторная индоктринация местного персонала."
 VIN_Reform.3.d: "Центральный комитет Северного Вьетнама недавно осудил, что идеология, которой следуют в Китайской Народной Республике; по мнению руководства Северного Вьетнама, концепции маоизма являются явным отклонением и ревизионизмом идеологии, которой следуют в стране, марксизма-ленинизма; вьетнамцы объявили о переориентации на СССР, в то время как отношения с Пекином значительно испортились.; КНР объявила, что решение Северного Вьетнама вызывает сожаление и что это позор, что Северный Вьетнам выбрал быть откровенным ревизионистом и реакционной нацией, мы надеемся, что они могут переориентировать свой курс действий как можно скорее. Еще неизвестно, будет ли Вьетнам продолжать свой просоветский курс."
  
  #KMT Burma 
 KMT_BURMA.1.d: "После падения материка войсками, лояльными Мао Цзэдуну, в Бирме было создано повстанческое движение Ли Ми, генералом-националистом, который сформировал костяк того, что должно было стать антикоммунистической армией национального спасения провинции Юньнань, которую поддерживали как Тайвань, так и Соединенные Штаты. Когда китайские войска начали наращивать войска на границе с Кореей, американцы призвали повстанцев-националистов начать наступление на провинцию Юньнань, связав КНР конфликтом с этими повстанцами, а также представив себя ключом к возобновлению националистического наступления на материк, которое сломило бы маоистские силы и вновь поставило бы Китай под контроль Чан Кайши. Как только эти войска войдут в Юньнань, они захватят аэродромы, которые позволят американским войскам отправлять припасы для поддержания вторжения.; в то время как Ли Ми был более предан делу использования вторжения в Юньнань в качестве ключа для получения американского оружия, отступления в Бирму и укрепления повстанческого движения. Удастся ли какой-либо из этих планов, остается загадкой как для генерала, командующего Повстанческим движением, так и для генералиссимуса на Тайване."
 KMT_BURMA.2.d: "После падения националистического Китая отбитая армия КМТ отступала с материка, застряв в Юньнани; армия Тан Яо состояла из 30 000 солдат и постепенно потеряла большую часть личного состава из-за дезертирства, массовой капитуляции или падения преследующих коммунистических формирований.  Эти 1500 человек, подкрепленные более чем 20 000 ополченцев, в основном из местного христианского населения Ва и шаньских наемников, начали военную операцию в Юньнани, отбив силы коммунистического гарнизона и создав новый гоминьдановский мятеж в КНР."
 KMT_BURMA.3.d: "После падения националистического Китая отбитая армия КМТ отступала с материка, застряв в Юньнани; армия Тан Яо состояла из 30 000 солдат и постепенно потеряла большую часть личного состава из-за дезертирства, массовой капитуляции или падения в погоне за коммунистическими формированиями.  Эти 1500 человек начали военную операцию в Юньнани, потерпев поражение от коммунистических гарнизонов, которые защищают регион, и, таким образом, были отброшены обратно в Бирму."
 KMT_BURMA.4.d: "Линь Юань-ли, заместитель командующего восьмой армией Гоминьдана в Бирме, инициировал план под названием операция "Муссон". Исходя из идеи, что народное восстание может произойти из-за радикальных усилий КНР по коллективизации, командующий восьмой армией собрал 400 человек из Люй Вэй-Ина, командующего первой армией, чтобы напасть на Юньнань; Линь верил, что нападение на Юньнань получит поддержку и восхищение Гоминьдана на Тайване. Когда 400 человек двинулись в Юньнань, мотивированные и под командованием Линь и Лю, они разогнали местные коммунистические ополчения и создали местное гоминьдановское восстание в Юньнани."
 KMT_BURMA.5.d: "Линь Юань-ли, заместитель командующего восьмой армией Гоминьдана в Бирме, начал планировать операцию под названием Операция "Муссон". Исходя из идеи, что народное восстание может произойти из-за радикальных усилий КНР по коллективизации, командующий восьмой армией собрал 400 человек из Люй Вэй-ина, командующего первой армией, чтобы напасть на Юньнань; приостановленный на значительное время, Линь Юань-линь в течение нескольких месяцев возобновил операцию, начав ее после того, как пропустил приказы своих командиров в надежде получить восхищение и поддержку Гоминьдана на Тайване. Когда люди двинулись в Юньнань, у них не было мотивации по-настоящему сражаться и начать свой мятеж, что привело к быстрому поражению коммунистических ополченцев, отправив их и Линя обратно в Бирму."
  
 KMT_BURMA.10.d: "Положение КМТ в Бирме постепенно становится деликатным, под давлением ООН на Тайвань, медленно заставляя его выводить войска в суверенную страну Юго-Восточной Азии, которая страдает от политической нестабильности из-за боевых действий между повстанцами КМТ и бирманскими коммунистическими повстанцами и из-за того, что эта повстанческая армия вмешивается в торговлю опиумом, распространяя коррупцию и наркоманию. Именно из-за этого давления Китайская Республика решила начать "Операцию Небеса". Поскольку эти силы были непреклонны в отношении очень небольшого сокращения повстанческой армии, напряженность была высокой, но в конце концов было решено, что должна быть эвакуация войск КМТ из Бирмы; после нескольких месяцев переговоров КМТ начал трехфазный вывод, который был половинчатым, с предполагаемыми китайскими эвакуированными, похожими на Шанса или Лаху, из Бирмы, с ржавыми музейными экспонатами вместо современного американского военного оружия. Было объявлено о роспуске повстанческого движения КМТ, но 6000 нерегулярных войск КМТ остались в Бирме, где боевые действия начались месяц спустя."
