 tonkin.2.d: "Following the Gulf of Tonkin incident, Congress approved military action in Vietnam. Following the passage of the joint resolution, the President directed the military to deploy its air and naval power immediately. It also announced plans for American Marines to deploy to South Vietnam and aid the Saigon government. The United States had been deeply involved in the region previously, offering diplomatic support for South Vietnam. In addition, American military advisors are already on the ground, but this new deployment marks a major escalation. Previously American forces were only allowed to train and advise the South Vietnamese, now the American military will actively support and aid the South Vietnamese against communist aggression. Many analysts believe this new escalation will quickly turn the tide against the communists."
  
 Crusader_Insurgency_Decisions_desc: "Во время Второй мировой войны немцы и их хорватское марионеточное государство обучали и оставляли вооруженные отряды хорватских партизан для борьбы с югославскими партизанами. Когда война закончилась, эти бойцы, называя себя крестоносцами, начали партизанскую кампанию против коммунистического югославского государства. Они пытаются сплотить хорватов и добиться раздела Югославии, который сделает Хорватию независимой. Для Югославии уничтожение крестоносцев имеет важное значение для ее плана установления национального единства после многих лет иностранной оккупации и внутренних войн.\n\nТекущая сила: [?ROOT.crusader_insurgency]%"
