 Khruschev_SU.1.d: "The governing Workers' Party of Korea (WPK) has governed North Korea since its founding under Kim il-sung. However, this changed today as the pro-Soviet faction within the party launched a successful coup. Previously, Chairman Kim had been able to defeat challengers from the party's many factions or play the them off each other while preserving his own power. However, the Soviet government's criticism of personality cults and other issues left Chairman Kim vulnerable to denouncement. The pro-Soviet faction, saw these public criticisms as an opportunity, and plotted to denounce Kim at the next Plenary Session of the Central Committee of the Workers' Party of Korea. Chairman Kim, usually aware of such plots was not prepared. At the meeting the pro-Soviet faction, working with several other factions, publicly denounced Chairman Kim, his supporters were unaware and could not shout them down. Neutral party members, who Kim could have coaxed onto his side if he had been aware were unsure and remained silent, allowing the denouncements to continue. A stunned Chairman Kim could not shore up an effective resistance to the criticism and by the end of the session he was removed from office. News spread slowly as the new pro-Soviet government sought to consolidate its control as it purged pro-Kim officials from power. How the pro-Chinese factions and the Chinese government will react to this change will remain to be seen. However, the Soviet Union is said to be pleased to have North Korea back on the proper revolutionary track. The WPK looks forward to a new phase in its revolutionary development."
