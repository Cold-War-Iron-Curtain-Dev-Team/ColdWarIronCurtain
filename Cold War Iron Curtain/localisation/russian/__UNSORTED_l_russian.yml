 IMF_Pulse_Decision_desc: "Международный валютный фонд готовит свой доклад о рекомендациях, которые, по их мнению, наша страна должна принять для увеличения экономического роста и сокращения регионального долга."
 IMF_desc_2: "У МВФ есть несколько серьезных опасений по поводу нашей национальной политики и нашего заметного уровня государственного долга. Таким образом, МВФ принял решение как можно скорее реструктурировать политику нашей страны, чтобы предотвратить дефицит выплат, падение кредитного рейтинга и предотвратить возникновение долгового кризиса в нашем регионе."
