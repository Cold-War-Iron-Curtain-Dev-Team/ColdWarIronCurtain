 OPCASTOR: "The airborne operation of Operation Castor has succeeded! In order to create new fortifications in strategic and suppliable areas following Giap's invasion of Laos, paratroopers from the French Foreign Legion airdropped into Dien Bien Phu in Northwestern Vietnam over the past few days in order to establish a fortified hedgehog airhead to continue advancement against the Viet Minh. This staging was met with little resistance, and will be highly useful in attacks and defenses in North Vietnam in the coming months. It is the most massive air operation since the World War."
 VIN_HELL: "Following the massive air operation of Operation Castor, General Giap sensed that the Foreign Legion held a weak foothold in Dien Bien Phu. The Viet Minh began to move their forces away from the front line and to the small town in Northwest Vietnam. The guerillas began a series of attacks on Foreign Legion patrols in the area, slowly whittling them down. Over 57 days, the troops held against wave after wave of attacks on their positions until they were eventually repelled. Veterans of the almost two month long conflict now refer to it as the 57 Days of Hell."
 FRA_LAO_1: "Having failed repeatedly in direct attacks on the staunchly defended French positions, General Giap began to put pressure on French Laos in hopes of diverting Foreign Legion divisions. These attacks on various Laotian bases have been successfully repelled. Though the Viet Minh attacked brutally and relentlessly, the French defenses have held against Giap's forces."
 FRA_LAO_2: "Having failed repeatedly in direct attacks on the staunchly defended French positions, General Giap began to put pressure on French Laos in hopes of diverting Foreign Legion divisions. These attacks on various Laotian bases have been successful, with several divisions destroyed as well as the seizure of several bases in Laos."
 BLACK_RIVER_1: "Following a string of disastrous losses of border posts in north Vietnam, the Viet Minh have begun a series of offensives against the French Foreign Legion along the Black River in the T'ai region. General Giap's crossing of the Black River was met with staunch resistance from the Foreign Legion who, in response, began Operation Lorraine - the most massive military operation in Vietnam to date. By enforcing their supply lines and holding onto what was gained in the offensive with tooth and nail, the Foreign Legion is slowly pulling out a victory as they retake several lost outpost"
 BLACK_RIVER_2: "Following a string of disastrous losses of border posts in north Vietnam, the Viet Minh have begun a series of offensives against the French Foreign Legion along the Black River in the T'ai region. General Giap's crossing of the Black River was met with staunch resistance from the Foreign Legion who, in response, began Operation Lorraine - the most massive military operation in Vietnam to date. While the Foreign Legion achieved multiple goals with the offensive, they failed to achieve a decisive victory, further enforced by Viet Minh attacks on the supply lines. Operation Lorraine is now on the backfoot, and though a few defensive victories have been won, they are at great cost."
