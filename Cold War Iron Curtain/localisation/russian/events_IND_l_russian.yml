l_english:
 india.1.d:0 "После более чем четырёхлетних обсуждений Учредительное собрание Индии недавно завершило разработку конституции страны. Первоначально собрание состояло из 389 членов, однако после раздела страны их число сократилось до 299. За время работы собрания было достигнуто немало успехов. Преамбула - это знаменитая 'Целевая резолюция', первоначально представленная Джавахарлалом Неру в 1946 году. Наряду с серьёзными дискуссиями по вопросам каст и прав провинций, ассамблея утвердила государственный флаг. После того как Конституция станет официальным законом Индии, страна перестанет быть доминионом, а станет республикой в составе Содружества. Это позволит Индии стать республикой, но не полностью разорвать связи с Великобританией. Многие индийцы считают, что прекращение отношений доминиона с Великобританией позволит окончательно избавиться от последних остатков колониального господства."
 Green_Revolution.1.d:0 "На протяжении десятилетий индийский народ был жертвой голода и отсутствия продовольственной безопасности. Даже во время последней войны колониальный режим отбирал у населения продовольствие для питания своей военной машины, продолжая разрушать сельское хозяйство. Однако благодаря новым технологическим достижениям и народному правительству, Индия начнет кампанию по прекращению зависимости от иностранной продовольственной помощи и превращению её в житницу Азии. Государственные программы в сочетании с новыми научными исследованиями должны стать основой этой исторической программы. Высокопоставленный чиновник отметил, что колониальный режим часто приводил Индию к голоду и не смог повысить производительность труда по мере роста населения. Индия планирует решить эти проблемы и предоставить фермерам финансовую поддержку, необходимую для выращивания."
 Green_Revolution.2.d:0 "Парламент принял закон, гарантирующий национальное финансирование развития сельского хозяйства. Часть средств будет направлена в университеты для изучения причин отсутствия продовольственной безопасности и разработки новой техники и технологий для расширения производства. Другие средства пойдут на импорт и разработку внутри страны более урожайной и устойчивой к болезням пшеницы и современных удобрений. По всей стране будут развернуты кампании, призванные побудить фермеров к внедрению более эффективных методов ирригации и использованию новых технологий."
 Vietnam_IND.2.d:0 "Соединенные Штаты просят нас поддержать их усилия во Вьетнаме. Они не просят предоставить им боевые войска, но говорят, что мы должны, по крайней мере, предоставить военный полевой госпиталь для поддержки южновьетнамского народа. Очевидно, что наш отказ может привести к прекращению текущей пшеничной помощи, которую они нам оказывают. Некоторые члены правительства считают, что мы должны публично поддержать американскую позицию. Они утверждают, что помощь, которую мы получаем, не имеет значения, но согласие на американскую просьбу могло бы сбалансировать рост глобальных коммунистических активистов в стране. Кроме того, мы можем рассчитывать на большую американскую поддержку и инвестиции. Другие официальные лица считают, что мы должны оставаться сильными и сохранять свою целостность как международное государство. Поддержка неоколониальной войны приведет лишь к расколу республики и предательству ценностей, на которых она была основана."
 Vietnam_IND.3.d:0 "Индийское правительство согласилось направить в Южный Вьетнам полевой госпиталь и публично поддержать нашу позицию во Вьетнаме. Это значительно затруднит коммунистическую пропаганду в Азии и придаст легитимность нашему делу. Что ещё более важно, высокопоставленные индийские чиновники теперь будут бороться с этой пропагандой и защищать нас, чтобы оправдать свои действия. Это большой переворот для нашего правительства. Будут предприняты дополнительные усилия, чтобы убедить американские корпорации и инвесторов обратить внимание на Индию, учитывая её разумную внешнюю политику."
 CPI_FP.1.d:0 "В волнующем обращении к нации премьер-министр Индии объявил о выходе страны из Содружества. Премьер-министр отметил, что эта организация служит лишь для продолжения колониального влияния на бывшие колонии, и Индия должна покинуть её ради своей независимости. После этой речи индийское правительство опубликовало собственное заявление, в котором осудило организацию за отказ поддержать антиколониальные движения и легитимизацию агрессии Запада против мирных государств. Британское правительство выразило свое разочарование и отвергло индийские обвинения. Содружество опубликовало собственное заявление, в котором утверждалось, что организация просто способствует укреплению связей между её членами, имеющими общую историю."
 CPI_FP.2.d:0 "Правительство Индии выразило поддержку Советскому Союзу и призвало Китай прекратить свою враждебную пропаганду и действия. Индийское правительство отметило, что Советский Союз имеет долгую историю поддержки освободительных движений и оказания помощи развивающимся странам. Этот шаг, вероятно, вызовет гнев китайского правительства, которое уже давно с тревогой смотрит на всё более тесные связи между Советским Союзом и Индией. Одна из ведущих китайских газет утверждала, что Советский Союз планирует использовать связи с Индией для стратегического окружения Китая. При этом утверждалось, что Индия остается колониальным партнером, готовым продать себя тому, кто больше заплатит. Индийские газеты поспешили поддержать правительство и осудить китайцев за политику антагонизма и внутренних репрессий. Советский Союз приветствовал это заявление и пригласил индийского премьер-министра посетить страну."
 India_Reconciliation.1.d:0 "Индийское правительство официально запросило переговоры с нашим правительством. Индийцы заявляют, что они хотят восстановить отношения и положить конец многолетней враждебности, возникшей после раздела. Вероятно, индийцы хотят нормализовать отношения и установить более прочные торговые связи. Некоторые наши советники считают, что это может помочь нашей экономике, переживающей недавнюю войну и потери. Кроме того, это может укрепить поддержку среди либеральных элементов общества. Однако Индия, вероятно, использует свои недавние военные успехи, и привлечение её к сотрудничеству может быть расценено как признание нашей слабости. Возможно, для морального духа нашего народа будет лучше отказаться от этой инициативы и сосредоточиться на восстановлении. Мы должны решить, как реагировать."
 India_Reconciliation.2.d:0 "В ходе наших переговоров с Индией они предложили полную нормализацию отношений, а также соглашение о смягчении иммиграционных ограничений. Это соглашение способствовало бы улучшению отношений, особенно торговых. Население нашей страны, скорее всего, поддержит ослабление иммиграционных ограничений, поскольку это позволит воссоединить семьи и друзей, давно разлученных в результате раздела, а также даст возможность некоторым гражданам вернуть утраченное имущество. Однако существует определённое сопротивление, особенно среди высших военных офицеров, которые считают, что наилучшим подходом было бы отказаться от переговоров и прекратить их. Это стало бы подтверждением неповиновения Пакистана. Мы должны решить, как на это реагировать."
 India_Reconciliation.3.d:0 "Наши недавние усилия по нормализации отношений с Пакистаном увенчались успехом. Пакистанцы согласились подписать ряд соглашений, которые позволят улучшить торговлю, нормализовать отношения и ослабить иммиграционные ограничения. Новость об этом соглашении уже позитивно воспринята как внутри страны, так и за рубежом. Теперь мир видит в Индии державу нового типа. Индийцы и пакистанцы теперь могут стать братьями и сестрами, какими они и должны быть. Мы не являемся милитаристской или империалистической державой, напротив, мы миролюбивая нация, стремящаяся к постоянному миру.."
 India_Reconciliation.4.d:0 "Попытка Индии нормализовать отношения с Пакистаном закончилась позорным провалом. Пакистанцы осудили индийцев за стремление закрепить свои недавние успехи и превратить Пакистан в индийскую марионетку. Правительство Пакистана выступило с новым заявлением, в котором говорится, что оно никогда не откажется от своего стремления освободить народ Кашмира и не допустить превращения Индии в гегемонистскую державу в Южной Азии. В ответ индийское правительство заявило, что Пакистан политизирует искренние усилия по достижению мира и лишь демонстрирует своё стремление к войне."
 Pakistan_Ties_Normalized:0 "Нормализация отношений с Пакистаном"
 India_Ties_Normalized:0 "Нормализация отношений с Индией"
 Increased_American_Investments:0 "Увеличение американских инвестиций"
 Supports_American_Efforts_in_Vietnam:0 "Поддержка американских усилий во Вьетнаме"
 Vietnam_IND.1.d:0 "Ситуация во Вьетнаме продолжает обостряться. В международном масштабе северовьетнамская пропаганда находит отклик во всех постколониальных государствах, в том числе и в Индии. Индийское правительство мало что делает для пресечения столь откровенной поддержки коммунистических повстанцев. Наши дипломатические представительства сообщают о росте антиамериканизма и усилении мнения о том, что война, которую мы ведем, - это война колониализма, а не война за защиту вьетнамского народа от коммунистической тирании. Госдепартамент рекомендует обратиться к индийскому правительству с призывом открыто поддержать нашу позицию, провести разъяснительную работу среди населения и направить в Южный Вьетнам военный полевой госпиталь. Просить о предоставлении боевых войск нереально, но такая поддержка укрепит наши позиции и легитимность в Азии. Если Индия будет сопротивляться, мы можем пригрозить ей сокращением помощи пшеницей. Некоторые члены кабинета выступают против этого плана, утверждая, что мы просто вытесним индийцев из нашего лагеря и потеряем те рычаги влияния, которые у нас есть."
 india.7.t:0 "Создана Индийская Народная Республика!"
 india.7.d:0 "Сегодня в Дели был поднят флаг Индийской Народной Республики и спущен флаг Республики Индия. Индийская Народная Республика объявила о победе в революционной войне против Республики Индия. Руководство ИНР заявило, что освободило страну от князей и коррумпированных лидеров Республиканской Индии, которые отбирали деньги у законных простолюдинов. Последние силы и люди Республики Индия перешли на территорию соседнего Пакистана или Бирмы, а также ушли на Цейлон. НАТО назвала это провалом и неудачей в южноазиатском регионе. Коминформ называет это успехом, открывающим двери в Южную Азию и на Ближний Восток для освобождения и революции. Боевые действия в Индии закончились, но изгнанные индийцы заявили, что борьба не закончена."
 india.7.a:0 "Что теперь будет с Индией?"
 india.8.t:0 "Восстание коммунистов в Индии провалилось!"
 india.8.d:0 "Последние силы повстанцев в штате Хайдарабад были обнаружены в горах и сдались. Индийская Народная Республика капитулировала в Хайдарабаде после того, как последние силы были выслежены индийской армией. Индия ввела оккупационные силы, чтобы убедиться, что все последние силы уничтожены. Индийская Республика назвала это великой победой своей страны."
 india.8.a:0 "Интересно"
 India_Emergency.21.d:0 "Парламент Индии принял 39-ю поправку, ставшую второй поправкой, принятой с момента объявления чрезвычайного положения. Новый закон накладывает судебные ограничения на возможности расследования в отношении должности премьер-министра. По сути, он делает недействительным дело о мошенничестве на выборах, возбуждённое против премьер-министра Индиры Ганди. Правительство утверждает, что новый закон позволит судебной власти не вмешиваться в управление страной, лишая политических деятелей полномочий по поверхностным обвинениям. Оппозиция осудила это решение, отметив, что оно является последним в ряду поправок, принятых с 1970 года, которые значительно ослабили судебную власть."
 Srikakulum.1.d:0 "В последние недели напряженность в Шрикакуламе усилилась после убийства двух сторонников крестьянского коммунизма, предположительно, группой помещиков. В ответ на это коммунистические активисты призвали племенных крестьян присоединиться к ним для захвата земли и продовольствия у помещиков. Группы крестьян обрабатывают земли, десятилетиями принадлежавшие местной элите, но не использовавшиеся. Попытки местных властей договориться о разрешении конфликта и снизить напряженность пока не увенчались успехом. Местные власти заявили СМИ, что в ближайшее время они могут задействовать полицию для пресечения преступных действий в регионе, и осудили активистов за введение крестьян в заблуждение ради своих корыстных целей."
 Srikakulum.2.d:0 "Крестьянские волнения в Шрикакулуме недавно переросли в крестьянские рейды, направленные против помещиков. Эти рейды произошли после предполагаемого убийства помещиками коммунистических активистов. Несмотря на это, ситуация с правопорядком быстро ухудшилась, что вынудило прибегнуть к помощи местной полиции. Полицейские операции в основном провалились, их рейды неэффективны, а восставшие крестьяне успешно штурмовали несколько полицейских постов, заставив полицейских бежать. Большую озабоченность вызывают недавние массовые рейды крестьянских боевиков. В одном случае несколько сотен крестьян ворвались на территорию домовладения одного помещика, похитив продукты питания и товары на десятки тысяч рупий. Спустя несколько недель другая масса восставших крестьян напала на деревню и её местную полицию, насчитывавшую несколько сотен человек, и полицейские были вынуждены бежать, понеся большие потери. В связи с обострением ситуации индийское правительство объявило, что направит в регион военизированные силы."
 Srikakulum.3.d:0 "Ситуация в Шрикакулуме была в основном стабилизирована после ввода военизированных формирований. Эти войска, возглавляемые компетентными офицерами и гораздо лучше оснащенные, чем крестьянские принудительные отряды, смогли разогнать повстанческие группы и заставить многих крестьян отказаться от вооруженного сопротивления. В ходе рейдов сил безопасности были убиты несколько коммунистических лидеров, что значительно ослабило крестьянскую организацию. Военные резко сократили масштабы операций и отменили чрезвычайные ограничения, поскольку, судя по всему, большинство крестьян отказались от вооруженного сопротивления, а оставшиеся в живых коммунистические лидеры ушли в подполье. Похоже, что законность и порядок возвращаются в Индию, но агитаторы из числа сельских крестьян все ещё скрываются среди народа."
 INC_60s.1.d:0 "Партия Индийский национальный конгресс с момента своего основания в 1885 году находится на переднем крае борьбы за свободу и прогресс. Именно Конгресс возглавил борьбу за свободу и помог сформировать единую Индию, построенную на идеях секуляризма, равенства и демократии. Однако внутри партии существуют самые разные взгляды и мнения. В последние месяцы премьер-министр заметила, что в партии наметился раскол между более левым крылом и более правой фракцией. Левые по-прежнему выступают за социалистическую политику и за равенство материальных благ. Однако правые во главе с Мораджи Десаи выражают недовольство переходом к чужеродной, по их мнению, социалистической идеологии и неспособностью пропагандировать традиционные гандистские ценности. Они также считают, что правительство должно поддерживать ответственные деловые круги для развития индийской экономики."
 INC_60s.2.d:0 "Попытки премьер-министра договориться о поддержке с двумя фракциями Конгресса закончились крахом после того, как руководство партии приняло решение об исключении премьер-министра Индиры Ганди из партии. Премьер-министр была обвинена в нарушении партийной дисциплины, что по мнению многих, стало причиной её активной поддержки более левой политики. В ответ Индира Ганди объявила, что сформирует собственную фракцию Индийского национального конгресса из своих сторонников и сохранит своё правительство через коалицию. Оставшиеся члены Индийского национального конгресса объединились под руководством Мораджи Десаи, известного борца за свободу и сторонника ценностей, проповедуемых Махатмой Ганди. Он пообещал, что его партия не будет следовать иностранным идеологиям, а будет укреплять экономику и отстаивать интересы общества, задуманного Махатмой."
 Smiling_Buddha.1.d:0 "Премьер-министр Индии тайно дала указание Центру атомных исследований Бхабха начать подготовку к сборке и изготовлению ядерного оружия для проведения испытания. Подготовка была завершена, и вчера вечером Индия взорвала атомную бомбу. Индийское правительство подтвердило факт взрыва, получившего кодовое название 'Улыбающийся Будда', и назвало его мирным ядерным испытанием. Сложившаяся международная и региональная обстановка требует от Индии отстаивать свою позицию. Ядерное оружие - самое мощное оружие на планете, и демонстрация обладания им поставит Индию в ряды элиты. Премьер-министр строго контролировал информацию об испытании и подготовке к нему, поэтому для большей части индийского правительства, народа и даже военных эта новость оказалась неожиданной. Реакция общественности была в основном положительной, поскольку индийцы теперь считают себя частью мировой элиты и ведущей державой региона."
 Smiling_Buddha.2.d:0 "Правительство Индии подтвердило, что недавно в ходе операции, названной им 'Улыбающийся Будда', было взорвано ядерное оружие. Взрыв, проведённый под землей, застал весь мир врасплох, и его детонация ощущалась даже в Исламабаде. Индийские СМИ и большая часть правительства страны выразили удивление, но радость по поводу известия о вступлении Индии в элитный ядерный клуб. Пакистан сразу же осудил индийское испытание как провокацию и эскалацию, пообещав при этом не молчать. Несмотря на эти вызывающие слова, индийское правительство выглядит невозмутимым и настаивает на том, что испытание не носило военного характера и представляло собой исключительно крупное научное достижение Индии. Другие ведущие державы в основном молчат, но ожидается, что в ближайшее время с заявлением выступят Соединенные Штаты."
 Smiling_Buddha.3.d:0 "Недавно Индия произвела взрыв ядерного оружия, став новой ядерной державой. Индийское правительство утверждает, что испытание носило чисто научный, а не военный характер. По данным наших собственных разведывательных источников, индийские военные в значительной степени были отстранены от планирования испытания, хотя их старшие офицеры были в курсе подготовки и хода испытания. Индия, безусловно будет создавать ядерный арсенал, по крайней мере, в качестве средства сдерживания. Это испытание нарушает любой баланс сил в Южной Азии, и мы опасаемся, что другие государства, особенно Пакистан, также могут стремиться к наращиванию своего ядерного потенциала. У нас есть два пути реагирования: мы можем наложить санкции на Индию за то, что она без предупреждения ввела ядерное оружие в регион, или мы можем просто выразить индийцам свою озабоченность. Наше собственное население, похоже, не слишком обеспокоено этим испытанием, но введение санкций способствовало бы укреплению отношений с Пакистаном."
