 IND_BENGAL.1.d:0 "Недавно пакистанская армия начала репрессии в Восточном Пакистане. Жестокое насилие обострило ситуацию и привело к нарастающему кризису беженцев. Пакистанцы, особенно индусы, бегут в Калькутту из Восточного Пакистана. Они рассказывают о зверствах и жестоких репрессиях. Международные СМИ освещают ситуацию, а местные власти создают экстренные лагеря для беженцев. Судя по поступающим с границы сообщениям, число беженцев, скорее всего, достигнет миллионов. Федеральное правительство будет оказывать помощь местным властям. Учитывая количество беженцев и ресурсы, которые потребуются для их размещения, можно ожидать негативного влияния на экономику. Есть также опасения, что между нашим населением и беженцами возникнет напряженность. Как бы то ни было, народ Индии должен воспрянуть духом и помочь бенгальцам, страдающим от военных репрессий."
 IND_BENGAL.2.d:0 "Индийское правительство официально обратилось к нам с просьбой оказать содействие в урегулировании ситуации в Восточном Пакистане. Индийцы ссылаются на растущий кризис с беженцами в Калькутте и широко распространившиеся сообщения о жестоких репрессиях со стороны пакистанских военных. По мнению индийцев, если решение не будет найдено, они могут быть вынуждены действовать и урегулировать ситуацию самостоятельно. У нас исторически сложились тесные связи с Пакистаном, и Госдепартамент считает, что мы можем оказать на него давление. Наши национальные СМИ широко освещают пакистанские репрессии, и всё чаще звучат призывы к тому, чтобы мы приняли меры и положили конец насилию. Однако пакистанцы, скорее всего, негативно воспримут любые наши усилия, а в нашу политику обычно не входит невмешательство во внутренние дела дружественных государств по просьбе других государств."
 IND_BENGAL.3.d:0 "Недавно США направили в Пакистан дипломатическую делегацию и призвали правительство страны прекратить военные действия в Восточном Пакистане. Пакистанское правительство публично заявило, что ценит американский интерес, но, судя по частным сообщениям, оно в ярости. Американские усилия вряд ли заставят Пакистан изменить свой подход к ситуации, однако они свидетельствуют о растущей международной изоляции, в которой оказался Пакистан в связи с проводимыми операциями. Индийское правительство выступило с заявлением в поддержку американских усилий, что вызвало появление в пакистанских СМИ сообщений, обвиняющих Америку и Индию в сговоре против страны."
 IND_BENGAL.4.d:0 "Недавно индийское правительство направило экстренную делегацию для проведения переговоров с нами по поводу продолжающегося кризиса в Восточном Пакистане. Индийцы выразили опасения, что в случае дальнейшего ухудшения ситуации это может привести к катастрофе во всем регионе. Они призвали нас реализовать 'формулу Ахсана' как наилучшее решение для мирного и честного выхода из кризиса. Это было сделано в частном порядке, поскольку индийцы не хотели, чтобы казалось, что они навязывают нам свою позицию, и обеспечили нам политическое прикрытие, что было оценено по достоинству. Высокопоставленные военные руководители и 'ястребы' призывают президента отвергнуть то, что, по их мнению, является гегемонией Индии. Однако некоторые члены кабинета считают, что формула Ахсана остается наилучшим решением, и мы должны реализовать её как можно скорее."
 IND_BENGAL.5.d:0 "Мы получили тревожный ультиматум от индийского правительства, призывающий нас немедленно прекратить военные операции и вывести войска из так называемой Бангладеш. Индийцы называют эти операции гуманитарным кризисом и инкубатором нарушений прав человека, которые приведут к катастрофе во всем регионе. Они дают нам три месяца на то, чтобы осуществить вывод войск, заявляя, что в противном случае Индия может предпринять любые действия, необходимые для прекращения насилия. Многие считают, что Индия просто блефует и не намерена вступать в военные действия. Некоторые другие руководители считают, что даже если Индия вмешается, пакистанская нация будет готова дать достойный ответ. В частном порядке некоторые официальные лица призывают президента принять ультиматум и сократить наши потери в Восточном Пакистане. По их мнению, вывод войск гораздо предпочтительнее того, что, как они опасаются, может закончиться военной катастрофой."