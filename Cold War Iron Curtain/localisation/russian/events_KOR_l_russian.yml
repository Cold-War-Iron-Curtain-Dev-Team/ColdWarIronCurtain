  #Samoan Porposal Events 
 Samoan_Proposal.1.d: "Недавно Пентагон представил новое предложение по разрешению кризиса с корейскими беженцами. Чеджу очень уязвим для коммунистической агрессии, любая попытка укрепить правительство в изгнании может привести к возобновлению конфликта с нами в невыгодном положении. Пентагон хочет превратить Самоа в главную базу демократического корейского правительства в изгнании. Туда же могут быть переселены корейские беженцы. Самоа предлагает безопасную базу в Тихом океане, с которой можно вести будущую освободительную кампанию."
 Samoan_Proposal.2.d: "Соединенные Штаты желают переместить наше правительство в изгнании и беженцев на Самоа. Обещают нам широкую автономию. Самоа находится в Тихом океане, вдали от коммунистических сил. Наши военные и политические эксперты отмечают, что мы можем восстановить наши силы и укрепить свою легитимность, не опасаясь коммунистического вмешательства. Реальность наших обстоятельств означает, что даже если нам не нравится предложение, мы не можем на самом деле с ним не согласиться."
 Samoan_Proposal.3.d: "Ситуация в Корее обострилась до такой степени, что США и их союзники контролируют только остров Чеджу. Корейское правительство желает сохранить остров в качестве передовой базы для своего правительства в изгнании. Некоторые в Соединенных Штатах считают, что они должны контролировать остров как аванпост, чтобы остановить дальнейшую коммунистическую агрессию. Оккупация США, скорее всего, вызовет антагонизм у всех сторон в регионе. Слабая корейская оккупация могла быть легко побеждена. Однако мы могли бы осмотреть территорию и защитить ее как настоящий азиатский бастион против коммунизма. Министр иностранных дел сделает запрос."
 Samoan_Proposal.4.d: "Японское правительство просило нас отдать остров Чеджудо под их оккупацию. Японцы считают себя самой сильной демократической силой, оставшейся в регионе, которая должна нести ответственность. Корейское правительство хочет сохранить контроль над островом как передовую позицию и символ своего постоянного присутствия на полуострове. Наши старшие командиры на местах считают, что мы должны контролировать территорию, чтобы предотвратить ее падение. Японская или американская оккупация могла вызвать волнения и опасения по поводу колониализма. Однако корейское правительство по-прежнему очень уязвимо. Необходимо принять решение."
 Samoan_Proposal.5.d: "Правительство Соединенных Штатов и Кореи согласилось передать управление Чеджу нашей стране. Мы возьмем на себя эту ответственность, чтобы сохранить оплот демократии на Корейском полуострове. В адрес нас и Соединенных Штатов уже звучит критика, состоящая из безосновательных претензий, которые мы предъявляем к колониальному режиму. Без нашего присутствия жителям Чеджу грозит жестокая коммунистическая оккупация. Народ Японии поддерживает угнетенный корейский народ и возьмет на себя торжественную ответственность за сохранение Чеджу."
 Samoan_Proposal.6.d: "Соединенные Штаты, к сожалению, отклонили наше предложение контролировать Чеджу. Американцы отметили, что корейцы и китайцы, скорее всего, будут возмущены таким действием. Они также выразили обеспокоенность тем, что такая оккупация может привести к ремилитаризации нашей нации. Эти опасения явно беспочвенны, поскольку мы стремились действовать как щит и демократический бастион. Несмотря на это недальновидное решение, мы должны оставаться непоколебимыми и преданными делу противостояния коммунизму в Восточной Азии. Коммунистическая угроза остается опасной и мощной."
 Samoan_Proposal.7.d: "Соединенные Штаты подтвердили, что уступят управление и оккупацию Чеджу Японии. Японцы приветствовали этот шаг, заявив, что готовы занять свою позицию, чтобы остановить угрозу коммунистической агрессии в регионе. Отдав Чеджу Японии, американцы, вероятно, надеются свести к минимуму свои собственные обязательства перед регионом и гарантировать, что остров находится под властью могущественной дружественной азиатской державы. Ожидается, что Япония предотвратит дальнейшую коммунистическую корейскую агрессию. Чеджу остается последней территорией Кореи, не находящейся под властью коммунистов после успешного вторжения Северной Кореи в Южную Корею. Китайское и корейское правительства осудили это решение, назвав его возвратом к жестокому японскому империализму."
 Samoan_Proposal.8.d: "Соединенные Штаты подтвердили, что они останутся административной властью в Чеджу. Американские военные считают, что их присутствие на Чеджу спасет этот последний защищенный бастион демократической Кореи. Хотя правительство Южной Кореи и Японии приветствовали эту новость, есть сообщения о массовых протестах. Протестующие обвиняют США в распространении колониального режима в регионе. Коммунистические корейские и китайские государства осудили американский империализм. Американские политики в целом приветствовали этот шаг как необходимый, хотя некоторые ставили под сомнение продолжающееся выделение американских ресурсов потерянной Корее."
 Samoan_Proposal.9.d: "ВМС США подтвердили, что тысячи корейских беженцев, спасающихся от коммунистической оккупации, в настоящее время переправляются в Самоа. Это первая волна, так как американское правительство планирует переселить как можно больше беженцев. Выжившие высокопоставленные гражданские и военные руководители Южной Кореи уже находятся на Самоа. Они создают правительство изгнания и административную структуру для надзора за прибывающими беженцами. Корейцы и другие американские союзники обеспокоены тем, что новое правительство Самоа может быть слишком далеко или изолировано, чтобы произвести изменения в Корее. Однако Соединенные Штаты настаивают на том, что база в Самоа обеспечивает лучший доступ при сохранении безопасности демократических корейских сил."
 Samoan_Proposal.10.d: "Республика Корея открыла свою первую сессию новой Национальной ассамблеи в Самоа. Открытие нового правительства в изгнании после прихода коммунистов к власти в Южной Корее. На заседании ведущие военные и гражданские лидеры пообещали помочь расселить беженцев в Самоа и начать подготовку к кампании национального освобождения. Большая благодарность была выражена Соединенным Штатам за содействие созданию столицы в Самоа. Хотя американские союзники поспешили поздравить корейское правительство, эта новость широко высмеивается в социалистических странах. Коммунистическое правительство Кореи осудило режим Самоа как американских марионеток, не понимающих реальности."
  
  #Korean War Events 
 Korean_War_Ceasefire_show: "Дни до введенного ООН прекращения огня"
 korea.1.t: "Корейская война"
 korea.1.d: "Капиталистическая и преступная 'Республика Корея' должна быть уничтожена,а ее земли присоединены к правильному правительству. Заручившись поддержкой СССР и Китая, мы уже можем начать восстановление контроля над южными землями."
 korea.1.o.a: "Отдать приказ на атаку"
 korea.1.o.b: "Пока-что стоит подождать"
 korea.2.t: "[GetNewspaperHeader]Война в Корее"
 korea.2.d: "Коммунистические силы Корейской Народной Демократической Республики начали неожиданную атаку на капиталистическую Республику Корею. Остается только наблюдать,кто же останется победителем в этой схватке."
 korea.2.o.a: "Совсем недавно была Мировая война"
 korea.2.o.b: "Все идет по плану"
 korea.2.o.c: "Нам лучше заручиться поддержкой США"
 korea.2.o.d: "Мы им поможем"
 korea.31.t: "Спасение Южной Кореи"
 korea.3.t: "Поддержка Южной Кореи"
 korea.3.d: "Помощь Южной Корее против коммунистической агрессии необходима для обеспечения безопасности Японии. Поэтому мы должны отправить туда наши вооруженные силы, чтобы помочь им."
 korea.3.o.a: "Послать войска"
 korea.3.o.b: "Мы не будем вмешиваться"
 korea.4.t: "[GetNewspaperHeader]США вступают в Корейский конфликт"
 korea.4.d: "США вступили в корейский конфликт на стороне Республики Корея против Корейской Народно-Демократической Республики."
 korea.4.o.a: "Все это будет расширяться,не правда ли"
 korea.4.o.b: "Мы этого ожидали"
 korea.4.o.c: "Отлично,это нам очень поможет"
 korea.4.o.d: "Правильное дело"
 north_korean_faction: "Северная Корея"
 korea.5.t: "Помощь Северной Корее"
 korea.5.d1: "Оказывая помощь Северной Корее против американцев и их бандитского государства, «Республика Корея» необходима для обеспечения безопасности Китая и коммунизма в Азии. Поэтому мы должны отправить туда наши вооруженные силы, чтобы помочь им."
 korea.5.d2: "Помощь Северной Корее против бандитского государства «Республика Корея» необходима для обеспечения безопасности коммунизма в Азии. Поэтому мы должны отправить туда наши вооруженные силы, чтобы помочь им."
 korea.6.t: "[GetNewspaperHeader]Коммунистический Китай вступает в Корейский конфликт"
 korea.6.d: "Коммунистический Китай вступил в корейский конфликт на стороне Корейской Народно-Демократической Республики против капиталистической Республики Корея."
 korea.6.o.a: "Что я и говорил,я был прав"
 korea.6.o.b: "Это превратит войну в пользу коммунистов"
 korea.6.o.c: "Хорошие новости"
 korea.6.o.d: "Черт"
 korea.6.o.e: "Достойный соперник"
 korea.7.t: "Преступное государство побеждено"
 korea.7.d: "Наши вооруженные силы сегодня победили капиталистическую «Республику Корея», теперь мы восстановили контроль над нашими южными землями."
 korea.7.o.a: "Еще одна победа коммунизма!"
 korea.8.t: "[GetNewspaperHeader]Северная Корея побеждает Южную Корею"
 korea.8.d1: "Коммунистические корейские силы сегодня победили нашего союзника Республику Корея, призывая к ее немедленной аннексии."
 korea.8.d2: "Корейские коммунистические силы сегодня победили капиталистическое бандитское государство «Республика Корея», призывая к ее немедленной аннексии."
 korea.8.d3: "Коммунистические корейские силы сегодня одержали победу над прокапиталистической Республикой Корея, призвав к ее немедленной аннексии."
 korea.8.o.b: "Вот уж неудача"
 korea.8.o.c: "Как такое могло произойти"
 korea.8.o.d: "Миссия успешна"
 korea.9.t: "Мы сломлены"
 korea.9.d: "Мы потеряли слишком много земель,и смысла сражаться больше нет.Нам нужно сдаться."
 korea.9.o.a: "Подписать капитуляцию"
 korea.9.o.b: "Предатели!Мы никогда не сдадимся!"
 korea.11.t: "Коммунистические повстанцы уничтожены"
 korea.11.d: "Сегодня наши вооруженные силы победили коммунистических мятежников, которые объявили так называемое «государство», теперь мы восстановили контроль над нашими северными землями."
 korea.11.o.a: "Победа для Анти-коммунистической Кореи!"
 korea.12.t: "[GetNewspaperHeader]Южная Корея побеждает Северную Корею"
 korea.12.d1: "Сегодня южнокорейские силы победили нашего союзника - Корейскую Народно-Демократическую Республику, призывая к ее немедленной аннексии."
 korea.12.d2: "Сегодня южнокорейские силы одержали победу над коммунистическими повстанцами Корейской Народно-Демократической Республики, призвав к ее немедленной аннексии."
 korea.12.d3: "Сегодня южнокорейские войска разгромили коммунистическую Народно-демократическую Республику, призывая к ее немедленной аннексии."
 korea.12.o.a: "Наконец,коммунисты побеждены"
 korea.12.o.b: "Коммунизм отбрасывается..."
 korea.12.o.c: "Не стоило им вторгаться"
 korea.13.t: "[GetNewspaperHeader]Перемирие в Корейском конфликте"
 korea.13.d: "Корейская война продолжалась достаточно долго, и мы не достигли прогресса в этой войне. Корейская граница - мясорубка для наших солдат, и мы теряем сотни человек в неделю только за то, что удерживаем линию фронта. Мы обсуждали мирный план с Соединенными Штатами и Организацией Объединенных Наций. Это может стать нашим шансом положить конец этой войне и вернуть жизнь к нормальной жизни. Однако мы могли бы подождать и посмотреть, сможем ли мы сделать прорыв в войне, и посмотреть, сможем ли мы объединить Корейский полуостров, но если это продолжается так долго, это может занять от нескольких месяцев до пары лет. Можем ли мы позволить себе потери и жертву? Должны ли мы отправить перемирие на подпись и позволить этой войне закончиться?"
 korea.13.o.a: "Отличная идея,предложить ее Южной Корее"
 korea.13.o.b: "Испугались коммунистов?"
 korea.14.d: "США подошли к нам с идеей перемирия с коммунистами."
 korea.14.o.a: "Пора покончить с этим"
 korea.14.o.b: "Мы же их еще не победили"
 korea.15.d: "Преступное государство предлагает перимирие."
 korea.15.o.a: "Конечно, но только пока, вы еще получите"
 korea.16.t: "Соглашение о перемирии в Корее"
 korea.16.d: "Соглашение о перемирии в Корее было подписано в деревне Панмунжом, прекратив военные действия в Корейской войне и переключив земли между обеими сторонами."
 korea.16.o.a: "Наконец-то немного покоя"
 korea.17.o.a: "Хорошая идея,предложить ее Северной Корее"
 korea.17.o.b: "Капиталистов испугались?"
 korea.18.d: "Китай обратился к нам с идеей перемирия с бандитским государством."
 korea.19.d: "Коммунистические повстанцы предлагают перемирие с ними."
 korea.20.d: "Северная и Южная Корея подписали перемирие, положив конец войне между ними."
 korea.20.o.a: "Мир возвращается в Корею"
 korea.20.o.b: "Все пошло не по плану"
 korea.22.d: "Организация Объединенных Наций обратилась к нам с идеей перемирия с ними и бандитского государства."
 korea.23.d: "Организация Объединенных Наций обратилась к нам с идеей перемирия с коммунистами."
 korea.24.t: "Битва продолжится"
 korea.24.d: "Южная Корея потеряна. Возможно,мы могли бы ее возвратить,но это будет стоить огромных усилий. Готовы ли мы сделать это?"
 korea.24.o.a: "Нет, пусть все закончится"
 korea.24.o.b: "Да,битва за Южную Корею продолжится"
 korea.25.d: "Северная Корея потеряна. Возможно,мы могли бы ее возвратить,но это будет стоить огромных усилий. Готовы ли мы сделать это?"
 korea.25.o.b: "Да, мы продолжим воевать за Северную Корею"
 korea.26.t: "[GetNewspaperHeader]США выводят войска из Кореи"
 korea.26.d: "Американские войска выводятся из Кореи, поскольку Республика Корея была распущена и заменена коммунистическим правлением."
 korea.26.o.a: "Война закончилась?"
 korea.26.o.b: "Мы провалились"
 korea.27.t: "[GetNewspaperHeader]Китай выводит войска из Кореи"
 korea.27.d: "Китайские войска выводятся из Кореи, поскольку Корейская Народно-Демократическая Республика была распущена и заменена капиталистическим правлением."
 korea.28.t: "Аннексия Южной Кореи"
 korea.28.d1: "Здесь нам нужно, чтобы вы подписали эти документы в качестве формальности, чтобы аннексировать бандитское государство, а также распустить нашу военную фракцию с Китаем."
 korea.28.d2: "Здесь нам нужно, чтобы вы подписали эти документы в качестве формальности, чтобы аннексировать бандитское государство."
 korea.28.o.a: "Дайте мне подписать"
 korea.29.t: "Аннексия Северной Кореи"
 korea.29.d: "Здесь нам нужно, чтобы вы подписали эти документы в качестве формальности для аннексии коммунистического мятежного государства.."
 korea.30.t: "[GetNewspaperHeader]Соглашение о перемирии в Корее!"
 korea.30.d: "Между Северной Кореей и Южной Кореей было подписано соглашение о перемирии с участием США. Соглашение о перемирии в Корее гласит, что новая граница основана на линии Канзас или там, где в последний раз происходили боевые действия. В настоящее время на границе находится ДМЗ протяженностью 250 км. 2 враждующие страны подписали соглашение о прекращении огня, и боевые действия прекратились. Война в Корее, похоже, окончился, и теперь обе стороны претендуют на победу, хоть это и статус-кво. На Корейском полуострове воцарилось спокойствие. Будем надеяться, что теперь они будут за мир, а не за войну."
 korea.30.o.a: "Что же теперь будет?"
 korea.30.o.b: "Это наша судьба для освобождения Кореи."
 korea.30.o.c: "Мы будем защищаться до последнего человека"
 korea.30.o.d: "Мы сдержали коммунизм."
 korea.30.o.e: "Мы поможем Северной Корее в любое время для освобождения."
 korea.30.o.f: "Мы освободим Корею в другой раз."
 korea.31.d: "Южная Корея подвергается нападению коммунистической угрозы на Севере, мы должны послать туда свои вооруженные силы, чтобы помочь им."
 korea.31.o.a: "Послать войска"
 korea.31.o.b: "Мы не будем вмешиваться"
 korea.32.t: "[GetNewspaperHeader]Содружество вступает в Корейский конфликт"
 korea.32.d: "Содружество наций вступило в корейский конфликт на стороне Республики Корея против Корейской Народно-Демократической Республики."
 korea.32.o.a: "Оно будет только расширяться,не так ли"
 korea.32.o.b: "Мы этого ожидали"
 korea.32.o.c: "Это нам поможет"
 korea.32.o.d: "Правильная вещь"
 korea.33.t: "Поддержка Северной Кореи"
 korea.33.d1: "Оказывание помощи Северной Корее против американцев и их преступной «Республики Корея» необходимо для обеспечения безопасности Советского Союза и коммунизма в Азии. Поэтому мы должны отправить туда наши вооруженные силы, чтобы помочь им."
 korea.33.d2: "Помощь Северной Корее против бандитского государства «Республика Корея» необходима для обеспечения безопасности коммунизма в Азии. Поэтому мы должны отправить туда наши вооруженные силы, чтобы помочь им."
 korea.34.t: "[GetNewspaperHeader]СССР вступает в Корейский конфликт"
 korea.34.d: "Советский Союз вступил в корейский конфликт на стороне Корейской Народно-Демократической Республики против капиталистической Республики Корея."
 korea.34.o.a: "Что я говорил, я был прав"
 korea.34.o.b: "Это обернет войну в пользу коммунистов"
 korea.34.o.c: "Хорошо"
 korea.34.o.d: "Не надо"
 korea.34.o.e: "Достойный соперник"
 korea.33.o.b: "Послать снаряжение нашим товарищам"
 korea.33.o.a: "Они с легкостью их разгромят"
 Korean_War_Ceasefire: "Перемирие в Корейской войне"
 FRAkorea.4.d: "Стремясь поддержать демократически избранный южнокорейский режим и поддержать своих американских союзников, французское правительство направило добровольческие силы в размере батальона, чтобы помочь Южной Корее против поддерживаемой Советами и Китаем Северной Кореи. По разным данным, в его состав войдут более 3500 военнослужащих как добровольческих, так и резервных сил. Его будет возглавлять генерал-лейтенант Рауль Магрин-Вернерей, один из самых выдающихся героев войны во Франции во время Второй мировой войны. Наблюдатели отмечают, что с вхождением Франции в этот мелкомасштабный конфликт в Восточной Азии, это может привести к эскалации напряженности в Холодной войне и может привести к прямому военному конфликту между НАТО и Советским Союзом."
 korea.47.d: "В условиях глобального недовольства властью и национальной неприязни к правительству Южной Кореи в этом году вспыхнули вспышки протеста. В течение последних двух лет народ Южной Кореи с 1948 года все больше возмущался своим президентом Сингманом Ри, занимавшим этот пост. В 1958 году, опасаясь потери власти, президент Ри вызвал изменение в национальных законах, которое расширило исполнительную власть экстенсивно. В следующем году два крупнейших политических соперника Ри на президентских выборах 1960 года погибли при подозрительных обстоятельствах, и один из его ближайших политических союзников был избран вице-президентом мошенническим голосованием, что привело к распространенным слухам о том, что Ри поддерживает власть кровью и интригами. В этом году корейцы объявили, что с них хватит. То, что началось с небольшого протеста Демократической партии, разразилось в масштабах после того, как полиция убила студенческого протестующего со слезоточивым газом. По мере того, как протесты нарастали в течение апреля, численные солдаты и полиция вступили в проигрышную битву, прежде чем, наконец, отказались стрелять в демонстрантов. Оставшись во власти своего электората, Ри быстро ушел в отставку и бежал из страны. Народ Южной Кореи теперь пытается реорганизовать свою республику по парламентской модели, надеясь обуздать власть исполнительной власти и обеспечить, чтобы больше не коррумпированные силовики не захватили бразды правления."
 korea.48.d: "Совет Безопасности ООН единогласно проголосовал за принятие резолюции 82 в ответ на вторжение Северной Кореи в Южную Корею. Советский Союз не присутствовал на встрече, поскольку они бойкотируют Совет Безопасности, поэтому не могли наложить вето. Из нынешних членов Совета безопасности воздержалась только Югославия. Резолюция осуждает вторжение Северной Кореи и призывает государства-члены помочь Южной Корее и воздерживаться от вооружения или поддержки Северной Кореи. Соединенные Штаты и их союзники провозглашают резолюцию крупной дипломатической победой, и аналитики считают, что она проложит путь к более непосредственному участию Америки в конфликте. Многие государства-члены, особенно Соединенные Штаты и Западная Европа, сочувствуют южнокорейцам, поскольку воспоминания о Второй мировой войне и внезапных нападениях держав Оси остаются запечатленными в коллективной памяти их лидеров."
  
  #Secretary of Defense question event 
 #KOR_Secretary_of_Defense.1.d: "The former Secretary of Defense Lee Beom-seok has requested that his resignation be accepted. His role as Prime Minister will remain, but if he resigns as Secretary of Defense, a new figure will have to sit there and take charge of the military. What should we do?"
 #KOR_Secretary_of_Defense.2.d: "Shin Sung-mo became the new defense minister. He was a former naval officer and served in the military with the rank of lieutenant general, but recently returned to Korea to assist Rhee Syng-man. He has no actual experience and is considered "military incompetent" by many people, but it may be quite helpful for President Syngman Rhee himself. As soon as he was appointed as Minister of Defense, he is strongly advocating the theory of Korean unification by force."
 #KOR_Secretary_of_Defense.3.d: "Admiral Shin Sung-mo demanded the highest rank of navy in exchange for taking the position of defense minister from him. What should we do?"
  #Syngman Rhee first term events 
 KOR_Syngman_Rhee.1.d: "Сегодня днем была учреждена лига Бодо. Создание этой организации было смоделировано по образцу Дэхвасук, прояпонской группы новообращенных в японскую колониальную эпоху, и связано с Законом о национальной безопасности, который вступил в силу в декабре 1948 года, и анализируется, что корейское правительство нуждалось в учреждении для систематической защиты, управления и мониторинга новообращенных. Прокурор Сон У Чжон Вон и О Чжэ До руководили процессом формирования." 
 KOR_Syngman_Rhee.2.d: "Сегодня утром кампания по ликвидации на Чеджудо только что закончилась. Первая Республика Корея при президенте Сын Ман Ли усилила подавление восстания с августа 1948 года, объявив в ноябре военное положение и начав "кампанию по уничтожению" повстанческих сил в сельских районах Чеджудо в марте 1949 года, разгромив их в течение двух месяцев. Ситуация на Чеджудо не кажется хорошей."
 KOR_Syngman_Rhee.3.d: "Мы должны подготовиться к предстоящему мероприятию. Как это будет работать?"
 KOR_Kim_Koo_assasination.1.d: "Надеждам на воссоединение Кореи и возрождение национализма в Республике Корея сегодня пришел конец, поскольку сегодня был убит ее видный сторонник Ким Ку. По данным полиции, Ан Ду Хи, лейтенант армии Республики Корея, ворвался в резиденцию Ким Ку и выстрелил в него 4 раза. По словам Ана, он утверждает, что несет единоличную ответственность за убийство, утверждая, что это было совершено по его собственной инициативе, и что никакая другая сторона не играла роли в убийстве Ким Ку. Он также заявил, что Ким Ку якобы сотрудничает с Советским Союзом и что его присутствие в Южной Корее служит питательной средой для мятежей. Однако наблюдатели считают иначе, и они предполагают, что покушение на убийство на самом деле было организовано самой администрацией Ри в попытке консолидировать власть и влияние по всей республике. Тем не менее, это убийство станет пятном на репутации администрации Ри."
 KOR_Kim_Koo_assasination.2.d: "Надеждам на воссоединение Кореи и возрождение национализма в Республике Корея сегодня почти пришел конец, поскольку его видный сторонник Ким Ку был так близок к тому, чтобы быть убитым сегодня. Ан Ду Хи, лейтенант армии Республики Корея, ворвался в резиденцию Ким Ку и чуть не застрелил его, но прямо перед этим к нему подскочил Ким Ку и закричал о помощи. В этот момент охранники из числа жильцов быстро вбежали в дом и задержали подозреваемого. Позже этим утром Ким Ку сделал заявление о том, что убийца, который проник в его дом, был "явно одним из людей президента Ли Сын Мана". Ким Ку не пострадал, и это покушение на убийство ляжет темным пятном на репутацию администрации Ри."
 KOR_Syngman_Rhee.4.d: "После обретения независимости 15 августа 1945 года в Южной Корее существовало несколько партий левого толка, но деятельность Коммунистической партии Кореи практически прекратилась, поэтому три партии (Коммунистическая партия Кореи, Народная партия Кореи и Новая демократическая партия Южной Кореи) были объединены в одну. были объединены в "Рабочую партию Южной Кореи". Первым председателем был избран Хо Чжон, а заместителем председателя - Пак Хон Ен. На этой неделе президент Первой Республики Ли Сын Ман принял Закон о национальной безопасности, свергнув все коммунистические силы в Республике Корея, используя государственную власть в соответствии с Законом о национальной безопасности."
 ##SKnews.4.d: "Earlier this morning in Seoul, an assassination attempt against Chang Myon failed. A sniper in the Sigong building attacked the Vice President and he received a penetrating wound to the wrist. Immediately, security forces moved to shield Chang Myon and chase the sniper. The sniper attempted to flee but was arrested. Chang Myon is currently in the hospital seeing to his injuries and an investigation is being mounted. The primary suspect to the incident is the Liberal Party who are the only ones who may desire to kill the vice president. The attack has been publicly condemned by supporters and members of the liberal party."
 ##SKnews.2.d: "Cho Bong-am, the former Progressive Party candidate, has been found guilty of espionage and sentenced to death. After his first trial failed to accrue enough evidence to convict him several months ago, a more recent trial had found conclusive evidence that Cho Bang-am had been funded by North Korea. The evidence that Cho Bang-am has been conspiring against South Korea has led to increased tensions between the 2 nations. Already, there is public outrage and fear that North Korea may make another attempt to infiltrate the South Korean government. The heightened state of affairs has led to an increased state of awareness in the country and additional funding to audit systems."
 ##SKnews.1.d: "For more than half a millenia, the Korean Peninsula was ruled by a dynasty similar to its neighbor to the north, the Yi Dynasty. However, thanks to inefficient bureaucracy, corruption, and the weakening power of its Qing protectors, the Yi Dynasty was deposed from their rule, and was replaced by the local administration of the Empire of Japan. However, hope for monarchism and the restoration of the Yi Dynasty has been restored, for the Yi Dynasty was able to overthrow the provisional government placed by the United States and overseen by Syngman Rhee and restore their imperial rule over the Southern half of the Korean Peninsula. This chain of events in the Korean Peninsula is unprecedented, and the United States have yet to respond, but are likely to support the monarchist rule. However, the DPRK or North Korea doesn't seemed pleased, and have mobilized more troops to the DMZ to ensure its security."
 ##SKnews.3.d: "A period of both national and international uproar has occurred today, as recent evidence has came to light that government forces have organized mass slaughter of civilians in the Republic of Korea. The massacres, organized none other than by the Rhee administration itself, have claimed that these massacres are necessary since the victims are communist sympathizers, people who would institute a revolution if they weren't sacrificed for the nation. Such rhetoric hasn't convinced the people of South Korea or the world rather, with condemnation coming from various nations, with the United States, the sole backer of South Korea, have yet to respond. This act is thought by observers as something that has reinvigorated opposition to the Rhee administration, not acceptance of it."
 ##SKnews.6.d: "Democracy is slowly fading to the abyss in the young republic, as President Syngman Rhee has extended term limits for his office, eventually paving the way for an authoritarian regime. While extending term limits is considered by many as nothing since they could simply lose an election, the fact is that the extended term limits coupled with allegations of election fraud have been seen by many observers as a dictatorship. While the Rhee administration hasn't given out an official statement as to why they extended term limits, it is perfectly clear that Syngman Rhee will use this to consolidate his position in South Korea, and ensure opposition to his regime is manageable or even non-existent."
