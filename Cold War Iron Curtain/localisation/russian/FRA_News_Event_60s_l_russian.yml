l_english:
 fra_news.1.t: "[GetNewspaperHeader]Введение нового франка"
 fra_news.1.d: "27 декабря 1958 года был издан приказ о том, что \"с даты, установленной декретом, и не позднее 1 января 1960 года должна быть создана новая французская денежная единица, стоимость которой составит сто франков\". Новая валюта \"обозначается термином новый Франк\". Эта денежная реформа, подготовленная Жаком Рюффом выступает за прекращение инфляции и содействия экономическому и финансовому развитию страны. При внешней стоимости Франка, зафиксированной на уровне 1,8 миллиграмма чистого золота (180 миллиграммов за новый Франк), Франция связана с возвратом к конвертируемости европейских валют и, таким образом, может в полной мере участвовать в запуске крупной инициативы - строительства европейского сообщества."
 fra_news.1.a: "Они восстановили престиж франка"
 fra_news.2.t: "[GetNewspaperHeader]Создание службы гражданских действий"
 fra_news.2.d: "По мере того как интенсивность Алжирской войны росла, повышалось и напряжение между теми кто быд в Алжире. Вслед за арабской, коммунистической и военной оппозицией де Голлю - главный африканский советник Жак Фоккар увидел необходимость в контрнаступлении против этих сил. Голлистское ополчение, известное как Service d'Action Civique, было сформировано в г. Константина, представляющее собой коалицию проправительственных сил, рассеянных по всему региону."
 fra_news.2.a: "Еще одна милиция?!"
 fra_news.3.t: " [GetNewspaperHeader]Неделя баррикад"
 fra_news.3.d: "Французские алжирцы были взбешены тем, что де Голль, бросил их на произвол судьбы, что привело к протесты по всему городу Алжир. Лидер партии Пьер Лагайяр будет руководить тысячами людей, выходящих на улицы. То, что начиналось мирно, обернется насилием, когда полиция начнет стрелять в толпу. Правительственные здания были быстро разрушены, так как на улицах воцарился хаос. К 1 февраля сторонники де Голля должны были войти в город и восстановить порядок."
 fra_news.3.a: "Как долго это может продолжаться?"
 fra_news.4.t: "Смерть Альбера Камю"
 fra_news.4.d: "Известный французский алжирский писатель Альбер Камю погиб в автокатастрофе 4 января 1960 года. Один из величайших авторов французской литературы, Камю сделал большие шаги в развитии абсурда и поднял осведомленность об Алжирской борьбе внутри республики. Хоть он прожил короткую жизнь, его вклад в мир литературы не будет забыт."
 fra_news.4.a: " \" Нет любви к жизни без отчаяния по поводу Жизни\" "
 fra_news.21.t.fal: "[GetNewspaperHeader]Алжирский путч провалился"
 fra_news.21.t.suc: "[GetNewspaperHeader]Алжирская революция"
 fra_news.21.d.fal: "В разгар Алжирской войны секретные переговоры между НФО и Де Голлем вызвали гнев французских алжирских генералов, которые чувствовали, что европейское Алжирское население было предано. Во главе с Морисом Шалле французские колониальные войска попытались устроить переворот в трех крупнейших городах Алжира, но немного солдат поддержали их. В Оране и Константине переворот даже не начинался, поскольку офицеры и солдаты отказывались подчиняться приказам. На следующий день Де Голль выступил с вдохновляющей речью, которая еще больше ослабила поддержку переворота. Путч быстро провалился, так как все его участники снова перешли на сторону правительства. Этот инцидент доказал, что Франция поддерживает де Голля даже во времена борьбы нации."
 fra_news.21.d.suc: "Бои в Париже, наконец, утихли, поскольку несколько оставшихся бойцов голлистов и коммунистов, рассеянных по всему городу, сдались. После недолгих поисков Шарль де Голль был наконец схвачен в Руане, когда пытался добраться до Гавра, чтобы бежать в Британию. Быстро прошел суд над де Голлем, которого путчисты обвиняют в государственной измене за предательство Французского Алжира. Не лучше обстоят дела и с левыми группами по всей Франции: по сообщениям, более 5000 французских социалистов и коммунистов были арестованы. Радикальная партия и партия голлистов официально объявлены вне закона, любая связь с ними незаконна. Парижане проходят мимо танков, время от времени слыша отдаленные выстрелы. Люди продолжают жить своей жизнью, даже на закате 5 республики. По мере того как пыль оседает, будущее Франции остается неясным. Будет ли это переходный этап к шестой Республике или новая эра французского авторитаризма? Одно можно сказать точно: алжирская война еще далека от завершения..."
 fra_news.21.a: "Да здравствует Франция!"
 fra_news.21.b: "Французский народ выстоит!"
 fra_news.21.c: "Интересно..."
 fra_news.31.t.gen: "[GetNewspaperHeader][USA.GetLeader] посетил Францию"
 fra_news.31.t.jfk: "[GetNewspaperHeader]Визит президента США Кеннеди во Францию"
 fra_news.31.d.gen: "\"Я пришел сюда не для того, чтобы улаживать наши разногласия, ибо это споры между друзьями, а для того, чтобы обратиться за советом к одному из самых мудрых и героических людей нашего времени. И объяснить Европе, что такое Америка сегодня.\" Первые слова из [USA.GetLeader] в Париже пользуются успехом фильмы с Шарлем де Голлем. Между двумя союзниками запланированы двенадцатичасовые переговоры до пятницы, на которых будут обсуждаться напряженность между Востоком и Западом в Берлине, война в Алжире, а также выбор Франции в пользу приобретения ядерного оружия. [USA.GetLeader] пытался отговорить его, но что делать с упрямством человека из \"Нет\"?"
 fra_news.5.t: "Мишель Дебре получает полную власть над алжирским вопросом"
 fra_news.5.d: "После недели баррикад французский премьер-министр Мишель Дебре получает от французского парламента все полномочия для решения алжирского вопроса. Мишель Дебре уже давно защищает французский Алжир, но в конечном счете то, как он поступит с Алжиром, - это вопрос времени. С течением времени ситуация обостряется, и воинствующие группировки только усиливаются."
 fra_news.5.a: "Надеюсь, премьер-министр примет правильное решение."
 fra_news.7.t: "Réseau Jeanson и арест НФО в Метрополе"
 fra_news.7.d: "По приказу французского премьер-министра на материковой части Франции арестованы воинствующая левая французская группировка \"Réseau Jeanson\" и национальный фронт освобождения Алжира. Эти группы уже давно занимаются контрабандой денежных купюр и оружия из страны для поддержки воюющих сторон в Алжире и остаются незамеченными. Однако после серии допросов были выявлены места расположения различных ячеек и некоторые связи между группировками. После получения этой информации, аресты продолжаются, принимая всех, кто являются соучастниками под стражу."
 fra_news.7.a: "Эта серия арестов, скорее всего, приведет к тому, что НФО будет испытывать нехватку оружия и денег."
 fra_news.8.t: "Де Голль прибывает в Алжир"
 fra_news.8.d: "В разгар Алжирской войны Шарль де Голль прибыл в Алжир. В Алжире, Константине и Оране президент встретился с военными офицерами, чтобы обсудить дальнейшие планы по борьбе с повстанцами. Обсуждая свои планы, де Голль вновь заявляет, что у алжирцев есть выбор, как решить свое будущее, но пока продолжается военное насилие, этого сделать нельзя. Условия для французских военных были отмечены как удовлетворительные, и де Голль продолжает приказ продолжать борьбу. \nЭта поездка подняла боевой дух тех, кто сражается в Алжире, доказав, что кампания может оказаться успешной, если французские усилия продолжатся, поскольку конфликт пока не собирается прекращаться."
 fra_news.8.a: "Бой продолжается!"
 fra_news.9.t: "Хрущев посещает Францию"
 fra_news.9.d: "Сегодня первый секретарь ЦК КПСС Н. С. Хрущев встретился с де Голлем с дипломатической миссией по поводу раскола Германии. Хрущев требует, чтобы был заключен мирный договор как с обоими Германиями, так и с Советским Союзом, иначе он заключил бы договор с Восточной Германией, фактически оставив им полный контроль над маршрутами в город. Давление по послевоенному германскому вопросу накаляется, и этот вопрос вызывает несогласие среди западных союзников, которые не хотят начинать войну так скоро после 2-й мировой войны."
 fra_news.9.a: "Готова ли Франция признать ГДР?"
 fra_news.10.t: "Основание объединенной социалистической партии"
 fra_news.10.d: "Объединенная Социалистическая партия Франции, после многих лет раскола среди французских левых, собирается. Демократические социалисты, христианские левые и социал-демократы по всей стране празднуют основание партии. Имея около 20000 активных членов и ~500000 предполагаемых сторонников по всей стране, ОСП стремится расширить свое влияние с помощью серии кампаний под руководством недавно объединенных французских левых. В настоящее время ОСП работает над выпуском своей официальной платформы, объединяющей общие элементы от 3 объединенных социалистических партий. При поддержке левых со всей страны, левые идеологии имеют больше шансов, чем когда-либо, добиться политической власти во Франции."
 fra_news.10.a: "Миттеран действительно проделал хорошую работу..."
 fra_news.31.a: "Хороший визит нашего американского друга!"
 fra_news.31.b: "...Он прибыл в Париж, как король, и уехал, как легенда!"
 fra_news.31.d.jfk: "Если острые дипломатические переговоры остаются за кадром, то история в основном будет помнить о том, что происходит на сцене. Ажиотаж в столице находится в самом разгаре, чтобы принять у себя самую гламурную политическую пару на планете. Они молоды, красивы, загорелы, шикарны и непринужденны... Пресса тем более питает любопытство публики, что привлекательный президент и первая леди занимают Белый дом всего пять месяцев. \"Спутанные волосы, рост 1,82 м, вес 81 кг, возраст 44 года ...\" описывают журналисты. Но очень скоро именно его жена Жаклин, 31 год, шокирует газетчиков. Парижане смотрят только на ее \"элегантные наряды\", ее шляпки в форме камамбера, ее \"смеющиеся глаза\" и ее голос маленькой девочки. А еще лучше: в ней течет французская кровь, о чем свидетельствуют ее имя и девичья фамилия (Бувье). Кеннеди тоже понял: звезда - это Жаклин. И он это комментирует так: \"Я не думаю, что будет лишним представиться: я парень, который сопровождает Жаклин Кеннеди,\" он проскальзывает в пятницу в преамбуле своего выступления перед 500 журналистами. Накануне пара обедала в Версальском дворце, в ледяном зале, освещенном свечами. \"Мне кажется, я перенеслась на небеса, я никогда не видела ничего подобного,\" говорит Жаклин, сверкая в своем вышитом платье. Когда лимузин привозит их обратно в Орли, 150 000 человек приветствуют их..."
 algerian_war_news.1.t: "[GetNewspaperHeader]Испытания бомбы Gerboise Blanche"
 algerian_war_news.1.d: "\nВзрыв, который потряс Африку\n\nДолгожданное французское испытание ядерной бомбы наконец-то произошло в город Регган на крайнем юге Алжира. На окраине деревни уже некоторое время существовали многочисленные ракетные полигоны, где в пустыне был построен испытательный полигон. Очистив близлежащий город от гражданских лиц, чтобы избежать радиационного отравления. В 22:00 испытания были проведены.\n\nМногие шокированы тем, что французы сделали это, не смотря на то что их западные союзники не одобряли это. Эта акция вызвала напряженность в продолжающейся Алжирской войне."
 algerian_war_news.1.a: "Оглушительный успех!"
 algerian_war_news.2.t: "Убийства в Алжире!"
 algerian_war_news.2.d: "Анри Лорийо, старший офицер французского верховного командования в Алжирской колонии, обнаружил несколько очень ужасных самоубийств некоторых видных алжирских националистических лидеров. Среди них был Роберт Баррат, убежденный журналист-антиколониалист. Это спорное открытие заставило некоторых поверить, что это были не самоубийства, а убийства, совершенные французскими войсками в Алжире. Это может быть очень пагубно для нынешней нестабильной североафриканской колонии."
 algerian_war_news.2.a: "Очень варварский метод"
 fra_news.6.t: "[GetNewspaperHeader]\n\nИспытания бомбы Gerboise Bleue"
