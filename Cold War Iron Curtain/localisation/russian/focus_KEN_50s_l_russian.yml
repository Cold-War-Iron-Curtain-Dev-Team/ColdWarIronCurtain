 KEN_50s_mitchell_governorship: "Губернаторство Митчелла"
 KEN_50s_mitchell_governorship_desc: "Первоначально назначенный губернатором Кении в декабре 1944 года, Митчелл подходил к этой должности с позиции долга и ответственности перед туземцами. Однако впоследствии эта точка зрения сошла на нет, и на смену рвению Митчелла пришло насмешливое отношение к \"огромной массе человеческих существ\", которые \"в настоящее время находятся в очень примитивном моральном, культурном и социальном состоянии"
 KEN_50s_support_bantu_cooperatives: "Поддержка кооперативов банту"
 KEN_50s_support_bantu_cooperatives_desc: "Митчелл верит в возрождение и поддержку введения кооперативов этнических банту по всей нашей сельской местности, примером могут служить масаи"
 KEN_50s_invite_princess_elizabeth: "Пригласить принцессу Елизавету"
 KEN_50s_invite_princess_elizabeth_desc: "Поскольку его величество, король Георг VI, находится в плохом состоянии здоровья, было решено, что принцесса Елизавета совершит турне по Кении вместо него."
 KEN_50s_ignore_mau_mau: "Игнорировать Мау-Мау"
 KEN_50s_ignore_mau_mau_desc: "Движения и деятельность кикуйю не являются чем-то новым в Кении. Мы можем игнорировать эту очевидную попытку спровоцировать реакцию нашей администрации"
 KEN_50s_embrace_swahili_language_in_schools: "Принять язык суахили в школах"
 KEN_50s_embrace_swahili_language_in_schools_desc: "Будучи основным языком нашего народа, суахили должен быть принят в качестве нового основного языка в нашей системе образования"
 KEN_50s_the_retiring_of_mitchell: "Уход в отставку Филипа Митчелла"
 KEN_50s_the_retiring_of_mitchell_desc: "После почти 10 лет довольно неактивного, но не хаотичного правления время пребывания Филипа Митчелла на посту губернатора подходит к концу. Будем надеяться, что его преемник будет играть более активную роль в жизни протектората"
 KEN_50s_the_kolloa_affray: "The Kolloa Affray"
 KEN_50s_the_kolloa_affray_desc: "Проблема местных религиозных пророков существовала на протяжении многих лет, еще до появления колониальной администрации. Хотя их послания обычно были разными; один Лукас Пкеч, похоже, взял на себя труд разжигать неприятности своей антиколониальной риторикой и подстрекать к неповиновению по всему протекторату."
 KEN_50s_lucas_pkech_surrenders: "Лукас Пкеч сдается"
 KEN_50s_lucas_pkech_surrenders_desc: "Лукас Пкеч, понимая, что это может плохо кончиться, предпочел мирно сдаться местным властям."
 KEN_50s_alan_stevens_confronts_seditioners: "Алан Стивенс противостоит подстрекателям"
 KEN_50s_alan_stevens_confronts_seditioners_desc: "Хотя это, возможно, и не лучшее решение, местный офицер Алан Стивенс пришел к выводу, что применение силы является оптимальным способом борьбы с беспорядками. Будем надеяться, что это не приведет к слишком тяжелым последствиям"
 KEN_50s_governor_evelyn_baring: "Губернатор Эвелин Баринг"
 KEN_50s_governor_evelyn_baring_desc: "Новое десятилетие означает нового губернатора. Давайте посмотрим, что приготовил Эвелин Баринг для своего пребывания на посту"
 KEN_50s_the_royal_technical_college: "Королевский технический колледж"
 KEN_50s_the_royal_technical_college_desc: "Поскольку по всему протекторату появляются новые высшие учебные заведения, было решено объединить две существующие концепции и создать \"Королевский технический колледж, Найроби\", благодаря идее азиатской общины о создании мемориального колледжа, посвященного Махатме Ганди."
 KEN_50s_the_swynnerton_plan: "План Свиннертона"
 KEN_50s_the_swynnerton_plan_desc: "С развитием экономики пришла идея губернатора Эвелин Баринг о создании \"Плана Свиннертона\", направленного на радикальное увеличение сельскохозяйственного производства."
 KEN_50s_kakuzi_limited_co: "Kakuzi Limited Co."
 KEN_50s_kakuzi_limited_co_desc: "Первым этапом этого грандиозного плана является создание компании \"Kakuzi PLC\", которая в первую очередь будет заниматься производством чая, авокадо и ананасов, а также животноводством."
 KEN_50s_rea_vipingo_co: "Rea Vipingo Co."
 KEN_50s_rea_vipingo_co_desc: "После реализации проекта вторым этапом станет основание компании \"Rea Vipingo\", продукцией которой будет сизаль."
 KEN_50s_unga_group_limited_co: "Компания Unga Group Limited"
 KEN_50s_unga_group_limited_co_desc: "Наконец, последним этапом этой деятельности будет субсидирование компании \"Unga Group Limited\", основной продукцией которой является мукомольная продукция, продукты питания и корма для животных."
 KEN_50s_rift_valley_aquifers: "Водоносные горизонты Рифтовой долины"
 KEN_50s_rift_valley_aquifers_desc: "Долина Рифт, населенная преимущественно белым населением, и ее горные окрестности делают эту местность идеальной для эксплуатации водоносных горизонтов с целью повышения эффективности сельского хозяйства."
 KEN_50s_expand_central_plumbing_infrastructure: "Расширить центральную водопроводную инфраструктуру"
 KEN_50s_expand_central_plumbing_infrastructure_desc: "Поскольку эксплуатация Рифтовой долины идет полным ходом, теперь мы можем направить плоды этой деятельности в столицу"
 KEN_50s_mombasa_roadworks: "Дорожные работы в Момбасе"
 KEN_50s_mombasa_roadworks_desc: "Поскольку Момбаса является нашим единственным выходом на побережье Восточной Африки и за ее пределы, крайне важно, чтобы инфраструктура была улучшена до достаточного уровня."
 KEN_50s_nairobi_roadworks: "Дорожные работы в Найроби"
 KEN_50s_nairobi_roadworks_desc: "Конечно, теперь, когда путь к побережью свободен, нет смысла останавливаться. Набрав темп, мы сможем основательно модернизировать дорожную сеть по всему протекторату"
 KEN_50s_encourage_settlement_to_white_highlands: "Поощрять переселение на Белое нагорье"
 KEN_50s_encourage_settlement_to_white_highlands_desc: "Белое нагорье - это территория центральной Кении, зарезервированная для поселения белых европейцев. Мы должны расширить эту территорию для улучшения положения нашей нации"
 KEN_50s_lease_veterans_property: "Аренда недвижимости для ветеранов"
 KEN_50s_lease_veterans_property_desc: "Огромная территория, которую мы зарезервировали для расширения европейского и белого населения, должна быть немедленно обработана."
 KEN_50s_british_and_south_africa_immigration: "Британская и южноафриканская иммиграция"
 KEN_50s_british_and_south_africa_immigration_desc: "Наше прекрасное высокогорье стало объектом внимания как британских, так и южноафриканских мигрантов. Таким благом не стоит пренебрегать"
 KEN_50s_expand_the_999_year_lease: "Расширить 999-летнюю аренду"
 KEN_50s_expand_the_999_year_lease_desc: "Аренда на 999 лет - это то, что Кенийский протекторат предлагал ветеранам в течение последнего десятилетия, он обещает ветеранам и их детям землю в белом нагорье в аренду на 999 лет. Мы должны распространить это предложение на более узкий круг лиц, которым оно предлагается в настоящее время"
 KEN_50s_white_highland_rule: "Правило Белого нагорья"
 KEN_50s_white_highland_rule_desc: "Правление Кенийским протекторатом должно осуществляться с белого нагорья, белым меньшинством, как это происходит в Родезии и Южной Африке."
 KEN_50s_rise_of_the_united_country_party: "Возникновение партии \"Новая Кения\""
 KEN_50s_rise_of_the_united_country_party_desc: "Майкл Бланделл основал Партию объединенной страны, а теперь Новую кенийскую партию, которая приведет к более консервативной программе в наших интересах"
 KEN_50s_infiltrate_student_groups: "Проникновение в студенческие группы"
 KEN_50s_infiltrate_student_groups_desc: "Каким бы удивительно простым ни казался удар дубинкой по голове, возможно, более тонкий подход принесет больше дивидендов"
 KEN_50s_british_propoganda: "Британская пропаганда"
 KEN_50s_british_propoganda_desc: "Для стабилизации нашей страны необходимо вести пропагандистскую кампанию, спонсируемую Великобританией"
 KEN_50s_disinformation_campaign: "Кампания по дезинформации"
 KEN_50s_disinformation_campaign_desc: "Становится очевидным, что силой невозможно изменить образ мышления этих проблемных студентов. Но с помощью дезинформации и хитрости мы можем одержать победу"
 KEN_50s_nairobi_student_riots: "Студенческие беспорядки в Найроби"
 KEN_50s_nairobi_student_riots_desc: "Похоже, что, несмотря на наши усилия быть доброжелательными проводниками и правителями, молодежь этой страны, похоже, полна решимости подорвать нашу доброту."
 KEN_50s_ban_the_kenyan_african_union: "Запретить Кенийский Африканский Союз"
 KEN_50s_ban_the_kenyan_african_union_desc: "Мы должны запретить политическую партию Кенийский Африканский Союз из-за ее мятежной природы. По своей сути она противоречит нашим интересам"
 KEN_50s_ban_the_young_kikuyu_association: "Запретить Ассоциацию молодых кикуйю"
 KEN_50s_ban_the_young_kikuyu_association_desc: "Ассоциация молодых кикуйю является неконформистской и выступает против того, что необходимо нашему обществу для функционирования"
 KEN_50s_jomo_kenyattas_speech: "Речь Джомо Кеньятты"
 KEN_50s_jomo_kenyattas_speech_desc: "Недавно на Африканском конгрессе наиболее заметная фигура в движении за независимость и автономию Кении Джомо Кеньятта произнес речь, пользовавшуюся огромной популярностью. Осуждая \"Мау-Мау\", он заявил, что борьба за независимость, особенно в Восточной Африке, должна стать целью каждого африканца."
 KEN_50s_the_arrest_of_jomo_kenyatta: "Арест Джомо Кеньятты"
 KEN_50s_the_arrest_of_jomo_kenyatta_desc: "С арестом этого невероятно разрушительного влияния, возможно, теперь в страну вернутся порядок и стабильность. Верно?"
 KEN_50s_KAU_underground: "Подполье Кенийского Африканского Союза (КАС)"
 KEN_50s_KAU_underground_desc: "К независимости Кении нужно стремиться даже под преследованием, мы будем продолжать деятельность запрещенного Кенийского Африканского Союза подпольно"
 KEN_50s_elect_tom_mboya_as_mayor_of_nairobi: "Избрать Тома Мбойю мэром Найроби"
 KEN_50s_elect_tom_mboya_as_mayor_of_nairobi_desc: "Том Мбойя; наряду с самим Кеньяттой, Мбойя - действительно человек, на которого мы можем положиться, чтобы вести нас к независимости. Его обаяние, ум и лидерские качества, несомненно, объединят всех, кто предан нашему делу"
 KEN_50s_jaramogi_odingas_criticism: "Критика Джарамоджи Одингаса"
 KEN_50s_jaramogi_odingas_criticism_desc: "Джарамоги Одингас, выдающийся писатель-панафриканист, написал серию памфлетов, обличающих несправедливое тюремное заключение совершенно невиновного Джомо Кеньятты."
 KEN_50s_advocate_freedom_for_kenyatta: "Выступать за свободу Кеньятты"
 KEN_50s_advocate_freedom_for_kenyatta_desc: "Раздутые обвинения в заключении Джомо Кеньятты возмутительны! Требования о его свободе должны быть усилены и ускорены. Так или иначе, Кеньятта будет освобожден, и он поведет нас в будущее"
 KEN_50s_international_controversy: "Международная полемика"
 KEN_50s_international_controversy_desc: "Международная полемика по поводу ареста Джомо Кеньятты вызывает возмущение у самых видных деятелей. Джулиус Найрер, Кваме Нкрума и Неру публично выступили против его ареста и тюремного заключения."
 KEN_50s_advance_independence_movements: "Движение за независимость"
 KEN_50s_advance_independence_movements_desc: "Несмотря на отсутствие нашего дорогого лидера, мы не можем остановиться. По всей стране растет поддержка нашего дела, и скоро британские колонизаторы уже не смогут отказать нам в заслуженной независимости."
 KEN_50s_the_trial_of_jomo_kenyatta: "\"Суд над Джомо Кеньяттой\""
 KEN_50s_the_trial_of_jomo_kenyatta_desc: "Роман \"Суд над Джомо Кеньяттой\" привел к повсеместному сомнению в правильности ареста и тюремного заключения Джомо Кеньятты даже на Западе."
 KEN_50s_african_representation: "Африканское представительство"
 KEN_50s_african_representation_desc: "Равные права для всех. Это довольно чуждая концепция для британцев, но не для нас. Мы не успокоимся, пока к каждому мужчине и женщине не будут относиться с уважением и считать их людьми, а не подданными чужой короны"
 KEN_50s_reestablishment_of_KAU: "Восстановление КАС"
 KEN_50s_reestablishment_of_KAU_desc: "Необходимо предпринять усилия по восстановлению Кенийского Африканского Союза. Британцы, возможно, отбросили нас назад, но с помощью всех наших сил КАС вернется сильнее, чем когда-либо!"
 KEN_50s_british_sympathy: "Британская симпатия"
 KEN_50s_british_sympathy_desc: "По иронии судьбы, британцы, ежедневно узнающие об ужасном обращении с Джомо Кеньяттой, одновременно сочувствуют нашему делу и ставят в неловкое положение свое правительство."
 KEN_50s_the_road_to_independence: "Путь к независимости"
 KEN_50s_the_road_to_independence_desc: "Через кровь, пот и слезы наша цель - независимость Кении - становится все ближе. Осталось недолго, братья и сестры, скоро мы станем свободной нацией свободных мужчин и женщин!"
 KEN_50s_enforce_martial_law: "Ввести военное положение"
 KEN_50s_enforce_martial_law_desc: "Как бы нам ни было больно, туземцы, похоже, упорно не хотят признавать наше право на власть. Так что, похоже, нам придется занять более жесткую позицию по отношению к населению"
 KEN_50s_manipulate_tribal_leaders: "Манипулировать вождями племен"
 KEN_50s_manipulate_tribal_leaders_desc: "Белое меньшинство слишком малочисленно, чтобы контролировать всю страну, но, к счастью, есть достаточно племенных вождей, которые, кажется, открыты для наших \"советов\" и даже готовы следовать нашим рекомендациям."
 KEN_50s_institute_apartheid: "Институт апартеида"
 KEN_50s_institute_apartheid_desc: "Несмотря на то, что это довольно неприятная мера, если мы хотим остаться здесь к следующему десятилетию, мы тоже должны последовать примеру Южной Африки"
 KEN_50s_create_a_bicameral_legislature: "Создать двухпалатный законодательный орган"
 KEN_50s_create_a_bicameral_legislature_desc: "С переходом от колониального правительства к федеральному должна быть изменена и сама система управления, чтобы соответствовать цивилизованному обществу"
 KEN_50s_empower_the_executive_branch: "Расширить возможности исполнительной власти"
 KEN_50s_empower_the_executive_branch_desc: "Очевидно, что единственный способ, с помощью которого мы можем надеяться укрепить нашу власть над страной, - это централизация правительственных полномочий в рамках исполнительной власти"
 KEN_50s_abolish_legislative_council: "Упразднить Законодательный совет"
 KEN_50s_abolish_legislative_council_desc: "Принятие туземцами нашего правления сделало до боли очевидным, что им нельзя доверять принятие взвешенных решений. Поэтому по нашему собственному желанию Законодательный совет будет упразднен"
 KEN_50s_empower_white_businesses: "Расширение возможностей белых предприятий"
 KEN_50s_empower_white_businesses_desc: "Поскольку наш авторитет становится все более очевидным среди коренных жителей, сейчас самое время показать им, какое экономическое процветание может принести немного капитализма"
 KEN_50s_expand_white_highland_restrictions: "Расширить ограничения Белого нагорья"
 KEN_50s_expand_white_highland_restrictions_desc: "Поскольку белое население растет и укрепляется, необходимо также сделать территорию, на которой оно проживает, более эксклюзивной только для белых"
 KEN_50s_rename_nairobi_coldbrook: "Переименовать Найроби в Колдбрук"
 KEN_50s_rename_nairobi_coldbrook_desc: "Действительно, во время основания нашего протектората исконное название Найроби прижилось. Но с приходом к власти ОГП родное название Найроби не подходит для британского города, давайте переименуем его в английский эквивалент - Колдбрук"
 KEN_50s_united_country_party_victory: "Победа Партии объединенных стран"
 KEN_50s_united_country_party_victory_desc: "Наконец, с победой Объединенной сельской партии Майкла Бланделла мы можем надеяться, что начнем укреплять наши позиции в Кении. Власть белого меньшинства останется"
 KEN_50s_the_rogue_colony: "Колония-изгой"
 KEN_50s_the_rogue_colony_desc: "Несмотря на то, что Британия демонстрировала лишь непоколебимую преданность короне и стране, она отвергла нас. Этим последним актом было решено, что мы должны прокладывать свой собственный путь в мире."
 KEN_50s_loyalty_to_the_crown: "Верность короне"
 KEN_50s_loyalty_to_the_crown_desc: "То, что мы отвернемся от родины, - довольно неприятная перспектива. Отныне и навсегда мы являемся верными подданными Ее Величества Королевы Елизаветы II"
 KEN_50s_rise_of_kenyan_industry: "Подъем кенийской промышленности"
 KEN_50s_rise_of_kenyan_industry_desc: "Как ни странно, Кения, по сравнению с такими странами, как Канада и Австралия, остается крайне неиндустриализированной. Ее население совершенно не знакомо с городским трудом. Это необходимо немедленно исправить!"
 KEN_50s_public_construction_works: "Общественные строительные работы"
 KEN_50s_public_construction_works_desc: "Центральная плановая комиссия является ключом к направлению всех усилий по индустриализации страны. Как только крупные города Найроби и Момбаса получат достаточное развитие, мы сможем сосредоточиться на сельских районах"
 KEN_50s_begin_mining_in_kerio_valley: "Начать добычу полезных ископаемых в долине Керио"
 KEN_50s_begin_mining_in_kerio_valley_desc: "Благодаря сообщениям старателей, нам стало известно о богатом месторождении полезных ископаемых под долиной Керио, расположенной в западных районах Кении."
 KEN_50s_begin_mining_the_highlands: "Начать добычу в высокогорье"
 KEN_50s_begin_mining_the_highlands_desc: "Нагорье уже является одним из самых богатых районов протектората, но более чем вероятно, что там еще спрятаны полезные материалы, которые только и ждут, чтобы их раскопали."
 KEN_50s_create_mombasa_sugar_factory: "Построить сахарный завод в Момбасе"
 KEN_50s_create_mombasa_sugar_factory_desc: "Комиссия приняла решение о создании завода по переработке сахара в центре Момбасы в качестве первого надежного шага на пути к индустриализации."
 KEN_50s_magadi_soda_co: "Компания Magadi Soda Co."
 KEN_50s_magadi_soda_co_desc: "Комиссия, а также местные предприниматели обратили внимание на то, что озеро Магади богато троном - ключевым соединением для производства газированных напитков. Удобные инвестиции в Magadi Soda Company представляются выгодными"
 KEN_50s_nairobi_security_exchange: "Найробийская биржа ценных бумаг"
 KEN_50s_nairobi_security_exchange_desc: "Для поощрения иностранных спекуляций мы создадим Найробийскую биржу ценных бумаг"
 KEN_50s_the_bunyala_road_factory: "Фабрика на дороге Буньяла"
 KEN_50s_the_bunyala_road_factory_desc: "Главная улица Найроби Буньяла Роуд станет местом расположения огромной промышленной фабрики"
 KEN_50s_the_rise_of_kenyan_entrepeneurship: "Подъем кенийского предпринимательства"
 KEN_50s_the_rise_of_kenyan_entrepeneurship_desc: "Кажется, что в воздухе витает запах денег, поскольку многие местные жители взяли на себя труд продвигать свои собственные идеи и надеяться разбогатеть на них"
 KEN_50s_cooper_motors_limited: "Купер Моторс Лимитед"
 KEN_50s_cooper_motors_limited_desc: "Несмотря на то, что компания Cooper Motors существует уже довольно давно, она еще ни разу не поднималась с земли. При некоторой дополнительной поддержке они могут стать благом для нашей отрасли"
 KEN_50s_founding_of_kenyan_power_and_lighting_co: "Основание компании Kenyan Power and Lighting Co."
 KEN_50s_founding_of_kenyan_power_and_lighting_co_desc: "Несмотря на то, что компания была основана несколькими годами ранее, в 1922 году, под названием \"Восточно-Африканская энергетическая и светотехническая компания\" (EAP&L), в последние годы такой широкий термин стал преувеличением. Чтобы отличаться от всех остальных, EAP&L должна быть преобразована в Kenya Power and Lighting Company!"
 KEN_50s_build_a_plant_in_mombasa: "Построить завод в Момбасе"
 KEN_50s_build_a_plant_in_mombasa_desc: "Электрификация, хотя и не является чем-то новым, часто представляет собой некую проблему для внедрения по всей стране. Тем не менее, нужно с чего-то начинать, и береговая линия - самое подходящее место"
 KEN_50s_build_a_plant_in_nairobi: "Построить завод в Найроби"
 KEN_50s_build_a_plant_in_nairobi_desc: "Электрификация такого крупного города, как Найроби, конечно, будет нелегким делом, но, приложив немного усилий и времени, Найроби может стать маяком для будущей модернизации."
 KEN_50s_assassination_of_cheif_waruhiu: "Убийство вождя Варухиу"
 KEN_50s_assassination_of_cheif_waruhiu_desc: "Убийство пробританского вождя Варухиу привело к периоду неопределенности и нестабильности в Кении. Когда на нас опустилась такая тьма, кто знает, когда наступит утро"
 KEN_50s_declare_a_state_of_emergency: "Объявить чрезвычайное положение"
 KEN_50s_declare_a_state_of_emergency_desc: "Поскольку известие об убийстве вождя Варухиу потрясло самые основы протектората, губернатор Эвелин Баринг сочла необходимым объявить чрезвычайное положение до восстановления порядка."
 KEN_50s_expand_king_african_rifles: "Расширить королевские африканские стрелки"
 KEN_50s_expand_king_african_rifles_desc: "Текущая ситуация в сочетании с нехваткой белых диктует необходимость расширить ряды королевских африканских стрелков для помощи в подавлении."
 KEN_50s_weapon_sharing_with_britain: "Совместное использование оружия с Британией"
 KEN_50s_weapon_sharing_with_britain_desc: "Великобритания - ведущая держава в современном мире. Такие связи принесут нам реальную пользу в плане технологического превосходства над кучкой людей, вооруженных деревянным оружием."
 KEN_50s_modernize_artillery: "Модернизировать артиллерию"
 KEN_50s_modernize_artillery_desc: "Учитывая, что у нас нет средств для развития собственной артиллерии, мы должны обратиться к Британии за помощью в этой области."
 KEN_50s_enlist_highlander_special_forces: "Зачислить в спецназ горцев"
 KEN_50s_enlist_highlander_special_forces_desc: "Мы должны призвать шотландский спецназ, чтобы полностью уничтожить любую форму сопротивления"
 KEN_50s_expand_air_operations: "Расширить воздушные операции"
 KEN_50s_expand_air_operations_desc: "Будучи коронной колонией Материнской страны, мы имеем значительное преимущество перед этими повстанцами. У нас есть самолеты. Пусть мау-мау содрогнутся от ужаса, когда мы потрясем их архаичный мир громом реактивной эры!"
 KEN_50s_nairobi_airbases: "Авиабазы Найроби"
 KEN_50s_nairobi_airbases_desc: "С помощью Великобритании мы должны работать над тем, чтобы обеспечить их присутствие путем строительства крупномасштабных аэродромов."
 KEN_50s_lincoln_bombing_campaigns: "Бомбардировочные кампании Линкольна"
 KEN_50s_lincoln_bombing_campaigns_desc: "С одобрения губернаторов и с помощью самолетов, предоставленных материнской страной, мы начнем эффективную кампанию бомбардировок Линкольна"
 KEN_50s_british_anti_insurgency: "Британская антиповстанческая кампания"
 KEN_50s_british_anti_insurgency_desc: "Британцы сделают все возможное, чтобы вести эффективную и результативную антиповстанческую кампанию"
 KEN_50s_villagization: "Виллагизация"
 KEN_50s_villagization_desc: "Если мы хотим иметь надежду подавить это восстание, то мы должны централизовать кикуйю, чтобы более тщательно следить за ними"
 KEN_50s_british_military_intervention: "Британское военное вмешательство"
 KEN_50s_british_military_intervention_desc: "К сожалению, повстанческое движение достигло такого уровня, что мы не в состоянии подавить его своими силами. В результате военное вмешательство британцев на данный момент совершенно необходимо, будем надеяться, что с их помощью мы сможем положить конец этому восстанию."
 KEN_50s_detention_programs: "Программы содержания под стражей"
 KEN_50s_detention_programs_desc: "Изолируя элементы кикуйю в различных центрах интернирования, мы сможем начать отсев наиболее непокорных сторонников Мау-Мау"
 KEN_50s_operation_anvil: "Операция \"Наковальня\""
 KEN_50s_operation_anvil_desc: "Операция \"Наковальня\" - это военная операция по эффективному проникновению во все аспекты повстанческого движения Мау-Мау, начиная с вербовки врагов и убийства лидеров Мау-Мау по принципу \"снизу вверх"