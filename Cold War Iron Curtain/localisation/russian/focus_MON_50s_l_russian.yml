 MON_Accension_of_Yumjaagiin_Tsedenbal:0 "Вступление в должность Юмджаагийн Цеденбала"
 MON_Accension_of_Yumjaagiin_Tsedenbal_desc:0 "Юмджаагийн Цеденбал занимался политикой с 1939 года, сначала в качестве заместителя министра, а затем министра финансов с 1939 по 1940 год. Кроме того, в это время он занимал пост управляющего Банком Монголии. В 1940 г. на X съезде Монгольской народно-революционной партии в возрасте 23 лет он стал генеральным секретарем партии. А сейчас, после смерти Чойбалсана, он также является председателем Совета министров".
