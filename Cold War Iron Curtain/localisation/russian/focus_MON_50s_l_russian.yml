l_russian:

  MON_The_Stalin_of_Mongolia:0 "Сталин Монголии"
MON_The_Stalin_of_Mongolia_desc:0 "Чойбалсан по праву заслужил прозвище "Сталин Монголии". В конце 1930-х гг. Чойбалсан руководил чистками по советскому образцу, в результате которых погибло около 35 тыс. монголов. В основном это были буддийские священнослужители, интеллигенция, политические диссиденты, этнические буряты и казахи и другие "враги революции". Хотя преданность Чойбалсана Сталину помогла сохранить зарождающуюся независимость страны в первые годы его правления, она также тесно связала Монголию с Советским Союзом".
