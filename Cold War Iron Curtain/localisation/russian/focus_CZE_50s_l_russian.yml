l_english:
 Purge_Gottwald.1.d: "\n\nПрезидент Чехословакии, старший член Коммунистической партии Клемент Готвальд был подвержен чистке главой партии Рудольфом Сланским. Хотя эти двое были близкими соратниками, следуя институту коммунистического правления в стране, оба как говорят, пытались консолидировать власть над другими. Кроме того, из Москвы усиливается давление на партию с целью очищения от предателей и националистов, которые подрывают ее деятельность. Сланскому удалось задействовать свои рычаги первым, на недавнем заседании ЦК он обвинил Готвальда в поощрении национализма, затягивании шагов по осуществлению национализации и симпатиях к врагам революции. Готвальд не смог защититься и был задержан полицией. В обращении к нации Рудольф Сланский объявил, что спас страну от предателя и что он возьмет на себя роль президента."
 Czechoslovakia_Purge.1.d: "\n\nВ ответ на вдохновенную попытку [CZE.GetRulingParty] подражать Иосифу Сталину в очищении от нелояльных элементов в начале его правления в Советском Союзе, [CZE.GetLeader] привлек нескольких членов правительства к суду за то, что они симпатизируют [YUG.GetLeader], в первую очередь его второму по старшинству и близкому другу Рудольфу Сланскому. Сланский был приговорен к смертной казни за свои преступления, подкрепленные петицией, подписанной людьми [CZE.GetNameDef] о его казни за предполагаемые предательские действия."
 Czechoslovakia.1.d: "В Пльзене, промышленном центре Чехословакии, заводские рабочие, уже расстроенные инфляцией и ростом стоимости потребительских товаров, поняли, что новые валютные реформы правительства значительно сократили их доходы. Это вызвало массовые беспорядки, которые вскоре охватили город и привели к восстанию. Протестующие напали на здания Партии, мэрии и попытались освободить заключенных, чтобы они присоединились к ним. Однако протестующие были дезорганизованы, и правительство направило тысячи полицейских и военнослужащих для подавления восстания. Восстание продолжалось три дня и вызвало мирные протесты по всей стране в поддержку трудящихся. После того, как восстание закончилось, правительство объявило о своем намерении очистить слабовольных коммунистов и социал-демократов от своих рядов и смягчить некоторые экономические причины. Говорят, что Москву беспокоит неспособность чехословацкого правительства быстро взять под контроль восстание, и многие в Чехословакии задаются вопросом, сможет ли правительство по-настоящему объединить народ страны со своими коммунистическими реформами."
 Czechoslovakia_Purge.3.d: "Недавно в Чехословакии была завершена серия показательных судебных процессов, направленных против некоммунистических политических активистов, националистов, католиков и коммунистических диссидентов. По мере того, как Коммунистическая партия Чехословакии (КПЧ) консолидирует власть, ей необходимо утвердить свое господство над страной, незнакомой с правлением одной партии. Обвиняемым предъявлены обвинения в сговоре с целью свержения правительства, связях с иностранными спецслужбами, сотрудничестве с нацистами во время войны, а также коррупция среди прочих обвинений. Те, кто связан с людьми или группами, воспринимаемыми как антипартийные, также попадают в \"черный список\", затрудняющий возможность трудоустройства и получения образования. Говорят, что Советский Союз поощряет эти испытания и похвалил руководство КПЧ за его активные действия по устранению угроз народу Чехословакии."
 toufar.1.d: "11 декабря 1949 года, в третье воскресенье в Адвенте, прихожане в деревне Цихост сообщили о чуде - полуметровый железный крест в местной церкви сдвинулся сам. Хотя священник Йозеф Туфар заявил, что не видел этого предполагаемого чуда, это должно быть уловка с его стороны! Мы можем оставить это, или использовать это событие, чтобы еще больше дискредитировать Католическую Церковь, убеждая священника исповедаться!"
 toufar.2.d: "Священник Йозеф Туфар оставался живучим благодаря нашим продвинутым методам допроса, хотя он заметно ослаблен. Мы можем продолжить допрос, но есть шанс, что он не выживет."
 toufar.3.d: "Священник Йозеф Туфар умер в результате наших передовых методов допроса! Мы не смогли извлечь какую-либо информацию от вероломного священника."
 toufar.4.d: "Священник Йозеф Туфар был устойчив в нашем процессе уговоров. Однако Туфар в конце концов сдался, признав свою хитрость. Хотя для его проведения потребовались недели тщательного допроса, он признал, что установил небольшое механическое устройство, которое простиралось от кафедры до большого железного креста, чтобы заставить крест двигаться, чтобы обмануть прихожан. Мы привели его в церковь, чтобы снять его хитрость, но он слишком слаб после нескольких недель нашего допроса. Мы заменили его другим священником для некоторых снимков."
 toufar.5.d: "Священник Йозеф Туфар скончался от травм и недоедания, полученных во время нашего длительного допроса. Его длительное пребывание в больнице в государственной больнице в Праге закончилось рано утром, когда его тело вывезли под вымышленным именем. К счастью, мы больше не нуждаемся в нем."
 CZE_The_Sovietization_of_Czechoslovakia: "Советизация Чехословакии"
 CZE_The_Sovietization_of_Czechoslovakia_desc: "Благодаря нашим товарищам в Москве мы смогли освободиться от слабого прежнего правительства и установить социализм. Без помощи наших друзей из Советского Союза это было бы невозможно. Мы докажем им свою вечную благодарность, полностью посвятив себя социализму, такому же, как в Советском Союзе!"
 CZE_General_Secretary_Gottwald: "Генеральный секретарь Готвальд"
 CZE_General_Secretary_Gottwald_desc: "Наш дорогой генеральный секретарь Клемент Готвальд был видной фигурой еще до того, как возглавил Чехословацкую Республику. Во время Второй мировой войны он бежал в Москву и объединил усилия с правительством в изгнании, чтобы координировать партизанское движение, что впоследствии помогло укрепить коммунистическое влияние в послевоенной Чехословакии. После войны и своего рода переворота Готвальд, при поддержке СССР, взял власть в свои руки. Что ждет страну под его руководством? Это покажет время."
 CZE_The_Twentieth_Congress_of_the_CPSU: "ХХ съезд КПСС"
 CZE_The_Czechoslovak_Peoples_Army: "Чехословацкая Народная Армия"
 CZE_The_Twentieth_Congress_of_the_CPSU_desc: "20-й съезд Коммунистической партии Советского Союза в разгаре! Это первый съезд после внезапной смерти Готвальда. Вскоре будет решено, кто станет его преемником."
 CZE_The_Czechoslovak_Peoples_Army_desc: "Чехословацкая народная армия сформирована из ветеранов-партизан и солдат, сражавшихся в изгнании во время Второй мировой войны. Они являются опорой наших вооруженных сил и преданы делу распространения социализма!"
 CZE_Embrace_Socialist_Realism: "Принять Соцреализм"
 CZE_Embrace_Socialist_Realism_desc: "Социалистический реализм сосредоточен на идее строительства социализма и бесклассового общества. Изображая эту борьбу, писатель мог признавать недостатки, но при этом должен был сохранять позитивный и оптимистичный взгляд на социалистическое общество, учитывая его важное историческое значение. Будучи неотъемлемой частью социалистического движения, мы приняли решение полностью поддержать социалистический реализм и создать свою собственную версию!"
 CZE_Stalinist_Architecture: "Сталинская архитектура"
 CZE_Stalinist_Architecture_desc: "Сталинская архитектура — это смелые эксперименты и грандиозные проекты, реализованные по поручению товарища Сталина по всему Советскому Союзу. Она тесно связана с социалистическим реализмом, что дает нам еще больше причин внедрять этот стиль по всей стране!"
 CZE_Rapid_Destalinization: "Быстрая Десталинизация"
 CZE_Rapid_Destalinization_desc: "Теперь, когда марионетка Сталина, Готвальд, осталась в прошлом, мы можем начать избавляться от памятников и произведений искусства, посвященных этому тирану."
 CZE_Rappoachment_with_Tito: "Сближение с Тито"
 CZE_Rappoachment_with_Tito_desc: "В рамках десталинизации нашей страны было решено ослабить зависимость от Москвы и восстановить дипломатические отношения с Югославией Тито."
 CZE_End_the_Personality_Cult: "Прекратить культ личности"
 CZE_End_the_Personality_Cult_desc: "При правлении Готвальда было принято считать Сталина героем, спасшим нашу страну и принесшим ей освобождение. Да, Советский Союз сыграл свою роль в установлении социализма в Чехословакии, но это не оправдывает ужасных преступлений, которые он совершил. Именно поэтому культ личности с сегодняшнего дня упразднен."
 CZE_Secular_Values: "Светские ценности"
 CZE_Secular_Values_desc: "Христианство, как и любая другая религия, лишь сеет раздор среди нас. Именно поэтому мы начнем активно поддерживать внедрение светских ценностей. Без религии мы станем на шаг ближе к истинному равенству!"
 CZE_Expand_the_Czech_Pioneers: "Расширение чешских пионеров"
 CZE_Expand_the_Czech_Pioneers_desc: "Пионерская организация Союза социалистической молодежи — наш аналог советского комсомола. Ее цель — воспитывать новое поколение в духе социализма, а также организовывать летние пионерские лагеря, где дети смогут не только отдыхать, но и приобретать полезные навыки для будущей жизни через разнообразные мероприятия!"
 CZE_Expand_Ties_to_Israel: "Расширить связи с Израилем"
 CZE_Expand_Ties_to_Israel_desc: "Чехословакия с момента своего основания поддерживала тесную дружбу с Израилем. Наш первый президент еще в 1920 году стал первым государственным деятелем, посетившим еврейский кибуц в Палестине. Теперь, когда власть больше не находится в руках сталинских лакеев, мы продолжим эту политику дружбы."
 CZE_Increase_Worker_Control_of_Industry: "Усилить рабочий контроль над промышленностью"
 CZE_Increase_Worker_Control_of_Industry_desc: "Как мы можем называться социалистами, если не учитываем интересы рабочего и лишаем его контроля? Именно поэтому мы создадим рабочие советы, которые будут следить за различными отраслями промышленности, учитывать предложения и запросы трудящихся, чтобы фабрики и заводы работали бесперебойно."
 CZE_Reduce_Agricultural_Collectivization: "Уменьшить сельскохозяйственную коллективизацию"
 CZE_Reduce_Agricultural_Collectivization_desc: "Политика коллективизации никогда не приносила пользы никому, кроме государства, несмотря на то, что утверждал Готвальд. Изъятие земли у мелких фермеров для создания огромных коллективных хозяйств было просто неэффективным. Именно поэтому мы снизим масштабы коллективизации и будем экспериментировать с различными подходами к этой проблеме."
 CZE_Begin_Trading_with_the_West: "Начать торговать с Западом"
 CZE_Begin_Trading_with_the_West_desc: "Даже если мы будем считать Запад нашим врагом, мы не можем ограничиваться торговлей только с социалистическими странами для получения некоторых сырьевых материалов, необходимых для функционирования нашей промышленности. Именно поэтому мы наладим торговлю с Западом, чтобы получить эти жизненно важные ресурсы."
 CZE_Expand_Israeli_Arms_Sales: "Расширение израильских продаж оружия"
 CZE_Expand_Israeli_Arms_Sales_desc: "Мне было рекомендовано моим адвокатом и Советом ООН воздержаться от комментариев по этому вопросу."
 CZE_Enforce_The_Ninth_of_May_Constitution: "Принять Конституцию девятого мая"
 CZE_Enforce_The_Ninth_of_May_Constitution_desc: "Конституция 9 мая — это тот документ, который помог нам добиться того, что мы имеем сегодня. Благодаря ей мы смогли свергнуть слабое и коррумпированное прежнее правительство, чтобы защитить демократический порядок народа. И теперь мы пришли к выводу, что настало время более широко внедрить ее положения в правительстве, а также начать применять статьи, касающиеся национализации и прав человека."
 CZE_Increase_Censorship: "Увеличить цензуру"
 CZE_Increase_Censorship_desc: "Пока мы продолжаем реформировать нашу страну в истинно социалистическое общество, враги революции используют свободную прессу, чтобы распространять ложь и фальшивые новости о нас. Они пытаются настроить народ против нас и выставить нас злодеями. Мы не допустим этого. Цензура будет усилена, а публикации взяты под строгий контроль, чтобы народ не поддавался на провокации предателей революции!"
 CZE_Close_Religous_Organizations: "Закрыть религиозные организации"
 CZE_Close_Religous_Organizations_desc: "Мы понимаем, что людям нужно во что-то верить, особенно в трудные времена. Однако религия приносит больше разобщённости и хаоса, чем пользы для нашего общества. Именно поэтому мы начнем постепенное избавление страны от религии, начиная с закрытия религиозных организаций."
 CZE_Silence_Toufar: "Молчание Туфар"
 CZE_Silence_Toufar_desc: "Местный священник в небольшом городке Чихошт утверждает, что произошло чудо. Посетители церкви рассказали сотрудникам Государственной Безопасности, что крест в храме начал двигаться сам по себе. Очевидно, это лишь уловка, чтобы привлечь больше прихожан. Мы не будем бездействовать — священник будет арестован и допрошен, пока не признается в обмане."
 CZE_Promote_Socialist_Values: "Продвигать социалистические ценности"
 CZE_Promote_Socialist_Values_desc: "Почти каждый знаком с религиозными ценностями, но далеко не все знают о великих социалистических идеалах, которые несёт в себе социализм. Именно поэтому мы будем активно финансировать их популяризацию, чтобы каждый гражданин осознал их истинную значимость!"
 CZE_Crackdown_on_Religion: "Репрессии в отношении религии"
 CZE_Crackdown_on_Religion_desc: "Раз за разом история доказывала, что религия лишь разделяет людей и заставляет их сражаться друг с другом из-за разницы в верованиях. Именно поэтому мы будем решительно бороться с религиозным влиянием. Рабочие не нуждаются в высшей силе, чтобы понимать, как им следует жить и заботиться о своей общине. Социализм уже даёт им эту основу – и, как видим, Готвальду не требуется превращать воду в вино, чтобы руководить народом."
 CZE_Restrict_Property_Rights: "Ограничить права собственности"
 CZE_Restrict_Property_Rights_desc: "Мы уже начали коллективизацию сельскохозяйственной собственности. Теперь настало время обратить внимание и на другую собственность. В наших руках она будет использована гораздо эффективнее, чем это могли делать прежние владельцы."
 CZE_Begin_The_First_Five_Year_Plan: "Начать первую пятилетку"
 CZE_Begin_The_First_Five_Year_Plan_desc: "По примеру великого Советского Союза мы приступаем к реализации нашего первого пятилетнего плана – решительного шага к строительству социалистической экономики! Мы национализируем ключевые отрасли и банки, избавляя народ от гнёта капиталистов! А тех, кто наживается на труде простых людей – алчных кулаков и коррупционеров – ждёт неминуемое разоблачение и справедливое возмездие!"
 CZE_Begin_Agricultural_Collectivization: "Начать коллективизацию сельского хозяйства"
 CZE_Begin_Agricultural_Collectivization_desc: "Следующий шаг в социализации нашей экономики — мы начинаем коллективизацию сельскохозяйственного сектора, как это уже сделано в Советском Союзе!"
 CZE_Establish_the_JRD: "Учредить ОКВ"
 CZE_Establish_the_JRD_desc: "Для того чтобы контролировать теперь коллективизированные земли, мы создадим Единые сельскохозяйственные кооперативы (ЕСХК). ЕСХК — это наша версия восточногерманского СХПК (Сельскохозяйственные производственные кооперативы), который будет управлять коллективизированными фермами страны."
 CZE_Nationalize_Industry: "Национализация промышленности"
 CZE_Nationalize_Industry_desc: "Как и в любой социалистической стране, мы возьмём средства производства под контроль, национализировав всю частную промышленность. Это позволит нам обеспечить непосредственный надзор и гарантировать, что наши рабочие не будут эксплуатироваться ради прибыли."
 CZE_Nationalize_Banks: "Национализировать банки"
 CZE_Nationalize_Banks_desc: "После того как мы разобрались с промышленностью, настало время заняться банковской сферой — сердцем капиталистической коррупции и жадности. Этому больше нет места в нашем процветающем социалистическом обществе. Банки больше не будут служить интересам капитала, а станут инструментом для блага рабочих и только рабочих."
 CZE_Crush_the_Kulaks: "Раздавить кулаков"
 CZE_Crush_the_Kulaks_desc: "Как и в Советском Союзе, у нас есть свои алчные кулаки, разбогатевшие на чужих страданиях и эксплуатации. И, как советские товарищи, мы быстро с ними разберёмся."
 CZE_Organize_the_IX_Rally_of_the_KSC: "Организовать IX собрание КПЧ"
 CZE_Organize_the_IX_Rally_of_the_KSC_desc: "Пришло время провести 9-й съезд Коммунистической партии Чехословакии — первый, на котором мы фактически управляем страной. На этом съезде мы представим планы на ближайшее будущее, сосредоточившись главным образом на укреплении наших позиций и ликвидации последних врагов Революции."
 CZE_Begin_the_Show_Trials: "Начать показательные испытания"
 CZE_Begin_the_Show_Trials_desc: "We will hold a series of show trials to get rid of Class enemies and nationalists, as well as former Nazi Collaborators.This will help us to get rid of enemies to the State and further secure our rule in the nation."
 CZE_Purge_International_Communists: "Чистка коммунистов-интернационалистов"
 CZE_Purge_International_Communists_desc: "Хотя мы и ценим рвение некоторых наших товарищей, которые стремятся распространить социалистическую революцию за пределы наших границ, это не соответствует линии партии, установленной товарищем Готтвалдом. Поэтому, к сожалению, нам придётся от них избавиться."
 CZE_Liquidate_the_Opposing_Political_Parties: "Ликвидация оппозиционных политических партий"
 CZE_Liquidate_the_Opposing_Political_Parties_desc: "Хотя мы хотим, чтобы все были товарищами и относились друг к другу только с уважением, то же самое нельзя сказать об оппозиции. Состоящей из представителей бывшего правительства и врагов Революции, мы не можем позволить им остановить нас в реализации наших социалистических законов и политики. Поэтому они будут устранены, и мы объявляем о создании однопартийного государства."
 CZE_Reform_the_Criminal_Code: "Реформировать Уголовный кодекс"
 CZE_Reform_the_Criminal_Code_desc: "Уголовный кодекс устарел, не говоря уже о том, что он совсем не подходит для нашего социалистического дела. Поэтому мы уверены, что никто не будет возражать, если мы проведем его реформу и добавим несколько новых положений..."
 CZE_Crackdown_on_Rootless_Cosmopolitans: "Расправа с безродными космополитами"
 CZE_Crackdown_on_Rootless_Cosmopolitans_desc: "Космополиты — последняя угроза, с которой нам предстоит разобраться. После этого большинство врагов Революции будет устранено, а оставшиеся окажутся слишком слабы, чтобы противостоять нашей власти. Теперь мы сможем полностью сосредоточиться на построении социалистического общества."
 CZE_Establish_the_Presidium: "Создать Президиум"
 CZE_Establish_the_Presidium_desc: "Как и в Советском Союзе, нам необходимо создать так называемый Президиум. Этот исполнительный комитет будет заниматься управлением делами государства и возьмет на себя руководство страной в случае, если Генеральный секретарь не сможет продолжать исполнять свои обязанности."
 CZE_Purge_Gottwald: "Чистка Готвальда"
 CZE_Purge_Gottwald_desc: "Готтвальд явно не подходит для роли Генерального секретаря. Всё больше голосов внутри нашей партии выступают против его политики и репрессий против так называемых \"классовых и политических врагов\". Нам необходимо избавиться от Готтвальда и поставить на его место человека, который будет более реформаторски настроен и не будет подчиняться московским указаниям."
 CZE_Rehabilitate_Veterans_of_the_Spanish_Civil_War: "Реабилитировать ветеранов гражданской войны в Испании"
 CZE_Rehabilitate_Veterans_of_the_Spanish_Civil_War_desc: "Во время Гражданской войны в Испании многие социалистические движения отправили Интернациональные бригады на помощь Испанской республике в борьбе с фашистами, поддерживаемыми странами Оси. Как бы мы ни сражались, нам, к сожалению, не удалось остановить фашистов, но мы всё же получили ценный опыт из этой тяжёлой битвы. Многие ветераны рассказывают о славных боях с фашистами. И всё же эти герои революции были изгнаны и объявлены предателями. Мы реабилитируем ветеранов и вернём им заслуженное почёт и уважение!"
 CZE_Expand_Light_Industry: "Расширение легкой промышленности"
 CZE_Expand_Light_Industry_desc: "Light Industry is the heart of any nation, be it Socialist or not. It is the beating heart that produces goods for everyday Comrades, from toasters to Televisions. Light Industry is always in demand and that's why we will fund the Expansion of it in our nation."
 CZE_Emphasize_Infrastructure_Construction: "Акцент на строительство инфраструктуры"
 CZE_Emphasize_Infrastructure_Construction_desc: "Инфраструктура – жизненно важный элемент современного государства. Без дорог, железнодорожных путей и линий электропередачи невозможно быстро перевозить товары и поддерживать связь на больших расстояниях. А отсутствие водоснабжения усложнит жизнь как в городах, так и на сельскохозяйственных угодьях. Очевидно, что регулярное обновление и расширение инфраструктуры — залог того, что наша страна будет работать как хорошо настроенный механизм."
 CZE_Improve_Living_Conditions: "Улучшить условия жизни"
 CZE_Improve_Living_Conditions_desc: "Условия жизни в нашей стране далеки от идеальных, поскольку до сих пор регулируются законами и политиками прежней администрации. Благополучие наших рабочих имеет для нас первостепенное значение, поэтому, чтобы обеспечить им достойную жизнь и дальнейшее процветание, мы расширим финансирование системы социального обеспечения."
 CZE_The_Slansky_Trials: "Сланский процесс"
 CZE_The_Slansky_Trials_desc: "Проходят процессы над Сланским. Четырнадцать партийных чиновников, включая первого секретаря Рудольфа Сланского, обвиняются в государственной измене и предстанут перед судом, чтобы понести наказание за свои преступления против Революции."
 CZE_Crush_the_Pilsen_Uprising: "Раздавите Пльзеньское восстание"
 CZE_Crush_the_Pilsen_Uprising_desc: "Ужасные новости! В Пльзене произошло восстание, в ходе которого классовые враги попытались свергнуть наше правительство, и, вероятно, финансировались Западом! К счастью, несмотря на некоторые трудности, полиция и армия сумели справиться с восстанием и арестовать зачинщиков."
 CZE_Collectivize_Heavy_Industry: "Коллективизировать тяжелую промышленность"
 CZE_Collectivize_Heavy_Industry_desc: "Пришло время коллективизировать последнюю отрасль промышленности, которая до сих пор была в стороне от этого процесса. Тяжелая оборонная промышленность, производящая все оружие для наших социалистических вооруженных сил, будет интегрирована в сектор национализированной промышленности."
 CZE_Novotny_Consolidates_Power: "Новотный консолидирует власть"
 CZE_Novotny_Consolidates_Power_desc: "Александр Новотный, один из самых доверенных членов партии и выбранный преемник Готтвальда. Подобно Готвальду, он является сторонником сталинизма. Победив в борьбе с противниками, чехословаки могут быть уверены, что наследие Готтвальда теперь в надежных руках."
 CZE_Encourage_Urbanization: "Поощрять урбанизацию"
 CZE_Encourage_Urbanization_desc: "Слишком многие наши люди до сих пор живут в тесных квартирах, потому что города растут недостаточно быстро, чтобы вместить все семьи. Это недопустимо. Мы перераспределим средства из бюджета, чтобы стимулировать урбанизацию, позволяя социалистическим городам развиваться, а семьям — иметь своё собственное жильё!"
 CZE_The_Czechoslovakian_Air_Force: "Чехословацкие ВВС"
 CZE_The_Czechoslovakian_Air_Force_desc: "Со времен Второй мировой войны наши ВВС стали настоящей гордостью нашей страны. Пока другие нации называют себя хозяевами морей, наши самолёты господствовали в небе, участвуя в многочисленных сражениях в изгнании и помогая защищать Британские острова от немецких истребителей и бомбардировщиков."
 CZE_Expand_the_Air_Defense_Network: "Расширить сеть ПВО"
 CZE_Expand_the_Air_Defense_Network_desc: "Даже если немецкие и союзные бомбардировщики больше не летают над нашими головами, угроза Третьей мировой войны всё ещё остается. Поэтому очень важно, чтобы на этот раз мы были готовы. Расширяя сеть противовоздушной обороны, мы, вероятно, спасём множество жизней в будущем."
 CZE_Purge_KSC_Membership: "Чистка членов КПЧ"
 CZE_Purge_KSC_Membership_desc: "Процесс Сланского показал, сколько предателей ещё скрывается среди нас. Самым шокирующим оказалось то, что все они находятся внутри самой партии. Такое положение дел недопустимо. Чтобы обезопасить Генерального секретаря от возможных попыток переворота, все члены КПЧ подвергнуты проверке. Те, кто вызовет подозрения, будут исключены из партии и лишены членства."
 CZE_General_Secretary_Novotny: "Генеральный секретарь Новотный"
 CZE_General_Secretary_Novotny_desc: "Новотный — один из немногих, кому Готтвальд действительно доверяет, и он не раз называл его своим преемником. Однако в последнее время здоровье Готтвальда заметно ухудшается. Возможно, настал момент попросить его уйти в отставку и позволить Новотному взять управление в свои руки."
 CZE_Expand_the_Prison_Labor_Camps: "Расширить тюремные трудовые лагеря"
 CZE_Expand_the_Prison_Labor_Camps_desc: "The Soviet GULAG Labor camps have been on the list of Novotny for a long time, finding them wonderful to deal with Opposition and Criminals that have been found guilty. Even if found Guilty, Novotny believes in redemption. Instead of being executed, these Prisoners will simply do hard Labour to redeem themselves."
 CZE_Increase_Workers_Quotas: "Увеличение рабочих квот"
 CZE_Increase_Workers_Quotas_desc: "Мы знаем, что наши рабочие трудятся усердно, но, похоже, многие по-прежнему предпочитают лениться и работать медленно, болтая вместо того, чтобы выполнять свои обязанности, тем самым замедляя весь производственный процесс. Чтобы мотивировать их выкладываться на полную и работать во имя Революции, следует увеличить нормы выработки."
 CZE_Limit_Higher_Education_to_KSC_Members: "Ограничить высшее образование только членами КПЧ"
 CZE_Limit_Higher_Education_to_KSC_Members_desc: "Разумеется, мы хотим, чтобы наши дети получали наилучшее образование, но мы также должны убедиться, что те, кому мы предоставляем это высшее образование, не являются детьми коррумпированных и антиреволюционных родителей. Поэтому право на высшее образование будет предоставлено только детям членов КПЧ."
 CZE_The_Armory_of_the_Communist_World: "Оружейная палата коммунистического мира"
 CZE_The_Armory_of_the_Communist_World_desc: "Революция всегда находится под угрозой со стороны коррумпированных западных держав, готовых вторгнуться, уничтожить рабочих и навязать нашему обществу оккупационные и капиталистические идеи. Мы должны быть всегда готовы защищать наши социалистические ценности. Однако без надлежащего вооружения это невозможно. Единственным логичным решением является расширение производства оружия во имя социализма!"
 CZE_Import_Lavochkin_La_9s: "Импорт Ла-9"
 CZE_Import_Lavochkin_La_9s_desc: "Как бы мы ни гордились нашими ВВС, фактом остается то, что большинство наших доступных самолетов были произведены до или во время Второй мировой войны. К счастью, наши советские товарищи более чем готовы протянуть нам руку помощи и предоставить часть своих самолетов для модернизации наших воздушных сил!"
 CZE_Purchase_MiG_15s: "Покупка МиГ-15"
 CZE_Purchase_MiG_15s_desc: "Даже с советскими самолетами нам все равно нужно больше техники для модернизации наших ВВС. К счастью, остальные страны Восточного блока согласны продать нам свои самолёты!"
 CZE_Embrace_Soviet_Air_Doctrine: "Принять советскую воздушную доктрину"
 CZE_Suppress_Liberal_Tendencies: "Подавление либеральных тенденций"
 CZE_Suppress_Liberal_Tendencies_desc: "Как бы мы ни старались, кажется, что независимо от наших усилий всегда существует контрреволюционное подполье, которое пытается распространять западную пропаганду в нашей стране и убедить людей в их лжи. Мы не можем позволить нашим товарищам поддаваться ложным обещаниям и будем жестко бороться с этими либеральными антиреволюционными настроениями!"
 CZE_Increase_Tarrifs: "Увеличить тарифы"
 CZE_Increase_Tarrifs_desc: "Наши товары — это продукция высочайшего качества, созданная на долгие годы службы и безупречной работы. Но при этом они продаются за гроши. Наши законы об импорте и экспорте просто устарели. Единственным разумным решением, которое мы видим, является повышение таможенных пошлин на нашу продукцию."
 CZE_Czechoslovakian_Ground_Forces: "Чехословацкие сухопутные войска"
 CZE_Czechoslovakian_Ground_Forces_desc: "Чехословацкая народная армия, как её принято называть, состоит из ветеранов-коммунистов, которые сотрудничали как с Советами, так и с бывшим правительством в изгнании во время Второй мировой войны. Это наиболее важная часть наших вооруженных сил, защищающая Революцию внутри страны своим сердцем и душой."
 CZE_Domestic_Mechanized_Production: "Отечественное механизированное производство"
 CZE_Domestic_Mechanized_Production_desc: "Многое изменилось с тех пор, как началась война: солдаты постепенно заменяются машинами и танками как основными боевыми силами. Конечно, мы начнем адаптироваться к этому, запустив собственное отечественное производство механизированных транспортных средств, а также финансируя исследования для их модернизации."
 CZE_Soviet_T55_Tanks: "Т-55"
 CZE_Soviet_T55_Tanks_desc: "Для начала модернизации наших вооружённых сил мы закупим танки Т-55 у всего Восточного блока. Посмотрим, как Запад войдёт в Прагу, если перед ними будет армия советских танков с орудиями, нацеленными на них!"
 CZE_Copy_Soviet_Designs: "Копировать советские образцы"
 CZE_Copy_Soviet_Designs_desc: "Некоторые утверждают, что немецкая инженерия — лучшая в мире. Хотя в некоторых случаях это и может быть правдой, мы предпочитаем использовать советские разработки, которые доказали свою надежность. К сожалению, мы не можем напрямую попросить советских товарищей поделиться чертежами, поэтому мы просто скопируем советское оборудование, которое уже было нам поставлено."
 CZE_Weapon_Production_Investment: "Инвестиции в производство оружия"
 CZE_Weapon_Production_Investment_desc: "Of course we can research and reform our design and buy equipment. But we can't keep just buying equipment from our allies. No instead we take that money and invest into the Production of our Own Weapons!"
 CZE_The_National_Security_Corps: "Корпус Национальной Безопасности"
 CZE_The_National_Security_Corps_desc: "Служба государственной безопасности (СГБ) была создана 17 апреля 1945 года для замены традиционной полиции и жандармерии. СГБ сыграла ключевую роль в операции, которая помогла нам свергнуть старое правительство, благодаря тому, что мы контролировали его с момента основания, постепенно заполняя его сторонниками коммунизма. В день захвата власти, благодаря этим усилиям, СГБ обеспечила лёгкое свержение правительства."
 CZE_Soviet_Advisors: "Советские советники"
 CZE_Soviet_Advisors_desc: "Чтобы повысить опытность Службы государственной безопасности, мы решили пригласить советских консультантов и экспертов, чтобы они помогли улучшить наши силы СГБ и адаптировать их к современным методам работы."
 CZE_Finalize_the_Purge_of_Non_Communist_Officers: "Завершить чистку некоммунистических офицеров"
 CZE_Finalize_the_Purge_of_Non_Communist_Officers_desc: "Даже в СГБ все еще остаются офицеры и сотрудники, назначенные прежним правительством. Те, кто способен адаптироваться к социализму, могут остаться, но остальные будут отправлены в отставку и отстранены."
 CZE_Empower_the_StB: "Расширение возможностей СГБ"
 CZE_Empower_the_StB_desc: "Служба тайной Безопасности (СтБ) — это наш аналог советского НКВД. Это тайная полиция, занимающаяся выявлением потенциальных угроз и защитой революции от любых посягательств. Приглашённые нами советские советники рекомендовали, что усиление СтБ и увеличение его финансирования значительно улучшат работу СГБ в целом. Спорить с этим не приходится — они ведь эксперты!"
 CZE_Border_Fortifications: "Пограничные укрепления"
 CZE_Border_Fortifications_desc: "Пограничные укрепления всегда играли важную роль в истории нашей страны. Единственное отличие в том, что по ту сторону границы больше нет безумцев, готовых на геноцид и вторжение с их танками. Вместо них — капиталистические корпорации, стремящиеся нажиться на труде наших рабочих. Даже если нам кажется, что бояться нечего, лучше всё же укрепить границы на случай, если Запад все же решит что-то предпринять."
 CZE_Establish_The_University_of_Pardubice: "Создать Университет Пардубице"
 CZE_Establish_The_University_of_Pardubice_desc: "После Второй мировой войны химические заводы города выступили с инициативой создания поблизости специализированного университета. В 1950 году было основано учебное заведение под названием Vysoká škola chemická (Химический институт), а в 1954 году оно получило новое название — Vysoká škola chemicko-technologická (Институт химических технологий)."
 CZE_Rapid_Industrialization: "Быстрая индустриализация"
 CZE_Rapid_Industrialization_desc: "Чем больше мы развиваем нашу промышленность, тем более индустриализированной становится наша страна. Но этого попросту недостаточно. С такой медлительностью процесс может занять годы или даже десятилетия. Поэтому мы будем продвигать политику ускоренной индустриализации, не останавливаясь, пока вся страна не загремит от мощи нашей промышленности!"
 CZE_Metallurgy_Investments: "Инвестиции в металлургию"
 CZE_Metallurgy_Investments_desc: "Наша страна богата месторождениями полезных ископаемых, но мы не можем в полной мере использовать эти подземные сокровища, так как у нас недостаточно металлургических предприятий. В рамках нашей индустриализации и укрепления промышленной мощи мы построим два новых завода по переработке металлов!"
 CZE_Expand_Weapon_Production: "Расширение производства оружия"
 CZE_Expand_Weapon_Production_desc: "Как говорится, оружия много не бывает. Поэтому мы продолжим строить заводы и выпускать ещё больше оружия!"
 CZE_Expand_the_Mining_Industry: "Расширение горной промышленности"
 CZE_Expand_the_Mining_Industry_desc: "Недавние исследования выявили, что по всей стране расположены огромные месторождения полезных ископаемых. Мы фактически нашли золотую жилу, и все, что нам нужно сделать, — это расширить горнодобывающую промышленность и начать добычу этих скрытых сокровищ земли!"
 CZE_COMECON_Aid: "Помощь ВЭС"
 CZE_COMECON_Aid_desc: "Отказавшись от Плана Маршалла, мы теперь получили помощь от СЭВ (Совет экономической взаимопомощи) и Советского Союза, чтобы восстановить разрушенную промышленность после Второй мировой войны."
 CZE_Uranium_Mining: "Добыча урана"
 CZE_Uranium_Mining_desc: "Уже в довоенной Чехословакии было обнаружено, что наша страна обладает огромными запасами урана, скрытыми под землёй. Теперь, когда мы понимаем, что это можно использовать для создания оружия массового уничтожения или ядерных реакторов, мы с радостью начнём его добычу!"
 CZE_Monetary_Reform: "Денежная реформа"
 CZE_Monetary_Reform_desc: "Наша страна уже долгое время страдает от высокой инфляции, с тех пор как закончилась война. И поскольку прежнее правительство не решало эту проблему, будучи слишком занятым внутренними разборками, теперь это ложится на нас. К счастью, с нами у власти и при отсутствии реальной оппозиции, мы сможем легко провести денежную реформу, которая должна решить проблему инфляции в течение нескольких недель!"
 CZE_Establish_State_Control_Over_Education: "Установить государственный контроль над образованием"
 CZE_Establish_State_Control_Over_Education_desc: "Дети — наше будущее, это довольно очевидно. Но как мы можем обеспечить социалистическое будущее для них, если их недостаточно учат социализму и социалистическим ценностям в школах? Конечно же, установив государственный контроль над этими школами!"
 CZE_Completion_of_the_First_Five_Year_Plan: "Завершение первой пятилетки"
 CZE_Completion_of_the_First_Five_Year_Plan_desc: "Наконец-то нам удалось завершить наш первый пятилетний план! Наша промышленность и экономика уже растут до новых высот, и это не остановится в ближайшее время! Однажды мы может даже обгоним Запад!"
 CZE_Empower_Workers_Councils: "Советы уполномоченных работников"
 CZE_Empower_Workers_Councils_desc: "Один важны аспект, который Готтвальд упустил, — это ограниченные возможности государства в контроле за всем происходящим. Создание рабочих советов, которые помогут учитывать желания и требования трудящихся, позволит облегчить работу бюрократического аппарата и сосредоточиться на других важных вопросах."
 CZE_Reduce_Quotas: "Уменьшить квоты"
 CZE_Reduce_Quotas_desc: "Система обязательных квот, которые необходимо выполнять ежедневно или ежемесячно, попросту неэффективна. Она изматывает рабочих, вынуждая их трудиться на пределе своих возможностей, что негативно сказывается на их здоровье. Мы отменим эти нормы, предоставив трудящимся заслуженный отдых."
 CZE_Reduce_Soviet_Dependence: "Уменьшить советскую зависимость"
 CZE_Reduce_Soviet_Dependence_desc: "Теперь, когда Готтвальд и его сталинистские соратники ушли, мы можем начать избавляться от зависимости от Советского Союза. Как бы мы ни были благодарны за их помощь в приходе к власти,  направление, в котором они движутся, отличается от нашего. Поэтому мы начнём постепенно сокращать влияние СССР, пока не станем полностью независимыми."
 CZE_Increase_Foriegn_Trade: "Увеличение внешней торговли"
 CZE_Increase_Foriegn_Trade_desc: "Запад, несмотря на то, что в значительной степени является нашим врагом, всё же представляет собой огромный рынок, который ждёт, когда мы присоединимся и начнём продавать свои товары. Даже если это не понравится Советам, мы наладим связи с западными рынками, не только продавая, но и закупая материалы на Западе."
 CZE_Industrialize_Slovakia: "Индустриализировать Словакию"
 CZE_Industrialize_Slovakia_desc: "As our name states, we are CzechoSLOVAKIA. Sometimes we forget or ignore this fact, leaving the Slovak part of our country without much Industry. But as a Socialist society, we are all brothers and sisters in the end. So it's only fair we Industrialize the Slovaks as well as we did our part of the country."
 CZE_Prevent_Student_Protests: "Предотвратить студенческие протесты"
 CZE_Prevent_Student_Protests_desc: "Прискорбно, что студенты, которые должны быть интеллектуалами нашего общества и показывать молодежи, как они должны ценить построенный нами социализм, вместо этого решают протестовать и бороться против нашего правления. Однако это не означает, что они не могут измениться. Мы просто должны научить их ценить социализм и прекратить их протесты. Не потому, что мы хотим их подавить, а потому что им были навязаны ложные идеи Запада, и мы обязаны показать им правду!"
 CZE_Denounce_the_Hungarian_Revolution: "Осудить венгерскую революцию"
 CZE_Denounce_the_Hungarian_Revolution_desc: "Печально слышать новости о Венгерской революции — о том, как они пытались разрушить то, что было построено рабочими, лишь для того, чтобы принять неортодоксальную радикальную модель социализма, используемую в Югославии. А после провала своей неудачной попытки они бежали в Югославию. Мы осудим и саму революцию, и Югославию за предоставление убежища предателям!"
 CZE_Stabilize_the_Collectives: "Стабилизировать коллективы"
 CZE_Stabilize_the_Collectives_desc: "A long time problem with our Collectives is that they are unorganized and lack the knowledge to correctly function. To finally fix the issue and get them running again, we will fund them complete Reorganization of the Collectives!"
 CZE_Neo_Stalinism: "Неосталинизм"
 CZE_Neo_Stalinism_desc: "The Soviets can try all they want that the Policies of our Great Comrade Stalin were paranoid and cruel. The Man of Steel gave helped us liberate ourselves from the former Goverment and helped us Implement Socialism in our country. While the rest of the Eastern Block continues to get rid of Stalinism, we will stick by it and even improving it!"
 CZE_Begin_Drafting_a_New_Constitution: "Начать разработку новой Конституции"
 CZE_Begin_Drafting_a_New_Constitution_desc: "The Ninth of May Constitution has worked well for us, but we forget that it isn't perfect as it wasn't written by Socialist and has some flawed Policies. We will rewrite it to now include Socialism in it's core and to improve the before mentioned flawed Policies."
 CZE_The_Czechoslovakian_Path_to_Socialism: "Чехословацкий путь к социализму"
 CZE_The_Czechoslovakian_Path_to_Socialism_desc: "It was a hard fight but finally we have corrected many of Gottwald's mistakes and brought true Prosperity to our nation while still keeping true to Socialist Values. They might be Unorthodox but they are the Czechoslovakian Path to Socialism!"
 CZE_The_Second_Five_Year_Plan: "Вторая пятилетка"
 CZE_The_Second_Five_Year_Plan_desc: "With the First Five Year Plan being as succesful as it was, it is about time we resume by starting the Second Five Year Plan that focuses on Expanding mining Operations and further Industrialize Slovakia!"
 CZE_Agricultural_Mechanization: "Механизация сельского хозяйства"
 CZE_Agricultural_Mechanization_desc: "Many farmers in our nation still use outdated farming methods, sometimes even horses and plows. That simply isn't gonna cut it anymore. We are in the 20th century for Lenin's sake! Give these farmers some proper equipment!"
 CZE_Expand_Construction_Metal_Production: "Расширение производства строительных металлов"
 CZE_Expand_Construction_Metal_Production_desc: "We have made some progress when we have in the past Invested into Metal processing. But that simply isn't enough. With us still having plenty of Metal and not enough foundries to process it in, we will simply have to construct even more Foundries!"
 CZE_Petrochemical_Investments: "Нефтехимические инвестиции"
 CZE_Petrochemical_Investments_desc: "The chemical Industry is one of the core parts of our nation. Not only does it bring a lot of jobs for our Workers but it also enables us to create our own Artifical Oil, making it easier for us not to be dependent on Western Oil."
 CZE_Invest_in_Civil_Engineering: "Инвестиции в гражданское строительство"
 CZE_Invest_in_Civil_Engineering_desc: "Civil Engineers are not only in Socialism, but all around the World the true Heroes that bring our society forward by ensuring that if something is built, it will be stable enough to be lived or worked in and how it can be best mentained. It's never not bad to have more than enough Civil Engineers. So why not invest into getting more?"
 CZE_Expand_Slovakian_Steel_Production: "Расширение производства словацкой стали"
 CZE_Expand_Slovakian_Steel_Production_desc: "Of course we cannot ignore the Slovak Portion of our Steel Production. Just like we have multiple times expanded our own Steel Sector, we will also expand the Slovak sector to balance out the Production and ensure that the Slovaks don't have to travel all the way to the Czech part to process their metal."
 CZE_Complete_the_Second_Five_Year_Plan: "Завершение второй пятилетки"
 CZE_Complete_the_Second_Five_Year_Plan_desc: "Finally we have completed our Second Five Year Plan, once again showing huge increase in our Economy. Our GDP and our monthly budget keeps growing and the Workers have more than enough Work place! This couldn't have gone better and has even resulted in an Economic Growth for the nation!"
 CZE_General_Secretary_Gustav_Husak: "Генеральный секретарь Густав Гусак"
 CZE_General_Secretary_Gustav_Husak_desc: "Gustav Husak, the only General Secretary that is of Slovak Origin, has managed to get into power. Being viewed by many as the middle ground between Hardliners and Reformists, it is the safest option for the nation. Even if has plans that the Hardliners do not like, for example getting rid of the Cult of Personality and Liberaliting the Regime, it is not as excessive as the Reformers and Anti-Stalinists would have likely gone."
 CZE_Liberalize_the_Regime: "Либерализация режима"
 CZE_Liberalize_the_Regime_desc: "The Regime has for too long used Stalin Era Policies that are downright inhumane and only give us a bad Image in the eyes of the World. To starting fixing this mistake, we will begin by somewhat Liberalizing our Nation and Goverment."
 CZE_End_the_Personality_Cult2: "Прекратить культ личности"
 CZE_End_the_Personality_Cult2_desc: "The Cult of Personality that was formed around Stalin, has to be removed. As thankful we are to the Soviets for helping us free ourselves from the Fascists and have helped us establish Socialism in our Nation, that does not mean we can just forgive all the horrible things Stalin has commited out of Paranoia."
 CZE_Enact_Economic_Reforms: "Провести экономические реформы"
 CZE_Enact_Economic_Reforms_desc: "The Economic model that we have been using until now, simply isn't efficient as much as we'd like it to be. Though that does not mean that we have to scrap the thing all together. With a few Reforms and corrections, the Socialist economic Model could work to it's full potential."
 CZE_Embrace_COMECON_Planning: "Принять планирование ВЭС"
 CZE_Embrace_COMECON_Planning_desc: "The COMECON, a Socialist version of the Marshall Plan has been helping us expand our Industry and our Economy to help it recover from the horrors and Destruction of the Secon World War. We shall continue to humbly accept it's benefits and continue to watch as our Economy gets better and better."
 CZE_Moderate_Censorship: "Умеренная цензура"
 CZE_Moderate_Censorship_desc: "Censorship has been a hot theme in the Party. Some say it should be abolished completely while others say that it should be enforced as hard as possible. In our Oppinion, it should be kept but it could be loosened somewhat. The many enemies that it was created to silence have been rooted out already, so why not relax the rules a bit and let people speak a bit more freely again?"
 CZE_Increase_Consumer_Goods_Production: "Увеличить производство потребительских товаров"
 CZE_Increase_Consumer_Goods_Production_desc: "The economy that we have established isn't only there to make profits but it is there to mainly feed and sustain our hard working comrades. This is usally done through Consumer goods that we produce in factories. But lately it seems that we have been lacking behind on our Consumer Good Production. That's a easily fixable problem though. All it needs is some extra funding."
 CZE_Reform_the_Communes: "Реформировать коммуны"
 CZE_Reform_the_Communes_desc: "The Communes are one of the few things that Gottwald done probably the best. They generally work well and manage to control the Agricultural sector without much trouble. But there are also ocasionally some hickups. That's why we are here though. We will look closely lok at the areas the Communes ar having trouble and reform these areas so they don't struggle anymore."
 CZE_Increase_Urban_Housing: "Увеличить городское жилье"
 CZE_Increase_Urban_Housing_desc: "Housing is a human need that has to be taken care of. Housing is needed to be able to return to a warm place after a long day. Or to start your own family. That's why we are going to start a huge effort to increase Housing all over the nation, to make sure every Worker has a home to return to after a long day of working for the Revolution!"
