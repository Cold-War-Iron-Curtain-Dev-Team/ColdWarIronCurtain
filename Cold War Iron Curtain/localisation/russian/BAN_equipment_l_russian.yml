 BAN_motorized_equipment_1: "Dodge T-234 \"Бирма\" грузовик 4x4"
 BAN_motorized_equipment_1_short: "Форд F15 КВО 4x4"
 BAN_motorized_equipment_1_desc: "Грузовики Канадского Военного Образца (КВО) - это взаимно согласованные линейки военных грузовиков, выпущенные в большом количестве, в нескольких классах и многочисленных модификациях, канадскими филиалами американских автопроизводителей \"большой тройки\" во время Второй мировой войны, в соответствии со спецификациями британской армии, предназначенные в основном для использования в армиях союзников Британского Содружества, но также служившие в других частях Британской империи."
