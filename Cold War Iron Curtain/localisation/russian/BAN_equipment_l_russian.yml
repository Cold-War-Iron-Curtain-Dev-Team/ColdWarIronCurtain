 BAN_mr_stealth_fighter_equipment_1: "Микоян МиГ-29БМ"
 BAN_mr_stealth_fighter_equipment_1_short: "МиГ-29БМ"
 BAN_mr_stealth_fighter_equipment_1_desc: "Самолет МиГ-29БМ/БМ2 является модификацией базового МиГ-29. Он получил более мощные многоцелевые возможности за счет более широкого применения высокоточного оружия класса \"воздух-воздух\" и \"воздух-земля\". Он также отличался значительно увеличенной дальностью полета за счет увеличения внутреннего запаса топлива. В ходе разработки самолета было внесено несколько изменений. Переработанный планер был изготовлен из легкого алюминиево-литиевого сплава для увеличения тяговооруженности. Геометрия рампы воздухозаборника была изменена, верхние жалюзи воздухозаборника были удалены, чтобы освободить место для большего количества топлива в LERX, были введены сетчатые экраны для предотвращения повреждения посторонними предметами (ППП), а размеры впускных отверстий были увеличены для увеличения потока воздуха."
 BAN_jet_light_equipment_2: "Fouga CM.170R Magister"
 BAN_jet_light_equipment_2_short: "CM.170R Magister"
 BAN_jet_light_equipment_2_desc: "Fouga CM.170 Magister - французский двухместный реактивный учебно-тренировочный самолет 1950-х годов, разработанный и произведенный французской авиастроительной компанией Fouga. Из-за слияния компаний, самолет был по-разному известен как Fouga CM.170 Magister, Potez (Fouga) CM.170 Magister, Sud Aviation (Fouga) CM.170 Magister и Aérospatiale (Fouga) CM.170 Magister, в зависимости от того, где и когда они были построены."
 BAN_jet_light_equipment_3: "Цессна T-37B Tweet"
 BAN_jet_light_equipment_3_short: "T-37B Tweet"
 BAN_jet_light_equipment_4: "Шэньян FT-7P"
 BAN_jet_light_equipment_4_short: "FT-7P"
 BAN_jet_light_equipment_4_desc: "Экспортная версия JJ-7 с заменой китайского языка на английский для всех дисплеев. Первым заказчиком был Иран, заказ был размещен в конце 1986 года. Некоторое количество было поставлено в Пакистан с увеличенной на 0,61 метра длиной фюзеляжа и увеличенной на 350 литров внутренней топливной емкостью."
 BAN_jet_light_equipment_5: "Hongdu JL-8"
 BAN_jet_light_equipment_5_short: "JL-8"
 BAN_jet_light_equipment_5_desc: "Hongdu JL-8 (Наньчан JL-8), также известный как Karakorum-8 или K-8 для краткости, является двухместным промежуточным реактивным учебно-тренировочным и легким штурмовиком, разработанным в Китайской Народной Республике компанией China Nanchang Aircraft Manufacturing Corporation. Пакистан также является со-партнером этого проекта. Основным подрядчиком является корпорация Hongdu Aviation Industry Corporation. Его экспортный вариант, K-8 Karakorum, совместно производится Пакистанским авиационным комплексом для ВВС Пакистана."
