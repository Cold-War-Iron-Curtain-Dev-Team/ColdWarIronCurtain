l_english:
 BAN_infantry_equipment_0: "Винтовка Ли-Энфилд с коротким магазином, Но.4 Mk I"
 BAN_infantry_equipment_0_short: "ЛЭКМ Но. 4"
 BAN_infantry_equipment_0_desc: "Ли-Энфилд - винтовка с продольно-скользящим затвором и магазинным питанием, служившая основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. С 1895 по 1957 год она была стандартной винтовкой британской армии. Винтовка активно использовалась на протяжении всей Второй мировой войны, особенно на североафриканском, итальянском, тихоокеанском и бирманском театрах военных действий в руках британских войск и войск Содружества. Австралия и Индия сохранили и производили ЛЭКМ Mk III* в качестве стандартной винтовки во время конфликта, и винтовка оставалась на вооружении австралийских войск до конца Корейской войны, пока в конце 1950-х годов не была заменена на L1A1 SLR."
 BAN_infantry_equipment_1: "Штурмовая винтовка ZB-56"
 BAN_infantry_equipment_1_short: "ZB-56"
 BAN_infantry_equipment_1_desc: "ZB-56 - автоматическая штурмовая винтовка, разработанная КНР в 1956 году на основе АК-47. С момента разработки автомат принимал участие во всех войнах, в которых участвовала КНР. ZB-56 имеет ряд отличий от АК-47. Они были изготовлены с фрезерованной ствольной коробкой и полностью закрытым прицелом. Ствол также тяжелее и больше похож на ствол РПК, за исключением того, что у него отсутствует усиленная цапфа. Кроме того, ствол не имеет нарезного дула. Поскольку ZB-56 обладает легендарной надежностью и очень прост в эксплуатации, он продолжает использоваться армиями всего мира. Кроме того, его производство обходится несколько дешевле, чем АК-47."
 BAN_infantry_equipment_2: "Штурмовая винтовка ZB-56-I"
 BAN_infantry_equipment_2_short: "ZB-56-I"
 BAN_infantry_equipment_2_desc: "Копия АКС, со складывающимся стальным плечевым прикладом и убранным штыком для облегчения переноски оружия. Как и в случае с оригинальным Тип 56, в середине 1960-х годов фрезерованные ствольные коробки были заменены штампованными, что сделало Тип 56-1 эквивалентом российского АКМС."
 BAN_infantry_equipment_3: "Штурмовая винтовка ZB-81"
 BAN_infantry_equipment_3_short: "ZB-81"
 BAN_infantry_equipment_3_desc: "ZB-81 - это автоматическая штурмовая винтовка, которая может быть модифицирована в различные виды оружия, разработанная компанией Norinco в 1981 году. С момента своего появления она побывала во всех китайских конфликтах, включая китайско-вьетнамскую войну, Афганистан и Шри-Ланку. ZB-81 является усовершенствованной моделью ZB-63, но не имеет такой же эффективной дальности стрельбы. Само оружие обладает большей огневой мощью, чем ZB-63, и включает в себя различные элементы от автоматов Драгунова, СКС и АК47. Кроме того, срок службы оружия больше, чем у АК47. Кроме того, оружие поддерживает подствольное навесное оборудование."
 BAN_infantry_equipment_4: "Штурмовая винтовка BD 08"
