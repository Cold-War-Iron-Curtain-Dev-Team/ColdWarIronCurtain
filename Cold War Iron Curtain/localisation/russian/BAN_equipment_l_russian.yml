 BAN_jet_multirole_equipment_4: "Норт Американ F-86 Сейбр"
 BAN_jet_multirole_equipment_4_short: "F-86F-40 Сейбр"
 BAN_jet_multirole_equipment_4_desc: "Дальнейшее усовершенствование Сейбр F-86F с целью повышения ее боевой эффективности против новых самолетов, оснащенных форсажной камерой, путем оснащения их жесткими точками и направляющими для запуска ракет AIM-9B Сайдуайндерс."
 BAN_jet_multirole_equipment_5: "Шэньян F-6"
 BAN_jet_multirole_equipment_5_short: "F-6"
 BAN_jet_multirole_equipment_6: "Микоян-Гуревич МиГ-21МФ"
 BAN_jet_multirole_equipment_6_desc: "Серийная версия всепогодного перехватчика. Они оснащались турбореактивными двигателями Р11Ф2-300 и, начиная с седьмой партии, оснащались РЛС РП-21 (на первых шести партиях использовалась более старая РЛС ЦД-30Т (она же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую АУ РС-2УС (она же К-5МС) в дополнение к К-13 с ИК-целью."
 BAN_jet_multirole_equipment_6_short: "МиГ-21МФ"
