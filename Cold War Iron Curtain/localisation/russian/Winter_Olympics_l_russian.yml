l_english:
 winterolympics.1.d: "VI Зимние Олимпийские игры прошли в Осло, на прошлой неделе, когда 30 стран показали своих лучших спортсменов. Норвегия желала провести V Зимние Олимпийские Игры 1948 года, но из-за Второй мировой войны МОК приостановил проведение любых новых Олимпийских игр. После окончания Второй мировой войны МОК принял решение отдать V зимние Игры 1948 года в Санкт-Мориц, в Швейцарии, а вместо этого позволить Норвегии, провести VI Зимние игры 1952 года. Норвегия заняла 1-е место с 15 медалями, в то время как Соединенные Штаты заняли 2-е место с 11 медалями. Финляндия заняла 3-е место с 9 медалями. Следующие Зимние Олимпийские игры были объявлены в Кортине, Италия, в 1956 году."
 winterolympics.2.d: "VII Зимние Олимпийские игры проходили в Кортине, Италия. Спортсмены со всего мира приезжали для участия в Олимпийских играх. Первоначально Кортина была выбрана для проведения V Олимпийских зимних Игр 1944 года, но в 1941 году была отменена из-за Второй мировой войны. Затем в Санкт-Морице, Швейцария, состоялись V Зимние Олимпийские Игры 1948 года. Италия, новичок на олимпийской арене, так как они проводят олимпиаду первый раз в истории. Это было также первое многонациональное олимпийское событие, которое могли наблюдать люди от Германии до СССР. СССР занял 1-е место с 16 медалями, Австрия заняла 2-е с 11 медалями, а Финляндия 3-е место с 7 медалями. Следующая зимняя Олимпиада пройдет в Скво-Вэлли, США."
 winterolympics.3.d: "VII Олимпийские зимние Игры прибыли в Скво-Вэлли, США, как и многие другие прибыли в маленький калифорнийский городок. Более 800 миллионов долларов ушло на расширение Скво-Вэлли. США принимали у себя 3 прошлые Олимпийские игры: игры 1904 года III Олимпиады в Сент-Луисе, III зимние Олимпийские игры 1932 года в Лейк-Плэсиде и игры 1932 года X летней Олимпиады в Лос-Анджелесе. Олимпийские игры транслировались по телевидению во всем мире, и их впервые мог услышать или увидеть любой желающий. Игры XI Олимпиады 1936 года были первыми телевизионными Олимпийскими играми, но только в Германии и других частях Европы. Игры XIV Олимпиады 1948 года также транслировались по телевидению, но только в Англии и небольших частях Западной Европы. Германия также впервые будет выступать под единой командой. СССР вновь занял 1-е место с 21 медалью, сборная Германии заняла 2-е место с 8 медалями, а США 3-е место с 10 медалями. Следующие зимние игры были объявлены в Инсбруке, Австрия, в 1964 году."
 winterolympics.4.d: "IX Зимние Олимпийские игры прошли в Австрии в Инсбруке. Для подготовки спортсменов к Олимпиаде было построено много объектов. Однако снега было не так много, как ожидалось, и поэтому австрийская армия вырезала из горы 20 000 ледяных глыб. Затем они перевезли их на горы для спуска на лыжах. СССР занял 1-е место на 3-х Зимних Олимпийских играх подряд с 25 медалями. Норвегия заняла 2-е место с 15 медалями, а Австрия 3-е с 12 медалями. Следующая зимняя Олимпиада пройдет в Гренобле, Франция, в 1968 году."
 winterolympics.5.d: "На прошлой неделе в Гренобле состоялись X Олимпийские игры. Это был первый случай, когда Западная и Восточная Германия по отдельности участвовали в Олимпийских играх. Это была также первая Олимпиада, на которой для них был выбран талисман. Шусс - это талисман для этих игр. X Зимние Олимпийские игры 1968 года - это уже третья Олимпиада во Франции. Франция принимала прошедшие в 1924 году I зимние Олимпийские игры в Шамони и в 1924 году игры VIII летней Олимпиады в Париже. Норвегия вернулась в Осло с 14 медалями, опередив СССР всего на 1 медаль. СССР вернулся домой на 2-м месте с 13 медалями, а Франция заняла 3-е место с 9 медалями. Следующая зимняя Олимпиада пройдет в Саппоро, Япония, в 1972 году."
 winterolympics.6.d: "На прошлой неделе в японском городе Саппоро прошли XI зимние Олимпийские игры. Это первый раз, когда зимняя игра проводилась за пределами Европы и Северной Америки. Первоначально планировалось, что V Олимпийские зимние игры 1940 года пройдут в Саппоро, но из-за второй китайско-японской войны, вспыхнувшей в 1937 году, Зимние Олимпийские игры 1940 года должны были состояться в Санкт-Морице, Швейцария. Еще больше споров возникло вокруг этого решения, и это заставило МОК перенести его в Гармиш-Партенкирхен, Германия, но в 1939 году зимние игры 1940 года были отменены после начала Второй мировой войны. Спустя более чем 30 лет зимние Игры наконец-то вернулись в Саппоро. СССР занял 1-е место с 16 медалями, Восточная Германия заняла 2-е место с 14 медалями, а Швейцария с 10 медалями заняла 3-е место. Следующие зимние игры пройдут снова в Инсбруке, Австрия, в 1976 году."
 winterolympics.7.d: "Зимние игры вернулись в Инсбрук, Австрия, после того, как Денвер отказался от проведения XII зимних Олимпийских игр в 1972 году. Галина Кулакова из Советского Союза заняла 3-е место в женском лыжном зачете на 5 км, но была дисквалифицирована из-за приема назального спрея, содержащего запрещенное вещество эфедрин. И FIS, и МОК разрешили ей участвовать в эстафете 10 км и эстафете 4×5 км.Это была первая лишенная медали спортсменка в олимпийской истории. СССР занял 1-е место с 27 медалями, Восточная Германия 2-е с 19, а Соединенные Штаты 3-е с 10 медалями. Это был первый случай, когда у спортсмена была отобрана медаль после того, как было обнаружено, что Галина Кулакова из СССР была поймана на мошенничестве с использованием запрещенного вещества из назального спрея. Следующие зимние игры были объявлены в Лейк-Плэсиде, США, в 1980 году."
 winterolympics.8.d: "XII Олимпийские зимние игры появились в Лейк-Плэсиде, штат Нью-Йорк, во второй раз после III Олимпийских зимних игр 1932 года. Мужская сборная США по хоккею с шайбой не должна была выходить из группы, но смогла победить СССР и завоевала золотую медаль. Люди уже называют его чудом на льду. Эта победа покорила сердца американцев в период напряженности холодной войны, хотя именно победа над Финляндией обеспечила им золотую медаль. СССР занял 1-е место, заработав 22 медали, Восточная Германия 2-е с 21 медалью, а Соединенные Штаты 3-е место с 12 медалями. Следующие зимние игры пройдут в Сараево, Югославия, в 1984 году."
 winterolympics.9.d: "На прошлой неделе в Сараево, Югославия, проходили XIV Зимние Олимпийские игры. Это был первый случай проведения Зимних Олимпийских игр в социалистическом государстве. Югославы выиграли свою первую в истории медаль в большом слаломе. В нем приняли участие более 49 стран, что стало новым олимпийским рекордом. Китайская Народная Республика прекратила бойкот Олимпийских игр из-за разногласий по поводу признания МОК Китайской Республики. Китайская республика вошла в него как Китайский Тайбэй. Восточная Германия заняла 1-е место с 25 медалями, СССР заняли 2-е с 24 медалями, а США 3-е место с 8 медалями. Следующие зимние игры были объявлены в Калгари, Канада, в 1988 году."
 winterolympics.10.d: "XV Олимпийские игры проходили в Канаде, в течение последних 2 недель. Сотни спортсменов отправились в одно из самых холодных мест на Земле, где температура в один момент составляла 23 градуса по Фаренгейту (-5 градусов по Цельсию). Ямайцы также впервые участвовали в двух мужских бобслеях, но проиграли после падения в трубу. Британский прыгун на лыжах с трамплина Эдди \"Орел\" Эдвардс потерпел героический провал, поскольку он занял последнее место в каждом соревновании, в котором участвовал. СССР занял 1-е место с 29 медалями, Восточная Германия заняла 2-е место с 25 медалями, а Швейцария 3-е с 15 медалями. Следующие Зимние Олимпийские игры пройдут в Альбервиле, Франция, в 1992 году"
 winterolympics.11.d: "а прошлой неделе во французском городе Альбервиль прошли XVI Зимние Олимпийские игры. XVI Зимние Олимпийские Игры 1992 года - это уже четвертая Олимпиада во Франции. Франция принимала прошедшие в 1924 году I зимние Олимпийские игры в Шамони, в 1924 году VIII Олимпийские игры в Париже, в 1968 году X Зимние Олимпийские игры в Гренобле. Это будет последний раз, когда зимняя и летняя Олимпиады пройдут в одном и том же году. В итоге Норвегия выиграла все соревнования по лыжным гонкам. Немцы заняли 1-е место с 26 медалями, Объединенная команда завоевала 2-е место с 23 медалями, а Норвегия-3-е с 20 медалями. Следующая зимняя Олимпиада пройдет в норвежском Лиллехаммере в 1994 году."
 winterolympics.12.d: "XVII Зимние Олимпийские игры проходили в норвежском Лиллехаммере в течение последних 2 недель. Это был самый северный город, когда-либо принимавший Зимние Олимпийские игры в истории. В прошлом Норвегия принимала у себя VI Олимпийские зимние игры 1952 года. Это также первая Олимпиада, которая будет проводиться в другой год, чем летние Олимпийские игры. Норвегия получила больше всего медалей и заняла 1-е место с 26 медалями. Немцы завоевали 24 медали и заняли 2-е место, а Россия заняла 3-е место с 23 медалями. Следующие Зимние Олимпийские игры пройдут в Нагано, Япония, в 1998 году"
 winterolympics.13.d: "XVII Зимние Олимпийские игры проходили в японском Нагано в течение последних 2 недель. Это самый южный город для проведения Зимних Олимпийских игр, и его можно сравнить только с Скво-Вэлли, штат Калифорния, в 1960 году. Это уже третья Олимпиада в Японии, которая проводится после летних Олимпийских игр 1964 года в Токио и зимних Олимпийских игр 1972 года в Саппоро. Немцы заняли 1-е место с 29 медалями, Норвегия 2-е с 25 медалями, а Россия 3-е с 18 медалями. Следующие Зимние Олимпийские игры пройдут в Солт-Лейк-Сити, США, в 2002 году"
 winterolympics.14.d: "XIX Зимние Олимпийские игры прибыли в Солт-Лейк-Сити, когда спортсмены со всего мира приехали, чтобы показать свои способности. Эта зимняя олимпийская игра вызвала некоторые споры, поскольку выяснилось, что несколько членов МОК были подкуплены, чтобы привезти игры в Солт-Лейк-Сити. Соединенные Штаты принимали у себя 4 прошлых Олимпийских игры: игры 1904 года III Олимпиады в Сент-Луисе, зимние Олимпийские игры 1932 года III Олимпиады в Лейк-Плэсиде, игры 1932 года X Олимпиады в Лос-Анджелесе, игры 1984 года XXIII Олимпиады в Лос-Анджелесе и, наконец, игры 1996 года XXVI Олимпиады в Атланте. Германия заняла 1-е место, завоевав 36 медалей, а Соединенные Штаты-34 медали, заняв 2-е место. Норвегия заняла 3-е место с 25 медалями. Следующие Зимние Олимпийские игры пройдут в Турине, Италия, в 2006 году."
 winterolympics.15.d: "XX Зимние Олимпийские игры прошли во второй раз в Италии. Италия принимала прошедшие в 1956 году VII Зимние Игры в Кортине, а в 1960 году-игры XVII Олимпиады в Риме. На этих зимних Играх была низкая посещаемость и несколько случаев употребления допинга от австрийцев, россиян и бразильцев. Германия завоевала 29 медалей и заняла 1-е место, Соединенные Штаты заняли 2-е место с 25 медалями, а Австрия 3-е место с 23 медалями. Хотя австрийцы могут лишиться 1 или 2 медалей из-за обвинений в употреблении допинга. Следующие зимние игры были объявлены в Ванкувере, Канада, в 2010 году."
 winterolympics.16.d: "В канадском Ванкувере прошли XXI зимние Олимпийские игры. Это 3-я Олимпиада Канады, после Игр 1976 года XXI Олимпиаду в Монреале и XV Зимние Олимпийские игры 1988 года в Калгари. Было несколько проблем с этими зимними Играми, начиная от меньшего количества снега и заканчивая вандализацией оборудования и протестами, вызывающими проблемы. Соединенные Штаты заняли 1-е место, завоевав 37 медалей. Германия и Канада заняли 2-е и 3-е места, а Германия заработала 30, а Канада-26. Следующие зимние игры пройдут в Сочи, Россия, в 2014 году."
 winterolympics.17.d: "За последние 2 недели в Сочи, Россия, прошли XXII Зимние Олимпийские игры. Россия принимала прошедшие в 1980 году Игры XXII Олимпиады в Москве. Эти зимние игры были самыми дорогими в истории, так как в Сочи было потрачено 51 миллиард долларов. Также появились сообщения о том, что некоторые российские спортсмены были заподозрены в использовании допинга, и МОК заявил, что это повлияет на их роль в зимних Играх 2018 года. Россия заняла 1-е место с 29 медалями, Норвегия 2-е с 26 медалями, а Канада 3-е с 25 медалями. Следующая зимняя Олимпиада пройдет в Пхёнчхане, Республика Корея."
 winterolympics.18.d: "XXIII Зимние Олимпийские игры проходили в Пхенчхане, Республика Корея, в течение последних 2 недель. Это уже 2-й Олимпийский турнир в Республике Корее, так как они принимали игры XXIV Олимпиады 1988 года в Сеуле. МОК вынудил Россию не участвовать под флагом своей страны и предложил российским спортсменам участвовать под знаменем олимпийцев из России (ОАР). Норвегия заняла 1-е место с 39 медалями, Германия-2-е с 31 медалью, а Канада-3-е с 29 медалями. Было объявлено, что следующие зимние игры пройдут в Пекине, Китайская Народная Республика, в 2022 году."