l_english:
 summerolympics.1.d: "XV Олимпийские Игры прошли в Хельсинки, Финляндия. Город был выбран для проведения XII Олимпийских игр 1940 года после того, как Токио не смог их принять из-за Второй мировой войны, но даже тогда проведение игр было невозможным - Вторая Мировая набирала свои обороты, Финляндия, в свою очередь, находилась \"в осаде\" советских войск, и летние Олимпийские игры 1940 года по итогу были отменены. Хельсинки - самый северный город, принявший летние Олимпийские игры. Соединенные Штаты заняли 1-е место с 76 медалями, СССР следовал за ними с 71 медалью на 2-м месте, а Венгрия - на 3-м с 42 медалями. Вскоре было объявлено, что следующая летняя Олимпиада состоится в Мельбурне, Австралия, в 1956 году."
 summerolympics.2.d: "XVI Олимпийские Игры прошли в Мельбурне, Австралия. Австралия еще никогда не принимала у себя Олимпийские игры, и это был их первый раз. Сотни спортсменов со всего мира приехали в самый южный город мира. Египет, Ирак и Ливан протестовали и бойкотировали эту летнюю Олимпиаду в ответ на Суэцкий кризис. Нидерланды, Камбоджа, Испания и Швейцария также не появились на мероприятии, но уже из-за участия Советов, которые, совсем недавно, применили силу для подавления народа Венгрии и его революции, не понеся за это никакого наказания. Как итог, СССР занял 1-е место с 98 медалями, США - 2-е с 74 медалями, а Австралия - 3-е с 35 медалями. Было объявлено, что следующая летняя Олимпиада пройдет в Риме, Италия, в 1960 году."
 summerolympics.3.d: "XVII Олимпийские Игры прошли в Риме, Италия. Это первый раз, когда летние Олимпийские игры пришли в Рим. Изначально, они должны были пройти в этом древнем городе еще в 1908 году, но из-за извержения вулкана Везувий страна отказалась их принимать. Зато Италия смогла принять VII Зимние Олимпийские игры, прошедшие всего 4 года назад, в 1956 году. Абебе Бикила из Эфиопии стал первым чернокожим олимпийским чемпионом Африки после того, как выиграл олимпийский марафон. Американский боксер Кассиус Клей же, в свою очередь, завоевал в полутяжелой весовой категории золото для США. СССР завоевал удивительные 103 медали, причем США заняли 2-е место с 71 медалью, а Италия - 3-е с 36 медалями. Следующая летняя Олимпиада пройдет в Токио, Япония, в 1964 году."
 summerolympics.4.d: "XVIII Олимпийские Игры прошли в Токио, Япония. Первоначально Токио был выбран для проведения XII Олимпийских игр 1940 года, но из-за Второй мировой войны их перенесли в Хельсинки. Спустя 15 лет олимпийский огонь вернулся в Токио. Летние Олимпийские игры в Токио были очень успешными и популярными, поскольку миллионы людей наблюдали за ними по всему миру. Были некоторые разногласия между КНР, КНДР и Индонезией - поэтому эти 3 страны не участвовали в мероприятии. США заняли 1-е место с 90 медалями, СССР - 2-е с 96 медалями, а Япония - 3-е с 29 медалями. Было заявлено, что следующая летняя Олимпиада состоится в Мехико, Мексика, в 1968 году."
 summerolympics.5.d: "XIX Олимпийские Игры проходили в Мехико, Мексика. Это первый случай, когда Олимпийские игры были проведены в стране Латинской Америки и испаноязычной стране. Летние Олимпийские игры проводились в состоянии повышенной активности полиции, поскольку в Мексике происходили массовые протесты и беспорядки в течение последнего года. За 10 дней до начала Летних Олимпийских игр студенты собрались на площади Пласа-де-лас-Трес-Культурас в Тлателолко, чтобы призвать к более широким гражданским и демократическим правам и выразить презрение к Олимпийским играм. Правительство приказало разогнать митинг и направило на площадь 5000 солдат и 200 танков. Сотни студентов были убиты, ещё сотни ранены и арестованы. Еще одним предметом для обсуждения было то, что американские спортсмены Томми Смит и Джон Карлос стояли на пьедестале почета для церемонии вручения медалей в черных носках без обуви и значков гражданских прав. Затем они опустили головы и каждый вызывающе поднял кулак в черной перчатке, когда заиграл гимн, в знак солидарности с Движением За Свободу чернокожих в Соединенных Штатах. Летние Олимпийские игры продолжались, и все больше и больше медалей было разыграно. США заняли 1-е место, получив удивительные 107 медалей, СССР занял 2-е место с 91 медалью, а Япония - 3-е с 25 медалями. Следующая летняя Олимпиада пройдет в Мюнхене, Федеративная Республика Германия, в 1972 году."
 summerolympics.6.d: "XX Олимпийские Игры прошли в Мюнхене, ФРГ. Еще в 1916 году полагали, что летние Олимпийские игры будут проходить в Берлине, Германия, но из-за Первой мировой войны в том году они были отменены. 20 лет спустя Германия все таки приняла игры 1936 года, где заняла первое место. Сейчас уже третий раз, когда эта страна принимает у себя это мероприятие. Нынешние Олимпийские игры были очень популярны, миллионы людей наблюдали за ними по всему миру. Однако эта Олимпиада, как и в прочем всё мировое сообщество было омрачено тем, что палестинская террористическая организация, известная как \"Черный сентябрь\", совершив рейд на Олимпийскую деревню, взяла в заложники 11 израильских спортсменов. Местная полиция попыталась спасти их, но в конце концов операция провалилась, и все 11 заложников были убиты, а один полицейский был убит в перестрелке. СССР занял 1-е место, набрав 99 медалей. США и Германская Демократическая Республика заняли 2-е и 3-е места. США завоевали 94 медали, а ГДР - 66 медалей. Было объявлено, что следующая летняя Олимпиада пройдет в Монреале, Канада, в 1976 году."
 summerolympics.7.d: "XXI Олимпийские Игры проходили в канадском Монреале. Это первый случай проведения Олимпийских игр в Канаде. После выступления американских боксёров, их команда была прозвана \"величайшей\", поскольку такие имена, как Шугар Рэй Леонард, Майкл Спинкс, Говард Дэвис-младший, Леон Спинкс и Леон Рэндольф - все они выиграли золотые медали в мужском боксе. Однако 29 африканских стран протестовали и бойкотировали Олимпиаду после того, как МОК отказался запретить Новой Зеландии участвовать в этой Олимпиаде после поездки их команды по регби в Южную Африку, фактически означавшей поддержку Южно-Африканского апартеида и расовой сегрегации. Китайская республика также бойкотировала игры, так как МОК назвал КНР истинным Китаем. СССР занял 1-е место с поразительными 125 медалями, США заработали 94 медали, а ГДР заняла 3-е место с 90 медалями. Было объявлено, что следующая летняя Олимпиада пройдет в Москве, СССР, в 1980 году."
 summerolympics.8.d: "XXII Олимпийские Игры прошли в Москве, СССР. Это были первые Олимпийские игры, которые проводились в Восточной Европе, а также первые Олимпийские игры, которые проводились в стране, говорящей на славянском языке. Это были также первые Олимпийские игры, которые проводились в социалистической стране. Однако более 66 стран выразили протест или вовсе бойкотировали это мероприятие из-за советского вторжения в Афганистан. По итогу, СССР занял 1-е место со 195 медалями, ГДР - с 126 медалями, а Болгария заняла 3-е место с 41 медалью. Следующая летняя Олимпиада пройдет в Лос-Анджелесе, США, в 1984 году. Есть опасения ещё одного массового бойкота, на этот раз со стороны Восточной Европы и СССР."
 summerolympics.9.d: "XXIII Олимпийские Игры состоялись в Лос-Анджелесе, Соединенные Штаты Америки. Это был уже второй раз, когда Олимпийские игры проходили в Лос-Анджелесе после X Олимпиады 1932 года. Вокруг этой летней Олимпиады развернулась огромная полемика, поскольку 18 стран от Восточной Европы до Юго-Восточной Азии и Карибского бассейна протестовали или бойкотировали это мероприятие в качестве ответного протеста тем 66 странам, которые не явились на игры 1980 года. Вместо этого бойкотированные страны проведут в следующем месяце в Москве свое собственное мультиспортивное мероприятие под названием \"Дружба-84\". Соединенные Штаты заняли 1-е место с поразительными 174 заработанными медалями, ФРГ заняла 2-е место с 59 медалями, а Румыния заняла 3-е место с 53 медалями. Следующая летняя Олимпиада пройдет в Сеуле, Республика Корея, в 1988 году. Есть опасения ещё одного бойкота, но на этот раз, согласно заявлению МОК, они постараются сделать всё возможное, чтобы заключить сделку между всеми сторонами."
 summerolympics.10.d: "XXIV Олимпийские Игры прошли в Сеуле, Республика Корея. Это был первый раз, когда Олимпийские игры проводились на Корейском полуострове. Летнюю Олимпиаду бойкотировали такие социалистические страны, как КНДР, Куба, Эфиопия, Албания и Сейшельские острова. К счастью, там не было массовых протестов или такого большого количества бойкотов, как на летних Олимпийских играх 1980 и 1984 годов, поэтому в ней приняли участие почти все державы, соперничающие в Холодной войне. СССР занял 1-е место со 132 медалями, ГДР-2-е, получив 102 медали, а США-3-е, получив 94 медали. Следующая летняя Олимпиада пройдет в Барселоне, Испания, в 1992 году."
 summerolympics.11.d: "XXV Олимпийские Игры прошли в Барселоне, Испания. Это первая летняя Олимпиада, которая проводится в Испании и также без каких-либо протестов или бойкотов. Мужская баскетбольная команда США завоевала золото в этом году и стала называться \"командой мечты\" у себя на родине. Она состояла из Майкла Джордана, Ларри Берда, Мэджика Джонсона и других. По причине недавно произошедшего развала СССР и нехватке времени на создание собственных сборных, в играх принимала участие так называемая Объединенная команда, состоявшая из спортсменов 12 бывших республик, но без стран Балтии. По итогу она заняла 1-е место со 112 медалями, в то время как Соединенные Штаты заняли 2-е место со 108 медалями. ФРГ же заняла 3-е место с 82 заработанными медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Атланте, Соединенные Штаты Америки, в 1996 году."
 summerolympics.12.d: "XXVI Олимпийские Игры проходили в Атланте, Соединенные Штаты Америки. Эта Олимпиада была особенной, так в этот год игры праздновали своё 100-летие. Именно тогда, в греческих Афинах зажгли первый Олимпийский огонь. В настоящее время Америка провела 6 Олимпийских игр: в 1904 году - III Олимпийские игры в Сент-Луисе, в 1932 году - III Олимпийские зимние игры в Лейк-Плэсиде, в 1932 году - X Олимпийские игры в Лос-Анджелесе, в 1960 году - VIII Олимпийские зимние игры, в 1980 году - XIII Олимпийские зимние игры в Лейк-Плэсиде и в 1984 году - XV Олимпийские зимние игры в Лос-Анджелесе. Однако 27 июля в Олимпийском парке Сентенниал произошел взрыв самодельной бомбы. 2 человека погибли, а 111 были ранены. Человек, совершивший теракт, так и не был найден. США заняли 1-е место с 101 медалью, Германия-2-е с 65 медалями, а Россия - 3-е с 63 медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Сиднее, Австралия, в 2000 году."
 summerolympics.13.d: "XXVII Олимпийские Игры прошли в Сиднее, Австралия. Это был второй раз, когда Австралия принимала летние Олимпийские игры после 1956 года. Эта летняя Олимпиада - первая в новом тысячелетии. США заняли 1-е место с 97 медалями, Россия - 2-е с 88 медалями, а Китайская Народная Республика - 3-е с 59 медалями. Было объявлено, что следующая летняя Олимпиада состоится в Афинах, Греция, в 2004 году."
 summerolympics.14.d: "XXVIII Олимпийские Игры прошли в Афинах, Греция. В последний раз Греция принимала Олимпийские игры на Играх I Олимпиады в Афинах в 1896 году. Более 301 соревнования прошли с участием тысяч спортсменов из разных стран. США заняли 1-е место со 102 медалями, Россия - 2-е с 92 медалями, Китайская Народная Республика - 3-е с 63 медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Пекине, КНР, в 2008 году."
 summerolympics.15.d: "XXIX Олимпийские Игры прошли в Пекине, КНР. Это первый случай, когда КНР приняла Олимпийскую эстафету. Эта Олимпиада была самой посещаемой, в сумме её наблюдали 4,7 миллиарда человек со всего мира. КНР заняла 1-е место со 110 медалями, США - 2-е со 102, а Россия - 3-е с 60 медалями. Было заявлено, что следующие летние Олимпийские игры пройдут в Лондоне, Великобритания, в 2012 году."
 summerolympics.16.d: "XXX Олимпийские Игры прошли в Лондоне, Великобритания. В течение последних 2 недель, миллионы людей по всему миру наблюдали за тем, как их спортсмены делали все возможное для получения заветных золотых медалей. Это уже третий раз, когда Олимпийские игры приезжают в Лондон, и в настоящее время это единственный город, где проводилось 3 подобных Олимпиады. XIII Олимпийские игры 1944 года первоначально планировалось провести в Лондоне, но из-за ещё продолжающихся боевых действий они были отменены. В 1948 году в Лондоне состоялись XIV Олимпийские игры, и это была бы первая летняя Олимпиада в мире после войны. Здесь, в 2012 году, бегун из Ямайки Усэйн Болт заработал золото и стал самым быстрым человеком на Земле с 44,72 км/ч (27,8 миль в час). По итогу, США заняли 1-е место с 103 медалями, КНР - 2-е место с 91 медалью, а Великобритания - 3-е место с 65 медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Рио-де-Жанейро, Бразилия, в 2016 году."
 summerolympics.17.d: "XXXI Олимпийские Игры прошли в Рио-де-Жанейро, Бразилия. Это первый Олимпийский турнир, который был проведен в этой стране, а также первые Олимпийские игры, проведенные в Южной Америке. В этом году участие приняли более 10 000 спортсменов. США заняли 1-е место с 121 медалью, Великобритания - 2-е с 67 медалями, а КНР - 3-е с 65 медалями. Было объявлено, что следующие летние Олимпийские игры вновь пройдут в Токио, Япония, в 2020 году."