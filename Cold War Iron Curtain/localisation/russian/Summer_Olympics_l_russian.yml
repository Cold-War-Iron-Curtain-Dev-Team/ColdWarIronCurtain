 summerolympics.1.d: "XV Олимпийские Игры прошли в Хельсинки, Финляндия. Хельсинки был выбран для проведения XII Олимпийских игр 1940 года после того, как Токио не смог принять игры из-за Второй мировой войны, но даже тогда Хельсинки не смог принять Олимпийские игры - Вторая Мировая война достигла их, и летние Олимпийские игры 1940 года были отменены. Это самый северный город, принимающий летние Олимпийские игры. Соединенные Штаты заняли 1 - е место с 76 медалями, СССР следовал за ними с 71 медалью на 2-м месте, а Венгрия-на 3-м с 42 медалями. Было объявлено, что следующая летняя Олимпиада состоится в Мельбурне, Австралия, в 1956 году."
 summerolympics.2.d: "XVI Олимпийские Игры прошли в Мельбурне, Австралия. Австралия ещё никогда не принимала у себя Олимпийские игры, и это их первый раз. Сотни спортсменов со всего мира приехали в самый южный город мира. Египет, Ирак и Ливан протестовали или бойкотировали эту летнюю Олимпиаду в ответ на Суэцкий кризис. Нидерланды, Камбоджа, Испания и Швейцария - протестовали или бойкотировали эту Олимпиаду из-за участия Советов в венгерской революции и отсутствия последствий этого. СССР занял 1-е место с 98 медалями, США-2-е с 74 медалями, а Австралия-3-е с 35 медалями. Было объявлено, что следующая летняя Олимпиада пройдет в Риме, Италия, в 1960 году."
 summerolympics.3.d: "XVII Олимпийские Игры прошли в Риме, Италия. Это первый раз, когда летние Олимпийские игры пришли в Рим. Первоначально Рим принимал летние Олимпийские игры 1908 года, но из-за извержения вулкана Везувий они отказались принимать их. Италия принимала VII Зимние Олимпийские игры только 4 года назад, в 1956 году. Абебе Бикила из Эфиопии стал первым чернокожим олимпийским чемпионом Африки после того, как он выиграл олимпийский марафон. Кассиус Клей также выиграл мужской бокс и завоевал золото для США. СССР завоевал удивительные 103 медали, причем США заняли 2-е место с 71 медалью, а Италия-3-е с 36 медалями. Следующая летняя Олимпиада пройдет в Токио, Япония, в 1964 году."
 summerolympics.4.d: "XVIII Олимпийские Игры прошли в Токио, Япония. Первоначально Токио был выбран для проведения XII Олимпийских игр 1940 года, но из-за Второй мировой войны летние Олимпийские игры 1940 года были перенесены в Хельсинки. Спустя 15 лет летние Олимпийские игры вернулись в Токио. Летние Олимпийские игры в Токио были очень успешными, поскольку миллионы людей наблюдали за ними по всему миру. Были некоторые разногласия между КНР, КНДР и Индонезии - поэтому эти 3 страны протестовали или бойкотировали Олимпиаду. США заняли 1-е место с 90 медалями, СССР-2-е с 96 медалями, а Япония-3-е с 29 медалями. Было заявлено, что следующая летняя Олимпиада состоится в Мехико, Мексика, в 1968 году."
 summerolympics.5.d: "XIX Олимпийские Игры проходили в Мехико, Мексика. Это первый случай, когда Олимпийские игры были проведены в стране Латинской Америки и испаноязычной стране. Летние Олимпийские игры проводились в состоянии повышенной готовности, поскольку в Мексике происходили массовые протесты и беспорядки в течение последнего года. За 10 дней до начала Летних Олимпийских игр студенты собрались на площади Пласа-де-лас-Трес-Культурас в Тлателолко, чтобы призвать к более широким гражданским и демократическим правам и выразить презрение к Олимпийским играм. Правительство приказало разогнать митинг и направило на площадь 5000 солдат и 200 танков. Сотни студентов были убиты, ещё сотни ранены и арестованы. Ещё одним спорным моментом было то, что американские спортсмены Томми Смит и Джон Карлос стояли на пьедестале почета для церемонии вручения медалей в черных носках без обуви и значков гражданских прав. Затем они опустили головы и каждый вызывающе поднял кулак в черной перчатке, когда заиграл гимн, в знак солидарности с Движением За Свободу чернокожих в Соединенных Штатах. Летние Олимпийские игры продолжались, поскольку все больше и больше медалей было разыграно. США заняли 1-е место, получив удивительные 107 медалей, СССР занял 2-е место с 91 медалью, а Япония-3-е с 25 медалями. Следующая летняя Олимпиада пройдет в Мюнхене, Федеративная Республика Германия, в 1972 году."
 summerolympics.6.d: "XX Олимпийские Игры прошли в Мюнхене, ФРГ. Первоначально предполагалось, что летние Олимпийские игры 1916 года пройдут в Берлине, Германия, но из-за Первой мировой войны летние Олимпийские игры в том году были отменены. 20 лет спустя Германия будет принимать летние Олимпийские игры 1936 года в Берлине. Это уже второй раз, когда Германия принимает у себя летние Олимпийские игры. Эти Олимпийские игры были популярны, поскольку миллионы людей наблюдали за ними по всему миру. Однако эта Олимпиада была омрачена тем, что палестинская террористическая организация, известная как "Черный сентябрь", взяла в заложники 11 израильских спортсменов. Местная полиция попыталась спасти их, но операция провалилась, и все 11 заложников были убиты, а один полицейский был убит в перестрелке. СССР занял 1-е место, набрав 99 медалей. США и Германская Демократическая Республика заняли 2-е и 3-е места. США завоевали 94 медали, а ГДР-66 медалей. Было объявлено, что следующая летняя Олимпиада пройдет в Монреале, Канада, в 1976 году."
 summerolympics.7.d: "XXI Олимпийские Игры проходили в канадском Монреале. Это первый случай проведения Олимпийских игр в Канаде. В США было то, что люди называют величайшей командой бокса, поскольку такие имена, как Шугар Рэй Леонард, Майкл Спинкс, Говард Дэвис-младший, Леон Спинкс и Леон Рэндольф, все выиграли золотые медали в мужском боксе. 29 африканских стран протестовали или бойкотировали эту Олимпиаду после того, как МОК отказался запретить Новой Зеландии участвовать в этой Олимпиаде после их участия в Южной Африке. Китайская республика также протестовала или бойкотировала из-за того, что МОК назвал КНР Китаем. СССР занял 1-е место с поразительными 125 медалями, США заработали 94 медали, а ГДР заняла 3-е место с 90 медалями. Было объявлено, что следующая летняя Олимпиада пройдет в Москве, СССР, в 1980 году."
 summerolympics.8.d: "XXII Олимпийские Игры прошли в Москве, СССР. Это были первые Олимпийские игры, которые проводились в Восточной Европе, а также первые Олимпийские игры, которые проводились в стране, говорящей на славянском языке. Это были также первые Олимпийские игры, которые проводились в социалистической стране. Однако более 66 стран протестовали или бойкотировали эту летнюю Олимпиаду из-за советской агрессии на Ближнем Востоке с их агрессией с Афганистаном. СССР занял 1-е место со 195 медалями, ГДР-126 медалями, а Болгария заняла 3-е место с 41 медалью. Следующая летняя Олимпиада пройдет в Лос-Анджелесе, США, в 1984 году. Есть опасения ещё одного массового бойкота, на этот раз со стороны Восточной Европы и СССР."
 summerolympics.9.d: "XXIII Олимпийские Игры состоялись в Лос-Анджелесе, Соединенные Штаты Америки. Это был уже второй раз, когда Олимпийские игры проходили в Лос-Анджелесе после игр 1932 года X Олимпиады. Вокруг этой летней Олимпиады развернулась огромная полемика, поскольку 18 стран от Восточной Европы до Юго-Восточной Азии и Карибского бассейна протестовали или бойкотировали эту летнюю Олимпиаду в качестве ответного протеста и бойкота 66 странам, которые протестовали и бойкотировали XXII Олимпийские игры 1980 года. Вместо этого бойкотированные страны проведут в следующем месяце в Москве свое собственное мультиспортивное мероприятие под названием "Игры Дружбы". Соединенные Штаты заняли 1-е место с поразительными 174 заработанными медалями, ФРГ заняла 2-е место с 59 медалями, а Румыния заняла 3-е место с 53 медалями. Следующая летняя Олимпиада пройдет в Сеуле, Республика Корея, в 1988 году. Есть опасения ещё одного бойкота на этот раз, и МОК заявил, что они постараются сделать всё возможное, чтобы заключить сделку между обеими сторонами."
 summerolympics.10.d: "XXIV Олимпийские Игры прошли в Сеуле, Республика Корея. Это был первый раз, когда Олимпийские игры проводились на Корейском полуострове. Эта летняя Олимпиада была протестована или бойкотирована КНДР, Кубой, Эфиопией, Албанией и Сейшельскими островами за то, что МОК выбрал город-организатор в качестве Сеула. К счастью, там не было массовых протестов или бойкотов, как на летних Олимпийских играх 1980 и 1984 годов. СССР занял 1-е место со 132 медалями, ГДР-2-е, получив 102 медали, а США-3-е, получив 94 медали. Следующая летняя Олимпиада пройдет в Барселоне, Испания, в 1992 году."
 summerolympics.11.d: "XXV Олимпийские Игры проходили в Барселоне, Испания. Это первая летняя Олимпиада, которая проводится для Испании и также без каких-либо протестов или бойкотов с ней. Мужская баскетбольная команда США завоевала золото в этом году и называется "Команда мечты", состоящая из Майкла Джордана, Ларри Берда, Мэджика Джонсона и других. Объединенная команда заняла 1-е место со 112 медалями, в то время как Соединенные Штаты заняли 2-е место со 108 медалями. ФРГ заняла 3-е место с 82 заработанными медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Атланте, Соединенные Штаты Америки, в 1996 году."
 summerolympics.12.d: "XXVI Олимпийские Игры проходили в Атланте, Соединенные Штаты Америки. Эта Олимпиада является особенной, так как I Олимпийские Игры начались 100 лет назад в Афинах, Греция. В настоящее время Америка провела 6 Олимпийских игр: в 1904 году - III Олимпийские игры в Сент-Луисе, в 1932 году - III Олимпийские зимние игры в Лейк-Плэсиде, в 1932 году - X Олимпийские игры в Лос-Анджелесе, в 1960 году - VIII Олимпийские зимние игры, в 1980 году - XIII Олимпийские зимние игры в Лейк-Плэсиде и в 1984 году - XV Олимпийские зимние игры в Лос-Анджелесе. Однако 27 июля в Олимпийском парке Сентенниал произошел взрыв самодельной бомбы. 2 человека погибли, а 111 были ранены. Не было ни одного подозреваемого нашли. США заняли 1-е место с 101 медалью, Германия-2-е с 65 медалями, а россияне-3-е с 63 медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Сиднее, Австралия, в 2000 году."
 summerolympics.13.d: "XXVII Олимпийские Игры проходили в Сиднее, Австралия. Это был второй раз, когда Австралия принимала летние Олимпийские игры после игр 1956 года XVI Олимпиады. Эта летняя Олимпиада - первая в новом тысячелетии. США заняли 1-е место с 97 медалями, Россия - 2-е с 88 медалями, а Китайская Народная Республика - 3-е с 59 медалями. Было объявлено, что следующая летняя Олимпиада состоится в Афинах, Греция, в 2004 году."
 summerolympics.14.d: "XXVIII Олимпийские Игры проходили в Афинах, Греция. В последний раз Греция принимала Олимпийские игры на Играх I Олимпиады в Афинах в 1896 году. Более 301 соревнования прошли с участием тысяч спортсменов из других стран. США заняли 1-е место со 102 медалями, Россия-2-е с 92 медалями, Китайская Народная Республика-3-е с 63 медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Пекине, КНР, в 2008 году."
 summerolympics.15.d: "XXIX Олимпийские Игры проходили в Пекине, КНР. Это первый случай, когда КНР принимает у себя олимпийское мероприятие. Эта Олимпиада была самой посещаемой Олимпиадой, которую наблюдали 4,7 миллиарда человек со всего мира. КНР заняла 1-е место со 110 медалями, США-2-е со 102, а Россия-3-е с 60 медалями. Было заявлено, что следующие летние Олимпийские игры пройдут в Лондоне, Великобритания, в 2012 году."
 summerolympics.16.d: "XXX Олимпийские Игры проходили в Лондоне, Великобритания, в течение последних 2 недель, когда миллионы людей по всему миру наблюдали за тем, как их спортсмены делают все возможное. Это уже третий раз, когда Олимпийские игры приезжают в Лондон, и в настоящее время это единственный город, где проводятся 3 Олимпиады. XIII Олимпийские игры 1944 года первоначально планировалось провести в Лондоне, но из-за боевых действий во Второй мировой войне игры были отменены. В 1948 году в Лондоне должны были состояться XIV Олимпийские игры, и это была бы первая летняя Олимпиада в мире после Второй мировой войны. Усэйн Болт из Ямайки заработал золото и стал самым быстрым человеком на Земле с 44,72 км/ч (27,8 миль в час). США заняли 1-е место с 103 медалями, КНР-2-е место с 91 медалью, а Великобритания-3-е место с 65 медалями. Было объявлено, что следующие летние Олимпийские игры пройдут в Рио-де-Жанейро, Бразилия, в 2016 году."
 summerolympics.17.d: "XXXI Олимпийские Игры проходили в Рио-де-Жанейро, Бразилия. Это первый Олимпийский турнир, который был проведен в Бразилии, а также первые Олимпийские игры, проведенные в Южной Америке. В этом году в олимпиаде приняли участие более 10 000 спортсменов. США заняли 1-е место с 121 медалью, Великобритания-2-е с 67 медалями, а КНР-3-е с 65 медалями. Было объявлено, что следующие летние Олимпийские игры вновь пройдут в Токио, Япония, в 2020 году."
