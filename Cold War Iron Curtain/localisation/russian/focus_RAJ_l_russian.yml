 India_Emergency.21.d: "Парламент проголосовал за принятие сорок второй поправки к конституции, что стало крупной победой премьер-министра. Законопроект снижает полномочия судебной власти, особенно в отношении результатов выборов и определения действительности законодательства. Канцелярия премьер-министра также получила новые полномочия. Преамбула конституции также была изменена, а описание Индии было изменено с «суверенной демократической республики» на «суверенную, социалистическую, светскую демократическую республику». Добавление социалистического и светского отражает акцент на национальном единстве и обеспечении того, чтобы нация работала над устранением экономического неравенства. Оппозиция резко критикует новую поправку, называя ее незаконной попыткой узаконить недемократическую политику чрезвычайного положения премьер-министра. Правительство отклонило критику, отметив, что поправка была принята в соответствии с конституционной процедурой."
