l_russian:
 rho.2.d: "Ранее сегодня Ян Смит объявил, что Родезия, британская территория в южной Африке, которая управляла собой с 1923 года, теперь считает себя независимым суверенным государством. Это первый односторонний разрыв с Соединенным Королевством одной из его колоний со времени Провозглашения независимости Соединенных Штатов почти два столетия назад. Великобритания, Содружество и Организация Объединенных Наций признали УДИ Родезии незаконной, и экономические санкции ООН уже были запланированы.Между британским и родезийским премьер-министрами между 1964 и 1965 годами сложилась патовая ситуация. Спор в основном касался британского условия, что условия независимости должны быть приемлемы"для народа страны в целом"; Смит утверждал, что это было выполнено, в то время как Великобритания и черные родезийские лидеры в Родезии считали, что это не так.Ян Смит сказал, что, несмотря на это, они все равно будут верны королеве Елизавете II."
 rho.3.d: "Конференции в водопаде Виктория и Лондоне привели к образованию Федерации Родезии и Ньясаленда, состоящей из трех подразделений: Ньясаленда, Северной Родезии и Южной Родезии. Федерация была официально создана после того, как британский парламент принял Закон о федерации Родезии и Ньясаленда. Впоследствии этот акт был санкционирован королевой."
 rho.4.d: "Совет Безопасности ООН на прошлой неделе сделал своего рода исторический шаг. Впервые за 21 год своего существования она прибегла к обязательным экономическим санкциям, чтобы попытаться свергнуть правительство.Объектом санкций был режим белого превосходства Яна Смита в Родезии, который был осужден как международный ренегат с тех пор, как он откололся от британского правления 13 месяцев назад. Одиннадцатью голосами против нуля-при четырех воздержавшихся-совет объявил международное эмбарго на 90% экспорта Родезии, запретил 122 странам-членам ООН продавать нефть, оружие, автомобили или самолеты мятежной территории или оказывать ей любую финансовую или иную экономическую помощь.Однако прогнозируется, что санкции не будут иметь реального эффекта. Была отклонена поправка о наказании стран, игнорирующих бойкот. Совет Безопасности предоставил каждой стране-члену контролировать свою собственную торговлю с Родезией. Вскоре после голосования на прошлой неделе Южная Африка, которая поставляет большую часть нефти Родезии и является ее основным торговым партнером, объявила, что не намерена подчиняться резолюции. Без сотрудничества с Южной Африкой санкции, похоже, обречены на провал."
 rho.129.d: "Родезия была вновь соединена с миром новой воздушной линией: Air Rhodesia. Из-за санкций на все международные рейсы в Родезию, введенных в связи с декларацией независимости Родезийского правительства, корпорация Air Rhodesia планирует только международные рейсы в дружественное государство Малави. Первоначальный маршрут из Солсбери в Блантайр в настоящее время предлагается на Виккерсах Виконтов, которые были унаследованы от их бывшей материнской компании Central African Airways."
 ZIM_NYA_independence_war: "Война за независимость Малави"
 ZIM_ZAM_independence_war: "Война за независимость Замбии"
 bush_war.1.d: "Колония Южной Родезии была потрясена тем, что белый бригадир Эндрю Оберхольцер был убит зимбабвийскими националистами в результате, казалось бы, политически мотивированного акта. Согласно сообщениям, Оберхольцер попал в засаду и был убит, когда ехал со своей семьей по главной дороге, но вскоре убийц прогнала другая машина. Хотя в официальном заявлении администрации говорится, что убийцы с тех пор были ликвидированы, инцидент оказал глубокое влияние на белую общину меньшинства. Правительство уже начало облаву на лидеров черных националистов, и многие предсказывают, что это приведет к радикальному росту напряженности между правящими белыми и черным большинством."
 bush_war.2.d: "В течение многих лет мы страдали от гражданских беспорядков и мятежного мятежа, который не сделал ничего, кроме сохранения хаоса и неопределенности на наших землях. Однако становится все более очевидным, что повстанцы удваивают свои усилия, особенно в битве при Синойе. Перестрелка между родезийскими силами безопасности и партизанами ЗАНЛА привела к нулевым потерям с нашей стороны, а с их-к 7. Хотя это, несомненно, победа для нас, это послужит прецедентом того, что мятеж, которым мы просто пренебрегли, набрал обороты, сигнализируя о признаках гражданской войны на горизонте..."
 bush_war.3.d: "В ответ на убийство фермера Йоханнеса Вильджоена британская полиция Южной Африки начала военную операцию в координации с Родезийской армией по уничтожению или захвату террористов. Считалось, что они связаны с Африканской национально-освободительной армией Зимбабве, которая в последнее время усиливает свою кампанию насилия против нашего белого населения и представляет значительную угрозу стабильности страны. До сих пор операция имела несомненный успех: несколько террористов были убиты, а остальные, похоже, в бегах. Когда угроза хотя бы временно нейтрализуется, это должно дать людям понять, что наше правительство может защитить их от внутренних угроз и укрепить веру в администрацию. Однако, поскольку наши силы уже вовлекают националистов в бои, существует угроза, что мы можем быть перегружены, если последуют новые атаки."
 bush_war.4.d: "Недавно Родезийские силы безопасности обнаружили, что 79 членов Народно-революционной армии Зимбабве пересекли границу с Замбией в явной попытке собрать больше рекрутов и потенциально совершить набег на принадлежащие белым фермы. Мы узнали об этом только после успешного захвата одинокого повстанца на дороге между водопадом Виктория и Уэнки, что означало, что повстанцы уже находились в глубине родезийской территории. Операция "Никель" была впоследствии начата Родезийской армией при поддержке Родезийской легкой пехоты и Родезийских африканских стрелков в попытке выследить и захватить оставшихся повстанцев. Несмотря на первоначальные неудачи, наши войска смогли убить многих, изгнав их и арестовав нескольких в ходе хрестоматийной операции. Наконец, после зачистки элитными спецназовцами последние 17 повстанцев бежали в дружественную страну Ботсвану, где впоследствии были арестованы. Ценой 8 убитых и 14 раненых наши войска смогли убить 29 и арестовать 17 повстанцев, причем один пропал без вести. Еще 29 человек были арестованы в Ботсване и еще один-в Южной Африке, и только один из 79 повстанцев сумел пересечь замбийскую границу. Эта значимая победа, ставшая последней в череде усиливающихся операций повстанцев, служит отличным стимулом для поднятия боевого духа и может послужить будущим примером безупречно проведенной кампании по борьбе с повстанцами."
 bush_war.5.d: "После последней в длинной череде повстанческих переходов через замбийскую границу родезийские силы безопасности начали операцию "Береза" - попытку местных коммандос искоренить по меньшей мере 20 повстанцев ЗИПРА, пересекающих реку Замбези. В ходе хорошо организованного и скоординированного наступления повстанцы вошли в страну, а затем разделились на группы и вступили в бой с силами РЛИ, вынудив их отступить. Однако на следующий день они устроили засаду, убив всех повстанцев ценой одного погибшего. После того, как в течение следующих нескольких дней было произведено всего несколько арестов, крупная удача достигла сил борьбы с повстанцами, когда повстанец дезертировал и направил патруль RLI в лагерь повстанцев, позволив убить или арестовать по крайней мере еще двух повстанцев. В течение следующего месяца патрулирование усилилось, и была начата крупная кампания, направленная на то, чтобы окончательно искоренить последних повстанцев на родезийской территории. В другой удачный момент начальник оперативного отдела ЗИПРА был схвачен с планшетом, содержащим рекомендации о том, как повысить эффективность операций повстанцев в Родезии. Это побудило оставшихся повстанцев разбежаться, а силы безопасности потеряли их след по пути - в то время как еще несколько человек были арестованы после пересечения границы с португальским Мозамбиком. Наконец, спустя почти два месяца, операция была, наконец, отменена - наши силы нанесли по меньшей мере 23 потери повстанцев ценой только одного коммандос убитыми и еще двумя ранеными."
