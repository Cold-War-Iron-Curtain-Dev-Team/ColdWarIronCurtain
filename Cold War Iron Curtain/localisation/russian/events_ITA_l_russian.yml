l_english:
 ita_communist.1.d: "Результаты общенациональных выборов опубликованы, и Итальянская Коммунистическая Партия (ИКП) одержала уверенную победу. Партия во главе с Пальмиро Тольятти смогла получить 335 мест из 574 в парламенте, что является сокрушительной победой над Христианско-демократической партия и другими оппонентами на политической арене. К выборам было приковано пристальное внимание сверхдержав. США поддерживали ХДС, тогда как помощь ИКП оказывал Советский Союз. В итоге Советский Союз продемонстрировал свое могущество на международной арене и расширил свою сферу влияния в Западной Европе. НАТО опасалось такого исхода событий, так как еще одна страна пала под натиском коммунизма, как Чехословакия в 1948. Можно только догадываться, что ждет Италию в будущем. Некоторые эксперты говорят о неминуемом выходе страны из НАТО и вступлении в просоветские блоки, что вполне возможно, ведь Пальмиро Тольятти - коммунист сталинского толка. Точно можно сказать только одно - это поворотный момент для Европы и, возможно, всего мира."
 ita_communist.2.d: "Сегодня Пальмиро Тольятти объявил о выходе Италии из Североатлантического альянса. Хотя [ITA.GetNameDef] была одной из стран-основательниц НАТО, недавняя победа коалиции левых сил во главе с ИКП на парламентских выборах привела к тому, что страна отвернулась от своих недавних союзников. И хотя Пальмиро Тольятти не делал поспешных заявлений о будущем [ITA.GetNameDef], слухи о [SOV.Capital.GetName] уже появляются в прессе, но они еще не подтверждены."
 trieste_crisis.1.d: "После долгих лет восстановления как в Югославии, так и Италии снова стал актуальным вопрос принадлежности Триеста. Этот портовый город разделен на 2 зоны оккупации еще с 1947 года. Сам город контролируется американскими и британскими силами в регионе, тогда как сельская местность и прилегающие территории находятся под контролем югославских партизан. И итальянское, и югославское руководство с помощью ООН надеются достичь нового соглашения по поводу дальнейшей политики в отношении Триеста."
 annex_trieste.1.d: "Усилия по мирному урегулированию кризиса в Триесте провалились тогда, когда итальянская армия вошла в зону, подконтрольную Югославии для присоединения территории. После долгих дней переговоров между итальянскими и югославскими дипломатами о статусе этого прибрежного города, премьер-министр Палла приказал итальянской армии занять югославскую зону. Теперь внимание мира устремлено на итальянскую агрессию и реакцию югославской стороны. Память о мировых войнах еще свежа в умах людей Италии и Югославии, но кажется, что скоро история Средиземноморья может получить еще одну кровавую страницу."
 italy_resign.1.d: "После 6 месяцев нахождения в должности, премьер-министр Италии Джузеппе Пелла подал в отставку сегодня в Риме. Своими однобокими решениями в сторону либерализации экономики и в принципе правого уклона, он навлек на себя гнев всего левого политического лагеря Италии. Провал законодательных инициатив его правительства и конфронтация с Югославией по поводу Триеста, скорее всего, стали причиной столь раннего оставления министерских портфелей."
 ita.1.t: "Воссоединение с Триестом!"
 ita.1.d: "Пришло время вернуть Триест, контролируемый в данный момент силами ООН, в родную гавань. Планируется разделить город на 2 зоны: зона А, в которую войдет город и пригороды, и зону Б, в основном занимающую сельскую местность. Мы получим зону А, а Югославия - зону Б. Должны ли поддержать такое разделение или мы не будем делить Триест с Югославией?"
 ita.1.a: "Мы поддержим разделение."
 ita.1.b: "Мы желаем полного контроля над Триестом!"
 ita.2.t: "Угроза от Югославии"
 ita.2.d: "Югославия угрожает нам тем, что сохранит Триест полностью под своим контролем. Если мы откажем им, это может привести к эскалации конфликта и, потенциально, войне, но мы сохраним город. Если мы отступим, то Югославия получит Триест в свое распоряжение."
 ita.2.a: "Мы не отступим!"
 ita.2.b: "Мы сохраним мир"
 ita.202.d: "Сан-Марко-1 был запущен 15 декабря 1964 года итальянской наземной командой, использовавшей американскую ракету-разведчик с космодрома Уоллопс в Вирджинии. Это первый итальянский спутник и большое достижение для Эдоардо Амальди и его команды. Из-за их усердной и тяжелой работы Италия стала пятой страной, имеющей собственный искусственный спутник на орбите Земли. Основной целью миссии является проведение ионосферных исследований. После 272 дней на орбите Сан-Марко сгорит при входе в атмосферу Земли."
