l_russian:
 ita_communist.1.d: "Результаты общенациональных выборов опубликованы, и Итальянская Коммунистическая Партия (ИКП) одержала убедительную победу. Во главе с Пальмиро Тольятти партия сумела набрать 335 мест из 574, что является огромной победой над Христианско-демократической партии и другими противниками. На выборы оказали большое влияние сверхдержавы. США поддержали христианских демократов, а Советский Союз - ИКП. Данная победа продемонстрировала политическую мощь Советского Союза и, несомненно, расширила сферу их влияния. Члены НАТО опасались этого исхода выборов, поскольку еще одна нация пала перед коммунизмом, как Чехословакия во время коммунистического переворота 1948 года. Тольятти еще не объявил, какую позицию займет страна в будущем. Некоторые предполагают, что новый режим может выйти из НАТО и даже вступить в Коминформ, поскольку Тольятти является сталинистом. Это действительно поворотный момент для Европы и вполне возможно, что и для всего мира."
 ita_communist.2.d: "Сегодня Пальмиро Тольятти официально объявил о выходе из Североатлантического альянса. Хотя [ITA.GetNameDef] была одной из основательниц демократического оборонительного альянса, недавняя победа на выборах коалиции, в которой доминировала Итальянская Коммунистическая партия, привела к тому что возобладало другое мнение, отчуждающее нацию от своих бывших союзников. Хотя Пальмиро Тольятти ничего не сказал о будущем [ITA.GetNameDef], слухи о [SOV.Capital.GetName] уже появляются, хотя они еще не подтверждены."
 trieste_crisis.1.d: "После многих лет восстановления как в Союзной Республике Югославии, так и в Итальянской Республике настало время раз и навсегда решить вопрос о свободной территории Триеста. Территория разделена на две отдельные зоны оккупации; одна из них, зона А, патрулируется британскими и американскими силами в столичном района Триеста, а другая зона, зона В, под контролем югославских партизан, включает сельскую местность за пределами города. И итальянское, и югославское правительства с помощью Организации Объединенных Наций надеются достичь соглашения по поводу их дальнейшей политики в отношении Триеста."
 annex_trieste.1.d: "Усилия по достижению мирного урегулирования кризиса в Триесте сегодня провалились, когда итальянская армия вошла в Югославскую зону Триеста, чтобы совершить насильственное присоединение этой зоны к итальянскому государству. После многих дней напряженных переговоров между адриатическими государствами о статусе Триеста и его смешанного итальянского и славянского населения итальянское правительство, следуя националистической риторике премьер-министра Паллы, приказало итальянской армии выйти из столичной оккупационной зоны и занять сельскую местность с примущественно славянским населением, не уделяя должного внимания уверенным планам мирного раздела Триеста от югославского лидера Иосифа Броз Тито. Взгляд всего мира вновь устремлём на Белград в ожидании реакции Федерального правительства на итальянскую агрессию в Триесте. Воспоминания о Первой и Второй мировых войнах свежи в умах обеих стран. Многие люди по всему миру боятся что будет написана ещё одная кровавая глава в истории Средиземноморья."
 italy_resign.1.d: "Пробыв всего шесть месяцев в должности, премьер-министр Италии Джузеппе Пелла подал в отставку сегодня в столице Италии - Риме. Под руководством бывшего премьер-министра Альсиде де Гаспери, бывшего заместителем министра финансов во втором и третьем составах правительства и секретарем финансов в четвертом, он стал объектом неослабного контроля со стороны коммунистов и социалистов за его попытки вестернизации итальянской послевоенной экономики. После провала закона о мошенничестве он был назначен премьер-министром Италии, где его резко раскритиковали за его роль в разрешении недавней напряженности в отношениях с Иосифом Броз Тито и Югославией по поводу Свободных территорий Триеста. Последствия этого, как полагают многие, могут быть основной причиной его отставки."
 ita.1.t: "Воссоединение с Триестом"
 ita.1.d: "Пришло время вернуть город Триест, в настоящее время контролируемый СБ ООН, своему настоящему владельцу. Планируется разделить Триест на зону А в главной части города и зону Б в сельской местности за пределами Триеста. Югославия получит сельскую местность, а мы получим город. Должны ли мы поддержать разделение, или же мы хотим получить обе части?"
 ita.1.a: "Мы поддерживаем разделение"
 ita.1.b: "Мы хотим обе части!"
 ita.2.t: "Угроза от Югославии"
 ita.2.d: "Югославия угрожает нам, что сохранит обе части в своих руках. Если мы не отступим, они вторгнутся в Триест, но это может привести к войне между нами и Югославией. Если мы отступим, они получат обе части, и мир сохранится."
 ita.2.a: "Мы не отступим!"
 ita.2.b: "Мы сохраним мир"
 ita.202.d: "Сан-Марко-1 был запущен 15 декабря 1964 года итальянской наземной командой, использовавшей американскую ракету-разведчик с космодрома Уоллопс в Вирджинии. Это первый итальянский спутник и большое достижение для Эдоардо Амальди и его команды. Из-за их усердной и тяжелой работы Италия стала пятой страной, имеющей собственный искусственный спутник на орбите Земли. Основной целью миссии является проведение ионосферных исследований. После 272 дней на орбите Сан-Марко сгорит при входе в атмосферу Земли."
