 vie.2.t: "Битва за Ханой"
 vie.2.d: "Войска Северного Вьетнама вытеснили нас из Ханоя. Единственный способ заставить эту войну закончиться мирно, дать независимость Вьетнаму и вывести свои войска с севера."
 vie.2.a: "Ладно, давай сделаем это."
 vie.2.b: "Нет, мы боремся."
 vie.3.t: "[GetNewspaperHeader]Женевское соглашение"
 vie.3.d: "После нескольких недель переговоров на Женевской конференции Франция, государство Вьетнам и Демократическая Республика Вьетнам согласовали и подписали Женевские соглашения. Женевские соглашения гласят, что: 1. Временная военная демаркационная линия должна быть проведена вдоль 17-й параллели. 2. 3-мильная демилитаризованная зона по обе стороны границы. 3. Французские союзные войска перегруппируются к югу от линии фронта, а Вьетминь к северу. 4. Свободное передвижение населения между зонами в течение 300 дней. 5. Ни одна зона не должна вступать в какие-либо альянсы или искать военное подкрепление в течение 300 дней. 6. Создание международной контрольной комиссии для наблюдения за прекращением огня. Обе стороны согласились на эти условия, и, похоже, в регионе Индокитая вновь установится мир."
 vie.3.a: "Наша страна снова в мире."
 vie.3.b: "Интересно."
 vie.4.t: "Битва за Ханой"
 vie.4.d: "Войска Северного Вьетнама вытеснили нас из Ханоя. Единственный способ заставить эту войну закончиться мирно, дать независимость Вьетнаму и вывести свои войска с севера."
 vie.4.a: "Ладно, давай сделаем это."
 vie.4.b: "Нет, мы боремся."
 vie.5.t: "Женевская Конференция"
 vie.5.d: "В конце концов между нами и силами Вьетминя было достигнуто мирное соглашение."
 vie.5.a: "Война закончилась..."
