l_english:
 SOV_carrier_hull_2: "Авианесущий крейсер проекта 1143 типа «Кречет»"
 SOV_carrier_hull_2_short: "Проект 1143 «Кречет»"
 SOV_carrier_hull_2_desc: "Серия советских многоцелевых тяжёлых авианесущих крейсеров с ракетным вооружением дальней морской и океанской зоны, которые создавались как преемники вертолётоносцев проекта 1123 «Кондор»."
 SOV_carrier_hull_3: "Авианесущий крейсер проекта 1143.5 типа «Рига»"
 SOV_carrier_hull_3_short: "Проект 1143.5 «Рига»"
 SOV_carrier_hull_3_desc: "«Адмирал Флота Советского Союза Кузнецов» советский и российский авианесущий крейсер проекта 1143.5, единственный авианесущий корабль и одновременно Флагман Военно-морского флота России и Северного флота. Построен в Николаеве на Черноморском судостроительном заводе. Спущен на воду 4 декабря 1985 года. 4 октября 1990 года назван в честь Адмирала Флота Советского Союза Николая Герасимовича Кузнецова. Флагман ВМФ России и СФ."
 SOV_carrier_hull_4: "Авианесущий крейсер проекта 1143.6 типа «Варяг»"
 SOV_carrier_hull_4_short: "Проект 1143.6 «Варяг»"
 SOV_carrier_hull_4_desc: "Единственный представитель был заложен 6 декабря 1985 года на верфи Черноморского судостроительного завода в Николаеве для ВМФ СССР под названием «Рига» как второй тяжёлый авианесущий крейсер (ТАВКР) проекта 1143.5. 19 июня 1990 года был переименован в «Варяг» После распада СССР корабль достался Украине и его постройка была прекращена в 1992 году. В 1998 году был куплен Китаем, официально — с целью организации на нём плавучего центра развлечений. Отбуксирован в Китай и достроен как авианосец. 25 сентября 2012 вошёл в состав ВМС НОАК под названием «Ляонин»."
 SOV_carrier_hull_light_0: "Авианесущий крейсер проекта 71"
 SOV_carrier_hull_light_0_short: "Проект 71(с малой палубой)"
 SOV_carrier_hull_light_0_desc: "Проект малого авианосца отменен в 1940 году. Авианосцы этого типа были включены в программу советского кораблестроения 1938 года. Советские и иностранные конструкторы совместно создали более традиционную конструкцию авианосца, в середине 1939 года придумав то, что стало известно как проект 71. Малый авианосец водоизмещением 11 300 тонн должен был быть вооружен 8х100-мм универсальными пушками, 16х37-мм орудиями и 20х12,7-мм пулеметами."
 SOV_carrier_hull_light_1: "Противолодочный крейсер проекта 1123 типа «Кондор»"
 SOV_carrier_hull_light_1_short: "Проект 1123 «Кондор»"
 SOV_carrier_hull_light_1_desc: "Был первым классом действующих авианосцев (вертолетоносцев по советской классификации), построенных Советским Союзом для ВМФ СССР. Авиакрыло полностью состояло из вертолетов. Они были спроектированы в первую очередь как корабли противолодочной обороны (ПЛО), а ее вооружение и комплект датчиков были оптимизированы для защиты от угрозы атомных подводных лодок. Их стратегическая роль заключалась в защите советских бастионов подводных лодок с баллистическими ракетами от вторжений западных ударных подводных лодок, формируя флагманы оперативной группы противолодочной обороны."
 SOV_carrier_hull_light_2: "Большой десантный корабль проекта 1174 типа «Носорог»"
 SOV_carrier_hull_light_2_short: "Проект 1174 «Носорог»"
 SOV_carrier_hull_light_2_desc: "Проект 1174 «Носорог», представляет собой класс десантных кораблей (большой десантный корабль в советской классификации), построенных в Советском Союзе. Корабли были построены в рамках расширения десантных возможностей ВМФ СССР в 1970-х годах."
 SOV_carrier_hull_light_3: "Универсальный десантный корабль проекта 11780 типа «Херсон»"
 SOV_carrier_hull_light_3_short: "Проект 11780 «Херсон»"
 SOV_carrier_hull_light_3_desc: "Проект 11780 «Херсон» был советской программой УДК 1980-х годов, основанной на конструкции авианосца типа «Киев», сравнимой с американским десантным кораблем типа «Тарава». Корабль должен был иметь водоизмещение около 25 000 тонн, с паротурбинными силовыми установками и нести около 12 вертолетов, четыре десантных катера типа «Ондатра» и два десантных корабля на воздушной подушке типа «Цапля»."
 SOV_carrier_hull_light_4: "Универсальный десантный корабль проекта 23900 типа «Иван Рогов»"
 SOV_carrier_hull_light_4_short: "Проект 23900 «Иван Рогов»"
 SOV_carrier_hull_light_4_desc: "Проект 23900 — новейший класс российских универсальных десантных кораблей."
 SOV_carrier_hull_super_1: "Авианесущий крейсер проекта 1160 типа «Орёл»"
 SOV_carrier_hull_super_1_short: "Проект 1160 «Орёл»"
 SOV_carrier_hull_super_1_desc: "Первый советский проект авианосца с атомной силовой установкой. Авиагруппа крейсера должна была включать 60-70 самолетов. Первоначально предполагалось оснастить корабль истребителями МиГ-23А, противолодочными самолетами Р-42, бомбардировщиками Су-24К и вертолетами Ка-25ПС . Технические средства обеспечения полетов должны были включать 4 паровые катапульты, аэрофинишеры и аварийный барьер."
 SOV_carrier_hull_super_2: "Авианесущий крейсер проекта 1153 типа «Орёл»"
 SOV_carrier_hull_super_2_short: "Проект 1153 «Орёл» "
 SOV_carrier_hull_super_2_desc: "По сравнению с проектом 1160 предусматривалось меньшее на 10000 тонн водоизмещение, уменьшение авиагруппы, строительство двух кораблей вместо трёх. Кроме авиагруппы, корабли должны были нести по 20 подпалубных пусковых установок противокорабельного ракетного комплекса П-700 «Гранит». Ухудшение характеристик по сравнению с проектом 1160 было связано с тратой части бюджета на строительство третьего ТАВКР — проекта 1143.3 «Новороссийск». Корабли проекта 1153 должны были войти в строй к 1985 году."
 SOV_carrier_hull_super_3: "Авианесущий крейсер проекта 1143.7 типа «Ульяновск»"
 SOV_carrier_hull_super_3_short: "Проект 1143.7 «Ульяновск»"
 SOV_carrier_hull_super_3_desc: "«Ульяновск» (заказ С-107) — недостроенный советский атомный тяжёлый авианесущий крейсер (АТАВКР) проекта 1143.7. Из-за тяжёлой экономической обстановки, сложившейся после распада СССР, строительство корабля было прекращено. Разобран на стапеле в 1992 году."
 SOV_carrier_hull_super_4: "Авианесущий крейсер проекта 23000 типа «Шторм»"
 SOV_carrier_hull_super_4_short: "Проект 23000 «Шторм»"
 SOV_carrier_hull_super_4_desc: "Проект перспективного российского многоцелевого тяжелого авианосца. Корабль предназначен для выполнения различных задач в дальней океанской зоне, сможет наносить удары по наземным и надводным объектам противника с использованием собственного вооружения и авиации десантной авиагруппы, кроме того, сможет обеспечивать противовоздушную оборону десантными средствами. средства ПВО и авиагруппы, обеспечивают боевую устойчивость и ПВО корабельных группировок, а также обеспечивают поддержку десанта."
 SOV_ww_capitals: "Линкор типа «Севастополь»"
 SOV_ww_capitals_short: "Линкор типа «Севастополь»"
 SOV_ww_capitals_desc: "Линкоры типа «Севастополь», также известные в западных публикациях как «класс Гангут», были первыми дредноутами, построенными для Императорского флота России перед Первой мировой войной. У них была запутанная история проектирования с участием нескольких британских компаний, меняющиеся требования, международный дизайн конкуренции и иностранных протестов."
 SOV_ww_screens: "Лидер эскадренных миноносцев проекта 38 типа «Минск» "
 SOV_ww_screens_short: "Проект 38 «Минск»"
 SOV_ww_screens_desc: "Проект советских лидеров эсминцев типа «Ленинград» 2-й серии, построенных в середине 1930-х годов для ВМФ СССР. В 1934-1940 гг. 3 лидера этого типа были построены на советских верфях в Минске, Баку и Тбилиси). Руководители этого проекта принимали участие в боях на Балтийском и Северном флотах ВМФ СССР в годы Великой Отечественной войны."
 SOV_battle_hull_medium_0: "Линкор типа «Новороссийск»"
 SOV_battle_hull_medium_0_short: "Линкор типа «Новороссийск»"
 SOV_battle_hull_medium_0_desc: "Первоначально итальянский линкор «Giulio Ceasare». Корабль был передан Советскому Союзу в 1949 году и переименован в «Новороссийск». Советы также использовали его для тренировок, пока он не была потоплен в 1955 году с потерей 608 человек, когда взорвалась старая немецкая мина. В следующем году ее спасли, а затем сдали на слом."
 SOV_battle_hull_medium_1: "Тяжёлый крейсер проекта 82 типа «Сталинград»"
 SOV_battle_hull_medium_1_short: "Проект 82 «Сталинград»"
 SOV_battle_hull_medium_1_desc: "«Сталинград» (заводской номер 400). Зачислен в списки ВМФ СССР 31 августа 1951 года. Заложен 31 декабря 1951 года на заводе № 444 (г. Николаев). 18 апреля 1953 года строительство прекращено. В июне 1953 года принято решение использовать часть корпуса, включая цитадель, в качестве натурного опытового отсека для проверки стойкости конструктивной защиты корабля к воздействию новых образцов морского оружия. В 1954 году переоборудованный отсек был спущен на воду и в 1956—1957 годах использовался в качестве мишени для испытаний крылатых ракет, артиллерийских снарядов, авиабомб и торпед. В результате всех испытаний отсек не потерял плавучести при полном отсутствии сил и средств борьбы за живучесть."
 SOV_battle_hull_medium_2: "Ракетный крейсер проекта 1164 типа «Атлант»"
 SOV_battle_hull_medium_2_short: "Проект 1164 «Атлант»"
 SOV_battle_hull_medium_2_desc: "Серия советских многоцелевых ракетных крейсеров с управляемым ракетным вооружением дальней морской и океанской зоны, занимающих промежуточное положение между тяжёлыми атомными ракетными крейсерами типа «Киров» проекта 1144 «Орлан» и эскадренными миноносцами (эсминцами) типа «Современный» проекта 956 «Сарыч». Ракетные крейсера проекта 1164 «Атлант» с мощным ракетным вооружением класса «поверхность-поверхность» стали важной частью ВМФ России после раздела флота СССР. РК «Варяг» является действующим флагманом Тихоокеанского флота по состоянию на июнь 2023 года."
 SOV_battle_hull_medium_3: "Тяжёлый атомный ракетный крейсер проекта 1144 типа «Орлан»"
 SOV_battle_hull_medium_3_short: "Проект 1144 «Орлан»"
 SOV_battle_hull_medium_3_desc: "Проект 1144 «Орлан», представляет собой класс атомных ракетных крейсеров ВМФ СССР и ВМФ России, самые большие и тяжелые надводные боевые корабли (т.е. не авианосец или десантный корабль). в эксплуатации в мире. Среди современных военных кораблей они уступают по размеру только крупным авианосцам и сопоставимы по размеру с линкорами времен Первой мировой войны. Советская классификация типа корабля - \"тяжелый атомный ракетный крейсер\"."
 SOV_battle_hull_medium_4: "Ракетный крейсер проекта 1164М типа «Атлант-М» "
 SOV_battle_hull_medium_4_short: "Проект 1164М «Атлант-М»"
 SOV_battle_hull_medium_4_desc: "Вариант модернизации кораблей проекта 1164 с установкой на строящиеся корпуса более совершенных новых ударного ракетного комплекса П-1000 \"Вулкан\", ЗРК малой дальности \"Оса-МА2\", РЛС МР-750 \"Фрегат-М2\", РЛК РЭБ МП-407 \"Старт-2\"."
 SOV_battle_hull_light_0: "Крейсер проекта 68-К"
 SOV_battle_hull_light_0_short: "Проект 68-К"
 SOV_battle_hull_light_0_desc: "Группа крейсеров, построенных для ВМФ СССР во время и после Второй мировой войны. Планировалось семнадцать кораблей, но фактически до немецкого вторжения было спущено на воду только семь. Два недостроенных корабля были уничтожены при захвате их верфи в Николаеве гитлеровской Германией, а остальные пять крейсеров были достроены только в 1950 году."
 SOV_battle_hull_light_1: "Крейсер проекта 68-бис"
 SOV_battle_hull_light_1_short: "Проект 68бис"
 SOV_battle_hull_light_1_desc: "Проект 68бис, были последними обычными артиллерийскими крейсерами, построенными для советского флота. Они были построены в 1950-х годах на основе советских, немецких и итальянских проектов и концепций, разработанных до Второй мировой войны. Их модифицировали, чтобы улучшить их мореходные качества, что позволило им двигаться на высокой скорости в бурных водах Северной Атлантики. Базовый корпус был более современным и имел лучшую бронезащиту, чем подавляющее большинство конструкций артиллерийских крейсеров после Второй мировой войны, построенных и развернутых аналогичными странами."
 SOV_battle_hull_light_2: "Ракетный крейсер проекта 58 типа «Грозный»"
 SOV_battle_hull_light_2_short: "Проект 58 «Грозный»"
 SOV_battle_hull_light_2_desc: "Ракетные крейсера проекта 58, известные в НАТО как класс «Kynda» и иногда именуемые как класс «Грозный» (тип «Грозный»), по названию первого корабля строящейся серии, были первого поколения советских ракетных крейсеров и явились значительным достижением советского флота."
 SOV_battle_hull_light_3: "Большой противолодочный корабль проекта 1134-А типа «Беркут-А»"
 SOV_battle_hull_light_3_short: "Проект 1134А «Беркут-А»"
 SOV_battle_hull_light_3_desc: "Проект 1134А «Беркут А», представлял собой класс управляемых ракетных крейсеров (большой противолодочный боевой корабль по советской классификации), построенный Советским Союзом для ВМФ СССР. НАТО классифицирует этот класс как «крейсеры» в основном из-за противокорабельного ракетного комплекса «Метель» (SS-N-14 Silex), способного поражать не только подводные лодки, но и надводные корабли."
 SOV_battle_hull_light_4: "Большой противолодочный корабль проекта 1134-Б типа «Беркут-Б»"
 SOV_battle_hull_light_4_short: "Проект 1134Б «Беркут-Б»"
 SOV_battle_hull_light_4_desc: "Проекта 1134Б «Беркут-Б», был классом ракетных крейсеров (большой противолодочный боевой корабль в советской классификации), построенных в Советском Союзе для ВМФ СССР. НАТО причисляет этот класс к «крейсерам» в основном из-за противокорабельного ракетного комплекса «Метель» (SS-N-14 Silex), способного поражать не только подводные лодки, но и надводные корабли»."
 SOV_screen_hull_heavy_0: "Эскадренный миноносец проекта 30-бис типа «Смелый»"
 SOV_screen_hull_heavy_0_short: "Проект 30бис «Смелый»"
 SOV_screen_hull_heavy_0_desc: "Группы фрегатов, построенных для советского флота в 1950-х годах. Советское обозначение было «Сторожевой корабль» (эскортный корабль) проекта 42. Эти корабли были аналогичны эскортным эсминцам времен Второй мировой войны или немецким торпедным катерам типа «Эльбинг». Программа состояла всего из 8 кораблей, поскольку эти корабли были сочтены слишком дорогими для серийного производства, и вместо них был построен меньший и более дешевый фрегат типа «Рига». Были установлены радары и гидролокаторы."
 SOV_screen_hull_heavy_1: "Большой противолодочный корабль проекта 61"
 SOV_screen_hull_heavy_1_short: "Проект 61"
 SOV_screen_hull_heavy_1_desc: "Проект 61, представлял собой серию зенитных управляемых ракетных эсминцев, построенных для ВМФ СССР с 1960-х годов. По состоянию на 2020 год на вооружении ВМФ России не остается ни одного корабля, но три модифицированных корабля продолжают нести службу в ВМС Индии в качестве эсминцев класса Rajput."
 SOV_screen_hull_heavy_2: "Сторожевой корабль проекта 1135 типа «Буревестник»"
 SOV_screen_hull_heavy_2_short: "Проект 1135 «Буревестник»"
 SOV_screen_hull_heavy_2_desc: "Проект 1135 с кодовым названием «Буревестник» разрабатывался Северным ПКБ с 1964 по 1966 гт. и предусматривал создание большого противолодочного корабля, основным вооружением которого должны были стать ракето-торпеды 84-Р комплекса «Метель» (УРПК-4). Особенностью корабля являлось наличие, наряду с гидроакустической станцией «Титан-2», расположенной в носовом обтекателе, станции с буксируемой антенной «Вега». При этом из-за относительно небольшой дальности действия гидроакустических станций корабли этого проекта планировалось использовать парами: один поисковый, второй ударный."
 SOV_screen_hull_heavy_3: "Эскадренный миноносец проекта 956 типа «Сарыч»"
 SOV_screen_hull_heavy_3_short: "Проект 956 «Сарыч»"
 SOV_screen_hull_heavy_3_desc: "Эскадренные миноносцы проекта 956 строились на судостроительном заводе № 190 им. А. А. Жданова в период с 1976 по 1992 год включительно для Военно-Морского Флота СССР. Последние корабли серии достраивались уже для Военно-Морского Флота России. После распада СССР закладка новых и достройка нескольких уже заложенных кораблей проекта была прекращена из-за проблем с финансированием. Два корпуса в 1997—2000 годах были достроены по проекту 956-Э (в экспортном исполнении) по заказу Военно-морских сил Народной Освободительной Армии Китайской Народной Республики, ещё два корабля в 2000-х годах были построены на экспорт в КНР по модернизированному проекту 956-ЭМ."
 SOV_screen_hull_heavy_4: "Большой противолодочный корабль проекта 1155 типа «Фрегат-М»"
 SOV_screen_hull_heavy_4_short: "Проект 1155 «Фрегат-М»"
 SOV_screen_hull_heavy_4_desc: "Проект 1155 «Фрегат» и 11551 «Фрегат-М», представляет собой серию противолодочных эсминцев с управляемыми ракетами, построенных для ВМФ СССР. Внешне похожий на «Удалой», это была новая конфигурация, заменяющая SS-N-14 с противокорабельными ракетами SS-N-22 «Солнечный ожог» (Москит), спаренной 130-мм пушкой, противоторпедными ракетами УДАВ-1 и пушкой. /SAM CIWS системы. Противолодочная способность сохраняется за счет стрельбы ракетами СС-Н-15 из торпедных аппаратов»."
 SOV_screen_hull_medium_0: "Сторожевой корабль проекта 42 типа «Сокол»"
 SOV_screen_hull_medium_0_short: "Проект 42 «Сокол»"
 SOV_screen_hull_medium_0_desc: "«Сокол» был названием для группы фрегатов, построенных для советского флота в 1950-х годах. Советское обозначение было «Сторожевой корабль проекта 42». Эти корабли были аналогичны эскортным эсминцам времен Второй мировой войны или немецким торпедным катерам типа «Эльбинг». Программа состояла всего из 8 кораблей, поскольку эти корабли были сочтены слишком дорогими для серийного производства, и вместо них был построен меньший и более дешевый фрегат типа «Рига». Были установлены радары и гидролокаторы."
 SOV_screen_hull_medium_1: "Сторожевой корабль проекта 159 типа «СКР-1»"
 SOV_screen_hull_medium_1_short: "Проект 159 «СКР-1»"
 SOV_screen_hull_medium_1_desc: "Класс «Petya» был отчетным названием НАТО для класса легких фрегатов, спроектированных в 1950-х годах и построенных для ВМФ СССР в 1960-х годах. Советское обозначение - \"Сторожевой Корабль\" проекта 159. Назначением корабля была борьба с подводными лодками. Тактико-техническое задание на проектирование было окончено разработкой в 1955 году, работы были закончены в 1956 году. Общее расположение корабля отличалось исключительным рационализмом и продуманностью: например, жилые помещения были гораздо уютнее, чем на других кораблях."
 SOV_screen_hull_medium_2: "Сторожевой корабль проекта 1159 типа «Дельфин»"
 SOV_screen_hull_medium_2_short: "Проект 1159 «Дельфин»"
 SOV_screen_hull_medium_2_desc: "Противолодочные фрегаты, были известны в Советском Союзе как проект 1159. 14 были построены на Зеленодольской верфи в период с 1975 по 1988 год. Первоначально они предназначались для замены старых фрегатов класса «Рига», но вместо этого были выбраны в качестве проекта для экспорта в различные дружественные флоты."
 SOV_screen_hull_medium_3: "Сторожевой корабль проекта 11540 типа «Ястреб»"
 SOV_screen_hull_medium_3_short: "Проект 11540 «Ястреб»"
 SOV_screen_hull_medium_3_desc: "Проект 11540 «Ястреб», представляет собой серию больших фрегатов, построенных для ВМФ СССР и в настоящее время находящихся на вооружении ВМФ России. Для советского флота планировалось семь кораблей, но распад Советского Союза нарушил эти планы. Были построены два корабля, оба в настоящее время находятся на действующей службе Балтийского флота."
 SOV_screen_hull_medium_4: "Фрегат проекта 22350 типа «Адмирал Горшков»"
 SOV_screen_hull_medium_4_short: "Проект 22350 «Адмирал Горшков»"
 SOV_screen_hull_medium_4_desc: "«Адмирал Горшков», российское обозначение проекта 22350 для исходной и модернизированной версии, вооруженной 16 и 32 ячейками VLS соответственно, является новейшим классом фрегатов, строящихся на Северной верфи в Санкт-Петербурге для ВМФ России стоимостью 250 миллионов долларов. $. Проект 22350 разработан Северным ПКБ с использованием технологии малозаметности. Это первый крупный надводный боевой корабль, заложенный на верфях России после распада СССР."
 SOV_sub_hull_ww: "Подводная лодка проекта «Средняя»"
 SOV_sub_hull_ww_short: "Проект «Средняя»"
 SOV_sub_hull_ww_desc: "Подводные лодки класса «С» или «Средняя» входили в состав подводного флота ВМФ СССР во время Второй мировой войны. Неофициально по прозвищу Сталинец. Лодки этого класса были самыми удачными и одержали самые значимые победы среди всех советских подводных лодок. Всего они потопили 82 770 брт торговых судов и семь военных кораблей, что составляет около трети всего тоннажа, потопленного советскими подводными лодками во время войны."
 SOV_sub_hull_small_single_0: "Подводная лодка проекта 611"
 SOV_sub_hull_small_single_0_short: "Проект 611"
 SOV_sub_hull_small_single_0_desc: "Проект 611 ВМФ СССР был одной из первых советских послевоенных многоцелевых подводных лодок. Первые несколько лодок этого класса были оснащены спаренными 57-мм и спаренными 25-мм зенитными орудиями и не имели шноркелей, хотя орудия были сняты, а шноркели добавлены вскоре после ввода лодок в эксплуатацию."
 SOV_sub_hull_small_single_1: "Подводная лодка проекта 641"
 SOV_sub_hull_small_single_1_short: "Проект 641"
 SOV_sub_hull_small_single_1_desc: "Серия советских дизель-электрических подводных лодок (ДЭПЛ) — по классификации НАТО — Foxtrot. Было построено 75 кораблей, в том числе 17 на экспорт в военно-морские силы Польши, Индии, Ливии и Кубы. На базе пр. 641 создан пр. 641Б «Сом» с 4-тактными дизелями 2Д42М и другими отличиями."
 SOV_sub_hull_small_single_2: "Подводная лодка проекта 641Б типа «Сом»"
 SOV_sub_hull_small_single_2_short: "Проект 641Б «Сом»"
 SOV_sub_hull_small_single_2_desc: "Подводные лодки проекта 641Б предназначены для ведения боевых действий на океанских коммуникациях и у отдаленных военно-морских баз и пунктов базирования сил противника. В число задач лодок этих проектов входит уничтожение надводных кораблей и средств противника, ведение дальней оперативной разведки, прикрытие своих конвоев и осуществление активных минных постановок. Все лодки этого проекта выведены из боевого состава ВМФ. Одна из лодок этого проекта, лодка Б-396 «Новосибирский комсомолец», установлена в музейно-мемориальном комплексе истории военно-морского флота России в районе парка «Северное Тушино». Также, лодку данного проекта можно увидеть в Тольятти, в техническом музее «АвтоВАЗа."
 SOV_sub_hull_small_single_3: "Подводная лодка проекта 877 типа «Палтус»"
 SOV_sub_hull_small_single_3_short: "Проект 877 «Палтус»"
 SOV_sub_hull_small_single_3_desc: "Серия советских и российских подводных лодок, построенных в 1982—2000 годах. Эти лодки также часто называют «Варшавянка», так как первоначально предполагалось оснащение ими ВМС стран организации Варшавского договора."
 SOV_sub_hull_small_single_4: "Подводная лодка проекта 677 типа «Лада»"
 SOV_sub_hull_small_single_4_short: "Проект 677 «Лада»"
 SOV_sub_hull_small_single_4_desc: "Серия российских многоцелевых дизель-электрических подводных лодок (ДЭПЛ), разработанных в «ЦКБ Рубин». Являются развитием проекта 877 «Палтус». Лодки предназначаются для уничтожения субмарин, надводных кораблей и судов противника, защиты военно-морских баз, морского побережья и морских коммуникаций, ведения разведки. Низкий уровень шумности был достигнут благодаря выбору однокорпусного конструктивного типа, уменьшением габаритов корабля, применению всережимного главного гребного электродвигателя на постоянных магнитах, установкой виброактивного оборудования на виброизоляторы типа «ВИ» и внедрению технологии нанесения противогидролокационного покрытия нового поколения «Молния»."
 SOV_sub_hull_large_single_0: "Подводная лодка проекта 613"
 SOV_sub_hull_large_single_0_short: "Проект 613"
 SOV_sub_hull_large_single_0_desc: "Первоначальный проект был разработан в начале 1940-х годов как морское продолжение подводной лодки С-класса. В результате военного опыта и захвата немецких технологий в конце войны Советы издали в 1946 году новое требование к конструкции. Пересмотренный проект был разработан конструкторским бюро «Лазурит» в Горьком. Как и большинство обычных подводных лодок, спроектированных в 1946–1960 годах, на конструкцию сильно повлияла подводная лодка типа XXI»."
 SOV_sub_hull_large_single_1: "Подводная лодка проекта 627(А) типа «Кит»"
 SOV_sub_hull_large_single_1_short: "Проект 627(А) «Кит»"
 SOV_sub_hull_large_single_1_desc: "Первые советские атомные подводные лодки. Фактически, только головной корабль, К-3 «Ленинский комсомол», относился к проекту 627, а все последующие строились по изменённому проекту 627А. Проектировало эти корабли СКБ-143, позднее известное как СПМБМ «Малахит». В результате создания атомных подводных лодок проекта 627 СССР стал второй в мире державой, имеющей атомный подводный флот. Корабли проекта 627—627А имели выдающиеся для своего времени характеристики, но обладали и существенными недостатками, которые исправлялись в последующих проектах."
 SOV_sub_hull_large_single_2: "Подводная лодка проекта 671 типа «Ёрш»"
 SOV_sub_hull_large_single_2_short: "Проект 671 «Ёрш»"
 SOV_sub_hull_large_single_2_desc: "Проект 671 разработан в СКБ-143 (с 1974 года СПМБМ «Малахит») под руководством главного конструктора Г.Н. Чернышева. «Ёрш» атомная подводная лодка второго поколения, двухкорпусная, одновальная (что позволило уменьшить водоизмещении и шумность), разделенная на семь отсеков, была применена двух реакторная энергетическая установка. Проекта 671 крейсерская многоцелевая ракетно-торпедная АПЛ, предназначена для боевых действий, как с надводным, так и с подводным «потенциальным противником»."
 SOV_sub_hull_large_single_3: "Подводная лодка проекта 705(К) типа «Лира»"
 SOV_sub_hull_large_single_3_short: "Проект 705(К) «Лира»"
 SOV_sub_hull_large_single_3_desc: "Серия советских атомных подводных лодок, единственный в мире серийный проект АПЛ на реакторе с жидкометаллическим теплоносителем. Небольшие высокоскоростные одновальные лодки с титановым корпусом не имели аналогов по скорости и манёвренности и были предназначены для уничтожения подлодок противника."
 SOV_sub_hull_large_single_4: "Подводная лодка проекта 971 типа «Щука-Б»"
 SOV_sub_hull_large_single_4_short: "Проект 971 «Щука-Б»"
 SOV_sub_hull_large_single_4_desc: "«Серия советских многоцелевых атомных подводных лодок третьего поколения, спроектированных по тому же техническому заданию, что и «титановые» лодки проекта 945 «Барракуда», но со стальным корпусом. Построенные в 1983—2001 годах «Щуки-Б» пришли на смену лодкам проекта 671РТМК «Щука» и были основным типом многоцелевых атомных подводных лодок в российском флоте до 2020-х годов. С 2014 года четыре корабля проекта 971 «Щука-Б» проходят глубокую модернизацию на судоремонтном заводе «Звёздочка», что должно приблизить их характеристики к подлодкам 4-го поколения. Современный преемник проекта 971 «Щука-Б» — подводные лодки проекта 885 «Ясень»."
 SOV_sub_hull_large_double_0: "Подводная лодка проекта 658"
 SOV_sub_hull_large_double_0_short: "Проект 658"
 SOV_sub_hull_large_double_0_desc: "Советские атомные субмарины с баллистическими ракетами на борту, поступившие на вооружение в 1959 году. Прототипом при разработке этого проекта послужили первые советские атомные подлодки проекта 627. Основные отличия заключались в вооружении — помимо торпед, новые лодки были оснащены ракетными комплексами Д-2 с БРПЛ Р-13 (4К50, западное обозначение SS-N-4 Sark) и Д-4 с БРПЛ Р-21 (4К55, западное обозначение SS-N-5 Serb). Таким образом Советский Союз создал свою первую атомную подводную лодку, оснащённую баллистическими ракетами."
 SOV_sub_hull_large_double_1: "Подводная лодка проекта 667Б типа «Мурена»"
 SOV_sub_hull_large_double_1_short: "Проект 667Б «Мурена»"
 SOV_sub_hull_large_double_1_desc: "Серия советских РПКСН — атомных подводных лодок, оснащённых комплексом Д-9 с 12 баллистическими ракетами Р-29 на борту. Конструкция “Мурены” в целом повторяла конструкцию ее предшественницы – “Наваги”. Двухкорпусный корабль несколько увеличенной, по сравнению с проеком 667А, длины имел прочный корпус, разделенный на 10 водонепроницаемых отсеков. Впервые в мире для РПКСН проекта 667Б была создана система защиты ракет от несанкционированных действий, обеспечивающая осуществление пуска только после получения приказа Верховного командования."
 SOV_sub_hull_large_double_2: "Подводная лодка проекта 941 типа «Акула»"
 SOV_sub_hull_large_double_2_short: "Проект 941 «Акула»"
 SOV_sub_hull_large_double_2_desc: "Обладая водоизмещением 48 000 тонн, «Акулы» являются крупнейшими из когда-либо построенных подводных лодок, комфортно вмещая экипаж из 160(!) человек, могут находятся в под водой в течение нескольких месяцев подряд. Помимо ракетного вооружения, «Акула» имеет шесть торпедных аппаратов, предназначенных для управления ракетами РПК-2 (СС-Н-15) или торпедами Тип 53. Всего было построено шесть кораблей, по состоянию на 2023 год три корабля утилизированы, ещё три — ТК-17, ТК-20 и ТК-208 — выведены из состава флота и находятся в Северодвинске."
 SOV_sub_hull_large_double_3: "Подводная лодка проекта 955 типа «Борей»"
 SOV_sub_hull_large_double_3_short: "Проект 955 «Борей»"
 SOV_sub_hull_large_double_3_desc: "Серия российских стратегических атомных подводных лодок 4-го поколения, вооружённых 16 БРПЛ Р-30 «Булава». В период с 1996 по 2014 годы построено три подводных лодки проекта 955 «Борей». С 2012 года началось строительство АПЛ по модернизированному проекту 955А «Борей-А», у которого изменились как внешний облик, так и характеристики в целом. В 2020 году первый корабль обновлённого проекта «Борей-А» «Князь Владимир» принят в состав флота. Всего запланировано строительство 12 кораблей (3 «Борей» и 9 «Борей-А»), на декабрь 2022 года построено 7 кораблей (6 в составе флота), 3 строятся, 2 планируются к закладке."