l_english:
 Ayub_Constitution.1.d: "Первоначальный демократический эксперимент в Пакистане привел к нестабильности, коррупции и стагнации. Народ не получил необходимого образования или политической зрелости для демократии. Поэтому Пакистану необходимо сильное руководство, что и рекомендовала комиссия Шахабуддина в своем отчете. С президентской конституцией президент Айюб Хан может обеспечить Пакистану сильное, дисциплинированное руководство, которое необходимо для достижения его законного места в мире."
