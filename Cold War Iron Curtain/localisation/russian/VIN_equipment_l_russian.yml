 VIN_team_weapons_1: "СГ-43 (ККП), M1938 (ПМ)"
 VIN_team_weapons_1_short: "СГ-43, M1938"
 VIN_team_weapons_1_desc: "СГ-43 - средний пулемет, разработанный П.М. Горюновым для замены устаревшего по меркам Второй мировой войны ПМ М1910 МГ, который использовался Советским Союзом на протяжении большей части войны. Пулемет СГ-43 использовал откидную казенную часть ствола и имел снизу приспособление, позволявшее устанавливать его на треногах, колесных опорах или на транспортных средствах в качестве вспомогательного оружия. Ствол имеет воздушное охлаждение и очень плотный, что затрудняет его охлаждение при большинстве температур, но имеет хромированное отверстие, которое может их выдерживать. Это делает его ненадежным при более высоких температурах. Пистолет активно использовался в конце Второй мировой войны. Он был лицензирован во многих странах, в результате чего принимал участие в боевых действиях в Корейской и Вьетнамской войнах. Хотя само оружие также участвовало во многих гражданских войнах.\nМиномет M1938 - 120-мм советский миномет, активно использовавшийся советской армией во время Второй мировой войны. Его конструкция является почти копией французского 120-мм миномета Mortier Brandt de. Сам миномет очень легко нагружался и разгружался и мог быстро перемещаться, чтобы избежать встречного огня. Он использовал очень тяжелые 120-мм снаряды и имел высокую скорострельность, что делало его сильным оружием для поражения вражеских лагерей или пехоты в тяжелых укрытиях, таких как здания."
 VIN_team_weapons_2: "120-ПМ-43 (ПМ), КПВ (ККП)"
 VIN_team_weapons_2_short: "120-ПМ-43, КПВ"
 VIN_team_weapons_2_desc: "КПВ - крупнокалиберный пулемет, разработанный Семеном Владимировым для советских войск в 1944 году. В производство и на вооружение он поступил только в 1949 году. Сам пулемет был снят с вооружения пехоты в середине 1960-х годов из-за своего огромного веса и заменен на альтернативный HMG. Пушка известна своей исключительной дальностью стрельбы 3000 метров по горизонтали и 2000 по воздуху. Его тяжелый калибр мог также сделать его полезным в качестве легкого противоброневого оружия и устанавливался на разведывательные машины и БТР. Орудие использовалось во время войны в Корее и Вьетнаме, а благодаря тому, что оно передавалось из рук в руки, оно участвовало во многих войнах. Даже сегодня это орудие еще не снято с вооружения и участвовало в таких современных конфликтах, как войны в Персидском заливе и Ираке.\nМиномет 120-ПМ-43 - 120-мм советский казнозарядный миномет, разработанный в 1943 году и представлявший собой модифицированную версию M1938. Его конструкция была значительно упрощена, а вес и стоимость значительно снижены. Он использовался в конце Второй мировой войны и применялся советскими войсками в Афганистане, а также во Вьетнаме и в Персидском заливе."
 VIN_team_weapons_3: "НСВ (ККП), АСГ-17 (АГС)"
 VIN_team_weapons_3_short: "НСВ, АСГ-17"
 VIN_team_weapons_3_desc: "НСВ - тяжелый пулемет, разработанный Никитиным, Соколовым и Волковым в 1971 году. Хотя дальность стрельбы у него меньше, чем у КПВ, сам пулемет имеет ряд преимуществ, включая меньший вес, что позволяет использовать его в качестве пехотного БМП и большую универсальность. Также известно, что пушка более надежна и дешевле в производстве, что позволило в целом улучшить ее как пехотный HMG. Он принимал участие в Афганской и Вьетнамской войнах, а также в обеих иракских войнах и гражданской войне в Сирии.\n ASG-17 - тяжелый автоматический гранатомет, разработанный компанией KBP в 1967 году. Он предназначен для стрельбы из автомобиля или с укрепленной позиции. Стандартный барабан может вмещать до 29 гранат и выстреливать их все за 10 секунд. Он широко использовался Советским Союзом и продемонстрировал значительную надежность в Афганистане."
 VIN_team_weapons_4: "НСВТ (ККП), 2B14 (ПМ)"
 VIN_team_weapons_4_short: "НСВТ, 2B14"
 VIN_team_weapons_4_desc: "НСВТ - это улучшенный вариант НСВ ККП, который был усовершенствован его первоначальными конструкторами спустя некоторое время после выпуска первоначального оружия. В NSVT были внесены такие улучшения, как уменьшение веса за счет упрощения деталей и использования более современных материалов, что позволило оружию дольше поддерживать огонь. В это же время были разработаны различные приспособления для HMG. НСВТ известна тем, что устанавливалась на такие советские танки, как 64, 72 и 80.\nСовременный легкий миномет 2Б14 был разработан в 1983 году Нижегородским машиностроительным заводом для использования в воздушно-десантных войсках и легкой пехоте. Орудие стреляет из 82-мм современного миномета и имеет скорострельность около 24 выстрелов в минуту. Высокая скорострельность и эффективное материально-техническое обеспечение сделали его отличным оружием для советских войск и использовались не только по прямому назначению, но и в мотострелковых подразделениях. Успех миномета в значительной степени проявился во время Афганской войны."
 VIN_team_weapons_5: "Корд-6P50 (ККП), АСГ-30 (АГС)"
 VIN_team_weapons_5_short: "Корд-6P50, АСГ-30"
 VIN_team_weapons_5_desc: "Корд 6П50 - это российское огнестрельное оружие, разработанное Намитулиным, Обидиным, Богдановым и Жирохиным. Оружие имеет значительные изменения по сравнению с прежним НСВТ, включая поворотный затвор, заменяющий поворотный казенник, улучшенную газоотводную систему и переработанный дульный срез. Оружие имеет гораздо меньшую отдачу, что обеспечивает более высокую точность и большую продолжительность непрерывного огня, что делает его лучшим для подавления огня и огневой поддержки на дальних дистанциях. Кроме того, он значительно легче и обеспечивает большую кучность стрельбы. Он принимал участие во многих современных российских и российских конфликтах, включая российско-грузинскую войну и гражданскую войну в Сирии. Есть также сведения, что он принимал участие в войнах с США в Ираке и Афганистане, хотя и редко.\nАГС-30 - тяжелый гранатомет, разработанный в 1990 году КБП для Советского Союза, но принятый на вооружение только после распада в 1995 году Российской Федерации. Гранатомет имеет скорострельность 400 выстрелов в минуту и оснащен ударно-спусковым механизмом. Конструкция пусковой установки в значительной степени основана на АГС-17, она значительно легче, мобильнее, имеет большую дальность стрельбы и более точна. Пусковая установка завоевала авторитет благодаря своей способности поражать укрепленные позиции противника. Ее возможности были доказаны во время второй чеченской войны, где она показала себя как высокоэффективное оружие."
 VIN_ammo_explosives_1: "РГД-33 (ПТ Граната), FMJ (Боеприпасы)"
 VIN_ammo_explosives_1_short: "РГД-33, FMJ"
 VIN_ammo_explosives_1_desc: "Граната РГД-33 АП - ручная граната, разработанная Дьяконовым в 1933 году. Сама граната заряжена тротилом, а запал срабатывал в процессе броска и движения вперед после того, как граната была заряжена. Сама граната собиралась только перед боем для уменьшения вероятности несчастных случаев, при этом гильза, боеголовка и рукоятка хранились отдельно. Граната широко использовалась до, во время и после Второй мировой войны, а также в Корее и Вьетнаме.Пуля Full Metal Jacket была изобретена в 1882 году швейцарским полковником Эдуардом Рубиным. Однако за время, прошедшее с тех пор до Второй мировой войны, металлургия была усовершенствована, и поэтому в патроне FMJ для Второй мировой войны просто использовались более качественные материалы."
 VIN_ammo_explosives_2: "РКГ-3 (ПТ Граната), Ф1 (Граната), МОН Мины (Мины)"
 VIN_ammo_explosives_2_short: "РКГ-3, Ф1, МОН Мины"
 VIN_ammo_explosives_2_desc: "АТ-граната РКГ-3 - советская АТ-граната, разработанная в 1950 году как усовершенствование РПГ-40. Она принимала участие в Иракской и Йом-Кипурской войнах. По сравнению с предшественником, граната имела улучшенный запал и мощную начинку. Граната Ф1 АП - это граната совместной разработки АП/осколочная граната, в которой российские оружейники усовершенствовали существующую французскую гранату Ф1, установив современный запал и тротиловую начинку с более качественным набором осколочной металлической оболочки. Она принимала участие практически во всех российских боевых действиях, начиная со Второй мировой войны, когда она была разработана в 1941 году, и до настоящего времени. Мины МОН - это серия ранних мин, разработанных для Советского Союза различными конструкторами в период с 50-х по 60-е годы. Все мины МОН являются противопехотными и обычно используют осколочно-фугасные и тротиловые снаряды для выполнения задач по ограничению территории. Они видели практически все боевые действия Советского Союза в 50-х и 60-х годах."
 VIN_ammo_explosives_3: "Современная ПТ Аммуниция, ПТ Мины (Наземные мины)"
 VIN_ammo_explosives_3_short: "Современная ПТ Аммуниция, ПТ Мины"
 VIN_ammo_explosives_3_desc: "Боеприпасы АП существуют уже много лет, возникли они еще до Первой мировой войны и использовались в основном для пробивания военных кораблей. После Первой мировой войны, когда на поле боя появился танк, были созданы миниатюрные патроны. В конце концов, малые калибры AP были созданы как ответ на бронежилеты. Современные боеприпасы АП были созданы в 1965 году как ответ на увеличение количества тяжелобронированной пехоты и пехотного прикрытия. Мины ТМ - это серия советских противотанковых фугасных мин, первоначально разработанных и широко применявшихся примерно в 1941 году, однако их производство было прекращено из-за нехватки металла, приоритет которого был отдан созданию другого оружия. Однако, примерно в 1957 году, они вернулись, и разработка и производство мин ТМ были продолжены с использованием более современных взрывчатых веществ. Мины ТМ часто использовались практически везде, где происходили конфликты в советской сфере, но в полной мере их потенциал проявился во время советского вторжения в Афганистан."
 VIN_ammo_explosives_4: "РГО/РГН (Граната)"
 VIN_ammo_explosives_4_short: "РГО/РГН"
 VIN_ammo_explosives_4_desc: "РГО и РГН - это оборонительные и наступательные осколочные ручные гранаты соответственно. Они состоят из однослойного предварительно осколочного корпуса. Сам корпус состоит из двух зубчатых алюминиевых секций сверху и снизу. Сами гранаты немедленно взрываются при ударе, что затрудняет реакцию цели. Они были созданы в рамках проекта BAZALT во время советско-афганской войны, и их ударные взрывы облегчали поражение целей в скалистой местности.\nУтилитарные гранаты - это ручные гранаты, которые выполняют специализированные функции, такие как флэшбэнг, дымовые, зажигательные и т.д. Они могут быть использованы для оглушения врагов. Они могут быть использованы для оглушения врагов, маскировки позиций, а также для организации зон поражения."
 VIN_ammo_explosives_5: "Современные боеприпасы"
 VIN_ammo_explosives_5_short: "Современные боеприпасы"
 VIN_ammo_explosives_5_desc: "В современную эпоху существует огромный арсенал различных типов специализированных боеприпасов, которые могут быть использованы в конкретных ситуациях. Современные патроны AP гораздо лучше пробивают цели, чем старые, и могут развивать большую скорость. Современные сплавы позволяют стандартным боеприпасам наносить больший урон цели. Сгораемые пули или зажигательные патроны имеют особые ситуации, в которых они могут быть полезны. Кроме того, в современном бою дробовики можно улучшить с помощью патронов HE, патронов 000, флешетных пуль или зажигательных боеприпасов."
