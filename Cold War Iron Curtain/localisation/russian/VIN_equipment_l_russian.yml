l_english:
 VIN_infantry_equipment_0: "Мосин ко. 91/30"
 VIN_infantry_equipment_0_short: "Мосин"
 VIN_infantry_equipment_0_desc: "Мосин-Нагант - Русская винтовка с продольно-скользящим затвором, использовавшаяся в Российской империи и созданная на основе конструкции, импортированной из Франции. В 1889 году МОРИ (Министерство обороны Российской империи) приобрело у Франции винтовку Лебеля-1886 и попыталось усовершенствовать ее конструкцию. Министерство наняло различных русских ученых и инженеров под руководством капитана Сергея Мосина и Леона Нагана для усовершенствования конструкции, и после долгих испытаний и создания опытных образцов был создан Наган Мосина. В 91-м году 1891 года винтовка Мосина была запущена в производство. Винтовка имеет длительное время разборки, но отличается высокой точностью стрельбы. Она широко использовалась в Русско-японской войне, Первой мировой войне, гражданской войне в Российской империи, которая привела к образованию Советского Союза, Второй мировой войне и многочисленных мировых конфликтах."
 VIN_infantry_equipment_1: "Автомат Калашникова 1947"
 VIN_infantry_equipment_1_short: "AK-47"
 VIN_infantry_equipment_1_desc: "AK47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. На протяжении многих лет АК47 будет считаться одним из самых надежных и простых в обслуживании, обращении и изучении оружием в мире."
 VIN_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 VIN_infantry_equipment_2_short: "АКМ"
 VIN_infantry_equipment_2_desc: "АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия был значительно уменьшен на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ сразу и повсеместно стал использоваться во многих коммунистических странах и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
 VIN_infantry_equipment_3: "Автомат Калашникова 1974"
 VIN_infantry_equipment_3_short: "AK-74"
 VIN_infantry_equipment_3_desc: "АК74 - современный автомат, разработанный Михаилом Калашниковым для замены АКМ в 1974 году. Он использует патрон меньшего калибра и улучшенный хромированный ствол с 4 правосторонними канавками. Мушка и газоотводная колодка были переделаны таким образом, что в них появился канал, установленный под углом 90 градусов к оси ствола для уменьшения сдвига пули при удержании ствола. Кроме того, в его конструкцию входили различные приспособления, включая ложе с резиновыми накладками. Усовершенствования АК74 позволили солдатам переносить большее количество боеприпасов в полевых условиях и вести более интенсивный огонь с высокой точностью на средних дистанциях. Он получил дорогое применение во время конфликта в Афганистане, где ЦРУ заплатило моджахедам большую сумму денег за захваченный АК74."
 VIN_infantry_equipment_4: "Z111 STL-1A"
 VIN_infantry_equipment_4_short: "STL-1A"
 VIN_infantry_equipment_4_desc: "В 2015 году завод Z111 объявил о выпуске новой винтовки STL-1A. В основном это будет сделано за счет переделки и модернизации старых АКМ под новым названием, но они также будут производить совершенно новые винтовки STL-1A. Обновленная винтовка включала новые полимерные цевья, складной приклад, новую эргономичную пистолетную рукоятку и обновленный дульный тормоз, аналогичный тем, что установлены на АК-74. Заметным изменением стало то, что он также позволил использовать гранатометы М203, которые также производятся во Вьетнаме, заменив гранатометы ГП-25/ГП-34 на оригинальных АКМ. Однако винтовка по-прежнему использует боковое крепление типа «ласточкин хвост» для крепления прицелов. В целом винтовка очень напоминает АК-103."
 VIN_lt_equipment_1: "T-60"
 VIN_lt_equipment_1_short: "T-60"
 VIN_lt_equipment_1_desc: "Т60 был легким танком, созданным для замены Т-38 в роли разведчика. Он был разработан в 1941 году Николаем Астровым, и за 2 года его производства было выпущено 6300 штук. Это был танк с 2 экипажами, 6-цилиндровым двигателем, развивающий скорость до 44 км/ч, с 20-мм основным орудием. Он широко использовался во время Второй мировой войны."
 VIN_lt_equipment_2: "T-70"
 VIN_lt_equipment_2_short: "T-70"
 VIN_lt_equipment_2_desc: "Легкий танк Т-70 - это танк-разведчик времен Второй мировой войны, созданный для замены ПТ60. Николай Астров начал работы сразу после ПТ60 и закончил в 1942 году. За 2 года было выпущено 8300 единиц. Танк имел более мощную 45-мм пушку, оснащался 2 двигателями ГАЗ-202 и мог развивать скорость до 45 км/ч. Т-70 также имел номинально улучшенную оптику Он широко использовался во время Второй мировой войны."
 VIN_lt_equipment_3: "ПТ-76"
 VIN_lt_equipment_3_short: "ПТ-76"
 VIN_lt_equipment_3_desc: "ПТ-76 — это советский легкий плавающий танк, который широко экспортировался по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 году, и было произведено около 12 000 единиц. Экипаж состоит из 3 человек. Шестицилиндровый двигатель V6 позволяет разгонять машину до скорости в 44 км/ч и позволяет плавать со скоростью 10 км/ч. ПТ-76 до сих пор используется во многих странах благодаря своей знаменитой надежности и простоте обслуживания."
