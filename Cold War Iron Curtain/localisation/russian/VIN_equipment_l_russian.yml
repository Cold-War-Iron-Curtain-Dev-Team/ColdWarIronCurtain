 VIN_manpats_1: "Bom Ba Cang"
 VIN_manpats_1_short: "Bom Ba Cang"
 VIN_manpats_1_desc: "Bom Ba Cang, что в переводе означает \"Трехточечная бомба\" - это вьетнамское противотанковое оружие, изготовленное из остатков японских бомб."
 VIN_manpats_2: "Б40 РПГ (РПГ-2)"
 VIN_manpats_2_short: "Б40 РПГ"
 VIN_manpats_2_desc: "Б40 - вариант РПГ-2 местного производства сил ПАВН. Б-40 все еще находится на вооружении ПАВН сегодня"
 VIN_manpats_3: "Б-41 РПГ (РПГ-7)"
 VIN_manpats_3_short: "Б-41 РПГ"
 VIN_manpats_3_desc: "Б-41 это местный вариант РПГ-7. B-41 все еще состоит на вооружении ПАВН сегодня"
 VIN_manpats_4: "РПГ-29"
 VIN_manpats_4_short: "РПГ-29"
 VIN_manpats_4_desc: "РПГ-29 - перезаряжаемый противотанковый гранатомет, разработанный компанией \"Базальт\" в конце 1980-х годов. Он был разработан как современный, усовершенствованный вариант РПГ-7 и, в отличие от РПГ-18, является перезаряжаемым. Он стреляет ракетами на эффективную дальность около 600 метров и не ограничен по времени боеголовкой. Он способен пробивать броню гораздо лучше, чем РПГ-7, хотя и не полностью вытеснил РПГ-7 и РПГ-18 из-за более высокой стоимости. РПГ-29 также не имеет начального топливного заряда для защиты операторов в момент воспламенения ракеты, чтобы уменьшить вес и получить более ценное весовое значение, которое может быть использовано для большего количества ракетного топлива. Это означает, что он не так прост в использовании и требует определенного уровня защиты для пользователя, но делает его более эффективным. РПГ-29 использовался в войне в Ираке, гражданской войне в Сирии и войне в Ливане в 2006 году."
 VIN_manpats_5: "РПГ-32"
 VIN_manpats_5_short: "РПГ-32"
 VIN_manpats_5_desc: "РПГ-32 - это современное российское противотанковое оружие пехоты, разработанное компанией \"Базальт\" в 2005 году. Эффективная дальность стрельбы составляет около 350 м, максимальная дальность стрельбы - 700 м. Пусковая установка поставляется с 2 различными 72- или 105-мм боеголовками, термобарическими или HEAT. По бронепробиваемости она значительно превосходит всех своих предшественников. Из-за высокой стоимости пусковой установки она еще не поступила на вооружение российской армии, хотя несколько стран Ближнего Востока импортируют ее из России, в основном для использования в батальонах высшего эшелона своей армии. В настоящее время он используется в гражданской войне в Ираке и в гражданской войне в Йемене."
 VIN_hmg_1: "ДШКМ"
 VIN_hmg_1_short: "ДШКМ"
 VIN_hmg_1_desc: "Крупнокалиберный пулемет ДШК - это газоотводный пулемет ДШК, разработанный в 1938 году Василием Дегтяревым. Сам пулемет использовался во Второй мировой войне как ручной пулемет, а иногда и как малогабаритное противовоздушное оружие пехоты. На сегодняшний день выпущено более 1 миллиона единиц оружия, и благодаря своей дешевизне и простоте производства оно продолжает с заметным успехом производиться во многих слаборазвитых странах мира."
 VIN_manpads_1: "Стрела-2"
 VIN_manpads_1_short: "Стрела-2"
 VIN_manpads_1_desc: "Стрела-2\" - пехотная переносная зенитно-ракетная установка ПЗРК, являвшаяся основным оружием советских войск. Разработанная КБМ в 1964 году, она имела взрыватель ударно-детонационного действия без задержки, боевую часть с ОВ и пропорциональную навигационно-логическую систему наведения ракеты. Оно оказалось относительно недорогим в серийном производстве. Однако советское командование быстро заметило, что \"Стрела-2\" работает плохо и гораздо хуже того, что они ожидали от этого оружия. Она участвовала в советско-афганской войне, во многих коммунистических революциях, а также широко использовалась в ближневосточных конфликтах."
 VIN_manpads_2: "Стрела-3"
 VIN_manpads_2_short: "Стрела-3"
 VIN_manpads_2_desc: "Советский Союз быстро начал разработку \"Стрелы-3\" после того, как было отмечено, что \"Стрела-2\" неэффективна в бою. КБМ закончило разработку \"Стрелы-3\" в 1974 году, и она оказалась гораздо более эффективной. Вместо пропорциональной навигационной логики \"Стрела-3\" использовала инфракрасное самонаведение для поражения целей, находящихся далеко за пределами эффективной дальности \"Стрелы-2\". Кроме того, в самой ракете был установлен охладитель детекторного элемента, что позволило ей не так легко обманываться сигнальными ракетами и более точно находить истинные цели. Несмотря на это, добавки сделали ракету тяжелее и потребовали более дорогого топлива для двигательной установки, что сделало каждый снаряд более дорогим. Стрела-3\" использовалась в различных ближневосточных конфликтах, таких как иракско-иранская война, но не принимала участия в боевых действиях на территории СССР."
 VIN_manpads_3: "Игла"
 VIN_manpads_3_short: "Игла"
 VIN_manpads_3_desc: "Игла\" - это усовершенствованный ПЗРК, разработанный КБМ в 1981 году. Ракета \"Игла\" использует двухволновую инфракрасную систему наведения и оснащена системой детонации магнитного взрывателя с задержкой удара. Ракета также оснащена аэродинамическим шипом для снижения сопротивления и улучшения характеристик. Это оружие участвовало во многих общих конфликтах на Ближнем Востоке, а также в югославских войнах."
 VIN_manpads_4: "Верба"
 VIN_manpads_4_short: "Верба"
 VIN_manpads_4_desc: "Верба\" - это современный российский ПЗРК, созданный в 2011 году. В нем используется 3-канальная оптическая система наведения с исключительным потолком полета в 5 км и очень большой дальностью. Оружие также оснащено современной, более мощной боеголовкой. Само оружие очень трудно обмануть с помощью систем противодействия из-за 3 каналов, которыми обладает каждая ракета, что требует использования высококлассных средств противодействия. Верба\" используется армянами, русскими и сирийцами, но до сих пор она принимала участие в боевых действиях только в Сирии."
 VIN_specialist_1: "Винтовка Мосина с оптическим прицелом"
 VIN_specialist_1_short: "Винтовка Мосина с оптическим прицелом"
 VIN_specialist_1_desc: ""
 VIN_specialist_2: "Снайперская винтовка Драгунова (СД)"
 VIN_specialist_2_short: "Драгунов"
 VIN_specialist_2_desc: "Снайперская винтовка Драгунова - это самозарядная винтовка под патрон Мосина 7.62x54R. Винтовка Драгунова была разработана в 1963 году Евгением Драгуновым. Само оружие известно своей высокой точностью и исключительной надежностью и используется армиями всего мира и по сей день. Недорогие боеприпасы, простота обслуживания и высокая надежность обеспечили то, что это оружие остается на вооружении даже в самых бедных армиях мира и до сих пор не теряет своей актуальности в современном бою. Оно повидало бесчисленное количество боев в 40 с лишним войнах по всему миру."
 VIN_specialist_3: "ВСС (СД)"
 VIN_specialist_3_short: "ВСС"
 VIN_specialist_3_desc: "Снайперская винтовка ВСС - это специализированная снайперская винтовка, разработанная в 1980 году Сердюковым и Красниковым. Снайперская винтовка ВСС имеет встроенный ствол с подавлением и использует дозвуковые патроны или патроны ПД. Сама винтовка используется в основном подразделениями специального назначения, такими как \"Спецназ\", благодаря своим скрытным возможностям и встроенной системе подавления звука и вспышки. Винтовка принимала участие в боевых действиях во время афганской войны, хотя и очень редко за ее пределами."
