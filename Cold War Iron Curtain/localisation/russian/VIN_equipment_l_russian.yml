 VIN_jet_light_equipment_4_short: "JJ-7"
 VIN_jet_light_equipment_5: "Аэро Л-39ЗА Альбатрос"
 VIN_jet_light_equipment_5_short: "Л-39ЗА Альбатрос"
 VIN_recon_equipment_0: "Туполев Ту-2Р"
 VIN_recon_equipment_0_short: "Ту-2Р"
 VIN_jet_recon_equipment_0: "Микоян-Гуревич МиГ-15Рбис"
 VIN_jet_recon_equipment_0_short: "МиГ-15Рбис"
 VIN_jet_recon_equipment_1: "Микоян-Гуревич МиГ-21Р"
 VIN_jet_recon_equipment_1_short: "МиГ-21Р"
 VIN_heavy_fighter_equipment_1: "Петляков Пе-2"
 VIN_heavy_fighter_equipment_1_short: "Пе-2"
 VIN_heavy_fighter_equipment_1_desc: "Хотя Пе-2 поступил на вооружение в 1941 году как легкий бомбардировщик, во время войны он также успешно применялся в качестве тяжелого истребителя и ночного истребителя. Во время войны было построено 11 500 самолетов. Это был один из немногих типов, который использовался обеими сторонами конфликта, советские и финские Пе-2, вероятно, столкнулись друг с другом во время войны-продолжения (финский и карельский театр Восточного фронта). Его условное обозначение НАТО - Buck."
 VIN_heavy_fighter_equipment_2: "Петляков Пе-3"
 VIN_heavy_fighter_equipment_2_short: "Пе-3"
 VIN_heavy_fighter_equipment_2_desc: "Являясь дальнейшим развитием самолета Пе-2, Пе-3 был специализированным ночным истребителем, когда был представлен в 1941 году, в том же году, что и его собрат Пе-2. Его конструкция и применение были сопоставимы с теми, которые использовали немецкие Люфтваффе с Junkers Ju 88 и британские Королевские ВВС с De Havilland Mosquito. Пе-3 с отличием использовался во время битвы за Москву, и, несмотря на то, что единственный завод, отвечавший за создание этого типа, был эвакуирован в результате битвы, он использовался на протяжении всего конфликта, а более поздние производственные партии были направлены на создание разведывательных вариантов этого типа."
 VIN_heavy_fighter_equipment_3: "Лавочкин Ла-11"
 VIN_heavy_fighter_equipment_3_short: "Ла-11"
 VIN_heavy_fighter_equipment_3_desc: "Разработанный в 1947 году, после окончания Второй мировой войны, Ла-11 был дальнейшим развитием Ла-9 \"Фриц\" для создания дальнего истребителя сопровождения. Самолет был оснащен большими шинами, чтобы выдержать возросший вес, и удобствами для длительных полетов, такими как увеличенная обивка сиденья, подлокотники и писсуар. Кроме того, был установлен полный радионавигационный комплекс. Неудивительно, что боевые характеристики с полным запасом топлива ухудшились. Однако по мере того, как загрузка топливом приближалась к показателям Ла-9, улучшались и характеристики. Пилоты Ла-11 на советской, а затем и китайской службе служили в ПВО, сбивая американские \"Мустанги\" и штурмовики во время Корейской войны. Его условное обозначение по классификации НАТО - Fang."
 VIN_jet_interceptor_equipment_1: "Микоян-Гуревич МиГ-15П"
 VIN_jet_interceptor_equipment_1_short: "МиГ-15П"
 VIN_jet_interceptor_equipment_3: "Shenyang J-5A"
 VIN_jet_interceptor_equipment_3_short: "J-5A"
 VIN_jet_interceptor_equipment_5: "Shenyang J-6B"
 VIN_jet_interceptor_equipment_5_short: "J-6B"
 VIN_jet_interceptor_equipment_6: "Shenyang J-6III"
 VIN_jet_interceptor_equipment_6_short: "J-6III"
 VIN_jet_interceptor_equipment_9: "Сухой Су-27С"
 VIN_jet_interceptor_equipment_9_short: "Су-27С"
 VIN_jet_interceptor_equipment_9_desc: "Су-27С - это первоначальный серийный вариант советского истребителя Су-27. Самолет задумывался как прямой конкурент F-14 Tomcat и F-15 Eagle. После первого полета в 1977 году он поступил на вооружение в 1985 году. Его основной задачей была дальняя противовоздушная оборона против американских бомбардировщиков B-1 и B-52, а также дальнее сопровождение советских межконтинентальных стратегических бомбардировщиков. К настоящему времени было произведено 809 самолетов, которые до сих пор состоят на вооружении ВВС России. Среди других эксплуатантов - Индонезия, Украина, Вьетнам, Китай (обозначение J-11) и др. В обозримом будущем самолет останется в строю."
 VIN_stealth_fighter_equipment_1: "Сухой Су-27ПУ"
 VIN_stealth_fighter_equipment_1_short: "Су-27ПУ"
 VIN_stealth_fighter_equipment_1_desc: "Су-27 - советский двухмоторный сверхманевренный истребитель, разработанный компанией \"Сухой\". Он был задуман как прямой конкурент больших американских истребителей четвертого поколения, таких как Grumman F-14 Tomcat и F-15 Eagle, с дальностью полета 3 530 км (1 910 морских миль), тяжелыми авиационными боеприпасами, сложной авионикой и высокой маневренностью."
 VIN_CAS_equipment_1: "de Havilland DH.82 Tiger Moth"
 VIN_CAS_equipment_1_short: "DH.82 Tiger Moth"
 VIN_CAS_equipment_2: "Ильюшин Ил-2 Штурмовик"
 VIN_CAS_equipment_2_short: "Ил-2 Штурмовик"
 VIN_CAS_equipment_2_desc: "Ильюша, Горбун, Летающий танк, Летающий пехотинец - вот некоторые из многочисленных прозвищ, данных самолету Ил-2, фактически являвшемуся лицом советских ВВС времен Второй мировой войны. Созданный в 1941 году, Ил-2 был штурмовиком, который вместе со своим преемником Ил-10 стал самым производимым боевым самолетом в истории авиации, причем только Ил-2 было выпущено 36 183 единицы. Самолет Ил-2 сыграл решающую роль на Восточном фронте. Несмотря на неточность бомбовых и ракетных ударов, его общая прочность позволила ему чрезвычайно эффективно отражать все зенитные орудия, кроме крупных крупнокалиберных, благодаря чему он получил название \"летающий танк\". Известный как \"Штурмовик\", его более позднее название по классификации НАТО - \"Барк\"."
 VIN_CAS_equipment_3: "Ильюшин Ил-10"
 VIN_CAS_equipment_3_short: "Ил-10"
 VIN_CAS_equipment_3_desc: "Разработанный на основе Ил-2 \"Штурмовик\", Ил-10 был спроектирован с целью устранения многих недостатков Ил-2. Основной целью было увеличение скорости и маневренности на малых высотах, главным образом для уклонения от малокалиберной зенитной артиллерии, которая была главной угрозой для штурмовиков. Вступив в строй в январе 1945 года, Ил-10 принял участие в некоторых из последних боевых операций в Европе, а также во время короткого советского вмешательства в Тихоокеанскую войну. К моменту снятия Ил-10 с вооружения в 1956 году, ВВС сместили акцент с чисто САС и наземных штурмовиков на истребители-бомбардировщики. Его условное наименование в НАТО - \"Зверь\"."
 VIN_CAS_equipment_4: "Ильюшин Ил-16"
 VIN_CAS_equipment_4_short: "Ил-16"
 VIN_CAS_equipment_4_desc: "Ил-16 является окончательным вариантом штурмовика \"Штурмовик\". По сути, он представлял собой уменьшенную версию Ил-10, но был оснащен новым двигателем Микулина АМ-43НВ с расчетом на то, что он будет быстрее и маневреннее своего предшественника. Для испытаний было построено три самолета, но из-за непредвиденных проблем с двигателем, которые не удалось устранить, проект был отменен."
 VIN_jet_CAS_equipment_1: "Ильюшин Ил-10М"
 VIN_jet_CAS_equipment_1_desc: "Яковлев Як-23 \"Флора\" - советский штурмовик, представленный в 1949 году. Самолет являлся развитием реактивного истребителя Як-15. Як-23 в основном экспортировался в страны Варшавского договора, где он оставался на вооружении до конца 1950-х годов."
 VIN_jet_CAS_equipment_1_short: "Ил-10М"
 VIN_jet_CAS_equipment_2: "Микоян-Гуревич МиГ-17бис"
 VIN_jet_CAS_equipment_2_desc: "Переоборудование истребителя-бомбардировщика, оснащенного возможностью нести неуправляемые ракеты и бомбы."
 VIN_jet_CAS_equipment_2_short: "МиГ-17бис"
 VIN_jet_CAS_equipment_3: "Микоян-Гуревич МиГ-19С"
 VIN_jet_CAS_equipment_3_desc: "Истребитель-бомбардировщик с цельноповоротным хвостом. Оснащен навигационным приемником дальнего действия \"Свод\" и вооружен тремя 30-мм пушками НР-30. Под каждым крылом размещалась неуправляемая ракета ОРО-32К или бомба ФАБ-250, а с 1957 года модифицирована для перевозки четырех ракетных капсул."
 VIN_jet_CAS_equipment_3_short: "МиГ-19С"
 VIN_jet_CAS_equipment_4: "Сухой Су-7Б"
 VIN_jet_CAS_equipment_4_desc: "Бомбардировочный вариант Су-7 \"Фиттер-А\" впервые поднялся в воздух в марте 1959 года и поступил на вооружение в 1961 году. В дальнейшем он стал основным советским штурмовиком 1960-х годов. В 1957-1972 годах было построено более 1400 самолетов Су-7Б, многие из которых были поставлены на экспорт. Самолет был относительно популярен за рубежом, где он служил в 10 странах. Он активно использовался в ВВС Индии и Египта. Самолет по-прежнему ограниченно эксплуатируется в Северной Корее."
 VIN_jet_CAS_equipment_4_short: "Су-7Б"
 VIN_jet_CAS_equipment_5: "Сухой Су-22"
 VIN_jet_CAS_equipment_5_short: "Су-22"
 VIN_jet_CAS_equipment_5_desc: "Сухой Су-17 \"Фиттер-С\" был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских государств и Южной Америки. Су-17 улучшил практически все аспекты своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено 2867 самолетов, которые использовались в 30 странах, в 6 из которых они используются и сегодня."
 VIN_jet_CAS_equipment_6: "Сухой Су-22M4"
 VIN_jet_CAS_equipment_6_short: "Су-22M4"
 VIN_jet_CAS_equipment_6_desc: "Сухой Су-17 \"Фиттер-С\" был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских государств и Южной Америки. Су-17 улучшил практически все аспекты своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено 2867 самолетов, которые использовались в 30 странах, в 6 из которых они используются и сегодня."
 VIN_jet_CAS_equipment_7: "Сухой Су-22M4K"
 VIN_jet_CAS_equipment_7_short: "Су-22M4K"
 VIN_jet_CAS_equipment_7_desc: "Сухой Су-17 \"Фиттер-С\" был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских государств и Южной Америки. Су-17 улучшил практически все аспекты своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено 2867 самолетов, которые использовались в 30 странах, в 6 из которых они используются и сегодня."
 VIN_nav_bomber_equipment_1: "Ильюшин Ил-4T"
 VIN_nav_bomber_equipment_1_short: "Ил-4T"
 VIN_nav_bomber_equipment_1_desc: "Первоначально известный как DB-3F, Ил-4 был способным средним бомбардировщиком с дальностью полета, необходимой для выполнения даже стратегических бомбардировочных миссий. Модифицированная версия ДБ-3 отличалась новыми двигателями и усиленной спинной турелью (7,62-мм пулемет ШКАС был заменен на 12,7-мм пулемет УБТ). Некоторые серии имели деревянные внешние крылья и передние фюзеляжи для экономии металла, и на протяжении всего производства двигатели и топливные баки модернизировались для улучшения характеристик при сохранении прежней дальности полета. Однако, из-за дополнительного веса, двигатели оказались недостаточно мощными, и поэтому самолет был медленнее своего непосредственного предшественника. Его условное наименование по классификации НАТО - Bob"
 VIN_nav_bomber_equipment_2: "Туполев Ту-2T"
 VIN_nav_bomber_equipment_2_short: "Ту-2T"
 VIN_nav_bomber_equipment_2_desc: "Ту-2Т (опытный вариант АНТ-62Т) был вариантом торпедоносца-бомбардировщика Ту-2, разработанным на основе варианта Ту-2Д. Решение использовать эту платформу для этой роли, вероятно, связано с благосклонностью экипажей к Ту-2, несмотря на то, что он был вторым по значимости бомбардировщиком советских ВВС во время Второй мировой войны (первым был Пе-2). Этот вариант будет служить у летчиков советской морской авиации на сумеречных этапах Второй мировой войны, а также в течение большей части послевоенного периода. Как и его родственник из ВВС, его условное обозначение в НАТО - \"летучая мышь\"."
 VIN_nav_bomber_equipment_3: "Ильюшин Ил-6"
 VIN_nav_bomber_equipment_3_short: "Ил-6"
 VIN_nav_bomber_equipment_3_desc: "Ил-6 является дальнейшим развитием дальнего бомбардировщика-торпедоносца Ил-4 \"Боб\". Изначально предназначенный для замены Ил-4, Ил-6 был оснащен дизельными двигателями, экономящими топливо, с гораздо большей дальностью полета. Он должен был иметь оборонительное вооружение из пяти 20-мм пушек. Однако летные испытания показали, что самолет плохо управляем на больших весах и малых скоростях, что затрудняет посадку. Кроме того, двигатели не могли запускаться при низких температурах и медленно реагировали на движение дроссельной заслонки. Несмотря на различные попытки усовершенствования, дальнейшие разработки были прекращены к 1944 году."
 VIN_nav_bomber_equipment_4: "Бериев Бе-6"
 VIN_nav_bomber_equipment_4_short: "Бе-6"
 VIN_nav_bomber_equipment_4_desc: "Бе-6 - летающая лодка производства КБ Бериева, впервые поднявшаяся в воздух в 1949 году. Он был способен выполнять широкий спектр задач. В дополнение к своей основной роли морского патруля и морской разведки, Бе-6 также использовался в патрулировании прибрежных районов и линий снабжения, в минных постановках, в качестве торпедоносца, среднего бомбардировщика и транспортного самолета. Его отчетное название USAF/NATO - Type 34, а кодовое название НАТО - Madge."
 VIN_nav_bomber_equipment_5: "Бериев Бе-10"
 VIN_nav_bomber_equipment_5_short: "Бе-10"
 VIN_nav_bomber_equipment_5_desc: "Бе-10, также известный как \"Изделие М\", был летающей лодкой с турбореактивным двигателем, разработанной Советским Союзом в 1956 году. Разработанный как патрульный бомбардировщик, Бе-10 был печально известен своей сложностью в управлении и страдал от усталости металла из-за напряжения планера во время высокоскоростных взлетов и посадок, а также из-за коррозии. Поэтому этот тип был быстро заменен на более поздний Бе-12 Mail. Известный на Западе как Mallow, модифицированный гражданский подвариант, M-10 был известен тем, что в 1961 году Международная федерация воздушного спорта (Fédération aéronautique internationale) установила 12 мировых рекордов."
 VIN_nav_bomber_equipment_6: "Бериев Бе-12Н Чайка"
 VIN_nav_bomber_equipment_6_short: "Бе-12Н Чайка"
 VIN_nav_bomber_equipment_6_desc: "Бе-12 был разработан в 1960 году как преемник и замена Бе-6 Madge и Бе-10 Mallow, и разрабатывался как противолодочный и морской патрульный самолет. В отличие от своего непосредственного предшественника с турбореактивным двигателем, Be-12 был турбовинтовым самолетом, а также имел убирающееся шасси, что придавало самолету возможность амфибийной посадки. Модернизированный вариант N был оснащен новыми датчиками, авионикой, поисково-атакующей системой \"Нарцисс\" и датчиком обнаружения магнитных аномалий (MAD). Известный на местном уровне как \"Чайка\", что означает \"чайка\", его отчетное название НАТО - Mail."
 VIN_nav_bomber_equipment_7: "Туполев Ту-142"
 VIN_nav_bomber_equipment_7_short: "Ту-142"
 VIN_nav_bomber_equipment_7_desc: "Ту-142 - советский/российский самолет морской разведки и противолодочной борьбы (ПЛО), созданный на базе турбовинтового стратегического бомбардировщика Ту-95. Специализированный вариант самолета связи, получивший обозначение Ту-142МР, предназначался для обеспечения дальней связи с советскими подводными лодками с баллистическими ракетами. Ту-142 был разработан в ОКБ Туполева и производился Куйбышевским авиационным и Таганрогским машиностроительным заводами с 1968 по 1994 год. Ту-142 ранее эксплуатировался в ВМФ СССР и ВВС Украины, а в настоящее время состоит на вооружении ВМФ России."
 VIN_nav_bomber_equipment_8: "Bryza M28B"
 VIN_nav_bomber_equipment_8_short: "Bryza M28B"
 VIN_tac_bomber_equipment_0: "Ильюшин ДБ-3"
 VIN_tac_bomber_equipment_0_short: "ДБ-3"
 VIN_tac_bomber_equipment_0_desc: "ДБ-3 - двухмоторный низкоплан-бомбардировщик, поступивший на вооружение советских ВВС в 1936 году. Несмотря на то, что карьера в советских вооруженных силах была в основном спокойной, этот тип служил в Китае, в составе ВВС националистического Китая во время Второй китайско-японской войны. Он также стал первым советским бомбардировщиком, совершившим налет на столицу Германии Берлин в первые месяцы Восточного фронта Второй мировой войны. Обозначение DB является сокращением от \"Дальний бомбардировщик\", что означает дальний бомбардировщик."
 VIN_tac_bomber_equipment_1: "Туполев СБ-2М"
 VIN_tac_bomber_equipment_1_short: "СБ-2М"
 VIN_tac_bomber_equipment_1_desc: "СБ (в разработке известный как ЦАГИ-40, а в ОКБ Туполева - как АНТ-40) - скоростной двухмоторный трехместный моноплан-бомбардировщик, представленный в конце 1936 года. Несмотря на передовую для своего времени конструкцию, СБ (сокращение от Скоростной Бомбардировщик или скоростной бомбардировщик), как говорят, был недостаточно доработан, что вызывало недовольство пилотов и членов экипажей бомбардировщиков, обслуживающего персонала и даже самого Иосифа Сталина (он, как говорят, сказал о нем: \"В авиации мелочей не бывает\"). Несмотря на это, он стал первым современным реактивным самолетом, серийно выпускавшимся в Советском Союзе, и, вероятно, самым грозным бомбардировщиком середины 1930-х годов. Несмотря на устаревание в 1941 году, СБ стал основным бомбардировщиком советских ВВС к началу Второй мировой войны."
 VIN_tac_bomber_equipment_2: "Туполев Ту-2"
 VIN_tac_bomber_equipment_2_short: "Ту-2"
 VIN_tac_bomber_equipment_2_desc: "Ту-2 - двухмоторный скоростной дневной бомбардировщик, разработанный в 1941 году. Он был разработан в качестве советского ответа на средний бомбардировщик Юнкерса Ju-88, с учетом требований к скоростному бомбардировщику или пикирующему бомбардировщику, с большим внутренним бомбовым грузом и скоростью, аналогичной скорости одноместного истребителя. Он достаточно хорошо справился с поставленной задачей, и появились варианты торпедоносца, разведчика и тяжелого истребителя, сыгравшие ключевую роль в последних наступлениях советских войск во Второй мировой войне. Послевоенное название самолета по классификации НАТО - Bat."
 VIN_tac_bomber_equipment_3: "Туполев Ту-8"
 VIN_tac_bomber_equipment_3_short: "Ту-8"
 VIN_tac_bomber_equipment_3_desc: "Ту-8 является модернизированным вариантом среднего бомбардировщика Ту-2Д \"Летучая мышь\". Впервые поднявшийся в воздух в 1947 году, Ту-8 был разработан для увеличения дальности полета. 7,62-мм пушки в различных люках на фюзеляже были заменены на 20-мм пушки, а планер был усилен для увеличения бомбовой нагрузки. Однако самолет оказался неустойчивым, конструктивно несостоятельным, а его генераторы были недостаточно мощными, чтобы полностью обеспечить энергией орудийные башни. С появлением реактивных бомбардировщиков, таких как Ту-16, советские военные планировщики решили, что просто не стоит тратить необходимые ресурсы на устранение многочисленных проблем, и проект был отменен."
 VIN_jet_tac_bomber_equipment_2: "Ильюшин Ил-28"
 VIN_jet_tac_bomber_equipment_2_short: "Ил-28"
 VIN_jet_tac_bomber_equipment_2_desc: "Ил-28 - турбореактивный средний бомбардировщик, разработанный сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, запущенный в крупносерийное производство, Ил-28, представленный в 1950 году, участвовал во многих крупных конфликтах холодной войны, от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. Даже после снятия с вооружения СССР к 1980-м годам, многие самолеты этого типа продолжают служить и по сей день. Отчетное название ВВС США и Министерства обороны - Тип 27, кодовое название НАТО - Beagle."
 VIN_strat_bomber_equipment_1: "Петляков Пе-8"
 VIN_strat_bomber_equipment_1_short: "Пе-8"
 VIN_strat_bomber_equipment_1_desc: "Советский тяжелый бомбардировщик, разработанный до Второй мировой войны, Пе-8 (первоначально ТБ-7, название изменено в честь Владимира Петлякова после его смерти в 1942 году) был единственным четырехмоторным бомбардировщиком, разработанным во время войны. Выпущенный в ограниченном количестве, он использовался для бомбардировки Берлина в августе 1941 года. Он также использовался для так называемых \"моральных рейдов\", призванных поднять дух советского народа путем выявления уязвимых мест Оси. Однако его основной задачей было нанесение ночных ударов по немецким аэродромам, железнодорожным станциям и другим объектам в тылу. Поскольку эти самолеты поднимали боевой дух, немецкие люфтваффе часто выбирали их в качестве мишени, и большое их количество было уничтожено в ходе Великой Отечественной войны. После войны они служили в основном как транспортники до конца 1950-х годов."
 VIN_strat_bomber_equipment_2: "Ильюшин Ил-4"
 VIN_strat_bomber_equipment_2_short: "Ил-4"
 VIN_strat_bomber_equipment_2_desc: "Хотя Ил-4 был только средним бомбардировщиком, он обладал достаточной дальностью полета, чтобы использоваться в стратегических миссиях. Использование бомбардировщиков в этой роли не было приоритетным для VVS, но, тем не менее, Ил-4 использовался в нескольких дальних бомбардировочных рейдах на Берлин в 1941 году. Большинство из них использовались в миссиях с гораздо меньшей дальностью, часто добавляя еще 1000 кг (2204 фунта) бомб под крыльями в дополнение к внутренним 2500 кг (5512 фунтов)."
 VIN_strat_bomber_equipment_3: "Туполев Ту-4"
 VIN_strat_bomber_equipment_3_short: "Ту-4"
 VIN_strat_bomber_equipment_3_desc: "Ту-4 - это реинжиниринговая конструкция на базе американского B-29 Superfortress, разработанная Иосифом Сталиным для того, чтобы иметь стратегический бомбардировщик с возможностями, аналогичными американскому бомбардировщику, выигравшему войну. Несмотря на отказ США предоставить B-29 по ленд-лизу, четыре B-29 упали на советской территории, и этого было достаточно, чтобы начать процесс реинжиниринга. Несмотря на многочисленные трудности (приобретение деталей, эквивалентных или превосходящих детали американской разработки, переход с имперской на метрическую систему и т.д.), первый полет Ту-4 и его вступление в строй стали достаточным поводом для паники США и Великобритании, первой из многих во время холодной войны. Однако срок его службы был недолгим, и к середине 1960-х годов он был заменен реактивными бомбардировщиками. Его условное наименование в НАТО - Bull."
 VIN_jet_strat_bomber_equipment_1: "Туполев Ту-16 Барсук"
 VIN_jet_strat_bomber_equipment_1_short: "Ту-16 Барсук"
 VIN_jet_strat_bomber_equipment_1_desc: "Ту-16 - двухмоторный стратегический бомбардировщик, разработанный в 1952 году и ставший одним из первых стратегических бомбардировщиков с реактивным двигателем, поступивших на вооружение советских ВВС. Он имел стреловидную конфигурацию крыла и оснащался двумя турбореактивными двигателями Микулина АМ-3 в корневых частях крыла. Он мог нести до 9000 кг (20 000 фунтов) боеприпасов, включая ядерное оружие и ФАБ-9000 - бомбу весом 9000 кг, по мощности аналогичную британской бомбе \"Гранд Слэм\". Известный на Западе как \"Барсук\", этот тип служил на протяжении всей холодной войны и был снят с вооружения в 1993 году. Китайский вариант H-6, построенный по лицензии, остается в строю в качестве передового стратегического бомбардировщика ВВС НОАК."
