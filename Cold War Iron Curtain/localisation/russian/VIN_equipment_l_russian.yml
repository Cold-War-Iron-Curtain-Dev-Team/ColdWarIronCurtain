 VIN_fighter_equipment_0: "ПВО Вьетнамской народной армии - ВВС"
 VIN_fighter_equipment_0_short: "VPAF"
 VIN_fighter_equipment_0_desc: "ПВО Вьетнамской народной армии - ВВС, обычно называемые Вьетнамскими народными военно-воздушными силами (VPAF) или Вьетнамскими / вьетнамскими военно-воздушными силами (VNAF), являются подразделением воздушной войны Вьетнама. Он является преемником бывших ВВС Северного Вьетнама и поглотил ВВС Республики Вьетнам после воссоединения Вьетнама в 1975 году и является одним из трех основных родов Вьетнамской народной армии, находящейся под управлением Министерства национальной обороны. . Основная задача VPAF - защита воздушного пространства Вьетнама и обеспечение воздушного прикрытия операций Народной армии Вьетнама."
 VIN_fighter_equipment_1: "Яковлев Як-3"
 VIN_fighter_equipment_1_short: "Як-3"
 VIN_fighter_equipment_1_desc: "Яковлев Як-3 — одномоторный одноместный советский истребитель времен Второй мировой войны. Надежный и простой в обслуживании, он очень понравился как пилотам, так и наземному персоналу. Один из самых маленьких и легких боевых истребителей, использовавшихся во время войны, его высокая удельная мощность давала ему отличные характеристики, и он оказался грозным воздушным истребителем."
 VIN_fighter_equipment_2: "Лавочкин Ла-7"
 VIN_fighter_equipment_2_short: "Ла-7"
 VIN_fighter_equipment_2_desc: "Лавочкин Ла-7 — поршневой одноместный советский истребитель, разработанный во время Великой Отечественной войны в ОКБ Лавочкина. Это было развитие и усовершенствование Лавочкина Ла-5, и последнее в семействе самолетов, которое началось с ЛаГГ-1 в 1938 году."
 VIN_fighter_equipment_3: "Лавочкин Ла-9"
 VIN_fighter_equipment_3_short: "Ла-9"
 VIN_fighter_equipment_3_desc: "Ла-9 представляет собой дальнейшее развитие прототипа Лавочкина Ла-126. Первый прототип, получивший обозначение Ла-130, был закончен в 1946 году. Сходство со знаменитым Лавочкиным Ла-7 было лишь внешним — новый истребитель имел цельнометаллическую конструкцию и ламинарное крыло. Уменьшение веса за счет отказа от дерева в планере позволило значительно увеличить запас топлива и четырехпушечное вооружение. Учебные бои показали, что Ла-130 не уступал Ла-7, но уступал яковлевскому Як-3 в горизонтальных плоскостях. Новый истребитель, получивший официальное обозначение Ла-9, был запущен в производство в августе 1946 года. Всего к концу производства в 1948 году было построено 1559 самолетов."
 VIN_jet_multirole_equipment_2: "Микоян-Гуревич МиГ-15"
 VIN_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 \"Фагот\" Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления в Корейской войне, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые до сих пор остаются на вооружении ВВС Северной Кореи."
 VIN_jet_multirole_equipment_2_short: "МиГ-15"
 VIN_jet_multirole_equipment_3: "Микоян-Гуревич МиГ-17"
 VIN_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 \"Фагот\". Более 10 000 МиГ-17 \"Фреско\" было произведено с 1952 года. МиГ-17 был построен по лицензии в ВВС НОАК как Shenyang J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabres над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе ВВС НОАК и ВВС НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял более современным сверхзвуковым американским истребителям Phantom II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно эксплуатируется в некоторых африканских странах и Северной Корее."
 VIN_jet_multirole_equipment_3_short: "МиГ-17"
 VIN_jet_multirole_equipment_4: "Микоян-Гуревич МиГ-19"
 VIN_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в ровном полете. Сравнимым американским истребителем \"Century Series\" был North American F-100 Super Sabre, хотя МиГ-19 в основном сражался с более современными McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 VIN_jet_multirole_equipment_4_short: "МиГ-19"
 VIN_jet_multirole_equipment_5: "Микоян-Гуревич МиГ-21Ф-13"
 VIN_jet_multirole_equipment_5_desc: "МиГ-21 Fishbed считается одним из самых ранних советских истребителей третьего поколения, оснащенным ракетами дальнего радиуса действия и импульсным радаром. МиГ-21 - самый производимый сверхзвуковой самолет в истории, особенно большое количество было построено в Китае и Индии по лицензии. Всего было построено более 11 000 самолетов, которые служат в более чем 60 странах на 5 континентах. За время своей службы МиГ-21 совершил 240 воздушных убийств. МиГ-21 участвовал во многих конфликтах, включая Вьетнам (где он добился огромных успехов), индийско-пакистанскую войну 1971 года, ирано-иракскую войну и множество более мелких конфликтов. Он остается в строю уже более 6 десятилетий."
 VIN_jet_multirole_equipment_5_short: "МиГ-21Ф-13"
 VIN_jet_multirole_equipment_6: "Микоян-Гуревич МиГ-21ПФ"
 VIN_jet_multirole_equipment_6_desc: "Серийный вариант всепогодного перехватчика. Они оснащались турбореактивными двигателями R11F2-300 и, начиная с седьмой серийной партии, оснащались радаром РП-21 (на первых шести партиях использовался более старый радар ЦД-30Т (он же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую АУ РС-2УС (она же К-5МС) в дополнение к К-13 с ИК-целью."
 VIN_jet_multirole_equipment_6_short: "МиГ-21ПФ"
 VIN_jet_multirole_equipment_7: "Микоян-Гуревич МиГ-21бис"
 VIN_jet_multirole_equipment_7_desc: "MiG-21бис"
 VIN_jet_multirole_equipment_7_short: "Окончательное развитие МиГ-21, оснащен турбореактивным двигателем Туманского Р25-300 и множеством других усовершенствований по сравнению с предыдущими типами. МиГ-21бис для советских войск ПВО оснащались системой ГСИ \"Лазурь\", а для советских ВВС - системой ИЛС \"Полет\"."
 VIN_jet_multirole_equipment_8: "Микоян-Гуревич МиГ-23МЛ"
 VIN_jet_multirole_equipment_8_desc: "Ранние варианты \"Флоггера\" имели ряд конструктивных недостатков, включая прочность и надежность планера, работу двигателя, маневренность и радиолокационные характеристики. Была проведена значительная переделка планера, в результате которой появился МиГ-23МЛ."
 VIN_jet_multirole_equipment_8_short: "МиГ-23МЛ"
 VIN_jet_multirole_equipment_9: "Микоян-Гуревич МиГ-23МЛД"
 VIN_jet_multirole_equipment_9_desc: "МиГ-23МЛД был окончательным вариантом истребителя МиГ-23. Основным направлением модернизации было улучшение маневренности, особенно на больших углах атаки, что было признано главным недостатком МиГ-23М/МЛ. Стрела Пито была оснащена вихревыми генераторами, а зазубренные корни передней кромки крыла были \"распилены\", чтобы также служить вихревыми генераторами. Система управления полетом включала синтетическое устройство \"стик-стоп\"/ограничитель сигналов SOS-3-4."
 VIN_jet_multirole_equipment_9_short: "МиГ-23МЛД"
 VIN_mr_stealth_fighter_equipment_1: "Сухой Су-30МК2В"
 VIN_mr_stealth_fighter_equipment_1_short: "Су-30МК2В "
 VIN_mr_stealth_fighter_equipment_1_desc: "Сухой Су-30 представляет собой сильно модернизированную конструкцию Су-27. Модернизация включает в себя обновленный набор датчиков, обеспечивающий многоцелевые возможности, и полностью переработанный планер. Кабина пилота также была модернизирована, включая 2 многофункциональных дисплея (MFD) и новый HUD."
 VIN_jet_light_equipment_1: "Яковлев Як-18"
