l_russian:
 #Focusses 
 EGY_Nationalize_Suez_Canal: "Национализировать Суэцкий канал"
 Launch_Coup_SAU_desc: "Для §YГарантия успеха§! нашего §CВлияние§! на Саудовскую Аравию должно быть не менее §Y75%§!"
 Launch_Coup_JOR_desc: "Для §YГарантия успеха§! нашего §CВлияние§! на Иорданию должно быть не менее §Y75%§!"
 #Economy 
 UAR_Economic_Affairs: "Экономические вопросы"
 UAR_Economic_Affairs_desc: "Экономика Египта значительно улучшилась с момента основания республики, мы должны продолжать нашу социалистическую политику и инвестировать наше новое богатство обратно в экономику."
 UAR_Agricultural_Modernization: "Модернизация сельского хозяйства"
 UAR_Agricultural_Modernization_desc: "Наши недавние земельные реформы оказались весьма успешными и значительно увеличили объемы сельскохозяйственного производства. Однако наши фермеры по-прежнему используют орудия труда, считающиеся устаревшими во всём мире. Если мы вложим средства в обновление инфраструктуры и сельскохозяйственного оборудования, это может привести наш и без того бурно развивающийся сельскохозяйственный сектор к новым высотам"
 UAR_Establish_El_Nasr_Automotive_Manufacturing_Company: "Создать компанию El Nasr Automotive Manufacturing Company"
 UAR_Establish_El_Nasr_Automotive_Manufacturing_Company_desc: "Автомобили всегда считались роскошью, недоступной для среднего египтянина, но с развитием нашей инфраструктуры в городах и по всей стране автомобили становятся все более важными для повседневной жизни и экономической деятельности. Мы должны создать новую государственную компанию по производству автомобилей в Египте, чтобы удовлетворить растущий спрос"
 UAR_Helwan_Steelworks: "Хелуанский металлургический завод"
 UAR_Helwan_Steelworks_desc: "Хелуан - это город в районе Большого Каира, который практически не развивается и не модернизируется. Мы должны превратить этот район в промышленный центр, инвестируя в сталелитейные и другие металлургические заводы в городе, создавая рабочие места и обеспечивая поставки столь необходимой стали и других материалов."
 UAR_Expand_the_Middle_Class: "Расширить средний класс"
 UAR_Expand_the_Middle_Class_desc: "Средний класс является крупнейшим потребителем в любой экономике, но, к сожалению, в нашей стране до сих пор нет сильного среднего класса. Инвестируя в создание новых секторов, ориентированных на сферу услуг и потребителей, мы сможем создать высокооплачиваемые рабочие места и тем самым сформировать более динамичную экономику."
 UAR_Economic_Growth: "Экономический рост"
 UAR_Economic_Growth_desc: "Экономика никогда не была лучше, благодаря проницательной политике президента Насера и правительства мы наблюдаем беспрецедентный экономический бум."
 UAR_Ensure_University_Acces: "Обеспечение доступа к высшему образованию"
 UAR_Ensure_University_Acces_desc: "Для того чтобы Египет процветал, нам нужны самые лучшие и талантливые люди, которых может предложить наш народ, и будет большой потерей, если яркие личности останутся незамеченными из-за своей нищеты. Гарантируя всеобщий доступ к высшему образованию, мы можем гарантировать, что каждый, независимо от класса, будет иметь возможность процветать, а гении нашей страны получат признание."
 UAR_Industrializaiton_Inititiative: "Инициатива по индустриализации"
 UAR_Industrializaiton_Inititiative_desc: "Египетская промышленность все еще отстает от современного оборудования и технологий производства. Обновляя наши заводы и оборудование, изучая западный опыт, мы можем значительно увеличить объем промышленного производства."
 UAR_Soviet_Aid: "Советская помощь"
 UAR_Soviet_Aid_desc: "Советский Союз был близким партнером в нашем экономическом развитии, приглашая советских техников и экспертов для консультирования и обучения наших людей, мы сможем быстрее модернизировать нашу промышленность."
 UAR_Expand_Housing: "Расширить жилищное строительство"
 UAR_Expand_Housing_desc: "Бездомность и плохие условия жизни остаются проблемой в нашей стране. Расширяя доступ к недорогому жилью, мы можем повысить благосостояние наших граждан и общий экономический потенциал населения."
 UAR_Complete_the_Aswan_Dam: "Завершить строительство Асуанской плотины"
 UAR_Complete_the_Aswan_Dam_desc: "Река Нил - самая важная река в Африке, обеспечивающая более 90% пахотных земель в Египте. Вот уже более десяти лет ведется строительство Асуанской плотины, которая должна была дать важную гидроэлектроэнергию, необходимую для жизнеобеспечения страны. Несмотря на прекращение помощи со стороны западных держав и некоторые незначительные трудности с обеспечением финансирования, строительство плотины наконец-то завершено, и многие оптимистично полагают, что это приведет к новому экономическому золотому веку!"
  
 #Military 
 UAR_The_United_Arab_Republic_Armed_Forces: "Вооруженные силы Объединенной Арабской Республики"
 UAR_The_United_Arab_Republic_Armed_Forces_desc: "Вооруженные силы Египта и Сирии по-прежнему имеют разные структуры управления и используют разные тактические приемы. Объединив наши командные структуры и объединив опыт египетских и сирийских офицеров, мы сможем создать гораздо более эффективные и слаженные вооруженные силы"
 UAR_The_United_Arab_Republic_Navy: "Военно-морские силы Объединенной Арабской Республики"
 UAR_The_United_Arab_Republic_Navy_desc: "Военно-морской флот часто рассматривается как младший член вооруженных сил, однако наши старые хозяева британцы научили мир тому, что военно-морская мощь не менее важна, чем доблесть на суше. Мы должны начать программу модернизации и расширения военно-морского флота, чтобы обеспечить проецирование нашей мощи на весь мир и безопасность наших национальных вод на случай, если британцы снова решат вторгнуться"
 UAR_Purchase_Project_663_Class_Submarines: "Закупка советских подводных лодок проекта 633"
 UAR_Purchase_Project_663_Class_Submarines_desc: "Подводные морские аппараты существуют со времен гражданской войны в Америке, во время обеих мировых войн немцы показали, насколько разрушительными могут быть подводные лодки на поле боя. Советский Союз предложил продать нам несколько своих старых подводных лодок, которые помогут укрепить наш флот"
 UAR_Expand_Alexandrian_Shipyards: "Расширение Александрийских верфей"
 UAR_Expand_Alexandrian_Shipyards_desc: "Александрия славится своим маяком и является важным портовым городом, который когда-то был центром военно-морской мощи Средиземноморья. Мы должны подражать империям прошлого и расширить александрийские верфи, увеличив производство военно-морской техники."
 UAR_Invest_in_Anti_Ship_Missles: "Инвестировать в противокорабельные ракеты"
 UAR_Invest_in_Anti_Ship_Missles_desc: "Противокорабельные ракеты быстро становятся основным средством ведения морской войны, мы должны инвестировать в исследования и производство этих ракет, чтобы не отставать от других военно-морских держав."
 UAR_Develop_Naval_Special_Forces: "Развивать военно-морской спецназ"
 UAR_Develop_Naval_Special_Forces_desc: "Корабль хорош только настолько, насколько хороша его команда, мы должны инвестировать в развитие подразделений специального назначения, которые будут действовать под командованием флота и смогут выполнять операции, которые не под силу нашим обычным солдатам."
 UAR_The_United_Arab_Republic_Army: "Армия Объединенной Арабской Республики"
 UAR_The_United_Arab_Republic_Army_desc: "Армия является основной боевой силой любой страны, наши офицеры имеют опыт участия в Суэцкой и Израильской войнах, но наши нижние чины все еще используют устаревшее оборудование, пришло время окончательно модернизировать нашу армию."
 UAR_Import_PT_76s: "Импортировать PT 76s"
 UAR_Import_PT_76s_desc: "PT 76s - советский легкий танк, он может обеспечить быструю и гибкую броневую поддержку нашей пехоте, мы можем заключить сделку с Советским Союзом на импорт некоторых из этих танков и включить их в состав нашего бронетанкового корпуса."
 UAR_Soviet_Advisors: "Пригласить советских советников"
 UAR_Soviet_Advisors_desc: "Мы должны пригласить советников из Советского Союза, с их знаниями и опытом Второй мировой войны они могут помочь нам быстро превратить нашу армию в современную профессиональную силу."
 UAR_Soviet_Weaponry: "Принять на вооружение советское оружие"
 UAR_Soviet_Weaponry_desc: "Советское оружие славится своей надежностью и качеством, мы должны импортировать стрелковое оружие и другую технику из Советского Союза и принять их в качестве стандарта для всех наших вооруженных сил."
 UAR_Import_Soviet_Weaponry: "Импортировать советские Т54"
 UAR_Import_Soviet_Weaponry_desc: "T54 - одна из самых лучших моделей советских танков, и Советский Союз согласился экспортировать несколько сотен своих танков для помощи в модернизации нашего бронетанкового корпуса."
 UAR_The_United_Arab_Republic_Airforce: "Военно-воздушные силы Объединенной Арабской Республики"
 UAR_The_United_Arab_Republic_Airforce_desc: "Военно-воздушные силы - относительно новая область военных действий, но немцы во Второй мировой войне показали важность и силу воздушной мощи. Мы должны инвестировать в развитие новых и современных ВВС, чтобы обеспечить победу в небе"
 UAR_Soviet_MiG_17s: "Закупка советских самолетов МиГ 17"
 UAR_Soviet_MiG_17s_desc: "Советы вместе с американцами занимают передовые позиции в области ракетных и реактивных технологий. Мы должны иметь несколько десятков советских МиГ 17, чтобы обеспечить себя современными военно-воздушными силами"
 UAR_Soviet_Sukhoi_Su_7s: "Закупка советских самолетов Сухой Су 7"
 UAR_Soviet_Sukhoi_Su_7s_desc: "Сухой Су 7 - один из самых современных многоцелевых истребителей нашего времени, мы должны приобрести несколько таких истребителей у Советского Союза, чтобы создать самые современные ВВС в арабском мире."
 UAR_Import_MiG_21s: "Импортировать МиГ 21"
 UAR_Import_MiG_21s_desc: "МиГ 21 является улучшением своего предшественника МиГ 17 почти во всех аспектах, мы должны импортировать новую партию этих самолетов из Советского Союза, чтобы не продолжать использовать устаревшее оборудование."
 UAR_Expand_Anti_Air_Capabilitites: "Расширить возможности противовоздушной обороны"
 UAR_Expand_Anti_Air_Capabilitites_desc: "В то время как наши войска в небе могут обеспечить превосходство в воздухе для наших войск на фронте, мы все еще уязвимы для воздушных налетов или бомбардировок противника. Мы должны инвестировать в наши противовоздушные средства, чтобы защитить наших людей, которые находятся за линией фронта"
 UAR_Purchase_Project_633_Class_Submarines: "Приобрести подводные лодки класса Project-633"
 UAR_Ensure_University_Access: "Обеспечить доступ в университеты"
 UAR_Import_Soviet_T54s: "Импортировать советские Т54"
 UAR_Soviet_Adivsors: "Советские советники"
  
 #Political 
 UAR_The_Nasser_Era: "Эпоха Насера"
 UAR_The_Nasser_Era_desc: ""Эпоха Насера" относится к периоду истории Египта после революции 52-го года. Этот период был отмечен волной модернизации, социалистическими реформами и активным отстаиванием панарабского национализма. Это время можно считать золотым веком культуры и процветания Египта, а сам Египет - вершиной своего регионального могущества."
 UAR_The_Nationalization_Campaigns: "Национализация копаний"
 UAR_The_Nationalization_Campaigns_desc: "Наша экономическая политика долгое время подвергалась критике как на Востоке, так и на Западе за то, что она либо слишком коммунистическая, либо недостаточно коммунистическая. Насеровская экономическая политика однозначно социалистическая, и поэтому мы должны начать кампанию по национализации жизненно важных отраслей промышленности."
 UAR_Nationalize_Banking_Industry: "Национализировать банковскую отрасль"
 UAR_Nationalize_Banking_Industry_desc: "Банки слишком важны и имеют слишком большое влияние, чтобы позволить им оставаться в частных руках. Если мы хотим контролировать нашу денежно-кредитную политику, мы должны обеспечить контроль над банками"
 UAR_Land_Reform: "Принять земельную реформу"
 UAR_Land_Reform_desc: "Говорят, что более тысячелетия расширение пахотных земель в Египте ускользало от египтян. Однако благодаря революционным реформам президента Насера это чудо свершилось. Мы должны продолжать программы земельной реформы, чтобы обеспечить дальнейшее развитие сельского хозяйства"
 UAR_Seize_the_Cotton_Industry: "Захватить хлопковую промышленность"
 UAR_Seize_the_Cotton_Industry_desc: "Египет славится своей хлопковой промышленностью на протяжении тысячелетий, и она является важным сектором нашей экономики с тех пор, как впервые была завезена в Египет римлянами. Мы должны национализировать хлопковую промышленность, если хотим, чтобы этот важный сектор экономики приносил пользу государству и народу"
 UAR_Strengthen_Unions: "Укрепление профсоюзов"
 UAR_Strengthen_Unions_desc: "Наиболее важным аспектом любой социалистической теории является рабочий, мужчины и женщины, которые выполняют работу, обеспечивающую функционирование любого общества. Поэтому мы должны укреплять власть рабочих путем создания и расширения профсоюзов и рабочих организаций"
 UAR_Eliminate_Interest_Rates_for_Farmers: "Отменить процентную ставку для фермеров"
 UAR_Eliminate_Interest_Rates_for_Farmers_desc: "В результате последних земельных реформ начал формироваться новый класс бедных фермеров. Мы должны отменить процентные ставки по их кредитам, чтобы они могли расширять свою деятельность и увеличивать размеры и масштабы своих хозяйств"
 UAR_State_of_the_National_Union: "Положение дел в Национальном Союзе"
 UAR_State_of_the_National_Union_desc: "Президент Насер теперь не просто президент Египта, а Объединенной Арабской Республики. Хотя до сих пор к нашему великому союзу присоединилась только Сирия, амбиции президента Насера идут гораздо дальше объединения двух государств, поскольку Сирия является испытательным полигоном для нашей будущей политики и потенциала объединенного арабского мира. Президент Насер решил выступить с речью о положении дел в Союзе, чтобы изложить свои планы относительно Республики и характера ее управления, в частности, в Сирии."
 UAR_Stack_the_Government_with_Egyptians: "Сложить правительство с египтянами"
 UAR_Stack_the_Government_with_Egyptians_desc: "Со времен Суэцкого кризиса Египет является центром арабского мира и маяком для объединения арабских стран. Поэтому вполне естественно, что большинство государственных чиновников составляют египтяне, лояльные идее Объединенной Арабской Республики."
 UAR_Nationalize_Syrian_Assets: "Национализировать сирийские активы"
 UAR_Nationalize_Syrian_Assets_desc: "Сирия является таким же членом Союза, как и Египет, поэтому президент Насер решил, что в Сирии должна быть проведена программа национализации, аналогичная египетской, чтобы их промышленность могла принести пользу всей Республике."
 UAR_Integrate_Baathist_Representation: "Интегрировать баасистское представительство"
 UAR_Integrate_Baathist_Representation_desc: "Партия Баас - ведущий голос панарабизма в Сирии и самые сильные сторонники Республики. Мы должны включить членов партии Баас в состав правительства, чтобы продемонстрировать равный статус Сирии в Союзе"
 UAR_Limit_Economic_Centralization_in_Syria: "Ограничить экономическую централизацию в Сирии"
 UAR_Limit_Economic_Centralization_in_Syria_desc: "Сирия является автономным государством в составе Республики, как и Египет. Поэтому мы должны отказаться от крупномасштабной национализации внутри страны, ограничить экономическую централизацию и предоставить сирийцам определенную степень автономии в их собственной экономической политике."
 UAR_Modernize_Al_Azhar: "Модернизировать Аль-Азхар"
 UAR_Modernize_Al_Azhar_desc: "Университет Аль-Азхар - университет, связанный с мечетью Аль-Азхар в Каире, считается одним из самых престижных в арабском мире и ведет свою историю еще со времен династии Фатимидов. Мы должны расширять этот центр образования и повышать его значение как маяка арабской науки"
 UAR_Teach_Evolution_in_Schools: "Преподавать эволюцию в школах"
 UAR_Teach_Evolution_in_Schools_desc: "Несмотря на то, что говорят фундаменталисты, со времен публикации Чарльзом Дарвином книги "О происхождении видов", эволюция является ведущей научной теорией развития человека. Если мы хотим, чтобы наше население было правильно образовано, мы должны ввести в учебный план преподавание только эволюции и ограничить религиозные учения в школе."
 UAR_Establish_Coeducational_Education: "Установить совместное образование"
 UAR_Establish_Coeducational_Education_desc: "И мужчины, и женщины работают над созданием светлого будущего, и поэтому ограничение женщин в получении образования только мешает нашей нации. Расширяя программы совместного обучения в школах, мы можем повысить посещаемость и академические возможности женщин"
 UAR_Combat_Wahhabism: "Борьба с ваххабизмом"
 UAR_Combat_Wahhabism_desc: "Среди всех сект, призывающих к созданию исламского государства в Египте, нет более радикальной, чем ваххабиты. Являясь ультраконсервативной реставрационной сектой, ваххабиты стремятся к строгому толкованию исламского учения и соблюдению законов шариата. Для того чтобы светская арабская мечта сохранилась, ваххабитам необходимо противостоять при любой возможности и не давать им распространять свои фундаменталистские идеи, однако такие действия, скорее всего, вызовут гнев их самых больших сторонников - саудовской монархии."
 UAR_Recognize_Alawites_Druze_and_Shia_as_Muslims: "Признать алавитов, друзов и шиитов мусульманами"
 UAR_Recognize_Alawites_Druze_and_Shia_as_Muslims_desc: "Шайх Махмуд Шалтут, Великий имам богословской школы Аль-Азхар, издал фетву, объявляющую алавитов, шиитов и друзов мусульманами, к которым следует относиться с тем же уважением и без предрассудков, что и к другим мусульманам. Зачастую эти религиозные меньшинства считаются в лучшем случае "периферийными", а в худшем - еретиками и язычниками, поэтому они исключены из основной массы общества. Однако новая фетва может изменить это отношение и, официально поддержав его, способствовать интеграции этих религиозных меньшинств в арабское общество"
 UAR_Establish_the_Arab_Socialist_Union: "Создать Арабский социалистический союз"
 UAR_Establish_the_Arab_Socialist_Union_desc: "После революции Египет, а затем Объединенная Арабская Республика, был однопартийным государством под разными названиями. Однако сегодня президент Насер объявил о создании Арабского социалистического союза и провозгласил его единственной легальной партией в республике."
 UAR_Sponsor_Regime_Change_in_Yemen: "Спонсор смены режима в Йемене"
 UAR_Sponsor_Regime_Change_in_Yemen_desc: "Сторонники панарабизма в Йемене обратились к нам за поддержкой в возможном перевороте против их тиранической монархии. Президент Насер уже давно проявляет интерес к смене режима в Йемене, и, предоставив оружие, материалы и даже собственные сухопутные войска, мы могли бы спонсировать такую смену и в случае гражданской войны обеспечить победу националистов."
 UAR_The_National_Charter: "Национальный устав"
 UAR_The_National_Charter_desc: "Национальная хартия" - это предложение президента Насера о дальнейшей модернизации и реформах. В первую очередь она касалась продолжения земельной реформы, расширения прав трудящихся и здравоохранения, что должно было стать следующим шагом в политике Египта на пути к созданию современной и сильной страны."
 UAR_Womens_Rights: "Права женщин"
 UAR_Womens_Rights_desc: "Женщины заслуживают более активного участия в жизни нашего общества, и, гарантируя равный доступ к услугам и равные возможности для продвижения в обществе, мы можем существенно увеличить силу нашей нации."
 UAR_Increase_the_Minimum_Wage: "Повысить минимальную заработную плату"
 UAR_Increase_the_Minimum_Wage_desc: "Заработная плата рабочего должна быть равна стоимости, которую он производит, однако этот идеал не может быть достигнут в течение одного дня, поэтому необходимы постепенные реформы, и нынешняя низкая заработная плата нашего рабочего класса неприемлема, увеличение минимальной заработной платы, которую должны платить предприятия, стало бы большим шагом на пути к социалистической мечте."
 UAR_Family_Planning_Programs: "Программы планирования семьи"
 UAR_Family_Planning_Programs_desc: "Семья - это основа нашей нации, а функционирующее государство требует функционирующих семей. Мы должны ввести программы, помогающие будущим парам планировать свое будущее и обеспечивающие доступ к ресурсам, которые позволят парам решить, когда они должны создать семью, с увеличением стабильности в семье это должно увеличить стабильность нации в целом."
 UAR_Establish_Vocational_Schools: "Создать профессиональные училища"
 UAR_Establish_Vocational_Schools_desc: "В Национальной хартии, выдвинутой президентом Насером, большое внимание уделяется профессиональному обучению и школьным программам для тех, кто решил не получать высшее образование. Реализация этого аспекта Национальной хартии путем создания большего числа профессиональных школ должна привести к появлению нового поколения образованных и компетентных работников в наиболее востребованных отраслях экономики."
 UAR_Repress_the_Muslim_Brotherhood: "Подавить "Братьев-мусульман""
 UAR_Repress_the_Muslim_Brotherhood_desc: "Несмотря на наши усилия по подавлению "Братьев-мусульман", в стране все еще остаются их члены и сторонники, которые агитируют за создание исламского государства. Мы должны продолжать и расширять наши репрессии против "Братьев-мусульман", чтобы обеспечить выживание нашей светской арабской страны"
 UAR_Universal_Health_Care: "Всеобщее здравоохранение"
 UAR_Universal_Health_Care_desc: "Здравоохранение - это наиболее фундаментальная услуга, которую может предоставить правительство, и мы должны законодательно закрепить всеобщий доступ к ней независимо от материального положения, чтобы обеспечить здоровье и благосостояние наших граждан"
 UAR_Encourage_Secular_Values: "Поощрять светские ценности"
 UAR_Encourage_Secular_Values_desc: "В то время как наше правительство и общественные институты со времен революции стали полностью светскими, многие частные учреждения и организации продолжают включать в себя религиозные элементы. Мы должны поощрять светские ценности и образ мышления среди нашего населения и продолжать ослаблять религиозный контроль в общественном сознании"
 UAR_Strengthen_Soviet_Ties: "Укреплять советские связи"
 UAR_Strengthen_Soviet_Ties_desc: "Наши отношения с западными странами стали холодными после Суэцкого кризиса и принятия нами арабского социализма. Наша страна еще не настолько велика, чтобы выступать на мировой арене без мощного спонсора, и поэтому очевидным выбором является Советский Союз"
 UAR_Purge_The_Military: "Чистка вооруженных сил"
 UAR_Purge_The_Military_desc: "Свержение монархии было достигнуто только благодаря работе молодых и мужественных офицеров. Чтобы новые офицеры не смогли повторить наш успех, необходимо провести мягкую чистку армии и заменить ее ряды лояльными Насеру людьми"
 UAR_Mandate_Profit_Sharing: "Поручить разделение прибыли"
 UAR_Mandate_Profit_Sharing_desc: "Разделение прибыли - это идея, согласно которой каждый работник получает выгоду от общего успеха предприятия. Введя обязательное разделение прибыли в государственных и частных компаниях, мы можем увеличить инвестиции работников в свой труд и позволить, чтобы успех компании охватывал и работников."
 UAR_Combat_Rural_Poverty: "Борьба с сельской бедностью"
 UAR_Combat_Rural_Poverty_desc: "Многие наши граждане, живущие за пределами городов, по-прежнему находятся в ужасных условиях и едва сводят концы с концами. Приняв программу создания рабочих мест и инвестируя в эти сферы, мы сможем снизить уровень бедности в сельской местности и одновременно увеличить производство и экономическую активность."
 UAR_Increase_Political_Repression: "Усилить политические репрессии"
 UAR_Increase_Political_Repression_desc: "Все еще есть люди, которые выступают против арабского социалистического проекта президента Насера и стремятся уничтожить все, над чем мы работали. Логичным решением этой проблемы является усиление репрессий в отношении критики политики правительства и уничтожение оппозиции президенту Насеру"
 UAR_Execute_Sayyed_Qutb: "Казнить Саида Кутба"
 UAR_Execute_Sayyed_Qutb_desc: "Саид Кутб - радикальный исламист, выступающий за создание фундаменталистского исламского правительства в Египте. В течение многих лет он был занозой в боку нашего правительства, и президент Насер счел необходимым приговорить Кутба к смертной казни, оправдываясь тем, что на президента планировалось покушение."
 UAR_Close_the_Straits_of_Tiran: "Закрыть Тиранский пролив"
 UAR_Close_the_Straits_of_Tiran_desc: "Напряженность в отношениях с Израилем всегда была высокой с момента его образования в 1948 году. В рамках панарабской идеологии Палестина считается законной арабской землей, оккупированной израильскими сионистами. Стремясь ослабить Израиль, президент Насер счел необходимым закрыть стратегически важный Тиранский пролив, отрезав Израиль от важнейшего торгового пути."
  
  
  
 #Six Days War 
 UAR_The_Six_Days_War: "Шестидневная война"
 UAR_The_Six_Days_War_desc: "В ответ на закрытие Тиранского пролива и эскалацию напряженности Израиль, наш главный противник, ошеломил наш военный штаб внезапной атакой на Синайском полуострове. Наши генералы и офицеры судорожно ищут ответные меры, однако в настоящее время израильтяне имеют преимущество, поэтому мы должны действовать быстро, если хотим нанести им ответный удар"
 #Victory 
 UAR_The_Partial_Liberation_of_Palestine: "Частичное освобождение Палестины"
 UAR_The_Partial_Liberation_of_Palestine_desc: "В повороте событий, ошеломившем весь мир, наша великая и мужественная армия отбила натиск израильтян, еще раз доказав силу арабского мира. Арабы всего мира празднуют это событие как переломный момент в борьбе с сионизмом и как то, что у палестинского народа наконец-то появилась надежда на освобождение."
 UAR_Revitilize_the_Pan_Arabian_Movement: "Оживить Панарабское движение"
 UAR_Revitilize_the_Pan_Arabian_Movement_desc: "После победы над Израилем престиж президента Насера стал как никогда высок, и арабы всего мира надеются на его лидерство. Президент Насер решил использовать этот импульс, чтобы возродить угасающее панарабское движение и объединить арабов под одним флагом"
 UAR_Expulsion_of_the_Jewish_Population: "Изгнание еврейского населения"
 UAR_Expulsion_of_the_Jewish_Population_desc: "Еврейские поселенцы в ныне освобожденных районах Палестины слишком долго незаконно занимали свою землю. Пришло время изгнать их и вернуть землю ее законным владельцам"
 UAR_Undermine_the_Hashmites: "Подорвать Хашимитов"
 UAR_Undermine_the_Hashmites_desc: "Хашимиты являются ярыми противниками панарабского движения Насера, но после падения монархии в Ираке Иордания осталась одна. Мы должны поощрять инакомыслие и антимонархические настроения внутри страны, чтобы подорвать устаревшую династию"
 UAR_The_Integration_of_Liberated_Palestine: "Интеграция освобожденной Палестины"
 UAR_The_Integration_of_Liberated_Palestine_desc: "Палестинцы недавно освобожденных регионов будут вечно благодарны нам за нашу роль в их освобождении. Официальные представители ООП в знак признательности за нашу помощь официально попросили сделать Палестину автономным государством и присоединиться к растущему панарабскому движению."
 UAR_Destabilize_Saudi_Arabia: "Дестабилизировать Саудовскую Аравию"
 UAR_Destabilize_Saudi_Arabia_desc: "Дом Сауда в настоящее время занимает Аравийский полуостров, от которого арабы берут свое название. Мы должны поддерживать антимонархические движения внутри страны, чтобы дестабилизировать ее и помочь в ослаблении саудовских тиранов."
 UAR_Preperations_for_an_Jordanian_Uprising: "Подготовка к восстанию в Иордании"
 UAR_Preperations_for_an_Jordanian_Uprising_desc: "Хашимиты, как и наша собственная бывшая монархия, рассматриваются многими как коррумпированные марионетки британцев. Мы должны тайно поддерживать антихашимитские движения в Иордании и готовить страну к возможной революции"
 UAR_Combat_Rising_Unemployment: "Борьба с растущей безработицей"
 UAR_Combat_Rising_Unemployment_desc: "После изгнания еврейского населения многие предприятия и важные отрасли промышленности были заброшены, что привело к широкой безработице среди палестинцев в освобожденных районах. Мы должны перераспределить эти пустующие предприятия и увеличить социальное обеспечение, чтобы помочь в борьбе с безработицей."
 UAR_Resettle_Palestinian_Refugees: "Переселить палестинских беженцев"
 UAR_Resettle_Palestinian_Refugees_desc: "Освобождение Палестины не осталось незамеченным широкой палестинской диаспорой, и многие беженцы из Египта и даже других стран перебираются в Палестину. Мы должны помочь этим мигрантам расселить многие из ныне пустующих городов и интегрировать их в общество"
 UAR_The_Liberation_of_Arabia: "Освобождение Аравии"
 UAR_The_Liberation_of_Arabia_desc: "Аравия - родина всех арабов, которая в течение последних нескольких десятилетий была незаконно оккупирована домом Сауда. Приверженцы радикальной исламской секты ваххабитов, Дом Сауда слишком долго навязывал своему населению строгие религиозные законы. Пришло время освободить аравийских арабов от их монархических тиранов и включить их в широкое панарабское движение"
 UAR_Encourage_Arab_Economic_Cooperation: "Поощрять арабское экономическое сотрудничество"
 UAR_Encourage_Arab_Economic_Cooperation_desc: "Хотя арабский мир еще не является политически единым, первым шагом к объединению является экономическая взаимозависимость. Мы должны поощрять бизнес из других арабских стран, чтобы способствовать развитию чувства сотрудничества и взаимной потребности, что в конечном итоге может привести к призывам к политическому объединению."
 UAR_Remilitarize_Umm_al_rashrash: "Ремилитаризировать Ум-эль-Рашраш"
 UAR_Remilitarize_Umm_al_rashrash_desc: "Несмотря на нашу победу в войне, Израиль остается постоянной угрозой, мы должны укрепить нашу недавно приобретенную территорию для защиты от любой возможной будущей израильской агрессии"
 UAR_Nasserism_Triumphant: "Насеризм торжествует"
 UAR_Nasserism_Triumphant_desc: "Президент Гамаль Абдель Насер стал символом общеарабского сотрудничества и сопротивления иностранному империализму. Насеристская идеология изучается в школах, изображения Насера украшают улицы, а арабы по всему региону с каждым днем все громче и громче кричат о необходимости создания единой Аравии под руководством президента Насера."
 UAR_The_Center_of_the_Arabic_World: "Центр арабского мира"
 UAR_The_Center_of_the_Arabic_World_desc: "Каир затмил священный город Мекку как центр арабского мира. Арабы всего региона теперь смотрят на Каир и его правительство в качестве лидера, а Каир стал золотым стандартом для основной арабской культуры. Арабы ежедневно приезжают в город, чтобы жить в нем, и стало неоспоримым, что Каир - это сердце арабского мира"
  
 UAR_Undermine_the_Hashemites: "Подорвать Хашимитов"
 UAR_Appoint_Marshall_Amer_Vice_President: "Назначить фельдмаршала Амера вице-президентом"
 UAR_Appoint_Marshall_Amer_Vice_President_desc: "Фельдмаршал Амер - почти такая же знаменитая фигура, как и сам президент Насер. Герой войны, возглавлявший наши победоносные вооруженные силы в войне против Израиля, его политическое влияние продолжает расти с каждым днем. Чтобы обеспечить его преданность Республике и президенту Насеру, многие члены правительства предложили назначить фельдмаршала Амера вице-президентом Объединенной Арабской Республики"
 UAR_Appoint_Hafez_Assad_Vice_President: "Назначить Хафеза Асада вице-президентом"
 UAR_Appoint_Hafez_Assad_Vice_President_desc: "В последние годы Хафез Асад выдвинулся в лидеры сирийской Баасистской партии, обладает огромным влиянием в регионе и является образцом для тех, кто опасается арабского мира с доминированием Египта. Чтобы показать, что все арабы равны, и заручиться поддержкой партии Баас, Насер предложил назначить Асада вице-президентом Объединенной Арабской Республики"
  
 #Defeat 
 UAR_an_Naksah: "an Naksah"
 UAR_an_Naksah_desc: "Арабский мир пережил очередное унижение от рук сионистских империалистов. Внезапное нападение на наши войска оказалось слишком сильным, и нашему правительству не остается ничего другого, как признать поражение в войне."
 UAR_Arrest_Egyptian_Jews: "Арестовать египетских евреев"
 UAR_Arrest_Egyptian_Jews_desc: "После очередного поражения от израильского государства многие стали искать виноватых в своем разочаровании. В Египте проживает значительное количество евреев, которые населяли этот регион на протяжении тысячелетий, но многие египтяне теперь считают, что эти евреи симпатизировали врагу и, возможно, даже активно поддерживали его. В целях обеспечения государственной безопасности президент принял решение решить эту потенциальную еврейскую проблему"
 UAR_Settle_Palestinian_Refugees: "Переселить палестинских беженцев"
 UAR_Settle_Palestinian_Refugees_desc: "Народ Палестины вновь был вынужден покинуть свои дома в результате израильской агрессии. Потеряв родину, многие из них теперь живут в качестве беженцев в соседних арабских странах. Мы должны приступить к реализации программы по расселению и интеграции этих беженцев, чтобы у них наконец появилось место, которое они могли бы назвать своим домом"
 UAR_Encourage_Exports: "Поощрять экспорт"
 UAR_Encourage_Exports_desc: "Президент Насер решил изменить текущую торговую политику Египта, увеличив объем экспорта из нашей страны, чтобы принести больше богатства из ресурсов нашей страны."
 UAR_Political_Liberalization: "Политическая либерализация"
 UAR_Political_Liberalization_desc: "После поражения в войне президент Насер получил значительный удар по своему престижу и репутации. Пытаясь укрепить поддержку населения, президент Насер решил снять многие из прежних ограничений на политическую деятельность и свободу слова."
 UAR_Economic_Liberalization: "Либерализация экономики"
 UAR_Economic_Liberalization_desc: "Программы национализации прошлых лет оказались полезными для развития египетской экономики. Однако теперь, когда экономика модернизирована и экономический рост начал замедляться, президент Насер решил ввести в действие программу экономической либерализации, чтобы увеличить частное предпринимательство и инвестиции."
 UAR_Support_the_PLO: "Поддержка ООП"
 UAR_Support_the_PLO_desc: "Несмотря на то, что мы потерпели поражение в войне, наша поддержка борьбы за освобождение Палестины не ослабевает. Мы должны усилить поддержку ООП - ведущей организации палестинского сопротивления, однако, поскольку она базируется в Иордании, это может привести к некоторым негативным последствиям для нашей арабской страны."
 UAR_Purge_Amer: "Арестовать Амерп"
 UAR_Purge_Amer_desc: "Фельдмаршал Амер стал олицетворением поражения и унижения от Израиля, он вместе с несколькими другими офицерами был арестован за измену из-за их неудач в войне. К сожалению, Амер трагически погиб, не дожив до суда"
 UAR_Reduce_Political_Repression: "Уменьшить политические репрессии"
 UAR_Reduce_Political_Repression_desc: "В рамках усилий президента Насера по политической либерализации число арестов, проводимых силами безопасности, сократилось, а политическая активность больше не рассматривается как причина для пожизненного заключения. Снижение репрессий, вероятно, приведет к росту поддержки таких опасных организаций, как "Братья-мусульмане", однако президент счел этот риск необходимым."
 UAR_Fortify_the_Suez_Frontlines: "Укрепление Суэцкого канала"
 UAR_Fortify_the_Suez_Frontlines_desc: "Суэцкий канал - самый важный торговый путь в мире, соединяющий Средиземное и Красное моря, через него проходит большая часть мирового судоходства. К сожалению, в настоящее время он стал линией фронта арабо-израильского конфликта, и поэтому необходимо построить оборонительные сооружения на нашей стороне канала, чтобы не дать израильтянам получить полный контроль над ним."
 UAR_Sack_the_Military_Ministers: "Уволить военных министров"
 UAR_Sack_the_Military_Ministers_desc: "Нынешний военный состав доказал свою некомпетентность в лучшем случае и предательство в худшем. Президент Насер решил уволить большинство военных министров и назначить на их место новых, более лояльных специалистов."
 UAR_Reform_the_Arab_Socialist_Union: "Реформировать Арабский социалистический союз"
 UAR_Reform_the_Arab_Socialist_Union_desc: "Арабский социалистический союз все еще создан по образцу репрессивного правительства прошлых лет, в попытке продолжить политическую либерализацию президент Насер, как лидер партии, решил реструктурировать и реформировать руководство партии и создать более компетентный Арабский социалистический союз."
 UAR_Restore_Boghdadi_as_Vice_President: "Восстановить Богдади в должности вице-президента"
 UAR_Restore_Boghdadi_as_Vice_President_desc: "Один из первых членов движения "Свободные офицеры" и важная фигура в революции 1952 года, Абдель Латиф Богдади был вице-президентом Египта в первые годы президентства Насера. Однако разногласия по поводу того, что Насер стал проводить экономическую политику в советском стиле, а также разногласия по поводу установления более тесных отношений с США привели к тому, что Богдади покинул свой пост. Однако в настоящее время, в связи с проводимой в последнее время политической и экономической либерализацией, президент Насер в большей степени соответствует идеалам Богдади. Мы должны вернуть Богдади на пост вице-президента и правой руки Насера"
 UAR_Keep_Sadat_Vice_President: "Оставить Садата вице-президентом"
 UAR_Keep_Sadat_Vice_President_desc: "Анвар Садат был старшим членом движения "Свободные офицеры" и всегда являлся близким доверенным лицом президента Насера. Многие считают его политическим протеже Насера и наиболее вероятным кандидатом в преемники Насера, если с ним что-то случится. Он верно и преданно служил Насеру в качестве вице-президента на протяжении многих лет, и хотя в некоторых случаях он расходился во взглядах с Насером, нет никаких причин для того, чтобы менять его в администрации"
 UAR_Accept_the_Rogers_Plan: "Принять план Роджерса"
 UAR_Accept_the_Rogers_Plan_desc: "Президент Насер согласился с предложением американского госсекретаря Уильяма Роджерса. План представляет собой всеобъемлющий план действий по прекращению арабо-израильского конфликта, и хотя некоторые считают его слишком произраильским, президент Насер увидел в нем возможность вернуть Синай, дать палестинцам шанс вернуться домой и повысить авторитет Египта среди ведущих держав."
  
 SIX_DAYS_WAR.100.d: "Недавно в Министерство обороны поступило предложение от младших офицеров разведки осуществить модернизацию телекоммуникационных возможностей государственных и военных учреждений. В предложении отмечается, что существующая система устарела на десятки лет и, согласно проведенному анализу, уязвима для перехвата противником. Более того, отмечается, что высокая нагрузка на систему, как в военное время, может привести к сбоям, которые серьезно ограничат возможности командиров по управлению войсками. Когда старшие офицеры и министры высказали свое мнение, они заявили, что существующая система более чем работоспособна, а предложение выглядит как попытка этих младших офицеров возвысить свое положение и извлечь выгоду из этого процесса. Более того, отмечается, что предлагаемая модернизация будет весьма дорогостоящей и может повлиять на приобретение жизненно важного оборудования для вооруженных сил. Учитывая это, правительство должно решить, одобрять или не одобрять данное предложение"
 SIX_DAYS_WAR.1.d: "Израильские войска начали вторжение на Синайский полуостров. Вопреки ожиданиям египетская армия быстро столкнулась с концентрированной атакой на севере и в центре Синая. Быстро перемещающиеся израильские наземные части обходили египетские части на границе с флангов и подавляли их. Уже через несколько часов после начала боевых действий египетские войска оказались практически в полном беспорядке: подразделения были отрезаны, а системы связи перегружены. Высшее руководство в Каире, похоже, не понимает ситуации на местах, и теперь, похоже, сопротивление египетской армии терпит крах. Многие войска уже отступают к Суэцу"
 SIX_DAYS_WAR.2.d: "В ближайшее время мы должны позвонить лидерам Сирии и Иордании и проинформировать их о текущей ситуации на Синае. Некоторые советники считают, что мы должны сообщить им правду о ситуации. Что мы понесли большие потери в материальной части и солдатах. Более того, ситуация на Синае ухудшилась и превратилась в полноценный ад для наших войск. Другие советники опасаются, что обнародование таких новостей приведет к тому, что они предадут арабское дело и оставят нас в одиночку противостоять сионистскому врагу. Они хотят, чтобы мы отвергли пропагандистские заявления израильтян о победах и заявили, что мы нанесли тяжелые потери их самолетам и наши силы вот-вот выйдут к границам самой сионистской страны. Это подтолкнет их к вмешательству и снизит давление на наши силы. Приближается время звонка, и мы должны решить, говорить правду или нет"
 SIX_DAYS_WAR.3.d: "Получив известие о том, что наши братья в Египте ведут жестокую борьбу с сионистами, мы решили начать собственные наступления на Израиль. Это позволит освободить арабские земли и оказать достаточное давление на их границы, чтобы коррумпированный дом лже-нации вскоре рухнул. Военное командование на местах считает, что враг сосредоточен на Синае и наши силы легко одолеют слабые силы на наших границах. Победа будет достигнута решительно. Хотя первые сообщения говорят о тяжелом сопротивлении противника, мы ожидаем, что вскоре последуют новости о победах. Мы выполним нашу священную клятву, данную арабскому народу"
 SIX_DAYS_WAR.5.d: "Наше комбинированное наступление на сионистскую родину увенчалось великолепным успехом. Их солдатам и народу не хватило решимости противостоять храбрости и мастерству наших отважных солдат и летчиков. Люди вышли на улицы по всему арабскому миру, празднуя нашу великую победу. Тысячи арабов, которые были вынуждены покинуть свои дома во время Накбы, с нетерпением ждут возможности вернуться на освобожденную землю. На данный момент объединенное арабское военное командование будет продолжать функционировать, занимаясь пленными, патрулируя линию прекращения огня и следя за тем, чтобы сионисты не пытались использовать какие-либо уловки. Но на данный момент всему миру ясно, что мы победили"
 SIX_DAYS_WAR.8.d: "Наши братья в Египте информировали нас об истинном положении дел на Синае. Мы знаем о неудачах, которые они терпят, и о продолжающейся сионистской агрессии. Многие наши советники призывают нас сохранять нейтралитет и не вмешиваться в конфликт. Они опасаются, что сионисты гораздо опаснее, чем кажется, и время для этого еще не пришло. Возможно, со временем мы сможем объединиться, лучше подготовиться и быть готовыми к действиям. Другие же призывают нас действовать во имя арабского единства, чтобы спасти ситуацию. Они указывают на то, что народ будет в ярости, если мы не поможем нашим братьям в Египте. Они также отмечают, что военная ситуация может стать непреодолимой, если мы будем медлить. Принятое нами решение о вмешательстве может решить судьбу региона"
 SIX_DAYS_WAR.17.d: "Трусливая попытка сионистов уничтожить наши ВВС закончилась для них неудачей. Этот оголтелый акт агрессии не может остаться безнаказанным. Руководство утвердило приказ нашим храбрым силам на Синае принять бой с врагом и вторгнуться на землю, которую они украли в 1948 году. Офицеры и солдаты уверены в себе и находятся в приподнятом настроении после недавнего успеха. Они годами ждали этого приказа, и вот время пришло. Мы ожидаем, что сионисты будут сопротивляться, но уверены, что, обладая инициативой, наши войска одолеют любое сопротивление. Сохранение авиации значительно облегчит наше продвижение"
 SIX_DAYS_WAR.18.d: "После неудачного упреждающего удара сионистов по египетским ВВС наш арабский брат ответил вторжением с Синайского полуострова. Не имея ни превосходства в воздухе, ни элемента внезапности, сионисты столкнулись со сложной проблемой. Народные настроения говорят о том, что мы должны действовать солидарно и использовать наши силы для прорыва вражеских линий и обеспечения победы. Если в борьбу включится наша авиация и сухопутные войска, это может стать решающим шагом и позволит отомстить за унижение Накбы". После тщательных консультаций было принято решение действовать. Через несколько часов после принятия этого решения отважные арабские солдаты Сирии и Иордании начали действовать"
 SIX_DAYS_WAR.21.d: "Президент в Каире получил сообщение из Эйлата о том, что сионистская крепость пала. Это самое большое достижение наших вооруженных сил в этом конфликте. Арабский мир всегда рассчитывал на то, что мы станем его Пруссией, и на сегодняшний день мы превзошли эти ожидания. Благодаря жесткости и мастерству наши войска умело продвинулись в западную часть пустыни Негев, освободив арабские земли и бедуинские племена. Оттуда мы двинулись к израильскому городу Эйлату. Его порт на Красном море и аэродром имеют важнейшее значение для экономики сионистов, и его потеря не просто нанесет серьезный экономический удар, но и сделает их экономику уязвимой в будущем. Уже сейчас командующий войсками уполномочен создать в Эйлате военное правительство и держать под контролем его сионистских жителей, чтобы не допустить появления пятых колонн"
 SIX_DAYS_WAR.25.d: "Со времён Накбы сионисты ведут жестокую кампанию насилия и угнетения против арабов. Они вмешиваются в наши дела и причиняют боль ни в чем не повинным людям, особенно тем, кто был изгнан из своих древних домов. За последние годы мы создали впечатляющую военную машину, являющуюся гордостью арабского мира. К тому же сложившаяся международная обстановка и пыл нашего народа благоприятствуют действиям, и пришло время доказать, что мы - Пруссия арабов. Получив приказ из Каира, наши мощные вооруженные силы на Синае пришли в движение и начали продвижение на оккупированные арабские земли, давно эксплуатируемые сионистами. Хотя международное сообщество не оценит эту акцию, мы отняли у противника элемент внезапности и инициативы, что, несомненно, поможет нам преодолеть сионистскую оборону"
 SIX_DAYS_WAR.35.d: "Израильское правительство согласилось капитулировать перед сирийскими требованиями о правах на воду в реке Иордан. Это было принципиальное требование Сирии после ее победы в недавней войне с Израилем. Сирийские военные вместе с другими арабскими странами - Иорданией и Египтом - нанесли поражение Израилю. Хотя израильтянам удалось избежать полной капитуляции, они были вынуждены пойти на территориальные и экономические уступки со своими противниками. Для Сирии спор о правах на водные ресурсы стал доминирующим в конфликте с Израилем. Оба государства давно обвиняют друг друга в попытках украсть воду, которая необходима для экономики обеих стран. Сирия надеется, что с получением прав на воду после победы она сможет совершить сельскохозяйственную революцию. В Израиле широко распространены опасения, что эта уступка приведет к нехватке воды и экономической катастрофе"
 SIX_DAYS_WAR.36.d: "Несмотря на то, что Иордания выглядела самой неохотной из арабских стран, участвовавших в недавней войне с Израилем, она все же ввела свои войска и вышла победителем из конфликта вместе со своими союзниками. Хотя Израиль и избежал полной капитуляции, его военное поражение означает, что он должен пойти на экономические и территориальные уступки своим противникам. После напряженных переговоров иорданцы объявили, что Израиль уступит Джезреэль и прилегающую к нему территорию. Иорданцы утверждают, что они освободили арабов, особенно арабов-христиан этого района и их святые земли от деспотичного израильского оккупационного режима. В связи с известием о заключении соглашения многие арабские беженцы 1948 года движутся к границе, чтобы вернуться домой. Жителям, желающим остаться с Израилем, предлагается либо уехать, либо принять новую иорданскую администрацию."
 SIX_DAYS_WAR.37.d: "Объединенная Арабская Республика (ОАР) подписала окончательное соглашение о прекращении недавней войны между ней и Израилем. В соответствии с этим соглашением Израиль согласился уступить оккупационным силам ОАР западную часть Негева. В ходе войны войска ОАР продвинулись до Эйлата, но в результате контрнаступления, предпринятого перед прекращением огня, Израиль отвоевал Эйлат. Благодаря этой победе, одержанной в последний момент, Израилю пришлось уступить лишь малонаселенный пустынный район, а не потерять жизненно важный город и порт. ОАР преподносит это соглашение как полную победу, утверждая, что освободила арабских бедуинов в этом районе и теперь может наказать Израиль, если он попытается совершить агрессию в будущем. Многие жители Каира вышли на улицы, чтобы отпраздновать это событие, но многие наблюдатели отмечают, что израильтяне, скорее всего, будут испытывать облегчение от того, что они сохранили Эйлат, который может оказаться жизненно важным для их послевоенного восстановления."
 SIX_DAYS_WAR.38.d: "Объединенная Арабская Республика (ОАР) подписала свое окончательное соглашение о прекращении недавней войны между ней и Израилем. В соответствии с этим соглашением Израиль согласился уступить оккупационным силам ОАР западную часть Негева и Эйлат. В ходе войны войска ОАР и Израиля вели ожесточенные бои, но войскам ОАР удалось продвинуться вперед и захватить Эйлат. Позднее израильская контратака с целью захвата города закончилась неудачей, и многие в Израиле считают потерю Эйлата катастрофой. В ОАР настроение восторженное, люди вышли на улицы. Правительство ОАР объявило, что соглашение подтверждает его победу. Оно утверждает, что освободило оккупированные арабские земли и бедуинов, проживающих на его новых территориях. Оно также добавило, что, контролируя Эйлат, ОАР теперь имеет мост к остальному арабскому миру"
 SIX_DAYS_WAR.39.d: "Несмотря на широкую пропагандистскую кампанию, Египет не может скрыть, что потерпел сокрушительное поражение от рук Израиля. Израильские войска теперь контролируют Синайский полуостров и оккупируют палестинских арабов в Газе. Египетские военные, несмотря на свои предвоенные заявления о превосходстве, оказались неспособны справиться с израильскими войсками, которые использовали эффективную тактику, координацию и мастерство для достижения ошеломляющей победы. Многие в Израиле поддерживают оккупацию Синайского полуострова, считая, что это дает Израилю буфер, с которого можно отслеживать и контролировать будущую египетскую агрессию. Египетское правительство и его союзники уже осуждают израильскую оккупацию, считая ее незаконной и угрожающей будущему миру в регионе. Несмотря на это, Израиль остается триумфатором, а его успехи - неоспоримыми."
 SIX_DAYS_WAR.40.d: "Сегодня израильское правительство подтвердило свою победу над Сирией, объявив, что оно будет продолжать удерживать Голанские высоты. Голанские высоты и их сложный рельеф представлялись главным преимуществом для сирийских войск, находящихся в обороне. Однако в ходе недавней войны израильским войскам удалось одолеть и захватить этот район у сирийских военных. Сирийские войска не смогли успешно контратаковать или остановить израильские войска. После прекращения огня стало ясно, что израильтяне захватили Голаны, а сирийские военные усилия в основном прекратились. Многие в Израиле считают, что благодаря этой победе страна получила естественный оборонительный рубеж, который позволит лучше защитить ее от будущей агрессии со стороны Сирии."
 SIX_DAYS_WAR.42.d: "Правительство Иордании признало, что Западный берег реки Иордан остается под оккупацией израильских войск. Это подтверждает крупную победу, одержанную Израилем в недавней войне. Израильские войска смогли разгромить иорданцев и обеспечить безопасность Западного берега реки Иордан, чтобы лучше поддерживать другие свои завоевания и обеспечивать безопасность Иерусалима. На Западном берегу проживает множество арабских палестинцев, и в настоящее время там находится израильское военное правительство. Израильтяне, как говорят, несказанно рады этим победам. Кроме того, на Израиль и арабские государства оказывается огромное международное давление, чтобы не допустить повторения кризиса с беженцами 1948 года. Многие жители Западного берега в настоящее время не уверены в завтрашнем дне. Иорданцы в значительной степени унижены и теперь находятся к востоку от реки Иордан. В Израиле многие чувствуют, что теперь в стране есть пространство для роста благосостояния нации."
 SIX_DAYS_WAR.0.d: "Недавние арабские провокации на Синае, а также закрытие Тиранского пролива заставили премьер-министра созвать совещание высших чинов кабинета и военных для обсуждения ответных мер. На совещании разведывательная служба сообщила, что не верит в то, что Америка вмешается в ситуацию для разрешения недавней напряженности. Это спровоцировало ряд высокопоставленных генералов, включая Ицхака Рабина, Ариала Шарона и Моше Даяна, призвать к нанесению упреждающего удара, пока противник не нанес удар первым. Премьер-министр в ответ призвал к спокойствию и выразил уверенность, что Америка поможет урегулировать ситуацию. Генералы почти бунтарски критикуют премьер-министра и его позицию. Правительству предстоит принять решение о нанесении упреждающего удара или воздержаться и надеяться на деэскалацию ситуации. Планируется, что первоначальный удар будет нанесен с целью уничтожения египетских ВВС под кодовым названием "Операция Мокед"
 SIX_DAYS_WAR.31.d: "Несмотря на смелость плана и огромное мастерство наших летчиков, операция "Мокед" закончилась неудачей. Судя по всему, нашим самолетам не хватило элемента внезапности, так как египетские наблюдатели и радарщики смогли зафиксировать перемещение наших истребителей. Попытки прервать или перегрузить системы связи не увенчались успехом. Хотя скорость нашей атаки оставила многие арабские самолеты на открытом пространстве, сильный зенитный огонь и поднятие на воздух нескольких вражеских самолетов значительно нарушили ход атаки. Многие бомбы не попали в цель, а попытки нанести штурмовые удары по истребителям противника на земле оказались невозможными и неточными. Мы потеряли несколько истребителей и не нанесли того ущерба, на который рассчитывала операция "Фокус". В результате этой неудачи мы оказались в состоянии войны с арабским противником, обладающим неповрежденными ВВС, и теперь мы должны бороться за защиту нашего воздушного пространства и людей". #Операция "Фокус"
 SIX_DAYS_WAR.30.d: "Тесное сотрудничество между ВВС и разведывательными службами привело к блестящему успеху операции "Фокус". Наши истребители двигались под прикрытием арабских радаров, в то время как разведчики нарушали связь противника, не допуская никакого предупреждения о нашей операции. Достигнув намеченных аэродромов, самолеты приступили к бомбометанию и штурмовке. Оборона египтян оказалась весьма слабой: большинство самолетов находилось на взлетно-посадочных полосах, а ангары, судя по всему, не были рассчитаны на бомбардировку. По данным разведки и фотографиям, сделанным нашими истребителями, мы можем утверждать, что сотни арабских самолетов были уничтожены. Многие взлетно-посадочные полосы также серьезно повреждены. Вражеские противовоздушные силы не имели предупреждения, и к тому времени, когда они заняли свои позиции, мы уже вернулись домой. Наши отважные пилоты уже планируют последующие удары по арабским военным объектам на Синае, чтобы помочь нашим наземным войскам добиться успеха в их операциях.\" #Операция "Фокус"
 SIX_DAYS_WAR.4.d: "Арабы в Сирии пытались воспользоваться нашим кризисом и вогнать кинжал в нашу родину. Вражеские силы не обладают такой дисциплиной, мастерством и подготовкой, как наши собственные, но все же добились некоторых успехов на границе. В ответ на это мы собрали свои силы и начали контратаку. Благодаря превосходству в воздухе командование на земле уверено, что успехи противника будут сведены на нет. Перехваченные сообщения показывают, что арабы нервничают и не уверены в себе, они не смогут противостоять нам, пока мы оттесняем их назад"
 SIX_DAYS_WAR.41.d: "Арабы в Иордании, подталкиваемые к действиям другими арабами, начали наступление на наши земли. Этот враг оказался трудным во время нашей борьбы за независимость, но сейчас мы гораздо сильнее, и они действуют неубедительно. Мы собрали свои силы и начали контратаку против них. С учетом нашего превосходства в воздухе командование на земле уверено, что успехи противника будут сведены на нет. Мы не ожидаем, что они смогут противостоять нам, и уверены, что они будут отброшены от своих незначительных успехов"
 SIX_DAYS_WAR.6.d: "Несмотря на уверенность наших командиров и продуманность стратегии, наше контрнаступление против арабских захватчиков провалилось. Они оказались упорными защитниками и, несмотря на наши явные преимущества, заняли достаточно выгодные позиции, чтобы противостоять нашим действиям". Кабинет министров выразил свое разочарование военными за то, что они не достигли ожидаемых результатов. По всему Израилю ощущается разочарование и страх перед тем, что произойдет теперь, когда враг остался на нашей земле. В ближайшее время ожидается экстренное совещание кабинета министров и военных для рассмотрения возможных вариантов действий."
 SIX_DAYS_WAR.7.d: "Опасные замыслы арабов против нас были ясны уже давно. Промедление в действиях чревато лишь тем, что они организуются и нанесут удар по нам в удобное для них время. После долгих раздумий военное руководство представило кабинету министров план упреждающей нейтрализации арабов в Сирии и Иордании. Несмотря на международное осуждение, которое может последовать за этими действиями, выживание нации находится под угрозой. Кабинет министров признал это и одобрил план. Сегодня утром отважные солдаты и летчики Армии обороны Израиля перешли к действиям. Они эффективно преодолели обе границы, и нация с нетерпением ждет позитивных новостей от наступательных операций."
 SIX_DAYS_WAR.15.d: "Западный берег реки Иордан после напряженных боев перешел под контроль наших солдат-победителей. Кабинет министров утвердил приказ о предоставлении военному коменданту региона полного административного контроля и передаче Западного берега под военное управление. Захват Западного берега не входил в первоначальные планы, но по мере того, как наши войска преодолевали сопротивление арабов в этом районе, стало ясно, что контроль над Западным берегом и наличие надежной границы по реке Иордан необходимы для обеспечения безопасности других наших завоеваний в этом районе. В регионе проживает большое количество арабского населения, но при наличии надлежащих мер безопасности это не должно представлять серьезной проблемы. Самое главное - Старый город Иерусалима и Храмовая гора теперь в наших руках, впервые за две тысячи лет Храмовая гора находится в руках евреев"
 SIX_DAYS_WAR.151.d: "В кабинете министров шли ожесточенные споры о том, стоит ли штурмовать Голанские высоты, занятые арабами. Существовало опасение, что сложный рельеф местности приведет к большим потерям при незначительном выигрыше в борьбе с закрепившимся противником. Однако отсутствие решимости и умения у противника дало понять, что Голаны, возможно, не так опасны, как представлялось вначале. По настоянию и приказу Моше Даяна две бригады начали наступление и после суток упорного сопротивления одолели противника. Арабы не смогли контратаковать, и стало ясно, что теперь мы контролируем Голанские высоты. Наши войска начали окапываться и гарантируют, что нас будет нелегко вытеснить"
 SIX_DAYS_WAR.19.d: "Арабы на севере продвинулись в нашу страну. Мы знаем, что им не хватает умения или такта наших солдат, но огромная численность вражеских сил и бронетехники подавляла первоначальную оборону границы. Теперь наши командиры оценили ситуацию, и сегодня утром наши войска начали контратаку, чтобы отбросить арабов назад к Дамаску. Хотя военные уверены в своих силах, они все же отметили кабинету министров, что нашим войскам будет трудно вызвать тяжелую авиационную поддержку или сосредоточить большие силы. Отсутствие превосходства в воздухе означает, что многие наши истребители будут заняты обороной воздушного пространства. Это также означает, что наши войска рискуют подвергнуться воздушному нападению противника, если они сосредоточат слишком большие силы на открытой местности. Однако, несмотря на эти трудности, победа, несомненно, будет достигнута"
 SIX_DAYS_WAR.191.d: "Арабы на востоке продвинулись в нашу страну. Мы знаем, что им не хватает решимости наших солдат, но преимущества концентрации сил на одном фронте и опыт позволили им вначале преодолеть нашу тонкую пограничную оборону. Теперь наши командиры оценили ситуацию, и сегодня утром наши войска начали контратаку, чтобы отбросить арабов назад за Иордан. Хотя военные уверены в своих силах, они все же отметили кабинету министров, что нашим войскам будет трудно вызвать тяжелую авиационную поддержку или сосредоточить большие силы. Отсутствие превосходства в воздухе означает, что многие наши истребители будут заняты обороной воздушного пространства. Это также означает, что наши войска рискуют подвергнуться воздушному нападению противника, если они сосредоточат слишком большие силы на открытой местности. В условиях той местности, с которой мы столкнулись, наличие воздушных сил для поддержки наземных наступательных операций было бы очень кстати"
 SIX_DAYS_WAR.192.d: "Арабские вооруженные силы на Синае начали вторжение на родину. Поскольку они являются самыми крупными арабскими силами, неудивительно, что им удалось проникнуть через границу и продвинуться вперед. Они продвигаются в больших количествах и оспаривают превосходство в воздухе. Однако наши военачальники недавно начали серию контратак, чтобы остановить и в конечном итоге оттеснить арабов к границе. Хотя мы сталкиваемся с угрозой воздушных атак на наши силы, есть уверенность, что подготовка, навыки и способности наших солдат позволят им обойти и разгромить эти силы вторжения"
 SIX_DAYS_WAR.22.d: "В ходе экстренного заседания кабинета министров с участием высшего военного руководства было принято решение немедленно санкционировать контрнаступление с целью отвоевания Эйлата у арабских захватчиков. Несмотря на то, что бои идут довольно отчаянные и наши силы в основном преданы, мы не можем рисковать потерей Эйлата. Порт в Эйлате связывает нас с Азией и Африкой. Его расположение на Красном море обеспечивает нам гибкость в морской торговле, что необходимо для предотвращения арабской блокады. В стратегическом плане он также отделяет арабов в Египте от остального арабского мира, и его потеря значительно облегчит их усилия против нас. Запланированная атака должна нанести удар по двум слабым местам в обороне противника, что приведет к прорыву, в результате которого Эйлат будет окружен, а затем укреплен нашими силами. Атака началась час назад"
 SIX_DAYS_WAR.23.d: "После отчаянных боев наши войска смогли отбить у арабских войск Эйлат, его порт и аэродром. Это свидетельствует о способности нашего народа, который, несмотря на трудности и проблемы последнего времени, смог начать жизненно важный штурм и отвоевать Эйлат. Наши войска смогли нанести удар по двум выявленным слабым местам противника, прорваться через них и затем окружить Эйлат. После короткого боя небольшие арабские силы в городе сдались, и мы создали прочные оборонительные рубежи, защищающие город. С тех пор как мы впервые основали Эйлат, он стал нашим окном в Африку и Азию. Независимо от неудач, постигших нас в этом конфликте, мы никогда не забудем храбрость наших войск в Эйлате и то, как они спасли послевоенное будущее страны."
 SIX_DAYS_WAR.24.d: "Недавно кабинет министров был проинформирован о том, что атака в Эйлате провалилась. Хотя нашим силам удалось нанести удары по двум слабым точкам, одна из этих позиций сопротивлялась достаточно упорно, чтобы прибывшие подкрепления смогли отбить эту атаку. Другие силы все же прорвались и, несмотря на маневренность и первые успехи, оказались недостаточно сильны для завершения окружения Эйлата и были остановлены. Атака стоила нам жизненно важного оборудования и живой силы, но было решено, что у нас не было выбора. Потеря Эйлата делает послевоенную ситуацию еще более тяжелой для нашей страны, но в конечном итоге мы будем упорствовать и всегда помнить о мужественных жертвах наших солдат, которые отчаянно пытались спасти Эйлат от гибели."
 SIX_DAYS_WAR.26.d: "Арабские вооруженные силы на Синае своей недавней агрессией доказали свою опасность для родины. Поскольку их силы все еще готовы продолжать угрожать нашему народу, кабинет министров недавно одобрил начало наступления на Синай, чтобы нейтрализовать эту угрозу. Очищение Синайского полуострова от этих сил и уничтожение их способности вести наступательную войну в значительной степени обеспечит будущее нашей страны. Сегодня утром наши войска продвинулись вперед и быстро пересекли границу. Есть надежда, что использование фланговых маневров и продвижение по непредусмотренным противником маршрутам приведет к прорыву и победе."
 SIX_DAYS_WAR.27.d: "Наступление на Синай, к сожалению, окончилось неудачей. Усилия по обходу и уничтожению арабских формирований не оправдались, так как сопротивление оказалось гораздо более жестким, чем предполагалось. Хотя наши войска добились первых успехов и была надежда, что арабские силы рассыплются после первых ударов, противник устоял в достаточном количестве мест, чтобы сдержать продвижение. Не имея возможности сравниться с нашими войсками в маневренности и мастерстве, они смогли применить концентрированную огневую мощь, что и стало решающим фактором в сдерживании наших сил. Заторможенное наступление обошлось нашим силам в значительные потери в технике и личном составе"
 SIX_DAYS_WAR.28.d: "После непродолжительных боев наши силы стали бесспорными хозяевами Синайского полуострова и Газы. На Синае мы столкнулись со значительной арабской военной оппозицией, однако ее сопротивление и решимость рухнули очень рано. Наши войска и их офицеры смогли использовать скорость и маневренность для обхода, разделения и уничтожения вражеских формирований по частям. Наши победы сломили сопротивление противника, который в конце концов бежал, оставив Синай, которым мы теперь владеем. Газа с ее многочисленным враждебным арабским населением также была быстро взята под контроль, а сопротивление практически сразу же подавлено. В настоящее время она находится под военным управлением для обеспечения мира. Оккупировав Синай и Газу, мы получили буфер, защищающий нас от угрозы со стороны Каира, и контролируем враждебное арабское население, которое больше не может быть мобилизовано против нас"
  
  
