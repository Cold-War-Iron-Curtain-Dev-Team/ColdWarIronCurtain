l_russian:
 PolandRel.2.d: "Профессор и кардинал Стефан Вышиньский был недавно арестован после разгона «неблагонадежных» элементов польского общества и в настоящее время находится в тюрьме в Рювальде; польское правительство ссылается на его изменническое поведение в связи с продолжающейся волной арестов, за которыми следуют массовые судебные процессы и тюремное заключение. Он был недавно возведен в ранг кардинального священника Папой Римским и был заядлым социальным работником, а также помогал нескольким евреям во время нацистской оккупации Польши, прежде чем возглавить проект восстановления послевоенного Влоцлавека. Многие считают этот арест серьезной несправедливостью по отношению к Церкви и народу польскому."
  
 POL_The_Sovietization_of_Poland: "Советизация Польши"
 POL_The_Sovietization_of_Poland_desc: "After the Liberation from the Fascist Grasp, we now find ourselves in control of Poland. Sadly that does not mean we are going to have a easy time Governing the nation. Many aren't happy that a Socialist Party is in charge, not to mention having to respond to Soviets as our Overlords. The situation is dire but we must do our best to Improve it to the best of our Ability."
 POL_Begin_the_6_Year_Plan: "Начать шестилетний план"
 POL_Begin_the_6_Year_Plan_desc: "Now that we have finished the reconstruction of destroyed Industry, we can start the First Six Year Plan. Similar to the Soviet Five Year Plan, we will focus in this on expanding the Industry, dealing with Inflation, food shortage and housing."
 POL_Continue_the_3_Year_Plan: "Продолжить трехлетний план"
 POL_Continue_the_3_Year_Plan_desc: "Just like East Germany, we have to start a Three Year Plan to first fix our destroyed Industry before focusing on expanding our existing Industry. Not to mention finishing the Migration to our new gained land from the Germans."
 POL_Ludowe_Wojsko_Polskie: "Народное Войско Польское"
 POL_Ludowe_Wojsko_Polskie_desc: "The Polish People's Army is the result of the efforts by Joseph Stalin. Formed in 1943, it was founded in the Eastern Parts of Poland during Soviet Occupation, at a Single Force before being divided into two Armies. The many Veterans of World War Two are the going to help us reform our Armed Forces into a forced to be reckoned with!"
 POL_The_Death_of_Stalin: "Смерть Сталина"
 POL_The_Death_of_Stalin_desc: "With the death of the Man of Steel himself, our future is yet Unknown. One thing is for certain though. With Stalin's death, we will be able to loosen the grip on the Party from the Hardliners and begin to Liberalize the party!"
 POL_Secretary_Ochab: "Генсекретарь Охаб"
 POL_Secretary_Ochab_desc: "With the sudden Death of General Secretary Bierut, we will temporarily put Ochab as the head of State, until we can figure out who would be a worthy Successor to Bierut."
 POL_Create_the_ZSL: "Учредить ZSL"
 POL_Create_the_ZSL_desc: "The United People's Party was created as a result of Merging of two smaller communist parties. The party is based on Agrarianism an agrarian Socialism. It's yet not public that they are not completely Independent. A Satellite party of sorts, its task being to represent the Rural Workers of Poland."
 POL_Michejda_Support: "Поддержка Михейды"
 POL_Michejda_Support_desc: "To further give legitimacy to the recently Created ZSL, we have gotten praise and endorsment by the known Polish Physician and Politician Tadeusz Michejda. He has praised the party's Focus on the rural workers, which in his own words are often overlooked in the increasingly Urban Poland."
 POL_PAX_Association: "Ассоциация PAX"
 POL_PAX_Association_desc: "The PAX Association is a pro-communist Catholic organization created in 1947. It publishes the newspaper Slowo Powszechne on a daily basis. Its side task though is also to undermine grass-roots support for the Roman Catholic Church."
 POL_A_Peoples_Democracy: "Народная демократия"
 POL_A_Peoples_Democracy_desc: "Even if we are at the core Socialists, we still want to give the workers a voice. With the Establishment of the ZSL, we will give the option to regionally vote for either the PZPR or the PZL, letting the workers themselves decide who would be more suited for the region."
 POL_Imprison_Cardinal_Stefan_Wyszynski: "Посадить кардинала Вышиньского"
 POL_Imprison_Cardinal_Stefan_Wyszynski_desc: "The Cardinal Stefan Wyszynski has been a thorn in our side for a long time. While other parts of the Church have fallen in line with our Socialist doctrine, Stefan has been a very well known Critc of our repression, being a Symbol of Church that struggles against our repression. We need to lock him up and to shut him up."
 POL_Begin_the_Purge: "Начать чистки"
 POL_Begin_the_Purge_desc: "Unfortunately, there are still many War collaborators, Enemies of the Working class and the state in the streets, each day plotting on how they could overthrow our Socialist regime. We cannot let the enemies and Traitors put the nation in danger. This is why we will begin a hard purge, to eliminate each and every Traitor and Enemy of the Working Class!"
 POL_Eliminate_the_Nationalists: "Устранить националистов"
 POL_Eliminate_the_Nationalists_desc: "The biggest threat and the most urgent that we need to deal with, are the Nationalists. One would think that after the horrors the Nazis commited in Poland, no one would be insane enough to follow their Ideology. And yet here we are. Without question we'll crackdown as hard as possible on this scum."
 POL_Imprison_Gomulka: "Посадить Гомулку"
 POL_Imprison_Gomulka_desc: "For a long time now Boleslaw and Gomulka have been having a power struggle for a long time now. Well that Power struggle seems to have been ended now, as Bierut has imprisoned Gomulka, charging him with right wing deviation. The duration of the Prison sentence is yet to be determined."
 POL_Suspend_the_Purges: "Отложить чистки"
 POL_Suspend_the_Purges_desc: "With Gomulka Imprisoned, most enemies locked up or purged and the Nationalists being cracked down on, we can now stop the Purging. But we will continue to keep a close eye on the ones that have been spared the Purge, in case they try to reorganize or recruit new members to their Traitorous goals."
 POL_Reform_the_Party_Positions: "Реформы курса Партии"
 POL_Reform_the_Party_Positions_desc: "With Stalin gone, we can now finally begin to remove the hardline Stalinists in our Goverment and replacing them with Moderates and Reformists that won't try to shut down our future Laws and Policies."
 POL_Patriot_Priests: "Патриотические священники"
 POL_Patriot_Priests_desc: "Unlike other Socialist States, our nation's clergy is surprisingly very willing to cooperate with us. We have thus begun a a Program that funds so called Patriot Priests, that promote Christianity with Socialist Values!"
 POL_Merge_Combatant_Organizations: "Объединить боевые организации"
 POL_Merge_Combatant_Organizations_desc: "Unsuprisingly there many Paramilitary Organizations in our nation, that are spread all over the country and disorganized. To increase efficiency and to properly train these Combatants, we'll Merge them all into one."
 POL_Merge_the_Trade_Unions: "Объединить профсоюзы"
 POL_Merge_the_Trade_Unions_desc: "Just like the Combatant Organizations, the Trade Unions are spread out all over Poland, rarely communicating with eachother, if at all. Seizing the State Unions and turning them into State Trade Unions, it will make it easier to listen to the Workers Wishes and Problems!"
 POL_Church_State_Agreement: "Соглашение о государственной церкви"
 POL_Church_State_Agreement_desc: "The Goverment has reached out to the Cathlic Churches of Poland and proposed a Agreement. As long as they refrain from spreading anti-Socialist, we will soften our crackdown on the Clergy"
 POL_Begin_Drafting_the_Constitution: "Внести поправки в Конституцию"
 POL_Begin_Drafting_the_Constitution_desc: "The early stages of Sovietization has been a great success. Only thing that still remains is to begin writing a Socialist Constitution, since we still use the Constitution of the former Polish Goverment."
 POL_An_Ideological_Judiciary: "Идеологическая судебная система"
 POL_An_Ideological_Judiciary_desc: "After much Discussion, it was decided that a Ideological Judiciary will be Established. Not only will it oversee the drafting of the Constitution but it will also server as a Supreme court of sorts, dealing with very Important cases and ensuring State Security."
 POL_Legislative_Powers: "Законодательные полномочия"
 POL_Legislative_Powers_desc: "The old Constitution gave the provinces too much Freedom. The old Goverment preffered having the country decantralized. With this Constitution that will change, as we'll include Legislative Powers in the new Constitution, that will give the state more power and reduce the Indepence of each Province, centralizing the Goverment."
 POL_Jaworzno_Electric_Plant: "Электростанция в Явожно"
 POL_Jaworzno_Electric_Plant_desc: "The Fossil Fuel Electric Plant that we plan to build in Katowickie is one of our top priorities. With our Plans to expand our Industry on a huge Scale, we'll need as much Electric Power as possible."
 POL_Chemical_Institutes_in_West: "Химические институты на Западе"
 POL_Chemical_Institutes_in_West_desc: "One of the more Important Industry areas is the Chemical Industry, creating all sorts of Chemicals for Industrial use or Personal use. It's also a good starting stone for the first Expansion of the Polish Industry."
 POL_Chemical_Institutes_in_Silesia: "Химические институты в Силезии"
 POL_Chemical_Institutes_in_Silesia_desc: "Expending the Industry in the West, We should also develop the Chemical Industry in other parts of Poland. This time we have chosen Silesia, the province near to the Czechoslovak Border. This will be handy in case we manage to struck some kind of deal and sell some of our Chemical Products to Czechoslovakia."
 POL_Invest_in_Agriculture: "Инвестировать в агрокультуры"
 POL_Invest_in_Agriculture_desc: "We have a choice to chooese if we should in this Six Year Plan Invest into Agriculture or Industry. We have decided that it would be more beneficial if we Invest into Agriculture. This way we can make sure the economy recovers further while also making sure there is enough Food for the Workers!"
 POL_Invest_in_Industry: "Инвестировать в промышленность"
 POL_Invest_in_Industry_desc: "Instead of Focusing on Agriculture, we should focus on further developing our Industrial Parks, securing jobs for our People. With more open job places, we'll make sure everyone can have a job and won't become homeless or a beggar on the streets!"
 POL_Complete_the_Migrations: "Рабочие миграции"
 POL_Complete_the_Migrations_desc: "Having gained new territory from the Germans, we will establish a Program to increase Migration of Ethnic Poles from that region that were forced to flee the Nazi regime and the Second World War in general."
 POL_The_Opening_of_W-Z: "Открытие W-Z"
 POL_The_Opening_of_W-Z_desc: "The W-Z will be opened, its task being the Coordination of Industry Planning and Production of Tools needed in factories and on Construction Sites."
 POL_Currency_Reform: "Валютная реформа"
 POL_Currency_Reform_desc: "For a while now we've been suffering under High Inflation. Which Unsuprisingly isn't the greatest for our State and the common worker. Due to the Inflation, the workers cannot buy many goods, with the prices being so high. To fix this issue, we'll issue a currency Reform policy to fix the Inflation Problem."
 POL_Reitroduce_Ration_Stamps: "Восстановить карточную систему"
 POL_Reitroduce_Ration_Stamps_desc: "Having Dealth with the Inflation, another problem arose. A Famine. We have to act quickly before the Famine gets worse. Instead of Buying food from Neighbors, we shall instead Reintroduce Food Stamps and build a additional Farm to help with the Food Situation."
 POL_Increase_Civilian_Production: "Расширить гражданское производство"
 POL_Increase_Civilian_Production_desc: "During the war, many Important Civilian Industries that Produced a wide variety of Items, such as Consumer Goods. To make sure enough consumer goods are produced and our econmy grows further, we'll rebuild these factories and restore them to full function."
 POL_Przodownik_Pracy: "Ударный труд"
 POL_Przodownik_Pracy_desc: "The Shock Worker in English, are highly Productive and Super Enthusiasthic workers that dedicate their lives to the Socialist Cause. These Workers are regularly promoted all across the Eastern Block, to motivate and let the rest of the Workforce learn from these Shock Workers, maybe one day becoming just like them!"
 POL_Complete_the_3_Year_Plan: "Выполнить трехлетний план"
 POL_Complete_the_3_Year_Plan_desc: "Our hard work paid off! The destroyed Industries are booming again, our economy is Growing again and we can finally finish up Reconstruction, as well as the Third Year Plan."
 POL_Import_Food: "Импортировать еду"
 POL_Import_Food_desc: "We are in the middle of a Famine and as much as we'd prefer to ration the food, that won't go down well with the Workers. So Instead we'll Import food From the Soviet Union and other Eastern Block Nations"
 POL_Increase_Prices: "Повысить цены"
 POL_Increase_Prices_desc: "The Famine is slowly beginning to fade, we need to make sure this does not happen again. Incrasing the Prices of Products will help boost the Income of Farmers and Businesses, allowing them to gain more Profit and invest it into their Shops and Farms."
 POL_Wistula_Dam: "Вислинская плотина"
 POL_Wistula_Dam_desc: "Warsaw, after being almost Completely destroyed by the Germans in World War Two, has been slowly rebuilding. With the reconstruction and expansion of Warsaw, we'll build the Wistula Dam to ensure power keeps flowing into the city and supply it with clean green energy!"
 POL_Invest_in_Heavy_Industry: "Инвестировать в тяжелую промышленность"
 POL_Invest_in_Heavy_Industry_des: "While we invest into Light Industry and Industrial parks, we cannot forget about our Heavy Industry that produces many of our nation's weapons among other things. Investing into this sector as well, will further boost our Industrial Development!"
 POL_Expand_Bieruts_Mill: "Расширить мельницы Берута"
 POL_Expand_Bieruts_Mill_desc: "Bierut's Mill, named after our comrade General Secretary is a Foundry District located in Warsaw. It was named after him as thanks for supporting the Workers and bringing the Socialist Revolution to Poland."
 POL_Lenins_Mill: "Ленинская мельница"
 POL_Lenins_Mill_desc: "Just Like Bierut's Mill, it is only natural that we also have a Mill named after the Hero of the Socialist Revolution Vladimir Lenin. Even if we had conflicts in the past, we are now Socialist brothers and Comrades. Though unlike Bierut's Mill, the Lenin Mill will be Constructed in Gdansk!"
 POL_Stalins_Mill: "Сталинская мельница"
 POL_Stalins_Mill_desc: "To complete the Trilogy, we have also now named a Mill after the Man of Steel Himself, Joseph Stalin. His Mill will be just like Lenins Mill constructed in Gdansk. Bieruts, Lenins and Stalins Mills. The heroes of Socialism that help expand the Socialist Revolution each day!"
 POL_Uranium_Mines: "Урановые шахты"
 POL_Uranium_Mines_desc: "While expanding Warsaws city borders and digging holes to prepare House Block Fundaments, Uranium was discovered! Obviously we cannot build houses on a Uranium deposit so instead we'll construct a Uranium Mine. Who knows when it will come in handy?"
 POL_Marynarka_Wojenna: "ВМФ Польши"
 POL_Marynarka_Wojenna_desc: "The Naval Forces of Poland. Even if our nation isn't generally known for many Naval Battles and Achievements, that does not mean it is obsolete! Our naval forces that protect our coasts and fought bitterly with the German fleet during World War Two are a core part of our Army!"
 POL_Coastal_Defenses: "Береговая защита"
 POL_Coastal_Defenses_desc: "Even if we are currently protected by the Soviet Navy, that won't possibly always be the case. Thus we'll begin construction of Coastal Defenses in case any future enemies try to invade us from the sea!"
 POL_Expand_the_Mining_Sector: "Расширить сеть шахт"
 POL_Expand_the_Mining_Sector_desc: "The Mining Sector has always been an Important Industrial Sector. Expanding it will only benefit us in the long term plan."
 POL_Nowa_Huta: "Нова-Хута"
 POL_Nowa_Huta_desc: "Nowa Huta will be a example of what housing will look like in the Socialist Utopia that is Poland. For now though, Nowa Huta will be a socrealistic district that will be made strictly for propaganda purposes"
 POL_Expand_the_Polish_Marines: "Расширить корпус морпехов"
 POL_Expand_the_Polish_Marines_desc: "The Polish Marine. They aren't used very often, as we don't exactly have a need for Naval Special Ops, but we'll keep them around and Invest a bit into them. They might be useful at some point in the future."
 POL_Naval_Modernization: "Модернизация флота"
 POL_Naval_Modernization_desc: "Bigger coastline calls for a bigger fleet, yet our navy is underequipped for its job. The Baltic is a small sea, so focusing on modern destroyer-sized warships should be the way forward"
 POL_Invest_in_Gdansk_Shipyards: "Инвестировать в верфи Гданьска"
 POL_Invest_in_Gdansk_Shipyards_desc: "Ambitious pre-war plans for construction of warships in local facilities were brutally interrupted by the German invasion. Now however we have all the means neccesary to fulfull this goal, and finally reclaimed Gdansk will be the perfect starting point for polish dockyard industry."
 POL_Wojska_Ladowe: "Войско сухопутное"
 POL_Wojska_Ladowe_desc: "The Wojska Ladowe is our Ground Forces. Consisting of many Veterans of World War Two, from Partisans to former Army Soldiers and Generals, they are the backbone of our nation, Protecting the Borders of our now Socialist State."
 POL_Adopt_the_AK_47: "Внедрить АК-47"
 POL_Adopt_the_AK_47_desc: "The AK-47 developed in the Soviet Union is a Superior design to anything that the West had to offer so far. It was advised that we should adopt this weapon as well, starting immidiate Production in our Factories."
 POL_Reform_the_Officer_Corps: "Реформировать офицерский корпус"
 POL_Reform_the_Officer_Corps_desc: "Our Current General Officer Corps is not as Organized as we'd like. They don't have any sort of Head of the Corps and the different Officers execute plans without communicating with others. With our Reform, we'll create a Large Military General Staff."
 POL_Import_the_T55: "Импортировать Т-55"
 POL_Import_the_T55_desc: "Our Tank reserves aren't looking bright. Many of them consisting of Pre-War and Post-War tanks. To bolster and modernize the Stockpile we'll Import a bunch of Soviet T-55 Tanks from the Eastern Block"
 POL_Embrace_Soviet_Doctrine: "Внедрить советскую доктрину"
 POL_Embrace_Soviet_Doctrine_desc: "The offensives of 1944 and 1945 carried out by the Red Army have proven the quality of their tactics. If we are to fight side by side, a logical step would be adopting similar battlefield philosophies"
 POL_Yak_17s: "Избытки советских истребителей"
 POL_Yak_17s_desc: "The Soviets have a bunch of of Surplus fighters laying around our Nation. We are sure that they won't mind if we take them and use them to bolster our own Air Force"
 POL_Expand_Anti_Air_Defenses: "Расширить системы ПВО"
 POL_Expand_Anti_Air_Defenses_desc: "No one wants the nightmares of 1939 when German bombs destroyed our cities to return. We must invest in our stationary anti-aircraft defences, so that each city will become a deadly trap for enemy bombers in the future"
 POL_Yak_23s: "Як-23"
 POL_Yak_23s_desc: "The Yak-23s are our own First Jet Fighters that we have developed while occupied by the Soviets. We still have a bunch of them in our Hangars collecting dust. Instead of letting them rust away, we'll put them back into service!"
 POL_MiG_15: "МиГ-15"
 POL_MiG_15_desc: "To finish up our restocking and Modernizing of the Polish Air Force, we'll Import some MiG-15s from the Eastern Block, making sure the West knows our Air Force is not to be messed with!"
 POL_Debate_Executive_Powers: "Обсудить полномочия исполнительной власти"
 POL_Debate_Executive_Powers_desc: "Executive Powers are a hot topic. People generally don't like when they are enacted, since it Bypasses the democratic Aspects of Socialism and gives all Power to one person. We will include a section about it in our constitution, but Executive Powers will be only able to be enacted in Very dire Emergencies."
 POL_Seek_Soviet_Apporval: "Сыскать одобрение Советов"
 POL_Seek_Soviet_Apporval_desc: "With our Constitution Draft finished, we'll ask the Soviet Union just to be sure there aren't any parts of it that might offend the Leadership"
 POL_Enact_the_Constitution: "Принять Конституцию"
 POL_Enact_the_Constitution_desc: "Having recieved no Complaints from the Soviets, we can now Enact our Socialist Constitution and finally replace the old Constitution, finishing the long awaited Sovietization of Poland!"
 POL_Dockyards_in_Gdansk: "Верфи Гданьска"
 POL_Dockyards_in_Gdansk_desc: "Gdansk returned to us destroyed after the war, and it is up to us to bring it back to its former glory. There is no better way for a coastal city to develop than shipbuilding industry, expanding of which should be our main priority"
 POL_The_Fourth_Congress_of_the_PPR: "Четвертый съезд ПОРП"
 POL_The_Fourth_Congress_of_the_PPR_desc: "With the death of Stalin and Reforming of Party Positions, we will hold the Fourth Congress of the PPR, deciding the Future Direction of our Party."
 POL_The_Death_of_Bierut: "Смерть Берута"
 POL_The_Death_of_Bierut_desc: "Unfortunately, after suffering of bad Health Conditions after the 20th Congress of the CPSU, General Secretary Bierut has passed away in a Moscow Hospital. This is an unfortunate and sudden tragedy. A funeral will be planned as quickly as possible and a time of Mourning has been announced across the nation."
 POL_Embrace_Destalinization: "Начать десталинизацию"
 POL_Embrace_Destalinization_desc: "With Ochab as our General Secretary, it was announced that we would be embracing the Destalinization Policies that have been spreading across the Eastern Block after the death of Stalin."
 POL_Reduce_Press_Censorship: "Ослабить цензуру прессы"
 POL_Reduce_Press_Censorship_desc: "As part of Ochab's Liberalization efforts, it was decided to Reduce Censorship of the Press, to give the Workers a louder voice in the matters of the Goverment"
 POL_Mass_Amnesty: "Массовая амнистия"
 POL_Mass_Amnesty_desc: "There are still many Political enemies locked up that were arrested during the Stalinist Regime. We will review these Political Enemies. Those who haven't committed any serious crimes will be released."
 POL_Curtail_the_Secret_Police: "Закрыть Секретную полицию"
 POL_Curtail_the_Secret_Police_desc: "The Secret Services have been given a free handed for too long. They have been brutal with their Operations under Bierut's goverment. We will Curtail them and put them on a leash. Those who refuse to follow new Guidelines will be suspended and removed from Office"
 POL_Empower_the_Sejm: "Власть Сейма"
 POL_Empower_the_Sejm_desc: "To further Liberalize the goverment, we'll Empower the Sejm governing assembly. With this, there will be a more democratic approach to future Laws and Policies, as they'll have to be debated in the Sejm first!"
 POL_The_Poznan_Uprising: "Познанский июнь"
 POL_The_Poznan_Uprising_desc: "A mass scale Uprising has happened in the town of Poznan. We aren't aware of all the details but according to our intelligence, over 100,000 people gathered and are protesting our rule. The army and Security Corps have been informed and sent orders to hold back the Protestors. In case things get out of hand, use of lethal force is permitted."
 POL_Polish_October: "Польский Октябрь"
 POL_Polish_October_desc: "For the Polish People's Republic, 1956 was a year of transition. The international situation significantly weakened the hardline Stalinist faction in Poland, especially after the Polish communist leader Boleslaw Bierut died in March. Three years had passed since Joseph Stalin's death.  Protests by Poznan workers in June had highlighted the people's dissatisfaction with their situation. In October, the events resulted in the rise in popularity of the reformers' faction, led by Wladyslaw Gomulka."
 POL_The_Gomulka_Thaw: "Оттепель Гомулки"
 POL_The_Gomulka_Thaw_desc: "It has been decided that the now free Gomulka, that had been before been Imprisoned by Bierut wil become the new General Secretary. Seen as a moderate, he was the best the Hardliners and Reformers could agree on."
 POL_First_Secretary_Zawadzki: "Генсекретарь Завадский"
 POL_First_Secretary_Zawadzki_desc: "Alexander Zawadzki has managed to outbeat his enemy Gomulka and was able to secure the Leadership of Poland. Zawadzki is much different from his Opponent Gomulka. Where Gomulka is a more moderate personality, Zawadzki is a Hard Pro-Soviet Communist. He plans to allign the nation more to the Soviet Union while also adapting Soviet Culture into their Polish ones."
 POL_Dismiss_Rokossovsky: "Отвергнуть Рокоссовского"
 POL_Dismiss_Rokossovsky_desc: "Rokossovsky, a Soviet General that is stationed in Poland, has violently surpressed the Poznan Uprising. Gomulka has decided to dismiss him and to send him back to the Soviet Union."
 POL_Placate_Soviet_Fears: "Успокоить страхи Советов"
 POL_Placate_Soviet_Fears_desc: "The Soviets worry that just because we have Gomulka as our General Secretary, fearing that we will begin splitting away and letting Capitalists take over the nation. The soviets worry too much. We will Placate Soviet Fears and ensure them we are not planning to leave the Warsaw Pact anytime soon."
 POL_Decrease_Church_Persecutions: "Ослабить гонения на церковь"
 POL_Decrease_Church_Persecutions_desc: "The Persecutions of the Church done by the previous Goverment was brutal and done for no reason other than to try and push the nation to Atheism. Now that we are in charge though, we'll Decrease the Persecutions of the Church."
 POL_Condemn_Nationalist_Rhetoric: "Осудить националистическую риторику"
 POL_Condemn_Nationalist_Rhetoric_desc: "Even if there aren't many things that the Bierut Goverment did well, the Nationalists supression is one of the few. Nationalists, the ones that only a few years back almost Completely destroyed Warsaw during World War Two somehow still remain in our nation. We need to condemn this Ideology!"
 POL_Allow_Moderate_Electoral_Freedom: "Дозволить умеренную свободу выборов"
 POL_Allow_Moderate_Electoral_Freedom_desc: "If we aren't about to establish a full democracy, we will instead Allow Moderate Electoral Freedom, letting the workers have a wider choice of who to vote for while still retaining our grip of the Nation"
 POL_Population_Reperation_Agreement_with_the_Soviets: "Соглашение о репатриации с СССР"
 POL_Population_Reperation_Agreement_with_the_Soviets_desc: "Many of our Population have suffered greatly under the Soviet and German boot. Thus we will attempt to try and reach an Reparation Agreement with the Soviets, enticing the Population to move back into their former homeland."
 POL_Condemn_Factionalism: "Осудить фракционнализм"
 POL_Condemn_Factionalism_desc: "Even if we have differences between other Party members, we still need to cooperate and Condemn Factionalism of the Party. Only united wil be able to truly achieve a Socialist Paradise!"
 POL_Cultural_Liberalization: "Культурная либерализация"
 POL_Cultural_Liberalization_desc: "The Bierut Goverment has had quite a tight grip on the Polish Culture, restricting it and stopping people from seeing any sort of Western Media. Now though that the Stalinist Hardliners are gone, we can begin Implementation of Liberalization Policies."
 POL_Expand_Western_Ties: "Расширить связи с Западом"
 POL_Expand_Western_Ties_desc: "Having ties with the Eastern Block is simply not enough, we should Expand our Ties with the West, even if the Soviets might not be very happy about this. If we establish Ties with the West, we'll be able also acces Western markets."
 POL_The_Little_Stabilization: "Небольшая стабилизация"
 POL_The_Little_Stabilization_desc: "Our reforms are slowly settling into our Workers, embracing them and enjoying things that would never be able under Bierut. Our people are satisfied and everyone can tell that the Goverment is being more Liberal, more open and more friendly to the Workers wishes. This has cause the nation to experience some Stabilization."
 POL_Abandon_Collective_Agriculture: "Свернуть коллективизацию"
 POL_Abandon_Collective_Agriculture_desc: "The Policy of Collective Agriculture is a policy that is cruel to the Rural Workers and Farmers. Forcing the people to fulfill Quotas and take away their land they owned for Centuries just for the state to use it is not fair and simply cannot Stand. We will Abandon this Policy and give the Farmers back their rights."
 POL_Rehabilitate_the_Purged_Members: "Реабилитация репрессированых"
 POL_Rehabilitate_the_Purged_Members_desc: "Many former members just like Gomulka were Purged due to ridiculous charges, because Bierut feared that there was a Conspiracy against him and the rest of the Communist Party. With Bierut being gone though, we'll now focus on Rehabilitating Purged Members."
 POL_Reduce_Soviet_Influence: "Сократить советское вмешательство"
 POL_Reduce_Soviet_Influence_desc: "The Soviets currently hold too much Control over our Nation. They Influence every bits of the nation from Politics to its army. If we ever we want gain our freedom from the Soviets, we will need to start reducing the Influence of the Soviets."
 POL_Crush_the_Protests: "Сокрушить протесты!"
 POL_Crush_the_Protests_desc: "We cannot let these Traitors and Anti-Revolutionaries Riot in the streets. We will Crush these Traitos and enact Martial Law until the Situation calms down."
 POL_Empower_the_Natolin_Faction: "Власть фракции натолинцев"
 POL_Empower_the_Natolin_Faction_desc: "The Natolin faction was a faction within the leadership of the communist Polish United Workers' Party. Formed around 1956, shortly after the 20th Congress of the Communist Party of the Soviet Union, it was named after the place where its meetings took place, in a government villa in Natolin. The main opposition to the Natolines was the Pulawian faction, which united many Stalinist party members of Jewish origin. Natolinians were against the post-Stalinist liberalization programs (the "thaw") and they proclaimed simple nationalist and anti-Soviet slogans as part of a strategy to gain power."
 POL_Strengthen_the_State_Security_Apparatus: "Усилить аппарат госбезопасности"
 POL_Strengthen_the_State_Security_Apparatus_desc: "There are still many enemies lurking around the State, hiding in the Shadows and waiting to Strike. But we will not give them the chance! By Strengthening the State Security Apparatus we'll root each and every single one of them out!"
 POL_Reopen_the_Prison_Camps: "Возродить систему концлагерей"
 POL_Reopen_the_Prison_Camps_desc: "Our Prison are getting filled with Enemies of the Revolution just sitting and rotting away. But they could Instead be used working to redeem themselves. To give them that chance of redemption, we'll reopen Prison Camps, establishing the policy that the Longer and more you work, the shorter your sentence wil get."
 POL_Launch_Anti_Catholicism_Campaign: "Начать антикатолическую кампанию"
 POL_Launch_Anti_Catholicism_Campaign_desc: "Beirut had at first the right idea with reaching a Agreement with the Church to stop them from spreading anti-Socialist propaganda. Though, it didn't go far enough. Instead of reaching another Agreement with the Church, we'll launch a Anti Catholicism Campaign to once and for all get rid of the Church and establish a true Atheist Socialist Paradise!"
 POL_Request_Further_Soviet_Economic_Aid: "Запросить экономическую помощь у СССР"
 POL_Request_Further_Soviet_Economic_Aid_desc: "Even as our Industry grows, it is not enough. We are missing something. Maybe one of our Policies isn't done correctly or we are using outdated methods? To solve this problem, there's a simply Solution. By inviting Soviet Economic Aid and Advisors, it'll boost our economy!"
 POL_Expand_the_Ludowe_Wojsko_Polskie: "Расширить Народное Войско"
 POL_Expand_the_Ludowe_Wojsko_Polskie_desc: "Even if our Borders are secured, it wouldn't hurt to Expand our Ludowe Wojsko Polskie. With the Expansion, our borders will be secured even more. And if any other Invader should attempt to invade us, they'll be in for a nasty surprise."
 POL_Deny_the_Katyn_Massacre: "Отрицать Катынский расстрел"
 POL_Deny_the_Katyn_Massacre_desc: "The Katyn massacre was a series of mass executions of nearly 22,000 Polish military officers and intelligentsia prisoners of war carried out by the Soviet Union, specifically the NKVD ("People's Commissariat for Internal Affairs", the Soviet secret police) in April and May 1940. Though the killings also occurred in the Kalinin and Kharkiv prisons and elsewhere, the massacre is named after the Katyn Forest, where some of the mass graves were first discovered by German forces. The massacre was initiated in NKVD chief Lavrentiy Beria's proposal to Joseph Stalin to execute all captive members of the Polish officer corps, which was approved by the Soviet Politburo led by Stalin.Of the total killed, about 8,000 were officers imprisoned during the 1939 Soviet invasion of Poland, another 6,000 were police officers, and the remaining 8,000 were Polish intelligentsia the Soviets deemed to be intelligence agents and gendarmes, spies and saboteurs, former landowners, factory owners and officials. The Polish Army officer class was representative of the multi-ethnic Polish state; the murdered included ethnic Poles, Ukrainians, Belarusians, and Jews including the chief Rabbi of the Polish Army, Baruch Steinberg."
 POL_Launch_Anti_Semitic_Campaign: "Начать антисемитскую кампанию"
 POL_Launch_Anti_Semitic_Campaign_desc: "Anti Semetism? In Poland? Under Socialist Rule? Nope. Never. Fake news."
 POL_Increase_Trade_within_the_East_Bloc: "Увеличить торговлю с Восточным Блоком"
 POL_Increase_Trade_within_the_East_Bloc_desc: "We don't need filthy Western Markets. We only need our comrades in the Eastern Block and The Soviet Union. Trading With other Socialist nations will be more than enough to get all the materials our nation needs!"
 POL_Emulate_Soviet_Culture: "Подражать советской кульутре"
 POL_Emulate_Soviet_Culture_desc: "Zawadzki has for a long time loved the Soviet culture. Even before he became General Secretary. But now that he is in charge of the Nation, he can actually set the plans in motion and Start implementing Socialist and Soviet culture, making it a core of Socialist Poland."
 POL_Purge_the_Pulawowanie: "Ликвидировать пулавян"
 POL_Purge_the_Pulawowanie_desc: "Pulawianie was an informal designation of one of two peer groups of communists in postwar politics of Stalinist Poland, bidding for power within the leadership of the Polish United Workers' Party in spring of 1956, following Bierut's death. They were known as the reformists during Poland's de-Stalinisation process."
 POL_Arrest_Gomulka_Oncemore: "Арестовать Гомулку еще раз"
 POL_Arrest_Gomulka_Oncemore_desc: "Bending to Pressure of the Protestors and releasing Gomulka was a mistake. We'll arrest him once more, this time for good. With Gomulka out of the race, Zawadzki will have secured his Position as General Secretary, with no more Political Infighting."
 POL_Release_Gomulka: "Освободить Гомулку"
 POL_Release_Gomulka_desc: "The Demonstarters Demand that we release Gomulka at once, caliming that we accused him of false charges and he is a Innocent man. Usually we'd ignore this demand. But with how the Situation is, the Smallest Spark could cause a Revolution that will give it all to remove us from Power."
 POL_Resist_Comecon_Demands: "Оказать сопротивление требованиям СЭВ"
 POL_Resist_Comecon_Demands_desc: "Another Demand is from the Demonstarters is, to reject the Soviet COMECON Demands. As much as we don't want to harm our relationship with the Soviets, It will have to be accepted. Otherwise the Strikers might make more harsh demands."
 POL_Synthetic_Fiber_of_Gorzaw: "Синтетика Гожува-Великопольского"
 POL_Synthetic_Fiber_of_Gorzaw_desc: "Gorzow is one ofthe few places in Poland that Synthetic Fiber is produced. To ensure the demands of the Workers are met, we'll open more Synthetic Fiber Factories!"
 POL_Sily_Powietrzne: "ВВС Польши"
 POL_Sily_Powietrzne_desc: "Our Air Force, is a bit dry since World War Two. Many of them have been either flied over to Romania or Captured by the Germans. We have gained a few newer models from the Sovietes, but that will not suffice. Poland requires a proper Air Force!"
