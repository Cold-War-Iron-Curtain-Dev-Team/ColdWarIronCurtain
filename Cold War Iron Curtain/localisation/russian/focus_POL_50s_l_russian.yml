l_english:
 PolandRel.2.d: "Профессор и кардинал Стефан Вышиньский был недавно арестован после разгона «неблагонадежных» элементов польского общества и в настоящее время находится в тюрьме в Рювальде; польское правительство ссылается на его изменническое поведение в связи с продолжающейся волной арестов, за которыми следуют массовые судебные процессы и тюремное заключение. Он был недавно возведен в ранг кардинального священника Папой Римским и был заядлым социальным работником, а также помогал нескольким евреям во время нацистской оккупации Польши, прежде чем возглавить проект восстановления послевоенного Влоцлавека. Многие считают этот арест серьезной несправедливостью по отношению к Церкви и народу польскому."
 POL_The_Sovietization_of_Poland: "Советизация Польши"
 POL_The_Sovietization_of_Poland_desc: "После освобождения от фашистских захватчиков мы оказались во власти Польши. К сожалению, это не означает, что нам будет легко управлять страной. Многие не в восторге от того, что у власти находится социалистическая партия, не говоря уже о том, что нам приходится отвечать Советам как нашим повелителям. Ситуация тяжелая, но мы должны сделать все возможное, чтобы улучшить ее в меру наших возможностей."
 POL_Begin_the_6_Year_Plan: "Начать шестилетний план"
 POL_Begin_the_6_Year_Plan_desc: "Теперь, когда мы закончили восстановление разрушенной промышленности, мы можем приступить к реализации первого шестилетнего плана. Как и в советской пятилетке, в этом плане мы сосредоточимся на расширении промышленности, решении проблем инфляции, нехватки продовольствия и жилья."
 POL_Continue_the_3_Year_Plan: "Продолжить трехлетний план"
 POL_Continue_the_3_Year_Plan_desc: "Как и в Восточной Германии, мы должны начать трехлетний план, чтобы сначала восстановить разрушенную промышленность, а затем сосредоточиться на расширении существующей. Не говоря уже о завершении миграции на наши новые земли, отвоеванные у немцев."
 POL_Ludowe_Wojsko_Polskie: "Народное Войско Польское"
 POL_Ludowe_Wojsko_Polskie_desc: "Польская народная армия результат усилий Иосифа Сталина. Сформированная в 1943 году, она была основана в восточных районах Польши во время советской оккупации как единая сила, а затем была разделена на две армии. Многочисленные ветераны Второй мировой войны помогут нам реформировать наши вооруженные силы, чтобы с ними можно было считаться!"
 POL_The_Death_of_Stalin: "Смерть Сталина"
 POL_The_Death_of_Stalin_desc: "После смерти самого Человека из стали наше будущее пока неизвестно. Но одно можно сказать наверняка. Со смертью Сталина мы сможем ослабить контроль над партией со стороны сторонников жесткой линии и начать либерализацию партии!"
 POL_Secretary_Ochab: "Генсекретарь Охаб"
 POL_Secretary_Ochab_desc: "В связи с внезапной смертью генерального секретаря Берута, мы временно назначаем Охаба главой государства, пока не выясним, кто будет достойным преемником Берута."
 POL_Create_the_ZSL: "Учредить ZSL"
 POL_Create_the_ZSL_desc: "Объединенная народная партия была создана в результате слияния двух небольших коммунистических партий. В основе партии лежит аграризм и аграрный социализм. Пока еще не обнародовано, что они не являются полностью независимыми. Это своего рода партия-спутник, задача которой представлять интересы сельских рабочих Польши"
 POL_Michejda_Support: "Поддержка Михейды"
 POL_Michejda_Support_desc: "Чтобы придать легитимность недавно созданной ЗСЛ, мы получили похвалу и поддержку от известного польского врача и политика Тадеуша Михейды. Он высоко оценил внимание партии к сельским рабочим, которые, по его собственным словам, часто остаются без внимания во все более урбанизированной Польше."
 POL_PAX_Association: "Ассоциация PAX"
 POL_PAX_Association_desc: "Ассоциация PAX это прокоммунистическая католическая организация, созданная в 1947 году. Она ежедневно издает газету Slowo Powszechne. Ее основной задачей является подрыв поддержки Римско-католической церкви со стороны населения."
 POL_A_Peoples_Democracy: "Народная демократия"
 POL_A_Peoples_Democracy_desc: "Даже если мы в основе своей социалисты, мы все равно хотим дать рабочим право голоса. С созданием ЗСЛ мы предоставим возможность голосовать на региональном уровне за ПЗПР или ПЗЛ, позволив самим рабочим решать, кто больше подходит для своего региона."
 POL_Imprison_Cardinal_Stefan_Wyszynski: "Посадить кардинала Вышиньского"
 POL_Imprison_Cardinal_Stefan_Wyszynski_desc: "Кардинал Стефан Вышинский долгое время был шипом на нашей стороне. В то время как другие части Церкви присоединились к нашей социалистической доктрине, Стефан был очень известным критиком наших репрессий, являясь символом Церкви, которая борется против наших репрессий. Мы должны посадить его в тюрьму и заткнуть ему рот."
 POL_Begin_the_Purge: "Начать чистки"
 POL_Begin_the_Purge_desc: "К сожалению, на улицах еще много пособников войны, врагов рабочего класса и государства, каждый день замышляющих, как свергнуть наш социалистический режим. Мы не можем позволить врагам и предателям подвергнуть нацию опасности. Поэтому мы начнем жесткую чистку, чтобы уничтожить всех и каждого предателя и врага рабочего класса!"
 POL_Eliminate_the_Nationalists: "Устранить националистов"
 POL_Eliminate_the_Nationalists_desc: "Самая большая угроза и самая срочная проблема, с которой нам нужно бороться, это националисты. Можно подумать, что после ужасов, которые нацисты совершили в Польше, никто не будет настолько безумен, чтобы следовать их идеологии. И все же мы здесь. Без сомнения, мы будем как можно жестче преследовать эту мразь."
 POL_Imprison_Gomulka: "Посадить Гомулку"
 POL_Imprison_Gomulka_desc: "Уже долгое время между Болеславом и Гомулкой идет борьба за власть. Похоже, эта борьба за власть закончилась, так как Берут посадил Гомулку в тюрьму, обвинив его в уклоне в правое крыло. Срок тюремного заключения еще не определен."
 POL_Suspend_the_Purges: "Отложить чистки"
 POL_Suspend_the_Purges_desc: "Поскольку Гомулка заключен в тюрьму, большинство врагов заперты или вычищены, а националистов пресекли, мы можем остановить чистку. Но мы будем продолжать внимательно следить за теми, кто избежал чистки, на случай, если они попытаются реорганизоваться или завербовать новых членов для достижения своих предательских целей."
 POL_Reform_the_Party_Positions: "Реформы курса Партии"
 POL_Reform_the_Party_Positions_desc: "Теперь, когда Сталин ушел, мы можем наконец начать удалять жестких сталинистов в нашем правительстве и заменять их умеренными и реформистскими, которые не будут пытаться блокировать наши будущие законы и политику."
 POL_Patriot_Priests: "Патриотические священники"
 POL_Patriot_Priests_desc: "В отличие от других социалистических государств, духовенство нашей страны на удивление охотно сотрудничает с нами. Поэтому мы начали программу, которая финансирует так называемых священников-патриотов, пропагандирующих христианство с социалистическими ценностями!"
 POL_Merge_Combatant_Organizations: "Объединить боевые организации"
 POL_Merge_Combatant_Organizations_desc: "Как ни странно, в нашей стране существует множество военизированных организаций, которые разбросаны по всей стране и неорганизованны. Чтобы повысить эффективность и должным образом обучить этих бойцов, мы объединим их в одну."
 POL_Merge_the_Trade_Unions: "Объединить профсоюзы"
 POL_Merge_the_Trade_Unions_desc: "Как и боевые организации, профсоюзы разбросаны по всей Польше и редко контактируют друг с другом, если вообще контактируют. Захват государственных союзов и превращение их в государственные профсоюзы позволит легче прислушиваться к желаниям и проблемам трудящихся!"
 POL_Church_State_Agreement: "Соглашение о государственной церкви"
 POL_Church_State_Agreement_desc: "Правительство обратилось к Польской Католической Церкви и предложило соглашение. Если они будут воздерживаться от распространения антисоциалистических идей, мы смягчим репрессии против духовенства."
 POL_Begin_Drafting_the_Constitution: "Внести поправки в Конституцию"
 POL_Begin_Drafting_the_Constitution_desc: "Начальный этап советизации прошел успешно. Осталось только написать социалистическую конституцию, поскольку мы до сих пор пользуемся конституцией бывшего польского правительства."
 POL_An_Ideological_Judiciary: "Идеологическая судебная система"
 POL_An_Ideological_Judiciary_desc: "После долгих обсуждений было принято решение об создании Идеологической судебной власти. Она не только будет следить за разработкой Конституции, но и станет своего рода Верховным судом, рассматривающим особо важные дела и обеспечивающим безопасность государства."
 POL_Legislative_Powers: "Законодательные полномочия"
 POL_Legislative_Powers_desc: "Старая Конституция давала провинциям слишком много свободы. Старое правительство предпочитало децентрализацию страны. С этой Конституцией все изменится, так как мы включим в новую Конституцию законодательные полномочия, что даст государству больше власти и уменьшит независимость каждой провинции, централизуя правительство."
 POL_Jaworzno_Electric_Plant: "Электростанция в Явожно"
 POL_Jaworzno_Electric_Plant_desc: "Электростанция на ископаемом топливе, которую мы планируем построить в Катовице, - одна из наших первоочередных задач. С нашими планами по расширению промышленности в огромных масштабах нам понадобится как можно больше электроэнергии."
 POL_Chemical_Institutes_in_West: "Химические институты на Западе"
 POL_Chemical_Institutes_in_West_desc: "Одна из важнейших отраслей промышленности химическая, создающая всевозможные химикаты для промышленного или личного использования. Это также хороший стартовый камень для первой экспансии польской промышленности."
 POL_Chemical_Institutes_in_Silesia: "Химические институты в Силезии"
 POL_Chemical_Institutes_in_Silesia_desc: "Развивая промышленность на западе, мы должны развивать химическую промышленность и в других частях Польши. На этот раз мы выбрали Силезию, провинцию рядом с чехословацкой границей. Это будет удобно в том случае, если нам удастся заключить какую-нибудь сделку и продать часть нашей химической продукции Чехословакии."
 POL_Invest_in_Agriculture: "Инвестировать в агрокультуры"
 POL_Invest_in_Agriculture_desc: "У нас есть выбор - инвестировать в сельское хозяйство или промышленность в рамках этого шестилетнего плана. Мы решили, что выгоднее будет инвестировать в сельское хозяйство. Так мы сможем обеспечить дальнейшее восстановление экономики и одновременно убедиться, что у нас будет достаточно еды для рабочих!"
 POL_Invest_in_Industry: "Инвестировать в промышленность"
 POL_Invest_in_Industry_desc: "Вместо того чтобы концентрироваться на сельском хозяйстве, мы должны сосредоточиться на дальнейшем развитии наших промышленных парков, обеспечивая людей работой. С большим количеством открытых рабочих мест мы будем уверены, что каждый сможет найти работу и не станет бездомным или попрошайкой на улице!"
 POL_Complete_the_Migrations: "Рабочие миграции"
 POL_Complete_the_Migrations_desc: "Отвоевав у немцев новую территорию, мы создадим Программу по увеличению миграции этнических поляков из этого региона, которые были вынуждены спасаться от нацистского режима и Второй мировой войны в целом."
 POL_The_Opening_of_W-Z: "Открытие W-Z"
 POL_The_Opening_of_W-Z_desc: "Будет открыт W-Z, задачей которого станет координация планирования промышленности и производства инструментов, необходимых на заводах и строительных площадках."
 POL_Currency_Reform: "Валютная реформа"
 POL_Currency_Reform_desc: "Уже некоторое время мы страдаем от высокой инфляции. Что, как ни удивительно, не лучшим образом сказывается на нашем государстве и простых рабочих. Из-за инфляции рабочие не могут купить многие товары, так как цены на них очень высоки. Чтобы решить эту проблему, мы проведем валютную реформу, чтобы решить проблему инфляции."
 POL_Reitroduce_Ration_Stamps: "Восстановить карточную систему"
 POL_Reitroduce_Ration_Stamps_desc: "Справившись с инфляцией, возникла другая проблема. Голод. Мы должны действовать быстро, пока голод не стал еще хуже. Вместо того чтобы покупать еду у соседей, мы снова введем талоны на питание и построим дополнительную ферму, чтобы помочь с продовольственной ситуацией."
 POL_Increase_Civilian_Production: "Расширить гражданское производство"
 POL_Increase_Civilian_Production_desc: "Во время войны было разрушено множество важных гражданских предприятий, которые производили широкий спектр товаров, например, потребительские товары. Чтобы обеспечить производство достаточного количества потребительских товаров и дальнейший рост нашей экономики, мы восстановим эти заводы и вернем им полную функциональность."
 POL_Przodownik_Pracy: "Ударный труд"
 POL_Przodownik_Pracy_desc: "Ударники - это высокопроизводительные и супер энтузиасты, которые посвящают свою жизнь социалистическому делу. Этих работников регулярно повышают по всему Восточному блоку, чтобы мотивировать и дать возможность остальным рабочим учиться у этих удивительных работников и, возможно, однажды стать такими же, как они!"
 POL_Complete_the_3_Year_Plan: "Выполнить трехлетний план"
 POL_Complete_the_3_Year_Plan_desc: "Наша тяжелая работа окупилась! Разрушенная промышленность снова процветает, наша экономика снова растет, и мы наконец-то можем закончить Реконструкцию, а также Трехлетний план."
 POL_Import_Food: "Импортировать еду"
 POL_Import_Food_desc: "Мы переживаем голод, и как бы мы ни хотели нормировать продукты, это не понравится рабочим. Поэтому вместо этого мы будем импортировать продовольствие из Советского Союза и других стран Восточного блока."
 POL_Increase_Prices: "Повысить цены"
 POL_Increase_Prices_desc: "Голод постепенно начинает стихать, и нам нужно сделать так, чтобы это не повторилось. Повышение цен на товары поможет увеличить доходы фермеров и предпринимателей, что позволит им получать больше прибыли и вкладывать ее в свои магазины и фермы."
 POL_Wistula_Dam: "Вислинская плотина"
 POL_Wistula_Dam_desc: "Варшава, почти полностью разрушенная немцами во время Второй мировой войны, медленно восстанавливается. По мере восстановления и расширения Варшавы мы построим плотину Вислы, чтобы обеспечить поступление электроэнергии в город и снабдить его чистой зеленой энергией!"
 POL_Invest_in_Heavy_Industry: "Инвестировать в тяжелую промышленность"
 POL_Invest_in_Heavy_Industry_des: "Инвестируя в легкую промышленность и индустриальные парки, мы не можем забывать о тяжелой промышленности, которая производит многие виды вооружений нашей страны. Инвестиции в этот сектор также будут способствовать дальнейшему развитию промышленности!"
 POL_Expand_Bieruts_Mill: "Расширить мельницы Берута"
 POL_Expand_Bieruts_Mill_desc: "Мельница Берута, названная в честь нашего товарища генерального секретаря, - это литейный район, расположенный в Варшаве. Она была названа в его честь в благодарность за поддержку рабочих и социалистическую революцию в Польше."
 POL_Lenins_Mill: "Ленинская мельница"
 POL_Lenins_Mill_desc: "Как и в случае с мельницей Берута, вполне естественно, что и у нас есть мельница, названная в честь героя социалистической революции Владимира Ильича Ленина. Даже если в прошлом у нас были конфликты, теперь мы братья и товарищи-социалисты. Правда, в отличие от мельницы Берута, мельница Ленина будет построена в Гданьске!"
 POL_Stalins_Mill: "Сталинская мельница"
 POL_Stalins_Mill_desc: "Чтобы завершить трилогию, мы также назвали завод в честь самого Человека из стали, Иосифа Сталина. Его мельница будет такой же, как и мельница Ленина, построенная в Гданьске. Мельницы Бьеруца, Ленина и Сталина. Герои социализма, которые помогают расширять социалистическую революцию каждый день"
 POL_Uranium_Mines: "Урановые шахты"
 POL_Uranium_Mines_desc: "Расширяя границы Варшавы и копая ямы для подготовки фундаментов жилых блоков, мы обнаружили уран! Очевидно, что мы не можем строить дома на месторождении урана, поэтому вместо него мы построим Урановую шахту. Кто знает, когда она пригодится?"
 POL_Marynarka_Wojenna: "ВМФ Польши"
 POL_Marynarka_Wojenna_desc: "Военно-морские силы Польши. Даже если наша страна не известна многими военно-морскими сражениями и достижениями, это не значит, что она устарела! Наши военно-морские силы, защищающие наши берега и ожесточенно сражавшиеся с немецким флотом во время Второй мировой войны, являются основной частью нашей армии!"
 POL_Coastal_Defenses: "Береговая защита"
 POL_Coastal_Defenses_desc: "Даже если сейчас нас защищает советский флот, так будет не всегда. Поэтому мы начнем строительство береговой обороны на случай, если будущие враги попытаются вторгнуться к нам с моря!"
 POL_Expand_the_Mining_Sector: "Расширить сеть шахт"
 POL_Expand_the_Mining_Sector_desc: "Горнодобывающая промышленность всегда была важным промышленным сектором. Его расширение принесет нам только пользу в долгосрочной перспективе."
 POL_Nowa_Huta: "Нова-Хута"
 POL_Nowa_Huta_desc: "Нова Хута станет примером того, как будет выглядеть жилье в социалистической утопии, которой является Польша. Пока что Нова-Хута - это соцреалистичный район, который будет создан исключительно в пропагандистских целях."
 POL_Expand_the_Polish_Marines: "Расширить корпус морпехов"
 POL_Expand_the_Polish_Marines_desc: "Польская морская пехота. Она не очень часто используются, так как у нас нет особой потребности в морских спецназовцах, но мы будем держать их в строю и немного инвестировать в них. В будущем они могут пригодиться."
 POL_Naval_Modernization: "Модернизация флота"
 POL_Naval_Modernization_desc: "Большая береговая линия требует большего флота, но наш флот недостаточно оснащен для выполнения своих задач. Балтика - небольшое море, поэтому следует сосредоточиться на современных боевых кораблях типа «эсминец»."
 POL_Invest_in_Gdansk_Shipyards: "Инвестировать в верфи Гданьска"
 POL_Invest_in_Gdansk_Shipyards_desc: "Амбициозные предвоенные планы по строительству военных кораблей на местных мощностях были жестоко прерваны немецким вторжением. Однако теперь у нас есть все необходимые средства для осуществления этой цели, и наконец-то отвоеванный Гданьск станет идеальной отправной точкой для польской верфи."
 POL_Wojska_Ladowe: "Войско сухопутное"
 POL_Wojska_Ladowe_desc: "Войска Людовы - это наши сухопутные войска. Состоящие из многих ветеранов Второй мировой войны, от партизан до бывших солдат и генералов, они являются опорой нашей нации, защищая границы нашего теперь уже социалистического государства."
 POL_Adopt_the_AK_47: "Внедрить АК-47"
 POL_Adopt_the_AK_47_desc: "Разработанный в Советском Союзе автомат АК-47 превосходит все, что до сих пор предлагал Запад. Нам было рекомендовано принять это оружие на вооружение и начать немедленное производство на наших заводах."
 POL_Reform_the_Officer_Corps: "Реформировать офицерский корпус"
 POL_Reform_the_Officer_Corps_desc: "Наш нынешний генеральский офицерский корпус не так организован, как хотелось бы. У них нет своего рода главы корпуса, и разные офицеры выполняют планы, не общаясь с другими. С помощью нашей реформы мы создадим большой военный генеральный штаб."
 POL_Import_the_T55: "Импортировать Т-55"
 POL_Import_the_T55_desc: "Наши танковые резервы выглядят не лучшим образом. Многие из них состоят из довоенных и послевоенных танков. Для пополнения и модернизации запасов мы импортируем кучу советских танков Т-55 из Восточного блока."
 POL_Embrace_Soviet_Doctrine: "Внедрить советскую доктрину"
 POL_Embrace_Soviet_Doctrine_desc: "Наступления 1944 и 1945 годов, проведенные Красной армией, доказали качество их тактики. Если мы хотим сражаться бок о бок, то логичным шагом будет принятие схожей философии ведения боя."
 POL_Yak_17s: "Избытки советских истребителей"
 POL_Yak_17s_desc: "У Советов есть куча лишних истребителей, разбросанных по нашей стране. Мы уверены, что они не будут возражать, если мы возьмем их и используем для усиления наших собственных ВВС."
 POL_Expand_Anti_Air_Defenses: "Расширить системы ПВО"
 POL_Expand_Anti_Air_Defenses_desc: "Никто не хочет возвращения кошмаров 1939 года, когда немецкие бомбы разрушали наши города. Мы должны инвестировать в стационарную противовоздушную оборону, чтобы в будущем каждый город стал смертельной ловушкой для вражеских бомбардировщиков"
 POL_Yak_23s: "Як-23"
 POL_Yak_23s_desc: "Як-23 - это наши первые реактивные истребители, которые мы разработали, пока были оккупированы Советами. У нас в ангарах до сих пор хранится куча таких самолетов, собирающих пыль. Вместо того чтобы позволить им ржаветь, мы вернем их в строй!"
 POL_MiG_15: "МиГ-15"
 POL_MiG_15_desc: "Чтобы завершить пополнение и модернизацию польских ВВС, мы импортируем несколько МиГ-15 из Восточного блока, чтобы Запад знал, что с нашими ВВС не стоит связываться!"
 POL_Debate_Executive_Powers: "Обсудить полномочия исполнительной власти"
 POL_Debate_Executive_Powers_desc: "Исполнительные полномочия - горячая тема. Людям, как правило, не нравится, когда их задействуют, поскольку это обходит демократические аспекты социализма и дает всю власть одному человеку. Мы включим раздел об этом в нашу конституцию, но исполнительные полномочия можно будет вводить только в очень тяжелых чрезвычайных ситуациях."
 POL_Seek_Soviet_Apporval: "Сыскать одобрение Советов"
 POL_Seek_Soviet_Apporval_desc: "Закончив работу над проектом Конституции, мы обратимся к Советскому Союзу, чтобы убедиться, что в ней нет частей, которые могли бы оскорбить руководство их страны."
 POL_Enact_the_Constitution: "Принять Конституцию"
 POL_Enact_the_Constitution_desc: "Не получив никаких жалоб от Советов, мы можем теперь принять нашу социалистическую конституцию и окончательно заменить старую конституцию, завершив долгожданную советизацию Польши!"
 POL_Dockyards_in_Gdansk: "Верфи Гданьска"
 POL_Dockyards_in_Gdansk_desc: "Гданьск вернулся к нам разрушенным после войны, и именно нам предстоит вернуть ему былую славу. Для прибрежного города нет лучшего способа развития, чем судостроительная промышленность, расширение которой должно стать нашим главным приоритетом"
 POL_The_Fourth_Congress_of_the_PPR: "Четвертый съезд ПОРП"
 POL_The_Fourth_Congress_of_the_PPR_desc: "После смерти Сталина и реформирования партийных позиций мы проведем Четвертый съезд ПОРП, который определит дальнейшее направление развития нашей партии."
 POL_The_Death_of_Bierut: "Смерть Берута"
 POL_The_Death_of_Bierut_desc: "К сожалению, после тяжелого состояния здоровья после 20-го съезда КПСС Генеральный секретарь Берут скончался в одной из московских больниц. Это прискорбная и внезапная трагедия. Похороны будут организованы в кратчайшие сроки, и по всей стране объявлен траур."
 POL_Embrace_Destalinization: "Начать десталинизацию"
 POL_Embrace_Destalinization_desc: "С Охабом в качестве нашего генерального секретаря было объявлено, что мы примем политику десталинизации, которая распространилась по всему Восточному блоку после смерти Сталина."
 POL_Reduce_Press_Censorship: "Ослабить цензуру прессы"
 POL_Reduce_Press_Censorship_desc: "В рамках либерализации Охаба было решено сократить цензуру в прессе, чтобы дать рабочим возможность громче заявлять о себе в правительственных делах."
 POL_Mass_Amnesty: "Массовая амнистия"
 POL_Mass_Amnesty_desc: "В тюрьмах до сих пор сидит множество политических врагов, арестованных во время сталинского режима. Мы рассмотрим этих политических врагов. Те, кто не совершил никаких серьезных преступлений, будут освобождены."
 POL_Curtail_the_Secret_Police: "Закрыть Секретную полицию"
 POL_Curtail_the_Secret_Police_desc: "Секретные службы слишком долго получали свободу действий. При правительстве Берута они проводили жестокие операции. Мы сократим их и посадим на поводок. Те, кто откажется следовать новым правилам, будут отстранены от работы и сняты с должности."
 POL_Empower_the_Sejm: "Власть Сейма"
 POL_Empower_the_Sejm_desc: "Чтобы еще больше либерализовать правительство, мы предоставим полномочия правящему собранию Сейма. Это позволит более демократично подходить к будущим законам и политикам, так как сначала они должны будут обсуждаться в Сейме!"
 POL_The_Poznan_Uprising: "Познанский июнь"
 POL_The_Poznan_Uprising_desc: "В городе Познань произошло массовое восстание. Мы не знаем всех подробностей, но, по данным нашей разведки, собралось более 100 000 человек, которые протестуют против нашего правления. Армия и Корпус безопасности были проинформированы и получили приказ сдерживать протестующих. В случае если ситуация выйдет из-под контроля, разрешено применение летальных методов."
 POL_Polish_October: "Польский Октябрь"
 POL_Polish_October_desc: "Для Польской Народной Республики 1956 год стал переходным. Международная обстановка значительно ослабила жесткую сталинскую фракцию в Польше, особенно после того, как в марте умер лидер польских коммунистов Болеслав Берут. Со дня смерти Иосифа Сталина прошло три года.  Протесты рабочих Познани в июне подчеркнули недовольство народа своим положением. В октябре эти события привели к росту популярности фракции реформаторов во главе с Владиславом Гомулкой."
 POL_The_Gomulka_Thaw: "Оттепель Гомулки"
 POL_The_Gomulka_Thaw_desc: "Было решено, что ныне свободный Гомулка, ранее заключенный в тюрьму Берутом, станет новым Генеральным секретарем. Будучи умеренным политиком, он оказался компромиссной фигурой, на которой смогли сойтись как сторонники жесткой линии, так и реформаторы."
 POL_First_Secretary_Zawadzki: "Генсекретарь Завадский"
 POL_First_Secretary_Zawadzki_desc: "Александр Завадский сумел одолеть своего противника Гомулку и обеспечить себе лидерство в Польше. Завадский сильно отличается от своего оппонента Гомулки. Если Гомулка - более умеренная личность, то Завадский - жесткий просоветский коммунист. Он планирует больше привязать нацию к Советскому Союзу, а также адаптировать советскую культуру к польской."
 POL_Dismiss_Rokossovsky: "Отвергнуть Рокоссовского"
 POL_Dismiss_Rokossovsky_desc: "Рокоссовский, советский генерал, находящийся в Польше, жестоко подавил Познаньское восстание. Гомулка решил уволить его и отправить обратно в Советский Союз."
 POL_Placate_Soviet_Fears: "Успокоить страхи Советов"
 POL_Placate_Soviet_Fears_desc: "Советы беспокоятся, что из-за того, что Гомулка стал нашим генеральным секретарем, и мы начнем разваливаться позволив капиталистам захватить власть в стране. Советы слишком много беспокоятся. Мы успокоим советские страхи и заверим их, что не собираемся выходить из Варшавского договора в ближайшее время."
 POL_Decrease_Church_Persecutions: "Ослабить гонения на церковь"
 POL_Decrease_Church_Persecutions_desc: "Преследования церкви, проводимые предыдущим правительством, были жестокими и делались без всякой причины, а лишь для того, чтобы подтолкнуть нацию к атеизму. Теперь, когда мы у руля, мы уменьшим гонения на церковь."
 POL_Condemn_Nationalist_Rhetoric: "Осудить националистическую риторику"
 POL_Condemn_Nationalist_Rhetoric_desc: "Если правительство Берута и не сделало много хорошего, то подавление националистов - одно из немногих. Националисты, те самые, которые всего несколько лет назад почти полностью уничтожили Варшаву во время Второй мировой войны, каким-то образом все еще остаются в нашем государстве. Мы должны осудить эту идеологию!"
 POL_Allow_Moderate_Electoral_Freedom: "Дозволить умеренную свободу выборов"
 POL_Allow_Moderate_Electoral_Freedom_desc: "Если мы не собираемся устанавливать полную демократию, то вместо этого мы допустим умеренную свободу выборов, позволяя рабочим иметь более широкий выбор, за кого голосовать, но при этом сохраняя контроль над страной."
 POL_Population_Reperation_Agreement_with_the_Soviets: "Соглашение о репатриации с СССР"
 POL_Population_Reperation_Agreement_with_the_Soviets_desc: "Многие из наших жителей сильно пострадали под советским и немецким сапогом. Поэтому мы попытаемся заключить с Советами соглашение о репатриации, чтобы убедить население вернуться на свою бывшую родину."
 POL_Condemn_Factionalism: "Осудить фракционнализм"
 POL_Condemn_Factionalism_desc: "Даже если у нас есть разногласия между другими членами партии, мы все равно должны сотрудничать и осуждать фракционность в партии. Только объединившись, мы сможем по-настоящему достичь социалистического рая!"
 POL_Cultural_Liberalization: "Культурная либерализация"
 POL_Cultural_Liberalization_desc: "Правительство Берута довольно жестко контролировало польскую культуру, ограничивая ее и не позволяя людям видеть любые западные СМИ. Однако теперь, когда сталинисты-жестокомысленники ушли, мы можем приступить к реализации политики либерализации."
 POL_Expand_Western_Ties: "Расширить связи с Западом"
 POL_Expand_Western_Ties_desc: "Просто иметь связи с Восточным блоком недостаточно, мы должны расширять наши связи с Западом, даже если Советы могут быть не в восторге от этого. Если мы установим связи с Западом, то сможем получить доступ и к западным рынкам."
 POL_The_Little_Stabilization: "Небольшая стабилизация"
 POL_The_Little_Stabilization_desc: "Наши реформы постепенно приживаются среди наших рабочих, принимают их и наслаждаются тем, что никогда не было бы возможно при Беруте. Наши люди довольны, и все видят, что правительство стало более либеральным, более открытым и более дружелюбным к желаниям рабочих. Это привело к некоторой стабилизации в стране."
 POL_Abandon_Collective_Agriculture: "Свернуть коллективизацию"
 POL_Abandon_Collective_Agriculture_desc: "Политика коллективного сельского хозяйства - это жестокая политика по отношению к сельским рабочим и фермерам. Заставлять людей выполнять квоты и отнимать у них землю, которой они владели веками, только для того, чтобы государство могло ею пользоваться, несправедливо и просто невозможно. Мы откажемся от этой политики и вернем фермерам их права."
 POL_Rehabilitate_the_Purged_Members: "Реабилитация репрессированых"
 POL_Rehabilitate_the_Purged_Members_desc: "Многие бывшие члены, как и Гомулка, были исключены из-за нелепых обвинений, потому что Берут опасался, что против него и остальных членов Коммунистической партии существует заговор. Теперь, когда Берута больше нет, мы сосредоточимся на реабилитации вычеркнутых членов."
 POL_Reduce_Soviet_Influence: "Сократить советское вмешательство"
 POL_Reduce_Soviet_Influence_desc: "В настоящее время Советы имеют слишком большой контроль над нашей страной. Они влияют на все сферы жизни страны - от политики до армии. Если мы когда-нибудь захотим получить свободу от Советов, нам нужно будет начать уменьшать их влияние."
 POL_Crush_the_Protests: "Сокрушить протесты!"
 POL_Crush_the_Protests_desc: "Мы не можем позволить этим предателям и антиреволюционерам бунтовать на улицах. Мы раздавим этих предателей и введем военное положение, пока ситуация не успокоится."
 POL_Empower_the_Natolin_Faction: "Власть фракции натолинцев"
 POL_Empower_the_Natolin_Faction_desc: "Натолинская фракция - фракция в руководстве коммунистической Польской объединенной рабочей партии. Сформированная около 1956 года, вскоре после 20-го съезда Коммунистической партии Советского Союза, она была названа по месту проведения своих собраний - на правительственной вилле в Натолине. Главной оппозицией натолинцам была фракция Пулавиан, объединявшая многих членов сталинской партии еврейского происхождения. Натолинцы выступали против послесталинских программ либерализации («оттепели») и провозглашали простые националистические и антисоветские лозунги как часть стратегии по завоеванию власти."
 POL_Strengthen_the_State_Security_Apparatus: "Усилить аппарат госбезопасности"
 POL_Strengthen_the_State_Security_Apparatus_desc: "В государстве еще много врагов, которые прячутся в тени и ждут удара. Но мы не дадим им такого шанса! Укрепляя аппарат государственной безопасности, мы уничтожим всех до единого!"
 POL_Reopen_the_Prison_Camps: "Возродить систему концлагерей"
 POL_Reopen_the_Prison_Camps_desc: "Наши тюрьмы заполняются врагами революции, которые просто сидят и гниют. Но вместо этого они могли бы работать, чтобы искупить свою вину. Чтобы дать им шанс на искупление, мы вновь откроем тюремные лагеря, установив правило: чем дольше и больше вы работаете, тем короче будет ваш срок."
 POL_Launch_Anti_Catholicism_Campaign: "Начать антикатолическую кампанию"
 POL_Launch_Anti_Catholicism_Campaign_desc: "У Бейрута сначала была правильная идея - заключить соглашение с церковью, чтобы помешать ей распространять антисоциалистическую пропаганду. Однако это было недостаточно далеко. Вместо того чтобы заключать очередное соглашение с церковью, мы начнем кампанию против католицизма, чтобы раз и навсегда избавиться от церкви и установить настоящий атеистический социалистический рай!"
 POL_Request_Further_Soviet_Economic_Aid: "Запросить экономическую помощь у СССР"
 POL_Request_Further_Soviet_Economic_Aid_desc: "Даже если наша промышленность растет, этого недостаточно. Нам чего-то не хватает. Может быть, одна из наших политик проводится неправильно или мы используем устаревшие методы? Чтобы решить эту проблему, есть простое решение. Пригласив советскую экономическую помощь и советников, мы поднимем нашу экономику!"
 POL_Expand_the_Ludowe_Wojsko_Polskie: "Расширить Народное Войско"
 POL_Expand_the_Ludowe_Wojsko_Polskie_desc: "Даже если наши границы защищены, не мешало бы расширить наш Ludowe Wojsko Polskie. С расширением наши границы будут защищены еще больше. И если какой-нибудь другой захватчик попытается вторгнуться к нам, его ждет неприятный сюрприз."
 POL_Deny_the_Katyn_Massacre: "Отрицать Катынский расстрел"
 POL_Deny_the_Katyn_Massacre_desc: "Катынская резня - серия массовых казней почти 22 000 польских военнопленных офицеров и представителей интеллигенции, проведенных Советским Союзом, в частности НКВД («Народный комиссариат внутренних дел», советская тайная полиция) в апреле и мае 1940 года. Хотя убийства также происходили в Калининской и Харьковской тюрьмах и в других местах, массовое убийство названо в честь Катынского леса, где некоторые из массовых захоронений были впервые обнаружены немецкими войсками. Начало резне положило предложение главы НКВД Лаврентия Берии Иосифу Сталину расстрелять всех пленных представителей польского офицерского корпуса, которое было одобрено советским Политбюро во главе со Сталиным. Из общего числа убитых около 8 000 были офицерами, заключенными во время советского вторжения в Польшу в 1939 году, еще 6 000 - полицейскими, а остальные 8 000 - польской интеллигенцией, которую Советы считали агентами разведки и жандармами, шпионами и диверсантами, бывшими помещиками, владельцами фабрик и чиновниками. Офицерский состав польской армии представлял многонациональное польское государство; среди убитых были этнические поляки, украинцы, белорусы и евреи, в том числе главный раввин польской армии Барух Штейнберг."
 POL_Launch_Anti_Semitic_Campaign: "Начать антисемитскую кампанию"
 POL_Launch_Anti_Semitic_Campaign_desc: "Антисеметизм? В Польше? При социалистическом правлении? Нет. Никогда. Фальшивые новости."
 POL_Increase_Trade_within_the_East_Bloc: "Увеличить торговлю с Восточным Блоком"
 POL_Increase_Trade_within_the_East_Bloc_desc: "Нам не нужны грязные западные рынки. Нам нужны только наши товарищи из Восточного блока и Советского Союза. Торговля с другими социалистическими странами будет более чем достаточной для получения всех материалов, необходимых нашей стране!"
 POL_Emulate_Soviet_Culture: "Подражать советской кульутре"
 POL_Emulate_Soviet_Culture_desc: "Завадский долгое время любил советскую культуру. Еще до того, как он стал Генеральным секретарем. Но теперь, когда он стоит во главе Нации, он может реально привести в движение планы и начать внедрение социалистической и советской культуры, сделав ее основой социалистической Польши."
 POL_Purge_the_Pulawowanie: "Ликвидировать пулавян"
 POL_Purge_the_Pulawowanie_desc: "Пулавяне - неофициальное название одной из двух групп коммунистов в послевоенной политике сталинской Польши, которые боролись за власть в руководстве Польской объединенной рабочей партии весной 1956 года, после смерти Берута. Во время процесса десталинизации Польши они были известны как реформисты."
 POL_Arrest_Gomulka_Oncemore: "Арестовать Гомулку еще раз"
 POL_Arrest_Gomulka_Oncemore_desc: "Уступить давлению протестующих и отпустить Гомулку было ошибкой. Мы арестуем его еще раз, на этот раз навсегда. Когда Гомулка выйдет из гонки, Завадский обеспечит себе должность генерального секретаря, и больше не будет политических разборок."
 POL_Release_Gomulka: "Освободить Гомулку"
 POL_Release_Gomulka_desc: "Демонстранты требуют немедленно освободить Гомулку, ссылаясь на то, что мы обвинили его по ложному поводу и он невиновен. Обычно мы игнорируем это требование. Но в сложившейся ситуации малейшая искра может вызвать революцию, которая отдаст все, чтобы отстранить нас от власти."
 POL_Resist_Comecon_Demands: "Оказать сопротивление требованиям СЭВ"
 POL_Resist_Comecon_Demands_desc: "Еще одно требование демонстрантов - отвергнуть требования советского COMECON . Как бы мы ни хотели навредить нашим отношениям с Советами, это придется принять. Иначе забастовщики могут выдвинуть более жесткие требования."
 POL_Synthetic_Fiber_of_Gorzaw: "Синтетика Гожува-Великопольского"
 POL_Synthetic_Fiber_of_Gorzaw_desc: "Горжов - одно из немногих мест в Польше, где производится синтетическое волокно. Чтобы обеспечить удовлетворение потребностей рабочих, мы откроем еще больше фабрик по производству синтетического волокна!"
 POL_Sily_Powietrzne: "ВВС Польши"
 POL_Sily_Powietrzne_desc: "Наши военно-воздушные силы немного поредели после Второй мировой войны. Многие из них были перегнаны в Румынию или захвачены немцами. Мы получили от советских войск несколько новых моделей, но этого недостаточно. Польше нужны настоящие ВВС!"