 BEL_Belgium_and_the_World_desc: "Положение Бельгии в мире сейчас, в послевоенный период, только возросло. Внешняя политика имеет решающее значение для достижения наших целей."
 BEL_Pax_Belgica_desc: "По-прежнему оставаясь колониальной державой, положение Бельгии в Африке в лучшем случае шатко. Хотя мы и держим колонии в Бельгийском Конго и Руанда-Урунди, времена могут измениться..."
 BEL_Belgian_Reconstruction_desc: "После вторжения и оккупации во второй раз за 40 лет экономика Бельгии снова разрушена. Помощь союзников поможет, но для достижения прежнего довоенного уровня необходима дальнейшая реконструкция."
 BEL_The_Belgian_Armed_Forces_desc: "Небольшие, но мощные бельгийские вооруженные силы нуждаются в дальнейшем совершенствовании со времен Второй мировой войны."
 BEL_The_Koningskwestie_desc: "Koningskwestie, или Королевский вопрос, был занозой в боку Бельгии после немецкого вторжения в 1940 году. Король Леопольд оставил свой пост и стал немецким коллаборационистом. Оставшись в изгнании в Швейцарии, правительство должно решить, что с ним делать; отказаться от его участия или привести его обратно?"
 BEL_Sanction_Former_Nazis_desc: "Сотрудничество с немецкими войсками во время Второй мировой войны рассматривается как преступление против государства. Санкции и наказания должны быть наложены на этих лиц как способ наказания их за их действия."
 BEL_Continue_the_Repression_of_Collaborators_desc: "Репрессии против этих коллаборационистов должны продолжаться. Обрив им головы, пометив их, поместив в колодки, все формы публичного смущения должны быть использованы для осуждения этих предателей."
 BEL_Form_the_Belgian_Office_for_Social_Security_desc: "Хотя идея социального обеспечения и пенсионных пособий является относительно новой концепцией, мы, как правительство, должны представить эти льготы нашему стареющему населению."
 BEL_Empower_the_FGTB_ABVV_Union_desc: "Во всей Бельгии, но особенно в Валлонии, профсоюзы, особенно Всеобщая федерация труда Бельгии, контролируют большую часть повседневной деятельности рабочих. Они должны получить больше автономии и поддержки со стороны правительства."
 BEL_Call_For_A_Referendum_desc: "Народ должен решить, каков статус короля."
 BEL_Bring_the_King_Back_From_Switzerland_desc: "Политика правительства заключается в том, что независимо от того, что общественность думает о короле, он должен быть должным образом возвращен на родину из Швейцарии, места ссылки."
 BEL_Mobilize_Royalist_Support_in_Flanders_desc: "Северный регион Фландрии - это чисто католический, роялистский район страны. Сосредоточение наших усилий на этом должно гарантировать наши шансы на возвращение короля."
 BEL_Campaign_Against_The_King_in_Wallonia_desc: "Зная, что Валлония является бастионом антироялистского сопротивления, наши усилия должны быть сосредоточены там, чтобы лишить короля-предателя его силы."
 BEL_Welcome_The_King_Back_to_Belgium_desc: "Народ решил, и король вернется!"
 BEL_Deny_His_Constitutional_Duties_desc: "Люди говорили; Король может вернуться, но не должен иметь никаких своих конституционных обязанностей, как раньше."
 BEL_Celebrate_The_Return_of_Leopold_desc: "Король вернулся, и у нас будут парады на улицах!"
 BEL_Negotiate_With_Anti_Royalist_Protestors_desc: "Анти-роялисты бастуют на улицах, требуя объяснить, почему короля вернули без голоса народа. Необходимы быстрые переговоры, чтобы гарантировать, что больше не будет насилия."
 BEL_Improve_Highway_Systems_in_Metropolitian_Belgium_desc: "Наши дорожные системы либо были повреждены во время войны, либо устарели и разваливаются. С развитием системы автомагистралей станет легче путешествовать не только по Бельгии, но и по всем странам Нидерландов!"
 BEL_Establish_the_Belgian_Office_for_the_Increase_of_Productivity_desc: "Эффективность и производительность являются признаками хорошей экономики. Чтобы дать толчок нашей отрасли, необходимо создать управление, чтобы повысить производительность на рабочем месте."
 BEL_Help_Establish_the_ECSC_desc: "Европейское сообщество угля и стали обеспечит выгодную торговлю между Западной Европой, особенно наши богатые запасы угля в Валлонии!"
 BEL_Accept_Marshall_Plan_Aid_desc: "Помощь по плану Маршалла из Соединенных Штатов будет финансировать и восстанавливать нашу стареющую и разрушенную промышленность."
 BEL_Embrace_American_Management_Principles_desc: "Американские принципы управления необходимы в наших отраслях, чтобы повысить производительность и размер прибыли, чтобы наша экономика взлетела до небес."
 BEL_Develop_Light_Consumer_Industry_in_Flanders_desc: "Заводы по производству потребительских товаров — это не то, чем известна бельгийская экономика. Строительство нескольких объектов во Фландрии поможет нам избежать поиска иностранной помощи."
 BEL_Sign_the_Treaty_of_Rome_and_Form_the_EEC_desc: "Мы соберемся вместе с другими западными странами, такими как Франция и Западная Германия, чтобы сформировать Европейское экономическое сообщество, что станет большим шагом на пути к большей Европе."
 BEL_An_Improved_and_Modern_Belgian_Economy_desc: "Все эти усилия; помощь, строительство и присоединение к организациям помогли нам восстановить нашу экономику, сделав нашу страну лучше в долгосрочной перспективе."
 BEL_The_Korean_War_desc: "Коммунистическая нация Северной Кореи вторглась в демократическую Южную Корею. Как маленький и демократический союзник, мы должны быть склонны помогать южнокорейцам в их борьбе за выживание."
 BEL_Form_the_Belgian_United_Nations_Command_desc: "В рамках нашей помощи в войне в Корее бельгийское командование Организации Объединенных Наций в составе бригады будет направлено в Пусан, Республика Корея, для оказания боевой поддержки."
 BEL_Condemn_North_Korean_Aggression_desc: "Вместо того, чтобы посылать военную помощь, мы пойдем дипломатическим путем и осудим Северную Корею за беспрецедентную агрессию против южного соседа. Это осуждение нанесет удар и, надеюсь, предотвратит дальнейшее насилие."
 BEL_Send_Military_Aid_desc: "В рамках нашей помощи Южной Корее мы отправим наши лучшие винтовки, моторизованную технику и вспомогательное оборудование."
 BEL_Increase_Commitment_in_Korea_desc: "Просто оказать помощь недостаточно. Расширение военного участия в Корее необходимо для укрепления демократического духа Южной Кореи, и было бы благородно выделить больше наших людей для достижения этой цели."
 BEL_The_North_Sea_Flood_desc: "1 февраля 1953 года на Нидерланды обрушился сильный ливень, затопивший большую часть региона, особенно Нидерланды."
 BEL_Expo_58_Preparations_desc: "Брюссель с удовольствием принимает у себя Всемирную выставку 1958 года, также известную как Экспо 58. Подготовка к большим скоплениям людей и строительным работам обязательна."
 BEL_European_Affairs_desc: "Находясь в Европе, эти региональные дела так же важны, как и иностранные дела во всем мире."
 BEL_Join_NATO_desc: "Организация Североатлантического договора является оплотом взаимной защиты от угроз в Европе. Присоединение к остальной части Западной Европы обеспечит нашу свободу."
 BEL_Form_the_Benelux_Parliament_desc: "Парламент Бенилюкса, сформированный из депутатов от Бельгии, Нидерландов и Люксембурга, является новой законодательной ветвью альянса Бенилюкса."
 BEL_Begin_Gladio_Operations_desc: "В случае, если Советы нас захватят, у нас будут адекватные секретные операции, чтобы поддержать демократическую борьбу."
 BEL_Form_the_Benelux_Economic_Union_desc: "В рамках альянса Бенилюкса должен быть включен экономический союз для улучшения отношений между странами Бенилюкса"
 BEL_Establish_Euratom_desc: "Вступление в Европейское сообщество атомной энергии обеспечит безопасное использование ядерной энергии и нераспространение по всей Западной Европе."
 BEL_Ignore_the_Disaster_desc: "Вместо того, чтобы устранять ущерб от наводнения, мы просто откажемся от какой-либо помощи."
 BEL_Begin_Rebuilding_desc: "Ущерб от наводнения нанес ущерб нашим прибрежным районам. Мы должны восстановиться"
 BEL_Assist_the_Dutch_in_Rebuilding_desc: "Пока мы занимаемся восстановлением, голландцам нужна дополнительная помощь. Им нужна наша помощь, финансовая и инфраструктурная."
 BEL_Provide_Benefits_to_Flood_Victims_desc: "Все пострадавшие от наводнения получат компенсацию от правительства, чтобы помочь им возобновить работу и восстановиться."
 BEL_Build_the_Atomium_desc: "Атомиум — архитектурное усовершенствование, выполненное в форме атома железа, с доступными сферами. Это будет сияющий маяк в центре выставки 58."
 BEL_Include_the_Belgian_Congo_Exhibit_desc: "Мы продемонстрируем чудеса наших колоний, представив за стеклом эволюционировавших аборигенов, использующих современное оборудование."
 BEL_Do_Away_With_the_Racist_Human_Zoos_desc: "Это 1958 год, и изображать наших героев в виде животных просто неправильно."
 BEL_Develop_Expo_Transport_Networks_in_Brussels_desc: "Чтобы справиться с наплывом посетителей в Брюссель на ярмарку, мы должны создать более крупную и эффективную транспортную сеть вокруг города и выставочного центра."
 BEL_Welcome_Delegations_From_Around_the_World_desc: "Мы будем принимать делегации со всех концов, в том числе из США, СССР, Западной Германии, Югославии и других крупных павильонов."
 BEL_Introduce_the_Ten_Year_Plan_desc: "Десятилетний план массовой индустриализации и улучшения колониальной экономики только улучшит уровень жизни... и нашу норму прибыли."
 BEL_Reorganize_the_Belgian_Ministry_of_Colonies_desc: "Министерство колоний устарело, и по мере того, как мы приближаемся к 1950-м, его необходимо обновить, чтобы оно отражало новую эпоху, в которой мы живем."
 BEL_Establish_the_Central_Bank_of_the_Belgian_Congo_and_Ruanda_Urundi_desc: "Быть прикрепленным к центральному банку в Бельгии просто слишком сложно из-за расстояния. Банк в Конго значительно облегчит распределение денег и выдачу кредитов."
 BEL_The_Decree_of_14_July_1952_desc: "Этот королевский указ впервые позволит коренному населению участвовать в политической жизни и создавать партии."
 BEL_The_Kings_Tour_of_the_Colonies_desc: "Король Бодуэн имеет честь посетить колонию!"
 BEL_Establish_Native_Workers_Pensions_desc: "Местные рабочие заслуживают пенсионных пенсий, как и их светлокожие рабочие на родине."
 BEL_Negotiate_the_Wage_Gap_With_the_APIC_desc: "Местный профсоюз APIC выразил недовольство разрывом в заработной плате между европейскими и местными рабочими. Мы будем вести переговоры об этом разрыве соответственно."
 BEL_The_Belgian_Air_Component_desc: "Сформированный в 1909 году как подразделение бельгийской армии, авиационный компонент превратился в отдельное подразделение, став первыми военно-воздушными силами, которые стреляли из пулемета с самолета и сражались в Первой и Второй мировых войнах, хотя и из Англии."
 BEL_The_Belgian_Land_Component_desc: "Сформированный в 1873 году Сухопутный компонент сформировал скромные силы из шести дивизий для вступления в Первую мировую войну и восемнадцати дивизий перед Второй мировой войной. После войны большая часть армии была ответственна за оккупацию Германии и освобождение Бельгии."
 BEL_The_Belgian_Marine_Component_desc: "Созданный в 1832 году как первый вид бельгийских вооруженных сил, военно-морской флот несколько раз упразднялся из-за проблем с бюджетом, в 1860-х и 1920-х годах. Во время Второй мировой войны он был воссоздан, но быстро присоединился к Королевскому флоту до конца войны, когда у них осталось всего несколько патрульных катеров, подаренных британцами."
 BEL_Purchase_F84_Thunderjets_desc: "Создавая наши военно-воздушные силы для современной эпохи, мы будем покупать у американцев истребители-бомбардировщики F-84 Thunderjet. Мы видели их эффективность в корейском конфликте, и они того стоят."
 BEL_Form_the_Advanced_Pilots_School_in_the_Congo_desc: "Улучшая наше присутствие в Конго, мы построим школу пилотов в Кабале, чтобы обучать наших летчиков боям в джунглях, бомбардировкам и перехватам."
 BEL_Join_the_Second_Allied_Tactical_Air_Force_desc: "Являясь частью НАТО, наше присутствие во 2ATAF расширит сеть противовоздушной обороны Западной Европы и предотвратит советские вторжения в наше воздушное пространство."
 BEL_Form_the_I_Belgian_Corps_desc: "I бельгийский корпус был корпусом, существовавшим до Второй мировой войны, но мы вернем его для усиления операций НАТО в Бельгии и Западной Германии."
 BEL_Acquire_M46_and_M47_Armored_Vehicles_desc: "Приобретение излишков американских средних танков M46 и M47 Patton окажет помощь нашей большой пехотной армии."
 BEL_Form_the_Belgian_1st_Para_Commando_Regiment_desc: "Спецназ и Воздушно-десантные войска — достаточно новое понятие в военных кругах. Наличие пара-коммандос сделает нашу армию более быстрой и решительной, прибывающей с небес!"
 BEL_Recognize_the_Royal_Belgian_Sea_Cadet_Corps_desc: "Королевский бельгийский морской кадетский корпус был оплотом входа в наш флот, а также береговой защитой, и они заслуживают признания за свои действия."
 BEL_Expand_the_Port_of_Zeebrugge_desc: "Развитие сонного приморского города и порта Зебрюгге поможет не только нашему растущему флоту, но и нашей экономике."
 BEL_Acquire_Former_American_Frigates_and_Patrol_Craft_desc: "Мы примем от американцев один фрегат типа «Такома» и несколько тральщиков для усиления наших военно-морских сил обороны."
 BEL_The_1950_General_Strike_desc: "Исходя из Королевского вопроса, эти всеобщие забастовки, безусловно, оставят след в нашей нации."
 BEL_A_Vote_of_No_Confidence_on_Duvieusart_desc: "Жан Дювьесар провалил свое пребывание на посту премьер-министра после возвращения короля. Он просто больше не может быть нашим главой правительства."
 BEL_Announce_the_Resumption_of_the_Kings_Duties_desc: "Теперь, когда кризис разрешился, король выразил готовность возобновить свои обязанности."
 BEL_Nominate_Joseph_Pholien_as_PM_desc: "Наш новый кандидат на пост премьер-министра — Джозеф Фолиен, политик CSP и бывший министр юстиции."
 BEL_Accept_the_Kings_Abdication_desc: "Король предложил свое отречение после Королевского вопроса, и мы, как нация, должны это принять."
 BEL_Increase_Wages_to_Catholic_Schoolteachers_desc: "Учителя-католики составляют основу образования наших детей, и их количество должно быть соответствующим образом увеличено."
 BEL_Confer_Royal_Powers_on_Prince_Baudouin_desc: "Принц Бодуэн — сын Леопольда, и по праву он будет коронован следующим королем Бельгии!"
 BEL_Crown_Prince_Baudouin_desc: "Пришло время коронации Принца, и, получив конституционные полномочия Короля, он будет официально коронован в Брюсселе!"
 BEL_The_Debate_on_Education_desc: "Образование в Бельгии всегда было конфликтным. Вопрос о том, оставаться ли светским или придерживаться государственного католического образования, является предметом горячих споров, и он достигает апогея в умах людей."
 BEL_Pass_the_Harmel_Education_Laws_desc: "Новые законы об образовании, представленные Пьером Армелем из CSP, свяжут субсидии с частными католическими школами и облегчат получение частными школами легитимности."
 BEL_Loosen_the_Repressie_desc: "Мы должны прекратить жестокое обращение с немецкими коллаборационистами или, по крайней мере, дать им ограниченную свободу."
 BEL_Nominate_Jean_van_Houtte_as_PM_desc: "Жан ван Хаутте будет назначен премьер-министром, политик CSP, который был бывшим министром финансов в предыдущих правительствах."
 BEL_The_1952_Defense_Review_desc: "Изучение наших вооруженных сил с оборонительной и гражданской точки зрения позволит найти трещины в наших вооруженных силах и устранить их."
 BEL_Stop_the_Harsh_Treatment_of_German_Collaborators_desc: "Это жестокое обращение должно быть остановлено."
 BEL_Form_Anti_Air_Battalions_desc: "Чтобы подготовиться к советскому вторжению, необходимо создать зенитные дивизионы, чтобы обеспечить дополнительную противовоздушную оборону нашего неба."
 BEL_Expand_Military_Conscription_desc: "Война может случиться в любой день, а расширение воинской повинности расширит наши вооруженные силы, чтобы обеспечить наилучшую защиту Западной Европы."
 BEL_Go_Back_to_the_Repressie_desc: "Немецкие коллаборационисты все еще имеют слишком много свободы, мы должны принять соответствующие меры, чтобы наказать их."
 BEL_Protest_Against_Freedom_of_German_Collaborators_desc: "Народ соответственно отреагирует на ослабление репрессий."
 BEL_The_Economic_Recession_desc: "Беспрецедентный экономический спад ударил по нашей экономике, и мы должны восстановиться."
 BEL_Put_Down_the_Anti_Royalist_Protests_desc: "Антироялистские протесты вышли из-под контроля, и их необходимо контролировать соответствующим образом."
 BEL_Quietly_Support_the_Protests_desc: "Вместо того, чтобы подавлять протесты, мы откажемся от участия и останемся в тени."
 BEL_Deploy_the_Belgian_Military_desc: "Позволить жандармерии разобраться с протестами недостаточно. Бельгийские воинские части должны будут быть переброшены для контроля ситуации и обеспечения безопасности стратегических районов."
 BEL_Arrest_Monarchist_Protestors_Only_desc: "Публично оставаясь на нейтральной позиции, мы будем предлагать полиции и солдатам арестовывать только протестующих монархистов за их действия."
 BEL_The_Saga_of_Julien_Lahaut_desc: "У Жюльена Лао, лидера Коммунистической партии Бельгии, было бурное прошлое, и его судьба должна быть решена."
 BEL_Order_His_Assassination_By_a_Monarchist_desc: "Лао нельзя оставлять в живых, чтобы он продолжал свою подрывную деятельность..."
 BEL_Allow_Lahaut_to_Continue_His_Communist_Activities_desc: "Мы пощадим Лао, но внимательно следите за ним. Он не тот человек, которому можно доверять..."
 BEL_End_the_Strikes_desc: "Правительство и протестующие пришли к решению, и забастовки скоро будут прекращены."
 BEL_Focus_on_the_Needs_of_the_Working_Class_desc: "Потребности рабочего класса — это потребности людей, и мы удовлетворяем потребности людей."
 BEL_Continue_Anti_Royalist_Rhetoric_desc: "Наша неприязнь к королю сильна, и мы будем продолжать публичное осуждение королевской семьи до самого последнего вздоха."
 BEL_Continue_Development_of_the_Silion_Industriel_desc: "Silion Industriel — это промышленный район Валлонии, который заслуживает дальнейшего промышленного развития."
 BEL_Negotiate_with_the_Unions_desc: "Чтобы предотвратить дальнейшие забастовки, наши отношения с профсоюзами должны быть улучшены, и должны быть созданы эффективные переговорные механизмы."
 BEL_Resist_Calls_from_Catholic_Leaders_for_Religious_Schools_desc: "Мы должны предотвратить любой толчок к созданию новых религиозных школ в этой стране, в том числе заставить замолчать оппозицию."
 BEL_Push_for_Public_Secular_Schools_desc: "Вместо религиозных школ мы должны сделать акцент на государственных, нерелигиозных школах, чтобы обеспечить лучшее образование без каких-либо предубеждений."
 BEL_Increase_Spending_on_NATO_desc: "Сильная оборона имеет решающее значение для сильной страны, и мы должны поддерживать нашу демократическую позицию и оборону, тратя больше на вклады НАТО."
 BEL_Nominate_Max_Buset_as_PM_desc: "Макс Бюсет будет назначен премьер-министром, политиком БСП и президентом Бельгийской социалистической партии с 1945 года."
 BEL_Analyze_the_1952_Defense_Reports_desc: "Изучение наших вооруженных сил с оборонительной и гражданской точки зрения позволит найти трещины в наших вооруженных силах и устранить их."
 BEL_Announce_Support_for_King_Baudouin_desc: "При сохранении нашей публичной антироялистской риторики поддержка нового короля Бодуэна имеет решающее значение для единой нации."
 BEL_Prioritize_the_French_Speaking_Population_desc: "Будучи партией, в основном базирующейся во франкоязычной Валлонии, мы склонны отдавать предпочтение нашему электорату превыше всего."
 BEL_The_Workers_Line_of_Defense_desc: "Для защиты нашей нации необходимо разработать новую и лучшую оборонную политику, уделяя особое внимание прежде всего рабочим!"
 BEL_The_Buset_Style_of_Socialism_desc: "Представляем новый стиль социализма Бюсета, уделяя особое внимание единству Франции и правам рабочих превыше всего."
  
 BEL_Dealing_with_the_Recession_desc: "Экономический спад разрушил нашу экономику и попытки восстановления. Преодоление этого шага назад может обеспечить наше возможное выздоровление."
 BEL_Continuing_CSP_Dominance_desc: "Христианско-социальная партия играла большую роль в правительстве с момента своего основания, и теперь, когда они получили большинство в правительстве, их политика может проводиться без особого сопротивления."
 BEL_Flanders_Economic_Recovery_desc: "Фландрия является развивающимся экономическим регионом, и ей нужно уделять больше внимания восстановлению после рецессии."
 BEL_Wallonia_Economic_Recovery_desc: "Валлония — старейший, промышленно развитый и горнодобывающий регион Бельгии. Извлечение региона из-под обломков помогло бы обезопасить нашу экономику."
 BEL_Modernize_Obsolete_Manufacturing_Processes_desc: "Устаревшие и старые производственные процессы только создают больше проблем для нашего восстановления; внедрение более современных процессов поможет нам в восстановлении промышленности"
 BEL_Expand_the_Flemish_Diamond_desc: "«Фламандский алмаз» — это недавно промышленно развитый район вокруг Брюсселя, нуждающийся в расширении и реконструкции."
 BEL_Develop_Chemical_and_Automobile_Industries_desc: "Производство таких товаров, как нефтехимия и автомобили, позволит нашей торговле расти и расширяться."
 BEL_Expand_Belgian_Beer_Imports_desc: "Бельгия всегда была известна своим пивом, и в эпоху реактивных двигателей мы расширим производство, чтобы обеспечить доступ к нашему пиву во всем мире."
 BEL_Diversify_Away_From_the_Coal_Industry_desc: "Южный регион Валлонии всегда был известен как крупный промышленный район по добыче угля. Признавая потребность в большем количестве альтернативных форм энергии, мы должны осторожно обратиться к источникам, отличным от угля."
 BEL_Make_Antwerp_a_Large_European_Trade_Hub_desc: "Антверпен был крупным бельгийским городом с момента основания страны в 1830 году и даже раньше. Расширение порта Антверпена в торговлю для всей Европы помогло бы не только континенту, но и нашей морской промышленности."
 BEL_Prioritize_Technical_Education_desc: "Вместо того, чтобы сосредотачиваться исключительно на академическом образовании, мы должны предоставить пути для программ профессионального и технического образования, чтобы люди могли сразу после окончания школы приступить к работе."
 BEL_Reduce_Conscription_Time_to_18_Months_desc: "Наши вооруженные силы достаточно сильны, и наша потребность в воинской повинности не обязательно нужна в это время хрупкого мира. При сохранении нашей призывной политики мы снизим срок службы до полутора лет вместо двух и более лет, как это было раньше."
 BEL_Award_Colonel_De_Melen_For_His_Service_desc: "Полковник Анри Моро де Мелен был командиром бельгийского батальона во время Корейской войны, а до войны был министром обороны. За свою службу (и службу в подразделении в Корее) он должен быть должным образом награжден."
 BEL_Enact_the_Second_De_Taeye_Act_desc: "Несмотря на споры, Второй закон Де Тэя, названный в честь министра жилищного строительства Де Тэе, разрушит заброшенные здания и трущобы для улучшения городского развития."
 BEL_Welcome_US_Military_Aid_desc: "При строительстве нашей армии необходимо заручиться помощью американцев в виде пожертвований военной техники, включая огнестрельное оружие, танки и самолеты."
 BEL_Investigate_Mining_Conditions_in_Wallonia_desc: "После нескольких аварий на шахтах в Валлонии мы считаем необходимым изучить условия добычи и безопасности, чтобы переоценить ценность нашей горнодобывающей промышленности в регионе."
 BEL_CSP_Prepare_For_Expo_58_desc: "Пришло время подготовиться к Всемирной выставке 1958 года в Брюсселе, включая строительство инфраструктурных сетей и больших павильонов для поддержки делегаций."
 BEL_Van_Ackers_Welfare_State_desc: "Под руководством премьер-министра Ахилла ван Акера будет построено более сильное государство всеобщего благосостояния, чтобы предоставить необходимые средства пенсионерам, малообеспеченным лицам и семьям."
 BEL_The_Collard_Act_desc: "Закон об образовании, представленный министром образования Лео Колларом, потребует, чтобы все учителя были официально сертифицированы, что лишает священников и других представителей духовенства, работающих учителями, права управлять школами."
 BEL_Institute_a_45_Hour_Workweek_desc: "Доказано, что более короткая рабочая неделя повышает производительность труда сотрудников и способствует повышению морального духа на рабочем месте. Сокращение часов максимум до 45 в неделю для физических лиц гарантирует стабильность бизнеса и счастливых людей."
 BEL_Reduce_Compulsory_Military_Service_desc: "Наши вооруженные силы достаточно сильны, и наша потребность в воинской повинности не обязательно нужна в это время хрупкого мира. При сохранении нашей призывной политики мы снизим срок службы до полутора лет вместо двух и более лет, как это было раньше."
 BEL_Begin_Issuing_Pensions_to_Eligible_Citizens_desc: "Пенсионный фонд должен быть самым важным аспектом нашей программы социального обеспечения, чтобы позволить пожилым людям жить в комфорте и стабильности в свои более поздние годы, не беспокоясь о финансовых проблемах."
 BEL_The_Father_of_Belgian_Social_Security_desc: "Ван Акера следует мифологизировать как отца бельгийского социального обеспечения и архитектора нашей системы социального обеспечения на долгие годы вперед."
 BEL_BSP_Prepare_For_Expo_58_desc: "Пришло время подготовиться к Всемирной выставке 1958 года в Брюсселе, включая строительство инфраструктурных сетей и больших павильонов для поддержки делегаций."
 BEL_The_Second_School_War_desc: "Вторая школьная война - это продолжительный период конфликта вокруг дебатов об образовании..."
 BEL_Continue_Separate_Catholic_Education_desc: "Отдельное католическое образование необходимо, чтобы католическая молодежь не подвергалась светскому и атеистическому влиянию."
 BEL_Repeal_the_Harmel_Education_Laws_desc: "Отмена законов об образовании Армеля обеспечит равенство в заработной плате католических и светских учителей, а также отменит субсидии католическим школам."
 BEL_Subsidize_Catholic_Teachers_Pay_desc: "Учителя-католики составляют основу образования наших детей, и их количество должно быть соответствующим образом увеличено."
 BEL_Face_Protests_From_the_Socialists_and_Liberals_desc: "Социалисты и либералы протестуют против нашей политики в области образования, и мы должны относиться к этим демонстрациям соответствующим образом."
 BEL_Take_Criticism_From_the_CDLD_and_Bishops_desc: "Несколько католических епископов и организаций публично осудили наши образовательные реформы, и они найдут сильный отклик в умах людей."
 BEL_Begin_Negotiations_with_the_Opposition_desc: "Начало переговоров с оппозицией по поводу образовательного конфликта может сократить этот кризис и обеспечить качественное образование для нашей молодежи."
 BEL_Begin_Campaigning_on_Education_Before_the_Election_desc: "Приближаются следующие выборы, и образование будет большой темой в умах людей при голосовании; мы должны сосредоточиться на этом вопросе во время кампании."
 BEL_Put_Down_the_PSB_Liberal_Protests_desc: "Социалисты и либералы зашли достаточно далеко в своих протестах, и их противостояние недопустимо."
 BEL_Put_Down_the_Catholic_CSP_Protests_desc: "Католики зашли достаточно далеко в своих протестах, и их оппозицию никто не потерпит."
  
 BEL_Form_A_CSP_BSP_Government_desc: "Сотрудничество с оппозицией возможно и необходимо для эффективного правительства."
 BEL_Reach_an_Agreement_with_the_School_Pact_desc: "Дебаты об образовании, наконец, будут урегулированы Школьным пактом, соглашением между обеими сторонами по этому вопросу."
 BEL_Prioritize_Regional_Economies_desc: "Сосредоточение внимания на региональной экономике, а не на нашей национальной экономике, обеспечит большую автономию и независимость между нашими двумя регионами."
 BEL_Reduce_the_Price_of_Belgian_Coal_desc: "Снижение цены на наш уголь может повлиять на нашу промышленность, и позволит большим иностранным покупателям купить наш уголь."
 BEL_Resist_Separate_French_and_Dutch_Language_Laws_desc: "Языковое законодательство — довольно новая идея в Бельгии, и отдельные языки в некоторых частях Бельгии только усложнят жизнь."
 BEL_Enact_the_Expansion_Acts_desc: "Принятие Закона о расширении, каким бы спорным он ни был, стабилизирует нашу страну."
 BEL_The_Leopoldville_Riots_desc: "Под нашим правлением туземцы в Конго стали непокорными; особенно политическая партия ABAKO, которой было отказано в собрании в знак протеста против правительства. Мы должны придумать, как реагировать."
 BEL_Deploy_the_Force_Publique_desc: "Force Publique, или колониальная жандармерия, должны быть развернуты на улицах Леопольдвиля, чтобы восстановить порядок и арестовать тех, кто несет ответственность за гражданское неповиновение в Леопольдвиле."
 BEL_Let_the_Congolese_Protest_desc: "Вместо того, чтобы немедленно подавлять протесты, мы будем наблюдать и позволять протестовать туземцам, производя аресты только в случае крайней необходимости."
 BEL_Increase_Hospital_Bedcount_desc: "Увеличение количества коек и другой инфраструктуры в наших больницах позволит улучшить систему здравоохранения и обеспечить душевное спокойствие наших сотрудников."
 BEL_Defend_the_Collard_Act_Against_Opposition_desc: "Оппозиция в последние дни была большой, сосредоточенной вокруг Закона Коллара о лишении избирательных прав католических священников, которые были учителями до принятия Закона. Мы будем защищать это нашей политикой успешного образования."
 BEL_Focus_on_Water_and_Agricultural_Projects_desc: "Работа над водной инфраструктурой и модернизированными сельскохозяйственными системами увеличит нашу продовольственную и растениеводческую промышленность и снизит зависимость от промышленного производства."
 BEL_Begin_Rethinking_the_Congo_Situation_desc: "Наша территория в Бельгийском Конго с каждым днем становится все более спорной, особенно когда другие колонии восстают и сталкиваются с проблемой независимости. Возможно, нам следует рассмотреть возможные варианты действий."
 BEL_Focus_on_Hydroelectric_Energy_desc: "Начало планирования новых систем гидроэлектрических плотин позволит контролировать наши водные системы и обеспечит стабильный источник энергии."
 BEL_Hold_Hearings_on_the_Colonial_Situation_desc: "Парламент и Министерство колоний должны провести слушания по колониальной ситуации, чтобы действительно выяснить, что происходит, и прийти к консенсусу по этому вопросу."
