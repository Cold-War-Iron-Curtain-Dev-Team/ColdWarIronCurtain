 #Algerian Air Force 
  
 ALG_fighter_equipment_0: "Al Quwwat aljawwiya aljaza'eriiya"
 ALG_fighter_equipment_0_short: "AAF"
 ALG_fighter_equipment_0_desc: "Алжирские военно-воздушные силы (AAF) (Al Quwwat aljawwiya aljaza'eriiya на арабском языке или; Forces Aériennes на французском языке) являются воздушным оружием Алжирской народной национальной армии. Алжирские ВВС были созданы для поддержки борьбы Народной национальной армии против французских оккупационных сил. Они появились в рамках решений конгресса Суммам, состоявшегося 20 августа 1956 года, который рекомендовал долгосрочный план по формированию современной армии.."
  
 #ALG_jet_multirole_equipment_1: ""
 #ALG_jet_multirole_equipment_1_desc: ""
 ALG_jet_multirole_equipment_2: "Микоян-Гуревич МиГ-15"
 ALG_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 "Фагот" Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления в Корейской войне, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые из них все еще остаются на вооружении ВВС Северной Кореи."
 ALG_jet_multirole_equipment_2_short: "МиГ-15"
 ALG_jet_multirole_equipment_3: "Микоян-Гуревич МиГ-17"
 ALG_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 "Фагот". Более 10 000 МиГ-17 "Фреско" было произведено с 1952 года. МиГ-17 был построен по лицензии в ВВС НОАК как Shenyang J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabres над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе ВВС НОАК и ВВС НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял более современным сверхзвуковым американским истребителям Phantom II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно эксплуатируется в некоторых африканских странах и Северной Корее."
 ALG_jet_multirole_equipment_3_short: "МиГ-17"
 ALG_jet_multirole_equipment_4: "Микоян-Гуревич МиГ-17Ф"
 #ALG_jet_multirole_equipment_4_desc: ""
 ALG_jet_multirole_equipment_4_short: "МиГ-17F"
 ALG_jet_multirole_equipment_5: "Микоян-Гуревич МиГ-21Ф-13"
 ALG_jet_multirole_equipment_5_desc: "МиГ-21 Fishbed считается одним из самых ранних советских истребителей третьего поколения, оснащенным ракетами дальнего радиуса действия и импульсным радаром. МиГ-21 - самый производимый сверхзвуковой самолет в истории, особенно большое количество было построено в Китае и Индии по лицензии. Всего было построено более 11 000 самолетов, которые служат в более чем 60 странах на 5 континентах. За время своей службы МиГ-21 совершил 240 воздушных убийств. МиГ-21 участвовал во многих конфликтах, включая Вьетнам (где он добился огромных успехов), индийско-пакистанскую войну 1971 года, ирано-иракскую войну и множество более мелких конфликтов. Он остается в строю уже более 6 десятилетий."
 ALG_jet_multirole_equipment_5_short: "МиГ-21Ф-13"
 ALG_jet_multirole_equipment_6: "Микоян-Гуревич МиГ-21МФ"
 ALG_jet_multirole_equipment_6_desc: "Серийный вариант всепогодного перехватчика. Они оснащались турбореактивными двигателями R11F2-300 и, начиная с седьмой серийной партии, оснащались радаром РП-21 (на первых шести партиях использовался более старый радар ЦД-30Т (он же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую АУ РС-2УС (она же К-5МС) в дополнение к К-13 с ИК-целью."
 ALG_jet_multirole_equipment_6_short: "МиГ-21МФ"
 ALG_jet_multirole_equipment_7: "Микоян-Гуревич МиГ-21"
 ALG_jet_multirole_equipment_7_short: "МиГ-21"
 ALG_jet_multirole_equipment_7_desc: "Окончательное развитие МиГ-21, оснащенный турбореактивным двигателем Туманского Р25-300 и множеством других усовершенствований по сравнению с предыдущими типами. МиГ-21бис для советского ПВО оснащались системой ГСИ "Лазурь", а для советских ВВС - системой ИЛС "Полет"."
 ALG_jet_multirole_equipment_8: "Микоян-Гуревич МиГ-23МЛ"
 ALG_jet_multirole_equipment_8_desc: "Ранние варианты "Флоггера" имели ряд конструктивных недостатков, включая прочность и надежность планера, работу двигателя, маневренность и радиолокационные характеристики. Была проведена значительная переделка планера, в результате которой появился МиГ-23МЛ."
 ALG_jet_multirole_equipment_8_short: "МиГ-23МЛ"
 ALG_jet_multirole_equipment_9: "Микоян-Гуревич МиГ-23МЛД"
 ALG_jet_multirole_equipment_9_desc: "МиГ-23МЛД был окончательным вариантом истребителя МиГ-23. Основным направлением модернизации было улучшение маневренности, особенно на больших углах атаки, что было признано главным недостатком МиГ-23М/МЛ. Стрела Пито была оснащена вихревыми генераторами, а зазубренные корни передней кромки крыла были "распилены", чтобы также служить вихревыми генераторами. Система управления полетом включала синтетическое устройство "стик-стоп"/ограничитель сигналов SOS-3-4."
 ALG_jet_multirole_equipment_9_short: "МиГ-23МЛД"
 ALG_jet_multirole_equipment_10: "Микоян-Гуревич МиГ-29A"
 ALG_jet_multirole_equipment_10_desc: "МиГ-29 Fulcrum A был первоначально разработан в ОКБ Микояна. Это был первый истребитель 4-го поколения, поступивший на вооружение СССР и стран Восточного блока. В нем была установлена усовершенствованная авионика и значительно расширены возможности радара. Первые МиГ-29 использовались в качестве учебно-тренировочных самолетов в странах Варшавского договора и поставлялись на экспорт в Индию, но имели ограниченное боевое применение. Впоследствии МиГ-29 стал базой для широко выпускаемых вариантов, таких как МиГ-29С, МиГ-29М и МиГ-35."
 ALG_jet_multirole_equipment_10_short: "МиГ-29A"
  
 ALG_mr_stealth_fighter_equipment_1: "Микоян МиГ-29С"
 ALG_mr_stealth_fighter_equipment_1_short: "МиГ-29С"
 ALG_mr_stealth_fighter_equipment_1_desc: "На МиГ-29С, получившем в НАТО отчетный код "Fulcrum-C", усовершенствована система управления полетом; в общей сложности четыре новых компьютера обеспечивают лучшее повышение устойчивости и управляемости с увеличением угла атаки (УА) на 2°. Улучшенная механико-гидравлическая система управления полетом позволяет увеличить отклонения поверхности управления."
  
  
 ALG_jet_interceptor_equipment_3: "Микоян-Гуревич МиГ-17ПФ"
 ALG_jet_interceptor_equipment_3_desc: "All-weather fighter-interceptor version equipped with Izumrud radar, 3 x 23 mm NR-23 cannons and VK-1F engine"
 ALG_jet_interceptor_equipment_3_short: "МиГ-17ПФ"
  
 ALG_jet_interceptor_equipment_7: "Микоян-Гуревич МиГ-25П"
 ALG_jet_interceptor_equipment_7_desc: "Микояна-Гуревича МиГ-25 Foxbat, пожалуй, один из самых влиятельных советских самолетов в истории. Первый прототип МиГ-25 поднялся в воздух в начале 1964 года, а официально поступил на вооружение в 1970 году. В течение всего срока службы было построено более 1150 самолетов, которые были проданы многим странам, включая Сирию, Ирак и Индию. Самолет был разработан для быстрого перехвата таких сверхвысотных самолетов, как U-2 и B-58, с молниеносной скоростью. Этот самолет обеспечил Советскому Союзу гораздо более высокий контроль над собственным удаленным воздушным пространством, чем когда-либо прежде. Он и сегодня ограниченно используется в ВВС России."
 ALG_jet_interceptor_equipment_7_short: "МиГ-25П"
 ALG_jet_interceptor_equipment_8: "Микоян-Гуревич МиГ-25ПД"
 ALG_jet_interceptor_equipment_8_desc: "Микояна-Гуревича МиГ-25 Foxbat, пожалуй, один из самых влиятельных советских самолетов в истории. Первый прототип МиГ-25 поднялся в воздух в начале 1964 года, а официально поступил на вооружение в 1970 году. В течение всего срока службы было построено более 1150 самолетов, которые были проданы многим странам, включая Сирию, Ирак и Индию. Самолет был разработан для быстрого перехвата таких сверхвысотных самолетов, как U-2 и B-58, с молниеносной скоростью. Этот самолет обеспечил Советскому Союзу гораздо более высокий контроль над собственным удаленным воздушным пространством, чем когда-либо прежде. Он и сегодня ограниченно используется в ВВС России."
 ALG_jet_interceptor_equipment_8_short: "МиГ-25ПД"
  
  
 ALG_jet_CAS_equipment_2: "Микоян-Гуревич МиГ-17"
 ALG_jet_CAS_equipment_2_short: "МиГ-17"
 ALG_jet_CAS_equipment_2_desc: "Переоборудование истребителя-бомбардировщика, оснащенного возможностью нести неуправляемые ракеты и бомбы."
 #ALG_jet_CAS_equipment_3: "Mikoyan-Guerevich MiG-19S"
 #ALG_jet_CAS_equipment_3_short: "MiG-19S"
 #ALG_jet_CAS_equipment_3_desc: "Fighter-Bomber version with all-moving slab tail. Equipped with Svod long-range navigation receiver and armed with three 30 mm NR-30 cannons. Had provisions for an ORO-32K rocket unguided rocket pack or a FAB-250 bomb under each wing, and from 1957 modified to allow four rocket pods to be carried."
 ALG_jet_CAS_equipment_4: "Сухой Су-7Б"
 ALG_jet_CAS_equipment_4_short: "Су-7Б"
 ALG_jet_CAS_equipment_4_desc: "Бомбардировочный вариант Су-7 "Фиттер-А" впервые поднялся в воздух в марте 1959 года и поступил на вооружение в 1961 году. В дальнейшем он стал основным советским штурмовиком 1960-х годов. В 1957-1972 годах было построено более 1400 самолетов Су-7Б, многие из которых были поставлены на экспорт. Самолет был относительно популярен за рубежом, где он служил в 10 странах. Он активно использовался в ВВС Индии и Египта. Самолет по-прежнему ограниченно эксплуатируется в Северной Корее."
 ALG_jet_CAS_equipment_5: "Сухой Су-7БКЛ"
 ALG_jet_CAS_equipment_5_short: "Су-7БКЛ"
 ALG_jet_CAS_equipment_5_desc: "Модернизированный двигатель AL-7F-1, модернизированная топливная система с внешними трубопроводами по обе стороны от хребта фюзеляжа, топливные баки, установленные в крыльях, "мокрые" подкрыльевые жесткие точки для установки внешних топливных баков, возможность нести тактические ядерные бомбы."
 ALG_jet_CAS_equipment_6: "Сухой Су-7БМК"
 ALG_jet_CAS_equipment_6_short: "Су-7БМК"
 #ALG_jet_CAS_equipment_6_desc: ""
 ALG_jet_CAS_equipment_7: "Микоян-Гуревич МиГ-23БН"
 ALG_jet_CAS_equipment_7_desc: "("Flogger-H") Модернизированный вариант МиГ-23Б, МиГ-23БН отличался тем, что на нем были установлены крылья версии 3 и двигатель Р-29, характерные для современных вариантов истребителя, а также незначительные изменения в электронике и оборудовании. Другим существенным отличием было удаление диэлектрической головки, установленной на МиГ-23Б. С 1973 по 1985 год было построено 624 МиГ-23БН, но лишь небольшое их количество служило в частях ВВС, а остальные были отправлены на экспорт."
 ALG_jet_CAS_equipment_7_short: "МиГ-23БН"
 #ALG_jet_CAS_equipment_8: "Sukhoi Su-25K"
 #ALG_jet_CAS_equipment_8_short: "Su-25K"
 #ALG_jet_CAS_equipment_8_desc: "The Sukhoi Su-25 Frogfoot is a twin-engine ground attack aircraft developed in the Soviet union. The aircraft completed its maiden flight in 1975 and was introduced in 1981. Since 1978 over 1000 aircraft have been produced. It was particularly popular aircraft overseas, being sold to 29 countries. Because of this the Su-25 has been involved in several conflicts, notably the Soviet Afghan, Iran-Iraq and Gulf Wars. The aircraft remains in service with all export countries today."
  
 #ALG_cas_stealth_equipment_1: ""
 #ALG_cas_stealth_equipment_1_short: ""
  
 ALG_jet_light_equipment_2: "Микоян-Гуревич МиГ-15УТИ"
 ALG_jet_light_equipment_2_short: "МиГ-15УТИ"
 ALG_jet_light_equipment_2_desc: "6 апреля 1949 года коллективу ОКБ-155 было официально поручено разработать учебно-тренировочный вариант истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен на заводе № 1 в марте-мае 1949 года. Кабина инструктора на УТИ МиГ-15 была размещена за счет уменьшения первого фюзеляжного топливного бака. Обе герметичные кабины были оборудованы катапультными креслами и фонарями пиромеханического сброса.  Специальное оборудование машины состояло из автоматического пушечного прицела АСП-1Н, приемопередающей радиостанции РСИ-6К, радиокомпаса с маркером РПКО-10М, переговорного устройства СПУ-2М, кислородного прибора КП-14 и фотоаппарата АФА-ИМ. Вооружение состояло из одной 23-мм пушки НР-23 с боекомплектом 80 патронов и одного пулемета УБК-Э с боекомплектом 150 патронов."
 #ALG_jet_light_equipment_3: "L-29 Delfin"
 #ALG_jet_light_equipment_3_short: "L-29 Delfin"
 #ALG_jet_light_equipment_3_desc: "The Aero L-29 Delfín (English: Dolphin, NATO reporting name: Maya) is a military jet trainer developed and manufactured by Czechoslovakian aviation manufacturer Aero Vodochody. During the course of the programme, in excess of 3,000 L-29 Delfin trainers were produced. Of these, around 2,000 were reported to have been delivered to the Soviet Union, where it was used as the standard trainer for the Soviet Air Force."
 ALG_jet_light_equipment_4: "Аэро Л-39 Альбатрос"
 ALG_jet_light_equipment_4_short: "Л-39 Альбатрос"
 ALG_jet_light_equipment_4_desc: "Aero L-39 Albatros - это высокоэффективный реактивный учебно-тренировочный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах как замена Aero L-29 Delfín в качестве основного учебного самолета. Это был первый учебно-тренировочный самолет, оснащенный турбовентиляторной силовой установкой. Этот тип экспортировался во многие страны в качестве военного учебно-тренировочного самолета.."
 ALG_jet_light_equipment_5: "Аэро Л-39ЗА Альбатрос"
 ALG_jet_light_equipment_5_short: "Л-39ЗА Альбатрос"
 ALG_jet_light_equipment_5_desc: "Значительно модернизированный L-39 для вооруженной подготовки и легких атак, с более прочным шасси, увеличенной полезной нагрузкой и, в частности, с возможностью установки 23-миллиметровой двухствольной пушки GSh-23L, закрепленной в конформной капсуле под кабиной пилота, с магазином на 150 патронов внутри планера.."
  
 #ALG_recon_equipment_0: ""
 #ALG_recon_equipment_0_short: ""
 #ALG_recon_equipment_0_desc: ""
 ALG_jet_recon_equipment_0: "Микоян-Гуревич МиГ-15Р"
 ALG_jet_recon_equipment_0_short: "МиГ-15Р"
 ALG_jet_recon_equipment_0_desc: "В 25 апреля 1950 года ОКБ МиГ начало разработку фронтового разведывательного варианта МиГ-15 с фотоаппаратом АФА-БА/40, обеспечивающего съемку полосы шириной от 0,9 до 4,5 км при длине маршрута фотографирования от 90 до 450 км на высотах от 2000 до 10000м. На самолете была установлена только одна пушка НР-23. Для увеличения дальности полета разведчика впоследствии на балках были установлены замки Д4-50, что позволило подвесить под крылом 600-литровые топливные баки улучшенной формы. Кроме того, на машине был установлен транспондер "Барий-М" и дополнительный 2-литровый кислородный баллон."
 ALG_jet_recon_equipment_1: "Микоян-Гуревич МиГ-25РБ"
 ALG_jet_recon_equipment_1_short: "МиГ-25РБ"
 ALG_jet_recon_equipment_1_desc: "МиГ-25РБ - одноместный всевысотный оперативный самолет-разведчик - бомбардировщик. Испытания были завершены в декабре 1970 года. Самолет был оснащен 2-4 фотоаппаратами общей разведки А-70М и одним топографическим АФА-Э/10. Фотографическое оборудование размещалось в пяти отсеках, расположенных в нижней части носовой части фюзеляжа. Также была установлена станция SIGINT под названием SPS-4A или B 'Virage', работающая в различных частотных диапазонах. Специальное оборудование - станция активных радиопомех SPS-141"
 ALG_jet_recon_equipment_2: "Сухой Су-24МР"
 ALG_jet_recon_equipment_2_short: "Су-24МР"
 ALG_jet_recon_equipment_2_desc: "Специализированный тактический разведывательный вариант. Су-24МР сохраняет большую часть навигационного комплекса Су-24М, включая РЛС слежения за местностью, но исключает ударный радар "Орион-А", лазерно-телевизионную систему и пушку в пользу двух панорамных камер, телекамеры "Аист-М" ("Аист"), РЛС бокового обзора РДС-БО "Штык" ("Штык") и инфракрасной системы разведки "Зима" ("Зима"). Другие датчики перевозятся в виде капсул."
  
 ALG_jet_tac_bomber_equipment_5: "Микоян-Гуревич МиГ-25РБТ"
 ALG_jet_tac_bomber_equipment_5_short: "МиГ-25РБС"
 ALG_jet_tac_bomber_equipment_5_desc: "МиГ-25РБС - одноместный разведчик-бомбардировщик, производный от МиГ-25Р, оснащенный усовершенствованными системами разведки и автоматической системой бомбометания "Пеленг". Самолет может нести бомбовую нагрузку из восьми бомб весом 500 кг (1 102 фунта)."
 ALG_jet_tac_bomber_equipment_6: "Сухой Су-24"
 ALG_jet_tac_bomber_equipment_6_short: "Су-24"
 ALG_jet_tac_bomber_equipment_6_desc: "Большой истребитель-бомбардировщик, разработанный Советским Союзом в 1960-х годах и используемый по сей день. Характерными особенностями являются изменяемые крылья и острый корпус. Он может оснащаться до 8 000 кг вооружения и способен запускать различные типы ракет класса "воздух-земля", сохраняя при этом стабильную скорость. Этот самолет известен под кодовым названием НАТО "Fencer". Вместе со своим преемником, Су-34, он в настоящее время активно используется в качестве истребителя-бомбардировщика в странах бывшего Восточного лагеря."
 ALG_jet_tac_bomber_equipment_7: "Сухой Су-24M"
 ALG_jet_tac_bomber_equipment_7_short: "Су-24M"
 ALG_jet_tac_bomber_equipment_7_desc: "Су-24М, поступивший на вооружение в 1983 году, стал дальнейшим развитием Су-24 с момента принятия на вооружение первоначального типа. Одной из основных особенностей Су-24М является возможность дозаправки в полете с помощью выдвижного заправочного зонда, новая внутренняя навигационная система и лазерный целеуказатель "Кайра-24", позволяющий использовать бомбы с точным наведением. На Западе он известен как Fencer-D."
 ALG_jet_tac_bomber_equipment_8: "Сухой Су-24MK"
 ALG_jet_tac_bomber_equipment_8_short: "Су-24MK"
 ALG_jet_tac_bomber_equipment_8_desc: "Су-24М, поступивший на вооружение в 1983 году, стал дальнейшим развитием Су-24 с момента принятия на вооружение первоначального типа. Одной из основных особенностей Су-24М является возможность дозаправки в полете с помощью выдвижного заправочного зонда, новая внутренняя навигационная система и лазерный целеуказатель "Кайра-24", позволяющий использовать бомбы с точным наведением. На Западе он известен как Fencer-D."
  
 ALG_nav_bomber_equipment_8: "АТР 72 Морской патрульный региональный транспортный самолет"
 ALG_nav_bomber_equipment_8_short: "АТР 72 МП"
  
