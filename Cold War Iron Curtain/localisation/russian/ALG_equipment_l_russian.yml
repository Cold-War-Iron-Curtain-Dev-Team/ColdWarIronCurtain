  #Algeria infantry equipment 
  
 ALG_infantry_equipment_0: "MAS-36"
 ALG_infantry_equipment_0_short: "MAS-36"
 ALG_infantry_equipment_0_desc: "Винтовка MAS-36 была разработана в 1927 году под французский патрон 7,62х54 мм и принята на вооружение в 1936 году в качестве замены служебных винтовок Berthier и Lebel. Во время Второй мировой войны винтовка была принята на вооружение в ограниченном количестве, но благодаря массовому производству после окончания войны она принимала участие в многочисленных конфликтах разных стран. После Второй мировой войны винтовки были модернизированы с точки зрения эргономики. В некоторых вариантах винтовка была дополнена прикрепляемой винтовочной гранатой и моделью для стрелков. Предполагалось, что она будет лишь промежуточной винтовкой, созданной на базе оборудования, которое может быть использовано для создания самозарядных винтовок, ожидаемых в будущем."
  
 ALG_infantry_equipment_1: "Автомат Калашникова 1947"
 ALG_infantry_equipment_1_short: "AK-47"
 ALG_infantry_equipment_1_desc: "АК47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Тимофеевичем Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. В течение многих лет АК47 считался одним из самых надежных и простых в обслуживании, обращении и освоении оружием в мире."
  
 ALG_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 ALG_infantry_equipment_2_short: "AKM"
 ALG_infantry_equipment_2_desc: "АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия снизился на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ сразу и повсеместно стал использоваться во многих коммунистических странах и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
  
 ALG_infantry_equipment_3: "Автомат Калашникова модернизированный ПМ 89"
 ALG_infantry_equipment_3_short: "ПМ 89"
 ALG_infantry_equipment_3_desc: "Местный вариант устаревшего автомата АКМ на вооружении Алжира"
  
 ALG_infantry_equipment_4: "Автомат Калашникова AK-103"
 ALG_infantry_equipment_4_short: "AK-103"
 ALG_infantry_equipment_4_desc: "АК-103 - автомат, разработанный российским конструктором стрелкового оружия Михаилом Тимофеевичем Калашниковым в 1994 году. Он является производным АК-100 от АК-74М под патрон 7,62x39 мм М43, аналогичный АКМ.."
  
  ########## NEW ALG ARMOR 
  
 ALG_mbt_equipment_0: "T-34-85"
 ALG_mbt_equipment_0_short: "T-34-85"
 ALG_mbt_equipment_1: "T-34-85M"
 ALG_mbt_equipment_1_short: "T-34-85M"
 ALG_mbt_equipment_2: "T-54"
 ALG_mbt_equipment_2_short: "T-54"
 ALG_mbt_equipment_2_desc: "Танк Т-54 был самым производимым танком в истории. Танк был разработан в 1946 году конструктором КМБД. Танк оснащен 100-мм нарезной пушкой и имеет различную толщину брони - от 205 мм до 60 мм. Двигатель - дизельный V-12 объемом 38,88 л. Танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался в более чем 50 армиях мира и выпускался на протяжении всего советского периода и всех конфликтов вместе с ним.."
 ALG_mbt_equipment_3: "T-55"
 ALG_mbt_equipment_3_short: "T-55"
 ALG_mbt_equipment_3_desc: "Т-55 - это усовершенствованная версия танка Т-54. ОКБ-520 модифицировало конструкцию Т-55, улучшив противоядерную защиту, поставив более оптимизированный двигатель, улучшив форму башни, и даже добавив дополнительное оборудование, такое как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал 12,7 ДШК HMG, в то время как Т-54 использовал 7,62 SGMT пушку, что давало ему больше огневой мощи, но не позволяло нести больше боеприпасов. Т-55 использовался в столь же многочисленных армиях и, как правило, участвовал во всех конфликтах, в которых участвовал Т-54."
 ALG_mbt_equipment_4: "T-62"
 ALG_mbt_equipment_4_short: "T-62"
 ALG_mbt_equipment_4_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет несколько более толстую броню. Главная пушка также была увеличена до 115 мм. Изначально он был заказан Советским Союзом в попытке улучшить огневую мощь, и конструкторское бюро ОКБ-520 завершило проект около 1960 года. Несмотря на усовершенствование, производство не было прекращено, так как его стоимость была номинально выше, чем у Т-55. Было произведено более 22 700 единиц Т-62, которые приняли участие в огромном количестве боевых действий по всей советской территории, но в основном в конфликтах на Ближнем Востоке. Его усовершенствования показали несколько большие возможности в 1969 году в китайско-советском пограничном конфликте."
 ALG_mbt_equipment_5: "T-62M"
 ALG_mbt_equipment_5_short: "T-62M"
 ALG_mbt_equipment_5_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет несколько более толстую броню. Главная пушка также была увеличена до 115 мм. Изначально он был заказан Советским Союзом в попытке улучшить огневую мощь, и конструкторское бюро ОКБ-520 завершило проект около 1960 года. Несмотря на усовершенствование, производство не было прекращено, так как его стоимость была номинально выше, чем у Т-55. Было произведено более 22 700 единиц Т-62, которые приняли участие в огромном количестве боевых действий по всей советской территории, но в основном в конфликтах на Ближнем Востоке. Его усовершенствования показали несколько большие возможности в 1969 году в китайско-советском пограничном конфликте."
 ALG_mbt_equipment_6: "T-72"
 ALG_mbt_equipment_6_short: "T-72"
 ALG_mbt_equipment_6_desc: "Т-72 - советский танк нового поколения, созданный в основном для замены Т-62 и его дорогостоящего аналога Т-64. Он стоил почти в два раза дешевле Т-64 и был значительно усовершенствован. Его разработка была завершена в 1973 году Леонидом Венедиктовым и показала невероятные возможности. Орудие и броня по-прежнему были 125-мм и композитными соответственно, но с гораздо более экономически обоснованной конструкцией, которую было легче производить. Двигатель - V-12 мощностью 780 л.с., который впоследствии мог быть переоборудован в 1130-сильный. Танк мог достичь невероятной подвижности, развивая скорость до 80 км/ч, и мог преодолевать более суровые участки местности лучше, чем Т-64. В отличие от Т-64, он использовался во всех конфликтах на советском пространстве и продемонстрировал невероятные возможности и в них. Танк также использовался во внесоветских конфликтах в Африке, на Ближнем Востоке и в Индокитае."
