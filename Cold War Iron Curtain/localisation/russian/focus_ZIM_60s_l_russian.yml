l_russian:
 ZIM_60s_1961_constitution: "Конституция 1961 года"
 ZIM_60s_winds_of_change: "Речь «Ветер Перемен» "
 ZIM_60s_winds_of_change_desc: "Эта речь правительства Великобритании под руководством консерваторов показала, что Англия не намерена мешать независимости многих своих территорий. Это приведет к большему стремлению к независимости Родезии."
 ZIM_60s_end_of_union: "Конец союза"
 ZIM_60s_end_of_union_desc: "Несмотря на огромные усилия, союз не может продолжать существовать. Но кто знает, может это приведет к чему-то лучшему?"
 ZIM_60s_refugees_from_congo: "Белые беженцы из Конго"
 ZIM_60s_refugees_from_congo_desc: "В связи с недавними беспорядками в Конго, многие белые ищут место для проживания. Почему бы не предложить им поселиться здесь?"
 ZIM_60s_reinforce_union: "Усилить союз"
 ZIM_60s_reinforce_union_desc: "Союз трещит по швам. Растущий национализм, как со стороны черных, так и со стороны белых, побудил многих бороться за независимость."
 ZIM_60s_1961_constitution_desc: "Новая пересмотренная конституция, которая уменьшает британское влияние на нашу политику."
 ZIM_60s_bictoria_falls_conference: "Конференция у водопада Виктория"
 ZIM_60s_bictoria_falls_conference_desc: "Конференция - наша последняя надежда на сохранение союза. И, насколько бы нам больно не было об этом думать, мы должны также обсудить конец союза там."
 ZIM_60s_improve_white_condition: "Улучшить благосостояние белых"
 ZIM_60s_improve_white_condition_desc: "Хотя белые находятся в хорошем положении, оно всегда может стать лучше."
 ZIM_60s_an_ace: "Туз в рукаве"
 ZIM_60s_an_ace_desc: "Это могло бы выглядеть как обычные выборы, но на этот раз великие вещи вот-вот могут произойти."
 ZIM_60s_rhodesian_front: "Родезийский фронт"
 ZIM_60s_rhodesian_front_desc: "Пратия родезийских националистов. Для тех, кто хочет сделать Родезию великой."
 ZIM_60s_african_nationalism: "Африканский национализм"
 ZIM_60s_african_nationalism_desc: "Время перемен уже наступило. Африканский национализм находится на подъеме и, как таковой, окончательный переход к народовластию ставится под вопрос."
 ZIM_60s_chairman_smith: "Ответственность Смита"
 ZIM_60s_native_tactis: "Родная тактика"
 ZIM_60s_native_tactis_desc: "Для достижения наилучших результатов мы не можем полагаться на тактику, выработанную другими странами. Вместо этого, мы нуждаемся в нашей собственной доктрине, чтобы удовлетворить наши потребности."
 ZIM_60s_the_unexpected: "Односторонее провозглашение независимости"
 ZIM_60s_the_unexpected_desc: "Слишком долго мы были под британским владычеством. Теперь мы готовы вырваться на свободу и стать независимой нацией."
 ZIM_60s_rights_for_blacks: "Права черных"
 ZIM_60s_rights_for_blacks_desc: "Черных угнетают здесь достаточно долго. Больше такого не будет. Мы начинаем это исправлять с предоставления им равных прав."
 ZIM_60s_fair_elections: "Честные выборы"
 ZIM_60s_fair_elections_desc: "Честные (ну... почти) выборы будут проведены, чтобы увидеть, какая партия победит, САНЗ или ЗАНС."
 ZIM_60s_zapu: "Победа ЗАПУ"
 ZIM_60s_zanu: "Победа ЗАНУ"
 ZIM_60s_zanu_desc: "Зимбабвийский Африканский Национальный Союз победил на текущих выборах."
 ZIM_60s_zapu_desc: "Союз Африканского Народа Зимбабве победил на текущих выборах."
 ZIM_60s_aviaton: "Новая тактика для авиации"
 ZIM_60s_aviaton_desc: "С несколькими самолетами нам нужно создать способы, чтобы эффективно их использовать"
 ZIM_60s_preperations_for_independence: "Подготовка к Независимости"
 ZIM_60s_preperations_for_independence_desc: "Совершенно ясно, что мы должны стремиться к независимости. Тем не менее, мы должны тщательно продумать некоторые шаги, прежде чем это произойдет."
 ZIM_60s_rise_o_voices: "Пусть звучат голоса Родезии!"
 ZIM_60s_rise_o_voices_desc: "Пусть звучат голоса Родезии!\nБоже, просим мы щедрот Твоих.\nДать нам силу, чтоб когда мы с опасностью столкнемся,\nС бедой - мы смогли их преодолеть!"
 ZIM_60s_independence_blacc: "Независимость от ВБ"
 ZIM_60s_independence_blacc_desc: "Поскольку теперь мы полностью соответствуем принципу NIBMAR (Независимость только после предоставления власти африканскому большинству), мы можем стать независимыми."
 ZIM_60s_goodbye_union: "Прощай, союз"
 ZIM_60s_goodbye_union_desc: "Понятно, что союз долго не будет существовать."
 ZIM_60s_establish_relations_with_china: "Установить отношения с КНР"
 ZIM_60s_soviet_mission: "Советская миссия"
 ZIM_60s_soviet_mission_desc: "С момента победы ЗАПУ, мы должны установить дипломатические отношения с Советами."
 ZIM_60s_soviet_advisors: "Советские советники"
 ZIM_60s_cultural_chagnes: "Культурные изменения"
 ZIM_60s_cultural_chagnes_desc: "С нашей новообретенной независимостью мы должны изменить культуру в пользу черных."
 ZIM_60s_join_warsaw_pact: "Присоединиться к Варшавскому Пакту"
 ZIM_60s_chinese_advisors: "Китайские советники"
 ZIM_60s_join_nam: "Присоединится к Движению неприсоединения"
 ZIM_60s_Uk_accepts: "Великобритания не возражает"
 ZIM_60s_Uk_accepts_desc: "Хоть это и может быть неприятно для них, Великобритания приняла нашу независимость."
 ZIM_60s_uk_objects: "Возражения Великобритании"
 ZIM_60s_uk_objects_desc: "Как и ожидалось, Великобритания не согласна с нашей независимостью. Мы все еще должны быть настороже во избежание пакостей с их стороны."
 ZIM_60s_decleration_of_republic: "Конституционный референдум"
 ZIM_60s_commonwealth: "Содружество Родезии"
 ZIM_60s_commonwealth_desc: "С Великобританией на нашей стороне, мы должны стать Содружеством под Ее Величеством."
 ZIM_60s_de_jure: "Утверждение Смита"
 ZIM_60s_de_jure_desc: "На недавнем заседании высшего суда было решено, что Смит теперь официально правит страной. Это должно вселить уверенность в наших граждан."
 ZIM_60s_visit_of_queen: "Пригласить Королеву"
 ZIM_60s_visit_of_queen_desc: "Мы должны пригласить Королеву к нам."
 ZIM_60s_assasinate_smith: "Убийство Смита"
 ZIM_60s_assasinate_smith_desc: "Смит - это угроза для нас. С его растущими идеями разорвать связи с Великобританией, он должен быть устранен."
 ZIM_60s_new_pm_vote: "Новый премьер-министр?"
 ZIM_60s_new_pm_vote_desc: "Некоторые задаются вопросом, должен ли Смит оставаться лидером?"
 ZIM_60s_walls_coup: "Военный переворот"
 ZIM_60s_walls_coup_desc: "Пришло время навести здесь порядок."
 ZIM_60s_relations_with_commonwealth: "Отношения Содружества"
 ZIM_60s_trials_for_plotters: "Испытания для заговорщиков"
 ZIM_60s_trials_for_plotters_desc: "Любой, кто брал участие в этом покушении, должен быть наказан."
 ZIM_60s_retur_to_democracy: "Вернуться к демократии"
 ZIM_60s_retur_to_democracy_desc: "С восстановлением порядка, пришло время вернуться к демократии."
 ZIM_60s_time_for_change: "Время изменений"
 ZIM_60s_time_for_change_desc: "Демократия? Права человека? Никак нет. С контролем над вооруженными силами мы могли бы превратить Родезию в исключително белое государство..."
 ZIM_60s_persecute_blacks: "Преследовать черных"
 ZIM_60s_persecute_blacks_desc: "Пришло время очистить эту землю."
 ZIM_60s_stabilize: "Стабилизировать государство"
 ZIM_60s_stabilize_desc: "Со смертью Смита, многие находятся в шоке. Мы должны успокоить их."
 ZIM_60s_relations_with_ddr: "Отношения с ГДР"
 ZIM_60s_Black_land_reform: "ОТдать землю черным"
 ZIM_60s_five_year_plan: "Пятилетний план"
 ZIM_60s_weapons_from_ddr: "Оружие из ГДР"
 ZIM_60s_purge_zanu: "Чистка ЗАНУ"
 ZIM_60s_purge_zanu_desc: "Наш соперник, ЗАНУ, должен быть уничтожен."
 ZIM_60s_mass_mobilization: "Массовая мобилизация"
 ZIM_60s_maoist_agarian: "Маоистское сельское хозяйство"
 ZIM_60s_yugo_weapons: "Оружие из Югославии"
 ZIM_60s_self_sufficent: "Самодостаточная экономика"
 ZIM_60s_self_sufficent_desc: "Совсем скоро нас обложат экономическими санкциями. Мы должны действовать сейчас и стремиться к самодостаточной экономике."
 ZIM_60s_goodbye_britannia: "Прощай, Британия!"
 ZIM_60s_goodbye_britannia_desc: "Пора прощаться, старушка Британия\nПрощай, Британия, адью!\nЯ иду своей дорогой, Британия\nСвое прощание я тебе пою!"
 ZIM_60s_make_deals: "Сделки для поддержки"
