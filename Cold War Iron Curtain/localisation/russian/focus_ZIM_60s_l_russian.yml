 ZIM_60s_assault_from_above: "Бей врагов сверху"
 ZIM_60s_rhodesian_paratroopers: "Родезийские десантники"
 ZIM_60s_enemy_base_bombartment: "Бомбардировка вражеских баз"
 ZIM_60s_safeguard_the_nation: "Охрана нации"
 ZIM_60s_safeguard_the_nation_desc: "Наша нация сталкивается с большой угрозой со стороны коммунизма. Мы должны действовать против них прямо сейчас."
 ZIM_60s_operation_excess: "Операция "Избыток" "
 ZIM_60s_operation_excess_desc: "Операция "Избыток" является ответом на вторжение террористов ЗИПРА в западную провинцию Машоналенд"
 ZIM_60s_operation_birch: "Оперция "Береза" "
 ZIM_60s_operation_birch_desc: "Операция "Береза" является ответом на группу 22-25 боевиков ЗИПРА, пересекающих реку Замбези, которая обозначала границу между Родезией и Замбией."
