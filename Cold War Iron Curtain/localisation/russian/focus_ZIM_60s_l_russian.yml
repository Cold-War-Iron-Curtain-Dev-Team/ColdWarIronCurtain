 ZIM_60s_rhodesian_air_force: "Воздушная Силы Родезии"
 ZIM_60s_rhodesian_army: "Родезийская армия"
 ZIM_60s_focus_on_helis: "Фокус на вертолетах"
 ZIM_60s_heavy_aircraft: "Тяжелая авиация"
