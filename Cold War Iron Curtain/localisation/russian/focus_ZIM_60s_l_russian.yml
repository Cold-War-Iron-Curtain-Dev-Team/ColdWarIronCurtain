 ZIM_60s_Josiah_Gondo_70: "Джозайя Гондо"
 ZIM_60s_Outlaw_the_Oppostion: "Преследовать оппозицию"
 ZIM_60s_Garfield_Todd_63: "Гарфилд Тодд"
 ZIM_60s_Rights_for_Africans: "Права африканцев"
 ZIM_60s_Rights_for_Africans_desc: "Большинство нашего населения - африканцы, и их права не так велики. Мы должны исправить это."
 ZIM_60s_Federal_Union: "Федеративный союз"
 ZIM_60s_Federal_Union_desc: "Союз явно нуждается в реформе. Мы можем начать с превращения его в федеративный союз с тремя равными республиками."
 ZIM_60s_Economic_Develop_in_Northern_Rhodesia: "Развитие Северной Родезии"
 ZIM_60s_Economic_Develop_in_Northern_Rhodesia_desc: "Экономика Северной Родезии не очень хороша. Мы должны направить средства на ее улучшение."
 ZIM_60s_Welensky: "Веленски"
 ZIM_60s_Welensky_desc: "Веленский победил на выборах с обещаниями не объявлять ОДН."
 ZIM_60s_Focus_on_the_Econonmy: "Фокус на экономике"
 ZIM_60s_Focus_on_the_Econonmy_desc: "Одним из обещаний Веленски во время выборов было улучшение общей экономической ситуации."
 ZIM_60s_Stabilize_the_Nation: "Стабилизировать государство"
 ZIM_60s_Stabilize_the_Nation_desc: "Единство нации сильно пострадало. Проводя несколько кампаний по исправлению, Веленски надеется поднять дух."
 ZIM_60s_Encourage_White_Immigration: "Поощрять белую иммиграцию"
 ZIM_60s_Encourage_White_Immigration_desc: "Нам нужны более квалифицированные белые рабочие здесь. Мы можем получить их, приняв программу по предложению им немного земли и денег, если они переедут сюда."
 ZIM_60s_Constitutional_Independence: "Конституционная независимость"
 ZIM_60s_Constitutional_Independence_desc: "Поскольку все больше и больше аборигенов занимают правительственные должности, мы соответствуем условию принятия независимости вместе с правлением большинства. Таким образом, мы можем считаться независимой нацией."
 ZIM_60s_Commonwealth_Economic_Aid: "Экономическая помощь Содружества"
 ZIM_60s_Commonwealth_Economic_Aid_desc: "Британцы хотят поддержать нашу экономику и построить несколько заводов."
