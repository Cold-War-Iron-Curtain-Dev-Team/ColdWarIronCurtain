l_russian:
 CWelect.1.t: "Выборы 1950 года - Клемент Эттли против Уинстона Черчилля"
 CWelect.1.d: "Выборы 1945 года, с падением Европейского Рейха Гитлера, создали много прецедентов. Лейбористы обеспечили себе значительное большинство консерваторов, связанных с Черчиллем, а либеральная партия была сокращена до простой третьей партии, и эта ситуация привела нас к сегодняшнему дню. Но это был 1945 год, сейчас 1950-й, и партии изменились: лейбористы национализировали ключевые отрасли промышленности и создали НСЗ, в то время как консерваторы все еще возглавляются Уинстоном Черчиллем. Подсчитываются и бюллетени для голосования..."
 CWelect.1.a: "Клемент Эттли до сих пор прекрасно справлялся. Пусть он несет нас дальше."
 CWelect.1.b: "Уинстон Черчилль помог нам пережить войну, он будет готовиться к следующей."
 CWelect.2.t: "Выборы 1951 года - Клемент Эттли против Уинстона Черчилля - досрочные выборы"
 CWelect.2.d: "По просьбе короля Эттли были назначенны внеочередные выборы, чтобы укрепить лейбористское правительство, которое в настоящее время имеет шаткое большинство. Будет ли это действовать так, как ожидает Эттли, и даст ему подавляющее большинство голосов, или же это будет иметь обратный эффект полностью?"
 CWelect.2.a: "Трудовое правило непробиваемо!"
 CWelect.2.b: "Черчилль и консерваторы!"
 CWelect.3.t: "Выборы 1955 года - Энтони Иден против Клемента Эттли"
 CWelect.3.d: "С твердым четырехлетним перерывом между выборами Британия возвращается на избирательные участки всего через пару недель после отставки Черчилля. Сможет ли Иден провести выборы? Или же Климент победит?"
 CWelect.3.a: "Энтони Иден восхитителен, и он защитит нас от коммунизма!"
 CWelect.3.b: "У Клемента Эттли есть такой опыт."
 churchill: "Уинстон Черчилль долгое время был значимой фигурой в британской политике, и его первое появление было в Первую Мировую войну, когда он был Первым Лордом Адмиралтейства. После нескольких лет работы в парламенте и многих постов в кабинете министров он был выбран в 1940 году, чтобы заменить Невилла Чемберлена на посту премьер-министра и его харизма и бесчисленные выступления помогли британскому народу пережить войну, и все это было свернуто. Уинстон Черчилль и его карьера гораздо больше определяются Второй мировой войной, Чем чем-либо другим, и это может быть хорошо."
 anthony_eden: "Энтони Иден был государственным секретарем по вопросам войны во время первого срока Черчилля, а затем заместителем лидера консерваторов во времена Черчилля в качестве лидера оппозиции после окончания войны. Он – рабочая лошадка."
 Anthony_Eden_flag: "Энтони Иден уже на своем посту"
 CWelect.4.t: "Отставка Энтони Идена"
 CWelect.4.d: "Энтони Иден с радостью возглавил свой пост премьер-министра. Однако его неудачи во время Суэцкого кризиса привели к тому, что он подал в отставку с поста премьер-министра. Эйзенхауэр высоко отзывался о Макмиллиане, что привело Королеву к назначению Макмиллиана премьер-министром."
 CWelect.4.a: "Все взгляды устремлены на будущее консерваторов, которые теперь находятся в руках Гарольда Макмиллиана."
 Harold_Macmillian: "Harold 'Supermac' MacMillan is a British Conservative. Harold MacMillan found his first success after the Liberal Party's collapse in 1924, which opened his constituency, Stockton-on-Tees, for election. In the past, MacMillan had many trips to the USSR, where he often spoke out against the government. In February of 1940, MacMillan visited Finland. When he returned, he campaigned against the British government's inactivity against Soviet aggression. When Churchill came to power in 1940, 'Supermac' became the Minister of Supply. He has been Housing Minister, Defense Minister, Foreign Secretary and the Chancellor of the Exchequer. He has now come to power following Eden's resignation."
 ENG_Lab: "Лейбористская партия"
 ENG_Cons: "Консервативная и юнионистская партия"
 Hugh_Gaitskell: "Хью Тодд Нейлор Гейсткелл - преподаватель экономики и ранее государственный служащий военного времени, впервые избранный в парламент в 1945 году во время оползня лейбористов при Клементе Эттли. Он был министром топлива и энергетики в 1946-1947 годах и присоединился к кабинету Эттли в качестве канцлера казначейства."
 CWelect.5.t: "Выборы 1959 года - Гарольд Макмиллиан против Хью Гейтскелла"
 CWelect.5.d: "Вот и выборы 1959 года. Гарольду Макмиллиану, преемнику Энтони Идена в консерваторах, теперь бросает вызов Хью Гейтскелл из Лейбористской партии."
 CWelect.5.a: "Гарольд Макмиллиан подойдет. Мы ведь не хотим социализма, правда?"
 CWelect.5.b: "Лейбористам нужен еще один шанс, консерваторы нерешительны."
 CWelect.6.t: "Отставка Гарольда Макмиллиана"
 CWelect.6.d: "Гарольд Макмиллиан находился под давлением консерваторов и большей части правительства, чтобы уйти в отставку, а не идти на следующие выборы. Под таким давлением Гарольд подал в отставку с поста премьер-министра."
 CWelect.6.a: "Консервативная эстафета переходит к Алеку Дугласу-Хоуму."
 CWelect.7.t: "Хью Гейсткелл умирает!"
 CWelect.7.d: "Хью Гейсткелл встретил свою безвременную кончину. Он умер у себя дома от вируса, который подхватил где-то во время своей последней поездки к Никите Хрущеву."
 CWelect.7.a: "Эстафета переходит к Гарольду Уилсону."
 CWelect.8.t: "Выборы 1964 года-Гарольд Уилсон против Алека Дугласа-Главная"
 CWelect.8.d: "Поскольку все три основные партии сменили руководство в результате двух отставок и одной неудачной смерти, у британского народа появилось три новых лица: Гарольд Вильсон из лейбористов, Алек Дуглас-дом Тори и Джо Гримонд из либералов. Гримонд все еще находится в стороне, но он может разделить центристский голос в пользу одной из других партий..."
 CWelect.8.a: "Время для Лейбористов! Гарольд Уилсон"
 CWelect.8.b: "Тори защитят нас! Алек Дуглас-Домой!"
 Alec_Douglas-Home: "Придя в качестве депутата от Палаты лордов в качестве барона Хирселов, Алек занял его место после отставки Гарольда Макмиллиана. В прошлом он был помощником премьер-министра Чемберлена. Алек выглядит гораздо более самодержавным, чем его соперник, и это может стать его падением..."
 Harold_Wilson: "Гарольд Уилсон уже давно служит в кабинетах министров. Как только он стал избранным депутатом, его включили в кабинет и теневой совет Мистера Эттли, и теперь он был избран лидером лейбористов. С тех пор как умер Хью Гейтскелл, он пытался ребрендировать лейбористов в умеренный социализм."
 elect.9.t: "Выборы 1966 года-Гарольд Уилсон против Эдварда Хита"
 elect.9.d: "Достопочтенный назначил внеочередные выборы, и пока подсчитываются бюллетени, все британцы задаются вопросом, не появился ли здесь новый премьер-министр? Старый Сэр Алек Дуглас-Хоум оставил свой пост в пользу Эдварда Хита. Тем временем мистер Уилсон агитирует за лейбористов, а Джо Гримонд снова делит голоса. Кто же победит?"
 elect.9.a: "Умеренный социализм - это самый лучший вид! Гарольд Уилсон!"
 elect.9.b: "Но разве нет социализма лучше? Эдвард Хит!"
 Edward_Heath: "Эдвард " Тед " хит - убежденный сторонник европейских экономических зон и угольных сообществ, а также более тесных связей с Европой, что немного странно для консерватора, но он все еще довольно политикан."
 elect.10.t: "Выборы 1970 года - Гарольд Уилсон против Эдварда Хита"
 elect.10.d: "Кандидаты от обеих основных партий не изменились, однако на этот раз это не так просто и наверняка выразит британский народ. Мы снова лежим на перекрестке дорог, хит или Уилсон?"
 elect.10.a: "Гарольд снова выигрывает. Лейбористы!"
 elect.10.b: "Неожиданная победа для мистера хита! Тори!"
 elect.11.t: "Выборы 1974 года - повисший хаос в парламенте"
 elect.11.d: "В этом году уже были проведены выборы, но они привели к победе меньшинства Гарольда Вильсона. Чтобы выяснить, чего же на самом деле хочет Британия, стороны договорились о новых выборах в октябре. Теперь пришло время: Уилсон или хит?"
 elect.11.a: "Гарольд Вильсон формирует правительство. Лейбористы."
 elect.11.b: "Эдвард Хит формирует правительство. Тори."
 elect.12.t: "Гарольд Уилсон уходит в отставку"
 elect.12.d: "Гарольд Вильсон сегодня решил, что уйдет в отставку. После столь долгого пребывания в политике британская общественность не знает, кто мог бы занять его место. Другие левые части лейбористов взывают к реформам."
 elect.12.a: "Джеймс Каллаган заменит Уилсона."
 James_Callaghan: "Джеймс Каллаган, также известный как Джим Каллаган, теперь занимал все четыре крупных поста в стране - от министра финансов до премьер-министра."
 elect.13.t: "Рассвет карьеры Тэтчер"
 elect.13.d: "Тори обнаружили, что мистер Хит не способен руководить ни партией, ни нацией. Тори решили заменить Мистера хита Маргрет Тэтчер, членом парламента от Финчли."
 elect.13.a: "Маргарет Тэтчер будет руководить нашей страной и народами."
 Margret_Thatcher: "Железная леди Маргарет Тэтчер - первая женщина-премьер-министр Великобритании. Она отвоевала лидерство Тори у Мистера хита и теперь возглавляет Великобританию."
 elect.14.t: "Выборы 1979 года - Тэтчер против Каллагана"
 elect.14.d: "Маргарет Тэтчер стала лидером консерваторов в начале 1975 года из-за неспособности Хита по-настоящему руководить и привлекать избирателей на свою сторону. С тех пор как она пришла к власти с небольшим политическим капиталом, Тэтчер использовала все возможные методы, чтобы подорвать труд, и это, похоже, сработало. Внеочередные выборы были назначены за пять месяцев до соответствующих выборов, и г-жа Тэтчер может победить."
 elect.14.a: "Маргарет Тэтчер сильна, и при ней Британия будет сильной."
 elect.14.b: "Парламент - это мужской клуб. Каллаган."
 elect.15.t: "Выборы 1983 года - Тэтчер против Фута"
 elect.15.d: "Выборы 1983 года, судя по всему, являются выдувной победой Тори, с тех пор как началась Фолклендская война, популярность Тэтчеров выше, чем когда-либо, и, что еще хуже для лейбористов, либералы набирают обороты."
 elect.15.a: "Тэтчер владела Фолклендами, а теперь она владеет Британией"
 elect.15.b: "Майкл Фут формирует коалиционное правительство с либералами."
 Micheal_Foot: "Майкл Фут, ныне премьер-министр, уже некоторое время работает в сфере труда. однако, похоже, он не сможет долго продержаться с Тэтчер, постоянно создавая хаос в парламенте."."
 elect.16.t: "Выборы 1987 года-Тэтчер против Киннока"
 elect.16.d: "Майкл Фут решил не баллотироваться, и на его место лейбористы выдвинули Нила Киннока, в то время как популярность Тэтчер продолжает расти. Кажется, она снова может победить, но только граждане могут сказать."
 elect.16.a: "Железная Леди снова побеждает!"
 elect.16.b: "Киннок побеждает в меньшинстве."
 elect.17.t: "Маргарет Тэтчер уходит в отставку!"
 elect.17.d: "Тэтчер подала в отставку ради блага консерваторов, поскольку считает, что ее отставка ослабит предстоящую Лейбористскую кампанию. По крайней мере, такое заявление она сделала на вечеринке. Теперь Британию возглавляет Джон Мейджор."
 elect.17.a: "Да, Джон Мейджор должен реформировать правительство."
 Neil_Kinnock: "Нил Киннок впервые работал в парламенте еще в 1970 году. Теперь он возглавляет лейбористов и Великобританию. Мистер Киннок далеко ушел от того, чтобы впервые возглавить лейбористов в 1983 году, несмотря на попытки отодвинуть его на второй план."
 John_Major: "Джон Мейджор служил министром иностранных дел и канцлером казначейства в правительстве Тэтчер, в конечном итоге заняв место госпожи Тэтчер в качестве лидера страны и партии."
 elect.18.t: "Выборы 1992 года-майор В. Киннок"
 elect.18.d: "Перспективы этой кампании у консерваторов были самые мрачные. Лейбористы лидировали на двадцать пунктов, пока Лейбористская кампания неожиданно не начала падать. Народ должен будет принять решение..."
 elect.18.a: "Джон Мейджор и Тори побеждают!"
 elect.18.b: "Нил Киннок с лейбористами!"
 elect.19.t: "Нил Киннок уходит в отставку - Возвышение Блэра"
 elect.19.d: "Сегодня Нил Киннок решил уйти из парламента и уйти из политики. Мантия труда переходит к Тони Блэру из Седжфилда."
 elect.19.a: "Кто такой Блэр?"
 Tony_Blair: "Энтони Чарльз Линтон Блэр, или Тони Блэр, центрист, медленно продвигал лейбористов все дальше вправо. Он добился выдающихся успехов на своих выборах, создав значительное лейбористское большинство, и теперь является постоянным элементом современной британской политики."
 elect.20.t: "Выборы 1997 года - Блэр против майора"
 elect.20.d: "Эти выборы очень интересны: Блэр возглавил центристское движение "новых лейбористов" внутри своей партии и получил большую поддержку, в то время как консерваторы разваливались из-за политики ЕС и бесчисленных скандалов. 1997 год кажется выдающейся победой лейбористов, но может быть, только может быть, консерваторы могли бы выиграть коалицию меньшинства с либеральными демократами."
 elect.20.a: "Джон Мейджор побеждает в меньшинстве."
 elect.20.b: "Тони Блэр выигрывает с большим отрывом!"
