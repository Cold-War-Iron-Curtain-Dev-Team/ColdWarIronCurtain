 PAK_mechanized_equipment_1: "Bren Carrier Mk.I"
 PAK_mechanized_equipment_1_short: "Bren Carrier Mk.I"
 PAK_mechanized_equipment_1_desc: "Universal Carrier, также известный как Bren Gun Carrier, а иногда просто Bren Carrier из легкого пулеметного вооружения, — это общее название, описывающее семейство легких бронированных гусеничных машин, построенных Vickers-Armstrongs и другими компаниями."
 PAK_mechanized_equipment_2: "M3 Half-Track"
 PAK_mechanized_equipment_2_short: "M3 Half-Track"
 PAK_mechanized_equipment_2_desc: "Полугусеничный M3 был американским полугусеничным бронетранспортером, широко использовавшимся союзниками во время Второй мировой войны и в годы холодной войны. Созданный на основе полугусеничного автомобиля M2, M3 был широко произведен: было выпущено около 15 000 стандартных M3 и более 38 000 вариантов. В эпоху холодной войны этот автомобиль использовался различными государственными и негосударственными операторами в конфликтах в Южной Америке, на Ближнем Востоке, в Африке и Азии, оставаясь на вооружении вплоть до середины 1990-х годов. В Мексике они все еще используются по состоянию на 2019 год."
