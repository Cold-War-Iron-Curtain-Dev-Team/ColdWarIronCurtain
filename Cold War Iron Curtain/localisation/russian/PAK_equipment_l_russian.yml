l_english:
 PAK_infantry_equipment_0: "Short Magazine Lee-Enfield Rifle, No. 4 Mk I"
 PAK_infantry_equipment_0_short: "SMLE No. 4"
 PAK_infantry_equipment_0_desc: "Lee-Enfield — магазинная магазинная винтовка с продольно-скользящим затвором, которая служила основным огнестрельным оружием Британской империи и Содружества в первой половине 20-го века. Это была стандартная винтовка британской армии с 1895 по 1957 год. Винтовка широко использовалась на протяжении всей Второй мировой войны, особенно на театрах военных действий в Северной Африке, Италии, Тихом океане и Бирме в руках британских сил и сил Содружества. Австралия и Индия сохранили и производили SMLE Mk III * в качестве своей стандартной винтовки во время конфликта, и винтовка оставалась на военной службе Австралии во время Корейской войны, пока в конце 1950-х годов ее не заменила L1A1 SLR."
 PAK_infantry_equipment_1: "ZB-56 Assault Rifle"
 PAK_infantry_equipment_1_short: "ZB-56"
 PAK_infantry_equipment_1_desc: "ZB-56 — автоматическая штурмовая винтовка, разработанная КНР в 1956 году на базе АК-47. Он участвовал в боях во всех войнах, в которых участвовала КНР с момента его разработки. ZB-56 имеет ряд отличий от АК-47. Они изготавливались с фрезерованной ствольной коробкой и полностью закрытым прицелом. Его ствол также тяжелее и больше похож на ствол РПК, за исключением отсутствия усиленной цапфы. Кроме того, у него нет резьбы на морде. Поскольку ZB-56 обладает легендарной надежностью и очень прост в использовании, он продолжает использоваться армиями по всему миру. Он также немного дешевле в производстве, чем АК-47."
 PAK_infantry_equipment_2: "Heckler & Koch G3"
 PAK_infantry_equipment_2_short: "Heckler & Koch G3"
 PAK_infantry_equipment_2_desc: "Оригинальная модель на базе CETME Model 58, представленная в 1959 году и утвержденная в 1960 году. Она имела деревянный приклад и цевье."
 PAK_infantry_equipment_3: "Heckler & Koch G3P3"
 PAK_infantry_equipment_3_short: "Heckler & Koch G3P3"
 PAK_infantry_equipment_3_desc: " Самый известный вариант 1963 года. Барабанные прицельные приспособления с улучшенной мушкой, пламегасителем/дульным тормозом, способным стрелять гранатами стандарта НАТО, фиксированным цельнопластиковым прикладом и пластиковым цевьем, не контактирующим со свободно плавающим стволом. Цевье выпускалось в узком, вентилируемом и широком вариантах. Последний позволяет прикрепить сошки."
 PAK_infantry_equipment_4: "Pakistan Ordnance Factories G3P4"
 PAK_infantry_equipment_4_short: "POF G3P4"
 PAK_infantry_equipment_4_desc: " Самый известный вариант 1963 года. Барабанные прицельные приспособления с улучшенной мушкой, пламегасителем/дульным тормозом, способным стрелять гранатами стандарта НАТО, фиксированным цельнопластиковым прикладом и пластиковым цевьем, не контактирующим со свободно плавающим стволом. Цевье выпускалось в узком, вентилируемом и широком вариантах. Последний позволяет прикрепить сошки."
