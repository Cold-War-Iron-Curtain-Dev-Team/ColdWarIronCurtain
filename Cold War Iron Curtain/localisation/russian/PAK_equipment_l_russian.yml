 PAK_attack_helicopter_equipment_2: "Bell AH-1S Cobra"
 PAK_attack_helicopter_equipment_2_short: "AH-1S Cobra"
 PAK_attack_helicopter_equipment_2_desc: "Базовая модель AH-1S представляет собой модернизированный AH-1Q с турбовальным двигателем T53-L-703 мощностью 1800 л.с. (1300 кВт). AH-1S оснащен ракетной подсистемой M65 TOW / Cobra, оптическим прицелом M65 (TSU) и рефлекторным прицелом M73."
 PAK_attack_helicopter_equipment_3: "Bell AH-1F Cobra"
 PAK_attack_helicopter_equipment_3_short: "AH-1F Cobra"
 PAK_attack_helicopter_equipment_3_desc: "AH-1F включает в себя все обновления Step 1 и 2 до AH-1S. В нем также были представлены обновления Step 3; проекционный дисплей, лазерный дальномер, инфракрасный глушитель, установленный над выхлопом двигателя, и система подавления инфракрасного излучения двигателя, а также подсистема воздушных данных M143 (ADS). До 1988 года AH-1F также упоминался как «Модернизированный AH-1S», «Модернизированный AH-1S Cobra» или «AH-1S (MC)»."
 PAK_naval_helicopter_equipment_2: "Aérospatiale SA316 Alouette III ASW"
 PAK_naval_helicopter_equipment_2_short: "SA316 Alouette III ASW"
 PAK_naval_helicopter_equipment_3: "Kaman HH-43 Huskie"
 PAK_naval_helicopter_equipment_3_short: "HH-43 Huskie"
 PAK_naval_helicopter_equipment_3_desc: "Kaman HH-43 Huskie был вертолетом с зацепляющимися несущими винтами, который использовался ВВС США, ВМС США и Корпусом морской пехоты США с 1950-х по 1970-е годы."
