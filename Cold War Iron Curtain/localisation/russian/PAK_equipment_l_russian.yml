 PAK_jet_multirole_equipment_2: "Supermarine Attacker Mk.538"
 PAK_jet_multirole_equipment_2_short: "Attacker Mk.538"
 PAK_jet_multirole_equipment_2_desc: "В начале 1950-х годов недавно сформированные Королевские ВВС Пакистана (RPAF; позже ВВС Пакистана) стремились приобрести реактивные истребители. Сочетание нехватки средств и политического давления, которое оказывали британские поставщики, убедило службу приобрести вариант Attacker, известный как Type 538, который по сути представлял собой «де-навализованный» вариант самолета, используемого FAA. ."
 PAK_jet_multirole_equipment_3: "North American F-86F Sabre"
 PAK_jet_multirole_equipment_3_short: "F-86F Sabre"
 PAK_jet_multirole_equipment_3_desc: "лучшенная система управления полетом и «полностью летающий хвост» (эта система была заменена на управление с полным приводом с «искусственным ощущением», встроенным в органы управления самолетом, чтобы дать пилоту усилия на ручке, которые все еще были обычными, но достаточно легкими. для превосходного боевого управления.) Sabre Fs значительно улучшили маневренность на высоких скоростях в сочетании с более высокой посадочной скоростью более 145 миль в час (233 км / ч)."
 PAK_jet_multirole_equipment_4: "North American F-86F-40 Sabre"
 PAK_jet_multirole_equipment_4_short: "F-86F-40 Sabre"
 PAK_jet_multirole_equipment_4_desc: "Дальнейшее улучшение F-86F Sabre, чтобы сделать его более эффективным в бою против новых самолетов с форсажной камерой, вооружив их узлами подвески и направляющими для запуска ракет AIM-9B Sidewinders."
 PAK_jet_multirole_equipment_5: "Shenyang F-6"
 PAK_jet_multirole_equipment_5_short: "F-6"
 PAK_jet_multirole_equipment_6: "Dassault Mirage IIIEP"
 PAK_jet_multirole_equipment_6_short: "Mirage IIIEP"
 PAK_jet_multirole_equipment_7: "Chengdu F-7P Skybolt"
 PAK_jet_multirole_equipment_7_short: "F-7P Skybolt"
 PAK_jet_multirole_equipment_7_desc: "Chengdu J-7 — истребитель Китайской Народной Республики. Это лицензионная версия советского МиГ-21 Микояна-Гуревича, поэтому во многом он похож на МиГ-21. Самолет вооружен ракетами класса \"воздух-воздух\" малой дальности с инфракрасным самонаведением и в основном предназначен для ближнего боя \"воздух-воздух\". Самолет также используется для непосредственной авиационной поддержки."
 PAK_jet_multirole_equipment_8: "Chengdu F-7PG Skybolt"
 PAK_jet_multirole_equipment_8_short: "F-7PG Skybolt"
 PAK_jet_multirole_equipment_8_desc: "Chengdu J-7 — истребитель Китайской Народной Республики. Это лицензионная версия советского МиГ-21 Микояна-Гуревича, поэтому во многом он похож на МиГ-21. Самолет вооружен ракетами класса \"воздух-воздух\" малой дальности с инфракрасным самонаведением и в основном предназначен для ближнего боя \"воздух-воздух\". Самолет также используется для непосредственной авиационной поддержки."
 PAK_jet_multirole_equipment_9: "General Dynamics F-16A Block 15 Fighting Falcon"
 PAK_jet_multirole_equipment_9_short: "F-16A Block 15"
 PAK_jet_multirole_equipment_9_desc: "Первое серьезное изменение в F-16, самолет Block 15, отличался более крупными горизонтальными стабилизаторами, добавлением двух точек подвески к входу в подбородок, новым радаром и увеличенной вместимостью подкрыльевых пилонов. Этот вариант также получил современную ультравысокочастотную (UHF) радиостанцию. Этот вариант является самым многочисленным среди вариантов F-16."
 PAK_jet_multirole_equipment_10: "PAC JF-17 Thunder"
 PAK_jet_multirole_equipment_10_short: "JF-17 Thunder"
 PAK_jet_multirole_equipment_10_desc: "PAC JF-17 Thunder — это легкий одномоторный многоцелевой боевой самолет четвертого поколения, разработанный совместно Пакистанским авиационным комплексом (PAC) и китайской авиастроительной корпорацией Chengdu Aircraft Corporation (CAC)."
 PAK_mr_stealth_fighter_equipment_1: "PAC JF-17 Block III Thunder"
 PAK_mr_stealth_fighter_equipment_1_short: "JF-17 Block III"
 PAK_mr_stealth_fighter_equipment_1_desc: "PAC JF-17 Thunder — это легкий одномоторный многоцелевой боевой самолет четвертого поколения, разработанный совместно Пакистанским авиационным комплексом (PAC) и китайской авиастроительной корпорацией Chengdu Aircraft Corporation (CAC). Этот вариант модернизирован новой авионикой и другим оборудованием с большим количеством узлов подвески и интегрированными технологиями."
 PAK_CAS_equipment_1: "de Havilland DH.82 Tiger Moth"
 PAK_CAS_equipment_1_short: "DH.82 Tiger Moth"
 PAK_CAS_equipment_2: "Vultee A-31 Vengeance"
 PAK_CAS_equipment_2_short: "A-31 Vengeance"
 PAK_CAS_equipment_3: "Hawker Tempest Mk.V"
 PAK_CAS_equipment_3_short: "Tempest Mk.V"
 PAK_CAS_equipment_4: "Hawker Tempest Mk.II"
 PAK_CAS_equipment_4_short: "Tempest Mk.II"
 PAK_jet_CAS_equipment_6: "Dassault Mirage 5PA"
 PAK_jet_CAS_equipment_6_short: "Mirage 5PA"
 PAK_jet_CAS_equipment_6_desc: "Dassault Mirage 5 — сверхзвуковой штурмовик, разработанный во Франции компанией Dassault Aviation и производимый во Франции и ряде других стран по лицензии. Он был создан на основе популярного истребителя Dassault Mirage III."
 PAK_jet_CAS_equipment_7: "Nanchang A-5A"
 PAK_jet_CAS_equipment_7_short: "A-5A"
 PAK_jet_CAS_equipment_8: "Dassault Mirage 5PA ROSE"
 PAK_jet_CAS_equipment_8_short: "Mirage 5PA ROSE"
 PAK_jet_interceptor_equipment_5: "Lockheed F-104A Starfighter"
 PAK_jet_interceptor_equipment_5_short: "F-104A Starfighter"
 PAK_jet_light_equipment_1: "Lockheed T-33 Shooting Star"
 PAK_jet_light_equipment_1_short: "T-33 Shooting Star"
 PAK_jet_light_equipment_1_desc: "Lockheed T-33 Shooting Star (или T-Bird) — дозвуковой американский учебно-боевой реактивный самолет. Он был произведен компанией Lockheed и совершил свой первый полет в 1948 году. Т-33 был разработан на основе Lockheed P-80 / F-80, начиная с TP-80C / TF-80C в разработке, затем получившего обозначение T-33A."
 PAK_jet_light_equipment_2: "Cessna T-37A Tweet"
 PAK_jet_light_equipment_2_short: "T-37A Tweet"
 PAK_jet_light_equipment_3: "Shenyang FT-5"
 PAK_jet_light_equipment_3_short: "FT-5"
 PAK_jet_light_equipment_3_desc: "Двухместный учебно-тренировочный вариант J-5, разработанный и разработанный Chengdu Aircraft Corporation. Комбинированный планер J-5, воздушные тормоза J-5A и тандемная двухместная секция кабины JJ-2 (МиГ-15УТИ). Экспортные версии получили обозначение FT-5."
 PAK_jet_light_equipment_4: "Shenyang FT-7P"
 PAK_jet_light_equipment_4_short: "FT-7P"
 PAK_jet_light_equipment_4_desc: "экспортная версия JJ-7 с заменой китайского на английский для всех дисплеев. Иран был первым заказчиком, разместившим заказ в конце 1986 года. В Пакистан было поставлено несколько самолетов с увеличенной на 0,61 метра длиной фюзеляжа и увеличенным на 350 литров внутренним запасом топлива."
 PAK_jet_light_equipment_5: "PAC Karakorum-8"
 PAK_jet_light_equipment_5_short: "Karakorum-8"
 PAK_jet_light_equipment_5_desc: "Hongdu JL-8 (Nanchang JL-8), также известный как Karakorum-8 или сокращенно K-8, представляет собой двухместный учебно-боевой реактивный самолет среднего класса и легкий штурмовик, разработанный в Китайской Народной Республике компанией China Nanchang Aircraft. Производственная корпорация. Пакистан также является сопартнером этого проекта. Основным подрядчиком является Hongdu Aviation Industry Corporation. Его экспортный вариант, K-8 Karakorum, производится пакистанским авиационным комплексом для ВВС Пакистана."
 PAK_recon_equipment_0: "Taylorcraft Auster AOP6"
 PAK_recon_equipment_0_short: "Auster AOP6"
 PAK_recon_equipment_0_desc: "Taylorcraft Auster — британский военный самолёт связи и наблюдения, производившийся компанией Taylorcraft Airplanes (England) Limited во время Второй мировой войны."
 PAK_jet_recon_equipment_0: "Lockheed RT-33A Shooting Star"
 PAK_jet_recon_equipment_0_short: "RT-33A Shooting Star"
 PAK_jet_recon_equipment_0_desc: "RТ-33А модифицировали перед поставкой как одноместный разведывательный вариант; 85 построено, в основном на экспорт в рамках Программы военной помощи."
 PAK_jet_recon_equipment_1: "Dassault Mirage IIIER"
 PAK_jet_recon_equipment_1_short: "Mirage IIIER"
 PAK_jet_recon_equipment_1_desc: "Разведывательный вариант пакистанского Dassault Mirage IIIE, вооруженный камерами вместо пушек и ракет."
 PAK_tac_bomber_equipment_0: "Armstrong Whitworth Whitley"
 PAK_tac_bomber_equipment_0_short: "Whitley"
 PAK_jet_tac_bomber_equipment_2: "Martin B-57 Canberra"
 PAK_jet_tac_bomber_equipment_2_short: "B-57 Canberra"
 PAK_jet_tac_bomber_equipment_2_desc: "«Канберра» — американская версия одноименного бомбардировщика English Electric. Он идеально подходит для тактических ударов и разведки. Его выход на пенсию в 1980-х годах ознаменовал бы конец эры тактических бомбардировщиков."
