 PAK_light_artillery_equipment_1: "Ordnance QF 18-pounder Mk.II"
 PAK_light_artillery_equipment_1_short: "QF 18-pounder Mk.II"
 PAK_light_artillery_equipment_1_desc: "18-фунтовая пушка Ordnance QF, или просто 18-фунтовая пушка, была стандартной полевой пушкой Британской империи периода Первой мировой войны. Он составлял основу Королевской полевой артиллерии во время войны и производился в больших количествах. Он использовался британскими войсками на всех основных театрах военных действий, а также британскими войсками в России в 1919 году."
 PAK_light_artillery_equipment_2: "M101A1 105 mm"
