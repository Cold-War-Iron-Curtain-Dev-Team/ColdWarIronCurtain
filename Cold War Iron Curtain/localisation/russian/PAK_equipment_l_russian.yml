 PAK_motorized_equipment_1: "Dodge T-234 \"Burma\" truck 4x4"
 PAK_motorized_equipment_1_short: "Dodge T-234 4x4"
 PAK_motorized_equipment_1_desc: "Грузовики Canadian Military Pattern (CMP) представляли собой взаимосвязанные линейки военных грузовиков, производившиеся в больших количествах, в нескольких классах и многочисленных версиях канадскими филиалами «большой тройки» автопроизводителей США во время Второй мировой войны, в соответствии со спецификациями британской армии. , в первую очередь предназначенный для использования в армиях союзников Британского Содружества, но также служащий в других подразделениях Британской империи. "
 PAK_motorized_equipment_2: "REO M35 6x6"
 PAK_motorized_equipment_2_short: "M35 6x6"
 PAK_motorized_equipment_2_desc: "M35 — это 2,5-тонный грузовик с колесной формулой 6x6, разработанный REO в 1944 году. Он широко использовался во всех конфликтах США с 1950 по 1988 год. В M35 используется двигатель OA-331 с 5-ступенчатой / 2-диапазонной коробкой передач и неразрезными мостами на рессорной подвеске. Он может нести нагрузку в 5000 фунтов. Он может двигаться со скоростью 58 миль в час на 300 миль и получает 8 миль / галлон. Он широко использовался США и многими их союзниками по всему миру. Он был построен, чтобы заменить GMC CCKW после войны и обеспечить более мощную и быструю машину. "
 PAK_motorized_equipment_3: "AM General M809 6x6"
 PAK_motorized_equipment_3_short: "M809 6x6"
 PAK_motorized_equipment_3_desc: "M809 — это 5-тонный грузовик с колесной формулой 6x6, разработанный AM General в 1970 году. Он использовался во всех конфликтах США с 1970 по 1982 год. В M809 используется двигатель NH250, 5-ступенчатая / 2-диапазонная коробка передач и мосты с активной балкой на листовых рессорах. Он может нести нагрузку в 5000 фунтов. Он развивает скорость 52 мили в час на протяжении 350 миль и получает 10 миль / галлон. Помимо того, что автомобиль используется для перевозки и перевозки грузов, он очень прочный и может поддерживать на своей платформе вспомогательные компоненты. К ним относятся возможность установки эвакуационных комплектов, самосвалов, прицепов, больших фургонов для поддержки/комфорта, мостового оборудования и некоторых других. M809 также может преодолевать мелководные реки благодаря высокому дорожному просвету и очень эффективен на дорогах и бездорожье благодаря своей подвеске. "
