 PAK_mbt_equipment_3: "Tank, Combat, Full Tracked: 90-mm Gun, M47"
 PAK_mbt_equipment_3_short: "M47 Patton"
 PAK_mbt_equipment_3_desc: "M47 Patton — один из первых основных боевых танков, разработанный Управлением артиллерийского вооружения армии США в 1951 году. Он очень похож на M46 Patton, но имеет обновленную орудийную башню с улучшенным внутренним механизмом и улучшенной трансмиссией. Он участвовал в боях Суэцкого кризиса, Шестидневной войны и югославских войн."
 PAK_mbt_equipment_4: "Tank, Combat, Full Tracked: 90-mm Gun, M48"
 PAK_mbt_equipment_4_short: "M48 Patton"
 PAK_mbt_equipment_4_desc: "M48 Patton — ОБТ, разработанный Управлением артиллерийского вооружения армии США в 1953 году. M48 имеет 110-мм броню и улучшенную 90-мм пушку. Двигатель представляет собой оптимизированный вариант V12, использовавшегося в предыдущих танках Patton, с системой впрыска легкого топлива и наддувом. Его рабочий диапазон составляет 160 миль по бездорожью и 300 миль по дороге. Он может двигаться по дороге со скоростью 30 миль в час, но разгоняется до 20 миль в час по бездорожью благодаря улучшенному двигателю, трансмиссии и гусеницам. Он служил основным танком во время войны во Вьетнаме и широко использовался союзниками США по холодной войне. Он напоминает M47 Patton, но имеет совершенно новый дизайн с новыми внутренними механизмами. Он используется армией и морской пехотой США, прежде чем в конечном итоге будет заменен на M60, хотя многие подразделения национальной гвардии все еще эксплуатировали и обслуживали M48 до конца 80-х годов."
