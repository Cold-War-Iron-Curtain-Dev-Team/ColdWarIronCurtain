 ECSC.1.desc: "Во Франции министр иностранных дел Роберт Шуман сумел заручиться поддержкой Европейского сообщества угля и стали со стороны многих слоев нации и некоммунистических партий. Эта идея получила поддержку коллег по министерству, президента Комитета по международным отношениям и бывшего премьер-министра Поля Рейнара. Как мы будем выбирать?"
 ECSC.2.desc: "В Западной Германии поддержка ECSC была неоднозначной. Социал-демократическая партия во главе с Куртом Шумахером выступила против его создания и вступления Федеративной Республики в ЕКСК. Однако министр-президент земли Северный Рейн-Вестфалия, где расположены многие угольные и сталелитейные предприятия, высказался в поддержку ЕКСК. Как мы будем выбирать?"
 ECSC.3.desc: "Бельгия является крупным экспортером угля, имея несколько крупных шахт в регионе Валлония. Это поможет нашей растущей экономике, но может быть воспринято как уступка другим западным державам. Наши рабочие могут быть довольны, но наши бизнесмены - нет. Как нам выбрать?"
 ECSC.4.desc: "Нидерланды имеют большой импорт сельскохозяйственной продукции и промышленных товаров. ECSC поможет нашей растущей экономике, но может быть воспринята как уступка другим западным державам. Наши рабочие могут быть довольны, но наши бизнесмены - нет. Как нам выбрать?"
 ECSC.5.desc: "Люксембург, хотя и является небольшой страной, имеет крупную банковскую и телекоммуникационную промышленность. ЕКСК поможет нашей растущей экономике, но может быть воспринята как уступка другим западным державам. Наши рабочие могут быть счастливы, но наши бизнесмены - нет. Как нам выбрать?"
 ECSC.6.desc: "Италия превращается из преимущественно сельскохозяйственной страны в быстро растущую промышленную державу с автомобильным и пищевым производством. ECSC поможет нашей растущей экономике, но может быть воспринята как уступка другим западным державам. Наши рабочие могут быть довольны, но наши бизнесмены - нет. Как нам выбрать?"
