l_russian:
 tripartite.1.d: "Тройственный пакт с США и Великобританией был отвергнут. Принятие такого пакта создало бы серьезный дисбаланс сил, и чтобы Франция сохранила свою независимость и международный авторитет, она должна продолжать избегать соглашений, которые делают ее зависимой или младшим партнером. Хотя Соединенные Штаты и Великобритания будут разочарованы, для Франции жизненно важно заботиться о своих собственных интересах в первую очередь, хоть мы и будем поддерживать наше партнерство"
 algerian_war.1.d: "Сообщения о прекращении огня в Алжире медленно распространяются по Франции. Многие французские граждане устали от бесконечного конфликта. Первые сообщения говорят о том, что, скорее всего, произойдет разделение между французами и алжирцами. Однако новости о прекращении огня встречаются с осторожным оптимизмом. Растет число слухов о том, что Пьед Нуар сильно взволнован этой новостью. Он чувствует себя все более преданным французским правительством, и есть опасения, что может произойти переворот, чтобы сорвать любое урегулирование конфликта в Алжире"
 fra_post_edc.1.desc: "После недавнего теракта в Алжире многие в правительстве считают, что его организатором является националистическая партия MTLD. MTLD заменила предыдущую националистическую партию после того, как она была запрещена. Наша разведка сообщает, что в партии много междоусобиц, особенно между умеренными и экстремистами, и возможно, радикальная фракция партии организовала нападение. Однако другие источники предполагают, что нападение могло исходить от новой группы, пытающейся утвердиться. Расследование продолжается"
 fra_crisis.1.crisis_end_well_desc: "Французская общественность в основном поддерживает правительство за его действия в Суэцком кризисе. Многие хвалят французских военных за их профессиональные, эффективные и точные операции против египтян. Возникает ощущение, что Франция снимает с себя пятно поражения во Второй мировой войне и утверждается в качестве мировой державы. И это несмотря на международную критику этой акции. Французская общественность принимает причины интервенции и считает, что любое противодействие коренится в попытке мирового сообщества сохранить Францию слабой."
 fra_crisis.1.crisis_end_bad_desc: "Существует широко распространенный гнев, направленный на французское правительство после его неудачной суэцкой авантюры. Оппозиционные партии и другие организации проводят акции протеста по всей стране, а СМИ публикуют негативные редакционные статьи. Многие во Франции считают, что правительство втянуло своих военных в операцию, к которой они не были готовы, и в итоге унизило Францию на международном уровне. Также звучат обвинения в том, что правительство пошло на компромисс с французскими интересами или, в худшем случае, позволило Израилю и Великобритании сбить себя с верного пути"
 fra_crisis.2.bombing_sakiet_sidi_desc: "По сообщениям военных командиров в Алжире, АЛН активизировала свои рейды из своих убежищ в Тунисе. Повстанцы также используют новообразованную и незащищённую границу и свои связи с тунисскими сторонниками, чтобы наводнить Алжир и НФО оружием. Наши силы пытаются перехватить эти силы и оружие, но тунисцы не помогают нам в этом. Дипломатические попытки решить этот вопрос с Тунисом ни к чему не приводят, и отношения продолжают ухудшаться. Военные просят разрешения нанести авиаудар по городу Сакиет Сиди Юссеф. Это крупный перевалочный пункт ALN, и эффективный удар может подорвать их операции. Однако, если мы дадим разрешение, это, скорее всего, вызовет бурную реакцию Туниса"
 fra_crisis.3.bombing_sakiet_sidi_desc: "Тунисская деревня Сакиет Сиди Юссеф недавно стала жертвой беспорядочных авиаударов французских самолетов, базирующихся в Тунисе. Французы утверждали, что в деревне находится крупная база АЛН и что они нейтрализовали повстанцев. На границе между Алжиром и Тунисом наблюдается значительная эскалация столкновений между ALN и французскими войсками. Несмотря на заявления французов, в результате удара погибли десятки человек, многие получили ранения, в основном гражданские лица. Тунисский народ в ярости и требует ответа. Правительство настоятельно призывают разорвать дипломатические связи с Францией, иначе это может вызвать волнения среди тунисского народа."
 fra_crisis.31.bombing_sakiet_sidi_desc: "Конфликт между алжирскими националистическими боевиками FLN и французскими войсками в Алжире обострился после того, как стало известно, что французские военные самолеты нанесли авиаудары по пограничному тунисскому городу Сакиет Сиди Юссеф. Франция уже давно обвиняет алжирских повстанцев в том, что они используют пограничные районы Туниса в качестве плацдармов для своих операций против французских войск. Они ссылаются на участившиеся нападения в этом районе наряду с резким ростом контрабанды оружия из Туниса. Тунисское правительство долго сопротивлялось дипломатическому давлению со стороны Франции с целью решения проблем безопасности и было разгневано бомбардировкой. Тунисские власти сообщают, что бомбардировка была неизбирательной и привела к сотням жертв среди гражданского населения. Жертвы и вопиющее нарушение национального суверенитета нетерпимы для тунисского народа, и многие желают прекращения дипломатических отношений с Францией"
 fra_crisis.4.motion_of_non_confidence_desc: "Национальное собрание в Париже проголосовало за вотум недоверия, фактически прекратив деятельность правительства премьер-министра Феликса Гальярда. Молодой премьер-министр пытался создать центристский политический альянс, но его усилиям помешала Алжирская война. Недавно французские военные нанесли авиаудары по приграничной тунисской деревне Сакиет Сиди Юссеф, предположительно нацелившись на базу FNL. Однако большое количество жертв, среди которых, по сообщениям, много гражданских лиц, и нарушение суверенитета Туниса вызвали серьезный дипломатический кризис. Тунисские власти быстро лишают французов привилегий в стране, и многие во Франции считают, что правительство полностью провалило ситуацию и ему больше нельзя доверять управление страной. Для многих во Франции быстрый крах правительства Гальярда вписывается в общую политическую нестабильность, от которой страдает Четвертая республика."
 fra_crisis.5.motion_of_non_confidence_desc: "Франция столкнулась с усилением беспорядков из-за нестабильной политической обстановки и растущих волнений в Алжире. Президент Рене Коти попросил Рене Плевена и Жоржа Бидо сформировать правительство, но оба не смогли этого сделать. Поскольку гражданский порядок находится под угрозой, на президента оказывается повышенное давление с целью быстрого поиска нового правительства. Однако, похоже, что президент не может или не хочет взять на себя более активную роль. Конституционная система также ограничивает его возможности. Поскольку ситуация выглядит все более плачевной, многие граждане Франции задаются вопросом, как можно спасти ситуацию."
 fra_crisis.6.motion_of_non_confidence_desc: "FLN объявил, что казнил французских солдат, захваченных в ходе недавних операций. Эта новость шокировала и взволновала многих во Франции. Если FLN ожидал, что это объявление ослабит решимость французов, то он серьёзно ошибся. Французские военные уже обещают возмездие, а боевики Pied Noir, по некоторым данным, планируют свою собственную расправу над алжирцами. Боевые действия в Алжире вышли на новый уровень известности. Похоже, что действия FLN лишь инициировали новые и более кровавые бои"
 fra_crisis.7.motion_of_non_confidence_desc: "На фоне сообщений о том, что Пьер Пфлимлен должен был сформировать новое французское правительство в Париже, французские войска в Алжире устроили переворот. Генералы Жак Массу и Рауль Салан возглавили переворот, причем Массу выступил с речью, в которой объявил требования лидеров переворота к правительству. Массу призвал к созданию нового правительства общественной безопасности под руководством легендарного французского лидера Шарля де Голля. Они хотят, чтобы новое правительство получило чрезвычайные полномочия, и чтобы Алжир не был оставлен. Президент Франции Рене Коти, как говорят, ошеломлен переменой событий, поскольку новый премьер-министр обнаружил, что его сторонники быстро покидают его. Военная реакция, похоже, является ответом на опасения, что новый премьер-министр планирует вести переговоры о мире, который передаст Алжир FLN."
 fra_crisis.8.motion_of_non_confidence_desc: "Генерал Рауль Салан обратился к французскому народу в радиообращении из Алжира. Генерал подтвердил, что он возглавляет новое военное правительство в Алжире. Он повторил требования лидеров переворота о том, чтобы Шарль де Голль возглавил правительство с дополнительными полномочиями, чтобы Алжир не был оставлен FLN. Затем Салан обратился к большой толпе с балкона, возглавляя скандирование за Де Голля (Viva de Gaulle). Два дня спустя французские журналисты взяли интервью у Шарля де Голля, который заявил, что если его позовут, он готов взять на себя полномочия лидера республики. Это заявление вызвало беспокойство по всей Франции, что де Голль, возможно, присоединился к военной хунте в Алжире."
 fra_crisis.9.motion_of_non_confidence_desc: "Через два дня после того, как он вызвал беспокойство общественности своими высказываниями по поводу переворота в Алжире, знаменитый французский лидер Шарль де Голль провел пресс-конференцию. Он еще раз повторил, что если он нужен нации, то он возьмет на себя ответственность. Когда один из репортеров задал вопрос, не приведет ли его приход к власти с помощью военного давления к подавлению гражданских свобод, французский лидер быстро ответил. Он заявил: Разве я когда-либо делал это? Совсем наоборот, я восстановил их, когда они исчезли. Кто искренне верит, что в 67 лет я начну карьеру диктатора?. Очевидно, что Шарль де Голль считает себя готовым взять власть в случае необходимости"
 fra_crisis.10.motion_of_non_confidence_desc: "Алжирский кризис обострился, когда хунта в Алжире объявила о создании Комитета общественной безопасности Алжира и Сахары. Лидер хунты генерал Рауль Салан заявил, что нынешний Комитет общественной безопасности теперь будет контролировать весь Алжир и Сахару. Лидеры переворота официально захватили территориальные полномочия французского правительства в Северной Африке. Теперь ясно, что лидеры переворота, вероятно, готовятся к расширению своих операций, чтобы в конечном итоге распространить свои операции и мандат на материковую часть Франции."
 fra_crisis.11.motion_of_non_confidence_desc: "Чтобы усилить давление на Париж, элитные французские десантники из Алжира совершили десантирование и захватили Корсику. Операция получила название "Воскресение". Десантники не встретили никакого сопротивления и взяли Корсику под свой контроль. В Париже растут опасения, что среди военных много элементов, симпатизирующих Алжирской хунте под руководством генерала Рауля Салана. После успешной операции Салан опубликовал ультиматум, в котором правительству дается срок до двадцать девятого числа, чтобы передать власть Шарлю де Голлю. Похоже, Франция оказалась на грани гражданской войны"
 fra_crisis.12.motion_of_non_confidence_desc: "Шарль де Голль встретился с премьер-министром Пьером Пфлимленом, чтобы достичь соглашения. Однако в ходе дискуссии не удалось достичь решения. Судя по всему, эти два человека не смогли найти общий язык по большинству вопросов, особенно по Алжиру. Провал переговоров только усугубляет кризис, поскольку, похоже, де Голль не сможет работать с нынешним правительством над разрешением конфликта. Лидеры переворота в Алжире остаются верны своему требованию, чтобы Шарль де Голль пришел к власти. Чем больше времени пройдет без решения, тем больше вероятность вторжения из Алжира"
 fra_crisis.13.motion_of_non_confidence_desc: "Премьер-министр Пьер Пфлимлен и его правительство ушли в отставку на фоне кризиса, вызванного военным переворотом в Алжире. Недавняя оккупация Корсики и последующий ультиматум, выдвинутый генералом Раулем Саланом, привели к возобновлению давления на правительство с целью достижения решения до начала гражданской войны. Премьер-министр Пфлимлин, чье назначение вызвало кризис, пытался достичь соглашения с Шарлем де Голлем, но эти переговоры провалились. Сообщается, что с приближением крайнего срока давление со стороны президента Рене Коти убедило премьер-министра и его министров уйти в отставку."
 fra_crisis.14.motion_of_non_confidence_desc: "Президент Рене Коти выступил перед Национальным собранием в Париже. Он изложил затруднительное положение, в котором оказалась Республика, отметив, что Франция стоит на грани тотальной гражданской войны. Затем он призвал Ассамблею оставить в стороне разногласия и проголосовать за назначение Шарля де Голля премьер-министром. Он напомнил представителям, что именно де Голль восстановил свободу в самый темный час французской истории. Затем де Голль и Коти пришли к соглашению, что будет разработана новая конституция с мощной исполнительной властью и что де Голль получит чрезвычайные полномочия на следующие шесть месяцев. В ближайшие дни Национальное собрание проголосует за утверждение Шарля де Голля и его кабинета. Президент Коти заявил, что уйдет в отставку, если де Голль не будет утвержден"
 fra_crisis.141.motion_of_non_confidence_desc: "Французские военные в Алжире, возглавляемые генералом Раулем Саланом, недавно начали переворот во Французской Северной Африке, требуя, чтобы Шарль де Голль возглавил Францию. Эта акция была вызвана растущим недовольством нестабильной политической обстановкой в Париже и опасениями, что нынешнее правительство планирует договориться о прекращении французского правления в Алжире. Напряженность усилилась после того, как хунта в ходе бескровной десантной операции захватила Корсику. После этого они установили крайний срок для назначения де Голля. Со своей стороны, Шарль де Голль просто заявил, что если он нужен нации, то он готов действовать. По мере приближения срока президент Рене Корти решил назначить де Голля, пригрозив уйти в отставку, если Национальное собрание не одобрит его кандидатуру. Впоследствии Шарль де Голль был избран, получив мандат на контроль за новой конституцией и шесть месяцев чрезвычайных полномочий для реформирования и восстановления национальных институтов."
 fra_crisis.15.motion_of_non_confidence_desc: "Первая фаза операции Воскресение увенчалась большим успехом. Нашим десантникам удалось успешно высадиться и захватить Корсику без помех и сопротивления. Многие военные на материке поддерживают это дело, они твердо убеждены в сохранении Французского Алжира, поддерживают национализм и сильную армию. Если правительство откажется выполнить наше требование о передаче власти Шарлю де Голлю или если де Голль попросит о помощи, мы начнем вторую фазу операции "Воскресение". Имея сочувствующие военные части в Париже, мы можем направить более тысячи десантников для захвата столицы и пленения правительства."
 fra_crisis.17.motion_of_non_confidence_desc: "Высшие лидеры Алжирской хунты были арестованы после успешных переговоров президента. После прихода к власти нового, более стабильного правительства появилась информация о том, что высшие военные командиры в Алжире планировали совершить переворот и потребовать возвращения к власти Шарля де Голля. Однако, имея компромиссное и стабильное правительство в Париже, лидеры переворота не имели никаких оснований или волнений для оправдания своих действий. Это привело к панике и предательству, что позволило лояльным военным подразделениям арестовать лидеров переворота. Теперь для нового правительства открыт путь к переговорам с FLN о возможном прекращении колониального правления в Алжире."
 fra_crisis.171.motion_of_non_confidence_desc: "В Алжире были задержаны несколько высокопоставленных французских командиров в Алжире. Французские власти утверждают, что офицеры были вовлечены в националистический заговор с целью использования военной силы и свержения гражданского правления. Президент Франции недавно способствовал заключению соглашения о создании более стабильного правительства с сильным мандатом. Этот новый режим разоблачил участников переворота, поскольку заговорщики не могли найти оправдания своим действиям. Это привело к панике и предательству, что позволило лояльным военным подразделениям арестовать лидеров переворота. Теперь для нового правительства открыт путь к переговорам с FLN о возможном прекращении колониального правления в Алжире"
  
 fra_army.1.desc: "Франция обратилась к Соединенным Штатам с просьбой предоставить больше военной поддержки в рамках Программы взаимной помощи (ПВП). ПВП является частью Закона о взаимной оборонной помощи и позволяет Соединенным Штатам предоставлять военное оборудование иностранным партнерам для поддержки американских интересов. Предоставленное военное оборудование не требует возврата. Этот закон стал краеугольным камнем американских усилий по сдерживанию коммунистической агрессии во всем мире. Французские власти утверждают, что им необходима дополнительная поддержка со стороны ПВП для укрепления своей обороны перед лицом растущих коммунистических угроз."
 fra_army.2.desc: "Соединенные Штаты приняли нашу просьбу об увеличении финансирования Программы взаимопомощи (ПВП) для нас. Они признают жизненно важную роль, которую играет Франция в защите демократии и Европы от дестабилизирующих сил. Наши военные и представители оборонного ведомства будут рады этой новости, поскольку Франция отчаянно нуждается в военной поддержке для решения текущих задач и выполнения обязательств. Структура ПВП позволяет Соединенным Штатам предоставлять военное оборудование союзникам, не требуя оплаты этого оружия. Это важнейший инструмент для сотрудничества, а также для сдерживания распространения коммунизма в глобальном масштабе."
 fra_army.3.desc: "Военно-морские силы Франции приняли в эксплуатацию новый авианосец из США. Корабль поступил в рамках программы взаимопомощи. Соединенные Штаты высоко оценили передачу, заявив, что новый военный корабль укрепит французские ВМС в их обязательствах перед НАТО и в борьбе с коммунизмом в глобальном масштабе. Правительство Франции опубликовало собственное заявление, в котором приветствовало новый корабль и высоко оценило сохраняющиеся глубокие связи между Францией и США. Французские военно-морские чиновники заявляют, что корабль готов к немедленным действиям на службе Франции."
 fra_army.4.desc: "Соединенные Штаты одобрили наш запрос на авианосец. Наши военно-морские силы отчаянно нуждаются в таком военном корабле для поддержания нашего авторитета и международных обязательств. Американский авианосец поможет удовлетворить наши потребности. Вскоре ВМС направят личный состав для прохождения обучения на судне, и когда они будут готовы, корабль будет введен в состав ВМС". Это соглашение в конечном итоге подчеркивает, насколько глубока связь между Францией и Соединенными Штатами"
 fra_army.5.desc: "ВМС Франции приняли в свой состав несколько новых эсминцев из США. Корабли поступили в рамках Программы взаимной помощи. Соединенные Штаты высоко оценили передачу, заявив, что новые военные корабли укрепят французские ВМС в их обязательствах перед НАТО и в борьбе с коммунизмом во всем мире. Правительство Франции опубликовало собственное заявление, в котором приветствовало новый корабль и высоко оценило сохраняющиеся глубокие связи между Францией и США. Французские военно-морские чиновники заявляют, что корабль готов к немедленным действиям на службе Франции."
 fra_army.6.desc: "Соединенные Штаты одобрили наш запрос на новые эсминцы. Наши военно-морские силы отчаянно нуждаются в таких боевых кораблях для поддержания нашего авторитета и международных обязательств. Американские эсминцы помогут удовлетворить наши потребности. Вскоре в ВМС направят личный состав для прохождения обучения на корабле, и когда они будут готовы, корабль будет введен в состав ВМС. Это соглашение в конечном итоге подчеркивает, насколько глубока связь между Францией и Соединенными Штатами"
 French_Communism.1.d: "Стало ясно, что коммунисты победили на недавних выборах в законодательное собрание. Это вызвало серьезный политический кризис, поскольку президент Венсан Ориоль объявил о своей отставке. Он отказался назначить коммунистического премьер-министра. Гастон Моннервиль занял пост президента, пообещав провести новые выборы. Последние события возмутили коммунистических активистов и политических лидеров, которые считают, что воля народа подавляется. Президент Моннервиль настаивает, что будет уважать ту партию, которая добьется успеха на выборах."
 French_Communism.2.d: "Французская коммунистическая партия PCF выступила с призывом о поддержке со стороны Советского Союза. Лидеры французских коммунистов считают, что правительство и военные активно сопротивляются воле французского народа. Это ответ на решение нового президента Гастона Моннервиля провести новые выборы. Это решение было принято после того, как его предшественник подал в отставку, отказавшись назначить коммунистического премьер-министра. Другие французские политические партии осуждают решение PCF, утверждая, что партия должна действовать и доверять Французской Республике. Высокопоставленный чиновник по вопросам обороны в частном порядке заявил представителям СМИ, что нация будет находиться под угрозой советского вмешательства."
 French_Communism.3.d: "Коммунистическая партия PCF едва получила большинство в результате новых выборов в законодательные органы. Получив большинство, президент Франции Гастон Моннервиль послушно выполнил свою функцию, позволив лидеру PCF Морису Торезу возглавить правительство. Хотя многие во Франции публично восхваляют передачу власти как свидетельство того, что Республика остается сильной, есть опасения, что Торез может попытаться преобразовать систему. С другой стороны, сторонники PCF опасаются, что некоторые институты, особенно военные, могут попытаться свергнуть Республику и нацелиться на PCF. Напряженность усиливается по всей стране"
 French_Communism.4.d: "Несколько высокопоставленных французских военных в частном порядке обратились к нам. Они хотели бы, чтобы Соединенные Штаты тайно предоставили военные материалы и поддержку в случае начала гражданской войны. Французская коммунистическая партия недавно выиграла национальные выборы и сформировала правительство. Военные опасаются, что они планируют пригласить Советский Союз ввести войска и уничтожить Французскую Республику. При нашей поддержке французские генералы считают, что смогут успешно защитить Францию в случае коммунистического переворота или советского вторжения. Многие в Пентагоне поддерживают это предложение, хотя есть и такие чиновники, которые предупреждают, что если такие поставки оружия будут обнаружены, это может значительно укрепить PCF политически."
 French_Communism.5.d: "Президент Морис Торез вызвал серьезные волнения в Национальном собрании, назначив Жака Дюкло премьер-министром. Это решение заставило оппозицию в знак протеста выйти из Национального собрания. Многие считали, что это назначение дало коммунистам слишком много силы в исполнительной власти, и следовало искать более умеренного кандидата на пост премьер-министра. В городах также прошли протесты антикоммунистических организаций, опасающихся, что PCF намерен превратить Францию в советскую республику. Президент обвинил оппозицию в игнорировании воли французского народа."
 French_Communism.6.d: "В ошеломляющей эскалации назревающего политического кризиса в Париже легендарный французский лидер Шарль де Голль выступил с речью, призывающей к отставке президента Мориса Тореза. В своем выступлении он осудил коммунизм как несовместимый с Республикой и французскими идеалами. Эти высказывания, вероятно, способствовали росту антикоммунистических настроений в стране. Резкий выпад де Голля подтверждает подозрения PCF в том, что существует обширный заговор, цель которого — дестабилизировать и отстранить их от власти. Политическая атмосфера во всей Франции остается напряженной"
 French_Communism.7.d: "По сообщениям из Алжира, в Алжире происходит крупная мобилизация военных сил. Мобилизуемые силы находятся под контролем консервативного националиста генерала Рауля Салана. Передвижения армии вызывают серьезную озабоченность, поскольку они не связаны с текущей обстановкой в области безопасности в Алжире. Президент и его высокопоставленные чиновники должны внимательно следить за ситуацией, так как это может быть первым шагом к какому-то вмешательству антикоммунистических элементов в армии."
 French_Communism.8.d: "Коммунистическое правительство Франции, возглавляемое PCF, просит нас о военной поддержке. PCF опасается, что консервативные французские военные готовы совершить переворот против правительства. Лидеры PCF считают, что даже если народ поддержит их, отсутствие военного персонала или оборудования обеспечит победу антиреволюционных сил. Защита французской революции может дать нам сильную опору в Западной Европе и Атлантике. Однако некоторые чиновники считают, что привлечение наших сил может вызвать лишь массированную реакцию НАТО и истощить ресурсы."
 French_Communism.9.d: "Советский Союз согласился предложить свою полную поддержку правительству PCF, поскольку оно сталкивается с риском восстания французской армии. Многие французские военные командиры и части настроены антикоммунистически и выступают против режима PCF. Французские коммунисты считают, что советская помощь защитит их режим от военного захвата. Для советских властей поддержка французского правительства продемонстрирует их приверженность международным партнерам и даст возможность Советам утвердиться в Западной Европе."
 French_Communism.10.d: "Соединенные Штаты недавно четко заявили, что они по-прежнему привержены поддержке "патриотических" французских сил, которые пытаются спасти свою нацию от советского марионеточного режима. Французская военная пропаганда называет советское участие доказательством того, что PCF намерен превратить Францию в российскую колонию. Советский Союз должен решить, стоит ли поддержка французского режима риска конфликта с Соединенными Штатами или затяжного конфликта в Западной Европе. Однако не меньше советских чиновников считают, что потенциальные выгоды перевешивают любые риски, связанные с американским участием."
 French_Communism.11.d: "Советский Союз отказался отступить в кризисе во Франции, заявив, что не предаст своих французских товарищей, которые являются единственными людьми, защищающими Францию от военной диктатуры. Он объявил, что советский флот отправлен для защиты французского правительства от любых незаконных иностранных или внутренних операций. Французское правительство опубликовало собственное заявление, в котором говорится, что оно будет приветствовать приглашенный им советский флот. Это событие вызывает озабоченность у Соединенных Штатов, поскольку они должны рассмотреть свои варианты. Должны ли они пойти на попятную, смирившись с коммунистическим режимом на данный момент, или же придерживаться курса и поддерживать антикоммунистические военные подразделения."
 French_Communism.12.d: "Французские и советские официальные лица ликуют по поводу сообщений о том, что Соединенные Штаты не будут активно вмешиваться в дела Франции. Американское правительство подсчитало, что риск вооруженного конфликта с Советским Союзом не стоит того, чтобы поддерживать антикоммунистические французские военные подразделения. Хотя Советы и их французские союзники будут довольны тем, что ситуация на материковой части Франции спокойна, колонии — это совсем другая история. Французские военные силы в Северной Африке, по сути, отделились от материка, и высокопоставленные генералы обещают, что французская армия однажды вернется, чтобы освободить Францию."
 French_Communism.13.d: "Советский Союз подтвердил, что не будет направлять военные силы для поддержки коммунистического правительства Франции. Хотя никаких объяснений не было дано, наблюдатели полагают, что советские лидеры решили, что будет слишком трудно подчинить антикоммунистические французские вооруженные силы, особенно если их поддержат Соединенные Штаты. В связи с ослаблением советской поддержки президент Морис Торез подал в отставку. Весьма уважаемый Гастон Моннервиль займет этот пост до проведения выборов. Это назначение, вероятно, позволит всем политическим фракциям оставаться довольными до следующих выборов. Многие во Франции будут с нетерпением ждать новых выборов, надеясь, что мир вернется в страну."
 french_elections.18.d: "Народ Франции недавно пришел на избирательные участки для участия в последних выборах в законодательное собрание. Многие надеются, что новый законодательный орган поможет вывести страну из недавних политических и международных потрясений, с которыми столкнулась страна. Однако ясно, что результатом выборов снова станет Национальное собрание, разделенное на множество партий, но какая коалиция получила большинство, неизвестно. Республиканский фронт, коалиция социалистических партий, кажется вероятным победителем, если их партии получат большинство. Если же они не получили большинства, то, скорее всего, правящую коалицию сформируют правоцентристские партии. Граждане по всей Франции ждут окончательных результатов и дальнейшей судьбы своей страны."
 fra_crisis_2_desc: "Частая политическая нестабильность в Париже и отсутствие руководства алжирской войной вызвали тревогу среди французских военных. Многие офицеры опасаются, что политики предают честь Франции и подводят нацию. Более радикально настроенные офицеры собрались в Алжире и недавно решили действовать. Вскоре до ошеломленного французского правительства дошли новости о том, что французские генералы в Алжире захватили власть у гражданских властей. Новая хунта называет себя Комитетом общественной безопасности. Они призвали к сильному руководству и возвращению французского героя Шарля де Голля. Несколько дней спустя французские войска в Алжире захватили Корсику, чтобы усилить давление на правительство. Де Голль заявил, что будет служить нации, если правительство обратится к нему. Теперь французское правительство должно решить, вернуть ли де Голля, согласиться на захват власти Комитетом общественной безопасности или предложить компромисс по Алжиру."
 fra.1.t: "Объединение Австрии"
 fra.1.d: "Народ Австрии хочет снова стать свободной и независимой страной. Она могла бы служить буферным государством между востоком и западом. Позволим ли мы это?"
 fra.1.a: "Да, конечно!"
 fra.1.b: "Нет, мы сохраним оккупацию"
 fra.2.t: "Принять КНР в ООН"
 fra.2.d: "Китайская Народная Республика хочет быть признанной в ООН. Китайская Республика стала очень слабой после гражданской войны, поэтому мы должны поддерживать более крупную и сильную нацию, которой сейчас является Китайская Народная Республика."
 fra.2.a: "Да, конечно!"
 fra.2.b: "Нет, они должны оставаться в стороне"
 fra.4.t: "Нигер просит независимости"
 fra.4.a: "Да, это будет день их независимости!"
 fra.4.b: "Нет, они все еще нуждаются в нашей защите"
 fra.11.t: "Создание Западноевропейского союза"
 algeirs.6.t: "\"Putsch des Généraux\" Судьба Жербуаза Верте"
 algeirs.6.d: "Французские правительственные власти в Париже приказали взорвать атомную бомбу Gerboise Verte в Сахаре в рамках запланированной программы испытаний. Gerboise Verte должна быть взорвана сегодня. Хотя испытание и полигон уже подготовлены в рамках национальной ядерной программы, сроки испытания были ускорены, чтобы не нарушить безопасность устройства, однако ходят слухи, что путчисты пытаются завладеть бомбой до того, как правительство взорвет ее..."
 algeirs.6.a: "Детонация бомбы прошла успешно"
 algeirs.6.b: "Бомба была захвачена до ее взрыва!"
 algeirs.4.t.his: "\"Putsch des Généraux\" Речь де Голля"
 algeirs.4.t.alt: "\"Putsch des Généraux\" Речь генерала Фора"
 algeirs.5.t.his: "\"Putsch des Généraux\" Речь Шерифа Сид Кара"
 algeirs.5.t.alt: "\"Putsch des Généraux\" Десант высаживается в Париже!"
 algeirs.5.d.his: "Today the deputy Sherif Sid Cara, himself a putschist in 1958, as chairman of the general council of Oran, published with twenty other councilors general a statement of support to the putschists. They \"greet with fervor the dawn of a definitely French Algeria, evident pledge of a real fraternity ...\", and \"... present the deeply emotional tribute of their gratitude to the French army and its leaders of which they declare themselves totally in solidarity ... \" would this affect the support to the putchists?"
 algeirs.5.d.alt: "Сегодня группа десантников высадилась в Марселе и Париже, присоединившись к генералу Фору и арестовав лидеров социалистов и коммунистов, в Алжире заместитель шерифа Сид Кара, сам путчист в 1958 году, будучи председателем генерального совета Орана, опубликовал вместе с двадцатью другими членами генерального совета заявление о поддержке путчистов. Они \ "горячо приветствуют рассвет определенно французского Алжира, очевидное обещание настоящего братства...\", и \"... представляют глубоко эмоциональную дань своей благодарности французской армии и ее лидерам, с которыми они заявляют о своей полной солидарности...". \""
 algeirs.5.a: "Путчисты уже обречены, они потеряли все опоры"
 algeirs.5.b: "Военное положение введено на материке и в многочисленных колониях"
 algeirs.4.d.his: "Ночью генерал Салан прибыл в Алжир из Испании и отказался вооружать гражданских активистов. В 8:00 вечера президент де Голль появился в своей винтажной военной форме 1940-х годов на телевидении, призывая французских военных и гражданских лиц в метрополии или в Алжире выступить против путча: Благодаря популярности недавнего изобретения, транзисторного радио, призыв де Голля услышали солдаты срочной службы, которые массово отказались следовать призыву профессиональных солдат к восстанию, а в некоторых случаях посадили в тюрьму своих офицеров. Путч встретил широкое сопротивление, в основном в форме гражданского сопротивления, включая часовую всеобщую забастовку, объявленную профсоюзами на следующий день после выступления де Голля. В самой армии многое зависело от позиции, занятой отдельными старшими офицерами. 13-я легкая пехотная дивизия, отвечавшая за стратегическую зону Sud Oranais и включавшая подразделения Иностранного легиона, последовала примеру своего командира, генерала Филиппа Жинесте, сохранив лояльность правительству в Париже. Успех мятежей до сих пор неизвестен"
 algeirs.4.d.alt: "Ночью генерал Салан прибыл в Алжир из Испании и начал вооружать гражданских активистов. В 8:00 вечера в парламенте появился генерал Жак Фор, который призвал французских военных и гражданских лиц, находящихся в метрополии или в Алжире, присоединиться к путчу: Благодаря популярности недавнего изобретения, транзисторного радио, призыв Фора был услышан солдатами срочной службы, которые массово присоединились к призыву профессиональных солдат к восстанию и в некоторых случаях посадили в тюрьму чиновников. Путч встретил широкое противодействие, в основном в виде сопротивления голлистов и коммунистов, включая часовую всеобщую забастовку, объявленную профсоюзами на следующий день после выступления Фора. В самой армии многое зависело от позиции, занятой отдельными старшими офицерами. 13-я легкая пехотная дивизия, отвечавшая за стратегическую зону Sud Oranais и включавшая подразделения Иностранного легиона, последовала примеру своего командира, генерала Филиппа Жинесте, сохранив лояльность правительству в Париже. Лоялисты все еще ждут сообщения от правительства"
 algeirs.4.a: "Солдаты срочной службы успешно отбивают путч"
 algeirs.4.b: "Путчисты захватили парламент в Париже, а десантники высадились на Корсике"
 algeirs.3.t: "\"Putsch des Généraux\" Парижский заговор"
 algeirs.3.d.alt: "Сегодня утром население Алжира проснулось от известия о том, что \"армия взяла под контроль Алжир и Сахару\". Четыре повстанческих генерала, Морис Шалле, Эдмон Жушо, Мари-Мишель Гуро и Андре Зеллер, в согласии с полковниками Годаром, Аргудом и Лашероем, арестовали генерального делегата правительства Жана Морина, министра транспорта Робера Бурона, который находился в поездке, и ряд гражданских и военных властей. Некоторые полки дезертировали и выполняли приказы лидеров повстанцев. В Париже полиция неорганизованно пыталась арестовать генерала Жака Фора, а также еще шесть офицеров и несколько гражданских лиц, вовлеченных в "Парижский заговор\" - план по вывозу переворота на материковую часть Франции. На заседании Совета министров в 17.00 правительство больше ничего не сообщило. В Алжире сохраняется чрезвычайное положение. Левые партии, профсоюзы и Лига прав человека призывают к демонстрации "оппозиции трудящихся и демократов против силового переворота в Алжире\". Судьба Жака Фора до сих пор неизвестна"
 algeirs.3.d.his: "Сегодня утром население Алжира проснулось от известия о том,\что "армия взяла под контроль Алжир и Сахару\". Три повстанческих генерала, Морис Шалле, Эдмон Жушо и Андре Зеллер, в согласии с полковниками Годаром, Аргудом и Лашероем, арестовали генерального делегата правительства Жана Морена, министра транспорта Робера Бурона, который находился в поездке, и ряд гражданских и военных властей. Некоторые полки дезертировали и выполняли приказы лидеров повстанцев. В Париже полиция неорганизованно пыталась арестовать генерала Жака Фора, а также еще шесть офицеров и некоторых гражданских лиц, участвовавших в "Парижском заговоре" - плане переноса переворота на материковую часть Франции. На заседании Совета министров в 17.00 де Голль, сохраняя спокойствие, сказал: \"Что серьезно в этом деле, господа, так это то, что оно несерьезно.\" В Алжире сохраняется чрезвычайное положение. Левые партии, профсоюзы и Лига прав человека призывают к демонстрации \ "оппозиции трудящихся и демократов против силового переворота в Алжире\". Судьба Жака Фора до сих пор неизвестна"
 algeirs.3.a: "Генерал Фор был арестован полицией"
 algeirs.3.b: "Генерал Фор не смог распространить информацию, но не был арестован"
 algeirs.3.c: "Генерал Фор успешно распространил новость, и несколько дивизий присоединились к путчу"
 algeirs.2.t: "Генералы берут под контроль Алжир!"
 algeirs.2.d: "Генералы Андре Зеллер, Эдмон Джошуа, Морис Шалле и Гуро организовали заговор против де Голля. Они привели его в исполнение сегодня ночью, и 1-й иностранный парашютный полк (REP) под командованием капитана Хели Денуа де Сен-Марк, исполняющего обязанности командира полка, за три часа захватил Алжир. В том числе генеральное правительство Алжира, мэрию, радиостанции и аэропорт Алжира. Единственной жертвой операции стал маршал Пьер Брильянт. Он был застрелен при защите радиопередатчика Оуледа Файета. Префект полиции Морис Папон и директор Управления национальной безопасности создают кризисный центр в зале Комеди Франсез, где генерал де Голль присутствует вместе с Леопольдом Седаром Сенгором на презентации "Британика". Главу государства проинформировал во время антракта Жак Фоккар, генеральный секретарь по делам Африки и Мадагаскара, его ближайший помощник. Официально де Голль был предупрежден после представления. Слухи о том, что генерал Гуро отказался от заговора, до сих пор обсуждаются. Разведка вернулась с докладом..."
 algeirs.2.a: "...генерал Гуро отступил"
 algeirs.2.b: "...Генерал Гуро захватывает контроль над Константином!"
 algeirs.1.t: "Конец Алжирского путча"
 algeirs.1.d.his: "Немногочисленные военные части, следовавшие за генералами, постепенно сдавались. Генерал Шалье сдался властям и был немедленно переведен в метрополию. Путч был успешно подавлен, но статья 16, предоставляющая де Голлю полные и чрезвычайные полномочия, будет действовать в течение пяти месяцев. \"Битва за Транзисторс\", как ее называли в прессе, была быстро и окончательно выиграна де Голлем."
 algeirs.1.d.alt: "Немногочисленные военные части, которые следовали за правительством, постепенно сдавались. Премьер-министр Мишель Дебре сдался путчистам и был немедленно переведен в тюрьму Клерво. Путч был успешным, но коммунистическая оппозиция и верные голлисты ушли в подполье и начали партизанскую деятельность в метрополии. Пресса была быстро закрыта, а военное положение распространено на всю Францию, судьба де Голля до сих пор неизвестна"
 algeirs.1.a: "Ce qui est grave dans cette affaire, messieurs, c'est qu'elle n'est pas sérieuse."
 algeirs.1.b: "Правительственные войска разбиты, и теперь страной будет руководить новая военная хунта"
 fra.15.d: "Сегодня умер Филипп Петен, генерал и пособник нацистов. Он умер вчера утром на острове Оль-д'Йеу в возрасте 95 лет и был похоронен на морском кладбище (Cimetière communal de Port-Joinville) рядом с тюрьмой."
 may.681.d: "Сегодня ультраправая группа Occident объявила о своем намерении провести митинг на факультете Нантерра, назначенный на 3 мая. В ответ маоистские партизаны при поддержке активистов "Антивойны" заняли факультет."
 may.682.d: "Позже сегодня состоится первое майское дефиле, созванное CGT, PCF и PSU, к сожалению, CFDT, FGDS и FEN отказались присоединиться к маршу. Примечательно, что кортеж "Движения 22 марта" вступил в столкновение с CGT"
 may.683.d: "Начались пожары в оккупированной Ла Сорбонне. Из-за слухов о том, что ультраправая группа Occident собирается напасть на маоистских повстанцев, студенты-коммунисты обратились к рабочим с просьбой помочь им построить баррикады с помощью бульдозера. Приехала полиция, чтобы арестовать студентов, Нантерр был закрыт, а премьер-министр уехал с дипломатическим визитом."
 may.684.d: "Беспорядки распространились на Латинский квартал. В них приняли участие многочисленные крайне левые организации. Окцидент пришел, чтобы удалить их, но был оттеснен. Квартал Латин превратился в поле боя между полицией и студентами-коммунистами"
 referendumfr.2.d: "Закон о связях" (Loi sur les Apparentements) был законом, принятым в 1951 году для противодействия растущим результатам голлистов и коммунистов на выборах в законодательные органы. В совокупности они составляли до 45% голосов, и оба стремились заблокировать законодательный процесс IV Республики. Против этой угрозы закон гласил, что любой список мог объединиться с другими; если общий результат объединенных списков превышал 50%, они забирали все места и распределяли их между собой. Поскольку голлисты или коммунисты не могли ни с кем соединиться, они гарантированно теряли большинство избирательных округов"
 FRAPCF.1.d: "Правительство Франции объявило, что официально признает свою историческую роль в эксплуатации и угнетении народов своих колоний в Индокитае. Однако нынешнее правительство не будет повторять ошибок прошлого и не будет увековечивать страдания, которые капитализм причиняет людям. Правительство решило, что оно будет поддерживать все освободительные движения в Индокитае и работать над тем, чтобы помочь этим группам создать независимые правительства, свободные от влияния капиталистической или имперской эксплуатации. Это заявление французского правительства было осторожно встречено во французских колониях и с энтузиазмом принято среди городских интеллектуальных слоев Франции.  Однако среди среднего класса и сельских французов это заявление было воспринято неоднозначно, так как многие в этих сообществах рассматривают Индокитай как часть французской глобальной нации и считают, что он должен оставаться французским."
 FRAPCF.2.d: "Поскольку Советский Союз все чаще демонстрирует репрессии и антидемократические тенденции, многие коммунисты в Западной Европе все больше отчуждаются от него. Кроме того, советская модель все больше кажется чуждой обществам, привыкшим к демократическим подходам. Эти тенденции, а также пересмотр марксистской теории привели к появлению еврокоммунизма. Еврокоммунизм поддерживает демократические институты и поощряет коммунистические партии к союзу с другими группами для проведения крупномасштабных социальных реформ и достижения демократического господства в обществе. Акцент на рабочем классе теперь расширился и включает в себя средний класс. Еврокоммунизм предлагает новый, демократический путь к социализму, и коммунисты, принимающие его, также отходят от Советского Союза. Советский Союз и традиционные коммунисты рассматривают еврокоммунизм как опасный, ревизионистский путь, обреченный на провал. Однако для французских коммунистов еврокоммунизм предлагает средство расширить свою базу поддержки и продемонстрировать свою независимость в рамках мирового коммунистического порядка."
 FRAPCF.3.d: "Французская коммунистическая партия после интенсивных встреч решила, что Франция примет анархизм. Анархизм будет поддерживать минимальное государство и обеспечивать всем гражданам абсолютную свободу. Вероятно, начнут возникать свободные ассоциации, и Франция вскоре станет самой свободной нацией на планете. Франция больше не будет порабощена капиталистическим порядком, поскольку ее народ больше не будет контролироваться государственными механизмами. Многие во Франции связывают этот новый поворот с продолжением анархических экспериментов в Барселоне во время гражданской войны в Испании. Хотя эти эксперименты были пресечены, их наследие продолжает жить, и теперь анархизм станет путем Франции. Соседние государства выразили тревогу и озабоченность, хотя и заявили, что подождут и посмотрят, что повлечет за собой анархизм. В столицах Европы толпы анархистов вышли на улицы, чтобы отпраздновать новости из Франции."
 PCF_ALG.1.d: "Коммунистическое правительство Франции объявило, что бессмысленное насилие, эксплуатация и страдания в Алжире закончатся. Оно решило предоставить Алжиру независимость и позволить ему управляться собственным народом. Французское правительство заявило, что именно капиталистическая система и империалистическое давление заставили Францию бороться за контроль над Алжиром. Теперь, когда это давление больше не влияет на правительство, стало ясно, что война в Алжире не служит никакой другой цели и должна быть доведена до справедливого завершения. Внутри Франции это решение имеет большую поддержку в городских районах, но в сельской местности и среди среднего класса существует чувство предательства. Для них Алжир никогда не был колонией, а продолжением родины, и они рассматривают заявление правительства как предательство не только нации, но и французского населения, которое в настоящее время живет в Алжире."
 ALG_CRACKDOWN.1.d: "Французское правительство уже заявило о своей оппозиции деколонизации в отношении Алжира. По их мнению, Алжир - это не колония, а часть французской метрополии, и ее необходимо сохранить от варварских и чуждых идеологий. В поддержку этой позиции французское правительство подтвердило, что оно одобрило новую кампанию по умиротворению Алжира. По сообщениям СМИ из Алжира, французские войска начали широкомасштабную операцию, используя агрессивную тактику поиска, тяжелое вооружение, а иногда и беспорядочную стрельбу, чтобы выкорчевать и подавить движение за независимость. Эта новая интенсивность насилия воодушевила многих во Франции, которые считают, что правительство должно сделать все необходимое для разрешения кризиса. Тем не менее, были и протесты против жестокости, а на международном уровне многие государства уже выразили свою озабоченность непропорциональным применением силы французскими военными."
 Petain.100.d: "После смерти Филиппа Петена возникли споры о том, где должен быть похоронен бывший французский генерал и президент. Петэн был одним из величайших французских генералов в Первой мировой войне, возглавляя французские войска во время битвы под Верденом. Однако его наследие стало противоречивым, когда во время Второй мировой войны он возглавил пронацистское марионеточное правительство Франции в Виши. Многие его осуждают, но многие ветераны и националисты во Франции его почитают. После войны он был осужден за государственную измену и провел остаток жизни в тюремной камере на острове Иль-д'Йеу. После его смерти планировалось похоронить его на Иль-д'Йеу, но многие французские националисты потребовали, чтобы он был похоронен в некрополе Дуомон вместе с французскими могилами из Вердена. Французское правительство должно решить, похоронить ли его на Иль-д'Йеу или умиротворить националистов и похоронить его в Вердене."
 AJAX.20.d: "Неожиданное возвращение шаха было с одобрением встречено иранским народом. В это трудное время им нужна скала, на которой можно держаться, и этой скалой вполне может быть наследник 2500-летней династии!"
